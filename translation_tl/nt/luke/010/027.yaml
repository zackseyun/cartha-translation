reference: Luke 10:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ⸂ἐν ὅλῃ τῇ ψυχῇ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ ἰσχύϊ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ διανοίᾳ⸃ σου, καὶ τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/027.yaml
  text: And he answered, “You shall love the Lord your God from all your heart and with all your soul and with all your strength and with all your mind, and your neighbor as yourself.”
translation:
  language: tl
  text: Sumagot siya, “Ibigin mo ang Panginoon mong Diyos nang buong puso mo[a], nang buong kaluluwa mo, nang buong lakas mo, at nang buong isip mo; at ibigin mo ang iyong kapwa gaya ng iyong sarili.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “mula sa buong puso mo” (ἐξ ὅλης τῆς καρδίας σου) ang anyo rito, samantalang ibang pang-ukol ang ginamit sa tatlong kasunod na parirala. Isinalin itong “nang buong puso mo” para sa likas na Filipino.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Sumagot siya
  rationale: Likas at maikli itong salin ng karaniwang Griyegong konstruksiyong participle + finite verb, nang walang pagkawala ng kahulugan.
- source_word: Ἀγαπήσεις
  choice: Ibigin mo
  rationale: Bagaman future indicative ang anyo, gumaganap ito bilang utos sa sipi mula sa Kasulatan. Ang imperatibong Filipino ang pinakanatural na paraan upang mapanatili ang puwersa nito.
- source_word: κύριον τὸν θεόν σου
  choice: ang Panginoon mong Diyos
  rationale: Pinananatili ang banal na titulong κύριος bilang “Panginoon” at ang θεός bilang “Diyos,” sa natural na ayos ng modernong Filipino.
- source_word: ἐξ ὅλης τῆς καρδίας σου
  choice: nang buong puso mo
  rationale: Sa Filipino, ang “nang buong puso” ay natural na nagpapahayag ng pinagmumulan at ganap na saklaw ng pag-ibig. Hindi natural ang literal na “mula sa buong puso” sa seryeng ito, kaya itinatala sa talababa ang natatanging ἐξ.
- source_word: ἐν ὅλῃ τῇ ψυχῇ σου
  choice: nang buong kaluluwa mo
  rationale: Pinananatili ang hiwalay na terminong ψυχή bilang “kaluluwa” nang hindi ito ginagawang teknikal na pahayag tungkol sa antropolohiya.
- source_word: ἐν ὅλῃ τῇ ἰσχύϊ σου
  choice: nang buong lakas mo
  rationale: Direkta, malinaw, at kasalukuyang katumbas ng ἰσχύς.
- source_word: ἐν ὅλῃ τῇ διανοίᾳ σου
  choice: nang buong pag-iisip mo
  rationale: Ang “pag-iisip” ay natural na Filipino para sa διάνοια bilang isip o kakayahang umunawa.
- source_word: τὸν πλησίον σου
  choice: ang iyong kapwa
  rationale: Ang “kapwa” ang nakaugaliang etikal at relasyonal na katumbas ng πλησίον sa Filipino.
- source_word: ὡς σεαυτόν
  choice: gaya ng iyong sarili
  rationale: Pinananatili ang paghahambing ng ὡς sa malinaw at natural na Filipino.
theological_decisions:
- issue: Ang banal na titulong κύριος sa siping tumutukoy sa Diyos ng Israel
  choice: Panginoon
  alternative: Amo
  rationale: Ang “Panginoon” ang angkop na banal na titulo at pinananatili nito ang bigat at ugnayang pangkasulatan ng sipi.
- issue: Ang apat na magkakapatong na katawagang καρδία, ψυχή, ἰσχύς, at διάνοια
  choice: Panatilihin bilang puso, kaluluwa, lakas, at pag-iisip
  alternative: Pagsamahin bilang “buong pagkatao”
  rationale: Pinananatili ng magkakahiwalay na termino ang retorikal na kabuuan ng ganap na pag-ibig sa Diyos nang hindi nagpapataw ng mahigpit na paghahati sa pagkatao o pinapadapa ang teksto sa isang paraphrase.
- issue: Ang puwersa ng future indicative na Ἀγαπήσεις sa utos na sinipi
  choice: Ibigin mo
  alternative: Iibigin mo
  rationale: Sa modernong Filipino, mas malinaw na naihahatid ng imperatibo ang tungkulin ng anyong Griyego bilang utos; ang literal na future ay madaling mabasa bilang simpleng prediksiyon.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “ibigin” upang mapanatili ang kataimtiman ng utos, ngunit iniwasan ang lipas o masalimuot na balangkas. Ang semicolon bago ang utos tungkol sa kapwa ay nagpapalinaw sa dalawang magkaugnay na utos.
