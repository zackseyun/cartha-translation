id: LUK.10.23
reference: Luke 10:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ στραφεὶς πρὸς τοὺς μαθητὰς κατ’ ἰδίαν εἶπεν· Μακάριοι οἱ ὀφθαλμοὶ οἱ βλέποντες ἃ βλέπετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/023.yaml
  text: And turning to the disciples privately[a], he said, “Blessed are the eyes that see what you see.”
translation:
  language: tl
  text: At bumaling siya sa mga alagad at sinabi nang sarilinan[a], “Mapalad ang mga matang nakakakita ng nakikita ninyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nang hiwalay sa iba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: bumaling
  rationale: Likas na Filipino para sa aorist participle na nagsasaad ng pagkilos ni Jesus habang ibinabaling niya ang pansin sa mga alagad bago magsalita.
- source_word: κατ’ ἰδίαν
  choice: nang sarilinan
  rationale: Ipinahihiwatig ng idyoma na ang sinabi ay para sa mga alagad nang bukod sa iba; malinaw at likas ito sa modernong Filipino.
- source_word: μαθητάς
  choice: mga alagad
  rationale: Karaniwang salin sa Bagong Tipan na nagpapanatili sa diwa ng mga tagasunod na tinuturuan.
- source_word: Μακάριοι
  choice: Mapalad
  rationale: Ang “Mapalad” ay angkop sa anyo ng isang pagpapahayag ng pagpapala at hindi lamang tumutukoy sa pansariling damdamin ng kasiyahan.
- source_word: ὀφθαλμοὶ
  choice: mga mata
  rationale: Pinananatili ang tahasang larawan at metonimiya ng Griyego sa halip na palawakin ito bilang “mga taong nakakakita.”
- source_word: οἱ βλέποντες
  choice: nakakakita
  rationale: Natural na inilalarawan sa Filipino ang mga mata bilang may pribilehiyong makakita, habang pinananatili ang aspektong kasalukuyan ng participle.
- source_word: ἃ βλέπετε
  choice: ng nakikita ninyo
  rationale: Direkta at natural na katumbas ng relative pronoun at present verb, nang walang idinagdag na paliwanag tungkol sa bagay na nakikita.
theological_decisions:
- issue: Lakas ng pagpapahayag na Μακάριοι
  choice: Isang pagpapahayag na mapalad ang mga alagad dahil sa pribilehiyo ng kanilang nakikita
  alternative: Isang pahayag lamang na masaya sila
  rationale: Sa kontekstong ito, ang Μακάριοι ay may anyong pagpapala at higit sa pansariling emosyon. Pinananatili ng “Mapalad” ang bigat nito nang hindi tinutukoy nang higit sa sinasabi ng talata.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Pinanatili ang metonimiyang “mga mata” at ang pag-uulit ng “nakakakita/nakikita” upang sundan ang diin ng Griyego.
