  text: Which of these three seems to you to have become a neighbor to the man who fell among the robbers?[a]
translation:
  language: tl
  text: “Sino sa tatlong ito ang sa palagay mo ay naging kapwa ng taong napasakamay ng mga tulisan?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Sino sa tatlong ito ang sa tingin mo ay kumilos bilang kapwa sa taong napasakamay ng mga tulisan?” Mas literal sa Griyego ang “naging kapwa,” na nagtatampok sa aktuwal na pagiging kapwa sa pamamagitan ng pagkilos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: Sino
  rationale: Bagaman pumipili mula sa isang tiyak na pangkat, “sino” ang likas na tanong sa Filipino kapag tao ang tinutukoy.
- source_word: τούτων τῶν τριῶν
  choice: sa tatlong ito
  rationale: Tuwirang ipinahahayag ang partitive na diwa nang hindi idinaragdag ang salitang “lalaki,” na wala sa Griyego.
- source_word: πλησίον
  choice: kapwa
  rationale: Sa kontekstong ito, ang salita ay tumutukoy sa taong kumikilos bilang kapwa, hindi lamang sa isang taong malapit sa kinaroroonan.
- source_word: δοκεῖ σοι
  choice: sa palagay mo
  rationale: Likas na katumbas sa Filipino na pinananatili ang tahasang paghingi sa pananaw ng kausap.
- source_word: γεγονέναι
  choice: ay naging
  rationale: Pinananatili ang diwa ng perfect infinitive ng γίνομαι—ang pagiging o pagkilos bilang kapwa—sa halip na gawing payak at estatiko na “kapwa.”
- source_word: τοῦ ἐμπεσόντος εἰς τοὺς λῃστάς
  choice: ng taong napasakamay ng mga tulisan
  rationale: Natural na Filipino para sa idyomang Griyego na literal na tumutukoy sa pagkahulog o pagkapasok sa gitna o kapangyarihan ng mga tulisan.
theological_decisions:
- issue: Etikal na diin ng tanong sa talinghaga ng mabuting Samaritano
  choice: Panatilihin ang “naging kapwa” upang idiin ang aktuwal na pagkilos bilang kapwa.
  alternative: Isalin nang mas estatiko bilang “siyang kapwa” o mas interpretibo bilang “nagpakita ng malasakit.”
  rationale: Binabago ng γίνομαι ang pokus mula sa pagtukoy kung sino ang kapwa tungo sa taong naging kapwa sa pamamagitan ng ginawa niya. Pinananatili nito ang tensiyon at puwersa ng tanong nang hindi nagdaragdag ng tiyak na interpretasyong teolohikal.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “tulisan” bilang malinaw at karaniwang katawagan sa mga armadong mandarambong, at pinanatili ang mahalagang diwa ng “naging kapwa.”
