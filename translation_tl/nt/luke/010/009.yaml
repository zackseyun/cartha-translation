id: LUK.10.9
reference: Luke 10:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ θεραπεύετε τοὺς ἐν αὐτῇ ἀσθενεῖς, καὶ λέγετε αὐτοῖς· Ἤγγικεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/009.yaml
  text: And heal the sick in it[a], and say to them, ‘The kingdom of God has come near to you.’
translation:
  language: tl
  text: Pagalingin ninyo ang mga maysakit doon, at sabihin ninyo sa kanila, “Lumapit na sa inyo ang kaharian ng Diyos.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Malapit na sa inyo ang kaharian ng Diyos.”
    reason: Nagbibigay ng natural na alternatibong nagsasaad ng kasalukuyang kalapitan, bagaman hindi nito kasinglinaw na naipakikita ang kilos na ipinahahayag ng ganap na panahunan ng ἤγγικεν.
lexical_decisions:
- source_word: θεραπεύετε
  choice: Pagalingin ninyo
  rationale: Tuwirang ipinahahayag ang utos na magpagaling at likas itong pakinggan sa makabagong Filipino. Sa konteksto, pisikal na karamdaman ang pangunahing tinutukoy.
- source_word: τοὺς ἐν αὐτῇ ἀσθενεῖς
  choice: ang mga maysakit doon
  rationale: Ang ἀσθενεῖς ay maaaring mangahulugang mahihina o maysakit, ngunit dahil kasama ito ng θεραπεύετε, malinaw na sakit ang pangunahing diwa. Ang “doon” ay natural na tumutukoy sa bayang binanggit sa naunang talata.
- source_word: λέγετε αὐτοῖς
  choice: sabihin ninyo sa kanila
  rationale: Pinananatili ang payak at tuwirang utos ng Griyego nang hindi dinaragdagan ang kahulugan.
- source_word: Ἤγγικεν
  choice: Lumapit na
  rationale: Ipinahihiwatig ng ganap na panahunan sa Griyego ang paglapit na nangyari na at may kasalukuyang kabuluhan. Naipahahayag ito ng “lumapit na” nang hindi sinasabing lubos nang natupad ang kaharian.
- source_word: ἐφ’ ὑμᾶς
  choice: sa inyo
  rationale: Natural na ipinahahayag sa Filipino ang paglapit o pagdating kaugnay ng mga nakikinig; iniiwasan nito ang matigas na literalismong “sa ibabaw ninyo.”
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Ito ang nakagawian, malinaw, at malawak na katumbas sa Filipino. Pinananatili nito ang saklaw ng βασιλεία nang hindi ito nililimitahan sa konsepto lamang ng paghahari.
theological_decisions:
- issue: Kahulugan ng pagpapahayag tungkol sa kaharian
  choice: Ipinahahayag na lumapit na sa mga nakikinig ang kaharian ng Diyos, na may kasalukuyang kabuluhan.
  alternative: Ganap nang narito ang kaharian, o malapit pa lamang itong dumating sa hinaharap.
  rationale: Ang Ἤγγικεν ay nagsasaad ng paglapit na may nananatiling bunga, ngunit hindi nilulutas ng talata kung hanggang saan narito na ang kaharian at kung ano pa ang naghihintay ng katuparan. Pinananatili ng salin ang tensiyong ito.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Ginamit ang “doon” bilang likas na pagtukoy sa bayang nasa naunang konteksto, at pinanatili ang kilalang pariralang “kaharian ng Diyos.”
