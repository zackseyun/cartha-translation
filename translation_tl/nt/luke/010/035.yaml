  to: Kinabukasan, naglabas siya ng dalawang denario[a] at ibinigay ang mga ito sa tagapangasiwa ng bahay-panuluyan. Sinabi niya, ‘Alagaan mo siya, at anumang karagdagan pang magagastos mo ay babayaran ko sa iyo sa pagbabalik ko.’
