base_translation:
  language: en
  yaml_path: translation/nt/luke/010/035.yaml
  text: And on the next day[a], taking out two denarii, he gave them to the innkeeper and said, ‘Take care of him, and whatever more you spend, I will repay you when I return.’
translation:
  language: tl
  text: Kinabukasan, naglabas siya ng dalawang denario[a] at ibinigay ang mga ito sa tagapangasiwa ng bahay-panuluyan. Sinabi niya, ‘Alagaan mo siya, at anumang karagdagan pang magagastos mo ay babayaran ko sa iyo sa pagbabalik ko.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang denario ay karaniwang baryang pilak ng Roma, na halos katumbas ng sahod ng isang manggagawa sa isang araw.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ τὴν αὔριον
  choice: Kinabukasan
  rationale: Likas at malinaw na modernong Tagalog para sa idyomatikong panahong tumutukoy sa sumunod na araw.
- source_word: ἐκβαλών
  choice: kumuha siya
  rationale: Sa konteksto, tumutukoy ito sa pagkuha o paglabas ng salapi mula sa sariling pag-aari, hindi sa literal na paghahagis.
- source_word: δύο δηνάρια
  choice: dalawang denario
  rationale: Pinananatili ang makasaysayang pangalan ng baryang Romano sa halip na palitan ito ng tantiyang katumbas na sahod.
- source_word: πανδοχεῖ
  choice: tagapangasiwa ng bahay-panuluyan
  rationale: Tumpak na tumutukoy sa taong nangangasiwa sa tuluyan at madaling maunawaan sa modernong Tagalog.
- source_word: Ἐπιμελήθητι αὐτοῦ
  choice: Alagaan mo siya
  rationale: Natural na pautos na nagpapahayag ng patuloy at maingat na pagkalinga.
- source_word: ὅ τι ἂν προσδαπανήσῃς
  choice: Anumang karagdagang gastos mo
  rationale: Pinananatili ang di-tiyak na halaga at ang diwa ng paggastos nang higit pa sa naibigay na.
- source_word: ἐν τῷ ἐπανέρχεσθαί με
  choice: sa pagbabalik ko
  rationale: Maikli at natural na salin ng temporal na konstruksyon.
- source_word: ἀποδώσω σοι
  choice: babayaran ko
  rationale: Malinaw na ipinahihiwatig ang pagbabayad sa halagang inilabas ng tagapangasiwa; natural ito sa kontekstong pinansyal.
