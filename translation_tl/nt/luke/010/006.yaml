source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸂ᾖ ἐκεῖ⸃ υἱὸς εἰρήνης, ἐπαναπαήσεται ἐπ’ αὐτὸν ἡ εἰρήνη ὑμῶν· εἰ δὲ μήγε, ἐφ’ ὑμᾶς ἀνακάμψει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/006.yaml
  text: And if a son of peace is there[a], your peace will rest upon him; but if not, it will return to you.
translation:
  language: tl
  text: At kung may naroroon na isang anak ng kapayapaan[a], mananatili sa kanya ang kapayapaan ninyo; ngunit kung hindi, babalik ito sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang taong bukás sa kapayapaan”—ibig sabihin, isang taong tumatanggap sa mensaheng nagdadala ng kapayapaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱὸς εἰρήνης
  choice: isang anak ng kapayapaan
  rationale: Pinananatili nito ang Semitikong idyoma at ang panlalaking anyong isahan ng Griyego. Tumutukoy ito sa isang taong kinikilala sa kapayapaan o tumatanggap sa mensaheng may dalang kapayapaan; nililinaw sa talababa ang mas likas na pagpapahayag sa Tagalog.
- source_word: ἐπαναπαήσεται
  choice: mananatili sa kanya
  rationale: Ipinahahayag nito ang paglagak o pamamalagi ng kapayapaan sa tumatanggap, sa likas at malinaw na Tagalog.
- source_word: ἡ εἰρήνη ὑμῶν
  choice: ang kapayapaan ninyo
  rationale: Pinananatili ang tuwirang pagmamay-ari sa Griyego at hindi nililimitahan ang kahulugan sa isang karaniwang pagbati lamang.
- source_word: μήγε
  choice: kung wala
  rationale: 'Sa konteksto, likas nitong ipinahahayag ang pinatibay na salungat na kondisyon: kung walang gayong tao roon.'
- source_word: ἀνακάμψει
  choice: babalik
  rationale: Tuwirang inilalarawan ang kapayapaang hindi nakatagpo ng mapagpapahingahan at kaya bumabalik.
- source_word: ἐφ’ ὑμᾶς
  choice: sa inyo
  rationale: Ito ang likas na Tagalog na katuwang ng pandiwang “babalik,” habang pinananatili ang kahulugan ng pagbabalik sa mga nagsugo ng kapayapaan.
- source_word: καὶ ἐὰν ᾖ ἐκεῖ
  choice: At kung naroon
  rationale: Pinananatili ang pang-ugnay na καί, ang kondisyon, at ang diin sa pook na ipinahahayag ng ἐκεῖ.
theological_decisions:
- issue: Kung gagawing neutral sa kasarian ang idyomang υἱὸς εἰρήνης
  choice: Panatilihin sa pangunahing teksto ang “anak ng kapayapaan”
  alternative: taong may kapayapaan; taong tumatanggap sa kapayapaan
  rationale: Ang Griyego ay panlalaking isahan at gumagamit ng isang Semitikong idyoma. Pinananatili ng salin ang anyo at kulay ng pinagmulan nang hindi ipinapalagay na likas lamang na mapayapa ang tao; inilalahad sa talababa ang mas idyomatikong kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang bahagyang di-pangkaraniwang idyomang “anak ng kapayapaan” upang maingatan ang tekstura at ambiguwidad ng Griyego, habang ipinaliliwanag ito sa talababa.
