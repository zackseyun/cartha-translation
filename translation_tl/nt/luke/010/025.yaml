source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ νομικός τις ἀνέστη ἐκπειράζων ⸀αὐτὸν λέγων· Διδάσκαλε, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/025.yaml
  text: And behold[a], a lawyer stood up, testing him, saying, “Teacher, what must I do to inherit eternal life?”
translation:
  language: tl
  text: At masdan, tumayo ang isang dalubhasa sa Kautusan[a] upang subukin siya. Sinabi niya, “Guro, ano ang dapat kong gawin upang magmana ng buhay na walang hanggan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay tumutukoy sa isang taong dalubhasa sa Kautusan ni Moises.
    reason: lexical_clarification
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: At masdan
  rationale: Pinananatili ang panandang diskurso at pantawag-pansing lakas ng ἰδού sa isang dignidad ngunit nauunawaang anyo.
- source_word: νομικός τις
  choice: isang dalubhasa sa Kautusan
  rationale: Tumutukoy sa isang taong bihasa sa Kautusan ni Moises, hindi sa makabagong abogadong humahawak ng sekular na batas.
- source_word: ἀνέστη
  choice: tumayo
  rationale: Tuwirang salin ng kilos at natural sa tagpong pasalaysay.
- source_word: ἐκπειράζων αὐτὸν
  choice: upang subukin siya
  rationale: Ipinahahayag ang layuning subukan o ilagay si Jesus sa pagsubok nang hindi ipinapalagay na ito ay pang-aakit na magkasala.
- source_word: λέγων
  choice: Sinabi nito
  rationale: Ginawang hiwalay na pangungusap ang participle upang maging natural at malinaw sa modernong Tagalog.
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Karaniwan, malinaw, at angkop na katumbas sa kasalukuyang Tagalog.
- source_word: τί ποιήσας
  choice: ano ang dapat kong gawin
  rationale: Likas na ipinapahayag sa Tagalog ang praktikal na diwa ng participle bilang kinakailangang gawin, nang hindi dinaragdagan ang teolohikal na pahayag.
- source_word: ζωὴν αἰώνιον
  choice: buhay na walang hanggan
  rationale: Pamantayan at malinaw na salin na angkop sa konteksto.
- source_word: κληρονομήσω
  choice: magmana
  rationale: Pinananatili ang mahalagang metapora ng pagtanggap ng mana sa halip na gawing payak na 'matamo' o 'makamit.'
theological_decisions:
- issue: Kahulugan ng νομικός sa kontekstong Judio
  choice: dalubhasa sa Kautusan
  alternative: abogado
  rationale: Nililinaw ng salin na ang tauhan ay bihasa sa Torah o Kautusan ni Moises at iniiwasan ang maling impresyon ng isang makabagong sekular na abogado.
- issue: Lakas ng τί ποιήσας ... κληρονομήσω
  choice: ano ang dapat kong gawin upang magmana
  alternative: ano ang gagawin ko para magmana
  rationale: Pinananatili ang pagkakabalangkas ng tanong ng lalaki sa kung ano ang gagawin niya, pati ang tensiyon nito sa metapora ng pamana, nang hindi nilulutas o pinapaliwanag sa salin ang teolohikal na usapin.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang malaking titik sa “Kautusan” upang tukuyin ang Kautusan ni Moises. Ang “masdan” ay bahagyang pormal ngunit angkop upang mapanatili ang pantawag-pansing ἰδού.
