review_pass:
  verdict: revise
  source_fidelity: Tumpak na naisasalin ang patuloy na pagkagambala ni Marta, ang maraming gawaing paglilingkod, ang paglapit niya, ang magalang na pagtawag na «Panginoon,» at ang kahilingang utusan ang kapatid na tumulong. Gayunman, ang «iniwan ako ng kapatid kong mag-isang magsilbi» ay maaaring basahing ang kapatid ang «mag-isang magsilbi,» samantalang malinaw sa Griyego na si Marta ang naiwang mag-isang naglilingkod.
  naturalness: Natural at angkop ang pangkalahatang rehistro. Ang pagdaragdag ng «babae» sa «kapatid kong babae» at ang pagsasaayos ng sugnay na «mag-isa akong magsilbi» ay magpapalinaw sa tinutukoy nang hindi magiging di-natural.
  terminology: Ang «Marta,» «Panginoon,» at «pagsisilbi» ay angkop. Ang «wala ka bang pakialam» ay isang makatwirang masidhing Filipino para sa reklamong οὐ μέλει σοι; ang alternatibong talababa ay dapat lamang gawing ganap na pangungusap upang malinaw ang saklaw nito.
  issues:
  - severity: medium
    issue: Malabo ang tagaganap ng «mag-isang magsilbi.»
    rationale: Sa kasalukuyang ayos, maaaring iugnay ang «mag-isang magsilbi» sa «kapatid kong» dahil magkatabi ang mga ito. Ang μόνην με ... διακονεῖν ay nagsasabing si Marta ang naiwang mag-isang maglingkod.
  - severity: low
    issue: Putol ang alternatibong salin sa talababa.
    rationale: Ang «hindi ba mahalaga sa iyo» ay hindi kumpletong alternatibong pagbasa sa tanong kung hindi isinasama ang kasunod na sugnay na ὅτι.
