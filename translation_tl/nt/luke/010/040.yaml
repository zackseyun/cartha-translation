  text: ἡ δὲ Μάρθα περιεσπᾶτο περὶ πολλὴν διακονίαν· ἐπιστᾶσα δὲ εἶπεν· Κύριε, οὐ μέλει σοι ὅτι ἡ ἀδελφή μου μόνην με ⸀κατέλειπεν διακονεῖν; ⸀εἰπὲ οὖν αὐτῇ ἵνα μοι συναντιλάβηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/040.yaml
  text: But Martha was distracted with much serving. And she came up and said[a], “Lord, does it not matter to you that my sister has left me to serve alone? Tell her, then, to help me.”
translation:
  language: tl
  text: Ngunit nahahati ang pansin ni Marta dahil sa dami ng kanyang pagsisilbi. Lumapit siya at sinabi, “Panginoon, wala ka bang pakialam[a] na iniwan ako ng kapatid kong babae upang mag-isa akong magsilbi? Kaya sabihin mo sa kaniya na tulungan ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi ba mahalaga sa iyo na iniwan ako ng kapatid kong babae upang mag-isa akong magsilbi?”
    reason: Maaaring ipahayag ng οὐ μέλει σοι ang pagkabahala o pagmamalasakit (“wala ka bang pakialam”) o, sa bahagyang mas mahinang paraan, kung mahalaga ba sa kausap ang nangyayari.
lexical_decisions:
- source_word: περιεσπᾶτο
  choice: nahahati ang pansin
  rationale: Ipinahahayag ng imperpektong anyong middle/passive ang patuloy na pagkagambala o pagkakahila ng pansin. Likas sa modernong Filipino ang “nahahati ang pansin” at malinaw nitong naipakikita ang kaibahan sa pakikinig ni Maria nang hindi ipinapalagay na simpleng pagiging abala lamang ito.
- source_word: περὶ πολλὴν διακονίαν
  choice: dahil sa dami ng kanyang pagsisilbi
  rationale: Ang διακονία rito ay praktikal na pagsisilbi sa tahanan, hindi isang pormal na ministeryo. Pinananatili ng salin ang lawak ng “pagsisilbi” at hindi ito nililimitahan sa paghahanda lamang ng pagkain.
- source_word: ἐπιστᾶσα
  choice: lumapit siya
  rationale: Ipinahihiwatig ng participle na lumapit o pumuwesto si Marta bago nagsalita. Ang “lumapit siya” ay malinaw at natural sa Filipino.
- source_word: Κύριε
  choice: Panginoon
  rationale: Karaniwang salin ito ng κύριος bilang magalang at makahulugang pagtawag kay Jesus, at naaayon sa mas malawak na gamit ni Lucas.
- source_word: οὐ μέλει σοι
  choice: wala ka bang pakialam
  rationale: Ang idyoma ay nagtatanong kung ang pangyayari ay pinagmamalasakitan o binibigyang-pansin. Natural at tuwiran sa Filipino ang saling ito; inilalagay sa talababa ang mas mahinang alternatibong maaaring ipahiwatig ng Griyego.
- source_word: μόνην με κατέλειπεν διακονεῖν
  choice: iniwan ako ... mag-isang magsilbi
  rationale: Tahasang pinananatili nito ang μόνην (“mag-isa”) at ang infinitive na διακονεῖν (“magsilbi”) nang hindi gumagamit ng mas matinding salitang gaya ng “tinalikuran.”
- source_word: εἰπὲ οὖν αὐτῇ
  choice: Kaya sabihin mo sa kanya
  rationale: Pinananatili ng “kaya” ang panghinuha ng οὖν, habang ang “sabihin mo” ay angkop na tuwirang pautos.
- source_word: συναντιλάβηται
  choice: tulungan ako
  rationale: Ang pandiwa ay tumutukoy sa pakikiisa sa pagtulong o pag-alalay. Ang “tulungan ako” ang pinakanatural na modernong Filipino, at malinaw na sa konteksto ang diwa ng sama-samang paggawa.
theological_decisions:
- issue: Pagsasalin ng κύριος sa pagtawag ni Marta kay Jesus
  choice: Panginoon
  alternative: Guro
  rationale: Pinananatili ng “Panginoon” kapwa ang magalang na pagtawag at ang mas malawak na teolohikal na gamit ng κύριος kay Jesus sa Lucas, nang hindi kinakailangang paliitin ito sa papel na tagapagturo lamang.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal ang himig. Ginamit ang “Marta,” “Panginoon,” at “pagsisilbi” bilang malinaw at karaniwang anyo. Iniwasan ang “ministeryo” dahil pambahay at praktikal ang konteksto, at iniwasan din ang labis na matinding “tinalikuran” o “pinabayaan nang lubusan.”
