  to: Ngunit nahahati ang pansin ni Marta dahil sa dami ng kanyang pagsisilbi. Lumapit siya at sinabi, “Panginoon, wala ka bang pakialam[a] na iniwan ako ng kapatid kong babae upang mag-isa akong magsilbi? Kaya sabihin mo sa kaniya na tulungan ako.”
  rationale: Inayos ang pagkakabit ng «mag-isa» upang si Marta, hindi ang kapatid, ang malinaw na tagaganap ng paglilingkod. Ginawang ganap na pangungusap ang talababa upang maipakita nito ang alternatibong lakas ng buong tanong, habang pinananatili ang parehong kahulugan at antas ng reklamo.
