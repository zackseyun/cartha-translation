  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃ πρῶτον λέγετε· Εἰρήνη τῷ οἴκῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/005.yaml
  text: Into whatever house you enter[a], first say, ‘Peace to this house.’
translation:
  language: tl
  text: Kapag pumasok kayo sa alinmang bahay, sabihin muna ninyo, “Kapayapaan sa bahay na ito.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kapayapaan nawa sa bahay na ito.” Ang Griyego ay isang maikling pormula ng pagpapala.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν … οἰκίαν
  choice: Kapag … sa alinmang bahay
  rationale: Ang pariralang may ἄν ay nagpapahayag ng di-tiyak at pangkalahatang kalagayan. Likas sa modernong Tagalog ang “kapag … sa alinmang bahay,” at naipapakita ng “sa” kasama ng “pumasok” ang direksiyon ng εἰς.
- source_word: εἰσέλθητε
  choice: pumasok kayo
  rationale: Ang aorist subjunctive sa sugnay na may ἄν ay may pangkalahatan at nakatuon-sa-hinaharap na diwa. Malinaw at natural ang “pumasok kayo.”
- source_word: οἰκίαν
  choice: bahay
  rationale: Tumutukoy ito lalo na sa tirahang pinapasok ng mga alagad. Pinananatili ng “bahay” ang kongkretong kahulugan at ang ugnayan nito sa οἶκος sa kasunod na pagbati.
- source_word: πρῶτον
  choice: muna
  rationale: Sa Tagalog, natural na ipinahahayag ng “muna” na ito ang unang dapat gawin pagpasok, nang hindi pinabibigat ang pangungusap.
- source_word: λέγετε
  choice: sabihin ninyo
  rationale: Ang present imperative ay nag-uutos ng palagiang gagawing pagbati. Ang “sabihin ninyo” ang tuwiran at karaniwang katumbas.
- source_word: Εἰρήνη
  choice: Kapayapaan
  rationale: Pinananatili ng nag-iisang pangngalan ang maikli at makahulugang anyo ng pagbati o pagpapala sa Griyego.
- source_word: τῷ οἴκῳ τούτῳ
  choice: sa bahay na ito
  rationale: Ang datibo ang tumutukoy sa tatanggap ng pagpapala. Ang “sa bahay na ito” ay natural sa Tagalog at hindi sapilitang nagpapasiya kung gusali lamang o sambahayan ang saklaw.
theological_decisions:
- issue: Likas na katangian ng pormula ng kapayapaan
  choice: 'Isinalin bilang binibigkas na pagbati o pagpapala: “Kapayapaan sa bahay na ito.”'
  alternative: “Kapayapaan nawa sa bahay na ito” o “Sumainyo ang kapayapaan sa bahay na ito”
  rationale: Maikli ang pormula sa Griyego at umaalingawngaw sa kaugaliang Judio ng pagbati at pagpapala. Pinananatili ng salin ang bisa nito bilang pagpapahayag ng kapayapaan nang hindi nagdaragdag ng pandiwa o tiyak na liturhikal na pananalita na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “kayo/ninyo” dahil maramihan ang mga pandiwa sa Griyego. Pinanatiling maikli ang pormula ng kapayapaan upang masalamin ang anyo at bigat ng orihinal.
