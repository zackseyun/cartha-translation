  text: Σαμαρίτης δέ τις ὁδεύων ἦλθεν κατ’ αὐτὸν καὶ ⸀ἰδὼν ἐσπλαγχνίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/033.yaml
  text: But a Samaritan[a], as he traveled, came to where he was, and when he saw him, he was moved with compassion.
translation:
  language: tl
  text: Ngunit isang Samaritano na naglalakbay ang dumating sa kinaroroonan niya. Nang makita siya ng Samaritano, naantig siya sa habag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “nahabag siya.”'
    reason: Alternatibong mas payak na salin ng ἐσπλαγχνίσθη.
lexical_decisions:
- source_word: Σαμαρίτης
  choice: isang Samaritano
  rationale: Ang “Samaritano” ang karaniwan at tiyak na katawagan sa pagkakakilanlang etniko at panrelihiyon, at pinananatili nito ang mahalagang pagkakaiba niya sa pari at Levita sa salaysay.
- source_word: δέ
  choice: Ngunit
  rationale: Ipinakikita nito ang malinaw na pagsalungat sa naging tugon ng pari at Levita sa mga naunang talata.
- source_word: τις
  choice: isang
  rationale: Likas na ipinahahayag sa Tagalog ng “isang” ang di-tiyak na pagtukoy; hindi kailangang gawing mas mabigat na “isang partikular na.”
- source_word: ὁδεύων
  choice: na naglalakbay
  rationale: Pinananatili nito ang nagpapatuloy na kilos na nagsisilbing kaligiran ng pagdating ng Samaritano.
- source_word: ἦλθεν κατ’ αὐτόν
  choice: ang dumating sa kinaroroonan niya
  rationale: Malinaw at likas nitong ipinahahayag ang paglapit ng Samaritano sa lugar na kinaroroonan ng sugatang lalaki, nang hindi pinipilit ang literal ngunit malabong “dumating sa kaniya.”
- source_word: ἰδών
  choice: Nang makita siya ng Samaritano
  rationale: Ipinahahayag nito ang temporal na ugnayan ng participle sa pangunahing pandiwa. Inulit ang “Samaritano” upang maiwasan ang kalituhan sa mga panghalip.
- source_word: ἐσπλαγχνίσθη
  choice: naantig ito sa habag
  rationale: Inihahatid nito ang malalim at panloob na pagkahabag na ipinahihiwatig ng pandiwa, habang nananatiling natural at marangal sa makabagong Tagalog.
theological_decisions:
- issue: Paglalarawan sa mahabaging tugon ng Samaritano nang hindi nagdaragdag ng doktrinal o moral na pagpapakahulugan
  choice: naantig ito sa habag
  alternative: nahabag siya
  rationale: Pinananatili ng salin ang matinding damdamin ng habag sa pandiwang Griyego, ngunit hindi ito pinalalawak tungo sa mga ideya tungkol sa biyaya, awa, o pag-ibig sa kapwa na hindi tahasang sinasabi sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ito” para sa Samaritano matapos siyang muling pangalanan, upang hindi mapagkamalan kung sino ang nakakita at nahabag. Inilagay ang talababa sa pariralang tinutukoy nito, ang “naantig ito sa habag.”
