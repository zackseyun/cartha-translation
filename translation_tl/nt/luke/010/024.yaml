  source_fidelity: 'Tapat ang salin sa Griyego: napananatili ang paliwanag na γάρ sa “Sapagkat,” ang mga pangkat na “maraming propeta at hari,” ang dalawang magkatambal na infinitive na “makita” at “marinig,” at ang makasaysayang pagtangging “hindi nila iyon nakita/narinig.” Ang “ngunit” ay isang likas na Filipino na paraan upang ihayag ang kontras na nasa daloy ng pahayag, nang walang dagdag na interpretasyon.'
