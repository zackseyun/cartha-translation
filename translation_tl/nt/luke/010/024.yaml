id: LUK.10.24
reference: Luke 10:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι πολλοὶ προφῆται καὶ βασιλεῖς ἠθέλησαν ἰδεῖν ἃ ὑμεῖς βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/024.yaml
  text: For I tell you that many prophets and kings desired to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: tl
  text: Sapagkat sinasabi ko sa inyo, maraming propeta at hari ang ninais[a] na makita ang nakikita ninyo, ngunit hindi nila iyon nakita, at marinig ang naririnig ninyo, ngunit hindi nila iyon narinig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hinangad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Sapagkat sinasabi ko sa inyo
  rationale: Likas na isinasalin ng “sinasabi ko sa inyo” ang λέγω ... ὑμῖν, samantalang pinananatili ng “Sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang pahayag.
- source_word: πολλοὶ προφῆται καὶ βασιλεῖς
  choice: maraming propeta at hari
  rationale: Tuwirang pinananatili ang dami at ang dalawang makasaysayang katawagang “mga propeta” at “mga hari,” nang walang dagdag na pagpapakahulugan.
- source_word: ἠθέλησαν
  choice: ninais
  rationale: Ipinahahayag ng “ninais” ang matibay na pagnanais nang hindi ipinapalagay na ang pandiwa ay laging nangangahulugang matinding pananabik.
- source_word: ἰδεῖν ἃ ὑμεῖς βλέπετε
  choice: na makita ang nakikita ninyo
  rationale: Pinananatili ang payak na pandiwa ng pagkakita at ang tuwirang paghahambing sa karanasan ng mga kausap ni Jesus.
- source_word: καὶ οὐκ εἶδαν
  choice: ngunit hindi nila iyon nakita
  rationale: Ang “ngunit” ay natural na nagpapakita ng salungatan sa Filipino; ang “iyon” ay ginagawang malinaw ang bagay na tinutukoy nang walang idinaragdag na bagong kahulugan.
- source_word: καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: at marinig ang naririnig ninyo, ngunit hindi nila iyon narinig
  rationale: Pinananatili ang magkatulad na kayarian ng pagkakita at pagkarinig, pati ang makasaysayang katotohanang hindi nila natamo ang ninanais nilang marinig.
theological_decisions:
- issue: Pagkakakilanlan ng “mga propeta at mga hari”
  choice: Panatilihin ang mga katawagang “propeta” at “hari” nang walang paliwanag na idinagdag sa talata.
  alternative: “mga propeta at mga pinuno” o “mga propeta at mga hari noong unang panahon”
  rationale: Tiyak na “mga hari” ang βασιλεῖς, ngunit hindi tahasang idinagdag ng Griyego ang “noong unang panahon.” Pinananatili ng salin ang paghahambing sa mga alagad nang hindi nilulutas o pinalalawak ang makasaysayang sanggunian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” at “nila” para sa likas na maramihang pagtukoy, at pinanatili ang balanseng pag-uulit ng “makita/nakita” at “marinig/narinig.”
