  text: Ὑπέστρεψαν δὲ οἱ ἑβδομήκοντα ⸀δύο μετὰ χαρᾶς λέγοντες· Κύριε, καὶ τὰ δαιμόνια ὑποτάσσεται ἡμῖν ἐν τῷ ὀνόματί σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/017.yaml
  text: Then the seventy-two returned with joy[a], saying, “Lord, even the demons submit to us in your name.”
translation:
  language: tl
  text: Bumalik ang pitumpu't dalawa[a] na may galak, at sinabi nila, “Panginoon, maging ang mga demonyo ay nagpapasakop sa amin sa iyong pangalan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito ay “pitumpu” sa halip na “pitumpu't dalawa.”
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπέστρεψαν
  choice: Bumalik
  rationale: Tuwirang ipinapahayag ng aorist na ὑποστρέφω ang pagbabalik nila mula sa kanilang misyon; natural at malinaw ang “bumalik” sa modernong Tagalog.
- source_word: δὲ
  choice: '[hindi hiwalay na isinalin]'
  rationale: Ang δέ ay nag-uugnay at nagpapausad sa salaysay. Sapat nang ipinahihiwatig ng ayos ng pangungusap ang pag-usad, at magiging mabigat o di-likas dito ang sapilitang “at” o “pagkatapos.”
- source_word: οἱ ἑβδομήκοντα δύο
  choice: ang pitumpu't dalawa
  rationale: Sinusunod ng pangunahing teksto ang SBLGNT na may bilang na pitumpu't dalawa; inilalagay sa talababa ang mahalagang variant na pitumpu.
- source_word: μετὰ χαρᾶς
  choice: na punô ng galak
  rationale: Natural na inilalarawan nito sa Tagalog ang masayang kalagayan nila sa pagbabalik habang pinananatili ang diwa ng χαρά.
- source_word: λέγοντες
  choice: at sinabi
  rationale: Bagaman participle ang Griyego, mas natural sa Tagalog ang koordinadong pandiwang “at sinabi” upang ipakilala ang tuwirang pahayag.
- source_word: Κύριε
  choice: Panginoon
  rationale: Ang vocative na κύριος na itinatawag kay Jesus ay karaniwang at marangal na isinasaling “Panginoon.”
- source_word: καὶ
  choice: maging
  rationale: 'May pataas o emphatic na puwersa rito ang καί: ipinahahayag ng mga alagad ang kanilang pagkamangha na kahit ang mga demonyo ay nagpapasakop.'
- source_word: τὰ δαιμόνια
  choice: ang mga demonyo
  rationale: Tuwiran at karaniwang katumbas ito ng δαιμόνια at hindi nagdaragdag ng interpretasyong nasa “masasamang espiritu.”
- source_word: ὑποτάσσεται
  choice: nagpapasakop
  rationale: Ipinakikita ng present middle/passive form ang aktuwal o patuloy na pagpapasakop. Natural sa Tagalog ang maramihang paksa kasama ng anyong “nagpapasakop.”
- source_word: ἡμῖν
  choice: sa amin
  rationale: Ito ang natural na Tagalog para sa dative complement ng ὑποτάσσω.
- source_word: ἐν τῷ ὀνόματί σου
  choice: sa iyong pangalan
  rationale: Pinananatili nito ang biblikal na idyoma at ang maaaring saklaw nitong kapangyarihan o awtoridad na kaugnay ng pangalan ni Jesus nang hindi labis na ipinapaliwanag sa pangunahing teksto.
theological_decisions:
- issue: Variant sa bilang ng mga isinugo
  choice: pitumpu't dalawa
  alternative: pitumpu
  rationale: Ang ibinigay na SBLGNT ay may ἑβδομήκοντα δύο, kaya iyon ang sinusunod sa pangunahing teksto. Mahalaga at kilala ang variant na “pitumpu,” kaya tahasan itong pinananatili sa talababa.
- issue: Kahulugan ng “sa iyong pangalan”
  choice: panatilihin ang idyomang “sa iyong pangalan”
  alternative: “sa pamamagitan ng iyong pangalan” o “sa awtoridad ng iyong pangalan”
  rationale: Maaaring magpahiwatig ang ἐν ng kaparaanan, kapangyarihan, o awtoridad, ngunit hindi ito nililinaw nang higit pa ng teksto. Pinananatili ng tuwirang salin ang saklaw at teolohikal na diin ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “punô ng galak” at “at sinabi” para sa idiomatikong daloy, habang pinanatili ang mga biblikal na terminong “Panginoon,” “mga demonyo,” at “sa iyong pangalan.”
