id: LUK.10.15
reference: Luke 10:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ⸀τοῦ ᾅδου ⸀καταβιβασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/015.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will be brought down to Hades.
translation:
  language: tl
  text: At ikaw, Capernaum, itataas ka ba hanggang sa langit? Ibababa ka hanggang sa Hades.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “daigdig ng mga patay.” Griyego: Hades, hindi Gehenna (“impiyerno”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Capernaum
  rationale: Ginamit ang nakagawiang modernong baybay sa Filipino para sa pangalan ng lugar.
- source_word: μὴ ... ὑψωθήσῃ
  choice: itataas ka ba
  rationale: Isinalin bilang retorikal na tanong na umaasang hindi ang sagot. Pinananatili ng “itataas” ang pasibong diwa at ang larawan ng pagkataas.
- source_word: ἕως οὐρανοῦ
  choice: hanggang sa langit
  rationale: Ipinapahayag nito ang hangganan o sukdulan ng pag-akyat at pinananatili ang patayong larawang katapat ng pagbaba sa Hades.
- source_word: ἕως τοῦ ᾅδου
  choice: hanggang sa Hades
  rationale: Pinanatili ang “Hades” upang maiba ito sa Gehenna at maiwasang ipakahulugan agad bilang pangwakas na lugar ng kaparusahan.
- source_word: καταβιβασθήσῃ
  choice: ibababa ka
  rationale: 'Pinananatili ng anyong ito ang future passive: may magpapababa sa Capernaum, na may pahiwatig ng paghatol at pagpapakumbaba.'
theological_decisions:
- issue: Pagpapakahulugan sa ᾅδης
  choice: Hades
  alternative: daigdig ng mga patay; impiyerno
  rationale: Ang ᾅδης ay tumutukoy sa Hades o daigdig ng mga patay at hindi kapareho ng Gehenna. Pinananatili ng transliterasyon ang pagkakaibang leksikal at ang posibleng teolohikal na tensiyon.
- issue: Anyo ng μὴ ... ὑψωθήσῃ
  choice: 'retorikal na tanong: “itataas ka ba”'
  alternative: “hindi ka itataas”
  rationale: Ang μὴ sa tanong ay karaniwang umaasang negatibo ang sagot; ang anyong tanong ay nagpapanatili sa lakas at estruktura ng Griyego nang hindi ito ginagawang tahasang pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang “At ikaw” upang mapanatili ang mariing pagtukoy sa Capernaum, at “hanggang sa” sa magkabilang sugnay upang mapanatili ang magkatapat na larawan ng langit at Hades.
