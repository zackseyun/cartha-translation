  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μὴ βαστάζετε βαλλάντιον, μὴ πήραν, ⸀μὴ ὑποδήματα, καὶ μηδένα κατὰ τὴν ὁδὸν ἀσπάσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/004.yaml
  text: Do not carry a money bag[a], a travel bag, or sandals[b], and greet no one along the road.
translation:
  language: tl
  text: Huwag kayong magdala ng supot ng pera, bag na panlakbay[a], o mga sandalyas; at huwag kayong bumati kaninuman sa daan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “bag,” “supot na panustos,” o “sakbit na bag.”
    reason: lexical_alternative
  - marker: b
    text: 'Malamang na hindi ito pagbabawal sa karaniwang paggalang, kundi diin sa pagmamadali ng gawain: walang panahong dapat maubos sa mahahabang pakikipagbatian na nakaugalian noon.'
    reason: cultural_note
lexical_decisions:
- source_word: βαστάζετε
  choice: magdala
  rationale: Sa konteksto ng mga tagubilin para sa paglalakbay, natural na ipinahahayag ng “magdala” ang pagdadala ng mga gamit o panustos.
- source_word: βαλλάντιον
  choice: supot ng pera
  rationale: Tumutukoy ito sa isang sisidlan o supot na pinaglalagyan ng pera. Mas malinaw sa makabagong mambabasa ang “supot ng pera” kaysa sa “pitaka,” na maaaring magpahiwatig ng modernong wallet.
- source_word: πήραν
  choice: bag na panlakbay
  rationale: Ang salita ay tumutukoy sa bag na dinadala sa paglalakbay, karaniwan para sa mga panustos. Malinaw at natural ang “bag na panlakbay” sa modernong Filipino.
- source_word: ὑποδήματα
  choice: mga sandalyas
  rationale: Tumutukoy ito sa isinusuot sa paa at, sa sinaunang konteksto ng Mediteraneo, ang “mga sandalyas” ang pinakaangkop na kongkretong katumbas.
- source_word: μηδένα
  choice: kaninuman
  rationale: 'Ipinapanatili nito ang ganap na anyo ng pagbabawal: walang sinumang dapat batiin habang nasa daan.'
- source_word: κατὰ τὴν ὁδόν
  choice: sa daan
  rationale: Ito ang natural at maikling salin ng pariralang tumutukoy sa panahon o lugar ng paglalakbay.
- source_word: ἀσπάσησθε
  choice: bumati
  rationale: Ang pandiwa ay karaniwang nangangahulugang bumati o magbigay-galang. Ang “bumati” ay tuwiran at hindi nagdaragdag ng interpretasyon sa pangunahing teksto.
theological_decisions:
- issue: Lakas at saklaw ng pagbabawal na bumati habang naglalakbay
  choice: 'Panatilihin bilang tuwirang utos: “huwag kayong bumati kaninuman sa daan.”'
  alternative: Ipaliwanag sa pangunahing teksto bilang “huwag kayong magpatagal sa pakikipagbatian.”
  rationale: Tuwiran ang pagbabawal sa Griyego. Hindi ito pinalalambot o pinapalawak sa pangunahing teksto; inilalagay sa talababa ang posibleng kultural na diwa ng pagmamadali at pag-iwas sa mahahabang pagbati.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maiikli at mariing pagbabawal ng Griyego. Ginamit ang karaniwang salitang “bag” bilang natural na hiram na salita, samantalang nilinaw ng “na panlakbay” ang gamit nito.
