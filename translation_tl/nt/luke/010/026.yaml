base_translation:
  language: en
  yaml_path: translation/nt/luke/010/026.yaml
  text: And he said to him[a], “What is written in the Law? How do you read it?”
translation:
  language: tl
  text: Sinabi naman niya sa kanya, “Ano ang nakasulat sa Kautusan? Paano mo ito binabasa?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Paano mo ito inuunawa?” Mas literal na sinasabi ng Griyego, “Paano mo ito binabasa?” ngunit maaari rin itong tumukoy sa pag-unawa o pagbibigay-kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Sinabi naman niya
  rationale: Ang δέ ay banayad na pang-ugnay; likas na naihahayag ng “naman” ang pagpapatuloy ng usapan nang hindi nagpapahiwatig ng matinding pagsalungat. Ang ὁ ay gumaganap bilang panghalip para sa ipinahihiwatig na simuno.
- source_word: εἶπεν πρὸς αὐτόν
  choice: Sinabi ... niya sa kanya
  rationale: Tuwirang ipinahahayag nito ang pagsasalita at ang taong kinakausap, nang walang idinagdag na diwa gaya ng “sumagot.”
- source_word: Ἐν τῷ νόμῳ
  choice: sa Kautusan
  rationale: Tumutukoy ang νόμος sa kinikilalang Kautusang nasa Kasulatan ng Israel. Ang “Kautusan” ay malinaw at pamilyar sa makabagong Tagalog, at ang malaking titik ay nagpapakitang hindi ito batas sa pangkalahatan.
- source_word: τί γέγραπται
  choice: Ano ang nakasulat
  rationale: Pinananatili ng “nakasulat” ang kalagayang ipinahihiwatig ng perfect passive γέγραπται at natural itong pahayag sa Tagalog kapag tumutukoy sa Kasulatan.
- source_word: πῶς
  choice: Paano
  rationale: Tuwiran nitong pinananatili ang bukas na tanong tungkol sa paraan ng pagbasa at posibleng pag-unawa.
- source_word: ἀναγινώσκεις
  choice: mo ito binabasa
  rationale: Ang pangunahing kahulugan ng ἀναγινώσκω ay “bumasa.” Ang “ito” ay likas na tumutukoy sa Kautusan, habang ang talababa ay nagpapanatili sa posibleng diwang “unawain” o “bigyang-kahulugan.”
theological_decisions:
- issue: Kahulugan ng νόμος sa tanong ni Jesus
  choice: Kautusan bilang kinikilalang Kautusang nasa Kasulatan na ibinigay sa Israel
  alternative: Torah; batas sa pangkalahatan
  rationale: Ang kausap ay isang dalubhasa sa Kautusan sa kontekstong Judio. Pinananatili ng “Kautusan” ang tiyak na pagtukoy sa Kasulatan nang hindi gumagamit ng transliterasyong maaaring hindi agad maunawaan ng karaniwang mambabasa.
- issue: Diwang interpretatibo ng πῶς ἀναγινώσκεις
  choice: Panatilihin sa pangunahing teksto ang literal na “Paano mo ito binabasa?”
  alternative: Paano mo ito inuunawa?; Paano mo ito binibigyang-kahulugan?
  rationale: Maaaring sinusuri ng tanong hindi lamang ang pagbasa kundi pati ang pag-unawa, ngunit ang pandiwang Griyego ay tuwirang nangangahulugang “bumasa.” Pinananatili ng salin at talababa ang retorikal at teolohikal na pagiging bukas ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “naman” bilang banayad na pang-ugnay sa salaysay at ang “Kautusan” bilang pamilyar na katawagan sa kinikilalang batas na nasa Kasulatan.
