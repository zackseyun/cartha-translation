  source_fidelity: Tumpak na naipapahayag ng salin ang dalawang tanong sa Griyego. Ang “sa Kautusan” ay angkop para sa ἐν τῷ νόμῳ, “Ano ang nakasulat” para sa τί γέγραπται, at pinananatili ng “Paano mo ito binabasa?” ang literal na saklaw ng πῶς ἀναγινώσκεις nang hindi ito sapilitang ginagawang “binibigyang-kahulugan.” Ang “naman” ay katamtamang katumbas ng δέ sa daloy ng salaysay.
