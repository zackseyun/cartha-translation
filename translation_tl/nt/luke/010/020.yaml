id: LUK.10.20
reference: Luke 10:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πλὴν ἐν τούτῳ μὴ χαίρετε ὅτι τὰ πνεύματα ὑμῖν ὑποτάσσεται, χαίρετε δὲ ὅτι τὰ ὀνόματα ὑμῶν ⸀ἐγγέγραπται ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/020.yaml
  text: Nevertheless[a], do not rejoice in this, that the spirits submit to you[c][b], but rejoice that your names have been written in the heavens.
translation:
  language: tl
  text: Gayunman, huwag ninyong ikagalak na nagpapasakop sa inyo ang mga espiritu[a], ngunit ikagalak ninyo na nakasulat ang inyong mga pangalan sa kalangitan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ipinahihiwatig ng konteksto na masasamang espiritu ang tinutukoy; maaari ring isaling “mga demonyo” o “masasamang espiritu,” ngunit “mga espiritu” lamang ang nakasulat sa Griyego.
    reason: lexical_alternative
  - marker: b
    text: O “sa langit.” Plural ang salitang Griyego, na mas literal na maisasaling “sa mga langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Gayunman
  rationale: Malinaw na naghuhudyat ng matibay na pagtutuwid at pagsalungat sa naunang ikinagalak ng mga alagad.
- source_word: ἐν τούτῳ μὴ χαίρετε
  choice: huwag ninyong ikagalak na
  rationale: Likas sa modernong Tagalog at pinananatili ang tuon sa bagay na hindi nila dapat pagbatayan ng kagalakan.
- source_word: μὴ χαίρετε ... χαίρετε δὲ
  choice: huwag ninyong ikagalak ... sa halip, ikagalak ninyo
  rationale: Inuulit ang iisang pandiwa upang mapanatili ang retorikal na paghahambing ng dalawang utos.
- source_word: τὰ πνεύματα
  choice: ang mga espiritu
  rationale: Hindi dinaragdagan ang salitang Griyego ng “masasama” o pinapalitan ng “mga demonyo,” bagaman ipinahihiwatig ng konteksto na mapanlabang mga espiritu ang tinutukoy.
- source_word: ὑμῖν ὑποτάσσεται
  choice: nagpapasakop sa inyo
  rationale: Natural na Tagalog para sa pagiging nasa ilalim ng kanilang awtoridad; hindi nito ipinipilit kung kusang pagpapasakop o pagkakasakop ang diin.
- source_word: τὰ ὀνόματα ὑμῶν
  choice: ang inyong mga pangalan
  rationale: Karaniwan at malinaw na ayos ng pariralang paari sa Tagalog.
- source_word: ἐγγέγραπται
  choice: nakasulat
  rationale: Ipinahihiwatig ang kalagayang bunga ng isang natapos na pagsulat, kaya naipapakita ang nananatiling resulta ng Griyegong perfect passive nang natural sa Tagalog.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: sa kalangitan
  rationale: Ang “kalangitan” ay isang likas na kolektibong salitang Tagalog na maaaring kumatawan sa plural na οὐρανοῖς nang hindi nagiging alanganing “mga langit” sa pangunahing teksto.
theological_decisions:
- issue: Uri ng mga espiritu
  choice: ang mga espiritu
  alternative: ang masasamang espiritu / ang mga demonyo
  rationale: Mapanlabang espirituwal na mga nilalang ang ipinahihiwatig ng konteksto, ngunit “mga espiritu” lamang ang tahasang sinasabi ng talata; pinananatili ng salin ang leksikal na lawak nito.
- issue: Kalagayan ng pagkakasulat ng mga pangalan
  choice: nakasulat ang inyong mga pangalan
  alternative: naisulat na ang inyong mga pangalan
  rationale: Ang “nakasulat” ay natural na nagpapahayag ng kasalukuyan at nananatiling kalagayan mula sa natapos na kilos, nang hindi labis na binibigyang-diin ang panahon ng pagsulat.
- issue: Kinaroroonan ng pagkakasulat
  choice: sa kalangitan
  alternative: sa langit / sa mga langit
  rationale: Pinangangalagaan ng kolektibong “kalangitan” ang plural na anyo ng Griyego habang nananatiling natural at marangal sa modernong Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa sa publiko. Ginamit ang “ikagalak” upang mapanatili ang pag-uulit at pagtutuwid sa dalawang sugnay. Iniwasan ang sobrang espesipikong “mga demonyo” sa pangunahing teksto at ginamit ang kolektibong “kalangitan” para sa natural na paglalapat ng Griyegong plural.
