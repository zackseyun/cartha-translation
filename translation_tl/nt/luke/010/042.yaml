  text: ⸂ὀλίγων δέ ἐστιν χρεία ἢ ἑνός⸃· ⸂Μαριὰμ γὰρ⸃ τὴν ἀγαθὴν μερίδα ἐξελέξατο ἥτις οὐκ ἀφαιρεθήσεται ⸀αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/042.yaml
  text: But few things are needed—or one[a]. For Mary has chosen the good portion[b], which will not be taken away from her.
translation:
  language: tl
  text: Ngunit kakaunti lamang ang kailangan—o isa lamang.[a] Sapagkat pinili ni Maria ang mabuting bahagi[b] na hindi kukunin sa kaniya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “iisa lamang ang kinakailangan.” Sa tagpuan ng paghahanda ng pagkain, maaari ring maunawaan ang Griyego bilang “kakaunting putahe lamang ang kailangan—o isa lamang.”
    reason: alternative_reading
  - marker: b
    text: O, “mabuting parte.” Maaaring sadyang tumutukoy ang “bahagi” kapuwa sa bahagi ng pagkain at sa makasagisag na bahagi sa kung ano ang tunay na mahalaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγων
  choice: kakaunti lamang
  rationale: Ang genitibong maramihan kasama ng χρεία ay tumutukoy sa maliit na bilang ng mga bagay na kailangan. Hindi tahasang idinagdag ang “mga bagay” upang mapanatili ang pagiging maikli at ang posibleng kaugnayan sa paghahanda ng pagkain.
- source_word: χρεία
  choice: ang kailangan
  rationale: Ang pariralang ἐστιν χρεία ay likas na nagpapahayag ng pangangailangan. Ang “ang kailangan” ay malinaw at natural sa modernong Tagalog.
- source_word: ἢ ἑνός
  choice: o isa lamang
  rationale: Pinananatili nito ang maikli at sadyang hindi tiyak na paghahambing ng Griyego—maaaring isang putahe o isang mahalagang bagay ang tinutukoy.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Karaniwang anyo ng pangalang biblikal sa Tagalog.
- source_word: τὴν ἀγαθὴν μερίδα
  choice: ang mabuting bahagi
  rationale: Tuwirang inililipat ng “mabuting” ang ἀγαθή nang hindi ginagawang pahambing na “mas mabuti.” Ang “bahagi” ay maaaring tumukoy kapuwa sa bahagi ng pagkain at sa makasagisag na bahagi o kapalarang tunay na mahalaga.
- source_word: ἐξελέξατο
  choice: pinili
  rationale: Ipinahahayag ng pandiwang aorist middle ang kusang pagpili ni Maria. Ang payak na aspektong Tagalog na “pinili” ay natural at hindi nagpapataw ng di-kailangang pagkakaiba sa panahunan.
- source_word: ἥτις
  choice: at hindi iyon
  rationale: Ang “iyon” ay malinaw na tumutukoy sa piniling mabuting bahagi; ang pag-uugnay na “at” ay natural sa Tagalog habang pinananatili ang katangiang sinasabi tungkol dito.
- source_word: οὐκ ἀφαιρεθήσεται αὐτῆς
  choice: hindi iyon kukunin sa kaniya
  rationale: Pinananatili ang hinaharap na balintiyak at ang diwa ng isang bagay na hindi maaalis o makukuha mula kay Maria.
theological_decisions:
- issue: Ang kahulugan ng “kakaunti ... o isa” kaugnay ng paglilingkod ni Marta at pagpili ni Maria
  choice: Panatilihin itong pahayag tungkol sa kakaunti o iisang kailangan, nang hindi tinutukoy kung pagkain, putahe, o isang mahalagang bagay ang ibig sabihin.
  alternative: “Iisa lamang ang kailangan” o “kakaunti lamang na putahe—o isa lamang—ang kailangan.”
  rationale: Maaaring tumukoy ang Griyego kapuwa sa praktikal na paghahanda ng pagkain at sa mas malawak na espirituwal na pangangailangan. Hindi dapat lutasin ng salin ang tunay na kalabuan ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “kakaunti lamang ... o isa lamang” upang mapanatili ang kalabuan; iniwasan ang “mas mabuting bahagi” sapagkat hindi pahambing ang ἀγαθή.
