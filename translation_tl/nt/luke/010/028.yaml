  text: εἶπεν δὲ αὐτῷ· Ὀρθῶς ἀπεκρίθης· τοῦτο ποίει καὶ ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/028.yaml
  text: And he said to him[a], “You have answered correctly. Do this[b], and you will live.”
translation:
  language: tl
  text: Sinabi niya sa kanya, “Tama ang sagot mo. Gawin mo ito, at mabubuhay ka.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mas malawak na konteksto ay tungkol sa buhay na walang hanggan (tingnan ang Lucas 10:25), ngunit ang Griyego rito ay simpleng nagsasabing “mabubuhay ka.”
    reason: cross_reference
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: Sinabi niya sa kanya
  rationale: Ang εἶπεν ay payak na ‘sinabi,’ ang αὐτῷ ay ‘sa kanya,’ at hindi kailangang katawanin nang hiwalay ang mahinang pang-ugnay na δέ sa natural na salaysay sa Tagalog.
- source_word: Ὀρθῶς ἀπεκρίθης
  choice: Tama ang sagot mo
  rationale: Natural at kasalukuyang Tagalog ito para sa ‘sumagot ka nang tama,’ habang malinaw na pinagtitibay ang kawastuhan ng sagot.
- source_word: τοῦτο ποίει
  choice: Gawin mo ito
  rationale: Pinananatili ng ‘ito’ ang pagtukoy pabalik sa utos na kababanggit lamang. Maaaring magpahiwatig ng patuloy na pagsasagawa ang present imperative ποίει, ngunit sapat na bukas dito ang karaniwang utos na ‘Gawin mo ito.’
- source_word: καὶ ζήσῃ
  choice: at mabubuhay ka
  rationale: Tuwirang isinasalin ang ζήσῃ bilang ‘mabubuhay ka’ nang hindi idinaragdag sa pangunahing teksto ang ‘walang hanggan,’ na wala sa mismong sugnay.
theological_decisions:
- issue: Saklaw ng ‘mabubuhay’ sa konteksto ng buhay na walang hanggan
  choice: mabubuhay ka
  alternative: magkakaroon ka ng buhay na walang hanggan
  rationale: Buhay na walang hanggan ang tanong sa mas malawak na konteksto (Lucas 10:25), ngunit simpleng ‘mabubuhay ka’ ang sinasabi ng Griyego rito. Pinananatili ng salin ang mismong pananalita at ang teolohikal na tensiyon, habang nililinaw ng talababa ang konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang tuwirang ayos na ‘Tama ang sagot mo’ at iniwasan ang mas mabigat o makalumang pananalita.
