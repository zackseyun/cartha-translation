  to: Pagkatapos ng mga pangyayaring ito, nagtalaga ang Panginoon ng iba pang pitumpu’t dalawa[a] at isinugo sila nang dala-dalawa upang mauna sa kanya sa bawat bayan at lugar na siya mismo ay malapit nang puntahan.
  rationale: Pinalitan ang “na pupuntahan niya mismo” ng “na siya mismo ay malapit nang puntahan” upang mas malinaw na maipahayag ang μέλλω, habang pinananatili ang diin ng αὐτός sa “siya mismo.” Bahagyang inayos din ang anyo ng talababa upang maging ganap na pangungusap at mas natural sa Filipino.
