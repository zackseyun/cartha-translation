id: LUK.10.1
reference: Luke 10:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα ἀνέδειξεν ὁ κύριος ⸀καὶ ἑτέρους ἑβδομήκοντα ⸀δύο καὶ ἀπέστειλεν αὐτοὺς ἀνὰ δύο ⸁δύο πρὸ προσώπου αὐτοῦ εἰς πᾶσαν πόλιν καὶ τόπον οὗ ἤμελλεν αὐτὸς ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/001.yaml
  text: After these things[a], the Lord appointed seventy-two others also, and sent them two by two ahead of him into every town and place where he himself was about to go.
translation:
  language: tl
  text: Pagkatapos ng mga pangyayaring ito, nagtalaga ang Panginoon ng iba pang pitumpu’t dalawa[a] at isinugo sila nang dala-dalawa upang mauna sa kanya sa bawat bayan at lugar na siya mismo ay malapit nang puntahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “pitumpu” ang mababasa sa halip na “pitumpu’t dalawa.”
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Pagkatapos ng mga pangyayaring ito
  rationale: Pinananatili ang pangmaramihang ταῦτα at ang paglipat sa kasunod na salaysay, ngunit gumagamit ng likas na parirala sa modernong Tagalog.
- source_word: ἀνέδειξεν
  choice: nagtalaga
  rationale: Ipinapahayag ng pandiwa ang pagpili at pagtatalaga sa mga tao para sa isang gawain, hindi lamang ang pagpapakilala sa kanila.
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Karaniwan at marangal na salin ng κύριος; sa konteksto, tumutukoy ito kay Jesus.
- source_word: καὶ ἑτέρους ἑβδομήκοντα δύο
  choice: ng iba pang pitumpu’t dalawa
  rationale: Ipinakikita ng ‘iba pang’ na karagdagan sila sa mga naunang isinugo. Sinusunod ng pangunahing teksto ang bilang na pitumpu’t dalawa sa SBLGNT, habang inilalagay sa talababa ang mahalagang ibang pagbasa.
- source_word: ἀπέστειλεν
  choice: isinugo
  rationale: Likas sa kontekstong biblikal at malinaw na nagpapahayag ng pagpapadala para sa isang atas, nang hindi dinaragdagan ang kahulugan.
- source_word: ἀνὰ δύο δύο
  choice: nang dala-dalawa
  rationale: Likas na idyomang Tagalog para sa pamamahaging tigdalawa at pinananatili ang diin ng Griyegong pag-uulit.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: upang mauna sa kanya
  rationale: Ipinahahayag na ipinadala sila bago ang kanyang pagdating upang manguna sa pagpunta sa mga lugar na iyon.
- source_word: εἰς πᾶσαν πόλιν καὶ τόπον
  choice: sa bawat bayan at lugar
  rationale: Pinananatili ang dalawang pangngalan ng Griyego. Ang ‘bayan’ ay natural at hindi naglilimita sa malalaking sentrong urbano.
- source_word: οὗ ἤμελλεν αὐτὸς ἔρχεσθαι
  choice: na pupuntahan niya mismo
  rationale: Likas na ipinapahayag sa Tagalog ang nakatakda o nalalapit na pagpunta, at pinananatili ng ‘mismo’ ang diin ng αὐτός.
theological_decisions:
- issue: Pagkakaiba ng mga manuskrito sa bilang ng mga itinalaga
  choice: pitumpu’t dalawa
  alternative: pitumpu
  rationale: Ang SBLGNT na ibinigay ay may ἑβδομήκοντα δύο (‘pitumpu’t dalawa’). Mahalaga at matagal nang kinikilalang ibang pagbasa ang ‘pitumpu,’ kaya inilalahad ito sa talababa sa halip na ikubli o ipalit sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural sa karaniwang mambabasa. Iniwasan ang labis na teknikal o makalumang pananalita, habang pinananatili ang anyo at mga diin ng Griyego kung natural sa Tagalog.
