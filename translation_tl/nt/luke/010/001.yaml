review_pass:
  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing diwa at lahat ng mahahalagang elemento ng SBLGNT: ang temporal na paglipat, pagtatalaga ng karagdagang pitumpu’t dalawa, pagpapadala nang dala-dalawa, at ang mga bayan at lugar na patutunguhan ni Jesus. Gayunman, ang “pupuntahan niya mismo” ay hindi gaanong malinaw na naipapakita ang aspektong μέλλω (“was about to go”).'
  naturalness: Malinaw at natural ang pangungusap sa modernong Filipino Tagalog. Ang “na siya mismo ay malapit nang puntahan” ay mas tahasang naghahatid ng nalalapit na pagpunta at nananatiling likas sa daloy ng pangungusap.
  terminology: Ang “Panginoon,” “nagtalaga,” “isinugo,” at “nang dala-dalawa” ay angkop sa marangal ngunit modernong rehistro. Wasto ang “pitumpu’t dalawa,” at napananatili ng talababa ang makabuluhang tekstuwal na baryante na “pitumpu.”
  issues:
