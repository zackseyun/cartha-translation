    issue: Hindi tahasang nasasalamin ang μέλλω sa “pupuntahan niya mismo.”
    rationale: Ang pandiwang μέλλω ay nagpapahiwatig na si Jesus ay malapit nang pumunta o nakatakdang pumunta. Ang simpleng panghinaharap na “pupuntahan” ay maaaring tanggapin, ngunit ang “malapit nang puntahan” ay mas tapat sa aspekto ng pinagmulan.
  revised_text: Pagkatapos ng mga pangyayaring ito, nagtalaga ang Panginoon ng iba pang pitumpu’t dalawa[a] at isinugo sila nang dala-dalawa upang mauna sa kanya sa bawat bayan at lugar na siya mismo ay malapit nang puntahan.
