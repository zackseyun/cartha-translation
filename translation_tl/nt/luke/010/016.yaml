id: LUK.10.16
reference: Luke 10:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὁ ἀκούων ὑμῶν ἐμοῦ ἀκούει, καὶ ὁ ἀθετῶν ὑμᾶς ἐμὲ ἀθετεῖ· ὁ δὲ ἐμὲ ἀθετῶν ἀθετεῖ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/016.yaml
  text: The one who hears you hears me[a], and the one who rejects you rejects me; but the one who rejects me rejects the one who sent me.
translation:
  language: tl
  text: “Ang nakikinig sa inyo ay nakikinig sa akin, at ang tumatanggi sa inyo ay tumatanggi sa akin; ngunit ang tumatanggi sa akin ay tumatanggi sa nagsugo sa akin.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “tumatanggi” ay maaari ring isaling “nagwawalang-bahala” o “nagsasantabi” (Griyego: ἀθετέω).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀκούων
  choice: Ang nakikinig
  rationale: Ang substantival na present participle ay tumutukoy sa sinumang taong gumagawa ng kilos. Likas sa modernong Tagalog ang “ang nakikinig” at napapanatili nito ang anyong pangkalahatan ng Griyego.
- source_word: ὑμῶν
  choice: sa inyo
  rationale: Ang genitive kasunod ng ἀκούω ay tumutukoy sa taong pinakikinggan. Hindi idinagdag ang “mensahe” dahil hindi iyon tahasang nasa Griyego.
- source_word: ἐμοῦ ἀκούει
  choice: ay nakikinig sa akin
  rationale: Pinananatili ang pag-uulit ng ἀκούω at ang tuwirang personal na ugnayan sa pagitan ng pakikinig sa mga alagad at pakikinig kay Jesus.
- source_word: ὁ ἀθετῶν
  choice: ang tumatanggi
  rationale: Sa kontekstong ito, malinaw at likas na ipinapahayag ng “tumatanggi” ang pagtakwil sa mga isinugong kinatawan. Maaari ring mangahulugan ang ἀθετέω ng pagwawalang-bahala o pagsasantabi, kaya inilagay ang mga iyon sa talababa.
- source_word: ὑμᾶς
  choice: sa inyo
  rationale: Ang mga alagad mismo ang tuwirang layon. Hindi ito pinalitan ng “sa mensahe ninyo,” na magiging mas makitid kaysa sa Griyego.
- source_word: ἐμὲ ἀθετεῖ
  choice: ay tumatanggi sa akin
  rationale: Inulit ang parehong pandiwa upang mapanatili ang retorikal na diin at ang pagkakaugnay ng pagtanggap o pagtanggi sa mga alagad at kay Jesus.
- source_word: δὲ
  choice: ngunit
  rationale: Ipinahihiwatig ng δέ ang bahagyang pagsalungat at pag-usad tungo sa sukdulang pahayag tungkol sa nagsugo kay Jesus.
- source_word: τὸν ἀποστείλαντά με
  choice: sa nagsugo sa akin
  rationale: Ang articular aorist participle ay natural na maisasalin bilang “ang nagsugo sa akin.” Hindi tahasang idinagdag ang “Ama” dahil hindi ito nakasaad sa talata.
theological_decisions:
- issue: Pagkakaugnay ni Jesus at ng kaniyang mga isinugong kinatawan
  choice: 'Pinanatili ang tuwirang personal na kawing: ang pakikinig o pagtanggi sa mga alagad ay pakikinig o pagtanggi kay Jesus.'
  alternative: Gawing pakikinig o pagtanggi lamang sa mensahe ng mga alagad.
  rationale: Mga personal na panghalip ang ginamit sa Griyego, hindi mga pangngalang gaya ng “mensahe” o “turo.” Sa ganitong paraan, napapanatili ang kinatawang awtoridad nang hindi ito ginagawang isang denominasyonal na pahayag.
- issue: Tinutukoy ng “nagsugo sa akin”
  choice: Iniwan itong di-tahasang pinangalanan bilang “ang nagsugo sa akin.”
  alternative: Isalin bilang “ang Ama na nagsugo sa akin.”
  rationale: Sa konteksto, ang tinutukoy ay ang Diyos Ama, ngunit hindi tahasang binabanggit ng Griyego ang “Ama” rito. Pinananatili ng salin ang mismong antas ng pagpapahayag ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “nakikinig” sa halip na “nakakarinig” upang maipahayag ang pakikinig o pagtanggap sa isang tao sa kontekstong ito. Pinanatili ang maikli at paralelong ayos ng kasabihan.
