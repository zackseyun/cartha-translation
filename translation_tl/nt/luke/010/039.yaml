id: LUK.10.39
reference: Luke 10:39
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τῇδε ἦν ἀδελφὴ καλουμένη ⸀Μαριάμ, ἣ καὶ ⸂παρακαθεσθεῖσα πρὸς⸃ τοὺς πόδας τοῦ ⸀Ἰησοῦ ἤκουεν τὸν λόγον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/039.yaml
  text: And she had a sister called Mary[a], who also sat at Jesus’ feet and was listening to his word.
translation:
  language: tl
  text: May kapatid siyang nagngangalang Maria, na naupo rin sa paanan ni Jesus[a] at patuloy na nakinig sa kanyang salita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “ng Panginoon” ang mababasa sa halip na “ni Jesus.”
    reason: textual_variant
lexical_decisions:
- source_word: τῇδε
  choice: siyang
  rationale: Tumutukoy ang demonstratibo kay Marta sa naunang talata. Ang hulaping panghalip sa “May kapatid siyang” ay likas na paraan sa Tagalog upang ipahayag na siya ay may kapatid.
- source_word: ἀδελφὴ
  choice: kapatid
  rationale: Karaniwang salitang Tagalog para sa ugnayang magkapatid; hindi na kailangang idagdag ang kasarian sapagkat malinaw ito sa pangalang Maria at sa mga panghalip.
- source_word: καλουμένη Μαριάμ
  choice: nagngangalang Maria
  rationale: Likas at marangal na katumbas ng pariralang nagpapakilala sa pangalan ng isang tao.
- source_word: παρακαθεσθεῖσα πρὸς τοὺς πόδας
  choice: naupo sa paanan
  rationale: Ipinahahayag ang pag-upo sa paanan ng isang guro nang hindi dinaragdagan ang teksto ng tahasang interpretasyong “bilang alagad.”
- source_word: τοῦ Ἰησοῦ
  choice: ni Jesus
  rationale: Ito ang pagbasa ng ibinigay na SBLGNT source text. Inilalagay sa talababa ang mahalagang alternatibong pagbasa na “ng Panginoon.”
- source_word: ἤκουεν
  choice: patuloy na nakinig
  rationale: Ipinakikita ng imperfect ang nagpapatuloy na pakikinig; natural sa Tagalog ang “patuloy na nakinig” sa salaysay na nasa nakaraan.
- source_word: τὸν λόγον αὐτοῦ
  choice: kanyang salita
  rationale: Malapit sa lawak ng λόγος at hindi ito pinakikitid agad sa “aral” o “mensahe.”
theological_decisions:
- issue: Tekstuwal na pagbasa sa pangalan o titulo ng nakaupo si Maria sa paanan
  choice: Jesus
  alternative: ang Panginoon
  rationale: Ang ibinigay na orihinal na tekstong SBLGNT ay may Ἰησοῦ (“Jesus”). Ang alternatibong κύριος (“Panginoon”) ay makabuluhang tekstuwal na variant kaya pinananatili sa talababa nang hindi pinapalitan ang base text.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa paanan” bilang natural na pariralang nagpapanatili sa larawan ng posisyon ni Maria, at “patuloy na nakinig” upang maipakita ang aspektong nagpapatuloy ng pandiwang Griyego.
