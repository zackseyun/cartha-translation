id: LUK.5.4
reference: Luke 5:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς δὲ ἐπαύσατο λαλῶν, εἶπεν πρὸς τὸν Σίμωνα· Ἐπανάγαγε εἰς τὸ βάθος καὶ χαλάσατε τὰ δίκτυα ὑμῶν εἰς ἄγραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/004.yaml
  text: When he had finished speaking[a], he said to Simon, “Put out into the deep water, and let down your nets for a catch.”
translation:
  language: tl
  text: Nang matapos siyang magsalita, sinabi niya kay Simon, “Pumalaot ka sa malalim na tubig[a], at ibaba ninyo ang inyong mga lambat upang makahuli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa kalaliman,” na tumutukoy rito sa malalim na tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Nang
  rationale: Likas na ipinakikilala ang kasunod na pangyayari at ang kaugnayang temporal nang hindi labis na isinasalin ang banayad na δέ.
- source_word: ἐπαύσατο λαλῶν
  choice: matapos siyang magsalita
  rationale: Ipinahahayag ng παύω kasama ng kasalukuyang pandiwaring μετοχή ang pagtatapos ng nagpapatuloy na pagsasalita; natural ito sa makabagong Tagalog.
- source_word: εἶπεν πρὸς τὸν Σίμωνα
  choice: sinabi niya kay Simon
  rationale: Tuwirang katumbas ng panimulang pahayag at hindi ito ginagawang mas mapag-utos kaysa sa mismong Griyego.
- source_word: Ἐπανάγαγε
  choice: Pumalaot ka
  rationale: Sa konteksto ng bangka at pangingisda, tumutukoy ito sa paglayo mula sa pampang. Pinananatili ng “ka” ang isahang utos kay Simon.
- source_word: εἰς τὸ βάθος
  choice: sa malalim na tubig
  rationale: Ang βάθος ay tumutukoy rito sa bahaging malalim ang tubig. Malinaw at natural ang salin nang hindi ipinapalagay na dagat ang lugar.
- source_word: χαλάσατε
  choice: ibaba ninyo
  rationale: Ang χαλάω ay pagbaba ng mga lambat mula sa bangka. Pinananatili ng “ninyo” ang maramihang utos, na naiiba sa naunang isahang utos kay Simon.
- source_word: τὰ δίκτυα ὑμῶν
  choice: ang inyong mga lambat
  rationale: Pinananatili ang maramihang “mga lambat” at ang maramihang pag-aari na ipinahihiwatig ng ὑμῶν.
- source_word: εἰς ἄγραν
  choice: upang makahuli
  rationale: Ipinahahayag ang layunin ng pagbaba ng mga lambat. Malinaw sa konteksto na isda ang huhulihin kaya hindi kailangang idagdag ito sa pangunahing teksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Sadyang pinanatili ang pagkakaiba ng isahang utos na “Pumalaot ka” at maramihang utos na “ibaba ninyo,” ayon sa anyo ng tekstong Griyego. Inilagay ang talababa pagkatapos ng “malalim na tubig,” ang pariralang aktuwal nitong nililinaw.
