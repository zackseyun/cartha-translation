    issue: Hindi magkatugma ang mga panipi sa unang bahagi ng talata.
    rationale: Ang teksto ay may panarang panipi pagkatapos ng “mga kasalanan” ngunit walang katumbas na pambukas na panipi. Ipinapakita ng Griyego ang pagsingit na “sinabi niya sa lalaking paralisado” at pagkatapos ay ang direktang utos; dapat ayusin ang bantas nang hindi binabago ang kahulugan.
  - severity: low
    issue: Ang talababa a na “Maaari rin itong maunawaan bilang ‘ang Tao’” ay masyadong payak at maaaring magmukhang tiyak na alternatibong salin.
    rationale: Ang “Son of Man” ay isang pamagat na may masalimuot na alingawngaw sa Bibliya. Mas maingat na ilarawan ang alternatibong pakahulugan bilang “ang Taong Kumakatawan sa Sangkatauhan,” habang malinaw na pinananatili ng teksto ang kinikilalang titulo.
