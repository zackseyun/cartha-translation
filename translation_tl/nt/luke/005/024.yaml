id: LUK.5.24
reference: Luke 5:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ⸂ὁ υἱὸς τοῦ ἀνθρώπου ἐξουσίαν ἔχει⸃ ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— εἶπεν τῷ παραλελυμένῳ· Σοὶ λέγω, ⸀ἔγειρε καὶ ἄρας τὸ κλινίδιόν σου πορεύου εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/024.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he said to the paralyzed man[a], “I say to you, rise, pick up your mat[b], and go to your house.”
translation:
  language: tl
  text: 'Ngunit upang malaman ninyo na ang Anak ng Tao[a] ay may awtoridad sa lupa na magpatawad ng mga kasalanan—sinabi niya sa lalaking paralisado—“Sinasabi ko sa iyo: Bumangon ka, buhatin mo ang iyong higaan[b], at umuwi ka.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, bilang pakahulugan, “ang Taong Kumakatawan sa Sangkatauhan.” Pinanatili ang “Anak ng Tao” bilang kinikilalang titulo, sapagkat ito ang madalas na pansariling tawag ni Jesus at may mahalagang kaugnayan sa Daniel 7.
    reason: alternative_reading
  - marker: b
    text: O “banig” o “maliit na kama.” Ang Griyegong κλινίδιον ay tumutukoy sa isang maliit at nabubuhat na higaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ
  choice: Ngunit upang
  rationale: Pinananatili ng “ngunit” ang banayad na pagsalungat ng δέ, at malinaw na ipinahahayag ng “upang” ang layunin ng ἵνα.
- source_word: εἰδῆτε
  choice: malaman ninyo
  rationale: Tuwirang ipinahahayag nito ang kaalaman o katiyakang tinutukoy ng anyo ng οἶδα.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang kinikilalang pansariling tawag ni Jesus at ang posibleng kaugnayan nito sa Daniel 7 nang hindi nilulutas ang lahat ng pahiwatig ng titulo.
- source_word: ἐξουσίαν ἔχει
  choice: may awtoridad
  rationale: Ang ἐξουσία ay tumutukoy sa lehitimong karapatan o kapamahalaan, hindi lamang sa kakayahan o lakas; malinaw at karaniwan sa modernong Filipino ang “awtoridad.”
- source_word: ἐπὶ τῆς γῆς
  choice: sa lupa
  rationale: Tuwirang salin ito ng lokatibong parirala at hindi ito pinalalawak sa isang interpretatibong paliwanag.
- source_word: ἀφιέναι ἁμαρτίας
  choice: magpatawad ng mga kasalanan
  rationale: Sa kontekstong ito, ang ἀφίημι ay nangangahulugang magpatawad o magpawalang-sala sa kasalanan.
- source_word: τῷ παραλελυμένῳ
  choice: sa lalaking paralisado
  rationale: Natural at malinaw itong modernong paglalarawan sa taong nasa kalagayan ng pagkaparalisa.
- source_word: Σοὶ λέγω
  choice: Sinasabi ko sa iyo
  rationale: Pinananatili nito ang tuwiran at mariing pakikipag-usap ni Jesus sa lalaki.
- source_word: ἔγειρε
  choice: Bumangon ka
  rationale: Likas na pautos ito sa Filipino at malinaw na humihiling ng agarang pagkilos.
- source_word: ἄρας
  choice: buhatin mo
  rationale: Ipinahahayag nito ang pag-angat at pagdadala sa higaan na nakapaloob sa αἴρω sa kontekstong ito.
- source_word: κλινίδιόν σου
  choice: ang iyong higaan
  rationale: Sapat na malawak ang “higaan” upang saklawin ang maliit na kama, papag, o banig na maaaring tukuyin ng diminutibong κλινίδιον.
- source_word: πορεύου εἰς τὸν οἶκόν σου
  choice: umuwi ka
  rationale: Natural na pinagsasama ng “umuwi” ang utos na pumunta at ang patutunguhang sariling bahay.
theological_decisions:
- issue: Pagbibigay-kahulugan sa ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  alternative: ang Tao
  rationale: Pinananatili ng tradisyonal ngunit literal na titulo ang pansariling tawag ni Jesus, ang alingawngaw ng Daniel 7, at ang likas na interpretatibong tensiyon ng parirala.
- issue: Diwa ng ἐξουσία kaugnay ng pagpapatawad ng mga kasalanan
  choice: awtoridad
  alternative: kapangyarihan
  rationale: Nakasentro ang pagtatalo sa lehitimong karapatan ni Jesus na magpatawad, hindi lamang sa kakayahan niyang gumawa ng himala.
- issue: Saklaw ng ἐπὶ τῆς γῆς
  choice: sa lupa
  alternative: sa makalupang daigdig
  rationale: Ang payak na lokatibong salin ay nagpapanatili sa pahayag ng teksto nang hindi ipinapasok ang isang mas tiyak na paliwanag tungkol sa mga saklaw o daigdig.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “awtoridad” upang maiba ang lehitimong kapamahalaan sa hubad na lakas, at “higaan” upang hindi labis na tukuyin ang anyo ng κλινίδιον. Ang mga gitling ay nagpapanatili sa biglang pagsingit ng salaysay sa loob ng sinabi ni Jesus.
