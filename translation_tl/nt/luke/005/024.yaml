review_pass:
  verdict: revise
  source_fidelity: 'Tumpak sa kabuuan ang salin: naipapahayag nito ang layuning ipinahihiwatig ng ἵνα, ang awtoridad (ἐξουσία) ng Anak ng Tao na magpatawad, at ang magkakasunod na utos na bumangon, buhatin ang higaan, at umuwi. Gayunman, may maling estruktura ng panipi sa kasalukuyang teksto: walang pambukas na panipi bago ang unang pahayag ngunit may panara, samantalang ang Griyego ay may pagsingit ng tagapagsalaysay bago ang tuwirang utos.'
  naturalness: Natural at marangal ang “may awtoridad,” “lalaking paralisado,” at “umuwi ka.” Ang “Buhatin mo ang iyong higaan” ay malinaw at akma sa maliit na higaan o banig na tinutukoy ng κλινίδιον.
  terminology: Ang “Anak ng Tao,” “awtoridad,” at “mga kasalanan” ay angkop at nagpapanatili ng mahalagang terminolohiya at saklaw ng pinagmulan. Ang talababa sa Anak ng Tao ay inayos upang hindi iharap ang “ang Tao” bilang labis na tiyak na katumbas ng titulo.
  issues:
