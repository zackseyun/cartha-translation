  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔλεγεν δὲ καὶ παραβολὴν πρὸς αὐτοὺς ὅτι Οὐδεὶς ἐπίβλημα ⸀ἀπὸ ἱματίου καινοῦ ⸀σχίσας ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν· εἰ δὲ μήγε, καὶ τὸ καινὸν ⸀σχίσει καὶ τῷ παλαιῷ οὐ ⸂συμφωνήσει τὸ ἐπίβλημα⸃ τὸ ἀπὸ τοῦ καινοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/036.yaml
  text: 'He was also telling them a parable: “No one tears a patch from a new garment and puts it on an old garment[a]. Otherwise, he will tear the new one[b], and the patch from the new will not match the old.”'
translation:
  language: tl
  text: 'Nagsalaysay rin siya sa kanila ng isang talinghaga: “Walang pumupunit ng isang tagpi mula sa bagong damit at inilalagay iyon sa lumang damit.[a] Kung gagawin iyon, pupunitin din niya ang bagong damit, at ang tagpi mula sa bagong damit ay hindi babagay sa luma.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “Walang sinumang, matapos pumunit ng isang tagpi mula sa bagong damit, ang naglalagay nito sa lumang damit.” Nauuna sa pangunahing pandiwa ang aorist participle na σχίσας (“matapos pumunit”).'
    reason: lexical_alternative
  - marker: b
    text: Ang “hindi babagay” ay maaari ring isaling “hindi aangkop” o “hindi tutugma.” Ang pandiwang Griyego ay nagpapahiwatig ng kawalan ng pagkakatugma o kaangkupan ng tagpi sa lumang damit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ καὶ
  choice: Nagsalaysay rin siya
  rationale: Ipinahihiwatig ng imperpektong ἔλεγεν ang nagpapatuloy na pagsasalita sa salaysay; natural na naipapahayag ito sa Filipino bilang “nagsalaysay,” habang ang καὶ ay kinakatawan ng “rin.”
- source_word: παραβολὴν
  choice: isang talinghaga
  rationale: Ang “talinghaga” ang karaniwan at marangal na salin ng παραβολή sa kontekstong biblikal.
- source_word: ἐπίβλημα
  choice: isang tagpi
  rationale: Sa konteksto ng damit, tumutukoy ito sa pirasong ginagamit na pantagpi; malinaw at likas sa Filipino ang “tagpi.”
- source_word: ἱματίου καινοῦ / ἱμάτιον παλαιόν
  choice: bagong damit / lumang damit
  rationale: Sapat na malawak at natural ang “damit” para sa ἱμάτιον, nang hindi ito nililimitahan sa isang tiyak na uri ng kasuotan.
- source_word: σχίσας ἐπιβάλλει
  choice: pumupunit ... at inilalagay
  rationale: Ginagawang likas na magkaugnay na pandiwa sa Filipino ang aorist participle at pangunahing pandiwa, habang pinananatili ang lohikal na ayos ng mga kilos.
- source_word: εἰ δὲ μήγε
  choice: Kung gagawin iyon
  rationale: Ipinahahayag nito nang malinaw ang kasunod na bunga ng ipinagpalagay na kilos, sa natural na Filipino.
- source_word: καὶ τὸ καινὸν σχίσει
  choice: mapupunit din niya ang bagong damit
  rationale: Pinananatili ang aktibong diwa at ang ipinahiwatig na taong gumagawa ng pagpunit; nililinaw ng “bagong damit” ang reperensiya.
- source_word: οὐ συμφωνήσει
  choice: hindi babagay
  rationale: Sa konteksto ng damit, saklaw ng “babagay” ang kawalan ng pagkakatugma o kaangkupan nang hindi ipinipilit kung kulay, anyo, o sukat ang tinutukoy.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “talinghaga,” “tagpi,” at “damit” bilang mga salitang karaniwan at madaling maunawaan. Pinanatili ang bahagyang kalabuan ng συμφωνέω sa pamamagitan ng “babagay,” at hindi idinagdag na itinatahi ang tagpi sapagkat “inilalagay” lamang ang tahasang sinasabi ng Griyego.
