  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ μὴ εὑρόντες ποίας εἰσενέγκωσιν αὐτὸν διὰ τὸν ὄχλον ἀναβάντες ἐπὶ τὸ δῶμα διὰ τῶν κεράμων καθῆκαν αὐτὸν σὺν τῷ κλινιδίῳ εἰς τὸ μέσον ἔμπροσθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/019.yaml
  text: And not finding a way to bring him in because of the crowd[a], they went up on the roof and lowered him with his mat through the tiles into the middle[c][b], in front of Jesus.
translation:
  language: tl
  text: Nang wala silang makitang paraan upang maipasok siya dahil sa dami ng tao[a], umakyat sila sa bubong at ibinaba siya, kasama ang kanyang higaan[c], sa pamamagitan ng mga tisa sa bubong[b], tungo sa gitna, sa harap ni Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang hindi nila malaman kung paano siya maipapasok dahil sa dami ng tao.” Maaaring idiin ng pananalitang Griyego ang paraan o ang dadaanan.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, idinaan nila siya sa mga tisa sa bubong. Sumasalamin ang pananalita ni Lucas sa isang bubong na natatakpan ng mga tisa.
    reason: cultural_note
  - marker: c
    text: Maaari ring “munting higaan” o “higaang pambuhat.” Ang salitang Griyego ay tumutukoy sa isang maliit na higaan o sapin na hinihigaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίας
  choice: paraan
  rationale: Sa pariralang ito, patanong at eliptikal ang ποίας at tumutukoy sa paraan o dadaanan ng pagpapasok. Likas sa modernong Tagalog ang “makitang paraan,” habang pinananatili ang posibleng diin sa pamamaraan o ruta.
- source_word: εἰσενέγκωσιν
  choice: maipasok siya
  rationale: Ipinahihiwatig ng pandiwa ang pagdadala sa isang tao papasok. Sapat na ipinakikita ng konteksto na binubuhat siya, kaya hindi na kailangang idagdag iyon sa pandiwa.
- source_word: διὰ τὸν ὄχλον
  choice: dahil sa dami ng tao
  rationale: Ang διά na may akusatibo ay sanhi ang kahulugan dito. Ang “dami ng tao” ay mas natural sa Tagalog kaysa sa literal na “pulutong” bilang paglalarawan sa humahadlang sa pagpasok.
- source_word: ἀναβάντες ἐπὶ τὸ δῶμα
  choice: umakyat sila sa bubong
  rationale: Malinaw at natural itong nagpapahayag ng pag-akyat sa ibabaw ng bahay nang hindi nagdaragdag ng di-tiyak na detalye tungkol sa anyo ng bubong.
- source_word: διὰ τῶν κεράμων
  choice: sa pagitan ng mga tisa ng bubong
  rationale: Ang κέραμος ay tumutukoy sa mga tisang pantakip sa bubong. Ipinakikita ng “sa pagitan” na doon nila siya idinaan, nang hindi tahasang nagdaragdag na gumawa sila ng butas.
- source_word: καθῆκαν
  choice: ibinaba nila
  rationale: Tuwirang inilalarawan nito ang pagpapababa mula sa bubong tungo sa silid.
- source_word: σὺν τῷ κλινιδίῳ
  choice: kasama ang kanyang higaan
  rationale: Ang κλινίδιον ay isang maliit na higaan o sapin na maaaring paghatian o pagbuhatan. Hindi gaya ng “banig” o “estretser,” hindi nililimitahan ng “higaan” ang materyal o gamit nito.
- source_word: εἰς τὸ μέσον
  choice: tungo sa gitna
  rationale: Pinananatili nito ang galaw patungo sa gitnang bahagi ng pagtitipon, ayon sa εἰς.
- source_word: ἔμπροσθεν τοῦ Ἰησοῦ
  choice: sa harap ni Jesus
  rationale: Malinaw na spatial ang kahulugan at natural ito sa kasalukuyang Tagalog.
