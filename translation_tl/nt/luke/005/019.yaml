  naturalness: Makabago at malinaw ang karamihan ng salin. Mas natural ang “mga tisa sa bubong” kaysa “mga tisa ng bubong,” at mas maayos na ilapit ang pariralang ito sa kilos na “ibinaba” sa halip na gawin itong nakabukod na pangungusap.
