  yaml_path: translation/nt/luke/005/006.yaml
  text: And when they had done this[a], they enclosed a great multitude of fish[b], and their nets were tearing.
translation:
  language: tl
  text: Nang magawa nila iyon, napalibutan nila ng mga lambat ang napakaraming isda[a], at napupunit na ang kanilang mga lambat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakahuli sila ng napakaraming isda.” Ang pandiwang Griyego ay mas literal na nangangahulugang “pinalibutan” o “ikinulong,” na naglalarawan sa mga isdang napalibutan ng mga lambat.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagsisimula nang mapunit ang kanilang mga lambat.” Inilalarawan ng imperpektibong pandiwang Griyego ang pagpunit bilang nagaganap noon, hindi bilang tiyak nang lubusang natapos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες
  choice: Nang magawa nila iyon
  rationale: Ginawang temporal ang aorist participle upang natural na ipakita sa Filipino na isinagawa muna nila ang iniutos bago naganap ang paghuli.
- source_word: συνέκλεισαν
  choice: napalibutan nila sa mga lambat
  rationale: Pinananatili nito ang larawan ng mga isdang nakulong o napalibutan, sa halip na gawing payak lamang na “nahuli.” Idinagdag ang “sa mga lambat” bilang likas na paglilinaw mula sa konteksto.
- source_word: πλῆθος ἰχθύων πολύ
  choice: ang napakaraming isda
  rationale: Likas at mariing paraan ito sa modernong Tagalog upang maipahayag ang napakalaking dami na diin ng πλῆθος at πολύ.
- source_word: διερρήσσετο
  choice: nagsisimula nang mapunit
  rationale: Ipinahahayag ng imperfect ang prosesong nagaganap at hindi kinakailangang lubusang pagkapunit; malinaw itong naihahatid ng “nagsisimula nang mapunit.”
- source_word: τὰ δίκτυα αὐτῶν
  choice: ang kanilang mga lambat
  rationale: Pinananatili ang tahasang maramihang bilang ng δίκτυα at ang pagmamay-ari na ipinahahayag ng αὐτῶν.
