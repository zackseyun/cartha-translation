  text: καὶ ἤρξαντο διαλογίζεσθαι οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι λέγοντες· Τίς ἐστιν οὗτος ὃς λαλεῖ βλασφημίας; τίς δύναται ⸂ἁμαρτίας ἀφεῖναι⸃ εἰ μὴ μόνος ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/021.yaml
  text: And the scribes and the Pharisees began to reason among themselves, saying, “Who is this who speaks blasphemies? Who can forgive sins except God alone?”
translation:
  language: tl
  text: 'At nagsimulang mag-isip-isip ang mga eskriba at mga Pariseo: “Sino ba ito na nagsasalita ng mga kalapastanganan? Sino ang makapagpapatawad ng mga kasalanan kundi ang Diyos lamang?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξαντο διαλογίζεσθαι
  choice: nagsimulang mag-isip-isip
  rationale: Ipinapahayag ng ἤρξαντο + infinitive ang pagsisimula ng kilos. Maaaring tumukoy ang διαλογίζεσθαι sa panloob na pag-iisip, pangangatwiran, o pag-uusap; pinananatili ng “mag-isip-isip” ang mapanuring pagninilay nang hindi tiyak na ginagawang hayagang pagtatalo.
- source_word: γραμματεῖς
  choice: mga eskriba
  rationale: Karaniwang katawagan sa mga kinikilalang dalubhasa at tagapagpaliwanag ng Kautusan sa konteksto ng mga Ebanghelyo; mas tuwirang tumutugma ito sa katawagang Griyego kaysa sa paliwanag na “mga tagapagturo ng Kautusan.”
- source_word: Φαρισαῖοι
  choice: mga Pariseo
  rationale: Ito ang nakagawiang modernong Tagalog na anyo ng pangalan ng pangkat.
- source_word: λαλεῖ βλασφημίας
  choice: nagsasalita ng mga kalapastanganan
  rationale: Pinananatili ang maramihang anyo ng βλασφημίας at ang paratang na ang sinasabi niya ay lumalapastangan sa Diyos.
- source_word: Τίς ἐστιν οὗτος
  choice: Sino ba ito
  rationale: Hindi idinagdag ang “tao,” na wala sa Griyego. Ang “ba” ay natural na naghahatid ng matalas at mapanuring tono ng tanong.
- source_word: ἁμαρτίας ἀφεῖναι
  choice: makapagpapatawad ng mga kasalanan
  rationale: Ang ἀφίημι kasama ng ἁμαρτίας ay karaniwang idyoma para sa pagpapatawad ng mga kasalanan; malinaw at likas sa Tagalog ang napiling anyo.
- source_word: εἰ μὴ μόνος ὁ θεός
  choice: maliban sa Diyos lamang
  rationale: Malinaw na pinananatili ang diwang eksepsiyon at ang pagiging bukod-tangi ng Diyos na ipinahahayag ng μόνος.
theological_decisions:
- issue: Pahiwatig tungkol sa awtoridad ni Jesus na magpatawad ng mga kasalanan
  choice: Tuwirang ihayag ang pagtutol na Diyos lamang ang makapagpapatawad ng mga kasalanan.
  alternative: Dagdagan ang talata upang tahasang ipaliwanag ang kristolohikal na konklusyon, o pahinain ang eksklusibong pahayag.
  rationale: Ang talata ay naglalahad ng pangangatwiran ng mga eskriba at mga Pariseo. Pinananatili ng salin ang teolohikal na tensiyon at pahiwatig sa salaysay ni Lucas nang hindi nagdaragdag ng konklusyong hindi tahasang sinabi rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang katawagang “eskriba” bilang terminong pangkasaysayan, at ginamit ang “mag-isip-isip” upang hindi lubusang lutasin kung panloob lamang o naipahayag sa isa’t isa ang kanilang pangangatwiran.
