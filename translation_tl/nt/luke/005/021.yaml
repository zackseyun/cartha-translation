  to: 'At nagsimulang mag-isip-isip ang mga eskriba at mga Pariseo: “Sino ba ito na nagsasalita ng mga kalapastanganan? Sino ang makapagpapatawad ng mga kasalanan kundi ang Diyos lamang?”'
