    issue: Ang “Sinabi nila” ay hiwalay na pangungusap mula sa “nagsimulang mag-isip-isip.”
    rationale: Ang λέγοντες ay kaugnay ng kanilang pagsisimulang pagninilay/pangangatwiran. Ang tutuldok ay mas natural na nag-uugnay sa dalawang bahagi at pinananatili ang bahagyang di-katiyakan kung panloob na pag-iisip o binigkas na pagtutol ito.
  - severity: low
    issue: “maliban sa Diyos lamang”
    rationale: Bagaman nauunawaan, mas tuwiran at likas ang “kundi ang Diyos lamang,” na malinaw na naghahayag ng eksepsiyon at ng diin ng μόνος.
