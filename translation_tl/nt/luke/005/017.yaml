source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἦν διδάσκων, καὶ ἦσαν καθήμενοι Φαρισαῖοι καὶ νομοδιδάσκαλοι οἳ ἦσαν ἐληλυθότες ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ· καὶ δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/017.yaml
  text: And it happened on one of those days that he was teaching[a], and Pharisees and teachers of the law were sitting there, who had come from every village of Galilee and Judea and from Jerusalem; and the power of the Lord was there for him to heal.
translation:
  language: tl
  text: Isang araw, habang nagtuturo si Jesus, may nakaupong mga Pariseo at mga tagapagturo ng Kautusan na nagmula sa bawat nayon sa Galilea at Judea, at mula sa Jerusalem. Naroon ang kapangyarihan ng Panginoon upang magpagaling si Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang manuskrito na ang mababasa ay “upang pagalingin niya sila” sa halip na “upang magpagaling si Jesus.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν μιᾷ τῶν ἡμερῶν
  choice: Isang araw
  rationale: Likas at maikli itong panimulang pormula sa makabagong Tagalog at naihahatid ang paglipat ni Lucas sa isang pangyayari nang hindi gumagamit ng makalumang pananalita.
- source_word: αὐτὸς ἦν διδάσκων
  choice: habang nagtuturo si Jesus
  rationale: Ipinahahayag ng “habang nagtuturo” ang nagpapatuloy na kilos ng periphrastic imperfect. Ginawang tahasan ang pangalang Jesus para sa kalinawan sa Tagalog, nang walang pagdaragdag ng diin sa αὐτός.
- source_word: καθήμενοι
  choice: naroon at nakaupo
  rationale: Inilalarawan nito ang matatag na presensiya nila sa tagpo at natural itong pakinggan sa Tagalog.
- source_word: Φαρισαῖοι
  choice: mga Pariseo
  rationale: Ito ang kinikilalang anyong Tagalog para sa grupong Judio.
- source_word: νομοδιδάσκαλοι
  choice: mga tagapagturo ng Kautusan
  rationale: Tuwirang ipinapahayag ang tungkulin nilang magturo ng Kautusan; ang malaking titik ay tumutukoy sa Kautusan ni Moises sa konteksto.
- source_word: ἐληλυθότες
  choice: Galing sila
  rationale: 'Natural na ipinahahayag sa Tagalog ang naunang pagdating na may kasalukuyang bunga: naroon na sila sa tagpo.'
- source_word: ἐκ πάσης κώμης
  choice: mula sa bawat nayon
  rationale: Pinananatili ng “bawat” ang distributibong puwersa ng πάσης at ng “nayon” ang diwang rural na pamayanan ng κώμη.
- source_word: Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: ng Galilea at Judea, at mula sa Jerusalem
  rationale: Nililinaw ng ikalawang “mula sa” na lungsod ang Jerusalem samantalang mga rehiyon ang Galilea at Judea.
- source_word: δύναμις κυρίου
  choice: ang kapangyarihan ng Panginoon
  rationale: Pinananatili ang genitibong ugnayan at ang teolohikal na bigat ng banal na kapangyarihang kumikilos.
- source_word: ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: naroon ... upang siya ay magpagaling
  rationale: Ipinahahayag ng “upang” ang layunin o kinalabasan ng εἰς τὸ at itinuturing ang αὐτόν bilang simuno ng pagpapagaling, nang hindi nagdaragdag ng tahasang layon na wala sa tekstong SBLGNT.
theological_decisions:
- issue: Ang tinutukoy at puwersa ng δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: Ang kapangyarihan ng Panginoon ay naroon upang si Jesus ay magpagaling.
  alternative: Ang kapangyarihan ng Panginoon ay naroon upang pagalingin niya sila; o nasa kanya ang kapangyarihan ng Panginoon para magpagaling.
  rationale: Ang ibinigay na tekstong Griyego ay may αὐτόν, na maaaring magsilbing akusatibong simuno ng articular infinitive, sa halip na plural na layon. Kaya hindi inilalagay ang “sila” sa pangunahing teksto. Hindi rin ginawang “nasa kanya” ang parirala upang hindi paliitin ang tunay na saklaw ng ἦν.
- issue: Referente ng κυρίου
  choice: Panginoon
  alternative: Diyos
  rationale: Pinananatili ng “Panginoon” ang katawagan at ang posibleng teolohikal na resonansiya nang hindi ginagawang mas tiyak ang referente kaysa sa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa tatlong pangungusap ang mahabang pangungusap na Griyego upang madaling maunawaan, habang pinananatili ang pagkakasunod-sunod at ugnayan ng mga ideya. Ginamit ang “Kautusan” bilang kinikilalang katawagan sa Kautusan ni Moises.
