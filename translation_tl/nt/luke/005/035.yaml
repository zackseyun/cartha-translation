  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι, καὶ ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος τότε νηστεύσουσιν ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/035.yaml
  text: But days will come[a], and when the bridegroom is taken away from them, then they will fast in those days.
translation:
  language: tl
  text: Ngunit darating ang mga araw, at kapag inalis mula sa kanila ang lalaking ikakasal,[a] saka sila mag-aayuno sa mga araw na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inalis mula sa kanila.” Ipinahihiwatig ng pandiwang Griyego na ang lalaking ikakasal ay inalis, hindi lamang kusang umalis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται ... ἡμέραι
  choice: darating ang mga araw
  rationale: Pinananatili nito ang idyomang Griyego at ang tanaw nito sa hinaharap sa natural na anyong Tagalog.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat sa kasalukuyang kalagayan sa naunang konteksto.
- source_word: ὅταν
  choice: kapag
  rationale: Natural na ipinakikilala ng “kapag” ang tiyak na pangyayaring inaasahan sa hinaharap.
- source_word: ἀπαρθῇ
  choice: inalis na
  rationale: Pinananatili ang balintiyak at ang diwang may ibang kumikilos upang alisin ang lalaking ikakasal, sa halip na kusa lamang siyang umalis.
- source_word: ἀπ’ αὐτῶν
  choice: sa kanila
  rationale: Malinaw na ipinapahayag ang pagkakahiwalay niya sa mga kasama niya nang hindi nagdaragdag ng paliwanag.
- source_word: ὁ νυμφίος
  choice: ang lalaking ikakasal
  rationale: Ito ang malinaw at karaniwang makabagong Tagalog para sa lalaking nasa larawan ng kasalan.
- source_word: τότε
  choice: saka
  rationale: Likas na ipinapakita ng “saka” ang kasunod na pangyayari matapos alisin ang lalaking ikakasal.
- source_word: νηστεύσουσιν
  choice: sila mag-aayuno
  rationale: Tumpak na pinananatili ang relihiyosong kahulugan ng νηστεύω.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: sa mga araw na iyon
  rationale: Pinananatili ang pag-uulit sa Griyego, na nagbibigay-diin sa panahong darating.
theological_decisions:
- issue: Kung palalambutin ang balintiyak na ἀπαρθῇ bilang kusang pag-alis
  choice: inalis na sa kanila ang lalaking ikakasal
  alternative: umalis na sa kanila ang lalaking ikakasal
  rationale: Ang balintiyak na pandiwa ay nagpapahiwatig na may nag-alis sa lalaking ikakasal. Pinananatili nito ang mabigat at mapanghiwatig na tono nang hindi tahasang ipinapaliwanag ang kaugnayan nito sa kamatayan ni Jesus.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang istruktura at pag-uulit ng Griyego hangga't natural sa Tagalog; ginamit ang “lalaking ikakasal” sa halip na mas luma o di-gaanong karaniwang katawagan.
