  text: καὶ ἔκστασις ἔλαβεν ἅπαντας καὶ ἐδόξαζον τὸν θεόν, καὶ ἐπλήσθησαν φόβου λέγοντες ὅτι Εἴδομεν παράδοξα σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/026.yaml
  text: And amazement seized them all[a], and they were glorifying God, and they were filled with fear, saying, “We have seen extraordinary things today.”
translation:
  language: tl
  text: At sinaklot ng pagkamangha ang lahat, at patuloy nilang niluluwalhati ang Diyos. Napuspos sila ng takot at sinabi, “Nakakita tayo ngayong araw ng mga bagay na hindi pangkaraniwan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kahanga-hangang bagay” o “mga kakaibang bagay”; tumutukoy ang Griyego sa mga bagay na lampas sa karaniwang inaasahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκστασις ἔλαβεν ἅπαντας
  choice: namangha silang lahat
  rationale: Likas sa modernong Tagalog at malinaw na ipinapahayag ang matinding pagkamangha ng lahat; iniiwasan ang “ekstasis,” na maaaring magpahiwatig ng mistikong kalagayan.
- source_word: ἐδόξαζον
  choice: patuloy nilang niluluwalhati
  rationale: Pinananatili ng “patuloy” ang diwang nagpapatuloy o paulit-ulit na kilos ng imperfect, at malapit ang “niluluwalhati” sa δοξάζω.
- source_word: τὸν θεόν
  choice: ang Diyos
  rationale: Karaniwang salin ng θεός sa kontekstong ito.
- source_word: ἐπλήσθησαν φόβου
  choice: Napuspos sila ng takot
  rationale: Tuwirang pinananatili ang larawan ng pagkapuspos at ang lakas ng φόβος bilang takot, nang hindi ito pinalalambot bilang pagkamangha lamang.
- source_word: λέγοντες
  choice: at sinabi
  rationale: Natural na Tagalog na nag-uugnay sa kanilang reaksyon sa kasunod na tuwirang pahayag.
- source_word: Εἴδομεν
  choice: Nakakita tayo
  rationale: Ang pangnagdaang kilos ay inilalahad bilang agarang patotoo ng pangkat sa bagay na nasaksihan nila; likas sa Tagalog ang anyong ito.
- source_word: παράδοξα
  choice: mga bagay na di-pangkaraniwan
  rationale: Ipinahahayag ang mga bagay na lampas sa karaniwang inaasahan nang hindi nagdadala ng negatibong diwa na maaaring taglayin ng “kakaiba.”
- source_word: σήμερον
  choice: ngayon
  rationale: Sa Tagalog, natural ang “ngayon” para sa σήμερον sa agarang pahayag tungkol sa nasaksihan sa araw na iyon.
theological_decisions:
- issue: Diwa ng φόβος bilang tugon sa pagkilos ng Diyos
  choice: takot
  alternative: matinding pagkamangha; pagpipitagan
  rationale: Pinananatili ng “takot” ang tensiyon sa teksto sa pagitan ng pangamba, pagpipitagan, at pagsamba, sa halip na paliitin ito sa isang mas banayad na damdamin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “patuloy” upang maipakita ang aspektong imperfect, samantalang ang maiikling sugnay ay nagpapanatili ng mabilis at masidhing reaksiyon ng karamihan.
