  text: Οἱ δὲ εἶπαν πρὸς αὐτόν· ⸀Οἱ μαθηταὶ Ἰωάννου νηστεύουσιν πυκνὰ καὶ δεήσεις ποιοῦνται, ὁμοίως καὶ οἱ τῶν Φαρισαίων, οἱ δὲ σοὶ ἐσθίουσιν καὶ πίνουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/033.yaml
  text: And they said to him[a], “John’s disciples fast often and make prayers; likewise also those of the Pharisees[b], but yours eat and drink.”
translation:
  language: tl
  text: At sinabi nila sa kanya, “Ang mga alagad ni Juan ay madalas mag-ayuno at manalangin; gayundin ang mga alagad ng mga Pariseo[a]. Ngunit ang iyong mga alagad[b] ay kumakain at umiinom.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal sa Griyego, “ang sa mga Pariseo”; ipinahihiwatig mula sa naunang sugnay ang “mga alagad.”
    reason: lexical_alternative
  - marker: b
    text: Literal sa Griyego, “ang sa iyo”; nauunawaan mula sa konteksto ang “mga alagad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ εἶπαν πρὸς αὐτόν
  choice: At sinabi nila sa kanya
  rationale: Ang δέ ay banayad na pang-ugnay; natural sa salaysay ang “At” nang hindi pinatitindi ang pagsalungat.
- source_word: μαθηταὶ Ἰωάννου
  choice: ang mga alagad ni Juan
  rationale: Malinaw at likas na ipinahahayag ng “ni Juan” ang ugnayang nasa genitive.
- source_word: νηστεύουσιν πυκνά
  choice: madalas mag-ayuno
  rationale: Ang πυκνά ay pang-abay na nagsasaad ng dalas; ang “madalas” ay karaniwan at tumpak.
- source_word: δεήσεις ποιοῦνται
  choice: manalangin
  rationale: Sa modernong Tagalog, ang literal na “gumagawa ng mga panalangin” ay hindi likas; malinaw na ipinahahayag ng “manalangin” ang gawaing debosyonal, kasabay ng pag-aayuno.
- source_word: ὁμοίως καὶ
  choice: gayundin
  rationale: Natural na naihahatid ng “gayundin” ang paghahambing at pagdaragdag nang hindi mabigat ang pananalita.
- source_word: οἱ τῶν Φαρισαίων
  choice: ang sa mga Pariseo
  rationale: Pinananatili nito ang elipsis ng Griyego, kung saan ipinahihiwatig mula sa naunang sugnay ang “mga alagad.”
- source_word: οἱ δὲ σοὶ
  choice: ngunit ang sa iyo
  rationale: Pinananatili ang maikli at elliptikal na anyo ng Griyego habang ipinakikita ang malinaw na pagsalungat.
- source_word: ἐσθίουσιν καὶ πίνουσιν
  choice: kumakain at umiinom
  rationale: Ang aspektong imperpektibo ng mga pandiwang pangkasalukuyan ay likas na naihahayag sa Tagalog sa “kumakain at umiinom,” na tumutukoy sa kinaugaliang gawain.
theological_decisions:
- issue: Kung tahasang idaragdag ang “mga alagad” sa ikalawa at ikatlong pagtukoy
  choice: Panatilihin sa pangunahing teksto ang elipsis bilang “ang sa mga Pariseo” at “ang sa iyo,” na may mga talababa para sa ipinahihiwatig na kahulugan.
  alternative: Isulat nang tahasan ang “mga alagad ng mga Pariseo” at “ang iyong mga alagad.”
  rationale: Hindi ito usaping doktrinal, ngunit ang pagpapanatili ng elipsis ay higit na tapat sa estruktura ng Griyego. Nililinaw ng mga talababa ang kahulugan nang hindi tahimik na pinupunan ang teksto.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit payak na himig. Ginamit ang “alagad,” “mag-ayuno,” at “manalangin” bilang mga terminong pamilyar sa karaniwang mambabasa. Inilagay ang bawat marker sa mismong bahaging nililinaw nito.
