  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀Σίμων ⸀εἶπεν· Ἐπιστάτα, δι’ ⸀ὅλης νυκτὸς κοπιάσαντες οὐδὲν ἐλάβομεν, ἐπὶ δὲ τῷ ῥήματί σου χαλάσω ⸂τὰ δίκτυα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/005.yaml
  text: And Simon answered[a], “Master, we worked hard all night and caught nothing[b]; but at your word I will let down the nets.”
translation:
  language: tl
  text: Sumagot si Simon, “Guro, magdamag kaming nagpagal[a] at wala kaming nahuli; ngunit sa salita mo[b], ibababa ko ang mga lambat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagpakahirap.” Idinidiin ng salitang Griyego ang matindi at nakapapagod na pagsisikap.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “dahil sa sinabi mo” o “dahil sa utos mo.” Ang pariralang Griyego ay tumutukoy sa salita ni Jesus bilang batayan ng pagkilos ni Simon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: Sumagot
  rationale: Karaniwang idyomang Griyego ito sa pagpapakilala ng tuwirang pananalita. Likas sa modernong Filipino ang isang pandiwang “sumagot” sa halip na ang matigas na “sumagot at sinabi.”
- source_word: Ἐπιστάτα
  choice: Guro
  rationale: Sa Lucas, kinikilala ng katawagang ito ang awtoridad ni Jesus. Ang “Guro” ay likas na pantawag sa kaniya sa Filipino at hindi nag-aangkat ng mas tiyak na teolohikal na bigat ng κύριος (“Panginoon”), bagaman hindi nito ganap na natutumbasan ang diwa ng tagapangasiwa o pinuno.
- source_word: δι’ ὅλης νυκτός
  choice: magdamag
  rationale: Likas at maikli itong katumbas ng paggawa sa buong magdamag.
- source_word: κοπιάσαντες
  choice: nagpagal
  rationale: Ipinahihiwatig ng pandiwa ang mabigat at nakapapagod na pagsisikap. Pinananatili ng “nagpagal” ang diin nang hindi humahaba ang pangungusap.
- source_word: οὐδὲν ἐλάβομεν
  choice: wala kaming nahuli
  rationale: Sa konteksto ng pangingisda, ang λαμβάνω ay tumutukoy sa paghuli. Likas sa Filipino ang negatibong pagkakabuo na ito.
- source_word: ἐπὶ δὲ τῷ ῥήματί σου
  choice: Pero dahil sa sinabi mo
  rationale: Ipinapahayag ng ἐπί kasama ng datibo ang batayan o dahilan ng gagawing kilos. Likas ang “dahil sa sinabi mo” at hindi nito labis na tinutukoy kung payo, salita, o utos ang tinutukoy.
- source_word: χαλάσω
  choice: ibababa ko
  rationale: Ang panghinaharap na isahan ay tumutukoy sa pagbaba ng mga lambat sa tubig; pinananatili ng “ko” ang isahang anyo.
- source_word: τὰ δίκτυα
  choice: ang mga lambat
  rationale: Malinaw na pinananatili ng “mga” ang maramihang bilang ng tekstong SBLGNT.
- source_word: δὲ
  choice: Pero
  rationale: Ipinakikita nito ang banayad na pagsalungat sa pagitan ng bigong magdamag na paggawa at ng kahandaang kumilos ayon sa sinabi ni Jesus.
theological_decisions:
- issue: Pagbibigay-kahulugan sa katawagang Ἐπιστάτα para kay Jesus
  choice: Guro
  alternative: Panginoon; Pinuno; Amo
  rationale: Hindi κύριος ang ginamit ng Griyego. Iniiwasan ng “Guro” ang maagang pagpasok ng buong teolohikal na bigat ng “Panginoon,” habang ipinahihiwatig pa rin ang kinikilalang awtoridad ni Jesus. Ang “Pinuno” at “Amo” ay mas literal sa ilang bahagi ng kahulugan ngunit hindi likas na pantawag sa kontekstong ito.
- issue: Batayan ng pagsunod ni Simon sa ἐπὶ τῷ ῥήματί σου
  choice: dahil sa sinabi mo
  alternative: sa salita mo; dahil sa utos mo
  rationale: Pinananatili ng napili ang malawak na diwa ng ῥῆμα at ang batayan ng pagkilos nang hindi ipinapalagay na tahasang “utos” ang salita ni Jesus.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “magdamag,” “wala kaming nahuli,” at “ibababa ko” para sa malinaw na daloy; pinanatili ang isahang nagsasalita sa “ko” at ang maramihang “mga lambat.”
