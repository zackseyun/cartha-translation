  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτούς· Οὐ χρείαν ἔχουσιν οἱ ὑγιαίνοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/031.yaml
  text: And Jesus answered them[a], “Those who are healthy have no need of a physician, but those who are sick do.”
translation:
  language: tl
  text: Sumagot si Jesus sa kanila, “Hindi ang malulusog ang nangangailangan ng manggagamot, kundi ang mga maysakit.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν πρὸς αὐτούς
  choice: Sumagot si Jesus sa kanila
  rationale: Ang participle at pandiwang pantukoy sa pagsasalita ay isang karaniwang pormulang pasalaysay. Ang “Sumagot ... sa kanila” ay natural sa Tagalog at pinananatili ang diwang tugon at ang mga kausap.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: Hindi ... ang nangangailangan
  rationale: Likas na Tagalog ito para sa literal na diwang “walang pangangailangan,” at malinaw na iniuugnay ang pangangailangan sa manggagamot.
- source_word: οἱ ὑγιαίνοντες
  choice: ang malulusog
  rationale: Tumutukoy ang substantival present participle sa uri ng mga taong nasa mabuting kalagayang pangkalusugan. Maikli, natural, at malinaw ang “ang malulusog.”
- source_word: ἰατροῦ
  choice: ng manggagamot
  rationale: Ang “manggagamot” ay dignidad at madaling maunawaang katumbas ng ἰατρός, at ang anyong walang tiyak na pantukoy ay angkop sa pangkalahatang kasabihan.
- source_word: οἱ κακῶς ἔχοντες
  choice: ang mga maysakit
  rationale: Idyoma ang κακῶς ἔχειν para sa pagiging may sakit. Ang “mga maysakit” ang natural at tuwirang katumbas sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang maikli at kawikaang paghahambing ng Griyego nang hindi dinaragdagan ang teolohikal na aplikasyon mula sa kasunod na talata.
