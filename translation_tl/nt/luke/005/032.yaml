  source_fidelity: 'Tapat ang salin sa Griyego: naipapahayag ng “Hindi ako naparito” ang οὐκ ἐλήλυθα, ng “upang tawagin” ang infinitibong layunin na καλέσαι, at pinananatili ang walang interpretibong kwalipikasyon sa magkatapat na “mga matuwid” at “mga makasalanan.” Ang “tungo sa pagsisisi” ay wastong nagsasaad ng εἰς μετάνοιαν bilang layunin o tunguhin.'
  naturalness: Likas at malinaw ito sa modernong Filipino Tagalog, na may marangal na rehistrong angkop sa direktang pahayag ni Jesus. Ang “naparito” ay bahagyang pormal ngunit hindi makaluma at angkop sa ganitong rehistro.
  terminology: Ang “matuwid,” “makasalanan,” at “pagsisisi” ay mga matatag at angkop na katawagang Filipino. Hindi pinipilit ng “pagsisisi” ang isang partikular na doktrinal na pagpapaliwanag, habang sapat nitong nasasaklaw ang karaniwang saklaw ng μετάνοια sa kontekstong ito.
