id: LUK.5.32
reference: Luke 5:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐκ ἐλήλυθα καλέσαι δικαίους ἀλλὰ ἁμαρτωλοὺς εἰς μετάνοιαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/032.yaml
  text: I have not come to call the righteous, but sinners to a change of mind.
translation:
  language: tl
  text: Hindi ako naparito upang tawagin ang mga matuwid, kundi ang mga makasalanan tungo sa pagsisisi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang magsisi.” Ipinapahayag ng pariralang Griyego na εἰς μετάνοιαν ang layunin o tunguhin.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐλήλυθα
  choice: Hindi ako naparito
  rationale: Ang perfect na ἐλήλυθα ay tumutukoy sa pagparito ni Jesus na may nagpapatuloy na kabuluhan sa kasalukuyan. Likas sa Filipino ang “naparito” sa pahayag tungkol sa layunin ng misyon, at malinaw na saklaw ito ng negasyong οὐκ.
- source_word: καλέσαι
  choice: upang tawagin
  rationale: Ang aorist infinitive ay nagpapahayag ng layunin pagkatapos ng ἐλήλυθα. Pinananatili ng “tawagin” ang lawak ng Griyego, na maaaring magpahiwatig ng paanyaya o makapangyarihang pagtawag nang hindi nililimitahan sa alinman.
- source_word: δικαίους
  choice: ang mga matuwid
  rationale: Ang pang-uri ay ginamit bilang pangngalan. Tuwirang pinananatili ng “ang mga matuwid” ang moral at panrelihiyong kategorya nang hindi idinaragdag na sila ay talagang matuwid o nag-aakalang matuwid lamang.
- source_word: ἁμαρτωλοὺς
  choice: ang mga makasalanan
  rationale: Karaniwang katumbas ito ng substantibong Griyego at pinananatili ang panlipunan at moral na bigat ng katawagan sa konteksto.
- source_word: εἰς μετάνοιαν
  choice: tungo sa pagsisisi
  rationale: Ang εἰς ay nagpapahayag ng layunin o tunguhin. Ang “pagsisisi” ay likas at malawak na salin ng μετάνοια sa Filipino, na higit sa simpleng pagbabago ng isip at kabilang ang pagbaling ng saloobin at buhay.
theological_decisions:
- issue: Kung ipinagkakaila ba ni Jesus na may sinumang tunay na matuwid o tinutukoy ang mga itinuturing o nag-aakalang matuwid
  choice: Panatilihin ang tahasang paghahambing na “ang mga matuwid” at “ang mga makasalanan.”
  alternative: “ang mga nag-aakalang matuwid” o “ang mga itinuturing na matuwid”
  rationale: Walang hayag na panandang ironiko sa mismong talata. Ang pagdaragdag ng kwalipikasyon ay magpapasya sa isang teolohikal na tensiyong sadyang hindi nilulutas ng teksto.
- issue: Diwa ng μετάνοια
  choice: “pagsisisi” bilang layunin ng pagtawag
  alternative: “pagbabago ng isip”
  rationale: Sa gamit ng Bagong Tipan, ang μετάνοια ay hindi lamang intelektuwal na pagbabago ng isip; ang “pagsisisi” ay mas likas sa Filipino at hindi nito nilulutas nang labis kung paano isinasakatuparan ang pagbabagong iyon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “naparito” upang panatilihin ang pormal ngunit natural na himig ng pahayag ni Jesus; iniwasan ang mas teknikal o makalumang bokabularyo.
