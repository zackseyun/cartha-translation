  text: καὶ παραχρῆμα ἀναστὰς ἐνώπιον αὐτῶν, ἄρας ἐφ’ ὃ κατέκειτο, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ δοξάζων τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/025.yaml
  text: And immediately he stood up before them[a], picked up what he had been lying on, and went away to his house, glorifying God.
translation:
  language: tl
  text: At kaagad siyang tumayo sa harap nila, binuhat ang hinihigaan niya[a], at umuwi sa kanyang bahay habang niluluwalhati ang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang banig na hinihigaan niya”; literal na, “yaong kinalalagyan niya noon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: kaagad
  rationale: Ipinahahayag ng pang-abay na nangyari ang pagkilos nang walang pagkaantala; natural at malinaw ang “kaagad” sa makabagong Tagalog.
- source_word: ἀναστὰς
  choice: siyang tumayo
  rationale: Bagaman participle ang anyong Griyego, mas natural sa salaysay na Tagalog ang pandiwang may tahasang simuno at napapanatili nito ang pagkakasunod-sunod ng mga kilos.
- source_word: ἐνώπιον αὐτῶν
  choice: sa harap nila
  rationale: Tapat at maikli nitong ipinahahayag na lantad at nasaksihan ng mga naroon ang kanyang pagtayo.
- source_word: ἄρας
  choice: binuhat
  rationale: Sa konteksto, ang αἴρω ay tumutukoy sa pag-angat at pagdala sa bagay na kanyang hinihigaan; karaniwan at kongkreto ang “binuhat.”
- source_word: ἐφ’ ὃ κατέκειτο
  choice: ang hinihigaan niya
  rationale: Pinananatili nito ang di-tiyak na katawagan ng Griyego—“ang bagay na kanyang hinihigaan”—nang hindi tuwirang nagpapasok ng “banig” o “higaan” bilang tahasang pangngalan.
- source_word: κατέκειτο
  choice: hinihigaan niya
  rationale: Ipinahihiwatig ng aspektong imperfect ang dati at nagpapatuloy na kalagayan; sa Tagalog, likas na naihahatid ito ng anyong “hinihigaan niya” sa loob ng sugnay.
- source_word: ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ
  choice: umuwi sa kanyang bahay
  rationale: Sa kontekstong patungo sa sariling bahay, ang “umuwi” ay likas na katumbas ng pag-alis at pagpunta roon, habang pinananatili ng “sa kanyang bahay” ang tahasang οἶκος.
- source_word: δοξάζων τὸν θεόν
  choice: habang niluluwalhati ang Diyos
  rationale: Pinananatili ng “niluluwalhati” ang malawak na diwa ng pagbibigay-dangal at pagpupuri sa Diyos, at ipinakikita ng “habang” ang kasabay na kilos ng participle.
theological_decisions:
- issue: Kung tutukuyin bilang “banig” o “higaan” ang bagay na binuhat
  choice: Panatilihin sa pangunahing teksto ang di-tiyak na “ang hinihigaan niya,” at ilagay ang “banig” bilang posibleng paglilinaw sa talababa.
  alternative: “ang banig na hinihigaan niya” o “ang higaan na hinihigaan niya”
  rationale: Walang tahasang pangngalan para sa bagay sa talatang Griyego; relative expression lamang ang ginamit. Iniiwasan ng napiling salin ang dagdag na katiyakan habang nakatutulong ang talababa sa mambabasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang natural na daloy ng salaysay habang pinananatili ang pagkakasunod-sunod ng mga kilos at ang di-tiyak na pagtukoy sa bagay na binuhat.
