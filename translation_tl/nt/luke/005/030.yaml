review_pass:
  verdict: revise
  source_fidelity: Tumpak ang mga pangunahing katawagan at ang ugnayan ng mga Pariseo, kanilang mga eskriba, mga alagad ni Jesus, mga maniningil ng buwis, at mga makasalanan. Gayunman, ang “patuloy na nagbulung-bulungan” ay medyo ekspansibo at ang anyong “nagbulung-bulungan” ay maaaring marinig bilang natapos na kilos. Ang imperpektibong ἐγόγγυζον ay mas tuwirang naipapakita ng “nagbubulung-bulungan.”
  naturalness: Natural ang pangkalahatang rehistro, ngunit mas maayos na huwag paghiwalayin sa isang bagong pangungusap ang participial na “sinasabi,” upang manatiling malinaw na ang tanong ay nilalaman ng kanilang pagbubulung-bulungan. Ang “na nagsasabi” ay likas at malinaw sa modernong Filipino.
  terminology: Ang “mga Pariseo,” “mga eskriba,” “mga alagad,” “mga maniningil ng buwis,” at “mga makasalanan” ay angkop, pare-pareho, at sapat na tuwiran. Pinananatili ng “kumakain at umiinom kasama” ang kongkretong paratang ng Griyego nang walang dagdag na interpretasyon.
  issues:
  - severity: low
    issue: Ang “patuloy na nagbulung-bulungan” ay bahagyang nagpapalawak at gumagamit ng anyong maaaring basahing natapos na.
