  - severity: low
    issue: Ang “Sinabi nila” sa hiwalay na pangungusap ay hindi kasinglapit ng ugnayang pandiwari sa Griyego.
    rationale: Ang λέγοντες ay nag-uugnay sa tanong bilang kasabay o nilalaman ng kanilang pagbubulung-bulungan. Ang “na nagsasabi” ay nagpapanatili ng ugnayang ito at nananatiling natural sa Tagalog.
  revised_text: At ang mga Pariseo at ang kanilang mga eskriba ay nagbubulung-bulungan sa mga alagad niya, na nagsasabi, “Bakit kayo kumakain at umiinom kasama ng mga maniningil ng buwis at mga makasalanan?”
