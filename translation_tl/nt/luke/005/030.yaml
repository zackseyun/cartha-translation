  text: καὶ ἐγόγγυζον οἱ ⸂Φαρισαῖοι καὶ οἱ γραμματεῖς αὐτῶν⸃ πρὸς τοὺς μαθητὰς αὐτοῦ λέγοντες· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίετε καὶ πίνετε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/030.yaml
  text: And the Pharisees and their scribes were grumbling to his disciples[a], saying, “Why do you eat and drink with tax collectors and sinners?”
translation:
  language: tl
  text: At ang mga Pariseo at ang kanilang mga eskriba ay nagbubulung-bulungan sa mga alagad niya, na nagsasabi, “Bakit kayo kumakain at umiinom kasama ng mga maniningil ng buwis at mga makasalanan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγόγγυζον
  choice: patuloy na nagbulung-bulungan
  rationale: Ipinahahayag ng aspektong imperpektibo ang nagpapatuloy o paulit-ulit na pagrereklamo, habang pinananatili ng “nagbulung-bulungan” ang diwang pabulong at negatibong hinaing.
- source_word: γραμματεῖς
  choice: mga eskriba
  rationale: Tuwirang katumbas ito ng makasaysayang tawag sa pangkat; iniiwasan nitong gawing paliwanag lamang ang kanilang tungkulin bilang mga dalubhasa o guro ng Kautusan.
- source_word: αὐτῶν
  choice: kanilang
  rationale: Likas na inuugnay ng panghalip na paari ang mga eskriba sa mga Pariseo, alinsunod sa pinakamalinaw na sintaks ng Griyego.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: sa mga alagad niya
  rationale: Ang πρός na may akusatibo ay tumutukoy rito sa pinatutungkulan ng kanilang pagsasalita o pagrereklamo.
- source_word: Διὰ τί
  choice: Bakit
  rationale: Natural at tuwirang katumbas sa makabagong Tagalog.
- source_word: τελωνῶν
  choice: mga maniningil ng buwis
  rationale: Malinaw at karaniwang salin na nagpapanatili sa pagkakakilanlan at panlipunang dungis na nakakabit sa pangkat sa konteksto ng mga Ebanghelyo.
- source_word: ἁμαρτωλῶν
  choice: mga makasalanan
  rationale: Tuwiran at nakaugaliang katumbas na pinananatili ang moral at panlipunang kategoryang ginamit ng mga nagsasalita.
- source_word: ἐσθίετε καὶ πίνετε
  choice: kayo kumakain at umiinom
  rationale: Pinananatili ang kongkretong dalawang pandiwa at natural na ipinahahayag sa Tagalog ang kasalukuyan o nakagawiang kilos.
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at daloy ng salaysay nang hindi dinaragdagan ang diskursibong kahulugan.
theological_decisions:
- issue: Panlipunan at panrelihiyong bigat ng pakikisalo sa “mga maniningil ng buwis at mga makasalanan”
  choice: Panatilihin ang kongkretong paratang na kumakain at umiinom silang kasama ng mga pangkat na ito.
  alternative: Ipaliwanag sa mismong teksto na ang pagtutol ay tungkol sa rituwal na karumihan, moral na pakikisama, o pagtanggap sa lipunan.
  rationale: Hindi tahasang nililinaw ng talata ang buong batayan ng pagtutol. Pinananatili ng salin ang tensiyon ng pakikisalo nang hindi nagdaragdag ng isang partikular na interpretasyong panrelihiyon.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “eskriba” bilang makasaysayang katawagan at “maniningil ng buwis” bilang malinaw na katumbas. Ang “patuloy na nagbulung-bulungan” ay bahagyang ekspansibo ngunit kailangan upang maipakita ang nagpapatuloy na kilos ng imperpektibo.
