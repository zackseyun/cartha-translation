  to: At ang mga Pariseo at ang kanilang mga eskriba ay nagbubulung-bulungan sa mga alagad niya, na nagsasabi, “Bakit kayo kumakain at umiinom kasama ng mga maniningil ng buwis at mga makasalanan?”
