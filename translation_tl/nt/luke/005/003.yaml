  text: ἐμβὰς δὲ εἰς ἓν τῶν πλοίων, ὃ ⸀ἦν Σίμωνος, ἠρώτησεν αὐτὸν ἀπὸ τῆς γῆς ἐπαναγαγεῖν ὀλίγον, ⸂καθίσας δὲ ἐκ τοῦ πλοίου ἐδίδασκεν⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/003.yaml
  text: Then he got into one of the boats[a], which belonged to Simon, and asked him to put out a little from the land. Then he sat down and was teaching the crowds from the boat.
translation:
  language: tl
  text: Sumakay siya sa isa sa mga bangka na pag-aari ni Simon, at hiniling niya kay Simon na ipalayo nang kaunti ang bangka sa pampang. Pagkaupo niya, nagtuturo siya sa mga tao mula sa bangka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβὰς
  choice: Sumakay
  rationale: Likas na salin para sa pagpasok o pagsakay sa bangka; ipinapakita nitong nauna ang kilos na ito sa paghiling kay Simon.
- source_word: πλοίων / πλοίου
  choice: mga bangka / bangka
  rationale: Tumutukoy sa maliliit na sasakyang pandagat na ginagamit sa pangingisda sa lawa; pinanatili ang bilang ayon sa bawat paglitaw sa Griyego.
- source_word: ὃ ἦν Σίμωνος
  choice: na pag-aari ni Simon
  rationale: Malinaw na ipinapahayag ang pagmamay-aring nakasaad sa genitibong Σίμωνος.
- source_word: ἠρώτησεν
  choice: hiniling
  rationale: Sa konteksto, ang ἐρωτάω ay isang magalang na paghiling, hindi lamang pagtatanong.
- source_word: ἐπαναγαγεῖν
  choice: ilayo ... ang bangka
  rationale: Sa konteksto ng pamamangka, nangangahulugan itong igalaw ang bangka palayo sa lupa o pampang.
- source_word: ἀπὸ τῆς γῆς
  choice: mula sa pampang
  rationale: Bagaman literal na 'mula sa lupa,' ang pampang ang likas at tiyak na kahulugan sa tagpong nasa lawa.
- source_word: ὀλίγον
  choice: nang kaunti
  rationale: Pinananatili ang maliit na distansiyang ipinahihiwatig ng adverbial na gamit.
- source_word: καθίσας
  choice: Pagkaupo niya
  rationale: Ipinapakita ang kilos na nauna sa nagpapatuloy na pagtuturo nang hindi nagiging mabigat ang pangungusap.
- source_word: ἐδίδασκεν
  choice: nagturo siya
  rationale: Natural sa salaysay na Filipino; sa kontekstong ito, maaari nitong katawanin ang nagaganap o nagpapatuloy na pagtuturo ng imperfect.
- source_word: τοὺς ὄχλους
  choice: mga tao
  rationale: Likas na modernong Filipino para sa mga nagkakatipong pulutong; iniiwasan ang mas pormal o makalumang 'mga karamihan.'
