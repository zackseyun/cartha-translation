translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa nang malakas. Ginamit ang 'pampang' sa halip na literal na 'lupa' sapagkat iyon ang natural na pagtukoy sa lupang katapat ng bangka sa tagpong ito.
