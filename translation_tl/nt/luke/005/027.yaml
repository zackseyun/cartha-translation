source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα ἐξῆλθεν καὶ ἐθεάσατο τελώνην ὀνόματι Λευὶν καθήμενον ἐπὶ τὸ τελώνιον, καὶ εἶπεν αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/027.yaml
  text: And after these things he went out and saw a tax collector named Levi sitting at the tax booth[a], and he said to him[b], “Follow me.”
translation:
  language: tl
  text: Pagkatapos ng mga pangyayaring ito, lumabas siya at nakita[a] niya ang isang maniningil ng buwis na nagngangalang Levi at nakaupo sa puwesto ng singilan ng buwis.[b] Sinabi niya sa kanya, “Sumunod ka sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “napansin” o “tiningnan”; maaaring magpahiwatig ang pandiwang Griyego ng higit sa isang saglit na pagkakita.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa puwesto ng paniningil ng bayad” o “sa himpilan ng adwana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Pagkatapos ng mga pangyayaring ito
  rationale: Pinananatili nito ang pangmaramihang demonstratibo at ang malinaw na paglipat ng salaysay, ngunit natural itong pakinggan sa makabagong Tagalog.
- source_word: ἐξῆλθεν
  choice: lumabas siya
  rationale: Tuwirang ipinahahayag ang konkretong pagkilos ng ἐξέρχομαι nang hindi dinaragdagan ang pinanggalingan o patutunguhan.
- source_word: ἐθεάσατο
  choice: nakita
  rationale: Natural at malinaw ang “nakita,” habang inilalahad sa talababa na maaaring may diwang mas masinsing pagtingin o pagpansin ang pandiwang Griyego.
- source_word: τελώνην
  choice: isang maniningil ng buwis
  rationale: Ito ang malinaw at karaniwang katawagan sa papel na ginagampanan ng τελώνης sa mga Ebanghelyo.
- source_word: ὀνόματι Λευὶν
  choice: na nagngangalang Levi
  rationale: Natural na katumbas sa Tagalog ng idyomang Griyego para sa pagpapakilala ng pangalan.
- source_word: καθήμενον
  choice: Nakaupo ito
  rationale: Pinananatili ang kalagayan ni Levi sa lugar ng singilan. Hinati sa bagong pangungusap upang maging malinaw at natural sa Tagalog.
- source_word: ἐπὶ τὸ τελώνιον
  choice: sa puwesto ng singilan ng buwis
  rationale: Ipinahihiwatig ng τελώνιον ang lugar o himpilan kung saan sinisingil ang buwis o bayad; ang “puwesto” ay malinaw at hindi labis na teknikal.
- source_word: Ἀκολούθει μοι
  choice: Sumunod ka sa akin
  rationale: Tuwirang utos ito at natural na tawag upang sumunod, nang hindi ipinapasok sa mismong teksto ang paliwanag na maging alagad.
theological_decisions:
- issue: Lakas ng utos ni Jesus bilang tawag sa pagiging alagad
  choice: Sumunod ka sa akin
  alternative: Maging alagad kita / Sumunod ka sa akin bilang alagad
  rationale: Sapat ang tuwirang utos sa Griyego. Malinaw sa konteksto ang tawag sa pagiging alagad, ngunit hindi iyon dapat palawakin sa salin nang higit sa mismong sinabi.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “siya/ito/rito” upang maiwasan ang paulit-ulit na panghalip at panatilihing malinaw na si Levi ang nakaupo at kinakausap. Hinati ang mahabang pangungusap na Griyego sa tatlong pangungusap para sa likas na daloy sa Tagalog nang hindi binabago ang pagkakasunod-sunod ng mga pangyayari.
