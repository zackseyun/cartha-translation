  to: Pagkatapos ng mga pangyayaring ito, lumabas siya at nakita[a] niya ang isang maniningil ng buwis na nagngangalang Levi at nakaupo sa puwesto ng singilan ng buwis.[b] Sinabi niya sa kanya, “Sumunod ka sa akin.”
  rationale: Pinagsama ang paglalarawan kay Levi at ang kaniyang pagkakaupo upang alisin ang di-likas na «Nakaupo ito» nang hindi binabago ang kahulugan, pagkakasunod-sunod, o antas ng katiyakan ng Griyego. Iningatan ang mga umiiral na talababa at inilagay ang mga pananda sa mga salitang tinutukoy ng mga ito.
