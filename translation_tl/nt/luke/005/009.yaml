- from: Sapagkat siya at ang lahat ng kasama niya ay lubhang namangha dahil sa dami ng isdang nahuli nila.
  to: Sapagkat binalot ng pagkamangha si Simon at ang lahat ng kasama niya dahil sa huli nilang mga isda.
