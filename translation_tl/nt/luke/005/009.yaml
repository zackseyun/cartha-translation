  yaml_path: translation/nt/luke/005/009.yaml
  text: For astonishment had seized him and all those with him because of the catch of fish that they had taken,[a]
translation:
  language: tl
  text: Sapagkat binalot ng pagkamangha si Simon at ang lahat ng kasama niya dahil sa huli nilang mga isda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θάμβος
  choice: lubhang namangha
  rationale: Ipinapahayag ng pangngalan ang matinding pagkamangha. Ginawang likas na pandiwang parirala sa Tagalog upang malinaw na ang damdaming ito ang nanaig sa kanila.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan nito sa naging tugon ni Simon sa naunang talata.
- source_word: περιέσχεν
  choice: lubhang namangha
  rationale: Sa pariralang Griyego, ang pagkamangha ay literal na 'pumalibot' o 'sumakop' sa kanila. Ang 'lubhang namangha' ay natural sa modernong Tagalog at naghahatid ng tindi ng karanasan nang hindi nagiging mekanikal.
- source_word: πάντας τοὺς σὺν αὐτῷ
  choice: ang lahat ng kasama niya
  rationale: Malinaw na pinananatili ang kabuuang saklaw ng mga kasamang naroon kay Simon.
- source_word: ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων
  choice: dahil sa dami ng isdang nahuli nila
  rationale: Ang ἐπί ay nagpapahayag dito ng sanhi. Bagaman ang ἄγρα ay 'huli' o 'nahuli,' ipinahihiwatig ng konteksto ang pambihirang laki ng huli; ang 'dami ng isda' ay likas at malinaw na Tagalog.
- source_word: ὧν συνέλαβον
  choice: nahuli nila
  rationale: Ang panghalip na maramihan ay tumutukoy sa mga isda, at ang pandiwang maramihan ay nagpapakitang sama-sama silang nanghuli. Ang 'nahuli nila' ang pinakanatural na pagpapahayag sa Tagalog.
