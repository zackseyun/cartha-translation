base_translation:
  language: en
  yaml_path: translation/nt/luke/005/020.yaml
  text: And seeing their faith[a], he said, “Man[c][b], your sins are forgiven.”
translation:
  language: tl
  text: Nang makita niya ang pananampalataya nila[a], sinabi niya, “Lalaki[b], pinatawad na ang mga kasalanan mo[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagtitiwala”; Griyego, “pananampalataya.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “Tao,” bilang tuwirang pagtawag sa kaniya.
    reason: lexical_alternative
  - marker: c
    text: O “napatawad na ang mga kasalanan mo.” Ipinahihiwatig ng Griyegong ganap na balintiyak ang kasalukuyang kalagayang bunga ng natapos na kilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Nang makita
  rationale: Likas sa Filipino ang sugnay na panahunan at pinananatili nito ang ugnayan ng pagkakita ni Jesus sa sumunod niyang pahayag nang hindi labis na tinutukoy ang agwat ng mga pangyayari.
- source_word: πίστιν
  choice: pananampalataya
  rationale: Karaniwan at tuwirang salin ito ng πίστις sa kontekstong panrelihiyon. Dito ay tumutukoy ito sa pagtitiwalang nahahayag sa ginawa ng lalaki at ng mga kasama niya.
- source_word: αὐτῶν
  choice: nila
  rationale: Pinananatili ang pangmaramihang panghalip ng Griyego at hindi nililimitahan kung ang tinutukoy ay ang mga nagdala lamang o pati ang paralitikong lalaki.
- source_word: Ἄνθρωπε
  choice: Kaibigan
  rationale: Bilang direktang pagtawag, magiging matigas at di-likas sa modernong Filipino ang literal na “Tao” o “Lalaki.” Ang “Kaibigan” ay isang magalang at likas na anyo ng pakikipag-usap; inilalagay sa talababa ang mas literal na kahulugan.
- source_word: ἀφέωνταί
  choice: pinatawad na
  rationale: Ipinahahayag ng anyong ganap at balintiyak ang kasalukuyang kalagayang bunga ng naganap nang pagpapatawad. Likas sa Filipino ang “pinatawad na” at hindi nito pinapangalanan ang kumikilos.
- source_word: ἁμαρτίαι
  choice: mga kasalanan
  rationale: Tuwiran at karaniwang katumbas na nagpapanatili sa moral at teolohikal na diwa ng salita.
- source_word: σοι ... σου
  choice: mo
  rationale: Sa Filipino, likas na naipapahayag ng “mga kasalanan mo” kapuwa ang pag-aari at ang personal na kaugnayan ng kapatawaran; magiging paulit-ulit at di-likas ang tahasang pagsasalin sa dalawang panghalip.
theological_decisions:
- issue: Saklaw ng “pananampalataya nila”
  choice: Pinananatili ang pangmaramihang “nila” nang hindi nililinaw kung sinu-sino ang eksaktong kabilang.
  alternative: Maaaring tumukoy lamang ito sa mga lalaking nagdala sa paralitiko, o sa paralitiko kasama ng mga nagdala sa kaniya.
  rationale: Pangmaramihan ang αὐτῶν, ngunit hindi tahasang nilulutas ng teksto ang eksaktong saklaw nito. Pinananatili ng salin ang ganitong kalabuan.
- issue: Lakas at panahon ng pahayag ng kapatawaran
  choice: “Pinatawad na” bilang deklarasyon ng umiiral nang kalagayan ng kapatawaran.
  alternative: Maaaring unawain bilang kapatawarang ipinagkaloob sa mismong sandaling iyon o bilang pagpapahayag ng kapatawarang naipagkaloob na.
  rationale: Ang Griyegong ganap na balintiyak ay naglalahad ng kasalukuyang kalagayang bunga ng natapos na kilos, ngunit hindi nito tahasang nilulutas ang eksaktong teolohikal na mekanismo o panahon.
translation_notes:
  register: Modernong Filipino na magalang, malinaw, at angkop sa pampublikong pagbasa. Ginamit ang “Kaibigan” upang maiwasan ang di-likas at matigas na bokatibong “Tao/Lalaki,” habang pinananatili sa talababa ang literal na anyo. Hindi nilinaw nang lampas sa Griyego ang saklaw ng pananampalataya o ang eksaktong panahon ng kapatawaran.
