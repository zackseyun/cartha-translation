  to: Nangyari ito habang nagsisiksikan ang mga tao sa paligid niya at nakikinig sa salita ng Diyos[a], at nakatayo siya sa tabi ng lawa ng Genesaret[b].
  rationale: Idinagdag ang “ito” upang maging ganap at likas ang Lukanong pambungad na pormula sa Filipino. Inayos ang talababa a upang panatilihin ang aktibong diwa ng pakikinig at upang magbigay ng tunay na alternatibo para sa “sa paligid niya.” Ginawang maliit ang “lawa” bilang karaniwang pangngalan na sinusundan ng pantanging pangalang “Genesaret.”
