id: LUK.5.1
reference: Luke 5:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν ὄχλον ἐπικεῖσθαι αὐτῷ ⸀καὶ ἀκούειν τὸν λόγον τοῦ θεοῦ καὶ αὐτὸς ἦν ἑστὼς παρὰ τὴν λίμνην Γεννησαρέτ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/001.yaml
  text: It happened that while the crowd was pressing in on him and listening to the word of God[a], he was standing by the lake of Gennesaret[b],
translation:
  language: tl
  text: Nangyari ito habang nagsisiksikan ang mga tao sa paligid niya at nakikinig sa salita ng Diyos[a], at nakatayo siya sa tabi ng lawa ng Genesaret[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang nagsisiksikan ang mga tao sa kanya at nakikinig sa salita ng Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Ang lawa ng Genesaret ay kilala rin bilang Dagat ng Galilea.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Nangyari na
  rationale: Ipinakikilala nito ang tagpo sa paraang likas sa makabagong Filipino; hindi dinagdagan ng tahasang salitang temporal na wala naman sa Griyego.
- source_word: ἐν τῷ ... ἐπικεῖσθαι ... καὶ ἀκούειν
  choice: habang nagsisiksikan ... at nakikinig
  rationale: Ang konstruksiyon ay temporal at inilalarawan ang dalawang magkasabay na kilos ng mga tao.
- source_word: ὄχλον
  choice: mga tao
  rationale: Sa kontekstong ito, natural na katumbas ito ng kolektibong 'crowd' sa Filipino; ang pandiwang 'nagsisiksikan' ay malinaw na nagpapakitang isang pulutong ang tinutukoy.
- source_word: ἐπικεῖσθαι αὐτῷ
  choice: nagsisiksikan ang mga tao sa paligid niya
  rationale: Ipinahihiwatig ng pandiwa ang paglapit nang napakasinsin at pagdiin ng pulutong; natural itong pakinggan sa Filipino nang hindi ipinapalagay na sinasaktan nila siya.
- source_word: ἀκούειν
  choice: nakikinig
  rationale: Ipinakikita ang sinasadyang pakikinig, hindi lamang ang pisikal na pagkarinig.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: salita ng Diyos
  rationale: Pinananatili ang malawak at pamilyar na biblikal na diwa ng parirala sa halip na limitahan ito sa 'mensahe.'
- source_word: καὶ αὐτὸς ἦν ἑστὼς
  choice: nakatayo siya
  rationale: Natural na Filipino para sa nagpapatuloy na tindig; hindi kailangang gawing tahasang mariin ang αὐτός dito.
- source_word: παρὰ τὴν λίμνην
  choice: sa tabi ng Lawa
  rationale: Tumpak at karaniwang paraan ng pagsasaad ng lokasyon sa gilid ng lawa.
- source_word: Γεννησαρέτ
  choice: Genesaret
  rationale: Transliterasyon sa baybay na angkop sa Filipino, sa halip na palitan ng paliwanag na 'Dagat ng Galilea.'
theological_decisions:
- issue: Paglapat sa τὸν λόγον τοῦ θεοῦ
  choice: salita ng Diyos
  alternative: mensahe ng Diyos
  rationale: Maaaring tumukoy ang parirala sa ipinahahayag na mensahe ng Diyos, ngunit pinananatili ng 'salita ng Diyos' ang lawak at ugnayang biblikal nito nang hindi nilulutas nang di-kailangan ang saklaw.
- issue: Pangalan ng Γεννησαρέτ
  choice: Genesaret
  alternative: Dagat ng Galilea
  rationale: Genesaret ang mismong pangalang nasa Griyego. Ang 'Dagat ng Galilea' ay kapaki-pakinabang bilang paliwanag ngunit hindi dapat ipalit sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'nagsisiksikan sa paligid niya' upang ilarawan ang pisikal na pagsisikip ng pulutong sa paraang natural sa ordinaryong mambabasa. Pinanatili ang pangalang Genesaret sa pangunahing teksto at inilagay sa talababa ang mas kilalang katawagan.
