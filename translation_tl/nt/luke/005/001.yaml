  source_fidelity: 'Tumpak ang pangunahing diwa: sabay na nagsisiksikan ang pulutong, nakikinig sila sa salita ng Diyos, at nakatayo si Jesus sa tabi ng lawa. Gayunman, ang pambungad na “Nangyari na” ay hindi likas at kulang bilang pangungusap sa modernong Filipino; kailangan nito ang panghalip na “ito.”'
  naturalness: Mas natural at malinaw ang “Nangyari ito habang ... at nakatayo siya ...” Pinananatili nito ang pambungad na pormulang pasalaysay ng Griyego nang hindi nagdaragdag ng panandang panahong gaya ng “Ngayon.”
  terminology: Ang “salita ng Diyos” ay angkop para sa τὸν λόγον τοῦ θεοῦ. Ang “Genesaret” ay wastong transliterasyon, at ang “Dagat ng Galilea” ay nararapat manatili bilang paliwanag lamang sa talababa.
