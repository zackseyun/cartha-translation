id: LUK.5.22
reference: Luke 5:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐπιγνοὺς δὲ ὁ Ἰησοῦς τοὺς διαλογισμοὺς αὐτῶν ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Τί διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/022.yaml
  text: But Jesus[a], perceiving their thoughts, answered and said to them, “Why are you reasoning in your hearts?”
translation:
  language: tl
  text: Ngunit nang mabatid ni Jesus ang kanilang mga iniisip[a], sumagot siya sa kanila, “Bakit kayo nangangatuwiran sa inyong mga puso?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanilang mga pangangatuwiran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: nang mabatid
  rationale: Ipinahahayag ng aorist participle ang ganap na pagkaalam ni Jesus sa kanilang iniisip, nang hindi ipinapaliwanag kung paano niya ito nalaman.
- source_word: δὲ
  choice: Ngunit
  rationale: Minamarkahan ng δέ ang banayad na pagsalungat at pagliko ng salaysay mula sa lihim nilang pagtutol tungo sa tugon ni Jesus.
- source_word: τοὺς διαλογισμοὺς αὐτῶν
  choice: ang kanilang mga iniisip
  rationale: Natural at malinaw sa modernong Filipino ang “mga iniisip” para sa kanilang panloob na pagninilay o pangangatuwiran; inilalagay sa talababa ang mas pormal na alternatibo.
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: sumagot siya sa kanila
  rationale: Ang dalawang pandiwang Griyego ay isang karaniwang pormula ng pagsasalaysay; sapat at natural sa Filipino ang “sumagot siya sa kanila” nang hindi nawawala ang kahulugan.
- source_word: Τί διαλογίζεσθε
  choice: Bakit kayo nangangatuwiran
  rationale: Sa idyomang ito, ang Τί ay nagtatanong ng dahilan, kaya “Bakit” ang natural na salin. Pinananatili ng “nangangatuwiran” ang aktibong proseso ng panloob na pag-iisip.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: sa inyong mga puso
  rationale: Pinananatili nito ang biblikal na larawan ng puso bilang kaloob-looban ng tao, kabilang ang isip at kalooban.
theological_decisions:
- issue: Kung paano nalaman ni Jesus ang panloob nilang pangangatuwiran
  choice: Sabihin lamang na nabatid ni Jesus ang kanilang mga iniisip.
  alternative: Ipaliwanag na nalaman niya ito sa paraang sobrenatural, o pahinain ito bilang isang hinala lamang.
  rationale: Malinaw na inilalahad ng talata ang pagkaalam ni Jesus, ngunit hindi nito sinasabi ang paraan. Kaya hindi dinaragdagan o binabawasan ng salin ang pahayag.
translation_notes:
  register: Modernong Filipino na natural at marangal. Pinanatili ang biblikal na ekspresyong “sa inyong mga puso” at ang ugnayang leksikal ng panloob na pag-iisip at pangangatuwiran, habang iniwasan ang sobrang literal na pormulang hindi likas sa Filipino.
