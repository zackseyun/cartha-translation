  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μήγε, ῥήξει ὁ ⸂οἶνος ὁ νέος⸃ τοὺς ἀσκούς, καὶ αὐτὸς ἐκχυθήσεται καὶ οἱ ἀσκοὶ ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/037.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the new wine will burst the wineskins, and it will be spilled[c][b], and the wineskins will be ruined.
translation:
  language: tl
  text: At walang sinumang naglalagay ng bagong alak sa mga lumang sisidlang yari sa balat[a]. Kung hindi, papuputukin ng bagong alak ang mga sisidlan, matatapon ang alak mismo, at masisira ang mga sisidlan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa literal, “mga lumang balat.” Ang salitang Griyego ay tumutukoy sa mga sisidlang yari sa balat na ginagamit sa paglalagay ng alak.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλει
  choice: naglalagay
  rationale: Pinananatili ang pangkalahatang diwa ng paglalagay, sa halip na gawing mas tiyak na “nagbubuhos,” na ipinahihiwatig lamang ng konteksto.
- source_word: οἶνον νέον
  choice: bagong alak
  rationale: Likas at tuwirang salin na angkop sa konteksto ng pagbuburo.
- source_word: ἀσκοὺς παλαιούς
  choice: mga lumang sisidlang balat
  rationale: Ipinakikitang ang tinutukoy ay mga sisidlang yari sa balat at hindi basta mga balat lamang; mas malinaw ito sa karaniwang mambabasa kaysa sa teknikal o di-pamilyar na katawagan.
- source_word: εἰ δὲ μήγε
  choice: Kung gagawin iyon
  rationale: Likas na inilalahad sa Filipino ang bunga kapag sinuway ang naunang pangkalahatang pahayag.
- source_word: ῥήξει
  choice: papuputukin
  rationale: 'Pinananatili ang tahasang sanhi: ang bagong alak ang magpapaputok sa mga lumang sisidlang balat.'
- source_word: ἐκχυθήσεται
  choice: matatapon
  rationale: Ang pasibong anyo ay natural na ipinahahayag sa Filipino at malinaw na tumutukoy sa pagtagas at pagkawala ng alak matapos mapunit ang sisidlan.
- source_word: ἀπολοῦνται
  choice: masisira
  rationale: Para sa mga sisidlan, ipinahahayag nito ang pagkawala ng pakinabang o pagkasira nang hindi ipinapalagay ang lubos na pagkalipol.
- source_word: καὶ αὐτός
  choice: matatapon ang alak
  rationale: Inuulit ang “alak” upang maging malinaw ang tinutukoy ng madiing panghalip; hindi kailangang isalin nang mekanikal bilang “ito mismo.”
- source_word: οὐδεὶς
  choice: walang sinuman
  rationale: Dignified at malinaw na katumbas na angkop sa anyong kasabihan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, natural, at marangal. Ginamit ang “sisidlang balat” upang maunawaan agad ang sinaunang bagay nang hindi nawawala ang materyal na tinutukoy. Iningatan ang ugnayang sanhi at bunga at hindi dinagdagan ng teolohikal na pagpapakahulugan.
