  text: ὁμοίως δὲ καὶ Ἰάκωβον καὶ Ἰωάννην υἱοὺς Ζεβεδαίου, οἳ ἦσαν κοινωνοὶ τῷ Σίμωνι. καὶ εἶπεν πρὸς τὸν Σίμωνα ⸀ὁ Ἰησοῦς· Μὴ φοβοῦ· ἀπὸ τοῦ νῦν ἀνθρώπους ἔσῃ ζωγρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/010.yaml
  text: and likewise also James and John, Zebedee’s sons, who were partners with Simon. And Jesus said to Simon, “Do not be afraid; from now on you will be catching people alive.”
translation:
  language: tl
  text: Gayon din sina Santiago at Juan, na mga anak ni Zebedeo at mga kasosyo ni Simon. Sinabi ni Jesus kay Simon, “Huwag kang matakot. Mula ngayon ay manghuhuli ka ng mga tao nang buhay.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga tao ang huhulihin mo nang buhay.” Ang pandiwang Griyego ay nangangahulugang humuli o kumuha nang buhay, hindi basta manghuli lamang.
    reason: lexical_alternative
  - marker: b
    text: Ihambing sa Mateo 4:19 at Marcos 1:17, kung saan sinabi ni Jesus, “Gagawin ko kayong mangingisda ng mga tao.” Naiiba ang pananalita ni Lucas dito at hindi ito dapat ipantay sa pananalita ng mga paralelong salaysay.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: Gayon din
  rationale: Likas na Filipino na nagpapanatili sa paghahambing at pagdaragdag kina Santiago at Juan sa naunang tinutukoy.
- source_word: υἱοὺς Ζεβεδαίου
  choice: mga anak ni Zebedeo
  rationale: Natural at tumpak na pagpapahayag ng ugnayang pampamilya sa Filipino.
- source_word: κοινωνοὶ
  choice: mga kasosyo
  rationale: Sa konteksto ng hanapbuhay na pangingisda, tumutukoy ito sa mga katuwang sa gawain o negosyo, hindi lamang sa mga kasama.
- source_word: Μὴ φοβοῦ
  choice: Huwag kang matakot
  rationale: Karaniwan, tuwiran, at marangal na katiyakang Filipino; ang isahan na 'kang' ay tumutugma sa pakikipag-usap kay Simon.
- source_word: ἀπὸ τοῦ νῦν
  choice: Mula ngayon
  rationale: Malinaw na naghahayag ng isang tiyak na pagbabago mula sa sandaling iyon.
- source_word: ἀνθρώπους
  choice: mga tao
  rationale: Ang salita ay tumutukoy sa mga tao sa pangkalahatan, hindi lamang sa mga lalaki.
- source_word: ζωγρῶν
  choice: huhulihin mong buhay
  rationale: Pinananatili ang larawan ng paghuli at ang natatanging diwa ng pandiwang Griyego na kumuha o humuli nang buhay.
theological_decisions:
- issue: Ang talinghaga ng ζωγρέω sa pagkatawag kay Simon
  choice: mga tao na ang huhulihin mong buhay
  alternative: mangingisda ka ng mga tao
  rationale: 'Natatangi ang pananalita ni Lucas: ζωγρέω ang ginamit, na may diwang humuli nang buhay. Hindi ito pinantay sa mas pamilyar na pananalita sa Mateo 4:19 at Marcos 1:17.'
- issue: Saklaw ng ἀνθρώπους
  choice: mga tao
  alternative: mga lalaki
  rationale: Pangkalahatan ang tinutukoy na sangkatauhan; hindi nagbibigay ang konteksto ng dahilan upang limitahan ito sa mga lalaki.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “kasosyo” ayon sa konteksto ng pangingisda at ang “huhulihin mong buhay” upang mapanatili ang natatanging diwa ng ζωγρέω nang hindi hinaharmonisa ang teksto sa Mateo at Marcos.
