  text: And he saw two boats standing by the lake[a], but the fishermen, having gotten out of them, were washing the nets.
translation:
  language: tl
  text: At nakita niya ang dalawang bangkang nakahimpil sa tabi ng lawa, ngunit ang mga mangingisda ay bumaba na mula sa mga ito[a] at naghuhugas ng mga lambat.
  philosophy: optimal-equivalence
