translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maging natural ang daloy habang pinananatili ang pagkakasunod ng mga kilos at ang banayad na paglipat mula sa mga bangka tungo sa mga mangingisda.
