lexical_decisions:
- source_word: εἶδεν
  choice: nakita niya
  rationale: Likas na salin ng aorist na ὁράω sa salaysay; hindi idinaragdag ang diwang bigla niyang napansin.
- source_word: δύο πλοῖα
  choice: dalawang bangka
  rationale: Sa konteksto ng pangingisda sa lawa, mas natural at tumpak ang “bangka” kaysa “barko.”
- source_word: ἑστῶτα παρὰ τὴν λίμνην
  choice: nakahimpil sa tabi ng lawa
  rationale: Ipinapahayag ng ἑστῶτα ang nananatiling posisyon ng mga bangka. Ang “nakahimpil” ay natural sa Filipino at hindi kasingtiyak ng “nakatali,” na hindi tahasang sinasabi ng Griyego.
- source_word: οἱ δὲ ἁλιεῖς
  choice: ang mga mangingisda
  rationale: Tuwirang salin ng ἁλιεῖς. Ang banayad na paglipat ng tagpo na ipinahihiwatig ng δέ ay sapat nang naipakita sa paghahati ng pangungusap, kaya hindi kailangan ang mas mariing “ngunit.”
- source_word: ἀπ’ αὐτῶν ἀποβάντες
  choice: nakababa na mula sa mga iyon
  rationale: Ipinakikita ng aorist participle na nauna ang pagbaba sa paghuhugas. Ang “mula sa mga iyon” ay nagpapanatili sa tahasang pagtukoy sa mga bangka nang hindi nagdaragdag ng ideyang “pumunta sa pampang.”
- source_word: ἔπλυνον τὰ δίκτυα
  choice: naghuhugas sila ng mga lambat
  rationale: Ang progresibong “naghuhugas” ay kumakatawan sa patuloy na kilos ng imperfect. Hindi idinagdag ang pang-angking “kanilang” sapagkat wala ito sa Griyego.
