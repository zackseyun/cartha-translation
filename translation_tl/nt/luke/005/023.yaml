id: LUK.5.23
reference: Luke 5:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν· Ἀφέωνταί σοι αἱ ἁμαρτίαι σου, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/023.yaml
  text: 'Which is easier: to say[a], ‘Your sins are forgiven you,’ or to say, ‘Rise and walk’?”'
translation:
  language: tl
  text: '“Alin ang mas madali: ang sabihing, ‘Pinatawad na[a] ang mga kasalanan mo,’ o ang sabihing, ‘Bumangon ka at lumakad’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Napatawad na ang mga kasalanan mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: Alin ang mas madali
  rationale: Likas sa modernong Tagalog ang “Alin ang mas madali” kapag pinaghahambing ang dalawang hayag na pagpipilian, at malinaw nitong pinananatili ang paghahambing ng εὐκοπώτερον.
- source_word: εἰπεῖν
  choice: ang sabihing
  rationale: Ipinakikilala ng pawatas ang nilalaman ng bawat pahayag. Maikli at natural sa Tagalog ang “ang sabihing.”
- source_word: Ἀφέωνταί
  choice: Pinatawad na
  rationale: Sa kontekstong ito, ang ἀφίημι ay tumutukoy sa kapatawaran ng mga kasalanan. Ipinahihiwatig ng “Pinatawad na” ang isang naganap na kilos na may nananatiling bunga, nang hindi tinutukoy kung sino ang kumilos.
- source_word: σοι … αἱ ἁμαρτίαι σου
  choice: ang mga kasalanan mo
  rationale: Natural sa Tagalog ang paggamit ng pang-angkin sa “mga kasalanan mo.” Hindi na kailangang isalin nang hiwalay ang σοι dahil magiging mabigat at paulit-ulit ang “sa iyo ang mga kasalanan mo.”
- source_word: ἢ
  choice: o
  rationale: Karaniwang pangatnig ito para sa dalawang magkasalungat na pagpipilian.
- source_word: Ἔγειρε
  choice: Bumangon ka
  rationale: Malinaw at likas na utos sa modernong Tagalog ang “Bumangon ka,” at angkop ito sa lalaking pinababangon ni Jesus.
- source_word: καὶ περιπάτει
  choice: at lumakad
  rationale: Literal na paglakad ang tinutukoy ng περιπατέω rito. Pinananatili ng “at lumakad” ang tuwiran at marangal na anyo ng utos.
theological_decisions:
- issue: Pagpapahayag ng kapatawaran nang hindi nagdaragdag ng doktrina tungkol sa gumagawa ng kilos o sa eksaktong aspekto nito
  choice: Pinatawad na ang mga kasalanan mo
  alternative: Napatawad na ang mga kasalanan mo
  rationale: Pinananatili ng pangunahing salin ang deklarasyon ng kapatawaran at ang bungang nananatili mula sa naganap na kilos. Hindi nito tahasang pinapangalanan ang gumagawa ng pagpapatawad, gaya rin ng pasibong anyo sa Griyego. Inilalagay sa talababa ang mas statibong alternatibo upang mapanatili ang posibleng diin sa kalagayang bunga ng pagpapatawad.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “Bumangon ka” sa halip na mas pormal o makalumang pananalita, habang pinanatili ang solemneng himig ng hamon ni Jesus.
