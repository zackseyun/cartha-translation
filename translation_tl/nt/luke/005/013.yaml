id: LUK.5.13
reference: Luke 5:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο αὐτοῦ ⸀εἰπών· Θέλω, καθαρίσθητι· καὶ εὐθέως ἡ λέπρα ἀπῆλθεν ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/013.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing; be cleansed.” And immediately the leprosy left him.
translation:
  language: tl
  text: At iniunat niya ang kanyang kamay, hinipo ang lalaki, at sinabi, “Nais ko; luminis ka.” Agad na nawala sa lalaki ang ketong[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas malawak na diwa, “malubhang sakit sa balat.” Ang salitang Griyego na λέπρα sa Bibliya ay maaaring tumukoy sa iba’t ibang malubhang sakit sa balat, hindi lamang sa ketong o Hansen’s disease na kinikilala ngayon.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: iniunat niya ang kanyang kamay
  rationale: Pinananatili ang malinaw na pisikal na kilos ng pag-unat ng kamay bago ang paghipo, sa natural na ayos ng modernong Tagalog.
- source_word: ἥψατο αὐτοῦ
  choice: hinipo ang lalaki
  rationale: Tuwirang ipinapahayag ang paghipo ni Jesus sa taong may sakit. Ginamit ang “ang lalaki” sa halip na sunod-sunod na panghalip upang maging malinaw at natural sa Tagalog.
- source_word: εἰπών
  choice: at sinabi
  rationale: Ang koordinadong pandiwa ay mas natural sa Tagalog kaysa pilit na pagpapanatili ng participle, habang nananatili ang pagkakasunod at daloy ng mga kilos.
- source_word: Θέλω
  choice: Nais ko
  rationale: Ipinahahayag ang kusang-loob na pagnanais at kahandaan ni Jesus bilang tugon, nang hindi ito ginagawang simpleng pahayag tungkol sa hinaharap.
- source_word: καθαρίσθητι
  choice: luminis ka
  rationale: Pinananatili ang diwa ng pagiging malinis, na sumasaklaw sa paggaling at sa kalinisan sa kontekstong panrelihiyon at panlipunan; hindi ito pinaliliit sa “gumaling ka” lamang.
- source_word: εὐθέως
  choice: Agad
  rationale: Maikli, malinaw, at natural na katumbas ng agarang pangyayari.
- source_word: λέπρα
  choice: ketong
  rationale: Ito ang nakikilalang tradisyonal na salin sa mga salaysay ng Ebanghelyo. Nililinaw sa talababa na mas malawak ang maaaring saklaw ng sinaunang terminong Griyego kaysa sa makabagong sakit na Hansen.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: nawala sa lalaki
  rationale: Natural na Tagalog para sa ganap na paglisan ng sakit mula sa kanya, nang hindi dinaragdagan ang kahulugan ng teksto.
theological_decisions:
- issue: Paglalarawan sa καθαρίσθητι sa pagpapagaling sa lalaking may ketong
  choice: luminis ka
  alternative: gumaling ka; maging malinis ka
  rationale: Ang “luminis ka” ay nagpapanatili sa motibo ng paglilinis na nasa Griyego, kabilang ang pisikal, panlipunan, at ritwal na dimensiyon. Ang “gumaling ka” ay masyadong medikal, samantalang ang “maging malinis ka” ay posible ngunit hindi gaanong buhay at tuwiran sa kontekstong ito.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang koordinadong mga pandiwa para sa natural na daloy. Inilipat ang talababa sa “ketong,” ang salitang talagang nililinaw nito, sa halip na ilagay sa “kamay.”
