id: LUK.5.11
reference: Luke 5:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ καταγαγόντες τὰ πλοῖα ἐπὶ τὴν γῆν ἀφέντες ⸀πάντα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/011.yaml
  text: And after bringing the boats to land[b][a], they left everything and followed him.
translation:
  language: tl
  text: At nang maiahon nila sa lupa ang mga bangka[a], iniwan nila ang lahat[b] at sumunod sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nang madala nila ang mga bangka sa lupa.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “ang lahat ng bagay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταγαγόντες
  choice: nang maiahon nila
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa mga pangunahing kilos. Likas sa Filipino ang “nang maiahon nila,” at sa konteksto ng mga bangka ay malinaw nitong ipinahihiwatig ang pagdadala sa mga ito mula sa tubig patungo sa lupa.
- source_word: τὰ πλοῖα
  choice: ang mga bangka
  rationale: Bagaman maaaring tumukoy ang πλοῖον sa bangka o barko, “mga bangka” ang angkop at likas na tawag sa mga sasakyang ginagamit sa pangingisda sa Lawa ng Galilea.
- source_word: ἐπὶ τὴν γῆν
  choice: sa lupa
  rationale: Pinananatili nito ang literal na diwa ng pagdadala sa mga bangka “patungo/sa ibabaw ng lupa” nang hindi nililimitahan ang γῆ sa mismong pampang lamang.
- source_word: ἀφέντες
  choice: iniwan nila
  rationale: Dito, ang ἀφίημι ay nangangahulugang iwan o iwanan. Ginawang pandiwang may tahasang simuno upang maging malinaw at natural sa Filipino habang pinananatili ang pagkakasunod ng mga kilos.
- source_word: πάντα
  choice: ang lahat
  rationale: Komprehensibo ang anyong neuter plural. Ang “ang lahat” ay natural sa Filipino at pinananatili ang kabuuang saklaw nang hindi dinaragdagan kung anu-ano mismo ang iniwan.
- source_word: ἠκολούθησαν αὐτῷ
  choice: sumunod sa kanya
  rationale: Pinananatili ng “sumunod sa kanya” kapwa ang literal na kilos ng pagsunod at ang pahiwatig ng pagiging alagad, nang walang labis na pagpapaliwanag.
theological_decisions:
- issue: Saklaw ng pagtalikod na ipinahihiwatig ng πάντα
  choice: iniwan nila ang lahat
  alternative: iniwan nila ang lahat ng bagay; iniwan nila ang lahat-lahat
  rationale: Ipinakikita ng talata ang lubos na pag-iwan bilang tugon kay Jesus. Pinananatili ng “ang lahat” ang bigat at lawak ng pahayag ngunit hindi ipinapasiya kung permanente nilang tinalikuran ang lahat ng pag-aari o kung ano-ano ang tiyak na kasama rito.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “maiahon” bilang karaniwang salitang angkop sa pagdadala ng bangka mula sa tubig tungo sa lupa; iniwasan ang mas teknikal na “idaong,” na maaaring magpahiwatig ng pantalan. Ang “kanya” ay ginamit ayon sa karaniwang modernong ortograpiya.
