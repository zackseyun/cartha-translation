  text: ὁ ⸀δὲ εἶπεν πρὸς αὐτούς· Μὴ δύνασθε τοὺς υἱοὺς τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν ποιῆσαι ⸀νηστεῦσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/034.yaml
  text: And he said to them[a], “You cannot make the wedding guests fast while the bridegroom is with them, can you?”
translation:
  language: tl
  text: Sinabi naman niya sa kanila, “Hindi ba ninyo mapapag-aayuno ang mga panauhin sa kasal[a] habang kasama nila ang lalaking ikakasal?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak ng silid-pangkasalan,” isang idyoma para sa mga kasama ng lalaking ikakasal o mga panauhin sa kasal.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνασθε
  choice: Hindi ninyo maaaring …, hindi ba?
  rationale: Ang μή sa tanong na may pandiwang nasa indicative ay umaasang negatibo ang sagot. Pinananatili ng anyong ito ang retorikal na diin at ang inaasahang pagsang-ayon.
- source_word: υἱοὺς τοῦ νυμφῶνος
  choice: mga panauhin sa kasal
  rationale: Idyoma ito para sa mga kasama ng lalaking ikakasal o mga kalahok sa pagdiriwang. Ang “mga panauhin sa kasal” ay likas at malinaw sa modernong Filipino, samantalang ipinaliliwanag sa talababa ang literal na larawan.
- source_word: νυμφῶνος
  choice: sa kasal
  rationale: Sa loob ng idyoma, ang diin ay nasa kasalan at pagdiriwang, hindi sa isang tiyak na silid o bulwagan.
- source_word: νυμφίος
  choice: lalaking ikakasal
  rationale: Malinaw at kasalukuyang katumbas ito ng lalaking pangunahing tauhan sa kasal, at pinananatili nito ang larawang pangkasal.
- source_word: μετ’ αὐτῶν ἐστιν
  choice: kasama nila
  rationale: Tuwirang ipinahahayag nito na kapiling ng mga panauhin ang lalaking ikakasal.
- source_word: ποιῆσαι νηστεῦσαι
  choice: pag-ayunuhin
  rationale: Pinananatili ng pandiwang sanhi ang diwa ng paggawa o pagpapangyari na mag-ayuno ang ibang tao; hindi nito inaalis ang ποιῆσαι.
- source_word: νηστεῦσαι
  choice: mag-ayuno
  rationale: Ito ang karaniwan at maikling salitang Filipino para sa pag-iwas sa pagkain bilang gawaing panrelihiyon.
theological_decisions:
- issue: Matalinghagang pagkakakilanlan kay Jesus bilang lalaking ikakasal
  choice: Panatilihin ang larawan ng lalaking ikakasal nang walang paliwanag sa pangunahing teksto.
  alternative: Tahasang idagdag na inihahambing ni Jesus ang sarili niya sa lalaking ikakasal.
  rationale: Ipinahihiwatig ng talata ang natatanging papel ni Jesus, ngunit hindi nito tahasang ipinapaliwanag ang buong teolohikal na kahulugan. Pinananatili ng salin ang larawan at ang likas na tensiyon nito.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pag-ayunuhin” upang mapanatili ang pandiwang sanhi, at ang hulaping “hindi ba?” upang malinaw na maipakita na negatibo ang inaasahang sagot sa retorikal na tanong.
