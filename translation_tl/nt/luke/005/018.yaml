  text: καὶ ἰδοὺ ἄνδρες φέροντες ἐπὶ κλίνης ἄνθρωπον ὃς ἦν παραλελυμένος, καὶ ἐζήτουν αὐτὸν εἰσενεγκεῖν καὶ ⸀θεῖναι ἐνώπιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/018.yaml
  text: And behold[a], men were carrying on a bed a man who was paralyzed[b], and they were seeking to bring him in and set him before him.
translation:
  language: tl
  text: At narito, may mga lalaking nagdadala ng isang lalaking paralisado na nakahiga sa isang higaan.[a] Sinisikap nilang ipasok siya at ilagay sa harap niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay maaari ring tumukoy sa isang papag o sopa; ang κλίνη ay isang uri ng higaan.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, sa harap ni Jesus.
    reason: referent_clarification
lexical_decisions:
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili nito ang puwersa ng salitang pantawag-pansin at ang kasiglahan ng salaysay nang hindi gumagamit ng lipas o labis na pormal na pananalita.
- source_word: ἄνδρες
  choice: mga lalaki
  rationale: Tumutukoy ang ἀνήρ sa mga lalaking nasa hustong gulang, kaya hindi ito pinalawak tungo sa pangkalahatang “mga tao.”
- source_word: φέροντες
  choice: nagdadala
  rationale: Ipinahihiwatig ng kasalukuyang participle ang kilos na nagaganap sa tagpo; natural itong naihahayag sa Filipino sa pamamagitan ng aspektong imperpektibo.
- source_word: ἐπὶ κλίνης
  choice: na nasa isang higaan
  rationale: Malawak ang saklaw ng κλίνη at maaaring tumukoy sa higaan, papag, o katulad na higaang nadadala. Ang “higaan” ang pinakapayak na salitang hindi labis na nagpapakipot sa anyo nito.
- source_word: ἄνθρωπον
  choice: isang lalaki
  rationale: Bagaman maaaring pangkalahatan ang ἄνθρωπος, malinaw sa konteksto na isang lalaking indibidwal ang tinutukoy.
- source_word: παραλελυμένος
  choice: paralisado
  rationale: Ipinahahayag nito ang namamalaging kalagayang bunga ng pagkaparalisa, nang hindi nagdaragdag ng kondisyong hindi tahasang sinabi sa Griyego.
- source_word: ἐζήτουν
  choice: sinisikap
  rationale: Ipinapakita ng aspektong imperpektibo ang patuloy na pagtatangka, hindi lamang ang isang natapos na kilos.
- source_word: εἰσενεγκεῖν
  choice: ipasok siya
  rationale: Natural na ipinahahayag nito ang pagdadala sa lalaki papasok; ang aktuwal na pagbubuhat ay malinaw na sa naunang sugnay.
- source_word: θεῖναι
  choice: ilagay
  rationale: Malapit ito sa pangkalahatang diwa ng τίθημι na maglagay o magpuwesto, nang hindi ipinapalagay ang eksaktong posisyon ng katawan.
- source_word: ἐνώπιον αὐτοῦ
  choice: sa harap niya
  rationale: Pinananatili ang panghalip ng Griyego at ang literal na ugnayang “sa harap,” habang ipinapaliwanag sa talababa ang malinaw na tinutukoy nito sa konteksto.
theological_decisions:
- issue: Ang tinutukoy ng panghalip na αὐτοῦ sa hulihan ng talata
  choice: sa harap niya
  alternative: sa harap ni Jesus
  rationale: Malinaw sa konteksto na si Jesus ang tinutukoy, ngunit panghalip ang ginamit ng tekstong Griyego. Pinananatili ng salin ang anyong iyon sa pangunahing teksto at nililinaw ang reperente sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “narito” bilang likas na pantawag-pansin, at iniwasan ang labis na teknikal o denominasyonal na pananalita. Ang lahat ng pananda ng talababa ay inilagay sa mismong pangunahing teksto.
