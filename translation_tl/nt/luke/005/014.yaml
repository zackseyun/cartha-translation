  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ αὐτὸς παρήγγειλεν αὐτῷ μηδενὶ εἰπεῖν, ἀλλὰ ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ, καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου καθὼς προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/014.yaml
  text: And he ordered him to tell no one[a], but go and show yourself to the priest, and offer for your cleansing as Moses commanded[b], for a testimony to them.
translation:
  language: tl
  text: At inutusan niya siya na huwag magsabi kaninuman, kundi, “Pumunta ka at magpakita sa pari, at maghandog ka para sa iyong paglilinis ayon sa iniutos ni Moises,[a] bilang patotoo sa kanila.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tingnan ang Levitico 14 tungkol sa handog na iniutos ni Moises para sa paglilinis mula sa ketong.
    reason: cross_reference
  - marker: b
    text: Ang “sa kanila” ay maaaring tumukoy sa mga pari o sa iba pa. Maaari rin itong unawain bilang patotoo o katibayan laban sa kanila.
    reason: alternative_reading
lexical_decisions:
- source_word: παρήγγειλεν
  choice: mahigpit niyang iniutos
  rationale: Ipinahahayag ang tuwiran at may-awtoridad na utos; ang “mahigpit” ay likas sa kontekstong pagbabawal, bagaman hindi pinalalabis bilang pananakot.
- source_word: μηδενὶ εἰπεῖν
  choice: huwag sabihin iyon kaninuman
  rationale: Natural na Filipino para sa pagbabawal; ang “iyon” ay tumutukoy sa nangyari nang hindi nagdaragdag ng tiyak na nilalaman.
- source_word: ἀπελθὼν
  choice: Pumunta ka
  rationale: Ginawang tuwirang utos kasama ng kasunod na imperatibo upang maging natural sa Filipino habang napapanatili ang pagkakasunod ng kilos.
- source_word: δεῖξον σεαυτὸν τῷ ἱερεῖ
  choice: magpakita sa pari
  rationale: Direkta at natural na katumbas ng pagpapakita ng sarili sa pari para sa pagsusuri.
- source_word: προσένεγκε
  choice: maghandog ka
  rationale: Sa kontekstong ritwal at pangsaserdote, malinaw nitong ipinahihiwatig ang paghahandog na hinihingi ng Kautusan.
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: para sa iyong paglilinis
  rationale: Pinananatili ang ritwal na diwa ng καθαρισμός at hindi ito nililimitahan sa pisikal na paggaling lamang.
- source_word: καθὼς προσέταξεν Μωϋσῆς
  choice: ayon sa iniutos ni Moises
  rationale: Malinaw na iniuugnay ang handog sa tagubilin ng Kautusang ibinigay sa pamamagitan ni Moises.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: bilang patotoo sa kanila
  rationale: Malapit sa Griyego at pinananatiling bukas kung sino ang tinutukoy ng “kanila” at kung positibo, mapatunayan, o laban sa kanila ang patotoo.
theological_decisions:
- issue: Tinutukoy at puwersa ng αὐτοῖς sa εἰς μαρτύριον αὐτοῖς
  choice: “sa kanila,” nang hindi tinutukoy ang grupo o kung pabor o laban sa kanila ang patotoo
  alternative: “sa mga pari,” “sa mga tao,” o “bilang katibayan laban sa kanila”
  rationale: Hindi tahasang pinapangalanan ng Griyego ang tinutukoy ng panghalip, kaya pinananatili ang tunay na kalabuan.
- issue: Kalikasan ng paglilinis
  choice: “paglilinis”
  alternative: “pagpapadalisay” o “paggaling”
  rationale: Ang salita ay may ritwal na saklaw sa konteksto ng Levitico 14; ang “paggaling” ay maaaring magpaliit sa kahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pari” sa halip na mas teknikal na “saserdote,” at tuwirang pananalita upang maging malinaw ang magkakasunod na utos. Ang mga talababa ay inilagay kaagad sa mga pariralang kanilang nililinaw.
