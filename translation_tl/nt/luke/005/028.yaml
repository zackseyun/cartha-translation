  yaml_path: translation/nt/luke/005/028.yaml
  text: And leaving everything behind[a], he got up and followed him.
translation:
  language: tl
  text: At iniwan niya ang lahat, tumayo siya at sumunod sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay sa naunang salaysay nang hindi nagdaragdag ng interpretibong sanhi o bunga.
- source_word: καταλιπὼν
  choice: iniwan
  rationale: Ang aorist participle ay naglalarawan ng kilos na nauna sa pangunahing pandiwa; natural sa Tagalog ang sunod-sunod na pandiwang 'iniwan ... tumayo ... sumunod.'
- source_word: πάντα
  choice: ang lahat
  rationale: Pinananatili ang komprehensibong saklaw ng neuter plural nang hindi tinutukoy kung ari-arian, hanapbuhay, o iba pang bagay lamang ang sakop.
- source_word: ἀναστὰς
  choice: tumayo siya
  rationale: Sa kontekstong pasalaysay, ang ἀνίστημι ay tumutukoy sa pagtayo upang kumilos; malinaw at natural ang 'tumayo siya.'
- source_word: ἠκολούθει
  choice: sumunod
  rationale: Bagaman imperfect ang anyo at maaaring magpahiwatig ng nagpapatuloy na pagsunod, sa kontekstong ito ay natural na ipinapahayag ng payak na aspektong Tagalog na 'sumunod' ang tugon at pagpasok sa pagiging alagad nang hindi labis na binibigyang-kahulugan bilang 'nagsimulang.'
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang panghalip ng Griyego, na malinaw na tumutukoy kay Jesus mula sa agarang konteksto.
theological_decisions:
- issue: Lawak ng pagtalikod ni Levi bilang tugon sa pagkatawag
  choice: Sinasabi ng salin na iniwan niya 'ang lahat' at sumunod kay Jesus.
  alternative: Ipaliwanag ito bilang pansamantalang pag-iwan sa trabaho o permanenteng pagtatakwil sa lahat ng pag-aari.
  rationale: Pinananatili ang ganap na pananalita ng πάντα ngunit hindi nagpapasok ng doktrina tungkol sa tagal o legal na kalagayan ng kanyang mga pag-aari na hindi tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na payak, marangal, at madaling maunawaan. Ang ayos ng mga kilos ay malinaw at natural sa salaysay; walang talababa dahil hindi kailangan upang maingatan ang tunay na diwa o ambiguwidad ng teksto.
