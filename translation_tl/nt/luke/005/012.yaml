  source_fidelity: Kailangan ng maliit na rebisyon. Ang “Minsan” ay hindi tuwirang naghahatid ng pambungad na pormulang ἐγένετο at maaaring magpahiwatig lamang ng malabong dalas o isang dating pangyayari. Ang “punô ng ketong” ay mas tapat sa πλήρης λέπρας kaysa “balot ng ketong.” Napananatili ng “Panginoon,” “kung nais mo,” at “linisin” ang saklaw at tono ng Griyego.
  naturalness: Natural at marangal sa makabagong Filipino Tagalog ang “Nangyari ito habang …” at “naroon ang isang lalaking punô ng ketong.” Ang “nagpatirapa” ay angkop para sa πεσὼν ἐπὶ πρόσωπον; ang “nakiusap” ay sapat na natural para sa marubdob na pagsusumamo.
  terminology: Ang “ketong” ay isang kinikilalang tradisyonal na katumbas ng λέπρα, habang nililinaw ng talababa na hindi ito kinakailangang katumbas lamang ng modernong Hansen’s disease. Ang “linisin” ay wastong pinananatili ang cleansing language ng καθαρίσαι, kabilang ang pisikal at ritwal/panlipunang dimensiyon. Ang “Panginoon” ay angkop na salin ng κύριε nang hindi ipinipilit ang isang tanging teolohikal na pagbasa.
