  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν μιᾷ τῶν πόλεων καὶ ἰδοὺ ἀνὴρ πλήρης λέπρας· ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν πεσὼν ἐπὶ πρόσωπον ἐδεήθη αὐτοῦ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/012.yaml
  text: And it happened that while he was in one of the towns[a], behold, there was a man full of leprosy. And when he saw Jesus, he fell on his face and begged him, saying, “Lord, if you are willing[b], you can cleanse me.”
translation:
  language: tl
  text: 'Nangyari ito habang nasa isa sa mga bayan si Jesus: naroon ang isang lalaking punô ng ketong.[a] Nang makita niya si Jesus, nagpatirapa siya at nakiusap, “Panginoon, kung nais mo, kaya mo akong linisin.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “punô ng ketong,” na nagbibigay-diin sa tindi ng kaniyang kalagayan. Ang salitang Griego ay maaaring tumukoy sa iba’t ibang malubhang sakit sa balat, hindi lamang sa tinatawag ngayong Hansen’s disease.
    reason: lexical_alternative
  - marker: b
    text: O “gawin mo akong malinis.” Ang pandiwa ay maaaring tumukoy hindi lamang sa pisikal na paggaling kundi pati sa ritwal at panlipunang paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ εἶναι αὐτὸν
  choice: Minsan, habang nasa … si Jesus
  rationale: Likas na isinasalin ang pormulang pasalaysay at ang temporal na konstruksyon sa makabagong Tagalog, habang malinaw na ipinakikilala ang tagpo.
- source_word: μιᾷ τῶν πόλεων
  choice: isa sa mga bayan
  rationale: Maaaring tumukoy ang πόλις sa lungsod o bayan; hindi ipinahihiwatig ng konteksto na isa itong malaking sentrong urbano.
- source_word: ἰδοὺ
  choice: may isang lalaki
  rationale: Ang biglang paglitaw ng lalaki sa salaysay ay ipinahahayag sa natural na Tagalog nang hindi gumagamit ng artipisyal o makalumang katumbas ng ‘narito.’
- source_word: πλήρης λέπρας
  choice: balot ng ketong
  rationale: Natural nitong ipinahahayag ang matinding kalagayang tinutukoy ng literal na ‘punô ng ketong.’
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: nagpatirapa siya
  rationale: Malinaw at maikli nitong inilalarawan ang pagbagsak nang padapa bilang pagpapakumbaba at marubdob na pagmamakaawa.
- source_word: ἐδεήθη αὐτοῦ
  choice: nakiusap
  rationale: Ipinahahayag nito ang taimtim at apurahang pakiusap nang hindi nagiging labis na dramatiko.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili nito kapuwa ang magalang na pagtawag kay Jesus at ang posibleng kristolohikal na bigat ng κύριος.
- source_word: ἐὰν θέλῃς
  choice: kung nais mo
  rationale: Tumpak at natural nitong ipinahahayag na ang tanong ay tungkol sa kalooban ni Jesus, hindi sa kakayahan niya.
- source_word: δύνασαί με καθαρίσαι
  choice: kaya mo akong linisin
  rationale: Pinananatili ng ‘linisin’ ang pisikal, ritwal, at panlipunang saklaw ng καθαρίζω sa halip na paliitin ito sa paggaling lamang.
theological_decisions:
- issue: Saklaw ng λέπρα at καθαρίζω sa konteksto ng pagpapagaling
  choice: Gamitin ang ‘ketong’ at ‘linisin’
  alternative: Gamitin ang ‘malubhang sakit sa balat’ at ‘pagalingin’
  rationale: Ang tradisyonal na ‘ketong’ ay madaling makilala, samantalang pinananatili ng ‘linisin’ ang pisikal na paggaling at ang ritwal at panlipunang pagpapanumbalik. Hindi nito ipinapalagay na ang sinaunang λέπρα ay laging eksaktong katumbas ng makabagong Hansen’s disease.
- issue: Kahulugan ng κύριος bilang tawag kay Jesus
  choice: Panginoon
  alternative: Ginoo
  rationale: Pinananatili ng ‘Panginoon’ ang magalang na pagtawag at ang posibleng mas malalim na kristolohikal na pahiwatig, nang hindi ipinipilit na iyon lamang ang kahulugan sa tagpong ito.
- issue: Kondisyon sa ἐὰν θέλῃς
  choice: kung nais mo
  alternative: kung kaya mo
  rationale: Ang lalaki ay hindi nag-aalinlangan sa kapangyarihan ni Jesus; inilalagay niya ang kahilingan sa kalooban ni Jesus. Pinananatili ng salin ang tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Iniwasan ang sobrang literal na pormulang ‘at nangyari’ at ang makalumang ‘narito,’ ngunit pinanatili ang biglang pagpasok ng lalaki sa tagpo. Ginamit ang ‘nagpatirapa’ at ‘Panginoon’ bilang pamilyar at dignified na mga salitang biblikal na nauunawaan pa rin ng karaniwang mambabasa.
