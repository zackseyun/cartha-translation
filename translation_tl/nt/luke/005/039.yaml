  text: ⸀καὶ οὐδεὶς πιὼν ⸀παλαιὸν θέλει νέον· λέγει γάρ· Ὁ παλαιὸς ⸀χρηστός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/039.yaml
  text: And no one[a], after drinking old wine, wants new, for he says, ‘The old is good.’
translation:
  language: tl
  text: At walang sinumang nakainom na ng lumang alak ang nagnanais ng bago, sapagkat sinasabi niya, “Mabuti ang luma.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “Mas mabuti ang luma.”'
    reason: textual_variant
lexical_decisions:
- source_word: οὐδεὶς
  choice: walang sinuman
  rationale: Likas at inklusibong pananalita para sa pangkalahatang pagtukoy sa sinumang tao.
- source_word: πιὼν παλαιὸν
  choice: nakainom na ng lumang alak
  rationale: Ipinahahayag ng aorist participle ang naunang kilos; nilinaw ang ipinahihiwatig na ‘alak’ mula sa konteksto.
- source_word: θέλει νέον
  choice: magnanais ng bago
  rationale: Ipinapakita ng θέλει ang pagnanais o pagkiling; pinananatili ng ‘bago’ ang ellipsis ng Griyego habang malinaw pa rin na alak ang tinutukoy.
- source_word: λέγει γάρ
  choice: sapagkat sinasabi niya
  rationale: Pinananatili ang paliwanag na puwersa ng γάρ at ang pagpapakilala sa tuwirang pananalita.
- source_word: Ὁ παλαιὸς χρηστός ἐστιν
  choice: Mabuti ang luma
  rationale: Ang χρηστός ay payak na ‘mabuti’ o ‘kaaya-aya,’ hindi komparatibong ‘mas mabuti’; pinananatili rin ang maikli at kasabihang anyo ng Griyego.
theological_decisions:
- issue: Pagpapakahulugan sa χρηστός sa paghahambing ng lumang alak at bago
  choice: Mabuti ang luma
  alternative: Mas mabuti ang luma
  rationale: Ang nakalimbag na tekstong Griyego ay may χρηστός, na nangangahulugang ‘mabuti’ o ‘kaaya-aya,’ hindi ‘mas mabuti.’ Hindi dapat gawing tahasang paghahambing sa pangunahing teksto ang hindi komparatibong anyo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang ‘magnanais’ sa halip na mas kolokyal na ‘gugustuhin’ upang mapanatili ang dignidad at malinaw na diwa ng pagnanais. Inilagay ang pananda ng talababa pagkatapos ng sipi upang malinaw na tumutukoy ito sa alternatibong anyo ng huling pahayag.
