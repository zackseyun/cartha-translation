  text: But he would withdraw in the wilderness and pray[a].
translation:
  language: tl
  text: Ngunit madalas siyang lumalayo patungo sa mga liblib na lugar at doon nananalangin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ngunit siya mismo ay lumalayo patungo sa mga liblib na lugar at nananalangin.” Mas literal na gumagamit ang Griyego ng imperfect na pandiwa kasama ng mga participle, na nagpapahayag ng nagpapatuloy o nakagawiang kilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: siya
  rationale: Hayag at bahagyang mariin ang panghalip sa Griyego. Natural sa Tagalog ang “siya,” habang naipahihiwatig ng “Ngunit” ang kaibahan sa naunang salaysay.
- source_word: δὲ
  choice: Ngunit
  rationale: 'Naghuhudyat ito ng banayad na pagsalungat: sa kabila ng lumalaking pansin ng mga tao, regular na lumalayo si Jesus upang manalangin.'
- source_word: ἦν ὑποχωρῶν
  choice: palaging pumupunta
  rationale: Ang imperfect na ἦν kasama ng participle ay nagpapahayag ng nagpapatuloy o nakagawiang kilos. Ipinahahayag ng “palaging pumupunta” ang paulit-ulit na gawain sa natural na Tagalog.
- source_word: ἐν ταῖς ἐρήμοις
  choice: sa mga ilang na lugar
  rationale: Ang pangmaramihang ἐρήμοις ay tumutukoy sa mga lugar na walang tao o liblib. Pinananatili ng “sa” ang diwa ng ἐν, at hindi nililimitahan ng “mga ilang na lugar” ang kahulugan sa isang tiyak na disyerto.
- source_word: καὶ
  choice: at
  rationale: Payak na pag-uugnay sa dalawang nakagawiang kilos.
- source_word: προσευχόμενος
  choice: nananalangin
  rationale: Ang participle ay kaugnay ng parehong imperfect construction at naglalarawan ng kasabay at nakagawiang pananalangin.
theological_decisions:
- issue: Aspekto ng kilos ni Jesus
  choice: Inilalarawan ng talata ang nakagawiang pagpunta ni Jesus sa mga ilang na lugar upang manalangin.
  alternative: Maaaring unawain na isang tiyak na pagkakataon lamang ng pagpunta at pananalangin ang isinasalaysay.
  rationale: Ang imperfect construction na ἦν kasama ng mga present participle ang pinakanatural na nagpapahiwatig ng paulit-ulit o nakagawiang kilos. Desisyong panggramatika ito na hindi nagdaragdag ng partikular na doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga ilang na lugar” upang maipahayag ang pangmaramihang anyo at ang diwa ng mga liblib o walang-taong pook, at ang “palagi” upang gawing malinaw ang nakagawiang aspekto ng kilos.
