base_translation:
  language: en
  yaml_path: translation/nt/luke/005/029.yaml
  text: And Levi made a great banquet for him in his house[b][a], and there was a large crowd of tax collectors and others who were reclining at table with them.
translation:
  language: tl
  text: At naghanda si Levi ng isang malaking handaan para sa kanya sa kanyang bahay. May malaking pangkat ng mga maniningil ng buwis at iba pang tao na nakahilig sa hapag kasama nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “nakahilig sa hapag” ay tumutukoy sa karaniwang ayos ng pagkain sa mga pormal na handaan noong sinaunang panahon: nakahilig ang mga panauhin sa tabi ng mababang hapag.'
    reason: cultural_note
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: isang malaking handaan
  rationale: Ang δοχή ay isang handaan o salusalo na inihanda para sa mga panauhin. Likas at malinaw sa makabagong Tagalog ang “malaking handaan.”
- source_word: αὐτῷ
  choice: para sa kanya
  rationale: Tumutukoy ang panghalip kay Jesus ayon sa konteksto; pinananatili ang panghalip gaya ng nasa Griyego sa halip na idagdag ang pangalan.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: sa sarili niyang bahay
  rationale: Nililinaw ng “sarili niyang” na kay Levi ang bahay, habang natural na isinasalin ang Griyegong parirala.
- source_word: ὄχλος πολὺς τελωνῶν
  choice: napakaraming maniningil ng buwis
  rationale: Ipinapahayag nito ang malaking bilang ng mga τελῶναι nang mas natural sa Tagalog kaysa sa literal na “malaking pulutong ng mga maniningil ng buwis.”
- source_word: ἄλλων
  choice: iba pang tao
  rationale: Pinananatili nitong di-tiyak ang pagkakakilanlan ng ibang mga panauhin, gaya ng Griyego.
- source_word: μετ’ αὐτῶν
  choice: kasama nila
  rationale: Tuwirang pinananatili ang maramihang panghalip ng Griyego at ang posibleng lawak ng tinutukoy nito.
- source_word: κατακείμενοι
  choice: nakahilig sa hapag
  rationale: Ipinahihiwatig nito ang sinaunang kaugaliang paghilig habang kumakain at malinaw na inilalagay ang kilos sa konteksto ng salu-salo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “handaan” at “maniningil ng buwis” bilang karaniwang salitang madaling maunawaan. Pinanatili ang “kasama nila” upang sundan ang maramihang panghalip sa Griyego, at iniwasang tukuyin nang higit sa sinasabi ng teksto ang mga “iba pang tao.”
