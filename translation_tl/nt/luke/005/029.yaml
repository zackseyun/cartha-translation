revisions:
- from: At naghanda si Levi ng isang malaking handaan para sa kanya sa sarili niyang bahay. Naroon din ang napakaraming maniningil ng buwis at iba pang taong nakahilig sa hapag na kasama nila.[a]
  to: At naghanda si Levi ng isang malaking handaan para sa kanya sa kanyang bahay. May malaking pangkat ng mga maniningil ng buwis at iba pang tao na nakahilig sa hapag kasama nila.[a]
  rationale: Inayos ang pangungusap upang malinaw na ang mga maniningil ng buwis at ang iba pang tao ay kapuwa nakahilig sa hapag. Pinanatili ang maramihang “kasama nila,” na katumbas ng μετ’ αὐτῶν, nang hindi pinipilit ang isang tiyak na antecedent na higit sa ipinahihiwatig ng teksto. Pinanatili ang talababa para sa kaugaliang ipinahihiwatig ng κατακείμενοι.
