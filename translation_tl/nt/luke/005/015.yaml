  text: διήρχετο δὲ μᾶλλον ὁ λόγος περὶ αὐτοῦ, καὶ συνήρχοντο ὄχλοι πολλοὶ ἀκούειν καὶ ⸀θεραπεύεσθαι ἀπὸ τῶν ἀσθενειῶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/015.yaml
  text: But the report about him spread even more[a], and large crowds were gathering to hear and to be healed of their sicknesses.
translation:
  language: tl
  text: Ngunit lalo pang kumalat ang balita tungkol sa kanya[a], at maraming tao ang patuloy na nagtitipon upang makinig at mapagaling mula sa kanilang mga karamdaman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang salita tungkol sa kanya” o “ang ulat tungkol sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διήρχετο δὲ μᾶλλον
  choice: Ngunit lalo pang kumalat
  rationale: Ipinahahayag ng imperpektong διήρχετο ang patuloy na paglaganap, habang pinananatili ng “lalo pa” ang pahambing na diin ng μᾶλλον. Likas sa Tagalog ang “kumalat” para sa balitang lumalaganap.
- source_word: ὁ λόγος περὶ αὐτοῦ
  choice: ang balita tungkol sa kanya
  rationale: Sa kontekstong pasalaysay, ang λόγος ay tumutukoy sa balita o ulat tungkol kay Jesus, hindi sa isang teknikal na teolohikal na gamit ng “salita.”
- source_word: συνήρχοντο ὄχλοι πολλοὶ
  choice: nagtitipon ang napakaraming tao
  rationale: Ipinakikita ng imperpekto ang nagpapatuloy o paulit-ulit na pagtitipon. Mas natural sa modernong Tagalog ang “napakaraming tao” kaysa sa literal na “maraming mga pulutong,” habang naihahatid ang lawak ng mga nagkakatipon.
- source_word: ἀκούειν
  choice: upang makinig
  rationale: Ang pawatas ay nagsasaad ng layunin. Ang “makinig” ay natural sa konteksto ng mga taong nagtitipon upang pakinggan si Jesus, bagaman hindi tahasang binanggit sa Griyego ang layon.
- source_word: θεραπεύεσθαι
  choice: mapagaling
  rationale: Pinananatili ng “mapagaling” ang pasibong diwa ng pawatas at malinaw na tumutukoy sa pagtanggap ng kagalingan.
- source_word: ἀπὸ τῶν ἀσθενειῶν αὐτῶν
  choice: sa kanilang mga karamdaman
  rationale: Sa natural na Tagalog, karaniwang sinasabing “mapagaling sa karamdaman.” Ang “karamdaman” ay angkop sa pisikal na mga sakit sa kontekstong ito.
theological_decisions:
- issue: Saklaw ng wikang tumutukoy sa pagpapagaling
  choice: Isinalin bilang tuwirang pisikal na pagpapagaling mula sa mga karamdaman.
  alternative: Gumamit ng mas malawak na pananalitang gaya ng “maging ganap” na maaaring magpahiwatig ng espirituwal na pagpapanumbalik.
  rationale: Sa agarang konteksto, pumupunta ang mga tao upang makinig at mapagaling sa kanilang mga pisikal na karamdaman. Hindi pinalalawak ng talata ang pagpapagaling tungo sa isang tahasang espirituwal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “balita” bilang madaling maunawaang katumbas ng λόγος sa kontekstong pasalaysay; pinanatili sa talababa ang leksikal na alternatibo. Ang “nagtitipon” ay nagpapanatili sa nagpapatuloy na kilos ng imperpekto.
