id: LUK.5.8
reference: Luke 5:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἰδὼν δὲ Σίμων Πέτρος προσέπεσεν τοῖς γόνασιν Ἰησοῦ λέγων· Ἔξελθε ἀπ’ ἐμοῦ, ὅτι ἀνὴρ ἁμαρτωλός εἰμι, κύριε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/008.yaml
  text: But when Simon Peter saw it[a], he fell at Jesus’s knees, saying, “Go away from me, because I am a sinful man[b], Lord.”
translation:
  language: tl
  text: Ngunit nang makita ito ni Simon Pedro, bumagsak siya sa harap ng mga tuhod ni Jesus at nagsabi, “Lumayo ka sa akin, sapagkat ako'y isang makasalanang lalaki, Panginoon.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν
  choice: nang makita iyon
  rationale: Ginawang sugnay na panahunan ang aorist participle upang maging natural sa Tagalog. Ang “iyon” ay tumutukoy sa pambihirang huli ng mga isda na malinaw sa konteksto, bagaman walang tahasang layon sa Griyego.
- source_word: δὲ
  choice: Ngunit
  rationale: 'Ipinahihiwatig ng δέ ang pag-usad ng salaysay na may bahagyang pagsalungat: mula sa himala tungo sa tugon ni Simon Pedro.'
- source_word: Σίμων Πέτρος
  choice: Simon Pedro
  rationale: Pinanatili ang dalawang pangalang nasa tekstong Griyego, gamit ang nakaugaliang anyong Filipino na “Pedro.”
- source_word: προσέπεσεν τοῖς γόνασιν Ἰησοῦ
  choice: nagpatirapa siya sa harap ng mga tuhod ni Jesus
  rationale: Pinananatili ang matinding kilos ng pagbagsak sa harap ni Jesus at ang tiyak na larawan ng “mga tuhod,” sa halip na palitan ito ng “paanan” o sabihing si Pedro lamang ay lumuhod.
- source_word: λέγων
  choice: at sinabi
  rationale: Ang kasabay na participle ay natural na isinalin bilang sunod na pandiwang Filipino.
- source_word: Ἔξελθε ἀπ’ ἐμοῦ
  choice: Lumayo ka sa akin
  rationale: Ipinapahayag ang apurahang kahilingan para sa paghihiwalay sa malinaw at makabagong Tagalog; hindi ito pinalambot bilang simpleng “iwan mo ako.”
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng pakiusap ni Pedro sa isang marangal ngunit pangkaraniwang anyo.
- source_word: ἀνὴρ ἁμαρτωλός
  choice: isang lalaking makasalanan
  rationale: Pinanatili ang tahasang panlalaking pangngalang ἀνήρ at ang panuring na ἁμαρτωλός, bagaman mas karaniwang sabihin sa Filipino na “makasalanan akong tao” o “isa akong makasalanan.”
- source_word: κύριε
  choice: Panginoon
  rationale: Pinananatili ang paggalang at maaaring mas malalim na pagkilala sa awtoridad ni Jesus nang hindi nililimitahan ang salita sa “ginoo” o “maestro.”
theological_decisions:
- issue: Ang diwa ng κύριε bilang tawag ni Simon Pedro kay Jesus
  choice: Panginoon
  alternative: ginoo; maestro
  rationale: Sa konteksto ng himala, pagkatakot, at pagkilala sa sariling kasalanan, pinananatili ng “Panginoon” kapwa ang paggalang at ang posibleng teolohikal na lalim. Hindi nito ipinipilit na ganap nang naipahayag ni Pedro rito ang isang mas huling Kristolohikal na pormula.
- issue: Paglalarawan ni Simon Pedro sa sarili sa ἀνὴρ ἁμαρτωλός
  choice: isang lalaking makasalanan
  alternative: isang makasalanan; makasalanang tao
  rationale: Ang ἀνήρ ay partikular na panlalaki at tumutukoy kay Pedro mismo. Pinanatili ito sa pangunahing teksto upang hindi burahin ang tunay na anyo ng pahayag, habang nililinaw sa talababa ang mas natural na alternatibo.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang matingkad na larawang “sa harap ng mga tuhod ni Jesus,” kahit bahagya itong di-karaniwan sa Tagalog, upang hindi mapalitan ang detalye ng Griyego ng “sa paanan” o mailarawan lamang na lumuhod si Pedro. Ang “sapagkat” at “Panginoon” ay pormal ngunit karaniwan pa ring nauunawaan ng mga mambabasa.
