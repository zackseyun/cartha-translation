- from: Ngunit nang makita iyon ni Simon Pedro, nagpatirapa siya sa harap ng mga tuhod ni Jesus at sinabi, “Lumayo ka sa akin, sapagkat ako ay isang lalaking makasalanan[a], Panginoon.”
  to: Ngunit nang makita ito ni Simon Pedro, bumagsak siya sa harap ng mga tuhod ni Jesus at nagsabi, “Lumayo ka sa akin, sapagkat ako'y isang makasalanang lalaki, Panginoon.”
  rationale: Pinalitan ang “nagpatirapa” ng “bumagsak” upang huwag magdagdag ng tiyak na posisyong nakadapa na hindi tahasang nakasaad sa Griyego. Inayos din ang pagkakasunod ng panuring sa “makasalanang lalaki” para sa mas natural na modernong Filipino, nang hindi inaalis ang panlalaking ἀνήρ. Walang ibang pagbabagong semantiko ang ginawa.
