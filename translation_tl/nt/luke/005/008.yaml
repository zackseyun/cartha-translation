review_pass:
  verdict: revise
  source_fidelity: 'Ang “nagpatirapa” ay mas tiyak kaysa προσέπεσεν: karaniwan itong nagpapahiwatig na nakadapa o nakasubsob. Mas tapat ang “bumagsak” para sa kilos ng pagbagsak sa tapat ng mga tuhod ni Jesus. Napananatili ang implicit na layon na “ito,” ang dalawang pangalan, ang kahilingan ng paglayo, ang dahilan, ang panlalaking paglalarawan sa sarili ni Pedro, at ang “Panginoon” para sa κύριε.'
  naturalness: Nauunawaan ang kasalukuyang teksto, ngunit ang “nagpatirapa ... sa harap ng mga tuhod” ay lumilikha ng hindi kinakailangang larawan ng pagiging nakadapa. Ang “bumagsak siya sa harap ng mga tuhod ni Jesus” ay mas neutral at mas malapit sa kilos na ipinahahayag ng Griyego. Ang “makasalanang lalaki” ay mas likas na ayos ng panuring sa Filipino kaysa “lalaking makasalanan.”
  terminology: Wasto ang “Simon Pedro,” “Jesus,” at “Panginoon.” Ang “makasalanang lalaki” ay pinananatili ang panlalaking ἀνήρ nang hindi isinasalin ang ἁμαρτωλός bilang isang mas malakas o ibang kategoryang termino.
  issues:
  - severity: medium
    issue: Ang “nagpatirapa” ay sobrang espesipikong paglalarawan ng προσέπεσεν.
    rationale: Ang προσέπεσεν ay tumutukoy sa pagbagsak/pagpapatirapa tungo sa isang tao, ngunit hindi tahasang sinasabi na nakadapa siya. Ang “nagpatirapa” ay maaaring magdagdag ng posturang wala sa teksto.
  - severity: low
    issue: Hindi gaanong likas ang ayos na “isang lalaking makasalanan.”
    rationale: Mas karaniwang modernong Filipino ang “isang makasalanang lalaki,” habang pinananatili pa rin ang panlalaking sanggunian ng ἀνήρ.
  revised_text: Ngunit nang makita ito ni Simon Pedro, bumagsak siya sa harap ng mga tuhod ni Jesus at nagsabi, “Lumayo ka sa akin, sapagkat ako'y isang makasalanang lalaki, Panginoon.”
  revised_footnotes:
  - marker: a
    text: O “isa akong makasalanan.” Literal na sinasabi ng Griyego, “isang makasalanang lalaki,” gamit ang salitang partikular na tumutukoy sa lalaki at dito ay kay Simon Pedro mismo.
    reason: lexical_alternative
  revision_rationale: Pinalitan ang “nagpatirapa” ng “bumagsak” upang huwag magdagdag ng tiyak na posisyong nakadapa na hindi tahasang nakasaad sa Griyego. Inayos din ang pagkakasunod ng panuring sa “makasalanang lalaki” para sa mas natural na modernong Filipino, nang hindi inaalis ang panlalaking ἀνήρ. Walang ibang pagbabagong semantiko ang ginawa.
