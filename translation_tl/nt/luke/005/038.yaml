translation:
  language: tl
  text: Ngunit ang bagong alak ay dapat ilagay sa mga sisidlang-balat na bago pa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “ang bagong alak ay dapat ilagay sa mga bagong sisidlang-balat.” Dalawang magkaibang pang-uri ang ginamit sa Griyego: νέος (“bago,” lalo na sa panahon) para sa alak at καινός (“bago/sariwa,” lalo na sa uri o kalagayan) para sa mga sisidlang-balat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Nagpapahayag ito ng pagsalungat sa maling gawaing inilalarawan sa naunang talata at ipinakikilala ang nararapat gawin.
- source_word: οἶνον νέον
  choice: bagong alak
  rationale: Tuwirang binabago ng νέον ang οἶνον at tumutukoy sa alak na bago pa o kamakailan lamang ginawa.
- source_word: εἰς
  choice: sa
  rationale: Sa pariralang “ilagay sa,” likas na ipinahihiwatig sa Filipino ang paggalaw papasok sa isang sisidlan.
- source_word: ἀσκοὺς
  choice: mga sisidlang-balat
  rationale: Ang ἀσκός ay sisidlang yari sa balat ng hayop na ginagamit para sa mga likido, lalo na sa alak. Nililinaw ng tambalang katawagan ang bagay para sa makabagong mambabasa.
- source_word: καινοὺς
  choice: sariwang
  rationale: Ipinahihiwatig ng καινός dito ang pagiging bago o nasa mabuting kondisyon. Ang “sariwa” ay nagpapanatili ng ilang pagkakaiba nito sa νέος, na isinaling “bago” para sa alak.
- source_word: βλητέον
  choice: ay dapat ilagay
  rationale: Ang verbal adjective na βλητέον ay nagpapahayag ng pangangailangan o ng nararapat gawin; malinaw at likas itong naihahayag ng “dapat ilagay.”
theological_decisions:
- issue: Pagkilala sa pagkakaiba ng νέος at καινός sa iisang pangungusap
  choice: Isalin ang νέος bilang “bago” at ang καινός bilang “sariwa.”
  alternative: Isalin ang dalawang pang-uri bilang “bago.”
  rationale: Magkaibang pang-uri ang ginamit sa Griyego. Ang bahagyang pagpapanatili sa pagkakaibang ito ay angkop sa isang kasabihang nakatuon sa pagiging angkop ng sisidlan para sa alak, nang hindi nagdaragdag ng isang tiyak na teolohikong pagpapakahulugan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sisidlang-balat” bilang maikli at malinaw na katawagan sa sisidlang yari sa balat ng hayop; pinanatili ng “bagong … sariwang” ang leksikal na pagkakaiba sa Griyego.
