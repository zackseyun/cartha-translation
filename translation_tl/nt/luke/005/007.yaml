base_translation:
  language: en
  yaml_path: translation/nt/luke/005/007.yaml
  text: So they signaled to their partners in the other boat to come and help them[a]. And they came and filled both boats[c][b], so that they began to sink.
translation:
  language: tl
  text: Kaya sinenyasan nila ang kanilang mga kasosyo sa kabilang bangka na pumunta at tumulong sa kanila. Dumating ang mga ito at pinuno nila ang dalawang bangka, anupat palubog na ang mga iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “anupat lumulubog ang mga iyon.”
    reason: Ang kasalukuyang pawatas na βυθίζεσθαι ay naglalarawan ng paglubog bilang nagaganap na bunga; hindi tahasang minamarkahan ng Griyego kung nagsisimula pa lamang ito.
lexical_decisions:
- source_word: κατένευσαν
  choice: sinenyasan
  rationale: Tumutukoy ang pandiwa sa pagbibigay ng hudyat sa pamamagitan ng kilos o kumpas, malamang mula sa malayo. Likas at malinaw sa makabagong Tagalog ang “sinenyasan.”
- source_word: μετόχοις
  choice: mga kasosyo
  rationale: Sa konteksto ng pangingisda, tumutukoy ito sa mga katuwang sa gawain o negosyo, hindi lamang sa karaniwang mga kasama.
- source_word: ἐν τῷ ἑτέρῳ πλοίῳ
  choice: sa kabilang bangka
  rationale: Natural na ipinakikilala ng “kabilang bangka” ang isa pang bangkang kasama sa tagpo.
- source_word: τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς
  choice: na lumapit at tumulong sa kanila
  rationale: 'Ipinahahayag ng parirala ang layunin ng pagsenyas: pumunta ang mga kasosyo at makibahagi sa mabigat na gawain. Ang “lumapit” ay angkop sa dalawang bangkang nasa lawa.'
- source_word: ἔπλησαν ἀμφότερα τὰ πλοῖα
  choice: pinuno nila ang dalawang bangka
  rationale: Pinananatili ng “pinuno” ang tuwirang larawan ng tekstong Griyego, at malinaw sa konteksto na isda ang inilagay sa mga bangka.
- source_word: ὥστε βυθίζεσθαι αὐτά
  choice: kaya nagsisimula nang lumubog ang mga iyon
  rationale: Ipinahahayag nito ang bunga bilang nagaganap na proseso nang hindi sinasabing tuluyan nang lumubog ang mga bangka.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang “mga kasosyo” upang maipakita ang praktikal na ugnayan ng mga mangingisda, at “sinenyasan” para sa kilos na makikita mula sa kabilang bangka.
