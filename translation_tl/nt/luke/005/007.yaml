revisions:
- from: Kaya sinenyasan nila ang kanilang mga kasosyo sa kabilang bangka na lumapit at tumulong sa kanila. Lumapit naman ang mga ito, at pinuno nila ang dalawang bangka, kaya nagsisimula nang lumubog ang mga iyon.[a]
  to: Kaya sinenyasan nila ang kanilang mga kasosyo sa kabilang bangka na pumunta at tumulong sa kanila. Dumating ang mga ito at pinuno nila ang dalawang bangka, anupat palubog na ang mga iyon.[a]
  rationale: Pinalitan ang masyadong tiyak na “nagsisimula nang lumubog” ng “palubog na,” na mas natural sa modernong Tagalog at mas maingat na sumasalamin sa aspektong nagaganap sa Griyego. Inayos din ang pang-ugnay sa “anupat” upang malinaw na bunga ng pagpuno ng mga bangka ang nalalapit na paglubog.
