lexical_decisions:
- source_word: λέγοντες
  choice: na nagsasabi
  rationale: Iniuugnay ng kasalukuyang pandiwaring ito ang sinasabi ng ipinahiwatig na mga tao sa naunang talata; natural sa Filipino ang pang-ugnay na “na.”
- source_word: ὅτι
  choice: “
  rationale: Ipinakikilala nito ang mismong sinabi; mas natural sa Filipino na gumamit ng panipi kaysa isalin ito bilang “na.”
- source_word: Οὗτος ὁ ἄνθρωπος
  choice: ang taong ito
  rationale: Tuwirang pinananatili ang demonstratibo at ang bahagyang mapanuring tono nang hindi dinaragdagan ng kulay na wala sa Griyego.
- source_word: ἤρξατο
  choice: nagsimulang
  rationale: Natural at tumpak na katumbas ng pandiwang nangangahulugang nagsimula siyang gawin ang kasunod na kilos.
- source_word: οἰκοδομεῖν
  choice: magtayo
  rationale: Sa konteksto ng gusali o tore, malinaw at natural ang “magtayo”; hindi na idinagdag ang layon na hindi tahasang nasa parirala.
- source_word: οὐκ ἴσχυσεν
  choice: hindi niya kayang
  rationale: Ipinahahayag ang kakayahang magawa ang isang bagay, habang pinananatili sa talababa ang posibleng diin sa lakas.
- source_word: ἐκτελέσαι
  choice: tapusin
  rationale: Natural na modernong Filipino para sa pagdadala ng pagtatayo hanggang sa ganap na pagkumpleto.
