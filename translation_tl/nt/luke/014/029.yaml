  text: otherwise[a], after he has laid a foundation and is not able to finish, all who see it may begin to mock him,
translation:
  language: tl
  text: Kung hindi[a], matapos niyang mailagay ang pundasyon ngunit hindi niya kayang tapusin ito, baka simulan siyang pagtawanan ng lahat ng makakakita nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “baka, matapos niyang mailagay ang pundasyon ngunit hindi niya kayang tapusin ito, ay magsimulang pagtawanan siya ng lahat ng makakakita nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μήποτε
  choice: Kung hindi … baka
  rationale: Sa konteksto ng babala, ipinakikilala nito ang hindi kanais-nais na maaaring mangyari. Likas sa modernong Tagalog ang “Kung hindi … baka,” at napapanatili nito ang diwa ng pag-iingat at posibilidad.
- source_word: θέντος αὐτοῦ θεμέλιον
  choice: matapos niyang mailagay ang pundasyon
  rationale: Ang genitive absolute ay nagpapahiwatig na nauna ang paglalagay ng pundasyon bago ang maaaring pagkabigong makatapos.
- source_word: μὴ ἰσχύοντος
  choice: hindi niya kayang
  rationale: Ang ἰσχύω rito ay tumutukoy sa kakayahang gawin ang gawain, hindi lamang sa pisikal na lakas.
- source_word: ἐκτελέσαι
  choice: tapusin ang gusali
  rationale: Ang pandiwa ay nangangahulugang dalhin hanggang sa ganap na pagtatapos. Idinagdag ang “ang gusali” bilang malinaw at likas na ipinahihiwatig na layon sa konteksto ng pagtatayo.
- source_word: πάντες οἱ θεωροῦντες
  choice: lahat ng makakakita nito
  rationale: Ipinahahayag ng θεωρέω ang pagmamasid o pagkakita; ang “nito” ay likas na tumutukoy sa hindi natapos na gusali o sitwasyon.
- source_word: ἄρξωνται αὐτῷ ἐμπαίζειν
  choice: baka magsimulang pagtawanan siya
  rationale: Pinananatili ng “baka” ang potensiyal na bunga ng subjunctive, habang ang “magsimulang pagtawanan” ay tuwirang kumakatawan sa ἄρξωνται at ἐμπαίζειν sa natural na Tagalog.
