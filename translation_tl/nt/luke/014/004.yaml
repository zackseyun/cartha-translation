  text: οἱ δὲ ἡσύχασαν. καὶ ἐπιλαβόμενος ἰάσατο αὐτὸν καὶ ἀπέλυσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/004.yaml
  text: But they kept silent[a]. And taking hold of him[b], he healed him and sent him away.
translation:
  language: tl
  text: Ngunit nanatili silang tahimik.[a] Hinawakan ni Jesus ang lalaki, pinagaling siya, at pinaalis siya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi sila sumagot” o “wala silang sinabi.”
    reason: lexical_alternative
  - marker: b
    text: O “pinawalan siya” o “pinayagang umalis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ngunit ... sila
  rationale: Tumutukoy ang substantibong οἱ sa mga kausap ni Jesus sa naunang talata, at ipinahihiwatig ng δέ ang pagsalungat ng kanilang pananahimik sa tanong niya.
- source_word: ἡσύχασαν
  choice: hindi sila sumagot
  rationale: Sa konteksto, ang aorist ng ἡσυχάζω ay nangangahulugang hindi sila tumugon sa tanong. Likas ito sa modernong Tagalog at hindi nagdaragdag ng dahilan sa kanilang pananahimik.
- source_word: ἐπιλαβόμενος
  choice: Hinawakan ... ang lalaki
  rationale: Pinananatili nito ang pisikal na diwa ng paghawak sa lalaki nang hindi tinutukoy kung gaano kalakas o sa anong paraan ang paghawak.
- source_word: ἰάσατο αὐτόν
  choice: pinagaling siya
  rationale: Karaniwan at malinaw na salin ito ng pisikal na pagpapagaling na ipinahihiwatig ng ἰάομαι.
- source_word: ἀπέλυσεν
  choice: pinayaon
  rationale: Maaaring mangahulugan ang ἀπολύω na paalisin, pawalan, o payaunin. Ang “pinayaon” ay maikli at angkop sa salaysay, at hindi nagpapahiwatig na siya ay dating bilanggo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang tahasang “ni Jesus” sa halip na sunod-sunod na panghalip upang maging malinaw ang gumagawa ng kilos; isinalin ang αὐτόν bilang “ang lalaki” sa unang banggit sa pangungusap para sa natural na daloy.
