  text: εἰ δὲ μήγε, ἔτι ⸂αὐτοῦ πόρρω⸃ ὄντος πρεσβείαν ἀποστείλας ἐρωτᾷ ⸀τὰ πρὸς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/032.yaml
  text: But if not[a], while the other is still far away[b], he sends a delegation and asks for terms of peace.
translation:
  language: tl
  text: Ngunit kung hindi, habang malayo pa ang kabilang hari, magsusugo siya ng isang delegasyon[a] at hihingi ng mga kundisyon para sa kapayapaan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang pangkat ng mga sugo.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang mga bagay na nauukol sa kapayapaan”; ibig sabihin, mga kundisyong magdudulot ng kapayapaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μήγε
  choice: Ngunit kung hindi
  rationale: Pinananatili nito ang pasalungat at kondisyonal na diwa ng parirala at natural itong kaugnay ng naunang tanong sa talinghaga.
- source_word: ἔτι αὐτοῦ πόρρω ὄντος
  choice: habang malayo pa ang kabilang hari
  rationale: Ang genitive absolute ay nagsasaad ng kasabay na kalagayan. Ang αὐτοῦ ay tumutukoy sa haring sumasalungat; nililinaw ito ng “kabilang hari” nang hindi nagdaragdag ng diwa na wala sa konteksto.
- source_word: πρεσβείαν
  choice: isang delegasyon
  rationale: Ang salita ay maaaring tumukoy sa isang embahada o pangkat ng mga sugo. Ang “delegasyon” ay malinaw at likas sa makabagong Filipino para sa pangkat na ipinadadala upang makipag-usap.
- source_word: ἀποστείλας
  choice: magsusugo siya
  rationale: Ang aorist participle ay likas na ipinahayag sa Filipino bilang kilos na nauuna sa paghingi. Ang anyong panghinaharap ay umaayon sa hipotetikal na pagtalakay ng hari sa konteksto.
- source_word: ἐρωτᾷ
  choice: hihingi
  rationale: Dito, ang pandiwa ay nangangahulugang humiling o humingi, hindi lamang magtanong.
- source_word: τὰ πρὸς εἰρήνην
  choice: mga kundisyon para sa kapayapaan
  rationale: Ipinahahayag nito ang idyomatikong diwang mga bagay o kasunduang kailangan upang magkaroon ng kapayapaan, habang iniiwasang gawing mas tiyak kaysa sa pinahihintulutan ng Griyego.
theological_decisions: []
