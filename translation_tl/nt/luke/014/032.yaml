  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kabilang hari” upang maging malinaw ang tinutukoy ng panghalip, at “mga kundisyon para sa kapayapaan” bilang natural na katumbas ng idyomang Griyego.
