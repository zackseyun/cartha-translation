  text: καὶ εἶπεν ὁ κύριος πρὸς τὸν δοῦλον· Ἔξελθε εἰς τὰς ὁδοὺς καὶ φραγμοὺς καὶ ἀνάγκασον εἰσελθεῖν, ἵνα γεμισθῇ ⸂μου ὁ οἶκος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/023.yaml
  text: And the master said to the servant[a], ‘Go out into the roads and hedges, and compel them to come in, so that my house may be filled.’
translation:
  language: tl
  text: At sinabi ng amo sa alipin, “Lumabas ka sa mga daan at sa tabi ng mga bakod, at pilitin mo silang pumasok,[a] upang mapuno ang bahay ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mahigpit silang hikayating pumasok.” Malakas ang pandiwang Griyego at maaari itong mangahulugang “pilitin” o “mariing hikayatin,” ngunit sa talinghagang ito ay hindi nito kailangang ipahiwatig ang paggamit ng pisikal na dahas.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: amo
  rationale: Sa loob ng talinghaga, tumutukoy ito sa taong may-ari at namamahala sa bahay, kaya malinaw na naihahayag ng “amo” ang papel niya nang hindi agad ginagawa itong tuwirang titulong panrelihiyon.
- source_word: δοῦλον
  choice: alipin
  rationale: Pinananatili ng “alipin” ang kalagayang nakapaloob sa δοῦλος at hindi ito pinapalambot bilang karaniwang katulong lamang.
- source_word: Ἔξελθε
  choice: Lumabas ka
  rationale: Tahasang pinananatili ang direksiyong palabas na nasa pandiwang ἐξέρχομαι at ang lakas ng pautos.
- source_word: ὁδοὺς καὶ φραγμοὺς
  choice: mga daan at sa tabi ng mga bakod
  rationale: Ang “mga daan” ay natural para sa ὁδοί. Ang “sa tabi ng mga bakod” ay malinaw na Filipino para sa mga lugar sa may hangganan o bakod kung saan maaaring matagpuan ang mga tao; iniiwasan nito ang di-natural na impresyong papasok mismo sa mga bakod.
- source_word: ἀνάγκασον
  choice: pilitin mo
  rationale: Malakas ang ἀναγκάζω at maaaring mangahulugang pilitin o mariing igiit. Pinananatili ng “pilitin” ang lakas ng orihinal, habang nililinaw sa talababa na sa konteksto ng talinghaga ay hindi nito kailangang ipahiwatig ang pisikal na dahas.
- source_word: εἰσελθεῖν
  choice: pumasok
  rationale: Direkta, natural, at angkop na salin ng pagpasok sa bahay na pinagdarausan ng handaan.
- source_word: ἵνα γεμισθῇ
  choice: upang mapuno
  rationale: Ipinahahayag nito ang layunin ng utos at pinananatili ang pasibong anyo ng pandiwa.
- source_word: μου ὁ οἶκος
  choice: ang bahay ko
  rationale: Ang οἶκος ay ang bahay na pinagdarausan ng handaan; ang “bahay ko” ang pinakadirekta at natural na salin.
theological_decisions:
- issue: Pagpapakahulugan sa κύριος sa loob ng talinghaga
  choice: amo
  alternative: Panginoon
  rationale: Gumaganap ang κύριος bilang taong may-ari o amo sa mundo ng kuwento. Hindi isinasara ng “amo” ang teolohikal na kabuluhan ng talinghaga, ngunit hindi rin nito ginagawang tahasang banal na titulo ang salita sa antas ng salaysay.
- issue: Lakas ng ἀνάγκασον
  choice: pilitin mo silang pumasok
  alternative: mahigpit mo silang hikayating pumasok
  rationale: Hindi pinalalambot sa pangunahing teksto ang malakas na pandiwang Griyego. Gayunman, iniiwasang ipasok ang aral ng marahas na pamimilit sa pamamagitan ng talababa na nagpapakita ng posibleng di-marahas na diwa nito sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “amo” at “alipin” upang maipakita ang ugnayang panlipunan sa talinghaga. Ang “sa tabi ng mga bakod” ay natural na paglalarawan ng mga lugar sa gilid ng daan at hangganan, sa halip na literal ngunit malabong “sa mga bakod.”
