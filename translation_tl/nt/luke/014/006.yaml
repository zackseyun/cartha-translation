  text: And they were not able to reply to these things[a].
translation:
  language: tl
  text: At hindi nila ito masagot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego, maramihan ang literal na pahayag: “sa mga bagay na ito”; maaari ring isalin na “bilang tugon sa mga ito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Karaniwang pang-ugnay ito at likas na ipinagpapatuloy ang salaysay nang hindi nagdaragdag ng temporal o lohikal na diin.
- source_word: οὐκ ἴσχυσαν
  choice: hindi nila ... masagot
  rationale: Ang ἰσχύω kasama ng pawatas ay nagpapahayag dito ng kawalan ng kakayahan. Sa natural na Tagalog, naihahatid ito ng anyong “hindi nila ... masagot” nang hindi ipinahihiwatig na pisikal na lakas ang tinutukoy.
- source_word: ἀνταποκριθῆναι
  choice: masagot
  rationale: Tumutukoy ito sa pagbibigay ng tugon bilang sagot. Ang “masagot” ay maikli at natural, at hindi nagdaragdag ng mapanghamong himig na maaaring ipahiwatig ng “sumagot pabalik.”
- source_word: πρὸς ταῦτα
  choice: ito
  rationale: Bagaman maramihan ang ταῦτα sa Griyego, karaniwang ginagamit sa Tagalog ang isahang “ito” upang tukuyin ang naunang sinabi o mga puntong inilahad; iniiwasan nitong maging matigas ang “ang mga bagay na ito.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na maikli, natural, at marangal. Pinanatili sa talababa ang maramihang anyo ng Griyego, habang ginamit sa pangunahing teksto ang idiomatikong “ito.”
