base_translation:
  language: en
  yaml_path: translation/nt/luke/014/024.yaml
  text: For I tell you that none of those men who were invited will taste my dinner[a].
translation:
  language: tl
  text: 'Sapagkat sinasabi ko sa inyo: wala ni isa sa mga lalaking iyon na inanyayahan ang makakatikim ng aking hapunan[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking handaan” o “aking piging.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Sapagkat sinasabi ko sa inyo
  rationale: Pinananatili ng “sapagkat” ang paliwanag na diwa ng γάρ, at natural na tuwirang pahayag sa Filipino ang “sinasabi ko sa inyo.”
- source_word: οὐδεὶς τῶν ἀνδρῶν ἐκείνων
  choice: walang isa man sa mga lalaking iyon
  rationale: Ipinahahayag ng “walang isa man” ang mariing pagkakait ng οὐδείς, habang pinananatili ng “mga lalaking iyon” ang panlalaking sanggunian ng ἀνδρῶν at ang demonstratibong ἐκείνων.
- source_word: τῶν κεκλημένων
  choice: na inanyayahan
  rationale: Sa konteksto ng handaan, ang perpektong pasibong anyo ng καλέω ay tumutukoy sa mga tumanggap ng paanyaya; mas malinaw rito ang “inanyayahan” kaysa “tinawag.”
- source_word: γεύσεταί
  choice: makakatikim
  rationale: Pinananatili nito ang literal na larawan ng γεύομαι, na sa konteksto ay maaari ring magpahiwatig ng pakikibahagi sa pagkain.
- source_word: μου τοῦ δείπνου
  choice: ng aking hapunan
  rationale: Ang δεῖπνον ay pangunahing pagkain, karaniwang sa gabi. Natural at tuwiran sa modernong Filipino ang “hapunan,” habang pinananatili ang unang panauhang pag-aari na μου.
theological_decisions:
- issue: Ang pahayag ng punong-abala at ang posibleng alegorikong diwa ng handaan
  choice: Pinanatili ang “aking hapunan” bilang pananalita ng punong-abala sa talinghaga.
  alternative: aking handaan / aking piging
  rationale: Hindi tahasang ginawang alegorikal ang pahayag. Sa gayon, nananatili ang tinig ng nagsasalita at ang bigat ng pagkakait nang hindi nagdaragdag ng isang tiyak na teolohikong paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “walang isa man” upang maging mariin ngunit natural ang negasyon, at “hapunan” bilang karaniwang katumbas ng δεῖπνον.
