id: LUK.14.33
reference: Luke 14:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὕτως οὖν πᾶς ἐξ ὑμῶν ὃς οὐκ ἀποτάσσεται πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν οὐ δύναται ⸂εἶναί μου⸃ μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/033.yaml
  text: So then[b][a], every one of you who does not renounce all his own possessions cannot be my disciple.
translation:
  language: tl
  text: Kaya nga, ang bawat isa sa inyo na hindi tumatalikod sa lahat ng kanyang pag-aari[a] ay hindi maaaring maging alagad ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi binibitawan ang lahat ng kanyang tinataglay.” Ang pandiwa sa Griyego ay maaari ring mangahulugang “nagpapaalam” at dito ay nagpapahiwatig ng pagtalikod sa sariling pag-angkin sa mga ari-arian.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν
  choice: Kaya nga
  rationale: Likas na naghahayag ng konklusyon sa Filipino at malinaw na inuugnay ang sinabi ni Jesus sa naunang mga paghahalintulad.
- source_word: πᾶς ἐξ ὑμῶν
  choice: ang bawat isa sa inyo
  rationale: 'Pinananatili ang distributibong diin: personal na saklaw ng hinihingi ang bawat nakikinig.'
- source_word: ὃς οὐκ ἀποτάσσεται
  choice: na hindi tumatalikod
  rationale: Ipinahihiwatig ang tiyak na pagtalikod o pagbitiw sa pag-angkin nang hindi sapilitang nililimitahan ang kahulugan sa pisikal na pamimigay ng lahat ng ari-arian. Inilalahad sa talababa ang literal na larawang ‘nagpapaalam.’
- source_word: πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν
  choice: sa lahat ng kanyang pag-aari
  rationale: Natural at tiyak na katumbas ng idyomang Griyego para sa lahat ng pag-aari o tinataglay ng isang tao. Ang ‘kanyang’ sa Filipino ay likas na hindi tumutukoy sa kasarian.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: ay hindi maaaring maging alagad ko
  rationale: Pinananatili ang mariing pahayag ng kawalan ng kakayahan o posibilidad, hindi lamang ang ideya na hindi ito nararapat.
- source_word: μαθητής
  choice: alagad
  rationale: Karaniwan, marangal, at angkop na katawagan sa Ebanghelyo para sa isang taong sumusunod at natututo kay Jesus.
theological_decisions:
- issue: Ang saklaw ng hinihingi tungkol sa mga ari-arian
  choice: Isinalin bilang pagtalikod sa lahat ng sariling pag-aari, na nagpapanatili sa radikal na hinihingi nang hindi tahasang nagpapasiya na sa bawat kalagayan ay kailangang literal na ipamigay ang lahat.
  alternative: ‘Hindi isinusuko ang lahat ng kanyang pag-aari,’ na maaaring higit na magdiin sa literal na pag-aalis o pamimigay ng pag-aari.
  rationale: Ang ἀποτάσσομαι ay maaaring mangahulugang ‘magpaalam’ at sa kontekstong ito ay nagpapahiwatig ng pagbitiw sa pag-angkin o pagkakapit. Pinananatili ng saling ‘tumatalikod’ ang tindi at tensiyong teolohikal nang hindi nagdaragdag ng isang tiyak na programang pangkabuhayan na hindi tahasang isinasaad ng teksto.
translation_notes:
  register: Makabago at madaling maunawaang Filipino na may marangal na himig. Ginamit ang ‘Kaya nga’ para sa malinaw na ugnayang pangdiskurso at ‘alagad’ bilang kinikilalang katawagan sa konteksto ng Ebanghelyo. Hindi kailangan ng talababa tungkol sa panlalaking anyo ng ἑαυτοῦ sapagkat ang Filipino na ‘kanyang’ ay likas na walang tiyak na kasarian.
