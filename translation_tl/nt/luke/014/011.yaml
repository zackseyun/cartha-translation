id: LUK.14.11
reference: Luke 14:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται καὶ ὁ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/011.yaml
  text: For everyone who exalts himself will be humbled[b][a], and the one who humbles himself will be exalted.
translation:
  language: tl
  text: Sapagkat ang sinumang nagpapakataas ay ibababa, at ang nagpapakababa ay itataas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang tagubilin at likas itong pakinggan sa makabagong Tagalog.
- source_word: πᾶς ὁ ὑψῶν ἑαυτὸν
  choice: ang sinumang nagpapakataas
  rationale: Ang konstruksiyon ay pangkalahatan at kasabihan ang dating. Likas na ipinapahayag ng “sinumang” ang unibersal na saklaw, at malinaw sa “nagpapakataas” na sarili ang itinataas nang hindi na nangangailangan ng hiwalay na panghalip.
- source_word: ταπεινωθήσεται
  choice: ay ibababa
  rationale: Pinananatili nito ang hinaharap na di-tiyak na tagaganap at ang matalim na paghahambing sa “itataas.”
- source_word: καὶ
  choice: at
  rationale: Pinananatili ang payak na pag-uugnay ng dalawang magkasalungat ngunit magkatimbang na sugnay.
- source_word: ὁ ταπεινῶν ἑαυτὸν
  choice: ang nagpapakababa
  rationale: Ipinahihiwatig ng anyong ito ang kusang pagpapakumbaba sa sarili at pinananatili ang balanseng paralelismo sa “nagpapakataas.”
- source_word: ὑψωθήσεται
  choice: ay itataas
  rationale: Pinananatili ang hinaharap na balintiyak at hindi tahasang pinapangalanan kung sino ang magtataas.
theological_decisions:
- issue: Di-binanggit na tagaganap ng mga pandiwang balintiyak
  choice: Panatilihin ang “ibababa” at “itataas” nang walang tahasang tagaganap
  alternative: Idagdag ang “ng Diyos”
  rationale: Hindi pinapangalanan ng Griyego ang tagaganap. Bagaman maaaring ipinahihiwatig ang Diyos, hindi iyon dapat idagdag sa mismong salin.
- issue: Pangkalahatang gamit ng panlalaking isahan sa Griyego
  choice: Gamitin ang inklusibo at likas na “sinumang” at mga pandiwang walang kasarian
  alternative: Gumamit ng “lalaking” o panlalaking panghalip
  rationale: Ang panlalaking anyo sa Griyego ay gumaganap nang pangkalahatan, hindi bilang paghihigpit sa mga lalaki. Walang kasariang gramatikal ang angkop na mga katumbas sa Tagalog.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikli at balanseng anyo ng kasabihan, pati ang paghaharap ng “nagpapakataas/ibababa” at “nagpapakababa/itataas.”
