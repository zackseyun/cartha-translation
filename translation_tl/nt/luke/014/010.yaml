id: LUK.14.10
reference: Luke 14:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν κληθῇς πορευθεὶς ἀνάπεσε εἰς τὸν ἔσχατον τόπον, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ⸀ἐρεῖ σοι· Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον ⸀πάντων τῶν συνανακειμένων σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/010.yaml
  text: But when you are invited[a], go and recline in the lowest place, so that when the one who invited you comes, he will say to you, ‘Friend[b], move up higher.’ Then there will be honor for you in the presence of all who are reclining with you.
translation:
  language: tl
  text: Ngunit kapag inanyayahan ka, pumunta ka at humilig sa hapag sa pinakamababang puwesto[a], upang pagdating ng nag-anyaya sa iyo ay sabihin niya sa iyo, ‘Kaibigan, lumipat ka sa mas mataas na puwesto[b].’ Sa gayon, magkakaroon ka ng karangalan sa harap ng lahat ng kasalo mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Noong panahong iyon, karaniwang nakahilig ang mga panauhin habang kumakain. Maaari ring isalin: “maupo sa pinakamababang puwesto.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “Umakyat ka sa mas mataas na puwesto.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθῇς
  choice: inanyayahan ka
  rationale: Sa konteksto ng handaan, ang καλέω ay tumutukoy sa pag-anyaya, hindi lamang sa pagtawag.
- source_word: πορευθεὶς ἀνάπεσε
  choice: pumunta ka at humilig
  rationale: Ang participle ay kasabay ng pautos at likas na isinasalin bilang magkaugnay na kilos. Pinananatili ng “humilig” ang sinaunang kaugalian ng paghilig sa hapag.
- source_word: ἔσχατον τόπον
  choice: pinakamababang puwesto
  rationale: Tumutukoy ito sa puwestong may pinakamababang antas ng karangalan, hindi lamang sa huling lokasyon.
- source_word: ὁ κεκληκώς σε
  choice: ang nag-anyaya sa iyo
  rationale: Tuwirang ipinahahayag ang pagkakakilanlan ng taong nagpaanyaya nang hindi idinaragdag ang interpretatibong katawagang “punong-abala.”
- source_word: Φίλε
  choice: Kaibigan
  rationale: Likas at tuwirang anyo ito ng magalang na pagtawag sa kausap.
- source_word: προσανάβηθι ἀνώτερον
  choice: lumipat ka sa mas mataas na puwesto
  rationale: Ipinahahayag nito kapwa ang paglipat at ang pag-angat sa puwestong higit na marangal.
- source_word: δόξα
  choice: pararangalan ka
  rationale: Sa panlipunang tagpo ng handaan, ang δόξα ay pampublikong karangalan o pagkilala, hindi kinakailangang banal na kaluwalhatian.
- source_word: ἐνώπιον πάντων τῶν συνανακειμένων σοι
  choice: sa harap ng lahat ng kasalo mo
  rationale: Natural sa modernong Filipino at pinananatili ang pampublikong katangian ng karangalan at ang konteksto ng sama-samang pagkain.
theological_decisions:
- issue: Katangian ng turo
  choice: Isinalin bilang praktikal na tagubilin sa loob ng pagtuturo tungkol sa pagpapakumbaba at karangalan, nang hindi nililimitahan ang kahulugan sa simpleng etiketa.
  alternative: Ipaliwanag ito bilang payong panlipunan lamang o bilang eksklusibong pagtukoy sa gantimpalang pangwakas.
  rationale: Ang larawan ng handaan ay may tuwirang panlipunang saysay ngunit maaari ring magdala ng mas malawak na tema ng pagpapakumbaba at pagbabaligtad ng karangalan; hindi dapat pilitin ng salin ang isa lamang na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “humilig” upang mapanatili ang makasaysayang ayos ng pagkain, na nilinaw sa talababa; ginamit naman ang “kasalo” sa hulihan upang maging natural at madaling maunawaan.
