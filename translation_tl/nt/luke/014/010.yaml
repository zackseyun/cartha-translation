  terminology: Ang “inanyayahan,” “nag-anyaya,” “Kaibigan,” “mas mataas na puwesto,” at “mga kasalo” ay angkop. Pinananatili ang makasaysayang larawan ng pagkain nang nakahilig, na nililinaw sa talababa.
