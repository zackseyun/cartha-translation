  to: Ngunit kapag inanyayahan ka, pumunta ka at humilig sa hapag sa pinakamababang puwesto[a], upang pagdating ng nag-anyaya sa iyo ay sabihin niya sa iyo, ‘Kaibigan, lumipat ka sa mas mataas na puwesto[b].’ Sa gayon, magkakaroon ka ng karangalan sa harap ng lahat ng kasalo mo.
