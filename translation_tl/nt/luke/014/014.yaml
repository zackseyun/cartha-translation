id: LUK.14.14
reference: Luke 14:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ μακάριος ἔσῃ, ὅτι οὐκ ἔχουσιν ἀνταποδοῦναί σοι, ἀνταποδοθήσεται γάρ σοι ἐν τῇ ἀναστάσει τῶν δικαίων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/014.yaml
  text: And you will be blessed[a], because they cannot repay you[b]; for you will be repaid at the resurrection of the righteous.
translation:
  language: tl
  text: At magiging mapalad ka, sapagkat hindi ka nila kayang suklian; sapagkat susuklian ka sa muling pagkabuhay ng mga matuwid.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος ἔσῃ
  choice: magiging mapalad ka
  rationale: Pinananatili ng “mapalad” ang bigat ng banal at panghinaharap na pagpapala, habang malinaw na ipinahahayag ng “magiging” ang anyong panghinaharap ng ἔσῃ.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikita rito ang dahilan kung bakit magiging mapalad ang taong tinutukoy; natural at marangal sa modernong Filipino ang “sapagkat.”
- source_word: οὐκ ἔχουσιν ἀνταποδοῦναί σοι
  choice: hindi ka nila kayang suklian
  rationale: Ipinahahayag nito ang kawalan nila ng kakayahan o paraan upang makaganti ng kabutihan, at iniiwasan ang maling kahulugang wala silang obligasyong suklian siya.
- source_word: ἀνταποδοθήσεται γάρ σοι
  choice: sapagkat susuklian ka
  rationale: Pinananatili ng “susuklian” ang ugnayang leksikal sa naunang “suklian” at malinaw na ipinahahayag ang panghinaharap na pasibo nang hindi gumagamit ng mabigat na pananalita.
- source_word: ἐν τῇ ἀναστάσει τῶν δικαίων
  choice: sa muling pagkabuhay ng mga matuwid
  rationale: Ang “sa” ay natural na panandang temporal sa Filipino, at tuwirang pinananatili ng “ng mga matuwid” kung kaninong muling pagkabuhay ang tinutukoy.
theological_decisions:
- issue: Kahulugan at panahon ng “muling pagkabuhay ng mga matuwid”
  choice: Tuwirang isinalin bilang “sa muling pagkabuhay ng mga matuwid.”
  alternative: “kapag muling binuhay ang mga matuwid”
  rationale: Pinagtitibay ng talata ang panghinaharap na pagsukli ng Diyos na kaugnay ng muling pagkabuhay ng mga matuwid, ngunit hindi nito nilulutas kung ito ay hiwalay sa ibang pagkabuhay na muli o bahagi ng isang pangkalahatang muling pagkabuhay.
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Filipino. Ang “suklian” ay mas neutral kaysa “gantihan,” na maaaring magpahiwatig ng paghihiganti, at pinananatili rin nito ang pag-uulit ng salitang-ugat sa dalawang anyo ng ἀνταποδίδωμι.
