  yaml_path: translation/nt/luke/014/020.yaml
  text: And another said[a], ‘I have married a wife, and for this reason I cannot come.’
translation:
  language: tl
  text: At may isa pang nagsabi, “Nag-asawa ako, kaya hindi ako makakapunta.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: isa
  rationale: Sa sunod-sunod na mga tugon, natural sa Tagalog ang “isa” upang ipakilala ang isa pang taong nagbigay ng dahilan.
- source_word: Γυναῖκα ἔγημα
  choice: Kakapangasawa ko lang
  rationale: Ang γυνή ay nangangahulugang asawa rito dahil layon ito ng γαμέω. Ipinahihiwatig ng kontekstong dahilan ang isang bagong pag-aasawa; natural na ipinapahayag ito sa modernong Tagalog sa pamamagitan ng “kakapangasawa ko lang.”
- source_word: διὰ τοῦτο
  choice: kaya
  rationale: Malinaw at likas na ipinapahayag ng “kaya” ang ugnayang sanhi at bunga ng bagong pag-aasawa at ng pagtangging pumunta.
- source_word: οὐ δύναμαι ἐλθεῖν
  choice: hindi ako makakapunta
  rationale: Ang δύναμαι kasama ng pawatas ay nagsasaad ng kakayahan. Ang “hindi ako makakapunta” ang natural na katumbas sa Tagalog at pinananatili ang ipinahahayag na kawalan ng kakayahang dumalo.
theological_decisions: []
