  text: Ἔλεγεν δὲ πρὸς τοὺς κεκλημένους παραβολήν, ἐπέχων πῶς τὰς πρωτοκλισίας ἐξελέγοντο, λέγων πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/007.yaml
  text: 'He was telling a parable to those who had been invited[a], noticing how they were choosing the places of honor, saying to them:'
translation:
  language: tl
  text: 'Naglahad siya ng isang talinghaga sa mga inanyayahan, habang pinagmamasdan niya kung paano nila pinipili ang mga lugar na pandangal[a], at sinabi niya sa kanila:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga pangunahing puwesto.” Tumutukoy ang salitang Griyego sa mga pinakapinarangalang lugar sa isang handaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Naglahad siya
  rationale: Likas na panimulang pananalita ito sa Filipino para sa paglalahad ng talinghaga. Bagaman imperpekto ang pandiwang Griyego at nagsisilbing paglalarawan ng tagpo, hindi kailangang gawing tahasang tuloy-tuloy ang kilos sa Filipino.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang pang-ugnay ito na nagpapakilos sa salaysay. Sapat na ang natural na pagkakasunod ng mga pangungusap sa Filipino at hindi kailangang dagdagan ng tahasang “ngayon” o “ngunit.”
- source_word: τοὺς κεκλημένους
  choice: mga inanyayahan
  rationale: Pinananatili nito ang diin ng perfect participle sa kalagayan nilang mga taong naanyayahan, nang hindi idinaragdag ang salitang “panauhin,” na ipinahihiwatig lamang ng konteksto.
- source_word: παραβολήν
  choice: isang talinghaga
  rationale: Ang “talinghaga” ang kinikilalang katawagan sa ganitong uri ng pagtuturo sa mga Ebanghelyo at angkop sa marangal ngunit madaling maunawaang rehistro.
- source_word: ἐπέχων
  choice: Napansin niya
  rationale: Ipinahahayag nito ang mapanuring pagmamasid na naging dahilan ng kasunod na pagtuturo. Hinati sa hiwalay na pangungusap upang maging malinaw at natural sa Filipino.
- source_word: πῶς
  choice: kung paano
  rationale: Tuwirang ipinapahayag nito ang paraan ng kanilang pagkilos.
- source_word: πρωτοκλισίας
  choice: mga lugar na pandangal
  rationale: Tumutukoy ito sa mga pinakapinarangalang puwesto sa isang handaan, hindi lamang sa karaniwang mga upuan. Ipinapakita ng salin ang panlipunang kahulugan ng mga puwestong iyon.
- source_word: ἐξελέγοντο
  choice: pinipili
  rationale: Ang aspektong imperpektibo ay angkop na naihahayag ng “pinipili,” na nagpapakitang nagpapatuloy o paulit-ulit ang kanilang pagpili.
- source_word: λέγων πρὸς αὐτούς
  choice: kaya sinabi niya sa kanila
  rationale: Natural na ipinakikilala nito sa Filipino ang tuwirang pananalitang kasunod. Ang “kaya” ay nililinaw ang ugnayan ng kanyang napansin at ng kanyang sinabi nang hindi binabago ang diwa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Hinati ang mahabang konstruksiyong Griyego sa dalawang pangungusap para sa likas na daloy, habang pinananatili ang tagpong pagmamasid, ang patuloy na pagpili ng mga panauhin, at ang panimulang tutuldok para sa kasunod na sinabi ni Jesus.
