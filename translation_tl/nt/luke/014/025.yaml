  text: 'Large crowds were traveling with him[a], and turning, he said to them:'
translation:
  language: tl
  text: 'Maraming tao ang kasabay niyang naglalakbay[a]. Humarap siya at sinabi sa kanila:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Maraming pulutong ang kasabay niyang naglalakbay.” Gumagamit ang Griyego ng maramihang anyo para sa mga pulutong na sumasama sa kanya sa paglalakbay.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνεπορεύοντο
  choice: naglalakbay kasama
  rationale: Ipinahahayag ng imperpektong anyo ang nagpapatuloy na pagsama sa paglalakbay. Likas sa modernong Tagalog ang “naglalakbay kasama” at pinananatili nito ang diwa ng paglakad na kasabay niya.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Banayad na pang-ugnay sa salaysay ang δέ rito, hindi matinding pagsalungat. Sapat na sa Tagalog ang natural na paglipat ng pangungusap nang hindi nagdaragdag ng “ngayon” o “ngunit.”
- source_word: αὐτῷ
  choice: kasama niya
  rationale: Ipinahahayag ng datibo ang pagsama. Pinanatili ang panghalip dahil malinaw sa konteksto na si Jesus ang tinutukoy.
- source_word: ὄχλοι πολλοί
  choice: maraming tao
  rationale: Ang parirala ay tumutukoy sa napakaraming taong sama-samang sumusunod. Mas natural sa karaniwang Tagalog ang “maraming tao” kaysa sa literal ngunit alanganing “maraming mga pulutong.”
- source_word: καὶ
  choice: paghiwalay sa dalawang pangungusap
  rationale: Ang payak na ugnayan ay naipakikita nang natural sa Tagalog sa pagkakasunod ng mga pangungusap, nang hindi kailangang ulitin ang “at.”
- source_word: στραφεὶς
  choice: Lumingon siya
  rationale: Isinasadula nang natural ang kilos na nauna sa pagsasalita. Hindi idinagdag ang mas tiyak na “lumingon sa likod,” sapagkat hindi iyon tahasang sinasabi ng Griyego.
- source_word: εἶπεν
  choice: sinabi
  rationale: Karaniwan at tumpak na katumbas ng pandiwang λέγω sa salaysay.
- source_word: πρὸς αὐτούς
  choice: sa kanila
  rationale: Tinutukoy ng parirala ang mga kinausap; pinananatili ng panghalip ang anyo ng Griyego at malinaw na ang mga tao ang tinutukoy.
