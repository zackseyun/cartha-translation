  text: καὶ εἶπεν ὁ δοῦλος· Κύριε, γέγονεν ⸀ὃ ἐπέταξας, καὶ ἔτι τόπος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/022.yaml
  text: And the servant said[a], ‘Lord, what you commanded has been done[b], and there is still room.’
translation:
  language: tl
  text: At sinabi ng lingkod[a], “Panginoon[b], nagawa na ang iniutos mo, at may lugar pa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “alipin” para sa “lingkod” (δοῦλος).
    reason: lexical_alternative
  - marker: b
    text: O, “Amo” para sa “Panginoon” (Κύριε).
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: lingkod
  rationale: Natural at marangal ang “lingkod” sa makabagong Tagalog at malinaw ang ugnayan nito sa panginoon ng sambahayan. Gayunman, maaari ring tumukoy ang salitang Griyego sa isang “alipin,” kaya pinanatili ang alternatibo sa talababa.
- source_word: Κύριε
  choice: Panginoon
  rationale: Ang bokatibong Κύριε ay tuwirang tawag sa may-ari ng sambahayan. Pinananatili ng “Panginoon” ang awtoridad ng tinutukoy at ang karaniwang katumbas sa Bibliya; posible rin sa konteksto ang “Amo.”
- source_word: γέγονεν
  choice: nagawa na
  rationale: Ipinahihiwatig ng perpektong anyo ang natapos nang pagtupad na may umiiral na resulta. Likas itong naipapahayag sa Tagalog sa pamamagitan ng “nagawa na.”
- source_word: ὃ ἐπέταξας
  choice: ang iniutos mo
  rationale: Tumutukoy ang pariralang ito sa nilalaman ng naunang utos. Malinaw na pinananatili ng “iniutos mo” ang lakas ng awtoritatibong pandiwa at ang isahang kausap.
- source_word: ἔτι
  choice: pa
  rationale: Sa pariralang “may lugar pa,” natural na ipinahahayag ng “pa” na may natitirang kapasidad pagkatapos maisagawa ang utos.
- source_word: τόπος
  choice: lugar
  rationale: Sa tagpo ng handaan, ang “lugar” ay tumutukoy sa natitirang puwang o kapasidad para sa mga panauhin at natural itong pakinggan sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang isahang “mo” upang mapanatili ang bilang ng pandiwang Griyego at ang tuwirang pakikipag-usap ng lingkod sa panginoon ng sambahayan.
