  text: and the one who invited both you and him will come and say to you[a], ‘Give this man your place,’ and then you will begin with shame to take the last place.
translation:
  language: tl
  text: At darating ang nag-anyaya sa inyong dalawa at sasabihin sa iyo, “Ibigay mo sa taong ito ang iyong puwesto.” At saka, nang may kahihiyan, magsisimula kang pumuwesto sa pinakahuling puwesto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pinakamababang puwesto.” Ang pariralang Griyego na τὸν ἔσχατον τόπον ay maaaring tumukoy sa pinakahuling lugar sa pagkakasunod-sunod at, sa tagpong ito ng handaan, sa puwestong may pinakamababang karangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σὲ καὶ αὐτὸν καλέσας
  choice: ang nag-anyaya sa iyo at sa kaniya
  rationale: Pinananatili nito ang substantibong participle at malinaw na tinutukoy ang taong nag-anyaya sa dalawang panauhin, nang hindi nagdaragdag ng katawagang wala sa Griyego.
- source_word: ἐλθὼν ... ἐρεῖ σοι
  choice: lalapit ... at sasabihin sa iyo
  rationale: Ang aorist participle ay kilos na nauuna o kasabay ng pandiwang nasa hinaharap. Sa tagpo ng handaan, natural sa Filipino ang “lalapit” bilang pagdating ng nag-anyaya sa kinauupuan ng panauhin.
- source_word: Δὸς τούτῳ τόπον
  choice: Ibigay mo sa taong ito ang puwesto mo
  rationale: Ipinahihiwatig ng konteksto na ipauubaya ng kinakausap ang sarili niyang puwesto. Ang “taong ito” ay natural na salin ng panlalaking demonstrative sa tagpong ito.
- source_word: μετὰ αἰσχύνης
  choice: nang may kahihiyan
  rationale: Pinananatili ng “kahihiyan” ang masidhing panlipunang diwa ng αἰσχύνη, na higit sa simpleng pagkapahiya o pagkaasiwa.
- source_word: ἄρξῃ ... κατέχειν
  choice: magsisimulang pumuwesto
  rationale: Hayag na pinananatili ang diwa ng “magsimula,” habang ang “pumuwesto” ay natural sa Filipino para sa pagkuha o pag-okupa ng lugar sa ayos ng upuan.
- source_word: τὸν ἔσχατον τόπον
  choice: sa pinakahuling lugar
  rationale: Ang “pinakahuling lugar” ay malapit sa literal na kahulugan at pinananatili ang maaaring diwa ng huli sa pagkakasunod-sunod, habang ipinapaliwanag sa talababa ang kaugnay na antas ng karangalan.
