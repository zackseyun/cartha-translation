revisions:
- from: At lalapit ang nag-anyaya sa iyo at sa kaniya at sasabihin sa iyo, “Ibigay mo sa taong ito ang puwesto mo.” At saka ka magsisimulang pumuwesto, nang may kahihiyan, sa pinakahuling lugar.[a]
  to: At darating ang nag-anyaya sa inyong dalawa at sasabihin sa iyo, “Ibigay mo sa taong ito ang iyong puwesto.” At saka, nang may kahihiyan, magsisimula kang pumuwesto sa pinakahuling puwesto.[a]
  rationale: Pinalitan ang “lalapit” ng “darating” upang huwag magdagdag ng direksiyonal na detalye, nilinaw na ang nag-anyaya ay nag-anyaya sa dalawang tao, at inayos ang salita upang maging mas natural sa modernong Filipino. Pinanatili ang literal na “pinakahuling puwesto” at ang alternatibong pagpapakahulugang “pinakamababang puwesto” sa talababa.
