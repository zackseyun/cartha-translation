translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “puwesto” para sa upuan sa handaan at “lugar” sa huling parirala upang mapanatili ang leksikal na lawak ng τόπος at ang tunay na pagkakaiba sa pagitan ng “pinakahuli” at “pinakamababa.”
