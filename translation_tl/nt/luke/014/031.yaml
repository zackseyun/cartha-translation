  to: O sinong hari, kapag humayo upang makipagdigma sa ibang hari, ang hindi muna uupo at pag-iisipan kung kaya niyang harapin sa pamamagitan ng sampung libong kawal ang dumarating laban sa kanya na may dalawampung libong kawal?[a]
