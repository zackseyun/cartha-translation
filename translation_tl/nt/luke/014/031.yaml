  text: ἢ τίς βασιλεὺς πορευόμενος ⸂ἑτέρῳ βασιλεῖ συμβαλεῖν⸃ εἰς πόλεμον οὐχὶ καθίσας πρῶτον ⸀βουλεύσεται εἰ δυνατός ἐστιν ἐν δέκα χιλιάσιν ⸀ὑπαντῆσαι τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/031.yaml
  text: Or what king[a], going to meet another king in war, will not first sit down and consider whether he is able with ten thousand to oppose the one coming against him with twenty thousand?
translation:
  language: tl
  text: O sinong hari, kapag humayo upang makipagdigma sa ibang hari, ang hindi muna uupo at pag-iisipan kung kaya niyang harapin sa pamamagitan ng sampung libong kawal ang dumarating laban sa kanya na may dalawampung libong kawal?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “harapin” bilang “salubungin”; sa kontekstong ito, tumutukoy ito sa pagsagupa sa dumarating na hukbo sa labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ τίς βασιλεὺς
  choice: O sinong hari
  rationale: Pinananatili ang daloy ng ikalawang paghahambing at ang puwersa ng retorikal na tanong sa likas na modernong Tagalog.
- source_word: πορευόμενος ἑτέρῳ βασιλεῖ συμβαλεῖν εἰς πόλεμον
  choice: kapag humayo upang makipagdigma sa ibang hari
  rationale: Ang “humayo” ay nagpapahiwatig ng sadyang pagkilos, at malinaw na ipinapahayag ng “makipagdigma” ang kontekstong militar nang hindi dinaragdagan ang diwa.
- source_word: οὐχὶ καθίσας πρῶτον βουλεύσεται
  choice: ang hindi muna uupo at pag-iisipan
  rationale: Inaasahan ng οὐχί ang sagot na oo; pinananatili ng salin ang pag-upo muna bago ang maingat na pagsasaalang-alang.
- source_word: εἰ δυνατός ἐστιν ἐν δέκα χιλιάσιν
  choice: kung kaya niyang ... sa pamamagitan ng sampung libong kawal
  rationale: Ipinahahayag ang kakayahan at ang puwersang nasa kanyang kapamahalaan. Idinagdag ang “kawal” bilang likas at kontekstuwal na paglilinaw sa bilang.
- source_word: ὑπαντῆσαι
  choice: harapin
  rationale: Maaaring literal na “salubungin,” ngunit sa kontekstong militar ay tumutukoy sa pagharap sa kalabang hukbo. Ang “harapin” ay nagpapanatili rin ng bahagyang lawak ng pandiwa.
- source_word: τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν
  choice: ang sumasalakay sa kanya na may dalawampung libo
  rationale: Ipinakikita ng ἐπ’ αὐτόν ang mapanlabang pagdating; natural na ipinahahayag ito ng “sumasalakay sa kanya.”
