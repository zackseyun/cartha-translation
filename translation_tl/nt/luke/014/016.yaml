  yaml_path: translation/nt/luke/014/016.yaml
  text: But he said to him[a], “A certain man was making a great dinner and invited many,”
translation:
  language: tl
  text: Sinabi naman niya sa kanya, “May isang lalaking naghahanda ng isang malaking handaan[a] at nag-anyaya ng marami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malaking hapunan.” Ang salitang Griyego na δεῖπνον ay tumutukoy sa pangunahing pagkain; sa kontekstong ito, isa itong pormal na handaang inihahain ng punong-abala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: Sinabi naman niya rito
  rationale: Ipinahihiwatig ng δέ ang banayad na paglipat o tugon sa naunang nagsalita. Likas sa Tagalog ang “naman” at hindi nito pinalalabis ang diwa ng pagsalungat; ang “rito” ay tumutukoy sa taong kausap niya.
- source_word: Ἄνθρωπός τις
  choice: May isang lalaki
  rationale: Pinananatili nito ang di-tiyak ngunit partikular na tauhan na ipinahihiwatig ng τις at ang panlalaking anyo ng pariralang Griyego, sa natural na panimulang anyo ng salaysay sa Tagalog.
- source_word: ἐποίει
  choice: naghahanda
  rationale: Ang aspektong imperpektibo ay naglalarawan ng nagpapatuloy na paghahanda noon. Sa konteksto ng isang handaan, mas natural ang “naghahanda” kaysa literal na “gumagawa.”
- source_word: δεῖπνον μέγα
  choice: isang malaking handaan
  rationale: Ang δεῖπνον ay pangunahing pagkain, madalas na hapunan, at sa konteksto ay isang pormal na salu-salo. Malinaw na naipapahayag ng “malaking handaan” ang μέγα at ang sitwasyon nang hindi nililimitahan ang oras ng pagkain.
- source_word: καὶ ἐκάλεσεν πολλούς
  choice: at nag-anyaya ng marami
  rationale: Sa konteksto ng pagkain, ang καλέω ay nangangahulugang mag-anyaya. Sapat na tinutukoy ng “marami” ang πολλούς nang hindi nagdaragdag ng tahasang pangngalan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “naman” para sa banayad na paglipat ng usapan at ang “handaan” bilang natural na katawagan sa pormal at malaking pagkain.
