revisions:
- from: Ang sinumang hindi nagpapasan ng sarili niyang krus[a] at sumusunod sa likuran ko[b] ay hindi maaaring maging alagad ko.
  to: Ang sinumang hindi nagpapasan ng sarili niyang krus[a] at hindi lumalakad sa likuran ko[b] ay hindi maaaring maging alagad ko.
  rationale: Inulit ang “hindi” upang malinaw na ang dalawang kundisyon ay kapwa nasa ilalim ng negasyon, gaya ng sa Griyego. Pinalitan ang “sumusunod sa likuran ko” ng “lumalakad sa likuran ko” upang mapanatili ang literal na larawan ng pagdating sa likuran ni Jesus sa mas likas na modernong Tagalog. Nananatili ang kahulugan at ang maingat na pagkakaiba ng literal na parirala at ng karaniwang idyomang “sumunod sa akin.”
