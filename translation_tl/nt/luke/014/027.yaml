  verdict: revise
  source_fidelity: Napananatili ng draft ang pangkalahatang kondisyon, ang larawan ng pagpasan ng krus, at ang kawalang-kakayahang maging alagad. Gayunman, ang iisang “hindi” bago ng unang pandiwa ay maaaring hindi malinaw na sumasaklaw din sa ikalawang pandiwa sa Tagalog. Dagdag pa, ang “sumusunod sa likuran ko” ay pinagsasama ang interpretibong “sumusunod” at ang literal na lokasyong “sa likuran,” kaya medyo hindi likas at hindi kinakailangang inuulit ang ideya.
  naturalness: Natural ang “nagpapasan,” “sarili niyang krus,” at “alagad ko.” Mas malinaw at mas natural ang magkaugnay na negatibong sugnay na inuulit ang “hindi,” at ang “lumalakad sa likuran ko” ay maayos na naghahatid ng larawan ng pagparito sa likuran nang hindi ginagawang idyomang alanganin ang “sumusunod sa likuran ko.”
  terminology: Ang “krus” para sa σταυρός at “alagad” para sa μαθητής ay angkop at matatag na mga termino. Ang “sarili niyang” ay wastong paraan upang ipahayag ang reflexive na diin nang hindi nagpapataw ng kasariang hindi likas sa Tagalog.
  issues:
  - severity: medium
    issue: Hindi tahasang saklaw ng negasyon ang ikalawang pandiwa.
    rationale: Sa Griyego, ang οὐ ay sumasaklaw sa parehong “nagdadala” at “dumarating sa likuran ko.” Sa Tagalog, ang “hindi nagpapasan ... at sumusunod ...” ay maaaring mabasa na ang hindi pagpapasan lamang ang tinatanggihan. Ang pag-uulit ng “hindi” ay nag-aalis ng kalabuang ito.
  - severity: low
    issue: Hindi likas ang “sumusunod sa likuran ko.”
    rationale: Ang “sumusunod” ay karaniwan nang nagpapahayag ng ‘follow,’ samantalang ang “sa likuran ko” ay nagdaragdag ng spatial na detalye sa paraang tunog redundant. Ang “lumalakad sa likuran ko” ay mas natural at pinananatili ang larawan ng ἔρχεται ὀπίσω μου.
  revised_text: Ang sinumang hindi nagpapasan ng sarili niyang krus[a] at hindi lumalakad sa likuran ko[b] ay hindi maaaring maging alagad ko.
