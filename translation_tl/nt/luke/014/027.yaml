base_translation:
  language: en
  yaml_path: translation/nt/luke/014/027.yaml
  text: Whoever does not carry his own cross and come after me cannot be my disciple[a][b].
translation:
  language: tl
  text: Ang sinumang hindi nagpapasan ng sarili niyang krus[a] at hindi lumalakad sa likuran ko[b] ay hindi maaaring maging alagad ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagdadala ng sarili niyang krus.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “pumaparito sa likuran ko”; ihambing sa karaniwang panawagan sa pagiging alagad na “sumunod sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: Ang sinuman
  rationale: Isang di-tiyak na panghalip na nagpapahayag ng pangkalahatang kondisyon; likas at malinaw sa modernong Tagalog ang “ang sinuman.”
- source_word: βαστάζει
  choice: nagpapasan
  rationale: Maaaring mangahulugang “magdala” o “magpasan.” Ang “magpasan” ay natural sa larawang may krus at napapanatili ang bigat at halaga ng pagiging alagad.
- source_word: τὸν σταυρὸν ἑαυτοῦ
  choice: ng sarili niyang krus
  rationale: Pinananatili ang reflexive emphasis ng ἑαυτοῦ. Ang “sarili niyang” ay idiomatikong singular sa Tagalog at hindi kailangang tukuyin ang kasarian ng sinuman.
- source_word: ἔρχεται ὀπίσω μου
  choice: sumusunod sa likuran ko
  rationale: Pinagsasama nito ang konkretong larawan ng pagparoon sa likuran ni Jesus at ang kinikilalang diwa ng pagsunod bilang alagad, nang hindi lubusang inaalis ang literal na larawan.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: ay hindi maaaring maging alagad ko
  rationale: Ipinahahayag ng konstruksiyon ang kawalan ng kakayahan o pagiging hindi magkatugma, hindi lamang isang pagbabawal. Natural sa Tagalog ang “hindi maaaring maging alagad ko.”
- source_word: μαθητής
  choice: alagad
  rationale: Ang “alagad” ang karaniwan at angkop na salin sa konteksto ng mga Ebanghelyo, na nagpapahiwatig ng tapat na pagsunod at pagkatuto.
theological_decisions:
- issue: Ang pangkalahatang bisa ng singular reflexive pronoun
  choice: “sarili niyang krus”
  alternative: “kanilang sariling krus”
  rationale: Singular ang Griyego at pangkalahatan ang tinutukoy dahil sa ὅστις. Napapanatili ng singular na “sarili niyang” ang anyo at diin ng teksto nang hindi nagpapasok ng hindi kailangang pagtukoy sa kasarian.
- issue: Ang ugnayan ng literal na paglakad sa likuran at ng pagiging alagad
  choice: “sumusunod sa likuran ko”
  alternative: “sumusunod sa akin”
  rationale: Pinananatili ang spatial na larawan ng ὀπίσω μου habang malinaw pa rin sa karaniwang mambabasa na pagsunod bilang alagad ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “nagpapasan” upang mapanatili ang konkretong larawan at talinghagang bigat ng krus; iniwasan ang sobrang pormal o makalumang pananalita.
