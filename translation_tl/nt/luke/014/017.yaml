  source_fidelity: 'Tumpak ang salin sa mga pangunahing elemento ng Griyego: ang pagsusugo ng lingkod sa oras ng hapunan, ang naunang mga inanyayahan, ang maramihang panawagang “Halikayo,” at ang dahilan na handa na ang lahat. Ang “handa na ang lahat” ay wastong idiomatikong pagbibigay ng kolektibong neuter plural na ἕτοιμα ἐστιν.'
