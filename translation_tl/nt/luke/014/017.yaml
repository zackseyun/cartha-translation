  text: καὶ ἀπέστειλεν τὸν δοῦλον αὐτοῦ τῇ ὥρᾳ τοῦ δείπνου εἰπεῖν τοῖς κεκλημένοις· Ἔρχεσθε, ὅτι ἤδη ἕτοιμά ⸀ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/017.yaml
  text: And at the hour of the dinner he sent his servant to say to those who had been invited[a], ‘Come, because it is already ready.’
translation:
  language: tl
  text: Pagsapit ng oras ng hapunan, isinugo niya ang kanyang lingkod upang sabihin sa mga inanyayahan, “Halikayo, sapagkat handa na ang lahat.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, walang tahasang binanggit na paksa; maaari ring isalin nang mas malapit sa anyo nito, “handa na.” Kolektibo ang pahayag at tumutukoy sa lahat ng inihanda para sa hapunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: isinugo niya
  rationale: Tuwirang ipinapahayag ang pagpapadala sa lingkod para sa isang tiyak na atas; natural din ito sa marangal na salaysay sa Filipino.
- source_word: δοῦλον
  choice: kanyang lingkod
  rationale: Sa tagpong ito ng sambahayan, ang pangunahing papel ng δοῦλος ay bilang tagapaghatid ng mensahe. Ang “lingkod” ay natural sa modernong Filipino nang hindi nagdaragdag ng diin sa legal na katayuan.
- source_word: τῇ ὥρᾳ τοῦ δείπνου
  choice: pagsapit ng oras ng hapunan
  rationale: Pinananatili nito ang tiyak na panahong itinakda para sa pagkain at mas natural kaysa sa literal na “sa oras ng hapunan.”
- source_word: εἰπεῖν
  choice: upang sabihin
  rationale: Ipinakikita ng pawatas ang layunin ng pagsusugo at maayos na naghahanda sa tuwirang sipi.
- source_word: τοῖς κεκλημένοις
  choice: sa mga inanyayahan
  rationale: Ang perfect passive participle ay tumutukoy sa mga taong naanyayahan na bago dumating ang huling paanyayang ito.
- source_word: Ἔρχεσθε
  choice: Halikayo
  rationale: Natural itong maramihang paanyaya o panawagan sa Filipino at ipinahihiwatig ang paglapit sa nagsasalita o sa piging.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan ng panawagan habang pinananatili ang marangal na himig.
- source_word: ἤδη
  choice: na
  rationale: Sa pariralang “handa na,” natural na ipinahahayag ng “na” ang diwa ng ἤδη na natapos na ang paghahanda sa puntong iyon.
- source_word: ἕτοιμά ἐστιν
  choice: handa na ang lahat
  rationale: Ang pangmaramihang neuter na pang-uri na may pandiwang pang-isahan ay kolektibo. Ang “handa na ang lahat” ang natural na katumbas sa Filipino, habang ipinapaliwanag sa talababa na walang tahasang paksa sa Griyego.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Halikayo” bilang natural na maramihang panawagan at ang “handa na ang lahat” upang maipahayag nang idiomatiko ang kolektibong pahayag sa Griyego.
