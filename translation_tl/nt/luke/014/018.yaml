  yaml_path: translation/nt/luke/014/018.yaml
  text: But they all alike began to excuse themselves[a]. The first said to him, ‘I have bought a field, and I need to go out and see it. I ask you[b], consider me excused.’
translation:
  language: tl
  text: Ngunit sabay-sabay na nagsimulang magdahilan ang lahat.[a] Sinabi ng una sa kanya, “Bumili ako ng isang bukid, at kailangan kong pumunta roon at tingnan iyon. Nakikiusap ako sa iyo, ipagpaumanhin mo ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagsimulang tumangging dumalo.” Ang pandiwang Griyego ay maaaring tumukoy sa pagtanggi sa isang paanyaya sa pamamagitan ng pagbibigay ng dahilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο ... παραιτεῖσθαι
  choice: nagsimulang tumanggi at magdahilan
  rationale: Ipinahahayag ng gitnang anyo ang pagsisimula nilang tumanggi sa paanyaya sa pamamagitan ng pagdadahilan. Pinananatili ng pariralang ito ang dalawang kaugnay na diwa ng pandiwa nang natural sa Tagalog.
- source_word: ἀπὸ μιᾶς
  choice: sabay-sabay
  rationale: Ang idyoma ay tumutukoy sa sama-sama o nagkakaisang pagkilos. Ang “sabay-sabay” ay malinaw at likas sa modernong Tagalog nang hindi labis na binibigyang-diin ang ganap na pagkakaisa ng kalooban.
- source_word: πάντες
  choice: silang lahat
  rationale: Tahasang pinananatili ang diin ng Griyego na walang naiwan sa pagtugon nang ganito.
- source_word: Ἀγρόν
  choice: isang bukid
  rationale: Ang ἀγρός ay karaniwang tumutukoy sa bukid o lupang nasa labas ng bayan. Ang “bukid” ang tuwiran at hindi nagdaragdag ng ideya ng isang buong sakahan.
- source_word: ἠγόρασα
  choice: Bumili ako
  rationale: Ang payak na aspektong naganap ay natural sa Tagalog at sapat na naghahayag ng natapos na pagbiling may kasalukuyang kaugnayan.
- source_word: ἔχω ἀνάγκην
  choice: kailangan kong
  rationale: Likas at malinaw itong pagpapahayag ng pangangailangan o obligasyon sa modernong Tagalog.
- source_word: ἐξελθὼν ἰδεῖν αὐτόν
  choice: puntahan at tingnan iyon
  rationale: Natural na inilalahad ang magkaugnay na kilos ng pagpunta sa labas at pagtingin sa lupa. Hindi ginamit ang “suriin” sapagkat maaari nitong dagdagan ang lakas ng simpleng ἰδεῖν.
- source_word: ἐρωτῶ σε
  choice: Nakikiusap ako sa iyo
  rationale: Sa kontekstong ito, ang ἐρωτῶ ay isang magalang na pakiusap. Ang salin ay nagpapanatili sa tahasang pormula ng pakikiusap.
- source_word: ἔχε με παρῃτημένον
  choice: ipagpaumanhin mo ako
  rationale: Isa itong natural na pakiusap na tanggapin ang hindi pagdalo ng nagsasalita bilang may dahilan, habang pinananatili ang resultang kalagayan ng perpektong participle.
- source_word: καὶ
  choice: Ngunit
  rationale: Bagaman pang-ugnay ang καί, adversatibo ang takbo nito rito dahil sinasalungat ng tugon ng mga inanyayahan ang naunang paanyaya.
- source_word: ὁ πρῶτος
  choice: ang una
  rationale: Tuwirang salin ng ordinal na ginagamit bilang pangngalan at nagpapakilala sa unang dahilan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at angkop sa pagbasa ng karaniwang mambabasa. Pinanatili ang kolektibong diin ng tugon at ang magalang ngunit tahasang pagtanggi ng unang inanyayahan.
