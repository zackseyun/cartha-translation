base_translation:
  language: en
  yaml_path: translation/nt/luke/014/013.yaml
  text: But whenever you give a banquet[a], invite the poor, the crippled, the lame[b], the blind.
translation:
  language: tl
  text: Sa halip, tuwing magdaraos ka ng handaan[a], anyayahan mo ang mga dukha, ang mga may kapansanan sa katawan[b], ang mga pilay, at ang mga bulag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “piging” o “salu-salo.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego ay tumutukoy sa mga taong may pisikal na kapansanan at mas malawak ang saklaw kaysa sa kasunod na “mga pilay.” Maaari rin itong isaling “mga may kapansanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Sa halip
  rationale: Ipinakikita nito ang malinaw na pagsalungat sa naunang tagubilin tungkol sa mga hindi dapat unahing anyayahan. Mas angkop dito ang “Sa halip” kaysa sa payak na “Ngunit.”
- source_word: ὅταν
  choice: tuwing
  rationale: Ang ὅταν na may pandiwang nasa subjunctive ay tumutukoy sa anumang pagkakataong mangyari ito, kaya malinaw na naihahatid ng “tuwing” ang di-tiyak at maaaring paulit-ulit na diwa.
- source_word: δοχὴν ποιῇς
  choice: maghahanda ka ng isang handaan
  rationale: Ang idyoma ay nangangahulugang magdaos o maghanda ng salusalo o pagtitipon. Natural sa Filipino ang “maghanda ng isang handaan,” at hindi nito nililimitahan ang okasyon sa hapunan lamang.
- source_word: κάλει
  choice: anyayahan mo
  rationale: Sa konteksto ng isang handaan, ang καλέω ay nangangahulugang mag-anyaya, hindi lamang tumawag. Pinananatili rin ng “mo” ang pang-isahang pautos.
- source_word: πτωχούς
  choice: ang mga dukha
  rationale: Tumutukoy ang pang-uri na ginamit bilang pangngalan sa mga taong salat sa kabuhayan. Ang “mga dukha” ay maikli, dignified, at karaniwang salin sa ganitong konteksto.
- source_word: ἀναπείρους
  choice: ang mga may kapansanan sa katawan
  rationale: Tumutukoy ito sa mga taong may pisikal na kapansanan. Ang pariralang ito ay malinaw at magalang sa modernong Filipino, habang nananatiling mas malawak kaysa sa kasunod na χωλούς.
- source_word: χωλούς
  choice: ang mga pilay
  rationale: Partikular itong tumutukoy sa mga nahihirapan o may kapansanan sa paglakad. Pinananatili ng “mga pilay” ang pagkakaiba nito sa mas malawak na ἀναπείρους.
- source_word: τυφλούς
  choice: ang mga bulag
  rationale: Ito ang tuwiran, maikli, at karaniwang katawagan sa mga taong hindi nakakakita, at pinananatili nito ang anyo ng listahan sa Griyego.
theological_decisions:
- issue: Makabagong paglalarawan sa mga taong may pisikal na kapansanan habang pinananatili ang dalawang magkahiwalay na terminong Griyego
  choice: “ang mga may kapansanan sa katawan, ang mga pilay”
  alternative: “ang mga baldado, ang mga pilay” o pagsamahin ang dalawa bilang “ang mga may kapansanan”
  rationale: 'Magkaiba ang ἀναπείρους at χωλούς sa listahan: mas malawak ang una, samantalang partikular sa hirap sa paglakad ang ikalawa. Pinananatili ng salin ang pagkakaibang ito nang hindi gumagamit ng katawagang maaaring ituring na mapanlait o lipas.'
- issue: Puwersa ng pagsalungat sa naunang tagubilin
  choice: “Sa halip”
  alternative: “Ngunit”
  rationale: Hindi binabago ng salin ang teolohikal na diwa; nililinaw lamang nito na ang utos ay positibong kapalit ng kaugaliang inilarawan sa naunang talata—ang pag-anyaya sa mga hindi inaasahang makagaganti.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “mga may kapansanan sa katawan” bilang malinaw at magalang na katawagan, habang pinanatili ang maikli at retorikal na listahan ng tekstong Griyego.
