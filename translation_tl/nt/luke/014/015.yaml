    rationale: Ang αὐτῷ ay tumutukoy kay Jesus sa daloy ng salaysay. Ang tahasang “kay Jesus” ay paglilinaw ng umiiral na antecedent, hindi dagdag na kahulugan.
  - severity: low
    issue: Mas angkop ang “Mapalad” kaysa “Pinagpala” para sa Μακάριος sa pahayag na ito.
