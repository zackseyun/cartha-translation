  source_fidelity: Tumpak na naihahatid ng draft ang isang di-pinangalanang kasalo na, matapos marinig ang mga naunang sinabi, ay nagpahayag tungkol sa pagkain ng tinapay sa kaharian ng Diyos. Gayunman, ang “Mapalad” ang mas tuwiran at likas na katumbas ng Μακάριος sa anyong makapahayag na ito; hindi nito kinakailangang mangahulugang pagiging masuwerte lamang.
  naturalness: Ang “sinabi nito sa kanya” ay medyo di-likas kapag tao ang tinutukoy at nag-iiwan ng hindi kailangang kalabuan sa mga panghalip. Mas malinaw at mas natural ang pagtukoy kay Jesus bilang tagatanggap ng sinabi. Ang “mga bagay na ito” ay maayos na sumasalamin sa pangmaramihang ταῦτα.
  terminology: Ginagamit ang “Mapalad” sa makabago ngunit marangal na Filipino bilang karaniwang anyo ng pahayag na beatitude. Pinananatili ang “tinapay,” “kaharian ng Diyos,” at “kasalo,” na angkop sa literal na larawan at sa tagpo ng pagkain.
  issues:
