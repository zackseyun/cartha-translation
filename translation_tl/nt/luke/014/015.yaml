id: LUK.14.15
reference: Luke 14:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀκούσας δέ τις τῶν συνανακειμένων ταῦτα εἶπεν αὐτῷ· Μακάριος ⸀ὅστις φάγεται ⸀ἄρτον ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/015.yaml
  text: But one of those reclining at the table with him[a], when he heard these things, said to him[b], “Blessed is whoever will eat bread in the kingdom of God.”
translation:
  language: tl
  text: Nang marinig ng isa sa mga kasalo niya ang mga bagay na ito, sinabi niya kay Jesus, “Mapalad[a] ang sinumang kakain ng tinapay[b] sa kaharian ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Pinagpala.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kumain ng tinapay” ay isang likas na pahayag sa Griyego na maaaring tumukoy sa isang pagkain o pakikisalo sa hapag; pinananatili rito ang literal na larawan.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀκούσας
  choice: Nang marinig
  rationale: Isinalin ang aorist participle bilang likas na sugnay na panahunan upang maipakita ang pagkakasunod ng pakikinig at pagsasalita.
- source_word: δέ
  choice: hindi tahasang isinalin
  rationale: Mahinang panandang pandiskurso ito; sapat nang ipinahihiwatig ng bagong pangungusap at ng tugon ang pag-usad ng salaysay. Ang “Ngunit” ay magiging labis ang pagsalungat sa Filipino.
- source_word: τις τῶν συνανακειμένων
  choice: isa sa mga kasalo niya
  rationale: Tinutukoy nito ang isang di-pinangalanang taong nakahilig na kasalo ni Jesus. Inilalahad ng “kasalo” ang mahalagang tagpo sa hapag nang hindi ipinipilit sa pangunahing teksto ang sinaunang postura sa pagkain.
- source_word: ταῦτα
  choice: ito
  rationale: Likas sa Filipino ang isahang “ito” bilang pagtukoy sa kabuuan ng mga sinabi ni Jesus, bagaman maramihan ang anyong Griyego.
- source_word: εἶπεν αὐτῷ
  choice: sinabi nito sa kanya
  rationale: Pinananatili ang tahasang tagatanggap ng sinabi. Ginamit ang “nito” upang malinaw na ang nagsalita ay ang kasalo, hindi si Jesus.
- source_word: Μακάριος
  choice: Pinagpala
  rationale: Pinananatili nito ang bigat ng pahayag tungkol sa banal na pagpapala at hindi lamang pansariling damdamin ng kasiyahan.
- source_word: ὅστις
  choice: ang sinumang
  rationale: Nananatili ang pangkalahatan at bukás na saklaw ng indefinite relative pronoun.
- source_word: φάγεται
  choice: kakain
  rationale: Tuwirang ipinahahayag ng aspektong kontemplatibo sa Filipino ang hinaharap na pakikibahagi sa pagkain.
- source_word: ἄρτον
  choice: tinapay
  rationale: Pinananatili ang kongkreto at literal na larawan ng Griyego, kahit maaari rin itong tumukoy sa pagkain o pagsasalo sa hapag.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: sa kaharian ng Diyos
  rationale: Tuwirang salin na hindi nagdaragdag ng salitang “piging,” bagaman ipinahihiwatig iyon ng konteksto.
theological_decisions:
- issue: Lakas ng Μακάριος sa pahayag tungkol sa hinaharap na pagkain sa kaharian
  choice: Pinagpala ang sinumang kakain
  alternative: Mapalad ang sinumang kakain
  rationale: Ang “Pinagpala” ay malinaw na nagpapahiwatig ng kalagayang may banal na pagsang-ayon, samantalang ang “Mapalad” ay maaari ring maunawaan bilang pagiging masuwerte lamang. Itinatala sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kasalo” sa halip na literal na “nakahilig sa hapag” upang maging natural sa karaniwang mambabasa habang nananatili ang tagpo ng sama-samang pagkain.
