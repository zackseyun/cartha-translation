  to: Nang marinig ng isa sa mga kasalo niya ang mga bagay na ito, sinabi niya kay Jesus, “Mapalad[a] ang sinumang kakain ng tinapay[b] sa kaharian ng Diyos.”
  rationale: Inayos ang mga panghalip upang maging malinaw at likas ang ugnayan ng nagsalita at ni Jesus. Pinalitan ang pangunahing katumbas ng Μακάριος ng “Mapalad,” ang mas idiomatikong Filipino sa ganitong makapahayag na pahayag, habang iningatan ang “Pinagpala” bilang lehitimong alternatibo sa talababa. Walang idinagdag na piging o ibang kahulugang wala sa teksto.
