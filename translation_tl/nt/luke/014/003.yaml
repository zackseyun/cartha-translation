  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς τοὺς νομικοὺς καὶ Φαρισαίους λέγων· ⸀Ἔξεστιν τῷ σαββάτῳ ⸂θεραπεῦσαι ἢ οὔ⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/003.yaml
  text: And Jesus answered and said to the lawyers and Pharisees[a], “Is it lawful to heal on the Sabbath, or not?”
translation:
  language: tl
  text: At sumagot si Jesus at sinabi niya sa mga dalubhasa sa Kautusan[a] at sa mga Pariseo, “Naaayon ba sa Kautusan ang magpagaling sa araw ng Sabbath, o hindi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga dalubhasa sa batas.” Ang salitang Griyego ay tumutukoy dito sa mga espesyalista sa Kautusang Judio.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: sumagot ... Sinabi niya
  rationale: Pinananatili ang dobleng pananalita ng Griyego (‘sumagot at nagsabi’) ngunit hinahati sa dalawang likas at malinaw na pangungusap sa modernong Tagalog. Ang ‘sumagot’ ay maaari ring tumukoy sa pagtugon ni Jesus sa sitwasyon o di-binibigkas na hamon.
- source_word: νομικοὺς
  choice: mga dalubhasa sa Kautusan
  rationale: Tumutukoy ito sa mga espesyalista sa Kautusang Judio, hindi sa mga abogado sa makabagong batas sibil. Mas malinaw sa karaniwang mambabasa ang ‘mga dalubhasa sa Kautusan.’
- source_word: Φαρισαίους
  choice: mga Pariseo
  rationale: Karaniwang salin sa Tagalog ng pangalan ng pangkat na ito.
- source_word: Ἔξεστιν
  choice: Naaayon ba sa Kautusan
  rationale: Ipinahahayag nito ang legal at panrelihiyong puwersa ng tanong sa konteksto ng Sabbath, sa halip na ang mas pangkalahatang ‘pinapayagan ba.’
- source_word: τῷ σαββάτῳ
  choice: sa araw ng Sabbath
  rationale: Likas na temporal na parirala sa Tagalog at malinaw na tumutukoy sa partikular na araw.
- source_word: θεραπεῦσαι
  choice: ang magpagaling
  rationale: Ang ‘magpagaling’ ang natural na pandiwang Tagalog para sa pagkilos na magdulot ng paggaling sa mga salaysay ng Ebanghelyo.
- source_word: ἢ οὔ
  choice: o hindi
  rationale: Tuwiran at natural na pinananatili ang dalawang posibleng sagot sa tanong.
theological_decisions:
- issue: Paglalahad sa tanong tungkol sa Kautusan at Sabbath nang hindi pa ipinapasok ang konklusyon ni Jesus
  choice: “Naaayon ba sa Kautusan ang magpagaling sa araw ng Sabbath, o hindi?”
  alternative: “Pinapayagan bang magpagaling sa araw ng Sabbath, o hindi?”
  rationale: Pinananatili ng salin ang legal-teolohikal na tensiyon ng tanong. Hindi ito nagdaragdag ng paliwanag tungkol sa awa, pangangailangan, o awtoridad ni Jesus na wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang malaking titik sa ‘Kautusan’ upang linawin na ang tinutukoy ay ang Kautusang Judio, at pinanatili ang ‘Sabbath’ bilang pamilyar na terminong biblikal.
