source:
  edition: SBLGNT
  text: τίς γὰρ ἐξ ⸀ὑμῶν θέλων πύργον οἰκοδομῆσαι οὐχὶ πρῶτον καθίσας ψηφίζει τὴν δαπάνην, εἰ ⸀ἔχει εἰς ἀπαρτισμόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/028.yaml
  text: For which of you[a], wanting to build a tower, does not first sit down and calculate the cost[b], whether he has enough to complete it?
translation:
  language: tl
  text: Sapagkat sino sa inyo na nagnanais magtayo ng isang tore ang hindi muna uupo at kakalkulahin ang gastos, kung mayroon siyang sapat na salapi upang matapos ito?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kung mayroon siya para sa pagtatapos.” Ang diwa ay kung mayroon siyang sapat na panustos upang matapos ang proyekto.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἐξ ὑμῶν
  choice: Sapagkat sino sa inyo
  rationale: Pinananatili ang γάρ bilang ugnay sa naunang turo at ang tuwirang retorikal na tanong sa mga nakikinig.
- source_word: θέλων πύργον οἰκοδομῆσαι
  choice: na nagnanais magtayo ng isang tore
  rationale: Likas at marangal na Filipino na pinananatili ang layunin ng participle at ang tahasang larawan ng tore.
- source_word: οὐχὶ πρῶτον καθίσας
  choice: ang hindi muna uupo
  rationale: Ipinahihiwatig ng οὐχί ang positibong sagot sa retorikal na tanong; ipinapakita ng “muna” ang nauunang pagkilos.
- source_word: ψηφίζει τὴν δαπάνην
  choice: kakalkulahin ang gastos
  rationale: Sa konteksto ng pagtatayo, ang ψηφίζει ay mas natural na tumutukoy sa maingat na pagkalkula kaysa simpleng pagbibilang.
- source_word: εἰ ἔχει εἰς ἀπαρτισμόν
  choice: upang malaman kung sapat ang kanyang salapi para matapos iyon
  rationale: 'Ginagawang malinaw sa natural na Filipino ang eliptikong Griyego: sinusuri kung may sapat na panustos ang tagapagtayo upang matapos ang proyekto.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “kakalkulahin ang gastos” bilang karaniwang pananalita sa pagpaplano ng pagtatayo, at nilinaw sa teksto ang ipinahihiwatig na sapat na panustos nang hindi binabago ang diwa.
