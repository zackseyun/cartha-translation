revisions:
- from: Sinabi rin niya sa nag-anyaya sa kanya, “Kapag naghahanda ka ng tanghalian o hapunan, huwag mong anyayahan ang iyong mga kaibigan, mga kapatid na lalaki, mga kamag-anak, o mayayamang kapitbahay. Baka anyayahan ka rin nila bilang ganti, at sa gayon ay masuklian ka.[a]”
  to: Sinabi rin niya sa taong nag-anyaya sa kanya, “Kapag nagdaraos ka ng tanghalian o hapunan, huwag mong anyayahan ang iyong mga kaibigan, mga kapatid na lalaki, mga kamag-anak, o mayayamang kapitbahay, baka anyayahan ka rin nila bilang ganti at iyon na ang maging kabayaran sa iyo.”
  rationale: Inayos ang paglalarawan ng pagdaraos ng pagkain upang ipahayag ang idiomatikong gamit ng ποιέω sa konteksto ng handaan. Pinalitan ang huling sugnay upang mapanatili ang katotohanang ang kapalit na paanyaya ang nagiging kabayaran, sa halip na iugnay lamang ang kabayaran sa taong “masusuklian.” Hindi na kailangan ang dating talababa sapagkat ang binagong teksto ay naipapahayag na ang mas literal na diwa nang malinaw.
