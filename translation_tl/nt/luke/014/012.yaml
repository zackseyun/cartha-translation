id: LUK.14.12
reference: Luke 14:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τῷ κεκληκότι αὐτόν· Ὅταν ποιῇς ἄριστον ἢ δεῖπνον, μὴ φώνει τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους, μήποτε καὶ αὐτοὶ ⸂ἀντικαλέσωσίν σε⸃ καὶ γένηται ⸂ἀνταπόδομά σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/012.yaml
  text: And he was also saying to the one who had invited him[a], “When you give a luncheon or a dinner, do not invite your friends or your brothers or your relatives or rich neighbors[c][b], lest they also invite you in return and it become repayment to you.”
translation:
  language: tl
  text: Sinabi rin niya sa taong nag-anyaya sa kanya, “Kapag nagdaraos ka ng tanghalian o hapunan, huwag mong anyayahan ang iyong mga kaibigan, mga kapatid na lalaki, mga kamag-anak, o mayayamang kapitbahay, baka anyayahan ka rin nila bilang ganti at iyon na ang maging kabayaran sa iyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ
  choice: Sinabi rin niya
  rationale: Ang imperpektong ἔλεγεν ay bahagi ng nagpapatuloy na tagpo, ngunit mas natural sa salaysay na Tagalog ang simpleng “sinabi”; pinananatili ng “rin” ang καί at hindi labis na binibigatan ang banayad na δέ.
- source_word: τῷ κεκληκότι αὐτόν
  choice: sa nag-anyaya sa kanya
  rationale: Tuwirang inilalarawan ang taong naunang nag-anyaya kay Jesus, nang hindi gumagamit ng mas interpretibong “punong-abala.”
- source_word: Ὅταν ποιῇς
  choice: Kapag naghahanda ka
  rationale: Sa pagsama sa mga katawagan para sa pagkain, ang ποιέω ay tumutukoy sa paghahanda o pagdaraos ng isang handaan; likas sa Tagalog ang “naghahanda ka ng tanghalian o hapunan.”
- source_word: ἄριστον ἢ δεῖπνον
  choice: tanghalian o hapunan
  rationale: Ang ἄριστον ay mas maagang pagkain, karaniwang sa bandang tanghali, samantalang ang δεῖπνον ay mas huling pangunahing pagkain. Malinaw at kasalukuyang Tagalog ang pares na ito.
- source_word: μὴ φώνει
  choice: huwag mong anyayahan
  rationale: Bagaman literal na “tawagin,” ang pandiwa sa konteksto ng pagkain ay nangangahulugang mag-anyaya.
- source_word: τοὺς ἀδελφούς σου
  choice: mga kapatid na lalaki
  rationale: Pinananatili ang panlalaking anyo ng ἀδελφούς sa listahan sa halip na awtomatikong gawing walang kasarian.
- source_word: τοὺς συγγενεῖς σου
  choice: mga kamag-anak
  rationale: Karaniwan at malinaw na katumbas ng συγγενεῖς sa modernong Tagalog.
- source_word: γείτονας πλουσίους
  choice: mayayamang kapitbahay
  rationale: Tuwirang pinananatili ang paglalarawan ng πλουσίους sa γείτονας.
- source_word: μήποτε καὶ αὐτοὶ ἀντικαλέσωσίν σε
  choice: Baka anyayahan ka rin nila bilang ganti
  rationale: Ipinahahayag ng “baka” ang babalang μήποτε, at ng “bilang ganti” ang gantihang diwa ng tambalang ἀντικαλέω.
- source_word: καὶ γένηται ἀνταπόδομά σοι
  choice: at sa gayon ay masuklian ka
  rationale: Natural na Tagalog ito para sa literal na ideyang “maging kabayaran iyon sa iyo,” habang pinananatili ang diwa ng kapalit o pagganti.
theological_decisions:
- issue: Saklaw ng pagbabawal sa pag-anyaya
  choice: Isinalin bilang tuwirang utos sa ikalawang panauhan nang walang idinagdag na paliwanag o kwalipikasyon.
  alternative: Ipaliwanag sa teksto na hindi absolutong pagbabawal ito kundi pagtuligsa sa pakikipagpalitan ng pabor.
  rationale: Hindi dapat ipasok sa mismong talata ang isang interpretibong paglutas; pinananatili ang matalas na anyo at tensiyon ng sinabi ni Jesus.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “tanghalian” at “hapunan” sa halip na mas lumang o rehiyonal na katawagan, at iniwasan ang sobrang pormal na mga parirala. Ang footnote marker [a] ay inilagay sa mismong teksto.
