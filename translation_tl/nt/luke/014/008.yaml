base_translation:
  language: en
  yaml_path: translation/nt/luke/014/008.yaml
  text: When you are invited by someone to a wedding feast, do not recline in the place of honor, lest someone more honored than you has been invited by him.
translation:
  language: tl
  text: Kapag inanyayahan ka ng isang tao sa handaan sa kasal[a], huwag kang pumuwesto[c] sa pinakamarangal na lugar[b], baka may inanyayahan siyang taong higit na iginagalang kaysa sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa isang kasal.” Ang pangmaramihang anyo sa Griyego ay maaaring tumukoy sa mga pagdiriwang ng kasal, lalo na sa handaan.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang puwestong may pinakamataas na karangalan sa hapag.
    reason: cultural_note
  - marker: c
    text: Literal na “huwag kang humilig.” Sa mga pormal na kainan noong sinaunang panahon, karaniwang nakahilig sa tabi ng hapag ang mga kumakain sa halip na nakaupong tuwid.
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν
  choice: Kapag
  rationale: Likas na nagpapahayag ng pangkalahatang kalagayang maaaring mangyari, gaya ng gamit ng ὅταν sa konteksto.
- source_word: κληθῇς ὑπό τινος
  choice: inanyayahan ka ng isang tao
  rationale: Sa konteksto ng handaan, ang καλέω ay nangangahulugang mag-anyaya; pinananatili ng “isang tao” ang pagiging di-tiyak ng τινος.
- source_word: εἰς γάμους
  choice: sa handaan sa kasal
  rationale: Ang pangmaramihang γάμοι ay maaaring tumukoy sa mga pagdiriwang ng kasal, lalo na sa handaan; akma ito sa konteksto ng mga puwesto sa hapag.
- source_word: μὴ κατακλιθῇς
  choice: huwag kang pumuwesto
  rationale: Ang literal na paghilig sa hapag ay hindi natural na larawan para sa karaniwang mambabasang Filipino; ipinahahayag ng “pumuwesto” ang kilos sa konteksto, habang inilalagay sa talababa ang sinaunang kaugalian.
- source_word: εἰς τὴν πρωτοκλισίαν
  choice: sa pinakamarangal na lugar
  rationale: Tumutukoy ang πρωτοκλισία sa puwestong may pinakamataas na karangalan sa isang pormal na handaan, hindi lamang sa isang karaniwang upuan.
- source_word: μήποτε
  choice: baka
  rationale: Natural na naghahatid sa Filipino ng babala tungkol sa posibleng pangyayaring dahilan ng naunang utos.
- source_word: ἐντιμότερός σου
  choice: higit na iginagalang kaysa sa iyo
  rationale: Ipinahahayag ang paghahambing sa karangalan o pagpapahalagang panlipunan nang hindi ipinapalagay na likas na mas mabuti ang pagkatao ng isa.
- source_word: ᾖ κεκλημένος ὑπ’ αὐτοῦ
  choice: may inanyayahan din siya
  rationale: Ipinakikita ng “inanyayahan” ang natapos nang paanyaya na may kaugnayan sa kasalukuyang handaan; ang “siya” ay tumutukoy sa taong nag-anyaya.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pumuwesto” bilang natural na katumbas sa pangunahing teksto, habang pinanatili sa talababa ang tiyak na sinaunang kaugalian ng paghilig sa hapag. Ang “higit na iginagalang” ay nagpapanatili sa diwa ng karangalang panlipunan nang hindi ito ginagawang paghatol sa moral na pagkatao.
