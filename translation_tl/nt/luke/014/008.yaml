  terminology: Ang “handaan sa kasal,” “pinakamarangal na lugar,” at “higit na iginagalang” ay angkop sa konteksto ng marangal na handaan at katayuang panlipunan. Napananatili ng mga ito ang diwa nang hindi nagdaragdag ng doktrinal na pagbasa.
