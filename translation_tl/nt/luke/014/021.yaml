  naturalness: Natural sa modernong Filipino ang karamihan ng salin. Mas malinaw at mas dumadaloy ang buong sugnay bilang "Nagalit ang may-ari ng bahay at sinabi..." kaysa "Galit na sinabi...".
  terminology: Ang "lingkod," "panginoon," "may-ari ng bahay," "mga dukha," "mga may kapansanan," "mga bulag," at "mga pilay" ay katanggap-tanggap sa rehistro ng talinghaga. Napananatili ng mga talababa ang alternatibong "amo" at ang mas tiyak na saklaw ng ἀναπείρους.
