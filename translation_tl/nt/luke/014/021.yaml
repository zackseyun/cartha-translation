id: LUK.14.21
reference: Luke 14:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ παραγενόμενος ὁ ⸀δοῦλος ἀπήγγειλεν τῷ κυρίῳ αὐτοῦ ταῦτα. τότε ὀργισθεὶς ὁ οἰκοδεσπότης εἶπεν τῷ δούλῳ αὐτοῦ· Ἔξελθε ταχέως εἰς τὰς πλατείας καὶ ῥύμας τῆς πόλεως, καὶ τοὺς πτωχοὺς καὶ ἀναπείρους καὶ ⸂τυφλοὺς καὶ χωλοὺς⸃ εἰσάγαγε ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/021.yaml
  text: And when the servant came back[a], he reported these things to his lord. Then the master of the house, becoming angry, said to his servant, ‘Go out quickly into the broad streets and lanes of the city[b], and bring in here the poor and disabled and blind and lame.’
translation:
  language: tl
  text: Nang bumalik ang lingkod, iniulat niya sa kanyang panginoon[a] ang mga bagay na ito. Nagalit ang may-ari ng bahay at sinabi sa kanyang lingkod, ‘Lumabas ka agad sa malalapad na lansangan at makikipot na daan ng lungsod, at dalhin mo rito ang mga dukha, mga may kapansanan[b], mga bulag, at mga pilay.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “amo.” Ang “panginoon” (κύριος) dito ay tumutukoy sa taong nakatataas sa lingkod, hindi tahasang sa Diyos.
    reason: lexical_alternative
  - marker: b
    text: O “mga pingkaw,” ibig sabihin, mga napinsala o kulang ang bahagi ng katawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: Pagbalik
  rationale: Sa daloy ng salaysay, bumalik ang lingkod upang iulat ang tugon ng mga inanyayahan. Likas sa Tagalog ang “pagbalik” at malinaw nitong ipinahihiwatig ang pagbabalik sa kanyang panginoon.
- source_word: δοῦλος
  choice: lingkod
  rationale: Ang diin dito ay ang tungkulin sa sambahayan sa loob ng talinghaga. Ang “lingkod” ay natural at marangal sa modernong Tagalog, bagaman maaari ring tumukoy ang Griyego sa isang alipin.
- source_word: ἀπήγγειλεν
  choice: iniulat
  rationale: Tumpak na inilalarawan ng “iniulat” ang paghahatid ng impormasyon sa isang nakatataas.
- source_word: κυρίῳ
  choice: panginoon
  rationale: Tumutukoy ito sa taong nakatataas sa lingkod, hindi tahasang sa Diyos. Ginamit ang maliit na titik upang mapanatili ang relasyonal na kahulugan nang hindi ipahiwatig ang banal na titulo.
- source_word: ὀργισθεὶς
  choice: Galit na
  rationale: Natural itong nagpapahayag na ang galit ang naging reaksiyon ng may-ari bago siya nag-utos, nang hindi pinatitindi sa “galit na galit.”
- source_word: οἰκοδεσπότης
  choice: may-ari ng bahay
  rationale: Malinaw at karaniwang Tagalog para sa pinuno o amo ng sambahayan sa tagpong ito.
- source_word: ταχέως
  choice: agad
  rationale: Ipinahahayag nito ang apurahang utos sa natural na modernong Tagalog.
- source_word: πλατείας
  choice: malalapad na lansangan
  rationale: Pinananatili ang diwa ng malalawak at pampublikong lansangan at ang kaibahan sa mas makikipot na daan.
- source_word: ῥύμας
  choice: makikipot na daan
  rationale: Inilalarawan ang mas maliliit o makikipot na daan sa lungsod, bilang kaibahan sa πλατείας.
- source_word: πτωχούς
  choice: mga dukha
  rationale: Ang “mga dukha” ay dignified at madaling maunawaang tawag sa mga taong salat.
- source_word: ἀναπείρους
  choice: mga may kapansanan
  rationale: Malawak ang saklaw ng salita at maaaring tumukoy sa mga may kapansanan o may napinsalang bahagi ng katawan. Ang salin ay natural at magalang, habang inilalahad sa talababa ang mas tiyak na alternatibo.
- source_word: τυφλούς
  choice: mga bulag
  rationale: Tuwirang katumbas at karaniwang gamit sa Tagalog.
- source_word: χωλούς
  choice: mga pilay
  rationale: Tuwirang katumbas na tumutukoy sa mga nahihirapang lumakad.
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλος sa sambahayang tagpo ng talinghaga
  choice: lingkod
  alternative: alipin
  rationale: Nasa unahan ng salaysay ang tungkulin ng tauhan bilang tagapaghatid ng utos at ulat. Hindi itinatanggi ng “lingkod” ang posibleng katayuang alipin, ngunit iniiwasan nitong gawing sentro ang katayuang iyon kapag hindi iyon ang diin ng talata.
- issue: Pagpapakahulugan sa κύριος na tumutukoy sa isang tao
  choice: panginoon
  alternative: amo
  rationale: Pinananatili ng “panginoon” ang ugnayan ng nakatataas at lingkod, ngunit ginamitan ng maliit na titik sapagkat tao ang tuwirang tinutukoy sa talinghaga, hindi isang tahasang banal na titulo.
- issue: Saklaw ng ἀνάπηρος
  choice: mga may kapansanan
  alternative: mga pingkaw
  rationale: Hindi ganap na tiyak kung pangkalahatang kapansanan o partikular na pagkapinsala ng mga biyas ang binibigyang-diin. Pinili ang mas malawak na salin at pinanatili sa talababa ang mas tiyak na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “lansangan” at “daan” upang mapanatili ang kaibahan ng malawak at makipot na mga daan sa lungsod. Ang lahat ng talababa ay may katugmang marker sa pangunahing teksto.
