  to: Nang bumalik ang lingkod, iniulat niya sa kanyang panginoon[a] ang mga bagay na ito. Nagalit ang may-ari ng bahay at sinabi sa kanyang lingkod, ‘Lumabas ka agad sa malalapad na lansangan at makikipot na daan ng lungsod, at dalhin mo rito ang mga dukha, mga may kapansanan[b], mga bulag, at mga pilay.’
