  text: Καὶ ἐγένετο ἐν τῷ ἐλθεῖν αὐτὸν εἰς οἶκόν τινος τῶν ἀρχόντων τῶν Φαρισαίων σαββάτῳ φαγεῖν ἄρτον καὶ αὐτοὶ ἦσαν παρατηρούμενοι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/001.yaml
  text: And it happened that when he went into the house of one of the rulers of the Pharisees on the Sabbath to eat bread[b][a], they were watching him closely.
translation:
  language: tl
  text: Noong isang Sabbath, pumasok si Jesus sa bahay ng isa sa mga pinuno ng mga Pariseo upang kumain.[a] Mahigpit nila siyang binabantayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kumain ng tinapay”; idyoma ito para sa pagkain ng isang salu-salo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “maingat nilang minamasdan.” Maaaring magpahiwatig ang salitang Griyego ng mapaghinala o mapanuring pagbabantay.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Minsan
  rationale: Ang pormulang pasalaysay ni Lucas ay likas na ipinakilala sa modernong Tagalog sa pamamagitan ng “Minsan,” nang hindi ginagamit ang lipas at mabigat na “At nangyari.”
- source_word: ἐν τῷ ἐλθεῖν αὐτὸν
  choice: nang pumasok si Jesus
  rationale: Temporal ang articular infinitive; malinaw at natural ang “nang pumasok.” Isinama ang pangalang Jesus upang maging malinaw ang tinutukoy ng panghalip sa isang hiwalay na talata.
- source_word: εἰς οἶκόν
  choice: sa bahay
  rationale: Tuwirang katumbas ng οἶκος at angkop sa tagpuan ng salu-salo.
- source_word: τινος τῶν ἀρχόντων τῶν Φαρισαίων
  choice: ng isa sa mga pinuno ng mga Pariseo
  rationale: Pinananatili nito ang partitive construction at ang katayuan ng taong kabilang sa mga namumuno sa mga Pariseo.
- source_word: σαββάτῳ
  choice: sa araw ng Sabbath
  rationale: Ipinahahayag ang temporal na gamit ng datibo sa malinaw at karaniwang anyong Tagalog.
- source_word: φαγεῖν ἄρτον
  choice: upang kumain
  rationale: Idyoma ang literal na “kumain ng tinapay” para sa pagkain ng isang salu-salo; natural sa Tagalog ang “kumain” at hindi nito ipinapalagay na tinapay lamang ang inihain.
- source_word: αὐτοὶ ἦσαν παρατηρούμενοι αὐτόν
  choice: mahigpit nila siyang binabantayan
  rationale: Inililipat sa likas na ayos ng Tagalog ang patuloy at masusing pagmamasid, habang hindi tahasang ipinaparatang ang masamang layunin.
theological_decisions:
- issue: Ipinahihiwatig na pagkapoot sa pagmamasid ng mga Pariseo kay Jesus
  choice: mahigpit nila siyang binabantayan
  alternative: tinitiktikan nila siya
  rationale: Maaaring magpahiwatig ang παρατηρέω ng mapaghinala o masamang pagbabantay, ngunit hindi tahasang sinasabi rito ang motibo. Pinananatili ng napiling pananalita ang tensiyon nang hindi ito labis na binibigyang-kahulugan.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “Sabbath” bilang pamilyar na terminong biblikal at iniwasan ang lipas na pormulang “At nangyari.”
