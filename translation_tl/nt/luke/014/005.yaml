  text: ⸀καὶ πρὸς αὐτοὺς εἶπεν· Τίνος ὑμῶν υἱὸς ἢ βοῦς εἰς φρέαρ ⸀πεσεῖται, καὶ οὐκ εὐθέως ἀνασπάσει αὐτὸν ⸀ἐν ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/005.yaml
  text: And he said to them[a], “Which of you, if a son or an ox falls into a well, will not immediately pull him out on the Sabbath day?”
translation:
  language: tl
  text: At sinabi niya sa kanila[a], “Sino sa inyo ang, kapag nahulog sa balon ang anak na lalaki o baka niya, ay hindi ito agad aahonin sa araw ng Sabat?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “asno” sa halip na “anak na lalaki.”
    reason: textual_variant
lexical_decisions:
- source_word: Τίνος ὑμῶν
  choice: Sino sa inyo
  rationale: Likas na anyong Filipino para sa retorikal na tanong tungkol sa kung sino sa pangkat ang kikilos nang naiiba.
- source_word: υἱὸς
  choice: anak
  rationale: Bagaman tiyak na panlalaki ang Griyegong υἱός, mas natural sa modernong Filipino ang “anak”; sa karaniwang gamit, maaari itong tumukoy sa anak na lalaki nang hindi binabago ang kongkretong ugnayang pampamilya.
- source_word: βοῦς
  choice: baka
  rationale: Ang “baka” ang pinakakaraniwan at malinaw na katawagan sa Filipino para sa isang bovine; ang “kapong baka” ay maaaring maging labis na espesipiko sa kasarian o gamit ng hayop.
- source_word: φρέαρ
  choice: balon
  rationale: Direktang tumutugma sa karaniwang kahulugan ng φρέαρ at hindi ito inihaharmonisa sa mga kahawig na talatang gumagamit ng larawan ng hukay.
- source_word: πεσεῖται
  choice: kung mahulog
  rationale: Ang panghinaharap na anyo sa retorikal na kalagayan ay natural na naipapahayag sa Filipino sa kondisyunal na “kung mahulog.”
- source_word: εὐθέως
  choice: agad
  rationale: Pinananatili ang diwa ng agarang pagsagip sa maikli at likas na salitang Filipino.
- source_word: ἀνασπάσει
  choice: hahango
  rationale: Ang “hahango” ay natural na tumutukoy sa pag-ahon o paghila paitaas sa isang nahulog sa balon.
- source_word: αὐτὸν
  choice: ito
  rationale: Ang Filipino ay walang kasariang gramatikal sa panghalip; malinaw na tumutukoy ang “ito” sa alinman sa anak o baka at iniiwasan ang hindi likas na pag-uulit.
- source_word: ἐν ἡμέρᾳ τοῦ σαββάτου
  choice: sa araw ng Sabbath
  rationale: Pinananatili ang ἡμέρᾳ (“araw”) at ang pangalang Sabbath sa isang malinaw at marangal na anyong Filipino.
theological_decisions:
- issue: Pagkakaiba-iba ng teksto sa unang bagay o taong nahulog
  choice: anak o baka
  alternative: asno o baka
  rationale: Sinusunod ng pangunahing teksto ang ibinigay na SBLGNT na may υἱός (“anak”). Pinananatili sa talababa ang makabuluhang alternatibong pagbasa sa ilang manuskrito sa halip na ipasok ito sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “Sabbath” bilang pamilyar na terminong biblikal at ang “hahango” upang buhayin ang larawang paghila paitaas mula sa balon.
