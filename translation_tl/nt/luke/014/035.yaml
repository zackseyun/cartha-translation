  text: οὔτε εἰς γῆν οὔτε εἰς κοπρίαν εὔθετόν ἐστιν· ἔξω βάλλουσιν αὐτό. ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/035.yaml
  text: It is fit neither for the soil nor for the manure pile[a]; they throw it outside. The one who has ears to hear[b], let him hear.
translation:
  language: tl
  text: Hindi ito angkop, maging sa lupa o sa bunton ng pataba[a]; itinatapon nila ito sa labas. Ang may mga tainga upang makarinig[b] ay makinig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tambakan ng dumi.”
    reason: lexical_alternative
  - marker: b
    text: O “Sinumang may mga tainga upang makarinig ay makinig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν
  choice: lupa
  rationale: Sa kontekstong pansakahan, tumutukoy ito sa lupang maaaring paggamitan ng asin, hindi sa daigdig sa malawak na kahulugan.
- source_word: κοπρίαν
  choice: bunton ng pataba
  rationale: Pinananatili nito ang konkretong larawang pansakahan ng bunton ng dumi o pataba sa malinaw at kasalukuyang Tagalog.
- source_word: εὔθετόν
  choice: angkop
  rationale: Ipinahahayag nito ang pagiging nararapat o bagay sa isang gamit nang hindi nililimitahan ang diwa sa pakinabang lamang.
- source_word: ἔξω βάλλουσιν αὐτό
  choice: itinatapon nila ito sa labas
  rationale: Pinananatili ang aktibong pandiwang maramihan na may di-tiyak na gumagawa at ang konkretong kahulugan ng ἔξω.
- source_word: ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  choice: Ang may mga tainga upang makarinig ay makinig
  rationale: Malapit ito sa anyo at pag-uulit ng salitang-ugat sa Griyego, habang natural pa ring nauunawaan bilang pangkalahatang panawagan sa Tagalog.
theological_decisions:
- issue: Pangkalahatang saklaw ng isahang panawagan
  choice: Ang may mga tainga upang makarinig ay makinig
  alternative: Sinumang may mga tainga upang makarinig ay makinig
  rationale: Ang ὁ ἔχων ay nasa isahan ngunit kumakatawan sa sinumang tumutugon sa panawagan. Hindi kailangang ipilit sa Tagalog ang kasariang panlalaki sapagkat walang kasariang gramatikal ang katumbas na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang konkretong larawang pansakahan, ang aktibong di-tiyak na gumagawa sa “itinatapon nila,” at ang pormulang pangwakas nang hindi nagpapasok ng denominasyonal na pagpapakahulugan.
