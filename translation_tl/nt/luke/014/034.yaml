base_translation:
  language: en
  yaml_path: translation/nt/luke/014/034.yaml
  text: Salt[a], then, is good; but if even the salt becomes tasteless, with what will it be seasoned?
translation:
  language: tl
  text: Mabuti nga ang asin; ngunit kung maging ang asin ay mawalan ng lasa[a], ano ang ipampapalasa rito?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maging matabang.” Ang pandiwang Griyego ay literal na maaaring mangahulugang “maging hangal,” ngunit kapag asin ang paksa, tumutukoy ito sa pagkawala ng lasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλὸν
  choice: Mabuti
  rationale: Tuwirang ipinapahayag ang positibong pagtataya sa asin nang hindi nililimitahan ang diwa sa pagiging kapaki-pakinabang lamang.
- source_word: οὖν
  choice: nga
  rationale: Natural na pang-ugnay sa Filipino na nagpapahiwatig ng kongklusyon o pagbabalik sa naunang turo nang hindi nagiging labis na pormal.
- source_word: ἅλας
  choice: asin
  rationale: Pinananatili ang literal at kasabihang larawan ng asin.
- source_word: ἐὰν δὲ καὶ
  choice: ngunit kung ... maging
  rationale: 'Ipinapanatili ng “ngunit” ang pagsalungat ng δέ, at ng “maging” ang diin ng καί: kahit ang asin mismo ay maaaring mawalan ng katangiang inaasahan dito.'
- source_word: μωρανθῇ
  choice: mawalan ng lasa
  rationale: Sa konteksto ng asin, ang pandiwa ay tumutukoy sa pagiging matabang o walang lasa. Ang pariralang ito ang pinakanatural sa modernong Filipino, samantalang ipinapaliwanag sa talababa ang literal na ugnay nito sa pagiging hangal.
- source_word: ἐν τίνι
  choice: ano ang ipampalasa
  rationale: Natural na ipinahahayag sa Filipino ang tanong tungkol sa paraan o bagay na gagamitin upang timplahan ang asin.
- source_word: ἀρτυθήσεται
  choice: ipampalasa rito
  rationale: Pinananatili ang larawang pangkusina ng pagtitimpla o pagpapalasa at iniiwasan ang mas mapagpaliwanag na “maibabalik sa dati.”
theological_decisions:
- issue: Matalinghagang diwa ng kasabihan tungkol sa asin
  choice: Panatilihing literal ang kasabihan at huwag tahasang tukuyin sa talata ang mga alagad o ang kanilang katangian.
  alternative: Palawakin bilang “kung mawala sa mga alagad ang kanilang natatanging katangian.”
  rationale: Ang aplikasyon sa pagiging alagad ay nagmumula sa nakapaligid na konteksto. Ang pagpapanatili sa larawan ng asin ay hindi nagpapawi sa sadyang tensiyon at lawak ng talinghaga.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nga” bilang natural na pang-ugnay at ang “ano ang ipampalasa rito?” bilang madaling maunawaang retorikal na tanong.
