  source_fidelity: Ang “limang pares” ay wastong pagsasalin ng Ζεύγη ... πέντε, at naihahatid ng “ipagpaumanhin mo ako” ang idyomang ἔχε με παρῃτημένον. Gayunman, ang “pupuntahan ko sila” ay karaniwang nangangahulugang dadalawin o pupuntahan ang mga hayop, samantalang ang πορεύομαι δοκιμάσαι αὐτά ay nagsasaad na siya ay pupunta upang subukin ang mga ito. Mas tumpak na ipahayag nang tuwiran ang layuning ito. Ang “bakang pang-araro” ay nagpapalinaw sa agrikultural na diwa ng βοῶν nang hindi binabago ang kahulugan.
  naturalness: Natural at marangal ang pangkalahatang rehistro ng draft. Ang binagong “pupunta ako upang subukin ang mga ito” ay mas idiomatiko at mas malinaw kaysa sa panghalip na “sila” kasunod ng “pupuntahan.”
  terminology: Ang “pares ng bakang pang-araro” ay angkop para sa mga oxen na magkapares na ginagamit sa gawain. Ang “subukin” ay angkop para sa δοκιμάσαι, at ang “ipagpaumanhin mo ako” ay natural na katumbas ng magalang na paghingi na ituring siyang hindi makadadalo.
