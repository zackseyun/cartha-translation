  text: καὶ ἕτερος εἶπεν· Ζεύγη βοῶν ἠγόρασα πέντε καὶ πορεύομαι δοκιμάσαι αὐτά· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/019.yaml
  text: And another said[a], ‘I have bought five yoke of oxen, and I am going to test them. I ask you[b], consider me excused.’
translation:
  language: tl
  text: At sinabi ng isa pa, “Bumili ako ng limang pares ng bakang pang-araro, at pupunta ako upang subukin ang mga ito. Nakikiusap ako sa iyo, ipagpaumanhin mo ako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: isa pa
  rationale: Sa sunod-sunod na mga inanyayahang nagdadahilan, natural na tumutukoy ito sa isa pang tao.
- source_word: Ζεύγη βοῶν ... πέντε
  choice: limang pares ng mga baka
  rationale: Ang ζεῦγος ay isang pares ng mga hayop na magkasamang ginagamit sa gawain; malinaw at natural sa modernong Filipino ang “limang pares ng mga baka.”
- source_word: ἠγόρασα
  choice: Bumili ako
  rationale: Ang aorist ay tuwirang naihahayag sa karaniwang nagdaang panahunan sa Filipino, at nananatiling malinaw ang kaugnayan ng pagbili sa kasalukuyang dahilan.
- source_word: πορεύομαι
  choice: pupuntahan ko sila
  rationale: Sa konteksto, ipinahahayag ng pandiwa ang agarang balak na pumunta sa kinaroroonan ng mga baka; natural itong paraan ng pagsasabi sa Filipino.
- source_word: δοκιμάσαι
  choice: upang subukin
  rationale: Tumutukoy ito sa pagsubok sa mga bagong biling baka upang matiyak ang kakayahan ng mga ito; dignified at madaling maunawaan ang “subukin.”
- source_word: ἐρωτῶ σε
  choice: Nakikiusap ako sa iyo
  rationale: Dito ang ἐρωτάω ay isang magalang na pakiusap, hindi lamang pagtatanong; sapat ang diin ng “nakikiusap” nang hindi ginagawang labis na pagsusumamo.
- source_word: ἔχε με παρῃτημένον
  choice: ipagpaumanhin mo ako
  rationale: Natural na katumbas sa Filipino ng idyomang humihiling na ituring siyang hindi makadadalo o mapagbigyan sa kaniyang dahilan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “mga baka” sa pangkalahatang diwa ng βοῶν; ang bilang na limang pares ay nagpapanatili sa konkretong larawang pang-agrikultura. Walang teolohikal na tensiyon o tunay na kalabuan na nangangailangan ng talababa sa talatang ito.
