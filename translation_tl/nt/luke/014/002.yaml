  yaml_path: translation/nt/luke/014/002.yaml
  text: And behold[a], a certain man with dropsy was before him.
translation:
  language: tl
  text: At narito, nasa harap niya ang isang lalaking may pamamanas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego ay tumutukoy sa isang taong namamaga dahil sa abnormal na pag-ipon ng likido sa katawan, isang kondisyong tinatawag ding edema.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na ugnayang pasalaysay nang hindi nagdaragdag ng tiyak na diwang pangpanahon.
- source_word: ἰδοὺ
  choice: narito
  rationale: Likas at marangal na panawag-pansin sa modernong Tagalog na nagpapanatili sa kasiglahan ng salaysay.
- source_word: ἄνθρωπός τις
  choice: isang lalaki
  rationale: Tumutukoy sa isang partikular ngunit hindi pinangalanang tao; sapat nang ipinahihiwatig ng “isang” ang pagiging di-tiyak.
- source_word: ἦν
  choice: nasa
  rationale: Likas na inilalarawan sa Tagalog ang kalagayan at kinalalagyan ng lalaki sa harap ni Jesus.
- source_word: ὑδρωπικὸς
  choice: may pamamanas
  rationale: Ang “pamamanas” ay karaniwang nauunawaang salitang Filipino para sa abnormal na pamamaga dahil sa pag-ipon ng likido, at mas natural kaysa sa teknikal na “edema” o lumang katawagang “dropsy.”
- source_word: ἔμπροσθεν αὐτοῦ
  choice: nasa harap niya
  rationale: Pinananatili ang pangunahing diwang panlunan habang maaari ring ipahiwatig na ang lalaki ay nasa presensiya niya.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “narito” upang mapanatili ang panawag-pansin ng ἰδοὺ, at “pamamanas” bilang madaling maunawaang katawagan sa kondisyong medikal.
