source:
  edition: SBLGNT
  text: Εἴ τις ἔρχεται πρός με καὶ οὐ μισεῖ τὸν πατέρα ⸀ἑαυτοῦ καὶ τὴν μητέρα καὶ τὴν γυναῖκα καὶ τὰ τέκνα καὶ τοὺς ἀδελφοὺς καὶ τὰς ἀδελφάς, ἔτι ⸀τε καὶ τὴν ⸂ψυχὴν ἑαυτοῦ⸃, οὐ δύναται ⸂εἶναί μου μαθητής⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/026.yaml
  text: If anyone comes to me and does not hate his own father and mother and wife and children and brothers and sisters—and even his own life—he cannot be my disciple[a][b].
translation:
  language: tl
  text: Kung sinuman ang lumalapit sa akin at hindi napopoot[a] sa sarili niyang ama at ina, asawa, mga anak, mga kapatid na lalaki at babae—at maging ang sarili niyang buhay[b]—hindi siya maaaring maging alagad ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi inuuna sa pag-ibig kaysa sa akin.” Literal na “napopoot” ang pandiwa, ngunit sa kontekstong ito ay ipinahihiwatig nito na dapat manaig ang katapatan kay Jesus kaysa kahit sa pinakamalalapit na ugnayang pampamilya; ihambing ang Mateo 10:37.
    reason: lexical_alternative
  - marker: b
    text: O “sarili niyang kaluluwa.” Dito, malamang na tumutukoy ang ψυχή sa sariling buhay sa konteksto ng halaga ng pagiging alagad.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισεῖ
  choice: napopoot
  rationale: Pinananatili ang tuwiran at matinding kahulugan ng pandiwang Griyego. Hindi ito pinalitan sa pangunahing teksto ng “hindi minamahal nang higit” o “mas kaunti ang pagmamahal” upang hindi pahinain o agad ipaliwanag ang matalas na pananalita ni Jesus; nililinaw sa talababa ang paghahambing ng katapatan.
- source_word: ἔρχεται πρός με
  choice: lumalapit sa akin
  rationale: Likas na salin sa Filipino ng paglapit kay Jesus, nang hindi ipinapasok ang ibang pariralang “sumusunod sa akin” na hindi tahasang ginamit dito.
- source_word: πατέρα ἑαυτοῦ
  choice: sarili niyang ama
  rationale: Ipinahahayag ang diin ng reflexive na ἑαυτοῦ at ang personal na saklaw ng hinihingi.
- source_word: γυναῖκα
  choice: asawa
  rationale: Sa talaan ng pinakamalalapit na ugnayang pampamilya, “asawa” ang likas na kahulugan ng γυνή.
- source_word: ἀδελφοὺς καὶ ἀδελφάς
  choice: mga kapatid na lalaki at babae
  rationale: Tahasan sa Griyego ang kapwa mga kapatid na lalaki at mga kapatid na babae, kaya kapwa pinanatili sa salin.
- source_word: ἔτι τε καὶ
  choice: at maging
  rationale: Ipinakikita nito ang papataas na diin sa huling bahagi ng talaan sa natural at marangal na Filipino.
- source_word: ψυχὴν ἑαυτοῦ
  choice: sarili niyang buhay
  rationale: Sa konteksto ng halaga ng pagiging alagad, ang ψυχή ay tumutukoy sa sariling buhay o sarili, hindi lamang sa “kaluluwa” sa makitid na diwa.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: hindi siya maaaring maging alagad ko
  rationale: Pinananatili ang puwersa ng kawalan ng kakayahan o pagiging hindi magkatugma sa hinihingi, hindi lamang isang pagbabawal.
theological_decisions:
- issue: Kung palalambutin sa pangunahing teksto ang μισεῖ bilang paghahambing ng pag-ibig
  choice: Panatilihin ang “napopoot” sa pangunahing teksto at ipaliwanag sa talababa ang posibleng diwang “hindi minamahal nang higit.”
  alternative: Isalin sa pangunahing teksto bilang “hindi minamahal nang mas kaunti kaysa sa akin” o “hindi iniibig nang mas kaunti.”
  rationale: Sadyang matalas ang salitang ginamit at nararapat mapanatili ang tensiyon ng sinabi ni Jesus. Ipinakikita ng konteksto at ng Mateo 10:37 na ang hinihingi ay ang pangingibabaw ng katapatan kay Jesus, ngunit mas interpretatibo kung iyon lamang ang ilalagay sa pangunahing teksto.
- issue: Kahulugan ng ψυχή sa talatang ito
  choice: Isalin bilang “buhay.”
  alternative: “kaluluwa” o “sarili”
  rationale: Ang konteksto ay ang halaga ng pagiging alagad at ang pagsuko maging ng pag-angkin sa sariling buhay. Iniiwasan ng “buhay” ang pagpasok ng mas makitid na doktrina tungkol sa kaluluwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matalim na pananalita ng orihinal habang inilagay sa mga talababa ang mahahalagang alternatibong kahulugan. Ginamit ang “lumalapit” at “alagad” bilang natural ngunit malapit-sa-anyong mga katumbas.
