  text: And they were continually in the temple[a], blessing God.
translation:
  language: tl
  text: At palagi silang nasa templo at pinupuri ang Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinagpapala ang Diyos.” Ang pandiwang Griyego ay literal na “pinagpapala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay sa naunang salaysay.
- source_word: ἦσαν διὰ παντός
  choice: lagi silang nasa
  rationale: Likas na ipinahahayag sa modernong Tagalog ang nagpapatuloy at palagiang kalagayan; ang aspektong imperpektibo ng ἦσαν ay sinusuportahan ng διὰ παντός.
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Ang ἱερόν ay tumutukoy sa kabuuang kompleks ng templo, hindi lamang sa panloob na santuwaryo; sapat at natural ang “templo” sa konteksto.
- source_word: εὐλογοῦντες
  choice: pinagpapala
  rationale: Pinananatili ang pangunahing leksikal na diwa ng εὐλογέω na “pagpalain” o magsalita ng mabuti tungkol sa isang tao. Kapag Diyos ang layon, maaari rin itong idiomatikong unawain bilang pagpupuri.
- source_word: τὸν θεόν
  choice: ang Diyos
  rationale: Tuwirang layon ng εὐλογοῦντες; karaniwang salin ang “ang Diyos.”
theological_decisions:
- issue: Wikang ginagamit sa pagsamba sa pariralang εὐλογοῦντες τὸν θεόν
  choice: pinagpapala ang Diyos
  alternative: pinupuri ang Diyos
  rationale: Ang pandiwa sa Griyego ay εὐλογέω, hindi αἰνέω. Pinananatili ng “pinagpapala” ang partikular na larawan ng orihinal nang hindi itinatanggi na sa ganitong konteksto maaari itong mangahulugang pagpupuri sa Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, natural, at marangal. Ginamit ang “lagi” para sa διὰ παντός at “templo” bilang karaniwang katawagan sa kabuuang kompleks. Inilagay ang talababa pagkatapos ng buong sugnay upang linawin na ang alternatibo ay tumutukoy sa “pinagpapala ang Diyos.”
