  naturalness: Likas ang pangungusap sa modernong Filipino. Mas tuwiran at natural ang “Sa unang araw ng linggo” kaysa “Ngunit nang unang araw ng sanlinggo.” Ang “mga pabango” ay maaaring mangahulugang perfume; mas tiyak sa kontekstong paglilibing ang “mga sangkap na pampabango.”
  terminology: Ang “libingan” ay angkop para sa μνῆμα. Pinananatili ang “Sabbath” sa talababa bilang terminong historikal, at ang literal na alternatibo ay mas maingat na isinasalin bilang “sa una ng mga Sabbath.”
