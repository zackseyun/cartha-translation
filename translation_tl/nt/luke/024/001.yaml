  text: τῇ δὲ μιᾷ τῶν σαββάτων ὄρθρου βαθέως ⸂ἐπὶ τὸ μνῆμα ἦλθον⸃ φέρουσαι ἃ ἡτοίμασαν ⸀ἀρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/001.yaml
  text: But on the first day of the week[a], at early dawn, they came to the tomb, bringing the spices they had prepared.
translation:
  language: tl
  text: Ngunit, sa unang araw ng linggo[a], sa madaling-araw, pumunta sila sa libingan, dala ang mga sangkap na pampabango na inihanda nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “sa una ng mga Sabbath,” isang idyomang nangangahulugang unang araw ng linggo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ μιᾷ τῶν σαββάτων
  choice: Ngunit nang unang araw ng sanlinggo
  rationale: Karaniwang idyomang Semitiko/Koine ito para sa unang araw ng sanlinggo. Inihahatid ng saling ito ang likas na kahulugang panahunan nang hindi lumilikha ng di-kinakailangang kalituhan tungkol sa mga Sabbath.
- source_word: ὄρθρου βαθέως
  choice: sa pagbubukang-liwayway
  rationale: Tumutukoy ang parirala sa napakaagang bahagi ng bukang-liwayway. Ang 'sa pagbubukang-liwayway' ay natural at marangal sa Tagalog at malinaw na nagpapahiwatig ng madaling-araw.
- source_word: ἐπὶ τὸ μνῆμα
  choice: sa libingan
  rationale: Kasama ng pandiwa ng paggalaw, ipinahihiwatig ng ἐπί ang pagtungo sa lugar. Ang 'libingan' ang karaniwang salitang Tagalog para sa puntod o libingang kinaroroonan ng bangkay.
- source_word: ἦλθον
  choice: pumunta sila
  rationale: Sa Tagalog, mas natural ang 'pumunta' sa salaysay ng pagkilos patungo sa libingan kaysa sa deiktikong 'dumating,' habang nananatili ang simpleng ulat ng kanilang pagtungo roon.
- source_word: φέρουσαι
  choice: dala
  rationale: Ipinakikita ng kasabay na participle na taglay nila ang mga pabango habang pumupunta. Maikli at likas sa Tagalog ang 'dala.'
- source_word: ἃ ἡτοίμασαν ἀρώματα
  choice: ang mga pabangong inihanda nila
  rationale: Ang ἀρώματα ay mababangong sangkap na ginagamit sa paghahanda sa paglilibing. Ang 'mga pabango' ay madaling maunawaan sa konteksto, at likas ang ayos na pangngalan bago ang sugnay na panuring.
theological_decisions:
- issue: Ang idyomang panahunan na τῇ μιᾷ τῶν σαββάτων sa salaysay ng muling pagkabuhay
  choice: nang unang araw ng sanlinggo
  alternative: nang una sa mga Sabbath
  rationale: Isinalin ayon sa karaniwang idyomatikong kahulugan ng Griyego, hindi sa sobrang literal na anyong maaaring magpahiwatig ng kalendaryong o sektaryong pagpapakahulugan na hindi hinihingi ng teksto. Nananatili sa talababa ang literal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'sanlinggo' para sa tiyak at likas na pagtukoy sa pitong-araw na linggo, at iniwasan ang labis na literal na pariralang magiging malabo sa karaniwang mambabasa.
