base_translation:
  language: en
  yaml_path: translation/nt/luke/024/035.yaml
  text: And they themselves were recounting the things that had happened on the road[b][a], and how he was made known to them in the breaking of the bread.
translation:
  language: tl
  text: At sila mismo ay nagkukuwento tungkol sa mga nangyari sa daan at kung paano siya nakilala nila[a] sa paghahati-hati ng tinapay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “ipinakilala siya sa kanila.” Pasibo ang pandiwa sa Griyego at maaaring idiin alinman ang pagkilala nila sa kanya o ang pagkakilala sa kanya na ipinahayag sa kanila.
    reason: alternative_reading
  - marker: b
    text: O kaya, “sa pagpira-piraso ng tinapay.” Maaaring basahin ang pariralang Griyego nang mas pangkalahatan, ngunit tumutukoy ito sa partikular na pagkain sa tagpong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: sila mismo
  rationale: Pinananatili ang diin ng hayag na panghalip at itinatangi ang dalawang alagad bilang sila naman ang nag-uulat.
- source_word: ἐξηγοῦντο
  choice: nagsasalaysay
  rationale: Likas na ipinahihiwatig sa Filipino ang patuloy na pagkukuwento sa konteksto; ang pandiwa ay tumutukoy sa paglalahad ng mga pangyayari.
- source_word: τὰ ἐν τῇ ὁδῷ
  choice: ang mga nangyari sa daan
  rationale: Elliptical ang Griyego; nililinaw ng “mga nangyari” ang ipinahihiwatig nito sa natural na Filipino nang walang idinaragdag na interpretasyon.
- source_word: ὡς
  choice: kung paano
  rationale: Ipinakikilala nito ang paraan o kalagayan ng pagkakilala kay Jesus.
- source_word: ἐγνώσθη αὐτοῖς
  choice: siya nakilala nila
  rationale: Ang “nakilala nila” ay natural na Filipino at maaari pa ring magpahiwatig na naging malinaw sa kanila kung sino siya; inilalagay sa talababa ang mas tahasang pasibong alternatibo.
- source_word: ἐν τῇ κλάσει τοῦ ἄρτου
  choice: nang pagpira-pirasuhin ang tinapay
  rationale: Natural na inilalarawan ang partikular na kilos sa pagkain na kababanggit lamang, habang hindi tinutukoy kung sino ang gumawa nito.
theological_decisions:
- issue: Kung ang ἐγνώσθη ay dapat magdiin sa pagkilala ng mga alagad o sa pagpapakilala sa kanila
  choice: nakilala nila
  alternative: ipinakilala siya sa kanila / naging kilala siya sa kanila
  rationale: Mas natural ang pangunahing salin sa Filipino, ngunit hindi dapat mawala ang pasibong anyo at posibleng pahiwatig ng pagkilos na hindi lamang nagmula sa mga alagad; kaya tahasang itinatala ang alternatibo.
- issue: Kung ang κλάσις τοῦ ἄρτου ay teknikal na ritwal o karaniwang kilos sa pagkain
  choice: pagpira-pirasuhin ang tinapay
  alternative: pagpira-piraso ng tinapay
  rationale: Pinananatili itong konkretong kilos sa tagpo at hindi nilalagyan ng denominasyonal o sakramental na katawagang wala sa mismong talata.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “daan,” “nagsasalaysay,” at “pagpira-pirasuhin” bilang karaniwang mauunawaang pananalita; iniwasan ang teknikal na panrelihiyong katawagan.
