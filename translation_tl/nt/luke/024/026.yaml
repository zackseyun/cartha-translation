  yaml_path: translation/nt/luke/024/026.yaml
  text: Was it not necessary for the Messiah to suffer these things and to enter into his glory?[a]
translation:
  language: tl
  text: Hindi ba kailangang danasin ng Mesiyas ang mga bagay na ito at pumasok sa kanyang kaluwalhatian?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Cristo.” Ang titulong Griyego na Χριστός ay isinaling “Mesiyas” dito upang mapanatili ang kahulugan nito sa konteksto ng katuparan ng Kasulatan.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχὶ
  choice: Hindi ba
  rationale: Naghuhudyat ito ng tanong na umaasang sang-ayon ang sagot; natural itong ipinapahayag sa Tagalog bilang “Hindi ba.”
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili nito ang puwersa ng panghalip na pamatlig at tumutukoy sa mga pagdurusang katatalakay lamang.
- source_word: ἔδει
  choice: kailangang
  rationale: Ipinahahayag ng δεῖ ang pangangailangan na kaugnay ng layunin ng Diyos at katuparan ng Kasulatan, nang hindi ito labis na ipinapaliwanag sa pangunahing teksto.
- source_word: παθεῖν
  choice: pagdusahan
  rationale: Natural sa Tagalog ang “pagdusahan ang mga bagay na ito” at malinaw na ipinahahayag ang pagdanas ng mga pagdurusang tinutukoy.
- source_word: τὸν χριστὸν
  choice: ang Mesiyas
  rationale: Ang Χριστός ay titulo rito; ang “Mesiyas” ay nagpapanatili sa kahulugang kaugnay ng katuparan ng Kasulatan.
- source_word: καὶ
  choice: at
  rationale: Pinananatili ang payak na pag-uugnay ng dalawang pawatas nang hindi nagdaragdag ng tahasang pagkakasunod-sunod.
- source_word: εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ
  choice: pumasok sa kanyang kaluwalhatian
  rationale: Pinananatili nito ang larawan ng pagpasok at ang panghalip na tumutukoy sa kaluwalhatiang kanya.
- source_word: δόξαν
  choice: kaluwalhatian
  rationale: Ito ang karaniwan at angkop na salin ng δόξα sa konteksto ng muling pagkabuhay at pagdakila.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Tuwirang pinananatili ang panghalip na paari nang hindi dinaragdagan ng interpretasyon.
theological_decisions:
- issue: Pagsasalin ng Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Ginagamit ang salita bilang titulo, hindi lamang bilang pangalang pantangi; ipinakikita ng “Mesiyas” ang papel nito sa konteksto ng katuparan ng Kasulatan.
- issue: Puwersa ng ἔδει
  choice: kailangang
  alternative: dapat lamang / nakatakdang
  rationale: Pinananatili ng “kailangang” ang diwa ng banal at maka-Kasulatang pangangailangan nang hindi nilulutas sa salin kung paano eksaktong nauugnay ang pangangailangang iyon sa pasiya at plano ng Diyos.
- issue: Kaugnayan ng pagdurusa at kaluwalhatian
  choice: at
  alternative: at pagkatapos ay
  rationale: Hindi idinagdag ang “pagkatapos” sapagkat payak na καὶ lamang ang nasa Griyego, kahit ipinahihiwatig ng konteksto ang pagkakasunod.
translation_notes:
  register: Makabagong, dignificado, at madaling maunawaang Filipino. Ginamit ang “pagdusahan” sa halip na mas mabigat na “magtiis ng pagdurusa,” at pinanatili ang retorikal na tanong at teolohikal na bigat ng pangangailangan.
