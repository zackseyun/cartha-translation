revisions:
- from: At masdan, nang araw ding iyon, dalawa sa kanila ang naglalakbay patungo sa isang nayon na animnapung estadio[a] ang layo mula sa Jerusalem. Emmaus ang pangalan ng nayon.
  to: At narito, noong araw ding iyon, dalawa sa kanila ang naglalakbay patungo sa isang nayon na animnapung estadio[a] ang layo mula sa Jerusalem, na ang pangalan ay Emmaus.
  rationale: Inayos ang panandang panahon para sa likas na modernong Filipino, pinalitan ang bahagyang pilit na “At masdan” ng natural ngunit marangal na “At narito,” at ibinalik ang pangalang Emmaus sa kaugnay nitong sugnay. Walang idinagdag na pagpapakahulugan o pagbabagong kahulugan.
