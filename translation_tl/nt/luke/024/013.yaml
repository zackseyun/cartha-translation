  text: Καὶ ἰδοὺ δύο ἐξ αὐτῶν ⸂ἐν αὐτῇ τῇ ἡμέρᾳ ἦσαν πορευόμενοι⸃ εἰς κώμην ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ, ᾗ ὄνομα Ἐμμαοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/013.yaml
  text: And behold[a], two of them were going that very day to a village sixty stadia from Jerusalem, whose name was Emmaus,
translation:
  language: tl
  text: At narito, noong araw ding iyon, dalawa sa kanila ang naglalakbay patungo sa isang nayon na animnapung estadio[a] ang layo mula sa Jerusalem, na ang pangalan ay Emmaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang estadio ay isang sinaunang yunit ng distansiya. Ang animnapung estadio ay humigit-kumulang 11 kilometro, o 7 milya.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: At masdan
  rationale: Pinananatili ang panandang pasalaysay na humihikayat sa mambabasa na bigyang-pansin ang susunod na pangyayari, nang hindi ito lubusang inaalis.
- source_word: δύο ἐξ αὐτῶν
  choice: dalawa sa kanila
  rationale: Likas na salin ng partitive na parirala at hindi labis na tinutukoy kung sino ang mas malaking pangkat.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: nang araw ding iyon
  rationale: Ipinahahayag ng “ding” ang diin ng Griyego na nangyari ito sa mismong araw na iyon.
- source_word: ἦσαν πορευόμενοι
  choice: ang naglalakbay
  rationale: Ipinahihiwatig ang nagpapatuloy na pagpunta sa nakaraang panahon; natural ito sa Filipino sa loob ng pariralang pasalaysay.
- source_word: εἰς κώμην
  choice: patungo sa isang nayon
  rationale: Ang “nayon” ay tumpak para sa κώμη, at malinaw na ipinahahayag ng “patungo sa” ang direksiyon ng paglalakbay.
- source_word: ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ
  choice: na animnapung estadio[a] ang layo mula sa Jerusalem
  rationale: Pinananatili sa pangunahing teksto ang sinaunang yunit ng distansiya at inilalagay sa talababa ang makabagong katumbas.
- source_word: ᾗ ὄνομα Ἐμμαοῦς
  choice: Emmaus ang pangalan ng nayon
  rationale: Malinaw at natural na Filipino na pinananatili ang tahasang pagbanggit sa pangalan, habang nililinaw na ang tinutukoy ay ang nayon.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang bahagyang pormal na “masdan” upang maihatid ang puwersa ng ἰδοὺ, at ginawang dalawang pangungusap ang hulihang sugnay para sa likas at malinaw na daloy.
