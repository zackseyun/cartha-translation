lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Tumutukoy ito sa sumunod na pangyayari sa salaysay; natural at malinaw ang “Pagkatapos” sa makabagong Tagalog.
- source_word: διήνοιξεν
  choice: binuksan
  rationale: Pinananatili nito ang kongkretong metapora ng pandiwa sa Griyego at hindi ito pinapaliit sa “tinulungan” o pinalalawak sa isang tiyak na doktrina.
- source_word: αὐτῶν τὸν νοῦν
  choice: ang kanilang mga isip
  rationale: Ang νοῦς ay tumutukoy sa kakayahang umunawa o makatalos. Natural sa Tagalog ang maramihang “mga isip” para sa pangkat ng mga tao, habang pinananatili ang larawan ng isang bagay na binubuksan.
- source_word: τοῦ συνιέναι
  choice: upang maunawaan nila
  rationale: Ang articular infinitive ay maaaring magpahiwatig ng layunin o bunga. Ang “upang maunawaan nila” ay malinaw at natural, ngunit hindi lubusang isinasara ang ugnayang iyon.
- source_word: τὰς γραφάς
  choice: ang mga Kasulatan
  rationale: Sa konteksto ng Lucas–Mga Gawa, tumutukoy ito sa kinikilalang mga banal na kasulatan ng Israel; ipinahihiwatig ng malaking titik ang natatanging reperente.
theological_decisions:
- issue: Ang kalikasan ng ginawa ni Jesus sa pagbubukas ng pag-unawa
  choice: Panatilihin ang tuwirang metaporang “binuksan niya ang kanilang mga isip.”
  alternative: “Binigyan niya sila ng kakayahang umunawa” o “ipinaliwanag niya sa kanila ang mga Kasulatan.”
  rationale: Tuwirang sinasabi ng Griyego na binuksan niya ang kanilang νοῦς para maunawaan ang mga Kasulatan. Pinananatili nito ang pahayag nang hindi dinaragdagan ng isang sistematikong paliwanag o ginagawang pagpapaliwanag lamang.
- issue: Layunin o bunga ng τοῦ συνιέναι
  choice: “upang maunawaan nila”
  alternative: “kaya naunawaan nila” o “para sa pag-unawa sa”
  rationale: Maaaring magpahiwatig ng layunin o bunga ang anyong Griyego. Ginagamit ang natural na pahayag ng layunin sa Tagalog, habang itinatala sa talababa ang posibleng mas malapit na impersonal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang metapora ng “pagbubukas” at ang teknikal ngunit karaniwang katawagang “mga Kasulatan.” Inayos ang mga pananda ng talababa sa sunod na [a][b].
