source:
  edition: SBLGNT
  text: καὶ μὴ εὑροῦσαι τὸ σῶμα αὐτοῦ ἦλθον λέγουσαι καὶ ὀπτασίαν ἀγγέλων ἑωρακέναι, οἳ λέγουσιν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/023.yaml
  text: and not finding his body[a], they came saying that they had also seen a vision of angels[b], who say that he is alive.
translation:
  language: tl
  text: at nang hindi nila matagpuan ang kanyang katawan[a], dumating sila at nagsabing nakakita rin sila ng isang pangitain ng mga anghel[b], na nagsasabing buhay siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, bagaman di-gaanong malamang: “dumating sila at nagsabing nakakita sila ng isang pangitain ng mga anghel at sinasabi nilang buhay siya,” kung ang “na nagsasabing” ay tumutukoy sa mga babae sa halip na sa mga anghel.'
    reason: alternative_reading
  - marker: b
    text: O “nakakita pa nga sila.”
    reason: alternative_rendering
lexical_decisions:
- source_word: μὴ εὑροῦσαι
  choice: nang hindi nila matagpuan
  rationale: Ang aorist participle na tumutukoy sa mga babae ay likas na ipinahayag bilang pangyayaring nauna sa kanilang pagbabalik; tuwirang pinanatili ang negasyon.
- source_word: τὸ σῶμα αὐτοῦ
  choice: ang kanyang katawan
  rationale: Karaniwan at tuwirang kahulugan ng σῶμα sa konteksto ng libing at muling pagkabuhay.
- source_word: ἦλθον λέγουσαι
  choice: bumalik sila at sinabing
  rationale: Bagaman literal na 'dumating sila,' malinaw sa konteksto na nagbalik sila mula sa libingan. Ang participle na λέγουσαι ay likas na naipahayag sa Filipino sa pamamagitan ng 'at sinabing.'
- source_word: καὶ ὀπτασίαν
  choice: rin ... isang pangitain
  rationale: Ipinakikita ng καί na bukod sa hindi pagkakita sa katawan ay iniulat din nila ang pangitain; natural dito ang 'rin.'
- source_word: ὀπτασίαν ἀγγέλων
  choice: isang pangitain ng mga anghel
  rationale: Pinananatili ng 'pangitain' ang di-pangkaraniwang karanasan nang hindi dinaragdagan ang kahulugan; maaaring tumukoy ang genitive sa mga anghel na nakita sa pangitain.
- source_word: ἑωρακέναι
  choice: nakakita sila
  rationale: Ang perfect infinitive sa di-tuwirang pagsasalaysay ay natural na isinalin bilang naganap nang pagkakita.
- source_word: οἳ λέγουσιν
  choice: na nagsasabing
  rationale: Ang panlalaking maramihang relative pronoun ay pinakamalapit at pinakanatural na tumutukoy sa mga anghel; pinananatili ng anyong 'nagsasabing' ang present tense nang natural sa Filipino.
- source_word: αὐτὸν ζῆν
  choice: buhay siya
  rationale: Natural na Filipino para sa infinitival clause at malinaw na ipinahahayag ang kalagayang buhay, nang hindi nagpapalawak sa pahayag.
theological_decisions:
- issue: Tinutukoy ng οἳ λέγουσιν
  choice: Ang 'na nagsasabing' ay tumutukoy sa mga anghel.
  alternative: 'Maaaring iugnay ang sugnay sa mga babae: sila ang nagsasabing buhay siya.'
  rationale: Ang pinakamalapit at pinakaangkop na antecedent sa balarila ay ἀγγέλων ('mga anghel'). Gayunman, itinatala sa talababa ang di-gaanong malamang na alternatibong pagkakaugnay upang hindi ikubli ang sintaktikong posibilidad.
- issue: Lakas ng ikalawang καί
  choice: rin
  alternative: maging / pati
  rationale: Ang 'rin' ay natural na nagdaragdag sa ikalawang bahagi ng ulat. Ang mas mariing 'maging' ay posible ngunit maaaring magbigay ng diin na higit sa kinakailangan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang 'bumalik' ayon sa konteksto ng pag-uwi mula sa libingan, bagaman ang payak na kahulugan ng ἦλθον ay 'dumating.' Ang 'pangitain' ay pamilyar na salitang biblikal ngunit nananatiling nauunawaan sa kasalukuyang gamit.
