source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν λαβὼν τὸν ἄρτον εὐλόγησεν καὶ κλάσας ἐπεδίδου αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/030.yaml
  text: And it happened that[a], when he reclined at the table with them, he took the bread, blessed it, and after breaking it[b], began giving it to them.
translation:
  language: tl
  text: At nang siya'y humilig sa hapag kasama nila,[a] kinuha niya ang tinapay, binasbasan ito, at pagkatapos niyang pagputul-putulin ito ay sinimulan niyang ibigay sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umupo sa hapag kasama nila.” Mas tiyak na tumutukoy ang Griyego sa paghilig sa hapag, ayon sa sinaunang kaugalian sa pagkain.
    reason: cultural_note
  - marker: b
    text: O “patuloy niyang ibinibigay sa kanila.” Maaaring idiin ng imperfect sa Griyego ang nagpapatuloy na kilos; ipinahihiwatig naman ng “sinimulan” ang pagsisimula ng pamamahagi sa tagpong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: At nang
  rationale: Ang ἐγένετο ay pormulang pasalaysay ni Lucas. Sa natural na modernong Tagalog, naihahatid ng “At nang” ang paglipat at temporal na balangkas nang hindi gumagamit ng lipas o mabigat na “at nangyari.”
- source_word: ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν
  choice: nang siya ay nakahilig sa hapag kasama nila
  rationale: Temporal ang articular infinitive na may ἐν. Sa konteksto ng pagkain, ang κατακλίνω ay tumutukoy sa paghilig sa hapag ayon sa sinaunang kaugalian, hindi lamang sa pag-upo.
- source_word: λαβὼν τὸν ἄρτον
  choice: kinuha niya ang tinapay
  rationale: Ginawang pandiwang may tiyak na panahunan ang participle upang maging natural sa Tagalog habang pinananatili ang pagkakasunod-sunod ng kilos.
- source_word: εὐλόγησεν
  choice: binasbasan iyon
  rationale: Ang εὐλογέω ay tumutukoy sa pagbigkas ng pagpapala sa tinapay. Pinananatili ng “binasbasan” ang lexical na kaibhan nito sa εὐχαριστέω, nang hindi nagdaragdag ng sakramental na paliwanag.
- source_word: κλάσας
  choice: matapos pagpira-pirasuhin
  rationale: Ipinahihiwatig ng aorist participle na nauna ang pagpira-piraso sa pamamahagi. Ang anyong ito ay natural sa Tagalog at malinaw ang pagkakasunod ng mga kilos.
- source_word: ἐπεδίδου
  choice: sinimulan niyang ibigay sa kanila
  rationale: Maaaring ipakita ng imperfect ang nagpapatuloy o nagsisimulang kilos. Pinipili rito ang inceptive na diwa, habang itinatala sa talababa ang posibleng “patuloy niyang ibinibigay.”
theological_decisions:
- issue: Posibleng eucharistiko o sakramental na pahiwatig ng mga kilos sa pagkain
  choice: Gumamit ng karaniwang wika para sa pagkain at panatilihin ang mismong pagkakasunod ng mga kilos
  alternative: Gumamit ng pananalitang mas tahasang mag-uugnay sa Hapunan ng Panginoon
  rationale: Maaaring umalingawngaw ang “kinuha—binasbasan—pinira-piraso—ibinigay” sa ibang tagpo ng pagkain, ngunit hindi tahasang tinatawag ng talata ang pangyayaring ito na isang sakramento. Kaya hindi dinaragdagan ng denominasyonal na pagpapakahulugan ang salin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang sinaunang detalye ng paghilig sa hapag, kalakip ang paliwanag sa talababa. Iniwasan ang arkaikong pormulang “at nangyari” at ang anumang tahasang sakramental na pagpapalawak.
