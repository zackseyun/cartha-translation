revisions:
- from: At nang siya ay nakahilig sa hapag kasama nila,[a] kinuha niya ang tinapay, binasbasan iyon, at matapos pagpira-pirasuhin ay sinimulan niyang ibigay sa kanila.[b]
  to: At nang siya'y humilig sa hapag kasama nila,[a] kinuha niya ang tinapay, binasbasan ito, at pagkatapos niyang pagputul-putulin ito ay sinimulan niyang ibigay sa kanila.[b]
  rationale: 'Pinalitan ang stative na «nakahilig» ng pandiwang «humilig» upang mas malinaw na maipakita ang temporal na kilos ng κατακλιθῆναι. Inayos din ang parirala para sa κλάσας upang maging malinaw ang pagkakasunod: kinuha, binasbasan, pinagputul-putol, saka sinimulang ibigay. Pinanatili ang «At nang» bilang natural na Tagalog na katumbas ng pangkasaysayang transisyon na καὶ ἐγένετο sa temporal na sugnay, at pinanatili ang maingat na inceptive na pagbasa sa imperfect.'
