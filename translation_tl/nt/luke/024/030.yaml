  naturalness: Marangal at karaniwang nauunawaan ang register. Gayunman, mas natural at mas malinaw ang tahasang pandiwang «humilig» kaysa «nakahilig» pagkatapos ng «nang». Ang «matapos pagpira-pirasuhin» ay mas magaan kung gagawing «pagkatapos niyang pagputul-putulin ito».
  terminology: Ang «tinapay» at «binasbasan ito» ay angkop at hindi nagdaragdag ng sakramental na interpretasyon. Ang «humilig sa hapag» ay nagpapanatili ng sinaunang gawi sa pagkain; nililinaw ito nang wasto ng talababa.
