  text: καὶ ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν ⸀διερμήνευσεν αὐτοῖς ἐν πάσαις ταῖς γραφαῖς τὰ περὶ ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/027.yaml
  text: And beginning with Moses and all the Prophets[b][a], he interpreted to them in all the Scriptures the things concerning himself.
translation:
  language: tl
  text: At simula kay Moises at sa lahat ng mga Propeta, ipinaliwanag niya sa kanila sa lahat ng Kasulatan ang mga bagay tungkol sa kanyang sarili.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “binigyang-kahulugan” o “ipinaliwanag nang masinsinan.” Maaaring tumukoy ang pandiwang Griyego sa detalyadong pagpapaliwanag.
    reason: lexical_alternative
  - marker: b
    text: Ang “Moises at lahat ng mga Propeta” ay tumutukoy sa mga kasulatang kaugnay ni Moises at sa mga aklat ng mga Propeta.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ Μωϋσέως
  choice: simula kay Moises
  rationale: Ipinahahayag nito ang panimulang punto ng pagpapaliwanag. Likas sa modernong Tagalog ang “simula kay Moises,” at sa konteksto ay tumutukoy ito sa mga kasulatang kaugnay ni Moises.
- source_word: πάντων τῶν προφητῶν
  choice: lahat ng mga Propeta
  rationale: Ginamit ang malaking titik upang ipahiwatig ang kinikilalang pangkat ng mga kasulatang tinatawag na “mga Propeta,” hindi lamang ang lahat ng indibidwal na propeta.
- source_word: διερμήνευσεν
  choice: ipinaliwanag
  rationale: Ang pandiwa ay maaaring tumukoy sa masusing pagpapaliwanag o pagbibigay-kahulugan. Ang “ipinaliwanag” ay malinaw at natural sa kasalukuyang Tagalog, habang pinananatili ng talababa ang alternatibong diin.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwirang katumbas ng di-tuwirang layon sa Griyego.
- source_word: ἐν πάσαις ταῖς γραφαῖς
  choice: mula sa lahat ng Kasulatan
  rationale: Sa kontekstong ito, ipinahihiwatig ng ἐν ang saklaw o pinagkunan ng pagpapaliwanag. Ang “mula sa lahat ng Kasulatan” ay natural sa Tagalog at hindi nag-aangking bawat indibidwal na talata ay tuwirang tungkol sa kanya.
- source_word: τὰ περὶ ἑαυτοῦ
  choice: ang mga bagay tungkol sa kanyang sarili
  rationale: Pinananatili nito ang malawak na saklaw ng Griyego nang hindi nililimitahan sa mga tuwirang hula, sagisag, o isang tiyak na uri ng tekstong mesiyaniko.
theological_decisions:
- issue: Saklaw ng pagpapaliwanag ni Jesus sa Kasulatan
  choice: Ipinahayag na ipinaliwanag ni Jesus mula sa kabuuang saklaw ng Kasulatan ang mga bagay tungkol sa kanyang sarili, nang hindi tinutukoy ang iisang uri ng ugnayang hermeneutiko.
  alternative: Limitahan ito sa mga tuwirang hulang mesiyaniko, o sabihing ang bawat indibidwal na talata ay tuwirang tumutukoy sa kanya.
  rationale: Malawak ang pananalita ng talata ngunit hindi nito nililinaw na mga tahasang hula lamang ang tinutukoy, ni hindi nito sinasabing ang bawat talata ay tuwirang tungkol kay Jesus. Pinananatili ng salin ang saklaw at tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinanatili ang “Kasulatan” at ang malaking titik sa “mga Propeta” upang malinaw ang tinutukoy na mga banal na kasulatan. Inilagay ang mga talababa sa hulihan ng pangungusap upang hindi maputol ang daloy, habang naroroon sa pangunahing teksto ang bawat marker.
