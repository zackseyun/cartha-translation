id: LUK.24.46
reference: Luke 24:46
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὅτι οὕτως ⸀γέγραπται παθεῖν τὸν χριστὸν καὶ ἀναστῆναι ἐκ νεκρῶν τῇ τρίτῃ ἡμέρᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/046.yaml
  text: And he said to them[a], “Thus it is written[b], that the Messiah would suffer and rise from the dead on the third day,”
translation:
  language: tl
  text: 'At sinabi niya sa kanila, “Ganito ang nasusulat: magdurusa ang Mesiyas[a] at babangon mula sa mga patay[b] sa ikatlong araw.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang Griyegong Χριστός ay isang titulong nangangahulugang “Pinahiran.”
    reason: alternative_reading
  - marker: b
    text: Mas literal, “mula sa gitna ng mga patay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: nasusulat
  rationale: Ang perpektong pasibo ay karaniwang pormulang tumutukoy sa Kasulatan at sa nananatiling bisa ng nakasulat; natural at pamilyar sa Filipino ang “nasusulat.”
- source_word: παθεῖν
  choice: magdurusa
  rationale: Ang infinitibo ay bahagi ng nilalaman ng nasusulat. Ipinapahayag ng panghinaharap na anyo ang diwa nito sa tuwirang pananalita nang hindi idinaragdag ang tahasang kahulugang “kailangang,” na wala sa sugnay.
- source_word: τὸν χριστόν
  choice: ang Mesiyas
  rationale: May pantukoy ang Χριστός at gumaganap dito bilang titulong tumutukoy sa pinahirang hari; pinananatili ng “Mesiyas” ang kontekstong Judio at pangkasulatan.
- source_word: ἀναστῆναι
  choice: babangon
  rationale: Aktibo at katawanin ang anyo ng pandiwa. Ang “babangon” ay nagpapanatili sa aktibong pagpapahayag sa halip na gawin itong pasibong “muling bubuhayin.”
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Ito ang malinaw at natural na ekspresyon sa Filipino para sa pagkabuhay mula sa kamatayan, habang nananatiling malapit sa Griyegong maramihan.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: sa ikatlong araw
  rationale: Temporal ang datibo, at “sa ikatlong araw” ang natural na katumbas nito sa Filipino.
- source_word: οὕτως
  choice: Ganito
  rationale: Tumutukoy ito sa paraan o nilalaman ng nakasulat at maayos na nagpapakilala sa kasunod na pahayag.
- source_word: ὅτι
  choice: ':'
  rationale: Ipinakikilala ng ὅτι ang nilalaman ng nasusulat. Sa Filipino, malinaw at natural itong katawanin sa pamamagitan ng tutuldok bago ang tuwirang nilalaman.
theological_decisions:
- issue: Pagbibigay-kahulugan sa Χριστός sa buod ng pagdurusa at pagkabuhay
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Titular ang gamit dahil may pantukoy at nakaugat ang pahayag sa katuparan ng Kasulatan. Hindi nito ginagawang personal na pangalan ang titulo.
- issue: Tinig ng pandiwang ἀναστῆναι
  choice: babangon mula sa mga patay
  alternative: muling bubuhayin mula sa mga patay
  rationale: Aktibo ang anyong Griyego, kaya pinananatili ng pangunahing teksto ang aktibong pagkakalahad. Hindi nito itinatanggi na sa ibang talata ay sinasabing binuhay siya ng Diyos; sinusunod lamang nito ang tinig ng pandiwa rito.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “nasusulat” bilang pamilyar na pormulang pangkasulatan, “Mesiyas” bilang malinaw na titulo, at “babangon” upang mapanatili ang aktibong tinig ng Griyego.
