  source_fidelity: Tapat ang salin sa Griyego. Naipapahayag ng “Ganito ang nasusulat” ang οὕτως γέγραπται bilang pormulang pangkasulatan; ang “magdurusa” at “babangon” ay wastong kumakatawan sa dalawang aktibong infinitibo, χωρίς pagdaragdag ng modal na “kailangang.” Ang “mula sa mga patay” at “sa ikatlong araw” ay wasto para sa ἐκ νεκρῶν at τῇ τρίτῃ ἡμέρᾳ.
  naturalness: Natural, malinaw, at may angkop na marangal na rehistro ang modernong Filipino. Ang tutuldok pagkatapos ng “nasusulat” ay isang maayos na paraan upang ipakilala ang nilalaman ng pahayag, kahit na ang Griyego ay may ὅτι.
  terminology: Ang “Mesiyas” ay angkop na salin ng titular na τὸν χριστόν at tumutugma sa audit trail. Ang talababa na “Cristo” ay lehitimong alternatibo; ang paliwanag na ang Χριστός ay titulong nangangahulugang “Pinahiran” ay tama at hindi nagdaragdag ng doktrinal na pagpapakahulugan.
