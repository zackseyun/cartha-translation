  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἴδετε τὰς χεῖράς μου καὶ τοὺς πόδας μου ὅτι ⸂ἐγώ εἰμι αὐτός⸃· ψηλαφήσατέ με καὶ ἴδετε, ὅτι πνεῦμα σάρκα καὶ ὀστέα οὐκ ἔχει καθὼς ἐμὲ θεωρεῖτε ἔχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/039.yaml
  text: Look at my hands and my feet[a], that it is I myself. Touch me and see[d][c][b], because a spirit does not have flesh and bones as you see that I have.
translation:
  language: tl
  text: 'Tingnan ninyo ang aking mga kamay at mga paa: ako nga ito.[a] Hipuin ninyo ako at tingnan, sapagkat ang isang espiritu[b] ay walang laman at mga buto, gaya ng nakikita ninyong taglay ko.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “ako mismo ito.” Mariin sa Griyego ang personal na pagkakakilanlan: “ako nga ito.”'
    reason: lexical_alternative
  - marker: b
    text: Sa kontekstong ito, maaari ring unawain na “multo,” ngunit “espiritu” ang salitang nasa Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: Tingnan ninyo / tingnan
  rationale: Ang aorist imperative plural ay agarang panawagan sa mga alagad na magsuri sa pamamagitan ng paningin. Natural sa modernong Tagalog ang “tingnan ninyo”; sa ikalawang gamit, pinananatili ang parehong pandiwa.
- source_word: τὰς χεῖράς μου καὶ τοὺς πόδας μου
  choice: ang aking mga kamay at mga paa
  rationale: Tuwirang isinasalin ang mga konkretong bahagi ng katawan. Ipinahihiwatig ng pares ang pagkakakilanlan ng mismong katawan ni Jesus nang hindi idinaragdag sa teksto ang paliwanag tungkol sa mga sugat.
- source_word: ὅτι ἐγώ εἰμι αὐτός
  choice: ako nga ito mismo
  rationale: Ipinapahayag ng ἐγώ at αὐτός ang mariing personal na pagkakakilanlan. Ang “ako nga ito mismo” ay natural at mariin sa Tagalog at hindi nag-aangkat ng ibang teolohikal na pahiwatig.
- source_word: ψηλαφήσατέ με
  choice: Hipuin ninyo ako
  rationale: Ang pandiwa ay tumutukoy sa paghipo o pagkapa upang makatiyak. Ang “hipuin” ay malinaw, kasalukuyan, at marangal; mas tiyak ito kaysa sa payak na “hawakan.”
- source_word: πνεῦμα
  choice: isang espiritu
  rationale: Ito ang pinakadirektang katumbas at pinananatili ang salitang ginamit sa Griyego. Ang “multo” ay maaaring ipakahulugan ayon sa mga modernong kuwentong-bayan, kaya inilalagay lamang bilang posibleng kontekstuwal na diwa sa talababa.
- source_word: σάρκα καὶ ὀστέα
  choice: laman at mga buto
  rationale: Literal dito ang σάρξ at tumutukoy sa pisikal na katawan. Ang “laman at mga buto” ay malinaw at likas na parirala sa Tagalog.
- source_word: καθὼς
  choice: gaya ng
  rationale: Ipinakikilala nito ang paghahambing sa pagitan ng wala sa isang espiritu at ng nakikita nilang taglay ni Jesus.
- source_word: θεωρεῖτε
  choice: nakikita ninyo
  rationale: Bagaman maaaring magpahiwatig ng maingat na pagmamasid ang pandiwa, natural at sapat sa konteksto ang “nakikita ninyo.”
- source_word: ἔχοντα
  choice: mayroon ako
  rationale: Ang participle na tumutukoy kay Jesus ay likas na isinasalin sa Tagalog bilang sugnay na “mayroon ako,” sa halip na isang alanganing literal na konstruksyon.
theological_decisions:
- issue: Ang pisikal na realidad ni Jesus matapos siyang muling mabuhay
  choice: Pinanatili ang tahasang pananalitang “laman at mga buto” at ang mga utos na tumingin at humipo.
  alternative: Isang mas malayang salin na pinahihina o ipinapaliwanag ang kaibahan sa espiritu.
  rationale: Mariing inihaharap ng Griyego ang nahihipo at nakikitang katawan ni Jesus. Pinananatili ng salin ang sinasabi ng talata nang hindi nagdaragdag ng paliwanag na doktrinal.
- issue: Ugnayan ng unang ὅτι sa utos na tingnan
  choice: Ginamit ang tutuldok bago ang “ako nga ito mismo” upang ihayag ang nilalamang dapat nilang makilala.
  alternative: “Sapagkat ako nga ito mismo,” na bumabasa sa ὅτι bilang pananda ng dahilan.
  rationale: Maaaring magpahiwatig ng nilalaman o dahilan ang ὅτι. Ang tutuldok ay natural sa Tagalog, malapit sa content sense, at hindi labis na nagsasara sa tunay na saklaw ng konstruksyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang magalang na pangmaramihang “ninyo” dahil maraming alagad ang kinakausap. Iniwasan ang mas lumang “masdan” at ang mas impormal na ayos, habang pinanatili ang konkretong panawagan sa paningin at paghipo.
