  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂Ὁ δὲ Πέτρος ἀναστὰς ἔδραμεν ἐπὶ τὸ μνημεῖον· καὶ παρακύψας βλέπει τὰ ⸀ὀθόνια μόνα· καὶ ἀπῆλθεν πρὸς ⸀αὑτὸν θαυμάζων τὸ γεγονός.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/012.yaml
  text: But Peter got up and ran to the tomb; and stooping to look in, he sees the linen cloths alone, and he went away to himself, marveling at what had happened.
translation:
  language: tl
  text: Ngunit tumindig si Pedro at tumakbo patungo sa libingan. Yumuko siya upang sumilip at nakita niya ang mga telang lino lamang. Pagkatapos ay umalis siya, na nagtataka sa nangyari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “patungo sa sarili niya.” Maaaring mangahulugang umuwi siya, o na siya ay nagtataka sa sarili niya tungkol sa nangyari.'
    reason: Ang πρὸς ἑαυτόν ay di-karaniwan sa talatang ito at hindi tiyak kung inilalarawan nito ang patutunguhan ni Pedro o ang kaniyang panloob na pagkamangha.
lexical_decisions:
- source_word: ἀναστὰς
  choice: tumindig
  rationale: Likas at malinaw na salin ng participle na nagsasaad na bumangon o tumayo si Pedro bago tumakbo.
- source_word: μνημεῖον
  choice: libingan
  rationale: Karaniwang modernong Tagalog para sa batong libingang tinutukoy sa salaysay.
- source_word: παρακύψας
  choice: yumuko siya upang sumilip
  rationale: Ipinahahayag ang kilos ng pagyuko para tumingin sa loob, hindi lamang pangkalahatang pagtingin.
- source_word: βλέπει
  choice: nakita niyang
  rationale: Ginawang natural ang makasaysayang pangkasalukuyan sa salaysay na Tagalog habang pinananatili ang biglang pokus sa nakita ni Pedro.
- source_word: ὀθόνια
  choice: mga telang lino
  rationale: Tumutukoy sa mga piraso o telang lino na ginamit kaugnay ng paglilibing.
- source_word: μόνα
  choice: lamang ang naroon
  rationale: Nililinaw na ang mga telang lino ay naiwan na nag-iisa, nang hindi tahasang nagdaragdag kung ano o sino ang wala.
- source_word: πρὸς αὑτὸν
  choice: sa sarili
  rationale: Pinananatili ang di-karaniwang parirala at ang posibilidad na inilalarawan nito ang panloob na pagkamangha ni Pedro.
- source_word: θαυμάζων
  choice: nagtataka
  rationale: Saklaw nito ang paghanga at pagkamangha nang hindi ipinapalagay na ganap na siyang naniwala o nakaunawa.
theological_decisions:
- issue: Ang kahulugan ng πρὸς αὑτὸν kasama ng θαυμάζων
  choice: umalis siyang nagtataka sa sarili tungkol sa nangyari
  alternative: umuwi siyang labis na nagtataka sa nangyari
  rationale: Pinananatili ng pangunahing salin ang refleksibong parirala at ang ambiguwidad nito, sa halip na tiyaking ang ibig sabihin ay umuwi siya.
- issue: Makasaysayang pangkasalukuyan na βλέπει
  choice: nakita niyang
  alternative: nakikita niya
  rationale: Ang pangnagdaan ay mas natural sa tuloy-tuloy na salaysay sa Tagalog at hindi nagbabago sa nilalaman ng obserbasyon.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado ngunit madaling maunawaan. Iniwasan ang sobrang teknikal o denominasyonal na pananalita; pinanatili sa talababa ang tunay na ambiguwidad ng huling sugnay.
