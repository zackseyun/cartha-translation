    text: 'Sa literal: “patungo sa sarili niya.” Maaaring mangahulugang umuwi siya, o na siya ay nagtataka sa sarili niya tungkol sa nangyari.'
    reason: Ang πρὸς ἑαυτόν ay di-karaniwan sa talatang ito at hindi tiyak kung inilalarawan nito ang patutunguhan ni Pedro o ang kaniyang panloob na pagkamangha.
  revision_rationale: Inalis ang di-idiomatikong “nagtataka sa sarili” sa pangunahing teksto upang maiwasan ang maling kahulugang si Pedro mismo ang pinagtatakahan. Pinanatili ang payak na ‘umalis siya, na nagtataka sa nangyari,’ at inilipat sa talababa ang parehong pangunahing posibilidad ng πρὸς ἑαυτόν. Hindi binago ang kahulugan ng salaysay o nagdagdag ng interpretasyong doktrinal.
