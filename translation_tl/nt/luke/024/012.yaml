revisions:
- from: Ngunit tumindig si Pedro at tumakbo patungo sa libingan. Yumuko siya upang sumilip at nakita niyang ang mga telang lino lamang ang naroon. Pagkatapos, umalis siyang nagtataka sa sarili tungkol sa nangyari.[a]
  to: Ngunit tumindig si Pedro at tumakbo patungo sa libingan. Yumuko siya upang sumilip at nakita niya ang mga telang lino lamang. Pagkatapos ay umalis siya, na nagtataka sa nangyari.[a]
  rationale: Inalis ang di-idiomatikong “nagtataka sa sarili” sa pangunahing teksto upang maiwasan ang maling kahulugang si Pedro mismo ang pinagtatakahan. Pinanatili ang payak na ‘umalis siya, na nagtataka sa nangyari,’ at inilipat sa talababa ang parehong pangunahing posibilidad ng πρὸς ἑαυτόν. Hindi binago ang kahulugan ng salaysay o nagdagdag ng interpretasyong doktrinal.
