id: LUK.24.41
reference: Luke 24:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔτι δὲ ἀπιστούντων αὐτῶν ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων εἶπεν αὐτοῖς· Ἔχετέ τι βρώσιμον ἐνθάδε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/041.yaml
  text: And while they still were disbelieving because of joy and were marveling[a], he said to them, “Do you have anything here to eat?”
translation:
  language: tl
  text: At habang hindi pa rin sila makapaniwala dahil sa tuwa at patuloy na namamangha[a], sinabi niya sa kanila, “Mayroon ba kayong anumang makakain dito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “habang hindi pa rin sila naniniwala dahil sa tuwa at namamangha.”
    reason: Alternatibong mas tuwirang paglilipat ng ἀπιστούντων at ng magkatugmang mga participle.
lexical_decisions:
- source_word: ἔτι δὲ
  choice: At habang ... pa rin
  rationale: Ipinahahayag ng ἔτι ang nagpapatuloy na kalagayan, at ang δέ ay banayad na pang-ugnay. Likas sa Tagalog ang konstruksiyong “At habang ... pa rin” sa kontekstong ito.
- source_word: ἀπιστούντων
  choice: hindi pa rin sila makapaniwala
  rationale: Pinananatili nito ang nagpapatuloy at pansamantalang pag-aatubili ng mga alagad, nang hindi ipinahihiwatig ang matigas o palagiang kawalan ng pananampalataya.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: dahil sa tuwa
  rationale: Ginagamit dito ang ἀπό upang ipahayag ang sanhi o pinagmulan. Malinaw at natural sa modernong Tagalog ang “dahil sa tuwa,” at pinananatili nito ang kabalintunaang nahihirapan silang maniwala dahil sa labis na tuwa.
- source_word: θαυμαζόντων
  choice: patuloy na namamangha
  rationale: Ipinakikita ng “patuloy” ang nagpapatuloy na aspekto ng participle, samantalang ang “namamangha” ay naghahatid ng pagtatakang may paghanga.
- source_word: Ἔχετέ
  choice: Mayroon ba kayong
  rationale: Ito ang natural na paraan sa Tagalog upang itanong kung may taglay o makukuha ang kausap.
- source_word: τι
  choice: anumang
  rationale: Sa tanong, ang di-tiyak na panghalip ay likas na isinasalin bilang “anumang.”
- source_word: βρώσιμον
  choice: makakain
  rationale: Ang βρώσιμον ay nangangahulugang bagay na maaaring kainin. Maikli, malinaw, at idiomatiko ang “makakain.”
- source_word: ἐνθάδε
  choice: dito
  rationale: Tuwirang ipinahahayag ng “dito” ang lokasyong tinutukoy ng pang-abay.
theological_decisions:
- issue: Ang uri ng tugon ng mga alagad sa muling nabuhay na si Jesus
  choice: Ang kanilang hindi pa makapaniwala ay pansamantala at kaugnay ng labis na tuwa at pagkamangha.
  alternative: Unawain ito bilang payak na pag-aalinlangan o kawalan ng pananampalataya, nang hindi binibigyang-diin ang tuwang sanhi nito.
  rationale: Pinagsasama ng Griyego ang patuloy na hindi makapaniwala, tuwa bilang sanhi, at pagkamangha. Pinananatili ng salin ang masalimuot na tugong ito sa halip na gawing tahasang pagtanggi o lubusang pananampalataya.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “makapaniwala” upang ipahayag ang pansamantala at situwasyonal na hirap tanggapin ang kamangha-manghang pangyayari; pinanatili sa talababa ang mas tuwirang “naniniwala.”
