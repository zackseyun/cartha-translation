  source_fidelity: Tapat ang salin sa Griyego. Ang “hindi pa rin sila makapaniwala” ay angkop na idiomatikong paglilipat ng duratibong ἀπιστούντων sa kontekstong pansamantala at puno ng pagkamangha; malinaw na naipapahayag ng “dahil sa tuwa” ang sanhi ng ἀπὸ τῆς χαρᾶς. Napananatili rin ang magkaugnay na patuloy na pagkamangha at ang tanong ni Jesus tungkol sa pagkain na naririto.
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “At habang ...” ay maayos na panimula sa participial construction, at ang “Mayroon ba kayong anumang makakain dito?” ay malinaw at karaniwan nang gamit.
