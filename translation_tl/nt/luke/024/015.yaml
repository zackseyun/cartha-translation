id: LUK.24.15
reference: Luke 24:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ὁμιλεῖν αὐτοὺς καὶ συζητεῖν καὶ ⸀αὐτὸς Ἰησοῦς ἐγγίσας συνεπορεύετο αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/015.yaml
  text: And it happened that while they were talking and discussing[b][a], Jesus himself came near and was going with them.
translation:
  language: tl
  text: Habang nag-uusap at nagtatalakayan[a] sila, mismong si Jesus ay lumapit at lumakad kasama nila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagdedebate” o “nagtatalo”; maaaring magpahiwatig ang salitang Griyego ng mas matinding talakayan.
    reason: lexical_alternative
  - marker: b
    text: O “lumapit at sumama sa kanilang paglalakbay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Habang
  rationale: Ang ἐγένετο ay pormulang pasalaysay na nagpapakilala sa sumunod na pangyayari. Sa natural na modernong Tagalog, naipahihiwatig ang transisyong ito ng temporal na sugnay nang hindi gumagamit ng mabigat na “nangyari na.”
- source_word: ἐν τῷ ὁμιλεῖν αὐτοὺς
  choice: habang nag-uusap sila
  rationale: Temporal ang articular infinitive na may ἐν; natural itong isalin na “habang.” Ang ὁμιλεῖν ay karaniwang pag-uusap.
- source_word: συζητεῖν
  choice: nagtatalakayan
  rationale: Saklaw ng salita ang masinsinang pagtalakay at maaari ring magpahiwatig ng pagtatalo. Pinananatili ng “nagtatalakayan” ang tindi nang hindi ipinapalagay na nag-aaway sila.
- source_word: αὐτὸς Ἰησοῦς
  choice: mismong si Jesus
  rationale: Pinananatili ng “mismo” ang diin ng αὐτός sa pagkakakilanlan ni Jesus.
- source_word: ἐγγίσας
  choice: lumapit
  rationale: Tuwirang inilalarawan nito ang paglapit ni Jesus sa kanila bago o kasabay ng paglakad niya kasama nila.
- source_word: συνεπορεύετο
  choice: lumakad kasama nila
  rationale: Inilalarawan ng imperfect ang nagpapatuloy na pagsama niya sa kanilang paglalakbay. Natural at malinaw sa Tagalog ang “lumakad kasama nila.”
- source_word: καὶ ... καὶ ... καὶ
  choice: at ... at
  rationale: Pinananatili ang payak na pag-uugnay ng mga kilos, samantalang ang unang ugnayang temporal ay natural na ipinahayag sa “habang.”
theological_decisions:
- issue: Diin sa pagkakakilanlan ng lumalapit
  choice: mismong si Jesus
  alternative: si Jesus
  rationale: May malinaw na diin ang αὐτὸς Ἰησοῦς na ang lumapit ay si Jesus mismo. Pinananatili ito bilang gramatikal at pasalaysay na diin, nang walang idinaragdag na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang arkaikong pormulang “at nangyari,” ngunit pinanatili ang temporal na daloy, ang posibleng tindi ng talakayan sa talababa, at ang diin sa “mismong si Jesus.”
