  text: But when they entered[a], they did not find the body.
translation:
  language: tl
  text: Ngunit nang pumasok sila[a], hindi nila natagpuan ang katawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ganito ang mababasa sa ilang manuskrito: “ang katawan ng Panginoong Jesus.”'
    reason: textual_variant
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: nang pumasok sila
  rationale: Ang aorist active participle na pambabae at maramihan ay tumutukoy sa mga babae at likas na ipinahahayag sa modernong Tagalog bilang sugnay na panahunan.
- source_word: δὲ
  choice: Ngunit
  rationale: 'Ipinakikita ng δέ ang pagpapatuloy ng salaysay na may bahagyang pagsalungat: pumasok sila, ngunit hindi nila nakita ang inaasahan.'
- source_word: οὐχ εὗρον
  choice: hindi nila nakita
  rationale: Natural itong paraan sa Tagalog upang sabihin na ang hinahanap ay hindi nila natagpuan; pinananatili nito ang payak na puwersa ng aorist.
- source_word: τὸ σῶμα
  choice: ang katawan
  rationale: Ang σῶμα ay karaniwang nangangahulugang “katawan.” Mas tuwiran at hindi gaanong mapagpakahulugan ito kaysa “bangkay.”
theological_decisions:
- issue: Kung tutukuyin kung kaninong katawan ang tinutukoy
  choice: ang katawan
  alternative: ang katawan ng Panginoong Jesus
  rationale: Ang ibinigay na tekstong Griyego ay may maikli at payak na pagbasa na “ang katawan.” Hindi isinasama sa pangunahing teksto ang mas mahabang pagbasa na nasa ilang manuskrito.
translation_notes:
  register: Modernong Filipino Tagalog na simple, natural, at marangal. Ginamit ang “nang pumasok sila” sa halip na mas literal ngunit matigas na “pagkapasok nila,” at pinanatili ang tekstuwal na variant sa talababa.
