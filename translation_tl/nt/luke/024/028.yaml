  text: Καὶ ἤγγισαν εἰς τὴν κώμην οὗ ἐπορεύοντο, καὶ αὐτὸς ⸀προσεποιήσατο ⸀πορρώτερον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/028.yaml
  text: And they came near to the village where they were going[a], and he acted as though he were going farther.
translation:
  language: tl
  text: Paglapit nila sa nayong pupuntahan nila, umasta siya na parang magpapatuloy pa siya nang mas malayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagkunwari siyang magpapatuloy pa nang mas malayo,” o “nag-anyong magpapatuloy pa siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισαν
  choice: malapit na sila
  rationale: Ipinapahayag ng aorist ng ἐγγίζω ang paglapit nila sa isang lugar. Natural sa modernong Tagalog ang “malapit na sila” sa ganitong salaysay.
- source_word: κώμην
  choice: nayon
  rationale: Karaniwang tumutukoy ang κώμη sa isang maliit na pamayanan, hindi sa isang lungsod. Dignified at malinaw ang “nayon” sa konteksto.
- source_word: οὗ ἐπορεύοντο
  choice: pupuntahan nila
  rationale: Ipinakikita ng pariralang ito ang destinasyon ng nagpapatuloy nilang paglalakbay. Likas at tuwiran sa Tagalog ang “pupuntahan nila.”
- source_word: προσεποιήσατο
  choice: kumilos siya na parang
  rationale: Maaaring mangahulugan ang προσποιέομαι na magkunwari o magbigay ng impresyon. Pinananatili ng “kumilos siya na parang” ang anyo ng salaysay nang hindi agad nagpapahiwatig ng panlilinlang.
- source_word: πορρώτερον
  choice: sa mas malayo
  rationale: Ang comparative adverb ay tumutukoy sa pagpunta nang higit pang malayo. Malinaw nitong pinananatili ang paghahambing sa pisikal na distansiya.
- source_word: πορεύεσθαι
  choice: magpapatuloy pa
  rationale: Bilang infinitive na kaugnay ng προσεποιήσατο, inilalarawan nito ang waring gagawin niya. Ang “magpapatuloy pa” ay natural sa konteksto ng paglalakbay.
theological_decisions:
- issue: Paglalarawan sa kilos ni Jesus sa προσεποιήσατο
  choice: kumilos siya na parang magpapatuloy pa sa mas malayo
  alternative: nagkunwari siyang magpapatuloy pa sa mas malayo
  rationale: Pinananatili ng napiling salin ang tensiyon ng salaysay—nagbigay siya ng impresyong magpapatuloy—nang hindi pinatitindi ang salita tungo sa tahasang paratang ng panlilinlang.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nayon” para sa maliit na pamayanan at iniwasan ang sobrang pormal o makalumang ayos.
