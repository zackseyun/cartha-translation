  naturalness: Natural ang “nayon” at “pupuntahan nila,” ngunit mas maayos ang tuwirang pandiwang “Paglapit nila” kaysa sa medyo malabong “Nang malapit na sila.” Ang “umasta siya na parang” ay natural na modernong Filipino at pinananatili ang narratibong pag-aanyong ipinahihiwatig ng προσποιέομαι.
  terminology: Ang “nayon” ay angkop para sa κώμη. Hindi dapat gawing mas mabigat kaysa sa Griyego ang paglalarawan sa kilos ni Jesus; ang “umasta siya na parang” ay mas maingat kaysa “nagkunwari,” samantalang maaaring manatili ang huli bilang alternatibong tala.
