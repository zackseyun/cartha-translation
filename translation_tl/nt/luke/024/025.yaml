  text: καὶ αὐτὸς εἶπεν πρὸς αὐτούς· Ὦ ἀνόητοι καὶ βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν ἐπὶ πᾶσιν οἷς ἐλάλησαν οἱ προφῆται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/025.yaml
  text: And he said to them[a], “O foolish ones[c][b], and slow of heart to believe all that the prophets have spoken!”
translation:
  language: tl
  text: At sinabi niya sa kanila, “O mga walang-unawa, at mabagal ang inyong kalooban na maniwala sa lahat ng sinabi ng mga propeta!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ αὐτὸς εἶπεν πρὸς αὐτούς
  choice: At sinabi niya sa kanila
  rationale: Pinananatili ang payak na pag-uugnay ng καί at ang tuwirang panimulang pagsasalaysay; hindi kailangang bigyang-diin ang αὐτός sa Filipino.
- source_word: Ὦ
  choice: O
  rationale: Pinananatili ang mariin at taimtim na himig ng tuwirang pagsaway.
- source_word: ἀνόητοι
  choice: mga walang-unawa
  rationale: Itinatampok ang kakulangan ng pagkaunawa, gaya ng pangunahing diwa ng salita, nang hindi ito agad nililimitahan sa moral na kasamaan na maaaring ipahiwatig ng “mga hangal.”
- source_word: βραδεῖς τῇ καρδίᾳ
  choice: kay bagal ng inyong puso
  rationale: Pinananatili ang idyomang “puso” bilang kaloob-looban ng tao—kabilang ang pag-iisip, pagtitiwala, at pagtanggap—habang gumagamit ng likas na pahayag ng pagsaway sa Filipino.
- source_word: τοῦ πιστεύειν
  choice: na maniwala
  rationale: Likas na ipinapahayag sa Filipino ang kaugnayan ng kabagalan ng puso at ng paniniwala.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: sa lahat ng
  rationale: Pinananatili ang saklaw na walang ibinubukod sa sinabi ng mga propeta.
- source_word: ἐλάλησαν
  choice: sinabi
  rationale: Ang payak na aspektong naganap ay akma sa aorist at natural sa Filipino; hindi kinakailangang magdagdag ng aspektong tahasang katumbas ng English present perfect.
- source_word: οἱ προφῆται
  choice: mga propeta
  rationale: Karaniwan at tiyak na katawagan para sa mga propetang nagbigay ng patotoong tinutukoy.
theological_decisions:
- issue: Likas ng pagsaway ni Jesus
  choice: Ang pagsaway ay tumutukoy kapwa sa kakulangan ng pagkaunawa at sa kabagalan ng kaloob-loobang magtiwala sa buong patotoo ng mga propeta.
  alternative: Ituring itong pagsaway na moral lamang o pagkakamaling intelektuwal lamang.
  rationale: Pinagsasama ng ἀνόητοι at βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν ang pagkaunawa at pananampalataya. Kaya pinanatili ang “puso” at “maniwala” upang hindi paliitin ang diwa sa isip lamang o sa asal lamang.
translation_notes:
  register: Makabago at malinaw na Filipino na may marangal at bahagyang taimtim na himig. Pinanatili ang “O” at ang idyomang “puso” dahil mahalaga ang lakas ng pagsaway at ang lawak ng kahulugan ng orihinal.
