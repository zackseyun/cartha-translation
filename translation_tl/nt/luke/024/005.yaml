revisions:
- from: Nang matakot sila at iyuko ang kanilang mga mukha sa lupa, sinabi ng mga lalaki sa kanila, “Bakit ninyo hinahanap sa gitna ng mga patay ang siyang buháy?”[a]
  to: Nang matakot sila at iyuko nila ang kanilang mga mukha sa lupa, sinabi ng mga lalaki sa kanila, “Bakit ninyo hinahanap ang buháy sa gitna ng mga patay?”[a]
  rationale: Inayos ang tagaganap ng “iyuko” upang maging wasto at malinaw ang Tagalog habang pinananatili ang kongkretong larawan ng mga mukhang nakayuko sa lupa. Pinalitan ang “ang siyang buháy” ng mas likas na “ang buháy,” na nananatiling tapat sa isahan at personal na substantival participle. Hindi binago ang kontekstuwal na “Bakit” para sa τί ζητεῖτε o ang “sa gitna ng mga patay” para sa μετὰ τῶν νεκρῶν; ang literal na posibilidad ay napanatili sa talababa.
