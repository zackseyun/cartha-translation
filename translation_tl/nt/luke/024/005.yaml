base_translation:
  language: en
  yaml_path: translation/nt/luke/024/005.yaml
  text: And when they became terrified and bowed their faces to the ground[a], they said to them, “Why are you seeking the living one among the dead?”
translation:
  language: tl
  text: Nang matakot sila at iyuko nila ang kanilang mga mukha sa lupa, sinabi ng mga lalaki sa kanila, “Bakit ninyo hinahanap ang buháy sa gitna ng mga patay?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Ano ang hinahanap ninyo—ang buháy na kasama ng mga patay?” Sa konteksto, ang diwa ay: “Bakit ninyo hinahanap ang buháy sa gitna ng mga patay?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφόβων ... γενομένων
  choice: Nang matakot sila
  rationale: Ipinahahayag ng genitive absolute ang kalagayang kasabay at nauuna sa pangunahing kilos. Likas sa modernong Tagalog ang “nang matakot sila,” at sapat nitong naipapakita ang pagpasok nila sa matinding takot nang hindi nagiging labis ang salin.
- source_word: κλινουσῶν τὰ πρόσωπα εἰς τὴν γῆν
  choice: at iyuko ang kanilang mga mukha sa lupa
  rationale: Pinananatili nito ang kongkretong larawan ng pagkiling o pagyuko ng mukha patungo sa lupa bilang tugon sa takot at pagpipitagan. Ginamit ang pangyayaring anyo upang maging natural ang sunod-sunod na kilos sa Tagalog.
- source_word: εἶπαν πρὸς αὐτάς
  choice: sinabi ng mga lalaki sa kanila
  rationale: Bagaman mga panghalip lamang ang nasa mismong parirala, malinaw sa naunang talata na ang nagsasalita ay ang dalawang lalaki at ang kinakausap ay ang mga babae. Ang paglalantad sa simuno ay kailangan sa Tagalog upang maiwasan ang malabong reperensiya ng “sila.”
- source_word: Τί ζητεῖτε
  choice: Bakit ninyo hinahanap
  rationale: Literal na “ano” ang τί, ngunit sa konteksto ay hinahamon ng tanong ang dahilan o pagiging angkop ng paghahanap. Kaya “bakit” ang natural at kontekstuwal na katumbas; ang footnote ay nag-iingat sa literal na anyo.
- source_word: τὸν ζῶντα
  choice: ang siyang buháy
  rationale: Pinananatili ng pariralang ito ang isahan at personal na diwa ng substantival participle at ang mariing pagtutunggali sa mga patay. Nilagyan ng tuldik ang “buháy” upang malinaw na ito ang pang-uri at hindi “búhay” na pangngalan.
- source_word: μετὰ τῶν νεκρῶν
  choice: sa gitna ng mga patay
  rationale: Ang μετά na may genitive ay maaaring “kasama” o “sa gitna ng.” Sa kontekstong libingan, natural sa Tagalog ang “sa gitna ng mga patay” at malinaw nitong naihahayag ang pagsalungat ng buháy sa mga patay.
theological_decisions:
- issue: Pahiwatig ng muling pagkabuhay sa τὸν ζῶντα
  choice: ang siyang buháy
  alternative: ang nabubuhay
  rationale: Tinutukoy nito si Jesus bilang buháy, salungat sa mga patay, nang hindi idinaragdag sa talata ang tahasang paliwanag na “muling nabuhay.” Sa gayon, nananatili ang lakas at pagpipigil ng Griyegong teksto.
- issue: Pagkilala sa mga nagsasalita
  choice: sinabi ng mga lalaki sa kanila
  alternative: sinabi nila sa kanila
  rationale: Ang konteksto sa talata 4 ang tumutukoy sa dalawang lalaki. Hindi ito pagdaragdag ng doktrina kundi paglilinaw ng reperensiya na kailangan upang maging maunawaan ang Tagalog; hindi sila tinawag na “mga anghel” dahil hindi iyon ang katawagan sa agarang teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinili ang “ang siyang buháy” upang panatilihin ang isahan at personal na pagtukoy; ang tuldik ay tumutulong sa wastong pagbasa. Inilantad ang “mga lalaki” mula sa agarang konteksto upang alisin ang hindi likas na kalabuan ng dalawang magkasunod na panghalip sa Tagalog.
