  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing diwa: natakot ang mga babae, yumuko patungo sa lupa, at tinanong sila kung bakit nila hinahanap ang buháy sa mga patay. Gayunman, ang “at iyuko ang kanilang mga mukha” ay walang malinaw na tagaganap at hindi wastong naiuugnay sa nakaraang sugnay. Ang “ang siyang buháy” ay masyadong mabigat at hindi gaanong likas para sa substantival participle na τὸν ζῶντα.'
  naturalness: Kailangan ang maliit ngunit mahalagang pag-aayos sa balarila at kasalukuyang gamit. Ang “at iyuko nila ang kanilang mga mukha sa lupa” ay malinaw at natural. Ang “ang buháy” ay mas idiomatiko, nananatiling isahan at personal sa kontekstong ito, at malinaw ang pagsalungat sa “mga patay.”
  terminology: Ang “mga lalaki” ay katanggap-tanggap na paglilinaw mula sa agarang konteksto (Lucas 24:4), nang hindi sila tinatawag na mga anghel. Ang “mga patay” at “buháy” ay angkop na mga katawagan. Pinananatili ng “sa gitna ng” ang kontekstuwal na diwa ng μετά na may genitive, bagaman ang literal na “kasama ng” ay dapat manatili sa talababa.
  issues:
  - severity: medium
    issue: Hindi malinaw at hindi wastong nakaayos ang pandiwang “iyuko.”
    rationale: 'Sa “Nang matakot sila at iyuko ang kanilang mga mukha,” ang anyong “iyuko” ay walang ipinahayag na tagaganap at maaaring mabasa bilang pautos. Kailangang ilahad ang tagaganap: “iyuko nila.”'
  - severity: low
    issue: Hindi gaanong likas ang “ang siyang buháy.”
    rationale: Bagaman sinisikap nitong markahan ang personal at isahang τὸν ζῶντα, ang “ang buháy” ay mas natural sa modernong Tagalog at sapat ang personal na pagtukoy dahil sa tanong at sa kaibahan nito sa “mga patay.”
  - severity: low
    issue: Kailangang iayon ang talababa sa binagong pangunahing salin.
    rationale: Dapat gamitin ng talababa ang parehong mas natural na katawagang “ang buháy” at panatilihin ang literal na alternatibong “kasama ng mga patay.”
