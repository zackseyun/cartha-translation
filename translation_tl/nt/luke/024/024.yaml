base_translation:
  language: en
  yaml_path: translation/nt/luke/024/024.yaml
  text: And some of those with us went to the tomb and found it just as the women had said, but they did not see him.
translation:
  language: tl
  text: At may ilan sa mga kasama namin na pumunta sa libingan, at natagpuan nila itong gaya nga ng sinabi ng mga babae, ngunit hindi nila siya nakita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθόν
  choice: pumunta
  rationale: Payak at natural na salaysay ng pagpunta sa libingan; hindi nito labis na binibigyang-diin ang pag-alis.
- source_word: τινες τῶν σὺν ἡμῖν
  choice: ang ilan sa mga kasama namin
  rationale: Malinaw na tumutukoy sa isang bahagi ng pangkat na kasama ng mga nagsasalita, nang hindi nagdaragdag ng pagkakakilanlan.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: sa libingan
  rationale: Sa konteksto ng pagkabuhay na muli, ang μνημεῖον ay ang pinaglibingan kay Jesus; ang “libingan” ang karaniwan at tiyak na salin.
- source_word: εὗρον οὕτως
  choice: Natagpuan nilang gayon nga ang kalagayan
  rationale: Ipinahahayag ang pagkakatugma ng nakita nila sa naunang ulat. Idinagdag ang “ang kalagayan” bilang likas na Filipino na pantulong sa di-tiyak na οὕτως, nang hindi tinutukoy kung ano mismo ang nasa libingan.
- source_word: καθὼς καὶ αἱ γυναῖκες εἶπον
  choice: tulad ng sinabi ng mga babae
  rationale: Likas na ipinakikita ang pagtutugma sa ulat ng mga babae. Hindi na tahasang isinalin ang καί sapagkat naipahihiwatig na ng paghahambing ang dagdag o pagpapatibay.
- source_word: αὐτὸν
  choice: siya
  rationale: Pinananatili ang panghalip ng Griyego, na tumutukoy kay Jesus, sa halip na gawing tahasan ang pangalan.
- source_word: δὲ οὐκ εἶδον
  choice: ngunit hindi nila siya nakita
  rationale: Pinananatili ang banayad ngunit malinaw na pagsalungat at ang kahulugan ng ὁράω bilang “makita,” hindi “matagpuan.”
theological_decisions:
- issue: Paglalahad tungkol sa pagkabuhay na muli
  choice: Pinagtibay ng mga pumunta ang ulat ng mga babae tungkol sa kalagayan sa libingan, ngunit hindi nila nakita si Jesus.
  alternative: Tukuyin nang mas detalyado ang nakita nila o iugnay ito sa mga detalye ng ibang salaysay.
  rationale: Pinananatili ang pagkakaiba sa Griyego sa pagitan ng pagkatagpo nilang gayon ang kalagayan at ng hindi nila pagkakita sa kanya, nang walang idinadagdag na harmonisasyon mula sa mga kahalintulad na salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “mga kasama namin” at “libingan” bilang karaniwang pananalita; iniwasan ang mas lumang anyo at ang di-kailangang pagpapaliwanag.
