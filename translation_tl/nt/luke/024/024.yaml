  source_fidelity: 'Tumpak ang pangunahing diwa: may ilan sa grupong kasama ng mga nagsasalita na pumunta sa libingan, natagpuan itong naaayon sa ulat ng mga babae, ngunit hindi nakita si Jesus. Gayunman, ang idinagdag na “ang kalagayan” ay hindi tuwirang nasa Griyego at bahagyang nililimitahan ang sinasaklaw ng οὕτως (“gayon/ganito”).'
  naturalness: Nauunawaan ang draft, ngunit masidhi at bahagyang hindi natural ang “Natagpuan nilang gayon nga ang kalagayan.” Mas payak at likas ang “natagpuan nila itong gaya nga ng sinabi ng mga babae.”
  terminology: Ang “libingan,” “mga kasama namin,” “mga babae,” at “nakita” ay angkop sa modernong Filipino Tagalog at tapat sa mga pangunahing katawagan ng pinagmulan. Ang panghalip na “siya” ay wastong pinananatili para kay Jesus.
