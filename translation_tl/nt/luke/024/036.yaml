  source_fidelity: 'Ang pangunahing diwa ay tapat sa SBLGNT: ipinapakita nito ang kasabay na pag-uusap, ang mariing paksa, ang pagtayo, at ang pagkapuwesto sa gitna ng pangkat. Gayunman, ang pagdaragdag ng pangalang “Jesus” ay wala sa ibinigay na Griyego, na may mariing “siya mismo”; hindi kailangan ang dagdag na pagpapalinaw sa talatang ito.'
