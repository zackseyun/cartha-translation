  text: While they were saying these things[a], he himself stood among them.
translation:
  language: tl
  text: Habang pinag-uusapan nila ang mga bagay na ito, siya mismo ay tumayo sa gitna nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Idinaragdag ng ilang manuskrito: “at sinasabi niya sa kanila, ‘Kapayapaan sa inyo.’”'
    reason: textual_variant
lexical_decisions:
- source_word: Ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang maramihang anyo ng panghalip na pamatlig at ang malinaw na pagtukoy sa mga bagay na kasalukuyan nilang pinag-uusapan.
- source_word: δὲ ... αὐτῶν λαλούντων
  choice: Habang pinag-uusapan nila
  rationale: Ang genitive absolute na may pangkasalukuyang participle ay nagsasaad ng kilos na nagpapatuloy at kasabay ng sumunod na pangyayari. Likas sa modernong Tagalog ang “habang,” at ipinahihiwatig ng konteksto na pinag-uusapan nila ang naunang salaysay.
- source_word: αὐτὸς
  choice: si Jesus mismo
  rationale: Pinananatili ng “mismo” ang diin ng tahasang panghalip. Ginawang lantad ang tinutukoy na si Jesus upang maging malinaw at natural sa Tagalog, yamang madalas mangailangan ng malinaw na paksa ang pangungusap.
- source_word: ἔστη
  choice: ay tumayo
  rationale: Tuwirang isinasalin ang aorist ng ἵστημι bilang pagtayong naganap; hindi dinaragdagan ng di-tahasang ideya ng paglitaw o paglapit.
- source_word: ἐν μέσῳ αὐτῶν
  choice: sa gitna nila
  rationale: Natural at dignified na katumbas ng idyomang nagsasaad na naroon siya sa mismong kalagitnaan ng pangkat.
theological_decisions:
- issue: Kung isasama sa pangunahing teksto ang mas mahabang pagbasa na “at sinabi niya sa kanila, ‘Sumainyo ang kapayapaan.’”
  choice: Hindi isinama sa pangunahing teksto, alinsunod sa ibinigay na SBLGNT.
  alternative: 'Isama: “at sinabi niya sa kanila, ‘Sumainyo ang kapayapaan.’”'
  rationale: Nagtatapos sa ἐν μέσῳ αὐτῶν ang ibinigay na tekstong Griyego. Hindi ito pinagtutugma sa ibang tradisyon ng manuskrito, ngunit inilalahad sa talababa ang mahalagang alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “pinag-uusapan” sa halip na mas literal ngunit hindi gaanong tiyak na “nagsasalita,” sapagkat tumutukoy ang Ταῦτα sa mga bagay na kanilang tinatalakay. Ang talababa ay inilagay pagkatapos ng buong pangungusap dahil ang variant ay karugtong ng sugnay.
