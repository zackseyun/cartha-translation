  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦσαν δὲ ἡ Μαγδαληνὴ Μαρία καὶ Ἰωάννα καὶ Μαρία ⸀ἡ Ἰακώβου καὶ αἱ λοιπαὶ σὺν αὐταῖς· ⸀ἔλεγον πρὸς τοὺς ἀποστόλους ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/010.yaml
  text: They were Mary Magdalene[a], Joanna, Mary the mother of James, and the other women with them; they were telling these things to the apostles.
translation:
  language: tl
  text: Sila ay sina Maria Magdalena, Juana, Maria na ina ni Santiago[a], at ang iba pang babaeng kasama nila. Ikinukuwento nila sa mga apostol ang mga bagay na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “Maria ni Santiago.” Malamang na ang ibig sabihin ay “Maria na ina ni Santiago,” ngunit posible ring “Maria na asawa ni Santiago.”
    reason: Pinananatili ang kalabuan ng pinaikling ugnayang ipinahahayag ng genitive sa Griyego.
lexical_decisions:
- source_word: ἦσαν δὲ
  choice: Sila ay
  rationale: Ipinakikilala ng imperfect plural ang mga babaeng tinutukoy sa naunang konteksto. Hindi na nilagyan ng tahasang panandang tulad ng “Ngayon” sapagkat banayad lamang ang paglipat na ipinahihiwatig ng δέ at hindi ito temporal na pang-abay.
- source_word: ἡ Μαγδαληνὴ Μαρία
  choice: Maria Magdalena
  rationale: Ito ang nakasanayang natural na anyo ng pangalan at katawagan sa modernong Tagalog.
- source_word: Ἰωάννα
  choice: Juana
  rationale: Ginamit ang kinagawiang anyo ng pangalang ito sa Tagalog na salin ng Bibliya.
- source_word: Μαρία ἡ Ἰακώβου
  choice: Maria na ina ni Santiago
  rationale: Elliptical ang genitive sa Griyego. Malamang na kinikilala si Maria sa pamamagitan ng kaniyang anak, kaya malinaw at natural ang “ina ni Santiago,” habang inilalahad sa talababa ang tunay na kalabuan.
- source_word: αἱ λοιπαὶ σὺν αὐταῖς
  choice: ang iba pang mga babaeng kasama nila
  rationale: Feminine plural ang anyo at mga babae sa libingan ang tinutukoy; nilinaw sa Tagalog ang ipinahihiwatig na pangngalang “mga babae.”
- source_word: ἔλεγον
  choice: Isinasalaysay nila
  rationale: Naipahihiwatig ng aspektong imperfect ang nagpapatuloy na pagsasalaysay, nang hindi ipinipilit na paulit-ulit itong ginawa.
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang plural na pagtukoy sa mga pangyayari at mensaheng iniulat nila.
- source_word: πρὸς τοὺς ἀποστόλους
  choice: sa mga apostol
  rationale: Ang “apostol” ang malinaw at nakaugaliang katawagan sa Tagalog para sa natatanging pangkat ng mga isinugo ni Jesus.
theological_decisions:
- issue: Pagkakakilanlan ng Μαρία ἡ Ἰακώβου
  choice: Maria na ina ni Santiago
  alternative: 'Maria na asawa ni Santiago; mas literal: Maria ni Santiago'
  rationale: Hindi tahasang sinasabi ng pinaikling pariralang Griyego kung ano ang kaugnayan ni Maria kay Santiago. Ang pagiging ina ang pinakamalamang ayon sa ganitong paraan ng pagkilala sa mga Ebanghelyo, ngunit hindi dapat itago ang posibilidad na asawa ang ibig sabihin.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “isinasalaysay” upang maipakita ang nagpapatuloy na kilos ng imperfect nang hindi nagdaragdag ng di-tiyak na pag-uulit. Inilagay ang talababa sa “Santiago,” kung saan naroroon ang tunay na kalabuan.
