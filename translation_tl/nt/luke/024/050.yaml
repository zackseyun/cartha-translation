  rationale: Pinalitan ang hindi likas na “hanggang sa may Betania” ng “hanggang sa dakong Betania” upang maipahayag nang natural ang saklaw at direksiyong may bahagyang kalabuan sa ἕως πρὸς Βηθανίαν. Pinalitan din ang “inilabas niya” ng “inakay niya sila palabas” upang mapanatili ang pangunguna/pag-akay na taglay ng ἐξήγαγεν. Napanatili ang payak na paglalarawan sa pagpapala ni Jesus.
