  text: Ἐξήγαγεν δὲ αὐτοὺς ⸀ἕως ⸀πρὸς Βηθανίαν, καὶ ἐπάρας τὰς χεῖρας αὐτοῦ εὐλόγησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/050.yaml
  text: Then he led them out as far as Bethany[a], and lifting up his hands, he blessed them.
translation:
  language: tl
  text: Pagkatapos, inakay niya sila palabas hanggang sa dakong Betania[a]. Itinaas niya ang kanyang mga kamay at pinagpala sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hanggang sa Betania” o “hanggang sa malapit sa Betania.” Ang pananalitang Griyego ay literal na “hanggang patungo sa Betania.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξήγαγεν
  choice: inilabas niya
  rationale: Ipinahahayag ng pandiwang ἐξάγω ang pag-akay o pagdadala palabas. Natural sa Filipino ang “inilabas niya” at napapanatili nito ang direksiyong taglay ng ἐξ-.
- source_word: δὲ
  choice: Pagkatapos
  rationale: Nagsasaad dito ang δέ ng pag-usad ng salaysay, hindi ng matinding pagsalungat.
- source_word: ἕως πρὸς Βηθανίαν
  choice: hanggang sa may Betania
  rationale: Ang tambalang ἕως πρός ay nagsasaad ng pag-abot sa dako o paligid ng Betania. Ang “hanggang sa may” ay natural at pinananatili ang bahagyang kalabuan kung mismong bayan o kalapit na pook ang tinutukoy.
- source_word: Βηθανίαν
  choice: Betania
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar.
- source_word: ἐπάρας
  choice: Itinaas niya
  rationale: Ang aorist participle na ἐπάρας ay tumutukoy sa kilos na nauna o kasabay ng pagpapala. Ginawang hiwalay na sugnay upang maging natural at malinaw sa Filipino.
- source_word: τὰς χεῖρας αὐτοῦ
  choice: ang kanyang mga kamay
  rationale: Pinananatili ang maramihang “mga kamay,” na mahalaga sa inilalarawang kilos ng pagpapala.
- source_word: εὐλόγησεν
  choice: pinagpala
  rationale: Tuwirang ipinahahayag ng εὐλογέω ang pagkilos ni Jesus na magpala, nang hindi ito pinalalawak bilang isang tiyak na ritwal o pormula.
- source_word: αὐτούς
  choice: sila
  rationale: Tuwirang panghalip na tumutukoy sa mga alagad mula sa konteksto.
theological_decisions:
- issue: Ang katangian ng pagpapala ni Jesus sa mga alagad
  choice: “pinagpala sila”
  alternative: “binigkas niya ang pagpapala sa kanila”
  rationale: Pinananatili ng payak na pandiwa ang mismong kilos ni Jesus nang hindi nagdaragdag ng isang liturhikal o makasaserdoteng pormula at nang hindi rin ito ginagawang karaniwang pagbati lamang.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “sa may Betania” upang madaling maunawaan habang pinananatili ang tunay na kalabuan ng ἕως πρὸς. Hinati sa dalawang pangungusap ang mga kilos upang maiwasan ang alanganing participial construction sa Filipino.
