source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ εὐλογεῖν αὐτὸν αὐτοὺς διέστη ἀπ’ αὐτῶν ⸂[καὶ ἀνεφέρετο εἰς τὸν οὐρανόν]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/051.yaml
  text: And it happened that[a], while he was blessing them, he parted from them and was carried up into heaven.
translation:
  language: tl
  text: At nangyari, habang binabasbasan niya sila, humiwalay siya sa kanila at iniakyat siya sa langit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi kasama sa ilang manuskrito ang “at iniakyat siya sa langit.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: At nangyari
  rationale: Pinananatili nito ang karaniwang pormulang pasalaysay ni Lucas sa natural at makabagong Tagalog.
- source_word: ἐν τῷ εὐλογεῖν αὐτὸν αὐτούς
  choice: habang binabasbasan niya sila
  rationale: Ipinahahayag ng ἐν kasunod ng articular infinitive ang kilos na kasabay at nagpapatuloy nang mangyari ang paghihiwalay.
- source_word: διέστη ἀπ’ αὐτῶν
  choice: humiwalay siya sa kanila
  rationale: Malinaw nitong ipinapahayag ang pisikal na paglayo o paghihiwalay nang hindi dinaragdagan ang diwa ng teksto.
- source_word: ἀνεφέρετο
  choice: iniakyat
  rationale: Pinananatili ng anyong balintiyak ang diwang dinala paitaas si Jesus nang hindi tahasang tinutukoy kung sino ang gumawa nito.
- source_word: εἰς τὸν οὐρανόν
  choice: sa langit
  rationale: Sa kontekstong ito, ang οὐρανός ay tumutukoy sa langit, hindi lamang sa nakikitang himpapawid.
theological_decisions:
- issue: Ang nakapanaklong na pariralang καὶ ἀνεφέρετο εἰς τὸν οὐρανόν
  choice: Isinama sa pangunahing teksto at nilagyan ng talababa tungkol sa baryanteng tekstuwal.
  alternative: Alisin ang pariralang “at iniakyat sa langit.”
  rationale: Nasa ibinigay na tekstong SBLGNT ang parirala ngunit minarkahan bilang hindi tiyak. Kaya isinasalin ito sa pangunahing teksto habang hayagang pinananatili sa talababa ang mahalagang pagkakaiba ng mga manuskrito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “binabasbasan” para sa natural na pagpapahayag ng pagbibigay ng basbas, at iniwasang tukuyin ang ahente ng pag-akyat dahil hindi ito tahasang sinasabi ng anyong balintiyak sa Griyego.
