  source_fidelity: Tumpak na naipapahayag ng draft ang sabayang pagbabasbas, ang paghihiwalay mula sa mga alagad, at ang balintiyak na pag-akyat sa langit. Gayunman, mas malinaw na ilahad ang panghalip sa ikalawang sugnay upang hindi maging malabo ang pagbabago mula sa aktibong “humiwalay siya” tungo sa balintiyak na kilos. Napananatili rin ng talababa ang kawalang-katiyakan ng nakapanaklong na SBLGNT na parirala.
