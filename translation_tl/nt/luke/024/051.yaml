  terminology: Ang “binabasbasan,” “humiwalay,” at “langit” ay angkop sa modernong Filipino at sa relihiyosong rehistro. Hindi idinaragdag ng “iniakyat siya” ang ahente ng kilos at kaya ay napapanatili ang balintiyak na diwa ng ἀνεφέρετο.
