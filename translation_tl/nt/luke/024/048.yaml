  text: ὑμεῖς ⸀ἐστε μάρτυρες τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/048.yaml
  text: You are witnesses of these things[a].
translation:
  language: tl
  text: Kayo ang mga saksi sa mga bagay na ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Kayo ang mga saksi sa mga ito.” Ang pamatlig sa Griyego ay tumutukoy sa mga pangyayaring kababanggit lamang ni Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Kayo
  rationale: Ang tahasang panghalip na pangalawang panauhang maramihan ay may diin. Likas na naipahahayag ito ng “Kayo” sa unahan ng pangungusap.
- source_word: ἐστε
  choice: ang mga
  rationale: Sa natural na Tagalog, ang pandiwang “maging” sa pangkasalukuyang pangungusap na panaguri ay karaniwang hindi tahasang isinasalin; ang hulma na “Kayo ang mga saksi” ang likas na katumbas ng ἐστε μάρτυρες.
- source_word: μάρτυρες
  choice: mga saksi
  rationale: Tumutukoy ito sa mga taong nagpapatotoo tungkol sa kanilang nakita at narinig. Hindi nito kailangang ipahiwatig dito ang mas huling teknikal na diwa ng pagiging martir.
- source_word: τούτων
  choice: sa mga bagay na ito
  rationale: Ang panghalip na pamatlig sa genitive plural ay tumutukoy pabalik sa mga pangyayaring kababanggit lamang ni Jesus. Ang “sa mga bagay na ito” ay malinaw at natural sa modernong Tagalog.
theological_decisions:
- issue: Diwa ng tungkulin ng mga alagad bilang μάρτυρες
  choice: Ipinakikilala ang mga alagad bilang mga saksing magpapatotoo tungkol sa mga pangyayaring kababanggit lamang.
  alternative: Maaaring marinig sa salita ang mas huling Kristiyanong kaugnayan nito sa pagkamartir.
  rationale: Sa agarang konteksto, ang paksa ay ang pagdurusa at muling pagkabuhay ni Jesus at ang pagpapahayag ng pagsisisi para sa kapatawaran ng mga kasalanan. Kaya pinananatili ng salin ang payak na diwa ng pagpapatotoo at hindi ipinapasok ang mas huling teknikal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinananatili ang diin ng tahasang ὑμεῖς sa pamamagitan ng paglalagay ng “Kayo” sa unahan, habang ginagamit ang likas na pangungusap na panaguri sa Tagalog nang walang tahasang katumbas ng copula.
