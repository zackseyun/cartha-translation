  text: καὶ ἀναστάντες αὐτῇ τῇ ὥρᾳ ὑπέστρεψαν εἰς Ἰερουσαλήμ, καὶ εὗρον ⸀ἠθροισμένους τοὺς ἕνδεκα καὶ τοὺς σὺν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/033.yaml
  text: And rising that very hour[a], they returned to Jerusalem and found the Eleven and those with them gathered together,
translation:
  language: tl
  text: Noon ding oras na iyon ay tumindig sila at bumalik sa Jerusalem. Natagpuan nilang nakatipon[a] ang Labing-isa at ang mga kasama nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sama-samang nagtipon.” Inilalarawan ng Griyegong participle na nakatipon na sila nang matagpuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: Tumindig sila
  rationale: Ipinahahayag ang pisikal na pagtindig na nauna at kaakibat ng pangunahing kilos, nang hindi ito ginagawang simpleng pahiwatig lamang ng pag-alis.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: nang oras ding iyon
  rationale: Pinananatili ang tiyak na pagtukoy sa mismong oras at ang diin ng αὐτῇ, sa natural na modernong Tagalog.
- source_word: ὑπέστρεψαν
  choice: bumalik
  rationale: Karaniwang salin ng pandiwa sa konteksto ng paglalakbay pabalik sa isang lugar.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Ginagamit ang nakasanayang anyo ng pangalan ng lugar sa Filipino.
- source_word: εὗρον
  choice: Natagpuan nila
  rationale: Tuwirang isinasalin ang karaniwang pandiwang salaysay, habang likas na ikinakabit sa sugnay na naglalarawan sa kalagayan ng mga natagpuan.
- source_word: ἠθροισμένους
  choice: natipon
  rationale: Ipinakikita ang resultang kalagayan ng mga taong nakatipon na nang matagpuan sila; tumutugma ito sa perpektong pasibong participle.
- source_word: τοὺς ἕνδεκα
  choice: ang Labing-isa
  rationale: Pinananatili ang mismong katawagan sa pangkat at hindi idinaragdag ang salitang “apostol,” na wala sa Griyego.
- source_word: τοὺς σὺν αὐτοῖς
  choice: ang mga kasama nila
  rationale: Malinaw at natural na tumutukoy sa iba pang naroon kasama ng Labing-isa, nang walang dagdag na pagpapakilala sa kanila.
theological_decisions:
- issue: Ang katawagang “Labing-isa” kahit maaaring hindi eksaktong labing-isa ang naroon
  choice: Panatilihin ang katawagang “ang Labing-isa.”
  alternative: ang labing-isang apostol; ang natitirang mga alagad
  rationale: Ginagamit ng Griyego ang kinikilalang katawagan sa pangunahing pangkat. Hindi dapat baguhin o palawakin ang teksto upang pagtugmain ang bilang sa ibang salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maging likas ang daloy, ngunit pinanatili ang pagkakasunod-sunod ng mga kilos at ang saklaw ng “natipon” sa Labing-isa at sa mga kasama nila.
