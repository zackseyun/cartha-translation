  terminology: Ang “Jerusalem,” “ang Labing-isa,” at “mga kasama nila” ay angkop. Dapat palitan ang talababa dahil ang “nagkakatipon” ay aspektuwal na hindi katumbas ng perpektong pasibong participle at hindi nagpapahayag na nakatipon na sila.
