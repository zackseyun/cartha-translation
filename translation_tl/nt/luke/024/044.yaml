id: LUK.24.44
reference: Luke 24:44
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸂πρὸς αὐτούς⸃· Οὗτοι οἱ λόγοι ⸀μου οὓς ἐλάλησα πρὸς ὑμᾶς ἔτι ὢν σὺν ὑμῖν, ὅτι δεῖ πληρωθῆναι πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωϋσέως ⸀καὶ προφήταις καὶ ψαλμοῖς περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/044.yaml
  text: 'Then he said to them[c][b][a], “These are my words that I spoke to you while I was still with you: that everything written about me in the Law of Moses and the Prophets and the Psalms must be fulfilled.”'
translation:
  language: tl
  text: 'Pagkatapos ay sinabi niya sa kanila, “Ito ang mga salitang sinabi ko sa inyo habang kasama ko pa kayo: kailangang matupad ang lahat ng nakasulat[a] tungkol sa akin[c] sa Kautusan ni Moises, sa mga Propeta, at sa mga Awit[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng mga bagay na nakasulat.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Kautusan ni Moises, mga Propeta, at mga Awit” ay malamang na tumutukoy sa malalaking bahagi ng Kasulatan ng Israel. Maaaring ang “mga Awit” ay tumukoy mismo sa Aklat ng mga Awit o, sa mas malawak na diwa, sa Mga Sinulat.
    reason: cultural_note
  - marker: c
    text: O “hinggil sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ πρὸς αὐτούς
  choice: Pagkatapos ay sinabi niya sa kanila
  rationale: Ang δέ ay banayad na pang-ugnay na nagpapatuloy sa salaysay; natural na ipinahahayag ito ng “Pagkatapos ay.” Ang πρός αὐτούς pagkatapos ng pandiwa ng pagsasalita ay “sa kanila.”
- source_word: Οὗτοι οἱ λόγοι μου
  choice: Ito ang mga salitang
  rationale: Pinananatili ng “mga salita” ang karaniwang kahulugan ng λόγοι. Sa Filipino, natural na nagiging bahagi ito ng pangungusap na “Ito ang mga salitang sinabi ko...” kaysa sa mas literal ngunit asiwa na “Ito ang aking mga salita na...”
- source_word: οὓς ἐλάλησα πρὸς ὑμᾶς
  choice: sinabi ko sa inyo
  rationale: Bagaman maaaring “sinalita,” ang “sinabi” ang natural na katumbas ng ἐλάλησα sa kontekstong tumutukoy sa naunang pahayag ni Jesus.
- source_word: ἔτι ὢν σὺν ὑμῖν
  choice: noong kasama pa ninyo ako
  rationale: Ipinahahayag ng “noong” ang temporal na gamit ng participle, at ng “pa” ang ἔτι. Ang ayos na ito ay likas sa modernong Filipino.
- source_word: ὅτι δεῖ πληρωθῆναι
  choice: kailangang matupad
  rationale: Ang δεῖ ay nagpapahayag ng pangangailangan, at ang “matupad” ang nakaugaliang malinaw na katumbas ng πληρωθῆναι sa konteksto ng Kasulatan.
- source_word: πάντα τὰ γεγραμμένα
  choice: ang lahat ng nakasulat
  rationale: Pinananatili nito ang saklaw ng πάντα at ang resultang kalagayan ng perfect passive participle γεγραμμένα nang natural sa Filipino.
- source_word: ἐν τῷ νόμῳ Μωϋσέως καὶ προφήταις καὶ ψαλμοῖς
  choice: sa Kautusan ni Moises, sa mga Propeta, at sa mga Awit
  rationale: Ang mga kapital ay nagpapahiwatig ng kinikilalang mga bahagi ng Kasulatan nang hindi ipinapasok sa pangunahing teksto ang pagtatalo kung ang “mga Awit” ay tumutukoy lamang sa Aklat ng mga Awit o mas malawak sa Mga Sinulat.
- source_word: περὶ ἐμοῦ
  choice: tungkol sa akin
  rationale: Direkta at natural na katumbas ito ng περί na may genitive, at pinananatili ang saklaw nitong tumutukoy kay Jesus.
theological_decisions:
- issue: Lakas at saklaw ng pangangailangang matupad ang Kasulatan
  choice: kailangang matupad
  alternative: nakatalagang matupad; dapat magkatotoo
  rationale: Pinananatili ng “kailangang matupad” ang lakas ng δεῖ at ang wika ng katuparan nang hindi tinutukoy kung paano gumagana ang banal na pangangailangan o kung anong teorya ng propesiya ang dapat pairalin.
- issue: Pagkakakilanlan ng “Kautusan ni Moises, mga Propeta, at mga Awit”
  choice: Iharap bilang mga pinangalanang bahagi ng Kasulatan, na may paliwanag sa talababa
  alternative: Ituring ang “mga Awit” nang tahasan bilang katawagan para sa buong Mga Sinulat
  rationale: Malamang na tumutukoy ang parirala sa malalaking pangkat ng Kasulatan ng Israel, ngunit hindi tiyak mula sa talata lamang kung ang “mga Awit” ay ang Psalter mismo o kumakatawan sa mas malawak na Mga Sinulat.
- issue: Ugnayan ng “tungkol sa akin” sa mga nakasulat
  choice: Iugnay ito sa “lahat ng nakasulat” at panatilihin bilang “tungkol sa akin”
  alternative: hinggil sa akin
  rationale: Malinaw sa Griyego na ang περὶ ἐμοῦ ay tumutukoy sa nilalaman ng mga nakasulat. Hindi dinaragdagan ng salin kung tuwiran, tipolohikal, o sa ibang paraan ang pagtukoy ng mga tekstong iyon kay Jesus.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “Kautusan” at mga kapital sa “Propeta” at “Awit” upang malinaw na tumukoy sa mga pangkat ng Kasulatan. Iniwasan ang sobrang teknikal o denominasyonal na pagpapaliwanag. Ang bawat talababa [a], [b], at [c] ay may katumbas na marker sa pangunahing teksto.
