  source_fidelity: 'Tumpak na naihahatid ng salin ang pangunahing diwa at ugnayang panggramatika ng Griyego: ang pahayag ay kay “kanila,” tumutukoy sa mga salitang nauna nang sinabi ni Jesus, at ipinahahayag na kailangang matupad ang lahat ng nakasulat tungkol sa kanya sa tatlong pinangalanang pangkat ng Kasulatan. Ang “kailangang matupad” ay angkop para sa δεῖ πληρωθῆναι at hindi nagdaragdag ng paliwanag na doktrinal.'
  naturalness: Kailangan lamang ng maliit ngunit makabuluhang pagbabago sa temporal na parirala. Ang “noong kasama pa ninyo ako” ay nauunawaan, ngunit inilalagay ang mga kausap bilang paksa at hindi gaanong tuwirang katumbas ng “habang ako ay kasama pa ninyo.” Ang “habang kasama ko pa kayo” ay mas natural sa modernong Filipino at malinaw na si Jesus ang siyang “kasama” ng mga alagad.
  terminology: Ang “Kautusan ni Moises,” “mga Propeta,” at “mga Awit” ay angkop na mga katawagan para sa νόμος Μωϋσέως, προφῆται, at ψαλμοί. Ang talababa tungkol sa saklaw ng “mga Awit” ay maingat at hindi naggigiit ng isang tiyak na pag-unawa. Ang “tungkol sa akin” ay tumpak para sa περὶ ἐμοῦ.
