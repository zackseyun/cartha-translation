translation:
  language: tl
  text: Ngunit ang kanilang mga mata ay pinigilan upang hindi nila siya makilala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Hinadlangan ang kanilang mga mata upang hindi nila siya makilala” o “Hindi sila pinahintulutang makilala siya.” Hindi tinutukoy sa Griyego kung sino o ano ang pumigil sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: 'Mahinang pang-ugnay ito na nagpapakita rito ng pagsalungat: naroon si Jesus, ngunit hindi nila siya nakilala.'
- source_word: οἱ δὲ ὀφθαλμοὶ αὐτῶν
  choice: ang kanilang mga mata
  rationale: Pinananatili ang kongkretong larawan ng mga mata sa Griyego sa halip na gawing abstraktong pahayag lamang tungkol sa kanilang kakayahang kumilala.
- source_word: ἐκρατοῦντο
  choice: pinigil
  rationale: Ipinahihiwatig ng pasibong anyo na ang kanilang mga mata ay hinawakan o hinadlangan, ngunit hindi tinutukoy kung sino o ano ang gumawa nito. Ang 'pinigil' ay natural at hindi nagdaragdag ng tahasang tagagawa.
- source_word: τοῦ μὴ ἐπιγνῶναι
  choice: upang hindi nila siya makilala
  rationale: Ipinapahayag ng articular infinitive na may μή ang layunin o kinalabasan ng pagpigil. Sa konteksto, ang ἐπιγινώσκω ay pagkilala sa pagkakakilanlan ni Jesus, hindi pangkalahatang pagkaalam.
- source_word: αὐτόν
  choice: siya
  rationale: Tumutukoy ang panghalip kay Jesus ayon sa konteksto.
theological_decisions:
- issue: Kung sino o ano ang pumigil sa kanilang pagkilala
  choice: 'Hindi pinangalanan ang tagagawa: ''pinigil ang kanilang mga mata.'''
  alternative: Tahasan itong iugnay sa Diyos, gaya ng 'Pinigil ng Diyos ang kanilang mga mata,' o gawing impersonal na 'hindi nila siya makilala.'
  rationale: Pasibo ang pandiwang Griyego at walang binanggit na tagagawa. Pinananatili ng salin ang kawalang-tiyak na ito at hindi ipinapasok ang isang teolohikal na paliwanag na hindi tahasang sinabi ng talata.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Pinanatili ang larawang 'kanilang mga mata' at ang pasibong diwa, habang ginamit ang sugnay na 'upang hindi nila siya makilala' para maging malinaw at natural sa Tagalog.
