  yaml_path: translation/nt/luke/024/040.yaml
  text: And after saying this[a], he showed them his hands and his feet.
translation:
  language: tl
  text: At pagkatapos niyang sabihin ito[a], ipinakita niya sa kanila ang kanyang mga kamay at mga paa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wala ang pangungusap na ito sa ilang manuskrito.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Payak na pang-ugnay na nagpapanatili sa daloy ng salaysay nang hindi nagdaragdag ng higit na temporal na diin.
- source_word: τοῦτο εἰπὼν
  choice: pagkatapos niyang sabihin ito
  rationale: Likas na ipinahihiwatig ng aorist participle na nauna ang pagsasalita sa pangunahing kilos; malinaw at natural ito sa makabagong Tagalog.
- source_word: ἔδειξεν
  choice: ipinakita niya
  rationale: Tuwirang ipinapahayag ang pagpapakita upang makita ng mga alagad.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Natural na katumbas ng di-tuwirang layon sa Tagalog.
- source_word: τὰς χεῖρας καὶ τοὺς πόδας
  choice: ang kanyang mga kamay at mga paa
  rationale: Bagaman pantukoy ang nasa Griyego, likas sa Tagalog ang panghalip na paari dahil sariling mga kamay at paa ni Jesus ang tinutukoy; hindi na kailangang ulitin ang “kanyang” bago ang “mga paa.”
theological_decisions:
- issue: Kalagayang tekstuwal ng buong pangungusap
  choice: Isinama sa pangunahing teksto at nilagyan ng talababa tungkol sa tekstuwal na variant
  alternative: Alisin ang buong pangungusap
  rationale: Nasa mga bracket ang buong talata sa SBLGNT, na nagpapahiwatig ng malaking pag-aalinlangan sa tekstuwal na katibayan. Dahil kasama ito sa ibinigay na tekstong pinagmulan, isinalin ito ngunit hayagang itinala ang pagkakaiba ng mga manuskrito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang payak na daloy ng salaysay at ang tekstuwal na pag-aalinlangan nang hindi ito nilulutas sa mismong salin.
