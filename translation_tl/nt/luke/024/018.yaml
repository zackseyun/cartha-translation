  text: ἀποκριθεὶς δὲ ⸂εἷς ὀνόματι⸃ Κλεοπᾶς εἶπεν πρὸς αὐτόν· Σὺ μόνος παροικεῖς Ἰερουσαλὴμ καὶ οὐκ ἔγνως τὰ γενόμενα ἐν αὐτῇ ἐν ταῖς ἡμέραις ταύταις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/018.yaml
  text: Then one of them[a], named Cleopas, answered and said to him, “Are you the only visitor to Jerusalem who does not know the things that have happened there in these days?”
translation:
  language: tl
  text: Sumagot ang isa sa kanila, na nagngangalang Cleopas, at sinabi sa kanya, “Ikaw lang ba ang dayuhang naglalagi sa Jerusalem[a] na hindi nakaaalam sa mga nangyari roon nitong mga araw?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ikaw lang ba ang naninirahan sa Jerusalem bilang isang tagalabas” o “ikaw lang ba ang pansamantalang naninirahan sa Jerusalem.” Ang pandiwang Griyego ay tumutukoy sa paninirahan o pananatili bilang tagalabas o pansamantalang residente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Sumagot
  rationale: Likas sa makabagong Tagalog bilang panimula sa tugon; hindi na kailangang isalin nang hiwalay ang mahinang pang-ugnay na δέ.
- source_word: εἷς ὀνόματι Κλεοπᾶς
  choice: ang isa sa kanila, na ang pangalan ay Cleopas
  rationale: Ang “sa kanila” ay nililinaw mula sa konteksto ng dalawang alagad, habang pinananatili ang diwa ng ὀνόματι.
- source_word: εἶπεν πρὸς αὐτόν
  choice: Sumagot ... [sa kanya]
  rationale: Sa Tagalog, sapat nang ihayag ng pandiwang “sumagot” at ng tuwirang pananalita ang pakikipag-usap sa kanya; ang tahasang pag-uulit ng “sinabi sa kanya” ay magiging mabigat.
- source_word: Σὺ μόνος
  choice: Ikaw lang ba
  rationale: Natural na tanong sa Tagalog at malinaw na naghahayag ng pagiging nag-iisa o bukod-tangi.
- source_word: παροικεῖς
  choice: dayuhan na nananatili
  rationale: Pinananatili nito ang diwa ng paninirahan o pansamantalang pananatili bilang tagalabas, sa halip na gawing simpleng “bumibisita.”
- source_word: Ἰερουσαλὴμ
  choice: Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lungsod sa Filipino.
- source_word: οὐκ ἔγνως
  choice: hindi nakaaalam
  rationale: Ipinahahayag ang kasalukuyang kalagayan ng kawalan ng kaalaman na bunga ng hindi pagkaalam sa nagdaang pangyayari.
- source_word: τὰ γενόμενα ἐν αὐτῇ
  choice: sa mga nangyari roon
  rationale: Natural na salin ng mga pangyayaring naganap sa Jerusalem.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: nitong mga araw
  rationale: Idyomatikong Filipino para sa mga araw na kasalukuyan o kalilipas lamang.
