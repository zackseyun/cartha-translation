translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dayuhan na nananatili” upang mapanatili ang lexical na diwa ng παροικεῖς nang hindi gumagamit ng lipas o teknikal na “nakikipamayan.”
