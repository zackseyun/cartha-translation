  text: ἀλλὰ καὶ γυναῖκές τινες ἐξ ἡμῶν ἐξέστησαν ἡμᾶς, γενόμεναι ⸀ὀρθριναὶ ἐπὶ τὸ μνημεῖον
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/022.yaml
  text: But also[a], some women from among us astonished us, having gone early in the morning to the tomb[b],
translation:
  language: tl
  text: Ngunit labis din kaming ginulat[a] ng ilang babaeng kasama namin. Maagang-maaga[b] silang nagpunta sa libingan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinamangha” o “nilito.” Ang pandiwang Griyego ay maaaring magpahiwatig ng matinding pagkagulat o pagkalito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nang magbukang-liwayway.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Ngunit ... din
  rationale: Pinananatili ang pagsalungat sa naunang pahayag at ang pagdaragdag ng isang di-inaasahang pangyayari.
- source_word: γυναῖκές τινες
  choice: ilang babae
  rationale: Likas at malinaw na katumbas sa modernong Tagalog ng di-tiyak na pangmaramihang parirala.
- source_word: ἐξ ἡμῶν
  choice: kasama namin
  rationale: Ipinahihiwatig na kabilang ang mga babae sa pangkat ng mga alagad, hindi lamang na nagmula sila sa mga nagsasalita.
- source_word: ἐξέστησαν ἡμᾶς
  choice: labis kaming ginulat
  rationale: Ipinapahayag ang matinding pagkagulat o pagkabigla nang hindi ipinapalagay kung naniwala o hindi naniwala ang mga alagad.
- source_word: γενόμεναι
  choice: silang nagpunta
  rationale: Sa ugnayan nito sa ὀρθριναὶ at ἐπὶ τὸ μνημεῖον, likas sa Tagalog na gawing hayag ang diwa ng pagpunta sa libingan.
- source_word: ὀρθριναὶ
  choice: maagang-maaga
  rationale: Natural na Tagalog para sa napakaagang oras sa umaga o pagbubukang-liwayway.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: sa libingan
  rationale: Bagaman karaniwang gamit sa Tagalog ang “sa” para sa lokasyon at direksiyon, nililinaw ng pandiwang “nagpunta” na patungo sa libingan ang kilos.
theological_decisions:
- issue: Lakas ng ἐξέστησαν sa ulat tungkol sa muling pagkabuhay
  choice: labis kaming ginulat
  alternative: namangha kami; nalito kami
  rationale: Pinananatili nito ang matinding reaksiyon at ang tensiyon ng salaysay nang hindi ipinapasok kung ang reaksiyon ay pananampalataya, pag-aalinlangan, o pagkalito lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Hinati sa dalawang pangungusap para maging natural ang daloy, habang pinananatili ang ugnayan ng mga sugnay at ang kuwit sa dulo dahil nagpapatuloy ang pangungusap sa susunod na talata.
