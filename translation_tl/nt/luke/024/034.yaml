  text: saying[a], “The Lord has truly been raised and has appeared to Simon!”
translation:
  language: tl
  text: na nagsasabi[a], “Tunay ngang binuhay muli ang Panginoon at nagpakita siya kay Simon!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “na sinasabi.” Ang “Tunay ngang binuhay muli ang Panginoon” ay maaari ring isaling “Talagang muling nabuhay ang Panginoon” o “Tunay ngang ibinangon ang Panginoon.” Balintiyak ang pandiwang Griyego; pinananatili ng pangunahing salin ang tinig na ito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντας
  choice: na nagsasabi
  rationale: Pangkasalukuyang pandiwaring maramihan na nakakabit sa mas malaking pangungusap; pinananatili ng “na nagsasabi” ang ugnayang ito nang hindi inuulit ang simuno.
- source_word: ὅτι
  choice: panimulang panipi
  rationale: Ipinakikilala rito ang mismong sinabi; mas likas sa modernong Tagalog ang tuwirang sipi kaysa tahasang isalin bilang “na.”
- source_word: ὄντως
  choice: tunay ngang
  rationale: Ipinahahayag nito nang mariin na totoo ang balita; likas at marangal sa Tagalog ang “tunay ngang.”
- source_word: ἠγέρθη
  choice: muling binuhay
  rationale: Aorist passive ng ἐγείρω. Pinananatili ng “muling binuhay” ang tinig na balintiyak at ang diwang may kumilos upang buhayin siya, sa halip na gawing tahasang aktibo ang Panginoon bilang simuno.
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Nananatili ang bigat ng κύριος bilang titulo ni Jesus sa konteksto ng muling pagkabuhay.
- source_word: καὶ
  choice: at
  rationale: Payak na pang-ugnay sa pahayag ng muling pagkabuhay at sa pagpapakita kay Simon.
- source_word: ὤφθη
  choice: nagpakita siya
  rationale: Bagaman anyong passive ang pandiwa, idiomatiko itong ginagamit para sa isang pagpapakita. Ang “nagpakita siya” ang pinakanatural na Tagalog at malinaw na ipinahahayag ang pagpapakita kay Simon.
- source_word: Σίμωνι
  choice: kay Simon
  rationale: Isinasalin ang datibo sa likas na pariralang Tagalog na “kay Simon,” nang hindi idinaragdag ang “Pedro,” na wala sa Griyego.
theological_decisions:
- issue: Tinig ng pandiwa ng muling pagkabuhay
  choice: muling binuhay
  alternative: muling nabuhay
  rationale: Balintiyak ang ἠγέρθη. Pinananatili ng pangunahing salin ang anyong iyon at hindi tahimik na inililipat sa aktibong/pansariling “muling nabuhay,” bagaman malapit at karaniwan ang alternatibong iyon sa Tagalog.
- issue: Pagpapakahulugan sa κύριος
  choice: Panginoon
  alternative: Guro
  rationale: Sa kontekstong ito, titulo ito para kay Jesus at may higit na bigat kaysa “Guro”; hindi dapat pahinain ang kristolohikal na gamit nito.
- issue: Anyo ng ὤφθη
  choice: nagpakita siya
  alternative: siya ay nakita
  rationale: Ang anyong passive ng ὁράω ay idiomatikong tumutukoy sa pagpapakita. Iniiwasan ng “nagpakita siya” ang matigas at posibleng mapanlinlang na “siya ay nakita,” nang hindi tinutukoy kung paano naganap ang pagpapakita.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tunay ngang” para sa mariing ὄντως at “muling binuhay” upang mapanatili ang balintiyak ng Griyego. Ang “na nagsasabi” ay sadyang nakaugnay sa naunang talata, gaya ng participle sa pinagmulang teksto.
