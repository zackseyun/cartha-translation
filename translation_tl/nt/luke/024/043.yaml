  text: καὶ λαβὼν ἐνώπιον αὐτῶν ἔφαγεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/043.yaml
  text: And taking it[a], he ate it before them.
translation:
  language: tl
  text: Kinuha niya iyon at kinain sa harap nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “kinuha” at “kinain” lamang ang sinabi; ipinahihiwatig mula sa naunang talata na ang tinutukoy ay ang piraso ng isda.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: at
  rationale: Karaniwang pang-ugnay na nagpapatuloy sa salaysay mula sa naunang talata, nang hindi nagdaragdag ng higit na temporal na diin.
- source_word: λαβὼν
  choice: Kinuha niya iyon
  rationale: Ang aorist participle ay nagpapahayag ng kilos na nauuna sa pangunahing pandiwa. Ginawang likas na sunod na pandiwa sa Tagalog; ang “iyon” ay ipinahiwatig ng naunang talata.
- source_word: ἐνώπιον αὐτῶν
  choice: sa harap nila
  rationale: Likas at malinaw na Tagalog para sa pagkilos na ginawa sa kanilang paningin o presensya.
- source_word: ἔφαγεν
  choice: kinain
  rationale: Ipinahahayag ang natapos na kilos ng pagkain. Sa Tagalog, ang pokus-sa-layon na “kinain” ay likas na tumutukoy sa ipinahiwatig na pagkaing kinuha.
theological_decisions:
- issue: Kung gagawing tahasan ang layon na ipinahiwatig sa Griyego
  choice: Idinagdag ang “iyon” pagkatapos ng “Kinuha,” habang ang parehong layon ay likas nang saklaw ng “kinain.”
  alternative: At pagkakuha, kumain siya sa harap nila.
  rationale: Walang tahasang layon sa Griyego, ngunit malinaw itong mababawi mula sa naunang talata. Pinananatiling malinaw sa Tagalog ang aktuwal na pagkain ni Jesus sa kanilang harapan nang hindi nagdaragdag ng paliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na payak, marangal, at natural. Ginamit ang tuwirang ayos ng salaysay at iniwasan ang mas lumang anyong “pagkakuha niya.”
