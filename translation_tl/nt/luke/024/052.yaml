id: LUK.24.52
reference: Luke 24:52
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ⸂[προσκυνήσαντες αὐτὸν]⸃ ὑπέστρεψαν εἰς Ἰερουσαλὴμ μετὰ χαρᾶς μεγάλης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/052.yaml
  text: And they[a], after worshiping him, returned to Jerusalem with great joy[b],
translation:
  language: tl
  text: At sila[a], pagkatapos siyang sambahin, ay bumalik sa Jerusalem na may malaking kagalakan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi kasama sa ilang manuskrito ang “pagkatapos siyang sambahin.”
    reason: textual_variant
  - marker: b
    text: O “pagkatapos yumukod sa kanya” o “pagkatapos magbigay-galang sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pag-uugnay sa naunang salaysay nang hindi nagdaragdag ng tiyak na temporal na diwa.
- source_word: αὐτοὶ
  choice: sila
  rationale: Ang hayag na panghalip ay likas na maisinasalin bilang “sila”; ang “sila mismo” ay labis na madiin sa kontekstong ito.
- source_word: προσκυνήσαντες αὐτόν
  choice: pagkatapos siyang sambahin
  rationale: Ipinahahayag nito ang kilos na nauna sa pangunahing pandiwa. Ang “sambahin” ay angkop sa konteksto ng muling nabuhay at itinaas na Jesus, habang itinatala sa talababa ang leksikal na saklaw na pagyukod o pagbibigay-galang.
- source_word: ὑπέστρεψαν
  choice: bumalik
  rationale: Tuwirang katumbas at natural sa makabagong salaysay sa Filipino.
- source_word: εἰς Ἰερουσαλήμ
  choice: sa Jerusalem
  rationale: Ang “sa Jerusalem” ang likas na Filipino para sa patutunguhan kapag pangalan ng lungsod ang kasunod.
- source_word: μετὰ χαρᾶς μεγάλης
  choice: na may malaking kagalakan
  rationale: Pinananatili ang pangngalang χαρά at ang pagpapatindi ng μεγάλη sa malinaw at marangal na Filipino.
theological_decisions:
- issue: Pagpapakahulugan sa προσκυνέω na nakatuon sa muling nabuhay na Jesus
  choice: sambahin
  alternative: yumukod sa kanya / magbigay-galang sa kanya
  rationale: Sa konteksto matapos ang muling pagkabuhay at pag-akyat, ang “sambahin” ang pinakamalamang na puwersa ng salita. Gayunman, hindi ikinukubli ang tunay na leksikal na lawak nito, kaya inilalahad ang ibang posibilidad sa talababa.
- issue: Tekstuwal na katiyakan ng προσκυνήσαντες αὐτόν
  choice: isama sa pangunahing teksto na may talababa
  alternative: alisin bilang pariralang wala sa ilang manuskrito
  rationale: Kasama ang parirala sa ibinigay na SBLGNT ngunit minarkahang hindi tiyak; kaya pinanatili ito at hayagang itinala ang baryanteng tekstuwal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahin” bilang natural at kontekstuwal na salin, habang ang mga tunay na tekstuwal at leksikal na alternatibo ay pinanatili sa mga talababa.
