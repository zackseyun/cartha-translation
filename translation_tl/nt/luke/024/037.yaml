  yaml_path: translation/nt/luke/024/037.yaml
  text: But being startled and becoming afraid[a], they thought they were seeing a spirit.
translation:
  language: tl
  text: Ngunit nagulat sila at natakot, at inakala nilang isang espiritu[a] ang nakikita nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “multo.” Ang salitang Griyego ay πνεῦμα, na mas literal na “espiritu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πτοηθέντες
  choice: nagulat
  rationale: Ipinahahayag ng aorist passive participle ang biglaang pagkagulat o pagkabigla. Natural sa modernong Tagalog ang “nagulat” at hindi nito inuulit o pinatitindi nang labis ang kasunod na tahasang pagkatakot.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagmamarka ito ng banayad na pagsalungat sa naunang biglang pagpapakita ni Jesus at sa naging reaksiyon ng mga alagad.
- source_word: ἔμφοβοι γενόμενοι
  choice: natakot
  rationale: Ang pariralang may γενόμενοι ay tumutukoy sa pagpasok nila sa kalagayan ng takot. Ang “natakot” ay natural at malinaw na naghahatid ng pagbabagong iyon.
- source_word: ἐδόκουν
  choice: inakala nilang
  rationale: Ipinapahayag ng imperfect na δοκέω ang kanilang palagay o pagkaunawa habang nakikita nila ang anyo. Ang “inakala” ay idiomatiko at malinaw na nagpapakitang mali ang kanilang pagkilala.
- source_word: πνεῦμα
  choice: espiritu
  rationale: Ang “espiritu” ang tuwirang katumbas ng πνεῦμα at pinananatili ang salita ng Griyego nang hindi ipinapasok ang mas makulturang mga pahiwatig ng “multo.”
- source_word: θεωρεῖν
  choice: ang nakikita nila
  rationale: Ang present infinitive ay nagpapahiwatig ng nagpapatuloy na pagkakita. Natural na naipapahayag ito sa Tagalog sa “ang nakikita nila.”
theological_decisions:
- issue: Pagbibigay-kahulugan sa πνεῦμα sa salaysay ng pagpapakita ng muling nabuhay na si Jesus
  choice: espiritu
  alternative: multo
  rationale: Mas malapit sa leksikal na anyo ng πνεῦμα ang “espiritu.” Pinananatili nito ang maling palagay ng mga alagad at ang tensiyon ng salaysay nang hindi agad nilulutas o dinaragdagan ng mga konotasyong-bayan ng “multo.”
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinagsama ang dalawang magkakasunod na reaksiyon bilang “nagulat sila at natakot” upang maging maayos sa Tagalog habang pinananatili ang pagkakaayos ng diwa sa Griyego. Ang marker na [a] ay inilagay pagkatapos ng sugnay ng takot, alinsunod sa ibinigay na consultation layer, bagaman ang talababa ay nagpapaliwanag sa “espiritu.”
