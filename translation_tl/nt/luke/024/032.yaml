id: LUK.24.32
reference: Luke 24:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπαν πρὸς ἀλλήλους· Οὐχὶ ἡ καρδία ἡμῶν καιομένη ἦν ⸂ἐν ἡμῖν⸃ ὡς ἐλάλει ἡμῖν ἐν τῇ ὁδῷ, ⸀ὡς διήνοιγεν ἡμῖν τὰς γραφάς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/032.yaml
  text: And they said to one another[a], “Was not our heart burning within us as he was speaking to us on the road[c][b], as he was opening the Scriptures to us?”
translation:
  language: tl
  text: Sinabi nila sa isa’t isa, “Hindi ba nag-aalab ang puso natin[a] sa loob natin habang nagsasalita siya sa atin sa daan[b], habang binubuksan niya sa atin ang mga Kasulatan[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “mga puso natin”; isahan sa Griyego: “ang puso natin.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “habang naglalakbay tayo.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “binubuksan ang mga Kasulatan,” ibig sabihin, nililinaw ang kahulugan ng mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ἀλλήλους
  choice: sa isa’t isa
  rationale: Likas na katumbas sa modernong Tagalog ng gantihang pananalita sa pagitan ng dalawang tao.
- source_word: Οὐχὶ
  choice: Hindi ba
  rationale: Nananatili ang retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: ἡ καρδία ἡμῶν
  choice: ang puso natin
  rationale: Pinananatili ang isahang bilang ng Griyego at likas din ito sa Tagalog bilang paglalarawan sa kanilang magkasamang panloob na karanasan.
- source_word: καιομένη
  choice: nag-aalab
  rationale: Tuwirang pinananatili ang metapora ng pagliyab at hindi ito nililimitahan sa damdamin, pagkaunawa, o karanasang espirituwal lamang.
- source_word: ἐν ἡμῖν
  choice: sa loob natin
  rationale: Malinaw at natural na paglalarawan ng panloob na karanasan.
- source_word: ἐλάλει
  choice: nagsasalita siya
  rationale: Ipinahihiwatig ng anyong Tagalog ang nagpapatuloy na kilos, ayon sa aspektong di-ganap ng Griyego.
- source_word: ἐν τῇ ὁδῷ
  choice: sa daan
  rationale: Kongkreto at maikli, at angkop sa paglalakbay patungong Emaus; maaari rin itong mangahulugang ‘habang naglalakbay.’
- source_word: διήνοιγεν
  choice: binubuksan niya sa atin
  rationale: Pinananatili ang metapora ng διανοίγω at ang nagpapatuloy na kilos, sa halip na agad itong gawing ‘ipinaliliwanag.’
- source_word: τὰς γραφάς
  choice: ang mga Kasulatan
  rationale: Karaniwan at wastong katawagan sa mga banal na kasulatang tinutukoy sa konteksto.
theological_decisions:
- issue: Metapora ng pusong nag-aalab
  choice: Pinanatili ang ‘nag-aalab ang puso natin.’
  alternative: ‘Matindi ang pagkantig sa damdamin natin’ o ‘naliwanagan tayo.’
  rationale: Hindi tahasang tinutukoy ng teksto kung ang karanasan ay emosyonal, espirituwal, o pangkaisipan; pinananatili ng metapora ang saklaw at tensiyong ito.
- issue: Pagbubukas ng mga Kasulatan
  choice: Pinanatili ang metaporang ‘binubuksan niya sa atin ang mga Kasulatan.’
  alternative: ‘ipinaliliwanag niya sa atin ang mga Kasulatan.’
  rationale: Ipinahihiwatig sa konteksto ang paglilinaw ng kahulugan, ngunit ang tuwirang larawan ng orihinal ay hindi kailangang alisin sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang “isa’t isa,” “nag-aalab,” at “mga Kasulatan” bilang mga pamilyar na anyo; pinanatili ang mga metapora at ang aspektong nagpapatuloy ng dalawang pandiwang nasa imperfect sa Griyego.
