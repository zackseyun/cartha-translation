  source_fidelity: 'Tapat ang salin sa Griyego: naipapahayag ang gantihang pagsasalita, ang retorikal na tanong na umaasang oo ang sagot, ang isahang «puso», ang metaporang «nag-aalab», ang «sa loob natin», at ang dalawang kilos na nagpapatuloy sa daan at sa pagbubukas ng mga Kasulatan. Hindi nito ipinipilit kung anong uri ng karanasan ang inilalarawan ng nag-aalab na puso.'
  naturalness: Likas at malinaw ang modernong Filipino Tagalog. Ang «sa isa’t isa», «Hindi ba», «sa daan», at «mga Kasulatan» ay angkop sa marangal ngunit di-makalumang rehistro. Ang pag-uulit ng «habang» ay maayos na naghahanay sa dalawang di-ganap na kilos ng Griyego.
  terminology: Ang «mga Kasulatan» ay wastong katawagan para sa τὰς γραφάς sa kontekstong ito. Ang «nag-aalab ang puso natin» at «binubuksan niya ... ang mga Kasulatan» ay angkop na pinananatiling metapora at hindi nagpapasok ng doktrinal na pagpapakahulugan. Tama at malinaw ang mga anchor na [a], [b], at [c].
