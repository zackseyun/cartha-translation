  text: ⸂οὐκ ἔστιν ὧδε, ἀλλὰ ἠγέρθη.⸃ μνήσθητε ὡς ἐλάλησεν ὑμῖν ἔτι ὢν ἐν τῇ Γαλιλαίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/006.yaml
  text: He is not here[a], but has been raised. Remember how he spoke to you while he was still in Galilee,
translation:
  language: tl
  text: Wala siya rito, kundi ibinangon na siya.[a] Alalahanin ninyo ang sinabi niya sa inyo noong nasa Galilea pa siya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “bumangon na siya” o “nabuhay na siya.” Balintiyak ang pandiwang Griyego (“ibinangon siya” o “binangon siya”), ngunit madalas itong isalin sa paraang walang tahasang gumaganap upang ipahayag ang pangyayari ng pagkabuhay-muli.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: Wala siya rito
  rationale: Likas at malinaw na lokatibong pahayag sa Tagalog; ipinahihiwatig ng konteksto na si Jesus ang paksa kahit walang tahasang paksa sa Griyego.
- source_word: ἀλλὰ
  choice: kundi
  rationale: 'Ang “kundi” angkop sa pagtutuwid at mariing pagsalungat sa naunang negatibong pahayag: wala siya rito, kundi binuhay na siya.'
- source_word: ἠγέρθη
  choice: binuhay na siya
  rationale: Pinananatili ang balintiyak na anyo ng aorist passive na ἐγείρω at ang pahiwatig na may kumilos upang buhayin siya. Ang “na” ay natural na nagpapahayag ng natapos na pangyayaring may kasalukuyang kabuluhan.
- source_word: μνήσθητε
  choice: Alalahanin ninyo
  rationale: Direkta at marangal na pautos na natural sa modernong Tagalog; tahasang ipinakikita ng “ninyo” ang maramihang kausap.
- source_word: ὡς
  choice: kung paano
  rationale: Pinananatili ang paraan o kalagayan ng pagsasalita nang hindi pinapaliit ito sa nilalaman lamang ng sinabi.
- source_word: ἐλάλησεν ὑμῖν
  choice: siya nagsalita sa inyo
  rationale: Malapit sa payak na kahulugan ng λαλέω at hindi labis na tinutukoy kung ano ang nilalaman ng sinabi.
- source_word: ἔτι ὢν
  choice: noong ... pa siya
  rationale: Natural na temporal na parirala sa Tagalog na pinananatili ang diwa ng ἔτι, “nasa ... pa.”
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: nasa Galilea
  rationale: Karaniwang lokatibong anyo sa Tagalog at kinikilala ang Galilea bilang pangalan ng lugar.
theological_decisions:
- issue: Paglalarawan sa pandiwa ng muling pagkabuhay na ἠγέρθη
  choice: binuhay na siya
  alternative: nabuhay na siya / bumangon na siya
  rationale: Ang “binuhay na siya” ay nagpapanatili sa balintiyak na tinig ng Griyego at sa posibleng pahiwatig ng pagkilos ng Diyos, nang hindi tahasang dinaragdagan ang teksto ng pangalan ng kumilos. Ang mga alternatibo ay mas intransitibo at maaaring matakpan ang balintiyak na anyo.
translation_notes:
  register: Modernong Filipino Tagalog na simple, dignified, at angkop sa pampublikong pagbasa. Ginamit ang “siya” sa halip na “Siya” ayon sa karaniwang modernong ortograpiya, at pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa susunod na talata.
