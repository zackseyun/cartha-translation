  source_fidelity: Ang “Wala siya rito” ay tumpak para sa οὐκ ἔστιν ὧδε. Gayunman, ang “binuhay na siya” ay maaaring maunawaan bilang simpleng pagbuhay o pagpapasigla at hindi ang karaniwang pahayag ng pagkabuhay-muli. Ang “ibinangon na siya” ay mas malinaw na katumbas ng ἠγέρθη at pinananatili ang balintiyak na tinig. Sa konteksto ng kasunod na nilalaman ng sinabi ni Jesus, ang ὡς ἐλάλησεν ay mas natural at sapat na naipapahayag bilang “ang sinabi niya,” sa halip na tila tumutukoy sa paraan ng kanyang pagsasalita.
  naturalness: Natural at angkop sa modernong Filipino Tagalog ang binagong pananalita. Ang “Alalahanin ninyo ang sinabi niya sa inyo” ay mas idiomatiko kaysa “kung paano siya nagsalita sa inyo,” habang pinananatili ang utos at ang maramihang kausap. Nananatili ang kuwit dahil hindi pa tapos ang pangungusap.
  terminology: Pinananatili ang Galilea bilang pangalang heograpiko. Ang “ibinangon na siya” ay isang malinaw at marangal na balintiyak na pahayag ng pagkabuhay-muli nang hindi tahasang nagdadagdag ng gumaganap.
