  text: καὶ εἶπεν αὐτοῖς· Ποῖα; οἱ δὲ εἶπαν αὐτῷ· Τὰ περὶ Ἰησοῦ τοῦ ⸀Ναζαρηνοῦ, ὃς ἐγένετο ἀνὴρ προφήτης δυνατὸς ἐν ἔργῳ καὶ λόγῳ ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/019.yaml
  text: And he said to them, “What things?” And they said to him, “The things concerning Jesus the Nazarene, who became a man, a prophet mighty in deed and word before God and all the people,”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Anong mga bagay?” Sumagot sila sa kanya, “Ang mga bagay tungkol kay Jesus na Nazareno,[a] na naging isang lalaking propeta,[b] makapangyarihan sa gawa at salita sa harap ng Diyos at ng buong bayan,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Jesus na taga-Nazaret”; sa Griyego, “Jesus na Nazareno.”
    reason: lexical_alternative
  - marker: b
    text: O “na isang lalaki, isang propeta”; ang pandiwa ay maaari ring isaling mas idiomatiko bilang “ay,” bagaman mas literal itong “naging.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῖα
  choice: Anong mga pangyayari?
  rationale: Ang panghalip ay maramihang neuter at tumutukoy sa mga bagay na pinag-uusapan; ang “mga pangyayari” ay likas sa Filipino at pinananatili ang maramihang diwa.
- source_word: Τὰ περὶ Ἰησοῦ
  choice: Ang tungkol kay Jesus
  rationale: Tuwirang inilalarawan ang mga bagay na may kinalaman kay Jesus nang hindi tahasang dinaragdagan ang Griyego ng pandiwang “nangyari.”
- source_word: Ναζαρηνοῦ
  choice: na Nazareno
  rationale: Pinananatili ang anyong panturing ng Griyego; ang “taga-Nazaret” ay posibleng mas idiomatiko ngunit higit na nagpapaliwanag.
- source_word: ἐγένετο
  choice: naging
  rationale: Pinananatili ang verbal na puwersa ng γίνομαι, sa halip na lubusang gawing simpleng “ay,” habang nililinaw sa talababa ang idiomatikong alternatibo.
- source_word: ἀνὴρ προφήτης
  choice: isang lalaking propeta
  rationale: Kapwa pinananatili ang ἀνήρ at προφήτης. Sa Filipino, mas natural ang “lalaking propeta” kaysa sa apposisyong “isang lalaki, isang propeta,” at hindi nito inaalis ang tahasang pagtukoy sa pagkalalaki.
- source_word: δυνατὸς ἐν ἔργῳ καὶ λόγῳ
  choice: makapangyarihan sa gawa at salita
  rationale: Ang “makapangyarihan” ay angkop sa lakas o bisa, at ang “gawa at salita” ay tumpak at likas na magkaparis sa mataas ngunit malinaw na rehistro.
- source_word: ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ
  choice: sa harap ng Diyos at ng buong bayan
  rationale: Ipinahahayag ang pagiging lantad sa paningin o presensya ng Diyos at ng buong sambayanan; ang “buong bayan” ay natural na katumbas ng παντὸς τοῦ λαοῦ.
theological_decisions:
- issue: Pagpapanatili sa ἀνήρ sa paglalarawan kay Jesus
  choice: isang lalaking propeta
  alternative: isang propeta
  rationale: Tahasan sa Griyego ang ἀνήρ, kaya hindi ito inalis. Ang parirala ay paglalarawan ng mga nagsasalita sa salaysay at hindi dapat palawakin o paliitin upang lutasin ang mga usaping Kristolohikal.
- issue: Pakahulugan sa ἐγένετο
  choice: naging
  alternative: ay isang lalaking propeta
  rationale: Pinananatili ng “naging” ang leksikal na puwersa ng pandiwa at ang posibleng tensiyon nito. Gayunman, kinikilala sa talababa na sa kontekstong ito maaari itong idiomatikong mangahulugang “ay.”
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinili ang “Anong mga pangyayari?” upang maging natural sa usapan, samantalang pinanatili ang mas pormal na “sa harap ng Diyos” at ang biblikal na pares na “gawa at salita.”
