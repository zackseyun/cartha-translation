  text: And they were talking with one another about all these things that had happened[a].
translation:
  language: tl
  text: At nag-uusap sila tungkol sa lahat ng nangyaring ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “At nag-uusap sila tungkol sa lahat ng pangyayaring naganap na ito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Karaniwang pang-ugnay sa salaysay; pinananatili nito ang tuwirang kaugnayan sa naunang pangyayari nang hindi nagdaragdag ng di-tiyak na panahong diwa.
- source_word: αὐτοὶ
  choice: sila
  rationale: Hayag ang panghalip sa Griyego, ngunit likas itong isinasalin bilang payak na simuno sa Tagalog; hindi kailangang dagdagan ng “mismo” dahil mahina lamang ang diin dito.
- source_word: ὡμίλουν
  choice: nag-uusap
  rationale: Ipinahihiwatig ng aspektong imperfect ang patuloy na kilos noon. Ang “nag-uusap” ay natural sa makabagong Tagalog at angkop sa kapwa-palitang pag-uusap.
- source_word: πρὸς ἀλλήλους
  choice: nag-uusap sila
  rationale: Ang kapwa-palitang diwa ng “sa isa’t isa” ay likas nang nakapaloob sa pandiwang Tagalog na “nag-uusap,” kaya hindi na kailangang ulitin nang tahasan.
- source_word: περὶ πάντων
  choice: tungkol sa lahat
  rationale: Ipinakikilala ng περί ang paksa ng pag-uusap, at malinaw na sinasaklaw ng πάντων ang kabuuan ng mga tinutukoy na pangyayari.
- source_word: τῶν συμβεβηκότων τούτων
  choice: ng nangyaring ito
  rationale: Ipinapahayag ng perfect participle ang mga naganap nang bagay na mahalaga pa rin sa kasalukuyang tagpo. Maikli, natural, at malinaw ang “mga nangyaring ito” sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “nag-uusap” upang maipakita ang nagpapatuloy at kapwa-palitang pag-uusap, at iniwasan ang mas pormal o mabigat na “nagtatalakayan” dahil hindi iyon kinakailangan ng ὁμιλέω sa kontekstong ito.
