base_translation:
  language: en
  yaml_path: translation/nt/luke/024/017.yaml
  text: And he said to them[a], “What are these words that you are exchanging with one another as you walk?” And they stood still[b], looking sad.
translation:
  language: tl
  text: Sinabi niya sa kanila, “Ano ang mga salitang ito na pinag-uusapan ninyo sa isa’t isa habang naglalakad?” At tumigil sila, malulungkot ang mukha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτούς
  choice: Sinabi niya sa kanila
  rationale: Pinananatili ng “sinabi” ang karaniwang kahulugan ng λέγω, kahit patanong ang kasunod na sinabi; hindi kailangang gawing tahasang “tinanong.” Hindi na isinalin nang hiwalay ang banayad na pang-ugnay na δέ upang maging natural ang daloy sa Tagalog.
- source_word: Τίνες οἱ λόγοι οὗτοι οὓς ἀντιβάλλετε πρὸς ἀλλήλους
  choice: Ano itong pinag-uusapan ninyo
  rationale: Sa kontekstong ito, ang λόγοι ay tumutukoy sa usapan o mga bagay na pinag-uusapan, at ang ἀντιβάλλετε ay nagpapahiwatig ng palitan ng salita. Likas at malinaw sa modernong Tagalog ang “pinag-uusapan ninyo,” habang nananatili ang diwa ng magkabilang tugunan.
- source_word: περιπατοῦντες
  choice: habang naglalakad
  rationale: Ipinahihiwatig ng participle na kasabay ng paglalakad ang pag-uusap.
- source_word: ἐστάθησαν
  choice: tumigil sila
  rationale: Ang anyo ng ἵστημι rito ay nangangahulugang huminto sila sa paglalakad; mas natural sa Tagalog ang “tumigil” kaysa “tumayo nang hindi gumagalaw.”
- source_word: σκυθρωποί
  choice: malulungkot ang mukha
  rationale: Tumutukoy ang σκυθρωποί sa nakikitang malungkot o mabigat na anyo ng mukha. Ang pariralang ito ay malinaw at dignidad ang tono sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at may dignidad. Ginamit ang karaniwang “kayo/ninyo” para sa maramihang kausap at iniwasan ang sobrang literal na “mga salitang ipinagpapalitan,” na magiging matigas sa Tagalog.
