  text: ἡμεῖς δὲ ἠλπίζομεν ὅτι αὐτός ἐστιν ὁ μέλλων λυτροῦσθαι τὸν Ἰσραήλ· ἀλλά γε ⸀καὶ σὺν πᾶσιν τούτοις τρίτην ταύτην ἡμέραν ⸀ἄγει ἀφ’ οὗ ταῦτα ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/021.yaml
  text: But we were hoping that he is the one who is about to redeem Israel[a]. Yet besides all this[b], it is now the third day since these things happened.
translation:
  language: tl
  text: Ngunit umaasa kami noon na siya ang siyang tutubos sa Israel.[a][b] Ngunit, bukod pa sa lahat ng ito, ikatlong araw na ngayon mula nang mangyari ang mga bagay na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “siya ang siyang magtutubos sa Israel.” Nananatiling nasa kasalukuyang panahunan ang pandiwang Griego na “ay” sa loob ng nilalaman ng kanilang dating pag-asa.
    reason: alternative_reading
  - marker: b
    text: Ang “tutubos sa Israel” ay maaaring tumukoy sa malawak na inaasahang pagliligtas ng Mesiyas. Hindi tinutukoy ng teksto kung pampolitikang pagpapalaya, espirituwal na kaligtasan, o kapuwa ang nasa isip nila.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Ngunit ... kami
  rationale: Ipinahihiwatig ng δέ ang pagsalungat sa naunang ulat, at pinananatili ng tahasang “kami” ang diin ng ἡμεῖς.
- source_word: ἠλπίζομεν
  choice: umaasa kami noon
  rationale: Ang imperpektong aspekto ay nagpapakita ng nagpapatuloy na pag-asa sa nakaraan na ngayo'y nabigo; natural itong naipahahayag sa Tagalog sa pamamagitan ng “umaasa ... noon.”
- source_word: ὅτι αὐτός ἐστιν ὁ μέλλων λυτροῦσθαι
  choice: na siya ang siyang tutubos
  rationale: Pinananatili ng “siya ang siyang” ang mariing pagkakakilanlan, habang natural na inihahatid ng “tutubos” ang inaasahang pagkilos sa hinaharap nang hindi sapilitang nilulutas ang pambalarilang tensiyon ng kasalukuyang ἐστιν sa loob ng nakaraang pag-asa.
- source_word: λυτροῦσθαι
  choice: tutubos
  rationale: Ang “tubos” ay nagpapanatili sa diwa ng pagpapalaya o pagtubos at sa mesiyanikong pahiwatig ng λυτρόομαι.
- source_word: τὸν Ἰσραήλ
  choice: sa Israel
  rationale: Tuwirang tinutukoy ang Israel bilang kabuuang bayang tipan; hindi dinaragdagan ang teksto ng mas makitid na paliwanag.
- source_word: ἀλλά γε καὶ σὺν πᾶσιν τούτοις
  choice: Bukod pa sa lahat ng ito
  rationale: Natural nitong ipinahahayag ang pinagsama at nagpapabigat na diwa ng karagdagang pangyayari.
- source_word: τρίτην ταύτην ἡμέραν ἄγει
  choice: ikatlong araw na ngayon
  rationale: Ang ἄγει ay idyomatikong tumutukoy sa pag-abot o paglipas ng panahon; malinaw at natural ang katumbas na Tagalog.
- source_word: ἀφ’ οὗ ταῦτα ἐγένετο
  choice: mula nang mangyari ang mga bagay na ito
  rationale: Tumpak nitong ipinakikita ang panahong pinagsimulan ng pagbibilang.
theological_decisions:
- issue: Saklaw ng mesiyanikong pag-asang “tutubos sa Israel”
  choice: Panatilihin ang “tutubos sa Israel” nang hindi tinutukoy kung pampolitika, espirituwal, o kapuwa.
  alternative: “magpapalaya sa Israel” o “magliligtas sa Israel” na maaaring magpakitid sa kahulugan
  rationale: Malawak ang maaaring saklaw ng λυτρόομαι sa kontekstong ito. Hindi nililinaw ng teksto ang paraan ng pagtubos, kaya pinananatili ang teolohikal na tensiyon.
- issue: Kasalukuyang ἐστιν sa loob ng nakaraang ἠλπίζομεν
  choice: Gamitin ang likas na Tagalog na “umaasa kami noon na siya ang siyang tutubos,” at ilahad sa talababa ang pambalarilang tensiyon.
  alternative: “umaasa kami noon na siya ang tutubos” o mas tahasang “siya ang siyang malapit nang tumubos”
  rationale: Walang tuwirang pagtutumbas sa Tagalog na hindi nagiging pilit. Pinananatili ng salin ang nilalaman ng kanilang inaasahan at hindi ipinapahayag na tiyak na lubos na tinalikuran na nila ang proposisyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “umaasa kami noon” upang natural na maipakita ang nagpapatuloy na dating pag-asa, at iniwasan ang labis na literal ngunit alanganing “malapit nang tumubos.” Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
