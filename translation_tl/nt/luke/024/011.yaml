  text: καὶ ἐφάνησαν ἐνώπιον αὐτῶν ὡσεὶ λῆρος τὰ ῥήματα ⸀ταῦτα, καὶ ἠπίστουν αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/011.yaml
  text: And these words seemed like nonsense to them, and they did not believe the women.
translation:
  language: tl
  text: At para sa kanila, ang mga salitang ito ay tila walang katuturan[a], at hindi sila naniwala sa mga babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “parang kuwentong walang saysay,” o “parang pananalita ng isang nagdedeliryo.” Ang salitang Griyego na λῆρος ay tumutukoy sa pananalitang itinuturing na walang saysay o absurdo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάνησαν
  choice: ay tila
  rationale: Sa evaluative construction na may ὡσεὶ λῆρος, ipinahihiwatig ng pandiwa kung paano nila itinuring ang sinabi, hindi ang literal na pagpapakita nito.
- source_word: ἐνώπιον αὐτῶν
  choice: para sa kanila
  rationale: Natural na Filipino para sa literal na “sa harap nila” kapag pananaw o pagtatasa ang tinutukoy.
- source_word: ὡσεὶ λῆρος
  choice: walang katuturan
  rationale: Malinaw at likas na modernong paglalarawan sa pananalitang itinuring na walang saysay, absurdo, o tulad ng deliryo; pinananatili ng “tila” ang paghahambing.
- source_word: τὰ ῥήματα ταῦτα
  choice: ang mga salitang ito
  rationale: Tuwirang salin ng demonstrative phrase at hindi nito pinapalitan ng mas interpretibong “ulat” o “kuwento.”
- source_word: ἠπίστουν
  choice: hindi sila naniwala
  rationale: Natural na ipinahahayag ang patuloy na di-paniniwala sa nakaraan nang hindi idinaragdag ang ideya ng sadyang pagtangging maniwala.
- source_word: αὐταῖς
  choice: sa mga babae
  rationale: Ang panghalip ay pambabaeng maramihan at tumutukoy sa mga babaeng binanggit sa naunang konteksto; nililinaw ang tinutukoy upang maiwasan ang malabong “sa kanila.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “walang katuturan” bilang pangkaraniwang pahayag, habang inilagay sa talababa ang mas matitingkad na posibleng kahulugan ng λῆρος.
