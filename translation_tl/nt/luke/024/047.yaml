  text: καὶ κηρυχθῆναι ἐπὶ τῷ ὀνόματι αὐτοῦ μετάνοιαν ⸀καὶ ἄφεσιν ἁμαρτιῶν εἰς πάντα τὰ ἔθνη— ⸀ἀρξάμενοι ἀπὸ Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/047.yaml
  text: and that repentance for the forgiveness of sins should be proclaimed in his name to all the nations[b][a], beginning from Jerusalem.
translation:
  language: tl
  text: at ipahayag sa kanyang pangalan ang pagsisisi para sa kapatawaran ng mga kasalanan[a] sa lahat ng mga bansa[b], simula sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pagsisisi at ang kapatawaran ng mga kasalanan”; maaaring unawain ang Griyego bilang dalawang magkaugnay na bahagi ng mensaheng ipinahahayag.
    reason: alternative_reading
  - marker: b
    text: Ang salitang Griyego na isinaling “mga bansa” ay maaari ring tumukoy sa “mga Hentil” sa ilang konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθῆναι
  choice: ipahayag
  rationale: Ipinahahayag ng pandiwang Griyego ang hayagang pagbabalita; natural at malinaw sa makabagong Filipino ang “ipahayag.”
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: sa kanyang pangalan
  rationale: Pinananatili nito ang idyomang tumutukoy sa awtoridad at saligan na nasa persona ni Jesus, nang hindi nililimitahan ang kahulugan.
- source_word: μετάνοιαν
  choice: pagsisisi
  rationale: Karaniwan at dignidad na salin ito ng μετάνοια, na nagpapahiwatig ng pagtalikod at pagbabagong-loob, hindi lamang pagbabago ng isip.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: kapatawaran ng mga kasalanan
  rationale: Sa kontekstong ito, ang ἄφεσις ay tumutukoy sa pagpapatawad o pagpapalaya mula sa mga kasalanan.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: sa lahat ng bansa
  rationale: Pinananatili ang pandaigdig na saklaw ng atas at hindi pinakikitid ang ἔθνη sa mga Hentil lamang.
- source_word: ἀρξάμενοι ἀπὸ Ἰερουσαλήμ
  choice: simula sa Jerusalem
  rationale: Natural na Filipino ito para sa panimulang lugar na ipinahihiwatig ng ἀπό.
theological_decisions:
- issue: Ugnayan ng pagsisisi at kapatawaran sa mensaheng ipinahahayag
  choice: “pagsisisi para sa kapatawaran ng mga kasalanan”
  alternative: “pagsisisi at kapatawaran ng mga kasalanan”
  rationale: Ipinakikita ng pangunahing salin ang malapit na ugnayan ng dalawang ideya nang hindi nagtatakda ng mas detalyadong pagkakasunud-sunod ng kaligtasan; inilalahad sa talababa ang posibleng koordinadong pagbasa.
- issue: Kahulugan ng ἔθνη
  choice: “lahat ng bansa”
  alternative: “lahat ng mga Hentil”
  rationale: Mas angkop sa konteksto ng pandaigdig na atas ang “lahat ng bansa,” habang kinikilala sa talababa na maaari ring mangahulugan ang salita ng mga Hentil.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipahayag” sa halip na mas makitid na “ipangaral,” at pinanatili sa talababa ang tunay na sintaktikong kalabuan ng ugnayan ng pagsisisi at kapatawaran.
