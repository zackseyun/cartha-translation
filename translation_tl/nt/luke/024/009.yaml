reference: Luke 24:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψασαι ἀπὸ τοῦ μνημείου ἀπήγγειλαν ταῦτα πάντα τοῖς ἕνδεκα καὶ πᾶσιν τοῖς λοιποῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/009.yaml
  text: And returning from the tomb, they reported all these things to the eleven and to all the rest.
translation:
  language: tl
  text: At pagbalik nila mula sa libingan, ibinalita nila ang lahat ng ito sa labing-isa at sa lahat ng iba pa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: pagbalik nila
  rationale: Ang aorist active participle na pambabaeng maramihan ay tumutukoy sa mga babaeng binanggit sa naunang konteksto. Likas sa Tagalog ang sugnay na “pagbalik nila” at napananatili nito ang ugnayan sa pangunahing pandiwang “ibinalita.”
- source_word: μνημείου
  choice: libingan
  rationale: Sa konteksto ng muling pagkabuhay, ang “libingan” ang malinaw, karaniwan, at marangal na katumbas para sa pinaglibingan kay Jesus.
- source_word: ἀπήγγειλαν
  choice: ibinalita nila
  rationale: Ipinahihiwatig ng pandiwa ang paghahatid o pag-uulat ng nalaman. Ang “ibinalita” ay likas sa salaysay at mas tiyak kaysa simpleng “sinabi,” nang hindi nagpapahiwatig ng pampublikong pagpapahayag.
- source_word: ταῦτα πάντα
  choice: ang lahat ng ito
  rationale: Pinananatili nito kapwa ang pantukoy na “ito” at ang saklaw ng πάντα, sa natural na ayos ng modernong Tagalog.
- source_word: τοῖς ἕνδεκα
  choice: sa labing-isa
  rationale: Tapat ito sa nakaugaliang katawagan ng Griyego nang hindi idinaragdag ang pangngalang “mga apostol,” na wala sa teksto.
- source_word: πᾶσιν τοῖς λοιποῖς
  choice: sa lahat ng iba pa
  rationale: Malinaw na itinatangi nito ang labing-isa mula sa mas malawak na pangkat at pinananatili ang kabuuang saklaw ng πᾶσιν.
theological_decisions:
- issue: Tinutukoy ng pambabaeng participle at maramihang pandiwa
  choice: Ang “nila” ay tumutukoy sa mga babaeng nanggaling sa libingan ayon sa naunang konteksto.
  alternative: Tahasan silang tawaging “mga babae.”
  rationale: Malinaw sa anyong pambabaeng maramihan ng Griyego ang tinutukoy, ngunit hindi kailangang idagdag sa talata ang pangngalang “mga babae”; sapat ang likas na panghalip na nakaugnay sa konteksto.
- issue: Katawagan sa pangkat ng mga apostol
  choice: “sa labing-isa” nang walang dagdag na paliwanag
  alternative: “sa labing-isang apostol”
  rationale: Ang teksto ay nagsasabi lamang ng “ang labing-isa.” Ang pagdaragdag ng “apostol” ay makatutulong sa paglilinaw ngunit lalampas sa mismong pananalita ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “pagbalik nila” sa halip na mas mabigat na “nang makabalik na sila,” at “ibinalita” upang maipahayag ang paghahatid ng ulat sa paraang angkop sa salaysay.
