  text: ὅπως τε παρέδωκαν αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ἄρχοντες ἡμῶν εἰς κρίμα θανάτου καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/020.yaml
  text: and how our chief priests and rulers handed him over to a sentence of death and crucified him[a][b].
translation:
  language: tl
  text: at kung paanong isinuko siya ng aming mga punong pari at mga pinuno upang hatulan ng kamatayan[a] at ipinako siya sa krus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa hatol na kamatayan”; o, “upang mahatulan ng kamatayan.”
    reason: lexical_alternative
  - marker: b
    text: O, “ipinagawa nila ang pagpapako sa kanya sa krus,” na ginagawang hayag na sila ang may pananagutan sa pagpapapatay kahit mga awtoridad ng Roma ang nagsagawa ng pagbitay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως τε
  choice: at kung paanong
  rationale: Ipinagpapatuloy ng τε ang naunang salaysay, habang ipinakikilala ng ὅπως ang paraan o pangyayari na isinasalaysay. Likas sa Filipino ang “at kung paanong” sa ganitong dugtong na pangungusap.
- source_word: παρέδωκαν
  choice: isinuko
  rationale: Ipinahihiwatig ng παραδίδωμι ang pagbibigay o pagsasalin ng isang tao sa kapangyarihan ng iba. Ang “isinuko” ay malinaw at natural sa kontekstong panghukuman at hindi nagdaragdag ng mas makitid na diwang “ipinagkanulo.”
- source_word: οἱ ἀρχιερεῖς
  choice: mga punong pari
  rationale: Tumutukoy ang maramihang ἀρχιερεῖς sa pangunahing pangkat ng mga pinunong pari, hindi sa maraming kasalukuyang mataas na pari. Ang “mga punong pari” ang karaniwan at tumpak na katawagan.
- source_word: οἱ ἄρχοντες ἡμῶν
  choice: aming mga pinuno
  rationale: Ang ἄρχοντες ay mga taong may kapangyarihang mamuno. Pinananatili ng “aming” ang pagkakaugnay ng mga nagsasalita sa kanilang sambayanan.
- source_word: εἰς κρίμα θανάτου
  choice: upang hatulan ng kamatayan
  rationale: Maaaring tumukoy ang κρίμα sa hatol, pasiya, o sentensiya. Malinaw at likas sa Filipino ang pangunahing salin at pinananatili nito ang diwang panghukuman; inilalahad sa talababa ang mas pormal na mga anyo.
- source_word: ἐσταύρωσαν
  choice: ipinako siya sa krus
  rationale: Aktibo ang pandiwa at tuwirang iniuugnay sa mga punong pari at pinuno ang pananagutan sa pagpapako. Hindi nililinaw sa pangunahing teksto kung sila mismo ang pisikal na nagsagawa nito o ipinagawa nila ito.
theological_decisions:
- issue: Ang gumaganap at nananagot sa pagpatay kay Jesus
  choice: Pinanatili ang tuwirang pahayag na “ipinako siya sa krus,” gaya ng aktibong pandiwang Griyego.
  alternative: “ipinapako nila siya sa krus” o “ipinagawa nila ang pagpapako sa kanya sa krus”
  rationale: Tuwirang itinuturing ng Griyego na simuno ng ἐσταύρωσαν ang mga punong pari at mga pinuno. Pinananatili nito ang bigat ng kanilang pananagutan nang hindi ipinipilit na sila mismo ang mga pisikal na tagapagpatupad.
- issue: Kahulugan ng εἰς κρίμα θανάτου
  choice: “upang hatulan ng kamatayan”
  alternative: “sa hatol na kamatayan” o “upang mahatulan ng kamatayan”
  rationale: Pinananatili ng pangunahing salin ang layuning panghukuman sa natural na Filipino, samantalang kinikilala ng talababa ang posibleng diin sa hatol o sentensiya mismo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “isinuko” para sa kontekstong panghukuman, “mga punong pari” bilang kinikilalang katawagan sa pangkat ng pamunuan, at “ipinako sa krus” bilang natural na salin na nagpapanatili sa tuwirang pananagutan sa Griyego.
