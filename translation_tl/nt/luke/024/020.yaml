  source_fidelity: 'Tapat ang pangunahing salin sa daloy at mga pangunahing elemento ng Griyego: ang ‘at kung paanong’ ay angkop sa ὅπως τε; ‘isinuko’ sa παρέδωκαν; ‘aming mga punong pari at mga pinuno’ ay pinananatili ang mga simuno at ang ἡμῶν; at malinaw na naipapahayag ang hatol na kamatayan at pagpapako sa krus. Ang ‘ipinako siya sa krus’ ay natural na Filipino at, sa kontekstong may naunang simuno, naipahihiwatig ang tuwirang atribusyon ng Griyego nang hindi idinadagdag na ang mga lider mismo ang pisikal na tagapagpatupad.'
  naturalness: 'Natural at marangal ang pangunahing pangungusap. Gayunman, hindi angkop ang ‘ipinapako nila siya sa krus’ bilang alternatibo sa talababa: kasalukuyang aspekto ito at hindi nito inilalahad ang intended na alternatibong causative sense na ‘had him crucified.’'
