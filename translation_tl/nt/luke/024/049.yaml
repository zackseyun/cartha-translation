  source_fidelity: 'Ang draft ay tapat sa pangunahing diwa ng Griyego: kasalukuyang ''ipinapadala ko,'' utos na manatili sa lungsod, at ang metapora ng pagbibihis ng kapangyarihan mula sa kaitaasan. Gayunman, ang ἰδού ay hindi isang utos na tumingin, kaya hindi lubos na akma ang ''masdan ninyo.'' Ang ''ang pangako ng aking Ama'' ay mas malapit din sa τὴν ἐπαγγελίαν τοῦ πατρός μου at pinananatili ang ugnayang ipinahahayag ng genitive nang hindi ito ipinapaliwanag.'
  naturalness: Mas likas at idiomatiko sa makabagong marangal na Filipino ang 'At narito,' bilang panawag-pansin. Ang natitirang pangungusap ay malinaw at maayos ang daloy.
  terminology: Pinananatili ang 'Ama,' 'kapangyarihan,' at 'kaitaasan.' Hindi tahasang pinapangalanan ang ipinangakong kaloob bilang Banal na Espiritu, alinsunod sa teksto. Walang kailangang talababa.
