  text: καὶ ἰδοὺ ἐγὼ ⸀ἐξαποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ’ ὑμᾶς· ὑμεῖς δὲ καθίσατε ἐν τῇ ⸀πόλει ἕως οὗ ἐνδύσησθε ⸂ἐξ ὕψους δύναμιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/049.yaml
  text: And look, I am sending the promise of my Father upon you. But stay in the city until you are clothed with power from on high.
translation:
  language: tl
  text: At narito, ipinapadala ko sa inyo ang pangako ng aking Ama. Ngunit manatili kayo sa lungsod hanggang sa mabihisan kayo ng kapangyarihan mula sa kaitaasan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: masdan ninyo
  rationale: Isang marangal at likas na panawag-pansin sa Filipino na pinananatili ang diin ng Griyego.
- source_word: ἐξαποστέλλω
  choice: ipinapadala ko
  rationale: Pinananatili ang kasalukuyang anyo ng pandiwa at ang diwa ng tiyak o nalalapit na pagpapadala.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρός μου
  choice: ang ipinangako ng aking Ama
  rationale: Likas sa Filipino at malinaw na tumutukoy sa kaloob na ipinangako, habang pinananatili ang Ama bilang pinagmulan ng pangako.
- source_word: ἐφ’ ὑμᾶς
  choice: sa inyo
  rationale: Natural na katumbas sa kontekstong ang ipinangakong kaloob ay ipapadala sa mga alagad.
- source_word: καθίσατε ἐν τῇ πόλει
  choice: manatili kayo sa lungsod
  rationale: Sa konteksto, ang καθίσατε ay utos na manatili o maghintay, hindi literal na umupo.
- source_word: ἐνδύσησθε
  choice: mabihisan kayo
  rationale: Pinananatili ang matingkad na metapora ng pagsusuot o pagbibihis ng kapangyarihan.
- source_word: ἐξ ὕψους
  choice: mula sa kaitaasan
  rationale: Pinananatili ang pahiwatig na makalangit na pinagmulan nang hindi tahasang pinapalitan ng interpretasyong 'mula sa Diyos'.
theological_decisions:
- issue: Pagkakakilanlan ng “ipinangako ng aking Ama”
  choice: Hindi tahasang pinangalanan sa pangunahing teksto
  alternative: ang Banal na Espiritung ipinangako ng aking Ama
  rationale: Bagaman tinutukoy ng konteksto ang Banal na Espiritu, hindi Siya tahasang pinangalanan sa mismong talata; pinananatili nito ang paraan ng pagkakasabi ng orihinal.
- issue: Larawan ng pagtanggap ng kapangyarihan
  choice: mabihisan ng kapangyarihan
  alternative: mapuspos o mabigyan ng kapangyarihan
  rationale: Pinananatili ang teolohikal at pampanitikang metapora ng ἐνδύσησθε sa halip na ipaliwanag o palitan ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “masdan ninyo” bilang panawag-pansin at pinanatili ang metaporang “mabihisan ng kapangyarihan.”
