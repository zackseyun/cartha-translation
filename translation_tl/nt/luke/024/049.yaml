    rationale: Ang Griyegong genitive ay tuwirang 'ang pangako ng aking Ama.' Mas pinananatili ng 'pangako' ang anyo at bahagyang saklaw ng orihinal.
  revised_text: At narito, ipinapadala ko sa inyo ang pangako ng aking Ama. Ngunit manatili kayo sa lungsod hanggang sa mabihisan kayo ng kapangyarihan mula sa kaitaasan.
