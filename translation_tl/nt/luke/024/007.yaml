  text: λέγων ⸂τὸν υἱὸν τοῦ ἀνθρώπου ὅτι δεῖ⸃ παραδοθῆναι εἰς χεῖρας ἀνθρώπων ἁμαρτωλῶν καὶ σταυρωθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/007.yaml
  text: saying that the Son of Man must be delivered into the hands of sinful men and be crucified and on the third day rise again[a][b].
translation:
  language: tl
  text: na nagsasabing, “Ang Anak ng Tao ay kailangang ibigay sa kamay ng mga makasalanang tao, ipako sa krus, at muling bumangon sa ikatlong araw.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ibigay sa kapangyarihan ng mga makasalanang tao.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “bumangon”; aktibo ang pandiwa sa Griyego, hindi pasibo (ihambing sa “muling binuhay”).
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: na nagsasabing
  rationale: Pinananatili ang participial na kaugnayan nito sa utos na alalahanin sa naunang talata, sa halip na gawing hiwalay na pandiwa.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Ito ang kinikilalang salin ng titulo at pinananatili ang ugnay nito sa paggamit sa mga Ebanghelyo at sa Daniel.
- source_word: ὅτι δεῖ
  choice: ay kailangang
  rationale: Ipinahahayag ng δεῖ ang kinakailangang mangyari ayon sa layunin ng Diyos, hindi lamang isang payak na hula.
- source_word: παραδοθῆναι
  choice: ibigay
  rationale: Saklaw nito ang diwang ipasa o ibigay sa kapangyarihan ng iba; hindi ito nililimitahan sa pagtataksil lamang.
- source_word: εἰς χεῖρας
  choice: sa kamay ng
  rationale: Natural sa Filipino ang idyomang ito para sa pagkakabigay sa kapangyarihan o pamamahala ng iba, at pinananatili nito ang larawan ng Griyego.
- source_word: ἀνθρώπων ἁμαρτωλῶν
  choice: mga makasalanang tao
  rationale: Pinananatili ang tahasang ἀνθρώπων at ang paglalarawan sa mga taong sangkot sa pagdakip at pagpapako kay Jesus, nang hindi ginagawang simpleng pangngalang 'mga makasalanan.'
- source_word: σταυρωθῆναι
  choice: ipako sa krus
  rationale: Eksakto at likas na salin sa modernong Filipino ng pasibong infinitive na tumutukoy sa pagpapako sa krus.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: sa ikatlong araw
  rationale: Natural na ipinapahayag sa Filipino ang dative of time sa ganitong paraan, nang walang dagdag na paliwanag.
- source_word: ἀναστῆναι
  choice: muling bumangon
  rationale: Pinananatili ang aktibong anyo ng Griyego at malinaw na ipinahihiwatig ang pagbabalik sa buhay.
theological_decisions:
- issue: Lakas ng δεῖ sa pahayag tungkol sa pagdurusa ni Jesus
  choice: kailangang, na nagpapahayag ng banal na pangangailangan
  alternative: mangyayari, bilang payak na prediksiyon
  rationale: Sa Lucas, madalas ipahiwatig ng δεῖ ang kinakailangang katuparan sa loob ng layunin ng Diyos. Pinananatili ng 'kailangang' ang bigat na ito nang hindi ito labis na ipinapaliwanag.
- issue: Paglalarawan sa ἀνθρώπων ἁμαρτωλῶν
  choice: mga makasalanang tao
  alternative: mga makasalanan
  rationale: Pinananatili ng salin ang tahasang salitang 'tao' sa Griyego at ang paglalarawan sa mga taong sangkot, nang hindi nagpapasok ng higit na tiyak na pagkakakilanlan kaysa sa teksto.
- issue: Aktibong anyo ng ἀναστῆναι
  choice: muling bumangon
  alternative: muling buhayin
  rationale: Aktibo ang infinitive sa Griyego. Ang 'muling bumangon' ay nagpapanatili nito, samantalang ang 'muling buhayin' ay maglilipat sa pasibong diwa na hindi nasa anyong ito.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang tradisyonal at madaling makilalang titulong “Anak ng Tao,” ang idyomang “sa kamay ng,” at ang aktibong diwa ng pandiwa para sa muling pagkabuhay.
