  text: And they gave him a piece of broiled fish[a].
translation:
  language: tl
  text: At binigyan nila siya ng isang pirasong inihaw na isda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Idinaragdag ng ilang mas huling manuskrito, “at pulot-pukyutan.”
    reason: textual_variant
lexical_decisions:
- source_word: οἱ δὲ
  choice: At ... nila
  rationale: Ang οἱ ay ginagamit bilang panghalip na tumutukoy sa mga alagad na naroon, at ang δέ ay banayad na pang-ugnay. Likas sa Filipino ang “At ... nila” para sa pagpapatuloy ng salaysay nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: ἐπέδωκαν
  choice: binigyan
  rationale: Ang aorist active indicative ng ἐπιδίδωμι ay nangangahulugang magbigay o mag-abot. Sa kayariang Filipino, natural ang “binigyan nila siya.”
- source_word: αὐτῷ
  choice: siya
  rationale: Ang dative na di-tuwirang layon ay natural na ipinapahayag sa Filipino bilang “siya” sa kayariang “binigyan nila siya.”
- source_word: ἰχθύος ὀπτοῦ μέρος
  choice: isang pirasong inihaw na isda
  rationale: 'Ang μέρος ang pangunahing pangngalan, “piraso” o “bahagi,” at inilalarawan ng genitive na ἰχθύος ὀπτοῦ kung ano ang piraso: isdang niluto sa apoy. Ang “isang pirasong inihaw na isda” ay malinaw, natural, at malapit sa anyo ng Griyego.'
- source_word: ὀπτοῦ
  choice: inihaw
  rationale: Ang ὀπτός ay tumutukoy sa pagkaing niluto sa pamamagitan ng pag-ihaw o pag-iihaw sa apoy. Ang “inihaw” ang pinakanatural at tiyak na katumbas sa modernong Filipino.
theological_decisions:
- issue: Tekstuwal na anyo ng Lucas 24:42
  choice: 'Isinalin lamang ang teksto ng SBLGNT: “isang pirasong inihaw na isda.”'
  alternative: Idinaragdag ng ilang mas huling manuskrito ang “at pulot-pukyutan.”
  rationale: Nagtatapos sa μέρος ang ibinigay na kritikal na tekstong Griyego at wala rito ang mas mahabang pagbasa. Sinusunod ng pangunahing teksto ang SBLGNT, samantalang inilalahad sa talababa ang variant para sa pagiging bukas tungkol sa ebidensiyang tekstuwal.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinili ang “inihaw” kaysa sa mas teknikal o di-likas na katumbas ng “broiled,” at pinanatili ang maikli at tuwirang daloy ng salaysay.
