    issue: Idinagdag ang “bigla.”
    rationale: Walang katumbas na pang-abay na “bigla” sa αὐτὸς ἄφαντος ἐγένετο ἀπ’ αὐτῶν; ang dagdag na ito ay higit na nagsasalarawan sa pangyayari kaysa sa pinahihintulutan ng teksto.
  - severity: low
    issue: Ginamit ang “ngunit” para sa καί.
    rationale: Ang καί ay nag-uugnay lamang ng susunod na pangyayari; hindi kinakailangan ang kontrastibong “ngunit.”
  - severity: low
    issue: Ang “nawala sa kanilang paningin” ay katanggap-tanggap na alternatibo ngunit maaaring magmungkahi ng mas tiyak na pag-alis.
    rationale: Mas maingat ang pangunahing saling “hindi na nila siya nakita,” na inihahayag ang resulta ng ἄφαντος nang hindi tinutukoy ang paraan.
  revised_text: At nabuksan ang kanilang mga mata, at nakilala nila siya; at hindi na nila siya nakita.[a]
