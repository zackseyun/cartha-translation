base_translation:
  language: en
  yaml_path: translation/nt/luke/024/031.yaml
  text: Then their eyes were opened[a], and they recognized him; and he became unseen by them.
translation:
  language: tl
  text: At nabuksan ang kanilang mga mata, at nakilala nila siya; at hindi na nila siya nakita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nawala siya sa kanilang paningin” o “naging di-nakikita siya sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διηνοίχθησαν
  choice: nabuksan
  rationale: Pinananatili ng anyong balintiyak ang diwang pinangyari ang kanilang pagkaunawa, sa halip na sila mismo ang nagbukas nito.
- source_word: οἱ ὀφθαλμοὶ
  choice: kanilang mga mata
  rationale: Likas na katumbas sa Tagalog ng pariralang Griyego at pinananatili ang larawan ng nabuksang mga mata bilang pagkilala.
- source_word: ἐπέγνωσαν
  choice: nakilala
  rationale: Sa konteksto ng Emaus, tumutukoy ito sa pagkilala nila sa taong dati nilang hindi nakilala, hindi lamang sa pagkakaroon ng kaalaman tungkol sa kanya.
- source_word: ἄφαντος
  choice: nawala sa kanilang paningin
  rationale: Likas at malinaw sa modernong Tagalog, habang ipinahahayag lamang na hindi na nila siya nakita at hindi tinutukoy kung paano iyon nangyari.
- source_word: ἐγένετο ἀπ’ αὐτῶν
  choice: bigla siyang nawala sa kanilang paningin
  rationale: Ipinapahayag ang pagbabago ng kalagayan kaugnay ng mga alagad—mula sa nakikita tungo sa hindi na nakikita—nang hindi nagmumungkahi ng partikular na mekanismo.
- source_word: δὲ
  choice: At
  rationale: Ipinagpapatuloy nito nang natural ang salaysay; ang kasunod na ngunit ay nagpapakita ng pagbabago mula sa pagkilala tungo sa pagkawala sa paningin.
theological_decisions:
- issue: Ang likas na katangian ng pagkawala ni Jesus sa kanilang paningin
  choice: nawala sa kanilang paningin
  alternative: hindi na nila siya nakita; naging di-nakikita siya sa kanila
  rationale: Ang ἄφαντος ἐγένετο ay nagsasaad na hindi na siya nakikita. Hindi nililinaw ng salaysay ang mekanismo, kaya hindi rin ito nilulutas ng salin.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “nawala sa kanilang paningin” sa halip na ang mas mekanikal na “naging di-nakikita,” at inilagay sa talababa ang mas literal na mga alternatibo upang mapanatili ang saklaw ng Griyego.
