  text: καὶ παρεβιάσαντο αὐτὸν λέγοντες· Μεῖνον μεθ’ ἡμῶν, ὅτι πρὸς ἑσπέραν ἐστὶν καὶ κέκλικεν ⸀ἤδη ἡ ἡμέρα. καὶ εἰσῆλθεν τοῦ μεῖναι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/029.yaml
  text: But they urged him strongly[a], saying, “Stay with us[b], because it is toward evening and the day has already declined.” And he went in to stay with them.
translation:
  language: tl
  text: Ngunit mahigpit nila siyang pinakiusapan[a], “Manatili ka sa amin, sapagkat gumagabi na at palubog na ang araw.” At pumasok siya upang manatiling kasama nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mapilit nila siyang hinimok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβιάσαντο
  choice: mahigpit nila siyang pinakiusapan
  rationale: Ipinahihiwatig ng anyong middle ang taimtim at mapilit na pakiusap, hindi kinakailangang pisikal na pamimilit. Likas sa makabagong Tagalog ang pariralang ito at napapanatili ang tindi.
- source_word: Μεῖνον μεθ’ ἡμῶν
  choice: Manatili ka sa amin
  rationale: Ang pautos na Μεῖνον ay isang kahilingang huwag muna siyang umalis; ang μετά na may genitive ay nagpapahayag ng pagsama.
- source_word: ὅτι πρὸς ἑσπέραν ἐστὶν
  choice: sapagkat gumagabi na
  rationale: Natural na Tagalog ito para sa paglapit ng gabi at hindi nito ipinahihiwatig na lubos nang gabi.
- source_word: κέκλικεν ἤδη ἡ ἡμέρα
  choice: palubog na ang araw
  rationale: Inilalarawan ng perfect na κέκλικεν ang araw na nakahilig o papunta na sa pagtatapos. Ang karaniwang idyomang Tagalog na ito ay malinaw na naghahatid ng humihinang liwanag ng araw.
- source_word: εἰσῆλθεν
  choice: pumasok siya
  rationale: Tuwirang katumbas sa salaysay ng pagpasok niya sa ipinahihiwatig na bahay o tuluyan.
- source_word: τοῦ μεῖναι σὺν αὐτοῖς
  choice: upang manatiling kasama nila
  rationale: Ang articular infinitive ay nagpapahayag dito ng layunin, at ang σύν ay tumutukoy sa pagsama sa kanila.
theological_decisions: []
translation_notes:
  register: 'Makabago, malinaw, at marangal na Tagalog. Pinanatili ang tindi ng pakiusap nang hindi ipinahihiwatig ang pisikal na pamimilit. Isinalin ang dalawang magkaugnay na pahayag tungkol sa oras sa likas na paraan: “gumagabi na” at “palubog na ang araw.”'
