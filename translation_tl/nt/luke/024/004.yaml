  text: καὶ ἐγένετο ἐν τῷ ⸀ἀπορεῖσθαι αὐτὰς περὶ τούτου καὶ ἰδοὺ ἄνδρες δύο ἐπέστησαν αὐταῖς ἐν ⸂ἐσθῆτι ἀστραπτούσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/004.yaml
  text: And it happened[a], while they were perplexed about this, that behold, two men stood by them in dazzling clothing.
translation:
  language: tl
  text: Habang naguguluhan sila tungkol dito, biglang tumayo sa tabi nila ang dalawang lalaking nakasuot ng nakakasilaw na damit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “damit na kumikislap na parang kidlat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο
  choice: Habang … biglang
  rationale: Ang karaniwang pormulang pasalaysay ni Lucas ay likas na naipapahayag sa modernong Tagalog sa pamamagitan ng paglalatag ng kalagayan at ng kasunod na pangyayari, sa halip na gamitin ang mas mabigat na “at nangyari na.”
- source_word: ἐν τῷ ἀπορεῖσθαι αὐτὰς
  choice: Habang naguguluhan sila
  rationale: Ang ἐν na may articular infinitive ay temporal, at ang ἀπορέω ay nagpapahiwatig na hindi nila maunawaan o malaman ang gagawin, hindi lamang na sila ay nagtataka.
- source_word: περὶ τούτου
  choice: tungkol dito
  rationale: Tuwirang tumutukoy ito sa pangyayaring nauna at natural ang parirala sa modernong Tagalog.
- source_word: ἰδοὺ
  choice: biglang
  rationale: Dito, ang ἰδού ay pantawag-pansin sa isang di-inaasahang paglitaw. Ang “biglang” ay natural na naihahatid ang bisa nito sa salaysay, bagaman hindi ito isang literal na katumbas.
- source_word: ἄνδρες δύο
  choice: dalawang lalaki
  rationale: Ang ἀνήρ ay tahasang “lalaki.” Pinananatili ng salin ang paglalarawan ng mismong talata at hindi agad tinatawag na mga anghel ang dalawang tauhan.
- source_word: ἐπέστησαν αὐταῖς
  choice: tumayo sa tabi nila
  rationale: Pinananatili nito ang diwang panlunan ng biglang pagkanaroon o pagtayo malapit sa kanila, sa halip na ipakahulugang “nagpakita.”
- source_word: ἐν ἐσθῆτι ἀστραπτούσῃ
  choice: nakasuot ng nakakasilaw na damit
  rationale: Likas itong pakinggan sa Tagalog at malinaw na naghahatid ng matinding liwanag ng kasuotan. Inilalagay sa talababa ang mas literal na larawang kaugnay ng kidlat.
theological_decisions:
- issue: Pagkakakilanlan ng dalawang tauhan
  choice: dalawang lalaki
  alternative: dalawang anghel
  rationale: Bagaman ipinakikita ng mas malawak na konteksto na sila ay mga mensaherong makalangit, “dalawang lalaki” ang mismong paglalarawan sa Griyego ng talatang ito. Hindi ipinapasok sa salin ang pagkakakilanlang nililinaw ng konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural sa salaysay. Iniwasan ang arkaikong “at nangyari na” at ang masyadong panrelihiyong pagpapakahulugan sa dalawang lalaki.
