  text: εὗρον δὲ τὸν λίθον ἀποκεκυλισμένον ἀπὸ τοῦ μνημείου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/002.yaml
  text: And they found the stone rolled away from the tomb,
translation:
  language: tl
  text: At nakita nilang naigulong na palayo sa libingan ang bato.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὗρον
  choice: nakita nila
  rationale: Ang aorist active indicative na pangatlong panauhang maramihan ay tumutukoy sa mga babaeng binanggit sa naunang talata. Sa kontekstong ito, natural na ipinapahayag ng “nakita nila” na nadatnan nilang gayon ang kalagayan ng bato.
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay, hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: τὸν λίθον
  choice: ang bato
  rationale: Sa konteksto ng paglilibing, tumutukoy ito sa batong pantakip sa pasukan ng libingan.
- source_word: ἀποκεκυλισμένον
  choice: naigulong na palayo
  rationale: Ang perfect passive participle ay nagpapahiwatig na naigulong ang bato at nananatili itong nakahiwalay sa dating kinalalagyan; pinananatili ng “naigulong na” ang kilos at ang bungang kalagayan.
- source_word: ἀπὸ τοῦ μνημείου
  choice: sa libingan
  rationale: Ang μνημεῖον ay “libingan” sa kontekstong ito. Kasama ng “palayo,” natural na ipinahihiwatig ng pariralang “palayo sa libingan” ang kahulugan ng ἀπό nang hindi inuulit ang ideya ng paglayo.
theological_decisions:
- issue: Hindi hayagang inuulit sa Griyego ang simuno
  choice: nakita nila
  alternative: nakitang
  rationale: Malinaw sa anyong maramihan ng pandiwa at sa naunang talata na ang tinutukoy ay ang mga babae. Ang paglalagay ng “nila” ay kailangan para sa natural at malinaw na modernong Tagalog at hindi nagdaragdag ng teolohikal na nilalaman.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “libingan” sa halip na mas teknikal o makalumang katawagan, at pinanatili ang resultang kalagayan ng perfect passive sa “naigulong na palayo.”
