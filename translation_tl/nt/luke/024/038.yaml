id: LUK.24.38
reference: Luke 24:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τί τεταραγμένοι ἐστέ, καὶ διὰ τί διαλογισμοὶ ἀναβαίνουσιν ἐν ⸂τῇ καρδίᾳ⸃ ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/038.yaml
  text: And he said to them[a], “Why are you troubled, and why do doubts arise in your hearts?”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Bakit kayo nababagabag, at bakit may mga pag-aalinlangang bumabangon sa inyong mga puso?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί
  choice: Bakit
  rationale: Sa konstruksyong ito, ang τί ay nagtatanong ng dahilan; natural at tumpak sa Tagalog ang “Bakit.”
- source_word: τεταραγμένοι
  choice: nababagabag
  rationale: Ipinahihiwatig ng perfect passive participle ang kasalukuyang kalagayan ng panloob na pagkabalisa; dignified at karaniwan ang “nababagabag.”
- source_word: διαλογισμοὶ
  choice: mga pag-aalinlangan
  rationale: Bagaman maaari itong mangahulugang mga kaisipan o pangangatwiran, ipinakikita ng konteksto ang pag-aatubili at kawalan ng katiyakan ng mga alagad.
- source_word: ἀναβαίνουσιν
  choice: bumabangon
  rationale: Pinananatili nito ang larawang literal na “umaakyat” habang natural na inilalarawan ang paglitaw ng panloob na pag-aalinlangan.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: sa inyong mga puso
  rationale: Ang isahang καρδίᾳ kasama ng pangmaramihang ὑμῶν ay distributibo; mas natural sa modernong Tagalog ang pangmaramihang “mga puso.”
- source_word: καρδία
  choice: puso
  rationale: Pinananatili ng “puso” ang biblikal na diwa ng panloob na pagkatao, kabilang ang pag-iisip at disposisyon, sa halip na paliitin ito sa isip lamang.
theological_decisions:
- issue: Antropolohikal na kahulugan ng καρδία
  choice: puso
  alternative: isip; kalooban; panloob na pagkatao
  rationale: Sa biblikal na gamit, ang puso ay saklaw ang pag-iisip at saloobin. Pinananatili ng “puso” ang lawak at teolohikal na tekstura ng termino.
- issue: Saklaw ng διαλογισμοί
  choice: mga pag-aalinlangan
  alternative: mga kaisipan; mga pangangatwiran
  rationale: Ang agarang konteksto ng pagkabigla at pag-aakalang espiritu ang nakita nila ay sumusuporta sa negatibong diwa, ngunit hindi ito pinatitindi tungo sa tahasang kawalan ng pananampalataya.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nababagabag” at “pag-aalinlangan” upang maipahayag ang panloob na pagkabalisa at pag-aatubili nang hindi sobrang kolokyal o denominasyonal.
