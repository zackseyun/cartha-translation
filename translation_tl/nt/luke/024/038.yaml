  source_fidelity: 'Tapat ang salin sa Griyego: ang dalawang “Bakit” ay wastong nagpapahayag ng τί sa mga tanong na humihingi ng dahilan; ang “nababagabag” ay tumutugon sa kasalukuyang kalagayan ng τεταραγμένοι; at ang “mga pag-aalinlangan” ay isang kontekstuwal na wastong pagsasalin ng διαλογισμοί nang hindi inaalis ang saklaw nitong panloob na pag-iisip. Ang “bumabangon” ay natural na idyomatikong katumbas ng ἀναβαίνουσιν sa ganitong talinghaga. Ang “sa inyong mga puso” ay likas na distributibong Tagalog para sa isahang καρδίᾳ na may maramihang ὑμῶν.'
  naturalness: Natural, malinaw, at marangal ang modernong Filipino Tagalog. Ang ayos ng dalawang magkaugnay na tanong ay maayos at ang “may mga pag-aalinlangang bumabangon” ay angkop sa pampanitikan ngunit hindi lipas na rehistro.
  terminology: Ang “puso” ay angkop para sa καρδία at pinananatili ang biblikal na saklaw nito, kabilang ang panloob na pag-iisip at saloobin. Ang “pag-aalinlangan” ay naaayon sa agarang konteksto ng pagkalito ng mga alagad at sa English audit trail; hindi nito ipinapataw ang isang denominasyonal na pagbasa.
