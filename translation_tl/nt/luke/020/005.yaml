  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ συνελογίσαντο πρὸς ἑαυτοὺς λέγοντες ὅτι Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/005.yaml
  text: But they reasoned among themselves[a], saying, “If we say, ‘From heaven,’ he will say[b], ‘Why did you not believe him?’”
translation:
  language: tl
  text: 'Ngunit nag-usap-usap sila: “Kung sasabihin nating, ‘Mula sa langit,’ sasabihin niya, ‘Bakit hindi ninyo siya pinaniwalaan?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνελογίσαντο πρὸς ἑαυτοὺς
  choice: nag-usap-usap sila
  rationale: Ipinapahayag ng parirala ang sama-samang pag-iisip at pagsasanggunian sa loob ng kanilang pangkat. Likas sa modernong Tagalog ang “nag-usap-usap” at hindi nito ipinahihiwatig na nagtatalo lamang sila.
- source_word: λέγοντες
  choice: ipinahiwatig sa tuwirang sipi pagkatapos ng tutuldok
  rationale: Sa Tagalog, sapat at natural ang paglalagay ng tuwirang sinabi pagkatapos ng pandiwang “nag-usap-usap”; magiging mabigat at paulit-ulit ang tahasang “na sinasabi.”
- source_word: Ἐὰν εἴπωμεν
  choice: Kung sasabihin nating
  rationale: Likas na anyo ito sa Tagalog para sa isang pinag-iisipang maaaring isagot.
- source_word: Ἐξ οὐρανοῦ
  choice: Mula sa langit
  rationale: Pinananatili nito ang mismong idyoma ng Griyego at ang pahiwatig ng banal na pinagmulan nang hindi ito tahasang pinapalitan ng “mula sa Diyos.”
- source_word: ἐρεῖ
  choice: sasabihin niya
  rationale: Tuwirang sinasalamin nito ang pandiwang Griyego; ang kasunod na sipi mismo ang nagpapakita na ang sasabihin ay isang tanong.
- source_word: ἐπιστεύσατε αὐτῷ
  choice: pinaniwalaan ninyo siya
  rationale: Ang πιστεύω na may datibo rito ay tumutukoy sa pagtanggap bilang totoo sa sinabi o patotoo ng isang tao. Ang “pinaniwalaan” ay mas angkop kaysa “sumampalataya sa,” na maaaring magdagdag ng mas malakas na teolohikal na diwa kaysa hinihingi ng balarila.
theological_decisions:
- issue: Ang ipinahihiwatig na pinagmulan o awtoridad ng bautismo ni Juan sa pariralang Ἐξ οὐρανοῦ
  choice: Mula sa langit
  alternative: Mula sa Diyos
  rationale: Bagaman tumutukoy ang idyoma sa banal na awtoridad, “langit” ang tahasang salita sa Griyego. Pinananatili ng salin ang pahiwatig at hindi tahasang nilulutas ang metonimiya.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nag-usap-usap” upang likas na maipahayag ang panloob na pagsasanggunian ng pangkat, at tutuldok upang maayos na ipakilala ang kanilang tuwirang sinabi.
