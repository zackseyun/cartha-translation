  text: Pagkatapos, namatay din ang babae.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕστερον
  choice: Pagkatapos
  rationale: Nagsasaad ito ng kasunod na panahon sa pagkakasunod-sunod ng salaysay. Natural sa modernong Filipino ang “Pagkatapos” at hindi nito labis na tinutukoy kung gaano katagal ang lumipas.
- source_word: καὶ
  choice: din
  rationale: Dito, ipinapakitang sinapit din ng babae ang kamatayan gaya ng mga lalaking naunang binanggit. Mas natural sa Filipino ang hulihang “din” kaysa sa payak na pang-ugnay na “at.”
- source_word: ἡ γυνή
  choice: ang babae
  rationale: Maaaring mangahulugang “babae” o “asawa” ang γυνή. Sa sitwasyong sunod-sunod siyang napangasawa ng magkakapatid, malinaw at hindi mapanlinlang ang “ang babae.”
- source_word: ἀπέθανεν
  choice: namatay
  rationale: Tuwiran nitong inilalahad ang pagkamatay bilang pangyayaring naganap. Ang “namatay” ay payak at tapat sa Griyego, nang walang pagpapalambot.
