  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται, ἰσάγγελοι γάρ εἰσιν καὶ υἱοί ⸀εἰσιν θεοῦ τῆς ἀναστάσεως υἱοὶ ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/036.yaml
  text: For they cannot die anymore[a], because they are like the angels and are sons of God[b], being sons of the resurrection.
translation:
  language: tl
  text: Hindi na rin sila maaaring mamatay, sapagkat tulad sila ng mga anghel[a] at mga anak sila ng Diyos, bilang mga anak ng muling pagkabuhay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kapantay ng mga anghel.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “mga anak na lalaki ng Diyos” at “mga anak na lalaki ng muling pagkabuhay.” Ang panlalaking anyo rito ay nagpapahayag ng katayuan at pagkakakilanlan, at hindi nangangahulugang mga lalaki lamang ang kabilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται
  choice: Hindi na rin sila maaaring mamatay
  rationale: Ipinahahayag ng δύνανται kasama ng infinitive ang kakayahan, samantalang ang ἔτι sa negatibong pahayag ay nangangahulugang ‘hindi na.’ Isinasama ng ‘rin’ ang diwa ng οὐδέ at iniuugnay ang pangungusap sa naunang sinabi.
- source_word: ἰσάγγελοι
  choice: tulad sila ng mga anghel
  rationale: Ang salita ay maaaring mangahulugang ‘kapantay ng mga anghel’ o ‘tulad ng mga anghel.’ Natural at malinaw ang ‘tulad’ at hindi nito ipinahihiwatig na magiging mga anghel sila.
- source_word: υἱοί ... θεοῦ
  choice: mga anak sila ng Diyos
  rationale: Ang karaniwang salin sa Tagalog ng υἱοί sa ganitong pahayag ng kaugnayan at katayuan ay ‘mga anak.’ Saklaw nito ang lahat ng tinutukoy sa konteksto at hindi lamang mga lalaki.
- source_word: τῆς ἀναστάσεως υἱοὶ ὄντες
  choice: bilang mga anak ng muling pagkabuhay
  rationale: Pinananatili ng ‘bilang’ ang metaporang ‘mga anak ng muling pagkabuhay’ at ang participial na ugnayan nito sa naunang parirala nang hindi labis na itinatakda kung ito ay sanhi lamang.
- source_word: γάρ ... γάρ
  choice: '[ugnay sa naunang pahayag] ... sapagkat'
  rationale: Ang unang γάρ ay likas na naipahihiwatig sa Tagalog sa pagpapatuloy ng pangungusap at sa ‘rin’; ang ikalawa ay malinaw na isinalin na ‘sapagkat’ upang ipakita ang paliwanag.
theological_decisions:
- issue: Filial na pananalita sa konteksto ng muling pagkabuhay
  choice: Panatilihin ang magkatugmang ‘mga anak ng Diyos’ at ‘mga anak ng muling pagkabuhay’
  alternative: ‘mga kabilang sa Diyos’ at ‘mga taong muling binuhay’
  rationale: Mahalaga sa Griyego ang pag-uulit ng υἱοί at ang metapora ng pagiging anak. Sa Tagalog, ang ‘mga anak’ ay likas na tumutukoy sa babae at lalaki, kaya napapanatili ang katayuan at pagkakakilanlang ipinahahayag ng teksto nang hindi nagmumungkahi ng eksklusibong pagkalalaki.
translation_notes:
  register: Makabago at madaling maunawaang Tagalog na may marangal na himig. Ginamit ang ‘hindi na rin’ upang likas na ipakita ang pagpapatuloy mula sa naunang talata, at pinanatili ang magkatugmang metapora ng pagiging anak.
