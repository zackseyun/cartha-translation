base_translation:
  language: en
  yaml_path: translation/nt/luke/020/009.yaml
  text: 'Then he began to tell the people this parable: “A man planted a vineyard[a], and leased it to farmers, and went away for a considerable time.”'
translation:
  language: tl
  text: 'Pagkatapos, nagsimula siyang magsalaysay sa mga tao ng talinghagang ito: “Isang lalaki ang nagtanim ng ubasan, pinaupahan iyon sa mga magsasaka, at umalis[a] nang mahabang panahon.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagpunta sa ibang bansa nang mahabang panahon.” Maaaring ipahiwatig ng pandiwa ang paglayo sa sariling lugar, pati ang paglalakbay sa ibang lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤρξατο δὲ
  choice: Pagkatapos, nagsimula siya
  rationale: Ipinahahayag ng ἤρξατο ang pagsisimula ng pagsasalaysay, at ginamit ang “Pagkatapos” upang natural na ihudyat ang pagpapatuloy ng salaysay na ipinakikita rito ng δέ.
- source_word: πρὸς τὸν λαὸν λέγειν τὴν παραβολὴν ταύτην
  choice: magsalaysay sa mga tao ng talinghagang ito
  rationale: Ang “magsalaysay” ay likas na Filipino kapag isang talinghaga ang inilalahad; pinananatili ng “mga tao” ang kolektibong diwa ng λαός nang hindi ito nililimitahan sa isang pulutong lamang.
- source_word: Ἄνθρωπος
  choice: Isang lalaki
  rationale: Isang tiyak na lalaking tauhan ang ipinakikilala sa talinghaga, kaya mas tumpak ito kaysa sa neutral na “isang tao.”
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: nagtanim ng ubasan
  rationale: Tuwirang inililipat nito ang karaniwang kahulugan ng φυτεύω at ἀμπελών sa natural na Filipino.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: pinaupahan iyon sa mga magsasaka
  rationale: Sa kontekstong ito, ang ἐκδίδωμι ay pagpapaupa ng ari-arian, samantalang ang γεωργοί ay mga tagapagsaka o magsasaka. Malinaw na naipapahiwatig ng pandiwa ang kanilang katayuan bilang mga umuupa.
- source_word: ἀπεδήμησεν
  choice: umalis
  rationale: Maaaring tumukoy ang pandiwa sa paglayo sa sariling lugar, maging sa pagpunta sa ibang bansa. Pinananatili ng “umalis” ang saklaw ng kahulugan nang hindi nagdaragdag ng tiyak na destinasyon.
- source_word: χρόνους ἱκανούς
  choice: nang mahabang panahon
  rationale: Ipinahahayag ng parirala ang isang sapat na mahaba o malaking yugto ng panahon; ito ang pinakanatural na katumbas sa kasalukuyang Filipino.
theological_decisions:
- issue: Kasarian ng tauhang ipinakilala ng Ἄνθρωπος
  choice: Isang lalaki
  alternative: Isang tao
  rationale: Bagaman maaaring malawak ang gamit ng ἄνθρωπος, ang anyo at papel ng tiyak na tauhan sa talinghaga ay panlalaki. Pinananatili ito nang hindi nagdaragdag ng anumang interpretasyong doktrinal.
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang ginamit. Pinili ang karaniwang “talinghaga,” “ubasan,” at “magsasaka” upang mapanatili ang biblikal na genre at larawang agrikultural nang hindi nagiging lipas o labis na teknikal.
