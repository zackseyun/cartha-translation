  text: οἱ δὲ καταξιωθέντες τοῦ αἰῶνος ἐκείνου τυχεῖν καὶ τῆς ἀναστάσεως τῆς ἐκ νεκρῶν οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/035.yaml
  text: But those who are considered worthy to attain that age and the resurrection from the dead neither marry nor are given in marriage[a][b].
translation:
  language: tl
  text: Ngunit ang mga itinuring na karapat-dapat[a] na makabahagi sa kapanahunang iyon[b] at sa muling pagkabuhay mula sa mga patay ay hindi nag-aasawa ni ipinag-aasawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ibinilang na karapat-dapat” o “hinatulang karapat-dapat.” Pasibo ang Griyego at tumutukoy sa mga itinuring na karapat-dapat.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa kapanahunang darating.” Sa literal, “sa kapanahunang iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταξιωθέντες
  choice: itinuring na karapat-dapat
  rationale: 'Pinananatili nito ang pasibong diwa ng Griyego: sila ay hinatulan o itinuring na karapat-dapat, sa halip na sabihing likas o sariling sikap silang naging karapat-dapat.'
- source_word: τοῦ αἰῶνος ἐκείνου
  choice: sa panahong iyon
  rationale: Ang αἰών ay tumutukoy sa isang panahon o kapanahunan. Ang “panahong iyon” ay natural sa modernong Tagalog at pinananatili ang demonstratibong ἐκείνου nang hindi tahasang ipinapalit ang interpretatibong “panahong darating.”
- source_word: τυχεῖν
  choice: makabahagi
  rationale: Sa konstruksiyong may genitive, ang pandiwa ay maaaring mangahulugang magkamit o magkaroon ng bahagi. Ang “makabahagi” ay likas na naiuugnay kapuwa sa “panahong iyon” at sa “muling pagkabuhay,” samantalang magiging alanganin sa Tagalog ang literal na “makamit ang panahon.”
- source_word: ἀναστάσεως τῆς ἐκ νεκρῶν
  choice: muling pagkabuhay mula sa mga patay
  rationale: Malinaw at karaniwang salin ito na pinananatili ang puwersa ng ἐκ, “mula sa,” nang hindi nagiging labis na literal.
- source_word: γαμοῦσιν
  choice: nag-aasawa
  rationale: Ang γαμέω ay nangangahulugang mag-asawa o kumuha ng asawa. Ang “nag-aasawa” ay maikli, malinaw, at natural sa kasalukuyang Tagalog.
- source_word: γαμίζονται
  choice: ipinag-aasawa
  rationale: Pinananatili nito ang pasibong anyo at ang kaibahan nito sa naunang “nag-aasawa,” na sumasalamin sa sinaunang kaugaliang may taong ibinibigay o ipinagkakasundo sa pag-aasawa.
theological_decisions:
- issue: Kung ang καταξιωθέντες ay nagpapahiwatig na pinaghirapan o karapat-dapat na kinita ng tao ang buhay sa muling pagkabuhay
  choice: “itinuring na karapat-dapat,” na nagpapanatili sa diwa ng isang paghatol o pagtataya nang hindi sinasabing kinita ito sa sariling merito
  alternative: “ang mga karapat-dapat”
  rationale: Hindi tinutukoy ng teksto rito kung sa anong batayan sila itinuring na karapat-dapat. Kaya pinananatili ng salin ang pasibong pahayag at ang teolohikal na tensiyon sa halip na lutasin ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “makabahagi” upang maging natural ang iisang pandiwa para sa dalawang magkaugnay na layon. Pinanatili ang magkatambal ngunit magkaibang “nag-aasawa” at “ipinag-aasawa” upang masalamin ang dalawang pandiwang Griyego.
