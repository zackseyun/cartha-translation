base_translation:
  language: en
  yaml_path: translation/nt/luke/020/012.yaml
  text: And he sent a third[a]; but they wounded this one also and threw him out.
translation:
  language: tl
  text: At nagsugo pa siya ng ikatlo[a]; ngunit sinugatan din nila ito at itinapon sa labas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “idinagdag niyang magsugo ng ikatlo,” isang idyomang nangangahulugang nagpatuloy siya at nagsugo ng ikatlo.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: nagsugo pa siya
  rationale: Ang προστίθημι na may pawatas ay isang idyomang nagsasaad ng pagpapatuloy o pagdaragdag ng kilos. Likas sa Tagalog ang “nagsugo pa siya,” at malinaw nitong ipinahihiwatig ang panibagong pagsusugo nang hindi ginagawang mekanikal ang salin.
- source_word: τρίτον πέμψαι
  choice: ng ikatlo
  rationale: Hindi inuulit sa Griyego ang tinutukoy na lingkod sapagkat malinaw na ito mula sa naunang konteksto. Pinananatili ng “ng ikatlo” ang maikli at likas na daloy ng salaysay.
- source_word: οἱ δὲ
  choice: ngunit ... nila
  rationale: Ang δέ ay nagpapakita rito ng pagsalungat sa ginawa ng may-ari at sa tugon ng mga magsasaka. Ang “ngunit” angkop na naghahatid ng pagbabagong ito; ang “nila” ay tumutukoy sa mga magsasakang binanggit sa konteksto.
- source_word: καὶ τοῦτον
  choice: din nila ito
  rationale: Ipinahihiwatig ng καί na ang ikatlong isinugo ay dumanas din ng pagmamalupit. Likas sa modernong Tagalog ang pagkakalagay ng “din” kasunod ng pandiwa.
- source_word: τραυματίσαντες
  choice: sinugatan
  rationale: Tiyak na tumutukoy ang τραυματίζω sa paglikha ng sugat o pananakit na nagdudulot ng sugat. Mas tuwiran at eksakto ang “sinugatan” kaysa sa mas malawak na “pininsala.”
- source_word: ἐξέβαλον
  choice: itinapon sa labas
  rationale: Ang ἐκβάλλω ay nangangahulugang marahas na ilabas o itapon. Pinananatili ng “itinapon sa labas” ang pisikal at marahas na larawan ng Griyego.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nagsugo” para sa pagpapadala ng isang kinatawan o lingkod, at pinanatili ang maikli at marahas na pagkakasunod ng mga kilos sa orihinal.
