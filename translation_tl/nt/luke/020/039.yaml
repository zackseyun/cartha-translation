  yaml_path: translation/nt/luke/020/039.yaml
  text: Then some of the scribes answered[a], “Teacher, you have spoken well.”
translation:
  language: tl
  text: Sumagot naman ang ilan sa mga eskriba, “Guro, tama ang sinabi mo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: Sumagot
  rationale: Ang aorist participle ay likas na isinasalin sa Filipino bilang pangunahing pandiwang “sumagot,” na malinaw na nagpapakilalang tugon ito sa naunang sinabi ni Jesus.
- source_word: δέ
  choice: naman
  rationale: Ang “naman” ay banayad na panandang pandiskurso na angkop sa paglipat tungo sa tugon ng ilang tagapagturo, nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: τινες τῶν γραμματέων
  choice: ang ilan sa mga tagapagturo ng Kautusan
  rationale: 'Pinananatili ng “ilan sa mga” ang partitive na diwa: isang bahagi lamang ng pangkat ang tumugon.'
- source_word: γραμματέων
  choice: mga tagapagturo ng Kautusan
  rationale: Sa kontekstong Ebanghelyo, mas malinaw ito sa karaniwang mambabasang Filipino kaysa sa hiram na katawagang “mga eskriba,” habang ipinahahayag ang kinikilalang tungkulin nila bilang mga dalubhasa at guro ng Kautusan.
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Tuwirang katumbas ito ng bokatibong διδάσκαλε at natural sa makabagong Filipino.
- source_word: καλῶς
  choice: tama
  rationale: Sa konteksto, pinupuri ng mga nagsasalita ang kawastuhan ng sinabi ni Jesus. Natural sa Filipino ang “tama ang sinabi mo,” at saklaw nito ang diwang “nang wasto” o “mahusay.”
- source_word: εἶπας
  choice: ang sinabi mo
  rationale: Ang simpleng nagdaang anyo ay natural sa Filipino para sa aorist at malinaw na tumutukoy sa katatapos na pahayag ni Jesus.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “tagapagturo ng Kautusan” upang maging malinaw ang papel ng γραμματεῖς sa ordinaryong mambabasa; iniwasan ang mas teknikal at hindi gaanong transparent na “eskriba.”
