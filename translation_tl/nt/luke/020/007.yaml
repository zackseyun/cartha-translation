lexical_decisions:
- source_word: καὶ
  choice: Kaya
  rationale: Sa daloy ng salaysay, ipinahihiwatig nito ang bunga ng kanilang pag-uusap at mas natural kaysa sa mekanikal na “At.”
- source_word: ἀπεκρίθησαν
  choice: sumagot sila
  rationale: Tuwirang katumbas ng pandiwang nangangahulugang sumagot o tumugon.
- source_word: μὴ εἰδέναι
  choice: na hindi nila alam
  rationale: Ang pawatas ay gumaganap bilang di-tuwirang pahayag pagkatapos ng “sumagot”; natural itong ipinapahayag sa Tagalog sa sugnay na may “na.”
- source_word: πόθεν
  choice: kung saan iyon nagmula
  rationale: Pinananatili ang di-tiyak na diwa ng pinagmulan o bukal, habang ang “iyon” ay likas na tumutukoy sa naunang paksa sa konteksto.
