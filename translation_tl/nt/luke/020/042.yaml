  text: ⸂αὐτὸς γὰρ⸃ Δαυὶδ λέγει ἐν βίβλῳ ψαλμῶν· ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/042.yaml
  text: For David himself says in the Book of Psalms[a], ‘The Lord said to my Lord, “Sit at my right hand”’
translation:
  language: tl
  text: Sapagkat si David mismo ay nagsasabi sa Aklat ng mga Awit[a], “Sinabi ng Panginoon sa aking Panginoon, ‘Umupo ka sa kanan ko.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, ayon sa Hebreo ng Awit 110:1: “Sinabi ni YHWH sa aking Panginoon.”'
    reason: Ipinakikita ng alternatibong anyo na ang unang “Panginoon” sa Griyegong sipi ay kumakatawan sa banal na pangalang YHWH sa tekstong Hebreo.
lexical_decisions:
- source_word: αὐτὸς γὰρ
  choice: Sapagkat si David mismo
  rationale: Isinasalin ng “sapagkat” ang paliwanag na ipinapasok ng γάρ, at pinananatili ng “mismo” ang diin ng αὐτός.
- source_word: Δαυὶδ
  choice: David
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa makabagong Filipino.
- source_word: λέγει
  choice: ang nagsabi
  rationale: Bagaman pangkasalukuyan ang anyong Griyego sa pormula ng pagsipi, natural sa Filipino ang pangnagdaang “nagsabi” para sa nasusulat na pahayag; hindi nito binabago ang bisa ng sipi.
- source_word: ἐν βίβλῳ ψαλμῶν
  choice: sa Aklat ng mga Awit
  rationale: Tuwirang ipinahahayag ang βίβλος bilang “Aklat” at ang genitibong maramihan na ψαλμῶν bilang “ng mga Awit,” ayon sa kinikilalang pangalan ng aklat.
- source_word: Εἶπεν
  choice: Sinabi
  rationale: Ang aorist ay natural na isinalin bilang payak na pangnagdaan sa loob ng sipi.
- source_word: κύριος
  choice: ang Panginoon
  rationale: Sinusunod nito ang Griyegong κύριος at hindi tahasang ipinapalit sa pangunahing teksto ang banal na pangalang nasa Hebreong pinagmulan ng Awit 110:1.
- source_word: τῷ κυρίῳ μου
  choice: sa aking Panginoon
  rationale: Pinananatili ng “aking Panginoon” ang kahulugan at bigat ng κύριος nang hindi nilulutas ang teolohikal na tensiyon ng sipi.
- source_word: Κάθου
  choice: Umupo ka
  rationale: Likas at malinaw na pautos sa Filipino para sa imperatibo ng κάθημαι.
- source_word: ἐκ δεξιῶν μου
  choice: sa kanan ko
  rationale: Natural na katumbas sa Filipino ng idyomang tumutukoy sa marangal na puwesto sa kanang panig ng nagsasalita.
theological_decisions:
- issue: Ang unang κύριος sa sipi, samantalang YHWH ang nasa Hebreo ng Awit 110:1
  choice: ang Panginoon
  alternative: si YHWH / ang PANGINOON
  rationale: Ang pangunahing teksto ay sumusunod sa Griyegong SBLGNT na may κύριος. Inilalagay sa talababa ang Hebreong pagkakakilanlan upang mapanatili ang mahalagang intertekstuwal na impormasyon nang hindi pinapalitan ang salitang nasa Griyegong teksto.
- issue: Ang ikalawang κύριος sa siping may mesiyanikong kabuluhan
  choice: aking Panginoon
  alternative: aking panginoon / aking amo
  rationale: Ang “aking Panginoon” ay nagpapanatili sa leksikal at teolohikal na bigat ng κύριος at sa tensiyon ng argumento ni Jesus, nang hindi nagdaragdag ng tiyak na interpretasyong lampas sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” upang mapanatili ang ugnayang nagpapaliwanag sa naunang argumento, at “mismo” upang ihayag ang diin kay David. Ang bantas at panipi ay inayos para sa malinaw na sipi sa loob ng sipi.
