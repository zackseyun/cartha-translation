  text: And Jesus said to them[a], “The sons of this age marry and are given in marriage,”
translation:
  language: tl
  text: Sinabi ni Jesus sa kanila, “Ang mga tao ng kapanahunang ito[a] ay nag-aasawa at ipinag-aasawa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang mga anak na lalaki ng kapanahunang ito.” Sa Griyego, panlalaking anyo ang “mga anak na lalaki,” isang kinatawang pananalita para sa mga taong kabilang sa kasalukuyang kapanahunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay sa salaysay nang hindi nagdaragdag ng tiyak na diwang temporal gaya ng “Pagkatapos.”
- source_word: εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: sinabi sa kanila ni Jesus
  rationale: Tuwirang isinasalin ang karaniwang pandiwang λέγω at ang datibong αὐτοῖς; hindi ipinapalagay ng pandiwa mismo ang mas tiyak na “sumagot.”
- source_word: Οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: Ang mga anak ng kapanahunang ito
  rationale: Pinananatili ng “mga anak” ang Semitikong-Griyegong idyoma ng pag-aari o pagkakaugnay, habang ang “kapanahunan” ay naghahayag ng αἰών bilang kasalukuyang kaayusan sa kaibahan ng darating na kapanahunan.
- source_word: γαμοῦσιν
  choice: nag-aasawa
  rationale: Natural na modernong Tagalog para sa aktibong pandiwang tumutukoy sa pag-aasawa.
- source_word: γαμίσκονται
  choice: ibinibigay sa pag-aasawa
  rationale: Pinananatili ang pasibong anyo at ang pagkakaiba nito sa naunang aktibong γαμοῦσιν, bagaman hindi gaanong karaniwan ang ganitong pahayag sa modernong Tagalog.
theological_decisions:
- issue: Panlalaking anyong ginagamit bilang kinatawan sa pangkalahatang pahayag
  choice: Ang mga anak ng kapanahunang ito
  alternative: Ang mga tao sa kapanahunang ito
  rationale: Ang υἱοί ay literal na “mga anak na lalaki,” ngunit dito ay kinatawang katawagan sa mga kabilang sa kasalukuyang kapanahunan. Pinananatili ng “mga anak” ang anyo at idyoma nang hindi nililimitahan ang tinutukoy sa mga lalaki lamang; nililinaw ito sa talababa.
- issue: Ang αἰών bilang kategoryang eskatolohikal
  choice: kapanahunang ito
  alternative: mundong ito
  rationale: Mas tumpak na pinananatili ng “kapanahunan” ang paghahambing ng kasalukuyang kaayusan at ng darating na kapanahunan sa konteksto; maaaring ipakahulugan ng “mundo” ang pisikal na daigdig.
- issue: Pagkakaiba ng aktibo at pasibong pananalita tungkol sa pag-aasawa
  choice: nag-aasawa at ibinibigay sa pag-aasawa
  alternative: nag-aasawa
  rationale: Pinananatili ang dalawang magkaibang pandiwa at ang tensiyon ng sinaunang idyoma sa halip na pagsamahin ang mga ito sa isang neutral na parirala.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “kapanahunan” upang maging malinaw ang eskatolohikal na diwa ng αἰών. Ang “ibinibigay sa pag-aasawa” ay sadyang mas pormal upang mapanatili ang pasibong anyo ng Griyego.
