id: LUK.20.16
reference: Luke 20:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργοὺς τούτους, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις. ἀκούσαντες δὲ εἶπαν· Μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/016.yaml
  text: He will come and destroy these tenant farmers[a], and will give the vineyard to others.” But when they heard this, they said[b], “May it never be!”
translation:
  language: tl
  text: Darating siya at lilipulin ang mga magsasakang umuupa na ito[a], at ibibigay niya sa iba ang ubasan.” Ngunit nang marinig nila ito, sinabi nila, “Huwag nawang mangyari iyon!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga magsasaka” o “mga nangungupahan.” Ang salitang Griyego ay tumutukoy rito sa mga nagsasaka ng lupang pag-aari ng iba.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Hinding-hindi!” o “Huwag naman!” Ang pananalitang Griyego ay mariing pagtutol; sa literal, “Huwag nawang mangyari.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεύσεται
  choice: Darating siya
  rationale: Tuwirang katumbas ng panghinaharap na anyo ng ἔρχομαι; hindi idinagdag ang diwa ng ‘babalik,’ na hindi tahasang nasa Griyego.
- source_word: ἀπολέσει
  choice: lilipulin
  rationale: Ipinahahayag ang matinding paghatol ng ἀπόλλυμι habang hindi nililimitahan ang kahulugan sa paraan lamang ng pagpatay.
- source_word: γεωργοὺς
  choice: mga magsasakang umuupa
  rationale: Sa talinghaga, tumutukoy ito sa mga nagsasaka ng lupa o ubasang pag-aari ng iba; nililinaw ng ‘umuupa’ ang kanilang papel nang hindi ginagawang sila ang may-ari.
- source_word: τούτους
  choice: na ito
  rationale: Pinananatili ang malapit at tuwirang pagtukoy ng demonstratibong Griyego sa mga magsasakang pinag-uusapan.
- source_word: δώσει
  choice: ibibigay niya
  rationale: Likas at payak na salin ng δίδωμι; hindi idinaragdag ang mas tiyak na interpretasyong ‘ipagkakatiwala.’
- source_word: τὸν ἀμπελῶνα
  choice: ang ubasan
  rationale: Karaniwan, malinaw, at natural na katumbas na nagpapanatili sa larawan ng talinghaga.
- source_word: ἄλλοις
  choice: sa iba
  rationale: Pinananatiling di-tiyak kung sinu-sino ang mga tatanggap, gaya ng orihinal.
- source_word: ἀκούσαντες δὲ εἶπαν
  choice: Ngunit nang marinig nila ito, sinabi nila
  rationale: Ginagawang natural na sugnay na panahunan ang aorist participle at pinananatili ang panandang pagsalungat na δέ.
- source_word: Μὴ γένοιτο
  choice: Huwag nawang mangyari iyon!
  rationale: Pinananatili ang anyong tila matinding kahilingan o pagtutol ng optative, hindi lamang isang payak na lohikal na pagtanggi.
theological_decisions:
- issue: Tindi at anyo ng tugon na Μὴ γένοιτο
  choice: Huwag nawang mangyari iyon!
  alternative: Hinding-hindi! / Huwag naman!
  rationale: Ipinapakita ng napiling salin ang nabigla at mariing pagtutol sa ipinahayag na paghatol, habang pinananatili ang wish-like na anyo ng Griyego at hindi nagdaragdag ng paliwanag na doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang ‘ubasan’ bilang natural na terminong biblikal at pangkaraniwan. Ang ‘mga magsasakang umuupa’ ay bahagyang nagpapaliwanag sa katayuang panlipunan ng γεωργοί, na sinusuportahan ng talababa. Parehong marker na [a] at [b] ay nasa pangunahing teksto.
