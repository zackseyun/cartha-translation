  text: Τὸ βάπτισμα Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/004.yaml
  text: Was John's baptism from heaven or from men?[a]
translation:
  language: tl
  text: Ang bautismo ni Juan ba ay mula sa langit o mula sa mga tao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa Diyos.” Sa literal na Griyego, “mula sa langit,” isang mapitagang paraan ng pagtukoy sa banal na pinagmulan o kapahintulutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: bautismo
  rationale: Tumutukoy ang pangngalan sa ritwal o gawaing kaugnay ni Juan; ang “bautismo” ang karaniwan at tiyak na katumbas sa Filipino.
- source_word: Ἰωάννου
  choice: ni Juan
  rationale: Likas na ipinapahayag sa Filipino ng panandang “ni” ang genitibong nagsasaad ng bautismong kaugnay ni Juan.
- source_word: ἐξ οὐρανοῦ
  choice: mula sa langit
  rationale: Pinananatili nito ang literal na pananalita at mapitagang idyomang Judio, sa halip na tahasang ipakahulugang “mula sa Diyos.”
- source_word: ἐξ ἀνθρώπων
  choice: mula sa mga tao
  rationale: Ang ἀνθρώπων ay pangkalahatang tumutukoy sa mga tao, hindi lamang sa mga lalaki, at ipinapakita ang kaibahan ng makalangit o banal na pinagmulan sa pinagmulan lamang sa tao.
- source_word: ἦν
  choice: ba ay
  rationale: Ipinahihiwatig ng ayos na “ba ay mula” ang kopulang ἦν sa isang likas na tanong sa Filipino; hindi na kailangang isalin nang hiwalay bilang “noon” dahil hindi nakatuon ang pahayag sa panahunan.
- source_word: ἢ
  choice: o
  rationale: Karaniwang pangatnig na naghihiwalay sa dalawang mapagpipiliang sagot.
theological_decisions:
- issue: Kahulugan ng “mula sa langit” kaugnay ng bautismo ni Juan
  choice: Panatilihin sa pangunahing teksto ang “mula sa langit.”
  alternative: mula sa Diyos
  rationale: Ipinahihiwatig ng parirala ang banal na pinagmulan o kapahintulutan, ngunit tahasang “langit” ang nasa Griyego. Pinananatili ng salin ang idyoma at ang pagkakasabi ng teksto nang hindi agad nilulutas ang ipinahihiwatig nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga tao” sa halip na “mga lalaki” sapagkat pangkalahatan ang saklaw ng ἀνθρώπων. Nasa pangunahing teksto ang lahat ng marker ng talababa.
