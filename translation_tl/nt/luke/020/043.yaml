  text: ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/043.yaml
  text: until I make your enemies a footstool for your feet[a].
translation:
  language: tl
  text: hanggang sa gawin kong tuntungan ng iyong mga paa ang iyong mga kaaway.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “hanggang sa ilagay ko ang iyong mga kaaway bilang tuntungan ng iyong mga paa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἂν
  choice: hanggang sa
  rationale: Likas na ipinahahayag sa Tagalog ang hangganan ng kilos na inaasahang magaganap; hindi kailangang palawakin pa.
- source_word: θῶ
  choice: gawin kong
  rationale: Bagaman pangunahing nangangahulugang “ilagay” ang τίθημι, ang resultative na diwa ng idyoma rito ay natural na naipapahayag sa “gawin kong … tuntungan.”
- source_word: τοὺς ἐχθρούς σου
  choice: ang iyong mga kaaway
  rationale: Tuwirang pinananatili ang maramihang pangngalan at ang panghalip na paari, nang hindi pinahihina ang diwa ng pagkapoot.
- source_word: ὑποπόδιον
  choice: tuntungan
  rationale: Ang “tuntungan” ay likas, malinaw, at marangal na katumbas ng footstool sa konteksto ng talinghaga ng paghahari at pagpapasakop.
- source_word: τῶν ποδῶν σου
  choice: ng iyong mga paa
  rationale: Pinananatili nito ang literal na ugnayang genitive ng Griyego at ang larawan ng tuntungan, sa halip na ipaliwanag bilang “sa ilalim ng iyong mga paa.”
theological_decisions:
- issue: Larawan ng pagpapasakop sa sipi mula sa Awit 110:1
  choice: Panatilihin ang talinghagang “gawin kong tuntungan ng iyong mga paa ang iyong mga kaaway.”
  alternative: hanggang sa ilagay ko ang iyong mga kaaway sa ilalim ng iyong mga paa
  rationale: Pinananatili ng salin ang maharlika at mesiyanikong larawan nang hindi tahasang pinapakahulugan ito bilang ganap na pagkatalo o dominasyon.
translation_notes:
  register: Makabagong Filipino Tagalog na natural at marangal. Ginamit ang “tuntungan” upang mapanatili ang kongkretong talinghaga; ang bahagyang mas literal na anyo ng τίθημι ay inilagay sa talababa.
