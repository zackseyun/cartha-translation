  source_fidelity: Tumpak na naipapahayag ng “hanggang sa gawin kong tuntungan ng iyong mga paa ang iyong mga kaaway” ang ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου. Nananatili ang pananaw na “ako” ang kikilos, ang terminong “hanggang sa,” ang maramihang “mga kaaway,” at ang metaporang tuntungan nang walang dagdag na pagpapakahulugan.
