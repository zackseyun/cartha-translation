id: LUK.20.46
reference: Luke 20:46
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Προσέχετε ἀπὸ τῶν γραμματέων τῶν θελόντων περιπατεῖν ἐν στολαῖς καὶ φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς καὶ πρωτοκλισίας ἐν τοῖς δείπνοις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/046.yaml
  text: Beware of the scribes[a], who want to walk around in long robes, and who love greetings in the marketplaces and the best seats in the synagogues and places of honor at banquets[d][c][b],
translation:
  language: tl
  text: “Mag-ingat kayo sa mga eskriba[a] na gustong magpalakad-lakad na nakasuot ng mahahabang damit[b], at mahilig sa mga pagbati sa mga pamilihan, sa mga pangunahing upuan[c] sa mga sinagoga, at sa mga mararangal na puwesto[d] sa mga handaan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring isalin ang simula: “Magbantay kayo laban sa mga eskriba.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “mahahabang damit” ay mga kasuotang kapansin-pansin at maaaring magpahiwatig ng mataas na katayuan.
    reason: cultural_note
  - marker: c
    text: Maaari ring “mga upuan ng karangalan” sa mga sinagoga.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “mga pangunahing puwesto” o “mga puwesto ng karangalan” sa mga handaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Mag-ingat kayo sa
  rationale: Likas na babalang Filipino ito para sa pangmaramihang pautos at pinananatili ang diwang magbantay laban sa tinutukoy na pangkat.
- source_word: γραμματέων
  choice: mga eskriba
  rationale: Pinananatili ang natatanging katawagan sa makasaysayang pangkat sa halip na palawakin agad ito bilang lahat ng tagapagturo ng Kautusan; ipinaliliwanag sa talababa.
- source_word: τῶν θελόντων περιπατεῖν
  choice: Gusto nilang magpalakad-lakad
  rationale: Ipinahahayag ang kusang pagnanais at ang paulit-ulit na pagpapakita sa publiko, hindi lamang simpleng paglalakad.
- source_word: ἐν στολαῖς
  choice: na nakasuot ng mahahabang damit
  rationale: Ang στολή ay mahabang damit o balabal na maaaring magpahiwatig ng katayuan; malinaw at natural ang parirala sa Filipino.
- source_word: φιλούντων ἀσπασμοὺς
  choice: gustong-gusto nilang parangalan ng mga pagbati
  rationale: Ang mga pagbati rito ay pampublikong pagkilala na may pagpaparangal, hindi karaniwang pagbati lamang; ang 'gustong-gusto' ay nagpapanatili sa diin ng φιλούντων.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: sa mga pamilihan
  rationale: Tumutukoy sa mga pampublikong pook ng kalakalan at pagtitipon, kung saan kapansin-pansin ang gayong pagkilala.
- source_word: πρωτοκαθεδρίας
  choice: mga pangunahing upuan
  rationale: Inilalarawan ang mga upuang may pinakamarangal na katayuan sa sinagoga nang hindi ipinapalagay na pinakamalapit o pinakakomportable ang mga ito.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: sa mga sinagoga
  rationale: Karaniwang salin sa natatanging lugar ng pagtitipon at pagsamba ng mga Judio.
- source_word: πρωτοκλισίας
  choice: mga lugar ng karangalan
  rationale: Ipinahahayag ang panlipunang ranggo ng pinakamahalagang puwesto sa isang handaan, sa halip na literal na ilarawan ang sinaunang paghilig sa hapag.
- source_word: ἐν τοῖς δείπνοις
  choice: sa mga handaan
  rationale: Ang konteksto ay mga piging o pormal na salu-salo kung saan may mga puwestong nagpapakita ng ranggo.
theological_decisions:
- issue: Saklaw ng babala laban sa mga eskriba
  choice: Pinanatili ang 'mga eskriba' bilang pangkat na inilalarawan ng kasunod na mga gawi.
  alternative: Sabihing tahasang 'ang mga eskribang gumagawa ng mga ito,' na maaaring magpaliit sa saklaw; o ipahiwatig na bawat eskriba ay hinahatulan nang walang pagtatangi.
  rationale: Sa Griyego, ang tiyak na pangkat na 'mga eskriba' ay sinusundan ng mga pandiwaring naglalarawan sa kanilang paghahangad ng pagpapakita at karangalan. Hindi dapat dagdagan ng salin ang hatol, ngunit hindi rin dapat pahinain ang tuwirang babala.
- issue: Diwa ng pampublikong pagbati
  choice: Isinalin bilang pagpaparangal sa pamamagitan ng mga pagbati.
  alternative: Karaniwang pakikipagbatian lamang sa pamilihan.
  rationale: Sa pagkakahanay nito sa mga pangunahing upuan at lugar ng karangalan, ang ἀσπασμοί ay may diwa ng pagkilalang panlipunan. Ginawang hayag ang diwang ito nang hindi tinutukoy ang isang partikular na titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “eskriba” upang mapanatili ang makasaysayang katawagan, na may maikling paliwanag sa talababa. Ang “gustong-gusto,” “parangalan,” at “mga lugar ng karangalan” ay natural sa kasalukuyang gamit at pinananatili ang matinding puna sa paghahangad ng pampublikong katayuan.
