  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, ⸂ὁ λαὸς ἅπας⸃ καταλιθάσει ἡμᾶς, πεπεισμένος γάρ ἐστιν Ἰωάννην προφήτην εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/006.yaml
  text: But if we say, ‘From men,’ all the people will stone us, for they are convinced that John was a prophet.
translation:
  language: tl
  text: Ngunit kung sasabihin natin, ‘Mula sa mga tao,’ babatuhin tayo ng lahat ng tao, sapagkat kumbinsido silang isang propeta si Juan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: Ngunit kung sasabihin natin
  rationale: Likas na kondisyonal sa Filipino ang “kung sasabihin natin,” at malinaw na naipapahayag ng “ngunit” ang pagsalungat ng δέ sa naunang posibilidad.
- source_word: Ἐξ ἀνθρώπων
  choice: Mula sa mga tao
  rationale: Pinananatili nito ang maikli at eliptikong anyo ng Griyego, na tumutukoy sa pinagmulan ng bautismo o awtoridad ni Juan nang hindi dinaragdagan ng paliwanag.
- source_word: ὁ λαὸς ἅπας
  choice: ang buong bayan
  rationale: Ang “buong bayan” ay natural na kolektibong pahayag sa Filipino at naipapakita ang masaklaw na diin ng ἅπας.
- source_word: καταλιθάσει ἡμᾶς
  choice: babatuhin tayo
  rationale: Tuwirang ipinapahayag ang pagbato nang hindi idinaragdag ang “hanggang mamatay,” na hindi tahasang sinabi sa talata.
- source_word: πεπεισμένος γάρ ἐστιν
  choice: sapagkat kumbinsido sila
  rationale: Bagaman pang-isahan ang anyong Griyego dahil kolektibo ang paksa, natural sa Filipino ang pangmaramihang “sila” bilang pagtukoy sa buong bayan.
- source_word: Ἰωάννην προφήτην εἶναι
  choice: isang propeta si Juan
  rationale: Natural na sugnay na nominal sa Filipino; hindi nito kailangang tukuyin kung “is” o “was,” kaya napapanatili ang kawalan ng tahasang panahunan sa infinitibong εἶναι.
theological_decisions:
- issue: Panahunan ng pagkilala ng bayan kay Juan bilang propeta
  choice: isang propeta si Juan
  alternative: isang propeta noon si Juan / isang propeta ngayon si Juan
  rationale: Hindi tahasang nagtatakda ng panahunan ang εἶναι. Ang karaniwang sugnay na nominal sa Filipino ay likas na nagpapanatili sa ambiguwidad sa halip na ipilit ang nakaraan o kasalukuyan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling siping “Mula sa mga tao” dahil umaasa ito sa tanong tungkol sa pinagmulan ng bautismo ni Juan sa nakapaligid na konteksto.
