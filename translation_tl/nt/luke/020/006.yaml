  source_fidelity: Ang kondisyonal na “Ngunit kung sasabihin natin,” at ang eliptikong siping “Mula sa mga tao” ay tapat sa ἐὰν δὲ εἴπωμεν at Ἐξ ἀνθρώπων. Ang “isang propeta si Juan” ay mahusay na pinananatili ang hindi tahasang panahunan ng Griyegong infinitive εἶναι. Gayunman, ang “buong bayan” ay maaaring tumukoy sa isang bayan/lungsod o sa bansa, samantalang ὁ λαὸς ἅπας ay ang kabuuan ng mga taong naroon. Ang “lahat ng tao” ang mas tuwirang katumbas sa kontekstong ito.
  naturalness: Natural at malinaw ang pangungusap. Mas karaniwan at mas tiyak sa modernong Filipino ang “lahat ng tao” kaysa “buong bayan” para sa kolektibong karamihan ng mga tao. Ang “kumbinsido silang isang propeta si Juan” ay katanggap-tanggap at likas.
  terminology: Wasto ang “mga tao,” “babatuhin,” at “propeta.” Hindi kailangang magdagdag ng “hanggang mamatay,” dahil hindi ito tahasang ipinapahayag sa teksto. Walang footnote na kailangan; ang nominal na sugnay sa Filipino ay sapat na nagpapanatili sa ambiguwidad ng panahunan.
