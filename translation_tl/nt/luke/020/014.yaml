id: LUK.20.14
reference: Luke 20:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἰδόντες δὲ αὐτὸν οἱ γεωργοὶ διελογίζοντο πρὸς ⸀ἀλλήλους λέγοντες· Οὗτός ἐστιν ὁ κληρονόμος· ⸀ἀποκτείνωμεν αὐτόν, ἵνα ἡμῶν γένηται ἡ κληρονομία·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/014.yaml
  text: But when the vine-growers saw him[a], they reasoned with one another, saying, ‘This is the heir. Let us kill him, so that the inheritance may become ours.’
translation:
  language: tl
  text: Ngunit nang makita siya ng mga magsasaka ng ubasan[a], nag-usap-usap sila at sinabi, “Ito ang tagapagmana. Patayin natin siya upang mapasaatin ang mana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga magsasaka” o “mga nangungupahan.” Ang salitang Griyego ay tumutukoy sa mga manggagawang nagsasaka; sa talinghagang ito, nagtatrabaho sila sa isang ubasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: mga magsasaka ng ubasan
  rationale: Ang pangngalan ay tumutukoy sa mga manggagawang nagsasaka; nililinaw ng tagpo ng talinghaga na ubasan ang kanilang sinasaka. Hindi idinagdag sa pangunahing teksto ang legal na diwa ng “mga nangungupahan,” bagaman ipinahihiwatig iyon ng mas malawak na konteksto.
- source_word: διελογίζοντο πρὸς ἀλλήλους
  choice: nag-usap-usap sila
  rationale: Ipinahahayag nito ang kanilang magkakatugong pagtalakay at pagpapasya. Natural ito sa modernong Tagalog at hindi nagdaragdag ng diwang pagtatalo na hindi tahasang nasa Griyego.
- source_word: κληρονόμος
  choice: tagapagmana
  rationale: Ito ang karaniwan at malinaw na katumbas para sa taong may karapatang tumanggap ng mana.
- source_word: ἀποκτείνωμεν
  choice: Patayin natin
  rationale: Pinananatili nito ang tuwirang hortatoryong diwa ng unang panauhang maramihan. Hindi ginamit ang “paslangin” upang hindi magdagdag ng leksikal na pagsusuring moral na hindi tahasang nakapaloob sa pandiwa.
- source_word: ἵνα ἡμῶν γένηται ἡ κληρονομία
  choice: upang mapasaatin ang mana
  rationale: Pinananatili ng “upang” ang layunin ng ἵνα, at ipinahahayag ng “mapasaatin” ang pagbabagong nilalayon sa γένηται nang natural sa Tagalog.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita nito ang bahagyang pagsalungat at pagliko ng salaysay sa pagdating ng tagapagmana.
- source_word: ἰδόντες
  choice: nang makita
  rationale: Isinasalin ang aorist participle bilang sugnay na temporal, na malinaw at natural sa Tagalog.
theological_decisions:
- issue: Tawag sa γεωργοὶ sa konteksto ng ubasan
  choice: mga magsasaka ng ubasan
  alternative: mga nangungupahan; mga magsasaka
  rationale: Direktang isinasalin ang leksikal na diwa ng γεωργοί at kasabay na pinananatili ang tiyak na tagpo ng ubasan. Ang papel nila bilang mga nangungupahan ay makikita sa mas malawak na talinghaga, ngunit hindi iyon ang tahasang kahulugan ng pangngalan mismo sa talatang ito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nag-usap-usap” para sa madaling maunawaang sama-samang pagtalakay, at ang “mapasaatin” upang mapanatili ang diwa ng pagkamkam sa mana nang hindi nagiging mabigat ang pangungusap.
