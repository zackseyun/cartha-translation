base_translation:
  language: en
  yaml_path: translation/nt/luke/020/018.yaml
  text: Everyone who falls on that stone will be broken to pieces[a], but the one on whom it falls[b], it will crush him.
translation:
  language: tl
  text: Ang sinumang bumagsak sa batong iyon ay madudurog[a]; ngunit ang sinumang mabagsakan ng batong iyon ay dudurugin nito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “magkakadurug-durog.”
    reason: lexical_alternative
  - marker: b
    text: O, “dudurugin hanggang maging pulbos” o “ikakalat siya na parang ipa”; mas matindi kaysa sa karaniwang pagtama lamang ang diwa ng pandiwang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ πεσὼν
  choice: Ang sinumang bumagsak
  rationale: Ang substantival na participle ay may pangkalahatang diwa. Likas sa makabagong Tagalog ang “sinumang” at napapanatili nito ang saklaw na tumutukoy sa bawat taong kabilang sa kalagayang ito.
- source_word: ἐπ’ ἐκεῖνον τὸν λίθον
  choice: sa batong iyon
  rationale: Ipinapahayag ng ἐπί na may accusative kasunod ng πίπτω ang pagbagsak patungo sa o sa ibabaw ng bato. Ang “sa batong iyon” ay natural at pinananatili ang demonstratibong diin ng ἐκεῖνον.
- source_word: συνθλασθήσεται
  choice: ay madudurog
  rationale: Ang pandiwa ay nagsasaad ng pagkabasag o pagkadurog. Malinaw at matindi ang “madudurog” nang hindi nagdaragdag ng tiyak na paraang wala sa teksto.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: ngunit ang sinumang mabagsakan nito
  rationale: 'Ang relative clause na may ἄν at aorist subjunctive ay nagpapahayag ng di-tiyak na kondisyon: sinuman ang bagsakan nito. Ang ayos na ito ay natural sa Tagalog at pinananatili ang pagkakatapat ng dalawang sugnay.'
- source_word: λικμήσει
  choice: ay dudurugin nito
  rationale: Maaaring tumukoy ang λικμάω sa pagdurog o sa pagkalat na parang ipa sa pagtatahip. Ang “dudurugin” ang pinakamalinaw na pangunahing salin sa larawang ito ng matinding paghatol, habang inilalahad sa talababa ang mas matitinding posibleng nuances.
- source_word: αὐτόν
  choice: ang sinumang mabagsakan nito
  rationale: Sa Tagalog, hindi kailangang ulitin ang panlalaking panghalip upang mapanatili ang generic singular na tinutukoy. Ang topicalized na parirala ang malinaw na layon ng “dudurugin,” nang hindi binabago ang pangkalahatang saklaw.
theological_decisions:
- issue: Larawan ng bato bilang tagapagdala ng paghatol
  choice: Pinanatili ang bato bilang sanhi ng matinding pagkadurog at hindi pinalambot ang dalawang pandiwa.
  alternative: Isalin ang larawan bilang simpleng pagkatisod o bahagyang pinsala.
  rationale: Sa konteksto, ang bato mula sa naunang sipi ay larawan ng tiyak at mapaminsalang paghatol. Malubha ang συνθλασθήσεται at λικμήσει, kaya hindi dapat pahinain ang kanilang puwersa.
- issue: Generic masculine na reperensiya
  choice: Gumamit ng “sinumang,” na likas na walang markang kasarian sa Tagalog.
  alternative: Magpasok ng panlalaking panghalip gaya ng “siya” o “lalaking iyon.”
  rationale: Bagaman masculine singular ang αὐτόν sa Griyego, generic ang tinutukoy nito. Naipahahayag ng “sinumang” ang parehong generic singular nang walang di-kinakailangang pagdaragdag ng kasarian sa Tagalog.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang magkatapat na “bumagsak” at “mabagsakan” upang maipakita ang pagbabaligtad ng kilos sa dalawang sugnay. Ang pag-uulit ng “nito” ay sadyang nagpapanatiling malinaw na ang bato ang bumabagsak at dumudurog sa ikalawang sugnay.
