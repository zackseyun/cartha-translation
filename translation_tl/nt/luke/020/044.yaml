id: LUK.20.44
reference: Luke 20:44
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Δαυὶδ οὖν ⸂αὐτὸν κύριον⸃ καλεῖ, καὶ πῶς ⸂αὐτοῦ υἱός⸃ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/044.yaml
  text: David therefore calls him Lord[a], so how is he his son?
translation:
  language: tl
  text: Tinatawag nga siya ni David na Panginoon; kaya paano siya anak ni David?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inapo ni David.” Ang salitang Griyego ay tahasang “anak,” ngunit maaari rin itong tumukoy sa isang inapo sa angkan o dinastiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: David
  rationale: Ginamit ang karaniwang anyo ng pangalang Δαυίδ sa modernong Filipino.
- source_word: οὖν
  choice: nga
  rationale: Ipinahihiwatig ng οὖν ang kongklusyon mula sa naunang sipi. Likas sa Filipino ang “nga” sa posisyong ito upang ipakita ang inferensiya nang hindi pinabibigat ang pangungusap.
- source_word: αὐτὸν κύριον
  choice: siya na Panginoon
  rationale: Sa pariralang “tinatawag siya … na Panginoon,” tuwirang naipapahayag ang καλεῖ αὐτὸν κύριον. Pinananatili ng “Panginoon” ang dangal at bigat ng κύριος sa mesiyanikong argumento.
- source_word: καλεῖ
  choice: tinatawag
  rationale: Tuwirang katumbas ito ng pangkasalukuyang καλεῖ at natural sa Filipino sa konstruksyong “tinatawag … na.”
- source_word: καὶ πῶς
  choice: kaya paano
  rationale: Sa konteksto, ang καί ay nag-uugnay sa retorikal na tanong sa naunang pahayag. Ang “kaya paano” ay natural na nagpapakita ng lohikal na ugnayan sa Filipino.
- source_word: αὐτοῦ υἱός
  choice: anak ni David
  rationale: Pinananatili ang tahasang salitang υἱός bilang “anak.” Inulit ang “David” sa halip na gumamit ng malabong panghalip upang maging malinaw at natural sa Filipino.
- source_word: ἐστιν
  choice: siya anak
  rationale: Sa Filipino, natural na walang tahasang copula sa pangkasalukuyang pangungusap; ang “paano siya anak” ay tapat sa diwang “how is he his son?”
theological_decisions:
- issue: Pagsasalin ng κύριος sa mesiyaniko at Kristolohikal na argumento
  choice: Panginoon
  alternative: Guro o pinuno
  rationale: Ang “Panginoon” ang pinakamalapit na kinikilalang katumbas at pinananatili nito ang kataasan at paggalang na mahalaga sa argumento, nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- issue: Kung palalawakin ang υἱός bilang “inapo”
  choice: anak ni David
  alternative: inapo ni David
  rationale: Tahasan ang salitang Griyego na υἱός, “anak.” Maaaring taglay nito ang dinastiko o pangangkanang diwa, ngunit ang pagpapanatili sa “anak” ay hindi nagpapalabo sa mismong tensiyong bumubuo sa retorikal na tanong.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Pinanatili ang maikli at matalim na anyo ng retorikal na tanong, gayundin ang teolohikal na tensiyon sa pagitan ng “Panginoon” at “anak ni David.”
