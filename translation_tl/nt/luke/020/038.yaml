  text: He is not God of the dead[a], but of the living, for all live to him.
translation:
  language: tl
  text: Hindi siya Diyos ng mga patay kundi ng mga buháy, sapagkat sa kanya ay buhay silang lahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sapagkat sa harap niya ay buhay silang lahat.”
    reason: Ipinapakita ang alternatibong natural na pagpapakahulugan sa datibong αὐτῷ at sa pandiwang ζῶσιν.
lexical_decisions:
- source_word: θεὸς
  choice: Diyos
  rationale: Tiyak ang kahulugan ng anarthrous θεός sa kontekstong monoteistiko ng mga Judio; natural at tumpak ang “Diyos.”
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang pang-ugnay ang δέ. Naipahihiwatig na ng balangkas na “hindi ... kundi” ang paglipat at pagsalungat, kaya hindi kailangan ang dagdag na panimulang salita.
- source_word: νεκρῶν
  choice: mga patay
  rationale: Substantival ang pang-uri at idiomatiko ang genitibong pariralang “Diyos ng mga patay.”
- source_word: ζώντων
  choice: mga buháy
  rationale: Substantival ang participle; pinananatili ng “mga buháy” ang maikli at tuwirang pagsalungat sa “mga patay.”
- source_word: πάντες
  choice: silang lahat
  rationale: Pinananatili nito ang malawak ngunit hindi labis na tinutukoy na saklaw ng πάντες; sa konteksto, kabilang dito ang mga patriyarkang tinatalakay.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ng pariralang ito ang siksik at relasyonal na diwa ng datibo nang hindi ito nililimitahan sa layuning “para sa kanya” o sa lokatibong “nasa kanya.”
- source_word: ζῶσιν
  choice: nabubuhay
  rationale: Tuwirang ipinapahayag nito ang present active indicative at natural itong gamitin sa Filipino sa pangkalahatang pahayag.
theological_decisions:
- issue: Diwa ng αὐτῷ sa πάντες γὰρ αὐτῷ ζῶσιν
  choice: sapagkat sa kanya, silang lahat ay nabubuhay
  alternative: sapagkat sa harap niya, silang lahat ay buháy
  rationale: Inilalagay sa unahan ang “sa kanya” upang idiin ang relasyong tinutukoy ng datibo, habang iniiwasang ipakahulugang tiyak na “nabubuhay para sa kanya.” Nananatili ang teolohikal na tensiyon at ang argumento tungkol sa muling pagkabuhay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buháy” na may tuldik upang madaling maiba sa pagbasa na “búhay,” lalo na sa magkatapat na “mga patay” at “mga buháy.”
