  text: ⸀Δείξατέ μοι δηνάριον· τίνος ἔχει εἰκόνα καὶ ἐπιγραφήν; ⸀ἀποκριθέντες δὲ εἶπαν· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/024.yaml
  text: Show me a denarius. Whose image and inscription does it have? And they answered[a], 'Caesar's.'
translation:
  language: tl
  text: “Ipakita ninyo sa akin ang isang denario.[a] Kaninong larawan at inskripsiyon ito?” Sumagot sila, “Kay Cesar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang denario ay baryang Romano na karaniwang ginagamit noong panahong iyon. Pinanatili rito ang pangalan ng barya upang maipakita ang makasaysayang konteksto.
    reason: cultural_note
lexical_decisions:
- source_word: Δείξατέ μοι
  choice: Ipakita ninyo sa akin
  rationale: Pinananatili ang tuwirang utos ng aorist imperative at natural ito sa makabagong Tagalog; ang anyong maramihan ay tumutugma sa pandiwang Griyego.
- source_word: δηνάριον
  choice: isang denario
  rationale: Pinananatili ang tiyak na pangalan ng baryang Romano upang mapangalagaan ang makasaysayang konteksto.
- source_word: τίνος
  choice: Kaninong
  rationale: Likas na Tagalog na katumbas ng genitive interrogative na nagtatanong kung kanino nauugnay ang larawan at inskripsiyon.
- source_word: εἰκόνα
  choice: larawan
  rationale: Malinaw at karaniwang katumbas ng εἰκών, lalo na para sa larawang nakatatak sa barya.
- source_word: ἐπιγραφήν
  choice: pangalan ang nakaukit
  rationale: Sa baryang ito, tumutukoy ang salita sa nakasulat na inskripsiyon o legend. Ang 'pangalan ang nakaukit' ay madaling maunawaan at angkop sa maikling sagot na 'Kay Cesar,' nang hindi dinaragdagan ang tinutukoy na pangalan.
- source_word: ἀποκριθέντες δὲ εἶπαν
  choice: Sumagot sila
  rationale: Natural na pagsasalin sa Tagalog ng participle-plus-finite-verb construction at pinananatili ang daloy ng salaysay.
- source_word: Καίσαρος
  choice: Kay Cesar
  rationale: Pinananatili ang maikli at eliptikal na sagot sa Griyego; natural itong tugon sa tanong na 'Kaninong...?'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ninyo” dahil maramihan ang utos sa Griyego. Ang “Cesar” ay pinanatili bilang pamagat/pangalan ng emperador sa kontekstong Romano.
