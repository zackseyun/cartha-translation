  verdict: revise
  source_fidelity: Ang unang pangungusap ay wastong naghahatid ng tanong tungkol sa katayuang asawa sa muling pagkabuhay. Gayunman, ang ayos na “magiging asawa siya ng alin sa kanila” ay hindi gaanong tuwirang tumutugon sa τίνος αὐτῶν γίνεται γυνή. Ang binagong “kaninong asawa magiging ang babae” ay mas malinaw na pinananatili ang “whose wife” at ang tahasang paksa na ἡ γυνή. Sa huling pangungusap, pinananatili ang diwang ang pito ang may babae bilang asawa, nang hindi ipinapalit ang pandiwang “pinakasalan” sa pangunahing teksto.
  naturalness: Mas natural at marangal sa makabagong Filipino ang “kaninong asawa magiging ang babae?” kaysa “magiging asawa siya ng alin sa kanila?” Ang “Sa muling pagkabuhay” ay malinaw at angkop sa rehistro.
  terminology: Ang “muling pagkabuhay” ay angkop na katumbas ng ἀνάστασις at hindi nagdaragdag ng “ng mga patay.” Ang “asawa” ay tama para sa predicative γυνή sa tanong at sa idiom na ἔσχον αὐτὴν γυναῖκα. Ginamit ang “babae” sa unang pagbanggit upang mapanatili ang hayag na ἡ γυνή.
  issues:
  - severity: medium
    issue: Hindi gaanong idiomatiko at hindi pinakatumpak ang “magiging asawa siya ng alin sa kanila.”
    rationale: Ang τίνος αὐτῶν ay genitive na nagtatanong kung kanino siya magiging asawa (“kaninong asawa”), hindi pangunahin kung alin ang magiging asawa niya. Ang “kaninong asawa magiging ang babae” ay mas tapat at mas natural.
  - severity: low
    issue: Kailangang linawin ang literal na talababa upang hindi magmukhang karaniwang Filipino ang di-idiomatikong “nagkaroon sa kaniya bilang asawa.”
    rationale: Maaaring ilahad ito bilang literal na salin at bigyan ng mas natural na alternatibo, habang hindi binabago ang pangunahing diwa.
