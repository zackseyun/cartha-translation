  yaml_path: translation/nt/luke/020/033.yaml
  text: In the resurrection[a], then[c][b], whose wife does the woman become? For the seven had her as wife.
translation:
  language: tl
  text: Kaya, sa muling pagkabuhay, kaninong asawa magiging ang babae? Sapagkat naging asawa siya ng pito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Sapagkat ang pito ay nagkaroon sa kaniya bilang kanilang asawa.” Maaari ring isalin: “Sapagkat pinakasalan siya ng pito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: siya
  rationale: Tinutukoy ng panghalip ang babaeng sentro ng naunang salaysay; natural sa Filipino ang panghalip kaysa ulitin ang “babae.”
- source_word: οὖν
  choice: kaya
  rationale: Ipinahihiwatig nito ang kongklusyon o kasunod na hakbang sa pangangatwiran ng mga Saduceo.
- source_word: ἐν τῇ ἀναστάσει
  choice: sa muling pagkabuhay
  rationale: Tuwirang pinananatili ang wikang tumutukoy sa resurrection nang walang idinagdag na paliwanag na teolohikal.
- source_word: τίνος αὐτῶν
  choice: ng alin sa kanila
  rationale: Sa natural na Filipino, malinaw nitong ipinapahayag kung kanino sa pitong lalaki iuugnay ang babae bilang asawa.
- source_word: γίνεται γυνή
  choice: magiging asawa
  rationale: Pinananatili ng “magiging” ang resultative na diwa ng γίνεται, at ng “asawa” ang malinaw na marital na kahulugan ng γυνή.
- source_word: οἱ γὰρ ἑπτὰ
  choice: sapagkat ... ang pito
  rationale: Malapit ito sa tiyak na “the seven” ng Griyego at hindi nagdaragdag ng tahasang “lahat.”
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: naging asawa siya ng pito
  rationale: Natural na Filipino ito para sa idiom na “had her as wife,” habang pinananatili ang ugnayang pang-asawa sa halip na ituon lamang sa kilos ng pagpapakasal.
theological_decisions:
- issue: Kahulugan ng ἀνάστασις sa tanong ng mga Saduceo
  choice: “muling pagkabuhay” nang walang dagdag na paliwanag
  alternative: “muling pagkabuhay ng mga patay”
  rationale: ἀνάστασις lamang ang nasa talata; hindi dapat idagdag sa mismong teksto ang paliwanag mula sa mas malawak na konteksto.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Inuna ang natural na ayos ng pangungusap habang pinananatili ang inferential na “kaya,” ang resultative na “magiging,” at ang tinutukoy na “pito.”
