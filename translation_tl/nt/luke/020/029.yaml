  - severity: low
    issue: Nakalagay ang talababa sa “una” sa halip na sa “nag-asawa.”
    rationale: Ang paliwanag ng talababa ay ukol sa λαβὼν γυναῖκα / “nag-asawa,” hindi sa ὁ πρῶτος / “una.”
