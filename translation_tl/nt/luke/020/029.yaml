  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang 'magkakapatid na lalaki' upang malinaw na ang tinutukoy ay mga lalaking kapatid; pinanatili ang 'una' nang hindi ipinapalagay na siya ang pinakamatanda.
