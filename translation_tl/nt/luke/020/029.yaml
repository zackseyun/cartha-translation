  text: There were seven brothers; and the first[a], having taken a wife, died childless.
translation:
  language: tl
  text: May pitong magkakapatid na lalaki. Ang una ay nag-asawa[a] at namatay na walang anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kumuha ng asawa,” isang idyoma na nangangahulugang nag-asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ οὖν ἀδελφοὶ ἦσαν
  choice: May pitong magkakapatid na lalaki
  rationale: Likas na salin sa Filipino ng pangungusap na naglalahad ng pitong lalaking magkakapatid. Hindi ginawang hiwalay na salita ang οὖν dahil sapat nang naipahihiwatig ng daloy ng konteksto ang pagpapatuloy.
- source_word: ὁ πρῶτος
  choice: ang una
  rationale: Tumutukoy sa unang kapatid sa pagkakasunod-sunod, hindi tahasang sa pinakamatanda.
- source_word: λαβὼν γυναῖκα
  choice: nag-asawa
  rationale: Ang literal na 'kumuha ng asawa' ay isang idyoma para sa pag-aasawa; mas likas at malinaw sa modernong Filipino ang 'nag-asawa.'
- source_word: ἀπέθανεν
  choice: namatay
  rationale: Tuwiran at karaniwang katumbas ng pandiwa.
- source_word: ἄτεκνος
  choice: na walang anak
  rationale: Malinaw at natural na ipinahahayag na namatay siyang hindi nagkaroon ng anak.
