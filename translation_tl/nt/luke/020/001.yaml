  terminology: Mas angkop ang “mabuting balita” bilang karaniwang modernong katumbas ng εὐαγγέλιον/εὐαγγελίζομαι. Ang “mga eskriba” ay nagpapanatili sa natatanging makasaysayang pangkat na γραμματεῖς; maaaring ipaliwanag ang tungkulin nila sa ibang lugar kung kinakailangan, ngunit hindi ito dapat palitan dito ng isang mas makitid na functional label.
