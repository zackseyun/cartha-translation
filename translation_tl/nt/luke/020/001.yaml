  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ⸀ἡμερῶν διδάσκοντος αὐτοῦ τὸν λαὸν ἐν τῷ ἱερῷ καὶ εὐαγγελιζομένου ἐπέστησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ γραμματεῖς σὺν τοῖς πρεσβυτέροις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/001.yaml
  text: And it happened[a], on one of those days, while he was teaching the people in the temple and proclaiming the good news, that the chief priests and the scribes, together with the elders, came up to him[b],
translation:
  language: tl
  text: Isang araw, habang nagtuturo siya sa mga tao sa templo[a] at ipinahahayag ang mabuting balita[b], lumapit sa kanya ang mga punong pari, mga eskriba, at mga matatandang pinuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na ἱερόν ay tumutukoy sa buong kompleks ng templo, hindi lamang sa panloob na santuwaryo.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “ipinangangaral ang ebanghelyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: At nangyari
  rationale: Pinananatili ang karaniwang panandang pasalaysay ni Lucas nang hindi gumagamit ng makalumang pananalita.
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: sa isa sa mga araw na iyon
  rationale: Pinananatili ang di-tiyak ngunit nakaugnay-sa-kontekstong pagtukoy sa isang araw sa kasalukuyang salaysay.
- source_word: διδάσκοντος αὐτοῦ τὸν λαὸν
  choice: habang nagtuturo siya sa mga tao
  rationale: Likas na inilalahad ang kasabay na kilos ng genitive absolute at isinasalin ang λαός bilang pangkalahatang ‘mga tao,’ hindi lamang isang pulutong.
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Natural at maikli sa Filipino; nililinaw sa talababa na ang tinutukoy ay ang buong bakuran o kompleks ng templo, hindi lamang ang panloob na santuwaryo.
- source_word: εὐαγγελιζομένου
  choice: ipinahahayag ang magandang balita
  rationale: Pinananatili ang pandiwang diwa ng paghahatid ng mabuting balita at iniiwasan ang mas teknikal na pananalitang pansimbahan.
- source_word: ἐπέστησαν
  choice: lumapit sa kanya
  rationale: Ipinahahayag ang tuwiran nilang paglapit kay Jesus nang hindi ipinapasok ang tahasang pagkapoot na hindi pa ganap na sinasabi ng pandiwa.
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Tumutukoy sa pamunuang makasaserdote, hindi sa maraming sabay-sabay na may katungkulan bilang nag-iisang pinakapunong pari.
- source_word: γραμματεῖς
  choice: mga tagapagturo ng Kautusan
  rationale: Isang malinaw na makabagong functional rendering ng makasaysayang pangkat ng mga eskriba, na mas madaling maunawaan ng karaniwang mambabasa.
- source_word: σὺν τοῖς πρεσβυτέροις
  choice: at mga matatandang pinuno
  rationale: Nililinaw na ang πρεσβύτεροι ay kinikilalang mga pinuno ng pamayanan, hindi basta mga taong may edad; ang pagsasama nila sa naunang mga pangkat ay nagpapanatili sa diwa ng σύν.
theological_decisions:
- issue: Paglalahad sa εὐαγγελιζομένου sa konteksto ng pampublikong ministeryo ni Jesus
  choice: ipinahahayag ang magandang balita
  alternative: ipinangangaral ang ebanghelyo
  rationale: Pinananatili ang karaniwang kahulugan ng pandiwa at iniiwasang gawing mas teknikal o pansimbahan kaysa sa hinihingi ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang panandang pasalaysay na “At nangyari” at ang sabayang pagkilos ng pagtuturo at pagpapahayag. Inayos ang pagkakasunod ng mga pananda sa talababa upang [a] at [b] ay lumitaw ayon sa una nilang paglitaw sa tekstong Filipino.
