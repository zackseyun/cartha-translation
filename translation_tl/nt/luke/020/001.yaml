  source_fidelity: 'Tumpak ang pangunahing nilalaman: ang sabayang pagtuturo at pagpapahayag ni Jesus, ang lugar na ἱερόν, at ang paglapit ng tatlong pangkat ng mga pinuno. Gayunman, ang “At nangyari, sa isa sa mga araw na iyon” ay hindi likas na Filipino, at ang “mga tagapagturo ng Kautusan” ay isang interpretatibong paglalarawan ng γραμματεῖς sa halip na panatilihin ang makasaysayang katawagang “mga eskriba.”'
