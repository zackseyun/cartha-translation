base_translation:
  language: en
  yaml_path: translation/nt/luke/020/026.yaml
  text: And they were not able to seize on his statement before the people[a], and marveling at his answer, they became silent.
translation:
  language: tl
  text: At hindi nila siya mahuli sa kaniyang sinabi[a] sa harap ng mga tao. Namangha sila sa sagot niya kaya’t tumahimik sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sunggaban ang kaniyang sinabi.” Ibig sabihin, mahuli siya batay sa kaniyang sinabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσχυσαν
  choice: hindi nila ... mahuli
  rationale: Ipinahahayag ng pandiwa ang kawalan nila ng kakayahang maisagawa ang tangka; natural sa Filipino ang hulma na “hindi nila siya mahuli.”
- source_word: ἐπιλαβέσθαι
  choice: mahuli
  rationale: Bagaman literal na maaaring mangahulugang “humawak” o “sumunggab,” kasama ng ῥήματος ay tumutukoy ito sa paghuli o pagsilo kay Jesus batay sa sinabi niya.
- source_word: τοῦ ῥήματος
  choice: sa anumang sinabi niya
  rationale: Ang ῥῆμα ay isang binigkas na pahayag. Ang “anumang sinabi niya” ay malinaw at likas, at ipinakikita ang batayang hinahanap nila upang mahuli siya nang hindi ito ginagawang teolohikal na “Salita.”
- source_word: ἐναντίον τοῦ λαοῦ
  choice: sa harap ng mga tao
  rationale: Tuwirang ipinahahayag ang pampublikong tagpuan o presensiya ng λαός; pinananatili ng “mga tao” ang karaniwang diwa ng sambayanan sa konteksto.
- source_word: θαυμάσαντες
  choice: Namangha sila
  rationale: Inililipat ang Griyegong participle sa natural na sugnay sa Filipino habang pinananatili ang kanilang matinding pagtataka.
- source_word: ἀποκρίσει
  choice: sagot
  rationale: Karaniwan, malinaw, at angkop na katumbas sa konteksto ng pagtatalo.
- source_word: ἐσίγησαν
  choice: tumahimik sila
  rationale: Ipinakikita ng aspektong pangyayari ang pagpasok nila sa katahimikan bilang bunga ng kanilang pagkamangha.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mahuli sa anumang sinabi niya” upang likas na maipahayag ang idyomatikong tangkang makakuha ng maisasakdal laban kay Jesus, nang hindi dinaragdagan ang teksto ng espesipikong paratang. Hiniwalay sa dalawang pangungusap at ginamit ang “kaya't” upang malinaw at natural ang ugnayan ng pagkamangha at pananahimik.
