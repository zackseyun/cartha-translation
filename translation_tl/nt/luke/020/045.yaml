  text: 'And while all the people were listening[a], he said to the disciples:'
translation:
  language: tl
  text: 'Habang nakikinig ang lahat ng tao[a], sinabi niya sa mga alagad:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Habang nakikinig ang buong bayan.” Sa Griyego, ang genitive absolute ay nagsasaad ng kalagayang kasabay ng pagsasalita niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντος
  choice: Habang nakikinig
  rationale: Ang pangkasalukuyang participle sa genitive absolute ay naglalarawan ng kasabay at nagpapatuloy na kilos; likas itong naipapahayag sa Tagalog sa pamamagitan ng “habang nakikinig.”
- source_word: δὲ
  choice: hindi hiwalay na isinalin
  rationale: Mahinang pang-ugnay ang δέ rito. Sapat nang ipinahihiwatig ng pagkakasunod ng pangungusap at ng “Habang” ang pagpapatuloy ng salaysay; ang pagdaragdag ng “At” ay magiging mabigat sa natural na Tagalog.
- source_word: παντὸς τοῦ λαοῦ
  choice: ang buong bayan
  rationale: Ipinapahayag nito ang λαός bilang isang kabuuan. Mas napapanatili ng “buong bayan” kaysa “buong karamihan” ang panlipunan at posibleng pangtipang himig ng salita sa Lucas.
- source_word: εἶπεν
  choice: sinabi niya
  rationale: Tuwirang katumbas sa salaysay ng aorist na εἶπεν at natural sa modernong Tagalog.
- source_word: τοῖς μαθηταῖς
  choice: sa mga alagad
  rationale: Karaniwang katawagan sa Ebanghelyo ang “mga alagad.” Hindi idinagdag ang “kanyang” sapagkat walang hayag na possessive sa Griyego.
theological_decisions:
- issue: Pagkakaiba ng mga tagapakinig at ng tuwirang kinakausap
  choice: Ang mga alagad ang tuwirang kinausap habang nakikinig ang buong bayan.
  alternative: Ang buong bayan ang tuwirang kinausap, o kinausap nang pribado ang mga alagad.
  rationale: Itinatakda ng genitive absolute ang pampublikong kalagayan, samantalang tinutukoy ng dative na τοῖς μαθηταῖς ang mga tuwirang kinausap. Pinananatili ng salin ang dalawang elementong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “buong bayan” para sa kolektibong λαός at iniwasang gawing “karamihan,” na maaaring magpahiwatig lamang ng isang pulutong.
