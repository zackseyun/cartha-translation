reference: Luke 20:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ παρατηρήσαντες ἀπέστειλαν ἐγκαθέτους ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι, ἵνα ἐπιλάβωνται αὐτοῦ λόγου, ⸀ὥστε παραδοῦναι αὐτὸν τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/020.yaml
  text: And after watching him closely[a], they sent spies who pretended to be righteous, so that they might catch him in something he said[b], and thus hand him over to the rule and authority of the governor.
translation:
  language: tl
  text: Matapos nila siyang bantayang mabuti, nagsugo sila ng mga espiya na nagkunwaring matuwid, upang mahuli nila siya sa kanyang pananalita[a] at sa gayon ay maipasa siya sa kapamahalaan at awtoridad ng gobernador.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “masilo siya sa isang salita” o “panghawakan ang kanyang salita.”
    reason: lexical_alternative
  - marker: b
    text: O, “maipasa siya sa pamamahala at kapangyarihan ng gobernador.” Malamang na idiniriin ng magkatambal na salita ang opisyal na saklaw ng pamamahala at ang awtoridad ng gobernador.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρατηρήσαντες
  choice: Matapos nila siyang bantayang mabuti
  rationale: Ipinahihiwatig ng aorist participle ang kilos na nauna sa pagsusugo. Ang “bantayang mabuti” ay natural sa Filipino at nagdadala ng diwang mapanlinlang at masusing pagmamatyag.
- source_word: ἐγκαθέτους
  choice: mga espiya
  rationale: Tumutukoy ito sa mga taong lihim na inilagay upang manilo. Malinaw at karaniwan sa modernong Filipino ang “mga espiya.”
- source_word: ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι
  choice: na nagkunwaring matuwid
  rationale: Pinananatili ng “nagkunwari” ang mapanlinlang na pagpapanggap, at ng “matuwid” ang moral at panrelihiyong bigat ng δίκαιος.
- source_word: ἵνα ἐπιλάβωνται αὐτοῦ λόγου
  choice: Layunin nilang hulihin siya sa anumang sabihin niya
  rationale: Ipinapahayag nito ang layuning masilo si Jesus batay sa sarili niyang pananalita. Mas natural ito kaysa sa literal ngunit malabong “hawakan ang kanyang salita.”
- source_word: ὥστε
  choice: upang
  rationale: Sa konteksto, ipinakikilala nito ang nilalayong bunga ng paninilo. Ang “upang” ay malinaw at hindi labis na nagpapasiya kung layunin lamang o bunga ang itinatampok.
- source_word: παραδοῦναι
  choice: maibigay siya
  rationale: Nagpapahayag ito ng pagsasalin kay Jesus sa kamay ng opisyal na kapangyarihan para sa pag-uusig. Ang “maibigay” ay natural at may legal na diwa sa konteksto.
- source_word: τῇ ἀρχῇ
  choice: sa pamamahala
  rationale: Ang ἀρχή rito ay tumutukoy sa namumunong pamamahala o hurisdiksiyon, hindi sa “simula.” Pinananatili itong hiwalay sa kasunod na ἐξουσία.
- source_word: τῇ ἐξουσίᾳ
  choice: kapangyarihan
  rationale: Tumutukoy sa awtoridad o karapatang gumamit ng kapangyarihan. Ang “kapangyarihan” ay malinaw at likas na katambal ng “pamamahala.”
- source_word: τοῦ ἡγεμόνος
  choice: ng gobernador
  rationale: Ang ἡγεμών ay opisyal na tagapamahala; “gobernador” ang pamantayan at madaling maunawaang katumbas sa kontekstong Romano.
theological_decisions:
- issue: Paglalarawan sa nagkunwaring kalagayang moral sa δίκαιος
  choice: matuwid
  alternative: makatarungan; mabuting tao
  rationale: Pinananatili ng “matuwid” ang moral at panrelihiyong saklaw ng δίκαιος nang hindi ito nililimitahan sa pagiging patas sa batas o sa pangkalahatang kabaitan.
- issue: Ugnayan ng ἀρχή at ἐξουσία
  choice: pamamahala at kapangyarihan
  alternative: hurisdiksiyon at awtoridad; kapamahalaan
  rationale: Pinananatili ang dalawang magkaugnay ngunit hindi lubos na magkaparehong termino, kaya hindi pinapawi ang diin sa opisyal na saklaw at kapangyarihan ng gobernador.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Hinati sa dalawang pangungusap upang maging malinaw ang mahabang estruktura ng Griyego, habang pinananatili ang pagkakasunod ng pagmamatyag, pagpapadala, paninilo, at pagsasalin sa gobernador. Ang mga panandang [a] at [b] ay inilagay sa mismong pariralang tinatalakay ng kani-kanilang talababa.
