revisions:
- from: Matapos nila siyang bantayang mabuti, nagsugo sila ng mga espiya na nagkunwaring matuwid. Layunin nilang hulihin siya sa anumang sabihin niya[a] upang maibigay siya sa pamamahala at kapangyarihan ng gobernador.[b]
  to: Matapos nila siyang bantayang mabuti, nagsugo sila ng mga espiya na nagkunwaring matuwid, upang mahuli nila siya sa kanyang pananalita[a] at sa gayon ay maipasa siya sa kapamahalaan at awtoridad ng gobernador.[b]
  rationale: Pinalitan ang mas malawak na “anumang sabihin niya” ng “sa kanyang pananalita” upang maipahayag ang idiomang Griyego nang natural at hindi lumalabis sa saklaw nito. Pinalitan ang “maibigay” ng “maipasa” upang luminaw ang legal na diwa ng pagpapasa kay Jesus sa opisyal na kapangyarihan. Ginamit ang “kapamahalaan at awtoridad” upang mapanatiling magkahiwalay ang dalawang terminong Griyego habang natural ang Filipino.
  reviewer_model: gpt-5.6-terra
