  text: λέγοντες· Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν, ἐάν τινος ἀδελφὸς ἀποθάνῃ ἔχων γυναῖκα, καὶ οὗτος ἄτεκνος ⸀ᾖ, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/028.yaml
  text: saying[a], “Teacher, Moses wrote for us that if someone's brother dies having a wife, and he is childless[b], his brother should take the wife and raise up offspring for his brother.”
translation:
  language: tl
  text: Sinabi nila, “Guro, isinulat ni Moises para sa atin na kung mamatay ang kapatid na lalaki ng isang tao na may asawa[a], at wala siyang anak, dapat kunin ng kapatid ng namatay ang asawa ng namatay at magbigay ng supling para sa namatay na kapatid[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nag-iwan ng asawa”; literal sa Griyego, “namatay na may asawa.”
    reason: lexical_alternative
  - marker: b
    text: Ang “magbigay ng supling” ay umaalingawngaw sa legal na pananalita sa Deuteronomio 25:5 tungkol sa pagkakaroon ng inapo na maituturing para sa namatay na kapatid; literal, “magbangon ng binhi.”
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Likas at makabagong tawag sa isang nagtuturo; malinaw na tuwirang pakikipag-usap kay Jesus nang hindi gumagamit ng lipas o malabong titulo.
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: isinulat ni Moises para sa atin
  rationale: Ipinakikita ng “para sa atin” ang kaugnayan at kapakinabangan ng kautusang ibinigay sa Israel, hindi na para bang isang liham itong tuwirang ipinadala sa kanila.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: kung mamatay ang kapatid na lalaki ng isang tao
  rationale: Pinananatili ang di-tiyak at pangkalahatang diwa ng τινος at nililinaw na lalaking kapatid ang tinutukoy sa konteksto ng batas.
- source_word: ἔχων γυναῖκα
  choice: na may asawa
  rationale: Malapit ito sa literal na “may/angkin ang isang asawa” at likas sa Filipino; hindi nito tahasang ipinapasok sa pangunahing teksto ang interpretasyong “mag-iwan ng asawa.”
- source_word: οὗτος ἄτεκνος ᾖ
  choice: at wala siyang anak
  rationale: Karaniwang paraan sa Filipino upang ipahayag ang ἄτεκνος at malinaw na tumutukoy sa namatay na kapatid.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: dapat kunin ng kapatid nito ang asawa
  rationale: Ipinahahayag ng “dapat” ang itinatakdang tungkulin ng batas, samantalang pinananatili ng “kunin ... ang asawa” ang legal-biblikal na pananalita nang hindi labis na nagpapaliwanag.
- source_word: ἐξαναστήσῃ σπέρμα
  choice: magbigay ng supling
  rationale: Ipinahahayag nang malinaw ang idyomang tumutukoy sa pagkakaroon ng inapo para sa namatay; ang mas literal na “magbangon ng binhi” ay hindi likas at maaaring maging malabo sa modernong Filipino.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: para sa namatay niyang kapatid
  rationale: Ang “para sa” ay angkop sa datibong nagsasaad ng kapakinabangan o pagtutuos sa pangalan ng kapatid; idinagdag ang “namatay” upang maging malinaw ang reperente nang hindi binabago ang diwa.
theological_decisions:
- issue: Paglalahad ng legal na pananalita tungkol sa pag-aasawa sa balo ng kapatid nang hindi nagdaragdag ng paliwanag na pangdoktrina o pangkultura
  choice: “dapat kunin ng kapatid nito ang asawa at magbigay ng supling para sa namatay niyang kapatid”
  alternative: “dapat pakasalan ng kapatid nito ang balo at magkaroon ng mga anak sa pangalan ng namatay”
  rationale: Pinananatili ng piniling salin ang utos at ang biblikal na idyoma ng batas sa Deuteronomio 25:5, ngunit iniiwasang ipasok sa pangunahing teksto ang mga salitang “balo” at “sa pangalan” na nagpapaliwanag sa halip na tuwirang magsalin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong legal ng sipi habang gumamit ng karaniwang pananalitang mauunawaan ng ordinaryong mambabasa. Ang dalawang talababa ay minarkahan sa pangunahing teksto bilang [a] at [b].
