base_translation:
  language: en
  yaml_path: translation/nt/luke/020/022.yaml
  text: Is it lawful for us to pay taxes to Caesar[a], or not?
translation:
  language: tl
  text: Pinahihintulutan ba tayong magbayad ng buwis[a] kay Cesar, o hindi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tributo.” Ang salitang Griyego ay tumutukoy sa buwis na ibinabayad sa isang naghaharing kapangyarihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστιν
  choice: Ipinahihintulot ba
  rationale: Ipinapahayag nito ang tanong tungkol sa kung ano ang pinahihintulutan o nararapat ayon sa umiiral na awtoridad, nang hindi tinutukoy kung batas ng Roma o kautusan ng Diyos ang tinutukoy.
- source_word: ἡμᾶς
  choice: sa atin
  rationale: Likas na salin ito ng accusative-with-infinitive construction at hindi nagdaragdag ng tahasang katawagang etniko na wala sa Griyego.
- source_word: Καίσαρι
  choice: kay Cesar
  rationale: Pinananatili ang tiyak na makasaysayan at pampolitikang titulo ng Romanong pinuno sa halip na gawing pangkalahatang 'emperador.'
- source_word: φόρον
  choice: buwis
  rationale: Natural at malinaw sa modernong Tagalog; sa konteksto, tumutukoy ito sa buwis o tributong ibinabayad sa naghaharing kapangyarihan.
- source_word: δοῦναι
  choice: magbayad
  rationale: Bagaman literal na 'magbigay,' ang 'magbayad ng buwis' ang likas na pariralang Tagalog at tumpak na naghahatid ng kahulugan sa kontekstong ito.
- source_word: ἢ οὔ
  choice: o hindi
  rationale: Ito ang natural na anyo sa Tagalog ng pangwakas na magkasalungat na tanong.
theological_decisions:
- issue: Saklaw ng ipinahihintulot sa tanong
  choice: Ipinahihintulot ba
  alternative: Naaayon ba sa batas
  rationale: Hindi tahasang sinasabi ng Griyego kung batas sibil ng Roma o relihiyosong kautusan ang batayan. Pinananatili ng napiling salin ang sadyang kalabuan at tensiyong pampolitika at panrelihiyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang 'Cesar' bilang nakaugaliang anyong Tagalog ng makasaysayang titulo; iniwasang dagdagan ng 'mga Judio' ang 'sa atin.'
