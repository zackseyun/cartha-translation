id: LUK.20.25
reference: Luke 20:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν ⸂πρὸς αὐτούς· Τοίνυν ἀπόδοτε⸃ τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/025.yaml
  text: But he said to them[a], “Then give back to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanila, “Kung gayon, ibigay ninyo kay Cesar ang mga bagay na kay Cesar, at sa Diyos ang mga bagay na sa Diyos.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isauli ninyo kay Cesar … at sa Diyos …” Ang pandiwa ay maaaring mangahulugang ibigay, bayaran, o isauli ang nararapat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: Ngunit sinabi niya sa kanila
  rationale: Ang δέ ay bahagyang nagpapakita ng pagsalungat o pagpapatuloy; natural sa konteksto ang “Ngunit.” Ang πρὸς αὐτούς kasama ng εἶπεν ay idyomatikong “sinabi niya sa kanila.”
- source_word: Τοίνυν
  choice: Kung gayon
  rationale: Ipinahahayag nito ang kongklusyon o tugon na bunga ng naunang sinabi, nang hindi kasing-pormal ng “samakatuwid.”
- source_word: ἀπόδοτε
  choice: ibigay ninyo
  rationale: Maaaring mangahulugang ibigay, bayaran, o isauli ang nararapat. Ang “ibigay ninyo” ay natural at hindi labis na nagpapasya kung pagbabayad o pagsasauli ang tiyak na diwa; nililinaw sa talababa ang saklaw.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: kay Cesar ang mga bagay na kay Cesar
  rationale: Pinananatili ang malawak na saklaw ng neuter plural na τὰ at ang balanseng ayos ng pangungusap, sa halip na paliitin ito sa buwis lamang.
- source_word: Καίσαρος / Καίσαρι
  choice: Cesar
  rationale: Karaniwang anyong Filipino ng pangalang/titulong imperyal na Caesar.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: sa Diyos ang mga bagay na sa Diyos
  rationale: Pinananatili ang eksaktong paralelismo at paghahambing sa sugnay tungkol kay Cesar.
- source_word: θεοῦ / θεῷ
  choice: Diyos
  rationale: Tumutukoy sa Diyos ng Israel; ang malaking titik ay naaayon sa karaniwang gamit sa Filipino.
theological_decisions:
- issue: Saklaw na pampolitika at teolohikal ng sinabi ni Jesus
  choice: Pinananatili ang magkatabing pananagutan kay Cesar at sa Diyos nang hindi tinutukoy ang eksaktong hangganan ng bawat isa.
  alternative: Unawain ito bilang mahigpit na paghihiwalay ng relihiyon at pamahalaan, pahintulot sa walang-hanggang kapangyarihan ng estado, o pahayag na tungkol lamang sa pagbabayad ng buwis.
  rationale: Sinasabi ng Griyego na ibigay sa bawat isa ang nauukol sa kaniya, ngunit hindi nito inilalahad ang isang kumpletong teoryang pampolitika. Dapat manatili ang lawak at tensiyon ng pahayag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Cesar” bilang pamilyar na anyong Filipino at pinanatili ang retorikal na paralelismo ng orihinal.
