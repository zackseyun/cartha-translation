id: LUK.20.17
reference: Luke 20:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἐμβλέψας αὐτοῖς εἶπεν· Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/017.yaml
  text: 'But he looked at them and said[a], “What then is this that has been written: ‘The stone that the builders rejected, this one has become the head of the corner’?”'
translation:
  language: tl
  text: 'Ngunit tiningnan niya sila at sinabi, “Kung gayon, ano itong nasusulat: ‘Ang batong itinakwil ng mga tagapagtayo, ito ang naging ulo ng panulukan[a]’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “batong-panulok” o “batong-tuktok.” Sa literal, “ulo ng panulukan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμβλέψας
  choice: tiningnan niya sila
  rationale: Ipinahahayag nito ang tuwirang at sinasadyang pagtingin sa kanila nang hindi labis na pinatitingkad ang tindi.
- source_word: Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο
  choice: Kung gayon, ano itong nasusulat
  rationale: Pinananatili ang retorikal na tanong at ang katayuan ng sipi bilang nakasulat, sa natural na Filipino.
- source_word: Λίθον
  choice: Ang batong
  rationale: Bagaman walang pantukoy sa Griyego, tiyak ang batong tinutukoy sa kilalang sipi; natural sa Filipino ang “ang bato.”
- source_word: ἀπεδοκίμασαν
  choice: itinakwil
  rationale: Malinaw nitong ipinahahayag ang pagsusuri at pagtanggi sa bato bilang hindi karapat-dapat gamitin.
- source_word: οἱ οἰκοδομοῦντες
  choice: mga tagapagtayo
  rationale: Natural na pangngalang Filipino para sa substantibong participle at pinananatili ang talinghaga ng pagtatayo.
- source_word: οὗτος
  choice: ito
  rationale: Pinananatili ang diin ng demonstratibo nang hindi tahasang ginagawang personal o kristolohikal ang panghalip.
- source_word: ἐγενήθη εἰς
  choice: ang naging
  rationale: Direkta at natural na katumbas ng pagbabagong tungo sa papel o kalagayang binabanggit.
- source_word: κεφαλὴν γωνίας
  choice: pangulong bato sa panulukan
  rationale: Pinananatili ang literal na ideya ng “ulo/pangunahin” at “sulok” habang nagbibigay ng nauunawaang larawang arkitektural sa Filipino; inilalahad sa talababa ang mga posibleng espesipikong kahulugan.
theological_decisions:
- issue: Talinghagang arkitektural sa sipi mula sa Awit 118:22
  choice: pangulong bato sa panulukan
  alternative: batong-panulok; batong-tuktok
  rationale: Hindi ganap na tiyak kung ang parirala ay tumutukoy sa batong-panulok sa pundasyon, sa pangunahing batong nag-uugnay sa sulok, o sa batong-tuktok. Ang pangunahing teksto ay nagpapanatili sa mga sangkap na “pangunahin/ulo” at “sulok,” at ang talababa ang naglalahad ng mga karaniwang alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nasusulat” bilang natural na pormula ng pagsipi sa Kasulatan, at iniwasang lutasin nang tiyak ang pinagtatalunang larawang arkitektural.
