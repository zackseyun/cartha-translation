id: LUK.20.2
reference: Luke 20:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃· Εἰπὸν ἡμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς, ἢ τίς ἐστιν ὁ δούς σοι τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/002.yaml
  text: And they said to him, “Tell us, by what authority are you doing these things? Or who is the one who gave you this authority?”
translation:
  language: tl
  text: At sinabi nila sa kanya, “Sabihin mo sa amin, sa anong awtoridad mo ginagawa ang mga bagay na ito? O sino ang nagbigay sa iyo ng awtoridad na ito?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at ang tuloy-tuloy na daloy ng salaysay nang hindi nagdaragdag ng tiyak na temporal na diwa.
- source_word: εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃
  choice: sinabi nila sa kanya
  rationale: Likas na pinagsasama sa Tagalog ang pandiwa at ang may bahagyang paulit-ulit na participial na parirala, habang buo pa rin ang diwa ng tuwirang pakikipag-usap sa kanya.
- source_word: Εἰπὸν ἡμῖν
  choice: Sabihin mo sa amin
  rationale: Natural na Tagalog para sa aorist imperative; malinaw nitong ipinahahayag ang utos na magbigay ng sagot.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: sa anong awtoridad
  rationale: Ang pariralang ito ay natural na nagtatanong sa batayan o pahintulot ng pagkilos, habang pinananatili ang pangunahing kahulugan ng ἐξουσία.
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang maramihang bilang ng demonstratibo at ang pagtukoy nito sa mga kamakailang ginawa ni Jesus.
- source_word: ποιεῖς
  choice: ginagawa
  rationale: Ang aspektong di-ganap ng Tagalog ay angkop sa kasalukuyan at nagpapatuloy na pagkilos na hinahamon sa konteksto.
- source_word: ἢ
  choice: O
  rationale: Ipinakikilala nito ang ikalawang tanong bilang kaugnay na alternatibong paraan ng paghamon.
- source_word: τίς ἐστιν ὁ δούς
  choice: sino ang nagbigay
  rationale: Natural at malinaw sa Tagalog; ang substantival na diwa ng articular participle ay sapat na naihahatid ng tanong kung sino ang nagbigay.
- source_word: σοι
  choice: sa iyo
  rationale: Tuwirang katumbas ng dative recipient at natural sa pariralang 'nagbigay sa iyo.'
- source_word: τὴν ἐξουσίαν ταύτην
  choice: ng awtoridad na ito
  rationale: Ang 'awtoridad' ay tumutukoy sa lehitimong karapatan o pahintulot, hindi lamang sa lakas o kakayahan.
theological_decisions:
- issue: Kahulugan ng ἐξουσία sa paghamon kay Jesus sa templo
  choice: awtoridad
  alternative: kapangyarihan; karapatan
  rationale: Ang usapin ay ang pagiging lehitimo at pinagmulan ng karapatan ni Jesus na kumilos. Pinananatili ng 'awtoridad' ang institusyonal at teolohikal na bigat nang hindi ito nililimitahan sa pisikal o likas na kakayahan.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang 'awtoridad' dahil karaniwan at tiyak ito sa kontekstong nagtatanong tungkol sa pahintulot at lehitimong karapatang kumilos. Walang footnote dahil walang tekstuwal o leksikal na kalabuan na nangangailangan ng paliwanag sa talatang ito.
