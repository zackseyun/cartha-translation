base_translation:
  language: en
  yaml_path: translation/nt/luke/020/003.yaml
  text: But in reply he said to them[a], “I also will ask you a question, and you tell me:”
translation:
  language: tl
  text: 'Ngunit sumagot siya sa kanila, “May itatanong din ako sa inyo[a], at sabihin ninyo sa akin:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang bagay.” Ang salitang Griyego na λόγον ay literal na maaaring mangahulugang “salita” o “bagay,” ngunit sa kontekstong ito ay tumutukoy sa isang tanong.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν πρὸς αὐτούς
  choice: Ngunit sumagot siya sa kanila
  rationale: Likas na ipinapahayag sa modernong Tagalog ang tugon at ang banayad na pagsalungat ng δέ, nang hindi inuulit nang mekanikal ang participle at pangunahing pandiwa.
- source_word: Ἐρωτήσω ὑμᾶς
  choice: Tatanungin ko kayo
  rationale: Tuwirang katumbas ng future na ἐρωτάω na ang maramihang kausap ang layon.
- source_word: κἀγὼ
  choice: rin ... ko
  rationale: 'Ang “rin” ay natural na nagpapakita ng katumbasang diin ng καὶ ἐγώ: kung paanong nagtanong sila sa kaniya, magtatanong din siya sa kanila.'
- source_word: λόγον
  choice: isang bagay
  rationale: Dito, tumutukoy ang λόγος sa bagay na itatanong. Pinananatili ng “isang bagay” ang lawak ng salitang Griyego at natural pa rin ito sa Tagalog; nililinaw sa talababa ang posibleng saling “isang tanong.”
- source_word: καὶ εἴπατέ μοι
  choice: sabihin ninyo sa akin
  rationale: Pinananatili ang tahasang maramihang pautos at ang dative na μοι. Ang tuldok-kuwit ay natural na nag-uugnay sa utos sa kasunod na tanong.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “ninyo” upang malinaw na ipakita na maramihan ang kausap; iniwasan ang mas lumang anyong “wika niya” at ang mekanikal na “nang sumagot ay sinabi.”
