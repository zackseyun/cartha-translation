base_translation:
  language: en
  yaml_path: translation/nt/luke/020/041.yaml
  text: But he said to them[b][a], “How do they say that the Messiah is David’s son?”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanila, “Paano nila nasasabi na ang Mesiyas[a] ay anak ni David[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ginamit dito ang “Mesiyas” dahil ang konteksto ay tahasang tumutukoy sa inaasahang tagapagligtas mula sa lahi ni David.
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring unawain na “isang anak ni David” o “ang Anak ni David.” Literal sa Griyego: “anak ni David.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Isang banayad na pang-ugnay ang δέ; ipinakikita rito ng “Ngunit” ang paglipat sa mapanghamong tanong ni Jesus nang hindi ginagawang labis ang pagsalungat.
- source_word: πρὸς αὐτούς
  choice: sa kanila
  rationale: Likas at tuwirang katumbas ito sa Filipino sa konteksto ng pagsasalita.
- source_word: Πῶς
  choice: Paano
  rationale: Pinananatili nito ang tanong tungkol sa batayan o lohika ng pahayag.
- source_word: λέγουσιν
  choice: nila nasasabing
  rationale: Pinananatili ng “nila” ang di-tiyak na maramihang simuno ng pandiwang Griyego, at natural sa Filipino ang anyong “nasasabing” sa ganitong tanong.
- source_word: τὸν χριστόν
  choice: ang Mesiyas
  rationale: Tumutukoy ang Χριστός sa titulong mesiyaniko, at malinaw sa konteksto ang kaugnayan nito sa inaasahang tagapagligtas mula sa lahi ni David.
- source_word: εἶναι
  choice: ay
  rationale: Natural na ipinahahayag sa Filipino ang infinitive sa di-tuwirang pahayag sa pamamagitan ng sugnay na may “ay.”
- source_word: Δαυὶδ υἱόν
  choice: anak ni David
  rationale: Malapit ito sa literal na parirala at pinananatili ang ugnayang Davidiko nang hindi nagpapasya kung dapat itong gawing tiyak na titulo o di-tiyak na paglalarawan.
theological_decisions:
- issue: Pagsasalin ng Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Nasa unahan dito ang kahulugan bilang titulong tumutukoy sa inaasahang Davidikong hari at tagapagligtas; inilalagay sa talababa ang “Cristo” bilang lehitimong alternatibo.
- issue: Pananalitang Davidikong pagka-anak
  choice: anak ni David
  alternative: ang Anak ni David; isang anak ni David
  rationale: Pinananatili nito ang literal na wikang pampamilya at ang tensiyong susuriin sa kasunod na pangangatwiran ni Jesus, nang hindi ipinapasok ang katiyakang hindi tahasang minarkahan sa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang di-tiyak na tinutukoy ng “nila” at iniwasang gawing mas tiyak kaysa sa Griyego ang pariralang “anak ni David.”
