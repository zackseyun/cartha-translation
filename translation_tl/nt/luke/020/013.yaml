  text: εἶπεν δὲ ὁ κύριος τοῦ ἀμπελῶνος· Τί ποιήσω; πέμψω τὸν υἱόν μου τὸν ἀγαπητόν· ἴσως ⸀τοῦτον ἐντραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/013.yaml
  text: Then the owner of the vineyard said[a], ‘What shall I do? I will send my beloved son[b]; perhaps they will respect him.’
translation:
  language: tl
  text: At sinabi ng may-ari ng ubasan[a], ‘Ano ang gagawin ko? Isusugo ko ang minamahal kong anak na lalaki; marahil ay igagalang nila siya[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “panginoon ng ubasan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “igagalang” ay salin ng pandiwang maaari ring mangahulugang “mahihiya sa harap niya” o “magpapakita ng pagpipitagan sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος τοῦ ἀμπελῶνος
  choice: may-ari ng ubasan
  rationale: Sa konteksto ng talinghaga, tumutukoy ito sa taong nagmamay-ari at namamahala sa ubasan. Likas sa modernong Tagalog ang “may-ari ng ubasan” at hindi nito ipinipilit ang titulong teolohikal na “Panginoon.”
- source_word: Τί ποιήσω;
  choice: Ano ang gagawin ko?
  rationale: Natural na ipinapahayag nito sa Tagalog ang deliberatibong tanong ng nagsasalita sa sarili.
- source_word: πέμψω
  choice: Isusugo ko
  rationale: Ipinahahayag ng anyong panghinaharap ang napagpasyahang gagawin. Ang “isusugo” ay angkop sa pagpapadala ng isang kinatawan at nagpapanatili ng marangal na himig.
- source_word: τὸν υἱόν μου τὸν ἀγαπητόν
  choice: ang minamahal kong anak
  rationale: Sa konteksto, malinaw na lalaking anak ang tinutukoy; natural sa Tagalog ang “anak” nang hindi nawawala ang kasarian dahil sa panghalip na “siya.” Pinananatili ng “minamahal” ang bigat at posibleng alingawngaw ng wika tungkol sa Anak sa Lucas.
- source_word: ἴσως
  choice: marahil
  rationale: Ipinahahayag nito ang pag-asa o posibilidad nang walang katiyakan at angkop sa marangal na modernong rehistro.
- source_word: ἐντραπήσονται
  choice: igagalang nila
  rationale: Sa kontekstong ito, ang pandiwa ay nangangahulugang magpakita ng paggalang o pagpipitagan sa isang tao. Ito ang pinakamalinaw at natural na pangunahing salin sa Tagalog, habang inilalahad sa talababa ang mas literal na saklaw.
theological_decisions:
- issue: Ang κύριος bilang tauhan sa talinghagang maaaring kumatawan sa Diyos
  choice: may-ari ng ubasan
  alternative: panginoon ng ubasan
  rationale: Pinananatili ng pangunahing salin ang agarang kahulugan sa antas ng kuwento—ang nagmamay-ari ng ubasan—nang hindi ipinipilit ang teolohikal na pagkakakilanlan sa pamamagitan ng isang titulo. Nananatiling bukas sa mambabasa ang tipolohikal na kaugnayan.
- issue: Posibleng kristolohikal na alingawngaw ng τὸν υἱόν μου τὸν ἀγαπητόν
  choice: ang minamahal kong anak
  alternative: ang anak kong minamahal
  rationale: Pinananatili ng “minamahal kong anak” ang natural na daloy sa Tagalog at ang posibleng alingawngaw ng mga pahayag tungkol kay Jesus sa binyag at pagbabagong-anyo, nang walang dagdag na interpretasyon.
- issue: Saklaw ng kahulugan ng ἐντραπήσονται
  choice: igagalang nila siya
  alternative: mahihiya sila sa harap niya
  rationale: Ang “igagalang” ang pinakaangkop sa agarang konteksto, ngunit hindi isinasara ang mas literal na diwa ng pagkapahiya o pagpapakumbaba sa harap ng isang tao; kaya dokumentado ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Kaya” para sa narratibong δέ bilang pagpapatuloy at bunga ng naunang mga pangyayari. Ang mga markang [a] at [b] ay kapwa nasa pangunahing teksto at tumutugma sa mga talababa.
