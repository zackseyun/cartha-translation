  source_fidelity: Kailangang tahasang maipahayag ang kasariang lalaki ng υἱός (“son”); hindi ito naipapahiwatig ng “anak” o ng panghalip na “siya.” Ang δέ ay pangunahing pang-ugnay na pagsasalaysay at hindi kinakailangang nagpapahiwatig ng sanhi o bunga, kaya mas tumpak ang “At” kaysa “Kaya.” Ang “may-ari ng ubasan,” “marahil,” at “igagalang nila siya” ay tapat sa konteksto at sa kahulugan ng Griyego.
  naturalness: Natural at marangal sa modernong Filipino Tagalog ang binagong pangungusap. Ang “minamahal kong anak na lalaki” ay bahagyang mas tahasan kaysa “anak,” ngunit kinakailangan upang mapanatili ang tiyak na kahulugan ng pinagmulan.
  terminology: Ang “may-ari ng ubasan” ay angkop na salin ng κύριος τοῦ ἀμπελῶνος sa antas ng talinghaga. Pinananatili ng “minamahal” ang bigat ng ἀγαπητός. Ang “igagalang” ay angkop sa kontekstuwal na diwa ng ἐντραπήσονται; nililinaw ng talababa ang iba pang posibleng saklaw nang may kumpletong mga parirala.
