  text: καὶ ἐκβαλόντες αὐτὸν ἔξω τοῦ ἀμπελῶνος ἀπέκτειναν. τί οὖν ποιήσει αὐτοῖς ὁ κύριος τοῦ ἀμπελῶνος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/015.yaml
  text: And after throwing him out of the vineyard[a], they killed him. What then will the owner of the vineyard do to them?
translation:
  language: tl
  text: Matapos nilang itapon siya palabas ng ubasan, pinatay nila siya. Ano, kung gayon, ang gagawin sa kanila ng may-ari[a] ng ubasan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “panginoon ng ubasan” o “amo ng ubasan.” Ang salitang Griyego ay kyrios, na madalas isaling “Panginoon” kapag ginagamit bilang titulo, ngunit dito ay tumutukoy ito sa taong nagmamay-ari ng ubasan sa loob ng talinghaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: matapos nila siyang itapon sa labas
  rationale: Ipinahihiwatig ng aorist participle na nauna ang pagpapalabas sa pagpatay. Pinananatili ng “itapon sa labas” ang puwersa ng sapilitang pagpapaalis at natural ito sa makabagong Filipino.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: sa labas ng ubasan
  rationale: Malinaw nitong ipinahahayag ang pagkilos mula sa loob patungo sa labas ng ubasan.
- source_word: ἀπέκτειναν
  choice: pinatay nila siya
  rationale: Tuwirang katumbas ito ng pandiwa nang hindi idinaragdag ang mas tiyak na moral o legal na diwa ng “pinaslang” o “hinatulan ng kamatayan.”
- source_word: τί οὖν
  choice: Kaya ano
  rationale: Pinananatili ng “kaya” ang panghinuha o bunga na ipinahihiwatig ng οὖν, sa natural na ayos ng tanong sa Filipino.
- source_word: ποιήσει
  choice: ang gagawin
  rationale: Malawak ang kahulugan ng ποιέω rito at tumutukoy sa magiging tugon o kilos ng may-ari.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Ang datibo ay tumutukoy sa mga taong tatanggap ng gagawin ng may-ari; “sa kanila” ang likas na katumbas sa Filipino.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: may-ari ng ubasan
  rationale: Bagaman maaaring mangahulugan ang κύριος na “panginoon” o “amo,” ang tinutukoy rito sa loob ng talinghaga ay ang taong nagmamay-ari ng ubasan. “May-ari” ang pinakamalinaw at hindi mapanlinlang na salin sa kontekstong ito.
theological_decisions:
- issue: Pagsasalin sa κύριος kapag tao ang tinutukoy sa loob ng talinghaga
  choice: may-ari
  alternative: panginoon; amo
  rationale: Hindi ginagamit dito ang κύριος bilang tuwirang banal na titulo kundi bilang tawag sa nagmamay-ari ng ubasan sa salaysay. Iniiwasan ng “may-ari” ang di-sinasadyang paglalagay ng titulong “Panginoon,” habang hindi inaalis ang teolohikal na kabuluhan ng talinghaga.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ubasan,” “pinatay,” at “may-ari” bilang mga karaniwang salitang madaling maunawaan, habang pinanatili ang pagkakasunod ng sapilitang pagpapalabas at pagpatay.
