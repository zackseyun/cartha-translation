reference: Luke 20:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ὀρθῶς λέγεις καὶ διδάσκεις καὶ οὐ λαμβάνεις πρόσωπον, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/021.yaml
  text: And they questioned him[a], saying, “Teacher, we know that you speak and teach rightly, and you do not show partiality[b], but truly teach the way of God.”
translation:
  language: tl
  text: At tinanong nila siya, “Guro, alam naming nagsasalita at nagtuturo ka nang tama. Hindi ka nagtatangi ng tao, kundi itinuturo mo ayon sa katotohanan ang daan ng Diyos.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: tinanong
  rationale: Karaniwang kahulugan nito ang pagtatanong. Ipinahihiwatig ng konteksto ang masamang layunin ng mga nagtatanong, kaya hindi na kailangang palubhain ang pandiwa bilang “iningteroga.”
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Natural at tuwirang katumbas ng pantawag na tumutukoy sa isang nagtuturo.
- source_word: οἴδαμεν
  choice: alam namin
  rationale: Pinananatili ang tahasang pagpapahayag nila ng katiyakan, kahit pambobola ang ipinahihiwatig ng mas malawak na konteksto.
- source_word: ὀρθῶς
  choice: nang tama
  rationale: Maaaring tumukoy sa kawastuhan ng pagsasalita at pagtuturo, at natural itong umugnay sa dalawang pandiwa sa Filipino.
- source_word: λέγεις καὶ διδάσκεις
  choice: nagsasalita at nagtuturo ka
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na pandiwa ng Griyego.
- source_word: οὐ λαμβάνεις πρόσωπον
  choice: Hindi ka nagtatangi ng tao
  rationale: Ang literal na “hindi tumatanggap ng mukha” ay isang idyoma para sa hindi pagkiling batay sa pagkakakilanlan, katayuan, o panlabas na anyo. Ang “hindi nagtatangi ng tao” ang malinaw at natural na katumbas nito.
- source_word: ἐπ’ ἀληθείας
  choice: ayon sa katotohanan
  rationale: Ipinapahayag nito na ang paraan o nilalaman ng pagtuturo ay kaayon ng katotohanan; pinananatili rin nito ang pormal at marangal na tono.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: ang daan ng Diyos
  rationale: Pinananatili ang metaporang “daan” at ang malawak nitong diwa ng kalooban, pamumuhay, o landas na mula sa Diyos.
- source_word: ἀλλ’
  choice: kundi
  rationale: 'Natural na ipinakikita sa Filipino ang mariing pagsalungat sa naunang negatibong pahayag: hindi nagtatangi, kundi nagtuturo ayon sa katotohanan.'
theological_decisions:
- issue: Idyoma tungkol sa hindi pagkiling
  choice: Hindi ka nagtatangi ng tao
  alternative: Hindi ka nagpapadala sa panlabas na anyo o katayuan ng tao
  rationale: Isinalin ang kahulugan ng idyoma sa halip na ang literal na larawan upang maging malinaw na si Jesus ay hindi naiimpluwensiyahan ng katayuan o pagkakakilanlan ng tao, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Ugnayan ng ἐπ’ ἀληθείας sa pagtuturo
  choice: itinuturo mo ayon sa katotohanan
  alternative: tunay mong itinuturo
  rationale: Ang parirala ay malapit na inuugnay sa paraan ng pagtuturo. Ang “ayon sa katotohanan” ay nagpapanatili sa posibleng diin sa pagiging kaayon ng katotohanan, samantalang ang “tunay” ay maaaring marinig lamang bilang taos-puso o totoong ginagawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang literal ngunit malabong “tumatanggap ng mukha,” habang pinanatili ang dalawang pandiwang “nagsasalita” at “nagtuturo” at ang teolohikal na metaporang “daan ng Diyos.”
