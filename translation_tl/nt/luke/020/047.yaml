  text: οἳ κατεσθίουσιν τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσεύχονται· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/047.yaml
  text: who devour widows’ houses and for a pretense pray at length[b][a]. These will receive greater condemnation.
translation:
  language: tl
  text: na lumalamon sa mga ari-arian ng mga biyuda at, bilang pakunwari, ay nananalangin nang matagal.[a] Ang mga ito ay tatanggap ng mas mabigat na hatol.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bilang dahilan” o “upang magkunwari.”
    reason: lexical_alternative
  - marker: b
    text: O “mas matinding paghatol” o “mas mabigat na kondemnasyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίουσιν
  choice: lumalamon
  rationale: Pinananatili ang matindi at metaporikal na larawan ng sakim na pagsasamantala, hindi literal na pagkain.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: sa mga bahay ng mga biyuda
  rationale: Malapit sa literal na anyo ng Griyego; maaaring tumukoy ang “mga bahay” sa ari-arian o kabuhayan ng mga biyuda, ngunit hindi iyon tahasang nililinaw sa salin.
- source_word: προφάσει
  choice: bilang pagkukunwari
  rationale: Ipinahahayag na ang mahabang panalangin ay nagsisilbing mapanlinlang na panlabas na anyo o dahilan, habang pinananatili sa talababa ang alternatibong diwa na “bilang isang πρόσχημα/pretext.”
- source_word: μακρὰ προσεύχονται
  choice: nagdarasal nang mahaba
  rationale: Natural na modernong Tagalog para sa adberbiyal na μακρά, na tumutukoy sa haba ng pananalangin.
- source_word: λήμψονται
  choice: tatanggap
  rationale: Tuwirang katumbas ng panghinaharap na anyo at angkop sa solemne at hudisyal na konteksto.
- source_word: περισσότερον κρίμα
  choice: mas mabigat na hatol
  rationale: Ang “hatol” ay nagpapanatili sa hudisyal na lawak ng κρίμα, samantalang ang “mas mabigat” ay natural na nagsasaad ng higit na tindi ng kaparusahan nang hindi agad pinipili ang mas makitid na “kondemnasyon.”
theological_decisions:
- issue: Kalikasan ng κρίμα sa konteksto
  choice: hatol
  alternative: kondemnasyon
  rationale: Malinaw na salungat at kaparusahan ang hatol sa konteksto, ngunit pinananatili ng “hatol” ang mas malawak na leksikal na saklaw ng κρίμα sa halip na tahasang paliitin ito sa “kondemnasyon.”
- issue: Ugnayan ng προφάσει sa mahabang panalangin
  choice: bilang pagkukunwari
  alternative: bilang πρόσχημα o dahilan upang pagtakpan ang ginagawa nila
  rationale: Hindi nilulutas nang labis kung ang panalangin ay pakitang-tao lamang o ginagamit na pantakip sa pagsasamantala; ang pangunahing salin ay nagpapanatili ng sadyang mapanlinlang na diwa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang “lumalamon” upang mapanatili ang marahas na talinghaga, “mga biyuda” bilang karaniwang kasalukuyang katawagan, at “mas mabigat na hatol” bilang natural ngunit malapit-sa-pinagmulan na parirala. Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
