translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang “mga magsasaka ng ubasan” sa halip na teknikal o legal na katawagang “mga nangungupahan,” at “walang dala” bilang natural na katumbas ng predikatibong κενόν.
