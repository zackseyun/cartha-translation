    issue: Malabo ang layon at patutunguhan ng “nagsugo.”
    rationale: Ang Griyegong ἀπέστειλεν πρὸς τοὺς γεωργοὺς δοῦλον ay ‘nagsugo ng isang alipin sa mga magsasaka.’ Sa draft, ang pagkakasunod na “nagsugo ... sa mga magsasaka ... ng isang alipin” ay puwedeng basahing ang mga magsasaka ang tumatanggap ng alipin, sa halip na sila ang pinuntahan nito.
  - severity: low
    issue: Hindi eksakto ang paglalarawan ng literal na anyo sa talababa b.
    rationale: Ang κενόν ay literal na ‘walang laman/empty’ at sa kontekstong ito ay ‘walang dala’ o ‘walang natanggap’; hindi literal na “walang anuman.”
