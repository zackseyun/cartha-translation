source:
  edition: SBLGNT
  text: ⸀καὶ καιρῷ ἀπέστειλεν πρὸς τοὺς γεωργοὺς δοῦλον, ἵνα ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος ⸀δώσουσιν αὐτῷ· οἱ δὲ γεωργοὶ ⸂ἐξαπέστειλαν αὐτὸν δείραντες⸃ κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/010.yaml
  text: And at the proper time he sent a servant to the vine-growers[a], so that they would give him some of the fruit of the vineyard[b]. But the vine-growers sent him away empty after beating him.
translation:
  language: tl
  text: Sa takdang panahon, nagsugo siya ng isang alipin[a] sa mga magsasaka ng ubasan upang bigyan nila siya ng bahagi sa bunga ng ubasan. Ngunit binugbog siya ng mga magsasaka at pinaalis siyang walang dala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lingkod.” Saklaw ng salitang Griyego ang isang taong naglilingkod, ngunit madalas itong tumutukoy sa isang taong pag-aari ng panginoon.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “walang laman” o “empty.” Ibig sabihin, wala silang ibinigay sa kaniya mula sa bunga ng ubasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρῷ
  choice: sa takdang panahon
  rationale: Ipinahihiwatig ng dative na καιρῷ ang angkop o itinakdang panahon. Hindi ito ginawang tahasang “panahon ng anihan,” sapagkat hindi iyon espesipikong sinabi ng Griyego.
- source_word: γεωργούς
  choice: mga magsasaka ng ubasan
  rationale: Tumutukoy ang γεωργοί sa mga taong nagsasaka o nag-aalaga ng lupain; nililinaw ng konteksto ng ἀμπελών na ubasan ang kanilang sinasaka. Hindi ginamit ang “mga nangungupahan” upang hindi magdagdag ng legal na katayuang hindi tahasang nakapaloob sa salita.
- source_word: δοῦλον
  choice: alipin
  rationale: Pinananatili ng “alipin” ang kalagayang nakatali sa isang panginoon na ipinahihiwatig ng δοῦλος sa sinaunang lipunan. Maaaring “lingkod” sa ibang konteksto, ngunit mas malinaw dito ang “alipin.”
- source_word: ἵνα ... δώσουσιν αὐτῷ
  choice: upang bigyan nila siya
  rationale: Natural na ipinahahayag ng “upang” ang layunin ng pagpapadala sa alipin, habang pinananatili ang di-pangkaraniwang future indicative na kasunod ng ἵνα sa tekstong Griyego.
- source_word: ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος
  choice: ng bahagi sa bunga ng ubasan
  rationale: 'May partitive na diwa ang ἀπό: ang hinihingi ay mula sa ani, hindi kinakailangang ang kabuuan nito. Ang “bahagi” ay natural sa Filipino at hindi tumutukoy sa tiyak na dami.'
- source_word: ἐξαπέστειλαν
  choice: pinaalis
  rationale: Ipinahahayag ng “pinaalis” ang dagdag na diwa ng ἐξ- sa pandiwa—ang pagpapalayo o pagpapauwi—sa halip na simpleng “isinugo.”
- source_word: δείραντες
  choice: binugbog
  rationale: Ang δέρω ay tumutukoy sa paghampas o pambubugbog. Hindi ginamit ang mas espesipikong “hinagupit,” na maaaring magpahiwatig ng isang partikular na paraan o kasangkapan.
- source_word: κενόν
  choice: walang dala
  rationale: Bagaman literal na “walang laman” o “walang anuman,” ang κενόν na tumutukoy sa taong pinaalis ay idyomatikong nangangahulugang wala siyang natanggap o naiuuwi.
