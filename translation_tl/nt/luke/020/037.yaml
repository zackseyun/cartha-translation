  text: ὅτι δὲ ἐγείρονται οἱ νεκροὶ καὶ Μωϋσῆς ἐμήνυσεν ἐπὶ τῆς βάτου, ὡς λέγει κύριον τὸν θεὸν Ἀβραὰμ ⸀καὶ θεὸν Ἰσαὰκ ⸁καὶ θεὸν Ἰακώβ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/037.yaml
  text: But that the dead are raised[a], even Moses made known in the passage about the bush[b], where he calls the Lord the God of Abraham and the God of Isaac and the God of Jacob.
translation:
  language: tl
  text: Ngunit ipinakita rin ni Moises na ang mga patay ay binubuhay muli sa bahagi tungkol sa palumpong[a], kung saan tinatawag niya ang Panginoon[b] na Diyos ni Abraham, Diyos ni Isaac, at Diyos ni Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa palumpong.” Maaaring tumukoy ang pariralang Griyego sa mismong tagpo o, bilang isang idyoma, sa bahagi ng Kasulatan tungkol sa nagliliyab na palumpong (Exodo 3).
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “ang Panginoon.” Kaayon ito ng karaniwang paggamit ng “Panginoon” sa saling Griyego ng Lumang Tipan bilang katumbas ng banal na pangalan sa Exodo 3.
    reason: cross_reference
lexical_decisions:
- source_word: ἐγείρονται
  choice: muling binubuhay
  rationale: Pinananatili nito ang diwang pasibo ng pandiwa—ang mga patay ay binubuhay ng isang kumikilos na hindi tahasang pinangalanan—at malinaw na tumutukoy sa pagkabuhay mula sa kamatayan.
- source_word: οἱ νεκροὶ
  choice: ang mga patay
  rationale: Ito ang natural at tuwirang katumbas sa Filipino ng pangmaramihang substantibong pahayag sa Griyego.
- source_word: ἐμήνυσεν
  choice: ipinakita
  rationale: Ipinahahayag ng μηνύω ang pagpapabatid o pagbibigay-patunay. Ang “ipinakita” ay natural sa konteksto ng pangangatwirang batay sa Kasulatan nang hindi ito ginagawang pormal na proklamasyon.
- source_word: ἐπὶ τῆς βάτου
  choice: sa bahagi tungkol sa palumpong
  rationale: Maaaring tumukoy ang parirala sa mismong tagpo sa palumpong o, bilang idyoma, sa bahagi ng Kasulatan tungkol dito. Ang pangunahing salin ay gumagamit ng malinaw na pampanitikang diwa at inilalagay sa talababa ang tunay na alternatibo.
- source_word: ὡς λέγει
  choice: tinatawag niya
  rationale: Ang λέγει dito ay sinusundan ng kayariang tumutukoy kung ano ang tawag kay “Panginoon.” Likas sa Filipino ang “tinatawag niya ... na” at pinananatili nito ang kasalukuyang anyo ng pandiwa.
- source_word: κύριον
  choice: ang Panginoon
  rationale: Karaniwang katumbas ito ng κύριος bilang banal na titulo. Pinananatili ng pantukoy na “ang” ang tiyak na pagtukoy sa Panginoon.
- source_word: θεὸν Ἀβραὰμ καὶ θεὸν Ἰσαὰκ καὶ θεὸν Ἰακώβ
  choice: Diyos ni Abraham, Diyos ni Isaac, at Diyos ni Jacob
  rationale: Inuulit ang “Diyos” gaya ng pag-uulit ng θεόν sa Griyego upang mapanatili ang diin at indayog ng sipi.
theological_decisions:
- issue: Wika tungkol sa pagkabuhay ng mga patay sa argumento ni Jesus
  choice: muling binubuhay ang mga patay
  alternative: muling nabubuhay ang mga patay
  rationale: Ang “binubuhay” ay mas tuwirang nagpapanatili sa pasibong anyo ng ἐγείρονται at sa ipinahihiwatig na pagkilos ng Diyos, samantalang hindi tahasang dinaragdagan ang teksto ng pangalan ng kumikilos.
- issue: Pagsasalin ng κύριος sa siping tumutukoy sa Diyos ng Israel
  choice: ang Panginoon
  alternative: ang PANGINOON
  rationale: Ang tekstong Griyego ay may κύριον, kaya “Panginoon” ang tuwirang salin. Ang kaugnayan nito sa kinaugaliang salin ng banal na pangalan sa Griyegong Lumang Tipan ay ipinaliliwanag sa talababa sa halip na ipasok sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bahagi tungkol sa palumpong” upang madaling maunawaan ang pagtukoy sa Kasulatan, ngunit pinanatili sa talababa ang posibilidad na ang parirala ay tumukoy sa mismong tagpo. Iniwasan ang mas teknikal na “pagkabuhay na muli” sa loob ng sugnay upang mapanatili ang pasibong pandiwa ng Griyego.
