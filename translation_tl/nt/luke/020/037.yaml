  naturalness: Likas ang karamihan ng bokabularyo, ngunit mas malinaw at mas maayos sa modernong Filipino na panatilihin sa iisang pangungusap ang argumento ni Moises at ang pagtukoy sa salaysay tungkol sa palumpong.
