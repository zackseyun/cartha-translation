- from: Ngunit ipinakita rin ni Moises na muling binubuhay ang mga patay. Sa bahagi tungkol sa palumpong[a], tinatawag niya ang Panginoon[b] na Diyos ni Abraham, Diyos ni Isaac, at Diyos ni Jacob.
