base_translation:
  language: en
  yaml_path: translation/nt/luke/020/031.yaml
  text: And the third took her[a], and likewise all seven left no children and died.
translation:
  language: tl
  text: 'At kinuha siya ng ikatlo bilang asawa[a]. Gayundin ang lahat ng pito: wala silang iniwang anak, at namatay sila.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pinakasalan siya.” Literal sa Griyego ang “kinuha siya,” isang idyoma rito para sa pagkuha sa isang babae bilang asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρίτος
  choice: ang ikatlo
  rationale: Pinananatili nito ang elipsis ng Griyego, na hindi inuulit ang salitang “kapatid,” at natural pa rin ito dahil malinaw ang tinutukoy mula sa konteksto.
- source_word: ἔλαβεν αὐτήν
  choice: kinuha siya bilang asawa
  rationale: Literal na “kinuha siya” ang parirala, ngunit sa konteksto ng pag-aasawa sa balo ng kapatid, malinaw na ang ibig sabihin ay kinuha siya bilang asawa. Idinagdag ang “bilang asawa” upang maiwasan ang maling pagkaunawang basta isinama o dinakip lamang siya.
- source_word: ὡσαύτως δὲ καὶ
  choice: Gayundin
  rationale: Likas at maikli itong panandang nagpapakitang pareho ang nangyari sa sumunod na magkakapatid.
- source_word: οἱ ἑπτὰ
  choice: ang lahat ng pito
  rationale: Ipinahahayag nito ang kabuuang pangkat ng pitong magkakapatid na tinutukoy sa salaysay.
- source_word: οὐ κατέλιπον τέκνα
  choice: wala silang iniwang anak
  rationale: Pinananatili nito ang diwa ng καταλείπω na walang naiwang nabubuhay na anak pagkamatay nila, sa halip na sabihing wala lamang silang naging anak.
- source_word: τέκνα
  choice: anak
  rationale: Ito ang pinakakaraniwan at malinaw na katumbas sa Filipino; kolektibo ang gamit nito rito kahit walang panandang maramihan.
- source_word: ἀπέθανον
  choice: namatay sila
  rationale: Tuwiran nitong isinasalin ang pandiwang Griyego nang walang pagpapalambot sa kahulugan.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Pinanatili ang “ang ikatlo” sa halip na idagdag ang “kapatid,” habang nilinaw sa pangunahing teksto ang kahulugang pangkasal ng idyomang Griyego. Ang tutuldok ay natural na nag-uugnay sa buod ng nangyari sa lahat ng pito.
