  text: And he proceeded to send another servant; but they also beat and dishonored that one[a], and sent him away empty-handed.
translation:
  language: tl
  text: Nagsugo pa siya ng isa pang alipin[a]. Ngunit binugbog at hinamak din nila ito, at pinaalis nang walang dala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “lingkod.” Ang Griyegong δοῦλος ay maaaring tumukoy sa isang alipin o lingkod; sa talinghagang ito, pinananatili ng “alipin” ang katayuang nakatali sa may-ari.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: Pagkatapos, nagsugo pa siya
  rationale: Ang προστίθημι na may pawatas ay idyomang nagsasaad ng pagpapatuloy o pagdaragdag ng isa pang kilos. Likas sa modernong Tagalog ang “nagsugo pa siya,” at ipinahihiwatig ng “pagkatapos” ang pagsulong ng salaysay.
- source_word: ἕτερον
  choice: isa pang
  rationale: Tumutukoy ito sa karagdagang alipin na iba sa nauna; malinaw at natural ang “isa pang.”
- source_word: πέμψαι
  choice: nagsugo
  rationale: Ang “nagsugo” ay angkop sa pagpapadala ng isang tauhan na may ipinagagawa, gaya ng hinihingi ng konteksto.
- source_word: δοῦλον
  choice: alipin
  rationale: Pinananatili ng “alipin” ang nakatali at pag-aaring katayuan ng tauhan sa talinghaga, na mas tiyak kaysa sa pangkalahatang “lingkod.”
- source_word: κἀκεῖνον
  choice: din nila ito
  rationale: Ipinakikita ng “din” na gayon din ang ginawa nila sa ikalawang alipin, samantalang natural na tumutukoy rito ang “ito” sa Tagalog.
- source_word: δείραντες
  choice: binugbog
  rationale: Malinaw na ipinahahayag ng “binugbog” ang pisikal na pananakit nang hindi nililimitahan ang paraan nito sa paghagupit.
- source_word: ἀτιμάσαντες
  choice: hinamak
  rationale: Saklaw ng “hinamak” ang paglapastangan at pagtrato sa tao na parang walang dangal, kaya napapanatili ang dimensiyon ng kahihiyan sa ἀτιμάζω.
- source_word: ἐξαπέστειλαν
  choice: pinaalis
  rationale: Tumpak at natural na inilalarawan ng “pinaalis” ang pagpapalayas o pagpapauwi sa kaniya mula sa ubasan nang hindi nagdaragdag ng tiyak na destinasyon.
- source_word: κενόν
  choice: nang walang dala
  rationale: Sa konteksto, nangangahulugan itong pinaalis siya nang walang natanggap na inaasahang bunga. Ang “walang dala” ang likas na katumbas sa Tagalog.
theological_decisions:
- issue: Pagbibigay-kahulugan sa δοῦλος sa talinghaga
  choice: alipin
  alternative: lingkod
  rationale: Mahalaga sa tagpo ang ugnayan ng pag-aari at kapangyarihan sa pagitan ng may-ari at ng isinugo. Pinananatili ng “alipin” ang panlipunang katotohanang iyon nang hindi nagdaragdag ng doktrinal na pakahulugan; inilalahad sa talababa ang mas banayad na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang maiikling sugnay at karaniwang mga pandiwa upang maging madaling maunawaan, habang pinananatili ang pagkakasunod-sunod at tindi ng mga kilos sa Griyego.
