  yaml_path: translation/nt/luke/020/023.yaml
  text: But perceiving their cunning[a], he said to them,
translation:
  language: tl
  text: Ngunit nang mapansin niya ang kanilang katusuhan[a], sinabi niya sa kanila,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tusong pakana,” “panlilinlang,” o “pandaraya.” Ang salitang Griyego ay tumutukoy sa tuso at walang-prinsipyong pagpapakana.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσας
  choice: napansin
  rationale: Ipinahihiwatig ng aorist participle na nakilala o naunawaan ni Jesus ang kanilang ginagawa bago siya nagsalita. Likas sa modernong Tagalog ang “napansin” at hindi nito pinalalabis ang diwa.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagsasaad ito rito ng banayad na pagsalungat habang tumutugon si Jesus sa kanilang masamang layunin.
- source_word: αὐτῶν
  choice: kanilang
  rationale: Likas na anyong paari sa Tagalog para sa genitibong panghalip na tumutukoy sa πανουργίαν.
- source_word: πανουργίαν
  choice: tusong pakana
  rationale: Pinagsasama ng parirala ang tuso at mapanlinlang na pag-iisip at ang diwa ng masamang pagpapakana. Mas malinaw ito sa karaniwang mambabasa kaysa sa “katusuhan” lamang.
- source_word: εἶπεν
  choice: sinabi
  rationale: Karaniwan at likas na salin ng αφηγηματικό aorist ng λέγω.
- source_word: πρὸς αὐτούς
  choice: sa kanila
  rationale: Tumpak at likas na pagtukoy sa mga kinausap niya.
