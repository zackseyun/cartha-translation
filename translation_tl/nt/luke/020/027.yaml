id: LUK.20.27
reference: Luke 20:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Προσελθόντες δέ τινες τῶν Σαδδουκαίων, οἱ ⸀ἀντιλέγοντες ἀνάστασιν μὴ εἶναι, ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/027.yaml
  text: Then some of the Sadducees[a], who deny that there is a resurrection, came up and questioned him,
translation:
  language: tl
  text: Pagkatapos, lumapit ang ilan sa mga Saduceo, na nagsasabing walang pagkabuhay na muli[a], at tinanong nila siya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na itinatangging may pagkabuhay na muli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσελθόντες
  choice: lumapit
  rationale: Likas at tuwirang ipinapahayag ang paglapit nila sa tinutukoy na kausap; bilang aorist participle, nauuna ang kilos na ito sa pagtatanong.
- source_word: δέ
  choice: Pagkatapos
  rationale: Dito, ipinagpapatuloy ng δέ ang salaysay sa halip na magpahiwatig ng matinding pagsalungat.
- source_word: τινες τῶν Σαδδουκαίων
  choice: ang ilan sa mga Saduceo
  rationale: 'Pinananatili nito ang partitive na diwa: ilan lamang mula sa pangkat ng mga Saduceo.'
- source_word: οἱ ἀντιλέγοντες ἀνάστασιν μὴ εἶναι
  choice: na nagsasabing walang pagkabuhay na muli
  rationale: Sa konstruksiyong ito, ipinahahayag ng participle at infinitive clause ang paninindigan nilang hindi umiiral ang pagkabuhay na muli. Natural sa modernong Tagalog ang 'nagsasabing walang' at hindi nito dinaragdagan ang pahayag.
- source_word: ἀνάστασιν
  choice: pagkabuhay na muli
  rationale: Ito ang malinaw at karaniwang salin sa Tagalog para sa muling pagbangon ng patay.
- source_word: ἐπηρώτησαν αὐτόν
  choice: tinanong nila siya
  rationale: Tuwirang inilalarawan ang pangunahing kilos at pinananatili ang panghalip na tumutukoy kay Jesus ayon sa konteksto.
theological_decisions:
- issue: Paglalarawan sa paninindigan ng mga Saduceo tungkol sa pagkabuhay na muli
  choice: na nagsasabing walang pagkabuhay na muli
  alternative: na itinatangging may pagkabuhay na muli
  rationale: Malinaw na ipinahahayag ng napiling salin ang nilalaman ng kanilang paninindigan nang hindi nagdaragdag ng paliwanag o ng doktrinal na detalye. Ang alternatibo ay wastong naghahatid ng puwersa ng ἀντιλέγοντες ngunit bahagyang mas interpretatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang karaniwang baybay na “Saduceo” at ang nakaugaliang pariralang “pagkabuhay na muli.” Pinanatili ang kuwit sa hulihan sapagkat nagpapatuloy ang pangungusap sa susunod na talata.
