  source_fidelity: Tumpak na naipapahayag ng salin ang pagkakasunod ng kilos (lumapit at saka nagtanong), ang partitive na “ilan sa mga Saduceo,” at ang kanilang pagtanggi sa pagkabuhay na muli. Ang “na nagsasabing walang pagkabuhay na muli” ay wastong idiomatikong paghahatid ng οἱ ἀντιλέγοντες ἀνάστασιν μὴ εἶναι nang hindi nagdaragdag ng doktrinal na paliwanag.
  naturalness: Natural at malinaw sa modernong Filipino Tagalog ang “lumapit,” “ilan sa mga Saduceo,” “pagkabuhay na muli,” at “tinanong nila siya.” Ang hulihang kuwit ay angkop dahil ipinagpapatuloy ng susunod na talata ang pangungusap.
