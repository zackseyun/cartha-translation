  text: Sapagkat hindi na sila nangahas na magtanong sa kanya ng anuman.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκέτι
  choice: hindi na
  rationale: Likas na salin sa modernong Tagalog na malinaw na nagpapahayag ng pagtigil mula sa puntong iyon.
- source_word: γάρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang konteksto.
- source_word: ἐτόλμων
  choice: nangahas
  rationale: Ipinahahayag ang kawalan na ngayon ng lakas ng loob na kumilos; kasama ng “hindi na,” naipapakita ang aspektong tumigil na ang dati nilang paggawa o kahandaan.
- source_word: ἐπερωτᾶν
  choice: na magtanong
  rationale: Natural at tumpak na pandiwang Tagalog para sa pagtatanong sa kontekstong ito.
- source_word: αὐτὸν
  choice: sa kanya
  rationale: Karaniwang anyo ng layon ng “magtanong” sa Tagalog at tumutukoy kay Jesus ayon sa konteksto.
- source_word: οὐδέν
  choice: ng anuman
  rationale: 'Kasama ng negatibong “hindi na,” natural nitong ipinahahayag ang ganap na saklaw: wala na silang anumang itinatanong sa kanya.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang “nangahas” upang mapanatili ang diwa ng lakas ng loob sa τολμάω, habang ang “Sapagkat” ay nagpapanatili sa paliwanag na gamit ng γάρ.
