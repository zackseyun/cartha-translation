  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/008.yaml
  text: And Jesus said to them[a], “Neither will I tell you by what authority I do these things.”
translation:
  language: tl
  text: At sinabi sa kanila ni Jesus, “Hindi ko rin sasabihin sa inyo kung sa anong awtoridad ko ginagawa ang mga bagay na ito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐδὲ
  choice: Hindi ko rin
  rationale: Iniuugnay ng οὐδέ ang pagtanggi ni Jesus sa naunang pagtanggi ng mga pinuno. Likas sa Filipino ang “Hindi ko rin” at pinananatili nito ang tugunang diin nang hindi kinakailangang gawing tahasang panghinaharap ang pandiwang Griyego.
- source_word: λέγω
  choice: sasabihin
  rationale: Sa kontekstong may taong pinag-uukulan at nilalamang hindi ibubunyag, ang “sasabihin sa inyo” ang natural na katumbas sa Filipino. Ang anyong panghinaharap ay angkop sa diwa ng pagtangging magbigay ng sagot.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: sa anong awtoridad
  rationale: Ang “sa anong awtoridad” ay natural na tanong sa Filipino tungkol sa batayan o karapatang pinagmumulan ng pagkilos, at hindi nito ginagawang simpleng lakas lamang ang ἐξουσία.
- source_word: ἐξουσίᾳ
  choice: awtoridad
  rationale: Tumutukoy rito ang salita sa lehitimong karapatan o kapangyarihang kumilos, hindi lamang sa pisikal o di-tiyak na kapangyarihan.
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ng parirala ang tahasang maramihang anyo ng demonstratibong Griyego at ang pagtukoy nito sa mga gawa ni Jesus na pinagtatalunan.
- source_word: ποιῶ
  choice: ginagawa ko
  rationale: Ang kasalukuyang aspekto ay natural na naipapahayag sa Filipino sa “ginagawa ko,” na tumutukoy sa mga kilos ni Jesus na kasalukuyang pinag-uusapan.
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: At sinabi sa kanila ni Jesus
  rationale: Malapit ito sa ayos at simpleng daloy ng salaysay sa Griyego habang nananatiling natural at malinaw sa Filipino.
theological_decisions:
- issue: Ang pagtanggi ni Jesus na sagutin ang mga pinuno
  choice: Isinalin bilang tuwirang pagtangging sabihin ang awtoridad na pinagmumulan ng kanyang mga gawa.
  alternative: Magpahiwatig na umiiwas lamang si Jesus sa tanong, o tahasang idagdag na hinahatulan niya ang kanilang kawalan ng pananampalataya.
  rationale: Ang talata mismo ay nagsasaad lamang ng pagtanggi ni Jesus na ibigay ang sagot. Hindi dapat dagdagan ng salin ang dahilan o teolohikal na hatol na hindi tahasang nasa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang salitang “awtoridad” dahil mas tiyak ito kaysa “kapangyarihan” sa kontekstong tumutukoy sa karapatan o basihan ng pagkilos.
