  to: At tinangka ng mga tagapagturo ng Kautusan at ng mga punong pari na dakpin siya sa oras ding iyon,[a] ngunit natakot sila sa mga tao, sapagkat alam nilang laban sa kanila niya sinabi ang talinghagang iyon.[b]
  rationale: Pinalitan ang di-idiomatikong “nang oras ding iyon” ng “sa oras ding iyon” at ang “hinangad” ng “tinangka” upang maging mas natural at mas malapit sa puwersa ng ἐζήτησαν. Inayos din ang literal na tala upang maging gramatikal sa Tagalog. Hindi binago ang kontekstuwal na “laban sa kanila,” at pinananatili ng talababa ang mas literal na alternatibo.
