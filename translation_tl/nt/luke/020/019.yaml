  terminology: Katanggap-tanggap ang “mga tagapagturo ng Kautusan,” “mga punong pari,” at “talinghaga.” Ang “dakpin” ay likas na katumbas sa kontekstong ito, habang pinananatili ng talababa ang literal na imahen ng Griyego.
