  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐζήτησαν οἱ ⸂γραμματεῖς καὶ οἱ ἀρχιερεῖς⸃ ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας ἐν αὐτῇ τῇ ὥρᾳ, καὶ ἐφοβήθησαν ⸂τὸν λαόν⸃, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς ⸂εἶπεν τὴν παραβολὴν ταύτην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/019.yaml
  text: And the scribes and the chief priests sought to lay hands on him in that very hour[a], but they feared the people[b], for they knew that he had told this parable against them.
translation:
  language: tl
  text: At tinangka ng mga tagapagturo ng Kautusan at ng mga punong pari na dakpin siya sa oras ding iyon,[a] ngunit natakot sila sa mga tao, sapagkat alam nilang laban sa kanila niya sinabi ang talinghagang iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ipatong ang mga kamay sa kanya”; maaari ring “hulihin siya” o “arestuhin siya.”
    reason: lexical_alternative
  - marker: b
    text: O “sa kanila.” Sa konteksto, malamang na ang ibig sabihin ay laban sa kanila o patungkol sa kanila ang talinghaga.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐζήτησαν
  choice: hinangad
  rationale: Ipinapahayag ng aorist ang kanilang tiyak na hangarin at pagtatangka nang hindi sinasabing nagtagumpay sila.
- source_word: γραμματεῖς
  choice: mga tagapagturo ng Kautusan
  rationale: Natural at malinaw ito sa modernong Tagalog para sa kinikilalang pangkat ng mga dalubhasa at guro ng Kautusan; mas madaling maunawaan kaysa sa teknikal na “mga eskriba.”
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Tumutukoy ang pangmaramihang anyo sa mga pinuno ng uring makasaserdote, hindi sa maraming sabay-sabay na nanunungkulang mataas na pari.
- source_word: ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: dakpin siya
  rationale: Idyoma ito para sa marahas na paghawak o pagdakip. Ang “dakpin” ay natural sa Tagalog at hindi labis na nagtatakda kung pormal na pag-aresto ang ibig sabihin; pinananatili sa talababa ang literal na larawan.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: nang oras ding iyon
  rationale: Pinananatili nito ang diin sa agarang panahong tinutukoy nang hindi ginagawang mas tiyak na “sandali” ang ὥρα.
- source_word: ἐφοβήθησαν τὸν λαόν
  choice: natakot sila sa mga tao
  rationale: Ang λαός ay tumutukoy sa bayan o mga tao sa pangkalahatan, hindi lamang sa isang nagkakatipong pulutong.
- source_word: ἔγνωσαν
  choice: alam nilang
  rationale: Direkta at natural na ipinapahayag nito ang pagkilala nila kung sino ang pinatutungkulan ng talinghaga.
- source_word: πρὸς αὐτοὺς
  choice: laban sa kanila
  rationale: Sa konteksto, nakita nilang sila ang pinupuna at hinahatulan ng talinghaga. Gayunman, itinatala sa talababa ang mas literal at tunay na posibleng “sa kanila.”
- source_word: παραβολὴν
  choice: talinghaga
  rationale: Ito ang nakaugaliang malinaw na salin ng παραβολή sa konteksto ng mga Ebanghelyo.
theological_decisions:
- issue: Lakas ng πρὸς αὐτοὺς kaugnay ng talinghaga ni Jesus
  choice: laban sa kanila
  alternative: sa kanila; tungkol sa kanila
  rationale: Ipinakikita ng agarang reaksiyon ng mga pinuno na naunawaan nilang sila ang tinatamaan ng talinghaga. Ang “laban sa kanila” ay naghahatid ng konfrontasyonal na lakas ng konteksto, samantalang pinananatili ng talababa ang literal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “mga tagapagturo ng Kautusan” sa halip na teknikal na “mga eskriba,” at “dakpin” para sa natural na paghahatid ng idyomang Griyego. Parehong marker na [a] at [b] ay nasa pangunahing teksto.
