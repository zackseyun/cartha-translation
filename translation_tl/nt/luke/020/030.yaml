lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Karaniwang pang-ugnay na nagpapatuloy sa pagkakasunod-sunod ng mga kapatid sa isinasalaysay na sitwasyon.
- source_word: ὁ δεύτερος
