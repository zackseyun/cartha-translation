id: LUK.8.24
reference: Luke 8:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: προσελθόντες δὲ διήγειραν αὐτὸν λέγοντες· Ἐπιστάτα ἐπιστάτα, ἀπολλύμεθα· ὁ δὲ ⸀διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ τῷ κλύδωνι τοῦ ὕδατος, καὶ ἐπαύσαντο, καὶ ἐγένετο γαλήνη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/024.yaml
  text: Then they came and woke him[a], saying, “Master, Master, we are perishing!” And he, having awakened, rebuked the wind and the surging of the water, and they ceased, and there was a calm.
translation:
  language: tl
  text: Lumapit sila at ginising siya. Sinabi nila, “Guro, Guro, mamamatay na tayo!” Nang magising siya, sinaway niya ang hangin at ang pagdaluyong ng tubig[a]. Tumigil ang mga ito, at nagkaroon ng katahimikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pagdaluyong ng mga alon.”
    reason: Posibleng mas kongkretong salin ng κλύδωνι τοῦ ὕδατος, na tumutukoy sa pag-alsa o paghampas ng tubig.
lexical_decisions:
- source_word: προσελθόντες
  choice: Lumapit sila
  rationale: Ipinahahayag ang paglapit nila kay Jesus bilang kilos na nauna sa paggising sa kanya, nang hindi nagdaragdag ng di-binanggit na detalye.
- source_word: διήγειραν
  choice: ginising siya
  rationale: 'Likas at tuwirang salin ng transitive na anyo: sila ang gumising kay Jesus mula sa pagtulog.'
- source_word: Ἐπιστάτα
  choice: Guro
  rationale: Magalang at likas na katawagan sa modernong Filipino para sa kinikilalang may awtoridad. Hindi nito ipinapasok ang titulong κύριος na karaniwang isinasaling “Panginoon,” bagaman hindi ganap na naihahayag ng “Guro” ang lawak ng awtoridad na maaaring taglay ng salitang Griyego.
- source_word: ἀπολλύμεθα
  choice: mamamatay na tayo
  rationale: Likas na pahayag ng nalalapit at matinding panganib sa Filipino; pinananatili nito ang diwa ng napipintong kamatayan at ang nagpapatuloy na kalagayan.
- source_word: διεγερθεὶς
  choice: Nang magising siya
  rationale: Pinananatili ang pagkakasunod-sunod ng mga pangyayari at hindi tiyak na sinasabi kung kusang nagising si Jesus o nagising dahil sa ginawa nila.
- source_word: ἐπετίμησεν
  choice: sinaway niya
  rationale: Karaniwang salin sa konteksto ng mga Ebanghelyo para sa mariin at makapangyarihang pagpigil o pagsaway.
- source_word: ἀνέμῳ
  choice: ang hangin
  rationale: Tuwirang salin na hindi nagpapalawak dito bilang unos o bagyo.
- source_word: κλύδωνι τοῦ ὕδατος
  choice: ang pagdaluyong ng tubig
  rationale: Inilalarawan ang malakas na pag-alsa at pagragasa ng tubig habang pinananatili ang tahasang genitibong “ng tubig”; inilalagay sa talababa ang posibleng mas kongkretong paglalarawan bilang mga alon.
- source_word: ἐπαύσαντο
  choice: Tumigil ang mga ito
  rationale: Pinananatili ang pangmaramihang pandiwa, na tumutukoy sa hangin at sa pagdaluyong ng tubig.
- source_word: ἐγένετο γαλήνη
  choice: nagkaroon ng katahimikan
  rationale: Likas na Filipino para sa pagdating ng kalmadong kalagayan matapos tumigil ang hangin at tubig, nang hindi nagdaragdag ng paliwanag.
theological_decisions:
- issue: Ang katawagang Ἐπιστάτα kay Jesus
  choice: Guro
  alternative: Panginoon; Pinuno
  rationale: Ipinakikita ng katawagan ang paggalang at pagkilala sa awtoridad ni Jesus. Pinili ang “Guro” bilang likas na katawagan sa Filipino at upang hindi ito ipagkamali sa κύριος (“Panginoon”); hindi naman pinili ang “Pinuno” sapagkat masyado nitong nililimitahan ang kahulugan sa pamumuno o pag-uutos.
- issue: Ang awtoridad ni Jesus sa hangin at tubig sa ἐπετίμησεν
  choice: sinaway niya
  alternative: inutusan niya; kinausap niya
  rationale: Pinananatili ng “sinaway” ang mariin at personal na lakas ng pandiwa at ang paglalarawan sa tuwirang awtoridad ni Jesus sa mga puwersa ng kalikasan, nang walang idinaragdag na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Hinati ang mahaba at magkakaugnay na pangungusap ng Griyego sa maiikling pangungusap para sa likas na daloy sa Filipino, habang pinananatili ang pagkakasunod-sunod, pag-uulit ng katawagan, pangmaramihang pagtigil ng hangin at tubig, at resulta nitong katahimikan.
