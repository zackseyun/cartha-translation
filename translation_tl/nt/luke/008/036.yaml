  source_fidelity: 'Tumpak ang pangunahing diwa at ayos ng pangungusap: ang mga nakakita ang nag-ulat sa kanila kung paano nangyari ang ἐσώθη. Gayunman, ang δαιμονισθείς ay isahang participle at hindi tinutukoy sa mismong talata kung isa o marami ang demonyo. Ang “mga demonyo” ay maaaring mahango sa mas malawak na konteksto, ngunit nagdaragdag ito ng bilang na hindi ipinahahayag ng talatang ito.'
  naturalness: Likas at malinaw sa makabagong Filipino ang “isinalaysay ng mga nakasaksi sa kanila kung paano nailigtas ang lalaking sinapian ng demonyo.” Ang ayos na ito ay bahagyang mas tuwiran kaysa sa paghihiwalay ng “sa kanila” bago ang simuno.
