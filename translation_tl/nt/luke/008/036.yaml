  text: And those who had seen it reported to them how the demon-possessed man had been saved[a].
translation:
  language: tl
  text: At isinalaysay ng mga nakasaksi sa kanila kung paano nailigtas ang lalaking sinapian ng demonyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “napagaling” o “napalaya.” Ang pandiwang Griyego ay maaaring mangahulugang iligtas, pagalingin, o palayain, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: isinalaysay
  rationale: Ang aorist na ἀπήγγειλαν ay nangangahulugang nag-ulat o nagsabi. Ang “isinalaysay” ay natural sa konteksto ng mga saksi na naglahad ng nangyari.
- source_word: δὲ
  choice: At
  rationale: Banayad na pang-ugnay ito na nagpapatuloy sa salaysay at hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwirang ipinapakita ng pariralang ito ang mga tumanggap ng salaysay.
- source_word: οἱ ἰδόντες
  choice: mga nakasaksi
  rationale: Tumutukoy ang articular participle sa mga taong mismong nakakita sa pangyayari. Maikli, natural, at malinaw ang “mga nakasaksi.”
- source_word: πῶς
  choice: kung paano
  rationale: Pinananatili nito ang paglalarawan sa paraan o pangyayari ng pagliligtas, sa halip na gawing simpleng “na.”
- source_word: ἐσώθη
  choice: nailigtas
  rationale: Ang passive na anyo ng σῴζω ay maaaring mangahulugang iligtas, pagalingin, o palayain. Pinananatili ng “nailigtas” ang malawak na saklaw ng salita, habang inilalahad sa talababa ang ibang angkop na pagbasa.
- source_word: ὁ δαιμονισθείς
  choice: ang lalaking sinapian ng mga demonyo
  rationale: Malinaw at likas itong paglalarawan sa lalaking dumanas ng impluwensiya o pananahan ng mga demonyo. Iniiwasan nito ang lipas o teknikal na katawagan.
theological_decisions:
- issue: Pagpapakahulugan sa ἐσώθη sa konteksto ng pagpapalayas ng mga demonyo
  choice: nailigtas
  alternative: napagaling; napalaya
  rationale: Maaaring tumukoy ang σῴζω sa pagliligtas, pagpapagaling, o pagpapalaya. Ang “nailigtas” sa pangunahing teksto ay nagpapanatili sa lawak at teolohikal na pahiwatig ng salitang Griyego, samantalang kinikilala sa talababa ang mga kahulugang higit na tuwirang kaugnay ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga nakasaksi” para sa likas na daloy at ang “sinapian ng mga demonyo” bilang madaling maunawaang paglalarawan. Nakalagay ang talababa [a] sa pangunahing teksto.
