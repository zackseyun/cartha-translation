id: LUK.8.29
reference: Luke 8:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀παρήγγελλεν γὰρ τῷ πνεύματι τῷ ἀκαθάρτῳ ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου. πολλοῖς γὰρ χρόνοις συνηρπάκει αὐτόν, καὶ ⸀ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος, καὶ διαρρήσσων τὰ δεσμὰ ἠλαύνετο ⸀ὑπὸ τοῦ ⸀δαιμονίου εἰς τὰς ἐρήμους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/029.yaml
  text: For he had commanded the unclean spirit to come out of the man[a]. For many times it had seized him, and he was kept bound with chains and shackles, being guarded, and breaking the bonds[c][b], he was driven by the demon into the desolate places.
translation:
  language: tl
  text: Sapagkat iniutos na niya sa maruming espiritu na lumabas mula sa lalaki. Maraming ulit na siyang sinunggaban nito, at iginagapos siya ng mga tanikala at pangaw sa paa habang binabantayan. Nilalagot niya ang mga gapos, at itinataboy siya ng demonyo sa mga liblib na lugar[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Matagal na nitong sinunggaban ang lalaki.” Maaaring tumukoy ang Griyego sa mahabang panahon o sa maraming pagkakataon.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa mga ilang na lugar”; tumutukoy ito sa mga liblib at walang naninirahang lugar.
    reason: lexical_clarification
lexical_decisions:
- source_word: παρήγγελλεν
  choice: iniutos na niya
  rationale: Ipinahihiwatig ng imperpektong pandiwa sa paliwanag na may nauna at nagpapatuloy na utos si Jesus; natural na naihahatid ito sa Tagalog ng “iniutos na niya.”
- source_word: πνεύματι τῷ ἀκαθάρτῳ
  choice: sa maruming espiritu
  rationale: Pinananatili ang karaniwang terminong biblikal at ang tuwirang kaugnayan ng ἀκάθαρτος sa karumihan.
- source_word: πολλοῖς γὰρ χρόνοις
  choice: Maraming ulit
  rationale: Sa konteksto ng paulit-ulit na pagsunggab at paggapos, inuunawa ang parirala bilang tumutukoy sa maraming pagkakataon; tunay na posible rin ang kahulugang pangmatagalan at inilalahad iyon sa talababa.
- source_word: συνηρπάκει αὐτόν
  choice: nitong sinunggaban ang lalaki
  rationale: Ang “sinunggaban” ay naghahatid ng biglaan at marahas na pag-agaw o pananakal ng kapangyarihan; inuulit ang “lalaki” upang luminaw ang reperensiya sa natural na Tagalog.
- source_word: ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις
  choice: iginagapos siya ng mga tanikala at pangaw sa paa
  rationale: Ang “iginagapos” ay angkop sa paulit-ulit na kilos ng imperpekto; pinag-iiba ng “tanikala” at “pangaw sa paa” ang dalawang uri ng panali.
- source_word: φυλασσόμενος
  choice: mahigpit na binabantayan
  rationale: Ipinakikita ang kalagayan habang siya ay nakagapos; ang “mahigpit” ay likas na pahiwatig ng pagbabantay sa isang pinipigil na tao.
- source_word: διαρρήσσων τὰ δεσμὰ
  choice: nilalagot niya ang mga gapos
  rationale: Ang “nilalagot” ay nagpapahayag ng marahas at paulit-ulit na pagkaputol, at ang “mga gapos” ay mas malawak kaysa “mga tanikala.”
- source_word: ἠλαύνετο ὑπὸ τοῦ δαιμονίου
  choice: itinataboy siya ng demonyo
  rationale: Pinananatili ng “itinataboy” ang puwersahan at paulit-ulit na pagkilos ng pasibong imperpekto, at tuwirang isinasalin ang personal na ahensiya ng δαιμόνιον.
- source_word: εἰς τὰς ἐρήμους
  choice: sa mga ilang na lugar
  rationale: Pinananatili ang pangmaramihang anyo at ang diwa ng mga lugar na liblib o walang naninirahan nang hindi ipinapalagay na disyerto ang lupain.
theological_decisions:
- issue: Mga katawagang tumutukoy sa demonyo
  choice: maruming espiritu; demonyo
  alternative: masamang espiritu; puwersa ng karamdaman
  rationale: Tuwirang ipinakikilala ng salaysay ang personal na espiritung kumikilos; hindi ito pinalalabo o ginagawang metapora lamang.
- issue: Ugnayan ng utos ni Jesus at tugon ng demonyo
  choice: iniutos na niya
  alternative: inuutusan niya noon
  rationale: Naihahatid ng “na” ang utos bilang saligang pangyayaring nagpapaliwanag sa naunang tugon, samantalang hindi itinatanggi ang aspektong imperpekto ng Griyego.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pangaw sa paa” upang malinaw na maiba sa pangkalahatang “tanikala,” at “mga ilang na lugar” upang mapanatili ang pangmaramihang Griyego. Isinaayos ang mahaba at masalimuot na pangungusap sa dalawang pangungusap para sa likas na daloy ng Tagalog nang hindi binabago ang mga ugnayang lohikal.
