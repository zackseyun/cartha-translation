revisions:
- from: Sapagkat iniutos na niya sa maruming espiritu na lumabas sa lalaki. Maraming ulit na nitong sinunggaban ang lalaki[a]. Kahit iginagapos siya ng mga tanikala at pangaw sa paa at mahigpit na binabantayan, nilalagot niya ang mga gapos, at itinataboy siya ng demonyo sa mga ilang na lugar[b].
  to: Sapagkat iniutos na niya sa maruming espiritu na lumabas mula sa lalaki. Maraming ulit na siyang sinunggaban nito, at iginagapos siya ng mga tanikala at pangaw sa paa habang binabantayan. Nilalagot niya ang mga gapos, at itinataboy siya ng demonyo sa mga liblib na lugar[b].[a]
  rationale: Inalis ang hindi ipinahihiwatig na konsesibong “Kahit” at hinati ang salaysay sa maiikling pangungusap upang malinaw na maipakita ang mga sunod-sunod na kalagayan at kilos. Pinalitan ang “mga ilang na lugar” ng mas natural na “mga liblib na lugar.” Inayos din ang pagkakasunod ng mga footnote anchor upang tumugma ang [a] sa “Maraming ulit” at [b] sa “mga liblib na lugar.”
