  text: οὐ γάρ ἐστιν κρυπτὸν ὃ οὐ φανερὸν γενήσεται, οὐδὲ ἀπόκρυφον ὃ οὐ ⸂μὴ γνωσθῇ⸃ καὶ εἰς φανερὸν ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/017.yaml
  text: For nothing is hidden that will not become evident[c][b][a], nor is anything secret that will not be known and come to light.
translation:
  language: tl
  text: Sapagkat walang nakatago na hindi mabubunyag, ni walang lihim na hindi malalaman[a] at malalantad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tiyak na malalaman”; mariing ipinahihiwatig ng pagkakabuo sa Griyego na walang lihim na mananatiling hindi nalalaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸν
  choice: nakatago
  rationale: Likas na salin ito ng bagay na itinago o hindi lantad, at malinaw ang pagtutol nito sa φανερόν.
- source_word: φανερὸν γενήσεται
  choice: mabubunyag
  rationale: Ipinahihiwatig ng parirala ang pagbabago mula sa pagiging nakatago tungo sa pagiging hayag; natural itong ipinapahayag ng pandiwang Filipino na “mabubunyag.”
- source_word: ἀπόκρυφον
  choice: lihim
  rationale: Pinananatili nito ang bahagyang pagkakaiba sa κρυπτόν habang kaagapay pa rin ng ideya ng bagay na hindi hayag.
- source_word: οὐ μὴ γνωσθῇ
  choice: hindi malalaman
  rationale: Sa loob ng negatibong sugnay na “walang ... na hindi,” ipinapahayag nito ang matinding katiyakang walang lihim na mananatiling hindi nalalaman.
- source_word: εἰς φανερὸν ἔλθῃ
  choice: malalantad
  rationale: Natural at marangal na Filipino ito para sa paglabas ng isang bagay sa hayag o sa kaalaman ng iba.
- source_word: γάρ
  choice: Sapagkat
  rationale: Pinananatili nito ang paliwanag o batayang kaugnayan ng talata sa naunang pahayag.
theological_decisions:
- issue: Saklaw at panahon ng pagbubunyag
  choice: Isang malawak na simulain na ang nakatago at lihim ay mabubunyag at malalaman.
  alternative: Tiyak na pagtukoy lamang sa huling paghuhukom, o tanging sa paghahayag ng turo ni Jesus sa agarang konteksto.
  rationale: Hindi tinutukoy ng mismong talata ang eksaktong panahon o iisang aplikasyon, kaya pinananatiling malawak ang pahayag at hindi nililimitahan ang teolohikal na saklaw nito.
translation_notes:
  register: Modernong Filipino na malinaw, maikli, at marangal. Pinanatili ang magkatulad na balangkas ng dalawang sugnay, habang ginamit ang natural na pares na “nakatago/mabubunyag” at “lihim/malalaman at malalantad.”
