  to: At ang mga nasa ibabaw ng bato ay yaong, kapag nakarinig sila, ay masayang tumatanggap ng salita. Ngunit wala silang ugat; sumasampalataya sila nang ilang panahon, at sa panahon ng pagsubok[a] ay tumatalikod sila.
  rationale: Inayos ang unang sugnay upang malinaw na maipakita ang ὅταν kasama ng aorist subjunctive (“kapag nakarinig sila”) at ang kasunod na pagtanggap nang may kagalakan. Pinalitan ang hindi gaanong natural na “tumatanggap sa salita” ng “tumatanggap ng salita.” Inihanay ang talababa sa saklaw ng πειρασμός at sa English POB audit trail, nang hindi dinaragdagan ang kahulugang “matinding.”
