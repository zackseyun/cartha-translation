id: LUK.8.13
reference: Luke 8:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπὶ τῆς πέτρας οἳ ὅταν ἀκούσωσιν μετὰ χαρᾶς δέχονται τὸν λόγον, καὶ οὗτοι ῥίζαν οὐκ ἔχουσιν, οἳ πρὸς καιρὸν πιστεύουσιν καὶ ἐν καιρῷ πειρασμοῦ ἀφίστανται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/013.yaml
  text: And the ones on the rock are those who[a], when they hear, receive the word with joy. But these have no root; they believe for a time, and in a time of testing they fall away.
translation:
  language: tl
  text: At ang mga nasa ibabaw ng bato ay yaong, kapag nakarinig sila, ay masayang tumatanggap ng salita. Ngunit wala silang ugat; sumasampalataya sila nang ilang panahon, at sa panahon ng pagsubok[a] ay tumatalikod sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa panahon ng tukso” o “kapag dumarating ang pagsubok.” Ang salitang Griyego ay maaaring tumukoy sa pagsubok, tukso, o pagsubok na may kaugnayan sa tukso, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῆς πέτρας
  choice: nasa ibabaw ng bato
  rationale: Pinananatili ang kongkretong larawan ng isahang πέτρα at ang ugnay nito sa talinghaga, nang hindi ito pinalalawak bilang “mabatong lupa.”
- source_word: ἀκούσωσιν
  choice: nakikinig
  rationale: Likas na Filipino para sa pangkalahatang pangyayaring ipinahihiwatig ng ὅταν kasama ng aorist subjunctive; hindi nito ipinapalagay ang matagal o masunuring pakikinig.
- source_word: μετὰ χαρᾶς δέχονται τὸν λόγον
  choice: masayang tumatanggap sa salita
  rationale: Natural na inilalahad ang kagalakan at pagtanggap habang pinananatili ang biblikal na katawagang “salita” para sa ipinahahayag na mensahe.
- source_word: ῥίζαν οὐκ ἔχουσιν
  choice: wala silang ugat
  rationale: Tuwirang pinananatili ang isahang “ugat” at ang maikli ngunit malinaw na metapora.
- source_word: πρὸς καιρὸν πιστεύουσιν
  choice: sumasampalataya sila nang ilang panahon
  rationale: Ang “sumasampalataya” ang natural at tuwirang pandiwang Filipino para sa πιστεύουσιν; ang “nang ilang panahon” ay malinaw na nagpapahayag ng limitadong tagal nang hindi dinaragdagan ang teolohikal na kahulugan.
- source_word: ἐν καιρῷ πειρασμοῦ
  choice: sa panahon ng pagsubok
  rationale: Sinasaklaw ng “pagsubok” ang malawak na diwa ng πειρασμός sa konteksto; inilalagay sa talababa ang iba pang lehitimong posibilidad.
- source_word: ἀφίστανται
  choice: tumatalikod sila
  rationale: Malinaw at kasalukuyang Filipino para sa paglayo o pagtalikod mula sa naunang pananampalataya, nang hindi gumagamit ng teknikal at denominasyonal na termino.
theological_decisions:
- issue: Kung ang πιστεύουσιν ay tumutukoy sa tunay na nagliligtas na pananampalataya o sa mababaw lamang na paniniwala
  choice: sumasampalataya sila
  alternative: tila sumasampalataya sila; mababaw ang kanilang pananampalataya; tunay silang sumasampalataya ngunit kalaunan ay tumatalikod
  rationale: Sinasabi ng teksto na sumasampalataya sila nang ilang panahon at pagkatapos ay tumatalikod, ngunit hindi nito tahasang nilulutas ang mga pagtatalong teolohikal tungkol sa uri ng pananampalataya o pananatili. Pinananatili ng salin ang tensiyong iyon.
- issue: Saklaw ng kahulugan ng πειρασμός
  choice: pagsubok
  alternative: tukso; matinding pagsubok
  rationale: Maaaring tumukoy ang salitang Griyego sa pagsubok, paghihirap, o tukso. Pinili ang mas malawak na “pagsubok” sa pangunahing teksto at pinanatili sa talababa ang ibang posibleng diwa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang larawang “bato,” “ugat,” at “salita,” gayundin ang teolohikal na tensiyon sa pansamantalang pananampalataya at pagtalikod. Ang marker na [a] ay nasa pangunahing teksto.
