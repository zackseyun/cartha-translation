review_pass:
  verdict: revise
  source_fidelity: 'Kailangang gawing hayag ang kondisyunal na χρονική parirala na ὅταν ἀκούσωσιν (“kapag nakarinig sila”). Ang draft na “nakikinig at masayang tumatanggap” ay maaaring magmukhang magkasabay na patuloy na kilos at hindi lubos na naipapakita ang ayos ng Griyego: pagkatapos/kapag nakarinig, tinatanggap nila nang may kagalakan. Ang iba pang mahahalagang elemento—bato, ugat, pansamantalang pananampalataya, at pagtalikod sa panahon ng πειρασμός—ay naipapahayag nang tapat.'
  naturalness: Mas natural at malinaw sa modernong Filipino ang “kapag nakarinig sila, ay masayang tinatanggap nila ang salita” kaysa “mga nakikinig at masayang tumatanggap sa salita.” Ang “tumatanggap ng salita” ang karaniwang katambal na gamit sa Filipino para sa pagtanggap ng mensahe.
  terminology: Ang “salita,” “ugat,” “sumasampalataya,” at “tumatalikod” ay angkop at hindi nagpapataw ng paliwanag na denominasyonal. Ang “pagsubok” ay mabuting pangunahing salin para sa πειρασμός; ang talababa ay dapat magbigay ng “tukso” at “kapag dumarating ang pagsubok” bilang mga alternatibong paglalapat nang hindi nagdaragdag ng “matinding.”
  issues:
  - severity: medium
    issue: Hindi tahasang naisasalin ang ὅταν ἀκούσωσιν bilang isang kondisyunal/panahong sugnay.
    rationale: Ang “nakikinig at ... tumatanggap” ay hindi gaanong malinaw na katumbas ng “kapag nakarinig sila, tinatanggap nila,” at bahagyang binabago ang aspekto at ugnayan ng mga kilos.
  - severity: low
    issue: Ang “tumatanggap sa salita” ay hindi gaanong likas kaysa “tumatanggap ng salita.”
    rationale: Bagaman nauunawaan, ang “ng salita” ang mas karaniwan at tuwirang pagmamarka ng tinatanggap na mensahe.
  - severity: low
    issue: Ang talababa ay nagdaragdag ng “matinding” at “paghihirap,” na hindi kailangang ipasok bilang tiyak na mga alternatibo.
    rationale: Saklaw ng πειρασμός ang pagsubok, pagsubok na maaaring umakit sa pagkakasala, at tukso; mas mainam ang mga alternatibong mas malapit sa audit trail at hindi nagpapahiwatig ng tindi.
  revised_text: At ang mga nasa ibabaw ng bato ay yaong, kapag nakarinig sila, ay masayang tumatanggap ng salita. Ngunit wala silang ugat; sumasampalataya sila nang ilang panahon, at sa panahon ng pagsubok[a] ay tumatalikod sila.
  revised_footnotes:
