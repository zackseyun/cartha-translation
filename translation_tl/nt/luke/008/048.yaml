  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/048.yaml
  text: But he said to her[a], “Daughter, your faith has saved you; go in peace.”
translation:
  language: tl
  text: Ngunit sinabi niya sa babae, “Anak, iniligtas ka ng iyong pananampalataya[a]. Humayo kang payapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Pinagaling ka” o “ginawang magaling.” Ang pandiwang Griyego ay maaaring tumukoy kapuwa sa pagpapagaling at sa pagliligtas.'
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: Anak
  rationale: Likas at magiliw na pantawag ito sa Filipino. Bagaman literal na tumutukoy sa anak na babae, malinaw na babae ang kinakausap sa konteksto, kaya hindi kailangang gamitin ang mas mabigat na “Anak na babae.”
- source_word: πίστις
  choice: pananampalataya
  rationale: Pinananatili nito ang mahalagang teolohikal na termino, habang sa konteksto ay tumutukoy sa mapagtiwalang pananalig ng babae kay Jesus.
- source_word: σέσωκέν
  choice: iniligtas
  rationale: Pinananatili ang malawak na saklaw ng σῴζω, na maaaring tumukoy kapuwa sa pagliligtas at sa pagpapagaling. Ipinaliliwanag sa talababa ang malinaw na pisikal na diwa sa konteksto.
- source_word: πορεύου
  choice: humayo
  rationale: Isang natural at marangal na pautos sa kasalukuyang Filipino, na angkop sa basbas na kasunod.
- source_word: εἰς εἰρήνην
  choice: kang payapa
  rationale: Ang “Humayo kang payapa” ay natural na idyomang Filipino para sa pag-alis na may kapayapaan o nasa kalagayan ng kapayapaan.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang banayad na pagtutol o paglipat mula sa takot at pagtatapat ng babae tungo sa mapanatag na tugon ni Jesus.
- source_word: αὐτῇ
  choice: sa babae
  rationale: Ginagawang malinaw sa natural na Filipino ang pambabaeng tinutukoy ng panghalip nang hindi nagdaragdag ng bagong impormasyon.
theological_decisions:
- issue: Saklaw ng σῴζω sa konteksto ng pagpapagaling
  choice: “iniligtas ka” sa pangunahing teksto
  alternative: “pinagaling ka” o “nagpagaling sa iyo”
  rationale: Tiyak na kabilang sa tagpo ang pisikal na paggaling, ngunit mas malawak ang maaaring kahulugan ng pandiwang Griyego. Pinananatili ng “iniligtas” ang posibleng mas malalim na pahiwatig nang hindi itinatanggi ang paggaling, na nililinaw sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Anak” bilang magiliw na pantawag at ang “Humayo kang payapa” bilang maikli at natural na pagpapahayag ng basbas.
