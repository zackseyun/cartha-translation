  text: Συνιόντος δὲ ὄχλου πολλοῦ καὶ τῶν κατὰ πόλιν ἐπιπορευομένων πρὸς αὐτὸν εἶπεν διὰ παραβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/004.yaml
  text: 'And when a large crowd was gathering[a], and people from town after town were coming to him, he spoke by a parable:'
translation:
  language: tl
  text: Habang nagtitipon ang napakaraming tao at lumalapit sa kanya ang mga tao mula sa bawat bayan, nagsalita siya sa isang talinghaga:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagsalita siya sa pamamagitan ng isang talinghaga.” Maaaring tumukoy ang pariralang Griego na διὰ παραβολῆς sa ginamit na paraan o sa anyo ng kanyang pagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιόντος
  choice: nag­тitipon
  rationale: Ang kasalukuyang aspekto ng “nagtitipon” ay nagpapakita ng patuloy na pagdagsa at pagtitipon ng mga tao bago nagsalita si Jesus.
- source_word: δὲ
  choice: Nang
  rationale: Sa halip na isalin nang hiwalay, isinama ang banayad na pagpapatuloy ng salaysay sa likas na pangungusap na temporal sa Tagalog.
- source_word: ὄχλου πολλοῦ
  choice: ang napakaraming tao
  rationale: Likas itong katumbas ng isang malaking pulutong at malinaw sa karaniwang mambabasa.
- source_word: τῶν κατὰ πόλιν ἐπιπορευομένων
  choice: dumarating ... ang mga tao mula sa bayan-bayan
  rationale: Pinananatili ng “bayan-bayan” ang distributibong diwa ng κατὰ πόλιν—mga taong nagmumula sa sunod-sunod o iba’t ibang bayan—nang hindi nagiging mabigat ang pangungusap.
- source_word: πρὸς αὐτόν
  choice: sa kanya
  rationale: Ito ang natural na Tagalog para sa paglapit o pagpunta kay Jesus sa kontekstong ito.
- source_word: εἶπεν
  choice: nagsalita siya
  rationale: Ang “nagsalita” ay angkop sa kasunod na pariralang nagsasaad kung paano o sa anong paraan siya nangusap.
- source_word: διὰ παραβολῆς
  choice: sa pamamagitan ng isang talinghaga
  rationale: Tuwirang ipinapahayag nito ang posibleng diwa ng paraan o kasangkapan ng διά na may genitive, habang inilalagay sa talababa ang alternatibong pagbasa bilang paraan ng pagsasalita.
