  yaml_path: translation/nt/luke/008/007.yaml
  text: And other seed fell among the thorns[b][a], and the thorns grew up with it and choked it.
translation:
  language: tl
  text: May iba pang binhing nahulog sa gitna ng mga halamang matinik, at tumubong kasabay ng binhi ang mga halamang matinik at sinakal nila ang binhi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: iba pang binhi
  rationale: Ang pang-uring walang kasamang pangngalan ay tumutukoy sa binhi ayon sa konteksto ng talinghaga; idinagdag ang “binhi” upang maging malinaw at natural sa Tagalog.
- source_word: ἔπεσεν
  choice: nahulog
  rationale: Tuwirang inilalarawan ang simpleng pangyayaring pagbagsak ng binhi.
- source_word: ἐν μέσῳ τῶν ἀκανθῶν
  choice: sa gitna ng mga halamang matinik
  rationale: Pinananatili ang hayag na diwang pansaklaw ng ἐν μέσῳ at nililinaw na mga halamang may tinik ang tinutukoy, hindi lamang mga hiwalay na tinik.
- source_word: ἀκανθῶν / αἱ ἄκανθαι
  choice: mga halamang matinik / mga iyon
  rationale: Ang ἄκανθα ay tumutukoy sa mga halamang may tinik; gumamit ng panghalip sa ikalawang banggit upang maiwasan ang mabigat na pag-uulit habang malinaw pa rin ang tinutukoy.
- source_word: συμφυεῖσαι
  choice: kasabay nitong tumubo
  rationale: Ipinahahayag ang magkasabay at magkatabing paglaki ng mga halamang matinik at ng binhi.
- source_word: ἀπέπνιξαν
  choice: sinakal
  rationale: Pinananatili ang masiglang metapora ng pagpigil sa paglaki o paghinga na nasa pandiwang Griyego.
- source_word: αὐτό
  choice: ito
  rationale: Tumutukoy ang panghalip sa binhing naunang binanggit.
