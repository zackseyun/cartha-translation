- from: May iba pang binhing nahulog sa gitna ng mga halamang matinik, at kasabay nitong tumubo ang mga iyon at sinakal ito.
  to: May iba pang binhing nahulog sa gitna ng mga halamang matinik, at tumubong kasabay ng binhi ang mga halamang matinik at sinakal nila ang binhi.
  rationale: Inayos ang pagkakaugnay ng mga panghalip upang maging malinaw na ang mga halamang matinik ang tumubo kasabay ng binhi at sila rin ang sumakal dito. Pinanatili ang lahat ng pangunahing elemento ng Griyego at ang marangal ngunit makabagong rehistro.
