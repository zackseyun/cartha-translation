id: LUK.8.28
reference: Luke 8:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἰδὼν δὲ τὸν ⸀Ἰησοῦν ἀνακράξας προσέπεσεν αὐτῷ καὶ φωνῇ μεγάλῃ εἶπεν· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; δέομαί σου, μή με βασανίσῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/028.yaml
  text: But when he saw Jesus[a], he cried out, fell down before him, and said with a loud voice, “What do you have to do with me, Jesus, Son of the Most High God? I beg you, do not torment me.”
translation:
  language: tl
  text: Nang makita niya si Jesus, sumigaw siya, nagpatirapa sa harap niya, at nagsabi nang malakas, “Ano ang kinalaman mo sa akin[a], Jesus, Anak ng Kataas-taasang Diyos? Nakikiusap ako sa iyo, huwag mo akong pahirapan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “Ano ang mayroon sa akin at sa iyo?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Nang makita niya
  rationale: Ang aorist participle ay naglalahad ng pangyayaring nauna sa mga pangunahing kilos. Likas sa modernong Tagalog ang “Nang makita niya” at malinaw ang ugnayang temporal.
- source_word: ἀνακράξας
  choice: sumigaw siya
  rationale: Tumutukoy ito sa malakas at biglaang pagsigaw. Pinanatili itong hiwalay sa kasunod na φωνῇ μεγάλῃ upang hindi pagsamahin ang dalawang magkaibang paglalarawan ng Griyego.
- source_word: προσέπεσεν αὐτῷ
  choice: nagpatirapa sa harap niya
  rationale: Ipinahihiwatig ng προσπίπτω ang pagbagsak o pagpapatirapa sa harap ng isang tao. Hindi idinagdag ang mas tiyak na “sa paanan niya,” na wala sa mismong parirala.
- source_word: φωνῇ μεγάλῃ
  choice: nagsabi nang malakas
  rationale: Natural itong pagpapahayag sa Tagalog ng paraan ng pagsasalita, habang pinananatili ang diin sa lakas ng tinig.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Ano ang kinalaman mo sa akin
  rationale: Isa itong idyomang may impluwensiyang Semitiko na nagpapahayag ng pagtutol o paglayo. Likas at malinaw sa modernong Tagalog ang salin, samantalang inilalagay sa talababa ang mas literal na anyo.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: Anak ng Kataas-taasang Diyos
  rationale: Pinananatili nito ang buong titulo at ang pagkilala sa pagkakakilanlan ni Jesus nang walang idinaragdag na paliwanag na teolohikal.
- source_word: δέομαί σου
  choice: Nakikiusap ako sa iyo
  rationale: Ipinapahayag ng pandiwa ang taimtim at apurahang pagsusumamo. Dignified ngunit karaniwan sa modernong Tagalog ang “nakikiusap.”
- source_word: μή με βασανίσῃς
  choice: huwag mo akong pahirapan
  rationale: Maaaring tumukoy ang βασανίζω sa matinding pagpapahirap o tormento. Malinaw at natural ang “pahirapan” at hindi nito nililimitahan ang kahulugan sa pisikal na tortyur lamang.
theological_decisions:
- issue: Paglalarawan sa pagkilala ng demonyo sa pagkakakilanlan ni Jesus
  choice: Jesus, Anak ng Kataas-taasang Diyos
  alternative: Jesus, Anak ng Diyos na Kataas-taasan
  rationale: Pinananatili ng napiling anyo ang buong kristolohikal na bigat ng tuwirang tawag sa teksto, nang hindi ito pinahihina o pinalalawak sa isang mas huling pormulang doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang pagkakasunod ng pagsigaw, pagpapatirapa, at malakas na pagsasalita, pati ang matinding tono ng pagsusumamo. Ang bahagyang di-likas na literal na anyo ng idyoma ay inilagay lamang sa talababa.
