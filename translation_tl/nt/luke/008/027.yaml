base_translation:
  language: en
  yaml_path: translation/nt/luke/008/027.yaml
  text: And when he came out onto the land[a], a certain man from the city met him, who had demons. And for a considerable time he had not put on clothing[b], and he did not stay in a house but among the tombs.
translation:
  language: tl
  text: Nang makarating siya sa lupain[a], sinalubong siya ng isang lalaki mula sa lungsod. May mga demonyo ang lalaking ito.[b] Matagal na siyang hindi nagsusuot ng damit, at hindi siya nakatira sa isang bahay kundi sa mga libingan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nang bumaba siya sa pampang.”
    reason: lexical_alternative
  - marker: b
    text: 'O, sa mas idyomatikong pananalita, “na sinasapian ng mga demonyo.” Literal sa Griyego: “na may mga demonyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν
  choice: Nang makarating siya sa lupa
  rationale: Ipinahihiwatig ng pandiwaring nasa datibo ang panahon ng kasunod na pangyayari. Likas sa Tagalog ang “makarating sa lupa” at hindi nito labis na tinutukoy ang lugar bilang pampang, bagaman malinaw sa konteksto ang pagbaba mula sa bangka.
- source_word: ὑπήντησεν
  choice: sinalubong siya
  rationale: Ipinapahayag nito ang tuwirang pagharap o pakikipagtagpo ng lalaki kay Jesus; mas natural sa salaysay ang “sinalubong” kaysa sa mas patag na “nakipagkita.”
- source_word: ἀνήρ τις
  choice: isang lalaki
  rationale: Ang “isang lalaki” ay likas na Tagalog para sa di-tiyak ngunit partikular na taong ipinakikilala sa salaysay. Hindi kailangan ang artipisyal na “isang tiyak na lalaki.”
- source_word: ἐκ τῆς πόλεως
  choice: mula sa lungsod
  rationale: Pinananatili nito ang pinagmulan o kaugnayan ng lalaki sa lungsod nang hindi ipinapalagay na kalalabas lamang niya roon.
- source_word: ἔχων δαιμόνια
  choice: na may mga demonyo
  rationale: Malapit ito sa literal na “may/hawak na mga demonyo” ng Griyego at hindi agad ipinapasok sa pangunahing teksto ang mas interpretatibong idyomang “sinasapian.”
- source_word: χρόνῳ ἱκανῷ
  choice: Sa loob ng mahabang panahon
  rationale: Malinaw at likas nitong ipinapahayag ang malaking haba ng panahong tinutukoy.
- source_word: οὐκ ἐνεδύσατο ἱμάτιον
  choice: hindi ito nagsuot ng damit
  rationale: Pinananatili ng “nagsuot” ang kilos ng ἐνδύω at ng “damit” ang pangkalahatang diwa ng ἱμάτιον. Ginamit ang “ito” upang malinaw na ang lalaki, hindi si Jesus, ang tinutukoy.
- source_word: ἐν οἰκίᾳ οὐκ ἔμενεν
  choice: hindi ito nanunuluyan sa bahay
  rationale: Ang “nanunuluyan” ay nagpapahayag ng paulit-ulit o nakagawiang pananatili, na angkop sa aspektong imperpekto ng ἔμενεν, nang hindi ipinapalagay ang permanenteng tirahan.
- source_word: ἀλλ’ ἐν τοῖς μνήμασιν
  choice: kundi sa mga libingan
  rationale: Ang “mga libingan” ay tuwirang katumbas ng mga pook na pinaglalagyan ng mga patay at sapat na malawak upang saklawin ang mga puntod o yungib na libingan.
theological_decisions:
- issue: Pagpapakahulugan sa δαιμόνια sa konteksto ng paghihirap na dulot ng mga espiritu
  choice: mga demonyo
  alternative: mga maruruming espiritu
  rationale: δαιμόνια ang mismong salita rito, hindi πνεύματα ἀκάθαρτα. Kaya pinananatili ang natatanging bokabularyo ng talata.
- issue: Kung gagawing idyomatikong “sinasapian ng mga demonyo” ang ἔχων δαιμόνια
  choice: na may mga demonyo
  alternative: sinasapian ng mga demonyo
  rationale: Literal na sinasabi ng Griyego na ang lalaki ay “may mga demonyo.” Pinananatili sa pangunahing teksto ang mas hindi interpretatibong pahayag, habang inilalagay sa talababa ang karaniwang idyoma.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal ang himig. Ginamit ang “ito” para sa lalaki matapos ang unang pangungusap upang maiwasan ang kalituhan sa dalawang panlalaking tauhan. Iniwasan ang labis na teknikal o denominasyonal na pananalita.
