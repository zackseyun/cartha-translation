revisions:
- from: Nang makarating siya sa lupa[a], sinalubong siya ng isang lalaking mula sa lungsod na may mga demonyo.[b] Sa loob ng mahabang panahon ay hindi ito nagsuot ng damit, at hindi ito nanunuluyan sa bahay kundi sa mga libingan.
  to: Nang makarating siya sa lupain[a], sinalubong siya ng isang lalaki mula sa lungsod. May mga demonyo ang lalaking ito.[b] Matagal na siyang hindi nagsusuot ng damit, at hindi siya nakatira sa isang bahay kundi sa mga libingan.
  rationale: Pinalitan ang “lupa” ng “lupain” upang masaklaw ang γῆ bilang katihan/lupain. Inayos ang pangungusap upang malinaw na ang lalaki, hindi ang lungsod, ang may mga demonyo. Pinalitan ang di-personal na “ito” ng mga likas na pantukoy sa tao at ang “nanunuluyan” ng “nakatira.” Hindi binago ang kahulugan o ang maingat na literal na pag-render ng ἔχων δαιμόνια.
