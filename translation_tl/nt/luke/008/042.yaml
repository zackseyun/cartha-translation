  source_fidelity: Tumpak ang ugnayang sanhi ng «sapagkat,» ang pagiging kaisa-isang anak na babae, ang tantiya sa edad, at ang imperpektibong «naghihingalo.» Gayunman, ang «nagsisiksikan sa paligid niya» ay pangunahing naglalarawan ng pagsisiksikan ng mga tao sa isa't isa sa paligid ni Jesus; hindi nito gaanong tuwirang naihahayag na si Jesus ang sinisiksik ng mga pulutong (συνέπνιγον αὐτόν).
  naturalness: Makabago, malinaw, at angkop ang rehistro. Mas tuwiran at likas sa Filipino ang «sinisiksik siya ng mga tao» upang maipakita ang pisikal na pagkakaipit ni Jesus.
