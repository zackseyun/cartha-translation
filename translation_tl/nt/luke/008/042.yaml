base_translation:
  language: en
  yaml_path: translation/nt/luke/008/042.yaml
  text: because he had an only daughter[a], about twelve years old, and she was dying. And as he went[c][b], the crowds were pressing in on him.
translation:
  language: tl
  text: sapagkat mayroon siyang kaisa-isang anak na babae[a], na mga labindalawang taong gulang, at naghihingalo ito. Habang papunta si Jesus, sinisiksik siya ng mga tao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nag-iisa niyang anak na babae.”
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang Griego ay maaaring magpahiwatig na napakahigpit ng pagsisiksikan ng mga tao, na para bang halos maipit siya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na iniuugnay nito ang kalagayan ng anak sa agarang pakiusap ni Jairo sa naunang talata.
- source_word: θυγάτηρ μονογενὴς
  choice: kaisa-isang anak na babae
  rationale: Sa kontekstong pampamilya, ang μονογενής ay tumutukoy sa nag-iisa o natatanging anak na babae, hindi sa paraan ng pagkapanganak.
- source_word: ὡς ἐτῶν δώδεκα
  choice: mga labindalawang taong gulang
  rationale: Ipinahihiwatig ng ὡς na tantiya lamang ang edad; natural itong ipinapahayag sa Filipino sa pamamagitan ng “mga.”
- source_word: ἀπέθνῃσκεν
  choice: naghihingalo
  rationale: Ipinakikita ng aspektong imperpektibo ang nagpapatuloy na paglapit sa kamatayan, hindi na siya ay patay na.
- source_word: Ἐν δὲ τῷ ὑπάγειν αὐτὸν
  choice: Habang papunta si Jesus
  rationale: Ipinapahayag ng parirala ang kasabay na pagkilos. Ginawang tahasan ang tinutukoy ng panghalip upang maging malinaw at natural sa Filipino.
- source_word: οἱ ὄχλοι
  choice: ang mga tao
  rationale: Bagaman maramihan ang anyong Griego, mas natural sa Filipino ang kolektibong “mga tao” kaysa “mga pulutong” sa tagpong ito.
- source_word: συνέπνιγον αὐτόν
  choice: nagsisiksikan sa paligid niya
  rationale: Inihahatid nito ang pisikal at mahigpit na pagdagsa ng mga tao nang hindi sapilitang ginagamit ang literal na larawang “sinasakal.”
