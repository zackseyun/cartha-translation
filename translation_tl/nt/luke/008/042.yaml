translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang tantiya sa edad at ang nagpapatuloy na kalagayan ng paghingalo; iniwasan ang salitang “bugtong” dahil maaari itong maging malabo o makaluma sa karaniwang mambabasa.
