  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὸ δὲ εἰς τὰς ἀκάνθας πεσόν, οὗτοί εἰσιν οἱ ἀκούσαντες, καὶ ὑπὸ μεριμνῶν καὶ πλούτου καὶ ἡδονῶν τοῦ βίου πορευόμενοι συμπνίγονται καὶ οὐ τελεσφοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/014.yaml
  text: And the one that fell among the thorns—these are those who have heard[a], but as they go on their way they are choked by the cares and riches and pleasures of life[b], and they do not bear fruit to maturity.
translation:
  language: tl
  text: Ang nahulog naman sa gitna ng mga tinik ay ang mga nakarinig, ngunit habang nagpapatuloy sila sa kanilang lakad, nasasakal sila ng mga alalahanin, kayamanan, at mga kasiyahan sa buhay, at hindi sila nagkakaroon ng bungang ganap na hinog.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “hindi sila namumunga hanggang sa pagkahinog” o “hindi nila naihahatid sa kaganapan ang bunga.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... εἰς τὰς ἀκάνθας πεσόν
  choice: ang nahulog ... sa gitna ng mga tinik
  rationale: Pinananatili ang anyong pang-isahan at ang larawan ng pagkahulog sa mga tinik nang hindi tahasang idinaragdag ang salitang “binhi,” na nauunawaan na mula sa talinghaga.
- source_word: οὗτοί εἰσιν οἱ ἀκούσαντες
  choice: ay ang mga nakarinig
  rationale: Natural sa Tagalog ang ganitong pagtukoy sa mga taong inilalarawan ng nahulog na binhi; ipinahahayag ng “nakarinig” ang natapos na kilos ng aorist participle.
- source_word: πορευόμενοι
  choice: sa pagpapatuloy nila
  rationale: Ipinahihiwatig nito ang nagpapatuloy na proseso nang hindi nililimitahan ang kahulugan sa literal na paglalakad o pinalalawak nang tahasan sa buong buhay.
- source_word: ὑπὸ μεριμνῶν
  choice: ng mga alalahanin
  rationale: Saklaw ng “mga alalahanin” ang mga bagay na pinagkakaabalahan at ikinababahala; karaniwan at malinaw ito sa modernong Tagalog.
- source_word: πλούτου
  choice: kayamanan
  rationale: Tuwirang ipinapahayag ang materyal na yaman bilang isa sa mga puwersang sumasakal sa paglago.
- source_word: ἡδονῶν τοῦ βίου
  choice: mga kasiyahan sa buhay
  rationale: Pinananatili ang malawak na diwa ng mga kasiyahan o ligaya sa pang-araw-araw na buhay nang hindi agad ipinapalagay na likas na imoral ang bawat isa.
- source_word: συμπνίγονται
  choice: nasasakal sila
  rationale: Pinananatili ang pasibong anyo at matingkad na larawang panghalaman ng paghadlang ng mga tinik sa paglago.
- source_word: οὐ τελεσφοροῦσιν
  choice: hindi humihinog ang kanilang bunga
  rationale: Likas na Tagalog itong pagpapahayag sa ideya na ang bunga ay hindi umaabot sa kaganapan o pagkahinog, habang pinananatili ang larawang panghalaman.
theological_decisions:
- issue: Kalagayan ng mga nakarinig na inilalarawan bilang nasasakal at hindi nagkakaroon ng hinog na bunga
  choice: Inilalarawan lamang ang pagkasakal at hindi paghinog ng bunga nang walang tahasang pasiya tungkol sa kanilang espirituwal na kalagayan.
  alternative: Tukuyin silang hindi tunay na sumampalataya, tunay na mananampalatayang nawalan ng bunga, o mga tumalikod matapos magsimula.
  rationale: Hindi tahasang nilulutas ng talata ang mga usapin tungkol sa tunay na pagbabalik-loob, pagtitiyaga, pagtalikod, o gantimpala. Dapat manatili ang teolohikal na tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga kasiyahan” sa halip na mas moralistikong “mga kalayawan,” at pinanatili ang larawang panghalaman sa “nasasakal” at “humihinog ang kanilang bunga.”
