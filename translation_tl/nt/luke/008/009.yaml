base_translation:
  language: en
  yaml_path: translation/nt/luke/008/009.yaml
  text: Then his disciples asked him what this parable meant[a].
translation:
  language: tl
  text: Tinanong siya ng kanyang mga alagad kung ano ang kahulugan ng talinghagang ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “kung ano ang talinghagang ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπηρώτων
  choice: Tinanong
  rationale: Likas na salin sa makabagong Tagalog para sa imperfect na pandiwang tumutukoy sa pagtatanong sa nakaraang tagpo; hindi kailangang gawing tahasang paulit-ulit ang kilos sa kontekstong ito.
- source_word: δὲ
  choice: Hindi isinalin nang hiwalay
  rationale: Mahinang pang-ugnay ito sa Griyego. Sapat na ipinahihiwatig ng pagkakasunod ng salaysay sa Tagalog ang pagpapatuloy, at magiging mas natural ang pangungusap nang walang tahasang “pagkatapos” o “ngayon.”
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: kanyang mga alagad
  rationale: Karaniwan, malinaw, at matatag na salin ng relasyong ipinahahayag ng μαθηταί at ng panghalip na αὐτοῦ.
- source_word: τίς αὕτη εἴη ἡ παραβολή
  choice: kung ano ang kahulugan ng talinghagang ito
  rationale: Ipinahahayag nito sa natural na Tagalog na humihingi ang mga alagad ng pagpapakahulugan. Inilalagay sa talababa ang mas literal na anyo upang mapanatili ang pormal na pagkakaiba ng Griyego.
- source_word: παραβολή
  choice: talinghaga
  rationale: Ito ang nakaugaliang salitang Tagalog para sa παραβολή sa konteksto ng mga salaysay at aral ni Jesus.
- source_word: εἴη
  choice: kahulugan
  rationale: Ang optative sa di-tuwirang tanong pagkatapos ng pandiwang nasa nakaraan ay natural na naihahatid sa Tagalog bilang pagtatanong sa ibig sabihin ng talinghaga, sa halip na sa pagkakakilanlan nito.
