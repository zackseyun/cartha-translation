  source_fidelity: Tumpak sa kabuuan ang pagsasalin ng pangungusap. Gayunman, ang “tumutupad nito” ay maaaring magpahiwatig ng pagtupad o pagsunod sa isang utos; ang mas tuwirang “isinasagawa ito” ay masaklaw na katumbas ng ποιεῖν (“ginagawa/isinasabuhay ito”) nang hindi dinaragdagan ang kahulugan. Ang talababa ay dapat magbigay ng impormasyong leksikal nang hindi ipinagpapalagay ang lawak ng aplikasyon na hindi tahasang sinasabi ng talata.
  naturalness: Malinaw, marangal, at likas ang “Ngunit sumagot siya sa kanila” at ang ayos ng pangungusap. Natural din sa modernong Filipino ang “nakikinig sa salita ng Diyos at isinasagawa ito.”
  terminology: Ang “ina,” “mga kapatid,” at “salita ng Diyos” ay angkop at pare-pareho sa rehistro. Dahil karaniwang walang markang pangkasarian ang “mga kapatid” sa Filipino, dapat ipaliwanag ng talababa ang panlalaking pangmaramihang anyo ng Griyego nang hindi gumagawa ng interpretatibong pahayag tungkol sa saklaw ng sinabi.
