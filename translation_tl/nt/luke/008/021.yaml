  - severity: medium
    issue: Interpretatibo ang kasalukuyang talababa tungkol sa posibleng saklaw ng aplikasyon.
    rationale: Hindi tahasang sinasabi ng talata kung paano eksaktong lumalawak ang aplikasyon ayon sa kasarian. Mas mainam na ilahad lamang ang anyong Griyego at ang posibleng salin, nang hindi naglalagay ng konklusyong interpretatibo.
