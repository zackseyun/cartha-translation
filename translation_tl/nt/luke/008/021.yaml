  text: But he answered and said to them[b][a], “My mother and my brothers are those who hear the word of God and do it.”
translation:
  language: tl
  text: Ngunit sumagot siya sa kanila, “Ang aking ina at mga kapatid[a] ay ang mga nakikinig sa salita ng Diyos at isinasagawa ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “mga kapatid kong lalaki.” Ang salitang Griyego ay nasa anyong panlalaking pangmaramihan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: sumagot
  rationale: Likas sa makabagong Tagalog ang “sumagot” at sapat nitong naihahatid ang pormulang Griyego na literal na “sumagot at nagsabi,” nang hindi nagiging paulit-ulit.
- source_word: πρὸς αὐτούς
  choice: sa kanila
  rationale: Karaniwang katumbas ito para sa mga taong pinatutungkulan ng sagot.
- source_word: Μήτηρ μου καὶ ἀδελφοί μου
  choice: ang aking ina at mga kapatid
  rationale: Tuwirang isinasalin ang μήτηρ bilang “ina.” Ang “mga kapatid” ang natural na Tagalog para sa masculine plural na ἀδελφοί at maaari ring tumukoy sa magkakapatid nang hindi tinutukoy ang kasarian; nililinaw ng talababa ang anyong Griyego.
- source_word: οὗτοί εἰσιν οἱ
  choice: ay ang mga
  rationale: Pinagsasama nito sa natural na Tagalog ang demonstratibong pagkilala at ang kasunod na substantival na mga participle, katulad ng diwang “ay yaong mga.”
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: sa salita ng Diyos
  rationale: Pinananatili ng “salita ng Diyos” ang tradisyonal at teolohikal na bigat ng λόγος habang malinaw na tumutukoy sa mensahe o katuruang mula sa Diyos.
- source_word: ἀκούοντες
  choice: nakikinig
  rationale: Sa kontekstong ito, higit na ipinahihiwatig ng “nakikinig” kaysa “nakaririnig” ang pagtanggap at pagbibigay-pansin, habang hindi pa nito ipinapasok ang kahulugang pagsunod.
- source_word: ποιοῦντες
  choice: tumutupad nito
  rationale: Ipinahahayag nito ang paggawa o pagsasakatuparan sa salitang narinig. Mas natural ito sa Tagalog kaysa literal na “ginagawa ito,” ngunit hindi kasing tahasang interpretatibo ng “sinusunod.”
theological_decisions:
- issue: Saklaw ng muling paglalarawan ni Jesus sa kaniyang pamilya
  choice: Ipinakikilala ni Jesus bilang kaniyang ina at mga kapatid ang mga nakikinig sa salita ng Diyos at tumutupad nito.
  alternative: Itinatakwil ni Jesus ang kaniyang likas na pamilya, o mga lalaking alagad lamang ang tinutukoy niya.
  rationale: Pinalalawak ng pangungusap ang ugnayang pampamilya batay sa pagtugon sa salita ng Diyos, ngunit hindi nito tahasang itinatakwil ang kaniyang ina at mga kamag-anak. Hindi rin dapat ikulong sa mga lalaki lamang ang aplikasyon ng sinabi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “aking” at “salita ng Diyos” upang mapanatili ang dignidad ng pananalita, habang ang “nakikinig” at “tumutupad” ay natural sa karaniwang mambabasa.
