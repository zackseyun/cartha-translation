base_translation:
  language: en
  yaml_path: translation/nt/luke/008/054.yaml
  text: But he took her by the hand and called out[a], saying, “Child, arise.”
translation:
  language: tl
  text: Ngunit hinawakan niya ang kamay ng bata at tumawag nang malakas, “Bata[a], bumangon ka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Batang babae.” Ang salitang Griyego na παῖς ay maaaring mangahulugang “bata” o, sa kontekstong ito, “batang babae.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ
  choice: Ngunit … niya
  rationale: Ipinahihiwatig ng δέ ang pagliko ng salaysay matapos ang pagtawa ng mga tao sa naunang talata. Likas nang naipapahayag sa Filipino ang αὐτός sa panghalip na “niya” nang hindi labis na idinidiin ang “siya mismo.”
- source_word: κρατήσας τῆς χειρὸς αὐτῆς
  choice: hinawakan niya sa kamay ang bata
  rationale: Ipinapahayag ng κρατέω ang aktuwal na paghawak, at natural sa Filipino ang “hinawakan … sa kamay.” Ginamit ang “ang bata” upang maiwasan ang malabong sunod-sunod na panghalip.
- source_word: ἐφώνησεν λέγων
  choice: sinabi nang malakas
  rationale: Ang φωνέω ay nagpapahiwatig ng malinaw at malakas na pagtawag o pagsasalita. Pinagsama sa natural na Filipino ang participle na λέγων at ang pandiwang ἐφώνησεν nang hindi nawawala ang lakas ng tinig.
- source_word: Ἡ παῖς
  choice: Bata
  rationale: Maaaring tumukoy ang παῖς sa isang bata sa pangkalahatan o, ayon sa konteksto, sa isang batang babae. Pinananatili ng “Bata” ang lawak ng salita at ang payak na tuwirang pagtawag.
- source_word: ἔγειρε
  choice: bumangon ka
  rationale: Ang present imperative ay isang tuwirang utos na bumangon. Ang “bumangon ka” ay malinaw, kasalukuyan, at natural sa modernong Filipino.
theological_decisions:
- issue: Ang tawag ni Jesus sa anak na babae ni Jairo
  choice: Bata
  alternative: Batang babae; Iha
  rationale: Pinananatili ng “Bata” ang leksikal na lawak ng παῖς at hindi ipinapasok ang mas tiyak o mas malambing na katawagang wala mismo sa salitang Griyego. Nililinaw sa talababa na babae ang bata ayon sa konteksto.
- issue: Ang utos sa batang patay
  choice: bumangon ka
  alternative: magbangon ka; tumindig ka
  rationale: Isinasalin ito bilang payak at tuwirang utos, nang hindi ginagawang makaluma o dinaragdagan ng paliwanag tungkol sa himala.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Iniwasan ang makalumang “magbangon” at ang mas emosyonal na “sumigaw”; ang “sinabi nang malakas” ay natural na naghahatid sa puwersa ng ἐφώνησεν.
