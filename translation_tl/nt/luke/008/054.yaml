  naturalness: Mas natural at malinaw sa modernong Filipino ang “hinawakan niya ang kamay ng bata at tumawag nang malakas” kaysa “hinawakan niya sa kamay ang bata at sinabi nang malakas.” Ang utos na “bumangon ka” ay wasto at natural.
