base_translation:
  language: en
  yaml_path: translation/nt/luke/008/006.yaml
  text: And another fell on the rock[a], and after it sprang up, it withered because it had no moisture.
translation:
  language: tl
  text: At ang isa pa ay nahulog sa ibabaw ng bato[a]. Nang sumibol ito, natuyo ito dahil wala itong kahalumigmigan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa bato.” Singular ang salitang Griyego na “bato,” kaya pinananatili nito ang larawan ng binhing nahulog sa isang batong ibabaw, sa halip na ang mas malawak na pananalitang “mabatong lupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: ang isa pa
  rationale: Ang pang-uring neuter singular ay ginamit bilang pangngalan para sa susunod na binhing binabanggit sa sunod-sunod na halimbawa; natural sa Tagalog ang “ang isa pa.”
- source_word: κατέπεσεν
  choice: nahulog
  rationale: Tuwirang inilalarawan ng aorist na pandiwa ang pagbagsak ng binhi; sapat at natural ang “nahulog” nang hindi nagdaragdag ng diin.
- source_word: ἐπὶ τὴν πέτραν
  choice: sa ibabaw ng bato
  rationale: Pinananatili nito ang singular at kongkretong larawan ng πέτρα bilang “bato,” sa halip na palawakin ito bilang “mabatong lupa.”
- source_word: φυὲν
  choice: Pagsibol nito
  rationale: Ipinapakita ng pariralang ito ang temporal na pagkakasunod ng participle bago ang pangunahing pandiwa at natural itong tumutukoy sa pagtubo ng binhi.
- source_word: ἐξηράνθη
  choice: natuyo ito
  rationale: Sa konteksto ng halamang sumibol ngunit nawalan ng halumigmig, tumpak at madaling maunawaan ang “natuyo”; pinananatili rin nito ang anyong hindi tahasang nagsasaad ng gumagawa.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: dahil wala itong
  rationale: Malinaw na ipinahahayag nito ang sanhi na taglay ng διά kasunod ng articular infinitive.
- source_word: ἰκμάδα
  choice: halumigmig
  rationale: Tumutukoy ang salita sa moisture o dampness na kailangan sa paglago; ang “halumigmig” ay tumpak at hindi nagdaragdag ng mas tiyak ngunit di-tiyak na ideya gaya ng “katas.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa ibabaw ng bato” upang maging natural habang pinananatili ang singular at kongkretong larawan ng Griyego. Hinati sa dalawang pangungusap para sa malinaw na daloy nang hindi binabago ang ugnayan ng mga pangyayari.
