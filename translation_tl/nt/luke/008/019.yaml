id: LUK.8.19
reference: Luke 8:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Παρεγένετο δὲ πρὸς αὐτὸν ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ, καὶ οὐκ ἠδύναντο συντυχεῖν αὐτῷ διὰ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/019.yaml
  text: Then his mother and his brothers came to him[b][a], but they were not able to reach him because of the crowd.
translation:
  language: tl
  text: Pagkatapos, dumating sa kinaroroonan niya ang kanyang ina at mga kapatid na lalaki[b], ngunit hindi sila makalapit sa kanya[a] dahil sa dami ng tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “makipagkita sa kanya” o “makarating sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “mga kapatid na lalaki.” Binibigyang-kahulugan ito ng ilan nang mas malawak bilang “mga kamag-anak” o “mga kaanak,” ngunit “mga kapatid na lalaki” ang mismong ginamit sa teksto.
    reason: alternative_reading
lexical_decisions:
- source_word: Παρεγένετο δὲ πρὸς αὐτὸν
  choice: Pagkatapos, dumating sa kinaroroonan niya
  rationale: Ipinahihiwatig ng δέ ang pagpapatuloy ng salaysay, at ang παραγίνομαι πρός ay pagdating o paglapit sa kinaroroonan ng isang tao. Natural sa Filipino ang pariralang ito at hindi nito idinaragdag ang layuning “upang makita siya.”
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: ang kanyang ina at mga kapatid na lalaki
  rationale: Tuwirang isinasalin ang μήτηρ bilang “ina.” Ang ἀδελφοί ay panlalaking maramihan, kaya “mga kapatid na lalaki” ang malinaw at gender-accurate na salin.
- source_word: οὐκ ἠδύναντο συντυχεῖν αὐτῷ
  choice: hindi sila makalapit sa kanya
  rationale: Sa konteksto ng paghadlang ng maraming tao, ipinapahayag ng συντυγχάνω ang paglapit o pagkakaroon ng personal na pakikipagtagpo. Ang “makalapit” ay natural at hindi nagpapahiwatig ng pormal na pakikipagkita.
- source_word: διὰ τὸν ὄχλον
  choice: dahil sa dami ng tao
  rationale: Ang διά na may accusative ay nagsasaad ng dahilan. Sa Filipino, mas natural sa kontekstong ito ang “dahil sa dami ng tao” kaysa sa literal na “dahil sa karamihan.”
theological_decisions:
- issue: Eksaktong kaugnayan kay Jesus ng οἱ ἀδελφοὶ αὐτοῦ
  choice: mga kapatid na lalaki
  alternative: mga kamag-anak; mga kaanak
  rationale: Karaniwang kahulugan ng ἀδελφοί ang “mga kapatid na lalaki.” Hindi tinutukoy ng talata kung sila ay kapatid sa laman, kapatid sa ibang magulang, o mas malayong kaanak, kaya hindi nilulutas ng salin ang makasaysayang pagtatalong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa kinaroroonan niya” upang likas na maipahayag ang pagdating “sa kanya,” at ang “dami ng tao” upang maipakita ang praktikal na hadlang ng siksik na karamihan.
