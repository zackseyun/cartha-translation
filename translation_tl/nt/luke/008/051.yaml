base_translation:
  language: en
  yaml_path: translation/nt/luke/008/051.yaml
  text: When he came into the house[a], he did not allow anyone to enter with him except Peter and John and James, and the girl's father and mother.
translation:
  language: tl
  text: Pagdating niya sa bahay, hindi niya pinahintulutang may sinumang pumasok na kasama niya, maliban kina Pedro, Juan, at Santiago at sa ama at ina ng batang babae.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bata.” Maaaring tumukoy ang salitang Griyego sa isang bata sa pangkalahatan, ngunit malinaw sa konteksto na babae ang bata.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν δὲ εἰς τὴν οἰκίαν
  choice: Pagdating niya sa bahay
  rationale: Likas na salin ng aorist participle na may temporal na diwa; ipinahihiwatig ang pagdating bago ang sumunod na kilos nang hindi nagiging matigas ang pangungusap.
- source_word: οὐκ ἀφῆκεν εἰσελθεῖν
  choice: hindi niya pinahintulutang pumasok
  rationale: Ang ἀφίημι rito ay nangangahulugang magpahintulot, at ang infinitive na εἰσελθεῖν ang kilos na hindi niya pinayagan.
- source_word: τινα σὺν αὐτῷ
  choice: na kasama niya ang sinuman
  rationale: Sa negatibong pahayag, ang τινα ay may pangkalahatang diwang 'sinuman'; iniuugnay ang σὺν αὐτῷ sa pagpasok.
- source_word: εἰ μὴ
  choice: maliban kina ... at sa
  rationale: Pagkatapos ng negatibong sugnay, nagsasaad ito ng eksepsiyon, hindi ng kondisyon.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: Pedro, Juan, at Santiago
  rationale: Ginamit ang karaniwang anyo ng mga pangalang biblikal sa Tagalog at natural na bantas para sa talaan.
- source_word: τῆς παιδὸς
  choice: ng batang babae
  rationale: Maaaring pangkalahatang 'bata' ang παῖς, ngunit malinaw sa konteksto na anak na babae ni Jairo ang tinutukoy.
- source_word: τὸν πατέρα ... καὶ τὴν μητέρα
  choice: ang ama at ina
  rationale: Pinananatili ang hiwalay na pagbanggit sa dalawang magulang sa halip na paikliin bilang 'mga magulang.'
theological_decisions:
- issue: Lawak ng kahulugan ng παῖς
  choice: batang babae
  alternative: bata
  rationale: Hindi ito usaping doktrinal, ngunit kinikilala ng konteksto ang bata bilang anak na babae; pinananatili sa talababa ang mas malawak na posibleng kahulugan ng salitang Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay sa Filipino. Ginamit ang 'pinahintulutan' upang mapanatili ang bahagyang pormal na himig, habang nananatiling madaling maunawaan. Inilagay ang talababa sa mismong pariralang pinaglilinaw nito.
