  text: Καὶ κατέπλευσαν εἰς τὴν χώραν τῶν ⸀Γερασηνῶν, ἥτις ἐστὶν ἀντιπέρα τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/026.yaml
  text: And they sailed down to the region of the Gerasenes, which is opposite Galilee.
translation:
  language: tl
  text: At naglayag sila patungo sa rehiyon ng mga Geraseno[a], na nasa tapat ng Galilea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito at sa magkakatulad na salaysay sa ibang Ebanghelyo, “mga Gadareno” o “mga Gergeseno” ang mababasa.
    reason: textual_variant
lexical_decisions:
- source_word: κατέπλευσαν
  choice: naglayag sila patungo
  rationale: Ipinahahayag ng pandiwa ang paglalakbay sa tubig tungo sa isang lugar. Likas sa modernong Tagalog ang “naglayag … patungo,” at hindi nito ipinipilit ang di-tiyak na literal na direksiyong “pababa.”
- source_word: χώραν
  choice: rehiyon
  rationale: Tumutukoy ito sa isang distrito o malawak na pook, hindi sa isang makabagong bansang may pambansang hangganan.
- source_word: Γερασηνῶν
  choice: mga Geraseno
  rationale: Isinasalin ang katawagang etniko bilang pangalan ng mga taong kaugnay ng Gerasa, alinsunod sa pangunahing pagbasa ng SBLGNT.
- source_word: ἥτις
  choice: na
  rationale: Natural na ipinakikilala ng “na” ang sugnay na naglalarawan sa naunang binanggit na rehiyon nang hindi dinaragdagan ang bahagyang kwalitatibong puwersa ng panghalip.
- source_word: ἀντιπέρα
  choice: nasa ibayo ng
  rationale: Malinaw nitong ipinahahayag na ang rehiyon ay nasa kabilang panig o katapat ng Galilea; ang “nasa ibayo ng” ay natural sa konteksto ng pagtawid sa tubig.
- source_word: Γαλιλαίας
  choice: Galilea
  rationale: Ito ang nakaugaliang anyo ng pangalan ng lugar sa Tagalog.
theological_decisions:
- issue: Pagkakaiba-iba ng pangalan ng lugar sa mga manuskrito at magkakatulad na salaysay sa mga Ebanghelyo
  choice: mga Geraseno
  alternative: mga Gadareno o mga Gergeseno
  rationale: “Mga Geraseno” ang pagbasa ng SBLGNT at kaya ito ang nasa pangunahing teksto. Inilalagay sa talababa ang ibang sinaunang pagbasa upang maging malinaw ang tekstuwal at heograpikong pagkakaiba sa tradisyon nang hindi pinagtutugma nang sapilitan ang mga salaysay.
translation_notes:
  register: Gumamit ng natural, makabago, at marangal na Tagalog. Pinili ang “rehiyon” upang maiwasan ang maling pahiwatig ng makabagong bansang maaaring idulot ng “bansa,” at ang “nasa ibayo” upang malinaw na ipahiwatig ang lokasyon sa kabilang panig.
