id: LUK.8.31
reference: Luke 8:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀παρεκάλουν αὐτὸν ἵνα μὴ ἐπιτάξῃ αὐτοῖς εἰς τὴν ἄβυσσον ἀπελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/031.yaml
  text: And they were begging him not to command them to go into the abyss[a].
translation:
  language: tl
  text: At patuloy silang nagmakaawa sa kanya na huwag niya silang utusang pumunta sa Kalaliman[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “napakalalim na dako.” Ang salitang Griyego ay maaaring tumukoy sa isang napakalalim na lugar; dito, malamang na tumutukoy ito sa supernatural na dakong pinaglalagyan o piitan ng masasamang espiritu.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: patuloy silang nagmakaawa
  rationale: Ipinahihiwatig ng aspektong imperpekto ang nagpapatuloy o paulit-ulit na pagsusumamo. Ang “nagmakaawa” ay natural sa konteksto at nagpapakita ng matinding pakiusap.
- source_word: ἐπιτάξῃ
  choice: utusang
  rationale: Ipinahahayag ng pandiwa ang makapangyarihang pag-uutos. Pinananatili ng “utusang” ang awtoridad ni Jesus at natural itong sinusundan ng pandiwang “pumunta.”
- source_word: ἄβυσσον
  choice: Kalaliman
  rationale: Ang salita ay maaaring tumukoy sa napakalalim na dako; sa kontekstong ito ng masasamang espiritu, tumutukoy ito sa isang supernatural na dako. Ang “Kalaliman” ay tuwiran ngunit hindi labis na nagpapaliwanag.
- source_word: ἀπελθεῖν
  choice: pumunta
  rationale: Natural na ipinahahayag ng “pumunta” ang kilos patungo sa tinukoy na hantungan. Hindi na kailangang idagdag ang “lumayo” dahil malinaw na ang patutunguhan.
- source_word: ἵνα μὴ
  choice: na huwag
  rationale: Pagkatapos ng pandiwa ng pagsusumamo, ipinahahayag ng parirala ang nilalaman ng pakiusap. Ang “na huwag” ang natural na katumbas sa modernong Tagalog.
- source_word: αὐτοῖς
  choice: silang
  rationale: Ang panghalip ay tumutukoy sa mga espiritung tatanggap ng utos. Likas sa Tagalog ang pagkakabit nito sa “utusan” bilang “utusang ... sila,” na naging “silang” bago ang kasunod na pandiwa.
theological_decisions:
- issue: Kahulugan ng ἄβυσσος sa konteksto ng masasamang espiritu
  choice: Kalaliman bilang supernatural na dako na kinatatakutan ng masasamang espiritu
  alternative: kalaliman sa pangkalahatang kahulugang isang napakalalim na lugar
  rationale: Ipinakikita ng konteksto na kinatatakutan ng mga espiritu ang makapangyarihang utos ni Jesus. Pinananatili ng “Kalaliman” ang kosmikong pahiwatig nang hindi tiyakang dinaragdagan ang sinabi ni Lucas tungkol sa katangian o layunin ng dakong iyon.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Tagalog. Ang “patuloy” ay nagpapakita ng nagpapatuloy na pagsusumamo, at ang malaking titik sa “Kalaliman” ay tumutulong na ipahiwatig na isang natatanging supernatural na dako ang tinutukoy nang hindi ito labis na binibigyang-kahulugan.
