  naturalness: Makabago at marangal ang rehistro. Ang inayos na “tumitingin man sila … at nakikinig man sila …” ay mas likas na Filipino at mas maayos na ipinapahayag ang tensiyon ng pananalita.
  terminology: Ang “hiwaga,” “kaharian ng Diyos,” at “mga talinghaga” ay angkop, pamilyar, at hindi denominasyonal. Pinanatili ang pagkakaiba ng “malaman” at “makaunawa.”
