reference: Luke 8:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τοῦ θεοῦ, τοῖς δὲ λοιποῖς ἐν παραβολαῖς, ἵνα βλέποντες μὴ βλέπωσιν καὶ ἀκούοντες μὴ συνιῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/010.yaml
  text: And he said[a], “To you it has been given to know the mysteries of the kingdom of God, but to the rest in parables, so that seeing they may not see[c][b], and hearing they may not understand.”
translation:
  language: tl
  text: Sinabi niya, “Ipinagkaloob sa inyo na malaman ang mga hiwaga[a] ng kaharian ng Diyos, ngunit sa iba ay sa pamamagitan ng mga talinghaga, upang tumitingin man sila ay hindi makakita, at nakikinig man sila ay hindi makaunawa.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lihim.” Ang salitang Griyego ay tumutukoy sa mga katotohanan tungkol sa kaharian ng Diyos na nakakubli sa ilan at ipinahayag sa iba.
    reason: lexical_alternative
  - marker: b
    text: Ang mga salitang “upang tumitingin man sila ay hindi makakita, at nakikinig man sila ay hindi makaunawa” ay umaalingawngaw sa Isaias 6:9–10. Maaari itong magpahayag ng layunin ng Diyos, bunga ng kahatulan, o pareho.
    reason: cross_reference
lexical_decisions:
- source_word: δέδοται
  choice: ipinagkaloob
  rationale: Ipinahihiwatig ng perpektong pasibo ang isang kaloob na naibigay na at nananatiling taglay; hindi rin tahasang pinangalanan ang nagkaloob, gaya sa Griyego.
- source_word: γνῶναι
  choice: na malaman
  rationale: Tuwirang pinananatili ang diwa ng pagkilala o pagkaalam at inihihiwalay ito sa συνιῶσιν, na isinaling “makaunawa” sa hulihan.
- source_word: μυστήρια
  choice: mga hiwaga
  rationale: Ang “mga hiwaga” ay natural at dignified na katawagan sa mga katotohanan ng Diyos na nakakubli sa ilan at ipinahahayag sa iba; hindi nito ipinapahiwatig na likas na imposibleng maunawaan ang mga ito.
- source_word: βασιλείας τοῦ θεοῦ
  choice: kaharian ng Diyos
  rationale: 'Pamilyar at malawak ang saklaw: maaari nitong tukuyin kapwa ang paghahari ng Diyos at ang nasasakupan ng paghaharing iyon.'
- source_word: τοῖς δὲ λοιποῖς
  choice: ngunit sa iba
  rationale: Isinasalin ang “mga natitira/iba” nang natural sa Filipino, nang hindi inaangkat ang “mga nasa labas” mula sa kahalintulad na salaysay sa Marcos.
- source_word: ἐν παραβολαῖς
  choice: sa pamamagitan ng mga talinghaga
  rationale: Nililinaw sa natural na Filipino ang paraang ipinahahayag ang turo sa iba, habang pinananatili ang elipsis ng sugnay sa abot na mauunawaan.
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili ang puwersang layunin/bunga ng ἵνα nang hindi nagpapasya kung ito ay tanging banal na layunin o kahatulang bunga.
- source_word: βλέποντες μὴ βλέπωσιν
  choice: tumitingin sila ngunit hindi makakita
  rationale: Pinananatili ang pag-uulit ng ugat na “tingin/kita” at ang kapansin-pansing tensiyon ng pahayag mula sa Isaias.
- source_word: ἀκούοντες μὴ συνιῶσιν
  choice: nakikinig ngunit hindi makaunawa
  rationale: Ibinubukod ang pisikal na pakikinig sa mas malalim na pagkaunawa na ipinahihiwatig ng συνίημι.
theological_decisions:
- issue: Puwersa ng sugnay na ἵνα sa alusyon sa Isaias 6
  choice: Isinalin bilang “upang” at pinanatili ang tensiyon ng layunin at bunga.
  alternative: “Kaya” o “na ang resulta ay,” na higit na nagdidiin sa bunga lamang.
  rationale: Maaaring magpahayag ang ἵνα ng layunin, bunga, o magkaugnay na banal na layunin at kahatulang bunga. Hindi dapat pahupain o lutasin ng salin ang sadyang tensiyong ito.
- issue: Elipsis sa τοῖς δὲ λοιποῖς ἐν παραβολαῖς
  choice: “ngunit sa iba ay sa pamamagitan ng mga talinghaga”
  alternative: “ngunit sa iba ay ibinibigay ito sa pamamagitan ng mga talinghaga”
  rationale: Pinananatili ang maikli at bahagyang eliptikong ayos ng Griyego, ngunit gumagamit ng “ay” upang maging malinaw at natural sa Filipino nang hindi nagdaragdag ng tiyak na pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “talinghaga,” “hiwaga,” at “kaharian ng Diyos” bilang pamilyar na bokabularyong biblikal, habang iniwasan ang labis na sinauna o denominasyonal na pananalita.
