id: LUK.8.46
reference: Luke 8:46
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἥψατό μού τις, ἐγὼ γὰρ ἔγνων δύναμιν ⸀ἐξεληλυθυῖαν ἀπ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/046.yaml
  text: But Jesus said, “Someone touched me, for I knew that power had gone out from me.”
translation:
  language: tl
  text: Ngunit sinabi ni Jesus, “May humipo sa akin, sapagkat alam kong may kapangyarihang lumabas mula sa akin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥψατό μού τις
  choice: May humipo sa akin
  rationale: Likas na salin sa modernong Tagalog ng di-tiyak na τις at ng pandiwang ἅπτομαι; pinananatili nitong may isang taong sadyang humipo kay Jesus.
- source_word: ἐγὼ γὰρ ἔγνων
  choice: sapagkat alam kong
  rationale: Ipinahahayag ng ἔγνων ang tiyak na pagkaalam ni Jesus. Ang “alam kong” ay natural sa Tagalog at hindi pinahihina tungo sa simpleng pakiramdam o hinala.
- source_word: δύναμιν ἐξεληλυθυῖαν ἀπ’ ἐμοῦ
  choice: may kapangyarihang lumabas mula sa akin
  rationale: Pinananatili ang δύναμις bilang “kapangyarihan” at ang larawan ng paglabas nito mula kay Jesus, nang hindi ipinapaliwanag nang higit sa sinasabi ng teksto.
theological_decisions:
- issue: Kalikasan ng pagkaalam ni Jesus
  choice: alam kong
  alternative: naramdaman kong / napansin kong
  rationale: Ang ἔγνων ay tuwirang tumutukoy sa pagkaalam. Hindi nilulutas ng salin kung paano niya nalaman, kaya nananatili ang teolohikal at naratibong tensiyon.
- issue: Paglabas ng kapangyarihan mula kay Jesus
  choice: may kapangyarihang lumabas mula sa akin
  alternative: lumabas ang kapangyarihan ko
  rationale: Mas malapit ang napili sa di-tiyak na δύναμιν at sa ἀπ’ ἐμοῦ; hindi nito ipinapasok ang paliwanag tungkol sa mekanismo o kusang-loob na paggamit ng kapangyarihan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “Ngunit” para sa contrastive δέ at pinanatili ang tuwirang pananalita at payak na daloy ng salaysay.
