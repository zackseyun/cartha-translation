id: LUK.8.5
reference: Luke 8:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐξῆλθεν ὁ σπείρων τοῦ σπεῖραι τὸν σπόρον αὐτοῦ. καὶ ἐν τῷ σπείρειν αὐτὸν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ κατεπατήθη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/005.yaml
  text: The sower went out to sow his seed. And as he was sowing[a], some fell beside the path and was trampled, and the birds of the sky devoured it.
translation:
  language: tl
  text: Lumabas ang manghahasik upang maghasik ng kanyang binhi. Habang naghahasik siya, may bahagi ng binhi na nahulog sa tabi ng daan; natapakan ito, at nilamon ito ng mga ibon sa himpapawid[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga ibon ng langit.” Maaari ring isalin na “mga ibon sa kalangitan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξῆλθεν ὁ σπείρων
  choice: Lumabas ang manghahasik
  rationale: Likas at malinaw sa modernong Tagalog ang “lumabas,” at ang articular participle ay angkop na isinalin bilang pangngalang “manghahasik.”
- source_word: τοῦ σπεῖραι τὸν σπόρον αὐτοῦ
  choice: upang maghasik ng kanyang binhi
  rationale: Ipinapahayag ng genitive infinitive ang layunin ng paglabas; pinananatili ng “kanyang binhi” ang payak na larawang pansakahan.
- source_word: ἐν τῷ σπείρειν αὐτόν
  choice: Habang naghahasik siya
  rationale: Natural na ipinahahayag ng “habang” ang kasabay na kilos na tinutukoy ng ἐν kasama ng articular infinitive.
- source_word: ὃ μὲν
  choice: may bahagi ng binhi
  rationale: Tumutukoy ito sa isang bahagi ng naihahasik na binhi at naghahanda sa iba pang mga bahaging ilalarawan sa talinghaga.
- source_word: ἔπεσεν παρὰ τὴν ὁδόν
  choice: nahulog sa tabi ng daan
  rationale: Malinaw na ipinahahayag ng “sa tabi ng daan” ang lokasyong katabi o kahilera ng daan nang hindi gumagamit ng makalumang pananalita.
- source_word: κατεπατήθη
  choice: natapakan ito
  rationale: Tumpak at natural na pasibong katumbas ito ng pagkayurak o pagkakatapak sa binhi.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: mga ibon sa himpapawid
  rationale: Karaniwang Filipino ang “mga ibon sa himpapawid” para sa mga ibong lumilipad sa kalangitan; inilalagay sa talababa ang mas literal na anyo.
- source_word: κατέφαγεν αὐτό
  choice: nilamon ito
  rationale: Napananatili ng “nilamon” ang masidhing diwa ng pandiwang nangangahulugang kainin nang lubusan.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, marangal, at madaling maunawaang Filipino. Pinanatili ang larawang pansakahan at ang kolektibong pagtukoy sa isang bahagi ng binhi, habang iniwasan ang makaluma o labis na teknikal na pananalita.
