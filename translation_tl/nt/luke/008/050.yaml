    rationale: Ang ‘made well’ ay mas tumutukoy sa paggaling o pagpapanumbalik sa kalusugan/kaayusan, samantalang ang kasalukuyang parirala ay maaaring mangahulugan lamang ng anumang uri ng pagbuti. Ang talababa ay dapat magpanatili ng kontekstuwal na ugnayan sa paggaling at pagpapanumbalik ng buhay.
