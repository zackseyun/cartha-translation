  source_fidelity: Tumpak na naihahatid ng draft ang pagkakasunod ng pangyayari (narinig ni Jesus at saka sumagot), ang utos na huwag matakot, ang restriktibong diin ng μόνον, at ang hinaharap na pangako para sa anak na babae. Ang “maliligtas siya” ay lehitimong pangunahing salin ng σωθήσεται at maayos na pinananatili ang malawak na saklaw nito.
  naturalness: Likas ang “Huwag kang matakot” at “manampalataya ka lamang.” Gayunman, mas malinaw at mas maayos ang daloy ng “sumagot si Jesus sa kanya” kaysa “sumagot siya sa kanya,” dahil iniiwasan nito ang magkakasunod na panghalip. Ang “mapapabuti ang kalagayan niya” sa talababa ay masyadong maluwag at hindi sapat na tuwirang alternatibo para sa ‘made well.’
  terminology: Ang “manampalataya” ay angkop sa ganitong utos ni Jesus; ang “magtiwala” ay wastong alternatibo. Ang “maliligtas” ay nagpapanatili sa leksikal na ugnayan sa σῴζω nang hindi isinasara ang kahulugan sa pisikal na paggaling. Dapat lamang gawing mas tumpak ang paliwanag ng talababa tungkol sa kontekstuwal na pagpapanumbalik ng buhay o kagalingan.
