  text: ὁ δὲ Ἰησοῦς ἀκούσας ἀπεκρίθη ⸀αὐτῷ· Μὴ φοβοῦ, μόνον ⸀πίστευσον, καὶ σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/050.yaml
  text: But Jesus[a], hearing this, answered him, “Do not fear; only believe[b], and she will be saved.”
translation:
  language: tl
  text: Ngunit nang marinig ito ni Jesus, sumagot si Jesus sa kanya, “Huwag kang matakot; manampalataya ka lamang[a], at maliligtas siya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magtiwala ka lamang.”
    reason: lexical_alternative
  - marker: b
    text: O “gagaling siya” o “maibabalik siya sa kagalingan.” Ang pandiwang Griyego ay maaaring mangahulugang iligtas, sagipin, o pagalingin; sa kontekstong ito, kabilang dito ang pagpapanumbalik ng buhay o kagalingan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: nang marinig ito
  rationale: Ipinahihiwatig ng aorist participle na naunang narinig ni Jesus ang balita bago siya sumagot. Likas sa Tagalog ang “nang marinig ito,” at ang “ito” ay tumutukoy sa sinabi sa naunang konteksto.
- source_word: ἀπεκρίθη αὐτῷ
  choice: sumagot siya sa kanya
  rationale: Tuwirang ipinapahayag ang karaniwang diwa ng ἀποκρίνομαι kasama ang dative na αὐτῷ, habang pinananatiling malinaw ang kausap ni Jesus.
- source_word: Μὴ φοβοῦ
  choice: Huwag kang matakot
  rationale: Natural at marangal na utos sa modernong Tagalog; malinaw nitong inihahatid ang pagbabawal na huwag magpadala sa takot.
- source_word: μόνον πίστευσον
  choice: manampalataya ka lamang
  rationale: Ang “lamang” ay nagpapanatili sa eksklusibong diin ng μόνον, at ang “manampalataya” ay angkop na pandiwang katumbas ng πιστεύω sa ganitong panawagan.
- source_word: σωθήσεται
  choice: maliligtas siya
  rationale: Pinananatili ng “maliligtas” ang malawak na saklaw ng σῴζω—pagliligtas, pagsagip, o pagpapagaling—nang hindi agad nililimitahan ang kahulugan sa pisikal na paggaling.
theological_decisions:
- issue: Kahulugan ng πιστεύω sa utos ni Jesus
  choice: manampalataya
  alternative: magtiwala
  rationale: Ang “manampalataya” ang tuwirang salitang ginagamit sa kontekstong panrelihiyon, ngunit maaaring taglay rin ng utos ang personal na diwa ng pagtitiwala. Inilalagay ang alternatibo sa talababa upang hindi maging tila purong intelektuwal na pagsang-ayon ang kahulugan.
- issue: Kahulugan ng σωθήσεται sa konteksto ng batang nasa bingit ng kamatayan
  choice: maliligtas siya
  alternative: gagaling siya / mapapabuti ang kalagayan niya
  rationale: Pinananatili ng pangunahing teksto ang leksikal at teolohikal na lawak ng σῴζω. Gayunman, malinaw na kabilang sa agarang konteksto ang paggaling at pagpapanumbalik ng buhay, kaya binabanggit ang mga iyon bilang mga alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Huwag kang matakot” sa halip na mas pormal na “Huwag kang mangamba,” at pinanatili ang mas malawak na “maliligtas” sa pangunahing teksto upang hindi paliitin ang saklaw ng salitang Griyego.
