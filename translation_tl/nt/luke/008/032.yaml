  source_fidelity: 'Tapat ang salin sa Griyego: naipapahayag ang pag-iral ng isang malaking kawan, ang pagkain/pagpapakain nito sa bundok, ang mariing pakiusap ng di-tahasang pangmaramihang simuno, ang pagpasok sa mga baboy na iyon, at ang pagbibigay ng pahintulot. Ang “doon sa bundok” ay sapat na naghahatid ng ἐκεῖ at ἐν τῷ ὄρει nang hindi nagdaragdag ng detalye.'
