id: LUK.8.32
reference: Luke 8:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἦν δὲ ἐκεῖ ἀγέλη χοίρων ἱκανῶν ⸀βοσκομένη ἐν τῷ ὄρει· καὶ ⸀παρεκάλεσαν αὐτὸν ἵνα ἐπιτρέψῃ αὐτοῖς εἰς ἐκείνους εἰσελθεῖν· καὶ ἐπέτρεψεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/032.yaml
  text: There was a large herd of pigs feeding there on the mountain[a], and they begged him to permit them to enter those pigs[c][b], and he permitted them.
translation:
  language: tl
  text: May isang malaking kawan ng mga baboy[a] na kumakain doon sa bundok[b]. Nagmakaawa sila[c] sa kanya na payagan silang pumasok sa mga baboy na iyon, at pinayagan niya sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maraming baboy” o “isang kawan ng di-kakaunting baboy.”
    reason: lexical_alternative
  - marker: b
    text: O “sa dalisdis ng bundok.”
    reason: lexical_alternative
  - marker: c
    text: Ang “sila” ay tumutukoy sa mga demonyo o maruruming espiritu sa nakapaligid na konteksto; tahasang binabanggit ito sa ilang salin.
    reason: referent_clarification
lexical_decisions:
- source_word: ἀγέλη χοίρων ἱκανῶν
  choice: isang malaking kawan ng mga baboy
  rationale: Ang ἀγέλη ay isang kawan, ang χοίρων ay mga baboy, at ipinahihiwatig ng ἱκανῶν na marami o malaki ang bilang. Natural sa makabagong Tagalog ang “malaking kawan,” habang inilalahad sa talababa ang mas literal na alternatibo.
- source_word: βοσκομένη
  choice: kumakain
  rationale: Inilalarawan ng pandiwaring ito ang ginagawang pagkain ng kawan. Mas natural at mas malawak ang “kumakain” para sa mga baboy kaysa “nanginginain,” na maaaring magpahiwatig ng damo lamang.
- source_word: ἐν τῷ ὄρει
  choice: sa bundok
  rationale: Malapit ito sa karaniwang kahulugan ng ὄρος at hindi nito ipinapalit agad ang mas interpretibong “dalisdis ng bundok.”
- source_word: παρεκάλεσαν
  choice: nagmakaawa
  rationale: Ipinahahayag nito ang mariin at apurahang pakiusap, hindi lamang isang karaniwang paghiling.
- source_word: ἐπιτρέψῃ / ἐπέτρεψεν
  choice: payagan / pinayagan
  rationale: Pinananatili ng magkaugnay na mga salitang ito ang pagtutugma sa pagitan ng kanilang kahilingan at ng tugon ni Jesus.
- source_word: εἰς ἐκείνους εἰσελθεῖν
  choice: pumasok sa mga baboy na iyon
  rationale: Tuwirang ipinahahayag nito ang pagpasok sa tinutukoy na mga baboy at pinananatili ang puwersa ng ἐκείνους, “mga iyon.”
- source_word: δὲ / καί
  choice: May …; … at
  rationale: Ang δὲ ay nagsusulong ng salaysay ngunit hindi nangangailangan ng hiwalay na “ngayon.” Ang mga ugnayang καί ay isinalin ayon sa natural na daloy ng pangungusap sa Tagalog.
theological_decisions:
- issue: Tinutukoy ng nakatagong pangmaramihang simuno ng παρεκάλεσαν at αὐτοῖς
  choice: Pinanatiling di-tahasang “sila,” gaya ng Griyego
  alternative: “Nagmakaawa sa kanya ang mga demonyo”
  rationale: Ipinakikilala ng nakapaligid na konteksto ang mga demonyo o maruruming espiritu bilang tinutukoy, ngunit hindi sila tahasang pinapangalanan sa talatang ito. Ang “sila” ay nagpapanatili sa anyo at bahagyang kalabuan ng pinagmulan nang hindi itinatago sa mambabasa ang kontekstuwal na tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang “mga baboy” at “kumakain” sa halip na mas luma o labis na teknikal na pananalita. Ang ayos ng pangungusap ay natural sa Filipino habang pinananatili ang pagkakasunod at teolohikal na pag-igting ng Griyego.
