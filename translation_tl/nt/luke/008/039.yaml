  naturalness: Natural at marangal ang “Bumalik ka,” “iyong tahanan,” at “isalaysay mo.” Mas malinaw at mas natural ang aktibong “ipinahayag niya” sa huling sugnay.
  terminology: Ang “Diyos,” “Jesus,” “tahanan,” at “isalaysay” ay angkop sa modernong Filipino Tagalog at sa rehistrong biblikal. Ang “lahat ng” ay maingat na kumakatawan sa ὅσα nang hindi idinaragdag ang “dakilang.”
  issues:
