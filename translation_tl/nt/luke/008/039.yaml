base_translation:
  language: en
  yaml_path: translation/nt/luke/008/039.yaml
  text: Return to your house, and tell what great things God has done for you. And he went away, proclaiming throughout the whole city what Jesus had done for him.
translation:
  language: tl
  text: “Bumalik ka sa iyong tahanan at isalaysay mo ang lahat ng ginawa ng Diyos para sa iyo.” At umalis siya at ipinahayag niya sa buong lungsod ang lahat ng ginawa ni Jesus para sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπόστρεφε
  choice: Bumalik ka
  rationale: Tuwirang ipinahahayag ang utos na magbalik sa dating lugar, at likas ito sa makabagong Tagalog.
- source_word: εἰς τὸν οἶκόν σου
  choice: sa iyong tahanan
  rationale: Ang οἶκος ay maaaring tumukoy sa bahay o tahanan; ang “tahanan” ay natural dito at ipinahihiwatig kapwa ang lugar at ang pag-uwi sa sariling tahanan.
- source_word: διηγοῦ
  choice: isalaysay mo
  rationale: Ipinapakita ng διηγέομαι ang masinsing pagkukuwento o pagsasalaysay, kaya mas tiyak ang “isalaysay” kaysa sa payak na “sabihin.”
- source_word: ὅσα σοι ἐποίησεν ὁ θεός
  choice: ang lahat ng ginawa ng Diyos para sa iyo
  rationale: Tapat na inililipat ng “ang lahat ng” ang saklaw ng ὅσα nang hindi nagdaragdag ng pang-uring katumbas ng “dakila,” na wala namang tahasang nasa Griyego.
- source_word: ἀπῆλθεν
  choice: umalis siya
  rationale: Malinaw at natural na ipinahahayag ang pag-alis niya mula sa pinangyarihan.
- source_word: καθ’ ὅλην τὴν πόλιν
  choice: sa buong lungsod
  rationale: Natural na Tagalog para sa distributibong diwa ng pagpapahayag sa lahat ng dako ng lungsod.
- source_word: κηρύσσων
  choice: ipinahayag
  rationale: Pinananatili ang diwa ng hayagan at malawakang pagbabalita nang hindi nililimitahan ito sa pormal na pangangaral.
- source_word: ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς
  choice: ang lahat ng ginawa ni Jesus para sa kanya
  rationale: Sinasalamin nito ang naunang parirala tungkol sa ginawa ng Diyos at natural na inilalahad ang natapos nang ginawa ni Jesus.
theological_decisions:
- issue: Pagkakapantay ng “Diyos” sa utos ni Jesus at “Jesus” sa ipinahayag ng lalaki
  choice: 'Panatilihin ang magkatulad na ayos: “ginawa ng Diyos para sa iyo” / “ginawa ni Jesus para sa kanya”'
  alternative: Pag-isahin ang dalawang sugnay sa pamamagitan ng paggamit lamang ng “Diyos” o lamang ng “Jesus,” o dagdagan ng paliwanag na tahasang nag-uugnay sa dalawa
  rationale: Sadyang inilalagay ng salaysay ang Diyos at si Jesus sa magkatulad na pahayag nang walang paliwanag. Pinananatili ng salin ang teolohikal na bigat at tensiyong ito nang hindi ito nilulutas sa pamamagitan ng dagdag na pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tahanan” at “isalaysay” upang maging natural ngunit sapat na pormal para sa tekstong biblikal; iniwasan ang di-tahasang dagdag na “mga dakilang bagay.”
