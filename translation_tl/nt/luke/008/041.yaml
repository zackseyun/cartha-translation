id: LUK.8.41
reference: Luke 8:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἦλθεν ἀνὴρ ᾧ ὄνομα Ἰάϊρος, καὶ ⸀οὗτος ἄρχων τῆς συναγωγῆς ὑπῆρχεν, καὶ πεσὼν παρὰ τοὺς πόδας ⸀τοῦ Ἰησοῦ παρεκάλει αὐτὸν εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/041.yaml
  text: And behold, a man named Jairus came, and he was a ruler of the synagogue; and falling at Jesus's feet, he begged him to come into his house,
translation:
  language: tl
  text: At narito, dumating ang isang lalaking nagngangalang Jairo. Isa siyang pinuno ng sinagoga. Nagpatirapa siya sa paanan ni Jesus at nakiusap na pumasok si Jesus sa kanyang bahay,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἰδού
  choice: At narito
  rationale: Pinananatili ang pansin-tawag ng salitang Griyego habang gumagamit ng dignified at pamilyar na anyo sa Tagalog.
- source_word: ἀνήρ
  choice: isang lalaki
  rationale: Tuwirang ipinahahayag na nasa hustong gulang na lalaki si Jairo.
- source_word: ἄρχων τῆς συναγωγῆς
  choice: pinuno ng sinagoga
  rationale: Likas at malinaw na katumbas para sa opisyal na may pamamahalang tungkulin sa sinagoga, nang hindi dinaragdagan ang espesipikong saklaw ng tungkulin.
- source_word: πεσὼν παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: Nagpatirapa siya sa paanan ni Jesus
  rationale: Ipinahahayag ang literal na pagbagsak/paglapit sa paanan bilang kilos ng matinding pagpapakumbaba at pagsusumamo.
- source_word: παρεκάλει
  choice: nakiusap
  rationale: Ang di-ganap na aspekto ng Griyego ay tumutukoy sa taimtim o patuloy na pagsusumamo; natural itong naihahatid ng 'nakiusap' sa konteksto.
- source_word: εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ
  choice: pumunta si Jesus sa bahay niya
  rationale: Natural na Tagalog para sa pagpasok/pagpunta sa tahanan; inuulit ang 'si Jesus' upang maiwasan ang malabong reperensiya ng panghalip.
theological_decisions:
- issue: Kung ang pagpapatirapa sa paanan ni Jesus ay tahasang tatawaging pagsamba
  choice: Nagpatirapa siya sa paanan ni Jesus
  alternative: Sumamba siya kay Jesus
  rationale: Inilalarawan ng teksto ang pisikal na kilos ngunit hindi nito tahasang ginagamit ang karaniwang pandiwa para sa pagsamba; pinananatili ang posibleng teolohikal na kahulugan nang hindi ito ipinipilit.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at dignified. Hinati sa maiikling pangungusap para sa likas na daloy, ngunit pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap at salaysay sa susunod na talata.
