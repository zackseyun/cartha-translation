  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχεταί τις παρὰ τοῦ ἀρχισυναγώγου ⸀λέγων ὅτι Τέθνηκεν ἡ θυγάτηρ σου, ⸀μηκέτι σκύλλε τὸν διδάσκαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/049.yaml
  text: While he was still speaking[a], someone came from the synagogue leader, saying, “Your daughter has died[b]; do not trouble the teacher any longer.”
translation:
  language: tl
  text: Habang nagsasalita pa si Jesus, may dumating mula sa pinuno ng sinagoga at nagsabi, “Namatay na ang anak mong babae. Huwag mo nang abalahin ang Guro.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Habang nagsasalita pa si Jesus
  rationale: Ang genitive absolute ay nagsasaad ng kasabay na pangyayari. Nilinaw ang tinutukoy ng panghalip bilang si Jesus ayon sa konteksto, at pinanatili ng “pa” ang diwa ng ἔτι.
- source_word: ἔρχεταί τις
  choice: may dumating
  rationale: Ang makasaysayang pangkasalukuyan ay likas na isinasalaysay sa nagdaang anyo sa Tagalog. Sapat na ipinahihiwatig ng “may” ang di-tiyak na τις nang hindi mabigat ang “isang tao.”
- source_word: παρὰ τοῦ ἀρχισυναγώγου
  choice: mula sa pinuno ng sinagoga
  rationale: Ang παρά na may genitive ay nagpapahayag ng pinagmulan, at ang ἀρχισυνάγωγος ay tumutukoy sa namumunong opisyal ng sinagoga. Hindi idinagdag ang “bahay” o “tauhan” dahil hindi tahasang nasa Griyego ang mga iyon.
- source_word: λέγων
  choice: at nagsabi
  rationale: Likas na inuugnay sa Tagalog ang participle sa pangunahing pandiwa sa pamamagitan ng “at,” habang malinaw na ipinakikilala ang mensahe.
- source_word: Τέθνηκεν
  choice: Namatay na
  rationale: Ang perpektong panahunan ay tumutukoy sa naganap na kamatayan at sa nananatiling kalagayan nito; likas na naihahatid ito ng “namatay na.”
- source_word: ἡ θυγάτηρ σου
  choice: ang anak mong babae
  rationale: Tumpak at karaniwang salin ng θυγάτηρ, at pinananatili ng “mong” ang isahang kausap sa σου.
- source_word: μηκέτι σκύλλε
  choice: Huwag mo nang abalahin
  rationale: Ang “huwag ... nang” ay likas na naghahayag ng utos na itigil o huwag nang ipagpatuloy ang kilos. Ang “abalahin” ay malinaw at magalang na katumbas ng σκύλλω sa kontekstong ito.
- source_word: τὸν διδάσκαλον
  choice: ang Guro
  rationale: Pinanatili ang payak na kahulugang “guro” ng διδάσκαλος, sa halip na ang higit na interpretatibong “Panginoon” o “Amo.” Ginamit ang malaking titik dahil tumatayong pantukoy ito kay Jesus sa salaysay.
theological_decisions:
- issue: Paglalarawan sa ἀρχισυνάγωγος kaugnay ni Jairo
  choice: pinuno ng sinagoga
  alternative: tagapamahala ng sinagoga
  rationale: Isa itong tungkuling institusyonal, hindi titulong teolohikal. Ang “pinuno ng sinagoga” ay malinaw sa karaniwang mambabasa at hindi nag-aangkat ng katawagang eklesiastikal.
- issue: Pagkasalin sa διδάσκαλος
  choice: Guro
  alternative: Amo
  rationale: Ang karaniwang leksikal na kahulugan ay “guro.” Hindi ito pinalitan ng titulong may mas mataas na kristolohikal na pahiwatig kaysa sa tahasang sinasabi ng talata.
- issue: Pagkilala sa paksa ng αὐτοῦ
  choice: si Jesus
  alternative: siya
  rationale: Bagaman panghalip lamang ang nasa Griyego, malinaw sa naunang konteksto na si Jesus ang nagsasalita. Ang pagbanggit sa pangalan ay nagpapalinaw sa malayang talata nang hindi binabago ang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang “mo” ayon sa σου at iniwasan ang dagdag na “po,” sapagkat walang katumbas na magalang na pananda sa pinagmulang teksto. Walang talababa dahil ang mga alternatibong “tagapamahala” at “istorbohin” ay hindi lumilikha ng mahalagang tekstuwal o teolohikal na kalabuan.
