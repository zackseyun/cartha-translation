  text: εἶπεν δὲ αὐτοῖς· ⸀Ποῦ ἡ πίστις ὑμῶν; φοβηθέντες δὲ ἐθαύμασαν, λέγοντες πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ τοῖς ἀνέμοις ἐπιτάσσει καὶ τῷ ὕδατι, καὶ ὑπακούουσιν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/025.yaml
  text: Then he said to them[a], “Where is your faith?” And being afraid, they marveled, saying to one another, “Who then is this, that he commands even the winds and the water, and they obey him?”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Nasaan ang inyong pananampalataya[a]?” Natakot sila at namangha, at sinabi sa isa’t isa, “Sino nga ba ito na nag-uutos maging sa mga hangin at sa tubig, at sumusunod ang mga ito sa kanya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagtitiwala.” Maaari ring unawain ang tanong ni Jesus bilang, “Nasaan ang inyong pagtitiwala?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῦ
  choice: Nasaan
  rationale: Pinananatili nito ang tuwirang tanong tungkol sa kinaroroonan o pag-iral ng kanilang pananampalataya, sa halip na palawakin ito bilang “Bakit wala kayong...”
- source_word: πίστις
  choice: pananampalataya
  rationale: Ito ang karaniwan at malawak na katumbas ng πίστις; sa konteksto, kalakip nito ang diwa ng pagtitiwala kay Jesus, na inilalahad sa talababa.
- source_word: φοβηθέντες δὲ ἐθαύμασαν
  choice: Natakot sila at namangha
  rationale: Natural itong Tagalog na nagpapahayag ng magkaugnay na tugon ng takot at pagkamangha nang hindi dinaragdagan ang tindi ng mga salita.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: Sino nga ba ito?
  rationale: Ang “nga ba” ay likas na naghahatid ng mapagnilay at mariing puwersa ng ἄρα matapos ang himala.
- source_word: ἐπιτάσσει
  choice: Inuutusan niya
  rationale: Tuwirang ipinahahayag nito ang pagbibigay ng utos at hindi ipinapasok ang salitang “sinaway” mula sa naunang talata.
- source_word: τοῖς ἀνέμοις ... καὶ τῷ ὕδατι
  choice: ang mga hangin at ang tubig
  rationale: Sinusunod nito ang tahasang maramihang “mga hangin” at isahang “tubig” ni Lucas, sa halip na gawing “alon” o “dagat.”
- source_word: ὑπακούουσιν αὐτῷ
  choice: sumusunod ang mga ito sa kanya
  rationale: Malinaw at natural nitong ipinahahayag ang pagsunod ng mga puwersa ng kalikasan sa kanyang utos.
theological_decisions:
- issue: Ang πίστις ay maaaring magpahiwatig ng pananampalataya o pagtitiwala sa kontekstong ito
  choice: pananampalataya
  alternative: pagtitiwala
  rationale: Pinananatili ng “pananampalataya” ang karaniwan at teolohikal na malawak na termino, habang ang kontekstuwal na diwang “pagtitiwala” ay itinatala bilang lehitimong alternatibo nang hindi pinipili lamang ang isang interpretasyon.
translation_notes:
  register: Makabagong Filipino Tagalog na natural at marangal. Ginamit ang “Nasaan” at “Sino nga ba ito?” para mapanatili ang tuwiran at mapagnilay na lakas ng Griyego. Iniwasan ang mas interpretibong “mga alon” at pinanatili ang “tubig.”
