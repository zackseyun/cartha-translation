  text: καὶ Ἰωάννα γυνὴ Χουζᾶ ἐπιτρόπου Ἡρῴδου καὶ Σουσάννα καὶ ἕτεραι πολλαί, αἵτινες διηκόνουν αὐτοῖς ⸀ἐκ τῶν ὑπαρχόντων αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/003.yaml
  text: and Joanna[a], the wife of Chuza, Herod’s steward, and Susanna, and many others[b], who were serving them out of their possessions.
translation:
  language: tl
  text: at si Juana, asawa ni Cuza, ang tagapangasiwa ni Herodes, si Susana, at marami pang ibang babae, na naglilingkod sa kanila[a] mula sa sarili nilang mga ari-arian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “sa kaniya” sa halip na “sa kanila.”
    reason: textual_variant
  - marker: b
    text: Maaari ring isalin na “mula sa kanilang mga pag-aari” o “mula sa kanilang mga mapagkukunan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ Χουζᾶ
  choice: asawa ni Cuza
  rationale: Sa apposisyon kay Juana at sinusundan ng pangalang nasa genitive, ang γυνή ay likas na tumutukoy sa kaniyang pagiging asawa ni Cuza.
- source_word: ἐπιτρόπου
  choice: tagapangasiwa
  rationale: Tumutukoy ito sa taong pinagkatiwalaang mamahala sa mga gawain o ari-arian. Ang “tagapangasiwa” ay malinaw at angkop sa konteksto ng sambahayan o korte ni Herodes.
- source_word: ἕτεραι πολλαί
  choice: marami pang ibang babae
  rationale: Ang anyong pambabae sa Griyego ay tahasang tumutukoy sa iba pang mga babae; nilinaw ito sa Filipino upang maiwasan ang malabong “marami pang iba.”
- source_word: διηκόνουν
  choice: naglilingkod
  rationale: Pinananatili nito ang malawak na diwa ng paglilingkod nang hindi ipinapasok ang posibleng makitid o eklesiyastikal na kahulugan ng “ministeryo.”
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Sinusunod ang plural na αὐτοῖς sa SBLGNT, na pinakamalamang na tumutukoy kay Jesus at sa mga kasama niya.
- source_word: ἐκ τῶν ὑπαρχόντων αὐταῖς
  choice: gamit ang sarili nilang mga ari-arian
  rationale: Ipinahahayag nito sa natural na Filipino na ang kanilang paglilingkod ay nagmula sa mga mapagkukunang pag-aari nila mismo.
theological_decisions:
- issue: Tinutukoy ng αὐτοῖς
  choice: 'plural: naglilingkod ang mga babae kay Jesus at sa mga kasama niya'
  alternative: 'singular: naglilingkod ang mga babae sa kaniya, kay Jesus'
  rationale: Plural ang αὐτοῖς sa ibinigay na tekstong Griyego. Pinanatili ito sa salin, habang itinatala sa talababa ang singular na pagbasa ng ilang manuskrito.
translation_notes:
  register: Makabagong, dignidadong Filipino na madaling maunawaan. Ginamit ang karaniwang anyo ng mga pangalang Juana, Cuza, Susana, at Herodes. Hinati sa dalawang pangungusap upang maging natural at malinaw sa Filipino nang hindi binabago ang ugnayan ng mga sugnay.
