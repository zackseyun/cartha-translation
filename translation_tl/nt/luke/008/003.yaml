  verdict: revise
  source_fidelity: Tumpak ang pangunahing pagtukoy sa mga babae, kay Cuza bilang tagapangasiwa ni Herodes, at sa plural na “kanila.” Gayunman, ang “gamit ang” ay mas instrumental kaysa sa ἐκ (“mula sa/out of”), at ang paghahati sa dalawang pangungusap ay nagpapahina sa ugnayan ng panghalip na sugnay sa naunang talaan.
  naturalness: Natural at malinaw ang karamihan ng draft, ngunit mas maayos sa makabagong Filipino na manatiling iisang pangungusap ang talaan at ang sugnay na naglalarawan sa mga babae. Ang “ang tagapangasiwa ni Herodes” ay malinaw na apposisyon kay Cuza.
  terminology: Ang “asawa,” “tagapangasiwa,” “marami pang ibang babae,” at “naglilingkod” ay angkop. Ang “mula sa sarili nilang mga ari-arian” ay mas malapit sa pinagmulan/pondo na ipinahihiwatig ng Griyego kaysa “gamit ang.”
  issues:
