base_translation:
  language: en
  yaml_path: translation/nt/luke/008/015.yaml
  text: But the seed in the good soil—these are the ones who[a], having heard the word with a good and noble heart, hold fast to it and bear fruit with perseverance.
translation:
  language: tl
  text: Ngunit ang binhi sa mabuting lupa—sila ang mga taong nakarinig ng salita nang may marangal at mabuting puso[a], pinanghahawakan ito, at namumunga nang may pagtitiyaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang may tapat at mabuting puso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... ἐν τῇ καλῇ γῇ
  choice: ang binhi sa mabuting lupa
  rationale: Elliptical ang Griyego at tumutukoy pabalik sa binhi sa talinghaga. Nilinaw ang tinutukoy sa natural na Tagalog sa pamamagitan ng pagdagdag ng “binhi.”
- source_word: καλῇ γῇ
  choice: mabuting lupa
  rationale: Sa kontekstong pansakahan, ang γῆ ay lupang tinatamnan. Pinananatili ng “mabuting lupa” ang kaibahan nito sa ibang uri ng lupa sa talinghaga.
- source_word: οὗτοί εἰσιν οἵτινες
  choice: sila ang mga taong
  rationale: Natural at malinaw itong pagkakakilanlan sa modernong Tagalog, nang hindi pinatitigas ang estruktura ng Griyego.
- source_word: ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ
  choice: nang may marangal at mabuting puso
  rationale: Ang “puso” ay tumutukoy sa panloob na pagkatao. Ginamit ang magkaibang “marangal” at “mabuti” upang mapanatili ang dalawang magkalapit ngunit magkahiwalay na pang-uri sa Griyego.
- source_word: ἀκούσαντες τὸν λόγον
  choice: nakarinig ng salita
  rationale: Ipinahihiwatig ng aorist participle na nauna ang pakikinig bago ang patuloy na paghawak at pamumunga. Ang “salita” ay pinanatili bilang terminong gamit sa paliwanag sa talinghaga.
- source_word: κατέχουσιν
  choice: pinanghahawakan ito
  rationale: Ipinapahayag nito ang matatag at patuloy na pag-iingat sa salita, hindi lamang ang pagkakaroon nito.
- source_word: καρποφοροῦσιν
  choice: namumunga
  rationale: Natural na katumbas sa Tagalog na nagpapanatili sa larawang pansakahan at sa talinghagang kahulugan.
- source_word: ἐν ὑπομονῇ
  choice: nang may pagtitiyaga
  rationale: Ipinahahayag ang matatag na pagpapatuloy bilang paraan ng pamumunga; mas malawak ito kaysa simpleng pagiging mapagpasensya.
theological_decisions:
- issue: Moral na paglalarawan sa pusong tumatanggap
  choice: nang may marangal at mabuting puso
  alternative: nang may tapat at mabuting puso
  rationale: Pinananatili ang positibong paglalarawan sa panloob na disposisyon at ang dalawang pang-uri, nang hindi nagpapasya kung paano nabuo ang gayong puso o nag-aangkat ng doktrina tungkol sa likas na kabutihan, pagkakasunod-sunod ng pagbabagong espirituwal, o merito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “pinanghahawakan” at “pagtitiyaga” upang ihatid ang aktibo at matatag na pagpapatuloy. Inilagay ang talababa sa dulo dahil tumutukoy ito sa huling pariralang ἐν ὑπομονῇ.
