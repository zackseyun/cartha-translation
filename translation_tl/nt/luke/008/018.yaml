  to: Kaya’t mag-ingat kayo kung paano kayo nakikinig. Sapagkat ang sinumang mayroon ay bibigyan pa, ngunit ang sinumang wala, kahit ang inaakala niyang mayroon siya ay kukunin sa kanya.[a]
  rationale: Pinalitan lamang ang unang pandiwang parirala upang maipahayag nang natural sa modernong Filipino ang mapagbabala at maingat na puwersa ng βλέπετε. Hindi binago ang ambigwidad ng ‘mayroon,’ ang paradoksal na anyo ng kasabihan, o ang alternatibong pagbasa ng δοκεῖ.
