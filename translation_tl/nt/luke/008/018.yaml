  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: βλέπετε οὖν πῶς ἀκούετε· ὃς ⸂ἂν γὰρ⸃ ἔχῃ, δοθήσεται αὐτῷ, καὶ ὃς ⸀ἂν μὴ ἔχῃ, καὶ ὃ δοκεῖ ἔχειν ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/018.yaml
  text: Therefore[a], pay attention to how you listen. For whoever has, more will be given to him, and whoever does not have, even what he thinks he has will be taken away from him.
translation:
  language: tl
  text: Kaya’t mag-ingat kayo kung paano kayo nakikinig. Sapagkat ang sinumang mayroon ay bibigyan pa, ngunit ang sinumang wala, kahit ang inaakala niyang mayroon siya ay kukunin sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “kahit ang tila mayroon siya ay kukunin sa kanya.”
    reason: Pinananatili ang alternatibong kahulugan ng δοκεῖ bilang ‘tila’ sa halip na ‘inaakala.’
lexical_decisions:
- source_word: βλέπετε
  choice: ingatan ninyo
  rationale: Ang imperatibo ay nananawagan ng maingat na pagbabantay sa paraan ng pakikinig, hindi ng literal na pagtingin.
- source_word: οὖν
  choice: Kaya
  rationale: Likas sa modernong Tagalog at malinaw na nag-uugnay sa talata sa naunang turo tungkol sa pakikinig.
- source_word: πῶς ἀκούετε
  choice: kung paano kayo nakikinig
  rationale: Pinananatili ang diin sa paraan at tugon ng pakikinig, hindi lamang sa pisikal na pagdinig.
- source_word: ὃς ἂν ... ἔχῃ
  choice: ang sinumang mayroon
  rationale: Likas na ipinahahayag ang pangkalahatan at di-tiyak na kondisyon ng Griyegong sugnay.
- source_word: δοθήσεται αὐτῷ
  choice: ay bibigyan pa
  rationale: Bagaman walang tahasang layon sa Griyego, ipinahihiwatig ng paralelismo ang karagdagang pagkakaloob; ipinapahayag ito nang maikli at natural.
- source_word: ὃς ἂν μὴ ἔχῃ
  choice: ang sinumang wala
  rationale: Pinananatili ang tuwirang pagsalungat sa unang sugnay at ang pangkalahatang bisa ng kasabihan.
- source_word: ὃ δοκεῖ ἔχειν
  choice: ang inaakala niyang mayroon siya
  rationale: Maaaring mangahulugan ang δοκέω ng ‘akala’ o ‘tila.’ Ang ‘inaakala’ ay malinaw sa modernong Tagalog, habang inilalagay sa talababa ang tunay na alternatibo.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: ay kukunin sa kanya
  rationale: Malinaw na naghahatid ng pag-aalis o pagkakait na ipinahahayag ng panghinaharap na balintiyak.
- source_word: αὐτῷ / αὐτοῦ
  choice: sa kanya
  rationale: Ang ‘kanya’ ay natural na panghalip sa Tagalog at hindi kailangang magtakda ng kasarian upang katawanin ang pangkalahatang tao.
theological_decisions:
- issue: Diwa ng kasabihan tungkol sa mayroon at wala
  choice: Iniwan ang kasabihan sa agarang konteksto ng paraan ng pakikinig at pagtanggap sa salita ni Jesus, nang hindi nilalagyan ng tiyak na sistemang teolohikal.
  alternative: Basahin ito bilang pangkalahatang simulain tungkol sa espirituwal na pagtanggap o mabuting pangangasiwa.
  rationale: Ang talata ay sadyang paradoksal at hindi tahasang tumutukoy sa materyal na kasaganaan, merito, o predestinasyon; dapat panatilihin ng salin ang tensiyong iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang ‘ninyo/kayo’ ayon sa anyong pandiwa ng Griyego, at ang ‘sa kanya’ bilang natural na pangkalahatang pagtukoy sa tao.
