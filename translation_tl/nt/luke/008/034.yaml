  text: Ἰδόντες δὲ οἱ βόσκοντες τὸ ⸀γεγονὸς ἔφυγον καὶ ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/034.yaml
  text: When the herdsmen saw what had happened[b][a], they fled and reported it in the city and in the countryside.
translation:
  language: tl
  text: Nang makita ng mga tagapag-alaga ng baboy ang nangyari[a], tumakas sila at ibinalita iyon sa lungsod at sa mga bukirin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang naganap.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sa kanayunan”; literal na “sa mga bukirin,” na rito ay maaaring tumukoy sa mga nakapaligid na pook sa labas ng lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδόντες
  choice: Nang makita
  rationale: Ginawang sugnay na temporal ang aorist participle upang maging natural sa Tagalog habang pinananatili ang kaugnayan nito sa mga pangunahing pandiwa.
- source_word: οἱ βόσκοντες
  choice: mga tagapag-alaga ng baboy
  rationale: Tumutukoy ang substantival participle sa mga nag-aalaga ng kawan ng baboy sa konteksto. Nilinaw ang hayop upang maiwasan ang maling pahiwatig na mga tupa ang inaalagaan.
- source_word: τὸ γεγονός
  choice: ang nangyari
  rationale: Natural at maikli itong katumbas ng substantival perfect participle at ipinahihiwatig ang pangyayaring naganap na.
- source_word: ἔφυγον
  choice: tumakas sila
  rationale: Tuwirang inilalarawan ng φεύγω ang mabilis na paglayo dahil sa takot o panganib; mas tapat ito kaysa sa mas neutral na “umalis.”
- source_word: ἀπήγγειλαν
  choice: ibinalita iyon
  rationale: Ipinahahayag ng ἀπαγγέλλω ang pagpaparating ng ulat o balita. Ang “iyon” ay likas na tumutukoy sa pangyayaring nakita nila.
- source_word: εἰς τὴν πόλιν
  choice: sa lungsod
  rationale: Bagaman karaniwang direksiyon ang εἰς, sa pandiwa ng pagbabalita ay natural sa Tagalog ang “sa,” na maaaring tumukoy kapuwa sa patutunguhan at lugar ng pagpapahayag.
- source_word: καὶ εἰς τοὺς ἀγρούς
  choice: at sa mga bukirin
  rationale: Pinananatili ang konkretong kahulugan ng ἀγρούς at ang kaibahan nito sa lungsod; maaaring saklaw nito ang nakapaligid na kanayunan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tagapag-alaga ng baboy” sa halip na “pastol” upang maging tiyak sa konteksto, at pinanatili ang “mga bukirin” sa pangunahing teksto habang ipinaliliwanag sa talababa ang mas malawak na heograpikong diwa.
