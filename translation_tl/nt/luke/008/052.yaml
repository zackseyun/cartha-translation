base_translation:
  language: en
  yaml_path: translation/nt/luke/008/052.yaml
  text: And they were all weeping and mourning for her. But he said[a], “Do not weep, for she has not died, but is sleeping.”
translation:
  language: tl
  text: Umiiyak silang lahat at nagdadalamhati para sa kanya. Ngunit sinabi niya, “Huwag kayong umiyak, sapagkat hindi siya namatay kundi natutulog siya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tulog siya.” Ginamit ni Jesus ang pagtulog bilang paglalarawan sa konteksto ng nalalapit niyang pagpapanumbalik sa bata.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαιον
  choice: Umiiyak
  rationale: Ipinahihiwatig ng imperpekto ang nagpapatuloy na pag-iyak; natural itong naihahayag ng aspektong imperpektibo sa Filipino.
- source_word: πάντες
  choice: silang lahat
  rationale: Malinaw na pinananatili ang saklaw na lahat ng naroon ay umiiyak at nagdadalamhati.
- source_word: ἐκόπτοντο αὐτήν
  choice: nagdadalamhati para sa kanya
  rationale: Sa konteksto ng pagluluksa, tumutukoy ang κόπτομαι sa matinding panaghoy, na maaaring may kasamang paghampas sa dibdib. Inihahatid ng salin ang pangunahing diwa nang hindi labis na tinutukoy ang kilos na pisikal.
- source_word: Μὴ κλαίετε
  choice: Huwag kayong umiyak
  rationale: Natural na pagbabawal sa Filipino at akma sa umiiral nang pag-iyak; hindi kailangang gawing mas interpretibong “Tumigil kayo sa pag-iyak.”
- source_word: οὐ γὰρ
  choice: sapagkat hindi
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ibinibigay para sa utos ni Jesus.
- source_word: ἀπέθανεν
  choice: hindi siya namatay
  rationale: Tuwirang ipinapahayag ang aorist na pangyayari at pinananatili ang tahasang pagtanggi sa sinabi ni Jesus nang hindi ito ginagawang paliwanag tungkol sa pagiging permanenteng patay.
- source_word: καθεύδει
  choice: natutulog lamang siya
  rationale: Pinananatili ang kasalukuyang larawan ng pagtulog. Idinagdag ang “lamang” upang likas na maipahayag sa Filipino ang matinding pagsalungat ng οὐ ... ἀλλά, nang hindi inaalis ang metapora.
theological_decisions:
- issue: Ang pahayag ni Jesus na hindi namatay ang batang babae kundi natutulog
  choice: Panatilihin sa pangunahing teksto ang tuwirang pahayag at ang metapora ng pagtulog.
  alternative: Ipaliwanag na hindi siya permanenteng patay, o sabihing mukha lamang siyang patay ngunit talagang natutulog.
  rationale: Hindi nilulutas ng Griyegong teksto sa mismong pangungusap kung paano eksaktong inuunawa ang kalagayan niya. Pinananatili ng salin ang tensiyong naratibo at teolohikal sa halip na magpasok ng isang paliwanag.
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang “nagdadalamhati” para sa malinaw at dignified na pagluluksa, at ang mga panghalip na “siya/kanya” dahil malinaw sa konteksto ang tinutukoy.
