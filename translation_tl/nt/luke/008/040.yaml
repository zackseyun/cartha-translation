  text: ⸂Ἐν δὲ⸃ τῷ ⸀ὑποστρέφειν τὸν Ἰησοῦν ἀπεδέξατο αὐτὸν ὁ ὄχλος, ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/040.yaml
  text: When Jesus returned[a], the crowd welcomed him[b], for they were all waiting for him.
translation:
  language: tl
  text: Nang bumalik si Jesus, malugod siyang tinanggap ng mga tao, sapagkat hinihintay siya ng lahat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῷ ὑποστρέφειν
  choice: Nang bumalik
  rationale: Ang ἐν na sinusundan ng articular infinitive ay bumubuo rito ng temporal na sugnay. Likas sa modernong Tagalog ang “Nang bumalik”; hindi na kailangang tumbasan nang hiwalay ang δέ dahil sapat na ang daloy ng salaysay.
- source_word: ὑποστρέφειν
  choice: bumalik
  rationale: Karaniwang nangangahulugan ang ὑποστρέφω na bumalik o magbalik. Maikli, natural, at angkop sa konteksto ang “bumalik.”
- source_word: ἀπεδέξατο
  choice: malugod siyang tinanggap
  rationale: Ipinahihiwatig ng ἀποδέχομαι sa kontekstong ito ang positibong pagtanggap. Nililinaw ng “malugod na tinanggap” ang diwang iyon nang hindi nagpapahiwatig ng higit sa teksto.
- source_word: ὁ ὄχλος
  choice: ang mga tao
  rationale: Tumutukoy ang ὄχλος sa nagkakatipong karamihan. Mas natural sa karaniwang modernong Tagalog ang “mga tao” sa salaysay na ito kaysa sa mas mabigat na “karamihan” o “pulutong.”
- source_word: ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν
  choice: sapagkat hinihintay siya nilang lahat
  rationale: Ibinibigay ng γάρ ang dahilan ng pagtanggap, kaya “sapagkat.” Maaaring mangahulugan ang προσδοκάω na maghintay o umasa sa pagdating; ang progresibong “hinihintay” ay angkop sa tagpo at pinananatili ang duratibong diwa ng participle.
- source_word: πάντες
  choice: nilang lahat
  rationale: Hayagang pinananatili ang diin ng πάντες na ang lahat ng kabilang sa karamihan ay naghihintay.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Ginamit ang nakaugaliang anyo ng personal na pangalang ito sa modernong Bibliyang Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinili ang “malugod siyang tinanggap” upang maipahayag ang positibong diwa ng pandiwa, at “mga tao” bilang karaniwang salin sa kontekstong naratibo. Walang talababa dahil walang mahalagang tekstuwal o teolohikal na kalabuan na kailangang ipaliwanag sa talatang ito.
