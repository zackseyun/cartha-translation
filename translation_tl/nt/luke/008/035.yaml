source:
  edition: SBLGNT
  text: ἐξῆλθον δὲ ἰδεῖν τὸ γεγονὸς καὶ ἦλθον πρὸς τὸν Ἰησοῦν, καὶ εὗρον καθήμενον τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ⸀ἐξῆλθεν ἱματισμένον καὶ σωφρονοῦντα παρὰ τοὺς πόδας τοῦ Ἰησοῦ, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/035.yaml
  text: Then they went out to see what had happened[a], and they came to Jesus and found the man from whom the demons had gone out sitting, clothed, and in his right mind at Jesus's feet[b], and they were afraid.
translation:
  language: tl
  text: Lumabas ang mga tao upang tingnan ang nangyari. Lumapit sila kay Jesus at natagpuan nila ang lalaking nilabasan ng mga demonyo[a]. Nakaupo siya sa paanan ni Jesus, nakabihis at nasa wastong pag-iisip. Natakot sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang manuskrito na gumagamit ng pandiwang maramihan, “lumabas ang mga demonyo.” Sa nakalimbag na tekstong Griyego, isahan ang pandiwa kahit maramihan ang simuno; hindi nagbabago ang diwa.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξῆλθον δὲ ἰδεῖν
  choice: Kaya lumabas ang mga tao upang tingnan
  rationale: Ang aorist na ἐξῆλθον ay nagsasalaysay ng paglabas ng mga taong ipinahihiwatig ng konteksto, at ang infinitive na ἰδεῖν ay nagsasaad ng layunin. Nilinaw ang di-tahasang simuno bilang “mga tao” para sa likas na Tagalog.
- source_word: τὸ γεγονός
  choice: ang nangyari
  rationale: Ang substantival perfect participle ay likas at tumpak na naipapahayag sa Tagalog bilang “ang nangyari.”
- source_word: ἦλθον πρὸς τὸν Ἰησοῦν
  choice: Lumapit sila kay Jesus
  rationale: Ang πρός kasunod ng pandiwa ng paggalaw ay nagsasaad ng paglapit patungo sa isang tao; mas natural dito ang “lumapit” kaysa literal na “pumunta.”
- source_word: εὗρον καθήμενον τὸν ἄνθρωπον
  choice: natagpuan nila ang lalaking … Nakaupo siya
  rationale: Hinati ang mahabang Griyegong pangungusap upang maging malinaw at natural sa modernong Tagalog habang pinananatili ang lahat ng detalye.
- source_word: ἀφ’ οὗ τὰ δαιμόνια ἐξῆλθεν
  choice: nilabasan ng mga demonyo
  rationale: Ang “nilabasan” ay maikli at natural na Tagalog para sa lalaking pinanggalingan ng mga demonyo. Nananatili ang personal at sobrenatural na diwa ng δαιμόνια.
- source_word: ἱματισμένον
  choice: may damit na
  rationale: Ipinakikita ng parirala ang malinaw na kaibahan sa dati niyang kahubaran at natural itong maunawaan sa Tagalog.
- source_word: σωφρονοῦντα
  choice: matino na ang pag-iisip
  rationale: Sinasaklaw nito ang pagbabalik ng wastong pag-iisip at pagpipigil sa sarili nang hindi gumagamit ng makabagong klinikal na katawagan.
- source_word: παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: sa paanan ni Jesus
  rationale: Karaniwan at marangal na salin ito ng lokasyong nasa tabi o sa paanan ni Jesus, nang hindi tahasang ipinapasok ang interpretasyong pagiging alagad.
- source_word: ἐφοβήθησαν
  choice: natakot sila
  rationale: Direkta at natural na katumbas ng aorist passive/deponent form sa kontekstong pasalaysay.
theological_decisions:
- issue: Paglalarawan sa δαιμόνια sa salaysay ng pagpapalayas
  choice: mga demonyo
  alternative: masasamang espiritu
  rationale: Ang “mga demonyo” ang tuwirang katumbas at pinananatili ang paglalarawan ng teksto sa tunay at personal na mga espirituwal na nilalang, nang hindi ito ginagawang metapora lamang ng karamdaman.
- issue: Saklaw ng σωφρονοῦντα matapos lumabas ang mga demonyo
  choice: matino na ang pag-iisip
  alternative: nasa wastong katinuan; malinaw na ang isip
  rationale: Ipinahahayag nito ang naibalik na katinuan at pagpipigil sa sarili ngunit hindi nagdaragdag ng tiyak na modernong diagnosis.
- issue: Kakaibang pagtutugma ng bilang sa ἐξῆλθεν at τὰ δαιμόνια
  choice: Isinalin ayon sa malinaw na diwa bilang “nilabasan ng mga demonyo” at minarkahan ng talababa
  alternative: Sundin nang literal ang pandiwang isahan
  rationale: Maramihan ang simuno sa Griyego ngunit isahan ang pandiwa sa nakalimbag na teksto. Hindi natural na maililipat sa Tagalog ang gayong di-pagtutugma, kaya pinanatili ang kahulugan at iniulat ang tekstuwal na usapin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Hinati sa maiikling pangungusap ang mahabang sintaks ng Griyego. Ginamit ang “may damit na” at “matino na ang pag-iisip” bilang likas na mga pahayag na nagpapanatili sa diin ng orihinal sa naibalik na kalagayan ng lalaki.
