  terminology: Ang “mga demonyo,” “sa paanan ni Jesus,” at “nasa wastong pag-iisip” ay angkop, malinaw, at nagpapanatili ng kahulugan ng δαιμόνια, παρὰ τοὺς πόδας, at σωφρονοῦντα nang walang dagdag na doktrinal na pagpapakahulugan.
