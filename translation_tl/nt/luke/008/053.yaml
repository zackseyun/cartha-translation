  source_fidelity: Tumpak na naihahatid ng “At pinagtatawanan nila siya” ang mapanlibak na, di-ganap na kilos ng κατεγέλων at ang layon na αὐτοῦ. Ang “sapagkat alam nilang namatay na siya” ay malinaw na nagpapahayag ng dahilang ibinibigay ng εἰδότες at ng nilalaman ng ὅτι. Ang “namatay na” ay angkop na tumutukoy sa naganap nang pagkamatay, nang hindi binabago ito tungo lamang sa kalagayang ‘patay.’
  naturalness: Natural at malinaw ang pangungusap sa makabagong Filipino Tagalog. Ang “pinagtatawanan nila siya” ay angkop na pagsasalin ng nagpapatuloy o inuulit na panlilibak sa naratibong konteksto. Ang “sapagkat” ay bahagyang marangal ngunit angkop sa rehistrong pampanitikan ng salin.
  terminology: Walang problemang pangalang pantangi o teknikal na terminong teolohikal sa talata. Wastong pinanatili ng “siya” ang di-tahasang pagtukoy sa batang babae, gaya ng Griyego, at hindi nagdaragdag ng pangngalan.
