id: LUK.8.53
reference: Luke 8:53
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ κατεγέλων αὐτοῦ, εἰδότες ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/053.yaml
  text: And they were laughing at him, because they knew that she had died.
translation:
  language: tl
  text: At pinagtatawanan nila siya, sapagkat alam nilang namatay na siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεγέλων
  choice: pinagtatawanan
  rationale: Ipinahahayag ng aspektong di-ganap ng pandiwang Griyego ang nagpapatuloy na mapanuyang pagtawa. Likas sa modernong Tagalog ang “pinagtatawanan” at taglay nito ang diwang paglibak nang hindi pinalalabis bilang tahasang pangungutya.
- source_word: αὐτοῦ
  choice: siya
  rationale: Ang panghalip ang layon ng καταγελάω. Sa Tagalog, likas itong ipinapahayag sa hulma na “pinagtatawanan nila siya.”
- source_word: εἰδότες
  choice: sapagkat alam nila
  rationale: Bagaman participle ang anyong Griyego, nagbibigay ito rito ng dahilan ng kanilang pagtawa. Malinaw at natural na naihahatid ng “sapagkat alam nila” ang ugnayang sanhi.
- source_word: ὅτι
  choice: -ng
  rationale: Ipinakikilala ng ὅτι ang nilalaman ng kanilang nalalaman. Sa “alam nilang,” ang pang-angkop na “-ng” ang natural na Tagalog na katumbas ng ‘na/that’ sa ganitong sugnay.
- source_word: ἀπέθανεν
  choice: namatay na
  rationale: Ipinahahayag ng aorist ang naganap at natapos na pangyayaring pagkamatay. Ang “namatay na” ay nagpapanatili sa kilos o pangyayari, sa halip na ilipat lamang ang diin sa kalagayang “patay na.”
theological_decisions:
- issue: Kung tahasang tatawaging “ang bata” o “ang dalagita” ang namatay kahit walang pangngalan sa sugnay na Griyego
  choice: namatay na siya
  alternative: namatay na ang bata
  rationale: Walang tahasang pangngalan sa sugnay; ang tinutukoy ay malinaw mula sa konteksto. Pinananatili ng “siya” ang pagiging matipid ng orihinal at hindi nagdaragdag ng katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sapagkat” para sa malinaw na ugnayang sanhi, at ang aspektong imperpektibo ng “pinagtatawanan” upang maipakita ang nagpapatuloy na kilos.
