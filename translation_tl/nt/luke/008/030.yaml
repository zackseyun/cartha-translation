base_translation:
  language: en
  yaml_path: translation/nt/luke/008/030.yaml
  text: Then Jesus asked him[a], “What is your name?” And he said[b], “Legion,” because many demons had entered into him.
translation:
  language: tl
  text: At tinanong siya ni Jesus, “Ano ang pangalan mo?” Sumagot siya, “Lehiyon,”[a] sapagkat maraming demonyo ang pumasok sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Lehiyon” ay hiram na salita mula sa Latin na tumutukoy sa isang malaking yunit ng hukbong Romano. Dito, ipinahihiwatig nito na maraming demonyo ang nasa lalaki.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: Tinanong
  rationale: Karaniwang salitang Filipino ito para sa tuwirang pagtatanong at angkop sa payak na daloy ng salaysay.
- source_word: Τί σοι ὄνομά ἐστιν
  choice: Ano ang pangalan mo?
  rationale: Likas na paraan ito ng pagtatanong sa Filipino at tumpak na naghahatid sa diwa ng idyomatikong pariralang Griyego.
- source_word: Λεγιών
  choice: Lehiyon
  rationale: Ginamit ang nakasanayang anyong Filipino ng hiram na salitang tumutukoy sa malaking yunit ng hukbong Romano, habang pinananatili itong sagot na parang pangalan.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw nitong ipinakikita na ang pagpasok ng maraming demonyo ang dahilan kung bakit 'Lehiyon' ang ibinigay na pangalan.
- source_word: εἰσῆλθεν
  choice: pumasok
  rationale: Pinananatili nito ang diwa ng pagkilos papasok. Hindi kailangang tahasang markahan sa Filipino ang past perfect; malinaw sa sugnay na paliwanag na nauna na ang pagpasok.
- source_word: δαιμόνια πολλὰ
  choice: maraming demonyo
  rationale: Tuwiran nitong isinasalin kapwa ang uri ng mga espirituwal na nilalang at ang diin sa kanilang dami.
- source_word: εἰς αὐτόν
  choice: sa kanya
  rationale: Sa pandiwang 'pumasok,' likas sa modernong Filipino ang 'sa kanya' at naihahatid nito ang direksiyong ipinahahayag ng εἰς.
theological_decisions:
- issue: Kung sino ang sumagot sa ὁ δὲ εἶπεν
  choice: Sumagot siya
  alternative: Sumagot ang lalaki / Sumagot ang demonyo
  rationale: Hindi tahasang pinapangalanan ng Griyego ang nagsasalita. Pinananatili ng panghalip ang tunay na kalabuan sa halip na ipasiya kung ang lalaki o ang mga demonyo ang tuwirang sumagot.
- issue: Paglalarawan sa δαιμόνια
  choice: mga demonyo
  alternative: masasamang espiritu
  rationale: Ang 'mga demonyo' ang tuwiran at tiyak na katumbas at hindi nito pinahihina ang pahayag ng teksto tungkol sa mga espirituwal na nilalang.
- issue: Ugnayang temporal ng εἰσῆλθεν sa sagot na 'Lehiyon'
  choice: pumasok
  alternative: nakapasok na
  rationale: Hindi karaniwang nangangailangan ang Filipino ng hiwalay na anyong past perfect. Sapat na ipinakikita ng konteksto at ng 'sapagkat' na ang pagpasok ay batayan ng naibigay na pangalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na ayos ng salaysay at iniwasang tukuyin nang higit sa Griyego kung sino mismo ang sumagot.
