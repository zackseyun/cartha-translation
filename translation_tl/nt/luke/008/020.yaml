id: LUK.8.20
reference: Luke 8:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂ἀπηγγέλη δὲ⸃ ⸀αὐτῷ· Ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἑστήκασιν ἔξω ἰδεῖν ⸂σε θέλοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/020.yaml
  text: And it was reported to him[a], “Your mother and your brothers are standing outside, wanting to see you.”
translation:
  language: tl
  text: At ipinaalam sa kanya, “Nakatayo sa labas ang iyong ina at mga kapatid na lalaki[a] at nais ka nilang makita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kamag-anak,” kung mas malawak ang gamit dito ng salitang Griyego; karaniwang nangangahulugang “mga kapatid na lalaki” ang salita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπηγγέλη
  choice: ipinaalam
  rationale: Likas na ipinahahayag sa Filipino ang aorist passive bilang isang ulat na ipinarating sa kanya, habang pinananatili ang di-tiyak na tagapaghatid ng balita.
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay; natural at hindi mabigat ang “At” sa Filipino.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Tahasang pinananatili ang di-tuwirang layon ng pag-uulat.
- source_word: μήτηρ
  choice: ina
  rationale: Karaniwan, marangal, at angkop sa estilong pasalaysay.
- source_word: ἀδελφοί
  choice: mga kapatid na lalaki
  rationale: Tiyak na ipinakikita ang panlalaking anyong maramihan ng Griyego nang hindi nagpapasok ng doktrinal na paliwanag tungkol sa eksaktong ugnayan nila kay Jesus.
- source_word: ἑστήκασιν
  choice: nakatayo
  rationale: Ipinahahayag ang kasalukuyang kalagayang bunga ng perfect form ng ἵστημι.
- source_word: ἔξω
  choice: sa labas
  rationale: Direktang salin ng panlaping panlunan nang hindi nagdaragdag ng gusali o tiyak na lugar na wala sa teksto.
- source_word: ἰδεῖν
  choice: makita
  rationale: Pinananatili ang payak na diwa ng ὁράω sa halip na palawakin ito bilang “makipagkita” o “makausap.”
- source_word: θέλοντες
  choice: nais
  rationale: Natural at marangal na Filipino para sa kasabay na hangarin ng ina at mga kapatid.
theological_decisions:
- issue: Ang tinutukoy ng ἀδελφοί kaugnay ng pamilya ni Jesus
  choice: mga kapatid na lalaki
  alternative: mga kamag-anak
  rationale: Karaniwang nangangahulugang “mga kapatid na lalaki” ang ἀδελφοί. Hindi nilulutas ng salin ang mas malawak na pagtatalo tungkol sa eksaktong ugnayan nila kay Jesus; inilalagay sa talababa ang mas malawak na posibleng pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ina” at “nais” upang mapanatili ang dignidad ng salaysay, at iniwasang magdagdag ng lugar, layunin, o doktrinal na pagpapakahulugan na hindi tahasang nasa Griyego.
