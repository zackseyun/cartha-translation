  naturalness: May bahagyang di-likas na paghihiwalay sa “Nangyari, sa isa sa mga araw na iyon, na ...” Dahil sa mga kuwit, mabigat at putul-putol ang karaniwang Lukanong panimulang pormula sa modernong Tagalog. Mas natural ang “Noong isa sa mga araw na iyon” nang hindi nawawala ang di-tiyak na saklaw ng panahon.
  terminology: Ang “mga alagad,” “bangka,” “lawa,” at “kabilang panig” ay wasto, malinaw, at naaayon sa marangal na modernong Tagalog. Mas angkop ang “patungo” kaysa sa mas kolokyal na “papunta” sa pangunahing teksto. Ang alternatibong “kabilang ibayo” ay hindi pangkaraniwan sa modernong Tagalog; mas malinaw ang “kabilang dako.”
