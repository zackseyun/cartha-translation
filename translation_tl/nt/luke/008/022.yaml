  text: It happened on one of those days that he got into a boat[a], and his disciples with him, and he said to them[b], “Let us go across to the other side of the lake.” And they set out.
translation:
  language: tl
  text: Noong isa sa mga araw na iyon, sumakay siya sa isang bangka kasama ang kanyang mga alagad. Sinabi niya sa kanila, “Tumawid tayo patungo sa kabilang panig ng lawa.”[a] At naglayag sila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tumawid tayo patungo sa kabilang dako ng lawa.”
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang Griyego ay maaari ring isaling “pumalaot sila” o “nagsimula silang maglayag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Nangyari
  rationale: Pinananatili ang karaniwang panimulang pormula ni Lucas nang hindi gumagamit ng makaluma o mabigat na pananalita. Hindi na hiwalay na isinalin ang mahinang pang-ugnay na δέ.
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: sa isa sa mga araw na iyon
  rationale: Pinananatili ang di-tiyak ngunit nakapaloob-sa-kilalang-panahon na diwa ng parirala.
- source_word: ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ
  choice: sumakay siya sa isang bangka kasama ang kanyang mga alagad
  rationale: Natural sa modernong Tagalog at malinaw na pati ang mga alagad ay sumakay sa bangka, gaya ng ipinahihiwatig ng koordinasyon sa Griyego.
- source_word: Διέλθωμεν
  choice: Tumawid tayo
  rationale: Ang unang panauhang maramihang pasakali ay ginagamit bilang mungkahi o paanyaya; natural itong ipinahahayag sa Tagalog sa anyong “tayo.”
- source_word: εἰς τὸ πέραν τῆς λίμνης
  choice: papunta sa kabilang panig ng lawa
  rationale: Pinananatili ang patutunguhan at ang diwang “kabilang ibayo/panig,” habang tumpak na isinasalin ang λίμνη bilang “lawa.”
- source_word: ἀνήχθησαν
  choice: naglayag sila
  rationale: Ipinahahayag ang pandiwang pandagat na nangangahulugang umalis o magsimulang maglayag, nang hindi tinatawag na dagat ang lawa.
