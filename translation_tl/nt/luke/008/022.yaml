- from: Nangyari, sa isa sa mga araw na iyon, na sumakay siya sa isang bangka kasama ang kanyang mga alagad. Sinabi niya sa kanila, “Tumawid tayo papunta sa kabilang panig ng lawa.”[a] At naglayag sila.[b]
  to: Noong isa sa mga araw na iyon, sumakay siya sa isang bangka kasama ang kanyang mga alagad. Sinabi niya sa kanila, “Tumawid tayo patungo sa kabilang panig ng lawa.”[a] At naglayag sila.[b]
  rationale: Pinagaan ang pambungad upang maging likas sa modernong Tagalog, at pinalitan ang mas di-karaniwang “ibayo” sa talababa. Pinanatili ang lahat ng pangunahing kahulugan, ang hortatoryong “tayo,” ang pagkakaiba ng lawa at dagat, at ang mga anchor ng talababa.
