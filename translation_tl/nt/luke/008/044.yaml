  text: προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ, καὶ παραχρῆμα ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/044.yaml
  text: Coming up behind him[a], she touched the fringe of his garment, and immediately her flow of blood stopped.
translation:
  language: tl
  text: Lumapit siya mula sa likuran ni Jesus at hinipo ang laylayan[a] ng damit ni Jesus. Agad na tumigil ang pag-agos ng kanyang dugo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gilid” o “palawit.”
    reason: Pinananatili ang saklaw ng kahulugan ng κράσπεδον, na maaaring tumukoy sa laylayan, gilid, o palawit ng damit.
lexical_decisions:
- source_word: προσελθοῦσα ὄπισθεν
  choice: Lumapit siya sa likuran ni Jesus
  rationale: Ipinapahayag ang paglapit ng babae mula sa likuran bago niya hinipo ang damit. Ginawang tahasan ang ipinahihiwatig na tinutukoy ng ὄπισθεν upang maging likas at malinaw sa Tagalog.
- source_word: ἥψατο
  choice: hinipo
  rationale: Karaniwang kahulugan ng pandiwa sa konstruksiyong ito ang paghipo; hindi nito ipinapalagay na mahigpit niyang hinawakan ang damit.
- source_word: τοῦ κρασπέδου
  choice: ang laylayan
  rationale: Ang κράσπεδον ay maaaring tumukoy sa gilid, laylayan, o palawit ng damit. Ang “laylayan” ay natural at sapat na malawak, samantalang pinananatili sa talababa ang ibang posibleng kahulugan.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: ng damit nito
  rationale: Ang ἱμάτιον ay pangkalahatang tawag sa kasuutan o panlabas na damit. Iniiwasan ng “damit” ang labis na pagtukoy sa isang tiyak na uri ng kasuutan; ang “nito” ay malinaw na tumutukoy kay Jesus.
- source_word: παραχρῆμα
  choice: Agad
  rationale: Pinananatili ang biglaan at kaagad na epekto na ipinahahayag ng pang-abay.
- source_word: ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς
  choice: tumigil ang pag-agos ng kanyang dugo
  rationale: Malapit ito sa anyo at diwa ng Griyego habang likas sa modernong Tagalog; inilalarawan nito ang paghinto ng patuloy na pagdurugo.
theological_decisions:
- issue: Posibleng pahiwatig ng kasuotang Judio sa κράσπεδον
  choice: laylayan sa pangunahing teksto
  alternative: gilid o palawit
  rationale: Maaaring pangkalahatang tumukoy ang salita sa gilid ng damit o, nang mas tiyak, sa palawit na kaugnay ng kasuotang Judio. Hindi sapilitang tinutukoy ng talata ang palawit na iniutos sa Torah, kaya hindi iyon ginawang tiyak sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, maikli, at marangal. Ginamit ang “ni Jesus” at “nito” upang maiwasan ang kalituhan sa sunod-sunod na panghalip, bagaman ipinahihiwatig lamang sa Griyego ang tinutukoy na lalaki.
