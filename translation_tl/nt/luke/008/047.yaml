id: LUK.8.47
reference: Luke 8:47
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ ἡ γυνὴ ὅτι οὐκ ἔλαθεν τρέμουσα ἦλθεν καὶ προσπεσοῦσα αὐτῷ δι’ ἣν αἰτίαν ἥψατο αὐτοῦ ⸀ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ καὶ ὡς ἰάθη παραχρῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/047.yaml
  text: And when the woman saw that she had not escaped notice[a], she came trembling, and falling down before him[b], declared before all the people why she had touched him and how she had been healed immediately.
translation:
  language: tl
  text: Nang makita ng babae na hindi nalingid ang ginawa niya[a], nanginginig siyang lumapit at nagpatirapa sa harap ni Jesus[b]. Sa harap ng lahat ng tao, sinabi niya kung bakit niya hinipo si Jesus at kung paanong gumaling siya kaagad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi nakalampas sa pansin ang ginawa niya” o “hindi nanatiling lihim ang ginawa niya.”
    reason: lexical_alternative
  - marker: b
    text: O “lumagpak sa harap niya.” Hindi tahasang binabanggit sa Griyego ang mga paa ni Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: Nang makita
  rationale: Ginawang sugnay na panahunan ang aorist participle upang maging natural sa Tagalog habang pinananatili ang pagkakasunod ng pangyayari.
- source_word: οὐκ ἔλαθεν
  choice: hindi nalingid ang ginawa niya
  rationale: Ipinahahayag ng λανθάνω na hindi nanatiling lihim o hindi nakalampas sa pansin ang ginawa ng babae. Nilinaw ng 'ang ginawa niya' ang likas na ipinahihiwatig na paksa nang hindi tinutukoy kung kaninong pansin ito hindi nakalampas.
- source_word: τρέμουσα ἦλθεν
  choice: nanginginig siyang lumapit
  rationale: Pinananatili ng 'nanginginig' ang pisikal at emosyonal na larawan, at natural na isinasalin ng 'lumapit' ang pagpunta niya kay Jesus sa konteksto.
- source_word: προσπεσοῦσα αὐτῷ
  choice: nagpatirapa sa harap ni Jesus
  rationale: Ang προσπίπτω ay paglapag o pagpapatirapa sa harap ng isang tao. Hindi idinagdag ang 'sa paanan' sapagkat hindi iyon tahasang nasa Griyego.
- source_word: δι’ ἣν αἰτίαν
  choice: kung bakit
  rationale: Natural at tuwirang katumbas sa modernong Tagalog ng pariralang nagsasaad ng dahilan.
- source_word: ἥψατο αὐτοῦ
  choice: niya hinipo si Jesus
  rationale: Ang ἅπτομαι na may genitive ay nangangahulugang humipo. Inulit ang pangalang Jesus upang maiwasan ang malabong reperensiya ng panghalip sa Tagalog.
- source_word: ἀπήγγειλεν
  choice: sinabi niya
  rationale: Malinaw at natural na katumbas ng pampublikong pag-uulat; ang pampublikong katangian ay sapat nang ipinakikita ng kasunod na parirala.
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: Sa harap ng buong bayan
  rationale: Malapit sa anyo at diwa ng Griyego. Ang 'bayan' ay tumutukoy sa lahat ng taong naroon, hindi sa isang heograpikong lugar.
- source_word: ὡς ἰάθη
  choice: kung paanong gumaling siya
  rationale: Pinananatili ang ὡς bilang paglalahad kung paano naganap ang paggaling, nang hindi nililimitahan ito sa simpleng pahayag lamang na gumaling siya.
- source_word: παραχρῆμα
  choice: kaagad
  rationale: Karaniwang modernong Tagalog para sa dagliang pangyayari at pinananatili ang diin ni Lucas sa biglang paggaling.
theological_decisions:
- issue: Kalikasan ng pampublikong pahayag at pagpapatirapa ng babae
  choice: 'Isinalin ang kilos at pahayag bilang salaysay lamang: nagpatirapa siya at sinabi ang dahilan at paggaling.'
  alternative: Tahasang sabihing nagsisi, sumamba, o nagpahayag siya ng pananampalataya.
  rationale: Maaaring magpahiwatig ng pagsusumamo o paggalang ang postura, ngunit hindi tahasang sinasabi ng Griyego na ito ay pagsisisi o pagsamba. Hindi dapat dagdagan ng salin ang teolohikong pagpapakahulugang wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'Jesus' sa dalawang lugar sa halip na sunod-sunod na malabong 'niya/kaniya.' Ang 'buong bayan' ay bibliyang pamilyar ngunit nauunawaang tumutukoy sa lahat ng taong naroon. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto.
