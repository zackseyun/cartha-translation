id: LUK.8.55
reference: Luke 8:55
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐπέστρεψεν τὸ πνεῦμα αὐτῆς, καὶ ἀνέστη παραχρῆμα, καὶ διέταξεν αὐτῇ δοθῆναι φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/055.yaml
  text: And her spirit returned[a], and she rose immediately[b], and he directed that food be given to her.
translation:
  language: tl
  text: At nagbalik ang kanyang espiritu[a], at agad siyang bumangon. At iniutos niyang bigyan siya ng makakain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagbalik ang kanyang hininga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: nagbalik
  rationale: Likas na katumbas ito ng kilos na pagbabalik at malinaw na tumutukoy sa muling pagdating ng espiritu o hininga ng bata.
- source_word: τὸ πνεῦμα αὐτῆς
  choice: ang kanyang espiritu
  rationale: Pinananatili ng “espiritu” ang mas malawak na kahulugan at teolohikal na bigat ng πνεῦμα sa salaysay ng muling pagkabuhay; posible rin ang “hininga,” kaya inilagay iyon sa talababa.
- source_word: ἀνέστη
  choice: bumangon siya
  rationale: Ang “bumangon” ay natural at kasalukuyang Filipino para sa pisikal na pagbangon na inilalarawan ng ἀνίστημι.
- source_word: παραχρῆμα
  choice: agad
  rationale: Tumpak at likas na ipinahahayag ng “agad” ang dagliang pangyayari.
- source_word: διέταξεν
  choice: iniutos niya
  rationale: Ipinakikita ng “iniutos” ang awtoritatibong tagubilin ng διατάσσω nang hindi pinahihina ang lakas ng pandiwa.
- source_word: αὐτῇ δοθῆναι φαγεῖν
  choice: bigyan siya ng makakain
  rationale: Natural na idyomang Filipino ito na tahasang pinananatili kapwa ang pagbibigay at ang layuning kumain.
theological_decisions:
- issue: Kahulugan ng πνεῦμα sa konteksto ng pagbabalik sa buhay
  choice: nagbalik ang kanyang espiritu
  alternative: nagbalik ang kanyang hininga
  rationale: Ang “espiritu” ang higit na nagpapanatili sa saklaw ng salitang Griyego at sa pahiwatig ng salaysay na nanumbalik ang buhay, ngunit hindi itinatanggi ang leksikal na posibilidad na “hininga.”
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Pinanatili ang magkakasunod na sugnay ng Griyego sa pamamagitan ng “At,” ngunit gumamit ng natural na ayos na “agad siyang bumangon.” Ang panghalip na “niya” ay hindi pinalitan ng pangalang Jesus upang manatiling malapit sa di-tahasang simuno ng Griyego.
