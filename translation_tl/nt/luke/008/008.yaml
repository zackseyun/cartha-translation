id: LUK.8.8
reference: Luke 8:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἕτερον ἔπεσεν εἰς τὴν γῆν τὴν ἀγαθήν, καὶ φυὲν ἐποίησεν καρπὸν ἑκατονταπλασίονα. ταῦτα λέγων ἐφώνει· Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/008.yaml
  text: And another fell into the good soil[a], and when it grew, it produced fruit a hundredfold. As he said these things, he called out, “He who has ears to hear[c][b], let him hear.”
translation:
  language: tl
  text: At may isa pang binhi na nahulog sa mabuting lupa[a], at matapos itong tumubo, nagbunga ito nang isandaang ulit[b]. Habang sinasabi niya ang mga ito, malakas siyang tumawag, “Ang may mga tainga upang makinig ay makinig.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matabang lupa.”
    reason: lexical_alternative
  - marker: b
    text: O “nagbigay ito ng bunga nang isandaang ulit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: ang isa pa
  rationale: Tumutukoy sa isa pang binhi sa sunod-sunod na kinalabasan sa talinghaga.
- source_word: γῆν τὴν ἀγαθήν
  choice: matabang lupa
  rationale: Sa kontekstong pansakahan, natural na ipinahahayag ng “matabang lupa” ang lupang mainam pagtamnan; maaari ring literal na “mabuting lupa.”
- source_word: φυὲν
  choice: nang tumubo ito
  rationale: Pinananatili ang pagkakasunod ng pagtubo bago ang pamumunga sa natural na Tagalog.
- source_word: ἐποίησεν καρπὸν
  choice: namunga ito
  rationale: Karaniwang ekspresyong Tagalog para sa paglalabas o pagbibigay ng bunga ng halaman.
- source_word: ἑκατονταπλασίονα
  choice: nang sandaang ulit
  rationale: Ipinahahayag ang ani bilang isang daang ulit ng naihasik, nang hindi binabawasan ang pambihirang kasaganaan.
- source_word: ταῦτα λέγων
  choice: Habang sinasabi niya ang mga ito
  rationale: Ipinakikita ang kasabay na kilos ng pagsasalita at mariing pagsambit.
- source_word: ἐφώνει
  choice: malakas niyang sinabi
  rationale: Ipinahahayag ang mariin at dinig-sa-lahat na pagsasalita nang hindi ipinapalagay na galit ang tono.
- source_word: Ὁ ἔχων ὦτα ἀκούειν
  choice: Ang may mga tainga upang makinig
  rationale: Pinananatili ang anyong panlahat at ang pariralang layunin na “upang makinig,” nang hindi nilalagyan ng kasariang wala sa tinutukoy.
- source_word: ἀκουέτω
  choice: ay makinig
  rationale: Natural at maringal na Tagalog para sa pangatlong-panauhang pautos; higit ito sa pisikal na pagdinig at nananawagan ng maingat na pakikinig.
theological_decisions:
- issue: Panlahat na tinutukoy sa pangaral ni Jesus
  choice: “Ang may mga tainga upang makinig ay makinig”
  alternative: “Sinumang may taingang pandinig ay makinig”
  rationale: Pinananatili ang isahang kinatawang diwa ng Griyego nang hindi nagdaragdag ng panlalaking pagtukoy, at iniiwan ang bukas na tensiyon sa pagitan ng pisikal na pandinig at mapag-unawang pakikinig.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matabang lupa” bilang likas na terminong pansakahan, “namunga” bilang payak na pandiwa, at “malakas niyang sinabi” upang maipakita ang diin ng ἐφώνει. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
