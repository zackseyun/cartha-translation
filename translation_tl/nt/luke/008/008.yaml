revisions:
- from: At ang isa pa ay nahulog sa matabang lupa[a]; nang tumubo ito, namunga ito nang sandaang ulit[b]. Habang sinasabi niya ang mga ito, malakas niyang sinabi, “Ang may mga tainga upang makinig ay makinig.”
  to: At may isa pang binhi na nahulog sa mabuting lupa[a], at matapos itong tumubo, nagbunga ito nang isandaang ulit[b]. Habang sinasabi niya ang mga ito, malakas siyang tumawag, “Ang may mga tainga upang makinig ay makinig.”
  rationale: Inayos ang salin upang mas malinaw na maipakita ang pagkakasunod ng pagtubo at pamumunga, ang malakas at mariing pagsasalita ni Jesus, at ang mas malawak na saklaw ng “mabuting” lupa sa Griyego. Pinanatili ang panlahat at marangal na anyo ng pangwakas na panawagan at ang mga talababa ay nananatiling wastong nakaangkla sa teksto.
