  text: καὶ ἐξέστησαν οἱ γονεῖς αὐτῆς· ὁ δὲ παρήγγειλεν αὐτοῖς μηδενὶ εἰπεῖν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/056.yaml
  text: And her parents were astonished[c][b][a], but he instructed them to tell no one what had happened.
translation:
  language: tl
  text: At labis na namangha ang kanyang mga magulang,[a] ngunit mahigpit niya silang pinagbilinan[b] na huwag nilang sabihin kaninuman ang nangyari.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “natigilan sa matinding pagkamangha” o “halos wala sa sarili sa pagkamangha.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “inutusan niya sila” o “mahigpit niyang ipinag-utos sa kanila.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “ang bagay na nangyari” o “ang pangyayari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: labis na namangha
  rationale: Ipinahihiwatig ng pandiwa ang matinding pagkamangha o pagkabigla. Ang “labis na namangha” ay natural sa makabagong Tagalog at pinananatili ang tindi nang hindi gumagamit ng malabong idyoma.
- source_word: γονεῖς
  choice: mga magulang
  rationale: Ito ang tuwiran at karaniwang katumbas ng pangmaramihang salitang tumutukoy sa ama at ina.
- source_word: παρήγγειλεν
  choice: mahigpit niyang sinabi
  rationale: Ang pandiwa ay may puwersa ng utos o mariing tagubilin. Natural sa salaysay ang “mahigpit na sinabi” at hindi nito pinahihina ang pagiging direktiba.
- source_word: μηδενὶ
  choice: kaninuman
  rationale: Kasama ng pagbabawal na μή, malinaw nitong ipinahahayag na walang sinumang dapat sabihan.
- source_word: εἰπεῖν
  choice: sabihin
  rationale: Sa konstruksyong may taong tatanggap ng pahayag, ang “sabihin kaninuman” ay malinaw at likas na Tagalog.
- source_word: τὸ γεγονός
  choice: ang nangyari
  rationale: Ang substantibong gamit ng perpektong partisipo ay tumutukoy sa naganap na pangyayari. Ang “ang nangyari” ay maikli, natural, at tumpak.
- source_word: δὲ
  choice: ngunit
  rationale: Ipinakikita nito ang banayad na pagsalungat sa pagitan ng pagkamangha ng mga magulang at ng sumunod na utos ni Jesus.
theological_decisions:
- issue: Saklaw at layunin ng utos na manahimik
  choice: Isinalin nang tuwiran bilang pagbabawal na sabihin kaninuman ang nangyari.
  alternative: Ipaliwanag ito bilang bahagi ng tinatawag na mesiyanikong paglilihim o bilang pansamantala at limitadong utos.
  rationale: Hindi sinasabi ng talata ang dahilan o tagal ng utos. Pinananatili ng salin ang teolohikal na tensiyon nang hindi nagdaragdag ng interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “labis na namangha” upang maipakita ang tindi ng ἐξέστησαν, at “mahigpit niyang sinabi” upang mapanatili ang puwersa ng παρήγγειλεν nang hindi maging di-likas ang pangungusap.
