id: LUK.8.45
reference: Luke 8:45
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Τίς ὁ ἁψάμενός μου; ἀρνουμένων δὲ πάντων εἶπεν ὁ ⸀Πέτρος· Ἐπιστάτα, οἱ ὄχλοι συνέχουσίν σε καὶ ⸀ἀποθλίβουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/045.yaml
  text: And Jesus said[a], “Who is the one who touched me?” And while everyone was denying it, Peter said, “Master, the crowds are hemming you in and pressing against you.”
translation:
  language: tl
  text: At sinabi ni Jesus, “Sino ang humipo sa akin?” Habang itinatanggi ito ng lahat, sinabi ni Pedro, “Guro, siksik na nakapaligid sa iyo ang mga tao at dinidiinan ka nila.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁψάμενός
  choice: humipo
  rationale: Tumutukoy ang gitnang anyo ng ἅπτω sa pisikal na paghipo; natural at malinaw sa konteksto ang “humipo.”
- source_word: ἀρνουμένων δὲ πάντων
  choice: Habang itinatanggi iyon ng lahat
  rationale: Pinananatili ng “habang” ang nagpapatuloy na kilos ng pangkasalukuyang participle, at ang “iyon” ay likas na tumutukoy sa ipinahihiwatig na paghipo.
- source_word: Ἐπιστάτα
  choice: Guro
  rationale: Isang magalang na pantawag kay Jesus na kumikilala sa kaniyang awtoridad. Ang “Guro” ay natural sa modernong Tagalog at hindi nagdaragdag ng mas matinding titulong gaya ng “Panginoon.”
- source_word: οἱ ὄχλοι
  choice: mga tao
  rationale: Bagaman maramihan ang anyong Griego, mas natural sa Tagalog ang “mga tao” para sa maraming taong nakapaligid kay Jesus kaysa sa “mga karamihan.”
- source_word: συνέχουσίν σε
  choice: sinisiksik ka
  rationale: Ipinahihiwatig ng συνέχω na napaliligiran at naiipit si Jesus; malinaw at idyomatiko ang “sinisiksik ka” sa Tagalog.
- source_word: ἀποθλίβουσιν
  choice: dinadaganan
  rationale: Ipinahihiwatig ng pandiwa ang matinding pagdiin ng mga taong nakapaligid. Naiiba ng “dinadaganan” ang ikalawang kilos sa “sinisiksik” nang hindi ito pinahihina.
theological_decisions:
- issue: Pagsasalin sa pantawag na Ἐπιστάτα
  choice: Guro
  alternative: Panginoon; Pinuno
  rationale: Hindi κύριος ang ginamit sa talata. Pinananatili ng “Guro” ang magalang na pagkilala sa awtoridad ni Jesus nang hindi nag-aangkat ng mas tahasang kristolohikal na titulo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang nagpapatuloy na kilos sa pagtanggi at ang dalawang magkaugnay ngunit magkaibang larawan ng pagsisiksikan at pagdiin ng mga tao.
