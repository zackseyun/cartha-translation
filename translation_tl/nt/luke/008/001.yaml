  to: At hindi nagtagal, patuloy na naglalakbay si Jesus sa sunod-sunod na mga lungsod at nayon,[a] na nangangaral at nagbabalita ng mabuting balita tungkol sa kaharian ng Diyos.[b] Kasama niya ang Labindalawa.
