id: LUK.8.1
reference: Luke 8:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ καθεξῆς καὶ αὐτὸς διώδευεν κατὰ πόλιν καὶ κώμην κηρύσσων καὶ εὐαγγελιζόμενος τὴν βασιλείαν τοῦ θεοῦ, καὶ οἱ δώδεκα σὺν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/001.yaml
  text: And it happened soon afterward that he was traveling through city after city and village after village[a], proclaiming and bringing the good news of the kingdom of God[c][b], and the Twelve were with him.
translation:
  language: tl
  text: At hindi nagtagal, patuloy na naglalakbay si Jesus sa sunod-sunod na mga lungsod at nayon,[a] na nangangaral at nagbabalita ng mabuting balita tungkol sa kaharian ng Diyos.[b] Kasama niya ang Labindalawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa isang lungsod at nayon patungo sa iba.”
    reason: lexical_alternative
  - marker: b
    text: O “paghahari ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ καθεξῆς
  choice: Hindi nagtagal
  rationale: Likas na panandang temporal sa modernong Tagalog para sa kasunod na pangyayari; iniiwasan ang mabigat at di-likas na literal na “at nangyari pagkatapos nito” habang pinananatili ang pagkakasunod ng salaysay.
- source_word: αὐτὸς
  choice: si Jesus
  rationale: Bagaman panghalip ang Griyego, malinaw na tinutukoy nito si Jesus mula sa konteksto; ang tahasang pangalan ay natural sa Tagalog at umiiwas sa malabong “siya” sa simula ng talata.
- source_word: διώδευεν
  choice: naglakbay
  rationale: Ipinahihiwatig ng imperfect ang nagpapatuloy o paulit-ulit na paglalakbay sa iba’t ibang lugar; nababasa ang aspektong ito kasama ng “sa sunod-sunod na.”
- source_word: κατὰ πόλιν καὶ κώμην
  choice: sa sunod-sunod na mga lungsod at nayon
  rationale: Ipinapakita ang distributibong puwersa ng κατά—pagdaan sa iba’t ibang lungsod at nayon—nang hindi inaangking bawat isa ay napuntahan.
- source_word: κηρύσσων
  choice: ipinahahayag
  rationale: Pinananatili ang diwa ng pampublikong pagpapahayag at hindi ito nililimitahan sa pormal na pangangaral.
- source_word: εὐαγγελιζόμενος
  choice: ibinabalita ang magandang balita
  rationale: Ibinubukod sa κηρύσσων at malinaw na pinananatili ang kahulugan ng pagpapahayag ng mabuting balita.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: tungkol sa kaharian ng Diyos
  rationale: Ang “kaharian ng Diyos” ang malawak at kinikilalang salin na maaaring tumukoy kapwa sa paghahari at sa nasasakupan, nang hindi nilulutas nang makitid ang saklaw ng βασιλεία.
- source_word: οἱ δώδεκα
  choice: ang Labindalawa
  rationale: Pinananatili ang katawagan sa kinikilalang pangkat at hindi idinaragdag ang “alagad” o “apostol,” na wala rito sa teksto.
- source_word: σὺν αὐτῷ
  choice: Kasama niya
  rationale: Natural at tuwirang Tagalog para sa pagsama kay Jesus; ang pandiwang panaguri ay likas nang nauunawaan.
theological_decisions:
- issue: Saklaw ng βασιλεία τοῦ θεοῦ
  choice: kaharian ng Diyos
  alternative: paghahari ng Diyos
  rationale: Maaaring idiin ng βασιλεία ang aktibong paghahari o ang kaharian bilang kabuuang realidad. Pinananatili ng “kaharian” ang mas malawak na teolohikal na saklaw, habang inilalahad sa talababa ang mahalagang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “magandang balita” bilang malinaw at kasalukuyang katumbas ng εὐαγγελιζόμενος. Hiniwalay sa dalawang pangungusap ang huling sugnay upang maging natural ang daloy nang hindi binabago ang ugnayan ng mga ideya.
