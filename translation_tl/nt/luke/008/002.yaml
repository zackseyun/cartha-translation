  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ γυναῖκές τινες αἳ ἦσαν τεθεραπευμέναι ἀπὸ πνευμάτων πονηρῶν καὶ ἀσθενειῶν, Μαρία ἡ καλουμένη Μαγδαληνή, ἀφ’ ἧς δαιμόνια ἑπτὰ ἐξεληλύθει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/002.yaml
  text: 'and some women who had been healed from evil spirits and sicknesses: Mary[a], called Magdalene, from whom seven demons had gone out[b],'
translation:
  language: tl
  text: 'at ilang babaeng napagaling na mula sa masasamang espiritu at mga karamdaman: si Maria, na tinatawag na Magdalena, na nilabasan na siya ng pitong demonyo,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυναῖκές τινες
  choice: ilang babae
  rationale: Ipinahihiwatig ng τινες ang isang di-tiyak na bahagi ng mas malaking pangkat. Ang “ilang babae” ang likas at malinaw na katumbas sa makabagong Tagalog.
- source_word: ἦσαν τεθεραπευμέναι
  choice: pinagaling na
  rationale: Ang periphrastic na anyong pluperfect ay tumutukoy sa pagpapagaling na naganap na bago ang tagpong isinasalaysay, kaya ginamit ang “na” upang ipakita ang naunang natapos na pangyayari.
- source_word: ἀπὸ πνευμάτων πονηρῶν
  choice: mula sa masasamang espiritu
  rationale: Tuwirang pinananatili nito ang kahulugan ng πονηρῶν bilang “masasama,” nang hindi ito pinapalitan ng “maruruming,” na katumbas ng ibang salitang Griyego.
- source_word: καὶ ἀσθενειῶν
  choice: at mga karamdaman
  rationale: Ang “mga karamdaman” ay natural at malawak na katawagan sa mga sakit o kahinaang pisikal na tinutukoy ng ἀσθενειῶν.
- source_word: ἡ καλουμένη Μαγδαληνή
  choice: na tinatawag na Magdalena
  rationale: Malinaw nitong ipinakikilalang ang “Magdalena” ang tawag o pantukoy kay Maria, gaya ng participle na καλουμένη.
- source_word: ἀφ’ ἧς
  choice: na nilabasan
  rationale: Ang “nilabasan” ay likas na Tagalog na nagpapahayag na ang mga demonyo ay lumabas mula sa kaniya, habang pinananatili ang ideya ng paghihiwalay na dala ng ἀπό.
- source_word: δαιμόνια ἑπτὰ
  choice: pitong demonyo
  rationale: Tuwirang pinananatili ang tiyak na bilang at ang personal na demonyong tinutukoy ng δαιμόνια, na naiiba sa mas malawak na “mga espiritu” sa unang sugnay.
- source_word: ἐξεληλύθει
  choice: nilabasan na
  rationale: Ang “na” ay nagpapakitang nakalabas na ang mga demonyo bago ang kasalukuyang tagpo, alinsunod sa pluperfect ng ἐξέρχομαι.
theological_decisions:
- issue: Paglalarawan sa pagpapahirap ng masasamang espiritu
  choice: Pinanatili ang personal na wika tungkol sa “masasamang espiritu” at “mga demonyo.”
  alternative: Ituring ang mga ito bilang metaporikal na paglalarawan lamang ng karamdamang sikolohikal o pisikal.
  rationale: Pinag-iiba ng Griyego ang πνευμάτων πονηρῶν at δαιμόνια mula sa ἀσθενειῶν. Kaya pinananatili ng salin ang pagkakaiba ng espirituwal na pagpapahirap at pisikal na karamdaman nang hindi nagdaragdag ng paliwanag na wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Magdalena,” ang nakasanayang anyong Filipino ng pangalang pantukoy. Hindi isinama ang mga talababa ng English consultation layer dahil ang mga alternatibo nito ay hindi kailangang ilahad sa Tagalog, at ang unang marker doon ay tila hindi tumutugma sa pariralang tinatalakay.
