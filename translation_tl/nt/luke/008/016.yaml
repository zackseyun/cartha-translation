id: LUK.8.16
reference: Luke 8:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὐδεὶς δὲ λύχνον ἅψας καλύπτει αὐτὸν σκεύει ἢ ὑποκάτω κλίνης τίθησιν, ἀλλ’ ἐπὶ λυχνίας ⸀τίθησιν, ἵνα οἱ εἰσπορευόμενοι βλέπωσιν τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/016.yaml
  text: No one, after lighting a lamp, covers it with a container or puts it under a bed, but puts it on a lampstand, so that those who come in may see the light.
translation:
  language: tl
  text: Walang sinumang nagsisindi ng ilawan at tinatakpan ito ng sisidlan o inilalagay sa ilalim ng higaan. Sa halip, inilalagay niya ito sa patungan ng ilawan upang makita ng mga pumapasok ang liwanag.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνον
  choice: ilawan
  rationale: Karaniwang salitang Filipino para sa sinaunang lamparang nagbibigay-liwanag; mas natural at mas malawak kaysa sa makabagong “lampara.”
- source_word: σκεύει
  choice: sisidlan
  rationale: Pinananatili ang malawak na kahulugan ng salitang Griyego, na maaaring tumukoy sa isang lalagyan o kagamitang ipinantatakip.
- source_word: κλίνης
  choice: higaan
  rationale: Natural na katumbas sa Filipino na hindi nagtatakda ng isang tiyak na anyo ng kama.
- source_word: λυχνίας
  choice: patungan ng ilawan
  rationale: Malinaw na ipinahihiwatig ang patungang nilalaan sa ilawan, hindi isang modernong poste o kabit ng ilaw.
- source_word: οἱ εἰσπορευόμενοι
  choice: mga pumapasok
  rationale: Tuwirang pinananatili ang kilos at pangkalahatang pagtukoy sa sinumang pumapasok.
theological_decisions: []
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Filipino. Ang δέ ay ipinahayag sa malinaw na pagsalungat na “Sa halip” bago ang positibong sugnay, sa halip na lagyan ng mabigat na panimulang pang-ugnay ang buong pangungusap.
