base_translation:
  language: en
  yaml_path: translation/nt/luke/008/023.yaml
  text: And as they were sailing[a], he fell asleep. And a windstorm came down on the lake, and they were being swamped and were in danger.
translation:
  language: tl
  text: Habang naglalayag sila, nakatulog siya. Bumaba sa lawa ang isang malakas na unos, at unti-unting napuno ng tubig ang bangka[a], at nanganganib sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hindi tahasang binanggit sa Griyego ang “bangka”; ipinahihiwatig ito ng konteksto. Maaari ring isalin: “unti-unti silang napupuno ng tubig.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεόντων δὲ αὐτῶν
  choice: Habang naglalayag sila
  rationale: Ipinahahayag ng genitive absolute na may present participle ang nagpapatuloy at kasabay na kilos; natural itong naihahatid ng “habang naglalayag sila.”
- source_word: ἀφύπνωσεν
  choice: nakatulog siya
  rationale: Ang aorist ay maaaring maunawaang ingressive, kaya ipinahahayag ang pagpasok sa kalagayan ng pagtulog, hindi lamang ang pagiging tulog.
- source_word: κατέβη
  choice: Bumaba
  rationale: Pinananatili ang larawan ng unos na bumababa patungo sa lawa, na angkop din sa heograpiya ng lugar.
- source_word: λαῖλαψ ἀνέμου
  choice: isang malakas na unos
  rationale: Ang parirala ay tumutukoy sa marahas na unos na dulot ng hangin; ang “malakas na unos” ay malinaw at natural sa modernong Tagalog.
- source_word: εἰς τὴν λίμνην
  choice: sa lawa
  rationale: Sa konteksto ng panahon at ng pandiwang “bumaba,” natural na tumutukoy ito sa pagdating ng unos sa lawa.
- source_word: συνεπληροῦντο
  choice: napupuno ng tubig ang bangka
  rationale: Ang imperfect ay nagpapakita ng nagpapatuloy na pagpuno. Bagaman plural ang anyong Griyego at hindi tahasang binanggit ang bangka, ito ang malinaw na ipinahihiwatig ng pangyayari; minarkahan ang alternatibo sa talababa.
- source_word: ἐκινδύνευον
  choice: nanganganib sila
  rationale: Natural na ipinahahayag nito ang nagpapatuloy na kalagayan ng panganib na isinasaad ng imperfect.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “unos” upang ihatid ang lakas ng λαῖλαψ ἀνέμου nang hindi gumagamit ng lipas o labis na teknikal na pananalita. Tahasang idinagdag sa teksto ang “bangka,” na ipinahihiwatig ng konteksto, at pinanatili sa talababa ang di-tahasang anyo ng Griyego.
