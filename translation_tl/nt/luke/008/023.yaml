    rationale: Ang “unti-unti silang nilulubog ng tubig” ay mas aktibo at mas tiyak kaysa sa ideya ng unti-unting pagpuno/pag-apaw ng tubig. Mas mabuting ipaliwanag na ang Griyego ay hindi tahasang nagsasabi ng “bangka.”
