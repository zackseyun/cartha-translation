  text: ἐδεῖτο δὲ αὐτοῦ ὁ ἀνὴρ ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια εἶναι σὺν αὐτῷ· ἀπέλυσεν δὲ ⸀αὐτὸν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/038.yaml
  text: The man from whom the demons had gone out was begging him to be with him, but he sent him away, saying,
translation:
  language: tl
  text: Paulit-ulit na nakiusap sa kanya ang lalaking nilabasan ng mga demonyo na makasama siya. Ngunit pinaalis niya siya at sinabi,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεῖτο
  choice: Paulit-ulit na nakiusap
  rationale: Ang imperpektong anyo ay nagpapahiwatig ng patuloy o inuulit na taimtim na pakiusap. Likas sa modernong Tagalog ang pariralang ito at hindi kasing-lakas ng mas dramatikong “nagmamakaawa.”
- source_word: ὁ ἀνὴρ
  choice: ang lalaking
  rationale: Tumutukoy ito sa lalaking napalaya na nabanggit sa salaysay; pinananatili ng salin ang tiyak na kasarian at ugnayan sa kasunod na sugnay.
- source_word: ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια
  choice: nilabasan ng mga demonyo
  rationale: Natural na Tagalog itong paglalarawan sa lalaking pinanggalingan ng mga demonyo. Ipinahihiwatig na ng konteksto at aspektong pandiwa na nauna nang naganap ang paglabas.
- source_word: τὰ δαιμόνια
  choice: mga demonyo
  rationale: Tuwirang pinananatili nito ang personal at sobrenatural na mga nilalang na tinutukoy ng teksto, sa halip na palabuin bilang pangkalahatang masasamang espiritu.
- source_word: εἶναι σὺν αὐτῷ
  choice: na makasama siya
  rationale: Natural at tuwirang katumbas ito ng infinitibong “maging kasama niya,” nang hindi ipinapasok kung sasama lamang o mananatili nang matagal.
- source_word: ἀπέλυσεν
  choice: pinauwi niya ang lalaki
  rationale: Sa konteksto, hindi pinayagan ni Jesus ang kahilingan at inutusan siyang bumalik sa tahanan sa kasunod na talata. Ang “pinauwi” ay malinaw at natural, bagaman bahagyang mas tiyak kaysa sa payak na “pinaalis.”
- source_word: λέγων
  choice: at sinabi
  rationale: Natural na paraan ito sa Tagalog upang ipakilala ang tuwirang pananalitang sumusunod, habang pinananatili ang tuloy-tuloy na daloy ng salaysay.
theological_decisions:
- issue: Paglalarawan sa τὰ δαιμόνια sa konteksto ng pagpapalayas ng demonyo
  choice: mga demonyo
  alternative: masasamang espiritu
  rationale: Ipinakikita ng salaysay ang mga ito bilang personal na sobrenatural na nilalang na lumabas sa lalaki. Hindi pinapahina o muling binibigyang-kahulugan ng “mga demonyo” ang pahayag ng teksto.
- issue: Tinukoy na paksa ng ἀπέλυσεν
  choice: pinauwi niya ang lalaki
  alternative: pinaalis niya siya
  rationale: Ang paksa ay si Jesus ayon sa agarang konteksto, ngunit hindi idinagdag ang pangalang “Jesus” sa talata dahil panghalip lamang ang ipinahihiwatig ng Griyego. Inulit ang “ang lalaki” upang maiwasan ang malabong sunod-sunod na panghalip sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit pangkaraniwan. Ginamit ang “Paulit-ulit na nakiusap” upang ipakita ang patuloy na kilos ng imperpekto. Iniwasan ang panimulang “Ngayon” sapagkat walang katumbas na temporal na salita sa Griyego. Hinati sa dalawang pangungusap para sa malinaw at natural na daloy, habang nananatiling bukas ang hulí sa pananalitang sumusunod sa talata 39.
