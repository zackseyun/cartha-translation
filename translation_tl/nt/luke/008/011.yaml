  text: 'This is the parable: the seed is the word of God[a].'
translation:
  language: tl
  text: 'Ito ang talinghaga: ang binhi ay ang salita ng Diyos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya, “Ito ang kahulugan ng talinghaga.” Mas literal na ganito ang Griyego: “Ito ang talinghaga.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔστιν
  choice: ay
  rationale: Pinananatili ng pangawing na “ay” ang tuwirang anyo ng Griyego at hindi nagdaragdag ng salitang “kahulugan.”
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang panandang transisyon ang δέ. Sa Filipino, likas at malinaw ang paglipat sa paliwanag kahit walang idinagdag na “ngayon” o “at.”
- source_word: αὕτη ἡ παραβολή
  choice: Ito ang talinghaga
  rationale: Malapit itong sumusunod sa literal na “ito ang talinghaga” at iniiwasang ipasok sa pangunahing teksto ang interpretibong pangngalang “kahulugan.”
- source_word: σπόρος
  choice: binhi
  rationale: Ang “binhi” ay natural na katumbas ng isahang σπόρος at maaari ring tumukoy sa binhi bilang pangkalahatang larawan sa talinghaga.
- source_word: λόγος
  choice: salita
  rationale: Ang “salita” ay malinaw at nagpapanatili ng biblikal at intertekstuwal na diwa ng λόγος; ang “mensahe” ay mas interpretibo.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Tuwirang inilalarawan ng “ng Diyos” ang genitibong parirala nang hindi ito binibigyang-kahulugang “mula sa Diyos.”
theological_decisions:
- issue: Kung ang παραβολή ay isasaling “talinghaga” o palalawakin bilang “kahulugan/paliwanag ng talinghaga”
  choice: talinghaga
  alternative: kahulugan ng talinghaga
  rationale: Bagaman malinaw sa konteksto na ipinaliliwanag ni Jesus ang talinghaga, literal na sinasabi ng Griyego na “ito ang talinghaga.” Pinananatili ng salin ang tunay na anyo at bahagyang tensiyon ng teksto sa halip na tahimik itong lutasin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang biblikal na mga salitang “talinghaga,” “binhi,” at “salita ng Diyos,” nang walang di-kinakailangang pagpapaliwanag sa pangunahing teksto.
