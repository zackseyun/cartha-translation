id: LUK.8.37
reference: Luke 8:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀ἠρώτησεν αὐτὸν ἅπαν τὸ πλῆθος τῆς περιχώρου τῶν ⸀Γερασηνῶν ἀπελθεῖν ἀπ’ αὐτῶν, ὅτι φόβῳ μεγάλῳ συνείχοντο· αὐτὸς δὲ ἐμβὰς ⸀εἰς πλοῖον ὑπέστρεψεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/037.yaml
  text: And the whole crowd from the surrounding region of the Gerasenes asked him to depart from them[a], because they were gripped by great fear. So he got into a boat and returned.
translation:
  language: tl
  text: At nakiusap sa kanya ang buong karamihan mula sa nakapalibot na lupain ng mga Geraseno na umalis siya sa kanila, sapagkat nabalot sila ng matinding takot.[a] Kaya sumakay siya sa isang bangka at bumalik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinakmal sila ng matinding takot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησεν
  choice: nakiusap
  rationale: Sa kontekstong may kasunod na infinitive, ang ἐρωτάω ay pagpapakiusap o paghiling. Likas sa Filipino ang “nakiusap ... na,” at hindi nito pinatitindi ang kilos hanggang sa “nagmakaawa.”
- source_word: ἅπαν τὸ πλῆθος
  choice: ang buong karamihan
  rationale: Pinananatili ng “buong” ang kabuuang saklaw ng ἅπαν, habang ang “karamihan” ay angkop na kolektibong tawag sa nagtipong mga tao.
- source_word: τῆς περιχώρου
  choice: mula sa nakapalibot na lupain
  rationale: Ang περίχωρος ay tumutukoy sa nakapalibot na pook o distrito. Nililinaw ng “mula sa” ang kaugnayan nito sa karamihan.
- source_word: τῶν Γερασηνῶν
  choice: ng mga Geraseno
  rationale: Ang pang-uri ay ginamit bilang katawagan sa mga taong kaugnay ng Gerasa. Ang “mga Geraseno” ay tuwirang transliterasyon sa anyong likas sa Filipino at sumusunod sa pagbasa ng SBLGNT.
- source_word: ἀπελθεῖν ἀπ’ αὐτῶν
  choice: na umalis siya sa kanila
  rationale: Ang pariralang infinitive ang nilalaman ng kanilang pakiusap. Natural sa Filipino ang “umalis ... sa kanila” at pinananatili nito ang direksiyong palayo.
- source_word: φόβῳ μεγάλῳ
  choice: ng matinding takot
  rationale: Ipinahahayag ng “matinding takot” ang lakas ng φόβῳ μεγάλῳ sa natural at kasalukuyang Filipino.
- source_word: συνείχοντο
  choice: sinakmal sila
  rationale: Ang συνέχω rito ay naglalarawan ng pagiging mahigpit na nasasaklaw o nasisilo ng isang damdamin. Matingkad ngunit natural ang “sinakmal sila” at pinananatili ang puwersa ng metapora.
- source_word: ἐμβὰς εἰς πλοῖον
  choice: sumakay siya sa isang bangka
  rationale: Ang participle ay tumutukoy sa pagsakay ni Jesus. Ang “isang bangka” ay malinaw at naaayon sa kawalan ng tiyak na pantukoy sa Griyego.
- source_word: ὑπέστρεψεν
  choice: bumalik
  rationale: Ang ὑποστρέφω ay nangangahulugang bumalik o magbalik. Maikli at likas sa salaysay ang “bumalik.”
theological_decisions:
- issue: Ang dahilan at uri ng takot ng mga Geraseno sa pagtugon nila kay Jesus
  choice: Iniulat lamang na matinding takot ang nagtulak sa karamihan na pakiusapang umalis si Jesus.
  alternative: Tukuyin ang takot bilang banal na pagpipitagan, o bilang galit dahil sa pagkalugi at pagkagambala sa pamayanan.
  rationale: Hindi nililinaw ng teksto kung ang takot ay pagpipitagan, pagkamangha, pagkapoot, o halo ng mga ito. Hindi ito dapat tahasang ipaliwanag ng salin.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinili ang “nakiusap” kaysa mas pormal na “humiling” o mas matinding “nagmakaawa.” Ang “sinakmal” ay nagpapanatili sa puwersa ng συνέχω; inilagay ang mas hindi metaporikal na alternatibo sa talababa.
