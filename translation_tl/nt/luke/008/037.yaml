revisions:
- from: At nakiusap sa kanya ang buong karamihan mula sa nakapalibot na lupain ng mga Geraseno na umalis siya sa kanila, sapagkat sinakmal sila ng matinding takot.[a] Kaya sumakay siya sa isang bangka at bumalik.
  to: At nakiusap sa kanya ang buong karamihan mula sa nakapalibot na lupain ng mga Geraseno na umalis siya sa kanila, sapagkat nabalot sila ng matinding takot.[a] Kaya sumakay siya sa isang bangka at bumalik.
  rationale: Pinalitan ang pangunahing paglalarawan ng συνέχοντο ng mas idiomatiko at modernong “nabalot sila,” habang inililipat ang mas matingkad na “sinakmal” sa talababa bilang alternatibong leksikal. Walang binago sa saklaw ng karamihan, sa heograpikong pagtukoy, o sa sinadyang hindi pagbibigay-kahulugan sa kanilang takot.
