    issue: Ang “sinakmal sila ng matinding takot” ay hindi ang pinakalikas na modernong Filipino para sa συνέχοντο.
    rationale: Bagaman matingkad at maaaring maunawaan, ang “sumakmal” ay karaniwang ginagamit para sa pisikal o mandaragit na pagdakma. Ang “nabalot” ay natural na paglalarawan ng matinding takot at pinananatili ang diwang sila ay lubos na nasasaklaw nito.
  revised_text: At nakiusap sa kanya ang buong karamihan mula sa nakapalibot na lupain ng mga Geraseno na umalis siya sa kanila, sapagkat nabalot sila ng matinding takot.[a] Kaya sumakay siya sa isang bangka at bumalik.
