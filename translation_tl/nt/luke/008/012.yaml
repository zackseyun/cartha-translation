id: LUK.8.12
reference: Luke 8:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ παρὰ τὴν ὁδόν εἰσιν οἱ ⸀ἀκούσαντες, εἶτα ἔρχεται ὁ διάβολος καὶ αἴρει τὸν λόγον ἀπὸ τῆς καρδίας αὐτῶν, ἵνα μὴ πιστεύσαντες σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/012.yaml
  text: And those beside the road are the ones who have heard[a]; then the devil comes and takes away the word from their hearts[b], so that they may not believe and be saved.
translation:
  language: tl
  text: Ang mga nasa tabi ng daan ay ang mga nakarinig. Pagkatapos, dumarating ang diyablo at inaalis niya sa kanilang mga puso ang salita[a], upang hindi sila sumampalataya at maligtas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “salita” rito ay ang ipinahayag na mensahe ng Diyos sa talinghaga.
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ τὴν ὁδόν
  choice: nasa tabi ng daan
  rationale: Pinananatili nito ang larawang panlunan ng παρά na may akusatibo at natural ito sa makabagong Tagalog.
- source_word: ἀκούσαντες
  choice: mga nakarinig
  rationale: Ang aorist participle ay tumutukoy sa mga taong nakarinig na ng mensahe; tuwiran at natural ang anyong ito sa Tagalog.
- source_word: εἶτα
  choice: Pagkatapos
  rationale: Malinaw nitong ipinahihiwatig ang kasunod na pangyayari.
- source_word: ὁ διάβολος
  choice: ang diyablo
  rationale: Tumutukoy ito rito sa personal na masamang nilalang; ito ang karaniwan at malinaw na salin.
- source_word: αἴρει
  choice: inaalis
  rationale: Ipinapahayag ng pandiwa ang pag-aalis o pagkuha nang hindi dinaragdagan ang teksto ng paraang gaya ng marahas na pag-agaw.
- source_word: τὸν λόγον
  choice: ang salita
  rationale: Pinananatili ang biblikal na katawagan, habang nililinaw sa talababa na ang tinutukoy ay ang ipinahayag na mensahe ng Diyos.
- source_word: ἀπὸ τῆς καρδίας αὐτῶν
  choice: sa kanilang mga puso
  rationale: Pinananatili ang larawan ng puso bilang sentro ng pag-iisip, pagpapasiya, at pagtugon, at ipinakikita ang pangmaramihang diwa ng Griyego.
- source_word: ἵνα μὴ πιστεύσαντες σωθῶσιν
  choice: upang hindi sila sumampalataya at maligtas
  rationale: Natural na inilalahad sa Tagalog ang layunin ng kilos ng diyablo at ang pagkakasunod ng pagsampalataya at kaligtasan nang hindi ipinapasok ang isang sistematikong paliwanag.
- source_word: πιστεύσαντες
  choice: sumampalataya
  rationale: Sa kontekstong panrelihiyon, mas tiyak at natural ang 'sumampalataya' kaysa sa payak na 'maniwala'.
- source_word: σωθῶσιν
  choice: maligtas
  rationale: Tumutukoy ito sa kaligtasan sa ganap na redemptibong diwa, hindi lamang sa pansamantalang pagkakaligtas sa panganib.
theological_decisions:
- issue: Ugnayan ng pagsampalataya at kaligtasan
  choice: upang hindi sila sumampalataya at maligtas
  alternative: Mga saling nagpapaliwanag dito ayon sa isang tiyak na pananaw tungkol sa pagtitiyaga, mabisang pagtawag, o intelektuwal na pagsang-ayon lamang
  rationale: Sinasabi ng Griyego na inaalis ng diyablo ang salita upang hadlangan ang pagsampalataya at kaligtasan. Pinananatili ng salin ang pahayag at tensiyong teolohikal nito nang hindi nilulutas ang mas malawak na pagtatalo ng mga tradisyon.
- issue: Layunin o bunga ng ἵνα μή
  choice: upang hindi
  alternative: kaya hindi
  rationale: Ang 'upang hindi' ang pinakamalinaw na pagpapahayag ng layunin sa konteksto, ngunit hindi nito pinalalawak ang pahayag tungo sa isang doktrinal na paliwanag tungkol sa saklaw ng kapangyarihan ng diyablo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “diyablo,” “sumampalataya,” at “maligtas” bilang mga pamilyar na katawagang biblikal; iniwasan ang mga salitang lipas o labis na teknikal.
