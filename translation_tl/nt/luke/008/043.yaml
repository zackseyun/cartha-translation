  text: And a woman who had been in a flow of blood for twelve years[a], and who had spent her whole livelihood on physicians, was not able to be healed by anyone[c][b],
translation:
  language: tl
  text: At may isang babae na labindalawang taon nang dinudugo, na nagugol na niya sa mga manggagamot ang lahat ng kanyang kabuhayan[b], ngunit hindi siya napagaling ng sinuman.[c]
