revisions:
- from: At may isang babaeng labindalawang taon nang dinudugo[a]. Naubos na niya sa mga manggagamot ang lahat ng kanyang ikinabubuhay[b], ngunit walang sinumang nakapagpagaling sa kanya.[c]
  to: At may isang babae na labindalawang taon nang dinudugo, na nagugol na niya sa mga manggagamot ang lahat ng kanyang kabuhayan[b], ngunit hindi siya napagaling ng sinuman.[c]
  rationale: Pinalitan ang malabong "Naubos na niya sa" ng "na nagugol na niya sa" upang malinaw na ang babae ang gumastos ng lahat ng kanyang mapagkukunan sa mga manggagamot. Inalis ang talababa a sapagkat ang "dinudugo" ay sapat na malinaw sa salin at hindi kailangan ng alternatibong pahayag; inayos din ang mga angkla ng talababa. Nilinaw ang talababa sa tekstuwal na baryante nang hindi lumalampas sa ipinahihiwatig ng ebidensiyang tekstuwal.
