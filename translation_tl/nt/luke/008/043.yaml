    text: Ang salitang Griyego na βίος dito ay tumutukoy sa kanyang kabuhayan—ang kanyang mga ari-arian o pantustos sa buhay—hindi sa kanyang mismong buhay.
    reason: lexical_alternative
  - marker: c
    text: May ilang sinaunang manuskrito na wala ang pariralang nagsasabing ginugol niya ang lahat ng kanyang kabuhayan sa mga manggagamot. Kasama ang pariralang ito sa tekstong Griyegong sinunod dito.
    reason: textual_variant
lexical_decisions:
- source_word: γυνὴ οὖσα
  choice: may isang babaeng ... dinudugo
  rationale: Ginawang likas na sugnay sa Tagalog ang participial na pananalita habang pinananatili ang impormasyong nagsisilbing kaligiran sa salaysay.
- source_word: ἐν ῥύσει αἵματος
  choice: dinudugo
  rationale: Karaniwan, malinaw, at marangal na paraan ito sa modernong Tagalog upang tukuyin ang patuloy na pagdurugo nang hindi nagdaragdag ng tiyak na diagnosis.
- source_word: ἀπὸ ἐτῶν δώδεκα
  choice: labindalawang taon nang
  rationale: Likas na ipinahahayag sa Tagalog ng hulmahang ito ang tagal na nagpapatuloy hanggang sa panahong iyon.
- source_word: ἰατροῖς προσαναλώσασα
  choice: Naubos na niya sa mga manggagamot
  rationale: Ipinahahayag ang naunang pagkilos at ang pagkaubos ng kanyang yaman dahil sa pagpapagamot; pinili ang “manggagamot” bilang dignified ngunit madaling maunawaang katumbas ng ἰατρός.
- source_word: ὅλον τὸν βίον
  choice: ang lahat ng kanyang ikinabubuhay
  rationale: Ang βίος dito ay mga ari-arian o kabuhayang pantustos, hindi ang biyolohikal na buhay.
- source_word: οὐκ ἴσχυσεν ἀπ’ οὐδενὸς θεραπευθῆναι
  choice: ngunit walang sinumang nakapagpagaling sa kanya
  rationale: Likas na aktibong pagkakabuo sa Tagalog na tapat sa diwang hindi siya nagawang pagalingin ng sinuman; hindi nito tinutukoy kung bakit nabigo ang pagpapagaling.
