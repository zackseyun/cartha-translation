  text: ἐξελθόντα δὲ τὰ δαιμόνια ἀπὸ τοῦ ἀνθρώπου εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν λίμνην καὶ ἀπεπνίγη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/033.yaml
  text: Then the demons came out of the man and entered the pigs[a], and the herd rushed down the steep bank into the lake and drowned.
translation:
  language: tl
  text: Nang lumabas ang mga demonyo mula sa lalaki, pumasok sila sa mga baboy, at sumugod ang kawan pababa sa matarik na dalisdis[a] hanggang sa lawa at nalunod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pababa sa bangin” o “pababa sa matarik na gilid”; ang Griyego ay tumutukoy sa isang matarik na pagbaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντα
  choice: Pagkalabas
  rationale: Isinasalamin nito ang aorist participle bilang kilos na nauna sa pangunahing pandiwa, habang nananatiling natural sa modernong Tagalog.
- source_word: τὰ δαιμόνια
  choice: mga demonyo
  rationale: Ito ang tuwirang katumbas ng partikular na pangngalang Griyego at hindi pinapalitan ng mas malawak na katawagang “maruruming espiritu.”
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: mula sa lalaki
  rationale: Ang tinutukoy ay ang lalaking nabanggit na sa salaysay; natural sa Tagalog ang “mula sa lalaki” kasunod ng “pagkalabas.”
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: pumasok sila sa mga baboy
  rationale: Malinaw at likas itong paglalarawan ng pagpasok ng mga demonyo sa mga hayop.
- source_word: ὥρμησεν
  choice: sumugod
  rationale: Ipinahihiwatig ng pandiwa ang biglaan at malakas na pagkilos nang hindi nagdaragdag ng dahilan o layunin.
- source_word: ἡ ἀγέλη
  choice: ang kawan
  rationale: Karaniwang kolektibong katawagan ito sa isang pangkat ng mga hayop at malinaw sa konteksto na mga baboy ang tinutukoy.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: pababa sa matarik na dalisdis
  rationale: Pinananatili nito ang diwa ng mabilis na paggalaw pababa sa matarik na lugar nang hindi tiyak na inilalarawan iyon bilang isang tuwid na bangin.
- source_word: εἰς τὴν λίμνην
  choice: patungo sa lawa
  rationale: Ang λίμνη ay “lawa,” at ipinakikita ng “patungo sa” ang direksiyon ng pagbulusok hanggang sa tubig.
- source_word: ἀπεπνίγη
  choice: nalunod
  rationale: Sa konteksto ng kawan na sumugod sa lawa, ito ang malinaw at natural na kahulugan ng pandiwa.
theological_decisions:
- issue: Pagpapakahulugan sa δαιμόνια sa salaysay
  choice: mga demonyo
  alternative: maruruming espiritu
  rationale: Ang mismong salita sa talata ay δαιμόνια; pinananatili ng salin ang leksikal na pagkakaiba nito sa ibang katawagan nang hindi nagdaragdag ng teolohikal na paliwanag.
- issue: Antas ng katiyakan sa anyong-lupa ng κρημνός
  choice: matarik na dalisdis
  alternative: bangin
  rationale: Maaaring tumukoy ang salita sa bangin o napakatarik na pagbaba, ngunit hindi nito kinakailangang ipakahulugan na tuwid na talampas iyon. Pinananatili sa talababa ang tunay na saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang payak na ayos ng pangungusap at mga salitang karaniwan sa kasalukuyang gamit, habang pinananatili ang sunod-sunod na kilos at ang topograpikong kalabuan ng Griyego.
