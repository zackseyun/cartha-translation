id: LUK.9.33
reference: Luke 9:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ εἶπεν ⸀ὁ Πέτρος πρὸς τὸν Ἰησοῦν· Ἐπιστάτα, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν σκηνὰς τρεῖς, μίαν σοὶ καὶ μίαν Μωϋσεῖ καὶ μίαν Ἠλίᾳ, μὴ εἰδὼς ὃ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/033.yaml
  text: 'And as they were departing from him[a], Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters: one for you, one for Moses, and one for Elijah” — not knowing what he was saying.'
translation:
  language: tl
  text: 'Habang umaalis sila mula kay Jesus, sinabi ni Pedro kay Jesus, “Guro, mabuti na narito tayo. Magtayo tayo ng tatlong kubol[a]: isa para sa iyo, isa para kay Moises, at isa para kay Elias”—hindi niya alam ang sinasabi niya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga tolda” o “mga silungan”; ayon sa tradisyon, “mga tabernakulo.” Ang salitang Griyego ay tumutukoy sa pansamantalang mga silungan at maaaring umalingawngaw sa mga imahen ng biblikal na kapistahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ
  choice: Habang lumalayo sila sa kanya
  rationale: Isinasalin nang natural ang karaniwang pangkuwentong konstruksiyon at pinananatili ang kasabay na pagkilos at ang diwa ng paghiwalay nila kay Jesus.
- source_word: Ἐπιστάτα
  choice: Guro
  rationale: Isang natural at magalang na tawag kay Jesus sa modernong Tagalog. Ipinahihiwatig nito ang kinikilalang awtoridad ni Jesus nang hindi gumagamit ng mas politikal na “Pinuno” o ng “Panginoon,” na karaniwang katumbas ng ibang salitang Griyego.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: mabuti na narito tayo
  rationale: Tuwiran at natural na ipinapahayag ang positibong pagtataya ni Pedro.
- source_word: ποιήσωμεν
  choice: Magtayo tayo
  rationale: Pinananatili ang hortatoryong unang panauhang maramihan at likas itong gamitin sa Tagalog kapag mga kubol ang gagawin.
- source_word: σκηνὰς
  choice: mga kubol
  rationale: Ang “kubol” ay isang pansamantalang tirahan o silungan at maaari ring magpanatili ng alingawngaw ng biblikal na Kapistahan ng mga Kubol, nang hindi ipinipilit na iyon ang tiyak na tinutukoy.
- source_word: μὴ εἰδὼς ὃ λέγει
  choice: hindi niya nalalaman ang sinasabi niya
  rationale: Pinananatili ang paliwanag ng tagapagsalaysay na hindi nauunawaan ni Pedro ang kabuluhan ng sarili niyang sinasabi sa sandaling iyon.
theological_decisions:
- issue: Ang posibleng ugnayan ng σκηνάς sa Kapistahan ng mga Kubol o sa tabernakulo
  choice: kubol
  alternative: tolda, silungan, o tabernakulo
  rationale: Hindi tahasang iniuugnay ng talata ang mungkahi ni Pedro sa isang kapistahan o sa tabernakulo. Ang “kubol” ay tumpak at madaling maunawaan, habang inilalahad sa talababa ang ibang posibleng salin at ang posibleng biblikal na alingawngaw.
- issue: Ang titulo ni Pedro kay Jesus na Ἐπιστάτα
  choice: Guro
  alternative: Pinuno o Panginoon
  rationale: Ang ἐπιστάτης ay magalang na pagkilala sa awtoridad ni Jesus at natatangi sa gamit ni Lucas. Ang “Guro” ang pinakanatural na tawag sa kontekstong ito; iniiwasan ng “Pinuno” ang pagiging likas na pananalita, samantalang maaaring ipagkamali ang “Panginoon” bilang salin ng κύριος.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at pasalita ang daloy. Ginamit ang “kubol” bilang madaling maunawaang salitang may pansamantalang katangian, at iniwasan ang mas arkaiko at teolohikong mabigat na “tabernakulo” sa pangunahing teksto.
