base_translation:
  language: en
  yaml_path: translation/nt/luke/009/003.yaml
  text: And he said to them[a], “Take nothing for the journey—neither a staff, nor a bag, nor bread, nor money[c][b]; and do not have two tunics each.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Huwag kayong magdala ng anuman para sa paglalakbay—ni tungkod, ni bag[a], ni tinapay, ni pera[b]; at huwag kayong magkaroon ng tig-dadalawang tunika.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bag ng manlalakbay,” na ginagamit sa paglalagay ng mga panustos.
    reason: lexical_alternative
  - marker: b
    text: Literal na “pilak”; tumutukoy ito rito sa pera.
    reason: lexical_alternative
  - marker: c
    text: Ang pananalitang Griyego ay nangangahulugang “tig-dadalawang tunika,” samakatuwid, dalawang tunika para sa bawat isa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδὲν αἴρετε εἰς τὴν ὁδόν
  choice: Huwag kayong magdala ng anuman para sa paglalakbay
  rationale: Ipinapahayag nang natural sa modernong Tagalog ang utos na huwag magdala ng anumang panustos o kagamitan para sa paglalakbay.
- source_word: ῥάβδον
  choice: tungkod
  rationale: Ang “tungkod” ang karaniwan at angkop na tawag sa tungkod na ginagamit ng manlalakbay.
- source_word: πήραν
  choice: bag
  rationale: Ang “bag” ay natural at madaling maunawaan sa modernong Filipino; nililinaw sa talababa na maaari itong tumukoy sa bag ng manlalakbay para sa mga panustos.
- source_word: ἄρτον
  choice: tinapay
  rationale: Pinananatili ang tiyak at literal na bagay na binanggit sa Griyego sa halip na gawing pangkalahatang “pagkain.”
- source_word: ἀργύριον
  choice: pera
  rationale: Bagaman literal na “pilak,” tumutukoy ito rito sa salaping ginagamit; “pera” ang malinaw na katumbas sa konteksto.
- source_word: ἀνὰ δύο χιτῶνας ἔχειν
  choice: huwag kayong magkaroon ng tig-dalawang tunika
  rationale: Pinananatili ng “tig-dalawa” ang distributibong diwa ng ἀνά—dalawa para sa bawat isa—at ng “magkaroon” ang pandiwang ἔχειν.
- source_word: χιτῶνας
  choice: tunika
  rationale: Pinananatili ng “tunika” ang makasaysayang uri ng kasuotang tinutukoy at iniiwasang gawing labis na moderno bilang “kamiseta.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang karaniwang “bag” para sa madaling pagkaunawa, habang pinanatili ang makasaysayang “tunika.” Ang magkakasunod na “ni” ay sumasalamin sa mariing talaan ng mga ipinagbabawal dalhin sa Griyego.
