reference: Luke 9:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὑποστρέψαντες οἱ ἀπόστολοι διηγήσαντο αὐτῷ ὅσα ἐποίησαν. καὶ παραλαβὼν αὐτοὺς ὑπεχώρησεν κατ’ ἰδίαν εἰς ⸂πόλιν καλουμένην Βηθσαϊδά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/010.yaml
  text: And when the apostles returned[a], they reported to him what they had done. And taking them with him, he withdrew privately to a town called Bethsaida.
translation:
  language: tl
  text: Pagbalik ng mga apostol, isinalaysay nila sa kanya ang lahat ng ginawa nila. Isinama niya sila at lumayo nang sarilinan patungo sa isang bayang tinatawag na Betsaida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: Pagbalik
  rationale: Ginawang sugnay na panahunan ang aorist participle upang natural na ipakita sa Filipino na nauna ang kanilang pagbabalik bago ang pagsasalaysay.
- source_word: οἱ ἀπόστολοι
  choice: mga apostol
  rationale: Ito ang kinikilalang tawag sa Labindalawa sa konteksto ng kanilang pagkakasugo at ang karaniwang salin sa Filipino.
- source_word: διηγήσαντο
  choice: isinalaysay
  rationale: Ipinahihiwatig ng pandiwa ang pagkukuwento o pagbibigay ng ulat tungkol sa nangyari; pinananatili ng “isinalaysay” ang ganitong lawak ng kahulugan.
- source_word: ὅσα ἐποίησαν
  choice: ang lahat ng ginawa nila
  rationale: Malinaw at likas na inilalahad nito ang saklaw ng ὅσα at ang gawaing natapos bago sila nag-ulat.
- source_word: παραλαβὼν αὐτούς
  choice: Isinama niya sila
  rationale: Ipinapahayag ng παραλαμβάνω dito na dinala ni Jesus ang mga apostol bilang mga kasama niya.
- source_word: ὑπεχώρησεν
  choice: lumayo
  rationale: Pinananatili nito ang diwa ng paglayo mula sa pampublikong gawain o sa mga tao, nang hindi nagdaragdag ng ideya ng pagtakas.
- source_word: κατ’ ἰδίαν
  choice: nang bukod
  rationale: Ipinapakita nitong humiwalay sila sa karamihan. Hindi nito ipinahihiwatig na nag-iisa si Jesus, yamang tahasang isinama niya ang mga apostol.
- source_word: πόλιν καλουμένην Βηθσαϊδά
  choice: sa isang bayang tinatawag na Betsaida
  rationale: Ang πόλις ay maaaring tumukoy sa bayan o lungsod; ang “bayan” ay natural at hindi nagpapalabis sa laki ng lugar. Ginamit ang karaniwang anyong Filipino na “Betsaida.”
theological_decisions:
- issue: Kahulugan ng κατ’ ἰδίαν habang kasama ni Jesus ang mga apostol
  choice: nang bukod
  alternative: nang sarilinan; nang pribado; hiwalay sa iba
  rationale: Tumutukoy ang parirala sa paglayo nila mula sa karamihan, hindi sa lubos na pag-iisa ni Jesus. Pinananatili ng salin ang tensiyon sa pagitan ng pribadong paglayo at ng tahasang pagsama sa mga apostol.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Gumamit ng payak at madaling maunawaang ayos ng pangungusap, habang pinananatili ang sunod-sunod na kilos at ang diwa ng paglayo mula sa karamihan.
