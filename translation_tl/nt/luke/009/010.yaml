  to: Pagbalik ng mga apostol, isinalaysay nila sa kanya ang lahat ng ginawa nila. Isinama niya sila at lumayo nang sarilinan patungo sa isang bayang tinatawag na Betsaida.
  rationale: Pinalitan ang di-idiomatikong “nang bukod” ng “nang sarilinan,” na likas sa modernong Filipino at tapat sa κατ’ ἰδίαν sa kontekstong kasama ni Jesus ang mga apostol. Inayos din ang talababa upang alisin ang hindi sinasadyang pahiwatig na temporal sa “hindi na.”
