base_translation:
  language: en
  yaml_path: translation/nt/luke/009/024.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will save it.
translation:
  language: tl
  text: Sapagkat ang sinumang nagnanais na iligtas ang kanyang buhay[a] ay mawawalan siya nito; ngunit ang sinumang mawalan ng kanyang buhay alang-alang sa akin ay siyang magliligtas nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaluluwa” o “sarili”; ang salitang Griyego ay maaaring mangahulugang buhay, kaluluwa, o sarili, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν θέλῃ
  choice: Sapagkat ang sinumang nagnanais
  rationale: Ang ὃς ... ἂν na may pasakaling pandiwa ay nagsasaad ng pangkalahatang kundisyon, kaya angkop ang “ang sinuman.” Pinanatili ng “Sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang sinabi, at likas na ipinahahayag ng “nagnanais” ang θέλῃ.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: ang kanyang buhay
  rationale: Sa kontekstong ito ng pagliligtas at pagkawala dahil sa pagsunod kay Jesus, pangunahing tumutukoy ang ψυχή sa buhay ng tao. Hindi nito nililimitahan ang salita sa di-materyal na “kaluluwa”; inilalahad sa talababa ang mas malawak na saklaw nito.
- source_word: σῶσαι
  choice: iligtas
  rationale: Pinananatili ng “iligtas” ang karaniwang kahulugan ng σῴζω at ang mahalagang pag-uulit nito sa huling σώσει, bagaman taglay rito ang diwang ingatan o panatilihin ang buhay.
- source_word: ἀπολέσει αὐτήν
  choice: mawawalan nito
  rationale: Natural sa Filipino ang “mawawalan ng buhay” para sa pagkawala ng buhay. Ang “nito” ay malinaw na bumabalik sa “buhay” at hindi nagdaragdag ng ideya ng sadyang pagsira sa sarili.
- source_word: ὃς δ’ ἂν ἀπολέσῃ
  choice: ngunit ang sinumang mawalan
  rationale: Ipinahahayag ng “ngunit” ang pagsalungat ng δέ. Ang “ang sinumang mawalan” ay natural na pangkalahatang kundisyon at pinananatili ang paralelismo ng dalawang bahagi.
- source_word: ἕνεκεν ἐμοῦ
  choice: alang-alang sa akin
  rationale: Ang “alang-alang sa akin” ay likas at marangal na pahayag ng sanhi o motibong nakatuon kay Jesus, gaya ng ἕνεκεν na may genitibo.
- source_word: οὗτος σώσει αὐτήν
  choice: siya ang magliligtas nito
  rationale: Ang hulma na “siya ang” ay nagpapanatili sa diin ng οὗτος, samantalang ang “magliligtas nito” ay inuulit ang parehong pandiwang ginamit para sa σῶσαι at pinananatili ang kabalintunaan ng sinabi.
theological_decisions:
- issue: Kahulugan ng ψυχή sa kabalintunaan ni Jesus
  choice: buhay
  alternative: kaluluwa; sarili
  rationale: Ang agarang konteksto ay ang pagkakait sa sarili at ang maaaring pagkawala ng buhay dahil sa pagsunod kay Jesus. Pinakamalinaw dito ang “buhay,” ngunit hindi ipinagpapalagay na iyon lamang ang buong saklaw ng ψυχή; kaya binanggit sa talababa ang ibang posibleng kahulugan.
- issue: Diin ng οὗτος sa huling sugnay
  choice: siya ang magliligtas nito
  alternative: ililigtas niya ito
  rationale: Ang “siya ang” ay likas na paraan sa Filipino upang itangi at bigyang-diin ang taong tinutukoy ng οὗτος, nang hindi nagdaragdag ng paliwanag hinggil sa paraan ng pagliligtas.
- issue: Pangkalahatang pagtukoy sa tao
  choice: kanyang buhay
  alternative: sariling buhay
  rationale: Walang kasariang gramatikal ang “kanya” sa Filipino, kaya tumpak nitong naihahayag ang isahang pangkalahatang pagtukoy ng Griyego nang hindi nagdaragdag o nag-aalis ng kasarian.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Sapagkat” upang mapanatili ang ugnayang nagpapaliwanag, “alang-alang sa akin” para sa likas na pahayag ng motibo, at “siya ang” upang madama ang diin ng Griyegong οὗτος. Pinanatili ang pandiwang “iligtas” sa magkabilang dulo ng kabalintunaan.
