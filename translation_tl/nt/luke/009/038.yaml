  yaml_path: translation/nt/luke/009/038.yaml
  text: And behold[a], a man from the crowd cried out, saying, “Teacher, I beg you to look upon my son, because he is my only child.”
translation:
  language: tl
  text: At narito, isang lalaki mula sa karamihan ang sumigaw, “Guro, nagsusumamo ako sa iyo na tingnan mo ang anak kong lalaki, sapagkat siya ang kaisa-isa kong anak.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaisa-isa kong anak na lalaki.” Sinasabi ng Griyego na siya ang tanging anak ng ama; dahil natukoy na siyang anak na lalaki, posible ang alinman sa dalawang salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili ang tungkulin nitong tumawag ng pansin sa salaysay sa paraang natural at marangal sa modernong Tagalog.
- source_word: ἀνὴρ
  choice: isang lalaki
  rationale: Tiyak na lalaki ang tinutukoy ng pangngalan, kaya pinananatili ang kasarian nito.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: mula sa karamihan
  rationale: Likas na salin na nagpapakitang kabilang sa nagkakatipong mga tao ang lalaki.
- source_word: ἐβόησεν
  choice: sumigaw
  rationale: Ipinahahayag ang malakas at apurahang pagtawag ng ama.
- source_word: λέγων
  choice: direktang sinundan ng siniping pananalita
  rationale: Hindi kailangang isalin nang hiwalay ang participle na λέγων; likas sa Tagalog na tuwirang ilahad ang sinabi matapos ang pandiwang “sumigaw.”
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Tuwirang katumbas ng tawag na nangangahulugang tagapagturo, nang hindi nagdaragdag ng di-kinakailangang diwa ng paghahari.
- source_word: δέομαί σου
  choice: nagsusumamo ako sa iyo
  rationale: Ipinapakita ang taimtim at desperadong pakiusap, na mas matindi kaysa karaniwang paghiling.
- source_word: ἐπιβλέψαι ἐπὶ
  choice: lingapin mo
  rationale: Ipinahahayag hindi lamang ang pagtingin kundi ang mapagmalasakit at aktibong pagbibigay-pansin na hinihingi sa konteksto.
- source_word: τὸν υἱόν μου
  choice: ang anak kong lalaki
  rationale: Malinaw na pinananatili ang kahulugan ng υἱός bilang anak na lalaki at iniiwasan ang pag-uulit ng “anak” sa kasunod na sugnay.
- source_word: μονογενής
  choice: kaisa-isa kong anak
  rationale: Ipinahahayag na siya ang nag-iisang anak ng ama; yamang natukoy na siyang anak na lalaki, nananatiling posible ang mas literal na “kaisa-isa kong anak na lalaki.”
- source_word: μοί ἐστιν
  choice: siya ang ... kong
  rationale: Likas na Tagalog na pagpapahayag ng pag-aaring ipinakikita ng datibong μοί kasama ng ἐστιν.
theological_decisions:
- issue: Saklaw ng μονογενής
  choice: kaisa-isa kong anak
  alternative: kaisa-isa kong anak na lalaki
  rationale: Sa konteksto, natukoy na ang bata bilang anak na lalaki, ngunit maaaring idiin ng μονογενής na siya ang nag-iisang anak o ang nag-iisang anak na lalaki. Pinili sa teksto ang mas malawak at likas na “kaisa-isa kong anak,” habang pinananatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “narito” bilang pansin-panawag, “nagsusumamo” para sa taimtim na pakiusap, at “lingapin” upang maipahiwatig ang mapagmalasakit na pagbibigay-pansin, hindi lamang literal na pagtingin.
