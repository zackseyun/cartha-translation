base_translation:
  language: en
  yaml_path: translation/nt/luke/009/007.yaml
  text: Herod the tetrarch heard about all that was happening[a], and he was perplexed because it was being said by some that John had been raised from the dead,
translation:
  language: tl
  text: Nabalitaan ng tetrarkang si Herodes ang lahat ng nangyayari, at naguguluhan siya sapagkat may ilang nagsasabing muling binuhay si Juan mula sa mga patay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “muling nabuhay si Juan mula sa mga patay.” Pasibo ang pandiwang Griyego; literal, “muling binuhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσεν
  choice: Nabalitaan
  rationale: Sa kontekstong ang layon ay lahat ng nagaganap, likas na ipinahihiwatig ng ἀκούω ang pagtanggap ng mga balita o ulat.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Banayad na pang-ugnay ito sa daloy ng salaysay; hindi kailangang tumbasan ng panimulang salita sa Filipino.
- source_word: ὁ τετραάρχης
  choice: na tetrarka
  rationale: Pinananatili ang tiyak na makasaysayan at pampolitikang titulo sa halip na gawing hari o pangkalahatang pinuno.
- source_word: τὰ γινόμενα πάντα
  choice: ang lahat ng nangyayari
  rationale: Natural sa modernong Filipino at pinananatili ang diwang nagpapatuloy ang mga pangyayari.
- source_word: διηπόρει
  choice: litong-lito siya
  rationale: Ipinahahayag ang matinding pagkalito o kawalan ng katiyakan sa malinaw at karaniwang Filipino.
- source_word: διὰ τὸ λέγεσθαι ὑπό τινων
  choice: dahil sinasabi ng ilan
  rationale: Malinaw na ipinapakita ang sanhi at ang di-tiyak na pangkat na pinagmulan ng sabi, bagaman ginawang mas natural na aktibong ayos sa Filipino.
- source_word: ἠγέρθη
  choice: muling binuhay
  rationale: 'Pinananatili ang pasibong diwa ng pandiwa: si Juan ang tumanggap ng pagkilos, hindi lamang basta bumangon.'
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Likas na salin ng pariralang tumutukoy sa muling pagkabuhay mula sa kalagayan o pangkat ng mga patay.
theological_decisions:
- issue: Pananalita tungkol sa muling pagkabuhay ni Juan
  choice: muling binuhay mula sa mga patay
  alternative: muling nabuhay mula sa mga patay
  rationale: Ang Griyegong ἠγέρθη ay pasibo. Pinananatili ng “muling binuhay” ang anyong iyon nang hindi tinutukoy kung sino ang gumawa ng pagkilos.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang makasaysayang titulong “tetrarka”; maikli at natural ang ayos ng pangungusap, at hindi dinagdagan ng tahasang panandang pangdiskurso ang δέ.
