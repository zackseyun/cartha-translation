base_translation:
  language: en
  yaml_path: translation/nt/luke/009/019.yaml
  text: And they answered[a], “John the Baptist; but others, Elijah; and others, that some prophet of the ancients has risen.”
translation:
  language: tl
  text: Sumagot sila, “Si Juan na Tagapagbautismo; sabi naman ng iba, si Elias; at ang sabi naman ng iba, bumangon[a] ang isa sa mga propeta noong unang panahon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bumangon ang isang propeta mula noong unang panahon.” Mas idiomatiko itong paraan ng pagpapahayag ng Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες εἶπαν
  choice: Sumagot sila
  rationale: Ang participle at finite verb ay isang karaniwang idyomang may impluwensiyang Semitiko; natural na ipinahahayag sa Filipino bilang “Sumagot sila” nang walang di-kailangang pag-uulit.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Si Juan na Tagapagbautismo
  rationale: Ipinahahayag nito ang pagkakakilanlang ibinibigay ng βαπτιστής at mas malinaw sa karaniwang mambabasa kaysa sa hiram na titulong “Bautista.”
- source_word: ἄλλοι δὲ ... ἄλλοι δὲ
  choice: sabi naman ng iba ... at sabi ng iba pa
  rationale: Pinananatili ang sunod-sunod na magkakaibang sagot at natural na inilalahad ang elipsis sa Griyego.
- source_word: Ἠλίαν
  choice: Elias
  rationale: Ito ang nakasanayang anyo ng pangalan ng propeta sa Filipino.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: ang isa sa mga propeta noong unang panahon
  rationale: Natural nitong ipinahahayag ang di-tiyak na τις at inuunawa ang genitibong τῶν ἀρχαίων bilang pagtukoy sa pangkat ng mga propeta mula sa sinaunang panahon.
- source_word: ἀνέστη
  choice: muling bumangon
  rationale: Pinananatili ng “bumangon” ang posibleng pahiwatig ng pagkabuhay na muli, samantalang ipinakikita ng “muli” ang kontekstong isang propeta mula sa unang panahon ang sinasabing lumitaw ngayon.
theological_decisions:
- issue: Kung tahasang ipapakahulugan ang ἀνέστη bilang pagkabuhay na muli
  choice: muling bumangon
  alternative: muling nabuhay; muling lumitaw
  rationale: Ang “muling bumangon” ay nagpapanatili sa saklaw ng pandiwang Griyego at sa posibleng resonansiya nito sa pagkabuhay na muli, nang hindi tahasang pinipili ang “nabuhay” o pinapahina ito bilang simpleng “lumitaw.”
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “sabi naman” upang maipahayag nang maayos ang mga eliptikong kasunod na tugon, at iniwasan ang sobrang literal ngunit di-likas na “propeta ng mga sinauna.”
