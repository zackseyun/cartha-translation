  naturalness: Natural at malinaw ang pangkalahatang daloy. Mas maayos at hindi paulit-ulit ang “ang sabi naman ng iba” para sa huling pangkat. Ang “bumangon” nang walang “muli” ay mas tapat at nananatiling bukás sa posibleng resonansiya ng orihinal.
  terminology: Ang “Juan na Tagapagbautismo” at “Elias” ay angkop na mga anyo sa modernong Filipino Tagalog. Ang “isa sa mga propeta noong unang panahon” ay natural na paraan upang ihatid ang di-tiyak na τις at ang personal na pagtukoy ng τῶν ἀρχαίων.
