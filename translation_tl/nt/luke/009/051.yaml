  text: Ἐγένετο δὲ ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας τῆς ἀναλήμψεως αὐτοῦ καὶ αὐτὸς τὸ ⸀πρόσωπον ⸀ἐστήρισεν τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/051.yaml
  text: It happened[a], when the days of his being taken up were being fulfilled[b], that he set his face to go to Jerusalem.
translation:
  language: tl
  text: At nang malapit nang maganap ang mga araw ng pag-angat sa kanya[a], siya mismo ay buong tatag na nagpasiyang magtungo sa Jerusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ng pag-akyat niya sa langit.” Literal na sinasabi ng Griyego, “ng pagkuha sa kanya paitaas.”
    reason: alternative_reading
  - marker: b
    text: Literal na “itinuon niya ang kanyang mukha.” Idyoma ito na nagpapahayag ng matatag na pagpapasiyang magtungo sa Jerusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: At nang
  rationale: Isinasalin ito bilang likas na panandang pasalaysay na nag-uugnay sa kasunod na pangyayaring temporal, nang hindi nagdaragdag ng tahasang “ngayon” na wala sa Griyego.
- source_word: ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας
  choice: nang sumasapit na sa kaganapan ang mga araw
  rationale: Pinananatili ang temporal at prosesibong diwa ng konstruksiyon at ang tahasang “mga araw,” sa halip na gawing payak na “panahon na.”
- source_word: τῆς ἀναλήμψεως αὐτοῦ
  choice: ng pagdadala sa kanya paitaas
  rationale: Ipinapakita ang literal na diwang pasibo ng “pagkuha o pagdadala paitaas” nang hindi agad nililimitahan ang tinutukoy sa pag-akyat lamang.
- source_word: καὶ αὐτὸς τὸ πρόσωπον ἐστήρισεν
  choice: itinuon niya ang kanyang mukha
  rationale: Pinananatili ang matingkad na idyoma ng matatag na pagpapasiya at ang diin sa pagkilos ni Jesus, sa halip na lubusang palitan ito ng abstraktong “nagpasiyang mabuti.”
- source_word: τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ
  choice: sa pagpunta sa Jerusalem
  rationale: Likas na ipinahahayag ang layon o direksiyon ng matatag niyang pagtutuon.
theological_decisions:
- issue: Saklaw ng ἀνάλημψις αὐτοῦ
  choice: pagdadala sa kanya paitaas
  alternative: pag-akyat niya sa langit
  rationale: Ang Griyego ay tumutukoy sa pagdadala o pagkuha paitaas at maaaring magpahiwatig sa mas malawak na paghantong ng kamatayan, muling pagkabuhay, at pagdakila ni Jesus. Hindi nilulutas ng salin ang posibleng saklaw nito nang mas makitid kaysa sa teksto.
- issue: Idyomatikong diwa ng τὸ πρόσωπον ἐστήρισεν
  choice: itinuon niya ang kanyang mukha
  alternative: matatag niyang ipinasiyang pumunta
  rationale: Pinananatili ang larawang pampanitikan at ang diwa ng matatag na pagpapasiya, habang nililinaw ito sa talababa para sa mga mambabasang hindi pamilyar sa idyoma.
translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang “mga araw,” ang pasibong pagdadala paitaas, at ang idyoma ng pagtutuon ng mukha upang mapanatili ang tekstura at tunay na teolohikal na kalabuan ng Griyego; ipinaliwanag sa maiikling talababa ang mga pariralang maaaring hindi agad pamilyar.
