- from: At nang sumasapit na sa kaganapan ang mga araw ng pagdadala sa kanya paitaas[a], itinuon niya ang kanyang mukha sa pagpunta sa Jerusalem.[b]
  to: At nang malapit nang maganap ang mga araw ng pag-angat sa kanya[a], siya mismo ay buong tatag na nagpasiyang magtungo sa Jerusalem.[b]
  rationale: Inayos ang temporal na parirala upang maging likas sa Filipino at malinaw na maipahayag ang nagaganap na paglapit sa pagkumpleto ng itinakdang mga araw. Pinalitan ang literal ngunit hindi likas na larawan ng mukha ng semantikong katumbas na nagpapahayag ng matatag na pasiya; pinanatili ang literal na larawan sa talababa. Hindi pinili sa pangunahing teksto ang “pag-akyat niya sa langit,” upang huwag paliitin ang posibleng saklaw ng ἀνάλημψις.
