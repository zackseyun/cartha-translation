  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing diwa: mariing pagsaway sa isang salinlahing walang pananampalataya at nalihis, ang dalawang maramihang panghalip, at ang isahang utos sa ama. Gayunman, ang “mananatiling kasama” ay may bahagyang dagdag na ideya ng pagpapatuloy/pananatili na wala sa simpleng panghinaharap na ἔσομαι πρὸς ὑμᾶς.'
  naturalness: Nauunawaan ang draft, ngunit mas natural sa modernong Filipino ang “makakasama ninyo” para sa retorikal na tanong. Ang “magpapasensiya sa inyo” ay mas idiomatiko kaysa “magtitiis sa inyo,” habang pinananatili ang diwa ng ἀνέξομαι ὑμῶν.
  terminology: Ang “lahi,” “hindi sumasampalataya,” at “baluktot” ay katanggap-tanggap at pinananatili. Hindi pinapangalanan ang saklaw ng maramihang “ninyo,” alinsunod sa Griyego. Ang isahang “mo” sa huling utos ay wasto para sa προσάγαγε.
  issues:
