    issue: Ang “mananatiling kasama” ay bahagyang mas tiyak kaysa sa ἔσομαι πρὸς ὑμᾶς.
    rationale: Ang pandiwang Griyego ay “ako ay magiging/makakasama,” samantalang ang “mananatili” ay maaaring magpahiwatig ng pagpapatuloy o pananatili sa isang lugar.
  - severity: low
    issue: Hindi gaanong idiomatiko ang “magtitiis sa inyo.”
    rationale: Bagaman nauunawaan at malapit sa literal na “bear with,” ang “magpapasensiya sa inyo” ay mas likas na Filipino para sa pagtitiis o pagpaparaya sa mga tao.
  revised_text: Sumagot si Jesus, “O lahing hindi sumasampalataya at baluktot! Hanggang kailan ako makakasama ninyo at magpapasensiya sa inyo? Dalhin mo rito ang anak mo.”
