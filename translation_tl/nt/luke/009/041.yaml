  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ἔσομαι πρὸς ὑμᾶς καὶ ἀνέξομαι ὑμῶν; προσάγαγε ⸂ὧδε τὸν υἱόν σου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/041.yaml
  text: But Jesus answered, “O unbelieving and twisted generation, how long will I be with you and bear with you? Bring your son here.”
translation:
  language: tl
  text: Sumagot si Jesus, “O lahing hindi sumasampalataya at baluktot! Hanggang kailan ako makakasama ninyo at magpapasensiya sa inyo? Dalhin mo rito ang anak mo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενεὰ
  choice: lahi
  rationale: Tumutukoy sa kasalukuyang salinlahi o pangkat ng mga tao; natural sa pahayag na may pagsaway ang “lahi,” habang hindi nililimitahan sa isang tiyak na henerasyong kronolohikal.
- source_word: ἄπιστος
  choice: hindi sumasampalataya
  rationale: Malinaw na ipinahahayag ang kawalan ng pananampalataya, sa halip na ang mas malabong “di-mapagkakatiwalaan.”
- source_word: διεστραμμένη
  choice: baluktot
  rationale: Pinananatili ang matalinghagang diwa ng isang salinlahing nalihis o napilipit sa moral at espirituwal na paraan.
- source_word: ἀνέξομαι ὑμῶν
  choice: magtiitiis sa inyo
  rationale: Inilalarawan ang pagtitiis o patuloy na pagpapasensiya sa kanila, kaayon ng retorikal na pagsaway.
- source_word: προσάγαγε ὧδε
  choice: Dalhin mo rito
  rationale: Direkta at natural na utos sa ama na ilapit ang anak kay Jesus.
theological_decisions:
- issue: Saklaw ng ikalawang panauhang maramihan sa “kasama ninyo” at “sa inyo”
  choice: Pinanatiling maramihan at hindi tinukoy kung mga alagad lamang, karamihan, o buong salinlahi ang pangunahing tinutukoy.
  alternative: Tukuying tahasan ang mga alagad o ang mga tao.
  rationale: Ang Griyegong ὑμᾶς/ὑμῶν ay maramihan ngunit hindi tahasang nililinaw ang eksaktong saklaw; dapat panatilihin ang ambiguwidad.
- issue: Lakas ng διεστραμμένη
  choice: baluktot
  alternative: masama, suwail, o tiwali
  rationale: Ang “baluktot” ay nagpapanatili sa metapora at bigat ng orihinal nang hindi nagdaragdag ng mas tiyak na doktrinal o moral na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “O” upang mapanatili ang mariing panawagan ng Ὦ; ang tandang padamdam ay natural na naghahatid ng tindi bago ang retorikal na tanong.
