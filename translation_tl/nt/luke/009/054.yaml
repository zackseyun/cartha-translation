  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ Ἰάκωβος καὶ Ἰωάννης εἶπαν· Κύριε, θέλεις εἴπωμεν πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ καὶ ἀναλῶσαι ⸀αὐτούς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/054.yaml
  text: When the disciples James and John saw this[a], they said, “Lord, do you want us to command fire to come down from heaven and consume them?”
translation:
  language: tl
  text: Nang makita ito[a] ng mga alagad na sina Santiago at Juan, sinabi nila, “Panginoon, gusto mo bang sabihin naming bumaba mula sa langit ang apoy at tupukin sila?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nang makita nina Santiago at Juan.” Sa Griyego, walang hayag na layon ang “makita”; ang “ito” ay tumutukoy sa pagtanggi ng mga Samaritano sa naunang talata.
    reason: Nililinaw ang kontekstuwal na “ito” na idinagdag para sa natural na Tagalog, habang pinananatili ang kawalan ng hayag na layon sa Griyego.
lexical_decisions:
- source_word: ἰδόντες
  choice: Nang makita ito
  rationale: Ginawang temporal ang aorist participle sa natural na Tagalog. Idinagdag ang “ito” bilang di-tahasang layon, na tumutukoy sa pagtanggi ng mga Samaritano sa naunang talata.
- source_word: δὲ
  choice: isinama sa daloy ng temporal na sugnay
  rationale: Ang δέ ay panandang transisyon; hindi na ito isinalin nang hiwalay sapagkat natural nang naipahihiwatig ng “Nang …” ang pag-usad ng salaysay.
- source_word: οἱ μαθηταὶ Ἰάκωβος καὶ Ἰωάννης
  choice: mga alagad na sina Santiago at Juan
  rationale: Natural na appositional na anyo sa Tagalog na kapuwa nagpapakilala sa kanila bilang mga alagad at tumutukoy sa kanilang mga pangalan.
- source_word: Κύριε
  choice: Panginoon
  rationale: Karaniwan at marangal na salin ng κύριος bilang tuwirang pagtawag kay Jesus.
- source_word: θέλεις
  choice: gusto mo bang
  rationale: Malinaw at kasalukuyang Tagalog para sa pagnanais o pagpapahintulot na hinihingi ng mga alagad.
- source_word: εἴπωμεν
  choice: utusan naming
  rationale: Bagaman literal na mula sa λέγω, ang pagkakaugnay nito sa infinitibong “bumaba” ay may puwersang pagpapautos. Ang “utusan naming bumaba” ay mas natural sa Tagalog kaysa “sabihin naming bumaba ang apoy” at hindi nagdaragdag ng hiwalay na ritwal na ideya gaya ng “magpababa.”
- source_word: πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ
  choice: bumaba ang apoy mula sa langit
  rationale: 'Pinananatili ang malinaw na larawan at ayos ng pagkilos: apoy na bumababa mula sa langit.'
- source_word: ἀναλῶσαι
  choice: tupukin
  rationale: Ang “tupukin” ay natural na pandiwang Tagalog na nagpapanatili sa larawan ng apoy at sa diwang lubusang pag-ubos o pagwasak.
- source_word: αὐτούς
  choice: sila
  rationale: Tumutukoy sa mga taong Samaritano na tumanggi kay Jesus sa naunang konteksto.
theological_decisions:
- issue: Di-tahasang layon ng ἰδόντες
  choice: Idinagdag ang “ito,” na tumutukoy sa pagtanggi sa naunang talata.
  alternative: “Nang makita iyon” o “Pagkakita nina Santiago at Juan”
  rationale: Walang hayag na layon ang participle sa Griyego, ngunit kailangan ng natural na Tagalog ang kontekstuwal na pantukoy. Hindi nito dinaragdagan ang pangyayari kundi nililinaw ang ugnayan sa talata 53.
- issue: Puwersa ng εἴπωμεν sa infinitibong konstruksyon
  choice: “utusan naming bumaba”
  alternative: “sabihin naming bumaba” o “magpababa kami”
  rationale: Pinananatili ng salin ang ideya ng pagsasalita na may kapangyarihang mag-utos, nang hindi ipinapalagay kung paano nila inaakalang maisasagawa ang makalangit na hatol.
- issue: Kahulugan ng ἀναλῶσαι
  choice: “tupukin”
  alternative: “lipulin” o “sunugin”
  rationale: Pinananatili ang metaporang apoy at ang saklaw na maaaring mangahulugang ubusin o wasakin, nang hindi nagpapasok ng dagdag na teolohikal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “Santiago” bilang nakaugaliang pangalang biblikal para kay Ἰάκωβος at ang inklusibong anyong “naming” dahil kasama sa mungkahi ang dalawang nagsasalita.
