  text: At ginawa nila iyon at pinaupo nila ang lahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “pinahilig nila ang lahat” o “pinagreklina nila ang lahat.” Ang pandiwang Griyego ay tumutukoy sa pag-aayos ng mga tao para kumain, na kadalasang nakahilig ang katawan.
