  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinaupo” sa pangunahing teksto dahil mas natural ito kaysa sa literal na “pinaindayog/pinahimlay” at nananatili ang causative na diwa ng κατακλίνω sa konteksto ng paghahanda sa pagkain.
