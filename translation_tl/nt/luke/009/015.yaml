lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at ang tuloy-tuloy na daloy mula sa naunang utos.
- source_word: ἐποίησαν οὕτως
  choice: ginawa nga nila iyon
  rationale: Natural na Filipino para sa pagtupad sa paraang iniutos; ang “nga” ay nagpapahiwatig na isinagawa nila ang naunang sinabi, nang hindi nagdaragdag ng bagong kahulugan.
- source_word: καὶ
  choice: at
  rationale: Payak na iniuugnay ang kasunod na kilos sa una, gaya ng salaysay sa Griyego.
- source_word: κατέκλιναν
  choice: pinaupo nila
  rationale: Pinananatili ang causative na diwa ng pandiwa—sila ang nag-ayos upang maupo o mahimlay ang mga tao para sa pagkain—sa malinaw at likas na makabagong Filipino.
- source_word: ἅπαντας
  choice: ang lahat
  rationale: Ipinapahayag ang kabuuan ng pangkat at nagsisilbing tuwirang layon ng “pinaupo.”
