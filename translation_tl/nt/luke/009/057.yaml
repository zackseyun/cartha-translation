reference: Luke 9:57
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Καὶ πορευομένων αὐτῶν ἐν τῇ ὁδῷ εἶπέν τις πρὸς αὐτόν· Ἀκολουθήσω σοι ὅπου ⸀ἐὰν ⸀ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/057.yaml
  text: And as they were going along the road[a], someone said to him, “I will follow you wherever you go.”
translation:
  language: tl
  text: Habang naglalakbay sila sa daan, may nagsabi sa kanya, “Susunod ako sa iyo saan ka man pumunta.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “saan ka man umalis” o “saan ka man pumaroon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευομένων αὐτῶν
  choice: Habang naglalakbay sila
  rationale: Ang genitive absolute na may present participle ay nagsasaad ng kasabay at nagpapatuloy na pagkilos. Likas sa modernong Tagalog ang “habang naglalakbay sila” at malinaw ang tagpo.
- source_word: ἐν τῇ ὁδῷ
  choice: sa daan
  rationale: Pinananatili nito ang konkretong tagpuan ng paglalakbay at hindi inaalis ang posibleng mas malawak na alingawngaw ng motibo ng paglalakbay sa Lucas.
- source_word: εἶπέν τις
  choice: may nagsabi
  rationale: Hindi tiyak ang τις at walang tahasang pagtukoy sa kasarian, kaya hindi dinaragdagan ng “isang lalaki.”
- source_word: πρὸς αὐτόν
  choice: sa kanya
  rationale: Ito ang natural na katumbas sa Tagalog kapag ginagamit ang πρός kaugnay ng pagsasalita.
- source_word: Ἀκολουθήσω σοι
  choice: Susunod ako sa iyo
  rationale: Ipinapahayag ng future indicative ang matibay na balak o pangako. Pinananatili ng “susunod” kapwa ang literal na pagsama at ang pahiwatig ng pagiging alagad.
- source_word: ὅπου ἐὰν ἀπέρχῃ
  choice: saan ka man pumunta
  rationale: Ipinahahayag ng ὅπου na may ἐάν at subjunctive ang di-tiyak at walang-limitasyong “saan man.” Natural ang “pumunta,” samantalang maaaring maging labis na espesipiko ang “umalis.”
theological_decisions:
- issue: Pahiwatig ng pagiging alagad sa ἀκολουθέω
  choice: “Susunod ako sa iyo” nang walang paliwanag na idinagdag sa mismong talata
  alternative: “Magiging alagad mo ako”
  rationale: May malinaw na kahulugang nauugnay sa pagiging alagad ang pandiwa sa Lucas, ngunit pinananatili ng “susunod” ang parehong literal at teolohikal na antas nang hindi nilulutas ang kanilang ugnayan sa pamamagitan ng pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “may nagsabi” upang hindi magdagdag ng kasariang wala sa Griyego. Inilagay ang panandang [a] pagkatapos ng pangungusap na tinutukoy nito.
