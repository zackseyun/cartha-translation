source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ τοὺς λόγους τούτους ὡσεὶ ἡμέραι ὀκτὼ ⸀καὶ παραλαβὼν Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον ἀνέβη εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/028.yaml
  text: About eight days after these sayings[b][a], he took Peter and John and James and went up on the mountain to pray.
translation:
  language: tl
  text: Mga walong araw pagkatapos ng mga salitang ito[a], isinama niya sina Pedro, Juan, at Santiago at umakyat siya sa bundok upang manalangin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga sinabi.” Ang Griyegong λόγους ay maaaring mangahulugang “mga salita” o “mga sinabi” rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: (hindi tuwirang isinalin)
  rationale: Nagsisilbi itong panandang pasalaysay sa Griyego. Natural nang naihahatid sa Filipino ang paglipat ng tagpo sa pagsisimula sa pariralang χρονolohikal, kaya hindi kailangan ang mekanikal na “At nangyari.”
- source_word: ὡσεὶ ἡμέραι ὀκτὼ
  choice: Mga walong araw
  rationale: Pinananatili ng “mga” ang pagtatantiya ng ὡσεὶ at hindi ginagawang eksakto ang bilang.
- source_word: μετὰ τοὺς λόγους τούτους
  choice: matapos sabihin ni Jesus ang mga ito
  rationale: Tumutukoy ang λόγους sa naunang mga sinabi. Likas sa Filipino ang pandiwang anyo; nilinaw ang di-tahasang tagapagsalita bilang si Jesus mula sa agarang konteksto.
- source_word: παραλαβὼν Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: isinama niya sina Pedro, Juan, at Santiago
  rationale: Ang “isinama” ay natural na naghahayag ng pagkuha sa mga alagad upang sumama sa kaniya. Ginamit ang “sina” para sa listahan ng mga pangalan.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: umakyat sila sa bundok
  rationale: Pinananatili ng “umakyat” ang paitaas na kilos. Ang maramihang “sila” ay natural sa Filipino dahil kapwa umakyat si Jesus at ang tatlong isinama niya, bagaman isahan ang pangunahing pandiwa sa Griyego.
- source_word: προσεύξασθαι
  choice: upang manalangin
  rationale: Malinaw na ipinapahayag ng “upang” ang layuning taglay ng infinitibo.
theological_decisions:
- issue: Tinatayang panahon kaugnay ng mga kaagapay na salaysay
  choice: Mga walong araw
  alternative: Walong araw / Pagkaraan ng anim na araw
  rationale: Tahasang nagpapahiwatig ng pagtatantiya ang ὡσεὶ. Hindi ito ginawang eksakto o itinugma sa bilang na nasa mga kaagapay na salaysay.
- issue: Hindi tahasang simuno ng προσεύξασθαι
  choice: upang manalangin
  alternative: upang manalangin si Jesus / upang manalangin sila
  rationale: Hindi tinutukoy ng salin kung si Jesus lamang o ang buong pangkat ang mananalangin. Sa ganitong paraan, napapanatili ang saklaw na hindi tahasang nilulutas ng infinitibo sa pangungusap.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Iniwasan ang makalumang “datapwat” at ang mekanikal na “at nangyari.” Ginamit ang karaniwang pangalang “Santiago” para kay Ἰάκωβος ayon sa nakaugaliang anyo sa Bibliyang Filipino.
