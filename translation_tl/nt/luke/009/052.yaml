reference: Luke 9:52
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν ἀγγέλους πρὸ προσώπου αὐτοῦ. καὶ πορευθέντες εἰσῆλθον εἰς κώμην Σαμαριτῶν, ⸀ὡς ἑτοιμάσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/052.yaml
  text: And he sent messengers ahead of him[b][a]. And they went and entered a village of the Samaritans to prepare for him.
translation:
  language: tl
  text: At nagsugo siya ng mga mensahero na mauuna sa kanya.[a] Pumunta sila at pumasok sa isang nayon ng mga Samaritano[b] upang maghanda para sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sa harap niya,” mula sa idyomang “sa harap ng kanyang mukha.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “isang nayong Samaritano.” Mas literal sa Griyego ang “isang nayon ng mga Samaritano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: nagsugo
  rationale: Likas at malinaw na katumbas ng aorist na ἀποστέλλω sa konteksto ng pagpapadala ng mga kinatawan.
- source_word: ἀγγέλους
  choice: mga mensahero
  rationale: Mga taong isinugo ang tinutukoy sa salaysay, hindi mga anghel; pinananatili ng “mga mensahero” ang angkop na kahulugan ng salita sa konteksto.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: na mauuna sa kanya
  rationale: Idyoma itong literal na tumutukoy sa pagiging nasa harap ng kanyang mukha o presensiya; natural na ipinahahayag sa Filipino bilang pag-una sa kanya sa paglalakbay.
- source_word: πορευθέντες
  choice: Pumunta sila
  rationale: 'Ang aorist participle ay ginawang likas na sugnay sa Filipino at pinananatili ang pagkakasunod: pumunta muna sila at saka pumasok.'
- source_word: εἰσῆλθον
  choice: pumasok
  rationale: Direkta at natural na katumbas ng aorist ng εἰσέρχομαι.
- source_word: κώμην
  choice: isang nayon
  rationale: Ang κώμη ay karaniwang maliit na pamayanan, kaya mas tiyak ang “nayon” kaysa “bayan.”
- source_word: Σαμαριτῶν
  choice: ng mga Samaritano
  rationale: Tuwirang pinananatili ang genitive plural ng Griyego, na maaaring tumukoy sa nayong tinitirhan o pag-aari ng mga Samaritano.
- source_word: ὡς ἑτοιμάσαι αὐτῷ
  choice: upang maghanda para sa kanya
  rationale: Ipinahahayag ng ὡς at infinitive ang layunin. Hindi tinutukoy ng Griyego kung ano mismo ang ihahanda, kaya hindi rin ito dinagdagan sa salin.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kanya” sa halip na mas pormal na “kaniya” upang maging natural sa karaniwang mambabasa, habang pinanatili ang malinaw na daloy at ang hindi tahasang layon ng paghahanda.
