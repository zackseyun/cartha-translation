  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀αὐτῷ· Ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς, σὺ δὲ ἀπελθὼν διάγγελλε τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/060.yaml
  text: But he said to him[a], “Leave the dead to bury their own dead, but you, go and proclaim the kingdom of God.”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanya[a], “Hayaan mong ilibing ng mga patay ang sarili nilang mga patay. Ngunit ikaw, humayo ka at ipahayag mo ang kaharian ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na patalinghaga ang unang “mga patay” (mga taong hindi tumutugon sa Diyos), samantalang tumutukoy sa mga taong pisikal na namatay ang ikalawa. Iisang salita ang ginamit sa Griyego sa dalawang lugar, kaya pinanatili rin dito ang pag-uulit.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφες
  choice: Hayaan mong
  rationale: Ang aorist imperative ng ἀφίημι ay isang tuwirang utos na ipaubaya sa iba ang gawaing hinihiling; natural at matatag sa Filipino ang “Hayaan mong” sa ganitong kayarian.
- source_word: τοὺς νεκροὺς ... τοὺς ἑαυτῶν νεκρούς
  choice: ang mga patay ... ang sarili nilang mga patay
  rationale: Pinananatili ang pag-uulit ng “mga patay” upang mapanatili ang matalim na paradokso at hindi tahasang lutasin ang magkaibang posibleng diwa ng dalawang banggit.
- source_word: θάψαι
  choice: ilibing
  rationale: Karaniwang katumbas ng infinitive na θάψαι at malinaw na nagsasaad ng gawaing ipinauubaya sa mga patay.
- source_word: ἑαυτῶν
  choice: sarili nilang
  rationale: Ipinapakita nito ang diin ng reflexive pronoun, na mas tiyak kaysa sa payak na “kanilang.”
- source_word: ἀπελθὼν
  choice: humayo ka at
  rationale: Bagaman participle ang anyong Griyego, natural na naihahayag sa Filipino ang pagkakasunod nito sa pangunahing utos sa pamamagitan ng magkaugnay na “humayo ka at ipahayag mo.”
- source_word: διάγγελλε
  choice: ipahayag mo
  rationale: Ipinahihiwatig ng present imperative ang patuloy at hayagang pagpapahayag; ang “ipahayag” ay dignificado, malinaw, at angkop sa mensahe tungkol sa kaharian.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Ito ang likas at kinikilalang salin na nagpapanatili kapwa sa larawan ng kaharian at sa diwa ng paghahari ng Diyos.
theological_decisions:
- issue: Ang kahulugan ng “mga patay” sa una at ikalawang pagbanggit
  choice: Panatilihin ang “mga patay” sa dalawang pagbanggit nang hindi dinaragdagan ng “patay sa espiritu” sa pangunahing teksto.
  alternative: Hayaan mong ilibing ng mga patay sa espiritu ang sarili nilang mga patay.
  rationale: Parehong νεκρούς ang ginamit sa Griyego. Malamang na patalinghaga ang una at literal ang ikalawa, ngunit ang paglilinaw nito sa pangunahing teksto ay mag-aalis sa sinadyang tindi at tensiyon ng pananalita ni Jesus.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Pinili ang “humayo” sa halip na mas kolokyal na “pumunta” upang tumugma sa solemneng utos, habang nananatiling pamilyar sa karaniwang mambabasa.
