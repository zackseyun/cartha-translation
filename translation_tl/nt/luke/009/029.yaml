id: LUK.9.29
reference: Luke 9:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον καὶ ὁ ἱματισμὸς αὐτοῦ λευκὸς ἐξαστράπτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/029.yaml
  text: And as he was praying[a], the appearance of his face became different, and his clothing became white[b], flashing like lightning.
translation:
  language: tl
  text: Habang nananalangin siya, nag-iba[a] ang anyo ng kanyang mukha, at naging puti ang kanyang kasuotan, kumikislap na parang kidlat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “naging iba ang anyo ng kanyang mukha.”
    reason: lexical_alternative
  - marker: b
    text: O, “naging puti at nakasisilaw ang kanyang kasuotan”; ang salitang Griyego ay naglalarawan ng pagkislap na tulad ng kidlat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν
  choice: Habang nananalangin siya
  rationale: Ipinahahayag ng konstruksyong ito sa estilo ni Lucas na naganap ang kasunod na pangyayari habang nananalangin si Jesus. Natural sa makabagong Tagalog ang “habang” at hindi na kailangang isama ang literal ngunit mabigat na “at nangyari.”
- source_word: τὸ εἶδος τοῦ προσώπου αὐτοῦ
  choice: ang anyo ng kanyang mukha
  rationale: Ang εἶδος ay tumutukoy rito sa nakikitang anyo o hitsura. Ang “anyo ng kanyang mukha” ay malinaw at marangal nang hindi nagpapahiwatig ng pagbabago sa likas na pagkatao.
- source_word: ἕτερον
  choice: nag-iba
  rationale: Literal itong “iba” o “naiiba.” Ang “nag-iba” ay likas na pagpapahayag sa Tagalog ng nakikitang pagbabagong ipinahihiwatig ng sugnay, nang hindi hinahango ang mas tiyak na pananalita ng mga kaagapay na salaysay.
- source_word: ὁ ἱματισμὸς αὐτοῦ
  choice: kanyang kasuotan
  rationale: Ang ἱματισμός ay tumutukoy sa damit o kasuotan. Ang “kasuotan” ay natural, bahagyang marangal, at angkop sa salaysay.
- source_word: λευκὸς
  choice: naging puti
  rationale: Tuwirang nangangahulugang “puti” ang λευκός. Ginamit ang “naging” upang natural na maipahayag sa Tagalog ang pagbabagong nagaganap sa konteksto, habang inilalaan sa kasunod na participle ang paglalarawan sa ningning.
- source_word: ἐξαστράπτων
  choice: kumikislap na parang kidlat
  rationale: Nagpapahiwatig ang salita ng pagningning o pagkislap na tulad ng kidlat. Pinananatili ng saling ito ang matingkad na larawan ng Griyego kaysa sa pangkalahatang “nakasisilaw.”
theological_decisions:
- issue: Paglalarawan sa pagbabagong-anyo ni Jesus
  choice: Ilarawan ang nakikitang pagbabago sa anyo ng kanyang mukha ayon sa maingat na pananalita ni Lucas.
  alternative: “Nagliwanag ang kanyang mukha” o “nabago ang kanyang mukha.”
  rationale: Tunay at nakikita ang pagbabago, ngunit hindi tahasang sinasabi ni Lucas rito na nagliwanag ang mukha. Iniiwasan ng salin ang pag-aangkat ng mas tiyak na pananalita mula sa mga kaagapay na Ebanghelyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nananalangin,” “anyo,” at “kasuotan” upang mapanatili ang dignidad ng salaysay nang hindi nagiging makaluma o teknikal.
