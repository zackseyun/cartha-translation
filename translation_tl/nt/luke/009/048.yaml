id: LUK.9.48
reference: Luke 9:48
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὃς ⸀ἂν δέξηται τοῦτο τὸ παιδίον ἐπὶ τῷ ὀνόματί μου ἐμὲ δέχεται, καὶ ὃς ⸁ἂν ἐμὲ δέξηται δέχεται τὸν ἀποστείλαντά με· ὁ γὰρ μικρότερος ἐν πᾶσιν ὑμῖν ὑπάρχων οὗτός ⸀ἐστιν μέγας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/048.yaml
  text: And he said to them[a], “Whoever receives this child in my name receives me, and whoever receives me receives the one who sent me[b]. For the one who is least among all of you—this one is great.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Ang sinumang tumanggap sa batang ito sa aking pangalan[a] ay tumatanggap sa akin; at ang sinumang tumanggap sa akin ay tumatanggap sa nagsugo sa akin. Sapagkat ang siyang pinakamababa sa inyong lahat ang siyang dakila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil sa aking pangalan” o “batay sa aking pangalan.” Ipinahihiwatig ng parirala ang pagtanggap na kaugnay ng pangalan, awtoridad, o pagkatawan ni Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξηται / δέχεται
  choice: tumanggap
  rationale: Pinananatili ng “tumanggap” ang pag-uulit ng pandiwang Griyego at maaari itong tumukoy kapwa sa pagtanggap bilang pakikitungo at sa malugod na pagtanggap.
- source_word: παιδίον
  choice: bata
  rationale: Ang “bata” ang payak at likas na katumbas; hindi kailangang idagdag ang “maliit” sapagkat hindi sapilitan dito ang diminutibong diwa.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: dahil sa aking pangalan
  rationale: Likas ito sa modernong Tagalog at ipinahihiwatig na ang pagtanggap ay ginagawa kaugnay ng pangalan, awtoridad, o pagkatawan kay Jesus, nang hindi ito nililimitahan sa isang diwa lamang.
- source_word: τὸν ἀποστείλαντά με
  choice: sa nagsugo sa akin
  rationale: Malinaw at tuwirang isinasalin ang substantibong participle nang hindi tahasang pinapangalanan ang Ama o ang Diyos, gaya rin ng Griyego.
- source_word: μικρότερος
  choice: pinakamababa
  rationale: Sa kontekstong panlipunan, ang salita ay tumutukoy sa mababang katayuan o pagpapakumbaba, hindi pangunahin sa pisikal na laki o edad.
- source_word: ἐν πᾶσιν ὑμῖν
  choice: sa inyong lahat
  rationale: Ipinakikita nito ang kalagayan ng isang tao sa loob ng buong pangkat sa natural na Tagalog.
- source_word: ὑπάρχων
  choice: itinuturing na
  rationale: Ipinahahayag nito nang natural ang pagiging nasa kalagayang pinakamababa sa loob ng pangkat; iniiwasan ang matigas na literal na “umiiral bilang.”
- source_word: οὗτός ἐστιν μέγας
  choice: siya ang dakila
  rationale: Ang ayos na “siya ang” ay nagpapanatili ng mariing pagtukoy ng οὗτος at ng kabalintunaan ng tunay na kadakilaan.
- source_word: Ὃς ἂν ... καὶ ὃς ἂν
  choice: Ang sinumang ... at ang sinumang
  rationale: Natural at malinaw nitong ipinapahayag ang pangkalahatang kondisyong walang tiyak na tinutukoy.
- source_word: καὶ εἶπεν αὐτοῖς
  choice: At sinabi niya sa kanila
  rationale: Tuwirang sinasalamin ang panimulang καί nang hindi nagdaragdag ng tahasang temporal na diwa.
theological_decisions:
- issue: Tinutukoy ng “nagsugo sa akin”
  choice: Pinanatiling di-tahasang tumutukoy sa Ama o Diyos.
  alternative: “sa Ama na nagsugo sa akin” o “sa Diyos na nagsugo sa akin”
  rationale: Hindi tuwirang pinangalanan sa Griyego ang nagsugo; kaya pinananatili ang pahayag tungkol sa pagsusugo kay Jesus nang walang idinagdag na pangalan.
- issue: Kahulugan ng pagtanggap sa bata kaugnay ng pangalan ni Jesus
  choice: Isinaling “dahil sa aking pangalan,” na nagpapanatili ng kaugnayan sa pangalan, awtoridad, at pagkatawan kay Jesus.
  alternative: “sa aking pangalan,” “alang-alang sa akin,” o “dahil ang bata ay kabilang sa akin”
  rationale: May lawak ang parirala at hindi dapat paliitin sa pangkalahatang kabaitan lamang o sa iisang paliwanag.
- issue: Kabalintunaan ng kadakilaan
  choice: Ang pinakamababa sa pamayanan ang siyang dakila.
  alternative: “ang pinakabata sa inyong lahat ay dakila”
  rationale: Sa konteksto, higit na malamang na katayuan at kababaan ang tinutukoy kaysa edad; pinananatili nito ang matalim na pagbaligtad ni Jesus sa karaniwang sukatan ng kadakilaan.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Pinanatili ang paulit-ulit na “tumanggap” upang makita ang ugnayan ng pagtanggap sa bata, kay Jesus, at sa nagsugo sa kaniya. Gumamit ng em dash upang idiin ang pangwakas na kabalintunaan.
