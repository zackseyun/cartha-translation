  text: While he was saying these things, a cloud appeared and began to overshadow them; and they were afraid as they entered into the cloud.
translation:
  language: tl
  text: Habang sinasabi pa niya ang mga ito, lumitaw ang isang ulap at nililiman sila nito.[a] Natakot sila habang pumapasok sila sa ulap.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “dumating ang isang ulap at niliman sila nito,” o “nagsimulang lumilim sa kanila.” Maaaring unawain ang pandiwa bilang payak na nagpapatuloy na kilos o bilang pagsisimula ng pagkilim.
    reason: lexical_alternative
  - marker: b
    text: Malamang na ipinapaalala ng ulap ang mga tagpo sa Lumang Tipan kung saan nahahayag ang presensiya ng Diyos, bagaman hindi ito tahasang sinasabi ng talatang ito.
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili nito ang maramihang anyo ng demonstratibo at ang pagtukoy sa mga kasasabi pa lamang ni Pedro.
- source_word: αὐτοῦ λέγοντος
  choice: Habang sinasabi niya
  rationale: Likas na ipinapahayag sa Tagalog ang kasabay at nagpapatuloy na kilos ng genitive absolute na may present participle.
- source_word: ἐγένετο νεφέλη
  choice: lumitaw ang isang ulap
  rationale: Ipinahihiwatig ng ἐγένετο ang pagdating o paglitaw ng ulap nang hindi ipinapaliwanag ang pinagmulan nito.
- source_word: ἐπεσκίαζεν
  choice: nililiman sila
  rationale: Tuwirang inilalarawan ang nagpapatuloy na kilos ng imperfect. Pinananatili ng “nililiman” ang larawan ng ulap na tumatabing o bumabalot nang hindi nagdaragdag ng tahasang teolohikal na paliwanag.
- source_word: ἐφοβήθησαν
  choice: Natakot sila
  rationale: Natural at malinaw na salin ng pagsapit ng takot sa salaysay.
- source_word: ἐν τῷ εἰσελθεῖν αὐτοὺς
  choice: habang pumapasok sila
  rationale: Ipinapahayag ang kasabay na panahon ng articular infinitive at pinananatili ang αὐτούς bilang simuno ng pagpasok.
- source_word: εἰς τὴν νεφέλην
  choice: sa ulap
  rationale: Sa pandiwang “pumapasok,” likas nang ipinahihiwatig ng “sa ulap” ang pagkilos paloob, gaya ng εἰς.
theological_decisions:
- issue: Ang kalikasan ng ulap at ang kahulugan ng pagkilim nito
  choice: Inilarawan lamang bilang ulap na lumitaw at lumilim sa kanila
  alternative: Tahasang tawagin itong ulap ng presensiya o kaluwalhatian ng Diyos
  rationale: Malakas ang alingawngaw ng mga tagpo sa Lumang Tipan tungkol sa nahahayag na presensiya ng Diyos, ngunit hindi ito tahasang ipinaliliwanag ng talata. Pinananatili ng salin ang larawan at teolohikal na pahiwatig nang hindi ito nilulutas sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “ulap,” “nililiman,” at “natakot” upang manatiling madaling maunawaan habang pinananatili ang larawan at posibleng teolohikal na alingawngaw ng Griyego.
