  text: ὃς γὰρ ἂν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους, τοῦτον ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται, ὅταν ἔλθῃ ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/026.yaml
  text: For whoever is ashamed of me and of my words[b][a], the Son of Man will be ashamed of him when he comes in his glory and the glory of the Father and of the holy angels.
translation:
  language: tl
  text: Sapagkat ang sinumang ikahiya ako at ang aking mga salita, siya[a] ay ikahihiya rin ng Anak ng Tao kapag dumating siya sa kanyang kaluwalhatian at sa kaluwalhatian ng Ama at ng mga banal na anghel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ang taong ito.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring katawanin ang kayarian ng Griyego bilang: “kapag dumating siya sa kanyang kaluwalhatian, at sa kaluwalhatian ng Ama at ng mga banal na anghel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν
  choice: Sapagkat ang sinumang
  rationale: Pinagsasama nito ang paliwanag na puwersa ng γάρ (“sapagkat”) at ang pangkalahatang di-tiyak na diwa ng ὃς ... ἄν (“ang sinumang”).
- source_word: ἐπαισχυνθῇ ... ἐπαισχυνθήσεται
  choice: ikahiya ... ay ikahihiya rin
  rationale: Pinananatili ang iisang salitang-ugat at ang sinadyang pagtutumbasan ng dalawang anyo ng ἐπαισχύνομαι. Ang “ikahiya” ay mas angkop dito kaysa sa simpleng “mahiya,” sapagkat may tuwirang layon itong tao at mga salita.
- source_word: με καὶ τοὺς ἐμοὺς λόγους
  choice: ako at ang aking mga salita
  rationale: Tuwirang pinananatili ang pagkakaiba ng persona ni Jesus at ng kanyang λόγοι, sa halip na ipakahulugang “ang sinasabi ko.”
- source_word: τοῦτον
  choice: siya
  rationale: Natural na panumbalik na panghalip sa Filipino para sa “ang sinuman.” Hindi nagpapahiwatig ng kasarian ang “siya”; inilalahad sa talababa ang mas literal na demonstratibong anyo.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Itinatag na salin ng titulo na nagpapanatili sa anyo ng Griyego at sa ugnay nito sa mas malawak na biblikal na tradisyon.
- source_word: ὅταν ἔλθῃ
  choice: kapag dumating siya
  rationale: Natural na Filipino para sa panghinaharap na temporal na diwa ng ὅταν kasama ng aorist subjunctive.
- source_word: ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων
  choice: sa kanyang kaluwalhatian at sa kaluwalhatian ng Ama at ng mga banal na anghel
  rationale: Nililinaw sa Filipino ang ipinagpapatuloy na diwa ng δόξῃ sa magkakasunod na genitive, habang pinananatili sa talababa ang posibleng representasyon ng iisang pariralang pinangungunahan ng ἐν.
- source_word: τῶν ἁγίων ἀγγέλων
  choice: ng mga banal na anghel
  rationale: Tuwiran at likas na salin ng pang-uri at pangngalan, na pinananatili ang marangal na rehistro.
theological_decisions:
- issue: Ang panumbalik na reperensiya sa taong kabilang sa pangkalahatang babala
  choice: siya
  alternative: ang taong iyon
  rationale: Saklaw ng “siya” ang sinumang tao nang hindi binabago ang isahan ng Griyego. Hindi nito nililimitahan sa lalaki ang babala, samantalang ipinapakita ng talababa ang demonstratibong diin ng τοῦτον.
- issue: Ang kaluwalhatiang kaugnay ng Anak ng Tao, ng Ama, at ng mga banal na anghel
  choice: sa kanyang kaluwalhatian at sa kaluwalhatian ng Ama at ng mga banal na anghel
  alternative: sa kaluwalhatian niya, ng Ama, at ng mga banal na anghel
  rationale: Hindi pinagpapasyahan nang higit sa teksto kung paano eksaktong nauugnay o ibinabahagi ang kaluwalhatian. Nililinaw ng pangunahing salin ang Filipino, at pinananatili ng talababa ang mas siksik na kayarian ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ikahiya” upang mapanatili ang matinding ugnayang diwa at ang pagtutumbasan ng pandiwa; iniwasan ang mas mapagpasyang “itakwil” o “itatuwa.”
