  text: καὶ ἀπέστειλεν αὐτοὺς κηρύσσειν τὴν βασιλείαν τοῦ θεοῦ καὶ ἰᾶσθαι ⸂τοὺς ἀσθενεῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/002.yaml
  text: And he sent them out to proclaim the kingdom of God and to heal the sick,[a]
translation:
  language: tl
  text: At isinugo niya sila upang ipahayag ang kaharian ng Diyos[a] at pagalingin ang mga maysakit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “paghahari ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: isinugo
  rationale: Ang ἀποστέλλω ay nangangahulugang magsugo o magpadala. Ang “isinugo” ay likas sa Filipino at malinaw na nagpapahiwatig ng atas, nang hindi nagdaragdag sa diwa.
- source_word: κηρύσσειν
  choice: ipahayag
  rationale: Ang κηρύσσω ay tumutukoy sa hayagang pagpapahayag. Mas malinaw at hindi gaanong nakatali sa wikang pansimbahan ang “ipahayag” kaysa “ipangaral.”
- source_word: βασιλείαν τοῦ θεοῦ
  choice: kaharian ng Diyos
  rationale: Pinananatili ng “kaharian ng Diyos” ang lawak ng parirala, na maaaring tumukoy sa paghahari at sa saklaw nito, at ito rin ang likas at nakaugaliang salin sa Filipino.
- source_word: ἰᾶσθαι
  choice: pagalingin
  rationale: Sa konteksto, ang ἰάομαι ay nangangahulugang magpagaling ng karamdaman. Ang “pagalingin” ang tuwiran at natural na katumbas.
- source_word: τοὺς ἀσθενεῖς
  choice: mga maysakit
  rationale: Bagaman maaaring mangahulugan ang ἀσθενής na mahina, nililinaw ng pandiwang “pagalingin” na mga taong may karamdaman ang tinutukoy rito.
theological_decisions:
- issue: Saklaw ng βασιλεία τοῦ θεοῦ
  choice: kaharian ng Diyos
  alternative: paghahari ng Diyos
  rationale: Maaaring idiin ng parirala ang paghahari ng Diyos o ang kahariang saklaw ng paghaharing iyon. Pinananatili ng pangunahing salin ang mas malawak at nakaugaliang konsepto, habang inilalahad sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “isinugo” upang maipakita ang komisyong ibinigay, at “ipahayag” upang mapanatili ang pampublikong diwa ng κηρύσσειν nang hindi maging labis na pansimbahan.
