  source_fidelity: 'Tumpak na naisasalin ang dalawang layunin ng pagsusugo: ang hayagang pagpapahayag ng kaharian ng Diyos at ang pagpapagaling sa mga maysakit. Ang “isinugo” ay angkop sa ἀπέστειλεν, at ang “ipahayag” ay maayos na katumbas ng κηρύσσειν nang hindi nagdaragdag ng partikular na denominasyonal na kulay.'
  naturalness: 'Likas at malinaw ang modernong Filipino: “At isinugo niya sila upang ipahayag ang kaharian ng Diyos at pagalingin ang mga maysakit.” Ang magkatambal na infinitibong parirala ay maayos at marangal ang rehistro.'
  terminology: Ang “kaharian ng Diyos” ay matatag at malawak na katumbas ng βασιλεία τοῦ θεοῦ. Wasto at kapaki-pakinabang ang talababa na “O ‘paghahari ng Diyos,’” sapagkat ipinakikita nito ang leksikal na alternatibo nang hindi pinipilit ang isang makitid na pagpapakahulugan. Ang “mga maysakit” ay wastong kontekstuwal na salin ng τοὺς ἀσθενεῖς.
