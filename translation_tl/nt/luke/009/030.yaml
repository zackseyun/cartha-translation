id: LUK.9.30
reference: Luke 9:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνδρες δύο συνελάλουν αὐτῷ, οἵτινες ἦσαν Μωϋσῆς καὶ Ἠλίας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/030.yaml
  text: And behold, two men were talking with him, who were Moses and Elijah,
translation:
  language: tl
  text: At masdan, may dalawang lalaking nakikipag-usap sa kanya—sina Moises at Elias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: masdan
  rationale: Pinananatili ang biglaang pantawag-pansin at kasiglahan ng salaysay ni Lucas sa isang marangal ngunit nauunawaang salitang Filipino.
- source_word: ἄνδρες δύο
  choice: dalawang lalaki
  rationale: Tuwirang ipinahahayag ng ἀνήρ na mga lalaking tao ang dalawang tauhang kalauna'y kinilalang sina Moises at Elias.
- source_word: συνελάλουν
  choice: nakikipag-usap
  rationale: Ipinahihiwatig ng anyong imperpekto ang nagpapatuloy na pag-uusap, at likas na ipinakikita ng 'nakikipag-usap' ang gantihang kilos.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Kasama ng συλλαλέω, tumutukoy ang datibo sa kausap; sa Filipino, likas ang pariralang 'nakikipag-usap sa kanya.'
- source_word: οἵτινες ἦσαν
  choice: sina
  rationale: Sa kontekstong ito, kinikilala lamang ng sugnay ang dalawang lalaki. Ang 'sina' ay maikli at likas na paraan sa Filipino upang ipakilala ang dalawang pangalang pantangi nang hindi nagdaragdag ng interpretasyon.
- source_word: Μωϋσῆς
  choice: Moises
  rationale: Karaniwang anyo ng pangalan sa makabagong Bibliyang Filipino.
- source_word: Ἠλίας
  choice: Elias
  rationale: Karaniwang anyo ng pangalan ng propeta sa Filipino at malinaw na katumbas ng Ἠλίας.
theological_decisions:
- issue: Pagkakakilanlan sa dalawang lalaking nagpakita sa pagbabagong-anyo
  choice: Tuwirang kinikilala sila bilang sina Moises at Elias.
  alternative: Dagdagan ng paliwanag tungkol sa kanilang sagisag o eskatolohikal na papel.
  rationale: Walang gayong paliwanag sa talata. Pinananatili ng salin ang tuwirang pagkakakilanlan nang hindi nagpapasok ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang 'masdan' upang mapanatili ang puwersa ng ἰδοὺ; ang gitling na pahaba ay malinaw na nag-uugnay sa pagkakakilanlan ng dalawang lalaki.
