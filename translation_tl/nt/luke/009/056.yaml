id: LUK.9.56
reference: Luke 9:56
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀καὶ ἐπορεύθησαν εἰς ἑτέραν κώμην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/056.yaml
  text: And they went on to another village[a].
translation:
  language: tl
  text: At pumunta sila sa ibang nayon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isa pang nayon.” Maaaring idiin ng salitang Griyego ang pagiging naiiba, hindi lamang ang pagdaragdag ng isa pa.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pag-uugnay sa naunang salaysay nang hindi nagdaragdag ng tahasang diwang temporal.
- source_word: ἐπορεύθησαν
  choice: pumunta sila
  rationale: Likas at tuwirang salin ng pandiwang πορεύομαι sa aorist, na nagsasaad ng pagpunta o pagpapatuloy sa ibang lugar.
- source_word: εἰς
  choice: sa
  rationale: Karaniwang gamit sa Filipino upang tukuyin ang patutunguhan kasunod ng pandiwang “pumunta.”
- source_word: ἑτέραν
  choice: ibang
  rationale: Maaaring mangahulugang “isa pa” o “naiiba.” Ang “ibang” ay natural sa Filipino at nagpapanatili sa diwa ng pagpunta sa nayong hindi yaong naunang binanggit.
- source_word: κώμην
  choice: nayon
  rationale: Tumpak na tumutukoy sa isang maliit o rural na pamayanan, hindi sa mas malaking lungsod.
theological_decisions: []
translation_notes:
  register: Makabago, payak, at marangal na Filipino. Ginamit ang “nayon” bilang tumpak at madaling maunawaang katumbas ng κώμη, at pinanatili sa talababa ang saklaw ng kahulugan ng ἑτέραν.
