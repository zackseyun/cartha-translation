reference: Luke 9:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Δότε αὐτοῖς ⸂ὑμεῖς φαγεῖν⸃. οἱ δὲ εἶπαν· Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ ⸂ἄρτοι πέντε⸃ καὶ ἰχθύες δύο, εἰ μήτι πορευθέντες ἡμεῖς ἀγοράσωμεν εἰς πάντα τὸν λαὸν τοῦτον βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/013.yaml
  text: But he said to them[a], “You give them something to eat.” But they said[b], “We have no more than five loaves and two fish—unless we go and buy food for all this people.”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanila[a], “Kayo ang magbigay sa kanila ng makakain.” Sumagot sila, “Wala tayong higit sa limang tinapay at dalawang isda—maliban na lamang kung kami mismo ang pupunta at bibili ng pagkain para sa lahat ng taong ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Kayo mismo ang magbigay sa kanila ng makakain.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δότε αὐτοῖς ὑμεῖς φαγεῖν
  choice: Kayo ang magbigay sa kanila ng makakain
  rationale: Likas sa modernong Tagalog ang “magbigay ... ng makakain,” at malinaw na naipapahayag ng “Kayo ang” ang diin ng tahasang ὑμεῖς nang hindi labis na pinatitindi ang tono.
- source_word: Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ
  choice: Wala tayong higit sa
  rationale: Pinananatili nito ang limitasyong ipinahihiwatig ng negasyon at ng πλεῖον ἢ, sa natural na anyong Tagalog.
- source_word: ἄρτοι πέντε
  choice: limang tinapay
  rationale: Sa Tagalog, ang bilang na “lima” ay sapat upang ipakitang limang magkakahiwalay na piraso o bilog ng tinapay ang tinutukoy; hindi natural ang literal na “limang loaf.”
- source_word: ἰχθύες δύο
  choice: dalawang isda
  rationale: Tuwirang salin at karaniwang pananalita sa Tagalog.
- source_word: εἰ μήτι
  choice: maliban na lamang kung
  rationale: Ipinahahayag nito ang eksepsiyon at bahagyang nag-aatubiling o retorikal na himig ng parirala nang hindi nagdaragdag ng hayagang pagkainis.
- source_word: πορευθέντες ἡμεῖς ἀγοράσωμεν
  choice: kami mismo ang pupunta at bibili
  rationale: Ginagawang likas na magkakaugnay na mga pandiwa sa Tagalog ang participle at subjunctive. Ang “kami mismo” ay kumakatawan sa tahasang ἡμεῖς at sa praktikal na diin ng tugon.
- source_word: πάντα τὸν λαὸν τοῦτον
  choice: lahat ng taong ito
  rationale: Pinananatili ang kolektibong λαός at demonstratibong τοῦτον. Hindi ito awtomatikong ginawang “karamihan,” bagaman posible iyon ayon sa konteksto.
- source_word: βρώματα
  choice: pagkain
  rationale: Natural na pangkalahatang katawagan sa Tagalog para sa mga bagay na makakain sa kontekstong ito.
theological_decisions:
- issue: Diin sa utos ni Jesus at tono ng tugon ng mga alagad
  choice: Kayo ang magbigay sa kanila ng makakain
  alternative: Kayo mismo ang magbigay sa kanila ng makakain
  rationale: Ipinapakita ng hulma na “Kayo ang” ang diin ng ὑμεῖς, ngunit hindi nito dinaragdagan ang utos ng mas matinding pagsaway o panunumbat kaysa sa malinaw na taglay ng Griyego.
- issue: Kahulugan ng tugon ng mga alagad
  choice: Iharap ito bilang praktikal na pagtutol, nang walang idinagdag na pagkainis o pangungutya
  alternative: Gawing mas padamdam o mas mainis ang kanilang sagot
  rationale: Walang tahasang panandang emosyonal sa talata na magbibigay-katwiran sa mas matinding tono; pinananatili ang teolohikal at naratibong tensiyon sa pagitan ng utos at kakulangan nila.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “niya” ayon sa agarang konteksto ng talata at iniwasan ang labis na pormal o lumang pananalita. Ang “lahat ng taong ito” ay sadyang nagpapanatili sa anyo ng λαός sa halip na agad itong ipakahulugang “karamihan.”
