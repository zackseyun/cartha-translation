source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/058.yaml
  text: And Jesus said to him[a], “Foxes have dens, and the birds of the sky have nests[c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: tl
  text: At sinabi sa kanya ni Jesus, “May mga lungga ang mga soro, at may mga pugad ang mga ibon sa himpapawid, ngunit ang Anak ng Tao[a] ay walang mahimlayan ang kanyang ulo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Anak ng Tao” ay madalas na tawag ni Jesus sa kanyang sarili at maaaring umaalingawngaw sa Daniel 7:13–14.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλώπεκες
  choice: mga soro
  rationale: Tuwirang tawag sa hayop; walang dahilan sa konteksto upang gawing mas pangkalahatan ang kahulugan.
- source_word: φωλεούς
  choice: mga lungga
  rationale: Tumutukoy sa tirahan o taguan ng hayop at natural na katambal ng “mga soro” sa Filipino.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: mga ibon sa himpapawid
  rationale: Natural na modernong Filipino para sa mga ibong lumilipad sa kalangitan; iniiwasan din nito ang posibleng pagkaunawa sa “langit” bilang tahanan ng Diyos sa halip na pisikal na kalawakan.
- source_word: κατασκηνώσεις
  choice: mga pugad
  rationale: Bagaman mas malawak ang literal na diwang “mga tuluyan,” ang “mga pugad” ang likas at angkop na tawag sa mga pahingahan o tirahan ng mga ibon sa kontekstong ito.
- source_word: υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang kinikilalang pagtukoy ni Jesus sa kanyang sarili at ang posibleng alusyon sa Daniel 7:13–14 nang hindi ito ipinapakahulugan sa pangunahing teksto.
- source_word: οὐκ ἔχει ποῦ
  choice: walang lugar
  rationale: Idyomatikong ipinahahayag sa Filipino ang literal na “walang kung saan” bilang kawalan ng lugar.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: mahimlayan ng kanyang ulo
  rationale: Pinananatili ang konkretong larawan ng paghilig o pagpapahinga ng ulo at natural na nagpapahiwatig ng lugar na matutulugan.
- source_word: δὲ
  choice: ngunit
  rationale: Malinaw na ipinapakita ang pagsalungat sa pagitan ng mga hayop na may matutuluyan at ng Anak ng Tao na wala nito.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: sinabi sa kanya ni Jesus
  rationale: Tuwiran at natural na salin ng panimulang pahayag sa salaysay.
theological_decisions:
- issue: Ang pagtukoy ni Jesus sa sarili bilang υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  alternative: ang Taong Anak / ang Isang Tao
  rationale: Ang nakaugaliang “Anak ng Tao” ay malapit sa anyo ng Griyego, kinikilala bilang natatanging pagtukoy ni Jesus sa sarili, at nagpapanatili sa posibleng mesiyaniko at apokaliptikong alusyon nang hindi nilulutas ang teolohikal na tensiyon sa pamamagitan ng paraphrase.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “lungga,” “pugad,” at “mahimlayan” upang mapanatili ang konkretong larawan ng mga tirahan at pahingahan, habang nananatiling natural sa karaniwang mambabasa.
