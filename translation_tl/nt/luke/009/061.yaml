id: LUK.9.61
reference: Luke 9:61
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν δὲ καὶ ἕτερος· Ἀκολουθήσω σοι, κύριε· πρῶτον δὲ ἐπίτρεψόν μοι ἀποτάξασθαι τοῖς εἰς τὸν οἶκόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/061.yaml
  text: And another also said[a], “I will follow you, Lord[c][b], but first permit me to say farewell to those in my house.”
translation:
  language: tl
  text: May isa pa ring nagsabi, “Susunod ako sa iyo, Panginoon, ngunit hayaan mo muna akong magpaalam sa mga nasa bahay ko.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga tao sa aking tahanan” o “sa aking sambahayan.”
    reason: Ipinahihiwatig ng pariralang Griyego ang mga taong nasa o kabilang sa tahanan, ngunit hindi nito tahasang tinutukoy kung pamilya lamang o mas malawak na sambahayan.
lexical_decisions:
- source_word: δὲ καὶ ἕτερος
  choice: May isa pa ring nagsabi
  rationale: Natural nitong ipinakikilala ang isa pang tao sa sunod-sunod na pag-uusap at pinananatili ang pandagdag na diwa ng καί.
- source_word: Ἀκολουθήσω σοι
  choice: Susunod ako sa iyo
  rationale: Ipinahahayag ng future indicative ang pasiya o intensiyon ng nagsasalita; malinaw at likas ito sa makabagong Tagalog.
- source_word: κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang saklaw ng tawag kay Jesus—mula sa magalang na pagkilala hanggang sa mas mabigat na teolohikal na kahulugan—nang hindi ito nililimitahan sa “ginoo” o “guro.”
- source_word: πρῶτον δὲ ἐπίτρεψόν μοι
  choice: ngunit hayaan mo muna akong
  rationale: Ipinapakita ng “ngunit” ang kaibahan, ng “muna” ang prayoridad ng πρῶτον, at ng “hayaan mo” ang kahilingan para sa pahintulot sa natural na Tagalog.
- source_word: ἀποτάξασθαι
  choice: magpaalam
  rationale: Sa kontekstong ito, ang middle infinitive ay tumutukoy sa pamamaalam o paghingi ng pahintulot na umalis, hindi lamang sa pag-aayos ng mga gawain.
- source_word: τοῖς εἰς τὸν οἶκόν μου
  choice: sa mga nasa bahay ko
  rationale: Pinananatili nito ang pagtukoy sa mga taong nasa o kaugnay ng tahanan nang hindi awtomatikong nililimitahan sila sa pamilya lamang.
theological_decisions:
- issue: Ang tawag na κύριε kay Jesus
  choice: Panginoon
  alternative: Ginoo; Guro
  rationale: Ang “Panginoon” ay nagpapanatili sa posibleng magalang at teolohikal na bigat ng tawag. Hindi nito tahimik na nilulutas ang saklaw ng pagkilala ng nagsasalita kay Jesus.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “hayaan mo muna akong” sa halip na mas pormal ngunit hindi gaanong likas na “pahintulutan mo muna akong.”
