  verdict: revise
  source_fidelity: Tumpak na naipapahayag ng draft ang isa pang nagsasalita, ang intensiyong sumunod, ang magalang at teolohikal na bukas na “Panginoon,” ang kahilingang mauna, at ang pamamaalam sa mga taong kaugnay ng kanyang tahanan. Ang “mga nasa bahay ko” ay katanggap-tanggap, at nililinaw ng talababa na hindi ito limitado sa pamilya.
  naturalness: Likas at malinaw ang “May isa pa ring nagsabi” at “hayaan mo muna akong magpaalam” sa makabagong Filipino Tagalog. Ang pagkakalagay lamang ng talababa sa dulo ng buong sipi ay hindi malinaw na nakaugnay sa pariralang ipinapaliwanag.
  terminology: Ang “Panginoon” para sa κύριε ay wasto at pinananatili ang saklaw ng pananalita kay Jesus nang hindi ipinapataw ang isang partikular na pagpapakahulugan. Ang “magpaalam” ay angkop para sa ἀποτάξασθαι.
