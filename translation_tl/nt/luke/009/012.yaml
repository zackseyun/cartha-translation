  naturalness: Natural at malinaw ang pangkalahatang ayos, ngunit mas likas sa pasalaysay na nakaraan ang “Nagsimula nang lumubog ang araw.” Ang “paalisin mo ang mga tao” ay isang natural na utos sa kontekstong ito.
