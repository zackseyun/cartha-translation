  text: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν· προσελθόντες δὲ οἱ δώδεκα εἶπαν αὐτῷ· Ἀπόλυσον τὸν ὄχλον, ἵνα ⸀πορευθέντες εἰς τὰς κύκλῳ κώμας ⸀καὶ ἀγροὺς καταλύσωσιν καὶ εὕρωσιν ἐπισιτισμόν, ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/012.yaml
  text: The day began to decline[a], and the twelve came and said to him, “Send the crowd away, so that they may go into the surrounding villages and countryside, find lodging, and get provisions[b], because we are here in a desolate place.”
translation:
  language: tl
  text: Nagsimula nang lumubog ang araw, at lumapit sa kanya ang labindalawa at sinabi, “Paalisin mo ang mga tao upang makapunta sila sa mga nayon at bukirin sa paligid, makahanap ng matutuluyan, at makakuha ng mga panustos[a], sapagkat narito tayo sa isang ilang na lugar.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makahanap ng pagkain.” Ang salitang Griyego na ἐπισιτισμός ay tumutukoy sa mga panustos o suplay ng pagkain.
    reason: lexical_alternative
  - marker: b
    text: O “liblib na lugar.” Ang salitang Griyego na ἔρημος ay maaaring tumukoy sa isang lugar na walang naninirahan o kakaunti ang naninirahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν
  choice: Nagsisimula nang lumubog ang araw
  rationale: Ang κλίνειν kasama ng ἡμέρα ay idyomang tumutukoy sa papalapit na gabi. Natural sa Tagalog ang “lumubog ang araw” at pinananatili nito ang larawang nasa Griyego.
- source_word: προσελθόντες δὲ οἱ δώδεκα
  choice: at lumapit sa kanya ang labindalawa
  rationale: Tuwirang ipinapahayag ng “lumapit” ang προσέρχομαι, habang pinananatili ng “ang labindalawa” ang katawagang gamit sa pangkat.
- source_word: Ἀπόλυσον τὸν ὄχλον
  choice: Pauwiin mo na ang mga tao
  rationale: Sa konteksto, ang ἀπολύω ay pagpapalis o pagpapauwi sa karamihan. Ang “pauwiin” ay natural na utos sa Tagalog, bagaman hindi nito ipinapalagay na iisa ang kanilang tahanan.
- source_word: εἰς τὰς κύκλῳ κώμας καὶ ἀγρούς
  choice: sa mga nayon at bukirin sa palibot
  rationale: Ang κώμαι ay mga nayon, at ang ἀγροί ay maaaring mga bukid o mga pook sa kanayunan. Pinananatili ng “sa palibot” ang κύκλῳ.
- source_word: καταλύσωσιν
  choice: makahanap ng matutuluyan
  rationale: Dito, ang καταλύω ay tumutukoy sa pagtuloy o paghahanap ng lugar na matutuluyan; malinaw at natural ang salin.
- source_word: εὕρωσιν ἐπισιτισμόν
  choice: makakuha ng pagkain
  rationale: Ang ἐπισιτισμός ay pagkain o panustos na pagkain. Ang “pagkain” ang pinakanatural sa modernong Tagalog at hindi lumalampas sa konteksto.
- source_word: ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν
  choice: sapagkat narito tayo sa isang ilang na lugar
  rationale: Ang ἔρημος ay maaaring ilang, liblib, o walang naninirahan. Ang “ilang na lugar” ay maikli at dignidadong paglalarawan nang hindi nagdaragdag ng tiyak na teolohikal na kahulugan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at dignidadong pasalaysay. Ginamit ang “mga tao” para sa kolektibong ὄχλος at iniwasan ang mas pormal ngunit hindi gaanong karaniwang “karamihan.” Ang footnote marker ay inilagay kaagad pagkatapos ng pariralang tinutukoy nito.
