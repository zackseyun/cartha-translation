  text: εἶπεν δὲ ⸂ὁ Ἰησοῦς⸃· Οὐδεὶς ἐπιβαλὼν τὴν ⸀χεῖρα ἐπ’ ἄροτρον καὶ βλέπων εἰς τὰ ὀπίσω εὔθετός ἐστιν ⸂τῇ βασιλείᾳ⸃ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/062.yaml
  text: But Jesus said[b][a], “No one who has put his hand to the plow and looks back is fit for the kingdom of God.”
translation:
  language: tl
  text: Ngunit sinabi ni Jesus, “Walang sinumang naglagay na ng kamay sa araro[a] at lumilingon sa likuran ang angkop[b] para sa kaharian ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “humawak na sa araro.” Ang larawan ay ng isang taong nagsimula nang mag-araro ngunit ibinabaling ang pansin sa likuran.
    reason: lexical_alternative
  - marker: b
    text: O, “naaangkop” o “kapaki-pakinabang.”
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinapahayag ng δέ ang banayad na pagsalungat o paglipat; ang “Ngunit” ay natural sa tugon ni Jesus sa naunang sinabi.
- source_word: Οὐδεὶς
  choice: Walang sinuman
  rationale: Pinananatili nito ang pangkalahatan at mariing negatibong diwa nang walang pahiwatig tungkol sa kasarian.
- source_word: ἐπιβαλὼν τὴν χεῖρα ἐπ’ ἄροτρον
  choice: humawak na sa araro
  rationale: Likas itong Filipino para sa pagsisimula ng pag-aararo at pinananatili ang larawan ng taong nakahawak na sa araro. Ipinahihiwatig ng “na” na nagsimula na ang kilos bago ang patuloy na paglingon.
- source_word: ἄροτρον
  choice: araro
  rationale: Ito ang karaniwan at malinaw na tawag sa kasangkapang pang-agrikultura sa modernong Filipino.
- source_word: βλέπων εἰς τὰ ὀπίσω
  choice: lumilingon sa likuran
  rationale: Ang aspektong nagpapatuloy ng participle ay ipinahahayag ng “lumilingon,” habang pinananatili ng “sa likuran” ang literal na larawan at ang pahiwatig ng nahahating pagtatalaga.
- source_word: εὔθετός
  choice: angkop
  rationale: Ipinahahayag nito ang pagiging akma o nararapat sa isang layunin nang hindi ipinapakahulugang moral na pagkamarapat o tiyak na hatol tungkol sa kaligtasan.
- source_word: τῇ βασιλείᾳ τοῦ θεοῦ
  choice: para sa kaharian ng Diyos
  rationale: Sa kaugnayan nito sa εὔθετος, natural ang “angkop para sa.” Ang “kaharian ng Diyos” ang malinaw at kinikilalang salin na hindi nililimitahan ang βασιλεία sa lugar lamang.
theological_decisions:
- issue: Kahulugan ng εὔθετός ἐστιν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: Isinalin bilang pagiging angkop para sa kaharian ng Diyos.
  alternative: Hindi karapat-dapat pumasok sa kaharian; hindi kapaki-pakinabang sa paglilingkod sa kaharian.
  rationale: Binibigyang-diin ng talinghaga ng pag-aararo ang di-nahahating pagtatalaga ng alagad. Ang εὔθετος ay tumutukoy sa pagiging angkop, kaya pinananatili ng salin ang bigat ng babala nang hindi nagpapasya kung ito ay tuwirang pahayag tungkol sa huling kaligtasan o tungkol lamang sa paglilingkod.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Pinanatili ang konkretong larawang pang-agrikultura at ang teolohikal na tensiyon ng “angkop,” habang iniwasan ang “karapat-dapat,” na maaaring magdagdag ng diwang moral o soteriolohikal na hindi tahasang nasa Griyego.
