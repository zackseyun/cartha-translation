base_translation:
  language: en
  yaml_path: translation/nt/luke/009/043.yaml
  text: 'And they were all astonished at the majesty of God. But while everyone was marveling at all that he was doing[a], he said to his disciples:'
translation:
  language: tl
  text: 'Labis na namangha ang lahat sa kadakilaan ng Diyos. Habang ang lahat ay namamangha sa lahat ng ginagawa niya, sinabi niya sa kanyang mga alagad:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: namangha
  rationale: Ipinahahayag ang matinding pagkamangha na nagaganap noon, sa natural at dignified na modernong Tagalog.
- source_word: πάντες
  choice: silang lahat
  rationale: Pinananatili ang diin na saklaw ang lahat ng naroon.
- source_word: ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ
  choice: sa kadakilaan ng Diyos
  rationale: Ang 'kadakilaan' ay natural na tumutukoy sa greatness, grandeur, o majesty ng Diyos nang hindi labis na pinapalamutian ang pahayag.
- source_word: Πάντων δὲ θαυμαζόντων
  choice: Ngunit habang humahanga ang lahat
  rationale: Isinasalin ang genitive absolute bilang kasabay na pangyayari at iniiba ang 'humahanga' sa mas matinding 'namangha' ng unang sugnay.
- source_word: ἐπὶ πᾶσιν οἷς ἐποίει
  choice: sa lahat ng ginagawa niya
  rationale: Pinananatili ng aspektong imperpektibo ng 'ginagawa' ang nagpapatuloy na katangian ng mga kilos ni Jesus.
- source_word: εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: sinabi niya sa kanyang mga alagad
  rationale: Natural at tuwirang salin ng karaniwang panimulang pormula sa pagsasalaysay.
theological_decisions:
- issue: Tinutukoy ng 'niya' sa οἷς ἐποίει at εἶπεν
  choice: Si Jesus ang tinutukoy ng parehong panghalip
  alternative: Maaaring bigyang-diin ang pagkilos ng Diyos dahil sa naunang pariralang 'kadakilaan ng Diyos'
  rationale: Sa agarang konteksto, si Jesus ang gumagawa at nagsasalita. Gayunman, pinananatili ng salin ang tensiyon na ang nakikita sa kanyang mga gawa ay ang kadakilaan ng Diyos, nang hindi pinag-iisa o pinaglalayo nang higit sa sinasabi ng teksto ang Diyos at si Jesus.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang 'kadakilaan' sa halip na mas estilistikong 'kamahalan' upang masaklaw ang lawak ng μεγαλειότης at maiwasan ang posibleng pag-unawa rito bilang titulo. Walang talababa dahil walang alternatibong kailangang ilahad upang maunawaan ang talata.
