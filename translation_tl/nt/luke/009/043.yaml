  rationale: Binago ang dalawang pandiwa upang maipakita ang relatibong lakas ng ἐξεπλήσσοντο at θαυμαζόντων nang hindi lumalayo sa modernong natural na Tagalog. Pinanatili ang imperpektibong diwa ng ἐποίει sa “ginagawa niya,” ang implicit na pagtukoy kay Jesus, at ang bukas na teolohikal na ugnayan ng kanyang mga gawa sa kadakilaan ng Diyos.
