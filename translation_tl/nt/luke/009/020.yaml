  text: εἶπεν δὲ αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸂Πέτρος δὲ ἀποκριθεὶς⸃ εἶπεν· Τὸν χριστὸν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/020.yaml
  text: And he said to them[a], “But who do you say that I am?” Peter answered, “The Messiah of God.”
translation:
  language: tl
  text: Sinabi naman niya sa kanila, “Ngunit kayo, sino ang sinasabi ninyong ako?” Sumagot si Pedro, “Ang Mesiyas[a] ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Kristo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: kayo
  rationale: Hayag at may diin ang panghalip na maramihan sa Griyego. Pinananatili ng “kayo” kasama ng “ngunit” ang paghahambing sa naunang mga sagot.
- source_word: τίνα με λέγετε εἶναι
  choice: sino ako ayon sa sinasabi ninyo
  rationale: Likas na Filipino ito para sa di-tuwirang pahayag na may λέγετε at εἶναι, habang pinananatili ang diwa ng aktuwal nilang sinasabi, hindi lamang ng kanilang iniisip.
- source_word: ἀποκριθεὶς
  choice: sumagot
  rationale: Ang participle na sinusundan ng finite verb ay likas na ipinapahayag sa Filipino sa payak na pandiwang “sumagot.”
- source_word: Χριστός
  choice: Mesiyas
  rationale: Dito ay titulong pagkakakilanlan ang Χριστός, kaya isinalin bilang “Mesiyas” sa halip na tratuhing personal na pangalan. Inilagay sa talababa ang tradisyonal na “Cristo.”
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Tuwirang pinananatili nito ang ugnayang genitive at ang mariing anyo ng pagpapahayag ni Pedro.
- source_word: δέ
  choice: naman / ngunit
  rationale: Sa unang sugnay, ang δέ ay pang-ugnay sa daloy ng salaysay at likas na naipapahayag ng “naman”; sa tanong, malinaw ang paghahambing kaya “ngunit” ang ginamit.
theological_decisions:
- issue: Pagpapahayag sa Χριστός sa pagkilala ni Pedro
  choice: Mesiyas
  alternative: Cristo
  rationale: Tinutukoy ng talata si Jesus sa pamamagitan ng titulong nakaugat sa pag-asa ng Israel sa pinahirang hari. Isinasalin ang titulo bilang “Mesiyas” nang hindi dinaragdagan o nilulutas ang maikling pariralang “ng Diyos”; ang “Cristo” ay pinanatili bilang leksikal na alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ayon sa sinasabi ninyo” upang maging natural ang tanong habang hindi pinapalitan ang pandiwang “sinasabi” ng “iniisip” o “pinaniniwalaan.”
