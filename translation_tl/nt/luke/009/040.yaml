  source_fidelity: 'Tumpak ang salin sa mga pangunahing elemento ng Griyego: ang ἐδεήθην ay naipapahayag ng “nakiusap ako,” ang μαθητῶν σου ng “iyong mga alagad,” at ang kabiguang ipinahahayag ng οὐκ ἠδυνήθησαν ng “hindi nila nagawa.” Ang “palayasin iyon” ay angkop sa konteksto ng pagpapalayas ng espiritu at hindi labis na nililinaw ang αὐτό.'
