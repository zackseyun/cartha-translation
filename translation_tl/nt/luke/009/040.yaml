id: LUK.9.40
reference: Luke 9:40
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐδεήθην τῶν μαθητῶν σου ἵνα ἐκβάλωσιν αὐτό, καὶ οὐκ ἠδυνήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/040.yaml
  text: And I begged your disciples to cast it out[a], but they were not able.
translation:
  language: tl
  text: At nakiusap ako sa iyong mga alagad na palayasin iyon[a], ngunit hindi nila nagawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “siya,” kung ang panghalip ay tumutukoy sa batang lalaki sa halip na sa espiritu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδεήθην
  choice: nakiusap ako
  rationale: Ipinahihiwatig ng δέομαι ang taimtim at agarang pakiusap. Natural sa makabagong Tagalog ang “nakiusap” at mas mariin ito kaysa sa simpleng “humiling.”
- source_word: τῶν μαθητῶν σου
  choice: sa iyong mga alagad
  rationale: Pinananatili ng “mga alagad” ang ugnayan ng guro at disipulo na karaniwang ipinahihiwatig ng μαθητής sa mga Ebanghelyo.
- source_word: ἵνα ἐκβάλωσιν
  choice: na palayasin
  rationale: Ipinapahayag ng ἵνα kasama ng subjunctive ang layunin o nilalaman ng pakiusap. Ang “palayasin” ay natural na katumbas ng ἐκβάλλω sa konteksto ng pagpapalayas sa espiritu.
- source_word: αὐτό
  choice: iyon
  rationale: Ang neuter na panghalip ay malamang na tumutukoy sa espiritu. Hindi minamarkahan ng “iyon” ang kasarian at kaya nitong panatilihin sa Tagalog ang bahagyang kalabuan ng reperente.
- source_word: οὐκ ἠδυνήθησαν
  choice: hindi nila nagawa
  rationale: Ipinahihiwatig ng δύναμαι ang kakayahan. Ang “hindi nila nagawa” ay malinaw at natural sa Tagalog at ipinapakita na hindi nila naisakatuparan ang hinihinging pagpapalayas.
theological_decisions:
- issue: Ang tinutukoy ng αὐτό sa konteksto ng pagpapalayas
  choice: Isinalin itong “iyon,” na malamang na tumutukoy sa espiritu.
  alternative: Maaaring tumukoy ang panghalip sa batang lalaki, kaya maaaring isalin na “siya.”
  rationale: Sa mga salaysay ng pagpapalayas, karaniwang espiritu o demonyo ang layon ng ἐκβάλλω, at umaayon ang neuter na αὐτό sa πνεῦμα sa konteksto. Gayunman, hindi lubos na ipinapasya ng “iyon” ang reperente, at inilalahad sa talababa ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nakiusap” upang maipakita ang matinding pagmamakaawa ng ama nang hindi nagiging labis na matalinghaga; pinanatili ng “iyon” at ng talababa ang tunay na kalabuan ng panghalip.
