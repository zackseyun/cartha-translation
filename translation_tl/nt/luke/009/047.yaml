  text: ὁ δὲ Ἰησοῦς ⸀εἰδὼς τὸν διαλογισμὸν τῆς καρδίας αὐτῶν ἐπιλαβόμενος ⸀παιδίον ἔστησεν αὐτὸ παρ’ ἑαυτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/047.yaml
  text: But Jesus[a], knowing the reasoning of their hearts, took a child and set him beside himself[b],
translation:
  language: tl
  text: Ngunit batid ni Jesus ang pangangatwiran ng kanilang puso[a]; kinuha niya ang isang bata at pinatayo niya ito sa tabi niya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring: “sa kanilang mga puso.” Isahan ang “puso” sa Griyego bagaman maramihan ang tinutukoy ng “kanilang.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaaring: “inilagay niya ito sa tabi niya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: batid
  rationale: Ipinapahayag nito ang pagkaalam o panloob na pagkabatid ni Jesus nang hindi tinutukoy kung paano niya nalaman.
- source_word: διαλογισμὸν
  choice: pangangatwiran
  rationale: Pinananatili nito ang diwa ng panloob na pag-iisip o pagtatalong nasa isip, hindi lamang isang payak na ‘kaisipan.’
- source_word: τῆς καρδίας αὐτῶν
  choice: ng kanilang puso
  rationale: Pinananatili ang isahang ‘puso’ ng Griyego kasama ng pangmaramihang nagmamay-ari; maaaring tumukoy ito sa magkakatulad nilang panloob na saloobin.
- source_word: ἐπιλαβόμενος
  choice: kinuha
  rationale: Natural sa modernong Tagalog para sa pagkuha ni Jesus sa bata at hindi ipinapalagay na marahas ang paghawak.
- source_word: παιδίον
  choice: bata
  rationale: Payak at natural na katumbas na hindi nagdaragdag ng diin sa edad o liit na hindi tahasang hinihingi ng salita.
- source_word: ἔστησεν
  choice: pinatayo
  rationale: Tumpak na pinananatili ang causative na diwa ng pagpap站 o pagpapapuwesto nang nakatayo.
- source_word: παρ’ ἑαυτῷ
  choice: sa tabi niya
  rationale: Malinaw at natural na tumutukoy sa puwesto ng bata sa tabi mismo ni Jesus.
theological_decisions:
- issue: Ang pagkaalam ni Jesus sa panloob nilang pangangatwiran
  choice: Sinabi lamang na batid ni Jesus ang kanilang panloob na pangangatwiran.
  alternative: Tahasang ipaliwanag ito bilang banal na omniscience o bilang matalas na pagkaunawa sa kilos ng tao.
  rationale: Hindi tinutukoy ng talata ang paraan ng pagkaalam ni Jesus, kaya pinananatili ng salin ang pahayag nang hindi nilulutas ang teolohikal na tanong.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “batid” at “pangangatwiran” upang mapanatili ang panloob at kognitibong diwa ng teksto, habang ginawang natural ang kilos sa pamamagitan ng “kinuha” at “pinatayo.”
