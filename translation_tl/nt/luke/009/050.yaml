base_translation:
  language: en
  yaml_path: translation/nt/luke/009/050.yaml
  text: But Jesus said to him[a], “Do not stop him, for whoever is not against you is for you.”
translation:
  language: tl
  text: Ngunit sinabi ni Jesus sa kanya, “Huwag ninyo siyang pigilan,[a] sapagkat ang sinumang hindi laban sa inyo ay nasa panig ninyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Huwag ninyo siyang hadlangan” o “Huwag ninyo siyang pagbawalan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Ngunit sinabi
  rationale: Ang δέ ay banayad na pang-ugnay na may bahagyang pagsalungat; ang “Ngunit” ay likas na tugon sa pagtutol na binanggit sa naunang talata.
- source_word: πρὸς αὐτόν
  choice: sa kanya
  rationale: Pinananatili ang panghalip ng Griyego, na tumutukoy sa nagsalita kaagad bago nito.
- source_word: ὁ Ἰησοῦς
  choice: ni Jesus
  rationale: Karaniwang anyo ng pangalan sa makabagong Tagalog; ginamit ang panandang “ni” ayon sa natural na ayos ng pangungusap.
- source_word: Μὴ κωλύετε
  choice: Huwag ninyo siyang pigilan
  rationale: Ang κωλύω ay maaaring mangahulugang pigilan, hadlangan, o pagbawalan. Malinaw at natural ang “pigilan” sa konteksto ng pagtatangkang pahintuin ang lalaki. Ipinahahayag ng “ninyo” na maramihan ang mga kinakausap.
- source_word: ὃς γὰρ
  choice: sapagkat ang sinuman
  rationale: Ipinapakita ng “ang sinuman” ang pangkalahatang bisa ng pahayag, habang natural na isinasalin ng “sapagkat” ang γάρ bilang pagbibigay-katwiran.
- source_word: οὐκ ἔστιν καθ’ ὑμῶν
  choice: hindi laban sa inyo
  rationale: Ang κατά na may genitive ay nagpapahayag ng pagsalungat. Pinananatili ng “inyo” ang ikalawang panauhang maramihan.
- source_word: ὑπὲρ ὑμῶν
  choice: panig sa inyo
  rationale: Sa kontekstong ito, ang ὑπέρ ay nagpapahiwatig ng pagsuporta o pagkampi. Mas malinaw sa kasalukuyang Tagalog ang “panig sa inyo” kaysa sa literal ngunit maaaring malabong “para sa inyo,” at pinananatili nito ang pagtutumbas sa “laban sa inyo.”
theological_decisions:
- issue: Saklaw ng pahayag ni Jesus
  choice: Isinalin bilang pangkalahatang simulain gamit ang “ang sinuman.”
  alternative: “Ang taong hindi laban sa inyo ay panig sa inyo,” na maaaring mas tuwirang tumukoy sa lalaking nabanggit.
  rationale: Maaaring tumukoy ang panghalip na pamanggit sa kasalukuyang pangyayari at kasabay nito ay magpahayag ng mas malawak na simulain. Pinananatili ng “ang sinuman” ang lawak na ito nang hindi nagdaragdag ng doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ninyo/inyo” upang hayagang mapanatili ang maramihang ὑμῶν at ang maramihang pautos. Ang “panig sa inyo” ay natural na katapat ng “laban sa inyo.”
