source:
  edition: SBLGNT
  text: Συγκαλεσάμενος δὲ τοὺς δώδεκα ἔδωκεν αὐτοῖς δύναμιν καὶ ἐξουσίαν ἐπὶ πάντα τὰ δαιμόνια καὶ νόσους θεραπεύειν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/001.yaml
  text: And calling the twelve together[a], he gave them power and authority over all the demons and to heal diseases[b],
translation:
  language: tl
  text: Tinawag niyang magtipon ang labindalawa[a] at binigyan sila ng kapangyarihan at awtoridad sa lahat ng demonyo[b], at ng kapangyarihang magpagaling ng mga sakit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Matapos tawagin niyang magtipon ang labindalawa.”
    reason: lexical_alternative
  - marker: b
    text: O “bawat demonyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συγκαλεσάμενος
  choice: Tinipon niya
  rationale: Likas at tuwirang ipinahahayag nito ang pagtawag sa labindalawa upang magsama-sama, kasama ang diwa ng συν-. Ang kilos ay inilalagay bago ang pagbibigay, gaya ng aorist participle.
- source_word: δὲ
  choice: at
  rationale: Mahinang pang-ugnay ito sa pagpapatuloy ng salaysay, hindi malinaw na panalungat.
- source_word: τοὺς δώδεκα
  choice: ang labindalawa
  rationale: Hindi idinagdag ang “alagad” o “apostol” sapagkat wala ang mga salitang iyon sa Griyego.
- source_word: ἔδωκεν
  choice: binigyan
  rationale: Payak at natural na katumbas ng δίδωμι sa konstruksiyong Filipino na “binigyan sila.”
- source_word: δύναμιν
  choice: kapangyarihan
  rationale: Ipinahahayag ang kakayahan o lakas na gumawa ng mga makapangyarihang gawa.
- source_word: ἐξουσίαν
  choice: awtoridad
  rationale: Pinananatiling bukod sa δύναμις ang ipinagkaloob na karapatan o kapahintulutang gumamit ng kapangyarihan.
- source_word: ἐπὶ πάντα τὰ δαιμόνια
  choice: laban sa lahat ng demonyo
  rationale: Sa Filipino, natural na ipinahahayag ng “laban sa” ang kapangyarihan at awtoridad na nakatuon sa pagsupil sa mga demonyo; hindi nito ginagawang “maruruming espiritu” ang mas tiyak na salitang δαιμόνια.
- source_word: νόσους
  choice: mga sakit
  rationale: Karaniwan at malinaw na salitang Filipino para sa mga karamdaman o sakit.
- source_word: θεραπεύειν
  choice: upang magpagaling
  rationale: Ipinahahayag ang infinitive bilang layunin o saklaw ng kapangyarihang ipinagkaloob.
theological_decisions:
- issue: Pagkakaiba ng δύναμις at ἐξουσία
  choice: kapangyarihan at awtoridad
  alternative: lakas at kapangyarihan
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit hindi magkaparehong ideya: kakayahan at ipinagkaloob na karapatang kumilos.'
- issue: Pagkakakilanlan ng “labindalawa”
  choice: ang labindalawa
  alternative: ang labindalawang alagad / ang labindalawang apostol
  rationale: Hindi idinagdag ang katawagang “alagad” o “apostol” na hindi tahasang nasa talata.
- issue: Saklaw ng πάντα τὰ δαιμόνια
  choice: lahat ng demonyo
  alternative: bawat demonyo
  rationale: Kapwa posible ang kolektibong “lahat” at distributibong “bawat”; pinili ang mas natural na kolektibong anyo habang itinatala ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “awtoridad” upang maibukod ito sa “kapangyarihan,” at iniwasang idagdag ang “mga alagad” o “mga apostol.”
