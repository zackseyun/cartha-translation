id: LUK.9.25
reference: Luke 9:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τί γὰρ ὠφελεῖται ἄνθρωπος κερδήσας τὸν κόσμον ὅλον ἑαυτὸν δὲ ἀπολέσας ἢ ζημιωθείς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/025.yaml
  text: For what does a man profit if he gains the whole world[a], but loses or forfeits himself?
translation:
  language: tl
  text: Sapagkat ano ang mapapakinabang ng isang tao kung makamit niya ang buong mundo, ngunit mawala o mapahamak naman ang sarili niya[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang buhay niya” o “ang kaluluwa niya.” Sa Griyego, literal na “ang sarili niya”; reflexive pronoun ang ginamit, hindi ang karaniwang salita para sa “kaluluwa” o “buhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ ὠφελεῖται
  choice: Sapagkat ano ang mapapakinabang
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan sa naunang pahayag, at likas na ipinapahayag ng “ano ang mapapakinabang” ang retorikal na tanong tungkol sa pakinabang o bentaha.
- source_word: ἄνθρωπος
  choice: isang tao
  rationale: Ang ἄνθρωπος ay tumutukoy rito sa sinumang tao bilang kinatawan ng sangkatauhan; natural at tumpak sa modernong Filipino ang “isang tao.”
- source_word: κερδήσας τὸν κόσμον ὅλον
  choice: kung makamit niya ang buong mundo
  rationale: Ginagawang malinaw ng sugnay na may “kung” ang hipotetikal na gamit ng aorist participle, habang pinananatili ng “buong mundo” ang lawak ng κόσμον ὅλον.
- source_word: ἑαυτόν
  choice: ang sarili niya
  rationale: Reflexive pronoun ang ginamit sa Griyego, hindi ang karaniwang salita para sa “kaluluwa” o “buhay”; kaya pinananatili ng salin ang malawak na pagtukoy sa mismong sarili ng tao.
- source_word: ἀπολέσας
  choice: mawala
  rationale: Ipinahahayag nito ang pagkawala ng mismong sarili ng tao nang hindi tinutukoy nang labis ang paraan o eksaktong uri ng pagkawala.
- source_word: ἢ ζημιωθείς
  choice: o mapahamak
  rationale: Pinananatili ng “o” ang disjunction sa Griyego. Ang “mapahamak” ay likas na Filipino para sa pagdanas ng matinding kawalan o kapinsalaan at nagpapakita ng passive na anyo ng participle.
theological_decisions:
- issue: Kahulugan ng ἑαυτόν kaugnay ng hantungan ng tao
  choice: ang sarili niya
  alternative: ang buhay niya; ang kaluluwa niya
  rationale: Hindi ψυχή kundi reflexive pronoun ang nasa teksto. Iniiwasan ng “sarili niya” na limitahan ang diwa sa pisikal na buhay lamang o sa isang doktrina tungkol sa di-materyal na kaluluwa.
- issue: Ugnayan ng ἀπολέσας at ζημιωθείς
  choice: mawala o mapahamak
  alternative: mawala o dumanas ng kawalan
  rationale: Pinananatili ang dalawang magkaugnay ngunit hindi ganap na magkaparehong paglalarawan, pati ang tunay na “o” ng teksto, nang hindi sapilitang pinag-iisa ang mga ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mapapakinabang” sa halip na mas teknikal o makalumang pananalita, at pinanatili ang retorikal na lakas at balanseng paghahambing ng pangungusap.
