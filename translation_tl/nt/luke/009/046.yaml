  text: Εἰσῆλθεν δὲ διαλογισμὸς ἐν αὐτοῖς, τὸ τίς ἂν εἴη μείζων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/046.yaml
  text: Then a dispute arose among them as to which of them might be the greatest[a].
translation:
  language: tl
  text: Pagkatapos, nagkaroon sila ng pagtatalo kung sino sa kanila ang maaaring maging pinakadakila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagkaroon sila ng pangangatwiran” o “nagkaroon sila ng pag-uusap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν
  choice: nagkaroon
  rationale: Bagaman literal na ‘pumasok,’ likas sa modernong Tagalog ang ‘nagkaroon’ kasama ng ‘pagtatalo’ upang ipahayag na may nagsimulang usapin sa pangkat.
- source_word: δὲ
  choice: Pagkatapos
  rationale: Banayad na pang-ugnay ito sa pagpapatuloy ng salaysay; malinaw at natural ang ‘Pagkatapos’ sa konteksto.
- source_word: διαλογισμὸς
  choice: pagtatalo
  rationale: Maaaring tumukoy sa pangangatwiran, pag-uusap, o pagtatalo. Dahil paligsahan sa katayuan ang paksa, ang ‘pagtatalo’ ang pinakamalinaw na pangunahing salin, habang inilalagay sa talababa ang mas neutral na posibilidad.
- source_word: ἐν αὐτοῖς
  choice: sila
  rationale: Ang literal na ‘sa loob nila’ ay maaaring magpahiwatig ng panloob na pag-iisip, ngunit sa konstruksiyong ito ay natural na ipinahahayag sa Tagalog bilang isang bagay na naganap sa kanilang pangkat.
- source_word: τὸ τίς ἂν εἴη
  choice: kung sino ... ang maaaring maging
  rationale: Ipinakikilala ng parirala ang nilalaman ng pagtatalo, at pinananatili ng ‘maaaring’ ang potensiyal na diwa ng ἄν kasama ng optative.
- source_word: μείζων
  choice: pinakadakila
  rationale: Bagaman anyong pahambing ang Griyego (‘mas dakila’), ang tanong tungkol sa ranggo sa loob ng buong pangkat ay likas na ipinahahayag sa Tagalog sa pasukdol na ‘pinakadakila.’
- source_word: αὐτῶν
  choice: sa kanila
  rationale: Tinutukoy ng genitive ang pangkat na pinaghahambingan; tuwiran at natural ang ‘sa kanila.’
theological_decisions:
- issue: Kalikasan ng nangyari sa mga alagad
  choice: pagtatalo
  alternative: pangangatwiran o pag-uusap
  rationale: Ipinahihiwatig ng mapagpaligsahang tanong tungkol sa pagiging pinakadakila ang pagtatalo, ngunit hindi lubusang inaalis ng salitang Griyego ang mas neutral o panloob na diwa; kaya pinanatili ang mga iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang ‘pinakadakila’ bilang idiomatikong pasukdol para sa Griyegong pahambing, at ang tunay na lawak ng kahulugan ng διαλογισμός ay pinanatili sa talababa.
