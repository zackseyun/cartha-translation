  yaml_path: translation/nt/luke/009/053.yaml
  text: And they did not receive him[b][a], because his face was going toward Jerusalem.
translation:
  language: tl
  text: At hindi nila siya tinanggap[a], sapagkat ang kanyang mukha ay patungo sa Jerusalem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malugod na tinanggap.” Sa kontekstong ito, malamang na tumutukoy ito sa pagtangging patuluyin o tanggapin siya bilang panauhin.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “sapagkat ang kanyang mukha ay papunta sa Jerusalem”—isang idyomang nagpapahayag ng tiyak na direksiyon at maaaring magpahiwatig ng matatag na pasiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξαντο
  choice: tinanggap
  rationale: Maaaring mangahulugan ang δέχομαι na tumanggap o malugod na tumanggap. Sa konteksto ng paglalakbay, ipinahihiwatig nito ang pagtangging tanggapin siya bilang panauhin; pinananatili ng “tinanggap” ang lawak ng salitang Griyego.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: nakaharap siya
  rationale: Literal na tumutukoy ang πρόσωπον sa “mukha,” ngunit bahagi ito rito ng isang Semitikong idyoma tungkol sa direksiyon ng paglalakbay. Ang “nakaharap siya” ay likas sa Filipino at pinananatili ang larawan nang hindi nagiging katawa-tawa o malabo.
- source_word: ἦν πορευόμενον
  choice: nakaharap ... sa
  rationale: Ang periphrastic na anyo ay literal na nagsasaad na ang kanyang mukha ay “naglalakbay/pumaparoon.” Sa Filipino, isinasama ang diwang patungo sa isang lugar sa “nakaharap ... sa,” habang ipinapaliwanag sa talababa ang mas literal na anyo at posibleng pahiwatig ng matatag na tunguhin.
- source_word: εἰς Ἰερουσαλήμ
  choice: sa Jerusalem
  rationale: Ipinahahayag ng εἰς ang destinasyon o direksiyon. Kasama ng “nakaharap,” natural sa Filipino ang “sa Jerusalem.”
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ng ὅτι ang dahilan ng kanilang pagtanggi; ang “sapagkat” ay dignificado at natural na pang-ugnay.
theological_decisions:
- issue: Idyomatikong diwa ng “ang kanyang mukha ay pumaparoon sa Jerusalem”
  choice: nakaharap siya sa Jerusalem
  alternative: buo ang pasiya niyang pumunta sa Jerusalem
  rationale: Pinananatili ng salin ang larawan at direksiyon ng orihinal, ngunit hindi tahasang idinaragdag sa pangunahing teksto ang “buo ang pasiya,” na maaaring pahiwatig ng idyoma ngunit hindi lantad sa mismong pagkakasabi.
translation_notes:
  register: Makabago at dignipikadong Filipino. Ginamit ang “Ngunit” upang natural na ipahayag ang pagsalungat sa konteksto, at pinanatili sa mga talababa ang literal na larawan at leksikal na saklaw.
