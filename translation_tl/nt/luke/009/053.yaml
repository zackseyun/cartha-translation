  terminology: Ang “tinanggap” ay wastong pangunahing katumbas ng ἐδέξαντο; ang talababa ay sapat na nagpapaliwanag na sa konteksto ay maaaring tumukoy ito sa pagtanggap o pagpapatuloy sa isang panauhin. Ang “Jerusalem” ay ang karaniwang anyo sa Filipino.
