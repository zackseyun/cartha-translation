id: LUK.9.42
reference: Luke 9:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔτι δὲ προσερχομένου αὐτοῦ ἔρρηξεν αὐτὸν τὸ δαιμόνιον καὶ συνεσπάραξεν· ἐπετίμησεν δὲ ὁ Ἰησοῦς τῷ πνεύματι τῷ ἀκαθάρτῳ, καὶ ἰάσατο τὸν παῖδα καὶ ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/042.yaml
  text: But while he was still coming near[a], the demon threw him down and convulsed him. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.
translation:
  language: tl
  text: Ngunit habang papalapit pa ang bata, ibinagsak siya ng demonyo at pinangisay nang matindi. Sinaway naman ni Jesus ang maruming espiritu, pinagaling ang bata, at ibinalik[a] siya sa kanyang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “muling ibinigay.”
    reason: Ipinahihintulot ng ἀπέδωκεν ang diwang “ibinalik” o “muling ibinigay”; ang pangunahing teksto ay gumagamit ng mas natural na “ibinalik.”
lexical_decisions:
- source_word: ἔτι δὲ προσερχομένου αὐτοῦ
  choice: Ngunit habang papalapit pa siya
  rationale: Pinananatili ng “pa” ang nagpapatuloy na kilos ng ἔτι, at ipinahihiwatig ng “habang” ang kasabay na kilos ng genitive absolute. Hindi tahasang pinapangalanan ang lumalapit upang mapanatili ang anyo ng panghalip sa Griyego, bagaman malinaw sa konteksto na ang bata ang tinutukoy.
- source_word: ἔρρηξεν αὐτὸν
  choice: ibinagsak siya
  rationale: Ipinahahayag nito ang marahas na pagpapatumba o paghahagis sa lupa nang natural sa modernong Tagalog, nang hindi ginagamit ang literal ngunit nakalilitong “pinunit.”
- source_word: τὸ δαιμόνιον
  choice: ang demonyo
  rationale: Tuwirang katumbas ito ng personal na masamang espiritung inilalarawan ng teksto at naihihiwalay ang katawagan sa kasunod na πνεῦμα ἀκάθαρτον.
- source_word: συνεσπάραξεν
  choice: pinapangisay
  rationale: Natural at malinaw na inilalarawan nito ang matinding pangingisay na idinulot ng demonyo.
- source_word: ἐπετίμησεν
  choice: sinaway
  rationale: Karaniwang salitang Ebanghelyo ito para sa makapangyarihang pagsaway ni Jesus sa isang espiritu.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: ang maruming espiritu
  rationale: Pinananatili ng “marumi” ang moral at rituwal na diwa ng ἀκάθαρτος at gumagamit ng pamilyar na terminolohiyang biblikal.
- source_word: ἰάσατο τὸν παῖδα
  choice: pinagaling ang bata
  rationale: Saklaw ng “bata” ang παῖς nang hindi nagdaragdag ng tahasang “anak na lalaki,” at malinaw na ipinapahayag ng “pinagaling” ang pagkilos ni Jesus.
- source_word: ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ
  choice: ibinalik siya sa kanyang ama
  rationale: Ipinahahayag ng “ibinalik” ang diwa ng pagsasauli o muling pagbibigay ng bata sa kanyang ama sa maikli at natural na Tagalog.
theological_decisions:
- issue: Paglalarawan sa pagdurusang dulot ng demonyo
  choice: Isinalin ang δαιμόνιον bilang “demonyo” at ang πνεῦμα ἀκάθαρτον bilang “maruming espiritu.”
  alternative: Gawing pangkalahatan ang mga ito bilang “masamang puwersa” o ituring lamang na karamdaman.
  rationale: Inilalarawan ng Griyegong teksto ang isang personal na espirituwal na nilalang, kaya hindi ito ginawang impersonal o pawang medikal. Kasabay nito, pinanatili ang pahayag na pinagaling ni Jesus ang bata, kaya kapwa naroon ang pagpapalayas sa espiritu at ang pagpapagaling.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “pinapangisay” bilang karaniwang paglalarawan sa matinding spasmo at “maruming espiritu” bilang pamilyar ngunit tumpak na katawagang biblikal.
