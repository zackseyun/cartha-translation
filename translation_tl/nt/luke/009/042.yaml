  terminology: Ang “demonyo,” “maruming espiritu,” “sinaway,” “pinagaling,” at “ibinalik” ay angkop at pinananatili ang pagkakaiba ngunit kaugnayan ng δαιμόνιον at πνεῦμα ἀκάθαρτον. Hindi dapat gawing impersonal o pawang medikal ang demonyo/espiritu.
