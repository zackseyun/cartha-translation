  text: Ὁ δὲ ἐπιτιμήσας αὐτοῖς παρήγγειλεν μηδενὶ ⸀λέγειν τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/021.yaml
  text: But he rebuked them and commanded them to tell this to no one,[a]
translation:
  language: tl
  text: Ngunit mahigpit silang binalaan ni Jesus at inutusang huwag sabihin ito kaninuman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ngunit sinaway niya sila at inutusang huwag sabihin ito kaninuman.”
    reason: Pinananatili ng alternatibo ang mas tuwirang kahulugang “sinaway” para sa ἐπιτιμήσας; maaari rin itong mangahulugang mahigpit na nagbabala sa kontekstong ito.
lexical_decisions:
- source_word: ἐπιτιμήσας
  choice: mahigpit silang binalaan
  rationale: Maaaring tumukoy ang ἐπιτιμάω sa pagsaway o mahigpit na pagbababala. Sa kontekstong ito, natural sa Filipino ang “mahigpit na binalaan” at malinaw nitong ipinapakita ang tindi ng pagbabawal nang hindi nagpapahiwatig na may nagawa nang kasalanan ang mga alagad.
- source_word: παρήγγειλεν
  choice: inutusan
  rationale: Ang παραγγέλλω ay nagpapahayag ng utos na may awtoridad. Ang “inutusan” ay malinaw, dignificado, at karaniwan sa makabagong Filipino.
- source_word: μηδενὶ
  choice: kaninuman
  rationale: Ang datibong μηδενί ang tumutukoy sa taong hindi dapat pagsabihan. Kasama ng “huwag,” natural itong isalin na “kaninuman.”
- source_word: λέγειν
  choice: sabihin
  rationale: Sa konstruksyong may μηδενί at τοῦτο, ang “sabihin ito kaninuman” ang natural na paraan sa Filipino upang ipahayag ang pagbabahagi ng impormasyong tinutukoy.
- source_word: τοῦτο
  choice: ito
  rationale: Pinananatili ng “ito” ang pahiwatig ng Griyegong demonstratibo sa naunang pahayag ni Pedro nang hindi tahasang dinaragdagan ang teksto.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ng δέ ang banayad na pagsalungat sa pagitan ng pagkilala ni Pedro at ng kasunod na pagbabawal ni Jesus.
theological_decisions:
- issue: Tindi ng pagbabawal ni Jesus matapos ang pahayag ni Pedro
  choice: Isang mariing pagbabawal na ihayag ito kaninuman sa puntong ito ng salaysay
  alternative: Isang mas banayad na paalala lamang na huwag muna itong banggitin
  rationale: Ang pagsasama ng ἐπιτιμήσας at παρήγγειλεν ay nagpapahiwatig ng mariing babala at awtoritatibong utos. Pinananatili ng salin ang tensiyon sa salaysay nang hindi ipinapaliwanag kung bakit ipinagbawal ito.
translation_notes:
  register: Makabagong, natural, at dignipikadong Filipino. Idinagdag ang pangalang “Jesus” bilang malinaw na pagtukoy sa paksa ng pangungusap sa Filipino; hindi nito binabago ang tinutukoy ng Griyegong panghalip. Ang pangunahing salin ay inuuna ang kontekstuwal na “mahigpit na binalaan,” habang inilalagay sa talababa ang mas pormal na “sinaway.”
