translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang actorless object-focus na “tinipon” upang mapanatili ang passive na diwa nang hindi nagdaragdag ng di-binanggit na gumagawa. Ang “sa kanila” ay sadyang nagpapanatili sa bahagyang kalabuan ng αὐτοῖς.
