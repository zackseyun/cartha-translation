base_translation:
  language: en
  yaml_path: translation/nt/luke/009/017.yaml
  text: 'And they all ate and were satisfied[b][a], and what was left over of the broken pieces was picked up for them: twelve baskets.'
translation:
  language: tl
  text: Kumain silang lahat at nabusog, at tinipon ang labindalawang basket ng mga pirasong natira sa kanila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: kumain
  rationale: Payak na inilalahad ng aorist ang naganap; natural na salaysay sa Filipino ang “kumain.”
- source_word: ἐχορτάσθησαν
  choice: nabusog
  rationale: Tumpak at likas na ipinahahayag na nakakain sila hanggang sa ganap na pagkabusog.
- source_word: πάντες
  choice: silang lahat
  rationale: Pinananatili ang diin na lahat ng naroon ay kumain.
- source_word: ἤρθη
  choice: tinipon
  rationale: Sa konteksto, tumutukoy ang passive na pandiwa sa pagkuha at pagtitipon ng mga natirang piraso; hindi nito tinutukoy kung sino ang gumawa.
- source_word: τὸ περισσεῦσαν
  choice: natira
  rationale: Likas na katumbas ng substantival participle na tumutukoy sa sobrang hindi naubos.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Pinananatili ang di-ganap na tiyak na ugnayan ng datibo sa Greek sa halip na tahasang ituring itong “nila” o “para sa kanila.”
- source_word: κλασμάτων
  choice: mga piraso
  rationale: Malinaw at karaniwang Filipino para sa mga bahaging pinagputol-putol o nabali mula sa pagkain.
- source_word: κόφινοι δώδεκα
  choice: labindalawang basket
  rationale: Direkta, malinaw, at sapat na katumbas; hindi kailangang idagdag sa pangunahing teksto ang posibleng materyal o anyo ng basket.
