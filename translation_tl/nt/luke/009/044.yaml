id: LUK.9.44
reference: Luke 9:44
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν τοὺς λόγους τούτους, ὁ γὰρ υἱὸς τοῦ ἀνθρώπου μέλλει παραδίδοσθαι εἰς χεῖρας ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/044.yaml
  text: Put these words into your ears[b][a], for the Son of Man is about to be handed over into the hands of men.
translation:
  language: tl
  text: “Pakinggan ninyong mabuti ang mga salitang ito,[a] sapagkat ang Anak ng Tao ay malapit nang ibigay[b] sa mga kamay ng mga tao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Ilagay ninyo sa inyong mga tainga ang mga salitang ito.”'
    reason: Pinananatili sa talababa ang matingkad na larawang Griyego habang natural na ipinahahayag sa pangunahing teksto ang utos na makinig nang mabuti.
  - marker: b
    text: O “ipagkanulo.” Maaari ring mangahulugan ang pandiwang Griyego na “isuko” o “ibigay sa kapangyarihan ng iba.”
    reason: Ipinakikita ang mahalagang saklaw ng kahulugan ng παραδίδωμι nang hindi nililimitahan ang pangunahing teksto sa pagkakanulo lamang.
lexical_decisions:
- source_word: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν
  choice: Pakinggan ninyong mabuti
  rationale: Ang literal na larawan ay ‘ilagay ninyo sa inyong mga tainga,’ isang mariing utos na makinig at tumimo ang sinasabi. Ang ‘Pakinggan ninyong mabuti’ ay natural sa makabagong Tagalog at pinananatili ang diin ng tahasang ὑμεῖς at ng utos.
- source_word: τοὺς λόγους τούτους
  choice: ang mga salitang ito
  rationale: Tumutukoy ito sa tiyak na pahayag na kasunod; tuwiran at malinaw ang ‘mga salitang ito.’
- source_word: ὁ γὰρ
  choice: sapagkat
  rationale: Ipinakikilala ng γάρ ang dahilan kung bakit kailangang makinig nang mabuti.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang nakaugaliang literal na titulo, kasama ang kaugnayan nito sa Daniel at ang sadyang lawak ng kahulugan nito.
- source_word: μέλλει
  choice: malapit nang
  rationale: Ipinahihiwatig ng μέλλω kasama ng pawatas ang nalalapit na pangyayari, nang hindi dinaragdagan ng ideya ng tadhana.
- source_word: παραδίδοσθαι
  choice: ibigay
  rationale: Ang pasibong ‘ibigay’ ay nagsasaad ng pagpapasailalim sa kapangyarihan ng iba at nananatiling mas malawak kaysa sa ‘ipagkanulo.’
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: sa mga kamay ng mga tao
  rationale: Pinananatili ang idyomang ‘sa mga kamay,’ na tumutukoy sa pagpapasailalim sa kapangyarihan ng iba. Natural na malawak sa Tagalog ang ‘mga tao’ at pinananatili rin ang pag-uugnay sa titulong ‘Anak ng Tao.’
theological_decisions:
- issue: Pagsasalin sa titulong ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  alternative: ang Taong Anak / ang Makataong Isa
  rationale: Ang nakaugaliang literal na anyo ang pinakamahusay na nagpapanatili sa titulo, sa posibleng alusyon sa Daniel 7, at sa kristolohikal na tensiyon nang walang dagdag na pagpapakahulugan.
- issue: Saklaw ng παραδίδοσθαι
  choice: ibigay
  alternative: ipagkanulo
  rationale: Maaaring tumukoy ang pandiwa sa pagkakanulo, ngunit dito ay mas malawak nitong inilalarawan ang pagpapasailalim kay Jesus sa kapangyarihan ng mga tao. Hindi dapat paliitin agad ang kahulugan sa ginawa lamang ni Judas.
- issue: Kahulugan ng ἀνθρώπων
  choice: mga tao
  alternative: mga lalaki
  rationale: Bagaman panlalaking anyong maramihan ang Griyego, karaniwang tumutukoy ang ἄνθρωπος sa mga tao sa pangkalahatan. Ang ‘mga tao’ ang natural at tumpak na katumbas sa Tagalog at pinananatili ang retorikal na ugnayan sa ‘Anak ng Tao.’
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang magalang at maramihang ‘ninyo.’ Natural ang pangunahing utos, samantalang nasa talababa ang literal na metapora ng paglalagay ng mga salita sa mga tainga. Pinanatili ang ‘Anak ng Tao’ at ang idyomang ‘sa mga kamay ng mga tao.’
