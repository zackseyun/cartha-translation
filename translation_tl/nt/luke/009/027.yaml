id: LUK.9.27
reference: Luke 9:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ἀληθῶς, εἰσίν τινες τῶν ⸀αὐτοῦ ⸀ἑστηκότων οἳ οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/027.yaml
  text: But I tell you truly[b][a], there are some standing here who will certainly not taste death until they see the kingdom of God.
translation:
  language: tl
  text: 'Ngunit sinasabi ko sa inyo ang totoo: may ilan sa mga nakatayo rito na tiyak na hindi makatitikim ng kamatayan[a] hanggang sa makita nila ang kaharian ng Diyos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “makatitikim ng kamatayan” ay isang idyomang nangangahulugang “makararanas ng kamatayan” o “mamamatay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν ἀληθῶς
  choice: Ngunit sinasabi ko sa inyo ang totoo
  rationale: Pinananatili ng “Ngunit” ang panandang diskurso na δέ, habang natural na ipinahahayag ng “ang totoo” ang adberbiyal na ἀληθῶς sa modernong Tagalog.
- source_word: εἰσίν τινες τῶν αὐτοῦ ἑστηκότων
  choice: may ilan sa mga nakatayo rito
  rationale: Ang “may ilan” ay likas na katumbas ng eksistensiyal at di-tiyak na εἰσίν τινες. Pinananatili ng “sa mga nakatayo” ang partitive na ugnayan, at ang “rito” ay natural na nagpapahayag sa Tagalog ng deiktikong diwa ng mga naroon kasama ni Jesus.
- source_word: οἳ οὐ μὴ γεύσωνται θανάτου
  choice: na tiyak na hindi makatitikim ng kamatayan
  rationale: Ipinahahayag ng “tiyak na hindi” ang mariing pagtangging οὐ μή. Pinananatili ng “makatitikim ng kamatayan” ang talinghaga ng γεύομαι sa halip na gawing payak na “mamamatay.”
- source_word: ἕως ἂν ἴδωσιν
  choice: hanggang sa makita nila
  rationale: Natural at tumpak itong katumbas ng hinaharap na hangganang ipinahahayag ng ἕως ἄν kasama ng aorist subjunctive.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Karaniwan, malinaw, at sapat ang saklaw ng “kaharian ng Diyos” para sa βασιλεία τοῦ θεοῦ; hindi nito nililimitahan ang termino sa paghahari lamang.
theological_decisions:
- issue: Kahulugan ng “makita nila ang kaharian ng Diyos” sa konteksto
  choice: Pinanatili ang parirala nang walang paliwanag na nagpapasya sa tinutukoy nito.
  alternative: Tukuyin ito bilang pagbabagong-anyo, muling pagkabuhay/pag-akyat, pagkawasak ng Jerusalem, o paglaganap ng iglesya.
  rationale: Maraming posibleng pagbasa ang parirala. Ang tuwirang salin ay nagpapanatili sa tunay na teolohikal at eskatolohikal na tensiyon ng Griyego nang hindi nag-aangkat ng isang partikular na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang biblikal na talinghagang “makatitikim ng kamatayan,” kalakip ang maikling talababa para sa kalinawan. Ginamit ang “rito” sa halip na “dito” bilang bahagyang mas marangal ngunit pangkaraniwang anyo.
