  source_fidelity: 'Tapat ang salin sa Griyego: naipapahayag ang δέ, ang pagbibigay-diin ng ἀληθῶς, ang partitive na “may ilan sa mga nakatayo rito,” ang mariing οὐ μή, ang panghinaharap na hangganan ng ἕως ἄν, at ang “kaharian ng Diyos” nang walang interpretibong pagpapalawak.'
