base_translation:
  language: en
  yaml_path: translation/nt/luke/009/009.yaml
  text: But Herod said[a], “John I beheaded; but who is this about whom I hear such things?” And he kept seeking to see him.
translation:
  language: tl
  text: Ngunit sinabi ni Herodes, “Si Juan ang pinugutan ko ng ulo. Ngunit sino itong nababalitaan ko ng gayong mga bagay?” At patuloy niyang sinikap[a] na makita siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinisikap niyang makita siya.” Maaaring ipahiwatig ng pandiwang Griyego sa aspektong imperpekto ang nagpapatuloy o paulit-ulit na kilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Nagsisilbi itong pang-ugnay na may bahagyang pagsalungat at inililipat ang salaysay sa tugon ni Herodes.
- source_word: Ἡρῴδης
  choice: Herodes
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa saling Bibliya sa Filipino.
- source_word: Ἰωάννην ἐγὼ ἀπεκεφάλισα
  choice: Ako ang nagpugot ng ulo ni Juan
  rationale: Pinanatili ang diin ng hayag na panghalip na ἐγώ at ang tiyak na kahulugan ng pandiwang ἀποκεφαλίζω, ang pagpugot ng ulo.
- source_word: τίς δέ ἐστιν οὗτος
  choice: Ngunit sino naman ito
  rationale: Pinananatili ang tuwirang tanong at ang bahagyang mapaglayong himig ng οὗτος nang hindi idinaragdag ang salitang “tao.”
- source_word: περὶ οὗ ἀκούω τοιαῦτα
  choice: na tungkol sa kanya ay may naririnig akong gayong mga bagay
  rationale: Likas na inilalahad sa Filipino ang paksa ng naririnig habang pinananatiling pangkalahatan ang τοιαῦτα sa halip na tukuying “mga balita.”
- source_word: ἐζήτει ἰδεῖν αὐτόν
  choice: patuloy niyang hinangad na makita siya
  rationale: Ipinahihiwatig ng imperpektong ἐζήτει ang nagpapatuloy o nauulit na paghahangad; tuwirang isinalin ang ἰδεῖν bilang “makita.”
theological_decisions:
- issue: Ang sinabi ni Herodes tungkol kay Juan at ang pag-uusisa niya tungkol kay Jesus
  choice: Isinalin bilang tuwirang pahayag at tanong, nang walang idinagdag na paliwanag sa pagkakakilanlan ni Jesus.
  alternative: Tahasan sa salin na natatakot si Herodes na muling nabuhay si Juan.
  rationale: Bagaman nagbibigay ng konteksto ang naunang talata, sinasabi lamang dito ni Herodes na siya ang nagpugot ng ulo ni Juan at itinatanong kung sino ang taong nababalitaan niya. Pinananatili ng salin ang pagpipigil at tensiyon ng teksto.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Pinanatili ang madiing “Ako ang” at ang pangkalahatang “gayong mga bagay,” habang iniwasan ang mas interpretatibong “mga balita” o “makipagkita.”
