  to: Ngunit sinabi ni Herodes, “Si Juan ang pinugutan ko ng ulo. Ngunit sino itong nababalitaan ko ng gayong mga bagay?” At patuloy niyang sinikap[a] na makita siya.
  rationale: Inayos ang pananalita upang maging higit na natural sa modernong Filipino at pinalitan ang “hinangad” ng “sinikap,” na mas angkop sa aktibong diwa ng ἐζήτει. Pinanatili ang diin sa ginawa ni Herodes kay Juan, ang pagtatanong na hindi nagdaragdag ng pagpapakahulugan tungkol sa pagkakakilanlan ni Jesus, at ang di-tiyak na saklaw ng “gayong mga bagay.”
