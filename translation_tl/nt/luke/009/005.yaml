  naturalness: Malinaw at marangal ang pangungusap. Mas natural at tuwiran ang “pag-alis ninyo” kaysa “sa pag-alis ninyo” sa pagkakaugnay nito sa pangunahing utos. Ang “ipagpag” at “bilang patotoo laban sa kanila” ay likas sa modernong Filipino at angkop sa rehistrong biblikal.
  terminology: Ang “bayan,” “alikabok,” “mga paa,” at “patotoo” ay angkop. Sa talababa, mas tumpak na ipaliwanag ang δέχομαι bilang pagtanggap na maaari ring mangahulugang malugod na pagtanggap o pag-anyaya sa mga sugo; ang “pagsalubong” lamang ay maaaring magpahiwatig ng simpleng pagbati at hindi ganap na saklaw ang pandiwa.
