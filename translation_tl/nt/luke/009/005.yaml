  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὅσοι ⸀ἂν μὴ ⸀δέχωνται ὑμᾶς, ἐξερχόμενοι ἀπὸ τῆς πόλεως ⸀ἐκείνης τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν ⸀ἀποτινάσσετε εἰς μαρτύριον ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/005.yaml
  text: And as for all who do not receive you[a], as you leave that town[b], shake off the dust from your feet as a testimony against them.
translation:
  language: tl
  text: At ang lahat ng hindi tumatanggap sa inyo[a], pag-alis ninyo sa bayang iyon[b], ipagpag ninyo ang alikabok mula sa inyong mga paa bilang patotoo laban sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malugod na tumanggap sa inyo.” Maaaring saklaw ng pandiwa ang pagtanggap at malugod na pagtanggap sa mga sugo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lungsod na iyon.” Ang salitang Griego na πόλις ay maaaring tumukoy sa isang bayan o lungsod depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι ἂν μὴ δέχωνται
  choice: ang lahat ng hindi tumanggap
  rationale: Ipinahahayag ng ὅσοι na saklaw ang lahat ng taong maaaring tumanggi, samantalang ang δέχομαι ay tumutukoy sa pagtanggap sa mga sugo at maaari ring magpahiwatig ng malugod na pagsalubong sa kanila.
- source_word: ὑμᾶς
  choice: sa inyo
  rationale: Tumutukoy ang panghalip na maramihan sa mga alagad na isinugo; likas itong isinalin sa modernong Tagalog bilang “sa inyo.”
- source_word: ἐξερχόμενοι
  choice: sa pag-alis ninyo
  rationale: Ang pandiwaring ito ay kasabay ng pangunahing utos at nagbibigay ng panahong isasagawa ang pagpag sa alikabok.
- source_word: ἀπὸ τῆς πόλεως ἐκείνης
  choice: sa bayang iyon
  rationale: Maaaring tumukoy ang πόλις sa bayan o lungsod. Ang “bayan” ay likas sa konteksto ng paglalakbay sa iba't ibang pamayanan at hindi nagpapalagay na malaki ang lugar.
- source_word: τὸν κονιορτὸν
  choice: ang alikabok
  rationale: Tumutukoy ang κονιορτός sa pinong alikabok mula sa lupa; “alikabok” ang malinaw at karaniwang katumbas nito.
- source_word: ἀπὸ τῶν ποδῶν ὑμῶν
  choice: mula sa inyong mga paa
  rationale: Pinananatili nito ang pinagmumulan o kinalalagyan ng alikabok at ang maramihang pagtukoy sa mga paa ng mga alagad.
- source_word: ἀποτινάσσετε
  choice: ipagpag ninyo
  rationale: Ang pautos ay tumutukoy sa sadyang pag-aalis ng alikabok sa pamamagitan ng pagpag; maikli at malinaw ang “ipagpag ninyo.”
- source_word: εἰς μαρτύριον
  choice: bilang patotoo
  rationale: Ipinahahayag ng parirala ang tungkulin ng simbolikong kilos bilang patunay o saksi.
- source_word: ἐπ’ αὐτούς
  choice: laban sa kanila
  rationale: Sa pariralang ito, may salungat o mapagbabalang puwersa ang ἐπί kasama ng μαρτύριον; ipinakikitang ang patotoo ay nakatayo laban sa mga tumanggi.
theological_decisions:
- issue: Lakas ng kahulugan ng simbolikong pagpag sa alikabok
  choice: Isinalin itong isang patotoo laban sa mga tumanggi sa mga sugo.
  alternative: Isang neutral na tanda para sa kanila, o isang tahasang pahayag ng pangwakas na hatol ng Diyos.
  rationale: May mapagbabalang at hudisyal na diwa ang εἰς μαρτύριον ἐπ’ αὐτούς, ngunit hindi tahasang inilalarawan ng talata ang buong lawak o kahihinatnan ng hatol. Kaya pinananatili ang bigat ng kilos nang hindi dinaragdagan ang sinabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “bayan” kaysa “lungsod” bilang mas malawak at likas na katawagan sa pamayanan sa konteksto, at pinanatili sa talababa ang leksikal na alternatibo. Ang “ipagpag” at “bilang patotoo laban sa kanila” ay nagpapanatili sa malinaw na larawan at solemneng bigat ng orihinal.
