id: LUK.9.32
reference: Luke 9:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος καὶ οἱ σὺν αὐτῷ ἦσαν βεβαρημένοι ὕπνῳ· διαγρηγορήσαντες δὲ εἶδον τὴν δόξαν αὐτοῦ καὶ τοὺς δύο ἄνδρας τοὺς συνεστῶτας αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/032.yaml
  text: Peter and those with him were weighed down with sleep; but when they became fully awake[a], they saw his glory and the two men standing with him.
translation:
  language: tl
  text: Si Pedro at ang mga kasama niya ay lupaypay sa antok; ngunit nang lubos silang magising[a], nakita nila ang kaluwalhatian niya at ang dalawang lalaking nakatayong kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagkagising nila” o “nang ganap na silang gising.” Bihira ang pandiwang Griyego at maaaring idiin ang pagiging lubos na alisto, sa halip na ang pananatiling gising sa buong panahon.
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαρημένοι ὕπνῳ
  choice: lupaypay sa antok
  rationale: Ipinahahayag nito ang matinding pananaig ng antok, higit sa payak na “inaantok,” sa natural at kasalukuyang Tagalog.
- source_word: διαγρηγορήσαντες
  choice: nang lubos silang magising
  rationale: Sa konteksto, malamang na tumutukoy ang bihirang pandiwa sa pagdating sa ganap na gising na kalagayan, bilang pagsalungat sa pagiging lupaypay sa antok.
- source_word: δόξαν
  choice: kaluwalhatian
  rationale: Pinananatili nito ang karaniwang biblikal at teolohikal na diwa ng δόξα, sa halip na paliitin iyon sa nakikitang kaningningan lamang.
- source_word: τοὺς δύο ἄνδρας
  choice: ang dalawang lalaki
  rationale: Tumpak at likas itong tumutukoy sa dalawang lalaking nasa tagpo.
- source_word: συνεστῶτας αὐτῷ
  choice: nakatayong kasama niya
  rationale: Pinananatili nito kapwa ang nakikitang tindig at ang pagiging kasama ni Jesus sa tagpo.
- source_word: δὲ
  choice: ngunit
  rationale: Hindi isinalin nang hiwalay ang unang δέ dahil sapat ang likas na pag-usad ng salaysay sa Tagalog; ang ikalawa ay “ngunit” upang ihayag ang pagsalungat ng matinding antok at ng sumunod na pagkakita.
theological_decisions:
- issue: Paglalarawan sa δόξα sa pagbabagong-anyo
  choice: kaluwalhatian niya
  alternative: kaningningan niya / kadakilaan niya
  rationale: Pinananatili ng “kaluwalhatian” ang malawak na biblikal na ugnayan at hindi nito ipinapaliwanag nang labis ang kalikasan ng nakita.
- issue: Kahulugan ng διαγρηγορήσαντες
  choice: nang lubos silang magising
  alternative: nang manatili silang gising
  rationale: Mas angkop sa kaibahan sa “lupaypay sa antok” ang pagdating sa ganap na pagkaalisto, ngunit inilalahad sa talababa ang tunay na leksikal na posibilidad.
translation_notes:
  register: Makabagong, dignificado, at madaling maunawaang Filipino. Ginamit ang “lupaypay sa antok” upang mapanatili ang tindi ng larawan nang hindi maging masalimuot; nilagyan ng [a] ang tunay na kalabuan ng bihirang pandiwa.
