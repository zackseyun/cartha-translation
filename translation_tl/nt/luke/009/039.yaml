review_pass:
  verdict: revise
  source_fidelity: Ang draft ay wastong kumikilala sa πνεῦμα bilang “isang espiritu” at naipapahayag ang biglaang pagsigaw at pangingisay. Gayunman, ang “Halos hindi ito humihiwalay” ay mas madaling unawain bilang halos hindi talaga pag-alis, samantalang ang μόγις ay “may kahirapan” o “bahagya lamang.” Ang “matindi siyang sinasaktan” ay nagpapahina rin sa marahas at nagpapatuloy na larawan ng συντρῖβον (“dinudurog/sumasawi nang matindi”) at hindi malinaw na ikinakabit ang pagkilos na ito sa pag-alis ng espiritu.
  naturalness: Natural sa makabagong Filipino ang “isang espiritu ang sumusunggab sa kanya,” “bigla siyang sumisigaw,” at “bumubula ang kanyang bibig.” Ang “bahagya lamang itong humiwalay” ay mas malinaw na katumbas ng μόγις kaysa “halos hindi ito humihiwalay.”
  terminology: Ang “espiritu” ay angkop at hindi nagpapasok ng “demonyo” o “masamang espiritu” sa pangunahing teksto. Ang “dinudurog” ay isang ligtas na matalinghagang salin ng συντρίβω sa kontekstong ito; pinananatili nito ang tindi ng pinsala nang hindi nagtatakda ng tiyak na medikal na resulta.
  issues:
  - severity: medium
    issue: Ang “Halos hindi ito humihiwalay” ay hindi sapat na tiyak para sa μόγις.
    rationale: Ang μόγις ay nagsasaad na ang pag-alis ay nangyayari lamang nang may hirap/bahagya, hindi kinakailangang halos hindi nangyayari kailanman.
  - severity: medium
    issue: Ang “matindi siyang sinasaktan” ay kulang sa lakas at aspektong nagpapatuloy ng συντρῖβον αὐτόν.
    rationale: Ang participle ay naglalarawan ng espiritung patuloy na dumudurog o matinding pumipinsala sa bata habang ito ay umaalis; dapat mapanatili ang marahas na imahe at kaugnayan nito sa pag-alis.
  revised_text: At narito, isang espiritu[a] ang sumusunggab sa kanya, at bigla siyang sumisigaw. Pinangingisay siya nito habang bumubula ang kanyang bibig. Bahagya lamang itong humiwalay sa kanya, habang dinudurog siya nito.
  revised_footnotes:
  - marker: a
    text: Maaari ring “isang masamang espiritu” o “isang demonyo”; “espiritu” lamang ang nasa Griyego rito.
    reason: alternative_reading
  revision_rationale: Inayos ang paglalarawan ng pag-alis upang maipahayag ang μόγις bilang pag-alis na bahagya o may kahirapan, at pinalakas ang huling sugnay upang mapanatili ang marahas at patuloy na diwa ng συντρῖβον. Pinanatili ang hindi tinukoy na “espiritu,” ang malinaw na paglalarawan ng pangingisay at pagbubula, at ang footnote na nagtatala ng mga alternatibong katawagan.
