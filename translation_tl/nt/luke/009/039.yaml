id: LUK.9.39
reference: Luke 9:39
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πνεῦμα λαμβάνει αὐτόν, καὶ ἐξαίφνης κράζει, καὶ σπαράσσει αὐτὸν μετὰ ἀφροῦ καὶ ⸀μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ συντρῖβον αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/039.yaml
  text: and look[a], a spirit seizes him, and suddenly he cries out, and it convulses him with foaming, and it scarcely departs from him, crushing him.
translation:
  language: tl
  text: At narito, isang espiritu[a] ang sumusunggab sa kanya, at bigla siyang sumisigaw. Pinangingisay siya nito habang bumubula ang kanyang bibig. Bahagya lamang itong humiwalay sa kanya, habang dinudurog siya nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang masamang espiritu” o “isang demonyo”; “espiritu” lamang ang nasa Griyego rito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili ang masiglang pantawag-pansin sa salaysay ng ama sa paraang natural at marangal sa makabagong Tagalog.
- source_word: πνεῦμα
  choice: isang espiritu
  rationale: Ang Griyego ay nagsasabing ‘espiritu’ lamang; hindi nito tahasang ginagamit sa talatang ito ang ‘masamang espiritu’ o ‘demonyo.’
- source_word: λαμβάνει
  choice: sinasakmal
  rationale: Ipinahahayag nito ang biglaan at marahas na pagsunggab at pagkontrol, na siyang diwa ng pandiwa sa kontekstong ito.
- source_word: ἐξαίφνης
  choice: bigla
  rationale: Likas na katumbas sa Tagalog para sa dagliang pagsisimula ng pangyayari.
- source_word: κράζει
  choice: sumisigaw
  rationale: Pinananatili ang batang lalaki bilang nauunawaang simuno ng aktibong pandiwa, nang hindi idinaragdag na tahasang pinasisigaw siya ng espiritu.
- source_word: σπαράσσει αὐτόν
  choice: pinangingisay siya nito
  rationale: Malinaw na inilalarawan sa makabagong Tagalog ang marahas na pangingisay na dulot ng espiritu.
- source_word: μετὰ ἀφροῦ
  choice: at bumubula ang kanyang bibig
  rationale: Natural na ipinahahayag ang kasabay na pagbubula; idinagdag ang ‘bibig’ bilang likas na pagpapahayag sa Tagalog, hindi bilang bagong pangyayari.
- source_word: μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ
  choice: halos hindi ito humihiwalay sa kanya
  rationale: Pinananatili ang diwa na hirap o bihira itong lumalayo, nang hindi tahasang ipinapalagay na ayaw nitong umalis.
- source_word: συντρῖβον αὐτόν
  choice: matindi siyang sinasaktan
  rationale: Ipinahahayag ang malubhang pinsalang ginagawa ng espiritu nang hindi labis na literal na gumagamit ng ‘dinudurog,’ na maaaring magpahiwatig ng ganap na pisikal na pagkawasak sa Tagalog.
theological_decisions:
- issue: Kung tahasang tatawaging demonyo o masamang espiritu ang πνεῦμα
  choice: isang espiritu
  alternative: isang masamang espiritu; isang demonyo
  rationale: Bagaman malinaw sa mas malawak na konteksto na mapaminsala ang espiritu, pinananatili ng salin ang hindi gaanong tiyak na katawagang ginamit mismo sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maiikling sugnay upang mapanatili ang mabilis at marahas na takbo ng paglalarawan, habang iniwasan ang katawagang mas tiyak kaysa sa Griyego.
