revisions:
- from: At narito, sinasakmal siya ng isang espiritu[a], at bigla siyang sumisigaw. Pinangingisay siya nito at bumubula ang kanyang bibig. Halos hindi ito humihiwalay sa kanya, at matindi siyang sinasaktan.
  to: At narito, isang espiritu[a] ang sumusunggab sa kanya, at bigla siyang sumisigaw. Pinangingisay siya nito habang bumubula ang kanyang bibig. Bahagya lamang itong humiwalay sa kanya, habang dinudurog siya nito.
  rationale: Inayos ang paglalarawan ng pag-alis upang maipahayag ang μόγις bilang pag-alis na bahagya o may kahirapan, at pinalakas ang huling sugnay upang mapanatili ang marahas at patuloy na diwa ng συντρῖβον. Pinanatili ang hindi tinukoy na “espiritu,” ang malinaw na paglalarawan ng pangingisay at pagbubula, at ang footnote na nagtatala ng mga alternatibong katawagan.
