  text: ἐξερχόμενοι δὲ διήρχοντο κατὰ τὰς κώμας εὐαγγελιζόμενοι καὶ θεραπεύοντες πανταχοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/006.yaml
  text: So they went out and traveled through the villages[b][a], proclaiming the good news and healing everywhere.
translation:
  language: tl
  text: Kaya umalis sila at naglakbay sa iba't ibang nayon,[a] na ipinapahayag ang magandang balita[b] at nagpapagaling saanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga nayon” o “mula sa isang nayon patungo sa iba.” Maaaring idiin ng Griyegong pananalita ang sunod-sunod na pagkilos sa mga nayon.
    reason: lexical_alternative
  - marker: b
    text: O “ipinangangaral ang ebanghelyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξερχόμενοι
  choice: umalis sila
  rationale: Ipinahihiwatig ng aorist participle ang pagkilos na kasunod ng pagsusugo ni Jesus; natural sa makabagong Tagalog ang “umalis sila.”
- source_word: δὲ
  choice: Kaya
  rationale: Nagpapatuloy ito sa salaysay at iniuugnay ang pag-alis nila sa naunang utos at pagsusugo.
- source_word: διήρχοντο
  choice: naglakbay
  rationale: Ang imperfect ay naglalarawan ng nagpapatuloy na paglalakbay sa iba't ibang lugar; kasama ng “sa mga nayon,” malinaw ang pagdaan nila sa mga ito.
- source_word: κατὰ τὰς κώμας
  choice: sa mga nayon
  rationale: Ang κατά na may accusative ay maaaring magpahiwatig ng distributibong pagkilos sa iba't ibang nayon; pinananatili ng salin ang likas na daloy habang inilalagay sa talababa ang mas tahasang alternatibo.
- source_word: εὐαγγελιζόμενοι
  choice: ipinapahayag ang magandang balita
  rationale: Malinaw at madaling maunawaan ito sa modernong Tagalog at pinananatili ang diwa ng pagpapahayag nang hindi umaasa sa teknikal na wikang pansimbahan.
- source_word: θεραπεύοντες
  choice: nagpapagaling
  rationale: Sa konteksto, tumutukoy ito sa aktuwal na pagpapagaling na kasama ng misyon ng mga alagad.
- source_word: πανταχοῦ
  choice: saanman
  rationale: Tuwirang ipinahahayag nito ang malawak na saklaw ng kanilang pagpapahayag at pagpapagaling.
theological_decisions:
- issue: Kahulugan ng εὐαγγελιζόμενοι sa misyon ng mga alagad
  choice: ipinapahayag ang magandang balita
  alternative: ipinangangaral ang ebanghelyo
  rationale: Pinananatili ng piniling salin ang nilalaman ng pagpapahayag at pagiging madaling maunawaan, nang hindi ipinapalagay na ginagamit na rito ang lahat ng mas huling teknikal na kahulugan ng terminong “ebanghelyo.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nayon” para sa κώμη at ang karaniwang pariralang “magandang balita” para sa εὐαγγελιζόμενοι; iniwasan ang labis na teknikal o denominasyonal na pananalita.
