  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν προσευχόμενον κατὰ μόνας συνῆσαν αὐτῷ οἱ μαθηταί, καὶ ἐπηρώτησεν αὐτοὺς λέγων· Τίνα με ⸂οἱ ὄχλοι λέγουσιν⸃ εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/018.yaml
  text: And it happened that while he was praying alone[a], the disciples were with him, and he asked them, saying, “Who do the crowds say that I am?”
translation:
  language: tl
  text: Isang pagkakataon, habang nananalangin siyang mag-isa[a], kasama niya ang mga alagad. Tinanong niya sila, “Sino raw ako ayon sa sinasabi ng mga tao?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang pribado.” Ang pariralang Griyego ay maaaring tumukoy sa pagiging bukod o sa isang pribadong kalagayan, hindi lamang sa ganap na pag-iisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: At nangyari na
  rationale: Pinananatili ang karaniwang pormulang pasalaysay ni Lucas sa paraang natural sa modernong Tagalog.
- source_word: ἐν τῷ εἶναι αὐτὸν προσευχόμενον
  choice: habang nananalangin siya
  rationale: Ipinahahayag ng articular infinitive na may ἐν ang kasabay na pangyayari; natural itong naihahatid ng “habang.”
- source_word: κατὰ μόνας
  choice: mag-isa
  rationale: Maikli at karaniwang katumbas ng idyomang maaaring mangahulugang nag-iisa o nasa pribadong lugar; inilalahad sa talababa ang alternatibong diwa.
- source_word: συνῆσαν αὐτῷ οἱ μαθηταί
  choice: kasama niya ang mga alagad
  rationale: Tuwirang pinananatili ang ugnayang ipinahahayag ng συνῆσαν αὐτῷ nang hindi ipinapalagay na lumapit lamang sila o nasa malayo.
- source_word: ἐπηρώτησεν αὐτοὺς λέγων
  choice: Tinanong niya sila
  rationale: Natural sa Tagalog na hindi na hiwalay na isalin ang participle na λέγων kapag direkta nang sumusunod ang sinabi.
- source_word: Τίνα με οἱ ὄχλοι λέγουσιν εἶναι
  choice: Sino raw ako ayon sa mga tao?
  rationale: Ang “raw” ay natural na pananda ng iniulat na sinasabi, samantalang ang “ayon sa mga tao” ay malinaw na naghahatid ng pinagmumulan ng palagay. Ang οἱ ὄχλοι rito ay natural na tumutukoy sa pangkalahatang mga tao o madla.
theological_decisions:
- issue: Tila magkasalungat ang pananalangin ni Jesus nang mag-isa at ang pagiging kasama niya ng mga alagad
  choice: 'Panatilihin ang dalawang pahayag: “nananalangin siyang mag-isa” at “kasama niya ang mga alagad.”'
  alternative: Isaling “nang pribado” o idagdag na nasa malapit lamang ang mga alagad upang ipaliwanag ang tagpo.
  rationale: Hindi tiyak na nangangahulugan ang κατὰ μόνας ng ganap na kawalan ng ibang taong naroroon. Pinananatili ng salin ang tunay na tensiyon o nuance ng Griyego nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nananalangin” at “mga alagad” bilang karaniwan at angkop na bokabularyong biblikal; iniwasan ang lipas na “datapwat” o sobrang literal na ayos.
