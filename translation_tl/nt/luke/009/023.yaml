  text: Ἔλεγεν δὲ πρὸς πάντας· Εἴ τις θέλει ὀπίσω μου ⸂ἔρχεσθαι, ἀρνησάσθω⸃ ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ ⸂καθ’ ἡμέραν⸃, καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/023.yaml
  text: And he was saying to all[a], “If anyone wants to come after me, let him deny himself and take up his cross daily, and follow me.”
translation:
  language: tl
  text: Sinabi niya sa lahat, “Kung nais ng sinuman na lumakad kasunod ko, itakwil niya ang kanyang sarili, pasanin araw-araw ang kanyang krus, at sumunod sa akin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Sinabi niya
  rationale: Ang imperpektong anyo ay maaaring maglarawan ng nagpapatuloy na pagsasalita, ngunit sa salaysay na Tagalog, ang “Sinabi niya” ang pinakanatural na panimula at hindi nito ipinipilit na paulit-ulit ang sinabi.
- source_word: πρὸς πάντας
  choice: sa lahat
  rationale: 'Tuwirang pinananatili ang saklaw ng pahayag: nakatuon ito sa lahat ng naroroon, hindi lamang sa Labindalawa.'
- source_word: Εἴ τις θέλει
  choice: Kung nais ng sinuman
  rationale: Ang “sinuman” ay natural na panumbas sa di-tiyak at pangkalahatang singular na τις, samantalang ang “nais” ay marangal ngunit karaniwang gamit para sa θέλει.
- source_word: ὀπίσω μου ἔρχεσθαι
  choice: lumakad kasunod ko
  rationale: Pinananatili nito ang larawang nasa idyomang “pumaroon sa likuran/kasunod” at ang diwa ng pagiging alagad, nang hindi lubusang ipinapareho sa kasunod na tahasang ἀκολουθείτω.
- source_word: ἀρνησάσθω ἑαυτὸν
  choice: itakwil niya ang kanyang sarili
  rationale: Ang “itakwil” ay malinaw at matibay na katumbas ng ἀρνέομαι sa kontekstong ito; ang hulma na “itakwil niya” ay nagpapanatili sa pangatlong-panauhang utos.
- source_word: ἀράτω
  choice: pasanin
  rationale: Sa natural na Tagalog, “pasanin ang krus” ang malinaw na paraan upang ipahayag ang pagkuha at pagdadala sa krus. Hindi nito ginagawang pangkalahatang “pasanin” lamang ang konkretong larawan ng krus.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: ang kanyang krus
  rationale: Tuwirang pinananatili ang konkretong salitang σταυρός at ang singular na pag-aari, nang hindi ipinapaliwanag agad bilang hirap, sakripisyo, o tungkulin.
- source_word: καθ’ ἡμέραν
  choice: araw-araw
  rationale: Natural at eksaktong ipinahahayag ang bawat-araw na diin na natatangi sa salaysay ni Lucas.
- source_word: ἀκολουθείτω μοι
  choice: at sumunod sa akin
  rationale: Pinananatili ang ikalawang pangatlong-panauhang utos. Ang puwersa ng utos ay likas na nagpapatuloy mula sa naunang “itakwil niya” at “pasanin.”
theological_decisions:
- issue: Larawan ng krus sa pagiging alagad
  choice: Panatilihin ang literal na “krus.”
  alternative: Ipaliwanag bilang hirap, pasanin, pagdurusa, o sakripisyo.
  rationale: Ang σταυρός ay konkretong salita na may malalim ngunit hindi lubusang ipinaliwanag na simbolikong puwersa. Hindi dapat paliitin ng salin ang kahulugan nito sa iisang pagpapakahulugan.
- issue: Pangkalahatang singular sa mga utos
  choice: Gamitin ang “sinuman” at mga anyong singular na “niya/kanyang.”
  alternative: Gawing tahasang maramihan ang pangungusap.
  rationale: Pangkalahatang singular ang kayarian ng Griyego. Sa Tagalog, walang kasariang panlalaki o pambabae ang “niya,” kaya napapanatili ang singular na anyo nang hindi nagmumungkahi na lalaki lamang ang tinutukoy.
- issue: Ugnayan ng “lumakad kasunod” at “sumunod”
  choice: Panatilihin ang dalawang magkaugnay ngunit magkaibang pagpapahayag.
  alternative: Isalin kapwa bilang simpleng “sumunod.”
  rationale: May idyomang ὀπίσω μου ἔρχεσθαι muna at tahasang ἀκολουθείτω pagkatapos. Ang salin ay nagpapanatili sa retorikal na pag-usad mula sa pagnanais na lumakad kasunod ni Jesus tungo sa utos na patuloy na sumunod sa kanya, nang hindi nagdaragdag ng paliwanag.
translation_notes:
  register: Makabagong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “sinuman,” “niya,” at “kanyang” upang mapanatili ang pangkalahatang singular nang walang gender bias. Iniwasan ang sobrang literal ngunit di-natural na “pumarito sa likuran ko,” at pinili ang “lumakad kasunod ko” upang mapanatili ang orihinal na larawan.
