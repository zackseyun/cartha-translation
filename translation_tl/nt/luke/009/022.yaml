    issue: «muling buhayin» para sa ἐγερθῆναι
    rationale: Bagaman transitive ito, hindi ito ang pinakatugmang Tagalog para sa pormulang pagkabuhay-muli at maaaring tumukoy sa pagbabalik-buhay sa pangkalahatan. Mas tuwirang isinasalin ng «ibangon» ang passive na «be raised.»
  - severity: low
