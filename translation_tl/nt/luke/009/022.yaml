  text: εἰπὼν ὅτι Δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/022.yaml
  text: saying[a], “It is necessary for the Son of Man to suffer many things and to be rejected by the elders, chief priests, and scribes, and to be killed[b], and on the third day to be raised.”
translation:
  language: tl
  text: Sinabi niya, “Kailangang magdusa ng maraming bagay ang Anak ng Tao, itakwil ng mga matatanda, mga punong pari, at mga eskriba, patayin, at sa ikatlong araw ay ibangon.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰπὼν
  choice: Sinabi niya
  rationale: Ang aorist participle ay nag-uugnay sa naunang salaysay at nagpapakilala sa sinabi ni Jesus. Mas natural sa makabagong Tagalog ang ganap na pandiwang “Sinabi niya” kaysa sa pilit na participial na anyo.
- source_word: Δεῖ
  choice: Kailangang
  rationale: Ipinahahayag nito ang pangangailangan o dapat mangyari sa loob ng layunin ng Diyos, nang hindi tahasang nagdaragdag ng ahente o sanhi.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang kinikilalang titulo at ang mga kaugnayan nito sa Daniel at sa paggamit ng mga Ebanghelyo.
- source_word: πολλὰ παθεῖν
  choice: magdusa nang matindi
  rationale: Likas at malinaw na Tagalog para sa malawak at mabigat na pagdurusang ipinahihiwatig ng πολλὰ; ang literal na “magdusa ng maraming bagay” ay hindi natural sa Filipino.
- source_word: ἀποδοκιμασθῆναι
  choice: itakwil
  rationale: Ipinakikita ang opisyal at tiyak na pagtanggi matapos siyang suriin o hatulan.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: ng matatandang pinuno, ng mga punong pari, at ng mga tagapagturo ng Kautusan
  rationale: Ginagamit ang “ng” bilang likas na pananda ng gumagawa sa mga pandiwang balintiyak. Nililinaw ng mga katawagan ang mga pangkat ng pamunuang Judio para sa ordinaryong mambabasa.
- source_word: πρεσβυτέρων
  choice: matatandang pinuno
  rationale: Hindi lamang edad ang tinutukoy kundi ang kinikilalang pangkat ng mga pinuno; iniiwasan nito ang maling pagkaunawang lahat ng matatandang tao ang tinutukoy.
- source_word: ἀρχιερέων
  choice: mga punong pari
  rationale: Tumutukoy sa uring punong-pari, hindi sa maraming sabay-sabay na humahawak ng iisang katungkulan ng pinakapunong pari.
- source_word: γραμματέων
  choice: mga tagapagturo ng Kautusan
  rationale: Sa kontekstong Ebanghelyo, ipinahahayag nito ang tungkulin ng mga eksperto sa Kautusan nang mas malinaw kaysa sa makalumang “mga eskriba.”
- source_word: ἀποκτανθῆναι
  choice: patayin
  rationale: Direkta at natural na balintiyak na infinitive sa serye ng mga pandiwang nakasalalay sa “kailangang.”
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: sa ikatlong araw
  rationale: Karaniwang salin ng temporal dative at pinananatili ang pamilyar na pormula.
- source_word: ἐγερθῆναι
  choice: muling buhayin
  rationale: Pinananatili ang balintiyak na anyo at ipinahihiwatig ang pagkilos ng Diyos nang hindi tahasang pinapangalanan ang gumagawa. Ang “ibangon” ay maaaring mapagkamalang pisikal na pagpapatayo lamang.
theological_decisions:
- issue: Balintiyak na anyo ng pandiwa tungkol sa muling pagkabuhay
  choice: muling buhayin
  alternative: muling mabuhay
  rationale: Balintiyak ang ἐγερθῆναι. Pinananatili ng “muling buhayin” ang pahiwatig na may kumikilos kay Jesus, nang hindi idinaragdag sa teksto na Diyos ang tahasang simuno.
- issue: Lakas at anyo ng Δεῖ
  choice: Kailangang magdusa nang matindi ang Anak ng Tao
  alternative: Ang Anak ng Tao ay dapat magdusa nang matindi
  rationale: Ang “Kailangang” ay natural na impersonal na konstruksyon sa Tagalog at pinananatili ang diwa ng kinakailangang mangyari sa plano ng Diyos nang hindi ipinapaliwanag ang mekanismo nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matatandang pinuno” at “mga tagapagturo ng Kautusan” upang maging agad na nauunawaan ang mga institusyonal na katawagan, habang pinanatili ang tradisyonal at intertekstuwal na titulong “Anak ng Tao.”
