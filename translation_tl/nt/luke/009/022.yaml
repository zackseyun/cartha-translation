    issue: «magdusa nang matindi» para sa πολλὰ παθεῖν
    rationale: Ang «nang matindi» ay nagpapahayag ng antas ng pagdurusa, samantalang ang neuter plural na πολλὰ ay «maraming bagay» at binibigyang-diin ang sari-saring pagdurusa.
