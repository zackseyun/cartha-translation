  source_fidelity: Kailangang iwasto ang «magdusa nang matindi,» dahil ang πολλὰ ay tumutukoy sa «maraming bagay,» hindi lamang sa tindi ng pagdurusa. Ang «muling buhayin» ay posible ngunit hindi gaanong tumpak at natural dito kaysa «ibangon» para sa balintiyak na ἐγερθῆναι.
  naturalness: Ang binagong serye ng infinitive ay malinaw at natural sa makabagong Filipino. Ang «mga eskriba» ay tuwirang katawagan para sa γραμματεῖς; ang maikling paliwanag ay ibinibigay sa talababa.
  terminology: Pinananatili ang «Anak ng Tao,» «mga punong pari,» at ang institusyonal na «mga matatanda.» Ang «ibangon» ay nag-iingat sa balintiyak na anyo nang hindi tahasang pinapangalanan ang ahente.
  issues:
