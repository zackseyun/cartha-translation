base_translation:
  language: en
  yaml_path: translation/nt/luke/009/037.yaml
  text: On the next day[a], when they had come down from the mountain, a large crowd met him.
translation:
  language: tl
  text: Kinabukasan[a], nang bumaba na sila mula sa bundok, sinalubong siya ng isang malaking pulutong ng mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa sumunod na araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: (ipinahiwatig sa daloy ng salaysay)
  rationale: Karaniwang panandang pasalaysay ang pariralang ito. Hindi na ito isinalin nang hiwalay upang maiwasan ang di-likas na “At nangyari” at ang pagdaragdag ng tahasang “Ngayon” na wala naman sa Griyego.
- source_word: τῇ ἑξῆς ἡμέρᾳ
  choice: Kinabukasan
  rationale: Likas at maikli itong katumbas sa modernong Filipino ng temporal na diwang “sa sumunod na araw.”
- source_word: κατελθόντων αὐτῶν
  choice: nang makababa na sila
  rationale: Ipinahahayag nito ang kilos na nagsisilbing kaligirang pangyayari at natapos bago o kaugnay ng pangunahing kilos, nang hindi labis na pinaiigting ang pagitan ng mga ito.
- source_word: ἀπὸ τοῦ ὄρους
  choice: mula sa bundok
  rationale: Ang “bundok” ang karaniwan at angkop na salin ng ὄρος sa kontekstong ito.
- source_word: συνήντησεν αὐτῷ
  choice: sinalubong siya
  rationale: Ipinahahayag ng pandiwa ang pagharap o pagpunta upang salubungin ang isang tao. Mas natural dito ang “sinalubong siya” kaysa sa mas malamig na “nakipagtagpo sa kanya.”
- source_word: ὄχλος πολύς
  choice: napakaraming tao
  rationale: Natural itong Filipino para sa isang malaking pulutong at malinaw na naipapahayag ang laki o dami nito.
