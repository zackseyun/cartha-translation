  text: λαβὼν δὲ τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν αὐτοὺς καὶ κατέκλασεν καὶ ἐδίδου τοῖς μαθηταῖς ⸀παραθεῖναι τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/016.yaml
  text: Then[a], taking the five loaves and the two fish, and looking up to heaven, he blessed them and broke them and kept giving them to the disciples to set before the crowd.
translation:
  language: tl
  text: Pagkatapos, kinuha niya ang limang tinapay at dalawang isda. Tumingala siya sa langit, binasbasan ang mga ito[a], at pinagputul-putol. Patuloy niya itong ibinibigay sa mga alagad upang ihain nila sa karamihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagpasalamat siya para sa mga ito.” Ang pandiwang Griyego rito ay “binasbasan,” samantalang “nagpasalamat” ang ginamit sa ilang kaagapay na salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: kinuha niya
  rationale: Ang aorist participle ay nagpapakilala ng kilos na nauna sa kasunod na mga pandiwa. Likas sa modernong Tagalog ang tahasang pandiwang “kinuha niya.”
- source_word: δὲ
  choice: Pagkatapos
  rationale: Banayad itong pang-ugnay na nagsusulong sa salaysay; malinaw na naipapahayag ng “Pagkatapos” ang pagkakasunod-sunod.
- source_word: τοὺς πέντε ἄρτους
  choice: ang limang tinapay
  rationale: Tumutukoy ang ἄρτοι sa limang magkakahiwalay na tinapay. Sa Tagalog, sapat at natural ang bilang na “limang” upang ipakita iyon nang hindi gumagamit ng mas teknikal o banyagang anyo.
- source_word: τοὺς δύο ἰχθύας
  choice: dalawang isda
  rationale: Karaniwan at eksakto ang “isda” para sa maramihang tinutukoy pagkatapos ng bilang.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: Tumingala siya sa langit
  rationale: Natural itong Tagalog para sa pagtingin paitaas at pinananatili ang direksiyon ng tingin sa οὐρανός.
- source_word: εὐλόγησεν αὐτοὺς
  choice: binasbasan ang mga ito
  rationale: Pinananatili ng “binasbasan” ang tuwirang kahulugan ng εὐλογέω, at ang “mga ito” ay tumutugma sa panlalaking maramihang αὐτούς na tumutukoy sa mga tinapay at isda.
- source_word: κατέκλασεν
  choice: pinagpira-piraso
  rationale: Ipinahihiwatig ng pandiwa ang pagputol o pagbali ng pagkain para maipamahagi. Malinaw at natural sa Tagalog ang “pinagpira-piraso.”
- source_word: ἐδίδου
  choice: Patuloy niyang ibinigay
  rationale: Ang imperfect ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagbibigay habang namamahagi; malinaw itong naihahayag ng “patuloy niyang ibinigay.”
- source_word: τοῖς μαθηταῖς
  choice: sa mga alagad
  rationale: Tapat ito sa may-artikulong pangngalan nang hindi idinaragdag ang tahasang pag-aari na wala sa Griyego.
- source_word: παραθεῖναι
  choice: upang ihain
  rationale: Ipinapahayag ng infinitive ang layunin ng pagbibigay sa mga alagad. Ang “ihain” ay natural na tumutukoy sa paglalagay ng pagkain sa harap ng mga kakain.
- source_word: τῷ ὄχλῳ
  choice: sa mga tao
  rationale: Sa kontekstong ito, tumutukoy ang kolektibong ὄχλος sa nagkakatipong mga tao. Mas natural sa kasalukuyang Tagalog ang “mga tao” kaysa “karamihan” o “madla.”
theological_decisions:
- issue: Kahulugan ng οὐρανός sa konteksto ng panalangin
  choice: langit
  alternative: kalawakan
  rationale: Kasabay ng pagbabasbas ang pagtingala, kaya pinananatili ng “langit” ang panrelihiyon at mapitagang diwa ng tagpo nang walang idinaragdag na doktrina.
- issue: Pagpapakahulugan sa εὐλόγησεν
  choice: binasbasan ang mga ito
  alternative: nagpasalamat siya para sa mga ito
  rationale: Ang ginamit na pandiwang Griyego ay εὐλογέω, “magbasbas,” hindi εὐχαριστέω, “magpasalamat.” Pinananatili ng salin ang natatanging pananalita ni Lucas sa halip na itugma ito sa ilang kaagapay na salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Hinati sa maiikling pangungusap upang maging natural sa Tagalog, habang pinananatili ang pagkakasunod-sunod ng mga kilos, ang maramihang layon ng pagbabasbas, at ang nagpapatuloy na diwa ng ἐδίδου.
