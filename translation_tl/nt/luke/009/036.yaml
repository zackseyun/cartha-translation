  text: καὶ ἐν τῷ γενέσθαι τὴν φωνὴν ⸀εὑρέθη Ἰησοῦς μόνος. καὶ αὐτοὶ ἐσίγησαν καὶ οὐδενὶ ἀπήγγειλαν ἐν ἐκείναις ταῖς ἡμέραις οὐδὲν ὧν ἑώρακαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/036.yaml
  text: And when the voice had come[a], Jesus was found alone. And they kept silent and told no one in those days anything of what they had seen.
translation:
  language: tl
  text: Nang marinig ang tinig, natagpuang nag-iisa si Jesus.[a] Nanahimik sila, at sa mga araw na iyon ay wala silang sinabihan tungkol sa anumang nakita nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “si Jesus na lamang ang naroon” o “si Jesus lamang ang nakita.” Sa literal, “natagpuang nag-iisa si Jesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ γενέσθαι τὴν φωνήν
  choice: Nang matapos magsalita ang tinig
  rationale: Ang ἐν na may articular infinitive ay temporal. Sa konteksto, ang likas na Tagalog na “matapos magsalita ang tinig” ay tumutukoy sa pagtatapos ng makalangit na pahayag nang hindi ginagawang isang di-personal na tunog ang φωνή.
- source_word: φωνή
  choice: tinig
  rationale: Tumutukoy ito sa makalangit na tinig na nagsalita sa tagpo; ang “tinig” ay tuwiran, marangal, at natural sa salaysay.
- source_word: εὑρέθη Ἰησοῦς μόνος
  choice: natagpuang nag-iisa si Jesus
  rationale: Pinananatili ng “natagpuan” ang anyong pasibo ng εὑρέθη at ng “nag-iisa” ang predikatibong diwa ng μόνος, nang hindi ipinapaliwanag kung paano nawala sa paningin sina Moises at Elias.
- source_word: ἐσίγησαν
  choice: Tumahimik sila
  rationale: Likas na Tagalog ito para sa pagiging tahimik o hindi pagsasalita sa sumunod na panahon.
- source_word: οὐδενὶ ἀπήγγειλαν
  choice: hindi nila sinabi kaninuman
  rationale: Ang ἀπαγγέλλω ay nangangahulugang magsabi o mag-ulat; mas natural sa makabagong Tagalog ang “sinabi kaninuman” sa kontekstong ito.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: nang mga araw na iyon
  rationale: Tuwirang pinananatili ang temporal na saklaw ng parirala.
- source_word: οὐδὲν ὧν ἑώρακαν
  choice: ang alinman sa mga nakita nila
  rationale: Pinananatili nito ang ugnayan ng οὐδέν sa relative clause at malinaw na umaasa ang negatibong diwa sa “hindi ... kaninuman.”
theological_decisions:
- issue: Ang pahiwatig ng pag-iisa ni Jesus matapos ang makalangit na tinig
  choice: Ilarawan lamang na “natagpuang nag-iisa si Jesus”
  alternative: “Si Jesus na lamang ang naroon” o “si Jesus lamang ang nakita nila”
  rationale: Iniulat ng talata ang kinalabasan ng tagpo ngunit hindi nito tahasang ipinaliliwanag ang teolohikong kabuluhan. Pinananatili ng salin ang pagpipigil at bahagyang kalabuan ng Griyego.
translation_notes:
  register: Makabago at dignidad na Filipino, na may payak na ayos ng salaysay. Ginamit ang “tinig” sa halip na “boses” para sa biblikal ngunit nauunawaang rehistro, at iniwasan ang pagpapaliwanag na wala sa mismong teksto.
