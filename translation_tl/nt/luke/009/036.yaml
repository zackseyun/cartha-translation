  to: Nang marinig ang tinig, natagpuang nag-iisa si Jesus.[a] Nanahimik sila, at sa mga araw na iyon ay wala silang sinabihan tungkol sa anumang nakita nila.
  rationale: Pinalitan ang unang sugnay ng idiomatikong Tagalog na tumutukoy sa pangyayari ng makalangit na tinig nang hindi tahasang idinidiin na natapos itong magsalita. Inayos din ang temporal na parirala at ang ayos ng negatibong pangungusap upang maging likas ang Filipino, samantalang nananatiling malinaw na wala silang sinabihan ng anuman tungkol sa kanilang nakita.
