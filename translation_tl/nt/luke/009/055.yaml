  text: But he turned and rebuked them[a].
translation:
  language: tl
  text: Ngunit lumingon siya at sinaway sila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'May ilang mas huling manuskrito na nagdaragdag: “at sinabi, ‘Hindi ninyo alam kung anong uri ng espiritu ang nasa inyo; sapagkat ang Anak ng Tao ay hindi naparito upang puksain ang buhay ng mga tao kundi upang iligtas ang mga ito.’”'
    reason: textual_variant
lexical_decisions:
- source_word: στραφεὶς
  choice: lumingon
  rationale: Ang aorist participle ng στρέφω ay naglalarawan sa pagharap ni Jesus sa mga alagad bago niya sila pagsabihan. Likas at maikli sa modernong Tagalog ang “lumingon,” at naipahihiwatig ang kilos na nauna sa pangunahing pandiwa.
- source_word: δὲ
  choice: Ngunit
  rationale: Ang δέ ay nagpapakita rito ng banayad na pagsalungat sa naunang mungkahi ng mga alagad. Ang “Ngunit” ay malinaw at angkop sa marangal na salaysay.
- source_word: ἐπετίμησεν
  choice: sinaway
  rationale: Ang ἐπιτιμάω ay tumutukoy sa matinding pagsaway o pagsisita. Ang “sinaway” ay natural sa Tagalog at naghahayag ng mariing pagwawasto nang hindi nagdaragdag ng di-tiyak na detalye.
- source_word: αὐτοῖς
  choice: sila
  rationale: Ang panghalip na datibo at maramihan ay tumutukoy sa mga alagad na kausap, ayon sa konteksto. Sa karaniwang Tagalog, tuwirang layon ang ginagamit sa “sinaway sila.”
theological_decisions:
- issue: Mas mahabang dagdag na matatagpuan sa ilang mas huling manuskrito
  choice: 'Isinalin sa pangunahing teksto ang maikling pagbasa lamang ng SBLGNT: “Ngunit lumingon siya at sinaway sila.”'
  alternative: “Ngunit lumingon siya at sinaway sila, at sinabi, ‘Hindi ninyo alam kung anong uri ng espiritu ang nasa inyo; sapagkat ang Anak ng Tao ay hindi naparito upang puksain ang buhay ng mga tao kundi upang iligtas sila.’”
  rationale: Ang ibinigay na tekstong Griyego ay naglalaman lamang ng maikling pagbasa. Hindi dapat ipasok sa pangunahing teksto ang mas mahabang pagbasa mula sa ilang mas huling manuskrito, ngunit mahalagang banggitin ito sa talababa dahil malaki at kilala ang variant na ito.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, natural, at marangal. Pinanatili ang banayad na pagsalungat ng δέ at ang tindi ng ἐπιτιμάω nang walang denominasyonal na pagpapakahulugan.
