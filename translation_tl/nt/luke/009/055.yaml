  terminology: Ang “sinaway” ay angkop na katumbas ng ἐπιτιμάω sa kontekstong ito. Ang “Anak ng Tao” ay wastong panatilihing anyong pamagat. Sa variant, “espiritu ang nasa inyo” ay pinanatili bilang natural na paraan ng pagpapahayag ng “what sort of spirit you are of,” nang hindi nagpapataw ng interpretasyong doktrinal.
