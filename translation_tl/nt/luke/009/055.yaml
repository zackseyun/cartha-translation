  source_fidelity: 'Ang pangunahing teksto, “Ngunit lumingon siya at sinaway sila,” ay tapat sa SBLGNT: naipapahayag ng “lumingon” ang στραφεὶς, ng “Ngunit” ang banayad na kontrast ng δέ, at ng “sinaway sila” ang ἐπετίμησεν αὐτοῖς. Wala itong idinagdag na pananalita mula sa mas mahabang variant. Sa talababa, ang pangwakas na “upang iligtas sila” ay maaaring lumipat mula sa “mga buhay” tungo sa “mga tao,” samantalang ang variant ay magkatapat na tumutukoy sa ψυχὰς/buhay. Inayos ito upang mapanatili ang paralelismo at saklaw ng pinagmulan.'
