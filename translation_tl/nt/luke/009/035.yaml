base_translation:
  language: en
  yaml_path: translation/nt/luke/009/035.yaml
  text: And a voice came from the cloud[a], saying, “This is my Son, the Chosen One; listen to him.”
translation:
  language: tl
  text: At isang tinig ang nagmula sa ulap at nagsabi, “Ito ang aking Anak, ang Hinirang[a]; pakinggan ninyo siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “aking Anak, ang Minamahal” ang mababasa sa halip na “aking Anak, ang Hinirang.”
    reason: textual_variant
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: may isang tinig na nagmula
  rationale: Likas sa makabagong Tagalog ang ganitong paglalahad sa paglitaw at pinagmulan ng tinig; iniiwasan nito ang literal ngunit di-likas na ‘nagkaroon ng isang tinig.’
- source_word: ἐκ τῆς νεφέλης
  choice: sa ulap
  rationale: Kasama ng ‘nagmula,’ malinaw nitong ipinahahayag na ang ulap ang pinanggalingan ng tinig.
- source_word: λέγουσα
  choice: na nagsabi
  rationale: Natural na ipinakikilala nito sa Tagalog ang nilalaman ng tinig.
- source_word: Οὗτός ἐστιν
  choice: Ito ang
  rationale: Karaniwang Tagalog na pagkakakilanlan ito at pinananatili ang diin sa taong itinuturo.
- source_word: ὁ υἱός μου
  choice: aking Anak
  rationale: Tuwirang katumbas ng pag-aari at ugnayang ipinahahayag ng Griyego; ginamit ang malaking titik dahil titulo ito ni Jesus sa konteksto.
- source_word: ὁ ἐκλελεγμένος
  choice: ang Hinirang
  rationale: Pinananatili ang kahulugan ng perpektong pasibong anyo ng ἐκλέγομαι at ang artikulong Griyego, nang hindi nagdaragdag ng ikalawang ‘aking’ na wala sa parirala.
- source_word: αὐτοῦ ἀκούετε
  choice: pakinggan ninyo siya
  rationale: Ipinahahayag ang pautos na diwa ng ἀκούετε bilang masusing pakikinig at pagsunod; ang ‘ninyo’ ay nagpapakita na maramihan ang utos.
theological_decisions:
- issue: Iba't ibang tekstuwal na paglalarawan sa Anak sa tinig mula sa ulap
  choice: ἐκλελεγμένος bilang ‘ang Hinirang’
  alternative: ἀγαπητός bilang ‘minamahal na Anak’
  rationale: Sinusunod ng pangunahing teksto ang SBLGNT at hindi ito itinutugma sa mas pamilyar na pananalita sa ibang Sinoptikong salaysay. Pinananatili kapwa ang pagiging Anak at ang titulong Hinirang nang hindi ipinagpapalagay na magkapareho ang dalawang tekstuwal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘pakinggan ninyo’ upang maipakita ang maramihang utos at ang diwang pagtalima, habang ang ‘ang Hinirang’ ay tapat sa ibinigay na tekstong Griyego at hindi nagdaragdag ng possessive.
