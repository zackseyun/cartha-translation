  text: who, appearing in glory, were speaking about his departure, which he was about to fulfill in Jerusalem.
translation:
  language: tl
  text: Nagpakita sila sa kaluwalhatian at nag-uusap tungkol sa pagpanaw[a] niya, na malapit na niyang tuparin sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “pag-alis” o “paglabas” (exodos); tumutukoy ito sa pagpanaw at pag-alis ni Jesus na magaganap sa Jerusalem, at maaaring umalingawngaw rin sa Exodo.
    reason: Pinananatili ang mas malawak na kahulugan at posibleng alusyon ng ἔξοδος nang hindi binibigatan ang pangunahing teksto.
lexical_decisions:
- source_word: ὀφθέντες ἐν δόξῃ
  choice: nagpakita sa kaluwalhatian
  rationale: Pinananatili ang diwa ng pagpapakita at ang tahasang pagbanggit sa kaluwalhatian, sa natural ngunit marangal na Tagalog.
- source_word: ἔξοδον
  choice: pagpanaw
  rationale: Ang salitang Griyego ay literal na pag-alis o paglabas, ngunit sa konteksto ay tumutukoy sa nalalapit na kamatayan at pag-alis ni Jesus. Ang “pagpanaw” ay likas sa Tagalog at hindi nililimitahan ang salita sa kamatayan lamang; ipinaliliwanag ng talababa ang mas malawak na saklaw.
- source_word: ἤμελλεν πληροῦν
  choice: malapit na niyang tuparin
  rationale: Ipinahahayag ng “malapit na” ang nalalapit na pangyayari, at pinananatili ng “tuparin” ang diwa ng πληροῦν bilang pagtupad o pagdadala sa kaganapan, sa halip na gawing simpleng “gawin” lamang.
theological_decisions:
- issue: Ang kahulugan ng ἔξοδος bilang kamatayan, pag-alis, at posibleng alusyon sa Exodo
  choice: “pagpanaw” sa teksto, na may talababa tungkol sa literal na “pag-alis/paglabas”
  alternative: “pag-alis” o “exodo”
  rationale: Hindi dapat ikulong ang salita sa isang paliwanag lamang. Ang “pagpanaw” ay malinaw sa agarang konteksto, samantalang pinananatili ng talababa ang leksikal at teolohikal na lalim ng terminong Griyego.
- issue: Ang diwa ng πληροῦν
  choice: “tuparin”
  alternative: “ganapin” o “isakatuparan”
  rationale: Ang “tuparin” ay tapat sa ideya ng pagdadala sa katuparan at pinananatili ang teolohikal na tensiyon ng pangyayaring aktibong tinutupad ni Jesus sa Jerusalem.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “sila” at “niya,” habang pinanatili ang mga salitang “kaluwalhatian” at “tuparin” dahil natural ang mga ito sa biblikal na diskurso at nauunawaan ng ordinaryong mambabasa.
