id: LUK.9.45
reference: Luke 9:45
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα τοῦτο, καὶ ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν ἵνα μὴ αἴσθωνται αὐτό, καὶ ἐφοβοῦντο ἐρωτῆσαι αὐτὸν περὶ τοῦ ῥήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/045.yaml
  text: But they did not understand this saying[a], and it was concealed from them so that they might not perceive it[b], and they were afraid to ask him about this saying.
translation:
  language: tl
  text: Ngunit hindi nila maunawaan ang pahayag na ito[a]. Nakatago ito sa kanila upang hindi nila ito mabatid[b], at natatakot silang magtanong sa kanya tungkol sa pahayag na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “salitang ito,” “pahayag na ito,” o “bagay na ito” para sa ῥῆμα.
    reason: lexical_alternative
  - marker: b
    text: Hindi sinasabi ng Griyego kung sino ang naglihim nito sa kanila.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠγνόουν
  choice: hindi nila naunawaan
  rationale: Sa konteksto, tumutukoy ito sa kabiguan ng mga alagad na maunawaan ang pahayag ni Jesus, hindi lamang sa kawalan nila ng kaalaman.
- source_word: ῥῆμα
  choice: ang sinabi niyang ito
  rationale: Tumutukoy ang ῥῆμα sa tiyak na pahayag na kababanggit ni Jesus. Likas sa modernong Tagalog ang “ang sinabi niyang ito” at malinaw na tumutukoy sa binigkas na pananalita.
- source_word: παρακεκαλυμμένον
  choice: inilihim ito
  rationale: Pinananatili ng anyong pasibo ang kalagayan ng pahayag bilang nakatago sa kanila nang hindi tinutukoy kung sino ang gumawa nito.
- source_word: ἀπ’ αὐτῶν
  choice: sa kanila
  rationale: Sa idyomatikong Tagalog, ang “inilihim sa kanila” ang natural na katumbas ng diwang ang kahulugan ay concealed from them.
- source_word: ἵνα μὴ αἴσθωνται αὐτό
  choice: upang hindi nila ito maunawaan
  rationale: Sa konteksto, ang αἰσθάνομαι ay pag-unawa o pagkabatid sa kahulugan. Mas malinaw sa karaniwang mambabasa ang “maunawaan,” bagaman napapantay nito ang pagkakaiba sa naunang ἠγνόουν.
- source_word: ἐφοβοῦντο
  choice: natatakot sila
  rationale: Ipinahihiwatig ng imperpekto ang nagpapatuloy nilang takot; natural at tuwiran ito sa modernong Tagalog.
- source_word: ἐρωτῆσαι
  choice: magtanong
  rationale: Ito ang karaniwang salitang Tagalog para sa paghingi ng paglilinaw kay Jesus.
theological_decisions:
- issue: Sino ang naglihim ng pahayag
  choice: Hindi pinangalanan ang gumawa; pinanatili ang pasibong “inilihim ito sa kanila.”
  alternative: Ang Diyos ang naglihim nito sa kanila; o nanatili lamang itong malabo sa kanila.
  rationale: Walang tahasang tinutukoy na tagaganap ang pasibong Griyego. Ang pagdaragdag ng Diyos bilang tagaganap ay magpapasya sa isang teolohikal na tanong na hindi tahasang nilulutas ng talata.
- issue: Lakas ng ἵνα sa sugnay ng kinalabasan o layunin
  choice: “upang hindi nila ito maunawaan,” na pinananatili ang anyong layunin/resulta nang hindi ipinapaliwanag ang ahensiya.
  alternative: “kaya hindi nila ito maunawaan,” na magbibigay-diin sa kinalabasan.
  rationale: Ang ἵνα μή ay maaaring magpahiwatig ng layunin o nilalayong resulta. Ang “upang” ay pinakamalapit sa pormal na ugnayan ng mga sugnay at pinananatili ang tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “ang sinabi niyang ito” sa halip na mas literal ngunit maaaring malabong “salitang ito.” Pinanatili ang pasibong pagkakabuo upang hindi magdagdag ng di-binanggit na tagaganap.
