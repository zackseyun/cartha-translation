  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι γνόντες ἠκολούθησαν αὐτῷ. καὶ ⸀ἀποδεξάμενος αὐτοὺς ἐλάλει αὐτοῖς περὶ τῆς βασιλείας τοῦ θεοῦ, καὶ τοὺς χρείαν ἔχοντας θεραπείας ἰᾶτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/011.yaml
  text: But the crowds[a], learning of it, followed him. And welcoming them, he was speaking to them about the kingdom of God and healing those who had need of healing.
translation:
  language: tl
  text: Ngunit nang malaman ito ng mga tao, sumunod sila sa kanya. Malugod niya silang tinanggap at patuloy na nangusap sa kanila tungkol sa kaharian ng Diyos. Pinagagaling din niya ang mga nangangailangan ng pagpapagaling.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga nangangailangan ng paggamot” o “pangangalaga.” Ang salitang Griyego na θεραπεία ay maaaring mangahulugang “pagpapagaling,” “paggamot,” o “pangangalaga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: Ngunit ... ang mga tao
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat o paglipat sa tugon ng mga tao matapos ang pag-iisa ni Jesus. Bagaman maramihan ang ὄχλοι, mas natural sa Filipino ang kolektibong “mga tao” kaysa “mga pulutong.”
- source_word: γνόντες
  choice: nang malaman ito
  rationale: Ang aorist participle ay ginawang likas na sugnay na panahunan; pinananatili ng “ito” ang hindi tahasang tinukoy na bagay na nalaman nila sa Griyego.
- source_word: ἠκολούθησαν αὐτῷ
  choice: sumunod sila sa kanya
  rationale: Tuwirang katumbas na nagpapanatili kapwa sa pisikal na pagsunod sa salaysay at sa posibleng alingawngaw ng pagiging tagasunod nang hindi ito pinalalabis.
- source_word: ἀποδεξάμενος αὐτούς
  choice: Malugod niya silang tinanggap
  rationale: Ipinahahayag ang positibo at magiliw na pagtanggap na saklaw ng ἀποδέχομαι, hindi lamang ang neutral na pagtanggap.
- source_word: ἐλάλει αὐτοῖς
  choice: patuloy na nangusap sa kanila
  rationale: Ipinakikita ng “patuloy” ang duratibong aspekto ng imperfect ἐλάλει sa natural na Filipino.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: tungkol sa kaharian ng Diyos
  rationale: Maliwanag at nakaugaliang salin na nagpapanatili sa mahalagang pariralang biblikal.
- source_word: τοὺς χρείαν ἔχοντας θεραπείας
  choice: mga nangangailangan ng pagpapagaling
  rationale: Natural na Filipino para sa literal na “mga may pangangailangan ng θεραπεία”; ang θεραπεία ay maaaring tumukoy sa pagpapagaling o pangangalaga/paggamot.
- source_word: ἰᾶτο
  choice: Pinagaling din niya
  rationale: Malinaw na inilalahad ang gawaing pagpapagaling. Ang daloy kasunod ng duratibong “patuloy na nangusap” ay nagpapahiwatig na bahagi ito ng nagpapatuloy na paglilingkod ni Jesus.
theological_decisions:
- issue: Pagkasalin ng βασιλεία τοῦ θεοῦ
  choice: kaharian ng Diyos
  alternative: paghahari ng Diyos
  rationale: Ang “kaharian ng Diyos” ang nakaugaliang salin at nagpapanatili ng pagkakapare-pareho sa mahalagang katawagang ito, habang hindi itinatanggi ang dinamikong diwa ng paghahari.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “mga tao” bilang likas na kolektibong katumbas ng maramihang ὄχλοι, at hinati sa tatlong pangungusap upang maging malinaw ang daloy nang hindi binabago ang ugnayan ng mga kilos.
