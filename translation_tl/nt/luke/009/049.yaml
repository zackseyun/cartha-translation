  text: Ἀποκριθεὶς ⸀δὲ Ἰωάννης εἶπεν· Ἐπιστάτα, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, καὶ ⸀ἐκωλύομεν αὐτὸν ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/049.yaml
  text: Then John answered[a], “Master, we saw someone casting out demons in your name, and we tried to stop him because he does not follow with us.”
translation:
  language: tl
  text: Sumagot naman si Juan, “Guro, may nakita kaming taong nagpapalayas ng mga demonyo sa pangalan mo, at sinikap namin siyang pigilan sapagkat hindi siya nakikisama sa amin bilang tagasunod.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “hindi siya sumusunod sa amin.” Mas literal sa Griyego ang “kasama namin,” na maaaring magdiin na hindi siya kabilang sa pangkat ng mga alagad.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ Ἰωάννης εἶπεν
  choice: Sumagot naman si Juan
  rationale: Ang δέ ay likas na naipapahayag ng “naman” bilang banayad na salaysay na paglipat; ang “sumagot” ay nagpapanatili sa tugong diwa ng Ἀποκριθείς nang hindi mabigat sa modernong Tagalog.
- source_word: Ἐπιστάτα
  choice: Guro
  rationale: Sa Lucas, ito ay tawag ng mga alagad kay Jesus na kumikilala sa kaniyang awtoridad at pamumuno. Ang “Guro” ang pinakanatural at marangal na tuwirang tawag sa modernong Tagalog, bagaman mas malawak sa simpleng tungkuling magturo ang saklaw ng salitang Griyego.
- source_word: εἴδομέν τινα
  choice: may nakita kaming isang tao
  rationale: Pinananatili nito ang di-tiyak na pagkakakilanlan ng τινα at natural ang ayos sa Tagalog.
- source_word: ἐν τῷ ὀνόματί σου
  choice: sa pangalan mo
  rationale: Pinananatili ng karaniwang idyomang ito ang diwa ng pagkilos sa bisa o awtoridad ng pangalan ni Jesus nang hindi iyon labis na ipinapaliwanag sa teksto.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: nagpapalayas ng mga demonyo
  rationale: Ang “nagpapalayas” ay malinaw at likas na katumbas ng ἐκβάλλω sa konteksto ng pagpapalaya mula sa mga demonyo.
- source_word: ἐκωλύομεν αὐτόν
  choice: Pinipigilan namin siya
  rationale: Ang aspektong imperpektibo ay ipinahahayag ng “pinipigilan,” na maaaring tumukoy sa nagpapatuloy o paulit-ulit na pagtatangkang hadlangan siya, nang hindi ipinapalagay na lubos silang nagtagumpay.
- source_word: ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν
  choice: sapagkat hindi siya sumusunod na kasama namin
  rationale: Pinananatili ang ἀκολουθεῖ bilang “sumusunod” at ang tahasang μεθ’ ἡμῶν bilang “kasama namin.” Bagaman bahagyang di-pangkaraniwan ang pagkakabuo, iniiwasan nitong ipahiwatig na ang tao ay tumatangging sumunod kay Jesus o na ang mga alagad mismo ang dapat niyang sundin.
theological_decisions:
- issue: Kalabuan tungkol sa kinikilalang sinusundan at sa kaugnayan ng tao sa pangkat ng mga alagad
  choice: hindi siya sumusunod na kasama namin
  alternative: hindi siya sumusunod sa amin
  rationale: Tahasan sa Griyego ang “kasama namin” (μεθ’ ἡμῶν). Pinananatili nito ang tensiyon na ang reklamo ni Juan ay maaaring tungkol sa hindi pakikisama ng tao sa pangkat ng mga alagad, hindi tungkol sa pagtanggi niya kay Jesus.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Guro” bilang natural na tawag kay Jesus at pinanatili sa pangunahing teksto ang di-karaniwang “sumusunod na kasama namin” upang huwag burahin ang mahalagang “kasama namin” sa Griyego; nililinaw ng talababa ang mas natural ngunit mas mapagpasyang alternatibo.
