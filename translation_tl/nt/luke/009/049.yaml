  to: Sumagot naman si Juan, “Guro, may nakita kaming taong nagpapalayas ng mga demonyo sa pangalan mo, at sinikap namin siyang pigilan sapagkat hindi siya nakikisama sa amin bilang tagasunod.”[a]
