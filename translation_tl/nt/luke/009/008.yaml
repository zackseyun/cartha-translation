  yaml_path: translation/nt/luke/009/008.yaml
  text: and by some[a], that Elijah had appeared, and by others, that a prophet of the ancients had risen.
translation:
  language: tl
  text: at ang sabi naman ng ilan, nagpakita si Elias; at sabi ng iba, muling nabuhay ang isang propeta noong unang panahon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπό τινων ... ἄλλων
  choice: ang sabi naman ng ilan ... sabi ng iba
  rationale: Ipinahahayag ang pinagmulan ng magkakaibang ulat at likas na pinupunan sa Filipino ang elipsis mula sa naunang talata.
- source_word: δὲ ... δὲ
  choice: naman ... at ... iba
  rationale: Mahihinang pang-ugnay ang mga ito sa talaan ng mga opinyon; ipinakikita ng “naman” at “iba” ang paglipat nang hindi labis na nagpapahiwatig ng pagsalungat.
- source_word: Ἠλίας
  choice: Elias
  rationale: Karaniwang anyo ng pangalan sa tradisyong biblikal na Filipino.
- source_word: ἐφάνη
  choice: nagpakita
  rationale: Likas na salin ng diwang ‘lumitaw/naging nakikita’ at pinananatiling naiiba sa wikang tumutukoy sa muling pagkabuhay sa kasunod na sugnay.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: ang isa sa mga propeta noong unang panahon
  rationale: Natural sa Filipino at naihahatid ang di-tiyak na pagkakakilanlan ng propeta at ang pagkabilang niya sa mga propeta ng sinaunang panahon.
- source_word: ἀνέστη
  choice: muling nabuhay
  rationale: Sa konteksto, tumutukoy ito sa paniniwalang bumangon mula sa kamatayan ang isang propeta; malinaw at natural ang “muling nabuhay” sa Filipino nang hindi tinutukoy kung sino siya.
theological_decisions:
- issue: Likas ng pahayag tungkol sa propeta noong unang panahon
  choice: muling nabuhay
  alternative: bumangon / ibinangon
  rationale: Pinananatili ang pahiwatig ng pagkabuhay mula sa kamatayan sa ἀνέστη, ngunit hindi ipinapasiya kung aktibo o pasibo ang teolohikal na sanhi at hindi rin sinasang-ayunan ng tagapagsalaysay ang sabi-sabi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sabi” upang maging buo ang eliptikal na ulat sa Filipino, habang pinananatili ang ayos ng magkakaibang opinyon. Walang talababa dahil walang kinakailangang mahalagang alternatibong kahulugan sa bersong ito.
