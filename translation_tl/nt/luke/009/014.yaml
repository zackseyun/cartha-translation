- from: Sapagkat may humigit-kumulang na limang libong lalaki[a] doon. Ngunit sinabi niya sa kanyang mga alagad, “Pahigain ninyo sila para kumain, nang pangkat-pangkat na tig-humigit-kumulang limampu.”
  to: Sapagkat may humigit-kumulang limang libong lalaki[a]. Sinabi niya sa kanyang mga alagad, “Paupuin ninyo sila[b] sa mga pangkat na tig-humigit-kumulang limampu.”
  rationale: Inalis ang mga di-nakasulat na dagdag at ang di-kinakailangang kontrast. Ginawang natural ang utos sa modernong Tagalog, habang iningatan sa talababa ang mas tiyak na kahulugan ng postura sa pagkain. Inayos din ang mga footnote anchor at nilimitahan ang paliwanag ng “lalaki” sa sinasabi ng salita mismo.
