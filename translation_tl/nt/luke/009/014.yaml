  yaml_path: translation/nt/luke/009/014.yaml
  text: For there were about five thousand men[a]. And he said to his disciples[b], “Have them recline in groups of about fifty each.”
translation:
  language: tl
  text: Sapagkat may humigit-kumulang limang libong lalaki[a]. Sinabi niya sa kanyang mga alagad, “Paupuin ninyo sila[b] sa mga pangkat na tig-humigit-kumulang limampu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “mga lalaki,” na tumutukoy sa mga lalaking nasa hustong gulang, hindi sa buong karamihan.
    reason: lexical_alternative
  - marker: b
    text: O, “Papaghiligin ninyo sila.” Ang pandiwang Griego ay maaaring tumukoy sa pag-upo nang pahilig para sa isang kainan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ
  choice: humigit-kumulang
  rationale: Nagpapahiwatig ito ng tinatayang bilang, hindi eksaktong bilang, sa dalawang paglitaw nito sa talata.
- source_word: ἄνδρες
  choice: lalaki
  rationale: Tiyak na tumutukoy ang ἀνήρ sa mga lalaking nasa hustong gulang, hindi sa mga tao sa pangkalahatan.
- source_word: πεντακισχίλιοι
  choice: limang libo
  rationale: Tuwirang salin ng bilang na inilalarawan sa mga lalaki.
- source_word: Κατακλίνατε
  choice: Pahigain ninyo sila para kumain
  rationale: Ang pandiwa ay tumutukoy sa pagpapahiga o pagpapahilig sa mga tao sa ayos ng pagkain; nilinaw ng “para kumain” ang sinaunang gawi sa natural na modernong Tagalog.
- source_word: κλισίας
  choice: pangkat-pangkat
  rationale: Ipinapahayag ang pagkakaayos sa magkakahiwalay na grupo sa maikli at likas na Tagalog.
- source_word: ἀνὰ πεντήκοντα
  choice: tig-humigit-kumulang limampu
  rationale: Pinananatili ng “tig-” ang distributibong diwa ng ἀνά, habang ang “humigit-kumulang” ay sumasalamin sa ὡσεὶ.
- source_word: γὰρ ... δὲ
  choice: Sapagkat ... Ngunit
  rationale: Pinananatili ng “Sapagkat” ang paliwanag na ugnayan ng γάρ; ang “Ngunit” ay nagbibigay ng banayad na paglipat ng δέ sa salaysay.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: sa kanyang mga alagad
  rationale: Pinananatili ang tahasang panghalip na paari sa Griyego.
