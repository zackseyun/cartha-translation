source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς ἕτερον· Ἀκολούθει μοι. ὁ δὲ εἶπεν· ⸀Κύριε, ἐπίτρεψόν μοι ⸂ἀπελθόντι πρῶτον⸃ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/059.yaml
  text: Then he said to another[a], “Follow me.” But he said, “Lord, permit me first to go and bury my father.”
translation:
  language: tl
  text: Sinabi naman niya sa isa pa, “Sumunod ka sa akin.” Ngunit sinabi nito, “Panginoon, pahintulutan mo muna akong umalis upang ilibing ang aking ama.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: isa pa
  rationale: Likas sa makabagong Filipino ang “isa pa” para sa ibang taong binanggit sa pagpapatuloy ng salaysay, nang hindi dinaragdagan ang detalye.
- source_word: Ἀκολούθει μοι
  choice: Sumunod ka sa akin
  rationale: Tuwirang utos ito na natural na ipinahahayag sa Filipino sa pamamagitan ng “Sumunod ka sa akin.” Hindi kailangang tahasang idagdag ang aspektong nagpapatuloy sapagkat maaari itong magbigay ng labis na pagpapakahulugan.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili ng “Panginoon” kapuwa ang magalang na pagtawag kay Jesus at ang posibleng mas malalim na teolohikal na bigat ng titulo.
- source_word: ἐπίτρεψόν μοι
  choice: pahintulutan mo ... akong
  rationale: Malinaw nitong ipinahahayag ang paghingi ng pahintulot at ang magalang na himig ng pakiusap.
- source_word: ἀπελθόντι πρῶτον
  choice: muna akong umalis
  rationale: Ipinakikita ng “muna” ang hinihinging pagkakasunod-sunod, at ipinapahayag ng “umalis” ang pagpunta niya mula roon bago ang paglilibing.
- source_word: θάψαι τὸν πατέρα μου
  choice: upang ilibing ang aking ama
  rationale: Tuwiran at natural na salin ito ng layuning ilibing ang sariling ama.
theological_decisions:
- issue: Pagtawag na κύριος kay Jesus
  choice: Panginoon
  alternative: Ginoo
  rationale: Ang “Panginoon” ay hindi naglilimita sa salita sa isang karaniwang magalang na tawag lamang; pinananatili nito ang tensiyon sa pagitan ng paggalang ng nagsasalita at ng teolohikal na kahulugan ng titulo sa salaysay ni Lucas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “isa pa” at “muna akong umalis” para sa natural na daloy, habang pinananatili ang tuwirang utos at magalang na pakiusap.
