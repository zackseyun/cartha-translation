translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kautusan” bilang pantukoy sa Kautusang Judio at ang “nilalait” upang mapanatili ang lakas ng ὑβρίζεις nang hindi nagiging lipas o labis na teknikal.
