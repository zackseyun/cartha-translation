  yaml_path: translation/nt/luke/011/045.yaml
  text: Then one of the lawyers answered and said to him[a], “Teacher[b], in saying these things you insult us also.”
translation:
  language: tl
  text: Sumagot sa kanya ang isa sa mga dalubhasa sa Kautusan[a], “Guro, sa mga sinasabi mong ito, nilalait mo rin kami.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay tumutukoy sa mga eksperto sa Kautusang Judio, hindi kinakailangang sa mga abogado sa makabagong kahulugan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “hinahamak mo rin kami.” Maaaring tumukoy ang pandiwa sa pang-iinsulto, panghihiya, o pagtrato nang may paghamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δέ
  choice: Sumagot
  rationale: Ang aorist participle ay karaniwang nagpapakilala ng tugon sa salaysay. Likas sa Tagalog ang “Sumagot”; hindi na kailangang isalin nang hiwalay ang mahinang pang-ugnay na δέ.
- source_word: τις τῶν νομικῶν
  choice: ang isa sa mga dalubhasa sa Kautusan
  rationale: Ang νομικός dito ay eksperto sa Kautusang Judio, hindi abogado sa makabagong propesyonal na kahulugan. Nililinaw ng “dalubhasa sa Kautusan” ang papel niya sa konteksto.
- source_word: λέγει αὐτῷ
  choice: at sinabi sa kanya
  rationale: Bagaman historical present ang λέγει, natural itong isalaysay sa nagdaang panahunan sa Tagalog. Pinananatili ng “sa kanya” ang tahasang layon.
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Ang “Guro” ay natural, magalang, at tuwirang katumbas ng katawagang διδάσκαλε.
- source_word: ταῦτα λέγων
  choice: sa pagsasabi mo ng mga bagay na ito
  rationale: Ipinapakita ng parirala na ang mismong mga sinabi ni Jesus ang batayan ng reklamo, habang pinananatili ang kasabay na diwa ng participle.
- source_word: καὶ ἡμᾶς
  choice: rin kami
  rationale: Ipinahihiwatig ng καί na kasama rin ang mga dalubhasa sa Kautusan sa mga tinatamaan ng sinabi ni Jesus.
- source_word: ὑβρίζεις
  choice: nilalait mo
  rationale: Ang ὑβρίζω ay mas malakas kaysa simpleng “nakasasakit” o “nakagagalit”; ipinahihiwatig nito ang pang-iinsulto o paghamak. Natural at angkop sa kasalukuyang Tagalog ang “nilalait.”
