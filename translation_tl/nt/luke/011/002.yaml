id: LUK.11.2
reference: Luke 11:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὅταν προσεύχησθε, λέγετε· ⸀Πάτερ, ἁγιασθήτω τὸ ὄνομά σου· ἐλθέτω ἡ βασιλεία ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/002.yaml
  text: 'And he said to them[a], “When you pray, say: ‘Father, hallowed be your name[b]. Your kingdom come.’”'
translation:
  language: tl
  text: 'Sinabi niya sa kanila, “Kapag nananalangin kayo, sabihin ninyo: ‘Ama[a], nawa’y kilalaning banal ang pangalan mo[b]. Dumating nawa ang kaharian mo.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang tradisyon ng pagsasalin, “Ama namin,” ayon sa kaparis na panalangin sa Mateo 6:9; ngunit “Ama” lamang ang nasa tekstong Griyego rito.
    reason: alternative_reading
  - marker: b
    text: O, “pakabanalin nawa ang pangalan mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν προσεύχησθε
  choice: Kapag nananalangin kayo
  rationale: Likas na Filipino para sa pangkalahatan o paulit-ulit na kalagayang temporal; hindi nito labis na binibigyang-diin ang dalas.
- source_word: λέγετε
  choice: sabihin ninyo
  rationale: Malinaw na utos sa maramihang kausap at natural sa makabagong Filipino.
- source_word: Πάτερ
  choice: Ama
  rationale: Tuwirang tinutumbasan ang nag-iisang bokatibong Πάτερ at hindi dinaragdagan ng “namin” mula sa kaparis na talata sa Mateo.
- source_word: ἁγιασθήτω
  choice: nawa’y kilalaning banal
  rationale: 'Pinananatili ang anyong pakiusap at ang pasibong diwa: hinihiling na ang pangalan ng Diyos ay kilalanin at igalang bilang banal, hindi na para bang hindi pa ito banal.'
- source_word: τὸ ὄνομά σου
  choice: ang pangalan mo
  rationale: Pinananatili ang konkretong biblikal na pahayag, na maaaring sumaklaw sa ipinahayag na pagkakakilanlan, dangal, at reputasyon ng Diyos.
- source_word: ἐλθέτω ἡ βασιλεία σου
  choice: Dumating nawa ang kaharian mo
  rationale: Ang “nawa” ay likas na naghahayag ng mapanalanging puwersa ng pangatlong panauhang pautos; pinananatili ng “kaharian” ang saklaw ng βασιλεία bilang paghahari at kaharian.
theological_decisions:
- issue: Pagtawag sa Diyos bilang “Ama” nang walang “namin”
  choice: Ama
  alternative: Ama namin
  rationale: Πάτερ lamang ang nasa ibinigay na tekstong Griyego. Hindi ito itinugma sa Mateo 6:9 o sa nakagawiang anyong liturhikal.
- issue: Kahulugan ng ἁγιασθήτω τὸ ὄνομά σου
  choice: nawa’y kilalaning banal ang pangalan mo
  alternative: pakabanalin nawa ang pangalan mo
  rationale: Ipinahahayag nito ang pakiusap na kilalanin at tratuhing banal ang pangalan ng Diyos, habang iniiwasang ipahiwatig na kailangan pang gawing banal ang Diyos o ang kanyang pangalan.
- issue: Saklaw ng βασιλεία
  choice: kaharian
  alternative: paghahari
  rationale: Ang “kaharian” ay natural at nakaugat sa wikang biblikal na Filipino, habang hinahayaang manatili ang saklaw ng salita sa aktibong paghahari ng Diyos at sa ganap na pagdating nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nawa” bilang natural na anyo ng mapanalanging pakiusap, at iniwasan ang sobrang arkaiko o teknikal na pananalita.
