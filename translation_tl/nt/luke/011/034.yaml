revisions:
- from: Ang mata mo ang ilawan ng iyong katawan. Kapag maayos ang iyong mata[a], puno rin ng liwanag ang buo mong katawan; ngunit kapag masama ito[b], madilim din ang iyong katawan.
  to: Ang mata mo ang lampara ng katawan mo. Kapag maayos ang mata mo[a], puno rin ng liwanag ang buong katawan mo; ngunit kapag masama ang mata mo[b], madilim din ang katawan mo.
  rationale: Inulit ang “mata mo” sa magkabilang kondisyon upang tularan ang malinaw na paralelismo ng Griyego at alisin ang posibleng malabong sanggunian ng “ito.” Pinalitan ang “ilawan” ng “lampara” bilang mas tuwirang modernong katumbas ng λύχνος. Inayos ang talababa a upang malinaw at natural na maipakita ang alternatibong diwa ng ἁπλοῦς nang hindi nilulutas ang ambigwidad nito.
