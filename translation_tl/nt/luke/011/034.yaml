  naturalness: Natural ang karamihan ng daloy. Mas malinaw at mas maayos ang paralelismo kung uulitin ang “ang iyong mata” sa ikalawang sugnay. Ang “buo mong katawan” ay natural, ngunit “ang buong katawan mo” ay mas payak sa ayos na ito.
