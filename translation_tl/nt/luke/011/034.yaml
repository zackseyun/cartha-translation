  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός ⸀σου. ⸀ὅταν ὁ ὀφθαλμός σου ἁπλοῦς ᾖ, καὶ ὅλον τὸ σῶμά σου φωτεινόν ἐστιν· ἐπὰν δὲ πονηρὸς ᾖ, καὶ τὸ σῶμά σου σκοτεινόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/034.yaml
  text: The lamp of your body is your eye[a]. When your eye is healthy, your whole body also is full of light; but when it is bad[b], your body also is dark.
translation:
  language: tl
  text: Ang mata mo ang lampara ng katawan mo. Kapag maayos ang mata mo[a], puno rin ng liwanag ang buong katawan mo; ngunit kapag masama ang mata mo[b], madilim din ang katawan mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malinaw” o “malusog”; mas literal, “hindi hati” o “iisa ang tuon.” Maaaring tumukoy ang salitang Griyego sa matang buo ang tuon o wastong gumaganap.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “may diperensiya” o “masama sa moral.” Maaaring ipahiwatig ng salitang Griyego kapuwa ang depektibong mata at ang baluktot na pananaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: ilawan
  rationale: Tumutukoy ito sa isang kongkretong pinagmumulan ng liwanag, hindi sa abstraktong “liwanag”; pinananatili ng “ilawan” ang talinghaga.
- source_word: σῶμα
  choice: katawan
  rationale: Karaniwang kahulugan ito ng salita rito at siyang angkop sa talinghaga tungkol sa mata, liwanag, at dilim.
- source_word: ὀφθαλμός
  choice: mata
  rationale: Pinananatili ang literal na bahagi ng katawan na siyang batayan ng talinghaga tungkol sa panloob na pananaw.
- source_word: ὅταν ... ᾖ
  choice: Kapag ...
  rationale: Ipinahahayag ng parirala ang pangkalahatang temporal-kondisyonal na diwa; natural itong naisasalin sa Filipino bilang “kapag.”
- source_word: ἁπλοῦς
  choice: maayos
  rationale: Sa paghahambing sa masamang mata, ipinahihiwatig nito ang matang buo o wastong gumaganap. Ang “maayos” ay likas sa modernong Filipino at hindi lubusang nag-aalis sa posibilidad ng moral na diwa.
- source_word: ὅλον ... φωτεινόν
  choice: puno rin ng liwanag ang buo mong katawan
  rationale: Malinaw at natural nitong ipinahahayag ang pagiging maliwanag o puspos ng liwanag habang pinananatili ang larawan ng talata.
- source_word: ἐπὰν δὲ
  choice: ngunit kapag
  rationale: Pinananatili nito ang magkatulad na temporal-kondisyonal na ayos ng dalawang sugnay at malinaw na ipinakikita ang pagsalungat.
- source_word: πονηρός
  choice: masama
  rationale: Maaaring mangahulugan ang salita ng “masama” sa paggana o ng “masama” sa moral na diwa. Pinananatili ng saling ito ang dalawang posibilidad.
- source_word: σκοτεινόν
  choice: madilim
  rationale: Tuwiran at maikli itong katumbas na nagpapanatili sa pagsalungat sa pagiging puno ng liwanag.
theological_decisions:
- issue: Kahulugan ng ἁπλοῦς sa paglalarawan sa mata
  choice: maayos
  alternative: malinaw, malusog, payak, o iisa ang tuon
  rationale: Ang agarang talinghaga ay tungkol sa mata bilang ilawan ng katawan at sa bunga nitong liwanag o dilim. Ipinahahayag ng “maayos” ang wastong paggana nang hindi tahasang nilulutas kung pisikal, moral, o panloob na pagkakaisa ang pangunahing diin.
- issue: Kahulugan ng πονηρός sa paglalarawan sa mata
  choice: masama
  alternative: may diperensiya, hindi malusog, o baluktot
  rationale: Ang “masama” ay maaaring tumukoy kapuwa sa depektibong mata at sa moral na baluktot na pananaw, kaya napapanatili ang sadyang tensiyon ng orihinal.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “mata mo” at “buo mong katawan” para sa likas na daloy, habang pinanatili ang kongkretong talinghaga at ang leksikal na kalabuan ng ἁπλοῦς at πονηρός.
