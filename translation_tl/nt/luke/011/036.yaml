id: LUK.11.36
reference: Luke 11:36
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ οὖν τὸ σῶμά σου ὅλον φωτεινόν, μὴ ἔχον ⸂μέρος τι⸃ σκοτεινόν, ἔσται φωτεινὸν ὅλον ὡς ὅταν ὁ λύχνος τῇ ἀστραπῇ φωτίζῃ σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/036.yaml
  text: If[a], then, your whole body is full of light, having no dark part, it will be wholly full of light, as when a lamp lights you with its brightness.
translation:
  language: tl
  text: Kaya, kung maliwanag ang buo mong katawan at wala itong anumang bahaging madilim, magiging maliwanag ang buong katawan mo, gaya ng kapag tinatanglawan ka ng isang ilawan sa ningning nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kislap nito”; ang salitang Griyego ay maaaring mangahulugang kislap o ningning, ngunit dito ay malamang na tumutukoy sa pagsinag ng ilawan at hindi sa literal na kidlat.
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶμά
  choice: katawan
  rationale: Pinananatili ang konkretong larawan ng katawan sa pahayag ni Jesus sa halip na ipakahulugan agad bilang buong pagkatao o panloob na kalagayan.
- source_word: ὅλον
  choice: buo / buong
  rationale: Inihahayag ang kabuuang saklaw ng ὅλον sa dalawang paglitaw nito at natural sa modernong Tagalog.
- source_word: φωτεινόν
  choice: maliwanag
  rationale: Direkta at likas na katumbas na malinaw na sumasalungat sa “madilim,” nang hindi dinaragdagan ang talinghagang kahulugan.
- source_word: μὴ ἔχον μέρος τι σκοτεινόν
  choice: wala itong anumang bahaging madilim
  rationale: Pinananatili ang larawan ng isang bahaging madilim habang maayos at malinaw ang ayos sa Tagalog.
- source_word: ἔσται
  choice: magiging
  rationale: Tumpak na ipinahahayag ang payak na panghinaharap ng εἰμί.
- source_word: ὡς ὅταν
  choice: gaya ng kapag
  rationale: Pinananatili kapwa ang paghahambing at ang pangkalahatang panahong ipinakikilala ng parirala.
- source_word: λύχνος
  choice: ilawan
  rationale: Tumutukoy sa konkretong ilawang nagbibigay-liwanag, hindi sa abstraktong liwanag o sa patungan ng ilawan.
- source_word: τῇ ἀστραπῇ
  choice: sa ningning nito
  rationale: Ang ἀστραπή ay maaaring tumukoy sa kislap o ningning; dahil ilawan ang simuno rito, natural na tumutukoy ito sa maningning na pagsinag ng ilawan.
- source_word: φωτίζῃ σε
  choice: tinatanglawan ka
  rationale: Natural na Tagalog para sa pagbibigay-liwanag sa isang tao at pinananatili ang tuwirang layong σε.
theological_decisions:
- issue: Talinghagang gamit ng “katawan” at “liwanag”
  choice: Panatilihin ang larawan ng katawan, liwanag, at dilim nang hindi ito ipinapaliwanag bilang kaluluwa, moralidad, o espirituwal na kalagayan.
  alternative: Isalin ang “katawan” bilang “buong pagkatao” o ipaliwanag ang liwanag bilang tahasang espirituwal o moral na kalagayan.
  rationale: Nakaugnay ang talinghaga sa naunang pahayag tungkol sa mata bilang ilawan ng katawan. Ang pagpapanatili sa mismong larawan ay umiiwas sa paglutas ng sadyang bukás na teolohikal na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pag-uulit ng “buo/buong” at ang konkretong larawan ng katawan at ilawan, habang ginawang natural ang ayos ng pangungusap.
