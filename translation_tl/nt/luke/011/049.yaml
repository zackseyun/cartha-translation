id: LUK.11.49
reference: Luke 11:49
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὰ τοῦτο καὶ ἡ σοφία τοῦ θεοῦ εἶπεν· Ἀποστελῶ εἰς αὐτοὺς προφήτας καὶ ἀποστόλους, καὶ ἐξ αὐτῶν ἀποκτενοῦσιν καὶ ⸀διώξουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/049.yaml
  text: For this reason also the wisdom of God said[a], ‘I will send to them prophets and apostles, and some of them they will kill and persecute,’
translation:
  language: tl
  text: Dahil dito, sinabi rin ng karunungan ng Diyos[a], “Magsusugo ako sa kanila ng mga propeta at mga apostol, at ang ilan sa mga ito ay papatayin nila at uusigin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “karunungan ng Diyos” ay maaaring unawain bilang personipikasyon ng banal na karunungan, bilang matalinong pasiya ng Diyos, o bilang di-tuwirang pagtukoy ni Jesus sa sarili.
    reason: Pinananatili ang leksikal at teolohikal na kalabuan ng parirala.
lexical_decisions:
- source_word: διὰ τοῦτο καὶ
  choice: Dahil dito ... rin
  rationale: Likas na ipinapahayag ng “Dahil dito” ang ugnayang sanhi o batayan sa naunang sinabi, habang pinananatili ng “rin” ang pandagdag na diin ng καὶ.
- source_word: ἡ σοφία τοῦ θεοῦ
  choice: ang karunungan ng Diyos
  rationale: Malapit ito sa anyong Griyego at hindi nito pinagpapasiyahan kung personipikasyon ito ng banal na karunungan, matalinong pasiya ng Diyos, o di-tuwirang pagtukoy ni Jesus sa sarili.
- source_word: εἶπεν
  choice: sinabi
  rationale: Payak, natural, at hindi labis na nagpapakahulugan sa pandiwang nasa nakaraang panahunan.
- source_word: Ἀποστελῶ εἰς αὐτούς
  choice: Magsusugo ako sa kanila
  rationale: Tumpak na ipinahahayag ang kilos sa hinaharap at ang patutunguhan ng pagsusugo.
- source_word: προφήτας καὶ ἀποστόλους
  choice: mga propeta at mga apostol
  rationale: Karaniwang katawagan sa Bagong Tipan; pinananatili ng “apostol” ang malamang na teknikal na diwa kaysa sa pangkalahatang “mga sugo.”
- source_word: ἐξ αὐτῶν
  choice: ang ilan sa mga ito
  rationale: 'Ipinapakita ang partitive na diwa: ang tinutukoy ay ilan mula sa mga propeta at apostol na isinugo.'
- source_word: ἀποκτενοῦσιν καὶ διώξουσιν
  choice: papatayin nila at uusigin
  rationale: Tuwiran at natural na salin na nagpapanatili sa magkatambal na mga pandiwa at sa kanilang anyong panghinaharap.
theological_decisions:
- issue: Kahulugan ng “karunungan ng Diyos”
  choice: Pinanatili ang pariralang “karunungan ng Diyos” nang walang tahasang pagtukoy kung sino o ano ito.
  alternative: Maaari itong unawain bilang personipikasyon ng banal na karunungan, matalinong pasiya ng Diyos, o di-tuwirang pagtukoy ni Jesus sa sarili.
  rationale: May tunay na kalabuan ang parirala sa konteksto. Hindi dapat pasiyahan ng salin ang isang interpretasyong hindi tahasang itinakda ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magsusugo” at “uusigin” bilang mga salitang pamilyar sa wikang biblikal ngunit nauunawaan pa rin ng karaniwang mambabasa. Pinanatili ang ayos na “ang ilan sa mga ito ay papatayin nila at uusigin” upang manatiling malapit sa saklaw ng Griyegong parirala nang hindi nagdaragdag ng “ang iba,” na wala sa teksto.
