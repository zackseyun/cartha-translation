base_translation:
  language: en
  yaml_path: translation/nt/luke/011/019.yaml
  text: But if I cast out the demons by Beelzebul[b][a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: tl
  text: Ngunit kung sa pamamagitan ni Beelzebul ay nagpapalayas ako ng mga demonyo, sa pamamagitan ng sino nagpapalayas ang mga anak ninyo?[a] Kaya sila mismo ang magiging mga hukom ninyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pamamagitan ng ano” o “sa pamamagitan ng anong kapangyarihan.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaaring isalin nang hindi tahasang ipinapakita ang diin: “Kaya sila ang magiging mga hukom ninyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ ἐγὼ
  choice: Ngunit kung ... ako
  rationale: Ginamit ang “ngunit kung” upang mapanatili ang banayad na pagsalungat ng δέ at ang lohika ng argumento. Nananatili ang tahasang “ako” bilang katapat ng “mga anak ninyo.”
- source_word: ἐν Βεελζεβοὺλ
  choice: sa pamamagitan ni Beelzebul
  rationale: Instrumental ang diwa ng ἐν dito. Malinaw at likas sa Tagalog ang “sa pamamagitan ni,” samantalang ang “sa kapangyarihan ni” ay magdaragdag ng pagpapakahulugang hindi tahasang nasa Griyego.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: nagpapalayas ... ng mga demonyo
  rationale: Karaniwang makabagong Tagalog ang “nagpapalayas” para sa pagpapaalis ng mga demonyo at pinananatili nito ang tiyak na sanggunian sa mga espiritung demonyo.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: ang mga anak ninyo
  rationale: Pinananatili ang literal na ugnayang “mga anak” nang hindi ito ipinapakahulugan sa pangunahing teksto bilang mga alagad, tagasunod, o kapwa Judio. Sa Tagalog, likas na walang tiyak na kasarian ang “anak,” ngunit ito ang pinakamalinaw at pinakanatural na katumbas sa kontekstong ito.
- source_word: ἐν τίνι
  choice: sa pamamagitan nino
  rationale: Ang tanong ay tungkol sa personal na ahensiya o pinagmumulan ng pagpapalayas. Ang “nino” ay likas na Tagalog na katapat ng personal na interrogative sa pariralang ito; ang ibang posibleng pagbasa tungkol sa paraan o kapangyarihan ay inilagay sa talababa.
- source_word: διὰ τοῦτο
  choice: Kaya
  rationale: Maikli at natural na panandang panghinuha ang “kaya,” at malinaw nitong inuugnay ang konklusyon sa naunang retorikal na tanong.
- source_word: αὐτοὶ ὑμῶν κριταὶ ἔσονται
  choice: sila mismo ang magiging mga hukom ninyo
  rationale: Ang “sila mismo” ay tahasang nagpapanatili sa diin ng αὐτοί, at ang “magiging mga hukom ninyo” ay malapit sa anyong nominal ng Griyego nang hindi agad nilulutas kung paano isasagawa ang paghatol.
theological_decisions:
- issue: Pagkakakilanlan ng “mga anak ninyo”
  choice: Panatilihin ang “mga anak ninyo.”
  alternative: mga tagasunod ninyo; mga alagad ninyo; mga kapwa Judio ninyo
  rationale: Hindi tinutukoy nang tahasan ng talata kung alin sa mga pangkat na ito ang ibig sabihin. Kaya hindi nilutas sa salin ang tunay na kalabuan ng οἱ υἱοὶ ὑμῶν.
- issue: Diwa ng pagiging “mga hukom”
  choice: Panatilihin ang nominal na pahayag na “magiging mga hukom ninyo.”
  alternative: sila ang hahatol sa inyo; sila ang magpapatunay na mali kayo
  rationale: Pinananatili nito ang teolohikal at retorikal na bigat ng κριταί nang hindi nililimitahan ang pahayag sa isang paliwanag lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nagpapalayas” sa halip na mas arkaikong pananalita, at pinanatili ang pangalang “Beelzebul” bilang transliterasyon. Ang “naman” ay likas na panandang paghahambing sa Tagalog at inililinaw ang retorikal na pagtutulad nang hindi binabago ang argumento.
