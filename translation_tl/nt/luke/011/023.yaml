id: LUK.11.23
reference: Luke 11:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/023.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: tl
  text: “Ang hindi panig sa akin ay laban sa akin,[a] at ang hindi nagtitipon kasama ko ay nagpapangalat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang sinumang hindi kasama ko ay laban sa akin, at ang sinumang hindi nagtitipon kasama ko ay nagpapangalat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: ang hindi panig
  rationale: Ang artikulo at pangkasalukuyang participle ay tumutukoy sa sinumang inilalarawan ng hindi pakikiayon kay Jesus. Ang “ang hindi panig” ay natural sa modernong Tagalog at malinaw na naghahayag ng paninindigan, bagaman hindi nito inuulit nang literal ang pandiwang “ay.”
- source_word: μετ’ ἐμοῦ
  choice: sa akin / kasama ko
  rationale: Ang μετά na may genitive ay nagsasaad ng pakikisama o pakikiayon. Sa unang sugnay, natural ang idyomang “panig sa akin”; sa ikalawa, pinananatili ng “kasama ko” ang diwa ng pakikibahagi sa pagtitipon.
- source_word: κατ’ ἐμοῦ
  choice: laban sa akin
  rationale: Ang κατά na may genitive ay nagpapahayag ng pagsalungat. Ang “laban sa akin” ang tuwiran at malinaw na katapat, at pinananatili nito ang matinding paghaharap sa “panig sa akin.”
- source_word: συνάγων
  choice: nagtitipon
  rationale: Ang participle ay nangangahulugang nagtitipon o nagsasama-sama. Ang “nagtitipon” ay maikli, pangkaraniwan, at nagpapanatili sa talinghagang kasalungat ng pagpapangalat.
- source_word: σκορπίζει
  choice: nagpapangalat
  rationale: Ang pandiwa ay nangangahulugang magkalat o magpanghiwa-hiwalay. Ang “nagpapangalat” ay malinaw na kasalungat ng “nagtitipon” at nagpapahiwatig ng pagkilos na nagbubunga ng pagkawatak-watak.
- source_word: καὶ
  choice: at
  rationale: Payak nitong pinag-uugnay ang dalawang magkatulad na sugnay; pinananatili ng “at” ang tuwirang parallelismo.
theological_decisions:
- issue: Tindi ng pahayag ni Jesus tungkol sa pagiging neutral sa kaniya
  choice: Ang hindi panig kay Jesus ay laban sa kaniya; hindi pinalalambot ang matinding paghahating ipinahahayag ng Griyego.
  alternative: Isaling tila kawalan lamang ng aktibong pagsuporta, o limitahan sa eksorsismo ang pahayag sa mismong salin.
  rationale: Ganap at tuwiran ang anyo ng Griyego. Pinananatili ng salin ang teolohikal na tensiyon nang hindi nagdaragdag ng sistematikong paliwanag o denominasyonal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang idiomatikong “panig sa akin” sa unang sugnay upang natural na maipahayag ang pakikiayon, habang ang talababa ay nagbibigay ng mas pormal na katapat ng substantival participle.
