  to: Sinasabi ko sa inyo, kahit hindi bumangon ang taong nasa loob upang bigyan ang humihingi dahil kaibigan niya ito, dahil sa walang-kahihiyang pagpupumilit[a] ng taong iyon ay babangon siya at ibibigay sa kanya ang lahat ng kailangan niya.
  rationale: Nilinaw ng rebisyon ang dalawang tauhan upang maiwasan ang kalabuan ng magkakasunod na panghalip. Pinanatili nito ang concessive na ugnayan («kahit»), ang dahilan na may diin («dahil sa»), at ang kontekstuwal ngunit matalim na diwa ng ἀναίδεια. Hindi nito ipinapakahulugan ang talinghaga nang lampas sa ipinahahayag ng talata.
