  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς διὰ τὸ εἶναι ⸂φίλον αὐτοῦ⸃, διά γε τὴν ἀναίδειαν αὐτοῦ ἐγερθεὶς δώσει αὐτῷ ⸀ὅσων χρῄζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/008.yaml
  text: I tell you[a], even if he will not get up and give him anything because he is his friend, yet because of his shameless persistence he will get up and give him whatever he needs.
translation:
  language: tl
  text: Sinasabi ko sa inyo, kahit hindi bumangon ang taong nasa loob upang bigyan ang humihingi dahil kaibigan niya ito, dahil sa walang-kahihiyang pagpupumilit[a] ng taong iyon ay babangon siya at ibibigay sa kanya ang lahat ng kailangan niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil sa kanyang kapangahasan,” “dahil sa kanyang katapangan,” o, sa mas literal na salin, “dahil sa kanyang kawalan ng hiya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Sinasabi ko sa inyo
  rationale: Likas at tuwirang pormula sa makabagong Tagalog para sa mariing pananalita ni Jesus.
- source_word: εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς
  choice: kahit hindi siya bumangon at magbigay sa kanya
  rationale: Pinananatili ng “kahit” ang concessive na puwersa; ang “bumangon” ay angkop sa tagpong bumabangon mula sa higaan.
- source_word: διὰ τὸ εἶναι φίλον αὐτοῦ
  choice: dahil kaibigan niya ito
  rationale: Tuwirang pinananatili ang personal na ugnayang ipinahahayag ng φίλον αὐτοῦ, sa halip na gawing abstraktong “pagkakaibigan.”
- source_word: διά γε
  choice: pa rin ... dahil sa
  rationale: Ipinakikita ng “pa rin” ang mariing pagbaligtad mula sa hindi sapat na dahilan ng pagiging kaibigan tungo sa dahilan na humihimok sa kaniya na kumilos.
- source_word: ἀναίδειαν
  choice: walang-kahihiyang pagpupumilit
  rationale: Pinananatili ang matalim na literal na diwa ng kawalan ng hiya habang nililinaw na sa konteksto ay tumutukoy ito sa mapilit at hindi napapahiyang paghingi.
- source_word: ἐγερθεὶς δώσει αὐτῷ
  choice: babangon ... siya at ibibigay
  rationale: Sa konteksto, tumutukoy ito sa pagbangon mula sa higaan upang ibigay ang hinihingi.
- source_word: ὅσων χρῄζει
  choice: ang lahat ng kailangan nito
  rationale: Ipinahahayag ang buong dami ng mga bagay na kailangan, at malinaw na ang “nito” ay tumutukoy sa humihinging kaibigan.
theological_decisions:
- issue: Diwa ng ἀναίδεια sa talinghaga
  choice: walang-kahihiyang pagpupumilit ng humihingi
  alternative: katapangan; kapangahasan; kawalan ng hiya
  rationale: Hindi tahasang pinupuri ng teksto ang kabastusan bilang moral na asal. Gayunman, hindi rin dapat alisin ang negatibong talim ng salita; kaya pinagsama ang “walang-kahihiyan” at “pagpupumilit” upang mapanatili ang tensiyon at maipakita ang bisa nito sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “siya” para sa lalaking nasa loob ng bahay at ang “ito/nito” para sa kaibigang humihingi upang mabawasan ang kalituhan sa magkakasunod na panghalip.
