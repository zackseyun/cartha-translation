  source_fidelity: 'Ang draft ay tapat sa pangunahing daloy ng Griyego: concessive ang «kahit», kapwa tumutukoy sa pagbangon ang dalawang pandiwa, at ang huling sugnay ay naghahatid ng pagbibigay ng lahat ng kailangan. Gayunman, ang magkakasunod na «siya/kanya/ito/nito» ay nagdudulot ng di-kailangang kalabuan sa kung sino ang bumabangon at kung sino ang humihingi. Ang rebisyon ay nililinaw ang mga tauhan nang hindi nagdaragdag ng kahulugang wala sa teksto.'
  naturalness: Ang «dahil kaibigan niya ito» ay posible ngunit mabigat at hindi gaanong likas sa makabagong Tagalog sa loob ng mahabang hanay ng panghalip. Mas malinaw at natural ang pagtukoy sa «taong humihingi» at «kaibigan» sa unang pagbanggit, saka paggamit ng panghalip kung malinaw na ang tinutukoy.
  terminology: 'Ang «walang-kahihiyang pagpupumilit» ay mahusay na katumbas ng ἀναίδεια sa kontekstong ito: nananatili ang talim ng “walang hiya” at naipahihiwatig ang mapilit na paghingi. Ang mga alternatibo sa talababa ay angkop, bagaman mas idiomatiko ang «sa mas literal na salin» kaysa «sa mas literal na paraan».'
