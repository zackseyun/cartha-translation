  text: ὁ δὲ Φαρισαῖος ἰδὼν ἐθαύμασεν ὅτι οὐ πρῶτον ἐβαπτίσθη πρὸ τοῦ ἀρίστου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/038.yaml
  text: But the Pharisee, when he saw it, was astonished that he had not first washed before the meal.
translation:
  language: tl
  text: Ngunit nang makita ito ng Pariseo, nagtaka siya dahil hindi muna naghugas[a] si Jesus bago kumain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi muna nagsagawa ng ritwal na paghuhugas.” Ang pandiwang Griyego ay siya ring madalas gamitin sa diwang “magbautismo,” ngunit dito ay tumutukoy ito sa ritwal na paghuhugas ayon sa kaugalian ng mga Pariseo.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig nito ang banayad na pagsalungat o pag-usad ng salaysay mula sa naunang talata.
- source_word: Φαρισαῖος
  choice: ang Pariseo
  rationale: Karaniwan at malinaw na tawag sa kasapi ng pangkat na ito; likas ding naipapahayag ang tiyak na pantukoy ng Griyego.
- source_word: ἰδὼν
  choice: nang makita ito
  rationale: Ipinapakita ng aorist participle na nauna ang pagkakita sa pagtataka; ang “ito” ay tumutukoy sa ginawa ni Jesus ayon sa konteksto.
- source_word: ἐθαύμασεν
  choice: nagtaka siya
  rationale: Natural na Filipino para sa reaksiyong may pagkagulat; hindi nito dinaragdagan ang teksto ng tahasang galit o pagsaway.
- source_word: οὐ πρῶτον
  choice: hindi muna
  rationale: Malinaw na ipinapahayag ang inaasahang pagkakasunod-sunod ng gawain bago ang pagkain.
- source_word: ἐβαπτίσθη
  choice: naghugas
  rationale: Sa konteksto ng kaugalian ng mga Pariseo bago kumain, tumutukoy ito sa ritwal na paghuhugas, hindi sa bautismong Kristiyano. Ang aktibong anyo ay mas natural sa Filipino kaysa sa literal na pasibong anyo.
- source_word: πρὸ τοῦ ἀρίστου
  choice: bago kumain
  rationale: Likas at madaling maunawaang Filipino na hindi labis na tinutukoy kung almusal o tanghalian ang ἄριστον.
theological_decisions:
- issue: Kahulugan ng ἐβαπτίσθη sa konteksto ng pagkain kasama ng isang Pariseo
  choice: ritwal na paghuhugas bago kumain, isinaling “naghugas”
  alternative: “nagpabautismo” o “inilubog ang sarili”
  rationale: Ang agarang konteksto ay ang kaugaliang pangkalinisan ng mga Pariseo bago kumain, hindi ang bautismong Kristiyano. Nililinaw ito ng pangunahing salin habang itinatala sa talababa ang ritwal na diwa at ugnayang leksikal sa pandiwang ginagamit para sa pagbautismo.
- issue: Hindi tahasang binanggit na simuno ng ἐβαπτίσθη
  choice: “si Jesus”
  alternative: “siya”
  rationale: Ang simuno ay nauunawaan mula sa konteksto bilang si Jesus. Ang tahasang pangalan ay kailangan sa Filipino upang maiwasang mapagkamalang ang Pariseo ang hindi naghugas.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “Pariseo,” “nagtaka,” at “bago kumain” bilang mga salitang madaling maunawaan ng karaniwang mambabasa, habang pinananatili sa talababa ang mahalagang ritwal at leksikal na diwa ng ἐβαπτίσθη.
