id: LUK.11.18
reference: Luke 11:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ὁ Σατανᾶς ἐφ’ ἑαυτὸν διεμερίσθη, πῶς σταθήσεται ἡ βασιλεία αὐτοῦ; ὅτι λέγετε ἐν Βεελζεβοὺλ ἐκβάλλειν με τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/018.yaml
  text: But if Satan also is divided against himself[a], how will his kingdom stand? For you say that I cast out the demons by Beelzebul.
translation:
  language: tl
  text: Ngunit kung si Satanas din ay nahahati laban sa kanyang sarili, paano mananatili ang kanyang kaharian? Sapagkat sinasabi ninyong nagpapalayas ako ng mga demonyo sa pamamagitan ni Beelzebul[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griyego: Beelzebul; sa ilang tradisyong Ingles, Beelzebub ang gamit.'
    reason: alternative_reading
lexical_decisions:
- source_word: Σατανᾶς
  choice: Satanas
  rationale: Karaniwang anyong Filipino ng personal na pangalan o titulong Griyego.
- source_word: ἐφ’ ἑαυτὸν
  choice: laban sa kanyang sarili
  rationale: Kasama ng διαμερίζω, ipinahihiwatig nito ang pagkakahati at pagsalungat sa loob ng sarili niyang panig.
- source_word: διεμερίσθη
  choice: nahahati
  rationale: Likas na ipinapahayag sa Filipino ang kalagayang bunga ng pagkakahati at ang lohika ng pasubaling argumento.
- source_word: πῶς σταθήσεται
  choice: paano mananatili
  rationale: Sa kontekstong ito, ang ἵστημι ay tumutukoy sa patuloy na pag-iral o katatagan; malinaw at natural ang “mananatili” sa Filipino.
- source_word: βασιλεία
  choice: kaharian
  rationale: Pinananatili nito ang larawan ng isang kahariang nahahati at tumutukoy sa nasasakupan o paghahari ni Satanas.
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikilala nito ang batayan ng retorikal na tanong—ang paratang ng mga kausap ni Jesus.
- source_word: ἐν Βεελζεβοὺλ
  choice: sa pamamagitan ni Beelzebul
  rationale: Ang ἐν ay nagpapahayag dito ng ahensiya o kasangkapan; hindi na idinagdag ang salitang “kapangyarihan” na wala nang tahasan sa Griyego.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: Direktang sinusunod ang anyo ng pangalan sa SBLGNT; inilalagay sa talababa ang nakaugaliang alternatibong Beelzebub.
- source_word: ἐκβάλλειν
  choice: nagpapalayas
  rationale: Natural at tiyak na salitang Filipino para sa pagpapalabas ng mga demonyo sa kontekstong ito.
- source_word: δαιμόνια
  choice: mga demonyo
  rationale: Tuwirang katumbas ng δαιμόνια at hindi ito pinapalawak sa mas interpretatibong “masasamang espiritu.”
theological_decisions:
- issue: Likas ng paratang laban kay Jesus
  choice: Iniuulat na nagpapalayas si Jesus ng mga demonyo sa pamamagitan ni Beelzebul.
  alternative: Nagpapalayas si Jesus ng mga demonyo sa kapangyarihan ni Beelzebul o kaugnay ni Beelzebul.
  rationale: Ipinahahayag ang paratang nang malinaw bilang ahensiya o kasangkapan, ngunit hindi dinaragdagan ng mas buong paliwanag tungkol sa kapangyarihang demonyo na hindi tahasang sinabi ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang retorikal na tanong at ang larawan ng nahahating kaharian, habang iniwasan ang labis na literal o denominasyonal na pagpapaliwanag.
