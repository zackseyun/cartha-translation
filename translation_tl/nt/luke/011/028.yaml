base_translation:
  language: en
  yaml_path: translation/nt/luke/011/028.yaml
  text: But he said[a], “Rather, blessed are those who hear the word of God and keep it.”
translation:
  language: tl
  text: Ngunit sinabi niya, “Sa halip[a], pinagpala ang mga nakikinig sa salita ng Diyos at tumutupad nito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Tunay nga, pinagpala ang …” o “Oo, ngunit higit na pinagpala ang …” Maaaring magpahiwatig ang katagang Griyego ng pagsang-ayon habang inililipat ang diin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μενοῦν
  choice: Sa halip
  rationale: Ipinahihiwatig ng kataga ang pagpapatibay na may paglilipat o pagtutuwid ng diin. Likas sa Tagalog ang “Sa halip” bilang tugon na nagtutuon sa mas malalim na batayan ng pagiging pinagpala, nang hindi ipinahihiwatig ang tahasang pagtanggi.
- source_word: μακάριοι
  choice: pinagpala
  rationale: Pinananatili ng “pinagpala” ang bigat na panrelihiyon at biblikal ng μακάριοι; ang “maligaya” ay maaaring maging labis na nakatuon sa damdamin at ang “mapalad” ay maaaring magtunog na bunga lamang ng magandang pagkakataon.
- source_word: οἱ ἀκούοντες
  choice: ang mga nakikinig
  rationale: Ang kasalukuyang pandiwaring ginawang pangngalan ay tumutukoy sa mga taong kinikilala sa patuloy na pakikinig. Higit na likas ang “mga nakikinig” kaysa sa literal na “mga dumirinig,” at maaari rin itong magpahiwatig ng pagtanggap sa narinig.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: sa salita ng Diyos
  rationale: Pinananatili ng “salita ng Diyos” ang lawak ng λόγος bilang ipinahayag o ipinahayag na mensahe ng Diyos at ang pamilyar na tunog nito sa wikang biblikal.
- source_word: φυλάσσοντες
  choice: tumutupad nito
  rationale: Sa kontekstong ito, ang φυλάσσω ay hindi lamang pag-iingat kundi mapanuring pagsunod at pagsasagawa. Likas at malinaw sa modernong Tagalog ang “tumutupad nito,” habang ang “iniingatan ito” ay maaaring mapagkamalang basta pinoprotektahan o itinatago lamang.
- source_word: αὐτὸς δὲ εἶπεν
  choice: Ngunit sinabi niya
  rationale: Ipinakikita ng “Ngunit” ang banayad na kaibahan sa pahayag ng babae sa naunang talata, samantalang nananatiling tuwiran ang “sinabi niya” para sa εἶπεν.
theological_decisions:
- issue: Lakas ng tugon ni Jesus sa pagpapala ng babae
  choice: Inililipat ni Jesus ang diin tungo sa tunay na pagiging pinagpala ng mga nakikinig at tumutupad sa salita ng Diyos, nang hindi tahasang itinatanggi ang naunang pahayag.
  alternative: Maaaring unawain ang tugon bilang tahasang pagtanggi sa sinabi ng babae, o bilang simpleng pagdaragdag lamang ng isa pang pagpapala.
  rationale: Kayang magpahayag ng Μενοῦν ng pagpapatibay kasabay ng pagtutuwid o pagpapatingkad. Pinananatili ng “Sa halip” at ng talababa ang tensiyong ito nang hindi nilulutas nang lampas sa ipinahihintulot ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “nakikinig” at “tumutupad” para sa likas na daloy at upang maipakita ang pakikinig na humahantong sa tapat na pagsasagawa.
