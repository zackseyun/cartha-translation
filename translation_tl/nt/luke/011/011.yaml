  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang anyo ng retorikal na tanong at ang tahasang pag-uulit ng “isda” sa Griyego; ginamit ang gitling-pahaba upang maging malinaw ang matinding pagtutulad nang hindi binabago ang diwa.
