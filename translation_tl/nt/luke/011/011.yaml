  text: τίνα δὲ ⸀ἐξ ὑμῶν τὸν πατέρα αἰτήσει ὁ ⸀υἱὸς ἰχθύν, ⸀καὶ ἀντὶ ἰχθύος ὄφιν ⸂αὐτῷ ἐπιδώσει⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/011.yaml
  text: What father among you[a], if his son asks for a fish, will give him a snake instead of a fish?
translation:
  language: tl
  text: Sinong ama sa inyo ang, kapag humingi ang kanyang anak na lalaki ng isda, ay magbibigay sa kanya ng ahas sa halip na isda?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα δὲ ἐξ ὑμῶν τὸν πατέρα
  choice: Sino sa inyong mga ama
  rationale: Likas na paraan ito sa modernong Tagalog upang mapanatili ang retorikal na tanong at ang pagtukoy sa mga amang kabilang sa mga kausap.
- source_word: αἰτήσει
  choice: kapag humingi
  rationale: Ang pandiwa ay nasa anyong panghinaharap, ngunit sa retorikal na tanong ay natural na ipinapahayag sa Tagalog bilang isang pangkalahatang kalagayan gamit ang “kapag humingi.”
- source_word: ὁ υἱὸς
  choice: kanyang anak
  rationale: Ipinahihiwatig ng konteksto ang ugnayan ng ama at anak; natural sa Tagalog ang “kanyang anak,” at hindi kailangang tukuyin ang kasarian dahil malinaw na ang relasyon ang mahalaga rito.
- source_word: ἰχθύν / ἰχθύος
  choice: isda / isda
  rationale: Pinananatili ang konkretong bagay na hinihingi at ang pag-uulit nito sa paghahambing.
- source_word: ἀντὶ
  choice: sa halip na
  rationale: Malinaw nitong ipinapahayag ang pagpapalit o pagbibigay ng isang bagay kapalit ng hiniling.
- source_word: ὄφιν
  choice: ahas
  rationale: Ang “ahas” ang karaniwan at eksaktong modernong salin ng ὄφις sa kontekstong ito.
- source_word: αὐτῷ ἐπιδώσει
  choice: magbibigay sa kanyang anak
  rationale: Natural na Tagalog ito para sa pagbibigay o pag-abot sa anak, habang pinananatili ang panghinaharap na lakas ng retorikal na tanong.
