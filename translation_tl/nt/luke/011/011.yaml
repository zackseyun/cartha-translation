  naturalness: May hindi natural at kalabisan sa “magbibigay ... ng ahas kapag humingi ito ng isda—ahas sa halip na isda.” Ang inayos na bersiyon ay malinaw at likas na retorikal na tanong sa modernong Tagalog.
