  yaml_path: translation/nt/luke/011/009.yaml
  text: And I tell you[a], ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: tl
  text: At sinasabi ko sa inyo:[a] Humingi kayo, at bibigyan kayo; humanap kayo, at makakahanap kayo; kumatok kayo, at pagbubuksan kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, kung higit na tahasang ipahahayag ang maaaring nagpapatuloy na diwa ng mga pautos sa Griyego: “Patuloy kayong humingi … patuloy kayong humanap … patuloy kayong kumatok.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ ὑμῖν λέγω
  choice: At sinasabi ko sa inyo
  rationale: Pinananatili ng “At” ang pag-uugnay sa naunang turo, habang ang “sinasabi ko sa inyo” ay natural at marangal na panimula sa tuwirang pahayag.
- source_word: αἰτεῖτε
  choice: Humingi kayo
  rationale: Ang “humingi” ang natural na katumbas sa konteksto ng panalangin. Hindi tahasang idinagdag sa pangunahing teksto ang patuloy na aspekto ng pangkasalukuyang pautos upang hindi ito labis na ipakahulugan.
- source_word: δοθήσεται ὑμῖν
  choice: bibigyan kayo
  rationale: Natural na ipinapahayag sa Filipino ang Griyegong future passive sa anyong “bibigyan kayo,” nang hindi tinutukoy ang di-hayag na tagagawa.
- source_word: ζητεῖτε
  choice: humanap kayo
  rationale: Saklaw ng “humanap” ang literal at matalinghagang paghahanap at nagpapanatili ng tuwirang pautos.
- source_word: εὑρήσετε
  choice: makasusumpong kayo
  rationale: Ang “makasusumpong” ay dignidad ngunit nauunawaang katumbas ng pangakong “you will find,” at maayos na umaayon sa “humanap.”
- source_word: κρούετε
  choice: kumatok kayo
  rationale: Tuwirang inilalarawan ng pandiwa ang pagkatok sa ipinahihiwatig na pinto.
- source_word: ἀνοιγήσεται ὑμῖν
  choice: pagbubuksan kayo
  rationale: Ang “pagbubuksan kayo” ay natural na Filipino na nagpapanatili sa passive na pangako at sa hindi tahasang binanggit na pinto.
theological_decisions:
- issue: Aspekto ng mga pangkasalukuyang pautos na αἰτεῖτε, ζητεῖτε, κρούετε
  choice: 'Mga payak na pautos: “Humingi,” “humanap,” at “kumatok”'
  alternative: “Patuloy kayong humingi … humanap … kumatok”
  rationale: Maaaring magpahiwatig ng nagpapatuloy o paulit-ulit na pagkilos ang Griyegong present imperative, ngunit hindi laging obligadong gawing tahasan iyon. Pinananatili ng pangunahing teksto ang tunay na luwang ng aspekto, at inilalahad sa talababa ang mas tahasang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang maramihang “kayo” ayon sa ὑμῖν at pinanatili ang tatluhang magkakatulad na ayos ng mga utos at pangako.
