  source_fidelity: 'Tumpak na naisasalin ng draft ang pangunahing mga sangkap ng Griyego: ang metaporang “daliri ng Diyos,” ang kasalukuyang kilos na “nagpapalayas ako,” ang “mga demonyo,” at ang naganap nang pagdating ng kaharian sa mga kausap. Gayunman, ang ἄρα ay isang malinaw na pangatnig ng kongklusyon; mas tuwirang naipahahayag ito ng “kung gayon” kaysa sa “nga,” na pangunahing pampatibay sa Filipino.'
