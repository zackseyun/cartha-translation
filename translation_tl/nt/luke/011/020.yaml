  rationale: Pinalitan ang “nga” ng “kung gayon” upang malinaw na maipakita ang kongklusyong isinasaad ng ἄρα. Hindi binago ang larawan ng “daliri ng Diyos,” ang terminolohiya para sa mga demonyo, o ang natapos na aspekto ng pagdating ng kaharian.
