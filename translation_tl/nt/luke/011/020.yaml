  text: εἰ δὲ ἐν δακτύλῳ ⸀θεοῦ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/020.yaml
  text: But if I cast out the demons by the finger of God[b][a], then the kingdom of God has come upon you.
translation:
  language: tl
  text: Ngunit kung sa pamamagitan ng daliri ng Diyos ay nagpapalayas ako ng mga demonyo, kung gayon ay dumating na sa inyo ang kaharian ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “dumating na sa inyo” bilang “umabot na sa inyo” o “inabutan na kayo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν δακτύλῳ θεοῦ
  choice: sa pamamagitan ng daliri ng Diyos
  rationale: 'Pinananatili ang matingkad na metapora at ang diwa ng kasangkapan o ahensiya: ang tuwirang kapangyarihan ng Diyos. Umaalingawngaw rin ito sa Exodo 8:19.'
- source_word: ἐκβάλλω
  choice: nagpapalayas ako
  rationale: Likas at karaniwang salin sa makabagong Filipino para sa pagpapaalis ng mga demonyo, habang pinananatili ang present-tense na kilos.
- source_word: τὰ δαιμόνια
  choice: mga demonyo
  rationale: Tuwirang katumbas ng δαιμόνια; hindi ito pinalitan ng 'masasamang espiritu,' na salin ng ibang pariralang Griyego.
- source_word: ἄρα
  choice: nga
  rationale: Ipinahihiwatig ang lohikal na kongklusyon mula sa kondisyong nauna nang hindi nagiging mabigat o di-likas sa Filipino.
- source_word: ἔφθασεν ἐφ’ ὑμᾶς
  choice: dumating na ... sa inyo
  rationale: Ipinapahayag ang tiyak at naganap nang pagdating o pag-abot sa mga kausap; pinananatili ng 'na' ang aspektong nakumpleto.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Likas, kinikilalang salin na maaaring tumukoy kapwa sa paghahari ng Diyos at sa saklaw ng kanyang pamamahala.
theological_decisions:
- issue: Kahulugan ng 'daliri ng Diyos'
  choice: Pinanatili bilang metapora ng tuwirang kapangyarihan o pagkilos ng Diyos sa pagpapalayas ni Jesus ng mga demonyo.
  alternative: Tahasang tukuyin ito bilang Espiritu Santo batay sa Mateo 12:28.
  rationale: Ang natatanging pananalita ni Lucas ang dapat panatilihin; hindi dapat ipalit sa teksto ang pagpapakahulugang nagmumula sa kaparehong salaysay sa Mateo.
- issue: Diwa ng pagdating ng kaharian ng Diyos
  choice: Ipinahahayag ang kasalukuyan at tiyak nang pagdating ng kaharian sa ministeryo ni Jesus.
  alternative: Unawain itong ukol lamang sa hinaharap, o bilang purong mapanghatol na 'inabutan kayo.'
  rationale: Ang aorist na ἔφθασεν kasama ng ἐπί ay nagpapahiwatig ng tiyak na pagdating o pag-abot, ngunit hindi nito nilulutas ang lahat ng mas malawak na tanong tungkol sa eskatolohiya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang biblikal na larawang 'daliri ng Diyos' sa halip na ipaliwanag ito sa pangunahing teksto. Inilagay ang panandang talababa [a] sa mismong talata.
