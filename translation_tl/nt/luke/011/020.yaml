  terminology: Ang “daliri ng Diyos,” “mga demonyo,” at “kaharian ng Diyos” ay angkop at pare-pareho sa tekstong pinagmulan. Pinananatili ng “sa pamamagitan ng daliri ng Diyos” ang metapora at ang instrumental na diwa ng ἐν.
