base_translation:
  language: en
  yaml_path: translation/nt/luke/011/006.yaml
  text: because a friend of mine has come to me from a journey[a], and I have nothing to set before him.
translation:
  language: tl
  text: sapagkat isang kaibigan ko ang dumating sa akin mula sa paglalakbay,[a] at wala akong maihain sa kanya.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “mula sa daan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pakiusap. Likas at marangal ang “sapagkat” sa daloy ng tuwirang pagsasalita.
- source_word: φίλος μου
  choice: isang kaibigan ko
  rationale: Pinananatili ng “isang kaibigan ko” ang di-tiyak na diwa ng anarthrous φίλος at natural ito sa modernong Filipino.
- source_word: παρεγένετο
  choice: dumating
  rationale: Ang aorist ng παραγίνομαι ay tumutukoy sa pagdating. Sapat na ipinahihiwatig ng konteksto na naroon pa ngayon ang kaibigan.
- source_word: ἐξ ὁδοῦ
  choice: mula sa paglalakbay
  rationale: Bagaman literal na “mula sa daan,” idyomatiko itong tumutukoy sa paglalakbay; malinaw at natural ang salin habang inilalagay sa talababa ang literal na anyo.
- source_word: πρός με
  choice: sa akin
  rationale: Tuwirang ipinapahayag ang paglapit sa nagsasalita nang hindi idinaragdag ang “bahay” o layuning “bumisita,” na hindi tahasang nasa Griyego.
- source_word: οὐκ ἔχω ὃ παραθήσω αὐτῷ
  choice: wala akong maihain sa kanya
  rationale: Sa konteksto ng pagtanggap sa panauhin, ang παρατίθημι ay tumutukoy sa paglalagay o paghahain ng pagkain sa harap ng isang tao. Natural na ipinahahayag ito ng “maihain” sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “sapagkat” para sa malinaw na ugnayang sanhi at “maihain” para sa karaniwang wika ng pagpapatuloy sa panauhin. Ang panandang [a] ay inilagay kaagad pagkatapos ng pariralang tinutukoy nito.
