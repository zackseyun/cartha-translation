id: LUK.11.31
reference: Luke 11:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτούς· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/031.yaml
  text: The queen of the South will rise up in the judgment with the men of this generation and will condemn them[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: tl
  text: Ang reyna ng Timog ay babangon sa paghuhukom kasama ng mga lalaki ng salinlahing ito at hahatulan niya sila[a], sapagkat dumating siya mula sa mga dulo ng daigdig upang pakinggan ang karunungan ni Solomon. At masdan ninyo[b], narito ang higit na dakila kaysa kay Solomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ito ang tauhang karaniwang kinikilalang Reyna ng Sheba (tingnan ang 1 Hari 10:1–13; 2 Cronica 9:1–12).
    reason: cross_reference
  - marker: b
    text: 'Maaari ring isalin: “narito ang isang higit na dakila kaysa kay Solomon.” Ang pananalita sa Griyego ay nasa anyong walang kasarian, na literal na “higit na dakila kaysa kay Solomon”; kaya maaaring higit pa sa isang tuwirang paghahambing ng mga persona ang binibigyang-diin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: ang reyna ng Timog
  rationale: Pinananatili ang mismong katawagan sa Griyego at ang alusyon sa tauhang kilala bilang Reyna ng Sheba nang hindi inilalagay sa pangunahing teksto ang interpretatibong pagkakakilanlan.
- source_word: ἐγερθήσεται
  choice: ay babangon
  rationale: Likas na tumutukoy sa pagbangon o pagharap sa paghuhukom at pinananatili rin ang posibleng eskatolohikal na pahiwatig nang hindi tahasang nililimitahan sa muling pagkabuhay.
- source_word: ἐν τῇ κρίσει
  choice: sa paghuhukom
  rationale: Ang tiyak na anyo sa Griyego ay tumutukoy sa isang tiyak na paghuhukom; natural at marangal sa Tagalog ang pariralang ito.
- source_word: μετὰ τῶν ἀνδρῶν
  choice: kasama ng mga lalaki
  rationale: Pinananatili ang tiyak na panlalaking kahulugan ng ἀνδρῶν sa halip na gawing pangkalahatang 'mga tao.'
- source_word: τῆς γενεᾶς ταύτης
  choice: ng salinlahing ito
  rationale: Tumutukoy sa kasalukuyang salinlahi ng mga kapanahon ni Jesus; ang 'salinlahi' ay malinaw at angkop sa dignidad ng teksto.
- source_word: κατακρινεῖ αὐτούς
  choice: hahatulan niya sila
  rationale: Sa konteksto, ang hatol ay mapanghatol o condemning, hindi lamang pagsusuri; malinaw ang negatibong bisa sa Tagalog.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: mula sa mga dulo ng daigdig
  rationale: Pinananatili ang malawak at hayperbolikong idyoma para sa napakalayong lugar.
- source_word: ἀκοῦσαι
  choice: upang pakinggan
  rationale: Ipinahahayag ang layunin ng pagpunta at natural sa Tagalog ang aktibong pakikinig sa karunungang ipinahahayag.
- source_word: τὴν σοφίαν Σολομῶνος
  choice: ang karunungan ni Solomon
  rationale: Direkta, malinaw, at pinananatiling sentro ang karunungan na siyang pinakinggan.
- source_word: ἰδοὺ
  choice: masdan ninyo
  rationale: Isang marangal at kapansin-pansing panandang pandiskurso na nagbibigay-diin sa kasukdulang pahayag.
- source_word: πλεῖον Σολομῶνος
  choice: ang higit na dakila kaysa kay Solomon
  rationale: Iniiwasang gawing tahasang 'isang higit na dakila' ang walang-kasariang anyong πλεῖον, kaya pinananatili ang sadyang lawak at tensiyon ng Griyego.
- source_word: ὧδε
  choice: narito
  rationale: Maikli at natural na pahayag ng kasalukuyang presensiya sa lugar na ito.
theological_decisions:
- issue: Kung tahasang kikilalanin ang reyna bilang Reyna ng Sheba
  choice: Pinanatili sa pangunahing teksto ang 'reyna ng Timog.'
  alternative: Reyna ng Sheba
  rationale: Malakas ang alusyon sa Lumang Tipan, ngunit 'reyna ng Timog' ang aktuwal na katawagan sa Griyego. Inilagay sa talababa ang karaniwang pagkakakilanlan.
- issue: Kung gagawing personal ang πλεῖον Σολομῶνος
  choice: Isinalin bilang 'ang higit na dakila kaysa kay Solomon.'
  alternative: isang higit na dakila kaysa kay Solomon
  rationale: Walang-kasarian ang πλεῖον sa Griyego. Pinananatili ng salin ang posibilidad na mas malawak kaysa sa payak na tuwirang paghahambing ng dalawang persona ang tinutukoy.
- issue: Kung tahasang ipapakahulugan ang ἐγερθήσεται bilang muling pagkabuhay
  choice: Isinalin bilang 'babangon.'
  alternative: muling bubuhayin
  rationale: Maaaring umalingawngaw ang muling pagkabuhay sa eskatolohikal na tagpo, ngunit maaari ring tumukoy ang pandiwa sa pagbangon o pagharap bilang saksi sa paghuhukom. Hindi nilutas nang labis ang saklaw nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'salinlahi,' 'paghuhukom,' at 'masdan ninyo' upang mapanatili ang solemne at retorikal na himig nang hindi nagiging lipas o labis na teknikal.
