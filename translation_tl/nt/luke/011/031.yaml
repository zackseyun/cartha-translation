revisions:
- from: Ang reyna ng Timog ay babangon sa paghuhukom kasama ng mga lalaki ng salinlahing ito at hahatulan niya sila[a], sapagkat nagmula pa siya sa mga dulo ng daigdig upang pakinggan ang karunungan ni Solomon. At masdan ninyo[b], narito ang higit na dakila kaysa kay Solomon.
  to: Ang reyna ng Timog ay babangon sa paghuhukom kasama ng mga lalaki ng salinlahing ito at hahatulan niya sila[a], sapagkat dumating siya mula sa mga dulo ng daigdig upang pakinggan ang karunungan ni Solomon. At masdan ninyo[b], narito ang higit na dakila kaysa kay Solomon.
  rationale: Pinalitan ang pandiwang “nagmula” ng “dumating ... mula sa” upang tapat na maisalin ang ἦλθεν ἐκ at ang paglalakbay na ginawa ng reyna para sa layuning makinig sa karunungan ni Solomon. Nilinaw rin nang bahagya ang talababa tungkol sa walang-kasariang πλεῖον. Walang idinagdag na interpretatibong pagkakakilanlan o doktrinal na pagpapakahulugan sa pangunahing teksto.
  reviewer_model: gpt-5.6-terra
