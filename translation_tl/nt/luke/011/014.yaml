base_translation:
  language: en
  yaml_path: translation/nt/luke/011/014.yaml
  text: And he was casting out a mute demon. Then[a], when the demon had gone out, the mute man spoke, and the crowds marveled.
translation:
  language: tl
  text: At nagpapalayas siya noon ng isang demonyong pipi.[a] Nang lumabas ang demonyo, nagsalita ang lalaking pipi, at namangha ang mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “binging demonyo.” Ang salitang Griyego ay maaaring mangahulugang “bingi” o “pipi,” ngunit mas angkop dito ang “pipi” dahil nagsalita ang lalaki nang lumabas ang demonyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκβάλλων
  choice: nagpapalayas siya noon
  rationale: Ipinahahayag ng periphrastic imperfect ang kilos na nagaganap noon. Natural sa modernong Tagalog ang “nagpapalayas siya noon” at malinaw nitong pinananatili ang aspektong nagpapatuloy sa nakaraan.
- source_word: δαιμόνιον
  choice: demonyo
  rationale: Tuwirang tumutukoy ang salita sa isang demonyo o masamang espiritu. Hindi ginamit ang “maruming espiritu” sapagkat hindi iyon ang mismong katawagan sa talata.
- source_word: κωφόν
  choice: piping
  rationale: Maaaring mangahulugang “bingi” o “pipi” ang κωφός, ngunit ang pagsasalita ng tao pagkaraang lumabas ang demonyo ay nagpapakitang kawalan ng kakayahang magsalita ang pokus dito. Ang “piping demonyo” ay pinananatili rin ang gramatikal na paglalarawan sa demonyo.
- source_word: ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος
  choice: Nang makalabas na ang demonyo
  rationale: 'Natural na inilalahad nito ang sumunod na pangyayari at pinananatili ang temporal na ugnayan: nauna ang paglabas ng demonyo bago nagsalita ang lalaki.'
- source_word: ἐλάλησεν
  choice: nagsalita
  rationale: Tuwiran at natural na katumbas ng λαλέω; hindi idinagdag ang interpretibong “nagsimulang magsalita.”
- source_word: ὁ κωφός
  choice: ang lalaking pipi
  rationale: Substantival ang pang-uri at tumutukoy sa taong pinahirapan. Nilinaw ng “lalaki” ang tinutukoy, samantalang pinananatili ng “pipi” ang ugnayan sa naunang κωφόν.
- source_word: ἐθαύμασαν
  choice: namangha
  rationale: Ipinahahayag nito ang matinding pagtataka o paghanga at angkop sa marangal ngunit kasalukuyang wikang salaysay.
- source_word: οἱ ὄχλοι
  choice: ang mga tao
  rationale: Ang plural na “mga tao” ay natural sa Filipino para sa mga nagkatipong pangkat. Ang “mga pulutong” ay mas pormal ngunit hindi kasing-natural sa ordinaryong mambabasa.
theological_decisions:
- issue: Kalikasan ng pagpapahirap at wika ng pagpapalayas ng demonyo
  choice: Inilalarawan ang isang tunay na demonyong pinalalayas, at pagkaraang lumabas ito ay nakapagsalita ang lalaki.
  alternative: Gumamit ng mas di-tuwirang paglalarawan gaya ng “masamang espiritu,” o alisin ang malinaw na supernatural na pahayag.
  rationale: Malinaw na gumagamit ang Griyego ng δαιμόνιον at iniuugnay ng salaysay ang paglabas nito sa muling pagsasalita ng lalaki. Dapat panatilihin ang pahayag ng teksto nang walang pagbawas o dagdag.
- issue: Saklaw ng pang-uring κωφόν sa “δαιμόνιον κωφόν”
  choice: Panatilihin ang gramatikal na paglalarawan sa demonyo bilang “piping demonyo.”
  alternative: Ilipat ang paglalarawan sa tao, gaya ng “isang demonyong nagpapapipi sa isang lalaki.”
  rationale: Ang κωφόν ay tuwirang umaayon sa δαιμόνιον sa Griyego. Bagaman malinaw sa bunga na pipi ang taong pinahirapan, hindi dapat palitan ng salin ang gramatikal na pagkakaugnay sa unang sugnay.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang lipas at mapanirang katawagang “pipi” bilang pangngalang pantukoy sa tao; ginamit ito bilang pang-uri, at “lalaking pipi” para sa substantival expression. Ang marker na [a] ay inilagay kaagad pagkatapos ng unang paglitaw ng “piping demonyo,” kung saan nauukol ang leksikal na paliwanag.
