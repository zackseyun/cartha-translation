  text: οὐαὶ ὑμῖν τοῖς νομικοῖς, ὅτι ἤρατε τὴν κλεῖδα τῆς γνώσεως· αὐτοὶ οὐκ εἰσήλθατε καὶ τοὺς εἰσερχομένους ἐκωλύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/052.yaml
  text: Woe to you lawyers[a], because you took away the key of knowledge; you yourselves did not enter[b], and you hindered those who were entering.
translation:
  language: tl
  text: Sa aba ninyo, mga dalubhasa sa Kautusan,[a] sapagkat inalis ninyo ang susi ng kaalaman.[b] Kayo mismo ay hindi pumasok, at hinadlangan ninyo ang mga pumapasok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tinutukoy ay mga dalubhasa sa Kautusang Judio, hindi mga abogado sa makabagong kahulugan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “susi tungo sa kaalaman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: Kahabag-habag kayo
  rationale: Pinananatili ang bigat ng propetikong pagtuligsa at babala, sa natural ngunit marangal na makabagong Tagalog.
- source_word: νομικοῖς
  choice: mga dalubhasa sa Kautusan
  rationale: Malinaw na tumutukoy sa mga espesyalista sa Kautusang Judio, hindi sa mga makabagong abogado.
- source_word: ἤρατε
  choice: inalis ninyo
  rationale: Ipinahahayag ang diwa ng pag-aalis o pagkakait ng daan, hindi lamang ang pagkuha o pagbitbit.
- source_word: κλεῖδα τῆς γνώσεως
  choice: susi ng kaalaman
  rationale: Malapit sa anyong genitibo ng Griyego at pinananatili ang metapora; inilalahad sa talababa ang natural na alternatibo.
- source_word: αὐτοὶ
  choice: Kayo mismo
  rationale: Pinananatili ang mariing paghahambing at paratang na ipinahahayag ng emphatic pronoun.
- source_word: οὐκ εἰσήλθατε
  choice: hindi pumasok
  rationale: Pinananatili ang metapora ng pagpasok nang hindi tinutukoy kung saan sila pumapasok.
- source_word: τοὺς εἰσερχομένους
  choice: ang mga pumapasok
  rationale: Likas na Tagalog na nagpapahiwatig ng nagpapatuloy na kilos nang hindi idinaragdag ang di-tiyak na ideyang 'nagsisikap'.
- source_word: ἐκωλύσατε
  choice: hinadlangan ninyo
  rationale: Naghahayag ng paghadlang o pagharang nang hindi labis na iginigiit na lubusang napigilan ang pagpasok.
theological_decisions:
- issue: Ang tinutukoy ng metapora ng “pagpasok” at “susi ng kaalaman”
  choice: Pinanatili ang metapora ng susi at pagpasok nang hindi tahasang tinutukoy ang pinapasukan.
  alternative: Ipaliwanag bilang pagpasok sa kaharian ng Diyos o sa tunay na pagkakilala sa Diyos.
  rationale: Hindi pinapangalanan ng tekstong Griyego ang bagay o lugar na pinapasukan. Ang hindi pagdaragdag nito ay nagpapanatili sa tunay na lawak at tensiyong teolohikal ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kautusan” bilang pantanging katawagan sa relihiyosong batas ng Israel, at iniwasan ang pagpapaliwanag sa hindi tahasang tinutukoy na pinapasukan.
