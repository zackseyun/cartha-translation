id: LUK.11.32
reference: Luke 11:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἄνδρες ⸀Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/032.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the proclamation of Jonah, and behold, something greater than Jonah is here.
translation:
  language: tl
  text: Sa paghuhukom, babangon ang mga lalaki ng Nineve kasama ng salinlahing ito at hahatulan nila ito, sapagkat nagsisi sila bilang tugon sa ipinangaral ni Jonas. At narito, may higit kaysa kay Jonas dito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “may isang higit na dakila kaysa kay Jonas dito” o “may isang bagay na higit kaysa kay Jonas dito.” Neuter ang anyo ng salitang Griyego para sa “higit,” kaya maaaring tumukoy ito nang mas malawakan sa higit na dakilang realidad na naririto, at hindi lamang sa paghahambing ng dalawang persona.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: ang mga lalaking taga-Nineve
  rationale: Tahasang panlalaking pangmaramihan ang ἄνδρες, kaya pinanatili ang “mga lalaki”; likas sa modernong Tagalog ang “taga-Nineve” para sa Νινευῖται.
- source_word: ἀναστήσονται
  choice: babangon
  rationale: Pinananatili nito ang matingkad na larawan ng pagbangon sa konteksto ng paghuhukom nang hindi tahasang dinaragdagan ng salitang “muling mabubuhay.”
- source_word: ἐν τῇ κρίσει
  choice: sa paghuhukom
  rationale: Ang κρίσις dito ay tumutukoy sa pangyayaring hudisyal; natural at malinaw sa Tagalog ang “sa paghuhukom.”
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: kasama ng salinlahing ito
  rationale: Ipinapahayag ng μετά na may genitive ang pakikisama o pag-iral kasama ng iba; pinananatili ng “salinlahing ito” ang historikal at moral na bigat ng parirala.
- source_word: κατακρινοῦσιν αὐτήν
  choice: hahatulan nila ito
  rationale: Sa kontekstong ito, ang κατακρίνω ay paghatol laban sa isang tao o pangkat. Ang “ito” ay tumutukoy sa “salinlahing ito”; malinaw na ang hatol ay mapanghatol o nagpaparatang sa konteksto.
- source_word: μετενόησαν
  choice: nagsisi sila
  rationale: Ang μετανοέω sa kontekstong propetiko ay moral at espirituwal na pagsisisi, hindi lamang pagbabago ng isip.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: bilang tugon sa ipinangaral ni Jonas
  rationale: Ipinapakita ng εἰς kasunod ng μετανοέω ang tugon na ibinunga ng κήρυγμα; likas at malinaw sa Tagalog ang “bilang tugon sa ipinangaral.”
- source_word: ἰδοὺ
  choice: At narito
  rationale: Ang “narito” ay isang marangal at pamilyar na pantawag-pansin na nagpapanatili sa mariing retorikal na puwersa ng ἰδού.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: may higit kaysa kay Jonas dito
  rationale: Hindi tinutukoy ng “higit” kung tao lamang o mas malawak na realidad ang inihahambing, kaya napananatili ang neuter na πλεῖον at ang tunay na kalabuan ng Griyego.
theological_decisions:
- issue: Ang tinutukoy at saklaw ng πλεῖον Ἰωνᾶ
  choice: may higit kaysa kay Jonas dito
  alternative: may isang higit na dakila kaysa kay Jonas dito; may isang bagay na higit kaysa kay Jonas dito
  rationale: Iniiwasan ng pangunahing salin na gawing tahasang panlalaki o tahasang impersonal ang neuter na πλεῖον. Si Jesus ang malinaw na nasa sentro ng pahayag, ngunit maaaring saklawin ng pananalita ang mas dakilang realidad na naririto sa kaniya at sa kaniyang gawain.
- issue: Ang papel ng mga taga-Nineve sa paghuhukom
  choice: hahatulan nila ito
  alternative: papatunayang karapat-dapat itong hatulan
  rationale: Pinananatili ang tuwirang pandiwang κατακρίνω nang hindi ipinaliliwanag kung literal silang magsasagawa ng hatol o ang kanilang pagsisisi ang magsisilbing patotoo laban sa salinlahing ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “salinlahi,” “paghuhukom,” at “narito” upang mapanatili ang solemneng tono; iniwasan ang labis na teknikal o denominasyonal na pananalita. Ang marker na [a] ay inilagay agad pagkatapos ng sugnay na tinatalakay nito.
