id: LUK.11.40
reference: Luke 11:40
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἄφρονες, οὐχ ὁ ποιήσας τὸ ἔξωθεν καὶ τὸ ἔσωθεν ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/040.yaml
  text: Fools! Did not the one who made the outside also make the inside?[a]
translation:
  language: tl
  text: Mga hangal! Hindi ba ang gumawa ng panlabas ay siya ring gumawa ng panloob?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang nasa labas ... ang nasa loob.” Maaaring tumukoy ang pananalita kapwa sa labas at loob ng sisidlan sa agarang konteksto at, sa mas malawak na diwa, sa panlabas at panloob na buhay ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρονες
  choice: Mga hangal
  rationale: Pangmaramihang tuwirang pagsaway ito. Pinananatili ng “Mga hangal” ang talas ng pananalita at natural ito sa makabagong Filipino.
- source_word: οὐχ ... ἐποίησεν;
  choice: Hindi ba ... gumawa?
  rationale: Ang tanong na may οὐχ ay umaasang sang-ayon ang sagot. Likas sa Filipino ang hulma na “Hindi ba ...?” at naipapakita nito ang puwersa ng retorikal na tanong.
- source_word: ὁ ποιήσας
  choice: ang gumawa
  rationale: Ang artikulong may substantibong participle ay tuwirang maisasalin na “ang gumawa.” Nananatiling di-tahas ang pagtukoy sa Diyos, gaya ng Griyego.
- source_word: τὸ ἔξωθεν
  choice: ang panlabas
  rationale: Saklaw nito kapwa ang panlabas na bahagi ng sisidlan sa konteksto at, sa mas malawak na pahiwatig, ang panlabas na buhay o anyo ng tao.
- source_word: τὸ ἔσωθεν
  choice: ang panloob
  rationale: Kaagapay ito ng τὸ ἔξωθεν at pinananatili ang saklaw mula sa loob ng sisidlan hanggang sa panloob na buhay o pagkatao.
- source_word: καὶ
  choice: siya ring
  rationale: 'Ipinahahayag ng “rin” ang inklusibong diin ng καί: ang gumawa ng panlabas ang gumawa rin ng panloob. Ang “siya” ay nagpapalinaw sa iisang gumagawa nang hindi tahasang idinaragdag ang “Diyos.”'
theological_decisions:
- issue: Ang tinutukoy ng “ang gumawa”
  choice: Pinanatili ang di-tahas na pagtukoy sa Diyos bilang Manlilikha.
  alternative: Tahasang sabihing “ang Diyos na gumawa,” o unawain lamang bilang karaniwang gumawa ng sisidlan.
  rationale: Maaaring gumana ang pahayag sa agarang larawan ng sisidlan habang nagpapahiwatig din sa Diyos na gumawa ng panlabas at panloob. Hindi idinagdag ang “Diyos” upang mapanatili ang lawak at pag-igting ng orihinal.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Pinanatili ang matalas na pagsaway at ang maikli, retorikal na anyo ng Griyego; iniwasan ang tahasang pagpapangalan sa Diyos dahil hindi ito nakasaad sa teksto.
