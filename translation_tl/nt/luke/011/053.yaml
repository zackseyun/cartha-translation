  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'tagapagturo ng Kautusan' bilang malinaw na katawagang pangtungkulin, at 'gipitin' upang maipahayag ang matinding pagdiin ng mga kalaban. Napanatili ang kuwit sa hulihan ayon sa pagpapatuloy ng pangungusap sa susunod na talata.
