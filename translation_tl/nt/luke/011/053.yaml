  source_fidelity: Tumpak na naihahatid ng draft ang pagkakasunod ng pangyayari, ang ingressive na diwa ng ἤρξαντο, ang matinding pagdiin ng δεινῶς ἐνέχειν, at ang mapilit na pagpapasalita ng ἀποστοματίζειν. Gayunman, ang “pag-alis niya roon” ay mas madaling mabasa bilang nominal na parirala kaysa malinaw na pangyayaring nauna; “Pagkaalis niya roon” ay mas tuwirang katumbas ng genitive absolute na aorist. Ang “mga eskriba” ay mas malapit sa pinagmulan kaysa sa pagganap na “mga tagapagturo ng Kautusan.”
  naturalness: Mas natural at malinaw sa modernong Filipino ang “Pagkaalis niya roon” at “mariin siyang gipitin.” Napananatili ang nakabiting kuwit dahil nagpapatuloy ang pangungusap sa susunod na talata.
  terminology: Pinalitan ang functional na “mga tagapagturo ng Kautusan” ng “mga eskriba,” ang tuwirang katawagan para sa γραμματεῖς. Nananatiling angkop ang “mga Pariseo.”
