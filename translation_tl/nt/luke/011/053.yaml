base_translation:
  language: en
  yaml_path: translation/nt/luke/011/053.yaml
  text: And after he left there[a], the scribes and the Pharisees began to press him hard and to provoke him to speak about many things,
translation:
  language: tl
  text: Pagkaalis niya roon, nagsimulang mariin siyang gipitin ng mga eskriba at mga Pariseo, at pilitin siyang magsalita tungkol sa maraming bagay,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “usisain siya nang masinsinan” o “pilitin siyang sumagot nang walang paghahanda.” Bihira ang pandiwang Griyego at ipinahihiwatig nitong agresibo nilang sinisikap na makuha ang kanyang mga sagot.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντος αὐτοῦ
  choice: At pag-alis niya roon
  rationale: Pinagsama ang pang-ugnay, pook, at genitive absolute upang likas na maipahayag sa Tagalog ang pangyayaring nauna sa pangunahing kilos, habang pinananatili ang ugnayang panlunan at temporal.
- source_word: ἤρξαντο
  choice: nagsimulang
  rationale: Tuwirang ipinapakita ang ingressive na diwa ng pandiwa kasama ng mga kasunod na pawatas.
- source_word: γραμματεῖς
  choice: mga tagapagturo ng Kautusan
  rationale: Ipinapahayag ang tungkulin ng mga γραμματεῖς sa konteksto ng Ebanghelyo sa paraang mas madaling maunawaan ng karaniwang modernong mambabasa kaysa sa hiram na katawagang 'eskriba.'
- source_word: Φαρισαῖοι
  choice: mga Pariseo
  rationale: Karaniwang anyong Tagalog ng pangalan ng pangkat.
- source_word: δεινῶς ἐνέχειν
  choice: gipitin siya nang matindi
  rationale: Inilalarawan ang mariin at mapanlabang panggigipit na ipinahihiwatig ng pinagsamang pang-abay at pandiwa, nang hindi dinaragdagan ang teksto ng tiyak na layuning hindi tahasang sinabi rito.
- source_word: ἀποστοματίζειν
  choice: pilitin siyang magsalita
  rationale: Ang bihira at pinagtatalunang pandiwa ay tumutukoy sa agresibong pagkuha o pagpapalabas ng sagot. Ang salin ay nagpapanatili ng mapilit na tono ngunit hindi labis na nililinaw ang eksaktong paraan; inilalahad sa talababa ang ibang posibilidad.
- source_word: περὶ πλειόνων
  choice: tungkol sa maraming bagay
  rationale: Likas na Tagalog para sa malawak na hanay ng mga paksa, sa halip na unawaing tahasang paghahambing ang πλειόνων.
