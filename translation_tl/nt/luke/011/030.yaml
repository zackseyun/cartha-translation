  text: καθὼς γὰρ ἐγένετο ⸀Ἰωνᾶς ⸂τοῖς Νινευίταις σημεῖον⸃, οὕτως ἔσται καὶ ὁ υἱὸς τοῦ ἀνθρώπου τῇ γενεᾷ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/030.yaml
  text: For just as Jonah became a sign to the Ninevites[a], so also the Son of Man will be to this generation.
translation:
  language: tl
  text: Sapagkat kung paanong si Jonas ay naging tanda sa mga taga-Ninive, gayundin ang Anak ng Tao ay magiging tanda sa salinlahing ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “gayundin ang Anak ng Tao ay magiging sa salinlahing ito.” Ipinahihiwatig ng paghahambing kay Jonas ang diwang “magiging tanda sa salinlahing ito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γὰρ
  choice: Sapagkat kung paanong
  rationale: Likas na ipinapahayag sa Filipino ang paliwanag na dulot ng γάρ at ang paghahambing na dulot ng καθώς.
- source_word: ἐγένετο
  choice: ay naging
  rationale: Pinananatili nito ang diwang si Jonas ay dumating sa kalagayan o gampaning maging tanda, sa halip na simpleng sabihing siya ay tanda lamang.
- source_word: Ἰωνᾶς
  choice: Jonas
  rationale: Ito ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: τοῖς Νινευίταις
  choice: sa mga taga-Ninive
  rationale: Natural na Filipino ito para sa mga taong kaugnay ng lungsod ng Ninive at maayos na ipinapahayag ang datibong ugnayan.
- source_word: σημεῖον
  choice: tanda
  rationale: Ang “tanda” ang karaniwang salin sa Filipino para sa σημεῖον at nagpapanatili ng kahulugang naghahayag o nagpapatunay nang hindi ito nililimitahan sa “palatandaan” o “himala.”
- source_word: οὕτως ... καὶ
  choice: gayundin
  rationale: Malinaw at likas nitong ipinapahayag ang katumbas na paghahambing at ang dagdag na diwa ng καί.
- source_word: ἔσται
  choice: ay magiging
  rationale: Ipinapahayag nito ang hinaharap na anyo ng εἰμί; ang “tanda” ay inuulit bilang ipinahihiwatig na panaguri mula sa unang sugnay.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang nakaugaliang titulo, literal na anyo, at mesiyanikong/apokaliptikong pahiwatig nito nang walang mapagpasyang pagpapakahulugan.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: sa salinlahing ito
  rationale: Ang “salinlahi” ay dignidad at malinaw na katumbas ng γενεά, at pinananatili ang propetikong diin sa kasalukuyang henerasyon.
theological_decisions:
- issue: Ipinahihiwatig na panaguri sa ikalawang sugnay
  choice: 'Inulit sa salin ang “tanda”: “ang Anak ng Tao ay magiging tanda sa salinlahing ito.”'
  alternative: “ang Anak ng Tao ay magiging gayon sa salinlahing ito” o mas literal na “ang Anak ng Tao ay magiging sa salinlahing ito”
  rationale: Hindi inuulit sa Griyego ang σημεῖον, ngunit malinaw itong ipinahihiwatig ng magkatumbas na kayarian. Ang paglalagay ng “tanda” ay nagbibigay ng malinaw at likas na Filipino nang hindi nagdaragdag ng bagong teolohikong pahayag; itinatala ng talababa ang mas literal na anyo.
- issue: Kahulugan ng “Anak ng Tao”
  choice: Pinanatili ang tradisyonal na titulong “Anak ng Tao.”
  alternative: “Ang Taong Anak” o “Ang Taong Nilalang”
  rationale: Ang parirala ay kapwa literal at tila titulo sa mga Ebanghelyo. Ang tradisyonal na salin ay nagpapanatili ng teolohikong tensiyon at ugnayang intertekstuwal sa halip na ipako ito sa iisang pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kung paanong … gayundin” para sa natural na paghahambing at “salinlahi” upang mapanatili ang propetikong bigat ng γενεά. Inilagay ang marker na [a] sa pangunahing teksto.
