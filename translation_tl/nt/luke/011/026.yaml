  to: Pagkatapos ay umaalis ito at isinasama ang pito pang espiritu na mas masasama kaysa sa sarili nito.[a] Pagkapasok nila, naninirahan sila roon,[b] at ang huling kalagayan ng taong iyon ay nagiging mas masahol kaysa sa una.[c]
