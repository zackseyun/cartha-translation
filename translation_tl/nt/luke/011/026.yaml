  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει ⸂ἕτερα πνεύματα πονηρότερα ἑαυτοῦ ἑπτά⸃, καὶ ⸀εἰσελθόντα κατοικεῖ ἐκεῖ, καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/026.yaml
  text: Then it goes and takes along seven other spirits more evil than itself[a], and they enter and live there[c][b]; and the last state of that man becomes worse than the first.
translation:
  language: tl
  text: Pagkatapos ay umaalis ito at isinasama ang pito pang espiritu na mas masasama kaysa sa sarili nito.[a] Pagkapasok nila, naninirahan sila roon,[b] at ang huling kalagayan ng taong iyon ay nagiging mas masahol kaysa sa una.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “mas balakyot kaysa sa sarili nito.”
    reason: lexical_alternative
  - marker: b
    text: “Mga espiritu” lamang ang tahasang sinabi sa Griyego, hindi “mga demonyo” o “maruruming espiritu,” bagaman malinaw sa konteksto na masasama sila. Pangmaramihan ang participle na εἰσελθόντα (“pagkapasok”), ngunit isahan ang κατοικεῖ (“naninirahan”). Isinalin itong pangmaramihan ayon sa maliwanag na diwa ng pangungusap.
    reason: source_ambiguity
  - marker: c
    text: Maaari ring isalin ang “ang magiging kalagayan ng taong iyon sa huli ay mas masahol kaysa noong una.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos ay
  rationale: Likas na panandang temporal sa Filipino na malinaw na nagdurugtong sa kasunod na pangyayari.
- source_word: πορεύεται
  choice: umaalis ito
  rationale: Ipinapahayag ang paggalaw ng espiritu mula sa lugar; sa konteksto, mas malinaw ang “umaalis” kaysa sa payak na “pumupunta.”
- source_word: παραλαμβάνει
  choice: nagsasama
  rationale: Ipinahihiwatig ng pandiwa ang pagkuha ng mga kasama, hindi simpleng pagdakma o pagtanggap.
- source_word: ἕτερα πνεύματα
  choice: pito pang espiritu
  rationale: Pinananatili ang payak na “mga espiritu” ng Griyego at hindi idinaragdag sa pangunahing teksto ang “demonyo” o “maruming espiritu.”
- source_word: πονηρότερα ἑαυτοῦ
  choice: mas masasama kaysa sa sarili nito
  rationale: Pinananatili ang pahambing at ang pagtukoy pabalik sa unang espiritu; ang “nito” ay natural sa Filipino at hindi nagdaragdag ng kasariang wala sa πνεῦμα.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: Pumapasok sila at naninirahan doon
  rationale: Ang pangmaramihang participle ay tumutukoy sa mga espiritu. Ginamit ang natural na pangmaramihang Filipino para sa kabuuang kilos, habang inilalahad sa talababa ang di-pangkaraniwang isahang anyo ng κύριον pandiwa.
- source_word: τὰ ἔσχατα ... χείρονα τῶν πρώτων
  choice: ang huling kalagayan ... ay nagiging mas masahol kaysa sa una
  rationale: Ipinahahayag ang idyomatikong paghahambing ng pangwakas at unang kalagayan nang malinaw at marangal sa modernong Filipino.
- source_word: τοῦ ἀνθρώπου ἐκείνου
  choice: ng taong iyon
  rationale: Ang ἄνθρωπος ay “tao” at hindi tahasang “lalaki”; ang “taong iyon” ay tiyak ang referent nang hindi nagdaragdag ng kasarian.
theological_decisions:
- issue: Kung tatawaging mga demonyo o maruruming espiritu ang πνεύματα
  choice: mga espiritu
  alternative: mga demonyo; maruruming espiritu
  rationale: Bagaman malinaw sa konteksto na masasamang espiritu ang tinutukoy, πνεύματα lamang ang nasa talata. Hindi idinagdag sa pangunahing teksto ang katawagang wala rito.
- issue: Kasunduan ng pangmaramihang εἰσελθόντα at isahang κατοικεῖ
  choice: Pangmaramihang natural na salin sa pangunahing teksto, na may talababa tungkol sa anyong Griyego
  alternative: Pagkapasok nila, naninirahan ito roon
  rationale: Hindi natural at maaaring nakalilito sa Filipino ang biglang pagpapalit mula “sila” tungong “ito.” Gayunman, hindi dapat ikubli ang tunay na tensiyong gramatikal, kaya itinala ito sa talababa.
- issue: Paglalarawan sa ἄνθρωπος bilang may tiyak na kasariang lalaki
  choice: taong iyon
  alternative: lalaking iyon
  rationale: Hindi likas na minamarkahan ng Filipino ang gramatikal na kasarian, at hindi tahasang itinatakda ng salitang Griyego rito na lalaki ang tao. Iniiwasan nitong magdagdag ng impormasyong wala sa pinagmulan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “mas masasama” at “mas masahol” upang mapanatili ang magkaibang diin ng πονηρότερα at χείρονα. Iniwasan ang sobrang teknikal o makalumang pananalita.
