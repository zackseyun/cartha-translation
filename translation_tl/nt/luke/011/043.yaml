base_translation:
  language: en
  yaml_path: translation/nt/luke/011/043.yaml
  text: Woe to you Pharisees[b][a], because you love the best seats in the synagogues and greetings in the marketplaces.
translation:
  language: tl
  text: Sa aba ninyo, mga Pariseo! Sapagkat mahilig kayo sa mga upuang pandangal[a] sa mga sinagoga at sa mga pagbati sa mga pamilihan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pangunahing upuan” o “mga lugar na pinakamarangal.”
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy ito sa mga pampublikong pagbati na nagpapakita ng pagkilala at karangalang panlipunan.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαὶ ὑμῖν τοῖς Φαρισαίοις
  choice: Kahabag-habag kayo, mga Pariseo!
  rationale: Pinananatili ang matinding lakas ng propetikong kapighatian at pagtuligsa, habang likas ang tuwirang pagtawag sa modernong Tagalog.
- source_word: ὅτι
  choice: Sapagkat
  rationale: Malinaw na ipinapakilala ang dahilan ng kapighatian.
- source_word: ἀγαπᾶτε
  choice: gustong-gusto ninyo
  rationale: Sa kontekstong ito, tumutukoy ito sa matinding pagkagusto sa karangalan at pagkilala, hindi sa mapagkalingang pag-ibig; natural itong pakinggan sa Tagalog.
- source_word: τὴν πρωτοκαθεδρίαν
  choice: ang mga pangunahing upuan
  rationale: Tumutukoy sa mga upuang may pinakamataas na ranggo o karangalan sa sinagoga. Pinananatili ng salin ang kongkretong larawan nang hindi ipinapalagay na mga upuan lamang ito sa harapan.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: sa mga sinagoga
  rationale: Karaniwan at tuwirang katumbas ng pangmaramihang anyo sa Griyego.
- source_word: τοὺς ἀσπασμοὺς
  choice: ang mga pagbati
  rationale: Tuwirang salin na pinananatili ang pagiging maikli ng teksto; ipinapaliwanag sa talababa ang pahiwatig na pampublikong pagkilala at karangalan.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: sa mga pamilihan
  rationale: Natural na salin para sa mga pampublikong lugar ng kalakalan at pakikisalamuha.
theological_decisions:
- issue: Kalikasan ng pagtuligsa ni Jesus
  choice: Isang propetikong kapighatian laban sa pagkahilig ng mga Pariseo sa pampublikong karangalan.
  alternative: Isa lamang itong panlipunang puna tungkol sa masamang asal.
  rationale: Ang οὐαί at ang kasunod na dahilan ay nagpapahayag ng moral at espirituwal na pagtuligsa, hindi lamang puna sa kagandahang-asal.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “gustong-gusto” upang natural na ipahayag ang matinding pagkahilig sa katayuan; iniwasan ang masyadong teknikal o makalumang pananalita. Ang mga talababa ay inilagay kaagad pagkatapos ng mga pariralang nililinaw.
