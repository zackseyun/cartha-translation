  - severity: low
    issue: Medyo di-likas ang “nagsimula siyang magsabi.”
    rationale: Sa Tagalog, mas karaniwan at mas maayos sa naratibong rehistro ang “nagsimula siyang magsalita.”
  - severity: low
    issue: Hindi kailangan ang “isang” sa “naghahanap ... ng isang tanda.”
    rationale: Walang pangangailangang ipilit ang indefinite article ng Ingles; ang “naghahanap ng tanda” ay mas likas at nananatiling walang tiyak na pagpapakahulugan.
