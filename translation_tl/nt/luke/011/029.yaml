  naturalness: Ang “nagsimula siyang magsabi” ay hindi kasing-likas ng “nagsimula siyang magsalita” sa modernong Tagalog. Mas natural din ang “naghahanap ng tanda” kaysa “naghahanap ... ng isang tanda” sa pangkalahatang gamit na ito.
  terminology: Ang “salinlahi,” “masama,” “tanda,” at “tanda ni Jonas” ay angkop at pinananatili ang bukas na kahulugan ng Griyegong genitive. Ang tala ay maingat na hindi nagpapasya sa isang interpretasyong doktrinal.
  issues:
