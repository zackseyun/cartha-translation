  text: Τῶν δὲ ὄχλων ἐπαθροιζομένων ἤρξατο λέγειν· Ἡ γενεὰ αὕτη ⸀γενεὰ πονηρά ἐστιν· σημεῖον ⸀ζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/029.yaml
  text: As the crowds were gathering[a], he began to say, “This generation is an evil generation. It seeks a sign[b], and no sign will be given to it except the sign of Jonah.”
translation:
  language: tl
  text: 'Habang nagtitipon ang mga tao, nagsimula siyang magsalita: “Ang salinlahing ito ay isang masamang salinlahi. Naghahanap ito ng tanda, ngunit walang tandang ibibigay rito maliban sa tanda ni Jonas.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tanda ni Jonas” ay maaaring tumukoy kay Jonas mismo bilang tanda sa pamamagitan ng kanyang misyong propetiko; sa liwanag ng mga kaugnay na salaysay sa ibang Ebanghelyo, maaari rin itong magpahiwatig ng tipolohikal na kaugnayan sa kamatayan at muling pagkabuhay ni Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαθροιζομένων
  choice: nagkakatipon
  rationale: Ipinahihiwatig ng pangkasalukuyang participle ang nagpapatuloy na pagtitipon ng mga tao kasabay ng pagsisimula ni Jesus na magsalita.
- source_word: ἤρξατο λέγειν
  choice: nagsimula siyang magsabi
  rationale: Pinananatili nito ang inceptive na diwa ng konstruksiyon at natural itong pakinggan sa makabagong Tagalog.
- source_word: γενεά
  choice: salinlahi
  rationale: Karaniwang katumbas ito ng γενεά at pinananatili ang kolektibo at panahong saklaw ng pahayag.
- source_word: πονηρά
  choice: masama
  rationale: Tuwiran at malinaw nitong ipinapahayag ang moral na hatol nang hindi gumagamit ng mas arkaikong pananalita.
- source_word: σημεῖον
  choice: tanda
  rationale: Pinananatili ng “tanda” ang saklaw ng salitang Griyego bilang isang pangyayaring nagpapatunay o nagpapahiwatig, nang hindi tahasang idinaragdag ang “himala.”
- source_word: ζητεῖ
  choice: naghahanap
  rationale: Malapit ito sa literal na diwa ng pandiwa; hinahayaan ang konteksto na magpahiwatig kung ang paghahanap ay may himig ng paghingi o paghamon.
- source_word: δοθήσεται
  choice: ibibigay
  rationale: Likas na katumbas sa Tagalog ng payak na future passive.
- source_word: εἰ μὴ
  choice: maliban sa
  rationale: Malinaw nitong ipinapahayag ang eksepsiyon kasunod ng negatibong pahayag.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: ang tanda ni Jonas
  rationale: Pinananatili nitong bukas ang ugnayang ipinahihiwatig ng genitive at hindi ipinapasok sa pangunahing teksto ang isang tiyak na interpretasyon.
theological_decisions:
- issue: Saklaw ng paghatol ni Jesus sa “salinlahing ito”
  choice: Pinanatili bilang kolektibong moral na paghatol sa salinlahing kinakausap ni Jesus.
  alternative: Limitahan lamang ang tinutukoy sa ilang partikular na kalabang naroon.
  rationale: Malawak ang natural na saklaw ng αὕτη ἡ γενεά, at walang dagdag sa talata na tahasang naglilimita rito sa iilang tao.
- issue: Kahulugan ng “tanda ni Jonas”
  choice: Pinanatili ang bukas na genitibong parirala sa pangunahing teksto.
  alternative: Tukuyin ito nang tahasan bilang ministeryo ni Jonas, o bilang kamatayan at muling pagkabuhay ni Jesus.
  rationale: Iniuugnay ng kasunod na konteksto sa Lucas si Jonas mismo bilang tanda sa mga taga-Nineve, samantalang ang mga kaugnay na salaysay sa ibang Ebanghelyo ay maaari ring pumukaw ng tipolohikal na kaugnayan sa kamatayan at muling pagkabuhay ni Jesus. Hindi dapat pasiyahan ng salin lamang ang tunay na tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “salinlahi” at “tanda” bilang pamilyar ngunit hindi arkaikong bokabularyong biblikal. Iniwasan ang “makasalanang salinlahi” sapagkat mas tuwirang katumbas ng πονηρά ang “masama,” at iniwasang idagdag ang “mahimala” sa “tanda.”
