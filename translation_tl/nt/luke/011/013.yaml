id: LUK.11.13
reference: Luke 11:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὁ ἐξ οὐρανοῦ δώσει πνεῦμα ἅγιον τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/013.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will the Father from heaven give the Holy Spirit to those who ask him.
translation:
  language: tl
  text: Kung kayo nga, kahit masasama, ay marunong magbigay ng mabubuting regalo sa inyong mga anak, gaano pa kaya ang Ama na mula sa langit[a] na magbibigay ng Banal na Espiritu[b] sa mga humihingi sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang saling Ingles na nagsasabing “inyong Ama sa langit,” ayon sa kahawig na pananalita sa Mateo 7:11. Ngunit ang Griyego ni Lucas ay “ang Ama na mula sa langit.”
    reason: alternative_reading
  - marker: b
    text: Sa Mateo 7:11 ay “mabubuting bagay” ang ibinibigay, samantalang dito sa Lucas ay “ang Banal na Espiritu.” Pinananatili rito ang natatanging pananalita ng bawat Ebanghelyo.
    reason: cross_reference
lexical_decisions:
- source_word: πονηροὶ ὑπάρχοντες
  choice: kayo na masasama
  rationale: Likas at tuwirang inilalarawan nito ang kalagayang moral ng mga kausap, habang nananatili ang bahagyang concessive na diwa ng participial construction.
- source_word: οἴδατε ... διδόναι
  choice: marunong magbigay
  rationale: Ang “marunong” ay natural na Filipino para sa praktikal na kaalaman o kakayahang ipinahihiwatig ng οἴδατε na may kasunod na infinitive.
- source_word: δόματα ἀγαθὰ
  choice: mabubuting regalo
  rationale: Pinananatili ng “regalo” ang kongkretong kahulugan ng δόματα bilang mga kaloob, hindi lamang pangkalahatang “mabubuting bagay.”
- source_word: τέκνοις ὑμῶν
  choice: sa inyong mga anak
  rationale: Karaniwan at tumpak na pananalita sa konteksto ng pamilya.
- source_word: πόσῳ μᾶλλον
  choice: gaano pa kaya
  rationale: Ito ang natural na idyomang Filipino para sa a fortiori na paghahambing.
- source_word: ὁ πατὴρ ὁ ἐξ οὐρανοῦ
  choice: ang Ama na mula sa langit
  rationale: Tapat ito sa ἐξ οὐρανοῦ at hindi idinaragdag ang “inyong,” na wala sa tekstong Griyego ni Lucas.
- source_word: δώσει
  choice: ibibigay niya
  rationale: Ang tahasang sugnay pagkatapos ng dash ay malinaw at natural sa Filipino at pinananatili ang panghinaharap na anyo.
- source_word: πνεῦμα ἅγιον
  choice: ang Banal na Espiritu
  rationale: Sa kontekstong ito, tumutukoy ang parirala sa banal at personal na Espiritu ng Diyos; ang malaking titik at pantukoy ay ayon sa karaniwang gamit sa Filipino.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: sa mga humihingi sa kanya
  rationale: Natural na isinasalin ang substantival present participle bilang “mga humihingi,” at pinananatili ang tahasang layon na αὐτόν bilang “sa kanya.”
theological_decisions:
- issue: Ang tinutukoy at pagsulat ng πνεῦμα ἅγιον
  choice: ang Banal na Espiritu bilang personal at banal na Espiritu ng Diyos
  alternative: isang banal na espiritu
  rationale: Bagaman walang artikulo sa Griyego, malinaw sa konteksto ni Lucas na ang kaloob ng Ama ay ang Espiritu ng Diyos; hindi kailangang gawing di-personal o pangkalahatan ang parirala.
- issue: Kaugnayan sa kaparehong talata sa Mateo 7:11
  choice: 'panatilihin ang natatanging pananalita ni Lucas: “ang Ama na mula sa langit” at “ang Banal na Espiritu”'
  alternative: itugma sa Mateo bilang “inyong Ama sa langit” o palitan ng “mabubuting bagay”
  rationale: Dapat sundin ang tekstong Griyego ni Lucas sa halip na pag-isahin ang magkaibang pananalita ng dalawang Ebanghelyo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Kaya nga,” “marunong,” at “gaano pa kaya” bilang natural na mga idyoma. Ang “Ama na mula sa langit” ay bahagyang di-karaniwang pakinggan ngunit sadyang pinanatili upang katawanin ang natatanging ἐξ οὐρανοῦ ni Lucas. Ang mga panandang talababa [a] at [b] ay kapwa inilagay sa pangunahing teksto.
