  verdict: revise
  source_fidelity: Tumpak ang pangunahing diwa ng talata. Gayunman, ang “nagkakabaha-bahagi” ay hindi likas at maaaring magpahiwatig ng nagpapatuloy na proseso kaysa sa pangkalahatang kasabihang tungkol sa kahariang nahati. Ang “sa ibabaw ng” ay labis na nagtatakda sa ἐπὶ bilang purong lokasyong pisikal; ang siksik na Griyego ay maaaring magpanatili ng larawan ng bahay na bumabagsak sa/bilang laban sa bahay.
  naturalness: Mas natural sa modernong Filipino ang “nahahati laban sa sarili nito” at “bumabagsak sa isa pang bahay.” Ang huli ay nagpapanatili ng maigsi at bahagyang malabong larawan nang hindi ipinipilit ang “sa ibabaw.”
  terminology: Ang “kaharian,” “mga iniisip,” “nawawasak,” at “bahay/sambahayan” ay angkop. Nananatiling nasa talababa ang makatwirang alternatibong kahulugan ng οἶκος.
  issues:
