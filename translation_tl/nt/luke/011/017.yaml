base_translation:
  language: en
  yaml_path: translation/nt/luke/011/017.yaml
  text: But he[a], knowing their thoughts, said to them, “Every kingdom divided against itself is laid waste, and a house falls upon a house.”
translation:
  language: tl
  text: Ngunit alam niya ang kanilang mga iniisip, at sinabi niya sa kanila, “Bawat kahariang nahahati laban sa sarili nito ay nawawasak, at bumabagsak ang isang bahay sa isa pang bahay.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “at bumabagsak ang isang sambahayan laban sa isa pang sambahayan.” Ang salitang Griyego na οἶκος ay maaaring tumukoy sa isang bahay na gusali o sa isang sambahayan o pamilya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: alam niya
  rationale: Ipinahahayag nito ang pagkabatid ni Jesus sa kanilang iniisip; natural ito sa modernong Tagalog at hindi dinaragdagan ang diwa.
- source_word: διανοήματα
  choice: mga iniisip
  rationale: Saklaw nito ang panloob na pag-iisip o pangangatwiran nang hindi ipinapalagay na tiyak na masama ang kanilang layunin.
- source_word: Πᾶσα βασιλεία
  choice: Bawat kaharian
  rationale: Pinananatili ang pangkalahatan at pamahaging puwersa ng πᾶσα sa kasabihan.
- source_word: ἐφ’ ἑαυτὴν διαμερισθεῖσα
  choice: nagkakabaha-bahagi laban sa sarili nito
  rationale: Ipinakikita ang panloob na pagkakahati at pagsasalungatan; ang aspektong nagpapatuloy ay likas na naihahayag ng nagkakabaha-bahagi.
- source_word: ἐρημοῦται
  choice: nawawasak
  rationale: Naghahatid ng matinding pagkasira o pagkatiwangwang habang nananatiling malinaw at natural sa karaniwang mambabasa.
- source_word: οἶκος ἐπὶ οἶκον
  choice: ang isang bahay sa ibabaw ng isa pang bahay
  rationale: Pinananatili ang kongkretong larawan at ang sadyang siksik na anyo ng Griyego, habang inilalagay sa talababa ang posibleng panlipunang diwa ng οἶκος.
- source_word: πίπτει
  choice: bumabagsak
  rationale: Tuwirang pinananatili ang talinghaga ng pagbagsak at ang pangkasalukuyang anyo ng kasabihan.
theological_decisions:
- issue: Kahulugan ng οἶκος sa ikalawang sugnay
  choice: bahay
  alternative: sambahayan o pamilya
  rationale: Hindi ipinipilit ng Griyego kung gusali o sambahayan ang tinutukoy. Ang “bahay” sa pangunahing teksto ay nagpapanatili sa kongkretong larawan, at ang talababa ay nag-iingat sa tunay na leksikal na posibilidad ng panlipunang kahulugan.
- issue: Ugnayan ng οἶκος ἐπὶ οἶκον
  choice: bumabagsak ang isang bahay sa ibabaw ng isa pang bahay
  alternative: naglalaban at bumabagsak ang sambahayan laban sa sambahayan
  rationale: Ang literal na ugnayang “sa ibabaw ng” ay pinananatili upang hindi tiyakang lutasin ang siksik at maaaring ambiguwong parirala bilang tunggaliang panlipunan lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “alam niya” sa halip na mas pormal na “batid niya,” at “mga iniisip” sa halip na teknikal na “mga pangangatwiran.” Inilagay ang talababa sa mismong sugnay na may leksikal na kalabuan.
