    issue: “nagkakabaha-bahagi laban sa sarili nito”
    rationale: Hindi ito karaniwang modernong pahayag at hindi kinakailangang ipahiwatig ang aspektong nagpapatuloy. Ang “nahahati laban sa sarili nito” ay mas natural at sapat na tumutugma sa διαμερισθεῖσα.
  - severity: medium
    issue: “sa ibabaw ng isa pang bahay”
    rationale: Masyado nitong nililimitahan ang ἐπὶ sa pisikal na ‘above/on top of.’ Ang parirala ay siksik at may posibleng kaugnayan sa ‘laban sa’; ang “bumabagsak sa isa pang bahay” ay hindi gaanong mapagpasya at mas natural sa Tagalog.
