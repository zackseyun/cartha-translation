  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐπὰν ⸀δὲ ἰσχυρότερος ⸀αὐτοῦ ἐπελθὼν νικήσῃ αὐτόν, τὴν πανοπλίαν αὐτοῦ αἴρει ἐφ’ ᾗ ἐπεποίθει, καὶ τὰ σκῦλα αὐτοῦ διαδίδωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/022.yaml
  text: But when one stronger than he comes upon him and overpowers him[a], he takes away his full armor on which he had relied[c][b], and distributes his plunder.
translation:
  language: tl
  text: Ngunit kapag dumating laban sa kanya ang isang mas malakas at manaig sa kanya[a], kukunin nito ang buong baluti[b] na pinagkakatiwalaan niya, at ipamamahagi ang kanyang mga nasamsam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “talunin siya” o “lupigin siya.”
    reason: lexical_alternative
  - marker: b
    text: Ang “buong baluti” ay salin ng salitang tumutukoy sa kompletong kasuutang pandigma.
    reason: lexical_alternative
  - marker: c
    text: O “mga samsam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὰν δὲ
  choice: Ngunit kapag
  rationale: Likas na ipinahahayag ang temporal-kondisyonal na diwa ng ἐπάν, habang pinananatili ng “ngunit” ang pagsalungat ng δέ sa naunang kalagayan.
- source_word: ἰσχυρότερος αὐτοῦ
  choice: isang mas malakas kaysa sa kanya
  rationale: Substantibo ang gamit ng pahambing na pang-uri; hindi na idinagdag ang “lalaki” sapagkat wala itong tahasang katumbas sa sugnay, bagaman malinaw sa konteksto ang tinutukoy.
- source_word: ἐπελθὼν
  choice: dumating
  rationale: Pinananatili ang payak na diwa ng pagdating laban o tungo sa isa nang hindi tahasang dinaragdagan ng “sumalakay,” na mas interpretatibo.
- source_word: νικήσῃ αὐτόν
  choice: madaig siya
  rationale: Ang “madaig” ay malinaw at natural na nagsasaad ng pagtatagumpay at pagsupil na humahantong sa pagkuha ng baluti.
- source_word: τὴν πανοπλίαν αὐτοῦ
  choice: ang buong baluti
  rationale: Ipinahahayag ng “buong baluti” ang πανοπλία bilang kompletong kasuutang pandigma, hindi lamang isang piraso ng baluti.
- source_word: αἴρει
  choice: kinukuha nito
  rationale: Sa konteksto, ang pandiwa ay tumutukoy sa pag-aalis at pagkuha sa baluti ng nadaig.
- source_word: ἐφ’ ᾗ ἐπεποίθει
  choice: na kanyang pinanghahawakan
  rationale: Likas sa modernong Tagalog ang “pinanghahawakan” para sa matatag na pagtitiwala o pag-asa sa isang bagay; pinananatili nito ang kaugnayan sa baluti.
- source_word: τὰ σκῦλα αὐτοῦ
  choice: ang kanyang mga nasamsam
  rationale: Ang σκῦλα ay mga samsam sa digmaan. Ang “mga nasamsam” ay malinaw sa karaniwang mambabasa at pinananatili ang larawang pandigma.
- source_word: διαδίδωσιν
  choice: ipinamamahagi
  rationale: Tumpak na ipinahahayag ang paghahati at pamamahagi ng mga samsam sa iba.
theological_decisions:
- issue: Kung tahasang tatawaging “lalaki” ang mas malakas upang iugnay siya sa “malakas na lalaki” sa naunang talata.
  choice: Hindi idagdag ang “lalaki”; gamitin ang “isang mas malakas kaysa sa kanya.”
  alternative: kapag dumating ang isang lalaking mas malakas kaysa sa kanya
  rationale: Walang tahasang pangngalan sa pariralang Griyego. Sapat ang konteksto upang makilala ang tauhan, at hindi kailangang gawing mas tiyak ang teksto kaysa sa pinagmulan.
- issue: Lakas ng pagkakasalin sa νικάω sa larawang ito ng tunggalian.
  choice: madaig siya
  alternative: mapangibabawan siya; malupig siya
  rationale: Ang “madaig” ay natural at sapat na malakas upang ilarawan ang pagkatalo at kasunod na pag-aalis ng baluti, nang hindi nagdaragdag ng interpretasyong teolohikal tungkol sa mga kinakatawan ng mga tauhan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Ginamit ang “nito” upang luminaw na ang mas malakas ang kumukuha ng baluti, at iniwasang pangalanan ang mga tauhan ayon sa isang partikular na teolohikal na interpretasyon.
