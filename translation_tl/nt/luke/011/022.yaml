revisions:
- from: Ngunit kapag dumating ang isang mas malakas kaysa sa kanya at madaig siya[a], kinukuha nito ang buong baluti[b] na kanyang pinanghahawakan, at ipinamamahagi ang kanyang mga nasamsam[c].
  to: Ngunit kapag dumating laban sa kanya ang isang mas malakas at manaig sa kanya[a], kukunin nito ang buong baluti[b] na pinagkakatiwalaan niya, at ipamamahagi ang kanyang mga nasamsam[c].
  rationale: Pinalitan ang balintiyak na “madaig siya” ng “manaig sa kanya,” idinagdag ang “laban sa kanya” upang katawanin ang direksiyonal na puwersa ng ἐπελθών, at pinalitan ang “pinanghahawakan” ng “pinagkakatiwalaan” upang maipahayag ang diwa ng nakaraang pagtitiwala sa baluti. Napanatili ang kawalan ng tahasang pangngalang “lalaki” at ang larawang pandigma ng pinagmulan.
