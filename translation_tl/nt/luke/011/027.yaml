  source_fidelity: Tumpak na naihahatid ng draft ang estrukturang pasalaysay, ang hindi-tiyak na babae mula sa karamihan, at ang papuring nakatuon sa sinapupunan at mga dibdib ng ina ni Jesus. Gayunman, ang "mga dibdib na iyong sinuso" ay hindi ang pinakanatural na Filipino para sa aktibong kilos ni Jesus na ἐθήλασας; mas malinaw at idiomatiko ang "mga dibdib na iyong sinusuhan."
  naturalness: Ang kabuuang rehistro ay makabago at marangal. Ang "iyong sinusuhan" ay mas likas sa Filipino kaysa "iyong sinuso" sa ganitong maternal na larawan. Ang "Nangyari naman na" ay katanggap-tanggap bilang panandang pasalaysay at hindi kailangang baguhin.
  terminology: Ang "Pinagpala," "sinapupunan," at "mga dibdib" ay angkop, tumpak, at hindi nagdadagdag ng doktrinal na pagbasa. Napananatili ng "nagdala sa iyo" ang saklaw ng βαστάσασα nang hindi ipinipilit na tumukoy lamang sa pagsilang.
