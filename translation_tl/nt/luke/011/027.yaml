  to: Nangyari naman na habang sinasabi niya ang mga bagay na ito, isang babae mula sa karamihan ang nagtaas ng tinig[a] at nagsabi sa kanya, “Pinagpala ang sinapupunang nagdala sa iyo[b] at ang mga dibdib na iyong sinusuhan!”
