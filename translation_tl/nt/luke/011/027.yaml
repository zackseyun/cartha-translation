source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ λέγειν αὐτὸν ταῦτα ἐπάρασά τις ⸂φωνὴν γυνὴ⸃ ἐκ τοῦ ὄχλου εἶπεν αὐτῷ· Μακαρία ἡ κοιλία ἡ βαστάσασά σε καὶ μαστοὶ οὓς ἐθήλασας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/027.yaml
  text: And it happened[a], as he was saying these things, that a woman from the crowd raised her voice and said to him, “Blessed is the womb that carried you[b], and the breasts that nursed you.”
translation:
  language: tl
  text: Nangyari naman na habang sinasabi niya ang mga bagay na ito, isang babae mula sa karamihan ang nagtaas ng tinig[a] at nagsabi sa kanya, “Pinagpala ang sinapupunang nagdala sa iyo[b] at ang mga dibdib na iyong sinusuhan!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inilakas ang kanyang tinig.” Ang idyomang Griyego ay nangangahulugang nagtaas siya ng boses o sumigaw.
    reason: lexical_alternative
  - marker: b
    text: O “nagsilang sa iyo.” Maaaring tumukoy ang pandiwang Griyego sa pagdadala sa sinapupunan o sa pagsisilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Nangyari naman na
  rationale: Pinananatili ang pormulang pasalaysay ni Lucas at ang puwersa ng δέ nang hindi gumagamit ng makalumang pananalita.
- source_word: ἐν τῷ λέγειν αὐτὸν ταῦτα
  choice: habang sinasabi niya ang mga bagay na ito
  rationale: Ipinahahayag ng articular infinitive na may ἐν ang kilos na kasabay at nagpapatuloy; pinananatili rin ang demonstratibong ταῦτα.
- source_word: ἐπάρασά τις φωνὴν γυνὴ
  choice: isang babae ... ang nagtaas ng tinig
  rationale: Likas na idyomang Filipino ito para sa paglalakas o pagtataas ng boses; sapat nang isalin ang τις bilang di-tiyak na “isang babae.”
- source_word: ἐκ τοῦ ὄχλου
  choice: mula sa karamihan
  rationale: Tuwirang ipinahahayag ang pinagmulan ng babaeng nagsalita.
- source_word: Μακαρία
  choice: Pinagpala
  rationale: Ipinahahayag nito ang marangal at pinagpalang kalagayan, hindi lamang pansariling kaligayahan o magandang kapalaran.
- source_word: ἡ κοιλία
  choice: ang sinapupunan
  rationale: Sa kontekstong maternal, tiyak na tumutukoy ang κοιλία sa sinapupunan, hindi lamang sa tiyan.
- source_word: ἡ βαστάσασά σε
  choice: na nagdala sa iyo
  rationale: Pinananatili ang larawan ng pagdadala sa sanggol sa sinapupunan at ang saklaw ng βαστάζω, nang hindi labis na nililinaw kung pagbubuntis lamang o pati panganganak ang diin.
- source_word: μαστοὶ οὓς ἐθήλασας
  choice: ang mga dibdib na iyong sinuso
  rationale: Pinananatili ang konkretong katawagang anatomikal at ang aktibong anyo ng Griyego, kung saan si Jesus ang sumuso.
theological_decisions:
- issue: Ang paglalarawan sa ina ni Jesus sa pamamagitan ng Μακαρία
  choice: Pinagpala ang sinapupunang nagdala sa iyo at ang mga dibdib na iyong sinuso
  alternative: Maligaya ang sinapupunang nagdala sa iyo at ang mga dibdib na iyong sinuso
  rationale: Pinananatili ng “pinagpala” ang papuri at marangal na puwersa ng μακαρία, ngunit hindi nito dinaragdagan o binabawasan ang kahalagahan ng ina ni Jesus nang lampas sa mismong sinabi ng babae.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang pormulang pasalaysay, ang konkretong larawang maternal, at ang beatitude-like na bigat ng “Pinagpala,” habang iniwasan ang makalumang “mapalad” bilang pangunahing salin at ang anumang dagdag na doktrinal na pagpapakahulugan.
