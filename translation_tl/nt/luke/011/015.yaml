reference: Luke 11:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπον· Ἐν Βεελζεβοὺλ ⸀τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/015.yaml
  text: But some of them said[a], “By Beelzebul, the ruler of the demons, he casts out demons.”
translation:
  language: tl
  text: Ngunit sinabi ng ilan sa kanila, “Nagpapalayas siya ng mga demonyo sa pamamagitan ni Beelzebul[a], ang pinuno ng mga demonyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Beelzebub: tradisyonal na anyo ng pangalang isinatitik dito bilang Beelzebul, ayon sa tekstong Griyego.'
    reason: alternative_reading
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Ngunit sinabi ng ilan sa kanila
  rationale: Ipinahahayag ng “ngunit” ang pagsalungat sa naunang tugon, habang pinananatili ng “ilan sa kanila” ang di-tiyak at partitibong diwa ng Griyego.
- source_word: Ἐν Βεελζεβοὺλ
  choice: Sa pamamagitan ni Beelzebul
  rationale: Ang ἐν kasunod ng personal na pangalan ay nagpapahayag dito ng kaparaanan o ahensiya. Ang “sa pamamagitan ni” ay likas at malinaw sa Filipino, at ang Beelzebul ay sumusunod sa anyo ng pangalang nasa tekstong Griyego.
- source_word: τῷ ἄρχοντι τῶν δαιμονίων
  choice: ang pinuno ng mga demonyo
  rationale: Ang ἄρχων ay tumutukoy sa isang namumuno o may kapangyarihan. Ang “pinuno” ay malinaw sa modernong Filipino at hindi nagdaragdag ng higit na tiyak na demonolohiya.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: nagpapalayas siya ng mga demonyo
  rationale: Ang “nagpapalayas” ay natural na salin ng ἐκβάλλει sa konteksto ng pagpapaalis ng mga demonyo; ang “mga demonyo” ay tuwirang katumbas ng τὰ δαιμόνια.
theological_decisions:
- issue: Anyo ng pangalang Βεελζεβούλ
  choice: Beelzebul
  alternative: Beelzebub
  rationale: Sinusunod ng pangunahing teksto ang anyong Βεελζεβούλ sa Griyego. Inilalagay sa talababa ang pamilyar na tradisyonal na anyong “Beelzebub” nang hindi ito inuuna kaysa sa ebidensiya ng orihinal na wika.
- issue: Paglalarawan kay Beelzebul bilang ἄρχων
  choice: ang pinuno ng mga demonyo
  alternative: ang prinsipe ng mga demonyo
  rationale: Malinaw na ipinahahayag ng “pinuno” ang awtoridad na tinutukoy ng ἄρχων, nang hindi umaasa sa mas tradisyonal ngunit maaaring di-gaanong likas na “prinsipe.”
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinili ang “sa pamamagitan ni” upang luminaw na ang paratang ay tungkol sa kapangyarihan o ahensiya ni Beelzebul, hindi sa lokasyon. Ginamit ang “nagpapalayas” bilang likas na pandiwa sa kontekstong ito.
