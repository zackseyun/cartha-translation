  text: ὅταν ὁ ἰσχυρὸς καθωπλισμένος φυλάσσῃ τὴν ἑαυτοῦ αὐλήν, ἐν εἰρήνῃ ἐστὶν τὰ ὑπάρχοντα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/021.yaml
  text: When the strong man[a], fully armed, guards his own courtyard[b], his possessions are secure.
translation:
  language: tl
  text: Kapag binabantayan ng malakas na lalaki, na ganap na armado, ang sarili niyang looban[a], ligtas ang kanyang mga ari-arian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sarili niyang palasyo” o “sarili niyang nasasakupan.” Ang salitang Griyego ay maaaring tumukoy sa isang looban o sa tirahan at buong lugar na kinabibilangan nito.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nasa kapayapaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Kapag
  rationale: Likas na nagpapahayag ng pangkalahatang kalagayang may temporal at kondisyonal na diwa.
- source_word: ὁ ἰσχυρός
  choice: ang taong malakas
  rationale: Ginagawang pangngalan ang pang-uri sa Griyego at tumutukoy sa isang lalaking malakas; pinananatili ang larawan nang hindi tahasang kinikilalang si Satanas.
- source_word: καθωπλισμένος
  choice: kumpleto sa sandata
  rationale: Ipinahahayag ang kalagayan ng isang taong ganap nang nakapaghanda at nasangkapan ng mga sandata sa natural na modernong Tagalog.
- source_word: φυλάσσῃ
  choice: nagbabantay
  rationale: Tumutugma sa patuloy na pagbabantay o pag-iingat sa inilalarawang sitwasyon.
- source_word: τὴν ἑαυτοῦ αὐλήν
  choice: sa sarili niyang looban
  rationale: Ang αὐλή ay maaaring tumukoy sa looban o sa tirahan at nasasakupan nito; ang 'looban' ang pinakadirekta at hindi nagdaragdag ng di-tiyak na karangyaan.
- source_word: ἐν εἰρήνῃ
  choice: nasa katiwasayan
  rationale: Natural na Tagalog para sa idyomang nagsasaad na ligtas at hindi nagagambala, habang inilalagay sa talababa ang literal na larawan ng kapayapaan.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: ang kanyang mga ari-arian
  rationale: Malinaw at malawak na katawagan para sa mga bagay o pag-aaring nauukol sa kanya.
theological_decisions:
- issue: Metaporikal na tinutukoy ng kasabihan ayon sa konteksto
  choice: Panatilihin sa pangunahing teksto ang tuwirang larawan ng taong malakas.
  alternative: Tahasang tukuyin ang taong malakas bilang si Satanas.
  rationale: Inilalahad mismo ng talata ang metapora, samantalang ang nakapaligid na konteksto ang gumagabay sa pagkilala sa tinutukoy nito; hindi dapat lutasin ng salin ang ipinahihiwatig lamang dito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kumpleto sa sandata” sa halip na mas teknikal o makalumang “lubos na nasasandatahan,” at ang “nasa katiwasayan” upang natural na maipahayag ang idyomang Griyego.
