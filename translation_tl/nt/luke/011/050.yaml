  text: ἵνα ἐκζητηθῇ τὸ αἷμα πάντων τῶν προφητῶν τὸ ἐκκεχυμένον ἀπὸ καταβολῆς κόσμου ἀπὸ τῆς γενεᾶς ταύτης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/050.yaml
  text: so that the blood of all the prophets[a], shed from the foundation of the world, may be required of this generation,
translation:
  language: tl
  text: upang papanagutin ang salinlahing ito sa dugo ng lahat ng propeta, dugong ibinuhos mula pa sa pagkakatatag ng sanlibutan,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na nagpapahayag ng layunin o bunga sa Filipino at pinananatili ang puwersa ng sugnay kaugnay ng naunang konteksto.
- source_word: ἐκζητηθῇ
  choice: papanagutin
  rationale: Sa konteksto ng dugong dumanak, ang pandiwa ay may hudisyal na diwa ng pagsingil at pagtawag upang managot, hindi lamang ng paghahanap.
- source_word: τὸ αἷμα
  choice: sa dugo
  rationale: Pinananatili ang larawang 'dugo' ng Griyego; sa pangungusap, tumutukoy ito sa pananagutan dahil sa pagpatay sa mga propeta.
- source_word: πάντων τῶν προφητῶν
  choice: ng lahat ng propeta
  rationale: Tuwirang pinananatili ang saklaw na sumasaklaw sa lahat ng propeta.
- source_word: τὸ ἐκκεχυμένον
  choice: dumanak
  rationale: '''Dumanak ang dugo'' ang natural at marangal na pariralang Filipino para sa dugong ibinuhos sa marahas na pagkamatay.'
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: mula pa nang itatag ang sanlibutan
  rationale: Pinananatili ang simulaing panahon at ang karaniwang biblikal na diwa ng 'pagkakatatag ng sanlibutan,' sa natural na ayos ng Filipino.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: ang salinlahing ito
  rationale: Ginawang layon ng pandiwang 'papanagutin' upang natural na maipahayag sa Filipino ang partidong sisingilin, habang nananatili ang diwa ng Griyegong ἀπό sa balintiyak na konstruksyon.
theological_decisions:
- issue: Ang uri ng pananagutang kaugnay ng dugo ng mga propeta
  choice: Inilalarawan ito bilang hudisyal na pagpapapanagot sa salinlahing ito dahil sa dugong dumanak ng mga propeta.
  alternative: Unawain ito bilang retorikal lamang na pahayag ng pagpapatuloy ng kasaysayan, na walang mariing hudisyal na diwa.
  rationale: Ang ἐκζητηθῇ sa konteksto ng dugong dumanak ay likas na nagpapahiwatig ng pagsingil o pagtutuos. Hindi ipinapaliwanag ng salin kung paano gumagana ang sama-samang pananagutan, kaya nananatili ang tensiyong teolohikal ng talata.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “salinlahi” at “sanlibutan” bilang malinaw at pamilyar na bokabularyong biblikal; inayos ang balintiyak na Griyego bilang natural na aktibong pahayag sa Filipino nang hindi inaalis ang hudisyal na diin o ang larawan ng dugo.
