    reason: lexical_alternative
  revision_rationale: Nilinaw ang sintaktikong saklaw upang ang dugo, hindi ang mga propeta, ang malinaw na inilalarawang ibinuhos. Pinanatili ang layuning “upang,” ang hudisyal na diwa ng pagpapapanagot, ang malawak na saklaw na “lahat,” at ang temporal na pariralang “mula pa sa pagkakatatag ng sanlibutan.”
