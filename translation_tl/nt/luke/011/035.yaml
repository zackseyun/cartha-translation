  text: σκόπει οὖν μὴ τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/035.yaml
  text: Therefore[a], watch out lest the light in you be darkness.
translation:
  language: tl
  text: Kaya mag-ingat ka[a], baka ang liwanag na nasa iyo ay kadiliman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tiyakin mong ang liwanag na nasa iyo ay hindi kadiliman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σκόπει
  choice: mag-ingat ka
  rationale: Ang pangkasalukuyang pautos na nasa ikalawang panauhang isahan ay nananawagan ng patuloy na pagbabantay. Likas sa modernong Tagalog ang “mag-ingat ka” at malinaw nitong naihahatid ang lakas ng babala.
- source_word: οὖν
  choice: kaya
  rationale: Ipinakikita nito ang kongklusyon o implikasyon ng naunang turo tungkol sa mata at liwanag. Mas natural sa kasalukuyang Tagalog ang “kaya” kaysa sa mas pormal na “samakatuwid.”
- source_word: μὴ
  choice: baka
  rationale: Kasunod ng pautos, ipinahahayag ng μή ang babala laban sa isang hindi kanais-nais na posibilidad. Ang “baka” ang pinakanatural na paraan upang maipahayag ito sa Tagalog.
- source_word: τὸ φῶς
  choice: ang liwanag
  rationale: Tuwirang pinananatili ang talinghaga ng liwanag sa halip na paliitin ito bilang pagkaunawa, budhi, o espirituwal na kalagayan lamang.
- source_word: τὸ ἐν σοὶ
  choice: na nasa iyo
  rationale: Natural at tuwirang salin ito na hindi nagpapasya kung sikolohikal, moral, o espirituwal lamang ang tinutukoy.
- source_word: σκότος
  choice: kadiliman
  rationale: Pinananatili nito ang tahasang pagsalungat ng liwanag at kadiliman sa konteksto at ang malawak na puwersang metaporikal nito.
- source_word: ἐστίν
  choice: ay
  rationale: Payak na pang-ugnay na sapat na naghahatid sa kopulang Griyego nang walang dagdag na pagpapakahulugan.
theological_decisions:
- issue: Metaporikal na kahulugan ng “liwanag” at “kadiliman”
  choice: Panatilihin ang dalawang talinghaga nang hindi nililimitahan ang kahulugan nito.
  alternative: Isalin ang “liwanag” bilang pagkaunawa, panloob na kaliwanagan, budhi, o espirituwal na kalagayan.
  rationale: Malawak ang talinghaga ni Jesus at nakaugnay ito sa naunang turo tungkol sa pang-unawa at panloob na kalagayan. Ang mas tiyak na pagpapakahulugan ay magdaragdag ng hindi tahasang sinasabi ng Griyego.
- issue: Lakas at anyo ng babala sa μή kasunod ng pautos
  choice: “mag-ingat ka, baka…”
  alternative: “tiyakin mong… hindi…”
  rationale: Parehong maaaring maipahayag ng konstruksiyon ang maingat na pagtiyak at babala laban sa isang posibilidad. Pinili sa teksto ang mas natural na babalang Tagalog, habang inilagay sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang isahang “ka/iyo” upang tumpak na katawanin ang ikalawang panauhang isahan ng Griyego. Pinanatili ang matinding kabalintunaan ng liwanag na maaaring maging kadiliman.
