id: LUK.11.1
reference: Luke 11:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν τόπῳ τινὶ προσευχόμενον, ὡς ἐπαύσατο, εἶπέν τις τῶν μαθητῶν αὐτοῦ πρὸς αὐτόν· Κύριε, δίδαξον ἡμᾶς προσεύχεσθαι, καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/001.yaml
  text: And it happened that while he was praying in a certain place, when he stopped, one of his disciples said to him, “Lord, teach us to pray, just as John also taught his disciples.”
translation:
  language: tl
  text: Minsan, habang nananalangin si Jesus sa isang lugar, nang tumigil siya, sinabi sa kanya ng isa sa kanyang mga alagad, “Panginoon, turuan mo kaming manalangin, kung paanong tinuruan din ni Juan ang kanyang mga alagad.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Minsan
  rationale: Ginagampanan nito sa natural na makabagong Tagalog ang panimulang pormula ng salaysay, nang hindi ginagamit ang makalumang literal na ‘At nangyari.’
- source_word: ἐν τῷ εἶναι αὐτὸν ... προσευχόμενον
  choice: habang nananalangin si Jesus
  rationale: Ipinapahayag ng ‘habang’ ang kasabay at nagpapatuloy na kilos. Ginawang tahas ang pangalang Jesus upang maging malinaw at natural sa nagsasariling talata.
- source_word: ἐν τόπῳ τινὶ
  choice: sa isang lugar
  rationale: Pinananatili nito ang sadyang di-tiyak na lugar sa payak at natural na Tagalog.
- source_word: ὡς ἐπαύσατο
  choice: nang tumigil siya
  rationale: Tuwirang pinananatili ang kahulugan ng ἐπαύσατο na ‘tumigil,’ sa halip na ipakahulugang ‘natapos.’ Nauunawaan sa konteksto na tumigil siya sa pananalangin.
- source_word: τις τῶν μαθητῶν αὐτοῦ
  choice: isa sa kanyang mga alagad
  rationale: Ito ang natural na katumbas ng partitive construction at hindi kailangang gawing mabigat na ‘isang partikular sa kanyang mga alagad.’
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili ang karaniwang salin ng κύριος at ang lawak ng kahulugan nito bilang magalang at makabuluhang pagtawag kay Jesus.
- source_word: δίδαξον ἡμᾶς προσεύχεσθαι
  choice: turuan mo kaming manalangin
  rationale: Tuwirang isinasalin ang infinitive complement nang hindi idinaragdag ang ‘kung paano,’ na wala sa pariralang Griyego.
- source_word: καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ
  choice: kung paanong tinuruan din ni Juan ang kanyang mga alagad
  rationale: Malinaw na ipinahahayag ng ‘kung paanong’ ang paghahambing ng καθώς, at ng ‘din’ ang καί.
theological_decisions:
- issue: Pagsasalin ng κύριος bilang tawag kay Jesus
  choice: Panginoon
  alternative: Guro
  rationale: Hindi nililimitahan ng ‘Panginoon’ ang tawag sa papel lamang ni Jesus bilang guro at pinananatili nito ang nakaugaliang lawak ng κύριος sa Lucas, nang hindi ipinipilit ang buong teolohikal na bigat nito sa mismong kontekstong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang makalumang ‘At nangyari’ at pinili ang natural na panimulang ‘Minsan.’ Ginamit ang ‘alagad’ at ‘Panginoon’ bilang pamilyar ngunit dignified na bokabularyong biblikal.
