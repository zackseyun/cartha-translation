base_translation:
  language: en
  yaml_path: translation/nt/luke/011/037.yaml
  text: While he was speaking[a], a Pharisee asks him to dine with him[b]; so he went in and reclined at the table.
translation:
  language: tl
  text: Habang nagsasalita siya, inanyayahan siya ng isang Pariseo na makisalo sa kanya[a]. Pumasok siya at humilig sa hapag[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mag-agahan” o “kumain ng maagang pagkain.” Maaaring tumukoy ang pandiwang Griyego sa mas maagang pagkain sa araw, ngunit dito ay pangkalahatan itong tumutukoy sa isang pagkain.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, nakahilig siya sa hapag ayon sa nakaugaliang postura sa pagkain noong panahong iyon.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν δὲ τῷ λαλῆσαι
  choice: Habang nagsasalita siya
  rationale: Ipinahahayag ng ἐν na may articular infinitive ang kilos na kasabay ng pagsasalita; likas sa modernong Tagalog ang “habang nagsasalita siya.”
- source_word: ἐρωτᾷ
  choice: nag-anyaya
  rationale: Pangunahing nangangahulugan ang pandiwa na humingi o makiusap, ngunit nililinaw ng kasunod na sugnay na paanyaya sa pagkain ang hinihingi. Ang “nag-anyaya” ang pinakanatural na pagpapahayag nito sa Tagalog; hindi pinanatili ang historikal na pangkasalukuyan sapagkat mas likas sa salaysay na Tagalog ang aspektong naganap.
- source_word: Φαρισαῖος
  choice: isang Pariseo
  rationale: Karaniwang katawagan sa Tagalog para sa pangkat na ito; ang isahang pangngalang walang pantukoy sa Griyego ay natural na ipinapahayag bilang “isang Pariseo.”
- source_word: ὅπως ἀριστήσῃ
  choice: na kumain
  rationale: Maaaring tumukoy ang ἀριστάω sa agahan o sa mas maagang pagkain sa araw, ngunit hindi tiyak dito ang oras. Iniiwasan ng pangkalahatang “kumain” ang hindi kinakailangang pagpapasya.
- source_word: παρ’ αὐτῷ
  choice: kasama nito
  rationale: Tuwirang ipinahahayag ang pakikisalo sa Pariseo nang hindi idinaragdag na tahasang sinabi ng teksto na sa bahay nito ginanap ang pagkain.
- source_word: εἰσελθὼν
  choice: pumasok siya
  rationale: Ang aorist participle ay tumutukoy sa kilos na nauna sa paghilig sa hapag; malinaw at natural ang “pumasok siya.”
- source_word: ἀνέπεσεν
  choice: humilig sa hapag
  rationale: Tumutukoy ang pandiwa sa nakaugaliang paghilig habang kumakain, hindi lamang sa pag-upo. Pinananatili ng salin ang makasaysayang postura at nililinaw ng “sa hapag” ang konteksto.
