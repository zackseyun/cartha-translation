  source_fidelity: Ang “nag-anyaya” ay katanggap-tanggap sa konteksto, ngunit mas tuwirang naipapahayag ng “inanyayahan siya” ang ἐρωτᾷ kasama ng layuning ὅπως ἀριστήσῃ. Ang “makisalo sa kanya” ay pinananatili ang παρ’ αὐτῷ nang hindi nagdaragdag ng tahasang lokasyon gaya ng bahay. Ang “humilig sa hapag” ay wastong naghahatid ng ἀνέπεσεν sa konteksto ng pagkain.
  naturalness: Mas natural at malinaw sa modernong Tagalog ang ayos na “inanyayahan siya ng isang Pariseo na makisalo sa kanya” kaysa “isang Pariseo ang nag-anyaya sa kanya na kumaing kasama nito.” Naiiwasan din nito ang medyo di-likas na “kumaing kasama nito.”
  terminology: Wasto ang “Pariseo.” Ang “makisalo” ay angkop na pangkalahatang salin para sa pagkain nang magkakasama at hindi nagpapasya kung almusal o ibang maagang pagkain. Wasto rin ang “humilig sa hapag,” na nililinaw ng talababa bilang dating postura sa pagkain.
  issues:
