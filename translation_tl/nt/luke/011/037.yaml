translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nito” upang malinaw na ang Pariseo, hindi si Jesus, ang kasalo. Inilagay ang mga talababa sa mismong mga pariralang tinatalakay ng mga ito.
