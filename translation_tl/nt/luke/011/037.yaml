    rationale: Mas likas ang “makisalo sa kanya,” at malinaw pa ring ang Pariseo ang tinutukoy ng “kanya” dahil siya ang tuwirang naunang pangngalan.
  - severity: low
    issue: Ang talababa b ay naglalarawan sa kainan bilang “pormal,” na hindi tuwirang isinasaad ng Griyego.
    rationale: Mas mainam na ipaliwanag lamang ang nakaugaliang postura sa pagkain noong panahong iyon, nang walang karagdagang antas ng pormalidad.
