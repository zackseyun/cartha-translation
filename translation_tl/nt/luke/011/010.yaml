id: LUK.11.10
reference: Luke 11:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει, καὶ ὁ ζητῶν εὑρίσκει, καὶ τῷ κρούοντι ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/010.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: tl
  text: Sapagkat ang bawat humihingi ay tumatanggap, at ang naghahanap ay nakasusumpong, at ang kumakatok ay pagbubuksan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring gawing tahasan ayon sa konteksto: “bubuksan ang pinto para sa kumakatok.” Hindi binabanggit sa Griyego kung ano ang bubuksan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: ang bawat
  rationale: Ginamit nang distributibo kasama ng pandiwaring ginawang pangngalan; pinananatili ng “ang bawat” ang saklaw na tumutukoy sa bawat taong humihingi.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag na ugnayan ng talatang ito sa naunang panghihikayat.
- source_word: ὁ αἰτῶν
  choice: humihingi
  rationale: Likas na salin ng substantival present participle at nagpapahayag ng pangkalahatan o patuloy na pagkilos.
- source_word: λαμβάνει
  choice: tumatanggap
  rationale: Tumpak at marangal na katumbas sa konteksto ng paghingi at pagtugon.
- source_word: ὁ ζητῶν
  choice: ang naghahanap
  rationale: Pinananatili ang pangkalahatan at nagpapatuloy na diwa ng present participle.
- source_word: εὑρίσκει
  choice: nakasusumpong
  rationale: Tuwirang katumbas na angkop sa maikli at kawikaang tatluhang pahayag; marangal ngunit nauunawaan pa rin sa modernong Filipino.
- source_word: τῷ κρούοντι
  choice: ang kumakatok
  rationale: Sa balangkas na “pagbubuksan,” likas na ipinahahayag sa Filipino ang taong nakikinabang sa kilos kahit hindi ginagaya nang mekanikal ang datibong anyo ng Griyego.
- source_word: ἀνοιγήσεται
  choice: pagbubuksan
  rationale: Pinananatili ang panghinaharap na balintiyak at hindi tahasang dinaragdagan ng “pinto” ang bagay na hindi binanggit sa Griyego.
theological_decisions:
- issue: Saklaw at bisa ng pangkalahatang pangako
  choice: Isinalin bilang isang pangkalahatan at walang idinagdag na pasubaling pahayag.
  alternative: Ituring na pagmamalabis lamang o dagdagan ng kondisyong gaya ng “ang humihingi nang tama.”
  rationale: Walang tahasang kondisyon ang Griyegong pahayag sa konteksto ng pagtuturo tungkol sa panalangin. Dapat panatilihin ng salin ang lawak at teolohikal na tensiyon nito sa halip na lutasin iyon sa pamamagitan ng dagdag na paliwanag.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pagbasa sa Bibliya. Ginamit ang “nakasusumpong” upang mapanatili ang pormal ngunit likas na himig ng magkakatulad na tatlong sugnay; hindi idinagdag sa pangunahing teksto ang ipinahihiwatig na “pinto.”
