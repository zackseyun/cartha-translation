base_translation:
  language: en
  yaml_path: translation/nt/luke/011/007.yaml
  text: and he from inside answers and says, ‘Do not trouble me. The door has already been shut, and my children are with me in bed. I am not able to get up and give you anything.’
translation:
  language: tl
  text: At sumagot siya mula sa loob, “Huwag mo akong gambalain.[a] Nakasara na ang pinto,[b] at kasama ko sa higaan ang mga anak ko.[c] Hindi ako maaaring bumangon at magbigay sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Huwag mo akong abalahin” o “Huwag mo akong patuloy na gambalain.” Literal na tumutukoy ang idyomang Griyego sa pagdudulot ng mga hirap o abala.
    reason: lexical_alternative
  - marker: b
    text: O, “Isinara na ang pinto.” Maaaring idiin ng pandiwang Griyego ang natapos na pagsasara o ang kasalukuyang kalagayang bunga nito.
    reason: lexical_alternative
  - marker: c
    text: Ang “sa higaan” ay tumutukoy dito sa magkakasamang tulugan ng isang sambahayan, hindi sa seksuwal na pakikipagtalik.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ
  choice: At sumagot siya mula sa loob
  rationale: Pinananatili ang pagpapatuloy ng salaysay at ang mahalagang lokasyong ‘mula sa loob.’ Ang ‘sumagot’ ay likas na katumbas sa Filipino ng idyomatikong tambalang ‘sumagot at nagsabi.’
- source_word: Μή μοι κόπους πάρεχε
  choice: Huwag mo akong gambalain
  rationale: Likas at maikli itong Filipino para sa idyomang nangangahulugang huwag magdulot ng abala o hirap sa nagsasalita.
- source_word: ἡ θύρα κέκλεισται
  choice: Nakasara na ang pinto
  rationale: Ipinahahayag ng ‘nakasara na’ ang kasalukuyang kalagayang bunga ng isang natapos na pagsasara, nang hindi ipinapalagay na nakakandado ang pinto.
- source_word: τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν
  choice: kasama ko sa higaan ang mga anak ko
  rationale: Tuwirang inilalarawan ang magkakasamang pahingahan ng sambahayan at hindi dinaragdagan ang teksto ng tiyak na edad ng mga anak.
- source_word: οὐ δύναμαι ἀναστὰς δοῦναί σοι
  choice: Hindi ako makakabangon para magbigay sa iyo
  rationale: Ipinakikita ang pagbangon bilang kinakailangang kilos bago makapagbigay. Hindi nilagyan ng tahasang layon ang ‘magbigay’ sapagkat wala itong nakasaad sa Griyego at malinaw ito mula sa konteksto.
