translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang ‘gambalain,’ ‘nakasara na,’ at ‘higaan’ upang manatiling natural sa pagbasa habang napapanatili ang espasyal at sambahayang detalye ng Griyego.
