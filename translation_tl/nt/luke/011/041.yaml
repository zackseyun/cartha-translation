  text: πλὴν τὰ ἐνόντα δότε ἐλεημοσύνην, καὶ ἰδοὺ πάντα καθαρὰ ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/041.yaml
  text: But give as alms the things that are within[a], and behold, everything is clean for you.
translation:
  language: tl
  text: Ngunit ibigay ninyong limos ang mga bagay na nasa loob[a]; at tingnan ninyo, ang lahat ay malinis para sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ibigay ninyong limos ang anumang mayroon kayo.” Maaaring tumukoy ang pariralang Griyego sa mga bagay na nasa loob o sa mga pag-aaring taglay ng isang tao.
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Sa halip
  rationale: Nagpapakilala ito ng pagtatamang kaibahan sa panlabas na paglilinis na tinalakay bago nito. Mas malinaw sa modernong Tagalog ang “Sa halip” kaysa sa payak na “Ngunit” para sa puwersang ito.
- source_word: τὰ ἐνόντα
  choice: ang mga bagay na nasa loob
  rationale: Pinananatili ang literal at kontekstuwal na ugnayan sa loob ng kopa at pinggan sa talata 39, habang ang alternatibong kahulugang tumutukoy sa mga ari-ariang taglay ay inilalagay sa talababa.
- source_word: δότε
  choice: ipamigay
  rationale: Likas na pautos sa Tagalog na kasama ng “bilang limos.” Ipinahihiwatig nito ang pagbibigay sa iba nang hindi dinaragdagan ang hindi tahasang layon na “mga dukha.”
- source_word: ἐλεημοσύνην
  choice: bilang limos
  rationale: Tuwirang tumutukoy sa mapagkawanggawang pagbibigay at pinananatili ang kayariang “ibigay bilang limos” ng Griyego.
- source_word: ἰδοὺ
  choice: masdan ninyo
  rationale: Pinananatili ang mariing panawag-pansin ng salita sa isang marangal ngunit nauunawaang modernong anyo.
- source_word: πάντα
  choice: ang lahat
  rationale: Likas at komprehensibong katumbas sa Tagalog.
- source_word: καθαρὰ
  choice: malinis
  rationale: Pinananatili ang ugnayan sa usapin ng paglilinis at kadalisayan sa naunang konteksto.
- source_word: ὑμῖν
  choice: para sa inyo
  rationale: Likas na Tagalog para sa datibong tumutukoy sa kalagayan ng lahat kaugnay ng mga kausap.
theological_decisions:
- issue: Kahulugan ng τὰ ἐνόντα kaugnay ng kadalisayan at paglilimos
  choice: “ang mga bagay na nasa loob,” na nagpapanatili ng panloob at moral na diwa
  alternative: “kung ano ang mayroon kayo,” na tumutukoy sa mga ari-ariang taglay
  rationale: Ang agarang konteksto ay naghahambing sa labas at loob ng kopa at pinggan (Lucas 11:39), kaya pinananatili ng pangunahing salin ang retorikal na ugnayang iyon. Gayunman, tunay na posible sa pariralang Griyego ang pagbasa tungkol sa mga pag-aaring nasa kamay, kaya inilalahad ito sa talababa sa halip na alisin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “masdan ninyo” upang mapanatili ang mariing ἰδοὺ, at pinanatili sa talababa ang tunay na leksikal na kalabuan ng τὰ ἐνόντα.
