  text: οὐαὶ ⸀ὑμῖν, ὅτι ἐστὲ ὡς τὰ μνημεῖα τὰ ἄδηλα, καὶ οἱ ἄνθρωποι ⸀οἱ περιπατοῦντες ἐπάνω οὐκ οἴδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/044.yaml
  text: Woe to you, because you are like unmarked tombs, and the men walking over them do not know it.
translation:
  language: tl
  text: Kahabag-habag kayo! Sapagkat para kayong mga libingang hindi nakikita, at ang mga taong lumalakad sa ibabaw ng mga iyon ay hindi nakaaalam nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Kahabag-habag kayo
  rationale: Likas at marangal na pahayag ng matinding kapighatian at hatol; iniiwasan ang masyadong kolokyal na anyo habang pinananatili ang bigat ng οὐαί.
- source_word: τὰ μνημεῖα τὰ ἄδηλα
  choice: mga libingang walang palatandaan
  rationale: Ang ἄδηλα ay mga libingang hindi nakikita o hindi nakikilala bilang libingan; malinaw na ipinahahayag ng salin ang kawalan ng palatandaang makapagbibigay-babala.
- source_word: οἱ ἄνθρωποι οἱ περιπατοῦντες ἐπάνω
  choice: nilalakaran ng mga tao
  rationale: Natural na Tagalog para sa mga taong naglalakad sa ibabaw ng mga libingan; ang 'mga tao' ay angkop sa pangkalahatang ἄνθρωποι at hindi nililimitahan sa kalalakihan.
- source_word: οὐκ οἴδασιν
  choice: nang hindi nila nalalaman
  rationale: 'Pinananatili ang di-tiyak na layon sa Griyego: hindi nila alam na mga libingan ang kanilang nilalakaran.'
theological_decisions:
- issue: Pahiwatig ng ritwal na karumihan mula sa di-nakikilalang libingan
  choice: Hindi tahasang idinagdag sa pangunahing teksto
  alternative: Idagdag na 'kaya nadudungisan sila nang hindi nila nalalaman'
  rationale: Ipinahihiwatig ito ng kontekstong Judio ngunit hindi tahasang sinasabi sa talata; pinananatili ng salin ang tensiyon at hindi nagpapasok ng paliwanag sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, dignified, at madaling maunawaan. Ginamit ang isahang pangungusap upang mapanatili ang ugnayan ng paghahambing at ang di-sinasadyang paglakad sa ibabaw ng mga libingan.
