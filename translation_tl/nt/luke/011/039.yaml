source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος πρὸς αὐτόν· Νῦν ὑμεῖς οἱ Φαρισαῖοι τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος καθαρίζετε, τὸ δὲ ἔσωθεν ὑμῶν γέμει ἁρπαγῆς καὶ πονηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/039.yaml
  text: But the Lord said to him[a], “Now you Pharisees clean the outside of the cup and the dish, but your inside is full of greed and wickedness.”
translation:
  language: tl
  text: Ngunit sinabi sa kanya ng Panginoon, “Ngayon, kayong mga Pariseo, nililinis ninyo ang labas ng tasa at pinggan, ngunit ang nasa loob ninyo ay punô ng kasakiman[a] at kasamaan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pandarambong,” “pang-aagaw,” o “pangingikil.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang titulo sa Bagong Tipan at angkop dito kaysa sa simpleng magalang na tawag na “ginoo.”
- source_word: Νῦν
  choice: Ngayon
  rationale: Pinananatili ang panandang pandiskurso na nagpapasimula sa tuwirang pagsaway ni Jesus.
- source_word: ὑμεῖς οἱ Φαρισαῖοι
  choice: kayong mga Pariseo
  rationale: Likas na Filipino na nagpapanatili sa diin ng tahasang pagtukoy sa mga Pariseo.
- source_word: τὸ ἔξωθεν
  choice: ang labas
  rationale: Tuwiran at karaniwang salin para sa panlabas na bahagi o ibabaw.
- source_word: ποτηρίου
  choice: kopa
  rationale: Malinaw at marangal na katawagan sa sisidlang inuman nang hindi nagdaragdag ng detalye.
- source_word: πίνακος
  choice: pinggan
  rationale: Natural at madaling maunawaang tawag sa sisidlan ng pagkain; hindi nito nililimitahan ang kahulugan sa malaking bandehado.
- source_word: καθαρίζετε
  choice: nililinis ninyo
  rationale: Ipinapahayag ang kasalukuyan o nakagawiang kilos sa natural na Filipino.
- source_word: τὸ δὲ ἔσωθεν ὑμῶν
  choice: ngunit ang kalooban ninyo
  rationale: Ang “kalooban” ay natural na Filipino para sa panloob na pagkatao at pinananatili ang kaibahan sa “labas” nang hindi espesipikong ginagawang puso o isip.
- source_word: γέμει
  choice: ay punô ng
  rationale: Tuwirang katumbas na likas sa Filipino.
- source_word: ἁρπαγῆς
  choice: kasakiman
  rationale: Ipinahahayag ang mapangkamkam na bisyo sa konteksto; pinananatili sa talababa ang mas kongkretong saklaw na pandarambong, pang-aagaw, o pangingikil.
- source_word: πονηρίας
  choice: kasamaan
  rationale: Malawak at mabigat na terminong moral na tumutugma sa saklaw ng salitang Griyego.
theological_decisions:
- issue: Tinutukoy ng metaporang “panloob”
  choice: ang kalooban ninyo
  alternative: ang mga puso ninyo / ang nasa loob ninyo
  rationale: Pinananatili ang pagtutol ng panlabas na kalinisan at panloob na katiwalian, nang hindi itinatakda ang isang partikular na sangkap na sikolohikal gaya ng puso o isip.
- issue: Moral na diwa ng ἁρπαγή
  choice: kasakiman
  alternative: pandarambong / pang-aagaw / pangingikil
  rationale: Sa pangunahing teksto, malinaw na naihahatid ng “kasakiman” ang mapangkamkam na panloob na bisyo; inilalahad sa talababa ang kongkretong dimensiyon ng mapagsamantalang pagkuha.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “kalooban” upang maging natural ang metapora ng panloob na kalagayan; iniwasan ang mas interpretibong “puso” at ang di-likas na “loob ninyo ay punô.”
