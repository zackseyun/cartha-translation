base_translation:
  language: en
  yaml_path: translation/nt/luke/011/012.yaml
  text: Or if he asks for an egg, will he give him a scorpion?
translation:
  language: tl
  text: O kung humingi siya ng itlog, alakdan ba ang ibibigay niya sa kanya?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: O kung
  rationale: Ipinakikilala nito ang kasunod na kaagapay na halimbawa sa serye ng mga retorikal na tanong. Likas sa modernong Tagalog ang “O kung” at hindi na kailangang isalin nang hiwalay ang καί.
- source_word: αἰτήσει
  choice: humingi siya ng
  rationale: Bagaman future indicative ang anyo, gumaganap ito sa isang kondisyunal na retorikal na tanong; natural sa Tagalog ang “kung humingi siya ng.”
- source_word: ᾠόν
  choice: itlog
  rationale: Tuwiran at karaniwang katumbas ng salitang Griyego.
- source_word: ἐπιδώσει
  choice: bibigyan ba
  rationale: Sa konteksto, tumutukoy ito sa pagbibigay bilang tugon sa isang kahilingan. Pinananatili ng “bibigyan ba” ang future force at ang retorikal na tanong.
- source_word: αὐτῷ
  choice: siya
  rationale: Ang dative indirect object ay likas na ipinahahayag sa Tagalog sa pamamagitan ng hulaping -an sa “bibigyan” at ng panghalip na “siya.”
- source_word: σκορπίον
  choice: alakdan
  rationale: Karaniwang katumbas sa Tagalog at pinananatili ang matingkad at absurdong paghahambing sa itlog.
theological_decisions:
- issue: Retorikal na puwersa ng paghahambing tungkol sa ama at anak
  choice: Isinalin bilang tuwirang retorikal na tanong nang walang dagdag na paliwanag.
  alternative: Idagdag ang “sa halip” upang gawing tahasan ang ipinahihiwatig na paghahalili.
  rationale: Hindi tahasang ginagamit sa Griyego ang katumbas ng “sa halip.” Malinaw na sa tanong ang absurdong pagsalungat, kaya pinananatili ang puwersa ng teksto nang walang interpretatibong pagpapalawak.
translation_notes:
  register: Modernong Filipino Tagalog na natural, maikli, at marangal. Ginamit ang “alakdan,” isang malinaw at karaniwang salita, at pinanatili ang maikling anyo ng retorikal na tanong.
