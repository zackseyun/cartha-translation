translation:
  language: tl
  text: Nakaabang sila sa kanya[a] upang makahuli ng anumang salita mula sa kanyang bibig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagmamanman sila laban sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “upang makahuli ng anuman mula sa kanyang bibig,” ibig sabihin, upang may mapanghawakan sila sa anumang sasabihin niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεδρεύοντες
  choice: Inaabangan nila
  rationale: Ipinahihiwatig ng pandiwaring pangmaramihan ang mapanlabang paghihintay na may layuning manilo. Natural sa modernong Tagalog ang “inaabangan nila,” habang inilalagay sa talababa ang mas matinding larawang “nakaabang upang siluin.”
- source_word: αὐτόν
  choice: siya
  rationale: Tumutukoy ang panghalip kay Jesus ayon sa naunang konteksto; pinananatili ang panghalip ng Griyego sa halip na ulitin ang pangalan.
- source_word: θηρεῦσαί
  choice: upang makahuli
  rationale: Pinananatili ng “makahuli” ang metapora ng pangangaso o pagdakip sa θηρεῦσαί, ngunit nauunawaan dito bilang paghahanap ng salitang maaaring gamitin laban kay Jesus.
- source_word: τι
  choice: anumang salita
  rationale: Ang τι ay isang di-tiyak na bagay. Idinagdag ang “salita” upang maging malinaw at natural sa Tagalog ang idyomatikong pagtukoy sa sinabi mula sa bibig.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: lalabas sa kanyang bibig
  rationale: Pinananatili ang kongkretong larawan ng bibig sa Griyego habang gumagamit ng natural na pariralang Tagalog para sa mga salitang sasabihin niya.
