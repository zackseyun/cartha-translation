translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang metapora ng paghuli at ang larawan ng bibig, habang nilinaw sa pangunahing teksto na mga salita ang nais nilang mahuli.
