  text: And when it comes[a], it finds it swept and put in order.
translation:
  language: tl
  text: At nang dumating ito, nadatnan nito ang bahay na nawalis at naayos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nawalis at napalamutian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὸν
  choice: pagdating nito
  rationale: Ang aorist participle ay ginawang temporal na parirala sa likas na Tagalog. Ang “nito” ay tumutukoy sa maruming espiritu sa naunang talata nang hindi ito binibigyan ng kasariang wala sa Griyego.
- source_word: εὑρίσκει
  choice: nadatnan nitong
  rationale: Ang vivid present na εὑρίσκει ay likas na naipapahayag dito sa Tagalog bilang “nadatnan,” na nagsasaad ng kalagayang nakita ng espiritu sa pagbabalik nito.
- source_word: σεσαρωμένον
  choice: nawalis
  rationale: 'Pinananatili ng anyong ito ang resulta ng perfect passive participle: ang bahay ay nasa kalagayang nalinis sa pamamagitan ng pagwawalis. Hindi idinagdag ang “malinis,” na hindi tahasang nasa salita.'
- source_word: κεκοσμημένον
  choice: naayos
  rationale: Sa konteksto ng bahay, ipinahihiwatig ng κοσμέω ang maayos na pagkakaayos o paghahanda. Ang “naayos” ay natural at hindi nililimitahan ang kahulugan sa pandekorasyong pagpapaganda.
theological_decisions:
- issue: Ipinahihiwatig na layon ng εὑρίσκει
  choice: ang bahay
  alternative: iyon
  rationale: Walang tahasang layon sa Griyego, ngunit ang “bahay” ang malinaw na tinutukoy sa konteksto. Ang pagbanggit dito sa Tagalog ay umiiwas sa malabong sunod-sunod na panghalip at hindi nagdaragdag ng bagong pakahulugan.
- issue: Pagpapakatao o kasarian ng maruming espiritu
  choice: nito
  alternative: niya
  rationale: Walang gramatikal na kasarian ang mga panghalip sa Tagalog. Ang “nito” ay malinaw na tumutukoy sa espiritu at hindi nagpapasok ng di-kailangang pagpapakatao o kasarian.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang “nadatnan” at “naayos,” at tahasang ibinalik ang “bahay” para sa natural na daloy. Ang alternatibong kahulugang “napalamutian” ng κεκοσμημένον ay pinanatili sa talababa.
