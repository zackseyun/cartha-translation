  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ἀπὸ αἵματος Ἅβελ ⸀ἕως αἵματος Ζαχαρίου τοῦ ἀπολομένου μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου· ναί, λέγω ὑμῖν, ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/051.yaml
  text: from the blood of Abel to the blood of Zechariah[a], who perished between the altar and the house. Yes, I tell you[b], it will be required from this generation.
translation:
  language: tl
  text: mula sa dugo ni Abel hanggang sa dugo ni Zacarias[a], na nasawi sa pagitan ng altar at ng templo.[b] Oo, sinasabi ko sa inyo, pananagutin ang salinlahing ito para rito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak kung aling Zacarias ang tinutukoy. Kabilang sa mga mungkahi sina Zacarias na anak ni Joiada (2 Cronica 24:20–22) at Zacarias na anak ni Berequias.
    reason: cross_reference
  - marker: b
    text: 'O: “sa pagitan ng altar at ng bahay.” Literal na “bahay” ang salitang Griyego; sa kontekstong ito, tumutukoy ito sa templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ αἵματος Ἅβελ ⸀ἕως αἵματος Ζαχαρίου
  choice: mula sa dugo ni Abel hanggang sa dugo ni Zacarias
  rationale: Pinananatili ang magkatugmang saklaw na “mula…hanggang…” at ang biblikal na gamit ng “dugo” para sa pagpaslang at pananagutan sa pagdanak nito.
- source_word: τοῦ ἀπολομένου
  choice: na pinatay
  rationale: Sa konteksto ng dugong ibinubuhos at ng pagkamatay sa lugar ng Templo, malinaw na marahas na kamatayan ang tinutukoy. Mas natural at malinaw sa Filipino ang “pinatay” kaysa “napahamak,” bagaman hindi tahasang binabanggit ang gumawa.
- source_word: μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου
  choice: sa pagitan ng altar at ng Templo
  rationale: Literal na “bahay” ang οἶκος, ngunit sa kontekstong ito tumutukoy ito sa gusali ng Templo. Ang “Templo” ang natural at malinaw na salin sa Filipino; inilalahad sa talababa ang literal na anyo.
- source_word: ναί, λέγω ὑμῖν
  choice: Oo, sinasabi ko sa inyo
  rationale: Pinananatili ang mariing pagpapatunay ng ναί at ang tuwirang, marangal, at karaniwang anyo ng pahayag.
- source_word: ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης
  choice: pananagutin ang salinlahing ito dahil dito
  rationale: Ang ἐκζητέω sa konteksto ng dugong ibinubo ay may diwang pagsingil o paghingi ng pananagutan. Ang pasibong Griyego ay natural na naihahayag sa Filipino sa “pananagutin,” habang ang “dahil dito” ay tumutukoy sa naunang dugong binanggit nang hindi nagdaragdag ng tahasang tagapaningil.
theological_decisions:
- issue: Pagkakakilanlan ni Zacarias at saklaw ng hatol sa “salinlahing ito”
  choice: Hindi tinutukoy sa pangunahing teksto kung aling Zacarias ang tinutukoy, at pinananatili ang “salinlahing ito” bilang mga taong tuwirang tinutukoy ni Jesus.
  alternative: Kilalanin siya bilang si Zacarias na anak ni Joiada, si Zacarias na anak ni Berequias, o isang kinatawang martir na propeta; palawakin o paliitin ang “salinlahing ito” ayon sa isang sistemang teolohikal.
  rationale: Hindi nagbibigay ang talata ng karagdagang pagkakakilanlan kay Zacarias. Dapat panatilihin ang historikal na kalabuan at ang bigat ng pahayag tungkol sa pananagutan nang hindi ito nilulutas ayon sa isang partikular na doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Templo” para sa kontekstuwal na kahulugan ng οἶκος, at “pananagutin” upang likas na maipahayag ang hudisyal na diwa ng pasibong ἐκζητηθήσεται. Ang lahat ng talababa ay may katugmang marker sa pangunahing teksto.
