  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἄρα ⸂μάρτυρές ἐστε⸃ καὶ συνευδοκεῖτε τοῖς ἔργοις τῶν πατέρων ὑμῶν, ὅτι αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς ὑμεῖς δὲ ⸀οἰκοδομεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/048.yaml
  text: So you are witnesses and approve of the deeds of your fathers[a], because they killed them, but you build their tombs.
translation:
  language: tl
  text: 'Kaya kayo mismo ang mga saksi at sinasang-ayunan ninyo ang mga ginawa ng inyong mga ninuno: sila ang pumatay sa mga propeta, ngunit kayo naman ang nagtatayo ng mga libingan ng mga ito.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga libingan” ay ipinahihiwatig ng naunang talata, na bumabanggit sa mga libingan ng mga propeta; sa Griyego, “ngunit kayo naman ang nagtatayo.”
    reason: cross_reference_and_source_transparency
lexical_decisions:
- source_word: ἄρα
  choice: Kaya
  rationale: Likas na panandang Filipino para sa kongklusyong hinango mula sa naunang paratang.
- source_word: μάρτυρές ἐστε
  choice: kayo mismo ang mga saksi
  rationale: Pinananatili ang nominal na pahayag na 'mga saksi'; ipinahahayag ng 'mismo' ang diin ng ἐστε at ng konteksto na ang kanilang sariling kilos ang nagpapatotoo laban sa kanila.
- source_word: συνευδοκεῖτε
  choice: sinasang-ayunan ninyo
  rationale: Naghahayag ito ng aktibong pagsang-ayon o pagsang-ayon sa moral na bigat ng ginawa, hindi lamang kaalaman tungkol dito.
- source_word: τοῖς ἔργοις τῶν πατέρων ὑμῶν
  choice: ang mga ginawa ng inyong mga ninuno
  rationale: Ang 'mga ginawa' ay natural at tumutukoy sa kongkretong mga gawa; ang 'mga ninuno' ay malinaw sa modernong Filipino at hindi mapagkakamalang agarang mga ama lamang.
- source_word: αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς
  choice: sila ang pumatay sa mga propeta
  rationale: Pinananatili ang diin at paghahambing ng αὐτοὶ μὲν. Nililinaw mula sa agarang konteksto na ang tinutukoy ng panghalip ay ang mga propeta.
- source_word: ὑμεῖς δὲ οἰκοδομεῖτε
  choice: ngunit kayo naman ang nagtatayo ng mga libingan ng mga ito
  rationale: Ang 'ngunit ... naman' ay nagpapanatili ng μὲν...δὲ na pagtutulad at pagtutol. Ang layon ng 'nagtatayo' ay likas na ipinagpapatuloy mula sa talata 47 upang maging kumpleto at malinaw sa Filipino.
theological_decisions:
- issue: Kung tahasang ilalagay ang ipinahiwatig na layon ng οἰκοδομεῖτε
  choice: Isama sa pangunahing teksto ang 'mga libingan ng mga ito.'
  alternative: 'Iwang walang tahasang layon: ''ngunit kayo naman ang nagtatayo.'''
  rationale: Walang nakasulat na layon sa hulíng pandiwa sa Griyego, ngunit malinaw itong ipinagpapatuloy mula sa 'mga libingan ng mga propeta' sa talata 47. Kailangan ng natural na Filipino ang layon upang hindi maging bitin o malabo, habang itinatala sa talababa ang kontekstuwal na pagpuno.
- issue: Pagkakaugnay ng pagpatay ng mga ninuno at pagtatayo ng kasalukuyang salinlahi
  choice: Panatilihin ang tensiyon sa pamamagitan ng 'sila ... ngunit kayo naman.'
  alternative: Ipaliwanag sa teksto na ang pagtatayo ay tuwirang pakikiisa sa pagpatay.
  rationale: Sinasabi ng talata na ang kanilang kilos ay pagsaksi at pagsang-ayon, ngunit hindi na ipinapasok sa salin ang karagdagang paliwanag kung paano ito nangyayari; nananatili ang retorikal at teolohikal na tensiyon ng orihinal.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'mga ninuno' sa halip na literal na 'mga ama' upang malinaw na tumukoy sa mga naunang salinlahi. Ang 'mga ito' ay umiwas sa posibleng kalituhan ng sunod-sunod na 'nila/kanila' at malinaw na tumutukoy sa mga propeta.
