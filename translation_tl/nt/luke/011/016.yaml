id: LUK.11.16
reference: Luke 11:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἕτεροι δὲ πειράζοντες σημεῖον ⸂ἐξ οὐρανοῦ ἐζήτουν παρ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/016.yaml
  text: But others[a], testing him, were seeking from him a sign from heaven.
translation:
  language: tl
  text: Ngunit ang iba naman, upang subukin siya, ay humihingi sa kanya ng isang tanda mula sa langit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang makalangit na tanda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: ang iba naman
  rationale: Ipinakikita ng ἕτεροι ang ibang pangkat na naiiba sa mga naunang nagsalita; natural sa Tagalog ang “ang iba naman.”
- source_word: δὲ
  choice: Ngunit
  rationale: Naghuhudyat ang δέ ng banayad na pagsalungat o paglipat mula sa naunang tugon.
- source_word: πειράζοντες
  choice: upang subukin siya
  rationale: Sa kontekstong mapanlaban, tumutukoy ito sa paglalagay kay Jesus sa pagsubok, hindi lamang sa pagtukso sa kasalanan. Nililinaw ng sugnay ang layunin ng kanilang paghingi.
- source_word: σημεῖον
  choice: isang tanda
  rationale: Pinananatili ng “tanda” ang malawak na kahulugan ng σημεῖον nang hindi tahasang dinaragdagan ng “himala,” bagaman mahimala ang ipinahihiwatig ng konteksto.
- source_word: ἐξ οὐρανοῦ
  choice: mula sa langit
  rationale: Tuwirang ipinahahayag nito ang makalangit na pinagmulan o pagpapatunay ng hinihinging tanda.
- source_word: ἐζήτουν
  choice: humihingi
  rationale: Sa kontekstong ito, ang ζητέω ay tumutukoy sa paghingi o paghingi nang may kahilingan. Ang aspektong di-ganap ng imperfect ay likas na naihahatid ng anyong “humihingi” nang hindi sapilitang dinaragdagan ng “patuloy.”
- source_word: παρ’ αὐτοῦ
  choice: sa kanya
  rationale: Ipinakikita ng παρά na kay Jesus nila hinihingi ang tanda; idiomatiko sa Tagalog ang “humihingi sa kanya.”
theological_decisions:
- issue: Kalikasan ng hinihinging tanda
  choice: isang tanda mula sa langit
  alternative: isang makalangit na tanda
  rationale: Pinananatili ng pangunahing salin ang ideya ng pinagmulan o pagpapatunay mula sa langit, nang hindi tinutukoy nang higit sa sinasabi ng Griyego kung ano mismo ang anyo ng tanda.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “upang subukin siya” para natural na maipahayag ang mapanlabang layunin ng participle, at pinanatili ang “tanda” upang maiwasan ang labis na pagpapakahulugang “himala.”
