  to: Kapag lumabas na ang maruming espiritu mula sa isang tao, dumaraan ito sa mga lugar na walang tubig[a], naghahanap ng kapahingahan, ngunit wala itong matagpuan. Sinasabi nito, “Babalik ako sa bahay ko, na mula rito ako lumabas.”
  rationale: Inayos ang pangwakas na sugnay upang tahasang maipahayag ang direksiyong ‘mula sa’ ng ὅθεν. Inayos din ang pagdurugtong ng paghahanap at hindi pagkakatagpo upang masalamin ang participial na daloy ng Griyego. Walang binagong kahulugang teolohikal o idinagdag na interpretasyon.
