  text: Ὅταν τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ μὴ ⸀εὑρίσκον λέγει· Ὑποστρέψω εἰς τὸν οἶκόν μου ὅθεν ἐξῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/024.yaml
  text: When the unclean spirit has gone out from the man[a], it passes through waterless places seeking rest, and not finding any, it says, ‘I will return to my house, from which I came out.’
translation:
  language: tl
  text: Kapag lumabas na ang maruming espiritu mula sa isang tao, dumaraan ito sa mga lugar na walang tubig[a], naghahanap ng kapahingahan, ngunit wala itong matagpuan. Sinasabi nito, “Babalik ako sa bahay ko, na mula rito ako lumabas.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga tuyong lugar.” Literal sa Griyego, “mga lugar na walang tubig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν
  choice: Kapag
  rationale: Ipinahahayag nito ang isang pangkalahatang kalagayang temporal at natural na katumbas ng ὅταν na may subjunctive.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: ang maruming espiritu
  rationale: Pinananatili ng “marumi” ang diwa ng karumihang moral o ritwal at hindi nito ginagawang isang di-personal na puwersa ang espiritu.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: lumabas na mula sa isang tao
  rationale: Ang “lumabas na” ay angkop sa aspektong ipinahihiwatig ng aorist subjunctive sa sugnay na temporal. Ang “isang tao” ay natural sa Filipino para sa kinatawang pangkalahatang kaso nang hindi nililimitahan ang kahulugan sa isang partikular na lalaki.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: dumaraan ito sa mga lugar na walang tubig
  rationale: Tuwirang pinananatili ang larawan ng paglalakbay sa mga lugar na ἄνυδρος, samantalang malinaw at natural ang pangungusap sa modernong Filipino.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: at naghahanap ng kapahingahan
  rationale: Ipinapakita ang kasabay na kilos ng participle at pinananatili ang tahasang konsepto ng ἀνάπαυσις bilang kapahingahan.
- source_word: καὶ μὴ εὑρίσκον
  choice: Kapag wala itong matagpuan
  rationale: Ang bagay na hindi matagpuan—kapahingahan—ay malinaw mula sa naunang sugnay. Ang bagong pangungusap ay natural sa Filipino habang pinananatili ang lohikal na daloy.
- source_word: λέγει
  choice: sinasabi nito
  rationale: Pinananatili ang kasalukuyang panahunan ng Griyego at ang masiglang paglalahad nito.
- source_word: Ὑποστρέψω εἰς τὸν οἶκόν μου
  choice: Babalik ako sa bahay ko
  rationale: Ang “babalik” ay malinaw na nagpapahayag ng pasiya sa hinaharap, at pinananatili ng “bahay” ang kongkretong talinghaga.
- source_word: ὅθεν ἐξῆλθον
  choice: kung saan ako lumabas
  rationale: Pinananatili ang larawan ng paglabas at ang kaugnayan nito sa naunang ἐξέλθῃ, nang hindi nagiging pilit ang Filipino.
theological_decisions:
- issue: Ang tinutukoy ng “maruming espiritu”
  choice: Isinalin bilang isang personal na maruming espiritu na kumikilos at nagsasalita.
  alternative: Isang talinghaga lamang para sa pagbabalik sa kasalanan o isang di-personal na puwersa.
  rationale: Sa agarang konteksto at sa gamit ng mga Ebanghelyo, ang maruming espiritu ay inilalarawang personal na kumikilos. Hindi dapat alisin ng salin ang katangiang iyon o isara ang posibleng karagdagang talinghagang gamit ng kasabihan.
- issue: Kasarian at pagiging pangkalahatan ng ἀνθρώπου
  choice: “isang tao”
  alternative: “isang lalaki” o “ang tao”
  rationale: Bagaman panlalaking isahan ang anyong Griyego, ginagamit ito rito bilang kinatawang pangkalahatang kaso. Ang “isang tao” ang natural at tumpak na modernong Filipino at hindi nagdaragdag ng partikular na kasariang hindi mahalaga sa punto ng pangungusap.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang konkretong larawan ng “maruming espiritu,” “mga lugar na walang tubig,” at “bahay,” pati ang pag-uulit ng kilos na paglabas at pagbabalik.
