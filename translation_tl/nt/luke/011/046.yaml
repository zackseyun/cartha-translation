source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Καὶ ὑμῖν τοῖς νομικοῖς οὐαί, ὅτι φορτίζετε τοὺς ἀνθρώπους φορτία δυσβάστακτα, καὶ αὐτοὶ ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε τοῖς φορτίοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/046.yaml
  text: But he said[a], “Woe also to you lawyers, because you load people with burdens hard to bear[b], and you yourselves do not touch the burdens with one of your fingers.”
translation:
  language: tl
  text: Sinabi naman niya, “Sa aba rin ninyong mga dalubhasa sa Kautusan[a], sapagkat ipinapapasan ninyo sa mga tao ang mga pasaning mahirap dalhin, ngunit kayo mismo ay ni hindi man lamang humihipo sa mga pasanin kahit ng isa sa inyong mga daliri.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tinutukoy ay mga espesyalista sa Kautusang Judio, hindi mga abogado sa makabagong kahulugan.
    reason: lexical_alternative
  - marker: b
    text: Literal na “ni hindi man lamang humihipo sa mga pasanin ng isa sa inyong mga daliri.” Ipinahihiwatig ng larawan na wala silang ginagawa kahit ng pinakamaliit na pakikibahagi o pagtulong sa mga pasaning ipinapataw nila sa iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομικοῖς
  choice: mga dalubhasa sa Kautusan
  rationale: Tumutukoy ito sa mga taong bihasa sa Kautusang Judio, hindi sa mga abogado sa makabagong sekular na diwa. Tahasang ipinakikilala ng salin ang kanilang tungkulin.
- source_word: οὐαί
  choice: Sa aba
  rationale: Pinananatili nito ang mariing propetikong pahayag ng paghatol, sa halip na gawing simpleng pagpapahayag lamang ng lungkot.
- source_word: φορτίζετε
  choice: pinapasan ninyo
  rationale: Pinananatili ang konkretong larawan ng pagpapataw ng pasan sa mga tao at likas itong kaugnay ng pangngalang “mga pasanin.”
- source_word: ἀνθρώπους
  choice: mga tao
  rationale: Pangkalahatan ang saklaw ng salitang Griyego at hindi lamang tumutukoy sa mga lalaki.
- source_word: φορτία δυσβάστακτα
  choice: mga pasaning mahirap dalhin
  rationale: Ipinapahayag ang bigat at hirap ng pasan nang hindi pinalalabis bilang ganap na imposibleng dalhin.
- source_word: αὐτοὶ
  choice: kayo mismo
  rationale: Inilalantad ang mariing paghahambing sa pagitan ng mga nagpapasan sa iba at ng sarili nilang pagkilos.
- source_word: προσψαύετε
  choice: humihipo
  rationale: Pinananatili ang literal at konkretong larawan ng paghipo, nang hindi agad nililimitahan ang kahulugan sa pagtulong lamang.
- source_word: ἑνὶ τῶν δακτύλων ὑμῶν
  choice: gamit ang kahit isang daliri
  rationale: Likas na idyomang Filipino ito sa kontekstong negatibo at ipinahihiwatig ang kawalan kahit ng pinakamaliit na pagkilos.
- source_word: Καὶ ὑμῖν
  choice: rin ninyo
  rationale: Ipinakikita na ang pahayag ng pagkaaba ay idinaragdag sa naunang tinutuligsa ni Jesus.
theological_decisions:
- issue: Pagkakakilanlan ng νομικοῖς
  choice: Mga dalubhasa sa Kautusan, na tumutukoy sa mga espesyalista sa Kautusang Judio
  alternative: mga abogado; mga tagapagturo ng Kautusan; mga eskriba
  rationale: Iniiwasan ng “mga dalubhasa sa Kautusan” ang makabagong sekular na kahulugan ng “abogado” at hindi rin ipinapantay nang walang sapat na batayan ang νομικοί sa mga eskriba.
- issue: Diwa ng huling sugnay
  choice: Pinanatili ang larawan na hindi nila hinihipo ang mga pasan kahit ng isang daliri
  alternative: hindi man lamang sila tumutulong sa mga pasan; ayaw nilang sundin ang ipinapataw nila
  rationale: Maaaring magpahiwatig ang larawan ng kawalan ng tulong, kawalan ng pakikibahagi, o kapuwa nito. Hindi nilulutas ng salin ang tunay na lawak ng metapora.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang pamilyar na propetikong pariralang “Sa aba” at pinanatili ang konkretong talinghaga ng pasan at daliri. Inilagay ang panandang [a] sa mismong terminong nililinaw nito at ang [b] sa hulihan ng kaugnay na pahayag.
