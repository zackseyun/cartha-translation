  to: Sinabi naman niya, “Sa aba rin ninyong mga dalubhasa sa Kautusan[a], sapagkat ipinapapasan ninyo sa mga tao ang mga pasaning mahirap dalhin, ngunit kayo mismo ay ni hindi man lamang humihipo sa mga pasanin kahit ng isa sa inyong mga daliri.[b]”
