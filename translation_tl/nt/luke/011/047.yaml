  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, ὅτι οἰκοδομεῖτε τὰ μνημεῖα τῶν προφητῶν οἱ δὲ πατέρες ὑμῶν ἀπέκτειναν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/047.yaml
  text: Woe to you[b][a], because you build the tombs of the prophets whom your fathers killed.
translation:
  language: tl
  text: Sa aba ninyo![b] Sapagkat itinatayo ninyo ang mga libingan[a] ng mga propeta, ngunit pinatay sila ng inyong mga ninuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga monumentong panlibingan.” Ang salitang Griyego ay maaaring tumukoy sa mga libingan o sa mga monumentong panlibingan.
    reason: lexical_alternative
  - marker: b
    text: O “Kahabag-habag kayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Kahabag-habag kayo
  rationale: Pinananatili ang bigat ng propetikong paghatol at tuwirang pakikipag-usap; mas natural at marangal sa modernong Filipino kaysa sa literal ngunit di-idiomatikong anyo.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng pahayag ng kapahamakan.
- source_word: οἰκοδομεῖτε
  choice: itinatayo ninyo
  rationale: Likas na salin ng kasalukuyang kilos nang hindi labis na nililimitahan ang aspekto.
- source_word: τὰ μνημεῖα
  choice: ang mga libingan
  rationale: Karaniwang tumutukoy ang salita sa mga libingan o bantayog sa libingan; 'mga libingan' ang pinakamalinaw na pangunahing salin.
- source_word: τῶν προφητῶν
  choice: ng mga propeta
  rationale: Tuwirang ipinahahayag ang kaugnayan ng mga libingan sa mga propeta.
- source_word: οἱ δὲ πατέρες ὑμῶν
  choice: ngunit ang inyong mga ninuno
  rationale: Ipinahihiwatig ng δέ ang paghahambing o pagtutol, samantalang ang 'mga ninuno' ang natural at hindi eksklusibong salin ng πατέρες sa kontekstong pangkasaysayan.
- source_word: ἀπέκτειναν αὐτούς
  choice: ang pumatay sa kanila
  rationale: Direkta at natural na isinasalin ang pagpatay at malinaw na ibinabalik ang panghalip sa mga propeta.
theological_decisions:
- issue: Kung gagawing tahasan ang ipinahihiwatig na pagkukunwari o pakikiisa ng mga tagapagtayo sa kasalanan ng kanilang mga ninuno
  choice: 'Panatilihin ang maigsi at tensiyonadong paghahanay: itinatayo nila ang mga libingan, ngunit pinatay ng kanilang mga ninuno ang mga propeta.'
  alternative: Idagdag na sa pagtatayo nila ay nagpapatotoo sila laban sa kanilang mga ninuno.
  rationale: Hindi pa tahasang binibigyang-kahulugan ng talatang ito ang ugnayan; inilalahad iyon sa kasunod na talata. Kaya hindi ipinapasok rito ang paliwanag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'Kahabag-habag kayo' bilang matimbang na pormula ng propetikong paghatol, at 'mga ninuno' upang natural na ihayag ang ancestral na diwa ng πατέρες.
