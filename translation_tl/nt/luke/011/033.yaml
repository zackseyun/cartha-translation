source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς λύχνον ἅψας εἰς κρύπτην τίθησιν οὐδὲ ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, ἵνα οἱ εἰσπορευόμενοι τὸ ⸀φέγγος βλέπωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/033.yaml
  text: No one[a], after lighting a lamp, puts it in a hidden place or under a basket, but on a lampstand[b], so that those who enter may see the light.
translation:
  language: tl
  text: Walang sinumang nagsisindi ng ilawan at pagkatapos ay inilalagay ito sa tagong lugar[a] o sa ilalim ng sisidlang panukat[b]. Sa halip, inilalagay niya ito sa patungan ng ilawan, upang makita ng mga pumapasok ang liwanag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa silong,” “sa bodega,” o “sa lihim na lugar.” Ang salitang Griyego na κρύπτη ay tumutukoy sa isang tagong lugar at maaari ring tumukoy sa isang imbakan sa ilalim ng lupa.
    reason: lexical_alternative
  - marker: b
    text: 'Griyego μόδιος: isang sisidlang panukat para sa tuyong produkto; tradisyonal na isinasaling “bushel” o “basket na panukat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Walang sinuman
  rationale: Likas at malinaw na katumbas ng panghalip na may pangkalahatang pagtanggi.
- source_word: λύχνον
  choice: ilawan
  rationale: Tumutukoy sa isang nadadalang ilawang de-langis, hindi partikular sa kandila.
- source_word: ἅψας
  choice: matapos magsindi
  rationale: Ipinapakita ng aorist participle na nauna ang pagsisindi sa paglalagay.
- source_word: εἰς κρύπτην
  choice: sa tagong lugar
  rationale: Pinananatili ang diwa ng pagtatago nang hindi nililimitahan ang salita sa isang espesipikong silid o bodega.
- source_word: τίθησιν
  choice: naglalagay
  rationale: Natural na kasalukuyang anyo para sa pangkalahatang pahayag.
- source_word: ὑπὸ τὸν μόδιον
  choice: sa ilalim ng takalan
  rationale: Ang μόδιος ay sisidlang ginagamit sa pagsukat ng tuyong produkto; pinananatili ng “takalan” ang tungkuling iyon nang hindi gumagamit ng banyagang sukat na “bushel.”
- source_word: ἐπὶ τὴν λυχνίαν
  choice: sa patungan ng ilawan
  rationale: Malinaw na inilalarawan ang patungang sadyang pinaglalagyan ng ilawan.
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili ang layuning ipinahahayag ng sugnay.
- source_word: οἱ εἰσπορευόμενοι
  choice: mga pumapasok
  rationale: Natural at maikli para sa substantival present participle na tumutukoy sa mga taong pumapasok.
- source_word: τὸ φέγγος
  choice: ang liwanag
  rationale: Pinakamalinaw na katumbas sa konkretong larawan ng ilawan, habang saklaw rin ang kahulugang ningning o liwanag.
- source_word: βλέπωσιν
  choice: makita
  rationale: Sa sugnay na may “upang,” ipinapahayag nito ang nilalayong bunga nang natural sa Tagalog.
theological_decisions:
- issue: Saklaw ng kahulugan ng κρύπτη
  choice: tagong lugar
  alternative: silong, bodega, o lihim na lugar
  rationale: Ang diin ng kasabihan ay ang di-makatuwirang pagtatago ng liwanag, hindi ang tiyak na anyo ng lugar; pinananatili ng mas malawak na salin ang larawan at ang leksikal na puwang.
- issue: Paglalarawan sa μόδιος
  choice: takalan
  alternative: basket, basket na panukat, o bushel
  rationale: Ipinahihiwatig ng salita ang isang sisidlang panukat. Ang “takalan” ay tumpak sa tungkulin nito at iniiwasang ipalit ang espesipikong sukat na Ingles na “bushel”; nililinaw sa talababa ang bagay na tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ilawan” at “patungan ng ilawan” upang manatiling madaling maunawaan ang sinaunang larawan; ginamit ang “takalan” para mapanatili ang katangiang panukat ng μόδιος, na nilinaw sa talababa.
