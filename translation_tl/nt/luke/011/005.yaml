  text: And he said to them[a], “Which of you who has a friend will go to him at midnight and say to him, ‘Friend, lend me three loaves,’”
translation:
  language: tl
  text: At sinabi niya sa kanila[a], “Sino sa inyo ang may kaibigan at pupunta sa kanya sa hatinggabi at magsasabi sa kanya, ‘Kaibigan, pahiram mo ako ng tatlong tinapay,’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gumagamit ang Griyego ng mga pandiwang panghinaharap sa retorikal na tanong, kabilang ang pandiwang isinaling “may.” Mas natural sa Filipino ang kasalukuyang “may” sa unang pandiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἐξ ὑμῶν
  choice: Sino sa inyo
  rationale: Natural na pambungad sa isang retorikal na tanong sa Filipino at tuwirang hinahamon ang mga nakikinig.
- source_word: ἕξει
  choice: ang may
  rationale: Bagaman nasa anyong panghinaharap ang Griyego, mas natural sa Filipino ang pangkasalukuyang “may” sa paglalahad ng sitwasyong ipinapalagay ng retorikal na tanong; itinala sa talababa ang anyong panghinaharap.
- source_word: φίλον / Φίλε
  choice: kaibigan / Kaibigan
  rationale: Pinananatili ang pag-uulit ng iisang salita sa salaysay at sa tuwirang pagtawag.
- source_word: πορεύσεται πρὸς αὐτόν
  choice: pupunta sa kanya
  rationale: Payak at natural na katumbas ng kilos patungo sa kaibigan, nang walang idinagdag na diwa.
- source_word: μεσονυκτίου
  choice: sa hatinggabi
  rationale: Tuwirang katumbas ng panahong tinutukoy ng adverbiyal na genitive.
- source_word: εἴπῃ αὐτῷ
  choice: magsasabi sa kanya
  rationale: Pinananatili ang kilos ng pagsasalita at umaayon sa panghinaharap na daloy ng retorikal na tanong.
- source_word: χρῆσόν μοι
  choice: pahiram mo ako
  rationale: Natural na pakiusap sa Filipino para sa pansamantalang pagbibigay na ipinahihiwatig ng pandiwa.
- source_word: τρεῖς ἄρτους
  choice: tatlong tinapay
  rationale: Karaniwang paraan sa Filipino ng pagbibilang ng mga tinapay; iniiwasan ang “piraso,” na maaaring magpahiwatig lamang ng mga hiwa o tipak.
