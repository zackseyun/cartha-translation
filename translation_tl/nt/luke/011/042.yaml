review_pass:
  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing kahulugan: ang babala sa mga Pariseo, ang pagbibigay nila ng ikasampung bahagi ng maliliit na halaman, ang pagliban nila sa katarungan at sa pag-ibig ng Diyos, at ang panawagang huwag pabayaan ang alinmang hanay ng tungkulin. Gayunman, ang δεύτεροng pangatnig na καί ay payak na pagdurugtong, hindi malinaw na kasalungat; kaya ang “ngunit nilalampasan” ay dapat “at nilalampasan.”'
  naturalness: Likas at angkop sa modernong Filipino ang “mga Pariseo,” “yerbabuena,” “ruda,” “katarungan,” at “pag-ibig ng Diyos.” Ang “kahabag-habag kayo” ay mas matatag na pampanitikan ngunit nauunawaang pagpapahayag ng mariing οὐαί kaysa “kaawa-awa kayo,” na maaaring marinig lamang bilang simpleng pagkahabag.
  terminology: Ang “pag-ibig ng Diyos” ay wastong pinananatili ang saklaw ng genitive na τοῦ θεοῦ. Ang “ikasampung bahagi” ay malinaw na salin ng pag-iikapu. Ang “halamang-gulay” ay katanggap-tanggap para sa malawak na λάχανον sa talatang ito.
  issues:
