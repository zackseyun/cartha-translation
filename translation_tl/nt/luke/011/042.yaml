id: LUK.11.42
reference: Luke 11:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀλλὰ οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον, καὶ παρέρχεσθε τὴν κρίσιν καὶ τὴν ἀγάπην τοῦ θεοῦ· ταῦτα ⸀δὲ ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀παρεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/042.yaml
  text: But woe to you Pharisees, because you tithe mint and rue and every herb, and you pass by justice and the love of God. These things you ought to have done, without neglecting those things.
translation:
  language: tl
  text: Ngunit kahabag-habag kayo, mga Pariseo! Sapagkat nagbibigay kayo ng ikasampung bahagi ng yerbabuena, ruda, at lahat ng uri ng halamang-gulay, at nilalampasan ninyo ang katarungan at ang pag-ibig ng Diyos. Dapat ninyong gawin ang mga ito nang hindi pinababayaan ang mga iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: kaawa-awa kayo
  rationale: Ipinahahayag ang mariing babala at kapahamakan ng οὐαί sa likas at dignified na Filipino, hindi lamang simpleng pagkahabag.
- source_word: ἀποδεκατοῦτε
  choice: nagbibigay kayo ng ikasampung bahagi
  rationale: Malinaw sa karaniwang mambabasa at tumpak sa gawaing pagbibigay ng ikapu.
- source_word: ἡδύοσμον
  choice: yerbabuena
  rationale: Karaniwang katawagang Filipino sa mint at madaling makilala ng modernong mambabasa.
- source_word: πήγανον
  choice: ruda
  rationale: Tiyak na pangalan sa Filipino ng halamang rue.
- source_word: πᾶν λάχανον
  choice: lahat ng uri ng halamang-gulay
  rationale: Sinasaklaw ang malawak na kahulugan ng λάχανον dito bilang mga halamang itinatanim o ginagamit na pagkain, hindi lamang repolyo.
- source_word: παρέρχεσθε
  choice: nilalampasan ninyo
  rationale: Pinananatili ang kongkretong larawan ng pagdaan nang hindi pinapansin, alinsunod sa source at sa audited consultation layer.
- source_word: κρίσιν
  choice: katarungan
  rationale: Sa konteksto ng etikal na tungkulin, tumutukoy ito sa makatarungang paghatol at pagkilos.
- source_word: ἀγάπην τοῦ θεοῦ
  choice: pag-ibig ng Diyos
  rationale: 'Pinananatili ang genitive ambiguity: maaaring pag-ibig sa Diyos o pag-ibig na nagmumula o nauukol sa Diyos.'
- source_word: ταῦτα ... κἀκεῖνα
  choice: ang mga ito ... ang mga iyon
  rationale: Pinananatili ang deiktikong kaibhan ng Griyego at ang ugnayan sa dalawang hanay ng tungkulin.
theological_decisions:
- issue: Kahulugan ng “pag-ibig ng Diyos”
  choice: pag-ibig ng Diyos
  alternative: pag-ibig sa Diyos
  rationale: Hindi nilulutas nang tahasan ang genitive construction τοῦ θεοῦ; pinananatili ng salin ang tunay na posibleng saklaw nito.
- issue: Ugnayan ng katarungan at pag-ibig sa pagbibigay ng ikapu
  choice: Dapat ninyong gawin ang mga ito nang hindi pinababayaan ang mga iyon
  alternative: Ang katarungan at pag-ibig lamang ang dapat gawin sa halip na ang pagbibigay ng ikapu
  rationale: Ipinahahayag ng talata na dapat gawin ang unang binanggit na mahahalagang tungkulin nang hindi isinasantabi ang ikalawa; hindi pinagtatapat ang dalawa bilang magkalabang pagpipilian.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “mga Pariseo,” “ikasampung bahagi,” at mga kilalang pangalan ng halaman; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
