revisions:
- from: Ngunit kaawa-awa kayo, mga Pariseo! Sapagkat nagbibigay kayo ng ikasampung bahagi ng yerbabuena, ruda, at lahat ng uri ng halamang-gulay, ngunit nilalampasan ninyo ang katarungan at ang pag-ibig ng Diyos. Dapat ninyong gawin ang mga ito nang hindi pinababayaan ang mga iyon.
  to: Ngunit kahabag-habag kayo, mga Pariseo! Sapagkat nagbibigay kayo ng ikasampung bahagi ng yerbabuena, ruda, at lahat ng uri ng halamang-gulay, at nilalampasan ninyo ang katarungan at ang pag-ibig ng Diyos. Dapat ninyong gawin ang mga ito nang hindi pinababayaan ang mga iyon.
  rationale: Pinalitan ang pangalawang “ngunit” ng “at” upang maipakita ang καί ng pinagmulan, at pinatibay ang katumbas ng οὐαί sa “kahabag-habag kayo.” Pinanatili ang deiktikong “mga ito ... mga iyon,” ang hindi nilulutas na “pag-ibig ng Diyos,” at ang kahulugang parehong dapat isagawa ang katarungan at pag-ibig habang hindi pinababayaan ang pagbibigay ng ikapu.
  reviewer_model: gpt-5.6-terra
