    issue: Ang “ngunit” bago ang “nilalampasan ninyo” ay hindi tumutugma sa payak na καί ng Griyego.
    rationale: 'Ang sugnay ay nagdaragdag ng ikalawang pagsasakdal: nagbibigay sila ng ikapu sa mga halaman at nilalampasan nila ang katarungan at pag-ibig. Ang “at” ang mas tapat na pangatnig.'
  - severity: low
    issue: Ang “kaawa-awa kayo” ay maaaring kulang sa bigat ng οὐαί.
    rationale: Ang οὐαί ay isang mariing pahayag ng kapahamakan/babala. Ang “kahabag-habag kayo” ay mas angkop na dignified na katumbas sa Filipino nang hindi nagpapataw ng karagdagang interpretasyon.
  revised_text: Ngunit kahabag-habag kayo, mga Pariseo! Sapagkat nagbibigay kayo ng ikasampung bahagi ng yerbabuena, ruda, at lahat ng uri ng halamang-gulay, at nilalampasan ninyo ang katarungan at ang pag-ibig ng Diyos. Dapat ninyong gawin ang mga ito nang hindi pinababayaan ang mga iyon.
