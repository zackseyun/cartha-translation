base_translation:
  language: en
  yaml_path: translation/nt/luke/011/004.yaml
  text: And forgive us our sins[a], for we ourselves also forgive everyone indebted to us[c][b]. And do not bring us into temptation.
translation:
  language: tl
  text: At patawarin mo kami sa aming mga kasalanan, sapagkat kami rin mismo ay nagpapatawad sa bawat may pagkakautang sa amin.[a] At huwag mo kaming dalhin sa tukso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa bawat may utang sa amin.” Wika ng pagkakautang ang ginamit sa Griyego rito, bagaman “mga kasalanan” ang nasa unang sugnay.
    reason: lexical_alternative
  - marker: b
    text: O “pagsubok.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἄφες
  choice: patawarin mo
  rationale: Sa konteksto ng panalangin, ang pautos na anyo ng ἀφίημι ay likas na tumutukoy sa pagpapatawad. Ang “patawarin mo” ay tuwiran, natural, at nagpapanatili sa pakikiusap sa Diyos.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: ang aming mga kasalanan
  rationale: Tahasang “mga kasalanan” ang sinasabi ng ἁμαρτίας, hindi “mga utang.” Pinananatili nito ang pagkakaiba sa wikang pagkakautang sa kasunod na sugnay.
- source_word: καὶ γὰρ
  choice: sapagkat
  rationale: Ipinakikilala ng parirala ang batayan ng naunang kahilingan. Ang “sapagkat” ay malinaw at marangal sa makabagong Tagalog; ang diwa ng καί ay naipapakita kasama ng “rin” sa kasunod na parirala.
- source_word: αὐτοὶ
  choice: kami rin mismo
  rationale: Binibigyang-diin ng αὐτοὶ ang gumagawa ng kilos. Ang “mismo” ang nagpapanatili sa diin, at ang “rin” ang naghahayag ng kasamang diwa ng καί.
- source_word: ἀφίομεν
  choice: ay nagpapatawad
  rationale: Ang kasalukuyang anyong “nagpapatawad” ay nagpapakita ng patuloy o kinagawiang kilos at pinananatili ang ugnayang leksikal sa “patawarin” sa unang sugnay.
- source_word: παντὶ ὀφείλοντι ἡμῖν
  choice: sa bawat may pagkakautang sa amin
  rationale: Pinananatili ng “may pagkakautang” ang malinaw na wika ng pagkakautang sa ὀφείλοντι nang hindi agad nilalapatan ng tanging pinansiyal o espirituwal na kahulugan.
- source_word: μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν
  choice: huwag mo kaming dalhin sa tukso
  rationale: Ang “dalhin” ay malapit sa literal na diwa ng εἰσφέρω na “magdala papasok/sa,” habang natural pa rin sa Tagalog. Ang “tukso” ang pangunahing salin ng πειρασμός dito, at inilalagay sa talababa ang posibleng diwang “pagsubok.”
theological_decisions:
- issue: Ang kahulugan ng huling kahilingan tungkol sa πειρασμός at ang kaugnayan ng Diyos sa tukso o pagsubok
  choice: huwag mo kaming dalhin sa tukso
  alternative: huwag mo kaming dalhin sa pagsubok
  rationale: Pinananatili ng salin ang mismong anyo at teolohikal na tensiyon ng Griyego sa halip na paliwanagin o palambutin ito sa pangunahing teksto. Ang mas malawak na leksikal na posibilidad na “pagsubok” ay inilalahad sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog para sa karaniwang mambabasa. Ginamit ang “sapagkat” upang mapanatili ang pormal ngunit natural na himig ng panalangin, at iniwasang lutasin sa salin ang tunay na teolohikal na tensiyon ng huling kahilingan.
