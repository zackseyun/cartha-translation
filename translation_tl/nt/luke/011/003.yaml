translation:
  language: tl
  text: Ibigay mo sa amin araw-araw ang aming pang-araw-araw na tinapay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “tinapay para sa darating na araw,” “tinapay na kailangan upang mabuhay,” o, bagaman hindi gaanong malamang dito, “tinapay na higit sa karaniwang sustansiya.” Bihira at pinagtatalunan ang kahulugan ng pang-uring Griyego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον
  choice: tinapay
  rationale: Tuwirang katumbas ng pangngalan; napapanatili nito ang konkretong larawan at tradisyonal na lakas ng panalangin, habang maaari ring tumukoy sa pangunahing ikabubuhay.
- source_word: ἡμῶν
  choice: na kailangan namin
  rationale: Ang pagmamay-aring diwa ng ἡμῶν ay likas na naiuugnay sa pangangailangan ng nagsasalitang pangkat sa Filipino; kasama ng ἐπιούσιον, iniiwasan nito ang di-likas na pariralang 'aming pang-araw-araw na tinapay.'
- source_word: ἐπιούσιον
  choice: na kailangan namin sa araw-araw
  rationale: Bihira at pinagtatalunang salita ito. Ipinahahayag ng salin ang malamang na diwa ng kinakailangang regular na panustos, ngunit inilalahad sa talababa ang ibang posibleng pakahulugan.
- source_word: δίδου
  choice: Ibigay mo
  rationale: Likas na pakiusap sa modernong Filipino. Bagaman maaaring magpahiwatig ng nagpapatuloy o paulit-ulit na pagbibigay ang pangkasalukuyang pautos, malinaw na naihahatid iyon ng 'bawat araw.'
- source_word: ἡμῖν
  choice: sa amin
  rationale: Tuwirang di-tahasang layon ng pandiwang 'ibigay.'
- source_word: τὸ καθ’ ἡμέραν
  choice: bawat araw
  rationale: Malinaw na pinananatili ang diin ni Lucas sa paulit-ulit na araw-araw na pagtitiwala at paglalaan.
theological_decisions:
- issue: Kahulugan ng ἐπιούσιον sa Panalangin ng Panginoon
  choice: kailangan namin sa araw-araw
  alternative: para sa darating na araw; kailangan upang mabuhay; higit sa likas na tinapay
  rationale: Dahil idinagdag ni Lucas ang τὸ καθ’ ἡμέραν, malakas ang konteksto para sa karaniwang araw-araw na panustos. Gayunman, hindi tiyak ang bihirang pang-uri, kaya pinananatili sa talababa ang tunay na leksikal at teolohikal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Ibigay mo' bilang likas na anyo ng tuwirang panalangin at pinanatili ang 'tinapay' sa halip na palawakin agad bilang 'pagkain' o 'ikabubuhay.'
