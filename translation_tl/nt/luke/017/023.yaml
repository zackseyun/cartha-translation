  text: καὶ ἐροῦσιν ὑμῖν· Ἰδοὺ ⸂ἐκεῖ· Ἰδοὺ ὧδε⸃· μὴ ἀπέλθητε μηδὲ διώξητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/023.yaml
  text: And they will say to you[a], ‘Look, there!’ or ‘Look, here!’ Do not go away or run after them.
translation:
  language: tl
  text: At sasabihin nila sa inyo, “Tingnan ninyo, naroon!” o “Tingnan ninyo, narito!” Huwag kayong umalis ni humabol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Huwag kayong umalis ni tumugis.” Hindi tahasang sinasabi sa Griyego kung sino o ano ang hahabulin o tutugisin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐροῦσιν
  choice: sasabihin nila
  rationale: Ang hinaharap na anyo ng λέγω ay tuwirang ipinapahayag bilang “sasabihin nila,” na angkop sa pagpapakilala ng tuwirang sipi.
- source_word: Ἰδοὺ
  choice: Tingnan ninyo
  rationale: Isa itong panawag-pansin na may deiktikong puwersa. Natural ito sa modernong Filipino at mas malinaw kaysa sa makalumang “Narito.”
- source_word: ἐκεῖ / ὧδε
  choice: naroon / narito
  rationale: Pinananatili ng magkatapat na salitang ito ang maikli at malinaw na pagkakaiba ng malayo at malapit na lugar.
- source_word: μὴ ἀπέλθητε
  choice: Huwag kayong pumunta roon
  rationale: Sa konteksto ng pagtuturo sa isang diumano'y kinaroroonan, natural na ipinahihiwatig ng ἀπέρχομαι ang pagpunta bilang tugon sa pahayag. Ang “roon” ay ginagawang malinaw sa Filipino ang kontekstuwal na direksiyon.
- source_word: μηδὲ διώξητε
  choice: ni humabol
  rationale: Maaaring mangahulugan ang διώκω na humabol o tumugis. Ang “humabol” ay natural at pinananatiling walang tahasang layon ang pandiwa, gaya ng Griyego.
theological_decisions:
- issue: Kung lalagyan ng tahasang layon ang διώξητε
  choice: 'Panatilihing walang tahasang layon: “ni humabol”'
  alternative: “ni humabol sa kanila”
  rationale: Hindi tinutukoy ng Griyego ang layon ng paghabol. Nauunawaan ang babala mula sa konteksto, kaya hindi kailangang ipasya kung ang tinutukoy ay ang mga nagsasalita, mga nag-aangkin, o ang iniulat na pagpapakita.
- issue: Kung paano ihahayag ang dalawang deiktikong sigaw
  choice: “Tingnan ninyo, naroon!” o “Tingnan ninyo, narito!”
  alternative: “Naroon siya!” o “Narito siya!”
  rationale: Hindi tahasang binabanggit sa talata ang panghalip na “siya.” Pinananatili ng salin ang maigsi at pahiwatig na anyo ng Griyego nang hindi nagdaragdag ng tahasang paksa.
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang maramihang “ninyo/kayo” upang katawanin ang ὑμῖν at ang maramihang mga pandiwa. Ang panandang [a] ay inilagay pagkatapos ng buong pagbabawal na saklaw ng tala.
