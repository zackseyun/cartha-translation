  naturalness: Ang “Tingnan ninyo, narito!” ay nauunawaan ngunit medyo mabigat; mas likas ang tuwirang “Narito!” sa siping panawag-pansin. Ang pares na “Narito!” at “Naroon!” ay mas malinaw na naghihiwalay sa “here” at “there” kaysa “narito/nariyan.” Ang “Sapagkat, narito,” ay marangal ngunit natural na paraan upang katawanin ang ἰδοὺ γάρ nang hindi inuulit ang “tingnan ninyo.”
  terminology: Ang “kaharian ng Diyos” ay wasto, malinaw, at angkop na panatilihin. Ang “nasa gitna ninyo” ay isang makatuwirang pangunahing salin para sa maramihang ὑμῶν sa kontekstong ito. Dapat manatili ang talababa para sa leksikal na posibilidad ng “nasa loob ninyo,” nang hindi ipinipilit ang isang doktrinal na pagbasa.
