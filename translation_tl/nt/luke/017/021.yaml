base_translation:
  language: en
  yaml_path: translation/nt/luke/017/021.yaml
  text: Nor will they say[a], ‘Look, here!’ or ‘There!’ For behold, the kingdom of God is in your midst.”
translation:
  language: tl
  text: Hindi rin nila sasabihin, “Narito!” o “Naroon!” Sapagkat, narito, ang kaharian ng Diyos ay nasa gitna ninyo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nasa loob ninyo.” Ang pariralang Griyego ay maaaring mangahulugang nasa loob ninyo o nasa gitna ninyo/bilang bahagi ng inyong pangkat.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ ἐροῦσιν
  choice: Hindi rin nila sasabihin
  rationale: Likas na ipinagpapatuloy sa Tagalog ang naunang pagtanggi at pinananatili ang panghinaharap na anyo ng ἐροῦσιν.
- source_word: Ἰδοὺ ὧδε ἤ· Ἐκεῖ
  choice: “Tingnan ninyo, narito!” o “Nariyan!”
  rationale: Ang “tingnan ninyo” ay likas na panawag-pansin, samantalang pinananatili ng “narito” at “nariyan” ang magkatapat na pagtukoy sa lokasyon.
- source_word: ἰδοὺ γὰρ
  choice: Sapagkat masdan ninyo
  rationale: Ipinakikita ng “sapagkat” ang paliwanag na ugnayan ng γάρ; ang “masdan ninyo” ay marangal ngunit nauunawaang panawag-pansin at iniiwasan ang paulit-ulit na “tingnan.”
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Karaniwan at malinaw na salin na nagpapanatili kapuwa sa paghahari at sa kahariang eskatolohikal nang hindi nililimitahan sa isa lamang.
- source_word: ἐντὸς ὑμῶν
  choice: nasa gitna ninyo
  rationale: Ang maramihang ὑμῶν at ang konteksto ng pagtukoy sa isang lokasyon ay pumapabor sa korporatibong diwang presensiya sa gitna ng kausap; pinananatili sa talababa ang tunay na posibleng diwang panloob.
- source_word: ἐστιν
  choice: ay nasa
  rationale: Likas na Tagalog na paglalahad ng kasalukuyang pag-iral o presensiya kasama ng pariralang panlunan.
theological_decisions:
- issue: Kahulugan ng ἐντὸς ὑμῶν
  choice: ang kaharian ng Diyos ay nasa gitna ninyo
  alternative: ang kaharian ng Diyos ay nasa loob ninyo
  rationale: Mas angkop sa maramihang kausap at sa konteksto ang korporatibong pagbasa, ngunit maaari ring ipakahulugan ang Griyego sa panloob na diwa. Hindi inaalis ang tensiyong ito; inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “masdan ninyo” para sa ikalawang ἰδού upang mapanatili ang diin at maiwasan ang αwkward na pag-uulit ng “tingnan,” habang nananatiling madaling maunawaan.
