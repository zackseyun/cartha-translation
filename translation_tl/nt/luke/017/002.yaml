  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λυσιτελεῖ αὐτῷ εἰ ⸂λίθος μυλικὸς⸃ περίκειται περὶ τὸν τράχηλον αὐτοῦ καὶ ἔρριπται εἰς τὴν θάλασσαν ἢ ἵνα σκανδαλίσῃ ⸂τῶν μικρῶν τούτων ἕνα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/002.yaml
  text: It would be better for him if a millstone were hung around his neck and he were thrown into the sea than that he should cause one of these little ones to stumble[a][b].
translation:
  language: tl
  text: Mas mabuti pa para sa kanya kung itinali sa kanyang leeg ang isang gilingang-bato[a] at inihagis siya sa dagat kaysa magpatisod siya sa isa sa mga maliliit na ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tiyak, “isang malaking gilingang-bato.” Maaaring tumukoy ang pariralang Griyego sa mas mabigat na batong ginagamit sa gilingan.
    reason: lexical_alternative
  - marker: b
    text: O, “magdulot ng pagkakasala sa isa sa mga maliliit na ito.” Saklaw ng pandiwang Griyego ang pag-akay sa isang tao tungo sa kasalanan o espirituwal na kapahamakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυσιτελεῖ
  choice: Mas mabuti pa sa kanya
  rationale: Likas na ekspresyong Filipino na naghahayag na ang unang kalagayan ay higit na mainam kaysa sa kasunod na mas masamang gawain.
- source_word: λίθος μυλικὸς
  choice: isang gilingang-bato
  rationale: Tuwirang tumutukoy sa batong ginagamit sa paggiling; pinananatili sa talababa ang posibleng diin sa mas mabigat o malaking uri nito.
- source_word: περίκειται περὶ τὸν τράχηλον αὐτοῦ
  choice: bitinan siya ... sa leeg
  rationale: Natural na pasibong pahayag sa Filipino para sa kalagayang inilalarawan ng Griyego.
- source_word: ἔρριπται εἰς τὴν θάλασσαν
  choice: itapon sa dagat
  rationale: Malinaw at likas na salin ng pasibong kilos na ang tao ay inihagis sa dagat.
- source_word: σκανδαλίσῃ
  choice: maging dahilan ... ng pagkatisod
  rationale: Pinananatili ang metapora ng pagkatisod, na sa konteksto ay tumutukoy sa pag-akay sa kasalanan o espirituwal na kapahamakan.
- source_word: τῶν μικρῶν τούτων ἕνα
  choice: isa sa maliliit na ito
  rationale: Hindi nililimitahan ang tinutukoy sa mga bata lamang o sa mga alagad lamang, alinsunod sa lawak at tunay na kalabuan ng Griyego.
- source_word: ἢ ἵνα
  choice: kaysa
  rationale: Natural na naghahayag ng paghahambing sa pagitan ng dalawang kahihinatnan.
theological_decisions:
- issue: Ang tinutukoy ng “maliliit na ito”
  choice: maliliit na ito
  alternative: mga batang ito; mga hamak na mananampalataya o alagad na ito
  rationale: Hindi tahasang nililinaw ng talata kung mga bata lamang o isang mas malawak na pangkat ang tinutukoy, kaya pinananatili ng salin ang kalabuan.
- issue: Saklaw ng σκανδαλίσῃ
  choice: maging dahilan ... ng pagkatisod
  alternative: maging dahilan ... ng pagkakasala
  rationale: Pinananatili ng pangunahing teksto ang larawan ng pagkatisod habang nililinaw sa talababa na kasama rito ang pag-akay sa kasalanan o espirituwal na kapahamakan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang metapora ng pagkatisod at ang hindi tiyak na pagkakakilanlan ng “maliliit na ito.”
