    rationale: Bagaman may ugnay ito sa metapora ng pagkatisod, hindi ito ang pinakakaraniwang paraan upang tukuyin ang mga bagay na nagpapatisod sa tao. Ang “mga bagay na nakapagpapatisod” ay malinaw, natural, at pinananatili ang lawak ng σκάνδαλα.
