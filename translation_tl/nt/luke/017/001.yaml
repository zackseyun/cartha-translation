  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς ⸀αὐτοῦ· Ἀνένδεκτόν ἐστιν τοῦ ⸂τὰ σκάνδαλα μὴ ἐλθεῖν⸃, ⸂πλὴν οὐαὶ⸃ δι’ οὗ ἔρχεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/001.yaml
  text: Then he said to his disciples[a], “It is impossible for stumbling blocks not to come, but woe to the one through whom they come.”
translation:
  language: tl
  text: Sinabi naman niya sa kanyang mga alagad, “Hindi maaaring hindi dumating ang mga bagay na nakapagpapatisod[a], ngunit aba sa taong sa pamamagitan niya ay dumarating ang mga ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga sanhi ng pagkakasala,” “mga tukso tungo sa pagkakasala,” o “mga katitisuran.” Ang Griyegong σκάνδαλα ay tumutukoy sa mga bagay na nagiging sanhi ng pagbagsak ng tao sa moral o espirituwal na paraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Sinabi naman niya
  rationale: Ang δέ ay banayad na pang-ugnay. Likas sa salaysay ang “naman” at hindi nito pinalalakas nang labis ang pagsalungat o pagkakasunod-sunod ng oras.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: sa kanyang mga alagad
  rationale: Isinasama ang tahasang possessive na αὐτοῦ, at “mga alagad” ang karaniwang salin ng μαθηταί sa kontekstong ito.
- source_word: Ἀνένδεκτόν ἐστιν
  choice: Hindi maaaring
  rationale: Pinananatili nito ang diwa ng imposibilidad sa Griyego at, kasama ng kasunod na “hindi dumating,” ang anyo ng pahayag na imposibleng hindi mangyari ang mga katitisuran.
- source_word: τοῦ τὰ σκάνδαλα μὴ ἐλθεῖν
  choice: hindi dumating ang mga katitisuran
  rationale: 'Inilalahad ng articular infinitive na may μή ang bagay na imposible: ang hindi pagdating ng mga σκάνδαλα. Pinananatili rin ang pandiwang larawan ng ‘pagdating.’'
- source_word: σκάνδαλα
  choice: mga katitisuran
  rationale: Pinananatili ng “mga katitisuran” ang konkretong talinghaga ng isang bagay na nagpapatisod, habang saklaw pa rin ang mga sanhi ng kasalanan, tukso, o espirituwal na pagbagsak.
- source_word: πλὴν οὐαὶ
  choice: ngunit kahabag-habag
  rationale: Ang “ngunit” ay malinaw na naghuhudyat ng pagliko mula sa di-maiiwasang pagdating ng mga katitisuran tungo sa matinding babala laban sa taong pinagdaraanan ng mga ito. Ang “kahabag-habag” ay natural na pagpapahayag ng οὐαί bilang pahayag ng kapahamakan, hindi simpleng awa lamang.
- source_word: δι’ οὗ
  choice: ang taong sa pamamagitan niya
  rationale: Pinananatili ang isahang personal na tinutukoy at ang diwa ng pamamagitan sa διά, sa halip na paliitin agad ito sa ‘gumagawa’ o ‘sanhi.’
- source_word: ἔρχεται
  choice: dumarating ang mga ito
  rationale: Bagaman isahan ang pandiwa sa Griyego, tumutukoy ito sa mga σκάνδαλα. Ang “mga ito” ay malinaw at likas na pag-uugnay sa pangmaramihang “mga katitisuran” sa Filipino.
theological_decisions:
- issue: Kahulugan ng σκάνδαλα sa etikong turo
  choice: Isinalin bilang “mga katitisuran” sa pangunahing teksto.
  alternative: “mga sanhi ng pagkakasala,” “mga tukso sa pagkakasala,” o “mga bagay na nagpapabagsak”
  rationale: 'Pinananatili ng talinghaga ang lawak ng salita: maaaring tumukoy sa mga bagay o pangyayaring umaakay sa kasalanan o espirituwal na pagbagsak, hindi lamang sa personal na pagkayamot o pagkakasala ng damdamin.'
- issue: Pananagutan ng taong tinutukoy sa δι’ οὗ
  choice: “ang taong sa pamamagitan niya ay dumarating ang mga ito”
  alternative: “ang taong pinagmumulan ng mga ito”
  rationale: Mas malapit ang piniling anyo sa Griyegong ‘through whom’ at hindi nito agad nilulutas kung ang tao ay tuwirang sanhi, kasangkapan, o daluyan ng katitisuran. Gayunman, nananatiling malinaw ang matinding pananagutan sa pahayag na οὐαί.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang sadyang dobleng pagtanggi sa “Hindi maaaring hindi dumating” upang maipakita ang anyo at diin ng Griyego, at iniwasang gawing mas tiyak kaysa sa pinagmulan ang kahulugan ng “mga katitisuran” at “sa pamamagitan niya.”
