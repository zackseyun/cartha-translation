  naturalness: Ang “mga katitisuran” ay nauunawaan ngunit hindi gaanong likas sa makabagong Filipino sa ganitong gamit. Ang “mga bagay na nakapagpapatisod” ay mas malinaw at nananatiling metaporikal. Ang hulíng sugnay ay nananatiling maayos at malapit sa estruktura ng pinagmulan kapag ginamit ang “aba sa.”
  terminology: Pinananatili ang “mga alagad.” Ang “mga bagay na nakapagpapatisod” ay hindi pa nagpapasya kung ang σκάνδαλα ay tukso, sanhi ng kasalanan, o iba pang daan sa pagbagsak. Ang “aba sa” ay angkop na katapat ng οὐαί sa marangal ngunit modernong rehistro.
