  source_fidelity: 'Tumpak ang pangunahing diwa: retorikal na tanong, alipin, pag-aararo/pagpapastol, pagdating mula sa bukid, at agarang utos. Gayunman, ang “dumulog sa hapag” ay nangangahulugang lumapit sa mesa at hindi malinaw na isinasalin ang ἀνάπεσε, na tumutukoy sa pag-upo/paghilig para kumain sa sinaunang kaugalian. Ang “pag-uwi” ay bahagyang mas tiyak kaysa εἰσελθόντι (“pagdating/pagpasok”).'
  naturalness: Marangal at madaling unawain ang kabuuang pangungusap, ngunit hindi natural at medyo mali ang kolokasyong “dumulog sa hapag.” Mas malinaw ang “maupo sa hapag,” na may talababa upang mapanatili ang sinaunang kahulugang paghilig sa pagkain.
  terminology: Ang “alipin” ay angkop para sa δοῦλος sa tagpong ito at mas tumpak kaysa “lingkod.” Ang “nag-aararo” at “nagpapastol” ay angkop. Ang “hapag” ay angkop para sa kainan, habang ipinaliliwanag ng talababa ang sinaunang posisyong nakahilig.
