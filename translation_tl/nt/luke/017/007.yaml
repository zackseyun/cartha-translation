- from: Ngunit sino sa inyo na may aliping nag-aararo o nagpapastol ang magsasabi rito pag-uwi nito mula sa bukid, “Halika agad at dumulog sa hapag[a]”?
  to: Ngunit sino sa inyo ang magsasabi sa alipin niyang nag-aararo o nagpapastol, pagdating nito mula sa bukid, “Lumapit ka agad at maupo sa hapag[a]”?
  rationale: Pinalitan ang “dumulog sa hapag” ng “maupo sa hapag” upang malinaw na ang utos ay kumuha ng puwesto para kumain, hindi lamang lumapit sa mesa. Pinanatili ng talababa ang historikal na detalye na ang karaniwang posisyon sa pagkain noon ay nakahilig. Pinalitan din ang “pag-uwi” ng “pagdating” upang hindi magdagdag ng ideyang wala sa pinagmulan.
