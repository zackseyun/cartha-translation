base_translation:
  language: en
  yaml_path: translation/nt/luke/017/007.yaml
  text: But which of you[a], having a servant plowing or shepherding, will say to him when he has come in from the field[b], ‘Come at once and recline at the table’?
translation:
  language: tl
  text: Ngunit sino sa inyo ang magsasabi sa alipin niyang nag-aararo o nagpapastol, pagdating nito mula sa bukid, “Lumapit ka agad at maupo sa hapag[a]”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “maupo sa hapag” ay tumutukoy sa pagkuha ng lugar upang kumain. Noong panahong iyon, karaniwang nakahilig ang mga tao habang kumakain.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλον
  choice: alipin
  rationale: Tumutukoy ito sa isang taong nakatali sa sambahayan at nasa ilalim ng kapangyarihan ng panginoon, hindi sa isang upahang manggagawa. Pinananatili ng “alipin” ang bigat ng ugnayang panlipunan sa talinghaga.
- source_word: ἀροτριῶντα
  choice: nag-aararo
  rationale: Tuwirang inilalarawan ng pandiwa ang gawaing pag-aararo at natural ito sa modernong Filipino.
- source_word: ποιμαίνοντα
  choice: nagpapastol
  rationale: Ipinahihiwatig ng pandiwa ang pag-aalaga sa kawan bilang pastol nang hindi tinutukoy kung anong uri ng hayop.
- source_word: εἰσελθόντι ἐκ τοῦ ἀγροῦ
  choice: pag-uwi nito mula sa bukid
  rationale: Ginagawang natural sa Filipino ang temporal na participle at malinaw na ang alipin ang nagmula sa bukid bago siya kausapin.
- source_word: ἐρεῖ αὐτῷ
  choice: ang magsasabi rito
  rationale: Pinananatili ang panghinaharap at ang tuwirang pagsasalita sa alipin.
- source_word: Εὐθέως
  choice: agad
  rationale: Maikli at natural na katumbas ng diwa ng agarang pagkilos.
- source_word: παρελθὼν
  choice: Halika
  rationale: Sa pagkakaugnay nito sa ἀνάπεσε, ipinakikita ng participle ang paglapit bago dumulog sa pagkain; natural itong utos sa Filipino.
- source_word: ἀνάπεσε
  choice: dumulog sa hapag
  rationale: Ipinahihiwatig nito ang pagkuha ng lugar para kumain. Mas natural sa Filipino kaysa literal na “humilig,” habang ipinaliliwanag sa talababa ang sinaunang kaugalian.
theological_decisions:
- issue: Paglalarawan sa δοῦλος sa sambahayan ng talinghaga
  choice: alipin
  alternative: lingkod
  rationale: Mahalaga sa argumento ang hindi pantay na ugnayan ng panginoon at alipin. Mas malinaw na pinananatili ng “alipin” ang panlipunan at retorikal na bigat nito nang hindi nagdaragdag ng doktrinang wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “rito” at “nito” upang maiwasan ang malabong reperensiya sa magkakasunod na panghalip. Pinanatili ang anyo ng retorikal na tanong at ang panginoon-alipin na tagpo.
