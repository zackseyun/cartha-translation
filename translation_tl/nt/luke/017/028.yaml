  text: ὁμοίως ⸀καθὼς ἐγένετο ἐν ταῖς ἡμέραις Λώτ· ἤσθιον, ἔπινον, ἠγόραζον, ἐπώλουν, ἐφύτευον, ᾠκοδόμουν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/028.yaml
  text: 'Likewise[a], just as it happened in the days of Lot: they were eating, drinking, buying, selling, planting, and building.'
translation:
  language: tl
  text: 'Gayon din[a], gaya ng nangyari noong panahon ni Lot: kumakain sila, umiinom, bumibili, nagbebenta, nagtatanim, at nagtatayo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Katulad din ng nangyari noong panahon ni Lot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: Gayon din
  rationale: Likas at maikli itong pang-abay na nag-uugnay sa halimbawa tungkol kay Lot sa naunang paghahambing, habang pinananatili ang diwang ‘sa katulad na paraan.’
- source_word: καθὼς
  choice: gaya ng
  rationale: Malinaw nitong ipinakikilala ang paghahambing nang hindi nagiging mabigat o lipas ang pananalita.
- source_word: ἐγένετο
  choice: nangyari
  rationale: Ipinahahayag nito ang eventive na diwa ng γίνομαι sa natural na makabagong Tagalog.
- source_word: ἐν ταῖς ἡμέραις Λώτ
  choice: noong panahon ni Lot
  rationale: Natural na katumbas ito ng idyomang tumutukoy sa panahong iniugnay kay Lot.
- source_word: ἤσθιον
  choice: kumakain sila
  rationale: Ang aspektong imperpektibo ng pandiwa ay inilalarawan bilang nagpapatuloy o nakaugaliang gawain.
- source_word: ἔπινον
  choice: umiinom
  rationale: Pinananatili ng anyong imperpektibo ang larawan ng karaniwang nagpapatuloy na gawain.
- source_word: ἠγόραζον
  choice: bumibili
  rationale: Karaniwan at natural na salita ito para sa tuloy-tuloy na gawaing pangkalakalan.
- source_word: ἐπώλουν
  choice: nagbebenta
  rationale: Tumpak nitong ipinapares ang karaniwang gawaing pagbebenta sa ‘bumibili’ at pinananatili ang aspektong imperpektibo.
- source_word: ἐφύτευον
  choice: nagtatanim
  rationale: Direkta at natural itong tumutukoy sa nagpapatuloy na gawaing pansakahan.
- source_word: ᾠκοδόμουν
  choice: nagtatayo
  rationale: Ginagamit ito sa literal na diwa ng pagtatayo o konstruksiyon at umaayon sa talaan ng mga ordinaryong gawain.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkakatugmang aspektong imperpektibo sa talaan ng mga pang-araw-araw na gawain upang maipakita ang nagpapatuloy o nakaugaliang kilos sa salaysay.
