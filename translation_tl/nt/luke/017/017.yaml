  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· ⸀Οὐχὶ οἱ δέκα ἐκαθαρίσθησαν; οἱ δὲ ἐννέα ποῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/017.yaml
  text: Then Jesus answered[a], “Were not the ten cleansed? But where are the nine?”
translation:
  language: tl
  text: Sumagot si Jesus, “Hindi ba nalinis[a] ang sampu? Ngunit nasaan ang siyam?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naging malinis”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Sumagot si Jesus
  rationale: Ang karaniwang pormula sa pagsasalaysay na literal na ‘sumagot ... sinabi’ ay likas at sapat na naipapahayag sa modernong Tagalog bilang ‘Sumagot si Jesus.’ Hindi kailangang ulitin ang ‘sinabi.’
- source_word: Οὐχὶ
  choice: Hindi ba
  rationale: Naghihintay ang οὐχί ng pagsang-ayon na sagot; likas na naipahahayag ito ng retorikal na tanong na ‘Hindi ba...?’
- source_word: οἱ δέκα
  choice: ang sampu
  rationale: Tumutukoy ang artikulo at bilang sa kilalang pangkat ng sampung ketongin sa konteksto. Hindi idinagdag sa pangunahing teksto ang ‘lahat’ dahil hindi ito tahasang nakasaad.
- source_word: ἐκαθαρίσθησαν
  choice: nilinis
  rationale: Pinananatili ng ‘nilinis’ ang diwang pisikal at seremonyal ng καθαρίζω sa konteksto ng ketong, sa halip na paliitin ito sa ‘pinagaling’ lamang.
- source_word: οἱ δὲ ἐννέα ποῦ
  choice: Ngunit nasaan ang siyam?
  rationale: Ipinahihiwatig ng δέ ang malinaw na paghahambing sa isang bumalik, kaya natural ang ‘Ngunit’; tuwirang naipahahayag ng ‘nasaan’ ang tanong tungkol sa kinaroroonan.
theological_decisions:
- issue: Kahulugan ng καθαρίζω sa pagpapagaling sa mga ketongin
  choice: nilinis
  alternative: pinagaling; naging malinis
  rationale: Ang καθαρίζω ay may saklaw na higit sa pisikal na paggaling at maaari ring magpahiwatig ng pagiging malinis ayon sa ritwal. Pinananatili ng ‘nilinis’ ang dalawang kaugnay na diwa nang hindi nagpapasok ng dagdag na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, dignified, at madaling maunawaan. Ginamit ang likas na ‘Sumagot si Jesus’ para sa pormulang Griyego at pinanatili ang retorikal na diin ng dalawang tanong.
