    issue: Di-gaanong malinaw ang aspektong balintiyak sa «nilinis ang sampu».
    rationale: Ang ἐκαθαρίσθησαν ay balintiyak (“were cleansed”). Sa Tagalog, ang «nilinis» ay mas madaling unawain bilang perpektibong anyong aktibo na may ipinapalagay na tagaganap, samantalang ang «nalinis» ay malinaw na resulta/balintiyak sa kontekstong ito.
