id: LUK.17.33
reference: Luke 17:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃς ἐὰν ζητήσῃ τὴν ψυχὴν αὐτοῦ ⸀περιποιήσασθαι ἀπολέσει αὐτήν, ⸂ὃς δ’ ἂν⸃ ⸀ἀπολέσῃ ζῳογονήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/033.yaml
  text: Whoever seeks to preserve his life will lose it[b][a], but whoever loses it will preserve it alive.
translation:
  language: tl
  text: Ang sinumang magsikap na ingatan ang kanyang buhay[a] ay mawawalan nito, ngunit ang sinumang mawalan nito ay pananatilihin itong buhay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaluluwa” ang salin sa “buhay” (ψυχή), ngunit dito ay malamang na tumutukoy ito sa buhay o sarili ng isang tao.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “iingatan itong buhay”; literal na nangangahulugan ang pandiwang Griyego na “panatilihing buhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσῃ
  choice: magsikap
  rationale: Ipinahihiwatig ng ζητέω rito ang sinasadyang pagsisikap, hindi lamang pagnanais; natural itong nagpapahayag ng layuning iligtas ang sarili.
- source_word: ψυχὴν
  choice: buhay
  rationale: Sa konteksto, tumutukoy ang ψυχή sa buhay o sarili ng tao, hindi partikular sa kaluluwang hiwalay sa katawan.
- source_word: περιποιήσασθαι
  choice: ingatan
  rationale: Ipinahahayag ng gitnang anyo ang pagsisikap na panatilihin o tiyakin ang sariling buhay; malinaw at natural sa Filipino ang “ingatan.”
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: mawawalan / mawalan
  rationale: Pinananatili ng magkatugmang salin ang kabalintunaan at pag-uulit ng ἀπόλλυμι sa dalawang sugnay.
- source_word: ζῳογονήσει
  choice: pananatilihin itong buhay
  rationale: Tuwirang ipinahahayag nito ang diwang “panatilihing buhay” ng ζῳογονέω at hindi ito pinapantay sa mas karaniwang pandiwang “iligtas.”
- source_word: ὃς ἐὰν ... ὃς δ’ ἂν
  choice: Ang sinumang ... ngunit ang sinumang
  rationale: Nananatili ang pangkalahatang kondisyon at malinaw na pagsalungat ng dalawang sugnay.
theological_decisions:
- issue: Kahulugan ng ψυχή sa kabalintunaang pahayag ni Jesus
  choice: Isinaling “buhay”
  alternative: kaluluwa
  rationale: Ang malapit na konteksto ay tungkol sa pagkawala o pag-iingat ng buhay sa harap ng paghatol. Iniiwasan ng “buhay” ang pagpasok ng di-kinakailangang paghihiwalay ng katawan at kaluluwa.
- issue: Kahulugan ng ζῳογονήσει
  choice: Isinaling “pananatilihin itong buhay”
  alternative: ililigtas ito
  rationale: Hindi ito ang karaniwang pandiwang Griyego para sa “iligtas.” Pinananatili ng salin ang literal at matingkad na pagtukoy sa pagpapanatiling buhay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang gender-neutral na “kanyang,” at pinanatili ang maikli at matinding kabalintunaan ng orihinal.
