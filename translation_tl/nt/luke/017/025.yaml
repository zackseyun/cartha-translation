base_translation:
  language: en
  yaml_path: translation/nt/luke/017/025.yaml
  text: But first he must suffer many things and be rejected by this generation.
translation:
  language: tl
  text: Ngunit kailangan muna siyang magdusa ng maraming bagay at itakwil ng salinlahing ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: muna
  rationale: Ipinahahayag ng pang-abay ang temporal na pagkauna. Likas sa modernong Tagalog ang “kailangan muna niyang” at malinaw nitong pinananatili ang pagkakasunod-sunod ng mga pangyayari.
- source_word: δὲ
  choice: Ngunit
  rationale: Minamarkahan ng δέ ang banayad na pagsalungat sa naunang pahayag; ang “Ngunit” ay angkop at marangal sa konteksto.
- source_word: δεῖ
  choice: kailangan
  rationale: Pinananatili ng “kailangan” ang puwersa ng kinakailangang mangyari, pati ang posibleng pahiwatig ng banal na layunin sa Lucas, nang hindi ito tahasang ipinapaliwanag.
- source_word: αὐτὸν
  choice: niyang
  rationale: Bagaman akusatibo ang anyong Griyego bilang simuno ng mga pawatas, natural na ipinapahayag ito sa Tagalog sa “kailangan muna niyang magdusa.” Ang tinutukoy ay ang Anak ng Tao mula sa konteksto.
- source_word: πολλὰ
  choice: ng maraming bagay
  rationale: Ang neuter plural ay malawak ang saklaw. Ang “maraming bagay” ay mas tuwirang nagpapanatili nito kaysa sa “matindi,” na magpapalit ng dami tungo sa antas.
- source_word: παθεῖν
  choice: magdusa
  rationale: Direkta, natural, at mabigat na katumbas ito ng πάσχω sa konteksto ng nalalapit na paghihirap.
- source_word: ἀποδοκιμασθῆναι
  choice: itakwil
  rationale: Ipinahahayag ng “itakwil” ang pagtanggi o pagtaboy matapos hindi kilalanin o tanggapin. Mas natural at matindi ito sa Tagalog kaysa sa teknikal na “hindi sang-ayunan.”
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: ng salinlahing ito
  rationale: Sa balintiyak na pandiwa, maaaring tukuyin ng ἀπό ang gumaganap o pinagmumulan ng pagtakwil. Ang “ng salinlahing ito” ay natural na nagpapahayag ng ahensiya at pinananatili ang kontemporaryong sanggunian ng γενεά.
theological_decisions:
- issue: Puwersa ng δεῖ kaugnay ng pagdurusa ng Anak ng Tao
  choice: “kailangan”
  alternative: “nararapat” o tahasang “ayon sa plano ng Diyos”
  rationale: Madalas gamitin ni Lucas ang δεῖ sa mga pangyayaring naaayon sa banal na layunin. Pinananatili ng “kailangan” ang teolohikal na bigat nito ngunit hindi nagdaragdag ng tahasang paliwanag na wala sa mismong talata.
- issue: Pagkakakilanlan ng αὐτόν
  choice: Panghalip na “niyang,” na umaasa sa konteksto
  alternative: Ulitin ang “Anak ng Tao”
  rationale: Panghalip lamang ang nasa talata. Ang pag-uulit sa titulo ay maaaring makatulong sa linaw ngunit magdaragdag sa tekstong Griyego; kaya pinanatili ang panghalip at ang kontekstuwal na sanggunian.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang maikling estruktura at bigat ng pahayag. Walang idinagdag na denominasyonal na paliwanag.
