id: LUK.17.16
reference: Luke 17:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔπεσεν ἐπὶ πρόσωπον παρὰ τοὺς πόδας αὐτοῦ εὐχαριστῶν αὐτῷ· καὶ αὐτὸς ἦν Σαμαρίτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/016.yaml
  text: And he fell on his face at his feet, thanking him. And he was a Samaritan.
translation:
  language: tl
  text: At nagpatirapa siya sa paanan ni Jesus at nagpasalamat sa kanya. Ang lalaking ito ay isang Samaritano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: nagpatirapa
  rationale: Natural at marangal na salin ng buong kilos ng pagbagsak nang nakadapa; malinaw nitong ipinahihiwatig ang mapagpakumbabang pagyukod nang hindi mabigat ang literal na parirala.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: sa paanan ni Jesus
  rationale: Ang “sa paanan” ang likas na katumbas sa Filipino sa ganitong konteksto ng pagpapakumbaba. Ginawang tahasan ang reperente ng panghalip bilang “Jesus” upang maiwasan ang malabong sunod-sunod na “niya/kanya” sa Filipino.
- source_word: εὐχαριστῶν αὐτῷ
  choice: nagpasalamat sa kanya
  rationale: Ipinapahayag ang kasabay na kilos sa natural na Filipino at pinananatiling si Jesus ang tuwirang pinasasalamatan.
- source_word: Σαμαρίτης
  choice: Samaritano
  rationale: Karaniwan at kinikilalang katawagang Filipino para sa etnorelihiyosong pagkakakilanlan na mahalaga sa salaysay.
- source_word: καὶ αὐτὸς ἦν Σαμαρίτης
  choice: Ang lalaking ito ay isang Samaritano
  rationale: Naipakikita ng “lalaking ito” ang diin ng αὐτός at malinaw na ibinubunyag ang pagkakakilanlan niya, nang walang idinadagdag na paliwanag.
theological_decisions:
- issue: Diin ng salaysay sa pagkakakilanlan ng lalaking pinagaling
  choice: Ang lalaking ito ay isang Samaritano.
  alternative: At siya ay isang Samaritano.
  rationale: Pinananatili ang payak ngunit madiing pagbubunyag na ang nagpasalamat ay isang Samaritano. Hindi dinaragdagan ng interpretasyon ang panlipunan at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ang “nagpatirapa” ay madaling maunawaan sa kontekstong biblikal at mas likas kaysa sa salitang-salitang “bumagsak na nakadapa.”
