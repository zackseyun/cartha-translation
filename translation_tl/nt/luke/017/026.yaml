reference: Luke 17:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ καθὼς ἐγένετο ἐν ταῖς ἡμέραις Νῶε, οὕτως ἔσται καὶ ἐν ταῖς ἡμέραις τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/026.yaml
  text: And just as it happened in the days of Noah[a], so it will be also in the days of the Son of Man.
translation:
  language: tl
  text: At kung paanong nangyari noong mga araw ni Noe, magiging gayon din sa mga araw ng Anak ng Tao[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Anak ng Sangkatauhan.” Ang titulong Griyego na tradisyonal na isinasaling “Anak ng Tao” ay malamang na umaalingawngaw sa Daniel 7 at pinanatili rito dahil sa kinikilalang mesiyanikong at apokaliptikong pahiwatig nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: kung paanong
  rationale: Malinaw at natural na nagpapakilala ng paghahambing at pinananatili ang diin ng Griyegong καθὼς.
- source_word: ἐγένετο
  choice: nangyari
  rationale: Ipinapahayag ang mga naganap noong panahon ni Noe sa payak at makabagong Filipino.
- source_word: ἐν ταῖς ἡμέραις Νῶε
  choice: noong mga araw ni Noe
  rationale: Natural na katumbas ng temporal na idyomang Griyego at pinananatili ang tradisyonal na anyo nito.
- source_word: οὕτως ἔσται καὶ
  choice: magiging gayon din
  rationale: Pinagsasama nang natural sa Filipino ang paghahambing, panghinaharap na diwa ng ἔσται, at dagdag na diin ng καί.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: ng Anak ng Tao
  rationale: Ito ang kinikilalang salin ng titulo ni Jesus at pinananatili nito ang anyo at posibleng alusyon sa Daniel 7 nang hindi nilulutas ang lahat ng pahiwatig nito.
theological_decisions:
- issue: Pagkasalin sa titulong τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Anak ng Tao
  alternative: Anak ng Sangkatauhan
  rationale: Pinananatili ng “Anak ng Tao” ang nakaugaliang mesiyanikong at apokaliptikong taginting ng titulo, pati ang ugnay nito sa Daniel 7. Ang alternatibo ay maaaring maglinaw sa kolektibong diwa ng ἄνθρωπος ngunit mas mapagpakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkapares na “kung paanong” at “magiging gayon din” upang maging natural ang paghahambing habang nananatiling malapit sa estruktura at diin ng Griyego.
