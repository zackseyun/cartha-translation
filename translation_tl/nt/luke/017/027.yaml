  text: ἤσθιον, ἔπινον, ἐγάμουν, ⸀ἐγαμίζοντο, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν, καὶ ἦλθεν ὁ κατακλυσμὸς καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/027.yaml
  text: They were eating[a], they were drinking, they were marrying, they were being given in marriage, until the day Noah entered into the ark, and the flood came and destroyed them all.
translation:
  language: tl
  text: Kumakain sila, umiinom, nag-aasawa, at ipinapakasal hanggang sa araw na pumasok si Noe sa arka. Dumating ang baha at nilipol silang lahat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤσθιον
  choice: Kumakain sila
  rationale: Ang imperpektong aspekto ay nagpapakita ng nagpapatuloy o nakaugaliang gawain noong panahong iyon; likas itong naihahayag sa Filipino sa anyong “kumakain.”
- source_word: ἔπινον
  choice: umiinom
  rationale: Pinananatili ng aspektong di-ganap ang larawan ng karaniwang buhay na nagpapatuloy.
- source_word: ἐγάμουν
  choice: nag-aasawa
  rationale: Ipinahahayag nito ang aktibong pandiwa para sa pag-aasawa nang hindi nililimitahan sa isang kasarian ang pangkalahatang pangungusap.
- source_word: ἐγαμίζοντο
  choice: ipinapakasal
  rationale: Pinananatili ang tinig na balintiyak at ang pagkakaiba nito sa naunang pandiwang “nag-aasawa.”
- source_word: ἄχρι ἧς ἡμέρας
  choice: hanggang sa araw na
  rationale: Natural at malinaw na panandang temporal para sa hangganan ng nagpapatuloy na mga gawain.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: pumasok si Noe sa arka
  rationale: Tuwirang salin ng natapos na pangyayaring pasalaysay; “arka” ang kinagisnang tumpak na tawag sa sasakyang-dagat ni Noe.
- source_word: ὁ κατακλυσμός
  choice: ang baha
  rationale: Ang “baha” ang pinakanatural at malinaw na modernong Filipino para sa malaking bahang tinutukoy sa salaysay ni Noe.
- source_word: ἀπώλεσεν πάντας
  choice: nilipol silang lahat
  rationale: Ipinapahayag ng “nilipol” ang ganap na pagkapuksa, at ginagawang malinaw ng “silang lahat” ang pahiwatig na mga tao ang layon at walang nalibre sa tinutukoy na pangkat.
theological_decisions:
- issue: Pagkakaiba ng dalawang pandiwa tungkol sa pag-aasawa
  choice: nag-aasawa, at ipinapakasal
  alternative: nagsisipag-asawa
  rationale: Dalawang magkaibang pandiwa ang nasa Griyego, isang aktibo at isang balintiyak. Pinananatili ng salin ang pagkakaibang ito nang hindi dinaragdagan ng tiyak na aral tungkol sa kasarian o kaayusan ng pag-aasawa.
- issue: Aspekto ng magkakasunod na pambungad na pandiwa
  choice: 'mga pandiwang nasa aspektong di-ganap: “kumakain… umiinom… nag-aasawa… ipinapakasal”'
  alternative: 'mga pandiwang natapos: “kumain… uminom… nag-asawa… ipinakasal”'
  rationale: Ang mga imperpekto sa Griyego ay naglalarawan ng nagpapatuloy o nakaugaliang pang-araw-araw na buhay hanggang sa biglang pagdating ng paghuhukom.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “arka” bilang nakaugaliang terminong biblikal at “nilipol” upang tumpak na ihayag ang ganap na pagkapuksa.
