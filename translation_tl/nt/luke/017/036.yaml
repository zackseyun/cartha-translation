  yaml_path: translation/nt/luke/017/036.yaml
  text: Two[a] men will be in the field; one will be taken, and the other will be left.
translation:
  language: tl
  text: Magiging nasa bukid ang dalawang lalaki[a]; kukunin ang isa, at iiwan ang isa pa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wala ang talatang ito sa pinakamaagang mga manuskritong Griyego, kabilang ang ika-4 na siglong Codex Sinaiticus at Codex Vaticanus, at sa mga sinaunang saling Coptic. Gayunman, makikita ito sa tradisyong Kanluranin, gaya ng ika-5 siglong Codex Bezae, sa karamihang tradisyong Byzantine, at sa Latin Vulgate. Malamang na idinagdag ito ng mga tagakopya noong bandang huli upang iayon sa Mateo 24:40.
    reason: textual_critical
lexical_decisions:
- source_word: δύο
  choice: dalawang lalaki
  rationale: Bagaman ang salitang Griyego ay literal na “dalawa” at walang tahasang pangngalang panlalaki, ipinahihiwatig ng mga panlalaking anyo na εἷς at ὁ ἕτερος na dalawang lalaki ang tinutukoy.
- source_word: παραληφθήσεται
  choice: kukunin
  rationale: 'Pinananatili nito ang payak at sadyang hindi ganap na tiyak na diwa ng passive na παραλαμβάνω: ang isa ay kukunin o isasama, nang hindi dinaragdagan kung sino ang kukuha o kung saan siya dadalhin.'
- source_word: ἀφεθήσεται
  choice: iiwan
  rationale: Sa tuwirang pagsalungat sa “kukunin,” ipinahahayag nito na ang isa pa ay maiiwan, nang hindi ipinapasok ang mas matinding diwang “pababayaan.”
- source_word: ὁ ἕτερος
  choice: ang isa pa
  rationale: Natural na Filipino ito para sa ikalawa sa dalawang naunang tinukoy at malinaw na pinananatili ang paghahambing.
- source_word: ἐν τῷ ἀγρῷ
  choice: mapapasa bukid
  rationale: Ang “mapapasa bukid” ay natural at dignified na pagpapahayag ng kalagayang hinaharap na “will be in the field,” at ang “bukid” ay ang karaniwang katumbas ng ἀγρός sa kontekstong ito.
theological_decisions:
- issue: Kahulugan ng “kukunin” at “iiwan” sa pangyayaring eskatolohikal
  choice: Hindi tinukoy sa salin kung ang pagkakuha ay kaligtasan o paghatol.
  alternative: Ipaliwanag sa mismong talata na ang kukunin ay ililigtas o hahatulan.
  rationale: Hindi tahasang sinasabi ng pangungusap ang kahihinatnan ng bawat isa; ang pagpapanatili sa payak na “kukunin” at “iiwan” ay nag-iingat sa tunay na tensiyon at ambiguity ng teksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “mapapasa bukid” upang natural na ipahayag ang hinaharap na kalagayan, at pinanatiling payak ang magkatapat na “kukunin” at “iiwan.”
