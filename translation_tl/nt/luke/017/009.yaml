  text: Does he thank the servant because he did what was commanded?[a]
translation:
  language: tl
  text: Nagpapasalamat ba siya sa alipin[a] dahil ginawa ng alipin ang iniutos sa kanya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lingkod” o “aliping lingkod.” Ang salitang Griego na doulos ay maaari ring isaling “lingkod” o “aliping lingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: ba
  rationale: Ang μή kasama ng pandiwang nasa indicative ay bumubuo ng retorikal na tanong na umaasang ang sagot ay hindi. Sa natural na Tagalog, naipahihiwatig ito ng tanong na may “ba” sa konteksto, nang hindi nagdaragdag ng tahasang sagot.
- source_word: ἔχει χάριν
  choice: pinasasalamatan
  rationale: Ang idyomang ἔχειν χάριν τινί ay nangangahulugang magpasalamat o magpakita ng pagkilala sa isang tao. Ang “pinasasalamatan” ang malinaw at likas na katumbas dito.
- source_word: τῷ δούλῳ
  choice: ang alipin
  rationale: Ang δοῦλος ay tumutukoy sa taong nasa ilalim ng pagmamay-ari at kapangyarihan ng amo. Mahalaga sa lohika ng talinghaga ang obligadong kalagayan niya, kaya pinanatili ang mas matinding salitang “alipin.”
- source_word: ὅτι
  choice: dahil
  rationale: Ipinakikilala ng ὅτι ang dahilan kung bakit maaaring pasalamatan ang alipin.
- source_word: ἐποίησεν
  choice: ginawa nito
  rationale: Payak at natural na salin ng ποιέω sa kontekstong pagsasagawa ng ipinag-utos. Ginamit ang “nito” upang malinaw na ang alipin ang gumagawa.
- source_word: τὰ διαταχθέντα
  choice: ang mga iniutos sa kanya
  rationale: Ang articular perfect passive participle ay tumutukoy sa mga bagay na iniutos. Pinananatili ng salin ang diwang pasibo at nililinaw kung kanino ibinigay ang utos.
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλος sa konteksto ng amo at alipin
  choice: alipin
  alternative: lingkod
  rationale: Nakasalalay ang punto ng talinghaga sa mababang katayuan at obligasyong sumunod ng taong nasa ilalim ng kapangyarihan ng amo. Ang “alipin” ay hindi nagpapalambot sa panlipunang realidad ng larawan, samantalang inilalahad sa talababa ang mas banayad na alternatibo.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ang retorikal na tanong ay pinanatili nang hindi tahasang idinaragdag ang inaasahang sagot na “hindi.”
