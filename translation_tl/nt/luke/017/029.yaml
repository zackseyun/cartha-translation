  text: ᾗ δὲ ἡμέρᾳ ἐξῆλθεν Λὼτ ἀπὸ Σοδόμων, ἔβρεξεν πῦρ καὶ θεῖον ἀπ’ οὐρανοῦ καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/029.yaml
  text: but on the day Lot went out from Sodom[a], fire and sulfur rained from heaven and destroyed them all.
translation:
  language: tl
  text: Ngunit noong araw na lumabas si Lot mula sa Sodoma, umulan ng apoy at asupre mula sa langit at nilipol silang lahat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾗ δὲ ἡμέρᾳ
  choice: Ngunit nang araw na
  rationale: Ang pariralang datibo ay temporal, at ang δέ ay banayad na pagsalungat o pagpapatuloy. Likas sa modernong Tagalog ang “Ngunit nang araw na” sa kontekstong ito.
- source_word: ἐξῆλθεν
  choice: lumabas
  rationale: Tuwirang pinananatili nito ang kongkretong kilos ng paglabas, sa halip na ang mas malayang “umalis.”
- source_word: Λὼτ
  choice: Lot
  rationale: Karaniwang anyo ng pangalang ito sa Bibliyang Tagalog.
- source_word: ἀπὸ Σοδόμων
  choice: mula sa Sodoma
  rationale: Likas na Tagalog para sa pinagmulan ng paglabas; “Sodoma” ang nakaugaliang anyo ng pangalan ng lugar.
- source_word: ἔβρεξεν
  choice: umulan
  rationale: Ginamit ang pandiwa nang impersonal, gaya ng Griyego, nang hindi nagdaragdag ng tahasang simuno.
- source_word: πῦρ καὶ θεῖον
  choice: apoy at asupre
  rationale: Ang θεῖον ay asupre. Malinaw at makabago ito habang pinananatili ang larawan ng paghuhukom.
- source_word: ἀπ’ οὐρανοῦ
  choice: mula sa langit
  rationale: Pinananatili nito ang biblikal na pananalita at ang alusyon sa Genesis 19:24; hindi ito nililimitahan sa pisikal na kalangitan lamang.
- source_word: ἀπώλεσεν πάντας
  choice: nilipol silang lahat
  rationale: Ang ἀπόλλυμι ay tumutukoy rito sa ganap na pagwasak. Ginagawang natural ng “silang lahat” ang ipinahihiwatig na pantukoy sa mga tao.
theological_decisions:
- issue: Pagpapahayag sa θεῖον sa konteksto ng paghuhukom
  choice: asupre
  alternative: azufre; tradisyonal na katumbas ng “brimstone”
  rationale: Ang “asupre” ang malinaw na modernong katawagan sa sulfur at hindi pinahihina ang larawan ng paghuhukom.
- issue: Kahulugan ng οὐρανός
  choice: langit
  alternative: himpapawid
  rationale: Ang “langit” ay nagpapanatili sa biblikal na idyoma at alusyon sa salaysay ng Sodoma nang hindi nagdaragdag ng paliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang maikli at mariing ayos ng Griyego, pati ang larawan ng pag-ulan ng apoy at asupre. Ang panandang [a] ay inilagay pagkatapos ng “asupre,” na siyang tinutukoy ng tala.
