base_translation:
  language: en
  yaml_path: translation/nt/luke/017/004.yaml
  text: And if he sins against you seven times in a day[a], and seven times returns to you saying[c][b], ‘I repent,’ you shall forgive him.
translation:
  language: tl
  text: At kung pitong ulit siyang magkasala sa iyo sa isang araw, at pitong ulit siyang bumalik sa iyo at sabihing, ‘Nagsisisi ako,’ patatawarin mo siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “patatawarin mo siya” ay may puwersa ng utos: “dapat mo siyang patawarin.” Maaari ring isalin ang “bumalik sa iyo” na “humarap muli sa iyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτάκις
  choice: pitong ulit
  rationale: Likas na Filipino para sa adberbyong nangangahulugang ‘seven times,’ at pinananatili ang diin sa paulit-ulit na kilos.
- source_word: τῆς ἡμέρας
  choice: sa loob ng isang araw
  rationale: Ipinahahayag nang natural ang genitive of time within which; ang ‘isang’ ay idiomatikong kailangan sa Filipino at hindi nagpapalit sa diwa.
- source_word: ἁμαρτήσῃ εἰς σὲ
  choice: magkasala sa iyo
  rationale: Natural at tumpak na katumbas ng pagkakasalang nakatuon laban sa kausap.
- source_word: ἐπιστρέψῃ πρὸς σὲ
  choice: bumalik sa iyo
  rationale: Pinananatili ang pangunahing diwa ng ἐπιστρέφω na pagbalik, habang ang ‘sa iyo’ ay kumakatawan sa πρὸς σέ.
- source_word: λέγων
  choice: at magsabi
  rationale: Natural na Filipino na naghahatid sa kasabay na pagsasalita ng participle nang hindi nagiging mabigat ang pangungusap.
- source_word: Μετανοῶ
  choice: Nagsisisi ako
  rationale: Karaniwan, malinaw, at may moral na bigat sa modernong Filipino; higit itong tumpak kaysa simpleng ‘Ikinalulungkot ko.’
- source_word: ἀφήσεις αὐτῷ
  choice: patatawarin mo siya
  rationale: Pinananatili ang anyong hinaharap ng Griyego, na sa kontekstong ito ay may puwersa ng utos o obligasyon.
theological_decisions:
- issue: Puwersa ng future indicative na ἀφήσεις
  choice: patatawarin mo siya
  alternative: dapat mo siyang patawarin / patawarin mo siya
  rationale: Ang anyong hinaharap ay pinanatili habang nauunawaan sa konteksto bilang mariing tagubilin; hindi ito ginawang simpleng hula lamang.
- issue: Kahulugan ng Μετανοῶ
  choice: Nagsisisi ako
  alternative: Ikinalulungkot ko / Nagbago ang isip ko
  rationale: Ipinananatili ang moral at espirituwal na bigat ng pagsisisi, sa halip na paliitin ito bilang lungkot o pagbabago lamang ng pasiya.
- issue: Saklaw ng ἐπιστρέψῃ
  choice: bumalik sa iyo
  alternative: humarap muli sa iyo
  rationale: Ang pandiwa ay maaaring mangahulugang ‘bumalik’ o ‘pumihit/humarap muli’; pinili ang mas natural sa sitwasyon ngunit itinabi ang tunay na alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang ‘pitong ulit’ sa halip na mas pormal na ‘makapitong ulit,’ at ‘sa loob ng isang araw’ para sa idiomatikong temporal na parirala. Ang panlalaking panghalip ay hindi kinakailangan sa Filipino; ang ‘siya’ ay tapat sa reperensiya nang hindi nagdaragdag ng kasarian.
