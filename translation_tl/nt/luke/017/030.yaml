  text: It will be the same on the day when the Son of Man is revealed[a].
translation:
  language: tl
  text: Magiging gayon din sa araw na mahayag ang Anak ng Tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Gayon din” o “Sa gayunding paraan.” Tinutukoy ng idyomang Griyego ang mga naunang halimbawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτά
  choice: Magiging gayon din
  rationale: Tumutukoy ang idyoma sa kaparehong kalagayan o padron ng mga naunang halimbawa. Likas sa Tagalog ang “magiging gayon din” at, kasama ng pandiwang nasa hinaharap, napapanatili nito ang paghahambing at ang pagtukoy sa mangyayari.
- source_word: ἔσται
  choice: Magiging
  rationale: Tuwirang ipinahahayag ng anyong panghinaharap ng εἰμί na ang tinutukoy na kalagayan ay mangyayari pa lamang.
- source_word: ᾗ ἡμέρᾳ
  choice: sa araw na
  rationale: Ang datibong pariralang ito ay temporal. Ang “sa araw na” ay natural na modernong Tagalog at nagpapanatili ng tiyak na pagtukoy sa panahon.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili nito ang kinikilalang titulo ni Jesus sa mga Ebanghelyo at ang ugnayan nito sa apokaliptiko at mesiyanikong larawan ng Daniel 7, nang hindi ito ipinapaliwanag sa loob ng salin.
- source_word: ἀποκαλύπτεται
  choice: ihayag
  rationale: Ipinapahayag ng pandiwa ang pagbubunyag o pagpapakita sa madla. Pinananatili ng “ihayag” ang tinig na balintiyak at hindi ito pinapalitan ng ibang ideya gaya ng simpleng pagdating.
theological_decisions:
- issue: Pagsasalin sa eskatolohikong titulong ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  alternative: ang Taong Anak / ang Isang Tao
  rationale: Ang “Anak ng Tao” ang nakikilalang tradisyonal na anyo sa Tagalog at mas malinaw na nagpapanatili sa intertekstuwal na ugnayan sa Daniel 7 at sa gamit nito bilang titulo sa mga Ebanghelyo.
- issue: Diwa ng ἀποκαλύπτεται sa konteksto
  choice: ihayag
  alternative: dumating / magpakita
  rationale: Ang salitang Griyego ay tumutukoy sa pagbubunyag o paglalantad, hindi lamang sa pagdating. Iniiwasan ng “ihayag” ang pagpasok ng ibang leksikal na ideya habang napapanatili ang pampublikong pagpapakita ng Anak ng Tao.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “gayon” upang mapanatili ang pormal ngunit hindi makalumang himig; maaari ring sabihing “ganoon” sa mas kolokyal na rehistro.
