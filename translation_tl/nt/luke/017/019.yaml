  yaml_path: translation/nt/luke/017/019.yaml
  text: And he said to him[a], “Rise and go[b]; your faith has saved you.”
translation:
  language: tl
  text: At sinabi niya sa kanya, “Bumangon ka at humayo; iniligtas ka[a] ng iyong pananampalataya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinagaling ka” o “ginawang magaling.” Ang pandiwang Griego ay maaaring tumukoy sa pagliligtas, pagpapagaling, o pagpapanumbalik sa mabuting kalagayan.
    reason: lexical_alternative
  - marker: b
    text: O “pagtitiwala.” Ang salitang Griego para sa “pananampalataya” ay maaari ring mangahulugang pagtitiwala o katapatan, bagaman “pananampalataya” ang pangunahing salin dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: sinabi niya sa kanya
  rationale: Likas at tuwirang salaysay sa Filipino; pinananatili ang panghalip na tumutukoy sa lalaking bumalik nang hindi nagdaragdag ng paliwanag.
- source_word: Ἀναστὰς
  choice: Bumangon ka
  rationale: Ang aorist participle ay ginagamit na may puwersang pautos. Ang “bumangon” ay angkop sa kontekstong nakapatirapa ang lalaki sa paanan ni Jesus at natural sa modernong Filipino.
- source_word: πορεύου
  choice: humayo
  rationale: Malinaw na utos na umalis o magpatuloy sa paglalakbay. Pinananatili ng “humayo” ang maikli at marangal na tono, bagaman bahagyang mas pormal ito kaysa “umalis ka na.”
- source_word: πίστις σου
  choice: iyong pananampalataya
  rationale: Ang “pananampalataya” ang karaniwang salin ng πίστις at angkop dito sa mapagtiwalang pagtugon ng lalaki. Posible rin ang “pagtitiwala,” kaya binabanggit ito sa talababa.
- source_word: σέσωκέν σε
  choice: iniligtas ka
  rationale: Sinasaklaw ng σῴζω ang pagliligtas, pagpapagaling, at pagpapanumbalik sa mabuting kalagayan. Pinananatili ng “iniligtas ka” ang mas malawak na kahulugan at ang tensiyon sa salaysay, yamang nalinis na sa sakit ang sampu ngunit ang isang ito ang bumalik at lumuwalhati sa Diyos.
theological_decisions:
- issue: Kahulugan ng σέσωκέν σε sa konteksto ng pagpapagaling
  choice: iniligtas ka
  alternative: pinagaling ka / nagpagaling sa iyo
  rationale: Maaaring tumukoy ang pandiwa sa pisikal na paggaling, ngunit maaaring higit pa rito ang ipinahihiwatig ng pagkakaiba ng sampung nalinis at ng isang bumalik upang lumuwalhati sa Diyos. Hindi nililimitahan ng pangunahing salin ang pahayag sa paggaling lamang.
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala
  rationale: Sa kontekstong ito, malamang na tumutukoy ito sa mapagtiwalang pagtugon kay Jesus. Ang “pananampalataya” ay nagpapanatili ng karaniwang teolohikal at leksikal na saklaw, habang inilalahad sa talababa ang likas na alternatibong “pagtitiwala.”
translation_notes:
  register: 'Modernong Filipino na may marangal na himig. Ginamit ang “bumangon” dahil sa agarang konteksto at ang “humayo” upang mapanatili ang maikli at mariing utos. Inilagay ang mga pananda ng talababa sa mismong mga pariralang tinatalakay: [a] sa buong pahayag na “iniligtas ka” at [b] sa “pananampalataya.”'
