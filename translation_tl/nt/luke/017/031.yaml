  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ὃς ἔσται ἐπὶ τοῦ δώματος καὶ τὰ σκεύη αὐτοῦ ἐν τῇ οἰκίᾳ, μὴ καταβάτω ἆραι αὐτά, καὶ ὁ ⸀ἐν ἀγρῷ ὁμοίως μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/031.yaml
  text: On that day, whoever is on the housetop, with his belongings in the house, must not go down to take them away; and likewise, the one in the field must not turn back to the things behind.
translation:
  language: tl
  text: Sa araw na iyon, ang sinumang nasa bubong[a], samantalang nasa loob ng bahay ang kanyang mga gamit, ay huwag nang bumaba upang kunin ang mga iyon. Gayundin, ang nasa bukid ay huwag nang bumalik para kunin ang naiwan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tinutukoy ay patag na bubong ng bahay, na karaniwang naaakyatan at nagagamit na bahagi ng tirahan noong panahong iyon.
    reason: cultural_note
  - marker: b
    text: Sa literal, “huwag bumalik sa mga bagay na nasa likuran”; maaari rin itong isalin nang mas maikli na “huwag nang bumalik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Sa araw na iyon
  rationale: Likas na modernong Tagalog para sa temporal na parirala, habang pinananatili ang diin ng demonstratibong ἐκείνῃ.
- source_word: ὃς ἔσται
  choice: ang sinumang nasa
  rationale: Ipinahahayag ang pangkalahatang bisa ng kamag-anak na parirala na may pandiwang nasa hinaharap, nang hindi pilit na inuulit ang futurity sa Tagalog.
- source_word: ἐπὶ τοῦ δώματος
  choice: nasa bubong
  rationale: Ang δῶμα ay tumutukoy rito sa patag at nagagamit na bubong ng bahay. Natural ang “bubong” sa Tagalog; nililinaw ng talababa ang kontekstong pangkultura.
- source_word: τὰ σκεύη αὐτοῦ
  choice: ang kanyang mga ari-arian
  rationale: Saklaw ng σκεύη ang mga gamit o pag-aari. Ang “mga ari-arian” ay malinaw na tumutukoy sa mga bagay na nasa bahay at maaaring balikan upang kunin.
- source_word: μὴ καταβάτω
  choice: huwag nang bumaba
  rationale: Ang ikatlong panauhang pautos na may μή ay isang mariing pagbabawal. Ipinahihiwatig ng “nang” ang agarang pagtigil sa anumang balak na bumaba.
- source_word: ἆραι αὐτά
  choice: upang kunin ang mga iyon
  rationale: Dito ang αἴρω ay tumutukoy sa pagkuha o pagdadala sa mga pag-aari. Sapat at natural ang “kunin” sa konteksto.
- source_word: ὁ ἐν ἀγρῷ
  choice: ang nasa bukid
  rationale: Maikli at likas na katumbas ng substantival na parirala, at kapantay ng unang paglalarawan.
- source_word: ὁμοίως
  choice: Gayundin
  rationale: Malinaw na iniuugnay ang ikalawang pagbabawal sa una at pinananatili ang paralelismo.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: huwag nang bumalik para sa mga naiwan
  rationale: Ang ἐπιστρέφω ay “bumalik,” samantalang ang εἰς τὰ ὀπίσω ay literal na tumutukoy sa nasa likuran. Sa kontekstong ito, natural na ipinahahayag ng “para sa mga naiwan” ang ipinahihiwatig na layunin nang hindi ginagawang malabo o di-likas ang Tagalog.
theological_decisions:
- issue: Larawan ng apurahang pangyayaring eskatolohikal
  choice: Panatilihin ang kongkretong tagubilin na huwag bumaba o bumalik para sa mga naiwan.
  alternative: Ibuod bilang pangkalahatang babala laban sa pagkakapit sa mga ari-arian.
  rationale: Ang Griyego ay nagbibigay ng tiyak at matingkad na tagpo na kaugnay ng “araw na iyon.” Ang kongkretong salin ay nagpapanatili ng pagkaapurahan at umiiwas sa pagdaragdag ng pangkalahatang moral na paliwanag.
- issue: Saklaw ng εἰς τὰ ὀπίσω
  choice: Isalin bilang “para sa mga naiwan,” na pinananatili ang pahiwatig na may mga bagay na nasa likuran.
  alternative: Isalin lamang bilang “huwag nang lumingon” o “huwag nang bumalik.”
  rationale: Ang anyong neuter plural na τὰ ὀπίσω ay maaaring magpahiwatig ng “mga bagay na nasa likuran.” Pinananatili ng salin ang pahiwatig na iyon, ngunit kinikilala sa talababa ang mas literal na anyo at ang posibilidad ng mas pangkalahatang “bumalik.”
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “huwag nang” upang ihatid ang mariing at apurahang pagbabawal. Ang “kanyang” ay pinanatili para sa malinaw na pagtukoy sa taong nasa bubong; walang idinagdag na denominasyonal na pagpapakahulugan.
