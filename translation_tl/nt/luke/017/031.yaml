  naturalness: May kabigatan at posibleng kalabuan ang "ang sinumang nasa bubong at ang kanyang mga ari-arian ay nasa loob ng bahay," dahil parang magkapantay na paksa ang tao at mga ari-arian. Ang "samantalang nasa loob ng bahay ang kanyang mga gamit" ay mas natural at malinaw. Ang "bumalik para kunin ang naiwan" ay idiomatiko at angkop sa agarang konteksto.
  terminology: Pinalitan ang "mga ari-arian" ng "mga gamit" upang mas tumpak na maihatid ang σκεύη sa kontekstong ito. Pinanatili ang "bubong" na may talababa para sa δῶμα, at ang "mga naiwan" bilang kontekstuwal na pagpapahayag ng εἰς τὰ ὀπίσω nang hindi iginigiit ang isang mas malawak na pagpapakahulugan.
