revisions:
- from: Sa araw na iyon, ang sinumang nasa bubong[a] at ang kanyang mga ari-arian ay nasa loob ng bahay ay huwag nang bumaba upang kunin ang mga iyon. Gayundin, ang nasa bukid ay huwag nang bumalik para sa mga naiwan.[b]
  to: Sa araw na iyon, ang sinumang nasa bubong[a], samantalang nasa loob ng bahay ang kanyang mga gamit, ay huwag nang bumaba upang kunin ang mga iyon. Gayundin, ang nasa bukid ay huwag nang bumalik para kunin ang naiwan.[b]
  rationale: Inayos ang sintaks upang malinaw na ang mga gamit ang nasa loob ng bahay, hindi isang ikalawang pangunahing paksa. Ginamit ang “mga gamit” para sa τὰ σκεύη. Pinanatili ang kongkretong pahiwatig ng pagbabalik upang kunin ang naiwan, habang itinatala ng talababa ang mas literal at mas maikling posibilidad para sa εἰς τὰ ὀπίσω.
