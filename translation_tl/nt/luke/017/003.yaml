  text: προσέχετε ἑαυτοῖς. ἐὰν ⸀ἁμάρτῃ ὁ ἀδελφός σου ἐπιτίμησον αὐτῷ, καὶ ἐὰν μετανοήσῃ ἄφες αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/003.yaml
  text: Pay attention to yourselves[a]. If your brother sins, rebuke him, and if he repents[b], forgive him.
translation:
  language: tl
  text: Mag-ingat kayo sa inyong mga sarili. Kung magkasala[a] ang kapatid mo[b], sawayin mo siya; at kung magsisi siya, patawarin mo siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “Kung magkasala sa iyo ang kapatid mo, sawayin mo siya.”'
    reason: textual_variant
  - marker: b
    text: Panlalaking isahan ang “kapatid” sa Griyego, ngunit maaari itong tumukoy nang mas malawak sa isang kapuwa alagad.
    reason: cultural_note
lexical_decisions:
- source_word: προσέχετε ἑαυτοῖς
  choice: Mag-ingat kayo sa inyong sarili
  rationale: Ipinahahayag ng pangkasalukuyang pautos ang patuloy na pagbabantay. Pinananatili ng “sa inyong sarili” ang reflexive na diwa at ang posibilidad na tumukoy ito kapuwa sa pansarili at pangkomunidad na pag-iingat.
- source_word: ἁμάρτῃ
  choice: magkasala
  rationale: Walang tahasang layon na “sa iyo” sa SBLGNT na teksto, kaya hindi iyon idinagdag sa pangunahing salin.
- source_word: ὁ ἀδελφός σου
  choice: ang kapatid mo
  rationale: Ang “kapatid” ay likas at marangal na katumbas sa Filipino; hindi nito kailangang tukuyin ang kasarian sa anyo ng salita, bagaman panlalaking isahan ang Griyego. Nililinaw sa talababa ang malamang na mas malawak na gamit nito para sa kapuwa alagad.
- source_word: ἐπιτίμησον αὐτῷ
  choice: sawayin mo siya
  rationale: Ang “sawayin” ay malinaw na naghahatid ng tuwiran at seryosong pagtutuwid na hinihingi ng pautos, nang hindi pinahihina bilang payo lamang.
- source_word: μετανοήσῃ
  choice: magsisi
  rationale: Karaniwang salin ito sa kontekstong moral at espirituwal at ipinahahayag ang pagtalikod sa kasalanan, hindi lamang ang pagbabago ng isip.
- source_word: ἄφες αὐτῷ
  choice: patawarin mo siya
  rationale: Sa ugnayang personal, ang ἀφίημι ay natural na nangangahulugang magpatawad; malinaw at pangkaraniwan ang katumbas na Filipino.
theological_decisions:
- issue: Kung isasama ang “sa iyo” pagkatapos ng “magkasala”
  choice: Hindi isinama sa pangunahing teksto
  alternative: Kung magkasala sa iyo ang kapatid mo, sawayin mo siya…
  rationale: Ang ibinigay na SBLGNT ay walang εἰς σέ o katumbas nito. Pinananatili ng pangunahing teksto ang mas malawak na pahayag, habang itinatala sa talababa ang mas mahabang pagbasa ng ilang manuskrito.
- issue: Saklaw ng ἀδελφός
  choice: kapatid mo
  alternative: kapuwa mo alagad / kapatid na lalaki mo
  rationale: Panlalaking isahan ang anyong Griyego, ngunit maaaring kumatawan sa isang kapuwa alagad sa komunidad. Ang “kapatid” ay tapat sa talinghaga ng pagkakapatiran at natural sa Filipino; hindi tahasang nililimitahan ng salitang Filipino ang kasarian, kaya ipinaliliwanag ang saklaw sa talababa nang hindi dinaragdagan ang pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kayo” sa pangmaramihang babala at ang “mo/siya” sa pang-isahang sitwasyong kasunod. Inilagay ang mga pananda ng talababa sa mismong mga pariralang kanilang nililinaw.
