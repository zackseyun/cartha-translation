id: LUK.17.6
reference: Luke 17:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Εἰ ἔχετε πίστιν ὡς κόκκον σινάπεως, ἐλέγετε ἂν τῇ συκαμίνῳ ταύτῃ· Ἐκριζώθητι καὶ φυτεύθητι ἐν τῇ θαλάσσῃ· καὶ ὑπήκουσεν ἂν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/006.yaml
  text: And the Lord said[a], “If you had faith like a mustard seed, you would say to this mulberry tree, ‘Be uprooted and be planted in the sea,’ and it would obey you.”
translation:
  language: tl
  text: Sinabi ng Panginoon, “Kung mayroon kayong pananampalatayang tulad ng isang butil ng mustasa, masasabi ninyo sa punong mulberi[a] na ito, ‘Mabunot ka at maitanim sa dagat,’ at susunod ito sa inyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “punong sikamina,” ang tradisyonal na tawag sa punong tinutukoy ng salitang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang salin ng titulong κύριος sa salaysay ni Lucas; pinananatili nito ang bigat ng titulong ginagamit para kay Jesus.
- source_word: πίστιν
  choice: pananampalataya
  rationale: Sa konteksto, tumutukoy ito sa pagtitiwala sa Diyos, hindi pangunahin sa katapatan bilang ugali.
- source_word: ὡς κόκκον σινάπεως
  choice: tulad ng isang butil ng mustasa
  rationale: Pinananatili ang paghahambing ng ὡς nang hindi nililimitahan ang diwa sa kaliitan lamang.
- source_word: συκαμίνῳ
  choice: punong mulberi
  rationale: Ang συκάμινος ay isang uri ng punong mulberry; ang hiram na modernong katawagang “mulberi” ay mas malinaw kaysa sa transliterasyong “sikamina.”
- source_word: ἐλέγετε ἂν
  choice: masasabi ninyo
  rationale: Likas na Filipino para sa potensiyal na bunga ng kondisyon; hindi ipinapalagay na aktuwal na ginawa na nila ang utos.
- source_word: Ἐκριζώθητι
  choice: Mabunot ka
  rationale: Pinananatili ang pasibong pautos at ang larawan ng lubos na pagkakabunot mula sa mga ugat.
- source_word: φυτεύθητι ἐν τῇ θαλάσσῃ
  choice: maitanim sa dagat
  rationale: Pinananatili ang tahasan at sadyang imposibleng larawan ng pagtatanim sa dagat nang hindi dinaragdagan ng paliwanag.
- source_word: ὑπήκουσεν ἂν ὑμῖν
  choice: susunod ito sa inyo
  rationale: Ang “susunod” ay malinaw na nagpapahayag ng pagtalima sa iniutos at natural sa Filipino.
theological_decisions:
- issue: Diwa ng πίστις sa isang pahayag tungkol sa himala
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Ang konteksto ay tungkol sa pagtitiwala na nakatuon sa Diyos at hindi pangunahin sa matatag na katapatan bilang asal. Hindi ipinapaliwanag sa salin kung anong katangian ng butil ng mustasa ang punto ng paghahambing.
- issue: Lakas ng kondisyong εἰ ἔχετε ... ἄν
  choice: Kung mayroon kayong ... masasabi ninyo
  alternative: Kung mayroon sana kayong ... sasabihin ninyo
  rationale: Pinananatili ang present indicative na ἔχετε at ang potensiyal na ἄν nang hindi labis na ipinapasok sa Filipino ang konklusyong wala silang pananampalataya.
translation_notes:
  register: Modernong, marangal, at madaling maunawaang Filipino. Ginamit ang “punong mulberi” bilang malinaw na karaniwang katawagan, at pinanatili sa talababa ang tradisyonal na alternatibo. Ang pautos sa puno ay tuwiran upang mapanatili ang matingkad na larawan ng orihinal.
