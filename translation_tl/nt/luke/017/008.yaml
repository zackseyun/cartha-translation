revisions:
- from: Sa halip, hindi ba’t sasabihin niya rito, ‘Ihanda mo ang hapunan ko, magbigkis ka[a] at pagsilbihan mo ako hanggang sa makakain at makainom ako[b]; pagkatapos, saka ka kakain at iinom’?”
  to: Sa halip, hindi ba’t sasabihin niya sa kanya, ‘Ihanda mo ang hapunan ko, magbigkis ka ng iyong damit[a] at pagsilbihan mo ako hanggang sa makakain at makainom ako[b]; pagkatapos, saka ka kakain at iinom’?
  rationale: Pinalitan ang maling pang-abay na “rito” ng “sa kanya,” na siyang tuwirang katumbas ng di-tuwirang layon na αὐτῷ. Idinagdag ang “ng iyong damit” kasunod ng “magbigkis ka” upang maging malinaw sa makabagong Filipino ang metaporang pangkasuotan ng περιζωσάμενος; pinananatili ng talababa ang literal na larawan. Inayos ang pangwakas na bantas at pinanatili ang lahat ng footnote anchor at kahulugan.
