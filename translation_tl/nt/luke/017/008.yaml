    issue: “sasbihin niya rito”/“sasabihin niya rito” bilang salin ng ἐρεῖ αὐτῷ
    rationale: Ang “rito” ay pang-abay na panlunan (“dito”), hindi panghalip na tumutukoy sa tatanggap ng pananalita. Dapat itong maging “sasabihin niya sa kanya” upang maisalin ang αὐτῷ.
  - severity: medium
    issue: Hindi magkatugmang pangwakas na panipi at tandang pananong
    rationale: Nagsisimula ang tuwirang sipi sa isang panandang panipi ngunit nagtatapos sa kapwa panandang panipi at dobleng panipi. Inayos ang bantas nang hindi binabago ang kahulugan.
