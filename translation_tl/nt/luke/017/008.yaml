id: LUK.17.8
reference: Luke 17:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλ’ οὐχὶ ἐρεῖ αὐτῷ· Ἑτοίμασον τί δειπνήσω καὶ περιζωσάμενος διακόνει μοι ἕως φάγω καὶ πίω, καὶ μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/008.yaml
  text: On the contrary[a], will he not say to him, ‘Prepare my supper, and gird yourself and serve me until I have eaten and drunk[b], and after that you will eat and drink’?”
translation:
  language: tl
  text: Sa halip, hindi ba’t sasabihin niya sa kanya, ‘Ihanda mo ang hapunan ko, magbigkis ka ng iyong damit[a] at pagsilbihan mo ako hanggang sa makakain at makainom ako[b]; pagkatapos, saka ka kakain at iinom’?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ihanda mo ang iyong sarili sa paglilingkod”; literal, “magbigkis ka,” na tumutukoy sa pagtatali o pagtitiklop pataas ng mahabang kasuotan bilang paghahanda sa trabaho.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “hanggang sa kumain at uminom ako.” Ipinahihiwatig ng konteksto na matatapos muna ang pagkain at pag-inom niya bago makakain at makainom ang kausap.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ οὐχὶ
  choice: Sa halip, hindi ba’t
  rationale: Ipinahahayag nito ang pagsalungat sa naunang posibilidad at pinananatili ang retorikal na tanong na umaasang positibo ang sagot.
- source_word: ἐρεῖ αὐτῷ
  choice: sasabihin niya rito
  rationale: Tuwirang pinananatili ang pandiwang ‘sabihin’ at ang di-tuwirang layon, nang hindi nagdaragdag ng pangngalang wala sa talata.
- source_word: Ἑτοίμασον τί δειπνήσω
  choice: Ihanda mo ang hapunan ko
  rationale: Natural sa modernong Tagalog at malinaw na inilalarawan ang pagkaing ihahanda para sa panggabing pagkain ng nagsasalita.
- source_word: περιζωσάμενος
  choice: magbigkis ka
  rationale: Pinananatili ang kongkretong larawan ng pagbibigkis o pagtatali ng kasuotan bilang paghahanda sa paglilingkod; ipinaliliwanag ito sa talababa.
- source_word: διακόνει μοι
  choice: pagsilbihan mo ako
  rationale: Sa konteksto, tumutukoy ito sa personal o serbisyong panghapag; mas natural at hindi eklesyastikal ang ‘pagsilbihan.’
- source_word: ἕως φάγω καὶ πίω
  choice: hanggang sa makakain at makainom ako
  rationale: Ang ‘hanggang sa’ ay nagpapanatili sa hangganang temporal; ang mga pandiwang makakain at makainom ay natural na nagpapahiwatig na mauuna at matatapos ang pagkain at pag-inom ng amo bago ang kasunod na kilos.
- source_word: μετὰ ταῦτα
  choice: pagkatapos
  rationale: Maikli, natural, at tumpak na katumbas ng temporal na parirala.
- source_word: φάγεσαι καὶ πίεσαι σύ
  choice: saka ka kakain at iinom
  rationale: 'Pinananatili ang hinaharap na kilos at naihahayag ng ‘saka ka’ ang diin sa σύ at ang pagkakasunod: pagkatapos lamang darating ang pagkakataon niya.'
theological_decisions:
- issue: Pagtukoy sa katayuang panlipunan sa talinghaga
  choice: Panatilihin ang mga panghalip at utos nang hindi idinaragdag ang ‘alipin’ o ‘lingkod’ sa talata.
  alternative: Idagdag ang ‘lingkod’ o ‘alipin’ upang linawin ang tinutukoy mula sa konteksto.
  rationale: Bagaman δοῦλος ang tinutukoy sa nakapaligid na konteksto, walang gayong pangngalan sa mismong talata. Iniiwasan ng salin ang pagdaragdag habang nananatiling malinaw ang ugnayan sa pamamagitan ng mga utos at paglilingkod.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinanatili ang retorikal na anyo at ang sinaunang larawang ‘magbigkis,’ ngunit nilinaw ito sa talababa. Ginamit ang ‘rito’ bilang likas na anyo ng ‘sa kaniya’ kapag ang tinutukoy ay malapit sa paksa ng pangungusap.
