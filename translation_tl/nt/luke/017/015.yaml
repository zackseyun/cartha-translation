  text: εἷς δὲ ἐξ αὐτῶν, ἰδὼν ὅτι ἰάθη, ὑπέστρεψεν μετὰ φωνῆς μεγάλης δοξάζων τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/015.yaml
  text: But one of them[a], seeing that he had been healed, returned, glorifying God with a loud voice,
translation:
  language: tl
  text: Ngunit nang makita ng isa sa kanila na gumaling na siya, bumalik siya habang niluluwalhati ang Diyos[a] sa malakas na tinig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinupuri ang Diyos.” Ang pandiwang Griego ay maaaring mangahulugang “niluluwalhati” o “nagbibigay ng papuri o luwalhati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δὲ ἐξ αὐτῶν
  choice: Ngunit ... ng isa sa kanila
  rationale: Malinaw ang partitive na diwa ng εἷς ἐξ αὐτῶν bilang “isa sa kanila.” Ipinahihiwatig ng δέ ang banayad na pagsalungat sa ginawa ng siyam, kaya ang “ngunit” ay angkop sa daloy ng salaysay.
- source_word: ἰδὼν
  choice: nang makita
  rationale: Ang aorist participle ay tumutukoy sa pagkakitang nag-udyok sa kanyang pagbabalik. Ang “nang makita” ay likas sa Tagalog at hindi labis na nagtatakda ng pagitan ng dalawang kilos.
- source_word: ὅτι ἰάθη
  choice: na gumaling na siya
  rationale: Ang ἰάθη ay aorist passive ng ἰάομαι at tumutukoy sa naganap nang paggaling. Sa modernong Tagalog, likas at malinaw ang “gumaling na siya”; ipinapakita ng “na” na batid na niyang ganap na ang paggaling, nang hindi dinaragdagan kung sino ang direktang gumawa nito.
- source_word: ὑπέστρεψεν
  choice: bumalik siya
  rationale: Karaniwang kahulugan ng ὑποστρέφω sa salaysay ang pagbabalik. Ang “bumalik siya” ay tuwiran at natural, at tugma sa pagkilos pabalik kay Jesus na makikita sa konteksto.
- source_word: μετὰ φωνῆς μεγάλης
  choice: sa malakas na tinig
  rationale: Ang parirala ay nagsasaad na malakas ang kanyang pagsasalita o pagsigaw. Pinananatili ng “sa malakas na tinig” ang larawan ng tinig habang nananatiling dignified at madaling maunawaan.
- source_word: δοξάζων τὸν θεόν
  choice: niluluwalhati ang Diyos
  rationale: Ang δοξάζω ay maaaring mangahulugang “luwalhatiin,” “magbigay-luwalhati,” o “purihin.” Pinananatili ng “niluluwalhati” ang tahasang ugnayan sa konsepto ng kaluwalhatian; inilalahad sa talababa ang natural na alternatibong “pinupuri.”
theological_decisions:
- issue: Pagkakasalin ng τὸν θεόν
  choice: ang Diyos
  alternative: —
  rationale: Payak na sinasabi ng talata na niluluwalhati ng taong gumaling ang Diyos. Ang “ang Diyos” ay eksaktong tumutugma rito nang walang idinagdag na paliwanag o doktrinal na pagpapalawak.
- issue: Di-tiyak na ahensiya sa ἰάθη
  choice: gumaling na siya
  alternative: pinagaling na siya
  rationale: Passive ang anyong Griego, ngunit hindi tahasang pinapangalanan sa sugnay ang gumawa ng pagpapagaling. Ang likas na Tagalog na “gumaling na siya” ay hindi nagdaragdag ng tahasang ahensiya; nananatiling malinaw mula sa konteksto na siya ay napagaling.
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “habang” upang maipakita ang kasabay na kilos ng participle δοξάζων, at iniwasan ang mas luma o mabigat na ayos ng pangungusap.
