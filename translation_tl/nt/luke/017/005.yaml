  text: Καὶ εἶπαν οἱ ἀπόστολοι τῷ κυρίῳ· Πρόσθες ἡμῖν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/005.yaml
  text: And the apostles said to the Lord[b][a], “Increase our faith.”
translation:
  language: tl
  text: At sinabi ng mga apostol sa Panginoon, “Dagdagan[a] mo ang aming pananampalataya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Magdagdag ka ng pananampalataya sa amin.” Literal na “magdagdag” ang pandiwang Griyego, ngunit ang diwa rito ay gawin pang higit ang kanilang pananampalataya.
    reason: lexical_alternative
  - marker: b
    text: Ang “pananampalataya” ay maaari ring unawain bilang “pagtitiwala.” Sa ibang konteksto, ang salitang Griyego ay maaari ring mangahulugang “katapatan,” ngunit hindi ito gaanong malamang dito.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang payak na pagkakaugnay sa naunang salaysay nang hindi nagdaragdag ng tiyak na diwang temporal.
- source_word: εἶπαν
  choice: sinabi
  rationale: Ang aorist indicative ay likas na isinasalin bilang payak na naganap na kilos sa salaysay.
- source_word: οἱ ἀπόστολοι
  choice: ang mga apostol
  rationale: Ang “mga apostol” ang nakagawian at tumpak na tawag sa mga isinugo ni Jesus sa kontekstong ito.
- source_word: τῷ κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ng “Panginoon” ang kapuwa paggalang sa pakikipag-usap at ang bigat ng titulong ginagamit kay Jesus sa Lucas.
- source_word: Πρόσθες
  choice: Dagdagan mo
  rationale: Tuwirang sinasalamin ang pangunahing diwa ng pandiwang προστίθημι, “magdagdag,” at natural ding ipinahahayag sa Filipino ang kahilingang magkaroon sila ng higit na pananampalataya.
- source_word: ἡμῖν
  choice: aming
  rationale: Ang literal na datibong “sa amin” ay likas na naipapahayag sa Filipino bilang panghalip na paari kasama ng “pananampalataya.”
- source_word: πίστιν
  choice: pananampalataya
  rationale: Ito ang karaniwan at angkop na salin dito; tumutukoy ito lalo na sa kanilang pananalig o pagtitiwala, habang ang lawak ng kahulugan ay itinatala sa talababa.
theological_decisions:
- issue: Pagtukoy kay Jesus bilang κύριος
  choice: Panginoon
  alternative: Guro o amo
  rationale: Ang “Panginoon” ay ang likas na titulong ginagamit kay Jesus at hindi binabawasan ang posibleng Kristolohikal na bigat ng katawagan.
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Sa kahilingan ng mga apostol, pinakamalamang na ang tinutukoy ay kanilang pananampalataya o pagtitiwala. Gayunman, pinananatili sa talababa ang mas malawak na saklaw ng salita nang hindi ipinipilit ang hindi gaanong malamang na “katapatan.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “aming” sa halip na mas kolokyal na “namin,” at iniwasan ang pagdaragdag ng “po” sapagkat wala itong tuwirang katumbas sa tekstong Griyego.
