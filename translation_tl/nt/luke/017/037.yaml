id: LUK.17.37
reference: Luke 17:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες λέγουσιν αὐτῷ· Ποῦ, κύριε; ὁ δὲ εἶπεν αὐτοῖς· Ὅπου τὸ σῶμα, ἐκεῖ ⸂καὶ οἱ ἀετοὶ ἐπισυναχθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/037.yaml
  text: And answering[a], they say to him, “Where, Lord?” And he said to them, “Where the body is[b], there also the vultures will be gathered.”
translation:
  language: tl
  text: Sumagot sila sa kanya, “Saan, Panginoon?” Sinabi niya sa kanila, “Kung nasaan ang katawan[a], doon din titipunin ang mga buwitre[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bangkay.” Ipinahihiwatig ng paglapit ng mga ibong kumakain ng patay na hayop na patay na katawan ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga agila.” Maaaring tumukoy sa mga agila ang salitang Griyego, ngunit sa kontekstong may mga ibong nagtitipon sa isang katawan, malamang na “mga buwitre” ang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες … λέγουσιν
  choice: Sumagot sila sa kanya
  rationale: Likas sa makabagong Tagalog ang ganitong pagsasalin ng participle at historical present, habang malinaw na naipakikitang tugon ito ng mga kausap ni Jesus.
- source_word: Ποῦ
  choice: Saan
  rationale: Tuwirang tanong ito tungkol sa lugar; pinananatili ng maikling “Saan?” ang pagiging palaisipan ng tanong sa konteksto.
- source_word: κύριε
  choice: Panginoon
  rationale: Ito ang karaniwan at marangal na katumbas ng κύριε bilang tuwirang tawag kay Jesus.
- source_word: Ὅπου
  choice: Kung nasaan
  rationale: Natural itong pambungad sa isang pangkalahatan o kasabihang pahayag sa Tagalog nang hindi dinaragdagan ang kahulugan.
- source_word: σῶμα
  choice: katawan
  rationale: Ito ang pangunahing kahulugan ng σῶμα at hindi nito tahasang ginagawang bangkay ang tinutukoy, bagaman ipinahihiwatig iyon ng larawan.
- source_word: ἀετοὶ
  choice: mga buwitre
  rationale: Bagaman maaari itong tumukoy sa mga agila, mas malinaw na ipinahihiwatig ng konteksto ang mga ibong kumakain ng patay na hayop.
- source_word: ἐπισυναχθήσονται
  choice: titipunin
  rationale: Pinananatili nito ang future passive ng Griyego at hindi tinutukoy kung sino o ano ang magtitipon sa mga ibon.
theological_decisions:
- issue: Kahulugan ng larawang kasabihan tungkol sa katawan at mga buwitre
  choice: Isinalin nang tuwiran ang larawan nang hindi tinutukoy ang partikular na katuparan nito.
  alternative: Ipaliwanag ito bilang hukom sa wakas, pagsalakay ng Roma, o pangkalahatang simulain tungkol sa di-maiiwasang paghatol.
  rationale: Hindi tinutukoy ng mismong Griyego ang referent ng larawan, kaya pinananatili ng salin ang tunay na tensiyon at pagiging bukas nito sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at palaisipang tanong na “Saan, Panginoon?” at ang kasabihang anyo ng sagot. Iniwasan ang pagpapaliwanag sa loob ng teksto kung ano ang tiyak na tinutukoy ng larawan.
