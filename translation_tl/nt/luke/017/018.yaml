  text: οὐχ εὑρέθησαν ὑποστρέψαντες δοῦναι δόξαν τῷ θεῷ εἰ μὴ ὁ ἀλλογενὴς οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/018.yaml
  text: Were none found to return and give glory to God except this foreigner?[a]
translation:
  language: tl
  text: Wala bang natagpuang bumalik upang magbigay ng kaluwalhatian sa Diyos maliban sa dayuhang ito?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “taong ito na mula sa ibang bayan” o “estrangherong ito.” Ang salitang Griyego ay tumutukoy sa isang dayuhan—isang taong hindi kabilang sa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρέθησαν
  choice: natagpuan
  rationale: Pinananatili nito ang anyong pasibo ng aorist, habang ang “Wala bang natagpuang…” ay likas na retorikal na tanong sa Filipino.
- source_word: ὑποστρέψαντες
  choice: bumalik
  rationale: Malinaw at natural na ipinahahayag ang pagbabalik bilang kilos na kaugnay ng pagbibigay ng kaluwalhatian.
- source_word: δοῦναι δόξαν
  choice: magbigay ng kaluwalhatian
  rationale: Pinananatili ang literal at kinikilalang biblikal na idyomang “magbigay ng kaluwalhatian,” sa halip na paliitin ito sa “magpuri.”
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Ito ang natural na katumbas sa Filipino sa ganitong parirala.
- source_word: εἰ μὴ
  choice: maliban sa
  rationale: Likas at eksaktong ipinapahayag ang pagbubukod sa retorikal na tanong.
- source_word: ἀλλογενής
  choice: dayuhan
  rationale: Ipinahahayag nito na ang tao ay mula sa ibang bayan at nasa labas ng Israel, nang hindi nagdaragdag ng polemikong kahulugan.
- source_word: οὗτος
  choice: ito
  rationale: Pinananatili ang diin ng demonstratibo sa pariralang “dayuhang ito.”
theological_decisions:
- issue: Katayuan ng pinagaling na lalaki bilang etniko at panrelihiyong tagalabas
  choice: dayuhang ito
  alternative: taong ito na mula sa ibang bayan; estrangherong ito
  rationale: Binibigyang-diin ng talata ang kabalintunaang ang nagbalik upang parangalan ang Diyos ay isang tagalabas. Ang “dayuhan” ay malinaw at hindi tahasang nagdaragdag ng pagkakakilanlang “Samaritano” na wala sa mismong pangungusap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang retorikal na tanong at ang biblikal na idyomang “magbigay ng kaluwalhatian sa Diyos.”
