  naturalness: Mas likas sa modernong Filipino ang “sumagot siya sa kanila:” kaysa “sumagot siya sa kanila at sinabi,” at ang “sa paraang maaaring mapagmasdan” kaysa “sa paraang mapagmamasdan” sa isang pangkalahatang pahayag.
