  text: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ ἀπεκρίθη αὐτοῖς καὶ εἶπεν· Οὐκ ἔρχεται ἡ βασιλεία τοῦ θεοῦ μετὰ παρατηρήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/020.yaml
  text: When he was asked by the Pharisees when the kingdom of God was coming[a], he answered them and said, “The kingdom of God does not come with observable signs,”
translation:
  language: tl
  text: 'Nang tanungin siya ng mga Pariseo kung kailan darating ang kaharian ng Diyos, sumagot siya sa kanila: “Hindi dumarating ang kaharian ng Diyos sa paraang maaaring mapagmasdan[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “na may pagmamasid,” “sa paraang napagmamasdan,” o “sa paraang masusing binabantayan.”'
    reason: 'Iba-iba ang maaaring diwa ng παρατήρησις: pagmamasid, pagiging napagmamasdan, o masusing pagbabantay/pagsubaybay.'
lexical_decisions:
- source_word: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων
  choice: Nang tanungin siya ng mga Pariseo
  rationale: Ginawang likas na sugnay na pangyayari sa Tagalog ang aorist passive participle, habang pinananatili ang pasibong diwa at ang mga Pariseo bilang gumagawa ng pagtatanong. Hindi na ginamitan ng hiwalay na panandang diskurso para sa mahinang δέ sapagkat sapat na ang daloy ng sugnay na “Nang.”
- source_word: πότε ἔρχεται
  choice: kung kailan darating
  rationale: Ang πότε ay tuwirang tanong sa panahon, at ang present na ἔρχεται ay may inaasahang o hinaharap na puwersa sa konteksto; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “darating.”
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Karaniwan, malinaw, at teolohikal na makikilalang salin ng parirala nang hindi binabago ang ugnayang genitibo.
- source_word: ἀπεκρίθη αὐτοῖς καὶ εἶπεν
  choice: sumagot siya sa kanila at sinabi
  rationale: Pinanatili ang dalawang pandiwa ng Griyego, kahit may bahagyang pag-uulit, sa paraang katanggap-tanggap sa marangal na salaysay sa Tagalog.
- source_word: Οὐκ ἔρχεται
  choice: ay hindi dumarating
  rationale: Iningatan ang pangkasalukuyang pangkalahatang pahayag tungkol sa paraan ng pagdating ng kaharian, sa halip na gawing isang beses lamang na pangyayari.
- source_word: μετὰ παρατηρήσεως
  choice: sa paraang mapagmamasdan
  rationale: Ipinahahayag nito na ang pagdating ay hindi sa paraang masusubaybayan o makikilala sa pamamagitan ng panlabas na pagmamasid. Hindi isinama sa pangunahing teksto ang salitang “mga tanda,” na wala namang tahasang katumbas sa Griyego.
theological_decisions:
- issue: Kahulugan ng pagtanggi ni Jesus tungkol sa pagdating ng kaharian
  choice: Hindi dumarating ang kaharian sa paraang maaaring subaybayan o matukoy sa pamamagitan ng panlabas na pagmamasid.
  alternative: Hindi maaaring makita ang kaharian sa anumang kahulugan; o itinatanggi ni Jesus ang lahat ng apokaliptikong tanda.
  rationale: Pinananatili ng salin ang saklaw at tensiyon ng μετὰ παρατηρήσεως nang hindi nagpapasya na walang anumang tanda o anumang posibilidad na makilala ang pagkilos ng kaharian.
translation_notes:
  register: Makabago at marangal na Filipino. Likas ang ayos ng pangungusap ngunit pinananatili ang pasibong panimulang pangyayari, ang dobleng pandiwa sa pagsagot, at ang leksikal na kalabuan ng παρατήρησις. Nasa pangunahing teksto ang marker na [a] at tumutugma ito sa tala.
