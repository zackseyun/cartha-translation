id: LUK.17.35
reference: Luke 17:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂ἔσονται δύο⸃ ἀλήθουσαι ἐπὶ τὸ αὐτό, ⸀ἡ μία παραλημφθήσεται ⸂ἡ δὲ⸃ ἑτέρα ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/035.yaml
  text: There will be two women grinding together[a]; one will be taken[b], but the other will be left.
translation:
  language: tl
  text: May dalawang babaeng magkasamang naggigiling[a]; kukunin ang isa[b], ngunit iiwan ang isa pa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa iisang lugar.” Ang pananalitang Griyego ay maaaring mangahulugang “magkasama” o “nasa iisang lugar.”
    reason: lexical_alternative
  - marker: b
    text: Hindi tinutukoy ng “kukunin” kung ang pagkuha ay para sa kaligtasan o para sa paghatol; ipinauubaya ito ng Griyego sa mas malawak na konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσονται δύο
  choice: May dalawang babae
  rationale: Likas na Filipino ang eksistensiyal na “may” upang ipakilala ang tagpo; ang “babae” ay tahasang ibinibigay ng pambabaeng anyo ng participleng ἀλήθουσαι.
- source_word: ἀλήθουσαι
  choice: naggigiling
  rationale: Tumutukoy sa gawaing paggiling, karaniwang ng butil. Hindi na idinagdag ang “ng butil” dahil ipinahihiwatig na ito ng pandiwa.
- source_word: ἐπὶ τὸ αὐτό
  choice: magkasama
  rationale: Natural na salin ng idyomang maaaring mangahulugang magkasama o nasa iisang lugar; inilalahad sa talababa ang leksikal na alternatibo.
- source_word: ἡ μία παραλημφθήσεται
  choice: kukunin ang isa
  rationale: Pinananatili ang future passive at hindi tinutukoy kung ang pagkuha ay para sa kaligtasan o sa paghatol.
- source_word: ἡ δὲ ἑτέρα ἀφεθήσεται
  choice: ngunit iiwan ang isa pa
  rationale: Ipinakikita ng “ngunit” ang paghahambing na dala ng δέ, at tuwirang isinasalin ng “iiwan” ang passive na ἀφεθήσεται nang hindi dinaragdagan ng “sa likuran” o “pababayaan.”
theological_decisions:
- issue: Kung ang kukunin o ang iiwan ang tumatanggap ng kaligtasan o paghatol
  choice: Panatilihin ang payak na “kukunin ang isa, ngunit iiwan ang isa pa.”
  alternative: Tukuying ang isa ay kukunin para sa kaligtasan o sa paghatol, at bigyan ng kabaligtarang kahulugan ang pag-iwan.
  rationale: Ang mismong Griyego ay nagsasaad lamang ng paghihiwalay at hindi tahasang nagpapasiya sa teolohikal na kahulugan ng dalawang kalagayan. Kaya pinananatili ng salin ang tunay na tensiyon sa konteksto.
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang karaniwang “naggigiling,” “kukunin,” at “iiwan,” at iniwasan ang teknikal o denominasyonal na pananalita.
