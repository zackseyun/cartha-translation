id: LUK.17.34
reference: Luke 17:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, ταύτῃ τῇ νυκτὶ ἔσονται δύο ἐπὶ κλίνης μιᾶς, ⸀ὁ εἷς παραλημφθήσεται καὶ ὁ ἕτερος ἀφεθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/034.yaml
  text: I tell you[a], on that night there will be two on one bed; one will be taken[b], and the other will be left.
translation:
  language: tl
  text: 'Sinasabi ko sa inyo: sa gabing iyon, may dalawang tao sa iisang higaan. Ang isa ay kukunin[a], at ang isa naman ay iiwan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isasama.” Hindi nililinaw ng pandiwa rito kung ang pagkuha ay para sa pagliligtas o para sa paghatol.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “maiiwan.” Ginamit sa pangunahing teksto ang “iiwan” upang hindi magdagdag ng mga kaugnayang eskatolohikal na hindi tahasang sinasabi ng Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Sinasabi ko sa inyo
  rationale: Likas at tuwirang pormula ng pagsasalita sa makabagong Tagalog, habang pinananatili ang mariing pagharap sa mga kausap.
- source_word: ταύτῃ τῇ νυκτί
  choice: sa gabing iyon
  rationale: Tumutukoy ang demonstratibo at panandang pamanahon sa isang tiyak na gabing tinatanaw sa konteksto.
- source_word: ἔσονται δύο
  choice: may dalawang tao
  rationale: Natural sa Tagalog ang eksistensiyal na 'may'; malinaw sa konteksto na mga tao ang tinutukoy ng 'dalawa.' Ang hinaharap na panahon ay naipahihiwatig ng 'sa gabing iyon.'
- source_word: ἐπὶ κλίνης μιᾶς
  choice: sa iisang higaan
  rationale: Sa konteksto ng gabi, ang κλίνη ay pinakamalinaw na 'higaan.' Ang 'iisang' ay natural na nagpapahayag na magkasama sila sa isang higaan.
- source_word: ὁ εἷς
  choice: ang isa
  rationale: Natural na substantibong katumbas sa Tagalog sa pares na 'ang isa ... ang isa naman.'
- source_word: παραλημφθήσεται
  choice: kukunin
  rationale: Pinananatili ng anyong pokus sa layon ang pasibong diwa. Hindi nito tinutukoy kung ang pagkuha ay para sa pagliligtas o sa paghatol.
- source_word: ὁ ἕτερος
  choice: ang isa naman
  rationale: Malinaw at natural na itinatangi ang ikalawang tao mula sa una.
- source_word: ἀφεθήσεται
  choice: iiwan
  rationale: Sa pagkakasalungat nito sa 'kukunin,' ang kahulugan ay pag-iwan, hindi pagpapatawad. Iniwasan ang mas interpretatibong pariralang maaaring magpasok ng mga kaugnayang eskatolohikal na wala mismo sa Griyego.
theological_decisions:
- issue: Kung ang kukunin ang maliligtas at ang iiwan ang hahatulan, o kabaligtaran
  choice: 'Nanatiling walang kinikilingang paliwanag ang pangunahing teksto: ''Ang isa ay kukunin, at ang isa naman ay iiwan.'''
  alternative: Maaaring ang isa ay kunin tungo sa kaligtasan, o kunin tungo sa paghatol.
  rationale: Hindi nilulutas ng mga pandiwang Griyego sa talatang ito lamang kung alin sa dalawang tao ang inililigtas o hinahatulan. Pinananatili ng salin ang tunay na teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang 'higaan' sa halip na mas lumang 'hihigan' o mas tiyak na 'kama.' Ang maikling magkatambal na 'kukunin ... iiwan' ay nagpapanatili sa diin at pagkakatimbang ng Griyego.
