  text: ὥσπερ γὰρ ἡ ⸀ἀστραπὴ ἀστράπτουσα ἐκ τῆς ⸂ὑπὸ τὸν⸃ οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν λάμπει, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐν τῇ ἡμέρᾳ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/024.yaml
  text: For just as lightning, flashing from one part under heaven to the other part under heaven, shines[b][a], so will the Son of Man be in his day.
translation:
  language: tl
  text: Sapagkat kung paanong ang kidlat na kumikislap mula sa isang dako sa ilalim ng langit hanggang sa kabilang dako sa ilalim ng langit ay nagliliwanag,[a] magiging gayon din ang Anak ng Tao sa kanyang araw.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas likas na pananalita, “mula sa isang dulo ng langit hanggang sa kabilang dulo.” Sa Griyego, inuulit ang “sa ilalim ng langit” sa magkabilang bahagi ng pahayag.
    reason: lexical_alternative
  - marker: b
    text: O, “sa araw na nauukol sa kanya.” Tumutukoy ang parirala sa panahong kaugnay ng Anak ng Tao at sadyang hindi ito nililimitahan sa mas tiyak na kahulugan.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Sapagkat kung paanong
  rationale: Pinananatili ang paliwanag na diwa ng γάρ at ang paghahambing na ipinakikilala ng ὥσπερ sa likas na Tagalog.
- source_word: ἀστραπὴ ἀστράπτουσα
  choice: ang kidlat, sa pagkislap nito
  rationale: Ginagamit ang karaniwang salitang “kidlat” at pinananatili ang masiglang kilos ng participle nang hindi inuulit nang alanganin ang parehong ugat sa Tagalog.
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανὸν ... εἰς τὴν ὑπ’ οὐρανόν
  choice: mula sa isang panig sa silong ng langit hanggang sa kabilang panig sa silong ng langit
  rationale: Pinananatili ang pag-uulit ng “sa silong ng langit” at ipinahahayag ang magkatapat na pinagmulan at hantungan na ipinahihiwatig ng dalawang parirala.
- source_word: λάμπει
  choice: ay nagliliwanag
  rationale: Ibinubukod ito sa naunang ἀστράπτουσα (“pagkislap”) upang maipakita na dalawang magkaugnay ngunit hindi magkaparehong pandiwa ang ginamit.
- source_word: οὕτως ἔσται
  choice: magiging gayon din
  rationale: Pinananatili ang payak na hinaharap at ang paghahambing, nang hindi dinaragdagan ng tiyak na paliwanag tungkol sa paraan ng pagpapakita.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Ito ang kinikilalang salin ng titulo at hindi ito pinapalitan ng isang interpretatibong pagpapakahulugan.
- source_word: ἐν τῇ ἡμέρᾳ αὐτοῦ
  choice: sa kanyang araw
  rationale: Pinananatili ang malawak at pag-aaring diwa ng parirala, nang hindi ito pinalalawak bilang pagparito o araw ng paghuhukom.
theological_decisions:
- issue: Ang kahulugan ng “Anak ng Tao ... sa kanyang araw” sa kontekstong eskatolohikal
  choice: Panatilihin ang “sa kanyang araw.”
  alternative: “sa kanyang pagparito” o “sa araw ng paghuhukom”
  rationale: Bagaman eskatolohikal ang konteksto, “sa kanyang araw” lamang ang tahasang sinasabi ng Griyego. Iniiwasan nitong magpasok ng teolohikal na katiyakang wala mismo sa talata.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang bahagyang di-karaniwang pag-uulit ng “sa silong ng langit” dahil mahalaga ito sa anyo ng Griyego, samantalang inilagay sa talababa ang mas idiomatikong anyo.
