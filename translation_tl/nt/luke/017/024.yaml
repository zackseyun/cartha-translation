revisions:
- from: Sapagkat kung paanong ang kidlat, sa pagkislap nito mula sa isang panig sa silong ng langit hanggang sa kabilang panig sa silong ng langit, ay nagliliwanag,[a] magiging gayon din ang Anak ng Tao sa kanyang araw.[b]
  to: Sapagkat kung paanong ang kidlat na kumikislap mula sa isang dako sa ilalim ng langit hanggang sa kabilang dako sa ilalim ng langit ay nagliliwanag,[a] magiging gayon din ang Anak ng Tao sa kanyang araw.[b]
  rationale: Pinakinis ang Tagalog nang hindi binabago ang saklaw ng paghahambing o nilulutas ang eskatolohikal na kahulugang iniwang malawak ng Griyego. Napanatili ang pag-uulit ng “sa ilalim ng langit,” ang pagkakaiba ng pagkislap at pagliwanag, at ang hindi interpretatibong “sa kanyang araw.”
  reviewer_model: gpt-5.6-terra
