  text: μνημονεύετε τῆς γυναικὸς Λώτ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/032.yaml
  text: Remember Lot's wife[a][b].
translation:
  language: tl
  text: Alalahanin ninyo ang asawa ni Lot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tumutukoy ito sa Genesis 19:26, kung saan lumingon ang asawa ni Lot habang winawasak ang Sodoma.
    reason: cross_reference
lexical_decisions:
- source_word: μνημονεύετε
  choice: Alalahanin ninyo
  rationale: Ang pangkasalukuyang aktibong pautos na nasa ikalawang panauhang maramihan ay likas na naipapahayag sa modernong Tagalog bilang “Alalahanin ninyo.” Pinananatili nito ang tuwiran at patuloy na bisa ng babala nang hindi labis na ipinapaliwanag ang aspekto.
- source_word: τῆς γυναικὸς
  choice: ang asawa
  rationale: Maaaring mangahulugan ang γυνή ng “babae” o “asawa,” ngunit sa kaugnayang genitibo kay Lot, malinaw na “asawa” ang diwa. Ang “asawa ni Lot” ang likas na anyo sa Tagalog.
- source_word: Λώτ
  choice: Lot
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Tagalog.
theological_decisions:
- issue: Anyo ng babala at pahiwatig sa salaysay ng Genesis
  choice: 'Pinanatili ang maikli at tuwirang utos: “Alalahanin ninyo ang asawa ni Lot.”'
  alternative: “Lagi ninyong isaisip ang asawa ni Lot.”
  rationale: Ang payak na pautos ay tapat sa maigsi at mariing babala ni Jesus at hindi nagdaragdag ng paliwanag sa mismong talata. Ang kaugnayan sa Genesis 19:26 ay inilagay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, natural, at marangal. Ginamit ang maramihang “ninyo” upang panatilihin ang bilang ng pautos sa Griyego. Hindi na kailangan ng hiwalay na talababa para sa literal na “asawa ni Lot,” sapagkat iyon na rin ang natural at malapit na anyo sa Tagalog.
