lexical_decisions:
- source_word: εἰσερχομένου αὐτοῦ
  choice: Habang pumapasok siya
  rationale: Ipinahihiwatig ng genitive absolute na may present participle na kasabay at nagpapatuloy ang kilos; pinananatili ng “habang pumapasok” ang aspektong ito.
- source_word: εἴς τινα κώμην
  choice: sa isang nayon
  rationale: Indefinite ang τινα. Likas sa modernong Tagalog ang “isang nayon”; ang “isang tiyak na nayon” ay masyadong mabigat at maaaring magpahiwatig ng diin na wala naman sa konteksto.
- source_word: ἀπήντησαν
  choice: sinalubong siya
  rationale: Maaaring mangahulugan ang pandiwa ng pagharap o pagpunta upang salubungin ang isang tao. Malinaw at natural ang “sinalubong siya” at hindi nito ginagawang tila nagkataon lamang ang pagkikita.
- source_word: δέκα λεπροὶ ἄνδρες
  choice: sampung lalaking may ketong
  rationale: Natural at magalang sa kasalukuyang Tagalog ang paglalarawang “may ketong.” Hindi nito itinuturing na buong pagkakakilanlan ng mga lalaki ang kanilang karamdaman. Nililinaw sa talababa na mas malawak ang sinaunang katawagan kaysa sa isang eksaktong modernong diyagnosis.
- source_word: οἳ ἔστησαν
  choice: Tumayo sila
  rationale: Pinananatili nito ang payak na diwa ng ἵστημι at malinaw na tinutukoy ang sampung lalaki. Ang paghahati sa dalawang pangungusap ay mas natural sa Tagalog nang hindi binabago ang ugnayan ng mga sugnay.
- source_word: πόρρωθεν
  choice: sa malayo
  rationale: Karaniwan at malinaw itong panandang panlunan para sa pagkakatayo nang may agwat; pinananatili rin nito ang posibleng diin ng salitang Griyego sa layo.
theological_decisions:
- issue: Paglalarawan sa λεπροί
  choice: mga lalaking may ketong
  alternative: mga ketongin; mga lalaking may sakit sa balat
  rationale: Karaniwang katumbas sa salin-Bibliya ang “ketong,” ngunit hindi dapat ipakahulugang tiyak na katumbas ito ng modernong Hansen’s disease. Ang person-first na anyo ay natural at marangal, samantalang pinananatili ng talababa ang saklaw at kalabuan ng sinaunang katawagan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “nayon” sa halip na mas kolokyal na “baryo,” at iniwasan ang mapanlait o sobrang medikal na paglalarawan sa karamdaman.
