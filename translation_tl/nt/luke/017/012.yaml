  text: And as he was entering a certain village[a], ten leprous men met him, who stood at a distance[b],
translation:
  language: tl
  text: Habang pumapasok siya sa isang nayon, sinalubong siya ng sampung lalaking may ketong[a], na nakatayo sa may kalayuan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sampung ketongin.” Ang Griyegong λεπροί ay sinaunang katawagan para sa isang kalagayang may kinalaman sa balat at hindi laging eksaktong katumbas ng sakit na tinatawag ngayong Hansen’s disease.
