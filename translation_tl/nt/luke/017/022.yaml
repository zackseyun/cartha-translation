reference: Luke 17:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητάς· Ἐλεύσονται ἡμέραι ὅτε ἐπιθυμήσετε μίαν τῶν ἡμερῶν τοῦ υἱοῦ τοῦ ἀνθρώπου ἰδεῖν καὶ οὐκ ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/022.yaml
  text: Then he said to the disciples[a], “Days are coming when you will long to see one of the days of the Son of Man[b], and you will not see it.”
translation:
  language: tl
  text: 'Sinabi naman niya sa mga alagad: “Darating ang mga araw na pananabikan ninyong makita ang isa sa mga araw ng Anak ng Tao,[a] at hindi ninyo ito makikita.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga araw ng Anak ng Tao” ay maaaring tumukoy sa panahon ng kaniyang presensiya at gawain, o mas tiyak sa kaniyang paghahayag sa hinaharap. Bukas sa mga saklaw na ito ang pananalita sa Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Pagkatapos, sinabi niya
  rationale: Ang δέ ay banayad na pang-ugnay na nagpapatuloy sa salaysay. Natural sa modernong Tagalog ang “Pagkatapos” at hindi nito ipinahihiwatig ang matinding pagsalungat.
- source_word: πρὸς τοὺς μαθητάς
  choice: sa mga alagad
  rationale: Walang tahasang panghalip na paari sa Griyego, kaya hindi idinagdag ang “niya.”
- source_word: Ἐλεύσονται ἡμέραι
  choice: Darating ang mga araw
  rationale: Pinananatili nito ang hinaharap at ang propetikong himig ng idyomang Griyego sa natural na Tagalog.
- source_word: ἐπιθυμήσετε
  choice: pananabikan ninyo
  rationale: Ipinahahayag ng “pananabikan” ang matinding pagnanais na taglay ng pandiwa, nang malinaw at natural.
- source_word: μίαν τῶν ἡμερῶν
  choice: ang isa sa mga araw
  rationale: 'Tumpak nitong pinananatili ang partitive na diwa: isang araw mula sa mas malaking pangkat ng mga araw.'
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: ng Anak ng Tao
  rationale: Literal na pinananatili ang titulo ni Jesus at ang kaugnayan nito sa biblikal at teolohikal na wika.
- source_word: ἰδεῖν
  choice: makita
  rationale: Natural at tuwirang katumbas ng infinitibong Griyego bilang layon ng pananabik.
- source_word: καὶ οὐκ ὄψεσθε
  choice: ngunit hindi ninyo iyon makikita
  rationale: Ang “iyon” ay tumutukoy sa nais nilang makita. Bagaman καί ay karaniwang “at,” natural na ipinahahayag ng “ngunit” sa Tagalog ang malinaw na salungatan sa pagitan ng pananabik at hindi pagkakita nang hindi binabago ang nilalaman.
theological_decisions:
- issue: Kahulugan ng “mga araw ng Anak ng Tao”
  choice: Pinanatili ang malawak at eskatolohikal na pariralang “mga araw ng Anak ng Tao.”
  alternative: Tukuyin ito nang tahasan bilang mga araw ng ministeryo ni Jesus sa lupa o bilang panahon lamang ng kaniyang pagpapakita sa hinaharap.
  rationale: Maaaring umugnay ang parirala sa panahon ng presensiya at gawain ni Jesus at sa kaniyang paghahayag sa hinaharap. Hindi nilulutas ng salin ang sadyang bukas na saklaw ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “alagad” at “Anak ng Tao” bilang pamilyar at angkop na mga terminong biblikal; iniwasan ang labis na pagpapaliwanag sa mismong talata.
