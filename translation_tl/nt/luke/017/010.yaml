base_translation:
  language: en
  yaml_path: translation/nt/luke/017/010.yaml
  text: So also you[a], when you have done all that was commanded you, say, ‘We are unworthy servants[b]; we have done what we were obligated to do.’
translation:
  language: tl
  text: 'Gayon din kayo: kapag nagawa na ninyo ang lahat ng iniutos sa inyo, sabihin ninyo, “Kami ay mga aliping hindi karapat-dapat[a]. Ginawa namin ang dapat naming gawin[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga aliping walang pakinabang” o “mga aliping walang halaga.” Ang salitang Griyego ay maaaring tumukoy sa pagiging walang pakinabang o sa kawalan ng karapatang umangkin ng gantimpala.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Ginawa namin ang tungkulin naming gawin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Gayon din kayo
  rationale: Malinaw nitong iniuugnay ang tagubilin sa naunang paglalarawan at pinananatili ang diin sa pangmaramihang “kayo.”
- source_word: ὅταν ποιήσητε
  choice: kapag nagawa na ninyo
  rationale: Ipinapakita ng “nagawa na” ang pagkakumpleto ng iniutos bago sabihin ang kasunod na pahayag.
- source_word: πάντα τὰ διαταχθέντα ὑμῖν
  choice: ang lahat ng iniutos sa inyo
  rationale: Pinananatili ng “iniutos” ang awtoritatibong diwa ng διατάσσω at natural ang ayos sa modernong Tagalog.
- source_word: λέγετε
  choice: sabihin ninyo
  rationale: Tuwirang utos ito at natural sa kasalukuyang Tagalog.
- source_word: Δοῦλοι
  choice: mga alipin
  rationale: Ang konteksto ay tahasang paglalarawan ng ugnayan ng panginoon at alipin; kaya pinananatili ang nakagapos na katayuang ipinahihiwatig ng δοῦλος sa halip na palambutin bilang “mga lingkod.”
- source_word: ἀχρεῖοί
  choice: hindi karapat-dapat
  rationale: Ipinahahayag nito na walang batayan ang mga alipin upang mag-angkin ng natatanging pagkilala o gantimpala. Inilalagay sa talababa ang mas literal ngunit maaaring mapagkamalang ganap na paghatol sa halaga ng tao na “walang pakinabang” o “walang halaga.”
- source_word: ὃ ὠφείλομεν ποιῆσαι
  choice: ang dapat naming gawin
  rationale: Natural at malinaw nitong ipinahahayag ang obligasyon o tungkuling taglay ng ὀφείλω nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: πεποιήκαμεν
  choice: Ginawa lamang namin
  rationale: Ang “ginawa” ay nagpapahayag ng natapos na kilos; ang “lamang” ay natural na naghahatid ng diing walang labis na nagawa bukod sa obligasyon, na nagmumula sa kabuuang pahayag.
theological_decisions:
- issue: Paglalarawan sa mga alagad bilang δοῦλοι
  choice: mga alipin
  alternative: mga lingkod
  rationale: Mahalaga sa talinghaga ang katayuan ng alipin sa ilalim ng panginoon. Ang “mga alipin” ang mas tumpak na nagpapanatili sa panlipunan at retorikal na bigat ng orihinal nang hindi nag-aangkat ng natatanging doktrinang pangdenominasyon.
- issue: Kahulugan ng ἀχρεῖοι
  choice: hindi karapat-dapat
  alternative: walang pakinabang / walang halaga
  rationale: Pinananatili ng pangunahing salin ang punto na ang pagsunod ay hindi nagbibigay ng karapatang maningil ng gantimpala, ngunit hindi nito tiyak na ipinapakahulugang walang likas na halaga ang mga alagad. Inilalahad sa talababa ang mas literal na mga posibilidad upang mapanatili ang leksikal na tensiyon.
- issue: Obligasyon sa pariralang ὃ ὠφείλομεν ποιῆσαι
  choice: ang dapat naming gawin
  alternative: ang tungkulin naming gawin
  rationale: Parehong posible ang “dapat” at “tungkulin.” Pinili ang mas natural na “dapat” habang inilalagay sa talababa ang alternatibong higit na tahasang tumutukoy sa tungkulin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “alipin” dahil mahalaga ito sa agarang konteksto, at iniwasan ang mas lumang o mas pormal na ayos na makapagpapabigat sa pangungusap. Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto.
