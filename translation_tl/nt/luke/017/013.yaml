  text: And they raised their voices[a], saying, “Jesus, Master[b], have mercy on us!”
translation:
  language: tl
  text: At malakas silang tumawag[a], “Jesus, Guro[b], maawa ka sa amin!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “itinaas nila ang kanilang tinig.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Guro” ay salin ng Griyegong epistata, isang pantawag sa taong may awtoridad o pamumuno; hindi ito ang karaniwang salita para sa “Panginoon” (kyrios).
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Karaniwang pang-ugnay ito at hindi kinakailangang dagdagan ng tiyak na diwang temporal gaya ng “Pagkatapos.”
- source_word: αὐτοὶ
  choice: nila
  rationale: Hayag at may bahagyang diin ang panghalip sa Griyego, ngunit likas sa Filipino na ipaloob ito sa pandiwang “inilakas nila” sa halip na sabihing “sila mismo.”
- source_word: ἦραν φωνὴν
  choice: inilakas nila ang kanilang tinig
  rationale: Ipinahihiwatig ng idyoma ang malakas na pagtawag. Pinananatili ng salin ang larawan ng “tinig” habang natural na ipinapahayag ang lakas ng kanilang pagsamo.
- source_word: λέγοντες
  choice: at sinabi
  rationale: Ginawang pangungusap na may “at sinabi” ang participle upang maging malinaw at natural sa Filipino nang hindi binabago ang ugnayan ng mga kilos.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Ito ang karaniwang anyo sa Filipino ng pangalang ginagamit bilang tuwirang pagtawag.
- source_word: ἐπιστάτα
  choice: Guro
  rationale: Bilang pantawag kay Jesus sa Lucas, ipinahihiwatig nito ang isang taong may pamumuno at kapangyarihan. Ang “Guro” ay likas at magalang na pantawag sa Filipino; nililinaw sa talababa na hindi ito ang karaniwang salitang Griyego para sa “Panginoon.”
- source_word: ἐλέησον
  choice: maawa ka
  rationale: Ang pautos na anyo ay isang apurahang pakiusap para sa habag at tulong. Ang “maawa ka” ang tuwiran at natural na katumbas sa Filipino.
- source_word: ἡμᾶς
  choice: sa amin
  rationale: Ito ang likas na pariralang ginagamit kasama ng “maawa” upang tukuyin ang mga humihingi ng habag.
theological_decisions:
- issue: Pagsasalin sa ἐπιστάτα bilang pantawag kay Jesus
  choice: Guro
  alternative: Panginoon
  rationale: Ang salitang Griyego ay ἐπιστάτης, na nagpapahiwatig ng pamumuno at awtoridad, hindi κύριος, ang karaniwang salitang isinasaling “Panginoon.” Iniiwasan ng “Guro,” kasama ng paglilinaw sa talababa, na pag-isahin ang dalawang magkaibang titulong Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang panghalip na “ka” dahil iisang tao si Jesus na kinakausap; pinanatili rin ang apurahang himig ng sama-samang pagsamo.
