base_translation:
  language: en
  yaml_path: translation/nt/luke/017/014.yaml
  text: And when he saw them[a], he said to them, “Go and show yourselves to the priests.” And as they were going[b], they were cleansed.
translation:
  language: tl
  text: Nang makita niya sila, sinabi niya sa kanila, “Pumunta kayo at magpakita sa mga pari.”[b] At habang papunta sila sa mga pari, nilinis sila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ginawang malinis.” Ang pandiwang Griyego ay maaaring tumukoy kapwa sa pisikal na paggaling at sa pagiging malinis ayon sa ritwal.
    reason: lexical_alternative
  - marker: b
    text: Ang utos na magpakita sa mga pari ay tumutukoy sa pagsusuring itinakda para sa gumaling mula sa sakit sa balat; tingnan ang Levitico 14.
    reason: cross_reference
lexical_decisions:
- source_word: ἰδὼν
  choice: Nang makita niya sila
  rationale: Ang aorist participle ng ὁράω ay likas na ipinahahayag sa Tagalog bilang sugnay na panahunan. Ang “sila” ay malinaw na ipinahihiwatig ng konteksto at ng kasunod na αὐτοῖς.
- source_word: Πορευθέντες
  choice: Humayo kayo
  rationale: Ginagamit ang participle bilang utos na kaugnay ng kasunod na imperative. Pinananatili ng “Humayo kayo” ang pagkakasunod ng pagpunta at pagpapakita, sa dignified ngunit madaling maunawaang Filipino.
- source_word: ἐπιδείξατε ἑαυτοὺς
  choice: magpakita
  rationale: Natural sa Filipino ang “magpakita sa mga pari” para sa pagharap upang masuri; hindi na kailangang idagdag ang literal na “ang inyong mga sarili,” na magiging mabigat at di-likas.
- source_word: τοῖς ἱερεῦσιν
  choice: sa mga pari
  rationale: Tumutukoy ito sa mga paring magsasagawa ng kinakailangang pagsusuri ayon sa Kautusan.
- source_word: ἐν τῷ ὑπάγειν αὐτοὺς
  choice: habang humahayo sila
  rationale: 'Ipinakikita ng konstruksiyon ang magkasabay na kilos: nangyari ang paglilinis habang sila ay nasa pagpunta, hindi bago sila sumunod sa utos.'
- source_word: ἐκαθαρίσθησαν
  choice: nilinis sila
  rationale: Pinananatili ng pasibong anyo ang di-binanggit na tagagawa at ang saklaw ng καθαρίζω, na maaaring tumukoy kapwa sa paggaling ng katawan at sa pagiging malinis sa ritwal.
theological_decisions:
- issue: Wika ng paglilinis sa konteksto ng sakit sa balat at ritwal na kalinisan
  choice: nilinis sila
  alternative: gumaling sila / naging malinis sila
  rationale: Hindi lamang karaniwang salita para sa paggaling ang ginamit ng Griyego. Ang “nilinis sila” ay nagpapanatili sa pisikal at ritwal na mga dimensiyon at sa pasibong anyo, nang hindi tahasang tinutukoy kung sino ang kumilos.
translation_notes:
  register: Modernong Filipino na may payak ngunit marangal na himig. Ginamit ang “humayo” upang mapanatili ang tono ng utos at ang pagpunta, samantalang iniwasan ang di-likas na literal na “ipakita ang inyong mga sarili.” Inilagay ang mga talababa sa mga pariralang tunay nilang ipinapaliwanag.
