  register: Makabago, malinaw, at marangal na salaysay. Pinanatili ang panimulang pormula ni Lucas at ang nagpapatuloy na kilos ng paglalakbay, habang hindi nilulutas nang tahimik ang heograpikong ambiguwidad ng διὰ μέσον.
