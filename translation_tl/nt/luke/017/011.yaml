  text: Καὶ ἐγένετο ἐν τῷ ⸀πορεύεσθαι εἰς Ἰερουσαλὴμ καὶ αὐτὸς διήρχετο διὰ ⸀μέσον Σαμαρείας καὶ Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/011.yaml
  text: And it happened that[a], as he was going to Jerusalem, he was passing through the midst of Samaria and Galilee.
translation:
  language: tl
  text: 'At nangyari ito: habang naglalakbay siya patungong Jerusalem, dumaraan siya sa pagitan ng Samaria at Galilea.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dumaraan sa gitna ng Samaria at Galilea.” Maaaring tumukoy ang pananalitang Griyego sa pagdaan sa pagitan ng dalawang rehiyon o sa hangganang naghihiwalay sa mga ito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγένετο
  choice: nangyari
  rationale: Pinananatili ang karaniwang panimulang pormula ni Lucas nang hindi gumagamit ng makalumang pananalita.
- source_word: ἐν τῷ πορεύεσθαι
  choice: habang naglalakbay
  rationale: Ipinahahayag ng parirala ang kilos na kasabay at nagpapatuloy; natural ito sa makabagong Tagalog.
- source_word: εἰς Ἰερουσαλήμ
  choice: patungong Jerusalem
  rationale: Malinaw na ipinapakita ang Jerusalem bilang destinasyon ng paglalakbay.
- source_word: αὐτός
  choice: siya
  rationale: Natural na tinutukoy si Jesus nang hindi labis na idinidiin ang tahasang panghalip sa Griyego.
- source_word: διήρχετο
  choice: dumaraan
  rationale: Pinananatili ng aspektong imperpektibo ang nagpapatuloy na pagdaan sa takbo ng paglalakbay.
- source_word: διὰ μέσον
  choice: sa pagitan ng
  rationale: Natural na Tagalog para sa posibleng diwa ng paglalakbay sa pagitan o hangganang bahagi ng dalawang rehiyon, habang inilalahad sa talababa ang tunay na ambiguwidad.
- source_word: Σαμαρείας καὶ Γαλιλαίας
  choice: Samaria at Galilea
  rationale: Pinananatili ang pagkakasunod-sunod ng mga pangalang-lugar sa Griyego at ginagamit ang karaniwang anyong Filipino.
