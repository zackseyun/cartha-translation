  source_fidelity: Tumpak na naipapahayag ng draft ang patutunguhan, ang di-ganap na kilos ng pagdaan, at ang heograpikong ambiguwidad ng διὰ μέσον. Gayunman, ang “At nangyari na habang” ay hindi wastong likas na pagbuo sa makabagong Tagalog para sa panimulang pormulang Καὶ ἐγένετο ἐν τῷ.
  naturalness: Kailangan ang maliit ngunit mahalagang pag-aayos sa pambungad. Ang “At nangyari ito:” ay nagbibigay ng natural na Tagalog na katumbas ng pormulang pasalaysay ni Lucas at maayos na ipinakikilala ang kasunod na pangyayari.
  terminology: Ang “Samaria,” “Galilea,” at “Jerusalem” ay angkop at malinaw. Ang “sa pagitan ng Samaria at Galilea” ay mainam na pangunahing salin; iniaabot ng talababa ang alternatibong pagbasa nang hindi pinipilit ang isang heograpikong pagpapakahulugan.
