id: LUK.4.8
reference: Luke 4:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂ὁ Ἰησοῦς εἶπεν αὐτῷ⸃· Γέγραπται· ⸂Κύριον τὸν θεόν σου προσκυνήσεις⸃ καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/008.yaml
  text: 'And Jesus answered him[a], “It is written: ‘You shall worship the Lord your God[b], and you shall serve only him.’”'
translation:
  language: tl
  text: 'At sumagot si Jesus sa kanya, “Nasusulat: ‘Ang Panginoon mong Diyos ang sasambahin mo[a], at siya lamang ang paglilingkuran mo.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Ang Panginoon mong Diyos ang yuyukuran mo.”
    reason: lexical_alternative
  - marker: b
    text: Ang sipi ay umaalingawngaw sa Deuteronomio 6:13.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: sumagot
  rationale: Likas na pinagsasama sa makabagong Tagalog ang Griyegong participle at pandiwang nagsasaad ng pagsagot, nang hindi nawawala ang diwang tugon.
- source_word: Γέγραπται
  choice: Nasusulat
  rationale: Karaniwang pormula ito sa pagsipi sa Kasulatan at ipinahihiwatig na nananatiling may bisa ang nakasulat.
- source_word: Κύριον τὸν θεόν σου
  choice: Ang Panginoon mong Diyos
  rationale: Tuwirang pinananatili ang κύριος bilang “Panginoon” at ang ugnayang ipinahahayag ng “mong Diyos,” nang hindi ipinapasok sa teksto ng Bagong Tipan ang anyong “PANGINOON” mula sa Hebreo.
- source_word: προσκυνήσεις
  choice: sasambahin mo
  rationale: Sa konteksto ng debosyong ukol lamang sa Diyos, malinaw at natural ang “sasambahin”; inilalagay sa talababa ang mas literal na kilos ng pagyukod.
- source_word: λατρεύσεις
  choice: paglilingkuran mo
  rationale: Ipinahahayag nito ang paglilingkod na iniuukol sa Diyos; ang kalapit na “sasambahin” ay nagpapanatili sa panrelihiyong diwa.
- source_word: αὐτῷ μόνῳ
  choice: siya lamang
  rationale: Pinananatili ang diin sa pagiging bukod-tangi ng Diyos bilang tanging paglilingkuran.
theological_decisions:
- issue: Pagbibigay ng κύριος sa siping tumutukoy sa Diyos
  choice: Panginoon
  alternative: PANGINOON
  rationale: Ang mismong tekstong Griyego ng Lucas ay κύριον. Ang “Panginoon” ay tapat dito at hindi tahimik na pinapalitan ng anyong ginagamit sa tuwirang pagsasalin ng YHWH mula sa Hebreo.
- issue: Ugnayan ng pagsamba at paglilingkod
  choice: “sasambahin” at “paglilingkuran” bilang magkaibang pandiwa
  alternative: Gawing kapwa pangkalahatang pagtatalaga o debosyon
  rationale: Pinananatili ang pagkakaiba ng προσκυνέω at λατρεύω at ang tensiyon ng dalawang magkaugnay ngunit hindi magkaparehong kilos.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Nasusulat” bilang pamilyar ngunit hindi lipas na pormula sa Kasulatan, at ang ayos na “siya lamang” upang idiin ang pagiging bukod-tangi ng Diyos.
