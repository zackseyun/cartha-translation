id: LUK.4.9
reference: Luke 4:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂Ἤγαγεν δὲ⸃ αὐτὸν εἰς Ἰερουσαλὴμ καὶ ⸀ἔστησεν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ, καὶ εἶπεν αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν ἐντεῦθεν κάτω·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/009.yaml
  text: Then he led him to Jerusalem and set him on the pinnacle of the temple[a], and said to him, “If you are the Son of God[c][b], throw yourself down from here;”
translation:
  language: tl
  text: Pagkatapos, dinala niya siya sa Jerusalem at inilagay sa tuktok ng templo[a][b]. Sinabi niya sa kanya, “Kung ikaw ang Anak ng Diyos[c], ihagis mo ang iyong sarili pababa mula rito;”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring ‘sa nakausling dulo ng templo.’ Literal na tumutukoy ang salitang Griyego sa isang ‘maliit na pakpak,’ ngunit sa kontekstong ito ay nangangahulugan itong nakausling dulo o mataas na bahagi ng gusali.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego na ἱερόν ay tumutukoy sa buong bakuran o kompleks ng templo, hindi lamang sa panloob na santuwaryo.
    reason: cultural_note
  - marker: c
    text: Maaari ring ‘Yamang ikaw ang Anak ng Diyos.’ Maaaring unawain nang gayon ang kondisyong Griyego, ngunit ‘Kung’ ang ginamit dito upang mapanatili ang mapanghamong tono ng manunukso.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἤγαγεν δὲ
  choice: Pagkatapos, dinala
  rationale: Ipinahihiwatig ng δέ ang kasunod na yugto ng salaysay, at ang ἄγω ay maaaring mangahulugang ‘dalhin’ o ‘akayin.’ Natural sa Filipino ang ‘Pagkatapos, dinala’ nang hindi dinaragdagan ang paraan ng pagpunta.
- source_word: ἔστησεν
  choice: inilagay
  rationale: 'Causative ang diwa rito: pinapuwesto niya si Jesus sa isang lugar. Mas natural ang ‘inilagay’ kaysa sa literal ngunit alanganing ‘pinatayo.’'
- source_word: ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ
  choice: sa tuktok ng templo
  rationale: Sa kontekstong arkitektural, ang πτερύγιον ay nakausling dulo o mataas na bahagi. Ang ‘tuktok ng templo’ ay malinaw at natural, samantalang ipinapaliwanag sa talababa ang literal na larawan at ang saklaw ng ἱερόν.
- source_word: Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Kung ikaw ang Anak ng Diyos
  rationale: Pinananatili ng ‘Kung’ ang mapanghamong anyo ng εἰ at ang tensiyon sa tagpo, nang hindi ipinahihiwatig na nag-aalinlangan ang tagapagsalaysay tungkol sa pagkakakilanlan ni Jesus.
- source_word: βάλε σεαυτὸν ἐντεῦθεν κάτω
  choice: magpatihulog ka mula rito
  rationale: Malinaw at likas sa Filipino ang ‘magpatihulog’ para sa utos na ihagis o ihulog ang sarili pababa. Isinasalin ng ‘mula rito’ ang pagtukoy ng ἐντεῦθεν sa kinaroroonan.
theological_decisions:
- issue: Ang hamon tungkol sa pagkakakilanlan ni Jesus
  choice: Kung ikaw ang Anak ng Diyos
  alternative: Yamang ikaw ang Anak ng Diyos
  rationale: Maaaring magkaroon ang εἰ na may indicative ng puwersang malapit sa ‘yamang’ sa ilang konteksto. Gayunman, pinananatili rito ng ‘kung’ ang mapanubok at mapanghamong puwersa ng pananalita nang hindi nilulutas ang retorikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘rito’ matapos ang ‘siya’ upang maging malinaw na kay Jesus nagsalita ang nagdala sa kanya. Pinanatili ang tuldok-kuwit sa dulo dahil nagpapatuloy sa kasunod na talata ang siniping pananalita.
