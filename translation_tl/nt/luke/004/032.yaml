base_translation:
  language: en
  yaml_path: translation/nt/luke/004/032.yaml
  text: And they were astonished at his teaching[a], because his word had authority.
translation:
  language: tl
  text: At namangha sila sa kanyang pagtuturo, sapagkat may awtoridad ang kanyang salita[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “may awtoridad ang kanyang mensahe,” o “nagsalita siya nang may awtoridad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: namangha sila
  rationale: Ipinahahayag ang matinding pagkamangha ng mga nakikinig; ang aspektong imperpektibo ay likas na naihahatid sa daloy ng salaysay sa Filipino.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: sa kanyang pagtuturo
  rationale: Ang ἐπί na may datibo ay tumutukoy sa bagay o batayan ng kanilang pagkamangha. Ang “pagtuturo” ay natural at saklaw kapwa ang gawa at nilalaman ng pagtuturo.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng kanilang pagkamangha sa isang natural at marangal na anyong Filipino.
- source_word: ἐν ἐξουσίᾳ
  choice: may awtoridad
  rationale: Natural na katumbas sa Filipino ng idyomang nagsasaad na ang pananalita ni Jesus ay nagtataglay ng kapangyarihang mag-utos o magpahayag nang may bisa.
- source_word: ὁ λόγος αὐτοῦ
  choice: ang kanyang salita
  rationale: Pinananatili ang maikli at tuwirang λόγος, na rito ay tumutukoy sa kanyang binigkas na salita o pananalita, nang hindi nililimitahan lamang sa nilalaman ng mensahe.
theological_decisions:
- issue: Kalikasan ng awtoridad sa pananalita ni Jesus
  choice: may awtoridad ang kanyang salita
  alternative: makapangyarihan ang kanyang mensahe / nagsalita siya nang may awtoridad
  rationale: Tahasang inilalarawan ang awtoridad ng kanyang salita ngunit hindi dinaragdagan ng paliwanag tungkol sa pinagmumulan o buong teolohikal na batayan nito, sapagkat hindi iyon tinutukoy sa mismong talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang salitang “awtoridad” dahil mas natural ito sa kasalukuyang gamit kaysa sa mas malabong “kapangyarihan” sa kontekstong ito. Inilagay ang talababa matapos ang buong pangungusap dahil nililinaw nito ang alternatibong pagkakaugnay at pagpapahayag ng huling sugnay.
