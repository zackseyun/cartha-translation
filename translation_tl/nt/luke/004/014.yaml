id: LUK.4.14
reference: Luke 4:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὑπέστρεψεν ὁ Ἰησοῦς ἐν τῇ δυνάμει τοῦ πνεύματος εἰς τὴν Γαλιλαίαν. καὶ φήμη ἐξῆλθεν καθ’ ὅλης τῆς περιχώρου περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/014.yaml
  text: And Jesus returned to Galilee in the power of the Spirit[a], and a report about him went out through all the surrounding region.
translation:
  language: tl
  text: At bumalik si Jesus sa Galilea sa kapangyarihan ng Espiritu, at kumalat sa buong nakapaligid na rehiyon ang balita[a] tungkol sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ulat,” “katanyagan,” o “usap-usapan.” Ang salitang Griyego ay tumutukoy sa ulat o balitang malawak na kumakalat, nang hindi sinasabi kung positibo o negatibo ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: bumalik
  rationale: Karaniwang salaysay na kahulugan ng ὑποστρέφω; likas at malinaw sa modernong Tagalog.
- source_word: ἐν τῇ δυνάμει
  choice: na taglay ang kapangyarihan
  rationale: Ipinahahayag ang kalagayan o paraan ng pagbabalik ni Jesus nang hindi nililimitahan ang ἐν sa purong instrumentong kahulugan.
- source_word: τοῦ πνεύματος
  choice: ng Espiritu
  rationale: Ang konteksto ng Lucas 4 ay tumutukoy sa Banal na Espiritu, ngunit hindi idinaragdag ang salitang “Banal” na wala sa talatang ito.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: sa Galilea
  rationale: Likas na Tagalog para sa patutunguhan ng paglalakbay.
- source_word: φήμη
  choice: balita
  rationale: Saklaw nito ang ulat o impormasyong lumalaganap nang hindi ipinapalagay na positibo gaya ng “katanyagan” o negatibo gaya ng “tsismis.”
- source_word: ἐξῆλθεν
  choice: kumalat
  rationale: Natural na inililipat sa Tagalog ang metaporang ang balita ay “lumabas” at malinaw na ipinakikita ang malawakang paglaganap nito.
- source_word: καθ’ ὅλης τῆς περιχώρου
  choice: sa buong karatig na lupain
  rationale: Ipinahahayag ang paglaganap sa kabuuan ng nakapaligid na rehiyon sa dignified at madaling unawaing Tagalog.
- source_word: περὶ αὐτοῦ
  choice: tungkol sa kanya
  rationale: Pinakanatural na kasalukuyang Tagalog para sa referensiyal na gamit ng περί na may genitive.
theological_decisions:
- issue: Tinutukoy ng πνεύματος
  choice: Ang “Espiritu” ay tumutukoy sa Banal na Espiritu.
  alternative: Isang di-tiyak na espiritu.
  rationale: Sa agarang konteksto ng Lucas 4, ang πνεῦμα ay ang Banal na Espiritu. Pinananatili ng “Espiritu” ang mismong antas ng pagtukoy ng Griyego nang hindi nagdaragdag ng “Banal” sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “na taglay ang kapangyarihan” upang mapanatili ang ugnayan ng kapangyarihan at Espiritu nang hindi tunog-luma; ginamit ang “karatig na lupain” para sa nakapaligid na rehiyon.
