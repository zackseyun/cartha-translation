  text: for forty days, being tempted by the devil. And he ate nothing during those days, and when they were completed, he was hungry.
translation:
  language: tl
  text: Sa loob ng apatnapung araw ay tinutukso[a] siya ng diyablo. Hindi siya kumain ng anuman sa mga araw na iyon, at nang matapos ang mga araw na iyon, nagutom siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sinusubok.” Maaaring mangahulugan ang pandiwang Griyego na “tuksuhin” o “subukin,” ngunit higit na angkop dito ang “tinutukso” dahil ang gumagawa nito ay ang diyablo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας τεσσεράκοντα
  choice: sa loob ng apatnapung araw
  rationale: Likas na ipinahahayag sa modernong Tagalog ang akusatibong nagsasaad ng tagal sa pamamagitan ng “sa loob ng,” nang hindi nagdaragdag ng kahulugan.
- source_word: πειραζόμενος
  choice: tinutukso
  rationale: Maaaring mangahulugan ang pandiwa ng “tinutukso” o “sinusubok.” Dahil ang gumagawa nito ay ang diyablo, higit na angkop sa konteksto ang masamang layuning ipinahihiwatig ng “tinutukso,” habang itinatala sa talababa ang tunay na alternatibo.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: ng diyablo
  rationale: Ginagamit dito ang διάβολος bilang kilalang katawagan sa personal na kalaban; malinaw at karaniwan sa Tagalog ang “diyablo,” samantalang makaliligaw ang purong etimolohikal na salin na “maninirang-puri.”
- source_word: οὐκ ἔφαγεν οὐδὲν
  choice: Hindi siya kumain ng anuman
  rationale: Tuwirang pinananatili nito ang ganap na pagtanggi sa natural at malinaw na Tagalog.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: sa mga araw na iyon
  rationale: Karaniwang ekspresyon ito sa Tagalog at malinaw na tumutukoy sa nabanggit na apatnapung araw.
- source_word: συντελεσθεισῶν αὐτῶν
  choice: nang matapos ang mga iyon
  rationale: Isinasalin ang genitive absolute bilang likas na sugnay na pamanahon. Ang “mga iyon” ay nagpapanatili sa panghalip na tumutukoy sa mga araw.
- source_word: ἐπείνασεν
  choice: nagutom siya
  rationale: Ang “nagutom” ay likas na pandiwang Tagalog at naipahihiwatig ang pagdating o resulta ng gutom matapos ang panahong iyon.
theological_decisions:
- issue: Kahulugan ng πειραζόμενος kaugnay ng karanasan ni Jesus sa ilang
  choice: tinutukso
  alternative: sinusubok
  rationale: Ang diyablo bilang tahasang gumagawa ang pumapabor sa “tinutukso.” Hindi ipinapaliwanag o nilulutas ng salin ang mas malawak na teolohikal na usapin tungkol sa pagkakatukso kay Jesus; pinananatili sa talababa ang leksikal na posibilidad na “sinusubok.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinili ang natural na ayos ng pangungusap habang pinananatili ang tagal ng apatnapung araw, ang patuloy na pagkakatukso, ang ganap na hindi pagkain, at ang pagkagutom pagkaraan ng panahong iyon.
