source:
  edition: SBLGNT
  text: ⸀Ἔα, τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/034.yaml
  text: Ah! What have you to do with us[e][d][c][b][a], Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God.
translation:
  language: tl
  text: “Ah! Ano ang pakialam namin sa iyo,[a] Jesus na taga-Nazaret?[b] Naparito ka ba upang lipulin kami?[c] Alam ko kung sino ka—ang Banal ng Diyos.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “ano sa amin at sa iyo?” Isang Semitikong idyoma ito ng paglayo o mariing pagtutol.
    reason: cultural_note
  - marker: b
    text: O “Jesus na Nazareno.”
    reason: alternative_reading
  - marker: c
    text: Hindi tinutukoy sa Griyego kung sino ang saklaw ng “kami.” Maaaring nagsasalita ang demonyo para sa sarili nito at sa iba pang mga demonyo, o para sa sarili nito at sa taong sinaniban.
    reason: alternative_reading
  - marker: d
    text: O “ang Banal ng Diyos”; ganito ang literal na ayos ng titulong Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔα
  choice: Ah!
  rationale: Isang biglaang sigaw ng pagkabigla o pagtutol. Pinananatili ng “Ah!” ang maikli at matinding bulalas nang hindi idinaragdag sa mismong teksto ang mas interpretibong “Pabayaan mo kami!”
- source_word: τί ἡμῖν καὶ σοί
  choice: Ano ang pakialam mo sa amin
  rationale: Ang literal na “ano sa amin at sa iyo?” ay isang Semitikong idyoma ng paglayo o mariing pagtutol. Ang salin ay natural sa modernong Tagalog at pinananatili ang mapanghamong diwa.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: Jesus na taga-Nazaret
  rationale: Tahasang ipinapahayag ang kaugnayan ni Jesus sa Nazaret; natural itong pantawag sa Tagalog at hindi nagpapasya kung ang salita ay dapat unawain bilang pinagmulan o bansag.
- source_word: ἦλθες ἀπολέσαι
  choice: Naparito ka ba upang lipulin
  rationale: Ang aorist na ἦλθες ay tumutukoy sa pagdating na may kasalukuyang bunga, at ang ἀπολέσαι ay nagsasaad ng lubusang pagpuksa o pagkawasak. Ang “lipulin” ay angkop sa banta ng paghatol sa tagpong ito.
- source_word: ἡμᾶς
  choice: kami / amin
  rationale: Pinananatili ang pangmaramihang panghalip sapagkat hindi tinutukoy ng Griyego kung sino ang saklaw nito.
- source_word: οἶδά σε τίς εἶ
  choice: Kilala kita—alam ko kung sino ka
  rationale: Pinananatili ang parehong σε at τίς εἶ sa Griyego. Bagaman may bahagyang pag-uulit sa Tagalog, malinaw nitong naihahatid ang diin ng pagkilala.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: ang Banal ng Diyos
  rationale: Pormal at mabigat na salin ng titulong tumutukoy sa natatanging kabanalan at kaugnayan kay Diyos, nang walang idinadagdag na paliwanag na doktrinal.
theological_decisions:
- issue: Saklaw ng pangmaramihang ἡμᾶς sa pananalita ng demonyo
  choice: Pinanatili bilang “kami/amin” nang hindi tinutukoy ang saklaw.
  alternative: Ang demonyo ay maaaring nagsasalita para sa daigdig ng mga demonyo, o para sa sarili nito kasama ang taong sinaniban.
  rationale: Hindi tahasang ipinakikilala ng Griyego ang tinutukoy ng pangmaramihan; ang hindi pagtukoy ay nagpapanatili sa tunay na kalabuan ng teksto.
- issue: Kahulugan ng titulong ὁ ἅγιος τοῦ θεοῦ
  choice: Isinalin bilang “ang Banal ng Diyos” nang walang pagpapalawak.
  alternative: “ang Banal na mula sa Diyos” o “ang Banal na Hinirang ng Diyos.”
  rationale: Mahalagang titulong kristolohikal ang parirala, ngunit hindi ipinaliliwanag ng talata ang lahat ng implikasyon nito. Iniiwasan ng salin ang pagpasok ng mas tiyak na interpretasyong hindi tahasang nasa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pakialam” bilang likas na katumbas ng idyomang nagtataboy o tumututol, “lipulin” para sa matinding ἀπολέσαι, at “Banal ng Diyos” upang mapanatili ang maikli at mabigat na anyo ng titulong Griyego.
