id: LUK.4.1
reference: Luke 4:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ⸂πλήρης πνεύματος ἁγίου⸃ ὑπέστρεψεν ἀπὸ τοῦ Ἰορδάνου, καὶ ἤγετο ἐν τῷ πνεύματι ⸂ἐν τῇ ἐρήμῳ⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/001.yaml
  text: And Jesus[a], full of the Holy Spirit, returned from the Jordan and was being led by the Spirit in the wilderness.
translation:
  language: tl
  text: Si Jesus, na puspos ng Espiritu Santo, ay bumalik mula sa Jordan, at patuloy na inaakay siya ng Espiritu[a] sa ilang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa Espiritu.” Mas literal na ganito maisasalin ang pananalitang Griyego, bagaman malamang na ang ibig sabihin dito ay inaakay siya ng Espiritu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης πνεύματος ἁγίου
  choice: puspos ng Espiritu Santo
  rationale: Ang πλήρης na sinusundan ng genitive ay naglalarawan ng pagiging punô ng isang bagay. Ang “puspos ng Espiritu Santo” ay natural, marangal, at naglalarawan ng kalagayan sa halip na isang panandaliang pangyayari.
- source_word: ὑπέστρεψεν
  choice: bumalik
  rationale: Karaniwang kahulugan ng ὑποστρέφω ang pagbabalik; tuwiran at natural ang “bumalik” sa makabagong Tagalog.
- source_word: ἀπὸ τοῦ Ἰορδάνου
  choice: mula sa Jordan
  rationale: Jordan lamang ang pinangalanan sa Griyego. Nauunawaan sa konteksto ang lugar nang hindi kailangang idagdag ang salitang “Ilog.”
- source_word: ἤγετο
  choice: patuloy siyang inaakay
  rationale: Ipinahihiwatig ng imperfect passive ang nagaganap at nagpapatuloy na pagkilos sa nakaraan. Napananatili ng “patuloy na inaakay” ang aspektong ito.
- source_word: ἐν τῷ πνεύματι
  choice: ng Espiritu
  rationale: Kasama ng passive na ἄγω, maaaring ipahayag ng ἐν ang kasangkapan o kumikilos na ahente. Nililinaw ng “ng Espiritu” na ang Espiritu ang umaakay, habang inilalagay sa talababa ang mas literal na posibilidad.
- source_word: ἐν τῇ ἐρήμῳ
  choice: sa ilang
  rationale: Ang ἔρημος ay isang ilang o tiwangwang na pook, hindi kinakailangang mabuhanging disyerto. Ang “sa ilang” ay maikli, likas sa wikang biblikal, at madaling maunawaan.
- source_word: δὲ
  choice: ipinahiwatig sa daloy ng pangungusap
  rationale: Ang δέ ay banayad na pang-ugnay o transisyon. Hindi kailangang tumbasan ng hiwalay na “at” sa simula dahil natural na naipagpapatuloy ng Tagalog na ayos ang salaysay mula sa naunang konteksto.
theological_decisions:
- issue: Tinutukoy ng πνεῦμα sa ἐν τῷ πνεύματι
  choice: ang Espiritu Santo bilang umaakay kay Jesus
  alternative: ang panloob na espirituwal na kalagayan ni Jesus
  rationale: Agad na binanggit na si Jesus ay puspos ng Espiritu Santo, kaya pinakanatural na ang parehong Espiritu ang tinutukoy bilang umaakay sa kanya. Hindi ito nagdaragdag ng doktrinang lampas sa sinasabi ng konteksto.
- issue: Lakas ng pahayag na πλήρης πνεύματος ἁγίου
  choice: 'isang inilalarawang kalagayan: “puspos ng Espiritu Santo”'
  alternative: 'isang pangyayaring pagpuno: “pinuspos ng Espiritu Santo”'
  rationale: Pang-uri ang πλήρης, kaya inilalarawan nito ang kalagayan ni Jesus at hindi tahasang nagsasalaysay ng isang bagong pangyayari ng pagpuno.
translation_notes:
  register: Makabago at madaling maunawaang Tagalog na may marangal na himig. Ginamit ang “puspos” at “sa ilang” bilang mga salitang pamilyar sa biblikal na gamit ngunit malinaw pa rin sa karaniwang mambabasa. Inilipat ang panandang [a] sa “Espiritu,” ang mismong pariralang may alternatibong salin.
