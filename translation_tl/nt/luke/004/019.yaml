translation:
  language: tl
  text: upang ipahayag ang taon ng lingap ng Panginoon[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “upang ipahayag ang kalugud-lugod na taon ng Panginoon.”
    reason: lexical_alternative
  - marker: b
    text: 'Tradisyonal: “ang kalugud-lugod na taon ng Panginoon.” Umaalingawngaw ang parirala sa Isaias 61:2 at maaaring magpahiwatig ng mga tema ng Jubileo.'
    reason: cross_reference
lexical_decisions:
- source_word: κηρύξαι
  choice: upang ipahayag
  rationale: Ang aorist infinitive ay nagpapatuloy sa pagpapahayag ng layunin mula sa naunang talata. Pinananatili ng “ipahayag” ang diwa ng pampubliko at may-awtoridad na pagpapabatid nang hindi ito nililimitahan sa pangangaral.
- source_word: ἐνιαυτὸν
  choice: taon
  rationale: Karaniwang tumutukoy ang ἐνιαυτός sa isang taon. Pinananatili ang “taon” upang maingatan ang alusyon sa Isaias 61:2 at ang posibleng kaugnayan nito sa Jubileo.
- source_word: κυρίου
  choice: ng Panginoon
  rationale: Likas sa Filipino ang pariralang genitibo na “ng Panginoon.” Ang “Panginoon” ay angkop sa κύριος at hindi labis na nagpapasya kung dapat bang hayagang katawanin dito ang banal na pangalan.
- source_word: δεκτόν
  choice: ng lingap
  rationale: Sa kontekstong ito, ipinahihiwatig ng δεκτός ang pagiging kalugod-lugod o paborableng tinatanggap. Ang idyomatikong “taon ng lingap” ay malinaw na naghahatid ng diwa ng pabor ng Diyos, samantalang inilalagay sa talababa ang mas pormal na anyo.
theological_decisions:
- issue: Alusyon sa Isaias 61:2 at posibleng diwa ng Jubileo
  choice: Panatilihin ang “taon” at huwag idagdag ang salitang “Jubileo” sa pangunahing teksto.
  alternative: upang ipahayag ang Jubileo ng Panginoon
  rationale: Umaalingawngaw ang Griyego sa Isaias 61:2 at maaaring magpahiwatig ng Jubileo, ngunit hindi nito tahasang ginagamit ang salitang “Jubileo.” Kaya pinananatili ang alusyon nang hindi isinasama sa teksto ang isang pagpapakahulugan.
- issue: Pagpapakahulugan sa δεκτόν
  choice: taon ng lingap ng Panginoon
  alternative: kalugud-lugod na taon ng Panginoon
  rationale: Mas natural at malinaw sa modernong Filipino ang “taon ng lingap,” ngunit pinananatili sa talababa ang mas tuwirang anyong pang-uri upang hindi maitago ang estruktura at saklaw ng orihinal.
- issue: Pagsasalin sa κύριος
  choice: Panginoon
  alternative: YHWH
  rationale: Ang “Panginoon” ay umaayon sa Griyegong κύριος at sa anyo ng sipi sa Lucas, nang hindi tahasang pinapalitan ito ng banal na pangalang nasa pinagmulan ng alusyon sa Isaias.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “lingap” bilang pamilyar na salitang panrelihiyon at pampanitikan na malinaw pa rin sa karaniwang mambabasa; iniwasan ang mas teknikal o tahasang interpretatibong “Jubileo” sa pangunahing teksto.
