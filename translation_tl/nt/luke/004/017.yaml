  naturalness: Marangal at madaling unawain ang pangkalahatang rehistro. Ngunit hindi natural ang “bahaging kinasusulatan ng ganito”; hindi malinaw ang ugnayan nito sa kasunod na sipi. Ang “bahagi kung saan nakasulat” ay karaniwan at malinaw na Filipino.
