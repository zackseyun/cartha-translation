  text: καὶ ἐπεδόθη αὐτῷ βιβλίον ⸂τοῦ προφήτου Ἠσαΐου⸃ καὶ ⸀ἀναπτύξας τὸ βιβλίον εὗρεν τὸν τόπον οὗ ἦν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/017.yaml
  text: 'And the scroll of the prophet Isaiah was handed to him[a], and after unrolling the scroll, he found the place where it was written:'
translation:
  language: tl
  text: 'At iniabot sa kanya ang balumbon[a] ng propetang si Isaias. Matapos niyang iladlad ang balumbon, natagpuan niya ang bahagi kung saan nakasulat:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aklat.” Maaaring tumukoy ang salitang Griyego na βιβλίον sa isang nakasulat na dokumento sa pangkalahatan, ngunit sa kontekstong ito ng sinagoga, malamang na isang balumbon ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδόθη
  choice: iniabot sa kanya
  rationale: Likas sa konteksto ng pagbasa sa sinagoga at malinaw na ipinapakita ang pasibong diwa ng pandiwa nang hindi pinalalakas bilang 'ipinagkatiwala' o 'isinuko.'
- source_word: βιβλίον
  choice: balumbon
  rationale: Sa sinagoga noong unang siglo, malamang na isang rolyong kasulatan ang tinutukoy, hindi isang aklat na nasa anyong codex. Ang 'balumbon' ay tumpak sa kasaysayan at nauunawaan sa modernong Filipino.
- source_word: τοῦ προφήτου Ἠσαΐου
  choice: ng propetang si Isaias
  rationale: Natural na ayos sa Filipino na pinananatili kapuwa ang pagkakakilanlan kay Isaias at ang kanyang titulong propeta.
- source_word: ἀναπτύξας
  choice: Matapos niyang iladlad
  rationale: Ipinahihiwatig ng aorist participle na nauna ang paglaladlad bago ang paghahanap. Ang 'iladlad' ay angkop sa balumbon at mas tiyak kaysa 'buksan.'
- source_word: εὗρεν
  choice: nakita niya
  rationale: Karaniwang salin ng εὑρίσκω sa kontekstong ito; ipinapakita nitong natukoy niya ang hinahanap na bahagi nang hindi nagpapahiwatig ng labis na hirap.
- source_word: τόπον
  choice: ang bahagi
  rationale: Bagaman literal na 'lugar,' tumutukoy ito rito sa isang lokasyon o bahagi ng nakasulat na teksto. Mas natural sa Filipino ang 'bahagi' habang nananatiling kongkreto ang reperensiya.
- source_word: οὗ ἦν γεγραμμένον
  choice: kinasusulatan ng ganito
  rationale: Natural na panimulang pormula sa Filipino para sa kasunod na sipi at naipapahayag ang nananatiling nakasulat na kalagayan ng periphrastic perfect.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may marangal ngunit payak na himig. Ginamit ang 'balumbon' para sa katumpakang pangkasaysayan; ang talababa ay nagpapanatili sa mas malawak na posibilidad ng salitang Griyego. Ang 'kinasusulatan ng ganito' ay natural na nag-uugnay sa siping kasunod.
