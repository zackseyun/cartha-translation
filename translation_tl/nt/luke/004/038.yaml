  verdict: revise
  source_fidelity: Ang “nakiusap sila sa kanya para sa babae” ay isang posibleng kontekstuwal na pagpapaliwanag, ngunit mas tiyak ito kaysa sa ἠρώτησαν αὐτὸν περὶ αὐτῆς, na payak na nagsasabing nagtanong sila sa kanya tungkol sa babae. Dapat manatili ang mas maingat na saklaw sa pangunahing teksto at ilagay ang diwang pakiusap sa talababa. Ang “Pagkaalis niya sa sinagoga” ay likas na naipahahayag ang idiomatikong ἀναστὰς ... ἀπό sa kontekstong ito.
  naturalness: Mas natural sa makabagong Filipino ang “Pagkaalis niya sa sinagoga” kaysa “Pagkatayo niya at pag-alis sa sinagoga.” Ang “ina ng asawa ni Simon” ay malinaw, likas, at tiyak na naihahayag ang πενθερά nang hindi gumagamit ng medyo alanganing “biyenang babae.”
  terminology: Napanatili ang “sinagoga,” “Simon,” at “lagnat.” Walang idinagdag na doktrinal na pahiwatig mula sa ugnayang pampamilya. Ang “matinding lagnat” ay angkop para sa πυρετῷ μεγάλῳ.
  issues:
  - severity: medium
    issue: Masyadong tiyak ang pangunahing salin ng ἠρώτησαν αὐτὸν περὶ αὐτῆς.
    rationale: Ang “nakiusap sila sa kanya para sa babae” ay maaaring tama ayon sa konteksto, ngunit ang Griyego ay mas maingat na “nagtanong sila sa kanya tungkol sa kanya.” Ang kontekstuwal na diwang paghingi ng tulong ay higit na angkop sa talababa.
  - severity: low
    issue: Hindi gaanong likas ang “Pagkatayo niya at pag-alis sa sinagoga.”
    rationale: Ang dobleng nominal na ayos ay mabigat sa Filipino. Ang “Pagkaalis niya sa sinagoga” ay malinaw na naghahatid ng paglipat mula sa sinagoga bago siya pumasok sa bahay.
  - severity: low
    issue: Hindi karaniwan ang “biyenang babae.”
    rationale: Bagaman nauunawaan, mas likas at mas tiyak ang “ina ng asawa ni Simon” para sa babaeng biyenan.
