source:
  edition: SBLGNT
  text: Ἀναστὰς δὲ ⸀ἀπὸ τῆς συναγωγῆς εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος. πενθερὰ δὲ τοῦ Σίμωνος ἦν συνεχομένη πυρετῷ μεγάλῳ, καὶ ἠρώτησαν αὐτὸν περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/038.yaml
  text: And after rising from the synagogue[a], he entered Simon’s house. Now Simon’s mother-in-law was afflicted with a high fever, and they asked him about her.
translation:
  language: tl
  text: Pagkaalis niya sa sinagoga, pumasok siya sa bahay ni Simon. Ang ina ng asawa ni Simon ay pinahihirapan ng matinding lagnat, at tinanong nila siya tungkol sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nakiusap sila sa kanya para sa kanya.” Literal na “tinanong nila siya tungkol sa kanya.” Sa kontekstong ito, maaaring nagpapahiwatig ito ng pakiusap na tulungan siya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς δὲ ἀπὸ τῆς συναγωγῆς
  choice: Pagkatayo niya at pag-alis sa sinagoga
  rationale: Ang aorist participle na Ἀναστάς ay kilos na nauna sa pangunahing pandiwang εἰσῆλθεν, at ang ἀπό ay nagpapahiwatig ng paglayo mula sa sinagoga. Ipinahahayag ng salin ang pagkakasunod ng mga kilos sa likas na Tagalog.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος
  choice: pumasok siya sa bahay ni Simon
  rationale: Tuwirang inilalarawan ng εἰσέρχομαι na may εἰς ang pagpasok sa isang lugar; malinaw at likas sa Tagalog ang napiling pananalita.
- source_word: πενθερὰ τοῦ Σίμωνος
  choice: ang biyenang babae ni Simon
  rationale: Partikular na tumutukoy ang πενθερά sa isang babaeng biyenan. Nililinaw ng “biyenang babae” ang kasarian nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: ἦν συνεχομένη
  choice: ay pinahihirapan
  rationale: Ipinahihiwatig ng periphrastic passive construction ang patuloy na pagkakahawak o pagkakapighati ng karamdaman sa babae. Pinananatili ng “pinahihirapan” ang pasibong lakas nito sa malinaw na Tagalog.
- source_word: πυρετῷ μεγάλῳ
  choice: ng matinding lagnat
  rationale: Ang μέγας ay nagpapatingkad sa tindi ng πυρετός. Ang “matinding lagnat” ay natural na pananalitang Filipino at hindi kailangang ipakahulugang espesipikong sukat ng temperatura.
- source_word: ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: nakiusap sila sa kanya para sa babae
  rationale: Maaaring mangahulugan ang ἐρωτάω ng pagtatanong o paghiling. Sa konteksto ng karamdaman at pagpapagaling, likas ang diwang pagmamakaawa para sa babae, habang itinatala sa talababa ang mas literal at hindi gaanong tiyak na pagbasa.
theological_decisions:
- issue: Pahiwatig ng πενθερά tungkol sa kalagayang may-asawa ni Simon
  choice: Isalin lamang ang tiyak na ugnayang pampamilya bilang “biyenang babae ni Simon.”
  alternative: Ipaliwanag sa mismong teksto na may asawa si Simon.
  rationale: Malinaw na ipinahihiwatig ng katawagang pampamilya na may asawa si Simon, ngunit hindi tahasang sinasabi ng talata iyon at hindi dapat palawakin ng salin ang teksto.
- issue: Lakas ng kahilingan sa ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: nakiusap sila sa kanya para sa babae
  alternative: tinanong nila siya tungkol sa babae
  rationale: Sinusuportahan ng konteksto ang isang pakiusap para sa kanyang kapakanan, ngunit tunay na maaaring maging mas payak ang salitang Griyego. Kaya inilalagay sa talababa ang mas literal na alternatibo upang mapanatili ang saklaw ng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Iniwasan ang sobrang literal na ayos na magiging asiwa sa Tagalog, ngunit pinanatili ang pagkakasunod ng mga kilos, ang pasibong bigat ng karamdaman, at ang tunay na saklaw ng kahulugan ng kahilingan.
