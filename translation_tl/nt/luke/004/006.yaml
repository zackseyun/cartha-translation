  text: καὶ εἶπεν αὐτῷ ὁ διάβολος· Σοὶ δώσω τὴν ἐξουσίαν ταύτην ἅπασαν καὶ τὴν δόξαν αὐτῶν, ὅτι ἐμοὶ παραδέδοται καὶ ᾧ ⸀ἂν θέλω δίδωμι αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/006.yaml
  text: And the devil said to him[a], “I will give you all this authority and their glory, because it has been handed over to me, and I give it to whomever I want.”
translation:
  language: tl
  text: At sinabi ng diyablo sa kanya, “Ibibigay ko sa iyo ang lahat ng awtoridad na ito at ang kanilang kaluwalhatian[a], sapagkat naipagkaloob na sa akin ang awtoridad na ito, at ibinibigay ko ito sa sinumang nais ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang karangyaan.” Sa kontekstong ito, ang salitang Griyego ay maaaring tumukoy sa kaluwalhatian, karangyaan, o kadakilaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: diyablo
  rationale: Sa salaysay ng pagtukso, personal na katawagan ito kay Satanas; ang kinikilalang katawagang “diyablo” ay mas angkop kaysa sa etimolohikong “maninirang-puri.”
- source_word: Σοὶ δώσω
  choice: Ibibigay ko sa iyo
  rationale: Pinananatili nito ang diin sa tatanggap sa natural na ayos ng modernong Tagalog.
- source_word: ἐξουσίαν
  choice: awtoridad
  rationale: Tumutukoy ito sa karapatan o kapangyarihang mamahala, hindi lamang sa lakas.
- source_word: ταύτην ἅπασαν
  choice: lahat ng awtoridad na ito
  rationale: Malinaw at natural nitong ipinahahayag ang kabuuang saklaw ng awtoridad na tinutukoy.
- source_word: δόξαν αὐτῶν
  choice: kanilang kaluwalhatian
  rationale: Pinananatili ng “kaluwalhatian” ang lawak at biblikal na ugnayan ng δόξα, habang ang panghalip ay tumutukoy sa mga kahariang ipinakita sa naunang talata.
- source_word: παραδέδοται
  choice: ibinigay na ito sa akin
  rationale: Ipinahahayag ng anyong ganap na balintiyak ang naunang pagbibigay na may nananatiling resulta, nang hindi ipinahihiwatig na lehitimo ang pahayag ng diyablo.
- source_word: ᾧ ἂν θέλω
  choice: sa sinumang nais ko
  rationale: Natural nitong ipinahahayag ang di-tiyak na taong pinagpapasiyahan ng nagsasalita.
- source_word: δίδωμι αὐτήν
  choice: ibinibigay ko ito
  rationale: Ang pangkasalukuyang anyo ay nagpapahayag ng pangkalahatan o kinaugaliang kilos.
theological_decisions:
- issue: Kung dapat bang ipahiwatig ng salin na pinagtitibay ng salaysay ang pag-aangkin ng diyablo sa awtoridad sa mga kaharian
  choice: Tuwirang isalin bilang mismong pahayag ng diyablo nang walang idinagdag na panangga o pagpapatibay.
  alternative: Magdagdag ng pananalitang naglalayo sa salaysay, gaya ng “inaangkin niyang ibinigay ito sa kanya.”
  rationale: Tuwirang pananalita ng diyablo ang nasa Griyego. Sapat nang ipinakikilala ng konteksto kung sino ang nagsasalita; hindi dapat lutasin ng salin kung totoo o lehitimo ang kanyang pag-aangkin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “awtoridad” para sa pampamahalaang diwa ng ἐξουσία at “kaluwalhatian” upang mapanatili ang biblikal na lawak ng δόξα, na may talababa para sa mas kontekstuwal na alternatibo.
