  - severity: low
    issue: Medyo di-karaniwan ang ayos na “Sinabi sa kanya ng diyablo.”
    rationale: Mas malinaw at natural ang tuwirang ayos na “At sinabi ng diyablo sa kanya,” lalo na sa salaysay.
  - severity: low
    issue: Maaaring maging malabo ang “ibinigay na ito sa akin” kung ano ang tinutukoy ng singular na “ito.”
