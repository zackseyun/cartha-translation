- from: Sinabi sa kanya ng diyablo, “Ibibigay ko sa iyo ang lahat ng awtoridad na ito at ang kanilang kaluwalhatian[a], sapagkat ibinigay na ito sa akin, at ibinibigay ko ito sa sinumang nais ko.”
  to: At sinabi ng diyablo sa kanya, “Ibibigay ko sa iyo ang lahat ng awtoridad na ito at ang kanilang kaluwalhatian[a], sapagkat naipagkaloob na sa akin ang awtoridad na ito, at ibinibigay ko ito sa sinumang nais ko.”
