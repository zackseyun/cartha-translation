  source_fidelity: 'Tumpak sa kabuuan ang paglilipat ng diwa: ang diyablo ang nagsasalita, ang saklaw ay lahat ng awtoridad at ang kaluwalhatian ng mga kaharian, at ang pahayag tungkol sa pagkakaloob at pamamahagi ay nananatiling sariling pag-aangkin ng diyablo. Gayunman, ang panimulang καί ay hindi naisama, at ang ayos na “Sinabi sa kanya ng diyablo” ay mas hindi tuwiran kaysa sa karaniwang modernong Tagalog. Nililinaw rin ng rebisyon na ang singular na “ito” sa huling mga sugnay ay tumutukoy sa “awtoridad,” alinsunod sa pambabaeng singular na αὐτήν.'
  naturalness: Mas natural at malinaw sa modernong Filipino Tagalog ang “At sinabi ng diyablo sa kanya” kaysa “Sinabi sa kanya ng diyablo.” Ang “naipagkaloob na sa akin ang awtoridad na ito” ay maayos na nagpapahiwatig ng ganap na balintiyak na pandiwa nang hindi nagdaragdag ng paghatol sa katotohanan ng pahayag.
  terminology: Ang “diyablo,” “awtoridad,” at “kaluwalhatian” ay angkop sa rehistro at konteksto. Napananatili ng talababa ang “karangyaan” bilang leksikal na alternatibo para sa δόξα.
