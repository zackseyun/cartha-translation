id: LUK.4.16
reference: Luke 4:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν ⸀εἰς Ναζαρά, οὗ ἦν τεθραμμένος, καὶ εἰσῆλθεν κατὰ τὸ εἰωθὸς αὐτῷ ἐν τῇ ἡμέρᾳ τῶν σαββάτων εἰς τὴν συναγωγήν, καὶ ἀνέστη ἀναγνῶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/016.yaml
  text: And he came to Nazara[a], where he had been brought up, and as was his custom, he entered the synagogue on the Sabbath day, and stood up to read.
translation:
  language: tl
  text: Dumating siya sa Nazara[a], kung saan siya lumaki. Gaya ng nakaugalian niya, pumasok siya sa sinagoga noong araw ng Sabbath at tumayo upang bumasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nazaret.” Nazara ang mababasa sa Griyego rito.
    reason: alternative_reading
lexical_decisions:
- source_word: Ναζαρά
  choice: Nazara
  rationale: Tuwirang kinakatawan nito ang anyong Griyego sa talatang ito, sa halip na iayon agad sa mas pamilyar na pangalang Nazaret.
- source_word: τεθραμμένος
  choice: kung saan siya lumaki
  rationale: Sa konteksto, tumutukoy ang perpektong pasibong participle sa lugar ng kanyang pagpapalaki; natural at malinaw sa modernong Tagalog ang “lumaki.”
- source_word: κατὰ τὸ εἰωθὸς αὐτῷ
  choice: Gaya ng nakaugalian niya
  rationale: Ipinahahayag nito ang palagiang gawain ni Jesus sa natural ngunit marangal na Tagalog.
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: nang araw ng Sabbath
  rationale: Bagaman pangmaramihan ang anyong σαββάτων, idyomatiko itong tumutukoy sa araw ng Sabbath sa kontekstong ito.
- source_word: συναγωγήν
  choice: sinagoga
  rationale: Ito ang malinaw at kinikilalang tawag sa pook o institusyong Judio na tinutukoy rito.
- source_word: ἀνέστη ἀναγνῶναι
  choice: tumayo upang bumasa
  rationale: 'Pinananatili nito ang layuning ipinahahayag ng infinitive: tumayo siya para sa pagbasa.'
theological_decisions:
- issue: Pagbaybay sa pangalang Ναζαρά
  choice: Nazara
  alternative: Nazaret
  rationale: Sinusunod ng pangunahing teksto ang mismong anyong Griyego sa talatang ito at hindi ito awtomatikong itinutugma sa mas pamilyar na anyo; inilalahad sa talababa ang karaniwang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Sabbath” upang mapanatili ang tiyak na katawagang Judio, at “bumasa” para sa pormal na pampublikong pagbasa sa sinagoga.
