  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀναστάντες ἐξέβαλον αὐτὸν ἔξω τῆς πόλεως, καὶ ἤγαγον αὐτὸν ἕως ὀφρύος τοῦ ὄρους ἐφ’ οὗ ἡ πόλις ⸂ᾠκοδόμητο αὐτῶν, ὥστε⸃ κατακρημνίσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/029.yaml
  text: And rising up[a], they drove him out of the town and led him to the brow of the hill on which their town had been built[b], so as to throw him down.
translation:
  language: tl
  text: At tumayo sila at itinaboy siya palabas ng bayan, at dinala nila siya hanggang sa gilid ng burol na kinatatayuan ng kanilang bayan upang ihagis siya pababa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang ihulog siya pababa” o “upang ihulog siya sa bangin.” Ang pandiwang Griyego ay tumutukoy sa paghahagis o paghuhulog sa isang tao mula sa mataas na lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: pagtayo nila
  rationale: Ipinahahayag ng aorist participle ang pagbangon o pagtayo ng mga tao upang agad kumilos; natural at hindi labis ang “pagtayo nila” sa Filipino.
- source_word: ἐξέβαλον
  choice: itinaboy ... palabas
  rationale: Ipinakikita ng ἐκβάλλω rito ang sapilitang pagpapaalis. Iniiwasan ng “itinaboy” ang posibleng panrelihiyong dating ng “pinalayas” habang pinananatili ang puwersa ng kilos.
- source_word: πόλεως
  choice: bayan
  rationale: Ang πόλις ay maaaring lungsod o bayan; ang “bayan” ay angkop sa Nazaret at natural sa modernong Filipino.
- source_word: ἤγαγον
  choice: dinala
  rationale: Malawak ang kahulugan ng ἄγω na akayin o dalhin. Hindi ginamit ang “kinaladkad” sapagkat magdaragdag iyon ng paraang hindi tahasang sinasabi ng pandiwa.
- source_word: ἕως ὀφρύος τοῦ ὄρους
  choice: sa gilid ng burol
  rationale: Ang ὀφρύς ay literal na kilay at, sa anyong-lupa, gilid o matarik na labi ng isang mataas na lugar. Malinaw at likas sa Filipino ang “gilid ng burol.”
- source_word: ἐφ’ οὗ ἡ πόλις ᾠκοδόμητο αὐτῶν
  choice: na kinatatayuan ng kanilang bayan
  rationale: Ipinapahayag nito na ang bayan ay nakatayo o naitayo sa burol. Ang “kinatatayuan” ay natural na katumbas sa Filipino at pinananatili ng “kanilang” ang αὐτῶν.
- source_word: ὥστε κατακρημνίσαι αὐτόν
  choice: upang ihulog siya mula roon
  rationale: Sa konteksto, ang ὥστε na may infinitive ay nagpapahayag ng nilalayong bunga. Ang κατακρημνίζω ay paghagis o paghuhulog mula sa mataas na lugar; nililinaw ng “mula roon” ang ipinahihiwatig na taas nang hindi tahasang nagdaragdag ng “bangin” sa pangunahing teksto.
theological_decisions:
- issue: Tindi ng karahasang ipinahihiwatig ng kilos ng mga tao
  choice: Ilarawan ang sapilitang pagtataboy at layuning ihulog si Jesus mula sa mataas na lugar nang hindi tinatawag itong tahasang pagtatangkang pagpatay.
  alternative: Isalin bilang “kinaladkad” o “tinangkang patayin,” o idagdag sa pangunahing teksto ang “bangin.”
  rationale: Malinaw ang nakamamatay na layunin sa pagkakasunod-sunod ng mga kilos, ngunit hindi dapat magdagdag ang salin ng paglalarawang hindi tahasang nasa Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang mabilis na daloy ng salaysay at ang marahas na layunin ng mga tao, nang hindi nagdaragdag ng paraang gaya ng pagkakaladkad o ng salitang “bangin” sa pangunahing teksto.
