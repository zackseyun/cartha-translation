  to: At tumayo sila at itinaboy siya palabas ng bayan, at dinala nila siya hanggang sa gilid ng burol na kinatatayuan ng kanilang bayan upang ihagis siya pababa.[a]
  rationale: Idinagdag ang “nila siya” upang ganap at malinaw na maisalin ang ἤγαγον αὐτόν, at ang “hanggang sa” upang maipakita ang ἕως. Pinalitan ang “mula roon” ng “pababa” at ginamit ang “ihagis” upang maipahayag ang direksiyon at marahas na puwersa ng κατακρημνίσαι nang hindi nagdaragdag ng “bangin” sa pangunahing teksto. Nananatiling hindi tinutukoy ng salin ang isang partikular na paraan o tahasang motibo na lampas sa teksto.
