id: LUK.4.41
reference: Luke 4:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐξήρχετο δὲ καὶ δαιμόνια ἀπὸ πολλῶν ⸀κραυγάζοντα καὶ λέγοντα ὅτι Σὺ ⸀εἶ ὁ υἱὸς τοῦ θεοῦ. καὶ ἐπιτιμῶν οὐκ εἴα αὐτὰ λαλεῖν, ὅτι ᾔδεισαν τὸν χριστὸν αὐτὸν εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/041.yaml
  text: Demons also were coming out of many[a], crying out and saying, “You are the Son of God!” But rebuking them, he would not allow them to speak, because they knew that he was the Messiah.
translation:
  language: tl
  text: Lumalabas din ang mga demonyo mula sa maraming tao, habang sumisigaw at nagsasabi, “Ikaw ang Anak ng Diyos!” Ngunit sinasaway sila ni Jesus at hindi niya sila hinahayaang magsalita, sapagkat alam nilang siya ang Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang salitang Griyego na Χριστός ay nangangahulugang “Mesiyas” o “Pinahiran.”
    reason: Pinananatili ang kinikilalang alternatibong salin ng titulong Χριστός.
lexical_decisions:
- source_word: δαιμόνια
  choice: mga demonyo
  rationale: Tuwirang katumbas ito ng pangngalang Griyego at hindi ito pinapalitan ng “mga maruming espiritu,” na salin ng ibang pariralang Griyego.
- source_word: ἐξήρχετο
  choice: lumalabas
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang nagpapatuloy o paulit-ulit na pangyayari; natural itong naihahayag sa Filipino sa anyong “lumalabas.”
- source_word: ἀπὸ πολλῶν
  choice: mula sa maraming tao
  rationale: Hindi binanggit sa Griyego ang tahasang pangngalan pagkatapos ng “marami,” ngunit malinaw sa konteksto na mga tao ang tinutukoy. Idinagdag ang “tao” upang maging likas at malinaw sa modernong Filipino.
- source_word: κραυγάζοντα καὶ λέγοντα
  choice: habang sumisigaw at nagsasabi
  rationale: Pinananatili nito ang malakas na pagsigaw at ang kasunod na nilalaman ng kanilang sinabi, at nililinaw na ang mga demonyo ang gumagawa nito.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ang Anak ng Diyos
  rationale: Pinananatili ang pormal at kinikilalang bigat ng titulong kristolohikal.
- source_word: ἐπιτιμῶν
  choice: sinasaway
  rationale: Ipinahahayag nito ang matalim at may-awtoridad na pagsaway ni Jesus nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: οὐκ εἴα αὐτὰ λαλεῖν
  choice: hindi niya sila hinahayaang magsalita
  rationale: Ang “hinahayaang” ay likas na Filipino at naipakikita ang paulit-ulit o patuloy na pagtanggi na ipinahihiwatig ng imperpektibong pandiwa.
- source_word: ᾔδεισαν
  choice: alam nila
  rationale: Ang statibong diwa ng οἶδα ay likas na isinasalin sa Filipino bilang “alam,” samantalang ang konteksto ang nagtatakda sa nakaraang tagpo.
- source_word: τὸν χριστὸν
  choice: ang Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulo ng pinahiran at hindi bilang pangalang pantangi; mas malinaw na naipahahayag ito ng “Mesiyas.”
- source_word: αὐτὸν εἶναι
  choice: na siya ang
  rationale: Ito ang likas na Filipino para sa accusative-infinitive construction pagkatapos ng pandiwang “alam.”
theological_decisions:
- issue: Pagbibigay-salin sa Χριστός sa pagkilala ng mga demonyo
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang salita ay gumaganap bilang titulo sa salaysay. Pinananatili sa talababa ang tradisyonal na alternatibong “Cristo” nang hindi ginagawang pangalang pantangi ang termino sa pangunahing teksto.
- issue: Ugnayan ng “Anak ng Diyos” at “Mesiyas”
  choice: Pinanatiling magkaiba ang dalawang titulo
  alternative: Pagsamahin ang mga ito sa iisang paliwanag o titulo
  rationale: “Anak ng Diyos” ang sigaw ng mga demonyo, samantalang “Mesiyas” ang pagkakakilanlang ibinibigay ng tagapagsalaysay. Hindi ipinapantay o ipinapaliwanag nang lampas sa sinasabi ng Griyego ang kanilang ugnayan.
- issue: Paksa ng pagsigaw at pagsasalita
  choice: Ang mga demonyo ang sumisigaw at nagsasalita
  alternative: Ang maraming taong nilalabasan nila ang sumisigaw
  rationale: Ang mga participle na κραυγάζοντα at λέγοντα ay neuter plural at umaayon sa δαιμόνια, kaya malinaw na mga demonyo ang tinutukoy.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “ni Jesus” sa halip na isang di-likas o maaaring malabong panghalip upang luminaw ang paksa ng pagsaway; ang pangalan ay malinaw mula sa agarang konteksto. Ang “mula sa maraming tao” ay bahagyang nagpapahayag sa ipinahihiwatig lamang ng Griyego upang maiwasan ang alanganing “mula sa marami.”
