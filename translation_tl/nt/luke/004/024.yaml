  text: εἶπεν δέ· Ἀμὴν λέγω ὑμῖν ὅτι οὐδεὶς προφήτης δεκτός ἐστιν ἐν τῇ πατρίδι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/024.yaml
  text: And he said[a], “Truly I tell you, no prophet is accepted in his hometown.”
translation:
  language: tl
  text: 'Sinabi pa niya, “Tunay na sinasabi ko sa inyo: walang propetang tinatanggap sa sarili niyang bayan.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lugar na kanyang kinalakhan” o “sa kanyang lupang tinubuan.” Ang Griyegong πατρίς ay maaaring tumukoy sa sariling bayan, rehiyon, o lupang tinubuan; sa kontekstong ito, ang tinutukoy ay ang Nazaret.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Sinabi pa niya
  rationale: Ang δέ ay banayad na pang-ugnay sa pagpapatuloy ng pagsasalita. Likas sa modernong Tagalog ang “Sinabi pa niya” at hindi nito pinalalabis ang diwang pasalungat.
- source_word: Ἀμὴν
  choice: Tunay na
  rationale: Sa mga pahayag ni Jesus, ipinakikilala ng ἀμήν ang isang taimtim at tiyak na pagpapatunay. Malinaw na naihahatid ito ng “Tunay na” sa Tagalog.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Pinananatili nito ang tuwirang pakikipag-usap at taimtim na tono ng karaniwang pormulang Griyego.
- source_word: οὐδεὶς προφήτης
  choice: walang propeta
  rationale: Ito ang tuwiran, maikli, at likas na Tagalog para sa negatibong simuno.
- source_word: δεκτός
  choice: tinatanggap
  rationale: Saklaw nito ang diwa ng pagkilala at mabuting pagtanggap sa isang tao; mas malawak ito kaysa sa “malugod na tinatanggap.”
- source_word: ἐν τῇ πατρίδι αὐτοῦ
  choice: sa sarili niyang bayan
  rationale: Maaaring tumukoy ang πατρίς sa sariling bayan, lugar na kinalakhan, rehiyon, o lupang tinubuan. Ang “sarili niyang bayan” ay natural sa Tagalog at angkop sa tagpuan sa Nazaret habang pinananatili ang lawak ng salita.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “propeta,” ang karaniwang terminong biblikal, at iniwasan ang labis na teknikal o makalumang pananalita.
