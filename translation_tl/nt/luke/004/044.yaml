  text: καὶ ἦν κηρύσσων ⸂εἰς τὰς συναγωγὰς⸃ τῆς ⸀Ἰουδαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/044.yaml
  text: And he was preaching in the synagogues of Judea[a].
translation:
  language: tl
  text: At patuloy siyang nangaral sa mga sinagoga ng Judea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Galilea” ang mababasa sa ilang manuskrito sa halip na “Judea.” Sinusunod ng pangunahing teksto ang pagbasa na “Judea” sa tekstong Griyego na ginamit dito.
    reason: textual_variant
lexical_decisions:
- source_word: ἦν κηρύσσων
  choice: patuloy siyang nangaral
  rationale: Ang periphrastic imperfect ay nagpapahayag ng nagpapatuloy o paulit-ulit na gawain sa nakaraan. Likas sa modernong Tagalog ang “patuloy siyang nangaral” at malinaw nitong naihahatid ang aspektong ito.
- source_word: κηρύσσων
  choice: nangaral
  rationale: Ang κηρύσσω ay tumutukoy sa hayagang pagpapahayag. Sa konteksto ng ministeryo sa mga sinagoga, ang “nangaral” ay natural at dignidad na katumbas sa Tagalog.
- source_word: εἰς τὰς συναγωγάς
  choice: sa mga sinagoga
  rationale: Bagaman karaniwang may diwang “papasok sa” ang εἰς, dito ay tinutukoy nito ang lugar o saklaw ng pangangaral. Pinakamalinaw at natural sa Tagalog ang “sa mga sinagoga.”
- source_word: συναγωγάς
  choice: mga sinagoga
  rationale: Sa kontekstong ito, ang συναγωγή ay tumutukoy sa mga pagtitipon o gusaling sambahan ng mga Judio. Ang “sinagoga” ang pamantayan at madaling makilalang salin.
- source_word: Ἰουδαίας
  choice: Judea
  rationale: Ang Ἰουδαία ay karaniwang tumutukoy sa Judea. Pinananatili ang pagbasa ng SBLGNT kahit maaaring asahan ang Galilea dahil sa nakapaligid na konteksto; itinatala sa talababa ang tekstuwal na pagkakaiba sa halip na pag-isahin ang mga ito.
theological_decisions:
- issue: Ang heograpikong pagtukoy na τῆς Ἰουδαίας sa gitna ng kontekstong Galileano
  choice: Judea
  alternative: Galilea; o Judea sa mas malawak na diwang tumutukoy sa lupain ng mga Judio
  rationale: Sinusunod ng pangunahing teksto ang pagbasa ng SBLGNT na “Judea” at hindi ito inaayon nang tahimik sa konteksto. Pinananatili ang tunay na tekstuwal at heograpikong tensiyon, habang inilalahad sa talababa ang alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “patuloy siyang nangaral” upang maipahayag ang nagpapatuloy o paulit-ulit na kilos ng periphrastic imperfect nang hindi nagiging teknikal o mabigat.
