revisions:
- from: At hindi isinugo si Elias sa kahit isa sa kanila, kundi sa isang biyuda sa Sarepta na sakop ng Sidon.[a]
  to: At hindi isinugo si Elias sa alinman sa kanila, maliban sa Sarepta[a] ng Sidon, sa isang biyuda.
  rationale: Inayos ang pagkakasunod ng mga parirala upang unang tukuyin ang Sarepta ng Sidon bilang hantungan at pagkatapos ay ang biyuda bilang taong pinuntahan, alinsunod sa Griyego. Pinalitan ang “na sakop ng Sidon” ng “ng Sidon” upang iwasan ang hindi kailangang pagpapakahulugan. Inilipat ang tanda ng talababa sa “Sarepta,” ang terminong ipinaliliwanag nito.
