  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πρὸς οὐδεμίαν αὐτῶν ἐπέμφθη Ἠλίας εἰ μὴ εἰς Σάρεπτα τῆς ⸀Σιδωνίας πρὸς γυναῖκα χήραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/026.yaml
  text: And Elijah was sent to none of them[a], except to Zarephath of Sidon, to a widow.
translation:
  language: tl
  text: At hindi isinugo si Elias sa alinman sa kanila, maliban sa Sarepta[a] ng Sidon, sa isang biyuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Griyego ay “Sarepta ng Sidon”; karaniwang kinikilalang ito ang Zarefat sa Lumang Tipan (1 Hari 17:9).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπέμφθη
  choice: isinugo
  rationale: Pinananatili ng anyong balintiyak ang hindi tahasang binanggit na tagapagsugo, gaya sa Griyego, habang natural ang pandiwang “isinugo” sa konteksto.
- source_word: πρὸς οὐδεμίαν αὐτῶν
  choice: sa kahit isa sa kanila
  rationale: Kasama ng negatibong pandiwa, malinaw at likas itong nagpapahayag na walang sinuman sa grupong tinutukoy ang pinuntahan ni Elias.
- source_word: Ἠλίας
  choice: Elias
  rationale: Ito ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: εἰ μὴ
  choice: kundi
  rationale: Sa konstruksiyong ito, ang “kundi” ay malinaw na naghahayag ng eksepsiyon, hindi ng kondisyon.
- source_word: Σάρεπτα
  choice: Sarepta
  rationale: Sinusunod nito ang anyong Griyego ng pangalan ng lugar; ipinapaliwanag sa talababa ang kaugnayan nito sa Zarefat ng Lumang Tipan.
- source_word: τῆς Σιδωνίας
  choice: na sakop ng Sidon
  rationale: Ipinahahayag nito nang natural sa Filipino ang heograpikong kaugnayan ng Sarepta sa Sidon nang hindi labis na tinutukoy kung lungsod o mas malawak na nasasakupan ang ibig sabihin.
- source_word: γυναῖκα χήραν
  choice: isang biyuda
  rationale: Natural na pinaiikli sa Filipino ang literal na “isang babaeng balo” bilang “isang biyuda,” nang walang nawawalang kahulugan.
theological_decisions:
- issue: Hindi pinangalanang tagapagsugo kay Elias sa balintiyak na pandiwa
  choice: 'Panatilihin ang balintiyak: “isinugo si Elias”'
  alternative: 'Gawing tahasan ang Diyos: “isinugo ng Diyos si Elias”'
  rationale: Ipinahihiwatig ng konteksto na Diyos ang nagsugo, ngunit hindi Siya tahasang pinangalanan sa Griyego; pinananatili ng salin ang pagpipigil at bahagyang di-tahasang pahayag ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “biyuda,” na karaniwan at madaling maunawaan, at ang “na sakop ng Sidon” upang maging likas ang heograpikong paglalarawan. Inilagay ang talababa pagkatapos ng buong pangungusap dahil ang paliwanag ay tumutukoy sa pangalang Sarepta at sa kaugnayan nito sa Sidon.
