  yaml_path: translation/nt/luke/004/028.yaml
  text: And all in the synagogue were filled with anger when they heard these things,[a]
translation:
  language: tl
  text: Nang marinig ito, napuno ng matinding galit ang lahat ng nasa sinagoga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “napuno ng poot.” Ang Griyegong θυμός ay maaaring tumukoy sa matinding galit o poot.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: napuno
  rationale: Pinananatili nito ang larawang pasibo ng pagiging puspos o puno ng isang damdamin, at natural itong pakinggan sa modernong Filipino.
- source_word: πάντες
  choice: ang lahat
  rationale: Tumutukoy ito nang sama-sama sa lahat ng taong naroon, nang hindi nagdaragdag ng hindi tahasang sinabi sa Griyego.
- source_word: θυμοῦ
  choice: ng matinding galit
  rationale: Ang θυμός ay galit na malakas o nag-aalab. Nililinaw ng “matinding” ang lakas ng damdamin habang hindi awtomatikong pinipili ang mas sukdulang “poot.”
- source_word: ἐν τῇ συναγωγῇ
  choice: ng nasa sinagoga
  rationale: Natural na Filipino ito para sa lahat ng taong nasa loob ng sinagoga at pinananatili ang lokasyong ipinahahayag ng parirala.
- source_word: ἀκούοντες
  choice: Nang marinig
  rationale: Ipinahahayag nito ang kasabay na pangyayaring nagbigay-daan sa kanilang galit, sa natural na ayos ng pangungusap sa Filipino.
- source_word: ταῦτα
  choice: ito
  rationale: Bagaman maramihan ang Griyegong demonstratibo, natural sa Filipino ang “ito” bilang pagtukoy sa kabuuan ng mga kasasabi lamang ni Jesus; ang “ang mga bagay na ito” ay mas literal ngunit hindi gaanong natural.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inuna ang natural na ayos na “Nang marinig ito” at pinanatili ang matinding puwersa ng θυμός sa “matinding galit,” kasama ang alternatibo sa talababa.
