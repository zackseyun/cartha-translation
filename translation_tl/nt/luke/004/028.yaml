  source_fidelity: 'Tumpak na naipahahayag ng salin ang pangunahing diwa ng Griyego: ang lahat ng nasa sinagoga ay napuno ng θυμός habang/nang marinig nila ang mga bagay na ito. Ang "Nang marinig ito" ay natural na temporal na pagsasalin ng kasabay na participle ἀκούοντες, at ang isahang "ito" ay katanggap-tanggap na Filipino para sa kabuuan ng naunang sinabi, kahit maramihan ang ταῦτα.'
  naturalness: 'Napakanatural ng ayos sa makabagong Filipino: "Nang marinig ito, napuno ng matinding galit ang lahat ng nasa sinagoga." Malinaw rin ang saklaw ng "ang lahat" sa pamamagitan ng pariralang "ng nasa sinagoga."'
