  text: And news about him was spreading into every place in the surrounding region[a].
translation:
  language: tl
  text: At patuloy na lumaganap ang balita tungkol sa kanya sa bawat lugar sa nakapaligid na rehiyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Patuloy na lumalabas ang ulat tungkol sa kanya sa bawat lugar sa nakapaligid na rehiyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay na nagdurugtong sa talata sa naunang pangyayari.
- source_word: ἐξεπορεύετο
  choice: kumalat
  rationale: Ang imperfect ay naglalarawan ng patuloy na paglaganap noong nakaraan; sa konteksto ng ἦχος, natural sa Filipino ang 'kumalat' kaysa literal na 'lumalabas.'
- source_word: ἦχος
  choice: balita
  rationale: Bagaman maaari itong mangahulugang 'tunog,' ang pariralang περὶ αὐτοῦ ay nagpapakitang tumutukoy rito sa balita o ulat tungkol kay Jesus.
- source_word: περὶ αὐτοῦ
  choice: tungkol sa kanya
  rationale: Tuwirang ipinapahayag ang nilalaman ng balitang kumakalat.
- source_word: εἰς πάντα τόπον
  choice: sa bawat lugar
  rationale: Pinananatili ang distributibong diwa ng πάντα τόπον sa natural na Filipino.
- source_word: τῆς περιχώρου
  choice: sa buong karatig na lupain
  rationale: Ipinahahayag ang heograpikong diwa ng περίχωρος bilang nakapaligid o karatig na rehiyon, nang hindi ipinapalagay ang isang tiyak na hangganang pampolitika.
