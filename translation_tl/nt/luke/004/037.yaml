  source_fidelity: 'Tumpak ang pangunahing diwa: ang balita/ulat tungkol kay Jesus ay lumaganap sa lahat ng lugar sa nakapaligid na rehiyon. Gayunman, ang “buong” ay hindi kailangan at bahagyang nagdaragdag ng saklaw na hindi tuwirang ipinahahayag ng περίχωρος. Ang “patuloy na lumaganap” ay mas malinaw na naghahatid ng diwang imperpektibo ng ἐξεπορεύετο.'
  naturalness: Natural at marangal ang “lumaganap ang balita tungkol sa kanya.” Mas malinaw at mas payak ang ayos na inuuna ang paksa, at ang “nakapaligid na rehiyon” ay karaniwang modernong Filipino para sa isang heograpikong distrito.
