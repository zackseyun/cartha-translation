  text: ἤρξατο δὲ λέγειν πρὸς αὐτοὺς ὅτι Σήμερον πεπλήρωται ἡ γραφὴ αὕτη ἐν τοῖς ὠσὶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/021.yaml
  text: Then he began to say to them[a], “Today this Scripture has been fulfilled in your hearing.”
translation:
  language: tl
  text: Pagkatapos, nagsimula siyang magsalita sa kanila, “Ngayon ay natupad ang Kasulatang ito sa inyong pakikinig.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa inyong mga tainga.”
    reason: Ipinapakita ang literal na larawan sa Griyego sa likod ng idyomatikong saling “sa inyong pakikinig.”
lexical_decisions:
- source_word: ἤρξατο
  choice: nagsimula
  rationale: Pinananatili ang pagsisimula ng pagsasalita na ipinahihiwatig ng aorist middle na ἤρξατο, nang hindi dinaragdagan ang nilalaman ng sinabi.
- source_word: δὲ
  choice: Pagkatapos
  rationale: Dito, ang δέ ay nagsasaad ng pagpapatuloy ng salaysay, hindi ng matinding pagsalungat; natural na inililipat ng “Pagkatapos” ang tagpo mula sa pagbasa tungo sa pahayag ni Jesus.
- source_word: λέγειν πρὸς αὐτοὺς
  choice: magsabi sa kanila
  rationale: Ang infinitive na λέγειν ay pandagdag sa ἤρξατο, at ang πρὸς αὐτούς ay tumutukoy sa mga taong kinakausap niya.
- source_word: Σήμερον
  choice: Ngayon
  rationale: Inilalagay sa unahan upang mapanatili ang diin at agarang panahon ng katuparan.
- source_word: πεπλήρωται
  choice: ay natupad
  rationale: Ang perpektong pasibong anyo ay tumutukoy sa katuparang naganap na at may umiiral na bunga. Natural sa Tagalog ang “natupad” at hindi nito ginagawang tahasang si Jesus ang tagaganap ng katuparan.
- source_word: ἡ γραφὴ αὕτη
  choice: ang Kasulatang ito
  rationale: Ang γραφή ay tumutukoy sa sagradong tekstong kababasa lamang; ipinahahayag ito ng “Kasulatan” nang maikli at pormal.
- source_word: ἐν τοῖς ὠσὶν ὑμῶν
  choice: habang naririnig ninyo
  rationale: Ito ang natural na Tagalog para sa idyomang literal na “sa inyong mga tainga,” at pinananatili ang diwang nagaganap ang ipinahahayag na katuparan sa mismong pakikinig ng mga naroon.
theological_decisions:
- issue: Kalikasan ng pahayag tungkol sa katuparan
  choice: Ihayag ang kasalukuyang katuparan ng Kasulatan nang hindi dinaragdagan kung sino ang tumupad o kung paano ito natupad.
  alternative: “Ngayon ay tinupad ko ang propesiyang ito habang naririnig ninyo.”
  rationale: Sinasabi ng Griyego na natupad ang “Kasulatang ito,” ngunit hindi nito tahasang idinaragdag ang “propesiya,” “sa pamamagitan ko,” o “tinupad ko.” Pinananatili ng salin ang pahiwatig at bigat ng konteksto nang hindi nilulutas sa mismong talata ang hindi tahasang sinabi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kasulatan” bilang kinikilalang katawagan sa sagradong teksto, at iniwasan ang pagpapaliwanag na lampas sa mismong Griyego.
