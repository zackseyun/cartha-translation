id: LUK.4.23
reference: Luke 4:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Πάντως ἐρεῖτέ μοι τὴν παραβολὴν ταύτην· Ἰατρέ, θεράπευσον σεαυτόν· ὅσα ἠκούσαμεν γενόμενα ⸂εἰς τὴν Καφαρναοὺμ⸃ ποίησον καὶ ὧδε ἐν τῇ πατρίδι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/023.yaml
  text: And he said to them[a], “Surely you will say to me this proverb, ‘Physician, heal yourself.’ Whatever we have heard was done in Capernaum, do here also in your hometown.”
translation:
  language: tl
  text: 'At sinabi niya sa kanila, “Tiyak na sasabihin ninyo sa akin ang kasabihang ito: ‘Manggagamot, pagalingin mo ang iyong sarili.’ Anuman ang narinig naming nangyari sa Capernaum,[a] gawin mo rin dito sa sarili mong bayan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal, “ang mga bagay na narinig naming nangyari patungo sa/papasok sa Capernaum.” Ginagamit sa Griyego ang εἰς (“patungo sa/papasok sa”), ngunit sa kontekstong ito ay lokatibo ang diwa: “sa Capernaum.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντως
  choice: Tiyak na
  rationale: Ipinahahayag nito ang mariing pag-asang sasabihin nga nila ang kasunod, habang pinananatili ang puwersa ng pandiwang nasa panghinaharap.
- source_word: ἐρεῖτέ μοι
  choice: sasabihin ninyo sa akin
  rationale: Tuwirang pinananatili ang panghinaharap na anyo bilang prediksiyon, hindi bilang utos o posibilidad.
- source_word: παραβολὴν
  choice: kasabihan
  rationale: Sa kontekstong ito, tumutukoy ito sa isang maikling sawikain o kawikaan, hindi sa isang pasalaysay na talinghaga. Mas natural sa modernong Tagalog ang “kasabihan” para sa mismong pahayag.
- source_word: Ἰατρέ
  choice: Manggagamot
  rationale: Tumutukoy ito sa isang taong nanggagamot. Pinananatili ng “Manggagamot” ang marangal at makasagisag na himig ng kasabihan nang hindi nagiging masyadong kolokyal.
- source_word: θεράπευσον σεαυτόν
  choice: pagalingin mo ang iyong sarili
  rationale: Pinananatili ang tuwirang utos at ang refleksibong diwa ng Griyego.
- source_word: ὅσα ἠκούσαμεν γενόμενα
  choice: Anuman ang narinig naming nangyari
  rationale: Pinananatili ang malawak na saklaw ng ὅσα at ang iniulat lamang na kaalaman ng mga nagsasalita; hindi nito tahasang tinutukoy kung anong uri ng mga pangyayari ang tinutukoy.
- source_word: εἰς τὴν Καφαρναοὺμ
  choice: sa Capernaum
  rationale: Bagaman εἰς ay karaniwang nangangahulugang “patungo sa” o “papasok sa,” ginagamit ito rito sa lokatibong diwa kasunod ng pandiwa ng pangyayari. Ang “sa Capernaum” ang natural na katumbas sa Tagalog.
- source_word: ποίησον καὶ ὧδε
  choice: gawin mo rin dito
  rationale: Pinananatili ang malawak na kahulugan ng ποιέω bilang “gawin” at ang dagdag na puwersa ng καί bilang “rin.”
- source_word: ἐν τῇ πατρίδι σου
  choice: sa sarili mong bayan
  rationale: Sa konteksto, ang πατρίς ay ang sariling lugar o bayang pinagmulan, hindi isang modernong bansang-estado. Iniiwasan din ng salin ang pagpapalagay na iyon ang literal na lugar ng kapanganakan.
theological_decisions:
- issue: Kalikasan ng παραβολή sa kontekstong ito
  choice: Isinalin bilang “kasabihan”
  alternative: “talinghaga” o “kawikaan”
  rationale: Ang “Manggagamot, pagalingin mo ang iyong sarili” ay isang maikling sawikain, hindi isang pasalaysay na talinghaga. Pinipili ang karaniwang salitang “kasabihan” nang hindi nagdaragdag ng isang partikular na doktrinal na pagbasa.
- issue: Tinukoy na mga pangyayari sa Capernaum
  choice: Pinanatiling pangkalahatan bilang “anuman ang narinig naming nangyari”
  alternative: “lahat ng narinig naming ginawa mo” o “mga himalang narinig naming ginawa mo”
  rationale: Hindi tahasang binabanggit ng Griyego ang simuno ng γενόμενα ni ang salitang “mga himala.” Pinananatili ng salin ang kalabuan at hindi idinaragdag na si Jesus ang gramatikal na gumagawa, kahit ipinahihiwatig iyon ng konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kasabihan” sa halip na teknikal o mas lumang “talinghaga,” at “sarili mong bayan” upang tukuyin ang sariling lugar nang hindi ito ginagawang bansang-estado o tiyak na lugar ng kapanganakan.
