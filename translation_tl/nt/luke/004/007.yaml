  text: Therefore[a], if you worship before me, it will all be yours.
translation:
  language: tl
  text: Kaya, kung sasamba ka sa harap ko, magiging iyo ang lahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “yumukod ka sa harap ko” o “magpatirapa ka sa harap ko.” Ang pandiwang Griyego ay maaaring mangahulugang yumukod o magpatirapa bilang pagpupugay; “sasamba” ang ginamit dito dahil sa konteksto ng relihiyosong pagpupugay sa diyablo.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: ka
  rationale: Ang tahasang panghalip na ikalawang panauhang isahan ay natural na ipinahahayag sa Filipino sa pamamagitan ng “ka”; hindi kailangang idagdag ang “ikaw mismo,” bagaman may bahagyang diin ang Griyego.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahahayag ng “Kaya” ang bunga o lohikal na kaugnayan ng kundisyon sa naunang alok, sa natural na modernong Filipino.
- source_word: ἐὰν
  choice: kung
  rationale: Karaniwang katumbas ng kondisyunal na ἐὰν na may subjunctive ang “kung.”
- source_word: προσκυνήσῃς
  choice: sasamba
  rationale: Maaaring tumukoy ang pandiwa sa pagyukod o pagpapatirapa, ngunit sa kontekstong ito ay hinihingi ang relihiyosong pagpupugay na para sa Diyos, gaya ng ipinakikita ng tugon ni Jesus sa kasunod na talata.
- source_word: ἐνώπιον ἐμοῦ
  choice: sa harap ko
  rationale: Tuwiran at likas na katumbas ito ng pariralang may kahulugang spatial at relational, nang hindi dinaragdagan ang teksto.
- source_word: ἔσται σοῦ
  choice: magiging iyo
  rationale: Natural na Filipino para sa future copula na sinusundan ng genitive na nagpapahayag ng pag-aari.
- source_word: πᾶσα
  choice: ang lahat ng ito
  rationale: Ang pambabaeng isahang anyo ay patalinghagang tumutukoy pabalik sa nasasakupan at kaluwalhatian ng mga kahariang binanggit sa naunang talata. Nililinaw ng “ito” ang reperensiya nang hindi nagdaragdag ng tiyak na pangngalang wala rito.
theological_decisions:
- issue: Kung ang προσκυνέω ay isasaling neutral na pisikal na kilos o relihiyosong pagpupugay
  choice: sasamba
  alternative: yuyukod / magpapatirapa
  rationale: Ang tukso ay humihingi sa diyablo ng pagpupugay na nararapat lamang sa Diyos, na pinagtitibay ng sagot ni Jesus sa kasunod na talata. Gayunman, pinananatili sa talababa ang pisikal na saklaw ng salitang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang payak na “Kaya” at “magiging iyo” para sa malinaw na daloy, habang pinanatili ng talababa ang leksikal na posibilidad ng pisikal na pagyukod.
