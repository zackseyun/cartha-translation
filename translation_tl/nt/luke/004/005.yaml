  text: Καὶ ἀναγαγὼν ⸀αὐτὸν ἔδειξεν αὐτῷ πάσας τὰς βασιλείας τῆς οἰκουμένης ἐν στιγμῇ χρόνου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/005.yaml
  text: And after leading him up[b][a], he showed him all the kingdoms of the inhabited world in a moment of time.
translation:
  language: tl
  text: At matapos siyang dalhin paitaas, ipinakita sa kanya ng diyablo ang lahat ng kaharian ng daigdig[a] sa isang iglap.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “ng daigdig na tinitirhan.” Maaari ring tumukoy ang salitang Griyego sa sibilisado o imperyal na mundo.
    reason: lexical_alternative
  - marker: b
    text: O “sa isang saglit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγαγὼν αὐτὸν
  choice: matapos siyang dalhin sa mataas na lugar
  rationale: Ipinahahayag ang pataas na direksiyon ng ἀνάγω at ang pagkakasunod ng kilos ng aorist participle, nang hindi idinaragdag ang “bundok,” na wala sa teksto ni Lucas.
- source_word: ἔδειξεν αὐτῷ
  choice: ipinakita sa kanya
  rationale: Likas at tuwirang salin ng karaniwang pandiwang δείκνυμι at ng di-tuwirang layon nito.
- source_word: πάσας τὰς βασιλείας
  choice: ang lahat ng kaharian
  rationale: Dito, ang βασιλεία ay tumutukoy sa mga kaharian o nasasakupan, hindi sa abstraktong paghahari.
- source_word: τῆς οἰκουμένης
  choice: sa daigdig
  rationale: Natural sa modernong Tagalog at saklaw ang ideya ng οἰκουμένη bilang daigdig na tinitirhan; pinananatili sa talababa ang mas tiyak na leksikal na diwa at ang posibleng sanggunian sa sibilisado o imperyal na mundo.
- source_word: ἐν στιγμῇ χρόνου
  choice: sa isang iglap
  rationale: Maikli at likas na katumbas na malinaw na naghahayag ng napakaikling sandali.
theological_decisions:
- issue: Paraan ng pagpapakita ng diyablo sa mga kaharian
  choice: Inilarawan lamang na ipinakita ng diyablo ang mga kaharian, nang hindi tinutukoy kung paano ito nangyari.
  alternative: Tukuyin itong isang pangitain, isang sobrenatural na pagpapakita, o literal na tanawin mula sa isang mataas na pook.
  rationale: Hindi nililinaw ng Griyego ang mekanismo. Ang salin ay hindi dapat magpasya kung pangitain, sobrenatural na pagpapakita, o literal na tanawin ito.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “mataas na lugar” upang maipahiwatig ang pataas na kilos nang hindi inaangkat ang “bundok” mula sa kaparehong salaysay sa Mateo. Tahasang binanggit ang “diyablo” bilang paksa para maging malinaw sa Tagalog ang ipinagpapatuloy na paksa mula sa konteksto.
