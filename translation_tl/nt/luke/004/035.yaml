  rationale: Pinalinaw ang pangwakas na panghalip sa pamamagitan ng “hindi siya nito sinaktan,” kung saan ang “nito” ay malinaw na tumutukoy sa demonyo at ang “siya” sa lalaki. Inayos din ang mga panghalip sa talababa b para sa parehong linaw. Hindi binago ang kahulugan, pagkakasunod, o antas ng diin ng pinagmulan.
