    rationale: Sa “nang hindi man lang siya sinaktan,” hindi tahasang nakasaad na ang demonyo ang hindi nanakit; gayundin, ang “siya” at “kaniya” sa talababa ay maaaring mangailangan ng paghimay. Ang paggamit ng “nito” para sa demonyo ay nagpapanatili ng pinagkaibang sanggunian nang hindi nagdaragdag ng paliwanag.
