  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ⸀ἀπ’ αὐτοῦ. καὶ ῥίψαν αὐτὸν τὸ δαιμόνιον εἰς ⸀τὸ μέσον ἐξῆλθεν ἀπ’ αὐτοῦ μηδὲν βλάψαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/035.yaml
  text: And Jesus rebuked it[a], saying, “Be silent and come out of him.” And after throwing him into the midst[b], the demon came out of him without harming him at all.
translation:
  language: tl
  text: At sinaway ito ni Jesus at sinabi, “Tumahimik ka[a] at lumabas ka sa kaniya!” Matapos siyang ihagis ng demonyo sa gitna, lumabas ito sa kaniya nang hindi siya nito sinaktan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Mabusalan ka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν αὐτῷ
  choice: sinaway ito
  rationale: Ipinapanatili ng “sinaway” ang mariin at makapangyarihang pagsasalita ni Jesus; ang “ito” ay tumutukoy sa demonyo at likas sa modernong Tagalog para sa di-taong nilalang.
- source_word: Φιμώθητι
  choice: Tumahimik ka
  rationale: Ang pandiwa ay literal na may larawan ng paglalagay ng busal, ngunit sa utos tungkol sa pagsasalita ay natural na nangangahulugang tumahimik.
- source_word: ἔξελθε ἀπ’ αὐτοῦ
  choice: lumabas ka sa kaniya
  rationale: Direkta at malinaw na isinasalin ang utos na umalis ang demonyo mula sa lalaki.
- source_word: ῥίψαν αὐτὸν
  choice: Matapos siyang ihagis
  rationale: Ipinahihiwatig ng aorist participle na ang paghagis ay nangyari bago ang paglabas; hindi idinagdag ang “pabagsak” dahil wala itong tuwirang katumbas sa talata.
- source_word: εἰς τὸ μέσον
  choice: sa gitna
  rationale: Likas na salin ng parirala nang hindi idinaragdag kung kanino o saan eksaktong gitna, na iniiwan ng Griyego na pahiwatig lamang sa konteksto.
- source_word: τὸ δαιμόνιον
  choice: ang demonyo
  rationale: Tuwirang katumbas ng δαιμόνιον at pinananatili ang salaysay ng isang personal na masamang espiritung kinakausap at pinalalabas ni Jesus.
- source_word: μηδὲν βλάψαν αὐτόν
  choice: nang hindi man lang siya sinaktan
  rationale: Natural na Tagalog na malinaw na nagsasaad na walang anumang pinsalang nagawa sa lalaki sa kabila ng marahas na paghagis.
theological_decisions:
- issue: Paglalarawan sa δαιμόνιον sa konteksto ng pagpapalayas
  choice: Isinalin bilang “demonyo” at pinanatiling isang personal na masamang espiritung tuwirang inuutusan ni Jesus.
  alternative: Isalin nang abstrakto bilang “masamang puwersa” o bilang karamdaman lamang.
  rationale: Inilalarawan ng Griyegong teksto ang tuwirang pakikipag-usap, utos, at paglabas; hindi dapat alisin ng salin ang personal na paglalarawang ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “kaniya” para sa lalaki at “ito” para sa demonyo upang makatulong sa pagkilala sa mga tinutukoy, habang pinananatili ang matalim na anyo ng mga utos ni Jesus.
