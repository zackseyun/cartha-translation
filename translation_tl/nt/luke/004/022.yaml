  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πάντες ἐμαρτύρουν αὐτῷ καὶ ἐθαύμαζον ἐπὶ τοῖς λόγοις τῆς χάριτος τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ, καὶ ἔλεγον· ⸂Οὐχὶ υἱός ἐστιν Ἰωσὴφ οὗτος⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/022.yaml
  text: And all were speaking well of him and were marveling at the gracious words coming from his mouth[a], and they were saying[b], “Is this not Joseph’s son?”
translation:
  language: tl
  text: Lahat ay nagsalita nang mabuti tungkol sa kanya[a], at namangha sila sa mga salitang may kagandahang-loob[b] na lumalabas sa kanyang bibig. Sinabi nila, “Hindi ba ito ang anak ni Jose?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nagpapatotoo ang lahat tungkol sa kanya.” Maaaring tumukoy ang Griyegong pananalita sa positibong pagsasalita tungkol sa kanya o sa pagpapatotoo tungkol sa kanya; sa kontekstong ito, mas angkop ang positibong diwa dahil kasunod nito ang kanilang pagkamangha.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga salita ng biyaya”—mga salitang may katangian ng biyaya, kagandahang-loob, o pagiging kaaya-aya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρουν αὐτῷ
  choice: Maganda ang sinasabi ng lahat tungkol sa kanya
  rationale: Sa kontekstong ito, malamang na positibong pagpapatotoo o pagsasalita tungkol kay Jesus ang diwa, lalo na dahil kaagapay nito ang kanilang pagkamangha. Pinananatili sa talababa ang mas literal na posibilidad na ‘nagpapatotoo sila tungkol sa kanya.’
- source_word: ἐθαύμαζον
  choice: namangha sila
  rationale: Natural at malinaw sa makabagong Tagalog, at ipinahahayag ang matinding paghanga o pagtataka ng mga nakikinig.
- source_word: ἐπὶ τοῖς λόγοις τῆς χάριτος
  choice: sa mga salitang punô ng biyaya
  rationale: Ipinahahayag nito na ang mga salita ang dahilan ng kanilang pagkamangha at pinananatili ang saklaw ng χάρις bilang biyaya, kagandahang-loob, o kaaya-ayang katangian.
- source_word: τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ
  choice: na lumalabas sa kanyang bibig
  rationale: Pinananatili ang kongkretong larawan at ang pinagmumulan ng mga salita sa natural na Tagalog.
- source_word: Οὐχὶ
  choice: Hindi ba
  rationale: Karaniwang anyo sa Tagalog ng tanong na umaasang sang-ayon ang isasagot.
- source_word: υἱός ἐστιν Ἰωσὴφ οὗτος
  choice: anak ni Jose ang taong ito
  rationale: Direkta at natural na inilalahad ang pagkakakilala ng mga tao kay Jesus bilang anak ni Jose.
theological_decisions:
- issue: Ang pagtukoy ng mga tao kay Jesus bilang anak ni Jose kaugnay ng paglilihi sa kanya ng isang birhen
  choice: 'Isinalin nang tuwiran ang sinabi ng mga tao: ‘anak ni Jose.’'
  alternative: Magdagdag ng paliwanag o pananalitang lumalayo sa pahayag upang maiwasan ang maling pagkaunawa.
  rationale: Iniuulat ng talata ang pananaw ng mga tao at hindi nagbibigay rito ng paglilinaw ng tagapagsalaysay. Ang pagdaragdag ng paliwanag ay mag-aalis sa sadyang tensiyong nasa salaysay.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang ‘punô ng biyaya’ upang mapanatili ang teolohikal at leksikal na lawak ng χάρις nang hindi nagiging teknikal o di-likas ang pangungusap. Inilagay ang bawat talababa sa mismong pariralang tinutukoy nito.
