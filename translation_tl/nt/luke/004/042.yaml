reference: Luke 4:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ἐξελθὼν ἐπορεύθη εἰς ἔρημον τόπον· καὶ οἱ ὄχλοι ἐπεζήτουν αὐτόν, καὶ ἦλθον ἕως αὐτοῦ, καὶ κατεῖχον αὐτὸν τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/042.yaml
  text: And when day came[a], he went out and went to a deserted place. And the crowds were seeking him[b], and they came to him and were trying to keep him from going away from them.
translation:
  language: tl
  text: Nang mag-umaga na, lumabas siya at nagpunta sa isang liblib na lugar.[a] Patuloy siyang hinanap ng mga tao, at pumunta sila sa kanya at sinikap nilang pigilan siyang umalis sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa isang lugar na walang tao” o “sa isang ilang na lugar.” Ang salitang Griego ay tumutukoy sa isang hiwalay, liblib, o di-tinitirhang lugar.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pilit nilang pinananatili siya” o “sinisikap nilang hadlangan ang pag-alis niya.” Ang diwa ay nais ng mga tao na huwag siyang umalis sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Pagsikat ng araw
  rationale: Likas na modernong Tagalog para sa temporal na genitive absolute; malinaw nitong ipinapahiwatig ang pagsisimula ng araw nang hindi labis na literal.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: lumabas siya at pumunta
  rationale: Pinananatiling hayag ang dalawang magkasunod na kilos habang umiiwas sa di-likas na anyong participial sa Tagalog.
- source_word: εἰς ἔρημον τόπον
  choice: sa isang ilang na lugar
  rationale: Ang ἔρημος ay tumutukoy sa isang liblib o walang-taong lugar, hindi kinakailangang isang disyerto; ang 'ilang na lugar' ay maikli, marangal, at pamilyar sa wikang biblikal.
- source_word: οἱ ὄχλοι
  choice: mga tao
  rationale: Sa kontekstong ito, natural na tumutukoy sa maraming taong sama-samang naghahanap kay Jesus; mas karaniwan sa modernong Tagalog kaysa 'mga pulutong'.
- source_word: ἐπεζήτουν αὐτόν
  choice: Hinahanap siya
  rationale: Ipinahihiwatig ng aspektong imperpektibo ng 'hinahanap' ang nagpapatuloy na paghahanap na nasa Greek imperfect.
- source_word: ἦλθον ἕως αὐτοῦ
  choice: nang makarating sila sa kinaroroonan niya
  rationale: Natural na ipinapahayag sa Tagalog ang pagdating nila hanggang sa lugar na kinaroroonan niya.
- source_word: κατεῖχον αὐτὸν
  choice: pinipigilan nila siya
  rationale: Sinasaklaw ang diwa ng pagpigil o pagpapanatili nang hindi ipinapalagay na pisikal nila siyang hinawakan.
- source_word: τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν
  choice: umalis sa kanila
  rationale: Malinaw at natural na Tagalog para sa infinitive construction na nagsasaad kung ano ang nais nilang hadlangan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'ilang na lugar' bilang maikli at pamilyar na ekspresyong biblikal, na nilinaw sa talababa upang maiwasang unawain lamang bilang disyerto. Ang ugnayan ng mga sugnay ay ipinahayag nang natural, nang hindi binibigyan ng di-kinakailangang adversatibong diin ang mga pang-ugnay na Griego.
