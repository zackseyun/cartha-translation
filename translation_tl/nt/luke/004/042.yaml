  verdict: revise
  source_fidelity: Tumpak ang pangunahing diwa ng draft, ngunit ang “ilang na lugar” ay maaaring mabasa bilang “some/few place” sa modernong Filipino at hindi sapat na malinaw para sa ἔρημον τόπον. Ang “liblib na lugar” ay mas malinaw na tumutukoy sa isang hiwalay o walang-taong pook. Ang “Pagsikat ng araw” ay mas tiyak na ‘sunrise,’ samantalang ang Γενομένης δὲ ἡμέρας ay mas malawak na ‘nang mag-umaga na.’
  naturalness: Likas at marangal ang binagong daloy. Ang “Patuloy siyang hinanap” ay nagbibigay ng nakaraang nagpapatuloy na diwa ng imperfect ἐπεζήτουν. Ang “sinikap nilang pigilan” ay natural na Tagalog para sa pagtatangkang hadlangan ang kanyang pag-alis nang hindi ipinapalagay na pisikal siyang ikinulong o hinawakan.
  terminology: Pinalitan ang “ilang na lugar” ng “liblib na lugar” upang maiwasan ang modernong kalabuan ng “ilang.” Nananatiling pangkalahatan ang “mga tao” para sa οἱ ὄχλοι; katanggap-tanggap ito sa konteksto, bagaman hindi nito binibigyang-diin ang pagiging pulutong.
