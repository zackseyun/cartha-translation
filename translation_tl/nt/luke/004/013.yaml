  text: And after finishing every temptation[a], the devil departed from him until an opportune time.
translation:
  language: tl
  text: At nang matapos ng diyablo ang lahat ng tukso[a], lumayo ito kay Jesus hanggang sa tamang panahon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lahat ng pagsubok.” Ang salitang Griyego ay maaaring mangahulugang “tukso” o “pagsubok,” ngunit mas natural dito ang “tukso” dahil ang diyablo ang nanunukso.
    reason: lexical_alternative
lexical_decisions:
- source_word: συντελέσας
  choice: nang matapos
  rationale: Ipinahihiwatig ng aorist participle na natapos muna ang pagtukso bago lumayo ang diyablo. Likas sa Tagalog ang sugnay na “nang matapos” at malinaw nitong pinananatili ang temporal na ugnayan.
- source_word: πάντα πειρασμόν
  choice: ang bawat tukso
  rationale: Ang πᾶς kasama ng isahang πειρασμόν ay maaaring unawain nang distributibo bilang “bawat tukso.” Ang “tukso” ang higit na natural sa konteksto ng mga pang-uudyok ng diyablo, habang inilalagay sa talababa ang posibleng kahulugang “pagsubok.”
- source_word: ὁ διάβολος
  choice: ang diyablo
  rationale: Tumutukoy ito sa personal na espirituwal na kalaban sa salaysay. Ang “diyablo” ang karaniwan at tiyak na katawagan sa modernong Filipino.
- source_word: ἀπέστη ἀπ’ αὐτοῦ
  choice: lumayo siya sa kanya
  rationale: Ang ἀφίστημι rito ay nangangahulugang umalis o lumayo mula sa isang tao. Ang “lumayo siya sa kanya” ay natural at pinananatili ang ideya ng paglayo nang hindi nagpapahiwatig na tuluyan na itong natapos.
- source_word: ἄχρι καιροῦ
  choice: hanggang sa dumating ang isang angkop na pagkakataon
  rationale: Ang καιρός ay maaaring tumukoy sa angkop o takdang pagkakataon, hindi lamang sa kronolohikal na panahon. Nililinaw ng “hanggang sa dumating” ang pansamantalang paglayo na ipinahihiwatig ng ἄχρι.
theological_decisions:
- issue: Kahulugan ng πειρασμός sa karanasan ni Jesus
  choice: tukso
  alternative: pagsubok
  rationale: Maaaring mangahulugan ang πειρασμός ng “tukso” o “pagsubok.” Dahil ang diyablo ang kumikilos at hinihikayat niya si Jesus na lumihis sa tapat na pagsunod, “tukso” ang pinakaangkop sa pangunahing teksto. Gayunman, pinananatili sa talababa ang “pagsubok” sapagkat tunay na saklaw iyon ng salitang Griyego at nagsisilbi ring pagsubok sa katapatan ni Jesus ang pangyayari.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “diyablo,” “tukso,” at “angkop na pagkakataon” bilang mga salitang madaling maunawaan ng karaniwang mambabasa habang nananatiling malapit sa diwa at estruktura ng Griyego.
