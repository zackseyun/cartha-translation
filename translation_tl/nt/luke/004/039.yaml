  text: καὶ ἐπιστὰς ἐπάνω αὐτῆς ἐπετίμησεν τῷ πυρετῷ, καὶ ἀφῆκεν αὐτήν· παραχρῆμα δὲ ἀναστᾶσα διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/039.yaml
  text: And standing over her[a], he rebuked the fever, and it left her. Immediately she got up and began serving them.
translation:
  language: tl
  text: Tumayo si Jesus sa tabi niya at sinaway ang lagnat; iniwan siya ng lagnat. Agad bumangon ang babae at nagsimulang maglingkod sa kanila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστὰς ἐπάνω αὐτῆς
  choice: Tumayo si Jesus sa tabi ng babae
  rationale: Ipinapakita ng parirala ang pisikal na posisyon ni Jesus kaugnay ng babae. Ang “sa tabi ng babae” ay natural sa makabagong Tagalog at angkop sa tagpo ng pagpapagaling, habang iniiwasan ang di-natural na impresyon ng literal na “sa ibabaw niya.” Tahasang binanggit si Jesus para luminaw ang paksa sa malayang talata.
- source_word: ἐπετίμησεν τῷ πυρετῷ
  choice: sinaway ang lagnat
  rationale: Pinananatili ng “sinaway” ang tuwirang pagkakapahayag sa Griyego at ang may-awtoridad na kilos ni Jesus, nang hindi ipinapaliwanag kung ang lagnat ay isinatao lamang o may kaugnayan sa demonyo.
- source_word: ἀφῆκεν αὐτήν
  choice: iniwan siya nito
  rationale: Ang ipinahihiwatig na paksa ay ang lagnat. Pinananatili ng pagkakasaling ito ang larawan ng Griyego na ang lagnat ang umalis sa babae.
- source_word: παραχρῆμα
  choice: Agad
  rationale: Malinaw at natural na ipinahahayag nito ang biglaan at ganap na epekto ng pagpapagaling.
- source_word: ἀναστᾶσα
  choice: bumangon ang babae
  rationale: Ang “bumangon” ang natural na salita para sa pagbangon mula sa pagkakahiga. Inulit ang “ang babae” upang maiwasan ang kalituhan sa panghalip pagkatapos ng “iniwan siya nito.”
- source_word: διηκόνει αὐτοῖς
  choice: nagsimulang maglingkod sa kanila
  rationale: Ipinahihiwatig ng imperfect na pandiwa ang pagsisimula at pagpapatuloy ng paglilingkod. Ang “maglingkod” ay malawak at natural, at hindi nagdaragdag ng tiyak na gawaing hindi binanggit sa teksto.
theological_decisions:
- issue: Kung ang pagsaway ni Jesus sa lagnat ay dapat ipakahulugang personipikasyon o pahiwatig ng sanhi nitong demonyo
  choice: Panatilihin ang literal na “sinaway ang lagnat”
  alternative: “inutusan niyang mawala ang lagnat” o “sinaway ang karamdaman”
  rationale: Tuwirang sinasabi ng Griyego na sinaway ni Jesus ang lagnat. Pinananatili nito ang paglalarawan ni Lucas sa awtoridad ni Jesus nang hindi nagdaragdag ng paliwanag tungkol sa sanhi ng karamdaman.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Iniiwasan ang sobrang literal na “tumayo sa ibabaw niya,” na maaaring magpahiwatig na nakatapak si Jesus sa babae, ngunit pinananatili ang pisikal na paglapit at pagtayo sa tabi niya. Ang pangungusap ay gumagamit ng karaniwang bokabularyo at hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
