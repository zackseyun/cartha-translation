  text: Δύνοντος δὲ τοῦ ἡλίου ⸀ἅπαντες ὅσοι εἶχον ἀσθενοῦντας νόσοις ποικίλαις ἤγαγον αὐτοὺς πρὸς αὐτόν· ὁ δὲ ἑνὶ ἑκάστῳ αὐτῶν τὰς χεῖρας ⸂ἐπιτιθεὶς ἐθεράπευεν⸃ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/040.yaml
  text: When the sun was setting[a], all who had people sick with various diseases brought them to him; and he laid his hands on each one of them and healed them.
translation:
  language: tl
  text: Nang lumulubog ang araw[a], dinala sa kanya ng lahat ng may mga maysakit na dumaranas ng sari-saring karamdaman ang mga ito. Ipinatong niya ang mga kamay niya sa bawat isa sa kanila at pinagaling niya sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Habang lumulubog ang araw.” Ang Griyego ay gumagamit ng isang estrukturang nagsasaad ng panahong kasabay ng mga pangyayaring ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δύνοντος δὲ τοῦ ἡλίου
  choice: Nang lumulubog na ang araw
  rationale: Isinasalin ang genitive absolute at present participle bilang sugnay na panahunan at kasabay na kilos. Pinananatili ng “lumulubog na” ang nagaganap na paglubog ng araw nang mangyari ang sumunod na mga kilos.
- source_word: ἅπαντες ὅσοι
  choice: lahat ng
  rationale: 'Pinananatili ang malawak at mariing saklaw ng parirala: walang ibinubukod sa mga may maysakit na nagdala sa kanila.'
- source_word: εἶχον ἀσθενοῦντας
  choice: may maysakit
  rationale: Ang likas na pariralang Filipino na “may maysakit” ay tumutukoy sa mga taong may isang taong may sakit sa kanilang pangangalaga o sambahayan, nang hindi ipinapalagay ang tiyak na ugnayan nila.
- source_word: νόσοις ποικίλαις
  choice: dahil sa sari-saring karamdaman
  rationale: Malinaw na ipinahahayag ang iba't ibang uri ng sakit na dinaranas ng mga maysakit.
- source_word: ἤγαγον αὐτοὺς πρὸς αὐτόν
  choice: dinala sa kanya ... ang mga ito
  rationale: Ang “dinala” ang likas na katumbas ng ἤγαγον sa konteksto ng pagdadala sa mga maysakit kay Jesus. Ang “mga ito” ay bumabalik sa mga maysakit.
- source_word: ἑνὶ ἑκάστῳ αὐτῶν
  choice: sa bawat isa sa kanila
  rationale: Pinananatili ang dobleng distributibong diin ng Griyego sa personal na pagharap sa bawat indibidwal.
- source_word: τὰς χεῖρας ἐπιτιθεὶς
  choice: Ipinatong niya ang kanyang mga kamay
  rationale: Tuwirang inilalarawan ang konkretong kilos ng pagpapatong ng mga kamay nang hindi dinaragdagan ng sakramental o eklesyal na kahulugan.
- source_word: ἐθεράπευεν
  choice: pinagaling sila
  rationale: Likas sa Filipino ang simpleng aspektong naganap sa salaysay. Ang paulit-ulit o distributibong katangian ng imperfect ay naipahihiwatig na ng “bawat isa sa kanila.”
theological_decisions:
- issue: Paglalarawan sa pagpapatong ng mga kamay
  choice: Ipinatong niya ang kanyang mga kamay sa bawat isa sa kanila
  alternative: Habang ipinapatong niya ang kanyang mga kamay sa bawat isa sa kanila, pinagagaling niya sila
  rationale: Pinananatili ang personal at pisikal na kilos ni Jesus at ang pagtuon sa bawat maysakit, ngunit hindi iniuugnay rito ang anumang doktrinang hindi tahasang sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “may maysakit” upang maiwasang magdagdag ng ugnayang gaya ng kapamilya o alaga na hindi tahasang tinutukoy ng Griyego.
