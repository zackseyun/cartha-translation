  text: αὐτὸς δὲ διελθὼν διὰ μέσου αὐτῶν ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/030.yaml
  text: But he[a], passing through their midst, went on his way.
translation:
  language: tl
  text: Ngunit dumaan siya sa gitna nila at nagpatuloy sa kanyang lakad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς
  choice: siya
  rationale: Hayagang nasa Griyego ang panghalip at may bahagyang diin. Likas sa Tagalog ang “siya”; hindi na kailangan ang mas mabigat na “siya mismo” sa kontekstong ito.
- source_word: δὲ
  choice: Ngunit
  rationale: 'Ipinahihiwatig ng δέ ang banayad na pagsalungat sa balak ng mga tao sa naunang talata: sa kabila ng kanilang balak, nakaalis si Jesus.'
- source_word: διελθὼν
  choice: dumaan
  rationale: Ang aorist participle ng διέρχομαι ay nagsasaad ng paggalaw sa loob at palabas ng isang lugar o pangkat. Sa natural na Tagalog, ang magkakasunod na pandiwang “dumaan ... at nagpatuloy” ay malinaw na naghahatid ng ugnayan nito sa pangunahing pandiwa.
- source_word: διὰ μέσου αὐτῶν
  choice: sa gitna nila
  rationale: Pinananatili nito ang kongkretong larawang dumaan siya sa kalagitnaan ng pangkat, nang hindi ipinapaliwanag kung paano iyon nangyari.
- source_word: ἐπορεύετο
  choice: nagpatuloy sa kanyang lakad
  rationale: Ang imperfect na anyo ay naglalarawan ng nagpapatuloy na pagkilos. Ang pariralang ito ay natural sa Tagalog at mas mahusay na naghahatid ng patuloy na pag-alis kaysa sa payak na “umalis.”
theological_decisions:
- issue: Kung dapat bang tahasang ipahiwatig na mahimala ang pagtakas ni Jesus
  choice: 'Panatilihing neutral ang paglalarawan: “dumaan siya sa gitna nila at nagpatuloy sa kanyang lakad.”'
  alternative: Gumamit ng pananalitang tahasang nagsasabing mahimala o sobrenatural siyang nakadaan.
  rationale: Inilalarawan ng Griyego ang pagdaan ni Jesus sa gitna ng mga tao ngunit hindi sinasabi kung paano ito nangyari. Pinananatili ng salin ang puwang na ito at hindi nagdaragdag ng paliwanag na wala sa teksto.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Iniwasan ang masyadong mataas na “sa kanilang kalagitnaan” at ang di-kailangang paliwanag tungkol sa paraan ng kanyang pagdaan.
