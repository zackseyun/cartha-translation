translation:
  language: tl
  text: At nagtuturo siya sa kanilang mga sinagoga, at pinupuri siya ng lahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinararangalan” o, mas literal, “niluluwalhati.” Ang pandiwang Griyego na δοξαζόμενος ay maaaring tumukoy sa pampublikong papuri o pagpaparangal. Sa kontekstong ito, ang “pinupuri” ay nagpapahayag ng malawak na paborableng pagtanggap.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay sa naunang salaysay nang hindi nagdaragdag ng tiyak na panahong diwa.
- source_word: αὐτὸς
  choice: siya
  rationale: Likas na tumutukoy kay Jesus sa Filipino; hindi pinalalabis ang bahagyang diin ng tahasang panghalip sa Griyego.
- source_word: ἐδίδασκεν
  choice: nagtuturo siya
  rationale: Ipinahihiwatig ng anyong imperpekto ang nagpapatuloy o nakaugaliang pagtuturo. Sa konteksto ng salaysay, likas na naipapahayag ito ng “nagtuturo siya.”
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: sa kanilang mga sinagoga
  rationale: Tuwirang lokatibong salin na pinananatili ang maramihan at ang panghalip na tumutukoy sa mga pamayanan sa Galilea.
- source_word: δοξαζόμενος
  choice: niluluwalhati
  rationale: Pinananatili ang ugnayang leksikal sa “luwalhati,” habang kinikilala sa talababa na sa kontekstong ito maaari rin itong mangahulugang pinupuri o pinararangalan sa publiko.
- source_word: ὑπὸ πάντων
  choice: ng lahat
  rationale: Likas at maikli itong pagpapahayag ng tagaganap sa balintiyak na konstruksyon at ng malawak na pagsang-ayon ng mga tao.
theological_decisions:
- issue: Kahulugan ng δοξαζόμενος bilang tugon ng mga tao kay Jesus
  choice: niluluwalhati siya ng lahat
  alternative: pinupuri siya ng lahat; pinararangalan siya ng lahat
  rationale: Pinananatili ng “niluluwalhati” ang mas malakas na diwa at ang kaugnayan sa bokabularyo ng luwalhati, ngunit hindi itinatago ng talababa na maaari rito ang karaniwang diwa ng pampublikong papuri o pagpaparangal. Hindi nito ipinapalagay ang isang mas malawak na teolohikong pahayag kaysa sa sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “habang” upang natural na ipakita na kasabay ng patuloy na pagtuturo ni Jesus ang pagtanggap ng papuri o karangalan, nang hindi ginagawang hiwalay na pangunahing kilos ang participle.
