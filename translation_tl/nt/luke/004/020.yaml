id: LUK.4.20
reference: Luke 4:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πτύξας τὸ βιβλίον ἀποδοὺς τῷ ὑπηρέτῃ ἐκάθισεν· καὶ πάντων ⸂οἱ ὀφθαλμοὶ ἐν τῇ συναγωγῇ⸃ ἦσαν ἀτενίζοντες αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/020.yaml
  text: And after rolling up the scroll and giving it back to the attendant[a], he sat down[b]. And the eyes of everyone in the synagogue were fixed on him.
translation:
  language: tl
  text: Pagkatapos niyang irolyo ang balumbon at ibalik ito sa tagapaglingkod[a], umupo siya. Nakapako sa kanya ang mga mata ng lahat ng nasa sinagoga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tagapaglingkod na ito ang tumutulong sa pagsamba at nangangasiwa sa mga balumbon sa sinagoga.
    reason: cultural_note
  - marker: b
    text: 'Maaaring isalin: “Masusing nakatingin sa kanya ang lahat ng nasa sinagoga.”'
    reason: idiomatic_alternative
lexical_decisions:
- source_word: πτύξας
  choice: irolyo
  rationale: Tumutukoy sa muling pagrolyo ng balumbon, hindi sa pagsasara ng aklat na may mga pahina.
- source_word: βιβλίον
  choice: balumbon
  rationale: Bagaman maaari itong mangahulugang aklat o nakasulat na dokumento sa pangkalahatan, balumbon ang makasaysayang anyo ng kasulatang binabasa sa sinagoga.
- source_word: ἀποδοὺς
  choice: ibalik
  rationale: Malinaw at likas na ipinahihiwatig na isinauli niya ang balumbon sa tagapangasiwa nito.
- source_word: ὑπηρέτῃ
  choice: tagapaglingkod
  rationale: Sa konteksto, ito ang taong tumutulong sa pagsamba at nangangasiwa sa mga balumbon; pinananatili ng salita ang tungkuling paglilingkod nang hindi labis na tinutukoy ang isang teknikal na titulo.
- source_word: ἐκάθισεν
  choice: umupo siya
  rationale: Tuwirang salaysay ng kilos; hindi idinaragdag sa pangunahing teksto ang ipinahihiwatig na kaugaliang nakaupo ang guro.
- source_word: πάντων οἱ ὀφθαλμοὶ
  choice: ang mga mata ng lahat
  rationale: Pinananatili ang matingkad na metonimikong larawan ng Griyego at ang saklaw na lahat ng nasa sinagoga.
- source_word: ἀτενίζοντες αὐτῷ
  choice: nakapako sa kanya
  rationale: Likas na idyomang Filipino para sa tuloy-tuloy at masusing pagtitig, nang hindi nagpapahiwatig ng pagkapoot.
- source_word: συναγωγῇ
  choice: sinagoga
  rationale: Malinaw sa tagpo na tumutukoy ito sa sinagoga bilang lugar at kapulungan ng pagsamba.
theological_decisions:
- issue: Makasaysayang anyo ng βιβλίον sa pagsamba sa sinagoga
  choice: Isinaling “balumbon.”
  alternative: aklat
  rationale: Mas tiyak ito sa makasaysayang bagay na ginamit sa pagbasa ng Isaias, ngunit hindi binabago ang diwa ng teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “balumbon” para sa katumpakang pangkasaysayan at “nakapako sa kanya ang mga mata” upang mapanatili ang matingkad at masusing titig sa Griyego. Inayos ang mga talababa upang tumugma ang marker sa paliwanag; sa ibinigay na English consultation layer, tila napagpalit ang ugnayan ng mga marker at footnote.
