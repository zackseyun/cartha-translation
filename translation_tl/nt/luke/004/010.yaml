  text: 'Sapagkat nasusulat: “Uutusan niya ang kanyang mga anghel tungkol sa iyo, upang ingatan ka,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: nasusulat
  rationale: Karaniwang marangal at natural na pormula sa Filipino para sa pagsipi sa Kasulatan; ipinahihiwatig din nito ang nananatiling bisa ng nakasulat.
- source_word: γὰρ
  choice: sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan nito sa sinabi sa naunang talata.
- source_word: ὅτι
  choice: ':'
  rationale: Pagkatapos ng “nasusulat,” likas na ipinakikilala sa Filipino ang tuwirang sipi sa pamamagitan ng tutuldok sa halip na isalin ang pang-ugnay.
- source_word: Τοῖς ἀγγέλοις αὐτοῦ
  choice: ang kanyang mga anghel
  rationale: Natural na Filipino para sa pariralang may pag-aari; ang dative ay kaugnay ng pandiwang “uutusan.”
- source_word: ἐντελεῖται
  choice: uutusan niya
  rationale: Tumpak at karaniwang pagpapahayag ng future middle na nangangahulugang magbibigay siya ng utos o tagubilin.
- source_word: περὶ σοῦ
  choice: tungkol sa iyo
  rationale: Malapit na katumbas ng περί na may genitive at hindi pinapalitan ng mas interpretatibong “para sa iyo.”
- source_word: τοῦ διαφυλάξαι σε
  choice: upang ingatan ka
  rationale: Ipinapakita ng “upang” ang layunin ng articular infinitive; ang “ingatan” ay natural at saklaw kapwa ang pagbabantay at pagprotekta.
theological_decisions:
- issue: Paglalahad sa sipi mula sa Awit sa loob ng pananalita ng manunukso
  choice: Isinalin lamang ang mga salitang iniulat ni Lucas, nang malapit sa anyo ng sipi.
  alternative: Dagdagan ng nawawalang karugtong mula sa Awit 91:11 o gumamit ng tradisyonal ngunit mas lumang pananalita.
  rationale: Hindi dapat buuin nang palihim ang mas mahabang teksto ng Awit sapagkat ang salin ay kailangang kumatawan sa mismong anyong iniulat ni Lucas.
- issue: Ugnayan ng περὶ σοῦ at τοῦ διαφυλάξαι σε
  choice: “tungkol sa iyo, upang ingatan ka”
  alternative: “para sa iyo upang protektahan ka”
  rationale: Pinananatili ang leksikal na diwa ng “tungkol sa iyo” habang malinaw na inilalahad ang layunin ng utos, nang hindi ginagawang tagatanggap ng utos si Jesus.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinili ang “nasusulat” bilang pamilyar na pormula sa Kasulatan at “ingatan” bilang payak ngunit sapat na malawak na katumbas ng διαφυλάσσω.
