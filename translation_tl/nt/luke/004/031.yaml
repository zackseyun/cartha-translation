id: LUK.4.31
reference: Luke 4:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ κατῆλθεν εἰς Καφαρναοὺμ πόλιν τῆς Γαλιλαίας. καὶ ἦν διδάσκων αὐτοὺς ἐν τοῖς σάββασιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/031.yaml
  text: And he went down to Capernaum[a], a city of Galilee. And he was teaching them on the Sabbaths.
translation:
  language: tl
  text: Bumaba siya sa Capernaum, isang lungsod sa Galilea. At nagtuturo siya sa kanila tuwing Sabat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “sa mga Sabat”; malamang na tumutukoy ito sa paulit-ulit na pagtuturo sa mga araw ng Sabat.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατῆλθεν
  choice: Bumaba
  rationale: Pinananatili nito ang direksiyong nasa pandiwang Griyego; ang Capernaum ay nasa mas mababang lugar kaysa sa pinanggalingang rehiyon sa naunang salaysay.
- source_word: Καφαρναοὺμ
  choice: Capernaum
  rationale: Ginamit ang karaniwang anyo ng pangalan ng lugar sa makabagong saling Filipino.
- source_word: πόλιν τῆς Γαλιλαίας
  choice: isang lungsod sa Galilea
  rationale: Ipinahahayag ng “isang” ang di-tiyak na πόλιν, at likas sa Filipino ang “sa Galilea” para sa lokatibong diwa ng genitive.
- source_word: ἦν διδάσκων
  choice: nagtuturo siya
  rationale: Sa konteksto ng “tuwing Sabbath,” likas na naipahahayag ng aspektong imperpektibo ng Filipino ang nagpapatuloy o nauulit na pagtuturo.
- source_word: αὐτοὺς
  choice: sa kanila
  rationale: Pinananatili ang panghalip nang hindi dinaragdagan ng tahasang tinutukoy na wala sa mismong talata.
- source_word: ἐν τοῖς σάββασιν
  choice: tuwing Sabbath
  rationale: Likas itong Filipino at malinaw na ipinahahayag ang malamang na paulit-ulit na diwa ng pangmaramihang σάββασιν.
theological_decisions:
- issue: Kung pananatilihin sa anyong pangmaramihan ang σάββασιν o isasalin ayon sa likas na idyomang Filipino
  choice: tuwing Sabbath
  alternative: sa mga Sabbath
  rationale: Ang “tuwing Sabbath” ay likas sa Filipino at pinananatili ang mahalagang diwa ng paulit-ulit na pagtuturo, samantalang ang literal na “sa mga Sabbath” ay mas mabigat at hindi gaanong natural. Itinala sa talababa ang anyong pangmaramihan ng Griyego upang hindi mawala ang pormal na detalye.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang direksiyong “bumaba,” ngunit ginawang likas ang pangmaramihang pariralang tungkol sa Sabbath sa pamamagitan ng “tuwing Sabbath.”
