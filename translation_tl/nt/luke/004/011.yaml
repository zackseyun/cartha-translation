  text: and[a], ‘On their hands they will carry you[b], lest you strike your foot against a stone.’
translation:
  language: tl
  text: at, “Sa kanilang mga kamay ay bubuhatin ka nila, upang hindi tumama ang paa mo sa bato.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: at
  rationale: Karaniwang pangatnig na nagpapatuloy sa sipi mula sa naunang talata.
- source_word: ὅτι
  choice: ‘
  rationale: Ipinakikilala nito ang nilalaman ng sipi; sa natural na Tagalog, sapat nang katawanin ito ng pagpapatuloy ng panipi.
- source_word: Ἐπὶ χειρῶν
  choice: sa kanilang mga kamay
  rationale: Pinananatili ang larawan ng pagkarga o pagsalo sa pamamagitan ng mga kamay, sa likas na ayos ng Tagalog.
- source_word: ἀροῦσίν σε
  choice: Bubuhatin ka nila
  rationale: Ang αἴρω rito ay nangangahulugang bubuhatin o dadalhin. Malinaw at natural ang “bubuhatin” at angkop sa larawan ng mga kamay.
- source_word: μήποτε
  choice: upang hindi
  rationale: Natural na Tagalog para sa negatibong layunin o pag-iwas na ipinahihiwatig ng μήποτε.
- source_word: προσκόψῃς
  choice: tumama
  rationale: Sa konteksto ng paa at bato, tumutukoy ito sa pagtama o pagkakabunggo; payak at konkreto ang “tumama.”
- source_word: πρὸς λίθον
  choice: sa bato
  rationale: Kasama ng “tumama,” likas sa Tagalog ang “tumama sa bato” para sa pagdikit o pagkakabunggo sa isang bagay.
- source_word: τὸν πόδα σου
  choice: ang paa mo
  rationale: Pinananatili ang isahan ng Griyego at gumagamit ng natural na makabagong Tagalog.
theological_decisions:
- issue: Paglalarawan sa pag-iingat sa sipi mula sa Awit
  choice: “Bubuhatin ka nila”
  alternative: “Dadalhin ka nila” o “aalalayan ka nila”
  rationale: Pinananatili ng “bubuhatin” ang pisikal na larawan ng pag-angat sa mga kamay nang hindi nagdaragdag ng paliwanag o partikular na doktrinal na pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong sipi at ang konkretong larawan ng mga kamay, paa, at bato; iniwasan ang lipas na “baka matisod” kung saan maaaring lumabo ang tuwirang diwa ng pagtama ng paa.
