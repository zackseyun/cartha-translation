id: LUK.4.4
reference: Luke 4:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀπεκρίθη ⸂πρὸς αὐτὸν ὁ Ἰησοῦς⸃· Γέγραπται ὅτι Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/004.yaml
  text: 'And Jesus answered him[b][a], “It is written: ‘Man will not live by bread alone.’”'
translation:
  language: tl
  text: 'Sumagot sa kanya si Jesus, “Nasusulat: ‘Hindi sa tinapay lamang mabubuhay ang tao[a].’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi sa tinapay lamang mabubuhay ang isang tao.” Pangkalahatan ang diwa at tumutukoy sa sangkatauhan.
    reason: lexical_alternative
  - marker: b
    text: Sinisipi ni Jesus ang Deuteronomio 8:3.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη πρὸς αὐτόν
  choice: Sumagot sa kanya
  rationale: Likas na katumbas sa modernong Tagalog ng idyomang ἀποκρίνομαι na may πρός at akusatibo; malinaw nitong ipinahahayag na si Jesus ay tumugon sa diyablo.
- source_word: Γέγραπται
  choice: Nasusulat
  rationale: Karaniwang pormula ito sa pagsipi sa Kasulatan. Pinananatili ng “Nasusulat” ang diwa ng isang nakasulat na pahayag na nananatiling may bisa.
- source_word: ὅτι
  choice: ':'
  rationale: Ipinakikilala rito ng ὅτι ang tuwirang sipi; mas natural sa Tagalog na katawanin ito ng tutuldok kaysa isalin bilang “na.”
- source_word: ἐπ’ ἄρτῳ μόνῳ
  choice: sa tinapay lamang
  rationale: Ipinahahayag ng ἐπί ang saligan o paraang pinagmumulan ng ikabubuhay. Ang ayos na “sa tinapay lamang” ay natural at nananatiling malapit sa diin ng Griyego.
- source_word: ζήσεται
  choice: mabubuhay
  rationale: Ang anyong panghinaharap ay tuwirang naipahahayag ng “mabubuhay,” nang hindi gumagamit ng makaluma o labis na mabigat na pananalita.
- source_word: ὁ ἄνθρωπος
  choice: ang tao
  rationale: Ang “ang tao” ay natural na pangkalahatang singular sa Tagalog at tumutukoy sa sinumang tao o sa sangkatauhan, habang pinananatili ang konkretong singular ng sipi.
theological_decisions:
- issue: Pangkalahatang kahulugan ng singular na ὁ ἄνθρωπος sa sipi mula sa Kasulatan
  choice: ang tao
  alternative: ang isang tao
  rationale: Ang ὁ ἄνθρωπος ay singular ngunit ginagamit sa pangkalahatang diwa. Sa Tagalog, likas na naipahahayag ng “ang tao” ang gayong kahulugan nang hindi ito nililimitahan sa isang lalaki o ginagawang abstraktong kolektibo.
- issue: Lawak ng sipi mula sa Deuteronomio 8:3
  choice: Isalin lamang ang mga salitang nasa tekstong Griyego ng Lucas 4:4
  alternative: Idagdag ang kasunod na parirala ng Deuteronomio 8:3 tungkol sa bawat salitang mula sa bibig ng Diyos
  rationale: Sa ibinigay na SBLGNT, nagtatapos ang sipi sa ὁ ἄνθρωπος. Hindi dapat idagdag sa pangunahing teksto ang mas mahabang anyong matatagpuan sa ibang tradisyon o salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang karaniwang biblikal na pormulang “Nasusulat” at iniwasan ang makaluma o denominasyonal na pananalita.
