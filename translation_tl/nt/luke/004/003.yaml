  terminology: Ang “diyablo,” “Anak ng Diyos,” “bato,” at “tinapay” ay wasto, malinaw, at angkop sa karaniwang rehistrong biblikal. Ang “sabihin mo sa batong ito na maging tinapay” ay katanggap-tanggap at hindi nagpapataw ng mas malakas na “utusan.”
