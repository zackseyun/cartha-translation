base_translation:
  language: en
  yaml_path: translation/nt/luke/004/003.yaml
  text: Then the devil said to him[a], “If you are the Son of God, tell this stone to become bread.”
translation:
  language: tl
  text: Sinabi naman sa kanya ng diyablo, “Kung[a] ikaw ang Anak ng Diyos, sabihin mo sa batong ito na maging tinapay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Yamang ikaw ang Anak ng Diyos.” Maaaring unawain ang kondisyong Griyego bilang pagpapalagay na totoo ang sinabi alang-alang sa hamon, ngunit pinananatili sa pangunahing teksto ang anyong kondisyonal.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Pagkatapos
  rationale: Isang banayad na pang-ugnay ang δέ. Ang “Pagkatapos” ay natural sa makabagong salaysay at malinaw na nag-uugnay sa naunang pangyayari.
- source_word: διάβολος
  choice: ang diyablo
  rationale: Sa kontekstong ito, ang διάβολος ay katawagan sa personal na kalaban; “ang diyablo” ang malinaw at karaniwang salin sa Filipino.
- source_word: Εἰ
  choice: Kung
  rationale: Pinananatili ng “Kung” ang lantad na anyong kondisyonal at ang tensiyon ng hamon, sa halip na ipakahulugang tiyak na “Yamang.”
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: ang Anak ng Diyos
  rationale: Sa kontekstong Kristolohikal, ang parirala ay may tiyak na diwa bilang titulo, hindi “isang anak ng Diyos.”
- source_word: εἰπὲ
  choice: sabihin mo
  rationale: Ang pautos na εἰπέ ay literal na tumutukoy sa pagsasalita. Natural sa Filipino ang “sabihin mo sa batong ito na…” at hindi nito pinalalakas ang pandiwa tungo sa “utusan.”
- source_word: τῷ λίθῳ τούτῳ
  choice: sa batong ito
  rationale: Ang λίθος ay karaniwang “bato,” at pinananatili ang demonstratibong τούτῳ bilang “ito.”
- source_word: ἵνα γένηται
  choice: na maging
  rationale: Pagkatapos ng pandiwa ng pagsasalita, natural na ipinapahayag sa Filipino ang nilalaman ng utos sa pamamagitan ng “na maging,” habang pinananatili ang diwa ng γίνομαι.
- source_word: ἄρτος
  choice: tinapay
  rationale: Tuwirang katumbas ng ἄρτος ang “tinapay”; ang “isang buong tinapay” o “pagkain” ay magiging mas tiyak o mas malawak kaysa sa Griyego.
theological_decisions:
- issue: Lakas ng kondisyong εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Kung ikaw ang Anak ng Diyos
  alternative: Yamang ikaw ang Anak ng Diyos
  rationale: Pinananatili sa pangunahing teksto ang anyong kondisyonal ng Griyego at ang tensiyon ng tukso, nang hindi itinatanggi o ipinagpapalagay sa salin ang pagiging Anak ni Jesus.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “diyablo,” “Anak ng Diyos,” at “tinapay” bilang mga karaniwang terminong biblikal na madaling maunawaan. Inilagay ang talababa sa mismong sugnay ng tagapagsalita upang ipaliwanag ang posibleng puwersa ng “Kung.”
