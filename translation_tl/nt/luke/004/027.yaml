base_translation:
  language: en
  yaml_path: translation/nt/luke/004/027.yaml
  text: And there were many lepers in Israel in the time of Elisha the prophet, and none of them was cleansed except Naaman the Syrian.
translation:
  language: tl
  text: At maraming may ketong sa Israel noong panahon ni Eliseo na propeta, at walang isa man sa kanila ang nalinis, maliban kay Naaman na taga-Siria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λεπροὶ
  choice: mga may ketong
  rationale: Natural at magalang na modernong Filipino para sa mga taong may sakit sa balat na tinutukoy ng biblikal na λεπρός; iniiwasan din nito ang pagturing sa sakit bilang kabuuang pagkakakilanlan ng tao.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: sa Israel
  rationale: Pinananatili ang malawak na diwang lokatibo ng Griyego nang hindi nililimitahan kung lupain o sambayanan ang pangunahing tinutukoy.
- source_word: ἐπὶ Ἐλισαίου τοῦ προφήτου
  choice: noong panahon ni Eliseo na propeta
  rationale: Malinaw at natural na temporal na katumbas ng ἐπί na may genitive, habang pinananatili ang pagkakakilanlan kay Eliseo bilang propeta.
- source_word: ἐκαθαρίσθη
  choice: nilinis
  rationale: Pinananatili ang bokabularyo ng paglilinis na kaugnay kapwa ng pisikal na karamdaman at ng biblikal na karumihang seremonyal; hindi ito pinapantay lamang sa paggaling.
- source_word: εἰ μὴ
  choice: kundi
  rationale: Sa balangkas na may naunang pagtanggi, ang “kundi” ang natural na pananda ng tanging eksepsiyon sa Filipino.
- source_word: Ναιμὰν ὁ Σύρος
  choice: si Naaman na taga-Siria
  rationale: Natural na Filipino para sa pangalang may etnikong katawagan, at malinaw na pinananatili ang mahalagang punto na si Naaman ay isang taga-Siria.
theological_decisions:
- issue: Kahulugan ng paglilinis kaugnay ng ketong
  choice: Isinalin ang ἐκαθαρίσθη bilang “nilinis.”
  alternative: “pinagaling” o “dinalisay”
  rationale: Ang “nilinis” ay nagpapanatili sa biblikal na ugnayan ng pisikal na kalagayan at seremonyal na karumihan nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Bigat ng etnikong katawagan kay Naaman
  choice: Pinanatili sa pangunahing teksto ang “na taga-Siria.”
  alternative: “isang taga-Siria” o alisin ang katawagan
  rationale: Mahalaga sa retorika ng sinabi ni Jesus na ang tanging nilinis ay isang kilalang dayuhan, hindi isa sa maraming nasa Israel.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “mga may ketong” sa halip na “mga ketongin” upang maging natural at hindi mapanlait, habang pinanatili ang maikli at tuwirang anyo ng talata.
