revisions:
- from: Marami ring may ketong sa Israel noong panahon ni Eliseo na propeta, ngunit walang sinuman sa kanila ang nilinis kundi si Naaman na taga-Siria.
  to: At maraming may ketong sa Israel noong panahon ni Eliseo na propeta, at walang isa man sa kanila ang nalinis, maliban kay Naaman na taga-Siria.
  rationale: Pinalitan ang adversative na “ngunit” ng “at” upang sundin ang pagkakaugnay ng mga sugnay sa Griyego. Ginawang “nalinis” ang pandiwa upang maipakita ang passive na ἐκαθαρίσθη at pinahusay ang pagtukoy kay Eliseo sa pamamagitan ng “ni Eliseo na propeta.” Hindi binago ang saklaw ng “Israel,” ang pagbubukod kay Naaman, o ang kaniyang pagkakakilanlang taga-Siria.
