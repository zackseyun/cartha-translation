  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτοὺς ὅτι Καὶ ταῖς ἑτέραις πόλεσιν εὐαγγελίσασθαί με δεῖ τὴν βασιλείαν τοῦ θεοῦ, ὅτι ⸀ἐπὶ τοῦτο ⸀ἀπεστάλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/043.yaml
  text: But he said to them[a], “I must also proclaim the good news of the kingdom of God to the other cities[b], because I was sent for this.”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanila, “Kailangan ko ring ipahayag[a] sa iba pang mga lungsod ang magandang balita tungkol sa kaharian ng Diyos, sapagkat isinugo ako para rito.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipangaral.”
    reason: lexical_alternative
  - marker: b
    text: O “sapagkat para sa layuning ito ako isinugo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτοὺς
  choice: Ngunit sinabi niya sa kanila
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat sa hangarin ng mga tao na manatili siya, habang tuwirang pinananatili ng parirala ang kilos ng pagsasalita at ang mga kausap.
- source_word: Καὶ ταῖς ἑτέραις πόλεσιν
  choice: ring ... sa iba pang mga lungsod
  rationale: Ipinakikita ng καί ang karagdagang saklaw ng misyon, at ang ἑτέραις πόλεσιν ay tumutukoy sa mga lungsod bukod sa kasalukuyang lugar. Ang “iba pang mga lungsod” ay malinaw at likas sa modernong Filipino.
- source_word: εὐαγγελίσασθαί
  choice: ipahayag ... ang magandang balita
  rationale: Ang pandiwa ay nangangahulugang maghatid o magpahayag ng mabuting balita. Ang “ipahayag ang magandang balita” ay natural at pinananatili ang aktibong diwa nang hindi ginagawang labis na teknikal ang pananalita.
- source_word: με δεῖ
  choice: Kailangan ko
  rationale: Nagpapahayag ang δεῖ ng matibay na pangangailangan, na sa Lucas ay madalas may kaugnayan sa banal na layunin o misyon. Ang “Kailangan ko” ay maikli, natural, at hindi nagpapahina sa puwersa nito.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: tungkol sa kaharian ng Diyos
  rationale: Pinananatili ng “kaharian ng Diyos” ang pangunahing pariralang teolohikal sa Lucas at hindi pinipili nang eksklusibo sa pagitan ng paghahari at nasasakupan. Idinagdag ang “tungkol sa” upang maging likas sa Filipino ang ugnayan nito sa “magandang balita.”
- source_word: ἐπὶ τοῦτο
  choice: para rito
  rationale: Ipinahahayag ng parirala ang layunin ng pagkasugo. Ang “para rito” ay maikli at natural, samantalang ang talababa ay nagbibigay ng mas hayag na alternatibong “para sa layuning ito.”
- source_word: ἀπεστάλην
  choice: isinugo ako
  rationale: Pinananatili ng “isinugo” ang balintiyak na anyo at ang diwa ng misyong ipinagkatiwala, nang hindi tahasang tinutukoy ang nagsugo dahil hindi ito pinangalanan sa talata.
theological_decisions:
- issue: Lakas at pinagmulan ng misyon ni Jesus
  choice: 'Inilalarawan ang misyon bilang kinakailangan at ipinagkatiwala: “Kailangan ko” at “isinugo ako,” ngunit hindi tahasang pinangalanan ang nagsugo.'
  alternative: Maaaring ipaliwanag na banal ang pangangailangan at na ang Diyos ang nagsugo.
  rationale: Madalas gamitin ni Lucas ang δεῖ para sa banal na pangangailangan, at malakas na nagpapahiwatig ng misyong iniatas ang ἀπεστάλην. Gayunman, hindi tahasang binabanggit sa mismong talata ang nagsugo, kaya pinananatili ng salin ang pahiwatig at tensiyong teolohikal nang hindi ito pinalalawak.
- issue: Kahulugan ng βασιλεία τοῦ θεοῦ
  choice: kaharian ng Diyos
  alternative: paghahari ng Diyos
  rationale: Maaaring tumukoy ang βασιλεία kapwa sa aktibong paghahari ng Diyos at sa kanyang kaharian o nasasakupan. Ang tradisyonal ngunit malinaw na “kaharian ng Diyos” ay nagpapanatili sa saklaw ng kahulugan sa halip na limitahan ito sa isang aspekto lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lungsod” para sa πόλις at ang pamilyar na “kaharian ng Diyos” upang manatiling madaling maunawaan nang hindi nawawala ang ambiguwidad ng orihinal. Ang ayos ng pangungusap ay likas sa Filipino ngunit pinananatili ang pagsalungat, pangangailangan, lawak ng misyon, at balintiyak na pagkasugo.
