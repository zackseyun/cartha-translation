source:
  edition: SBLGNT
  text: Πνεῦμα κυρίου ἐπ’ ἐμέ, οὗ εἵνεκεν ἔχρισέν με εὐαγγελίσασθαι πτωχοῖς, ἀπέσταλκέν ⸀με κηρύξαι αἰχμαλώτοις ἄφεσιν καὶ τυφλοῖς ἀνάβλεψιν, ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/018.yaml
  text: The Spirit of the Lord is upon me[a], because he has anointed me to proclaim good news to the poor. He has sent me to proclaim release to the captives and recovery of sight to the blind, to send out the oppressed in release[b],
translation:
  language: tl
  text: Ang Espiritu ng Panginoon ay nasa akin, sapagkat pinahiran niya ako upang ipahayag ang mabuting balita sa mga dukha. Isinugo niya ako upang ipahayag ang paglaya[a] sa mga bihag at ang panunumbalik ng paningin sa mga bulag, upang palayain ang mga sinisiil[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “kapatawaran” ang salin sa “paglaya” (Griyego: ἄφεσις); sa konteksto ng mga bihag at sinisiil, higit na angkop dito ang diwa ng pagpapalaya.'
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga taong nabasag” o “nadurog”; ipinahahayag ng “mga sinisiil” ang diwang idyomatiko nito sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πνεῦμα κυρίου
  choice: Ang Espiritu ng Panginoon
  rationale: Likas at marangal na katumbas ito ng pariralang genitibo at pinananatili ang ugnayan nito sa sipi mula sa Isaias.
- source_word: ἐπ’ ἐμέ
  choice: ay nasa akin
  rationale: Idinagdag ang pang-ugnay na kailangan sa Filipino; malapit ito sa larawang ipinahihiwatig ng ἐπί nang hindi nagpapasok ng dagdag na interpretasyon.
- source_word: οὗ εἵνεκεν
  choice: sapagkat
  rationale: Malinaw at natural nitong ipinahahayag ang sanhi o dahilan.
- source_word: ἔχρισέν με
  choice: pinahiran niya ako
  rationale: Pinananatili ng 'pinahiran' ang konkretong kahulugan at Mesiyanikong pahiwatig ng χρίω.
- source_word: εὐαγγελίσασθαι πτωχοῖς
  choice: upang ipahayag ang mabuting balita sa mga dukha
  rationale: Ang 'ipahayag ang mabuting balita' ay malinaw na katumbas ng paghahayag ng magandang balita; ang 'mga dukha' ay marangal at hindi nililimitahan ang termino sa isang tiyak na uri ng kahirapan.
- source_word: ἀπέσταλκέν με
  choice: Isinugo niya ako
  rationale: Ang 'isinugo' ay angkop sa banal na pag-aatas at natural sa kasalukuyang Filipino. Ang patuloy na bisa ng perpektong pandiwa ay mahihiwatigan sa konteksto.
- source_word: κηρύξαι
  choice: upang ipahayag
  rationale: Naghahatid ito ng diwa ng hayagang paghahayag nang hindi nililimitahan sa pormal na pangangaral sa simbahan.
- source_word: αἰχμαλώτοις ἄφεσιν
  choice: ang paglaya sa mga bihag
  rationale: Sa konteksto ng mga bihag at sinisiil, ang ἄφεσις ay pinakamainam na isalin bilang 'paglaya,' habang kinikilala sa talababa ang posibleng kahulugang 'kapatawaran.'
- source_word: τυφλοῖς ἀνάβλεψιν
  choice: ang muling pagkakita ng mga bulag
  rationale: Ipinapakita ng 'muling pagkakita' ang pagbabalik o pagtanggap ng paningin na taglay ng ἀνάβλεψις.
- source_word: ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει
  choice: upang palayain ang mga sinisiil
  rationale: Natural nitong ipinahahayag sa Filipino ang idiomatikong diwa ng pagpapayaon sa kalagayan ng paglaya. Ang literal na larawan ng mga 'binasag' o 'dinurog' ay inilalagay sa talababa.
theological_decisions:
- issue: Kahulugan ng ἄφεσις sa sipi mula sa Isaias
  choice: paglaya
  alternative: kapatawaran
  rationale: Ang agarang konteksto—mga bihag, mga bulag, at mga taong binasag o sinisiil—ay pumapabor sa paglaya. Gayunman, dahil maaari ring mangahulugan ang ἄφεσις ng kapatawaran sa Lucas, pinananatili ang tunay na leksikal na tensiyon sa talababa.
- issue: Paglalarawan sa τεθραυσμένους
  choice: mga sinisiil
  alternative: mga binasag / mga dinurog
  rationale: Ang anyong perpektong pasibo ay literal na tumutukoy sa mga taong nabasag o nadurog. Sa kontekstong mapagpalaya, malinaw at natural ang 'mga sinisiil,' habang itinatala ang literal na larawan upang hindi ito mawala.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang 'dukha,' 'isinugo,' at 'pinahiran' upang mapanatili ang biblikal na himig nang hindi nagiging lipas o labis na teknikal. Isinaayos ang huling parirala bilang natural na 'palayain' sa pangunahing teksto, habang pinananatili sa talababa ang literal na larawan at ang ambiguwidad ng ἄφεσις.
