id: LUK.4.36
reference: Luke 4:36
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐγένετο θάμβος ἐπὶ πάντας, καὶ συνελάλουν πρὸς ἀλλήλους λέγοντες· Τίς ὁ λόγος οὗτος ὅτι ἐν ἐξουσίᾳ καὶ δυνάμει ἐπιτάσσει τοῖς ἀκαθάρτοις πνεύμασιν, καὶ ἐξέρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/036.yaml
  text: And amazement came upon everyone[a], and they were speaking with one another, saying, “What is this word, that with authority and power he commands the unclean spirits, and they come out?”
translation:
  language: tl
  text: Lubos na namangha ang lahat, at nag-uusap-usap sila, “Ano itong salita, na nag-uutos siya sa maruruming espiritu nang may awtoridad at kapangyarihan, at lumalabas ang mga ito?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θάμβος
  choice: pagkamangha / Namangha
  rationale: Ipinahahayag ng θάμβος ang matinding pagtataka o pagkamangha. Ang pandiwang “Namangha” ay likas at malinaw sa modernong Tagalog.
- source_word: ἐγένετο ... ἐπὶ πάντας
  choice: Namangha ang lahat
  rationale: Likas na ipinahahayag sa Tagalog ang idyomang Griyego sa pamamagitan ng tuwirang paglalarawan sa naging reaksiyon ng lahat, nang hindi pinahihina ang tindi nito.
- source_word: συνελάλουν πρὸς ἀλλήλους
  choice: patuloy silang nag-usap-usap
  rationale: Ipinakikita ng imperpektong anyo ang nagpapatuloy na pag-uusap, at malinaw sa “nag-usap-usap” ang pagtutugunan nila sa isa’t isa.
- source_word: Τίς ὁ λόγος οὗτος
  choice: Ano ang salitang ito
  rationale: Pinananatili ng “salita” ang lawak ng λόγος, na maaaring tumukoy sa binigkas na salita, mensahe, o usapin, at angkop ito sa reaksiyon sa utos ni Jesus.
- source_word: ἐν ἐξουσίᾳ καὶ δυνάμει
  choice: nang may awtoridad at kapangyarihan
  rationale: Ang “nang may” ay natural na modal o instrumental na katumbas ng ἐν, habang pinananatili ang pagkakasunod ng awtoridad at kapangyarihan.
- source_word: ἐπιτάσσει
  choice: Nag-uutos siya
  rationale: Ang “nag-uutos” ay tuwiran, malinaw, at pinananatili ang masiglang aspektong pangkasalukuyan ng ulat.
- source_word: τοῖς ἀκαθάρτοις πνεύμασιν
  choice: sa maruruming espiritu
  rationale: Ang “maruruming espiritu” ay malapit sa literal na kahulugan at pinananatili ang konteksto ng rituwal at espirituwal na karumihan sa salaysay.
- source_word: ἐξέρχονται
  choice: lumalabas sila
  rationale: Likas sa konteksto ng pagpapalayas ng espiritu ang “lumalabas,” at pinananatili nito ang tahasang kilos ng pag-alis mula sa tao.
theological_decisions:
- issue: Paglalarawan sa mga espiritung pinalalayas
  choice: maruruming espiritu
  alternative: masasamang espiritu / di-malilinis na espiritu
  rationale: Pinananatili ng “maruruming espiritu” ang katawagan at supernatural na balangkas ng tekstong Griyego nang hindi ito ginagawang sikolohikal na metapora o dinaragdagan ng denominasyonal na paliwanag.
- issue: Ugnayan ng awtoridad at kapangyarihan
  choice: awtoridad at kapangyarihan
  alternative: kapangyarihan at lakas
  rationale: Pinananatili ang dalawang magkaibang salitang ἐξουσία at δύναμις at ang kanilang pagkakasunod, nang hindi pinagsasanib ang lehitimong awtoridad at mabisang kapangyarihan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “awtoridad” bilang karaniwang modernong salita at “maruruming espiritu” upang mapanatili ang biblikal na katawagan. Hinati sa dalawang pangungusap ang tanong at paliwanag upang maging natural sa Tagalog habang nananatili ang lohikal na ugnayan ng ὅτι.
