  source_fidelity: 'Tumpak sa pangkalahatan ang draft: naipapahayag nito ang pagkamangha ng lahat, ang nagpapatuloy na pag-uusap sa isa’t isa, at ang pag-uutos ni Jesus sa maruruming espiritu na may awtoridad at kapangyarihan. Gayunman, ang paghahati sa tanong at kasunod na pahayag ay nagpapahina sa paliwanag na ugnayang ipinahihiwatig ng ὅτι. Maaaring panatilihin ang ugnayang ito sa isang likas na pangungusap sa Tagalog.'
