  text: καὶ ἐν τῇ συναγωγῇ ἦν ἄνθρωπος ἔχων πνεῦμα δαιμονίου ἀκαθάρτου, καὶ ἀνέκραξεν φωνῇ μεγάλῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/033.yaml
  text: And in the synagogue there was a man having an unclean spirit of a demon[a], and he cried out with a loud voice[b],
translation:
  language: tl
  text: At sa sinagoga ay may isang lalaking may espiritu ng isang demonyong marumi, at sumigaw siya sa malakas na tinig,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναγωγῇ
  choice: sinagoga
  rationale: Karaniwang tawag sa Filipino sa lugar ng pagtitipon at pagsamba ng mga Judio; mas tiyak ito kaysa sa pangkalahatang “pagtitipon.”
- source_word: ἄνθρωπος
  choice: isang lalaki
  rationale: Isang tiyak na lalaking nasa hustong gulang ang tinutukoy sa salaysay, hindi ang sangkatauhan sa pangkalahatan.
- source_word: ἔχων
  choice: may
  rationale: Natural na katumbas ng literal na “mayroon/having” at hindi nagdaragdag ng mas interpretatibong “sinasapian.”
- source_word: πνεῦμα δαιμονίου ἀκαθάρτου
  choice: espiritu ng maruming demonyo
  rationale: Pinananatili ang kapwa πνεῦμα (“espiritu”) at δαιμόνιον (“demonyo”). Ang ἀκαθάρτου ay kaanyo ng genitibong δαιμονίου, kaya tuwirang inilalarawan dito ang demonyo bilang marumi; hindi ito pinadadali bilang “masamang espiritu” lamang.
- source_word: ἀνέκραξεν
  choice: sumigaw
  rationale: Natural at sapat ang lakas para sa pandiwang tumutukoy sa malakas na pagdaing o pagsigaw, nang hindi labis na dinadramatisa.
- source_word: φωνῇ μεγάλῃ
  choice: nang malakas
  rationale: Ito ang natural na ekspresyon sa modernong Filipino para sa paraang literal na “sa malakas na tinig.”
theological_decisions:
- issue: Paglalarawan sa espiritu at demonyo
  choice: espiritu ng maruming demonyo
  alternative: maruming espiritu / masamang espiritu
  rationale: Tahasan sa Griyego ang parehong “espiritu” at “demonyo.” Pinananatili ng salin ang dalawang sangkap at hindi binabawasan o dinaragdagan ang supernatural na paglalarawan.
- issue: Kalagayan ng lalaki
  choice: may espiritu
  alternative: sinasapian ng espiritu
  rationale: Ang ἔχων ay literal na “may.” Iniiwasan ng salin ang paglalagay sa pangunahing teksto ng mas tiyak na paliwanag tungkol sa uri o antas ng pagkontrol ng demonyo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “sinagoga,” “lalaki,” at “demonyo” bilang mga karaniwan at tiyak na terminong nauunawaan ng pangkalahatang mambabasa. Ang “may” at “sumigaw nang malakas” ay natural na pananalita ngunit malapit pa rin sa anyo at diwa ng Griyego.
