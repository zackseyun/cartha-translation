base_translation:
  language: en
  yaml_path: translation/nt/luke/004/012.yaml
  text: 'And Jesus answered him[b][a], “It is said: You shall not put the Lord your God to the test.”'
translation:
  language: tl
  text: 'Sinagot siya ni Jesus, “Nasabi na[a]: ‘Huwag mong subukin ang Panginoon[b] mong Diyos.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Madalas na ginagamit sa mga tradisyonal na salin ang “Nasusulat.” Literal na “nasabi na” ang pandiwang Griyego rito.
    reason: alternative_reading
  - marker: b
    text: Sipi ito mula sa Deuteronomio 6:16, kung saan lumilitaw sa tekstong Hebreo ang pangalang YHWH, na karaniwang isinasaling “PANGINOON.”
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Sinagot
  rationale: Ang participle at finite verb ay karaniwang idyomang Griyego na nangangahulugang sumagot. Likas sa modernong Tagalog ang payak na “Sinagot” at hindi nawawala ang diwa.
- source_word: αὐτῷ
  choice: siya
  rationale: Tumutukoy ang panghalip sa diyablo na kausap ni Jesus sa konteksto; ang “siya” ang likas na layon ng pandiwang “sinagot.”
- source_word: ὅτι
  choice: —
  rationale: Hindi kailangang isalin nang hiwalay ang ὅτι bago ang tuwirang sipi sa natural na Tagalog.
- source_word: Εἴρηται
  choice: Nasabi na
  rationale: Ang perfect passive ng λέγω ay nagpapahiwatig na may sinabi na at nananatiling may bisa. Pinananatili ng “Nasabi na” ang diwa ng pagsasalita, sa halip na palitan ito ng tradisyonal na “Nasusulat.”
- source_word: Οὐκ ἐκπειράσεις
  choice: Huwag mong subukin
  rationale: Ang ἐκπειράζω ay nangangahulugang ilagay sa pagsubok o subukin nang tahasan. Malinaw ang “subukin” at iniiwasan nito ang diwang akitin sa kasalanan na maaaring ipahiwatig ng “tuksuhin.”
- source_word: κύριον
  choice: ang Panginoon
  rationale: Tuwirang katumbas ng κύριος ang “Panginoon”; kailangan ang pantukoy na “ang” sa pariralang Tagalog.
- source_word: τὸν θεόν σου
  choice: mong Diyos
  rationale: Ang enclitic na “mong” ay natural na nag-uugnay sa “Panginoon” at “Diyos” at pinananatili ang kahulugang “ang Panginoon na iyong Diyos.”
theological_decisions:
- issue: Pormula ng pagsipi sa Kasulatan (Εἴρηται)
  choice: Nasabi na
  alternative: Nasusulat
  rationale: λέγω, hindi γράφω, ang pandiwa sa Griyego. Kaya pinananatili sa pangunahing teksto ang diwa ng “sinabi,” habang inilalagay sa talababa ang tradisyonal na pormulang “Nasusulat.”
- issue: Paglilipat ng κύριος sa sipi mula sa Deuteronomio 6:16
  choice: Panginoon
  alternative: YHWH
  rationale: κύριος ang nasa tekstong Griyego, kaya “Panginoon” ang nasa pangunahing teksto. Ipinaliliwanag sa talababa na YHWH ang nasa pinagmulan nitong Hebreo nang hindi pinapalitan ang anyo ng tekstong Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “Nasabi na” upang mapanatili ang perfect-passive na pormula ng Griyego, at ang “Huwag mong subukin” bilang natural na pagbabawal sa isahan.
