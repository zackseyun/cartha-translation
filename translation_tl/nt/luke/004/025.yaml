  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν, πολλαὶ χῆραι ἦσαν ἐν ταῖς ἡμέραις Ἠλίου ἐν τῷ Ἰσραήλ, ὅτε ἐκλείσθη ὁ οὐρανὸς ⸀ἐπὶ ἔτη τρία καὶ μῆνας ἕξ, ὡς ἐγένετο λιμὸς μέγας ἐπὶ πᾶσαν τὴν γῆν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/025.yaml
  text: But I tell you truly, there were many widows in Israel in the days of Elijah, when the sky was shut up for three years and six months, as a great famine came over all the land.
translation:
  language: tl
  text: 'Ngunit sinasabi ko sa inyo ang totoo: maraming biyuda sa Israel noong panahon ni Elias, nang hindi umulan sa loob ng tatlong taon at anim na buwan[a] at nagkaroon ng matinding taggutom sa buong lupain.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “nang isinara ang langit sa loob ng tatlong taon at anim na buwan.”'
    reason: Pinananatili ang matingkad na literal na larawan ng Griyego habang gumagamit ang pangunahing teksto ng mas natural na Filipino.
lexical_decisions:
- source_word: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν
  choice: Ngunit sinasabi ko sa inyo ang totoo
  rationale: Likas at tuwirang Filipino na pinananatili ang pagsalungat ng δέ at ang mariing pagtiyak na ἐπ’ ἀληθείας.
- source_word: χῆραι
  choice: mga biyuda
  rationale: Karaniwan at malinaw na modernong katawagan para sa mga babaeng namatayan ng asawa.
- source_word: ἐκλείσθη ὁ οὐρανός
  choice: hindi umulan
  rationale: Ipinahahayag sa likas na Filipino ang idyomang literal na 'isinara ang langit,' na sa konteksto ay tumutukoy sa pagpigil ng ulan.
- source_word: λιμὸς μέγας
  choice: matinding taggutom
  rationale: Tumpak na naghahatid ng tindi ng μέγας at ng malawakang kakulangan sa pagkain na ipinahihiwatig ng λιμός.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: sa buong lupain
  rationale: Pinananatili ang saklaw at ang posibleng lokal na diwa ng γῆ sa konteksto, nang hindi awtomatikong ginagawang buong daigdig.
theological_decisions:
- issue: Tagal ng tagtuyot at paghahambing sa 1 Hari 17–18
  choice: tatlong taon at anim na buwan
  alternative: tatlong taon
  rationale: Tahasan itong nakasaad sa tekstong Griyego ng Lucas at hindi dapat baguhin upang ipantay sa ibang paglalahad.
- issue: Larawan ng 'isinara ang langit'
  choice: hindi umulan
  alternative: isinara ang langit
  rationale: Ang kahulugan sa konteksto ay kawalan ng ulan; isinasalin itong malinaw at natural nang walang idinadagdag na paliwanag tungkol sa sanhi.
- issue: Saklaw ng γῆ
  choice: buong lupain
  alternative: buong mundo
  rationale: Ang γῆ ay maaaring mangahulugang lupain o daigdig; pinananatili ng 'lupain' ang kontekstuwal na posibilidad at iniiwasang lutasin nang di-kailangan ang saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “biyuda” at “taggutom” bilang karaniwang salita, at pinanatili ang tradisyonal at madaling makilalang pangalang “Elias.”
