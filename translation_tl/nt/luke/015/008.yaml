  text: Ἢ τίς γυνὴ δραχμὰς ἔχουσα δέκα, ἐὰν ἀπολέσῃ δραχμὴν μίαν, οὐχὶ ἅπτει λύχνον καὶ σαροῖ τὴν οἰκίαν καὶ ζητεῖ ἐπιμελῶς ἕως ⸀οὗ εὕρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/008.yaml
  text: Or what woman[a], having ten drachmas, if she loses one drachma[b], does not light a lamp and sweep the house and search carefully until she finds it?
translation:
  language: tl
  text: O sinong babaeng may sampung drakma[a], kung mawalan siya ng isang drakma, ang hindi magsisindi ng ilawan, wawalisin ang bahay, at maghahanap nang masusi[b] hanggang sa matagpuan niya ito?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang drakma ay isang baryang pilak na Griyego.
    reason: cultural_note
  - marker: b
    text: O “maghahanap nang masikap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: O
  rationale: Pinananatili ang pang-ugnay sa naunang talinghaga at ipinakikitang isa itong kaagapay na halimbawa.
- source_word: τίς γυνὴ
  choice: sinong babae
  rationale: Likas na anyong patanong sa modernong Tagalog para sa retorikal na halimbawang ipinakikilala ng Griyego, nang hindi idinaragdag ang ‘sa inyo.’
- source_word: δραχμὰς
  choice: mga drakma
  rationale: Pinananatili ang tiyak na pangalan ng makasaysayang barya sa halip na gawing pangkalahatang ‘mga barya’; ipinaliliwanag ito sa talababa.
- source_word: ἔχουσα δέκα
  choice: may sampung
  rationale: Maikli at likas na salin ng pariralang participial sa Tagalog.
- source_word: ἐὰν ἀπολέσῃ
  choice: kung maiwala niya
  rationale: Ipinahahayag ang pangkalahatang kondisyon at ang di-sinasadyang pagkawala sa natural na Tagalog.
- source_word: δραχμὴν μίαν
  choice: isang drakma
  rationale: Pinananatili kapwa ang tiyak na uri ng barya at ang diin sa iisang nawala.
- source_word: οὐχὶ
  choice: ang hindi
  rationale: 'Binubuo ang retorikal na tanong na umaasa sa positibong sagot: gagawin nga ng babae ang mga kilos na sumusunod.'
- source_word: ἅπτει λύχνον
  choice: magsisindi ng ilawan
  rationale: Malinaw na inilalarawan ang pagsisindi ng isang ilawan; hindi ginagawang tiyak ang ilawan dahil walang artikulo ang Griyego.
- source_word: σαροῖ τὴν οἰκίαν
  choice: magwawalis ng bahay
  rationale: Tuwirang inilalarawan ang konkretong kilos sa tagpong pambahay.
- source_word: ζητεῖ ἐπιμελῶς
  choice: masusing maghahanap
  rationale: Natural at kasalukuyang Tagalog na nagpapahayag ng maingat at masikap na paghahanap.
- source_word: ἕως οὗ εὕρῃ
  choice: hanggang sa makita niya ito
  rationale: Malinaw na ipinahahayag ang hangganan ng paghahanap at likas na ibinabalik ng ‘ito’ ang tinutukoy na nawawalang drakma.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang retorikal na tanong at ang makasaysayang terminong “drakma.” Inilipat ang marker [a] sa mismong salitang “drakma” upang malinaw ang tinutukoy ng talang pangkultura.
