revisions:
- from: O sinong babaeng may sampung drakma[a], kung maiwala niya ang isang drakma, ang hindi magsisindi ng ilawan, magwawalis ng bahay, at masusing maghahanap[b] hanggang sa makita niya ito?
  to: O sinong babaeng may sampung drakma[a], kung mawalan siya ng isang drakma, ang hindi magsisindi ng ilawan, wawalisin ang bahay, at maghahanap nang masusi[b] hanggang sa matagpuan niya ito?
  rationale: Inayos ang kondisyong pangungusap upang hindi magdagdag ng diwa ng kusang pagpapawala, at pinakinis ang mga pandiwang Tagalog habang pinananatili ang retorikal na tanong, ang pagkakasunod ng mga kilos, at ang tiyak na terminong “drakma.”
