id: LUK.15.13
reference: Luke 15:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ μετ’ οὐ πολλὰς ἡμέρας συναγαγὼν ⸀πάντα ὁ νεώτερος υἱὸς ἀπεδήμησεν εἰς χώραν μακράν, καὶ ἐκεῖ διεσκόρπισεν τὴν οὐσίαν αὐτοῦ ζῶν ἀσώτως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/013.yaml
  text: And after not many days[a], the younger son gathered everything together and went away to a distant country, and there he squandered his property[c][b], living recklessly.
translation:
  language: tl
  text: Hindi nagtagal[a], tinipon ng nakababatang anak ang lahat ng kaniyang pag-aari at naglakbay siya patungo sa isang malayong lupain. Doon ay nilustay niya ang kaniyang ari-arian[b] sa walang-ingat na pamumuhay.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Makalipas ang ilang araw.” Sa literal, “makalipas ang hindi maraming araw.”
    reason: lexical_alternative
  - marker: b
    text: O “kayamanan” o “mga pag-aari.”
    reason: lexical_alternative
  - marker: c
    text: O “sa maaksayang pamumuhay.” Hindi tinutukoy rito ang partikular na mga kasalanan, kundi ang isang maaksaya at walang-ingat na paraan ng pamumuhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολλὰς ἡμέρας
  choice: Hindi nagtagal
  rationale: Natural na katumbas sa modernong Tagalog ng literal na ‘makalipas ang hindi maraming araw.’ Pinananatili ng talababa ang mas lantad na anyo ng Griyego.
- source_word: συναγαγὼν πάντα
  choice: tinipon ... ang lahat ng kaniyang pag-aari
  rationale: Ipinakikita ang kilos na nauna sa pag-alis at pinananatili ang diwa ng pagsasama-sama ng lahat ng nasa kaniya, nang hindi tahasang sinasabing ipinagbili o ginawang salapi ang mga iyon.
- source_word: ὁ νεώτερος υἱός
  choice: ang nakababatang anak
  rationale: Karaniwan at malinaw na salin sa Tagalog; ipinahihiwatig ng konteksto na siya ang nakababatang anak na lalaki.
- source_word: ἀπεδήμησεν εἰς χώραν μακράν
  choice: naglakbay siya patungo sa isang malayong lupain
  rationale: Ipinahahayag ang pag-alis tungo sa malayong lugar. Ang ‘lupain’ ay likas at hindi labis na tiyak na katumbas ng χώρα.
- source_word: διεσκόρπισεν
  choice: nilustay
  rationale: Sa konteksto ng ari-arian, ang literal na ideya ng ‘pagkakalat’ ay nangangahulugang pag-aaksaya o walang-ingat na pag-ubos; ‘nilustay’ ang pinakanatural na pandiwang Tagalog.
- source_word: τὴν οὐσίαν αὐτοῦ
  choice: ang kaniyang ari-arian
  rationale: Malawak na tumutukoy sa pag-aari, kayamanan, o kabuhayang nasa kaniya, nang hindi labis na nililimitahan sa salapi lamang.
- source_word: ζῶν ἀσώτως
  choice: sa walang-ingat na pamumuhay
  rationale: Inilalarawan ang paraan ng paglustay nang hindi nagdaragdag ng partikular na uri ng kasalanang hindi tahasang binanggit sa talata.
theological_decisions:
- issue: Kung dapat tukuyin ang ἀσώτως bilang seksuwal na kahalayan o ibang tiyak na bisyo
  choice: walang-ingat na pamumuhay
  alternative: mahalay na pamumuhay
  rationale: Hindi tinutukoy ng mismong talata ang partikular na mga bisyo. Pinananatili ng salin ang lawak at tensiyon ng orihinal sa halip na ipasok ang mas makitid na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang ‘kaniyang’ para sa pormal na tekstong pampublikasyon, ngunit iniwasan ang lipas o labis na teknikal na pananalita. Ang paghahati sa dalawang pangungusap ay nagpapalinaw sa daloy nang hindi binabago ang ugnayan ng mga kilos.
