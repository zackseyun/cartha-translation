  text: καὶ εὑρὼν ἐπιτίθησιν ἐπὶ τοὺς ὤμους ⸀αὐτοῦ χαίρων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/005.yaml
  text: And when he has found it[a], he lays it on his shoulders, rejoicing.
translation:
  language: tl
  text: At kapag natagpuan na niya ito[a], ipinapasan niya ito sa kaniyang mga balikat nang may tuwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, ang nawawalang tupa na binanggit sa naunang konteksto.
    reason: cross_reference
lexical_decisions:
- source_word: εὑρὼν
  choice: kapag natagpuan na niya ito
  rationale: Ang aorist active participle ay ginawang likas na sugnay na temporal sa Tagalog. Idinagdag ang “ito” bilang layon na malinaw na tumutukoy sa nawawalang tupa sa naunang konteksto.
- source_word: ἐπιτίθησιν
  choice: ipinapasan niya ito
  rationale: Sa konteksto ng pastol at tupa, ang “ipinapasan” ay natural at tiyak na paglalarawan sa paglalagay ng tupa sa mga balikat, habang pinananatili ang masiglang present tense ng salaysay.
- source_word: ἐπὶ τοὺς ὤμους
  choice: sa kaniyang mga balikat
  rationale: Ipinahahayag nito ang paglalagay sa ibabaw ng mga balikat at pinananatili ang anyong maramihan ng ὤμους.
- source_word: αὐτοῦ
  choice: kaniyang
  rationale: Ang panghalip na genitive ay tumutukoy sa pastol; malinaw itong iniuugnay sa sarili niyang mga balikat.
- source_word: χαίρων
  choice: nang may tuwa
  rationale: Ipinahahayag ang kasabay na kalagayan o paraan ng pagkilos ng pastol nang hindi dinaragdagan ang antas o sanhi ng kaniyang kagalakan.
theological_decisions:
- issue: Paglalagay ng di-hayag na tuwirang layon
  choice: Isinama ang “ito” pagkatapos ng “natagpuan” at “ipinapasan” upang tumukoy sa nawawalang tupa.
  alternative: At kapag natagpuan na niya, ipinapasan niya sa kaniyang mga balikat nang may tuwa.
  rationale: Maaaring hindi banggitin sa Griyego ang layon dahil malinaw ito sa konteksto, ngunit kailangan ito sa natural at malinaw na Tagalog. Hindi nito nilulutas ang anumang teolohikal na usapin; tinutukoy lamang nito ang tupa sa naunang talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “ipinapasan” bilang karaniwang salitang angkop sa aktuwal na kilos ng pastol, at ang “nang may tuwa” upang madaling maunawaan ang kasabay na χαίρων.
