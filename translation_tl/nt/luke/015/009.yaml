translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “makipagsaya” para sa sama-samang kagalakan at pinanatili ang “drakma” bilang tiyak na terminong pangkultura. Inilagay ang marker na [a] kaagad pagkatapos ng terminong ipinapaliwanag.
