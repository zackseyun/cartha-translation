  - severity: low
    issue: Hindi gaanong naipapakita ng ‘tinawag niya’ ang compound sense ng συγκαλεῖ.
    rationale: Ang ‘ipinatawag niya’ ay natural na Tagalog at mas malinaw na nagpapahiwatig ng pagpapatawag sa magkakasamang pagtipon ng mga kaibigan at kapitbahay.
