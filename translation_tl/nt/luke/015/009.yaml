revisions:
- from: At nang makita niya ito, tinawag niya ang kanyang mga kaibigang babae at mga kapitbahay at sinabi, ‘Makipagsaya kayo sa akin, sapagkat nakita ko na ang drakma[a] na naiwala ko.’
  to: At nang matagpuan niya ito, ipinatawag niya ang kanyang mga kaibigang babae at mga kapitbahay, na sinasabi, ‘Makipagsaya kayo sa akin, sapagkat natagpuan ko ang drakma[a] na naiwala ko.’
  rationale: Pinalitan ang mga anyo ng ‘makita’ ng ‘matagpuan’ upang tuwirang maipahayag ang εὑρίσκω sa konteksto ng paghahanap sa nawawalang barya. Ginawang ‘ipinatawag niya’ ang συγκαλεῖ upang maipakita ang pagpapatawag sa isang pangkat. Ang ‘na sinasabi’ ay nagpapanatili sa participial na λέγουσα nang natural sa Tagalog. Hindi binago ang kahulugan, rehistro, kasarian ng φίλας, pangalan ng barya, o footnote anchor.
