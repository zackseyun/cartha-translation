  text: καὶ εὑροῦσα ⸀συγκαλεῖ τὰς φίλας ⸀καὶ γείτονας λέγουσα· Συγχάρητέ μοι ὅτι εὗρον τὴν δραχμὴν ἣν ἀπώλεσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/009.yaml
  text: And when she has found it[a], she calls together her women friends and neighbors, saying, ‘Rejoice with me, because I found the drachma that I had lost.’
translation:
  language: tl
  text: At nang matagpuan niya ito, ipinatawag niya ang kanyang mga kaibigang babae at mga kapitbahay, na sinasabi, ‘Makipagsaya kayo sa akin, sapagkat natagpuan ko ang drakma[a] na naiwala ko.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang drakma ay isang baryang pilak ng mga Griyego, na sa maraming kalagayan ay halos katumbas ng isang araw na sahod ng isang manggagawa.
    reason: cultural_note
lexical_decisions:
- source_word: εὑροῦσα
  choice: nang makita niya ito
  rationale: Ang aorist participle na pambabae ay ginawang sugnay na temporal para maging natural sa Tagalog; ang “ito” ay ipinahiwatig ng konteksto at tumutukoy sa nawawalang barya.
- source_word: συγκαλεῖ
  choice: tinawag niya
  rationale: Likas na paraan sa Tagalog upang ipahayag ang pagtawag sa mga tao na lumapit o magtipon; ang aspektong perpektibo ay angkop sa salaysay, bagaman vivid present ang Griyego.
- source_word: φίλας
  choice: mga kaibigang babae
  rationale: Pinananatili ang tahasang pambabaeng anyo ng Griyego, na tumutukoy sa mga kaibigang babae ng babae.
- source_word: γείτονας
  choice: mga kapitbahay
  rationale: Natural at hindi labis na tiyak sa kasarian; ang Griyegong anyo mismo ay maaaring tumukoy sa mga kapitbahay sa pangkalahatan.
- source_word: λέγουσα
  choice: at sinabi
  rationale: Ginawang koordinadong pandiwa upang maging maayos at natural ang daloy sa modernong Tagalog.
- source_word: Συγχάρητέ μοι
  choice: Makipagsaya kayo sa akin
  rationale: Ipinahahayag ang maramihang pautos na makibahagi sa kagalakan ng nagsasalita; mas natural ito kaysa sa literal na “magalak kayong kasama ko.”
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na nagpapakilala sa dahilan ng pakikipagsaya at angkop sa marangal na rehistro.
- source_word: εὗρον
  choice: nakita ko na
  rationale: Ang perpektibong anyong “nakita” ay tumutugma sa aorist, at ang “na” ay natural na nagpapahiwatig na matagumpay nang natagpuan ang barya.
- source_word: δραχμὴν
  choice: drakma
  rationale: Pinananatili ang tiyak na pangalan ng baryang Griyego sa halip na gawing pangkalahatang “barya”; nililinaw ito sa talababa.
- source_word: ἣν ἀπώλεσα
  choice: na naiwala ko
  rationale: Natural na sugnay na panuring sa Tagalog at pinananatili ang pananagutan ng nagsasalita sa pagkawala nang hindi nagdaragdag ng paliwanag.
