  text: δαπανήσαντος δὲ αὐτοῦ πάντα ἐγένετο λιμὸς ⸀ἰσχυρὰ κατὰ τὴν χώραν ἐκείνην, καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/014.yaml
  text: But after he had spent everything[a], a severe famine came upon that country[b], and he began to be in need.
translation:
  language: tl
  text: Ngunit matapos niyang magastos ang lahat, nagkaroon ng matinding taggutom sa buong lupaing iyon, at nagsimula siyang mangailangan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagsimula siyang kapusin” o “nagsimula siyang magkulang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δαπανήσαντος ... αὐτοῦ πάντα
  choice: nang maubos na niya ang lahat
  rationale: 'Ang genitive absolute na may aorist participle ay temporal: nang/ matapos niyang gastusin ang lahat. Ang likas na pariralang Filipino na “maubos na niya ang lahat” ay naghahatid ng buong pagkaubos ng kanyang ari-arian nang hindi idinaragdag ang mapanghusgang diwa ng “nilustay.”'
- source_word: δέ
  choice: Ngunit
  rationale: Ipinakikita ng δέ ang pagliko mula sa paggasta tungo sa krisis; natural na naihahayag ito ng “Ngunit.”
- source_word: ἐγένετο
  choice: nagkaroon
  rationale: Kasama ng λιμός, ipinahihiwatig ng γίνομαι ang paglitaw o pagsapit ng taggutom. Ang “nagkaroon” ay natural sa modernong Filipino.
- source_word: λιμὸς ἰσχυρά
  choice: matinding taggutom
  rationale: Pinatitindi ng ἰσχυρά ang tindi ng λιμός; ang “matinding taggutom” ay malinaw at karaniwang pahayag.
- source_word: κατὰ τὴν χώραν ἐκείνην
  choice: sa buong lupaing iyon
  rationale: Ang κατά na may accusative ay maaaring tumukoy sa lawak ng isang pangyayari sa isang lugar. Napananatili ng “sa buong lupaing iyon” ang distributive o malawakang diwa, habang ang χώρα ay likas na isinasaling “lupain” sa kontekstong ito.
- source_word: καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι
  choice: at nagsimula siyang maghirap
  rationale: Naghahayag ang ἤρξατο ng pagsisimula, at ang ὑστερεῖσθαι rito ay pagiging salat o nangangailangan. Ang “maghirap” ay natural at nauunawaan, bagaman maaari ring mas tuwirang sabihing “mangailangan.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Iniwasan ang “nilustay” dahil hindi iyon kinakailangang ipinahihiwatig ng δαπανάω sa talatang ito. Inilagay ang marker [a] sa mismong teksto.
