id: LUK.15.23
reference: Luke 15:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀φέρετε τὸν μόσχον τὸν σιτευτόν, θύσατε, καὶ φαγόντες εὐφρανθῶμεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/023.yaml
  text: And bring the fattened calf[a], slaughter it, and let us eat and celebrate,
translation:
  language: tl
  text: At dalhin ninyo ang pinatabang guya, katayin ninyo ito,[a] at kumain tayo at magdiwang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ihandog”; ang pandiwang Griyego ay maaaring tumukoy sa pagkatay ng hayop at, sa ilang konteksto, ay may pahiwatig na paghahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρετε
  choice: dalhin ninyo
  rationale: Pautos na maramihan ang pandiwa. Likas sa Tagalog ang “dalhin ninyo” at hindi na idinaragdag ang “dito” o “ilabas,” na wala namang tahasang katumbas sa Griyego.
- source_word: μόσχον τὸν σιτευτόν
  choice: ang pinatabang guya
  rationale: Ang μόσχος ay batang baka o guya, at ang σιτευτός ay hayop na pinataba para sa isang natatanging pagkakataon. Malinaw at likas sa kasalukuyang Tagalog ang “pinatabang guya.”
- source_word: θύσατε
  choice: katayin ninyo ito
  rationale: Maaaring tumukoy ang θύω sa pagkatay ng hayop, kung minsan ay kaugnay ng paghahandog. Sa konteksto ng paghahanda ng salu-salo, tumpak ang “katayin” nang hindi ipinapalagay na rituwal na paghahandog ang tinutukoy.
- source_word: φαγόντες
  choice: kumain tayo
  rationale: Bagaman anyong participle at literal na maaaring “pagkakain,” bahagi ito rito ng paanyayang kumain at magdiwang. Ang “kumain tayo” ang malinaw at natural na katumbas sa Tagalog.
- source_word: εὐφρανθῶμεν
  choice: magdiwang
  rationale: Ang hortatory subjunctive ay nagpapahayag ng sama-samang paanyaya. Ang “magdiwang” ay angkop sa konteksto ng handaan at mas kongkreto rito kaysa “magalak.”
- source_word: καὶ ... καὶ
  choice: at ... at
  rationale: Pinananatili ng mga pang-ugnay na “at” ang sunod-sunod at naiipong daloy ng mga utos at ng pangwakas na paanyaya.
theological_decisions:
- issue: Posibleng kahulugang pansakripisyo ng θύσατε
  choice: “katayin ninyo ito” bilang paghahanda sa salu-salo
  alternative: “ihandog ninyo ito” o “katayin ninyo ito bilang handog”
  rationale: Maaaring magkaroon ng pansakripisyong pahiwatig ang θύω, ngunit nakatuon ang salaysay sa paghahanda ng hayop para sa sama-samang pagdiriwang sa tahanan. Iniiwasan ng “katayin” ang pagpasok ng tahasang rituwal na kahulugang hindi hinihingi ng konteksto, habang kinikilala sa talababa ang saklaw ng salitang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “guya,” “katayin,” at “magdiwang” bilang karaniwan ngunit hindi kolokyal na mga salita. Inilagay ang talababa sa “katayin,” ang mismong salitang may leksikal na alternatibo.
