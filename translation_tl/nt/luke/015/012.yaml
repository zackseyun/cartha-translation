base_translation:
  language: en
  yaml_path: translation/nt/luke/015/012.yaml
  text: And the younger of them said to his father[a], ‘Father[b], give me the share of the estate that falls to me.’ So he divided his livelihood between them.
translation:
  language: tl
  text: At sinabi ng nakababata sa magkapatid sa kanyang ama, “Ama, ibigay po ninyo sa akin ang bahagi ng ari-arian na nauukol sa akin.” Kaya hinati niya sa kanilang dalawa ang kanyang kabuhayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “ang kanyang buhay/ikinabubuhay” (βίον); tumutukoy rito sa ari-arian o mga pag-aaring pantustos sa pamumuhay ng ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτερος
  choice: nakababata sa kanila
  rationale: 'Substantibong gamit ng pahambing na pang-uri: “ang nakababata [sa kanila].” Ipinahihiwatig ng konteksto na anak siya, ngunit hindi tahasang inuulit iyon sa talata.'
- source_word: δός μοι
  choice: ibigay po ninyo sa akin
  rationale: Tuwirang kahilingan na ipinahayag sa magalang at likas na modernong Tagalog; ang “po” at pangmaramihang anyo ay paggalang sa ama, hindi pahiwatig ng maramihang kausap.
- source_word: τὸ ἐπιβάλλον μέρος
  choice: ang bahagi ... na nauukol sa akin
  rationale: Ipinapahayag ng ἐπιβάλλον ang bahaging napapasa, nababagay, o dapat mapunta sa isang tao. Pinananatili ng sugnay na ito ang diwa ng karampatang bahagi nang hindi labis na ginagawang teknikal o legal.
- source_word: οὐσία
  choice: ari-arian
  rationale: Sa konteksto ng paghahati ng mana, tumutukoy ito sa mga pag-aari o yaman. Ang “ari-arian” ay natural at sapat na malawak sa Tagalog.
- source_word: διεῖλεν
  choice: hinati
  rationale: Tuwirang katumbas ng kilos na paghahati o pamamahagi.
- source_word: αὐτοῖς
  choice: sa kanilang dalawa
  rationale: Pormal na “sa kanila,” ngunit malinaw sa konteksto na ang tinutukoy ay ang dalawang anak. Likas sa Tagalog ang “sa kanilang dalawa” at hindi nito binabago ang bilang.
- source_word: βίον
  choice: kanyang kabuhayan
  rationale: Ang βίος ay maaaring tumukoy sa buhay, ikinabubuhay, o mga pag-aaring pantustos sa pamumuhay. Pinananatili ng “kabuhayan” ang masinsing diwang hindi lamang ari-arian kundi ang mismong ikinabubuhay ng ama.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na magalang, natural, at marangal. Ginamit ang “Ama” bilang tuwirang tawag at ang “po ninyo” upang ipakita ang karaniwang paggalang ng anak sa ama. Inilagay ang tanging talababa sa βίον, kung saan may tunay na leksikal na lalim na hindi lubos na maipapaloob sa isang salitang Tagalog.
