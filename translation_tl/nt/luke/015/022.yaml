  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ πατὴρ πρὸς τοὺς δούλους αὐτοῦ· ⸀Ταχὺ ⸀ἐξενέγκατε στολὴν τὴν πρώτην καὶ ἐνδύσατε αὐτόν, καὶ δότε δακτύλιον εἰς τὴν χεῖρα αὐτοῦ καὶ ὑποδήματα εἰς τοὺς πόδας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/022.yaml
  text: But the father said to his servants[a], ‘Quickly, bring out the best robe and put it on him[c][b], and put a ring on his hand and sandals on his feet.’
translation:
  language: tl
  text: Ngunit sinabi ng ama sa kanyang mga alipin[a], “Dali! Ilabas ninyo ang pinakamagandang balabal[b] at isuot ito sa kanya. Lagyan ninyo siya ng isang singsing[c] sa kanyang kamay at ng mga sandalyas sa kanyang mga paa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lingkod.” Ang salitang Griyego na doulous ay tumutukoy sa mga alipin o mga taong nakataling maglingkod sa isang sambahayan.
    reason: alternative_reading
  - marker: b
    text: Literal na “ang unang balabal”; sa kontekstong ito, malamang na nangangahulugang “ang pinakamagandang balabal” o “ang pangunahing balabal.”
    reason: lexical_alternative
  - marker: c
    text: Singsing lamang ang sinasabi ng Griyego. Ipinapalagay ng ilan na ito ay singsing na pantatak na sumasagisag sa naibalik na katayuan, ngunit hindi iyon tahasang tinukoy ng teksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλους
  choice: mga alipin
  rationale: Ang δοῦλος ay karaniwang tumutukoy sa alipin o taong nakataling maglingkod sa isang sambahayan. Pinananatili ng “mga alipin” ang panlipunang kalagayang ipinahihiwatig ng salitang Griyego; inilalahad sa talababa ang mas tradisyonal na “mga lingkod.”
- source_word: Ταχὺ
  choice: Dali!
  rationale: Ginamit itong pang-abay na nag-uutos ng agarang pagkilos. Ang “Dali!” ay maikli, natural, at malinaw na nagpapahayag ng pagmamadali ng ama.
- source_word: ἐξενέγκατε
  choice: Ilabas ninyo
  rationale: Ang pandiwa ay tumutukoy sa pagdadala ng isang bagay mula sa loob, gaya ng mula sa bahay o imbakan. Ang “ilabas ninyo” ay tiyak at likas sa Tagalog.
- source_word: στολὴν τὴν πρώτην
  choice: ang pinakamagandang balabal
  rationale: Bagaman maaaring literal na “ang unang balabal,” malamang na ang πρῶτος dito ay nangangahulugang pangunahin o pinakamainam. Ang “pinakamagandang balabal” ay malinaw at natural, habang pinananatili ang uri ng kasuutang tinutukoy.
- source_word: ἐνδύσατε αὐτόν
  choice: isuot iyon sa kanya
  rationale: Ang pandiwa ay nangangahulugang damitan ang isang tao. Dahil nabanggit na ang balabal, malinaw at natural ang “isuot iyon sa kanya.”
- source_word: δακτύλιον
  choice: isang singsing
  rationale: Singsing lamang ang tahasang sinasabi ng pangngalan; hindi nito tinitiyak na iyon ay isang singsing na pantatak.
- source_word: εἰς τὴν χεῖρα αὐτοῦ
  choice: sa kanyang kamay
  rationale: Sa konteksto ng pagsusuot ng palamuti, ang εἰς ay natural na isinasalin bilang “sa.”
- source_word: ὑποδήματα
  choice: mga sandalyas
  rationale: Tumutukoy ito sa kasuotang panpaa, lalo na sa mga sandalyas sa sinaunang daigdig ng Mediteraneo. Mas tiyak ito sa kasaysayan kaysa sa pangkalahatang “sapatos.”
- source_word: εἰς τοὺς πόδας
  choice: sa kanyang mga paa
  rationale: Ang pariralang ito ay likas na tumutukoy sa paglalagay o pagsusuot ng sandalyas sa mga paa.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang bahagyang pagsalungat o paglipat mula sa sinabi ng anak tungo sa agarang utos ng ama. Ang “Ngunit” ay malinaw na nagmamarka sa pagbabagong ito.
theological_decisions:
- issue: Kung isasalin ang δούλους bilang “mga alipin” o “mga lingkod”
  choice: mga alipin
  alternative: mga lingkod
  rationale: Mas tuwirang pinananatili ng “mga alipin” ang nakataling kalagayan ng mga manggagawa sa sambahayan nang hindi nagdaragdag ng teolohikal na pagpapakahulugan.
- issue: Kung literal na “unang balabal” o idyomatikong “pinakamagandang balabal” ang στολὴν τὴν πρώτην
  choice: ang pinakamagandang balabal
  alternative: ang unang balabal; ang pangunahing balabal
  rationale: Sa konteksto, malamang na kalidad o ranggo ang tinutukoy ng πρῶτος, hindi ang una sa pagkakasunod-sunod. Inilalagay sa talababa ang literal na anyo upang mapanatili ang tunay na puwang ng kahulugan.
- issue: Kung palalawakin ang δακτύλιον bilang “singsing na pantatak”
  choice: isang singsing
  alternative: isang singsing na pantatak
  rationale: Maaaring ipinahihiwatig ng salaysay ang pagpapanumbalik ng katayuan, ngunit hindi tahasang tinutukoy ng salitang Griyego ang uri ng singsing. Hindi isinasama sa pangunahing teksto ang interpretasyong iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Dali!” upang natural na maipahayag ang agarang utos, at “balabal” at “mga sandalyas” upang mapanatili ang kongkretong sinaunang tagpo. Hindi isiningit sa pangunahing teksto ang simbolikong interpretasyon sa singsing.
