  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εὐφρανθῆναι δὲ καὶ χαρῆναι ἔδει, ὅτι ὁ ἀδελφός σου οὗτος νεκρὸς ἦν καὶ ⸀ἔζησεν, καὶ ⸀ἀπολωλὼς καὶ εὑρέθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/032.yaml
  text: But it was necessary to celebrate and rejoice[a], because this brother of yours was dead and has come to life again[c][b]; he was lost and has been found.
translation:
  language: tl
  text: Ngunit kailangang magdiwang at magsaya,[a] sapagkat ang kapatid mong ito ay patay noon ngunit muling nabuhay;[b] siya ay nawala ngunit natagpuan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ngunit nararapat na magdiwang at magsaya.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “nabuhay”; sa talinghaga, malamang na larawan ito ng pagpapanumbalik.
    reason: lexical_alternative
  - marker: c
    text: O “ngunit natagpuan siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφρανθῆναι
  choice: magdiwang
  rationale: Ipinahahayag nito ang masayang pagdiriwang sa konteksto ng handaan, at natural ito sa makabagong Tagalog.
- source_word: χαρῆναι
  choice: magsaya
  rationale: Pinananatili nito ang ikalawang, halos magkasingkahulugang pahayag ng kagalakan nang hindi inuulit lamang ang unang pandiwa.
- source_word: ἔδει
  choice: kailangan tayong
  rationale: Ipinapakita ng ἔδει ang moral o pangyayaring pangangailangan. Bagaman impersonal ang Griyego, natural sa Tagalog ang may inklusibong paksa, na ipinahihiwatig ng magkasamang pagdiriwang sa tagpo; itinatala sa talababa ang mas impersonal na alternatibo.
- source_word: ὁ ἀδελφός σου οὗτος
  choice: ang kapatid mong ito
  rationale: Pinananatili ang demonstratibong οὗτος at ang mariing paalala ng ama tungkol sa ugnayan ng magkapatid.
- source_word: νεκρὸς ἦν
  choice: patay noon
  rationale: Tuwirang pinananatili ang larawan ng kamatayan, habang ipinakikita ng “noon” ang dating kalagayan.
- source_word: ἔζησεν
  choice: muling nabuhay
  rationale: Natural na katapat sa Tagalog ng pagsalungat sa “patay noon”; pinananatili nito ang matalinghagang lakas ng kamatayan at buhay nang hindi ito ginagawang paliwanag lamang tungkol sa pagpapanumbalik.
- source_word: ἀπολωλὼς
  choice: nawala
  rationale: Ipinahahayag ang kalagayang ‘lost’ sa paraang simple at likas sa konteksto ng talinghaga.
- source_word: εὑρέθη
  choice: natagpuan
  rationale: Tapat na pasibong anyo na angkop sa pangwakas na pagsalungat sa “nawala.”
theological_decisions:
- issue: Kung gagawing tahasan na ang ἔζησεν ay tumutukoy sa pagpapanumbalik sa halip na literal na pagkabuhay
  choice: Pinanatili ang larawang “muling nabuhay.”
  alternative: “nanumbalik ang buhay” o isang paliwanag na “naibalik sa atin”
  rationale: Matalinghaga ang kamatayan at buhay sa takbo ng talinghaga, ngunit hindi dapat alisin ng salin ang mismong larawan o tahimik na lutasin ang teolohikal na tensiyon nito.
- issue: Lakas ng ἔδει
  choice: “kailangan”
  alternative: “nararapat”
  rationale: Mas malinaw na pinananatili ng “kailangan” ang diwa ng pangangailangan o obligasyon; gayunman, tunay na posibilidad ang “nararapat,” kaya inilagay ito sa talababa.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinanatili ang magkapares na pahayag na “magdiwang at magsaya,” “patay…muling nabuhay,” at “nawala…natagpuan.”
