id: LUK.15.7
reference: Luke 15:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι οὕτως χαρὰ ⸂ἐν τῷ οὐρανῷ ἔσται⸃ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/007.yaml
  text: I tell you[b][a], in the same way there will be joy in heaven over one sinner who has a change of mind than over ninety-nine righteous people who have no need of one.
translation:
  language: tl
  text: 'Sinasabi ko sa inyo: sa gayon ding paraan[a], magkakaroon ng kagalakan sa langit dahil sa isang makasalanang nagsisisi, higit kaysa sa siyamnapu’t siyam na matuwid[b] na hindi nangangailangang magsisi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa ganitong paraan” o “gayon.” Iniuugnay ng parirala ang kagalakan sa langit sa punto ng naunang talinghaga.
    reason: lexical_alternative
  - marker: b
    text: “Matuwid” ang tahasang sinasabi ng teksto. Maaaring unawain ito nang tuwiran o may kabalintunaan ayon sa konteksto; hindi ipinapasiya ng salin kung alin ang ibig sabihin.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Sinasabi ko sa inyo
  rationale: Likas at tuwirang pormula sa modernong Tagalog na pinananatili ang tahasang pakikipag-usap at mariing pahayag.
- source_word: οὕτως
  choice: sa gayunding paraan
  rationale: Malinaw na iniuugnay ang makalangit na kagalakan sa punto ng naunang talinghaga.
- source_word: χαρὰ ἐν τῷ οὐρανῷ ἔσται
  choice: magkakaroon ng kagalakan sa langit
  rationale: Natural sa Tagalog at pinananatili ang panghinaharap na diwa at ang langit bilang kinaroroonan ng kagalakan, nang hindi tinutukoy kung sino mismo ang nagagalak.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: dahil sa isang makasalanan
  rationale: Sa kaugnayan nito sa χαρά, ipinahihiwatig ng ἐπί ang sanhi o okasyon ng kagalakan; natural itong ipahayag sa Tagalog bilang “dahil sa.”
- source_word: μετανοοῦντι
  choice: nagsisisi
  rationale: Karaniwan, natural, at tumpak na salin sa kontekstong tumutukoy sa isang makasalanang tumatalikod sa kasalanan; pinananatili rin nito ang aktibong diwa ng kasalukuyang pandiwaring Griyego.
- source_word: ἢ
  choice: higit kaysa
  rationale: Sa kontekstong naghahambing ng antas ng kagalakan, nililinaw ng pariralang ito ang paghahambing na ipinahihiwatig ng Griyego.
- source_word: ἐνενήκοντα ἐννέα δικαίοις
  choice: siyamnapu’t siyam na matuwid
  rationale: Ang pang-uring δικαίοις ay tumutukoy sa mga tao. Sapat at natural sa Tagalog ang paggamit ng “matuwid” bilang pangngalang tumutukoy sa mga taong iyon.
- source_word: οἵτινες οὐ χρείαν ἔχουσιν μετανοίας
  choice: na hindi nangangailangang magsisi
  rationale: Natural na ipinapahayag sa Tagalog ang Griyegong nominal na parirala habang tahasang pinananatili ang diwa ng μετάνοια.
theological_decisions:
- issue: Kung ang “matuwid” ay tumutukoy sa tunay na matuwid o ginagamit nang may kabalintunaan para sa mga nag-aakalang matuwid sila
  choice: Pinanatili ang tuwirang salitang “matuwid” nang hindi ipinapaliwanag sa pangunahing teksto kung ito ay ironiko.
  alternative: “mga nag-aakalang matuwid sila” o paglalagay ng panipi sa “matuwid”
  rationale: δικαίοις ang tahasang salita ng Griyego at walang hayagang tanda ng ironiya. Pinananatili ng salin ang interpretatibong tensiyon sa konteksto.
- issue: Kung sino ang nakadarama o nagpapahayag ng kagalakan sa langit
  choice: “magkakaroon ng kagalakan sa langit”
  alternative: “magagalak ang Diyos” o “magagalak ang mga anghel sa langit”
  rationale: Lokasyon ng kagalakan ang tahasang sinasabi ng talata, hindi ang partikular na mga gumaganap. Hindi dapat idagdag mula sa talata 10 ang isang paksang hindi binanggit rito.
- issue: Lakas ng paghahambing sa ἢ
  choice: “higit kaysa”
  alternative: “kaysa” o literal na “o”
  rationale: Ipinahihiwatig ng pangungusap ang mas malaking kagalakan para sa isang nagsisisi. Nililinaw ng “higit kaysa” ang natural na paghahambing nang hindi binabago ang dalawang pinaghahambing.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “nagsisisi” bilang natural na panrelihiyon ngunit karaniwang salita, at iniwasang magdagdag ng tiyak na teolohikal na paksa sa kagalakang “sa langit.”
