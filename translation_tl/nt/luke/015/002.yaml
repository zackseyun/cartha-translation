  yaml_path: translation/nt/luke/015/002.yaml
  text: And both the Pharisees and the scribes were grumbling[a], saying, “This man welcomes sinners and eats with them.”
translation:
  language: tl
  text: 'Kapuwa ang mga Pariseo at ang mga eskriba ay nagbubulung-bulungan: “Tinatanggap ng taong ito ang mga makasalanan at nakikisalo sa kanila.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεγόγγυζον
  choice: patuloy na nagbulung-bulungan
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang nagpapatuloy o paulit-ulit na pagkilos. Pinananatili ng “nagbulung-bulungan” ang diwang mapanuring pag-ungol o pagrereklamo na hindi lubos na nahuhuli ng payak na “nagreklamo.”
- source_word: οἵ τε Φαρισαῖοι καὶ οἱ γραμματεῖς
  choice: kapuwa ang mga Pariseo at ang mga eskriba
  rationale: Ipinakikita ng “kapuwa ... at ...” ang ugnayang τε ... καί. Ginamit ang kinikilalang katawagang “mga eskriba” para sa γραμματεῖς nang hindi nililimitahan ang kanilang papel sa isang paliwanag lamang gaya ng “mga tagapagturo.”
- source_word: λέγοντες
  choice: Sabi nila
  rationale: Ginawang hiwalay na likas na pangungusap sa Filipino ang kasabay na participle upang maging malinaw kung sino ang nagsasalita, habang nananatiling kaugnay ito ng kanilang patuloy na pagbubulung-bulungan.
- source_word: Οὗτος
  choice: ng taong ito
  rationale: Pinananatili ng “taong ito” ang bahagyang mapanghamak o mapaglayong himig ng demonstratibo, na mawawala sa mas neutral na “siya.”
- source_word: ἁμαρτωλοὺς
  choice: ang mga makasalanan
  rationale: Tuwirang inilalarawan ng substantibong pang-uri ang kinikilalang panlipunan at panrelihiyong pangkat sa paratang.
- source_word: προσδέχεται
  choice: tinatanggap
  rationale: Likas at malinaw sa modernong Filipino ang “tinatanggap” para sa kusang pagtanggap sa mga tao. Hindi ito dinagdagan ng salitang maaaring magpalabis sa emosyonal na himig ng pandiwa.
- source_word: συνεσθίει αὐτοῖς
  choice: kumakain siyang kasama nila
  rationale: Tuwirang ipinahahayag nito ang pakikisalo sa pagkain at pinananatili ang panlipunang bigat ng pakikisamang nasa teksto nang walang dagdag na pagpapakahulugan.
theological_decisions:
- issue: Ang panlipunan at teolohikal na bigat ng pakikisama ni Jesus sa mga makasalanan
  choice: 'Tuwirang isinalin ang paratang: tinatanggap niya ang mga makasalanan at kumakain kasama nila.'
  alternative: Malugod niyang tinatanggap ang mga makasalanan at nakikisalo sa kanila.
  rationale: Pinananatili ng salin ang eskandalong ipinahihiwatig ng pagtanggap at pakikisalo nang hindi nagdaragdag ng paliwanag tungkol sa motibo ni Jesus o sa kalagayang espirituwal ng mga tinawag na “makasalanan.”
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Pinanatili ang tradisyonal ngunit karaniwang katawagang “Pariseo” at “eskriba.” Hinati sa dalawang pangungusap ang Griyegong estruktura upang maging natural sa Filipino nang hindi binabago ang lohikal na ugnayan.
