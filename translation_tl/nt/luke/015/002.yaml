  naturalness: Mas natural at tuwiran ang paggamit ng tutuldok upang iugnay ang kanilang pagbubulung-bulungan sa mismong sinasabi nila. Ang «nakikisalo sa kanila» ay likas na pagpapahayag ng pagkain kasama ng iba at pinananatili ang implikasyon ng pakikisalo sa hapag.
  terminology: Ang «mga Pariseo,» «mga eskriba,» at «mga makasalanan» ay angkop na mga katawagan sa modernong Filipino Tagalog. Ang «taong ito» ay angkop na katumbas ng bahagyang mapanghamak o mapaglayong Οὗτος. Walang kailangang talababang leksikal sa Filipino para sa talatang ito.
