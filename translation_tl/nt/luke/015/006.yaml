  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὸν οἶκον συγκαλεῖ τοὺς φίλους καὶ τοὺς γείτονας, λέγων αὐτοῖς· Συγχάρητέ μοι ὅτι εὗρον τὸ πρόβατόν μου τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/006.yaml
  text: And when he comes into the house[a], he calls together his friends and neighbors, saying to them, ‘Rejoice with me[c][b], because I have found my sheep that was lost.’
translation:
  language: tl
  text: Pagpasok niya sa bahay[a], tinatawag niyang magtipon ang kanyang mga kaibigan at mga kapitbahay at sinasabi sa kanila, ‘Makipagsaya kayo sa akin[b], sapagkat natagpuan ko na ang aking tupang nawala[c].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pag-uwi niya.” Sa Griyego, literal na “pagpasok niya sa bahay.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Makigalak kayo sa akin.” Ang pandiwa sa Griyego ay tumutukoy sa pakikibahagi sa kagalakan ng iba.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ang nawala kong tupa.” Sa Griyego, literal na “ang aking tupa, ang nawala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν εἰς τὸν οἶκον
  choice: pagdating niya sa bahay
  rationale: Likas na temporal na pagsasalin ng aorist participle; pinananatili ng “sa bahay” ang kongkretong εἰς τὸν οἶκον nang hindi ipinapalagay na sarili niyang tahanan iyon.
- source_word: συγκαλεῖ
  choice: tinatawag niyang magtipon
  rationale: Ipinahahayag ang diwang pagtawag upang magsama-sama, at mas natural sa makabagong Filipino kaysa sa literal na “sabay-sabay niyang tinatawag.”
- source_word: τοὺς φίλους καὶ τοὺς γείτονας
  choice: ang kanyang mga kaibigan at mga kapitbahay
  rationale: Tuwiran at karaniwang katumbas ng dalawang pangkat sa kontekstong panlipunan.
- source_word: λέγων αὐτοῖς
  choice: at sinasabi sa kanila
  rationale: Natural na inuugnay sa pangunahing kilos at pinananatili ang aspektong ipinakikita ng present participle.
- source_word: Συγχάρητέ μοι
  choice: Makipagsaya kayo sa akin
  rationale: Naipakikita ang pagbabahagi ng tuwa na nasa συγχαίρω. Ang “makipagsaya” ay malinaw at natural, samantalang ang “makigalak” ay mas pormal na alternatibo.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng paanyaya; ang “sapagkat” ay marangal ngunit nauunawaan pa rin sa modernong Filipino.
- source_word: εὗρον
  choice: natagpuan ko na
  rationale: Ang “na” ay natural na naghahayag ng natapos na paghahanap at ng kasalukuyang bunga nito, nang hindi ginagawang tahasang present perfect ang aspektong aorist.
- source_word: τὸ πρόβατόν μου τὸ ἀπολωλός
  choice: ang aking tupang nawala
  rationale: 'Pinananatili ang konkretong larawan at ang bahagyang mas buong article-plus-participle construction: ang tupa niya, ang nawala. Natural din ito sa Filipino.'
theological_decisions:
- issue: Parabolic imagery of recovery
  choice: ang aking tupang nawala
  alternative: ang nawawala kong tupa
  rationale: Pinananatili ang larawan ng tupa at hindi isinasalin agad bilang makasalanan o kaligtasan. Iniiwasan din ng “nawala” ang posibleng pahiwatig ng “nawawala” na maaaring hindi pa ito natatagpuan.
- issue: Ownership or relationship expressed by μου
  choice: aking tupa
  alternative: tupang pag-aari ko
  rationale: Ang payak na panghalip na paari ang sapat na katumbas at hindi dinaragdagan ang teksto ng diin sa legal na pagmamay-ari.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “tupa,” “kapitbahay,” at “makipagsaya” bilang karaniwang bokabularyo; ang “sapagkat” ay nagbibigay ng bahagyang pormal na himig na angkop sa Kasulatan. Ang lahat ng talababa ay may katugmang marker sa pangunahing teksto.
