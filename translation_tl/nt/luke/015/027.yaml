  yaml_path: translation/nt/luke/015/027.yaml
  text: He said to him[a], “Your brother has come, and your father slaughtered the fattened calf, because he received him back safe and sound.”
translation:
  language: tl
  text: Sinabi niya sa kanya, “Dumating na ang kapatid mo, at ipinakatay ng iyong ama ang pinatabang guya dahil natanggap niya siyang muli na ligtas at maayos[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na malusog.” Ang salitang Griyego ay maaaring mangahulugang nasa mabuting kalusugan o, sa kontekstong ito, ligtas at maayos ang kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥκει
  choice: dumating na
  rationale: 'Ipinahihiwatig ng pandiwa ang pagdating na may kasalukuyang bunga: narito na ngayon ang kapatid.'
- source_word: ἔθυσεν
  choice: ipinakatay
  rationale: Sa konteksto ng handaan, tumutukoy ito sa pagkatay ng hayop para sa pagkain; iniiwasan ng salin ang pahiwatig ng pormal na paghahandog.
- source_word: μόσχον τὸν σιτευτόν
  choice: ang pinatabang guya
  rationale: Natural at tumpak itong tawag sa guyang sadyang pinataba at inilaan para sa isang natatanging handaan.
- source_word: ὑγιαίνοντα
  choice: ligtas at maayos
  rationale: Saklaw nito ang pagiging malusog o nasa mabuting kalagayan, at sa konteksto ng pagbabalik ay natural na nagpapahayag na nakauwi siyang walang masamang nangyari.
- source_word: ἀπέλαβεν
  choice: natanggap niya itong muli
  rationale: Pinananatili nito ang diwa ng pagtanggap pabalik o muling pagkamit sa isang taong nawala.
- source_word: ὁ δὲ εἶπεν αὐτῷ ὅτι
  choice: Sinabi niya sa kanya,
  rationale: Ang δέ ay banayad na pang-ugnay at hindi kailangang tahasang isalin; ipinakikilala ng ὅτι ang tuwirang sinabi.
