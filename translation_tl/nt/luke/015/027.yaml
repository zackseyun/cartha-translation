translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “ipinakatay” upang ipakitang ang ama ang nag-utos o nagpagawa ng pagkatay, gaya ng karaniwang ipinahihiwatig ng konteksto, at ang “ligtas at maayos” upang mapanatili ang mas malawak na saklaw ng ὑγιαίνοντα.
