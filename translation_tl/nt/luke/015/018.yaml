id: LUK.15.18
reference: Luke 15:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀναστὰς πορεύσομαι πρὸς τὸν πατέρα μου καὶ ἐρῶ αὐτῷ· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/018.yaml
  text: I will get up and go to my father[a], and I will say to him, ‘Father[b], I have sinned against heaven and before you,’
translation:
  language: tl
  text: Babangon ako at pupunta sa aking ama, at sasabihin ko sa kanya, ‘Ama, nagkasala ako laban sa langit[a] at sa harap mo[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “laban sa Diyos”; malamang na ang “langit” dito ay isang magalang na paraan ng pagtukoy sa Diyos.
    reason: lexical_alternative
  - marker: b
    text: O “sa iyong paningin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: Babangon ako
  rationale: Ang aorist participle ay nagsasaad ng unang hakbang sa pasiya ng anak bago siya pumunta. Ang pag-uugnay bilang dalawang pandiwang nasa hinaharap—“Babangon ako at pupunta”—ay natural sa Tagalog at pinananatili ang konkretong kilos.
- source_word: πορεύσομαι
  choice: pupunta
  rationale: Tumutukoy ito sa pagkilos patungo sa ama. Ang “pupunta” ang pinakanatural at malinaw sa konteksto.
- source_word: πρὸς τὸν πατέρα μου
  choice: sa aking ama
  rationale: Ang πρός na may accusative ay nagsasaad ng pagkilos patungo sa isang tao; natural itong isalin na “sa aking ama.”
- source_word: ἐρῶ αὐτῷ
  choice: sasabihin ko sa kanya
  rationale: Pinananatili nito ang payak na kahulugan ng pandiwang λέγω at ang di-tuwirang layon.
- source_word: Πάτερ
  choice: Ama
  rationale: Ito ay tuwirang tawag sa ama. Hindi idinagdag ang “aking” sapagkat wala iyon sa anyong vocative ng Griyego.
- source_word: ἥμαρτον
  choice: nagkasala ako
  rationale: Ang payak na aspektong perpektibo ng “nagkasala” ay natural na pahayag ng pag-amin sa Tagalog at nagpapahiwatig ng nagawang kasalanang kinikilala ngayon.
- source_word: εἰς τὸν οὐρανὸν
  choice: laban sa langit
  rationale: Pinananatili ang mismong larawang “langit,” na malamang ay magalang na di-tuwirang pagtukoy sa Diyos, sa halip na tahasang palitan ito ng interpretasyong “Diyos.”
- source_word: ἐνώπιόν σου
  choice: sa harap mo
  rationale: Ang ἐνώπιον ay nangangahulugang nasa harapan o paningin ng isang tao. Pinananatili ng “sa harap mo” ang naiibang pananalita nito sa halip na gawing ikalawang “laban sa iyo.”
theological_decisions:
- issue: Kung tahasang papalitan ng “Diyos” ang “langit” sa pangunahing teksto
  choice: 'Panatilihin ang “langit”: “nagkasala ako laban sa langit”'
  alternative: nagkasala ako laban sa Diyos
  rationale: οὐρανός ang ginamit ng Griyego at malamang na nagsisilbing magalang na di-tuwirang pagtukoy sa Diyos. Ang pagpapanatili sa “langit” ay tapat sa ekspresyon ng pinagmulan at hindi agad nilulutas ang pahiwatig nito.
- issue: Kung gagawing “laban sa iyo” ang ἐνώπιόν σου
  choice: sa harap mo
  alternative: laban sa iyo
  rationale: Bagaman malinaw na kinikilala ng anak ang kasalanan niya sa ama, literal na naiiba ang ikalawang parirala sa “laban sa langit.” Pinananatili ng “sa harap mo” ang relasyonal at posibleng panghukumang himig nang hindi pinag-iisa ang dalawang parirala.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “aking ama” at “Ama” sa halip na mas kolokyal na “tatay” upang mapanatili ang dignidad ng salaysay. Inilagay ang mga panandang [a] at [b] sa mismong mga pariralang nililinaw ng mga talababa.
