  text: His older son was in the field; and as he came and drew near to the house[a], he heard music and dancing,
translation:
  language: tl
  text: Samantala, nasa bukid ang nakatatanda niyang anak. Nang papalapit na siya sa bahay, narinig niya ang tugtugan at sayawan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tugtog ng mga instrumento at mga mananayaw.” Ang mga salitang Griyego ay maaari ring tumukoy nang mas tiyak sa pagtatanghal ng musika at sa mga pangkat ng mananayaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: noon
  rationale: Minamarkahan ng δέ ang paglipat ng salaysay; ipinahihiwatig ng “noon” ang kalagayan sa sandaling iyon nang hindi nagdaragdag ng matinding pagsalungat.
- source_word: ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος
  choice: ang nakatatanda niyang anak
  rationale: Ang πρεσβύτερος ay pahambing na “nakatatanda,” hindi kinakailangang “panganay”; natural ito sa modernong Tagalog at pinananatili ang paghahambing sa nakababatang anak.
- source_word: ἐν ἀγρῷ
  choice: nasa bukid
  rationale: Tuwirang tumutukoy ang ἀγρός sa bukid o lupang sakahan.
- source_word: ὡς ἐρχόμενος
  choice: habang pauwi ito
  rationale: Ipinapakita ng participle ang kasabay at nagpapatuloy na paglapit; nililinaw ng konteksto ng paglapit sa bahay na siya ay pauwi.
- source_word: ἤγγισεν τῇ οἰκίᾳ
  choice: papalapit sa bahay
  rationale: Natural na inilalarawan nito ang unti-unting paglapit sa bahay, ayon sa kahulugan ng ἐγγίζω.
- source_word: ἤκουσεν
  choice: narinig nito
  rationale: Payak na salaysay ang aorist; walang kailangang idagdag na kahulugang “nagsimulang makarinig.”
- source_word: συμφωνίας
  choice: tugtugan
  rationale: Sa konteksto, tumutukoy ito sa musika o tunog ng mga instrumentong pangmusika; ang “tugtugan” ay malinaw, natural, at hindi anakronistikong gaya ng “simponiya.”
- source_word: χορῶν
  choice: sayawan
  rationale: Maaaring tumukoy ang χορός sa pagsasayaw o sa pangkat ng mga mananayaw; ang “sayawan” ay natural na paglalarawan sa nagaganap habang pinananatili ang saklaw ng kahulugan.
