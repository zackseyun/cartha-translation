translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “ito/nito” upang maiwasan ang pag-uulit at mapanatiling malinaw na ang nakatatandang anak ang tinutukoy. Inilagay ang talababa pagkatapos ng buong pariralang “tugtugan at sayawan,” na siyang saklaw ng leksikal na alternatibo.
