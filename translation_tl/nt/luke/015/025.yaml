  source_fidelity: Kailangang alisin ang “pauwi,” dahil ang ὡς ἐρχόμενος ay nagsasaad lamang na siya ay dumarating/lumalapit at hindi tahasang nagsasabing pauwi siya. Ang natitirang diwa—nakatatandang anak sa bukid, paglapit sa bahay, at pagkarinig ng musika at sayawan—ay tapat sa Griyego.
  naturalness: Natural at marangal sa modernong Filipino ang “Samantala, nasa bukid ang nakatatanda niyang anak. Nang papalapit na siya sa bahay, narinig niya ang tugtugan at sayawan.” Mas idiomatiko rin ang “narinig niya” kaysa sa paulit-ulit na “nito.”
  terminology: Ang “nakatatanda niyang anak,” “bukid,” “tugtugan,” at “sayawan” ay angkop. Pinananatili ng talababa ang leksikal na posibilidad na mas tiyak na instrumental ang μουσική/συμφωνία at maaaring mga mananayaw ang χοροί.
