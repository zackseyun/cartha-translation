base_translation:
  language: en
  yaml_path: translation/nt/luke/015/031.yaml
  text: And he said to him[a], ‘Child, you are always with me, and all that is mine is yours.’
translation:
  language: tl
  text: Ngunit sinabi niya sa kanya, “Anak,[a] lagi kang kasama ko, at ang lahat ng sa akin ay sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Anak ko.” Ang salitang Griyego ay isang magiliw na pantawag sa anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: Anak
  rationale: Ang bokatibong τέκνον ay isang magiliw na pantawag sa loob ng pamilya. Likas sa modernong Tagalog ang “Anak” at hindi na kailangang idagdag ang panghalip na “ko,” na wala sa Griyego.
- source_word: πάντοτε
  choice: lagi
  rationale: Tuwirang ipinapahayag ng “lagi” ang diwa ng πάντοτε at natural ito sa kasalukuyang Tagalog.
- source_word: μετ’ ἐμοῦ
  choice: kitang kasama
  rationale: Ipinapahayag nito ang pakikisama o pagiging kapiling na tinutukoy ng μετά na may genitive, sa natural na ayos ng Tagalog.
- source_word: πάντα τὰ ἐμὰ
  choice: ang lahat ng sa akin
  rationale: Pinananatili nito ang malawak at sumasaklaw na pagtukoy sa lahat ng pag-aari ng ama nang hindi nililimitahan ang kahulugan sa isang tiyak na legal na kategorya.
- source_word: σά ἐστιν
  choice: ay sa iyo
  rationale: Malapit ito sa anyong Griyego at pinananatiling bukas kung ang diin ay pag-aari, karapatan, o ugnayan sa loob ng talinghaga.
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: Ngunit sinabi niya sa kanya
  rationale: Dito, ang δέ ay angkop na ipahayag bilang “Ngunit” dahil ang sagot ng ama ay may banayad na pagsalungat sa reklamo ng nakatatandang anak.
theological_decisions:
- issue: Pantawag ng ama sa nakatatandang anak
  choice: Isalin ang τέκνον bilang “Anak”
  alternative: “Anak ko” o “Iho”
  rationale: Ang “Anak” ay magiliw at pampamilya ngunit hindi nagdaragdag ng tahasang panghalip na pag-aari. Ang “Iho” ay tahasang panlalaki at maaaring magdala ng mas tiyak na rehiyonal o panlipunang himig kaysa sa Griyego.
translation_notes:
  register: Modernong, dignificado, at madaling maunawaang Tagalog. Ginamit ang karaniwang “Anak” sa halip na mas pormal o rehiyonal na pantawag; pinanatili ang banayad na kaibahan sa sagot ng ama sa pamamagitan ng “Ngunit.”
