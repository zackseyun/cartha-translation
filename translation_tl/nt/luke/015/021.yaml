  text: εἶπεν δὲ ⸂ὁ υἱὸς αὐτῷ⸃· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου, ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/021.yaml
  text: But the son said to him[a], ‘Father, I have sinned against heaven and before you[b]. I am no longer worthy to be called your son.’
translation:
  language: tl
  text: Ngunit sinabi ng anak sa kanya, “Ama, nagkasala ako laban sa langit[a] at sa harap mo. Hindi na ako karapat-dapat na tawaging anak mo.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “laban sa langit” ay isang mapitagang paraan ng pagtukoy sa pagkakasala laban sa Diyos; isinasalin ito ng ilan bilang “laban sa Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Ipinagpapatuloy ng ilang manuskrito ang sinabi ng anak sa mga salitang katumbas ng “Ituring mo akong gaya ng isa sa iyong mga upahang manggagawa,” gaya ng nasa talata 19. Sa tekstong SBLGNT, nagtatapos dito ang kanyang sinabi.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Ngunit sinabi
  rationale: Ang δέ ay banayad na pang-ugnay. Ang “Ngunit” ay angkop sa pagbaling ng salaysay tungo sa pagtatapat ng anak, nang hindi pinalalabis ang pagsalungat.
- source_word: ὁ υἱὸς αὐτῷ
  choice: sinabi sa kanya ng anak
  rationale: Pinananatili nito ang “ang anak” at ang panghalip na αὐτῷ (“sa kanya”), habang gumagamit ng likas na ayos ng pangungusap sa Tagalog.
- source_word: Πάτερ
  choice: Ama
  rationale: Tuwirang salin ito ng bokatibong πατήρ. Hindi idinagdag ang “ko,” na wala sa Griyego.
- source_word: ἥμαρτον
  choice: nagkasala ako
  rationale: Likas itong pahayag ng pagtatapat sa Tagalog at ipinahahayag ang nagawang kasalanang kinikilala ng nagsasalita sa kasalukuyan.
- source_word: εἰς τὸν οὐρανὸν
  choice: laban sa langit
  rationale: Pinananatili ang tahasang salitang “langit” at ang diwa ng pagkakasala laban dito, sa halip na ipalit sa pangunahing teksto ang interpretibong “laban sa Diyos.”
- source_word: καὶ ἐνώπιόν σου
  choice: at sa harapan mo
  rationale: Ang ἐνώπιον ay “sa harap” o “sa presensiya.” Pinananatili ng “sa harapan mo” ang larawang ito at ang personal na pananagutan nang hindi ito awtomatikong ginagawang “laban sa iyo.”
- source_word: οὐκέτι
  choice: hindi na
  rationale: Ito ang karaniwan at likas na katumbas sa makabagong Tagalog.
- source_word: ἄξιος
  choice: karapat-dapat
  rationale: Tumpak nitong ipinahahayag ang moral at relasyonal na diwa ng pagiging marapat sa konteksto ng pagsisisi.
- source_word: κληθῆναι
  choice: tawaging
  rationale: Likas at tuwirang salin ito ng pasibong pawatas ng καλέω.
- source_word: υἱός σου
  choice: anak mo
  rationale: Pinananatili nito ang ugnayang pampamilya at ang katayuang inaamin ng nagsasalita na hindi na siya karapat-dapat taglayin.
theological_decisions:
- issue: Kahulugan ng “langit” sa pagtatapat
  choice: Panatilihin sa teksto ang “laban sa langit” bilang mapitagang di-tuwirang pagtukoy sa pagkakasala laban sa Diyos.
  alternative: Isalin nang interpretibo bilang “laban sa Diyos.”
  rationale: Tahasan sa Griyego ang “langit.” Ang literal na anyo ay nagpapanatili sa idyoma at sa pagkakabukas nito sa paliwanag, sa halip na ipasok agad ang interpretasyon sa pangunahing teksto.
- issue: Hangganan ng sinabi ng anak sa talatang ito
  choice: Tapusin ang sinabi sa “anak mo,” ayon sa tekstong SBLGNT.
  alternative: Idagdag ang “Ituring mo akong gaya ng isa sa iyong mga upahang manggagawa,” ayon sa ilang manuskrito at sa anyong nasa talata 19.
  rationale: Dito nagtatapos ang ibinigay na tekstong Griyego. Inilalahad sa talababa ang mas mahabang anyo nang hindi ito ipinapasok sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang likas na ayos na “sinabi sa kanya ng anak,” habang pinananatili ang mahahalagang pahiwatig ng Griyego. Ang “sa harapan mo” ay bahagyang pormal ngunit madaling maunawaan at angkop sa taimtim na pagtatapat.
