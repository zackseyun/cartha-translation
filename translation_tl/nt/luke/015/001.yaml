id: LUK.15.1
reference: Luke 15:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ⸂αὐτῷ ἐγγίζοντες⸃ πάντες οἱ τελῶναι καὶ οἱ ἁμαρτωλοὶ ἀκούειν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/001.yaml
  text: All the tax collectors and sinners were drawing near to him to hear him[a].
translation:
  language: tl
  text: Patuloy na lumalapit sa kanya ang lahat ng mga maniningil ng buwis at mga makasalanan upang makinig sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “paulit-ulit na lumalapit sa kanya.” Ang anyo ng pandiwa sa Griyego ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na paglapit.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ ... ἐγγίζοντες
  choice: Patuloy na lumalapit
  rationale: Ang periphrastic na anyo na ἦσαν kasama ng kasalukuyang participle na ἐγγίζοντες ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagkilos sa nakaraan. Likas sa salaysay sa Filipino ang aspektong ipinahahayag ng “patuloy na lumalapit,” nang hindi nagdaragdag ng tahasang panandang-panahon para sa δέ.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Tumutukoy kay Jesus sa konteksto at tuwirang katumbas ng datibong layon ng paglapit.
- source_word: πάντες
  choice: ang lahat ng
  rationale: Pinananatili ang diin sa kabuuan ng dalawang grupong tinutukoy.
- source_word: οἱ τελῶναι
  choice: mga maniningil ng buwis
  rationale: Malinaw at karaniwang makabagong Filipino para sa mga nangongolekta ng buwis o kita sa ilalim ng umiiral na pamamahala.
- source_word: οἱ ἁμαρτωλοὶ
  choice: mga makasalanan
  rationale: Pinananatili ang tahasang kategoryang ginamit ng teksto nang walang dagdag na paliwanag tungkol sa kanilang kalagayang panlipunan o moral.
- source_word: ἀκούειν αὐτοῦ
  choice: upang makinig sa kanya
  rationale: Ipinahahayag ng “upang” ang layunin ng paglapit. Mas natural sa Filipino ang “makinig sa kanya” para sa sinasadyang pakikinig sa itinuturo niya.
theological_decisions:
- issue: Panlipunan at panrelihiyong bigat ng “mga maniningil ng buwis at mga makasalanan”
  choice: Pinanatili ang dalawang kategorya nang walang pagpapalawak.
  alternative: mga maniningil ng buwis at iba pang mga itinakwil; mga maniningil ng buwis at mga kilalang makasalanan
  rationale: Dalawang kinikilalang grupo ang tahasang pinangalanan sa Griyego. Ang pagpapaliwanag sa kanila bilang mga itinakwil o kilalang makasalanan sa pangunahing teksto ay magdaragdag ng interpretasyong wala mismo sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patuloy na lumalapit” upang likas na maipahayag ang aspektong nagpapatuloy o paulit-ulit sa salaysay; hindi isinalin ang δέ bilang isang tahasang “ngayon” o “pagkatapos” dahil wala itong kinakailangang tiyak na temporal na kahulugan rito.
