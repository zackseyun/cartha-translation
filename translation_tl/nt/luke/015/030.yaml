  text: ὅτε δὲ ὁ υἱός σου οὗτος ὁ καταφαγών σου τὸν βίον ⸀μετὰ πορνῶν ἦλθεν, ἔθυσας αὐτῷ τὸν ⸂σιτευτὸν μόσχον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/030.yaml
  text: But when this son of yours came[a], the one who devoured your livelihood with prostitutes, you slaughtered the fattened calf for him.
translation:
  language: tl
  text: Pero nang dumating ang anak mong iyan—na inubos ang ari-arian mo kasama ng mga prostituta—nagkatay ka para sa kaniya ng pinatabang guya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inubos ang kabuhayan mo.” Masidhi ang pandiwang Griyego at literal na nangangahulugang “nilamon” o “inubos”; ang pangngalan ay maaaring tumukoy sa kabuhayan, mga pag-aari, o mana.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Pero nang
  rationale: Pinagsasama ang panahong diwa ng ὅτε at ang bahagyang pagsalungat ng δέ; natural ito sa mapanumbat na paghahambing ng nakatatandang anak.
- source_word: ὁ υἱός σου οὗτος
  choice: ang anak mong iyan
  rationale: Pinananatili ang demonstratibong diin at emosyonal na paglayo; hindi niya tinawag na “kapatid ko” ang nakababatang anak.
- source_word: ὁ καταφαγών σου τὸν βίον
  choice: na lumustay sa kabuhayan mo
  rationale: Ang καταφαγών ay masidhing larawan ng pag-ubos o paglamon, samantalang ang βίος dito ay kabuhayan, ari-arian, o ikinabubuhay. Ang “lumustay sa kabuhayan” ay likas sa Filipino at malinaw ang mapanumbat na puwersa.
- source_word: μετὰ πορνῶν
  choice: kasama ng mga bayarang babae
  rationale: Tuwirang ipinahahayag ang paratang tungkol sa mga prostitute sa paraang malinaw, kasalukuyan, at marangal sa modernong Filipino.
- source_word: ἦλθεν
  choice: dumating
  rationale: Hindi idinagdag ang interpretatibong “bumalik”; ang Griyego ay payak na nagsasabing dumating.
- source_word: ἔθυσας
  choice: ipinakatay mo
  rationale: Tumutukoy sa pagkatay ng hayop para sa handaan, hindi sa kultikong paghahandog. Likas din sa konteksto na ipinagawa ng ama ang pagkatay.
- source_word: τὸν σιτευτὸν μόσχον
  choice: ang pinatabang guya
  rationale: Tumpak at likas na katumbas ng guyang sadyang pinataba para sa isang natatanging handaan.
- source_word: αὐτῷ
  choice: para sa kaniya
  rationale: Inilalarawan ang anak bilang pinag-ukulan o pinarangalan sa pagkatay ng guya.
theological_decisions:
- issue: Kung ituturing na pinatunayang pangyayari o paratang lamang ng nakatatandang anak ang sinabi tungkol sa mga bayarang babae
  choice: Tuwirang panatilihin ang paratang sa mismong pananalita ng nakatatandang anak nang walang dagdag na panuring
  alternative: “na diumano’y lumustay” o “pagkatapos lustayin sa mahalay na pamumuhay”
  rationale: Inihaharap ito ng Griyego bilang sinabi ng nakatatandang anak, hindi bilang hiwalay na pagpapatunay ng tagapagsalaysay. Ang tuwirang pagsasalin ay nagpapanatili sa tensiyong pasalaysay nang hindi dinaragdagan o pinagtitibay ang paratang.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “anak mong iyan” upang ipahiwatig ang paghamak at paglayo, at “bayarang babae” bilang tuwiran ngunit hindi lipas na tawag. Ang gitling na em dash ay naghihiwalay sa mapanumbat na paglalarawan nang hindi binabago ang sintaktikong ugnayan.
