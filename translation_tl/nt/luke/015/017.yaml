  to: Ngunit nang matauhan siya[a], sinabi niya, “Napakarami sa mga upahang manggagawa ng aking ama ang may tinapay na higit pa sa kanilang kailangan[b], samantalang ako naman ay napapahamak rito sa gutom[c]!”
  rationale: Pinalitan ang bahagyang di-natural na “Kay dami” ng “Napakarami.” Pinalitan din ang pangunahing “namamatay ako” ng “napapahamak ako” upang hindi masyadong tukuyin ang resulta ng ἀπόλλυμαι; pinanatili ang “namamatay” bilang lehitimong mas matinding alternatibo sa talababa. Walang pagbabago sa kahulugan ng talata.
