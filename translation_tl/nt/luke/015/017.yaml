  yaml_path: translation/nt/luke/015/017.yaml
  text: But when he came to himself[a], he said, ‘How many of my father’s hired workers have more than enough bread[c][b], but here I am perishing from hunger!’
translation:
  language: tl
  text: Ngunit nang matauhan siya[a], sinabi niya, “Napakarami sa mga upahang manggagawa ng aking ama ang may tinapay na higit pa sa kanilang kailangan[b], samantalang ako naman ay napapahamak rito sa gutom[c]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang magbalik ang kanyang ulirat.” Literal sa Griyego, “nang makabalik siya sa kanyang sarili.”
    reason: lexical_alternative
  - marker: b
    text: O “ang may labis-labis na tinapay.”
    reason: lexical_alternative
  - marker: c
    text: O “namamatay ako rito sa gutom.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἑαυτὸν ... ἐλθὼν
  choice: nang matauhan siya
  rationale: Likas na idyomang Filipino ito para sa pagbabalik ng malinaw na kamalayan at matinong pagkilala sa sariling kalagayan. Inilalagay sa talababa ang literal na larawan ng Griyego.
- source_word: ἔφη
  choice: sinabi niya
  rationale: Ang payak na aspektong pasalaysay ng aorist ay natural na ipinahahayag sa Filipino sa ganitong paraan.
- source_word: μίσθιοι
  choice: mga upahang manggagawa
  rationale: Tumutukoy ito sa mga manggagawang binabayaran, hindi sa mga aliping kabilang sa sambahayan.
- source_word: περισσεύονται ἄρτων
  choice: may tinapay na higit pa sa kanilang kailangan
  rationale: Malinaw nitong naipapahayag ang kasaganaan o sobrang panustos na ipinahihiwatig ng περισσεύονται, habang pinananatili ang kongkretong salitang 'tinapay.'
- source_word: ἄρτων
  choice: tinapay
  rationale: Pinananatili ang kongkretong katawagan sa Griyego sa halip na palawakin agad bilang 'pagkain.'
- source_word: λιμῷ
  choice: sa gutom
  rationale: Sa kontekstong ito, ang λιμός ay tumutukoy sa matinding pagkagutom; ang 'sa gutom' ay natural na Filipino para sa sanhi ng kanyang paghihirap.
- source_word: ὧδε
  choice: rito
  rationale: Ipinakikita nito ang kaibahan ng kasalukuyan niyang kalagayan sa saganang kalagayan ng mga manggagawa ng kanyang ama.
- source_word: ἀπόλλυμαι
  choice: namamatay ako
  rationale: Inihahatid nito ang nagpapatuloy at matinding kapahamakang dulot ng gutom. Nasa talababa ang mas malawak na alternatibong 'napapahamak.'
