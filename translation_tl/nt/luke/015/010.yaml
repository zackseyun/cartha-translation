id: LUK.15.10
reference: Luke 15:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὕτως, λέγω ὑμῖν, ⸂γίνεται χαρὰ⸃ ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/010.yaml
  text: In the same way[a], I tell you[b], there is joy before the angels of God over one sinner who repents.
translation:
  language: tl
  text: 'Gayundin[a], sinasabi ko sa inyo: may kagalakan sa harap ng mga anghel ng Diyos dahil sa isang makasalanang nagsisisi.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Gayon” o “Sa gayong paraan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, ang kagalakan ay “sa harap ng mga anghel ng Diyos.” Hindi tahasang sinasabi ng pananalita na ang mga anghel mismo ang nagagalak.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Gayundin
  rationale: Ikinakapit nito ang punto ng naunang talinghaga sa kasalukuyang pahayag at natural na pinananatili ang paghahambing.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Natural at tuwirang salin ng karaniwang pormulang pandiskurso, habang pinananatili ang tahasang pakikipag-usap sa maramihang tagapakinig.
- source_word: γίνεται χαρά
  choice: may kagalakan
  rationale: Ipinapahayag ng γίνομαι rito ang pag-iral o paglitaw ng kagalakan; malinaw at likas sa modernong Tagalog ang 'may kagalakan.'
- source_word: ἐνώπιον
  choice: sa harap ng
  rationale: Pinananatili nito ang kahulugan ng presensiya o kalagayang nagaganap sa harapan ng iba nang hindi itinatakda kung sino mismo ang nagagalak.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: mga anghel ng Diyos
  rationale: Tuwirang salin ito ng pariralang henitibo at natural sa marangal na biblikal na Tagalog.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: dahil sa isang makasalanan
  rationale: Ang ἐπί na may datibo ay tumutukoy sa dahilan o okasyon ng kagalakan; mas natural sa Tagalog ang 'dahil sa' kaysa literal na 'ukol sa.'
- source_word: μετανοοῦντι
  choice: nagsisisi
  rationale: Inilalarawan ng kasalukuyang pandiwaring ito ang makasalanang nagsisisi. Pinananatili ng terminong 'nagsisisi' ang lawak ng konseptong biblikal nang hindi ito nililimitahan sa simpleng pagbabago lamang ng isip.
theological_decisions:
- issue: Kahulugan ng μετάνοια o pagsisisi
  choice: nagsisisi
  alternative: nagbabago ng isip; nanunumbalik
  rationale: Hindi binibigyang-kahulugan nang ganap ng talata ang pagsisisi. Ang 'nagsisisi' ay likas, kinikilalang terminong biblikal, at hindi nagdaragdag ng isang partikular na paliwanag na teolohikal.
- issue: Kinaroroonan o gumagawa ng pagkagalak
  choice: may kagalakan sa harap ng mga anghel ng Diyos
  alternative: nagagalak ang mga anghel ng Diyos; may kagalakan sa gitna ng mga anghel ng Diyos
  rationale: Sinasabi ng Griyego na ang kagalakan ay nagaganap 'sa harap' ng mga anghel, ngunit hindi tahasang tinutukoy na sila mismo ang gumagawa ng pagkagalak. Pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Ginamit ang 'Gayundin' bilang natural na pag-uugnay sa naunang talinghaga at iniwasang gawing tahasang tagaganap ng pagkagalak ang mga anghel.
