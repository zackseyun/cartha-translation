  text: 'So he told them this parable[a], saying:'
translation:
  language: tl
  text: 'Kaya sinabi niya sa kanila ang talinghagang ito[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, may kasunod na participle na literal na “na nagsasabi,” na nagpapakilala sa kasunod na pananalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: sinabi
  rationale: Karaniwang katumbas ito ng aorist ng λέγω at natural na ginagamit kapag ang layon ay isang talinghaga.
- source_word: δὲ
  choice: Kaya
  rationale: Mahinang pang-ugnay ang δέ. Sa konteksto, ipinakikita ng “Kaya” na ang talinghaga ay tugon ni Jesus sa reklamo sa naunang talata nang hindi ito ginagawang matinding pagsalungat.
- source_word: πρὸς αὐτοὺς
  choice: sa kanila
  rationale: Malinaw nitong tinutukoy ang mga taong kinakausap, ayon sa πρός na may accusative.
- source_word: τὴν παραβολὴν ταύτην
  choice: ang talinghagang ito
  rationale: Ang “talinghaga” ang kinikilalang natural na salin ng παραβολή sa kontekstong Sinoptiko, at pinananatili ng “ito” ang demonstrative na ταύτην.
- source_word: λέγων
  choice: tutuldok pagkatapos ng pangungusap
  rationale: Ipinakikilala ng participle ang mismong sasabihin. Sa natural na Tagalog, sapat at mas malinaw ang tutuldok upang ipakilala ang kasunod na tuwirang pananalita; ang pormal na anyo ay inilagay sa talababa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang idiomatikong pangunahing teksto, habang inilalagay sa talababa ang mas pormal na anyong mas malapit sa kayarian ng Griyego.
