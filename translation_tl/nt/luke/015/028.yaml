  text: But he became angry and was unwilling to go in[b][a]. So his father came out and pleaded with him.
translation:
  language: tl
  text: Ngunit nagalit siya at ayaw niyang pumasok.[a] Ngunit lumabas ang kanyang ama at patuloy na nakiusap sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi niya gustong pumasok” o “tumanggi siyang pumasok.”
    reason: lexical_alternative
  - marker: b
    text: Maaari rin itong isalin na “hinikayat siya” o “namanhik sa kanya”; ipinahihiwatig ng anyo ng pandiwa ang nagpapatuloy na pakiusap.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠργίσθη
  choice: nagalit
  rationale: Likas na ipinahihiwatig ng pandiwang nasa aorist dito ang paglitaw ng galit. Ang “nagalit” ay malinaw at hindi kasintindi ng “nagngitngit.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ng unang δέ ang banayad na pagsalungat ng tugon ng nakatatandang anak sa naunang pagdiriwang.
- source_word: οὐκ ἤθελεν εἰσελθεῖν
  choice: ayaw niyang pumasok
  rationale: Ipinahahayag ng θέλω na may infinitive ang kalooban o pagnanais. Ang “ayaw niyang pumasok” ay natural sa makabagong Filipino at hindi labis na nagpapakahulugan na tahasan siyang tumanggi.
- source_word: ὁ δὲ πατὴρ αὐτοῦ
  choice: Kaya … ang kanyang ama
  rationale: Ipinakikilala ng ikalawang δέ ang tugon ng ama. Ang “Kaya” ay natural na nag-uugnay sa kilos ng ama sa ayaw pumasok ng anak, nang hindi nagdaragdag ng doktrinal na paliwanag.
- source_word: ἐξελθὼν
  choice: lumabas
  rationale: Tuwirang inilalarawan ng participle ang paglabas ng ama mula sa kinaroroonan ng pagdiriwang.
- source_word: παρεκάλει
  choice: patuloy na nakiusap sa kanya
  rationale: Ang imperfect na anyo ay maaaring magpahiwatig ng nagpapatuloy o paulit-ulit na pakiusap. Ang “nakiusap” ay taimtim ngunit hindi kasingtindi ng “nagmakaawa.”
- source_word: αὐτόν
  choice: sa kanya
  rationale: Ang panghalip ay tumutukoy sa nakatatandang anak at natural na ipinahahayag bilang layon ng “nakiusap.”
theological_decisions:
- issue: Himig ng pakikiusap ng ama sa talinghaga
  choice: patuloy na nakiusap sa kanya
  alternative: hinikayat siya; namanhik sa kanya
  rationale: Pinananatili nito ang taimtim at nagpapatuloy na pagkilos ng ama tungo sa anak, ngunit hindi nagdaragdag ng partikular na doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “ayaw niyang pumasok” bilang karaniwang pananalita at ang “patuloy na nakiusap” upang maipakita ang aspektong imperfect nang hindi pinalalabis ang himig.
