id: LUK.15.19
reference: Luke 15:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός σου· ποίησόν με ὡς ἕνα τῶν μισθίων σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/019.yaml
  text: I am no longer worthy to be called your son[a]. Make me like one of your hired workers.
translation:
  language: tl
  text: Hindi na ako karapat-dapat tawaging anak mo. Gawin mo akong tulad ng isa sa mga upahang manggagawa mo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isa sa mga bayarang tauhan mo.” Ang salitang Griyego ay tumutukoy sa mga manggagawang binabayaran, hindi sa mga alipin ng sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: Hindi na
  rationale: Likas na modernong Tagalog ito para sa temporal na pagtangging nagpapahiwatig na nagbago na ang dating kalagayan.
- source_word: ἄξιος
  choice: karapat-dapat
  rationale: Pinananatili nito ang diwa ng pagiging nararapat o marapat sa isang katayuan, kabilang ang panlipunan at relasyonal na bigat ng pahayag.
- source_word: κληθῆναι
  choice: tawaging
  rationale: Direktang katumbas ito ng pasibong pawatas at napapanatili ang saklaw na maaaring tumukoy sa pagtawag, pagkilala, o pagturing sa kaniya bilang anak.
- source_word: υἱός
  choice: anak
  rationale: Sa Tagalog, ang “anak” ang karaniwang tiyak na termino para sa relasyong anak-magulang kahit hindi nito minamarkahan ang kasarian; malinaw na lalaki ang nagsasalita mula sa konteksto.
- source_word: ποίησόν
  choice: Gawin mo
  rationale: Pinananatili nito ang tuwirang pakiusap na ilagay siya ng ama sa ibang kalagayan o katayuan, nang hindi pinahihina tungo sa “tratuhin mo.”
- source_word: ὡς
  choice: tulad ng
  rationale: Malinaw nitong ipinahahayag ang paghahambing sa halip na tahasang pagkakakilanlan.
- source_word: ἕνα τῶν μισθίων σου
  choice: isa sa mga upahang manggagawa mo
  rationale: Ang μίσθιος ay bayarang manggagawa, hindi alipin ng sambahayan. Ang “upahang manggagawa” ay natural at malinaw sa modernong Filipino.
theological_decisions:
- issue: Wika ng katayuan sa pagtatapat ng anak
  choice: Panatilihin ang “karapat-dapat” at ang relasyong “anak” nang hindi pinapalambot ang bigat ng dangal, kahihiyan, at katayuan.
  alternative: Hindi na ako nararapat na ituring mong anak.
  rationale: Ipinapahayag ng talata ang tingin ng anak na hindi na siya karapat-dapat sa katayuang anak, hindi lamang isang pangkalahatang pagkadama ng hiya. Ang napiling salin ay hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Paghahambing sa mga bayarang manggagawa
  choice: “tulad ng isa sa”
  alternative: “bilang isa sa”
  rationale: Ang ὡς ay maaaring isalin sa paraang naghahambing; pinananatili ng “tulad ng” ang anyo at bahagyang puwang ng pahayag sa halip na tahasang sabihing hinihiling niyang pormal na hirangin siya bilang isa sa kanila.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “upahang manggagawa” upang malinaw na maibukod ang bayarang trabahador sa alipin o utusang kabilang sa sambahayan. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang tinutukoy nito.
