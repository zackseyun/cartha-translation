source:
  edition: SBLGNT
  text: Τίς ἄνθρωπος ἐξ ὑμῶν ἔχων ἑκατὸν πρόβατα καὶ ⸀ἀπολέσας ⸂ἐξ αὐτῶν ἓν⸃ οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα ἐν τῇ ἐρήμῳ καὶ πορεύεται ἐπὶ τὸ ἀπολωλὸς ἕως εὕρῃ αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/004.yaml
  text: What man among you, having a hundred sheep and losing one of them, does not leave the ninety-nine in the open country and go after the lost one until he finds it?
translation:
  language: tl
  text: Sino sa inyo ang may sandaang tupa at nawalan ng isa sa mga ito ang hindi iniiwan ang siyamnapu’t siyam sa ilang[a] at pumupunta upang hanapin ang nawawalang tupa hanggang sa matagpuan niya ito?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa bukas na lupain” o “sa liblib na lugar.” Ang salitang Griyego ay maaaring tumukoy sa ilang, pastulan, o lugar na kakaunti ang naninirahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἄνθρωπος ἐξ ὑμῶν
  choice: Sino sa inyo
  rationale: Likas sa modernong Tagalog ang retorikal na pambungad na ito. Hindi kailangang tahasang isalin ang ἄνθρωπος bilang “lalaki” dahil ang “sino” ay tumutukoy sa taong kabilang sa mga kausap nang hindi binabago ang kinatawang bisa ng halimbawa.
- source_word: ἔχων ἑκατὸν πρόβατα
  choice: ang may sandaang tupa
  rationale: Direkta at natural na paglalahad ng pagmamay-ari at bilang; ang “sandaan” ay isinusulat na “sandaang” bago ang pangngalan.
- source_word: ἀπολέσας ἐξ αὐτῶν ἓν
  choice: kapag nawala ang isa sa mga iyon
  rationale: Sa kontekstong ito, inilalarawan ng ἀπόλλυμι ang tupang napahiwalay o nawala, hindi sinadyang sirain ng may-ari. Ang “kapag” ay natural na nag-uugnay sa pangyayari sa retorikal na tanong.
- source_word: οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα
  choice: ay hindi iniiwan ang siyamnapu't siyam
  rationale: Pinananatili ang negatibong anyo ng retorikal na tanong, na umaasang sasang-ayon ang tagapakinig.
- source_word: ἐν τῇ ἐρήμῳ
  choice: sa ilang
  rationale: Ang “ilang” ay maikli at dignidad na katumbas ng ἔρημος, ngunit maaari itong mangahulugan ng ilang, liblib, o bukas na lupa; nililinaw sa talababa ang saklaw.
- source_word: πορεύεται ἐπὶ τὸ ἀπολωλός
  choice: hinahanap ang nawawala
  rationale: Ipinahahayag nang natural sa Tagalog ang pagpunta upang tugisin o hanapin ang tupang nasa kalagayang nawawala. Hindi na inuulit ang “tupa” dahil malinaw ang tinutukoy.
- source_word: ἕως εὕρῃ αὐτό
  choice: hanggang sa matagpuan niya ito
  rationale: Pinananatili ang hangganang temporal at ang diin na nagpapatuloy ang paghahanap hanggang matagpuan ang tupa.
theological_decisions:
- issue: Kinatawang pananalita sa ἄνθρωπος na nasa panlalaking isahan
  choice: Sino sa inyo
  alternative: Sinong lalaki sa inyo
  rationale: Bagaman panlalaking isahan ang anyo sa Griyego, hindi karaniwang kailangan ng Tagalog na maglagay ng kasarian sa “sino.” Napananatili nito ang kinatawang halimbawa nang hindi ipinapasok ang tahasang kasariang mas mariin kaysa sa likas na gamit ng pangungusap.
- issue: Kalagayan ng siyamnapu't siyam na iniwan sa ἐρήμῳ
  choice: sa ilang
  alternative: sa bukas na pastulan
  rationale: Hindi ipinahihiwatig ng teksto kung sila ay ganap na pinabayaan o nasa panganib. Ang salin ay nagpapanatili sa tensiyon ng larawan at hindi nagdaragdag ng katiyakang wala sa orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignidad, at angkop sa pagbasa sa Bibliya. Ginamit ang natural na retorikal na ayos at iniwasan ang sobrang literal na mga pariralang magiging mabigat o malabo. Ang marker na [a] ay nakalagay agad pagkatapos ng “ilang.”
