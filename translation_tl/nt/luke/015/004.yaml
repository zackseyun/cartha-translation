  naturalness: Natural at angkop sa modernong Filipino Tagalog ang retorikal na ayos na “Sino sa inyo ... ang hindi ...?” Ang “pumupunta upang hanapin” ay malinaw at idiomatiko, at ang pagbanggit muli ng “tupa” ay nakatutulong upang hindi maging malabo ang tinutukoy ng “nawawala.”
  terminology: Ang “sandaang tupa,” “siyamnapu’t siyam,” at “ilang” ay angkop. Ang “ilang” ay may sapat na lawak para sa ἐρήμῳ; pinananatili ng talababa ang mga leksikal na posibilidad nang hindi pinipilit ang isang tiyak na tanawin.
