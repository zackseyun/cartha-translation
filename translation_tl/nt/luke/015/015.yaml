  text: So he went and joined himself to one of the citizens of that country[a], and he sent him into his fields to feed pigs.
translation:
  language: tl
  text: Kaya pumunta siya at kumapit sa isa sa mga mamamayan ng lupaing iyon[a]. Ipinadala siya nito sa mga bukid nito upang mag-alaga ng mga baboy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dumikit” sa isa sa mga mamamayan; ipinahihiwatig ng pandiwang Griyego ang mahigpit na pagkapit o pag-uugnay ng sarili sa isang tao, maging sa paraang umaasa sa kaniya.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: umalis siya
  rationale: Ang aorist participle ay nagsasaad ng pagkilos bago ang pangunahing pandiwa; natural sa Tagalog ang “umalis siya” at angkop sa pagpunta niya upang humanap ng mapagkakapitan.
- source_word: ἐκολλήθη
  choice: nakiugnay
  rationale: Ipinahihiwatig ng κολλάομαι ang mahigpit at mapagkalingang pagkapit o pag-uugnay sa isang tao. Pinananatili ng “nakiugnay” ang kusang paglapit at pagdepende nang hindi labis na nagpapaliwanag; inilalahad sa talababa ang mas literal na larawan.
- source_word: ἑνὶ τῶν πολιτῶν
  choice: sa isa sa mga mamamayan
  rationale: Ang πολίτης ay kasapi o mamamayan ng isang pamayanang pampolitika; ang “mamamayan” ay tuwiran, kasalukuyan, at hindi gaanong teknikal kaysa “mamamayang may pagkamamamayan.”
- source_word: τῆς χώρας ἐκείνης
  choice: ng lupaing iyon
  rationale: Maaaring tumukoy ang χώρα sa lupain, rehiyon, o bansa. Ang “lupaing iyon” ay natural at umaalingawngaw sa naunang tagpuan nang hindi pinipilit ang modernong konsepto ng bansang-estado.
- source_word: ἔπεμψεν αὐτὸν
  choice: Pinapunta siya nito
  rationale: Nililinaw ng enclitic na “nito” na ang mamamayan, hindi ang anak, ang nagpadala. Ang “pinapunta” ay natural na salin ng pagpapadala sa isang lugar para sa gawain.
- source_word: εἰς τοὺς ἀγροὺς αὐτοῦ
  choice: sa mga bukid nito
  rationale: Pinananatili ng “mga bukid” ang plural ng ἀγρούς at ang “nito” ay malinaw na tumutukoy sa mamamayan.
- source_word: βόσκειν
  choice: upang mag-alaga
  rationale: Sa konteksto ng mga hayop, saklaw ng βόσκω ang pagpapakain o pagpapastol. Mas natural sa karaniwang Tagalog ang “mag-alaga ng mga baboy,” habang hindi isinasara ang gawain sa literal na pagpapakain lamang.
- source_word: χοίρους
  choice: mga baboy
  rationale: Ito ang payak at makabagong katumbas ng χοίρους; hindi kailangan ang mas pormal o lumang katawagan.
