translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nito” upang maiwasan ang kalituhan sa mga panghalip. Hinati sa dalawang pangungusap para sa likas na daloy sa Tagalog, habang pinananatili ang pagkakasunod-sunod ng mga kilos at ang talababa para sa lakas ng ἐκολλήθη.
