  terminology: Ang “naglilingkod” ang karaniwang, tumpak na salin ng δουλεύω rito. Maaaring ipaliwanag sa talababa na ang pandiwa ay may mas matinding konotasyon ng paglilingkod bilang alipin at na ang reklamo ng panganay ay may mapait na tono, nang hindi inilalagay ang di-likas na “nagpapaalipin” sa pangunahing teksto.
