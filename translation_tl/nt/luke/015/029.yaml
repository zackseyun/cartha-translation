reference: Luke 15:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ πατρὶ ⸀αὐτοῦ· Ἰδοὺ τοσαῦτα ἔτη δουλεύω σοι καὶ οὐδέποτε ἐντολήν σου παρῆλθον, καὶ ἐμοὶ οὐδέποτε ἔδωκας ἔριφον ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/029.yaml
  text: But he answered his father[a], ‘Look, for so many years I have been serving you, and I never disobeyed your command; yet you never gave me even a young goat so that I might celebrate with my friends.’
translation:
  language: tl
  text: Ngunit sumagot siya sa kanyang ama, ‘Tingnan mo, napakaraming taon na akong naglilingkod sa iyo[a], at kailanma’y hindi ko sinuway ang utos mo. Gayunman, hindi mo ako kailanman binigyan kahit isang batang kambing upang makipagsaya ako sa mga kaibigan ko.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Griyego na δουλεύω ay maaaring mangahulugang “maglingkod” o, sa mas matinding diwa, “maglingkod bilang alipin.” Dito, ang pagpili ng panganay na anak sa salitang ito ay nagpapahiwatig ng kanyang mapait na tono.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν τῷ πατρὶ αὐτοῦ
  choice: sumagot siya sa kanyang ama
  rationale: Natural na Filipino para sa Semitikong idyomang ‘sumagot at nagsabi’; pinananatili ang kausap nang walang di-kinakailangang pag-uulit.
- source_word: Ἰδοὺ
  choice: Tingnan mo
  rationale: Tuwirang pantawag-pansin na angkop sa mariing reklamo ng anak; mas natural sa modernong Filipino kaysa ‘Narito.’
- source_word: τοσαῦτα ἔτη δουλεύω σοι
  choice: napakaraming taon na akong nagpapaalipin sa iyo
  rationale: Ipinahahayag ng δουλεύω ang paglilingkod sa ilalim ng kapangyarihan ng iba. Sa mapait na reklamo ng anak, ang ‘nagpapaalipin’ ay nagpapanatili sa matinding retorikal na puwersa nang hindi ipinipilit na literal na alipin siya.
- source_word: οὐδέποτε ἐντολήν σου παρῆλθον
  choice: kailanma’y hindi ko sinuway ang utos mo
  rationale: Sa kontekstong ito, ang παρέρχομαι kasama ng ἐντολή ay tumutukoy sa paglabag o pagsuway sa isang utos; malinaw at likas ang ‘sinuway.’
- source_word: ἔδωκας ἔριφον
  choice: binigyan kahit isang batang kambing
  rationale: Ang ἔριφος ay batang kambing. Nililinaw ng ‘kahit isang’ ang ipinahihiwatig na pagmamaliit sa reklamo.
- source_word: ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ
  choice: upang makipagsaya ako sa mga kaibigan ko
  rationale: Ang εὐφραίνω ay tumutukoy rito sa masayang pagdiriwang o salu-salo; natural na naihahayag ng ‘makipagsaya’ ang kasamaang ipinakikita ng μετά.
theological_decisions:
- issue: Lakas ng δουλεύω sa paglalarawan ng panganay sa sarili
  choice: nagpapaalipin sa iyo
  alternative: naglilingkod sa iyo
  rationale: Pinananatili ng pangunahing salin ang mapait at mabigat na tono ng δουλεύω sa bibig ng anak, ngunit hindi ito ginagawang pahayag na legal o literal ang kanyang pagkaalipin. Inilalahad sa talababa ang mas banayad na leksikal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit pangkaraniwan. Ginamit ang ‘Tingnan mo’ bilang mariing pantawag-pansin at ang ‘Gayunman’ upang linawin ang salungat na reklamo. Nasa pangunahing teksto ang talababa [a].
