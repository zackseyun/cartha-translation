id: LUK.15.24
reference: Luke 15:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι οὗτος ὁ υἱός μου νεκρὸς ἦν καὶ ἀνέζησεν, ⸂ἦν ἀπολωλὼς⸃ καὶ εὑρέθη. καὶ ἤρξαντο εὐφραίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/024.yaml
  text: because this son of mine was dead and has come to life again[a]; he was lost and has been found[b]. And they began to celebrate.
translation:
  language: tl
  text: sapagkat patay ang anak kong ito at muling nabuhay; nawala siya at natagpuan. At nagsimula silang magdiwang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: sapagkat
  rationale: Likas at marangal na panandang sanhi sa Filipino; ipinakikilala nito ang dahilan ng ama sa pagdiriwang.
- source_word: οὗτος ὁ υἱός μου
  choice: ang anak kong ito
  rationale: Pinananatili ang diin ng demonstratibong οὗτος sa natural na ayos ng mga salita sa Filipino.
- source_word: νεκρὸς ἦν
  choice: ay patay
  rationale: Tuwirang pinananatili ang matinding larawang kamatayan at hindi ito pinapalambot sa isang paliwanag tungkol sa pagkakahiwalay.
- source_word: ἀνέζησεν
  choice: muling nabuhay
  rationale: Malinaw na nagpapahayag ng pagbabalik sa buhay at natural na katambal ng 'patay'; ang simpleng aspektong Filipino ay angkop sa aorist at sa kasalukuyang bunga nito sa salaysay.
- source_word: ἦν ἀπολωλὼς
  choice: siya ay nawala
  rationale: Pinananatili ang sentrong motibong nawala/natagpuan sa kabanata nang hindi dinaragdagan ng ideyang 'napahamak'.
- source_word: εὑρέθη
  choice: natagpuan
  rationale: Ang anyong ito ay natural sa Filipino at hindi tumutukoy kung sino ang nakatagpo, kaya napapanatili ang pagiging bukas ng pasibong Griyego tungkol sa tagaganap.
- source_word: ἤρξαντο εὐφραίνεσθαι
  choice: nagsimula silang magdiwang
  rationale: Pinananatili ng 'nagsimula' ang ingressive na diwa, at ang 'magdiwang' ay malinaw na tumutukoy sa masayang pagdiriwang sa konteksto ng handaan.
theological_decisions:
- issue: Ang metaporikal na lakas ng 'patay' at 'muling nabuhay' sa talinghaga
  choice: Panatilihin ang tahasang wika ng kamatayan at buhay nang walang paliwanag sa loob ng teksto.
  alternative: Ipaliwanag bilang 'itinuring na patay' o 'nanumbalik sa espirituwal/panlipunang buhay.'
  rationale: Bagaman metaporikal sa daloy ng talinghaga, sinadya ng teksto ang mariing pagtutumbas ng kamatayan at buhay; hindi dapat lutasin ng salin ang teolohikal at pampanitikang tensiyong iyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang bahagyang pormal na 'sapagkat' at ang karaniwang 'magdiwang.' Ang dalawang 'ngunit' ay likas na naghahayag ng matinding pagsalungat na ipinahihiwatig ng magkatambal na kalagayan sa Griyego, kahit καί ang nasa pinagmulan.
