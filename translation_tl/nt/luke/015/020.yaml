  text: καὶ ἀναστὰς ἦλθεν πρὸς τὸν πατέρα ⸀ἑαυτοῦ. ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος εἶδεν αὐτὸν ὁ πατὴρ αὐτοῦ καὶ ἐσπλαγχνίσθη καὶ δραμὼν ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/020.yaml
  text: And he arose and came to his father[a]. But while he was still far away, his father saw him and was moved with compassion[b], and ran and fell on his neck and kissed him fervently.
translation:
  language: tl
  text: At bumangon siya at pumunta sa kanyang ama. Ngunit habang malayo pa siya[a], nakita siya ng kanyang ama at labis siyang nahabag. Tumakbo ang ama, yumakap sa kanyang leeg, at marubdob siyang hinalikan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “habang malayo-layo pa siya.”
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang Griyego ay maaaring magpahiwatig ng masidhing pagmamahal, at posible ring unawaing “paulit-ulit siyang hinagkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: tumindig
  rationale: Ipinapakita ng aorist participle ang tiyak na pagkilos ng anak bago siya pumunta sa ama; pinananatili ng “tumindig” ang pagkakasunod ng mga kilos nang hindi isinasama rito ang kasunod na diwa ng pagpunta.
- source_word: ἦλθεν πρὸς τὸν πατέρα ἑαυτοῦ
  choice: pumunta sa kanyang ama
  rationale: Maaaring mangahulugan ang ἔρχομαι ng “pumunta” o “dumating” ayon sa pananaw ng salaysay. Likas sa modernong Tagalog ang “pumunta sa kanyang ama,” at malinaw nitong pinananatili ang ugnayang binibigyang-diin ng talata.
- source_word: ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος
  choice: habang malayo pa siya
  rationale: Likas at malinaw itong salin ng genitive absolute na nagsasaad ng kalagayang kasabay ng pagkakita ng ama sa anak.
- source_word: ἐσπλαγχνίσθη
  choice: naantig ito sa habag
  rationale: Ang pandiwa ay tumutukoy sa malalim at panloob na pagkahabag. Pinananatili ng “naantig sa habag” ang emosyonal na lakas nito kaysa sa mas payak na “nahabag.”
- source_word: δραμὼν
  choice: tumakbo ang ama
  rationale: Tuwirang salin ito ng aorist participle ng τρέχω; inuulit ang “ama” upang maging malinaw ang simuno sa natural na Tagalog.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: yumakap sa kanyang leeg
  rationale: Literal na “bumagsak sa kanyang leeg” ang idyomang Griyego, ngunit ang kahulugan nito sa tagpo ay isang marubdob na pagyakap. Ang “yumakap sa kanyang leeg” ay natural sa Tagalog at hindi nagdaragdag ng teolohikal na paliwanag.
- source_word: κατεφίλησεν
  choice: buong lambing siyang hinagkan
  rationale: Maaaring magpahiwatig ang tambalang pandiwa ng masidhing pagmamahal at posibleng paulit-ulit na paghalik. Inilalahad ng “buong lambing” ang tindi ng damdamin nang hindi tiyak na ipinapasok ang pag-uulit na hindi tahasang nakasaad.
theological_decisions:
- issue: Paglalarawan sa habag ng ama sa talinghaga
  choice: Panatilihin ang masiglang damdamin at pagkukusa ng ama nang hindi tahasang ginagawang alegorya ang mga ito.
  alternative: Pahinain ang emosyonal na pananalita, o palawakin ito upang tahasang tukuyin ang ama bilang sagisag ng Diyos.
  rationale: Malalakas mismo ang mga pandiwa ng salaysay sa paglalarawan ng habag at pagkukusa ng ama. Dapat panatilihin ng salin ang lakas na iyon nang hindi nagdaragdag ng paliwanag na doktrinal na wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang payak na ayos ng salaysay at malinaw na tinukoy muli ang “ama” upang maiwasan ang kalituhan sa mga panghalip. Ang “buong lambing” ay nagpapanatili sa init ng tagpo nang hindi nagiging sentimental o doktrinal na pagpapalawak.
