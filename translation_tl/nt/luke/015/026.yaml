  yaml_path: translation/nt/luke/015/026.yaml
  text: And calling one of the servants[a], he asked what these things might be.
translation:
  language: tl
  text: Tinawag niya ang isa sa mga lingkod at tinanong kung ano kaya ang mga iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kung ano kaya ang ibig sabihin ng mga nangyayari.” Mas literal sa Griyego, “kung ano kaya ang mga iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Tinawag niya
  rationale: Ipinahihiwatig ng aorist middle participle na tinawag niya ang lingkod upang lumapit bago niya ito tinanong. Natural sa Filipino ang tahasang pandiwang ito at malinaw pa rin ang pagkakasunod ng mga kilos.
- source_word: παίδων
  choice: mga lingkod
  rationale: Maaaring mangahulugan ang παῖς na “bata” o “lingkod,” ngunit sa konteksto ng sambahayan at ng paghingi ng paliwanag tungkol sa pagdiriwang, “mga lingkod” ang pinakamalinaw at angkop.
- source_word: ἐπυνθάνετο
  choice: tinanong
  rationale: Ang imperfect middle ay tumutukoy sa pagtatanong o pag-uusisa. Ang “tinanong” ang natural na salin sa Filipino; hindi kailangang idiin dito ang aspektong nagpapatuloy.
- source_word: τί ἂν εἴη ταῦτα
  choice: kung ano kaya ang mga iyon
  rationale: Pinananatili ng “kaya” ang diwa ng posibilidad o pag-aalinlangan sa ἂν εἴη, habang ang “ang mga iyon” ay sumusunod sa pangmaramihang ταῦτα nang hindi agad binibigyang-kahulugang “mga nangyayari.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili sa pangunahing teksto ang bahagyang di-tiyak at mas literal na anyo ng tanong sa Griyego; ibinigay sa talababa ang mas idiomatikong pagpapahayag.
