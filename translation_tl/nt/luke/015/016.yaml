base_translation:
  language: en
  yaml_path: translation/nt/luke/015/016.yaml
  text: And he longed to fill his stomach with the carob pods that the pigs were eating[a], and no one was giving him anything.
translation:
  language: tl
  text: At gustong-gusto niyang punuin ang kanyang sikmura ng mga bunga ng carob na kinakain ng mga baboy,[a] at walang nagbibigay sa kanya ng anuman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pod”; ang salitang Griyego ay partikular na tumutukoy sa mga pod ng carob, na karaniwang ipinapakain sa mga hayop.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεθύμει
  choice: gustong-gusto niyang
  rationale: Ipinahahayag ng imperfect ang patuloy at matinding pagnanais; natural sa modernong Filipino ang “gustong-gusto” nang hindi dinaragdagan ang diwa.
- source_word: γεμίσαι
  choice: punuin
  rationale: Pinananatili ang kongkretong larawan ng pagpuno, sa halip na ang mas interpretatibong “busugin.”
- source_word: τὴν κοιλίαν αὐτοῦ
  choice: ang kanyang sikmura
  rationale: Tumutukoy sa tiyan bilang sentro ng gutom; malinaw at dignified ang “sikmura” sa kontekstong ito.
- source_word: ἀπὸ τῶν κερατίων
  choice: ng mga bunga ng carob
  rationale: Sa Filipino, likas na ikinakabit ang laman sa pandiwang “punuin” sa pamamagitan ng “ng”; ang κεράτια ay partikular na mga pod o bunga ng carob.
- source_word: κερατίων
  choice: mga bunga ng carob
  rationale: Mas madaling maunawaan kaysa sa hiram na “carob pods,” habang tinutukoy pa rin ang partikular na bunga; nililinaw sa talababa ang teknikal na kahulugan.
- source_word: οἱ χοῖροι
  choice: mga baboy
  rationale: Ito ang karaniwan at natural na modernong katumbas.
- source_word: ἤσθιον
  choice: kinakain
  rationale: Naipakikita ng aspektong imperfect ang nagpapatuloy na pagkain sa tagpo.
- source_word: οὐδεὶς ἐδίδου αὐτῷ
  choice: walang nagbibigay sa kanya ng anuman
  rationale: Ang “nagbibigay” ay naghahatid ng patuloy na kawalan ng tulong na ipinahihiwatig ng imperfect; ang “anuman” ay natural na nagpapahayag sa Filipino ng ipinahiwatig na layon.
