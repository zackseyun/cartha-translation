  text: Then he said[a], “A certain man had two sons.”
translation:
  language: tl
  text: Sinabi pa niya, “May isang lalaking may dalawang anak na lalaki.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: Sinabi pa niya
  rationale: Ang δέ ay banayad na pang-ugnay na nagpapatuloy sa sinasabi ni Jesus. Likas sa modernong Tagalog ang “pa” upang ipahiwatig ang pagpapatuloy nang hindi ginagawang tahasang pagsalungat.
- source_word: Ἄνθρωπός τις
  choice: May isang lalaki
  rationale: Likas na ipinakikilala ng “may isang lalaki” ang isang di-tiyak ngunit partikular na tauhan sa salaysay, kaya naipapahayag ang puwersa ng τις. Pinanatili ang “lalaki” dahil tiyak na panlalaki ang tinutukoy.
- source_word: εἶχεν
  choice: na may
  rationale: Bagaman imperfect ang anyo ng pandiwa, inilalahad lamang nito ang kalagayang pinagmulan ng talinghaga. Ang payak na “na may” ang natural na katumbas sa Tagalog.
- source_word: δύο υἱούς
  choice: dalawang anak na lalaki
  rationale: Pinananatili ng salin ang bilang na dalawa at ang tiyak na kahulugan ng υἱούς bilang mga anak na lalaki, hindi lamang mga anak.
theological_decisions:
- issue: Di-tiyak ngunit bahagyang partikular na puwersa ng Ἄνθρωπός τις
  choice: May isang lalaki
  alternative: Isang lalaki ang may
  rationale: Ang piniling anyo ay malinaw at natural na pambungad sa isang talinghaga at naipahihiwatig ang τις nang hindi nagdaragdag ng simbolikong o alegorikong kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na payak, marangal, at madaling maunawaan. Iniwasan ang mas lumang “isang taong” dahil maaaring hindi nito malinaw na mapanatili ang panlalaking referent, at ginamit ang “anak na lalaki” para sa tiyak na υἱούς.
