  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅμοιοί εἰσιν παιδίοις τοῖς ἐν ἀγορᾷ καθημένοις καὶ προσφωνοῦσιν ἀλλήλοις, ⸂ἃ λέγει⸃· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκλαύσατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/032.yaml
  text: 'They are like children sitting in the marketplace and calling to one another[a], who say: ‘We played the flute for you, and you did not dance; we sang a lament[b], and you did not weep.’'
translation:
  language: tl
  text: 'Sila ay tulad ng mga batang nakaupo sa pamilihan at tumatawag sa isa’t isa: “Tumugtog kami ng plawta[a] para sa inyo, ngunit hindi kayo sumayaw; umawit kami ng panaghoy[b], ngunit hindi kayo umiyak.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tradisyonal, “Tumugtog kami ng pipa para sa inyo.” Tiyak na tumutukoy ang salitang Griyego sa pagtugtog ng plawta o pipa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “nanaghoy kami” o “nagluksa kami.” Maaaring tumukoy ang salitang Griyego sa panaghoy, kabilang ang panaghoy sa libing.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιοί εἰσιν
  choice: Sila ay tulad ng
  rationale: Likas at malinaw na pananalita sa Filipino para ipakilala ang paghahambing.
- source_word: παιδίοις
  choice: mga bata
  rationale: Hindi tinutukoy ng salita ang kasarian at hindi kailangang labis na tukuyin ang edad.
- source_word: ἐν ἀγορᾷ
  choice: sa pamilihan
  rationale: Tumutukoy ang ἀγορά sa pampublikong pamilihan o liwasan; malinaw sa karaniwang mambabasa ang “pamilihan.”
- source_word: καθημένοις
  choice: nakaupo
  rationale: Tuwirang inilalarawan ang kalagayan ng mga bata sa tagpo.
- source_word: προσφωνοῦσιν ἀλλήλοις
  choice: tumatawag sa isa’t isa
  rationale: Pinananatili ang diwang kapwa sila tumatawag o nagsasalita sa isa’t isa nang hindi ipinapalagay na pasigaw o pagalit iyon.
- source_word: ἃ λέγει
  choice: ipinakilala sa pamamagitan ng tutuldok ang mismong sinabi
  rationale: Ang tuwirang sipi pagkatapos ng “tumatawag sa isa’t isa” ay likas sa Filipino at sapat na kumakatawan sa pandiwang “nagsasabi.”
- source_word: Ηὐλήσαμεν ὑμῖν
  choice: Tumugtog kami ng plawta para sa inyo
  rationale: Tiyak na tumutukoy ang αὐλέω sa pagtugtog ng plawta o tubong hinihipan, hindi lamang sa pangkalahatang pagtugtog ng musika.
- source_word: οὐκ ὠρχήσασθε
  choice: hindi kayo sumayaw
  rationale: Tuwiran, natural, at hindi nagdaragdag ng aspekto na hindi kailangang ipahayag sa Filipino.
- source_word: ἐθρηνήσαμεν
  choice: nanaghoy kami
  rationale: Pinananatili ang saklaw ng pandiwa na maaaring tumukoy sa paghihinagpis o pagbigkas/pag-awit ng panaghoy, kabilang ang panaghoy sa libing.
- source_word: οὐκ ἐκλαύσατε
  choice: hindi kayo umiyak
  rationale: Karaniwan at malinaw na katumbas ng κλαίω sa modernong Filipino.
theological_decisions:
- issue: Pagpapanatili sa talinghagang lakas ng magkasalungat na kilos ng mga bata nang hindi inuunahan ang paliwanag ni Jesus
  choice: 'Gumamit ng kongkretong mga kilos: pagtugtog ng plawta, pagsayaw, panaghoy, at pag-iyak.'
  alternative: Isalin nang mapagpaliwanag bilang pagdiriwang at pagluluksa.
  rationale: Ang talata ay naghahayag muna ng paghahambing; ang kongkretong larawan ay hindi nagdaragdag ng tiyak na teolohikal na aplikasyon na wala mismo sa talata.
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Ginamit ang “plawta” bilang karaniwang pangalan ng instrumento at “nanaghoy” upang mapanatili ang seryosong kaibahan sa pagsayaw. Ang ayos ng pangungusap at tutuldok ay ginawang likas sa Filipino habang pinananatili ang tuwirang sipi.
