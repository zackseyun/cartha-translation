  to: 'Sila ay tulad ng mga batang nakaupo sa pamilihan at tumatawag sa isa’t isa: “Tumugtog kami ng plawta[a] para sa inyo, ngunit hindi kayo sumayaw; umawit kami ng panaghoy[b], ngunit hindi kayo umiyak.”'
  rationale: Pinanatili ang estruktura at kongkretong larawan ng Griyego. Pinalitan ang “nanaghoy kami” sa pangunahing teksto ng “umaawit kami ng panaghoy” upang maipakita ang performatibong kontrast sa pagtugtog ng plawta, habang iniwan ang “nanaghoy kami” bilang lehitimong alternatibo sa talababa. Inayos din ang talababa a upang maging tumpak ang aspekto at saklaw ng instrumento.
