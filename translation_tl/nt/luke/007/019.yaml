base_translation:
  language: en
  yaml_path: translation/nt/luke/007/019.yaml
  text: He sent to the Lord, saying, “Are you the Coming One, or should we expect another?”
translation:
  language: tl
  text: Isinugo niya sila sa Panginoon upang itanong, “Ikaw ba ang Darating[a], o aasahan pa ba namin ang iba?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang siyang darating.” Ang pananalitang Griyego ay maaaring unawain bilang paglalarawan, ngunit dito ay malamang na ginagamit bilang titulong mesiyaniko.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεμψεν πρὸς τὸν κύριον
  choice: Isinugo niya sila sa Panginoon
  rationale: Ang ἔπεμψεν ay payak na naglalahad ng nakaraang pagsugo. Bagaman hindi tahasang binabanggit sa talatang ito ang layon, malinaw mula sa naunang konteksto na ang isinugo ay ang mga alagad; kailangan din ito sa natural na Tagalog. Ang πρὸς na may akusatibo ay nagpapahayag ng patutunguhan.
- source_word: κύριον
  choice: Panginoon
  rationale: Pinananatili ang karaniwang salin ng κύριος at ang bigat nito bilang magalang at Kristolohikal na titulo para kay Jesus sa salaysay ni Lucas.
- source_word: λέγων
  choice: upang itanong
  rationale: Ang participle ay nagpapakilala sa mensaheng ipinadala. Dahil patanong ang kasunod na tuwirang pananalita, mas natural sa Tagalog ang layuning 'upang itanong' kaysa literal na 'na nagsasabi.'
- source_word: Σὺ εἶ ὁ ἐρχόμενος
  choice: Ikaw ba ang Darating
  rationale: Ginagawang natural na tanong sa Tagalog ang pormal na 'ikaw ay.' Ang may-artikulong participle na ὁ ἐρχόμενος ay pinananatiling maikli at may lakas ng isang kinikilalang mesiyanikong katawagan.
- source_word: ἄλλον προσδοκῶμεν
  choice: maghihintay kami ng iba
  rationale: Ang προσδοκάω ay maaaring tumukoy sa paghihintay nang may inaasahan. Natural sa Tagalog ang 'maghihintay ... ng iba' at napapanatili nito ang patuloy na pag-asang ipinahihiwatig ng pangkasalukuyang anyo.
theological_decisions:
- issue: Paglilipat sa κύριος bilang titulo ni Jesus
  choice: Panginoon
  alternative: Guro; panginoon
  rationale: Ang 'Panginoon' ang likas na katumbas na nagpapanatili sa magalang at posibleng Kristolohikal na bigat ng titulo, nang hindi ito binabawasan tungo lamang sa 'Guro.'
- issue: Kung titulong mesiyaniko o karaniwang paglalarawan ang ὁ ἐρχόμενος
  choice: ang Darating
  alternative: ang siyang darating; ang hinihintay na darating
  rationale: Sa konteksto, ang parirala ay malamang na isang kinikilalang katawagang eskatolohikal o mesiyaniko. Ipinahihiwatig ito ng malaking titik, samantalang nililinaw ng talababa na posible rin ang mas deskriptibong pagbasa.
- issue: Saklaw ng panghalip sa προσδοκῶμεν
  choice: kami
  alternative: tayo
  rationale: Ang unang panauhang maramihan sa Griyego ay hindi nagpapasiya kung kabilang ang kausap. Ang 'kami' ay pinakaangkop sa eksena, sapagkat ang nagtatanong ay ang mga sugo ni Juan at hindi nila karaniwang isinasama si Jesus sa pangkat na naghihintay.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'Isinugo' sa salaysay at ang natural na 'upang itanong' sa halip na pilit na literal na participle. Ang 'Darating' ay ginawang malaking titik upang ipakita ang malamang na gamit bilang titulo, habang pinananatili sa talababa ang tunay na alternatibong pagbasa.
