  verdict: revise
  source_fidelity: 'Ang pangunahing diwa at mga larawan ng Griyego ay naipapahayag nang tapat: retorikal na tanong, isang lalaking nakasuot ng malalambot/pinong damit, at ang pag-uugnay ng maringal na kasuotan at karangyaan sa mga palasyong maharlika. Gayunman, ang “ano ang pinuntahan ninyo nang lumabas kayo?” ay ginagawang patutunguhan ang bagay na dapat makita, samantalang ang τί ang tuwirang layon ng ἰδεῖν (“ano ang ... makita”).'
  naturalness: Ang iba pang pangungusap ay malinaw at angkop sa makabagong Filipino. Ang “nang lumabas kayo, ano ang gusto ninyong makita?” ay likas na paraan upang maipahayag ang kilos ng paglabas at ang layuning makita, nang hindi ipinapalagay ang isang lugar na wala sa talata.
  terminology: Ang “malalambot na damit,” “mariringal na damit,” “karangyaan,” at “mga palasyo ng mga hari” ay angkop. Maayos ding nililinaw ng talababa na ang μαλακοῖς ay ukol sa pino/maselang kasuotan, hindi sa kahinaang moral. Ang “mga korte ng mga hari” ay katanggap-tanggap na alternatibo para sa kontekstong maharlika.
