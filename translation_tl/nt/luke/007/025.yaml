base_translation:
  language: en
  yaml_path: translation/nt/luke/007/025.yaml
  text: But what did you go out to see? A man dressed in soft clothing? Look[b][a], those who are in splendid clothing and luxury are in royal palaces.
translation:
  language: tl
  text: Ngunit nang lumabas kayo, ano ang gusto ninyong makita? Isang lalaking nakasuot ng malalambot na damit?[a] Tingnan ninyo, ang mga nakasuot ng mariringal na damit at namumuhay sa karangyaan ay nasa mga palasyo ng mga hari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pinong kasuotan.” Ang parirala ay tumutukoy sa malalambot at maseselang damit na kaugnay ng karangyaan, hindi sa kahinaang moral.
    reason: lexical_alternative
  - marker: b
    text: O “mga korte ng mga hari.” Maaaring tumukoy ang salitang Griyego sa mga maharlikang tirahan o sa kapaligiran ng korte ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Naghuhudyat ito ng pagsalungat at nagpapatuloy sa sunod-sunod na retorikal na tanong ni Jesus.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: ano ang pinuntahan ninyo nang lumabas kayo
  rationale: Likas itong pakinggan sa makabagong Tagalog at pinananatili ang nakaraang kilos ng paglabas at ang layuning makakita, nang hindi nagdaragdag ng lugar na hindi tahasang binanggit sa talata.
- source_word: ἄνθρωπον
  choice: isang lalaki
  rationale: Tumutukoy ito sa isang tiyak na lalaking indibidwal sa retorikal na tanong.
- source_word: ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον
  choice: nakasuot ng malalambot na damit
  rationale: Pinananatili ng “malalambot” ang kongkretong larawan ng pino at maselang kasuotang kaugnay ng karangyaan, hindi ng kahinaang moral.
- source_word: ἰδοὺ
  choice: Tingnan ninyo
  rationale: Likas na panawag-pansin ito sa modernong Tagalog at angkop sa pangmaramihang kausap.
- source_word: ἐν ἱματισμῷ ἐνδόξῳ
  choice: nakasuot ng mariringal na damit
  rationale: Ipinahahayag ng “mariringal” ang kariktan at mataas na katayuang panlipunan ng kasuotan.
- source_word: τρυφῇ
  choice: namumuhay sa karangyaan
  rationale: Ipinahihiwatig ng pangngalan ang marangya o maginhawang pamumuhay; kailangan ng pandiwang “namumuhay” upang maging malinaw at natural sa Tagalog.
- source_word: ἐν τοῖς βασιλείοις
  choice: nasa mga palasyo ng mga hari
  rationale: Malinaw nitong ipinapahayag ang maramihang maharlikang tirahan o kapaligiran ng korte na tinutukoy ng βασιλείοις.
theological_decisions:
- issue: Kahulugan ng μαλακοῖς sa konteksto
  choice: malalambot na damit, na tumutukoy sa pino at marangyang kasuotan
  alternative: malambot o mahina ang pagkatao; pambabaeng kasuotan
  rationale: Ang kaagad na pagtukoy sa mariringal na damit, karangyaan, at mga palasyo ay nagpapakitang pagkakaiba sa kalagayang panlipunan at pamumuhay ang paksa, hindi paghatol sa pagkalalaki o moral na pagkatao.
- issue: Saklaw ng βασιλείοις
  choice: mga palasyo ng mga hari
  alternative: mga korte ng mga hari
  rationale: Maaaring tumukoy ang salita sa maharlikang tirahan o kapaligiran ng korte. Ang “mga palasyo ng mga hari” ay malinaw at natural, samantalang pinananatili sa talababa ang alternatibong diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kayo/ninyo” upang mapanatili ang pangmaramihang kausap. Iniwasang idagdag ang “sa ilang,” sapagkat bagaman nasa konteksto iyon, hindi ito tahasang nasa tekstong Griyego ng talatang ito.
