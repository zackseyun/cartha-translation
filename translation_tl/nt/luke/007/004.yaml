translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Pinili ang “taimtim silang nakiusap” upang maipahayag ang magalang na kasidhian, at ang “pagbigyan mo sa bagay na ito” upang mapanatili ang di-tiyak ngunit malinaw na pagtukoy ng Griyego.
