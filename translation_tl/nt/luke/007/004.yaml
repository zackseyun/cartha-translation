  text: οἱ δὲ παραγενόμενοι πρὸς τὸν Ἰησοῦν παρεκάλουν αὐτὸν σπουδαίως λέγοντες ὅτι Ἄξιός ἐστιν ᾧ ⸀παρέξῃ τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/004.yaml
  text: When they came to Jesus[a], they earnestly appealed to him, saying, “He is worthy that you should grant this to him.”
translation:
  language: tl
  text: Pagdating nila kay Jesus, taimtim silang nakiusap sa kanya, na nagsasabi, “Karapat-dapat siyang pagbigyan mo sa bagay na ito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: Paglapit
  rationale: Ipinahahayag ng participle ang pagdating nila kay Jesus; natural sa Filipino ang temporal na “Paglapit nila kay Jesus.”
- source_word: παρεκάλουν
  choice: nakiusap
  rationale: Saklaw nito ang magalang ngunit mariing paghiling ng matatanda para sa senturyon, nang hindi pinalalabis bilang pagmamakaawa.
- source_word: σπουδαίως
  choice: taimtim
  rationale: Ipinahahayag nito ang kasigasigan at kaseryosohan ng kanilang pakiusap sa natural at marangal na Filipino.
- source_word: Ἄξιός
  choice: Karapat-dapat
  rationale: Tuwirang pinananatili nito ang positibong paghatol ng mga nagsasalita na ang senturyon ay nararapat tumanggap ng hinihiling na pabor.
- source_word: ᾧ
  choice: siya
  rationale: Ang panghalip na datibo ay tumutukoy sa senturyon; sa pariralang “pagbigyan mo,” natural na ipinahahayag sa Filipino ang benepisyaryo bilang “siya.”
- source_word: παρέξῃ
  choice: pagbigyan mo
  rationale: Sa konteksto, ang pandiwa ay tumutukoy sa pagkakaloob o paggawa ng hinihiling na pabor. Ang “pagbigyan mo” ay natural sa Filipino at nagpapanatili ng magalang na tono.
- source_word: τοῦτο
  choice: sa bagay na ito
  rationale: Pinananatili nito ang di-tiyak na pagtukoy ng demonstrative sa hiniling na gagawin, nang hindi ipinapasok sa talata ang paliwanag mula sa konteksto.
