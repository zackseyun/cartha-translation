  to: Pagdating nila kay Jesus, taimtim silang nakiusap sa kanya, na nagsasabi, “Karapat-dapat siyang pagbigyan mo sa bagay na ito.”
  rationale: Pinalitan ang “Paglapit” ng “Pagdating” upang tuwirang maipahayag ang παραγενόμενοι bilang pagdating sa kinaroroonan ni Jesus. Pinag-isa rin ang pangungusap sa pamamagitan ng “na nagsasabi” upang maipakita ang participle λέγοντες. Inayos ang ayos ng layon sa “pagbigyan mo siya” para sa natural at malinaw na Filipino, habang pinananatili ang magalang, mariin, at hindi partikular na pagtukoy sa hinihiling na pabor.
