  source_fidelity: Tumpak na naipapahayag ng draft ang pagdating ng mga sugo kay Jesus, ang taimtim na pakiusap, at ang paghatol nilang karapat-dapat ang senturyon. Gayunman, kailangang ayusin ang ayos ng panghalip at pandiwa sa huling pangungusap upang malinaw na si Jesus ang inaasahang magbibigay ng hinihiling na pabor sa senturyon.
  naturalness: Natural ang “taimtim silang nakiusap,” ngunit hindi natural ang “Karapat-dapat siyang pagbigyan mo sa bagay na ito” dahil hindi malinaw ang ugnayan ng “siya” sa “pagbigyan mo.” Mas idiomatiko ang “Karapat-dapat siyang pagbigyan mo sa bagay na ito,” na may malinaw na ayos na “pagbigyan mo siya.”
