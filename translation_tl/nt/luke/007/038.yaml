id: LUK.7.38
reference: Luke 7:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ στᾶσα ⸂ὀπίσω παρὰ τοὺς πόδας αὐτοῦ⸃ κλαίουσα, ⸂τοῖς δάκρυσιν ἤρξατο βρέχειν τοὺς πόδας αὐτοῦ⸃ καὶ ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς ἐξέμασσεν, καὶ κατεφίλει τοὺς πόδας αὐτοῦ καὶ ἤλειφεν τῷ μύρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/038.yaml
  text: and standing behind him at his feet[a], weeping, she began to wet his feet with her tears, and was wiping them with the hair of her head[b], and was kissing his feet and anointing them with the perfume.
translation:
  language: tl
  text: At habang nakatayo siya sa likuran ni Jesus, sa may paanan niya, at umiiyak, sinimulan niyang basain ng kanyang mga luha ang mga paa ni Jesus. Pinupunasan niya ang mga paa ni Jesus gamit ang buhok niya, at patuloy niyang hinahagkan[a] at pinapahiran ng mabangong langis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “paulit-ulit na hinahagkan ang mga paa niya”; ipinahihiwatig ng anyo ng pandiwang Griyego ang nagpapatuloy o paulit-ulit na kilos.
    reason: lexical_alternative
  - marker: b
    text: O “mabangong pamahid” o “pabango”; ang salitang Griyego ay tumutukoy sa mabangong langis o pamahid.
    reason: lexical_alternative
lexical_decisions:
- source_word: στᾶσα
  choice: habang nakatayo
  rationale: Ang aorist participle ay naglalarawan sa kalagayan ng babae sa tagpo; natural sa Filipino ang “habang nakatayo” at hindi nito labis na binibigyang-diin ang pagkakasunod-sunod.
- source_word: ὀπίσω παρὰ τοὺς πόδας αὐτοῦ
  choice: sa likuran niya, sa may paanan niya
  rationale: Pinananatili ang dalawang ideya ng pagiging nasa likuran at malapit sa mga paa, na angkop sa pagkakahilig ni Jesus sa hapag.
- source_word: κλαίουσα
  choice: umiiyak
  rationale: Karaniwan at malinaw na salitang Filipino para sa tuloy-tuloy na pagluha sa tagpo.
- source_word: τοῖς δάκρυσιν ἤρξατο βρέχειν
  choice: sinimulan niyang basain ng mga luha
  rationale: Malinaw na naihahayag ang pagsisimula ng kilos sa ἤρξατο at ang literal na diwa ng βρέχειν nang hindi pinalalabis bilang “buhusan” o “lubusang basain.”
- source_word: ἐξέμασσεν
  choice: pinunasan niya
  rationale: Ang pandiwa ay nangangahulugang punasan o patuyuin sa pamamagitan ng pagpahid. Ang “pinunasan” ay natural at hindi ipinapalagay na ganap na natuyo ang mga paa.
- source_word: ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς
  choice: ng buhok niya
  rationale: Sa Filipino, sapat at natural ang “buhok niya”; ang pagdaragdag ng “sa ulo” ay kalabisan bagaman tahasang naroon sa Griyego.
- source_word: κατεφίλει
  choice: patuloy na hinagkan
  rationale: Ipinahihiwatig ng imperfect ang nagpapatuloy o paulit-ulit na kilos, at ng tambalang pandiwa ang masidhing paghalik; iniiwasan ng salin ang dagdag na interpretasyong emosyonal.
- source_word: ἤλειφεν
  choice: pinahiran
  rationale: Natural na Filipino para sa paglalagay ng langis o pabango sa katawan at pinananatili ang kongkretong kilos.
- source_word: τῷ μύρῳ
  choice: ng mabangong langis
  rationale: Ang μύρον ay mabangong langis o pamahid; mas malinaw sa modernong Filipino ang “mabangong langis” kaysa sa “pabango,” na maaaring magpahiwatig ng modernong likidong isinasaboy.
theological_decisions:
- issue: Paglalarawan sa mga ginawa ng babae sa mga paa ni Jesus
  choice: Pinanatili ang kongkreto, mapagpakumbaba, at emosyonal na mga kilos nang walang idinagdag na paliwanag tungkol sa debosyon o pagsisisi.
  alternative: Isalin nang interpretatibo bilang pagpapakita ng debosyon, pagsamba, o pagsisisi.
  rationale: Inilalahad ng Griyego ang mga kilos ngunit hindi tahasang pinapangalanan sa talatang ito ang kanilang teolohikal na kahulugan; dapat manatili ang puwang na iyon sa salin.
- issue: Aspekto at tindi ng κατεφίλει
  choice: “patuloy na hinagkan,” na naghahayag ng nagpapatuloy o paulit-ulit na kilos.
  alternative: “masidhing hinagkan” o simpleng “hinagkan.”
  rationale: Pinananatili nito ang puwersa ng imperfect at ng pandiwang καταφιλέω nang hindi tiyak na ipinapataw ang isang damdaming higit sa tahasang sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sa may paanan niya” upang natural na ilarawan ang posisyon sa likuran ng isang taong nakahilig sa hapag. Ang mga panghalip na “nito” at “mga iyon” ay tumutukoy sa mga paa upang maiwasan ang paulit-ulit at posibleng malabong “niya.”
