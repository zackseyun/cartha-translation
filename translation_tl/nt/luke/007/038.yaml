  to: At habang nakatayo siya sa likuran ni Jesus, sa may paanan niya, at umiiyak, sinimulan niyang basain ng kanyang mga luha ang mga paa ni Jesus. Pinupunasan niya ang mga paa ni Jesus gamit ang buhok niya, at patuloy niyang hinahagkan[a] at pinapahiran ng mabangong langis[b].
  rationale: Inayos ang aspekto ng mga pandiwang Griyego sa pamamagitan ng mga anyong “pinupunasan,” “hinahagkan,” at “pinapahiran,” at nilinaw na ang mga paa ni Jesus ang layon ng bawat kilos. Pinanatili ang pagsisimula ng pagbasa sa luha, ang posisyon ng babae, at ang hindi interpretatibong paglalarawan ng kanyang mga ginawa.
