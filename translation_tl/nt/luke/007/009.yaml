  - severity: medium
    issue: Ang ὄχλος ay naisalin bilang “mga taong sumusunod.”
    rationale: Ang ὄχλος ay isang karamihan o pulutong, hindi lamang mga indibidwal na tao. Ang “karamihang sumusunod sa kanya” ay mas tumpak at natural.
  - severity: low
