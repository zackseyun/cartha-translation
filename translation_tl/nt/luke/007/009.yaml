  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ταῦτα ὁ Ἰησοῦς ἐθαύμασεν αὐτόν, καὶ στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ εἶπεν· Λέγω ὑμῖν, ⸀οὐδὲ ἐν τῷ Ἰσραὴλ τοσαύτην πίστιν εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/009.yaml
  text: When Jesus heard these things[a], he marveled at him, and turning to the crowd following him, he said, “I tell you[b], not even in Israel have I found such faith.”
translation:
  language: tl
  text: Nang marinig ni Jesus ang mga bagay na ito, namangha siya sa senturyon. Bumaling siya sa karamihang sumusunod sa kanya at sinabi, “Sinasabi ko sa inyo, kahit sa Israel ay hindi ako nakakita ng gayong pananampalataya[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ganoon kalaking pananampalataya.”
    reason: lexical_alternative
  - marker: b
    text: O “gayong pagtitiwala”; ang salitang Griyego ay siya ring karaniwang isinasaling “pananampalataya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας δὲ ταῦτα
  choice: Nang marinig ito ni Jesus
  rationale: Ang aorist participle ay nagsasaad ng pangyayaring nauna sa pangunahing pandiwa. Likas sa Tagalog ang “nang marinig,” at ang “ito” ay tumutukoy sa mga salitang ipinaabot tungkol sa senturyon.
- source_word: ἐθαύμασεν αὐτόν
  choice: namangha siya sa kanya
  rationale: Ang θαυμάζω ay nagpapahayag ng matinding paghanga o pagkamangha. Pinananatili ng “namangha” ang bigat ng salaysay, at ang panghalip ay tumutukoy sa senturyon.
- source_word: στραφεὶς
  choice: Bumaling siya
  rationale: Isinasalin ang participle bilang hiwalay na pandiwa upang maging malinaw at natural ang pagkakasunod ng kilos sa Tagalog.
- source_word: τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ
  choice: sa mga taong sumusunod sa kanya
  rationale: Ipinahihiwatig ng present participle ang patuloy na pagsunod. Mas natural sa karaniwang Tagalog ang “mga taong sumusunod” kaysa sa mas teknikal na “karamihan.”
- source_word: Λέγω ὑμῖν
  choice: Sinasabi ko sa inyo
  rationale: Tuwirang katumbas ito ng pormulang ginagamit ni Jesus sa pagbibigay-diin sa kasunod na pahayag.
- source_word: οὐδὲ ἐν τῷ Ἰσραὴλ
  choice: kahit sa Israel ay hindi
  rationale: Pinananatili ang diin ng οὐδέ at ang sadyang malawak na saklaw ng “Israel,” na maaaring tumukoy sa lupain o sa sambayanan.
- source_word: τοσαύτην πίστιν
  choice: ganitong pananampalataya
  rationale: Ang τοσαύτην ay maaaring magpahiwatig ng uri o antas; pinananatili ng “ganitong” ang saklaw na iyon nang hindi labis na nililinaw, samantalang ang “pananampalataya” ang karaniwang katumbas ng πίστις sa kontekstong ito.
- source_word: εὗρον
  choice: hindi ako nakakita
  rationale: Bagaman aorist ang anyong Griyego, natural sa Tagalog ang pangnagdaang “nakakita” sa pahayag tungkol sa karanasan ni Jesus hanggang sa sandaling iyon.
theological_decisions:
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala
  rationale: Ang konteksto ay tumutukoy sa pananalig ng senturyon sa awtoridad ni Jesus. Ang “pananampalataya” ang karaniwang salin, ngunit makatuwiran ding maunawaan ito bilang “pagtitiwala”; hindi pangunahing tinutukoy rito ang katangiang pagiging tapat.
- issue: Lakas ng τοσαύτην
  choice: ganitong pananampalataya
  alternative: ganito kalaking pananampalataya
  rationale: Maaaring ilarawan ng τοσαύτην ang gayong uri o gayong antas ng pananampalataya. Pinananatili sa teksto ang mas maluwag na pahayag at inilalagay sa talababa ang hayagang pagsukat sa laki.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Iniwasan ang sobrang literal na “mga bagay na ito” at ang mas lumang himig ng “ako'y,” habang pinanatili ang tuwirang pahayag at diin ng orihinal.
