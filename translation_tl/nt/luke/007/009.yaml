  naturalness: Likas ang pangungusap, ngunit mas malinaw at mas marangal sa modernong Tagalog ang “bumaling sa karamihang sumusunod sa kanya.” Ang “gayong pananampalataya” ay mas tuwirang katumbas ng τοσαύτην πίστιν kaysa “ganitong pananampalataya,” nang hindi ipinipilit kung uri o antas ang diin.
  terminology: Ang “pananampalataya” ay angkop para sa πίστις. Nananatili sa talababa ang “pagtitiwala” bilang posibleng pag-unawa, nang hindi ito ginagawang pangunahing salin.
