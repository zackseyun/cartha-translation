  text: καὶ ὑποστρέψαντες ⸂εἰς τὸν οἶκον οἱ πεμφθέντες⸃ εὗρον ⸀τὸν δοῦλον ὑγιαίνοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/010.yaml
  text: And when those who had been sent returned to the house[a], they found the servant healthy.
translation:
  language: tl
  text: Nang bumalik sa bahay ang mga isinugo, natagpuan nila ang alipin na magaling na.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lingkod.” Ang salitang Griego na doulos ay maaaring mangahulugang “alipin” o “lingkod,” ayon sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: Pagbalik
  rationale: Ipinahahayag ng aorist participle ang pangyayaring nauna sa pangunahing pandiwa; natural na naihahatid ng “Pagbalik” ang temporal na ugnayan.
- source_word: εἰς τὸν οἶκον
  choice: sa bahay
  rationale: Ipinahahayag ng εἰς ang pagpunta sa isang lugar. Natural sa Tagalog ang “bumalik sa bahay” at hindi nito ipinapalagay na sariling tahanan iyon ng mga isinugo.
- source_word: οἱ πεμφθέντες
  choice: ang mga isinugo
  rationale: Pinananatili nito ang pasibong diwa ng articular aorist passive participle nang hindi idinaragdag ang interpretatibong katawagang “mga mensahero.”
- source_word: εὗρον
  choice: natagpuan nilang
  rationale: Karaniwang salin sa salaysay; ang hulaping panghalip ay likas na nag-uugnay sa paksa at sa kanilang natagpuan.
- source_word: τὸν δοῦλον
  choice: ang alipin
  rationale: Mas malinaw na pinananatili ng “alipin” ang nakagapos at nakapailalim na katayuang panlipunan ng δοῦλος kaysa sa mas malawak na “lingkod.”
- source_word: ὑγιαίνοντα
  choice: magaling na
  rationale: Sa konteksto ng dating karamdaman, natural na ipinahahayag ng “magaling na” na nasa mabuting kalagayan na siya, nang hindi tahasang dinaragdagan ang pandiwang “pinagaling.”
theological_decisions:
- issue: Pagsasalin ng δοῦλος sa salaysay ng pagpapagaling
  choice: alipin
  alternative: lingkod
  rationale: Ang “alipin” ang mas tuwirang nagpapanatili sa katayuang panlipunang ipinahihiwatig ng δοῦλος sa ugnayan nila ng senturyon. Inilalagay sa talababa ang “lingkod” bilang lehitimong alternatibo at pamilyar na tradisyonal na salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maikling ayos na “Pagbalik ... natagpuan nilang” upang maging natural ang daloy habang pinananatili ang pagkakasunod ng mga pangyayari at ang pasibong “mga isinugo.”
