id: LUK.7.14
reference: Luke 7:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἥψατο τῆς σοροῦ, οἱ δὲ βαστάζοντες ἔστησαν, καὶ εἶπεν· Νεανίσκε, σοὶ λέγω, ἐγέρθητι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/014.yaml
  text: And coming up[a], he touched the bier, and the men carrying it stood still, and he said, “Young man, I say to you, arise.”
translation:
  language: tl
  text: Lumapit siya at hinipo ang patungan ng bangkay na binubuhat[a], at tumigil ang mga nagdadala nito. Sinabi niya, “Binata, sinasabi ko sa iyo, bumangon ka!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “andás” o “kabaong.” Ang salitang Griyego ay tumutukoy sa patungan o balangkas na ginagamit sa pagdadala ng bangkay sa prusisyon ng libing, hindi kinakailangang sa isang saradong kabaong.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: Lumapit siya
  rationale: Ipinahahayag ng aorist participle ang paglapit ni Jesus bago niya hinipo ang dinadala. Natural sa modernong Tagalog ang “lumapit siya” at malinaw ang pagkakasunod ng mga kilos.
- source_word: ἥψατο
  choice: hinipo
  rationale: Maaaring mangahulugang humipo o humawak ang anyong ito ng ἅπτω. Pinananatili ng “hinipo” ang payak na kilos at hindi ipinapalagay na matagal o mahigpit ang paghawak.
- source_word: σοροῦ
  choice: lalagyan ng bangkay na binubuhat[a]
  rationale: Tumutukoy ang σορός sa andás o bukás na patungan ng bangkay na dinadala sa prusisyon ng libing, hindi kinakailangang sa makabagong saradong kabaong. Malinaw sa karaniwang mambabasa ang napiling parirala, habang inilalahad sa talababa ang mas maiikling alternatibo.
- source_word: οἱ δὲ βαστάζοντες
  choice: ang mga nagbubuhat nito
  rationale: Tuwirang inilalarawan nito ang mga taong nagdadala sa lalagyan ng bangkay. Ang “nito” ay likas na panumbas sa Tagalog para sa ipinahihiwatig na layon.
- source_word: ἔστησαν
  choice: Huminto
  rationale: Sa konteksto, ipinahihiwatig ng ἔστησαν na tumigil sa paglakad at nanatili sa lugar ang mga nagbubuhat. Pinakamalinaw at natural dito ang “huminto.”
- source_word: Νεανίσκε
  choice: Binata
  rationale: Ang bokatibong νεανίσκε ay tuwirang tawag sa isang lalaking nasa kabataan. Ang “binata” ay maikli, marangal, at natural sa Tagalog.
- source_word: σοὶ λέγω
  choice: sinasabi ko sa iyo
  rationale: Pinananatili nito ang tahasang panghalip na σοὶ at ang tuwiran at mariing himig ng pananalita ni Jesus.
- source_word: ἐγέρθητι
  choice: bumangon ka
  rationale: Sa tagpong ito, utos ito sa namatay na bumangon. Natural at tuwiran sa modernong Tagalog ang “bumangon ka,” at hindi nito dinaragdagan ng paliwanag ang himala.
theological_decisions:
- issue: Himig at gramatikal na puwersa ng utos ni Jesus sa namatay
  choice: “bumangon ka”
  alternative: “ibangon ka” o “tumindig ka”
  rationale: Bagaman anyong aorist passive ang ἐγέρθητι, karaniwan itong gumaganap bilang tuwirang utos na bumangon sa ganitong konteksto. Ang “bumangon ka” ay likas na Tagalog at pinananatili ang awtoridad ng utos nang hindi ipinapasok ang dagdag na paliwanag tungkol sa paraan o teolohikong kahulugan ng muling pagkabuhay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Iniwasan ang masyadong teknikal na “andás” sa pangunahing teksto ngunit pinanatili ito sa talababa bilang maikli at tumpak na katawagan. Hinati sa maiikling pangungusap ang magkakaugnay na sugnay na Griyego upang maging natural sa Tagalog nang hindi binabago ang pagkakasunod ng mga kilos.
