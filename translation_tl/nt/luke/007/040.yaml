  source_fidelity: 'Tumpak na naihahatid ang pangunahing nilalaman: tumugon si Jesus kay Simon, may sasabihin siya rito, at tinawag siya ni Simon na “Guro.” Ang “Sumagot” ay katanggap-tanggap na idiomatikong pagsasalin ng ἀποκριθεὶς ... εἶπεν nang hindi kailangang ulitin ang dalawang pandiwang pangsalaysay.'
