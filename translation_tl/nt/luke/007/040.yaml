  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν· Σίμων, ἔχω σοί τι εἰπεῖν. ὁ δέ· ⸂Διδάσκαλε, εἰπέ, φησίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/040.yaml
  text: And Jesus answered and said to him[a], “Simon, I have something to say to you.” And he said, “Teacher, say it.”
translation:
  language: tl
  text: Sumagot si Jesus sa kanya, “Simon, may sasabihin ako sa iyo.” Sinabi ni Simon, “Guro, sabihin po ninyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: Sumagot si Jesus sa kanya
  rationale: Ang participle na ἀποκριθείς kasama ng εἶπεν ay karaniwang pormula sa pagsasalaysay. Ang “Sumagot si Jesus sa kanya” ay natural sa Tagalog at pinananatili ang diwa ng pagtugon nang hindi inuulit ang “sumagot at sinabi.”
- source_word: Σίμων
  choice: Simon
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa Filipino.
- source_word: ἔχω σοί τι εἰπεῖν
  choice: may sasabihin ako sa iyo
  rationale: Malapit ito sa idyomang Griyego at natural sa kasalukuyang Tagalog; malinaw ring naipapahayag ng “sa iyo” ang σοί.
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Ang διδάσκαλος ay tuwirang tumutukoy sa isang guro o tagapagturo. Hindi ginamit ang “Panginoon” o “Amo,” na maaaring magdagdag ng kahulugang wala sa mismong salita.
- source_word: εἰπέ
  choice: sabihin ninyo
  rationale: Ang pautos na εἰπέ ay literal na “sabihin mo.” Ginamit ang magalang na “ninyo” bilang natural na pagtawag sa isang guro sa modernong Filipino, nang hindi dinaragdagan ang nilalaman ng sinabi.
- source_word: φησίν
  choice: Sinabi naman niya
  rationale: Bagaman nasa historical present ang φησίν, mas natural ang nagdaang panahunan sa salaysay na Filipino. Tinutulungan ng “naman” na markahan ang tugon ni Simon nang hindi binabago ang diwa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tuwirang tawag na “Guro” at gumamit ng magalang na panghalip na “ninyo,” na karaniwan sa pakikipag-usap sa isang kinikilalang guro.
