source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ὁ λόγος οὗτος ἐν ὅλῃ τῇ Ἰουδαίᾳ περὶ αὐτοῦ ⸀καὶ πάσῃ τῇ περιχώρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/017.yaml
  text: And this report about him went out through all Judea and all the surrounding region[a].
translation:
  language: tl
  text: At kumalat sa buong Judea at sa buong karatig na lupain ang balitang ito tungkol sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang ulat na ito tungkol sa kanya” o “ang salitang ito tungkol sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: kumalat
  rationale: Sa konteksto ng isang balita, likas na ipinahihiwatig ng literal na ‘lumabas’ na umabot o kumalat ito sa maraming lugar.
- source_word: ὁ λόγος οὗτος
  choice: ang balitang ito
  rationale: Dito, ang λόγος ay tumutukoy sa ulat o balita tungkol sa ginawa ni Jesus, hindi lamang sa isang binigkas na salita.
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: sa buong Judea
  rationale: Malinaw at natural nitong ipinapahayag ang lawak ng pagkalat sa buong rehiyon.
- source_word: περὶ αὐτοῦ
  choice: tungkol sa kanya
  rationale: Karaniwang modernong Tagalog para sa περί na may genitive, habang hindi nililinaw nang higit sa Griyego ang tinutukoy ng panghalip.
- source_word: πάσῃ τῇ περιχώρῳ
  choice: sa lahat ng karatig na lupain
  rationale: Ipinahihiwatig nito ang buong lugar na nakapaligid sa Judea nang hindi gumagamit ng labis na teknikal na terminong heograpiko.
- source_word: καὶ ... καὶ
  choice: At ... at
  rationale: Pinananatili ang payak at pinagsama-samang koordinasyon ng dalawang saklaw na heograpiko.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “kumalat” bilang idiomatikong katumbas ng paglabas ng balita; pinanatili sa talababa ang mas pormal na mga posibilidad ng λόγος.
