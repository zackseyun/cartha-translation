  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang 'Sapagkat' upang malinaw na iugnay ang talata sa dahilan sa naunang pahayag, at pinanatili ang 'siya mismo' para sa diin ng orihinal.
