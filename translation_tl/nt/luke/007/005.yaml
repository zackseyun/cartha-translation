  text: ἀγαπᾷ γὰρ τὸ ἔθνος ἡμῶν καὶ τὴν συναγωγὴν αὐτὸς ᾠκοδόμησεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/005.yaml
  text: For he loves our nation[a], and he himself built the synagogue for us.
translation:
  language: tl
  text: Sapagkat mahal niya ang aming bansa, at siya mismo ang nagtayo ng sinagoga para sa amin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “siya mismo ang nagpatayo ng sinagoga para sa amin.” Payak na “nagtayo” ang nasa Griyego, na maaaring tumukoy sa personal na pakikibahagi o sa pagtangkilik at pagpopondo niya sa pagpapatayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾷ
  choice: mahal niya
  rationale: Tuwirang ipinapahayag ang matibay na pagmamahal ng senturyon sa bayang Judio, nang hindi pinahihina bilang simpleng malasakit lamang.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan na ibinibigay ng matatandang Judio para sa kanilang naunang pakiusap.
- source_word: τὸ ἔθνος ἡμῶν
  choice: ang ating bansa
  rationale: Pinananatili ang kolektibong etniko at pambansang diwa ng ἔθνος at ang tahasang panghalip na 'ating.'
- source_word: τὴν συναγωγήν
  choice: ang sinagoga
  rationale: Tumutukoy sa kilalang lokal na institusyong Judio; walang tahasang panghalip na paari sa Griyego.
- source_word: αὐτός
  choice: siya mismo
  rationale: Pinananatili ang diin ng Griyegong panghalip sa pagkakasangkot o pagtangkilik ng senturyon.
- source_word: ᾠκοδόμησεν
  choice: nagtayo
  rationale: Likas na payak na nakaraang anyo na hindi nagpapasiya kung siya mismo ang gumawa ng pisikal na pagtatayo o nagpagawa bilang tagatangkilik.
- source_word: ἡμῖν
  choice: para sa atin
  rationale: 'Ipinahahayag ang datibong pakinabang: itinayo ang sinagoga para sa kapakinabangan ng kanilang pamayanan.'
