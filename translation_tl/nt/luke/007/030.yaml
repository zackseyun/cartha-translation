  text: οἱ δὲ Φαρισαῖοι καὶ οἱ νομικοὶ τὴν βουλὴν τοῦ θεοῦ ἠθέτησαν εἰς ἑαυτούς, μὴ βαπτισθέντες ὑπ’ αὐτοῦ.)
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/030.yaml
  text: But the Pharisees and the lawyers rejected God's purpose for themselves[b][a], not having been baptized by him.
translation:
  language: tl
  text: Ngunit tinanggihan ng mga Pariseo at ng mga dalubhasa sa Kautusan ang layunin ng Diyos para sa kanila[a], hindi sila nagpabautismo sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pasiya ng Diyos laban sa kanilang sarili,” o “ang plano ng Diyos tungkol sa kanila.”
    reason: alternative_reading
  - marker: b
    text: Si Juan na Tagapagbautismo ang tinutukoy.
    reason: cross_reference
lexical_decisions:
- source_word: νομικοὶ
  choice: mga dalubhasa sa Kautusan
  rationale: Tumutukoy ang νομικοί sa mga bihasa sa Kautusan ni Moises. Mas malinaw ito sa karaniwang mambabasang Filipino kaysa sa literal na “mga abogado,” na maaaring magpahiwatig ng makabagong propesyon.
- source_word: βουλὴν
  choice: layunin
  rationale: Maaaring mangahulugan ang βουλή ng layunin, plano, o pasiya. Natural at malinaw ang “layunin” habang hindi nito ipinapakahulugang payo lamang ang salita.
- source_word: ἠθέτησαν
  choice: tinanggihan
  rationale: Tuwirang ipinapahayag ng “tinanggihan” ang pagtutol o hindi pagtanggap na saklaw ng ἀθετέω sa kontekstong ito.
- source_word: εἰς ἑαυτούς
  choice: para sa kanila
  rationale: Ipinahihiwatig ng parirala na personal silang saklaw ng layunin ng Diyos. Pinananatili sa talababa ang posibleng pagbasa na “laban sa kanilang sarili” o “tungkol sa kanila.”
- source_word: μὴ βαπτισθέντες ὑπ’ αὐτοῦ
  choice: sapagkat hindi sila nagpabautismo sa kanya
  rationale: Natural sa Filipino ang aktibong anyong “nagpabautismo” para sa kusang pagtanggap ng bautismo. Ang “sapagkat” ay nagpapahayag ng malamang na sanhi sa konteksto, bagaman mas hindi tiyak ang ugnayan ng Griyegong participle.
- source_word: αὐτοῦ
  choice: kanya
  rationale: Pinananatili ang panghalip ng Griyego; nililinaw sa talababa na si Juan na Tagapagbautismo ang tinutukoy.
- source_word: δὲ
  choice: Ngunit
  rationale: Malinaw nitong ipinakikita ang pagsalungat sa tugon ng mga maniningil ng buwis sa naunang talata.
theological_decisions:
- issue: Ang kahulugan ng layunin ng Diyos kaugnay ng mga Pariseo at mga dalubhasa sa Kautusan
  choice: ang layunin ng Diyos para sa kanila
  alternative: ang pasiya ng Diyos laban sa kanilang sarili; ang plano ng Diyos tungkol sa kanila
  rationale: Ipinahahayag nito na tinanggihan nila ang layunin ng Diyos na may kinalaman sa kanila, nang hindi nilulutas ang teolohikal na tensiyon tungkol sa kalooban ng Diyos o ipinapakahulugang lubusang nabigo ang kanyang pangkalahatang pasiya.
- issue: Ugnayan ng hindi pagpapabautismo sa pagtanggi
  choice: sapagkat hindi sila nagpabautismo
  alternative: na hindi nagpabautismo; sa hindi nila pagpapabautismo
  rationale: Pinakamadaling maunawaan sa konteksto ang participle bilang nagpapahiwatig ng dahilan, ngunit hindi tahasang minamarkahan ng Griyego ang tiyak na ugnayang lohikal. Kaya hindi ginagawang hiwalay na doktrinal na pahayag ang sanhi.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Kautusan” na may malaking titik para sa Kautusan ni Moises at “mga dalubhasa” sa halip na “mga abogado” upang maiwasan ang makabagong legal na kahulugan.
