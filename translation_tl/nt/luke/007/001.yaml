  text: ⸀Ἐπειδὴ ἐπλήρωσεν πάντα τὰ ῥήματα αὐτοῦ εἰς τὰς ἀκοὰς τοῦ λαοῦ, εἰσῆλθεν εἰς Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/001.yaml
  text: When he had finished all his words in the hearing of the people[a], he entered Capernaum.
translation:
  language: tl
  text: Nang matapos niyang sabihin ang lahat ng kanyang sinabi sa pandinig ng mga tao, pumasok siya sa Capernaum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπειδὴ
  choice: Nang
  rationale: Nagsasaad ito rito ng panahon at pagkakasunod-sunod ng mga pangyayari, hindi ng dahilan.
- source_word: ἐπλήρωσεν
  choice: matapos niyang sabihin
  rationale: Sa pariralang may kaugnayan sa mga salita, ang pandiwa ay nangangahulugang tapusin o kumpletuhin ang pagsasalita, hindi ‘punuin’ o ‘tuparin.’
- source_word: πάντα τὰ ῥήματα αὐτοῦ
  choice: ang lahat ng iyon
  rationale: Tumutukoy ito sa kabuuan ng naunang sinabi ni Jesus. Likas sa modernong Tagalog ang ‘lahat ng iyon,’ samantalang inilalahad sa talababa ang mas literal na anyo.
- source_word: εἰς τὰς ἀκοὰς τοῦ λαοῦ
  choice: sa mga tao
  rationale: Ang idyoma ay nangangahulugang sinabi niya ang mga bagay na iyon upang marinig ng mga tao. Ang natural na Tagalog ay ‘sa mga tao’; pinananatili sa talababa ang larawan ng ‘pandinig.’
- source_word: λαοῦ
  choice: mga tao
  rationale: Ang λαός ay kolektibong tumutukoy sa mga taong nakikinig; hindi kailangang tukuyin sila nang mas makitid bilang isang pulutong.
- source_word: εἰσῆλθεν
  choice: pumasok siya
  rationale: Tuwirang katumbas ito ng pagkilos na pagpasok sa isang lugar.
- source_word: Καφαρναούμ
  choice: Capernaum
  rationale: Ito ang karaniwang baybay ng pangalan ng lugar sa mga saling Filipino.
