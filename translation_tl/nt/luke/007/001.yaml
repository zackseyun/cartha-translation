  verdict: revise
  source_fidelity: Ang pangunahing teksto ay wastong naghahayag ng temporal na sugnay at ng pagpasok sa Capernaum. Gayunman, ang “sa mga tao” ay pinapantay ang εἰς τὰς ἀκοὰς τοῦ λαοῦ sa karaniwang diwang ‘sa/para sa mga tao’ at hindi naipapakita ang partikular na nuwang pampublikong pagkarinig. Ang “lahat ng iyon” ay nauunawaan sa konteksto, ngunit ang “lahat ng kanyang sinabi” ay parehong likas at mas malapit sa πάντα τὰ ῥήματα αὐτοῦ.
  naturalness: Ang “sa pandinig ng mga tao” ay natural sa marangal at makabagong rehistro ng Bibliyang Filipino. Ang “lahat ng kanyang sinabi” ay mas idiomatiko kaysa “lahat ng kanyang mga salita” at malinaw na tumutukoy sa naunang pagtuturo.
  terminology: Ang “Capernaum” ay katanggap-tanggap na karaniwang baybay. Walang teolohikal na terminong nangangailangan ng pagbabago.
