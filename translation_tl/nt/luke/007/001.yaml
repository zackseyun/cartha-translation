    rationale: Kapag isinama ang ‘sa pandinig ng mga tao’ at ‘lahat ng kanyang sinabi’ sa salin, wala nang natitirang sapat na lexical alternative na nangangailangan ng talababa.
  revised_text: Nang matapos niyang sabihin ang lahat ng kanyang sinabi sa pandinig ng mga tao, pumasok siya sa Capernaum.
