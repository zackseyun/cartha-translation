base_translation:
  language: en
  yaml_path: translation/nt/luke/007/011.yaml
  text: And it happened on the next day that he went into a town called Nain[a], and his disciples and a large crowd were going with him.
translation:
  language: tl
  text: Nang sumunod na araw,[a] pumunta si Jesus sa isang bayang tinatawag na Nain, at kasabay niyang naglalakbay ang kanyang mga alagad at isang malaking pulutong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “di-nagtagal” sa halip na “nang sumunod na araw.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ ἑξῆς
  choice: Nang sumunod na araw
  rationale: Likas na panimulang salaysay sa modernong Tagalog; ipinahihiwatig nito ang Lukanong pormula at inilalarawan ang ἐν τῷ ἑξῆς bilang sumunod na araw ayon sa tekstong SBLGNT, nang hindi gumagamit ng mabigat na literalismong gaya ng “At nangyari.”
- source_word: ἐπορεύθη
  choice: pumunta si Jesus
  rationale: Ang πορεύομαι ay karaniwang nangangahulugang pumunta o maglakbay. Ginawang tahasan ang paksa bilang “si Jesus,” na malinaw mula sa konteksto at mas natural kaysa sa malabong “pumunta siya” sa isang hiwalay na talata.
- source_word: εἰς πόλιν
  choice: sa isang bayan
  rationale: Maaaring mangahulugan ang πόλις ng lungsod o bayan; ang “bayan” ay angkop sa maliit na pamayanang Nain. Natural sa Tagalog ang “pumunta sa,” samantalang hindi kailangang gawing tahasan ang diwang “papasok sa.”
- source_word: καλουμένην Ναΐν
  choice: tinatawag na Nain
  rationale: Direkta at natural na katumbas ng participle na καλουμένην, habang pinananatili ang transliterasyon ng pangalan ng lugar.
- source_word: συνεπορεύοντο αὐτῷ
  choice: sumama sa kanya
  rationale: Ipinahahayag ang kasabay na paglalakbay sa natural na Tagalog. Bagaman imperfect ang pandiwa, hindi kailangang gumamit ng mabigat na anyong “naglalakbay na kasama niya” upang maipakita ang nagpapatuloy na pagsama.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ang kanyang mga alagad
  rationale: Karaniwan, malinaw, at matatag na katumbas ng μαθηταί sa salaysay ng mga Ebanghelyo.
- source_word: ὄχλος πολύς
  choice: napakaraming tao
  rationale: Likas sa modernong Tagalog at malinaw na naghahatid ng malaking bilang ng ὄχλος; mas natural dito kaysa sa “isang malaking pulutong.”
