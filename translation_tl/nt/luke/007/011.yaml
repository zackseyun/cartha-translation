translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang arkaikong “At nangyari” at ang pormal ngunit hindi gaanong pangkaraniwang “pulutong.” Inilagay ang marker na [a] kaagad pagkatapos ng “Nain,” alinsunod sa hinihinging tala tungkol sa tekstuwal na variant.
