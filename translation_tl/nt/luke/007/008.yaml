    issue: «kapangyarihan» para sa ἐξουσία
    rationale: Maaaring mangahulugan ang «kapangyarihan» ng lakas o kakayahan, samantalang ang ἐξουσία rito ay awtoridad sa loob ng hanay ng utusan.
  - severity: low
    issue: «sa isa» para sa τούτῳ
    rationale: Hindi nito ganap na naipapakita ang demonstratibong pagtukoy ng τούτῳ. Ang «sa taong ito» ay malinaw at likas pa rin sa modernong Filipino.
  - severity: low
    issue: Puwesto ng talababa
    rationale: Ang marker para sa alternatibong salin ng δοῦλος ay nararapat ilagay agad pagkatapos ng «alipin», hindi sa dulo ng pangungusap.
