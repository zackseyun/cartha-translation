reference: Luke 7:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν τασσόμενος, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/008.yaml
  text: For I too am a man placed under authority[a], with soldiers under me; and I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: tl
  text: Sapagkat ako man ay isang taong inilagay sa ilalim ng awtoridad, na may mga kawal sa ilalim ko. Sinasabi ko sa taong ito, ‘Pumunta ka,’ at pumupunta siya; at sa iba, ‘Halika,’ at lumalapit siya; at sa alipin ko[a], ‘Gawin mo ito,’ at ginagawa niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “alipin” (Griyego: doulos) ay maaari ring isaling “lingkod.” Tinutukoy ng salita ang isang taong nasa ilalim ng nakagapos o pag-aaring katayuan, bagaman sa ilang konteksto ay mas pangkalahatan itong tumutukoy sa isang lingkod.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag ng senturyon sa nauna niyang sinabi; likas sa Tagalog ang “Sapagkat” para sa ganitong nagbibigay-katwirang gamit.
- source_word: ἐγὼ ἄνθρωπός εἰμι
  choice: ako man ay isang tao
  rationale: Pinananatili ng “ako man” ang diin at paghahambing na dala ng hayag na ἐγώ at ng καί, samantalang natural at marangal ang “isang tao” sa Filipino.
- source_word: ὑπὸ ἐξουσίαν τασσόμενος
  choice: inilagay sa ilalim ng kapangyarihan
  rationale: Ipinapanatili nito ang pasibong diwa ng τασσόμενος at ang kaayusan ng nakatataas at nasasakupan sa hukbo.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: may mga kawal na nasa ilalim ko
  rationale: Malinaw at natural itong paglalarawan ng mga kawal na sakop ng awtoridad ng senturyon nang hindi dinaragdagan ang Griyego ng tahasang “utos” o “pamumuno.”
- source_word: λέγω τούτῳ
  choice: Sinasabi ko sa isa
  rationale: Bagaman demonstratibo ang τούτῳ, mas likas sa kasalukuyang Tagalog ang “sa isa” sa pares na “sa isa… sa iba,” habang napapanatili ang balangkas ng halimbawa.
- source_word: Πορεύθητι … πορεύεται
  choice: ‘Pumunta ka,’ at pumupunta siya
  rationale: Tuwirang ipinapakita ang utos at agarang pagtugon, at pinananatili ang pag-uulit ng pandiwa.
- source_word: Ἔρχου … ἔρχεται
  choice: ‘Halika,’ at lumalapit siya
  rationale: Ang “Halika” ang natural na tuwirang utos; ang “lumalapit” ay malinaw na tugon patungo sa nagsasalita at iniiwasan ang di-likas na “humahalika.”
- source_word: τῷ δούλῳ μου
  choice: sa alipin ko
  rationale: Sa ilustrasyong nakatuon sa kaayusan ng kapangyarihan at pagsunod, mahalaga ang nakagapos o pag-aaring katayuang ipinahihiwatig ng δοῦλος; ang “alipin” ang pinakamalapit na tuwirang salin.
- source_word: Ποίησον τοῦτο, καὶ ποιεῖ
  choice: ‘Gawin mo ito,’ at ginagawa niya
  rationale: Pinananatili ang payak at mariing padron ng utos at pagsunod sa Griyego.
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλος sa paghahalintulad ng senturyon
  choice: alipin
  alternative: lingkod
  rationale: Hindi doktrina tungkol sa pang-aalipin ang ipinapahayag ng talata, ngunit sentral sa paghahalintulad ang matinding ugnayan ng awtoridad at pagpapasakop. Kaya pinili ang “alipin,” habang itinatala sa talababa ang mas pangkalahatang “lingkod” bilang posibleng salin.
- issue: Ugnayan ng sariling awtoridad ng senturyon at ng awtoridad ni Jesus
  choice: Pinanatili ang pahayag na siya ay nasa ilalim ng kapangyarihan at may mga kawal sa ilalim niya
  alternative: Ipaliwanag nang tahasan na ang awtoridad ni Jesus ay itinutulad sa ipinagkatiwalang awtoridad ng senturyon
  rationale: Ang Griyego ay naglalahad ng paghahalintulad ngunit hindi tahasang binubuo ang lahat ng teolohikal na implikasyon nito; hindi dapat idagdag sa salin ang isang paliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “kawal” upang tumugma sa kontekstong militar at “alipin” upang tapat na ihayag ang sinaunang katayuang panlipunan. Inilagay ang marker [a] pagkatapos ng buong pangungusap upang hindi putulin ang daloy ng magkakaugnay na utos at tugon.
