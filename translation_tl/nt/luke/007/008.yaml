revisions:
- from: Sapagkat ako man ay isang taong inilagay sa ilalim ng kapangyarihan, at may mga kawal na nasa ilalim ko. Sinasabi ko sa isa, ‘Pumunta ka,’ at pumupunta siya; sa iba naman, ‘Halika,’ at lumalapit siya; at sa alipin ko, ‘Gawin mo ito,’ at ginagawa niya.[a]
  to: Sapagkat ako man ay isang taong inilagay sa ilalim ng awtoridad, na may mga kawal sa ilalim ko. Sinasabi ko sa taong ito, ‘Pumunta ka,’ at pumupunta siya; at sa iba, ‘Halika,’ at lumalapit siya; at sa alipin ko[a], ‘Gawin mo ito,’ at ginagawa niya.
  rationale: Pinalitan ang «kapangyarihan» ng «awtoridad» upang mas tumpak na maipahayag ang ἐξουσία bilang ipinagkatiwalang awtoridad. Isinauli ang demonstratibong diin ng τούτῳ sa «sa taong ito», at inilipat ang talababa upang malinaw na nakakabit ito sa «alipin». Pinanatili ang payak na padron ng utos at tugon at ang hindi-pagpapaliwanag nang lampas sa teksto.
