review_pass:
  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ng talata ay tapat na naihahatid: ang senturyon ay nasa ilalim ng awtoridad ngunit may mga kawal na nasa ilalim niya, at ang kaniyang mga utos ay sinusunod. Gayunman, ang «kapangyarihan» ay mas malawak kaysa ἐξουσία; mas tiyak ang «awtoridad». Ang «sa isa» ay nagpapahina rin sa demonstratibong τούτῳ (“sa taong ito”).'
  naturalness: Natural at malinaw ang kabuuang rehistro, ngunit mas maayos na panatilihin sa iisang pangungusap ang magkakaugnay na paglalarawan ng posisyon ng senturyon. Ang «sa taong ito ... sa iba» ay nananatiling natural habang mas malapit sa anyo ng Griyego.
  terminology: «Awtoridad» ang mas angkop para sa ἐξουσία sa kontekstong hirarkikal. Ang «alipin» ay isang ligtas at tapat na salin ng δοῦλος dito; ang talababa ay wasto ngunit dapat ikabit mismo sa «alipin» na siyang tinutukoy nito.
  issues:
