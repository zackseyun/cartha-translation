id: LUK.7.28
reference: Luke 7:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν, μείζων ἐν γεννητοῖς γυναικῶν ⸀Ἰωάννου οὐδείς ἐστιν· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τοῦ θεοῦ μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/028.yaml
  text: I tell you[a], among those born of women no one is greater than John[c][b]; yet the least in the kingdom of God is greater than he is.
translation:
  language: tl
  text: Sinasabi ko sa inyo, sa mga ipinanganak ng babae[b], walang sinumang higit na dakila kaysa kay Juan. Ngunit ang pinakamababa[c] sa kaharian ng Diyos ay higit na dakila kaysa sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ang pariralang “ipinanganak ng babae” ay isang idyoma para sa mga tao sa pangkalahatan.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin na “ang taong pinakamababa sa kaharian ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Sinasabi ko sa inyo
  rationale: Likas at tuwirang pormula sa modernong Tagalog na nagpapanatili sa present-tense na diin ng Griyego.
- source_word: μείζων
  choice: higit na dakila
  rationale: Pinananatili ang paghahambing nang hindi nililimitahan kung ang tinutukoy ay katayuan, kahalagahan, o pribilehiyo.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: sa lahat ng ipinanganak ng babae
  rationale: Pinananatili ang Semitikong idyoma para sa mga tao sa pangkalahatan at malinaw sa karaniwang mambabasa.
- source_word: Ἰωάννου
  choice: Juan
  rationale: Karaniwang anyo ng pangalang John sa tradisyong Bibliyang Tagalog.
- source_word: οὐδείς ἐστιν
  choice: walang
  rationale: Maikli at natural na pagpapahayag ng negatibong eksistensiyal na pahayag sa Tagalog.
- source_word: ὁ δὲ μικρότερος
  choice: Ngunit ang pinakamababa
  rationale: Ang komparatibong may pantukoy ay ginagamit bilang pangngalan; ipinahahayag ng “pinakamababa” ang idiomatikong diwa ng least habang pinananatili ang tahasang pagsalungat.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: sa kaharian ng Diyos
  rationale: Pamilyar at tumpak na salin na pinananatili ang lokatibong diwa ng ἐν.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: ay higit na dakila kaysa sa kanya
  rationale: Natural na paghahambing sa Tagalog at malinaw na si Juan ang tinutukoy ng panghalip.
theological_decisions:
- issue: Batayan ng paghahambing sa pagitan ni Juan at ng pinakamababa sa kaharian ng Diyos
  choice: Pinanatili ang palaisipang paghahambing nang hindi ipinapaliwanag ang tiyak na kahulugan ng “higit na dakila.”
  alternative: Ipaliwanag ito bilang higit na pribilehiyo sa kasaysayan ng pagliligtas, higit na espirituwal o moral na katayuan, o retorikang pagmamalabis.
  rationale: Hindi tinutukoy ng Griyego ang batayan ng kadakilaan; ang paglilinaw nito sa salin ay magpapasok ng isang interpretasyong hindi tahasang nasa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Juan” ayon sa nakaugaliang anyo sa Bibliyang Tagalog. Hindi isinama ang talababa [a] sapagkat ang higit na literal na alternatibong “Sinasabi ko sa inyo” ang mismong ginamit sa pangunahing teksto; ang lahat ng ibinigay na marker ng aktuwal na talababa ay lumilitaw sa teksto.
