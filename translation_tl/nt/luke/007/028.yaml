    issue: Hindi tahasang naisasalin ang οὐδείς bilang isang taong paksa.
    rationale: Ang “walang higit na dakila kay Juan” ay nauunawaan sa konteksto, ngunit ang “walang sinuman” ay mas malinaw na katumbas ng “no one” at umiiwas sa bahagyang ellipsis.
