base_translation:
  language: en
  yaml_path: translation/nt/luke/007/021.yaml
  text: In that hour he healed many from diseases and afflictions and evil spirits[c][b][a], and to many blind people he granted sight.
translation:
  language: tl
  text: Noong oras na iyon[a], pinagaling niya ang marami mula sa mga sakit, malulubhang paghihirap[b], at masasamang espiritu; at ipinagkaloob niya sa maraming bulag ang kakayahang makakita[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Noong mismong oras na iyon.” Maaaring idiin ng pananalitang Griyego ang agarang pagkaganap nito sa oras na iyon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “matitinding karamdaman” o “mga salot.” Ang salitang Griyego ay literal na maaaring mangahulugang “mga hagupit,” at maaari ring tumukoy sa matinding pisikal na pagdurusa.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “ipinagkaloob niyang makakita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Nang oras na iyon
  rationale: Pinananatili nito ang tiyak na pagtukoy ni Lucas sa oras habang natural sa makabagong Filipino.
- source_word: ἐθεράπευσεν
  choice: pinagaling niya
  rationale: Direktang ipinahahayag nito ang karaniwang kahulugan ng θεραπεύω sa konteksto ng mga pagpapagaling ni Jesus.
- source_word: πολλοὺς
  choice: ang marami
  rationale: Hindi tinutukoy ng Griyego ang kasarian o isang mas makitid na pangkat, kaya hindi ito dinagdagan ng salitang naglilimita sa saklaw.
- source_word: ἀπὸ νόσων
  choice: sa mga sakit
  rationale: Ang ἀπό ay nagpapahiwatig ng paglaya mula sa kalagayan; kasunod ng 'pinagaling,' ang 'sa mga sakit' ang mas natural na katumbas sa Filipino.
- source_word: μαστίγων
  choice: matitinding paghihirap
  rationale: Bagaman literal na maaaring tumukoy ang μάστιξ sa hagupit, ginagamit ito rito para sa matinding pisikal na pahirap o karamdaman. Iniiwasan ng saling ito ang maling larawan ng literal na paghagupit habang pinananatili ang tindi.
- source_word: πνευμάτων πονηρῶν
  choice: masasamang espiritu
  rationale: Tuwirang katumbas ito ng πονηρῶν, na nangangahulugang masasama, hindi marurumi.
- source_word: τυφλοῖς πολλοῖς
  choice: ang maraming bulag
  rationale: Natural at inklusibo ito sa Filipino at hindi nagdaragdag ng panlalaking pagtukoy na wala sa Griyego.
- source_word: ἐχαρίσατο
  choice: pinagkalooban niyang
  rationale: Ipinapakita ng 'pinagkalooban' ang malaya at mapagbigay na pagkakaloob na nakapaloob sa χαρίζομαι.
- source_word: βλέπειν
  choice: makakita
  rationale: Pinananatili nito ang pandiwang pawatas ng Griyego at malinaw na tumutukoy sa pagkakaroon ng paningin.
theological_decisions:
- issue: Ang kalikasan ng masasamang espiritu at ang kapangyarihan ni Jesus sa mga ito
  choice: Pinanatili ang tuwirang pagtukoy sa 'masasamang espiritu' bilang bahagi ng mga pinagaling o nilapatan ng kapangyarihan ni Jesus.
  alternative: Ituring ang masasamang espiritu bilang talinghaga lamang para sa sakit na pisikal o pangkaisipan.
  rationale: Ang πνευμάτων πονηρῶν ay tuwirang tumutukoy sa masasamang espiritu. Hindi ito dapat gawing isang di-personal na sakit lamang, ngunit hindi rin dinagdagan ang talata ng paliwanag tungkol sa eksaktong paraan ng pagkilos ni Jesus.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang temporal na katiyakan, ang magkakaugnay na talaan ng mga pinagaling, at ang diwa ng mapagbigay na pagkakaloob sa mga bulag. Ginamit ang semicolon upang luminaw ang dalawang magkaugnay na kilos nang hindi hinahati ang talata.
