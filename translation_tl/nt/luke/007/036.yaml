  text: Ἠρώτα δέ τις αὐτὸν τῶν Φαρισαίων ἵνα φάγῃ μετ’ αὐτοῦ· καὶ εἰσελθὼν εἰς ⸂τὸν οἶκον⸃ τοῦ Φαρισαίου ⸀κατεκλίθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/036.yaml
  text: One of the Pharisees was asking him to eat with him[a], and after entering the Pharisee’s house[b], he reclined at the table.
translation:
  language: tl
  text: Isa sa mga Pariseo ang humihiling sa kanya na makisalo silang dalawa[a]. Pagkapasok niya sa bahay ng Pariseo, humilig siya sa hapag-kainan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “humihiling sa kanya upang kumain siyang kasama niya.”
    reason: lexical_alternative
  - marker: b
    text: 'Ito ang karaniwang ayos ng katawan sa isang pormal na kainan noon: nakahilig ang mga kumakain sa tabi ng mababang hapag sa halip na nakaupong tuwid.'
    reason: cultural_note
lexical_decisions:
- source_word: Ἠρώτα
  choice: nag-aanyaya
  rationale: Ang imperpektong anyo ay nagpapahiwatig ng nagpapatuloy na kilos sa nakaraan. Sa konteksto ng pagkain sa bahay, likas na ipinahihiwatig ng ‘nagtatanong’ o ‘humihiling’ ang pag-aanyaya; pinananatili ng aspektong nag-aanyaya ang di-ganap na kilos nang hindi ito ginagawang tahasang paulit-ulit.
- source_word: δέ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay. Hindi kailangan ng hiwalay na katumbas sa Filipino sapagkat natural na naipagpapatuloy ang salaysay nang walang idinagdag na panandang temporal o pansalungat.
- source_word: τις τῶν Φαρισαίων
  choice: isa sa mga Pariseo
  rationale: 'Tuwirang ipinapakita nito ang partitive na diwa: isang taong kabilang sa pangkat ng mga Pariseo.'
- source_word: ἵνα φάγῃ μετ’ αὐτοῦ
  choice: na kumain kasama nito
  rationale: Ipinahahayag ng ἵνα at subjunctive ang nilalayon ng pag-aanyaya. Ang ‘nito’ ay tumutukoy sa Pariseo at umiiwas sa kalituhan sa dalawang panlalaking panghalip.
- source_word: εἰσελθὼν εἰς τὸν οἶκον τοῦ Φαρισαίου
  choice: Pumasok siya sa bahay ng Pariseo
  rationale: Ipinapakita ng aorist participle ang kilos na nauna sa pangunahing pandiwa. Natural sa Filipino na gawin itong hiwalay na sugnay habang pinananatili ang pagkakasunod-sunod.
- source_word: κατεκλίθη
  choice: humilig sa hapag upang kumain
  rationale: Tumutukoy ang pandiwa sa nakaugaliang paghilig para sa pormal na pagkain noong unang siglo, hindi sa karaniwang pag-upo. Nililinaw ng ‘sa hapag upang kumain’ ang konteksto nang hindi pinapalitan ang makasaysayang kilos.
