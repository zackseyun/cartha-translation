translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Pariseo,’ ang karaniwang anyong Filipino ng pangalan ng pangkat. Pinanatili ang di-ganap na aspekto ng Ἠρώτα sa ‘nag-aanyaya,’ at ipinaliwanag sa talababa ang kaugaliang paghilig sa oras ng pagkain.
