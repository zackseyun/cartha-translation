  text: οὗ χάριν, λέγω σοι, ἀφέωνται αἱ ἁμαρτίαι αὐτῆς αἱ πολλαί, ὅτι ἠγάπησεν πολύ· ᾧ δὲ ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/047.yaml
  text: For this reason I tell you[a], her many sins have been forgiven, because she loved much. But the one who is forgiven little loves little.
translation:
  language: tl
  text: 'Dahil dito, sinasabi ko sa iyo[a]: pinatawad na ang marami niyang kasalanan, sapagkat nagmahal siya nang labis. Ngunit ang pinatatawad nang kaunti ay nagmamahal nang kaunti.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaya nagmahal siya nang labis.” Maaaring unawain ang pagkakaugnay ng mga salita sa Griyego bilang pagbibigay-diin na ang kanyang pag-ibig ay katibayan ng kalagayan niyang pinatawad na, sa halip na sanhi ng pagpapatawad sa kanya.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ χάριν
  choice: Kaya
  rationale: Natural at maikli itong panandang naghahayag ng bunga o dahilan, at pinananatili ang ugnayan sa naunang talinghaga.
- source_word: ἀφέωνται
  choice: pinatawad na
  rationale: Ipinapahayag ng perpektong pasibo ang naganap nang pagpapatawad na may nananatiling bisa sa kasalukuyan.
- source_word: ἁμαρτίαι αὐτῆς αἱ πολλαί
  choice: ang marami niyang kasalanan
  rationale: Likas na ayos sa Tagalog at tumpak na pinananatili ang diin sa dami ng kanyang mga kasalanan.
- source_word: ὅτι
  choice: sapagkat
  rationale: Pinananatili ang pormal na sanhi o paliwanag na puwersa ng Griyego nang hindi ipinapaliwanag palayo ang tensiyong dulot ng konteksto.
- source_word: ἠγάπησεν πολύ
  choice: umibig siya nang labis
  rationale: Ang 'umibig' ay tuwirang katumbas ng pandiwa; ang 'nang labis' ay natural na nagsasaad ng malaking antas ng pag-ibig.
- source_word: ᾧ δὲ ὀλίγον ἀφίεται
  choice: Ngunit ang pinatatawad nang kaunti
  rationale: Pinananatili ang pangkalahatang pagtukoy, pasibong tinig, at dami ng pinatatawad nang hindi nagdaragdag ng kasariang wala sa Griyego.
- source_word: ὀλίγον ἀγαπᾷ
  choice: umiibig nang kaunti
  rationale: Pinananatili nito ang maikli at mariing paralelismo sa 'pinatatawad nang kaunti.'
theological_decisions:
- issue: Kung ipinahihiwatig ng ὅτι na ang pag-ibig ng babae ang dahilan o batayan ng pagpapatawad sa kanya
  choice: Isalin bilang 'sapagkat' at panatilihin ang likas na tensiyon ng pangungusap.
  alternative: Unawain ito bilang 'kaya' o bilang pahiwatig na ang kanyang malaking pag-ibig ay ebidensiya ng kalagayan niyang pinatawad na.
  rationale: Ang ὅτι ay natural na may puwersang sanhi o paliwanag, ngunit ipinakikita ng talinghaga sa agarang konteksto at ng talata 50 na ang pagpapatawad ay nauuna at nagbubunga ng pag-ibig. Hindi dapat tahimik na lutasin ng salin ang siksik na ugnayang ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'umibig' upang mapanatili ang teolohikal at leksikal na bigat ng ἀγαπάω; iniwasan ang kasariang panlalaki sa pangkalahatang pahayag.
