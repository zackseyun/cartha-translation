  text: ἐλήλυθεν γὰρ Ἰωάννης ὁ βαπτιστὴς ⸀μὴ ⸂ἐσθίων ἄρτον μήτε πίνων οἶνον⸃, καὶ λέγετε· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/033.yaml
  text: For John the Baptist has come eating no bread and drinking no wine[a], and you say, ‘He has a demon.’
translation:
  language: tl
  text: Sapagkat dumating na si Juan na Tagapagbautismo na hindi kumakain ng tinapay ni umiinom ng alak, at sinasabi ninyo, “May demonyo siya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: dumating
  rationale: Ang perpektong anyo ay may kasalukuyang kaugnayan sa pangangatwiran, ngunit sa natural na Tagalog, sapat na ipinahahayag ng “dumating” ang pagdating ni Juan bilang pangyayaring pinagbabatayan ng patuloy na puna sa kaniya.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita nito na ang pangungusap ay paliwanag sa naunang sinabi; pormal ngunit malinaw ang “Sapagkat.”
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: Juan na Tagapagbautismo
  rationale: Malinaw na inilalarawan ng “Tagapagbautismo” ang gawain ni Juan at hindi umaasa sa pangalang denominasyonal na “Bautista.”
- source_word: μὴ ἐσθίων ἄρτον μήτε πίνων οἶνον
  choice: na hindi kumakain ng tinapay ni umiinom ng alak
  rationale: Pinananatili ang kongkretong “tinapay” at “alak,” pati ang magkatugmang pagtanggi sa dalawang gawain, sa natural na ayos ng Tagalog.
- source_word: λέγετε
  choice: sinasabi ninyo
  rationale: Ipinahahayag ng aspektong imperpektibo ang paulit-ulit o katangiang tugon ng mga kausap.
- source_word: Δαιμόνιον ἔχει
  choice: May demonyo siya
  rationale: Tuwirang pinananatili ang pahayag na mayroon siyang demonyo, sa halip na gawing mas interpretibong “sinasapian siya ng demonyo.”
theological_decisions:
- issue: Pagpapahayag sa δαιμόνιον bilang paratang kay Juan
  choice: demonyo
  alternative: masamang espiritu
  rationale: “Demonyo” ang tuwirang katumbas ng δαιμόνιον. Ang “masamang espiritu” o “maruming espiritu” ay kaugnay ngunit hindi siyang terminong ginamit rito.
- issue: Antas ng interpretasyon sa Δαιμόνιον ἔχει
  choice: May demonyo siya
  alternative: Sinasapian siya ng demonyo
  rationale: Pinananatili ng napiling salin ang anyo at retorikal na tindi ng orihinal nang hindi tiyakang ipinapakahulugan kung paano inuugnay kay Juan ang demonyo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “ni” sa ikalawang pagtanggi upang maging maayos ang daloy, at “Tagapagbautismo” upang malinaw na ilarawan ang katawagan kay Juan nang walang denominasyonal na kulay.
