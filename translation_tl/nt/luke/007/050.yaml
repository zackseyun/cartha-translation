base_translation:
  language: en
  yaml_path: translation/nt/luke/007/050.yaml
  text: And he said to the woman[a], “Your faith has saved you[b]; go in peace.”
translation:
  language: tl
  text: At sinabi niya sa babae, “Iniligtas ka ng iyong pananampalataya[a][b]; humayo ka nang payapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “pagtitiwala.” Hindi gaanong malamang dito: “katapatan.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang “Iniligtas ka” na “Pinagaling ka.” Ang pandiwang Griego ay maaaring mangahulugang magligtas, sumagip, o magpagaling, ngunit sa kontekstong ito ay binibigyang-diin ang kapatawaran at kaligtasan.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς τὴν γυναῖκα
  choice: At sinabi niya sa babae
  rationale: Ang δέ ay payak na nag-uugnay sa pagpapatuloy ng salaysay, kaya natural ang “At.” Ang γυνή ay tumutukoy sa babaeng nasa tagpo, hindi sa asawa.
- source_word: Ἡ πίστις σου
  choice: iyong pananampalataya
  rationale: Sa kontekstong ito, ang πίστις ay ang mapagtiwalang pagtugon ng babae kay Jesus. Karaniwan at marangal sa modernong Tagalog ang “pananampalataya,” habang maaaring linawin sa talababa ang nuansang “pagtitiwala.”
- source_word: σέσωκέν σε
  choice: Iniligtas ka
  rationale: Ang perfect na anyo ng σῴζω ay nagsasaad ng naganap na pagliligtas na may nananatiling bunga. Dahil nakasentro ang konteksto sa kapatawaran, mas angkop ang “iniligtas” kaysa sa pisikal na “pinagaling.”
- source_word: πορεύου εἰς εἰρήνην
  choice: humayo ka nang payapa
  rationale: Ang pariralang ito ay isang idyomatikong basbas sa pag-alis. Ang “humayo ka nang payapa” ay natural, marangal, at hindi mekanikal na isinasalin ang εἰς bilang “tungo sa.”
theological_decisions:
- issue: Kahulugan ng σῴζω kaugnay ng kapatawaran at kaligtasan
  choice: iniligtas ka
  alternative: pinagaling ka / pinagaling at iniligtas ka
  rationale: Binibigyang-diin ng Lucas 7:36–50 ang kapatawaran ng mga kasalanan at ang pananampalataya ng babae. Pinananatili ng “iniligtas” ang bigat ng salita nang hindi nagdaragdag ng partikular na sistematikong paliwanag.
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala / katapatan
  rationale: Ang “pananampalataya” ang malawak at kinikilalang katumbas. Malinaw sa konteksto na may nuansa ito ng pagtitiwala; ang “katapatan” ay leksikal na posible ngunit hindi gaanong malamang rito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “humayo” bilang pamilyar na pananalitang biblikal ngunit likas pa rin sa isang basbas. Inilagay ang parehong pananda ng talababa sa pangunahing teksto.
