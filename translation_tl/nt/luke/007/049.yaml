id: LUK.7.49
reference: Luke 7:49
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο οἱ συνανακείμενοι λέγειν ἐν ἑαυτοῖς· Τίς οὗτός ἐστιν ὃς καὶ ἁμαρτίας ἀφίησιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/049.yaml
  text: And those reclining at the table with him began to say among themselves[a], “Who is this, who even forgives sins?”
translation:
  language: tl
  text: At nagsimulang magsabi sa isa't isa[a] ang mga kasalo niyang nakahilig sa hapag, “Sino ba ito na pati mga kasalanan ay pinatatawad niya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “magsabi sa kanilang sarili.” Maaaring tumukoy ang pananalitang Griyego sa tahimik na pag-iisip ng bawat isa o sa pag-uusap ng mga panauhin sa isa't isa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: nagsimulang
  rationale: 'Pinananatili nito ang diwang ingresibo ng pandiwa: nagsimula ang kilos ng pagsasabi.'
- source_word: οἱ συνανακείμενοι
  choice: ang mga kasalo niyang nakahilig sa hapag
  rationale: Ipinahahayag nito kapwa ang pakikisalo kay Jesus at ang sinaunang kaugalian ng pagkakahilig habang kumakain, nang hindi pinapalitan iyon ng makabagong pag-upo.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: magsabi sa isa't isa
  rationale: Sa konteksto ng maramihang panauhin, likas itong tumutukoy sa pagpapalitan nila ng salita; inilalagay sa talababa ang tunay na posibilidad na ito'y pagsasabi sa kanilang sarili.
- source_word: Τίς οὗτός ἐστιν
  choice: Sino ba ito
  rationale: Hindi idinaragdag ang salitang “lalaki” o “tao,” na wala sa Griyego. Ang “ba” ay likas na naghahatid ng mapagtakang tanong sa Filipino.
- source_word: καὶ
  choice: pati
  rationale: Ginagamit dito ang καί sa pataas o mapagdiing diwa; ipinahahayag ng “pati” ang pagkagulat sa lawak ng ginagawa niya.
- source_word: ἁμαρτίας ἀφίησιν
  choice: mga kasalanan ay pinatatawad niya
  rationale: Ang ἀφίημι sa pariralang ito ay karaniwang tumutukoy sa pagpapatawad ng mga kasalanan. Malinaw at nakaugat sa karaniwang gamit ang “pinatatawad.”
theological_decisions:
- issue: Ang ipinahihiwatig na awtoridad ni Jesus na magpatawad ng mga kasalanan
  choice: Pinananatili ang tanong ng mga kasalo nang walang idinagdag na paliwanag tungkol sa pagkakakilanlan o awtoridad ni Jesus.
  alternative: Ipaliwanag sa mismong teksto na ang pagpapatawad ng kasalanan ay banal na kapangyarihan o tahasang tukuyin kung sino si Jesus.
  rationale: Itinataas ng talata ang tanong tungkol sa pagkakakilanlan at awtoridad ni Jesus ngunit hindi nito sinasagot iyon nang tuwiran. Dapat manatili ang teolohikal na tensiyon.
translation_notes:
  register: Makabago, likas, at marangal na Filipino. Ginamit ang “kasalo niyang nakahilig sa hapag” upang maipakita ang sinaunang ayos ng pagkain nang hindi maging sobrang teknikal; pinanatili ng “Sino ba ito” ang bigla at mapagtakang tono ng tanong.
