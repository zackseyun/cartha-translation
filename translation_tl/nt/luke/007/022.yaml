source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ εἴδετε καὶ ἠκούσατε· ⸀τυφλοὶ ἀναβλέπουσιν, χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται, ⸀κωφοὶ ἀκούουσιν, νεκροὶ ἐγείρονται, πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/022.yaml
  text: 'And answering[a], he said to them, “Go and report to John what you have seen and heard: the blind receive sight, the lame walk, lepers are cleansed, the deaf hear, the dead are raised[b], the poor have good news proclaimed to them.”'
translation:
  language: tl
  text: 'At sumagot siya sa kanila, “Humayo kayo at ibalita kay Juan ang inyong nakita at narinig: nakakakita ang mga bulag[a], nakakalakad ang mga pilay, nililinis ang mga may ketong, nakakarinig ang mga bingi, binubuhay ang mga patay, at ipinapahayag ang magandang balita sa mga dukha[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “muling nakakakita ang mga bulag.” Maaaring tumukoy ang pandiwang Griyego sa pagtanggap o panunumbalik ng paningin.
    reason: lexical_alternative
  - marker: b
    text: 'O, “ipinangangaral ang magandang balita sa mga dukha.” Pasibo ang Griyego: ang mga dukha ang tumatanggap ng pagpapahayag ng magandang balita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: sumagot siya
  rationale: Likas at malinaw sa modernong Tagalog ang pariralang ito bilang panimula sa tugon ni Jesus; hindi kailangang tularan nang kahoy ang participle at hiwalay na pandiwang ‘sinabi.’
- source_word: Πορευθέντες ἀπαγγείλατε
  choice: Humayo kayo at ibalita
  rationale: Ang participle ay kasama ng pautos at likas na naipapahayag sa Tagalog bilang magkaugnay na utos. Ang ‘ibalita’ ay angkop sa pagbabalik ng ulat kay Juan.
- source_word: ἃ εἴδετε καὶ ἠκούσατε
  choice: ang inyong nakita at narinig
  rationale: Direkta, natural, at pinananatili ang batayan ng ulat sa mismong nasaksihan ng mga sugo.
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: nakakakita ang mga bulag
  rationale: Saklaw nito ang pagtanggap o panunumbalik ng paningin nang hindi ipinipilit sa pangunahing teksto kung dati nang nakakakita ang bawat isa.
- source_word: χωλοὶ περιπατοῦσιν
  choice: nakakalakad ang mga pilay
  rationale: Payak at kasalukuyang Tagalog para sa kakayahang lumakad na inilalarawan ng Griyego.
- source_word: λεπροὶ καθαρίζονται
  choice: nililinis ang mga may ketong
  rationale: Pinananatili ng ‘nililinis’ ang higit-sa-medikal na diwa ng καθαρίζονται, kabilang ang pagiging malinis ayon sa ritwal; ang ‘mga may ketong’ ay mas magalang at makabago kaysa isang katawagang ginagawang identidad ang karamdaman.
- source_word: κωφοὶ ἀκούουσιν
  choice: nakakarinig ang mga bingi
  rationale: Sa pagsama sa pandiwang ‘nakakarinig,’ malinaw na ang κωφοί ay tumutukoy rito sa mga bingi.
- source_word: νεκροὶ ἐγείρονται
  choice: muling binubuhay ang mga patay
  rationale: Natural na Tagalog ito para sa pagbabangon ng mga patay at hindi tahasang pinapangalanan ang gumagawa, gaya rin ng pasibong Griyego.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: ipinapahayag sa mga dukha ang magandang balita
  rationale: Pinananatili nito ang pasibong diwa at ang mga dukha bilang tumatanggap, habang iniiwasan ang teknikal o denominasyonal na katawagang ‘ineebanghelyo.’
theological_decisions:
- issue: Ang talaan ng mga gawa bilang katibayan tungkol sa pagkakakilanlan at misyon ni Jesus
  choice: Ilahad nang tuwiran ang mga nakikitang gawa ng pagpapanumbalik nang hindi nagdaragdag ng tahasang paliwanag na mesiyaniko.
  alternative: Magdagdag ng wikang nagsasabing tuwirang katuparan ang mga ito ng mga hula ni Isaias.
  rationale: Ang talata mismo ay nag-uutos lamang na iulat kay Juan ang nakita at narinig. Nananatili ang mga alusyon sa propesiya sa mga piling salita, ngunit hindi dinaragdagan ang sinabi ng teksto.
- issue: Ang tagaganap sa mga pasibong pandiwa
  choice: Huwag tahasang pangalanan ang Diyos o si Jesus bilang tagaganap sa ‘nililinis,’ ‘binubuhay,’ at ‘ipinapahayag.’
  alternative: Gawing aktibo ang mga pahayag, gaya ng ‘binubuhay ng Diyos’ o ‘ipinapahayag ko.’
  rationale: Hindi tinutukoy ng mga pasibong anyo sa Griyego ang tagaganap. Ang pagpapanatili nito ay umiiwas sa pagdaragdag ng interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘mga may ketong’ bilang magalang na person-first na pananalita, ‘dukha’ upang mapanatili ang dignidad at biblikal na himig, at mga pangungusap na natural sa pasibong/pokus na balangkas ng Tagalog. Inilagay ang mga talababa sa mismong pariralang kanilang nililinaw.
