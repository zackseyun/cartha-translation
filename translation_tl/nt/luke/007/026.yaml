base_translation:
  language: en
  yaml_path: translation/nt/luke/007/026.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: tl
  text: Ngunit nang lumabas kayo, ano ang sinadya ninyong makita? Isang propeta? Oo, sinasabi ko sa inyo, at higit pa sa isang propeta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang bagay na higit kaysa sa isang propeta.” Ang anyong pahambing sa Griyego ay maaaring unawain nang ganito, ngunit mas natural sa Filipino ang “higit pa sa isang propeta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Nagpapakita ito ng pagsalungat sa naunang retorikal na tanong at angkop sa marangal ngunit modernong Filipino.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: ano ang pinuntahan ninyo upang makita
  rationale: Natural na Filipino ito para sa tanong tungkol sa layunin ng kanilang pagpunta. Ipinahihiwatig ng “pinuntahan” ang paglabas o pagpunta sa lugar nang hindi gumagamit ng pilit na literal na ayos.
- source_word: προφήτην
  choice: Isang propeta
  rationale: Karaniwang pangngalan ito at ginagamit nang patanong at eliptikal, gaya ng nasa Griyego.
- source_word: ναί
  choice: Oo
  rationale: Tuwiran at natural na katumbas ng mariing pagsang-ayon.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Pinananatili ang karaniwang pormula ng tuwirang pagpapahayag ni Jesus at malinaw sa modernong Filipino.
- source_word: καὶ περισσότερον προφήτου
  choice: at higit pa sa isang propeta
  rationale: Natural na ipinapahayag ang paghahambing habang hindi ipinapaliwanag kung sa anong tiyak na paraan higit si Juan sa isang propeta.
theological_decisions:
- issue: Ang pagkakakilanlan at katayuan ni Juan Bautista sa paglalarawan ni Jesus
  choice: Ipinahayag na si Juan ay isang propeta at higit pa sa isang propeta, nang hindi tinutukoy sa talatang ito ang eksaktong uri ng kanyang pagiging higit.
  alternative: Tahasang tawagin siyang pinakadakilang propeta o ang eskatolohikal na sugo.
  rationale: Maikli at hindi lubusang ipinaliwanag ang paghahambing sa talata. Dapat panatilihin ng salin ang tensiyong ito at hayaang ang kasunod na konteksto ang magbigay ng karagdagang paliwanag.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “pinuntahan ninyo” sa halip na ang pilit na literal na “lumabas kayo” upang maging likas ang tanong sa Filipino, habang pinananatili ang ideya ng sadyang pagpunta upang makakita.
