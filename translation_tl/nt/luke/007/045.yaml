  text: φίλημά μοι οὐκ ἔδωκας· αὕτη δὲ ἀφ’ ἧς εἰσῆλθον οὐ διέλιπεν καταφιλοῦσά μου τοὺς πόδας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/045.yaml
  text: You gave me no kiss[a], but from the time I came in[b], she has not stopped kissing my feet.
translation:
  language: tl
  text: Hindi mo ako binigyan ng halik[a], ngunit mula nang pumasok ako, hindi siya tumigil sa paghalik sa mga paa ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “halik bilang pagbati.” Karaniwang bahagi ng magiliw na pagtanggap sa panauhin ang ganitong halik.
    reason: cultural_note
  - marker: b
    text: 'Ang pandiwa ay maaaring magpahiwatig ng marubdob o paulit-ulit na paghalik: “hindi siya tumigil sa paghalik nang paulit-ulit sa mga paa ko.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλημά
  choice: halik
  rationale: Tuwirang katumbas ito ng pangngalan at natural sa Filipino. Ipinahihiwatig ng konteksto na halik ito bilang pagbati, ngunit hindi na iyon idinagdag sa pangunahing teksto.
- source_word: μοι
  choice: ako
  rationale: Ang datibong panghalip ang di-tuwirang layon ng ἔδωκας. Natural sa Filipino ang pariralang “binigyan mo ako.”
- source_word: ἔδωκας
  choice: binigyan
  rationale: Pinananatili nito ang payak na diwa ng δίδωμι, “magbigay,” habang gumagamit ng likas na ayos sa Filipino.
- source_word: αὕτη δὲ
  choice: ngunit … siya
  rationale: Malinaw nitong ipinakikita ang matinding paghahambing sa ginawa ng babae at sa hindi ginawa ng kausap ni Jesus, nang hindi na inuulit ang “babaeng ito.”
- source_word: ἀφ’ ἧς
  choice: mula nang
  rationale: Natural at malinaw itong nagpapahayag ng panahong nagsimula noon at nagpapatuloy hanggang sa sandali ng pagsasalita.
- source_word: εἰσῆλθον
  choice: pumasok ako
  rationale: Tuwiran at karaniwang salin ng εἰσέρχομαι sa konteksto ng pagpasok ni Jesus sa bahay.
- source_word: οὐ διέλιπεν
  choice: hindi siya tumigil
  rationale: Ipinahahayag nito ang hindi paghinto ng kilos mula nang pumasok si Jesus hanggang sa kasalukuyang tagpo.
- source_word: καταφιλοῦσά
  choice: sa paghalik
  rationale: Natural ito sa pangunahing teksto. Ang pandiwa ay maaaring magpahiwatig ng marubdob o paulit-ulit na paghalik, kaya nilinaw ang mas matinding himig sa talababa.
- source_word: μου τοὺς πόδας
  choice: sa mga paa ko
  rationale: Pinananatili ang tahasang maramihang “mga paa” at natural na ipinahahayag ang pagmamay-ari sa Filipino.
theological_decisions:
- issue: Kaugaliang pagtanggap sa panauhin na ipinahihiwatig ng halik
  choice: Payak na isinalin ang kilos bilang “halik” at inilagay sa talababa ang paliwanag tungkol sa kaugalian.
  alternative: “halik bilang pagbati” sa pangunahing teksto
  rationale: Ang Griyego ay tahasang nagsasaad lamang ng halik. Totoo at mahalaga sa paghahambing ang kaugalian ng pagtanggap sa panauhin, ngunit hindi ito dapat isingit bilang paliwanag sa mismong salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga paa ko” sa halip na mas pormal na “aking mga paa” upang maging natural sa karaniwang mambabasa, habang pinananatili ang diin ng paghahambing at ang nagpapatuloy na kilos.
