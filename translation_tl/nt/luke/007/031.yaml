id: LUK.7.31
reference: Luke 7:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τίνι οὖν ὁμοιώσω τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης, καὶ τίνι εἰσὶν ὅμοιοι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/031.yaml
  text: To what, then, shall I compare the men of this generation, and what are they like?
translation:
  language: tl
  text: “Kung gayon, sa ano ko ihahambing ang mga tao ng henerasyong ito, at ano ang kanilang katulad?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίνι
  choice: kanino
  rationale: Ang interrogative pronoun ay tumutukoy sa ihahambingang persona o pangkat sa kasunod na talinghaga; natural sa Tagalog ang “kanino” sa ganitong pagkakagamit.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang paghinuha mula sa naunang sinabi ni Jesus tungkol sa tugon ng mga tao kay Juan at sa Anak ng Tao.
- source_word: τοὺς ἀνθρώπους
  choice: ang mga tao
  rationale: Bagaman maaaring tumukoy ang ἀνθρώπους sa mga lalaki o sa mga tao sa pangkalahatan, dito ay pangkalahatan ang saklaw; “mga tao” ang likas at inklusibong salin.
- source_word: τῆς γενεᾶς ταύτης
  choice: ng salinlahing ito
  rationale: Pinananatili ng “salinlahi” ang kolektibo at pangkasalukuyang kahulugan ng γενεά sa konteksto.
- source_word: καὶ τίνι εἰσὶν ὅμοιοι
  choice: Ano ang maihahambing sa kanila?
  rationale: Likas na Tagalog na nagpapahayag ng ikalawang tanong nang hindi binabago ang diwa ng pagiging katulad o maihahambing.
theological_decisions:
- issue: Saklaw ng ἀνθρώπους
  choice: mga tao
  alternative: mga lalaki
  rationale: Walang malinaw na pahiwatig sa teksto na mga lalaking tao lamang ang tinutukoy. Ang konteksto ay tumutukoy sa mga kabilang sa salinlahing tumugon kina Juan at Jesus, kaya hindi dapat paliitin ang saklaw ayon sa kasarian.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang retorikal na dalawang tanong at ang bahagyang pag-uulit ng Griyego, ngunit inayos ang ikalawang tanong upang maging natural sa Tagalog.
