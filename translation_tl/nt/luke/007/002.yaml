id: LUK.7.2
reference: Luke 7:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἑκατοντάρχου δέ τινος δοῦλος κακῶς ἔχων ἤμελλεν τελευτᾶν, ὃς ἦν αὐτῷ ἔντιμος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/002.yaml
  text: A certain centurion’s servant[a], who was sick and about to die, was highly valued by him.
translation:
  language: tl
  text: May isang alipin[a] ang isang senturyon. Malubha ang sakit nito at malapit nang mamatay, at lubos siyang pinahahalagahan ng senturyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lingkod.” Ang salitang Griyego na doulos ay maaaring tumukoy sa alipin o lingkod ayon sa konteksto; ginamit dito ang “alipin” upang mapanatili ang nakagapos na katayuang ipinahihiwatig ng salita.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑκατοντάρχου ... τινος
  choice: ang isang senturyon
  rationale: Pinananatili ng “isang” ang di-tiyak na pagpapakilala ng τινος, habang likas sa Tagalog ang ayos na inuuna ang alipin at saka tinutukoy ang nagmamay-ari sa kaniya.
- source_word: δέ
  choice: hindi tahasang isinalin
  rationale: Mahinang panandang pasalaysay ang δέ. Sa Tagalog, sapat na ang pagsisimula ng bagong pangungusap upang ipahiwatig ang paglipat ng tagpo; ang “ngayon” o “ngunit” ay maaaring magdagdag ng di-naroroon na temporal o panalungat na diin.
- source_word: δοῦλος
  choice: alipin
  rationale: Malinaw na ipinahahayag ng “alipin” ang nakagapos at nakabababang katayuan sa sambahayan na ipinahihiwatig ng δοῦλος sa kontekstong ito, sa halip na palambutin ito bilang karaniwang tagapaglingkod.
- source_word: κακῶς ἔχων
  choice: malubha ang sakit
  rationale: Likas at malinaw itong salin ng idyomang nangangahulugang nasa masamang kalagayan; ipinahihiwatig ng nalalapit na kamatayan na malubha ang karamdaman.
- source_word: ἤμελλεν τελευτᾶν
  choice: malapit nang mamatay
  rationale: Tumpak at natural na ipinahahayag nito ang nalalapit na pangyayaring tinutukoy ng μέλλω kasama ng pawatas.
- source_word: ὃς ἦν αὐτῷ ἔντιμος
  choice: lubos siyang pinahahalagahan ng senturyon
  rationale: Sinasalamin nito ang mataas na pagpapahalaga ng senturyon nang hindi ipinapalagay na ang salita ay tahasang nangangahulugang minamahal o mahal sa damdamin.
theological_decisions:
- issue: Paglalarawan sa δοῦλος sa konteksto ng pagkaalipin sa sambahayan
  choice: alipin
  alternative: lingkod
  rationale: Ang “alipin” ang mas tuwirang nagpapanatili sa ugnayang may pagmamay-ari at pagkakagapos sa unang-siglong konteksto. Inilalagay sa talababa ang “lingkod” bilang posibleng salin dahil maaaring saklawin ng δοῦλος ang paglilingkod, ngunit maaari nitong palabuin ang katayuan ng tauhan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “senturyon,” ang karaniwang katawagang biblikal sa opisyal na Romano na namumuno sa humigit-kumulang isang daang kawal. Hinati sa dalawang pangungusap upang maging natural at maiwasan ang mabigat na sunod-sunod na sugnay, habang nananatiling malinaw na ang alipin ang may sakit at pinahahalagahan.
