base_translation:
  language: en
  yaml_path: translation/nt/luke/007/046.yaml
  text: You did not anoint my head with oil[a], but she has anointed my feet with perfume.
translation:
  language: tl
  text: Hindi mo pinahiran ng langis ang ulo ko, ngunit pinahiran ng babaeng ito ng mabangong langis ang mga paa ko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλαίῳ
  choice: ng langis
  rationale: Ang datibo ay nagpapahayag ng ginamit na sangkap. Natural at sapat ang “langis”; hindi kailangang tahasang sabihing langis ng olibo.
- source_word: ἤλειψας / ἤλειψεν
  choice: pinahiran
  rationale: Ang ἀλείφω ay tumutukoy sa pagpapahid o paglalagay ng langis o pamahid. Mas natural sa modernong Tagalog ang “pinahiran” kaysa sa mas seremonyal na “pinahiran bilang pagtatalaga,” at ang aspektong perpektibo ay angkop sa mga natapos na kilos sa tagpo.
- source_word: κεφαλήν μου
  choice: ang ulo ko
  rationale: Tuwiran at natural na salin ng layon at panghalip na paari.
- source_word: αὕτη δὲ
  choice: ngunit … niya
  rationale: Pinananatili ng “ngunit” ang mariing paghahambing sa ginawa ng babae at sa hindi ginawa ng kausap. Sapat na ang “niya” dahil malinaw sa konteksto ang tinutukoy.
- source_word: μύρῳ
  choice: ng mabangong langis
  rationale: Ang μύρον ay mabangong langis o pamahid. Ipinapakita ng “mabangong langis” ang kaibahan nito sa karaniwang langis nang hindi ipinapalagay ang anyong katulad ng modernong likidong pabango.
- source_word: τοὺς πόδας μου
  choice: ang mga paa ko
  rationale: Tuwirang salin na pinananatili ang maramihang bilang.
theological_decisions:
- issue: Paghahambing ng paggalang na ipinakita sa panauhin
  choice: Gumamit ng payak na “pinahiran” at malinaw na ihambing ang langis sa ulo at mabangong langis sa mga paa.
  alternative: Gumamit ng mas ritwal na pananalitang maaaring magpahiwatig ng pormal na pagtatalaga o pagpapahid bilang Mesiyas.
  rationale: Sa agarang konteksto, binibigyang-diin ang hindi ipinakitang karaniwang paggalang ng punong-abala at ang natatanging paggalang ng babae. Hindi dapat dagdagan ng salin ang mga pahiwatig na hindi tahasang ipinapahayag ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinili ang “pinahiran” bilang karaniwang pandiwa at “mabangong langis” bilang malinaw na katumbas ng μύρον.
