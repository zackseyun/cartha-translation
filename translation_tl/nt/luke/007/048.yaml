  text: εἶπεν δὲ αὐτῇ· Ἀφέωνταί σου αἱ ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/048.yaml
  text: Then he said to her[a], “Your sins are forgiven.”
translation:
  language: tl
  text: Pagkatapos, sinabi niya sa babae[a], “Pinatawad na ang iyong mga kasalanan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sinabi niya sa kaniya.” Ang tinutukoy ng “kaniya” ay ang babae.
    reason: Nililinaw ang literal na panghalip na αὐτῇ, samantalang ginagamit sa pangunahing teksto ang tahasang pangngalan para sa malinaw na pagbasa ng hiwalay na talata.
lexical_decisions:
- source_word: εἶπεν
  choice: sinabi
  rationale: Ang aorist ng λέγω ay tuwirang nangangahulugang “sinabi”; natural ito sa pagpapakilala ng tuwirang pananalita.
- source_word: δὲ
  choice: Pagkatapos
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay; ipinahihiwatig ng “Pagkatapos” ang pagsulong ng pangyayari nang hindi nagdaragdag ng pagsalungat.
- source_word: αὐτῇ
  choice: sa babae
  rationale: Ang datibong panghalip ay tumutukoy sa babaeng kausap sa konteksto. Mas malinaw at natural sa Filipino ang “sa babae” kaysa sa “sa kaniya” sa hiwalay na talata.
- source_word: Ἀφέωνταί
  choice: Pinatawad na
  rationale: Ang perfect passive ng ἀφίημι ay nagsasaad ng natapos na pagpapatawad na may nananatiling resulta. Likas sa Filipino ang “pinatawad na” at naipahahayag nito kapuwa ang naganap na gawa at ang kasalukuyang kalagayan.
- source_word: σου
  choice: iyong
  rationale: Ang genitive na panghalip ay natural na isinasalin bilang paari na “iyong.”
- source_word: αἱ ἁμαρτίαι
  choice: mga kasalanan
  rationale: Ang maramihang ἁμαρτίαι ay tumpak na “mga kasalanan”; hindi na kailangang katawanin nang hiwalay ang artikulong Griyego kapag may pauring paari.
theological_decisions:
- issue: Lakas ng perfect passive na Ἀφέωνταί sa pahayag ng pagpapatawad
  choice: “Pinatawad na ang iyong mga kasalanan,” na nagpapahayag ng natapos na pagpapatawad at nananatiling bunga nito.
  alternative: “Napatawad na ang iyong mga kasalanan” o “Ang iyong mga kasalanan ay pinatawad na.”
  rationale: Pinananatili ng “pinatawad na” ang tensiyon sa pagitan ng natapos na kilos at kasalukuyang kalagayan nang hindi tinutukoy kung kailan eksaktong naganap ang pagpapatawad o nagdaragdag ng paliwanag na wala sa Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “iyong” sa halip na kolokyal na “mong” upang mapanatili ang dignidad ng tuwirang pahayag. Ang “Pinatawad na” ay natural sa Filipino at tumutugma sa aspektong perfect passive ng Griyego.
