translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaniyang” para sa pormal ngunit madaling maunawaang tono. Pinanatili ang kaibahan ng kilos ni Simon at ng babae nang hindi nagdaragdag ng paliwanag na wala sa teksto.
