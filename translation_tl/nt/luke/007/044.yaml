  to: At bumaling siya sa babae at sinabi kay Simon, “Nakikita mo ba ang babaeng ito? Pumasok ako sa bahay mo; hindi mo ako binigyan ng tubig para sa aking mga paa[a]. Ngunit binasa niya ng kaniyang mga luha ang aking mga paa at pinunasan niya ang mga ito ng kaniyang buhok.”
