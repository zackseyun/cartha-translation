base_translation:
  language: en
  yaml_path: translation/nt/luke/007/044.yaml
  text: And turning toward the woman[a], he said to Simon, “Do you see this woman? I entered your house; you gave me no water for my feet, but she wet my feet with her tears and wiped them with her hair.”
translation:
  language: tl
  text: At bumaling siya sa babae at sinabi kay Simon, “Nakikita mo ba ang babaeng ito? Pumasok ako sa bahay mo; hindi mo ako binigyan ng tubig para sa aking mga paa[a]. Ngunit binasa niya ng kaniyang mga luha ang aking mga paa at pinunasan niya ang mga ito ng kaniyang buhok.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas pormal na salin: “hindi mo ako binigyan ng tubig sa aking mga paa.” Ang tinutukoy ay ang nakaugaliang paglalaan ng tubig para sa paghuhugas ng paa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς πρὸς τὴν γυναῖκα
  choice: bumaling siya sa babae
  rationale: Ipinapakita ng “bumaling” ang pisikal na pagharap ni Jesus sa babae, habang nananatiling likas ang daloy ng salaysay sa Tagalog.
- source_word: τῷ Σίμωνι ἔφη
  choice: sinabi kay Simon
  rationale: Likas at tuwirang salin sa kontekstong pasalaysay.
- source_word: Βλέπεις ταύτην τὴν γυναῖκα;
  choice: Nakikita mo ba ang babaeng ito?
  rationale: Pinananatili ang tuwirang tanong at ang diin ng demonstratibong ταύτην, nang hindi dinaragdagan ng interpretasyong “napapansin.”
- source_word: εἰσῆλθόν σου εἰς τὴν οἰκίαν
  choice: Pumasok ako sa bahay mo
  rationale: Malapit sa anyo ng Griyego at natural sa modernong Tagalog.
- source_word: ὕδωρ μοι ἐπὶ πόδας οὐκ ἔδωκας
  choice: hindi mo ako binigyan ng tubig para sa aking mga paa
  rationale: Pinananatili ang tahasang pagbanggit sa pagbibigay ng tubig at hindi isinasama sa pangunahing teksto ang ipinahihiwatig na paghuhugas ng paa.
- source_word: αὕτη δὲ
  choice: Ngunit ... niya
  rationale: Malinaw na ipinakikita ang paghahambing sa hindi ginawa ni Simon at sa ginawa ng babae.
- source_word: τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας
  choice: binasa niya ng kaniyang mga luha ang aking mga paa
  rationale: Tumpak na inilalarawan ang mga luha bilang ginamit sa pagbasa sa mga paa, ayon sa instrumental na datibo.
- source_word: ταῖς θριξὶν αὐτῆς ἐξέμαξεν
  choice: pinunasan ng kaniyang buhok
  rationale: Natural sa Tagalog at sapat na ipinahahayag ang pagpahid o pagpapatuyo gamit ang buhok.
