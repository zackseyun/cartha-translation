revisions:
- from: Nang makita ito ng Pariseong nag-anyaya sa kanya, sinabi niya sa sarili, “Kung propeta ang taong ito, malalaman niya kung sino at kung anong klaseng babae ang humihipo sa kanya—na siya ay makasalanan.”[a]
  to: Nang makita ito ng Pariseong nag-anyaya sa kanya, sinabi niya sa sarili, “Kung propeta ang taong ito, malalaman niya kung sino siya at kung anong uri siyang babae na humihipo sa kanya, na makasalanan siya[a].”
  rationale: Pinakinis ang sintaks upang malinaw na maipahayag ang dalawang diin ng τίς καὶ ποταπή—kung sino ang babae at kung anong uri siya—at upang ang “na makasalanan siya” ay tuwirang maiugnay sa nilalaman ng malalaman ng propeta. Inilipat ang panandang talababa sa mismong hulíng sugnay na saklaw nito. Napanatili ang kasalukuyang aspekto ng ἅπτεται sa “humihipo,” ang mapagdudang kondisyon, at ang kalabuan ng ὅτι sa talababa.
