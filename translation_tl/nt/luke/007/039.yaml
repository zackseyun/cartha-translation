  text: ἰδὼν δὲ ὁ Φαρισαῖος ὁ καλέσας αὐτὸν εἶπεν ἐν ἑαυτῷ λέγων· Οὗτος εἰ ⸀ἦν προφήτης, ἐγίνωσκεν ἂν τίς καὶ ποταπὴ ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ, ὅτι ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/039.yaml
  text: When the Pharisee who had invited him saw this[a], he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him[b], because she is a sinner.”
translation:
  language: tl
  text: Nang makita ito ng Pariseong nag-anyaya sa kanya, sinabi niya sa sarili, “Kung propeta ang taong ito, malalaman niya kung sino siya at kung anong uri siyang babae na humihipo sa kanya, na makasalanan siya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “sapagkat makasalanan siya.” Ang huling sugnay ay maaaring unawain bilang bahagi ng dapat niyang malaman o bilang dahilan kung bakit ganoon ang uri o reputasyon ng babae.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Nang makita ito
  rationale: Ginawang likas na sugnay na panahunan ang aorist participle; ang “ito” ay malinaw na tumutukoy sa naunang kilos. Hindi na kailangang tumbasan nang hiwalay ang mahinang panandang pasalaysay na δέ.
- source_word: ὁ Φαρισαῖος ὁ καλέσας αὐτὸν
  choice: ng Pariseong nag-anyaya sa kanya
  rationale: Sa konteksto ng salu-salo, ang καλέω ay nangangahulugang mag-anyaya, hindi lamang tumawag.
- source_word: εἶπεν ἐν ἑαυτῷ λέγων
  choice: sinabi niya sa sarili
  rationale: Likas na Filipino para sa panloob na pagsasalita; hindi kailangang ulitin nang literal ang εἶπεν at λέγων.
- source_word: Οὗτος
  choice: ang taong ito
  rationale: Pinananatili ang mapaglayong tono ng demonstratibo tungkol kay Jesus nang hindi ito ginagawang labis na mapanlait.
- source_word: εἰ ἦν προφήτης, ἐγίνωσκεν ἂν
  choice: Kung propeta ang taong ito, malalaman niya
  rationale: Ipinahihiwatig ng kondisyon ang pag-aalinlangan at salungat-sa-palagay na pangangatwiran ng Pariseo; natural itong naipapahayag sa Filipino sa anyong ito.
- source_word: τίς καὶ ποταπὴ
  choice: kung sino at kung anong klaseng babae
  rationale: 'Pinananatili ang dalawang diin: ang pagkakakilanlan ng babae at ang uri, asal, o reputasyon niya.'
- source_word: ἥτις ἅπτεται αὐτοῦ
  choice: ang humihipo sa kanya
  rationale: Ang kasalukuyang aspekto ay nagpapakita ng nagpapatuloy na paghipo sa tagpo; likas at sapat ang “humihipo” sa Filipino.
- source_word: ὅτι ἁμαρτωλός ἐστιν
  choice: na siya ay makasalanan
  rationale: Pinili ang content reading ng ὅτι upang mapanatili ang ugnayan nito sa kung ano ang malalaman ng propeta; inilalahad sa talababa ang posibleng sanhi o paliwanag na pagbasa.
theological_decisions:
- issue: Diwa ng kondisyong tungkol sa pagiging propeta ni Jesus
  choice: 'Ipinahayag bilang mapagdudang kondisyong salungat sa palagay ng nagsasalita: “Kung propeta ang taong ito, malalaman niya...”'
  alternative: 'Mas neutral na pagbasa: “Kung propeta ang taong ito, alam niya...”'
  rationale: Ang εἰ ἦν ... ἐγίνωσκεν ἂν ay likas na nagpapahiwatig na ipinapalagay ng Pariseong hindi propeta si Jesus. Pinananatili nito ang tensiyon ng salaysay nang hindi sinasang-ayunan ang kaniyang pasya.
- issue: Ugnayan ng ὅτι ἁμαρτωλός ἐστιν
  choice: 'Nilalaman ng dapat malaman: “na siya ay makasalanan”'
  alternative: 'Dahilan o paliwanag: “sapagkat makasalanan siya”'
  rationale: Posible sa Griyego ang dalawang ugnayan. Pinili sa teksto ang maayos na content reading at tahasang pinanatili sa talababa ang alternatibo.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “Pariseo,” “propeta,” at “makasalanan” bilang karaniwang terminong biblikal. Iniwasan ang sobrang literal na sintaks habang pinanatili ang pag-aalinlangan ng Pariseo at ang tunay na gramatikal na kalabuan ng huling sugnay.
