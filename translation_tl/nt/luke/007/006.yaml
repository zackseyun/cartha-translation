reference: Luke 7:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐπορεύετο σὺν αὐτοῖς. ἤδη δὲ αὐτοῦ οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας ἔπεμψεν ⸂φίλους ὁ ἑκατοντάρχης⸃ λέγων αὐτῷ· Κύριε, μὴ σκύλλου, οὐ γὰρ ⸂ἱκανός εἰμι⸃ ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/006.yaml
  text: So Jesus went with them[a]. But when he was already not far from the house, the centurion sent friends, saying to him, “Lord, do not trouble yourself[b], for I am not worthy that you should come under my roof.”
translation:
  language: tl
  text: Sumama si Jesus sa kanila. Ngunit nang hindi na siya gaanong malayo sa bahay, nagsugo ang senturyon ng mga kaibigan upang sabihin kay Jesus, “Panginoon[a], huwag po kayong mag-abala, sapagkat hindi ako karapat-dapat[b] na pumasok kayo sa ilalim ng aking bubong.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ginoo.” Ang Griyegong κύριε ay maaaring maging magalang na tawag at maaari ring magpahiwatig ng pagkilala sa awtoridad ni Jesus.
    reason: alternative_reading
  - marker: b
    text: O “angkop” o “nararapat.” Maaaring tumukoy ang salitang Griyego sa pagiging sapat, angkop, o karapat-dapat; dito ay ipinahahayag nito ang pagpapakumbaba ng senturyon sa harap ni Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο
  choice: sumama
  rationale: Ipinahihiwatig ng pandiwa at ng kasunod na σὺν αὐτοῖς na nagpunta si Jesus kasama nila; natural sa Filipino ang “sumama sa kanila” at napapanatili nito ang diwa ng patuloy na pagkilos.
- source_word: ἤδη ... οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας
  choice: nang hindi na siya kalayuan sa bahay
  rationale: Natural na temporal na sugnay ito sa Filipino at malapit sa tahasang diwa ng Griyegong “hindi malayo sa bahay.”
- source_word: ἔπεμψεν φίλους ὁ ἑκατοντάρχης
  choice: nagsugo ang senturyon ng mga kaibigan
  rationale: Pinananatili ang kilos ng pagsusugo, ang ugnayan ng mga isinugo sa senturyon bilang mga kaibigan, at ang tiyak na ranggong militar.
- source_word: Κύριε
  choice: Panginoon
  rationale: Karaniwang salin ng κύριε kapag tuwirang itinatawag kay Jesus; napapanatili nito kapwa ang magalang na pagtawag at ang posibleng pagkilala sa kanyang awtoridad.
- source_word: μὴ σκύλλου
  choice: huwag na po kayong mag-abala
  rationale: Ang idyoma ay nangangahulugang huwag nang mahirapan o maabala. Ang “po” ay likas na nagpapahayag ng paggalang sa modernong Filipino nang hindi dinaragdagan ang proposisyon.
- source_word: ἱκανός εἰμι
  choice: hindi ako karapat-dapat
  rationale: Sa konteksto, ipinahahayag ng senturyon ang kababaang-loob at kawalan niya ng pagiging angkop o marapat na tumanggap kay Jesus sa kanyang bahay.
- source_word: ὑπὸ τὴν στέγην μου
  choice: sa ilalim ng aking bubong
  rationale: Pinananatili ang kongkretong larawan at idyoma ng orihinal sa halip na gawing payak na “sa bahay ko.”
theological_decisions:
- issue: Pagpapakahulugan sa κύριε bilang tuwirang tawag kay Jesus
  choice: Panginoon
  alternative: Ginoo
  rationale: Maaaring isa lamang itong magalang na tawag, ngunit maaari ring magpahiwatig ng pagkilala sa awtoridad ni Jesus. Pinananatili ng “Panginoon” ang saklaw na iyon nang hindi iginigiit na isa na itong ganap na pahayag tungkol sa pagka-Diyos ni Jesus.
- issue: Diwa ng ἱκανός sa pagpapakumbaba ng senturyon
  choice: karapat-dapat
  alternative: angkop / nararapat
  rationale: Ang “karapat-dapat” ay natural sa Filipino at malinaw na naghahayag ng pagpapakumbaba, habang kinikilala sa talababa na maaari ring tumukoy ang salita sa pagiging angkop o sapat.
translation_notes:
  register: 'Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “senturyon” bilang tiyak at pamilyar na katawagan sa ranggong Romano. Ang “po” ay nagpapanatili ng magalang na himig ng pakiusap. Inilagay ang mga pananda ng talababa sa mismong mga salitang tinatalakay: “Panginoon[a]” at “karapat-dapat[b].”'
