  text: καὶ ἰδοὺ γυνὴ ⸂ἥτις ἦν ἐν τῇ πόλει⸃ ἁμαρτωλός, ⸀καὶ ἐπιγνοῦσα ὅτι ⸀κατάκειται ἐν τῇ οἰκίᾳ τοῦ Φαρισαίου, κομίσασα ἀλάβαστρον μύρου
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/037.yaml
  text: And behold[a], a woman in the city, who was a sinner, having learned that he was reclining at table in the Pharisee’s house[c][b], brought an alabaster jar of perfume.
translation:
  language: tl
  text: At narito, may isang babae sa lungsod na makasalanan.[a] Nang malaman niyang si Jesus ay nakahilig sa hapag[b] sa bahay ng Pariseo, nagdala siya ng isang sisidlang alabastro na may pabango.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “makasalanan” lamang ang tawag sa kanya; hindi tinukoy kung ano ang kanyang kasalanan.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, nakahilig ayon sa karaniwang ayos ng katawan sa isang pormal na kainan noon.
    reason: cultural_note
  - marker: c
    text: O “isang sisidlang alabastro na may mabangong langis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: masdan
  rationale: Pinananatili ang puwersa nitong pantawag-pansin at ang matingkad na pagpapakilala sa bagong tauhan.
- source_word: γυνὴ ἥτις ἦν ἐν τῇ πόλει
  choice: may isang babae sa lungsod
  rationale: Likas sa modernong Tagalog at hindi pinipilit ang mas tiyak na kahulugang ‘taga-lungsod’ o ‘naninirahan sa lungsod,’ na hindi tahasang sinasabi ng Griyego.
- source_word: ἁμαρτωλός
  choice: na makasalanan
  rationale: Inilalarawan ang babae bilang makasalanan nang hindi tinutukoy kung anong kasalanan ang kanyang nagawa.
- source_word: ἐπιγνοῦσα
  choice: nang malaman niya
  rationale: Malinaw at natural na ipinahahayag ang kilos na nauna sa pagdadala niya ng sisidlan.
- source_word: κατάκειται
  choice: nakahilig sa hapag
  rationale: Inilalarawan ang karaniwang ayos ng katawan sa pormal na pagkain noong panahong iyon, sa halip na palitan ito ng ‘nakaupo’ o ipakahulugang ‘kumakain.’
- source_word: ἐν τῇ οἰκίᾳ τοῦ Φαρισαίου
  choice: sa bahay ng Pariseo
  rationale: Direkta at natural na katumbas na nagpapanatili sa tiyak na Pariseong tinutukoy sa konteksto.
- source_word: κομίσασα
  choice: nagdala siya
  rationale: Payak at idyomatikong ipinahahayag na dinala niya ang bagay nang pumunta siya roon.
- source_word: ἀλάβαστρον μύρου
  choice: isang sisidlang alabastro na may pabango
  rationale: Pinananatili ang alabastro bilang materyal o katawagan sa sisidlan at inilalahad ang μύρον sa madaling maunawaang ‘pabango.’
theological_decisions:
- issue: Paglalarawan sa moral na kalagayan ng babae
  choice: makasalanan
  alternative: babaeng masama ang pamumuhay; babaeng bayaran
  rationale: ἁμαρτωλός lamang ang sinasabi ng Griyego. Hindi nito tinutukoy ang uri ng kanyang kasalanan, kaya hindi ipinapasok ang tradisyonal ngunit di-tahasang pagkakakilanlan sa kanya bilang isang babaeng bayaran.
- issue: Pagpapangalan sa lalaking nakahilig sa hapag
  choice: si Jesus
  alternative: siya
  rationale: Bagaman panghalip lamang ang ipinahihiwatig ng anyong pandiwa sa Griyego, malinaw sa naunang konteksto na si Jesus ang tinutukoy. Ginagawang malinaw ng pangalang ito ang Tagalog nang hindi binabago ang referent.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “masdan” upang mapanatili ang biglang pantawag-pansin ng ἰδοὺ; ang “nakahilig sa hapag” ay bahagyang pormal ngunit malinaw sa tulong ng talababa. Inayos ang mga talababa upang agad sumunod sa pariralang ipinaliliwanag ng bawat isa.
