  source_fidelity: 'Kailangan ng maliit ngunit mahalagang rebisyon. Ang “hindi ko rin” ay hindi sapat na katumbas ng nagpapatingkad na οὐδέ (“hindi man lang”), at ang “pagalingin ang lingkod ko” ay aktibong pautos na direktang nakatuon kay Jesus, samantalang ang ἰαθήτω ay ikatlong-panauhang pasibong pautos/jussive: “gumaling nawa ang lingkod ko.”'
  naturalness: Natural at marangal sa modernong Filipino Tagalog ang “hindi ko man lang itinuring ang sarili ko na karapat-dapat na lumapit sa iyo” at “gumaling nawa ang lingkod ko.” Ang “magsalita ka lamang” ay idiomatiko at maayos na naghahatid ng εἰπὲ λόγῳ nang hindi nagdaragdag ng isang tiyak na salitang wala sa Griyego.
  terminology: Ang “lingkod” ay angkop sa παῖς sa konteksto ng senturyon. Pinananatili ng talababa ang alternatibong saklaw na anak/batang lalaki/kabataan, nang hindi ipinipilit ang isa sa mga ito.
