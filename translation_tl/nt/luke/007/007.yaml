base_translation:
  language: en
  yaml_path: translation/nt/luke/007/007.yaml
  text: Therefore I did not even consider myself worthy to come to you. But say the word[a], and let my servant be healed.
translation:
  language: tl
  text: Kaya hindi ko man lang itinuring ang sarili ko na karapat-dapat na lumapit sa iyo. Ngunit magsalita ka lamang, at gumaling nawa ang lingkod ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “batang lalaki ko” o “anak ko.” Ang salitang Griyego ay maaaring tumukoy sa isang anak, kabataan, o lingkod, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kaya
  rationale: Ipinakikita ang bunga o paghihinuha mula sa naunang pahayag sa natural na modernong Tagalog.
- source_word: οὐδὲ
  choice: hindi ko rin
  rationale: 'Pinananatili ang dagdag na diin ng negasyon: hindi man lamang itinuring ng nagsasalita na karapat-dapat ang sarili niyang lumapit.'
- source_word: ἐμαυτὸν ἠξίωσα
  choice: itinuring ang sarili ko na karapat-dapat
  rationale: Tuwirang ipinahahayag ang diwang ‘itinuring na karapat-dapat’ at pinananatili ang reflexive na layon.
- source_word: πρὸς σὲ ἐλθεῖν
  choice: lumapit sa iyo
  rationale: Sa konteksto, natural na inilalarawan ang personal na pagpunta o paglapit kay Jesus.
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Malinaw at marangal na panandang nagpapakilala sa kasalungat na kahilingan.
- source_word: εἰπὲ λόγῳ
  choice: magsalita ka lamang
  rationale: Ang instrumental na λόγῳ ay tumutukoy sa bisa ng mismong pagsasalita; ang ‘lamang’ ay natural na naghahatid ng kahulugang sapat ang isang salita o utos, nang magdagdag ng tahasang pangngalang wala sa salin.
- source_word: ἰαθήτω
  choice: pagalingin
  rationale: Pinananatili ang ikatlong-panauhang pasibong pautos bilang kahilingang mangyari ang pagpapagaling, sa halip na gawing payak na panghinaharap.
- source_word: ὁ παῖς μου
  choice: ang lingkod ko
  rationale: Sa salaysay tungkol sa senturyon, ang ugnayang nasa ilalim ng kaniyang kapangyarihan ay pumapabor sa ‘lingkod,’ habang inilalagay sa talababa ang tunay na lawak ng kahulugan ng παῖς.
theological_decisions:
- issue: Kahulugan ng παῖς sa salaysay tungkol sa senturyon
  choice: ang lingkod ko
  alternative: ang batang lalaki ko; ang anak ko
  rationale: Malawak ang saklaw ng salita at hindi dapat paliitin nang walang paliwanag. Pinakamalinaw sa konteksto ang ‘lingkod,’ ngunit pinananatili sa talababa ang maaaring pahiwatig na kabataan o anak.
- issue: Puwersa ng ἰαθήτω
  choice: pagalingin
  alternative: gagaling
  rationale: Ang anyong Griyego ay pasibong pautos, hindi panghinaharap na paturol. Pinananatili ng salin ang kahilingang mangyari ang pagpapagaling at hindi ito tahimik na ginagawang prediksiyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang ‘lumapit’ sa halip na mas literal na ‘pumunta’ upang ihatid ang personal na pagharap kay Jesus. Ang marker na [a] ay inilagay kaagad pagkatapos ng ‘lingkod ko,’ ang salitang tinutukoy ng talababa.
