    issue: Hindi gaanong natural ang “sinakmal silang lahat ng takot.”
    rationale: Bagaman naipapakita nito ang puwersa ng ἔλαβεν ... φόβος πάντας, ang “sinakmal” ay karaniwang tumutukoy sa marahas na pagsakmal ng hayop o tao. Ang “sinaklot ng takot ang lahat” ay likas na idyomang Filipino at pinananatili ang biglaan at mapangibabaw na kilos.
  - severity: medium
    issue: Ang “Sinabi nila” ay masyadong hiwalay sa “niluluwalhati nila ang Diyos.”
    rationale: Ang λέγοντες ay participle na nagsasaad ng nilalaman o kasabay na paraan ng kanilang pagluwalhati. Ang “habang sinasabi” ay mas tapat sa ugnayang ito at mas maayos sa Filipino.
  - severity: low
