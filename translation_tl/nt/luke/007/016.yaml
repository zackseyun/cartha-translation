  text: ἔλαβεν δὲ φόβος πάντας, καὶ ἐδόξαζον τὸν θεὸν λέγοντες ὅτι Προφήτης μέγας ⸀ἠγέρθη ἐν ἡμῖν, καὶ ὅτι Ἐπεσκέψατο ὁ θεὸς τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/016.yaml
  text: And fear seized them all[a], and they were glorifying God, saying, “A great prophet has arisen among us[c][b], and God has visited his people.”
translation:
  language: tl
  text: At sinaklot ng takot ang lahat[a], at niluwalhati nila ang Diyos habang sinasabi, “Isang dakilang propeta ang bumangon sa gitna natin[b], at dinalaw ng Diyos ang kanyang bayan[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sinaklot ng takot ang lahat.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Isang dakilang propeta ang ibinangon sa gitna natin,” na higit na nagtatampok sa Diyos bilang kumikilos.
    reason: lexical_alternative
  - marker: c
    text: Ang “dinalaw” ay wikang biblikal para sa paglapit ng Diyos sa kanyang bayan nang may malasakit at mapagligtas na layunin.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλαβεν ... φόβος πάντας
  choice: sinakmal silang lahat ng takot
  rationale: Pinananatili nito ang takot bilang simuno ng idyoma at ang biglaan at matinding paghawak nito sa lahat. Hindi ginawang “pagkamangha” upang hindi alisin ang tensiyon ng φόβος.
- source_word: δὲ
  choice: At
  rationale: Banayad na pang-ugnay ito sa daloy ng salaysay; natural ang “At” nang hindi labis na binibigyang-diin ang pagkakasunod-sunod.
- source_word: ἐδόξαζον τὸν θεὸν
  choice: niluluwalhati nila ang Diyos
  rationale: Ang aspektong di-ganap ng pandiwa ay inilalarawan bilang nagpapatuloy na kilos sa konteksto, habang pinananatili ng “niluluwalhati” ang tuwirang ugnay sa δοξάζω.
- source_word: λέγοντες
  choice: Sinabi nila
  rationale: Natural itong panimula sa mismong nilalaman ng kanilang pagluwalhati sa Diyos; sa Filipino, mas malinaw ang hiwalay na pangungusap kaysa pilit na participial construction.
- source_word: Προφήτης μέγας
  choice: Isang dakilang propeta
  rationale: Ang “dakila” ay natural, marangal, at tuwirang nagpapahayag ng pagtataya ng μέγας.
- source_word: ἠγέρθη
  choice: bumangon
  rationale: Pinananatili nito ang larawan ng pagbangon at ang posibilidad na may di-tahas na banal na pagkilos, nang hindi tahasang nagpapasya kung aktibo o pasibong banal ang diin.
- source_word: ἐν ἡμῖν
  choice: sa gitna natin
  rationale: Natural na komunal na pagpapahayag ito para sa presensiya ng propeta sa kanilang kapulungan o bayan.
- source_word: Ἐπεσκέψατο
  choice: dinalaw
  rationale: Pinananatili nito ang biblikal na wikang pagdalaw, na maaaring magpahiwatig ng malasakit at mapagligtas na pagkilos nang hindi nililimitahan sa “tumulong” lamang.
- source_word: τὸν λαὸν αὐτοῦ
  choice: ang kanyang bayan
  rationale: Ang “bayan” ay angkop sa kolektibo at tipanang diwa ng λαός, at natural sa modernong Filipino.
theological_decisions:
- issue: Kahulugan ng φόβος matapos ang himala
  choice: takot
  alternative: pagkamangha o pagpipitagan
  rationale: Tuwirang pinananatili ng “takot” ang mas matinding salita ng Griyego at hinahayaang ang konteksto ang magpahiwatig kung may kasamang banal na pagpipitagan.
- issue: Diwa at tinig ng ἠγέρθη tungkol sa propeta
  choice: bumangon
  alternative: ibinangon
  rationale: Maaaring tumukoy ang anyong pasibo sa pagkilos ng Diyos sa pagbangon ng propeta, ngunit maaari rin itong idiomatikong maunawaan bilang paglitaw. Pinananatili ng pangunahing salin ang dalawang posibilidad hangga't maaari.
- issue: Diwa ng pagdalaw ng Diyos sa Ἐπεσκέψατο
  choice: dinalaw ng Diyos ang kanyang bayan
  alternative: dumating ang Diyos upang tulungan ang kanyang bayan
  rationale: Ang “dinalaw” ay nagpapanatili ng mayamang biblikal na idyoma ng mapagmalasakit at mapagligtas na pagharap ng Diyos, nang hindi ito ipinapaliwanag nang higit sa sinasabi ng talata.
- issue: Ugnayan ng dalawang ὅτι-clause
  choice: isang tuloy-tuloy na sipi na pinag-ugnay ng “at”
  alternative: 'dalawang magkahiwalay na pahayag: “...natin,” at, “Dinalaw...”'
  rationale: Ang dalawang magkatulad na sugnay ay kapwa nilalaman ng λέγοντες. Ang isang tuloy-tuloy na sipi ay natural sa Filipino at hindi nagbabago sa kanilang parallel na katangian.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinili ang “sinakmal” upang maipakita ang biglaan at malakas na puwersa ng idyoma; ang “niluluwalhati,” “dakilang propeta,” at “kanyang bayan” ay nagpapanatili ng biblikal na rehistro nang hindi nagiging lipas o labis na pormal.
