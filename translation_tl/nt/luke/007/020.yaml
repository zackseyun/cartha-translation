base_translation:
  language: en
  yaml_path: translation/nt/luke/007/020.yaml
  text: When the men came to him[a], they said, “John the Baptist has sent us to you, saying, ‘Are you the one who is to come, or should we expect another?’”
translation:
  language: tl
  text: Nang dumating sa kanya ang mga lalaking iyon, sinabi nila, “Isinugo kami sa iyo ni Juan na Tagapagbautismo upang itanong, ‘Ikaw ba ang darating[a], o may iba pa ba kaming aasahan?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang Darating.”
    reason: Ipinapakita ang posibleng pantitulong na pagbasa ng ὁ ἐρχόμενος nang hindi ito ipinipilit sa pangunahing salin.
lexical_decisions:
- source_word: παραγενόμενοι δὲ πρὸς αὐτόν
  choice: Nang lumapit sa kanya
  rationale: Ipinahahayag ang pagdating at paglapit ng mga sugo sa isang natural na salaysay sa modernong Tagalog.
- source_word: οἱ ἄνδρες
  choice: ang mga lalaki
  rationale: Pinananatili ang tiyak na panlalaking kahulugan ng ἄνδρες sa halip na gawing pangkalahatang ‘mga tao.’
- source_word: Ἰωάννης ὁ βαπτιστής
  choice: Juan na Tagapagbautismo
  rationale: Malinaw at likas na katumbas ng titulo ni Juan bilang taong nagbabautismo.
- source_word: ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων
  choice: Isinugo kami sa iyo … at ipinasasabi
  rationale: Natural na ipinapakita sa Tagalog ang pagsusugo at ang mensaheng ipinadala, nang hindi dinaragdagan ang nilalaman.
- source_word: ὁ ἐρχόμενος
  choice: ang Darating
  rationale: Pinananatili ang maikli at maaaring pantitulong na pahayag, pati ang mesiyanikong pahiwatig nito, nang hindi tahasang ipinapaliwanag kung sino ang tinutukoy.
- source_word: ἄλλον προσδοκῶμεν
  choice: iba ang dapat naming hintayin
  rationale: Ang deliberatibong tanong ay natural na naipahahayag sa Tagalog sa pamamagitan ng ‘dapat,’ samantalang ang ‘hintayin’ ay sumasaklaw sa pag-asang may darating.
theological_decisions:
- issue: Mesiyanikong puwersa ng ὁ ἐρχόμενος
  choice: ang Darating
  alternative: ang siyang darating
  rationale: Ang ‘ang Darating’ ay nagpapanatili sa posibleng pantitulong at eskatolohikal na puwersa ng parirala, ngunit hindi tahasang nagdaragdag ng salitang ‘Mesiyas’ na wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘ipinasasabi’ upang maging likas ang iniulat na mensahe, at pinanatili ang ‘mga lalaki’ dahil tiyak na panlalaki ang salitang Griyego.
