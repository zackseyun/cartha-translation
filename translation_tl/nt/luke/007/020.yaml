    issue: Hindi likas at kulang sa linaw ang “at ipinasasabi.”
    rationale: Ang ipinasasabi ay karaniwang nangangailangan ng malinaw na tagaganap o mas tiyak na balangkas. Ang λέγων ay nagpapakilala sa mensaheng ipinadala; “upang itanong” ay natural at tapat sa tungkuling iyon.
  - severity: low
    issue: Ang “iba” ay hindi tahasang nagpapahiwatig ng “another.”
    rationale: Ang “iba pa” ay mas malinaw na katumbas ng ἄλλον at nananatiling natural sa tanong.
  - severity: low
    issue: Medyo hindi natural ang “Nang lumapit sa kanya ang mga lalaki.”
    rationale: Ang παραγενόμενοι πρὸς αὐτόν ay pangunahing tumutukoy sa pagdating sa kanya. Ang “Nang dumating sa kanya ang mga lalaking iyon” ay mas likas na salaysay at pinananatili ang panlalaking reperensiya.
