  source_fidelity: Naisasalin ng draft ang pangunahing nilalaman, ngunit ang “ipinasasabi” ay hindi ganap na angkop sa aspektong pasalaysay at medyo malabo ang pagkakaugnay nito sa nagsugo. Ang “iba” ay maaari ring linawin bilang “iba pa” upang maipakita ang ἄλλον (“another”).
  naturalness: Mas natural sa modernong Filipino ang “dumating ... ang mga lalaking iyon” kaysa “lumapit ... ang mga lalaki” sa kontekstong ito, at ang “upang itanong” ay malinaw na paraan upang maipahayag ang layunin ng pagsusugo.
  terminology: Ang “Juan na Tagapagbautismo” ay katanggap-tanggap at malinaw. Ang maliit na titik sa “ang darating” ay nagpapanatili ng anyong deskriptibo/titular ng Griyego nang hindi nagpapataw ng capitalization na maaaring magmukhang interpretatibong titulo; ang footnote ay nag-aalok ng titular na alternatibo.
