id: LUK.7.12
reference: Luke 7:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς δὲ ἤγγισεν τῇ πύλῃ τῆς πόλεως, καὶ ἰδοὺ ἐξεκομίζετο τεθνηκὼς ⸂μονογενὴς υἱὸς⸃ τῇ μητρὶ αὐτοῦ, καὶ αὐτὴ ⸀ἦν χήρα, καὶ ὄχλος τῆς πόλεως ἱκανὸς ⸁ἦν σὺν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/012.yaml
  text: As he came near to the gate of the city[a], behold, a dead man was being carried out, the only son of his mother, and she was a widow, and a considerable crowd from the city was with her.
translation:
  language: tl
  text: Nang lumapit siya sa pintuang-daan ng lungsod, narito, isang patay na lalaki ang inilalabas—ang nag-iisang anak na lalaki ng kanyang ina[a]. Balo ang ina, at may maraming taong mula sa lungsod na kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kaisa-isang anak na lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἤγγισεν
  choice: Nang malapit na siya
  rationale: Likas na ipinahahayag sa Tagalog ang χρονικό na ugnayan at ang paglapit ni Jesus, habang ang banayad na puwersa ng δέ ay isinasama sa maayos na daloy ng salaysay.
- source_word: τῇ πύλῃ τῆς πόλεως
  choice: sa pintuan ng lungsod
  rationale: Tumutukoy ito sa pintuang-daan sa pader ng lungsod; malinaw at dignified ang “pintuan ng lungsod” sa modernong Tagalog.
- source_word: καὶ ἰδοὺ
  choice: narito
  rationale: Pinananatili ang puwersa ng ἰδού bilang panandang tumatawag ng pansin sa biglang tagpo, nang hindi nagiging labis na kolokyal.
- source_word: ἐξεκομίζετο τεθνηκώς
  choice: may inilalabas na isang bangkay
  rationale: Ipinahihiwatig ng imperpektong pasibo ang kilos na kasalukuyang nagaganap sa tagpo. Ang “bangkay” ay natural sa konteksto ng prusisyon para sa libing at malinaw na tumutukoy sa taong namatay.
- source_word: μονογενὴς υἱός
  choice: ang nag-iisang anak na lalaki
  rationale: Sa kontekstong pampamilya, ang μονογενής ay nangangahulugang nag-iisa o kaisa-isa, at nililinaw ng υἱός na lalaki ang anak. Hindi ipinapasok dito ang natatanging gamit ng salita sa mga tekstong Kristolohikal.
- source_word: τῇ μητρὶ αὐτοῦ
  choice: ng kanyang ina
  rationale: 'Ang datibo ay nagpapahayag ng ugnayan: siya ang nag-iisang anak na lalaki ng inang iyon.'
- source_word: καὶ αὐτὴ ἦν χήρα
  choice: Balo ang babae
  rationale: Natural na Tagalog ito at pinananatili ang tahasang pagbibigay-diin sa kalagayan ng ina.
- source_word: ὄχλος τῆς πόλεως ἱκανός
  choice: maraming tao mula sa lungsod
  rationale: Ipinahahayag ng ἱκανός ang malaking bilang nang hindi kinakailangang palakasin pa bilang napakalaking pulutong.
- source_word: ἦν σὺν αὐτῇ
  choice: kasama niya
  rationale: Tuwirang ipinapahayag ang pagsama ng mga tao sa balo; malinaw na sa konteksto na bahagi sila ng prusisyon.
theological_decisions:
- issue: Kahulugan ng μονογενής sa di-Kristolohikal na konteksto
  choice: ang nag-iisang anak na lalaki
  alternative: ang kaisa-isang anak na lalaki
  rationale: Inilalarawan dito ng μονογενής ang ugnayang pampamilya ng anak sa balo. Parehong posible ang “nag-iisa” at “kaisa-isa”; pinili ang una bilang natural sa modernong Tagalog, nang walang pag-angkat ng Kristolohikal na pakahulugan mula sa ibang konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Iniwasan ang labis na arkaikong “masdan” at ang mas kolokyal na “tingnan.” Inilipat ang marker [a] sa pariralang tinutukoy nito, sa halip na sa “lungsod.”
