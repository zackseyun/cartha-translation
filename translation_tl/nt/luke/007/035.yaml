translation:
  language: tl
  text: Gayunman, pinatunayang tama ng lahat ng kanyang mga anak ang karunungan[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kinilalang tama” o “naipakitang tama.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga anak” ay talinghaga para sa mga taong nagpapakita sa pamamagitan ng kanilang tugon o pamumuhay na tama ang karunungan.
    reason: lexical_alternative
  - marker: c
    text: 'Ganito ang mababasa sa Mateo 11:19: “Pinatunayang tama ng kanyang mga gawa ang karunungan.”'
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Gayunman
  rationale: Bagaman karaniwang nangangahulugang “at” ang καί, bahagyang pasalungat ang gamit nito rito kasunod ng puna ni Jesus sa salinlahing hindi nasisiyahan sa alinmang tugon.
- source_word: ἐδικαιώθη
  choice: pinatunayang tama
  rationale: Ipinapahayag dito ng aorist passive ng δικαιόω na ang karunungan ay naipakitang tama o kinilalang tama, hindi ang teknikal na diwang forensic na maaaring taglayin ng “inaring-ganap.” Napananatili rin ng “pinatunayang” ang tinig na balintiyak.
- source_word: ἡ σοφία
  choice: ang karunungan
  rationale: Ito ang tuwirang salin ng σοφία. Nananatili ang pagsasatao rito sa paglalarawan sa karunungan bilang may mga anak.
- source_word: ἀπὸ πάντων
  choice: ng lahat
  rationale: Sa balintiyak na pandiwa, maaaring tukuyin ng ἀπό ang gumaganap o pinagmumulan ng katibayan. Likas sa Filipino ang “ng lahat” upang ipahayag na silang lahat ang nagpapatunay na tama ang karunungan.
- source_word: τῶν τέκνων
  choice: mga anak
  rationale: Ang tuwirang kahulugan ng τέκνα ay “mga anak.” Pinananatili nito ang talinghaga sa Lucas sa halip na ipakahulugan agad bilang mga gawa, bunga, o tagasunod.
- source_word: αὐτῆς
  choice: kanyang
  rationale: Tumutukoy ang panghalip sa karunungan. Walang kasariang pambalarila ang panghalip sa Filipino, ngunit pinananatili ng “kanyang mga anak” ang pagsasatao at ugnayang nasa Griyego.
theological_decisions:
- issue: Kahulugan ng “mga anak” ng karunungan
  choice: Pinanatili sa pangunahing teksto ang literal na larawang “mga anak” bilang talinghaga para sa mga taong sa kanilang tugon o pamumuhay ay nagpapakitang tama ang karunungan.
  alternative: Maaaring unawain ang mga ito bilang mga bunga o kinalabasan ng karunungan, o iangkop sa “mga gawa” na mababasa sa Mateo 11:19.
  rationale: τέκνων (“mga anak”) ang teksto ng Lucas. Hindi ito pinalitan ng isang pagpapakahulugan upang mapanatili ang tunay na talinghaga at teolohikal na pag-igting ng pahayag.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Gayunman” para sa banayad na pagsalungat, at ang karaniwang pariralang “pinatunayang tama” upang maiwasan ang di-likas o labis na teknikal na pananalita. Pinanatili ang talinghagang “mga anak” at ang pagsasatao sa karunungan.
