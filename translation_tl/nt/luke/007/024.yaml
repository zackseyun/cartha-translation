  text: Ἀπελθόντων δὲ τῶν ἀγγέλων Ἰωάννου ἤρξατο λέγειν ⸂πρὸς τοὺς ὄχλους⸃ περὶ Ἰωάννου· Τί ⸀ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/024.yaml
  text: 'After John''s messengers had gone away[a], he began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed shaken by the wind?”'
translation:
  language: tl
  text: 'Nang makaalis na ang mga sugo ni Juan, nagsimula siyang magsalita sa mga tao tungkol kay Juan: “Ano ang pinunta ninyo sa ilang upang pagmasdan? Isang tambong inuugoy ng hangin?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπελθόντων
  choice: Nang makaalis na
  rationale: Ang aorist participle sa genitive absolute ay temporal at nagsasaad na naunang umalis ang mga sugo bago nagsalita si Jesus.
- source_word: ἀγγέλων
  choice: mga sugo
  rationale: Sa konteksto, mga taong isinugo ni Juan ang tinutukoy, hindi mga anghel. Ang “sugo” ay malinaw at marangal na katawagan sa mga mensahero.
- source_word: Ἰωάννου
  choice: ni Juan / kay Juan
  rationale: Ipinapakita ng unang genitive ang kaugnayan ng mga sugo kay Juan; ang περί Ἰωάννου naman ay likas na isinaling “tungkol kay Juan.”
- source_word: ἤρξατο λέγειν
  choice: nagsimula siyang magsalita
  rationale: Pinananatili nito ang inceptive force ng konstruksiyon at natural sa isang pahayag na nakatuon sa maraming tao.
- source_word: πρὸς τοὺς ὄχλους
  choice: sa mga tao
  rationale: Ang plural na ὄχλους ay tumutukoy sa mga kumpol o karamihan ng tao. Mas natural sa kasalukuyang Filipino ang “mga tao” kaysa “mga karamihan.”
- source_word: περὶ Ἰωάννου
  choice: tungkol kay Juan
  rationale: Direkta at natural na katumbas ng περί na may genitive sa konteksto ng pagsasalita.
- source_word: Τί ἐξήλθατε
  choice: Ano ang pinuntahan ninyo
  rationale: Ang τί ay nagtatanong kung ano ang bagay na nilayon nilang makita, hindi lamang kung bakit sila pumunta. Ang anyong ito ay natural sa Filipino at umaakay sa kasunod na tanong.
- source_word: εἰς τὴν ἔρημον
  choice: sa ilang
  rationale: Ang “ilang” ay maikli, dignificado, at angkop sa lugar na hindi matao na kaugnay ng ministeryo ni Juan; hindi nito ipinapalagay na puro buhangin ang pook.
- source_word: θεάσασθαι
  choice: upang pagmasdan
  rationale: Ipinahihiwatig ng pandiwa ang sadyang pagtingin o pagmamasid. Ang “pagmasdan” ay natural at pinananatili ang diin nang hindi makaluma.
- source_word: κάλαμον
  choice: isang tambo
  rationale: Ang κάλαμος ay isang halamang tambo; pinananatili nito ang literal na larawan ng isang halamang madaling gumalaw sa hangin.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: inuugoy ng hangin
  rationale: Inilalarawan nito nang natural sa Filipino ang tambong pinakikilos-pabalik-balik ng hangin, habang pinananatili ang larawan ng kawalang-katatagan.
theological_decisions:
- issue: Matalinghagang puwersa ng retorikal na tanong tungkol kay Juan
  choice: 'Pinanatili ang literal na larawan: “Isang tambong inuugoy ng hangin?”'
  alternative: “Isang taong mahina o pabago-bago?”
  rationale: Hindi tahasang ipinaliliwanag ng teksto ang metapora. Ang literal na larawan ay nagbibigay-daan sa mambabasa na madama ang pahiwatig tungkol sa katatagan ni Juan nang hindi isinasara ang retorikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at angkop sa pagbasa nang malakas. Ginamit ang “sugo,” “sa ilang,” at “pagmasdan” bilang pangkaraniwan ngunit marangal na mga salita. Walang talababa sapagkat walang lexical alternative na kailangang ilakip upang mapanatili ang tunay na kalabuan ng talata.
