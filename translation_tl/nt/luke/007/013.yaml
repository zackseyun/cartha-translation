base_translation:
  language: en
  yaml_path: translation/nt/luke/007/013.yaml
  text: And when the Lord saw her[a], he was moved with compassion for her and said to her, “Do not weep.”
translation:
  language: tl
  text: Nang makita ng Panginoon ang babae, nahabag siya sa babae at sinabi niya sa kanya, “Huwag kang umiyak.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Huwag kang tumangis” o “Tumigil ka na sa pag-iyak.” Maaaring unawain ang Griyego bilang pangkalahatang pagbabawal o bilang pagsasabing itigil niya ang kasalukuyan niyang pagdadalamhati.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Nang makita
  rationale: Ang aorist participle ay nagsasaad ng pangyayaring nauna sa pangunahing pandiwa; natural sa Tagalog ang sugnay na “Nang makita.”
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Pinananatili ang titulong ginagamit ng salaysay para kay Jesus at ang mataas na kristolohikal na himig ng Lucas.
- source_word: ἐσπλαγχνίσθη
  choice: nahabag
  rationale: Ang “nahabag” ay natural at marangal na Tagalog para sa malalim na awa o habag na ipinahihiwatig ng pandiwa.
- source_word: ἐπ’ αὐτῇ
  choice: sa babae
  rationale: Tinutukoy nito ang taong pinagbukulan ng habag. Ginamit ang “sa babae” upang maging malinaw at natural, at upang maiwasan ang sunod-sunod na malabong panghalip.
- source_word: εἶπεν αὐτῇ
  choice: sinabi rito
  rationale: Malapit ito sa karaniwang kahulugan ng λέγω at malinaw na ibinabalik ang tinutukoy sa babae.
- source_word: Μὴ κλαῖε
  choice: Huwag kang umiyak
  rationale: Pinananatili nito ang kahulugan ng κλαίω nang hindi tiyak na nilulutas kung pangkalahatang pagbabawal ito o utos na itigil ang kasalukuyang pag-iyak.
theological_decisions:
- issue: Pagpapakahulugan sa κύριος bilang titulo ni Jesus
  choice: Panginoon
  alternative: Guro o amo
  rationale: Sa salaysay ng Lucas, ang κύριος dito ay mataas na titulo para kay Jesus; ang “Panginoon” ang nagpapanatili nito nang hindi nagdaragdag ng paliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang makalumang ayos at pinanatili ang bahagyang aspektuwal na kalabuan ng utos.
