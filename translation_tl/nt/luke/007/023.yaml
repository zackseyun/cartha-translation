  text: καὶ μακάριός ἐστιν ὃς ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/023.yaml
  text: And blessed is the one who is not caused to stumble by me[a].
translation:
  language: tl
  text: At mapalad ang sinumang hindi natitisod dahil sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi sumasama ang loob sa akin” o “hindi tumatalikod dahil sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: pinagpala
  rationale: Pinananatili ng “pinagpala” ang relihiyoso at teolohikal na bigat ng salita sa mga pahayag ni Jesus; mas mababaw ang “masaya” at mas sekular ang “mapalad” sa kontekstong ito.
- source_word: ὃς ἐὰν μὴ
  choice: ang sinumang hindi
  rationale: Likas sa modernong Tagalog ang “ang sinumang” para sa pangkalahatang kundisyon at hindi nito nililimitahan sa kasarian ang tinutukoy.
- source_word: σκανδαλισθῇ
  choice: natitisod
  rationale: Pinananatili nito ang talinghaga ng pagkatisod at ang posibilidad na tumutukoy ang salita sa pagkatisod sa pananampalataya, sa halip na paliitin ito sa simpleng pagkayamot o emosyonal na pagkasaktan.
- source_word: ἐν ἐμοί
  choice: dahil sa akin
  rationale: Sa idyomang ito, ipinahihiwatig ng ἐν ang sanhi o pagkakataon ng pagkatisod. Malinaw at natural sa Tagalog ang “dahil sa akin,” samantalang maaaring maging malabo ang literal na “sa akin.”
theological_decisions:
- issue: Maaaring palambutin ang diwa ng pagkatisod dahil kay Jesus bilang simpleng pagkayamot lamang
  choice: 'Panatilihin ang larawan ng pagkatisod: “hindi natitisod dahil sa akin”'
  alternative: “hindi sumasama ang loob sa akin” o “hindi tumatalikod dahil sa akin”
  rationale: Saklaw ng pandiwa ang pagkatisod o pagdaramdam dahil kay Jesus na maaaring humantong sa pagtalikod. Hindi nilulutas ng salin kung emosyonal na pagdaramdam lamang o ganap na pagtalikod ang tinutukoy, kaya napapanatili ang tunay na lawak at tensiyon ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “sinumang” bilang likas at inklusibong pangkalahatang pagtukoy, at pinanatili ang biblikal na larawan ng pagkatisod.
