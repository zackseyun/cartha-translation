  text: And the dead man sat up and began to speak[a], and he gave him to his mother.
translation:
  language: tl
  text: Naupo ang patay na lalaki at nagsimulang magsalita. Ibinigay siya ni Jesus sa kanyang ina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ibinalik siya ni Jesus sa kanyang ina” o “ibinigay siyang muli ni Jesus sa kanyang ina.” Payak na “ibinigay siya sa kanyang ina” ang nasa Griyego; ipinahihiwatig ng konteksto ang pagbabalik ng anak sa kanyang ina.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεκάθισεν
  choice: umupo
  rationale: Tumutukoy ang pandiwa sa pag-upo mula sa pagkakahiga. Likas at tuwiran sa makabagong Tagalog ang “umupo,” nang hindi nagdaragdag ng kilos na hindi tahasang sinabi sa Griyego.
- source_word: ὁ νεκρός
  choice: ang namatay
  rationale: Mas natural at makatao sa Tagalog ang “ang namatay” kaysa “ang patay” o “ang bangkay.” Tinutukoy nito ang lalaking namatay ngunit ngayo'y muling nabuhay sa salaysay.
- source_word: ἤρξατο λαλεῖν
  choice: nagsimulang magsalita
  rationale: Tumpak nitong ipinapahayag ang aspektong pasimula ng ἤρξατο na sinusundan ng pawatas, at ang “magsalita” ay angkop sa marangal na tono ng salaysay.
- source_word: ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ
  choice: ibinigay siya ni Jesus sa kanyang ina
  rationale: Pinananatili ang payak na kahulugan ng ἔδωκεν na “ibinigay” sa halip na tahasang gawing “ibinalik.” Ginawang lantad ang paksang “Jesus” upang maiwasan ang kalituhan sa mga panghalip sa Tagalog; malinaw ito mula sa konteksto.
theological_decisions:
- issue: Kung tahasang ipahahayag na ibinalik ni Jesus ang anak sa kanyang ina
  choice: ibinigay siya ni Jesus sa kanyang ina
  alternative: ibinalik siya ni Jesus sa kanyang ina / ibinigay siyang muli ni Jesus sa kanyang ina
  rationale: Ipinahihiwatig ng konteksto ang pagpapanumbalik sa anak sa kanyang ina, ngunit ang Griyego ay gumagamit lamang ng δίδωμι, “ibinigay,” nang walang salitang tahasang nangangahulugang “muli” o “ibinalik.” Pinananatili ng salin ang pagkakaibang ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Hinati sa dalawang pangungusap ang magkakasunod na sugnay para sa likas na daloy, at ginamit ang “Pagkatapos” upang mapanatili ang pagsulong ng salaysay. Ang “ni Jesus” ay paglilinaw sa paksang nakatago sa pandiwang Griyego at sa naunang konteksto.
