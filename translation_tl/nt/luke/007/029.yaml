id: LUK.7.29
reference: Luke 7:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: (καὶ πᾶς ὁ λαὸς ἀκούσας καὶ οἱ τελῶναι ἐδικαίωσαν τὸν θεόν, βαπτισθέντες τὸ βάπτισμα Ἰωάννου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/029.yaml
  text: And all the people[a], when they heard this, including the tax collectors, declared God to be righteous[b], having been baptized with John's baptism.
translation:
  language: tl
  text: At nang marinig ito ng buong bayan, kasama ang mga maniningil ng buwis, kinilala nilang matuwid ang Diyos[a]—sila na nabautismuhan sa bautismo ni Juan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “inaring matuwid ang Diyos.” Ang ibig sabihin ay kinilala nilang nasa tama ang Diyos.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring unawain ang parirala bilang nagsasaad ng sanhi: “sapagkat nabautismuhan sila sa bautismo ni Juan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: buong bayan
  rationale: Pinananatili nito ang kolektibong diwa ng pang-isahang parirala at ang malawak na saklaw nito, nang hindi nagiging mabigat sa modernong Tagalog.
- source_word: ἀκούσας
  choice: nang marinig ito
  rationale: Likas na ipinahahayag sa Tagalog ang pang-abay na aorist participle bilang temporal na sugnay. Ang “ito” ay tumutukoy sa naunang sinabi sa konteksto.
- source_word: οἱ τελῶναι
  choice: mga maniningil ng buwis
  rationale: Ito ang malinaw at karaniwang modernong katawagan para sa mga nangongolekta ng buwis.
- source_word: ἐδικαίωσαν τὸν θεόν
  choice: kinilala nilang matuwid ang Diyos
  rationale: Ipinahihiwatig ng δικαιόω rito na kinilala o pinagtibay nilang nasa tama ang Diyos, hindi na ginawa nilang matuwid ang Diyos. Napananatili ng salin ang hudisyal na diwa nang hindi nakalilito.
- source_word: βαπτισθέντες
  choice: sila na nabautismuhan
  rationale: Ang pariralang panuring ay naglalahad ng kalagayan o pinagmulan ng kanilang tugon nang hindi tahasang nagpapasya kung temporal o sanhi ang ugnayan.
- source_word: τὸ βάπτισμα Ἰωάννου
  choice: sa bautismo ni Juan
  rationale: Maikli, natural, at malinaw na salin ng cognate construction, na tumutukoy sa bautismong isinagawa ni Juan.
theological_decisions:
- issue: Kahulugan ng “ἐδικαίωσαν τὸν θεόν”
  choice: Kinilala nilang matuwid at nasa tama ang Diyos.
  alternative: 'Mas pormal: “inaring matuwid ang Diyos.”'
  rationale: Tugon ng mga tao sa mensahe ng Diyos ang inilalarawan, hindi pagbabago sa pagiging matuwid ng Diyos. Iniiwasan ng pangunahing salin ang pahiwatig na tao ang gumawa sa Diyos na matuwid.
- issue: Ugnayan ng participleng “βαπτισθέντες” sa pangunahing pandiwa
  choice: 'Inilalahad ito bilang kalagayan o background: “sila na nabautismuhan.”'
  alternative: 'Maaaring unawaing sanhi: “sapagkat nabautismuhan sila sa bautismo ni Juan,” o temporal: “matapos silang mabautismuhan.”'
  rationale: Maaaring magpahiwatig ng sanhi o naunang pangyayari ang participle sa konteksto, ngunit hindi iyon tahasang itinatakda ng anyong Griyego. Hindi nilulutas ng pangunahing salin ang tunay na sintaktikong kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kasama” sa halip na “maging” o “kahit” upang hindi magdagdag ng diin na hindi tiyak sa Griyego. Ang dash bago sa participial phrase ay tumutulong na panatilihin itong pangkalahatang paglalarawan sa parehong buong bayan at mga maniningil ng buwis.
