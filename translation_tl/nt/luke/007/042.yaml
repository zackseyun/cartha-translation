  yaml_path: translation/nt/luke/007/042.yaml
  text: Since they did not have the means to repay[a], he graciously forgave both. So which of them will love him more?
translation:
  language: tl
  text: Dahil wala silang maibayad, pinatawad niya silang dalawa sa kanilang mga utang.[a] Kaya sino sa kanila ang higit na magmamahal sa kaniya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinawalang-bisa niya ang utang nilang dalawa.” Ang pandiwang Griyego ay maaaring mangahulugang malayang pagkakaloob o pagpapatawad sa dapat bayaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐχόντων αὐτῶν ἀποδοῦναι
  choice: Dahil wala silang maibayad
  rationale: Ang genitive absolute ay nagsasaad ng kalagayan o dahilan ng dalawang may utang. Likas sa modernong Tagalog ang “wala silang maibayad” at malinaw nitong ipinahihiwatig ang kawalan nila ng kakayahang magbayad.
- source_word: ἀμφοτέροις
  choice: kapwa ... sila
  rationale: Tumutukoy ito sa dalawang may utang; malinaw at natural sa Tagalog ang “kapwa niya sila.”
- source_word: ἐχαρίσατο
  choice: pinatawad sa kanilang utang
  rationale: Sa konteksto ng pagkakautang, nangangahulugan ang pandiwa ng kusang pagpapatawad o pagpapawalang-bisa sa dapat bayaran. Pinananatili ng saling ito ang ugnayan ng utang at pagpapatawad, samantalang inilalahad sa talababa ang mas tuwirang alternatibong pinansiyal.
- source_word: τίς οὖν αὐτῶν
  choice: Kaya sino sa kanila
  rationale: Ipinakikita ng “Kaya” ang lohikal na bunga o tanong na sumusunod mula sa ginawa ng nagpautang.
- source_word: πλεῖον ἀγαπήσει αὐτόν
  choice: ang higit na magmamahal sa kaniya
  rationale: Tuwirang pinananatili ang paghahambing sa antas ng pag-ibig at ang hinaharap na anyo ng pandiwa.
theological_decisions:
- issue: Pagpapakahulugan sa χαρίζομαι sa talinghaga tungkol sa utang
  choice: pinatawad sa kanilang utang
  alternative: pinawalang-bisa ang utang nilang dalawa
  rationale: Ang agarang larawan ay pinansiyal, ngunit ginagamit ng mas malawak na konteksto ang utang upang tumukoy sa pagpapatawad at pag-ibig. Pinananatili ng pangunahing salin ang dalawang larangang ito nang hindi nagdaragdag ng natatanging doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang karaniwang “maibayad” at “pinatawad sa kanilang utang” upang maging malinaw sa ordinaryong mambabasa habang pinananatili ang talinghaga at ang saklaw ng salitang Griyego.
