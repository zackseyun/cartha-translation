  text: οὗτός ἐστιν περὶ οὗ γέγραπται· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/027.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face[b], who will prepare your way before you.’'
translation:
  language: tl
  text: 'Siya ang tinutukoy ng nasusulat: “Narito, isinusugo ko ang aking mensahero[a] sa unahan mo,[b] na maghahanda ng iyong daan sa harapan mo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego para sa “mensahero” ay maaari ring isaling “anghel,” ngunit dito ay tumutukoy ito sa isang taong isinugo—si Juan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa harap ng iyong mukha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: Siya
  rationale: Tumutukoy ito nang may diin kay Juan; natural sa Filipino ang “Siya ang…” habang napapanatili ang lakas ng demonstratibo.
- source_word: περὶ οὗ γέγραπται
  choice: ang tinutukoy sa nasusulat
  rationale: Malinaw at natural na pormula ito para sa sipi mula sa Kasulatan, at pinananatili ang diwang “tungkol sa kanya ay nasusulat.”
- source_word: Ἰδοὺ
  choice: Narito
  rationale: Pinananatili nito ang marangal at pansin-tawag na himig ng propetikong sipi nang hindi nagiging lipas o mahirap unawain.
- source_word: ἀποστέλλω
  choice: isinusugo ko
  rationale: Ipinahahayag ng aspektong imperpektibo ang kasalukuyan at matingkad na pagkilos ng Diyos sa sipi.
- source_word: ἄγγελόν
  choice: mensahero
  rationale: Ang tinutukoy sa konteksto ay si Juan bilang taong isinugo, kaya mas malinaw ang “mensahero” kaysa “anghel,” bagaman kapuwa maaaring kahulugan ng salitang Griyego.
- source_word: πρὸ προσώπου σου
  choice: sa unahan mo
  rationale: Natural na Filipino ito para sa idyomang Griyego, habang ang literal na larawang “sa harap ng iyong mukha” ay inilalahad sa talababa.
- source_word: κατασκευάσει
  choice: maghahanda
  rationale: Tumpak at karaniwang salin ito ng pagkilos na gagawing handa ang daraanan.
- source_word: τὴν ὁδόν σου
  choice: iyong daan
  rationale: Pinananatili ng “daan” ang parehong kongkreto at metaporikal na bisa ng propetikong pananalita.
- source_word: ἔμπροσθέν σου
  choice: sa harapan mo
  rationale: Natural itong katumbas at bahagyang ipinag-iiba sa naunang “sa unahan mo,” gaya ng dalawang magkaibang parirala sa Griyego.
theological_decisions:
- issue: Paglalapat kay Juan ng siping propetiko na may mga panghalip na tumutukoy sa kausap
  choice: Pinanatili ang ikalawang panauhang “mo” at “iyong” nang walang idinagdag na pagkakakilanlan.
  alternative: Tahasan sa salin na sabihing inihahanda ni Juan ang daan para sa Panginoon o Mesiyas.
  rationale: Direktang inilalapat ng talata ang sipi ngunit hindi nito pinalalawak ang mga panghalip. Pinananatili ng salin ang teolohikal na bigat at tensiyon ng teksto nang hindi nagdaragdag ng paliwanag.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Ang “Narito” at “nasusulat” ay nagpapanatili sa pormal na himig ng sipi sa Kasulatan; ang “sa unahan mo” at “sa harapan mo” ay natural ngunit pinananatiling magkaiba upang katawanin ang dalawang magkaibang pariralang Griyego.
