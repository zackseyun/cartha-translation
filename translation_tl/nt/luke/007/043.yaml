base_translation:
  language: en
  yaml_path: translation/nt/luke/007/043.yaml
  text: Simon answered[a], “I suppose the one to whom he forgave more.” And he said to him[b], “You have judged rightly.”
translation:
  language: tl
  text: Sumagot si Simon, “Sa palagay ko[a], ang taong mas malaki ang utang na pinatawad[b] niya.” Sinabi niya sa kanya, “Tama ang paghatol mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Inaakala ko”; nagpapahayag ang Griyego ng isang maingat na paghinuha.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pinawalang-bisa”; sa konteksto ng talinghaga, maaaring tumukoy ang pandiwa sa kusang pagkansela ng utang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: Sumagot si Simon
  rationale: Ang participle at finite verb ay isang karaniwang Griyegong paraan ng pagpapakilala ng tugon; likas at buo itong naihahayag sa Filipino sa simpleng “Sumagot.”
- source_word: Ὑπολαμβάνω
  choice: Sa palagay ko
  rationale: Ipinahihiwatig nito ang maingat o pansamantalang paghinuha ni Simon, hindi ang ganap na katiyakan.
- source_word: ᾧ τὸ πλεῖον
  choice: ang taong mas malaking utang ang … niya
  rationale: Ginagawang malinaw sa likas na Filipino ang taong tumanggap ng kapatawaran at ang mas malaking halagang sangkot; ang “utang” ay tahasang ibinibigay ng agarang konteksto ng talinghaga.
- source_word: ἐχαρίσατο
  choice: pinatawad
  rationale: Sa konteksto ng utang, ang pandiwa ay tumutukoy sa kusang pagpapatawad o pagpapawalang-bisa ng pagkakautang at pinananatili rin nito ang ugnayan sa tema ng kapatawaran sa talata.
- source_word: Ὀρθῶς ἔκρινας
  choice: Tama ang paghatol mo
  rationale: Pinananatili ng “paghatol” ang leksikal na diwa ng κρίνω, samantalang natural na ipinapahayag ng buong parirala ang pagsang-ayon sa pasiyang kabibigay lamang ni Simon.
theological_decisions:
- issue: Ang diwa ng ἐχαρίσατο sa talinghaga
  choice: pinatawad
  alternative: pinawalang-bisa ang utang
  rationale: Pinagsasama ng “pinatawad” ang larawan ng pagpapatawad sa utang at ang mas malawak na tema ng kapatawaran sa salaysay, nang hindi nagdaragdag ng isang partikular na doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sa palagay ko” upang mapanatili ang pag-aatubili ni Simon, at ang “paghatol” upang hindi mawala ang diwa ng κρίνω.
