  text: ἐλήλυθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγετε· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, φίλος τελωνῶν καὶ ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/034.yaml
  text: The Son of Man has come eating and drinking[a], and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners!’
translation:
  language: tl
  text: Dumating na ang Anak ng Tao na kumakain at umiinom, at sinasabi ninyo, ‘Tingnan ninyo, isang taong matakaw at lasenggo,[a] kaibigan ng mga maniningil ng buwis at mga makasalanan!’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Tingnan ninyo, isang taong matakaw at manginginom ng alak.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: Dumating
  rationale: Likas na salin sa Filipino ng perpektong anyo sa kontekstong naghahambing sa pagdating ni Juan at ng Anak ng Tao; ipinahihiwatig ng kasunod na paglalarawan ang paraan ng kanyang pagdating.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang kinikilalang titulo ni Jesus at ang posibleng alusyong Danieliko nang hindi ito ipinapaliwanag sa loob ng salin.
- source_word: ἐσθίων καὶ πίνων
  choice: na kumakain at umiinom
  rationale: Natural na Filipino para sa mga participle na naglalarawan sa paraan o kalagayang kaakibat ng kanyang pagdating.
- source_word: λέγετε
  choice: sinasabi ninyo
  rationale: Ang aspektong imperpektibo ng pandiwang Filipino ay angkop sa kasalukuyan at paulit-ulit na paratang ng mga kausap.
- source_word: Ἰδοὺ
  choice: Tingnan ninyo!
  rationale: Pinananatili ang mapang-akit-pansing puwersa ng salitang Griyego sa kasalukuyan at dignified na Filipino.
- source_word: ἄνθρωπος
  choice: ang taong ito
  rationale: Ginagawang tahasan ang ἄνθρωπος at natural sa Filipino ang mapanuyang pagturo sa taong tinutukoy.
- source_word: φάγος
  choice: matakaw
  rationale: Karaniwan at malinaw na mapanirang bansag para sa taong labis kumain.
- source_word: οἰνοπότης
  choice: lasenggo
  rationale: Natural na pejoratibong katawagan sa modernong Filipino, na naghahatid sa puwersa ng paratang sa halip na neutral na ‘umiinom ng alak.’
- source_word: φίλος
  choice: kaibigan
  rationale: Tuwirang salin na pinananatili ang paratang tungkol sa pakikisama ni Jesus sa mga itinatakwil ng lipunan.
- source_word: τελωνῶν
  choice: mga maniningil ng buwis
  rationale: Malinaw at karaniwang modernong katawagan sa mga nangongolekta ng buwis.
- source_word: ἁμαρτωλῶν
  choice: mga makasalanan
  rationale: Pinananatili ang panlipunan at panrelihiyong bansag na ginamit ng mga kalaban ni Jesus.
theological_decisions:
- issue: Pagbibigay-salin sa titulong ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  alternative: ang Taong Anak / ang Tunay na Tao
  rationale: Pinananatili nito ang nakaugaliang Kristolohikal na titulo at ang posibleng intertekstuwal na pahiwatig, nang hindi nilulutas ang lawak ng kahulugan nito.
- issue: Tindi ng mga paratang laban kay Jesus
  choice: Matakaw at lasenggo ang taong ito
  alternative: isang taong matakaw at manginginom ng alak
  rationale: Ang konteksto ay mapanirang paratang ng mga kausap, hindi pagsang-ayon ng tagapagsalaysay; kaya pinananatili ang matalim at pejoratibong puwersa sa natural na Filipino.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Ginamit ang ‘lasenggo’ upang mapanatili ang talim ng paninirang-puri, samantalang inilagay sa talababa ang mas literal na ‘manginginom ng alak.’
