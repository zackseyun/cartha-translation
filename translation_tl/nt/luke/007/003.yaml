  text: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ ἀπέστειλεν πρὸς αὐτὸν πρεσβυτέρους τῶν Ἰουδαίων, ἐρωτῶν αὐτὸν ὅπως ἐλθὼν διασώσῃ τὸν δοῦλον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/003.yaml
  text: When he heard about Jesus[a], he sent to him elders of the Jews, asking him to come and save his servant.
translation:
  language: tl
  text: Nang marinig niya ang tungkol kay Jesus, nagsugo siya sa kanya ng mga nakatatanda sa mga Judio upang pakiusapan siyang pumunta at iligtas ang kanyang alipin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lingkod.” Ang salitang Griyego na doulos ay maaaring tumukoy sa isang lingkod o alipin, ayon sa konteksto; ginamit dito ang “alipin” upang ipakita ang katayuang alipin na ipinahihiwatig ng salita.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: Nang mabalitaan niya
  rationale: Ang aorist participle ay nagsasaad ng pangyayaring nauna sa pangunahing kilos. Likas sa Tagalog ang “Nang mabalitaan niya” at ipinahihiwatig na nakarating sa kanya ang balita tungkol kay Jesus.
- source_word: δὲ
  choice: —
  rationale: Mahinang pang-ugnay ito; sapat nang ipakita sa natural na daloy ng salaysay at hindi kailangang tumbasan nang tahasan.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: ang tungkol kay Jesus
  rationale: Tuwirang ipinapahayag ang kahulugang “tungkol kay Jesus,” gamit ang karaniwang anyo ng pangalan sa modernong Tagalog.
- source_word: ἀπέστειλεν πρὸς αὐτὸν
  choice: nagsugo siya sa kanya
  rationale: Pinananatili ang kilos ng pagsusugo at ang patutunguhan nito. Ang kasunod na parirala ang tumutukoy kung sino ang mga isinugo.
- source_word: πρεσβυτέρους τῶν Ἰουδαίων
  choice: ng mga pinuno ng mga Judio
  rationale: Sa kontekstong ito, ang πρεσβύτεροι ay kinikilalang mga lider ng pamayanan, hindi lamang matatandang lalaki. Mas malinaw ito sa karaniwang mambabasang Tagalog kaysa sa literal na “mga matatanda.”
- source_word: ἐρωτῶν αὐτὸν
  choice: upang pakiusapan siya
  rationale: Ipinapakita ng participle ang layunin ng pagsusugo at ang magalang na paghiling sa kontekstong ito.
- source_word: ὅπως ἐλθὼν
  choice: pumunta
  rationale: Natural na isinasama sa sugnay na “upang pakiusapan siyang pumunta” ang layunin at ang kilos ng pagdating nang hindi ginagawang mabigat ang pangungusap.
- source_word: διασώσῃ
  choice: iligtas
  rationale: Pinananatili ang malawak na diwa ng διασῴζω na iligtas o sagipin. Bagaman pisikal na paggaling ang hinihingi sa konteksto, hindi ito pinakikitid agad sa “pagalingin.”
- source_word: τὸν δοῦλον αὐτοῦ
  choice: ang kanyang alipin
  rationale: Ang δοῦλος dito ay taong nasa ilalim ng pagmamay-ari at kapangyarihan ng senturyon. Ang “alipin” ang pinakatapat na modernong Tagalog para sa nakagapos na katayuang panlipunan; inilalagay sa talababa ang mas tradisyonal na “lingkod.”
theological_decisions:
- issue: Paglilipat ng δοῦλος sa konteksto ng sambahayan
  choice: alipin
  alternative: lingkod
  rationale: Ipinahahayag ng “alipin” ang nakagapos at mababang katayuan ng taong nasa ilalim ng awtoridad ng senturyon. Gayunman, maaaring bigyang-diin ng konteksto ang paglilingkod, kaya pinananatili sa talababa ang “lingkod” bilang lehitimong alternatibo.
- issue: Saklaw ng διασώσῃ
  choice: iligtas
  alternative: pagalingin
  rationale: Ang salitang Griyego ay maaaring mangahulugang iligtas, sagipin, o dalhing ligtas sa panganib, at sa kontekstong ito ay tumutukoy sa malubhang karamdaman. Pinananatili ng “iligtas” ang mas malawak na leksikal na saklaw nang hindi itinatanggi ang pisikal na paggaling.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “mga pinuno” para sa kinikilalang mga lider ng pamayanang Judio at iniwasan ang “mga matatanda,” na maaaring mapagkamalang tumutukoy lamang sa edad. Ang talababa ay minarkahan sa pangunahing teksto bilang [a].
