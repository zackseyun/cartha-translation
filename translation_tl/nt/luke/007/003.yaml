revisions:
- from: Nang mabalitaan niya ang tungkol kay Jesus, nagsugo siya sa kanya ng mga pinuno ng mga Judio upang pakiusapan siyang pumunta at iligtas ang kanyang alipin.[a]
  to: Nang marinig niya ang tungkol kay Jesus, nagsugo siya sa kanya ng mga nakatatanda sa mga Judio upang pakiusapan siyang pumunta at iligtas ang kanyang alipin.[a]
  rationale: Ginawa ang mga pagbabago para maging mas tuwiran ang pagtutumbas sa ἀκούσας περὶ, mas malinaw ang πρεσβυτέρους bilang mga elder na may kinikilalang papel, at mas natural ang paliwanag ng talababa. Walang binagong kahulugan ng talata, at pinanatili ang sinadyang lawak ng “iligtas” para sa διασώσῃ.
