  text: Καὶ ἀπήγγειλαν Ἰωάννῃ οἱ μαθηταὶ αὐτοῦ περὶ πάντων τούτων. καὶ προσκαλεσάμενος δύο τινὰς τῶν μαθητῶν αὐτοῦ ὁ Ἰωάννης
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/018.yaml
  text: And his disciples reported all these things to John[a]. And John, calling two certain ones of his disciples[b],
translation:
  language: tl
  text: At iniulat ng kanyang mga alagad kay Juan ang lahat ng ito. At si Juan, nang tawagin niya ang dalawa sa kanyang mga alagad[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nagpapatuloy sa susunod na talata ang pangungusap sa Griyego.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: iniulat
  rationale: Ipinahahayag nito ang pagdadala o pagsasabi ng balita nang hindi nagpapahiwatig ng labis na pormalidad.
- source_word: Ἰωάννῃ
  choice: kay Juan
  rationale: Ang datibo ay tumutukoy sa pinag-ukulan ng ulat; natural sa Tagalog ang “kay Juan.”
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ang kanyang mga alagad
  rationale: Ang “mga alagad” ang malinaw at nakaugaliang salin sa konteksto ng ugnayan ng guro at tagasunod.
- source_word: περὶ πάντων τούτων
  choice: ang lahat ng ito
  rationale: Likas sa Tagalog na tuwirang gawing layon ng “iniulat” ang paksa ng ulat; pinananatili ng “lahat” ang kabuuang saklaw.
- source_word: προσκαλεσάμενος
  choice: Pagkatawag ... sa
  rationale: Ipinakikita ng pang-abay na pandiwaring ito na tinawag muna ni Juan ang mga alagad bago ang kilos sa kasunod na talata.
- source_word: δύο τινὰς τῶν μαθητῶν αὐτοῦ
  choice: dalawa sa kanyang mga alagad
  rationale: Ipinahahayag ng “dalawa sa” ang partitive genitive at sapat ding naihahatid ang di-tiyak na pagpili na ipinahihiwatig ng τινάς, nang hindi nagiging pilit ang Tagalog.
- source_word: ὁ Ἰωάννης
  choice: ni Juan
  rationale: Pinananatiling tahasan si Juan bilang gumagawa ng kilos, gaya ng Griyego.
