  verdict: revise
  source_fidelity: Tumpak na naihahatid ang dalawang may utang, ang isang nagpapautang na di-tiyak ngunit partikular, at ang magkaibang halagang 500 at 50 denario. Gayunman, sa ikalawang sugnay ay mas malinaw at mas ganap na ipahayag muli ang pagkakautang at ang yunit upang walang sandaling pagbasa na ang ikalawang tao mismo ang tinutukoy na “limampu.”
  naturalness: Natural ang “mga taong may utang,” “isang nagpapautang,” at “denario” sa modernong Filipino. Ang pag-uulit ng “may utang na” at “denario” sa huling sugnay ay nagpapabuti sa daloy at kalinawan nang hindi nagdaragdag ng kahulugan.
  terminology: Ang “denario” ay angkop na pagpapanatili ng makasaysayang yunit na δηνάριον. Ang talababa ay angkop na paliwanag at hindi nito ipinapantay nang eksakto ang halaga ng sinaunang salapi sa makabagong sahod.
