  text: δύο χρεοφειλέται ἦσαν δανιστῇ τινι· ὁ εἷς ὤφειλεν δηνάρια πεντακόσια, ὁ δὲ ἕτερος πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/041.yaml
  text: 'Two debtors owed a certain moneylender: one owed five hundred denarii[a], and the other fifty.'
translation:
  language: tl
  text: “May dalawang taong may utang sa isang nagpapautang. Ang isa ay may utang na limandaang denario[a], at ang isa naman ay may utang na limampung denario.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang denario ay karaniwang baryang pilak ng Roma na madalas iugnay sa humigit-kumulang isang araw na sahod ng isang manggagawa.
    reason: cultural_note
lexical_decisions:
- source_word: χρεοφειλέται
  choice: mga taong may utang
  rationale: Tuwirang ipinapahayag ang mga taong may pananagutang magbayad, at mas natural ito sa modernong Filipino kaysa sa teknikal na “mga debitor.”
- source_word: δανιστῇ τινι
  choice: sa isang nagpapautang
  rationale: Ang δανιστής ay taong nagpapautang ng salapi; natural na naihahatid ng “isang nagpapautang” ang di-tiyak ngunit partikular na tauhan na ipinakikilala ng τινι.
- source_word: ὤφειλεν
  choice: may utang na
  rationale: Natural na Filipino para sa umiiral na pagkakautang na inilalarawan ng imperfect sa salaysay.
- source_word: δηνάρια
  choice: denario
  rationale: Pinananatili ang tiyak na makasaysayang yunit ng salapi sa halip na palitan ito ng pangkalahatang “barya” o gawing katumbas agad ng arawang sahod.
- source_word: πεντακόσια
  choice: limandaan
  rationale: Tuwirang salin ng bilang na tumutukoy sa mga denario.
- source_word: ἕτερος
  choice: ang isa naman
  rationale: Sa Filipino, matapos ipakilala ang unang “ang isa,” natural ang “ang isa naman” para sa ikalawa; iniiwasan nito ang mabigat na “ang kabilang isa.”
- source_word: πεντήκοντα
  choice: limampu
  rationale: Tuwirang salin ng bilang; nauunawaan mula sa naunang sugnay na denario rin ang yunit.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang karaniwang pariralang “mga taong may utang” at pinanatili ang makasaysayang salitang “denario,” na ipinaliwanag sa talababa.
