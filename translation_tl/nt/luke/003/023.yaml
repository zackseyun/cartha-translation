id: LUK.3.23
reference: Luke 3:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ⸀ἦν Ἰησοῦς ⸂ἀρχόμενος ὡσεὶ ἐτῶν τριάκοντα⸃, ὢν ⸂υἱός, ὡς ἐνομίζετο⸃, Ἰωσὴφ τοῦ Ἠλὶ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/023.yaml
  text: And Jesus himself[a], when he began, was about thirty years old, being the son (as was supposed) of Joseph[c][b], of Heli.
translation:
  language: tl
  text: At si Jesus mismo ay mga tatlumpung taong gulang nang magsimula siya.[a] Siya ay anak—gaya ng inaakala[b]—ni Jose, na anak ni Eli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring unawain na “nang magsimula siya sa kanyang gawain.” Hindi tahasang binabanggit sa Griyego ang “gawain” o “ministeryo,” bagaman ito ang ipinahihiwatig ng konteksto.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, karaniwang itinuturing na anak ni Jose si Jesus.
    reason: clarification
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at ang pagpapatuloy ng salaysay mula sa naunang tagpo.
- source_word: αὐτὸς
  choice: mismo
  rationale: Ipinahahayag ang diin ng panghalip sa pariralang “si Jesus mismo.”
- source_word: ἀρχόμενος
  choice: nang magsimula siya
  rationale: Natural ito sa makabagong Tagalog at hindi idinaragdag sa pangunahing teksto ang “ng kanyang ministeryo,” na ipinahihiwatig ng konteksto ngunit wala sa Griyego.
- source_word: ὡσεὶ ἐτῶν τριάκοντα
  choice: mga tatlumpung taong gulang
  rationale: Karaniwang paraan ito sa Tagalog upang ipahayag ang tinatayang edad at mapanatili ang diwa ng ὡσεὶ.
- source_word: ὢν υἱός
  choice: Siya ay anak
  rationale: Ipinapasok nito ang talaangkanan sa malinaw at likas na Tagalog habang pinananatili ang pahayag tungkol sa pagiging anak.
- source_word: ὡς ἐνομίζετο
  choice: ayon sa palagay ng mga tao
  rationale: Ipinakikitang karaniwang pagkakilala ng publiko ang tinutukoy, hindi isang tuwirang paggigiit ng biyolohikal na pagkaama.
- source_word: Ἰωσὴφ τοῦ Ἠλὶ
  choice: ni Jose, na anak ni Eli
  rationale: Ang genitibong hanay ng talaangkanan ay eliptikal sa Griyego. Kailangang ulitin ang “anak” sa Tagalog upang maging malinaw at likas ang ugnayan ni Jose kay Eli.
theological_decisions:
- issue: Kaugnayan ng “ayon sa palagay” sa pagiging anak ni Jesus at kay Jose
  choice: Inilagay bilang singit na tuwirang tumutukoy sa pagkakilala kay Jesus bilang anak ni Jose.
  alternative: Isama nang walang paningit, na magiging hindi gaanong malinaw kung ano ang kinukuwalipika ng parirala.
  rationale: 'Pinananatili nito ang tensiyon sa salaysay ni Lucas: kinikilala si Jesus sa lipunan bilang anak ni Jose, samantalang naisalaysay na ni Lucas ang pambihirang paglilihi. Hindi nito ipinapaliwanag nang higit sa sinasabi ng talata.'
- issue: Kung idaragdag ang “ministeryo” pagkatapos ng “magsimula”
  choice: Hindi idinagdag sa pangunahing teksto; ipinaliwanag lamang sa talababa.
  alternative: “nang simulan niya ang kanyang ministeryo”
  rationale: Malamang na pampublikong gawain ni Jesus ang tinutukoy ayon sa konteksto, ngunit walang katumbas na pangngalan para sa “ministeryo” sa Griyego.
- issue: Elipsis sa “Ἰωσὴφ τοῦ Ἠλὶ”
  choice: “ni Jose, na anak ni Eli”
  alternative: “ni Jose, ni Eli”
  rationale: Ang literal na pag-uulit lamang ng “ni” ay malabo at di-likas sa Tagalog. Ang paglalagay ng “na anak” ay nagpapahayag ng karaniwang elipsis sa talaangkanan nang hindi nagpapasok ng bagong teolohikal na pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang gitling na paningit upang malinaw na maikabit ang “ayon sa palagay ng mga tao” sa pagiging anak ni Jesus kay Jose. Hinati sa dalawang pangungusap upang maiwasan ang mabigat at malabong pagkakasunod-sunod, habang pinananatili ang ugnayang panggramatika at ang simula ng talaangkanan.
