  text: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα, ἐγένετο ῥῆμα θεοῦ ἐπὶ Ἰωάννην τὸν Ζαχαρίου υἱὸν ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/002.yaml
  text: during the high priesthood of Annas and Caiaphas[a], the word of God came to John, the son of Zechariah, in the wilderness.
translation:
  language: tl
  text: Sa panahon ng panunungkulan bilang punong pari nina Anas at Caifas,[a] dumating ang salita ng Diyos kay Juan na anak ni Zacarias sa ilang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “sa pagiging punong pari nina Anas at Caifas.” Dalawa ang pinangalanan ni Lucas kahit isahan ang katungkulang tinutukoy.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα
  choice: noong panahon ng pagiging punong pari nina Anas at Caifas
  rationale: Ang ἐπί na may genitive ay temporal dito. Pinananatili ng “pagiging punong pari” ang anyong isahan ng ἀρχιερέως habang parehong binabanggit sina Anas at Caifas, nang hindi pinapawi ang tensiyong nasa Griyego.
- source_word: ἐγένετο ῥῆμα θεοῦ
  choice: dumating ang salita ng Diyos
  rationale: Likas itong salin sa Filipino ng pormulang propetiko tungkol sa paghahayag ng Diyos at naipapahayag ang pangyayaring ipinahihiwatig ng ἐγένετο.
- source_word: ἐπὶ Ἰωάννην
  choice: kay Juan
  rationale: Sa konteksto ng pagdating ng pahayag, natural na ipinapakita ng “kay” ang taong pinatunguhan nito.
- source_word: τὸν Ζαχαρίου υἱὸν
  choice: na anak ni Zacarias
  rationale: Malinaw at natural na kinikilala ng pariralang ito kung sinong Juan ang tinutukoy, habang pinananatili ang bahagyang pormal na himig ng salaysay.
- source_word: ἐν τῇ ἐρήμῳ
  choice: sa ilang
  rationale: Ang “ilang” ay tumutukoy sa liblib at kakaunti ang naninirahang pook, hindi kinakailangang mabuhanging disyerto, at angkop sa biblikal na konteksto ng ministeryo ni Juan.
theological_decisions:
- issue: Ang pagtukoy kina Anas at Caifas kaugnay ng isahang ἀρχιερέως
  choice: 'Panatilihing isahan ang katungkulan: “noong panahon ng pagiging punong pari nina Anas at Caifas”'
  alternative: “noong mga punong pari sina Anas at Caifas”
  rationale: Isahan ang ἀρχιερέως ngunit dalawang tao ang pinangalanan. Pinananatili ng salin ang historikal at pampanitikang tensiyon sa halip na ipaliwanag o pagtugmain ito sa mismong teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa ilang” bilang maikli at karaniwang katawagang biblikal; iniwasan ang mas mabigat na “sa ilang na pook.”
