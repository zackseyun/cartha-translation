revisions:
- from: Hawak niya ang kaniyang pala na pantahip[a] upang linising mabuti ang kaniyang giikan at tipunin ang trigo sa kaniyang kamalig.[b] Ngunit ang ipa ay susunugin niya nang lubusan sa apoy na hindi mapapatay.[c]
  to: Nasa kamay niya ang kaniyang pala na pantahip[a] upang lubusang linisin ang kaniyang giikan at tipunin ang trigo sa kaniyang kamalig,[b] ngunit susunugin niya ang ipa sa apoy na hindi maaapula.[c]
  rationale: Inayos ang di-likas na konstruksyong "upang linising mabuti" sa "upang lubusang linisin," pinili ang mas idiomatikong "hindi maaapula" para sa apoy, at nilinaw ang talababa tungkol sa πτύον. Hindi binago ng mga pagwawastong ito ang saklaw ng metapora o nagdagdag ng doktrinal na pagpapakahulugan.
