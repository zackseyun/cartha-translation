base_translation:
  language: en
  yaml_path: translation/nt/luke/003/017.yaml
  text: His winnowing fork is in his hand to thoroughly clear his threshing floor and to gather the wheat into his storehouse[c][b][a], but the chaff he will burn up with unquenchable fire.
translation:
  language: tl
  text: Nasa kamay niya ang kaniyang pala na pantahip[a] upang lubusang linisin ang kaniyang giikan at tipunin ang trigo sa kaniyang kamalig,[b] ngunit susunugin niya ang ipa sa apoy na hindi maaapula.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasangkapang pantahip,” “pala sa pagtatahip,” o “kalaykay na pantahip.” Ang salitang Griyego ay tumutukoy sa kasangkapang ginagamit upang ihagis sa hangin ang giniik na butil upang maihiwalay ang ipa.
    reason: lexical_alternative
  - marker: b
    text: O “imbakan ng butil.”
    reason: lexical_alternative
  - marker: c
    text: O “apoy na hindi mapapatay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: pala na pantahip
  rationale: Tumutukoy ito sa kasangkapang ginagamit upang ihagis sa hangin ang giniik na butil at maihiwalay ang ipa. Ang “pala na pantahip” ay malinaw sa makabagong Filipino at hindi nagpapahiwatig na karaniwang bentilador ang tinutukoy.
- source_word: διακαθᾶραι
  choice: linising mabuti
  rationale: Ipinahahayag ng tambalang pandiwa ang masinsinan o ganap na paglilinis; natural itong gamitin para sa paglilinis ng giikan.
- source_word: ἅλωνα
  choice: giikan
  rationale: Ito ang likas at maikling katawagang Filipino sa lugar kung saan ginigiik at tinatahip ang butil.
- source_word: συναγαγεῖν
  choice: tipunin
  rationale: Tumpak nitong inilalarawan ang pagsasama-sama at pag-iimbak sa butil matapos ang pagtahip.
- source_word: σῖτον
  choice: trigo
  rationale: Bagaman maaari itong mangahulugang butil sa mas malawak na diwa, trigo ang likas na kaibahan ng ipa sa larawang ito.
- source_word: ἀποθήκην
  choice: kamalig
  rationale: Karaniwang salitang Filipino ito para sa imbakan ng ani o butil at angkop sa larawang pansakahan.
- source_word: ἄχυρον
  choice: ipa
  rationale: Sa konteksto ng pagtahip, ito ang walang-silbing balat o magaang bahagi na inihihiwalay sa butil.
- source_word: κατακαύσει
  choice: susunugin niya nang lubusan
  rationale: 'Pinananatili ng “nang lubusan” ang masidhing diwa ng tambalang pandiwa: ganap na pagsunog, hindi lamang pagdingas.'
- source_word: πυρὶ ἀσβέστῳ
  choice: sa apoy na hindi mapapatay
  rationale: Malinaw at natural nitong ipinahahayag na ang apoy ay hindi maaapula, nang hindi dinaragdagan ang teolohikal na saklaw ng pahayag.
- source_word: οὗ … ἐν τῇ χειρὶ αὐτοῦ
  choice: Hawak niya ang kaniyang
  rationale: Natural na Filipino itong katumbas ng sugnay na naglalarawang nasa kamay ng darating na persona ang kasangkapan, habang pinananatili ang pagtukoy sa kaniya.
theological_decisions:
- issue: Larawan ng paghihiwalay at paghatol
  choice: Pinanatili ang malinaw na paghihiwalay ng trigo at ipa, kasama ang pag-iimbak sa trigo at lubusang pagsunog sa ipa.
  alternative: Ipaliwanag ito bilang pansamantalang paghatol lamang sa Israel, o bilang ganap nang sistematikong paglalarawan sa pangwakas na impiyerno.
  rationale: Ang talata mismo ay gumagamit ng matinding larawan ng pagliligtas at paghatol ngunit hindi nito tahasang nililinaw ang lahat ng detalye ng katuparan. Kaya pinananatili ng salin ang lakas at tensiyon ng larawan nang walang idinadagdag na partikular na sistemang doktrinal.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Ginamit ang mga terminong pansakahan na “pala na pantahip,” “giikan,” “kamalig,” at “ipa”; ipinaliwanag sa talababa ang hindi gaanong pamilyar na kasangkapan. Pinanatili ang mariing puwersa ng paghatol sa “nang lubusan” at “hindi mapapatay” nang hindi pinalalawak ang sinasabi ng teksto.
