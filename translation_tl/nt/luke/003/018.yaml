  text: So with many other exhortations as well[a], he was proclaiming the good news to the people.
translation:
  language: tl
  text: Kaya, sa marami pang ibang paghihimok, ipinangangaral ni Juan sa mga tao ang mabuting balita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πολλὰ ... καὶ ἕτερα
  choice: marami pang
  rationale: Ang ουδέτερο πληθυντικό na ginamit bilang pangngalan ay tumutukoy sa marami pang bagay o salita; natural itong naipapahayag sa Filipino bilang “marami pang,” habang ipinahihiwatig ng kasunod na pandiwa na mga pangaral ang tinutukoy.
- source_word: μὲν οὖν
  choice: Kaya
  rationale: Minamarkahan nito ang pagpapatuloy at paglalagom o transisyon mula sa naunang salaysay. Ang “Kaya” ay natural at hindi labis na naghihimay sa dalawang partikulo.
- source_word: παρακαλῶν
  choice: sa pamamagitan ... ng mga pangaral
  rationale: Sa konteksto ng pangangaral ni Juan, ang παρακαλέω ay may diwang humihimok at nagpapayo nang mariin. Saklaw ng “pangaral” ang moral na paghihikayat at babala nang hindi nagiging teknikal.
- source_word: εὐηγγελίζετο
  choice: ipinangangaral ... ang magandang balita
  rationale: Pinananatili ng “ipinangangaral ang magandang balita” ang tahasang diwa ng pagpapahayag ng mabuting balita. Ang anyong nagaganap sa nakaraan ay likas na naihahatid sa Filipino sa tuloy-tuloy na salaysay.
- source_word: τὸν λαόν
  choice: sa mga tao
  rationale: Tumpak at natural na katumbas ito ng λαός sa agarang konteksto, nang hindi nililimitahan ang tinutukoy sa “karamihan” o tahasang dinaragdagan ng “Israel.”
- source_word: implicit subject
  choice: Juan
  rationale: Bagaman ipinahihiwatig lamang ng Griyego ang paksa, malinaw sa konteksto na si Juan ang gumagawa. Ang pagbanggit sa pangalan ay kailangan para sa malinaw at natural na nagsasariling talata sa Filipino.
theological_decisions:
- issue: Lakas ng εὐηγγελίζετο kaugnay ng ministeryo ni Juan
  choice: ipinangangaral ... ang magandang balita
  alternative: nangangaral / nagpapahayag
  rationale: Tahasan mismong inilalarawan ng Griyego ang mensahe ni Juan bilang mabuting balita. Hindi ito dapat pahinain at gawing pangkalahatang pangangaral lamang.
- issue: Ugnayan ng pangaral at mabuting balita
  choice: Pinanatiling magkasama ang paghihimok at pagpapahayag ng magandang balita
  alternative: Ihiwalay ang moral na pangaral sa ebanghelyong pagpapahayag
  rationale: Magkasamang inilalahad ng talata ang παρακαλῶν at εὐηγγελίζετο; pinananatili nito ang tensiyong ang mensahe ni Juan ay kapwa mapanghamon at mabuting balita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pangaral” sa diwang paghihimok o mariing pagpapayo, hindi bilang pangalang teknikal ng isang sermon. Ang “magandang balita” ay madaling maunawaan at pinananatili ang ebanghelyong diwa ng pandiwang Griyego.
