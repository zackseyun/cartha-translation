id: LUK.3.19
reference: Luke 3:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ὁ τετραάρχης, ἐλεγχόμενος ὑπ’ αὐτοῦ περὶ Ἡρῳδιάδος τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν ὁ Ἡρῴδης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/019.yaml
  text: But Herod the tetrarch[a], being rebuked by him concerning Herodias, his brother’s wife, and concerning all the evil things Herod had done,
translation:
  language: tl
  text: Ngunit si Herodes na tetrarka[a], na sinasaway niya[b] tungkol kay Herodias, na asawa ng kanyang kapatid, at tungkol sa lahat ng masasamang bagay na ginawa ni Herodes,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tetrarka ay isang makasaysayang titulong pampolitika para sa isang pinunong namamahala sa isang rehiyon.
    reason: historical_title
  - marker: b
    text: 'Maaari ring isalin: “pinagsasabihan” o “inilalantad ang kanyang maling ginawa.” Maaaring tumukoy ang pandiwaring Griyego sa moral na pagsaway o sa paglalantad ng maling gawa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τετραάρχης
  choice: tetrarka
  rationale: Pinanatili ang tiyak na makasaysayang titulong pampolitika sa halip na gawing pangkalahatang “pinuno”; ipinaliliwanag ito sa talababa para sa karaniwang mambabasa.
- source_word: ἐλεγχόμενος
  choice: habang sinasaway
  rationale: Ipinahihiwatig ng kasalukuyang pasibong pandiwaring Griyego ang kasabay o nagpapatuloy na pagsaway. Taglay ng “sinasaway” ang moral na bigat ng pagpuna, habang hindi nito isinasara ang posibilidad na kasama rito ang paglalantad ng kasamaan.
- source_word: ὑπ’ αὐτοῦ
  choice: siya nito
  rationale: Pinanatili ang panghalip ng Griyego. Sa konteksto, ang “nito” ay tumutukoy kay Juan, ngunit hindi ito ginawang tahasang pangngalan sa pangunahing teksto.
- source_word: περὶ Ἡρῳδιάδος
  choice: tungkol kay Herodias
  rationale: Likas na salin ito ng περὶ at pinananatili ang ugnayan nito sa ikalawang pariralang nagsisimula rin sa περὶ.
- source_word: τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ
  choice: na asawa ng kanyang kapatid
  rationale: Malinaw at natural sa modernong Tagalog, at pinananatili ang relasyong sentro ng paratang.
- source_word: καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν
  choice: at tungkol sa lahat ng masasamang bagay na ginawa ni Herodes
  rationale: Pinananatili ang malawak na pagtukoy sa lahat ng masasamang gawa at ang tahasang pag-ulit sa pangalang Herodes sa Griyego.
- source_word: πονηρῶν
  choice: masasamang bagay
  rationale: Direkta, malinaw, at malawak ang saklaw, gaya ng pangmaramihang anyo sa Griyego.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang salungat na paglipat ng salaysay mula sa naunang pahayag.
theological_decisions:
- issue: Lakas ng moral na pagpuna ni Juan kay Herodes
  choice: habang sinasaway
  alternative: habang pinagsasabihan; habang inilalantad ang kasalanan
  rationale: Pinananatili ang propetikong moral na pagpuna sa kilos ni Herodes nang hindi ito ginagawang espesipikong legal na paratang o dinaragdagan ng doktrinang wala sa talata.
- issue: Pagkakakilanlan ng gumagawa ng pagsaway
  choice: nito
  alternative: ni Juan
  rationale: Bagaman malinaw sa konteksto na si Juan ang tinutukoy, panghalip ang ginamit ng Griyego; pinanatili ito upang hindi gawing mas tahasan ang talata kaysa sa pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang anyong hindi tapos ng pangungusap at ang pangwakas na kuwit dahil nagpapatuloy ang sintaks sa susunod na talata. Ginamit ang “tetrarka” bilang teknikal na titulong pangkasaysayan, na may maikling paliwanag sa talababa.
