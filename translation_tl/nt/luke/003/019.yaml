  naturalness: Mas natural sa modernong Filipino ang sugnay na “na sinasaway niya” kaysa “habang sinasaway siya nito.” Mas malinaw rin ang daloy ng parirala habang pinananatili ang hindi pa tapos na pangungusap at pangwakas na kuwit ng Griyego.
