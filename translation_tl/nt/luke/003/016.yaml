  text: ἀπεκρίνατο ⸂λέγων πᾶσιν ὁ Ἰωάννης⸃· Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς· ἔρχεται δὲ ὁ ἰσχυρότερός μου, οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ καὶ πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/016.yaml
  text: John answered them all[a], saying, “I indeed baptize you with water, but one stronger than I is coming, whose sandal strap I am not worthy to untie[d][c][b]. He will baptize you in the Holy Spirit and fire.”
translation:
  language: tl
  text: Sumagot si Juan sa kanilang lahat, “Binabautismuhan ko kayo sa tubig, ngunit darating ang higit na makapangyarihan kaysa sa akin. Hindi ako karapat-dapat na kalagin ang tali ng kanyang mga sandalyas. Babautismuhan niya kayo sa Espiritu Santo at apoy.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “apoy” ay maaaring tumukoy sa paglilinis, paghatol, o maging bahagi ng iisang larawan ng bautismo sa Espiritu at apoy; hindi ito nililinaw ng parirala mismo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίνατο λέγων πᾶσιν ὁ Ἰωάννης
  choice: Sumagot si Juan sa kanilang lahat
  rationale: Likas sa modernong Tagalog ang pinaikling pormulang ito; ang λέγων ay hindi kailangang isalin nang hiwalay sapagkat naipahihiwatig na ito ng tuwirang pananalita. Pinananatili ng “sa kanilang lahat” ang πᾶσιν.
- source_word: Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς
  choice: Binabautismuhan ko kayo sa tubig
  rationale: Naipahahayag ng ayos at ng kasunod na “ngunit” ang paghahambing na inihahanda ng μέν. Ang “sa tubig” ay natural at pinananatili ang maaaring kahulugang elemento o paraan ng datibong ὕδατι.
- source_word: βαπτίζω / βαπτίσει
  choice: binabautismuhan / babautismuhan
  rationale: Ang “bautismo” at mga anyong pandiwa nito ay karaniwang katawagan sa salaysay ng Ebanghelyo. Iniiwasan nitong ipilit ang mas tiyak at maaaring denominasyonal na “ilulubog.”
- source_word: ἔρχεται δὲ ὁ ἰσχυρότερός μου
  choice: ngunit darating ang higit na makapangyarihan kaysa sa akin
  rationale: Malinaw na inihahayag ng “ngunit” ang kontrast, at ang “higit na makapangyarihan” ay natural na salin ng paghahambing sa ἰσχυρότερος. Ang hinaharap na “darating” ay angkop sa nalalapit na pagdating na tinutukoy.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: Hindi ako karapat-dapat
  rationale: Sa pormulang ito ng pagpapakumbaba, ang ἱκανός ay tumutukoy sa pagiging karapat-dapat o nararapat, hindi lamang sa kakayahan.
- source_word: λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: kahit magkalag ng tali ng kanyang mga sandalyas
  rationale: Ang “magkalag ng tali” ay malinaw at kasalukuyang Tagalog para sa λῦσαι τὸν ἱμάντα. Idinagdag ang “kahit” bilang natural na pagpapahayag ng sukdulang pagpapakumbaba na likas sa pahayag, hindi bilang bagong gawain o ideya.
- source_word: αὐτὸς ὑμᾶς βαπτίσει
  choice: Babautismuhan niya kayo
  rationale: Ang “niya” ay tumutukoy nang malinaw sa darating na higit na makapangyarihan; ang pagkakasunod ng mga pangungusap ay sapat upang maipakita ang diin at paghahambing ng αὐτός.
- source_word: ἐν πνεύματι ἁγίῳ καὶ πυρί
  choice: sa Espiritu Santo at apoy
  rationale: Ang “sa” ay nagpapanatili sa malawak na saklaw ng ἐν bilang elemento, larangan, o paraan. Ang “Espiritu Santo” ay tumutukoy sa banal na Espiritu, at ang “apoy” ay iniwang walang paliwanag upang hindi lutasin sa salin ang tunay na ambiguwidad.
theological_decisions:
- issue: Kahulugan ng bautismo “sa Espiritu Santo at apoy”
  choice: Panatilihin ang maikli at tuwirang pariralang “sa Espiritu Santo at apoy.”
  alternative: Ipaliwanag ang apoy bilang paglilinis, o hatiin ang pahayag bilang bautismo sa Espiritu para sa ilan at apoy ng paghatol para sa iba.
  rationale: Hindi tahasang nilulutas ng mismong sugnay kung ang apoy ay paglilinis, paghatol, o kaugnay na aspekto ng iisang larawan. Pinananatili ng salin ang teolohikal na tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang karaniwang katawagang “bautismo,” “Espiritu Santo,” at “sandalyas”; iniwasan ang arkaiko, sobrang literal, at denominasyonal na pananalita.
