  text: And he said to them[a], “Collect no more than what has been ordered for you.”
translation:
  language: tl
  text: Sinabi niya sa kanila[a], “Huwag kayong maningil nang higit sa itinakda para sa inyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas pormal na salin: “Huwag kayong gumawa ng higit pa sa itinakda para sa inyo.” Sa konteksto, ang pandiwa ay partikular na tumutukoy sa kanilang gawain ng paniningil ng buwis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Sinabi niya
  rationale: Ang δέ ay banayad na pang-ugnay; hindi kailangang tahasang isalin sa Filipino dahil likas na naipagpapatuloy ng ayos ng pangungusap ang salaysay at hindi nito pinalalakas ang diwang pasalungat.
- source_word: εἶπεν πρὸς αὐτούς
  choice: Sinabi niya sa kanila
  rationale: Tuwirang katumbas ito ng λέγω + πρός at natural, malinaw, at marangal sa modernong Filipino.
- source_word: Μηδὲν πλέον
  choice: Huwag kayong … nang higit
  rationale: Ipinahahayag nito ang pagbabawal sa anumang labis; ang hulmaing Filipino ay natural kapag iniugnay sa pandiwang “maningil.”
- source_word: παρὰ τὸ διατεταγμένον ὑμῖν
  choice: sa itinakda para sa inyo
  rationale: Ang διατεταγμένον ay tumutukoy sa opisyal na iniutos, itinakda, o ipinagawa. Pinananatili ng “itinakda” ang diwang regulatibo nang hindi tinutukoy kung sino ang nagtakda.
- source_word: πράσσετε
  choice: maningil
  rationale: Bagaman malawak na nangangahulugang “gawin” ang πράσσω, tumutukoy ito rito sa gawain ng mga maniningil ng buwis na kausap ni Juan sa naunang talata. Ang “maningil” ay natural na pagpapahayag ng ipinahihiwatig na gawain.
theological_decisions:
- issue: Pagtiyak sa ipinahihiwatig na gawain sa πράσσετε
  choice: “Huwag kayong maningil nang higit…”
  alternative: “Huwag kayong gumawa ng anumang higit…”
  rationale: Nililinaw ng pangunahing salin ang gawaing ipinahihiwatig ng agarang konteksto—ang paniningil ng buwis—nang hindi nagdaragdag ng bagong teolohikal na diwa. Inilalagay sa talababa ang mas pormal at malawak na anyo upang mapanatili ang leksikal na saklaw ng pandiwang Griyego.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “maningil” sa pangunahing teksto dahil malinaw sa konteksto ang gawain, habang pinanatili sa talababa ang mas literal na saklaw ng πράσσετε.
