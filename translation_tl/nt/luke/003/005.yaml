base_translation:
  language: en
  yaml_path: translation/nt/luke/003/005.yaml
  text: Every valley will be filled[a], and every mountain and hill will be made low, and the crooked places will become straight[b], and the rough ways smooth roads.
translation:
  language: tl
  text: Bawat lambak ay mapupuno[a], at bawat bundok at burol ay pabababain. Ang mga liko ay magiging tuwid[b], at ang mga baku-bakong daan ay magiging makinis na daan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bawat bangin ay mapupuno.”
    reason: lexical_alternative
  - marker: b
    text: Umaalingawngaw ang linyang ito sa Isaias 40:4 at gumagamit ng larawan ng paggawa ng daan bilang paghahanda sa daan ng Panginoon.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσα φάραγξ
  choice: Bawat lambak
  rationale: Ang φάραγξ ay maaaring tumukoy sa lambak, bangin, o malalim na guwang. Ang “lambak” ay natural at malinaw sa makabagong Tagalog at angkop sa larawang propetiko ng pagpapantay ng lupain.
- source_word: πληρωθήσεται
  choice: ay pupunuin
  rationale: Hinaharap na balintiyak ng πληρόω; tuwirang pinananatili ang larawan ng pagpuno sa mababang bahagi ng lupain.
- source_word: πᾶν ὄρος καὶ βουνός
  choice: bawat bundok at burol
  rationale: Pinanatili ang dalawang magkalapit ngunit magkaibang katawagan upang maipakita ang kabuuan at panulaan ng Griyego.
- source_word: ταπεινωθήσεται
  choice: ay pabababain
  rationale: Sa kontekstong topograpiko, ang ταπεινόω ay tumutukoy sa pagpapababa ng mataas na lupa. Ang “pabababain” ay kongkreto ngunit nananatiling may propetikong alingawngaw.
- source_word: τὰ σκολιά
  choice: ang mga liko
  rationale: Ang pang-uring ουδέτερο na ginamit bilang pangngalan ay tumutukoy sa mga baluktot o liku-likong bahagi. Ang “mga liko” ay natural at hindi nagdaragdag ng tahasang pangngalang wala rito sa Griyego.
- source_word: εἰς εὐθείαν
  choice: ay magiging tuwid
  rationale: Ipinahahayag ng parirala ang bunga ng pagbabago; natural na Tagalog ang “magiging tuwid” at malinaw ang larawan ng pagtutuwid.
- source_word: αἱ τραχεῖαι
  choice: ang mga baku-bakong daan
  rationale: Ang pambabaeng pang-uri na ginamit bilang pangngalan ay malamang na nagpapahiwatig ng mga daan. Ang “baku-bakong daan” ay malinaw at karaniwan sa Tagalog para sa magaspang o lubak-lubak na dinaraanan.
- source_word: εἰς ὁδοὺς λείας
  choice: ay magiging makinis na mga kalsada
  rationale: Tahasang naroon ang ὁδούς (“mga daan/kalsada”), at ang λείας ay “makinis” o “patag.” Ang “makinis na mga kalsada” ay malinaw na nagpapakita ng paghahanda ng daan.
theological_decisions:
- issue: Propetiko at topograpikong larawan mula sa Isaias 40:4
  choice: Pinanatili ang kongkretong larawan ng pagpuno, pagpapababa, pagtutuwid, at pagpapakinis ng daan.
  alternative: Ipaliwanag ito bilang tuwirang espirituwal o moral na pahayag, gaya ng pagpapakumbaba sa mga mapagmataas.
  rationale: Ang teksto ni Lucas ay gumagamit ng kongkretong wika ng lupain at paggawa ng daan. Ang pagpapanatili sa larawang ito ay umiiwas sa pagpasok ng isang tiyak na interpretasyong teolohikal sa mismong salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paralelismo at kongkretong larawan ng teksto, habang gumamit ng pangkaraniwang salitang “baku-bako” para madaling maunawaan.
