  yaml_path: translation/nt/luke/003/029.yaml
  text: the son of Jeshua, the son of Eliezer, the son of Jorim, the son of Matthat, the son of Levi,
translation:
  language: tl
  text: na anak ni Jeshua, na anak ni Eliezer, na anak ni Jorim, na anak ni Matthat, na anak ni Levi,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ Ἰησοῦ
  choice: ni Jeshua
  rationale: Ginamit ang “Jeshua” bilang anyong pantangi para sa ninunong ito, kasunod ng tekstuwal na konsultasyong ibinigay; ang genitive na τοῦ ay likas na ipinahayag sa Tagalog sa pamamagitan ng “ni.”
- source_word: τοῦ Ἐλιέζερ
  choice: ni Eliezer
  rationale: Tuwirang transliterasyon ng pangalang Griyego, na may panandang Tagalog na “ni” para sa kaugnayang pangkanunuan.
- source_word: τοῦ Ἰωρὶμ
  choice: ni Jorim
  rationale: Pinanatili ang nakikilalang anyo ng pangalan at ginamit ang “ni” upang katawanin ang genitive.
- source_word: τοῦ Μαθθὰτ
  choice: ni Matthat
  rationale: Pinanatili ang anyong Matthat upang mailarawan ang dobleng theta sa tekstong Griyego nang hindi ito ipinapantay sa ibang pangalan.
- source_word: τοῦ Λευὶ
  choice: ni Levi
  rationale: Ginamit ang karaniwang anyong Filipino na “Levi.”
- source_word: τοῦ … τοῦ …
  choice: na anak ni …, na anak ni …
  rationale: Sa talaangkanan, ipinahihiwatig ng sunod-sunod na genitive ang ugnayang “anak ni.” Inulit ito upang maging malinaw at natural sa Filipino habang pinananatili ang estruktura ng talaan.
theological_decisions:
- issue: Ipinahihiwatig lamang sa Griyego ang salitang “anak” sa serye ng mga genitive.
  choice: Hayagang ulitin ang “na anak ni” sa bawat pangalan.
  alternative: Ihanay lamang ang mga pangalan gamit ang “ni,” o gamitin ang mas malawak na “mula kay.”
  rationale: Ang konteksto ng Lucas 3 ay agarang talaangkanan na may ipinahihiwatig na υἱός mula sa simula ng pangungusap. Ang “anak ni” ang malinaw na katumbas nang hindi nagdaragdag ng teolohikal na interpretasyon.
translation_notes:
  register: Modernong, malinaw, at marangal na Filipino. Pinanatili ang anyong pira-piraso ng talata at ang kuwit sa hulihan dahil bahagi ito ng nagpapatuloy na talaangkanan.
