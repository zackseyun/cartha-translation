  text: the son of Matthat[a], the son of Levi, the son of Melchi, the son of Jannai, the son of Joseph,
translation:
  language: tl
  text: na anak ni Matat[a], na anak ni Levi, na anak ni Melqui, na anak ni Jannai, na anak ni Jose,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas pormal na anyo: “ni Matat, ni Levi, ni Melqui, ni Jannai, ni Jose.” Ipinagpapatuloy ng Griyego ang talaangkanan sa pamamagitan ng paulit-ulit na artikulong nasa genitive bago ng mga pangalan, at ipinahihiwatig mula sa konteksto ang “anak ni.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: na anak ni
  rationale: Sa talaangkanan ni Lucas, ang paulit-ulit na genitive article ay eliptikong nagpapatuloy sa ugnayang 'anak ni' na malinaw sa konteksto. Ang paglalagay nito ay natural at malinaw sa modernong Tagalog.
- source_word: Μαθθὰτ
  choice: Matat
  rationale: Isinulat ang pangalang Griyego ayon sa karaniwang anyong madaling basahin at bigkasin sa Filipino.
- source_word: Λευὶ
  choice: Levi
  rationale: Ito ang kinikilalang anyo ng pangalang ito sa Filipino at malapit sa Griyegong Λευί.
- source_word: Μελχὶ
  choice: Melqui
  rationale: Pinananatili ang tunog ng Griyegong Μελχί sa anyong natural basahin sa Filipino.
- source_word: Ἰανναὶ
  choice: Janai
  rationale: Tuwirang transliterasyon na nagpapanatili sa hulaping -ai ng Griyegong Ἰανναί.
- source_word: Ἰωσὴφ
  choice: Jose
  rationale: Ginamit ang nakasanayang Filipino na anyo ng pangalang Ἰωσήφ.
theological_decisions:
- issue: Elipsis sa talaangkanan
  choice: Hayagang ilagay ang 'na anak ni' bago ang bawat pangalan
  alternative: Panatilihin ang literal na hanay na 'ni Matat, ni Levi, ni Melqui, ni Janai, ni Jose'
  rationale: Ang Griyego ay nagpapatuloy ng naunang pormula ng talaangkanan at ipinahihiwatig ang ugnayang anak sa bawat pangalan. Nililinaw ito sa Tagalog nang hindi nagdaragdag ng bagong teolohikal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang paulit-ulit na 'na anak ni' upang ipakitang karugtong ito ng naunang sugnay ng talaangkanan; pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa susunod na talata.
