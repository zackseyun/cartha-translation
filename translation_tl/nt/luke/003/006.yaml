  text: and all flesh will see the salvation of God[a][b].
translation:
  language: tl
  text: At makikita ng lahat ng tao ang pagliligtas ng Diyos[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “lahat ng laman.” Inuulit nito ang wika ng Isaias 40:5 at tumutukoy rito sa lahat ng tao o sa buong sangkatauhan.
    reason: lexical_alternative
  - marker: b
    text: O “ang pagliligtas mula sa Diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψεται
  choice: makikita
  rationale: Ang anyong panghinaharap ng ὁράω ay may tuwirang diwang 'makikita'; natural ito sa modernong Tagalog at pinananatili ang kongkretong larawang biswal.
- source_word: πᾶσα σὰρξ
  choice: lahat ng laman
  rationale: Literal nitong pinananatili ang propetikong idyoma at alingawngaw ng Isaias 40:5. Sa konteksto, tumutukoy ito sa buong sangkatauhan; nililinaw iyon sa talababa upang hindi mawala ang ugnayang intertekstuwal.
- source_word: σωτήριον
  choice: pagliligtas
  rationale: Ginamit ang salita bilang pangngalan na may artikulo. Ang 'pagliligtas' ay natural sa Tagalog at saklaw ang gawa ng Diyos na nagliligtas, nang hindi ito pinakikitid sa isang uri lamang ng pagpapalaya.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Pormal nitong pinananatili ang genitibong Griyego at ang posibleng diwa ng pag-aari o pinagmulan. Ang mas tahasang 'mula sa Diyos' ay inilagay bilang alternatibo sa talababa.
theological_decisions:
- issue: Kahulugan ng idyomang πᾶσα σὰρξ
  choice: Ang 'lahat ng laman' ay tumutukoy sa lahat ng tao o sa buong sangkatauhan.
  alternative: Basahin ito bilang lahat ng nilalang na may laman o bilang pagtuon sa pisikal na katawan.
  rationale: Sa sipi mula sa Isaias at sa konteksto ni Lucas, pangkalahatan ang saklaw nito sa sangkatauhan. Pinananatili ng literal na parirala ang propetikong wika, habang nililinaw ng talababa ang idyomatikong kahulugan.
- issue: Ugnayan ng τοῦ θεοῦ sa σωτήριον
  choice: '''pagliligtas ng Diyos,'' na pinananatiling bukas kung pangunahing diin ay pag-aari, pagkilos, o pinagmulan.'
  alternative: '''pagliligtas mula sa Diyos,'' na tahasang binibigyang-diin ang pinagmulan.'
  rationale: Maaaring ipahiwatig ng genitibo ang pinagmulan o kaugnayan/pag-aari. Hindi tahasang nilulutas ng pangunahing salin ang ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Sadyang pinanatili ang biblikal na idyomang 'lahat ng laman' upang mapangalagaan ang ugnayan sa Isaias, na may malinaw na paliwanag sa talababa. Ang ayos na 'pagliligtas ng Diyos' ay natural at pinananatili ang saklaw ng genitibong Griyego.
