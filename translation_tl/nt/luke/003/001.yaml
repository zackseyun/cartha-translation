  to: Sa ikalabinlimang taon ng paghahari ni Tiberio Cesar[a], habang pinamamahalaan ni Poncio Pilato ang Judea, at si Herodes ay tetrarka ng Galilea, si Felipe naman, na kapatid niya, ay tetrarka ng rehiyon ng Iturea at Traconitis, at si Lisanias ay tetrarka ng Abilene[b],
