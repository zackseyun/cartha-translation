id: LUK.3.1
reference: Luke 3:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ τῆς ἡγεμονίας Τιβερίου Καίσαρος, ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας, καὶ τετρααρχοῦντος τῆς Γαλιλαίας Ἡρῴδου, Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ τετρααρχοῦντος τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας, καὶ Λυσανίου τῆς Ἀβιληνῆς τετρααρχοῦντος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/001.yaml
  text: In the fifteenth year of the reign of Tiberius Caesar[a], while Pontius Pilate was governing Judea, and Herod was tetrarch of Galilee, and Philip his brother was tetrarch of the region of Iturea and Trachonitis, and Lysanias was tetrarch of Abilene[b],
translation:
  language: tl
  text: Sa ikalabinlimang taon ng paghahari ni Tiberio Cesar[a], habang pinamamahalaan ni Poncio Pilato ang Judea, at si Herodes ay tetrarka ng Galilea, si Felipe naman, na kapatid niya, ay tetrarka ng rehiyon ng Iturea at Traconitis, at si Lisanias ay tetrarka ng Abilene[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa loob ng ikalabinlimang taon.”
    reason: lexical_alternative
  - marker: b
    text: Ang “tetrarka” ay isang pinunong panrehiyon sa ilalim ng kapangyarihang Romano.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ
  choice: Noong ikalabinlimang taon
  rationale: Natural na panandang temporal sa modernong Tagalog. Hindi na ginamitan ng hiwalay na panimulang pang-ugnay para sa δέ dahil sapat nang ipinahihiwatig ng bagong tagpo at maiiwasan ang pagdaragdag ng hindi likas na “Ngayon.”
- source_word: ἡγεμονίας
  choice: paghahari
  rationale: Sa kaugnayan kay Tiberio Cesar, malinaw at natural na tumutukoy ito sa panahon ng kanyang pamumuno bilang emperador.
- source_word: Τιβερίου Καίσαρος
  choice: Tiberio Cesar
  rationale: Ginamit ang mga anyo ng pangalang nakaugaliang makilala sa Filipino.
- source_word: ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας
  choice: habang pinamamahalaan ni Poncio Pilato ang Judea
  rationale: Pinananatili ang pandiwang diwa at ang pangyayaring kasabay ng pangunahing panandang panahon, sa halip na gawing titulo lamang na “gobernador.”
- source_word: τετρααρχοῦντος
  choice: ay tetrarka ng
  rationale: Pinananatili ang tiyak na makasaysayang titulong pampolitika sa halip na gawing pangkalahatang “pinuno.”
- source_word: Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ
  choice: si Felipe naman na kapatid niya
  rationale: Ang “naman” ay natural na naghuhudyat ng paglipat na dala ng δέ, at ang “niya” ay nagpapanatili sa sanggunian kay Herodes.
- source_word: τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας
  choice: ng rehiyon ng Iturea at Traconitis
  rationale: Isinasalin ang χώρα bilang “rehiyon” upang mapanatili ang diwa ng nasasakupang teritoryo.
- source_word: τῆς Ἀβιληνῆς
  choice: ng Abilene
  rationale: Itinuturing ang Abilene bilang pangalan ng distrito at pinananatili ang malinaw na ugnayan nito sa titulong tetrarka.
theological_decisions:
- issue: Pagpapahayag sa titulong τετρααρχοῦντος
  choice: tetrarka
  alternative: pinuno; namamahala bilang tetrarka
  rationale: Bagaman makasaysayan sa halip na doktrinal ang usapin, pinananatili ng “tetrarka” ang tiyak na katungkulan sa ilalim ng kapangyarihang Romano nang hindi pinapantay sa pangkalahatang pinuno.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang kinagawiang Filipino na anyo ng mga pangalan kung malinaw at kilala; pinanatili ang makasaysayang terminong “tetrarka” at ipinaliwanag ito sa talababa. Ang kuwit sa hulihan ay sadyang nagpapanatili na bahagi ito ng mas mahabang pangungusap na nagpapatuloy sa susunod na talata.
