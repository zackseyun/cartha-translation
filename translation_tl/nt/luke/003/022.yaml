  source_fidelity: 'Tumpak ang salin sa pangunahing mga elemento ng Griyego: ang pagbaba ng Banal na Espiritu, ang nakikitang/pisikal na anyo, ang paghahambing sa kalapati sa halip na literal na pagkakakilanlan, ang tinig mula sa langit, at ang tuwirang pahayag sa Anak. Ang “sa kanya” ay natural na Tagalog na pagtutumbas ng ἐπ’ αὐτόν sa kontekstong ito.'
