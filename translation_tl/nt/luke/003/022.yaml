id: LUK.3.22
reference: Luke 3:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ καταβῆναι τὸ πνεῦμα τὸ ἅγιον σωματικῷ εἴδει ⸀ὡς περιστερὰν ἐπ’ αὐτόν, καὶ φωνὴν ἐξ οὐρανοῦ ⸀γενέσθαι· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/022.yaml
  text: 'and the Holy Spirit descended on him in bodily form like a dove[a], and a voice came from heaven: “You are my beloved Son; in you I am well pleased.”'
translation:
  language: tl
  text: 'at bumaba sa kanya ang Banal na Espiritu sa anyong pisikal na gaya ng isang kalapati. At may tinig na nagmula sa langit: “Ikaw ang minamahal kong Anak; lubos akong nalulugod sa iyo.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “sa iyo ako lubos na nalugod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβῆναι
  choice: bumaba
  rationale: Tuwirang ipinahahayag ang pababang kilos sa sunod-sunod na salaysay at natural ito sa modernong Tagalog.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: ang Banal na Espiritu
  rationale: Karaniwan, malinaw, at dignified na salin ng tiyak na parirala sa modernong Filipino.
- source_word: σωματικῷ εἴδει
  choice: sa anyong pisikal
  rationale: Ipinapahayag nito ang nakikitang pagpapakita na may pisikal na anyo, hindi lamang isang panloob o di-nakikitang karanasan.
- source_word: ὡς περιστερὰν
  choice: na gaya ng isang kalapati
  rationale: Pinananatili ng “gaya ng” ang paghahambing at hindi ipinapalagay na literal na naging kalapati ang Espiritu.
- source_word: ἐπ’ αὐτόν
  choice: sa kanya
  rationale: Natural na Tagalog para sa pagdating o pagbaba tungo kay Jesus; hindi kailangan ang mas mabigat na “sa ibabaw niya.”
- source_word: φωνὴν ἐξ οὐρανοῦ γενέσθαι
  choice: may tinig na nagmula sa langit
  rationale: Natural na paglalahad sa Tagalog ng paglitaw o pagdating ng tinig mula sa langit.
- source_word: Σὺ εἶ
  choice: Ikaw ang
  rationale: Pinananatili ang tuwirang pagtukoy at diin ng tahasang panghalip sa Griyego.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: minamahal kong Anak
  rationale: Natural at marangal na Tagalog na pinagsasama ang ugnayang pag-aari at ang diwa ng ἀγαπητός.
- source_word: ἐν σοὶ
  choice: sa iyo
  rationale: Ito ang natural na katumbas sa idyomang Tagalog ng pagkakaroon ng lugod sa isang tao.
- source_word: εὐδόκησα
  choice: lubos akong nalulugod
  rationale: Nagpapahayag ng matinding pagsang-ayon at kasiyahan sa natural na kasalukuyang Tagalog; ang aspektong aorist ay itinatala sa talababa.
theological_decisions:
- issue: Ang kalikasan ng pagpapakita ng Espiritu
  choice: Ang Banal na Espiritu ay bumaba sa nakikitang pisikal na anyo na inihahambing sa kalapati.
  alternative: Literal na naging isang kalapati ang Espiritu.
  rationale: Pinagsasama ng σωματικῷ εἴδει at ὡς περιστερὰν ang pisikal na pagpapakita at isang paghahambing; hindi nararapat gawing literal na pagkakakilanlan ang simili.
- issue: Ang temporal na puwersa ng εὐδόκησα
  choice: “lubos akong nalulugod sa iyo” sa pangunahing teksto
  alternative: “sa iyo ako lubos na nalugod”
  rationale: Bagaman aorist ang pandiwang Griyego, mas natural sa Filipino ang kasalukuyang pahayag ng nananatiling pagsang-ayon. Pinananatili sa talababa ang mas pormal na anyong nakaraan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “gaya ng” upang mapanatili ang simili, at inilagay ang mas pormal na aspektong nakaraan ng εὐδόκησα sa talababa.
