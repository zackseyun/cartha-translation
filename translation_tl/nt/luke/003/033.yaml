base_translation:
  language: en
  yaml_path: translation/nt/luke/003/033.yaml
  text: the son of Amminadab[a], the son of Admin, the son of Arni, the son of Hezron, the son of Perez, the son of Judah,
translation:
  language: tl
  text: anak ni Aminadab[a], anak ni Admin, anak ni Arni, anak ni Hezron, anak ni Perez, anak ni Juda,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito ay mababasa, “anak ni Aminadab, anak ni Admin, anak ni Aram”; sa iba naman ay wala ang “Admin” at mababasa, “anak ni Aminadab, anak ni Aram.”
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: anak ni
  rationale: Sa talaangkanan ni Lucas, ang paulit-ulit na artikulong nasa anyong genitive ay eliptikal at ipinagpapatuloy ang ugnayang binanggit sa naunang talata. Nililinaw ng “anak ni” ang ipinahihiwatig na ugnayan at likas itong pakinggan sa Filipino.
- source_word: Ἀμιναδάβ
  choice: Aminadab
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino, na malapit din sa Griyegong pangalan at sa pinagmulan nitong Semitiko.
- source_word: Ἀδμίν
  choice: Admin
  rationale: Tuwirang transliterasyon ng pangalang Griyego sa tekstong SBLGNT.
- source_word: Ἀρνί
  choice: Arni
  rationale: Tuwirang transliterasyon ng anyong nakalimbag sa SBLGNT. Dahil may mahalagang pagkakaiba sa mga manuskrito, inilagay sa talababa ang alternatibong “Aram” sa halip na ipalit ito sa pangunahing teksto.
- source_word: Ἑσρώμ
  choice: Hezron
  rationale: Ginamit ang nakikilalang anyo ng pangalan sa Lumang Tipan upang mapanatili ang pagkakaugnay ng talaangkanan sa mga naunang tekstong biblikal.
- source_word: Φαρές
  choice: Perez
  rationale: Ginamit ang karaniwang anyo ng pangalan sa Lumang Tipan sa halip na ang mas tuwirang transliterasyong mula sa Griyego.
- source_word: Ἰούδα
  choice: Juda
  rationale: Sa konteksto ng ninuno sa Lumang Tipan, “Juda” ang nakaugaliang anyo sa Filipino at naiiwasan nitong mapagkamalan ang pangalan bilang tumutukoy kay Judas sa Bagong Tipan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na “anak ni” upang maipakita ang ritmo at estruktura ng talaangkanan, at ginamit ang mga anyo ng pangalang pamilyar sa tradisyong biblikal sa Filipino kung angkop.
