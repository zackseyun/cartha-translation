  yaml_path: translation/nt/luke/003/026.yaml
  text: the son of Maath[a], the son of Mattathias, the son of Semein, the son of Josech, the son of Joda,
translation:
  language: tl
  text: na anak ni Maat[a], na anak ni Matatias, na anak ni Semein, na anak ni Josek, na anak ni Joda,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Elliptikal ang tekstong Griyego: inuulit sa bawat pangalan ang artikulong nasa genitive. Idinagdag ang “na anak ni” upang luminaw ang ugnayang ipinahihiwatig ng konteksto ng talaangkanan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: na anak ni
  rationale: Sa talaangkanan ni Lucas, ang paulit-ulit na artikulong nasa genitive ay eliptikal at ipinagpapatuloy ang kaugnayang 'anak ni' mula sa konteksto. Nililinaw ito sa natural na Tagalog.
- source_word: Μάαθ
  choice: Maat
  rationale: Isinalin-titik ang pangalang Griyego ayon sa natural na baybay at bigkas sa Filipino; ang θ sa hulihan ay kinakatawan ng t.
- source_word: Ματταθίου
  choice: Matatias
  rationale: Ginamit ang Filipino na anyo ng personal na pangalang Griyego Ματταθίας, na ang nasa talata ay genitive na Ματταθίου.
- source_word: Σεμεῒν
  choice: Semein
  rationale: Tuwirang isinalin-titik ang anyong Griyego upang mapanatili ang partikular na pangalan sa pinagkunang teksto.
- source_word: Ἰωσὴχ
  choice: Josec
  rationale: Isinalin-titik ang χ bilang c/k na tunog ayon sa baybay-Filipino, habang pinananatili ang anyong Ἰωσήχ ng SBLGNT.
- source_word: Ἰωδὰ
  choice: Joda
  rationale: Tuwirang isinalin-titik ang Griyegong Ἰωδά nang hindi ito itinutugma sa ibang posibleng anyong Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inuulit ang “na anak ni” para maging likas at tahasang maunawaan ang ugnayan sa talaangkanan, habang ang mga pangalan ay isinasalin-titik mula sa Griyego.
