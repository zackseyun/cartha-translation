  text: the son of Melea[a], the son of Menna, the son of Mattatha, the son of Nathan, the son of David[b],
translation:
  language: tl
  text: na anak ni Melea[a], na anak ni Menna[b], na anak ni Mattata, na anak ni Natan, na anak ni David,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego: “ni Melea, ni Menna, ni Mattata, ni Natan, ni David”; sa paulit-ulit na ayos ng talaangkanan ni Lucas, ipinahihiwatig ang “anak ni.”'
    reason: lexical_alternative
  - marker: b
    text: Sa ilang salin, “Menan” ang mababasa sa halip na “Menna,” batay sa ibang anyo ng pangalan; “Menna” ang nasa tekstong SBLGNT dito.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ
  choice: na anak ni
  rationale: Sa talaangkanan ni Lucas, ang paulit-ulit na genitive article bago ang bawat pangalan ay eliptikong nagpapahiwatig ng ugnayang ‘anak ni.’ Ginagawang malinaw at natural sa Filipino ang ugnayan nang walang idinaragdag na bagong impormasyon.
- source_word: Μελεὰ
  choice: Melea
  rationale: Tuwirang transliterasyon ng pangalang Griyego sa anyong madaling basahin sa Filipino.
- source_word: Μεννὰ
  choice: Menna
  rationale: Tuwirang kumakatawan sa anyong Μεννά ng SBLGNT; hindi ginawang ‘Menan,’ na matatagpuan sa ilang tradisyon.
- source_word: Ματταθὰ
  choice: Mattata
  rationale: Isina-Filipinong transliterasyon ng Ματταθά, na ginagamit ang ‘t’ sa halip na English ‘th’ upang tumugma sa karaniwang bigkas at baybay sa Filipino.
- source_word: Ναθὰμ
  choice: Natan
  rationale: Ginamit ang nakikilalang anyong Filipino ng biblikal na pangalang Nathan, na natural na binabaybay nang walang English ‘th.’
- source_word: Δαυὶδ
  choice: David
  rationale: Ito ang matatag at malawak na kinikilalang anyo ng Δαυίδ sa mga saling Filipino.
theological_decisions:
- issue: Elipsis sa talaangkanan
  choice: Ulitin ang ‘na anak ni’ sa bawat pangalan.
  alternative: Isalin lamang bilang ‘ni Melea, ni Menna, ni Mattata, ni Natan, ni David.’
  rationale: Ang ugnayang anak at ama ay malinaw na ipinahihiwatig ng mas malawak na pormula ng talaangkanan. Ang tahasang pagbanggit nito ay mas malinaw sa modernong Filipino at hindi nilulutas ang anumang teolohikal na usaping lampas sa gramatika.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang paulit-ulit na pormula ng talaangkanan, ginamit ang natural na ‘anak ni,’ at isina-Filipino ang mga pangalang may English ‘th’ habang pinanatili ang mga nakikilalang anyo.
