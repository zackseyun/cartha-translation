  text: ἦλθον δὲ καὶ τελῶναι βαπτισθῆναι καὶ εἶπαν πρὸς αὐτόν· Διδάσκαλε, τί ⸀ποιήσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/012.yaml
  text: Even tax collectors came to be baptized[a], and they said to him, “Teacher, what should we do?”
translation:
  language: tl
  text: Maging ang mga maniningil ng buwis ay dumating upang magpabautismo[a] at sinabi sa kanya, “Guro, ano ang dapat naming gawin?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Dumating din ang mga maniningil ng buwis upang magpabautismo.”
    reason: Pinananatili ang leksikal at diskursibong alternatibo kung saan ang καὶ ay isinasalin bilang “din” sa halip na emphatic na “maging.”
lexical_decisions:
- source_word: ἦλθον
  choice: dumating
  rationale: Ang aorist indicative ay likas na ipinapahayag bilang payak na naganap na kilos.
- source_word: δὲ καὶ τελῶναι
  choice: Maging ang mga maniningil ng buwis
  rationale: Pinagsasama ng “maging” ang progresibo at pandagdag na diin ng δὲ at καὶ, at pinananatili ang kapansin-pansing pagsama sa mga maniningil ng buwis.
- source_word: βαπτισθῆναι
  choice: upang magpabautismo
  rationale: Ang aorist passive infinitive ay nagsasaad ng layunin; natural sa Filipino ang “magpabautismo” para sa kusang paglapit upang tumanggap ng bautismo.
- source_word: εἶπαν πρὸς αὐτόν
  choice: sinabi sa kanya
  rationale: Pinananatili ang payak na kahulugan ng λέγω πρὸς sa halip na gawing tahasang “nagtanong,” kahit tanong ang sumunod na pananalita.
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Tuwirang katumbas ito ng tawag na διδάσκαλε at natural sa modernong Filipino.
- source_word: τί ποιήσωμεν
  choice: ano ang dapat naming gawin?
  rationale: Ipinahahayag ng “dapat” ang deliberatibong puwersa ng aorist subjunctive at ang paghingi ng wastong pagkilos.
theological_decisions:
- issue: Pagbibigay-diin sa pagkakasama ng mga maniningil ng buwis sa mga tumutugon sa panawagan ni Juan
  choice: “Maging ang mga maniningil ng buwis”
  alternative: “Dumating din ang mga maniningil ng buwis”
  rationale: Pinananatili ng “maging” ang posibleng emphatic na puwersa ng δὲ καὶ nang hindi nagdaragdag ng paliwanag tungkol sa kanilang moral o panlipunang kalagayan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “maniningil ng buwis,” “magpabautismo,” at “Guro” bilang karaniwan at madaling maunawaang mga kataga; pinanatili ang pangmaramihang eksklusibong “naming” sapagkat ang mga nagsasalita ay nagtatanong kay Juan tungkol sa dapat nilang gawin.
