  text: ποιήσατε οὖν καρποὺς ἀξίους τῆς μετανοίας· καὶ μὴ ἄρξησθε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/008.yaml
  text: Therefore produce fruits worthy of repentance[a], and do not begin to say among yourselves[b], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: tl
  text: Kaya magpakita kayo ng mga bungang karapat-dapat sa pagsisisi[a]. Huwag ninyong simulang sabihin sa isa't isa[b], ‘Si Abraham ang aming ama,’ sapagkat sinasabi ko sa inyo na kayang magbangon ng Diyos ng mga anak para kay Abraham mula sa mga batong ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bungang naaayon sa pagsisisi.” Maramihan sa Griyego ang “mga bunga” at tumutukoy sa asal na katugma ng tunay na pagsisisi.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa inyong sarili” o “sa loob-loob ninyo.” Maaaring tumukoy ang parirala sa panloob na pagsasalita o sa sinasabi nila sa loob ng sarili nilang pangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: mamunga kayo
  rationale: Sa idyomang may καρπούς, natural sa makabagong Tagalog ang “mamunga”; pinananatili rin nito ang mariing utos ng aorist imperative.
- source_word: οὖν
  choice: Kaya
  rationale: Malinaw at natural na naghahayag ng bunga o hinuha mula sa naunang babala.
- source_word: καρποὺς ἀξίους τῆς μετανοίας
  choice: mga bungang karapat-dapat sa pagsisisi
  rationale: Pinananatili ang maramihang “mga bunga” at ang diwa ng ἀξίους bilang pagiging angkop o katugma, nang hindi ipinahihiwatig na ang mga gawa ang kumikita ng kapatawaran.
- source_word: μετανοίας
  choice: pagsisisi
  rationale: Karaniwan, malinaw, at kontekstuwal na salin para sa moral at espirituwal na pagbabalik-loob; mas natural kaysa literal na “pagbabago ng isip” sa talatang ito.
- source_word: μὴ ἄρξησθε λέγειν
  choice: Huwag ninyong simulang sabihin
  rationale: Tuwirang pinananatili ang aspektong ‘huwag magsimulang magsabi’ ng konstruksiyon.
- source_word: ἐν ἑαυτοῖς
  choice: sa isa't isa
  rationale: Natural na kumakatawan sa posibleng pananalita sa loob ng kanilang pangkat, habang nilalagyan ng talababa ang tunay na posibilidad na tumukoy ito sa panloob na pagsasalita.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Si Abraham ang aming ama
  rationale: Natural at mariing Tagalog na naghahayag ng kanilang pag-asa sa pagiging inapo ni Abraham.
- source_word: δύναται ὁ θεὸς
  choice: kayang ... ng Diyos
  rationale: Malinaw na ipinahahayag ang kakayahan at kapangyarihan ng Diyos sa natural na Tagalog.
- source_word: ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ
  choice: magbangon ng Diyos mula sa mga batong ito ng mga anak para kay Abraham
  rationale: Pinananatili ng “magbangon” ang saklaw ng ἐγεῖραι at ang “para kay Abraham” ay hindi nagpapasiya kung ang diin ay sa paglikha ng mga inapo o sa pagkakaloob sa kaniya ng mga anak.
theological_decisions:
- issue: Kahulugan ng “mga bungang karapat-dapat sa pagsisisi”
  choice: Mga kilos o bunga ng buhay na angkop at katugma ng tunay na pagsisisi
  alternative: “Mga bungang nagpapakita ng pagsisisi” o “mga bungang naaayon sa pagsisisi”
  rationale: Pinananatili ng salin ang ugnayan ng pagsisisi at asal nang hindi idinaragdag na ang mga gawang ito ang batayan o kabayaran ng kapatawaran.
- issue: Pag-asa sa pagiging inapo ni Abraham
  choice: Hinahamon ni Juan ang pagtitiwala sa pisikal na angkan bilang sapat na katiyakan sa harap ng Diyos
  alternative: Maaaring palawakin bilang tahasang pahayag tungkol sa kung sino ang tunay na bayan ng Diyos
  rationale: 'Sapat nang panatilihin ang mismong bigat ng talata: hindi nalilimitahan ng pisikal na angkan ang kapangyarihan ng Diyos na magbangon ng mga anak para kay Abraham; hindi idinaragdag ang mga susunod na sistematikong pormulasyon.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mamunga” bilang natural na idyoma, “pagsisisi” bilang madaling maunawaang terminong biblikal, at pinanatili sa mga talababa ang mga tunay na ambiguwidad ng ἀξίους at ἐν ἑαυτοῖς.
