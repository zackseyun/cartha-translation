    rationale: Bagaman nauunawaan, hindi ito ang pinakanatural na modernong Filipino. Ang “magpakita kayo ng mga bungang” ay mas maayos at pinananatili ang diwa ng utos na magbunga sa pamamagitan ng nakikitang asal.
