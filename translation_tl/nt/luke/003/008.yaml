  source_fidelity: Tumpak ang pangunahing diwa ng utos na magpakita ng mga bungang kaayon ng pagsisisi, ang babala laban sa pag-asa sa pagiging inapo ni Abraham, at ang kapangyarihan ng Diyos na magbangon ng mga anak para kay Abraham. Ngunit ang hulíng sugnay na “magbangon ng Diyos mula sa mga batong ito ng mga anak para kay Abraham” ay hindi likas ang ayos at maaaring magpalabo kung ano ang mula sa mga bato. Inayos ito upang malinaw na ang ‘mga anak’ ang ibinabangon mula sa mga bato.
  naturalness: May ilang hindi likas na parirala sa draft, lalo na ang “mamunga kayo ng mga bungang” at ang ayos ng pangwakas na sugnay. Ang “magpakita kayo ng mga bungang” ay mas natural sa modernong Filipino at malinaw na tumutukoy sa asal, habang pinananatili ang metapora ng mga bunga.
  terminology: Ang “pagsisisi” ay angkop at karaniwang terminong biblikal para sa μετάνοια sa kontekstong ito. Ang “mga bungang karapat-dapat sa pagsisisi” ay pinananatili, kasama ang talababa para sa mas idiomatikong alternatibong “naaayon sa pagsisisi.” Ang “mga anak para kay Abraham” ay pinananatili upang hindi magdagdag ng interpretasyong denominasyonal.
