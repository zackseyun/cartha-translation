  to: Kaya magpakita kayo ng mga bungang karapat-dapat sa pagsisisi[a]. Huwag ninyong simulang sabihin sa isa't isa[b], ‘Si Abraham ang aming ama,’ sapagkat sinasabi ko sa inyo na kayang magbangon ng Diyos ng mga anak para kay Abraham mula sa mga batong ito.
