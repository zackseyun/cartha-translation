  text: the son of Serug[a], the son of Reu, the son of Peleg, the son of Eber, the son of Shelah[b],
translation:
  language: tl
  text: anak ni Serug[a], anak ni Reu, anak ni Peleg, anak ni Eber, anak ni Sela[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego: “ni Seruc, ni Ragau, ni Falek, ni Eber, ni Sala.” Pinaikli sa Griyego ang sunod-sunod na pariralang genitive; idinagdag ang “anak” ayon sa malinaw na diwa ng talaangkanan.'
    reason: lexical_alternative
  - marker: b
    text: 'Ginamit dito ang mga pangalang nakikilalang kaugnay ng talaangkanan sa Lumang Tipan: Serug, Reu, Peleg, Eber, at Sela.'
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ
  choice: anak ni
  rationale: Sa talaangkanan ni Lucas, ang paulit-ulit na genitive article na sinusundan ng pangalan ay nagpapatuloy sa ipinahihiwatig na ugnayang anak-magulang. Likas at malinaw sa Tagalog ang “anak ni,” samantalang magiging bitin at malabo ang literal na “ni” lamang.
- source_word: Σεροὺχ
  choice: Serug
  rationale: Ginamit ang nakikilalang anyo ng pangalan sa talaangkanan ng Lumang Tipan sa halip na mahigpit na transliterasyong “Seruc.”
- source_word: Ῥαγαὺ
  choice: Reu
  rationale: Bagaman “Ragau” ang tuwirang transliterasyon ng Griyego, ang tinutukoy ay ang patriyarkang kilala bilang Reu sa talaangkanan ng Genesis.
- source_word: Φάλεκ
  choice: Peleg
  rationale: Ito ang karaniwang anyo ng pangalan ng patriyarka sa Genesis at malinaw na nag-uugnay sa dalawang talaangkanan.
- source_word: Ἔβερ
  choice: Eber
  rationale: Pinananatili nito ang anyong malapit sa pangalang Hebreo at iniiwasang ipagkamali ang taong ito sa ibang mga tauhang maaaring tawaging Heber.
- source_word: Σαλὰ
  choice: Sela
  rationale: Ginamit ang nakikilalang anyong Filipino ng pangalang Hebreo sa talaangkanan ng Genesis; ang tuwirang anyong Griyego ay “Sala.”
theological_decisions: []
