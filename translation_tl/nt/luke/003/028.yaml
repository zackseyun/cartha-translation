  text: the son of Melchi[a], the son of Addi, the son of Cosam, the son of Elmadam, the son of Er
translation:
  language: tl
  text: na anak ni Melqui[a], na anak ni Addi, na anak ni Cosam, na anak ni Elmadam, na anak ni Er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, inuulit ang pantukoy na τοῦ bago ang bawat pangalan; ang “na anak ni” ay idinagdag upang malinaw na maipahayag ang ugnayang ipinahihiwatig ng konteksto ng talaangkanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: na anak ni
  rationale: Sa talaangkanan ni Lucas, ang paulit-ulit na genitive article ay eliptikong nagpapatuloy sa ugnayang ipinahihiwatig ng konteksto. Nililinaw ito sa natural na Tagalog bilang “na anak ni.”
- source_word: Μελχὶ
  choice: Melqui
  rationale: Isinulat ang pangalang Griyego sa anyong madaling bigkasin sa Tagalog, gamit ang “qu” upang mapanatili ang tunog na /k/ bago ang i at maiwasang mabasa bilang /s/.
- source_word: Ἀδδὶ
  choice: Adi
  rationale: Ang dobleng delta ay hindi kailangang tumbasan ng dobleng katinig sa karaniwang pagsulat sa Tagalog; pinananatili ang malinaw na bigkas na Adi.
- source_word: Κωσὰμ
  choice: Cosam
  rationale: Pinanatili ang nakaugaliang anyo ng pangalang biblikal sa Filipino, na kumakatawan sa Griyegong Κωσὰμ.
- source_word: Ἐλμαδὰμ
  choice: Elmadam
  rationale: Direktang transliterasyon sa paraang natural basahin sa Tagalog.
- source_word: Ἢρ
  choice: Er
  rationale: Direktang transliterasyon ng maikling pangalang Griyego; hindi dinaragdagan ng tunog na wala sa teksto.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang paulit-ulit na “na anak ni” upang maging malinaw at natural ang eliptikong pormula ng talaangkanan, habang pinananatili ang ayos ng mga pangalan sa Griyego.
