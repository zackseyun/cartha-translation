id: LUK.3.20
reference: Luke 3:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: προσέθηκεν καὶ τοῦτο ἐπὶ πᾶσιν, ⸀καὶ κατέκλεισεν τὸν Ἰωάννην ⸀ἐν φυλακῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/020.yaml
  text: 'He added this also to them all: he locked John up in prison[a].'
translation:
  language: tl
  text: Idinagdag pa ni Herodes sa lahat ng masasama niyang ginawa ang pagkukulong kay Juan sa bilangguan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Idinagdag pa niya ito sa lahat ng iyon: ikinulong niya si Juan sa bilangguan.” Ang diwa ay idinagdag ni Herodes ang gawaing ito sa lahat ng iba pa niyang masasamang ginawa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθηκεν
  choice: Idinagdag pa
  rationale: Ipinahahayag ng aorist na προστίθημι ang pagdaragdag ng isa pang gawa sa mga nauna; likas sa Filipino ang “idinagdag pa” at napananatili nito ang pinagsama-samang diwa.
- source_word: τοῦτο
  choice: ang pagkukulong kay Juan
  rationale: Ang demonstratibong τοῦτο ay tumutukoy sa kasunod na gawa. Ginawang tahasan ang reperente sa Filipino upang maging malinaw at natural ang pangungusap.
- source_word: ἐπὶ πᾶσιν
  choice: sa lahat ng masasama niyang ginawa
  rationale: Sa konteksto ng talata 19–20, tumutukoy ito sa pagdaragdag ng gawa sa lahat ng naunang masasamang ginawa ni Herodes. Ang “masasama” ay mula sa tahasang konteksto ng προηγούμενο κακῶν sa talata 19, hindi isang bagong teolohikal na paliwanag.
- source_word: κατέκλεισεν
  choice: pagkukulong
  rationale: Ang κατακλείω ay nangangahulugang isara o ikulong. Ang “pagkukulong” ay natural sa modernong Filipino at umiiwas sa alanganing pag-uulit na “ikinulong sa kulungan.”
- source_word: Ἰωάννην
  choice: Juan
  rationale: Ginamit ang nakaugaliang anyo ng pangalang John sa Bibliyang Filipino.
- source_word: ἐν φυλακῇ
  choice: sa bilangguan
  rationale: Dito ang φυλακή ay lugar ng pagkakapiit. Ang “bilangguan” ay malinaw, dignificado, at likas sa kasalukuyang Filipino.
theological_decisions:
- issue: Reperente at puwersa ng ἐπὶ πᾶσιν
  choice: Inunawa itong pagdaragdag ni Herodes ng pagkukulong kay Juan sa lahat ng nauna niyang masasamang gawa.
  alternative: Maaaring isalin nang mas pormal bilang “Idinagdag pa niya ito sa lahat ng iyon,” na iniiwang di-tiyak sa mismong talata kung ano ang tinutukoy ng “lahat.”
  rationale: Maliwanag sa agarang konteksto ng Lucas 3:19–20 na ang “lahat” ay ang masasamang gawa ni Herodes. Ginagawang natural at malinaw ng pangunahing salin ang ugnayang ito, habang itinatala sa talababa ang mas literal at mas malabong anyo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at dignificado. Tahasang pinangalanan si Herodes mula sa konteksto upang maiwasan ang malabong panghalip, at ginawang nominal ang pagkukulong upang maipahayag nang maayos ang cumulative construction ng Griyego. Nasa pangunahing teksto ang marker na [a].
