  text: τοῦ Μαθουσαλὰ τοῦ Ἑνὼχ τοῦ Ἰάρετ τοῦ Μαλελεὴλ τοῦ Καϊνὰμ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/037.yaml
  text: the son of Methuselah[a], the son of Enoch, the son of Jared, the son of Mahalaleel, the son of Cainan,
translation:
  language: tl
  text: anak ni Matusalem, anak ni Enoc, anak ni Jared, anak ni Mahalaleel, anak ni Cainan[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, Καϊνάμ (Kainam); isinasalin din ang pangalan bilang “Kainan” o, kapag iniaayon sa mga talaangkanan sa Lumang Tipan, “Kenan.” Kasama ang pangalang ito sa tekstong Griyego ng Lucas.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ
  choice: anak ni
  rationale: Sa talaangkanan ni Lucas, ang paulit-ulit na artikulong nasa genitive ay nagpapatuloy sa ipinahihiwatig na ugnayang ‘anak ni.’ Nililinaw ito sa Filipino upang maging natural at madaling maunawaan.
- source_word: Μαθουσαλὰ
  choice: Matusalem
  rationale: Ginamit ang nakikilalang anyong Filipino ng pangalang biblikal na Methuselah.
- source_word: Ἑνὼχ
  choice: Enoc
  rationale: Ginamit ang tradisyonal at madaling makilalang anyong Filipino ng pangalang Enoch.
- source_word: Ἰάρετ
  choice: Jared
  rationale: Pinanatili ang karaniwang anyong biblikal na Jared, na malinaw at pamilyar sa mga mambabasang Filipino.
- source_word: Μαλελεὴλ
  choice: Mahalaleel
  rationale: Ginamit ang anyong malapit sa pangalang Griyego at sa kinikilalang pangalan sa talaangkanan ng Lumang Tipan.
- source_word: Καϊνὰμ
  choice: Cainan
  rationale: Isinama ang pangalang nasa tekstong Griyego ng Lucas at ginamit ang nakaugaliang anyong Cainan; inilagay sa talababa ang iba pang posibleng baybay nang hindi iniaayon o binabago ang talaangkanan.
theological_decisions:
- issue: Pahiwatig na ugnayang pampamilya sa paulit-ulit na genitive
  choice: Ulitin ang ‘anak ni’ sa bawat pangalan
  alternative: Gumamit lamang ng sunud-sunod na ‘ni’
  rationale: Ang ‘anak ni’ ang malinaw na diwa ng elipsis sa konteksto ng talaangkanan at mas natural sa Filipino, nang walang idinaragdag na doktrinal na interpretasyon.
- issue: Paglalahad sa Καϊνὰμ sa talaangkanan ni Lucas
  choice: Isama sa pangunahing teksto bilang ‘Cainan’
  alternative: Kainan o Kenan
  rationale: Hayagang kasama ang Καϊνὰμ sa tekstong Griyego, kaya hindi ito inalis o iniayon sa ibang anyo ng mga talaangkanan sa Lumang Tipan. Nasa talababa ang mga alternatibong baybay.
translation_notes:
  register: Makabagong Filipino na payak ngunit marangal. Pinanatili ang maikling anyo ng talata bilang bahagi ng nagpapatuloy na talaangkanan, at ginamit ang mga pangalang karaniwang makikilala ng mga mambabasang Filipino.
