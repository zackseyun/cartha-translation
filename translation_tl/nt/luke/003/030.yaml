base_translation:
  language: en
  yaml_path: translation/nt/luke/003/030.yaml
  text: the son of Simeon[a], the son of Judah, the son of Joseph, the son of Jonam, the son of Eliakim[b],
translation:
  language: tl
  text: na anak ni Simeon, na anak ni Juda, na anak ni Jose, na anak ni Jonam[a], na anak ni Eliakim,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito o tradisyon ng pagsasalin, “Jonan” ang anyo ng pangalang ito sa halip na “Jonam.”
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: na anak ni
  rationale: Sa talaangkanan ni Lucas, ang paulit-ulit na genitive article ay eliptikong nagpapatuloy sa kaugnayang ipinahayag sa naunang konteksto. Nililinaw ng “na anak ni” ang ugnayan at natural itong pakinggan sa Filipino.
- source_word: Συμεὼν
  choice: Simeon
  rationale: Ito ang kinagawiang anyo ng pangalang ito sa Filipino at malinaw na kumakatawan sa Griyegong Συμεών.
- source_word: Ἰούδα
  choice: Juda
  rationale: Bagaman maaari ring tumbasan ng “Judas” ang parehong pangalang Griyego, higit na angkop sa konteksto ng talaangkanan ang anyong “Juda,” na sumasalamin sa pangalang Hebreo at umiiwas sa di-kinakailangang pag-uugnay kay Judas Iscariote.
- source_word: Ἰωσὴφ
  choice: Jose
  rationale: Ang “Jose” ang karaniwan at madaling makilalang anyo sa modernong Filipino ng pangalang Ἰωσήφ.
- source_word: Ἰωνὰμ
  choice: Jonam
  rationale: Tuwirang kinakatawan ng “Jonam” ang anyong Ἰωνάμ sa SBLGNT. Ang “Jonan” ay nagmumula sa ibang anyo ng tekstuwal o tradisyon ng pagsasalin.
- source_word: Ἐλιακὶμ
  choice: Eliakim
  rationale: Ang “Eliakim” ang kinagawian at malinaw na anyo sa Filipino ng Semitikong pangalang ito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang paulit-ulit na “na anak ni” upang mapanatili ang padron ng talaangkanan at maipahayag ang elipsis ng Griyego. Hindi nilagyan ng talababa ang “Juda” sapagkat ang alternatibong “Judas” ay usapin ng paraan ng paglilipat ng iisang pangalang Griyego, hindi isang pagkakaiba sa pinagmulang teksto; ang “Juda” ang natural na anyo sa kontekstong ito.
