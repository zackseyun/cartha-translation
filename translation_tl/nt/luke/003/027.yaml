lexical_decisions:
- source_word: τοῦ
  choice: anak ni
  rationale: Sa talaangkanan, ang paulit-ulit na genitive article ay eliptikong nagpapahiwatig ng ugnayang anak-sa-magulang mula sa naunang hulma. Ang “anak ni” ang likas at malinaw na katumbas sa modernong Tagalog.
- source_word: Ἰωανὰν
  choice: Joanan
  rationale: Tuwirang transliterasyon ng pangalang Griyego, na angkop sa nakaugaliang anyo sa Tagalog.
- source_word: Ῥησὰ
  choice: Resa
  rationale: Likas na transliterasyon sa Tagalog; hindi karaniwang kinakatawan sa modernong baybay-Tagalog ang rough breathing ng panimulang rho.
- source_word: Ζοροβαβὲλ
  choice: Zerubabel
  rationale: Ginamit ang kinikilalang anyo ng pangalang biblikal sa tradisyong Hebreo upang madaling maiugnay ang tauhan sa Lumang Tipan.
- source_word: Σαλαθιὴλ
  choice: Sealtiel
  rationale: Ginamit ang anyong nakaugat sa pangalang Hebreo at karaniwang nakikilala sa saling Tagalog, sa halip na ang mas tuwirang Griyegong “Salatiel.”
- source_word: Νηρὶ
  choice: Neri
  rationale: Payak at malinaw na transliterasyon ng pangalang Griyego sa Tagalog.
theological_decisions:
- issue: Elipsis sa talaangkanan
  choice: Ulitin ang “anak ni” sa bawat pangalan.
  alternative: Magbigay ng sunod-sunod na pangalan na inuugnay lamang ng “ni.”
  rationale: Hindi tahasang inuulit ng Griyego ang salitang “anak,” ngunit ipinahihiwatig ito ng hulma ng nakapaligid na talaangkanan. Ang paglalagay nito ay nagpapalinaw sa sintaks nang hindi nagdaragdag ng bagong teolohikal na kahulugan.
- issue: Pagkakakilanlan ni Σαλαθιὴλ
  choice: Isalin ang pangalan bilang “Sealtiel.”
  alternative: Tuwirang itransliterado bilang “Salatiel.”
  rationale: Pinananatili ng “Sealtiel” ang kanonikal na pagkakaugnay sa pangalang mula sa Lumang Tipan, samantalang ipinababatid sa talababa ang anyong nasa Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Ginamit ang likas na hulmang “anak ni” at mga anyo ng pangalang madaling makilala ng mga mambabasang Tagalog.
