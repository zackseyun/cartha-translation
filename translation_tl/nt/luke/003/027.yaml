translation:
  language: tl
  text: anak ni Joanan[a], anak ni Resa, anak ni Zerubabel, anak ni Sealtiel, anak ni Neri[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, inuulit sa bawat pangalan ang pantukoy na nasa anyong genitive; idinagdag ang “anak ni” ayon sa malinaw na hulma ng talaangkanan.
