  text: τοῦ Ἐνὼς τοῦ Σὴθ τοῦ Ἀδὰμ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/038.yaml
  text: the son of Enosh[a], the son of Seth, the son of Adam, the son of God.
translation:
  language: tl
  text: na anak ni Enos[a], na anak ni Set, na anak ni Adan, na anak ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, inuulit lamang ang anyong “ni Enos, ni Set, ni Adan, ng Diyos”; idinagdag sa salin ang “na anak” ayon sa malinaw na pormula ng talaangkanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ Ἐνὼς
  choice: na anak ni Enos
  rationale: Ang inuulit na genitive article at pangalang pantangi ay nagpapatuloy sa pormula ng talaangkanan ni Lucas. Ipinahihiwatig ng konteksto ang ugnayang anak-sa-ama, kaya nilinaw ito sa natural na Filipino. Ginamit ang nakaugaliang anyong Tagalog na “Enos.”
- source_word: τοῦ Σὴθ
  choice: na anak ni Set
  rationale: Elliptical din ang genitive na ito at nagpapahiwatig ng ugnayang anak-sa-ama. “Set” ang natural at nakaugaliang anyo ng pangalan sa Tagalog.
- source_word: τοῦ Ἀδὰμ
  choice: na anak ni Adan
  rationale: Nagpapatuloy ang parehong pormula ng talaangkanan. Pinanatili bilang pangalang pantangi ang Ἀδάμ at ginamit ang nakaugaliang anyong Tagalog na “Adan,” sa halip na isaling “tao.”
- source_word: τοῦ θεοῦ
  choice: na anak ng Diyos
  rationale: Ang huling genitive ay kaayon ng pormula ng buong talaangkanan, kaya pinanatili ang ipinahihiwatig na “anak.” Ang “Diyos” ang malinaw na banal na tinutukoy.
theological_decisions:
- issue: Paglalarawan sa huling pariralang τοῦ θεοῦ sa talaangkanan ni Adan
  choice: na anak ng Diyos
  alternative: na mula sa Diyos; ng Diyos
  rationale: Sa anyo, genitive lamang ang Griyego, ngunit sa konteksto ng paulit-ulit na pormula ng talaangkanan ay ipinahihiwatig ang parehong ugnayang “anak.” Pinananatili ng salin ang pampanitikang padron at ang diin sa tuwirang pinagmulan ni Adan sa Diyos, nang hindi ipinapantay o ipinaghahalo ito sa natatanging pagka-Anak ni Jesus.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “na anak ni/ng” upang natural na maidugtong ang talata sa naunang bahagi ng talaangkanan, habang ipinapakita sa talababa ang mas payak na anyo ng Griyego.
