  text: And the crowds were asking him[a], saying, “What then should we do?”
translation:
  language: tl
  text: Patuloy siyang tinatanong ng mga tao, “Kung gayon, ano ang dapat naming gawin?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτων
  choice: Patuloy na tinatanong
  rationale: Ang imperfect ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagtatanong; natural itong naipahahayag sa Tagalog sa pamamagitan ng “patuloy.”
- source_word: οἱ ὄχλοι
  choice: mga tao
  rationale: Bagaman maramihan ang ὄχλοι at literal na maaaring isaling “mga pulutong,” mas natural sa modernong Tagalog ang “mga tao” para sa mga taong nagkatipon, at malinaw pa rin ang kolektibong kahulugan.
- source_word: λέγοντες
  choice: ipinahayag sa tuwirang tanong
  rationale: Sa natural na Tagalog, hindi kailangang isalin nang hiwalay ang participle na λέγοντες bago ang sipi; malinaw na ipinakikilala ng pandiwa ng pagtatanong ang mismong sinabi nila.
- source_word: Τί οὖν
  choice: Kung gayon, ano
  rationale: Pinananatili ng “kung gayon” ang inferensiyal na ugnayan sa naunang pangangaral ni Juan nang hindi nagiging masyadong kolokyal.
- source_word: ποιήσωμεν
  choice: ang dapat naming gawin
  rationale: Ang deliberative aorist subjunctive ay natural na isinasalin bilang tanong tungkol sa nararapat nilang gawin. Ginamit ang inklusibong “naming” dahil ang kinakausap nilang si Juan ay hindi kabilang sa grupong gagawa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang aspektong nagpapatuloy ng ἐπηρώτων at ang lohikal na diin ng οὖν, habang iniwasan ang di-natural na literal na “na nagsasabi.”
