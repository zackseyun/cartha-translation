id: LUK.3.15
reference: Luke 3:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Προσδοκῶντος δὲ τοῦ λαοῦ καὶ διαλογιζομένων πάντων ἐν ταῖς καρδίαις αὐτῶν περὶ τοῦ Ἰωάννου, μήποτε αὐτὸς εἴη ὁ χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/015.yaml
  text: As the people were waiting expectantly[a], and all were reasoning in their hearts about John, whether perhaps he might be the Messiah,
translation:
  language: tl
  text: Habang sabik na naghihintay ang mga tao, iniisip ng lahat sa kanilang mga puso kung si Juan nga kaya ang Mesiyas[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “ang Cristo.” Sa Griyego: ho christos.'
    reason: alternative_reading
lexical_decisions:
- source_word: Προσδοκῶντος
  choice: sabik na naghihintay
  rationale: Ipinahahayag ng genitive absolute ang kalagayang nagpapatuloy, at taglay ng προσδοκάω ang diwa ng paghihintay na may pananabik at inaasahan.
- source_word: δὲ
  choice: Habang
  rationale: Mahinang pang-ugnay ito sa pagpapatuloy ng salaysay; sa Filipino, likas na naihahatid ng pagkakabuo ng sugnay na nagsisimula sa “Habang,” nang hindi nagdaragdag ng tahasang “ngayon” na wala sa Griyego.
- source_word: τοῦ λαοῦ
  choice: ang mga tao
  rationale: Direkta at likas na katumbas ng kolektibong λαός sa konteksto.
- source_word: διαλογιζομένων πάντων
  choice: pinag-iisipan ng lahat
  rationale: Pinananatili nito ang panloob at mapanuring pagninilay ng διαλογίζομαι at ang saklaw ng πάντων.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: sa kanilang mga puso
  rationale: Pinananatili ang biblikal na larawan ng puso bilang kaloob-looban kung saan nagaganap ang pag-iisip at pagsasaalang-alang.
- source_word: περὶ τοῦ Ἰωάννου
  choice: ang tungkol kay Juan
  rationale: Likas na Filipino para sa περί na may genitive, na tumutukoy sa paksa ng kanilang pag-iisip.
- source_word: μήποτε αὐτὸς εἴη
  choice: kung siya na nga kaya
  rationale: Ang “kung…kaya” ay nagpapanatili sa di-tiyak at mapag-usisang puwersa ng μήποτε at optative na εἴη; ang “na nga” ay natural na nagpapahayag ng posibilidad na siya ang hinihintay nila, hindi ng katiyakan.
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Dito ay malinaw na titulong tumutukoy sa inaasahang pinahiran, kaya “Mesiyas” ang angkop kaysa sa pangalang-tunog na “Cristo.”
theological_decisions:
- issue: Pagsasalin sa Χριστός bilang titulo
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Ang usapin ay kung si Juan ang inaasahang mesiyanikong persona; pinananatili ng “Mesiyas” ang titulong nakaugat sa pag-asang Judio nang hindi ito ginagawang wari’y personal na pangalan.
- issue: Antas ng katiyakan sa pagkakakilanlan ni Juan
  choice: kung siya na nga kaya
  alternative: kung siya nga ang Mesiyas
  rationale: Pinananatili ng “kaya” ang pag-aalinlangan at posibilidad na ipinahahayag ng μήποτε at ng optative εἴη, sa halip na gawing mas tiyak ang kanilang palagay.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sabik na naghihintay” para sa malinaw at likas na pagpapahayag ng umaasang paghihintay, at pinanatili ang idyomang “sa kanilang mga puso.” Ang talata ay sadyang nagtatapos sa gitling sapagkat nagpapatuloy ang pangungusap sa kasunod na talata.
