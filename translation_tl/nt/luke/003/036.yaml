lexical_decisions:
- source_word: τοῦ
  choice: na anak ni
  rationale: Sa talaangkanan ni Lucas, ang paulit-ulit na genitive article bago ang bawat pangalan ay eliptikong nagpapahayag ng ugnayan ng salinlahi. Ang “na anak ni” ay likas at malinaw sa Filipino at umaayon sa padron ng nakapaligid na mga talata.
- source_word: Καϊνὰμ
  choice: Kainan
  rationale: Tuwirang transliterasyon ng pangalang Griyego sa baybay na madaling basahin sa Filipino.
- source_word: Ἀρφαξὰδ
  choice: Arfaxad
  rationale: Sinusunod ang anyong Griyego sa Lucas; ginagamit ang “x” upang payak na katawanin ang tunog na /ks/ sa nakaugaliang biblikal na baybay.
- source_word: Σὴμ
  choice: Sem
  rationale: Karaniwang anyong Filipino ng pangalang biblikal na Shem.
- source_word: Νῶε
  choice: Noe
  rationale: Karaniwang anyong Filipino ng pangalang biblikal na Noah at malapit din sa anyong Griyego.
- source_word: Λάμεχ
  choice: Lamec
  rationale: Likas na transliterasyong Filipino, na gumagamit ng “c” sa hulihan ayon sa nakaugaliang anyo ng pangalang biblikal.
theological_decisions:
- issue: Pagkakasama ni Kainan sa talaangkanan ni Lucas sa pagitan nina Arfaxad at Sem
  choice: Pinanatili si Kainan sa pangunahing teksto.
  alternative: Inaalis si Kainan sa ilang tradisyon upang higit na iayon ang talaangkanan sa ilang anyo ng Lumang Tipan.
  rationale: Kasama ang Καϊνὰμ sa ibinigay na tekstong SBLGNT ng Lucas 3:36. Dapat isalin ang tekstong Griyego gaya ng naroon sa halip na itugma ito nang palihim sa ibang anyo ng talaangkanan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang paulit-ulit na “na anak ni” upang maging malinaw ang ugnayang genealogical, at ginamit ang mga anyong pangalang pamilyar o likas sa Filipino.
