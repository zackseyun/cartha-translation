  text: na anak ni Kainan[a], na anak ni Arfaxad[c], na anak ni Sem, na anak ni Noe, na anak ni Lamec[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang ito ay binabaybay ding “Cainan” sa ilang salin.
