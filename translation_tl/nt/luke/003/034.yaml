lexical_decisions:
- source_word: τοῦ
  choice: na anak ni
  rationale: Sa talaangkanan ni Lucas, ang paulit-ulit na pantukoy na nasa genitive kasama ng bawat pangalan ay nagpapatuloy sa eliptikong hulma ng konteksto. Nilinaw sa Tagalog ang ipinahihiwatig na ugnayan sa pamamagitan ng “na anak ni.”
- source_word: Ἰακώβ
  choice: Jacob
  rationale: Ginamit ang kinagawiang anyo ng pangalan sa mga saling Tagalog at sa pagkilala sa patriyarka.
- source_word: Ἰσαάκ
  choice: Isaac
  rationale: Ginamit ang pamilyar at kinagawiang anyo ng pangalan sa Tagalog.
- source_word: Ἀβραάμ
  choice: Abraham
  rationale: Ginamit ang pamilyar at kinagawiang anyo ng pangalan sa Tagalog.
- source_word: Θάρα
  choice: Terah
  rationale: Bagaman Θάρα (Thara) ang anyong Griyego, ginamit ang pamilyar na anyo ng pangalan sa Lumang Tipan upang malinaw na makilala ang parehong tao.
- source_word: Ναχώρ
  choice: Nahor
  rationale: Bagaman mas malapit sa Griyego ang “Nachor,” ginamit ang pamilyar na anyo ng pangalan sa Lumang Tipan upang malinaw na makilala ang parehong tao.
theological_decisions:
- issue: Paglilinaw sa ipinahihiwatig na ugnayang anak-ama sa eliptikong talaangkanan
  choice: Isinalin ang bawat genitive na kawing bilang “na anak ni”
  alternative: Panatilihin lamang ang sunod-sunod na “ni” at mga pangalan
  rationale: Umaasa ang Griyego sa hulma ng mas malawak na talaangkanan at hindi inuulit ang salitang “anak.” Kailangan sa natural na Tagalog na ipahayag ang ugnayan upang maging malinaw ang talaangkanan; paglilinaw ito ng sintaks, hindi pagdaragdag ng doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ang “na anak ni” ay natural na nagpapatuloy sa isang pangungusap na talaangkanan mula sa naunang talata. Pinanatili ang mga pamilyar na anyo ng mga pangalang patriyarkal.
