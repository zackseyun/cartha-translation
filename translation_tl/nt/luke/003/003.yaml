source:
  edition: SBLGNT
  text: καὶ ἦλθεν εἰς ⸀πᾶσαν περίχωρον τοῦ Ἰορδάνου κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/003.yaml
  text: And he came into all the surrounding region of the Jordan[a], proclaiming a baptism of repentance for the forgiveness of sins[b],
translation:
  language: tl
  text: At nagtungo siya sa buong rehiyong nakapalibot sa Jordan, na ipinapahayag ang bautismo ng pagsisisi para sa kapatawaran ng mga kasalanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν
  choice: nagtungo
  rationale: Sa konteksto ng paglalakbay ni Juan patungo sa rehiyon ng Jordan, natural sa Tagalog ang “nagtungo”; saklaw ng ἔρχομαι ang pagdating o pagpunta ayon sa pananaw ng salaysay.
- source_word: εἰς πᾶσαν περίχωρον τοῦ Ἰορδάνου
  choice: sa buong lupaing nakapalibot sa Jordan
  rationale: Ipinapahayag ng “buong” ang πᾶσαν at ng “lupaing nakapalibot” ang περίχωρον, habang nananatiling malinaw at natural ang heograpikong pagtukoy sa Jordan.
- source_word: κηρύσσων
  choice: na ipinapahayag
  rationale: Tinutukoy ng κηρύσσω ang hayagang pagpapahayag sa madla. Mas malinaw ito sa karaniwang mambabasa kaysa sa “ipinangangaral,” na maaaring magtunog mas makitid o eklesiyastikal.
- source_word: βάπτισμα
  choice: bautismo
  rationale: Ang “bautismo” ang kinikilalang tuwirang katumbas sa modernong Tagalog para sa ritwal na tinutukoy ng βάπτισμα.
- source_word: μετανοίας
  choice: ng pagsisisi
  rationale: Pinananatili ng pariralang ito ang genitive na ugnayan ng bautismo at μετάνοια nang hindi ipinapaliwanag nang labis kung paano eksaktong magkaugnay ang mga ito.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: para sa kapatawaran ng mga kasalanan
  rationale: Ang “kapatawaran” ang natural na kahulugan ng ἄφεσις sa kontekstong ito. Pinananatili ng “para sa” ang layon o kaugnayang ipinahihiwatig ng εἰς nang hindi nilulutas ang teolohikal na mekanismo.
theological_decisions:
- issue: Ugnayan ng bautismo, pagsisisi, at kapatawaran
  choice: “ang bautismo ng pagsisisi para sa kapatawaran ng mga kasalanan”
  alternative: “ang bautismong tanda ng pagsisising humahantong sa kapatawaran” o “ang bautismo kung saan ipinahahayag ang pagsisisi para sa kapatawaran”
  rationale: Malapit na sinusundan ng salin ang βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν at hindi nito tinutukoy kung instrumental, sagisag, patunay, o pagpapahayag ang bautismo kaugnay ng kapatawaran.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “nagtungo” para sa natural na direksiyon ng salaysay at “ipinapahayag” upang mapanatili ang pampublikong diwa ng κηρύσσω nang hindi labis na eklesiyastikal.
