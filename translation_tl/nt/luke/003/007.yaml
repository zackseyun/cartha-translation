base_translation:
  language: en
  yaml_path: translation/nt/luke/003/007.yaml
  text: So he was saying to the crowds coming out to be baptized by him[a], “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: tl
  text: Kaya sinasabi niya sa mga pulutong na lumalabas upang magpabautismo sa kanya, “Lahi[a] ng mga ulupong, sino ang nagbabala sa inyo na tumakas sa poot na darating?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Supling ng mga ulupong.”
    reason: lexical_alternative
  - marker: b
    text: O, “sa nalalapit na poot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: patuloy niyang sinasabi
  rationale: Ipinahihiwatig ng imperpektong aspekto ang nagpapatuloy o paulit-ulit na pagsasalita. Malinaw itong naihahayag ng “patuloy niyang sinasabi” nang hindi ginagawang isang minsanang pahayag lamang.
- source_word: οὖν
  choice: Kaya
  rationale: Nag-uugnay ito sa naunang salaysay at pangangatwiran. Ang “Kaya” ay likas at malinaw sa modernong Tagalog.
- source_word: τοῖς ἐκπορευομένοις ὄχλοις
  choice: sa mga taong lumalabas
  rationale: Ipinapakita ng participle ang paglabas ng maraming tao patungo kay Juan. Ang “mga taong lumalabas” ay natural sa Tagalog at hindi nagpapabigat sa pangungusap gaya ng mas pormal na “mga pulutong.”
- source_word: βαπτισθῆναι ὑπ’ αὐτοῦ
  choice: upang magpabautismo sa kanya
  rationale: Pinananatili nito ang layunin ng kanilang paglabas at ang diwang tumatanggap sila ng bautismo mula sa kanya, sa natural na ayos ng Tagalog.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Mga anak ng mga ulupong
  rationale: Tuwirang ipinapahayag ng “mga anak” ang kahulugan ng γέννημα bilang mga ipinanganak o supling, habang nananatiling matindi at malinaw ang larawan ng mga ulupong.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: Sino ang nagbabala sa inyo
  rationale: Sa konteksto ng nalalapit na kaparusahan, ang ὑποδείκνυμι ay may diwang pagpapaalam na nagsisilbing babala. Pinakamalinaw itong naihahatid ng “nagbabala.”
- source_word: φυγεῖν
  choice: na tumakas
  rationale: Pinananatili ng “tumakas” ang matingkad na larawan ng paglayo sa panganib at ang infinitive na nakaugnay sa babala.
- source_word: ἀπὸ τῆς μελλούσης ὀργῆς
  choice: sa poot na darating
  rationale: Ang “poot” ay angkop na katumbas ng ὀργή sa konteksto ng paghatol, at ang “na darating” ay nagpapanatili sa hinaharap na diwa ng μελλούσης nang hindi tinutukoy ang eksaktong panahon o anyo nito.
theological_decisions:
- issue: Ang kalikasan ng ὀργή sa babala ni Juan
  choice: “poot” bilang dumarating na paghatol ng Diyos, nang hindi nililimitahan sa isang tiyak na sistemang eskatolohikal
  alternative: Tahasang “pangwakas na paghuhukom” o isang pansamantalang paghatol sa kasaysayan
  rationale: Tumutukoy ang konteksto sa pagsisisi sa harap ng paghatol ng Diyos, ngunit hindi tinutukoy ng talata lamang ang buong saklaw o eksaktong anyo nito. Pinananatili ng “poot” ang lakas at teolohikal na tensiyon ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “magpabautismo” bilang natural na paraan ng pagpapahayag na tumatanggap sila ng bautismo, at “poot” upang mapanatili ang bigat ng babala. Inayos ang mga panandang talababa upang ang [a] ay tumukoy sa pariralang tungkol sa mga ulupong at ang [b] sa pariralang tungkol sa darating na poot.
