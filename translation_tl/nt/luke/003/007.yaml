  to: Kaya sinasabi niya sa mga pulutong na lumalabas upang magpabautismo sa kanya, “Lahi[a] ng mga ulupong, sino ang nagbabala sa inyo na tumakas sa poot na darating?[b]”
  rationale: Pinalitan ang pangkalahatang “mga taong” ng “mga pulutong” upang maihatid ang ὄχλοις. Ginawang “Lahi ng mga ulupong” ang insulto upang maging mas idiomatiko habang pinananatili ang kahulugan. Inayos ang pandiwa bilang “sinasabi niya” upang mapanatili ang aspekto ng ἔλεγεν nang hindi labis na pinatitindi ang pagpapatuloy. Nanatiling nakapirmi ang mga talababa sa mismong pariralang binibigyan ng alternatibo.
