  text: ἐπηρώτων δὲ αὐτὸν καὶ στρατευόμενοι λέγοντες· ⸂Τί ποιήσωμεν καὶ ἡμεῖς⸃; καὶ εἶπεν ⸀αὐτοῖς· Μηδένα διασείσητε μηδὲ συκοφαντήσητε, καὶ ἀρκεῖσθε τοῖς ὀψωνίοις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/014.yaml
  text: And soldiers also were asking him[a], saying, “What should we also do?” And he said to them, “Do not extort money from anyone, nor accuse anyone falsely[c][b], and be content with your wages.”
translation:
  language: tl
  text: May mga sundalo ring nagtanong sa kanya, “At kami naman, ano ang dapat naming gawin?” Sinabi niya sa kanila, “Huwag kayong mangikil kaninuman[a] ni magparatang nang walang katotohanan laban kaninuman[b], at makuntento kayo sa inyong suweldo.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang isinaling “mangikil” ay literal na maaaring maglarawan ng marahas na pag-uga o pananakot; dito, tumutukoy ito sa sapilitang pagkuha sa pamamagitan ng pang-aabuso ng kapangyarihan.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “gumawa ng maling paratang laban kaninuman.” Sa kontekstong ito, maaaring gamitin ang ganitong paratang upang manakit o magkamit ng pakinabang.'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin ang “suweldo” na “bayad.” Ang salitang Griyego ay madalas gamitin para sa bayad o panustos na tinatanggap ng mga sundalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατευόμενοι
  choice: mga sundalo
  rationale: Ang participle ay tumutukoy sa mga naglilingkod bilang kawal. Ang “mga sundalo” ang pinakanatural at malinaw na katawagan sa modernong Filipino.
- source_word: Τί ποιήσωμεν καὶ ἡμεῖς
  choice: At kami naman, ano ang dapat naming gawin?
  rationale: Pinananatili ng “kami naman” ang tahasang diin ng καὶ ἡμεῖς na kabilang din sila sa mga nagtatanong, habang natural ang ayos sa Filipino.
- source_word: διασείσητε
  choice: mangikil kaninuman
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa sapilitang pagkuha sa pamamagitan ng pananakot o pang-aabuso ng kapangyarihan. Malinaw at maikli itong naipapahayag ng “mangikil.”
- source_word: συκοφαντήσητε
  choice: magparatang nang kasinungalingan
  rationale: Ipinahihiwatig ng pandiwa ang maling paratang na maaaring gamitin upang manakit o magkamit ng pakinabang. Hindi pinipili ang mas makitid na “mang-blackmail” dahil hindi tiyak na iyon lamang ang saklaw.
- source_word: ἀρκεῖσθε
  choice: masiyahan kayo
  rationale: Ipinapahayag ng anyong pautos ang patuloy na pagkakontento sa kung ano ang tinatanggap nila.
- source_word: ὀψωνίοις
  choice: suweldo
  rationale: Ang salita ay ginagamit para sa bayad o panustos ng mga sundalo. Ang “suweldo” ay natural at malinaw sa modernong Filipino, samantalang ang “rasyon” ay labis na makitid.
theological_decisions:
- issue: Etikal na tagubilin sa mga sundalo
  choice: Direktang iniutos ni Juan sa mga sundalo na huwag abusuhin ang kapangyarihan at huwag maghangad ng di-matuwid na pakinabang.
  alternative: Unawain ang talata bilang di-tuwirang paghatol sa mismong paglilingkod bilang sundalo.
  rationale: Kinakausap sila ng teksto sa kalagayan nilang mga sundalo at walang tahasang utos na iwan nila ang kanilang paglilingkod. Hindi rin pinalalawak ng salin ang talata upang magpasya sa mas malawak na usaping doktrinal.
translation_notes:
  register: Modernong Filipino na malinaw, dignificado, at madaling maunawaan. Ginamit ang “sundalo” kaysa “kawal” bilang mas karaniwang katawagan, at “kami naman” upang natural na mapanatili ang diin ng Griyego sa “kami rin.”
