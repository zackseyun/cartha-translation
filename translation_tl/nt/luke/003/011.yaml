id: LUK.3.11
reference: Luke 3:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ⸀ἔλεγεν αὐτοῖς· Ὁ ἔχων δύο χιτῶνας μεταδότω τῷ μὴ ἔχοντι, καὶ ὁ ἔχων βρώματα ὁμοίως ποιείτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/011.yaml
  text: And answering[a], he said to them, “The one who has two tunics must share with the one who has none, and the one who has food must do likewise.”
translation:
  language: tl
  text: Sumagot siya sa kanila, “Ang may dalawang tunika[a] ay magbahagi sa taong wala nito, at ang may pagkain ay gayon din ang gawin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tunika” ay pangunahing kasuotang isinusuot malapit sa katawan noong panahong iyon; maaari rin itong isaling “kamiseta” o “damit.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ἔλεγεν
  choice: Sumagot siya
  rationale: Natural na pinagsasama sa Filipino ang participle at pangunahing pandiwa bilang tugon sa naunang tanong. Ang δέ ay banayad na pang-ugnay at hindi kailangang isalin nang hiwalay.
- source_word: Ὁ ἔχων
  choice: Ang may
  rationale: Maikli at likas na generic na pahayag sa Filipino; saklaw nito ang sinumang tao nang hindi nagdaragdag ng kasarian.
- source_word: δύο χιτῶνας
  choice: dalawang tunika
  rationale: Ang χιτών ay pangunahing kasuotang isinusuot malapit sa katawan, hindi partikular na makabagong kamiseta o panlabas na amerikana. Pinananatili ng “tunika” ang katumpakang pangkasaysayan, na nililinaw sa talababa.
- source_word: μεταδότω
  choice: ay magbahagi
  rationale: Ipinapahayag nito ang utos na ibahagi o ipagkaloob ang mayroon sa nangangailangan, nang hindi ipinapalagay na hahatiin lamang ang isang kasuotan.
- source_word: τῷ μὴ ἔχοντι
  choice: sa taong wala nito
  rationale: Ginagawang malinaw ang ipinahihiwatig na layon—ang tunika—habang pinananatili ang pagtukoy sa taong walang ganoong kasuotan.
- source_word: βρώματα
  choice: pagkain
  rationale: Ito ang malinaw at karaniwang katumbas ng malawak na terminong Griyego para sa mga bagay na kinakain.
- source_word: ὁμοίως ποιείτω
  choice: gayon din ang gawin
  rationale: 'Pinananatili ang kaagapay na utos: ang parehong pagbabahagi ay dapat gawin ng may pagkain.'
theological_decisions:
- issue: Generic na panawagan at kinatawang isahan
  choice: Ang may ... sa taong wala ... ang may
  alternative: Ang sinumang may ... sa sinumang wala
  rationale: Ang mga substantival participle sa Griyego ay nasa isahan ngunit generic. Ang “ang may” ay likas sa Filipino, nananatiling pangkalahatan, at hindi nag-aangkat ng hindi kailangang panlalaking pananalita.
- issue: Lakas ng mga pandiwang pautos
  choice: ay magbahagi ... gayon din ang gawin
  alternative: dapat magbahagi ... dapat ding gawin iyon
  rationale: Ang anyong pautos sa Filipino ay tuwirang naghahatid ng exhortational force ng mga third-person imperative nang gawing paglalarawan lamang o pahinain bilang mungkahi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tunika” para sa katumpakang pangkasaysayan, ngunit ipinaliwanag ito sa talababa para sa karaniwang mambabasa. Iniwasan ang masalimuot na literal na hulma ng pambungad na participle upang maging natural ang salaysay.
