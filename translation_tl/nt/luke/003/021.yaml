  source_fidelity: 'Malapit ang diwa ng salin sa Griyego: nauna o nakumpleto ang bautismo ni Jesus, nananalangin siya, at nabuksan ang langit. Gayunman, hindi naipahayag nang malinaw ang dagdag na puwersa ng καί para kay Jesus (“din”), at ang “Nangyari na nang” ay hindi natural na katumbas ng Ἐγένετο δέ.'
  naturalness: Hindi likas sa modernong Tagalog ang sunod na “Nangyari na nang.” Mas malinaw at marangal ang “Nangyari ito nang ...” Kasama ng “din” at maayos na paglalagay ng sugnay na “habang nananalangin siya,” nagiging mas madaling basahin ang pangungusap.
  terminology: Ang “mabautismuhan,” “nananalangin,” at “langit” ay angkop sa modernong Filipino Tagalog at sa rehistrong panrelihiyon. Ang talababa sa “langit” ay wastong nakaangkla at makatuwirang iniiwan ang posibleng kahulugang “kalangitan.”
  issues:
