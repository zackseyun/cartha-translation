    issue: Hindi natural ang “Nangyari na nang.”
    rationale: Ang “na” pagkatapos ng “Nangyari” ay kalabisan sa ganitong kayarian at lumilikha ng hindi likas na pag-uulit sa “nang.”
  - severity: low
    issue: Hindi hayag ang additive na kahulugan ng καί kaugnay ni Jesus.
    rationale: Ang “at matapos mabautismuhan si Jesus” ay maaaring maunawaan bilang simpleng sunod-sunod na pangyayari. Ang “si Jesus din” ay mas malinaw na tumutugon sa καὶ Ἰησοῦ.
