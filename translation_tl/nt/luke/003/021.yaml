reference: Luke 3:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν καὶ Ἰησοῦ βαπτισθέντος καὶ προσευχομένου ἀνεῳχθῆναι τὸν οὐρανὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/021.yaml
  text: It happened that when all the people were baptized[a], and Jesus also had been baptized and was praying, heaven was opened,
translation:
  language: tl
  text: Nangyari ito nang mabautismuhan ang lahat ng tao, at nang mabautismuhan din si Jesus, habang nananalangin siya ay nabuksan ang langit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kalangitan.” Ang salitang Griyego ay maaaring tumukoy sa nakikitang kalangitan o sa langit bilang makalangit na dako; sa kontekstong ito, mas angkop ang “langit” dahil isa itong tagpo ng paghahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Nangyari na
  rationale: Pinananatili ang pormulang pasalaysay ni Lucas at ang mahinang pagpapatuloy na ipinahihiwatig ng δέ, nang hindi nagdaragdag ng tahasang temporal na “ngayon.”
- source_word: ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν
  choice: nang mabautismuhan na ang lahat ng tao
  rationale: Ang articular infinitive na may ἐν ay temporal. Likas sa modernong Tagalog ang “nang,” at ipinahihiwatig ng “na” na natapos na ang bautismo ng mga tao bago ang pangunahing pangyayari.
- source_word: καὶ Ἰησοῦ βαπτισθέντος
  choice: at matapos mabautismuhan si Jesus
  rationale: Ipinakikita ng genitive absolute ang kalagayang nauna sa pagbubukas ng langit; malinaw itong naihahayag ng “matapos” nang hindi ginagawang aktibong tagaganap si Jesus.
- source_word: καὶ προσευχομένου
  choice: habang siya ay nananalangin
  rationale: Ang kasabay at nagpapatuloy na kilos ng participle ay natural na naipapahayag ng “habang ... nananalangin.”
- source_word: ἀνεῳχθῆναι
  choice: nabuksan
  rationale: Pinananatili ang pasibong diwa ng pandiwa at hindi ipinapasok ang mas matinding larawan ng pagkahati o pagkapunit.
- source_word: τὸν οὐρανὸν
  choice: ang langit
  rationale: Ang “langit” ay maaaring tumukoy sa nakikitang kalangitan o sa makalangit na dako, kaya napapanatili nito ang lawak ng kahulugan ng οὐρανός; sa konteksto, nangingibabaw ang pahayag na makalangit.
theological_decisions:
- issue: Ang tinutukoy ng οὐρανός sa tagpo ng bautismo
  choice: ang langit
  alternative: ang kalangitan
  rationale: Mas angkop sa kontekstong naghahayag ng Espiritu at tinig mula sa Diyos ang “langit,” ngunit hindi nito ganap na inaalis ang larawang nakikita sa itaas.
- issue: Ang ugnayan ng bautismo ni Jesus at ng pagbubukas ng langit
  choice: Natapos na ang bautismo ni Jesus, at naganap ang pagbubukas habang siya ay nananalangin.
  alternative: Sabay na naganap ang bautismo at pagbubukas ng langit.
  rationale: Ang aorist participle βαπτισθέντος ay pinakamalamang na nauna sa nagpapatuloy na προσευχομένου at sa pagbubukas ng langit. Hindi nito ipinapaliwanag ang teolohikal na dahilan ng pangyayari.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mabautismuhan” bilang karaniwang anyong panrelihiyon ngunit iniwasan ang natatanging pananalita ng anumang denominasyon. Inilipat ang panandang [a] sa “langit,” sapagkat doon talaga nauukol ang talababa.
