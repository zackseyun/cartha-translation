  rationale: Inalis ang di-likas na “na” sa pambungad, idinagdag ang “din” upang katawanin ang additive na καί, at pinanatili ang pasibong “mabautismuhan” at “nabuksan.” Ang “habang nananalangin siya” ay nagpapanatili sa kasabay at nagpapatuloy na kilos ng προσευχομένου, nang hindi nagpapataw ng higit pang teolohikal na paliwanag.
