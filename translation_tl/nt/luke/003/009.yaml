  source_fidelity: 'Tumpak na naipapahayag ng draft ang pangunahing larawan at pasibong paghatol: ang bawat punong hindi nagbubunga ng mabuti ay pinuputol at itinatapon sa apoy. Gayunman, ang “nakalapat” ay mas tiyak na nangangahulugang nakadikit o nakasandal mismo sa ugat, samantalang ang κεῖται ay ‘nakalagay/nakahimlay’ at nagpapakita ng pagkakapuwesto ng palakol sa ugat, hindi kinakailangang pisikal na pagkakadikit.'
