base_translation:
  language: en
  yaml_path: translation/nt/luke/003/009.yaml
  text: And already the ax is laid at the root of the trees[c][b][a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: tl
  text: Nakalagay na rin ang palakol sa ugat ng mga puno. Kaya ang bawat punong hindi namumunga ng mabuting bunga ay pinuputol at itinatapon sa apoy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη δὲ καὶ
  choice: Nakalapat na rin
  rationale: Ipinahahayag ng “na” ang pagiging kagyat ng babala, samantalang pinananatili ng “rin” ang dagdag na diin ng καὶ; likas sa Filipino ang pagkakaugnay nito sa pandiwang “nakalapat.”
- source_word: ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: ang palakol sa ugat ng mga puno
  rationale: Ang “palakol” ang malinaw na kasangkapang pamputol, at ang “nakalapat ... sa ugat” ay nagpapanatili sa larawan ng kasangkapang nakapuwesto at handa nang gamitin.
- source_word: πᾶν οὖν δένδρον
  choice: Kaya ang bawat puno
  rationale: Ang “kaya” ay natural na nagpapakita ng bunga o kongklusyong ipinahihiwatig ng οὖν, at pinananatili ng “bawat” ang saklaw ng πᾶν.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: hindi namumunga ng mabuting bunga
  rationale: Ang “namumunga” ang likas na katumbas sa Filipino sa konteksto ng puno, habang tahasang pinananatili ng “mabuting bunga” ang kalidad na ipinapahayag ng καλόν at ang talinghaga.
- source_word: ἐκκόπτεται
  choice: pinuputol
  rationale: Sa konteksto ng punong tinatamaan sa ugat, malinaw na ipinahihiwatig ng “pinuputol” ang pagputol at pagbagsak nito nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: εἰς πῦρ βάλλεται
  choice: itinatapon sa apoy
  rationale: Pinananatili nito ang kasalukuyang pasibong anyo at ang matinding larawan ng kapahamakang sinasabi ng Griyego.
theological_decisions:
- issue: Larawan ng nalalapit na paghatol
  choice: Panatilihin ang talinghaga ng palakol, mga puno, mabuting bunga, at apoy nang walang karagdagang pagpapakahulugan.
  alternative: Tukuyin ang apoy bilang impiyerno lamang o ang mga puno bilang isang partikular na pangkat lamang.
  rationale: Malinaw na nagbababala ang talata tungkol sa matindi at nalalapit na paghatol, ngunit hindi nito sa mismong pangungusap nililimitahan ang kahulugan ng apoy o tahasang tinutukoy ang saklaw ng mga puno.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “palakol,” “ugat,” at “namumunga” upang manatiling buhay at madaling maunawaan ang agrikultural na talinghaga; iniwasan ang mga salitang labis na arkaiko o paliwanag na denominasyonal.
