lexical_decisions:
- source_word: τοῦ
  choice: na anak ni
  rationale: Sa talaangkanan ni Lucas, ang paulit-ulit na artikulong nasa genitive ay eliptikong nagpapatuloy sa ugnayang ‘anak ni’ na itinakda ng konteksto. Ang paglalantad nito sa Filipino ay malinaw at natural.
- source_word: Ματταθίου
  choice: Matatias
  rationale: Pangalan ng tao; ginamit ang anyong madaling bigkasin at nakaugaliang baybay sa Filipino para sa Ματταθίας.
- source_word: Ἀμὼς
  choice: Amos
  rationale: Pangalan ng tao; pinanatili ang pamilyar na anyong Filipino na Amos.
- source_word: Ναοὺμ
  choice: Nahum
  rationale: Pangalan ng tao; pinili ang pamilyar na anyong Nahum sa mga saling Filipino.
- source_word: Ἑσλὶ
  choice: Esli
  rationale: Pangalan ng tao; tuwirang transliterasyon na natural basahin sa Filipino.
- source_word: Ναγγαὶ
  choice: Nagai
  rationale: Pangalan ng tao; isina-Filipino ang transliterasyon, na gumagamit ng isang g sapagkat sapat na iyon upang katawanin ang tunog ng γγ sa pangalang Griyego.
