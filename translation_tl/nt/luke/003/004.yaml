id: LUK.3.4
reference: Luke 3:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς γέγραπται ἐν βίβλῳ λόγων Ἠσαΐου τοῦ ⸀προφήτου· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/004.yaml
  text: 'as it is written in the book of the words of Isaiah the prophet[a], “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: tl
  text: 'ayon sa nakasulat sa aklat ng mga salita ni propetang Isaias:


    “Tinig ng isang sumisigaw sa ilang[a]:

    ‘Ihanda ninyo ang daan ng Panginoon[b];

    gawin ninyong tuwid ang kanyang mga landas.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “Tinig ng isang sumisigaw: ‘Sa ilang ay ihanda ninyo ang daan ng Panginoon.’”'
    reason: alternative_reading
  - marker: b
    text: O “PANGINOON.” Umaalingawngaw ang sipi sa Isaias 40:3, kung saan ang Hebreo ay may banal na pangalang YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς γέγραπται
  choice: ayon sa nakasulat
  rationale: Likas na pormulang Filipino sa pagpapakilala ng sipi mula sa Kasulatan; naipahihiwatig ng “nakasulat” ang nananatiling bisa ng perpektong pasibong γέγραπται.
- source_word: ἐν βίβλῳ λόγων
  choice: sa aklat ng mga salita
  rationale: Pinananatili ang parehong pangngalang βίβλος at λόγοι. Bagaman balumbon ang sinaunang anyo, natural at sapat ang “aklat” sa modernong Filipino.
- source_word: Ἠσαΐου τοῦ προφήτου
  choice: ni propetang Isaias
  rationale: Natural na appositional na ayos sa Filipino para tukuyin si Isaias bilang propeta at may-akda ng mga salitang sinipi.
- source_word: Φωνὴ βοῶντος
  choice: Tinig ng isang sumisigaw
  rationale: Pinananatili ang personal na diwa ng participle βοῶντος at ang matindi o hayagang pagtawag na ipinahihiwatig ng βοάω.
- source_word: ἐν τῇ ἐρήμῳ
  choice: sa ilang
  rationale: Ang “ilang” ay maikli, likas, at may dignidad na katumbas ng ἔρημος; ang pagkakabit nito sa “sumisigaw” ay sumusunod sa karaniwang pagbasa ng Griyegong sipi, habang inilalahad sa talababa ang tunay na sintaktikong kalabuan.
- source_word: Ἑτοιμάσατε
  choice: Ihanda ninyo
  rationale: Tuwirang pinananatili ang maramihang pautos; ang “ihanda” ay natural sa metapora ng paghahanda ng daan.
- source_word: τὴν ὁδὸν κυρίου
  choice: ang daan ng Panginoon
  rationale: Pinananatili ang biblikal na larawang-diwa ng isang daang inihahanda para sa pagdating ng Panginoon.
- source_word: κυρίου
  choice: Panginoon
  rationale: Ito ang tuwirang katumbas ng Griyegong κύριος. Hindi tahasang pinapalitan ng YHWH sa pangunahing teksto, ngunit ipinababatid sa talababa ang Hebreong pinagmulan ng sipi.
- source_word: εὐθείας ποιεῖτε
  choice: gawin ninyong tuwid
  rationale: Malinaw na inililipat ang predicate-adjective construction at pinananatili ang maramihang pautos.
- source_word: τὰς τρίβους αὐτοῦ
  choice: ang kanyang mga landas
  rationale: Ang “mga landas” ay natural na katumbas ng τρίβοι at pinananatili ang paralelismo sa “daan.”
theological_decisions:
- issue: Ang κύριος sa siping ang Hebreong pinagmulan ay tumutukoy sa YHWH
  choice: Panginoon
  alternative: PANGINOON
  rationale: Griyego ang tuwirang pinagsasaligang teksto ni Lucas at κύριος ang mababasa rito, kaya “Panginoon” ang nasa pangunahing teksto. Binabanggit sa talababa ang YHWH upang mapanatili ang tipanang pinagmulan at teolohikal na tensiyon nang hindi ipinapasok sa salin ang higit sa hayagang anyo ng Griyego.
- issue: Pagkakabit ng pariralang ἐν τῇ ἐρήμῳ
  choice: ikinabit sa “sumisigaw”
  alternative: ikinabit sa utos na “Ihanda ninyo”
  rationale: Ang bantas ay editoryal at maaaring unawain ang parirala sa alinmang paraan. Pinili sa pangunahing teksto ang tradisyonal at kontekstuwal na pagbasa kay Juan, ngunit malinaw na pinanatili sa talababa ang alternatibong pagkakabit.
translation_notes:
  register: Modernong Filipino na may dignidad at bahagyang pormal na himig na angkop sa sipi mula sa propeta. Ginamit ang “ninyo” upang maipakita ang maramihang pautos, “ilang” para sa maikli at biblikal ngunit nauunawaang katawagan, at karaniwang kapitalisasyon sa “Panginoon.”
