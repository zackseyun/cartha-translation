  rationale: Sa talaangkanan ng Lucas, ang paulit-ulit na genitive article ay nagpapatuloy sa diwa ng naunang “anak ni”; malinaw at likas itong ipahayag sa Tagalog sa bawat pangalan.
- source_word: Ἰεσσαὶ
