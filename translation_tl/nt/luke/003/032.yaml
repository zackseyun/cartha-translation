  rationale: Karaniwang anyo ng pangalang biblikal na tumutugma sa Griyegong Ἰεσσαί.
- source_word: Ἰωβὴλ
  choice: Jobed
  rationale: Sinusunod ang pangalan sa ibinigay na tekstong SBLGNT at ang audited consultation layer, sa halip na tahimik na gawing “Obed.”
- source_word: Βόος
  choice: Boaz
  rationale: Karaniwang anyo sa Tagalog ng pangalang tinutukoy ng Griyegong Βόος.
- source_word: Σαλὰ
  choice: Sala
  rationale: Tuwirang transliterasyon ng anyong Σαλά sa ibinigay na source text, nang hindi ito ipinapalit sa ibang anyo ng pangalan.
- source_word: Ναασσὼν
  choice: Nahshon
  rationale: Karaniwang anyong biblikal na malinaw na kumakatawan sa Griyegong Ναασσών.
