  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπέλυσεν δὲ τὸν διὰ στάσιν καὶ φόνον βεβλημένον ⸀εἰς φυλακὴν ὃν ᾐτοῦντο, τὸν δὲ Ἰησοῦν παρέδωκεν τῷ θελήματι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/025.yaml
  text: So he released the man who had been thrown into prison for insurrection and murder[a], whom they were asking for[b]; but he handed Jesus over to their will.
translation:
  language: tl
  text: Kaya pinalaya niya ang lalaking itinapon sa bilangguan[a] dahil sa paghihimagsik at pagpatay—ang siyang hinihingi nila[b]—ngunit ibinigay niya si Jesus ayon sa kanilang kagustuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “ibinilanggo.” Mas matingkad ang Griego: “itinapon sa bilangguan.”'
    reason: lexical_alternative
  - marker: b
    text: O “ang patuloy nilang hinihiling.”
    reason: aspectual_alternative
lexical_decisions:
- source_word: ἀπέλυσεν
  choice: pinalaya
  rationale: Tiyak at likas na salin para sa pagpapalaya sa isang bilanggo sa kontekstong legal.
- source_word: διὰ στάσιν καὶ φόνον
  choice: dahil sa paghihimagsik at pagpatay
  rationale: Ipinahahayag ng διά na ang mga ito ang dahilan ng pagkabilanggo; ang στάσις dito ay pampolitikang pag-aalsa, hindi karaniwang pagtatalo lamang.
- source_word: βεβλημένον εἰς φυλακήν
  choice: itinapon sa bilangguan
  rationale: Pinananatili ang matingkad na larawan ng βάλλω at ang kalagayang bunga ng naunang pagkabilanggo.
- source_word: ὃν ᾐτοῦντο
  choice: ang siyang hinihingi nila
  rationale: Ipinahihiwatig ng imperpektong ᾐτοῦντο ang nagpapatuloy nilang paghingi; hindi ito pinalakas tungo sa tahasang ‘iginigiit’ o ‘ipinag-uutos.’
- source_word: παρέδωκεν
  choice: ipinaubaya
  rationale: Likas sa Filipino at ipinakikita ang pagsuko o pagbibigay kay Jesus sa kapangyarihan ng pasiya ng iba, bagaman hindi inuulit ang pisikal na larawan ng ‘iniabot.’
- source_word: τῷ θελήματι αὐτῶν
  choice: sa kanilang kagustuhan
  rationale: Pinananatili ang diwa ng θέλημα bilang kanilang nais o kalooban nang hindi nagdaragdag kung ano ang gagawin nila kay Jesus.
- source_word: δὲ ... δὲ
  choice: Kaya ... ngunit
  rationale: Ang una ay maayos na nagpapatuloy sa salaysay, samantalang ang ikalawa ay malinaw na nagtatampok sa kabaligtarang sinapit ni Jesus.
theological_decisions:
- issue: Ang paghahambing sa pinalayang rebelde at kay Jesus nang hindi nagdaragdag ng paliwanag tungkol sa pagtubos
  choice: Hayagang pinanatili ang salungatan sa pagitan ng pagpapalaya sa lalaki at pagpapaubaya kay Jesus, ngunit walang idinagdag na ‘kapalit niya’ o katulad na paliwanag.
  alternative: Isingit ang ‘bilang kapalit ni Jesus’ o ‘sa halip na si Jesus.’
  rationale: Inilalahad ng talata ang pasiya ni Pilato at ang kagustuhan ng mga tao, ngunit hindi nito tuwirang ipinapaliwanag ang pangyayari bilang doktrina ng pagpapalit.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘paghihimagsik’ para sa pampolitikang pag-aalsa, at ‘ipinaubaya’ upang maipahayag nang natural ang pagsuko kay Jesus sa kanilang kagustuhan nang hindi nagdaragdag ng paliwanag na wala sa teksto.
