  naturalness: Natural at marangal ang kabuuang Filipino. Mas malinaw at pangkaraniwan sa salaysay na legal ang “ibinigay niya si Jesus ayon sa kanilang kagustuhan” kaysa “ipinaubaya niya si Jesus sa kanilang kagustuhan.”
