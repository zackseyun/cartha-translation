id: LUK.23.44
reference: Luke 23:44
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂Καὶ ἦν⸃ ⸀ἤδη ὡσεὶ ὥρα ἕκτη καὶ σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/044.yaml
  text: And it was already about the sixth hour[b][a], and darkness came over the whole land until the ninth hour.
translation:
  language: tl
  text: Bandang tanghali na noon[a], at nagdilim sa buong lupain[b] hanggang alas tres ng hapon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bandang ikaanim na oras.” Ang ibig sabihin ay bandang tanghali.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “sa buong daigdig.” Ang salitang Griyego na γῆ ay maaaring mangahulugang “lupain” o “daigdig.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἤδη
  choice: na
  rationale: Ipinahihiwatig na umabot na ang salaysay sa sandaling ito; likas itong ipinapahayag sa Filipino sa hulmaing “noon na ... noon.”
- source_word: ὡσεὶ ὥρα ἕκτη
  choice: noon na noon
  rationale: Ang ὡσεὶ ay nagsasaad ng pagtatantiya, at ang ikaanim na oras sa sinaunang pagbibilang mula pagsikat ng araw ay humigit-kumulang tanghali. Ang modernong oras ang ginamit upang maging agad na malinaw sa karaniwang mambabasa.
- source_word: σκότος ἐγένετο
  choice: nagdilim
  rationale: Natural at tuwirang Filipino para sa pangyayaring dumating o lumaganap ang dilim, nang hindi nagdaragdag ng paliwanag sa sanhi nito.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: sa buong lupain
  rationale: Maaaring mangahulugan ang γῆ ng lupain o daigdig. Pinipili ng “lupain” ang mas maingat na pangunahing salin habang pinananatili sa talababa ang mas malawak na posibilidad.
- source_word: ἕως ὥρας ἐνάτης
  choice: hanggang alas tres ng hapon
  rationale: Ang ikasiyam na oras ay humigit-kumulang alas tres ng hapon; malinaw at natural ang modernong katumbas sa Filipino.
theological_decisions:
- issue: Saklaw ng γῆ sa pahayag tungkol sa kadiliman
  choice: buong lupain
  alternative: buong daigdig
  rationale: Pinahihintulutan ng Griyego ang panrehiyon o pandaigdig na saklaw. Ang pangunahing teksto ay gumagamit ng mas maingat na “lupain,” ngunit inilalahad sa talababa ang “daigdig” upang hindi tahimik na lutasin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang mga kasalukuyang katawagan sa oras sa pangunahing teksto para madaling maunawaan, habang pinanatili sa talababa ang literal na sinaunang pagpapahayag. Ang “noon na noon noon” ay iniiwasan sana dahil sa tunog na paulit-ulit; gayunman, ang tekstong isinumite ay nangangailangan ng rebisyon tungo sa mas natural na “Bandang tanghali na noon” upang maging publikasyong maayos.
