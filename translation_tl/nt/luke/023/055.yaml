id: LUK.23.55
reference: Luke 23:55
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: κατακολουθήσασαι δὲ ⸀αἱ γυναῖκες, αἵτινες ἦσαν συνεληλυθυῖαι ⸂ἐκ τῆς Γαλιλαίας αὐτῷ⸃, ἐθεάσαντο τὸ μνημεῖον καὶ ὡς ἐτέθη τὸ σῶμα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/055.yaml
  text: The women who had come with him from Galilee followed and saw the tomb and how his body was laid[a].
translation:
  language: tl
  text: Sumunod ang mga babaeng kasama niyang dumating mula sa Galilea[a], at nakita nila ang libingan at kung paano inilagay ang kanyang katawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sumama sa kanya mula sa Galilea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακολουθήσασαι
  choice: Sumunod
  rationale: Ang aorist participle ay likas na isinalin bilang pandiwang nagsasaad ng naunang kilos sa salaysay. Malinaw at natural sa Filipino ang “Sumunod” bago ang “nakita nila.”
- source_word: δέ
  choice: hindi isinalin nang tahasan
  rationale: Mahinang panandang pangsalaysay ang δέ. Sapat nang ipinahihiwatig ng pagkakasunod ng mga sugnay ang pagpapatuloy, at ang “ngunit” o “ngayon” ay maaaring magdagdag ng di-kinakailangang pagsalungat o panahong di tahasang nasa Griyego.
- source_word: αἱ γυναῖκες
  choice: ang mga babae
  rationale: Tinutukoy ng artikulo ang kilala nang pangkat ng mga babae sa salaysay.
- source_word: αἵτινες
  choice: na
  rationale: Likas na pang-ugnay sa Filipino upang higit na tukuyin kung aling mga babae ang tinutukoy.
- source_word: συνεληλυθυῖαι ἐκ τῆς Γαλιλαίας αὐτῷ
  choice: kasama niyang dumating mula sa Galilea
  rationale: Pinananatili nito kapuwa ang pinanggalingang Galilea at ang diwang dumating silang kasama niya. Inilalahad sa talababa ang maaari ring pagdidiin sa pagsama o paglakbay kasama niya.
- source_word: ἐθεάσαντο
  choice: nakita nila
  rationale: Bagaman maaaring magpahiwatig ang pandiwa ng masusing pagtingin, sapat at natural ang “nakita nila” dahil nililinaw ng kasunod na mga parirala ang kanilang pinagmasdan.
- source_word: τὸ μνημεῖον
  choice: ang libingan
  rationale: Karaniwan, malinaw, at angkop na katawagan sa lugar na pinaglibingan sa kontekstong ito.
- source_word: ὡς
  choice: kung paano
  rationale: Ipinakikilala nito ang paraan ng pagkakalagay sa katawan, hindi lamang ang katotohanang inilagay ito.
- source_word: ἐτέθη
  choice: inilagay
  rationale: Tumpak at likas na pasibong diwa ng τίθημι sa konteksto ng paglilibing.
- source_word: τὸ σῶμα αὐτοῦ
  choice: ang kanyang katawan
  rationale: Tuwirang pinananatili ang σῶμα bilang “katawan” at malinaw ang pagmamay-ari.
theological_decisions:
- issue: Pagkakasunod ng participle na κατακολουθήσασαι at ng pangunahing pandiwang ἐθεάσαντο
  choice: 'Isinalin bilang magkasunod na kilos: “Sumunod ... at nakita nila”'
  alternative: “Pagkasunod nila ... nakita nila”
  rationale: Pinananatili ng likas na ayos sa Filipino ang pagkakasunod ng mga pangyayari nang hindi ginagawang doktrinal ang isang usaping pang-estilo.
- issue: Ugnayan ng mga babae kay Jesus sa pariralang συνεληλυθυῖαι ... αὐτῷ
  choice: “kasama niyang dumating”
  alternative: “sumama sa kanya”
  rationale: 'Hindi nilulutas nang labis ang saklaw ng parirala: malinaw na nanggaling sila sa Galilea na kasama niya, habang kinikilala sa talababa ang posibleng pagdidiin sa pagsama o paglakbay kasama niya.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang mas lumang anyong “yaon” at ang di-kinakailangang panandang “ngayon,” habang pinanatili ang payak na daloy ng salaysay.
