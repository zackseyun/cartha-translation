revisions:
- from: Nang makita ni Herodes si Jesus, tuwang-tuwa siya, sapagkat matagal na niyang gustong makita ito dahil lagi niyang nababalitaan ang tungkol dito, at umaasa siyang makakakita siya ng isang tanda[a] na gagawin nito.
  to: Nang makita ni Herodes si Jesus, labis siyang natuwa, sapagkat matagal na niyang gustong makita si Jesus dahil sa mga nababalitaan niya tungkol sa kanya, at umaasa siyang makakita ng isang tanda[a] na gagawin ni Jesus.
  rationale: Pinalitan ang mga demonstratibong "ito/nito" ng mga personal na panghalip at ng tahasang "ni Jesus" sa huling sugnay upang maging malinaw at natural ang pagtukoy kay Jesus at ang ahensiya niya sa paggawa ng tanda. Pinalitan ang "lagi niyang nababalitaan" ng "dahil sa mga nababalitaan niya" upang maipahayag ang paulit-ulit o nagpapatuloy na mga ulat nang hindi pinalalakas ang dalas nang higit sa Griyego. Nananatili ang "tanda" para sa σημεῖον at ang inaasahang gawang isasagawa ni Jesus para sa ὑπ’ αὐτοῦ γινόμενον.
