id: LUK.23.8
reference: Luke 23:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν ἐχάρη λίαν, ἦν γὰρ ⸂ἐξ ἱκανῶν χρόνων θέλων⸃ ἰδεῖν αὐτὸν διὰ τὸ ⸀ἀκούειν περὶ αὐτοῦ, καὶ ἤλπιζέν τι σημεῖον ἰδεῖν ὑπ’ αὐτοῦ γινόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/008.yaml
  text: When Herod saw Jesus[a], he rejoiced greatly, for he had for a long time wanted to see him because he had heard about him[b], and he was hoping to see some sign done by him.
translation:
  language: tl
  text: Nang makita ni Herodes si Jesus, labis siyang natuwa, sapagkat matagal na niyang gustong makita si Jesus dahil sa mga nababalitaan niya tungkol sa kanya, at umaasa siyang makakita ng isang tanda[a] na gagawin ni Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang himala.” Ang salitang Griyego ay “tanda” (σημεῖον), na maaaring tumukoy sa isang mahimalang gawa na itinuturing na makabuluhang tanda.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρη λίαν
  choice: tuwang-tuwa siya
  rationale: Natural at mariing Filipino na nagpapahayag ng napakalaking tuwa, ayon sa λίαν.
- source_word: ἐξ ἱκανῶν χρόνων
  choice: matagal na
  rationale: Likas na katumbas ng idyomang tumutukoy sa mahabang panahon nang hindi itinatakda kung ilang taon.
- source_word: θέλων ἰδεῖν αὐτόν
  choice: gustong makita ito
  rationale: Direkta at makabagong salin ng patuloy na pagnanais ni Herodes.
- source_word: διὰ τὸ ἀκούειν περὶ αὐτοῦ
  choice: dahil lagi niyang nababalitaan ang tungkol dito
  rationale: Ipinahihiwatig ng present infinitive ang paulit-ulit o nagpapatuloy na pagkarinig ng mga ulat; natural itong naihahayag ng “lagi niyang nababalitaan.”
- source_word: ἤλπιζέν τι σημεῖον ἰδεῖν
  choice: umaasa siyang makakakita siya ng isang tanda
  rationale: Pinananatili ng “tanda” ang mas malawak at teolohikal na saklaw ng σημεῖον kaysa sa tahasang “himala.”
- source_word: ὑπ’ αὐτοῦ γινόμενον
  choice: na gagawin nito
  rationale: Natural na Filipino para sa tanda na inaasahang isasagawa ni Jesus, habang pinananatili ang ahensiyang ipinahahayag ng ὑπό.
- source_word: ὁ δὲ Ἡρῴδης
  choice: ni Herodes
  rationale: Hindi kailangang isalin nang hiwalay ang mahinang panandang pasalaysay na δέ; ang temporal na sugnay ang natural na nagpapatuloy sa salaysay.
- source_word: ἰδὼν τὸν Ἰησοῦν
  choice: Nang makita ni Herodes si Jesus
  rationale: Ang aorist participle ay natural na inuunawa bilang temporal at nauuna sa pangunahing kilos ng pagkatuwa.
theological_decisions:
- issue: Saklaw ng σημεῖον
  choice: tanda
  alternative: himala
  rationale: Bagaman isang mahimalang gawa ang inaasahan ni Herodes, hindi dapat paliitin ang salitang Griyego sa “himala” lamang; maaaring tumukoy ang σημεῖον sa makabuluhang gawang nagsisilbing tanda.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ito/nito” para kay Jesus bilang natural na panghalip sa Filipino kapag malinaw ang tinutukoy, nang walang pahiwatig ng kawalang-galang. Ang “lagi niyang nababalitaan” ay nagpapanatili sa paulit-ulit o nagpapatuloy na diwa ng ἀκούειν.
