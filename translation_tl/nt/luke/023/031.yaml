  source_fidelity: 'Tapat ang salin sa Griyego: naipapahayag ang sanhi sa “Sapagkat,” ang kasalukuyang at di-tinukoy na simuno sa “ginagawa nila,” ang pangmaramihang “mga bagay na ito,” at ang retorikal na tanong tungkol sa kahihinatnan. Ang “sariwang kahoy” at “tuyong kahoy” ay pinananatili ang metapora at ang magkatapat na larawan ng ὑγρός at ξηρός nang hindi ipinipilit ang isang interpretasyon.'
