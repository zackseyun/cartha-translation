id: LUK.23.31
reference: Luke 23:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι εἰ ἐν ⸀τῷ ὑγρῷ ξύλῳ ταῦτα ποιοῦσιν, ἐν τῷ ξηρῷ τί γένηται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/031.yaml
  text: For if they do these things when the wood is green[b][a], what will happen when it is dry?
translation:
  language: tl
  text: Sapagkat kung ginagawa nila ang mga bagay na ito sa sariwang kahoy,[a][b] ano ang mangyayari sa tuyong kahoy?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa basang kahoy.” Ang salitang Griyego ay tumutukoy sa kahoy na sariwa o mamasa-masa pa, bilang kabaligtaran ng tuyong kahoy.
    reason: lexical_alternative
  - marker: b
    text: 'Malamang na nagpapahiwatig ang larawan ng paghahambing mula sa mas magaan tungo sa mas mabigat: kung ginagawa ang ganitong mga bagay sa sariwang kahoy, ano pa kaya ang mangyayari sa tuyong kahoy? Hindi tahasang tinutukoy sa talata kung sino ang inilalarawan ng bawat isa.'
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinananatili nito ang sanhi o paliwanag na kaugnayan ng kasabihan sa naunang babala ni Jesus.
- source_word: ἐν τῷ ὑγρῷ ξύλῳ
  choice: sa sariwang kahoy
  rationale: Likas sa Filipino ang pariralang ito at pinananatili nito ang larawan ng kahoy na may halumigmig pa, bilang katapat ng tuyong kahoy.
- source_word: ὑγρῷ
  choice: sariwang
  rationale: Sa konteksto ng kahoy at sa pagsalungat dito sa ξηρός, tumutukoy ito sa kahoy na hindi pa tuyo. Mas angkop dito ang “sariwa” kaysa literal na “basa,” na maaaring magpahiwatig na nabuhusan lamang ng tubig.
- source_word: ξύλῳ
  choice: kahoy
  rationale: Hindi tiyak na punong buháy ang tinutukoy; ang “kahoy” ang pinakamalawak at pinakanatural na katumbas na nagpapanatili sa larawan ng sariwa at tuyong materyal.
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang pangmaramihang demonstratibo at ang maluwag nitong pagtukoy sa mga ginagawang nakapaligid sa pagdurusa ni Jesus.
- source_word: ποιοῦσιν
  choice: ginagawa nila
  rationale: Pinananatili ang kasalukuyang kilos at ang hindi tahasang tinukoy na simuno ng Griyego nang hindi nililimitahan kung sino ang tinutukoy.
- source_word: ἐν τῷ ξηρῷ
  choice: sa tuyong kahoy
  rationale: Inuulit ang pangngalang “kahoy” upang maging malinaw at balanseng pakinggan sa Filipino ang paghahambing.
- source_word: τί γένηται
  choice: ano ang mangyayari
  rationale: Natural na ipinahahayag nito ang inaasahang kahihinatnan sa retorikal na tanong.
theological_decisions:
- issue: Larawan ng sariwa at tuyong kahoy
  choice: Panatilihin ang metapora sa pangunahing teksto nang hindi tinutukoy kung sino ang bawat uri ng kahoy.
  alternative: Ipaliwanag na ang “sariwang kahoy” ay si Jesus at ang “tuyong kahoy” ay ang Jerusalem o ang mga hahatulan.
  rationale: Hindi tahasang tinutukoy ng Griyego ang eksaktong mga tinutukoy ng larawan. Ang hindi pagpapaliwanag nito sa salin ay nagpapanatili sa tunay na pahiwatig at tensiyong teolohikal ng kasabihan.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Pinanatili ang maikli at matalim na anyo ng retorikal na tanong at ang metaporang kahoy nang hindi ito pinapalitan ng interpretasyon.
