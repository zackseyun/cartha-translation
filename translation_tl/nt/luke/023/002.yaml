revisions:
- from: At sinimulan nila siyang paratangan[a]. Sinabi nila, “Natuklasan naming inililigaw ng taong ito ang aming bansa at pinagbabawalan kaming magbayad ng buwis sa Emperador,[b] at sinasabi niyang siya mismo ang Mesiyas, isang hari.”[c]
  to: At nagsimula silang magparatang laban sa kanya[a], na sinasabi, “Natuklasan naming inililigaw ng taong ito ang aming bansa at pinagbabawalan kaming magbayad ng buwis kay Cesar,[b] at sinasabi niyang siya mismo ay Mesiyas, isang hari.”[c]
  rationale: The revision makes the accusation formula more idiomatic and source-close, preserves the ongoing accusations and their coordination, and uses 'Cesar' to retain the source expression while keeping the explanatory cultural note. No theological interpretation has been added or resolved.
