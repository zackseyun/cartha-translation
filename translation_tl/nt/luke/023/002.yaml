id: LUK.23.2
reference: Luke 23:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ λέγοντες· Τοῦτον εὕραμεν διαστρέφοντα τὸ ἔθνος ⸀ἡμῶν καὶ κωλύοντα ⸂φόρους Καίσαρι⸃ διδόναι ⸀καὶ λέγοντα ⸀αὑτὸν χριστὸν βασιλέα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/002.yaml
  text: And they began to accuse him[a], saying, “We found this man misleading our nation and forbidding us to pay taxes to Caesar, and saying that he himself is Messiah[c][b], a king.”
translation:
  language: tl
  text: At nagsimula silang magparatang laban sa kanya[a], na sinasabi, “Natuklasan naming inililigaw ng taong ito ang aming bansa at pinagbabawalan kaming magbayad ng buwis kay Cesar,[b] at sinasabi niyang siya mismo ay Mesiyas, isang hari.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inililihis ang aming bansa,” “ginugulo ang aming bansa,” o “inililigaw ang aming bayan.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego na φόρους ay tumutukoy sa buwis o tributong ibinabayad sa Romanong pinuno. Ang “Cesar” ay titulo ng emperador ng Roma.
    reason: cultural_note
  - marker: c
    text: Maaari ring “sinasabi niyang siya mismo ay Cristo, isang hari.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ
  choice: At sinimulan nila siyang paratangan
  rationale: Pinananatili ng “sinimulan” ang ingressive na diwa ng ἤρξαντο, at ang “paratangan” ay natural at angkop sa kontekstong legal para sa κατηγορεῖν.
- source_word: Τοῦτον
  choice: ang taong ito
  rationale: Likas na Tagalog ito para sa deiktikong pagtukoy at maaari ring maghatid ng mapanghamak na himig ng paratang.
- source_word: εὕραμεν
  choice: Natuklasan namin
  rationale: Ipinapahayag ang pag-aangking nakapagtatag sila ng saligan para sa kanilang sakdal; mas malinaw rito kaysa sa literal ngunit maaaring malabong “nasumpungan namin.”
- source_word: διαστρέφοντα
  choice: inililigaw
  rationale: Saklaw nito ang diwang paglihis o pag-akay sa maling landas nang hindi nililimitahan ang salita sa tahasang pampolitikang paghihimagsik.
- source_word: τὸ ἔθνος ἡμῶν
  choice: ang aming bansa
  rationale: Ang pampolitikang tagpo sa harap ni Pilato ay pumapabor sa “bansa,” bagaman maaari ring tumukoy ang ἔθνος sa bayan o sambayanan.
- source_word: κωλύοντα φόρους Καίσαρι διδόναι
  choice: pinagbabawalan kaming magbayad ng buwis sa Emperador
  rationale: Ginagawang hayag ang ipinahihiwatig na tagaganap ng διδόναι at natural na naihahatid ang alegasyong ipinagbabawal ang pagbabayad ng buwis o tributo sa Romanong pinuno.
- source_word: αὑτὸν
  choice: siya mismo
  rationale: Pinananatili ang diin ng reflexive pronoun.
- source_word: χριστὸν βασιλέα
  choice: ang Mesiyas, isang hari
  rationale: Ginagamit ang “Mesiyas” bilang titulong maharlika at pinananatiling magkahiwalay ang dalawang predicative accusative sa halip na pagsamahin sa isang mas tiyak na pormula.
theological_decisions:
- issue: Pagsasalin sa χριστόν sa isang paratang na pampolitika
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay gumaganap ang χριστός bilang titulo ng pinahirang maharlika, hindi bilang pangalang halos pantangi; pinananatili ng “Mesiyas” ang kontekstong Judio at ang pampolitikang bigat ng sakdal.
- issue: Ugnayan ng χριστόν at βασιλέα
  choice: ang Mesiyas, isang hari
  alternative: ang Mesiyas na Hari
  rationale: Hindi tiyak kung dapat pagsamahin ang mga salita bilang isang nakapirming titulo. Ang appositional na anyo ay nagpapanatili sa dalawang sangkap at sa sintaktikong tensiyon ng Griyego.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Emperador” sa pangunahing teksto upang malinaw sa karaniwang mambabasa ang tungkulin ni Caesar, habang ipinaliwanag sa talababa ang mismong titulong Romano. Iniwasan ang masyadong arkaikong “bintang” o “tributo” sa pangunahing teksto.
