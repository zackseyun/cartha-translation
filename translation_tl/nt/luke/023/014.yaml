  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν πρὸς αὐτούς· Προσηνέγκατέ μοι τὸν ἄνθρωπον τοῦτον ὡς ἀποστρέφοντα τὸν λαόν, καὶ ἰδοὺ ἐγὼ ἐνώπιον ὑμῶν ἀνακρίνας ⸀οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον ὧν κατηγορεῖτε κατ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/014.yaml
  text: He said to them[a], “You brought this man to me as one who was misleading the people, and behold, after examining him before you[b], I found no basis in this man for the charges you bring against him.”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Dinala ninyo sa akin ang taong ito bilang isang nagliligaw sa bayan.[a] Narito, matapos ko siyang siyasatin sa harap ninyo, wala akong nakitang batayan sa taong ito kaugnay ng mga paratang ninyo laban sa kanya.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “inilalayo niya ang bayan.” Ang pandiwang Griego ay maaaring mangahulugang ilayo o iligaw.
    reason: lexical_alternative
  - marker: b
    text: O, “wala akong nakitang pagkakasala sa taong ito tungkol sa mga bagay na ipinaparatang ninyo sa kanya.”
    reason: alternative_reading
lexical_decisions:
- source_word: Προσηνέγκατέ μοι
  choice: Dinala ninyo sa akin
  rationale: Likas at tuwirang ipinapahayag ang natapos nilang pagdadala kay Jesus kay Pilato, habang pinananatili ang tuwirang pakikipag-usap at kontekstong panghukuman.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: ang taong ito
  rationale: Tumpak at natural na tumutukoy sa partikular na lalaking nasa harap ni Pilato.
- source_word: ὡς ἀποστρέφοντα τὸν λαόν
  choice: at pinaratangan na inililigaw niya ang bayan
  rationale: Ipinakikita ng ὡς ang pagkakakilanlan o paratang na iniharap nila; ang “inililigaw” ay naghahatid ng diwang pagtalikod o paglihis nang hindi pinalalakas tungo sa “inuudyukan.”
- source_word: τὸν λαόν
  choice: ang bayan
  rationale: Ang “bayan” ay natural na kolektibong katawagan at mas angkop kaysa “mga tao” sa pampublikong paratang sa kontekstong ito.
- source_word: ἰδοὺ
  choice: masdan ninyo
  rationale: Pinananatili ang pantawag-pansing lakas ng ἰδού sa marangal ngunit nauunawaang modernong Filipino.
- source_word: ἐνώπιον ὑμῶν
  choice: sa harap ninyo
  rationale: Malinaw na ipinahahayag na isinagawa ang pagsisiyasat nang hayagan at nasa kanilang presensya.
- source_word: ἀνακρίνας
  choice: matapos ko siyang siyasatin
  rationale: Ang “siyasatin” ay angkop sa pormal at panghukumang pagsusuri; ipinapakita ng “matapos” ang kaugnayan ng participle sa pangunahing pandiwa.
- source_word: οὐθὲν εὗρον ... αἴτιον
  choice: wala akong nakitang batayan
  rationale: Natural na pormulang panghukuman na nagpapahayag na walang natagpuang sapat na saligan para sa ipinaparatang.
- source_word: ὧν κατηγορεῖτε κατ’ αὐτοῦ
  choice: para sa mga paratang ninyo laban sa kanya
  rationale: Pinananatili ang legal na diwa ng κατηγορέω at malinaw na iniuugnay ang kawalan ng batayan sa mismong mga paratang nila.
theological_decisions:
- issue: Saklaw ng pahayag ni Pilato
  choice: Isinalin bilang panghukumang pasya na walang batayan ang mga paratang
  alternative: Wala akong nakitang kasalanan sa taong ito
  rationale: Ang ἀνακρίνω, αἴτιον, at κατηγορέω ay bumubuo ng legal na konteksto. Hindi pinalalawak ang sinabi tungo sa isang ganap na pahayag tungkol sa moral na kawalang-kasalanan na hiwalay sa mga paratang na sinusuri.
- issue: Kahulugan ng ἀποστρέφοντα
  choice: inililigaw niya ang bayan
  alternative: inilalayo niya ang bayan
  rationale: Pinananatili sa pangunahing teksto ang kontekstuwal na diwang “nagliligaw,” habang inilalagay sa talababa ang mas literal na posibilidad na “inilalayo” upang hindi ikubli ang tunay na saklaw ng pandiwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang “siyasatin” at “batayan” upang mapanatili ang panghukumang himig, at ang “masdan ninyo” upang ihatid ang diin ng ἰδού nang hindi lubhang makaluma. Lahat ng talababa ay may katumbas na marker sa pangunahing teksto.
