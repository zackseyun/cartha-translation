- from: Sinabi niya sa kanila, “Dinala ninyo sa akin ang taong ito at pinaratangan na inililigaw niya ang bayan.[a] Ngunit masdan ninyo, matapos ko siyang siyasatin sa harap ninyo, wala akong nakitang batayan sa taong ito para sa mga paratang ninyo laban sa kanya.[b]”
  to: Sinabi niya sa kanila, “Dinala ninyo sa akin ang taong ito bilang isang nagliligaw sa bayan.[a] Narito, matapos ko siyang siyasatin sa harap ninyo, wala akong nakitang batayan sa taong ito kaugnay ng mga paratang ninyo laban sa kanya.[b]”
