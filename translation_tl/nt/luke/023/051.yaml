revisions:
- from: Ang taong ito ay hindi sumang-ayon sa kanilang pasiya at ginawa[a]—taga-Arimatea siya, isang lungsod ng mga Judio, at hinihintay niya ang kaharian ng Diyos.
  to: Ang taong ito ay hindi sumang-ayon sa kanilang plano at pagkilos[a]—siya ay mula sa Arimatea, isang lungsod ng mga Judio, at hinihintay niya ang kaharian ng Diyos.
  rationale: Pinalitan ang hindi likas na “pasiya at ginawa” ng “plano at pagkilos” upang malinaw na maipakita ang pares na βουλή at πρᾶξις. Inayos din ang parirala tungkol sa Arimatea upang hindi malabo ang tinutukoy ng “isang lungsod.” Pinanatili ng talababa ang “pasiya at ginawa” bilang posibleng mas literal na alternatibo.
