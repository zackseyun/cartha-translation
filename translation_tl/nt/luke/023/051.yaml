  text: οὗτος οὐκ ἦν συγκατατεθειμένος τῇ βουλῇ καὶ τῇ πράξει αὐτῶν— ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων, ὃς ⸀προσεδέχετο τὴν βασιλείαν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/051.yaml
  text: This man had not agreed with their plan and action—he was from Arimathea[a], a city of the Jews, and he was waiting for the kingdom of God.
translation:
  language: tl
  text: Ang taong ito ay hindi sumang-ayon sa kanilang plano at pagkilos[a]—siya ay mula sa Arimatea, isang lungsod ng mga Judio, at hinihintay niya ang kaharian ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kanilang pasiya at ginawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Ang taong ito
  rationale: Muling tumutukoy nang may diin kay Jose sa naunang talata; mas tapat ito sa demonstratibo kaysa sa payak na “siya.”
- source_word: συγκατατεθειμένος
  choice: hindi sumang-ayon
  rationale: Ipinahahayag nito ang dati at matatag na hindi pagsang-ayon ni Jose, sa natural na makabagong Tagalog.
- source_word: βουλῇ
  choice: pasiya
  rationale: Sa konteksto, tumutukoy ito sa napagpasiyahang layunin ng mga pinuno, hindi sa konseho bilang institusyon.
- source_word: πράξει
  choice: ginawa
  rationale: Tumutukoy ito sa aktuwal nilang isinagawa at malinaw na ipinapares sa kanilang pasiya.
- source_word: ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων
  choice: taga-Arimatea siya, isang lungsod ng mga Judio
  rationale: Pinananatili ang appositional na ayos at ang tuwirang pagtukoy ng Griyego sa Arimatea bilang lungsod ng mga Judio.
- source_word: προσεδέχετο
  choice: hinihintay niya
  rationale: Ipinakikita ng aspektong imperpektibo ang nagpapatuloy at may pag-asang paghihintay.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Karaniwan, malinaw, at may bigat na salin ng pangunahing parirala sa Lucas, nang hindi nililimitahan ito sa isang partikular na paliwanag ng paghahari.
theological_decisions:
- issue: Ang pagkakahiwalay ni Jose sa papel ng Sanhedrin sa pagkamatay ni Jesus
  choice: Sabihing hindi siya sumang-ayon sa kanilang pasiya at ginawa.
  alternative: Sabihing hindi siya bumoto para sa kanilang pasiya.
  rationale: Tiyak na sinasabi ng Griyego ang hindi niya pagsang-ayon sa kanilang pasiya at ginawa, ngunit hindi nito tahasang inilalarawan ang isang pormal na pagboto; kaya hindi iyon idinagdag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “taga-Arimatea” bilang likas na paraan ng pagsasaad ng pinagmulan, habang pinanatili ang “isang lungsod ng mga Judio.”
