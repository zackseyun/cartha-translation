id: LUK.23.26
reference: Luke 23:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὡς ἀπήγαγον αὐτόν, ἐπιλαβόμενοι ⸂Σίμωνά τινα Κυρηναῖον ἐρχόμενον⸃ ἀπ’ ἀγροῦ ἐπέθηκαν αὐτῷ τὸν σταυρὸν φέρειν ὄπισθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/026.yaml
  text: And as they led him away[a], they seized a certain Simon of Cyrene, coming in from the countryside[b], and laid the cross on him to carry behind Jesus.
translation:
  language: tl
  text: Habang dinadala nila si Jesus palayo, sinunggaban nila ang isang lalaking nagngangalang Simon, na taga-Cirene at papasok mula sa bukid[a]. Ipinasan nila sa kanya ang krus[b] upang dalhin niya ito sa likuran ni Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa kabukiran.” Ang salitang Griyego ay maaaring tumukoy sa isang bukid o, sa mas malawak na diwa, sa kanayunang nasa labas ng lungsod.
    reason: lexical_alternative
  - marker: b
    text: Ipinapalagay ng ilan na ang tinutukoy rito ay ang pahalang na kahoy ng krus, ngunit “krus” lamang ang sinasabi ng tekstong Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  choice: dinadala nila si Jesus palayo
  rationale: Ipinahahayag ng ἀπάγω ang pag-akay o pagdala sa isang tao palayo. Likas sa modernong Tagalog ang pariralang ito at pinananatili nitong si Jesus ay nasa ilalim ng kanilang kapangyarihan.
- source_word: ἐπιλαβόμενοι
  choice: sinunggaban nila
  rationale: Ang pandiwang ἐπιλαμβάνομαι ay nagsasaad dito ng sapilitang paghawak sa isang tao. Ang “sinunggaban” ay malinaw at masiglang nagpapakita ng puwersahang kilos nang hindi ipinahihiwatig na pormal na inaresto si Simon.
- source_word: Σίμωνά τινα Κυρηναῖον
  choice: isang lalaking nagngangalang Simon, na taga-Cirene
  rationale: Ipinakikilala ng τινα ang isang taong hindi pa kilala sa salaysay. Mas natural sa Tagalog ang “isang lalaking nagngangalang Simon” kaysa “isang Simon,” at malinaw na ipinahahayag ng “taga-Cirene” ang Κυρηναῖον.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: papasok mula sa bukid
  rationale: Maaaring tumukoy ang ἀγρός sa isang bukid o sa kanayunang nasa labas ng lungsod. Ang “papasok mula sa bukid” ay natural sa konteksto ngunit hindi lubusang nilulutas ang leksikal na lawak ng salita; ipinaliliwanag ito sa talababa.
- source_word: ἐπέθηκαν αὐτῷ τὸν σταυρὸν
  choice: ipinasan nila sa kanya ang krus
  rationale: Ang ἐπιτίθημι ay nangangahulugang ilagay o ipatong sa isang tao. Ang “ipinasan” ay likas sa Tagalog para sa paglalagay ng dalahing kailangan niyang buhatin.
- source_word: τὸν σταυρὸν
  choice: ang krus
  rationale: Ang σταυρός ay tuwirang nangangahulugang “krus.” Hindi ito isinalin bilang “pahalang na kahoy ng krus” sapagkat hindi ganoon katiyak ang salitang ginamit sa Griyego.
- source_word: φέρειν
  choice: upang dalhin niya ito
  rationale: Ang φέρω ay nangangahulugang dalhin o pasanin. Ang “dalhin” ay malinaw at natural, samantalang naipahayag na ng “ipinasan” ang bigat ng ipinataw kay Simon.
- source_word: ὄπισθεν τοῦ Ἰησοῦ
  choice: sa likuran ni Jesus
  rationale: Pangunahing tumutukoy ang ὄπισθεν sa puwestong nasa likuran. Pinananatili ng salin ang konkretong ayos ng prusisyon nang hindi ito binibigyan ng dagdag na simbolikong kahulugan.
theological_decisions:
- issue: Kung ang σταυρός ay dapat gawing mas tiyak na “pahalang na kahoy ng krus” sa salaysay ng pagpapako
  choice: ang krus
  alternative: ang pahalang na kahoy ng krus
  rationale: σταυρός ang nasa tekstong Griyego, hindi isang mas espesipikong katawagan para sa isang bahagi ng krus. Ang “krus” ang tuwirang salin at umiiwas sa pagpasok ng isang historikal na rekonstruksiyong hindi tahasang sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “si Jesus” sa unang banggit sa halip na panghalip lamang upang maging malinaw ang tinutukoy, at pinanatili ang puwersahang kilos, ang heograpikong pinagmulan ni Simon, at ang konkretong puwesto niya sa likuran ni Jesus.
