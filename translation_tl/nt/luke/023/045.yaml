  yaml_path: translation/nt/luke/023/045.yaml
  text: the sun having been darkened[c][b][a], and the curtain of the temple was torn in the middle.
translation:
  language: tl
  text: Nawalan ng liwanag ang araw,[a] at napunit sa gitna[c] ang tabing ng templo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Nagdilim ang araw.” Isinasalin naman ng ilan na “Nagkaroon ng eklipse,” ngunit mas tiyak iyon kaysa sa hinihingi ng Griyego.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “kurtina ng templo.” Ang tinutukoy ay ang tabing sa santuwaryo ng templo.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “napunit sa kahabaan ng gitna” o “napunit sa dalawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἡλίου ἐκλιπόντος
  choice: Nawalan ng liwanag ang araw
  rationale: Ipinahahayag nito ang pagkawala ng liwanag nang hindi tinutukoy na isang teknikal na eklipse ang nangyari. Natural ito sa makabagong Tagalog at pinananatili ang saklaw ng ἐκλείπω na ‘mawala, pumalya, o magkulang.’
- source_word: ἐσχίσθη
  choice: napunit
  rationale: Ito ang pinakanatural na katumbas ng pasibong pandiwa para sa pagkakapunit ng telang tabing.
- source_word: δὲ
  choice: at
  rationale: Mahinang pang-ugnay ang δέ rito; ang “at” ay natural at hindi nagdaragdag ng matinding pagsalungat.
- source_word: τὸ καταπέτασμα
  choice: ang tabing
  rationale: Ang “tabing” ay malinaw, marangal, at angkop sa telang naghihiwalay sa loob ng templo; hindi nito hinihingi ang mas teknikal o makalumang pananalita.
- source_word: τοῦ ναοῦ
  choice: ng templo
  rationale: Karaniwan at madaling maunawaang salin ito, bagaman ang ναός ay maaaring tumukoy nang mas tiyak sa santuwaryo o gusaling banal sa loob ng mas malawak na kompleks ng templo.
- source_word: μέσον
  choice: sa gitna
  rationale: Tuwirang pinananatili nito ang pahiwatig ng Griyego tungkol sa lugar o paraan ng pagkakapunit, nang hindi awtomatikong ginagawang “dalawa” ang resulta.
theological_decisions:
- issue: Kahulugan ng ἐκλιπόντος kapag tumutukoy sa araw
  choice: Nawalan ng liwanag ang araw
  alternative: Nagdilim ang araw; nagkaroon ng eklipse
  rationale: Inilalarawan ang kosmikong kadiliman nang hindi nagpapasya na isang tiyak na penomenong astronomikal ang tinutukoy. Hindi hinihingi ng pandiwang Griyego ang teknikal na saling “eklipse.”
- issue: Pagkasalin sa καταπέτασμα
  choice: tabing
  alternative: kurtina
  rationale: Ang “tabing” ay likas sa konteksto ng templo at nauunawaan pa rin sa kasalukuyang Filipino. Iniiwasan nitong magpasok ng partikular na doktrinal na pagpapakahulugan sa kahulugan ng pagkakapunit.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nawalan ng liwanag” upang maging natural ngunit hindi teknikal; ginamit ang “tabing” bilang madaling maunawaang terminong angkop sa konteksto ng templo.
