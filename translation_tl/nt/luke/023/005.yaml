  text: οἱ δὲ ἐπίσχυον λέγοντες ὅτι Ἀνασείει τὸν λαὸν διδάσκων καθ’ ὅλης τῆς Ἰουδαίας, ⸀καὶ ἀρξάμενος ἀπὸ τῆς Γαλιλαίας ἕως ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/005.yaml
  text: But they kept insisting[a], saying, “He stirs up the people, teaching throughout all Judea[c][b], beginning from Galilee even to here.”
translation:
  language: tl
  text: Ngunit patuloy silang mariing naggiit[a], na sinasabi, “Inuudyukan niya ang mga tao sa pamamagitan ng pagtuturo sa buong Judea[b], mula sa Galilea hanggang dito[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lalo silang nagpilit” o “lalo silang naging mapilit.” Ipinahihiwatig ng pandiwa ang patuloy at mariing paggigiit.
    reason: lexical_alternative
  - marker: b
    text: Ang “Judea” ay maaaring tumukoy sa mismong rehiyon ng Judea o, sa mas malawak na gamit, sa lupaing Judio na tinutukoy rito. Binibigyang-diin ng parirala ang lawak ng kanyang gawain.
    reason: cultural_note
  - marker: c
    text: Maaari ring “hanggang sa lugar na ito.” Tinutukoy nito ang paglawak ng gawain mula sa Galilea hanggang sa kinaroroonan nila sa harap ni Pilato.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίσχυον
  choice: lalo pa nilang iginiit
  rationale: Ipinahihiwatig ng imperpektong pandiwa ang nagpapatuloy at mariing paggigiit; natural itong ipinapahayag sa Filipino bilang “lalo pa nilang iginiit.”
- source_word: Ἀνασείει
  choice: ginugulo
  rationale: Ipinahahayag nito ang pag-udyok o pagpukaw sa mga tao sa paraang nakagagambala. Pinananatili ng “ginugulo” ang mapanumbat na diwa nang hindi ito ginagawang tiyak na teknikal na paratang ng paghihimagsik.
- source_word: τὸν λαὸν
  choice: ang mga tao
  rationale: Tumutukoy ang λαός sa malawak na populasyon, hindi lamang sa isang nagkakatipong pulutong.
- source_word: διδάσκων
  choice: sa pamamagitan ng pagtuturo
  rationale: Maaaring ipakita ng kasalukuyang participle ang paraan o gawaing kaugnay ng paratang; malinaw at natural ito sa Filipino.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: sa buong Judea
  rationale: Ipinakikita ng parirala ang lawak ng gawain sa nasasakupan; ang “sa buong Judea” ay maikli at likas sa Filipino.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: mula sa Galilea
  rationale: Tinutukoy ng ἀπό ang pinagmulan o panimulang lugar ng gawaing ibinibintang.
- source_word: ἕως ὧδε
  choice: hanggang dito
  rationale: Pinananatili nito ang deiktikong pagtukoy sa kasalukuyang lugar sa harap ni Pilato at ang saklaw mula Galilea patungo roon.
theological_decisions:
- issue: Uri ng paratang laban kay Jesus
  choice: “Ginugulo niya ang mga tao”
  alternative: “Inuudyukan niya ang mga tao”
  rationale: Ang ἀνασείει ay nagpapahiwatig ng mapanggulong pagpukaw, ngunit hindi nito kinakailangang tukuyin ang pormal na krimen ng paghihimagsik. Pinananatili ng salin ang bigat at bahagyang kalabuan ng paratang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong “Galilea” at “Judea,” at iniwasan ang sobrang teknikal na bokabularyong pampolitika.
