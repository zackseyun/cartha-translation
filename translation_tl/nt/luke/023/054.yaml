id: LUK.23.54
reference: Luke 23:54
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἡμέρα ἦν ⸂παρασκευῆς, καὶ⸃ σάββατον ἐπέφωσκεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/054.yaml
  text: And it was the day of Preparation[a], and the Sabbath was dawning.
translation:
  language: tl
  text: Araw noon ng Paghahanda, at nagsisimula na ang Sabbath.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “sumisikat na ang Sabbath.” Ang pandiwang Griyego ay maaaring mangahulugang “sumisikat” o “nagsisimula”; dito, tumutukoy ito sa pagpasok ng Sabbath sa gabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρασκευῆς
  choice: Paghahanda
  rationale: Sa gamit na Judio-Griyego, tumutukoy ito sa kinikilalang araw ng paghahanda bago ang Sabbath. Pinanatili ang kahulugang leksikal sa halip na palitan agad ng “Biyernes.”
- source_word: σάββατον
  choice: ang Sabbath
  rationale: Bagaman walang artikulo sa Griyego, tiyak sa konteksto na ang lingguhang Sabbath ang tinutukoy; likas sa Filipino ang paggamit ng “ang.”
- source_word: ἐπέφωσκεν
  choice: nagsisimula na
  rationale: Maaari itong literal na mangahulugang “sumisikat” o tumukoy sa pagsisimula. Dito, papasok ang Sabbath sa gabi, kaya malinaw at hindi nakalilinlang ang “nagsisimula na,” habang inilalahad sa talababa ang mas literal na larawan.
- source_word: ἡμέρα ἦν παρασκευῆς
  choice: Araw noon ng Paghahanda
  rationale: Natural at marangal na Filipino ito na pinananatili ang diwa ng genitibong parirala at ang katawagan sa araw bago ang Sabbath.
- source_word: καὶ
  choice: at
  rationale: Pinanatili ang koordinasyong pasalaysay ng dalawang sugnay nang hindi dinaragdagan ang ugnayang hindi hayag sa Griyego.
theological_decisions:
- issue: Kahulugan ng ἐπέφωσκεν kaugnay ng pagpasok ng Sabbath
  choice: Tumutukoy ito sa pagsisimula ng Sabbath sa gabi.
  alternative: “sumisikat na ang Sabbath” o “nagbubukang-liwayway na ang Sabbath”
  rationale: Sa konteksto ng paglilibing bago ang Sabbath at ng pagbilang ng araw mula gabi hanggang gabi, hindi umaga ang tinutukoy. Iniiwasan ng pangunahing salin ang maling impresyon ngunit pinananatili sa talababa ang literal na talinghaga at leksikal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Paghahanda” bilang katawagan sa araw at pinanatili ang “Sabbath” bilang kilalang terminong biblikal. Inilagay ang talababa pagkatapos ng sugnay na tinutukoy nito.
