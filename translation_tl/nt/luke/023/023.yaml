  text: οἱ δὲ ἐπέκειντο φωναῖς μεγάλαις αἰτούμενοι αὐτὸν σταυρωθῆναι, καὶ κατίσχυον αἱ φωναὶ ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/023.yaml
  text: But they kept pressing with loud voices[a], asking that he be crucified, and their voices prevailed.
translation:
  language: tl
  text: Ngunit patuloy silang naggiit sa malalakas na tinig, na hinihiling nilang ipako siya sa krus, at nanaig ang kanilang mga tinig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at nanaig ang kanilang mga sigaw.” Inuulit sa Griyego ang salitang maaaring isaling “mga tinig” o “mga sigaw” sa dalawang bahagi ng talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέκειντο
  choice: patuloy silang nagpumilit
  rationale: Ipinahahayag ng imperpektong anyo ang tuloy-tuloy at mapilit na paggigiit, hindi isang minsanang kahilingan.
- source_word: φωναῖς μεγάλαις
  choice: nang malakas
  rationale: Likas itong paraan sa Filipino upang ipahayag na malalakas ang kanilang mga tinig o sigaw, nang hindi labis na tinutukoy ang uri ng pagsigaw.
- source_word: αἰτούμενοι
  choice: na hinihiling
  rationale: Pinananatili nito ang pangunahing diwa ng ‘humihiling,’ habang ang puwersa ng kanilang paggigiit ay naipahahayag na ng ‘patuloy silang nagpumilit.’
- source_word: αὐτὸν σταυρωθῆναι
  choice: na ipako siya sa krus
  rationale: Malinaw at likas na Filipino ito para sa nilalaman ng kahilingan at pinananatili ang pasibong diwa ng infinitive.
- source_word: κατίσχυον
  choice: nanaig
  rationale: Ipinahahayag nito na ang kanilang paggigiit ang nagtagumpay o nagkaroon ng higit na puwersa sa pagdinig.
- source_word: αἱ φωναὶ αὐτῶν
  choice: ang kanilang mga tinig
  rationale: Pinananatili ang literal na sangkap ng φωνή at ang pagbibigay-diin ng Griyego sa mismong mga tinig nila bilang nanaig.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘ipako sa krus,’ ang karaniwang natural na katumbas ng crucifixion, at pinanatili sa hulí ang ‘mga tinig’ upang maipakita ang pag-uulit at diin ng Griyego.
