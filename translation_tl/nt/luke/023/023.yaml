revisions:
- from: Ngunit patuloy silang nagpumilit nang malakas[a], na hinihiling na ipako siya sa krus; at nanaig ang kanilang mga tinig.
  to: Ngunit patuloy silang naggiit sa malalakas na tinig, na hinihiling nilang ipako siya sa krus, at nanaig ang kanilang mga tinig.[a]
  rationale: Pinalitan ang malabong pang-abay na “nang malakas” ng “sa malalakas na tinig” upang malinaw na maisalin ang φωναῖς μεγάλαις at mapanatili ang pag-uulit ng “tinig” na nasa Griyego. Inayos din ang pagkakabuo ng sugnay na may participle sa “na hinihiling nilang.” Inilagay ang talababa sa huling “mga tinig,” kung saan direktang nakatali ang alternatibong “mga sigaw” at ang paliwanag tungkol sa pag-uulit.
