id: LUK.23.28
reference: Luke 23:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: στραφεὶς δὲ πρὸς αὐτὰς ⸀ὁ Ἰησοῦς εἶπεν· Θυγατέρες Ἰερουσαλήμ, μὴ κλαίετε ἐπ’ ἐμέ· πλὴν ἐφ’ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/028.yaml
  text: But turning toward them[a], Jesus said, “Daughters of Jerusalem, do not weep for me; instead, weep for yourselves and for your children,”
translation:
  language: tl
  text: Ngunit humarap sa kanila si Jesus at sinabi, “Mga anak na babae ng Jerusalem,[a] huwag ninyo akong iyakan. Sa halip, iyakan ninyo ang inyong mga sarili at ang inyong mga anak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mga babae ng Jerusalem.” Literal na “Mga anak na babae ng Jerusalem” sa Griyego, isang paraan ng pagtawag na ginagamit sa pananalitang makahula at pinanatili sa pangunahing teksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς δὲ πρὸς αὐτὰς
  choice: Ngunit humarap sa kanila
  rationale: Ipinahahayag ng aorist participle ang pisikal na pagharap ni Jesus sa mga babae, habang ang δέ ay banayad na paglipat o pagsalungat sa naunang pagluluksa.
- source_word: Θυγατέρες Ἰερουσαλήμ
  choice: Mga anak na babae ng Jerusalem
  rationale: Pinananatili ang literal at makahulang paraan ng pagtawag, pati ang kaugnayan nito sa pananalita ng Kasulatan; nililinaw sa talababa ang likas na alternatibong Filipino.
- source_word: μὴ κλαίετε ἐπ’ ἐμέ
  choice: huwag ninyo akong iyakan
  rationale: Natural sa Filipino ang pandiwang may layong “akong,” at hindi nito ipinipilit kung ang utos ay tumigil sa kasalukuyang pag-iyak o huwag lamang umiyak.
- source_word: πλὴν
  choice: Sa halip
  rationale: 'Malinaw na ipinakikita ang pagtutuwid na pagsalungat: hindi si Jesus ang iyakan kundi sila at ang kanilang mga anak.'
- source_word: ἐφ’ ἑαυτὰς κλαίετε
  choice: iyakan ninyo ang inyong sarili
  rationale: Pinananatili ang reflexive na diwa at ang pagkakapantay ng ayos sa “akong iyakan.”
- source_word: τὰ τέκνα ὑμῶν
  choice: ang inyong mga anak
  rationale: Payak at likas na katumbas ng τέκνα sa kontekstong pampamilya.
theological_decisions:
- issue: Pagpapakahulugan sa tawag na Θυγατέρες Ἰερουσαλήμ
  choice: Mga anak na babae ng Jerusalem
  alternative: Mga babae ng Jerusalem
  rationale: Pinananatili ng pangunahing salin ang biblikal at makahulang himig ng literal na parirala nang hindi nagdaragdag ng doktrinal na paliwanag; ibinibigay sa talababa ang mas likas ngunit mas patag na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “humarap” sa halip na mas mekanikal na “bumaling” upang natural na ipahayag ang pisikal na pagharap; pinanatili naman ang literal na “Mga anak na babae ng Jerusalem” dahil mahalaga ang biblikal na himig nito.
