base_translation:
  language: en
  yaml_path: translation/nt/luke/023/049.yaml
  text: But all those who knew him[a], and the women who had followed him from Galilee, were standing at a distance, watching these things.
translation:
  language: tl
  text: Ngunit ang lahat ng nakakakilala sa kanya[a], kasama ang mga babaeng sumunod sa kanya mula sa Galilea, ay nakatayo sa may kalayuan at pinagmamasdan ang mga pangyayaring ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lahat ng kanyang mga kakilala.” Ang salitang Griyego na γνωστοί ay maaaring tumukoy sa mga taong kilala ng isang tao—mga kakilala o kasamahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: ay nakatayo
  rationale: Ipinahihiwatig ng anyo ng pandiwa ang nagpapatuloy na kalagayan sa tagpo, hindi lamang ang minsanang pagtayo.
- source_word: δὲ
  choice: Ngunit
  rationale: Minamarkahan nito ang banayad na pagsalungat o paglipat mula sa naunang tagpo tungo sa mga nagmamasid.
- source_word: πάντες οἱ γνωστοὶ αὐτῷ
  choice: ang lahat ng nakakakilala sa kanya
  rationale: Pinananatili nito ang malawak na kahulugan ng γνωστοί bilang mga taong kilala siya, nang hindi ipinapalagay na pawang matatalik na kaibigan sila.
- source_word: μακρόθεν
  choice: sa malayo
  rationale: Likas at malinaw na pahayag sa modernong Tagalog para sa pagtanaw mula sa may kalayuan.
- source_word: γυναῖκες αἱ συνακολουθοῦσαι αὐτῷ ἀπὸ τῆς Γαλιλαίας
  choice: ang mga babaeng sumunod sa kanya mula sa Galilea
  rationale: Tinutukoy ang tiyak na pangkat ng mga babaeng nakasama ni Jesus mula pa sa Galilea; natural sa Tagalog ang payak na nakaraang anyong “sumunod” sa kontekstong ito.
- source_word: ὁρῶσαι ταῦτα
  choice: pinagmamasdan ang mga pangyayaring ito
  rationale: Ipinapakita ang nagpapatuloy at sadyang pagmamasid, habang inilalahad nang natural ang plural na ταῦτα bilang mga pangyayaring nasaksihan nila.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “nakakakilala sa kanya” upang mapanatili ang lawak at bahagyang kalabuan ng γνωστοί; inilagay sa talababa ang mas maikling alternatibong “mga kakilala niya.”
