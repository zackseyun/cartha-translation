id: LUK.23.46
reference: Luke 23:46
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ φωνήσας φωνῇ μεγάλῃ ὁ Ἰησοῦς εἶπεν· Πάτερ, εἰς χεῖράς σου ⸀παρατίθεμαι τὸ πνεῦμά μου. ⸂τοῦτο δὲ⸃ εἰπὼν ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/046.yaml
  text: And Jesus[a], crying out with a loud voice, said, “Father, into your hands I commit my spirit.” Having said this[c][b], he breathed his last.
translation:
  language: tl
  text: Sumigaw si Jesus nang malakas at sinabi, “Ama, sa iyong mga kamay ay ipinagkakatiwala ko ang aking espiritu.”[a][b] Matapos niyang sabihin ito, nalagutan siya ng hininga.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inilalagak ko.” Ang pandiwa ay maaaring mangahulugang ilagay ang isang bagay sa pangangalaga ng iba.
    reason: lexical_alternative
  - marker: b
    text: 'Umaalingawngaw ang pananalitang ito sa Awit 31:5; sa Septuagint, ito ay Awit 30:6: “Sa iyong mga kamay ay ipinagkakatiwala ko ang aking espiritu.”'
    reason: cross_reference
  - marker: c
    text: Maaari ring “pumanaw siya” o payak na “namatay siya”; literal na may kaugnayan ang pandiwa sa pagbuga ng hininga.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας φωνῇ μεγάλῃ
  choice: Sumigaw nang malakas
  rationale: Likas at malinaw na Filipino para sa malakas at mariing pagtawag; pinananatili ang diin sa lakas ng tinig.
- source_word: Πάτερ
  choice: Ama
  rationale: Tuwirang panawagan ito na walang nakasaad na panghalip na paari, kaya hindi idinagdag ang “ko.”
- source_word: εἰς χεῖράς σου
  choice: sa iyong mga kamay
  rationale: Pinananatili ang maramihang “mga kamay” at ang idyomang umaalingawngaw sa Awit 31:5 sa Griyegong Kasulatan.
- source_word: παρατίθεμαι
  choice: ipinagkakatiwala ko
  rationale: Ipinahahayag ng pandiwang nasa middle voice ang kusang paglalagak sa pangangalaga ng iba; natural at tumpak dito ang “ipinagkakatiwala ko.”
- source_word: τὸ πνεῦμά μου
  choice: ang aking espiritu
  rationale: Bagaman maaaring tumukoy ang πνεῦμα sa hininga, espiritu, o buhay, ang panalanging nakatuon sa Ama ay higit na angkop sa “aking espiritu” at hindi nito inaalis ang teolohikal na lalim ng pahayag.
- source_word: τοῦτο δὲ εἰπών
  choice: Pagkasabi nito
  rationale: Maikli at natural na paraan upang ipakitang nauna ang pagsasalita sa sumunod na pangyayari.
- source_word: ἐξέπνευσεν
  choice: nalagutan siya ng hininga
  rationale: Karaniwang Filipino para sa pagkamatay na pinananatili ang larawan ng paghinga na nasa pandiwang Griyego.
theological_decisions:
- issue: Kahulugan ng πνεῦμά μου sa huling pananalita ni Jesus
  choice: aking espiritu
  alternative: aking hininga
  rationale: Ang sadyang pakikipag-usap ni Jesus sa Ama at ang pagkakatiwala niya ng sarili ay pumapabor sa “espiritu,” ngunit hindi nagdaragdag ng doktrinang wala sa talata.
- issue: Lakas ng παρατίθεμαι bilang kusang pagkakatiwala
  choice: ipinagkakatiwala ko
  alternative: inilalagak ko
  rationale: Ang “ipinagkakatiwala” ay malinaw na nagpapahiwatig ng kusang paglalagay sa pangangalaga ng Ama at natural bilang isang taimtim na pahayag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “siya” sa halip na “kaniya” sa pangunahing teksto para sa mas natural na daloy, at iniwasan ang labis na makaluma o denominasyonal na pananalita.
