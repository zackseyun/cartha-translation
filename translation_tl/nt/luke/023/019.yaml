base_translation:
  language: en
  yaml_path: translation/nt/luke/023/019.yaml
  text: who had been thrown into prison for a certain uprising that had taken place in the city[a], and for murder.
translation:
  language: tl
  text: na ibinilanggo dahil sa isang pag-aalsang naganap sa lungsod[a] at dahil sa pagpaslang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “paghihimagsik.” Ang salitang Griyego na στάσις ay maaaring tumukoy sa pag-aalsa, paghihimagsik, o marahas na kaguluhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: na
  rationale: Tumutukoy ito kay Barabas sa naunang talata. Ang pang-ugnay na “na” ang likas na paraan sa Filipino upang ipagpatuloy ang paglalarawan sa kanya.
- source_word: διὰ
  choice: dahil sa
  rationale: Kasama ng akusatibo, nagsasaad ito ng sanhi o dahilan. Malinaw at natural sa modernong Filipino ang “dahil sa.”
- source_word: στάσιν τινὰ
  choice: isang pag-aalsa
  rationale: Ang στάσις ay maaaring tumukoy sa marahas na pag-aalsa o paghihimagsik. Ang “pag-aalsa” ay madaling maunawaan at hindi labis na teknikal; ipinahihiwatig ng “isang” ang di-tiyak na τινά.
- source_word: γενομένην ἐν τῇ πόλει
  choice: na naganap sa lungsod
  rationale: Ginagawang likas na sugnay sa Filipino ang participle at pinananatili ang “lungsod” nang hindi tahasang tinutukoy ang Jerusalem, gaya ng Griyego.
- source_word: φόνον
  choice: pagpaslang
  rationale: Ang φόνος ay tumutukoy sa kriminal na pagpatay, hindi lamang sa anumang pagkamatay. Naipahahayag ng “pagpaslang” ang bigat at sadyang katangian nito.
- source_word: βληθεὶς ἐν τῇ φυλακῇ
  choice: ibinilanggo
  rationale: Ito ang natural at maikling katumbas sa Filipino ng paglalagay sa bilangguan. Iniiwasan ang literal ngunit di-likas na “itinapon sa bilangguan.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Pinanatili ang anyong pang-ugnay ng talata dahil nagpapatuloy ito sa pagtukoy kay Barabas mula sa naunang talata; iniwasan ang pagdaragdag ng pangalan o ng tahasang “Jerusalem” na wala sa Griyego.
