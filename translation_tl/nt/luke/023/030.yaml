  yaml_path: translation/nt/luke/023/030.yaml
  text: Then they will begin to say to the mountains[a], ‘Fall on us,’ and to the hills[b], ‘Cover us.’
translation:
  language: tl
  text: Saka sila magsisimulang magsabi sa mga bundok[a], “Bumagsak kayo sa amin,” at sa mga burol, “Takpan[b] ninyo kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pananalitang ito ay alingawngaw ng makahulang wika ng paghatol, lalo na sa Oseas 10:8.
    reason: cross_reference
  - marker: b
    text: O “Itago ninyo kami.” Literal na nangangahulugang “takpan” ang pandiwa, ngunit sa kontekstong ito ay nagpapahiwatig din ito ng pagkubli mula sa darating na paghatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Ipinapakita nito ang kasunod na pangyayari mula sa naunang konteksto at likas itong pakinggan sa makabagong Tagalog.
- source_word: ἄρξονται λέγειν
  choice: magsisimula silang magsabi
  rationale: Pinananatili nito ang ingressive na diwa ng ἄρξονται at ang tuwirang kahulugan ng λέγειν.
- source_word: τοῖς ὄρεσιν
  choice: sa mga bundok
  rationale: Ang ὄρος ay maaaring tumukoy sa bundok o burol, ngunit pinili ang “mga bundok” upang mapanatili ang kaibhan nito sa βουνοῖς.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: Bumagsak kayo sa amin
  rationale: Tuwirang ipinapahayag ang maramihang pautos at ang paggalaw pabagsak sa mga nagsasalita.
- source_word: τοῖς βουνοῖς
  choice: sa mga burol
  rationale: Karaniwang tumutukoy ang βουνός sa burol; pinananatili ng saling ito ang kaibhan sa ὄρεσιν.
- source_word: Καλύψατε ἡμᾶς
  choice: Takpan ninyo kami
  rationale: Ang καλύπτω ay literal na “takpan,” bagaman sa konteksto ay maaari rin itong mangahulugang ikubli o itago.
theological_decisions:
- issue: Makahulang larawan ng paghatol
  choice: Panatilihin ang literal na panawagan sa mga bundok at mga burol.
  alternative: Ipaliwanag sa pangunahing teksto na nais nilang magtago mula sa darating na paghatol.
  rationale: Umaalingawngaw rito ang wika ng makahulang paghatol, lalo na sa Oseas 10:8. Pinananatili ng literal na larawan ang tindi at teolohikal na tensiyon ng pahayag nang hindi ito pinalalawak sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “magsabi” sa halip na mas pormal na “mangusap,” at pinanatili ang kongkretong larawang “Bumagsak” at “Takpan.”
