id: LUK.23.3
reference: Luke 23:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸀ἠρώτησεν αὐτὸν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς αὐτῷ ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/003.yaml
  text: Then Pilate asked him[a], saying, “Are you the king of the Jews?” And answering him, he said[b], “You say so.”
translation:
  language: tl
  text: Tinanong siya ni Pilato, “Ikaw ba ang hari ng mga Judio[a]?” Sumagot si Jesus sa kaniya, “Ikaw ang nagsasabi.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taga-Judea.” Maaaring tumukoy ang salitang Griyego sa mga Judio o sa mga taga-Judea, depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “Ikaw ang nagsabi nito,” o “Oo, gaya ng sinabi mo.” Maikli ang sagot sa Griyego at maaaring unawain bilang isang may-pasubaling pagsang-ayon.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Hindi isinalin nang hiwalay
  rationale: Banayad na pang-ugnay lamang ito sa salaysay. Malinaw na umuusad ang pangyayari sa natural na ayos ng pangungusap sa Filipino kahit walang tahasang “at” o “pagkatapos.”
- source_word: ἠρώτησεν αὐτόν
  choice: Tinanong siya
  rationale: Direkta at natural na katumbas ng pandiwa at layon, habang malinaw na si Pilato ang nagtatanong.
- source_word: λέγων
  choice: Hindi inulit bilang “na sinasabi”
  rationale: Ang participle na ito ay karaniwang panandang nagpapakilala ng tuwirang sinabi. Kalabisan at di-natural sa modernong Filipino ang literal na pag-uulit nito.
- source_word: Σὺ εἶ
  choice: Ikaw ba ang
  rationale: Ipinahahayag ng “ba” ang malinaw na anyong patanong, at pinananatili ng “ikaw” ang diin ng tahasang panghalip sa Griyego.
- source_word: βασιλεὺς
  choice: hari
  rationale: Tumpak nitong pinananatili ang maharlikang titulo at ang pampolitikang bigat ng paratang.
- source_word: τῶν Ἰουδαίων
  choice: ng mga Judio
  rationale: Ito ang nakagawiang at angkop sa kontekstong salin ng titulong “hari ng mga Judio.” Maaaring tumukoy rin ang terminong Griyego sa mga taga-Judea, kaya inilagay ang alternatibo sa talababa.
- source_word: ἀποκριθεὶς αὐτῷ ἔφη
  choice: Sumagot siya
  rationale: Likas na pinagsasama sa Filipino ang participle at pandiwa ng pagsasalita. Ipinahihiwatig na ng “sumagot” na tugon ito kay Pilato, kaya hindi na kailangang ulitin ang di-tuwirang layon.
- source_word: Σὺ λέγεις
  choice: Ikaw ang nagsasabi
  rationale: 'Pinananatili nito ang maigsi at di-tuwirang sagot: hindi itinatanggi ni Jesus ang titulo, ngunit iniuugnay niya ang pagkakasabi nito kay Pilato. Hindi ito ginawang tahasang “Oo” upang hindi alisin ang tunay na retorikal na tensiyon.'
theological_decisions:
- issue: Lakas at diwa ng sagot na Σὺ λέγεις
  choice: Ikaw ang nagsasabi.
  alternative: Oo, gaya ng sinabi mo.
  rationale: Maaaring magsilbing may-pasubaling pagsang-ayon ang maikling parirala, ngunit hindi ito kapantay ng payak at tahasang “oo.” Pinananatili ng pangunahing salin ang pagiging maikli at bahagyang di-tuwiran ng Griyego, samantalang ipinapaliwanag ng talababa ang posibleng puwersa nito.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “Judio” bilang pamilyar na terminong biblikal at pinanatiling maikli ang palitan. Iniwasan ang literal ngunit mabigat na “nagtanong sa kaniya, na sinasabi” at ang labis na pagpapalinaw sa sagot ni Jesus.
