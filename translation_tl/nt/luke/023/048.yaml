  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ συμπαραγενόμενοι ὄχλοι ἐπὶ τὴν θεωρίαν ταύτην, ⸀θεωρήσαντες τὰ γενόμενα, ⸀τύπτοντες τὰ στήθη ὑπέστρεφον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/048.yaml
  text: And all the crowds that had gathered for this spectacle[a], after seeing what had happened, were returning[b], beating their chests.
translation:
  language: tl
  text: At ang lahat ng mga taong nagkatipon upang panoorin ang tanawing ito[a], nang makita nila ang mga nangyari, ay bumabalik habang hinahampas ang kanilang mga dibdib.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa tanawing ito.”
    reason: lexical_alternative
  - marker: b
    text: Ang paghampas sa dibdib ay kilos na maaaring magpahayag ng dalamhati, pagluluksa, o pagkabigla.
    reason: cultural_note
lexical_decisions:
- source_word: συμπαραγενόμενοι
  choice: nagkatipon
  rationale: Likas sa modernong Filipino at malinaw na ipinahihiwatig na sama-samang dumating ang mga tao sa pinangyarihan.
- source_word: ὄχλοι
  choice: lahat ng mga tao
  rationale: Bagaman maramihan ang ὄχλοι, mas natural sa Filipino ang pariralang ito kaysa “mga pulutong” sa ganitong salaysay; hindi nito binubura ang dami ng mga naroon.
- source_word: ἐπὶ τὴν θεωρίαν ταύτην
  choice: para panoorin ang tanawing ito
  rationale: Pinagsasama nito ang diwa ng pagpunta upang manood at ng pampublikong tanawin; inilalagay sa talababa ang alternatibong mas nakatuon sa ‘panoorin ang pangyayaring ito.’
- source_word: θεωρήσαντες
  choice: nang makita nila
  rationale: Natural na ipinahahayag ang kilos na nauna sa kanilang pag-uwi, nang hindi dinaragdagan ang kahulugan.
- source_word: τὰ γενόμενα
  choice: ang mga nangyari
  rationale: Direkta, malinaw, at idiomatikong katumbas ng substantival participle na tumutukoy sa naganap na mga pangyayari.
- source_word: τύπτοντες τὰ στήθη
  choice: dinadagukan ang kanilang mga dibdib
  rationale: Inilalarawan ang paulit-ulit na malakas na paghampas sa dibdib bilang kilos ng matinding damdamin, nang hindi tahasang tinutukoy kung iyon ay pagsisisi, dalamhati, o pagkabigla.
- source_word: ὑπέστρεφον
  choice: nagsiuwi habang
  rationale: Ang “nagsiuwi” ay nagpapakita ng pagbalik ng maraming tao, at ang “habang” ay nagpapanatili sa nagpapatuloy na kilos na kasabay ng pag-uwi.
theological_decisions:
- issue: Emosyonal at espirituwal na kahulugan ng kilos ng mga tao
  choice: Iniwan bilang pisikal na kilos—“dinadagukan ang kanilang mga dibdib”—na may talababa tungkol sa maaaring ipinahahayag nitong dalamhati, pagluluksa, o pagkabigla.
  alternative: Tahasan itong tawaging pagsisisi o pagkadama ng pagkakasala.
  rationale: Inilalarawan ng Griyego ang kilos ngunit hindi tahasang ipinapaliwanag ang panloob o espirituwal na kalagayan ng mga tao; kaya hindi dapat ipasok sa salin ang isang tiyak na teolohikal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagsiuwi” upang natural na ipakita ang maramihang pagbalik, at iniwasan ang mas lumang “nagsisipanumbalik.” Ang mga panandang [a] at [b] ay parehong nasa pangunahing teksto.
