revisions:
- from: At ang lahat ng mga taong nagkatipon para panoorin ang tanawing ito[a], nang makita nila ang mga nangyari, ay nagsiuwi habang dinadagukan ang kanilang mga dibdib.[b]
  to: At ang lahat ng mga taong nagkatipon upang panoorin ang tanawing ito[a], nang makita nila ang mga nangyari, ay bumabalik habang hinahampas ang kanilang mga dibdib.[b]
  rationale: Pinalitan ang “nagsiuwi” ng “bumabalik” upang hindi tukuyin ang destinasyong wala sa Griyego at upang mapanatili ang nagpapatuloy na aspekto ng ὑπέστρεφον. Pinalitan ang “dinadagukan” ng “hinahampas” upang tumpak na ilarawan ang τύπτοντες τὰ στήθη nang walang labis na pahiwatig ng pananakit o pagsuntok. Inayos ang talababa a upang magbigay ng tunay na leksikal na alternatibo para sa θεωρία.
