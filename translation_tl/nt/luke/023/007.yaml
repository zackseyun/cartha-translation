  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐπιγνοὺς ὅτι ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην, ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις ἐν ταύταις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/007.yaml
  text: And when he learned that he was under Herod’s jurisdiction[a], he sent him to Herod, who himself was also in Jerusalem in those days.
translation:
  language: tl
  text: Nang malaman ni Pilato na si Jesus ay sakop ng pamamahala ni Herodes[a], ipinadala niya si Jesus kay Herodes, na siya rin ay nasa Jerusalem noong mga araw na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nasa hurisdiksiyon ni Herodes.” Ang pananalitang Griyego ay tumutukoy sa nasasakupang lupain o legal na awtoridad ni Herodes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: Nang malaman ni Pilato
  rationale: Ipinahahayag ng aorist participle ang kilos na nauna sa pangunahing pandiwa. Likas sa Tagalog ang temporal na “Nang malaman”; nilinaw ang simuno bilang si Pilato mula sa konteksto upang maiwasan ang malabong panghalip.
- source_word: ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν
  choice: si Jesus ay sakop ng kapangyarihan ni Herodes
  rationale: Ang parirala ay tumutukoy sa nasasakupang pampamahalaan o legal na awtoridad ni Herodes. Ang “sakop ng kapangyarihan” ay malinaw sa karaniwang mambabasa at pinananatili ang saklaw ng kahulugang maaaring administratibo o legal.
- source_word: ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην
  choice: ipinadala niya si Jesus kay Herodes
  rationale: Sapat na ipinahahayag ng “ipinadala ... kay” ang pagdadala o pagsasangguni ng isang tao sa ibang pinuno. Ginamit ang “si Jesus” sa halip na sunod-sunod na panghalip para sa likas at malinaw na Tagalog.
- source_word: ὄντα καὶ αὐτὸν
  choice: na naroon din
  rationale: Ang “din” ay nagpapanatili sa diin ng καὶ αὐτόν na si Herodes man ay nasa Jerusalem. Hindi na kailangang isalin nang hiwalay ang emphatic pronoun dahil likas na naihahatid ito ng “din.”
- source_word: ἐν Ἱεροσολύμοις
  choice: sa Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lugar at likas na gamit ng pang-ukol sa Tagalog.
- source_word: ἐν ταύταις ταῖς ἡμέραις
  choice: nang mga araw na iyon
  rationale: Likas na salaysay sa Tagalog para sa deiktikong pariralang literal na “sa mga araw na ito,” habang pinananatili ang panahong tinutukoy.
theological_decisions:
- issue: Pampolitika at legal na diwa ng ἐξουσία kaugnay ni Herodes
  choice: sakop ng kapangyarihan ni Herodes
  alternative: nasa hurisdiksiyon ni Herodes
  rationale: Tinutukoy rito ang nasasakupang pampamahalaan o legal na kapangyarihan ni Herodes Antipas, hindi ang isang teolohikal na diwa ng kapangyarihan. Mas madaling maunawaan ng pangkalahatang mambabasa ang pangunahing salin, samantalang inilalahad sa talababa ang mas teknikal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inulit ang mga pangalang Pilato at Jesus na ipinahihiwatig lamang ng mga panghalip sa Griyego upang maiwasan ang kalituhan sa Tagalog; walang idinagdag na interpretasyong denominasyonal.
