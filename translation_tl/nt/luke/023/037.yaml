  text: καὶ λέγοντες· Εἰ σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων, σῶσον σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/037.yaml
  text: and saying[a], “If you are the King of the Jews, save yourself.”
translation:
  language: tl
  text: at sinabi nila, “Kung ikaw ang Hari ng mga Judio,[a] iligtas mo ang sarili mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “mga taga-Judea.” Maaaring tumukoy ang salitang Griego na Ἰουδαίων sa mga Judio o sa mga taga-Judea, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγοντες
  choice: at sinasabi nila
  rationale: Pinananatili ng “at” ang ugnayan sa naunang kilos, at natural na ipinapahayag sa Tagalog ng “nila” ang maramihang gumagawa ng kilos na nakapaloob sa participle na λέγοντες.
- source_word: Εἰ σὺ εἶ
  choice: Kung ikaw
  rationale: Ipinananatili ng “Kung” ang mapanuyang hamon at hindi ipinapalagay na tinatanggap ng nagsasalita ang pahayag. Naipakikita ng tahasang “ikaw” ang diin ng σὺ.
- source_word: ὁ βασιλεὺς
  choice: ang Hari
  rationale: Ang tiyak na artikulo at ang konteksto ay tumutukoy sa isang partikular na maharlikang titulo. Ang malaking titik ay angkop sa titulong ibinabato kay Jesus sa salaysay.
- source_word: τῶν Ἰουδαίων
  choice: ng mga Judio
  rationale: Ito ang karaniwan at kontekstuwal na angkop na tawag sa pariralang politikal at mesiyanikong ginagamit sa salaysay ng pagpapakasakit; pinananatili sa talababa ang posibleng heograpikong kahulugang “mga taga-Judea.”
- source_word: σῶσον σεαυτόν
  choice: iligtas mo ang iyong sarili
  rationale: Tuwirang inilalarawan ang pautos na σῶσον at ang reflexive na σεαυτόν, habang pinananatili ang ugnayang leksikal ng σῴζω sa konsepto ng pagliligtas sa Lucas.
theological_decisions:
- issue: Ang mapanuyang titulong βασιλεὺς τῶν Ἰουδαίων
  choice: Hari ng mga Judio
  alternative: hari ng mga taga-Judea
  rationale: Pinananatili ng pangunahing salin ang kinikilalang titulong kaugnay ng paratang laban kay Jesus at ang kabalintunaan ng kaniyang paghahari. Inilalagay sa talababa ang lehitimong panrehiyong kahulugan nang hindi nilulutas nang labis ang saklaw ng Ἰουδαίων.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sinasabi nila” sa halip na mas mabigat o mas interpretatibong “nanunuya sila” upang ipaubaya sa konteksto ang mapanuyang tono.
