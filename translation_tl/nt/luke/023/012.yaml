  text: ἐγένοντο δὲ φίλοι ὅ τε ⸂Ἡρῴδης καὶ ὁ Πιλᾶτος⸃ ἐν αὐτῇ τῇ ἡμέρᾳ μετ’ ἀλλήλων· προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς ⸀αὑτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/012.yaml
  text: And Herod and Pilate became friends with each other on that very day[b][a], for previously they had been in hostility toward one another.
translation:
  language: tl
  text: Noong araw ring iyon, naging magkaibigan sina Herodes at Pilato[a], sapagkat dati ay magkaaway sila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naging palakaibigan sa isa’t isa.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “dati silang nasa alitan sa isa’t isa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένοντο
  choice: naging
  rationale: Ipinahihiwatig ng aorist ng γίνομαι ang pagbabago ng kalagayan ng kanilang ugnayan; natural itong ipinapahayag ng “naging.”
- source_word: φίλοι
  choice: magkaibigan
  rationale: Ang pangngalang panaguri ay tuwirang tumutukoy sa bagong ugnayan nila; “magkaibigan” ang malinaw at likas na katumbas sa Tagalog.
- source_word: ὅ τε Ἡρῴδης καὶ ὁ Πιλᾶτος
  choice: sina Herodes at Pilato
  rationale: Likas na ipinakikita ng “sina … at …” na kapuwa kasama ang dalawang taong tinutukoy.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: Nang araw ring iyon
  rationale: 'Pinananatili ng “ring” ang diin ng αὐτῇ: sa mismong araw na iyon naganap ang pagbabago.'
- source_word: μετ’ ἀλλήλων
  choice: magkaibigan sina Herodes at Pilato
  rationale: Ang kapwa ugnayan ay likas nang nakapaloob sa salitang “magkaibigan,” kaya hindi kailangang ulitin bilang “sa isa’t isa.”
- source_word: προϋπῆρχον
  choice: dati ay
  rationale: Ipinakikita nito ang nauna at nagpapatuloy na kalagayan bago ang pangyayari sa araw na iyon.
- source_word: ἐν ἔχθρᾳ ὄντες πρὸς αὑτούς
  choice: magkaaway sila
  rationale: Natural at malinaw na Tagalog ito para sa kanilang dating kapwa alitan, habang pinananatili ang nominal na diwa ng ἔχθρα.
theological_decisions:
- issue: Likas ng pagbabago sa ugnayan nina Herodes at Pilato
  choice: Sinasabi ng talata na naging magkaibigan sila nang araw na iyon.
  alternative: Maaaring unawain nang mas mahina bilang “naging palakaibigan sa isa’t isa” o bilang isang pampolitikang pakikipagkasundo.
  rationale: Hindi tinutukoy ng Griyego ang lalim, motibo, o teolohikal na kahulugan ng kanilang bagong ugnayan. Pinananatili ng pangunahing salin ang tuwirang diwa ng φίλοι, habang inilalagay sa talababa ang mas mahinang posibleng pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “magkaibigan” at “magkaaway” bilang mga likas na salitang panumbasan sa kapwa ugnayan; pinanatili sa mga talababa ang alternatibong antas ng kahulugan at ang mas literal na nominal na anyo.
