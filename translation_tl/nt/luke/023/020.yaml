  text: πάλιν ⸀δὲ ὁ Πιλᾶτος ⸀προσεφώνησεν, θέλων ἀπολῦσαι τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/020.yaml
  text: But Pilate called out again[a], wanting to release Jesus.
translation:
  language: tl
  text: Ngunit muling kinausap ni Pilato ang mga tao[a], na nais niyang palayain si Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “muling tumawag sa mga tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: muling
  rationale: Ipinahahayag ng pang-abay ang pag-uulit; ang “muling” ay maikli, natural, at marangal sa modernong Filipino.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapakita ito ng banayad na pagsalungat sa naunang tugon ng karamihan; ang “Ngunit” ay angkop sa daloy ng salaysay.
- source_word: Πιλᾶτος
  choice: Pilato
  rationale: Karaniwang anyo ng pangalang ito sa Tagalog na salin ng Biblia.
- source_word: προσεφώνησεν
  choice: nagsalita ... sa kanila
  rationale: Ang προσφωνέω ay maaaring mangahulugang kumausap o tumawag nang malakas. Likas sa Filipino ang “nagsalita sa kanila,” habang pinananatili sa talababa ang mas mariing alternatibo.
- source_word: θέλων
  choice: dahil nais niyang
  rationale: Ipinahahayag ng kasalukuyang participle ang layunin o hangarin ni Pilato kasabay ng kanyang pagsasalita. Nililinaw ng “dahil nais niyang” ang ugnayan nang hindi ginagawang tiyak na sanhi ang higit sa ipinahihiwatig ng konteksto.
- source_word: ἀπολῦσαι
  choice: palayain
  rationale: Ang “palayain” ay natural at tumpak sa kontekstong legal at pagkakapiit.
- source_word: τὸν Ἰησοῦν
  choice: si Jesus
  rationale: Ginamit ang karaniwang Tagalog na pantukoy sa personal na pangalan at ang nakaugaliang anyong “Jesus.”
