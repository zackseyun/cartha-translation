    issue: Ang “dahil nais niyang” ay nagdaragdag ng ugnayang sanhi.
    rationale: Ang θέλων ay participle ng hangarin/intensiyon at hindi kinakailangang nagbibigay ng dahilan ng pagsasalita. Ang “na nais niyang” ay mas malapit sa saklaw ng Griyego.
  - severity: low
    issue: Ang “nagsalita ... sa kanila” ay mas maluwag kaysa προσφωνέω.
    rationale: Ang pandiwa ay tumutukoy sa pagtawag o pakikipag-usap sa mga tao; mas tuwirang ipinahihiwatig ito ng “kinausap.”
  revised_text: Ngunit muling kinausap ni Pilato ang mga tao[a], na nais niyang palayain si Jesus.
