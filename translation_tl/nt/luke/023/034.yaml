  to: Ngunit patuloy na sinasabi ni Jesus[a], “Ama, patawarin mo sila, sapagkat hindi nila alam ang kanilang ginagawa.” At pinaghati-hatian nila ang kanyang mga damit sa pamamagitan ng pagpapalabunutan.
