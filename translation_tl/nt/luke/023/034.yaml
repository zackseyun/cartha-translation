  source_fidelity: Tumpak ang panalangin at ang hindi-tiyak na panghalip na “sila.” Ang “patuloy na sinasabi” ay isang katanggap-tanggap na pagtatangkang ipahiwatig ang imperpektong ἔλεγεν, bagaman bahagyang mabigat sa daloy. Ang huling parirala ay kailangang linawin upang tuwirang maipakita ang participial na “pinaghati-hatian” at ang kasunod na “nagpalabunutan/cast lots.”
  naturalness: Natural at marangal ang pangunahing panalangin. Mas malinaw at mas idiomatiko sa modernong Filipino ang “sa pamamagitan ng pagpapalabunutan” kaysa “sa pamamagitan ng palabunutan” sa ganitong pangungusap.
  terminology: Ang “Ama,” “patawarin mo,” at “mga damit” ay angkop at hindi nagdaragdag ng pagpapakahulugang teolohikal. Pinananatili ng talababa ang mahalagang tekstuwal na baryante.
