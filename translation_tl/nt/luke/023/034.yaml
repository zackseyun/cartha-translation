  text: ⸂ὁ δὲ Ἰησοῦς ἔλεγεν· Πάτερ, ἄφες αὐτοῖς, οὐ γὰρ οἴδασιν τί ποιοῦσιν.⸃ διαμεριζόμενοι δὲ τὰ ἱμάτια αὐτοῦ ἔβαλον ⸀κλήρους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/034.yaml
  text: But Jesus was saying[a], “Father, forgive them, for they do not know what they are doing.” And dividing his garments, they cast lots.
translation:
  language: tl
  text: Ngunit patuloy na sinasabi ni Jesus[a], “Ama, patawarin mo sila, sapagkat hindi nila alam ang kanilang ginagawa.” At pinaghati-hatian nila ang kanyang mga damit sa pamamagitan ng pagpapalabunutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hindi kasama sa ilang manuskrito ang: “Ama, patawarin mo sila, sapagkat hindi nila alam ang kanilang ginagawa.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἔλεγεν
  choice: patuloy na sinasabi
  rationale: Ipinahihiwatig ng imperpektong aspekto ang nagpapatuloy o inuulit na pagsasalita, hindi lamang isang minsanang sinabi.
- source_word: Πάτερ
  choice: Ama
  rationale: Likas at tuwirang katumbas ng bokatibong pantawag; hindi idinagdag ang pagmamay-aring wala sa Griyego.
- source_word: ἄφες
  choice: patawarin mo
  rationale: Sa panalanging iniuukol sa Diyos para sa mga nagkasala, ‘patawarin’ ang pinakanatural na kahulugan ng ἀφίημι.
- source_word: αὐτοῖς
  choice: sila
  rationale: Pinananatili ang hindi tahasang pagtukoy ng Griyego kung sino mismo ang buong pangkat.
- source_word: οὐ γὰρ οἴδασιν τί ποιοῦσιν
  choice: sapagkat hindi nila alam ang kanilang ginagawa
  rationale: Tuwirang inilalarawan ng οἶδα ang kaalaman; iniiwasan ng ‘alam’ ang dagdag na pagpapakahulugang maaaring dalhin ng ‘nauunawaan.’
- source_word: διαμεριζόμενοι
  choice: pinaghati-hatian nila
  rationale: Natural sa Filipino at malinaw na tumutukoy sa paghahati-hati ng mga damit ni Jesus sa kanilang sarili.
- source_word: ἱμάτια
  choice: mga damit
  rationale: Karaniwan, malinaw, at marangal na modernong katumbas para sa mga kasuotan.
- source_word: ἔβαλον κλήρους
  choice: sa pamamagitan ng palabunutan
  rationale: Idyomatikong inilalarawan sa Filipino ang sinaunang paraang gumagamit ng lots upang pagpasyahan ang mapupunta sa bawat isa.
- source_word: δὲ
  choice: Ngunit / At
  rationale: Ang una ay banayad na pagsalungat o paglipat, samantalang ang ikalawa ay nagpapatuloy sa salaysay.
theological_decisions:
- issue: Pagiging orihinal ng pananalitang “Ama, patawarin mo sila, sapagkat hindi nila alam ang kanilang ginagawa.”
  choice: Isinama sa pangunahing teksto
  alternative: Hindi kasama sa ilang manuskrito
  rationale: Inilalathala ng ibinigay na SBLGNT ang sugnay sa teksto habang minamarkahan ang makabuluhang pag-aalinlangan sa tekstuwal na tradisyon. Kaya isinama ito at hayagang itinala ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘patuloy na sinasabi’ upang maipakita ang imperpektong aspekto, at ‘palabunutan’ upang maging natural ang sinaunang idyomang Griyego.
