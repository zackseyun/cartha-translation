id: LUK.23.42
reference: Luke 23:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγεν· Ἰησοῦ, μνήσθητί ⸀μου ὅταν ἔλθῃς ⸂ἐν τῇ βασιλείᾳ⸃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/042.yaml
  text: And he said[a], “Jesus, remember me when you come in your kingdom.”
translation:
  language: tl
  text: At sinabi niya, “Jesus, alalahanin mo ako pagdating mo sa iyong kaharian.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kapag dumating ka taglay ang iyong kaharian.” May ilang manuskritong mas tahasang nagsasabing “papasok sa iyong kaharian,” samantalang “sa iyong kaharian” ang mababasa sa SBLGNT.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Payak na pang-ugnay na nagpapanatili sa daloy ng salaysay nang hindi nagdaragdag ng interpretibong diin.
- source_word: ἔλεγεν
  choice: sinabi niya
  rationale: Bagaman nasa imperfect ang pandiwa at maaaring literal na ‘sinasabi niya,’ likas sa salaysay na Filipino ang simpleng nagdaang anyong ‘sinabi niya.’
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Bokatibong anyo ng personal na pangalan; ginagamit ang nakaugaliang anyo sa Filipino.
- source_word: μνήσθητί μου
  choice: alalahanin mo ako
  rationale: Likas na katumbas sa Filipino ng pakiusap na ‘remember me’; maaari itong magpahiwatig ng mabuting pagkilos para sa nagsasalita ngunit hindi iyon tahasang idinagdag.
- source_word: ὅταν ἔλθῃς
  choice: pagdating mo
  rationale: Maikli at likas na Filipino para sa hinaharap na pagdating na ipinakikilala ng ὅταν na may subjunctive.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: sa iyong kaharian
  rationale: Pinananatili ang karaniwang diwa ng ἐν bilang ‘sa’ at ang ambiguity kung ito ay pagdating sa loob ng kaharian o pagdating taglay ang maharlikang paghahari.
- source_word: βασιλείᾳ
  choice: kaharian
  rationale: Karaniwan, marangal, at madaling maunawaang salin na maaari ring magpahiwatig ng paghahari o pamumuno.
theological_decisions:
- issue: Eskatolohikal na diwa ng pakiusap kay Jesus
  choice: Ang nagsasalita ay humihiling na alalahanin siya sa pagdating ni Jesus kaugnay ng kanyang kaharian, nang hindi tinutukoy ang eksaktong panahon o balangkas.
  alternative: Maaaring unawain bilang pagpasok ni Jesus sa kanyang kaharian o pagdating niya taglay ang kanyang maharlikang paghahari.
  rationale: Malinaw sa talata ang hinaharap na pagdating at kaharian ni Jesus, ngunit hindi nito nililinaw ang buong kronolohiya o eskatolohikal na sistema.
- issue: Lokasyonal o instrumental/associative na diwa ng ἐν τῇ βασιλείᾳ σου
  choice: sa iyong kaharian
  alternative: kasama ng iyong kaharian; papasok sa iyong kaharian
  rationale: Ang ‘sa iyong kaharian’ ang pinakamalapit sa ἐν at sadyang hindi nilulutas ang tunay na ambiguity ng parirala.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang ‘alalahanin’ sa halip na mas kolokyal na ‘tandaan,’ at ‘pagdating mo sa iyong kaharian’ upang mapanatili ang maikli ngunit bukas na pagkakabuo ng Griyego.
