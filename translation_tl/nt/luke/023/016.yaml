  terminology: Ang “parusahan” ay angkop na malawak na katawagang penal para sa παιδεύω sa kontekstong ito, nang hindi ipinipilit ang mas tiyak na “hagupitin.” Wasto at kapaki-pakinabang ang talababa sa pagbanggit ng “kastiguhin,” “disiplinahin,” at ng posibleng pagpapakahulugang paghagupit.
