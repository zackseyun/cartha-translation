  text: παιδεύσας οὖν αὐτὸν ⸀ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/016.yaml
  text: Therefore[a], after disciplining him, I will release him.
translation:
  language: tl
  text: Kaya, matapos ko siyang parusahan[a], palalayain ko siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kastiguhin” o “disiplinahin.” Maaaring tumukoy ang pandiwa sa parusang naglalayong magtuwid. Nauunawaan ito ng ilan bilang paghagupit sa kontekstong ito, ngunit mas malawak ang kahulugan ng salitang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύσας
  choice: matapos ko siyang parusahan
  rationale: Ang aorist participle ay temporal dito. Sa konteksto ng paglilitis ni Pilato, ang pandiwa ay tumutukoy sa kaparusahang ipapataw bago palayain si Jesus. Pinananatili ng “parusahan” ang malawak na saklaw ng salitang Griyego at hindi nito ipinapalagay na paghagupit ang tiyak na paraan.
- source_word: οὖν
  choice: Kaya
  rationale: Natural na ipinahahayag ng “Kaya” ang inferensiyal o pangwakas na ugnayan ng sinabi ni Pilato sa naunang pahayag.
- source_word: αὐτόν
  choice: siya
  rationale: Ang panghalip ay tumutukoy kay Jesus at likas na isinasalin bilang “siya” sa Filipino.
- source_word: ἀπολύσω
  choice: palalayain ko siya
  rationale: Sa legal at custodial na konteksto, ang pandiwa ay nangangahulugang pakawalan o palayain. Ang “palalayain” ay malinaw at natural sa modernong Filipino.
theological_decisions:
- issue: Saklaw ng παιδεύω sa mungkahi ni Pilato
  choice: Isinalin sa diwang penal at panghukuman bilang “parusahan.”
  alternative: “disiplinahin,” “kastiguhin,” o mas tiyak na “hagupitin”
  rationale: Hinihingi ng konteksto ng paglilitis ang isang parusang ipapataw bago ang pagpapalaya. Hindi tinutukoy ng pandiwang Griyego mismo ang eksaktong paraan ng pagpaparusa, kaya hindi ginawang tiyak na paghagupit ang salin.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “matapos” para sa malinaw at likas na temporal na ugnayan, at “Kaya” upang mapanatili ang lohikal na puwersa ng οὖν.
