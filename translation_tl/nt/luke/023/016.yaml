  source_fidelity: Tapat ang salin sa Griyegong παιδεύσας οὖν αὐτὸν ἀπολύσω. Naipapahayag ng “Kaya” ang inferensiyal na οὖν; ang “matapos ko siyang parusahan” ay wastong temporal na pagsasalin ng aorist participle παιδεύσας sa kontekstong panghukuman; at ang “palalayain ko siya” ay tumpak para sa ἀπολύσω.
