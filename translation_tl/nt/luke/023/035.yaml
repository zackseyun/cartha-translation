id: LUK.23.35
reference: Luke 23:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἱστήκει ὁ λαὸς θεωρῶν. ἐξεμυκτήριζον δὲ καὶ οἱ ⸀ἄρχοντες λέγοντες· Ἄλλους ἔσωσεν, σωσάτω ἑαυτόν, εἰ οὗτός ἐστιν ὁ χριστὸς ⸂τοῦ θεοῦ, ὁ⸃ ἐκλεκτός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/035.yaml
  text: And the people stood watching. But even the rulers were mocking him[a], saying, “He saved others; let him save himself, if this is God’s Messiah, the Chosen One.”
translation:
  language: tl
  text: At nakatayo roon ang mga tao at nanonood. Ngunit pati ang mga pinuno ay patuloy na nanlilibak sa kanya habang sinasabi, “Iniligtas niya ang iba; iligtas niya ang kanyang sarili kung siya nga ang Mesiyas ng Diyos, ang Hinirang.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκει
  choice: nakatayo roon
  rationale: Ang anyo ng pandiwa ay naglalarawan ng nagpapatuloy na kalagayan sa tagpo. Natural sa Filipino ang “nakatayo roon” at malinaw na tumutukoy sa mga tao.
- source_word: θεωρῶν
  choice: nanonood
  rationale: Ipinahihiwatig ng participle ang patuloy na pagmamasid; ang “nanonood” ay karaniwan at natural sa modernong Filipino.
- source_word: ἐξεμυκτήριζον
  choice: nanlibak sa kanya
  rationale: Ipinapahayag ng pandiwa ang mapanghamak na pangungutya. Pinananatili ng “nanlibak” ang tindi nito nang hindi nagiging labis na teknikal.
- source_word: ἄρχοντες
  choice: mga pinuno
  rationale: Sa konteksto, tumutukoy ito sa mga namumunong awtoridad. Mas natural at malawak na nauunawaan sa Filipino ang “mga pinuno” kaysa “mga tagapamahala.”
- source_word: Ἄλλους ἔσωσεν / σωσάτω ἑαυτόν
  choice: Iniligtas niya ang iba; iligtas niya ang kanyang sarili
  rationale: Ang pag-uulit ng “iligtas” ay pinananatili upang maipakita ang retorikal at mapanuyang puwersa ng pahayag.
- source_word: εἰ οὗτός ἐστιν
  choice: kung siya nga
  rationale: Ang “siya nga” ay natural na naghahatid ng mapanghamong kondisyon at diin ng demonstrative sa Filipino, nang hindi pinatitindi nang higit sa Griyego.
- source_word: ὁ χριστὸς τοῦ θεοῦ
  choice: ang Mesiyas ng Diyos
  rationale: Titular dito ang Χριστός, kaya “Mesiyas” ang malinaw at angkop na salin. Pinananatili ng “ng Diyos” ang ugnayang genitive nang hindi ito labis na binibigyang-kahulugan.
- source_word: ὁ ἐκλεκτός
  choice: ang Hinirang
  rationale: Gumaganap itong titulo. Ang “ang Hinirang” ay maikli, marangal, at madaling maunawaan habang pinananatili ang teolohikal na bigat.
theological_decisions:
- issue: Pagsasalin sa Χριστός bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa pariralang ito, malinaw na titulo ang Χριστός. Ang “Mesiyas” ay nagpapanatili sa kahulugang mesiyaniko sa halip na tratuhin ito bilang pangalang pantangi.
- issue: Puwersa ng ὁ ἐκλεκτός
  choice: ang Hinirang
  alternative: ang Pinili ng Diyos
  rationale: Hindi inuulit sa mismong titulo ang “ng Diyos,” bagaman ipinahihiwatig iyon ng konteksto. Ang “ang Hinirang” ay mas malapit sa anyo ng Griyego at hindi nagdaragdag ng tahasang paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang maikling ayos at mapanuyang pag-uulit ng pandiwang “iligtas.” Walang talababa sapagkat walang kailangang alternatibong pagbasa sa ibinigay na SBLGNT text; ang English consultation footnote ay tila hindi tugma sa marker at hindi inangkat.
