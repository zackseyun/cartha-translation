  yaml_path: translation/nt/luke/023/009.yaml
  text: So he questioned him at considerable length[a], but he answered him nothing.
translation:
  language: tl
  text: Kaya matagal niya siyang tinanong[a], ngunit wala siyang isinagot sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa maraming salita” o “sa pamamagitan ng maraming tanong.” Idiniriin ng pananalitang Griyego ang matagal o pinalawig na pasalitang pagtatanong.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτα
  choice: matagal niya itong tinanong
  rationale: Ang imperpektong anyo ay nagpapahiwatig ng tuloy-tuloy o paulit-ulit na pagtatanong; kasama ng kasunod na parirala, natural itong naipapahayag sa Tagalog bilang matagal na pagtatanong.
- source_word: δὲ
  choice: Kaya / ngunit
  rationale: Ang unang δέ ay ginawang “Kaya” para sa natural na daloy ng salaysay, samantalang ang ikalawa ay “ngunit” upang malinaw ang paghahambing ng pagtatanong ni Herodes at pananahimik ni Jesus.
- source_word: ἐν λόγοις ἱκανοῖς
  choice: matagal
  rationale: Ang literal na diwa ay pagtatanong sa pamamagitan ng maraming salita. Sa konteksto, ang “matagal” ay natural at malinaw na naghahatid ng lawak o tagal ng pasalitang pagtatanong nang hindi ipinapalagay na λόγοις ay tiyak na nangangahulugang “mga tanong.”
- source_word: αὐτὸς
  choice: ito
  rationale: Tumutukoy kay Jesus at bahagyang mariin sa Griyego. Sa Tagalog, naipakikita na ng “ngunit” ang pagsalungat; ang “ito” ay natural na panghalip sa dalawang lalaking tinutukoy sa pangungusap.
- source_word: οὐδὲν
  choice: ng anuman
  rationale: Direktang ipinahahayag na walang anumang isinagot si Jesus.
- source_word: ἀπεκρίνατο αὐτῷ
  choice: sumagot sa kanya
  rationale: Karaniwan at malinaw na katumbas ng pandiwa at ng datibong tumutukoy sa taong sinasagot.
theological_decisions: []
translation_notes:
  register: Makabagong, malinaw, at marangal na Tagalog. Ginamit ang “ito” upang mapanatiling malinaw ang pagpapalitan ng mga tauhan nang hindi paulit-ulit ang mga pangalan.
