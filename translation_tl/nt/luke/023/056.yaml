id: LUK.23.56
reference: Luke 23:56
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑποστρέψασαι δὲ ἡτοίμασαν ἀρώματα καὶ μύρα. Καὶ τὸ μὲν σάββατον ἡσύχασαν κατὰ τὴν ἐντολήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/056.yaml
  text: Then after returning[a], they prepared spices and ointments. And on the Sabbath they rested according to the commandment[b],
translation:
  language: tl
  text: Pagkabalik nila[a], naghanda sila ng mga pabango at mga pamahid.[b] At noong Sabbath, nagpahinga sila ayon sa utos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nang makabalik sila.” Ipinahihiwatig ng anyong Griyego na nauna ang kanilang pagbalik bago sila naghanda.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga pamahid” ay maaari ring isaling “mababangong langis” o “mga langis na pabango.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: Pagkabalik nila
  rationale: Ipinahihiwatig ng aorist participle na nauna ang pagbalik ng mga babae bago ang pangunahing kilos na paghahanda; natural itong ipinapahayag sa Tagalog bilang “Pagkabalik nila.”
- source_word: δὲ
  choice: (hindi hiwalay na isinalin)
  rationale: Mahinang panandang pandiskurso ito. Sapat nang naipahahayag ng pagkakasunod ng mga sugnay ang pagpapatuloy ng salaysay, kaya hindi kailangang idagdag ang mabigat na “pagkatapos.”
- source_word: ἡτοίμασαν
  choice: naghanda sila
  rationale: Karaniwan, malinaw, at likas na salin ng pandiwa sa kontekstong pasalaysay.
- source_word: ἀρώματα
  choice: mga pabango
  rationale: Tumutukoy ito sa mababangong sangkap na inihahanda para sa paglilibing. Ang “mga pabango” ay madaling maunawaan at hindi nililimitahan ang anyo ng mga sangkap sa modernong rekado o espesya.
- source_word: μύρα
  choice: mababangong langis
  rationale: Ang μύρον ay mabangong langis o pamahid. Pinananatili ng saling ito ang pagkakaiba nito sa ἀρώματα at akma sa paghahanda para sa bangkay.
- source_word: τὸ μὲν σάββατον
  choice: nang Sabbath
  rationale: Likas na temporal na pahayag sa Tagalog. Hindi hiwalay na kinakatawan ang μέν sapagkat mahina lamang ang tungkuling transisyonal nito rito.
- source_word: ἡσύχασαν
  choice: nagpahinga sila
  rationale: Sa konteksto ng Sabbath, nangangahulugan itong tumigil sa gawain o magpahinga.
- source_word: κατὰ τὴν ἐντολήν
  choice: ayon sa utos
  rationale: Tuwirang pinananatili ang diwa ng pagsunod at ang isahan na ἐντολήν nang hindi nagpapasok ng paliwanag sa pangunahing teksto.
theological_decisions:
- issue: Tinutukoy ng “utos”
  choice: Pinanatiling “ayon sa utos” sa pangunahing teksto
  alternative: Palawakin bilang “ayon sa utos tungkol sa Sabbath”
  rationale: Malinaw sa konteksto na ang tinutukoy ay ang utos ng Kautusan tungkol sa Sabbath, ngunit hindi ito tahasang pinalalawak sa Griyegong teksto. Pinananatili ng salin ang anyo at hindi nagdaragdag ng paliwanag na interpretatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Sabbath” bilang pamilyar na katawagang biblikal. Iniwasan ang “mga espesya,” na sa kasalukuyang gamit ay madaling mapagkamalang mga rekado sa pagluluto.
