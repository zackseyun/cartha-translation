  text: ὁ δὲ Πιλᾶτος εἶπεν πρὸς τοὺς ἀρχιερεῖς καὶ τοὺς ὄχλους· Οὐδὲν εὑρίσκω αἴτιον ἐν τῷ ἀνθρώπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/004.yaml
  text: Then Pilate said to the chief priests and the crowds[a], “I find no basis for a charge against this man.”
translation:
  language: tl
  text: Sinabi naman ni Pilato sa mga punong pari at sa mga pulutong ng tao, “Wala akong makitang batayan upang paratangan ang taong ito.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Wala akong makitang pagkakasala sa taong ito.” Ang Griyegong αἴτιον ay maaaring tumukoy sa “pagkakasala” o “dahilan,” ngunit sa kontekstong ito ay may diwang hudisyal: walang sapat na batayan para sa isang paratang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: naman
  rationale: Isang banayad na pang-ugnay ang δέ. Likas na ipinahihiwatig ng “naman” ang paglipat sa tugon ni Pilato at ang bahagyang pagsalungat nito sa naunang paratang, nang hindi ito ginagawang matinding pagsalungat.
- source_word: Πιλᾶτος
  choice: Pilato
  rationale: Ginamit ang nakagawiang anyo ng pangalang ito sa Filipino.
- source_word: εἶπεν πρὸς
  choice: sinabi ... sa
  rationale: Natural at tuwirang katumbas sa Filipino ng karaniwang konstruksiyong nangangahulugang pagsasalita o pagtugon sa isang kausap.
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Tumutukoy ito sa nakatataas na pamunuang makasaserdote, hindi sa maraming sabay-sabay na humahawak sa natatanging katungkulan ng pinakapunong pari.
- source_word: ὄχλους
  choice: mga pulutong ng tao
  rationale: Pinananatili nito ang anyong maramihan ng Griyego at malinaw na tumutukoy sa mga nagkakatipong tao, hindi sa buong sambayanan sa pangkalahatan.
- source_word: Οὐδὲν εὑρίσκω
  choice: Wala akong makitang
  rationale: Natural na Filipino para sa kasalukuyang pasyang ipinahahayag ni Pilato at pinananatili ang ganap na pagtanggi.
- source_word: αἴτιον
  choice: batayan upang paratangan
  rationale: Sa kontekstong hudisyal, tumutukoy ang αἴτιον sa sapat na dahilan o legal na batayan ng isang paratang. Mas malinaw ito kaysa sa malawak na salitang “kasalanan.”
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: ang taong ito
  rationale: Sa pagsasama nito sa “paratangan,” natural na naipahahayag sa Filipino ang hudisyal na diwang ‘laban sa taong ito’ habang pinananatili ang demonstratibo at ang pagtukoy sa lalaki.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang ginamit. Ang “mga pulutong ng tao” ay bahagyang pormal ngunit madaling maunawaan at pinananatili ang maramihang anyo ng Griyego. Inilagay ang talababa sa mismong pahayag na may kaugnayan sa αἴτιον.
