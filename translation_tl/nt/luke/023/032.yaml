base_translation:
  language: en
  yaml_path: translation/nt/luke/023/032.yaml
  text: And two others[a], who were criminals[b], were being led with him to be put to death.
translation:
  language: tl
  text: Dalawa pang iba, na mga kriminal,[a] ang dinadala rin kasama niya upang patayin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga salarin” o “mga gumagawa ng masama.” Tumutukoy ang salitang Griyego sa mga taong gumawa ng masama at nasa ilalim ng hatol bilang mga kriminal.
    reason: lexical_alternative
  - marker: b
    text: O, “upang patayin bilang hatol.” Hindi tinutukoy ng salitang Griyego rito ang paraan ng pagpatay, bagaman ipinakikita ng konteksto na ito ay pagpapako sa krus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤγοντο
  choice: Dinadala
  rationale: Ang aspektong imperpektibo at tinig na pasibo ay inilalarawan bilang nagpapatuloy na pagdadala sa nakaraang tagpo; likas sa salaysay na Filipino ang kasalukuyang anyong “dinadala” para sa aksiyong nagaganap noon.
- source_word: δὲ καὶ
  choice: rin
  rationale: Magaan na ipinagpapatuloy ng δέ ang salaysay, habang ipinakikita ng καί na may iba pang dinadala bukod kay Jesus. Sapat at natural itong naipahahayag ng “rin” sa Filipino.
- source_word: ἕτεροι
  choice: iba
  rationale: Tumutukoy ito sa mga taong bukod kay Jesus, nang hindi sinasabing kabilang siya sa uri ng mga kriminal.
- source_word: κακοῦργοι
  choice: mga kriminal
  rationale: Sa kontekstong ito, tumutukoy ang salita sa mga gumagawa ng mabigat na kasamaan na hinatulan bilang mga kriminal. Malinaw at pangkaraniwan sa modernong Filipino ang “mga kriminal.”
- source_word: δύο
  choice: dalawa
  rationale: Tuwirang salin ng bilang na tumutukoy sa ibang mga taong dinadala.
- source_word: σὺν αὐτῷ
  choice: kasama niya
  rationale: Likas at maikling pagpapahayag ng pagsama kay Jesus.
- source_word: ἀναιρεθῆναι
  choice: upang patayin
  rationale: Pinananatili nito ang pangkalahatang kahulugan na kitlin ang buhay nang hindi idinaragdag sa mismong pandiwa ang tiyak na paraang pagpapako sa krus.
theological_decisions:
- issue: Kung tahasang sasabihing ipako sa krus sa pagsasalin ng ἀναιρεθῆναι
  choice: Gamitin ang mas malawak na “upang patayin.”
  alternative: “upang ipako sa krus” o “upang bitayin”
  rationale: Malinaw sa konteksto na pagpapako sa krus ang paraan ng pagpatay, ngunit hindi iyon espesipikong isinasaad ng pandiwang ἀναιρεθῆναι. Pinananatili ng salin ang saklaw ng salitang Griyego.
- issue: Kung magmumukhang tinatawag ding kriminal si Jesus
  choice: Ihiwalay bilang paliwanag ang “na mga kriminal” sa “dalawa pang iba.”
  alternative: “dalawa pang kriminal”
  rationale: Maaaring ipahiwatig ng ilang anyo ng “dalawa pang kriminal” na kabilang si Jesus sa parehong katawagan. Ang napiling ayos ay kinikilalang kriminal ang dalawang iba nang hindi inilalapat ang katawagan kay Jesus.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang karaniwang salitang “kriminal” sa halip na mas lumang “malefactor,” at inayos ang pangungusap upang manatiling natural habang pinananatili ang nagpapatuloy na kilos at ang pagkakaiba ni Jesus sa dalawang hinatulan.
