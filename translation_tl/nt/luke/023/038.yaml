  text: 'And there was also an inscription over him: “This is the King of the Jews.”[a][b][c][d]'
translation:
  language: tl
  text: 'May nakasulat din sa itaas niya: “Ito ang Hari ng mga Judio.”[a][b][c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “May karatula,” “May paunawa,” o “May nakasulat na paratang.”
    reason: lexical_alternative
  - marker: b
    text: O “sa ibabaw niya.”
    reason: lexical_alternative
  - marker: c
    text: 'Sa literal na ayos ng Griyego: “Ang Hari ng mga Judio—ang isang ito.”'
    reason: lexical_alternative
  - marker: d
    text: Ang “mga Judio” ay maaari sa ilang konteksto na isaling “mga taga-Judea,” ngunit sa nakapirming titulong ito sa pagpapako sa krus, ang tradisyonal at angkop sa kontekstong kahulugan ay “mga Judio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: nakasulat
  rationale: Tumutukoy ito sa nakasulat na pahayag na inilagay sa krus. Ang “may nakasulat” ay likas at malinaw sa makabagong Tagalog, nang hindi ipinapalagay sa pangunahing teksto kung iyon ay karatula o pormal na sakdal.
- source_word: ἐπ’ αὐτῷ
  choice: sa itaas niya
  rationale: Sa konteksto ng pagpapako sa krus, ipinahihiwatig ng parirala ang kinalalagyan ng nakasulat kaugnay ni Jesus. Ang “sa itaas niya” ay malinaw at hindi nagpapahiwatig na ang sulat ay nasa mismong katawan niya.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων οὗτος
  choice: Ito ang Hari ng mga Judio
  rationale: Walang tahasang pandiwa sa Griyego, at binibigyang-diin ng οὗτος ang taong tinutukoy. Likas sa Tagalog ang “Ito ang…” at napapanatili nito ang demonstratibong diin.
- source_word: Ἰουδαίων
  choice: mga Judio
  rationale: Sa nakapirming titulong nasa krus, ang “Hari ng mga Judio” ang tradisyonal at angkop na etniko-politikal na kahulugan; posible ang “mga taga-Judea” sa ibang konteksto ngunit hindi iyon ang pinakamainam dito.
- source_word: δὲ καὶ
  choice: din
  rationale: Idinaragdag ng parirala ang isa pang detalye sa salaysay. Likas na naihahatid ng “din” ang pandagdag na puwersa nito sa Tagalog.
theological_decisions:
- issue: Kalikasan at pahiwatig ng nakasulat sa krus
  choice: Tuwirang isinalin ang iniulat na nakasulat bilang pagkakakilanlan kay Jesus bilang “Hari ng mga Judio,” nang walang dagdag na paliwanag tungkol sa panunuya, sakdal, o pagpapahayag ng pagiging Mesiyas.
  alternative: Tukuyin ito sa pangunahing teksto bilang pormal na sakdal, o gawing tahasan ang ironiko o politikal na pahiwatig.
  rationale: Iniulat lamang ng talata ang pag-iral at mga salita ng nakasulat. Dapat panatilihin ng salin ang teolohikal at pampanitikang tensiyon nang hindi nagdaragdag ng interpretasyong hindi tahasang nasa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang payak na “May nakasulat” sa halip na mas teknikal na “May inskripsiyon,” habang inilagay sa talababa ang mga posibleng anyo at legal na diwa ng ἐπιγραφή. Pinanatili ang kinagawiang titulong “Hari ng mga Judio.”
