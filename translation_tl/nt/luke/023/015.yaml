revisions:
- from: Ngunit maging si Herodes ay hindi rin nakakita ng dahilan upang hatulan siya, sapagkat ipinabalik niya sa amin si Jesus. At tingnan ninyo, wala siyang ginawang anumang karapat-dapat sa kamatayan.[a]
  to: Ngunit wala ring natagpuang anumang karapat-dapat sa kamatayan si Herodes, sapagkat ipinabalik niya si Jesus sa atin. At narito, wala siyang ginawang anumang karapat-dapat sa kamatayan.[a]
