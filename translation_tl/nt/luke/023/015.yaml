  text: ἀλλ’ οὐδὲ Ἡρῴδης, ⸂ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς⸃· καὶ ἰδοὺ οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/015.yaml
  text: But neither did Herod, for he sent him back to us. And look, nothing deserving of death has been done by him.
translation:
  language: tl
  text: Ngunit wala ring natagpuang anumang karapat-dapat sa kamatayan si Herodes, sapagkat ipinabalik niya si Jesus sa atin. At narito, wala siyang ginawang anumang karapat-dapat sa kamatayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin ang hulíng bahagi: “walang anumang karapat-dapat sa kamatayan ang natagpuan sa kanya.”'
    reason: Pinananatili ang posibleng pagbasa sa αὐτῷ bilang pagtukoy kay Jesus sa halip na tahasang tagaganap ng ginawa.
lexical_decisions:
- source_word: ἀλλ’ οὐδὲ Ἡρῴδης
  choice: Ngunit maging si Herodes ay hindi rin nakakita ng dahilan upang hatulan siya
  rationale: Pinananatili ng “ngunit… hindi rin” ang pagsalungat at pagdaragdag kay Herodes bilang isa pang awtoridad. Dahil bitin ang pananalita sa Griyego, nilinaw sa natural na Tagalog ang ipinahihiwatig na hatol nang hindi sinasabing tiyak kung anong pormal na pasiya ang ginawa ni Herodes.
- source_word: ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς
  choice: sapagkat ipinabalik niya sa amin si Jesus
  rationale: Ang ἀναπέμπω sa kontekstong ito ay tumutukoy sa pagpapabalik kay Jesus kay Pilato. Ginamit ang pangalang “Jesus” sa halip na dalawang magkasunod na panghalip upang maging malinaw at natural sa Tagalog.
- source_word: καὶ ἰδοὺ
  choice: At tingnan ninyo
  rationale: Ginagawang tuwiran at makabagong panawagan sa mga tagapakinig ang ἰδού, habang pinananatili ang diin nito sa kasunod na konklusyon.
- source_word: οὐδὲν ἄξιον θανάτου
  choice: anumang karapat-dapat sa kamatayan
  rationale: 'Pinananatili nito ang hudisyal na diwa: walang gawang nararapat tumbasan ng parusang kamatayan.'
- source_word: ἐστὶν πεπραγμένον αὐτῷ
  choice: wala siyang ginawang
  rationale: Ipinahahayag sa natural na Tagalog ang periphrastic perfect bilang isang gawang maipaparatang kay Jesus na nananatiling mahalaga sa kasalukuyang paghatol.
theological_decisions:
- issue: Diwa ng αὐτῷ kasunod ng πεπραγμένον
  choice: 'Tagaganap: “wala siyang ginawang”'
  alternative: 'Pagtukoy: “walang anumang… ang natagpuan sa kanya”'
  rationale: Sa konteksto, ipinapahayag ni Pilato na walang nagawang krimeng maipaparatang kay Jesus na nararapat sa kamatayan. Gayunman, ibinigay sa talababa ang posibleng saling nakatuon sa kung ano ang natagpuan sa kanya.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “tingnan ninyo” sa halip na mas makalumang “masdan ninyo” o “narito,” at nilinaw ang bitin na sugnay sa Griyego sa paraang angkop sa hudisyal na konteksto.
