base_translation:
  language: en
  yaml_path: translation/nt/luke/023/043.yaml
  text: And he said to him[a], “Truly I tell you, today you will be with me in paradise.”
translation:
  language: tl
  text: At sinabi niya sa kanya, “Tunay na sinasabi ko sa iyo, ngayon ay makakasama mo ako sa paraiso.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, bagaman hindi gaanong malamang: “Tunay na sinasabi ko sa iyo ngayon, makakasama mo ako sa paraiso.” Walang makabagong bantas ang sinaunang tekstong Griyego; sa pagbabasang ito, ang “ngayon” ay inuugnay sa “sinasabi ko sa iyo” sa halip na sa “makakasama mo ako.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμήν
  choice: Tunay
  rationale: Sa mga pahayag ni Jesus, ang ἀμήν ay isang taimtim na pagpapatibay na nagpapakilala ng isang makapangyarihang pahayag. Ang “Tunay” ay natural, marangal, at malinaw sa makabagong Filipino.
- source_word: σοι λέγω
  choice: sinasabi ko sa iyo
  rationale: Malapit ito sa karaniwang pormula ng pagsasalita sa mga Ebanghelyo at natural pa rin sa Filipino.
- source_word: σήμερον
  choice: ngayon
  rationale: Pinakanatural na iugnay ang pang-abay sa ἔσῃ, kaya ang pangako ay matutupad sa araw ding iyon. Dahil walang makabagong bantas ang sinaunang tekstong Griyego, inilalahad sa talababa ang ibang posibleng pag-uugnay.
- source_word: μετ’ ἐμοῦ
  choice: makakasama kita
  rationale: Likas na Filipino ito para sa “you will be with me” at malinaw na pinananatili ang personal na pakikisama kay Jesus.
- source_word: ἔσῃ
  choice: makakasama
  rationale: Ipinahahayag ng anyong panghinaharap ang ipinangakong kalagayan; kasama ng “kita,” natural nitong isinasalin ang ἔσῃ μετ’ ἐμοῦ.
- source_word: παραδείσῳ
  choice: paraiso
  rationale: Ang “paraiso” ang kinikilalang katumbas sa kontekstong eskatolohikal at hindi nagdaragdag ng paliwanag na wala sa teksto.
theological_decisions:
- issue: Pagkakaugnay at diin ng σήμερον (“ngayon”) sa isang pahayag na nakasalalay sa bantas at may implikasyong teolohikal
  choice: Iugnay ang “ngayon” sa “makakasama kita sa paraiso.”
  alternative: Iugnay ang “ngayon” sa “sinasabi ko sa iyo.”
  rationale: Walang makabagong bantas ang sinaunang tekstong Griyego. Sa ayos at daloy ng pangungusap, mas natural na tumukoy ang σήμερον sa katuparan ng pangako, hindi sa oras ng pagsasalita. Gayunman, tunay na posible sa gramatika ang ibang pagbantas at may implikasyong teolohikal ito, kaya hindi ito ikinubli kundi inilagay sa talababa.
translation_notes:
  register: Makabagong Filipino na natural at marangal. Ginamit ang “Tunay” sa halip na transliterasyong “Amen,” at ang “makakasama kita” bilang mas likas na pagpapahayag kaysa sa mas literal ngunit mabigat na “ikaw ay makakasama ko.”
