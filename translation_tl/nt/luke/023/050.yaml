  text: Καὶ ἰδοὺ ἀνὴρ ὀνόματι Ἰωσὴφ βουλευτὴς ὑπάρχων, ⸀ἀνὴρ ἀγαθὸς καὶ δίκαιος—
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/050.yaml
  text: And behold[a], a man named Joseph, who was a council member, a good and righteous man—
translation:
  language: tl
  text: At narito, may isang lalaking nagngangalang Jose, na miyembro ng kapulungan, isang mabuti at matuwid[a] na tao—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makatarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: At narito
  rationale: Pinananatili ang panandang pandiskurso at pantawag-pansin ni Lucas sa paraang likas ngunit marangal sa modernong Tagalog.
- source_word: ἀνὴρ
  choice: isang lalaki
  rationale: Tumutukoy ito rito sa isang lalaking nasa hustong gulang, hindi sa sangkatauhan sa pangkalahatan.
- source_word: ὀνόματι Ἰωσὴφ
  choice: nagngangalang Jose
  rationale: Likas na salin ng pormulang nagpapakilala sa pangalan; ginagamit ang nakasanayang anyong Tagalog na Jose.
- source_word: βουλευτὴς ὑπάρχων
  choice: Miyembro siya ng kapulungan
  rationale: Malinaw na ipinapahayag ang pagiging kasapi niya sa namamahalang konseho nang hindi nagdaragdag sa talata ng pangalang hindi tahasang nasa Griyego.
- source_word: ἀνὴρ ἀγαθὸς καὶ δίκαιος
  choice: isa siyang mabuti at matuwid na tao
  rationale: Naipapakita ang muling pagbanggit sa ἀνήρ sa pamamagitan ng ‘tao,’ habang natural na inilalarawan si Jose bilang mabuti at matuwid.
theological_decisions:
- issue: Kahulugan ng δίκαιος sa paglalarawan kay Jose
  choice: matuwid
  alternative: makatarungan
  rationale: Maaaring tumukoy ang δίκαιος sa moral na katuwiran o sa pagiging makatarungan. Mas naipapahiwatig ng ‘matuwid’ ang malawak na moral at panrelihiyong diwa rito, ngunit inilalagay sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Hinati sa dalawang pangungusap para sa likas na daloy, ngunit pinanatili ang gitling sa hulihan sapagkat nagpapatuloy ang pangungusap sa susunod na talata.
