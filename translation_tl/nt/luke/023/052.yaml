  text: οὗτος προσελθὼν τῷ Πιλάτῳ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/052.yaml
  text: This man went to Pilate and asked for the body of Jesus.
translation:
  language: tl
  text: Pumunta siya kay Pilato at hiningi ang katawan ni Jesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: siya
  rationale: Tumutukoy ang panghalip na pamatlig kay Jose ng Arimatea sa naunang talata. Sa tuloy-tuloy na salaysay sa Filipino, natural at malinaw ang “siya”; ang “ang taong ito” ay mas mabigat at maaaring magbigay ng di-kailangang diin.
- source_word: προσελθὼν
  choice: Pumunta ... kay
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna at kaakibat ng pangunahing pandiwa. Ginawang pandiwang may hangganan upang maging natural sa Filipino habang pinananatili ang pagkakasunod ng mga kilos.
- source_word: τῷ Πιλάτῳ
  choice: kay Pilato
  rationale: Ang datibo ang tumutukoy sa taong nilapitan. Sapat ang “Pilato,” gaya ng nasa Griyego, at hindi dinaragdagan ng pangalang “Poncio.”
- source_word: ᾐτήσατο
  choice: hiningi
  rationale: Sa kontekstong ito, ang αἰτέω ay paghingi o paghiling na ibigay ang isang bagay. Ang “hiningi” ay maikli, natural, at angkop sa tuwirang layong “ang katawan ni Jesus.”
- source_word: τὸ σῶμα
  choice: ang katawan
  rationale: Tuwirang katumbas ito ng σῶμα at hindi nito pinatitindi ang pananalita sa pamamagitan ng mas tahasang “bangkay.” Malinaw sa konteksto na patay na katawan ang tinutukoy.
- source_word: τοῦ Ἰησοῦ
  choice: ni Jesus
  rationale: Likas na anyong paari/panugnay sa Filipino para sa payak na genitibong Griyego.
