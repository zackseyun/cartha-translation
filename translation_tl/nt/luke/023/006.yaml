base_translation:
  language: en
  yaml_path: translation/nt/luke/023/006.yaml
  text: But Pilate[a], hearing this, asked whether the man was a Galilean,
translation:
  language: tl
  text: Ngunit nang marinig ito ni Pilato, itinanong niya kung taga-Galilea ang lalaki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: Pilato
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa makabagong saling Filipino.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ito ng banayad na paglipat o pagsalungat sa takbo ng salaysay; natural dito ang “Ngunit.”
- source_word: ἀκούσας
  choice: nang marinig ito
  rationale: Ang aorist participle ay ginawang sugnay na panahunan para sa natural na Filipino. Idinagdag ang “ito” bilang likas na pantukoy sa impormasyong kababanggit lamang.
- source_word: ἐπηρώτησεν
  choice: itinanong niya
  rationale: Tuwirang ipinapahayag ang kilos ng pagtatanong at malinaw na si Pilato ang gumagawa nito.
- source_word: εἰ
  choice: kung
  rationale: Karaniwang pananda sa Filipino para sa di-tuwirang tanong.
- source_word: ὁ ἄνθρωπος
  choice: ang lalaki
  rationale: Pinananatili ang karaniwang katawagan ng Griyego sa halip na tahasang palitan ito ng pangalang Jesus o dagdagan ng demonstratibo.
- source_word: Γαλιλαῖός
  choice: taga-Galilea
  rationale: Natural na paraan sa Filipino upang ipahayag ang panrehiyong pinagmulan o pagkakakilanlan ng isang Galilean.
- source_word: ἐστιν
  choice: ang lalaki
  rationale: Walang hiwalay na pangkasalukuyang kopula na kailangan sa pangungusap na Filipino na “kung taga-Galilea ang lalaki”; kaya napapanatili ang diwa nang hindi sapilitang naglalagay ng panandang panahunan.
