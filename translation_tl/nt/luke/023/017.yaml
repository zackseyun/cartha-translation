  text: He had an obligation[a] to release one man to them at the festival.
translation:
  language: tl
  text: May obligasyon siyang magpalaya ng isang bilanggo para sa kanila sa panahon ng kapistahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang buong talatang ito ay wala sa ilan sa pinakamaagang manuskritong Griyego, kabilang ang Papyrus 75 mula sa ikatlong siglo at Vaticanus mula sa ikaapat na siglo, gayundin sa mga sinaunang salin sa Coptiko. Matatagpuan naman ito sa iba pang mahahalagang sinaunang manuskrito, gaya ng Sinaiticus mula sa ikaapat na siglo, sa tradisyong Latin, at sa nakararaming manuskrito ng tradisyong Byzantine. Malamang na idinagdag ito ng mga tagakopya upang itugma ang salaysay ni Lucas sa kaugaliang pagpapalaya na binanggit sa Mateo 27:15 at Marcos 15:6. Sa ilang manuskrito, nakalagay ang pangungusap na ito pagkatapos ng talata 18.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνάγκην … εἶχεν
  choice: Kinailangan niyang
  rationale: Likas na Filipino para sa idyomang nangangahulugang nasa ilalim siya ng pangangailangan o obligasyong gawin ito; hindi nito labis na tinutukoy kung batas, kaugalian, o pamimilit ang pinagmulan.
- source_word: ἀπολύειν
  choice: magpalaya
  rationale: Sa kontekstong penal, tumutukoy ito sa pagpapakawala mula sa pagkakabilanggo o kustodiya.
- source_word: ἕνα
  choice: isang bilanggo
  rationale: Bagaman literal na 'isa,' malinaw sa konteksto na isang bilanggo ang pinalalaya; idinagdag ang pangngalan upang maging natural at malinaw sa Filipino.
- source_word: κατὰ ἑορτήν
  choice: tuwing kapistahan
  rationale: Ipinahahayag ng 'tuwing' ang nakaugaliang pagganap sa panahon ng kapistahan, at ang 'kapistahan' ay dignified at karaniwang katawagan sa pampubliko at panrelihiyong pagdiriwang.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Pinananatili ang di-tiyak na panghalip ng Griyego nang hindi tahasang nililimitahan ang tinutukoy nito sa bayan o mga pinuno.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ang 'kinailangan' ay nagpapanatili sa lawak ng ἀνάγκη, samantalang ang 'tuwing kapistahan' ay maayos na naghahatid ng nakaugaliang pangyayari. Inilagay ang pananda ng talababa sa mismong teksto.
