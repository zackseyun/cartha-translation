revisions:
- from: Kinailangan niyang magpalaya sa kanila ng isang bilanggo tuwing kapistahan.[a]
  to: May obligasyon siyang magpalaya ng isang bilanggo para sa kanila sa panahon ng kapistahan.[a]
  rationale: Pinalitan ang “Kinailangan niyang” ng “May obligasyon siyang” upang mas tuwirang maipahayag ang idyomang ἀνάγκην … εἶχεν. Pinalitan ang “tuwing kapistahan” ng “sa panahon ng kapistahan” upang hindi lumabis ang aspektong paulit-ulit. Inayos ang ayos ng mga parirala para sa mas malinaw na Tagalog at pinakinis ang terminolohiya ng talababa, habang pinananatili ang saklaw at kawalang-katiyakan ng tekstuwal na tala.
