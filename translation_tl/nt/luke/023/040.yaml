id: LUK.23.40
reference: Luke 23:40
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἕτερος ⸂ἐπιτιμῶν αὐτῷ ἔφη⸃· Οὐδὲ φοβῇ σὺ τὸν θεόν, ὅτι ἐν τῷ αὐτῷ κρίματι εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/040.yaml
  text: But the other answered[a], rebuking him, “Do you not even fear God, since you are under the same sentence?”
translation:
  language: tl
  text: Ngunit sumagot ang isa at sinaway siya, “Hindi ka man lang ba natatakot sa Diyos, gayong nasa ilalim ka rin ng gayunding hatol[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gayunding kaparusahan” o “gayunding paghatol.” Ang Griyegong κρίμα ay maaaring mangahulugang paghatol, pasiya, hatol, o kaparusahan; dito, tumutukoy ito sa magkatulad nilang kalagayan sa ilalim ng parusang ipinataw.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἕτερος
  choice: Ngunit sumagot ang isa
  rationale: Ipinahahayag ng δέ ang banayad na pagsalungat sa naunang kriminal, at likas sa salaysay na Tagalog ang “sumagot ang isa.”
- source_word: ἐπιτιμῶν αὐτῷ ἔφη
  choice: at sinaway siya
  rationale: Pinananatili ng “sinaway” ang matinding pagsita ng ἐπιτιμάω. Hindi na hiwalay na isinalin ang ἔφη bilang “sinabi” dahil malinaw nang ipinakikilala ng “sumagot” ang tuwirang pananalita, at magiging paulit-ulit ito sa natural na Tagalog.
- source_word: Οὐδὲ φοβῇ σὺ τὸν θεόν
  choice: Hindi ka man lang ba natatakot sa Diyos
  rationale: Ang “man lang” ay naghahatid ng diin ng οὐδέ, habang pinananatili ng “natatakot sa Diyos” ang tuwirang biblikal at moral na bigat ng φοβέομαι.
- source_word: ὅτι
  choice: gayong
  rationale: Ipinakikita ng “gayong” ang batayan ng pagsaway at ang kapansin-pansing salungatan sa pagitan ng kanilang kalagayan at ng asal ng kausap.
- source_word: ἐν τῷ αὐτῷ κρίματι εἶ
  choice: nasa ilalim ka rin ng gayunding hatol
  rationale: Ang “hatol” ay angkop sa kontekstong legal at penal. Pinananatili ng “gayunding” ang paghahambing nang hindi tahasang tinutukoy kung kanino ibinabahagi ang hatol, gaya ng Griyego.
theological_decisions:
- issue: Kahulugan ng pagkatakot sa Diyos
  choice: natatakot sa Diyos
  alternative: gumagalang sa Diyos
  rationale: Pinananatili nito ang tuwirang lakas at teolohikal na bigat ng Griyegong φοβῇ nang hindi ito pinahihina o dinaragdagan ng paliwanag na wala sa teksto.
- issue: Saklaw ng “gayunding hatol”
  choice: Hindi tahasang tinukoy kung kanino kapareho ang hatol
  alternative: pareho tayong hinatulan / kapareho natin ang hatol
  rationale: Hindi tahasang pinapangalanan ng parirala sa Griyego ang pinaghahambingan. Ang salin ay nagpapanatili sa ambiguwidad na ito habang malinaw na tumutukoy sa iisang uring penal na kalagayan.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “sinaway” para sa malinaw ngunit hindi kolokyal na pagsita, at “nasa ilalim ng … hatol” upang mapanatili ang legal na larawan ng orihinal.
