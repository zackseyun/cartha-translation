  text: καὶ ⸀καθελὼν ἐνετύλιξεν αὐτὸ σινδόνι, καὶ ἔθηκεν ⸀αὐτὸν ἐν μνήματι λαξευτῷ οὗ οὐκ ἦν ⸂οὐδεὶς οὔπω⸃ κείμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/053.yaml
  text: And after taking him down[a], he wrapped him in a linen cloth and placed him in a tomb cut in stone[b], where no one had yet been laid.
translation:
  language: tl
  text: At matapos siyang ibaba, binalot niya siya sa telang lino at inilagay sa isang libingang inuka sa bato[a], kung saan wala pang sinumang nailibing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang libingang tinabas sa bato” o “isang libingang inukit mula sa bato.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kung saan wala pang sinumang nahimlay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: matapos siyang ibaba
  rationale: Ipinahahayag ng aorist participle ang kilos na nauna sa pagbabalot at paglalagay sa libingan. Likas sa Tagalog ang “matapos siyang ibaba,” at hindi nito kailangang ulitin ang krus na malinaw sa konteksto.
- source_word: ἐνετύλιξεν
  choice: binalot
  rationale: Tuwirang inilalarawan ang pagbabalot sa katawan nang hindi nagdaragdag ng paraang hindi sinabi sa Griyego.
- source_word: σινδόνι
  choice: sa telang lino
  rationale: Ang σινδών ay telang lino na maaaring gamitin sa paglilibing. Mas malinaw at hindi gaanong interpretatibo ang “telang lino” kaysa “kafan.”
- source_word: ἔθηκεν
  choice: inilagay
  rationale: Ang τίθημι rito ay tumutukoy sa paglalagay ng katawan sa libingan. Karaniwan, malinaw, at marangal ang “inilagay.”
- source_word: μνήματι
  choice: sa isang libingan
  rationale: Ang μνῆμα ay isang lugar ng paglilibing o puntod. Ang “libingan” ay natural at angkop sa batong libingang inilalarawan.
- source_word: λαξευτῷ
  choice: inuka sa bato
  rationale: Ipinahihiwatig ng λαξευτός na ang libingan ay tinabas o hinukay mula sa bato. Ang “inuka sa bato” ay natural sa makabagong Tagalog at malinaw na tumutukoy sa isang rock-cut tomb.
- source_word: οὗ
  choice: na
  rationale: Iniuugnay ng “na” ang sumusunod na paglalarawan sa libingan sa natural na ayos ng pangungusap sa Tagalog.
- source_word: οὐδεὶς οὔπω κείμενος
  choice: hindi pa kailanman napaghihimlayan ng sinuman
  rationale: Pinananatili nito ang diwa na wala pang taong nailibing o nahimlay roon. Ang “napaghihimlayan” ay angkop sa konteksto ng paglilibing at maayos na Tagalog.
theological_decisions:
- issue: Paglalarawan sa uri at dating paggamit ng libingan
  choice: Inilagay ni Jose ang katawan ni Jesus sa isang libingang inuka sa bato na hindi pa napaghihimlayan ng sinuman.
  alternative: Inilagay ni Jose si Jesus sa isang tinabas na libingan kung saan wala pang sinumang nahimlay.
  rationale: Nananatiling deskriptibo ang salin at hindi nagdaragdag ng detalye mula sa mga kahilerang salaysay. Pinananatili rin ang pahayag na hindi pa nagagamit ang libingan nang hindi ginagawa itong hiwalay na teolohikal na konklusyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “telang lino” sa halip na mas teknikal o tradisyonal na “kafan,” at “libingang inuka sa bato” upang maipahayag nang natural ang unang-siglong rock-cut tomb. Ang mga panghalip ay hindi pinalitan ng mga pangalang wala sa mismong talata.
