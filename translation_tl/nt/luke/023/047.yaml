id: LUK.23.47
reference: Luke 23:47
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ ὁ ἑκατοντάρχης τὸ γενόμενον ⸀ἐδόξαζεν τὸν θεὸν λέγων· Ὄντως ὁ ἄνθρωπος οὗτος δίκαιος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/047.yaml
  text: When the centurion saw what had happened[a], he glorified God, saying, “Certainly this man was righteous.”
translation:
  language: tl
  text: Nang makita ng senturyon ang nangyari, niluwalhati niya ang Diyos at sinabi, “Tunay ngang matuwid[a] ang taong ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “walang sala” o “makatarungan.” Ang salitang Griyego ay maaaring tumukoy sa moral na katuwiran o, sa kontekstong legal, sa kawalang-sala.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: Nang makita
  rationale: Isinalin ang aorist participle bilang likas na sugnay na panahunan sa Tagalog, na nagpapakitang ang pagkakita ay kaugnay ng sumunod na kilos.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay ito sa salaysay; sapat na sa natural na daloy ng Tagalog ang pagsisimula sa “Nang” nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: ὁ ἑκατοντάρχης
  choice: ang senturyon
  rationale: Tumpak at nakikilalang katawagan sa opisyal ng hukbong Romano na namumuno sa humigit-kumulang isang daang kawal.
- source_word: τὸ γενόμενον
  choice: ang nangyari
  rationale: Natural at tuwirang tumutukoy sa pangyayaring nasaksihan niya.
- source_word: ἐδόξαζεν τὸν θεὸν
  choice: niluwalhati niya ang Diyos
  rationale: Pinananatili ang diwang teolohikal ng δοξάζω. Ang payak na nagdaang anyo ay natural sa Tagalog at hindi labis na tinutukoy kung ito ay nagsimula o nagpatuloy.
- source_word: λέγων
  choice: at sinabi
  rationale: Natural na paraan sa Tagalog upang ipakilala ang mismong sinabi, habang malinaw na ang pagsasalita ang paraan ng pagluwalhati niya sa Diyos.
- source_word: Ὄντως
  choice: Tunay nga
  rationale: Nagpapahayag ng mariing pagpapatibay sa paraang natural at marangal sa modernong Tagalog.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: ang taong ito
  rationale: Tuwirang salin na tumutukoy kay Jesus bilang partikular na lalaki nang hindi nagdaragdag ng ibang pahayag tungkol sa kaniyang pagkakakilanlan.
- source_word: δίκαιος
  choice: matuwid
  rationale: Pinananatili ang pangunahing moral at teolohikal na diwa ng salita, habang inilalagay sa talababa ang posibleng legal na diwang “walang sala.”
- source_word: ἦν
  choice: ipinahihiwatig sa panaguring “matuwid”
  rationale: Sa natural na Tagalog, hindi kailangan ng hiwalay na katumbas ng past copula; malinaw sa konteksto ng salaysay ang panahong nagdaan.
theological_decisions:
- issue: Kahulugan ng δίκαιος sa pahayag ng senturyon
  choice: matuwid
  alternative: walang sala; makatarungan
  rationale: Ang “matuwid” ay nagpapanatili sa moral at teolohikal na bigat ng Griyego nang hindi ginagawang higit pa sa sinasabi ng talata. Gayunman, dahil sa konteksto ng di-makatarungang paghatol kay Jesus, tunay na posible rin ang legal na diwang “walang sala,” kaya pinanatili ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “senturyon” bilang maikli at tumpak na katawagan sa ranggong Romano. Inilagay ang pananda ng talababa kaagad pagkatapos ng “matuwid,” ang salitang tinutukoy nito.
