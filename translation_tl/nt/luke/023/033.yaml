base_translation:
  language: en
  yaml_path: translation/nt/luke/023/033.yaml
  text: And when they came to the place called Skull[a], there they crucified him and the criminals[b], one on the right and one on the left.
translation:
  language: tl
  text: Nang makarating sila sa lugar na tinatawag na Bungo[a], doon nila siya ipinako sa krus, pati ang mga kriminal—ang isa sa kanan at ang isa sa kaliwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang katawagang Griyego na Κρανίον ay literal na nangangahulugang “bungo.”
    reason: lexical_alternative
  - marker: b
    text: Literal na, “ang isa mula sa kanan at ang isa mula sa kaliwa.” Hindi tahasang nakasaad sa Griyego ang “niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον ἐπὶ τὸν τόπον
  choice: makarating sila sa lugar
  rationale: Sa konteksto ng paglalakbay, likas sa makabagong Tagalog ang “makarating” para sa pagdating sa tinutukoy na lugar; pinananatili nito ang direksiyonal na diwa ng ἐπί na may akusatibo.
- source_word: τὸν καλούμενον Κρανίον
  choice: tinatawag na Bungo
  rationale: Ang Κρανίον ay karaniwang pangngalang nangangahulugang “bungo.” Isinalin ang kahulugan ng katawagan sa lugar sa halip na hiramin ang anyong Latin o tradisyonal na pangalan.
- source_word: ἐσταύρωσαν
  choice: ipinako … sa krus
  rationale: Ito ang malinaw, karaniwan, at eksaktong katumbas sa Tagalog ng pagkamatay sa pamamagitan ng pagpapako sa krus.
- source_word: κακούργους
  choice: mga kriminal
  rationale: 'Malawak ang kahulugan ng κακοῦργος: mga taong gumawa ng krimen o masama. Ang “mga kriminal” ay malinaw at moderno, at hindi nito pinakikitid ang kahulugan tungo sa “mga magnanakaw” o “mga rebelde.”'
- source_word: ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν
  choice: ang isa sa kanan at ang isa sa kaliwa
  rationale: Likas na inilalahad nito sa Tagalog ang magkatapat na puwesto ng dalawang kriminal. Hindi idinagdag ang “niya” sapagkat ipinahihiwatig lamang iyon ng konteksto at hindi tahasang nasa Griyego.
theological_decisions:
- issue: Pagbibigay-kahulugan sa Κρανίον
  choice: Bungo
  alternative: Kalbaryo; Golgota; ang Bungo
  rationale: Ang teksto ni Lucas ay gumagamit ng katawagang Griyego na literal na “bungo.” Pinananatili ng “Bungo” ang kahulugan nang hindi nag-aangkat ng Latin na tradisyon o ng Semitikong anyo mula sa ibang Ebanghelyo.
- issue: Paglalarawan sa mga lalaking ipinako kasama ni Jesus
  choice: mga kriminal
  alternative: mga salarin; masasamang-loob; mga magnanakaw
  rationale: Hindi tinutukoy ng κακούργοι ang isang partikular na uri ng krimen. Kaya iniiwasan ng “mga kriminal” ang pag-uugnay o paghaharmonisa sa ibang katawagang ginagamit sa mga kaagapay na salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ipinako sa krus” bilang karaniwang salin ng σταυρόω at ang “mga kriminal” upang mapanatili ang malawak na saklaw ng katawagang ginamit ni Lucas.
