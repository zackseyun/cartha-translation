  verdict: revise
  source_fidelity: Tumpak ang paglalapat ng malaking pulutong, ng mga babaeng kabilang dito, at ng dalawang kilos ng pagdadalamhati. Gayunman, ang "babaeng hinahampas ang kanilang dibdib" ay maaaring mabasa bilang ang mga babae ang hinahampas ng iba, sapagkat pasibo ang "hinahampas." Kailangang gawing malinaw na sila mismo ang humahampas sa kanilang dibdib.
  naturalness: Makabago at marangal ang pangkalahatang rehistro. Mas natural at walang kalabuan ang aktibong "humahampas sa kanilang dibdib."
  terminology: Ang "pulutong," "dibdib," at "nananaghoy" ay angkop. Pinananatili ng "nananaghoy para sa kanya" ang hayag na pagluluksa para kay Jesus nang hindi nagdaragdag ng paliwanag.
  issues:
