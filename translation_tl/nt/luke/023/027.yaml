  yaml_path: translation/nt/luke/023/027.yaml
  text: A large crowd of people followed him, including women who were beating their breasts and mourning for him.
translation:
  language: tl
  text: Isang malaking pulutong ng mga tao ang sumunod sa kanya, kasama ang mga babaeng humahampas sa kanilang dibdib at nananaghoy para sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκολούθει
  choice: sumunod
  rationale: Ang imperpektong pandiwa ay naglalarawan ng nagpapatuloy na kilos sa salaysay; natural sa Tagalog ang payak na aspektong naganap dito, habang ipinahihiwatig ng konteksto ang patuloy na pagsunod.
- source_word: δὲ
  choice: hindi hiwalay na isinalin
  rationale: Nag-uugnay ito sa pagpapatuloy ng salaysay, ngunit hindi kailangan ng tahasang pang-ugnay sa natural na Tagalog.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Ang datibo kasama ng ἀκολουθέω ay tumutukoy kay Jesus bilang sinusundan.
- source_word: πολὺ πλῆθος τοῦ λαοῦ
  choice: isang malaking pulutong ng mga tao
  rationale: Natural at malinaw na ipinapahayag nito ang malaking pangkat ng mga taong sumusunod, nang hindi mekanikal na ginagaya ang mga genitibo sa Griyego.
- source_word: καὶ γυναικῶν
  choice: kasama ang mga babae
  rationale: Ipinakikilala nito ang mga babae bilang bahagi ng kasamang pulutong at malinaw na inihahanda ang pambabaeng panghalip na sumusunod.
- source_word: αἳ
  choice: na
  rationale: Ang pambabaeng maramihang panghalip ay tiyak na tumutukoy sa mga babae; pinananatili itong malinaw ng sugnay na kaagad sumusunod sa 'mga babae.'
- source_word: ἐκόπτοντο
  choice: hinahampas ang kanilang dibdib
  rationale: Sa konteksto ng pagluluksa, tumutukoy ang pandiwa sa ritwal o hayag na paghampas sa dibdib bilang tanda ng matinding dalamhati.
- source_word: ἐθρήνουν
  choice: nananaghoy
  rationale: Ipinapahayag nito ang hayag at malamang na naririnig na pagdadalamhati na saklaw ng θρηνέω.
- source_word: αὐτόν
  choice: para sa kanya
  rationale: Natural na Tagalog ito para sa taong siyang pinagtutuunan ng panaghoy.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'pulutong' at 'nananaghoy' bilang madaling maunawaang mga salitang angkop sa seryosong salaysay; iniwasan ang mekanikal na ayos ng mga genitibo sa Griyego habang pinananatiling tiyak na ang mga babae ang gumagawa ng dalawang kilos ng pagluluksa.
