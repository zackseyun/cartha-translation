    issue: Malabong tinig ng "hinahampas ang kanilang dibdib"
    rationale: Ang "hinahampas" ay anyong pasibo at maaari itong mangahulugang may humahampas sa mga babae. Ang ἐκόπτοντο, bagaman middle/passive ang anyo, ay idyomatikong tumutukoy sa mga nagdadalamhating babae na humahampas sa sarili nilang dibdib.
  revised_text: Isang malaking pulutong ng mga tao ang sumunod sa kanya, kasama ang mga babaeng humahampas sa kanilang dibdib at nananaghoy para sa kanya.
