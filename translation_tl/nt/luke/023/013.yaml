  yaml_path: translation/nt/luke/023/013.yaml
  text: But Pilate, having called together the chief priests and the rulers and the people,
translation:
  language: tl
  text: Ngunit, nang ipatawag ni Pilato ang mga punong pari, ang mga pinuno, at ang mga tao,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: Pilato
  rationale: Karaniwang anyo ng pangalang Pilate sa makabagong saling Tagalog.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ang δέ ng banayad na paglipat o pagsalungat sa daloy ng salaysay; likas sa konteksto ang “Ngunit.”
- source_word: συγκαλεσάμενος
  choice: tinipon
  rationale: Ipinahahayag ng aorist middle participle ng συγκαλέω na ipinatawag at pinagsama-sama ni Pilato ang mga pangkat. Ang “tinipon” ay maikli, natural, at nagpapanatili sa temporal na pagkakasunod bago ang susunod niyang gagawin.
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Tumutukoy ang maramihan sa mga pangunahing awtoridad ng mga pari, hindi sa maraming sabay-sabay na may iisang katungkulang pinakapunong pari.
- source_word: ἄρχοντας
  choice: mga pinuno
  rationale: Tumutukoy sa mga taong may pamamahala o awtoridad. Mas natural sa kasalukuyang Tagalog ang “mga pinuno” kaysa “mga tagapamahala” o “mga naghahari” sa kontekstong ito.
- source_word: λαὸν
  choice: taong-bayan
  rationale: Pinananatili nito ang kolektibong diwa ng λαός at hindi ito pinakikitid sa kahulugang “karamihan” lamang.
