reference: Luke 23:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ τρίτον εἶπεν πρὸς αὐτούς· Τί γὰρ κακὸν ἐποίησεν οὗτος; οὐδὲν αἴτιον θανάτου εὗρον ἐν αὐτῷ· παιδεύσας οὖν αὐτὸν ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/022.yaml
  text: And he said to them a third time[a], “Why? What evil has this man done? I have found in him no grounds for death. Therefore, after disciplining him[c][b], I will release him.”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanila sa ikatlong pagkakataon, “Bakit?[a] Anong masama ang ginawa ng taong ito? Wala akong nakitang anumang batayan upang hatulan siya ng kamatayan.[b] Kaya, pagkatapos ko siyang parusahan,[c] palalayain ko siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sapagkat anong masama ang ginawa ng taong ito?” Maaaring unawain ang pambungad na Τί bilang pinaikling pagtutol na naghahanda sa buong tanong.
    reason: lexical_alternative
  - marker: b
    text: O “Wala akong nakitang dahilan para sa kamatayan,” “wala siyang nagawang nararapat sa kamatayan,” o “wala akong nakitang batayan para sa hatol na kamatayan.”
    reason: lexical_alternative
  - marker: c
    text: O “pagkatapos ko siyang disiplinahin”; maaaring mas tiyak na “pagkatapos ko siyang hagupitin.” Ang Griyegong παιδεύσας ay tumutukoy rito sa disiplinaryong pagpaparusa, ngunit hindi tinutukoy ng salitang ito lamang ang eksaktong paraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τρίτον
  choice: sa ikatlong pagkakataon
  rationale: Ipinahahayag ng pang-abay na akusatibo ang pag-uulit. Likas ito sa modernong Filipino at pinananatili ang diin ng salaysay na ikatlong beses na itong sinabi.
- source_word: Τί γὰρ κακὸν ἐποίησεν οὗτος;
  choice: Bakit? Anong masama ang ginawa ng taong ito?
  rationale: Maaaring gumana ang Τί bilang pinaikling pagtutol bago ang buong tanong. Pinananatili ng dalawang tanong ang daloy at diin ng Griyego; ang “masama” ay tumutugma sa moral na bigat ng κακόν.
- source_word: οὐδὲν αἴτιον θανάτου
  choice: walang anumang batayan upang hatulan siya ng kamatayan
  rationale: Sa kontekstong legal, ang αἴτιον ay tumutukoy sa dahilan o batayan para sa isang hatol. Malinaw sa karaniwang Filipino ang salin at hindi nito ipinapalagay na kamatayan lamang ang tinutukoy sa halip na hatol na kamatayan.
- source_word: εὗρον ἐν αὐτῷ
  choice: wala akong nakitang … upang hatulan siya
  rationale: Ipinahahayag nito ang kasalukuyang bisa ng pasiya ni Pilato. Isinama ang ἐν αὐτῷ sa likas na Filipino sa pamamagitan ng pagtukoy kay Jesus bilang taong walang natagpuang batayan para hatulan.
- source_word: παιδεύσας
  choice: pagkatapos ko siyang parusahan
  rationale: Sa kontekstong ito, ang παιδεύω ay tumutukoy sa kaparusahang mas magaan kaysa pagpatay. Mas malinaw at natural ang “parusahan” kaysa “disiplinahin” sa legal na tagpo, habang hindi nito tinutukoy ang eksaktong paraan ng parusa.
- source_word: ἀπολύσω
  choice: palalayain ko siya
  rationale: Sa kontekstong panghukuman, ang ἀπολύω ay nangangahulugang pakawalan o palayain. Ang “palalayain” ay natural at angkop sa pormal na tagpo.
theological_decisions:
- issue: Anyo ng parusang iminungkahi ni Pilato sa παιδεύσας
  choice: Isinalin sa pangkalahatan bilang “parusahan,” nang hindi tinutukoy ang eksaktong paraan.
  alternative: “disiplinahin” o, kung mas tiyak, “hagupitin”
  rationale: Ipinapahayag ng talata na hindi karapat-dapat sa kamatayan si Jesus, ngunit nagmumungkahi pa rin si Pilato ng mas magaang parusa. Pinahihintulutan ng pandiwang Griyego ang disiplinaryo o maparusang diwa, ngunit hindi nito lamang tinutukoy kung paghagupit nga ang gagawin. Pinananatili ng salin ang tensiyong ito nang hindi nagdaragdag ng isang tiyak na rekonstruksiyong historikal.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang legal na himig ng pahayag ni Pilato sa “batayan” at “hatulan,” ngunit iniwasan ang labis na teknikal na pananalita. Ang “taong ito” ay natural na katumbas ng demonstratibong οὗτος sa kontekstong pampubliko.
