    rationale: Ang mga γραμματεῖς ay maaaring may tungkuling magturo at maging dalubhasa sa Kautusan, ngunit ang talata ay pinangalanan sila bilang isang pangkat. Ang “mga eskriba” ay mas direktang katumbas at iniiwasan ang di-kinakailangang pagpapalawak.
  - severity: low
    issue: Mas mainam ang “inaakusahan” kaysa “pinararatangan” sa pangunahing teksto.
    rationale: Ang kasalukuyang participle κατηγοροῦντες ay naglalarawan ng kilos na nagpapatuloy habang sila ay nakatayo roon. Ang “inaakusahan” ay malinaw na imperfective at tuwirang katumbas ng legal/naratibong diwa.
  revised_text: Ang mga punong pari at mga eskriba ay nakatayo roon, at buong tindi nilang inaakusahan siya.[a]
