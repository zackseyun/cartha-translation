  text: And the chief priests and the scribes stood there[a], vehemently accusing him.
translation:
  language: tl
  text: Ang mga punong pari at mga eskriba ay nakatayo roon, at buong tindi nilang inaakusahan siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mariin nilang inaakusahan siya” o “matinding paratang ang inihaharap nila laban sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: Nakatayo roon
  rationale: Ang anyong pandiwa ay naglalarawan ng patuloy na kalagayan sa nakaraan at ng presensiya nila sa tagpo. Likas sa modernong Tagalog ang “nakatayo roon.”
- source_word: δὲ
  choice: at
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay, hindi mariing pagsalungat. Isinama ito bilang “at” bago ang kasabay na kilos upang maging natural ang daloy sa Tagalog.
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Tumutukoy ito sa mga nangungunang awtoridad ng mga pari, hindi sa maraming taong sabay-sabay na humahawak sa nag-iisang tungkulin ng pinakapunong pari.
- source_word: γραμματεῖς
  choice: mga tagapagturo ng Kautusan
  rationale: Ipinahahayag nito sa karaniwang modernong Tagalog ang kinikilalang tungkulin ng mga γραμματεῖς bilang mga dalubhasa at tagapagturo ng Kautusan. Mas malinaw ito sa ordinaryong mambabasa kaysa sa hiram na salitang “mga eskriba.”
- source_word: εὐτόνως
  choice: buong tindi
  rationale: Ipinahahayag ng pang-abay ang puwersa at matinding sigasig ng kanilang pag-aakusa. Pinananatili ng “buong tindi” ang diin nang hindi nagdaragdag ng motibong hindi tahasang sinabi.
- source_word: κατηγοροῦντες
  choice: pinararatangan
  rationale: Ang kasalukuyang participle ay nagpapakita ng nagpapatuloy na pag-aakusa habang naroon sila. Ang “pinararatangan” ay natural at maaaring magdala ng legal na diwa sa konteksto.
- source_word: αὐτοῦ
  choice: siya
  rationale: Ang genitive na kasama ng κατηγορέω ay tumutukoy sa taong inaakusahan; idiomatiko sa Tagalog ang “pinararatangan siya.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “Kautusan” na may malaking titik bilang karaniwang pantukoy sa Kautusan ni Moises. Inilagay ang talababa pagkatapos ng sugnay na saklaw nito.
