- from: Nakatayo roon ang mga punong pari at ang mga tagapagturo ng Kautusan, at buong tindi nilang pinararatangan siya.[a]
  to: Ang mga punong pari at mga eskriba ay nakatayo roon, at buong tindi nilang inaakusahan siya.[a]
