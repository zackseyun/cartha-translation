  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: naroon/nakatayo ang mga punong pari at mga γραμματεῖς habang masidhing inaakusahan nila si Jesus. Gayunman, ang “mga tagapagturo ng Kautusan” ay nagpapaliwanag ng isang kaugnay na tungkulin ngunit hindi tuwirang isinasalin ang γραμματεῖς; mas tapat at matatag ang “mga eskriba.”'
  naturalness: Natural ang estruktura, ngunit mas malinaw at mas likas ang paglalagay ng “ay” at ang paggamit ng imperfective na “inaakusahan” upang maipakita ang kasabay at nagpapatuloy na participle.
  terminology: Panatilihin ang “mga punong pari.” Pinalitan ang interpretibong “mga tagapagturo ng Kautusan” ng karaniwang terminong “mga eskriba,” na hindi nagpapalawak sa saklaw ng γραμματεῖς. Walang isyung teolohikal.
  issues:
