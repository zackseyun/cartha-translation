  verdict: revise
  source_fidelity: 'Tumpak ang pagsasalin ng mga pangunahing elemento: isang kriminal na nakabitin, ang mapanuyang pagsasalita laban kay Jesus, ang retorikal na tanong tungkol sa Mesiyas, at ang utos na iligtas ang sarili at sila. Gayunman, ang imperfect na ἐβλασφήμει at ang kasunod na participle na λέγων ay mas maayos na maipapakita bilang nagpapatuloy na panlalait na may kasabay na pagsasalita, sa halip na dalawang magkasunod na pangyayaring “Nilalait ... Sinabi.”'
  naturalness: Natural ang karamihan ng wika at ang antas ng pananalita ay angkop. Mas matatas at mas malapit sa aspekto ng Griyego ang “Patuloy siyang nilalait ... at sinasabi.” Ang “kami rin” ay nagbibigay ng likas na Tagalog na diin sa karagdagang kahilingang “and us.”
  terminology: Ang “Mesiyas” ay angkop para sa ὁ χριστός bilang titulo at ang talababa na “Cristo” ay wastong alternatibo. Ang “kriminal” at “nakabitin doon” ay kapwa malinaw at hindi nagdaragdag ng detalye na wala sa Griyego.
