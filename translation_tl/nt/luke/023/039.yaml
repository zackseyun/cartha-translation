base_translation:
  language: en
  yaml_path: translation/nt/luke/023/039.yaml
  text: One of the criminals who were hanging there was reviling him[a], saying, “Are you not the Messiah? Save yourself and us.”
translation:
  language: tl
  text: Patuloy siyang nilalait ng isa sa mga kriminal na nakabitin doon at sinasabi, “Hindi ba ikaw ang Mesiyas?[a] Iligtas mo ang iyong sarili at kami rin!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Cristo.” Sa Griyego: ho christos.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἷς δὲ
  choice: isa
  rationale: Ipinakikilala ng δέ ang bahagyang pagpapatuloy o paghahambing sa salaysay; hindi kailangang lagyan ng tahasang pang-ugnay sa natural na Tagalog.
- source_word: τῶν κρεμασθέντων κακούργων
  choice: sa mga kriminal na nakabitin doon
  rationale: Ang κακούργων ay natural na isinasaling “mga kriminal,” at pinananatili ng “nakabitin doon” ang larawan ng κρεμασθέντων nang hindi ginagawang mas tiyak ang pandiwa kaysa sa Griyego.
- source_word: ἐβλασφήμει αὐτόν
  choice: Nilalait siya
  rationale: Sa konteksto, tumutukoy ito sa mapang-abusong pananalita laban kay Jesus. Ang aspektong di-ganap ng imperfect ay sapat na naipahihiwatig ng nagpapatuloy na tagpo, habang nananatiling natural ang Tagalog.
- source_word: λέγων
  choice: Sinabi nito
  rationale: Natural na pambungad sa tuwirang pananalita; nililinaw ng “nito” na ang kriminal ang nagsasalita.
- source_word: Οὐχὶ σὺ εἶ ὁ χριστός;
  choice: Hindi ba ikaw ang Mesiyas?
  rationale: Pinananatili ng “Hindi ba” ang mapanuyang tanong na umaasang sasang-ayon ang kausap. Isinasalin ang Χριστός bilang titulong “Mesiyas.”
- source_word: σῶσον σεαυτὸν καὶ ἡμᾶς
  choice: Iligtas mo ang iyong sarili at kami!
  rationale: Pinananatili ng “iligtas” ang agarang kahulugan ng pagliligtas mula sa kamatayan at ang mas malawak na ugnayang pangsalita sa kaligtasan.
theological_decisions:
- issue: Paglilipat ng Χριστός bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito, ang Χριστός ay ginagamit bilang titulong inaangkin para kay Jesus, hindi bilang pangalang pantangi. Pinananatili ng “Mesiyas” ang kahulugan at kontekstong Judio ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nilalait” sa halip na teknikal na “nilalapastangan” upang ipakita ang mapang-abusong pananalita sa konteksto. Inilagay ang talababa pagkatapos ng “Mesiyas,” ang terminong tinutukoy nito.
