base_translation:
  language: en
  yaml_path: translation/nt/luke/023/029.yaml
  text: For look, days are coming in which they will say, ‘Blessed are the barren women, and the wombs that never bore, and the breasts that never nursed.’
translation:
  language: tl
  text: Sapagkat, narito, darating ang mga araw na sasabihin nila, ‘Mapalad ang mga babaeng baog, ang mga sinapupunang hindi nagsilang, at ang mga dibdib na hindi nagpasuso.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: tingnan ninyo
  rationale: Pinananatili ang panawag-pansin ng salitang Griyego sa natural at kasalukuyang Tagalog.
- source_word: αἱ στεῖραι
  choice: ang mga babaeng baog
  rationale: Malinaw na tumutukoy sa mga babaeng hindi nagkaanak at tumutugma sa pangmaramihang anyo.
- source_word: αἱ κοιλίαι αἳ οὐκ ἐγέννησαν
  choice: ang mga sinapupunang hindi nagluwal
  rationale: Pinananatili ang metonimiya at pisikal na larawan ng orihinal; ang ‘nagluwal’ ay likas na katumbas ng panganganak sa kontekstong ito.
- source_word: μαστοὶ οἳ οὐκ ἔθρεψαν
  choice: ang mga dibdib na hindi nagpasuso
  rationale: Sa konteksto ng dibdib at sanggol, ang pandiwa ay likas na tumutukoy sa pagpapasuso o pagpapakain sa pamamagitan ng gatas.
theological_decisions:
- issue: Ang kabalintunaan ng pagtawag na mapalad sa mga babaeng baog
  choice: Pinanatili nang tuwiran ang ‘Mapalad ang mga babaeng baog.’
  alternative: Ipaliwanag sa teksto na magiging mabuti ang kalagayan nila dahil sa darating na kapahamakan.
  rationale: Ang talata mismo ay sadyang mabigat at kabalintunaan; hindi dapat idagdag sa salin ang paliwanag na nasa mas malawak na konteksto lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang tatluhang paralelismo at ang matinding larawan ng orihinal nang hindi dinaragdagan ng paliwanag.
