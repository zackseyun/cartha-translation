  source_fidelity: Tumpak ang salin sa diwa at diin ng Griyego. Ang “Ngunit” ay angkop sa δέ; ang “patuloy silang sumisigaw” ay natural na naghahayag ng imperfect na ἐπεφώνουν; at ang inuulit na utos na “Ipako siya sa krus!” ay malinaw na naghahatid ng Σταύρου σταύρου αὐτόν. Ang hindi hiwalay na pagsasalin ng λέγοντες ay idiomatikong Tagalog at hindi nag-aalis ng kahulugan.
  naturalness: Natural, malinaw, at marangal ang modernong Filipino. Ang pag-uulit ng buong utos, kabilang ang “siya,” ay mas likas na sigaw sa Tagalog kaysa piliting tularan ang eksaktong ayos ng mga salitang Griyego.
  terminology: Ang “Ipako siya sa krus” ay angkop at karaniwang Tagalog para sa utos na ipako sa krus. Hindi nito ipinapasok ang dagdag na doktrinal na pagbasa. Ang talababa ay isang kapaki-pakinabang na leksikal na alternatibo at maayos ang pagkakaangkla nito sa dulo ng sinipi.
