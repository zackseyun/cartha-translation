  text: οἱ δὲ ἐπεφώνουν λέγοντες· ⸂Σταύρου σταύρου⸃ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/021.yaml
  text: But they kept shouting, saying, “Crucify, crucify him!”
translation:
  language: tl
  text: Ngunit patuloy silang sumisigaw, “Ipako siya sa krus! Ipako siya sa krus!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tahasan, “Ipatay siya sa krus! Ipatay siya sa krus!”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ngunit ... sila
  rationale: Ang οἱ ay tumutukoy sa mga taong binanggit sa konteksto, at ang δέ ay nagpapakita rito ng banayad na pagsalungat sa naunang sinabi.
- source_word: ἐπεφώνουν
  choice: patuloy silang sumisigaw
  rationale: Ipinahihiwatig ng imperfect ang nagpapatuloy o paulit-ulit na pagkilos, habang ang ἐπιφωνέω ay malakas na pagsigaw o pagtawag.
- source_word: λέγοντες
  choice: hindi isinalin nang hiwalay; tuwirang sinundan ng sinipi nilang sigaw
  rationale: Ipinakikilala ng participle ang nilalaman ng kanilang sigaw. Sa natural na modernong Tagalog, hindi kailangang idagdag ang ‘na sinasabi’ matapos ang ‘sumisigaw.’
- source_word: Σταύρου σταύρου
  choice: Ipako siya sa krus! Ipako siya sa krus!
  rationale: Ang σταυρόω ay utos na ipapatay sa pamamagitan ng pagpapako sa krus. Pinananatili ng pag-uulit ang diin at mapilit na sigaw ng karamihan.
- source_word: αὐτόν
  choice: siya
  rationale: Ito ang tuwirang layon ng utos. Inulit sa bawat sugnay para maging natural at malinaw sa Tagalog.
theological_decisions:
- issue: Pagpapahayag sa hinihinging parusang σταύρου
  choice: Ipako siya sa krus
  alternative: Ipatay siya sa krus
  rationale: Tiyak na tumutukoy ang pandiwa sa pagbitay sa krus. Ang ‘ipako siya sa krus’ ay malinaw at karaniwang salin, at hindi nagdaragdag ng teolohikal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na tuwirang sigaw sa halip na ang mabigat na ‘na sinasabi,’ habang pinananatili ang nagpapatuloy na aspekto at ang mariing pag-uulit.
