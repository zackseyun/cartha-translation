  text: ⸀Ἀνέκραγον δὲ παμπληθεὶ λέγοντες· Αἶρε τοῦτον, ἀπόλυσον δὲ ἡμῖν ⸀τὸν Βαραββᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/018.yaml
  text: But they all cried out together[a], saying, “Take this man away, and release Barabbas to us!”
translation:
  language: tl
  text: Ngunit sabay-sabay silang sumigaw, “Alisin mo ang taong ito[a], at palayain mo para sa amin si Barabas!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ilayo mo ang taong ito.” Maaari ring mas maikli ang salin sa pautos na Griyego, ngunit hinihingi nilang alisin siya sa kanilang harapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέκραγον
  choice: sumigaw
  rationale: Ipinapahayag ng pandiwa ang malakas na sama-samang pagsigaw; natural at tuwiran ang “sumigaw” sa makabagong Tagalog.
- source_word: δὲ
  choice: Ngunit
  rationale: Minamarkahan dito ng δέ ang pagsalungat sa naunang pahayag o pangyayari.
- source_word: παμπληθεὶ
  choice: sabay-sabay silang
  rationale: Ipinapakita nito na ang buong pangkat ay kumilos nang magkakasama, nang hindi dinaragdagan ng mas interpretatibong ideya na eksaktong iisa ang kanilang tinig.
- source_word: λέγοντες
  choice: —
  rationale: Hindi na isinalin nang hiwalay ang participle na “nagsasabi” sapagkat natural na ipinakikilala ng tuwirang sipi pagkatapos ng “sumigaw” ang nilalaman ng sigaw.
- source_word: Αἶρε
  choice: Alisin mo
  rationale: Sa kontekstong ito, ang pautos ay humihiling na ilayo o ipatanggal si Jesus; pinananatili ng “Alisin mo” ang lakas at kaigtingan ng utos nang hindi tahasang idinaragdag ang paraan o hantungan.
- source_word: τοῦτον
  choice: ang taong ito
  rationale: Pinananatili nito ang panturong lakas ng demonstrative at natural kaysa sa literal na “ang isang ito.”
- source_word: ἀπόλυσον
  choice: palayain mo
  rationale: Ang pandiwa ay nangangahulugang pakawalan mula sa pagkakapiit o kustodiya; malinaw at natural ang “palayain” sa kontekstong panghukuman.
- source_word: ἡμῖν
  choice: para sa amin
  rationale: Ipinahahayag ng datibo ang mga makikinabang sa hinihinging pagpapalaya; mas natural dito sa Tagalog ang “para sa amin” kaysa “sa amin.”
- source_word: τὸν Βαραββᾶν
  choice: si Barabas
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang Barabbas at ang pantukoy na “si” para sa personal na pangalan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang “sabay-sabay” para sa kolektibong sigaw, at pinanatiling maigting ngunit hindi labis na interpretatibo ang “Alisin mo.”
