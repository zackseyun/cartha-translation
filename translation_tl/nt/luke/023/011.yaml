id: LUK.23.11
reference: Luke 23:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐξουθενήσας δὲ αὐτὸν ⸀καὶ ὁ Ἡρῴδης σὺν τοῖς στρατεύμασιν αὐτοῦ καὶ ἐμπαίξας ⸀περιβαλὼν ἐσθῆτα λαμπρὰν ἀνέπεμψεν αὐτὸν τῷ Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/011.yaml
  text: But Herod also[a], together with his soldiers, treated him with contempt and mocked him. Dressing him in splendid clothing, he sent him back to Pilate.
translation:
  language: tl
  text: Ngunit hinamak at nilibak din siya ni Herodes kasama ang kanyang mga kawal. Sinuotan siya ni Herodes ng maringal na kasuotan[a] at ipinabalik kay Pilato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang maringal na balabal.” Ang λαμπράν ay maaari ring mangahulugang “maningning.” Malamang na ginamit ang kasuotan bilang bahagi ng panlilibak ni Herodes upang magmukhang binibigyan si Jesus ng huwad na parangal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουθενήσας
  choice: hinamak
  rationale: Ipinahahayag ng “hinamak” na itinuring si Jesus na walang halaga at nilapastangan; natural at marangal din itong pakinggan sa salaysay.
- source_word: σὺν τοῖς στρατεύμασιν αὐτοῦ
  choice: kasama ang kanyang mga kawal
  rationale: Ang “mga kawal” ay malinaw at likas na katumbas ng mga tauhang militar ni Herodes sa kontekstong ito.
- source_word: ἐμπαίξας
  choice: nilibak
  rationale: Tumpak na ipinahahayag ng “nilibak” ang hayagang panunuya at pangungutya nang hindi nagiging masyadong kolokyal.
- source_word: περιβαλὼν
  choice: sinuotan
  rationale: Natural na Filipino ang “sinuotan” para sa paglalagay ng kasuotan sa isang tao at pinananatili nitong si Herodes ang gramatikal na gumagawa ng kilos.
- source_word: ἐσθῆτα λαμπρὰν
  choice: maringal na kasuotan
  rationale: Sinasaklaw ng “kasuotan” ang damit nang hindi labis na tinutukoy na isang partikular na uri ng balabal, habang ang “maringal” ay nagpapanatili sa kahulugang splendid at sa mapanlibak na anyo ng huwad na pagpaparangal.
- source_word: ἀνέπεμψεν
  choice: ipinabalik
  rationale: Malinaw na ipinahahayag nito na ibinalik si Jesus sa naunang awtoridad sa prosesong panghukuman.
- source_word: τῷ Πιλάτῳ
  choice: kay Pilato
  rationale: Karaniwang anyong Filipino ng pangalang pantangi at angkop ang “kay” para sa taong pinadalhan.
theological_decisions:
- issue: Kahulugan ng maringal na kasuotan sa panlilibak ni Herodes
  choice: Panatilihin ang kasuotan bilang maringal nang hindi tahasang tinatawag na kasuotang maharlika.
  alternative: Tukuyin ito bilang balabal ng hari o bilang tanda ng kabaliwan o kahangalan.
  rationale: Malinaw sa talata na bahagi ito ng paghamak at panlilibak, ngunit sinasabi lamang ng Griyego na ang kasuotan ay maliwanag o maringal. Hindi dapat magdagdag ang pangunahing teksto ng isang tiyak na simbolikong interpretasyon.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “kawal” at “nilibak” upang mapanatili ang seryosong himig ng salaysay ng paghihirap ni Jesus. Inulit ang “ni Herodes” sa ikalawang pangungusap para luminaw ang gumagawa ng kilos at maiwasan ang maling pagbasa na mga kawal lamang ang nagsuot sa kanya.
