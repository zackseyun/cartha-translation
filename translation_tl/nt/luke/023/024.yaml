  source_fidelity: Ang pangunahing diwa ng ἐπέκρινεν γενέσθαι τὸ αἴτημα αὐτῶν ay tumpak na naihahatid ng “nagpasiya si Pilato na pagbigyan ang kanilang hinihingi.” Gayunman, ang καὶ ay payak na pang-ugnay na “At”; ang “Kaya” ay nagdaragdag ng diwang bunga o konklusyon na hindi tahasang ipinapahayag ng Griyego.
  naturalness: Natural at malinaw sa modernong Filipino Tagalog ang “At nagpasiya si Pilato na pagbigyan ang kanilang hinihingi.” Ang ayos ay angkop sa marangal na salaysay.
  terminology: Ang “Pilato,” “nagpasiya,” at “hinihingi” ay wasto at madaling unawain. Sa talababa, ang “isagawa ang kanilang kahilingan” ay maaaring magmungkahi na si Pilato mismo ang magsasagawa; mas malinaw ang “ipagkaloob ang kanilang kahilingan,” na pinananatili ang pormal na hudisyal na himig.
