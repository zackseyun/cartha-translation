review_pass:
  verdict: revise
  source_fidelity: 'Ang diwa ay tapat sa Griyego: kinikilala ng nagsasalita na nararapat ang kanilang dinaranas at ipinahahayag niyang walang maling ginawa ang taong ito. Gayunman, ang “makatarungan lamang ang parusa sa atin” ay medyo maluwag at ang “lamang” ay maaaring magpahina o magpalabo sa diin ng δικαίως. Mas malinaw na ipahayag ang ipinahiwatig na pagdurusa/parusa bilang “makatarungang pinarurusahan.”'
  naturalness: Natural ang pangkalahatang Tagalog, ngunit mas tuwiran at marangal sa modernong Filipino ang “tayo naman ay makatarungang pinarurusahan.” Iwas din ito sa bahagyang matigas na nominal na ayos na “makatarungan lamang ang parusa sa atin.”
  terminology: Ang “nararapat,” “mga ginawa natin,” at “walang ginawang masama” ay angkop at malinaw. Ang “walang ginawang hindi nararapat” ay katanggap-tanggap na leksikal na alternatibo para sa ἄτοπον; dapat manatili ang talababa sa dulo ng katumbas na pahayag.
