  text: καὶ ἡμεῖς μὲν δικαίως, ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν· οὗτος δὲ οὐδὲν ἄτοπον ἔπραξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/041.yaml
  text: And we indeed justly[a], for we are receiving what our deeds deserve[b]; but this man has done nothing wrong.
translation:
  language: tl
  text: At tayo naman ay makatarungang pinarurusahan, sapagkat tinatanggap natin ang nararapat dahil sa mga ginawa natin; ngunit ang taong ito ay walang ginawang masama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “walang ginawang hindi nararapat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαίως
  choice: makatarungan lamang ang parusa sa atin
  rationale: Ipinahihiwatig ng pang-abay na ang kasalukuyan nilang kaparusahan ay ayon sa katarungan at karapat-dapat. Nilinaw ang ipinagpalagay na diwa ng parusa upang maging natural sa Tagalog.
- source_word: ἄξια γὰρ ὧν ἐπράξαμεν
  choice: sapagkat tinatanggap natin ang nararapat sa mga ginawa natin
  rationale: Pinananatili nito ang ugnayan ng kanilang ginawa at ng katumbas na kaparusahan nang hindi pinaiikli ang sugnay bilang abstraktong 'mga gawa.'
- source_word: ἀπολαμβάνομεν
  choice: tinatanggap natin
  rationale: Ang aspektong imperpektibo ng Tagalog ay angkop sa kasalukuyan at nagpapatuloy nilang pagtanggap ng bunga ng kanilang ginawa.
- source_word: οὗτος
  choice: ang taong ito
  rationale: Pinananatili ang demonstratibong diin at likas itong tumutukoy kay Jesus sa konteksto.
- source_word: οὐδὲν ἄτοπον
  choice: walang ginawang masama
  rationale: Natural at malinaw itong pahayag ng kawalang-sala sa modernong Tagalog, habang hindi ito nililimitahan sa teknikal na kahulugang kriminal lamang.
- source_word: ἔπραξεν
  choice: ginawang
  rationale: Ipinapahayag ang natapos na pagkilos sa payak at natural na paraang Tagalog.
theological_decisions:
- issue: Ang pahayag ng kriminal tungkol sa kawalang-sala ni Jesus
  choice: ngunit ang taong ito ay walang ginawang masama
  alternative: ngunit ang taong ito ay walang ginawang hindi nararapat
  rationale: Tuwirang pinananatili ang patotoo sa kawalang-sala ni Jesus sa agarang kontekstong hudisyal, nang hindi nagdaragdag ng mas malawak na doktrinal na pahayag na hindi tahasang sinasabi rito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang 'makatarungan lamang ang parusa sa atin' upang likas na maipahayag ang eliptikong Griyego; inilagay ang tanging talababa sa alternatibong saklaw ng ἄτοπον.
