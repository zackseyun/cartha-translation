  text: The soldiers also mocked him[a], coming up and offering him sour wine,
translation:
  language: tl
  text: Tinuya rin siya ng mga kawal. Lumapit sila at inalok siya ng maasim na alak,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “suka.” Ang salitang Griyego ay tumutukoy sa maasim na alak, isang karaniwang murang inumin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: nilait
  rationale: Ipinahahayag ng pandiwa ang mapanlait at mapanghamak na panunuya; natural at marangal sa modernong Filipino ang “nilait.”
- source_word: δὲ … καὶ
  choice: din
  rationale: Magkasamang ipinakikita ng mga katagang ito na ang mga kawal ay kabilang din sa mga lumalait kay Jesus, habang ipinagpapatuloy ang salaysay.
- source_word: οἱ στρατιῶται
  choice: mga kawal
  rationale: Tuwirang tumutukoy sa mga sundalong nasa tagpo ng pagbitay; malinaw at dignipikadong katumbas ang “mga kawal.”
- source_word: προσερχόμενοι
  choice: Lumapit sila
  rationale: Ginawang hiwalay na sugnay ang participle upang maging natural at madaling maunawaan sa Filipino habang pinananatili ang pagkilos nila patungo kay Jesus.
- source_word: ὄξος
  choice: maasim na alak
  rationale: Ang salita ay tumutukoy sa maasim at murang inuming alak, hindi lamang sa suka bilang panimpla; mas malinaw sa modernong mambabasa ang “maasim na alak.”
- source_word: προσφέροντες αὐτῷ
  choice: inalok siya
  rationale: Ipinahahayag nito ang pag-aabot o paghahain ng inumin sa kaniya. Ang “inalok siya” ay natural at hindi nagdaragdag ng tiyak na motibo.
theological_decisions:
- issue: Layunin ng pag-aalok ng ὄξος ng mga kawal
  choice: Inilahad nang payak ang pag-aalok sa loob ng tagpo ng panlalait, nang hindi tahasang tinukoy ang motibo.
  alternative: Ipaliwanag ito bilang habag, o bilang isang kilos na sadyang ginawa lamang upang higit siyang tuyain.
  rationale: Iniuugnay ng konteksto ang kilos sa panlalait, ngunit hindi tahasang ipinaliliwanag ng talata ang sikolohikal na motibo ng mga kawal. Kaya pinananatili ng salin ang tensiyon at hinahayaang ang konteksto ang magbigay ng tono.
translation_notes:
  register: Modernong Filipino na malinaw, natural, at dignipikado. Ginamit ang “kawal” para sa maikling salaysay at “maasim na alak” upang maiwasan ang makabagong pagkaunawa sa suka bilang panimpla lamang.
