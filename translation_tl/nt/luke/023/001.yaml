id: LUK.23.1
reference: Luke 23:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἀναστὰν ἅπαν τὸ πλῆθος αὐτῶν ἤγαγον αὐτὸν ἐπὶ τὸν Πιλᾶτον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/001.yaml
  text: And the whole assembly of them rose and led him to Pilate[a].
translation:
  language: tl
  text: At tumindig ang buong kapulungan nila at dinala siya kay Pilato.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang buong karamihan nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Karaniwang pang-ugnay ito sa pagpapatuloy ng salaysay at hindi nagdaragdag ng higit na interpretibong diin.
- source_word: ἀναστὰν
  choice: tumindig
  rationale: Inilalarawan ng aorist participle ang kilos na nauna sa pangunahing pandiwa; natural sa Tagalog ang sunod na 'tumindig ... at dinala.'
- source_word: ἅπαν τὸ πλῆθος αὐτῶν
  choice: ang buong kapulungan nila
  rationale: Pinananatili ng 'buong' ang kabuuang diin ng ἅπαν, samantalang ipinapahayag ng 'kapulungan' ang natipong pangkat sa kontekstong ito nang hindi ito ginagawang mas tiyak na opisyal na institusyon kaysa sa Griyego.
- source_word: ἤγαγον
  choice: dinala
  rationale: Ang ἄγω ay maaaring mangahulugang akayin o dalhin. Mas natural dito ang 'dinala' para sa pagdadala kay Jesus, na nasa kanilang kustodiya, patungo kay Pilato.
- source_word: αὐτὸν
  choice: siya
  rationale: Tuwirang layon na tumutukoy kay Jesus; malinaw ang karaniwang panghalip sa Tagalog.
- source_word: ἐπὶ τὸν Πιλᾶτον
  choice: kay Pilato
  rationale: Sa kasunod ng pandiwa ng pagkilos, ipinahihiwatig ng ἐπί na patungo sila sa isang tao. Ang 'kay Pilato' ang tuwiran at natural na katumbas.
- source_word: Πιλᾶτον
  choice: Pilato
  rationale: Ginagamit ang nakaugaliang anyong Tagalog ng personal na pangalang Pilate.
theological_decisions:
- issue: Paglalarawan sa sama-samang simuno sa kontekstong panghukuman
  choice: ang buong kapulungan nila
  alternative: ang buong karamihan nila
  rationale: Ipinapakita ng talata ang natipong pangkat na katatapos lamang ng paglilitis kay Jesus. Ang 'kapulungan' ay hindi nagpapahiwatig ng basta di-organisadong madla, ngunit hindi rin labis na tumutukoy sa isang partikular na institusyon. Inilalagay sa talababa ang tunay na alternatibong leksikal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang maikling daloy ng salaysay at ang bahagyang kalabuan ng πλῆθος sa pagitan ng isang kapulungan at isang karamihan.
