  source_fidelity: 'Tumpak ang pagsasalin ng daloy ng Griyego: ang buong pangkat ay tumindig at dinala si Jesus kay Pilato. Ang “kay Pilato” ay natural na katumbas ng kilos patungo sa isang tao, at hindi nito labis na ipinapasok ang diwa ng pormal na pagharap sa hukuman.'
