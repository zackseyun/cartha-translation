  text: καὶ ⸀ὁ ἕτερος ἦλθεν λέγων· Κύριε, ἰδοὺ ἡ μνᾶ σου ἣν εἶχον ἀποκειμένην ἐν σουδαρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/020.yaml
  text: And the other came[a], saying, ‘Lord, look, here is your mina, which I kept laid away in a cloth.’
translation:
  language: tl
  text: Dumating naman ang isa pa at nagsabi, “Panginoon, narito po ang mina ninyo, na iningatan kong nakatabi sa isang pirasong tela.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “panyo.” Ang Griyegong σουδάριον ay tumutukoy sa isang tela na karaniwang ginagamit na pamunas sa mukha o pawis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕτερος
  choice: ang isa pa
  rationale: Tumutukoy ito sa isa pang alipin na inihahambing sa mga naunang lumapit; natural sa modernong Tagalog ang “ang isa pa” nang hindi nagpapasok ng dagdag na detalye.
- source_word: ἦλθεν λέγων
  choice: Dumating ... at nagsabi
  rationale: Natural na inilalahad sa Tagalog ang pandiwang may kasamang participle bilang magkasunod na kilos, habang pinananatili ang ayos ng salaysay.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang karaniwang salin ng κύριος at ang posibleng mas malawak na alingawngaw ng talinghaga, bagaman ang tuwirang kausap sa salaysay ay ang among maharlika.
- source_word: ἰδοὺ
  choice: narito po
  rationale: Ipinahahayag nito kapwa ang pagtawag ng pansin at ang pagharap ng mina; ang “po” ay likas na paggalang sa kausap sa kontekstong ito.
- source_word: ἡ μνᾶ σου
  choice: ang mina ninyo
  rationale: Ang “mina” ay tumpak na transliterasyon ng sinaunang yunit ng salapi at umiiwas sa mapanlinlang na makabagong katumbas; ang “ninyo” ay magalang na pang-isahang pagtukoy sa kausap.
- source_word: ἣν εἶχον ἀποκειμένην
  choice: na itinabi ko
  rationale: Malinaw at natural itong nagpapahayag na pinanatiling nakatabi ang mina. Hindi nito ipinahihiwatig na ginamit o ipinuhunan ang salapi.
- source_word: ἐν σουδαρίῳ
  choice: sa isang tela
  rationale: Ang σουδάριον ay isang maliit na telang pamunas, ngunit ang “tela” ay hindi labis na tiyak; inilalagay sa talababa ang mas espesipikong “panyo.”
theological_decisions:
- issue: Pag salin sa κύριος bilang tuwirang tawag sa loob ng talinghaga
  choice: Panginoon
  alternative: Amo
  rationale: Bagaman ang tinutukoy sa agarang konteksto ay ang amo sa talinghaga, pinananatili ng “Panginoon” ang karaniwang katumbas ng κύριος at hindi isinasara ang posibleng teolohikal na alingawngaw ng salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at madaling maunawaan. Ginamit ang “po” at “ninyo” upang maging likas ang pananalita ng alipin sa kanyang panginoon, nang hindi ginagawang maringal o lipas ang himig.
