base_translation:
  language: en
  yaml_path: translation/nt/luke/019/029.yaml
  text: And it happened that[a], as he came near to Bethphage and Bethany, toward the mount called Olives, he sent two of the disciples
translation:
  language: tl
  text: At nangyari, nang malapit na siya sa Betfage at Betania, sa may bundok na tinatawag na Bundok ng mga Olibo, nagsugo siya ng dalawa sa mga alagad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: At nangyari
  rationale: Pinananatili ang karaniwang pormulang pasalaysay ni Lucas sa isang malinaw at hindi makalumang anyong Tagalog.
- source_word: ὡς
  choice: habang
  rationale: Temporal ang gamit at ipinahihiwatig na nagaganap pa ang paglapit; mas malinaw ito kaysa sa simpleng “nang” para sa aspektong progresibo.
- source_word: ἤγγισεν
  choice: papalapit siya
  rationale: Likas na modernong Tagalog para sa pagdating nang malapit sa isang lugar, at ang panghalip ay tumutukoy kay Jesus ayon sa konteksto.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: sa Betfage at Betania
  rationale: Ang “sa” ang natural na panandang Filipino para sa direksiyon o paglapit sa mga pook; isinalin sa baybay-Filipino ang mga pangalan.
- source_word: πρὸς τὸ ὄρος
  choice: patungo sa bundok
  rationale: Pinananatili ang diwa ng direksiyon ng πρός at ginagamit ang karaniwang salitang “bundok.”
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: na tinatawag na Bundok ng mga Olibo
  rationale: Bagaman literal na masiksik ang Griyegong “tinatawag na ng mga Olibo,” kailangan sa natural na Tagalog ang pag-uulit ng “Bundok” upang malinaw na pangalan ito; hindi nito binabago ang tinutukoy na lugar.
- source_word: ἀπέστειλεν
  choice: nagsugo siya
  rationale: Ang “nagsugo” ay natural at angkop sa sadyang pagpapadala ng mga alagad para sa isang gawain.
- source_word: δύο τῶν μαθητῶν
  choice: dalawa sa mga alagad
  rationale: Tapat sa partitive genitive at hindi idinaragdag ang “kaniyang,” na hindi tahasang nasa Griyego.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at pasalaysay. Iniwasan ang makalumang “At nangyari nga” o “nang malapit na siya,” at hindi idinagdag ang “kaniyang” bago ang “mga alagad.”
