  text: καὶ οὐχ ⸀εὕρισκον τὸ τί ποιήσωσιν, ὁ λαὸς γὰρ ἅπας ἐξεκρέματο αὐτοῦ ἀκούων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/048.yaml
  text: And they could not find what they might do[a], because all the people were hanging on his words as they listened.
translation:
  language: tl
  text: At wala silang makitang magagawa, sapagkat ang buong bayan ay sabik na nakikinig sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “ang buong bayan ay nakabitin sa kanya habang nakikinig.” Ipinahahayag ng idyomang Griyego ang matindi at sabik na pagbibigay-pansin kay Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὕρισκον
  choice: wala silang makitang
  rationale: Ipinahihiwatig ng negatibong imperfect ang patuloy nilang kabiguang makahanap ng maaaring gawin; natural itong naipapahayag sa Filipino bilang “wala silang makitang.”
- source_word: τὸ τί ποιήσωσιν
  choice: magagawa
  rationale: Ipinahahayag ng τί kasama ng aorist subjunctive ang pinag-iisipang hakbang o maaaring gawin. Sa pariralang “wala silang makitang magagawa,” nananatili ang diwang naghahanap sila ng posibleng paraan ng pagkilos.
- source_word: ὁ λαὸς γὰρ ἅπας
  choice: sapagkat ang buong bayan
  rationale: Ang γάρ ay nagbibigay ng dahilan, kaya ginamit ang “sapagkat.” Ang λαός ay “bayan” o “mga tao” sa kontekstong ito, at ang ἅπας ay ipinahayag ng “buong.”
- source_word: ἐξεκρέματο αὐτοῦ
  choice: sabik na nakikinig sa kanya
  rationale: Ang pandiwa ay literal na naglalarawan ng pagkapit o pagkabitin sa isang tao, ngunit idiomatikong tumutukoy rito sa matindi at sabik na pagbibigay-pansin. Iniiwasan ng saling ito ang di-likas na literal na larawan sa pangunahing teksto habang hindi nagdaragdag ng tahasang “mga salita,” na wala sa Griyego.
- source_word: ἀκούων
  choice: nakikinig
  rationale: Ang present participle ay nagsasaad ng kasabay na kilos at paraan ng kanilang masidhing pagbibigay-pansin kay Jesus.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buong bayan” para sa kolektibong λαός at ang natural na “sabik na nakikinig sa kanya” para sa Griyegong idyoma, habang inilagay sa talababa ang mas literal na larawan.
