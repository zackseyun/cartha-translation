reference: Luke 19:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· ⸀Εὖγε, ἀγαθὲ δοῦλε, ὅτι ἐν ἐλαχίστῳ πιστὸς ἐγένου, ἴσθι ἐξουσίαν ἔχων ἐπάνω δέκα πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/017.yaml
  text: And he said to him[a], “Well done, good servant; because you were faithful in a very small matter, have authority over ten cities.”
translation:
  language: tl
  text: At sinabi niya sa kanya, “Mahusay, mabuting lingkod![a] Dahil naging tapat ka sa napakaliit na bagay, mamahala ka sa sampung lungsod.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “alipin.” Ang salitang Griyego na doulos ay maaaring mangahulugang “lingkod” o “alipin,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὖγε
  choice: Mahusay
  rationale: Likas na pahayag ng pagsang-ayon at papuri sa modernong Filipino; malinaw nitong ipinahihiwatig ang ‘well done’ nang hindi nagdaragdag ng diwa.
- source_word: ἀγαθὲ
  choice: mabuting
  rationale: Tuwirang katumbas ng pang-uring ἀγαθός sa tahasang pagtawag sa lingkod.
- source_word: δοῦλε
  choice: lingkod
  rationale: Sa konteksto ng talinghaga, natural na ipinakikita ng ‘lingkod’ ang ugnayan ng panginoon at nasasakupan. Nananatili sa talababa ang mas mariing alternatibong ‘alipin.’
- source_word: ἐν ἐλαχίστῳ
  choice: sa napakaliit na bagay
  rationale: Ipinahahayag ang pagiging tapat sa isang bagay na lubhang maliit, at natural itong basahin sa kasalukuyang Filipino.
- source_word: πιστὸς ἐγένου
  choice: naging tapat ka
  rationale: Malapit sa anyo at diwa ng Griyegong ἐγένου kasama ng πιστός, nang hindi idinaragdag ang mas interpretatibong ‘pinatunayan mong tapat ka.’
- source_word: ἴσθι ἐξουσίαν ἔχων
  choice: mamahala ka
  rationale: Natural na utos sa Filipino na ipinapahayag ang pagkakaloob at paggamit ng awtoridad sa mga lungsod; iniiwasan ang matigas na literal na ‘magkaroon ka ng awtoridad.’
- source_word: ἐπάνω δέκα πόλεων
  choice: sa sampung lungsod
  rationale: Sa pandiwang ‘mamahala,’ ang ‘sa’ ang natural na panandang Filipino para sa saklaw ng pamamahala; πόλεις ay ‘mga lungsod.’
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλος sa talinghaga tungkol sa panginoon at kanyang nasasakupan
  choice: lingkod
  alternative: alipin
  rationale: Ang ‘lingkod’ ay natural at marangal sa Filipino habang pinananatili ang malinaw na pagpapasakop sa panginoon. Gayunman, maaaring tukuyin ng δοῦλος ang isang alipin, kaya inilagay ang alternatibo sa talababa sa halip na burahin ang leksikal na tensiyon.
- issue: Diwa ng ipinagkaloob na ἐξουσία
  choice: mamahala ka
  alternative: magkaroon ka ng awtoridad
  rationale: Sa kontekstong ‘sa sampung lungsod,’ ang awtoridad ay kongkretong pamamahala. Ang salin ay hindi nagpapasya kung gaano kalawak o anong uri ng sistemang pampamahalaan ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang ‘lungsod’ sa halip na ‘bayan’ upang panatilihin ang karaniwang kahulugan ng πόλις, at ‘mamahala ka’ upang maging idiomatiko ang utos na magkaroon ng awtoridad.
