    rationale: Ang αἴρω sa kontekstong ito ay pag-aalis o pagkakait. Ang “aalisin sa kanya” ay malinaw na pasibo at idiomatiko sa Filipino.
  revised_text: 'Sinasabi ko sa inyo: Ang bawat isa na mayroon ay bibigyan[a]; ngunit sa taong wala, pati ang mayroon niya ay aalisin sa kanya.'
