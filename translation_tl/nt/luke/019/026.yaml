    issue: Hindi likas ang “Ang bawat mayroon” at “ang mayroon siya.”
    rationale: Bagaman mauunawaan, hindi ito karaniwang ayos sa modernong Filipino. Ang “bawat isa na mayroon” at “mayroon niya” ay mas natural habang pinananatili ang generic na saklaw at ang intensibong “kahit/pati.”
  - severity: low
