  verdict: revise
  source_fidelity: Tumpak ang pangunahing diwa at ang hinaharap na tinig-pasibo ng dalawang pandiwa. Gayunman, ang “Ang bawat mayroon” at lalo na ang “kahit ang mayroon siya” ay hindi gaanong likas at maaaring magpahina sa malinaw ngunit sadyang kabalintunaang pahayag ng Griyego.
  naturalness: Mas natural sa makabagong Filipino ang “Ang bawat isa na mayroon” at “pati ang mayroon niya.” Ang “ngunit ang wala” ay maaaring panatilihin bilang maikling kawikaan, ngunit ang “ngunit sa taong wala” ay mas malinaw na tumutugma sa ἀπὸ τοῦ μὴ ἔχοντος.
  terminology: Walang problemang teolohikal o pangngalang pantangi. Ang “aalisin sa kanya” ay likas na katumbas ng ἀρθήσεται at pinananatili ang diwa ng pag-aalis/pagkakait nang hindi nagdaragdag ng pagpapakahulugan.
  issues:
