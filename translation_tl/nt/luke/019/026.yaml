  text: ⸀λέγω ὑμῖν ὅτι παντὶ τῷ ἔχοντι δοθήσεται, ἀπὸ δὲ τοῦ μὴ ἔχοντος καὶ ὃ ἔχει ⸀ἀρθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/026.yaml
  text: I tell you that to everyone who has[a], more will be given; but from the one who does not have, even what he has will be taken away.
translation:
  language: tl
  text: 'Sinasabi ko sa inyo: Ang bawat isa na mayroon ay bibigyan[a]; ngunit sa taong wala, pati ang mayroon niya ay aalisin sa kanya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bibigyan pa.” Walang tahasang salitang “pa” sa Griyego, bagaman ipinahihiwatig ng konteksto ang pagdami.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Sinasabi ko sa inyo
  rationale: Likas at tuwirang panimula sa makabagong Tagalog na pinananatili ang kasalukuyang anyo at mariing pahayag ni Jesus.
- source_word: παντὶ τῷ ἔχοντι
  choice: Ang bawat mayroon
  rationale: Ang articular participle ay tumutukoy sa sinumang mayroon; maikli at natural ang generic na pahayag sa Tagalog.
- source_word: δοθήσεται
  choice: ay bibigyan
  rationale: Tuwirang pinananatili ang future passive ng Griyego nang hindi idinaragdag sa pangunahing teksto ang hindi hayagang salitang 'higit pa.'
- source_word: ἀπὸ δὲ τοῦ μὴ ἔχοντος
  choice: ngunit ang wala
  rationale: Ipinahahayag ng 'ngunit' ang salungat na δέ, at natural na inilalarawan ng 'ang wala' ang generic na taong hindi mayroon.
- source_word: καὶ ὃ ἔχει
  choice: kahit ang mayroon siya
  rationale: Ang καί ay may mariing diwang 'kahit' dito; pinananatili rin ang tila kabalintunaang pagkakaroon ng taong tinawag na 'wala.'
- source_word: ἀρθήσεται
  choice: ay kukunin sa kanya
  rationale: Malinaw na ipinahahayag ang future passive na pagkakait o pag-aalis, at likas sa Tagalog ang pagbanggit sa taong pagkukunan.
theological_decisions:
- issue: Saklaw ng kasabihan tungkol sa pagkakaroon, pagbibigay, at pagkawala
  choice: Isinalin bilang maikli at pangkalahatang simulain, nang walang idinagdag na paliwanag tungkol sa kaligtasan, merito, predestinasyon, o tiyak na uri ng pag-aari.
  alternative: Tahasang tukuyin ito bilang simulain tungkol sa pagiging katiwala sa talinghaga o bilang pangkalahatang simulain ng kaharian.
  rationale: Hindi tinutukoy ng mismong talata ang sistematikong teolohikal na mekanismo; dapat manatili sa konteksto ang pagpapakahulugan.
- issue: Ipinahihiwatig na pagdami sa δοθήσεται
  choice: Pinanatili sa pangunahing teksto ang literal na 'bibigyan,' at inilagay sa talababa ang posibleng 'bibigyan pa.'
  alternative: Isalin sa pangunahing teksto bilang 'bibigyan pa.'
  rationale: Walang tahasang katumbas ng 'pa' o 'higit' sa Griyego, bagaman malinaw na maaaring ipahiwatig ng konteksto ang pagdami. Pinananatili nito ang tunay na leksikal na puwang nang hindi ikinukubli ang karaniwang pagkaunawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maikling anyong kawikaan upang mapanatili ang tindi at pagkakabalanse ng dalawang sugnay.
