id: LUK.19.10
reference: Luke 19:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ζητῆσαι καὶ σῶσαι τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/010.yaml
  text: For the Son of Man came to seek and to save the lost[a].
translation:
  language: tl
  text: Sapagkat naparito ang Anak ng Tao upang hanapin at iligtas ang nawala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang bagay na nawala.” Isahan at walang kasariang pambalarila ang pananalitang Griyego at maaari itong unawain sa pangkalahatang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: naparito
  rationale: Ang aorist na ἦλθεν ay nagsasaad ng pagparito sa payak na anyong naganap. Natural sa Filipino ang “naparito” sa pahayag tungkol sa layunin ng misyon at hindi ito nagdaragdag ng aspektong wala sa Griyego.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag o dahilan kaugnay ng naunang pahayag. Malinaw at marangal na panumbas ang “Sapagkat.”
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili nito ang kinikilalang sariling katawagan ni Jesus at ang mga alusyong teolohikal nito, nang hindi ito ipinapaliwanag o pinapakitid.
- source_word: ζητῆσαι
  choice: upang hanapin
  rationale: Ang aorist infinitive ay nagpapahayag ng layunin kasunod ng ἦλθεν; likas na ipinahahayag ito sa Filipino sa pamamagitan ng “upang.”
- source_word: σῶσαι
  choice: iligtas
  rationale: Saklaw ng “iligtas” ang malawak na diwa ng σῴζω sa Lucas, kabilang ang kaligtasang binanggit sa agarang konteksto ng 19:9.
- source_word: τὸ ἀπολωλός
  choice: ang nawala
  rationale: Ang articular perfect participle ay neuter singular at maaaring gamitin sa pangkalahatan o kolektibong diwa. Pinananatili ng “ang nawala” ang anyong isahan at ang kalagayan ng pagiging nawala, habang hindi nililimitahan ang tinutukoy sa iisang lalaking tao.
theological_decisions:
- issue: Saklaw at diwa ng τὸ ἀπολωλός
  choice: ang nawala
  alternative: ang mga naligaw / ang taong nawala / yaong nawala
  rationale: Maaaring tumukoy ang neuter singular na Griyego sa isang pangkalahatan o kolektibong kategorya. Ang “ang nawala” ay maaaring umugnay kay Zaqueo sa agarang konteksto at kasabay nito'y magpahayag ng mas malawak na layunin ni Jesus, nang hindi tahasang nilulutas ang ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang tradisyonal at teolohikal na katawagang “Anak ng Tao,” habang ginamit ang natural na balangkas na “naparito … upang.”
