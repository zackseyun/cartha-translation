- from: Kaya dali-dali siyang bumaba at masayang tinanggap si Jesus.[a]
  to: At nagmamadali siyang bumaba at masayang tinanggap si Jesus.[a]
  rationale: Pinalitan ang “Kaya” ng “At” upang panatilihin ang payak na koordinasyon ng καί. Ginawang “nagmamadali” ang “dali-dali” bilang mas likas na pandiwaring Tagalog para sa participial na σπεύσας, nang hindi binabago ang kahulugan. Pinanatili ang tahasang “si Jesus” para sa kalinawan.
