  text: And he hurried down and welcomed him joyfully[a].
translation:
  language: tl
  text: At nagmamadali siyang bumaba at masayang tinanggap si Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At nagmadali siyang bumaba at tinanggap niya si Jesus nang may kagalakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπεύσας
  choice: dali-dali
  rationale: Ipinahahayag ng aorist participle ang agarang pagkilos at pananabik; natural sa modernong Tagalog ang “dali-dali” sa ganitong salaysay.
- source_word: κατέβη
  choice: bumaba
  rationale: Tuwirang pinananatili ang direksiyon ng pandiwa nang hindi nagiging mabigat ang pangungusap.
- source_word: ὑπεδέξατο
  choice: tinanggap
  rationale: Maaaring mangahulugan ang middle form na tanggapin o malugod na patuluyin ang isang panauhin. Ang “tinanggap” ay malinaw at natural, habang ipinahihiwatig ng konteksto ang magiliw na pagtanggap.
- source_word: αὐτόν
  choice: si Jesus
  rationale: Ginawang tahasan ang tinutukoy ng panghalip upang maging malinaw at natural sa Tagalog; si Jesus ang antecedent sa naunang talata.
- source_word: χαίρων
  choice: masayang
  rationale: Inilalarawan ng present participle ang kagalakang kasabay ng pagtanggap; natural itong ipinahahayag bilang pang-abay na “masayang.”
- source_word: καὶ ... καὶ
  choice: Kaya ... at
  rationale: Ang unang καί ay likas na naipapahayag bilang “Kaya” dahil tugon ang kilos sa utos ni Jesus sa naunang talata; ang ikalawa ay simpleng nag-uugnay sa sunod na kilos.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “dali-dali” para sa agarang pagkilos at “masayang tinanggap” para sa χαίρων at ὑπεδέξατο. Inilagay ang pangalang “Jesus” sa halip na dalawang magkasunod na panghalip upang maiwasan ang kalabuan sa Tagalog.
