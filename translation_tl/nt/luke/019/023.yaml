  - severity: low
    issue: Walang talababa para sa "sa bangko."
    rationale: Ang τράπεζα ay literal na "mesa" at sa kontekstong ito ay mesa o tanggapan ng tagapagpalit ng salapi/bangko. Ang talababa ay nagpapanatili ng audit trail nang hindi ginagawang di-natural ang pangunahing salin.
