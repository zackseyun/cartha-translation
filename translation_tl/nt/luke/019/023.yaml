base_translation:
  language: en
  yaml_path: translation/nt/luke/019/023.yaml
  text: And why did you not put my money in the bank? Then when I came[a], I would have collected it with interest.
translation:
  language: tl
  text: At bakit hindi mo idineposito sa bangko[a] ang pera ko? Pagdating ko, sana'y nasingil ko ito nang may tubo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ipinagkatiwala ang pera ko sa mga tagapagpalit ng salapi”; literal na, “ibinigay ang pera ko sa isang mesa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: bakit
  rationale: Likas at tuwirang tanong sa dahilan, at napapanatili ang himig ng pagsaway.
- source_word: ἔδωκάς ... ἐπὶ τράπεζαν
  choice: idineposito sa bangko
  rationale: Bagaman literal na tumutukoy sa paglalagay o pagbibigay ng salapi sa isang mesang ginagamit sa gawaing pinansiyal, malinaw sa konteksto na ang ibig sabihin ay pagdedeposito sa bangko.
- source_word: μου τὸ ἀργύριον
  choice: ang pera ko
  rationale: Maaaring literal na mangahulugang pilak ang ἀργύριον, ngunit sa kontekstong pinansiyal ay natural at tumpak ang 'pera.'
- source_word: κἀγὼ ἐλθὼν
  choice: Sa gayon, pagdating ko
  rationale: Ginawang likas na sugnay na pamanahon ang participle, habang ipinahahayag ng 'Sa gayon' ang bunga ng inaasahang pagdedeposito.
- source_word: σὺν τόκῳ
  choice: nang may tubo
  rationale: Ang τόκος dito ay interes na kinikita ng idinepositong pera; karaniwan at madaling maunawaan sa Filipino ang 'tubo' sa ganitong konteksto.
- source_word: αὐτὸ ἔπραξα
  choice: nakuha ko sana iyon
  rationale: Sa kontekstong pangkalakalan, ang πράσσω ay tumutukoy sa pagkuha o pagsingil ng halagang dapat matanggap. Ang 'nakuha ko sana' ay natural at kasamang tumutukoy sa prinsipal na may tubo.
