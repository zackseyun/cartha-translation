  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing diwa ng salin: ang pagsaway tungkol sa hindi pagdedeposito ng pera at ang pagkuha nito na may tubo. Gayunman, ang "nakuha ko sana" ay mas pangkalahatan kaysa sa komersiyal na diwa ng ἔπραξα, na tumutukoy rito sa pagsingil o pagkuha ng halagang dapat matanggap.'
  naturalness: Natural ang modernong Filipino ng draft. Mas malinaw at mas angkop sa kontekstong pinansiyal ang "sana'y nasingil ko ito" kaysa "nakuha ko sana iyon." Ang pag-alis ng "Sa gayon" ay nagbibigay ng mas tuwirang daloy na malapit sa Griyegong "at ako, pagdating ko."
  terminology: Ang "idineposito sa bangko," "pera," at "tubo" ay angkop na modernong terminong Filipino para sa ἐπὶ τράπεζαν, ἀργύριον, at σὺν τόκῳ. Nagdagdag ng talababa upang maitala ang mas literal na larawan ng mesa/tagapagpalit ng salapi na nasa pinagmulang teksto.
  issues:
