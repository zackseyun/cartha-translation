  source_fidelity: Kailangang itama ang ilang antas ng kahulugan. Ang “malupit” ay karaniwang nagpapahiwatig ng pagiging cruel at mas malakas kaysa sa αὐστηρός, na dito ay “mahigpit,” “istrikto,” o “mabagsik/exacting.” Ang “inilagak” ay maaaring tanggapin bilang interpretasyon sa kontekstong salapi, ngunit ang Griyego ay hindi tahasang nagsasaad ng pagdedeposito; mas tapat ang “inilagay,” na maaaring ipaliwanag sa talababa.
  naturalness: Likas at malinaw ang daloy ng salin. Ang “mahigpit kang tao” ay natural sa makabagong Filipino at pinananatili ang mapanumbat na tinig ng nagsasalita. Ang presenteng anyong “natatakot ako” ay katanggap-tanggap sa tuwirang salaysay at maaaring magpahiwatig ng nagpapatuloy na kalagayan na isinasaad ng imperpekto.
  terminology: Pinananatili ang pares na “inaani ... inihasik,” na angkop na katumbas ng θερίζεις ... ἔσπειρας. Ginamit ang “mahigpit” para sa αὐστηρός upang huwag dagdagan ang paratang ng alipin ng ideyang “malupit” sa diwang cruel.
