base_translation:
  language: en
  yaml_path: translation/nt/luke/019/021.yaml
  text: 'for I was afraid of you[a], because you are a severe man: you take what you did not put down[b], and you reap what you did not sow.'
translation:
  language: tl
  text: 'sapagkat natatakot ako sa iyo, dahil mahigpit kang tao: kinukuha mo ang hindi mo inilagay at inaani mo ang hindi mo inihasik.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφοβούμην
  choice: natatakot ako
  rationale: Ipinapahayag ng imperpektong anyo ang nagpapatuloy na takot ng alipin sa nakaraang tagpo; natural sa salaysay na Filipino ang “natatakot ako.”
- source_word: γάρ
  choice: sapagkat
  rationale: Nagbibigay ito ng paliwanag o dahilan para sa naunang sinabi.
- source_word: αὐστηρὸς
  choice: malupit
  rationale: Pinananatili nito ang negatibo at mapanumbat na paglalarawan ng alipin sa panginoon, nang hindi pinatutunayang tama ang kanyang paratang.
- source_word: ἄνθρωπος
  choice: tao
  rationale: Tumutukoy ito sa tiyak na lalaking tauhan, ngunit ang natural na pariralang Filipino ay “isa kang ... na tao.”
- source_word: αἴρεις
  choice: kinukuha mo
  rationale: Malinaw at likas na katumbas ito ng pagkuha, habang hindi nililimitahan ang diwa sa mas tiyak na gawaing pangkalakalan.
- source_word: ὃ οὐκ ἔθηκας
  choice: ang hindi mo inilagak
  rationale: Ang “inilagak” ay nagpapanatili sa larawan ng paglalagay o pag-iiwan ng salapi at mas natural sa kontekstong pinansyal kaysa sa literal na “inilagay.”
- source_word: θερίζεις
  choice: inaani mo
  rationale: Pinananatili nito ang larawang pansakahan at ang pagtutugma sa paghahasik.
- source_word: ὃ οὐκ ἔσπειρας
  choice: ang hindi mo inihasik
  rationale: Tuwirang pinananatili ang talinghaga ng paghahasik at pag-aani.
theological_decisions:
- issue: Kung palalambutin ang paglalarawan ng alipin sa panginoon upang pangalagaan ang larawan ng maharlika sa talinghaga
  choice: Panatilihin ang mapanumbat na salitang “malupit” bilang sinabi ng alipin
  alternative: Gamitin ang mas banayad na “mahigpit”
  rationale: Iniuulat ng talata ang sariling paratang ng alipin. Hindi dapat lutasin ng salin kung totoo ang paglalarawang ito o kung maaasahan ang nagsasalita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mapanumbat na tono ng alipin at ang magkatambal na larawan ng paghahasik at pag-aani.
