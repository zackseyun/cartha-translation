id: LUK.19.42
reference: Luke 19:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγων ὅτι Εἰ ἔγνως ⸂ἐν τῇ ἡμέρᾳ ταύτῃ καὶ σὺ⸃ τὰ πρὸς ⸀εἰρήνην— νῦν δὲ ἐκρύβη ἀπὸ ὀφθαλμῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/042.yaml
  text: saying[a], “If you had known on this day, even you[c][b], the things that make for peace—but now they have been hidden from your eyes.”
translation:
  language: tl
  text: na sinasabi, “Kung nalaman mo sana[a] sa araw na ito—maging ikaw—ang mga bagay na humahantong sa kapayapaan…[b] Ngunit ngayo’y ikinubli na ang mga ito mula sa iyong mga mata.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Kung nalaman mo sa araw na ito—maging ikaw—ang mga bagay na humahantong sa kapayapaan.”
    reason: Ipinahihiwatig ng kondisyon ang isang mapighati at di-natupad na hangarin; ang “sana” ay natural sa Tagalog ngunit walang hiwalay na salitang katumbas nito sa Griyego.
  - marker: b
    text: Sa Griyego, literal na “ang mga bagay tungo sa kapayapaan,” ibig sabihin, ang mga bagay na nauukol o umaakay sa kapayapaan.
    reason: Nililinaw ang idyomatikong kahulugan ng τὰ πρὸς εἰρήνην habang pinananatili ang posibleng lawak ng “kapayapaan.”
  - marker: c
    text: Isahan ang anyo ng pandiwa sa Griyego, ngunit maaari nitong tukuyin ang naunang pariralang neuter plural bilang isang kabuuan. Kaya maaari ring isalin, “Ngunit ngayo’y ikinubli na ito mula sa iyong mga mata.”
    reason: Itinatala ang gramatikal at konseptuwal na alternatibo nang hindi pinuputol ang ugnayan sa mga bagay na humahantong sa kapayapaan.
lexical_decisions:
- source_word: λέγων
  choice: na sinasabi
  rationale: Pinananatili ang anyong pandiwaring pangkasalukuyan at ang pagkakaugnay nito sa naunang sugnay ng salaysay.
- source_word: Εἰ ἔγνως
  choice: Kung nalaman mo sana
  rationale: Ipinahahayag ng “sana” ang di-natupad at mapighating kondisyon sa likas na Tagalog, nang hindi nagdaragdag ng tahasang “lamang.”
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: sa araw na ito
  rationale: Ito ang natural na panandang temporal sa Tagalog at hindi nito dinaragdagan ang diin ng Griyego.
- source_word: καὶ σὺ
  choice: maging ikaw
  rationale: Inilalahad nito ang mariing pagtukoy sa Jerusalem bilang “even you” nang hindi nagdaragdag ng ideya ng “lamang.”
- source_word: τὰ πρὸς εἰρήνην
  choice: ang mga bagay na humahantong sa kapayapaan
  rationale: 'Pinananatili ang maramihang diwa ng τὰ at ang direksiyon o kaugnayang ipinahihiwatig ng πρὸς: mga bagay na nauukol o umaakay sa kapayapaan.'
- source_word: νῦν δὲ
  choice: Ngunit ngayo’y
  rationale: Malinaw na ipinakikita ang matinding pagsalungat sa pagitan ng maaaring nalaman at ng kasalukuyang pagkakubli.
- source_word: ἐκρύβη
  choice: ikinubli na ang mga ito
  rationale: Pinananatili ang balintiyak na tinig at ginagawang malinaw na ang tinutukoy ay ang naunang maramihang parirala; ipinahihiwatig ng “na” ang kasalukuyang bunga.
- source_word: ἀπὸ ὀφθαλμῶν σου
  choice: sa iyong paningin
  rationale: Natural na idyomang Tagalog para sa bagay na hindi na nakikita o nakikilala, habang pinananatili ang talinghaga ng paningin.
theological_decisions:
- issue: Ang ipinahihiwatig na simuno ng ἐκρύβη
  choice: Ang ikinubli ay “ang mga bagay na humahantong sa kapayapaan,” kaya ginamit ang “ang mga ito.”
  alternative: 'Isahang konseptuwal na pahayag: “ikinubli na ito sa iyong paningin.”'
  rationale: Bagaman isahan ang anyo ng pandiwa sa Griyego, karaniwang kumukuha ng isahang pandiwa ang neuter plural na simuno. Pinakamalinaw na tumutukoy ito sa naunang τὰ πρὸς εἰρήνην; hindi kailangang magdagdag ng ibang teolohikal na paksa.
- issue: Lakas ng mapighating kondisyon
  choice: “Kung nalaman mo sana” nang walang “lamang.”
  alternative: “Kung nalaman mo lamang sana.”
  rationale: Kailangan ang “sana” upang natural na maipahayag sa Tagalog ang di-natupad na hangarin at panaghoy, ngunit hindi idinagdag ang “lamang,” sapagkat wala itong tahasang katumbas sa Griyego.
- issue: Hindi tinukoy na gumagawa sa balintiyak na ἐκρύβη
  choice: Pinanatiling hindi binanggit kung sino ang nagkubli.
  alternative: Tukuyin ang Diyos bilang gumagawa.
  rationale: Maaaring maunawaan bilang divine passive, ngunit hindi tahasang pinangalanan ng teksto ang gumagawa; ang pagsasalin ay hindi dapat lutasin ang ambiguwidad.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ang gitling-panaklong sa “maging ikaw” ay nagpapanatili sa mariing singit ng Griyego, at ang tandang padamdam ay nagpapakita ng panaghoy at ng biglang naputol na kondisyong walang tahasang kasunod na sugnay.
