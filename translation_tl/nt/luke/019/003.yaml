  text: καὶ ἐζήτει ἰδεῖν τὸν Ἰησοῦν τίς ἐστιν, καὶ οὐκ ἠδύνατο ἀπὸ τοῦ ὄχλου ὅτι τῇ ἡλικίᾳ μικρὸς ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/003.yaml
  text: And he was trying to see who Jesus was[a], but he could not because of the crowd, because he was small in stature.
translation:
  language: tl
  text: At sinisikap niyang makita kung sino si Jesus,[a] ngunit hindi niya magawa dahil sa dami ng tao, sapagkat pandak siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kung anong uri ng tao si Jesus.” Maaaring tumukoy ang salitang Griyego sa pagkakakilanlan niya o sa uri ng taong siya.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἐζήτει
  choice: sinisikap niya
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang patuloy na pagsisikap, hindi lamang pagnanais.
- source_word: ἰδεῖν
  choice: makita
  rationale: Likas at tuwirang ipinapahayag ang layunin ng kaniyang pagsisikap.
- source_word: τίς ἐστιν
  choice: kung sino si Jesus
  rationale: Pinananatili nito ang posibilidad na tumukoy ang parirala sa pagkakakilanlan o sa kung anong uri ng tao si Jesus, nang hindi labis na nagpapakahulugan.
- source_word: οὐκ ἠδύνατο
  choice: hindi niya magawa
  rationale: Natural na Filipino para sa kawalan niya ng kakayahang maisagawa ang layuning makita si Jesus sa sitwasyong iyon.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: dahil sa dami ng tao
  rationale: Ang ἀπό ay nagsasaad dito ng humahadlang na sanhi; mas natural sa Filipino ang 'dahil sa dami ng tao' kaysa literal na 'mula sa karamihan.'
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan kung bakit hindi siya makakita.
- source_word: τῇ ἡλικίᾳ μικρὸς ἦν
  choice: pandak siya
  rationale: Bagaman maaaring tumukoy ang ἡλικία sa edad o pangangatawan, malinaw sa konteksto ng pagharang ng mga tao na pisikal na taas ang tinutukoy; ang 'pandak' ay natural at eksakto sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang 'sinisikap' upang mapanatili ang patuloy na kilos ng imperpektibo, at 'pandak' bilang malinaw na pagtukoy sa pisikal na taas. Nasa pangunahing teksto ang marker na [a].
