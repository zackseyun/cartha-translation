  to: Ngunit tumayo si Zaqueo at sinabi sa Panginoon, “Narito, Panginoon, ibinibigay ko sa mga dukha ang kalahati ng aking mga ari-arian; at kung may nakuha ako mula kaninuman sa pamamagitan ng pangingikil[a], ibinabalik ko nang apat na beses ang halaga nito[b].”
