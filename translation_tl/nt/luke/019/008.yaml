  naturalness: Mas natural at mas malinaw sa modernong Filipino ang «Narito, Panginoon» bilang katumbas ng Ἰδοὺ sa pananalitang ito. Ang «ibinabalik ko nang apat na beses ang halaga nito» ay malinaw na nagsasaad ng fourfold restitution.
  terminology: Ang «Panginoon,» «mga dukha,» at «mga ari-arian» ay angkop sa marangal ngunit makabagong rehistro. Ang «pangingikil» ay isang katanggap-tanggap na pangunahing salin para sa συκοφαντέω; pinananatili ng talababa ang mas malawak na saklaw, kabilang ang pandaraya at maling paratang.
