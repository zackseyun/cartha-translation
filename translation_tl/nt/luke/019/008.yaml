  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: σταθεὶς δὲ Ζακχαῖος εἶπεν πρὸς τὸν κύριον· Ἰδοὺ τὰ ⸀ἡμίσιά ⸂μου τῶν ὑπαρχόντων⸃, κύριε, ⸂τοῖς πτωχοῖς δίδωμι⸃, καὶ εἴ τινός τι ἐσυκοφάντησα ἀποδίδωμι τετραπλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/008.yaml
  text: But Zacchaeus stood and said to the Lord[a], “Look, Lord, I give half of my possessions to the poor, and if I have extorted anything from anyone[b], I repay it fourfold.”
translation:
  language: tl
  text: Ngunit tumayo si Zaqueo at sinabi sa Panginoon, “Narito, Panginoon, ibinibigay ko sa mga dukha ang kalahati ng aking mga ari-arian; at kung may nakuha ako mula kaninuman sa pamamagitan ng pangingikil[a], ibinabalik ko nang apat na beses ang halaga nito[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng pandaraya.” Ang pandiwang Griyego ay maaaring tumukoy sa pangingikil, pagsasamantala, o pandaraya, kung minsan sa pamamagitan ng maling paratang.
    reason: lexical_alternative
  - marker: b
    text: Ang mga pandiwang nasa panahunang pangkasalukuyan sa Griyego ay maaari ring unawaing “ibibigay ko” at “ibabalik ko,” bilang pagpapahayag ng agarang pasiya.
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: tumayo
  rationale: Ang aorist passive participle ng ἵστημι ay gamit na intransitibo rito; natural na inilalahad ng “tumayo” ang kilos sa salaysay nang hindi dinaragdagan ang detalye ng tindig.
- source_word: κύριον / κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang titulong κύριος at ang posibleng sabay na diwa ng magalang na pakikipag-usap at pagkilala kay Jesus.
- source_word: Ἰδοὺ
  choice: Tingnan ninyo
  rationale: Isang makabagong panawag-pansin na nagpapanatili sa mariing puwersa ng Ἰδοὺ; ang maramihang anyong-galang ay natural sa pakikipag-usap sa Filipino.
- source_word: τὰ ἡμίσιά μου τῶν ὑπαρχόντων
  choice: ang kalahati ng aking mga ari-arian
  rationale: Malinaw at likas na Filipino para sa partitive na parirala at sa mga pag-aari o kayamanan ni Zaqueo.
- source_word: τοῖς πτωχοῖς
  choice: sa mga dukha
  rationale: Tumpak na tumutukoy sa mga taong salat sa kabuhayan at may marangal na biblikal na rehistro.
- source_word: δίδωμι
  choice: ibinibigay ko
  rationale: Pinananatili ang present indicative at sadyang hindi nilulutas sa pangunahing teksto kung kasalukuyang gawain ito o agarang pasiya.
- source_word: ἐσυκοφάντησα
  choice: may kinuha ako ... sa pamamagitan ng pangingikil
  rationale: Ipinahahayag ang pagkuha sa iba sa paraang mapagsamantala; inilalagay sa talababa ang mas malawak na saklaw na pandaraya o maling paratang.
- source_word: ἀποδίδωμι
  choice: binabayaran ko iyon
  rationale: Natural na Filipino para sa pagbabayad o pagsasauli bilang kabayaran, habang pinananatili ang present tense.
- source_word: τετραπλοῦν
  choice: nang apat na ulit
  rationale: Malinaw na nagpapahayag ng apat-na-beses na kabayaran sa karaniwang Filipino.
theological_decisions:
- issue: Puwersa ng present-tense na δίδωμι at ἀποδίδωμι
  choice: 'Present tense: “ibinibigay ko ... binabayaran ko”'
  alternative: 'Futuristic present: “ibibigay ko ... babayaran ko”'
  rationale: Present indicative ang nasa Griyego. Pinananatili ng salin ang anyong ito at inilalahad sa talababa na maaari rin itong magpahayag ng agarang pasiya, upang hindi ipasya kung inilalarawan ni Zaqueo ang dati nang gawain o bagong tugon ng pagsisisi.
- issue: Saklaw ng συκοφαντέω
  choice: “sa pamamagitan ng pangingikil”
  alternative: “sa pamamagitan ng pandaraya” o pagkuha sa pamamagitan ng maling paratang
  rationale: Ang konteksto ng punong maniningil ng buwis ay umaayon sa pangingikil, ngunit hindi nililimitahan dito ang pandiwa; pinananatili sa talababa ang iba pang tunay na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga dukha” at “mga ari-arian” para sa dignified ngunit madaling maunawaang rehistro. Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto at tumutugma sa mga talababa.
