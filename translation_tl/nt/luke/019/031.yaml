  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμᾶς ἐρωτᾷ· Διὰ τί λύετε; οὕτως ⸀ἐρεῖτε ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/031.yaml
  text: 'And if anyone asks you[a], ‘Why are you untying it?’ you shall say this: ‘The Lord has need of it.’'
translation:
  language: tl
  text: 'At kung may magtanong sa inyo, ‘Bakit ninyo ito kinakalagan?’ sabihin ninyo ito: ‘Kailangan ito ng Panginoon.’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kailangan ito ng amo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτᾷ
  choice: magtanong
  rationale: Karaniwan at natural na pandiwa sa makabagong Filipino para sa pagtatanong sa tuwirang usapan.
- source_word: Διὰ τί
  choice: Bakit
  rationale: Pinakanatural at tuwirang katumbas ng pariralang nagtatanong ng dahilan.
- source_word: λύετε
  choice: kinakalagan
  rationale: Sa konteksto ng nakataling batang asno, tumutukoy ito sa pag-aalis ng tali; malinaw at angkop ang ‘kinakalagan.’ Idinagdag ang ‘ito’ bilang likas na hayag na layon sa Filipino.
- source_word: οὕτως ἐρεῖτε
  choice: sabihin ninyo
  rationale: Ang anyong panghinaharap ay may puwersang pantagubilin; natural itong ipinahahayag sa Filipino bilang isang tuwirang utos.
- source_word: κύριος
  choice: Panginoon
  rationale: Pinananatili ang titulo at ang posibleng teolohikal na pahiwatig nito sa salaysay ni Lucas, habang likas na tumutukoy kay Jesus.
- source_word: αὐτοῦ
  choice: ito
  rationale: Ang panghalip na nasa anyong paari sa Griyego ay pinakamalamang na tumutukoy sa batang asno; sa natural na Filipino, ipinahahayag ito bilang layon ng ‘kailangan.’
- source_word: χρείαν ἔχει
  choice: Kailangan ito ng
  rationale: Likas na ayos sa Filipino para sa idyomang ‘may pangangailangan sa’; malinaw at marangal nang hindi tunog-luma.
theological_decisions:
- issue: Referente at puwersa ng Ὁ κύριος
  choice: ‘Panginoon,’ na tumutukoy kay Jesus at nagpapanatili sa bigat ng titulo
  alternative: ‘May-ari’ o ‘amo,’ sa mas karaniwang diwa ng isang taong may karapatan sa hayop
  rationale: Madalas gamitin ni Lucas ang κύριος bilang titulo para kay Jesus. Pinananatili ng ‘Panginoon’ ang posibleng dobleng dating ng salita nang hindi nililimitahan ito sa simpleng pagmamay-ari.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘kinakalagan’ sa halip na mas literal ngunit di-likas na ‘niluluwagan,’ at pinaikli ang pormulang pantagubilin upang maging natural nang hindi nawawala ang puwersa nito.
