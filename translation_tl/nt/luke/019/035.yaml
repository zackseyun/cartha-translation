  text: καὶ ἤγαγον αὐτὸν πρὸς τὸν Ἰησοῦν, καὶ ἐπιρίψαντες ⸀αὐτῶν τὰ ἱμάτια ἐπὶ τὸν πῶλον ἐπεβίβασαν τὸν Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/035.yaml
  text: And they brought it to Jesus[a], and after throwing their cloaks on the colt[b], they put Jesus on it.
translation:
  language: tl
  text: Dinala nila ang batang asno kay Jesus. Matapos nilang ilagay ang kanilang mga balabal sa ibabaw nito[a], pinasakay nila si Jesus sa batang asno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay maaaring mangahulugang “bisiro” o batang hayop; sa kontekstong ito, isang batang asno ang tinutukoy.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἤγαγον αὐτὸν
  choice: Dinala nila ang bisiro
  rationale: Ang ἄγω ay tumutukoy sa pagdadala sa hayop kay Jesus. Tahasang inulit ang “bisiro” sa halip na gumamit ng panghalip upang maging likas at malinaw sa Tagalog nang hindi kailangang ipahiwatig ang kasariang gramatikal ng Griyego.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: kay Jesus
  rationale: Ipinapahayag ng πρός na may akusatibo ang paglapit o pagdadala patungo sa isang tao; “kay Jesus” ang likas na katumbas sa Tagalog.
- source_word: ἐπιρίψαντες
  choice: Matapos nilang ipatong
  rationale: Ipinakikita ng aorist participle na nauna ang paglalagay ng mga balabal bago pinasakay si Jesus. Ang “ipatong” ay natural sa Tagalog at angkop sa layunin ng paglalagay ng mga balabal sa hayop.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: ang kanilang mga balabal
  rationale: Ang ἱμάτια ay mga panlabas na kasuotan; mas tiyak at malinaw dito ang “mga balabal” kaysa sa pangkalahatang “mga damit.”
- source_word: πῶλον
  choice: bisiro
  rationale: Ang πῶλος ay batang hayop na sinasakyan. Pinananatili ng “bisiro” ang antas ng katiyakan ng mismong salita, samantalang nililinaw sa talababa na batang asno ang tinutukoy sa tagpong ito.
- source_word: ἐπεβίβασαν τὸν Ἰησοῦν
  choice: pinasakay nila rito si Jesus
  rationale: 'Pinananatili ng “pinasakay” ang causative na diwa ng pandiwa: tinulungan o inilagay nila si Jesus upang sumakay. Ang “rito” ay malinaw na tumutukoy sa bisiro.'
