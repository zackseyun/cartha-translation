  source_fidelity: 'Tumpak na naipapahayag ang sabayang pakikinig, ang pagpapatuloy ni Jesus sa pagsasalita sa pamamagitan ng talinghaga, at ang dalawang dahilan nito: malapit siya sa Jerusalem at inaasahan ng mga nakikinig ang kagyat na pagpapakita ng kaharian ng Diyos. Hindi nito ipinipilit ang anyo ng inaasahang pagpapakitang iyon.'
