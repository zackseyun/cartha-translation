id: LUK.19.11
reference: Luke 19:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀκουόντων δὲ αὐτῶν ταῦτα προσθεὶς εἶπεν παραβολὴν διὰ τὸ ἐγγὺς ⸂εἶναι Ἰερουσαλὴμ αὐτὸν⸃ καὶ δοκεῖν αὐτοὺς ὅτι παραχρῆμα μέλλει ἡ βασιλεία τοῦ θεοῦ ἀναφαίνεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/011.yaml
  text: As they were hearing these things[a], he went on and told a parable, because he was near Jerusalem and because they supposed that the kingdom of God was about to appear immediately.
translation:
  language: tl
  text: Habang naririnig nila ang mga bagay na ito, nagpatuloy si Jesus at nagsalaysay ng isang talinghaga, sapagkat malapit na siya sa Jerusalem at inakala nilang agad nang magpapakita[a] ang kaharian ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mahahayag.” Ang pandiwa ay maaaring tumukoy sa pagiging nakikita o hayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκουόντων δὲ αὐτῶν ταῦτα
  choice: Habang naririnig nila ang mga bagay na ito
  rationale: Ang genitive absolute na may pangkasalukuyang participle ay nagsasaad ng kasabay at nagpapatuloy na pakikinig; pinananatili ito ng “habang naririnig.”
- source_word: προσθεὶς εἶπεν
  choice: nagpatuloy si Jesus at nagsalaysay
  rationale: Idyomatikong ipinahihiwatig ng parirala ang pagpapatuloy o pagdaragdag sa pagsasalita. Ginawang tahasan ang tinutukoy na si Jesus para sa likas at malinaw na Tagalog.
- source_word: παραβολὴν
  choice: isang talinghaga
  rationale: Ang “talinghaga” ang kinikilalang terminong pang-Ebanghelyo para sa ganitong uri ng salaysay at natural sa marangal na modernong Tagalog.
- source_word: διὰ τὸ ἐγγὺς εἶναι Ἰερουσαλὴμ αὐτὸν
  choice: sapagkat malapit na siya sa Jerusalem
  rationale: Ang διά na may articular infinitive ay sanhi ang diwa, at si Jesus—hindi ang Jerusalem—ang inilalarawang malapit sa lungsod.
- source_word: δοκεῖν αὐτοὺς
  choice: inakala nila
  rationale: Ipinahahayag nito ang kanilang palagay o inaasahan nang hindi sinasabing tiyak o tama iyon.
- source_word: παραχρῆμα
  choice: agad
  rationale: Malinaw at likas na katumbas ito ng adverbiyong nagbibigay-diin sa kagyat na pangyayari.
- source_word: μέλλει ... ἀναφαίνεσθαι
  choice: agad nang magpapakita
  rationale: Ang “nang” kasama ng “agad” ay naghahatid ng inaasahang nalalapit na pangyayari, samantalang ang “magpapakita” ay nagpapanatili sa diwa ng pagiging hayag o nakikita.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Ito ang matatag, tumpak, at intertekstuwal na salin ng parirala sa salaysay ni Lucas.
theological_decisions:
- issue: Anyo ng inaasahang pagpapakita ng kaharian
  choice: Isinalin bilang “agad nang magpapakita ang kaharian ng Diyos” nang hindi tinutukoy kung pampolitika, apokaliptiko, o espirituwal ang pagpapakitang iyon.
  alternative: “agad nang itatatag bilang isang makapolitikang kaharian” o “agad nang lubos na ihahayag sa wakas ng panahon”
  rationale: Ang talata ay nag-uulat lamang ng inaasahan nilang kagyat na pagpapakita ng kaharian at hindi nito nililinaw ang eksaktong anyo; kaya pinananatili ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang sobrang literal na “nagdagdag at nagsabi” at pinili ang karaniwang biblikal na “talinghaga.”
