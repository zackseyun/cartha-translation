id: LUK.19.22
reference: Luke 19:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀λέγει αὐτῷ· Ἐκ τοῦ στόματός σου κρίνω σε, πονηρὲ δοῦλε· ᾔδεις ὅτι ἐγὼ ἄνθρωπος αὐστηρός εἰμι, αἴρων ὃ οὐκ ἔθηκα καὶ θερίζων ὃ οὐκ ἔσπειρα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/022.yaml
  text: He said to him[a], ‘Out of your own mouth I will judge you, wicked servant. You knew that I am a harsh man[d][c][b], taking up what I did not lay down and reaping what I did not sow?’
translation:
  language: tl
  text: Sinabi niya sa kanya, “Sa sarili mong bibig, hahatulan kita[a], masamang alipin! Alam mong ako ay isang mabagsik na tao, kinukuha ang hindi ko inilagak[b] at inaani ang hindi ko inihasik[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Batay sa sarili mong mga salita, hahatulan kita.”
    reason: lexical_alternative
  - marker: b
    text: O “inilagay.” Ang pandiwang Griyego ay maaaring tumukoy sa paglalagay o pagdedeposito.
    reason: lexical_alternative
  - marker: c
    text: Mas literal na “ang hindi ko inihasik,” hindi “kung saan hindi ako naghasik.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τοῦ στόματός σου
  choice: Sa sarili mong bibig
  rationale: Pinananatili nito ang matalinghagang pahayag na ang hatol ay ibabatay sa mismong sinabi ng alipin. Likas sa modernong Tagalog ang pagdaragdag ng “sarili mong” upang malinaw ang diin.
- source_word: κρίνω
  choice: hahatulan
  rationale: Ipinapahayag ng anyong Griyego ang hinaharap. Mas malawak ang “hahatulan” kaysa “paparusahan” o “kokondenahin,” kaya hindi nito agad nilulutas ang ipinahihiwatig lamang ng konteksto.
- source_word: πονηρὲ
  choice: masamang
  rationale: Ang “masamang” ay natural na tuwirang panunumbat at nagpapahayag ng moral na pagkakasala nang hindi labis ang tindi.
- source_word: δοῦλε
  choice: alipin
  rationale: Sa tagpong ito ng panginoon at taong nasa ilalim ng kanyang kapangyarihan, malinaw na mahalaga ang kalagayang hindi malaya; mas tumpak dito ang “alipin” kaysa “lingkod.”
- source_word: ᾔδεις
  choice: Alam mong
  rationale: Natural nitong ipinapahayag ang kaalamang ipinapalagay ng nagsasalita at napapanatili ang retorikal na gamit ng sinabi mismo ng alipin.
- source_word: αὐστηρός
  choice: mabagsik
  rationale: Ipinahihiwatig nito ang mabigat at di-kaaya-ayang higpit na ibinibintang sa panginoon. Ang “mahigpit” ay maaari ngunit mas neutral, samantalang ang “malupit” ay maaaring magdagdag ng tahasang kalupitan.
- source_word: αἴρων
  choice: kinukuha
  rationale: Malawak at natural ang pandiwang ito at naipapakita ang pagkuha sa hindi niya inilagak nang hindi nagdaragdag ng paliwanag.
- source_word: ὃ οὐκ ἔθηκα
  choice: ang hindi ko inilagak
  rationale: Ang “inilagak” ay angkop sa konteksto ng salapi at sa diwa ng paglalagay o pagdedeposito, habang ang talababa ay nag-iingat ng mas pangkalahatang alternatibo.
- source_word: θερίζων
  choice: inaani
  rationale: Pinananatili nito ang larawang pansakahan at likas na itinatambal sa paghahasik.
- source_word: ὃ οὐκ ἔσπειρα
  choice: ang hindi ko inihasik
  rationale: Sinusunod nito ang tuwirang layon ng Griyego—“ang hindi ko inihasik”—sa halip na gawing pook, gaya ng “kung saan hindi ako naghasik.”
theological_decisions:
- issue: Paglalarawan kay δοῦλος sa talinghaga
  choice: alipin
  alternative: lingkod
  rationale: Mahalaga sa tagpo ang lubos na pagpapasakop sa panginoon. Iniiwasan ng “alipin” na pagaanin ang ugnayang panlipunan na ipinahihiwatig ng Griyego.
- issue: Kung pinagtitibay ba ng panginoon ang paglalarawan sa kanyang sarili bilang mabagsik
  choice: Pinanatili ang tuwirang anyong “Alam mong ako ay isang mabagsik na tao” bilang retorikal na pag-uulit sa sinabi ng alipin.
  alternative: “Sinasabi mong ako ay isang mabagsik na tao” o “Kung alam mong ako ay isang mabagsik na tao”
  rationale: Tuwirang ganito ang kayarian ng Griyego. Hindi nagdaragdag ang salin ng paliwanag kung inaamin ba ng panginoon ang paglalarawan o ginagamit lamang niya ito laban sa alipin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “rito” bilang natural na anyo ng “sa kanya,” at pinanatili ang retorikal na tanong at ang magkatulad na ayos ng pagkuha/paglalagak at pag-aani/paghahasik.
