  yaml_path: translation/nt/luke/019/004.yaml
  text: So he ran on ahead and climbed up into a sycamore tree so that he might see him[a], because he was about to pass that way.
translation:
  language: tl
  text: Kaya tumakbo siya papunta sa unahan at umakyat sa isang punong sikomoro[a] upang makita si Jesus, sapagkat malapit nang dumaan doon si Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas tiyak, “punong sikomoro-igos” (sycamore fig).
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν εἰς τὸ ἔμπροσθεν
  choice: tumakbo siya sa unahan
  rationale: Pinagsasama ng parirala ang pagtakbo at ang pagpunta sa dakong nauuna. Likas sa modernong Tagalog ang “tumakbo sa unahan” at hindi nito inuulit nang alanganin ang magkaugnay na diwa.
- source_word: ἀνέβη ἐπὶ
  choice: umakyat sa
  rationale: Malinaw na ipinahihiwatig ng pandiwa at pang-ukol ang pag-akyat sa puno. Ang “umakyat sa” ang karaniwang paraan ng pagsasabi nito sa Tagalog.
- source_word: συκομορέαν
  choice: isang punong sikomoro
  rationale: Tumutukoy ito sa Ficus sycomorus. Pinananatili sa teksto ang maikli at makikilalang pangalang “sikomoro,” samantalang inilalagay sa talababa ang mas tiyak na “sikomoro-igos.”
- source_word: ἵνα ἴδῃ αὐτόν
  choice: upang makita si Jesus
  rationale: Ipinahahayag ng ἵνα at pasakaling pandiwa ang layunin. Ginawang tahasan ang tinutukoy ng αὐτόν bilang “si Jesus” upang maiwasan ang kalituhan sa sunod-sunod na panghalip sa Tagalog.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala ng ὅτι ang dahilan ng pag-akyat niya sa puno. Ang “sapagkat” ay malinaw, marangal, at angkop sa salaysay.
- source_word: ἐκείνης ἤμελλεν διέρχεσθαι
  choice: doon daraan si Jesus
  rationale: Ang ἐκείνης ay eliptikong tumutukoy sa lugar o rutang iyon, at ang μέλλω kasama ng pawatas ay nagpapahayag ng nalalapit na pagkilos. Natural sa Tagalog ang “doon daraan”; inulit ang “si Jesus” upang maging malinaw ang simuno.
theological_decisions: []
translation_notes:
  register: Gumamit ng natural at marangal na modernong Tagalog. Ang “Kaya” ay nag-uugnay sa hadlang na binanggit sa naunang talata at sa naging kilos ni Zaqueo. Inulit ang pangalang “Jesus” sa halip na gumamit ng malabong panghalip, yamang madaling mapagkamalang si Zaqueo ang tinutukoy sa Tagalog.
