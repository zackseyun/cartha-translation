  text: Then the first came, saying, ‘Lord, your mina has earned ten minas.’
translation:
  language: tl
  text: Dumating ang una at sinabi, “Panginoon[a], ang mina ninyo ay nagpatubo ng sampu pang mina.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Amo.” Ang Griyegong pantawag na κύριε ay maaaring maging magalang na tawag sa isang nakatataas at maaari ring mangahulugang “Panginoon.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρεγένετο
  choice: Dumating
  rationale: Karaniwang ipinahihiwatig ng pandiwa ang pagdating o paglapit; natural ang “dumating” sa salaysay.
- source_word: δὲ
  choice: at
  rationale: Nagsasaad dito ang δέ ng pagpapatuloy ng salaysay; maayos itong naipapahayag ng “at” sa modernong Tagalog.
- source_word: ὁ πρῶτος
  choice: ang una
  rationale: Tumutukoy ito sa unang humarap ayon sa pagkakasunod-sunod. Hindi na idinagdag ang “lingkod” sapagkat wala itong tahasang katumbas sa talata.
- source_word: λέγων
  choice: sinabi
  rationale: 'Ang kasabay na participle ay mas natural na isalin bilang isa pang pandiwang may pang-ugnay: “at sinabi.”'
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang karaniwang salin sa κύριος, habang ipinapaliwanag sa talababa na maaari rin itong maging magalang na tawag sa isang nakatataas.
- source_word: ἡ μνᾶ σου
  choice: ang inyong mina
  rationale: Pinananatili ang makasaysayang yunit na μνᾶ bilang “mina.” Ginamit ang magalang na “inyong” dahil direktang kinakausap ng lingkod ang kanyang nakatataas.
- source_word: δέκα προσηργάσατο μνᾶς
  choice: ay kumita ng sampung mina
  rationale: Ang προσεργάζομαι ay tumutukoy sa pagkita o pagkamit ng karagdagang bunga sa pamamagitan ng gawain. Malinaw at natural sa Tagalog ang “kumita ng sampung mina,” at ang simuno ay nananatiling mina ng panginoon.
theological_decisions:
- issue: Pagsasalin sa κύριος bilang pantawag sa loob ng talinghaga
  choice: Panginoon
  alternative: Amo
  rationale: Bagaman ang kausap ay isang nakatataas sa loob ng talinghaga at hindi kinakailangang isang tuwirang pahayag tungkol sa pagka-Diyos, hindi ipinipilit ng Griyego ang isang kahulugan lamang. Pinanatili sa pangunahing teksto ang “Panginoon” at inilagay sa talababa ang kontekstuwal na alternatibong “Amo.”
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ang “inyong” ay magalang na panghalip para sa nag-iisang nakatataas; hindi nito binabago ang isahang bilang ng Griyegong σου.
