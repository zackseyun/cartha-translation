revisions:
- from: Tinawag niya ang sampu sa sarili niyang mga alipin[a], binigyan sila ng tig-iisang mina[b], at sinabi sa kanila, “Ipangalakal ninyo ito hanggang sa pagbabalik ko.”[c]
  to: Matapos tawagin ang sampu sa sarili niyang mga alipin[a], binigyan niya sila ng sampung mina[b] at sinabi sa kanila, “Magnegosyo kayo hanggang sa bumalik ako.”[c]
  rationale: Inalis ang distributibong "tig-iisang" upang hindi ipahayag bilang tahasan ang isang pamamahaging ipinahihiwatig lamang ng mas malawak na salaysay. Pinalitan din ang "Ipangalakal ninyo ito" ng isang plural na utos na walang idinagdag na tuwirang layon. Napanatili ang kahulugan, rehistro, terminong "alipin," at lahat ng wastong pananda ng talababa.
