  text: καλέσας δὲ δέκα δούλους ἑαυτοῦ ἔδωκεν αὐτοῖς δέκα μνᾶς καὶ εἶπεν πρὸς αὐτούς· ⸀Πραγματεύσασθε ⸂ἐν ᾧ⸃ ἔρχομαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/013.yaml
  text: After calling ten of his own servants[a], he gave them ten minas and said to them[c][b], “Do business until I come.”
translation:
  language: tl
  text: Matapos tawagin ang sampu sa sarili niyang mga alipin[a], binigyan niya sila ng sampung mina[b] at sinabi sa kanila, “Magnegosyo kayo hanggang sa bumalik ako.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lingkod.” Ang salitang Griyego na doulos ay maaaring tumukoy sa alipin o lingkod, depende sa konteksto.
    reason: alternative_reading
  - marker: b
    text: Ang mina ay isang sinaunang yunit ng salapi.
    reason: cultural_note
  - marker: c
    text: Maaari ring “Mangakal kayo hanggang sa bumalik ako” o “Makipagkalakalan kayo hanggang sa bumalik ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καλέσας
  choice: Tinawag niya
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa pagbibigay; sa Tagalog, likas na maipahayag ang sunod-sunod na kilos sa ganitong ayos nang hindi na gumagamit ng mabigat na pariralang participyal.
- source_word: δούλους
  choice: mga alipin
  rationale: Ang δοῦλος ay maaaring tumukoy sa alipin o lingkod, ngunit sa balangkas ng talinghaga ay malinaw ang pagmamay-ari at ugnayang panginoon-alipin; pinananatili ng “alipin” ang historikal at panlipunang bigat nito.
- source_word: ἑαυτοῦ
  choice: sarili niyang
  rationale: Pinananatili nito ang diin ng reflexive pronoun sa kaugnayan at pag-aari, at natural itong pakinggan sa modernong Tagalog.
- source_word: δέκα μνᾶς
  choice: tig-iisang mina
  rationale: Sampung mina ang ibinigay sa sampung alipin, at nililinaw ng kasunod na salaysay na bawat isa ay tumanggap ng isang mina. Ang “mina” ay pinanatili bilang sinaunang yunit ng salapi upang maiwasan ang maling pagtumbas sa makabagong pera.
- source_word: Πραγματεύσασθε
  choice: Ipangalakal ninyo ito
  rationale: Ang pandiwa ay nag-uutos na gamitin ang ipinagkatiwalang salapi sa pangangalakal o negosyo. Likas sa Tagalog ang “ipangalakal,” at ang “ito” ay tumutukoy sa salaping ibinigay nang hindi labis na tinutukoy ang paraan ng pagpapalago.
- source_word: ἐν ᾧ ἔρχομαι
  choice: hanggang sa pagbabalik ko
  rationale: Ang idyomang temporal ay natural na nangangahulugang hanggang sa pagdating o pagbabalik ng nagsasalita. Dahil umalis patungo sa malayong lupain ang tauhan sa konteksto, malinaw at idiomatiko ang “pagbabalik ko.”
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλος sa konteksto ng talinghagang panginoon-alipin
  choice: alipin
  alternative: lingkod
  rationale: Ipinakikita ng konteksto na ang mga tauhan ay nasa ilalim ng pag-aari at kapangyarihan ng panginoon. Hindi pinapahina ng “alipin” ang sinaunang panlipunang realidad, samantalang itinatala sa talababa ang posibleng saling “lingkod.”
- issue: Pamamahagi ng sampung mina sa sampung alipin
  choice: tig-iisang mina
  alternative: sampung mina
  rationale: Bagaman literal na sinasabi ng Griyego na ibinigay niya sa kanila ang sampung mina, ipinakikita ng Lucas 19:16–20 na bawat alipin ay humarap taglay ang “iyong mina.” Ang distributibong salin ay nagpapalinaw ng ipinahihiwatig ng salaysay nang hindi binabago ang kabuuang halaga.
- issue: Temporal na kahulugan ng ἐν ᾧ ἔρχομαι
  choice: hanggang sa pagbabalik ko
  alternative: hanggang sa dumating ako
  rationale: Kapuwa posible ang “dumating” at “bumalik,” ngunit ang agarang konteksto ng paglalakbay sa malayong lupain ay sumusuporta sa pagbabalik. Hindi ito ginagawang tuwirang pahayag tungkol sa anumang tiyak na doktrinang eskatolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang “alipin” upang mapanatili ang historikal na ugnayang panlipunan, “tig-iisang mina” para sa likas na distributibong pagpapahayag, at “ipangalakal” bilang maikli ngunit malinaw na utos. Lahat ng talababa ay may katugmang pananda sa pangunahing teksto.
