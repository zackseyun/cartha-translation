  text: And he entered and was passing through Jericho[a].
translation:
  language: tl
  text: At pumasok siya sa Jerico at dumaraan siya sa Jerico.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas pormal na pagkakasalin: “At pagkapasok niya, dumaraan siya sa Jerico.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Karaniwang pang-ugnay sa pagpapatuloy ng salaysay; pinananatili ang payak na koordinasyon nang hindi nagdaragdag ng interpretasyon.
- source_word: εἰσελθὼν
  choice: pumasok siya
  rationale: Ang aorist active participle ng εἰσέρχομαι ay tumutukoy sa kilos na nauuna sa pangunahing pandiwa. Isinalin bilang tahasang pandiwa upang maging natural sa modernong Tagalog habang nananatili ang pagkakasunod ng mga kilos.
- source_word: διήρχετο
  choice: nagdaraan doon
  rationale: Ang imperfect ng διέρχομαι ay nagpapakita ng kilos na nagpapatuloy o kasalukuyang nagaganap sa tagpong isinasalaysay. Ang “nagdaraan” ay nagpapanatili sa aspektong ito; ang “doon” ay likas na tumutukoy sa Jerico bilang lugar na dinaraanan.
- source_word: τὴν Ἰεριχώ
  choice: sa Jerico
  rationale: Pangalan ng lugar na saklaw ng pagdaan. Ginamit ang “sa” ayon sa likas na balarila ng Tagalog at ang karaniwang anyong Filipino na “Jerico.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang nagpapatuloy na diwa ng imperfect na διήρχετο, at iniwasan ang mas pormal at mabigat na participial construction sa pangunahing teksto.
