  source_fidelity: Ang pangunahing problema ay ang “nagdaraan doon,” na hindi tahasang nagsasaad na si Jesus ay dumaraan *sa* Jerico. Ang διήρχετο ay nangangailangan ng Jerico bilang lugar na dinaraanan; ang imperfective na “dumaraan” ay angkop.
