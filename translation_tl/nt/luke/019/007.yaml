  text: καὶ ἰδόντες πάντες διεγόγγυζον λέγοντες ὅτι Παρὰ ἁμαρτωλῷ ἀνδρὶ εἰσῆλθεν καταλῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/007.yaml
  text: And when they all saw it[a], they began to grumble, saying, “He has gone in to stay with a sinful man.”
translation:
  language: tl
  text: Nang makita ito ng lahat, nagsimula silang magbulung-bulungan, na nagsasabi, “Pumasok siya upang makituloy sa isang makasalanang lalaki.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: Nang makita ito
  rationale: Ang aorist participle ay natural na ipinapahayag bilang pangyayaring panahunan sa Tagalog. Idinagdag ang “ito” upang tumukoy sa pagpunta ni Jesus kay Zaqueo, gaya ng hinihingi ng natural na daloy.
- source_word: πάντες
  choice: ng lahat
  rationale: 'Pinananatili nito ang malawak na saklaw ng reaksiyon: lahat ng nakakita ay nagbulung-bulungan.'
- source_word: διεγόγγυζον
  choice: nagsimula silang magbulung-bulungan
  rationale: Ipinahihiwatig ng imperfect ang nagpapatuloy o nagsisimulang sama-samang pagrereklamo. Natural sa modernong Tagalog ang “magbulung-bulungan” para sa mapunang pag-ungol ng karamihan.
- source_word: λέγοντες
  choice: Sinabi nila
  rationale: Ginawang hiwalay na pangungusap ang participle upang maging malinaw at natural sa Tagalog habang ipinapakilala ang nilalaman ng kanilang pagbubulungan.
- source_word: παρὰ ἁμαρτωλῷ ἀνδρὶ
  choice: sa isang makasalanang lalaki
  rationale: Pinananatili ang pang-uri na ἁμαρτωλῷ at ang tahasang panlalaking pangngalang ἀνδρί, pati ang mapanuring paglalarawan ng karamihan.
- source_word: εἰσῆλθεν
  choice: Pumasok siya
  rationale: Tuwirang isinasalin ang aorist bilang natapos na pagpasok ni Jesus sa bahay ni Zaqueo; hindi kailangan sa Tagalog ang katumbas na present perfect ng Ingles.
- source_word: καταλῦσαι
  choice: upang makituloy
  rationale: Sa kontekstong ito, ang infinitive ay tumutukoy sa pananatili o pagtuloy bilang panauhin. Ang “makituloy” ay malinaw, maikli, at likas sa modernong Tagalog.
theological_decisions:
- issue: Paglalarawan ng karamihan kay Zaqueo
  choice: isang makasalanang lalaki
  alternative: isang makasalanan
  rationale: Ang Griyego ay may pang-uri at tahasang panlalaking pangngalan (ἁμαρτωλῷ ἀνδρί), kaya pinananatili ang dalawang sangkap at ang mapanghamak na paghatol ng karamihan nang walang dagdag na teolohikal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “magbulung-bulungan” para sa sama-samang mapunang pagrereklamo at “makituloy” para sa pananatili bilang panauhin. Walang talababa dahil sapat na naipapahayag sa pangunahing teksto ang diwa ng καταλῦσαι.
