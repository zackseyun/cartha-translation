id: LUK.19.38
reference: Luke 19:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγοντες· Εὐλογημένος ὁ ἐρχόμενος ⸀βασιλεὺς ἐν ὀνόματι κυρίου· ⸂ἐν οὐρανῷ εἰρήνη⸃ καὶ δόξα ἐν ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/038.yaml
  text: saying[b][a], “Blessed is the King who comes in the name of the Lord! Peace in heaven and glory in the highest!”
translation:
  language: tl
  text: na nagsasabi, “Pinagpala ang Haring dumarating sa pangalan ng Panginoon![a] Kapayapaan sa langit at kaluwalhatian sa kaitaasan!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May mga salin na gumagamit ng mas pamilyar na pananalitang, “Pinagpala ang dumarating sa pangalan ng Panginoon,” ngunit hayagang kasama sa teksto ni Lucas ang “Hari.”
    reason: alternative_reading
  - marker: b
    text: 'Umaalingawngaw ito sa Lucas 2:14 ngunit magkaiba ang tinutukoy na lugar: doon ay “kapayapaan sa lupa”; dito ay “kapayapaan sa langit.”'
    reason: cross_reference
lexical_decisions:
- source_word: λέγοντες
  choice: na nagsasabi
  rationale: Pinananatili ang ugnayang participyal nito sa naunang talata at natural itong panimula sa ipinapahayag ng mga alagad.
- source_word: Εὐλογημένος
  choice: Pinagpala
  rationale: Angkop sa pormula ng pagpapala at sa alingawngaw ng Awit 118:26, nang hindi ito ginagawang simpleng panawagan lamang na magpuri.
- source_word: ὁ ἐρχόμενος
  choice: dumarating
  rationale: Pinananatili ang kasalukuyang diwa ng participle at natural na inilalarawan ang Hari.
- source_word: βασιλεὺς
  choice: ang Hari
  rationale: Hayagang nasa tekstong Griyego ang titulong βασιλεύς; mahalagang panatilihin ang maharlika at mesiyanikong diin ni Lucas.
- source_word: ἐν ὀνόματι κυρίου
  choice: sa pangalan ng Panginoon
  rationale: Likas na idyomang Filipino na nagpapanatili sa Semitikong anyo at sa diwa ng pagdating sa kapangyarihan o awtoridad ng Panginoon.
- source_word: ἐν οὐρανῷ εἰρήνη
  choice: Kapayapaan sa langit
  rationale: Pinananatili ang maikli at walang-pandiwang pahayag, pati ang malinaw na lokasyong 'sa langit' sa halip na ihanay ito sa Lucas 2:14.
- source_word: δόξα ἐν ὑψίστοις
  choice: kaluwalhatian sa kaitaasan
  rationale: Dignified at pamilyar na salin ng idyoma para sa pinakamataas na dako, at pinananatili ang ugnayan nito sa Lucas 2:14.
theological_decisions:
- issue: Maharlika at mesiyanikong pagpupugay sa pagpasok sa Jerusalem
  choice: Hayagang isinalin ang βασιλεὺς bilang “ang Hari.”
  alternative: “Pinagpala ang dumarating sa pangalan ng Panginoon.”
  rationale: Kasama sa teksto ni Lucas ang βασιλεὺς. Ang pagpapanatili rito ay naghahayag ng maharlikang diin ng talata nang walang idinadagdag na paliwanag na wala sa teksto.
- issue: Ugnayan sa Lucas 2:14
  choice: “Kapayapaan sa langit”
  alternative: “Kapayapaan sa lupa”
  rationale: Malinaw na ἐν οὐρανῷ, 'sa langit,' ang nasa pinagmulan. Pinananatili nito ang sinadyang pagkakaiba at teolohikal na tensiyon sa pahayag ng Lucas 2:14.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Haring dumarating” sa halip na mas mabigat na “Hari na dumarating,” at pinanatili ang siksik at patulang anyo ng dalawang pagbubunyi.
