base_translation:
  language: en
  yaml_path: translation/nt/luke/019/012.yaml
  text: So he said[a], “A certain nobleman went to a distant country to receive a kingdom for himself and return.”
translation:
  language: tl
  text: Kaya sinabi niya, “Isang lalaking mula sa angkang maharlika ang nagpunta sa isang malayong lupain upang tumanggap ng isang kaharian[a] para sa kanyang sarili at bumalik.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “paghahari” o “kapangyarihang maghari.” Ang salitang Griyego ay maaaring tumukoy sa kaharian mismo o sa pamamahala at awtoridad ng isang hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahihiwatig nito ang lohikal at pasalaysay na pagpapatuloy mula sa naunang talata nang hindi nagiging matigas ang tunog.
- source_word: Ἄνθρωπός τις
  choice: May isang lalaki
  rationale: Natural itong panimula sa isang di-tiyak na tauhan sa talinghaga at pinananatili ang di-tiyak na τις.
- source_word: εὐγενὴς
  choice: mula sa maharlikang angkan
  rationale: Tuwirang inilalarawan nito ang mataas o marangal na kapanganakan ng tauhan, sa halip na ipahiwatig lamang na marangal ang kanyang asal.
- source_word: ἐπορεύθη
  choice: nagpunta
  rationale: Payak at natural na katumbas ng pandiwa ng paglalakbay o pag-alis patungo sa ibang lugar.
- source_word: εἰς χώραν μακρὰν
  choice: sa isang malayong lupain
  rationale: Pinananatili ang heograpikal na layo at mas malawak ang saklaw ng “lupain” kaysa sa makabagong estadong ipinahihiwatig minsan ng “bansa.”
- source_word: λαβεῖν
  choice: upang tumanggap
  rationale: Ipinapakita ng konteksto na tatanggapin o ipagkakaloob sa kanya ang katayuang makahari, hindi na aagawin niya ito.
- source_word: ἑαυτῷ
  choice: para sa kanyang sarili
  rationale: Pinananatili ang reflexive na diwa na ang kaharian o paghahari ay tatanggapin niya para sa sarili niya.
- source_word: βασιλείαν
  choice: isang kaharian
  rationale: Natural itong salin at pinananatili ang konkretong larawang pampolitika, habang inilalahad sa talababa ang posibleng diwang paghahari o kapangyarihang makahari.
- source_word: ὑποστρέψαι
  choice: bumalik
  rationale: Maikli at tumpak na katumbas ng ikalawang infinitive na kaagapay ng λαβεῖν; hindi dinagdagan ng tahasang temporal na pang-ugnay.
theological_decisions:
- issue: Saklaw ng kahulugan ng βασιλείαν sa talinghagang may larawang pampolitika
  choice: isang kaharian
  alternative: paghahari; kapangyarihang maghari
  rationale: Maaaring tumukoy ang βασιλεία sa nasasakupan o sa mismong paghahari at awtoridad ng hari. Pinananatili ng “kaharian” ang pamilyar at konkretong larawan, samantalang ang talababa ay nag-iingat sa tunay na leksikal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mula sa maharlikang angkan” upang malinaw na tukuyin ang mataas na kapanganakan, at iniwasan ang pagdaragdag ng “pagkatapos” dahil walang hiwalay na temporal na pang-ugnay sa Griyego.
