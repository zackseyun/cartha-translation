  source_fidelity: Tumpak na naipapahayag ng salin ang pasalaysay na pagpapatuloy ng οὖν, ang di-tiyak na tauhan, ang pagpunta sa malayong lugar, ang pagtanggap ng βασιλεία, at ang magkaugnay na layuning tumanggap at bumalik. Gayunman, ang “maharlikang angkan” ay maaaring magpahiwatig ng angkang hari/royal family, samantalang ang εὐγενής ay mas malawak na tumutukoy sa taong mula sa angkang maharlika o may mataas na kapanganakan.
  naturalness: Ang “May isang lalaking mula sa …” ay nauunawaan ngunit bahagyang mabigat bilang pambungad sa talinghaga. Mas likas at mas tuwiran ang “Isang lalaking mula sa angkang maharlika.” Mas maayos din ang paglalagay ng “para sa kanyang sarili” pagkatapos ng “kaharian.”
  terminology: Pinananatili ang “kaharian” para sa βασιλείαν at ang talababa ay wastong nag-iingat sa mga posibleng kahulugang “paghahari” at “kapangyarihang maghari.” Ang “angkang maharlika” ay mas tumpak kaysa “maharlikang angkan,” dahil hindi nito nililimitahan ang katayuan sa pagiging maharlikang pamilya.
  issues:
