- from: Kaya sinabi niya, “May isang lalaking mula sa maharlikang angkan na nagpunta sa isang malayong lupain upang tumanggap para sa kanyang sarili ng isang kaharian[a] at bumalik.”
  to: Kaya sinabi niya, “Isang lalaking mula sa angkang maharlika ang nagpunta sa isang malayong lupain upang tumanggap ng isang kaharian[a] para sa kanyang sarili at bumalik.”
  rationale: Pinalitan ang pariralang maaaring magpahiwatig ng pagiging maharlikang pamilya ng “mula sa angkang maharlika,” na mas eksaktong tumutugma sa εὐγενής bilang mataas ang kapanganakan. Pinakinis din ang ayos ng pangungusap nang hindi nagdaragdag ng temporal na ugnayan o binabago ang saklaw ng βασιλείαν.
