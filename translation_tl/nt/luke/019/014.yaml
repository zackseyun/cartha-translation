lexical_decisions:
- source_word: πολῖται
  choice: mga mamamayan niya
  rationale: Pinananatili nito ang sibiko at pampolitikang diwa ng πολῖται. Iniwasan ang “mga nasasakupan” sapagkat maaga nitong ipinapalagay ang paghaharing tinatanggihan nila.
- source_word: ἐμίσουν
  choice: napopoot sa kanya
  rationale: Likas sa modernong Tagalog at naipahihiwatig ang nagpapatuloy o palagiang pagkapoot na ipinakikita ng imperfect.
- source_word: ἀπέστειλαν
  choice: nagpadala sila
  rationale: Tuwiran at natural na katumbas ng aorist na pandiwang pasalaysay.
- source_word: πρεσβείαν
  choice: isang delegasyon
  rationale: Tumutukoy sa isang pangkat ng mga kinatawang isinugo sa opisyal na misyon; malinaw at kasalukuyang gamit sa Filipino.
- source_word: ὀπίσω αὐτοῦ
  choice: na sumunod sa kanya
  rationale: Sa konteksto, isinugo ang delegasyon kasunod ng kanyang pag-alis. Mas malinaw ito sa Tagalog kaysa sa literal na “sa likuran niya.”
- source_word: λέγοντες
  choice: at nagsabi
  rationale: Natural na ikinakabit sa salaysay ang mensaheng dala ng delegasyon.
- source_word: Οὐ θέλομεν
  choice: Ayaw naming
  rationale: Karaniwan at tuwirang pagpapahayag ng pagtanggi o kawalan ng kagustuhan sa modernong Tagalog.
- source_word: τοῦτον
  choice: ang taong ito
  rationale: Naipapahayag ang bahagyang mapaglayo at mapanghamak na tono ng demonstrative nang hindi nagiging sobrang kolokyal.
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: maghari sa amin
  rationale: Pinananatili ang tiyak na maharlika at makaharing diwa ng βασιλεύω, sa halip na gawing pangkalahatang “mamuno.”
theological_decisions:
- issue: Pampolitika at makaharing larawan sa talinghaga
  choice: maghari sa amin
  alternative: mamuno sa amin
  rationale: Mahalaga sa larawan ng talinghaga ang tahasang wika ng pagkahari. Pinananatili ito nang hindi ipinapasok ang anumang paliwanag sa alegorikal na kahulugan ng tauhan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignidad ang tono, at natural sa karaniwang mambabasa. Ginamit ang “delegasyon” bilang pamilyar na terminong pampolitika; ipinaliwanag sa talababa para sa mga mambabasang hindi pamilyar dito.
