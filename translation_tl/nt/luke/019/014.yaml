  verdict: revise
  source_fidelity: 'Tumpak sa kabuuan ang mga pangunahing termino: ang πολῖται ay naipapakita bilang “mga mamamayan,” ang pagkamuhi bilang nagpapatuloy na saloobin, ang πρεσβεία bilang “delegasyon,” at ang βασιλεῦσαι bilang “maghari.” Gayunman, ang “Kaya” ay nagdaragdag ng ugnayang sanhi na wala sa simpleng καί (“at”) ng Griyego. Mas maingat ding ilahad ang ὀπίσω αὐτοῦ bilang pagpapadala ng delegasyon kasunod niya, nang hindi ginagawang tila ang delegasyon mismo ang pangunahing paksa ng “sumunod.”'
  naturalness: Natural ang karamihan ng draft, ngunit mas dumadaloy at mas tumpak ang magkakaugnay na salaysay sa “at nagsugo sila ng isang delegasyon kasunod niya.” Ang “kinapopootan siya” ay likas sa modernong Filipino at malinaw na nagpapahiwatig ng nagpapatuloy na pagkapoot.
  terminology: Ang “mga mamamayan,” “delegasyon,” at “maghari sa amin” ay angkop at pinananatili ang sibiko-pampolitika at makaharing diwa ng talinghaga. Ang talababa ay maayos; ang “embahada” ang tuwirang leksikal na alternatibo sa “delegasyon.”
