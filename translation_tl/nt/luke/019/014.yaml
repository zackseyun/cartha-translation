base_translation:
  language: en
  yaml_path: translation/nt/luke/019/014.yaml
  text: But his citizens hated him[a], and sent a delegation after him, saying, ‘We do not want this man to reign over us.’
translation:
  language: tl
  text: Ngunit kinapopootan siya ng kanyang mga mamamayan, at nagsugo sila ng isang delegasyon[a] kasunod niya, na nagsasabi, “Ayaw naming maghari sa amin ang taong ito.”
