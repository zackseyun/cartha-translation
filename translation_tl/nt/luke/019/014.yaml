  - severity: low
    issue: Maaaring linawin ang saklaw ng “na sumunod sa kanya.”
    rationale: Nauunawaan ang draft, ngunit ang ὀπίσω αὐτοῦ ay pangunahing naglalarawan sa pagpapadala ng delegasyon kasunod niya. Ang binagong ayos ay mas malapit sa saklaw ng parirala sa Griyego at mas maayos sa Filipino.
