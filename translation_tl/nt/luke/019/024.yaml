  text: καὶ τοῖς παρεστῶσιν εἶπεν· Ἄρατε ἀπ’ αὐτοῦ τὴν μνᾶν καὶ δότε τῷ τὰς δέκα μνᾶς ἔχοντι—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/024.yaml
  text: And he said to those standing by[a], ‘Take the mina from him and give it to the one who has the ten minas.’
translation:
  language: tl
  text: At sinabi niya sa mga nakatayong naroon, “Kunin ninyo sa kanya ang mina[a] at ibigay ito sa may sampung mina.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mina ay isang sinaunang yunit ng salapi; sa ilang tradisyonal na salin, “libra.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς παρεστῶσιν
  choice: sa mga nakatayong naroon
  rationale: Ang articular perfect participle ay tumutukoy sa mga taong nakatayo at naroroon sa tabi. Pinananatili ng salin ang kongkretong tagpo nang hindi nagdaragdag ng tiyak na tungkulin sa kanila.
- source_word: Ἄρατε ἀπ’ αὐτοῦ
  choice: Kunin ninyo sa kanya
  rationale: Sa kontekstong ito, ang αἴρω kasama ng ἀπό ay nangangahulugang alisin o kunin mula sa isang tao. Ipinakikita ng “ninyo” na maramihan ang pautos.
- source_word: τὴν μνᾶν
  choice: ang mina
  rationale: Ang μνᾶ ay isang sinaunang yunit ng salapi. Ang transliterasyong “mina” ay nagpapanatili sa makasaysayang tagpuan at umiiwas sa mapanlinlang na paghahambing sa modernong pera.
- source_word: δότε
  choice: ibigay ito
  rationale: Ang aorist imperative plural ng δίδωμι ay payak na utos na ilipat o ibigay ang mina. Idinagdag ang “ito” bilang likas na panghalip sa Tagalog na malinaw na tumutukoy sa mina.
- source_word: τῷ τὰς δέκα μνᾶς ἔχοντι
  choice: sa may sampung mina
  rationale: Likas at maikli sa modernong Tagalog ang “sa may” para sa substantival participle na “sa taong nagtataglay.” Hindi nito idinaragdag na lalaki ang tinutukoy, na hindi tahasang sinasabi ng Griyego.
theological_decisions:
- issue: Paglalarawan sa μνᾶ bilang sinaunang yunit ng salapi
  choice: mina
  alternative: libra
  rationale: Hindi ito usaping doktrinal, ngunit mahalaga sa tradisyon ng pagsasalin. Mas tapat sa sinaunang yunit ang “mina,” samantalang ang “libra” ay maaaring mapagkamalang modernong timbang o salapi.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang maramihang “ninyo” upang katawanin ang plural na mga pautos, at pinanatili ang “mina” bilang makasaysayang terminong pansalapi.
