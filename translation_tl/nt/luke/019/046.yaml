id: LUK.19.46
reference: Luke 19:46
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Γέγραπται· ⸂Καὶ ἔσται⸃ ὁ οἶκός μου οἶκος ⸀προσευχῆς, ὑμεῖς δὲ αὐτὸν ἐποιήσατε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/046.yaml
  text: saying to them[a], “It is written[b], ‘And my house shall be a house of prayer,’ but you have made it a den of robbers.”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Nasusulat, ‘At ang aking bahay[a] ay magiging bahay-dalanginan,’ ngunit ginawa ninyo itong lungga ng mga tulisan.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “aking templo.” “Aking bahay” ang literal na nasa Griyego at umaalingawngaw sa Isaias 56:7.
    reason: lexical_alternative
  - marker: b
    text: Ang “lungga ng mga tulisan” ay umaalingawngaw sa Jeremias 7:11. Ang “mga tulisan” ay maaari ring isaling “mga magnanakaw” o “mga bandido.”
    reason: cross_reference
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: Sinabi niya sa kanila
  rationale: Ginawang likas na pandiwang may panahunan sa Filipino ang Griyegong participle upang maayos na dumaloy bilang tuwirang pananalita, habang pinananatili ang diwang ‘sinasabi sa kanila.’
- source_word: Γέγραπται
  choice: Nasusulat
  rationale: Karaniwan at marangal na pormula sa Filipino para sa perpektong pasibong anyong nagpapakilala ng sipi mula sa Kasulatan.
- source_word: Καὶ ἔσται
  choice: At ... ay magiging
  rationale: Pinananatili ang panimulang pangatnig at ang hinaharap na diwa ng sipi.
- source_word: ὁ οἶκός μου
  choice: ang aking bahay
  rationale: Tuwirang pinananatili ang ‘bahay’ sa halip na ipaliwanag bilang ‘templo,’ upang mapanatili ang salitang ginamit sa sipi at ang alingawngaw ng Isaias 56:7.
- source_word: οἶκος προσευχῆς
  choice: bahay-dalanginan
  rationale: Likas at maikli sa Filipino, at malinaw na tumutukoy sa bahay na ukol sa panalangin.
- source_word: ὑμεῖς δὲ
  choice: ngunit ... ninyo
  rationale: Ipinapakita ng ‘ngunit’ ang matinding pagsalungat, at ng ‘ninyo’ ang tahasang pagbibigay-diin sa mga kausap.
- source_word: ἐποιήσατε
  choice: ginawa ninyo
  rationale: Ang payak na naganap na aspekto ay natural sa Filipino at ipinahihiwatig ng konteksto ang nananatiling bunga ng kanilang ginawa.
- source_word: σπήλαιον
  choice: lungga
  rationale: Sa alingawngaw ng Jeremias 7:11, ang tinutukoy ay taguan o kanlungan ng masasamang-loob, hindi lamang isang likas na kuweba.
- source_word: λῃστῶν
  choice: mga tulisan
  rationale: Saklaw nito ang mga mandarambong o bandido at hindi nito nililimitahan ang salita sa palihim na pagnanakaw lamang.
theological_decisions:
- issue: Kung isasalin ang οἶκος bilang ‘bahay’ o tahasang ‘templo’
  choice: ang aking bahay ... bahay-dalanginan
  alternative: ang aking templo ... bahay-dalanginan
  rationale: ‘Bahay’ ang mismong salita sa Griyego at pinananatili nito ang ugnayan sa Isaias 56:7, habang malinaw naman sa konteksto na templo ang tinutukoy.
- issue: Saklaw ng λῃστῶν
  choice: mga tulisan
  alternative: mga magnanakaw
  rationale: Maaaring tumukoy ang salita sa mga magnanakaw, mandarambong, o bandido. Pinananatili ng ‘mga tulisan’ ang mas malawak at maaaring marahas na diwa nang hindi ito ginagawang tiyak na pahayag tungkol sa paghihimagsik.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang pormulang “Nasusulat” at ang estilong pansipi ng mga propeta; ginamit ang “bahay-dalanginan” at “lungga ng mga tulisan” bilang malinaw at likas na mga parirala sa kontekstong biblikal.
