  source_fidelity: 'Tumpak na naipapahayag ang Griyegong teksto: ang panimulang pahayag kay sa mga kausap, ang pormulang pang-Kasulatan na Γέγραπται, ang panimulang “At” at hinaharap na “ay magiging,” ang literal na “aking bahay,” at ang mariing pagsalungat na “ngunit ... ninyo.” Ang “lungga ng mga tulisan” ay angkop sa idyomatikong alingawngaw ng Jeremias 7:11 at hindi labis na nililimitahan ang λῃστῶν.'
  naturalness: Likas at malinaw ang modernong Filipino, habang ang “Nasusulat” at ang anyo ng sipi ay may angkop na marangal na rehistro. Ang “bahay-dalanginan” ay isang nauunawaan at angkop na katumbas ng “bahay ng panalangin.”
  terminology: Maayos ang “aking bahay” bilang literal na pagsasalin ng οἶκος at pinananatili nito ang intertekstuwal na puwersa ng sipi. Ang “mga tulisan” ay mabuting malawak na katumbas ng λῃστῶν. Ang mga talababa ay tumpak, kapaki-pakinabang, at maayos na nakaangkla.
