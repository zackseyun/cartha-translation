  text: καὶ ἰδοὺ ἀνὴρ ὀνόματι ⸀καλούμενος Ζακχαῖος, καὶ αὐτὸς ἦν ἀρχιτελώνης καὶ ⸀αὐτὸς πλούσιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/002.yaml
  text: And behold[a], a man named Zacchaeus; he was a chief tax collector and was rich.
translation:
  language: tl
  text: At narito ang isang lalaking nagngangalang Zaqueo[a]; siya ay punong maniningil ng buwis, at mayaman siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tinatawag na Zaqueo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili nito ang panawag-pansin at kasiglahan ng salaysay, habang natural pa rin sa marangal na modernong Tagalog.
- source_word: ἀνὴρ
  choice: isang lalaki
  rationale: Tiyak na panlalaki at isahan ang pangngalan sa Griyego, kaya malinaw itong isinalin bilang isang lalaki.
- source_word: ὀνόματι καλούμενος
  choice: nagngangalang
  rationale: Ito ang likas at maikli ngunit tumpak na katumbas sa Tagalog ng idyomang nangangahulugang tinatawag o pinangalanang.
- source_word: Ζακχαῖος
  choice: Zaqueo
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: αὐτὸς ἦν
  choice: siya ay
  rationale: Natural na ipinagpapatuloy nito ang paksa nang hindi pinalalabis ang bahagyang diin ng panghalip.
- source_word: ἀρχιτελώνης
  choice: punong maniningil ng buwis
  rationale: Malinaw na ipinahahayag nito na si Zaqueo ay isang nakatataas o namumunong maniningil ng buwis.
- source_word: αὐτὸς πλούσιος
  choice: mayaman siya
  rationale: Tuwirang isinasalin ang πλούσιος at pinananatili sa natural na Tagalog ang muling pagbanggit sa panghalip.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ang “narito” ay sadyang pinanatili bilang panawag-pansin sa halip na alisin, at ang ayos na “mayaman siya” ay nagbibigay ng likas na banayad na diin sa inuulit na αὐτός.
