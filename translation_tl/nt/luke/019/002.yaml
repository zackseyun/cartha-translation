  source_fidelity: 'Tumpak na naisasalin ang lahat ng pangunahing sangkap ng Griyego: ang panawag-pansing καὶ ἰδού sa “At narito,” ang ἀνήρ bilang “isang lalaki,” ang idyomang ὀνόματι καλούμενος bilang “nagngangalang,” at ang dalawang predikasyon na siya ay punong maniningil ng buwis at mayaman. Hindi nagdaragdag ng impormasyong wala sa teksto.'
  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang “At narito ang isang lalaking nagngangalang Zaqueo” ay marangal ngunit hindi lipas, at ang “mayaman siya” ay likas na ayos na nagpapanatili ng banayad na diin ng inuulit na αὐτός.
