  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς ὅτι Σήμερον σωτηρία τῷ οἴκῳ τούτῳ ἐγένετο, καθότι καὶ αὐτὸς υἱὸς Ἀβραάμ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/009.yaml
  text: And Jesus said to him[a], “Today salvation has come to this house, because he too is a son of Abraham.”
translation:
  language: tl
  text: At sinabi ni Jesus sa kaniya, “Ngayon ay dumating ang kaligtasan sa sambahayang ito,[a] sapagkat siya rin ay anak ni Abraham.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bahay na ito.” Ang salitang Griyego ay maaaring tumukoy sa mismong bahay o sa sambahayang kaugnay nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: At sinabi
  rationale: Ang δέ ay banayad na pang-ugnay; natural na ipinagpapatuloy ng “At” ang salaysay nang hindi nagpapahiwatig ng matinding pagsalungat o tiyak na pagkakasunod.
- source_word: πρὸς αὐτὸν
  choice: sa kaniya
  rationale: Pinananatili ang tahasang panghalip sa Griyego at hindi idinaragdag ang pangalang Zaqueo sa talata.
- source_word: Σήμερον
  choice: Ngayon
  rationale: Ito ang natural na modernong katumbas at pinananatili ang pagbibigay-diin ng Griyego sa panahon sa unahan ng pahayag.
- source_word: σωτηρία
  choice: kaligtasan
  rationale: Pinananatili nito ang malawak at teolohikal na bigat ng salita sa Lucas, sa halip na limitahan ito sa karaniwang pagliligtas mula sa panganib.
- source_word: τῷ οἴκῳ τούτῳ
  choice: sa sambahayang ito
  rationale: Ang οἶκος ay maaaring tumukoy sa bahay o sa mga taong kabilang dito. Sa konteksto ng kaligtasang dumarating sa mga tao, natural ang “sambahayan,” habang itinatala sa talababa ang literal na alternatibo.
- source_word: ἐγένετο
  choice: dumating
  rationale: Bagaman ang γίνομαι ay maaaring mangahulugang nangyari o nagkaroon, ang “dumating ang kaligtasan” ay likas na idyoma sa Filipino at tapat sa diwa ng pagdating nito sa sambahayan.
- source_word: καθότι
  choice: sapagkat
  rationale: Malinaw nitong ipinakikita na ang kasunod na sugnay ang ibinigay na dahilan, sa isang marangal ngunit kasalukuyang rehistro.
- source_word: καὶ αὐτὸς
  choice: siya rin
  rationale: Pinananatili nito ang diin sa pagkabilang o pagsasama kay Zaqueo.
- source_word: υἱὸς Ἀβραάμ
  choice: anak ni Abraham
  rationale: Pinananatili ang orihinal na idyoma at ang maaaring etniko at tipanang pahiwatig nito, sa halip na paliitin ito sa “inapo” lamang.
theological_decisions:
- issue: Kahulugan ng “anak ni Abraham”
  choice: Pinanatili bilang “anak ni Abraham” nang hindi nililimitahan kung tumutukoy ito sa lahing pinagmulan, tunay na pagkabilang sa sambayanan ng pananampalataya, o kapuwa.
  alternative: “inapo ni Abraham” o “tunay na kabilang sa sambahayan ng pananampalataya ni Abraham”
  rationale: Hindi nilulutas ng mismong talata ang buong teolohikal na saklaw ng parirala. Ang pagpapanatili sa idyoma ay nag-iingat sa tunay na tensiyon at hinahayaang ang konteksto ni Lucas ang gumabay sa pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sambahayan” sa pangunahing teksto upang maging likas ang pananalita at maipahiwatig ang pangkat ng mga taong saklaw, ngunit pinanatili sa talababa ang literal na “bahay.”
