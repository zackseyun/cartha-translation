id: LUK.19.39
reference: Luke 19:39
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καί τινες τῶν Φαρισαίων ἀπὸ τοῦ ὄχλου εἶπαν πρὸς αὐτόν· Διδάσκαλε, ἐπιτίμησον τοῖς μαθηταῖς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/039.yaml
  text: And some of the Pharisees from the crowd said to him[a], “Teacher[b], rebuke your disciples.”
translation:
  language: tl
  text: Sinabi sa kanya ng ilan sa mga Pariseong nasa karamihan[a], “Guro[b], sawayin mo ang mga alagad mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa karamihan.”
    reason: lexical_alternative
  - marker: b
    text: O “Maestro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες τῶν Φαρισαίων
  choice: ilan sa mga Pariseo
  rationale: Ipinahahayag ng τινες na hindi lahat kundi isang di-tiyak na bahagi ng mga Pariseo ang nagsalita; natural sa modernong Tagalog ang “ilan sa mga Pariseo.”
- source_word: ἀπὸ τοῦ ὄχλου
  choice: nasa karamihan
  rationale: Ipinakikitang nagmula o kabilang sila sa karamihan. Pinili ang “nasa karamihan” upang maging malinaw at natural, habang inilalagay sa talababa ang mas literal na posibleng pagbasa.
- source_word: εἶπαν πρὸς αὐτόν
  choice: Sinabi sa kanya
  rationale: Karaniwang pormula ito sa pagsasalaysay para sa tuwirang pakikipag-usap; payak at natural ang salin.
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Tuwirang katumbas ng titulong tumutukoy sa nagtuturo, nang hindi nagdaragdag ng mas malakas na pahiwatig ng awtoridad o pagkakakilanlang teolohikal.
- source_word: ἐπιτίμησον
  choice: sawayin mo
  rationale: Naghahayag ang aorist imperative ng tuwirang utos na pagsabihan o pagalitan ang mga alagad. Ang “sawayin” ay natural at may sapat na lakas nang hindi ipinapalagay na tahimikín sila.
- source_word: τοῖς μαθηταῖς σου
  choice: ang mga alagad mo
  rationale: Pinananatili ng “mga alagad” ang ugnayang guro-alagad at ang kinagawiang bokabularyo ng mga Ebanghelyo.
theological_decisions:
- issue: Ang Διδάσκαλε bilang magalang na pantawag kay Jesus
  choice: Guro
  alternative: Panginoon
  rationale: Pedagohikal ang pangunahing kahulugan ng salita rito. Hindi dapat dagdagan ng salin ang mas malakas na kristolohikal o awtoritatibong pahiwatig na wala sa mismong termino.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “Pariseo,” “Guro,” “sawayin,” at “mga alagad” bilang malinaw at pamilyar na bokabularyong biblikal. Ang ayos ng pangungusap ay likas sa Tagalog at pinananatili ang di-tiyak na saklaw ng “ilan.”
