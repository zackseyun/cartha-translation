  source_fidelity: 'Tapat ang salin sa lahat ng pangunahing elemento ng Griyego: ang di-tiyak na bahaging “ilan sa mga Pariseo,” ang kanilang kaugnayan sa karamihan, ang pagsasalita kay Jesus, ang pantawag na “Guro,” at ang tuwirang pautos na “sawayin mo ang mga alagad mo.” Ang “nasa karamihan” ay isang likas na Tagalog na paglalapat ng ἀπὸ τοῦ ὄχλου; pinananatili ng talababa ang mas malapit na alternatibong “mula sa karamihan.”'
