  text: καὶ ὡς ἦλθεν ἐπὶ τὸν τόπον, ἀναβλέψας ὁ ⸀Ἰησοῦς εἶπεν πρὸς αὐτόν· Ζακχαῖε, σπεύσας κατάβηθι, σήμερον γὰρ ἐν τῷ οἴκῳ σου δεῖ με μεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/005.yaml
  text: And when Jesus came to the place[a], he looked up and said to him, “Zacchaeus, hurry and come down[b], because today I must stay at your house.”
translation:
  language: tl
  text: Pagdating ni Jesus sa lugar na iyon, tumingala siya at sinabi sa kanya, “Zaqueo, magmadali kang bumaba, sapagkat kailangan kong[a] manatili sa bahay mo ngayon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kailangan” ay maaaring magpahiwatig ng pangangailangang kaugnay ng misyon ni Jesus o ng layunin ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: pagdating
  rationale: Sa salaysay, ipinakikilala ng ὡς ang panahong naganap ang kasunod na kilos. Likas sa modernong Tagalog ang “pagdating” para sa ganitong temporal na sugnay.
- source_word: ἐπὶ τὸν τόπον
  choice: sa lugar na iyon
  rationale: Tumutukoy ito sa tiyak na lugar na kinaroroonan ni Zaqueo. Nililinaw ng “na iyon” ang konteksto nang hindi nagdaragdag ng bagong impormasyon.
- source_word: ἀναβλέψας
  choice: tumingala siya
  rationale: Ipinahihiwatig ng pandiwa na itinuon ni Jesus ang tingin pataas, kung saan naroon si Zaqueo sa puno.
- source_word: εἶπεν πρὸς αὐτόν
  choice: sinabi sa kanya
  rationale: Ito ang natural at malinaw na katumbas sa Tagalog ng karaniwang pormula ng pagsasalita.
- source_word: Ζακχαῖε
  choice: Zaqueo
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino.
- source_word: σπεύσας κατάβηθι
  choice: magmadali kang bumaba
  rationale: Pinagsasama nito ang diwa ng pagmamadali sa tuwirang utos na bumaba, sa natural na anyong Tagalog.
- source_word: σήμερον γὰρ
  choice: sapagkat … ngayon
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ibinibigay ng γάρ, samantalang ang “ngayon” ay natural na inilagay malapit sa pandiwang “manatili.”
- source_word: ἐν τῷ οἴκῳ σου
  choice: sa bahay mo
  rationale: Sa konteksto, ang οἶκος ay tirahan ni Zaqueo. Ang “sa bahay mo” ay tuwiran, natural, at hindi nagpapasya kung gaano katagal ang pananatili.
- source_word: δεῖ
  choice: kailangan kong
  rationale: Pinananatili nito ang malakas na diwa ng pangangailangan o kinakailangang mangyari, nang hindi tahasang ipinapaliwanag sa pangunahing teksto ang pinagmumulan ng pangangailangang iyon.
- source_word: μεῖναι
  choice: manatili
  rationale: Sapat ang lawak ng “manatili” upang saklawin ang paglagi ni Jesus sa bahay ni Zaqueo, nang hindi ipinapalagay kung ito ay simpleng pagdalaw o magdamagang pagtuloy.
theological_decisions:
- issue: Diwa ng δεῖ sa salaysay ni Lucas
  choice: kailangan kong manatili
  alternative: dapat akong manatili; kinakailangang manatili ako
  rationale: Madalas gamitin ni Lucas ang δεῖ para sa pangangailangang kaugnay ng misyon ni Jesus at layunin ng Diyos. Pinananatili ng “kailangan kong” ang bigat ng pangangailangan ngunit hindi nito tahasang nilulutas sa salin kung ito ay banal na itinakda, bunga ng misyon, o kapwa.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “sapagkat” upang panatilihin ang dignidad ng pananalita, at ang “magmadali kang bumaba” para sa malinaw na agarang utos. Hindi sinunod ang pagkakalagay ng mga talababa sa English consultation layer dahil hindi tugma roon ang mga marker at paliwanag; inilagay ang tanging kinakailangang tala sa pariralang kaugnay ng δεῖ.
