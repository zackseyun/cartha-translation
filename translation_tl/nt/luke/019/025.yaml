  text: καὶ εἶπαν αὐτῷ· Κύριε, ἔχει δέκα μνᾶς—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/025.yaml
  text: And they said to him[a], ‘Lord[b], he has ten minas—’
translation:
  language: tl
  text: At sinabi nila sa kanya, “Panginoon[a], mayroon siyang sampung mina[b]—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ginoo” o “Amo.”
    reason: lexical_alternative
  - marker: b
    text: Ang mina ay isang sinaunang yunit ng salapi na katumbas ng humigit-kumulang isang daang araw na sahod.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pag-uugnay sa salaysay nang hindi nagdaragdag ng tahasang panahunan o pagsalungat.
- source_word: εἶπαν αὐτῷ
  choice: sinabi nila sa kanya
  rationale: Likas na salin sa Filipino ng aorist na pandiwa at ng datibong di-tuwirang layon.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili ang karaniwang kahulugan at diwa ng awtoridad ng κύριος; sa konteksto ng talinghaga, maaari rin itong maging magalang na tawag na “Ginoo” o “Amo,” kaya inilagay ang mga iyon sa talababa.
- source_word: ἔχει
  choice: mayroon siya
  rationale: Tuwirang ipinahahayag ang kasalukuyang pagmamay-ari nang hindi idinaragdag ang di-tahasang diin na “mayroon na.”
- source_word: δέκα μνᾶς
  choice: sampung mina
  rationale: Isinalin ang bilang at tinumbasan sa pamamagitan ng transliterasyon ang sinaunang yunit ng salapi upang hindi ito mapagkamalang modernong pera.
theological_decisions:
- issue: Pagtawag na κύριος sa loob ng talinghaga
  choice: Panginoon
  alternative: Ginoo o Amo
  rationale: Pinananatili ng “Panginoon” ang leksikal na halaga at diwa ng awtoridad, ngunit hindi ipinagpapalagay na ang gamit dito ay tahasang kristolohikal; kinikilala sa talababa ang posibleng karaniwang magalang na pagtawag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang putol na pagtatapos sa pamamagitan ng gitling upang katawanin ang biglang pagsingit o hindi natapos na pahayag sa konteksto.
