  - severity: low
    issue: Walang hayag na layon ang “gigipitin” sa ikalawang pangungusap.
    rationale: Nauunawaan ito mula sa naunang sugnay, ngunit ang “gigipitin ka nila” ay mas malinaw at nananatiling malapit sa Griyego.
