lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikita ang ugnayang sanhi o paliwanag sa naunang panaghoy at babala ni Jesus.
- source_word: ἥξουσιν ἡμέραι ἐπὶ σὲ
  choice: darating sa iyo ang mga araw
  rationale: Pinananatili ang makahulang idyoma at ang diwang sasapit sa Jerusalem ang itinakdang mga pangyayari.
- source_word: παρεμβαλοῦσιν οἱ ἐχθροί σου
  choice: magtatayo ang iyong mga kaaway
  rationale: Sa konteksto ng pagkubkob, tumutukoy ang pandiwa sa pagtatayo o paglalagay ng kagamitang pandigma.
- source_word: χάρακά σοι
  choice: tanggulang pangkubkob laban sa iyo
  rationale: Ipinahahayag ang isang itinayong harang o muog na ginagamit sa pagkubkob; malinaw ang layuning militar nang hindi labis na nililimitahan ang uri ng estruktura.
- source_word: περικυκλώσουσίν σε
  choice: Paliligiran ka nila
  rationale: Tuwiran at likas na salin ng ganap na pag-ikot ng hukbo sa lunsod.
- source_word: συνέξουσίν σε πάντοθεν
  choice: gigipitin sa lahat ng panig
  rationale: Inihahatid ang diwa ng pagkulong at mahigpit na pagdiin mula sa bawat direksiyon.
theological_decisions:
- issue: Ang tinutukoy ng pang-isahang panghalip na ikalawang panauhan
  choice: Pinanatili ang pang-isahang “iyo/ka” bilang tuwirang pagtukoy sa Jerusalem na isinatao.
  alternative: Gawing tahasang maramihan o tukuyin ang mga naninirahan sa Jerusalem.
  rationale: Pang-isahan ang mga panghalip sa Griyego at umaayon ito sa makahulang pagsasatao sa Jerusalem; hindi pinalalawak ng salin ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang terminong “tanggulang pangkubkob” upang maging madaling maunawaan ang kontekstong militar, habang inilagay sa talababa ang lehitimong alternatibong “harang na pangkubkob.”
