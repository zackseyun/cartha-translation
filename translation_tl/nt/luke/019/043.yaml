  text: For days will come upon you when your enemies will build an embankment against you and surround you and hem you in on every side,[a]
translation:
  language: tl
  text: Sapagkat darating sa iyo ang mga araw na magtatayo ang iyong mga kaaway ng harang na pangkubkob laban sa iyo.[a] Paliligiran ka nila at gigipitin ka nila mula sa lahat ng panig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “rampang pangkubkob laban sa iyo.”
