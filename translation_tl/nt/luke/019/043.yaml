  source_fidelity: 'Tumpak ang pangkalahatang daloy ng hula: darating ang mga araw, magtatayo ang mga kaaway ng gawaing pangkubkob laban sa Jerusalem, palilibutan ito, at gigipitin mula sa lahat ng panig. Gayunman, ang “tanggulan” ay karaniwang depensibong kuta o fortipikasyon; hindi nito sapat na inihahatid ang χάραξ bilang siege work na itinayo ng mga kaaway laban sa lunsod.'
  naturalness: Likas at angkop sa makabagong Filipino ang “Sapagkat darating sa iyo ang mga araw,” “Paliligiran ka nila,” at “gigipitin ka nila mula sa lahat ng panig.” Ang pagdaragdag ng “ka nila” sa huling sugnay ay nagpapalinaw ng sintaks nang walang dagdag na kahulugan.
  terminology: Pinalitan ang “tanggulang pangkubkob” ng “harang na pangkubkob,” isang mas neutral at angkop na tawag sa χάραξ sa konteksto ng pagkubkob. Inilagay ang “rampang pangkubkob” bilang lehitimong mas teknikal na alternatibo sa talababa.
  issues:
