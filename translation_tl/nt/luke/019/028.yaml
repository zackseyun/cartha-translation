  text: Καὶ εἰπὼν ταῦτα ἐπορεύετο ἔμπροσθεν ἀναβαίνων εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/028.yaml
  text: And after saying these things, he went on ahead, going up to Jerusalem.
translation:
  language: tl
  text: Matapos niyang sabihin ang mga ito, nagpatuloy siya sa unahan, paakyat patungong Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: (hindi hiwalay na isinalin)
  rationale: Ang Καὶ ay pang-ugnay sa pagpapatuloy ng salaysay. Sa modernong Tagalog, natural na naipahihiwatig ang pagkakasunod-sunod sa pambungad na “Pagkasabi” nang hindi na nagdaragdag ng “At.”
- source_word: εἰπὼν ταῦτα
  choice: Pagkasabi niya nito
  rationale: Ipinapakita ng “Pagkasabi” na nauna ang pagsasalita sa pangunahing kilos. Ang “nito” ay likas na paraan sa Tagalog upang tukuyin ang kabuuan ng naunang sinabi nang hindi nililimitahan iyon sa iisang pangungusap.
- source_word: ἐπορεύετο
  choice: nagpatuloy siya
  rationale: Ipinahahayag ng imperpektong anyo ang nagpapatuloy na pagkilos sa salaysay. Ang “nagpatuloy” ay natural at hindi kasing-tigas ng literal na “siya ay naglalakad.”
- source_word: ἔμπροσθεν
  choice: sa unahan
  rationale: Pinananatili nito ang diwang si Jesus ay nauuna sa mga kasama niya, kahit hindi tahasang binabanggit sa Griyego ang layon na “nila.”
- source_word: ἀναβαίνων
  choice: paakyat
  rationale: Maikli at natural na ipinahahayag ang kasabay na pag-akyat, habang pinananatili ang wika ng pag-ahon patungong Jerusalem.
- source_word: εἰς Ἱεροσόλυμα
  choice: sa Jerusalem
  rationale: Kasama ng “paakyat,” malinaw na ang Jerusalem ang patutunguhan. Hindi ipinahihiwatig ng salin na nakapasok na siya sa lungsod.
theological_decisions:
- issue: Kung pananatilihin ang literal na wika ng pag-akyat patungong Jerusalem
  choice: paakyat sa Jerusalem
  alternative: patungo sa Jerusalem
  rationale: Ang ἀναβαίνων ay tahasang nagsasaad ng pag-akyat. Ang pagpapanatili nito ay tapat sa heograpikal at pansalaysay na anyo ng teksto nang hindi nagdaragdag ng tiyak na teolohikal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang sobrang literal na “mga bagay na ito” at ginamit ang idiomatikong “nito,” habang pinanatili ang magkahiwalay na ideya ng pag-una at pag-akyat.
