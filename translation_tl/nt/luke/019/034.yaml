  text: οἱ δὲ εἶπαν ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/034.yaml
  text: And they said[a], “The Lord has need of it.”
translation:
  language: tl
  text: At sinabi nila, “Kailangan ito ng Panginoon.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Kailangan ito ng may-ari,” kung ang κύριος ay nangangahulugang amo o may-ari sa halip na titulo para kay Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: At sinabi nila
  rationale: Ang δέ ay banayad na pang-ugnay sa pagpapatuloy ng salaysay; natural itong isalin na “At.” Ang substantibong οἱ ay tumutukoy sa mga alagad na nabanggit na, kaya “nila.”
- source_word: εἶπαν
  choice: sinabi
  rationale: Ang aorist ng λέγω ay payak na “sinabi”; hindi na idinagdag ang diwang “sumagot” na hindi tahasang nasa pandiwa.
- source_word: ὅτι
  choice: ipinahiwatig ng panipi
  rationale: Nagpapakilala ito ng tuwirang pananalita, na natural na ipinakikita sa Filipino sa pamamagitan ng mga panipi.
- source_word: Ὁ κύριος
  choice: ang Panginoon
  rationale: Karaniwang titulo ito para kay Jesus sa Lucas, ngunit maaari ring mangahulugang panginoon o may-ari; pinanatili sa talababa ang tunay na posibilidad na iyon.
- source_word: αὐτοῦ
  choice: siya
  rationale: Tumutukoy ang panghalip sa batang asno na naunang binanggit. Sa natural na Filipino, maaaring gamitin ang “siya” para sa hayop; iniiwasan din nitong ulitin nang higit sa Griyego ang “batang asno.”
- source_word: χρείαν ἔχει
  choice: Kailangan siya
  rationale: Ang idyoma ay literal na “may pangangailangan [sa kaniya/rito],” ngunit ang “Kailangan siya” ang natural at malinaw na katumbas sa modernong Filipino.
theological_decisions:
- issue: Ang tinutukoy ng κύριος sa sagot ng mga alagad
  choice: “Panginoon,” na sa konteksto ay malamang na tumutukoy kay Jesus
  alternative: “panginoon” o “may-ari,” na tumutukoy sa amo o may-ari ng batang asno
  rationale: Ang parirala ay ang sagot na paunang itinuro ni Jesus, at madalas gamitin ni Lucas ang κύριος bilang titulo para kay Jesus. Gayunman, maaari ring mangahulugan ang salita ng amo o may-ari, kaya hindi inalis ang leksikal na kalabuan at inilagay ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na natural, maikli, at marangal. Pinili ang karaniwang ayos na “Kailangan siya ng Panginoon” sa halip na ang mas literal ngunit hindi gaanong natural na “May pangangailangan sa kaniya ang Panginoon.”
