  text: ⸀λέγων· Ὑπάγετε εἰς τὴν κατέναντι κώμην, ἐν ᾗ εἰσπορευόμενοι εὑρήσετε πῶλον δεδεμένον, ἐφ’ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν, ⸀καὶ λύσαντες αὐτὸν ἀγάγετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/030.yaml
  text: saying, “Go into the village opposite you, in which, as you enter, you will find a colt tied up, on which no one among men has ever sat. Untie it and bring it.”
translation:
  language: tl
  text: Sinabi niya, “Pumunta kayo sa nayong nasa tapat ninyo. Pagpasok ninyo roon, makikita ninyo ang isang batang asno na nakatali, na hindi pa kailanman nasakyan ng sinumang tao. Kalagan ninyo ito at dalhin ninyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κώμη
  choice: nayon
  rationale: Likas at malinaw na katumbas ng isang maliit na pamayanan; pinananatili ang kaibhan nito sa lungsod.
- source_word: πῶλον
  choice: batang asno
  rationale: Ang πῶλος ay batang hayop, at nililinaw ng konteksto sa salaysay na ito na asno ang tinutukoy.
- source_word: δεδεμένον
  choice: nakatali
  rationale: Tuwirang ipinapahayag ang perpektong pasibong anyo at ang umiiral na kalagayan ng hayop.
- source_word: λύσαντες
  choice: Kalagan
  rationale: Ang 'kalagan' ang natural na utos sa Filipino para sa pagpapakawala sa isang hayop mula sa pagkakatali.
- source_word: ἀγάγετε
  choice: dalhin dito
  rationale: Ipinahihiwatig ng utos na dalhin ang hayop sa kinaroroonan ni Jesus; natural sa Filipino ang tahasang 'dito'.
theological_decisions:
- issue: Ang hayop ay hindi pa nasasakyan
  choice: hindi pa kailanman nasakyan ng sinuman
  alternative: hindi pa kailanman nauupuan ng sinumang tao
  rationale: Pinananatili ang diin ng οὐδεὶς πώποτε ἀνθρώπων habang ginagamit ang natural na pandiwa para sa pagsakay sa hayop, nang hindi nagdaragdag ng teolohikal na paliwanag.
translation_notes:
  register: Modernong Filipino na simple, marangal, at angkop sa pasalitang utos. Ginamit ang 'kayo/ninyo' upang katawanin ang maramihang anyo ng mga utos sa Griyego.
