  text: πορευομένου δὲ αὐτοῦ ὑπεστρώννυον τὰ ἱμάτια ⸀ἑαυτῶν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/036.yaml
  text: And as he went[a], they were spreading their cloaks on the road.
translation:
  language: tl
  text: At habang nagpapatuloy siya, inilalatag nila sa daan ang kanilang mga balabal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kasuotan” o “mga panlabas na kasuotan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευομένου δὲ αὐτοῦ
  choice: At habang nagpapatuloy siya
  rationale: Ang genitive absolute na may pangkasalukuyang participle ay nagsasaad ng kasabay at nagpapatuloy na kilos. Likas sa modernong Tagalog ang “habang nagpapatuloy siya,” at ang “At” ay nagpapakita ng banayad na pagpapatuloy ng salaysay na ipinahihiwatig ng δέ.
- source_word: ὑπεστρώννυον
  choice: inilalatag nila
  rationale: Ang imperfect ay naglalarawan ng nagpapatuloy o paulit-ulit na pagkilos habang dumaraan siya. Sa Tagalog, malinaw na naipahihiwatig ito ng kontekstong “habang” kasama ng “inilalatag.”
- source_word: τὰ ἱμάτια ἑαυτῶν
  choice: ang kanilang mga balabal
  rationale: Ang ἱμάτια ay tumutukoy sa mga kasuotan at madalas sa panlabas na kasuotan. Ang “mga balabal” ay kongkreto, natural, at angkop sa mga kasuotang inilalatag sa daan.
- source_word: ἐν τῇ ὁδῷ
  choice: sa daan
  rationale: Nagsasaad ang parirala ng lugar. Ang “sa daan” ang pinakanatural na Tagalog para sa mga kasuotang inilatag sa daraanan.
