id: LUK.19.33
reference: Luke 19:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λυόντων δὲ αὐτῶν τὸν πῶλον εἶπαν οἱ κύριοι αὐτοῦ πρὸς αὐτούς· Τί λύετε τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/033.yaml
  text: And as they were untying the colt[a], its owners said to them, “Why are you untying the colt?”
translation:
  language: tl
  text: Habang kinakalagan nila ang batang asno, sinabi sa kanila ng mga may-ari nito[a], “Bakit ninyo kinakalagan ang batang asno?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga amo nito.” Ang salitang Griyego ay pangmaramihan ng κύριος, na maaaring mangahulugang “panginoon” o “amo”; dito ay tumutukoy ito sa mga taong nagmamay-ari sa batang asno.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυόντων / λύετε
  choice: kinakalagan / kinakalagan
  rationale: Ipinahahayag ng unang anyo ang kilos na kasabay ng pangunahing pandiwa, at ang ikalawa ay nasa kasalukuyang tanong. Ang pag-uulit sa “kinakalagan” ay nagpapanatili sa ugnayang leksikal ng dalawang anyo ng λύω at angkop sa pagtatanggal ng tali ng hayop.
- source_word: δὲ
  choice: habang
  rationale: Hindi na isinalin nang bukod ang mahinang pang-ugnay na δέ; likas na naipagpapatuloy ang salaysay sa Filipino sa pamamagitan ng sugnay na “Habang…”.
- source_word: αὐτῶν
  choice: nila
  rationale: Tumutukoy ang panghalip sa dalawang alagad sa naunang konteksto nang hindi inuulit o dinaragdagan ang pagkakakilanlan nila.
- source_word: πῶλον
  choice: batang asno
  rationale: Bagaman maaaring tumukoy ang πῶλος sa batang hayop sa pangkalahatan, malinaw sa naunang konteksto na batang asno ito. Mas malinaw sa karaniwang mambabasa ang “batang asno” kaysa sa hiram o malabong katawagan.
- source_word: εἶπαν
  choice: sinabi
  rationale: Tuwirang katumbas ito ng karaniwang pandiwang λέγω. Ang siping sumusunod ang nagpapakitang patanong ang sinabi.
- source_word: οἱ κύριοι αὐτοῦ
  choice: mga may-ari nito
  rationale: Dito, ang κύριοι ay tumutukoy sa mga taong nagmamay-ari sa hayop, hindi sa isang teolohikal na titulo. Natural at tiyak sa modernong Filipino ang “mga may-ari.”
- source_word: πρὸς αὐτούς
  choice: sa kanila
  rationale: Likas na katumbas sa Filipino ng pariralang tumutukoy sa mga kinausap.
- source_word: Τί
  choice: Bakit
  rationale: Sa idyomang ito, humihingi ang τί ng dahilan sa kilos; malinaw at natural ang “Bakit.”
theological_decisions:
- issue: Pagpapakahulugan sa κύριοι sa konteksto ng pagmamay-ari ng tao
  choice: mga may-ari
  alternative: mga amo / mga panginoon
  rationale: Iniiwasan ng “mga may-ari” ang maling teolohikal na pahiwatig ng “mga panginoon” habang tumpak na ipinahahayag ang papel ng mga taong may karapatan sa batang asno. Itinatala sa talababa ang mas literal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kinakalagan” upang ilarawan ang kongkretong pagtatanggal ng tali at mapanatili ang pag-uulit sa Griyego. Inilagay ang talababa sa “mga may-ari nito,” ang pariralang talagang may leksikal na alternatibo.
