  verdict: approve
  source_fidelity: 'Tapat ang salin sa pangunahing daloy ng Griyego: ang paglapit ni Jesus, ang pagkakita niya sa lungsod, at ang pag-iyak niya dahil/ukol dito. Ang “iniyakan niya ito” ay likas na Filipino para sa κλαίω ἐπ’ αὐτήν at hindi nagdaragdag ng diwang wala sa pinagmulan.'
  naturalness: Natural at marangal ang modernong Filipino. Ang “nang papalapit na siya” at “pagkakita niya sa lungsod” ay maayos na nagpapahayag ng kaugnayan ng mga kilos, bagaman bahagyang mas maluwag kaysa sa anyong participial ng Griyego; hindi nito binabago ang kahulugan.
  terminology: Wasto ang “lungsod” para sa πόλις at “iniyakan” para sa ἔκλαυσεν sa kontekstong ito. Wasto ring gamitin ang “ito,” sapagkat walang kasariang gramatikal ang panghalip na Filipino at hindi kailangan ng teksto ang tahasang personipikasyon.
