id: LUK.19.41
reference: Luke 19:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὡς ἤγγισεν, ἰδὼν τὴν πόλιν ἔκλαυσεν ἐπ’ ⸀αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/041.yaml
  text: And as he drew near[a], seeing the city, he wept over it,
translation:
  language: tl
  text: At nang papalapit na siya, pagkakita niya sa lungsod ay iniyakan niya ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “tumangis siya dahil dito.” Sa Griyego, pambabae ang anyo ng panghalip dahil pambabae ang kasariang gramatikal ng salitang “lungsod”; walang ganitong pagkakaiba ang “ito” sa Filipino.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἤγγισεν
  choice: nang papalapit na siya
  rationale: Ipinahahayag ng ἐγγίζω ang paglapit. Pinananatili ng pariralang ito ang kilos na nagpapatuloy patungo sa lungsod nang hindi tahasang dinaragdagan ang layon na malinaw na sa konteksto.
- source_word: ἰδὼν τὴν πόλιν
  choice: pagkakita niya sa lungsod
  rationale: Natural itong katumbas ng aorist participle at tuwirang iniuugnay ang pagkakita sa lungsod sa sumunod na pagtangis. Hindi idinagdag ang pangalang Jerusalem sapagkat πόλις lamang ang nasa teksto at malinaw na ito sa konteksto.
- source_word: ἔκλαυσεν
  choice: iniyakan niya
  rationale: Ang κλαίω ay tumutukoy sa pag-iyak o pagtangis. Sa konstruksiyong may ἐπί, likas sa Filipino ang pandiwang “iniyakan,” na nagpapahayag ng matinding dalamhati para sa tinutukoy nang hindi nagdaragdag ng antas gaya ng “mapait na tumangis.”
- source_word: ἐπ’ αὐτήν
  choice: ito
  rationale: Ang ἐπί na may accusative kasunod ng κλαίω ay nagpapahayag ng pag-iyak dahil sa o ukol sa lungsod. Ang “ito” ang natural na panghalip sa modernong Filipino at hindi nagpapasya kung personipikado ang lungsod.
theological_decisions:
- issue: Kung dapat ipahiwatig sa salin ang pambabaeng anyong gramatikal ng αὐτήν na tumutukoy sa πόλις
  choice: Gamitin ang walang-kasariang “ito”
  alternative: Ulitin ang “lungsod” o gawing tahasang personipikado ang Jerusalem
  rationale: May pambabaeng kasariang gramatikal ang πόλις at αὐτήν sa Griyego, ngunit walang katumbas na kasariang gramatikal ang panghalip na Filipino na “ito.” Hindi rin sapilitang hinihingi ng talata na personipikahin ang lungsod, kaya hindi nagdaragdag ang salin ng “siya” o “babae” na maaaring magpasok ng interpretasyon.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinanatili ang maikling daloy ng Griyego at iniwasang idagdag ang “Jerusalem,” na ipinahihiwatig na ng konteksto.
