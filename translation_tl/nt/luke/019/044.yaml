id: LUK.19.44
reference: Luke 19:44
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐδαφιοῦσίν σε καὶ τὰ τέκνα σου ἐν σοί, καὶ οὐκ ἀφήσουσιν ⸂λίθον ἐπὶ λίθον ἐν σοί⸃, ἀνθ’ ὧν οὐκ ἔγνως τὸν καιρὸν τῆς ἐπισκοπῆς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/044.yaml
  text: and they will level you to the ground[a], and your children within you, and they will not leave one stone upon another within you, because you did not recognize the time of your visitation.
translation:
  language: tl
  text: at ibabagsak ka nila hanggang sa lupa, pati ang iyong mga anak na nasa loob mo. Hindi sila mag-iiwan ng kahit isang batong nakapatong sa isa pang bato sa loob mo, sapagkat hindi mo nakilala ang panahon ng pagdalaw sa iyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “panahon ng pagsisiyasat sa iyo.” Ang salitang Griyego ay maaaring mangahulugang pagdalaw o pagsisiyasat, lalo na ang pagdalaw ng Diyos na maaaring magdala ng awa o paghatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδαφιοῦσίν
  choice: ibabagsak ... sa lupa
  rationale: Ipinahahayag ng pandiwa ang marahas na pagpapabagsak o paggiba hanggang sa lupa. Natural ito sa modernong Tagalog at hindi pinahihina ang tindi ng larawan.
- source_word: σε
  choice: ka
  rationale: Pinananatili ang tuwirang pakikipag-usap sa Jerusalem na inilalarawan bilang isang tao, sa halip na ipaliwanag itong ‘ang iyong lungsod.’
- source_word: τὰ τέκνα σου ἐν σοί
  choice: ang iyong mga anak na nasa loob mo
  rationale: Pinananatili ang literal na ‘mga anak’ at ang personipikasyon ng Jerusalem bilang ina; tumutukoy sa mga taong nasa lungsod nang hindi pinapantay ang larawan sa ‘mga naninirahan.’
- source_word: οὐκ ἀφήσουσιν λίθον ἐπὶ λίθον ἐν σοί
  choice: hindi sila mag-iiwan sa loob mo ng isang bato sa ibabaw ng isa pang bato
  rationale: Malinaw at natural na inilalarawan ang lubusang pagkawasak habang tahasang pinananatili ang ‘sa loob mo.’
- source_word: ἀνθ’ ὧν
  choice: sapagkat
  rationale: Sa konteksto, ipinakikilala nito ang dahilan ng hatol; ang ‘sapagkat’ ay malinaw, marangal, at natural.
- source_word: ἔγνως
  choice: nakilala
  rationale: 'Higit sa simpleng pagkaalam ang diwa rito: hindi kinilala o napag-unawa ng Jerusalem ang mapagpasyang pagdating. Ang ‘nakilala’ ay nagpapanatili ng ganitong saklaw.'
- source_word: καιρὸν
  choice: panahon
  rationale: Tumutukoy sa makabuluhan o itinakdang pagkakataon. Ang ‘panahon’ ay natural at hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: τῆς ἐπισκοπῆς σου
  choice: ng pagdalaw sa iyo
  rationale: Ang ‘pagdalaw’ ay nagpapanatili sa biblikal na diwa ng isang makabuluhang pagdalaw, lalo na ng Diyos, nang hindi tahasang nilulutas kung awa o paghatol ang diin. Inililipat ng ‘sa iyo’ ang relasyon ng σου sa natural na Tagalog.
theological_decisions:
- issue: Kahulugan ng ἐπισκοπή sa konteksto ng paghatol
  choice: pagdalaw sa iyo, na hindi tahasang tinutukoy kung sino ang dumalaw
  alternative: pagsisiyasat sa iyo; panahon nang dalawin ka ng Diyos
  rationale: Maaaring tumukoy ang salita sa pagdalaw o pagsisiyasat, at ang banal na pagdalaw ay maaaring magdala ng awa o paghatol. Pinananatili ng salin ang teolohikal na tensiyon at hindi idinaragdag sa pangunahing teksto ang tahasang ‘ng Diyos,’ bagaman ipinahihiwatig iyon ng konteksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang personipikasyon ng Jerusalem sa mga anyong ‘ka,’ ‘mga anak mo,’ at ‘loob mo.’ Ginamit ang ‘pagdalaw’ sa halip na mas teknikal na ‘pagsisiyasat,’ at inilagay ang alternatibo sa talababa.
