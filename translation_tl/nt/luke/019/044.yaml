  source_fidelity: Tumpak ang pangunahing diwa at napapanatili ang personipikadong pagtawag sa Jerusalem. Gayunman, ang “kasama ang iyong mga anak” ay maaaring magpahiwatig lamang ng pagsama, sa halip na isama sila bilang tuwirang layon ng pagpapabagsak; mas malinaw ang “pati ang iyong mga anak.”
  naturalness: Makabago at marangal ang rehistro. Mas idiomatiko ang “kahit isang batong nakapatong sa isa pang bato” kaysa “ng isang bato sa ibabaw ng isa pang bato,” habang malinaw pa ring pinananatili ang larawan ng lubos na paggiba.
  terminology: Ang “pagdalaw sa iyo” ay angkop para sa ἐπισκοπή at hindi labis na itinatakda kung ito ay pagdalaw para sa awa o paghatol. Ang talababa ay angkop na nagbibigay ng “pagsisiyasat” bilang alternatibo.
  issues:
