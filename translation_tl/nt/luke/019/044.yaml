    issue: Ang “kasama ang iyong mga anak” ay hindi sapat na tuwirang nag-uugnay sa “mga anak” sa pandiwang “ibabagsak.”
    rationale: Ang καὶ τὰ τέκνα σου ἐν σοί ay karagdagang layon ng ἐδαφιοῦσίν; ang “pati ang” ay mas malinaw na nagsasaad na sila rin ay ibabagsak/wawasakin.
  - severity: low
    issue: Medyo mekanikal ang “mag-iiwan ... ng isang bato sa ibabaw ng isa pang bato.”
    rationale: Ang “kahit isang batong nakapatong sa isa pang bato” ay likas na Filipino para sa idiomang λίθον ἐπὶ λίθον at hindi nagbabago ng saklaw ng ganap na pagkawasak.
