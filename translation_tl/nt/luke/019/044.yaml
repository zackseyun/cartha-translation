  to: at ibabagsak ka nila hanggang sa lupa, pati ang iyong mga anak na nasa loob mo. Hindi sila mag-iiwan ng kahit isang batong nakapatong sa isa pang bato sa loob mo, sapagkat hindi mo nakilala ang panahon ng pagdalaw sa iyo.[a]
