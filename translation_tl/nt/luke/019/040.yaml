id: LUK.19.40
reference: Luke 19:40
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀εἶπεν· Λέγω ὑμῖν, ⸀ὅτι ἐὰν οὗτοι ⸀σιωπήσουσιν, οἱ λίθοι ⸀κράξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/040.yaml
  text: And answering[a], he said, “I tell you, if these become silent, the stones will cry out.”
translation:
  language: tl
  text: Bilang tugon ay sinabi niya, “Sinasabi ko sa inyo, kung tatahimik ang mga ito[a], sisigaw ang mga bato.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “titigil sa pagsasalita”; maaari ring “mananatiling tahimik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Bilang tugon ay sinabi niya
  rationale: Pinananatili nito ang tugong diwa ng participle na ἀποκριθεὶς at ang pangunahing pandiwang εἶπεν, ngunit natural pa rin sa modernong Filipino.
- source_word: Λέγω ὑμῖν
  choice: Sinasabi ko sa inyo
  rationale: Isang tuwiran at mariing pormula ng pananalita na malinaw at likas sa Filipino, nang hindi dinaragdagan ang lakas ng orihinal.
- source_word: ὅτι ἐὰν
  choice: kung
  rationale: Ipinakikilala ng ὅτι ang nilalaman ng sinabi, at sinusundan ito ng kondisyong ἐὰν. Sa Filipino, likas na sapat ang “kung” nang hindi na tahasang isinasalin ang ὅτι.
- source_word: οὗτοι
  choice: ang mga ito
  rationale: Pinananatili ang demonstratibong pagtukoy nang hindi tahasang idinaragdag sa teksto na sila ang mga alagad o ang mga nagpupuri.
- source_word: σιωπήσουσιν
  choice: tatahimik
  rationale: Ipinahihiwatig ng anyong panghinaharap ang pagtigil ng mga kasalukuyang nagsasalita. Ang “tatahimik” ay maikli, natural, at maaari ring magpahiwatig ng pagpasok sa kalagayan ng pananahimik.
- source_word: οἱ λίθοι
  choice: ang mga bato
  rationale: Tuwirang pinananatili ang tiyak at matingkad na larawan sa Griyego.
- source_word: κράξουσιν
  choice: sisigaw
  rationale: Ipinahahayag ng κράζω ang malakas na pagsigaw o pagbulalas; ang “sisigaw” ang pinakanatural at tuwirang katumbas dito.
theological_decisions:
- issue: Kung dapat bang ipaliwanag sa pangunahing teksto na metaporikal o makahimala ang pagsigaw ng mga bato
  choice: Panatilihin ang literal na larawang “sisigaw ang mga bato” nang walang paliwanag.
  alternative: Ipaliwanag na magpapatotoo ang mga bato o na pupuri sa Diyos ang buong sangnilikha.
  rationale: Hindi ipinapaliwanag ng Griyego ang larawan. Pinananatili ng tuwirang salin ang retorikal at teolohikal na puwersa nito nang hindi nagpapasiya kung ito ay pagmamalabis, larawang propetiko, o isang makahimalang posibilidad.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “Bilang tugon ay sinabi niya” upang katawanin ang dalawang elementong pandiwa sa Griyego nang hindi maging malamya; iniwasan ang arkaikong bokabularyo at anumang dagdag na interpretasyong teolohikal.
