  text: καὶ ἦλθεν ὁ δεύτερος λέγων· ⸂Ἡ μνᾶ σου, κύριε⸃, ἐποίησεν πέντε μνᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/018.yaml
  text: And the second came, saying, ‘Your mina, Lord, has made five minas.’
translation:
  language: tl
  text: Dumating naman ang pangalawa at sinabi, ‘Panginoon, ang mina mo ay kumita ng limang mina.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: ang pangalawa
  rationale: Natural na salin ng substantibong ordinal, na tumutukoy sa pangalawang lingkod na humarap.
- source_word: Ἡ μνᾶ σου
  choice: ang mina mo
  rationale: Pinananatili ang sinaunang yunit ng salapi na ‘mina’ at ang tuwirang diwa ng pag-aari.
- source_word: κύριε
  choice: Panginoon
  rationale: Magalang na tuwirang tawag sa maharlikang amo sa talinghaga; ang malaking titik ay kaayon ng ibinigay na konsultasyong teksto nang hindi ipinapalagay na ito ay direktang pagtukoy kay Jesus.
- source_word: ἐποίησεν πέντε μνᾶς
  choice: ay kumita ng limang mina
  rationale: Sa konteksto ng salapi, natural na ipinapahayag ng Tagalog na ang ipinagkatiwalang mina ay nagbunga o kumita ng limang mina; iniiwasan ang di-natural na literal na ‘gumawa.’
theological_decisions:
- issue: Ang pagkakakilanlan ng tinatawag na κύριε sa loob ng talinghaga
  choice: Panginoon
  alternative: ginoo / panginoon
  rationale: Sinusunod ang magalang at mataas na katawagan ng Griyego at ang audited English layer, ngunit hindi dinaragdagan ang teksto ng tahasang pahayag na ang kausap ay Diyos o si Jesus.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘naman’ upang natural na maipakita ang pag-usad mula sa naunang lingkod tungo sa pangalawa.
