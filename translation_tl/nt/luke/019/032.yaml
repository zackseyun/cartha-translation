  verdict: revise
  source_fidelity: Ang “ang lahat” ay nagdaragdag ng tahasang layon na wala sa Griyego. Bagaman maaaring tumukoy ang εὗρον sa buong sitwasyong nadatnan, ang pinakamalapit na ipinapalagay na layon sa konteksto ay ang batang asno. Ang “ito” ay natural na Tagalog at sapat na nagpapahiwatig ng layong inuunawa mula sa konteksto.
  naturalness: Mas natural at maikli sa makabagong Filipino ang “natagpuan nila ito gaya ng sinabi niya sa kanila” kaysa “natagpuan nila ang lahat ayon sa sinabi niya sa kanila.” Ang “gaya ng” ay malinaw na naghahayag ng pagtutugma sa sinabi ni Jesus.
  terminology: Ang “mga isinugo” ay tapat sa passive na οἱ ἀπεσταλμένοι at angkop sa salaysay. Walang isyung teolohikal o pangngalan.
  issues:
  - severity: medium
    issue: Idinagdag ang “ang lahat” bilang layon ng natagpuan.
    rationale: Walang “lahat” sa εὗρον. Ang pandiwa ay walang tahasang layon, na inuunawa mula sa agarang konteksto; mas mabuting huwag magdagdag ng saklaw na maaaring lumampas sa tinutukoy na batang asno.
  - severity: low
    issue: Hindi gaanong tiyak ang talababa sa paglalarawan sa layong ipinapalagay.
    rationale: Ang “batang asnong inilalarawan ni Jesus” ay maaaring magmungkahi ng paglalarawang wala sa mismong talata. Mas maingat ang “batang asno na tinutukoy ni Jesus.”
  revised_text: Kaya umalis ang mga isinugo at natagpuan nila ito gaya ng sinabi niya sa kanila.[a]
