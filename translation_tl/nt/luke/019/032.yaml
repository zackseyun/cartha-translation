  text: So those who were sent went away and found it just as he had told them[a].
translation:
  language: tl
  text: Kaya umalis ang mga isinugo at natagpuan nila ito gaya ng sinabi niya sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “natagpuan nila,” na ipinapalagay mula sa konteksto ang layon—ang batang asno na tinutukoy ni Jesus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθόντες
  choice: umalis
  rationale: Ang aorist participle ng ἀπέρχομαι ay nagsasaad ng pag-alis o pagpunta mula sa kinaroroonan; natural at malinaw sa Tagalog ang “umalis.”
- source_word: δὲ
  choice: Kaya
  rationale: Dito, ang δέ ay nag-uugnay sa pagsunod ng mga isinugo sa naunang utos. Ipinahihiwatig ng “Kaya” ang natural na pagpapatuloy at bunga nang hindi pinabibigat ang ugnayan.
- source_word: οἱ ἀπεσταλμένοι
  choice: ang mga isinugo
  rationale: Pinananatili nito ang substantival at passive na diwa ng perfect participle nang hindi nagdaragdag ng interpretasyong gaya ng “mga mensahero.”
- source_word: εὗρον
  choice: natagpuan nila ang lahat
  rationale: Walang tahasang layon ang εὗρον sa Griyego. Ang “ang lahat” ay natural na tumutukoy sa buong kalagayang nadatnan ayon sa sinabi ni Jesus, habang nililinaw ng talababa na maaari ring unawain ang batang asno bilang ipinapalagay na layon.
- source_word: καθὼς
  choice: ayon sa
  rationale: Ipinapahayag nito ang pagkakatugma ng kanilang nadatnan sa naunang sinabi sa kanila; natural ang pariralang “ang lahat ayon sa sinabi” sa Filipino.
- source_word: εἶπεν αὐτοῖς
  choice: sinabi niya sa kanila
  rationale: Tuwirang pinananatili ang simpleng aorist ng λέγω at ang indirect object αὐτοῖς, nang hindi kinakailangang gawing tahasang past perfect sa Tagalog.
