  text: πλὴν τοὺς ἐχθρούς μου ⸀τούτους τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς ἀγάγετε ὧδε καὶ κατασφάξατε ⸀αὐτοὺς ἔμπροσθέν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/027.yaml
  text: But as for these enemies of mine[a], who did not want me to reign over them[b], bring them here and slaughter them in front of me.
translation:
  language: tl
  text: Ngunit ang mga kaaway kong ito—na ayaw akong maghari sa kanila—dalhin ninyo rito at paslangin sa harap ko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Ngunit
  rationale: Nagmamarka ito ng mariing paglipat sa pangwakas na utos; likas at sapat ang “Ngunit” sa Filipino.
- source_word: τοὺς ἐχθρούς μου τούτους
  choice: ang mga kaaway kong ito
  rationale: Pinananatili ng “ito” ang diin at pagiging tiyak ng demonstratibong τούτους.
- source_word: τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς
  choice: na ayaw na ako ang maghari sa kanila
  rationale: Likas na ginagawang sugnay na panuring ang participial phrase. Pinananatili ng “maghari” ang pandiwang diwa ng βασιλεῦσαι at hindi ito ginagawang basta katawagang “hari.”
- source_word: ἀγάγετε ὧδε
  choice: dalhin ninyo rito
  rationale: Malinaw at karaniwang Filipino para sa utos na dalhin ang mga tinutukoy sa kinaroroonan ng nagsasalita.
- source_word: κατασφάξατε
  choice: paslangin
  rationale: Masidhi at marahas ang pandiwa kaysa sa pangkalahatang “patayin.” Ang “paslangin” ay nagpapanatili ng bigat nito nang hindi nagdaragdag ng tahasang legal na diwa gaya ng “bitayin” o “ipapatay bilang parusa.”
- source_word: ἔμπροσθέν μου
  choice: sa harap ko
  rationale: Pinananatili ang kongkreto at pansariling diwa ng pagkilos sa mismong harapan ng nagsasalita.
theological_decisions:
- issue: Pagkakakilanlan ng nagsasalita sa loob ng talinghaga
  choice: Tuwirang isinalin ang marahas na utos bilang sinabi ng maharlikang tauhan sa talinghaga, nang walang pagpapalambot o dagdag na paliwanag.
  alternative: Tahasan itong ilayo sa anumang kaugnayan kay Jesus sa pamamagitan ng paliwanag na wala sa talata.
  rationale: Inilalahad ng Griyego ang utos sa loob ng salaysay ng talinghaga. Dapat panatilihin ng salin ang lakas at tensiyong teolohikal nito nang hindi nagdaragdag ng interpretasyong wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga gitling upang luminaw na ang sugnay na “na ayaw na ako ang maghari sa kanila” ay naglalarawan sa “mga kaaway kong ito,” habang nananatili ang mariing daloy ng utos.
