id: LUK.19.45
reference: Luke 19:45
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς ⸀πωλοῦντας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/045.yaml
  text: And entering the temple[a], he began to drive out those who were selling,
translation:
  language: tl
  text: Pagpasok niya sa templo[a], sinimulan niyang paalisin ang mga nagtitinda,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nasasakupan ng templo” o “mga patyo ng templo.” Ang salitang Griyego na ἱερόν ay tumutukoy sa buong kompleks ng templo, hindi lamang sa panloob na santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: Pagpasok niya
  rationale: Likas na ipinapahayag sa modernong Tagalog ang aorist participle bilang kilos na nauna sa pangunahing pandiwa, nang hindi nagdaragdag ng di-kinakailangang detalye.
- source_word: ἱερὸν
  choice: templo
  rationale: Karaniwan at maikli itong salin; ang ἱερόν ay tumutukoy sa buong nasasakupan ng templo, hindi lamang sa panloob na santuwaryo, kaya nililinaw iyon sa talababa.
- source_word: ἤρξατο
  choice: sinimulan
  rationale: 'Pinananatili nito ang ingressive na diwa: nagsimula sa puntong ito ang kilos ng pagpapaalis.'
- source_word: ἐκβάλλειν
  choice: paalisin
  rationale: Natural sa Tagalog at nagpapahiwatig ng tiyak at aktibong pagpapatalsik, nang hindi gumagamit ng lipas o labis na marahas na pananalita.
- source_word: πωλοῦντας
  choice: mga nagtitinda
  rationale: Tumutukoy ito sa mga taong kasalukuyang nagbebenta at hindi nagdaragdag kung ano ang kanilang ipinagbibili, na hindi binabanggit sa talata.
theological_decisions:
- issue: Saklaw ng ἱερόν sa pagkilos ni Jesus sa templo
  choice: templo, na inuunawa bilang buong nasasakupan ng templo
  alternative: mga patyo ng templo; nasasakupan ng templo; santuwaryo
  rationale: Karaniwang tumutukoy ang ἱερόν sa kabuuang kompleks ng templo, hindi partikular sa panloob na santuwaryo (ναός). Pinananatiling maayos basahin ang pangunahing teksto habang inilalahad sa talababa ang mas tiyak na saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Pagpasok niya” para sa maayos na daloy ng salaysay at “mga nagtitinda” upang panatilihin ang nagpapatuloy na gawain nang hindi nagdaragdag ng bagay na ipinagbibili.
