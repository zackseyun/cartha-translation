  text: And he said to this one also[a], ‘And you, be over five cities.’
translation:
  language: tl
  text: Sinabi rin niya sa kanya, “Ikaw naman, mamahala ka[a] sa limang lungsod.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “magkaroon ka ng kapamahalaan sa limang lungsod” o “italaga kang mamahala sa limang lungsod.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ καὶ τούτῳ
  choice: Sinabi rin niya rito
  rationale: Ipinahahayag ng δέ ang banayad na pagpapatuloy ng salaysay, ng καί ang diwang ‘rin,’ at ng τούτῳ ang pagtukoy sa taong kaharap. Ang ‘rito’ ay maikli at natural sa makabagong Filipino.
- source_word: Καὶ σὺ
  choice: Ikaw naman
  rationale: Pinananatili nito ang mariing personal na pagtukoy at ang pagkakapantay ng pahayag sa naunang lingkod, nang hindi pilit ang literal na ‘At ikaw.’
- source_word: ἐπάνω γίνου
  choice: mamahala ka sa
  rationale: Ang kasalukuyang imperatibong γίνου kasama ng ἐπάνω ay tumutukoy sa pagkakaloob ng posisyon o kapamahalaan. Natural na naipapahayag ito ng ‘mamahala ka sa.’
- source_word: πέντε πόλεων
  choice: limang lungsod
  rationale: Karaniwang nangangahulugang ‘lungsod’ ang πόλις, at ipinakikita ng anyong genitive ang saklaw ng pamamahala.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘rito’ upang mapanatili ang demonstratibong pagtukoy nang hindi maging alanganin ang ‘sa isang ito,’ at ang ‘Ikaw naman’ upang maging natural ang mariing paghahambing.
