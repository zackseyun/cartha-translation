source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν λαβόντα τὴν βασιλείαν καὶ εἶπεν φωνηθῆναι αὐτῷ τοὺς δούλους τούτους οἷς ⸀δεδώκει τὸ ἀργύριον, ἵνα ⸀γνοῖ τί ⸀διεπραγματεύσαντο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/015.yaml
  text: And it happened[a], when he returned after receiving the kingdom, that he ordered these servants to whom he had given the money to be called to him[b], so that he might know what they had gained by trading.
translation:
  language: tl
  text: Nang makabalik siya matapos tanggapin ang paghahari, iniutos niyang ipatawag sa kanya ang mga aliping ito na binigyan niya ng salapi, upang malaman niya kung ano ang kinita nila sa pangangalakal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kung ano ang nagawa nila sa pagnenegosyo” o “kung magkano ang tinubo nila.” Ang pandiwang Griyego ay tumutukoy sa pakikipagnegosyo o pangangalakal at sa naging bunga nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν
  choice: Nang makabalik siya
  rationale: Ang ἐγένετο ay bahagi ng karaniwang pormulang pasalaysay at hindi kailangang isalin nang hiwalay sa Tagalog; likas na ipinahahayag ng “Nang makabalik siya” ang temporal na daloy.
- source_word: λαβόντα τὴν βασιλείαν
  choice: matapos tanggapin ang paghahari
  rationale: Ipinakikita ng participle na nauna ang pagtanggap bago ang pagpapatawag. Sa konteksto, ang βασιλεία ay tumutukoy sa pagiging hari o kapangyarihang maghari, kaya mas malinaw ang “paghahari” kaysa sa teritoryal na “kaharian.”
- source_word: φωνηθῆναι αὐτῷ
  choice: ipinatawag niya sa harap niya
  rationale: Ipinahahayag nito ang pagpapatawag sa mga alipin upang humarap sa kanya; natural ito sa modernong Tagalog at pinananatili ang direksiyong αὐτῷ.
- source_word: δούλους
  choice: mga alipin
  rationale: Ang δοῦλος ay tumutukoy sa mga taong nasa nakagapos at napapailalim na katayuan sa panginoon. Pinananatili ng “alipin” ang realidad ng ugnayang panlipunan sa talinghaga.
- source_word: δεδώκει τὸ ἀργύριον
  choice: binigyan niya ng salapi
  rationale: Ang pluperfect ay tumutukoy sa naunang pagbibigay. Ang ἀργύριον ay pangkalahatang tawag sa salapi rito, hindi ang tiyak na yunit na mina.
- source_word: ἵνα γνοῖ
  choice: upang malaman
  rationale: Tuwirang pinananatili ang layuning ipinahahayag ng ἵνα at aorist subjunctive.
- source_word: τί διεπραγματεύσαντο
  choice: kung ano ang kinita nila sa pangangalakal
  rationale: Saklaw ng pandiwa ang pakikipagnegosyo at ang naging resulta nito. Pinananatili ng parirala ang gawaing pangkalakalan at ang hinihinging ulat tungkol sa bunga.
theological_decisions:
- issue: Kahulugan ng βασιλεία sa pampolitikang tagpo ng talinghaga
  choice: paghahari
  alternative: kaharian
  rationale: Ang tinanggap ng mahal na tao ay maharlikang katayuan o kapangyarihang mamahala, hindi lamang isang lupain. Iniiwasan ng “paghahari” ang di-sinasadyang paglilimita sa teritoryo.
- issue: Paglalarawan sa δούλους
  choice: mga alipin
  alternative: mga lingkod
  rationale: Mas malinaw na ipinakikita ng “mga alipin” ang nakagapos na katayuan at kapangyarihan ng panginoon sa kanila, nang hindi nagdaragdag ng denominasyonal na kahulugan.
- issue: Saklaw ng διεπραγματεύσαντο
  choice: kung ano ang kinita nila sa pangangalakal
  alternative: kung ano ang nagawa nila sa pagnenegosyo
  rationale: Ang konteksto ay pagsusulit sa naging bunga ng salaping ipinagkatiwala. Gayunman, hindi lubos na ikinukulong ng salin ang pandiwa sa purong tubo lamang, kaya may talababa para sa mas malawak na pagbasa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “salapi” bilang bahagyang pormal ngunit karaniwang katawagan, at “pangangalakal” upang malinaw na ipahayag ang gawaing pangnegosyo. Ang tanging talababa ay minarkahan sa mismong teksto.
