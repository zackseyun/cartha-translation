  text: Καὶ ἦν διδάσκων τὸ καθ’ ἡμέραν ἐν τῷ ἱερῷ· οἱ δὲ ἀρχιερεῖς καὶ οἱ γραμματεῖς ἐζήτουν αὐτὸν ἀπολέσαι καὶ οἱ πρῶτοι τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/047.yaml
  text: And he was teaching day by day in the temple. But the chief priests and the scribes[a], and the leading men of the people, were seeking to destroy him,
translation:
  language: tl
  text: At araw-araw ay nagtuturo siya sa templo. Ngunit ang mga punong pari, mga eskriba, at mga nangungunang lalaki ng bayan[a] ay naghahanap ng paraan upang patayin siya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pinuno ng bayan.” Literal sa Griyego, “mga una ng bayan”; tumutukoy ito sa mga tanyag o maimpluwensiyang lalaki sa mamamayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν διδάσκων
  choice: siyang nagtuturo
  rationale: Ang periphrastic imperfect ay nagpapahayag ng nagpapatuloy o paulit-ulit na gawain sa nakaraan; kasama ng “araw-araw,” natural itong naihahatid sa Filipino nang hindi kailangang gawing tahasan ang aspektong nagdaan.
- source_word: τὸ καθ’ ἡμέραν
  choice: araw-araw
  rationale: Natural na Filipino para sa distributibong diwang “bawat araw” o “sa araw-araw na batayan.”
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Ang ἱερόν ay tumutukoy sa buong kompleks ng templo, hindi lamang sa panloob na santuwaryo; ang “templo” ang maikli at karaniwang salin.
- source_word: οἱ ἀρχιερεῖς
  choice: ang mga punong pari
  rationale: Karaniwan at makasaysayang angkop na tawag sa pangkat ng mga pinunong pari.
- source_word: οἱ γραμματεῖς
  choice: ang mga tagapagturo ng Kautusan
  rationale: Sa kontekstong Judio, ang γραμματεῖς ay mga dalubhasa at tagapagturo ng Kautusan. Mas malinaw ito sa karaniwang modernong mambabasa kaysa sa “mga eskriba,” bagaman bahagyang mas interpretibo.
- source_word: ἐζήτουν
  choice: ay naghahanap ng paraan
  rationale: Ipinakikita ng imperfect ang patuloy na pagsisikap; idiomatiko sa Filipino ang “naghahanap ng paraan” sa ganitong konteksto.
- source_word: ἀπολέσαι αὐτόν
  choice: upang siya'y maipapatay
  rationale: Sa konteksto, ang layunin ay patayin si Jesus. Inihahayag ng “maipapatay” ang lethal na diwa at ang pagsisikap ng mga pinuno na maisagawa ito, habang hindi tinutukoy ang eksaktong paraan.
- source_word: οἱ πρῶτοι τοῦ λαοῦ
  choice: ang mga pangunahing lalaki sa bayan
  rationale: Pinananatili nito ang panlalaking pangmaramihan at ang diwa ng πρῶτοι bilang mga tanyag, makapangyarihan, o maimpluwensiyang kasapi ng bayan.
theological_decisions:
- issue: Panlalaking pagtukoy sa οἱ πρῶτοι τοῦ λαοῦ
  choice: ang mga pangunahing lalaki sa bayan
  alternative: ang mga pinuno ng bayan
  rationale: Pinananatili ang tunay na panlalaking anyo at malamang na makasaysayang reperensiya sa mga lalaking notableng sibiko, habang inilalagay sa talababa ang mas natural ngunit gender-neutral na alternatibo.
- issue: Saklaw ng ἀπολέσαι
  choice: upang siya'y maipapatay
  alternative: upang siya'y mawasak / mapuksa
  rationale: Bagaman maaaring mangahulugan ang pandiwa ng “sirain” o “lipulin,” malinaw sa konteksto na kamatayan ni Jesus ang layunin. Hindi ito nagdaragdag ng paraan o legal na mekanismo ng pagpatay.
translation_notes:
  register: Modernong, marangal, at madaling maunawaang Filipino. Ginamit ang “tagapagturo ng Kautusan” para sa agarang linaw; pinanatili ang “mga pangunahing lalaki” upang katawanin ang panlalaking anyo at katayuang panlipunan ng pariralang Griyego. Ang hulihang kuwit ng sipi sa Griyego ay hindi ginaya bilang di-kumpletong bantas; tinapos ang talata bilang isang ganap na pangungusap.
