  text: ἐγγίζοντος δὲ αὐτοῦ ἤδη πρὸς τῇ καταβάσει τοῦ Ὄρους τῶν Ἐλαιῶν ἤρξαντο ἅπαν τὸ πλῆθος τῶν μαθητῶν χαίροντες αἰνεῖν τὸν θεὸν φωνῇ μεγάλῃ περὶ ⸀πασῶν ὧν εἶδον δυνάμεων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/037.yaml
  text: And as he was already drawing near[a], at the descent of the Mount of Olives, the whole multitude of the disciples began rejoicing and praising God with a loud voice for all the mighty works that they had seen,
translation:
  language: tl
  text: Nang malapit na siya sa pababang bahagi ng Bundok ng mga Olibo, ang buong karamihan ng mga alagad ay nagsimulang magalak at magpuri sa Diyos nang malakas dahil sa lahat ng makapangyarihang gawa[a] na nakita nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga himala” o “mga gawa ng kapangyarihan.” Ang salitang Griyego ay tumutukoy sa mga gawang nagpapakita ng kapangyarihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζοντος δὲ αὐτοῦ ἤδη
  choice: Nang malapit na siya
  rationale: Ipinapahayag nang natural sa Tagalog ang pansamantalang tagpo ng genitive absolute at ang papalapit na pagkilos; ang “na” ay sumasalamin sa ἤδη.
- source_word: πρὸς τῇ καταβάσει
  choice: sa dakong pababa
  rationale: Tinutukoy ang lugar kung saan nagsisimula o naroon ang pababang bahagi nang hindi labis na tinutukoy ang eksaktong topograpiya.
- source_word: τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: ng Bundok ng mga Olibo
  rationale: Karaniwan at malinaw na pangalang heograpiko sa modernong saling Tagalog.
- source_word: ἤρξαντο
  choice: nagsimulang
  rationale: Pinananatili ang ingressive na diwa ng pandiwa.
- source_word: ἅπαν τὸ πλῆθος τῶν μαθητῶν
  choice: ang buong karamihan ng mga alagad
  rationale: Pinananatili ang kabuuan ng malaking pangkat at nililinaw na ang karamihan ay binubuo ng mga alagad.
- source_word: χαίροντες
  choice: magalak
  rationale: Pinananatili ang pandiwang diwa ng kasiyahang kasabay ng pagpupuri.
- source_word: αἰνεῖν τὸν θεὸν
  choice: magpuri sa Diyos
  rationale: Direkta, natural, at marangal na katumbas sa Tagalog.
- source_word: φωνῇ μεγάλῃ
  choice: nang malakas
  rationale: Natural na Tagalog para sa pagpupuring ginawa sa malakas na tinig, nang hindi nagiging mabigat ang pangungusap.
- source_word: περὶ πασῶν ὧν εἶδον δυνάμεων
  choice: dahil sa lahat ng makapangyarihang gawa na nakita nila
  rationale: Ang “makapangyarihang gawa” ay nagpapanatili sa ugnayan ng δύναμις sa kapangyarihan at sa mga aktuwal na gawa, habang hindi ito agad pinakikitid sa teknikal na salitang “himala.”
theological_decisions:
- issue: Kahulugan ng δύναμις sa konteksto ng mga pambihirang gawa
  choice: makapangyarihang gawa
  alternative: mga himala; mga gawa ng kapangyarihan
  rationale: Maaaring tumukoy ang salita sa kapangyarihan, mga gawang nagpapakita ng kapangyarihan, o mga himala. Pinananatili ng napiling salin ang lawak at diin ng Griyego nang hindi tahimik na nililimitahan ang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “karamihan” sa halip na mas arkaikong “kalipunan,” at “nang malakas” para sa idiomatikong daloy. Inilagay ang talababa sa δύναμις, na siyang tunay na leksikal na alternatibo sa orihinal.
