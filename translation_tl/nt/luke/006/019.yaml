id: LUK.6.19
reference: Luke 6:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ὄχλος ⸀ἐζήτουν ἅπτεσθαι αὐτοῦ, ὅτι δύναμις παρ’ αὐτοῦ ἐξήρχετο καὶ ἰᾶτο πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/019.yaml
  text: And the whole crowd was trying to touch him[a], because power was coming out from him and healing them all.
translation:
  language: tl
  text: At sinisikap ng buong karamihan na hipuin siya, sapagkat may kapangyarihang lumalabas mula sa kanya[a] at nagpapagaling sa kanilang lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagmumula sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ὄχλος
  choice: ang buong karamihan
  rationale: 'Pinananatili nito ang kolektibong diwa ng isahang ὄχλος na may πᾶς: ang karamihan bilang kabuuan.'
- source_word: ἐζήτουν
  choice: sinisikap
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang patuloy o paulit-ulit na pagsisikap, hindi lamang isang minsanang pagtatangka.
- source_word: ἅπτεσθαι
  choice: na hipuin
  rationale: Ang “hipuin” ay likas at tuwirang katumbas sa konteksto ng paglapit kay Jesus upang gumaling.
- source_word: δύναμις
  choice: kapangyarihan
  rationale: Tuwirang inilalarawan ang mabisang kapangyarihang nagpapagaling nang hindi idinaragdag ang salitang “mahimala,” na ipinahihiwatig lamang ng konteksto.
- source_word: παρ’ αὐτοῦ ἐξήρχετο
  choice: lumalabas mula sa kanya
  rationale: Pinananatili ang masiglang larawan ng kapangyarihang patuloy na nagmumula kay Jesus.
- source_word: ἰᾶτο πάντας
  choice: nagpapagaling sa kanilang lahat
  rationale: Ang patuloy na kilos ng imperpektibo ay naipapahayag sa “nagpapagaling,” at ang πάντας ay likas na tinutukoy bilang “kanilang lahat.”
theological_decisions:
- issue: Ang kalikasan ng δύναμις na lumalabas mula kay Jesus
  choice: “may kapangyarihang lumalabas mula sa kanya” nang walang dagdag na paliwanag
  alternative: “may mahimalang kapangyarihang lumalabas mula sa kanya”
  rationale: Inilalahad ng talata si Jesus bilang pinagmumulan ng mabisang kapangyarihang nagpapagaling, ngunit hindi tahasang ginagamit ng Griyego ang salitang “mahimala.”
- issue: Ang gumaganap ng pagpapagaling sa sugnay na ἰᾶτο πάντας
  choice: Ang “kapangyarihan” ang gramatikal na paksa ng “nagpapagaling”
  alternative: 'Gawing tahasang si Jesus ang paksa: “at pinagagaling niya silang lahat”'
  rationale: 'Pinananatili ng napiling ayos ang pinakamalapit na ugnayang gramatikal: ang kapangyarihang lumalabas mula sa kanya ang nagpapagaling sa lahat, nang hindi itinatanggi na kay Jesus nagmumula ang kapangyarihan.'
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “hipuin” sa halip na mas kolokyal na “hawakan,” at pinanatili ang patuloy na kilos sa “sinisikap,” “lumalabas,” at “nagpapagaling.”
