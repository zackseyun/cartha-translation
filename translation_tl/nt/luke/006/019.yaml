  source_fidelity: Tumpak na naihahatid ng salin ang kolektibong “buong karamihan,” ang patuloy na pagsisikap sa imperpektibong ἐζήτουν, ang paghipo kay Jesus, at ang kapangyarihang patuloy na lumalabas mula sa kanya at nagpapagaling sa lahat. Hindi nito dinaragdagan ang ipinahihiwatig ng δύναμις.
  naturalness: Likas at marangal sa makabagong Filipino ang “sinisikap ng buong karamihan na hipuin siya.” Ang “may kapangyarihang lumalabas mula sa kanya at nagpapagaling sa kanilang lahat” ay malinaw at maayos ang daloy.
