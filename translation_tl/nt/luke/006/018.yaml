  text: who came to hear him and to be healed of their diseases[a]; and those troubled by unclean spirits were being healed.
translation:
  language: tl
  text: na dumating upang makinig sa kanya at mapagaling mula sa kanilang mga karamdaman; at ang mga pinahihirapan ng maruruming espiritu[a] ay pinagagaling.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang mga ginagambala ng maruruming espiritu.” Ang salitang Griyego ay maaaring mangahulugang ginagambala, pinahihirapan, o binabagabag, ayon sa konteksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ ἦλθον
  choice: na dumating
  rationale: Ipinagpapatuloy ng panghalip na pamatlig ang paglalarawan sa mga tao sa naunang talata; natural sa Tagalog ang «na dumating» bilang kaugnay na sugnay.
- source_word: ἀκοῦσαι αὐτοῦ
  choice: upang makinig sa kanya
  rationale: Ipinahahayag ng pawatas ang layunin ng pagdating. Ang «makinig» ay mas natural kaysa «makarinig» kapag sinasadyang pakinggan ang isang nagsasalita.
- source_word: ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν
  choice: mapagaling sa kanilang mga karamdaman
  rationale: Pinananatili ng «mapagaling» ang tinig na balintiyak at ng «sa» ang diwa ng paglaya o pagkahiwalay mula sa mga karamdaman.
- source_word: ἐνοχλούμενοι ἀπὸ πνευμάτων ἀκαθάρτων
  choice: mga pinahihirapan ng maruruming espiritu
  rationale: Ang «pinahihirapan» ay natural at may sapat na lawak para sa passive participle, samantalang ang «maruruming espiritu» ay nagpapanatili sa nakaugaliang biblikal na diwa ng ἀκάθαρτος nang hindi ito pinapakahulugang tahasan bilang «mga demonyo».
- source_word: ἐθεραπεύοντο
  choice: ay pinagagaling din
  rationale: Ipinahihiwatig ng di-ganap na panahunan ang nagpapatuloy o paulit-ulit na pagpapagaling sa tagpo; naipapakita ito ng «pinagagaling». Ang «din» ay natural na nag-uugnay sa ikalawang pangkat sa naunang binanggit.
theological_decisions:
- issue: Paglalarawan sa πνευμάτων ἀκαθάρτων
  choice: maruruming espiritu
  alternative: masasamang espiritu; mga demonyo
  rationale: Pinananatili nito ang mismong larawang biblikal ng ritwal at moral na karumihan at hindi pinapalitan ng mas tahasang interpretatibong katawagan.
- issue: Aspekto ng ἐθεραπεύοντο
  choice: pinagagaling
  alternative: pinagaling
  rationale: Ang anyong di-ganap sa Griyego ay naglalarawan ng nagpapatuloy o paulit-ulit na kilos sa tagpo, kaya hindi ito pinatag tungo sa isang natapos na pangyayari.
- issue: Lakas ng kahulugan ng ἐνοχλούμενοι
  choice: pinahihirapan
  alternative: ginagambala; pinahihirapang lubha
  rationale: Ipinakikita ng napili ang tunay na pagdurusa nang hindi tiyak na idinadagdag ang sukdulang tindi na maaaring ipahiwatig ng «pinahihirapang lubha».
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang «kanya» sa halip na mas pormal na «kaniya», at pinanatili ang tuloy-tuloy na anyo ng salaysay. Ang talababa ay inilagay sa hulihan ng pahayag na tinutukoy nito.
