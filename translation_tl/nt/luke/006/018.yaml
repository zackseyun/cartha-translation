  source_fidelity: Tumpak sa kabuuan ang pagkakasalin ng layunin ng pagdating, pagpapagaling sa mga karamdaman, at ang di-ganap na aspekto ng ἐθεραπεύοντο. Gayunman, ang talababa ay tungkol sa ἐνοχλούμενοι at dapat ikabit sa pariralang “pinahihirapan ng maruruming espiritu,” hindi sa dulo ng buong talata. Ang “din” ay hindi kailangan ng Griyegong καί at bahagyang nagdaragdag ng diin.
  naturalness: Natural at marangal ang pangunahing daloy. Mas malinaw at karaniwan sa modernong Filipino ang “mapagaling mula sa kanilang mga karamdaman” kaysa “mapagaling sa kanilang mga karamdaman,” dahil malinaw nitong ipinahihiwatig ang paglaya mula sa sakit.
  terminology: Ang “maruruming espiritu” ay angkop na katumbas ng πνεύματα ἀκάθαρτα at pinananatili ang nakaugaliang biblikal na termino nang hindi ipinapalit ang interpretatibong “mga demonyo.” Ang “pinahihirapan” ay katanggap-tanggap para sa ἐνοχλούμενοι.
  issues:
  - severity: medium
    issue: Maling pagkakaangkla ng talababa
    rationale: Ang nilalaman ng talababa ay nagbibigay ng mga kahalili para sa ἐνοχλούμενοι (“pinahihirapan”), ngunit ang tandang [a] ay nakalagay sa dulo matapos ang “pinagagaling din.” Dapat itong ilagay kasunod ng “maruruming espiritu” o ng buong pariralang “pinahihirapan ng maruruming espiritu.”
  - severity: low
    issue: Hindi pinakamalinaw ang “mapagaling sa kanilang mga karamdaman”
    rationale: Bagaman nauunawaan, maaaring magmukhang tumutukoy ang “sa” sa larangan o dahilan ng pagpapagaling. Ang “mula sa kanilang mga karamdaman” ay mas malinaw na katumbas ng ἀπό at natural pa rin sa Filipino.
  - severity: low
    issue: May dagdag na diin ang “din”
    rationale: Ang simpleng καί ay “at”; hindi kinakailangan ang “din,” na maaaring magbigay ng bahagyang idinagdag na diin.
