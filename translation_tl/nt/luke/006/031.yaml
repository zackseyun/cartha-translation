  naturalness: Malinaw at marangal ang draft, ngunit mas natural at mas malapit sa paghahambing ng Griyego ang pares na “kung paano ... gayon din.” Ang “gusto” ay karaniwang modernong Filipino para sa θέλετε; hindi ito mas mababa ang antas ng rehistro sa pangungusap na ito.
  terminology: Wasto ang “mga tao” para sa pangkalahatang οἱ ἄνθρωποι. Wasto ring panatilihin ang malawak na “gawin” sa halip na ang mas makitid na “pakitunguhan.”
