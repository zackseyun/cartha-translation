  text: And just as you want people to do for you[a], do the same for them.
translation:
  language: tl
  text: At kung paano ninyo gustong gawin ng mga tao para sa inyo[a], gayon din ang gawin ninyo para sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At kung paano ninyo gustong gawin sa inyo ng mga tao, gayon din ang gawin ninyo sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang kaugnayan ng pangungusap sa naunang turo nang hindi nagpapahiwatig ng higit na lohikal na ugnayan kaysa nasa Griyego.
- source_word: καθὼς
  choice: kung ano
  rationale: Sa kayariang Filipino ng buong pangungusap, likas na ipinahahayag ng “kung ano ... iyon din” ang pamantayan ng paghahambing na dala ng καθὼς.
- source_word: θέλετε
  choice: nais ninyo
  rationale: Tumutukoy ito sa karaniwang pagnanais o kagustuhan. Dignified at natural ang “nais” sa makabagong Filipino.
- source_word: ἵνα ποιῶσιν ὑμῖν
  choice: gawin ... para sa inyo
  rationale: Ipinahahayag ng ἵνα-clause ang nilalaman ng ninanais. Pinananatili ng “gawin” ang malawak na kahulugan ng ποιέω, at malinaw na ipinahahayag ng “para sa inyo” ang ugnayang tinutukoy ng datibong ὑμῖν.
- source_word: οἱ ἄνθρωποι
  choice: mga tao
  rationale: Pangkalahatan ang ἄνθρωποι at hindi tumutukoy lamang sa mga lalaki; tuwiran at inklusibo ang “mga tao.”
- source_word: ποιεῖτε
  choice: gawin ninyo
  rationale: Isinasalin bilang tuwirang utos. Hindi na tahasang dinagdagan ng salitang nagsasaad ng pagpapatuloy, sapagkat sapat ang karaniwang anyo ng pautos sa Filipino sa kontekstong etikal.
- source_word: αὐτοῖς
  choice: para sa kanila
  rationale: Kaagapay ito ng ὑμῖν at pinananatili ang tugmang ugnayan ng ginagawa para sa sarili at para sa iba.
- source_word: ὁμοίως
  choice: iyon din
  rationale: Likas na katambal ng “kung ano” sa Filipino at malinaw na naghahayag ng katumbas o kaparehong pagkilos.
theological_decisions:
- issue: Pangkalahatang saklaw ng οἱ ἄνθρωποι
  choice: mga tao
  alternative: mga lalaki
  rationale: Pangkalahatan ang salitang Griyego sa kontekstong ito. Iniiwasan ng “mga tao” ang maling pagpapakahulugang lalaki lamang ang tinutukoy.
- issue: Saklaw ng ποιέω
  choice: gawin
  alternative: pakitunguhan
  rationale: Mas malawak ang “gawin” at pinananatili nito ang pag-uulit ng pandiwang Griyego. Ang “pakitunguhan” ay malinaw ngunit mas makitid at mas interpretatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magalang at pangmaramihang “ninyo,” at pinanatili ang maikli at madaling tandaan na anyo ng kasabihan.
