id: LUK.6.35
reference: Luke 6:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πλὴν ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν καὶ ἀγαθοποιεῖτε καὶ δανίζετε μηδὲν ἀπελπίζοντες· καὶ ἔσται ὁ μισθὸς ὑμῶν πολύς, καὶ ἔσεσθε υἱοὶ Ὑψίστου, ὅτι αὐτὸς χρηστός ἐστιν ἐπὶ τοὺς ἀχαρίστους καὶ πονηρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/035.yaml
  text: But love your enemies[a], and do good, and lend, expecting nothing in return; and your reward will be great, and you will be sons of the Most High[b], because he is kind to the ungrateful and evil.
translation:
  language: tl
  text: Ngunit ibigin ninyo ang inyong mga kaaway, gumawa kayo ng mabuti, at magpahiram nang hindi umaasa ng anumang kapalit[a]. Magiging dakila ang inyong gantimpala, at magiging mga anak kayo ng Kataas-taasan[b], sapagkat mabait siya sa mga walang utang na loob at sa masasama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari rin, bagaman hindi gaanong malamang: “nang hindi nawawalan ng pag-asa sa kaninuman” o “nang hindi kailanman nawawalan ng pag-asa.” Mahirap bigyang-kahulugan ang pariralang Griyego na μηδὲν ἀπελπίζοντες; sa kontekstong ito, inuunawa itong hindi pag-asang mababayaran o may maibabalik.'
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego na isinaling “mga anak” ay nasa panlalaking maramihang anyo (“mga anak na lalaki”), ngunit maaari itong gamitin dito sa paraang kumakatawan sa lahat ng kabilang sa gayong kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Ngunit
  rationale: Malinaw na ipinakikita ang mariing pagsalungat sa naunang huwaran ng pagmamahal na may inaasahang kapalit.
- source_word: ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν
  choice: ibigin ninyo ang inyong mga kaaway
  rationale: Pinananatili ang tuwirang utos at ang matinding diwa ng salitang ‘mga kaaway,’ nang hindi ito pinahihina bilang mga katunggali lamang.
- source_word: ἀγαθοποιεῖτε
  choice: gumawa kayo ng mabuti
  rationale: Likas at malinaw na Filipino para sa aktibong paggawa ng kabutihan.
- source_word: δανίζετε
  choice: magpahiram
  rationale: Hindi nililimitahan sa salapi ang maaaring ipahiram, gaya rin ng Griyego.
- source_word: μηδὲν ἀπελπίζοντες
  choice: nang hindi umaasa ng anumang kapalit
  rationale: Sa konteksto ng pagpapahiram at pagtutumbasan, pinakamalamang na tumutukoy ito sa hindi paghihintay ng kabayaran o pagsasauli; inilalahad sa talababa ang tunay na kahirapang leksikal.
- source_word: μισθὸς ὑμῶν πολύς
  choice: magiging dakila ang inyong gantimpala
  rationale: Ang ‘gantimpala’ ay angkop sa etikal at eskatolohikal na konteksto, at ang ‘dakila’ ay nagpapanatili sa bigat ng πολύς.
- source_word: υἱοὶ Ὑψίστου
  choice: mga anak ng Kataas-taasan
  rationale: Ang ‘anak’ ang likas na salitang Filipino para sa ugnayang ipinahahayag dito; dahil hindi ito nagtatakda ng kasarian sa Filipino samantalang panlalaking maramihan ang Griyego, nililinaw iyon sa talababa.
- source_word: χρηστός
  choice: mabait
  rationale: Ipinahahayag ang mapagkawanggawang kabutihan ng Diyos sa mga hindi karapat-dapat.
- source_word: ἀχαρίστους καὶ πονηρούς
  choice: mga walang utang na loob at sa masasama
  rationale: Ang ‘walang utang na loob’ ay natural na katumbas ng kawalan ng pasasalamat, at ang ‘masasama’ ay tuwirang nagpapanatili sa moral na lakas ng πονηρούς.
theological_decisions:
- issue: Kahulugan ng μηδὲν ἀπελπίζοντες sa utos na magpahiram
  choice: nang hindi umaasa ng anumang kapalit
  alternative: nang hindi nawawalan ng pag-asa sa kaninuman / hindi nawawalan ng pag-asa
  rationale: Mas umaangkop sa agarang konteksto ng pagpapahiram at di-pagtutumbasan ang hindi pag-asang may maibabalik, ngunit hindi tiyak ang parirala kaya pinananatili sa talababa ang alternatibong pagbasa.
- issue: Paglilipat ng panlalaking maramihang υἱοὶ sa Filipino
  choice: mga anak ng Kataas-taasan
  alternative: mga anak na lalaki ng Kataas-taasan
  rationale: Walang kasariang likas sa salitang Filipino na ‘anak.’ Ang ‘mga anak na lalaki’ ay maaaring maling magpahiwatig na lalaki lamang ang saklaw, samantalang maaaring representatibo ang panlalaking anyo ng Griyego. Pinananatili sa talababa ang anyong panlalaki ng pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘ibigin’ upang mapanatili ang bigat ng utos, habang ang natitirang pangungusap ay gumagamit ng karaniwang bokabularyo at likas na ayos. Iniwasan ang labis na teknikal o denominasyonal na pananalita.
