id: LUK.6.40
reference: Luke 6:40
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν ⸀διδάσκαλον, κατηρτισμένος δὲ πᾶς ἔσται ὡς ὁ διδάσκαλος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/040.yaml
  text: A disciple is not above his teacher[b][a], but everyone when fully trained will be like his teacher.
translation:
  language: tl
  text: Ang alagad[a] ay hindi nakahihigit sa kanyang guro, ngunit ang bawat isa, kapag lubos nang nasanay[b], ay magiging tulad ng kanyang guro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mag-aaral.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kapag lubos nang naihanda” o “kapag ganap nang nahubog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: alagad
  rationale: Pinananatili ng “alagad” ang diwa ng isang mag-aaral na nakaugnay sa guro at hinuhubog nito, hindi lamang ng isang estudyante sa pormal na paaralan.
- source_word: ὑπὲρ
  choice: nakahihigit sa
  rationale: Sa paghahambing na ito, tumutukoy ang ὑπέρ sa pagiging mas mataas sa katayuan o antas; natural at malinaw sa Filipino ang “nakahihigit sa.”
- source_word: διδάσκαλος
  choice: guro
  rationale: Ang “guro” ang payak at karaniwang katumbas na nagpapanatili sa diin ng salita sa pagtuturo.
- source_word: κατηρτισμένος
  choice: kapag lubos nang nasanay
  rationale: Ipinahihiwatig ng perfect passive participle ang pagkumpleto ng paghahanda o pagsasanay. Sa konteksto ng alagad at guro, malinaw na naihahatid ng “lubos nang nasanay” ang ganap na paghubog, at ginagawang natural ng “kapag” ang participial na ugnayan sa Filipino.
- source_word: πᾶς
  choice: ang bawat isa
  rationale: May pangkalahatang saklaw dito ang panlalaking isahan sa Griyego. Natural na ipinahahayag ng “ang bawat isa” ang indibiduwal ngunit pangkalahatang diwa.
- source_word: ὡς
  choice: tulad ng
  rationale: Naghahayag ang ὡς ng paghahambing; ang “tulad ng” ang natural na katumbas sa kasabihang ito.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Tumutukoy ang panghalip sa bawat alagad bilang isahan. Pinananatili ng “kanyang” ang isahang pagtukoy nang hindi nagpapasok ng kasariang hindi kailangang markahan sa Filipino.
theological_decisions:
- issue: Saklaw at isahang pagtukoy sa pangkalahatang kasabihan
  choice: “ang bawat isa … kanyang guro”
  alternative: “lahat … kanilang guro”
  rationale: Nasa panlalaking isahan ang anyo ng Griyego ngunit pangkalahatan ang gamit. Pinananatili ng “bawat isa … kanyang” ang indibiduwal at isahang pagtutugma nang natural sa Filipino.
- issue: Kahulugan ng κατηρτισμένος sa konteksto ng alagad at guro
  choice: “kapag lubos nang nasanay”
  alternative: “kapag lubos nang naihanda” o “kapag ganap nang nahubog”
  rationale: Maaaring tumukoy ang pandiwa sa paghahanda, pagsasangkap, pag-aayos, o paghubog. Pinili ang “nasanay” dahil pedagogical ang agarang konteksto, habang inilalagay sa talababa ang mas malawak na alternatibo upang hindi itago ang saklaw ng salita.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “alagad” dahil ang konteksto ay relasyonal na pagkatuto at paghubog, ngunit iniwasan ang masyadong teknikal o denominasyonal na pananalita.
