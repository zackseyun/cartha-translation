  text: Οὐαὶ ὅταν ⸂καλῶς ὑμᾶς⸃ εἴπωσιν ⸀πάντες οἱ ἄνθρωποι, κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς ψευδοπροφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/026.yaml
  text: Woe when all people speak well of you[b][a], for their fathers used to do the same to the false prophets.
translation:
  language: tl
  text: Sa aba ninyo kapag magsalita nang mabuti tungkol sa inyo ang lahat ng tao[a], sapagkat ganoon din ang nakagawian noon ng kanilang mga ninuno[b] sa mga huwad na propeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magsalita nang pabor sa inyo.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “kanilang mga ama”; ibig sabihin, ang mga naunang salinlahi ng kanilang bayan.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαί
  choice: Sa aba ninyo
  rationale: Pinananatili nito ang mariing babala at tonong propetiko ng οὐαί. Bagaman walang hayag na ὑμῖν sa Griyego, likas sa Tagalog na tukuyin ang kausap upang maging buo ang pahayag.
- source_word: ὅταν
  choice: kapag
  rationale: Ipinahahayag nito ang pangkalahatan o maaaring maulit na kalagayan, gaya ng gamit ng ὅταν dito.
- source_word: καλῶς ὑμᾶς εἴπωσιν
  choice: mabuti ang sinasabi tungkol sa inyo
  rationale: Inililipat nito ang idyomang tumutukoy sa positibo o kanais-nais na pagsasalita tungkol sa isang tao, nang hindi ito nililimitahan sa tahasang pagpuri.
- source_word: πάντες οἱ ἄνθρωποι
  choice: lahat ng tao
  rationale: Tumpak at likas na panlahatang katumbas ito na hindi nagpapahiwatig na mga lalaki lamang ang tinutukoy.
- source_word: κατὰ τὰ αὐτά
  choice: gayon din
  rationale: Likas nitong ipinahahayag sa Tagalog ang paghahambing na ‘sa gayunding paraan’ o ‘ang gayon ding bagay.’
- source_word: γάρ
  choice: sapagkat
  rationale: Malinaw nitong pinananatili ang paliwanag na nagbibigay-batayan sa naunang babala.
- source_word: ἐποίουν
  choice: dating ginagawa
  rationale: Ipinakikita ng ‘dating’ ang nakagawiang kilos sa nakaraan na ipinahihiwatig ng imperpektong anyo.
- source_word: τοῖς ψευδοπροφήταις
  choice: sa mga huwad na propeta
  rationale: Tuwirang ipinakikita nito kung kanino iniukol ang gayong pakikitungo.
- source_word: οἱ πατέρες αὐτῶν
  choice: kanilang mga ninuno
  rationale: Mas natural sa modernong Tagalog ang ‘mga ninuno’ para sa naunang mga salinlahi, habang inilalagay sa talababa ang literal na anyong ‘mga ama.’
theological_decisions:
- issue: Saklaw ng babala tungkol sa pagsasalita ng mabuti ng lahat
  choice: 'Pinananatili ang paghahambing: ang pangkalahatang pagsang-ayon ng mga tao ay kahawig ng pagtanggap ng mga naunang salinlahi sa mga huwad na propeta.'
  alternative: Unawain ang talata bilang tahasang paghatol sa lahat ng uri ng papuri o positibong pananalita.
  rationale: Ang γάρ at κατὰ τὰ αὐτά ay nag-uugnay sa babala at sa makasaysayang huwaran ng pagtanggap sa mga huwad na propeta. Hindi dapat palawakin ng salin ang pahayag upang ipagbawal ang bawat uri ng papuri.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Sa aba ninyo’ upang mapanatili ang propetikong bigat, at ang ‘dating ginagawa’ upang maipakita ang nakagawiang kilos sa nakaraan.
