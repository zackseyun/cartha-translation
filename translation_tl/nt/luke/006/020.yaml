  text: Καὶ αὐτὸς ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τοὺς μαθητὰς αὐτοῦ ἔλεγεν· Μακάριοι οἱ πτωχοί, ὅτι ὑμετέρα ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/020.yaml
  text: 'And he[a], lifting up his eyes toward his disciples, was saying: “Blessed are the poor[b], because yours is the kingdom of God.”'
translation:
  language: tl
  text: 'At itinaas niya ang kanyang tingin tungo sa kanyang mga alagad at sinabi: “Mapalad kayong mga dukha[a], sapagkat sa inyo ang kaharian ng Diyos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “Mapalad ang mga dukha,” ngunit ang kasunod na “sa inyo” ay nagpapakitang tuwiran silang kinakausap. “Mga dukha” ang sinabi ni Lucas, hindi “mga dukha sa espiritu” (ihambing sa Mat. 5:3).
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: itiningin niya ang kanyang mga mata
  rationale: Pinananatili ang konkretong larawan ng pag-angat at pagtutuon ng tingin, ngunit ipinapahayag ito sa natural na modernong Tagalog.
- source_word: εἰς τοὺς μαθητὰς αὐτοῦ
  choice: sa kanyang mga alagad
  rationale: Sa kontekstong ito, ipinahihiwatig ng εἰς ang direksiyon ng tingin patungo sa mga alagad.
- source_word: ἔλεγεν
  choice: sinabi
  rationale: Bagaman imperpekto ang anyong Griyego, natural na panimulang pormula sa salaysay na Tagalog ang “sinabi”; hindi kailangang gawing artipisyal na “ay nagsasabi” ang aspektong diskurso.
- source_word: Μακάριοι
  choice: Pinagpala
  rationale: Ang “pinagpala” ay may angkop na relihiyoso at tipanang bigat; mas malalim ito kaysa sa simpleng “masaya” o “mapalad” lamang.
- source_word: οἱ πτωχοί
  choice: kayong mga dukha
  rationale: Pormal na tumutukoy ang Griyego sa “mga dukha,” ngunit ginagawang tuwirang pakikipag-usap ng kasunod na ὑμετέρα (“sa inyo”). Likas sa Tagalog ang “kayong mga dukha” at hindi nito dinaragdagan ang teksto ng “sa espiritu.”
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw nitong ipinakikita ang dahilan o batayan ng pagpapala sa isang marangal ngunit kasalukuyang rehistro.
- source_word: ὑμετέρα ἐστὶν
  choice: sa inyo ang
  rationale: Natural na predikatibong pagmamay-ari sa Tagalog at pinananatili ang diin sa mga tuwirang kinakausap.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Ito ang malawak, kinagisnan, at tumpak na katumbas na hindi nagpapakitid sa saklaw tungo lamang sa gawa ng paghahari.
theological_decisions:
- issue: Kung bibigyang espirituwal na pagpapakahulugan ang πτωχοί
  choice: mga dukha
  alternative: mga dukha sa espiritu
  rationale: “Mga dukha” lamang ang nasa teksto ni Lucas. Hindi dapat ipasok ang dagdag na pananalita mula sa Mateo 5:3 o ipasiya sa salin kung materyal, panlipunan, o mas malawak ang buong teolohikal na saklaw.
- issue: Kung gagamit ng ikatlong panauhan o tuwirang pakikipag-usap sa beatitud
  choice: Pinagpala kayong mga dukha
  alternative: Pinagpala ang mga dukha
  rationale: Bagaman ikatlong panauhan sa anyo ang οἱ πτωχοί, ang ὑμετέρα (“sa inyo”) ay tuwirang kumakausap sa mga alagad. Pinananatili ng napiling salin ang parehong leksikal na nilalaman at daloy ng pakikipag-usap.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “dukha” sa halip na “mahirap” upang maiwasan ang karaniwang kahulugang ‘difficult’ at mapanatili ang malinaw na pagtukoy sa kahirapan. Isinama sa iisang talababa ang pormal na ikatlong-panauhang anyo at ang mahalagang pagkakaiba sa Mateo.
