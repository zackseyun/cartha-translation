  yaml_path: translation/nt/luke/006/010.yaml
  text: And after looking around at them all[a], he said to him, “Stretch out your hand.” And he did so, and his hand was restored.
translation:
  language: tl
  text: Matapos niyang libutin ng tingin ang lahat ng naroon, sinabi niya sa lalaki, “Iunat mo ang iyong kamay.” Ginawa nga iyon ng lalaki, at nanumbalik sa dati ang kanyang kamay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gumaling ang kanyang kamay.” Mas literal na sinasabi ng Griyego na nanumbalik ang kamay sa dati nitong kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: Matapos niyang tumingin sa paligid at masdan
  rationale: Ipinahahayag ng aorist participle ang pagtingin ni Jesus sa mga nasa paligid bago siya nagsalita. Natural sa modernong Tagalog ang “matapos,” at pinananatili ng “tumingin sa paligid at masdan” ang ideya ng sadyang pagtanaw sa mga naroon.
- source_word: πάντας αὐτούς
  choice: silang lahat
  rationale: Pinananatili nito ang diin na tiningnan niya ang lahat ng tinutukoy na naroon, nang hindi ginagawang “bawat isa” ang parirala.
- source_word: εἶπεν αὐτῷ
  choice: sinabi niya sa lalaki
  rationale: Ang “sa lalaki” ay likas at malinaw na pagtukoy sa lalaking kinakausap sa konteksto, habang hindi dinaragdagan ang uri o layunin ng pananalita.
- source_word: Ἔκτεινον τὴν χεῖρά σου
  choice: Iunat mo ang iyong kamay
  rationale: Ang “iunat” ay tuwiran at karaniwang katumbas ng utos na ἔκτεινον, at ang χείρ ay wastong pinanatiling “kamay,” hindi “braso.”
- source_word: ὁ δὲ ἐποίησεν
  choice: Ginawa nga iyon ng lalaki
  rationale: Tumutukoy ang ἐποίησεν sa pagsunod sa iniutos. Ang “nga” ay banayad na nag-uugnay sa utos at pagtupad nang hindi labis na pinabibigat ang δέ.
- source_word: ἀπεκατεστάθη
  choice: nanumbalik sa dati
  rationale: Ipinapakita ng ἀποκαθίστημι ang pagbabalik sa dating maayos na kalagayan. Ang pariralang ito ay natural sa Tagalog at mas malapit sa restoration language kaysa sa mas interpretatibong “gumaling.”
- source_word: ἡ χεὶρ αὐτοῦ
  choice: ang kanyang kamay
  rationale: Pinananatili ang tahasang pag-uulit ng “kamay” sa Griyego at malinaw na itinatampok ang bunga ng himala.
theological_decisions:
- issue: Paglalarawan sa himala sa ἀπεκατεστάθη
  choice: nanumbalik sa dati ang kanyang kamay
  alternative: gumaling ang kanyang kamay
  rationale: Binibigyang-diin ng pandiwang Griyego ang pagbabalik sa wastong kalagayan. Pinananatili ng salin ang wikang ito sa halip na tahasang gawing medikal na “gumaling,” bagaman iyon ang malinaw na diwa sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “iyong” sa tuwirang pananalita para sa dignified biblical register, ngunit iniwasan ang lipas o labis na pormal na mga salita. Inilagay ang talababa sa pariralang tinutukoy nito.
