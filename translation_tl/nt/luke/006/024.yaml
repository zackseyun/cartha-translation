  text: But woe to you who are rich[b][a], for you have received your comfort.
translation:
  language: tl
  text: Ngunit sa aba ninyo, kayong mayayaman, sapagkat natanggap na ninyo nang buo ang inyong kaaliwan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tinatanggap ninyo ang inyong kaaliwan.” Ang pandiwa ay nasa pangkasalukuyang anyo ngunit maaari ring mangahulugang pagtanggap nang lubos o ganap na.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Ngunit
  rationale: Nagpapakita ito ng matinding pagsalungat sa mga pagpapalang nauna, sa natural ngunit marangal na Tagalog.
- source_word: οὐαὶ ὑμῖν
  choice: nakakaawa kayo
  rationale: Ipinahahayag nito ang taimtim na babala at kapahamakang nakapaloob sa pormulang οὐαί, nang hindi ito pinahihina bilang simpleng lungkot lamang.
- source_word: τοῖς πλουσίοις
  choice: na mayayaman
  rationale: Tuwirang tumutukoy sa mga taong mayaman at hindi nagdaragdag ng paliwanag tungkol sa kanilang saloobin o paggamit ng kayamanan.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng naunang babala habang pinananatili ang marangal na rehistro.
- source_word: ἀπέχετε
  choice: tinatanggap na ninyo nang buo
  rationale: Ang pandiwa ay nasa pangkasalukuyan ngunit maaaring may idyomatikong diwang natanggap na nang lubos ang nararapat; pinagsasama ng salin ang kasalukuyang aspekto at ang diwa ng lubos na pagtanggap.
- source_word: τὴν παράκλησιν ὑμῶν
  choice: ang inyong kaaliwan
  rationale: Ang “kaaliwan” ay natural at madaling maunawaan para sa παράκλησις sa kontekstong ito; maaari rin itong mangahulugang “konsolasyon.”
theological_decisions:
- issue: Likas ng babala sa mayayaman
  choice: Pinanatili bilang tuwirang pahayag ng pagkaawa at kapahamakan sa mga mayayaman.
  alternative: Palambutin bilang “kawawa naman kayo,” o dagdagan ng “mga nagtitiwala sa kayamanan.”
  rationale: Tuwirang kinakausap ng Griyego ang “mga mayayaman.” Hindi dapat idagdag ang isang moral na kwalipikasyong wala sa talata, ni pahinain ang bigat ng οὐαί.
- issue: Temporal at idyomatikong puwersa ng ἀπέχετε
  choice: “tinatanggap na ninyo nang buo”
  alternative: “natanggap na ninyo” o “tinatanggap ninyo”
  rationale: Pinananatili nito ang pangkasalukuyang anyo at ang posibleng komersiyal na diwa ng pagtanggap nang lubos, nang hindi pinipiling eksklusibo ang isa lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, tuwiran, at marangal. Ginamit ang “nakakaawa kayo” upang maipahayag ang solemneng οὐαί nang mas natural kaysa sa arkaikong “sa aba ninyo,” habang pinananatili ang bigat ng babala.
