  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ τῆς καρδίας ⸀αὐτοῦ προφέρει τὸ ἀγαθόν, καὶ ὁ ⸀πονηρὸς ἐκ τοῦ ⸀πονηροῦ προφέρει τὸ πονηρόν· ἐκ γὰρ ⸀περισσεύματος καρδίας λαλεῖ τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/045.yaml
  text: The good man brings forth what is good out of the good treasure of his heart[a], and the evil man out of his evil treasure brings forth what is evil; for out of the overflow of the heart his mouth speaks.
translation:
  language: tl
  text: Ang mabuting tao ay naglalabas ng mabuti mula sa mabuting kayamanan ng kanyang puso, at ang masamang tao ay naglalabas ng masama mula sa kanyang masamang kayamanan; sapagkat kung ano ang nag-uumapaw sa puso[a], iyon ang sinasabi ng kanyang bibig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “kasaganaan ng puso”: “sapagkat mula sa kasaganaan ng puso ay nagsasalita ang kanyang bibig.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθὸς ἄνθρωπος
  choice: mabuting tao
  rationale: Likas at malinaw sa modernong Tagalog; ang “tao” ay maaaring tumukoy sa kinatawang indibidwal nang hindi pinipilit ang kasariang hindi mahalaga sa diwa ng kasabihan.
- source_word: θησαυροῦ
  choice: kayamanan
  rationale: Pinananatili ang talinghaga ng nakaimbak na yamang panloob na pinagmumulan ng kilos at pananalita.
- source_word: καρδίας
  choice: puso
  rationale: Karaniwang katumbas sa Tagalog para sa kalooban at panloob na pagkatao, at pinananatili ang larawan ng tekstong Griyego.
- source_word: προφέρει
  choice: naglalabas
  rationale: Ipinahahayag ang paglabas ng mabuti o masama mula sa isang panloob na imbakan at natural pakinggan sa Tagalog.
- source_word: πονηρὸς / πονηροῦ / πονηρόν
  choice: masama / masamang kayamanan / masama
  rationale: Pinananatili ang malinaw na moral na pagsalungat sa ἀγαθός nang hindi gumagamit ng salitang labis na mabigat o di-likas sa karaniwang Tagalog.
- source_word: περισσεύματος
  choice: nag-uumapaw
  rationale: Ipinakikita ang larawang may sobrang laman na umaapaw at lumalabas bilang pananalita; inilakip sa talababa ang mas pormal na “kasaganaan.”
- source_word: λαλεῖ
  choice: sinasabi
  rationale: Sa ganitong kasabihan, natural na ipinahahayag nito ang nilalamang lumalabas sa bibig; mas malinaw sa Tagalog kaysa sa literal ngunit alanganing ayos na “nagsasalita ang bibig.”
- source_word: τὸ στόμα αὐτοῦ
  choice: kanyang bibig
  rationale: Pinananatili ang tahasang pagbanggit sa bibig bilang panlabas na tagapagpahayag ng laman ng puso.
theological_decisions:
- issue: Moral na pagsalungat ng ἀγαθός at πονηρός
  choice: mabuti at masama
  alternative: maayos at di-maayos; mabuti at balakyot
  rationale: Ang konteksto ay tungkol sa moral na katangian at bunga nito. Ang “mabuti” at “masama” ay malinaw, timbang, at hindi nagpapahina sa etikal na bigat ng sinabi ni Jesus.
- issue: Ugnayan ng puso at pananalita
  choice: kung ano ang nag-uumapaw sa puso, iyon ang sinasabi ng kanyang bibig
  alternative: mula sa kasaganaan ng puso ay nagsasalita ang kanyang bibig
  rationale: Pinananatili ang larawan na ang pananalita ay bunga ng pumupunô sa puso, nang hindi ginagawang teknikal na pahayag tungkol sa mga bahagi ng tao o nilulutas nang higit sa sinasabi ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mga pangunahing talinghaga ng kayamanan, puso, pag-apaw, at bibig, habang inayos ang huling sugnay sa likas na balangkas ng Tagalog.
