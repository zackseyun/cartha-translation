id: LUK.6.41
reference: Luke 6:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ δοκὸν τὴν ἐν τῷ ἰδίῳ ὀφθαλμῷ οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/041.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: tl
  text: Ngunit bakit mo nakikita ang puwing sa mata ng iyong kapatid[a], samantalang hindi mo napapansin ang tahilan sa sarili mong mata?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kapatid” ay maaaring tumukoy sa kapatid na lalaki o babae; panlalaki ang anyo ng salitang Griyego sa talinghaga.
    reason: cultural_note
  - marker: b
    text: Ang “puwing” (Griyego κάρφος) ay munting butil, dayami, o piraso; ang “tahilan” (Griyego δοκός) ay malaking kahoy na pangkayarian.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί δὲ
  choice: Ngunit bakit
  rationale: Sa retorikal na tanong, ang τί ay may mapanuring diwang ‘bakit,’ at ang δέ ay nagpapahiwatig ng bahagyang pagsalungat o paglipat.
- source_word: βλέπεις
  choice: nakikita mo
  rationale: Pinananatili ang karaniwang pandiwa ng pagkakita at ang kongkretong talinghaga tungkol sa mata.
- source_word: κάρφος
  choice: puwing
  rationale: Ang ‘puwing’ ay natural sa modernong Tagalog para sa munting butil o pirasong nakapasok sa mata at malinaw na kasalungat ng napakalaking tahilan.
- source_word: ἀδελφοῦ
  choice: kapatid
  rationale: Ang Tagalog na ‘kapatid’ ay likas na walang tinutukoy na kasarian ngunit tuwirang katumbas ng ugnayang ipinahahayag ng ἀδελφός; hindi nito nililimitahan ang larawan sa lalaking kapatid.
- source_word: δοκόν
  choice: tahilan
  rationale: Ang ‘tahilan’ ay malaking kahoy na pangkayarian at tumpak na nagpapanatili sa eksaheradong paghahambing sa munting puwing.
- source_word: ἰδίῳ
  choice: sarili mong
  rationale: Ipinakikita ang diin ng ἴδιος sa sariling mata ng kausap, bilang tuwirang kaibahan sa mata ng kapatid.
- source_word: κατανοεῖς
  choice: hindi mo napapansin
  rationale: Ipinahahayag ang kabiguang kilalanin o pagtuunan ng pansin ang malinaw na kapintasan sa sarili, habang nananatiling natural sa Tagalog.
theological_decisions:
- issue: Saklaw ng ἀδελφοῦ
  choice: kapatid
  alternative: kapatid na lalaki; kapatid sa pananampalataya
  rationale: Hindi minamarkahan ng salitang Tagalog na ‘kapatid’ ang kasarian, ngunit tapat nitong pinananatili ang ugnayang pampamilya sa larawan. Hindi rin ipinapasok sa teksto ang mas tiyak na interpretasyong ‘kapatid sa pananampalataya.’
- issue: Lakas ng paghahambing sa κάρφος at δοκός
  choice: puwing at tahilan
  alternative: munting piraso at troso
  rationale: Pinananatili ng mga salitang ito ang sadyang matinding pagkakaiba ng napakaliit na bagay at malaking kahoy, nang hindi pinapahina ang mapanuyang talinghaga ni Jesus.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang ‘puwing’ dahil karaniwan at angkop sa mata, at ‘tahilan’ upang mapanatili ang tiyak na larawang pangkayarian at ang eksaheradong paghahambing. Inilagay ang bawat panandang talababa sa mismong teksto.
