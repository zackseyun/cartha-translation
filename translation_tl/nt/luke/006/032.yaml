  text: Καὶ εἰ ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; καὶ γὰρ οἱ ἁμαρτωλοὶ τοὺς ἀγαπῶντας αὐτοὺς ἀγαπῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/032.yaml
  text: And if you love those who love you[a], what credit is that to you? For even sinners love those who love them.
translation:
  language: tl
  text: Kung minamahal ninyo ang mga nagmamahal sa inyo, ano ang kapuri-puri sa inyo?[a] Sapagkat kahit ang mga makasalanan ay nagmamahal sa mga nagmamahal sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Anong biyaya o pabor ang para sa inyo?” Ang salitang Griyego ay maaaring mangahulugang “biyaya,” “pabor,” o pagkilalang marapat; sa kontekstong ito, tumutukoy ito sa kung ano ang kapuri-puri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶτε / ἀγαπῶντας / ἀγαπῶσιν
  choice: minamahal / nagmamahal
  rationale: Ginamit nang pare-pareho ang salitang “mahal” upang mapanatili ang tahasang pag-uulit at ugnayang leksikal ng tatlong anyo ng ἀγαπάω.
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: ano ang kapuri-puri sa inyo?
  rationale: Natural itong tanong sa modernong Filipino at ipinahahayag ang kontekstuwal na diwa ng χάρις bilang pagkilalang marapat o bagay na maipagkakapuri, habang pinananatili ang ὑμῖν bilang “sa inyo.”
- source_word: ἁμαρτωλοὶ
  choice: mga makasalanan
  rationale: Tuwiran at karaniwang katumbas ito ng substantibong pang-uri sa Griyego at pinananatili ang moral na kategorya ng teksto.
- source_word: καὶ γὰρ
  choice: Sapagkat kahit
  rationale: Ipinahahayag ng “sapagkat” ang paliwanag na hatid ng γάρ at ng “kahit” ang diin ng καί sa inklusibong pahayag.
theological_decisions:
- issue: Kahulugan ng χάρις sa retorikal na tanong
  choice: kapuri-puri, sa diwa ng pagkilalang marapat
  alternative: biyaya; pabor; pasasalamat
  rationale: Ang agarang konteksto ay nagtatanong kung ano ang natatangi o maipagkakapuri sa pagmamahal lamang sa mga gumaganti ng pagmamahal. Hindi ginawang “biyaya” sa pangunahing teksto upang hindi kusang ipasok ang teknikal na teolohikal na kahulugan, ngunit itinala sa talababa ang tunay na lawak ng salitang Griyego.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang pag-uulit ng “nagmamahal” para sa retorikal na diin ng orihinal; iniwasan ang mas teknikal o denominasyonal na pananalita.
