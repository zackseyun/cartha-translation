base_translation:
  language: en
  yaml_path: translation/nt/luke/006/013.yaml
  text: And when day came[a], he called his disciples, and chose twelve from among them[b], whom he also named apostles.
translation:
  language: tl
  text: Pagsapit ng araw, tinawag[a] niya ang kanyang mga alagad at pumili siya ng labindalawa mula sa kanila, at pinangalanan niya silang mga apostol[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipinatawag.” Maaaring mangahulugan ang pandiwang Griego na tumawag upang lumapit o kumausap; sa kontekstong ito, ipinatawag niya ang mga alagad upang pumili mula sa kanila.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tinawag niyang mga apostol.” Ang pandiwang Griego ay maaaring mangahulugang “pinangalanan” o “tinawag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡμέρα
  choice: Nang mag-umaga na
  rationale: Likas na salin sa modernong Tagalog para sa pagsapit ng araw; malinaw nitong ipinahihiwatig ang pagdating ng umaga nang hindi labis na literal.
- source_word: προσεφώνησεν
  choice: tinawag
  rationale: Sa konteksto, tinipon ni Jesus ang kanyang mga alagad upang pumili mula sa kanila. Ang “tinawag” ay natural at saklaw ang diwa ng pagtawag sa kanila upang lumapit.
- source_word: μαθητὰς
  choice: mga alagad
  rationale: Ang “mga alagad” ang malinaw at nakaugaliang katawagan sa Tagalog para sa mga μαθηταί ni Jesus at pinananatili ang ugnayan ng tagasunod at guro.
- source_word: ἐκλεξάμενος
  choice: pumili
  rationale: Tuwiran at natural itong naghahatid ng sinadyang pagpili ni Jesus mula sa mas malaking pangkat.
- source_word: ἀπ’ αὐτῶν
  choice: mula sa kanila
  rationale: Ipinakikita nitong ang labindalawa ay pinili mula sa mas malaking pangkat ng mga alagad.
- source_word: δώδεκα
  choice: labindalawa
  rationale: Tuwirang salin ng bilang.
- source_word: ὠνόμασεν
  choice: pinangalanan
  rationale: Malinaw nitong ipinakikita na ibinigay ni Jesus sa labindalawa ang katawagang “mga apostol,” at naiiwasan ang pag-uulit ng “tinawag” sa naunang sugnay.
- source_word: ἀποστόλους
  choice: mga apostol
  rationale: Ang “mga apostol” ang nakaugaliang katawagan sa Tagalog at dito ay ginagamit bilang natatanging pangalang ibinigay sa labindalawa, hindi lamang bilang pangkalahatang paglalarawan sa mga isinugo.
theological_decisions:
- issue: Kung isasalin ang ἀποστόλους bilang pangkalahatang “mga isinugo” o bilang nakaugaliang titulong “mga apostol”
  choice: mga apostol
  alternative: mga isinugo; mga sugo
  rationale: Sa talata, ang salita ay isang katawagang ibinigay ni Jesus sa labindalawa. Pinananatili ng “mga apostol” ang tungkulin nito sa salaysay nang hindi nagdaragdag ng mga doktrinal na pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “alagad” at “apostol” bilang malinaw at nakaugaliang mga terminong biblikal; iniwasan ang makalumang ayos at labis na literal na pananalita.
