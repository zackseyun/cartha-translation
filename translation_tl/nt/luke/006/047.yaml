  text: πᾶς ὁ ἐρχόμενος πρός με καὶ ἀκούων μου τῶν λόγων καὶ ποιῶν αὐτούς, ὑποδείξω ὑμῖν τίνι ἐστὶν ὅμοιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/047.yaml
  text: Everyone who comes to me and hears my words and does them—I will show you what he is like:[a][b]
translation:
  language: tl
  text: Ang sinumang lumalapit sa akin, nakaririnig ng aking mga salita, at isinasagawa ang mga ito—ipakikita ko sa inyo kung kanino siya maihahalintulad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ἐρχόμενος πρός με
  choice: Ang bawat lumalapit sa akin
  rationale: Ipinahahayag ng πᾶς kasama ng articular participle ang lahat ng kabilang sa pangkat na inilalarawan. Pinananatili ng “bawat lumalapit” ang pangkalahatan at isahang diwa nang hindi nagdaragdag ng tahasang salitang para sa kasarian.
- source_word: ἀκούων μου τῶν λόγων
  choice: nakikinig sa aking mga salita
  rationale: Ang “aking mga salita” ay likas na salin ng genitive construction. Sa Filipino, mas natural sa kontekstong ito ang “nakikinig sa” kaysa “naririnig,” at ang kasunod na pagsasagawa ang nagpapakitang hindi lamang pisikal na pagkarinig ang tinutukoy.
- source_word: ποιῶν αὐτούς
  choice: isinasagawa ang mga ito
  rationale: Kapag mga salita o turo ang layon ng ποιέω, tumutukoy ito sa paggawa ayon sa mga iyon. Ang “isinasagawa” ay natural na Filipino at hindi labis na nagpapaliwanag gaya ng “sinusunod ang lahat ng utos.”
- source_word: ὑποδείξω ὑμῖν
  choice: ipakikita ko sa inyo
  rationale: Tuwirang ipinakikilala ng future verb ang paghahambing na kasunod. Dignified at karaniwan ang “ipakikita ko sa inyo.”
- source_word: τίνι ἐστὶν ὅμοιος
  choice: kung kanino siya maihahalintulad
  rationale: Pinananatili nito ang pormal na diwa ng dative interrogative τίνι, “kanino,” at likas nitong inihahanda ang paghahambing sa taong inilalarawan sa susunod na talata.
theological_decisions:
- issue: Pangkalahatang isahan at kasarian
  choice: Gamitin ang “siya” bilang pangkalahatang isahang panghalip
  alternative: Ulitin ang “ang taong iyon” o gawing maramihan ang pahayag
  rationale: Masculine singular ang anyo sa Griyego ngunit pangkalahatan ang gamit. Walang kasariang itinatakda ang “siya” sa Filipino, kaya napapanatili nito kapwa ang isahang representasyon at ang saklaw sa sinumang tao.
- issue: Ugnayan ng pakikinig at paggawa
  choice: Panatilihing magkahiwalay ang “nakikinig” at “isinasagawa”
  alternative: Pagsamahin bilang “nakikinig at sumusunod”
  rationale: Mahalaga sa pangungusap ang magkatabing kilos ng pagdinig at paggawa. Hindi dapat pag-isahin ang mga ito o ipakahulugang sapat na ang pakikinig lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tatlong magkakaugnay na kilos—paglapit, pakikinig, at pagsasagawa—at ang isahang paghahambing. Ginamit ang “maihahalintulad” sapagkat ang susunod na talata ay tahasang naghahambing sa taong nagtatayo ng bahay.
