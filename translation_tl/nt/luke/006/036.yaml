  text: ⸀γίνεσθε οἰκτίρμονες ⸀καθὼς ὁ πατὴρ ὑμῶν οἰκτίρμων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/036.yaml
  text: Be merciful[a], just as your Father is merciful.
translation:
  language: tl
  text: Maging mahabagin kayo[a], kung paanong mahabagin ang inyong Ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mapagmalasakit.” Ang salitang Griyego ay tumutukoy sa taong naaantig sa awa at nagpapakita ng habag.
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: Maging
  rationale: Ang pangkasalukuyang pautos na maramihan ay nananawagan sa mga alagad na patuloy na isabuhay ang katangiang ito. Natural sa Tagalog ang “Maging” at napananatili nito ang diwa ng γίνομαι nang hindi nagiging mabigat ang pananalita.
- source_word: οἰκτίρμονες / οἰκτίρμων
  choice: mahabagin
  rationale: Ang “mahabagin” ay likas at marangal na katumbas ng salitang tumutukoy sa taong naaantig sa awa at nagpapakita nito. Pareho itong ginamit sa dalawang paglitaw upang mapanatili ang malinaw na leksikal na ugnayan.
- source_word: καθὼς
  choice: kung paanong
  rationale: 'Malinaw na ipinakikita ng “kung paanong” ang paghahambing: ang habag ng Ama ang huwaran ng asal ng mga alagad, hindi lamang ang dahilan nito.'
- source_word: ὁ πατὴρ ὑμῶν
  choice: ang inyong Ama
  rationale: Tuwirang pinananatili ang “inyong Ama” at hindi idinaragdag ang “nasa langit,” sapagkat wala iyon sa tekstong Griyego ng talatang ito.
theological_decisions:
- issue: Ugnayan ng utos sa katangian ng Ama
  choice: 'Inilalahad ang habag ng Ama bilang huwaran: “kung paanong mahabagin ang inyong Ama.”'
  alternative: “sapagkat mahabagin ang inyong Ama”
  rationale: Ang καθώς ay pangunahing naghahayag dito ng paghahambing o huwaran, hindi ng sanhi. Pinananatili nito ang panawagang tularan ang katangian ng Ama nang walang idinaragdag na paliwanag na teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, maikli, at marangal. Ginamit ang “kayo/inyong” upang malinaw na katawanin ang maramihang anyo sa Griyego; pinanatili ang malaking titik sa “Ama” bilang relational na pagtukoy sa Diyos.
