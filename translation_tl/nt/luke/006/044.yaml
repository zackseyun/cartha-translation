  text: ἕκαστον γὰρ δένδρον ἐκ τοῦ ἰδίου καρποῦ γινώσκεται· οὐ γὰρ ἐξ ἀκανθῶν συλλέγουσιν σῦκα, οὐδὲ ἐκ βάτου ⸂σταφυλὴν τρυγῶσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/044.yaml
  text: For each tree is known by its own fruit[a]. For they do not gather figs from thorns[b], nor do they harvest grapes from a bramble bush.
translation:
  language: tl
  text: Sapagkat ang bawat puno ay nakikilala sa sarili nitong bunga. Hindi naman pumipitas ng mga igos mula sa mga tinik[a], ni umaani ng mga ubas mula sa dawag[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga halamang matinik.”
    reason: lexical_alternative
  - marker: b
    text: Ang “dawag” ay isang matinik at buhol-buhol na palumpong o halaman.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἕκαστον ... δένδρον
  choice: ang bawat puno
  rationale: Pinananatili ng “bawat” ang distributibong diwa ng ἕκαστον kasama ng pang-isahang δένδρον, at natural ito sa makabagong Tagalog.
- source_word: γὰρ
  choice: sapagkat / hindi isinalin nang hiwalay sa ikalawang sugnay
  rationale: Ang unang γάρ ay ginawang “Sapagkat” upang ipakita ang paliwanag na ugnayan sa naunang pahayag. Ang ikalawa ay likas na naipahihiwatig ng kasunod na halimbawang nagpapatunay sa kawikaan; ang pag-uulit ng “sapagkat” ay magiging mabigat sa Tagalog.
- source_word: ἐκ τοῦ ἰδίου καρποῦ
  choice: sa sarili nitong bunga
  rationale: Sa pariralang “nakikilala sa,” malinaw at natural na ipinapahayag ang batayan ng pagkilala. Isinasalin ng “sarili nitong” ang diin ng ἰδίου sa pagtutugma ng puno at bunga nito.
- source_word: γινώσκεται
  choice: ay nakikilala
  rationale: 'Ipinahahayag nito ang pangkasalukuyang pasibong diwa: karaniwang nakikilala o natutukoy ang puno sa bunga nito.'
- source_word: ἀκανθῶν
  choice: mga tinik
  rationale: Malawak ang saklaw ng salitang Griyego at maaaring tumukoy sa mga tinik o halamang matinik. Ang “mga tinik” ay maikli, pamilyar, at angkop sa anyong-kawikaan; nililinaw sa talababa ang alternatibo.
- source_word: συλλέγουσιν
  choice: pumipitas
  rationale: Sa konteksto ng nakakain na bunga, natural sa Tagalog ang “pumipitas” at malinaw na naiiba sa mas tiyak na pag-aani ng ubas sa kasunod na sugnay.
- source_word: σῦκα
  choice: mga igos
  rationale: Ito ang karaniwang makabagong salin ng pangmaramihang σῦκα.
- source_word: βάτου
  choice: dawag
  rationale: Ang “dawag” ay tumutukoy sa matinik at buhol-buhol na palumpong o halaman, kaya mas tiyak ito kaysa sa pangkalahatang “palumpong” at hindi naman nagpapalagay ng isang partikular na species.
- source_word: σταφυλήν
  choice: mga ubas
  rationale: Bagaman pang-isahan ang anyong Griyego, natural na ginagamit sa Tagalog ang pangmaramihang “mga ubas” para sa bunga o kumpol na inaani.
- source_word: τρυγῶσιν
  choice: umaani
  rationale: Ipinapanatili nito ang tiyak na diwa ng pag-aani ng hinog na bunga, lalo na ng ubas, at ang bahagyang pagkakaiba nito sa συλλέγουσιν.
theological_decisions:
- issue: Matalinghagang diwa ng puno at bunga
  choice: Pinanatili ang kawikaang pansakahan nang hindi tahasang idinaragdag ang aplikasyon nito sa pagkatao, mga gawa, o asal.
  alternative: Palawakin ang salin upang tukuyin nang tuwiran ang moral na katangian o mga gawa ng tao.
  rationale: Malinaw ang talinghaga sa konteksto, ngunit hindi mismo binabanggit ng talata ang moral na aplikasyon. Ang pagpapanatili sa larawan ng puno at bunga ay tapat sa teksto at hindi nilulutas nang labis ang saklaw ng talinghaga.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maikli at kawikaang himig ng Griyego. Ginamit ang “dawag” bilang tumpak ngunit maaaring hindi pamilyar na salitang botanikal, kaya nilagyan ito ng maikling paliwanag sa talababa.
