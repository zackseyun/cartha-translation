id: LUK.6.16
reference: Luke 6:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀καὶ Ἰούδαν Ἰακώβου καὶ Ἰούδαν ⸀Ἰσκαριὼθ ⸀ὃς ἐγένετο προδότης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/016.yaml
  text: and Judas son of James[a], and Judas Iscariot, who became a traitor.
translation:
  language: tl
  text: at si Judas na anak ni Santiago[a], at si Judas Iscariote, na naging taksil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Judas na kapatid ni Santiago”; literal na mababasa sa Griyego, “Judas ni Santiago.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδαν Ἰακώβου
  choice: Judas na anak ni Santiago
  rationale: Elliptical ang genitive na Ἰακώβου at hindi tahasang sinasabi ang ugnayan. Sa ganitong talaan ng mga pangalan, natural sa Tagalog na idagdag ang ugnayan; “anak ni Santiago” ang mas malamang na kahulugan, habang inilalagay sa talababa ang tunay na ambiguwidad.
- source_word: Ἰσκαριὼθ
  choice: Iscariote
  rationale: Isinalin sa nakasanayang anyong Filipino ng pantanging katawagan, sa halip na bigyan ito ng haka-hakang kahulugang etimolohikal.
- source_word: ὃς ἐγένετο
  choice: na naging
  rationale: Pinananatili nito ang puwersa ng γίνομαι bilang ‘naging’ o ‘dumating sa kalagayang,’ sa halip na gawing payak na ‘na siyang.’
- source_word: προδότης
  choice: taksil
  rationale: Ang προδότης ay taong nagtataksil. Ang “taksil” ay maikli, natural, at angkop bilang panaguri pagkatapos ng “naging.”
- source_word: καὶ
  choice: at
  rationale: Ang paulit-ulit na pangatnig ay tuwirang nag-uugnay sa huling dalawang pangalan sa talaan.
theological_decisions:
- issue: Ang ugnayang ipinahihiwatig ng Ἰακώβου sa “Judas of James”
  choice: “Judas na anak ni Santiago” sa pangunahing teksto
  alternative: “Judas na kapatid ni Santiago”; o literal na “Judas ni Santiago”
  rationale: Hindi tinutukoy ng anyong Griyego kung anak o kapatid si Judas. Pinili ang “anak” bilang mas malamang at natural na pagbasa sa isang talaan ng mga alagad, ngunit pinanatili sa talababa ang posibilidad na “kapatid” upang hindi tahimik na lutasin ang ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “Santiago” at “Iscariote” bilang nakasanayang anyong Filipino ng mga pangalan. Pinanatili ang serye ng pangatnig na “at” dahil bahagi ito ng talaan sa konteksto.
