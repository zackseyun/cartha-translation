source:
  edition: SBLGNT
  text: δίδοτε, καὶ δοθήσεται ὑμῖν· μέτρον καλὸν πεπιεσμένον ⸀σεσαλευμένον ὑπερεκχυννόμενον δώσουσιν εἰς τὸν κόλπον ὑμῶν· ⸂ᾧ γὰρ μέτρῳ⸃ μετρεῖτε ἀντιμετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/038.yaml
  text: 'Give[a], and it will be given to you: a good measure—pressed down, shaken together, overflowing—they will give into your lap. For with the measure by which you measure[b], it will be measured back to you.'
translation:
  language: tl
  text: Magbigay kayo, at bibigyan kayo. Isang mabuting takal—siniksik, niyugyog, at umaapaw—ang ibibigay nila sa inyong kandungan.[a] Sapagkat sa takalang ginagamit ninyo, iyon din ang itatakal pabalik sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kandungan” dito ay maaari ring tumukoy sa tupi sa harapan ng kasuotan, na maaaring gamiting sisidlan ng mga tinakal na produkto.
    reason: cultural_note
lexical_decisions:
- source_word: δίδοτε
  choice: Magbigay kayo
  rationale: Ang pangkasalukuyang pautos na maramihan ay natural na naipapahayag sa Filipino bilang “Magbigay kayo,” nang hindi labis na ipinipilit ang diwang paulit-ulit.
- source_word: δοθήσεται ὑμῖν
  choice: bibigyan kayo
  rationale: Pinananatili nito ang hinaharap at balintiyak na diwa ng Griyego sa natural na ayos ng Filipino.
- source_word: μέτρον καλὸν
  choice: isang mabuting takal
  rationale: Ang “takal” ay tumutukoy sa sinusukat na dami at sa larawang pangkalakalan; hindi idinaragdag ang interpretibong “sagana” o “mapagbigay.”
- source_word: πεπιεσμένον
  choice: siniksik
  rationale: Inilalarawan nito ang mga laman ng sisidlan na pinagdikit-dikit upang mas marami ang magkasya.
- source_word: σεσαλευμένον
  choice: niyugyog
  rationale: Ipinahihiwatig nito ang pagyugyog sa sisidlan upang lumapat ang laman, habang pinananatiling maikli ang sunod-sunod na larawan.
- source_word: ὑπερεκχυννόμενον
  choice: umaapaw
  rationale: Malinaw nitong inilalarawan ang laman na labis sa sisidlan at tumatapon sa gilid.
- source_word: δώσουσιν
  choice: ang ibibigay nila
  rationale: Pinananatili ang ikatlong panauhang maramihan na walang tiyak na tinutukoy na gumagawa, sa halip na tahimik itong gawing tahasang Diyos o isang balintiyak na pahayag.
- source_word: εἰς τὸν κόλπον ὑμῶν
  choice: sa inyong kandungan
  rationale: Natural itong katumbas sa modernong Filipino; nililinaw ng talababa ang sinaunang larawan ng tupi sa harapan ng kasuotan na sisidlan ng mga paninda.
- source_word: ᾧ γὰρ μέτρῳ μετρεῖτε
  choice: Sapagkat sa takalang ginagamit ninyo
  rationale: Pinananatili ang metapora ng iisang panukat at iniiwasan ang mabigat na literal na pag-uulit na hindi natural sa Filipino.
- source_word: ἀντιμετρηθήσεται ὑμῖν
  choice: iyon din ang itatakal pabalik sa inyo
  rationale: Ang “pabalik” ay nagpapahayag ng katumbas na pagganti o pagsukli na nasa ἀντί, nang hindi ito ginagawang usapin ng pagbabayad.
theological_decisions:
- issue: Kung lilimitahan ang utos sa salapi o paglilimos
  choice: Panatilihing malawak ang utos na magbigay at ang prinsipyo ng katumbas na takal.
  alternative: Ipaliwanag ito bilang tuwirang utos tungkol lamang sa salapi o materyal na paglilimos.
  rationale: Kasama sa malapit na konteksto ang awa, hindi paghatol, pagpapatawad, at pagbibigay. Hindi tahasang nililimitahan ng Griyego ang utos sa pera, kaya hindi idinaragdag ang isang makitid o prosperity-oriented na pagbasa.
- issue: Pagkakakilanlan ng hindi tiyak na paksa sa δώσουσιν
  choice: Panatilihin ang “nila” nang walang tinutukoy na tiyak na tagapagbigay.
  alternative: Gawing tahasang “ibibigay ng Diyos” o gawing ganap na balintiyak.
  rationale: May aktibong pandiwang ikatlong panauhang maramihan ang Griyego ngunit hindi pinapangalanan ang gumagawa. Pinananatili ng salin ang tunay na kawalang-tiyak na ito.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang larawang pangkalakalan sa “takal,” ang sunod-sunod na kilos na “siniksik, niyugyog, at umaapaw,” at ang hindi tiyak na “nila.”
