id: LUK.6.21
reference: Luke 6:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες νῦν, ὅτι χορτασθήσεσθε. μακάριοι οἱ κλαίοντες νῦν, ὅτι γελάσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/021.yaml
  text: Blessed are you who are hungry now[a], because you will be filled. Blessed are you who weep now[b], because you will laugh.
translation:
  language: tl
  text: Pinagpala kayong mga nagugutom ngayon, sapagkat bubusugin kayo.[a] Pinagpala kayong mga umiiyak ngayon, sapagkat tatawa kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lubos kayong masisiyahan.” Ang pandiwa ay maaaring tumukoy sa pagkabusog sa pagkain at, sa mas malawak na diwa, sa ganap na kasiyahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Pinagpala
  rationale: Pinananatili nito ang anyo at bigat ng pahayag ng pagpapala; ang “maligaya” ay maaaring magpahiwatig lamang ng pansariling damdamin.
- source_word: οἱ πεινῶντες νῦν
  choice: kayong mga nagugutom ngayon
  rationale: Bagaman artikular na participle ang Griyego, ang mga pandiwang nasa ikalawang panauhang maramihan at ang konteksto ay nagpapakitang tuwirang kinakausap ang mga alagad. Ang “nagugutom” ay natural at hindi nagpapalabis gaya ng “gutom na gutom.”
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan ng pagpapala sa isang dignified at likas na paraan sa Filipino.
- source_word: χορτασθήσεσθε
  choice: bubusugin kayo
  rationale: Pinananatili ang kongkretong larawan ng pagkabusog sa pagkain at ang anyong pasibo, habang bukas pa rin sa mas malawak na kahulugan ng ganap na kasiyahan.
- source_word: οἱ κλαίοντες νῦν
  choice: kayong mga umiiyak ngayon
  rationale: Ang tuwirang pagtukoy na “kayo” ay naaayon sa ikalawang panauhang pangako at sa konteksto. Ang “umiiyak” ay hindi nililimitahan sa pagluluksa dahil sa kamatayan.
- source_word: γελάσετε
  choice: tatawa kayo
  rationale: Tuwirang pinananatili ang matingkad na larawan ng pagbabaligtad mula sa pag-iyak tungo sa pagtawa, sa halip na gawing mas interpretatibong “magagalak.”
theological_decisions:
- issue: Tuwirang pakikipag-usap o pangkalahatang pahayag sa ikatlong panauhan
  choice: “kayong mga nagugutom/umiiyak”
  alternative: “ang mga nagugutom/umiiyak”
  rationale: Ang artikular na mga participle ay maaaring isalin sa ikatlong panauhan, ngunit ang mga pangakong pandiwa ay nasa ikalawang panauhang maramihan at ang agarang konteksto ay tuwirang pakikipag-usap sa mga alagad.
- issue: Kalikasan at panahon ng ipinangakong pagbabaligtad
  choice: Panatilihing kongkreto ang “bubusugin” at “tatawa” nang hindi tinutukoy kung temporal, espirituwal, o pangwakas ang katuparan.
  alternative: Ipaliwanag ito bilang espirituwal na kasiyahan lamang o bilang eksklusibong pangyayari sa wakas ng panahon.
  rationale: Ipinapangako ng talata ang pagbabaligtad ng kalagayan ngunit hindi nito tahasang nililinaw rito ang paraan o panahon ng katuparan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Ginamit ang “Pinagpala” upang mapanatili ang pormula ng beatitude, at ang mga kongkretong pandiwang “bubusugin” at “tatawa” upang hindi paliitin ang kahulugan sa isang tiyak na teolohikal na paliwanag.
