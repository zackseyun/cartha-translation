id: LUK.6.5
reference: Luke 6:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν ⸀αὐτοῖς· Κύριός ἐστιν ⸂τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/005.yaml
  text: And he was saying to them[a], “The Son of Man is Lord of the Sabbath.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Ang Anak ng Tao ay Panginoon ng Sabbath.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pagkakaugnay ng salaysay nang hindi nagdaragdag ng tiyak na temporal na diwa.
- source_word: ἔλεγεν
  choice: sinabi
  rationale: Bagaman nasa imperfect ang pandiwa, dito ay likas itong nagsisilbing pambungad sa isang tuwirang pahayag. Ang “sinabi” ang pinakanatural sa makabagong Tagalog; ang “patuloy na sinasabi” ay maaaring magpahiwatig ng pag-uulit na hindi tiyak sa konteksto.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwirang isinasalin ang panghalip na datibong maramihan nang hindi tinutukoy nang higit sa ipinahihiwatig ng teksto kung sino sila.
- source_word: Κύριος
  choice: Panginoon
  rationale: Ipinahahayag dito ang awtoridad ng Anak ng Tao, kaya ang kinikilalang titulong “Panginoon” ang angkop kaysa sa mas mahinang “amo” o “pinuno.”
- source_word: τοῦ σαββάτου
  choice: ng Sabbath
  rationale: Pinananatili ang maikli at tuwirang ugnayang henitibo ng Griyego. Ang “Sabbath” ay kinikilalang tawag sa banal na araw at institusyon, samantalang maaaring paliitin ng “araw ng pamamahinga” ang saklaw sa literal na pagpapahinga lamang.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Ito ang nakagawiang salin ng natatanging titulong ginagamit ni Jesus para sa sarili, at pinananatili nito ang Semitikong anyo at posibleng kaugnayan sa Daniel 7.
theological_decisions:
- issue: Ang lakas ng pahayag tungkol sa awtoridad ng Anak ng Tao sa Sabbath
  choice: “Ang Anak ng Tao ay Panginoon ng Sabbath.”
  alternative: “Ang Anak ng Tao ay may kapangyarihan sa Sabbath.”
  rationale: Pinananatili ng “Panginoon” ang tuwirang kristolohikal na titulo at matibay na pahayag ng Griyego. Nililinaw ng alternatibo ang kahulugan ngunit pinapalitan nito ang titulo ng isang paliwanag at sa gayon ay nababawasan ang pormal at teolohikal na bigat ng κύριος.
translation_notes:
  register: Makabago, maikli, at marangal na Tagalog. Pinanatili ang mga kinikilalang titulong “Anak ng Tao” at “Panginoon,” gayundin ang terminong “Sabbath,” upang maging malinaw ang kaugnayan sa biblikal na institusyon nang hindi nagdaragdag ng paliwanag sa mismong talata.
