  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ Ἰησοῦς πρὸς αὐτούς· ⸀Ἐπερωτῶ ὑμᾶς, ⸀εἰ ἔξεστιν ⸂τῷ σαββάτῳ⸃ ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ⸀ἀπολέσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/009.yaml
  text: But Jesus said to them[a], “I ask you, is it lawful on the Sabbath to do good or to do harm[b], to save a life or to destroy it?”
translation:
  language: tl
  text: 'Ngunit sinabi ni Jesus sa kanila, “Tinatanong ko kayo: Sa Sabbath, ipinahihintulot bang gumawa ng mabuti o gumawa ng masama,[a] magligtas ng buhay[b] o puksain ito?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gumawa ng pinsala” o “manakit.” Inihaharap ng Griyego ang pagsalungat ng paggawa ng mabuti at paggawa ng masama o nakapipinsala.
    reason: lexical_alternative
  - marker: b
    text: O “kaluluwa” o “isang tao.” Dito, ang “buhay” ay angkop sa konteksto ng pagliligtas o pagpuksa sa buhay ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang banayad na pagsalungat at paglipat sa tugon ni Jesus sa mga nagmamasid sa kanya.
- source_word: Ἐπερωτῶ ὑμᾶς
  choice: Tinatanong ko kayo
  rationale: Likas at tuwirang Filipino na nagpapanatili sa hamon ng tanong ni Jesus.
- source_word: εἰ ἔξεστιν
  choice: Ipinahihintulot ba
  rationale: Pinananatili ang usapin kung ano ang pinahihintulutan ng Kautusan o kinikilalang kaugalian, nang hindi nagdaragdag ng paliwanag sa mismong teksto.
- source_word: τῷ σαββάτῳ
  choice: sa Sabbath
  rationale: Maikli at natural na pagtukoy sa tiyak na banal na araw na pinagtatalunan sa konteksto.
- source_word: ἀγαθοποιῆσαι
  choice: ang gumawa ng mabuti
  rationale: Tuwirang salin na nagpapanatili sa malinaw na etikal na pagsalungat sa κακοποιῆσαι.
- source_word: κακοποιῆσαι
  choice: ang gumawa ng masama
  rationale: Pinananatili ang malawak na etikal na kahulugan ng salitang Griyego; ang mas kongkretong diwang paggawa ng pinsala ay inilagay sa talababa.
- source_word: ψυχὴν
  choice: buhay
  rationale: Sa konteksto ng pagpapagaling at ng pares na iligtas/puksain, tumutukoy ito sa buhay ng tao, hindi kinakailangang sa hiwalay na di-materyal na kaluluwa.
- source_word: σῶσαι
  choice: magligtas
  rationale: Pinananatili ang karaniwang biblikal na saklaw ng pandiwa at ang agarang diwa ng pag-iingat sa buhay.
- source_word: ἀπολέσαι
  choice: puksain ito
  rationale: Nagpapahayag ng matinding kabaligtaran ng pagliligtas at hindi ito nililimitahan sa mas makitid na saling “patayin.”
theological_decisions:
- issue: Kahulugan ng ψυχή sa pariralang ψυχὴν σῶσαι ἢ ἀπολέσαι
  choice: “magligtas ng buhay ... puksain ito”
  alternative: “magligtas ng kaluluwa ... puksain ito” o “magligtas ng isang tao ... ipahamak siya”
  rationale: Ang agarang konteksto ay ang pagpapagaling sa Sabbath at ang pag-iingat o kapahamakan ng buhay ng tao. Hindi ginagawang tahasang aral tungkol sa pagkakabuo ng tao ang talatang hindi naman tahasang nagsasaad nito.
- issue: Etikal na saklaw ng κακοποιῆσαι
  choice: “gumawa ng masama”
  alternative: “gumawa ng pinsala” o “manakit”
  rationale: Pinananatili ng pangunahing salin ang malawak na etikal na pagsalungat sa paggawa ng mabuti, habang kinikilala sa talababa ang kongkretong diwa ng pananakit sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sabbath” bilang pamilyar na terminong biblikal; pinanatiling tuwiran at matalim ang magkatambal na pagsalungat sa tanong ni Jesus.
