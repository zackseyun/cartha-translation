id: LUK.6.46
reference: Luke 6:46
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τί δέ με καλεῖτε· Κύριε κύριε, καὶ οὐ ποιεῖτε ἃ λέγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/046.yaml
  text: Why do you call me[a], ‘Lord, Lord,’ and not do what I say?
translation:
  language: tl
  text: Bakit ninyo ako tinatawag na “Panginoon, Panginoon”[a], ngunit hindi ninyo ginagawa ang sinasabi ko?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Guro, Guro” o “Amo, Amo.” Sa Griyego: Kyrios, kyrios.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: Bakit
  rationale: Bagaman karaniwang nangangahulugang “ano” ang τί, adberbiyal ang gamit nito rito at nagtatanong ng dahilan; likas na katumbas sa Tagalog ang “Bakit.”
- source_word: δέ
  choice: —
  rationale: Mahinang pang-ugnay ang δέ. Hindi na ito tahasang isinalin sapagkat malinaw at natural ang tanong sa Tagalog ayon sa daloy ng konteksto.
- source_word: με
  choice: ako
  rationale: Tuwirang layon ito ng καλεῖτε; “ako” ang natural na anyo sa konstruksiyong “tinatawag ninyo ako.”
- source_word: καλεῖτε
  choice: tinatawag
  rationale: Pinananatili ng “tinatawag” ang pangkasalukuyang diwa at ang direktang paraan ng pagtawag kay Jesus sa isang titulo.
- source_word: Κύριε κύριε
  choice: Panginoon, Panginoon
  rationale: Pinananatili ang karaniwang salin ng κύριος na “Panginoon” at ang pag-uulit nito, na nagbibigay-diin sa kaibahan ng sinasambit na pagkilala at ng hindi pagsunod.
- source_word: καὶ οὐ
  choice: ngunit hindi
  rationale: Bagaman koordinatibo ang καί, malinaw na pasalungat ang ugnayan dito; natural na ipinahahayag iyon sa Tagalog ng “ngunit hindi.”
- source_word: ποιεῖτε
  choice: ginagawa
  rationale: Tumutukoy ito sa pagsasagawa o pagsunod sa sinasabi ni Jesus; simple at tuwiran ang “ginagawa.”
- source_word: ἃ
  choice: ang
  rationale: Ang neuter plural relative pronoun ay likas na naipapahayag sa pariralang Tagalog na “ang sinasabi ko,” nang hindi gumagamit ng mabigat na “mga bagay na.”
- source_word: λέγω
  choice: sinasabi ko
  rationale: Direktang isinasalin ang λέγω bilang “sinasabi ko,” nang hindi idinaragdag ang di-tahasang layon na “sa inyo.”
theological_decisions:
- issue: Pagkakasalin sa κύριος bilang titulong tumutukoy kay Jesus
  choice: Panginoon
  alternative: Guro / Amo
  rationale: Ang “Panginoon” ay nagpapanatili sa karaniwang biblikal at kristolohikal na bigat ng κύριος, samantalang posible rin sa konteksto ang diwang “Guro” o “Amo.” Hindi nilulutas ng salin ang buong saklaw ng titulo, kaya itinala ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” para sa ikalawang panauhang maramihan at ang “ngunit” upang likas na maipakita ang mariing pagsalungat sa pagitan ng pagtawag kay Jesus na Panginoon at ng hindi paggawa sa sinasabi niya.
