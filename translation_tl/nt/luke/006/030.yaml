  source_fidelity: Tumpak ang unang sugnay. Sa ikalawang sugnay, ang «pag-aari mo» ay katanggap-tanggap na pangkalahatang katumbas ng τὰ σά, ngunit mas malinaw at mas malapit sa pangmaramihang anyo ng Griyego ang «mga bagay na sa iyo». Ang pagdaragdag ng «niya» ay ligtas na paglilinaw na ang taong kumukuha ang inaasahang magsasauli, nang hindi nagdaragdag ng legal na pagpapakahulugan.
  naturalness: Natural ang pangunahing tono ng draft, ngunit ang «huwag mong igiit na ibalik iyon» ay maaaring hindi gaanong malinaw kung sino ang magbabalik. Ang binagong ayos ay natural na modernong Tagalog at pinananatili ang retorikal na pagtutok sa «sinumang kumukuha».
  terminology: Ang «ipilit na isauli» ay naghahayag ng puwersa ng ἀπαιτέω bilang paghingi o pag-angking maibalik ang kinuha, nang hindi ito ginagawang tiyak na terminong legal. Pinananatili ang malawak na «mga bagay na sa iyo» para sa τὰ σά.
