  text: Give to everyone who asks you[a], and from the one who takes what is yours, do not demand it back.
translation:
  language: tl
  text: Magbigay ka sa bawat humihingi sa iyo, at sa sinumang kumukuha ng mga bagay na sa iyo, huwag mong ipilit na isauli niya ang mga iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “huwag mong hinging isauli niya ang mga iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παντὶ
  choice: sa bawat
  rationale: Ginagamit nang distributibo kasama ng participle; pinananatili ng “sa bawat” ang malawak na saklaw ng utos at likas itong kaugnay ng “humihingi.”
- source_word: αἰτοῦντί σε
  choice: humihingi sa iyo
  rationale: Tuwirang katumbas at natural sa modernong Tagalog; hindi nito ipinapalagay na namamalimos ang tao, sapagkat hindi iyon tahasang sinasabi ng pandiwa.
- source_word: δίδου
  choice: Magbigay ka
  rationale: Malinaw na pautos na anyo. Ang payak na pautos sa Tagalog ay natural na makapaghahayag ng pangkalahatan o patuloy na asal nang hindi labis na minamarkahan ang aspektong pangkasalukuyan ng Griyego.
- source_word: ἀπὸ τοῦ αἴροντος
  choice: sa sinumang kumukuha
  rationale: Ipinapahayag ang substantival participle nang malawak at hindi agad itinatakda bilang pagnanakaw o isang tiyak na usaping legal.
- source_word: τὰ σὰ
  choice: ng pag-aari mo
  rationale: Natural na Tagalog para sa “mga bagay na sa iyo.” Sapat itong malawak upang tumukoy sa anumang pag-aari nang hindi nililimitahan sa isang partikular na uri ng ari-arian.
- source_word: μὴ ἀπαίτει
  choice: huwag mong igiit na ibalik iyon
  rationale: Ipinakikita ng “igiit” ang mas malakas na diwa ng ἀπαιτέω kaysa sa karaniwang paghiling lamang, habang ang “ibalik” ay naghahayag na binabawi ang kinuha.
theological_decisions:
- issue: Saklaw at lakas ng mga etikang utos ni Jesus sa kasabihang ito
  choice: Isinalin bilang tuwiran at malalawak na utos nang hindi pinahihina o nililimitahan ang aplikasyon.
  alternative: Ituring sa salin bilang eksaherasyon, ilimita sa paglilimos, o iukol lamang sa legal na pagsasauli dahil sa pagnanakaw.
  rationale: Tuwirang mga pautos at malawak na pananalita ang nasa Griyego. Dapat panatilihin ng salin ang tensiyong etikal sa halip na lutasin sa mismong teksto ang pinagtatalunang aplikasyon nito.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang isahang “ka/mo/iyo” upang tumbasan ang mga anyong singular sa Griyego. Iniwasan ang legalistikong bokabularyo at ang pagpapakahulugang hindi tahasang nasa teksto.
