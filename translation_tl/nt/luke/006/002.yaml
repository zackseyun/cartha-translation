  terminology: Ang “mga Pariseo” at “Sabbath” ay angkop at matatag na mga terminong biblikal sa modernong Filipino Tagalog. Nananatiling hindi mapagpasiya ang “hindi pinahihintulutang gawin,” gaya ng ἔξεστιν.
