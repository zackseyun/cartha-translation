  source_fidelity: Tumpak ang pagtukoy sa ilan lamang sa mga Pariseo, ang mapanghamong tanong, at ang maingat na “hindi ipinahihintulot,” na hindi nagpapalagay kung Kautusan ba o interpretasyong pangrelihiyon ang tinutukoy. Gayunman, ang “kapag Sabbath” ay karaniwang nangangahulugang ‘whenever it is Sabbath’ at hindi ang tuwirang panahong ‘on the Sabbath(s).’
