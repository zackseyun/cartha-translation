  text: τινὲς δὲ τῶν Φαρισαίων ⸀εἶπαν· Τί ποιεῖτε ὃ οὐκ ⸀ἔξεστιν τοῖς σάββασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/002.yaml
  text: But some of the Pharisees said[a], “Why are you doing what is not lawful on the Sabbaths?”
translation:
  language: tl
  text: Ngunit sinabi ng ilan sa mga Pariseo, “Bakit ninyo ginagawa ang hindi pinahihintulutang gawin sa araw ng Sabbath[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “sa mga Sabbath,” isang karaniwang idyoma na tumutukoy sa araw ng Sabbath.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς
  choice: ilan
  rationale: Tumutukoy ito sa isang bahagi lamang ng mga Pariseo, hindi sa buong pangkat.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapakita ito ng banayad na pagsalungat sa naunang salaysay at naghahatid sa pagtutol ng mga Pariseo.
- source_word: Φαρισαίων
  choice: mga Pariseo
  rationale: Ito ang karaniwang makabagong anyong Tagalog ng pangalan ng pangkat na Judio.
- source_word: εἶπαν
  choice: sinabi
  rationale: Inilalahad ng aorist ang pagsasalita bilang isang pangyayaring naganap; natural sa Tagalog ang payak na “sinabi.”
- source_word: Τί ποιεῖτε
  choice: Bakit ninyo ginagawa
  rationale: Bagaman maaaring literal na “Ano ang ginagawa ninyo,” ang tanong dito ay isang pagtutol at likas na ipinahahayag sa Tagalog bilang “Bakit ninyo ginagawa…?”
- source_word: ὃ οὐκ ἔξεστιν
  choice: ang hindi ipinahihintulot
  rationale: Pinananatili nito ang diwa ng isang gawaing itinuturing na hindi pinahihintulutan sa loob ng usaping panrelihiyon at legal, nang hindi tahasang nagpapasiya kung aling batas o tradisyon ang pinagbabatayan.
- source_word: τοῖς σάββασιν
  choice: kapag Sabbath
  rationale: Ang pangmaramihang Griyego ay karaniwang idyoma para sa araw o pagkakataon ng Sabbath. Ang “kapag Sabbath” ay natural sa modernong Tagalog at maaaring tumukoy sa ginagawa sa araw ng Sabbath nang magdagdag ng di-likas na pangmaramihang anyo.
theological_decisions:
- issue: Paglalarawan sa pagbabawal
  choice: hindi ipinahihintulot
  alternative: labag sa Kautusan
  rationale: Ang ἔξεστιν ay nagsasaad ng pagiging pinahihintulutan o naaayon sa batas, ngunit hindi nito tahasang sinasabing ang tinutukoy ay mismong nakasulat na Kautusan sa halip na isang interpretasyon o kaugalian. Iniiwasan ng salin ang paglutas sa tensiyong iyon.
- issue: Pangmaramihang anyo ng Sabbath
  choice: kapag Sabbath
  alternative: sa mga Sabbath
  rationale: Pangmaramihan ang anyong Griyego, ngunit isa itong karaniwang idyoma para sa Sabbath. Ang natural na Tagalog ay nasa pangunahing teksto, habang itinatala sa talababa ang literal na anyo upang mapanatili ang transparency sa pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Pariseo” at “Sabbath” bilang mga karaniwang terminong biblikal. Ang ayos ng pangungusap ay natural sa Filipino habang pinananatili ang mapanghamong tono ng tanong.
