id: LUK.6.48
reference: Luke 6:48
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομοῦντι οἰκίαν ὃς ἔσκαψεν καὶ ἐβάθυνεν καὶ ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν· πλημμύρης δὲ γενομένης προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν ⸂διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/048.yaml
  text: He is like a man building a house[a], who dug deep and laid a foundation on the rock. And when a flood came, the river burst against that house and was not able to shake it, because it had been well built.
translation:
  language: tl
  text: Siya ay tulad ng isang lalaki[a] na nagtatayo ng bahay, na humukay nang malalim at naglagay ng pundasyon sa ibabaw ng bato. Nang dumating ang baha, humampas ang ilog sa bahay na iyon, ngunit hindi nito nagawang yanigin ang bahay na iyon, sapagkat mahusay itong naitayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang tao.” Panlalaking isahan ang anyo sa Griyego para sa tauhang ginagamit sa paghahambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιός ἐστιν
  choice: Siya ay tulad ng
  rationale: Likas at tuwirang pormula ng paghahambing sa modernong Tagalog.
- source_word: ἀνθρώπῳ
  choice: isang lalaki
  rationale: Pinananatili ang panlalaking isahang tauhan ng paghahambing sa Griyego, habang malinaw sa konteksto na kinakatawan niya ang sinumang tumutupad sa sinabi ni Jesus.
- source_word: οἰκοδομοῦντι οἰκίαν
  choice: nagtatayo ng bahay
  rationale: Karaniwan, malinaw, at tumpak na pananalita para sa patuloy na gawain ng pagtatayo.
- source_word: ἔσκαψεν καὶ ἐβάθυνεν
  choice: Humukay ito nang malalim
  rationale: Ipinahahayag ang pinagsamang diin ng dalawang pandiwa—ang paghukay at pagpapalalim—sa natural na Tagalog.
- source_word: ἔθηκεν θεμέλιον
  choice: naglagay ng pundasyon
  rationale: Karaniwang kataga sa pagtatayo at tapat sa kilos ng paglalagay ng θεμέλιον.
- source_word: ἐπὶ τὴν πέτραν
  choice: sa bato
  rationale: Pinananatili ang payak na larawan ng πέτρα nang hindi ito nililimitahan sa mas interpretibong “batong-buhay.”
- source_word: πλημμύρης δὲ γενομένης
  choice: Nang bumaha
  rationale: Maikli at natural na pagsasalin ng pansamantalang kalagayang ipinahihiwatig ng genitive absolute.
- source_word: προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ
  choice: humampas ang ilog sa bahay na iyon
  rationale: Ipinakikita ng “humampas” ang marahas na pagsalpok ng rumaragasang tubig nang hindi nagdaragdag ng kilos na wala sa teksto.
- source_word: οὐκ ἴσχυσεν σαλεῦσαι αὐτήν
  choice: hindi nito kayang yanigin ang bahay
  rationale: Pinananatili ang kawalan ng kakayahan at ang ideya ng pagyanig o pagpapabuway; inuulit ang “bahay” upang maiwasan ang malabong pagtukoy ng mga panghalip.
- source_word: διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν
  choice: sapagkat mahusay ang pagkakatayo nito
  rationale: Pinananatili ang sanhi at ang pasibong diwa ng mahusay na pagkakatayo ng bahay.
theological_decisions:
- issue: Kasarian ng ἀνθρώπῳ sa kumakatawang paghahambing
  choice: isang lalaki
  alternative: isang tao
  rationale: Ang isahang tauhan sa Griyego ay panlalaki. Pinananatili ito sa pangunahing teksto, samantalang nililinaw sa talababa na maaari rin itong isalin ayon sa pangkalahatang kahulugang “isang tao.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang payak na bokabularyo sa pagtatayo at pagbaha; iniwasan ang sobrang teknikal na “batong-buhay” at ang di-likas na literal na pag-uulit ng dalawang pandiwa sa paghukay. Ang marker na [a] ay inilagay agad pagkatapos ng “lalaking.”
