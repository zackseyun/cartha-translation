  text: 'Ngunit sinasabi ko sa inyo na nakikinig[a]: mahalin ninyo ang inyong mga kaaway; gumawa kayo ng mabuti sa mga napopoot sa inyo,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na nakaririnig.” Maaaring isalin nang mas pormal sa ganitong paraan ang Griyegong participle; itinatampok ng “nakikinig” ang aktibong pakikinig sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Ngunit
  rationale: Malinaw at likas na naghahayag ng mariing pagsalungat sa naunang pahayag.
- source_word: ὑμῖν λέγω
  choice: sinasabi ko sa inyo
  rationale: Pinananatili ang tuwirang pakikipag-usap at ang ayos ng pahayag sa paraang natural sa modernong Tagalog.
- source_word: τοῖς ἀκούουσιν
  choice: sa inyong nakikinig
  rationale: Ipinahihiwatig ng kasalukuyang participle ang aktibong pakikinig; mas angkop dito ang “nakikinig” kaysa sa simpleng pisikal na pagkarinig.
- source_word: ἀγαπᾶτε
  choice: Mahalin ninyo
  rationale: Tuwiran, natural, at malinaw na pautos na katumbas ng pandiwang ἀγαπάω.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: ang inyong mga kaaway
  rationale: Tuwirang pinananatili ang layon at ang panghalip na paari.
- source_word: καλῶς ποιεῖτε
  choice: gawan ninyo ng mabuti
  rationale: Likas na idyomang Tagalog para sa paggawa ng kabutihan sa isang tao, habang pinananatili ang pautos.
- source_word: τοῖς μισοῦσιν ὑμᾶς
  choice: ang mga napopoot sa inyo
  rationale: Pinananatili ang matinding kahulugan ng μισέω nang hindi ito pinalalambot.
theological_decisions:
- issue: Mga etikong utos tungkol sa mga kalaban
  choice: Isinalin ang dalawang utos bilang tuwiran at walang ipinahayag na hangganan.
  alternative: Limitahan ang “mga kaaway” sa mga personal na kaaway lamang o ituring ang mga utos na eksaherasyong retorikal.
  rationale: Walang gayong limitasyon sa Griyegong teksto; dapat manatili sa salin ang radikal na puwersa at interpretatibong tensiyon ng mga utos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “mahalin” bilang mas natural sa kasalukuyang wika kaysa “ibigin,” at “napopoot” upang mapanatili ang lakas ng orihinal nang hindi nagiging kolokyal.
