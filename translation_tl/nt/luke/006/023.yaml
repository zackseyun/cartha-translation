base_translation:
  language: en
  yaml_path: translation/nt/luke/006/023.yaml
  text: Rejoice in that day and leap for joy[a], for behold, your reward is great in heaven[b]; for in the same way their fathers used to do to the prophets.
translation:
  language: tl
  text: Magalak kayo sa araw na iyon at lumukso sa tuwa[a], sapagkat, narito, malaki ang gantimpala ninyo sa langit. Sapagkat ganoon din ang ginagawa noon ng kanilang mga ninuno sa mga propeta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “at lumukso.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “sapagkat sa gayunding paraan ay ginagawa ng kanilang mga ninuno sa mga propeta.” Ipinahihiwatig ng konteksto na gayunding pagtrato ang ginagawa nila sa mga propeta.'
    reason: translation_clarity
lexical_decisions:
- source_word: χάρητε
  choice: Magalak kayo
  rationale: Ang aorist imperative na maramihan ay isang tuwirang utos na magalak; natural at marangal sa modernong Filipino ang “Magalak kayo.”
- source_word: σκιρτήσατε
  choice: lumukso sa tuwa
  rationale: Tumutukoy ang pandiwa sa masiglang pagkilos ng katawan. Nililinaw ng “sa tuwa” ang masayang diwa ng paglukso na ipinahihiwatig ng konteksto.
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili ng “narito” ang pantawag-pansing puwersa ng ἰδού nang hindi ito ginagawang paliwanag lamang.
- source_word: μισθὸς
  choice: gantimpala
  rationale: Sa kontekstong ito, positibong kabayaran o gantimpala ang tinutukoy, hindi karaniwang sahod.
- source_word: πολὺς
  choice: malaki
  rationale: Ang “malaki” ay natural na panuring sa “gantimpala” at tapat sa diin ng predicate adjective.
- source_word: ἐν τῷ οὐρανῷ
  choice: sa langit
  rationale: Tuwirang pinananatili ang lokasyon o saklaw na tinutukoy ng teksto nang hindi dinaragdagan ng paliwanag na teolohikal.
- source_word: κατὰ τὰ αὐτά
  choice: Gayon din
  rationale: Likas na katumbas sa Filipino ng idyomang nangangahulugang “sa gayunding paraan.”
- source_word: ἐποίουν
  choice: ang ginawa
  rationale: Pinananatili ang pangkalahatan at bahagyang di-tiyak na “ginawa” ng Griyego; hindi tahasang tinutukoy sa talata ang uri ng pagtrato.
- source_word: τοῖς προφήταις
  choice: sa mga propeta
  rationale: Pinananatili ang dative relation sa natural na Filipino at hinahayaang ipahiwatig ng konteksto ang masamang pagtrato.
- source_word: οἱ πατέρες αὐτῶν
  choice: kanilang mga ninuno
  rationale: Sa konteksto, ang πατέρες ay tumutukoy sa mga naunang salinlahi. Mas malinaw sa ordinaryong modernong Filipino ang “mga ninuno” kaysa literal na “mga ama.”
theological_decisions:
- issue: Kalikasan at kinaroroonan ng ipinangakong gantimpala
  choice: malaki ang gantimpala ninyo sa langit
  alternative: malaki ang gantimpala ninyo sa piling ng Diyos sa langit
  rationale: Sinasabi lamang ng teksto na ang gantimpala ay “sa langit.” Hindi idinagdag ang “sa piling ng Diyos,” upang mapanatili ang eksaktong pahayag at eskatolohikal na tensiyon.
- issue: Pagkakakilanlan ng οἱ πατέρες αὐτῶν
  choice: kanilang mga ninuno
  alternative: kanilang mga ama
  rationale: Malamang na tinutukoy ang mga naunang salinlahi ng mga umuusig. Inihahatid ng “mga ninuno” ang historikal at salinlahing diwa nang hindi nagmumungkahi na mga agarang ama lamang ang tinutukoy.
- issue: Uri ng ginawa sa mga propeta
  choice: Gayon din ang ginawa ... sa mga propeta
  alternative: Gayon din ang masamang pagtrato ... sa mga propeta
  rationale: Bagaman malinaw sa konteksto na pag-uusig ang tinutukoy, hindi ito tahasang pinangalanan sa sugnay. Pinananatili ng salin ang pagkasiksik at tunay na kalabuan ng Griyego.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “magalak,” “narito,” at “gantimpala” upang mapanatili ang bahagyang mataas na rehistrong angkop sa kasulatan, samantalang iniwasan ang lipas o labis na literal na pananalita. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
