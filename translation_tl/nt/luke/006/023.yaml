  naturalness: Natural ang pangunahing rehistro, kabilang ang “Magalak kayo,” “lumukso sa tuwa,” at “malaki ang gantimpala ninyo sa langit.” Mas malinaw at natural ang “ganoon din ang ginagawa noon ...” kaysa “Gayon din ang ginawa ...” sa huling sugnay.
  terminology: Ang “mga ninuno” ay angkop na modernong Filipino para sa οἱ πατέρες αὐτῶν sa historikal na diwa. Ang “sa mga propeta” ay nagpapanatili ng sadyang di-tiyak na pagkakalahad ng ποιέω nang hindi ipinapasok ang “pag-uusig” o ibang interpretibong paglalarawan.
