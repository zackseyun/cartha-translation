id: LUK.6.39
reference: Luke 6:39
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ παραβολὴν αὐτοῖς· Μήτι δύναται τυφλὸς τυφλὸν ὁδηγεῖν; οὐχὶ ἀμφότεροι εἰς βόθυνον ⸀ἐμπεσοῦνται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/039.yaml
  text: 'And he also told them a parable: “Can a blind man guide a blind man? Will not both fall into a pit?”[a][b]'
translation:
  language: tl
  text: 'Sinabi rin niya sa kanila ang isang talinghaga: “Maaari bang gumabay ang isang bulag sa kapwa bulag? Hindi ba’t kapwa sila mahuhulog sa hukay?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kanal” sa halip na “hukay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: rin
  rationale: Ipinahahayag ang pandagdag na diwa ng καὶ kasunod ng δὲ, nang natural sa Filipino.
- source_word: παραβολὴν
  choice: talinghaga
  rationale: Karaniwang katawagan sa Filipino para sa isang makalarawang paghahambing o kasabihang nagtuturo.
- source_word: Μήτι δύναται
  choice: Maaari bang
  rationale: Pinananatili ang tanong na retorikal na umaasang ang sagot ay hindi, nang hindi ito ginagawang tahasang pahayag.
- source_word: τυφλὸς ... τυφλὸν
  choice: isang bulag ... kapwa bulag
  rationale: Ang “bulag” ay likas na walang tinutukoy na kasarian sa Filipino, kaya naipahahayag nito ang pangkalahatang bisa ng pananalita habang nananatiling malapit sa dalawang pang-isahang anyo sa Griyego.
- source_word: ὁδηγεῖν
  choice: gumabay
  rationale: Ang “gumabay” ay natural na tumutukoy sa pag-akay o pagtuturo ng daan at angkop sa larawang ginagamit ng talinghaga.
- source_word: οὐχὶ
  choice: Hindi ba’t
  rationale: Ipinahahayag ang tanong na retorikal na umaasang sasang-ayon ang nakikinig.
- source_word: ἀμφότεροι
  choice: kapwa sila
  rationale: Malinaw at likas na ipinahahayag na ang dalawang tinutukoy ay parehong mahuhulog.
- source_word: βόθυνον
  choice: hukay
  rationale: Saklaw ng salita ang isang hukay o kanal; ang “hukay” ang mas malawak at matingkad na katumbas sa konteksto.
- source_word: ἐμπεσοῦνται
  choice: mahuhulog
  rationale: Pinananatili ang panghinaharap na diwa at likas na ipinahahayag sa Filipino ang pagkahulog sa loob ng hukay.
theological_decisions:
- issue: Pangkalahatang gamit ng panlalaking pang-isahang τυφλός
  choice: isang bulag ... kapwa bulag
  alternative: isang lalaking bulag ... isa pang lalaking bulag
  rationale: Panlalaki ang anyong pambalarila sa Griyego ngunit kinatawan nito ang sinumang bulag sa kasabihan. Dahil hindi minamarkahan ng “bulag” ang kasarian sa Filipino, napananatili ang pangkalahatang diwa nang hindi nagdaragdag o nag-aalis ng kasariang tahasang kinakailangan ng target na wika.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “talinghaga” bilang pamilyar na katawagang biblikal, at pinanatili ang magkasalungat na puwersa ng dalawang tanong na retorikal.
