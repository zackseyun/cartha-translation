base_translation:
  language: en
  yaml_path: translation/nt/luke/006/028.yaml
  text: Bless those who curse you[a]; pray for those who mistreat you.
translation:
  language: tl
  text: Pagpalain ninyo ang mga sumusumpa sa inyo; ipanalangin ninyo ang mga nagmamalupit sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga umaabuso sa inyo” o “mga nang-iinsulto sa inyo.” Saklaw ng pandiwang Griyego ang iba’t ibang uri ng mapanirang pagtrato.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Pagpalain ninyo
  rationale: Likas at marangal na katumbas ng pautos na εὐλογεῖτε; pinananatili nito ang matinding pagsalungat sa kilos ng mga sumusumpa.
- source_word: τοὺς καταρωμένους ὑμᾶς
  choice: ang mga sumusumpa sa inyo
  rationale: Ang artikulo at participle ay tumutukoy sa mga taong gumagawa ng kilos. Ang “sumusumpa sa inyo” ay malinaw na nagpapahayag ng mapaminsalang pananalita o paghiling ng masama laban sa kanila.
- source_word: προσεύχεσθε
  choice: ipanalangin ninyo
  rationale: Sa Filipino, ang “ipanalangin” ay natural na pautos kapag ang ipinagdarasal ay isang tao; hindi kailangang piliting ipahayag ang aspektong nagpapatuloy ng pangkasalukuyang anyo.
- source_word: περὶ τῶν ἐπηρεαζόντων ὑμᾶς
  choice: ang mga gumagawa ng masama sa inyo
  rationale: Sa kaugnayan ng προσεύχομαι, ang περί ay nagpapakilala sa mga taong ipinapanalangin. Malawak ang ἐπηρεάζω at maaaring tumukoy sa mapang-abuso, mapanlait, o iba pang masamang pagtrato; ang piniling parirala ay natural at hindi ito nililimitahan sa panlalait lamang.
theological_decisions:
- issue: Saklaw ng mga utos tungkol sa pag-ibig sa kaaway
  choice: Tuwirang ilahad ang dalawang utos bilang tugon sa mga gumagawa ng masama, nang walang idinagdag na paliwanag na doktrinal.
  alternative: Dagdagan ng paliwanag tungkol sa hangganan o layunin ng pagpapala at pananalangin.
  rationale: Tuwiran at mariin ang mga utos sa Griyego. Dapat mapanatili ng salin ang etikal at teolohikal na tensiyon ng pagpapala at pananalangin para sa mga taong mapan hostile nang hindi nilulutas o nililimitahan ito.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pagbasa sa publiko. Ginamit ang magkatimbang na pautos na “Pagpalain ninyo” at “ipanalangin ninyo.”
