  text: οὐαὶ ὑμῖν, οἱ ἐμπεπλησμένοι ⸀νῦν, ὅτι πεινάσετε. ⸀οὐαί, οἱ γελῶντες νῦν, ὅτι πενθήσετε καὶ κλαύσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/025.yaml
  text: Woe to you who are full now[a], because you will be hungry. Woe to you who are laughing now[b], because you will mourn and weep.
translation:
  language: tl
  text: Sa aba ninyo, kayong mga busog ngayon, sapagkat magugutom kayo. Sa aba ninyo, kayong mga tumatawa ngayon, sapagkat magdadalamhati kayo at iiyak kayo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: Sa aba ninyo
  rationale: Pinananatili nito ang bigat ng propetikong babala at hatol, sa halip na gawing pagpapahayag lamang ng awa gaya ng maaaring ipahiwatig ng “Kawawa kayo.”
- source_word: ἐμπεπλησμένοι
  choice: mga busog
  rationale: Inilalarawan ng perpektong pandiwaring Griyego ang kasalukuyang kalagayang bunga ng pagkabusog; natural at tuwiran itong katapat ng darating na pagkagutom.
- source_word: νῦν
  choice: ngayon
  rationale: Pinananatili ang mahalagang paghahambing ng kasalukuyang kalagayan at ng darating na pagbabaligtad.
- source_word: πεινάσετε
  choice: magugutom kayo
  rationale: Natural na modernong Tagalog para sa hinaharap na pagdanas ng gutom.
- source_word: γελῶντες
  choice: mga tumatawa
  rationale: Pinananatili ang kongkretong larawan ng mga taong tumatawa sa kasalukuyan at hindi ito pinalalawak tungo sa mas pangkalahatang diwa ng pagsasaya.
- source_word: πενθήσετε
  choice: magdadalamhati kayo
  rationale: Ipinahahayag ang mabigat na pagluluksa at pinananatiling bukod sa kasunod na pag-iyak.
- source_word: κλαύσετε
  choice: iiyak
  rationale: Natural at malinaw na Tagalog na nagpapanatili sa pag-igting mula sa pagdadalamhati tungo sa hayagang pag-iyak.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng pahayag ng kapahamakan sa isang marangal ngunit madaling maunawaang rehistro.
theological_decisions:
- issue: Kalikasan ng pahayag na “οὐαί”
  choice: Isang propetikong babala tungkol sa darating na pagbabaligtad at hatol sa mga busog at walang alalahanin ngayon
  alternative: Isa lamang itong panlipunang obserbasyon tungkol sa pabago-bagong kalagayan ng tao
  rationale: Ang inuulit na “οὐαί,” ang mga pandiwang nasa hinaharap, at ang pagkakatapat nito sa mga pagpapala sa konteksto ay nagpapahiwatig ng babala at hindi lamang neutral na obserbasyon. Hindi tinutukoy ng salin ang paraan o eksaktong panahon ng pagbabaligtad dahil hindi iyon tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang nakaugaliang “Sa aba ninyo” upang mapanatili ang lakas ng propetikong babala; iniwasan ang sobrang pormal o makalumang ayos maliban sa ekspresyong ito, na nananatiling malinaw sa kontekstong biblikal.
