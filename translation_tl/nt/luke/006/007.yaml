id: LUK.6.7
reference: Luke 6:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀παρετηροῦντο ⸀δὲ οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι εἰ ἐν τῷ σαββάτῳ ⸀θεραπεύει, ἵνα εὕρωσιν ⸀κατηγορεῖν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/007.yaml
  text: And the scribes and the Pharisees were watching him closely to see whether he would heal on the Sabbath[b][a], so that they might find grounds to accuse him.
translation:
  language: tl
  text: Mahigpit siyang binabantayan[a] ng mga eskriba at mga Pariseo upang makita kung magpapagaling siya sa araw ng Sabbath, nang sa gayon ay makahanap sila ng dahilan upang paratangan siya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Maingat siyang pinagmamasdan.” Ang pandiwang Griyego ay maaaring tumukoy sa masusing pagmamasid, na sa kontekstong ito ay may salungat o mapaghinalang layunin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “upang makahanap sila ng maipaparatang laban sa kanya” o “upang maparatangan nila siya.” Ipinahihiwatig ng pananalitang Griyego ang paghahanap ng batayan para sa paratang.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετηροῦντο
  choice: Mahigpit siyang binabantayan
  rationale: Ipinahahayag ng aspektong imperpekto ang patuloy at masusing pagmamasid. Sa konteksto ng layuning makapagparatang, ang “mahigpit na binabantayan” ay likas sa Filipino at nagpapahiwatig ng mapaghinala at salungat na pagbabantay nang hindi ito pinalalabis. Ang “siya” ay malinaw na tumutukoy kay Jesus mula sa konteksto.
- source_word: γραμματεῖς
  choice: mga eskriba
  rationale: Direktang katawagang matagal nang ginagamit sa salaysay ng mga Ebanghelyo para sa mga taong bihasa sa pagkopya at pagpapaliwanag ng Kautusan; iniiwasan nitong gawing paliwanag lamang ang mismong katawagan sa pangkat.
- source_word: Φαρισαῖοι
  choice: mga Pariseo
  rationale: Karaniwang anyong Filipino ng pantanging pangalan ng pangkat.
- source_word: εἰ
  choice: upang makita kung
  rationale: Likas na ipinapahayag sa Filipino ang di-tuwirang tanong pagkatapos ng pandiwa ng pagmamasid sa pamamagitan ng “upang makita kung.”
- source_word: ἐν τῷ σαββάτῳ
  choice: sa araw ng Sabbath
  rationale: Malinaw at natural na panandang temporal sa Filipino, habang pinananatili ang natatanging pangalang Sabbath at ang anyong isahan ng Griyego.
- source_word: θεραπεύει
  choice: magpapagaling siya
  rationale: Bagaman pangkasalukuyan ang anyong Griyego, nasa di-tuwirang tanong ito sa loob ng salaysay na nasa nakaraan. Ang “magpapagaling” ay natural na nagpapahayag ng kilos na hinihintay nilang gawin ni Jesus.
- source_word: ἵνα εὕρωσιν
  choice: nang sa gayon ay makahanap sila
  rationale: Pinananatili nito ang malinaw na layunin ng sugnay na may ἵνα.
- source_word: κατηγορεῖν αὐτοῦ
  choice: ng dahilan upang paratangan siya
  rationale: Ang pagkakaugnay ng “makahanap” at “paratangan” ay nagpapahiwatig ng paghahanap ng batayan o dahilan para sa paratang. Likas itong pahayag sa Filipino at hindi nagdaragdag ng tiyak na sakdal na wala sa teksto.
theological_decisions:
- issue: Layunin ng pagmamasid ng mga kalaban ni Jesus
  choice: Inilarawan ang kanilang ginagawa bilang mahigpit na pagbabantay na naglalayong humanap ng dahilan upang paratangan siya.
  alternative: Maaaring isalin nang mas neutral bilang “maingat nilang pinagmamasdan” at “upang maparatangan siya.”
  rationale: Ang παρατηρέω, lalo na kasama ng sugnay na nagsasaad ng layuning makapagparatang, ay nagpapakita ng sinadya at salungat na pagsusuri. Pinananatili ng salin ang pahiwatig na iyon ngunit hindi tumutukoy sa anumang paratang na hindi naman tinukoy ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga katawagang “eskriba,” “Pariseo,” at “Sabbath” bilang pamilyar na terminong biblikal, habang ginawang natural sa Filipino ang ayos ng pangungusap at ang di-tuwirang tanong.
