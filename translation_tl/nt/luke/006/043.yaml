base_translation:
  language: en
  yaml_path: translation/nt/luke/006/043.yaml
  text: For there is no good tree producing rotten fruit, nor again a rotten tree producing good fruit.
translation:
  language: tl
  text: Sapagkat walang mabuting puno na namumunga ng bulok[a] na bunga, at wala ring bulok na puno na namumunga ng mabuting bunga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “masamang bunga” at “masamang puno.” Ang salitang Griyego ay maaaring mangahulugang bulok, sira, o masama.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γάρ ἐστιν
  choice: Sapagkat walang
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang konteksto, at likas na ipinahahayag ng “walang” ang negatibong pahayag ng pag-iral.
- source_word: δένδρον
  choice: puno
  rationale: Karaniwang tumutukoy rito sa punong namumunga at malinaw na nagpapanatili sa larawang pang-agrikultura.
- source_word: καλὸν
  choice: mabuti
  rationale: Saklaw ng καλός ang mabuti, maayos, o malusog. Pinananatili ng “mabuti” ang sabay na literal at moral na pahiwatig nang hindi ito labis na binibigyang-kahulugan.
- source_word: ποιοῦν καρπὸν
  choice: namumunga
  rationale: Bagaman literal na ‘gumagawa ng bunga,’ ang “namumunga” ang natural na ekspresyon sa Tagalog para sa punong nagbubunga at mahusay na kumakatawan sa participial na diwa.
- source_word: σαπρόν
  choice: bulok
  rationale: Ang σαπρός ay maaaring mangahulugang bulok, sira, o masama. Ang “bulok” ang pinakamalinaw na nagpapanatili sa kongkretong larawan ng bunga at puno.
- source_word: οὐδὲ πάλιν
  choice: at wala ring
  rationale: Natural nitong ipinapahayag sa Tagalog ang ikalawang negatibong sugnay at ang kabaligtarang pagtutulad na idinudulot ng οὐδέ at πάλιν.
- source_word: καρπὸν καλόν
  choice: mabuting bunga
  rationale: Pinananatili nito ang magkatapat na ayos ng mabuti at bulok sa dalawang sugnay.
theological_decisions:
- issue: Tindi ng moral at pang-agrikulturang talinghaga
  choice: Isinalin ang σαπρός bilang “bulok” sa dalawang gamit nito.
  alternative: “masama” o “sira”
  rationale: Pinananatili ng “bulok” ang kongkretong larawan ng puno at bunga, habang hinahayaang lumitaw mula sa talinghaga ang moral na kahulugan sa halip na tuwirang ipasok iyon sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang natural na pandiwang “namumunga” at pinanatili ang balanseng paghahambing ng dalawang sugnay.
