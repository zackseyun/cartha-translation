revisions:
- from: kung paanong pumasok siya sa bahay ng Diyos at kinuha at kinain ang tinapay na inihahain sa harapan ng Diyos[a], at binigyan din niya ang mga kasama niya—na hindi ipinahihintulot ng Kautusan na kainin ninuman maliban sa mga pari lamang?
  to: kung paanong pumasok siya sa bahay ng Diyos at kinuha at kinain ang tinapay na inilalagay sa harapan ng Diyos[a], at ibinigay niya ito sa mga kasama niya—na hindi pinahihintulutang kainin maliban sa mga pari lamang?
  rationale: Inalis ang di-kinakailangang “din” at ang tahasang “ng Kautusan,” na kapwa lumalampas sa eksaktong pahayag ng Griyego. Nilinaw rin ang bagay na ibinigay (“ito”) at inayos ang paglalarawan ng ἄρτους τῆς προθέσεως upang ipakita ang tinapay na inilalagay sa harapan ng Diyos. Napanatili ang teknikal na legal na diwa at ang pagpapatuloy ng tanong.
