id: LUK.6.4
reference: Luke 6:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ὡς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸀λαβὼν ἔφαγεν καὶ ⸀ἔδωκεν τοῖς μετ’ αὐτοῦ, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ μόνους τοὺς ἱερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/004.yaml
  text: how he entered into the house of God[a], and took and ate the bread of the Presence, and gave some to those with him—which it is not lawful to eat except for the priests alone?
translation:
  language: tl
  text: kung paanong pumasok siya sa bahay ng Diyos at kinuha at kinain ang tinapay na inilalagay sa harapan ng Diyos[a], at ibinigay niya ito sa mga kasama niya—na hindi pinahihintulutang kainin maliban sa mga pari lamang?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “banal na tinapay”; ayon sa tradisyon, “tinapay na handog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: kung paanong
  rationale: Ipinakikilala nito ang salaysay kung paano ginawa ni David ang tinutukoy na kilos, ayon sa di-tuwirang tanong sa konteksto.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: pumasok siya sa bahay ng Diyos
  rationale: Pinananatili ang literal na 'bahay ng Diyos' sa halip na ipakahulugang 'templo,' yamang οἶκος ang ginamit at ito ang umaalingawngaw sa naunang salaysay sa Kasulatan.
- source_word: ἄρτους τῆς προθέσεως
  choice: tinapay na inihahain sa harapan ng Diyos
  rationale: Ipinahahayag ang sagradong tinapay na inilalagay sa harapan ng Diyos; mas malinaw ito sa karaniwang mambabasa kaysa sa tradisyonal ngunit di-gaanong pamilyar na katawagan.
- source_word: λαβὼν ἔφαγεν
  choice: kinuha at kinain
  rationale: Likas na isinasalin sa magkaugnay na pandiwang Filipino ang participle at pangunahing pandiwa, habang pinananatili ang pagkakasunod ng mga kilos.
- source_word: καὶ ἔδωκεν τοῖς μετ’ αὐτοῦ
  choice: at binigyan din niya ang mga kasama niya
  rationale: Ang 'mga kasama niya' ay tuwirang katumbas ng τοῖς μετ’ αὐτοῦ, at ipinakikita ng 'din' ang dagdag na kilos na iniuugnay ng καί.
- source_word: οὐκ ἔξεστιν φαγεῖν
  choice: hindi ipinahihintulot ng Kautusan na kainin
  rationale: Ipinakikita ang legal at panrelihiyong pahintulot na tinutukoy ng ἔξεστιν, hindi lamang isang karaniwang pagbabawal.
- source_word: εἰ μὴ μόνους τοὺς ἱερεῖς
  choice: ninuman maliban sa mga pari lamang
  rationale: Pinananatili ang mariing pagtatangi na ang mga pari lamang ang pinahihintulutang kumain nito.
theological_decisions:
- issue: Legal at sagradong pagbabawal tungkol sa banal na tinapay
  choice: hindi ipinahihintulot ng Kautusan
  alternative: hindi pinahihintulutan
  rationale: Ginagawang malinaw na ang tinutukoy ay paghihigpit ng Kautusan sa pagsamba ng Israel, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong tanong na nagpapatuloy mula sa naunang talata at ang katawagang 'bahay ng Diyos' upang sundan ang Griyego.
