id: LUK.6.3
reference: Luke 6:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς πρὸς αὐτοὺς εἶπεν ὁ Ἰησοῦς· Οὐδὲ τοῦτο ἀνέγνωτε ὃ ἐποίησεν Δαυὶδ ⸀ὁπότε ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ ⸀ὄντες;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/003.yaml
  text: And Jesus answered them, “Have you not even read this, what David did when he was hungry, he and those who were with him?”
translation:
  language: tl
  text: At sumagot si Jesus sa kanila, “Hindi ba ninyo nabasa kahit ito—ang ginawa ni David nang magutom siya at ang mga kasama niya?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: sumagot
  rationale: Ang participle at finite verb ay karaniwang idyomang Koine na likas na naipapahayag sa Filipino sa iisang pandiwang “sumagot,” nang hindi inuulit ang “sumagot at sinabi.”
- source_word: πρὸς αὐτοὺς
  choice: sa kanila
  rationale: Pinananatili nito ang tahasang pinag-uukulan ng sagot ni Jesus at natural sa Filipino.
- source_word: Οὐδὲ τοῦτο ἀνέγνωτε
  choice: Hindi ba ninyo nabasa kahit ito
  rationale: Pinananatili ng “kahit ito” ang diin ng οὐδέ sa retorikal na tanong, sa halip na gawing payak lamang na “Hindi ba ninyo nabasa.”
- source_word: ὃ ἐποίησεν Δαυὶδ
  choice: ang ginawa ni David
  rationale: Natural na sugnay na Filipino na tapat sa kahulugang “what David did.”
- source_word: Δαυὶδ
  choice: David
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga saling Filipino.
- source_word: ὁπότε ἐπείνασεν
  choice: nang magutom
  rationale: Ang “nang” ay malinaw na naghahayag ng panahong tinutukoy, at ang “magutom” ay natural na katumbas ng aorist na ἐπείνασεν sa salaysay.
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ ὄντες
  choice: siya at ang mga kasama niya
  rationale: Pinananatili ang pagbanggit kay David at sa mga taong kasama niya, habang gumagamit ng likas at malinaw na Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na magalang at madaling maunawaan. Ginamit ang “ninyo” para sa maramihang kausap at ang em dash upang malinaw na ipakilala ang nilalaman ng “ito” nang hindi binabago ang retorikal na diin.
