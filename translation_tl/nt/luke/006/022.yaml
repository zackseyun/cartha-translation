id: LUK.6.22
reference: Luke 6:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μακάριοί ἐστε ὅταν μισήσωσιν ὑμᾶς οἱ ἄνθρωποι, καὶ ὅταν ἀφορίσωσιν ὑμᾶς καὶ ὀνειδίσωσιν καὶ ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/022.yaml
  text: Blessed are you when people hate you[a], and when they exclude you and insult you and reject your name as evil because of the Son of Man.
translation:
  language: tl
  text: Pinagpala kayo kapag kinapopootan kayo ng mga tao, at kapag ibinubukod nila kayo, nilalait kayo, at itinatakwil nila ang inyong pangalan bilang masama[a] dahil sa Anak ng Tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “itinatakwil nila ang inyong pangalan bilang masama”; maaaring tumukoy ito sa hayagang pagtuligsa o pagtatakwil sa inyo bilang masasamang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοί
  choice: Pinagpala
  rationale: Pinananatili nito ang pormal at teolohikal na himig ng mga pahayag ng pagpapala; ang “masaya” ay maaaring magpahiwatig lamang ng damdamin.
- source_word: ὅταν
  choice: kapag
  rationale: Likas na ipinapahayag ng “kapag” ang di-tiyak na kalagayang maaaring mangyari sa hinaharap.
- source_word: μισήσωσιν
  choice: kinapopootan
  rationale: Tuwiran nitong ipinahahayag ang matinding pagkapoot o pagkapoot na may pag-uusig.
- source_word: οἱ ἄνθρωποι
  choice: mga tao
  rationale: Pangkalahatan ang tinutukoy, hindi lamang mga lalaki.
- source_word: ἀφορίσωσιν
  choice: ibinubukod
  rationale: Ipinahihiwatig nito ang pag-aalis o hindi pagtanggap sa isang tao sa samahan ng komunidad nang hindi labis na nililimitahan ang uri ng pagbubukod.
- source_word: ὀνειδίσωσιν
  choice: iniinsulto
  rationale: Makabago at madaling maunawaang katumbas ito ng pandiwang tumutukoy sa paghamak o mapanirang pananalita.
- source_word: ἐκβάλωσιν τὸ ὄνομα ὑμῶν
  choice: itinatakwil ... ang inyong pangalan
  rationale: Pinananatili ang konkretong pagbanggit sa “pangalan” at ang diwa ng pampublikong pagtanggi, habang mas natural sa Filipino kaysa sa literal na “itinatapon ang inyong pangalan.”
- source_word: ὡς πονηρὸν
  choice: bilang masama
  rationale: Pinananatili nito ang paghatol na ang kanilang pangalan o pagkakakilanlan ay itinuturing na masama.
- source_word: ἕνεκα
  choice: dahil sa
  rationale: Likas at malinaw na nagpapahayag ng dahilan.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Anak ng Tao
  rationale: Pinananatili ang nakaugaliang titulong ginagamit ni Jesus at ang kaugnayan nito sa ibang bahagi ng Kasulatan.
theological_decisions:
- issue: Ang idyomang ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν
  choice: itinatakwil bilang masama ang inyong pangalan
  alternative: sinisiraan kayo bilang masasama
  rationale: Pinananatili ng napiling salin ang larawan ng “pangalan” at ang posibilidad ng pampublikong pagtatakwil o pagtuligsa, sa halip na paliitin ito sa paninirang-puri lamang.
- issue: Pangkalahatang gamit ng οἱ ἄνθρωποι
  choice: mga tao
  alternative: mga lalaki
  rationale: Pangkalahatang sangkatauhan o lipunan ang tinutukoy, hindi isang kasarian lamang.
- issue: Ang titulong τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Anak ng Tao
  alternative: Taong Anak
  rationale: Ang tradisyonal at malinaw na titulong “Anak ng Tao” ang pinakamahusay na nagpapanatili sa gamit nito sa mga Ebanghelyo at sa posibleng alusyon nito sa Daniel.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Pinagpala” upang mapanatili ang himig ng pagpapala, at inilagay ang pananda ng talababa sa pariralang aktuwal nitong nililinaw.
