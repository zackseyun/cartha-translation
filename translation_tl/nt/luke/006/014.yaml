lexical_decisions:
- source_word: Σίμωνα
  choice: Simon
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa modernong saling Tagalog.
- source_word: ὃν καὶ ὠνόμασεν Πέτρον
  choice: na pinangalanan din niyang Pedro
  rationale: Tumpak na ipinahahayag ng “pinangalanan” ang pagkilos na pagbibigay ng pangalan, habang pinananatili ng “din” ang καί.
- source_word: Πέτρον
  choice: Pedro
  rationale: Ito ang kinikilalang tradisyonal na anyo sa Tagalog ng pangalang Πέτρος.
- source_word: Ἀνδρέαν
  choice: Andres
  rationale: Ito ang natural at nakaugaliang anyo ng pangalan sa Tagalog.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: na kapatid niya
  rationale: Natural na Tagalog ito para sa literal na lalaking kapatid ni Simon; hindi na kailangang ulitin ang pangalan ni Simon.
- source_word: Ἰάκωβον
  choice: Santiago
  rationale: Ito ang nakaugaliang anyo sa mga saling Bibliya sa Tagalog para sa apostol na tinutukoy rito.
- source_word: Ἰωάννην
  choice: Juan
  rationale: Ito ang kinikilalang tradisyonal na anyo sa Tagalog.
- source_word: Φίλιππον
  choice: Felipe
  rationale: Ito ang kinikilalang tradisyonal na anyo sa Tagalog.
- source_word: Βαρθολομαῖον
  choice: Bartolome
  rationale: Ito ang natural at nakaugaliang anyo sa Tagalog.
- source_word: καὶ
  choice: at / din
  rationale: Isinalin bilang “at” kapag nag-uugnay ng mga pangalan sa talaan, at bilang “din” sa pariralang tumutukoy sa pagbibigay kay Simon ng pangalang Pedro.
