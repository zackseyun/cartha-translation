  text: ⸀καὶ Μαθθαῖον καὶ Θωμᾶν ⸁καὶ ⸀Ἰάκωβον Ἁλφαίου καὶ Σίμωνα τὸν καλούμενον Ζηλωτὴν
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/015.yaml
  text: and Matthew and Thomas[a], and James son of Alphaeus, and Simon who was called the Zealot
translation:
  language: tl
  text: at si Mateo at si Tomas, at si Santiago na anak ni Alfeo, at si Simon na tinatawag na Zelote[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang Masigasig.” Ang salitang Griyego ay maaaring bansag na nangangahulugang isang taong masigasig o maalab; hindi lamang nito pinatutunayan na pormal siyang kasapi ng isang kilusang pampolitika na nakilala nang kalaunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: at
  rationale: Karaniwang pang-ugnay sa talaan ng mga pangalan; pinanatili ang pag-uulit nito upang maipakita ang ayos ng talaan sa Griyego.
- source_word: Μαθθαῖον
  choice: Mateo
  rationale: Karaniwang anyo ng pangalang Μαθθαῖος sa modernong Filipino.
- source_word: Θωμᾶν
  choice: Tomas
  rationale: Karaniwang anyo ng pangalang Θωμᾶς sa modernong Filipino.
- source_word: Ἰάκωβον Ἁλφαίου
  choice: Santiago na anak ni Alfeo
  rationale: Sa ganitong pormula ng pangalan, ang genitibong Ἁλφαίου ay likas na tumutukoy sa kaugnayang ama at anak; malinaw at natural sa Filipino ang “na anak ni Alfeo.”
- source_word: Σίμωνα
  choice: Simon
  rationale: Karaniwang anyo ng pangalang Σίμων sa modernong Filipino.
- source_word: τὸν καλούμενον
  choice: na tinatawag na
  rationale: Natural na ipinahahayag sa Filipino ang attributive passive participle bilang bansag o katawagang nagpapakilala sa tao.
- source_word: Ζηλωτὴν
  choice: Masigasig
  rationale: Ipinahahayag nito ang pangunahing kahulugan ng ζηλωτής bilang isang taong maalab o masigasig, habang ang talababa ay nagpapanatili sa posibilidad na “Zelote” ang bansag o katawagang panggrupo.
theological_decisions:
- issue: Kung ang Ζηλωτής ay tiyak na katawagan sa kasapi ng isang kilusang pampolitika o isang mapaglarawang bansag
  choice: Isinalin bilang bansag na “Masigasig,” na may talababa para sa “Zelote.”
  alternative: “Zelote,” na maaaring maunawaan bilang katawagan sa isang tiyak na kilusan o pangkat.
  rationale: Maaaring gamiting bansag ang salitang Griyego, ngunit hindi nito lamang pinatutunayan ang pormal na pagiging kasapi ni Simon sa isang kilusang pampolitika na nakilala nang kalaunan. Pinananatili ng salin at talababa ang makasaysayang kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga pangalang karaniwan sa tradisyong Filipino, ngunit iniwasan ang “Makabayan” para sa Ζηλωτής sapagkat maaari itong magpasok ng mas tiyak na kahulugang pampolitika kaysa sa hinihingi ng Griyego.
