  text: αὐτοὶ δὲ ἐπλήσθησαν ἀνοίας, καὶ διελάλουν πρὸς ἀλλήλους τί ἂν ποιήσαιεν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/011.yaml
  text: But they were filled with rage[a], and they discussed with one another what they might do to Jesus.
translation:
  language: tl
  text: Ngunit napuno sila ng kahibangan[a], at nag-usap-usap sila kung ano ang maaari nilang gawin kay Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “napuno sila ng kahangalan” o “nawalan sila ng katinuan.” Ang salitang Griyego ay maaaring tumukoy sa kahangalan, kawalan ng matinong pag-iisip, o kahibangan; sa kontekstong ito, maaaring kasama ang di-makatuwirang silakbo ng galit.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: Ngunit … sila
  rationale: Ipinahahayag ng “ngunit” ang malinaw na pagsalungat sa naunang ginawa ni Jesus, habang likas na naipapakita ng “sila” ang tinutukoy na pangkat sa Filipino.
- source_word: ἐπλήσθησαν ἀνοίας
  choice: lubos silang nawalan ng katinuan
  rationale: Ang ἀνοία ay tumutukoy sa kawalan ng matinong pag-iisip, kahangalan, o kahibangan. Iniiwasan ng saling ito ang makabagong klinikal na pakahulugan ng “kabaliwan” at hindi rin nito inilalagay sa pangunahing teksto ang “galit,” na ipinahihiwatig lamang ng konteksto at hindi tuwirang kahulugan ng salita. Ginagamit ang “lubos” upang maipahayag ang ganap na kalagayang ipinakikita ng idyomang “napuno.”
- source_word: διελάλουν πρὸς ἀλλήλους
  choice: pinag-usapan nila
  rationale: Likas itong paraan sa modernong Filipino upang ipahayag ang nagpapatuloy at magkakasamang pagsasanggunian na ipinahihiwatig ng imperfect at ng reciprocal phrase.
- source_word: τί ἂν ποιήσαιεν
  choice: kung ano ang maaari nilang gawin
  rationale: Pinananatili ng “maaari” ang di-tiyak at mapagdeliberasyong puwersa ng ἄν kasama ng optative, nang hindi ito ginagawang obligasyon.
- source_word: τῷ Ἰησοῦ
  choice: kay Jesus
  rationale: Tuwirang ipinapahayag nito ang kilos na pinag-iisipan nilang gawin kay Jesus; hindi idinaragdag ang “laban” upang hindi gawing mas tahasan kaysa sa Griyego ang kanilang masamang layunin.
theological_decisions:
- issue: Kung ang ἀνοία ay isasaling bilang galit, kabaliwan, o moral na kawalan ng katinuan
  choice: lubos silang nawalan ng katinuan
  alternative: napuno sila ng di-makatuwirang galit; napuno sila ng kahibangan; napuno sila ng kahangalan
  rationale: Ang piniling salin ay nagpapanatili sa pangunahing ideya ng ἀνοία—kawalan ng matinong pag-iisip—nang hindi ito ginagawang diagnosis sa pag-iisip o tahasang ipinapakahulugang “galit.” Gayunman, kinikilala sa talababa na ipinahihiwatig ng konteksto ang isang di-makatuwirang silakbo ng galit.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “nawalan ng katinuan” ay madaling maunawaan ng karaniwang mambabasa at umiiwas sa posibleng mapanlait o klinikal na dating ng “nabaliw.”
