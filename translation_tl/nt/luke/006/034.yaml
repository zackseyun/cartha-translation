  text: καὶ ἐὰν ⸀δανίσητε παρ’ ὧν ἐλπίζετε ⸀λαβεῖν, ποία ὑμῖν χάρις ἐστίν; ⸀καὶ ἁμαρτωλοὶ ἁμαρτωλοῖς δανίζουσιν ἵνα ἀπολάβωσιν τὰ ἴσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/034.yaml
  text: And if you lend to those from whom you expect to receive[a], what credit is that to you? Even sinners lend to sinners so that they may receive back the same amount.
translation:
  language: tl
  text: At kung nagpapautang kayo sa mga taong inaasahan ninyong magbabayad sa inyo, anong pagkilala ang para sa inyo?[a] Maging ang mga makasalanan ay nagpapautang sa kapwa nila makasalanan upang makatanggap silang muli ng katumbas na halaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “anong pasasalamat ang matatanggap ninyo?” Ang salitang Griyego ay maaari ring mangahulugang “pasasalamat” o “biyaya”; dito ay malamang na tumutukoy ito sa pagkilala o kapuri-puring katayuang natatamo ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: δανίσητε / δανίζουσιν
  choice: nagpapautang / nagpapautang
  rationale: Likas at malinaw sa modernong Filipino ang “magpautang” para sa pagpapahiram ng salapi o ari-arian na inaasahang ibabalik.
- source_word: παρ’ ὧν ἐλπίζετε λαβεῖν
  choice: sa mga taong inaasahan ninyong magbabayad sa inyo
  rationale: Ipinahahayag nito sa natural na Filipino ang inaasahang pagtanggap pabalik mula sa mga pinautang. Ginawang tahasan ang pagbabayad dahil iyon ang ipinahihiwatig ng konteksto ng pagpapautang, nang hindi nagdaragdag ng interes o tubo.
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: anong papuri ang nararapat sa inyo?
  rationale: Sa kontekstong ito, ang χάρις ay tumutukoy sa pagkilalang karapat-dapat o kapuri-puring katangian, hindi sa biyayang nagliligtas. Pinananatili ng “papuri” ang retorikal na diin at nilalagyan ng talababa ang leksikal na alternatibo.
- source_word: ἁμαρτωλοὶ
  choice: mga makasalanan
  rationale: Tuwirang katumbas ito ng pang-uring ginamit bilang pangngalan at pinananatili ang moral na kategorya sa salaysay ni Lucas.
- source_word: ἵνα ἀπολάβωσιν
  choice: upang mabawi nila
  rationale: Ang ἀπολαμβάνω rito ay pagtanggap pabalik ng ipinahiram; malinaw at maikli ang “mabawi” sa Filipino.
- source_word: τὰ ἴσα
  choice: ang katumbas na halaga
  rationale: Ipinahihiwatig ng parirala ang patas o katumbas na pagbabalik. Hindi nito ipinapalagay na may interes, tubo, o dagdag sa prinsipal.
theological_decisions:
- issue: Kahulugan ng χάρις sa retorikal na tanong ni Jesus
  choice: Isinaling “papuri” bilang pagkilalang nararapat sa kapuri-puring asal.
  alternative: biyaya; pasasalamat; pakinabang
  rationale: Ang kalapit na konteksto ay nagtatanong kung ano ang kapuri-puring pagkakaiba ng asal ng mga alagad sa asal ng mga makasalanan. Hindi ginagamit dito ang χάρις bilang abstraktong terminong tumutukoy sa biyayang nagliligtas, ngunit kinikilala sa talababa ang posibleng kahulugang “pasasalamat.”
- issue: Uri ng inaasahang balik sa pagpapautang
  choice: Katumbas na pagbabayad lamang, nang walang pahiwatig ng interes o tubo.
  alternative: pagbabayad na may interes; pagbabalik na may pakinabang
  rationale: Ang τὰ ἴσα ay tumutukoy sa katumbas na ibinabalik. Walang sapat na batayan sa talata upang magdagdag ng interes, tubo, o partikular na hatol sa mga iyon.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “kayo/ninyo” para mapanatili ang maramihang ikalawang panauhan. Iniwasan ang teknikal na pananalitang pampinansyal at ang pag-aangkat ng anumang pahiwatig tungkol sa interes o tubo.
