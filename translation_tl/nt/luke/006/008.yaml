    issue: Idinagdag ng “kaya” ang isang ugnayang sanhi.
    rationale: Ang Griyegong δέ ay pang-ugnay na “ngunit/at,” hindi “therefore” o “because of this.” Hindi dapat ipahiwatig ng salin na ang pagsasalita ni Jesus ay lohikal na resulta ng kaniyang pagkaalam.
  - severity: medium
    issue: Hindi tumpak ang talababa na “nanlumo ang isang kamay.”
    rationale: Ang ξηρά, kapag inilalarawan ang bahagi ng katawan, ay “tuyot,” “lanta,” o “nanliit/shriveled,” hindi “nanlumo.”
  - severity: low
    issue: Medyo di-natural ang “lalaking tuyot ang isang kamay.”
    rationale: Mas maayos sa Filipino ang predikatibong “lalaking tuyot ang kamay,” habang nananatili ang singular na tinutukoy ng Griyego.
