base_translation:
  language: en
  yaml_path: translation/nt/luke/006/008.yaml
  text: But he knew their thoughts[a], and he said to the man who had the withered hand[c][b], “Get up and stand in the middle.” And he got up and stood there.
translation:
  language: tl
  text: Ngunit alam niya ang mga iniisip nila[a], at sinabi niya sa lalaking tuyot ang kamay[b], “Bumangon ka at tumayo sa gitna[c].” Bumangon siya at tumayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pangangatwiran nila.”
    reason: lexical_alternative
  - marker: b
    text: O “lantang kamay.”
    reason: lexical_alternative
  - marker: c
    text: Sa Griyego, “papunta sa gitna” o “sa kalagitnaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: alam niya
  rationale: Ang anyong ᾔδει ay may diwang pangkasalukuyan na ‘alam’; natural sa salaysay sa Filipino ang ‘alam niya.’
- source_word: διαλογισμοὺς
  choice: mga iniisip
  rationale: Saklaw ng salita ang mga kaisipan at pangangatwiran sa loob; malinaw at hindi labis na tiyak ang ‘mga iniisip.’
- source_word: ἀνδρὶ
  choice: lalaki
  rationale: Tumutukoy ang ἀνήρ sa isang lalaking nasa hustong gulang, kaya pinananatili ang tiyak na kasarian.
- source_word: ξηρὰν ... τὴν χεῖρα
  choice: tuyot ang isang kamay
  rationale: Ang ξηρός tungkol sa bahagi ng katawan ay nangangahulugang tuyot o nanlumo. Natural sa Filipino ang paglalarawang ‘tuyot ang isang kamay’; ginamit ang ‘isang’ upang hindi magpahiwatig na parehong kamay ang may kapansanan.
- source_word: Ἔγειρε
  choice: Tumayo ka
  rationale: Iniuutos nitong bumangon ang lalaki mula sa kinalalagyan niya. Sa Filipino, ‘Tumayo ka’ ang pinakanatural na utos.
- source_word: στῆθι εἰς τὸ μέσον
  choice: pumuwesto sa gitna
  rationale: Upang mapanatili ang kaibhan mula sa naunang Ἔγειρε, ang στῆθι ay isinaling ‘pumuwesto,’ at ang εἰς τὸ μέσον ay ‘sa gitna’ ng nagkakatipong mga tao.
- source_word: ἀναστὰς ἔστη
  choice: Tumayo nga siya at pumuwesto roon
  rationale: Pinananatili nito ang sunod-sunod na pagkilos—ang pagbangon at ang pagtayo sa itinurong lugar—nang natural sa Filipino.
theological_decisions:
- issue: Kaalaman ni Jesus sa panloob na iniisip ng iba
  choice: Isinasaad lamang na alam niya ang mga iniisip nila.
  alternative: Ipaliwanag na napansin niya ang kanilang mga balak o nalaman niya ang mga ito sa paraang sobrenatural.
  rationale: Tahasang sinasabi ng Griyego na alam niya ang kanilang mga iniisip ngunit hindi nito ipinapaliwanag kung paano; hindi dapat dagdagan ng salin ang mekanismo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang dalawang magkaugnay ngunit magkahiwalay na kilos sa utos at tugon, habang iniwasan ang arkaikong ‘mangagbangon’ o sobrang literal na pananalita.
