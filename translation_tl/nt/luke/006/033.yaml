  text: ⸀καὶ ἐὰν ἀγαθοποιῆτε τοὺς ἀγαθοποιοῦντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; ⸁καὶ οἱ ἁμαρτωλοὶ τὸ αὐτὸ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/033.yaml
  text: And if you do good to those who do good to you[a], what credit is that to you? Even sinners do the same.
translation:
  language: tl
  text: At kung gumagawa kayo ng mabuti sa mga gumagawa ng mabuti sa inyo, anong pagkilala ang matatanggap ninyo?[a] Maging ang mga makasalanan ay ginagawa rin iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anong biyaya ang para sa inyo?” Ang salitang Griyego ay maaaring mangahulugang “biyaya,” “pabor,” “pasasalamat,” o “pagkilala”; dito, tumutukoy ito sa pagkilalang matatanggap dahil sa kabutihang iginaganti lamang sa kabutihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθοποιῆτε
  choice: gumagawa kayo ng mabuti
  rationale: Tuwirang ipinapahayag ang paggawa ng kabutihan o pakikinabang sa iba, at pinananatili ang kaugnayan nito sa kasunod na participle.
- source_word: ἀγαθοποιοῦντας
  choice: mga gumagawa ng mabuti
  rationale: Ginamit ang parehong pangunahing parirala upang mapanatili ang leksikal na pag-uulit ng Griyego.
- source_word: ποία ... χάρις
  choice: anong pagkilala ang nararapat
  rationale: Sa kontekstong ito, ang χάρις ay tumutukoy sa pagkilala o kapurihang matatanggap dahil sa isang gawa, hindi partikular sa biyayang nagliligtas. Ang 'nararapat' ay likas na naghahatid ng ideya ng pagkilalang mapapasakanila.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Likas na salin ng datibo sa pariralang tumutukoy sa pagkilalang nauukol sa mga tagapakinig.
- source_word: ἁμαρτωλοὶ
  choice: mga makasalanan
  rationale: Pamantayan at tuwirang katawagan na nagpapanatili sa panlipunan at panrelihiyong kategorya sa Lucas.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: gayon din ang ginagawa
  rationale: Natural na Filipino para sa paggawa ng parehong bagay, habang malinaw na tumutukoy sa naunang kilos.
- source_word: καὶ
  choice: At / Maging
  rationale: Ang unang καὶ ay nagpapatuloy sa magkakaugnay na mga pahayag; ang ikalawa ay may diin na ang mga makasalanan man ay gumagawa rin nito.
theological_decisions:
- issue: Kahulugan ng χάρις sa konteksto ng turong etikal
  choice: pagkilala o kapurihan, hindi teknikal na biyayang nagliligtas
  alternative: biyaya; pabor; pasasalamat
  rationale: Ang tanong ay tungkol sa natatanging pagkilalang matatanggap para sa kabutihang ginagantihan lamang ng kabutihan. Gayunman, inilalagay sa talababa ang lawak ng kahulugan ng salitang Griyego upang hindi maitago ang tunay na leksikal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang magkatulad na pananalita para sa dalawang anyo ng ἀγαθοποιέω at iniwasan ang teknikal o denominasyonal na pagbasa sa χάρις.
