- from: At kung gumagawa kayo ng mabuti sa mga gumagawa ng mabuti sa inyo, anong pagkilala ang nararapat sa inyo?[a] Maging ang mga makasalanan ay gayon din ang ginagawa.
  to: At kung gumagawa kayo ng mabuti sa mga gumagawa ng mabuti sa inyo, anong pagkilala ang matatanggap ninyo?[a] Maging ang mga makasalanan ay ginagawa rin iyon.
  rationale: Pinalitan ang “nararapat sa inyo” ng “matatanggap ninyo” upang maipahayag ang kontekstuwal na diwa ng χάρις bilang credit o commendation nang hindi nagdaragdag ng ideya ng pagiging karapat-dapat. Inayos ang pangwakas na sugnay para sa mas natural na Filipino habang pinananatili ang kahulugang ‘ginagawa rin nila ang gayon.’
