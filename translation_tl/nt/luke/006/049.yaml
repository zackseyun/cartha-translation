  text: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου, ᾗ προσέρηξεν ὁ ποταμός, καὶ ⸂εὐθὺς συνέπεσεν⸃, καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/049.yaml
  text: But the one who heard and did not act is like a man who built a house on the ground without a foundation[a]. When the river burst against it, it immediately collapsed[b], and the ruin of that house was great.
translation:
  language: tl
  text: Ngunit ang nakarinig at hindi gumawa[a] ay tulad ng isang lalaking nagtayo ng bahay sa lupa nang walang pundasyon. Sinalpok ito ng ilog, at agad itong gumuho. Napakalaki ng pagkawasak ng bahay na iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “hindi isinagawa ang mga narinig.” Sa literal, “hindi gumawa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “Napakalaki ng pagkabiyak ng bahay na iyon.” Ang salitang Griyego ay maaaring tumukoy sa pagkabiyak, pagkasira, o pagkawasak na dulot ng pagguho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας
  choice: Ngunit ang nakarinig
  rationale: Ang participle na may pantukoy ay tumutukoy sa isang kinatawang indibidwal. Natural sa Tagalog ang “ang nakarinig,” at pinananatili ng “ngunit” ang paghahambing at pagsalungat sa naunang halimbawa.
- source_word: καὶ μὴ ποιήσας
  choice: at hindi sumunod
  rationale: Sa konteksto, ang ποιέω ay paggawa o pagsasakatuparan ng mga salitang narinig mula kay Jesus. Ang “hindi sumunod” ay malinaw at natural, ngunit nilalagyan ng talababa upang mapanatili ang mas payak na diwa ng Griyegong “hindi gumawa.”
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: ay tulad ng isang lalaking
  rationale: Ang “ay tulad ng” ay karaniwang pananalita para sa paghahambing. Ang “isang lalaki” ay nagpapanatili sa panlalaking isahang larawan ng halimbawa.
- source_word: οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου
  choice: nagtayo ng bahay sa ibabaw ng lupa nang walang pundasyon
  rationale: Tuwirang inilalarawan ang pagtatayo sa mismong lupa na walang pundasyon. Ang “sa ibabaw ng lupa” ay mas malinaw kaysa sa maaaring malabong “sa lupa.”
- source_word: ᾗ προσέρηξεν ὁ ποταμός
  choice: Hinampas iyon ng rumaragasang ilog
  rationale: Ang προσρήγνυμι ay nagpapahiwatig ng marahas na pagdaluhong o pagtama. Ipinahahayag ng “rumaragasang ilog” ang puwersa ng ποταμός sa eksena nang hindi ito ginagawang ibang larawan gaya ng baha.
- source_word: καὶ εὐθὺς συνέπεσεν
  choice: at agad itong gumuho
  rationale: Ang συμπίπτω ay angkop isaling “gumuho” para sa isang bahay, at ang εὐθύς ay malinaw na naipapahayag ng “agad.”
- source_word: καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα
  choice: Napakalaki ng pagkawasak ng bahay na iyon
  rationale: Maaaring tumukoy ang ῥῆγμα sa pagkabiyak, pagkasira, o bunga ng pagguho. Natural sa konteksto ang “pagkawasak,” habang pinananatili ng “napakalaki” ang diin ng μέγα.
theological_decisions:
- issue: Kinatawang panlalaking larawan sa paghahambing
  choice: isang lalaki
  alternative: isang tao
  rationale: Bagaman maaaring pangkalahatan ang ἄνθρωπος, panlalaking isahan ang anyo ng ilustrasyon. Pinananatili ng “isang lalaki” ang larawan ng teksto nang hindi ipinahihiwatig na sa mga lalaki lamang ito naaangkop.
- issue: Kahulugan ng hindi paggawa matapos makarinig
  choice: hindi sumunod
  alternative: hindi gumawa / hindi isinagawa ang narinig
  rationale: Tinutukoy ng konteksto ang pagtugon sa mga salita ni Jesus, ngunit hindi dinaragdagan ng salin kung aling partikular na utos ang hindi ginawa. Inilalahad sa talababa ang mas literal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “rumaragasang ilog” upang natural na maipakita ang marahas na pagtama, at “gumuho” bilang karaniwang salita para sa pagbagsak ng bahay. Lahat ng talababa ay may katugmang marker sa pangunahing teksto.
