  to: Ngunit ang nakarinig at hindi gumawa[a] ay tulad ng isang lalaking nagtayo ng bahay sa lupa nang walang pundasyon. Sinalpok ito ng ilog, at agad itong gumuho. Napakalaki ng pagkawasak ng bahay na iyon.[b]
