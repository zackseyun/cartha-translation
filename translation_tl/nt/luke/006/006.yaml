base_translation:
  language: en
  yaml_path: translation/nt/luke/006/006.yaml
  text: It happened on another Sabbath that he entered the synagogue and was teaching[a]. And a man was there whose right hand was withered.
translation:
  language: tl
  text: Sa isa pang Sabbath, pumasok siya sa sinagoga at nagtuturo roon. Naroon ang isang lalaking may tuyot[a] na kanang kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nanlanta.” Ang salitang Griyego ay maaaring tumukoy sa bagay na natuyo o nanlanta; sa kontekstong ito, inilalarawan nito ang may kapansanang kanang kamay ng lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Noong
  rationale: Ang pormulang ito ay panandang pasalaysay sa Lucas. Sa natural na modernong Tagalog, naihahatid ang paglipat sa panibagong pangyayari sa pamamagitan ng sugnay na panahunan, nang hindi gumagamit ng mabigat na literal na ‘Nangyari naman na.’
- source_word: ἐν ἑτέρῳ σαββάτῳ
  choice: isa pang Sabbath
  rationale: Ipinahihiwatig ng ἑτέρῳ ang ibang pagkakataon na kapareho ng naunang uri; malinaw at natural ang ‘isa pang Sabbath.’
- source_word: εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν
  choice: pumasok siya sa sinagoga
  rationale: Ginawang tahasang pandiwa ang infinitive na karaniwan sa salaysay ni Lucas; tuwiran at natural ito sa Tagalog.
- source_word: καὶ διδάσκειν
  choice: at nagtuturo roon
  rationale: Pinananatili ng aspektong imperpektibo ng kasalukuyang infinitive ang nagaganap o nagpapatuloy na pagtuturo. Nililinaw ng ‘roon’ ang pook nang hindi nagdaragdag ng bagong diwa.
- source_word: ἄνθρωπος ἐκεῖ
  choice: Naroon ang isang lalaki
  rationale: Likas na Tagalog na ayos para sa eksistensiyal na sugnay, at pinananatili ang tiyak na pagtukoy sa isang lalaking naroon.
- source_word: ἡ χεὶρ αὐτοῦ ἡ δεξιὰ
  choice: ang kanang kamay
  rationale: Pinananatili ang espesipikong pagtukoy na kanang kamay niya ang apektado; malinaw na ang pag-aari sa kayariang ‘isang lalaking … ang kanang kamay.’
- source_word: ξηρά
  choice: tuyot
  rationale: Ang salita ay literal na tumutukoy sa natuyo o nanlantang kalagayan at sa kontekstong ito ay naglalarawan ng kapansanan sa kamay. Iniiwasan ng ‘tuyot’ ang mas tiyak ngunit hindi tahasang ‘paralisado.’
