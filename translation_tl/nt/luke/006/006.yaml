translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang ‘Sabbath’ at ‘sinagoga’ bilang pamilyar na terminong biblikal. Inayos ang salaysay ayon sa likas na sintaks ng Tagalog habang pinananatili ang nagpapatuloy na aspekto ng pagtuturo at ang saklaw ng paglalarawan sa kanang kamay.
