  text: Ἐγένετο δὲ ἐν ⸀σαββάτῳ διαπορεύεσθαι αὐτὸν ⸀διὰ σπορίμων, καὶ ἔτιλλον οἱ μαθηταὶ αὐτοῦ ⸂καὶ ἤσθιον τοὺς στάχυας⸃ ψώχοντες ταῖς χερσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/001.yaml
  text: It happened on a Sabbath that he was passing through grainfields[a], and his disciples were plucking and eating the heads of grain[b], rubbing them in their hands.
translation:
  language: tl
  text: Nang isang Araw ng Pamamahinga, habang dumaraan siya sa mga taniman ng butil, pumipitas at kumakain ang kanyang mga alagad ng mga uhay[a], habang kinikiskis nila ang mga iyon sa kanilang mga kamay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “uhay” ay ang bahaging nasa dulo ng halamang butil na kinalalagyan ng mga butil.
    reason: lexical_alternative
  - marker: b
    text: Kiniskis nila ang mga uhay sa kanilang mga kamay upang maihiwalay ang mga butil na makakain.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Isang …,
  rationale: Karaniwang panimulang salaysay ito sa Lucas. Sa Filipino, likas na naipakikita ang pagpasok ng pangyayari sa pamamagitan ng pagsisimula sa tagpuan ng panahon, nang hindi nagdaragdag ng tahasang salitang katumbas ng “ngayon.”
- source_word: ἐν σαββάτῳ
  choice: Isang Araw ng Pamamahinga
  rationale: 'Pinananatili ng “isang” ang di-tiyak na diwa ng anarthrous na σαββάτῳ: isa itong okasyon ng Sabbath, hindi kinakailangang isang nauna nang tinukoy na araw.'
- source_word: διαπορεύεσθαι αὐτὸν
  choice: dumaraan siya
  rationale: Likas na finite clause sa Filipino para sa infinitive construction, at ipinahihiwatig ng aspektong di-ganap ang nagpapatuloy na kilos.
- source_word: διὰ σπορίμων
  choice: sa mga taniman ng butil
  rationale: Tumutukoy ang σπόριμος sa mga bukid na nahasikan o tinamnan ng butil. Hindi tinutukoy ng salin kung anong uri ng butil upang maiwasan ang sobrang espesipikasyon.
- source_word: ἔτιλλον
  choice: Pumipitas
  rationale: Ipinahahayag ang nagpapatuloy o paulit-ulit na kilos ng imperfect verb sa kontekstong pasalaysay.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ang kanyang mga alagad
  rationale: Natural at malinaw na anyo ng possessive construction sa modernong Filipino.
- source_word: καὶ ἤσθιον
  choice: at kumakain
  rationale: Kasabay at nagpapatuloy ang pagkain habang pumipitas sila; pinananatili ang koordinasyon ng dalawang imperfect verb.
- source_word: τοὺς στάχυας
  choice: ng mga uhay
  rationale: Ang στάχυς ay ulo o uhay ng halamang butil. “Uhay” ang maikli, tumpak, at karaniwang katawagang Filipino.
- source_word: ψώχοντες ταῖς χερσίν
  choice: habang kinikiskis ang mga iyon sa kanilang mga kamay
  rationale: Inilalarawan ng participle kung paano nila inihahanda ang mga uhay upang makain ang mga butil, at pinananatili ang kongkretong kilos ng pagkiskis gamit ang mga kamay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “Araw ng Pamamahinga” bilang malinaw na tawag sa Sabbath, “mga taniman ng butil” upang hindi tukuyin nang walang batayan ang uri ng pananim, at “uhay” bilang tumpak na katawagan sa στάχυας.
