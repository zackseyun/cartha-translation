base_translation:
  language: en
  yaml_path: translation/nt/luke/006/012.yaml
  text: It happened in those days that he went out to the mountain to pray[a], and he spent the whole night in prayer to God.
translation:
  language: tl
  text: Noong mga araw na iyon, umalis siya patungo sa bundok upang manalangin, at buong magdamag siyang nanalangin sa Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nagpatuloy siyang manalangin sa Diyos buong magdamag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ταύταις
  choice: Nang mga araw na iyon
  rationale: Natural na panandang salaysay sa Tagalog na nagpapakilala sa pangyayaring naganap sa panahong tinutukoy; hindi na kailangang tumbasan nang hiwalay ang mahinang pang-ugnay na δέ.
- source_word: ἐξελθεῖν αὐτὸν
  choice: pumunta siya
  rationale: Sa konteksto, ipinahihiwatig ng ἐξέρχομαι ang pag-alis at pagpunta sa kasunod na patutunguhan. Ang “pumunta” ay natural sa Tagalog at hindi nagdaragdag ng di-tiyak na pinanggalingan.
- source_word: εἰς τὸ ὄρος
  choice: sa bundok
  rationale: Tuwirang katumbas ng ὄρος; pinananatili ang singular at hindi tinutukoy kung aling bundok.
- source_word: προσεύξασθαι
  choice: upang manalangin
  rationale: Malinaw na ipinapahayag ang layunin ng pagpunta, gaya ng infinitive of purpose sa Griyego.
- source_word: ἦν διανυκτερεύων
  choice: magdamag siyang nanalangin
  rationale: Ipinahahayag ng “magdamag” ang tuloy-tuloy na pagkilos sa buong gabi. Isinama sa pandiwang “nanalangin” ang kilos na nililinaw ng kasunod na parirala upang maging likas sa Tagalog.
- source_word: ἐν τῇ προσευχῇ τοῦ θεοῦ
  choice: nanalangin sa Diyos
  rationale: Ang genitive na τοῦ θεοῦ ay nauunawaan dito bilang Diyos ang pinatutunguhan ng panalangin. Ang pandiwang anyo ay mas natural kaysa literal na “sa panalangin sa Diyos” at hindi nagmumungkahing Diyos ang nananalangin.
theological_decisions:
- issue: Ugnayan ng τοῦ θεοῦ sa panalangin ni Jesus
  choice: nanalangin sa Diyos
  alternative: nasa panalangin ng Diyos
  rationale: Ipinakikita ng konteksto na si Jesus ang nananalangin at ang Diyos ang pinatutunguhan ng panalangin. Iniiwasan nito ang maling pahiwatig na ang panalangin ay pag-aari o mismong panalangin ng Diyos, nang hindi nagdaragdag ng paliwanag na doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “Nang mga araw na iyon” bilang likas na pambungad sa salaysay at “magdamag” upang malinaw at maikli ang duratibong diwa.
