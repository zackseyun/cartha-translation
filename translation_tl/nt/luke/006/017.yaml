  text: Καὶ καταβὰς μετ’ αὐτῶν ἔστη ἐπὶ τόπου πεδινοῦ, καὶ ὄχλος ⸀πολὺς μαθητῶν αὐτοῦ, καὶ πλῆθος πολὺ τοῦ λαοῦ ἀπὸ πάσης τῆς Ἰουδαίας καὶ Ἰερουσαλὴμ καὶ τῆς παραλίου Τύρου καὶ Σιδῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/017.yaml
  text: And coming down with them[a], he stood on a level place, with a large crowd of his disciples and a great multitude of the people from all Judea and Jerusalem and the coastal region of Tyre and Sidon,
translation:
  language: tl
  text: At bumaba siyang kasama nila at tumayo sa isang patag na lugar.[a] Naroon ang isang malaking pulutong ng kanyang mga alagad at napakaraming tao mula sa buong Judea at Jerusalem, at sa baybaying lupain ng Tiro at Sidon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa isang kapatagan.” Literal na, “sa isang patag na lugar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβὰς
  choice: bumaba
  rationale: Likas na salin ng aorist participle sa daloy ng salaysay; pinananatili ang direksiyon ng kilos bago ang pangunahing pandiwang “tumayo.”
- source_word: ἔστη
  choice: tumayo
  rationale: Tuwirang ipinahahayag ang pagkuha niya ng nakatayong puwesto nang hindi dinaragdagan ng diwa gaya ng paghinto.
- source_word: ἐπὶ τόπου πεδινοῦ
  choice: sa isang patag na lugar
  rationale: Pinananatili ang literal na sangkap na “lugar” at ang katangiang patag, nang hindi ipinapalagay na malawak itong kapatagan.
- source_word: ὄχλος πολὺς μαθητῶν αὐτοῦ
  choice: malaking pulutong ng kanyang mga alagad
  rationale: Ipinakikita na ang pulutong ay binubuo ng kanyang mga alagad at pinananatili ang pagkakaiba nito sa mas malawak na karamihan ng mga tao.
- source_word: πλῆθος πολὺ τοῦ λαοῦ
  choice: napakaraming tao
  rationale: Natural na modernong Tagalog para sa isang napakalaking bilang mula sa mas malawak na sambayanan, bukod sa pulutong ng mga alagad.
- source_word: ἀπὸ πάσης τῆς Ἰουδαίας
  choice: mula sa buong Judea
  rationale: Tumpak at likas na ipinahahayag ang saklaw ng πάσης sa pangalang heograpiko.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Karaniwang modernong anyo ng pangalan sa Filipino.
- source_word: τῆς παραλίου Τύρου καὶ Σιδῶνος
  choice: sa baybaying lupain ng Tiro at Sidon
  rationale: Malinaw na inilalarawan ang rehiyong nasa tabing-dagat na kaugnay ng dalawang lungsod.
theological_decisions:
- issue: Topograpikong paglalarawan ng lugar ng pangangaral
  choice: sa isang patag na lugar
  alternative: sa isang kapatagan
  rationale: Sinusunod ang leksikal na diwa ng τόπου πεδινοῦ nang hindi inuunawa o itinutugma ang salaysay sa ibang ulat; hindi rin ipinapalagay na isang malawak na kapatagan ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “pulutong” para sa ὄχλος at “napakaraming tao” para sa πλῆθος πολὺ τοῦ λαοῦ upang mapanatili ang pagkakaiba ng dalawang pangkat nang hindi nagiging mabigat ang pangungusap.
