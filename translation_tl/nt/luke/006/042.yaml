  text: ⸀πῶς δύνασαι λέγειν τῷ ἀδελφῷ σου· Ἀδελφέ, ἄφες ἐκβάλω τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ σου, αὐτὸς τὴν ἐν τῷ ὀφθαλμῷ σοῦ δοκὸν οὐ βλέπων; ὑποκριτά, ἔκβαλε πρῶτον τὴν δοκὸν ἐκ τοῦ ὀφθαλμοῦ σοῦ, καὶ τότε διαβλέψεις ⸂τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου ἐκβαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/042.yaml
  text: How can you say to your brother[a], ‘Brother, let me take out the speck that is in your eye,’ while you yourself do not see the beam that is in your own eye? Hypocrite, first take the beam out of your own eye[c][b], and then you will see clearly to take out the speck that is in your brother’s eye.
translation:
  language: tl
  text: Paano mo masasabi sa iyong kapatid[a], ‘Kapatid, hayaan mong alisin ko ang puwing sa mata mo,’ gayong hindi mo nakikita ang malaking biga[b] sa sarili mong mata? Mapagkunwari! Alisin mo muna ang malaking biga sa sarili mong mata, at saka ka makakakita nang malinaw upang maalis mo ang puwing sa mata ng iyong kapatid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na ἀδελφός ay nasa anyong panlalaki at isahan. Maaaring mas malawak ang saklaw ng aral, ngunit “kapatid” ang karaniwang likas na salin sa Filipino.
    reason: cultural_note
  - marker: b
    text: Ang “malaking biga” ay tumutukoy sa isang malaking piraso ng kahoy na pansuporta sa gusali. Maaari rin itong isalin na “troso” o “tabla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασαι λέγειν
  choice: Paano mo masasabi
  rationale: Likas na retorikal na tanong sa Filipino; ipinahihiwatig nito ang paghamon sa pagiging marapat o posible ng sinasabi.
- source_word: ἀδελφῷ / Ἀδελφέ / ἀδελφοῦ
  choice: kapatid / Kapatid / kapatid
  rationale: Pinananatili ng “kapatid” ang terminong pangkamag-anak at ang tuwirang pagtawag, bagaman hindi nito minamarkahan ang kasariang panlalaki gaya ng Griyego.
- source_word: ἄφες ἐκβάλω
  choice: hayaan mong alisin ko
  rationale: Ipinapahayag ang pautos na ἄφες bilang likas na pakiusap na pahintulutan ang nagsasalita.
- source_word: κάρφος
  choice: munting puwing
  rationale: Sa konteksto ng mata, malinaw at likas ang “puwing”; idinagdag ang “munting” upang mapanatili ang matinding paghahambing sa malaking tahilan.
- source_word: δοκός
  choice: tahilan
  rationale: Ang tahilan ay isang malaking piraso ng kahoy na pansuporta sa gusali at angkop sa eksaheradong larawan ng Griyego.
- source_word: αὐτὸς ... οὐ βλέπων
  choice: samantalang hindi mo nakikita ... sa sarili mong mata
  rationale: Pinananatili ng “sarili mong” ang diin at kaibahan ng αὐτός nang natural sa Filipino.
- source_word: ὑποκριτά
  choice: Mapagkunwari!
  rationale: Tuwiran at matinding pantawag na katumbas ng isahang bokatibong Griyego.
- source_word: τότε διαβλέψεις ... ἐκβαλεῖν
  choice: at saka ka makakakita nang malinaw upang alisin
  rationale: Pinananatili ang pagkakasunod-sunod—sariling pagwawasto muna—at ang layuning ipinahihiwatig ng infinitive.
theological_decisions:
- issue: Kasariang panlalaki ng ἀδελφός sa etikang tagubilin
  choice: kapatid, na may talababa tungkol sa anyong panlalaki sa Griyego
  alternative: lalaking kapatid; kapatid na lalaki
  rationale: Ang karaniwang “kapatid” ay natural at marangal sa Filipino ngunit hindi hayagang minamarkahan ang kasarian; pinananatili sa talababa ang tunay na anyong panlalaki ng pinagmulang teksto nang hindi nililimitahan ang posibleng mas malawak na aplikasyon.
- issue: Metaporikal na paghahambing ng κάρφος at δοκός
  choice: munting puwing ... tahilan
  alternative: munting piraso ... troso; tinik ... malaking tabla
  rationale: Pinananatili nito ang matingkad at eksaheradong kaibahan sa pagitan ng napakaliit na bagay sa mata at malaking kahoy na panggusali.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang “puwing” bilang likas na salitang kaugnay ng mata at “tahilan” upang mapanatili ang larawan ng malaking kahoy na panggusali. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
