  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τῷ τύπτοντί σε ἐπὶ τὴν σιαγόνα πάρεχε καὶ τὴν ἄλλην, καὶ ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον καὶ τὸν χιτῶνα μὴ κωλύσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/029.yaml
  text: To the one who strikes you on the cheek[a], offer the other also; and from the one who takes away your cloak[c][b], do not withhold your tunic also.
translation:
  language: tl
  text: Sa humahampas sa iyo sa pisngi[a], iharap mo rin ang kabila[b]; at sa kumukuha ng iyong balabal[c], huwag mong ipagkait pati ang iyong tunika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa panga.”
    reason: lexical_alternative
  - marker: b
    text: Mas literal na “iharap/ialok ang kabila.” Hindi ginamit dito ni Lucas ang pandiwang “ibaling.”
    reason: alternative_reading
  - marker: c
    text: Ang “balabal” (ἱμάτιον) ay panlabas na kasuotan; ang “tunika” (χιτών) ay kasuotang isinusuot sa ilalim nito.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ τύπτοντί
  choice: sa humahampas
  rationale: Ang articular present participle ay tumutukoy sa sinumang gumagawa ng kilos. Likas sa Tagalog ang “sa humahampas” at napapanatili nito ang pangkalahatang diwa.
- source_word: ἐπὶ τὴν σιαγόνα
  choice: sa pisngi
  rationale: Maaaring tumukoy ang σιαγών sa pisngi o panga. Sa konteksto ng paghampas sa mukha, “pisngi” ang pinakanatural na katumbas; itinatala sa talababa ang “panga” bilang tunay na alternatibo.
- source_word: πάρεχε
  choice: iharap mo
  rationale: Ang παρέχω ay may diwang maghandog, maglaan, o magharap. Ang “iharap mo” ay natural kapag pisngi ang layon at hindi ipinapasok ang naiibang pandiwang “ibaling” mula sa pamilyar na pananalita sa Mateo.
- source_word: καὶ τὴν ἄλλην
  choice: rin ang kabila
  rationale: Nauunawaan mula sa naunang parirala na ang tinutukoy ay ang kabilang pisngi. Isinasalin ng “rin” ang dagdag na diin ng καί.
- source_word: ἀπὸ τοῦ αἴροντός σου
  choice: sa kumukuha ng iyong
  rationale: Ang pagkakabuo na may ἀπό at articular participle ay natural na naihahayag sa Tagalog bilang “sa kumukuha.” Hindi dinaragdagan ng “nagnanakaw” o “nang-aagaw” sapagkat hindi tahasang nilulutas ng Griyego ang paraan o legal na katangian ng pagkuha.
- source_word: τὸ ἱμάτιον
  choice: balabal
  rationale: Ang ἱμάτιον ay panlabas na kasuotan. Ang “balabal” ay maikli, marangal, at malinaw na naiiba sa panloob na tunika.
- source_word: τὸν χιτῶνα
  choice: iyong tunika
  rationale: Ang χιτών ay kasuotang isinusuot sa ilalim ng balabal, karaniwang malapit sa katawan. Pinananatili ng “tunika” ang sinaunang uri ng kasuotan sa halip na palitan ito ng di-eksaktong makabagong “kamiseta.”
- source_word: μὴ κωλύσῃς
  choice: huwag mong ipagkait
  rationale: Bagaman pangunahing nangangahulugan ang κωλύω na humadlang o pumigil, sa konteksto ng karagdagang kasuotan, natural na ipinahahayag ng “huwag mong ipagkait” ang hindi pagpigil o pagtanggi na makuha rin iyon.
theological_decisions:
- issue: Kung iaayon ang pananalita ni Lucas sa mas pamilyar na “ibaling ang kabilang pisngi” sa Mateo
  choice: 'Panatilihin ang natatanging pananalita ni Lucas: “iharap mo rin ang kabila”'
  alternative: ibaling mo rin ang kabilang pisngi
  rationale: πάρεχε ang ginamit ni Lucas, hindi pandiwang nangangahulugang “ibaling.” Pinananatili nito ang pagkakaiba ng salaysay ni Lucas at iniiwasang ipasok ang pananalita ng kahalintulad na talata.
- issue: Kung lalagyan ng paliwanag o limitasyon ang tuwirang mga utos
  choice: Isalin nang tuwiran ang mga pautos nang walang dagdag na interpretatibong kondisyon
  alternative: Magdagdag sa pangunahing teksto ng paliwanag tungkol sa di-pagganti, pagmamalabis, o saklaw ng utos
  rationale: Tuwirang pautos sa ikalawang panauhan ang nasa teksto. Dapat manatili ang bigat at tensiyong teolohikal ng turo nang hindi paunang nilulutas ang mga pagtatalo sa interpretasyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang “humahampas,” “iharap,” at “ipagkait” ay madaling maunawaan at hindi labis na kolokyal. Pinanatili ang “tunika” bilang terminong pangkultura at ipinaliwanag ito sa talababa. Ang mga pautos ay tuwiran at hindi pinalambot.
