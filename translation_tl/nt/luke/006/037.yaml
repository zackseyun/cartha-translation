  to: Huwag kayong humatol, at hinding-hindi kayo hahatulan; huwag kayong maghatol na may kasalanan ang iba, at hinding-hindi kayo hahatulang may kasalanan. Magpalaya kayo,[a] at palalayain kayo.
  rationale: Pinalitan ang hindi idiomatikong “humatol na may sala” ng “maghatol na may kasalanan ang iba.” Pinananatili nito ang kahulugang magpahayag ng pagkakasala o maghatol laban sa isang tao, na mas matindi kaysa sa naunang “humatol,” nang hindi nagdaragdag ng isang tiyak na teolohikal o legal na interpretasyon. Ginamit ang “hinding-hindi” upang likas na maipahayag ang diin ng οὐ μή. Hindi binago ang “Magpalaya” at ang talababa, upang mapanatili ang leksikal na lawak at ang kontekstuwal na alternatibong “magpatawad.”
