  text: Καὶ μὴ κρίνετε, καὶ οὐ μὴ κριθῆτε· ⸀καὶ μὴ καταδικάζετε, καὶ οὐ μὴ καταδικασθῆτε. ἀπολύετε, καὶ ἀπολυθήσεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/037.yaml
  text: And do not judge[a], and you will certainly not be judged; and do not condemn, and you will certainly not be condemned. Forgive, and you will be forgiven.
translation:
  language: tl
  text: Huwag kayong humatol, at hinding-hindi kayo hahatulan; huwag kayong maghatol na may kasalanan ang iba, at hinding-hindi kayo hahatulang may kasalanan. Magpalaya kayo,[a] at palalayain kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Magpatawad kayo, at patatawarin kayo.” Ang pandiwang Griyego ay maaaring mangahulugang “pakawalan” o “palayain,” at sa kontekstong ito ay maaari ring unawaing “magpatawad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνετε
  choice: humatol
  rationale: Ang “humatol” ay tuwiran at likas na katumbas ng κρίνω sa kontekstong ito at pinananatili ang ugnayan sa pasibong “hahatulan.”
- source_word: οὐ μὴ κριθῆτε
  choice: tiyak na hindi kayo hahatulan
  rationale: Ipinahahayag ng “tiyak na hindi” ang mariing pagtanggi ng οὐ μή nang natural sa makabagong Tagalog.
- source_word: καταδικάζετε
  choice: humatol na may sala
  rationale: Ipinakikita nito ang mas matinding diwa ng καταδικάζω—ang magpasiya o magpahayag na may sala—at pinananatili ang pag-igting mula sa pangkalahatang paghatol tungo sa paghatol na salarin.
- source_word: οὐ μὴ καταδικασθῆτε
  choice: tiyak na hindi kayo hahatulang may sala
  rationale: Pinananatili nito kapuwa ang mariing negasyon at ang paralelismo sa naunang sugnay.
- source_word: ἀπολύετε
  choice: magpalaya kayo
  rationale: Ang ἀπολύω ay maaaring mangahulugang pakawalan, palayain, o—ayon sa konteksto—magpatawad. Ang “magpalaya” ay nagpapanatili sa mas malawak na saklaw ng salita.
- source_word: ἀπολυθήσεσθε
  choice: palalayain kayo
  rationale: Pinananatili ng kaparehong pandiwa ang tuwirang tumbasan at reciprocity ng dalawang sugnay.
- source_word: καὶ
  choice: at
  rationale: Ang “at” ay nagpapanatili sa magkakaugnay at paralelong daloy ng mga utos at bunga sa Griyego.
theological_decisions:
- issue: Kung ang ἀπολύετε ay isasalin nang mas makitid bilang “magpatawad” o mas malawak bilang “magpalaya”
  choice: Magpalaya kayo
  alternative: Magpatawad kayo
  rationale: Saklaw ng pandiwa ang pagpapalaya o pagpapawalang-bisa sa pagkakagapos o pananagutan. Pinananatili sa pangunahing teksto ang lawak at tunay na kalabuan ng Griyego, habang inilalagay sa talababa ang kontekstuwal at pamilyar na kahulugang “magpatawad.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang maramihang “kayo” ayon sa anyong Griyego. Iningatan ang paralelismo, ang mariing οὐ μή, at ang pagkakaiba ng κρίνω at καταδικάζω.
