  text: καὶ ἀπελθὼν συνελάλησεν τοῖς ἀρχιερεῦσιν καὶ στρατηγοῖς τὸ πῶς ⸂αὐτοῖς παραδῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/004.yaml
  text: And he went away and discussed with the chief priests and officers how he might hand him over to them[a][b].
translation:
  language: tl
  text: Umalis siya at nakipag-usap sa mga punong pari at mga opisyal[b] kung paano niya maisusuko si Jesus sa kanila[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipagkanulo siya.” Ang pandiwang Griyego ay maaaring mangahulugang “ibigay,” “isuko,” o, sa kontekstong ito, “ipagkanulo.”
    reason: lexical_alternative
  - marker: b
    text: Malamang na mga opisyal na kaugnay ng mga bantay sa templo ang tinutukoy, hindi mga kawal na Romano.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπελθὼν
  choice: Umalis siya
  rationale: Ang aorist participle ay nagpapahiwatig ng kilos na kaugnay at nauna sa pakikipag-usap. Ang tuwirang pariralang ito ay natural sa modernong Tagalog at malinaw ang pagkakasunod ng mga pangyayari.
- source_word: συνελάλησεν
  choice: nakipag-usap
  rationale: Ipinahihiwatig ng pandiwa ang pakikipag-usap o pagsasanggunian. Natural at hindi labis na pormal ang “nakipag-usap,” habang ang konteksto ang nagpapakitang pinagplanuhan nila ang gagawin.
- source_word: ἀρχιερεῦσιν
  choice: mga punong pari
  rationale: Karaniwang tawag ito sa mga pangunahing pinunong makasaserdote, hindi sa maraming kasalukuyang may katungkulan bilang kataas-taasang pari.
- source_word: στρατηγοῖς
  choice: mga pinuno ng mga bantay
  rationale: Sa konteksto ng Jerusalem, tumutukoy ito sa mga opisyal na namamahala sa mga bantay ng templo, hindi sa mga karaniwang opisyal ng hukbong Romano.
- source_word: τὸ πῶς
  choice: kung paano
  rationale: Natural nitong ipinakikilala sa Tagalog ang nilalaman ng kanilang pag-uusap.
- source_word: παραδῷ
  choice: maisusuko
  rationale: Pinananatili nito ang konkretong diwa ng pagbibigay o pagsuko ng isang tao sa kapangyarihan ng iba, nang hindi agad nililimitahan ang pandiwa sa interpretatibong “ipagkanulo.”
- source_word: αὐτοῖς ... αὐτόν
  choice: sa kanila ... si Jesus
  rationale: Nililinaw ng pangalang “Jesus” ang tinutukoy ng panlalaking panghalip na αὐτόν at iniiwasan ang malabong sunod-sunod na panghalip sa Tagalog; ang “sa kanila” ay tumutukoy sa mga punong pari at mga pinuno ng mga bantay.
theological_decisions:
- issue: Paglalarawan sa ginawa ni Judas sa παραδῷ
  choice: maisusuko sa kanila si Jesus
  alternative: maipagkakanulo sa kanila si Jesus
  rationale: Bagaman pagtataksil ang kilos ni Judas sa konteksto, mas malawak ang saklaw ng pandiwang Griyego at maaari itong mangahulugang ibigay o isuko sa kapangyarihan ng iba. Pinananatili ng pangunahing teksto ang mas konkretong diwa, at inilalagay sa talababa ang interpretatibong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nakipag-usap” sa halip na mas pormal na “nakipagsanggunian,” at nilinaw ang layon bilang “si Jesus” upang maiwasan ang kalituhan ng mga panghalip sa Tagalog.
