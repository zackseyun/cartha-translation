  text: καὶ εἶπεν αὐτοῖς· Τί καθεύδετε; ἀναστάντες προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/046.yaml
  text: And he said to them, “Why are you sleeping? Get up and pray, so that you may not enter into temptation.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Bakit kayo natutulog? Bumangon kayo at manalangin upang hindi kayo mapasailalim sa tukso.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθεύδετε
  choice: natutulog
  rationale: Likas at tuwirang katumbas sa modernong Tagalog ng pandiwang tumutukoy sa kanilang kasalukuyang pagtulog.
- source_word: ἀναστάντες
  choice: Bumangon kayo
  rationale: Inihahatid ang utos na tumayo o bumangon mula sa pagkakahiga; natural ito sa konteksto at mas malinaw kaysa sa literal na anyong pandiwari.
- source_word: προσεύχεσθε
  choice: manalangin
  rationale: Karaniwan at marangal na salin para sa pananalangin sa Diyos.
- source_word: εἰσέλθητε εἰς πειρασμόν
  choice: mapasailalim sa tukso
  rationale: Ipinapahayag ang idyomatikong diwa ng pagpasok sa kalagayan o kapangyarihan ng pagsubok o tukso, nang hindi ipinapalagay na ang kahulugan ay basta makaranas lamang nito.
theological_decisions:
- issue: Kahulugan ng πειρασμός
  choice: tukso
  alternative: pagsubok
  rationale: Maaaring mangahulugan ang salita ng pagsubok o tukso. Sa konteksto ng babala at panalangin, pinili ang natural na “tukso,” habang hindi nilulutas kung panlabas na pagsubok o pang-akit sa kasalanan ang pangunahing diin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang pangmaramihang “kayo” upang mapanatili na ang pananalita ay para sa mga alagad.
