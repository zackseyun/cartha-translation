- from: At sinabi niya sa kanila, “Nang isugo ko kayo nang walang lalagyan ng pera, bag na panlakbay,[a] at mga sandalyas, may kinulang ba sa inyo?” Sumagot sila, “Wala.”
  to: At sinabi niya sa kanila, “Nang isugo ko kayo nang walang lalagyan ng pera, bag sa paglalakbay,[a] at mga sandalyas, may kinulang ba kayo?” Sumagot sila, “Wala.”
  rationale: 'Inayos ang tanong upang maging likas na modernong Filipino habang pinananatili ang tuwirang kahulugan ng Griyego: wala bang anumang kinulang sa kanila noong isinugo sila nang walang mga kagamitang nabanggit. Iniayon din ang alternatibong talababa sa binagong pangunahing parirala.'
