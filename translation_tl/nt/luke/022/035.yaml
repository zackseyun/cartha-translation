  text: Καὶ εἶπεν αὐτοῖς· Ὅτε ἀπέστειλα ὑμᾶς ἄτερ βαλλαντίου καὶ πήρας καὶ ὑποδημάτων, μή τινος ὑστερήσατε; οἱ δὲ εἶπαν· Οὐθενός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/035.yaml
  text: And he said to them[a], “When I sent you out without a money bag and a travel bag and sandals, did you lack anything?” And they said, “Nothing.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Nang isugo ko kayo nang walang lalagyan ng pera, bag sa paglalakbay,[a] at mga sandalyas, may kinulang ba kayo?” Sumagot sila, “Wala.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “supot sa paglalakbay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλα
  choice: isugo ko kayo
  rationale: Ipinapahayag ng pandiwang ito ang sadyang pagpapadala sa isang gawain; likas at malinaw sa Filipino ang “isugo ko kayo.”
- source_word: ἄτερ
  choice: nang walang
  rationale: Tuwirang ipinahahayag ang kawalan ng mga kagamitang binanggit at natural itong pakinggan sa pangungusap.
- source_word: βαλλαντίου
  choice: lalagyan ng pera
  rationale: Malinaw na tumutukoy sa sisidlang ginagamit sa pagdadala ng pera, nang hindi ipinahihiwatig ang makabagong kahulugan ng “pitaka” bilang isang maliit at tiyak na uri ng gamit.
- source_word: πήρας
  choice: bag na panlakbay
  rationale: Ang πήρα ay bag na ginagamit sa paglalakbay, lalo na para sa mga baon o panustos; malinaw sa karaniwang mambabasa ang saling ito habang pinananatili ang alternatibong “supot” sa talababa.
- source_word: ὑποδημάτων
  choice: mga sandalyas
  rationale: Ang “mga sandalyas” ang angkop sa kasaysayan at konteksto ng paglalakbay sa mga Ebanghelyo.
- source_word: μή τινος ὑστερήσατε
  choice: may kinulang ba sa inyo?
  rationale: Natural na tanong sa Filipino na pinananatili ang diwa ng pagkukulang o pangangailangan at ang inaasahang negatibong sagot.
- source_word: Οὐθενός
  choice: Wala.
  rationale: Maikli at idyomatikong sagot na tumutugma sa maigsi ring sagot sa Griyego.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang tuwirang anyo ng tanong at ang maikling sagot ng mga alagad. Ang “nang walang” ay ginamit dahil inilalarawan nito ang kalagayan noong pagsusugo.
