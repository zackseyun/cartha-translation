  text: ⸀Σίμων Σίμων, ἰδοὺ ὁ Σατανᾶς ἐξῃτήσατο ὑμᾶς τοῦ σινιάσαι ὡς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/031.yaml
  text: 'Simon, Simon, look: Satan has demanded to have all of you, to sift you like wheat.'
translation:
  language: tl
  text: “Simon, Simon, tingnan mo! Hiniling ni Satanas na mapasakaniya kayong lahat upang salain niya kayo gaya ng trigo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: makinig ka!
  rationale: Isang natural na panawag-pansin sa Tagalog sa konteksto ng tuwirang babala; hindi ito literal na utos na tumingin.
- source_word: ἐξῃτήσατο
  choice: Hiningi
  rationale: Ipinahihiwatig ng anyong Griyego ang mariing paghingi para mapasailalim sa pagsubok, nang hindi dinaragdagan ang teksto ng tahasang pahintulot o pagmamay-ari.
- source_word: ὑμᾶς
  choice: kayong lahat
  rationale: Maramihan ang panghalip sa Griyego, kaya nililinaw na hindi lamang si Simon ang tinutukoy.
- source_word: τοῦ σινιάσαι
  choice: ay salain
  rationale: Pinananatili ang metapora ng pagsala at ang layunin ng hiling ni Satanas.
- source_word: ὡς τὸν σῖτον
  choice: na gaya ng trigo
  rationale: Direktang pinananatili ang paghahambing sa trigo sa natural na Tagalog.
theological_decisions:
- issue: Kung ang ἐξῃτήσατο ay nangangahulugang humingi lamang o nakakuha na ng pahintulot
  choice: Hiningi
  alternative: Hiningi at ipinagkaloob sa kanya
  rationale: Ang teksto ay nagsasaad ng paghingi ngunit hindi tahasang nagsasabing ipinagkaloob iyon; iniiwasang lutasin ang hindi sinabing detalye.
- issue: Saklaw ng babala ni Jesus
  choice: kayong lahat
  alternative: ikaw
  rationale: Maramihan ang ὑμᾶς, bagaman isahan ang pagtawag kay Simon; pinananatili ang mahalagang pagkakaibang ito.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “makinig ka” bilang kontekstuwal na panawag-pansin at “kayong lahat” upang maipakita ang maramihang panghalip sa orihinal.
