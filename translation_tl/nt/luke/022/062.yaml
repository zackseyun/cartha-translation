lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pag-uugnay sa naunang salaysay nang hindi nagdaragdag ng mas tiyak na temporal na kahulugan.
- source_word: ἐξελθὼν ἔξω
  choice: pagkalabas niya
  rationale: Likas na ipinahahayag sa Tagalog ang kilos na nauna sa pangunahing pandiwa; sapat nang saklaw ng “pagkalabas” ang diwa ng pagpunta sa labas nang hindi inuulit ang “labas.”
- source_word: ἔκλαυσεν
  choice: umiyak siya
  rationale: Karaniwan, malinaw, at marangal na katumbas ng κλαίω sa kontekstong ito.
- source_word: πικρῶς
  choice: nang buong pait
  rationale: Ipinahahayag ang matindi at masaklap na paraan ng pag-iyak, habang nananatiling malapit sa larawang nasa salitang Griyego.
