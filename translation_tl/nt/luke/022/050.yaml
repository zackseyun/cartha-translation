  text: καὶ ἐπάταξεν εἷς τις ἐξ αὐτῶν ⸂τοῦ ἀρχιερέως τὸν δοῦλον⸃ καὶ ἀφεῖλεν ⸂τὸ οὖς αὐτοῦ⸃ τὸ δεξιόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/050.yaml
  text: And one of them struck the high priest’s servant and cut off his right ear[a].
translation:
  language: tl
  text: At sinaktan ng isa sa kanila ang alipin[a] ng punong pari at pinutol ang kanang tainga ng alipin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lingkod.” Ang salitang Griyego na doulos ay maaaring tumukoy sa isang alipin o lingkod, depende sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπάταξεν
  choice: sinaktan
  rationale: Ipinahahayag ng pandiwa ang isang malakas na pananakit o paghampas. Natural sa modernong Filipino ang “sinaktan” at hindi nito idinaragdag sa mismong pandiwa ang sandatang hindi tahasang binanggit dito.
- source_word: εἷς τις ἐξ αὐτῶν
  choice: isa sa kanila
  rationale: Likas na katumbas ito sa Filipino ng di-tiyak na pagtukoy sa isang taong kabilang sa pangkat, habang pinananatili ang hindi pagpapangalan sa kaniya.
- source_word: τοῦ ἀρχιερέως τὸν δοῦλον
  choice: ang alipin ng punong pari
  rationale: Ang δοῦλος ay literal na katawagang panlipunan para sa taong nasa kalagayan ng pagkaalipin. Mas tuwiran itong naihahayag ng “alipin” kaysa sa mas malawak na “lingkod.”
- source_word: ἀφεῖλεν
  choice: tinagpas
  rationale: Sa konteksto ng pinsala sa tainga, malinaw at natural na ipinahahayag ng “tinagpas” ang ganap na pagkaputol, hindi lamang ang pag-aalis.
- source_word: τὸ οὖς αὐτοῦ τὸ δεξιόν
  choice: ang kanang tainga nito
  rationale: Pinananatili nito ang tiyak na bahaging nasugatan at ang detalyeng ito ang kanang tainga. Ang “nito” ay natural na tumutukoy sa alipin at umiiwas sa kalituhan ng kasarian.
theological_decisions:
- issue: Pagbibigay-kahulugan sa δοῦλος
  choice: alipin
  alternative: lingkod
  rationale: Ginamit ang salita sa literal na kalagayang panlipunan. Pinananatili ng “alipin” ang mas matinding diwa ng pagkabonded, habang inilalagay sa talababa ang posibleng mas malawak na saling “lingkod” upang hindi itago ang saklaw ng salitang Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “punong pari,” ang karaniwang katawagan sa Filipino para sa ἀρχιερεύς, at iniwasan ang mga salitang lipas o labis na teknikal.
