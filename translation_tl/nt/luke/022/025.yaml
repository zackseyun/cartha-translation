  source_fidelity: 'Tumpak ang pangunahing diwa: ang mga hari ay nangingibabaw sa mga Hentil, at ang mga may awtoridad sa kanila ay tinatawag sa isang marangal na titulo. Gayunman, ang “nagpapakapanginoon” ay maaaring mangahulugang nagkukunwaring panginoon o kusang nag-aangking panginoon, samantalang ang κυριεύουσιν ay tumutukoy sa aktuwal na mapangibabaw na paghahari.'
  naturalness: Makabago at malinaw sa kabuuan, ngunit mas natural at tiyak sa Filipino ang “nangingibabaw sa kanila” para sa mapangibabaw na puwersa ng pandiwa. Ang “mga may kapangyarihan sa kanila” ay mas idiomatiko kaysa “mga gumagamit ng kapangyarihan sa kanila,” habang pinananatili ang kahulugang ng ἐξουσιάζοντες.
  terminology: Ang “mga Hentil” ay katanggap-tanggap sa konteksto at ang talababa ay wastong nag-iingat ng alternatibong “mga bansa.” Ang “Mga Tagapagkaloob ng Kabutihan” ay maaaring panatilihin bilang salin ng isang pampublikong marangal na titulo; ipinaliliwanag ito nang sapat ng talababa.
