  text: ὁ δὲ εἶπεν αὐτοῖς· Οἱ βασιλεῖς τῶν ἐθνῶν κυριεύουσιν αὐτῶν καὶ οἱ ἐξουσιάζοντες αὐτῶν εὐεργέται καλοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/025.yaml
  text: But he said to them[a], “The kings of the Gentiles lord it over them[b], and those exercising authority over them are called benefactors.”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanila, “Ang mga hari ng mga Hentil[a] ay nangingibabaw sa kanila, at ang mga may kapangyarihan sa kanila ay tinatawag na ‘Mga Tagapagkaloob ng Kabutihan.’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bansa.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Mga Tagapagkaloob ng Kabutihan” ay isang marangal na titulong ginagamit noon para sa mga pinuno o makapangyarihang tagatangkilik na kinikilalang gumagawa ng kabutihan para sa madla.
    reason: cultural_note
lexical_decisions:
- source_word: βασιλεῖς
  choice: mga hari
  rationale: Tiyak na tumutukoy ang pangngalan sa mga hari, kaya pinanatili ang mas espesipikong katawagang pampolitika sa halip na ang pangkalahatang ‘mga pinuno.’
- source_word: τῶν ἐθνῶν
  choice: ng mga Hentil
  rationale: Sa konteksto ng Lucas–Mga Gawa, karaniwang tumutukoy ang ἔθνη sa mga bayang hindi Judio. Gayunman, tunay na posibleng leksikal ang ‘mga bansa,’ kaya inilagay iyon sa talababa.
- source_word: κυριεύουσιν
  choice: nagpapakapanginoon
  rationale: Ipinahihiwatig nito ang aktibong pag-iral bilang panginoon sa iba at ang mapangibabaw na paggamit ng pamumuno, na mahalaga sa paghahambing ni Jesus.
- source_word: ἐξουσιάζοντες
  choice: mga gumagamit ng kapangyarihan
  rationale: Berbal ang salin upang mapanatili ang diwa ng aktuwal na paggamit ng kapangyarihan, hindi lamang ang pagkakaroon ng isang katungkulan.
- source_word: εὐεργέται
  choice: Mga Tagapagkaloob ng Kabutihan
  rationale: Isinalin ito bilang isang marangal na titulo para sa mga pinuno o makapangyarihang tagatangkilik na itinuturing na gumagawa ng kabutihan para sa madla; nakatutulong ang malaking titik at panipi upang ipakitang titulo ito.
- source_word: καλοῦνται
  choice: tinatawag na
  rationale: Tuwirang pinananatili ng balintiyak na parirala ang diwa ng katawagang ibinibigay sa gayong mga pinuno.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ng δέ ang banayad na pagsalungat ng tugon ni Jesus sa pagtatalo ng mga alagad sa naunang konteksto.
theological_decisions:
- issue: Kahulugan ng ἐθνῶν sa konteksto
  choice: mga Hentil
  alternative: mga bansa
  rationale: Malamang na inihahambing ng kasabihan ang paraan ng pamumuno ng mga di-Judio sa huwarang ibinibigay ni Jesus sa kanyang mga alagad. Pinananatili sa talababa ang mas malawak na posibleng kahulugang ‘mga bansa’ nang hindi nilulutas nang labis ang leksikal na saklaw.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang ‘nagpapakapanginoon’ ay maikli ngunit may negatibong puwersang angkop sa konteksto; ang panipi at malaking titik sa titulo ay tumutulong sa karaniwang mambabasa na makitang hindi lamang ito pangkalahatang paglalarawan.
