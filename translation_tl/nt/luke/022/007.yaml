  text: Then the day of Unleavened Bread came[a], on which the Passover had to be sacrificed.
translation:
  language: tl
  text: Sumapit na ang araw ng Tinapay na Walang Pampaalsa, kung kailan kailangang ihandog bilang hain ang Paskuwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang korderong pampaskuwa” o “ang handog na pampaskuwa.” Ang salitang Griyego ay maaaring tumukoy sa pagdiriwang ng Paskuwa o, gaya sa kontekstong ito, sa mismong hayop o handog na inihahain.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦλθεν
  choice: Sumapit
  rationale: Ang ἔρχομαι ay ginagamit dito para sa pagdating ng isang takdang araw. Likas sa modernong Tagalog ang “sumapit” para sa pagdating ng panahon o araw.
- source_word: δὲ
  choice: na
  rationale: Nagsasaad ang δέ ng pagsulong ng salaysay. Sa pangungusap na ito, natural na naipahihiwatig ng “na” ang pagdating sa kasunod na takdang yugto nang hindi mabigat ang pagkakaugnay.
- source_word: ἡ ἡμέρα τῶν ἀζύμων
  choice: ang araw ng Tinapay na Walang Pampaalsa
  rationale: Pinananatili ang isahang “araw” ng Griyego at ang kinikilalang pangalan ng pagdiriwang, nang hindi idinaragdag sa pangunahing teksto ang salitang “pista.”
- source_word: ᾗ
  choice: kung kailan
  rationale: Tumutukoy ang panghalip na ito sa araw at may temporal na diwa. Ang “kung kailan” ay malinaw at likas sa Tagalog.
- source_word: ἔδει
  choice: kailangang
  rationale: Ipinahahayag nito ang impersonal na pangangailangan o itinakdang obligasyon na kaugnay ng kalendaryo ng pagdiriwang.
- source_word: θύεσθαι
  choice: ihandog
  rationale: Sa kontekstong ritwal, tumutukoy ang θύω sa pagkatay bilang hain. Naipahahayag ng “ihandog” ang sakripisyal na diwa sa malinaw at dignidad na Tagalog, bagaman hindi nito labis na itinatampok ang mismong pagkatay.
- source_word: τὸ πάσχα
  choice: ang Paskuwa
  rationale: Maaaring tumukoy ang πάσχα sa pagdiriwang, pagkain, o handog ng Paskuwa. Pinananatili ng “Paskuwa” ang lawak ng termino, samantalang ipinahihiwatig ng pandiwang “ihandog” ang tiyak na kahulugan nito sa konteksto.
theological_decisions:
- issue: Ang tinutukoy ng τὸ πάσχα sa konteksto ng paghahandog
  choice: “ang Paskuwa” sa pangunahing teksto, na ang sakripisyal na diwa ay ipinahihiwatig ng “ihandog”
  alternative: “ang korderong pampaskuwa” o “ang handog na pampaskuwa”
  rationale: Mas malawak ang salitang Griyego kaysa sa “kordero” at maaari ring tumukoy sa pagdiriwang. Dahil malinaw na sakripisyal ang pandiwa, maaaring manatiling malapit sa anyo ng pinagmulan ang pangunahing teksto habang inilalahad sa talababa ang mas tiyak na mga pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignidad, at madaling maunawaan. Ginamit ang “sumapit” bilang likas na pananalita para sa pagdating ng isang takdang araw; iniwasan ang teknikal o denominasyonal na pagpapaliwanag sa pangunahing teksto.
