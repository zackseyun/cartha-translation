  source_fidelity: Tama ang pangunahing pagtukoy sa pagdating ng isang araw ng Kapistahan ng Tinapay na Walang Pampaalsa at sa kinakailangang ritwal na kaugnay ng Paskuwa. Gayunman, ang "ihandog ang Paskuwa" ay maaaring maunawaang paghahandog ng kapistahan mismo at hindi sapat na naihahayag ang sakripisyal na puwersa ng θύεσθαι. Ang "bilang hain" ay ligtas na magpapalinaw sa ritwal na diwa nang hindi ipinipilit na "kordero" ang saklaw ng τὸ πάσχα.
  naturalness: Likas at malinaw ang "Sumapit na ang araw" at "kung kailan." Ang "Tinapay na Walang Pampaalsa" ay nauunawaan at angkop bilang pangalan ng pagdiriwang. Mas natural at mas malinaw sa kontekstong ito ang "ihandog bilang hain" kaysa "ihandog" lamang.
