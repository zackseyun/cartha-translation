  yaml_path: translation/nt/luke/022/021.yaml
  text: But look, the hand of the one betraying me is with me on the table.
translation:
  language: tl
  text: 'Ngunit tingnan ninyo: ang kamay ng nagkakanulo sa akin ay kasama ko sa mesa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Ngunit
  rationale: Ipinapakita ang matinding pagsalungat sa naunang pahayag, nang hindi nagdaragdag ng paliwanag.
- source_word: ἰδοὺ
  choice: tingnan ninyo
  rationale: Natural na panawag-pansin sa modernong Tagalog; pinananatili ang lakas ng utos sa anyong pangmaramihan na angkop sa kausap na pangkat.
- source_word: τοῦ παραδιδόντος με
  choice: ng magkakanulo sa akin
  rationale: Ang participle ay tumutukoy sa taong naghahatid o nagsasalin kay Jesus sa mga kaaway; ang hinaharap na anyo ay natural sa Tagalog sa puntong ito ng salaysay.
- source_word: μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης
  choice: ay kasama ng kamay ko sa ibabaw ng mesa
  rationale: Nililinaw ang ipinahihiwatig na paghahambing ng dalawang kamay habang pinananatili ang kongkretong larawan ng sabayang pakikibahagi sa mesa.
theological_decisions:
- issue: Kung tahasang pangalanan ang nagkakanulo
  choice: 'Panatilihing hindi pinangalanan: “ang magkakanulo sa akin”'
  alternative: Pangalanan si Judas
  rationale: Hindi pinapangalanan ng mismong talata ang tao; pinananatili nito ang retorikal na tensiyon at saklaw ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mesa” sa halip na mas lumang “dulang,” at iniwasan ang arkaikong “narito” bilang katumbas ng panawag-pansing ἰδοὺ.
