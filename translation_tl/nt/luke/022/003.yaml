id: LUK.22.3
reference: Luke 22:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εἰσῆλθεν δὲ Σατανᾶς εἰς Ἰούδαν τὸν ⸀καλούμενον Ἰσκαριώτην, ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/003.yaml
  text: Then Satan entered into Judas[a], the one called Iscariot[c][b], who was of the number of the twelve.
translation:
  language: tl
  text: Pagkatapos, pumasok si Satanas kay Judas, na tinatawag na Iscariote, na kabilang sa bilang ng labindalawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na isa sa labindalawa.” Sa literal, “na kabilang sa bilang ng labindalawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν δὲ
  choice: Pagkatapos, pumasok
  rationale: Ipinahihiwatig ng δέ ang pagsulong ng salaysay, at natural itong naipapahayag ng “Pagkatapos.” Pinananatili ng “pumasok” ang tuwirang lakas ng aorist na εἰσῆλθεν.
- source_word: Σατανᾶς
  choice: Satanas
  rationale: Ito ang kinagawiang transliterasyon sa Filipino ng personal na pangalan o titulong ginamit sa Bagong Tipan.
- source_word: εἰς Ἰούδαν
  choice: kay Judas
  rationale: Sa Filipino, likas na ginagamit ang “pumasok kay” kapag ang pinapasok ay isang tao. Nananatili rito ang diwa ng εἰς nang hindi pinapahina bilang impluwensiya lamang.
- source_word: τὸν καλούμενον Ἰσκαριώτην
  choice: na tinatawag na Iscariote
  rationale: Natural na panuring ito sa Filipino at malinaw na kinikilala kung aling Judas ang tinutukoy.
- source_word: ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα
  choice: na kabilang sa bilang ng labindalawa
  rationale: Pinananatili ng “kabilang sa bilang” ang pormal na larawan ng ἐκ τοῦ ἀριθμοῦ, sa halip na agad itong gawing payak na “isa sa.”
theological_decisions:
- issue: Ang uri ng pagkilos ni Satanas kay Judas
  choice: Isinalin nang tuwiran bilang “pumasok si Satanas kay Judas.”
  alternative: “Inimpluwensiyahan ni Satanas si Judas” o “sinakop ni Satanas si Judas.”
  rationale: Malinaw na gumagamit ang Griyego ng εἰσῆλθεν ... εἰς, kaya hindi dapat pahinain bilang impluwensiya lamang o dagdagan ng tiyak na paliwanag tungkol sa pagsapi. Pinananatili ang tensiyon sa pagitan ng pagkilos ni Satanas at pananagutan ni Judas.
- issue: Pagkilala sa pangkat ng labindalawa
  choice: Ginamit ang maliit na titik sa “labindalawa.”
  alternative: “Labindalawa” bilang estilistikong pantanging tawag sa kinikilalang pangkat ng mga apostol.
  rationale: Walang pagkakaiba ng ganitong kapitalisasyon sa sinaunang Griyegong teksto. Nauunawaan sa konteksto ang tinutukoy na pangkat nang hindi nagdaragdag ng interpretibong kapitalisasyon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Iscariote,” ang nakagawiang anyo sa Bibliyang Filipino, at iniwasan ang mga terminong nagtatakda ng isang partikular na paliwanag sa demonolohiya.
