translation:
  language: tl
  text: At natuwa sila at sumang-ayon silang bigyan siya ng salapi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “pilak.” Ang salitang Griyego ay maaaring tumukoy nang literal sa pilak o, sa mas pangkalahatang diwa, sa salapi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρησαν
  choice: natuwa sila
  rationale: Ipinahahayag ng aorist ng χαίρω ang kanilang masayang tugon. Ang “natuwa” ay natural sa makabagong Filipino at malinaw na naghahatid ng kanilang kasiyahan nang hindi labis na pinatitindi ito.
- source_word: συνέθεντο
  choice: sumang-ayon
  rationale: Sa kontekstong ito, ang gitnang anyo ng συντίθημι ay tumutukoy sa pagbuo ng kasunduan. Ang “sumang-ayon” ay maikli, natural, at hindi nagdaragdag ng di-tiyak na ideya ng isang pormal na pangako.
- source_word: αὐτῷ
  choice: siya
  rationale: Ang panghalip na datibo ang di-tuwirang layon ng δοῦναι. Natural sa Filipino ang “bigyan siya,” na malinaw na naghahatid ng kahulugang ibigay sa kaniya.
- source_word: ἀργύριον
  choice: salapi
  rationale: Bagaman literal na maaaring tumukoy ang ἀργύριον sa pilak, karaniwan itong nangangahulugang salapi sa konteksto ng transaksiyon. Ang “salapi” ay dignificado at madaling maunawaan; pinananatili sa talababa ang literal na alternatibong “pilak.”
- source_word: δοῦναι
  choice: bigyan
  rationale: Ang infinitive ay nagsasaad ng nilalaman ng kanilang kasunduan. Ang “bigyan” ang natural na katumbas dito at hindi kasing-interpretatibo ng “bayaran.”
theological_decisions: []
translation_notes:
  register: Makabago, natural, at dignipikadong Filipino. Pinili ang “natuwa” sa halip na mas matinding “nagdiwang,” at ang “salapi” sa halip na kolokyal na “pera,” habang pinananatili sa talababa ang literal na kahulugang “pilak.”
