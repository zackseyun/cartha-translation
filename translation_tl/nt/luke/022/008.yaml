  text: καὶ ἀπέστειλεν Πέτρον καὶ Ἰωάννην εἰπών· Πορευθέντες ἑτοιμάσατε ἡμῖν τὸ πάσχα ἵνα φάγωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/008.yaml
  text: And he sent Peter and John[a], saying, “Go and prepare the Passover for us, so that we may eat it.”
translation:
  language: tl
  text: At isinugo niya sina Pedro at Juan at sinabi, “Pumunta kayo at ihanda ninyo para sa atin ang Paskuwa[a], upang kainin natin ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang handaan ng Paskuwa.” Maaaring tumukoy ang salitang Griyego sa Paskuwa nang mas malawakan, bagaman ipinahihiwatig dito ng paghahanda at pagkain ang handaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: isinugo
  rationale: Tuwirang ipinahahayag nito ang pagpapadala kina Pedro at Juan para sa isang tiyak na gawain. Dignified ito ngunit karaniwan pa ring nauunawaan sa salaysay ng Bibliya.
- source_word: εἰπών
  choice: at sinabi
  rationale: Bagaman participle ang anyong Griyego, ang koordinasyong “at sinabi” ay mas natural sa modernong Tagalog at malinaw na nag-uugnay sa utos sa pagsusugo.
- source_word: Πορευθέντες
  choice: Pumunta kayo
  rationale: Sa kontekstong ito, ang participle ay may lakas ng paunang utos. Likas na ipinapahayag iyon ng “Pumunta kayo” nang hindi gumagamit ng matigas na literal na anyo.
- source_word: ἑτοιμάσατε
  choice: ihanda ninyo
  rationale: Malinaw nitong ipinahahayag ang praktikal na paghahanda at pinananatili ang pangmaramihang utos sa dalawang alagad.
- source_word: ἡμῖν
  choice: para sa atin
  rationale: Ipinapakita nito ang datibong pakinabang nang hindi idinaragdag ang di-hayag na diin na “para sa ating lahat.”
- source_word: τὸ πάσχα
  choice: ang Paskuwa
  rationale: Pinananatili ng “Paskuwa” ang lawak ng terminong Griyego, na maaaring tumukoy sa kapistahan o, sa kontekstong ito, sa handaan nito, nang hindi ito labis na nililimitahan.
- source_word: ἵνα φάγωμεν
  choice: upang makain natin ito
  rationale: Malinaw na ipinahahayag ng “upang” ang layunin, at ang “ito” ay likas na tumutukoy sa Paskuwa bilang kakainin sa konteksto.
theological_decisions:
- issue: Tinutukoy ng “Paskuwa”
  choice: Isinalin bilang “ang Paskuwa” nang hindi nililimitahan sa handaan o kordero lamang.
  alternative: ang handaan ng Paskuwa; ang kordero ng Paskuwa
  rationale: Malakas na ipinahihiwatig ng paghahanda at pagkain ang handaan, ngunit mas malawak ang maaaring saklaw ng πάσχα. Pinananatili ng salin ang tunay na lawak ng salita habang nililinaw ito ng konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “Pumunta kayo” sa halip na mas makalumang “Humayo kayo,” at pinanatili ang terminong “Paskuwa” upang hindi paliitin ang saklaw ng orihinal.
