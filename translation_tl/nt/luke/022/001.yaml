  yaml_path: translation/nt/luke/022/001.yaml
  text: The Feast of Unleavened Bread[a], which is called Passover, was drawing near.
translation:
  language: tl
  text: Papalapit na ang Pista ng Tinapay na Walang Pampaalsa[a], na tinatawag na Paskuwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Magkaugnay nang malapit ang Paskuwa at ang Pista ng Tinapay na Walang Pampaalsa. Sa paggamit ng mga Judio, maaari silang tukuyin nang magkasama o gamitin ang mga pangalang ito nang may magkakapatong na saklaw.
    reason: cultural_note
lexical_decisions:
- source_word: Ἤγγιζεν
  choice: Papalapit na
  rationale: Ipinahihiwatig ng imperpektong anyo ang patuloy na paglapit ng kapistahan; natural ito sa makabagong Tagalog at malinaw ang nalalapit na panahon.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang panandang pandiskurso ito rito. Hindi kailangan ang isang panimulang salita sa Tagalog, sapagkat maayos na naipapakita ng konteksto ang pag-usad ng salaysay.
- source_word: ἡ ἑορτὴ τῶν ἀζύμων
  choice: ang Pista ng Tinapay na Walang Pampaalsa
  rationale: Tumutukoy ang parirala sa kilalang kapistahang Judio. Ang 'Pista' ay natural at marangal, at malinaw na ipinapahayag ng 'Tinapay na Walang Pampaalsa' ang kahulugan ng ἀζύμων.
- source_word: ἡ λεγομένη
  choice: na tinatawag na
  rationale: Pinananatili nito ang paliwanag ng tagapagsalaysay na ang kapistahan ay tinutukoy rin sa isa pang pangalan.
- source_word: Πάσχα
  choice: Paskuwa
  rationale: Ang 'Paskuwa' ay isang nakikilalang katawagang Filipino para sa kapistahang Judio at iniiwasang ipagkamali ito sa Kristiyanong Pasko.
theological_decisions:
- issue: Ugnayan ng Pista ng Tinapay na Walang Pampaalsa at Paskuwa
  choice: 'Pinanatili ang pagkakakilanlan sa pagkakasabi ni Lucas: ''na tinatawag na Paskuwa.'''
  alternative: Iharap ang Paskuwa at ang Pista ng Tinapay na Walang Pampaalsa bilang mahigpit na magkahiwalay na mga pagdiriwang.
  rationale: Tahasang iniuugnay ng Griyegong pangungusap ang dalawang katawagan. Hindi pinipilit ng salin ang isang teknikal na pagkakaiba o pagkakasundo na higit sa sinasabi ng teksto; ipinapaliwanag ng talababa ang magkasanib at nagkakapatong na gamit ng mga pangalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang pariralang 'Papalapit na' at pinanatili ang pormal ngunit madaling maunawaang mga pangalan ng kapistahan.
