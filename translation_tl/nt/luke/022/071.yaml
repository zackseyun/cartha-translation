base_translation:
  language: en
  yaml_path: translation/nt/luke/022/071.yaml
  text: Then they said[a], “Why do we still need testimony? For we ourselves have heard it from his own mouth.”
translation:
  language: tl
  text: At sinabi nila[a], “Bakit kailangan pa namin ng patotoo? Kami mismo ang nakarinig mula sa kanyang sariling bibig.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At sinabi nila, ‘Ano pang pangangailangan namin sa patotoo?’”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: At sinabi nila
  rationale: Ang δέ ay banayad na pang-ugnay na nagpapatuloy sa salaysay; natural sa Tagalog ang “At” nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: Τί ἔτι ἔχομεν μαρτυρίας χρείαν
  choice: Bakit kailangan pa natin ng patotoo?
  rationale: Natural na retorikal na tanong sa modernong Tagalog ang “Bakit kailangan pa natin...?”; ipinahahayag ng “pa” ang ἔτι, at ang “patotoo” ay angkop sa kontekstong panghukuman.
- source_word: αὐτοὶ γὰρ ἠκούσαμεν
  choice: Tayo mismo ang nakarinig
  rationale: Pinananatili ng “tayo mismo” ang diin ng αὐτοί. Hindi kailangang isalin nang lantad ang γάρ dahil malinaw sa pagkakasunod ng dalawang pangungusap na ang ikalawa ang dahilan ng una.
- source_word: ἀπὸ τοῦ στόματος αὐτοῦ
  choice: mula sa sarili niyang bibig
  rationale: Pinananatili nito ang konkretong idyoma at ang diin na tuwirang sa sinabi ni Jesus nila ito narinig.
theological_decisions:
- issue: Kung tutukuyin nang tahasan kung ano ang narinig nila
  choice: Walang idinagdag na layon pagkatapos ng “nakarinig”
  alternative: narinig natin ang patotoo / ang pahayag niya
  rationale: Walang tahasang layon ang ἠκούσαμεν sa Griyego. Ang pagdaragdag ng “patotoo” o “pahayag” ay magpapakahulugan sa bagay na narinig at mag-aalis sa sinadyang kaiklian ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patotoo” para sa legal na himig, at pinanatili ang retorikal na puwersa at maikling anyo ng orihinal.
