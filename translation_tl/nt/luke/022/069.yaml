review_pass:
  verdict: revise
  source_fidelity: 'Ang “luluklok” ay mas tiyak kaysa sa Griyegong καθήμενος (“nakaupo/uupo”): tahasan nitong idinaragdag ang pagluklok o pag-upo sa trono. Bagaman naririnig sa parirala ang larawan ng maharlikang pagdakila, mas tapat na panatilihin ang payak na pandiwang “uupo.” Napananatili ng “mula ngayon,” “Ngunit,” “Anak ng Tao,” at “sa kanan ng kapangyarihan ng Diyos” ang kahulugan at mga alusyon ng pinagmulan.'
  naturalness: Natural at marangal sa makabagong Filipino ang “Ngunit mula ngayon, ang Anak ng Tao ay uupo sa kanan ng kapangyarihan ng Diyos.” Malinaw rin ang talababa; ang “O kaya” ay mas ganap na karaniwang panandang alternatibong salin kaysa sa payak na “O.”
  terminology: Ang “Anak ng Tao” ay ang wastong nakaugaliang salin ng titulo. Ang “kapangyarihan ng Diyos” ay malapit sa τῆς δυνάμεως τοῦ θεοῦ at hindi ipinapalit ang “Kapangyarihan” sa pangunahing teksto. Ang alternatibong “Kapangyarihan” sa talababa ay angkop upang ipakita ang posibleng mapitagang pantukoy.
  issues:
