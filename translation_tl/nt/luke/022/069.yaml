base_translation:
  language: en
  yaml_path: translation/nt/luke/022/069.yaml
  text: But from now on the Son of Man will be seated at the right hand of the power of God[a].
translation:
  language: tl
  text: Ngunit mula ngayon, ang Anak ng Tao ay uupo sa kanan ng kapangyarihan ng Diyos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “sa kanan ng Kapangyarihan,” isang mapitagang paraan ng pagtukoy sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: mula ngayon
  rationale: Likas na makabagong Filipino para sa panandang temporal na nagsasaad ng puntong mula rito ay iiral ang sinasabi.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinapakita ang pagsalungat o matinding pagliko sa tugon ni Jesus ayon sa konteksto.
- source_word: ἔσται ... καθήμενος
  choice: ay luluklok
  rationale: Pinagsamang likas na salin ng future periphrastic construction; ipinahahayag ang darating na kalagayan ng pag-upo sa trono at pinananatili ang maharlika at awtoritatibong larawan.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang nakaugaliang titulo ni Jesus at ang mga alusyon at tunay na lawak ng kahulugan nito.
- source_word: ἐκ δεξιῶν
  choice: sa kanan
  rationale: Pinananatili ang biblikal na idyoma para sa lugar ng pinakamataas na karangalan at awtoridad nang hindi ito labis na ipinapaliwanag.
- source_word: τῆς δυνάμεως τοῦ θεοῦ
  choice: ng kapangyarihan ng Diyos
  rationale: Malapit sa kayarian ng Griyego at malinaw na tinutukoy kung kaninong kapangyarihan ito, habang hindi ginagawang pang-uri ang pangngalang δύναμις.
theological_decisions:
- issue: Pormula ng pagdakila at pag-angkin ng banal na awtoridad
  choice: ang Anak ng Tao ay luluklok sa kanan ng kapangyarihan ng Diyos
  alternative: ang Anak ng Tao ay luluklok sa kanan ng Kapangyarihan
  rationale: Pinananatili ng pangunahing salin ang tahasang τοῦ θεοῦ at ang mga alusyon sa Awit 110 at Daniel 7. Hindi nito pinahihina o pinalalabis ang pag-angkin ng pagdakila at awtoridad. Inilalagay sa talababa ang posibleng pag-unawa sa “Kapangyarihan” bilang mapitagang pantukoy sa Diyos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “luluklok” sa halip na karaniwang “uupo” upang maipahiwatig ang konteksto ng paghahari nang hindi idinaragdag ang salitang “trono.”
