    issue: Ang “luluklok” ay higit na espesipiko kaysa sa “uupo/nakaupo.”
    rationale: Ang καθήμενος ay tumutukoy sa pagkakaupo; ang “luluklok” ay maaaring magpahiwatig ng aktuwal na paghirang o pag-akyat sa trono. Kahit may kontekstong paghahari ang idyoma, hindi kailangang idagdag iyon sa pandiwa.
  revised_text: Ngunit mula ngayon, ang Anak ng Tao ay uupo sa kanan ng kapangyarihan ng Diyos[a].
