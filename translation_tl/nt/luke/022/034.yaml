id: LUK.22.34
reference: Luke 22:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Λέγω σοι, Πέτρε, οὐ ⸀φωνήσει σήμερον ἀλέκτωρ ⸀ἕως τρίς ⸂με ἀπαρνήσῃ εἰδέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/034.yaml
  text: But he said[a], “I tell you, Peter, a rooster will not crow today until you deny three times that you know me.”
translation:
  language: tl
  text: Ngunit sinabi niya, “Sinasabi ko sa iyo, Pedro, hindi titilaok ang tandang ngayong araw hanggang sa tatlong beses mong ikaila na kilala mo ako.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Hindi titilaok ang tandang ngayong araw bago mo tatlong beses ikaila na kilala mo ako.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Ngunit sinabi niya
  rationale: Ang δέ ay bahagyang nagpapakita ng pagsalungat sa naunang sinabi ni Pedro; natural at malinaw dito ang “Ngunit.”
- source_word: Λέγω σοι
  choice: Sinasabi ko sa iyo
  rationale: Pinananatili nito ang tuwirang pormula at ang puwersa ng pangkasalukuyang λέγω sa dignidad na likas sa modernong Tagalog.
- source_word: Πέτρε
  choice: Pedro
  rationale: Ginamit ang nakaugaliang anyo ng pangalang Peter sa Tagalog.
- source_word: οὐ φωνήσει ... ἀλέκτωρ
  choice: hindi titilaok ang tandang
  rationale: Kapag ἀλέκτωρ ang simuno, ang φωνέω ay tumutukoy sa pagtilaok; ang “tandang” ang natural na modernong katawagan.
- source_word: σήμερον
  choice: ngayong araw
  rationale: Tuwirang ipinapahayag ang panahong tinutukoy at maayos na umaangkop sa ayos ng pangungusap.
- source_word: ἕως
  choice: hanggang sa
  rationale: 'Pinananatili ang temporal na hangganan ng negadong kilos: hindi titilaok ang tandang hanggang maganap ang ipinahayag na pagkakaila.'
- source_word: τρίς
  choice: tatlong beses
  rationale: Karaniwan at malinaw na katumbas sa modernong Tagalog.
- source_word: με ἀπαρνήσῃ εἰδέναι
  choice: tatlong beses mong ikaila na kilala mo ako
  rationale: 'Ipinananatili ang εἰδέναι bilang nilalaman ng pagkakaila: ikakaila ni Pedro na kilala niya si Jesus, hindi lamang basta itatatwa ang kaugnayan niya rito.'
theological_decisions:
- issue: Likas ng inihulang pagkakaila ni Pedro
  choice: “tatlong beses mong ikaila na kilala mo ako”
  alternative: “tatlong beses mo akong ikaila”
  rationale: Hayagang kasama sa Griyego ang εἰδέναι (“makilala/alam na kilala”), kaya hindi ito inalis o pinalawak tungo sa mas pangkalahatang pagtatatwa sa katapatan kay Jesus.
- issue: Temporal na ugnayan ng pagtilaok at tatlong pagkakaila
  choice: “hindi titilaok ... hanggang sa”
  alternative: “hindi titilaok ... bago mo”
  rationale: Kapuwa maaaring ipahayag ang temporal na ugnayan, ngunit mas malapit sa karaniwang puwersa at kayarian ng ἕως ang “hanggang sa,” nang hindi pinapawi ang bahagyang pagkakaiba ng posibleng pagbibigay-diin.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “titilaok” bilang tiyak at likas na pandiwa para sa tandang, at pinanatili ang tahasang nilalaman ng pagkakaila.
