  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἐδεήθην περὶ σοῦ ἵνα μὴ ἐκλίπῃ ἡ πίστις σου· καὶ σύ ποτε ἐπιστρέψας ⸀στήρισον τοὺς ἀδελφούς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/032.yaml
  text: But I have prayed for you[a], that your faith may not fail; and you, when you have turned back[b], strengthen your brothers.
translation:
  language: tl
  text: Ngunit nanalangin ako para sa iyo, upang hindi bumigay ang pananampalataya mo.[a] At ikaw, kapag nakabalik ka na,[b] patatagin mo ang mga kapatid mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang pagtitiwala mo” o “ang katapatan mo.” Magkakaugnay ang mga diwang ito sa salitang Griyego.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “kapag nanumbalik ka na” o “kapag muli kang bumaling.” Ipinahihiwatig ng pananalita ang panunumbalik ni Pedro matapos ang darating niyang pagkabigo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθην
  choice: nanalangin ako
  rationale: Ipinahahayag ng pandiwa ang taimtim na paghiling sa Diyos. Likas sa Filipino ang aspektong perpektibo na “nanalangin” para sa natapos na gawaing may kaugnayan sa kasalukuyang sinabi ni Jesus.
- source_word: περὶ σοῦ
  choice: para sa iyo
  rationale: Kasama ng pandiwa ng pananalangin, ang περί na may genitive ay tumutukoy sa taong ipinapanalangin; “para sa iyo” ang likas na katumbas sa Filipino.
- source_word: ἵνα μὴ ἐκλίπῃ
  choice: upang hindi bumigay
  rationale: Ang ἐκλείπω ay maaaring mangahulugang mabigo, maubos, o tuluyang mawala. Ang “hindi bumigay” ay malinaw at natural sa konteksto ng matinding pagsubok, nang hindi tahasang sinasabing ganap na mawawala ang pananampalataya ni Pedro.
- source_word: πίστις
  choice: pananampalataya
  rationale: Pinananatili nito ang malawak na diwa ng πίστις—paniniwala, pagtitiwala, at katapatan—nang hindi nililimitahan ang salita sa isa lamang sa mga magkakaugnay na kahulugang iyon.
- source_word: ποτε
  choice: kapag
  rationale: Sa kontekstong ito, tumutukoy ang ποτέ sa isang darating na pagkakataon. Natural na iniuugnay ng “kapag” ang pagbabalik ni Pedro sa kasunod na utos.
- source_word: ἐπιστρέψας
  choice: nakabalik ka na
  rationale: Pinananatili ng “nakabalik” ang larawan ng pagbabalik at ang pahiwatig ng panunumbalik pagkatapos ng pagkabigo, nang hindi ipinapasok sa pangunahing teksto ang mas tiyak na salitang “nagsisi.”
- source_word: στήρισον
  choice: patatagin mo
  rationale: Ang utos ay ipagawa kay Pedro na gawing matatag ang iba. Ang “patatagin” ay likas at malinaw para sa espirituwal at pansamahang pagpapatibay.
- source_word: ἀδελφούς
  choice: mga kapatid mo
  rationale: Ang “mga kapatid” ang karaniwang katumbas sa Filipino ng ἀδελφοί. Sa agarang konteksto, tumutukoy ito sa mga lalaking alagad ni Jesus, bagaman hindi minamarkahan ng salitang Filipino ang kasarian.
theological_decisions:
- issue: Magkakaugnay na diwa ng πίστις bilang pananampalataya, pagtitiwala, at katapatan
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Ang “pananampalataya” ang pinakamalawak at pinakapamilyar na katumbas, samantalang inilalahad sa talababa ang mga tunay na posibleng himig ng salitang Griyego.
- issue: Kahulugan ng ἐπιστρέψας kaugnay ng darating na pagkabigo ni Pedro
  choice: kapag nakabalik ka na
  alternative: kapag nanumbalik ka na; kapag nagsisi ka na
  rationale: Ipinahihiwatig ng parirala ang pagbabalik o panunumbalik ni Pedro. Hindi ginamit ang “nagsisi” sa pangunahing teksto sapagkat mas tiyak iyon kaysa sa mismong salitang Griyego.
- issue: Tinutukoy ng ἀδελφούς
  choice: mga kapatid mo
  alternative: mga kapatid mong lalaki; mga kapwa mananampalataya
  rationale: Ang agarang tinutukoy ay ang pangkat ng mga lalaking alagad. Gayunman, “mga kapatid” ang natural at tumpak na anyo sa Filipino at hindi kailangang dagdagan ng tahasang panandang panlalaki.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “bumigay” bilang karaniwang ngunit hindi bulgar na larawan ng hindi pagtitiis sa matinding pagsubok; ginamit naman ang “patatagin” upang mapanatili ang lakas ng utos. Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
