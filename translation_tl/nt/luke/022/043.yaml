id: LUK.22.43
reference: Luke 22:43
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂ὤφθη δὲ αὐτῷ ἄγγελος ⸀ἀπ’ οὐρανοῦ ἐνισχύων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/043.yaml
  text: Then an angel from heaven appeared to him[a], strengthening him.
translation:
  language: tl
  text: Pagkatapos, nagpakita sa kanya ang isang anghel mula sa langit[a] at pinalakas siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi kasama ang mga talata 43–44 sa ilang manuskrito.
    reason: textual_variant
lexical_decisions:
- source_word: ὤφθη
  choice: nagpakita
  rationale: Karaniwang gamit ito bilang pormula ng pagpapakita. Ang “nagpakita” ay likas sa Filipino at hindi inililipat ang diin sa mga nakakita.
- source_word: δὲ
  choice: Pagkatapos
  rationale: Ipinahihiwatig dito ang pagpapatuloy ng salaysay, hindi isang mariing pagsalungat.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Ang datibo kasama ng ὤφθη ay tumutukoy sa taong pinakitaan.
- source_word: ἄγγελος
  choice: isang anghel
  rationale: Dahil mula sa langit ang tinutukoy, “anghel” ang malinaw na kahulugan sa halip na pangkalahatang “mensahero.”
- source_word: ἀπ’ οὐρανοῦ
  choice: mula sa langit
  rationale: Natural na ipinapahayag nito sa Filipino ang pinagmulan ng anghel.
- source_word: ἐνισχύων
  choice: at pinalakas
  rationale: Ang kasalukuyang participle ay nagpapahayag ng kasabay na kilos. Ginagawang sugnay sa Filipino upang maging natural habang pinananatili ang diwang pagbibigay-lakas, hindi lamang pagpapalakas ng loob.
- source_word: αὐτόν
  choice: siya
  rationale: Tuwirang layon na tumutukoy kay Jesus; malinaw ang reperensiya mula sa konteksto.
theological_decisions:
- issue: Katayuang tekstuwal ng Lucas 22:43
  choice: Isinama ang talata sa pangunahing teksto ayon sa ibinigay na SBLGNT.
  alternative: Hindi kasama ang mga talata 43–44 sa ilang manuskrito.
  rationale: Isinasalin ang ibinigay na tekstong Griyego, ngunit inilalahad sa talababa ang mahalagang pagkakaibang tekstuwal sa halip na palampasin o lutasin ito nang tahimik.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “Pagkatapos” para sa daloy ng salaysay at ang “pinalakas” upang mapanatili ang lakas ng ἐνισχύων nang hindi ito nililimitahan sa emosyonal na pagpapalakas ng loob.
source_grounding:
  english_pob_role: consult_only
