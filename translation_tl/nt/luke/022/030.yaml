id: LUK.22.30
reference: Luke 22:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἵνα ⸀ἔσθητε καὶ πίνητε ἐπὶ τῆς τραπέζης μου ⸂ἐν τῇ βασιλείᾳ μου⸃, καὶ ⸀καθήσεσθε ἐπὶ θρόνων ⸂τὰς δώδεκα φυλὰς κρίνοντες⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/030.yaml
  text: so that you may eat and drink at my table in my kingdom[a], and you will sit on thrones judging the twelve tribes of Israel.
translation:
  language: tl
  text: upang kayo'y makakain at makainom sa aking hapag sa aking kaharian, at uupo kayo sa mga trono habang humahatol[a] kayo sa labindalawang lipi ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “namumuno sa” o “namamahala sa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas at malinaw na panandang Filipino para sa layunin o resultang kaugnay ng naunang pangako.
- source_word: ἔσθητε καὶ πίνητε
  choice: makakain at makainom kayo
  rationale: Ipinahahayag ng mga anyong subjunctive sa ilalim ng ἵνα ang layunin; natural itong naihahatid ng mga pandiwang maka- pagkatapos ng “upang.”
- source_word: ἐπὶ τῆς τραπέζης μου
  choice: sa aking hapag
  rationale: Ang “sa aking hapag” ay marangal at natural na paglalarawan ng pakikisalo, nang hindi ginagamit ang literal ngunit di-angkop na “sa ibabaw ng.”
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: sa aking kaharian
  rationale: Ang tagpuan ng piging at mga trono ay umaayon sa diwang nasasakupan ng βασιλεία, habang nananatili rin ang pahiwatig ng paghahari.
- source_word: καθήσεσθε ἐπὶ θρόνων
  choice: uupo kayo sa mga trono
  rationale: Pinananatili ang payak na hinaharap at ang larawan ng pagkakaluklok sa maharlika at hudisyal na kapangyarihan.
- source_word: κρίνοντες
  choice: na humahatol
  rationale: Ang “humahatol” ang tuwirang katumbas ng pandiwang κρίνω at pinananatili ang hudisyal na diwa; ang mas malawak na diwang pamamahala ay inilalagay sa talababa.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: sa labindalawang lipi ng Israel
  rationale: Karaniwan at malinaw na salin na nagpapanatili sa tipanang pagtukoy sa Israel bilang labindalawang lipi.
theological_decisions:
- issue: Ang uri ng magiging tungkulin ng mga alagad kaugnay ng labindalawang lipi ng Israel
  choice: humahatol
  alternative: namamahala
  rationale: Maaaring saklawin ng κρίνω ang hudisyal na paghatol at ang paggamit ng kapangyarihang mamahala. Pinananatili sa pangunahing teksto ang pinakatuwirang hudisyal na kahulugan, habang kinikilala sa talababa ang mas malawak na kahulugan upang hindi makitid na ipakahulugan bilang paghatol lamang o pamamahala lamang.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “hapag” upang mapanatili ang marangal na larawan ng pakikisalo, at “trono” bilang malinaw na katawagang maharlika. Ang panandang talababa [a] ay inilagay kaagad pagkatapos ng “humahatol,” ang salitang tinutukoy nito.
