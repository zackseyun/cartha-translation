base_translation:
  language: en
  yaml_path: translation/nt/luke/022/044.yaml
  text: And being in agony[a], he was praying more intensely[c][b]; and his sweat became like drops of blood falling to the ground.
translation:
  language: tl
  text: At habang nasa matinding paghihirap siya[a], lalo pa siyang taimtim na nananalangin. Ang pawis niya ay naging tulad ng mga patak ng dugo[b] na bumabagsak sa lupa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nasa matinding dalamhati” o “nasa matinding pakikipagpunyagi.”
    reason: lexical_alternative
  - marker: b
    text: 'Griyego: “tulad ng mga patak o namuong dugo.” Paghahambing ito at hindi tuwirang pagsasabing dugo mismo ang pawis.'
    reason: lexical_alternative
  - marker: c
    text: Hindi kasama ang Lucas 22:43–44 sa ilang manuskrito; kasama naman ang mga ito sa iba. Inilimbag ng SBLGNT ang mga talata sa loob ng mga bracket upang ipakita ang kawalang-katiyakang ito sa teksto.
    reason: textual_variant
lexical_decisions:
- source_word: γενόμενος ἐν ἀγωνίᾳ
  choice: dahil nasa matinding paghihirap siya
  rationale: Ipinapahayag nito ang kalagayan ni Jesus at ang matindi niyang panloob na pakikipagpunyagi. Likas sa modernong Tagalog ang pariralang ito at hindi nito nililimitahan ang kahulugan sa pisikal na sakit lamang.
- source_word: ἐκτενέστερον
  choice: lalo pa ... nang taimtim
  rationale: Pinananatili ng “lalo pa” ang paghahambing o pag-igting na taglay ng comparative adverb, samantalang ipinahahayag ng “nang taimtim” ang masidhing paraan ng pananalangin.
- source_word: προσηύχετο
  choice: siyang nanalangin
  rationale: Malinaw at natural itong salin ng patuloy na kilos sa konteksto; kasama ng “lalo pa” at “nang taimtim,” naipakikita ang nagpapatuloy at tumitinding panalangin.
- source_word: ἐγένετο ὁ ἱδρὼς αὐτοῦ
  choice: Ang pawis niya ay naging
  rationale: Pinananatili ng “naging” ang resulting-state force ng ἐγένετο sa halip na gawing payak na paglalarawan lamang.
- source_word: ὡσεὶ θρόμβοι αἵματος
  choice: tulad ng mga patak ng dugo
  rationale: Ang “tulad ng” ay tahasang nagpapanatili sa paghahambing na ipinahihiwatig ng ὡσεὶ. Natural sa Tagalog ang “mga patak,” habang inilalahad sa talababa ang posibleng diwang “mga namuong dugo.”
- source_word: καταβαίνοντες ἐπὶ τὴν γῆν
  choice: na pumapatak sa lupa
  rationale: Natural at malinaw nitong inilalarawan ang pababang galaw patungo sa lupa.
theological_decisions:
- issue: Kung ang pawis ay dugo mismo o inihahambing lamang sa dugo
  choice: 'Pinanatili ang pagtutulad: “ang pawis niya ay naging tulad ng mga patak ng dugo.”'
  alternative: Sabihing ang pawis niya ay literal na dugo.
  rationale: Ang ὡσεὶ ay malinaw na pananda ng paghahambing. Hindi dapat gawing tahasang pagkakakilanlan ang iniwang pagtutulad ng Griyego.
- issue: Katiyakan ng tekstuwal na pag-iral ng talata
  choice: Isinama ang talata ayon sa SBLGNT ngunit nilagyan ng talababa tungkol sa pagkakaiba ng mga manuskrito.
  alternative: Alisin ang talata sa pangunahing teksto o ilahad ito nang walang paliwanag.
  rationale: Nasa ibinigay na tekstong SBLGNT ang talata ngunit nakabracket upang ipakita ang makabuluhang tekstuwal na pag-aalinlangan; kapwa dapat makita ang talata at ang kawalang-katiyakang ito.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “matinding paghihirap” at “nang taimtim” sa halip na mas maluma o mas teknikal na pananalita. Pinanatili ang masidhing tono, ang comparative force ng ἐκτενέστερον, at ang pagtutulad sa dugo nang hindi nagpapasok ng isang tiyak na medikal o himalang paliwanag.
