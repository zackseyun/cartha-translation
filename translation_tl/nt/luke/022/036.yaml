base_translation:
  language: en
  yaml_path: translation/nt/luke/022/036.yaml
  text: But now[a], let the one who has a money bag take it, and likewise a travel bag[b]; and let the one who does not have one sell his cloak and buy a sword.
translation:
  language: tl
  text: Ngunit ngayon, ang may supot ng pera ay dalhin ito, at gayundin ang supot sa paglalakbay[a]; at ang wala ay ipagbili ang kanyang balabal at bumili ng tabak[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na πήρα ay tumutukoy sa supot o bag na dinadala sa paglalakbay; maaari rin itong isaling “bag” o “supot-panlakbay.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego na μάχαιρα ay maaari ring tumukoy sa isang mas maikling talim, gaya ng punyal o maikling tabak.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ νῦν
  choice: Ngunit ngayon
  rationale: Malinaw na ipinapakita ang mariing pagsalungat sa naunang tagubilin at pinananatili ang temporal na diwa ng νῦν.
- source_word: ὁ ἔχων
  choice: ang may
  rationale: Likas at pangkalahatang paraan sa modernong Tagalog upang katawanin ang articular participle nang hindi tahasang nagtatakda ng kasarian.
- source_word: βαλλάντιον
  choice: supot ng pera
  rationale: Tuwirang inilalarawan ang sisidlang ginagamit sa pagdadala ng salapi at madaling maunawaan ng kasalukuyang mambabasa.
- source_word: ἀράτω
  choice: ay dalhin iyon
  rationale: Sa konteksto ng paghahanda sa paglalakbay, ang pandiwa ay tumutukoy sa pagkuha at pagdadala ng bagay; ang 'dalhin' ang pinakanatural dito.
- source_word: ὁμοίως καὶ πήραν
  choice: gayundin ang lalagyan para sa paglalakbay
  rationale: Pinananatili ng 'gayundin' ang ὁμοίως, habang ipinapahayag ang gamit ng πήρα nang hindi ito nililimitahan sa isang tiyak na modernong uri ng bag.
- source_word: ὁ μὴ ἔχων
  choice: ang wala naman
  rationale: Hindi tahasang sinasabi sa Griyego kung ano ang wala. Pinananatili ng saling ito ang pagkakaltas at kaunting kalabuan sa halip na idagdag sa pangunahing teksto ang 'tabak.'
- source_word: πωλησάτω τὸ ἱμάτιον αὐτοῦ
  choice: ay ipagbili ang kanyang balabal
  rationale: Ang 'ipagbili' ay natural na pautos sa kayariang ito, at ang 'balabal' ay angkop para sa panlabas na kasuotang tinutukoy ng ἱμάτιον.
- source_word: ἀγορασάτω μάχαιραν
  choice: at bumili ng tabak
  rationale: Tuwirang pinananatili ang pautos at ang karaniwang kahulugan ng μάχαιρα, nang hindi pinahihina o pinalalawak ang salita bilang isang pangkalahatang 'sandata.'
theological_decisions:
- issue: Kung ang utos na bumili ng μάχαιρα ay dapat palambutin o ipaliwanag bilang talinghaga sa mismong salin.
  choice: Panatilihin ang tuwirang utos na 'bumili ng tabak.'
  alternative: Isalin bilang 'bumili ng sandata' o ipahiwatig na paghahanda lamang ito sa panganib.
  rationale: Tahasang gumagamit ang Griyego ng μάχαιρα at ng pautos. Dapat panatilihin ng salin ang tensiyon at ipaubaya sa pagpapaliwanag ang tanong kung literal, simboliko, o may ibang kontekstuwal na layunin ang utos.
- issue: Kung dapat tukuyin ang ipinahihiwatig na layon ng ὁ μὴ ἔχων.
  choice: Panatilihin itong di-tiyak bilang 'ang wala naman.'
  alternative: Idagdag ang 'ang walang tabak.'
  rationale: Walang nakasaad na layon sa Griyego. Bagaman maaaring ipahiwatig ng kasunod na utos na tabak ang tinutukoy, ang tahasang pagdaragdag nito ay nag-aalis ng isang tunay na sintaktikong kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Ginamit ang 'supot ng pera,' 'lalagyan para sa paglalakbay,' 'balabal,' at 'tabak' bilang malinaw at hindi sobrang teknikal na mga katumbas. Ang 'ang wala naman' ay sadyang nagpapanatili sa hindi tahasang layon ng Griyego.
