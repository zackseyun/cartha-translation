  text: ⸂ὅτι ὁ υἱὸς μὲν⸃ τοῦ ἀνθρώπου ⸂κατὰ τὸ ὡρισμένον πορεύεται⸃, πλὴν οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ παραδίδοται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/022.yaml
  text: For the Son of Man indeed goes as it has been determined[a], but woe to that man through whom he is betrayed.
translation:
  language: tl
  text: Sapagkat ang Anak ng Tao ay magpapatuloy ayon sa itinakda, ngunit aba sa taong iyon na siyang nagkakanulo sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “na sa pamamagitan niya ay ibinibigay siya.” Ang pandiwang Griyego ay maaaring mangahulugang “ipinagkakanulo” o “ibinibigay,” depende sa konteksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikita nito na ang pangungusap ay nagbibigay ng dahilan para sa naunang sinabi, at natural itong nagdurugtong sa daloy ng salaysay.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Ito ang kinikilalang salin ng titulo ni Jesus at pinananatili ang kaugnayan nito sa mas malawak na gamit sa Kasulatan.
- source_word: μέν … πλὴν
  choice: ay … ngunit
  rationale: Ang karaniwang panandang paksa na “ay” at ang malinaw na “ngunit” ay likas na naghahayag sa Filipino ng pagsalungat, nang hindi pinabibigat ang pangungusap sa hiwalay na katumbas ng μέν.
- source_word: κατὰ τὸ ὡρισμένον
  choice: ayon sa itinakda
  rationale: Pinananatili nito ang diwang ang paglakad ng Anak ng Tao ay kaayon ng naunang pagpapasiya, habang hindi tahasang dinaragdagan kung sino ang nagtakda.
- source_word: πορεύεται
  choice: patungo
  rationale: Sa konteksto, tumutukoy ito sa tiyak na landas na tatahakin ni Jesus tungo sa kanyang kamatayan; ang “patungo” ay natural at hindi nangangailangang tukuyin ang destinasyong hindi tahasang binanggit.
- source_word: οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: kahabag-habag ang taong iyon
  rationale: Nananatili ang bigat ng propetikong pahayag ng kapahamakan at panaghoy sa isang natural at dignidad na Filipino.
- source_word: δι’ οὗ
  choice: na … sa pamamagitan niya
  rationale: Ang hulma ng Filipino na “taong iyon na…” ay natural na naghahayag ng taong nagsisilbing ahente sa pagkakanulo, bagaman hindi kailangang literal na ulitin ang “sa pamamagitan.”
- source_word: παραδίδοται
  choice: magkakanulo sa kanya
  rationale: Sa agarang konteksto ng ginawa ni Judas, malinaw na ipinahahayag ng “magkakanulo” ang pagtataksil; inilalahad sa talababa ang leksikal na alternatibong “ipinagkakanulo/ibinibigay.”
theological_decisions:
- issue: Ugnayan ng itinakdang plano at pananagutan ng tao
  choice: Pinanatili ang pahayag na ang Anak ng Tao ay patungo ayon sa itinakda, kasabay ng kapahamakan ng taong magkakanulo sa kanya.
  alternative: Palambutin ang alinman sa naunang pagtatakda o sa pananagutan ng nagkanulo.
  rationale: Tahasang pinagkatabi ng Griyego ang itinakdang landas ng Anak ng Tao at ang pahayag ng kapahamakan sa taong nagkanulo; hindi dapat lutasin ng salin ang tensiyong ito ayon sa isang sistemang teolohikal.
- issue: Hindi tahasang tinukoy ang gumawa ng pagtatakda
  choice: “ayon sa itinakda”
  alternative: “ayon sa itinakda ng Diyos”
  rationale: Ang pasibong anyo sa Griyego ay maaaring magpahiwatig ng banal na pagtatakda, ngunit hindi nito tahasang binabanggit ang Diyos; pinananatili ng salin ang pahiwatig nang walang idinagdag na tagaganap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kahabag-habag” upang mapanatili ang bigat ng οὐαί nang mas natural kaysa sa literal na “aba,” at pinanatili ang titulong “Anak ng Tao.”
