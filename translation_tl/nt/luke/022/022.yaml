review_pass:
  verdict: revise
  source_fidelity: Ang “patungo” ay hindi isang ganap na pandiwa sa ganitong ayos at hindi sapat na naihahayag ang πορεύεται. Ang “magpapatuloy ayon sa itinakda” ay malinaw na naghahayag ng paglakad/pagpapatuloy ng Anak ng Tao alinsunod sa naunang itinakda, nang hindi tinutukoy kung sino ang nagtakda. Ang “aba” ay mas tuwirang katumbas ng οὐαί at pinananatili ang propetikong hatol; ang “kahabag-habag” ay higit na maaaring tunog paglalarawan ng kaawa-awang kalagayan kaysa pahayag ng kapahamakan. Napananatili rin ang pagsasabay ng itinakdang landas at pananagutan ng nagkakanulo.
  naturalness: Mas natural at ganap ang “magpapatuloy ayon sa itinakda” kaysa “ay patungo ayon sa itinakda.” Ang “Ngunit aba sa taong iyon na siyang nagkakanulo sa kanya” ay malinaw, marangal, at angkop sa makabagong Filipino Tagalog na pananalita ng Kasulatan.
  terminology: Pinanatili ang kinikilalang titulong “Anak ng Tao.” Ginamit ang “aba” para sa οὐαί. Inayos ang talababa upang ang alternatibong “ibinibigay” ay malinaw na pasibo at tumutugma sa δι’ οὗ παραδίδοται, sa halip na magmukhang aktibong kilos ng taong tinutukoy.
  issues:
  - severity: medium
    issue: Hindi ganap at hindi likas ang “ang Anak ng Tao ay patungo ayon sa itinakda.”
    rationale: Ang “patungo” ay karaniwang pantukoy sa direksiyon o pandagdag na nangangailangan ng malinaw na patutunguhan; hindi nito maayos na ginagampanan ang pandiwang πορεύεται sa pangungusap.
  - severity: medium
    issue: Mahina ang hatol na ipinahahayag ng “kahabag-habag” para sa οὐαί.
    rationale: Bagaman maaari itong magpahiwatig ng lungkot, ang οὐαί rito ay isang matinding pahayag ng kapahamakan o hatol. Mas tumpak at likas sa rehistrong biblikal ang “aba.”
  - severity: medium
    issue: 'Hindi malinaw at hindi wastong nakaayon sa pasibong Griyego ang unang alternatibo sa talababa: “sa pamamagitan niya ay ipinagkakanulo siya.”'
    rationale: Kailangang malinaw na ang Anak ng Tao ang ibinibigay o ipinagkakanulo sa pamamagitan ng taong iyon. Ang inayos na alternatibo ay tuwirang nagpapanatili ng pasibong anyo at instrumental na diwa.
  revised_text: Sapagkat ang Anak ng Tao ay magpapatuloy ayon sa itinakda, ngunit aba sa taong iyon na siyang nagkakanulo sa kanya.[a]
