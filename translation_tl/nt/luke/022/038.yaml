  source_fidelity: Tumpak ang salaysay, pagtawag na “Panginoon,” bilang na dalawa, at pagtukoy sa mga espada. Gayunman, ang “iyan” sa huling tugon ay nagdaragdag ng isang panturong sanggunian na wala sa Griyego at bahagyang nagtutulak sa pagbasa na tumutukoy ito sa dalawang espada.
  naturalness: Natural ang kabuuang daloy. Mas maigsi at mas natural sa makabagong Filipino ang “Sapat na,” at mas mahusay nitong pinananatili ang maigsi at sadyang malabong tugon ni Jesus.
  terminology: Ang “Panginoon” at “espada” ay angkop at pare-pareho sa rehistrong Bagong Tipan. Ang talababa ay angkop na naglalahad ng alternatibong diwa nang hindi ito ipinipilit sa pangunahing teksto.
