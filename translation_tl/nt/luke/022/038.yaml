  text: οἱ δὲ εἶπαν· Κύριε, ἰδοὺ μάχαιραι ὧδε δύο. ὁ δὲ εἶπεν αὐτοῖς· Ἱκανόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/038.yaml
  text: And they said[a], “Lord, look, here are two swords.” And he said to them, “It is enough.”
translation:
  language: tl
  text: Sinabi naman nila, “Panginoon, tingnan ninyo, may dalawang espada rito.” Sinabi niya sa kanila, “Sapat na.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tama na,” na posibleng nangangahulugang dapat nang tapusin ang usapan, sa halip na sapat ang dalawang espada.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Sinabi naman nila
  rationale: Ang δέ ay banayad na pang-ugnay; natural na ipinahahayag ng “naman” ang pagpapatuloy ng salaysay nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: Κύριε
  choice: Panginoon
  rationale: Ito ang karaniwan at marangal na salin ng κύριος bilang tuwirang pagtawag kay Jesus at bilang titulong ginagamit sa Bagong Tipan.
- source_word: ἰδοὺ
  choice: tingnan ninyo
  rationale: Naipahahayag nito ang pantawag-pansing at panturong lakas ng ἰδού sa natural na makabagong Tagalog.
- source_word: μάχαιραι
  choice: mga espada
  rationale: Ang μάχαιρα ay sandatang may talim na karaniwang isinasaling “espada”; ang “punyal” o “maikling espada” ay maaaring maging labis na tiyak.
- source_word: ὧδε δύο
  choice: may dalawang espada rito
  rationale: Natural sa Tagalog ang eksistensiyal na ayos na ito at malinaw nitong napapanatili ang bilang at ang lokasyong ipinahahayag ng ὧδε.
- source_word: Ἱκανόν ἐστιν
  choice: Sapat na iyan
  rationale: Ang ἱκανόν ay nangangahulugang sapat o kasya. Ang “iyan” ay maaaring tumukoy sa dalawang espada o sa sinabi/usapan, kaya nananatili ang tunay na kalabuan ng tugon.
theological_decisions:
- issue: Kalabuan ng tugon ni Jesus na Ἱκανόν ἐστιν
  choice: Sapat na iyan
  alternative: Tama na
  rationale: Maaaring literal na sabihing sapat ang dalawang espada, o maaaring pinatitigil na ni Jesus ang usapan. Hindi nilulutas ng pangunahing teksto ang tensiyong ito; nililinaw ng talababa ang posibleng alternatibong diwa.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang magalang na “tingnan ninyo” sa tuwirang pagtawag kay Jesus, habang pinanatiling maikli at may kalabuan ang huling tugon.
