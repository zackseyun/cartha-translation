  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὡς ἐγένετο ἡμέρα, συνήχθη τὸ πρεσβυτέριον τοῦ λαοῦ, ἀρχιερεῖς ⸀τε καὶ γραμματεῖς, καὶ ⸀ἀπήγαγον αὐτὸν εἰς τὸ συνέδριον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/066.yaml
  text: And when day came[a], the council of the elders of the people gathered together, both chief priests and scribes, and they led him away into their Sanhedrin[b],
translation:
  language: tl
  text: At nang mag-umaga[a], nagtipon ang kapulungan ng mga nakatatanda ng bayan—ang mga punong pari at mga eskriba—at dinala nila siya sa kanilang kapulungan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang sumapit ang araw” o “pagsikat ng araw.”
    reason: lexical_alternative
  - marker: b
    text: O “sa kanilang Sanhedrin” o “sa pormal na pagpupulong ng kanilang konseho.” Ang salitang Griyego ay maaaring tumukoy sa konseho mismo, sa pormal na pagpupulong nito, o sa kaugnay na lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγένετο ἡμέρα
  choice: nang mag-umaga
  rationale: Natural na idyomang Tagalog para sa pagsapit ng araw; pinananatili ng talababa ang mas literal na anyo at ang posibleng diing bukang-liwayway.
- source_word: συνήχθη
  choice: nagtipon
  rationale: Malinaw at likas na nagsasaad na sama-samang nagtipon ang pangkat, nang hindi ipinapalagay kung sino ang nagpatawag sa kanila.
- source_word: τὸ πρεσβυτέριον τοῦ λαοῦ
  choice: ang kapulungan ng matatandang pinuno ng bayan
  rationale: Ipinahahayag na ang πρεσβυτέριον ay isang lupon ng mga pinuno, hindi lamang mga taong matatanda ang edad; natural din ito sa modernong Tagalog.
- source_word: ἀρχιερεῖς τε καὶ γραμματεῖς
  choice: ang mga punong pari at mga tagapagturo ng Kautusan
  rationale: Ang τε καί ay likas na naihahatid ng magkaugnay na 'at'; ang 'tagapagturo ng Kautusan' ay mas malinaw sa karaniwang mambabasa kaysa literal na 'eskriba' at angkop sa tungkulin ng γραμματεῖς dito.
- source_word: ἀπήγαγον αὐτόν
  choice: dinala nila siya
  rationale: Natural na Tagalog para sa pag-akay o pagdadala sa isang tao patungo sa ibang kinaroroonan, nang hindi dinaragdagan ang antas ng puwersang ginamit.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: sa harap ng kanilang konseho
  rationale: Pinananatili ang posibilidad na ang συνέδριον ay tumutukoy sa konseho o pormal na pagpupulong nito, at iniiwasang ipalagay na tiyak na isang silid ang tinutukoy.
theological_decisions:
- issue: Pagkakakilanlan at lokasyon ng συνέδριον
  choice: sa harap ng kanilang konseho
  alternative: sa kanilang Sanhedrin; sa bulwagan ng kanilang konseho
  rationale: Maaaring tumukoy ang salita sa namamahalang lupon, sa pormal na pagpupulong nito, o kaugnay na lugar. Hindi ipinapasok sa pangunahing teksto ang transliterasyong 'Sanhedrin' o ang mas tiyak ngunit di-siguradong pisikal na 'bulwagan.'
- issue: Ugnayan ng πρεσβυτέριον sa ἀρχιερεῖς τε καὶ γραμματεῖς
  choice: gumamit ng gatlang upang ipakitang kabilang o nagpapaliwanag ang mga punong pari at mga tagapagturo ng Kautusan sa kapulungang nabanggit
  alternative: basahin ang mga ito bilang hiwalay na mga pangkat na idinagdag sa kapulungan
  rationale: Ang Griyego ay maaaring basahing appositional o nagpapaliwanag. Pinananatili ng ayos ang malapit na kaugnayan nang hindi gumagawa ng doktrinal na pahayag tungkol sa eksaktong komposisyon ng lupon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'matatandang pinuno' upang maiwasang mapagkamalang edad lamang ang tinutukoy, at 'tagapagturo ng Kautusan' bilang malinaw na functional rendering ng γραμματεῖς.
