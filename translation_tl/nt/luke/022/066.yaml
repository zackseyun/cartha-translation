- from: At nang mag-umaga[a], nagtipon ang kapulungan ng matatandang pinuno ng bayan—ang mga punong pari at mga tagapagturo ng Kautusan—at dinala nila siya sa harap ng kanilang konseho.[b]
  to: At nang mag-umaga[a], nagtipon ang kapulungan ng mga nakatatanda ng bayan—ang mga punong pari at mga eskriba—at dinala nila siya sa kanilang kapulungan.[b]
  rationale: Inayos ang pangunahing salin upang maging mas tuwiran sa εἰς τὸ συνέδριον αὐτῶν at mas tapat sa γραμματεῖς at πρεσβυτέριον. Pinanatili ng talababa ang lehitimong saklaw ng συνέδριον nang hindi ipinipilit ang isang pisikal na lugar o ang transliterasyong “Sanhedrin.”
