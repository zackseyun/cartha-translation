base_translation:
  language: en
  yaml_path: translation/nt/luke/022/018.yaml
  text: For I tell you[a], from now on I will certainly not drink from the fruit of the vine until the kingdom of God comes.
translation:
  language: tl
  text: 'Sapagkat sinasabi ko sa inyo: mula ngayon, hinding-hindi na ako iinom ng bunga ng ubas[a] hanggang sa dumating ang kaharian ng Diyos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “alak.” Literal na “bunga ng puno ng ubas” ang nasa Griyego, isang mas malawak na pariralang malamang na tumutukoy sa laman ng saro nang hindi ginagamit ang karaniwang salita para sa alak.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Sapagkat sinasabi ko sa inyo
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayang ipinahihiwatig ng γάρ, at ang “sinasabi ko sa inyo” ay natural at tuwirang pormula ng pakikipag-usap sa modernong Tagalog.
- source_word: οὐ μὴ πίω
  choice: tiyak na hindi na ako iinom
  rationale: Ang οὐ μή na may aorist subjunctive ay mariing pagtanggi tungkol sa hinaharap. Ipinapahayag ng “tiyak na hindi na” ang diin nang hindi ipinahihiwatig na walang hanggang hindi na iinom, yamang may kasunod na hangganang “hanggang sa.”
- source_word: ἀπὸ τοῦ νῦν
  choice: mula ngayon
  rationale: Ito ang natural na katumbas sa Tagalog ng panandang nagsisimula sa kasalukuyang sandali.
- source_word: ἀπὸ τοῦ γενήματος τῆς ἀμπέλου
  choice: ng bunga ng ubas
  rationale: Pinananatili nito ang mas malawak at pormal na ekspresyon ng Griyego sa halip na tahasang paliitin ito sa “alak.” Sa konteksto ng pag-inom, tumutukoy ito sa laman ng saro.
- source_word: ἕως οὗ
  choice: hanggang sa
  rationale: Malinaw at natural itong nagpapahayag ng temporal na hangganan ng pagtanggi.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Pinananatili ng kinikilalang pariralang ito ang mga dimensiyon ng paghahari at kaharian nang hindi nililimitahan ang kahulugan sa isa lamang.
- source_word: ἔλθῃ
  choice: dumating
  rationale: Ang aorist subjunctive sa sugnay na may ἕως οὗ ay natural na isinasalin bilang panghinaharap na pangyayari matapos ang “hanggang sa.”
theological_decisions:
- issue: Kung isasalin ang γενήματος τῆς ἀμπέλου bilang “alak” o bilang mas malawak na “bunga ng ubas”
  choice: bunga ng ubas
  alternative: alak
  rationale: Hindi karaniwang salita para sa alak ang ginamit ng Griyego. Pinananatili ng salin ang mas malawak na pahayag at ang alingawngaw nito sa konteksto ng banal na hapunan, habang inilalagay sa talababa ang natural na posibleng kahulugan.
- issue: Ang paraan o yugto ng pagdating ng kaharian ng Diyos
  choice: hanggang sa dumating ang kaharian ng Diyos
  alternative: hanggang sa lubos na dumating ang paghahari ng Diyos
  rationale: Nagbibigay ang teksto ng panghinaharap na temporal na hangganan ngunit hindi nito tinutukoy ang eksaktong paraan o yugto ng pagdating. Hindi idinaragdag ng salin ang “lubos” o ibang pagpapakahulugang sistematiko.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tiyak na hindi na” upang maipakita ang mariing pagtanggi, at pinanatili ang “bunga ng ubas” upang hindi maging higit na tiyak kaysa sa Griyego.
