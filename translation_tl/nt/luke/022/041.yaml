  yaml_path: translation/nt/luke/022/041.yaml
  text: And he withdrew from them about a stone’s throw[a], and kneeling down[b], he was praying.
translation:
  language: tl
  text: At lumayo siya sa kanila na halos kasinlayo ng maihahagis na bato[a]. Lumuhod siya[b] at patuloy na nanalangin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga isang pukol ng bato ang layo.”
    reason: lexical_alternative
  - marker: b
    text: Literal, “inilagay ang mga tuhod,” isang idyomang nangangahulugang “lumuhod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεσπάσθη
  choice: lumayo
  rationale: Bagaman pasibo ang anyo sa Griyego, idiomatiko nitong inilalarawan ang paghiwalay ni Jesus sa mga alagad. Likas sa modernong Tagalog ang “lumayo” at hindi nito ipinapalagay na may puwersang humila sa kaniya.
- source_word: ὡσεὶ λίθου βολήν
  choice: nang halos isang pukol ng bato
  rationale: Pinananatili ng “halos” ang pagtatantiya ng ὡσεὶ, at ang “isang pukol ng bato” ay maikli at malinaw na panukat ng layo sa Tagalog.
- source_word: θεὶς τὰ γόνατα
  choice: Pagkaluhod
  rationale: Ang literal na “inilagay ang mga tuhod” ay idyomang nangangahulugang lumuhod. Malinaw at natural na ipinahahayag ng “Pagkaluhod” ang kilos at pustura.
- source_word: προσηύχετο
  choice: patuloy siyang nanalangin
  rationale: Ang imperpektong pandiwa ay nagpapahiwatig ng nagpapatuloy na kilos; ipinakikita ito ng “patuloy” nang hindi ito ginagawang simpleng minsanang panalangin.
- source_word: αὐτὸς
  choice: siya
  rationale: Sapat na tinutukoy ng “siya” ang paksa. Hindi kailangang idagdag ang “siya mismo,” na magiging mas mabigat kaysa kailangan sa Tagalog.
- source_word: καὶ
  choice: At
  rationale: Ang “At” ay tuwirang nagpapatuloy sa daloy ng salaysay nang hindi nagdaragdag ng sanhi o bagong pagkakasunod na hindi tahasang ipinahihiwatig.
theological_decisions:
- issue: Pustura sa panalangin at paglalarawan kay Cristo
  choice: Tuwirang isinalaysay na lumayo si Jesus, lumuhod, at patuloy na nanalangin.
  alternative: Dagdagan ang salaysay ng debosyonal o doktrinal na paliwanag tungkol sa kaniyang pagluhod.
  rationale: Kilos at pustura ni Jesus sa panalangin ang inilalahad ng talata. Hindi dapat dagdagan ng salin ang teolohikal na interpretasyong wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang larawang panukat ng layo at ang nagpapatuloy na aspekto ng pananalangin. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto.
