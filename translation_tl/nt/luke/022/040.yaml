base_translation:
  language: en
  yaml_path: translation/nt/luke/022/040.yaml
  text: When he came to the place[a], he said to them, “Pray that you may not enter into temptation.”
translation:
  language: tl
  text: Pagdating niya sa lugar, sinabi niya sa kanila, “Manalangin kayo upang hindi kayo pumasok sa tukso.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagsubok.” Ang salitang Griyego ay maaaring tumukoy sa tuksong gumawa ng masama o, sa mas malawak na diwa, sa isang panahon ng pagsubok.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος δὲ ἐπὶ τοῦ τόπου
  choice: Pagdating niya sa lugar
  rationale: Ang aorist participle na γενόμενος kasama ng ἐπὶ τοῦ τόπου ay nagsasaad ng pagdating sa isang tiyak na lugar. Likas sa modernong Tagalog ang “Pagdating niya sa lugar” at malinaw nitong inuugnay ang pagdating sa sumunod na pagsasalita.
- source_word: εἶπεν αὐτοῖς
  choice: sinabi niya sa kanila
  rationale: Tuwirang katumbas ito ng karaniwang diwa ng λέγω at hindi nito dinaragdagan ang lakas ng utos na higit sa nasa Griyego.
- source_word: Προσεύχεσθε
  choice: Manalangin kayo
  rationale: Likas at marangal na anyo ito ng pangmaramihang pautos. Maaaring magpahiwatig ng nagpapatuloy na pananalangin ang present imperative, ngunit hindi kailangang palawakin iyon sa pangunahing teksto.
- source_word: μὴ εἰσελθεῖν
  choice: upang hindi kayo mapasok
  rationale: Pinananatili nito ang larawang literal ng pagpasok sa isang kalagayan at ang ugnayang layunin o nilalaman ng panalangin, nang hindi ito agad binibigyang-kahulugang “mahulog.”
- source_word: πειρασμόν
  choice: tukso
  rationale: Sa konteksto ng nalalapit na espirituwal na pagkabigo ng mga alagad, “tukso” ang pinakanatural na pangunahing salin. Gayunman, maaari ring tumukoy ang salita sa pagsubok, kaya pinananatili sa talababa ang mas malawak na diwa.
theological_decisions:
- issue: Kahulugan ng πειρασμός sa babala ni Jesus
  choice: tukso
  alternative: pagsubok
  rationale: Ang agarang konteksto ay babala laban sa espirituwal na pagkabigo, kaya ang “tukso” ang angkop sa pangunahing teksto. Hindi naman inaalis ang posibleng mas malawak na diwang “pagsubok”; tahasan itong inilalagay sa talababa upang mapanatili ang tunay na lawak ng salitang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “kayo” upang ipakita ang pangmaramihang kausap. Iniwasan ang mas lumang “manalangin kayo nang hindi kayo mahulog” dahil ang “mahulog” ay higit na interpretatibo kaysa sa literal na εἰσέρχομαι, “pumasok.”
