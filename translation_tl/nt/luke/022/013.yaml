base_translation:
  language: en
  yaml_path: translation/nt/luke/022/013.yaml
  text: So they went and found it just as he had told them[a], and they prepared the Passover.
translation:
  language: tl
  text: Kaya umalis sila at natagpuan nila ang lahat, gaya nga ng sinabi niya sa kanila, at inihanda nila ang Paskuwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang hapunan ng Paskuwa” o “ang kordero ng Paskuwa.” Ang salitang Griyego ay maaaring tumukoy sa buong pagdiriwang ng Paskuwa o, sa mas tiyak na diwa, sa hapunan o handog na kaugnay nito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπελθόντες
  choice: umalis sila
  rationale: Ang aorist participle ay nauuna sa pangunahing pandiwa at nagsasaad ng naunang kilos. Ang pariralang “umalis sila” ay likas sa modernong Tagalog at malinaw na nagpapanatili sa pagkakasunod-sunod ng mga pangyayari.
- source_word: δὲ
  choice: Kaya
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay at inuugnay ang ginawa ng mga alagad sa naunang tagubilin ni Jesus; ang “Kaya” ay angkop sa daloy ng konteksto.
- source_word: εὗρον
  choice: natagpuan nila ang lahat
  rationale: Walang tahasang layon ang pandiwa sa Griyego. Idinagdag ang “ang lahat” bilang likas na Tagalog na tumutukoy sa buong kalagayang inilarawan ni Jesus, nang hindi nililimitahan ito sa isang partikular na bagay.
- source_word: καθὼς
  choice: ayon sa
  rationale: Ipinahahayag nito ang pagtutugma ng kanilang natagpuan at ng naunang sinabi ni Jesus. Likas at malinaw sa Tagalog ang “ayon sa sinabi.”
- source_word: εἰρήκει αὐτοῖς
  choice: sinabi niya sa kanila
  rationale: Ang pluperfect ay tumutukoy sa sinabi na bago pa sila umalis. Hindi karaniwang minamarkahan nang hiwalay sa Tagalog ang pluperfect; malinaw na ang naunang panahon mula sa konteksto.
- source_word: ἡτοίμασαν
  choice: inihanda nila
  rationale: Tumpak at karaniwang salin ito para sa kilos ng paghahanda.
- source_word: τὸ πάσχα
  choice: ang Paskuwa
  rationale: Pinananatili ng “Paskuwa” ang lawak ng terminong Griyego, na maaaring tumukoy sa pagdiriwang, pagkain, o korderong kaugnay nito, sa halip na pumili agad ng mas makitid na kahulugan.
theological_decisions:
- issue: Saklaw ng πάσχα sa konteksto
  choice: ang Paskuwa
  alternative: ang hapunan ng Paskuwa; ang kordero ng Paskuwa
  rationale: Bagaman nakatuon ang konteksto sa paghahanda upang kumain ng Paskuwa, mas malawak ang mismong terminong Griyego. Pinananatili ng pangunahing salin ang tunay na lawak at ipinapaliwanag sa talababa ang posibleng mas tiyak na mga kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “Paskuwa” bilang pamilyar na terminong biblikal, at iniwasang paliitin sa pangunahing teksto ang kahulugan ng πάσχα.
