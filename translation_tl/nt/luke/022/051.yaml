    issue: Hindi naisalin ang participial na ἀποκριθεὶς.
    rationale: Ang “Ngunit sinabi ni Jesus” ay maaaring katanggap-tanggap sa maluwag na salin, ngunit ang Griyego ay tahasang nagsasabing sumagot o tumugon si Jesus. Ang “sumagot” ay natural at mas tapat.
  - severity: medium
    issue: Malabo ang tinutukoy ng “pinagaling ito.”
    rationale: Matapos ang “hinipo niya ang tainga nito,” ang “ito” ay madaling basahing tumutukoy sa tainga. Samantalang ang αὐτόν ay tumutukoy sa isang lalaki, hindi sa tainga.
