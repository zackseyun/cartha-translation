reference: Luke 22:51
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ἐᾶτε ἕως τούτου· καὶ ἁψάμενος τοῦ ⸀ὠτίου ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/051.yaml
  text: But Jesus answered, “Enough of this!” And he touched his ear and healed him.
translation:
  language: tl
  text: Ngunit sumagot si Jesus, “Tama na!” At hinipo niya ang tainga ng lalaki at pinagaling niya siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Ngunit sinabi ni Jesus
  rationale: Ang ἀποκριθείς ay maaaring mangahulugang tumugon sa sitwasyon, hindi lamang sumagot sa isang tuwirang tanong. Natural sa modernong Tagalog ang “sinabi” rito, habang ipinahihiwatig ng “Ngunit” ang pagsalungat sa marahas na kilos.
- source_word: Ἐᾶτε ἕως τούτου
  choice: Tama na!
  rationale: Isang maikli at mariing utos na ihinto o huwag nang palawigin ang nangyayari. Pinananatili nito ang kontekstuwal na diin nang hindi pinipilit tukuyin kung ang kausap ay ang mga alagad o ang mga darakip.
- source_word: ἁψάμενος τοῦ ὠτίου
  choice: hinipo niya ang tainga nito
  rationale: Tuwirang inilalarawan ang paghipo sa tainga. Ang “nito” ay tumutukoy sa lalaking nasugatan na binanggit sa naunang talata.
- source_word: ἰάσατο αὐτόν
  choice: pinagaling ito
  rationale: Ang ἰάομαι ay malinaw na tumutukoy sa pisikal na pagpapagaling. Natural sa Tagalog ang panghalip na “ito” para sa taong kalalapit lamang na tinukoy.
theological_decisions:
- issue: Saklaw at kausap ng utos na Ἐᾶτε ἕως τούτου
  choice: Tama na!
  alternative: Hayaan ninyo—hanggang dito na lamang.
  rationale: Malabo sa Griyego kung ito ay utos sa mga alagad na tumigil sa karahasan, pahintulot sa mga darakip, o panandaliang pakiusap upang magawa ni Jesus ang pagpapagaling. Ang maikling salin ay pinananatili ang tensiyong ito at umaayon sa agarang konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, malinaw, at marangal. Ginamit ang karaniwang “tainga” sa halip na mas teknikal na “tenga” o “bahagi ng tainga,” at iniwasang magdagdag ng tahasang paksa o paliwanag na wala sa Griyego.
