  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ διαστάσης ὡσεὶ ὥρας μιᾶς ἄλλος τις διϊσχυρίζετο λέγων· Ἐπ’ ἀληθείας καὶ οὗτος μετ’ αὐτοῦ ἦν, καὶ γὰρ Γαλιλαῖός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/059.yaml
  text: And after about one hour had passed[a], another man insisted, saying, “Truly, this man also was with him, for he too is a Galilean.”
translation:
  language: tl
  text: Pagkalipas ng halos isang oras, mariing iginiit ng isa pa[a], “Talagang kasama rin niya ang taong ito, dahil taga-Galilea rin siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “may isa pang tao.” Hindi tiyak sa mismong pariralang Griyego kung lalaki o babae ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαστάσης ὡσεὶ ὥρας μιᾶς
  choice: Pagkalipas ng halos isang oras
  rationale: Likas na Filipino para sa genitive absolute na nagsasaad ng paglipas ng tinatayang isang oras.
- source_word: ἄλλος τις
  choice: isa pa
  rationale: Pinananatili ang pagiging di-tiyak ng Griyegong parirala; hindi kailangang tukuyin sa pangunahing teksto kung lalaki ang nagsalita.
- source_word: διϊσχυρίζετο
  choice: mariing iginiit
  rationale: Ipinahahayag ang malakas at patuloy na pagtiyak na ipinahihiwatig ng imperfect middle.
- source_word: Ἐπ’ ἀληθείας
  choice: Talagang
  rationale: Natural at mariing pananalita sa modernong Filipino na nagpapakilala ng matibay na pag-aangkin ng katotohanan.
- source_word: οὗτος
  choice: ang taong ito
  rationale: Pinananatili ang panturo at bahagyang maparatang na diin patungkol kay Pedro.
- source_word: μετ’ αὐτοῦ ἦν
  choice: kasama rin niya
  rationale: Tuwirang inilalarawan ang pakikisama kay Jesus nang hindi dinaragdagan ang kahulugan bilang pagiging alagad o kasamahan sa isang tiyak na pangkat.
- source_word: καὶ γὰρ
  choice: dahil ... rin
  rationale: Ang “dahil” ay nagbibigay ng dahilan, at ang “rin” ay kumakatawan sa karagdagang diwa ng καί.
- source_word: Γαλιλαῖός ἐστιν
  choice: taga-Galilea ... siya
  rationale: Natural na Filipino para sa pagkakakilanlan ayon sa rehiyong pinagmulan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mariing iginiit” upang mapanatili ang lakas ng pahayag, at “isa pa” upang huwag gawing tiyak ang kasarian na hindi tahasang tinutukoy ng ἄλλος τις.
