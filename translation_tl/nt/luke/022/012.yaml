  source_fidelity: 'Ang pangunahing diwa ay tumpak: ang lalaking nabanggit ay magpapakita sa mga alagad ng isang malaking silid sa itaas, at doon sila inuutusang maghanda. Gayunman, ang "nakahanda na" ay masyadong malapit sa ἑτοιμάσατε ("maghanda") at maaaring magpahiwatig na ganap nang naihanda ang lahat. Ang ἐστρωμένον ay mas tiyak na tumutukoy sa silid na nakaayos o may mga kagamitan/higaan nang nakalatag.'
