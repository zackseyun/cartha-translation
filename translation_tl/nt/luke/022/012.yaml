  yaml_path: translation/nt/luke/022/012.yaml
  text: And he will show you a large furnished upper room[a]; prepare there.
translation:
  language: tl
  text: At ipapakita niya sa inyo ang isang malaking silid sa itaas na may nakalatag nang mga kagamitan[a]. Doon kayo maghanda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang malaking silid sa itaas na nakaayos na” o “na may mga bagay na nakalatag na.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνος
  choice: At ... niya
  rationale: Pinagsasama ng κἀκεῖνος ang καί at ἐκεῖνος at tumutukoy sa lalaking nabanggit sa naunang tagubilin. Likas sa Filipino ang panghalip na “niya” sa sugnay na ito.
- source_word: δείξει ὑμῖν
  choice: ipapakita niya sa inyo
  rationale: Tuwirang ipinahahayag nito ang hinaharap na kilos ng δείξει at ang di-tuwirang layon na ὑμῖν.
- source_word: ἀνάγαιον μέγα
  choice: isang malaking silid sa itaas
  rationale: Ang ἀνάγαιον ay silid sa mataas o pang-itaas na palapag; ang “silid sa itaas” ay malinaw at hindi nagdaragdag ng di-tiyak na gamit ng silid. Ang μέγα ay likas na isinaling “malaking.”
- source_word: ἐστρωμένον
  choice: nakahanda na
  rationale: Ang perpektong pasibong participle ay naglalarawan sa silid bilang nasa naihandang kalagayan. Maaaring tumukoy ang στρώννυμι sa mga inilatag o inayos na kagamitan, kaya nilalagyan ng talababa ang leksikal na saklaw.
- source_word: ἐκεῖ ἑτοιμάσατε
  choice: Doon kayo maghanda
  rationale: Pinananatili ng “doon” ang diin ng ἐκεῖ, at ang “kayo maghanda” ay natural na maramihang pautos sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, dignified, at madaling maunawaan. Pinanatili ang pagkakaiba ng silid na nakahanda na at ng utos sa mga alagad na doon sila maghanda; hindi tinukoy kung ano mismo ang naunang inilatag o inayos.
