base_translation:
  language: en
  yaml_path: translation/nt/luke/022/017.yaml
  text: And after receiving a cup and giving thanks[a], he said[b], “Take this and divide it among yourselves.”
translation:
  language: tl
  text: Pagkatapos niyang tumanggap ng isang kopa[a] at magpasalamat, sinabi niya, “Kunin ninyo ito at paghati-hatian ninyo[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kopa.” Sa Griyego, walang pantukoy ang pangngalan, bagaman maaaring tumukoy ang konteksto ng hapunan sa isang tiyak na kopa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ipamahagi ninyo ito sa isa’t isa.” Ang pandiwa ay maaaring mangahulugang “hatiin” o “ipamahagi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δεξάμενος
  choice: Pagkatanggap niya
  rationale: Ipinakikita ng aorist participle na nauna ang pagtanggap sa pangunahing pandiwang “sinabi”; malinaw at likas sa Tagalog ang “pagkatanggap niya.”
- source_word: ποτήριον
  choice: isang kopa
  rationale: Walang pantukoy ang pangngalan sa Griyego. Ang “isang kopa” ay malapit sa anyo ng teksto at hindi agad ipinapalagay na isang tiyak na kopang liturhikal ang tinutukoy.
- source_word: εὐχαριστήσας
  choice: pagkaraang magpasalamat
  rationale: Pinananatili nito ang karaniwang kahulugan ng pasasalamat at ang pagkakasunod-sunod ng mga kilos, nang hindi nag-aangkat ng teknikal na terminong liturhikal.
- source_word: εἶπεν
  choice: sinabi niya
  rationale: Walang hayag na di-tuwirang layon sa Griyego, kaya hindi idinagdag ang “sa kanila.”
- source_word: Λάβετε
  choice: Kunin ninyo
  rationale: Ito ang likas na pautos sa konteksto ng pag-abot at pagtanggap ng kopa sa hapag.
- source_word: τοῦτο
  choice: ito
  rationale: Tumutukoy ito sa kapang nabanggit ngunit hindi inuulit ng Griyego ang pangngalan; pinananatili ng “ito” ang kaiklian ng orihinal.
- source_word: διαμερίσατε
  choice: paghati-hatian ninyo
  rationale: Saklaw ng pandiwa ang paghahati o pamamahagi. Likas na ipinahihiwatig ng anyong “paghati-hatian” ang pagbabahagi sa loob ng pangkat.
- source_word: εἰς ἑαυτούς
  choice: paghati-hatian ninyo
  rationale: Ang panlaping at pag-uulit sa “paghati-hatian” ay likas na naghahayag ng pagtutumbasang “sa inyong magkakasama,” nang hindi nagiging mabigat ang pangungusap.
theological_decisions:
- issue: Kung gagamit ng wikang liturhikal o sakramental para sa εὐχαριστήσας at ποτήριον
  choice: 'Karaniwang wikang pasalaysay: “isang kopa” at “magpasalamat”'
  alternative: “ang kopa” o terminolohiyang may mas tahasang liturhikal na himig
  rationale: Isinasalaysay ng talata ang ginawa ni Jesus sa hapag ngunit hindi nito tahasang hinihingi ang mga katawagang nabuo sa kalaunang tradisyong pansimbahan. Pinananatili ng salin ang historikal na tagpo at iniiwasang magdagdag ng doktrinang hindi tahasang sinasabi ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kopa” bilang karaniwang salitang biblikal na mauunawaan sa konteksto, at iniwasan ang labis na teknikal o denominasyonal na pananalita.
