    rationale: Ang panghalip na “nito” ay may di-tiyak na tinutukoy, at ang nominal na “paggawad nito” ay hindi likas sa pangungusap. Hindi nito malinaw na naipapakita ang pandiwang paralelismo ng διατίθεμαι / διέθετό.
  - severity: low
    issue: Hindi gaanong idiomatiko ang alternatibong salin sa talababa.
    rationale: Ang “pakikipagtipan ng aking Ama na ibigay ito sa akin” ay mabigat at maaaring magpahiwatig ng mas tiyak na proposisyon kaysa sa pinahihintulutan ng Griyego. Maaaring ipahayag ang covenantal na posibilidad nang mas natural at maingat.
