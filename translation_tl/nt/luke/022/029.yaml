  source_fidelity: Tumpak ang pangunahing pagpili ng “iginagawad” para sa διατίθεμαι at ang “isang kaharian” para sa βασιλείαν. Gayunman, ang “gaya ng paggawad nito sa akin ng aking Ama” ay hindi malinaw na nagpapakita na ang Ama ang gumawa ng katumbas na pagkakaloob; ang “nito” ay maaari ring maling maunawaan bilang tumutukoy sa kaharian.
  naturalness: 'Marangal at modernong Filipino ang pangunahing rehistro, ngunit alanganin at mabigat ang nominal na pariralang “gaya ng paggawad nito sa akin ng aking Ama.” Mas natural at malinaw ang pandiwang paralelismo: “gaya ng iginawad sa akin ng aking Ama.”'
  terminology: Ang “iginagawad,” “kaharian,” at “aking Ama” ay angkop at pare-pareho ang rehistro. Ang talababa ay dapat ding ayusin upang maging idiomatiko ang alternatibong diwang tipan at huwag magpakilalang ang Ama ay nakipagtipan lamang upang “ibigay ito.”
