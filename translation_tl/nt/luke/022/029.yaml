translation:
  language: tl
  text: At iginagawad ko sa inyo ang isang kaharian, gaya ng iginawad sa akin ng aking Ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “At nakikipagtipan ako sa inyo tungkol sa isang kaharian, gaya ng pakikipagtipan sa akin ng aking Ama.” Ang pandiwang Griyego ay maaari ring magpahiwatig ng pakikipagtipan, bukod sa pormal na pagtatakda o pagkakaloob.'
    reason: alternative_reading
lexical_decisions:
- source_word: κἀγὼ
  choice: At ... ko
  rationale: Pinananatili ng “At” ang kaugnayan sa naunang pahayag, samantalang ang “ko” ay likas na naghahayag ng binigyang-diin na unang panauhan sa Filipino.
- source_word: διατίθεμαι
  choice: iginagawad ko
  rationale: Ang “iginagawad” ay natural na Filipino para sa pormal na pagkakaloob o pagtatalaga ng isang kaharian. Hindi nito nililimitahan ang pandiwa sa tahasang pakikipagtipan, bagaman maaaring taglayin iyon ng Griyego.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Tuwirang ipinakikita ang mga tumatanggap ng iginagawad.
- source_word: καθὼς
  choice: gaya ng
  rationale: Malinaw at natural na naghahayag ng pagtutulad sa ginawa ng Ama at sa ginagawa ni Jesus.
- source_word: διέθετό
  choice: paggawad
  rationale: Inuulit ang parehong salitang-ugat upang mapanatili ang paralelismo ng dalawang anyo ng διατίθημι sa Griyego. Ipinahihiwatig ng anyo ng pangungusap na nauna nang ginawa ito ng Ama.
- source_word: μοι
  choice: sa akin
  rationale: Likas at tuwirang pagpapahayag sa Filipino ng tumanggap.
- source_word: ὁ πατήρ μου
  choice: aking Ama
  rationale: Karaniwang marangal na anyo sa Filipino na pinananatili ang ugnayan ng Ama at Anak.
- source_word: βασιλείαν
  choice: isang kaharian
  rationale: Sa konteksto, tumutukoy ito sa iginawad na maharlikang paghahari o nasasakupan. Ang “isang kaharian” ay nagpapanatili sa konkretong larawan na umaayon sa kasunod na pagbanggit sa hapag at mga trono.
theological_decisions:
- issue: Kung tahasang gagamit ng wika ng pakikipagtipan para sa διατίθεμαι/διέθετό
  choice: iginagawad / paggawad
  alternative: nakikipagtipan akong ibigay / pakikipagtipan ng Ama na ibigay
  rationale: Maaaring may diwang tipan ang pandiwa, ngunit maaari rin itong mangahulugang pormal na pagkakaloob o pagtatakda. Pinili sa pangunahing teksto ang mas malawak at natural na “iginagawad,” habang inilalagay sa talababa ang posibleng kahulugang may kaugnayan sa tipan upang hindi sapilitang lutasin ang ambiguwidad.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “iginagawad” sa halip na ang mas literal ngunit alanganing “itinatalaga sa inyo ang isang kaharian.” Bahagyang inayos ang hulma ng Griyego para maging natural sa Filipino, ngunit pinanatili ang malinaw na paralelismo ng pagkakaloob ni Jesus at ng Ama.
