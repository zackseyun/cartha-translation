translation:
  language: tl
  text: At marami pa silang ibang salitang lapastangan na sinasabi laban sa kanya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “marami pa silang ibang salitang mapang-insulto” o “marami pa silang ibang salitang mapang-abuso.” Mas malawak ang maaaring saklaw ng salitang Griyego kaysa sa tahasang pamumusong, ngunit mabigat ang diwa nito rito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa kanya.” Mas literal itong salin ng pang-ukol na Griyego, ngunit sa kontekstong ito, mas malinaw na naipapahayag ng “laban sa kanya” ang mapanlabang pananalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Payak na pang-ugnay ito sa naunang pang-aabuso at natural na nagpapatuloy sa salaysay.
- source_word: ἕτερα πολλὰ
  choice: marami pa
  rationale: Natural na Filipino para sa maraming karagdagang bagay na sinabi bukod sa mga nauna.
- source_word: βλασφημοῦντες
  choice: sinasabing lapastangan
  rationale: Pinananatili ng “lapastangan” ang bigat ng βλασφημέω, na maaaring tumukoy sa mapang-insulto, mapanirang-puri, o pamumusong na pananalita, nang hindi ipinipilit na pangalanan dito ang eksaktong uri ng paglapastangan.
- source_word: ἔλεγον
  choice: sinasabi
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang nagpapatuloy o paulit-ulit na pagsasalita; likas itong naipapahayag ng “sinasabi” sa Filipino.
- source_word: εἰς αὐτόν
  choice: laban sa kanya
  rationale: Sa konteksto ng mapanlait na pananalita, malinaw nitong naihahatid ang salungat at mapanlabang puwersa ng parirala.
theological_decisions:
- issue: Kung ang βλασφημοῦντες ay isasalin lamang bilang karaniwang pang-iinsulto o pananatilihin ang mas mabigat na diwa
  choice: Panatilihin ang mas mabigat na diwa sa “lapastangan”
  alternative: mapang-insulto; mapang-abuso; namumusong
  rationale: Malawak ang saklaw ng salitang Griyego at hindi dapat pahinain sa karaniwang insulto lamang. Ang “lapastangan” ay nagpapanatili ng tindi habang hindi rin tahasang nilulutas kung ang diin ay relihiyosong pamumusong o mas malawak na mapanirang pananalita.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “lapastangan” upang mapanatili ang lakas ng orihinal; inilagay ang mga marker pagkatapos ng pangungusap at tumutugma ang bawat isa sa tala.
