source:
  edition: SBLGNT
  text: ὑμεῖς δὲ οὐχ οὕτως, ἀλλ’ ὁ μείζων ἐν ὑμῖν ⸀γινέσθω ὡς ὁ νεώτερος, καὶ ὁ ἡγούμενος ὡς ὁ διακονῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/026.yaml
  text: But you are not to be like that[a]. Instead, let the greater among you become like the younger[b], and the one who leads like the one who serves.
translation:
  language: tl
  text: Ngunit hindi dapat maging ganoon sa inyo.[a] Sa halip, ang nakatataas sa inyo ay maging tulad ng nakababata,[b] at ang namumuno ay maging tulad ng naglilingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ngunit hindi ganoon sa inyo.” Eliptikal at mariin ang Griyego, at matalas nitong inihihiwalay ang mga alagad ni Jesus mula sa paghahangad ng katayuang inilarawan sa naunang talata.
    reason: alternative_reading
  - marker: b
    text: Ang “nakababata” ay tumutukoy sa taong mas mababa ang katayuan sa lipunan dahil sa pagiging nakababata, hindi lamang sa edad.
    reason: cultural_note
lexical_decisions:
- source_word: ὑμεῖς δὲ οὐχ οὕτως
  choice: Ngunit hindi dapat maging gayon sa inyo
  rationale: Pinananatili ang matalim at mariing paghahambing sa naunang huwaran ng mga pinuno ng mga bansa, habang likas na ipinahihiwatig sa Tagalog ang eliptikong pagbabawal.
- source_word: ἀλλ’
  choice: Sa halip
  rationale: Malinaw at natural na ipinakikilala ang positibong tagubilin na salungat sa naunang gawi.
- source_word: ὁ μείζων ἐν ὑμῖν
  choice: ang nakatataas sa inyo
  rationale: Ipinahahayag ang paghahambing na katayuang panlipunan ng μείζων nang hindi ito ginagawang pasukdol na 'pinakadakila.'
- source_word: γινέσθω
  choice: ay maging
  rationale: Pinananatili ang pautos at ang diwa ng pagkuha o pagkakaroon ng ibang asal o papel, sa natural na anyong Tagalog.
- source_word: ὡς ὁ νεώτερος
  choice: tulad ng nakababata
  rationale: Pinananatili ang pahambing na 'nakababata,' hindi 'pinakabata'; maaari rin itong tumukoy sa taong mas mababa ang katayuan dahil sa pagiging junior.
- source_word: ὁ ἡγούμενος
  choice: ang namumuno
  rationale: Inilalarawan ang gumaganap na pamumuno nang hindi nag-aangkat ng tiyak na katungkulang pansimbahan o labis na politikal na himig.
- source_word: ὡς ὁ διακονῶν
  choice: maging tulad ng naglilingkod
  rationale: Pinananatili ang aktibong diwa ng patuloy na paglilingkod sa halip na gawing isang institusyonal na titulo.
theological_decisions:
- issue: Ang kalikasan ng tagubilin ni Jesus tungkol sa katayuan at pamumuno
  choice: 'Ipakita ang pagbabaligtad ng karaniwang katayuang panlipunan sa pamayanan ng mga alagad: ang nakatataas at namumuno ay dapat umasal bilang nakabababa at naglilingkod.'
  alternative: Gumamit ng mas mariing institusyonal na pananalita tungkol sa katungkulan o pamamahala.
  rationale: Tahasang inihahambing ng Griyego ang nakatataas sa nakababata at ang namumuno sa naglilingkod. Pinananatili nito ang panawagan sa mapagpakumbabang paglilingkod nang hindi nag-aangkat ng mas huling kaayusang eklesiyastiko.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “nakatataas” upang ihayag ang katayuan sa halip na ang mas malabong “mas dakila,” at pinanatili ang magkatugmang pandiwang “namumuno” at “naglilingkod.”
