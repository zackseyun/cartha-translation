  source_fidelity: Tumpak na naihahatid ng talata ang mariing pagsalungat sa naunang huwaran, ang pautos na γινέσθω (“ay maging”), ang pahambing na katayuan ng μείζων at νεώτερος, at ang pagtutulad ng namumuno sa naglilingkod. Hindi nito ginagawang pasukdol ang mga pahambing o ipinapasok ang institusyonal na kahulugan.
  naturalness: 'Malinaw at angkop sa modernong Filipino Tagalog ang pangunahing salin. Isang munting pag-aayos sa tala ang kailangan: mas natural at mas tumpak ang “eliptikal” kaysa “eliptiko,” at maiiwasan ang hindi kinakailangang halong Ingles na “junior.”'
  terminology: Ang “nakatataas,” “nakababata,” “namumuno,” at “naglilingkod” ay magkakatugma at angkop sa konteksto ng katayuan at mapagpakumbabang paglilingkod. Pinananatili ng tala ang saklaw na panlipunan ng “nakababata” nang hindi ikinukubli ang payak na kahulugang pang-edad.
  issues:
