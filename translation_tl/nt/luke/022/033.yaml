id: LUK.22.33
reference: Luke 22:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Κύριε, μετὰ σοῦ ἕτοιμός εἰμι καὶ εἰς φυλακὴν καὶ εἰς θάνατον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/033.yaml
  text: But he said to him, “Lord, I am ready to go with you both to prison and to death.”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanya, “Panginoon, handa akong sumama sa iyo, kapuwa sa bilangguan at sa kamatayan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ngunit ... niya
  rationale: Ginagamit ang artikulo bilang panghalip na tumutukoy kay Pedro, at ipinahihiwatig ng δέ ang banayad na pagsalungat sa naunang sinabi ni Jesus. Likas sa Filipino ang “Ngunit sinabi niya.”
- source_word: εἶπεν αὐτῷ
  choice: sinabi niya sa kanya
  rationale: Pinananatili nito ang di-tahasang tinutukoy ng αὐτῷ at ang payak na diwa ng λέγω nang hindi ipinapasok ang pangalan ni Jesus sa mismong talata.
- source_word: Κύριε
  choice: Panginoon
  rationale: Karaniwang katumbas ito ng κύριος at pinananatili ang paggalang at teolohikal na bigat ng titulo sa tuwirang pakikipag-usap kay Jesus.
- source_word: μετὰ σοῦ
  choice: sumama sa iyo
  rationale: Ang μετά na may genitive ay nagsasaad ng pagsama. Isinama ito sa pandiwang “sumama” upang maging natural sa Filipino habang malinaw na si Pedro ay sasabay kay Jesus.
- source_word: ἕτοιμός εἰμι
  choice: handa akong
  rationale: Natural at tuwirang ipinahahayag nito ang kahandaan at matibay na pagtitiwala ni Pedro sa sarili.
- source_word: καὶ ... καὶ
  choice: kapuwa ... at
  rationale: Ipinakikita ng magkapares na anyo ang magkatimbang at mariing pag-uugnay sa bilangguan at kamatayan.
- source_word: εἰς φυλακὴν
  choice: sa bilangguan
  rationale: Sa kontekstong ito, ang φυλακή ay lugar o kalagayan ng pagkabilanggo; “bilangguan” ang dignified at madaling maunawaang katumbas.
- source_word: εἰς θάνατον
  choice: sa kamatayan
  rationale: Pinananatili nito ang parallel na estruktura at ang sukdulang kahandaang ipinapahayag ni Pedro.
- source_word: πορεύεσθαι
  choice: sumama
  rationale: Bagaman literal na tumutukoy sa pagpunta, kasama ng μετὰ σοῦ ay mas natural itong isalin na “sumama sa iyo,” na pinananatili ang diwa ng pagpunta kasama ni Jesus.
theological_decisions:
- issue: Pagtutumbas sa κύριος bilang titulo ni Jesus
  choice: Panginoon
  alternative: Guro
  rationale: Ang “Panginoon” ay nagpapanatili sa karaniwang titularyong kahulugan at posibleng kristolohikal na bigat ng κύριος, nang hindi ito nililimitahan sa papel na tagapagturo lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapuwa ... at” upang mapanatili ang diin ng dobleng καί, at “sumama sa iyo” upang likas na pagsamahin sa Filipino ang πορεύεσθαι at μετὰ σοῦ.
