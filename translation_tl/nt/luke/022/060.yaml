translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang “Lalaki” upang mapanatili ang tahasang panawag na Ἄνθρωπε; bagaman medyo matalim sa Tagalog, naaayon ito sa tensiyon ng tagpo. Walang talababa dahil walang makabuluhang leksikal na alternatibong kailangang ipabatid sa karaniwang mambabasa.
