  text: εἶπεν δὲ ὁ Πέτρος· Ἄνθρωπε, οὐκ οἶδα ὃ λέγεις. καὶ παραχρῆμα ἔτι λαλοῦντος αὐτοῦ ἐφώνησεν ἀλέκτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/060.yaml
  text: But Peter said[a], “Man, I do not know what you are saying.” And immediately, while he was still speaking, a rooster crowed.
translation:
  language: tl
  text: Ngunit sinabi ni Pedro, “Tao, hindi ko alam ang sinasabi mo.” At kaagad, habang nagsasalita pa siya, tumilaok ang isang tandang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang pagsalungat ng tugon ni Pedro sa paratang sa naunang konteksto.
- source_word: Ἄνθρωπε
  choice: Lalaki
  rationale: Tuwirang panawag sa isang lalaking kausap; pinananatili ang matalim at di-pormal na himig nang hindi dinaragdagan ng paggalang na nasa “ginoo.”
- source_word: οὐκ οἶδα
  choice: hindi ko alam
  rationale: Natural na makabagong Tagalog para sa pandiwang οἶδα na may pangkasalukuyang diwa at pagtanggi.
- source_word: ὃ λέγεις
  choice: ang sinasabi mo
  rationale: Tuwirang inililipat ang kahulugan ng sugnay at iniiwasang gawing mas interpretatibong “ang ibig mong sabihin.”
- source_word: παραχρῆμα
  choice: kaagad
  rationale: Malinaw na nagsasaad na nangyari ito nang walang pagkaantala.
- source_word: ἔτι λαλοῦντος αὐτοῦ
  choice: habang nagsasalita pa siya
  rationale: Natural na inilalarawan ang magkasabay na pagkilos at pinananatili ang diin ng ἔτι sa patuloy na pagsasalita.
- source_word: ἐφώνησεν ἀλέκτωρ
  choice: tumilaok ang isang tandang
  rationale: Ang “tumilaok” ang karaniwang pandiwa sa Tagalog para sa sigaw ng tandang, at ang “isang tandang” ay nagpapanatili sa di-tiyak na pangngalan.
