id: LUK.22.57
reference: Luke 22:57
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἠρνήσατο λέγων· ⸂Οὐκ οἶδα αὐτόν, γύναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/057.yaml
  text: But he denied it[a], saying, “I do not know him[b], woman.”
translation:
  language: tl
  text: Ngunit itinanggi niya iyon[a] at sinabi, “Hindi ko siya kilala, babae.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas pormal na anyo: “Ngunit nagkaila siya at sinabi …” Walang tahasang layon ang “nagkaila” sa Griyego; idinagdag ang “iyon” para sa natural na Tagalog.'
    reason: lexical_alternative
  - marker: b
    text: Ang “babae” ay salin ng bokatibong γύναι, isang tuwirang pagtawag sa babaeng kausap. Ang “ginang” ay posibleng mas magalang na salin ngunit mas interpretibo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσατο
  choice: itinanggi niya iyon
  rationale: Ang ἀρνέομαι ay nangangahulugang magkaila o tumanggi sa isang pahayag. Walang tahasang layon sa Griyego, ngunit likas sa Tagalog na ilagay ang “iyon” upang tukuyin ang paratang na itinatanggi ni Pedro nang hindi ipinapalagay na si Jesus mismo ang tahasang layon ng pandiwa.
- source_word: λέγων
  choice: at sinabi
  rationale: Ipinakikilala ng kasalukuyang participle ang mismong sinabi sa pagkakaila. Mas natural sa modernong Tagalog ang “at sinabi” kaysa sa literal ngunit mabigat na “na sinasabi.”
- source_word: Οὐκ οἶδα
  choice: Hindi ko … kilala
  rationale: Sa pagtukoy sa isang tao, ang natural at tuwirang katumbas ng οἶδα sa Tagalog ay “kilala,” hindi lamang “alam.”
- source_word: αὐτόν
  choice: siya
  rationale: Ang panlalaking panghalip ay tumutukoy kay Jesus. Pinananatili ng “siya” ang anyong panghalip at hindi ito pinalalawak bilang “ang taong ito.”
- source_word: γύναι
  choice: babae
  rationale: Ang γύναι ay bokatibong tuwirang pagtawag sa isang babae. Ang “babae” ang pinakamalapit na katumbas; ang “ginang” ay magdaragdag ng antas ng paggalang na hindi tahasang ipinahihiwatig ng salita.
theological_decisions:
- issue: Kung lalagyan ng tahasang layon ang pagkakaila ni Pedro
  choice: “itinanggi niya iyon” upang ang “iyon” ay tumukoy sa paratang o pahayag ng babae
  alternative: “nagkaila siya” o “itinanggi niya siya”
  rationale: Walang tahasang layon ang ἠρνήσατο. Natural sa Tagalog ang “itinanggi niya iyon,” samantalang ang “itinanggi niya siya” ay maaaring magpasya nang lampas sa Griyego na si Jesus mismo ang gramatikal na layon. Nakatutulong ang talababa upang mapanatili ang tunay na kawalan ng tahasang layon sa orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ngunit” para sa mahinahong salungatan at ang natural na ayos na “Hindi ko siya kilala.” Pinanatili ang tuwirang “babae” dahil ito ang pinakamalapit sa Griyego, habang ipinaliliwanag sa talababa ang mas magalang ngunit interpretibong alternatibo.
