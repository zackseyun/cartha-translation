  yaml_path: translation/nt/luke/022/063.yaml
  text: And the men who were holding him mocked him while beating him,[a]
translation:
  language: tl
  text: At nililibak siya ng mga lalaking humahawak sa kanya habang binubugbog siya,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ng mga lalaking nagpipigil sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at ang daloy ng salaysay nang hindi nagdaragdag ng tiyak na panahong pahiwatig.
- source_word: οἱ ἄνδρες
  choice: ang mga lalaki
  rationale: Tuwirang sinasalamin ang pangkalahatang katawagang Griyego; hindi ito pinakitid sa “mga bantay” o “mga kawal.”
- source_word: οἱ συνέχοντες αὐτόν
  choice: nagbabantay sa kanya
  rationale: Sa kontekstong ito, ang συνέχω ay tumutukoy sa pagpapanatili kay Jesus sa kanilang pangangalaga o kustodiya. Likas sa modernong Tagalog ang “nagbabantay sa kanya,” samantalang ang “pumipigil” ay maaaring magpahiwatig lamang ng panandaliang pisikal na pagpigil.
- source_word: ἐνέπαιζον αὐτῷ
  choice: nililibak siya
  rationale: Ipinahahayag ng “nililibak” ang mapanlait at mapanghamak na panunuya ng ἐμπαίζω, sa natural at marangal na modernong Tagalog.
- source_word: δέροντες
  choice: habang binubugbog
  rationale: Ipinakikita ng “habang” na kasabay at nagpapatuloy ang pananakit habang nililibak siya. Hindi ginamit ang mas espesipikong “hinahagupit,” sapagkat hindi tinutukoy ng salita ang isang partikular na paraan ng pagpalo.
theological_decisions:
- issue: Pagkakakilanlan sa mga nang-abuso kay Jesus
  choice: ang mga lalaki
  alternative: ang mga bantay
  rationale: ἄνδρες ang tahasang ginamit ng teksto. Bagaman ipinahihiwatig ng konteksto na may tungkulin silang magbantay o magpanatili sa kustodiya, hindi sila tinatawag ng talata na “mga bantay.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignipikado, at madaling maunawaan. Pinanatili ang pangkalahatang “mga lalaki” at inilagay sa talababa ang mas kongkretong alternatibo para sa συνέχοντες.
