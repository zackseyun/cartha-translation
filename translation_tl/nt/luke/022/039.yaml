  source_fidelity: 'Tapat ang salin sa Griyego: ang “Pagkalabas niya” ay angkop para sa ἐξελθών, “pumunta siya” para sa ἐπορεύθη, at ang “ayon sa nakagawian” ay pinananatiling hindi tahasang binabanggit ang may-ari ng nakagawian, gaya ng κατὰ τὸ ἔθος. Naihatid din ang patutunguhan at ang additive na pagsunod ng mga alagad.'
