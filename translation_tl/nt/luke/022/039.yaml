id: LUK.22.39
reference: Luke 22:39
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐπορεύθη κατὰ τὸ ἔθος εἰς τὸ Ὄρος τῶν Ἐλαιῶν· ἠκολούθησαν δὲ αὐτῷ καὶ οἱ ⸀μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/039.yaml
  text: And going out[a], he went as was his custom to the Mount of Olives, and the disciples also followed him.
translation:
  language: tl
  text: Pagkalabas niya, pumunta siya sa Bundok ng mga Olibo, ayon sa nakagawian. Sumunod din sa kanya ang mga alagad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Pagkalabas niya
  rationale: Ipinahahayag ng aorist participle ang kilos na nauna sa pangunahing pandiwa. Likas sa modernong Tagalog ang sugnay na “Pagkalabas niya” at malinaw na si Jesus ang paksa ayon sa konteksto.
- source_word: ἐπορεύθη
  choice: pumunta siya
  rationale: Payak at natural na salin ng karaniwang pandiwang pasalaysay na πορεύομαι.
- source_word: κατὰ τὸ ἔθος
  choice: ayon sa nakagawian
  rationale: Pinananatili nito ang di-tahasang anyo ng Griyego, na hindi direktang nagsasabing “niya,” habang malinaw pa rin sa konteksto na tumutukoy ito sa nakagawian ni Jesus.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: sa Bundok ng mga Olibo
  rationale: Ginamit ang kinikilalang anyo ng pangalan ng lugar sa Tagalog; ang εἰς ay likas na naipapahayag ng “sa” kasunod ng “pumunta.”
- source_word: ἠκολούθησαν
  choice: Sumunod
  rationale: Tuwirang inilalarawan nito ang pagsunod sa paglalakbay at hindi inaalis ang ugnayan ng mga alagad kay Jesus.
- source_word: οἱ μαθηταί
  choice: ang mga alagad
  rationale: Karaniwan, malinaw, at dignified na katawagan sa Tagalog; hindi idinagdag ang “niya,” na wala namang tahasang katumbas sa Griyego.
- source_word: δὲ ... καὶ
  choice: din
  rationale: 'Ang “din” ay natural na nagpapahayag ng banayad na pagpapatuloy at additive na diin: sumunod din ang mga alagad.'
theological_decisions:
- issue: Kung tahasang sasabihing kay Jesus ang nakagawian
  choice: ayon sa nakagawian
  alternative: gaya ng nakagawian niya
  rationale: Bagaman malinaw sa konteksto na si Jesus ang tinutukoy, walang tahasang panghalip na “niya” sa pariralang κατὰ τὸ ἔθος. Pinananatili ng napiling salin ang kaiklian at bahagyang di-pagtukoy ng orihinal nang hindi nagiging malabo sa karaniwang mambabasa.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Hinati sa dalawang pangungusap upang maging natural ang daloy ng salaysay, habang pinanatili ang additive na puwersa ng καὶ sa “din.”
