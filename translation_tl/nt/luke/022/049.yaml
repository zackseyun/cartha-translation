base_translation:
  language: en
  yaml_path: translation/nt/luke/022/049.yaml
  text: And when those around him saw what was about to happen[a], they said, “Lord, shall we strike with the sword?”
translation:
  language: tl
  text: Nang makita ng mga nasa paligid niya ang malapit nang mangyari, sinabi nila, “Panginoon, tataga ba kami gamit ang tabak[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gamit ang isang tabak.” Ang salitang Griyego ay maaaring tumukoy sa tabak, mas maikling talim, o punyal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Nang makita
  rationale: Ginawang sugnay na panahunan ang aorist participle upang maging likas sa Tagalog habang pinananatili ang kaugnayan nito sa pangunahing pandiwa.
- source_word: οἱ περὶ αὐτὸν
  choice: mga kasama niya
  rationale: Tumutukoy ang idyoma sa mga taong naroon sa paligid ni Jesus. Likas sa Tagalog ang “mga kasama niya” at hindi nito nililimitahan ang tinutukoy nang higit sa Griyego.
- source_word: τὸ ἐσόμενον
  choice: ang mangyayari
  rationale: Ipinahahayag ng articular future participle ang nalalapit na pangyayari; malinaw at natural sa Tagalog ang “ang mangyayari” sa konteksto.
- source_word: εἶπαν
  choice: sinabi nila
  rationale: Pinanatili ang karaniwang kahulugan ng λέγω na “sabihin,” kahit patanong ang tuwirang sipi.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang magalang at teolohikal na bigat ng τίτulong κύριος sa tuwirang pagtawag kay Jesus.
- source_word: εἰ πατάξομεν
  choice: tataga ba kami
  rationale: Ang εἰ kasama ng future indicative ay bumubuo rito ng tanong na humihingi ng pasiya. Ang “tataga ba kami” ay likas na Tagalog at angkop sa paggamit ng isang tabak o maikling talim.
- source_word: ἐν μαχαίρῃ
  choice: gamit ang tabak
  rationale: Instrumental ang ἐν dito. Ang μάχαιρα ay maaaring tabak, maikling tabak, o punyal; “tabak” ang malinaw na pangunahing salin nang hindi ipinapalagay ang tiyak na haba ng sandata.
theological_decisions:
- issue: Pagsasalin ng κύριος bilang tuwirang tawag kay Jesus
  choice: Panginoon
  alternative: Guro
  rationale: Ang “Panginoon” ay nagpapanatili sa bigat ng titulo at sa posibleng teolohikal na pahiwatig nito, sa halip na gawin lamang itong panlipunang katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tataga” kaysa sa mas pangkalahatang “hahampas” upang natural na ipahayag ang pag-atakeng ginagawa gamit ang tabak, ngunit hindi tinukoy kung sino ang tatagain.
