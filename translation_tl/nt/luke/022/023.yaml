  yaml_path: translation/nt/luke/022/023.yaml
  text: And they began to discuss among themselves which one of them might be the one about to do this[a].
translation:
  language: tl
  text: At nagsimula silang mag-usap-usap kung sino kaya sa kanila ang malapit nang gumawa nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung sino kaya sa kanila ang siyang malapit nang gumawa nito.” Ang “nito” ay tumutukoy sa pagtataksil na sinabi sa naunang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: nagsimula
  rationale: Tuwirang ipinahahayag ang pagsisimula ng kilos na nasa aorist na ἤρξαντο.
- source_word: συζητεῖν πρὸς ἑαυτούς
  choice: mag-usap-usap
  rationale: Natural na Filipino para sa talakayang magkakasama sa loob ng grupo, nang hindi ipinapalagay na mainit na pagtatalo iyon.
- source_word: τὸ τίς ἄρα εἴη ἐξ αὐτῶν
  choice: kung sino kaya sa kanila
  rationale: Ang “kung sino” ay natural para sa di-tuwirang tanong, at ang “kaya” ay nagpapanatili sa mapagpalagay at nag-aalinlangang puwersa ng ἄρα at optative na εἴη.
- source_word: μέλλων πράσσειν
  choice: ang gagawa
  rationale: Sa Filipino, likas na naipahihiwatig ng anyong panghinaharap ang nalalapit na kilos; ang mas literal na “malapit nang gumawa” ay mabigat sa pangungusap.
- source_word: τοῦτο
  choice: nito
  rationale: Pinananatili ang pangkalahatang pantukoy na bumabalik sa kilos na binanggit sa naunang talata, nang hindi tahasang idinaragdag ang “pagtataksil” sa pangunahing teksto.
theological_decisions:
- issue: Kung tahasang tatawaging pagtataksil ang kilos
  choice: Panatilihin ang “gagawa nito” sa pangunahing teksto.
  alternative: “ang magkakanulo sa kanya”
  rationale: Bagaman malinaw sa konteksto na pagtataksil ang tinutukoy, τοῦτο μέλλων πράσσειν ay literal na tumutukoy sa “gagawa nito.” Pinananatili nito ang paraan ng pagpapahayag ng Griyego at hinahayaang ang naunang talata ang maglinaw sa tinutukoy.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “mag-usap-usap” sa halip na mas pormal na “magtalakayan” upang maging malinaw sa karaniwang mambabasa, nang hindi pinatitindi ang tono bilang pagtatalo.
