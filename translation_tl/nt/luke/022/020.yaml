  naturalness: Natural at marangal ang kabuuang Filipino. Mas maayos ang “matapos kumain” bilang tuwirang katumbas ng μετὰ τὸ δειπνῆσαι, bagaman katanggap-tanggap din ang “pagkatapos ng hapunan.” Ang “kopa” at “bagong tipan” ay malinaw at angkop sa modernong Filipino.
