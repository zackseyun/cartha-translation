base_translation:
  language: en
  yaml_path: translation/nt/luke/022/020.yaml
  text: And likewise the cup after supper[a], saying, “This cup is the new covenant in my blood[b], which is poured out for you.”
translation:
  language: tl
  text: Gayon din, matapos kumain, ibinigay niya ang kopa at sinabi, “Ang kopang ito ang bagong tipan[a] sa aking dugo, na ibinubuhos para sa inyo.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bagong testamento.”
    reason: alternative_reading
  - marker: b
    text: Sa Griyego, ang “na ibinubuhos para sa inyo” ay nasa hulihan ng buong pahayag at sa anyong pambalarila ay maaaring iugnay sa “kopa.” Gayunman, ang pinakalikas na diwa ay ang dugo ni Jesus ang ibinubuhos para sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποτήριον
  choice: kopa
  rationale: Karaniwan at marangal na salita para sa sisidlang inuman; iniiwasan ang mas liturhikal na dating ng “kalis.”
- source_word: ὡσαύτως
  choice: Gayon din
  rationale: Malinaw na inuugnay ang ginawa sa kopa sa naunang ginawa sa tinapay.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: pagkatapos ng hapunan
  rationale: Likas na Filipino na nagpapanatili sa pagkakasunod-sunod ng pangyayari.
- source_word: λέγων
  choice: at sinabi
  rationale: Natural na inilalahad sa Filipino ang kasabay na pandiwaring Griyego bilang may-hanggang pandiwa.
- source_word: καινὴ διαθήκη
  choice: bagong tipan
  rationale: Ang “tipan” ang malinaw na katumbas sa kontekstong biblikal ng kasunduang itinatatag ng dugo at pinananatili ang kaugnayan sa Lumang Tipan.
- source_word: ἐν τῷ αἵματί μου
  choice: sa aking dugo
  rationale: Pinananatili ang malawak na saklaw ng Griyegong ἐν nang hindi ito agad nililinaw bilang “sa pamamagitan ng” o “dahil sa.”
- source_word: τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: na ibinubuhos para sa inyo
  rationale: Ang “para sa inyo” ay natural na naghahatid ng kapakinabangan at mapaghandog na diwa ng ὑπὲρ nang hindi nagdaragdag ng isang tiyak na teorya ng pagtubos.
theological_decisions:
- issue: Kahulugan ng διαθήκη sa pormula tungkol sa dugo
  choice: bagong tipan
  alternative: bagong testamento
  rationale: Ipinahihiwatig ng konteksto ang wikang ginagamit sa pagtatatag ng tipan sa pamamagitan ng dugo; mas malinaw sa modernong Filipino ang “tipan,” samantalang ang “testamento” ay maaaring maunawaan bilang huling habilin.
- issue: Tinutukoy ng ἐκχυννόμενον
  choice: Inilapit sa “aking dugo” sa salin, ngunit ipinaliwanag sa talababa ang ayos ng Griyego
  alternative: Mahigpit na iugnay sa “kopa” ayon sa anyong pambalarila
  rationale: Bagaman ang anyong pambalarila at puwesto ng parirala ay maaaring iugnay sa kopa, ang likas na diwa ay ang dugong ibinubuhos. Ang talababa ang nagpapanatili sa sintaktikong tensiyon.
- issue: Di-hayag na kilos sa sugnay tungkol sa kopa
  choice: kinuha niya ang kopa
  alternative: Gayon din ang kopa pagkatapos ng hapunan
  rationale: Elliptical ang Griyego at umaasa sa naunang kilos sa tinapay. Tahasang inuulit sa Filipino ang kilos upang maging buo at natural ang pangungusap, nang walang idinaragdag na bagong pangyayari.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kopa” sa halip na mas liturhikal na “kalis,” at “tipan” upang malinaw na mapanatili ang biblikal na konteksto. Ang elipsis ng Griyego ay nilinaw sa pamamagitan ng “kinuha niya” batay sa naunang kilos sa tinapay.
