  text: ⸀περιαψάντων δὲ πῦρ ἐν μέσῳ τῆς αὐλῆς καὶ ⸀συγκαθισάντων ἐκάθητο ὁ Πέτρος ⸀μέσος αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/055.yaml
  text: And after they had kindled a fire in the middle of the courtyard and sat down together[a], Peter was sitting among them.
translation:
  language: tl
  text: Matapos silang magsindi ng apoy sa gitna ng patyo at sama-samang umupo, nakaupo si Pedro sa gitna nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Umupo si Pedro sa gitna nila.” Gayunman, mas malinaw na ipinakikita ng “nakaupo” ang nagpapatuloy na kalagayan sa tagpo.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιαψάντων
  choice: Nagsindi sila
  rationale: Ang aorist participle ay tumutukoy sa pagsisindi ng apoy na naganap bago ang kalagayang inilalarawan ng pangunahing pandiwa; natural itong maisinasalaysay sa Filipino bilang sunod-sunod na pangyayari.
- source_word: πῦρ
  choice: ng apoy
  rationale: Karaniwang gamit sa Filipino ang “nagsindi ng apoy”; hindi kailangan ng pantukoy na katumbas ng English indefinite article.
- source_word: ἐν μέσῳ τῆς αὐλῆς
  choice: sa gitna ng patyo
  rationale: Pinananatili ang tiyak at kongkretong lokasyon. Ang “patyo” ay natural na tawag sa bukás na looban ng tirahan.
- source_word: συγκαθισάντων
  choice: sama-samang naupo
  rationale: Ipinahahayag ng σύν ang magkakasamang pag-upo, at ang “naupo” ay natural na paglalarawan sa pagkuha nila ng puwesto.
- source_word: ἐκάθητο
  choice: Nakaupo
  rationale: Ang anyong imperfect ay naglalarawan ng nagpapatuloy na kalagayan sa tagpo; malinaw itong naihahayag ng “nakaupo.”
- source_word: μέσος αὐτῶν
  choice: sa gitna nila
  rationale: Pinananatili ang spatial na diwa na si Pedro ay nasa loob o kalagitnaan ng pangkat, sa halip na gawing mas malabo lamang na “kasama nila.”
- source_word: δὲ
  choice: Asyndetic narrative transition
  rationale: Hindi na isinalin nang tahasan sapagkat likas sa modernong Filipino ang pagpapatuloy ng salaysay nang walang “at” o “pagkatapos,” at malinaw pa rin ang ugnayan ng mga pangyayari.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “patyo” para sa αὐλή at iniwasan ang mas pormal ngunit hindi gaanong pangkaraniwang “looban.” Ang paghahati sa dalawang pangungusap ay nagpapanatili ng malinaw at natural na daloy ng salaysay.
