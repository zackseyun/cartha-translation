  text: καὶ ἐρεῖτε τῷ οἰκοδεσπότῃ τῆς οἰκίας· Λέγει σοι ὁ διδάσκαλος· Ποῦ ἐστιν τὸ κατάλυμα ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/011.yaml
  text: And you will say to the master of the house[a], ‘The Teacher says to you, “Where is the guest room where I may eat the Passover with my disciples?”’
translation:
  language: tl
  text: At sasabihin ninyo sa namamahala sa bahay, “Sinasabi sa iyo ng Guro, ‘Nasaan ang silid-panauhin[a] kung saan ko makakain ng Paskuwa kasama ng aking mga alagad?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tuluyan.” Ang Griyegong κατάλυμα ay tumutukoy sa isang lugar na matutuluyan o silid para sa panauhin; hindi ito partikular na nangangahulugang “bahay-panuluyan” dito. Sa kasunod na talata pa ito inilalarawang isang malaking silid sa itaas na may mga kagamitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδεσπότῃ τῆς οἰκίας
  choice: may-ari ng bahay
  rationale: Sa konteksto, tumutukoy ito sa taong namamahala sa sambahayan. Ang “may-ari ng bahay” ay natural at malinaw sa makabagong Tagalog, bagaman hindi ipinipilit ng salita ang legal na pagmamay-ari.
- source_word: ὁ διδάσκαλος
  choice: ang Guro
  rationale: Tuwirang isinasalin ang titulong διδάσκαλος at pinananatili ang gamit nito bilang kinikilalang pantukoy kay Jesus.
- source_word: κατάλυμα
  choice: silid-panauhin
  rationale: Tumutukoy ito sa lugar na matutuluyan o silid para sa mga panauhin. Ang “silid-panauhin” ay akma sa kontekstong pambahay at hindi ipinapasok nang maaga ang “silid sa itaas,” na sa kasunod na talata pa tinutukoy.
- source_word: τὸ πάσχα
  choice: Paskuwa
  rationale: Pinananatili ang pangalan ng kapistahang Judio. Dahil sa pandiwang “kumain,” malinaw sa konteksto na ang hapunang Paskuwa ang tinutukoy nang hindi kailangang idagdag ang salitang “hapunan.”
- source_word: μετὰ τῶν μαθητῶν μου
  choice: kasama ng aking mga alagad
  rationale: Ang “mga alagad” ay natural na katawagan sa mga tagasunod na tinuturuan ni Jesus at higit sa karaniwang mga estudyante ang ipinahihiwatig.
- source_word: φάγω
  choice: mapagkakainan ko
  rationale: Inihahatid ng anyong ito ang hinaharap o nilalayong pagkilos sa tanong tungkol sa lugar, nang natural sa Tagalog at hindi labis na pormal.
- source_word: ἐρεῖτε
  choice: sasabihin ninyo
  rationale: Pinananatili ang anyong panghinaharap na gumaganap dito bilang tagubilin sa sasabihin ng mga alagad.
theological_decisions:
- issue: Ang titulo ni Jesus na διδάσκαλος
  choice: ang Guro
  alternative: ang guro; ang Panginoon
  rationale: Ang “Guro” ang tuwirang kahulugan ng Griyego at pinananatili itong titulo sa pahayag. Ang “Panginoon” ay magdadagdag ng ibang titulong teolohikal na wala sa salitang ginamit dito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sasabihin ninyo” para sa maramihang kausap at ang payak na ayos ng tuwirang pananalita. Ang “silid-panauhin” ay piniling mas natural kaysa “silid para sa mga panauhin” habang nananatiling tumpak.
