  text: εἶπεν ⸀δὲ Ἰησοῦς πρὸς τοὺς παραγενομένους ἐπ’ αὐτὸν ἀρχιερεῖς καὶ στρατηγοὺς τοῦ ἱεροῦ καὶ πρεσβυτέρους· Ὡς ἐπὶ λῃστὴν ⸀ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/052.yaml
  text: But Jesus said to the chief priests[a], the officers of the temple, and the elders who had come against him, “Have you come out as against a robber, with swords and clubs?”
translation:
  language: tl
  text: Ngunit sinabi ni Jesus sa mga punong pari, mga pinuno ng bantay sa templo, at mga nakatatanda na dumating laban sa kanya, “Lumabas ba kayo laban sa akin na para bang sa isang tulisan[a], na may mga espada at pamalo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magnanakaw,” “bandido,” o “rebelde.” Ang salitang Griego na λῃστής ay maaaring tumukoy sa isang magnanakaw, armadong tulisan, o rebeldeng itinuturing na kriminal. Inihahambing dito ni Jesus ang kanilang armadong paglapit sa puwersang ginagamit laban sa isang mapanganib na kriminal.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahahayag ang banayad na pagsalungat at paglipat mula sa pagkilos ng mga dumakip tungo sa tugon ni Jesus.
- source_word: παραγενομένους ἐπ’ αὐτόν
  choice: na pumunta roon laban sa kanya
  rationale: Ipinananatili ang diwang mapanlaban ng ἐπί na may akusatibo sa konteksto ng pagdakip, nang hindi tahasang nagdaragdag ng pandiwang ‘dakpin.’
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Karaniwang katawagan sa mga nangungunang awtoridad ng mga pari, hindi pahiwatig na maraming kasalukuyang mataas na pari.
- source_word: στρατηγοὺς τοῦ ἱεροῦ
  choice: mga pinuno ng bantay sa templo
  rationale: Tumutukoy sa mga opisyal na namamahala sa seguridad ng templo; malinaw ito sa makabagong Filipino.
- source_word: πρεσβυτέρους
  choice: mga matatandang pinuno
  rationale: Nililinaw na mga kinikilalang pinuno ng bayan ang tinutukoy, hindi lamang matatandang lalaki.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: Para ba akong isang tulisan
  rationale: Natural na naihahatid sa Filipino ang retorikal na paghahambing na para bang humaharap sila sa isang mapanganib na kriminal, habang pinananatili sa talababa ang lawak ng kahulugan ng λῃστής.
- source_word: ἐξήλθατε
  choice: lumabas kayo
  rationale: Pinananatili ang kilos ng paglabas o pagsugod ng pangkat upang harapin si Jesus.
- source_word: μαχαιρῶν
  choice: mga espada
  rationale: Angkop na karaniwang katumbas sa konteksto ng isang armadong pagdakip.
- source_word: ξύλων
  choice: mga pamalo
  rationale: Sa kontekstong ito, ang literal na mga bagay na kahoy ay mga pamalong ginagamit bilang sandata.
theological_decisions:
- issue: Lawak ng kahulugan ng λῃστής
  choice: tulisan
  alternative: magnanakaw; bandido; rebelde
  rationale: Hindi nililimitahan ng konteksto kung karaniwang magnanakaw, armadong bandido, o rebeldeng kriminal ang larawan. Ang ‘tulisan’ ay may sapat na lawak, at ipinapaliwanag ng talababa ang tunay na leksikal na kalabuan.
translation_notes:
  register: Makabago at marangal na Filipino; ginagamit ang malinaw na mga katawagang pang-institusyon at iniiwasan ang makalumang ayos ng pangungusap. Ang retorikal na tanong ay ginawang natural sa Filipino nang hindi inaalis ang diin ng orihinal.
