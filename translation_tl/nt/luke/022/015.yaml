id: LUK.22.15
reference: Luke 22:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Ἐπιθυμίᾳ ἐπεθύμησα τοῦτο τὸ πάσχα φαγεῖν μεθ’ ὑμῶν πρὸ τοῦ με παθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/015.yaml
  text: And he said to them[b][a], “I have earnestly desired to eat this Passover with you before I suffer.”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Labis kong hinangad[a] na kainin ang Paskuwang ito[b] kasama ninyo bago ako magdusa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na anyo, “Sa paghahangad ay hinangad ko”; gumagamit ang Griyego ng mariing konstruksyon upang ipakita ang tindi ng pananabik ni Jesus.
    reason: lexical_alternative
  - marker: b
    text: Ang “Paskuwang ito” ay maaaring tumukoy nang tiyak sa hapunan ng Paskuwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτούς
  choice: Sinabi niya sa kanila
  rationale: Tuwiran at likas na salin ng karaniwang pormula sa pagsasalaysay para sa pagsasalita, kasama ang πρός at akusatibo.
- source_word: Ἐπιθυμίᾳ ἐπεθύμησα
  choice: Labis kong hinangad
  rationale: Ang magkaugnay na pangngalan at pandiwa sa Griyego ay isang mariing konstruksyon. Ipinahahayag ng “labis” ang tindi ng pagnanais nang hindi nagiging asiwa ang literal na pag-uulit sa Tagalog.
- source_word: τοῦτο τὸ πάσχα
  choice: ang Paskuwang ito
  rationale: Pinananatili ang “Paskuwa” sa pangunahing teksto upang huwag agad limitahan ang saklaw nito sa kapistahan o sa hapunan, bagaman malinaw sa konteksto ng “kainin” na ang hapunan ang tinutukoy.
- source_word: φαγεῖν
  choice: na kainin
  rationale: Payak at tuwirang salin ng aorist infinitive ng ἐσθίω; hindi kailangan ang pagpapalawak na gaya ng “makibahagi.”
- source_word: μεθ’ ὑμῶν
  choice: kasama ninyo
  rationale: Likas na pagpapahayag ng pagsama o pakikisalo sa modernong Tagalog.
- source_word: πρὸ τοῦ με παθεῖν
  choice: bago ako magdusa
  rationale: Malinaw na ipinahahayag ang panahong nauuna sa pagdurusa ni Jesus, nang hindi dinaragdagan ang teksto ng mga espesipikong pangyayari.
theological_decisions:
- issue: Kahulugan ng πάσχα sa konteksto
  choice: Pinanatili sa pangunahing teksto ang “Paskuwa” nang walang idinagdag na “hapunan.”
  alternative: ang hapunan ng Paskuwang ito
  rationale: Dahil sa pandiwang “kainin,” ang hapunan ng Paskuwa ang malamang na nasa isip; gayunman, ang πάσχα mismo ay maaaring tumukoy sa Paskuwa o sa hapunan nito. Pinananatili ng salin at talababa ang saklaw ng orihinal.
- issue: Diin ng Ἐπιθυμίᾳ ἐπεθύμησα
  choice: Labis kong hinangad
  alternative: Sa paghahangad ay hinangad ko; Sabik na sabik ako
  rationale: Inililipat nito sa likas na Tagalog ang tindi ng Griyegong magkaugnay na konstruksyon, nang hindi nagdaragdag ng natatanging doktrinal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “ninyo” bilang likas na pangmaramihang anyo at pinanatili ang “Paskuwa” bilang kinikilalang katawagang biblikal.
