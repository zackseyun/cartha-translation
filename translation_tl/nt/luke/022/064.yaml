  text: καὶ περικαλύψαντες ⸂αὐτὸν ἐπηρώτων⸃ λέγοντες· Προφήτευσον, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/064.yaml
  text: And after covering him[a], they kept asking, saying, “Prophesy! Who is the one who struck you?”
translation:
  language: tl
  text: At matapos nila siyang takpan[a], paulit-ulit nila siyang tinatanong, “Magpropesiya ka! Sino ang humampas sa iyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagkatapos nila siyang piringan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περικαλύψαντες
  choice: matapos nila siyang takpan
  rationale: Pinananatili nito ang malawak na kahulugan ng pandiwa na ‘takpan’ o ‘lambungan’ nang hindi tahasang dinaragdagan ang paraan ng pagtakip; ipinahihiwatig ng konteksto na nahadlangan ang kaniyang paningin.
- source_word: ἐπηρώτων
  choice: paulit-ulit nila siyang tinatanong
  rationale: Ipinakikita ng aspektong imperpekto ang nagpapatuloy o inuulit na pagtatanong, kaya mas angkop ang ‘paulit-ulit ... tinatanong’ kaysa payak na ‘tinanong.’
- source_word: λέγοντες
  choice: (isinama sa tuwirang sipi pagkatapos ng ‘tinatanong’)
  rationale: Sa natural na Tagalog, sapat nang ipakilala ng ‘tinatanong’ ang nilalaman ng panunuya; ang hiwalay na ‘na sinasabi’ ay magiging mabigat at paulit-ulit.
- source_word: Προφήτευσον
  choice: Manghula ka!
  rationale: Tuwiran at natural itong mapanuyang utos sa Tagalog. Dito, ang ‘manghula’ ay ginagamit sa diwang magsabi sa pamamagitan ng kapangyarihang propetiko, hindi bilang ordinaryong panghuhula lamang.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: Sino ang nanakit sa iyo?
  rationale: Natural na tanong ito sa modernong Tagalog at ipinahahayag ang substantibong participle na ‘ang nanakit sa iyo.’ Ang ‘nanakit’ ay sapat na malakas para sa pisikal na pananakit nang hindi ipinapalagay ang tiyak na uri ng hampas.
theological_decisions:
- issue: Kung tahasang sasabihing piniringan si Jesus
  choice: Panatilihin sa pangunahing teksto ang mas malawak na ‘takpan’
  alternative: ‘piringan’ o ‘takpan ang kaniyang mga mata’
  rationale: Bagaman ipinahihiwatig ng konteksto na hinadlangan ang paningin ni Jesus, ang περικαλύπτω ay mas malawak na nangangahulugang takpan o lambungan. Iniiwasan ng pangunahing teksto ang higit na espesipikong detalye, habang ibinibigay iyon sa talababa bilang leksikal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘paulit-ulit ... tinatanong’ upang madama ang nagpapatuloy na panunuya. Ang ‘Manghula ka!’ ay karaniwang salin ng mapanuyang utos na Προφήτευσον, bagaman maaari rin itong maunawaan bilang ‘Magsalita ka bilang propeta!’
