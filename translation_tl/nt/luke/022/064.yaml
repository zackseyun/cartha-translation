    issue: «Manghula ka!» para sa Προφήτευσον
    rationale: Bagaman posible sa ilang salin, ang «manghula» sa modernong Filipino ay madalas na nauunawaan bilang manghula ng kapalaran o manghula lamang. Ang «Magpropesiya ka!» ay mas tuwirang katumbas ng pandiwang Griyego at ng mapanuyang pagtukoy sa pagiging propeta.
  - severity: medium
    issue: «nanakit» para sa ὁ παίσας σε
    rationale: Ang «nanakit» ay maaaring tumukoy sa sinumang nanakit sa pangkalahatan at hindi tahasang nagpapahiwatig ng isang hampas. Ang «humampas» ay mas malapit sa aorist participle ng παίω, ‘ang humampas sa iyo.’
