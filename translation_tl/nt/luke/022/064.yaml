  source_fidelity: Ang «takpan» ay tapat sa malawak na kahulugan ng περικαλύψαντες at hindi nagpapasok ng mas tiyak na paraan ng pagtatakip. Ang «paulit-ulit ... tinatanong» ay mahusay na naghahayag ng imperpektong ἐπηρώτων. Gayunman, ang «nanakit» ay masyadong malawak para sa παίσας, na tumutukoy sa taong humampas o sumuntok; mas mainam ang «humampas».
  naturalness: Natural at malinaw ang pangungusap sa makabagong Filipino. Ang «Magpropesiya ka!» ay mas tumpak at mas malinaw kaysa «Manghula ka!», na sa pangkaraniwang gamit ay maaaring tumukoy sa panghuhula o pangdidibinasyon at hindi kinakailangang sa makahulang pagpapahayag.
  terminology: Gamitin ang «magpropesiya» para sa mapanuyang utos na Προφήτευσον. Pinananatili nito ang kaugnayan sa propeta nang hindi nagdaragdag ng paliwanag. Ang talababa ay dapat magbigay ng buong alternatibong parirala upang maging malinaw ang saklaw ng «piringan».
