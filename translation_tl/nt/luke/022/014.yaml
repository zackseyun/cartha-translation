    issue: Hindi ganap na tumpak ang paglalarawan ng postura sa talababa.
    rationale: Ang ἀναπίπτω sa konteksto ng pagkain ay tumutukoy sa paghilig/paghiga para kumain, karaniwan sa mga higaan o sandalan sa tabi ng hapag. Ang kasalukuyang "humihilig ang mga tao sa paligid ng mababang hapag" ay maaaring magpahiwatig lamang ng pagkakatayo o pag-upo sa paligid nito.
  - severity: low
    issue: Maaaring gawing higit na malinaw ang huling sugnay.
    rationale: Ang "at ang mga apostol ay kasama niya" ay mas tuwirang tumutugma sa οἱ ἀπόστολοι σὺν αὐτῷ at natural pa rin sa Tagalog.
  revised_text: Nang sumapit ang oras, humilig siya sa hapag[a], at ang mga apostol ay kasama niya.
