  yaml_path: translation/nt/luke/022/014.yaml
  text: And when the hour came[a], he reclined at the table, and the apostles with him.
translation:
  language: tl
  text: Nang sumapit ang oras, humilig siya sa hapag[a], at ang mga apostol ay kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa kaugalian noon, ang mga kumakain ay nakahilig sa mga higaan o sandalan sa tabi ng mababang hapag, sa halip na umupo sa mga silya gaya ngayon.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ
  choice: Nang
  rationale: Hindi kailangang isalin nang hiwalay ang simpleng pang-ugnay na καί; likas na naipagpapatuloy ng sugnay na “Nang…” ang salaysay sa Tagalog.
- source_word: ὅτε ἐγένετο ἡ ὥρα
  choice: Nang sumapit ang oras
  rationale: Likas na Tagalog para sa pagdating ng tiyak na oras o sandali, habang pinananatili ang ὥρα bilang “oras” sa halip na gawing pangkalahatang “panahon.”
- source_word: ἀνέπεσεν
  choice: humilig siya sa hapag[a]
  rationale: Ang pandiwa ay tumutukoy sa paghilig bilang karaniwang ayos ng katawan sa pagkain noong unang panahon. Idinagdag ang “sa hapag” upang maging malinaw sa makabagong mambabasa ang konteksto ng pagkain.
- source_word: οἱ ἀπόστολοι
  choice: ang mga apostol
  rationale: Tuwirang katumbas ng pangngalang may pantukoy at tumutukoy sa kilalang pangkat na kasama ni Jesus; hindi idinagdag ang “niya,” na wala sa parirala.
- source_word: σὺν αὐτῷ
  choice: kasama niya
  rationale: Maikli at likas na Tagalog na nagpapahayag ng pakikisama o presensiya kasama niya.
theological_decisions:
- issue: Ayos ng katawan sa hapag sa konteksto ng hapunang Paskuwa
  choice: humilig siya sa hapag
  alternative: umupo siya sa hapag
  rationale: Pinananatili ng salin ang tiyak na sinaunang kaugalian sa pagkain na ipinahihiwatig ng ἀναπίπτω, sa halip na palitan ito ng karaniwang makabagong pag-upo. Isa itong pasyang leksikal at pangkultura, hindi pagdaragdag ng doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang “oras” at “mga apostol,” at ipinaliwanag sa talababa ang sinaunang paraan ng paghilig sa hapag upang hindi ito mapagkamalang karaniwang pagsandal lamang.
