  text: καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὸ πῶς ἀνέλωσιν αὐτόν, ἐφοβοῦντο γὰρ τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/002.yaml
  text: And the chief priests and the scribes were seeking how they might kill him[a], for they were afraid of the people.
translation:
  language: tl
  text: At patuloy na naghahanap ang mga punong pari at mga eskriba kung paano nila siya mapapatay[a], sapagkat natatakot sila sa mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kung paano nila siya maipapatay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: naghahanap
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang nagpapatuloy na paghahanap sa nakaraan; natural na naipapahayag ito ng anyong “naghahanap” sa daloy ng salaysay.
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Ito ang karaniwan at malinaw na tawag sa mga pinuno ng mga pari sa Jerusalem, nang hindi ipinahihiwatig na maraming sabay-sabay na may iisang katungkulan ng pinakapunong pari.
- source_word: γραμματεῖς
  choice: mga eskriba
  rationale: Direkta at kinikilalang katawagan ito para sa pangkat na tinutukoy sa salaysay ng mga Ebanghelyo; iniiwasan nitong palawakin agad ang kahulugan bilang “mga tagapagturo ng Kautusan.”
- source_word: τὸ πῶς
  choice: ng paraan kung paano
  rationale: Natural nitong ipinapahayag sa Filipino ang idyomang tumutukoy sa paraang hinahanap nila.
- source_word: ἀνέλωσιν
  choice: mapapatay
  rationale: Sa kontekstong ito, malinaw na tumutukoy ang pandiwa sa pagkitil ng buhay. Pinananatili ng “mapapatay” ang tindi ng layunin nang hindi ipinapalagay ang isang tiyak na prosesong legal.
- source_word: ἐφοβοῦντο
  choice: natatakot
  rationale: Ipinapahayag nito ang nagpapatuloy na kalagayan ng pagkatakot sa panahong iyon.
- source_word: τὸν λαόν
  choice: mga tao
  rationale: Tinutukoy nito ang sambayanan bilang isang kolektibong pangkat, hindi lamang ang isang nagkakatipong pulutong.
theological_decisions:
- issue: Tindi ng ἀνέλωσιν at layunin ng mga pinuno
  choice: mapapatay
  alternative: maipapapatay; maalis
  rationale: Malinaw sa talata ang layuning kitilin ang buhay ni Jesus. Hindi ito pinalalambot bilang simpleng “pag-aalis,” ngunit hindi rin dinaragdagan ng tiyak na paraang legal o panghukuman.
- issue: Saklaw ng λαός
  choice: mga tao
  alternative: karamihan ng tao; madla
  rationale: 'Pinananatili nito ang kolektibong sanggunian ng Griyego at ang tensiyon sa salaysay: napipigil ang mga pinuno dahil natatakot sila sa magiging tugon ng mga tao.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “mga eskriba” bilang direktang katawagang biblikal, at ginamit ang “sapagkat” upang malinaw na ipakita ang dahilan nang hindi nagiging kolokyal.
