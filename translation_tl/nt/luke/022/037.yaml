reference: Luke 22:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι τοῦτο τὸ γεγραμμένον δεῖ τελεσθῆναι ἐν ἐμοί, τό· Καὶ μετὰ ἀνόμων ἐλογίσθη· καὶ γὰρ ⸀τὸ περὶ ἐμοῦ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/037.yaml
  text: 'For I tell you that this which is written must be fulfilled in me: ‘And he was counted with the lawless.’ For what concerns me has its fulfillment[a][b].'
translation:
  language: tl
  text: 'Sapagkat sinasabi ko sa inyo na kailangang matupad sa akin ang nasusulat na ito: “At ibinilang siya sa mga lumalabag sa kautusan.” Sapagkat ang tungkol sa akin ay humahantong na sa kaganapan[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa mas tradisyonal na pananalita, “At ibinilang siya sa mga mananalangsang” (Isa. 53:12).
    reason: alternative_reading
  - marker: b
    text: O “ang tungkol sa akin ay sumasapit na sa wakas” o “nagkakaroon ng katuparan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Sapagkat sinasabi ko sa inyo
  rationale: Likas sa modernong Tagalog ang “sinasabi ko sa inyo,” at pinananatili ng “sapagkat” ang paliwanag na ugnayang ipinahihiwatig ng γάρ.
- source_word: τοῦτο τὸ γεγραμμένον
  choice: ang nasusulat na ito
  rationale: Pinananatili nito ang demonstratibo at ang diwang nananatiling nakasulat ng perfect participle, nang hindi tahasang idinaragdag ang salitang “Kasulatan.”
- source_word: δεῖ τελεσθῆναι
  choice: kailangang matupad
  rationale: Ipinahahayag ng δεῖ ang pangangailangan, at sa konteksto ng siniping pahayag, natural na katumbas ng τελεσθῆναι ang “matupad.”
- source_word: ἐν ἐμοί
  choice: sa akin
  rationale: Ang “sa akin” ay tuwiran at natural, at hindi nililimitahan kung ito ay nangangahulugang sa persona ni Jesus o sa nangyayari sa kaniya.
- source_word: Καὶ μετὰ ἀνόμων ἐλογίσθη
  choice: At ibinilang siya sa mga lumalabag sa kautusan
  rationale: Ang “ibinilang” ay malapit sa ἐλογίσθη, samantalang ang “mga lumalabag sa kautusan” ay malinaw na modernong paglalarawan sa ἀνόμων nang hindi ginagamit ang mas makalumang “mananalangsang.”
- source_word: τὸ περὶ ἐμοῦ
  choice: ang tungkol sa akin
  rationale: Ito ang natural at maikling anyo sa Tagalog na nagpapanatili sa saklaw ng pariralang Griyego.
- source_word: τέλος ἔχει
  choice: humahantong na sa kaganapan
  rationale: Ipinahihiwatig ng “humahantong” ang paglapit sa wakas o katuparan, habang ang “kaganapan” ay nagpapanatili sa kontekstuwal na diwa ng completion nang hindi lubusang inaalis ang tensiyon sa pagitan ng wakas at katuparan.
theological_decisions:
- issue: Pagkakasalin sa sipi mula sa Isaias 53:12
  choice: At ibinilang siya sa mga lumalabag sa kautusan
  alternative: At ibinilang siya sa mga mananalangsang
  rationale: Mas madaling maunawaan ng karaniwang mambabasa ang pangunahing salin at tapat ito sa ἀνόμων. Inilalagay sa talababa ang tradisyonal na pananalita upang mapanatili ang pamilyar na ugnayan sa Isaias nang hindi pinangingibabaw ang tradisyon sa tekstong Griyego.
- issue: Diwa ng τέλος ἔχει
  choice: humahantong na sa kaganapan
  alternative: sumasapit na sa wakas / nagkakaroon ng katuparan
  rationale: Maaaring tumukoy ang parirala sa wakas, pagkumpleto, o katuparan. Pinananatili ng pangunahing salin ang pag-usad tungo sa kasukdulan, at inilalahad sa talababa ang mga posibleng pagbasa sa halip na tahimik na pagpasyahan ang ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan sa pangunahing teksto ang makalumang “mananalangsang,” ngunit pinanatili ito sa talababa dahil sa tradisyonal na pagkakaugnay nito sa Isaias 53:12. Ang “kaganapan” ay pinili upang mapanatili ang posibilidad ng kapuwa pagkumpleto at katuparan.
