id: LUK.22.10
reference: Luke 22:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἰδοὺ εἰσελθόντων ὑμῶν εἰς τὴν πόλιν συναντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ εἰς τὴν οἰκίαν ⸂εἰς ἣν⸃ εἰσπορεύεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/010.yaml
  text: And he said to them[a], “Look, when you enter the city, a man carrying a jar of water will meet you[b]. Follow him into the house that he enters.”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Tingnan ninyo,[a] pagpasok ninyo sa lungsod, sasalubungin kayo ng isang lalaking may dalang banga ng tubig.[b] Sundan ninyo siya papasok sa bahay na papasukan niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Narito.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego ay maaaring tumukoy nang mas tiyak sa isang sisidlang yari sa luwad.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Tingnan ninyo
  rationale: Ginamit bilang likas na panawag-pansin sa makabagong Tagalog, habang pinananatili ang deiktikong diin ng salitang Griyego.
- source_word: εἰσελθόντων ὑμῶν εἰς τὴν πόλιν
  choice: pagpasok ninyo sa lungsod
  rationale: Ipinahayag ang genitive absolute bilang pariralang temporal; likas ito sa Tagalog at hindi ipinapalagay kung kasabay o karaka-rakang kasunod ang pagtatagpo.
- source_word: συναντήσει ὑμῖν
  choice: sasalubungin kayo
  rationale: Ang pandiwang nasa hinaharap na may layong datibo ay likas na naipahahayag sa Tagalog bilang pagsalubong o pagtatagpo; ang 'sasalubungin kayo' ay malinaw sa konteksto.
- source_word: ἄνθρωπος
  choice: isang lalaki
  rationale: Tumutukoy ang anyong panlalaki at konteksto sa isang tiyak na lalaking tao.
- source_word: κεράμιον ὕδατος
  choice: banga ng tubig
  rationale: Ang 'banga' ay karaniwan at madaling maunawaang tawag sa sisidlan ng tubig, at maaari ring magpahiwatig ng sisidlang yari sa luwad nang hindi nagiging mabigat ang pangunahing teksto.
- source_word: βαστάζων
  choice: may dalang
  rationale: Likas na Tagalog ito para sa nagpapatuloy na kilos ng pagdadala na ipinahahayag ng participle.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: Sundan ninyo siya
  rationale: Tuwirang utos ito at malinaw na katumbas ng aorist imperative sa konteksto.
- source_word: οἰκίαν
  choice: bahay
  rationale: Ang 'bahay' ang kongkreto at karaniwang katumbas ng οἰκία sa pahayag na patungo sa isang gusali.
- source_word: εἰς ἣν εἰσπορεύεται
  choice: na papasukan niya
  rationale: Tinutukoy ng sugnay ang partikular na bahay at pinananatili ang direksiyonal na diwa ng pagpasok.
theological_decisions: []
translation_notes:
  register: Makabago, magalang, at pasalaysay na Tagalog. Ginamit ang maramihang 'ninyo' ayon sa αὐτοῖς at ὑμῶν/ὑμῖν, at iniwasan ang arkaikong pananalita habang pinananatili ang tuwirang utos at ang daloy ng pangyayari.
