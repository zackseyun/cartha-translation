  source_fidelity: 'Tumpak na naipapahayag ang mga pangunahing elemento ng Griyego: ang panawag-pansin na Ἰδοὺ, ang temporal na genitive absolute, ang lalaking may dalang sisidlan ng tubig na sasalubong sa mga alagad, at ang utos na sundan siya papasok sa bahay na kanyang papasukan. Napananatili rin ang maramihang kausap.'
