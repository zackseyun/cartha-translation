  terminology: Ang “lalaki,” “banga ng tubig,” at “bahay” ay angkop na katumbas sa konteksto. Maayos ang talababa b sa pagpapaliwanag ng posibleng luwad na materyal ng κεράμιον nang hindi ito labis na itinatakda sa pangunahing teksto.
