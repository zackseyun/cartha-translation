id: LUK.22.56
reference: Luke 22:56
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ αὐτὸν παιδίσκη τις καθήμενον πρὸς τὸ φῶς καὶ ἀτενίσασα αὐτῷ εἶπεν· Καὶ οὗτος σὺν αὐτῷ ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/056.yaml
  text: Then a certain servant girl[a], seeing him seated by the light and looking intently at him, said, “This man also was with him.”
translation:
  language: tl
  text: Nang makita siya ng isang alilang babae na nakaupo sa liwanag[a], tinitigan siya nito at sinabi, “Kasama rin niya ang lalaking ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malapit sa liwanag.” Maaaring tumukoy ang pariralang Griyego sa kinalalagyan niya malapit sa pinagmumulan ng liwanag o sa bahaging naaabot ng liwanag.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα δὲ
  choice: Nang makita
  rationale: Ipinapahayag ang kasunod na pangyayari at ang naunang kilos ng pagkakita sa natural na daloy ng salaysay sa Tagalog; hindi kailangang tumbasan nang hiwalay ang mahinang pang-ugnay na δέ.
- source_word: παιδίσκη τις
  choice: isang alilang babae
  rationale: Ipinahihiwatig ng παιδίσκη ang isang batang babae o babaeng alipin/tagapaglingkod. Ang “alilang babae” ay maikli at likas, at pinananatili ang mababang katayuang panlipunan nang hindi tiyak na nilulutas kung siya ay pag-aari o karaniwang tagapaglingkod.
- source_word: καθήμενον
  choice: nakaupo
  rationale: Tuwirang inilalarawan ang posisyon ni Pedro sa natural na modernong Tagalog.
- source_word: πρὸς τὸ φῶς
  choice: sa liwanag
  rationale: Pinananatili ang pagtukoy sa kinalalagyan ni Pedro kaugnay ng liwanag nang hindi nagdaragdag ng “apoy,” na hindi tahasang nasa pariralang ito. Maaaring mangahulugan ang Griyego na malapit sa pinagmumulan ng liwanag o nasa naaabot nitong maliwanag na bahagi.
- source_word: ἀτενίσασα αὐτῷ
  choice: tinitigan siya nito
  rationale: Ipinapakita ng “tinitigan” ang mataman at nakapokus na pagtingin. Nililinaw ng “nito” na ang alilang babae ang tumingin.
- source_word: Καὶ οὗτος
  choice: Kasama rin ... ang lalaking ito
  rationale: Ang “rin” ay tumutumbas sa καί, at ang “lalaking ito” ay nagpapanatili sa tuwiran at mapagturong lakas ng demonstratibong οὗτος.
- source_word: σὺν αὐτῷ ἦν
  choice: Kasama ... niya
  rationale: Natural at tuwirang ipinapahayag ang pakikisama o pagiging kabilang sa piling ng lalaking tinutukoy.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “alilang babae” sa halip na mas makalumang “aliping babae” o “babaeng utusan”; iniwasan ding tukuyin ang liwanag bilang apoy dahil hindi iyon tahasang nasa sugnay.
