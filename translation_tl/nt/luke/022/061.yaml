  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ στραφεὶς ὁ κύριος ἐνέβλεψεν τῷ Πέτρῳ, καὶ ὑπεμνήσθη ὁ Πέτρος τοῦ ⸀λόγου τοῦ κυρίου ὡς εἶπεν αὐτῷ ὅτι Πρὶν ἀλέκτορα φωνῆσαι ⸀σήμερον ἀπαρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/061.yaml
  text: And the Lord turned and looked at Peter[a], and Peter remembered the word of the Lord, how he had said to him, “Before a rooster crows today, you will deny me three times.”
translation:
  language: tl
  text: 'Lumingon ang Panginoon at tumingin kay Pedro[a]. At naalala ni Pedro ang sinabi ng Panginoon sa kanya: “Bago tumilaok ang isang tandang ngayong araw, tatlong beses mo akong ikakaila.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tumingin nang mataman kay Pedro”; maaaring magpahiwatig ang pandiwang Griego ng tuwiran o matamang pagtingin.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: Lumingon
  rationale: Ipinahahayag ng aorist participle ang pagkilos ng Panginoon bago siya tumingin kay Pedro. Natural sa modernong Tagalog ang “lumingon” at hindi nito pinabibigat ang pangungusap sa literal na anyong participial.
- source_word: κύριος
  choice: Panginoon
  rationale: Pinananatili nito ang karaniwang titulong ginagamit kay Jesus at ang lakas na kristolohikal ng κύριος nang hindi ito nililimitahan sa kahulugang “Guro.”
- source_word: ἐνέβλεψεν
  choice: tumingin kay
  rationale: Malinaw at natural na salin ito; maaaring magpahiwatig ang pandiwa ng tuwiran o matamang titig, kaya inilagay ang mas mariing diwa sa talababa.
- source_word: ὑπεμνήσθη
  choice: naalala
  rationale: Bagaman maaaring ipahiwatig ng anyo na “naipaalala,” ang pangunahing punto sa konteksto ay ang paggunita ni Pedro. Ang “naalala” ang pinakanatural na pagpapahayag nito.
- source_word: λόγου τοῦ κυρίου
  choice: ang sinabi ng Panginoon
  rationale: Tumutukoy ang λόγος dito sa tiyak na pahayag ni Jesus. Mas likas sa Tagalog ang “sinabi” kaysa sa literal na “salita” sa konstruksiyong ito.
- source_word: ὡς εἶπεν αὐτῷ
  choice: sa kanya
  rationale: 'Isinasama ang nilalaman sa direktang sipi: ang naalala ni Pedro ay ang sinabi ng Panginoon sa kanya. Iniiwasan nito ang alanganing literal na “kung paanong sinabi niya.”'
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Bago tumilaok ang isang tandang
  rationale: Ipinahahayag ng πρίν at infinitive ang panahong nauna sa pagtilaok. Ang anarthrous na ἀλέκτορα ay natural na naisasalin bilang “isang tandang,” hindi kinakailangang “ang tandang.”
- source_word: σήμερον
  choice: ngayong araw
  rationale: Tuwirang pinananatili nito ang χρονological na diin ng σήμερον at malinaw na iniuugnay sa pagtilaok na mangyayari sa araw na iyon.
- source_word: ἀπαρνήσῃ με
  choice: mo akong ikakaila
  rationale: Ang “ikakaila” ang karaniwan at tumpak na salin sa konteksto ng pagtanggi ni Pedro na kilala niya si Jesus.
- source_word: τρίς
  choice: tatlong beses
  rationale: Malinaw, kasalukuyan, at karaniwang Tagalog ito.
theological_decisions:
- issue: Pagtukoy kay Jesus bilang κύριος
  choice: Panginoon
  alternative: Guro
  rationale: Pinananatili ng “Panginoon” ang titulong ginamit ng salaysay at ang posibleng kristolohikal na bigat nito, samantalang magiging mas makitid ang “Guro.”
- issue: Lakas ng tingin sa ἐνέβλεψεν
  choice: tumingin kay
  alternative: tinitigang mabuti
  rationale: Hindi sapilitang nangangahulugan ang pandiwa ng matinding titig sa bawat gamit. Pinanatiling simple ang pangunahing teksto at inilagay sa talababa ang tunay na posibleng mas mariing diwa.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Panginoon,” “tandang,” at “ikakaila” bilang madaling maunawaan at nakaugat sa bokabularyong biblikal; iniwasan ang lipas o labis na literal na ayos.
