    issue: Maaaring malabo ang "nakahilig sa hapag."
    rationale: Sa modernong Filipino, maaari itong tumukoy sa pagsandal sa mesa sa halip na sa paghilig o paghiga ng mga panauhin habang kumakain sa sinaunang salu-salo.
  - severity: low
