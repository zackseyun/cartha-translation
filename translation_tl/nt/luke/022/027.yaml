    rationale: Hindi ito sinasabi ng tekstong Griyego ng talata. Sapat na ipaliwanag ang kaugaliang paghilig ng mga kumakain at ang pagkakaiba nito sa naglilingkod, nang hindi igiit ang postura ng huli.
