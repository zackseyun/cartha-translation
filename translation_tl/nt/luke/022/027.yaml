base_translation:
  language: en
  yaml_path: translation/nt/luke/022/027.yaml
  text: For who is greater[a], the one reclining at the table or the one serving? Is it not the one reclining at the table? But I am among you as one who serves.
translation:
  language: tl
  text: Sapagkat sino ang mas dakila, ang nakahilig habang kumakain[a] o ang naglilingkod? Hindi ba ang nakahilig habang kumakain? Ngunit nasa gitna ninyo ako bilang isang naglilingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mga sinaunang salu-salo, karaniwang nakahilig ang mga panauhin habang kumakain. Ikinukumpara rito ang panauhin sa taong naglilingkod.
    reason: cultural_note
lexical_decisions:
- source_word: τίς γὰρ μείζων
  choice: Sapagkat sino ang mas dakila
  rationale: Pinananatili ng “sino” ang paghahambing sa mga tao, ng “sapagkat” ang ugnayang nagpapaliwanag, at ng “mas dakila” ang bukas na diwa ng katayuan o ranggo nang hindi ito nililimitahan sa “mas mahalaga.”
- source_word: ὁ ἀνακείμενος
  choice: ang nakahilig sa hapag
  rationale: Sa konteksto ng salu-salo, tumutukoy ang pandiwa sa kaugaliang paghilig habang kumakain. Nililinaw ng “sa hapag” ang ipinahihiwatig na tagpuan.
- source_word: ὁ διακονῶν
  choice: ang naglilingkod
  rationale: Ang pandiwaring anyo ay naglalarawan sa taong aktuwal na naglilingkod sa hapag; iniiwasan ng saling ito ang pagpasok ng teknikal na tungkuling pansimbahan o ng mas malakas na diwa ng pagiging alipin.
- source_word: οὐχὶ ὁ ἀνακείμενος
  choice: Hindi ba ang nakahilig sa hapag?
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang tagapakinig.
- source_word: ἐγὼ δὲ
  choice: Ngunit ... ako
  rationale: Ipinakikita ng “ngunit” ang matinding pagsalungat sa karaniwang inaasahan tungkol sa katayuan.
- source_word: ἐν μέσῳ ὑμῶν εἰμι
  choice: nasa gitna ninyo ako
  rationale: Natural at marangal sa Filipino ang parirala at mas malapit sa larawang “nasa gitna” kaysa sa mas malayang “kasama ninyo.”
- source_word: ὡς ὁ διακονῶν
  choice: bilang isang naglilingkod
  rationale: Pinananatili ng “bilang” ang paglalarawan sa paraan o gampanin ni Jesus, at ng pandiwang “naglilingkod” ang kilos sa halip na gawing pangngalang “lingkod.”
theological_decisions:
- issue: Paglalarawan ni Jesus sa sarili sa pamamagitan ng paglilingkod
  choice: Ngunit nasa gitna ninyo ako bilang isang naglilingkod.
  alternative: Ngunit nasa gitna ninyo ako bilang isang lingkod.
  rationale: Pandiwari ang διακονῶν, hindi pangngalang δοῦλος. Kaya pinananatili ang pandiwang ideya ng aktuwal na paglilingkod at ang kaibhan sa taong nakahilig sa hapag, nang hindi ipinapasok ang mas matinding konsepto ng pagkaalipin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakahilig sa hapag” upang mapanatili ang sinaunang kaugalian sa pagkain habang nauunawaan agad ang tagpuan; ginamit ang “naglilingkod” sa halip na teknikal o denominasyonal na katawagan.
