  text: καὶ ἀναστὰς ἀπὸ τῆς προσευχῆς ἐλθὼν πρὸς τοὺς μαθητὰς εὗρεν ⸂κοιμωμένους αὐτοὺς⸃ ἀπὸ τῆς λύπης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/045.yaml
  text: And after rising from prayer[a], he came to the disciples and found them sleeping from sorrow.
translation:
  language: tl
  text: Pagkatapos niyang bumangon mula sa pananalangin, lumapit siya sa mga alagad at nadatnan silang natutulog dahil sa kalungkutan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς ἀπὸ τῆς προσευχῆς
  choice: Pagkatapos niyang tumindig mula sa pananalangin
  rationale: Ipinahihiwatig ng aorist participle na nauna ang pagtindig sa paglapit. Pinananatili ng “mula sa pananalangin” ang larawan ng pagbangon niya mula sa kaniyang pananalangin nang hindi ito ginagawang simpleng “pagkatapos manalangin.”
- source_word: ἐλθὼν πρὸς τοὺς μαθητὰς
  choice: lumapit siya sa mga alagad
  rationale: Ang ἐλθών na may πρός ay kilos patungo sa mga alagad. Natural sa Filipino ang “lumapit,” at ang “mga alagad” ang nakaugaliang tumpak na salin ng μαθηταί sa mga Ebanghelyo.
- source_word: εὗρεν
  choice: nadatnan
  rationale: Sa kontekstong may kasunod na object-complement participle, likas sa Filipino ang “nadatnan,” na nagpapahayag na nakita niya sila sa ganoong kalagayan.
- source_word: κοιμωμένους αὐτούς
  choice: silang natutulog
  rationale: Pinananatili ng “natutulog” ang patuloy na kilos o kalagayang ipinahahayag ng present participle.
- source_word: ἀπὸ τῆς λύπης
  choice: dahil sa kalungkutan
  rationale: Dito, ang ἀπό ay pinakamalamang na nagsasaad ng sanhi. Ang “kalungkutan” ay natural at malinaw na katumbas ng λύπη sa kontekstong ito.
theological_decisions:
- issue: Sanhi ng pagtulog ng mga alagad
  choice: Ipinapakitang bunga ng kalungkutan ang kanilang pagtulog.
  alternative: Natutulog sila habang malungkot, nang hindi gaanong binibigyang-diin ang sanhi.
  rationale: Pinakanatural na sanhi ang ipinahahayag ng ἀπὸ τῆς λύπης. Hindi na dinaragdagan ng salin ang sikolohikal o teolohikal na paliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tumindig” sa halip na mas impormal na “bumangon” upang angkop sa eksenang mula sa pananalangin, at “nadatnan” para sa natural na daloy ng salaysay.
