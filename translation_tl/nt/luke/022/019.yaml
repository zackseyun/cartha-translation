source:
  edition: SBLGNT
  text: καὶ λαβὼν ἄρτον εὐχαριστήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς λέγων· Τοῦτό ἐστιν τὸ σῶμά μου ⸂[τὸ ὑπὲρ ὑμῶν διδόμενον· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/019.yaml
  text: And taking bread[a], after giving thanks he broke it and gave it to them, saying, “This is my body, which is given for you[c][b]. Keep doing this in remembrance of me.”
translation:
  language: tl
  text: Kumuha siya ng tinapay at, matapos magpasalamat, pinagputol-putol niya iyon at ibinigay sa kanila. Sinabi niya, “Ito ang katawan ko[c], na ibinibigay para sa inyo[b]. Patuloy ninyong gawin ito bilang pag-alaala sa akin.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hindi kasama sa ilang manuskrito ang: “na ibinibigay para sa inyo. Patuloy ninyong gawin ito bilang pag-alaala sa akin.”'
    reason: textual_variant
  - marker: b
    text: 'Maaari ring unawain: “na kasalukuyang ibinibigay para sa inyo.”'
    reason: lexical_alternative
  - marker: c
    text: Ang “Ito ang katawan ko” ay isinalin ayon sa mismong pagkakasulat. Ipinapakahulugan ito ng ilan bilang “Ito ay sumasagisag sa katawan ko,” ngunit “ay” ang mismong ginamit sa tekstong Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν ἄρτον
  choice: Kumuha siya ng tinapay
  rationale: Ginawang likas na sugnay sa modernong Tagalog ang aorist participle habang pinananatili ang pagkakasunod ng mga kilos.
- source_word: εὐχαριστήσας
  choice: matapos magpasalamat
  rationale: Malinaw na ipinahihiwatig na nauna ang pasasalamat sa pagpira-piraso ng tinapay, nang hindi nagdaragdag ng tahasang layon na wala sa Griyego.
- source_word: ἔκλασεν
  choice: pinagputol-putol niya iyon
  rationale: Likas na paglalarawan sa pagputol o pagpira-piraso ng tinapay sa kontekstong ito; ang panghalip ay tumutukoy nang malinaw sa tinapay.
- source_word: ἔδωκεν αὐτοῖς
  choice: ibinigay sa kanila
  rationale: Tuwirang salin na natural sa salaysay na Tagalog.
- source_word: Τοῦτό ἐστιν τὸ σῶμά μου
  choice: Ito ang katawan ko
  rationale: Pinananatili ang tuwirang copular na pahayag at hindi ito ipinapakahulugang ‘sumasagisag’ o ‘kumakatawan.’
- source_word: τὸ ὑπὲρ ὑμῶν διδόμενον
  choice: na ibinibigay para sa inyo
  rationale: Ang kasalukuyang balintiyak na anyong ‘ibinibigay’ ay mahusay na tumutugma sa present participle; ang ‘para sa inyo’ ay nagpapanatili sa malawak na puwersa ng ὑπέρ nang hindi labis na ipinapaliwanag.
- source_word: τοῦτο ποιεῖτε
  choice: Patuloy ninyong gawin ito
  rationale: Ipinakikita ng ‘patuloy’ ang nauulit o nagpapatuloy na puwersa ng present imperative sa konteksto.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: bilang pag-alaala sa akin
  rationale: Natural at malinaw na Tagalog para sa aktibong paggunita o pag-alaala, hindi lamang sa pansariling paggunita sa isip.
theological_decisions:
- issue: Kahulugan ng “Ito ang katawan ko” sa konteksto ng Hapunan
  choice: Pinanatili ang tuwirang pananalitang “Ito ang katawan ko.”
  alternative: “Ito ay sumasagisag sa katawan ko” o “Ito ay kumakatawan sa katawan ko.”
  rationale: Gumagamit ang Griyego ng ἐστιν, ‘ay,’ kaya hindi dapat lutasin ng salin ang pinagtatalunang teolohikal na kahulugan sa pamamagitan ng pagpapakahulugan.
- issue: Kalagayang tekstuwal ng mas mahabang pagbasa sa Lucas 22:19
  choice: Isinama sa pangunahing teksto ang sugnay mula “na ibinibigay para sa inyo” hanggang sa wakas ng talata.
  alternative: Ang mas maikling teksto na nagtatapos sa “Ito ang katawan ko.”
  rationale: Kasama ngunit minarkahan bilang pinagtatalunang bahagi sa ibinigay na SBLGNT ang mas mahabang pagbasa; inilalahad sa talababa ang mahalagang variant.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Iniwasan ang teknikal na wikang liturhikal at ang mga pariralang nakatali sa isang partikular na denominasyon. Ginamit ang “pag-alaala” bilang pangkaraniwang ngunit marangal na katumbas ng ἀνάμνησις.
