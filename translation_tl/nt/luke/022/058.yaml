  text: καὶ μετὰ βραχὺ ἕτερος ἰδὼν αὐτὸν ἔφη· Καὶ σὺ ἐξ αὐτῶν εἶ· ὁ δὲ Πέτρος ⸀ἔφη· Ἄνθρωπε, οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/058.yaml
  text: And after a little while[a], another man, seeing him, said, “You also are one of them.” But Peter said, “Man, I am not.”
translation:
  language: tl
  text: Makalipas ang ilang sandali, nakita siya ng isa pang lalaki at sinabi, “Isa ka rin sa kanila.” Ngunit sinabi ni Pedro, “Tao, hindi ako[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, nang mas tahasan, “Hindi ako isa sa kanila.” “Hindi ako” lamang ang nasa Griyego; ipinauunawa mula sa naunang paratang ang bahaging hindi na binanggit.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ βραχὺ
  choice: Makalipas ang ilang sandali
  rationale: Likas na temporal na parirala sa Filipino para sa maikling agwat ng panahon; hindi nito tinutukoy nang eksakto kung gaano katagal.
- source_word: ἕτερος
  choice: isa pang lalaki
  rationale: Ang anyo ay panlalaking isahan at tumutukoy sa isa pang taong nagparatang kay Pedro; nililinaw ng “lalaki” ang tinutukoy nang hindi binabago ang diwa.
- source_word: ἰδὼν αὐτὸν
  choice: nakita siya
  rationale: Ipinapahayag nang natural sa Filipino ang aorist participle bilang pangyayaring kasabay o nagbigay-daan sa pagsasalita.
- source_word: Καὶ σὺ ἐξ αὐτῶν εἶ
  choice: Isa ka rin sa kanila
  rationale: Sa konteksto, ang ἐξ αὐτῶν ay nagpapahiwatig ng pagiging kabilang sa grupo, kaya idiomatiko at tumpak ang “isa sa kanila.”
- source_word: Ἄνθρωπε
  choice: Mama
  rationale: Ang “Mama” ay tuwirang tawag sa isang lalaking hindi pinangalanan at mas natural sa Filipino kaysa sa literal ngunit asiwa na “Tao.” Napananatili rin nito ang tuwiran at maikling tono ng sagot.
- source_word: οὐκ εἰμί
  choice: hindi ako
  rationale: Pinananatili ang maikli at eliptikong sagot ng Griyego; nauunawaan mula sa naunang paratang ang hindi na inulit na “isa sa kanila.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang “Mama” bilang likas na panawag sa isang lalaking hindi kilala, samantalang pinanatili ang maikli at mariing pagkakaila ni Pedro. Inilagay ang talababa sa “Hindi ako,” ang mismong pariralang nililinaw nito.
