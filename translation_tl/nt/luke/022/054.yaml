  source_fidelity: 'Napananatili ng draft ang pagkakasunod ng mga kilos: pagdakip, pagdala, at pagpapasok sa loob ng bahay. Gayunman, ang “pinakapunong pari” ay hindi ang karaniwan o pinakatumpak na modernong Filipino na katumbas ng ἀρχιερεύς sa natatanging tungkuling ito; mas angkop ang “mataas na pari.” Ang “sumusunod” ay maaaring maunawaan bilang kasalukuyang panahon kapag nakahiwalay, kaya nilinaw ang imperpektibong aspekto sa “patuloy na sumusunod.”'
  naturalness: May bahagyang kabigatan ang “Pagkadakip nila kay Jesus.” Mas likas at malinaw ang pangungusap na may “Matapos nilang dakpin siya.” Ang binagong teksto ay nananatiling marangal ngunit natural sa makabagong Filipino.
  terminology: Pinalitan ang “pinakapunong pari” ng “mataas na pari,” ang matatag at natural na katawagan para sa high priest. Hindi nagdaragdag ang salin ng pagtataya sa motibo ni Pedro.
