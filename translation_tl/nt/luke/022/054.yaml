  text: Συλλαβόντες δὲ αὐτὸν ἤγαγον καὶ ⸀εἰσήγαγον εἰς ⸂τὴν οἰκίαν⸃ τοῦ ἀρχιερέως· ὁ δὲ Πέτρος ἠκολούθει μακρόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/054.yaml
  text: After arresting him[a], they led him away and brought him into the high priest’s house; but Peter was following at a distance.
translation:
  language: tl
  text: Matapos nilang dakpin siya, dinala nila siya at ipinasok sa bahay ng mataas na pari; ngunit si Pedro ay patuloy na sumusunod mula sa malayo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συλλαβόντες
  choice: Pagkadakip nila kay Jesus
  rationale: Ipinapakita ng aorist participle na nauna ang pagdakip bago ang pagdadala. Ginamit ang pangalang “Jesus” sa halip na panghalip upang maging malinaw at natural sa Filipino nang hindi nagdaragdag ng kahulugan.
- source_word: ἤγαγον
  choice: dinala nila siya
  rationale: Ang ἄγω ay tumutukoy sa pag-akay o pagdadala. Ang “dinala” ay likas sa konteksto ng isang taong nasa kustodiya.
- source_word: εἰσήγαγον
  choice: ipinasok
  rationale: Pinananatili nito ang direksiyong ipinahihiwatig ng εἰσάγω—ang pagdadala sa loob—at iniiwasan ang alanganing pag-uulit ng “dinala.”
- source_word: οἰκίαν
  choice: bahay
  rationale: Pisikal na lugar ang tinutukoy rito; ang “bahay” ang tuwiran at karaniwang katumbas sa modernong Filipino.
- source_word: ἀρχιερέως
  choice: pinakapunong pari
  rationale: Ito ang malinaw na katawagan para sa natatanging mataas na katungkulan ng ἀρχιερεύς, hindi lamang sa isa sa mga punong pari.
- source_word: ἠκολούθει
  choice: sumusunod
  rationale: Naipahihiwatig ng aspektong imperpektibo ang nagpapatuloy na pagsunod ni Pedro sa puntong iyon ng salaysay.
- source_word: μακρόθεν
  choice: sa malayo
  rationale: Natural at maikli itong paglalarawan ng pisikal na agwat, nang hindi nagpapahiwatig ng motibo ni Pedro.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita nito ang banayad na paghahambing o pagsalungat sa pagitan ng pagdadala kay Jesus at ng malayuang pagsunod ni Pedro.
theological_decisions:
- issue: Paglalarawan sa pagsunod ni Pedro habang dinadala si Jesus
  choice: “sumusunod si Pedro sa malayo” nang walang salitang humuhusga sa kanyang motibo
  alternative: “palihim” o “dahil sa takot” na sumusunod si Pedro
  rationale: Pisikal na distansiya lamang ang tahasang sinasabi ng talata. Hindi nito tuwirang ipinaliliwanag kung takot, pag-iingat, o ibang motibo ang dahilan, kaya pinanatili ang tensiyon ng salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod na kilos—pagdakip, pagdadala, at pagpapasok—at ang nagpapatuloy na pagsunod ni Pedro.
