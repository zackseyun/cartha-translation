id: LUK.22.70
reference: Luke 22:70
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπαν δὲ πάντες· Σὺ οὖν εἶ ὁ υἱὸς τοῦ θεοῦ; ὁ δὲ πρὸς αὐτοὺς ἔφη· Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/070.yaml
  text: Then they all said[a], “So you are the Son of God?” And he said to them, “You say that I am.”
translation:
  language: tl
  text: Sinabi nilang lahat, “Kung gayon, ikaw ba ang Anak ng Diyos?” Sinabi niya sa kanila, “Kayo ang nagsasabing ako nga.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang mas idyomatiko: “Kayo na ang nagsabi,” o “Gaya ng sinabi ninyo.” Ang sagot ni Jesus ay may diwa ng pagsang-ayon, ngunit mas literal ang Griyego na “Kayo ang nagsasabing ako nga.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: nilang lahat
  rationale: Ipinahahayag nito na ang buong pangkat ang nagsalita, sa natural na ayos ng makabagong Tagalog.
- source_word: οὖν
  choice: Kung gayon
  rationale: Ipinakikita nito na ang tanong ay isang hinuha mula sa naunang sinabi ni Jesus.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ang Anak ng Diyos
  rationale: Pinananatili ang tiyak at pormal na titulong kristolohikal ng Griyego.
- source_word: ἔφη
  choice: Sinabi
  rationale: Payak at natural itong katumbas ng pandiwa sa kontekstong ito, nang hindi nagdaragdag ng diwang wala sa pinagmulan.
- source_word: Ὑμεῖς λέγετε
  choice: Kayo ang nagsasabing
  rationale: Ang tahasang panghalip na Kayo at ang hulma na “Kayo ang” ay nagpapanatili sa diin na sa kanila nagmula ang pagkakasabi.
- source_word: ὅτι ἐγώ εἰμι
  choice: ako nga
  rationale: Ang “ako” ay nagpapanatili sa tahasang ἐγώ, at ang “nga” ay likas na naghahatid ng mariing pag-ayon sa eliptikal na sagot nang hindi inuulit ang titulong nasa tanong.
theological_decisions:
- issue: Kung ang sagot ni Jesus ay dapat gawing tahasang pag-amin o panatilihin sa di-tuwirang anyo nito
  choice: Kayo ang nagsasabing ako nga
  alternative: Tama ang sinabi ninyo; ako nga / Gaya ng sinabi ninyo
  rationale: Pinananatili ng pangunahing teksto ang retorikal na anyo ng Griyego, na ibinabalik sa mga nagtatanong ang kanilang sariling pananalita, habang nananatiling isang pagsang-ayon sa konteksto. Hindi nito pinapawi ang likas na tensiyon sa paraan ng pagsagot ni Jesus.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Kung gayon” upang maipahayag ang hinuha sa tanong, at pinanatili ang pormal na titulong “ang Anak ng Diyos.”
