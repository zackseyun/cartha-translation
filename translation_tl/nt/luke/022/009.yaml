  text: They said to him[a], “Where do you want us to prepare it?”
translation:
  language: tl
  text: Sinabi nila sa kanya, “Saan mo gustong ihanda namin iyon?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: nila
  rationale: Ang artikulong οἱ ay ginagamit bilang pangngalan at tumutukoy sa mga alagad ayon sa konteksto. Ang δέ ay banayad na pang-ugnay at hindi na kailangang isalin nang tahasan sa natural na Tagalog.
- source_word: εἶπαν αὐτῷ
  choice: Sinabi nila sa kanya
  rationale: Pinananatili nito ang payak na kahulugan ng εἶπαν na “sinabi,” at tahasang isinasalin ang datibong αὐτῷ bilang “sa kanya.” Bagaman tanong ang tuwirang pananalita, natural pa rin sa Tagalog ang “sinabi.”
- source_word: Ποῦ
  choice: Saan
  rationale: Tuwirang at natural na katumbas ito ng pang-abay na patanong tungkol sa lugar.
- source_word: θέλεις
  choice: mo gustong
  rationale: Karaniwang makabagong Tagalog ito para sa pagnanais o layunin at nababagay sa balangkas na “Saan mo gustong…?”
- source_word: ἑτοιμάσωμεν
  choice: ihanda namin iyon
  rationale: Ang unang panauhang maramihang aorist subjunctive pagkatapos ng θέλεις ay likas na ipinapahayag bilang “gustong ihanda namin.” Ang “iyon” ay ipinahiwatig ng naunang konteksto—ang paghahanda ng pagkain ng Paskuwa—at idinagdag upang maging malinaw at natural sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang karaniwang ayos na “Saan mo gustong ihanda namin iyon?” upang maging natural sa ordinaryong mambabasa habang nananatiling malapit sa estruktura at diwa ng Griyego.
