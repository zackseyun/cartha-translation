base_translation:
  language: en
  yaml_path: translation/nt/luke/022/016.yaml
  text: For I tell you that I will certainly not eat it until it is fulfilled in the kingdom of God[a][b].
translation:
  language: tl
  text: 'Sapagkat sinasabi ko sa inyo: hinding-hindi ko ito kakainin hanggang sa ito’y matupad sa kaharian ng Diyos.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hinding-hindi ko na ito muling kakainin hanggang sa ito’y matupad sa kaharian ng Diyos.” Mariing itinatanggi sa Griyego ang pagkain nito sa hinaharap. Ginagawang tahasan ng ilang salin ang ipinahihiwatig na “muli” batay sa konteksto, ngunit hindi ito nakasaad sa tekstong Griyego.
    reason: lexical_alternative
  - marker: b
    text: Ang “ito” ay tumutukoy sa Paskuwang binanggit sa naunang talata.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Sapagkat sinasabi ko sa inyo
  rationale: Pinananatili ng “Sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang talata, at ang “sinasabi ko sa inyo” ay natural at marangal na pormula ng pagsasalita sa modernong Tagalog.
- source_word: ὅτι
  choice: ':'
  rationale: Sa Tagalog, natural na ipakilala ang mismong nilalaman ng pahayag sa pamamagitan ng tutuldok sa halip na piliting isalin ang ὅτι bilang “na.”
- source_word: οὐ μὴ φάγω
  choice: tiyak na hindi ko ito kakainin
  rationale: Ang οὐ μή na may aorist subjunctive ay mariing pagtanggi tungkol sa hinaharap. Malinaw na ipinahahayag ng “tiyak na hindi” ang diin nang hindi gumagamit ng makalumang pananalita.
- source_word: αὐτό
  choice: ito
  rationale: Tumutukoy ang panghalip sa Paskuwa na binanggit sa naunang talata. Pinananatili ng “ito” ang pagiging maikli at hindi labis na tinutukoy ang saklaw ng reperensiya.
- source_word: ἕως ὅτου
  choice: hanggang sa
  rationale: Ito ang natural na katumbas sa Tagalog para sa hangganang temporal na ipinahahayag ng parirala.
- source_word: πληρωθῇ
  choice: matupad ito
  rationale: Ang “matupad” ay nagpapanatili sa diwa ng katuparan ng πληρόω at sa posibleng eskatolohikal na pahiwatig nito, sa halip na gawing payak na “matapos.”
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: sa kaharian ng Diyos
  rationale: Pinananatili ng “kaharian” ang nakaugaliang biblikal na katawagan at ang mga kaugnay na diwa ng paghahari at nasasakupan; natural din sa Tagalog ang “ng Diyos.”
theological_decisions:
- issue: Ang tinutukoy ng αὐτό (“ito”)
  choice: Pinanatili ang panghalip na “ito,” na sa konteksto ay tumutukoy sa Paskuwa na kababanggit lamang.
  alternative: Tahasang isalin bilang “ang hapunang ito ng Paskuwa” o unawain nang mas malawak bilang pagdiriwang/pangyayari ng Paskuwa.
  rationale: Ang agarang konteksto sa talata 15 ay ang pagkain ni Jesus ng “Paskuwang ito” kasama ng mga alagad. Ang panghalip ay nagpapanatili sa kaiklian ng Griyego at hindi nagpapasya kung pagkain lamang o mas malawak na pagdiriwang ang saklaw.
- issue: Kahulugan ng “matupad sa kaharian ng Diyos”
  choice: Pinanatili ang wika ng katuparan nang hindi tinutukoy kung paano eksaktong matutupad ang Paskuwa.
  alternative: Ipaliwanag bilang katuparan sa pagdating ng kaharian ng Diyos o sa mesiyanikong piging.
  rationale: Itinuturo ng teksto ang panghinaharap na katuparan, ngunit hindi nito tahasang inilalarawan ang paraan o tiyak na pangyayari. Kaya hindi nilulutas ng salin ang tunay na teolohikal na tensiyon.
- issue: Kung ipinahihiwatig ang “muli” sa mariing pagtanggi
  choice: Hindi isinama ang “muli” sa pangunahing teksto sapagkat wala itong tahasang katumbas sa Griyego.
  alternative: “Tiyak na hindi ko na ito muling kakainin hanggang…”
  rationale: Maaaring ipahiwatig ng konteksto ang muling pagkain sa hinaharap, ngunit mas tapat na panatilihin itong implikasyon at ilagay ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Sapagkat” upang mapanatili ang ugnayang paliwanag, “tiyak na hindi” para sa mariing pagtanggi, at “matupad” upang mapanatili ang biblikal at eskatolohikal na himig nang hindi labis na nagpapakahulugan.
