  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Ἔτι αὐτοῦ λαλοῦντος ἰδοὺ ὄχλος, καὶ ὁ λεγόμενος Ἰούδας εἷς τῶν δώδεκα προήρχετο αὐτούς, καὶ ἤγγισεν τῷ Ἰησοῦ φιλῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/047.yaml
  text: While he was still speaking[a], behold, a crowd came, and the one called Judas, one of the twelve, was going before them, and he came near to Jesus to kiss him.
translation:
  language: tl
  text: Habang nagsasalita pa siya, narito, dumating ang isang pulutong. Ang tinatawag na Judas, na isa sa Labindalawa, ay nauuna sa kanila[a]. Lumapit siya kay Jesus upang halikan siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nangunguna sa kanila” o “pumunta sa unahan nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Habang nagsasalita pa siya
  rationale: Ipinapahayag ng genitive absolute ang nagpapatuloy na pagkilos kasabay ng sumunod na pangyayari; likas sa modernong Tagalog ang ayos na ito at napananatili ang diwa ng ἔτι.
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili ang pantawag-pansing gamit ng ἰδοὺ at ang sigla ng salaysay, nang hindi ito ginagawang tahasang pahayag ng pagkabigla.
- source_word: ὄχλος
  choice: isang pulutong
  rationale: Tumutukoy ang ὄχλος sa maraming taong nagkakatipon. Ang pandiwang “dumating” ay likas na ipinahihiwatig ng konteksto at bumubuo ng malinaw na sugnay sa Tagalog.
- source_word: ὁ λεγόμενος Ἰούδας
  choice: ang tinatawag na Judas
  rationale: Malapit ito sa participial na pagkakakilanlan sa Griyego at walang idinaragdag na mapanlibak o mapanghusgang pahiwatig.
- source_word: εἷς τῶν δώδεκα
  choice: isa sa Labindalawa
  rationale: Likas na salin ito na pinananatili ang pagkakakilanlan ni Judas bilang kabilang sa natatanging pangkat ng labindalawang alagad.
- source_word: προήρχετο αὐτούς
  choice: nangunguna sa kanila
  rationale: Naipahihiwatig nito kapuwa ang pag-una sa pangkat at ang posibleng diwa ng pangunguna, habang hindi labis na iginigiit na pormal siyang pinuno. Ang anyong nagpapatuloy ay kaayon ng imperfect sa Griyego.
- source_word: ἤγγισεν τῷ Ἰησοῦ
  choice: Lumapit siya kay Jesus
  rationale: Malinaw at likas na ipinapahayag nito ang kilos ng paglapit na tinutukoy ng ἐγγίζω.
- source_word: φιλῆσαι αὐτόν
  choice: upang halikan siya
  rationale: Direktang inilalarawan nito ang layunin ng paglapit ni Judas nang hindi ipinapasok sa pangunahing teksto ang paliwanag tungkol sa pagbati o pagtataksil.
theological_decisions:
- issue: Paglalarawan sa ginawa ni Judas
  choice: Tuwirang isinalin ang kanyang paglapit at layuning halikan si Jesus, nang hindi idinaragdag ang salitang “ipagkanulo.”
  alternative: “upang ipagkanulo siya sa pamamagitan ng isang halik”
  rationale: Malinaw sa mas malawak na konteksto ang pagtataksil, ngunit sa talatang ito ay paglapit at layuning humalik ang tahasang sinasabi. Pinananatili ng salin ang tensiyon ng salaysay at hindi ipinapasok ang interpretasyon sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “narito” bilang bahagyang markadong panawag-pansin na tumutugma sa ἰδοὺ, at “Labindalawa” bilang katawagan sa natatanging pangkat ng mga alagad.
