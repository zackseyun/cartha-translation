  text: Ἐγένετο δὲ καὶ φιλονεικία ἐν αὐτοῖς, τὸ τίς αὐτῶν δοκεῖ εἶναι μείζων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/024.yaml
  text: A dispute also arose among them as to which of them was considered to be greater[a].
translation:
  language: tl
  text: Nagkaroon din sila ng pagtatalo kung sino sa kanila ang itinuturing na mas dakila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “waring mas dakila.” Ang pandiwang Griyego ay maaaring mangahulugang “waring” o “itinuturing.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: Nagkaroon
  rationale: Ipinahahayag dito ng γίνομαι ang paglitaw o pagsisimula ng isang pangyayari; natural sa Filipino ang “nagkaroon” para sa pagbangon ng pagtatalo.
- source_word: δὲ καὶ
  choice: din
  rationale: Ang δέ ay banayad na nag-uugnay sa kasunod na pangyayari, samantalang ang καί ay may diwang pandagdag. Sapat na naipahahayag ng “din” ang pagdaragdag nang hindi nagpapasok ng labis na pagsalungat o tahasang temporal na pananda.
- source_word: φιλονεικία
  choice: pagtatalo
  rationale: Tumutukoy ang salita sa alitan o mapagpaligsahang pagtatalo. Malinaw at natural ang “pagtatalo” sa konteksto ng pag-uusap tungkol sa katayuan.
- source_word: ἐν αὐτοῖς
  choice: sila … ng pagtatalo
  rationale: Ipinakikita ng kayariang Filipino na ang pagtatalo ay naganap sa loob ng kanilang pangkat; mas natural ito kaysa literal na “sa kanila.”
- source_word: τὸ τίς αὐτῶν
  choice: kung sino sa kanila
  rationale: Ipinakikilala ng artikulo ang nilalaman ng pagtatalo bilang isang di-tuwirang tanong; ang “kung sino sa kanila” ang likas na katumbas sa Filipino.
- source_word: δοκεῖ
  choice: itinuturing
  rationale: Maaaring mangahulugan ang δοκέω na “waring” o “itinuturing.” Sa usapin ng katayuan sa pangkat, malinaw na naihahatid ng “itinuturing” ang panlipunang pagtataya habang inilalagay sa talababa ang tunay na alternatibo.
- source_word: εἶναι μείζων
  choice: na mas dakila
  rationale: Pinananatili ng “mas dakila” ang pahambing na anyo ng μείζων at ang usapin ng nakahihigit na katayuan, nang hindi ito ginagawang pasukdol na “pinakadakila.”
theological_decisions:
- issue: Wika tungkol sa katayuan ng mga alagad
  choice: mas dakila
  alternative: pinakadakila; mas mahalaga
  rationale: Pahambing ang μείζων, hindi tahasang pasukdol. Pinananatili ng salin ang anyo at tensiyon ng Griyego nang hindi pinalalakas bilang “pinakadakila” o nililinaw nang labis bilang “mas mahalaga.”
- issue: Saklaw ng δοκεῖ
  choice: itinuturing
  alternative: waring
  rationale: Ang konteksto ng pagtatalo tungkol sa katayuan ay umaayon sa “itinuturing,” ngunit maaari ring tumukoy ang pandiwa sa kung sino ang “waring” mas dakila. Pinananatili sa talababa ang leksikal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “pagtatalo” at natural na ayos na “kung sino sa kanila,” habang pinanatili ang pahambing na “mas dakila” at ang kalabuan ng δοκεῖ sa pamamagitan ng talababa.
