base_translation:
  language: en
  yaml_path: translation/nt/luke/022/042.yaml
  text: saying[a], “Father, if you are willing, take this cup away from me. Nevertheless, not my will[c][b], but yours be done.”
translation:
  language: tl
  text: na sinasabi, “Ama, kung nais mo, ilayo mo sa akin ang kopang ito.[a] Gayunman, huwag ang kalooban ko ang mangyari, kundi ang sa iyo.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Biblia, ang “kopa” ay maaaring maging talinghaga para sa bahaging itinakda sa isang tao, lalo na sa pagdurusa o hatol.
    reason: cross_reference
  - marker: b
    text: 'Maaari ring isalin: “huwag ang nais ko, kundi ang nais mo ang mangyari.”'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: na sinasabi
  rationale: Pinananatili ang anyong participle at ang pagkakaugnay nito sa naunang kilos sa salaysay.
- source_word: Πάτερ
  choice: Ama
  rationale: Likas at marangal na tuwirang pagtawag sa Diyos sa makabagong Tagalog.
- source_word: εἰ βούλει
  choice: kung nais mo
  rationale: Ipinahahayag ng βούλομαι ang pagnanais o pagkukusa; malinaw at natural ang pariralang ito nang hindi inaalis ang kundisyon.
- source_word: παρένεγκε ... ἀπ’ ἐμοῦ
  choice: alisin mo sa akin
  rationale: Natural na Tagalog para sa pakiusap na ilayo o alisin ang kopa mula kay Jesus.
- source_word: τοῦτο τὸ ποτήριον
  choice: ang kopang ito
  rationale: Pinananatili ang kongkretong talinghagang ‘kopa’ at ang mga alusyong biblikal nito sa halip na ipaliwanag agad bilang pagdurusa o hatol.
- source_word: πλὴν
  choice: Gayunman
  rationale: Malinaw na naghuhudyat ng matibay na pagbaling mula sa pakiusap tungo sa pagpapasakop.
- source_word: μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν γινέσθω
  choice: huwag ang kalooban ko ang mangyari, kundi ang sa iyo
  rationale: Pinananatili ang tahasang paghahambing ng ‘kalooban ko’ at ‘ang sa iyo,’ habang natural na ipinapahayag sa Tagalog ang pautos na γινέσθω.
theological_decisions:
- issue: Ang ugnayan ng kalooban ni Jesus at ng kalooban ng Ama
  choice: “huwag ang kalooban ko ang mangyari, kundi ang sa iyo”
  alternative: “huwag ang nais ko, kundi ang nais mo”
  rationale: Tuwirang pinananatili ang pagkakaiba at ang pagpapasakop na nasa teksto, nang walang idinaragdag na paliwanag na doktrinal o pagpapalabnaw sa tensiyong teolohikal.
- issue: Ang talinghagang ‘kopa’
  choice: Panatilihin ang ‘kopa’ sa pangunahing teksto
  alternative: “ang pagdurusang ito” o “ang pagsubok na ito”
  rationale: Mahalaga ang talinghaga sa mas malawak na wikang biblikal. Ang pagpapalit nito ng paliwanag ay magpapaliit sa saklaw at alusyong taglay ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kopa” upang mapanatili ang kinikilalang talinghagang biblikal, at iniwasan ang mga salitang lubhang arkaiko o paliwanag na higit sa sinasabi ng Griyego.
