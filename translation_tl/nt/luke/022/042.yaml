  source_fidelity: Tumpak ang pangunahing diwa at ang panalangin ng pagpapasakop. Gayunman, ang “alisin mo sa akin” ay hindi gaanong malinaw na naipapahayag ang direksiyong ἀπ’ ἐμοῦ (“palayo mula sa akin”) na kaugnay ng παρένεγκε. Ang “ilayo mo sa akin” ay mas tuwiran at natural para rito.
  naturalness: Marangal at nauunawaan ang Tagalog. Mas idiomatiko ang “ilayo mo sa akin ang kopang ito” kaysa “alisin mo sa akin ang kopang ito.” Ang “kopa” ay katanggap-tanggap sa rehistrong biblikal at pinananatili ang metapora.
  terminology: Wasto ang “Ama,” “kalooban,” at “kopa.” Hindi dapat palitan ang “kopa” ng pagpapaliwanag tulad ng “pagdurusa,” sapagkat pinananatili nito ang talinghaga ng Griyego. Ang alternatibong tala sa “nais” ay maayos, ngunit ang pangunahing teksto ay wastong nananatili sa “kalooban.”
