id: LUK.22.67
reference: Luke 22:67
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγοντες· Εἰ σὺ εἶ ὁ χριστός, εἰπὸν ἡμῖν. εἶπεν δὲ αὐτοῖς· Ἐὰν ὑμῖν εἴπω οὐ μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/067.yaml
  text: saying[a], “If you are the Messiah, tell us.” But he said to them, “If I tell you, you will certainly not believe;”
translation:
  language: tl
  text: na nagsasabi, “Kung ikaw ang Mesiyas[a], sabihin mo sa amin.” Ngunit sinabi niya sa kanila, “Kung sasabihin ko sa inyo, tiyak na hindi kayo maniniwala;”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.”
    reason: Ibinibigay ang tradisyonal na alternatibong salin ng titulong ὁ χριστός.
lexical_decisions:
- source_word: λέγοντες
  choice: na nagsasabi
  rationale: Pinananatili ang participial na kaugnayan sa naunang salaysay at likas na ipinakikilala ang mismong sinabi ng konseho.
- source_word: Εἰ σὺ εἶ
  choice: Kung ikaw ang
  rationale: Pinananatili ang tahasang kondisyunal na anyo ng Griyego sa halip na gawing tuwirang tanong.
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Titularyo ang gamit at nakaugat sa paghihintay ng mga Judio sa ipinangakong pinahiran; mas malinaw ito sa modernong Tagalog kaysa transliterasyong “Cristo” sa kontekstong ito.
- source_word: εἰπὸν ἡμῖν
  choice: sabihin mo sa amin
  rationale: Natural na Tagalog na pautos at tapat sa diwa ng λέγω na may datibong tumatanggap.
- source_word: εἶπεν δὲ αὐτοῖς
  choice: Ngunit sinabi niya sa kanila
  rationale: Ipinahahayag ng “Ngunit” ang banayad na pagsalungat o paglipat na dala ng δέ.
- source_word: Ἐὰν ὑμῖν εἴπω
  choice: Kung sasabihin ko sa inyo
  rationale: Natural na kondisyunal sa Tagalog na pinananatili ang diwa ng aorist subjunctive sa ikatlong-uring kondisyon.
- source_word: οὐ μὴ πιστεύσητε
  choice: tiyak na hindi kayo maniniwala
  rationale: Ipinahahayag ng “tiyak na hindi” ang mariing pagtanggi ng οὐ μή nang malinaw at hindi makaluma.
theological_decisions:
- issue: Pagsasalin sa Χριστός bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa pagtatanong ng konseho, malinaw na titulo ang Χριστός at tumutukoy sa mesiyanikong pag-asa ng mga Judio. Pinananatili ng “Mesiyas” ang kahulugang ito, habang inilalagay sa talababa ang tradisyonal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang kondisyunal na anyo at mariing negasyon ng Griyego, pati ang bantas na nagpapakitang nagpapatuloy ang pangungusap sa kasunod na talata.
