  text: But you are the ones who have remained with me in my trials[a].
translation:
  language: tl
  text: Ngunit kayo ang mga nanatiling kasama ko sa aking mga pagsubok[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring tumukoy sa “mga tukso” o “mga pagtitiis.” Ang salitang Griyego ay maaaring mangahulugan ng tukso o pagsubok; sa kontekstong ito, malamang na tumutukoy ito sa mga hirap na dinanas ni Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: kayo
  rationale: Ang tahasang panghalip na pangmaramihan sa unahan ng pangungusap ay nagbibigay-diin sa mga alagad; natural na naipahahayag ito sa Filipino sa pariralang “kayo ang mga.”
- source_word: δέ
  choice: Ngunit
  rationale: Ipinakikita nito ang pagsalungat sa naunang konteksto, kaya ang “Ngunit” ang malinaw at natural na katumbas.
- source_word: οἱ διαμεμενηκότες
  choice: ang mga nanatili
  rationale: Ang articular perfect active participle ay tumutukoy sa isang tiyak na pangkat na nagpatuloy hanggang sa kasalukuyang sandali. Napananatili ng “ang mga nanatili” ang pagkakakilanlan ng pangkat at ang diwa ng patuloy na katapatan.
- source_word: μετ’ ἐμοῦ
  choice: kasama ko
  rationale: Natural na katumbas ito ng μετά na may genitive, na nagsasaad ng pakikisama o pag-iral na kapiling ng isang tao.
- source_word: ἐν τοῖς πειρασμοῖς μου
  choice: sa aking mga pagsubok
  rationale: Maaaring tumukoy ang πειρασμός sa pagsubok, paglalagay sa pagsubok, o tukso. Ang “mga pagsubok” ang pinakamalinaw sa kontekstong tumutukoy sa mga hirap at paghamong dinanas ni Jesus, habang inilalahad sa talababa ang tunay na lawak ng salitang Griyego.
theological_decisions:
- issue: Kahulugan ng πειρασμοῖς kapag tumutukoy kay Jesus
  choice: mga pagsubok na dinanas ni Jesus
  alternative: mga tuksong naranasan ni Jesus
  rationale: Sa konteksto, pinupuri ni Jesus ang mga alagad dahil nanatili silang kasama niya sa gitna ng mga paghihirap at pagsalungat sa kanyang ministeryo. Gayunman, hindi inaalis ng salin ang posibilidad na kasama sa saklaw ng salitang Griyego ang tukso; kaya binabanggit ito sa talababa.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “nanatiling kasama ko” upang malinaw na ipahayag ang patuloy na pakikisama ng mga alagad kay Jesus nang hindi nagiging labis na teknikal.
