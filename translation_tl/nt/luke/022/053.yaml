  text: καθ’ ἡμέραν ὄντος μου μεθ’ ὑμῶν ἐν τῷ ἱερῷ οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ· ἀλλ’ αὕτη ⸂ἐστὶν ὑμῶν⸃ ἡ ὥρα καὶ ἡ ἐξουσία τοῦ σκότους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/053.yaml
  text: Day after day[a], while I was with you in the temple, you did not lay hands on me. But this is your hour[b], and the authority of darkness.
translation:
  language: tl
  text: Araw-araw, habang kasama ninyo ako sa templo, hindi ninyo ako dinakip.[a] Ngunit ito ang oras ninyo at ang kapamahalaan ng kadiliman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “hindi ninyo iniunat ang inyong mga kamay laban sa akin.” Ang idyomang Griyego ay tumutukoy rito sa pagkilos laban sa isang tao, sa kontekstong ito ay upang dakpin ako.'
    reason: lexical_alternative
  - marker: b
    text: O, “kapangyarihan ng kadiliman.”
    reason: alternative_reading
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Araw-araw
  rationale: Likas at malinaw na distributibong pananalita sa modernong Tagalog na nagpapahayag ng paulit-ulit na pangyayari sa bawat araw.
- source_word: ὄντος μου μεθ’ ὑμῶν
  choice: habang kasama ninyo ako
  rationale: Isinasalin ang genitive absolute bilang natural na sugnay na temporal at pinananatili ang diwang kasabay ng pangyayari.
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Ang ἱερόν ay tumutukoy sa kabuuang kompleks o nasasakupan ng templo; ang karaniwang saling “sa templo” ay malinaw at hindi labis na nagpapaliwanag.
- source_word: οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ
  choice: hindi ninyo ako dinakip
  rationale: Sa konteksto, ang literal na pag-uunat ng mga kamay laban kay Jesus ay idyoma para sa marahas na pagkilos upang dakpin siya. Ang “dinakip” ay natural at tiyak sa Tagalog; inilalagay sa talababa ang literal na anyo.
- source_word: ἀλλ’ αὕτη ἐστὶν ὑμῶν ἡ ὥρα
  choice: Ngunit ito ang oras ninyo
  rationale: Pinananatili ng “oras ninyo” ang mariin at bahagyang metaporikal na ὥρα bilang takdang sandaling nauukol sa kanila, nang hindi ito nilalabisan ng paliwanag.
- source_word: ἐξουσία
  choice: kapamahalaan
  rationale: Ipinahahayag nito ang awtoridad o umiiral na paghahari, hindi lamang hilaw na lakas. Pinananatili rin nito ang kaibhan sa posibleng saling “kapangyarihan.”
- source_word: τοῦ σκότους
  choice: ng kadiliman
  rationale: Pinananatili ang personipikado at teolohikal na metapora ng Griyego nang hindi tahasang ipinapantay ang kadiliman kay Satanas o sa kasamaan.
theological_decisions:
- issue: Kung dapat tukuyin nang tahasan ang “kapamahalaan ng kadiliman” bilang kapamahalaan ni Satanas o paghahari ng kasamaan
  choice: Panatilihin ang metaporikal na “kapamahalaan ng kadiliman.”
  alternative: kapangyarihan ng kadiliman; kapamahalaan ni Satanas; paghahari ng kasamaan
  rationale: “Kadiliman” mismo ang sinasabi ng teksto at hindi nito tahasang pinapangalanan si Satanas. Pinananatili ng salin ang espirituwal at teolohikal na bigat pati ang tunay na di-tiyak na saklaw ng metapora.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “dinakip” para sa likas na pagpapahayag ng idyoma at “kapamahalaan” upang mapanatili ang diin ng ἐξουσία sa awtoridad o paghahari. Ang mga panandang [a] at [b] ay inilagay mismo sa mga pariralang nililinaw ng mga talababa.
