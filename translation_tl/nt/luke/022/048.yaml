base_translation:
  language: en
  yaml_path: translation/nt/luke/022/048.yaml
  text: But Jesus said to him[a], “Judas, are you betraying the Son of Man with a kiss?”
translation:
  language: tl
  text: Ngunit sinabi ni Jesus sa kanya, “Judas, ipinagkakanulo mo ba ang Anak ng Tao sa isang halik?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “isinusuko mo ba ang Anak ng Tao sa isang halik?”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Mahinang pang-ugnay ang δέ, ngunit may pagsalungat dito sa kilos ni Judas; natural na ipinahahayag ito ng “Ngunit.”
- source_word: εἶπεν αὐτῷ
  choice: sinabi ni Jesus sa kanya
  rationale: Pinananatili ang tahasang αὐτῷ (“sa kanya”) at gumagamit ng likas na ayos sa Tagalog.
- source_word: Ἰούδα
  choice: Judas
  rationale: Tuwirang panawag ito sa pangalan, ayon sa nakagawiang anyo sa Tagalog.
- source_word: φιλήματι
  choice: sa pamamagitan ng isang halik
  rationale: Ipinahahayag ang datibo ng paraan o instrumento at pinananatili ang kongkretong kilos na halik.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang nakaugaliang titulo ni Jesus at ang pahiwatig nito sa Daniel, nang hindi ito ginagawang pangkalahatang katawagan lamang.
- source_word: παραδίδως
  choice: ipinagkakanulo mo ba
  rationale: Sa konteksto ng pagdakip kay Jesus, taglay ng παραδίδως ang diwang mapanlinlang na pagsuko; ang aspektong nagaganap ay likas na naihahayag ng “ipinagkakanulo mo ba.”
theological_decisions:
- issue: Pagkakasalin ng τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  alternative: ang Taong Anak / ang Isang Tao
  rationale: Ang parirala ay natatanging pagtukoy ni Jesus sa kanyang sarili. Pinananatili ng “Anak ng Tao” ang anyo at intertekstuwal na bigat ng titulo nang hindi nilulutas ang lahat ng kahulugan nito.
- issue: Saklaw ng kahulugan ng παραδίδως
  choice: ipinagkakanulo mo ba
  alternative: ipinauubaya mo ba / ibinibigay mo ba sa kamay ng iba
  rationale: Ang konteksto ay malinaw na pagtataksil, ngunit maaaring literal na mangahulugan ang pandiwa na “ipasa” o “ipaubaya.” Inilalagay sa talababa ang mas literal na alternatibo upang mapanatili ang saklaw ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang retorikal na tanong, ang tuwirang pagtawag kay Judas, at ang tradisyonal na titulong “Anak ng Tao.”
