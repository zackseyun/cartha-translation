base_translation:
  language: en
  yaml_path: translation/nt/luke/022/006.yaml
  text: And he agreed[a], and began seeking an opportunity to hand him over to them apart from the crowd.
translation:
  language: tl
  text: At pumayag siya at patuloy na naghanap ng pagkakataong maibigay niya si Jesus sa kanila[a] nang wala ang karamihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang ipagkanulo niya si Jesus sa kanila.” Ang pandiwang Griego ay literal na nangangahulugang “ibigay” o “ipasa sa kapangyarihan ng iba”; sa ginawa ni Judas, ang “ipagkanulo” ay angkop ding salin ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξωμολόγησεν
  choice: pumayag
  rationale: Sa konteksto ng tugon ni Judas sa mga punong pari at mga pinuno, ang pandiwa ay tumutukoy sa pagsang-ayon, hindi sa hayagang pagtatapat.
- source_word: ἐζήτει
  choice: naghanap
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang patuloy na paghahanap; natural na naipahahayag ito sa Filipino sa payak na anyong “naghanap” ayon sa daloy ng salaysay.
- source_word: εὐκαιρίαν
  choice: pagkakataon
  rationale: Natural at malinaw itong katumbas ng isang angkop o kanais-nais na pagkakataon para kumilos.
- source_word: τοῦ παραδοῦναι αὐτόν
  choice: maibigay siya sa kanila
  rationale: Pinananatili nito ang pangunahing diwa ng παραδίδωμι na ibigay o ipasa sa kapangyarihan ng iba, sa halip na agad itong ipakahulugang “ipagkanulo.”
- source_word: ἄτερ ὄχλου
  choice: nang walang maraming tao
  rationale: Ipinahahayag nito sa natural na Filipino na hinahanap ni Judas ang pagkakataong wala ang karamihan; ang ὄχλος dito ay tumutukoy sa pulutong ng mga tao.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Malinaw nitong tinutukoy bilang mga tatanggap ang mga punong pari at mga pinunong nabanggit sa naunang konteksto.
theological_decisions:
- issue: Paglalarawan sa ginawa ni Judas
  choice: maibigay siya sa kanila
  alternative: ipagkanulo siya sa kanila
  rationale: Ang “ipagkanulo” ay wastong interpretasyon sa konteksto, ngunit ang saling “maibigay” ay mas tuwirang nagpapanatili sa lawak ng kahulugan ng παραδίδωμι at sa pagkakapare-pareho nito sa salaysay ng paghihirap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “maraming tao” sa halip na mas pormal na “karamihan” o “pulutong” upang maging likas sa ordinaryong mambabasa, habang pinananatili ang diwang wala ang crowd.
