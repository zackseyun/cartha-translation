  source_fidelity: Ang “pumayag” ay tumpak para sa ἐξωμολόγησεν sa kontekstong ito, at ang “pagkakataon” ay mabuting katumbas ng εὐκαιρίαν. Gayunman, ang payak na “naghanap” ay hindi malinaw na naihahayag ang imperpektibong ἐζήτει, at ang “nang walang maraming tao” ay puwedeng mangahulugang may iilang tao pa rin, samantalang ang ἄτερ ὄχλου ay tumutukoy sa kawalan ng pulutong. Ang “maibigay siya” ay hindi gaanong malinaw sa Filipino hinggil sa gumaganap at sa tinutukoy ng panghalip.
  naturalness: Mas natural at malinaw ang “patuloy na naghanap” para sa nagpapatuloy na kilos at “nang wala ang karamihan” para sa kawalan ng pulutong. Ang tahasang “niya si Jesus” ay nag-aalis ng hindi likas at posibleng malabong pagkakasunod ng mga panghalip.
  terminology: Pinananatili ng “ibigay ... sa kanila” ang mas malawak na diwa ng παραδιδόναι kaysa sa interpretibong “ipagkanulo.” Ang huli ay angkop bilang alternatibong salin sa talababa. Ang “karamihan” dito ay likas at sapat na tumutukoy sa ὄχλος bilang pulutong, hindi lamang sa dami ng tao.
