  - severity: medium
    issue: Mahina at bahagyang naiibang diwa ang “nang walang maraming tao.”
    rationale: Maaari itong mangahulugang hindi marami ang tao, samantalang ang ἄτερ ὄχλου ay “nang wala ang pulutong/karamihan.”
  - severity: low
    issue: Hindi gaanong malinaw ang “maibigay siya sa kanila.”
    rationale: Ang magkakasunod na panghalip at ang anyong balintiyak ay maaaring magpahina sa pagkakalinaw ng gumaganap at ng tinutukoy. Ang “maibigay niya si Jesus sa kanila” ay mas idiomatiko at malinaw.
