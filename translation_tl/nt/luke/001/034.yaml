base_translation:
  language: en
  yaml_path: translation/nt/luke/001/034.yaml
  text: But Mary said to the angel[a], “How will this be, since I have not known a man?”
translation:
  language: tl
  text: Ngunit sinabi ni Maria sa anghel[a], “Paano ito mangyayari, gayong hindi ako nakipagtalik sa isang lalaki?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “hindi ko kilala ang isang lalaki,” isang magalang na idyoma na tumutukoy sa pakikipagtalik.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ang bahagyang pagsalungat o pagtugon ni Maria sa ipinahayag ng anghel, nang hindi pinatitindi ang kaibahan.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Karaniwang anyo ng pangalang Μαριάμ sa Filipino.
- source_word: πρὸς τὸν ἄγγελον
  choice: sa anghel
  rationale: Bagaman maaaring mangahulugang “mensahero” ang ἄγγελος, malinaw sa konteksto na isang makalangit na anghel ang tinutukoy.
- source_word: Πῶς ἔσται τοῦτο
  choice: Paano ito mangyayari
  rationale: Likas na modernong Filipino para sa tanong kung paano magkakatotoo ang ipinahayag; pinananatili ang hinaharap na diwa ng ἔσται.
- source_word: ἐπεὶ
  choice: gayong
  rationale: Ipinakikilala ang kalagayang batayan ng tanong ni Maria at natural sa Filipino sa ganitong pangungusap.
- source_word: ἄνδρα
  choice: isang lalaki
  rationale: Pinananatili ang pangkalahatang kahulugan na “lalaki” sa halip na paliitin ito sa “asawa.”
- source_word: οὐ γινώσκω
  choice: hindi ako nakipagtalik
  rationale: Ang literal na “hindi nakakakilala” ay hindi likas at madaling mapagkamalan sa modernong Filipino. Dito, ang γινώσκω ay isang magalang na idyoma para sa pakikipagtalik, kaya tahasang isinalin ang kontekstuwal na kahulugan.
theological_decisions:
- issue: Ang pahayag ni Maria at ang paglilihi kay Jesus
  choice: Isinalin ang idyoma bilang “hindi ako nakipagtalik sa isang lalaki.”
  alternative: “hindi ako nakakakilala ng lalaki” o “ako ay birhen”
  rationale: Malinaw nitong ipinahahayag ang seksuwal na diwa ng Griyegong idyoma nang hindi nagdaragdag ng higit sa sinasabi ng teksto. Iniwasan ang “ako ay birhen” sapagkat interpretatibong pagbubuod iyon, at iniwasan ang literal na “nakakakilala” dahil hindi nito natural na naihahatid ang idyoma sa kasalukuyang Filipino.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tahasang ngunit hindi bulgar na “nakipagtalik” upang maihatid nang wasto ang Griyegong idyoma; inilagay sa talababa ang literal na anyo para sa transparency.
