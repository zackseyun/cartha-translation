  text: And Mary said[a], “My soul magnifies the Lord,”
translation:
  language: tl
  text: At sinabi ni Maria, “Dinadakila[a] ng aking kaluluwa ang Panginoon,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ipinahahayag ng aking kaluluwa ang kadakilaan ng Panginoon.”
    reason: Ipinakikita ang posibleng mas malinaw na pagpapahayag ng μεγαλύνει nang hindi pinapalitan ang makatang pangunahing salin.
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay ng salaysay nang hindi nagdaragdag ng tiyak na diwang panahunan gaya ng “Pagkatapos.”
- source_word: εἶπεν
  choice: sinabi
  rationale: Likas na katumbas sa makabagong Filipino para sa aorist na anyo ng λέγω sa pambungad ng tuwirang pananalita.
- source_word: Μαριάμ
  choice: Maria
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino.
- source_word: Μεγαλύνει
  choice: Dinadakila
  rationale: Ipinahahayag nito ang patuloy at makatang pagpupuri sa Panginoon bilang dakila. Mas likas ito sa Filipino kaysa sa literal na metapora ng “pinalalaki,” habang pinananatili ang lakas ng pandiwang Griyego.
- source_word: ἡ ψυχή μου
  choice: ng aking kaluluwa
  rationale: Pinananatili ang tahasang makata at biblikal na pananalita sa halip na paikliin ito bilang “ako” o ipakahulugan bilang “aking kalooban.”
- source_word: τὸν κύριον
  choice: ang Panginoon
  rationale: Ang κύριος ay ginagamit dito bilang mapitagang banal na titulo sa konteksto ng pagpupuri sa Diyos; ang “Panginoon” ang angkop at nakaugaliang salin.
theological_decisions:
- issue: Pagkakasalin ng κύριος
  choice: ang Panginoon
  alternative: ang Guro / ang May-ari
  rationale: Sa himnong kontekstong ito, ang titulo ay tumutukoy sa Diyos at umaalingawngaw sa pananalita ng Kasulatan. Masyadong makitid at hindi angkop sa pagpupuri ang mga alternatibong tumutukoy lamang sa isang amo o may-ari.
- issue: Antropolohikal na pahayag na ἡ ψυχή μου
  choice: ng aking kaluluwa
  alternative: ako / ng aking buong pagkatao
  rationale: Pinananatili nito ang tunay na makata at teolohikal na anyo ng teksto nang hindi ipinapasiya kung ang “kaluluwa” ay simpleng pamalit lamang sa buong sarili o isang mas tiyak na sangkap ng tao.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang himnong ayos na “aking kaluluwa” at ang titulong “Panginoon,” habang ginamit ang likas na pandiwang “Dinadakila.”
