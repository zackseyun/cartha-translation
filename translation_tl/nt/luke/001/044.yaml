id: LUK.1.44
reference: Luke 1:44
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ ὡς ἐγένετο ἡ φωνὴ τοῦ ἀσπασμοῦ σου εἰς τὰ ὦτά μου, ἐσκίρτησεν ⸂ἐν ἀγαλλιάσει τὸ βρέφος⸃ ἐν τῇ κοιλίᾳ μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/044.yaml
  text: For behold[a], when the sound of your greeting came into my ears, the baby leaped for joy in my womb.
translation:
  language: tl
  text: Sapagkat, narito, nang umabot sa aking mga tainga ang tunog ng iyong pagbati, lumukso sa galak[a] ang sanggol sa aking sinapupunan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lumukso nang may matinding galak.”
    reason: Leksikal na alternatibo para sa ἐν ἀγαλλιάσει, na maaaring magpahiwatig ng masidhi o nag-uumapaw na galak.
lexical_decisions:
- source_word: ἰδοὺ
  choice: masdan mo
  rationale: Pinananatili ang puwersa nitong pantawag-pansin sa isang dignified ngunit nauunawaang anyo sa modernong Tagalog.
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinapakita ang paliwanag na kaugnayan ng pangungusap sa naunang sinabi ni Elisabet.
- source_word: ὡς ἐγένετο ... εἰς τὰ ὦτά μου
  choice: nang umabot sa aking mga tainga
  rationale: Natural sa Tagalog at pinananatili ang χρονological na diwa at ang direksiyonal, kongkretong larawan ng tunog na umaabot sa mga tainga.
- source_word: ἡ φωνὴ τοῦ ἀσπασμοῦ σου
  choice: ang tunog ng iyong pagbati
  rationale: Ang φωνή rito ay ang naririnig na tunog ng pagbati; mas akma ang “tunog” kaysa “tinig” sapagkat ang genitive phrase ay tumutukoy sa mismong pagbati.
- source_word: ἐσκίρτησεν
  choice: lumukso
  rationale: Matingkad at natural na katumbas ng biglaang pagkilos na inilalarawan ng pandiwa.
- source_word: ἐν ἀγαλλιάσει
  choice: sa galak
  rationale: Malinaw at likas na pagpapahayag ng masayang paraan o kalagayan ng paglukso, habang inilalagay sa talababa ang mas mariing alternatibo.
- source_word: τὸ βρέφος
  choice: ang sanggol
  rationale: Tumpak na tumutukoy sa isang sanggol, kasama ang sanggol na nasa sinapupunan, nang hindi nagdaragdag ng doktrinal na pahayag.
- source_word: ἐν τῇ κοιλίᾳ μου
  choice: sa aking sinapupunan
  rationale: Ito ang tiyak at natural na kahulugan ng κοιλία sa kontekstong ito.
theological_decisions:
- issue: Paglalarawan kay Juan na hindi pa isinisilang bilang βρέφος
  choice: ang sanggol
  alternative: ang bata
  rationale: Ang “sanggol” ang tuwirang leksikal at kontekstuwal na katumbas; pinananatili nito ang paglalarawan ng teksto nang hindi humihigit sa sinasabi nito.
- issue: Kung ang ἐν ἀγαλλιάσει ay pisikal lamang o nagpapahiwatig ng masayang tugon
  choice: lumukso sa galak
  alternative: lumukso nang may matinding galak
  rationale: Pinananatili ang tahasang masayang dimensiyon ng ἀγαλλίασις sa halip na gawing simpleng pisikal na paggalaw, ngunit hindi ipinapaliwanag kung paano dapat unawain ang kamalayan ng sanggol.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “masdan mo” upang mapanatili ang pantawag-pansing ἰδοὺ; ang natitirang pangungusap ay inayos sa likas na sintaks ng Tagalog nang hindi inaalis ang kongkretong larawan ng tunog na umaabot sa mga tainga.
