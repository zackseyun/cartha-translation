  text: Καὶ Ζαχαρίας ὁ πατὴρ αὐτοῦ ἐπλήσθη πνεύματος ἁγίου καὶ ⸀ἐπροφήτευσεν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/067.yaml
  text: 'And Zechariah his father was filled with the Holy Spirit and prophesied, saying:'
translation:
  language: tl
  text: 'At si Zacarias, ang kanyang ama, ay napuspos ng Banal na Espiritu at nagpropesiya. Sinabi niya:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ζαχαρίας
  choice: Zacarias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Bibliyang Tagalog, sa halip na isalin ang kahulugan nito.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: na ama ng bata
  rationale: Likas sa Tagalog at malinaw na si Zacarias ang ama ng batang si Juan; ginawang tahasan ang reperente ng panghalip upang maiwasan ang alanganing 'ama niya' sa bukana ng pangungusap.
- source_word: ἐπλήσθη
  choice: napuspos
  rationale: Pinananatili ang pasibong diwa at ang ganap na pangyayaring ipinahihiwatig ng aorist, gamit ang dignificado at pamilyar na salitang Tagalog.
- source_word: πνεύματος ἁγίου
  choice: ng Banal na Espiritu
  rationale: Ang genitibong kasama ng πίμπλημι ay likas na ipinapahayag sa Tagalog sa pamamagitan ng 'napuspos ng.' Sa konteksto ng inspirasyong mula sa Diyos sa Lucas, ang tinutukoy ay ang Banal na Espiritu.
- source_word: ἐπροφήτευσεν
  choice: nagpahayag bilang propeta
  rationale: Inihahayag nang malinaw sa karaniwang modernong Tagalog ang gawaing προφητεύω—pagsasalita bilang propeta—nang hindi ipinapalagay na panghuhula lamang ang kahulugan.
- source_word: λέγων
  choice: 'Sinabi niya:'
  rationale: Ginawang hiwalay na pangungusap ang participle upang natural na ipakilala sa Tagalog ang kasunod na propesiya.
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang dugtong sa naunang salaysay at ang payak na estilo ng naratibo ni Lucas.
theological_decisions:
- issue: Reperente ng πνεύματος ἁγίου
  choice: ang Banal na Espiritu
  alternative: banal na espiritu
  rationale: Sa Lucas–Mga Gawa, ang pariralang ito sa konteksto ng inspirasyong mula sa Diyos ay karaniwang tumutukoy sa Espiritu ng Diyos. Ipinahahayag ito ng kapitalisasyon nang walang idinaragdag na paliwanag na wala sa talata.
- issue: Saklaw ng ἐπροφήτευσεν
  choice: nagpahayag bilang propeta
  alternative: nagpropesiya
  rationale: Ang piniling anyo ay nagpapanatili sa propetikong katangian ng pananalita ngunit umiiwas sa makitid na modernong pagkaunawa na ang propesiya ay hula lamang tungkol sa hinaharap.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinili ang 'Zacarias' bilang pamilyar na anyong Tagalog at ang 'napuspos' bilang tradisyonal ngunit madaling maunawaang pandiwang biblikal. Walang talababa dahil walang tekstuwal o leksikal na suliraning nangangailangan nito sa mismong talata.
