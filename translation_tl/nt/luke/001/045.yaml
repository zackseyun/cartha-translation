  yaml_path: translation/nt/luke/001/045.yaml
  text: And blessed is she who believed that there will be a fulfillment of what was spoken to her by the Lord[a][b].
translation:
  language: tl
  text: At mapalad ang babaeng sumampalataya na magkakaroon ng katuparan ang mga bagay na sinabi sa kaniya mula sa Panginoon[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sapagkat magkakaroon ng katuparan ang mga bagay na sinabi sa kaniya mula sa Panginoon.” Maaari ring mangahulugang “sapagkat” ang salitang Griyego, bagaman mas malamang dito ang diwang “na.”
    reason: alternative_reading
  - marker: b
    text: Ang salitang isinaling “katuparan” ay maaari ring mangahulugang “pagkaganap” o “pagsasakatuparan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρία
  choice: pinagpala
  rationale: Pinananatili nito ang relihiyoso at tipanang bigat ng μακάριος sa Lucas, sa halip na gawing pansariling damdamin lamang gaya ng “maligaya.”
- source_word: ἡ πιστεύσασα
  choice: ang babaeng sumampalataya
  rationale: Likas sa Tagalog ang substantibong pariralang ito at ipinahihiwatig ng “sumampalataya” ang tiwala at paniniwala sa ipinangako ng Diyos.
- source_word: ὅτι
  choice: na
  rationale: 'Pinakamalamang na ipinapakilala nito ang nilalaman ng sinampalatayanan: na matutupad ang sinabi. Posible rin ang pagbasa nitong sanhi, kaya nakatala iyon sa talababa.'
- source_word: τελείωσις
  choice: matutupad
  rationale: Sa konteksto ng pangako ng Diyos, natural na ipinahahayag ng “matutupad” ang pagdadala sa ganap na katuparan nang hindi nagiging teknikal o mabigat.
- source_word: τοῖς λελαλημένοις
  choice: ang mga sinabi sa kaniya
  rationale: Malinaw at natural itong tumutukoy sa nilalaman ng naunang pahayag habang pinananatili ang pasibong diwa.
- source_word: παρὰ κυρίου
  choice: mula sa Panginoon
  rationale: Ang παρά na may genitive ay nagpapahiwatig ng pinagmulan; ipinakikita ng “mula sa Panginoon” na sa Panginoon nagmula ang mensahe.
- source_word: κυρίου
  choice: Panginoon
  rationale: Karaniwang salin ito ng κύριος at sa kontekstong ito ay tumutukoy sa Diyos bilang pinagmulan ng pangako.
theological_decisions:
- issue: Ugnayan ng pagiging pinagpala ng babae, ng kaniyang pananampalataya, at ng ipinangakong salita
  choice: Ipinahahayag na pinagpala ang babae na sumampalatayang matutupad ang sinabi mula sa Panginoon.
  alternative: Ipinahahayag na pinagpala ang babae dahil matutupad ang sinabi sa kaniya mula sa Panginoon.
  rationale: Pinakamadaling unawain sa balarila ang ὅτι bilang nagpapakilala sa nilalaman ng πιστεύσασα. Pinananatili nito ang diin ni Lucas sa pananampalataya sa pangako ng Diyos, habang kinikilala sa talababa ang posibleng pagbasa na sanhi.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ang babaeng sumampalataya” upang maging natural ang pagtukoy kay Maria nang hindi inuulit ang kaniyang pangalan, at “mula sa Panginoon” upang mapanatili ang diwa ng pinagmulan sa παρά + genitive.
