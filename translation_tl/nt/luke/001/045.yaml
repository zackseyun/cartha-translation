  naturalness: Mas natural at malinaw sa makabagong Tagalog ang “Mapalad ang babaeng sumampalataya na magkakaroon ng katuparan...” Ang “mapalad” ay angkop na pangungusap na pagpapahayag ng μακαρία, samantalang ang “pinagpala” ay maaaring higit na magpahiwatig ng pasibong pagkilos ng Diyos kaysa ng pagpapalang ipinahahayag sa babae.
  terminology: Ginamit ang “mapalad” para sa μακαρία at “katuparan” para sa τελείωσις. Pinanatili ang “sumampalataya,” “Panginoon,” at “mula sa Panginoon.” Hindi binabago ng rebisyon ang pagkakakilanlan ng babae o nagdaragdag ng doktrinal na pagpapakahulugan.
