id: LUK.1.38
reference: Luke 1:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν δὲ Μαριάμ· Ἰδοὺ ἡ δούλη κυρίου· γένοιτό μοι κατὰ τὸ ῥῆμά σου. καὶ ἀπῆλθεν ἀπ’ αὐτῆς ὁ ἄγγελος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/038.yaml
  text: And Mary said[a], “Behold, I am the Lord’s servant[b]. May it happen to me according to your word.” And the angel departed from her.
translation:
  language: tl
  text: Sinabi naman ni Maria, “Narito, ako ang lingkod[a] ng Panginoon. Mangyari nawa sa akin ayon sa iyong sinabi[b].” At umalis sa kanya ang anghel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aliping babae.” Ang salitang Griego na δούλη ay maaaring tumukoy sa isang aliping babae o babaeng lingkod; ginamit sa pangunahing teksto ang “lingkod” dahil binibigyang-diin dito ang mapagpakumbabang pagpapasakop ni Maria sa Diyos.
    reason: alternative_reading
  - marker: b
    text: O “Maganap nawa sa akin ayon sa iyong salita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: naman
  rationale: Isang banayad na pang-ugnay na nagpapatuloy sa salaysay nang hindi nagdaragdag ng tiyak na pagkakasunod sa panahon.
- source_word: Ἰδοὺ
  choice: Narito
  rationale: Pinananatili ang mariin at marangal na pagpapakilala ni Maria sa sarili; natural din ito sa makabagong Filipino.
- source_word: δούλη
  choice: lingkod
  rationale: Maaaring tumukoy ang pambabaeng anyo sa isang aliping babae o babaeng lingkod. Sa konteksto, itinatampok ang mapagpakumbabang pagpapasakop ni Maria sa Panginoon; inilalagay sa talababa ang mas mariing kahulugang “aliping babae.”
- source_word: κυρίου
  choice: ng Panginoon
  rationale: Karaniwang salin ng banal na titulong κύριος at likas na nagpapahayag ng kaugnayan ni Maria sa Diyos.
- source_word: γένοιτό μοι
  choice: Mangyari nawa sa akin
  rationale: Ipinahahayag ng aorist middle optative ang kusang pagsang-ayon o paghiling, hindi lamang isang pangyayari sa hinaharap.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: ayon sa iyong sinabi
  rationale: Ipinahahayag ang pag-ayon ng mangyayari sa tiyak na pahayag ng anghel; mas natural sa Filipino ang “iyong sinabi” kaysa sa literal na “iyong salita” sa kontekstong ito.
- source_word: ἀπῆλθεν ἀπ’ αὐτῆς
  choice: umalis sa kanya
  rationale: Tuwiran at natural na salaysay ng paglisan ng anghel nang hindi nagdaragdag ng detalye.
- source_word: ὁ ἄγγελος
  choice: ang anghel
  rationale: Sa salaysay na ito, malinaw na isang makalangit na nilalang ang tinutukoy, hindi lamang isang taong mensahero.
theological_decisions:
- issue: Ang katawagan ni Maria sa sarili na δούλη
  choice: lingkod ng Panginoon
  alternative: aliping babae ng Panginoon
  rationale: Saklaw ng salita ang katayuan ng isang babaeng alipin, ngunit sa konteksto ay pangunahing ipinakikita ang mapagpakumbabang pagpapasakop ni Maria sa kalooban ng Diyos. Pinananatili sa talababa ang mas mariing diwa ng pagkaalipin.
- issue: Ang puwersa ng γένοιτό μοι
  choice: Mangyari nawa sa akin
  alternative: Maganap nawa sa akin
  rationale: Pinananatili ng “nawa” ang optative na diwa ng kusang pagtanggap o paghiling at hindi ito ginagawang simpleng pahayag tungkol sa hinaharap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Narito” at “nawa” upang mapanatili ang mariing pagpapakilala at kusang pagsang-ayon ni Maria nang hindi nagiging labis na makaluma.
