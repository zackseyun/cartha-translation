  text: But she was greatly troubled at the message[b][a], and kept considering what kind of greeting this might be.
translation:
  language: tl
  text: Ngunit lubha siyang nabagabag sa mensahe[a] at patuloy niyang pinag-iisipan kung anong uri ng pagbati iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa salita” o “dahil sa pahayag.” Maaaring mangahulugan ang Griyegong λόγος ng “salita,” “pahayag,” o “mensahe.”
    reason: lexical_alternative
  - marker: b
    text: O “at iniisip-isip kung anong uri ng pagbati ito.” Ipinahihiwatig ng imperpektong anyo ng pandiwang Griyego ang nagpapatuloy na pagninilay.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ang banayad na pagsalungat o paglipat mula sa pagbati ng anghel tungo sa reaksiyon ni Maria.
- source_word: ἐπὶ τῷ λόγῳ
  choice: sa sinabi sa kanya
  rationale: Tumutukoy ang λόγος sa pahayag na kababanggit lamang; likas sa modernong Tagalog ang pariralang ito at naipakikita ang dahilan ng pagkabagabag.
- source_word: διεταράχθη
  choice: labis siyang nabagabag
  rationale: Ipinahahayag ng pandiwa ang matinding pagkabalisa o pagkagulo ng kalooban, hindi lamang bahagyang pagtataka.
- source_word: διελογίζετο
  choice: patuloy na pinag-iisipan
  rationale: Pinananatili nito ang aspektong nagpapatuloy ng imperpektong Griyego at ang panloob na pagninilay.
- source_word: ποταπὸς
  choice: anong uri ng
  rationale: Tuwirang itinatanong ang katangian o kahulugan ng pagbati.
- source_word: εἴη
  choice: iyon
  rationale: Sa natural na Tagalog, naipapaloob sa di-tuwirang tanong na “kung anong uri ... iyon” ang maingat at di-tiyak na himig ng optative.
- source_word: ἀσπασμὸς οὗτος
  choice: pagbati iyon
  rationale: Malinaw na tumutukoy sa partikular na pagbating kasasabi lamang ng anghel.
theological_decisions:
- issue: Likas ng reaksiyon ni Maria
  choice: Nabagabag siya sa sinabi o pagbati at patuloy na pinag-isipan ang kahulugan nito.
  alternative: Nabagabag siya sa anyo ng anghel, o ipinahihiwatig ng reaksiyon niya ang kawalan ng pananampalataya.
  rationale: Tahasan siyang iniuugnay ng Griyego sa λόγος, at inilalarawan ang kaniyang patuloy na pag-iisip nang walang moral o teolohikal na paghatol sa reaksiyon niya.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nabagabag” upang maipahayag ang tindi nang hindi nagpapahiwatig ng kasalanan o kawalan ng pananampalataya; iniwasan ang mas luma at pormal na “pagbatiang” o “salutasyon.”
