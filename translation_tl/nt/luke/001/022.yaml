  text: ἐξελθὼν δὲ οὐκ ⸀ἐδύνατο λαλῆσαι αὐτοῖς, καὶ ἐπέγνωσαν ὅτι ὀπτασίαν ἑώρακεν ἐν τῷ ναῷ· καὶ αὐτὸς ἦν διανεύων αὐτοῖς, καὶ διέμενεν κωφός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/022.yaml
  text: But when he came out[a], he was not able to speak to them, and they realized that he had seen a vision in the sanctuary[b]. And he kept making signs to them and remained mute.
translation:
  language: tl
  text: Ngunit paglabas niya, hindi siya makapagsalita sa kanila. At napagtanto nila na nakakita siya ng isang pangitain sa santuwaryo[a]. Patuloy siyang sumesenyas sa kanila at nanatiling hindi makapagsalita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa templo.” Mas tiyak na tumutukoy ang salitang Griyego rito sa santuwaryo mismo kaysa sa buong kompleks ng templo.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego ay maaaring tumukoy sa isang taong hindi makapagsalita at, sa ilang konteksto, maaari ring magpahiwatig ng pagkabingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: paglabas niya
  rationale: Likas na temporal na salin ng aorist participle at malinaw na ipinapakita ang pagkakasunod ng mga pangyayari.
- source_word: οὐκ ἐδύνατο λαλῆσαι
  choice: hindi siya makapagsalita
  rationale: Tuwirang ipinapahayag ang kawalan niya ng kakayahang magsalita nang hindi nagiging mabigat o di-likas sa Filipino.
- source_word: ἐπέγνωσαν
  choice: napagtanto nila
  rationale: Ipinahihiwatig ng pandiwa na malinaw nilang naunawaan ang nangyari batay sa kaniyang kalagayan at mga kilos.
- source_word: ὀπτασίαν
  choice: isang pangitain
  rationale: Sa konteksto, tumutukoy ito sa isang di-pangkaraniwan o mapaghayag na pagpapakita, na likas na tinatawag na pangitain sa Filipino.
- source_word: ἐν τῷ ναῷ
  choice: sa santuwaryo
  rationale: Mas tiyak na tumutukoy ang ναός sa banal na gusali o santuwaryo mismo, hindi sa buong kompleks ng templo.
- source_word: ἦν διανεύων
  choice: patuloy siyang sumesenyas
  rationale: Napananatili nito ang patuloy na kilos na ipinahihiwatig ng periphrastic imperfect.
- source_word: διέμενεν
  choice: nanatili
  rationale: Malinaw at maikli nitong ipinapahayag ang nagpapatuloy na kalagayan.
- source_word: κωφός
  choice: hindi makapagsalita
  rationale: Ang agarang konteksto ay tahasang nakatuon sa kawalan ng kakayahang magsalita. Iniiwasan ng saling ito ang awtomatikong pagdagdag ng pagkabingi, habang inilalahad sa talababa ang mas malawak na saklaw ng salitang Griyego.
theological_decisions:
- issue: Saklaw ng κωφός sa naging kalagayan ni Zacarias
  choice: hindi makapagsalita
  alternative: pipi; bingi at hindi makapagsalita
  rationale: Binibigyang-diin ng talata ang hindi niya pagsasalita at ang pagsesenyas niya. Posibleng tumukoy rin ang κωφός sa pagkabingi sa ilang konteksto, ngunit hindi ito dapat ipilit sa pangunahing teksto; pinananatili ng talababa ang tunay na leksikal at salaysay na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “santuwaryo” upang mapanatili ang pagkakaiba ng ναός sa mas malawak na kompleks ng templo. Iniwasan sa pangunahing teksto ang “pipi” dahil mas neutral at mas malinaw ang “hindi makapagsalita,” bagaman nagdudulot ito ng sinadyang pag-uulit na naroon din sa diwa ng talata.
