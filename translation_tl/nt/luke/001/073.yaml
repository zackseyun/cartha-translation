  text: the oath that he swore to Abraham our father[a], to grant to us
translation:
  language: tl
  text: ang panunumpang ginawa niya kay Abraham, na ating ama,[a] na ipagkaloob sa atin
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ating ninuno.” Literal sa Griyego ang “ating ama,” na nagpapanatili sa pangtipang katawagan kay Abraham.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅρκον
  choice: ang sumpa
  rationale: Tumutukoy ito sa tiyak na sumpang binanggit bilang bahagi ng tipan; likas sa Filipino ang tiyak na anyong “ang sumpa.”
- source_word: ὃν ὤμοσεν
  choice: na binitiwan niya
  rationale: Ang “bumitiw ng sumpa” ay natural at marangal na idyomang Filipino para sa panunumpa, at naiiwasan ang alanganing pag-uulit na “sumpang isinumpa.”
- source_word: πρὸς Ἀβραὰμ
  choice: kay Abraham
  rationale: Sa konteksto ng panunumpa, ipinahihiwatig ng πρός ang taong pinatunguhan ng sumpa; malinaw itong naipapahayag ng “kay.”
- source_word: τὸν πατέρα ἡμῶν
  choice: na ating ama
  rationale: Pinananatili nito ang literal at pangtipang katawagang “ama” para kay Abraham, habang nananatiling natural sa modernong Filipino.
- source_word: τοῦ δοῦναι ἡμῖν
  choice: na ipagkaloob sa atin
  rationale: Ang “ipagkaloob” ay angkop sa marangal na himig ng awit ni Zacarias. Ang “na” ay nag-uugnay sa nilalaman o layon ng sumpa nang hindi labis na nilulutas ang posibleng ugnayang layunin/resulta ng articular infinitive.
theological_decisions:
- issue: Pangtipang katawagan kay Abraham
  choice: ating ama
  alternative: ating ninuno
  rationale: Pinananatili ng “ating ama” ang pampamilya at pangtipang pananalita ng Griyego. Ang “ninuno” ay malinaw sa angkan ngunit nagpapahina sa sadyang biblikal na katawagang “ama.”
- issue: Ugnayan ng τοῦ δοῦναι sa sumpa
  choice: na ipagkaloob sa atin
  alternative: upang ipagkaloob sa atin
  rationale: Maaaring ipahiwatig ng articular infinitive ang nilalaman, layunin, o bunga ng sumpa. Hindi ito tahasang nilulutas ng “na,” samantalang mas tiyak na layunin lamang ang ipinapahayag ng “upang.”
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang anyong fragmento sapagkat nagpapatuloy ang pangungusap mula sa naunang talata at hindi pa ganap ang diwa hanggang sa kasunod na talata.
