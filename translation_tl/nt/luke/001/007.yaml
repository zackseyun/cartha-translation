  text: καὶ οὐκ ἦν αὐτοῖς τέκνον, καθότι ⸂ἦν ἡ Ἐλισάβετ⸃ στεῖρα, καὶ ἀμφότεροι προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/007.yaml
  text: And they had no child[a], because Elizabeth was barren, and both of them were advanced in years.
translation:
  language: tl
  text: Wala silang anak, sapagkat baog si Elisabet, at kapuwa sila ay matanda na.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “may-edad na.” Sa literal, “nakapagpatuloy na sa kanilang mga araw.”
    reason: Ipinapaliwanag ang idyomang Griyego para sa pagiging matanda at nagbibigay ng mas magalang na posibleng salin.
lexical_decisions:
- source_word: τέκνον
  choice: anak
  rationale: Ang isahang τέκνον ay likas at tumpak na isinasalin bilang “anak”; hindi nito pinararami ang tinutukoy.
- source_word: καθότι
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan ng kawalan nila ng anak, habang pinananatili ang marangal na himig.
- source_word: στεῖρα
  choice: baog
  rationale: Tiyak na tumutukoy ang στεῖρα sa kawalan ng kakayahang magkaanak, hindi lamang sa kalagayang walang anak. Ang “baog” ang tuwiran at karaniwang katumbas sa Filipino.
- source_word: ἀμφότεροι
  choice: kapuwa
  rationale: Ipinakikita nitong ang kasunod na paglalarawan ay parehong tumutukoy kina Zacarias at Elisabet.
- source_word: προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν
  choice: may-edad
  rationale: Ang idyoma ay nangangahulugang matanda na sila. Ang “may-edad” ay natural, magalang, at hindi kasing-tahas ng “matanda na,” samantalang ipinapaliwanag sa talababa ang literal na larawan.
- source_word: οὐκ ἦν αὐτοῖς
  choice: Wala silang
  rationale: Ang literal na konstruksiyong “walang [anak] para sa kanila” ay isang idyoma ng pag-aari; “Wala silang” ang natural na katumbas sa Filipino.
