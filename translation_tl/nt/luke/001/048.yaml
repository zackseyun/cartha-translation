  text: ὅτι ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν τῆς δούλης αὐτοῦ, ἰδοὺ γὰρ ἀπὸ τοῦ νῦν μακαριοῦσίν με πᾶσαι αἱ γενεαί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/048.yaml
  text: because he has looked upon the humble state of his servant[a]. For behold[b], from now on all generations will call me blessed.
translation:
  language: tl
  text: sapagkat tiningnan niya ang abang kalagayan[a] ng kanyang aliping babae.[b] Sapagkat, narito, mula ngayon ay tatawagin akong pinagpala ng lahat ng salinlahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagkaaba” o “hamak na kalagayan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lingkod na babae”; ang salitang Griyego ay tumutukoy sa isang babaeng alipin.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέβλεψεν ἐπὶ
  choice: binalingan niya ng tingin
  rationale: Ipinahahayag nito ang sadyang pagbaling ng pansin ng Diyos kay Maria, na may pahiwatig ng mabuting pagturing, nang hindi nagdaragdag ng di-tahasang paliwanag.
- source_word: ταπείνωσιν
  choice: abang kalagayan
  rationale: Tumutukoy ito sa mababa at hamak na kalagayan ni Maria, hindi lamang sa panloob na kababaang-loob niya.
- source_word: δούλης
  choice: aliping babae
  rationale: Pinananatili nito ang matibay na diwa ng δούλη bilang babaeng alipin na nabibilang sa isang panginoon; nililinaw rin ng pambabaeng anyo ang sariling pagtukoy ni Maria.
- source_word: ἰδοὺ
  choice: masdan
  rationale: Pinananatili ang pantawag-pansin at mariing himig ng salitang Griyego, na angkop sa matayog na pananalita ng awit.
- source_word: ἀπὸ τοῦ νῦν
  choice: mula ngayon
  rationale: Likas at tuwirang ipinahahayag ang pasulong na panahong tinutukoy.
- source_word: μακαριοῦσίν με
  choice: tatawagin akong pinagpala
  rationale: Ipinahahayag ang pagkilala at pagpapahayag ng mga tao na si Maria ay pinagpala.
- source_word: πᾶσαι αἱ γενεαί
  choice: lahat ng salinlahi
  rationale: Tumutukoy sa sunod-sunod na mga salinlahi nang hindi idinaragdag ang salitang 'hinaharap,' na malinaw na sa 'mula ngayon.'
theological_decisions:
- issue: Ang pagtukoy ni Maria sa sarili bilang δούλη
  choice: aliping babae
  alternative: lingkod na babae
  rationale: Hindi pinalalambot ang wika ng ganap na pag-aari at pagpapasakop sa Diyos, ngunit hindi rin ito ginagawang batayan ng anumang kalaunang turo tungkol kay Maria.
- issue: Ang kahulugan ng ταπείνωσις sa awit ni Maria
  choice: abang kalagayan
  alternative: pagkaaba; hamak na kalagayan
  rationale: Pinananatili ang pokus sa mababa niyang kalagayan sa lipunan, habang hindi lubusang isinasara ang posibilidad ng mas malawak na diwa ng pagkaaba o pagpapakababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang “masdan” ay bahagyang matayog upang mapanatili ang makatang himig ng Magnificat, samantalang ang natitirang pangungusap ay tuwiran at madaling maunawaan.
