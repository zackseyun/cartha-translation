  text: καὶ ἤκουσαν οἱ περίοικοι καὶ οἱ συγγενεῖς αὐτῆς ὅτι ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς, καὶ συνέχαιρον αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/058.yaml
  text: And her neighbors and relatives heard that the Lord had shown great mercy to her[a], and they rejoiced with her.
translation:
  language: tl
  text: At narinig ng mga kapitbahay at mga kamag-anak niya na ipinakita ng Panginoon ang kanyang dakilang awa sa kanya, at nakigalak sila sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίοικοι
  choice: mga kapitbahay
  rationale: Tumutukoy sa mga naninirahan sa paligid niya; ito ang pinakanatural na katumbas sa modernong Tagalog.
- source_word: συγγενεῖς
  choice: mga kamag-anak
  rationale: Malinaw at karaniwang tawag sa mga taong kaanak niya.
- source_word: ἐμεγάλυνεν
  choice: lubhang pinalaki
  rationale: Pinananatili ang pangunahing larawan ng pandiwang μεγαλύνω, ‘palakihin’ o ‘dakilain,’ sa halip na lubusang gawing idyomatikong ‘nagpakita ng malaking awa.’
- source_word: κύριος
  choice: ang Panginoon
  rationale: Bagaman walang artikulo sa Griyego, tiyak na titulong tumutukoy sa Diyos ang gamit nito rito.
- source_word: ἔλεος
  choice: awa
  rationale: Karaniwan, malinaw, at angkop na salin ng habag o maawaing kagandahang-loob sa konteksto.
- source_word: μετ’ αὐτῆς
  choice: sa kanya
  rationale: Sa idyomang ito, ang literal na ‘kasama niya’ ay hindi natural sa Tagalog; ipinahahayag ng ‘sa kanya’ ang direksiyon ng awa nang hindi dinaragdagan ang diwa.
- source_word: συνέχαιρον αὐτῇ
  choice: nakipagsaya sila sa kanya
  rationale: Ipinahahayag ang sama-samang pagkagalak kasama ng babae, at pinananatili ang diwa ng unlaping συν-.
theological_decisions:
- issue: Pagpapahayag sa idyomang ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς
  choice: lubhang pinalaki ng Panginoon ang awa niya sa kanya
  alternative: nagpakita sa kanya ang Panginoon ng malaking awa
  rationale: Pinananatili ng pangunahing teksto ang talinghaga at leksikal na puwersa ng μεγαλύνω, pati ang posibleng alingawngaw ng wikang ‘pagpapalaki/pagdadakila’ sa kalapit na konteksto. Inilalagay sa talababa ang mas natural na idyomatikong salin upang luminaw ang kahulugan nang hindi binubura ang anyo ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘nakipagsaya’ sa halip na mas pormal na ‘nakigalak,’ at pinanatili ang bahagyang di-karaniwang ‘lubhang pinalaki ang awa’ upang maipakita ang larawan ng orihinal, kalakip ang natural na alternatibo sa talababa.
