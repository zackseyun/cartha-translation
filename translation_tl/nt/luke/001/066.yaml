base_translation:
  language: en
  yaml_path: translation/nt/luke/001/066.yaml
  text: And all who heard it laid it up in their hearts[a], saying[b], “What then will this child become?” For the hand of the Lord was with him.
translation:
  language: tl
  text: At isinapuso ito ng lahat ng nakarinig at nagsabi, “Ano kaya ang magiging batang ito?”[a] Sapagkat ang kamay ng Panginoon ay kasama niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal: “Ano kaya ang magiging batang ito?” Ang pandiwang Griyego ay “magiging,” ngunit sa konteksto ay itinatanong ang magiging kalagayan o papel niya sa hinaharap.'
    reason: lexical_alternative
  - marker: b
    text: Ang “kamay ng Panginoon” ay isang biblikal na idyoma para sa aktibong kapangyarihan, paglingap, o patnubay ng Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθεντο ... ἐν τῇ καρδίᾳ αὐτῶν
  choice: nag-ukit nito sa kanilang puso
  rationale: Pinananatili ang larawang tumutukoy sa sadyang pagtanda at malalim na pagsasaalang-alang, sa isang likas na idyomang Filipino.
- source_word: πάντες οἱ ἀκούσαντες
  choice: ang lahat ng nakarinig
  rationale: Tumutukoy sa lahat ng nakabalita o nakarinig sa mga pangyayaring naunang isinalaysay, nang hindi labis na nililinaw ang di-tahasang layon.
- source_word: Τί ἄρα
  choice: Ano kaya
  rationale: Ipinahihiwatig ng “kaya” ang paghinuha at pagtataka bunga ng mga naunang pangyayari.
- source_word: τὸ παιδίον τοῦτο
  choice: ang batang ito
  rationale: Likas at hindi labis na espesipikong salin ng παιδίον sa konteksto.
- source_word: ἔσται
  choice: ang kahihinatnan
  rationale: Ipinapahayag ang tanong tungkol sa magiging kalagayan, pagkakakilanlan, o papel ng bata sa hinaharap; ang mas literal na “magiging ano” ay inilagay sa talababa.
- source_word: καὶ γὰρ
  choice: Sapagkat
  rationale: Likas na naghaharap sa Filipino ng dahilan para sa pagtataka ng mga tao.
- source_word: χεὶρ κυρίου
  choice: ang kamay ng Panginoon
  rationale: Pinananatili ang biblikal na metapora at hindi ito nililimitahan sa tulong, kapangyarihan, patnubay, o pagpapala lamang.
- source_word: μετ’ αὐτοῦ
  choice: sumasakaniya
  rationale: Likas na katumbas ng “was with him” na tumutukoy sa bata at nagpapanatili sa pagpipigil ng pahayag.
theological_decisions:
- issue: Kahulugan ng idyomang χεὶρ κυρίου ἦν μετ’ αὐτοῦ
  choice: Panatilihin ang “ang kamay ng Panginoon ay sumasakaniya.”
  alternative: Tinutulungan siya ng Panginoon; nasa kaniya ang kapangyarihan ng Diyos.
  rationale: Ipinahihiwatig ng parirala ang aktibong kapangyarihan, paglingap, o patnubay ng Diyos, ngunit hindi tinutukoy ng teksto kung alin lamang sa mga ito ang ibig sabihin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang biblikal na metapora sa “kamay ng Panginoon” at ginamit ang “nag-ukit ... sa puso” upang maipahayag ang sadyang pag-iingat at malalim na pagbubulay.
