  text: He has helped Israel his servant[a], in remembrance of mercy[b],
translation:
  language: tl
  text: Tinulungan niya ang Israel na kanyang lingkod[a], sa pag-alaala niya sa awa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “anak.” Ang salitang Griyego na παῖς ay maaaring mangahulugang “lingkod” o “anak.” Pinili rito ang “lingkod” dahil sa nakasanayang pananalita ng Lumang Tipan na tumutukoy sa Israel bilang lingkod ng Diyos.
    reason: lexical_alternative
