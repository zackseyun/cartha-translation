lexical_decisions:
- source_word: ἀντελάβετο
  choice: Tinulungan niya
  rationale: Ang pandiwa ay tumutukoy sa paghawak upang alalayan o saklolohan. Likas at malinaw sa modernong Tagalog ang “tinulungan,” at naipapahayag nito ang buod na kilos ng aorist.
- source_word: Ἰσραὴλ
  choice: ang Israel
  rationale: Pinanatili ang pangalang Israel; sa konteksto, kolektibo itong tumutukoy sa bayan ng Diyos.
- source_word: παιδὸς αὐτοῦ
  choice: na kanyang lingkod
  rationale: Maaaring mangahulugan ang παῖς na “lingkod” o “anak,” ngunit mas angkop dito ang “lingkod” dahil umaalingawngaw ito sa wikang ginagamit ng Lumang Tipan tungkol sa Israel bilang lingkod ng Diyos. Ang “na kanyang” ay malinaw na nag-uugnay sa Israel at sa Diyos.
- source_word: μνησθῆναι
  choice: bilang pag-alaala
  rationale: Ipinahahayag ng aorist infinitive ang kaugnayan ng pagtulong ng Diyos sa kanyang pag-alaala. Pinananatili ng parirala ang bahagyang kalabuan kung layunin, resulta, o kasabay na pangyayari ang diwa.
- source_word: ἐλέους
  choice: sa awa
  rationale: Ang “awa” ang tuwiran at likas na katumbas ng ἔλεος; ang posibleng diwa ng tapat na awa sa tipan ay inilagay sa talababa sa halip na idagdag sa pangunahing teksto.
theological_decisions:
- issue: Kahulugan ng παῖς patungkol sa Israel
  choice: Israel na kanyang lingkod
  alternative: Israel na kanyang anak
  rationale: Mas malamang ang “lingkod” dahil sa padron ng Kasulatan, lalo na sa wikang Septuagint at Isaias, na tumutukoy sa Israel bilang lingkod ng Diyos. Gayunman, tunay ang leksikal na alternatibong “anak,” kaya pinanatili ito sa talababa.
- issue: Lakas at kaugnayan ng μνησθῆναι ἐλέους
  choice: bilang pag-alaala sa awa
  alternative: upang alalahanin ang awa; na inaalaala ang awa
  rationale: Pinananatili ng salin ang maikli at medyo bukas na ugnayan ng infinitive sa pangunahing pandiwa, nang hindi ipinipilit kung ito ay eksaktong layunin, resulta, o kasabay na kalagayan. Hindi rin idinagdag ang “kanyang” bago ang awa sapagkat wala itong tahasang katumbas sa pariralang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “pag-alaala” sa halip na mas kolokyal na “pag-alala” upang tumugma sa himig ng awit, ngunit nananatiling natural. Ang kuwit sa hulihan ay pinanatili dahil nagpapatuloy ang pangungusap sa kasunod na talata.
