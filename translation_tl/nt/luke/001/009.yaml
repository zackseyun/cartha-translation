base_translation:
  language: en
  yaml_path: translation/nt/luke/001/009.yaml
  text: according to the custom of the priesthood[a], he was chosen by lot to burn incense when he entered into the temple of the Lord,
translation:
  language: tl
  text: Ayon sa kaugalian ng paglilingkod ng mga pari, siya ay nabunot upang magsunog ng insenso nang siya ay pumasok sa templo[a] ng Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “santuwaryo.” Ang salitang Griyego na ναός ay karaniwang tumutukoy sa mismong gusali ng templo, lalo na sa panloob na santuwaryo, at hindi sa buong bakuran ng templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὸ ἔθος τῆς ἱερατείας
  choice: Ayon sa kaugalian sa paglilingkod ng mga pari
  rationale: Ipinahahayag nito ang pagsunod sa nakaugaliang pamamaraan ng paglilingkod bilang pari, habang gumagamit ng natural at malinaw na Filipino.
- source_word: ἔλαχε
  choice: nabunot siya
  rationale: Likas na ipinahihiwatig ng “nabunot” na napili siya sa pamamagitan ng palabunutan, gaya ng kahulugan ng λαγχάνω sa kontekstong ito.
- source_word: τοῦ θυμιᾶσαι
  choice: magsunog ng insenso
  rationale: Tuwirang inilalarawan nito ang gawaing itinalaga sa pamamagitan ng palabunutan.
- source_word: εἰσελθὼν
  choice: pagpasok niya
  rationale: Pinananatili nito ang temporal na ugnayan ng aorist participle sa pagsusunog ng insenso nang hindi labis na nililinaw ang eksaktong agwat ng mga kilos.
- source_word: εἰς τὸν ναὸν
  choice: sa templo
  rationale: Madaling maunawaan ang “templo” ng karaniwang mambabasa; inilalahad sa talababa ang mas tiyak na posibleng kahulugang “santuwaryo.”
- source_word: τοῦ κυρίου
  choice: ng Panginoon
  rationale: Karaniwang marangal na salin ng κύριος kapag tumutukoy sa Diyos.
theological_decisions:
- issue: Saklaw ng ναός sa konteksto ng pagsamba sa templo
  choice: templo
  alternative: santuwaryo
  rationale: Ang ναός ay maaaring tumukoy nang mas tiyak sa gusali o panloob na santuwaryo, at malamang iyon dito dahil sa paghahandog ng insenso. Gayunman, pinanatili sa pangunahing teksto ang mas pamilyar na “templo,” at nilinaw sa talababa ang mas tiyak na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nabunot” bilang maikli at likas na paraan ng pagsasabing napili sa palabunutan.
