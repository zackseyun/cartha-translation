id: LUK.1.12
reference: Luke 1:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐταράχθη Ζαχαρίας ἰδών, καὶ φόβος ἐπέπεσεν ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/012.yaml
  text: And Zechariah was troubled when he saw him[a], and fear fell upon him.
translation:
  language: tl
  text: Nang makita siya[a] ni Zacarias, nabagabag siya, at nilukob siya ng takot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Pagkakita sa kanya.”
    reason: Ipinapakita nito ang mas literal na anyo ng Griyegong participle ἰδών, samantalang inililitaw ng “Nang makita siya” ang temporal na diwa nito sa konteksto.
lexical_decisions:
- source_word: ἐταράχθη
  choice: nabagabag
  rationale: Ipinapahayag ng pandiwa ang matinding pagkabalisa o pagkagulo ng kalooban, ngunit hindi nito inuulit o pinalalakas nang labis ang ‘takot’ na tahasang binanggit kasunod nito.
- source_word: Ζαχαρίας
  choice: Zacarias
  rationale: Ito ang likas at kinikilalang anyo ng pangalang ito sa Filipino.
- source_word: ἰδών
  choice: Nang makita siya
  rationale: Ang aorist participle ay may temporal na diwa sa konteksto. Ang ‘siya’ ay ang anghel na binanggit sa naunang talata at ginagawang natural at malinaw ang pangungusap sa Filipino.
- source_word: φόβος
  choice: takot
  rationale: Direkta at hindi pinalabis na katumbas ito ng malawak na kahulugan ng φόβος.
- source_word: ἐπέπεσεν ἐπ’ αὐτόν
  choice: nilukob siya
  rationale: Natural itong idyomang Filipino para sa takot na biglang nanaig sa isang tao, habang pinananatili ang masiglang larawan ng puwersang dumarating sa kanya.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘nabagabag’ upang ihiwalay ang panloob na pagkabalisa sa tahasang ‘takot,’ at ‘nilukob’ bilang natural na pagpapahayag ng biglang pananagumpay ng takot.
