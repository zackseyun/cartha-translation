  text: διὰ σπλάγχνα ἐλέους θεοῦ ἡμῶν, ἐν οἷς ⸀ἐπισκέψεται ἡμᾶς ἀνατολὴ ἐξ ὕψους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/078.yaml
  text: because of the tender mercy of our God[a], by which the sunrise from on high will visit us,
translation:
  language: tl
  text: dahil sa taos-pusong habag ng ating Diyos, sa pamamagitan nito ay dadalawin tayo ng bukang-liwayway mula sa kaitaasan[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagsikat.” Ang salitang Griyego ay maaari ring umalingawngaw sa mesiyanikong titulong “ang Sanga” sa Griyegong Lumang Tipan.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ
  choice: dahil sa
  rationale: Kasama ng akusatibong σπλάγχνα, nagsasaad ito ng sanhi o batayan; likas sa Tagalog ang “dahil sa.”
- source_word: σπλάγχνα ἐλέους
  choice: taos-pusong habag
  rationale: Ang literal na larawan ng mga laman-loob bilang luklukan ng damdamin ay isang idyoma para sa malalim at panloob na awa; naipahahayag ito nang natural ng “taos-pusong habag.”
- source_word: θεοῦ ἡμῶν
  choice: ng ating Diyos
  rationale: Tuwirang ipinahahayag ang genitibong pag-aari sa natural na ayos ng Tagalog.
- source_word: ἐν οἷς
  choice: Sa habag na ito
  rationale: Tumutukoy pabalik sa habag ng Diyos at ipinahahayag ang kalagayan o batayan ng pagdalaw. Nilinaw ang reperente sa halip na gumamit ng malabong panghalip.
- source_word: ἐπισκέψεται
  choice: dadalawin tayo
  rationale: Pinananatili ang hinaharap na panahon at ang leksikal na diwa ng pagdalaw, habang hinahayaan ang konteksto na magpahiwatig ng mapagligtas na pagkilos.
- source_word: ἀνατολὴ
  choice: bukang-liwayway
  rationale: Ang kasunod na larawan ng liwanag sa talata 79 ay pumapabor sa kahulugang bukang-liwayway o pagsikat; natural at marangal ang “bukang-liwayway,” habang ang posibleng alusyon sa mesiyanikong “Sanga” ay inilalagay sa talababa.
- source_word: ἐξ ὕψους
  choice: mula sa kaitaasan
  rationale: Malapit ito sa Griyego at pinananatili ang marangal na pahiwatig sa makalangit na pinagmulan nang hindi tahasang pinapalitan ng “mula sa langit.”
theological_decisions:
- issue: Kahulugan ng ἀνατολή sa kontekstong mesiyaniko
  choice: bukang-liwayway
  alternative: pagsikat; ang Sanga
  rationale: Ang agarang konteksto ng liwanag sa dilim ay pumapabor sa metapora ng bukang-liwayway. Gayunman, maaaring umalingawngaw ang salita sa mesiyanikong titulong “Sanga” sa Griyegong Lumang Tipan, kaya hindi inaalis ang posibilidad na iyon kundi itinatala sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “taos-pusong habag” upang ihatid ang lalim ng idyomang Griyego, at “bukang-liwayway” upang panatilihin ang larawang patula at ang kaugnayan nito sa liwanag sa kasunod na talata.
