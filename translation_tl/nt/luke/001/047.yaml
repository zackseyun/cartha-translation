  text: καὶ ἠγαλλίασεν τὸ πνεῦμά μου ἐπὶ τῷ θεῷ τῷ σωτῆρί μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/047.yaml
  text: and my spirit has rejoiced in God my Savior[a].
translation:
  language: tl
  text: at nagalak ang aking espiritu sa Diyos na aking Tagapagligtas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagbunyi sa Diyos na aking Tagapagligtas.”
    reason: Ipinapakita ang leksikal na alternatibong higit na tahasang naghahayag ng masidhing kagalakang taglay ng ἠγαλλίασεν.
lexical_decisions:
- source_word: καὶ
  choice: at
  rationale: Payak na pang-ugnay ito sa naunang taludtod at pinananatili ang paralelismong patula.
- source_word: ἠγαλλίασεν
  choice: nagalak
  rationale: Ipinahahayag ng aorist active indicative ang pagdanas ng matinding galak. Natural at marangal sa makabagong Tagalog ang “nagalak”; ang “nagbunyi” ay maaari rin at higit na tahasang nagpapahiwatig ng masidhing kagalakan.
- source_word: τὸ πνεῦμά μου
  choice: ang aking espiritu
  rationale: Pinananatili nito ang salitang πνεῦμα at ang pagkakaiba nito sa “kaluluwa” sa naunang taludtod, nang hindi nagpapasya kung teknikal na magkaibang bahagi ng tao ang tinutukoy.
- source_word: ἐπὶ τῷ θεῷ
  choice: sa Diyos
  rationale: Kasama ng ἀγαλλιάω, maaaring tukuyin ng ἐπί na may datibo ang batayan o pinagtutuunan ng galak. Ang “nagalak … sa Diyos” ay natural at pinananatili ang ugnayang diin ng parirala.
- source_word: τῷ σωτῆρί μου
  choice: na aking Tagapagligtas
  rationale: Tuwirang ipinakikilala ng σωτήρ ang Diyos bilang Tagapagligtas ng nagsasalita. Karaniwan at malinaw sa Tagalog ang “aking Tagapagligtas,” at hindi nito pinahihina ang teolohikal na bigat ng pahayag.
theological_decisions:
- issue: Ang pagkakakilanlan sa Diyos bilang “aking Tagapagligtas”
  choice: sa Diyos na aking Tagapagligtas
  alternative: sa Diyos na aking Tagapagligtas/Tagapagligtas ko; o sa Diyos na aking Tagapagligtas mula sa kapahamakan
  rationale: Tuwirang tinatawag ng Griyego ang Diyos na Tagapagligtas ni Maria. Pinananatili ito nang hindi dinaragdagan kung anong uri o saklaw ng pagliligtas ang tinutukoy.
- issue: Ang kaugnayan ng “aking espiritu” sa “aking kaluluwa” sa naunang taludtod
  choice: Panatilihin ang magkahiwalay na katawagan
  alternative: Isalin ang dalawa bilang iisang katawagan para sa kalooban o buong pagkatao
  rationale: Magkalapit ang diwa ng mga ito sa paralelismong patula, ngunit magkaibang salitang Griyego ang ginamit. Pinananatili ng salin ang pagkakaibang iyon nang hindi nagpapataw ng isang tiyak na antropolohikal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang himig na patula at ang paralelismo sa naunang taludtod; iniwasan ang labis na teknikal o denominasyonal na pananalita.
