  naturalness: Natural, malinaw, at marangal ang daloy sa makabagong Filipino Tagalog. Ang “nagalak ang aking espiritu” ay angkop sa himig ng papuri; ang “nagbunyi” sa talababa ay isang kapaki-pakinabang na mas masidhing alternatibo.
