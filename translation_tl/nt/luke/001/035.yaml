id: LUK.1.35
reference: Luke 1:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ· Πνεῦμα ἅγιον ἐπελεύσεται ἐπὶ σέ, καὶ δύναμις Ὑψίστου ἐπισκιάσει σοι· διὸ καὶ τὸ γεννώμενον ἅγιον κληθήσεται, υἱὸς θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/035.yaml
  text: And the angel answered and said to her[a], “The Holy Spirit will come upon you, and the power of the Most High will overshadow you[b]; therefore also the holy one being born will be called the Son of God.”
translation:
  language: tl
  text: Sumagot sa kanya ang anghel, “Darating sa iyo ang Banal na Espiritu, at lililiman ka ng kapangyarihan ng Kataas-taasan. Kaya ang banal na isisilang[a] ay tatawaging Anak ng Diyos.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang batang isisilang.” Ang Griyegong τὸ γεννώμενον ay literal na “ang isinisilang” o “ang isisilang.”
    reason: lexical_alternative
  - marker: b
    text: Walang artikulo bago ang “Anak” sa Griyego, ngunit sa kontekstong ito ang “Anak ng Diyos” ay ginagamit bilang titulo, hindi bilang di-tiyak na “isang anak ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ
  choice: Sumagot sa kanya ang anghel
  rationale: Natural na Filipino para sa Griyegong idyomang literal na ‘sumagot at sinabi sa kanya’; pinananatili ang tugon nang walang di-kinakailangang pag-uulit.
- source_word: Πνεῦμα ἅγιον
  choice: ang Banal na Espiritu
  rationale: Tumutukoy sa banal na Espiritu bilang tagaganap ng kilos; natural sa Filipino ang pantukoy na ‘ang’ at ang malaking titik para sa titulong ito.
- source_word: ἐπελεύσεται ἐπὶ σέ
  choice: bababa sa iyo
  rationale: Ipinahahayag ang pagdating ng Espiritu kay Maria nang natural sa Filipino at angkop sa konteksto ng pagkilos mula sa Diyos; hindi nito dinaragdagan ang teksto ng mekanistikong paliwanag.
- source_word: δύναμις Ὑψίστου
  choice: ang kapangyarihan ng Kataas-taasan
  rationale: Pinananatili ang tuwirang ugnayang henitibo at ang ‘Kataas-taasan’ bilang banal na titulo.
- source_word: ἐπισκιάσει σοι
  choice: lililiman ka
  rationale: Malapit sa larawang Griyego ng paglalagay sa ilalim ng lilim at pinananatili ang mapitagang talinghaga ng banal na presensiya.
- source_word: διὸ καὶ
  choice: Kaya
  rationale: Natural na ipinahahayag sa Filipino ang bunga o lohikal na kaugnayan; ang pandagdag na force ng καί ay nauunawaan sa daloy at hindi kailangang gawing mabigat na ‘kaya rin.’
- source_word: τὸ γεννώμενον ἅγιον
  choice: ang banal na isisilang
  rationale: Pinananatili ang bahagyang pormal at bukas na anyo ng Griyego habang malinaw na tumutukoy sa banal na ipanganganak; iniiwasang tahasang idagdag ang ‘bata’ sa pangunahing teksto.
- source_word: κληθήσεται
  choice: ay tatawaging
  rationale: Pinananatili ang pasibong anyo at ang saklaw nitong maaaring tumukoy sa pagtawag, pagkilala, o pagpapahayag ng identidad.
- source_word: υἱὸς θεοῦ
  choice: Anak ng Diyos
  rationale: Sa konteksto, ito ay titulong kristolohikal at hindi nangangahulugang isa lamang sa maraming anak; sa Filipino, hindi kailangan ang hiwalay na katumbas ng English definite article.
theological_decisions:
- issue: Pagkatao at banal na pagtukoy ng Πνεῦμα ἅγιον
  choice: ang Banal na Espiritu
  alternative: banal na espiritu
  rationale: Inilalarawan ng konteksto ang Espiritu ng Diyos bilang banal na tagaganap, hindi bilang disposisyon o di-personal na puwersa.
- issue: Talinghaga ng ἐπισκιάσει
  choice: lililiman ka
  alternative: tatakpan ka / lalambungan ka
  rationale: Pinananatili ang metaporang nasa Griyego at hindi nag-aangkat ng seksuwal o biyolohikal na mekanismong hindi ipinapaliwanag ng talata.
- issue: Puwersang titular ng υἱὸς θεοῦ
  choice: Anak ng Diyos
  alternative: isang anak ng Diyos
  rationale: Bagaman walang artikulo ang Griyego bago ang υἱός, gumaganap ang parirala bilang titulo o paglalarawan ng identidad sa kontekstong ito, hindi bilang di-tiyak na ‘isang anak.’
- issue: Pagkakaugnay ng banal na paglilihi at titulo
  choice: Kaya ang banal na isisilang … ay tatawaging Anak ng Diyos
  alternative: Kaya rin ang batang isisilang ay banal at tatawaging Anak ng Diyos
  rationale: Pinananatili ang siksik at bahagyang sintaktikong tensiyon ng Griyego nang hindi pinipilit kung ang ἅγιον ay pangunahing katangiang panaguri o bahagi ng pariralang tumutukoy sa isisilang.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘lililiman’ upang mapanatili ang matalinghagang larawan ng orihinal, at iniwasan ang anumang denominasyonal o mekanistikong pagpapaliwanag. Ang lahat ng marker na [a] at [b] ay nasa pangunahing teksto.
