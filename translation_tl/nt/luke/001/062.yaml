translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinili ang karaniwang “gusto” sa halip na mas pormal na “nais” upang maging madaling maunawaan, samantalang nananatiling angkop sa salaysay. Ang idinagdag na “upang malaman” ay isang limitadong pagpapalinaw na likas sa Filipino at hindi nagdaragdag ng bagong pangyayari.
