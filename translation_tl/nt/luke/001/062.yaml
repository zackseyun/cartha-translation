    issue: Ang “upang malaman” ay idinagdag na layunin.
    rationale: Ang τὸ τί ἂν θέλοι ay tuwirang nilalaman ng kanilang pagsenyas—kung ano ang nais niya—hindi hayagang isang sugnay ng layunin na “upang malaman.”
