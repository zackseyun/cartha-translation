  source_fidelity: Naililipat ng draft ang pangunahing diwa, ngunit ang “upang malaman” ay pagpapalawak na wala sa tuwirang sintaks ng Griyego. Ang “dito” ay karaniwang lokatibong panghalip sa Filipino at hindi angkop na pantukoy sa bata sa ganitong pangungusap. Ang binagong bersyon ay mas tuwirang isinasalin ang nilalaman ng kanilang pagsenyas at malinaw na tinutukoy ang bata.
  naturalness: Mas likas ang “tungkol sa kung ano ang nais niyang itawag sa bata” kaysa “upang malaman kung ano ang gusto niyang ipangalan dito.” Iniiwasan nito ang hindi natural na “dito” para sa isang sanggol at hindi nagdaragdag ng layuning “upang malaman.”
  terminology: Ang “sinenyasan” ay angkop para sa ἐνένευον. Ang “nais” ay bahagyang mas angkop sa marangal na salaysay at nakatutulong na ihatid ang di-tahasang optative na θέλοι na may ἄν, nang hindi pinipilit ang isang teknikal na katumbas.
  issues:
