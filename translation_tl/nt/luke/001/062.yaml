translation:
  language: tl
  text: Kaya sinenyasan nila ang ama ng bata tungkol sa kung ano ang nais niyang itawag sa bata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Sininyasan nila ang ama ng bata tungkol sa kung ano ang maaaring nais niyang itawag sa bata.”'
    reason: Ipinakikita ang bahid ng posibilidad o di-tahasang pagnanais sa ἂν θέλοι.
lexical_decisions:
- source_word: ἐνένευον
  choice: sinenyasan
  rationale: Tumutukoy ang pandiwa sa pakikipag-usap sa pamamagitan ng senyas o kilos. Likas at malinaw sa modernong Filipino ang “sinenyasan.”
- source_word: δὲ
  choice: Kaya
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay. Ipinakikita ng “Kaya” ang natural na daloy mula sa naunang talata nang hindi ito binibigyan ng matinding pagsalungat.
- source_word: τῷ πατρὶ αὐτοῦ
  choice: ang ama ng bata
  rationale: Ang datibo ang tumutukoy sa taong pinatutungkulan ng senyas. Nililinaw ng “ama ng bata” ang tinutukoy ng panghalip sa natural na Filipino.
- source_word: τὸ τί ἂν θέλοι
  choice: upang malaman kung ano ang gusto niya
  rationale: Ipinakikilala ng parirala ang nilalaman o layunin ng pagsesenyas. Ang optatibo na may ἄν ay may bahid ng posibilidad o di-tahasang pagnanais; sa karaniwang Filipino, sapat na naipahahayag ito ng “kung ano ang gusto niya.” Ang “upang malaman” ay ipinahiwatig ng sitwasyon at ginagawang malinaw ang ugnayan sa pangungusap.
- source_word: καλεῖσθαι αὐτό
  choice: ipangalan dito
  rationale: Tumutukoy ito sa pangalang nais para sa bata. Ang “ipangalan dito” ay natural na Filipino para sa pasibong diwang ‘tawagin/pangalanan ang bata,’ at malinaw na ang “dito” ay tumutukoy sa bata.
