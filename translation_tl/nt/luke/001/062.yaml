    issue: Ang “dito” ay hindi angkop na pantukoy sa bata sa kontekstong ito.
    rationale: Sa modernong Filipino, ang “dito” ay pang-abay na panlunan o panturo sa lugar/bagay; mas malinaw at likas ang “sa bata” sa pariralang “itawag sa bata.”
  - severity: low
    issue: Ang kasalukuyang talababa ay hindi likas ang ayos at inuulit ang problematikong “dito.”
    rationale: Kailangang iayon ang talababa sa binagong, malinaw na salin habang pinananatili ang tala tungkol sa posibilidad na ipinahihiwatig ng ἄν θέλοι.
