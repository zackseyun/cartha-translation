translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “naglihi” at “nanatili siyang nakatago” upang manatiling malapit sa Griyego ngunit madaling maunawaan; iniwasan ang mas matinding “nagkulong” at ang mas interpretibong “hindi nagpakita sa iba.”
