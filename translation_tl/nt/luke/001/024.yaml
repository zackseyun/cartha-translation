  text: After these days Elizabeth his wife conceived[a], and she kept herself hidden for five months, saying[b],
translation:
  language: tl
  text: 'Pagkaraan ng mga araw na iyon, naglihi ang asawa niyang si Elisabet. Nagtago siya sa loob ng limang buwan[a], at sinabi niya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “patuloy siyang nagkubli” o “ikinubli niya ang sarili.” Ipinahihiwatig ng anyo ng pandiwang Griego ang nagpapatuloy na kilos sa loob ng limang buwan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταύτας τὰς ἡμέρας
  choice: Pagkaraan ng mga araw na iyon
  rationale: Ipinahahayag ng μετά na sinusundan ng accusative ang pagkakasunod sa panahon. Mas natural sa salaysay sa Tagalog ang “mga araw na iyon” kaysa literal na “mga araw na ito”; hindi na kailangang hiwalay na katawanin ang mahinang pang-ugnay na δέ.
- source_word: συνέλαβεν
  choice: naglihi
  rationale: Sa kontekstong ito, tumutukoy ang συλλαμβάνω sa paglilihi ng anak. Ang “naglihi” ay tuwiran, maikli, at likas sa marangal na salaysay sa Tagalog.
- source_word: Ἐλισάβετ
  choice: Elisabet
  rationale: Karaniwang anyo ng pangalang biblikal sa Tagalog.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: ang asawa niyang si Elisabet
  rationale: Sa konteksto, ang γυνή ay malinaw na “asawa,” hindi lamang “babae.” Inayos ang parirala ayon sa natural na ayos ng Tagalog habang pinananatili ang kaugnayan kay Zacarias mula sa naunang konteksto.
- source_word: περιέκρυβεν ἑαυτὴν
  choice: Nanatili siyang nakatago
  rationale: Ipinakikita ng imperfect na pandiwa ang nagpapatuloy na kalagayan o kilos. Nahuhuli ng “nanatili” ang tagal, samantalang pinananatili ng “nakatago” ang pangunahing diwa nang hindi nagdaragdag ng tiyak na dahilan o paraan ng pag-iisa.
- source_word: μῆνας πέντε
  choice: sa loob ng limang buwan
  rationale: Ang accusative ay nagpapahayag ng tagal; likas na ipinahahayag ito sa Tagalog sa pamamagitan ng “sa loob ng.”
- source_word: λέγουσα
  choice: at sinabi
  rationale: Ginawang finite verb ang participle upang maging natural sa Tagalog at malinaw na ipakilala ang tuwirang sinabi ni Elisabet sa susunod na talata, nang hindi binabago ang ugnayan ng mga pangyayari.
