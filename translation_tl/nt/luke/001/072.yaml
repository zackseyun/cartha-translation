  text: upang magpakita ng awa sa ating mga ama[a][b] at alalahanin[c] ang kanyang banal na tipan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga ama” ay tumutukoy sa mga ama o patriyarka ng Israel; maaari ring isaling “mga ninuno.”
    reason: alternative_reading
  - marker: b
    text: Sa literal, “kasama ng ating mga ama.” Ipinahihiwatig ng pariralang Griyego ang pagpapakita ng awa kaugnay ng mga ama ng Israel.
