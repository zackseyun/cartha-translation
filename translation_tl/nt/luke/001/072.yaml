lexical_decisions:
- source_word: ποιῆσαι ἔλεος
  choice: magpakita ng awa
  rationale: Ang literal na diwang “gumawa ng awa” ay hindi likas sa Filipino. Ang “magpakita ng awa” ay malinaw at likas na katumbas ng idyomang Griyego nang hindi dinaragdagan ang kahulugan nito.
- source_word: ἔλεος
  choice: awa
  rationale: Ang “awa” ang tuwiran at karaniwang salin na angkop kapuwa sa habag at sa konteksto ng tipan.
- source_word: μετὰ τῶν πατέρων ἡμῶν
  choice: sa ating mga ninuno
  rationale: Bagaman literal na “kasama ng ating mga ama,” ang parirala ay tumutukoy sa pagpapakita ng awa kaugnay ng mga ninuno ng Israel. Ang “sa ating mga ninuno” ay natural at malinaw sa modernong Filipino; inilalahad sa talababa ang anyong literal at ang panlalaking katawagan ng Griyego.
- source_word: μνησθῆναι
  choice: alalahanin
  rationale: Pinananatili nito ang mismong larawan ng pag-alaala sa wikang pangtipan. Hindi ito pinalawak sa “tuparin” upang hindi tahimik na lutasin ang pahiwatig na ang pag-alaala ng Diyos ay humahantong sa tapat na pagkilos.
- source_word: διαθήκης ἁγίας αὐτοῦ
  choice: ang kanyang banal na tipan
  rationale: Ang “tipan” ang wastong katawagan sa kasunduang itinatag ng Diyos, at ang “banal” ay tuwirang nagpapahayag sa ἁγίας. Pinananatili ng “kanyang” ang panghalip ng orihinal.
theological_decisions:
- issue: Ang pag-alaala ng Diyos bilang pagkilos ayon sa tipan
  choice: alalahanin ang kanyang banal na tipan
  alternative: kumilos upang tuparin ang kanyang banal na tipan
  rationale: Sa wikang biblikal, ang pag-alaala ng Diyos ay madalas na nagpapahiwatig ng tapat na pagkilos ayon sa pangako. Gayunman, “alalahanin” mismo ang sinasabi ng Griyego, kaya pinananatili sa pangunahing teksto ang tensiyon at inililinaw lamang ang pahiwatig sa talababa.
- issue: Ang tinutukoy ng πατέρων ἡμῶν
  choice: ating mga ninuno
  alternative: ating mga ama
  rationale: Tumutukoy ang parirala sa mga ama o patriyarka ng Israel, hindi lamang sa mga agarang ama. Mas malinaw sa karaniwang mambabasang Filipino ang “mga ninuno,” habang pinananatili sa talababa ang panlalaking anyo at ugnayang patriyarkal ng orihinal.
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Filipino. Ang “magpakita ng awa,” “mga ninuno,” at “banal na tipan” ay madaling maunawaan ngunit nananatiling angkop sa estilong biblikal. Maliit ang titik ng “kanyang” ayon sa karaniwang modernong ortograpiyang Filipino.
