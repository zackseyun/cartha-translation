id: LUK.1.42
reference: Luke 1:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀνεφώνησεν ⸀κραυγῇ μεγάλῃ καὶ εἶπεν· Εὐλογημένη σὺ ἐν γυναιξίν, καὶ εὐλογημένος ὁ καρπὸς τῆς κοιλίας σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/042.yaml
  text: And she cried out with a loud voice and said[a], “Blessed are you among women, and blessed is the fruit of your womb.”
translation:
  language: tl
  text: At bumulalas siya nang malakas at sinabi[a], “Pinagpala ka sa mga kababaihan, at pinagpala ang bunga ng iyong sinapupunan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “sumigaw nang malakas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεφώνησεν
  choice: bumulalas
  rationale: Ipinahihiwatig ng pandiwa ang malakas at mariing pagsasalita. Ang “bumulalas” ay natural sa modernong Filipino at hindi kinakailangang magpahiwatig ng dalamhati.
- source_word: κραυγῇ μεγάλῃ
  choice: nang malakas
  rationale: Nagsasaad ang pariralang datibo ng paraan o lakas ng pagbigkas. Kasama ng “bumulalas,” malinaw nitong naipapahayag ang malakas na tinig nang hindi inuulit ang diwa.
- source_word: Εὐλογημένη
  choice: Pinagpala ka
  rationale: Pinananatili nito ang pormula ng pagpapala at ang predikatibong diwa ng perpektong pasibong participle.
- source_word: ἐν γυναιξίν
  choice: sa mga kababaihan
  rationale: Pinananatili nito ang paghahambing o natatanging kalagayan ni Maria sa hanay ng mga babae nang hindi idinaragdag ang salitang “lahat,” na hindi tahasang nasa Griyego.
- source_word: εὐλογημένος
  choice: pinagpala
  rationale: Inuulit ang kaparehong salita upang mapanatili ang paralelismo ng pagpapala kay Maria at sa dinadala niya.
- source_word: ὁ καρπὸς
  choice: ang bunga
  rationale: Pinananatili ang malinaw at biblikal na metapora ng orihinal sa halip na palitan ito ng mas interpretatibong “anak.”
- source_word: τῆς κοιλίας σου
  choice: ng iyong sinapupunan
  rationale: Sa konteksto ng pagdadalang-tao, ang κοιλία ay tumutukoy sa sinapupunan; tumpak at marangal ang karaniwang saling ito.
theological_decisions:
- issue: Pormula ng pagpapalang itinutuon kay Maria
  choice: Pinagpala ka sa mga kababaihan
  alternative: Higit kang pinagpala sa lahat ng kababaihan
  rationale: Ipinapahayag ng teksto ang natatanging pagpapala kay Maria, ngunit hindi idinaragdag ang “higit” o “lahat,” na hindi tahasang nakasulat sa Griyego. Sa gayon, hindi pinalalawak o pinaliliit ng salin ang papel niya.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “bumulalas” upang maipakita ang mariin at malakas na pagsasalita, at pinanatili ang tradisyonal ngunit malinaw na metaporang “bunga ng iyong sinapupunan.”
