id: LUK.1.15
reference: Luke 1:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔσται γὰρ μέγας ἐνώπιον ⸀τοῦ κυρίου, καὶ οἶνον καὶ σίκερα οὐ μὴ πίῃ, καὶ πνεύματος ἁγίου πλησθήσεται ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/015.yaml
  text: For he will be great before the Lord[a], and he will drink neither wine nor strong drink[c][b], and he will be filled with the Holy Spirit even from his mother’s womb.
translation:
  language: tl
  text: Sapagkat magiging dakila siya sa harap ng Panginoon, at hinding-hindi siya iinom ng alak o ng matapang na inumin,[a] at mapupuspos siya ng Banal na Espiritu mula pa sa sinapupunan ng kanyang ina.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “matapang na inumin” ay tumutukoy sa nakalalasing na inuming iba sa alak.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “habang nasa sinapupunan pa ng kanyang ina” o “mula pa nang siya ay nasa sinapupunan ng kanyang ina.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγας
  choice: dakila
  rationale: Likas at marangal na katumbas na nagpapahiwatig ng kadakilaan o kahalagahan nang hindi nililinaw nang higit sa Griyego.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: sa harap ng Panginoon
  rationale: Pinananatili ang pananaw na ang kanyang kadakilaan ay kinikilala o sinusukat sa harap ng Panginoon, hindi lamang sa paningin ng mga tao.
- source_word: οἶνον καὶ σίκερα
  choice: alak o matapang na inumin
  rationale: Ang alak ay tuwirang katumbas ng οἶνος; ang matapang na inumin ay malawak na tawag sa nakalalasing na inuming hindi alak.
- source_word: οὐ μὴ πίῃ
  choice: Hinding-hindi siya iinom
  rationale: Ipinapahayag nito ang mariing pagtanggi ng οὐ μή kasama ng aorist subjunctive habang pinananatiling propetikong pahayag, sa halip na tahasang gawing utos.
- source_word: πνεύματος ἁγίου πλησθήσεται
  choice: mapupuspos siya ng Banal na Espiritu
  rationale: Pinananatili ang pasibong pagkilos at ang personal na banal na tinutukoy sa gamit ni Lucas.
- source_word: ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: mula pa sa sinapupunan ng kanyang ina
  rationale: Likas na Filipino na nagpapanatili sa napakaagang panahong tinutukoy at sa diin ng ἔτι, nang hindi tiyakang nilulutas kung mula sa kapanganakan o habang nasa sinapupunan pa.
theological_decisions:
- issue: Lakas ng οὐ μὴ πίῃ sa propetikong pahayag
  choice: 'Mariing hinaharap na pagtanggi: “Hinding-hindi siya iinom”'
  alternative: 'Obligasyon o pagbabawal: “Hindi siya dapat uminom kailanman”'
  rationale: Ang anyong Griyego ay mariing nagkakaila sa mangyayari. Pinananatili ng salin ang diin at ang anyo ng pahayag nang hindi ipinapalit ang isang tahasang utos, bagaman ipinahihiwatig ng konteksto ang natatanging pagtatalaga sa kanya.
- issue: Tinutukoy ng πνεύματος ἁγίου
  choice: 'Personal na banal na tinutukoy: “Banal na Espiritu”'
  alternative: Isang di-personal na banal na kapangyarihan o disposisyon
  rationale: Sa konteksto at karaniwang gamit ni Lucas, tumutukoy ito sa Espiritu ng Diyos; hindi kailangan ng salin na gawing impersonal ang parirala.
- issue: Panahon ng pagkapuspos ayon sa ἔτι ἐκ κοιλίας
  choice: “mula pa sa sinapupunan ng kanyang ina”
  alternative: “habang nasa sinapupunan pa ng kanyang ina”
  rationale: Pinananatili ng pangunahing salin ang tunay na saklaw ng parirala at hindi lubusang nilulutas ang temporal na ambiguwidad.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “dakila,” “Panginoon,” “mapupuspos,” at “sinapupunan” upang mapanatili ang biblikal na bigat nang hindi nagiging lipas o labis na teknikal. Ang mga marker na [a] at [b] ay kapwa nasa pangunahing teksto.
