  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἐπλήσθησαν αἱ ἡμέραι τῆς λειτουργίας αὐτοῦ, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/023.yaml
  text: And it happened that when the days of his service were completed[b][a], he went to his home.
translation:
  language: tl
  text: Nang matapos ang mga araw ng kanyang paglilingkod[a], umuwi siya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “paglilingkod” ay tumutukoy sa nakatalagang tungkulin ni Zacarias bilang pari sa templo.
    reason: cultural_note
  - marker: b
    text: Sa Griyego, maaaring unawain bilang “pumunta siya sa kanyang bahay.” Ang salita ay maaaring tumukoy sa mismong bahay o, sa mas malawak na diwa, sa tahanan o sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Hindi isinalin nang hiwalay
  rationale: Pormulang pasalaysay ito sa Lucas. Sa modernong Tagalog, natural na naihahatid ng “Nang…” ang paglipat ng salaysay; ang “At nangyari na” ay magiging mabigat at di-likas dito.
- source_word: ὡς
  choice: Nang
  rationale: Nagpapakilala ito ng sugnay na temporal at natural na katumbas sa Tagalog ang “nang.”
- source_word: ἐπλήσθησαν αἱ ἡμέραι
  choice: matapos ang mga araw
  rationale: Ipinahihiwatig ng parirala na umabot sa kabuuan ang itinakdang panahon. Pinananatili ng “mga araw” ang anyo ng Griyego habang malinaw sa karaniwang mambabasa.
- source_word: λειτουργίας
  choice: paglilingkod
  rationale: Tumutukoy sa nakatalagang tungkulin ni Zacarias bilang pari sa templo. Ang “paglilingkod” ay likas at marangal; nililinaw sa talababa ang kultikong konteksto.
- source_word: ἀπῆλθεν
  choice: umuwi
  rationale: Kasama ng patutunguhang οἶκον αὐτοῦ, likas na ipinapahayag sa Tagalog bilang “umuwi,” sa halip na mas mekanikal na “pumunta sa kanyang tahanan.”
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: umuwi siya
  rationale: Ang οἶκος ay maaaring tumukoy sa bahay o mas malawak na tahanan/sambahayan. Ang “umuwi” ay natural ngunit hindi espesipiko kung gusali lamang o sambahayan ang tinutukoy; inilalahad sa talababa ang saklaw.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “umuwi” para sa natural na daloy, at iniwasan ang arkaikong “At nangyari na.” Ang mga marker na [a] at [b] ay inilagay mismo sa teksto.
