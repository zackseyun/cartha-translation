  source_fidelity: Tumpak na naihahatid ng “Nang matapos ang mga araw ng kanyang paglilingkod, umuwi siya” ang temporal na sugnay at ang pag-uwi ni Zacarias. Ang hindi hiwalay na pagsasalin sa καὶ ἐγένετο ay katanggap-tanggap sa modernong Tagalog, sapagkat pormulang pasalaysay ito at natural nang naipapakita ng daloy ng pangungusap.
