id: LUK.1.11
reference: Luke 1:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὤφθη δὲ αὐτῷ ἄγγελος κυρίου ἑστὼς ἐκ δεξιῶν τοῦ θυσιαστηρίου τοῦ θυμιάματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/011.yaml
  text: Then an angel of the Lord appeared to him, standing at the right side of the altar of incense.
translation:
  language: tl
  text: At nagpakita sa kanya ang isang anghel ng Panginoon, na nakatayo sa gawing kanan ng altar ng insenso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: nagpakita
  rationale: Ang aorist passive ng ὁράω ay karaniwang may diwang intransitibo na “nagpakita” sa ganitong salaysay; natural ito sa Filipino at ipinahahayag ang biglang pagiging nakikita.
- source_word: δὲ
  choice: At
  rationale: Nag-uugnay ito at nagpapatuloy sa salaysay nang hindi nagpapahiwatig ng matinding pagsalungat; natural dito ang “At.”
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Tinutukoy ng datibo ang taong pinakitaan ng anghel.
- source_word: ἄγγελος
  choice: isang anghel
  rationale: Sa konteksto ng pangitain sa templo, malinaw na makalangit na nilalang ang tinutukoy, hindi lamang isang taong mensahero.
- source_word: κυρίου
  choice: ng Panginoon
  rationale: Pinananatili ang kinikilalang titulong κύριος bilang “Panginoon” sa pariralang ἄγγελος κυρίου.
- source_word: ἑστὼς
  choice: na nakatayo
  rationale: Inilalarawan ng perfect participle ang posisyon ng anghel nang siya ay magpakita.
- source_word: ἐκ δεξιῶν
  choice: sa gawing kanan
  rationale: Natural na Filipino para sa lokasyong nasa kanan ng isang bagay, habang pinananatili ang kaugnayang spatial.
- source_word: θυσιαστηρίου
  choice: altar
  rationale: Karaniwan at malinaw na katawagan sa modernong Filipino para sa θυσιαστήριον.
- source_word: τοῦ θυμιάματος
  choice: ng insenso
  rationale: Tinutukoy ng genitive kung aling altar iyon—ang altar na ginagamit para sa insenso.
theological_decisions:
- issue: Paglilipat ng κύριος sa pariralang ἄγγελος κυρίου
  choice: ng Panginoon
  alternative: ng panginoon
  rationale: Ginagamit ang “Panginoon” bilang kinikilalang banal na titulo at pinananatili ang karaniwang biblikal na pariralang “anghel ng Panginoon,” nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “altar” at “insenso,” mga salitang laganap sa kasalukuyang gamit at malinaw sa kontekstong pangtemplo.
