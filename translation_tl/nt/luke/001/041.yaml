  source_fidelity: 'Tumpak na naipapahayag ng salin ang pangunahing daloy ng Griyego: narinig ni Elisabet ang pagbati ni Maria, lumukso ang sanggol sa kanyang sinapupunan, at napuspos si Elisabet ng Banal na Espiritu. Ang di-hiwalay na pagsasalin sa pormulang καὶ ἐγένετο ay katanggap-tanggap sa natural na modernong Tagalog; naihahayag ang temporal na daloy sa “Nang.”'
  naturalness: Natural, malinaw, at angkop ang rehistro. Ang “pagbati,” “sanggol,” “sinapupunan,” at “napuspos ng Banal na Espiritu” ay pawang matatag at madaling maunawaang gamit sa modernong Filipino Tagalog.
  terminology: Wasto at pare-pareho ang mga pangalan at pangunahing katawagan. Ang “Banal na Espiritu” ay angkop na katumbas ng πνεύματος ἁγίου sa kontekstong Lucano. Walang kinakailangang talababa; ang English lexical alternative na “salutation” ay hindi kailangang tularan dahil ang “pagbati” ay malinaw at walang mahalagang ambigwidad.
