reference: Luke 1:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἤκουσεν ⸂τὸν ἀσπασμὸν τῆς Μαρίας ἡ Ἐλισάβετ⸃, ἐσκίρτησεν τὸ βρέφος ἐν τῇ κοιλίᾳ αὐτῆς, καὶ ἐπλήσθη πνεύματος ἁγίου ἡ Ἐλισάβετ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/041.yaml
  text: And it happened that[a], when Elizabeth heard Mary’s greeting, the baby leaped in her womb, and Elizabeth was filled with the Holy Spirit,
translation:
  language: tl
  text: Nang marinig ni Elisabet ang pagbati ni Maria, lumukso ang sanggol sa sinapupunan niya, at napuspos ng Banal na Espiritu si Elisabet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: hindi isinalin nang hiwalay
  rationale: Karaniwang pormulang pasalaysay ito sa Lucas. Sa modernong Tagalog, natural na naihahayag ang tungkulin nito sa tuwirang temporal na sugnay na “Nang …”; ang “At nangyari na” ay mabigat at di-kailangan dito.
- source_word: ὡς
  choice: Nang
  rationale: Malinaw at natural na nagpapahayag ng panahong kaugnayan at agarang pagkakasunod ng mga pangyayari.
- source_word: ἀσπασμός
  choice: pagbati
  rationale: Ito ang karaniwan at malinaw na modernong Tagalog para sa binigkas na greeting ni Maria.
- source_word: ἐσκίρτησεν
  choice: lumukso
  rationale: Pinananatili ang biglaan at masiglang kilos na ipinahihiwatig ng pandiwa, sa halip na pahinain bilang simpleng paggalaw.
- source_word: βρέφος
  choice: sanggol
  rationale: Tumpak at marangal na katawagan sa napakabatang bata, at natural ding tumutukoy rito sa sanggol na nasa sinapupunan.
- source_word: κοιλία
  choice: sinapupunan
  rationale: Sa kontekstong ito, tiyak na tumutukoy sa bahay-bata; “sinapupunan” ang natural at marangal na salin.
- source_word: ἐπλήσθη
  choice: napuspos
  rationale: Karaniwang biblikal ngunit nauunawaang Tagalog na nagpapanatili sa pasibong diwa ng pagkapuno nang hindi tahasang nagdaragdag ng gumagawa.
- source_word: πνεύματος ἁγίου
  choice: ng Banal na Espiritu
  rationale: Sa gamit ng Lucas–Mga Gawa at sa konteksto ng propetikong pananalita, tumutukoy ito sa banal na Espiritu ng Diyos. Natural sa Tagalog ang pantukoy na “ang/ng” at ang malaking titik para sa personal na reperente.
theological_decisions:
- issue: Reperente ng πνεύματος ἁγίου
  choice: Banal na Espiritu bilang Espiritu ng Diyos
  alternative: isang banal na espiritu
  rationale: Sa konteksto at karaniwang gamit ng Lucas–Mga Gawa, ang parirala ay tumutukoy sa Banal na Espiritu na nagbibigay ng propetikong kapuspusan. Hindi dinaragdagan ng salin ang pahayag ng tiyak na doktrinal na paliwanag.
- issue: Paglalarawan sa hindi pa isinisilang na si Juan sa βρέφος
  choice: sanggol
  alternative: bata
  rationale: Ang “sanggol” ay tumpak sa napakabatang tao at akma sa kontekstong nasa sinapupunan, nang walang idinaragdag na komentaryong teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Inalis ang tahasang katumbas ng pormulang ἐγένετο upang maiwasan ang makaluma at mabigat na “At nangyari na,” habang pinananatili ang daloy ng salaysay sa “Nang.” Walang talababa dahil walang mahalagang leksikal o tekstuwal na alternatibong kailangang ipakita sa mambabasa sa talatang ito.
