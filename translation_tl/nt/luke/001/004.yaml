    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas at malinaw na pananda ng layunin sa makabagong Filipino.
- source_word: ἐπιγνῷς
  choice: matiyak mo
  rationale: Sa kontekstong ito, ipinahihiwatig ng pandiwa ang pagkilala o pagkaalam nang may katiyakan; iniiwasan nito ang di-likas na “malaman mo ang katiyakan.”
- source_word: περὶ ὧν
  choice: ng mga bagay na
  rationale: Natural na Filipino para sa kaugnayan ng nilalaman ng nalaman sa mga naunang itinuro.
- source_word: κατηχήθης
  choice: itinuro sa iyo
  rationale: Ipinapahayag ang pasibong pagtanggap ng sistematikong pagtuturo nang hindi ipinapasok ang mas huling teknikal na katawagang pansimbahan.
- source_word: λόγων
  choice: mga bagay
  rationale: Dito, tumutukoy ang λόγων sa nilalaman o mga paksang itinuro, hindi lamang sa mga indibiduwal na salita.
- source_word: τὴν ἀσφάλειαν
  choice: ang katiyakan
  rationale: Pinananatili ang saklaw na maaaring tumukoy kapwa sa katiyakan at sa pagiging mapagkakatiwalaan ng itinuro.
theological_decisions:
- issue: Kalikasan ng layunin ni Lucas sa pagsulat
  choice: “katiyakan,” na maaaring saklawin ang tiyak na pagkaalam at pagiging mapagkakatiwalaan ng naunang pagtuturo
  alternative: “pagiging mapagkakatiwalaan” lamang o pansariling “kapanatagan” lamang
  rationale: Maaaring taglayin ng ἀσφάλεια ang parehong obhetibong pagiging matibay/mapagkakatiwalaan at subhetibong katiyakan; hindi nililimitahan ng salin ang kahulugan sa isa lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “matiyak mo ang katiyakan” upang mapanatili ang hayag na ἀσφάλεια, bagaman may bahagyang pag-uulit; ang mga talababa ay nagpapakita ng tunay na lawak ng kahulugan.
