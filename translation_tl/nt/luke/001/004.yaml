  text: upang malaman mo ang katiyakan[a] ng mga bagay na itinuro sa iyo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagiging mapagkakatiwalaan”; ang salitang Griyego ay maaaring tumukoy sa katiyakan, seguridad, o pagiging maaasahan.
    reason: lexical_alternative
  - marker: b
