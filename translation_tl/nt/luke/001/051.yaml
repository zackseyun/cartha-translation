base_translation:
  language: en
  yaml_path: translation/nt/luke/001/051.yaml
  text: He has shown strength with his arm[b][a]; he has scattered the proud in the thoughts of their hearts.
translation:
  language: tl
  text: Ipinamalas niya ang lakas sa pamamagitan ng kanyang bisig[a]; pinangalat niya ang mga palalo sa pag-iisip ng kanilang puso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nagpakita siya ng lakas sa pamamagitan ng kanyang bisig.” Literal na “gumawa ng lakas,” isang idyoma para sa pagpapamalas ng kapangyarihan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “pinangalat niya ang mga palalo dahil sa mga balak ng kanilang puso” o “sa mga haka-haka ng kanilang puso.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐποίησεν κράτος
  choice: Ipinamalas niya ang kapangyarihan
  rationale: Ang literal na ‘gumawa ng lakas’ ay isang idyomang tumutukoy sa pagpapakita o pagsasagawa ng kapangyarihan. Natural sa modernong Tagalog ang ‘ipinamalas ang kapangyarihan’ at napapanatili nito ang diwa ng hayag at makapangyarihang pagkilos.
- source_word: ἐν βραχίονι αὐτοῦ
  choice: sa pamamagitan ng kanyang bisig
  rationale: Instrumental ang gamit ng ἐν at umaalingawngaw sa pananalita ng Lumang Tipan tungkol sa makapangyarihang bisig ng Diyos. Pinananatili ng ‘bisig’ ang kongkretong metapora.
- source_word: διεσκόρπισεν
  choice: pinangalat niya
  rationale: Tumutukoy ang pandiwa sa pagpapangalat o pagpapahiwa-hiwalay. Ang aspektong naganap sa Tagalog ay angkop sa tiyak at ganap na pagkilos na inilalarawan ng aorist.
- source_word: ὑπερηφάνους
  choice: ang mga palalo
  rationale: Substantibong pang-uri ito para sa mga taong mapagmataas. Dignified at pamilyar sa wikang biblikal ang ‘mga palalo’ nang hindi nagdaragdag ng paliwanag.
- source_word: διανοίᾳ καρδίας αὐτῶν
  choice: sa mga pag-iisip ng kanilang puso
  rationale: Pinananatili nito ang Semitikong paglalarawan sa puso bilang sentro ng pag-iisip at kalooban, pati ang kalabuan kung ang dative ay tumutukoy sa larangan, paraan, o layunin ng kanilang panloob na pag-iisip.
theological_decisions:
- issue: Ang puwersa ng mga aorist sa awit ni Maria
  choice: 'Gamitin ang aspektong naganap: ‘Ipinamalas’ at ‘pinangalat’'
  alternative: Gamitin ang pangkasalukuyang pananalita para sa palagiang pagkilos ng Diyos
  rationale: Maaaring ibuod ng mga aorist ang tiyak at mapagpasiyang mga gawa ng Diyos at maaari ring magkaroon ng propetikong puwersa. Ang aspektong naganap sa Tagalog ay nagpapanatili sa pagkilos bilang ganap nang nakikita sa awit nang hindi tahasang nilulutas kung ito ay nakaraan, buod ng nakagawiang pagkilos, o propetikong katiyakan.
- issue: Ugnayan ng διανοίᾳ sa pagpapangalat sa mga palalo
  choice: Panatilihin ang maluwag na ‘sa mga pag-iisip ng kanilang puso’
  alternative: ‘dahil sa mga balak ng kanilang puso’ o ‘sa pamamagitan ng hangarin ng kanilang puso’
  rationale: Maaaring unawain ang dative bilang larangan, paraan, o kaugnayan. Ang pangunahing salin ay hindi tahasang pumipili ng sanhi o instrumento at sa gayon ay pinananatili ang tunay na kalabuan ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang matulaing metapora ng ‘bisig’ at ang biblikal na konsepto ng ‘puso’ bilang sentro ng pag-iisip at kalooban. Iniwasan ang labis na kolokyal na pananalita at ang pagpapaliwanag sa mismong talata.
