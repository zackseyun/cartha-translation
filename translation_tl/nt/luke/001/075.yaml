  text: ἐν ὁσιότητι καὶ δικαιοσύνῃ ἐνώπιον αὐτοῦ ⸂πάσαις ταῖς ἡμέραις⸃ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/075.yaml
  text: in holiness and righteousness before him all our days[a].
translation:
  language: tl
  text: sa kabanalan at katuwiran sa harap niya sa lahat ng ating mga araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: sa
  rationale: Ipinakikilala ng pang-ukol ang kalagayan o paraan ng paglilingkod; natural sa Tagalog ang “sa” sa pariralang ito.
- source_word: ὁσιότητι
  choice: kabanalan
  rationale: Ipinahihiwatig ng ὁσιότης ang kabanalan o debosyon kaugnay ng Diyos; malinaw at marangal ang “kabanalan” at nananatiling naiiba sa δικαιοσύνη.
- source_word: καὶ
  choice: at
  rationale: Payak na pang-ugnay sa dalawang katangiang magkatambal.
- source_word: δικαιοσύνῃ
  choice: katuwiran
  rationale: Ang “katuwiran” ang likas na salin para sa matuwid na asal at kalagayan sa paningin ng Diyos; napapanatili rin nito ang pagkakaiba sa “kabanalan.”
- source_word: ἐνώπιον αὐτοῦ
  choice: sa harap niya
  rationale: Tuwirang idyomatikong salin na tumutukoy sa presensiya at paningin ng Diyos.
- source_word: πάσαις ταῖς ἡμέραις ἡμῶν
  choice: sa lahat ng ating mga araw
  rationale: Malapit sa anyo ng Griyego at malinaw na tumutukoy sa buong panahon ng buhay, nang hindi nagdaragdag ng salitang “buhay.”
theological_decisions:
- issue: Pagpapakahulugan sa δικαιοσύνη sa etikal na kontekstong hindi Paulino
  choice: katuwiran
  alternative: katarungan
  rationale: Kasama ng “kabanalan,” inilalarawan dito ng salita ang matuwid na pamumuhay sa harap ng Diyos. Posible ang “katarungan,” ngunit mas makitid at mas panlipunan o legal ang karaniwang dating nito sa modernong Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang maikli at pariralang anyo ng talata, sapagkat bahagi ito ng mas malaking pangungusap.
