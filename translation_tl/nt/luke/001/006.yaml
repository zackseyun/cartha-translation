  source_fidelity: 'Tapat ang salin sa pangunahing sintaks at diwa ng Griyego: kapwa sila ay matuwid sa harap ng Diyos, at ang kanilang pamumuhay ay walang kapintasan kaugnay ng lahat ng utos at tuntunin ng Panginoon. Ang “namumuhay” ay wastong idiomatikong pagsasalin ng etikal na gamit ng πορευόμενοι.'
  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang “Kapwa sila matuwid sa harap ng Diyos” ay marangal ngunit hindi pilit, at ang kasunod na parirala ay maayos na naghahayag ng kanilang patuloy na paraan ng pamumuhay.
  terminology: Ang “matuwid,” “Diyos,” “utos,” “tuntunin,” at “Panginoon” ay angkop at magkakaugnay na mga terminong Tagalog. Napananatili ng “nang walang kapintasan” ang ἄμεμπτοι bilang pagiging hindi mapupulaan, nang hindi idinadagdag ang ideya ng absolutong kawalan ng kasalanan.
