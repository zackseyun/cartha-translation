id: LUK.1.6
reference: Luke 1:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦσαν δὲ δίκαιοι ἀμφότεροι ⸀ἐναντίον τοῦ θεοῦ, πορευόμενοι ἐν πάσαις ταῖς ἐντολαῖς καὶ δικαιώμασιν τοῦ κυρίου ἄμεμπτοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/006.yaml
  text: And both of them were righteous before God[b][a], walking blamelessly in all the commandments and ordinances of the Lord.
translation:
  language: tl
  text: Kapwa sila matuwid sa harap ng Diyos at namumuhay nang walang kapintasan ayon sa lahat ng utos at tuntunin ng Panginoon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιοι
  choice: matuwid
  rationale: Pinananatili ng “matuwid” ang moral at tipanang diwa ng salita nang hindi ito nililimitahan sa legal na pagiging makatarungan.
- source_word: ἀμφότεροι
  choice: kapwa sila
  rationale: Likas sa modernong Tagalog at malinaw na kapwa tumutukoy kina Zacarias at Elisabet.
- source_word: ἐναντίον τοῦ θεοῦ
  choice: sa harap ng Diyos
  rationale: Ipinahihiwatig nito na ang kanilang pagiging matuwid ay ayon sa pagtingin at pagsusuri ng Diyos, hindi lamang ng tao.
- source_word: πορευόμενοι
  choice: namumuhay
  rationale: Sa kontekstong etikal, ang literal na paglakad ay metapora para sa paraan ng pamumuhay; mas malinaw at natural dito ang “namumuhay.”
- source_word: ἐν πάσαις ταῖς ἐντολαῖς
  choice: ayon sa lahat ng utos
  rationale: Natural na ipinapahayag sa Tagalog ang pamumuhay na nakaayon sa buong saklaw ng mga utos.
- source_word: δικαιώμασιν
  choice: tuntunin
  rationale: Tumutukoy sa mga itinakdang alituntunin o kautusan at nagpapanatili ng bahagyang pagkakaiba nito sa “mga utos.”
- source_word: τοῦ κυρίου
  choice: ng Panginoon
  rationale: Karaniwang marangal na salin ng κύριος at sa konteksto ay tumutukoy sa Diyos ng Israel.
- source_word: ἄμεμπτοι
  choice: nang walang kapintasan
  rationale: Iniuugnay ito sa paraan ng kanilang pamumuhay at pinananatili ang malakas na diwa ng pagiging hindi mapupulaan.
- source_word: ἦσαν δὲ
  choice: sila ... at
  rationale: Ang δέ ay banayad na pang-ugnay sa salaysay; hindi kailangang bigyan ng matinding diwang pasalungat sa Tagalog.
theological_decisions:
- issue: Kung ang ἄμεμπτοι ay nangangahulugang ganap na kawalan ng kasalanan
  choice: Inilalarawan nito ang pamumuhay na walang maipipintas sa pagsunod sa tipan, nang hindi tahasang ipinapakahulugang ganap silang walang kasalanan.
  alternative: Unawain ito bilang absolutong kasakdalan o lubos na kawalan ng kasalanan.
  rationale: Iniugnay mismo ng talata ang pagiging walang kapintasan sa kanilang pamumuhay ayon sa mga utos at tuntunin ng Panginoon. Pinananatili ng salin ang lakas at tensiyon ng pahayag nang hindi nagdaragdag ng doktrinang hindi tahasang sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “namumuhay” sa halip na literal na “lumalakad” upang maging natural ang etikal na metapora. Walang talababa dahil malinaw na naihahatid ng pangunahing teksto ang mga tunay na alternatibong diwa nang hindi kailangang lumikha ng di-kinakailangang kalabuan.
