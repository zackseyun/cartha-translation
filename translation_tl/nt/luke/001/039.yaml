id: LUK.1.39
reference: Luke 1:39
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀναστᾶσα δὲ Μαριὰμ ἐν ταῖς ἡμέραις ταύταις ἐπορεύθη εἰς τὴν ὀρεινὴν μετὰ σπουδῆς εἰς πόλιν Ἰούδα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/039.yaml
  text: In those days Mary arose and went with haste into the hill country[a], to a town of Judah,
translation:
  language: tl
  text: Noong mga araw na iyon, tumayo si Maria at nagmadaling pumunta sa kaburulan, sa isang bayan ng Juda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa isang lungsod ng Juda” o “sa isang bayan sa Judea.” Ang salitang Griyego na πόλις ay maaaring mangahulugang “lungsod” o “bayan,” at ang Ἰούδα ay maaaring tumukoy sa Juda o sa rehiyon ng Judea.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστᾶσα
  choice: tumayo
  rationale: Ang aorist participle ng ἀνίστημι ay nagpapahiwatig ng kilos na nauna at kaugnay ng pangunahing pandiwa. Pinananatili ng “tumayo” ang pagkakasunod-sunod ng salaysay nang hindi ito ipinapakahulugang agad bilang “umalis.”
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang panandang pasalaysay ang δέ. Sapat nang ipinahihiwatig ng natural na daloy ng “Noong mga araw na iyon” ang pagpapatuloy; ang tahasang “ngayon” o “at” ay magiging mabigat o maaaring magdagdag ng di-umiiral na temporal na diin.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: Noong mga araw na iyon
  rationale: Natural na katumbas sa modernong Tagalog na nagpapanatili sa temporal at deiktikong diwa ng parirala.
- source_word: ἐπορεύθη
  choice: pumunta
  rationale: Karaniwan at malawak na katumbas ng πορεύομαι sa kontekstong paglalakbay, nang hindi dinaragdagan ang detalye ng paraan ng paglalakbay.
- source_word: εἰς τὴν ὀρεινὴν
  choice: sa kaburulan
  rationale: Ginagamit dito ang ὀρεινή bilang pangngalang tumutukoy sa mataas o mabundok na rehiyon. Ang “kaburulan” ay maikli, natural, at heograpikal na angkop.
- source_word: μετὰ σπουδῆς
  choice: nagmadaling
  rationale: Maaaring tumukoy ang σπουδή sa pagmamadali, sigasig, o pagsisikap. Sa konteksto ng pagpunta, malinaw at natural na ipinahahayag ng “nagmadaling” ang agarang pagkilos habang hindi itinatanggi ang posibleng sigasig.
- source_word: εἰς πόλιν Ἰούδα
  choice: sa isang bayan ng Juda
  rationale: Maaaring mangahulugan ang πόλις ng lungsod o bayan. Dahil hindi pinangalanan ang pamayanan, natural ang “bayan.” Pinananatili ng “ng Juda” ang anyo at ambiguwidad ng panrehiyon o pantribong katawagan sa Ἰούδα.
theological_decisions:
- issue: Pagkilala sa Ἰούδα
  choice: Juda bilang katawagang panrehiyon o pantribo
  alternative: Judea bilang mas tuwirang katawagang panrehiyon, o Juda bilang pangalan ng bayan
  rationale: Sa kontekstong ito, pinakamalamang na tumutukoy ang Ἰούδα sa rehiyon o lupaing kaugnay ng Juda. Pinananatili ng “Juda” ang anyo ng Griyego at hindi lubusang nilulutas ang tunay na heograpikal na ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal ang himig. Pinanatili ang anyong pasalaysay at ang leksikal na ambiguwidad ng πόλις at Ἰούδα; iniwasan ang labis na arkaikong pananalita at ang pagpapaliwanag sa loob mismo ng talata.
