  source_fidelity: 'Tapat ang salin sa pagkakasunod at pangunahing diwa ng Griyego: ang naunang pagkilos ni Maria (Ἀναστᾶσα), ang panahong tinutukoy, ang pagpunta nang may pagmamadali, ang kaburulan, at ang di-pinangalanang bayan na kaugnay ng Juda. Hindi nito nilulutas nang lampas sa ebidensiya ang ambiguwidad ng Ἰούδα.'
