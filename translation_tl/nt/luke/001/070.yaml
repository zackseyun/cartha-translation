  yaml_path: translation/nt/luke/001/070.yaml
  text: just as he spoke through the mouth of his holy prophets from of old,[a]
translation:
  language: tl
  text: gaya ng sinabi niya sa pamamagitan ng bibig ng kanyang mga banal na propeta noong unang panahon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mula pa noong sinaunang panahon.” Maaaring tumukoy ang parirala sa napakalayong nakaraan. Ipinapalagay naman ng ilan na mas matindi ang kahulugan nito: “mula pa sa walang hanggan”; ngunit dahil mga propeta ang tinutukoy rito, mas malamang ang diwang “noong unang panahon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: gaya ng
  rationale: Likas na nagpapahayag ng pagtutugma sa naunang pahayag at nagpapanatili sa diwa na ang ginawa ng Diyos ay ayon sa dati niyang sinabi.
- source_word: ἐλάλησεν
  choice: sinabi niya
  rationale: Natural sa modernong Tagalog at angkop sa tuwirang pagtukoy sa ipinahayag ng Diyos; malinaw na naipapakita ng kasunod na parirala ang pamamagitan ng mga propeta.
- source_word: διὰ στόματος
  choice: sa pamamagitan ng bibig
  rationale: Pinananatili ang kongkretong biblikal na idyoma at ang larawan ng mga propeta bilang tagapamagitan ng pagsasalita ng Diyos.
- source_word: τῶν ἁγίων ... προφητῶν
  choice: kanyang mga banal na propeta
  rationale: Tuwirang ipinapakita na ang ἁγίων ay panuring sa mga propeta at na sila ay nakatalaga sa Diyos.
- source_word: ἀπ’ αἰῶνος
  choice: noong unang panahon
  rationale: Natural na Tagalog para sa malayong sinaunang panahon at angkop sa konteksto ng makasaysayang patotoo ng mga propeta, nang hindi ipinipilit ang kahulugang metafisikal na walang hanggan.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Ang panghalip ay pinakanatural na tumutukoy sa Diyos, na siyang nagsalita sa pamamagitan ng sarili niyang mga propeta.
theological_decisions:
- issue: Saklaw ng ἀπ’ αἰῶνος
  choice: malayong nakalipas sa loob ng kasaysayan ng pagliligtas (“noong unang panahon”)
  alternative: mula pa sa walang hanggan
  rationale: Dahil tahasang tinutukoy ang mga propeta, mas malamang na ang parirala ay tumutukoy sa sinaunang panahon kaysa sa isang abstraktong pahayag tungkol sa walang hanggan. Gayunman, itinatala sa talababa ang mas malakas na alternatibong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang biblikal na larawang “sa pamamagitan ng bibig” sa halip na gawing mas payak na “sa pamamagitan ng,” at iniwasang lutasin nang tahimik ang saklaw ng temporal na parirala.
