id: LUK.1.19
reference: Luke 1:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῷ· Ἐγώ εἰμι Γαβριὴλ ὁ παρεστηκὼς ἐνώπιον τοῦ θεοῦ, καὶ ἀπεστάλην λαλῆσαι πρὸς σὲ καὶ εὐαγγελίσασθαί σοι ταῦτα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/019.yaml
  text: And the angel answered him[a], “I am Gabriel, who stands in the presence of God, and I was sent to speak to you and to bring you this good news.”
translation:
  language: tl
  text: Sumagot sa kanya ang anghel, “Ako si Gabriel, na nakatayo sa harapan ng Diyos. Isinugo ako upang magsalita sa iyo at ipahayag sa iyo ang mabuting balitang ito.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ipahayag sa iyo bilang mabuting balita ang mga bagay na ito.” Ang “mga bagay na ito” ay tumutukoy sa mensaheng ipinahayag ni Gabriel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: Sumagot
  rationale: Ang aorist participle ay natural na ipinapahayag sa Filipino bilang pandiwang naglalahad ng kasunod na tuwirang pananalita.
- source_word: ἄγγελος
  choice: anghel
  rationale: Tinutukoy rito ang makalangit na nilalang na nagpakilalang si Gabriel, kaya mas tiyak at natural ang “anghel” kaysa sa pangkalahatang “mensahero.”
- source_word: Ἐγώ εἰμι Γαβριὴλ
  choice: Ako si Gabriel
  rationale: Pinananatili ng tahasang “Ako” ang diin ng Griyego, at ginagamit ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: ὁ παρεστηκὼς
  choice: na nakatayo
  rationale: Ipinahihiwatig ng perfect participle ang patuloy na katayuan o paglilingkod ni Gabriel sa harapan ng Diyos; malinaw at natural ito sa kasalukuyang anyo.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: sa harapan ng Diyos
  rationale: Tapat itong naghahatid ng diwa ng pagiging nasa presensya ng Diyos at ang larawan ng isang lingkod sa maharlikang hukuman.
- source_word: ἀπεστάλην
  choice: Isinugo ako
  rationale: Pinananatili nito ang aorist passive at ang diwa ng pagtanggap ni Gabriel ng atas mula sa Diyos.
- source_word: λαλῆσαι πρὸς σὲ
  choice: upang magsalita sa iyo
  rationale: Direktang ipinapahayag ang layunin ng pagsusugo sa natural at marangal na Filipino.
- source_word: εὐαγγελίσασθαί σοι
  choice: ipahayag sa iyo ang mabuting balita
  rationale: Ang εὐαγγελίζω ay nangangahulugang maghayag ng mabuting balita. Iniiwasan ng saling ito ang posibleng labis na teknikal na dating ng “ebanghelyo” sa tagpong ito.
- source_word: ταῦτα
  choice: ito
  rationale: Ang demonstratibo ay literal na “mga bagay na ito,” ngunit tumutukoy sa mensaheng ipinahayag bilang mabuting balita. Ang “mabuting balitang ito” ay natural sa Filipino, habang inilalahad sa talababa ang literal na anyo.
theological_decisions:
- issue: Pagpapahayag sa εὐαγγελίζω sa konteksto ng pahayag ng anghel
  choice: mabuting balita
  alternative: ebanghelyo; magandang balita
  rationale: Pinananatili ng “mabuting balita” ang payak na leksikal na kahulugan at teolohikal na ugnayan ng salita nang hindi ito ginagawang isang teknikal na terminong maaaring magmukhang hango sa mas huling gamit Kristiyano.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa harapan ng Diyos” upang mapanatili ang larawan ng presensya at paglilingkod, at ang “mabuting balita” upang maiwasan ang di-kinakailangang teknikal o denominasyonal na pagbasa.
