  text: gaya ng ipinasá sa atin ng mga saksi mismo mula pa sa simula at naging mga lingkod ng salita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mensahe.” Ang Griegong λόγος ay maaaring mangahulugang “salita,” “mensahe,” o “salaysay”; dito, malamang na tumutukoy ito sa ipinahayag na mensahe tungkol kay Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: gaya ng
  rationale: Likas na panandang Filipino para sa paghahambing o pagkakatugma sa naunang pahayag.
- source_word: παρέδοσαν
  choice: ipinasa
  rationale: Ipinahihiwatig dito ang maingat na pagpapasa ng tinanggap na patotoo o tradisyon; malinaw at natural ang “ipinasa” sa modernong Filipino.
- source_word: ἡμῖν
  choice: sa atin
  rationale: Tuwirang katumbas ng datibong tumutukoy sa mga tumanggap ng ipinasa.
- source_word: οἱ ἀπ’ ἀρχῆς
  choice: mga taong mula pa sa simula
  rationale: Pinananatili ang pagkakakilanlan ng pangkat at ang temporal na diin ng ἀπ’ ἀρχῆς.
- source_word: αὐτόπται
  choice: nakasaksi mismo
  rationale: Ipinapahayag ang personal at tuwirang pagkakita, habang mas natural sa karaniwang Filipino kaysa sa mas teknikal na “saksing nakakita.”
- source_word: ὑπηρέται
  choice: mga lingkod
  rationale: Naghahayag ng paglilingkod nang hindi nagpapahiwatig ng isang pormal na katungkulan sa simbahan.
- source_word: γενόμενοι
  choice: naging
  rationale: Pinananatili ang diwa ng pagkaparoon o pagiging lingkod, sa halip na ipantay lamang ito sa dati na nilang pagiging mga nakasaksi.
- source_word: τοῦ λόγου
  choice: ng salita
  rationale: Pinananatili ang lawak ng λόγος at ang pamilyar na pormal na katumbas; nililinaw sa talababa na maaari rin itong tumukoy sa mensahe tungkol kay Jesus.
theological_decisions:
- issue: Tinutukoy ng τοῦ λόγου
  choice: “salita” sa pangunahing teksto, na malamang ay ang ipinahahayag na mensahe tungkol kay Jesus
  alternative: “mensahe” o “salaysay”
  rationale: Hindi malinaw na ginagamit dito ang λόγος bilang kristolohikal na titulong Logos. Pinananatili ng “salita” ang tunay na lawak ng termino, samantalang inilalahad sa talababa ang malamang na kahulugan nito sa konteksto.
- issue: Ugnayan ng γενόμενοι sa “mga nakasaksi” at “mga lingkod”
  choice: “nakasaksi mismo at naging mga lingkod”
  alternative: “mga nakasaksi at mga lingkod”
  rationale: Ipinakikita ng “naging” ang paglipat mula sa personal na pagsaksi tungo sa paglilingkod sa salita, nang hindi ganap na pinapawi ang posibleng saklaw ng participle sa parirala.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nakasaksi mismo” upang maging malinaw sa karaniwang mambabasa, at ang “naging mga lingkod” upang mapanatili ang aspektong ipinahihiwatig ng γενόμενοι.
