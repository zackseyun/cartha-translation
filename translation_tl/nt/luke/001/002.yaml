  source_fidelity: Ang “ipinasa sa atin,” “naging mga lingkod,” at “ng salita” ay wastong naghahatid sa παρέδοσαν ἡμῖν, γενόμενοι ὑπηρέται, at τοῦ λόγου. Gayunman, ang ayos na “mga taong mula pa sa simula ay nakasaksi mismo” ay hindi sapat na malinaw na ang “mula pa sa simula” ay naglalarawan sa mga saksi. Ang rebisyon ay mas tuwirang nagpapakita na sila ay mga saksi mula pa sa simula at pagkatapos ay naging mga lingkod ng salita.
  naturalness: Medyo mabigat sa modernong Filipino ang “ng mga taong mula pa sa simula ay nakasaksi mismo.” Mas likas at malinaw ang “ng mga saksi mismo mula pa sa simula.”
