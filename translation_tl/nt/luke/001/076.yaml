  text: καὶ σὺ ⸀δέ, παιδίον, προφήτης Ὑψίστου κληθήσῃ, προπορεύσῃ γὰρ ⸀ἐνώπιον κυρίου ἑτοιμάσαι ὁδοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/076.yaml
  text: And you also[a], child, will be called a prophet of the Most High, for you will go before the Lord to prepare his ways[b],
translation:
  language: tl
  text: At ikaw naman, munting anak, ay tatawaging propeta ng Kataas-taasan, sapagkat mauuna kang lalakad sa harapan ng Panginoon[a] upang ihanda ang kanyang mga daan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa presensya ng Panginoon.” Ang parirala ay maaaring tumukoy sa pag-una sa isang tao o sa pagharap at paglilingkod sa kanyang presensya.
    reason: lexical_alternative
  - marker: b
    text: Umaalingawngaw ang pananalitang ito sa mga pangako ng mga propeta tungkol sa paghahanda ng daan sa harapan ng Panginoon (ihambing ang Isa. 40:3; Mal. 3:1). Sa salaysay ni Lucas, natutupad ito sa ministeryo ni Juan na nauna kay Jesus.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ σὺ δέ
  choice: At ikaw naman
  rationale: Ipinahihiwatig ng parirala ang paglipat ng tuon at ang pagdidiin sa kausap; natural na naipapahayag ng “ikaw naman” ang dagdag at paghahambing na puwersa nito.
- source_word: παιδίον
  choice: munting anak
  rationale: Tuwirang tawag ito sa sanggol na si Juan. Ang “munting anak” ay magiliw at natural sa Filipino at naaangkop sa kanyang murang edad.
- source_word: προφήτης
  choice: propeta
  rationale: Karaniwan at malinaw na katumbas ng terminong Griyego.
- source_word: Ὑψίστου
  choice: ng Kataas-taasan
  rationale: Pinananatili nito ang marangal na titulong pantukoy sa Diyos at ang ugnayang genitibo sa “propeta.”
- source_word: κληθήσῃ
  choice: tatawaging
  rationale: Tumpak na ipinapahayag ang panghinaharap na pasibong anyo at ang diwa ng pagkilala o pagtatalaga.
- source_word: προπορεύσῃ
  choice: mauuna kang humayo
  rationale: Ipinapahayag nito ang paglakad nang nauuna bilang tagapanguna, habang nananatiling natural sa kasalukuyang Filipino.
- source_word: ἐνώπιον κυρίου
  choice: sa harapan ng Panginoon
  rationale: Pinananatili ang maaaring diwang pag-una sa isang tao at pagharap o paglilingkod sa kanyang presensya; hindi nililimitahan ang kahulugan sa isa lamang sa mga ito.
- source_word: ἑτοιμάσαι
  choice: upang ihanda
  rationale: Malinaw na ipinapakita ng “upang” ang layuning ipinahahayag ng infinitibo.
- source_word: ὁδοὺς αὐτοῦ
  choice: ang kanyang mga daan
  rationale: Pinananatili ang pangmaramihang “mga daan” at ang alingawngaw ng pananalita ng mga propeta, sa halip na gawing isahang “daan para sa kanya.”
theological_decisions:
- issue: Ang tinutukoy ng “Panginoon” sa propesiya tungkol sa tagapanguna
  choice: Pinanatili ang “Panginoon” nang hindi tahasang nililimitahan ang tinutukoy nito.
  alternative: Tukuyin ito nang hayagan bilang Diyos batay sa Isaias at Malakias, o bilang Panginoong Jesus batay sa katuparan sa salaysay ni Lucas.
  rationale: Ang pananalita ay umaalingawngaw sa mga teksto sa Lumang Tipan tungkol sa paghahanda ng daan sa harapan ng Panginoon, samantalang inilalarawan ni Lucas si Juan bilang tagapanguna ni Jesus. Pinananatili ng salin ang makabuluhang tensiyong ito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “munting anak” bilang natural na tawag sa isang sanggol, at “mauuna kang humayo” upang malinaw na maipahayag ang tungkulin ni Juan bilang tagapanguna nang hindi inaalis ang posibilidad na nakapaloob din ang paglilingkod sa presensya ng Panginoon.
