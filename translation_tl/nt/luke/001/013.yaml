id: LUK.1.13
reference: Luke 1:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος· Μὴ φοβοῦ, Ζαχαρία, διότι εἰσηκούσθη ἡ δέησίς σου, καὶ ἡ γυνή σου Ἐλισάβετ γεννήσει υἱόν σοι, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/013.yaml
  text: But the angel said to him[a], “Do not be afraid, Zechariah, because your prayer has been heard, and your wife Elizabeth will bear you a son[b], and you shall call his name John.”
translation:
  language: tl
  text: Ngunit sinabi sa kanya ng anghel, “Huwag kang matakot, Zacarias, sapagkat dininig ang iyong panalangin[a]. Ang asawa mong si Elisabet ay magsisilang ng isang anak na lalaki para sa iyo, at pangangalanan mo siyang Juan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pagsusumamo.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “tatawagin mo ang pangalan niya na Juan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Ngunit sinabi
  rationale: Ang δέ ay banayad na pang-ugnay na nagpapahiwatig ng bahagyang paglipat o pagsalungat mula sa takot ni Zacarias; natural dito ang “ngunit.”
- source_word: ὁ ἄγγελος
  choice: anghel
  rationale: Sa kontekstong ito, ang tinutukoy ay isang makalangit na sugo; “anghel” ang karaniwan at malinaw na katawagan sa Filipino.
- source_word: Μὴ φοβοῦ
  choice: Huwag kang matakot
  rationale: Ito ang natural na makabagong Filipino para sa pagbabawal at tuwirang tumutugon sa takot ni Zacarias.
- source_word: Ζαχαρία
  choice: Zacarias
  rationale: Ito ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: διότι
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan kung bakit hindi dapat matakot si Zacarias, habang pinananatili ang marangal na rehistro.
- source_word: εἰσηκούσθη
  choice: dininig
  rationale: Pinananatili ng pandiwang balintiyak ang hindi tahasang binanggit na tagaganap, gaya sa Griyego, at ipinahihiwatig ng konteksto na Diyos ang duminig.
- source_word: ἡ δέησίς σου
  choice: ang iyong panalangin
  rationale: Ang δέησις ay taimtim na kahilingan o pagsusumamo, karaniwang nakatuon sa Diyos. “Panalangin” ang pinakanatural sa konteksto; itinatala sa talababa ang mas tiyak na alternatibo.
- source_word: ἡ γυνή σου Ἐλισάβετ
  choice: Ang asawa mong si Elisabet
  rationale: Dahil sa κυνή na may panghalip na paari at sa konteksto, malinaw na “asawa” ang kahulugan. Ang “si” ay likas na pananda sa pangalang pantangi sa Filipino.
- source_word: γεννήσει υἱόν σοι
  choice: ay magsisilang ng isang anak na lalaki para sa iyo
  rationale: Kapag babae ang simuno, ang γεννάω ay nangangahulugang manganak o magsilang. Ipinahahayag ng “para sa iyo” ang datibong σοι nang hindi ipinapalagay ang higit sa teksto.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην
  choice: pangangalanan mo siyang Juan
  rationale: Ito ang natural na katumbas sa Filipino ng Griyegong idyomang literal na “tatawagin mo ang pangalan niya na Juan”; inilalagay sa talababa ang mas literal na anyo.
- source_word: Ἰωάννην
  choice: Juan
  rationale: Ito ang nakaugaliang anyo ng pangalang Ἰωάννης sa Bibliyang Filipino.
theological_decisions:
- issue: Tagaganap ng balintiyak na “dininig”
  choice: Pinanatiling hindi tahasang binanggit ang Diyos bilang tagaganap.
  alternative: “Dininig ng Diyos ang iyong panalangin.”
  rationale: Sa konteksto ng panalanging Judio, likas na ipinahihiwatig na Diyos ang duminig, ngunit hindi Siya tahasang pinangalanan sa Griyego. Pinananatili ng salin ang pahiwatig at hindi nilulutas nang labis ang balintiyak na pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga nakaugaliang pangalang biblikal na Zacarias, Elisabet, at Juan. Pinili ang natural na “pangangalanan mo siyang Juan” sa pangunahing teksto, habang pinanatili sa talababa ang pormal na Griyegong idyoma.
