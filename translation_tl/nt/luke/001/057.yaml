  text: The time was fulfilled for Elizabeth to give birth[a], and she bore a son.
translation:
  language: tl
  text: Sumapit na ang panahon para manganak si Elisabet,[a] at nagsilang siya ng isang anak na lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Natupad na ang panahon para manganak si Elisabet.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: hindi isinalin nang tahasan
  rationale: Banayad itong panandang nag-uugnay at nagpapasulong sa salaysay. Hindi kailangan ng hiwalay na salita sa Filipino dahil likas nang naipahihiwatig ng pagkakasunod ng mga pangungusap; ang “ngayon” ay maling magmumungkahi ng tahasang temporal na salita.
- source_word: ἐπλήσθη ὁ χρόνος
  choice: sumapit na ang panahon
  rationale: Ipinahihiwatig ng parirala na natapos o umabot na sa kaganapan ang panahon ng pagbubuntis. Ang “sumapit na ang panahon” ay natural sa makabagong Filipino at pinananatili ang diwa ng pagdating sa itinakdang wakas ng panahong iyon.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: para manganak si Elisabet
  rationale: Ang articular infinitive ay tumutukoy sa panganganak ni Elisabet. Ang tahasang pagbanggit sa pangalan ay malinaw at natural sa Filipino.
- source_word: ἐγέννησεν
  choice: nagsilang siya
  rationale: Naglalarawan ang aorist ng natapos na pangyayari ng panganganak. Ang “nagsilang” ay maikli, marangal, at natural kasama ng “anak na lalaki.”
- source_word: υἱόν
  choice: isang anak na lalaki
  rationale: Tiyak na anak na lalaki ang kahulugan ng υἱός, kaya pinananatili ang kasarian sa salin.
- source_word: Ἐλισάβετ
  choice: Elisabet
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Griyego.
