  source_fidelity: Ang “Purihin ang Panginoon, ang Diyos ng Israel” ay tapat sa pormulang papuri ng Εὐλογητὸς κύριος ὁ θεὸς τοῦ Ἰσραήλ. Ang “dinalaw niya ang kanyang bayan” ay wastong pinananatili ang biblikal na talinghaga ng ἐπεσκέψατο. Gayunman, ang “naglaan ... ng katubusan” ay maaaring mangahulugang naghanda o nagreserba lamang, samantalang ang ἐποίησεν λύτρωσιν ay tumutukoy sa pagsasagawa/pagdadala ng katubusan. Ang “nagdala ... ng katubusan” ay mas malinaw na nagpapahayag ng nagawang pagkilos nang hindi labis na nagpapakahulugan.
  naturalness: Marangal at natural ang pangunahing rehistro. Mas natural at mas malinaw ang “nagdala siya ng katubusan para sa kanyang bayan” kaysa “naglaan siya rito ng katubusan.” Sa talababa, ang “pakikialam” ay maaaring magkaroon ng di-kanais-nais na himig sa makabagong Tagalog; mas angkop ang “mapagkalingang pagkilos.”
  terminology: Ang “Panginoon,” “Diyos ng Israel,” “bayan,” at “katubusan” ay angkop at pare-pareho sa biblikal na rehistro. Pinananatili ng “katubusan” ang mahalagang ugnayan sa pagtubos at pagliligtas ng λύτρωσις.
