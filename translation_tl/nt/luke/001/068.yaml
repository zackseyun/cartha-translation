  text: Εὐλογητὸς κύριος ὁ θεὸς τοῦ Ἰσραήλ, ὅτι ἐπεσκέψατο καὶ ἐποίησεν λύτρωσιν τῷ λαῷ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/068.yaml
  text: Blessed is the Lord, the God of Israel, because he has visited and brought redemption to his people,
translation:
  language: tl
  text: “Purihin ang Panginoon, ang Diyos ng Israel, sapagkat dinalaw niya ang kanyang bayan at nagdala siya ng katubusan para sa kanyang bayan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Purihin
  rationale: Likas at marangal na pormula ng pagpupuri sa makabagong Tagalog; ipinahahayag nito ang doxological na puwersa ng pang-uring ginagamit bilang pagbabasbas o pagpupuri.
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang salin ng banal na titulong κύριος at pinananatili ang alingawngaw ng pananalita sa Kasulatan.
- source_word: ὁ θεὸς τοῦ Ἰσραήλ
  choice: ang Diyos ng Israel
  rationale: Tuwirang pinananatili ang katawagan sa Diyos ng Israel at ang appositional na kaugnayan nito sa “Panginoon.”
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng pagpupuri sa isang marangal ngunit nauunawaang rehistro.
- source_word: ἐπεσκέψατο
  choice: dinalaw niya
  rationale: Pinananatili ang biblikal na larawan ng pagdalaw ng Diyos, na sa konteksto ay nagpapahiwatig ng mapagmalasakit at mapagligtas na pagkilos, nang hindi ito nililimitahan sa isang paliwanag lamang.
- source_word: ἐποίησεν λύτρωσιν
  choice: naglaan siya ... ng katubusan
  rationale: Natural na Tagalog para sa literal na “gumawa ng katubusan”; ipinahahayag ang aktuwal na pagkakaloob o pagsasakatuparan nito nang hindi gumagamit ng alanganing kolokasyon.
- source_word: λύτρωσιν
  choice: katubusan
  rationale: Pinananatili ang bigat ng λύτρωσις bilang paglaya o pagliligtas na kaugnay ng pagtubos.
- source_word: τῷ λαῷ αὐτοῦ
  choice: sa kanyang bayan ... rito
  rationale: Ang datibo ay ipinahahayag bilang tumatanggap o benepisyaryo. Ang “bayan” ay angkop sa kolektibong λαός at ang “rito” ay malinaw na tumutukoy pabalik dito.
theological_decisions:
- issue: Wika ng banal na pagdalaw
  choice: dinalaw niya
  alternative: dumating siya upang tulungan
  rationale: Pinananatili ang talinghagang mula sa Kasulatan tungkol sa mapagkalinga at mapagligtas na pakikialam ng Diyos, sa halip na tahimik itong paliitin sa isang paliwanag.
- issue: Saklaw ng katubusan at ugnayan ng mga pandiwa
  choice: dinalaw niya ang kanyang bayan at naglaan siya rito ng katubusan
  alternative: dinalaw niya at nagdala ng katubusan sa kanyang bayan
  rationale: Natural na inuugnay sa bayan ang parehong pagdalaw at katubusan, habang nananatiling lantad ang dalawang banal na pagkilos. Hindi nito ipinapasiya nang higit sa ipinahihiwatig ng konteksto kung ang aorist ay ganap, proleptiko, o nakikita mula sa propetikong pananaw.
translation_notes:
  register: Makabago, marangal, at liturhikal na Tagalog. Ginamit ang “Purihin ang Panginoon” bilang natural na pormula ng doxolohiya; iniwasan ang sobrang arkaikong ayos at pinanatili ang biblikal na larawan ng pagdalaw.
