  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι ἄχρι ἧς ἡμέρας γένηται ταῦτα, ἀνθ’ ὧν οὐκ ἐπίστευσας τοῖς λόγοις μου, οἵτινες πληρωθήσονται εἰς τὸν καιρὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/020.yaml
  text: And behold[a], you will be silent and unable to speak until the day these things happen, because you did not believe my words[b], which will be fulfilled in their appointed time.
translation:
  language: tl
  text: At narito, mananahimik ka[a] at hindi makapagsasalita hanggang sa araw na mangyari ang mga bagay na ito, sapagkat hindi ka naniwala sa mga salita ko, na matutupad sa takdang panahon ng mga ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mabibingi”—hindi ito ang kahulugan sa talatang ito. Sa Griyego, magkasamang binabanggit na ikaw ay “mananahimik” at “hindi makapagsasalita,” na nagbibigay-diin sa ipinataw na kawalan ng kakayahang magsalita.
    reason: lexical_alternative
  - marker: b
    text: O, “sa angkop na panahon ng mga ito.” Ang tinutukoy ay ang panahon kung kailan matutupad ang mga salitang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: At masdan mo
  rationale: Pinananatili ang biglang pantawag-pansin at marangal na himig ng pahayag; mas natural sa makabagong Filipino ang “masdan mo” kaysa literal na “narito.”
- source_word: ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι
  choice: hindi ka makapagsasalita
  rationale: Likas at malinaw nitong ipinahahayag ang kalagayang ipinataw kay Zacarias—hindi lamang kusang pananahimik kundi kawalan ng kakayahang magsalita. Ipinaliliwanag sa talababa ang dalawang magkaugnay na parirala ng Griyego.
- source_word: ἄχρι ἧς ἡμέρας γένηται ταῦτα
  choice: hanggang sa araw na mangyari ang mga bagay na ito
  rationale: Tuwirang pinananatili ang hangganang temporal at ang diwang “mangyari” ng γένηται.
- source_word: ἀνθ’ ὧν
  choice: sapagkat
  rationale: Natural na naghahayag ng dahilan ng ipinataw na kawalan ng pagsasalita sa kontekstong ito.
- source_word: οὐκ ἐπίστευσας τοῖς λόγοις μου
  choice: hindi ka naniwala sa mga salita ko
  rationale: Pinananatili ang tuwirang kahulugan ng πιστεύω at ang maramihang λόγοι, habang nananatiling natural sa Filipino.
- source_word: πληρωθήσονται
  choice: matutupad
  rationale: Pinananatili ang hinaharap na katuparan ng ipinahayag na mga salita at ang biblikal na diwa ng fulfillment.
- source_word: εἰς τὸν καιρὸν αὐτῶν
  choice: sa takdang panahon ng mga iyon
  rationale: Ipinahihiwatig ng καιρός ang angkop o itinakdang panahon; ang panghalip ay pinananatiling nakaugnay sa “mga salita” nang hindi tahasang dinaragdagan kung sino ang nagtakda.
theological_decisions:
- issue: Likas ng hatol kay Zacarias
  choice: Ipinakikita ang ipinataw na kawalan ng kakayahang magsalita hanggang sa katuparan ng pangako.
  alternative: Maaaring ipakahulugan ang σιωπῶν nang mag-isa bilang kusang pananahimik.
  rationale: Ang pagsasama ng σιωπῶν at μὴ δυνάμενος λαλῆσαι ay malinaw na tumutukoy sa sapilitang kawalan ng pagsasalita, hindi lamang sa utos na manahimik.
- issue: Diwa ng takdang panahon
  choice: “takdang panahon” nang hindi tahasang sinasabing “itinakda ng Diyos”
  alternative: “sa panahong itinakda ng Diyos”
  rationale: Nasa konteksto ang banal na katuparan, ngunit hindi tahasang binabanggit sa parirala ang tagapagtakda; iniiwasang gawing lantad ang ipinahihiwatig lamang ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “masdan mo” bilang pantawag-pansin na may solemnidad, at iniwasan ang mas arkaikong “mangyayari ang mga ito sa kanilang kapanahunan.”
