  source_fidelity: 'Tapat ang salin sa Griyego: ang οὗτος ay natural na “Siya,” ang ἔσται μέγας ay “magiging dakila,” at ang κληθήσεται ay wastong “tatawaging.” Napanatili ang titularyong “Anak ng Kataas-taasan,” ang “Panginoong Diyos” para sa κύριος ὁ θεός, at ang pagbibigay ng trono ni David. Ang “kanyang amang si David” ay malapit sa τοῦ πατρὸς αὐτοῦ at ang dinastikong diwa ay maayos na ipinaliwanag sa talababa.'
  naturalness: Natural, malinaw, at marangal ang modernong Filipino Tagalog. Ang paghahati sa dalawang pangungusap ay hindi nakapagpabago sa ugnayan o kahulugan ng magkakaugnay na sugnay. Ang “Panginoong Diyos,” “Kataas-taasan,” at “trono” ay angkop sa rehistro.
  terminology: Pare-pareho at angkop ang mahahalagang termino. Hindi pinalabis ng “Panginoong Diyos” ang Griyegong κύριος bilang tetragrammaton, at hindi rin pinahina ang “Anak ng Kataas-taasan.” Ang talababa sa “ama” ay wastong naglilinaw na si David ay maharlikang ninuno sa linya ni Jesus.
