id: LUK.1.32
reference: Luke 1:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗτος ἔσται μέγας καὶ υἱὸς Ὑψίστου κληθήσεται, καὶ δώσει αὐτῷ κύριος ὁ θεὸς τὸν θρόνον Δαυὶδ τοῦ πατρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/032.yaml
  text: He will be great and will be called the Son of the Most High[a], and the Lord God will give him the throne of David his father[c][b],
translation:
  language: tl
  text: Siya[a] ay magiging dakila at tatawaging[b] Anak ng Kataas-taasan. Ibibigay sa kanya ng Panginoong Diyos ang trono ng kanyang amang si David.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ang isang ito ay magiging dakila.” Nagsisimula ang Griyego sa demonstratibong panghalip na οὗτος, “ang isang ito.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “bibigyan ng pangalang Anak ng Kataas-taasan.”
    reason: lexical_alternative
  - marker: c
    text: Ang “ama” ay tumutukoy kay David bilang maharlikang ninuno ni Jesus sa angkan ni David.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: Siya
  rationale: Tumutukoy ito sa batang kapapahayag pa lamang. Mas natural sa modernong Tagalog ang “Siya” kaysa sa literal na “Ang isang ito,” habang itinatala sa talababa ang demonstratibong anyo ng Griyego.
- source_word: ἔσται μέγας
  choice: ay magiging dakila
  rationale: Pinananatili ng “magiging” ang hinaharap na aspekto, at ng “dakila” ang malawak at mataas na diwa ng μέγας nang hindi ito nililimitahan sa kapangyarihan o kasikatan.
- source_word: υἱὸς Ὑψίστου
  choice: Anak ng Kataas-taasan
  rationale: Likas na ipinapahayag sa Tagalog ang titularyong gamit nang walang pantukoy bago ang “Anak.” Pinananatili ng “Kataas-taasan” ang kinikilalang banal na titulo.
- source_word: κληθήσεται
  choice: tatawaging
  rationale: Malinaw at natural itong pasibong anyong hinaharap para sa pagtatalaga ng pangalan o titulo.
- source_word: κύριος ὁ θεὸς
  choice: Panginoong Diyos
  rationale: Ang tambalang “Panginoong Diyos” ay natural sa Tagalog at hindi labis na tinutukoy ang κύριος bilang representasyon ng tetragrammaton.
- source_word: δώσει αὐτῷ
  choice: Ibibigay sa kanya
  rationale: Tuwirang inililipat ang simpleng pandiwang “magbibigay” at ang datibong panghalip sa natural na ayos ng Tagalog.
- source_word: τὸν θρόνον Δαυὶδ τοῦ πατρὸς αὐτοῦ
  choice: ang trono ng kanyang amang si David
  rationale: Pinananatili ang “trono” at ang tahasang wikang “ama,” habang nililinaw ng natural na ayos sa Tagalog na si David ang tinutukoy bilang ama sa dinastikong kahulugan.
theological_decisions:
- issue: Ang Cristolohikal na titulo na υἱὸς Ὑψίστου
  choice: Anak ng Kataas-taasan
  alternative: isang anak ng Kataas-taasan
  rationale: Gumaganap ang parirala bilang natatanging titulo sa pahayag tungkol kay Jesus. Pinananatili nito ang lakas ng pag-aangkin nang hindi nagdaragdag ng wikang teolohikal na wala sa teksto.
- issue: Pagsasalin ng κύριος
  choice: Panginoon sa pariralang “Panginoong Diyos”
  alternative: Yahweh na Diyos; PANGINOONG Diyos
  rationale: κύριος ang nasa tekstong Griyego, hindi ang tetragrammaton; kaya hindi dapat gawing higit na tiyak kaysa sa pinagmulan.
- issue: Ang pagtawag kay David na ama
  choice: kanyang amang si David
  alternative: kanyang ninunong si David
  rationale: Pinananatili ang literal na πατήρ at ang maharlika at dinastikong ugnayan kay David. Ipinapaliwanag sa talababa na ang “ama” rito ay ninuno sa angkan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “dakila,” “Kataas-taasan,” “Panginoong Diyos,” at “trono” upang mapanatili ang mataas at maharlikang himig ng pahayag. Hinati sa dalawang pangungusap para sa malinaw na pagbasa nang hindi binabago ang ugnayang sintaktiko ng dalawang sugnay.
