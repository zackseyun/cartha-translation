id: LUK.1.55
reference: Luke 1:55
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καθὼς ἐλάλησεν πρὸς τοὺς πατέρας ἡμῶν, τῷ Ἀβραὰμ καὶ τῷ σπέρματι αὐτοῦ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/055.yaml
  text: just as he spoke to our fathers[b][a], to Abraham and to his offspring forever.
translation:
  language: tl
  text: gaya ng sinabi niya sa ating mga ninuno[a], kay Abraham at sa kanyang lahi[b] magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa ating mga ama.” Literal na “mga ama” ang Griyego, ngunit maaari itong tumukoy sa mga ninuno.
    reason: lexical_alternative
  - marker: b
    text: O “sa kanyang binhi” o “sa kanyang mga inapo.” Gumagamit ang Griyego ng isang pangngalang kolektibo na nasa isahan at maaaring mangahulugang “binhi,” “lahi,” o “mga inapo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: gaya ng
  rationale: Likas na panandang Filipino para sa pagtutugma ng naunang ginawa ng Diyos sa dati niyang sinabi.
- source_word: ἐλάλησεν
  choice: sinabi niya
  rationale: Natural sa modernong Filipino at malinaw na tumutukoy sa naunang pahayag o pangako ng Diyos; ang mas literal na “nagsalita siya” ay hindi gaanong likas sa kayariang ito.
- source_word: πρὸς τοὺς πατέρας ἡμῶν
  choice: sa ating mga ninuno[a]
  rationale: Ang “mga ninuno” ang malinaw at karaniwang tawag sa mga naunang salinlahi sa Filipino. Isinasaad sa talababa na literal na “mga ama” ang Griyego upang hindi mawala ang patriyarkal at tipanang himig.
- source_word: τῷ Ἀβραὰμ
  choice: kay Abraham
  rationale: Karaniwang anyong Filipino ng pang-ukol para sa pangalang pantangi at nagpapatuloy sa mga tumanggap ng sinabi ng Diyos.
- source_word: τῷ σπέρματι αὐτοῦ
  choice: sa kanyang lahi[b]
  rationale: Ang “lahi” ay natural na pangngalang kolektibo sa Filipino at maaaring tumukoy sa mga nagmula kay Abraham. Pinananatili sa talababa ang mas literal na “binhi” at ang posibilidad na “mga inapo.”
- source_word: εἰς τὸν αἰῶνα
  choice: magpakailanman
  rationale: Karaniwan at marangal na katumbas sa Filipino ng idyomang tumutukoy sa walang hanggang pagpapatuloy.
theological_decisions:
- issue: Ang panlalaking anyo ng πατέρας ἡμῶν sa kasaysayan ng tipan
  choice: ating mga ninuno[a]
  alternative: ating mga ama
  rationale: Mas malinaw sa ordinaryong mambabasang Filipino ang “mga ninuno,” samantalang maaaring mapagkamalang mga agarang ama ang “mga ama.” Gayunman, inilalahad sa talababa ang literal na panlalaking anyo upang mapanatili ang patriyarkal na pahiwatig ng pinagmulan.
- issue: Ang kolektibong isahan na σπέρματι αὐτοῦ sa pangako kay Abraham
  choice: kanyang lahi[b]
  alternative: kanyang binhi; kanyang mga inapo
  rationale: Pinananatili ng “lahi” ang kolektibong diwa nang hindi ipinipilit kung iisang supling o maraming inapo ang pangunahing tinutukoy. Inilalagay sa talababa ang “binhi” at “mga inapo” upang mapanatili ang leksikal at teolohikal na saklaw.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “mga ninuno” at “lahi” para sa agarang pagkaunawa, habang pinanatili sa mga talababa ang literal at teolohikal na mahahalagang alternatibo.
