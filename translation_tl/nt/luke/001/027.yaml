  text: πρὸς παρθένον ⸀ἐμνηστευμένην ἀνδρὶ ᾧ ὄνομα Ἰωσὴφ ἐξ οἴκου Δαυίδ, καὶ τὸ ὄνομα τῆς παρθένου Μαριάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/027.yaml
  text: to a virgin pledged in marriage to a man whose name was Joseph, from the house of David; and the virgin’s name was Mary.
translation:
  language: tl
  text: sa isang birhen na may pormal na kasunduang magpakasal[a] sa isang lalaking nagngangalang Jose, na mula sa sambahayan ni David; at Maria ang pangalan ng birhen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nakipagtipan nang ikasal.” Ang salitang Griyego ay tumutukoy sa isang pormal at may-bisang kasunduan bago ang ganap na pagsasama bilang mag-asawa.
    reason: lexical_alternative
  - marker: b
    text: O, “Mariam,” na mas malapit na transliterasyon ng anyong Griyego ng pangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρθένον / παρθένου
  choice: birhen
  rationale: Ang “birhen” ang tuwiran at karaniwang katumbas sa Filipino ng παρθένος sa kontekstong ito. Pinananatili rin nito ang sadyang pag-uulit ni Lucas sa talata.
- source_word: ἐμνηστευμένην
  choice: ipinagkasundong ikasal
  rationale: Ipinahihiwatig ng perpektong pandiwaring Griyego ang umiiral nang kalagayan ng pormal na kasunduan bago ang ganap na pagsasama bilang mag-asawa. Likas at malinaw ito sa modernong Filipino, samantalang ipinapaliwanag sa talababa ang makasaysayang bigat nito.
- source_word: ἀνδρὶ
  choice: sa isang lalaki
  rationale: Maaaring mangahulugan ang ἀνήρ ng “lalaki” o “asawang lalaki,” ngunit dito ay hindi dapat ipahiwatig na ganap na ang kanilang pagsasama bilang mag-asawa.
- source_word: ᾧ ὄνομα Ἰωσὴφ
  choice: isang lalaking nagngangalang Jose
  rationale: Ito ang natural na anyo sa Filipino ng pormulang Griyego sa pagbibigay ng pangalan.
- source_word: ἐξ οἴκου Δαυίδ
  choice: mula sa sambahayan ni David
  rationale: Pinananatili ng “sambahayan ni David” ang dinastiko at biblikal na larawan ng οἶκος, sa halip na paliitin ito sa mas interpretatibong “angkan” lamang.
- source_word: Μαριάμ
  choice: Maria
  rationale: Ang “Maria” ang nakaugaliang anyo ng pangalang ito sa mga saling Filipino; inilalahad sa talababa ang mas malapit na transliterasyong “Mariam.”
theological_decisions:
- issue: Kung pananatilihin ang kahulugang pagkabirhen ng παρθένος sa salaysay ni Lucas
  choice: birhen
  alternative: dalaga
  rationale: Sa salita at agarang konteksto ni Lucas, malinaw na “birhen” ang angkop na kahulugan. Hindi nito dinaragdagan ang sinasabi ng talata at pinananatili nito ang kabuluhang teolohikal ng salaysay.
- issue: Kung tatawaging asawa na si Jose
  choice: lalaki
  alternative: asawang lalaki
  rationale: Pinananatili ng “lalaki” ang yugto ng pormal na kasunduan sa pag-aasawa nang hindi ipinapalagay na ganap na ang kanilang pagsasama bilang mag-asawa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “ipinagkasundong ikasal” upang maipahayag sa karaniwang wika ang pormal na kalagayan ng betrothal; iniwasan ang “engaged” na hiram at ang “katipan,” na maaaring kulang sa legal at panlipunang bigat. Ang “na mula sa sambahayan ni David” ay ikinakabit kay Jose ayon sa pinakamalapit at natural na pagbasa ng sintaks.
