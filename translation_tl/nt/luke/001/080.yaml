  naturalness: Mas natural at malinaw sa makabagong Filipino ang “Patuloy na lumalaki ang bata at lumalakas” at “hanggang sa araw ng kanyang hayagang pagpapakita sa Israel.” Pinapanatili nito ang maramihang “mga ilang” habang ang “mga ilang na pook” sa talababa ay tumutulong sa pag-unawa.
  terminology: Ang “espiritu” na walang malaking titik ay wastong pangunahing salin para sa di-tiyak na πνεύματι; pinangangalagaan ng talababa ang posibleng pagbasa na “Espiritu.” Ang “hayagang pagpapakita” ay mas malapit sa ἀνάδειξις kaysa “hayagan siyang humarap,” nang hindi ipinapasiya kung sino ang tagapagpakilala.
