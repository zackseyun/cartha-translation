  text: Τὸ δὲ παιδίον ηὔξανε καὶ ἐκραταιοῦτο πνεύματι, καὶ ἦν ἐν ταῖς ἐρήμοις ἕως ἡμέρας ἀναδείξεως αὐτοῦ πρὸς τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/080.yaml
  text: And the child kept growing and becoming strong in spirit[c][b][a], and he was in the wilderness until the day of his public appearance to Israel.
translation:
  language: tl
  text: Patuloy na lumalaki ang bata at lumalakas sa espiritu[a]. Nanatili siya sa mga ilang[b] hanggang sa araw ng kanyang hayagang pagpapakita sa Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa Espiritu.” Maaaring tumukoy ang Griyego sa panloob o espirituwal na lakas sa pangkalahatan, o mas tiyak sa lakas na kaugnay ng Espiritu Santo.
    reason: alternative_reading
  - marker: b
    text: Literal na “sa mga ilang” o “sa mga ilang na pook”; maramihan ang salita sa Griyego.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “hanggang sa araw ng kanyang pagpapamalas sa Israel” o “hanggang sa araw ng kanyang paglitaw sa harap ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: ang bata
  rationale: Malawak at likas na tawag kay Juan habang siya ay lumalaki; hindi nito nililimitahan ang tinutukoy sa isang tiyak na yugto ng edad.
- source_word: ηὔξανε
  choice: patuloy na lumaki
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang nagpapatuloy na paglaki.
- source_word: ἐκραταιοῦτο
  choice: lumakas
  rationale: Likas sa Tagalog at pinananatili ang diwa ng nagpapatuloy na paglalakas nang hindi ipinapasiya kung ito ay tahasang pasibo o intransitibo.
- source_word: πνεύματι
  choice: sa espiritu
  rationale: Pinananatili ang malawak na kahulugan ng lakas sa panloob o espirituwal na aspekto at hindi tahasang itinatakda na ang tinutukoy ay ang Espiritu Santo.
- source_word: ἐν ταῖς ἐρήμοις
  choice: sa mga ilang
  rationale: Pinananatili ang anyong maramihan ng Griyego at ang diwa ng mga ilang o ilang na pook.
- source_word: ἀναδείξεως
  choice: hayagan siyang humarap
  rationale: Malinaw at natural na ipinapahayag ang kanyang paglitaw o pagpapakilala sa madla.
- source_word: πρὸς τὸν Ἰσραήλ
  choice: sa Israel
  rationale: Ipinakikita ang Israel bilang bayan na kanyang hayagang hinarap o pinagpakitaan.
theological_decisions:
- issue: Kahulugan ng πνεύματι sa paglakas ni Juan
  choice: sa espiritu
  alternative: sa Espiritu
  rationale: Walang artikulo at hindi tahasang tinutukoy ng parirala ang Espiritu Santo; pinananatili ng pangunahing salin ang posibleng pangkalahatang kahulugan habang inilalahad sa talababa ang mas tiyak na pagbasa.
- issue: Diwa ng ἀνάδειξις πρὸς τὸν Ἰσραήλ
  choice: hayagan siyang humarap sa Israel
  alternative: ipinahayag siya sa Israel
  rationale: Iniiwasang ipasiya kung ang diin ay nasa sariling paglitaw ni Juan o sa pagpapakilala sa kanya ng Diyos; ang pangunahing salin ay natural ngunit hindi nagdaragdag ng tahasang tagaganap.
translation_notes:
  register: Makabagong, dignidadong Filipino na madaling maunawaan. Ginamit ang “mga ilang” upang mapanatili ang maramihan sa Griyego; ang mga alternatibong posibleng kahulugan ng πνεύματι at ἀναδείξεως ay inilagay sa mga talababa.
