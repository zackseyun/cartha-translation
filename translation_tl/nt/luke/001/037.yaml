  text: For no word from God will be impossible[a].
translation:
  language: tl
  text: Sapagkat walang salitang mula sa Diyos na hindi maaaring mangyari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sapagkat walang imposible sa Diyos.”
    reason: Alternatibong salin na pinananatili ang tradisyonal at gramatikal na posibleng pagbasa.
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikita nito na ang pangungusap ay nagbibigay ng batayan sa naunang sinabi ni Gabriel, sa natural at marangal na Tagalog.
- source_word: οὐκ ἀδυνατήσει
  choice: walang ... ang magiging imposible
  rationale: Likas itong paraan sa Tagalog upang ipahayag ang hinaharap at pangkalahatang puwersa ng negasyon, nang hindi pinahihina ang diwa ng pagiging imposible.
- source_word: παρὰ τοῦ θεοῦ
  choice: mula sa Diyos
  rationale: Sa genitive na gamit ng παρά at kaugnayan nito sa ῥῆμα, malinaw nitong ipinahihiwatig na ang salita ay nagmumula sa Diyos; nananatiling posible ang tradisyonal na diwang 'sa Diyos' at inilagay sa talababa.
- source_word: πᾶν
  choice: walang
  rationale: Bagaman literal na 'bawat/lahat,' ang kombinasyon nito sa negadong pandiwa ay natural na naipahahayag sa Tagalog bilang 'walang ... ang magiging imposible,' na pinananatili ang saklaw sa lahat.
- source_word: ῥῆμα
  choice: salita
  rationale: Pinananatili nito ang tahasang leksikal na ideya ng sinabi o pahayag, pati ang kaugnayan sa ipinahayag ni Gabriel, nang hindi ito pinakikitid agad bilang 'pangako' o pinalalawak bilang 'bagay.'
theological_decisions:
- issue: Kahulugan ng παρὰ τοῦ θεοῦ πᾶν ῥῆμα
  choice: Walang salitang mula sa Diyos ang magiging imposible.
  alternative: Sapagkat walang imposible sa Diyos.
  rationale: Tahasan sa Griyego ang ῥῆμα, kaya pinananatili sa pangunahing teksto ang 'salita.' Gayunman, lehitimo rin ayon sa gramatika at tradisyon ang mas malawak na pagbasa tungkol sa walang imposible sa Diyos, kaya pinananatili ito sa talababa sa halip na lutasin nang palihim ang tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural, maikli, at marangal. Ginamit ang “Sapagkat” para sa paliwanag na ugnayan at “salitang mula sa Diyos” upang mapanatili ang ῥῆμα at ang source nuance ng παρά.
