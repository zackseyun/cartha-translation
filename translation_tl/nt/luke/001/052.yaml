  text: καθεῖλεν δυνάστας ἀπὸ θρόνων καὶ ὕψωσεν ταπεινούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/052.yaml
  text: He has brought down rulers from thrones and exalted the humble[a][b].
translation:
  language: tl
  text: Ibinagsak niya mula sa mga trono ang mga pinuno[a], at itinaas niya ang mga mapagpakumbaba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga makapangyarihan.” Mas malawak na maaaring tumukoy ang salitang Griyego sa mga taong may kapangyarihan, ngunit ang “mula sa mga trono” ay umaayon sa kahulugang “mga pinuno.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga aba” o “mga nasa mababang kalagayan.” Maaaring tumukoy ang salitang Griyego sa mga mapagpakumbaba, sa mga mababa ang katayuan sa lipunan, o sa kapuwa nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεῖλεν
  choice: Ibinagsak niya
  rationale: Ang aspektong perpektibo ng “ibinagsak” ay nagpapahayag ng tiyak at ganap na pagkilos. Pinananatili nito ang larawan ng pagpapababa mula sa mataas na katayuan nang hindi nililimitahan ang salita sa isang teknikal na pagpapatalsik sa puwesto.
- source_word: δυνάστας
  choice: ang mga pinuno
  rationale: Maaaring tumukoy ang salita sa mga makapangyarihang tao o mga tagapamahala. Dahil kasunod nito ang “mula sa mga trono,” nangingibabaw dito ang diwa ng mga pinuno, habang inilalahad sa talababa ang mas malawak na kahulugan.
- source_word: ἀπὸ θρόνων
  choice: mula sa mga trono
  rationale: Tuwirang pinananatili ang kongkretong larawan ng mga trono. Hindi idinagdag ang “kanilang” sapagkat wala itong tahasang katumbas sa Griyego.
- source_word: ὕψωσεν
  choice: itinaas niya
  rationale: Natural sa modernong Tagalog at malinaw na katapat ng pagkilos na “ibinagsak.” Napananatili nito ang panlipunan at teolohikal na diwa ng pagtataas.
- source_word: ταπεινούς
  choice: ang mga mapagpakumbaba
  rationale: Madaling maunawaan at pinananatili ang diwa ng kababaang-loob. Yamang maaari ring tumukoy ang Griyego sa mga mababa ang kalagayan, inilalahad ang kahulugang iyon sa talababa.
theological_decisions:
- issue: Aspekto at panahunan ng mga aorist sa Magnificat
  choice: 'Gamitin ang aspektong perpektibo: “Ibinagsak … at itinaas.”'
  alternative: Gumamit ng pangkasalukuyan o hayag na propetikong pagpapahayag.
  rationale: Ang perpektibong anyo sa Tagalog ay nagpapakita ng tiyak at ganap na pagkilos ng Diyos, gaya ng mga aorist sa awit, nang hindi nagpapasya kung ang mga ito ay buod ng nakaraan, propetikong katiyakan, o makatang paglalarawan ng patuloy na kabuluhan ng kanyang gawa.
- issue: Saklaw ng ταπεινούς
  choice: “mga mapagpakumbaba,” na may talababa tungkol sa mababang kalagayan
  alternative: “mga aba” o “mga nasa mababang kalagayan”
  rationale: Hindi dapat tahimik na piliin lamang ang moral na kababaang-loob o panlipunang kababaan. Ang pangunahing teksto ay natural, at pinananatili ng talababa ang tunay na saklaw at tensiyon ng salita.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang kongkretong larawan ng mga trono at ang magkatapat na kilos na “ibinagsak” at “itinaas.” Nasa pangunahing teksto ang lahat ng marker ng talababa.
