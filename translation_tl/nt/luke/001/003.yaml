  text: ἔδοξε κἀμοὶ παρηκολουθηκότι ἄνωθεν πᾶσιν ἀκριβῶς καθεξῆς σοι γράψαι, κράτιστε Θεόφιλε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/003.yaml
  text: it seemed good to me also[a], having followed all things closely from the beginning, to write them to you in orderly sequence, most excellent Theophilus[b],
translation:
  language: tl
  text: Minabuti ko rin, matapos kong maingat na masubaybayan ang lahat mula pa sa simula[a], na isulat ang mga ito para sa iyo ayon sa maayos na pagkakasunod-sunod[b], kagalang-galang na Teofilo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “matapos kong masusing siyasatin ang lahat mula pa sa simula.”
    reason: lexical_alternative
  - marker: b
    text: O, “ayon sa pagkakasunod-sunod”; maaaring tumukoy ang parirala sa maayos na pagkakaayos ng salaysay at hindi lamang sa mahigpit na kronolohikal na pagkakasunod-sunod.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔδοξε
  choice: Minabuti
  rationale: Ipinahahayag ng idyomang Griyego ang pinag-isipang pasiya o pagkilalang nararapat ang isang gawain. Likas sa Filipino ang “minabuti” at napapanatili nito ang pormal na himig ng paunang salita.
- source_word: κἀμοὶ
  choice: ko rin
  rationale: Ipinakikita ng καί na ibinibilang ng may-akda ang sarili niya kasama ng mga naunang nagsikap magsalaysay sa talatang 1. Likas at malinaw itong naipahahayag ng “ko rin.”
- source_word: παρηκολουθηκότι
  choice: matapos kong ... masubaybayan
  rationale: Maaaring tumukoy ang pandiwa sa maingat na pagsubaybay, pagtunton, o pagsisiyasat. Pinananatili ng “masubaybayan” ang larawan ng malapit na pagtunton sa mga pangyayari, samantalang ipinahihiwatig ng “maingat” ang masusing pagsisiyasat.
- source_word: ἄνωθεν
  choice: mula pa sa simula
  rationale: Sa konteksto ng makasaysayang paunang salita, pinakamalamang na tumutukoy ito sa pinagmulan o pasimula ng mga pangyayari, hindi sa “mula sa itaas.”
- source_word: πᾶσιν
  choice: ang lahat
  rationale: Ang neuter plural ay sumasaklaw sa lahat ng bagay o pangyayaring tinatalakay. Ang “ang lahat” ay natural sa Filipino at sapat na malawak.
- source_word: ἀκριβῶς
  choice: maingat
  rationale: Ipinahahayag nito ang masusi at eksaktong pagtuon. Kapag kasama ng “masubaybayan,” natural na ipinahahayag ng “maingat” ang ganitong diwa nang hindi mabigat ang pangungusap.
- source_word: καθεξῆς
  choice: ayon sa maayos na pagkakasunod-sunod
  rationale: Maaaring tumukoy ang salita sa sunod-sunod o organisadong paglalahad. Pinananatili ng saling ito ang parehong ideya ng kaayusan at pagkakasunod nang hindi tahasang nagsasabing mahigpit na kronolohikal ang ayos.
- source_word: σοι γράψαι
  choice: na isulat ang mga ito para sa iyo
  rationale: Tuwirang ipinahahayag ang pagsulat para sa tumatanggap; ang “mga ito” ay likas na tumutukoy sa mga bagay o pangyayaring binanggit sa konteksto.
- source_word: κράτιστε
  choice: kagalang-galang
  rationale: Isa itong pormal na katawagan ng paggalang na ginagamit din sa Lucas–Mga Gawa para sa mga taong may mataas na katayuan. Ang “kagalang-galang” ay dignipikado at natural sa modernong Filipino.
- source_word: Θεόφιλε
  choice: Teofilo
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Griyegong Θεόφιλος.
theological_decisions:
- issue: Kahulugan ng καθεξῆς kaugnay ng ayos ng kasaysayan
  choice: ayon sa maayos na pagkakasunod-sunod
  alternative: ayon sa mahigpit na kronolohikal na pagkakasunod-sunod
  rationale: Pinahihintulutan ng salitang Griyego ang sunod-sunod o maayos na pagkakaayos, ngunit hindi nito kinakailangang igiit ang ganap na mahigpit na kronolohiya. Pinananatili ng salin ang saklaw at tensiyon ng orihinal.
- issue: Lakas ng pahayag tungkol sa pamamaraan ng may-akda sa παρηκολουθηκότι
  choice: maingat na masubaybayan
  alternative: masusing siyasatin
  rationale: Maaaring ilarawan ng pandiwa ang malapit na pagsubaybay o aktibong pagsisiyasat. Hindi ginagawang eksklusibo ng pangunahing salin ang alinman sa dalawang diwa; inilalahad sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Pormal at dignipikado ang himig upang umangkop sa estilong pampanitikan ng paunang salita ni Lucas, ngunit gumagamit ng kasalukuyan at madaling maunawaang Filipino. Pinanatili ang kuwit sa dulo dahil bahagi ang talata ng nagpapatuloy na pangungusap mula Lucas 1:1–4.
