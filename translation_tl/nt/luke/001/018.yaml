id: LUK.1.18
reference: Luke 1:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπεν Ζαχαρίας πρὸς τὸν ἄγγελον· Κατὰ τί γνώσομαι τοῦτο; ἐγὼ γάρ εἰμι πρεσβύτης καὶ ἡ γυνή μου προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/018.yaml
  text: And Zechariah said to the angel[a], “How will I know this? For I am an old man, and my wife is advanced in her days.”
translation:
  language: tl
  text: At sinabi ni Zacarias sa anghel, “Paano ko malalaman ito? Sapagkat matanda na ako, at matanda na rin ang asawa ko[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sumulong na sa kanyang mga araw,” isang idyoma na nangangahulugang may katandaan na o malayo na ang narating sa buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: sinabi
  rationale: Karaniwang pandiwa sa pagsasalaysay ng tuwirang pananalita; natural at tumpak sa modernong Filipino.
- source_word: πρὸς τὸν ἄγγελον
  choice: sa anghel
  rationale: Kasama ng pandiwa ng pagsasalita, tinutukoy ng πρός ang kausap; ang “sa anghel” ang natural na anyo sa Filipino.
- source_word: Κατὰ τί
  choice: Paano
  rationale: Nagtatanong ang parirala kung sa anong batayan o paraan niya matitiyak ang ipinahayag; pinananatili ng “Paano” ang lawak ng tanong nang hindi ito dinaragdagan.
- source_word: γνώσομαι
  choice: ko malalaman
  rationale: Ipinahahayag ng anyong panghinaharap ang pagdating sa pagkaalam o pagkakaroon ng katiyakan; likas na naihahatid ito ng “malalaman” sa Filipino.
- source_word: τοῦτο
  choice: ito
  rationale: Payak na pantukoy sa ipinahayag ng anghel; sapat at natural ang “ito.”
- source_word: πρεσβύτης
  choice: matanda na ako
  rationale: Ang salita ay tumutukoy sa matandang lalaki, hindi sa isang katungkulan. Mas natural sa Filipino ang pangungusap na “matanda na ako” kaysa “ako ay isang matandang lalaki.”
- source_word: γυνή
  choice: asawa ko
  rationale: Malinaw sa konteksto at sa panghalip na paari na “asawa” ang kahulugan, hindi lamang “babae.”
- source_word: προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς
  choice: matanda na rin
  rationale: Ang Griyegong idyoma ay literal na nagsasabing siya ay “sumulong na sa kanyang mga araw,” na nangangahulugang may katandaan na. Ang “matanda na rin” ay malinaw at natural, habang inilalahad sa talababa ang larawan ng orihinal.
theological_decisions:
- issue: Kahulugan ng ἄγγελος
  choice: anghel
  alternative: mensahero
  rationale: Bagaman maaaring mangahulugang “mensahero” ang ἄγγελος, ipinakikilala sa konteksto ang nagsasalita bilang si Gabriel; kaya “anghel” ang hinihingi ng konteksto nang walang idinaragdag na doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang ayos ng pangungusap at iniwasan ang sobrang literal na idyomang magiging asiwa sa pangunahing teksto; pinanatili naman ang larawan nito sa talababa.
