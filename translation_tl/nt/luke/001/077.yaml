  text: τοῦ δοῦναι γνῶσιν σωτηρίας τῷ λαῷ αὐτοῦ ἐν ἀφέσει ἁμαρτιῶν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/077.yaml
  text: to give knowledge of salvation to his people in the forgiveness of their sins,[a]
translation:
  language: tl
  text: upang ibigay sa kanyang bayan ang kaalaman tungkol sa kaligtasan sa kapatawaran ng kanilang mga kasalanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng kapatawaran ng kanilang mga kasalanan” o “dahil sa kapatawaran ng kanilang mga kasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ δοῦναι
  choice: upang ibigay
  rationale: Ang articular infinitive ay nagpapahayag ng layunin kaugnay ng naunang talata; likas itong naihahayag sa Tagalog sa pamamagitan ng “upang ibigay.”
- source_word: γνῶσιν σωτηρίας
  choice: ang kaalaman tungkol sa kaligtasan
  rationale: Ang γνῶσις ay “kaalaman” o “pagkaunawa,” at ang genitibong σωτηρίας ay likas na maisasalin bilang “tungkol sa kaligtasan” sa modernong Tagalog nang hindi dinaragdagan ang kahulugan.
- source_word: τῷ λαῷ αὐτοῦ
  choice: sa kanyang bayan
  rationale: Ang datibo ang tumutukoy sa tatanggap ng kaalaman. Pinananatili ng “kanyang bayan” ang tipanang himig ng λαός αὐτοῦ.
- source_word: ἐν ἀφέσει
  choice: sa kapatawaran
  rationale: Maaaring tumukoy ang ἐν sa saklaw o paraan. Pinananatili ng “sa kapatawaran” ang lapit sa Griyego at ang tunay na kalabuan nito, sa halip na tiyaking instrumental lamang ang ugnayan.
- source_word: ἁμαρτιῶν αὐτῶν
  choice: ng kanilang mga kasalanan
  rationale: Pinananatili ang maramihang bilang ng ἁμαρτιῶν at malinaw na iniuugnay ang mga kasalanan sa bayan.
theological_decisions:
- issue: Ugnayan ng kaligtasan at kapatawaran
  choice: Inilalahad ang pagkakilala sa kaligtasan kaugnay ng kapatawaran ng mga kasalanan, gamit ang “sa kapatawaran.”
  alternative: “sa pamamagitan ng kapatawaran” o “dahil sa kapatawaran”
  rationale: Maaaring ipahiwatig ng ἐν ang saklaw, paraan, o instrumento. Hindi nililimitahan ng pangunahing salin ang ugnayan sa iisang paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “bayan” sa halip na “mga tao” upang mapanatili ang kolektibo at tipanang diwa ng λαός.
