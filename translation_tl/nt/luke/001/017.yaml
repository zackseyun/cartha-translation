id: LUK.1.17
reference: Luke 1:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ αὐτὸς προελεύσεται ἐνώπιον αὐτοῦ ἐν πνεύματι καὶ δυνάμει Ἠλίου, ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα καὶ ἀπειθεῖς ἐν φρονήσει δικαίων, ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/017.yaml
  text: And he will go before him in the spirit and power of Elijah[a], to turn the hearts of fathers to children, and the disobedient to the wisdom of the righteous[c][b], to prepare for the Lord a people made ready.
translation:
  language: tl
  text: Mauuna siya sa kanya, taglay ang espiritu at kapangyarihan ni Elias[a], upang ibaling ang puso ng mga ama sa mga anak[b], at ang mga masuwayin sa karunungan ng mga matuwid[c], upang ihanda para sa Panginoon ang isang sambayanang nakahanda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “espiritu at kapangyarihan ni Elias” ay tumutukoy sa gawaing propetiko at pagkilos na tulad ng kay Elias; hindi nito tahasang sinasabing si Elias mismo ay literal na bumalik.
    reason: cross_reference
  - marker: b
    text: Maaari ring “tungo sa mga anak.” Umaalingawngaw rito ang Malakias 4:6 at maaaring kasama sa diwa ang pagpapanumbalik ng ugnayan sa pamilya.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa pag-unawa ng mga matuwid,” “sa pag-iisip ng mga matuwid,” o “sa maingat na paghatol ng mga matuwid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προελεύσεται ἐνώπιον αὐτοῦ
  choice: Mauuna siya sa kanya
  rationale: Likas ito sa modernong Tagalog at ipinahahayag ang pag-una sa isang tao sa gawain o pagdating. Pinananatili rin ang panghalip na hindi tinutukoy nang tahasan sa talata.
- source_word: ἐν πνεύματι καὶ δυνάμει Ἠλίου
  choice: taglay ang espiritu at kapangyarihan ni Elias
  rationale: Ang “taglay” ay natural na nagpapahayag ng paraan o pagkakaloob, habang malinaw na pinananatili ang ugnayan kay Elias nang hindi ipinapantay sa kanya ang taong tinutukoy.
- source_word: ἐπιστρέψαι
  choice: upang ibaling
  rationale: Ipinakikita ng pawatas ang layunin. Ang “ibaling” ay angkop kapuwa sa puso ng mga ama at, sa kasunod na pariralang eliptikal, sa mga masuwayin.
- source_word: καρδίας πατέρων ἐπὶ τέκνα
  choice: ang puso ng mga ama sa mga anak
  rationale: Malapit ito sa anyo ng Griyego at pinananatili ang alusyon sa Malakias 4:6, pati ang posibilidad ng pagpapanumbalik ng ugnayan sa pamilya.
- source_word: ἀπειθεῖς
  choice: ang mga masuwayin
  rationale: Saklaw nito ang pagtangging makinig o magpasakop at akma sa moral na paghahambing sa “mga matuwid.”
- source_word: ἐν φρονήσει δικαίων
  choice: sa karunungan ng mga matuwid
  rationale: Ipinahahayag ng “karunungan” ang praktikal at moral na pagkaunawa ng φρόνησις. Ang “sa” ay nagpapanatili sa direksiyonal na diwa sa ilalim ng pandiwang “ibaling.”
- source_word: ἑτοιμάσαι κυρίῳ
  choice: upang ihanda para sa Panginoon
  rationale: Pinananatili ang ikalawang layunin at ang datibong diwang ang sambayanan ay inihahanda para sa Panginoon.
- source_word: λαὸν κατεσκευασμένον
  choice: isang sambayanang nakahanda
  rationale: Ang “sambayanan” ay tumutukoy sa isang sama-samang bayan o mga tao, at ang “nakahanda” ay nagpapakita ng kalagayang bunga ng naunang paghahanda.
theological_decisions:
- issue: Pagkakakilanlan at papel ng wikang tumutukoy kay Elias
  choice: Inilarawan ang darating na lingkod bilang taglay ang espiritu at kapangyarihan ni Elias.
  alternative: Sabihing siya ay literal na si Elias na nagbalik.
  rationale: Ang Griyego ay nagsasabing “sa espiritu at kapangyarihan ni Elias,” kaya pinananatili ang pagpapatuloy ng gawaing propetiko nang hindi nagdaragdag ng pahayag tungkol sa literal na pagkakakilanlan.
- issue: Tinutukoy ng “kanya” at ng “Panginoon”
  choice: Pinanatili ang “kanya” at “Panginoon” gaya ng nasa Griyego.
  alternative: Tahasan itong palitan ng “Mesiyas” o “Jesus.”
  rationale: Nililinaw ng konteksto ang tinutukoy, ngunit hindi ito pinapangalanan sa mismong unang parirala ng talata. Ang hindi pagpapalawak ay nagpapanatili sa tunay na anyo at tensiyong teolohikal ng teksto.
- issue: Kaugnayan ng mga masuwayin sa karunungan ng mga matuwid
  choice: 'Inunawa itong direksiyonal: ibabaling ang mga masuwayin sa karunungan ng mga matuwid.'
  alternative: Isalin bilang pagkilos “sa loob ng” o “sa pamamagitan ng” pag-iisip ng mga matuwid.
  rationale: Ang pagkakahanay nito sa naunang layuning “ibaling” ay sumusuporta sa direksiyonal na diwa, ngunit itinatala sa talababa ang ibang posibleng himig ng φρόνησις.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Iniwasan ang sobrang teknikal at denominasyonal na pananalita. Ginamit ang “Elias,” “Panginoon,” at “sambayanan” bilang mga anyong pamilyar sa kontekstong biblikal, habang nananatiling malinaw sa karaniwang mambabasa.
