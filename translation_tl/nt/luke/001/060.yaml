  text: καὶ ἀποκριθεῖσα ἡ μήτηρ αὐτοῦ εἶπεν· Οὐχί, ἀλλὰ κληθήσεται Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/060.yaml
  text: And his mother answered[a], “No; rather, he shall be called John.”
translation:
  language: tl
  text: Sumagot ang kanyang ina, “Hindi! Sa halip, Juan ang itatawag sa kanya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Tatawagin siyang Juan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεῖσα
  choice: Sumagot
  rationale: Ang aorist participle ay likas na isinalin bilang pandiwang may tiyak na panahunan sa Filipino; ipinakikita nitong tugon ito sa mungkahing pangalan sa naunang talata.
- source_word: μήτηρ αὐτοῦ
  choice: ang kanyang ina
  rationale: Natural na anyong Filipino para sa tiyak na pariralang tumutukoy sa ina ng bata.
- source_word: Οὐχί
  choice: Hindi!
  rationale: Tuwiran at mariing pagtanggi sa iminungkahing pangalan; ang tandang padamdam ay naghahayag ng lakas ng sagot nang hindi dinaragdagan ang kahulugan.
- source_word: ἀλλὰ
  choice: Sa halip
  rationale: 'Ipinahahayag ang mapagtuwid na salungatan: hindi ang pangalang iminungkahi, kundi Juan.'
- source_word: κληθήσεται
  choice: ang itatawag sa kanya
  rationale: Pinananatili ang diwang panghinaharap at balintiyak ng καλέω sa isang natural na konstruksiyong Filipino para sa pagbibigay ng pangalan.
- source_word: Ἰωάννης
  choice: Juan
  rationale: Karaniwang anyo ng pangalang biblikal na John sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong, dignificado, at madaling maunawaang Filipino. Ginamit ang “Sa halip” upang malinaw na mapanatili ang mapagtuwid na puwersa ng ἀλλά, at ang “Juan ang itatawag sa kanya” upang idiomatikong ihayag ang panghinaharap na balintiyak.
