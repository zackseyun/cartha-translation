base_translation:
  language: en
  yaml_path: translation/nt/luke/001/063.yaml
  text: And after asking for a writing tablet[a], he wrote, saying, “John is his name.” And they all marveled.
translation:
  language: tl
  text: 'Humingi siya ng isang tablang sulatan at isinulat niya: “Juan ang pangalan niya.” At namangha silang lahat.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτήσας
  choice: Humingi siya
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa pagsulat. Likas sa modernong Tagalog ang sunod na “Humingi siya … at isinulat” upang malinaw ang pagkakasunod ng mga kilos.
- source_word: πινακίδιον
  choice: sulatang tabla
  rationale: Tumutukoy ito sa isang maliit na tabla o tapyas na ginagamit na sulatan. Nililinaw ng “sulatang” ang gamit nito at iniiwasan ang makabagong kahulugan ng “tablet” bilang elektronikong aparato.
- source_word: ἔγραψεν λέγων
  choice: isinulat dito
  rationale: Ang literal na “sumulat na sinasabi” ay asiwa sa Tagalog. Ipinahahayag ng “isinulat dito” ang kilos at natural na ipinakikilala ng kasunod na sipi ang nilalaman ng isinulat.
- source_word: Ἰωάννης ἐστὶν ὄνομα αὐτοῦ
  choice: Juan ang pangalan niya
  rationale: Pinananatili ng ayos na ito ang diin ng Griyego sa pangalang “Juan” at natural din itong mariing pahayag sa Tagalog. Hindi ginawang panghinaharap ang present tense na ἐστίν.
- source_word: ἐθαύμασαν πάντες
  choice: namangha silang lahat
  rationale: Ang “namangha” ay malinaw at dignified na katumbas ng pagkagulat o pagtataka na ipinahihiwatig ng θαυμάζω, habang pinananatili ng “silang lahat” ang συλλογικό na diin ng πάντες.
theological_decisions:
- issue: Ang katayuan ng pangalang ibinigay sa bata
  choice: “Juan ang pangalan niya”
  alternative: “Juan ang magiging pangalan niya”
  rationale: Present tense ang ἐστίν at mariing pinagtitibay ni Zacarias ang pangalan, hindi lamang nagmumungkahi ng pangalang gagamitin sa hinaharap. Hindi dinaragdagan ang teksto ng interpretasyong panghinaharap.
translation_notes:
  register: Modernong Filipino Tagalog na simple, dignified, at angkop sa salaysay. Ginamit ang “sulatang tabla” sa halip na hiram na “tablet” upang maiwasan ang elektronikong pakahulugan. Ang “Juan ang pangalan niya” ay natural sa Tagalog at nagpapanatili sa diin ng orihinal.
