base_translation:
  language: en
  yaml_path: translation/nt/luke/001/008.yaml
  text: It happened[a], while he was serving as priest before God in the order of his division,
translation:
  language: tl
  text: Nang naglilingkod si Zacarias bilang pari sa harap ng Diyos ayon sa nakatakdang kaayusan ng kanyang pangkat,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Nang
  rationale: Ang pormulang pasalaysay ay likas na naiuugnay sa kasunod na pangyayari sa Filipino sa pamamagitan ng “Nang”; hindi kailangan ang makalumang katumbas na “At nangyari.”
- source_word: ἐν τῷ ἱερατεύειν αὐτὸν
  choice: naglilingkod si Zacarias bilang pari
  rationale: Temporal ang articular infinitive na may ἐν. Tahasang pinangalanan si Zacarias upang maging malinaw ang panghalip sa Filipino, at pinananatili ng “bilang pari” ang tiyak na tungkuling pansaserdote.
- source_word: ἐν τῇ τάξει τῆς ἐφημερίας αὐτοῦ
  choice: ayon sa takdang paglilingkod ng kanyang pangkat
  rationale: Tinutukoy ng τάξις at ἐφημερία ang itinakdang kaayusan o iskedyul ng pangkat ng mga pari. Mas malinaw ito sa karaniwang mambabasa kaysa sa literal ngunit malabong “ayon sa kaayusan ng kanyang pangkat.”
- source_word: ἔναντι τοῦ θεοῦ
  choice: sa harap ng Diyos
  rationale: Tumpak at dignified na katumbas ng paglilingkod sa presensya ng Diyos.
theological_decisions:
- issue: Terminong pangkulto para sa paglilingkod ni Zacarias sa templo
  choice: naglilingkod ... bilang pari sa harap ng Diyos ayon sa takdang paglilingkod ng kanyang pangkat
  alternative: gumaganap ng tungkulin bilang pari sa harap ng Diyos ayon sa pag-ikot ng kanyang pangkat
  rationale: Inilalarawan ng talata ang makasaysayang sistema ng salit-salitang paglilingkod ng mga pangkat ng pari, nang hindi nag-aangkat ng mga katawagang kaugnay ng makabagong denominasyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinanatili ang hulihang kuwit dahil nakasalalay ang sugnay sa kasunod na pangyayari sa Lucas 1:9.
