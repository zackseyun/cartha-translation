  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ ἄγγελος αὐτῇ· Μὴ φοβοῦ, Μαριάμ, εὗρες γὰρ χάριν παρὰ τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/030.yaml
  text: And the angel said to her[a], “Do not be afraid, Mary, for you have found favor with God.”
translation:
  language: tl
  text: At sinabi sa kanya ng anghel, “Huwag kang matakot, Maria, sapagkat kinalugdan ka ng Diyos.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakasumpong ka ng pabor sa Diyos” o “nakasumpong ka ng biyaya sa Diyos.” Ang salitang Griego na χάρις ay maaaring mangahulugang “pabor” o “biyaya”; sa idyomang ginamit dito, ang “kinalugdan ka ng Diyos” ang natural na pagpapahayag sa Tagalog.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: sinabi
  rationale: Karaniwang salaysay na aorist ng λέγω; ang “sinabi” ang natural na makabagong Tagalog sa pagpapakilala ng tuwirang pananalita.
- source_word: ἄγγελος
  choice: anghel
  rationale: Sa salaysay ng kapanganakan sa Lucas, makalangit na nilalang ang tinutukoy; mas tiyak at natural ang “anghel” kaysa sa pangkalahatang “mensahero.”
- source_word: Μὴ φοβοῦ
  choice: Huwag kang matakot
  rationale: Ang μή kasama ng pautos na pandiwa ay pagbabawal; natural at malinaw sa kasalukuyang Tagalog ang “Huwag kang matakot.”
- source_word: Μαριάμ
  choice: Maria
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Tagalog.
- source_word: εὗρες
  choice: kinalugdan ka
  rationale: Sa idyomang εὑρίσκω χάριν παρά, hindi literal na paghahanap ang diin kundi ang pagiging kalugod-lugod o pagtatamo ng pabor; ang pandiwang anyo ay natural sa Tagalog at nagpapahayag ng kasalukuyang katayuang bunga ng naganap.
- source_word: χάριν
  choice: kinalugdan
  rationale: Ang χάρις ay maaaring mangahulugang “biyaya” o “pabor,” ngunit sa idyomang “makasumpong ng χάρις sa Diyos,” ang diwa ay pagtingin ng Diyos nang may pabor o lugod.
- source_word: παρὰ τῷ θεῷ
  choice: ng Diyos
  rationale: Pagkatapos ng εὗρες χάριν, ipinahihiwatig ng παρά na ang Diyos ang pinagmumulan o maytaglay ng mapagpalang pagtingin; natural itong naipapahayag sa Tagalog sa “kinalugdan ka ng Diyos.”
theological_decisions:
- issue: Pagpapahayag ng χάριν sa kontekstong tumutukoy kay Maria
  choice: kinalugdan ka ng Diyos
  alternative: nakatagpo ka ng biyaya sa Diyos
  rationale: Pinananatili ng “kinalugdan” ang idyomatikong diwa ng εὗρες χάριν παρὰ τῷ θεῷ nang hindi ipinapasok ang mga doktrinal na kahulugang nabuo sa kalaunan. Inilalagay sa talababa ang “pabor” at “biyaya” upang mapanatili ang leksikal na saklaw ng χάρις.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sapagkat” upang mapanatili ang malinaw na ugnayang sanhi ng γάρ, at ang “sa kanya” bilang natural na katumbas ng αὐτῇ.
