id: LUK.1.49
reference: Luke 1:49
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι ἐποίησέν μοι ⸀μεγάλα ὁ δυνατός, καὶ ἅγιον τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/049.yaml
  text: because the Mighty One has done great things for me[a], and holy is his name.
translation:
  language: tl
  text: sapagkat gumawa para sa akin ng mga dakilang bagay ang Makapangyarihan, at banal ang kanyang pangalan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at ang kanyang pangalan ay banal.” Nauuna sa Griyego ang “banal” upang bigyang-diin ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagpupuri ni Maria sa naunang talata at malinaw na pinananatili ang ugnayang sanhi.
- source_word: ἐποίησέν
  choice: gumawa
  rationale: Tumutukoy sa tiyak at natapos na pagkilos ng Diyos; sa kontekstong ito, natural sa Tagalog ang aspektong perpektibo.
- source_word: μοι
  choice: para sa akin
  rationale: 'Ipinahahayag ang diwang benefaktibo ng datibo: ang ginawa ay alang-alang kay Maria, hindi lamang isang bagay na nangyari sa kanya.'
- source_word: μεγάλα
  choice: mga dakilang bagay
  rationale: Ang pang-uring neuter plural ay ginagamit bilang pangngalan. Malawak ang saklaw ng parirala at hindi nito nililimitahan ang tinutukoy sa isang uri lamang ng makapangyarihang gawa.
- source_word: ὁ δυνατός
  choice: ang Makapangyarihan
  rationale: Ang pang-uri na may pantukoy ay ginagamit bilang isang katawagan sa Diyos. Ang anyong ito ay maikli, marangal, at natural sa modernong Tagalog.
- source_word: ἅγιον
  choice: banal
  rationale: Karaniwang katumbas ito na nagpapanatili sa diwa ng kabanalan at pagiging bukod-tangi ng Diyos.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: ang kanyang pangalan
  rationale: Tuwirang pinananatili ang salitang 'pangalan,' na sa kontekstong biblikal ay maaari ring tumukoy sa nahayag na pagkatao at reputasyon ng Diyos.
theological_decisions:
- issue: Pagpapahayag sa ὁ δυνατός bilang katawagan sa Diyos
  choice: ang Makapangyarihan
  alternative: ang makapangyarihang Isa
  rationale: Ginagamit ng Griyego ang pang-uri na may pantukoy bilang pangngalang katawagan. Pinananatili ng salin ang titular at mapitagang gamit nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Ayos ng mga salita sa καὶ ἅγιον τὸ ὄνομα αὐτοῦ
  choice: at banal ang kanyang pangalan
  alternative: at ang kanyang pangalan ay banal
  rationale: Nauuna sa Griyego ang 'banal' upang bigyang-diin ito. Natural din sa Tagalog ang ayos na ito at napapanatili ang diin.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang himig ng papuri at ang diin ng orihinal nang hindi gumagamit ng sobrang arkaiko o teknikal na pananalita.
