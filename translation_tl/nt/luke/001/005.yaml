id: LUK.1.5
reference: Luke 1:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐγένετο ἐν ταῖς ἡμέραις ⸀Ἡρῴδου βασιλέως τῆς Ἰουδαίας ἱερεύς τις ὀνόματι Ζαχαρίας ἐξ ἐφημερίας Ἀβιά, ⸀καὶ γυνὴ ⸀αὐτῷ ἐκ τῶν θυγατέρων Ἀαρών, καὶ τὸ ὄνομα αὐτῆς Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/005.yaml
  text: In the days of Herod[a], king of Judea, there was a priest named Zechariah, from the division of Abijah; and he had a wife from the daughters of Aaron[b], and her name was Elizabeth.
translation:
  language: tl
  text: Noong panahon ni Herodes, hari ng Judea, may isang paring nagngangalang Zacarias na kabilang sa pangkat ni Abias[a]. Ang asawa niya ay mula sa mga anak na babae ni Aaron[b], at ang pangalan ng kanyang asawa ay Elisabet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pangkat ni Abias” ay isa sa mga pangkat ng mga pari na salit-salitang naglilingkod sa templo.
    reason: cultural_note
  - marker: b
    text: O “mula sa mga inapo ni Aaron.” Mas literal sa Griyego ang “mula sa mga anak na babae ni Aaron,” isang pananalitang tumutukoy sa angkan ng mga pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο ἐν ταῖς ἡμέραις
  choice: Noong panahon ... may
  rationale: Ang Ἐγένετο ay pormulang pambungad sa salaysay, at ang ἐν ταῖς ἡμέραις ay temporal na idyoma. Likas sa modernong Tagalog ang pagsasama ng mga ito bilang “Noong panahon ... may,” nang hindi ginagawang literal ngunit alanganing “nangyari.”
- source_word: Ἡρῴδου βασιλέως τῆς Ἰουδαίας
  choice: ni Herodes, hari ng Judea
  rationale: Tuwirang ipinakikilala ang tao, tungkulin, at nasasakupan. Ginamit ang nakaugaliang anyong Filipino ng pangalan at ang “Judea” para sa makasaysayang lupain.
- source_word: ἱερεύς τις ὀνόματι Ζαχαρίας
  choice: isang paring nagngangalang Zacarias
  rationale: Ipinahihiwatig ng τις ang di-tiyak na pagpapakilala, na natural na naihahatid ng “isang.” Ang “nagngangalang” ay malinaw at marangal na katumbas ng pormula ng pagpapangalan.
- source_word: ἐξ ἐφημερίας Ἀβιά
  choice: kabilang sa pangkat ni Abias
  rationale: Ang ἐφημερία ay pangkat ng mga paring nakatalaga sa takdang paglilingkod. Ang “pangkat” ay payak at nauunawaan; nililinaw ng talababa ang institusyonal na diwa.
- source_word: γυνὴ αὐτῷ
  choice: Ang asawa niya
  rationale: Ang datibong αὐτῷ ay nagpapahayag ng pag-aari o kaugnayan. Mas likas sa Tagalog ang “ang asawa niya” kaysa sa literal na konstruksiyong “may asawa sa kaniya.”
- source_word: ἐκ τῶν θυγατέρων Ἀαρών
  choice: mula sa mga anak na babae ni Aaron
  rationale: Pinananatili nito ang kongkretong pananalita ng Griyego at ang diin sa angkan ni Aaron, habang ipinaliliwanag sa talababa na idyoma ito para sa salinlahi.
- source_word: τὸ ὄνομα αὐτῆς Ἐλισάβετ
  choice: Elisabet ang pangalan nito
  rationale: Natural itong pormula ng pagpapangalan sa Tagalog. Ang “nito” ay malinaw na tumutukoy sa asawang babae at umiiwas sa paulit-ulit na “niya.”
- source_word: Ἡρῴδης / Ζαχαρίας / Ἀβιά / Ἀαρών / Ἐλισάβετ
  choice: Herodes / Zacarias / Abias / Aaron / Elisabet
  rationale: Ginamit ang mga anyong nakaugaliang basahin at baybayin sa Filipino, sa halip na kopyahin ang mga anyong Ingles.
theological_decisions:
- issue: Paglalarawan sa angkan ni Elisabet
  choice: mula sa mga anak na babae ni Aaron
  alternative: mula sa mga inapo ni Aaron
  rationale: Literal na “mga anak na babae ni Aaron” ang Griyego at idiomatikong tumutukoy sa angkan. Pinananatili sa teksto ang larawang pampamilya at inilalagay sa talababa ang kahulugang pangangkan upang hindi palihim na palitan ang pahayag ng pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Hinati sa dalawang pangungusap ang mahabang pangungusap sa Griyego para sa likas na daloy, ngunit pinanatili ang pagkakasunod ng mga detalye. Ang mga marker [a] at [b] ay inilagay kaagad sa mga pariralang talagang ipinaliliwanag ng kani-kanilang talababa.
