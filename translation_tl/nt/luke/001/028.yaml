  text: καὶ ⸀εἰσελθὼν πρὸς αὐτὴν εἶπεν· Χαῖρε, κεχαριτωμένη, ὁ κύριος μετὰ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/028.yaml
  text: And coming in to her[a], he said, “Greetings, favored one[b]; the Lord is with you.”
translation:
  language: tl
  text: Pagpasok niya sa kinaroroonan ni Maria, sinabi niya, “Pagbati sa iyo[a], ikaw na pinagkalooban ng biyaya[b]! Ang Panginoon ay kasama mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Magalak ka”; ayon sa tradisyon, “Aba.” Ang salitang Griyego ay karaniwang pagbati, bagaman ang anyo nito ay pautos at literal na nangangahulugang “magalak.”
    reason: lexical_alternative
  - marker: b
    text: O “ikaw na lubos na kinalugdan,” “ikaw na biniyayaan,” o ayon sa tradisyon, “puspos ng biyaya.” Ipinahihiwatig ng Griyego ang isang taong pinagkalooban ng biyaya o pabor.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθὼν πρὸς αὐτὴν
  choice: Pagpasok niya sa kinaroroonan ni Maria
  rationale: Ipinahahayag ng aorist participle ang pagpasok bago ang pagsasalita, at ang πρός ay tumutukoy sa paglapit sa kinaroroonan niya. Ginamit ang pangalang Maria mula sa agarang konteksto upang maging malinaw at natural sa Tagalog.
- source_word: Χαῖρε
  choice: Binabati kita
  rationale: Bagaman literal na pautos na “magalak,” ginagamit dito ang salita bilang karaniwang pagbati. Ang “Binabati kita” ay malinaw at likas sa makabagong Tagalog, habang inilalagay sa talababa ang literal at tradisyonal na mga anyo.
- source_word: κεχαριτωμένη
  choice: ikaw na pinagkalooban ng biyaya
  rationale: Ang perfect passive participle ng χαριτόω ay naglalarawan kay Maria bilang tumanggap ng biyaya o pabor. Pinananatili ng salin ang pasibong diwa—ang biyaya ay ipinagkaloob sa kaniya—nang hindi ipinapalagay na likas itong nagmumula sa kaniya.
- source_word: ὁ κύριος
  choice: Ang Panginoon
  rationale: Karaniwang salin ng banal na titulong κύριος, na tumutukoy rito sa Diyos.
- source_word: μετὰ σοῦ
  choice: ay sumasaiyo
  rationale: Ang μετά na may genitive ay nangangahulugang “kasama.” Ang “sumasaiyo” ay isang likas at marangal na pormulang biblikal na nagpapahayag ng presensiya ng Panginoon.
theological_decisions:
- issue: Salin ng κεχαριτωμένη sa isang tekstong sensitibo sa teolohiya tungkol kay Maria
  choice: ikaw na pinagkalooban ng biyaya
  alternative: ikaw na lubos na kinalugdan; puspos ng biyaya
  rationale: 'Tinutumbasan nito ang pasibong puwersa ng pandiwa: si Maria ang tumanggap ng biyaya o pabor ng Diyos. Hindi nito ipinapasok sa pangunahing teksto ang mga doktrinal na pagpapakahulugang higit sa tahasang sinasabi ng Griyego, ngunit kinikilala sa talababa ang mahalagang tradisyonal na salin.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Iniwasan ang arkaikong “Aba” sa pangunahing teksto ngunit pinanatili ito sa talababa bilang tradisyonal na anyo. Ginamit ang “sumasaiyo” dahil pamilyar at dignipikado ito sa wikang biblikal nang hindi mahirap unawain.
