source:
  edition: SBLGNT
  text: καὶ ἰδοὺ Ἐλισάβετ ἡ ⸀συγγενίς σου καὶ αὐτὴ ⸀συνείληφεν υἱὸν ἐν γήρει αὐτῆς, καὶ οὗτος μὴν ἕκτος ἐστὶν αὐτῇ τῇ καλουμένῃ στείρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/036.yaml
  text: And look, Elizabeth your relative has also conceived a son in her old age, and this is the sixth month for her who was called barren.
translation:
  language: tl
  text: At tingnan mo, ang kamag-anak mong si Elisabet ay naglihi rin ng isang anak na lalaki sa kaniyang katandaan, at ikaanim na buwan na niya ngayon—siya na tinatawag na baog.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: tingnan mo
  rationale: Likas at tuwirang panawag-pansin sa makabagong Tagalog; pinananatili ang puwersa ng utos nang hindi gumagamit ng makalumang “narito.”
- source_word: συγγενίς
  choice: kamag-anak
  rationale: Hindi tiyak sa Griyego ang eksaktong antas ng pagkakamag-anak, kaya hindi ito nilimitahan sa “pinsan.”
- source_word: συνείληφεν
  choice: naglihi
  rationale: Karaniwang salitang Tagalog para sa paglilihi o pagkabuntis, at ang konteksto ay naglilinaw na anak na lalaki ang ipinaglihi.
- source_word: ἐν γήρει αὐτῆς
  choice: sa kaniyang katandaan
  rationale: Tapat sa pahayag tungkol sa matandang edad ni Elisabet at dignified sa kasalukuyang gamit.
- source_word: τῇ καλουμένῃ στείρᾳ
  choice: siya na tinatawag na baog
  rationale: Pinananatili ang diwa ng reputasyon o tawag sa kaniya, sa halip na sabihing simpleng likas na katangian lamang ito.
theological_decisions:
- issue: Eksaktong relasyon ni Elisabet kay Maria
  choice: kamag-anak
  alternative: pinsan
  rationale: Ang συγγενίς ay nagsasaad ng babaeng kamag-anak ngunit hindi nagbibigay ng tiyak na relasyon; iniiwasang dagdagan ang teksto.
- issue: Paglalarawan kay Elisabet bilang baog
  choice: tinatawag na baog
  alternative: itinuturing na baog
  rationale: Mas malapit ito sa καλουμένῃ at pinananatili ang tensiyon sa pagitan ng dating tawag sa kaniya at ng kasalukuyang paglilihi.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “tingnan mo” bilang buhay na panawag-pansin, “kamag-anak” upang mapanatili ang kawalang-tiyak ng ugnayan, at em dash upang malinaw na iugnay ang huling paglalarawan kay Elisabet.
