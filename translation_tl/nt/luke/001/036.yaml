  source_fidelity: 'Tapat ang salin sa Griyego: ang συγγενίς ay nananatiling hindi-tiyak na “kamag-anak”; ang συνείληφεν ay maayos na naipahayag sa “naglihi rin”; at ang “sa kaniyang katandaan” ay tumutugma sa ἐν γήρει αὐτῆς. Ang “ikaanim na buwan na niya ngayon” ay wastong nagpapahayag ng χρονological na diwa ng οὗτος μὴν ἕκτος ἐστὶν αὐτῇ. Ang “tinatawag na baog” ay pinananatili ang participial na paglalarawan ng καλουμένῃ nang hindi ipinipilit na ito ay isang kasalukuyang katotohanan.'
