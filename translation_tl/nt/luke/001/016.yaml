  text: And he will turn many of the sons of Israel to the Lord their God[a].
translation:
  language: tl
  text: At marami sa mga anak ni Israel ang ibabalik niya sa Panginoon na kanilang Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa Griyego, “mga anak ni Israel,” isang tradisyonal na pahayag para sa bayan ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinanatili ang pang-ugnay sa simula upang maipagpatuloy ang daloy mula sa naunang talata.
- source_word: πολλοὺς
  choice: ang marami
  rationale: Ginagamit ang pang-uri bilang pangngalan; likas at maikli sa Tagalog ang “ang marami” sa balangkas na ito.
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: sa mga anak ni Israel
  rationale: Pinananatili ang tradisyonal na pahayag ng tipan. Sa Tagalog, ang “mga anak” ay maaari ring tumukoy sa mga inapo nang hindi kinakailangang ipilit ang kasariang panlalaki sa natural na gamit.
- source_word: ἐπιστρέψει
  choice: ibabalik niya
  rationale: 'Ipinahahayag ang hinaharap at aktibong pantransitibong diwa: si Juan ang kasangkapang magbabalik sa marami, sa halip na sila lamang ang “babalik.”'
- source_word: ἐπὶ
  choice: sa
  rationale: Kasama ng ἐπιστρέφω, ipinahahayag nito ang tunguhin ng pagbabalik; natural sa Tagalog ang “ibabalik ... sa.”
- source_word: κύριον
  choice: Panginoon
  rationale: Tumutukoy dito sa Diyos ng Israel at taglay ang bigat ng tipan, hindi sa isang karaniwang amo.
- source_word: τὸν θεὸν αὐτῶν
  choice: na kanilang Diyos
  rationale: Nililinaw na ang “Panginoon” ay ang Diyos na kinikilala nilang kanila, habang pinananatili ang pariralang may kaugnayan sa tipan.
theological_decisions:
- issue: Pagpapahayag sa τῶν υἱῶν Ἰσραὴλ
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Ang “mga anak ni Israel” ay malapit sa anyo ng Griyego at nagpapanatili ng tradisyonal at intertekstuwal na pananalita ng tipan; inilalagay sa talababa ang mas tuwirang kolektibong kahulugan.
- issue: Tinutukoy ng κύριον τὸν θεὸν αὐτῶν
  choice: Panginoon na kanilang Diyos
  alternative: kanilang Panginoong Diyos
  rationale: 'Pinananatili ang appositional na pagkakakilanlan: ang Panginoon ang kanilang Diyos. Hindi ito tumutukoy sa isang taong panginoon o amo.'
- issue: Lakas ng sanhi sa ἐπιστρέψει
  choice: ibabalik niya
  alternative: papagbabalikin niya
  rationale: Ang “ibabalik niya” ay malinaw at natural na pantransitibo, ngunit hindi nito nilulutas nang higit sa teksto ang ugnayan ng gawain ni Juan at ng pagtugon ng mga tao.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang biblikal na pariralang “mga anak ni Israel,” samantalang ginawang natural ang pandiwang pantransitibo sa “ibabalik niya ... sa.”
