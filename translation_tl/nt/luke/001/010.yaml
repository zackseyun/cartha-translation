id: LUK.1.10
reference: Luke 1:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πᾶν τὸ πλῆθος ἦν τοῦ λαοῦ προσευχόμενον ἔξω τῇ ὥρᾳ τοῦ θυμιάματος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/010.yaml
  text: And the whole multitude of the people was praying outside at the hour of the incense offering[a].
translation:
  language: tl
  text: At ang buong karamihan ng mga tao ay nananalangin sa labas sa oras ng paghahandog ng insenso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa oras ng pagsusunog ng insenso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  choice: ang buong karamihan
  rationale: Pinananatili ng “buong karamihan” ang kolektibong diwa ng singular na πλῆθος at ang diin ng πᾶν sa kabuuan ng nagkakatipong pangkat.
- source_word: τοῦ λαοῦ
  choice: ng mga tao
  rationale: Likas sa modernong Tagalog ang “ng mga tao” at hindi nito idinaragdag ang “Israel,” na ipinahihiwatig ng konteksto ngunit hindi tahasang binabanggit.
- source_word: προσευχόμενον
  choice: ay nananalangin
  rationale: Ipinahahayag ng anyong ito kasama ng ἦν ang nagpapatuloy na kilos; sapat na ipinakikita ng kolektibong simuno ang sama-samang kalagayan nang hindi idinaragdag ang “magkakasama.”
- source_word: ἔξω
  choice: sa labas
  rationale: Tuwirang katumbas ito ng ἔξω at hindi nito nililimitahan ang kahulugan sa “labas ng santuwaryo,” bagaman iyon ang ipinahihiwatig ng konteksto.
- source_word: τῇ ὥρᾳ
  choice: sa oras
  rationale: Pinananatili ng “sa oras” ang diwa ng isang takdang panahon ng pagsamba at natural ito sa Filipino.
- source_word: τοῦ θυμιάματος
  choice: ng paghahandog ng insenso
  rationale: Sa konteksto ng templo, ang θυμίαμα ay tumutukoy sa ritwal na paggamit o paghahandog ng insenso; malinaw at marangal sa Filipino ang pariralang ito.
theological_decisions:
- issue: Terminong pangkulto sa templo para sa θυμίαμα
  choice: paghahandog ng insenso
  alternative: pagsusunog ng insenso
  rationale: Ipinakikita ng pangunahing salin ang konteksto ng ritwal na pagsamba nang hindi nagdaragdag ng doktrinang wala sa teksto. Inilalagay sa talababa ang mas literal na paglalarawan sa kilos.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Napanatili ang bahagyang pormal na tono na angkop sa salaysay tungkol sa pagsamba sa templo.
