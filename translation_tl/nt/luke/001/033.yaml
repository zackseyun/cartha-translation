id: LUK.1.33
reference: Luke 1:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ βασιλεύσει ἐπὶ τὸν οἶκον Ἰακὼβ εἰς τοὺς αἰῶνας, καὶ τῆς βασιλείας αὐτοῦ οὐκ ἔσται τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/033.yaml
  text: And he will reign over the house of Jacob forever[a], and of his kingdom there will be no end.
translation:
  language: tl
  text: At maghahari siya sa sambahayan ni Jacob magpakailanman[a], at hindi magwawakas ang kanyang kaharian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga kapanahunan” o “hanggang sa mga kapanahunan.” Ang idyomang Griyego na εἰς τοὺς αἰῶνας ay nagpapahayag ng walang-hanggang tagal.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεύσει
  choice: maghahari
  rationale: Ang panghinaharap na anyo ng βασιλεύω ay tumutukoy sa pamamahala bilang hari; likas at tuwiran itong ipinapahayag ng “maghahari” sa Filipino.
- source_word: ἐπὶ τὸν οἶκον Ἰακώβ
  choice: sa sambahayan ni Jacob
  rationale: Sa kayariang ito, ipinahihiwatig ng ἐπί ang saklaw ng paghahari. Pinananatili ng “sambahayan ni Jacob” ang tradisyonal at kolektibong pahayag nang hindi ito pinalalawak sa “Israel” o “bayan ng Diyos.”
- source_word: εἰς τοὺς αἰῶνας
  choice: magpakailanman
  rationale: Ang idyomang Griyego ay nagpapahayag ng walang-hanggang tagal; malinaw, marangal, at natural sa modernong Filipino ang “magpakailanman.”
- source_word: βασιλείας
  choice: kaharian
  rationale: Maaaring tumukoy ang βασιλεία sa paghahari o sa kaharian. Dito, ang “kaharian” ay natural na katambal ng pahayag na hindi ito magwawakas at pinananatili rin ang tunay na lawak ng kahulugan.
- source_word: οὐκ ἔσται τέλος
  choice: hindi magwawakas
  rationale: Natural na ipinahahayag nito sa Filipino ang mariing pagtanggi at panghinaharap na diwa ng Griyegong eksistensiyal na pahayag.
theological_decisions:
- issue: Saklaw ng “sambahayan ni Jacob”
  choice: Pinanatili bilang “sambahayan ni Jacob.”
  alternative: “bayan ng Israel” o “bayan ng Diyos”
  rationale: Hindi nililinaw ng talata rito kung paano iuugnay ang katawagang ito sa mas malawak na mga teolohikal na kategorya. Ang pagpapanatili sa mismong biblikal na pahayag ay umiiwas sa pagpasok ng interpretasyon sa pangunahing teksto.
- issue: Tagal ng paghahari
  choice: “magpakailanman” at “hindi magwawakas”
  alternative: “sa mga kapanahunan” o “hanggang sa mga kapanahunan”
  rationale: Ipinahahayag ng dalawang sugnay ang walang-hanggang paghahari at kaharian. Malinaw itong naihahatid ng napiling salin nang hindi pinapahina ang puwersa ng orihinal.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sambahayan ni Jacob” upang mapanatili ang biblikal at pangkalahatang diwa ng οἶκος, at iniwasan ang mas paliwanag na “angkan” o “bayan.”
