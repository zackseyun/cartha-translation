  yaml_path: translation/nt/luke/001/064.yaml
  text: And immediately his mouth was opened[a], and his tongue also, and he began speaking[b], blessing God.
translation:
  language: tl
  text: At agad na nabuksan ang kanyang bibig, pati ang kanyang dila,[a] at nagsimula siyang magsalita[b] at magpuri sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May mga salin na nagsasabing “at nakalag ang kanyang dila,” ngunit literal na sinasabi rito ng Griyego na “pati ang kanyang dila”; hayagan nitong ipinahihiwatig ang panunumbalik ng pagsasalita nang hindi idinaragdag ang salitang “nakalag.”
    reason: lexical_alternative
  - marker: b
    text: O “at nagsasalita siya.” Maaaring bigyang-diin ng pandiwang nasa imperfect ang nagpapatuloy na pagsasalita sa halip na ang pagsisimula nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῴχθη
  choice: nabuksan
  rationale: Pinananatili ang aorist passive ng ἀνοίγω at ang biglaang panunumbalik ng kakayahang magsalita nang hindi tahasang tinutukoy kung sino ang kumilos.
- source_word: δὲ
  choice: At
  rationale: Banayad na pang-ugnay ito na nagpapatuloy sa salaysay; natural sa Filipino ang “At” at hindi ito nagdaragdag ng di-kinakailangang pagsalungat.
- source_word: στόμα
  choice: bibig
  rationale: Tuwirang katumbas na angkop sa paglalarawan ng panunumbalik ng pagsasalita.
- source_word: παραχρῆμα
  choice: agad
  rationale: Malinaw at likas na ipinapahayag ang biglaan at kagyat na pangyayari.
- source_word: γλῶσσα
  choice: pati ang kanyang dila
  rationale: Hayagang binabanggit ng Griyego ang dila bilang karagdagan sa bibig. Iniiwasan nitong idagdag ang “nakalag,” na wala sa tekstong Griyego.
- source_word: ἐλάλει
  choice: nagsimula siyang magsalita
  rationale: Maaaring ipahiwatig ng imperfect ang nagpapatuloy na kilos o, sa kontekstong ito ng naunang pagkakapipi, ang pagsisimula ng pagsasalita. Ang “nagsimula” ay likas sa daloy ng salaysay, habang inilalahad sa talababa ang tunay na alternatibo.
- source_word: εὐλογῶν
  choice: magpuri
  rationale: Kapag Diyos ang layon, natural na ipinapahayag sa modernong Filipino ng “magpuri sa Diyos” ang pagkilala at mabuting pagsasalita tungkol sa Diyos; iniiwasan nito ang posibleng maling diwa ng “pagpapala sa Diyos.”
- source_word: τὸν θεόν
  choice: sa Diyos
  rationale: Likas na anyong Filipino para sa layon ng “magpuri,” na tumutukoy sa Diyos.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pati” upang maipakita ang elliptical na pag-uugnay ng “dila” sa “nabuksan” nang hindi nagpapasok ng salitang wala sa Griyego. Ang “magpuri sa Diyos” ay mas natural kaysa literal ngunit madaling mapagkamalang “pagpalain ang Diyos.”
