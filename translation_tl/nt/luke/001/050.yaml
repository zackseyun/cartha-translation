  yaml_path: translation/nt/luke/001/050.yaml
  text: And his mercy is for those who fear him from generation to generation[a][b][c].
translation:
  language: tl
  text: At ang kanyang awa ay para sa mga may takot sa kanya, sa sali’t salinlahi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hanggang sa mga salinlahi at mga salinlahi,” na nagpapahayag ng patuloy na awa sa sunod-sunod na mga salinlahi. Maaari ring isalin na “sa bawat salinlahi.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga may takot sa kanya” ay tumutukoy sa mga namumuhay na may mapitagang pagkatakot sa Diyos; maaari ring isalin na “mga gumagalang sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang pang-ugnay na nagdurugtong sa taludtod na ito sa naunang mga pahayag sa awit ni Maria.
- source_word: ἔλεος
  choice: awa
  rationale: Ang ἔλεος ay tumutukoy sa habag, kabutihan, o awa sa nangangailangan. Ang “awa” ang tuwiran, natural, at marangal na salin sa kontekstong ito nang hindi labis na nililimitahan ang kahulugan.
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: sa sali’t salinlahi
  rationale: Ipinahahayag ng parirala ang patuloy na pag-abot ng awa sa magkakasunod na mga salinlahi. Likas sa modernong Filipino ang “sa sali’t salinlahi” at napapanatili nito ang pangmatagalang diwa ng Griyego.
- source_word: τοῖς φοβουμένοις αὐτόν
  choice: para sa mga may takot sa kanya
  rationale: Ipinakikita ng datibo ang mga tumatanggap o nakikinabang sa awa. Pinananatili ng “may takot sa kanya” ang biblikal na bigat ng φοβέομαι, na sa pagtukoy sa Diyos ay maaaring mangahulugan ng mapitagang pagkatakot, hindi lamang pagkasindak.
- source_word: αὐτοῦ / αὐτόν
  choice: kanyang / kanya
  rationale: Ang dalawang panghalip ay kapuwa tumutukoy sa Diyos ayon sa konteksto. Hindi na dinagdagan ng pangngalang “Diyos” upang mapanatili ang anyo at daloy ng pinagmulan.
theological_decisions:
- issue: Kahulugan ng pagkatakot kapag Diyos ang tinutukoy
  choice: mga may takot sa kanya
  alternative: mga gumagalang sa kanya
  rationale: Maaaring saklawin ng φοβέομαι ang mapitagang takot at maka-Diyos na paggalang. Ang pangunahing salin ay nagpapanatili sa biblikal na idyoma at sa tensiyon ng kahulugan, samantalang nililinaw ng talababa na hindi lamang sindak ang tinutukoy.
- issue: Ugnayan ng awa sa mga salinlahi at sa mga may takot sa Diyos
  choice: Inuna ang mga tumatanggap—“para sa mga may takot sa kanya”—at isinunod ang tagal—“sa sali’t salinlahi.”
  alternative: Ang kanyang awa sa sali’t salinlahi ay para sa mga may takot sa kanya.
  rationale: Parehong maaaring iugnay sa “awa” ang pariralang tumutukoy sa mga salinlahi at ang datibong tumutukoy sa mga tumatanggap. Ang ayos sa pangunahing teksto ay mas natural sa Filipino at hindi binabago ang saklaw ng pahayag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sali’t salinlahi” bilang likas na idyoma, at pinanatili ang “may takot sa kanya” upang hindi mapawi ang biblikal at teolohikal na bigat ng pahayag.
