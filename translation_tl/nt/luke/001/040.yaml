base_translation:
  language: en
  yaml_path: translation/nt/luke/001/040.yaml
  text: and entered the house of Zechariah and greeted Elizabeth[a][b].
translation:
  language: tl
  text: Pumasok siya sa bahay ni Zacarias at binati si Elisabet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: Pumasok siya
  rationale: Ang aorist na εἰσῆλθεν ay tuwirang nagsasaad ng pagpasok. Idinagdag ang likas na panghalip na “siya” sa Filipino upang maging malinaw at maayos ang pangungusap nang hindi tinutukoy muli ang pangalang Maria.
- source_word: οἶκον
  choice: bahay
  rationale: Sa pariralang εἰς τὸν οἶκον, pisikal na tirahan ang tinutukoy; “bahay” ang pinakatumpak at karaniwang salin.
- source_word: Ζαχαρίου
  choice: Zacarias
  rationale: Ginamit ang anyong pangalang pamilyar sa tradisyong Tagalog at malinaw na tumutukoy sa may-ari ng bahay.
- source_word: ἠσπάσατο
  choice: binati
  rationale: Ang ἀσπάζομαι ay nangangahulugang bumati o magbigay ng pagbati. Ang “binati” ay natural at hindi nagdaragdag ng antas ng init o seremonya na wala sa Griyego.
- source_word: Ἐλισάβετ
  choice: Elisabet
  rationale: Ginamit ang malinaw at pamilyar na anyong Filipino ng pangalan.
- source_word: καὶ
  choice: at
  rationale: Ang ikalawang καί ay payak na nag-uugnay sa magkasunod na kilos. Ang unang καί ay hindi isinama bilang panimulang “at” dahil mas natural sa Filipino ang pagsisimula sa pandiwa, habang nananatili ang daloy ng salaysay sa konteksto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak, marangal, at madaling maunawaan. Pinanatili ang tuwirang pagkakasunod ng dalawang kilos at iniwasang dagdagan ang kahulugan ng pagbati.
