base_translation:
  language: en
  yaml_path: translation/nt/luke/001/056.yaml
  text: And Mary stayed with her about three months[a], and returned to her home.
translation:
  language: tl
  text: Nanatili si Maria kasama niya nang mga tatlong buwan, at bumalik siya sa kanyang tahanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔμεινεν
  choice: Nanatili
  rationale: Ipinahihiwatig ng aorist ng μένω ang pananatili sa isang lugar sa loob ng isang takdang panahon; natural at marangal ang “nanatili” sa salaysay.
- source_word: δὲ
  choice: at pagkatapos ay
  rationale: Banayad na pang-ugnay ang δέ. Sa Filipino, ang “at pagkatapos ay” ay malinaw na nag-uugnay sa pananatili ni Maria at sa sumunod niyang pag-uwi nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Bibliyang Tagalog.
- source_word: σὺν αὐτῇ
  choice: kasama niya
  rationale: Ang σύν na may datibo ay nagsasaad ng pakikisama. Pinananatili ng “niya” ang panghalip ng Griyego; si Elisabet ang tinutukoy ayon sa konteksto.
- source_word: ὡς μῆνας τρεῖς
  choice: nang mga tatlong buwan
  rationale: Kapag nauuna sa sukat ng panahon, ang ὡς ay karaniwang nagpapahiwatig ng pagtatantiya. Likas sa modernong Filipino ang “mga tatlong buwan.”
- source_word: ὑπέστρεψεν
  choice: umuwi na siya
  rationale: Ang ὑποστρέφω ay tumutukoy sa pagbabalik sa dating lugar. Dahil ang patutunguhan ay sarili niyang tahanan, idiomatiko at tumpak ang “umuwi”; ipinapakita ng “na” ang pagsunod ng pangyayaring ito sa kanyang pananatili.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: umuwi
  rationale: Ang εἰς τὸν οἶκον αὐτῆς ay literal na “sa kanyang bahay/tahanan.” Likas na isinama ang patutunguhan sa pandiwang Filipino na “umuwi,” nang hindi inililipat ang kahulugan sa sambahayan bilang pangkat ng mga tao.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak, dignified, at angkop sa salaysay. Hindi na nilagyan ng talababa ang pagtatantiya sapagkat tahasang naipahahayag na ito ng “mga tatlong buwan.”
