  source_fidelity: 'Tumpak ang pangunahing diwa ng draft: nanatili si Maria kasama ni Elisabet nang humigit-kumulang tatlong buwan at saka bumalik sa sariling tahanan. Gayunman, ang "at pagkatapos ay" ay mas tiyak na panandang sunod-sunod sa panahon kaysa sa banayad na pang-ugnay na δέ, at ang "na" sa "umuwi na siya" ay hindi kailangan sa Griyego. Ang "bumalik ... sa kanyang tahanan" ay mas malinaw na isinasalin ang ὑπέστρεψεν εἰς τὸν οἶκον αὐτῆς.'
