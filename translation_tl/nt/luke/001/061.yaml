translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kamag-anak” sa pangunahing teksto upang panatilihin ang tiyak na diwa ng ugnayang dugo o angkan; inilagay sa talababa ang mas malawak at mas idiomatikong “pamilya.”
