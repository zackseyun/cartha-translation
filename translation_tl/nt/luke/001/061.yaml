  text: καὶ εἶπαν πρὸς αὐτὴν ὅτι Οὐδείς ἐστιν ⸂ἐκ τῆς συγγενείας⸃ σου ὃς καλεῖται τῷ ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/061.yaml
  text: And they said to her[a], “None of your relatives is called by this name.”
translation:
  language: tl
  text: Sinabi nila sa kanya, “Wala ni isa sa mga kamag-anak mo ang may pangalang ito.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Wala sa pamilya mo ang may ganitong pangalan.”
    reason: Ipinapakita ang likas na alternatibong salin ng συγγένεια at ng pariralang καλεῖται τῷ ὀνόματι τούτῳ nang hindi binabago ang diwa.
lexical_decisions:
- source_word: εἶπαν πρὸς αὐτὴν
  choice: Sinabi nila sa kanya
  rationale: Likas na salaysay sa Filipino ang “sinabi nila,” at ang “sa kanya” ang karaniwang katumbas ng πρός + accusative kapag tinutukoy ang taong kinakausap.
- source_word: Οὐδείς ἐστιν ἐκ τῆς συγγενείας σου
  choice: Wala ni isa sa mga kamag-anak mo
  rationale: Malinaw na ipinapahayag ng “wala ni isa” ang ganap na pagkakaila ng Οὐδείς, habang ang “mga kamag-anak” ay tuwirang tumutukoy sa συγγένεια bilang angkan o mga kaanak.
- source_word: ὃς καλεῖται
  choice: ang tinatawag
  rationale: Pinananatili ng “tinatawag” ang passive na anyo ng καλεῖται at likas itong gamitin kaugnay ng pangalan.
- source_word: τῷ ὀνόματι τούτῳ
  choice: sa pangalang ito
  rationale: Tumutukoy ang “ito” sa pangalang Juan na kababanggit lamang at malinaw na sinasalamin ang demonstrative na τούτῳ.
