  source_fidelity: Tumpak na isinasalin ng “kaligtasan” ang σωτηρίαν nang hindi isinasara ang saklaw nito sa pisikal o espirituwal na pagliligtas lamang. Ang “mula sa ating mga kaaway” ay wasto para sa ἐξ ἐχθρῶν ἡμῶν, at ang “mula sa kamay ng lahat ng napopoot sa atin” ay pinananatili ang idyomatikong ἐκ χειρὸς at ang saklaw ng πάντων τῶν μισούντων ἡμᾶς.
