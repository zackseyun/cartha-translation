  text: σωτηρίαν ἐξ ἐχθρῶν ἡμῶν καὶ ἐκ χειρὸς πάντων τῶν μισούντων ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/071.yaml
  text: salvation from our enemies and from the hand of all who hate us,[a]
translation:
  language: tl
  text: kaligtasan mula sa ating mga kaaway at mula sa kamay ng lahat ng napopoot sa atin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagliligtas mula sa ating mga kaaway at mula sa kapangyarihan ng lahat ng napopoot sa atin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σωτηρίαν
  choice: kaligtasan
  rationale: Pinananatili ng “kaligtasan” ang bigat na teolohikal ng salita sa awit ni Zacarias, habang saklaw pa rin ang kongkretong pagliligtas mula sa mga kaaway.
- source_word: ἐξ ἐχθρῶν ἡμῶν
  choice: mula sa ating mga kaaway
  rationale: Likas na ipinapahayag ng “mula sa” ang paghihiwalay o paglaya; hindi kailangang idagdag sa pangunahing teksto ang ideya ng kapangyarihan, na hindi tahasang nasa pariralang ito.
- source_word: ἐκ χειρὸς
  choice: mula sa kamay ng
  rationale: Pinananatili ang biblikal na idyoma ng kamay bilang kapangyarihan o kontrol at malinaw pa rin ito sa karaniwang mambabasang Filipino.
- source_word: πάντων τῶν μισούντων ἡμᾶς
  choice: lahat ng napopoot sa atin
  rationale: Natural na Tagalog ito para sa substantibong participle at ipinahihiwatig ang nagpapatuloy o nakaugaliang pagkapoot.
- source_word: καὶ
  choice: at
  rationale: Tuwirang pinag-uugnay ng “at” ang dalawang pariralang nagsasaad kung saan nagmumula ang pagliligtas.
theological_decisions:
- issue: Kalikasan ng ipinangakong kaligtasan sa propesiya ni Zacarias
  choice: Gamitin ang “kaligtasan” habang pinananatili ang tahasang paglaya mula sa mga kaaway.
  alternative: “Pagliligtas,” na maaaring higit na idiin ang kongkretong pagsagip.
  rationale: Binabanggit mismo ng talata ang mga kaaway at mga napopoot, ngunit sa Lucas 1 ay may mas malawak ding redemptibong diwa ang kaligtasan. Hindi nililimitahan ng salin ang kahulugan sa pulitikal lamang o espirituwal lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang biblikal na idyomang “mula sa kamay” sa pangunahing teksto, at ipinaliwanag ang diwa nitong “kapangyarihan” sa talababa.
