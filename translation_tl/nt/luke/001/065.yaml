reference: Luke 1:65
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐπὶ πάντας φόβος τοὺς περιοικοῦντας αὐτούς, καὶ ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας διελαλεῖτο πάντα τὰ ῥήματα ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/065.yaml
  text: And fear came upon all those living around them[b][a], and throughout all the hill country of Judea all these things were being talked about.
translation:
  language: tl
  text: At ang lahat ng nakatira sa paligid nila ay natakot[a], at sa buong maburol na lupain ng Judea ay pinag-uusapan ang lahat ng bagay na ito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “takot” dito ay maaari ring may diwa ng pagkamangha o pagpipitagan dahil sa hayag na pagkilos ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: O “lahat ng salitang ito” o “lahat ng pangyayaring ito.” Ang salitang Griyego ay maaaring tumukoy sa mga salitang sinabi o sa mga pangyayaring pinag-uusapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐπὶ πάντας ... φόβος
  choice: natakot ang lahat
  rationale: Likas sa modernong Tagalog ang pandiwang anyo at malinaw nitong ipinahahayag ang pagdating ng takot sa lahat, nang hindi isinasalin nang kahoy ang ἐγένετο.
- source_word: φόβος
  choice: takot
  rationale: Ito ang tuwirang katumbas at pinananatili ang posibilidad na kabilang dito ang paghanga o pagpipitagan dahil sa hayag na pagkilos ng Diyos.
- source_word: τοὺς περιοικοῦντας αὐτούς
  choice: ang lahat ng nakatira sa paligid nila
  rationale: Malapit ito sa diwa ng περιοικέω at hindi nililimitahan ang tinutukoy sa mas makitid na konsepto ng mga kapitbahay lamang.
- source_word: ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας
  choice: sa buong bulubunduking lupain ng Judea
  rationale: Ipinahahayag nito ang mataas o maburol na rehiyon at ang lawak na sakop ng talakayan.
- source_word: διελαλεῖτο
  choice: pinag-usapan
  rationale: Ang anyong ito ay natural sa Tagalog at naghahayag na ang balita ay patuloy na pinag-uusapan sa maraming lugar.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: ang lahat ng pangyayaring ito
  rationale: Sa konteksto, ang ῥήματα ay maaaring tumukoy sa mga salita o sa mga bagay na nangyari at ikinuwento. Ang 'pangyayari' ay natural sa salaysay, habang inilalahad sa talababa ang tunay na lawak ng termino.
theological_decisions:
- issue: Saklaw ng φόβος bilang tugon sa pagkilos ng Diyos
  choice: takot
  alternative: pagkamangha o pagpipitagan
  rationale: Pinananatili ng 'takot' ang tuwirang leksikal na diwa at hindi nilulutas ang tensiyon kung ito ay pangamba, pagkamangha, pagpipitagan, o magkakahalong tugon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang likas na pandiwang 'natakot' sa halip na ang mas kahoy na 'dumating ang takot,' at pinanatili sa mga talababa ang mga leksikal na ambiguwidad.
