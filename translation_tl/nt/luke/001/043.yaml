    issue: Ang “dumalaw” ay mas tiyak kaysa sa ἔλθῃ.
    rationale: Ang ἔλθῃ ay simpleng “dumating” o “pumunta.” Maaaring tumukoy ang “dumalaw” sa isang uri ng sosyal na pagbisita, samantalang hindi iyon tahasang isinasaad ng teksto.
  - severity: medium
    issue: 'Hindi malinaw ang kasalukuyang literal na anyo sa talababa: “saan nanggaling sa akin ito.”'
    rationale: Sa modernong Tagalog, maaari itong mangahulugang si Elisabet ang pinagmulan ng “ito,” taliwas sa datibong μοι na tumutukoy sa tumatanggap. Mas mabuting ipaliwanag ang idyoma sa paraang natural ngunit hindi inaangking eksaktong literal ang Tagalog na ayos.
