  source_fidelity: Ang pangunahing diwa—pagkamangha ni Elisabet sa pagpunta sa kaniya ng ina ng kaniyang Panginoon—ay tapat sa Griyego. Gayunman, ang “dumalaw” ay maaaring magdagdag ng partikular na nuwang sosyal ng pagbisita na wala sa ἔλθῃ; mas tuwiran ang “pumunta.” Ang “karangalang ito” ay isang katanggap-tanggap na paglalahad ng ipinahihiwatig na pribilehiyo sa idyoma, ngunit dapat manatiling malinaw na ito ay idyomatiko, hindi isang tahasang pangngalan sa Griyego.
  naturalness: Marangal at malinaw ang rehistro. Mas natural at mas malapit sa saklaw ng pandiwang Griyego ang “pumunta sa akin” kaysa “dumalaw sa akin.” Ang binagong talababa ay umiiwas sa maling direksiyong maaaring ipahiwatig ng “saan nanggaling sa akin ito.”
  terminology: Wasto at angkop ang “ina ng aking Panginoon” para sa ἡ μήτηρ τοῦ κυρίου μου. Pinananatili nito ang mapitagang titulo na “Panginoon” nang walang dagdag na doktrinal na pagpapaliwanag.
