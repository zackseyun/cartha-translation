translation:
  language: tl
  text: At bakit ipinagkaloob sa akin ang karangalang ito[a], na pumunta sa akin ang ina ng aking Panginoon?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas malapit sa literal: “At paano nangyari sa akin ito...?” Ang Griyegong idyoma ay nagpapahayag ng pagkamangha sa pagtanggap ng gayong karangalan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόθεν μοι τοῦτο
  choice: bakit ipinagkaloob sa akin ang karangalang ito
  rationale: Ang literal na anyong “saan nanggaling sa akin ito” ay isang idyomatikong pahayag ng pagtataka sa di-inaasahang karangalan. Ginawang natural sa modernong Tagalog habang pinananatili ang diwa ng pagkamangha.
- source_word: ἵνα ἔλθῃ
  choice: na dumalaw
  rationale: Ipinakikilala ng ἵνα ang pangyayaring ikinamangha ni Elisabet. Sa kontekstong pagpunta ng isang tao sa kaniya, likas sa Tagalog ang “dumalaw,” bagaman literal itong “pumarito.”
- source_word: ἡ μήτηρ τοῦ κυρίου μου
  choice: ang ina ng aking Panginoon
  rationale: Tuwirang pinananatili ang ugnayang genitibo at ang marangal at kristolohikal na bigat ng κύριος bilang “Panginoon,” nang hindi nagdaragdag ng doktrinang wala sa talata.
- source_word: πρὸς ἐμέ
  choice: sa akin
  rationale: Ipinahahayag ang paglapit o pagpunta kay Elisabet nang hindi dinaragdagan ng “sa aking bahay,” na hindi tahasang nasa Griyego.
theological_decisions:
- issue: Pagsasalin ng κυρίου sa pariralang ἡ μήτηρ τοῦ κυρίου μου
  choice: aking Panginoon
  alternative: aking panginoon o amo
  rationale: Pinananatili ng “Panginoon” ang mapitagang bigat ng titulo at hinahayaang manatili ang kristolohikal na puwersa ng pahayag ni Elisabet, nang hindi nagpapasok ng mas huling pormulasyong doktrinal.
- issue: Kung literal o idyomatiko ang πόθεν μοι τοῦτο
  choice: bakit ipinagkaloob sa akin ang karangalang ito
  alternative: saan nanggaling sa akin ito
  rationale: Magiging malabo at di-likas sa modernong Tagalog ang lubhang literal na anyo. Ipinapahayag ng napiling salin ang ipinahihiwatig na di-inaasahang pribilehiyo at ang pagtataka ni Elisabet.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinagkaloob” upang maipakita ang di-inaasahang pribilehiyo, at “dumalaw” bilang likas na paglalarawan sa pagpunta ni Maria kay Elisabet.
