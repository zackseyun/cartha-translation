  text: that[a], having been rescued from the hand of our enemies[c][b], we might serve him without fear
translation:
  language: tl
  text: upang tayo’y makapaglingkod sa kanya[b] nang walang takot,[c] matapos tayong mailigtas mula sa kamay ng mga kaaway.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa kapangyarihan ng mga kaaway.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ding isaling “makasamba tayo sa kanya”; ang salitang Griyego ay tumutukoy sa paglilingkod na iniuukol sa Diyos at kadalasa’y may diwa ng pagsamba.
    reason: lexical_alternative
  - marker: c
    text: O “buong tapang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφόβως
  choice: nang walang takot
  rationale: Likas at malinaw na katumbas ng pang-abay na nangangahulugang “walang takot” o “buong tapang.” Iniuugnay ito sa paglilingkod, gaya ng pinakanaaangkop sa balangkas ng sugnay.
- source_word: ἐκ χειρὸς
  choice: mula sa kamay ng
  rationale: Pinananatili ang biblikal na larawang tumutukoy sa pagliligtas mula sa kapangyarihan o kontrol ng isang kaaway, at nauunawaan pa rin ito sa makabagong Filipino.
- source_word: ἐχθρῶν
  choice: mga kaaway
  rationale: Walang tahasang panghalip na paari sa tekstong Griyego. Hindi idinagdag ang “ating,” sapagkat malinaw na sa “tayong iligtas” kung kaninong mga kaaway ang tinutukoy.
- source_word: ῥυσθέντας
  choice: matapos tayong iligtas
  rationale: Ipinahahayag ang aorist passive participle bilang isang pagliligtas na nauuna at nagsisilbing saligan ng kasunod na paglilingkod.
- source_word: λατρεύειν
  choice: makapaglingkod
  rationale: Saklaw ng salita ang paglilingkod na iniuukol sa Diyos at maaari ring tumukoy sa pagsamba. Ang “makapaglingkod” ay nagpapanatili sa mas malawak na diwa ng debosyon at pagsunod.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Tumutukoy ang panghalip sa Diyos sa naunang konteksto; natural sa Filipino ang “maglingkod sa kanya.”
theological_decisions:
- issue: Saklaw ng λατρεύειν kapag ang Diyos ang pinaglilingkuran
  choice: makapaglingkod tayo sa kanya
  alternative: makasamba tayo sa kanya
  rationale: Maaaring tumukoy ang salita sa pagsambang paglilingkod sa Diyos. Pinananatili ng “maglingkod” ang parehong debosyon at pagsunod nang hindi nililimitahan ang kahulugan sa gawaing liturhikal lamang.
- issue: Kaugnayan ng ἀφόβως sa sugnay
  choice: iniuugnay ang “nang walang takot” sa paglilingkod
  alternative: ilagay ito bago ang pariralang “matapos tayong iligtas,” ayon sa ayos ng mga salitang Griyego
  rationale: Bagaman nasa unahan ang pang-abay sa Griyego, pinakanatural na nauugnay ito sa pawatas na “maglingkod.” Ang hulihang puwesto sa Filipino ay malinaw at hindi nagpapahiwatig na ang pagliligtas, sa halip na ang paglilingkod, ang ginaganap nang walang takot.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang larawang “mula sa kamay” ngunit ipinaliwanag ang idyomatikong kahulugan sa talababa. Hindi idinagdag ang “ating” bago ang “mga kaaway” dahil wala ito sa tekstong Griyego at sapat nang ipinahihiwatig ng “tayong iligtas.”
