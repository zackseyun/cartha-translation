id: LUK.1.26
reference: Luke 1:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ ἀπεστάλη ὁ ἄγγελος Γαβριὴλ ⸀ἀπὸ τοῦ θεοῦ εἰς πόλιν τῆς Γαλιλαίας ᾗ ὄνομα Ναζαρὲθ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/026.yaml
  text: In the sixth month[a], the angel Gabriel was sent from God to a city of Galilee named Nazareth[b],
translation:
  language: tl
  text: Sa ikaanim na buwan[a], isinugo mula sa Diyos ang anghel na si Gabriel sa isang bayan sa Galilea na tinatawag na Nazaret[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, ang ikaanim na buwan ng pagbubuntis ni Elisabet; tingnan ang Lucas 1:24, 36.
    reason: cross_reference
  - marker: b
    text: 'Maaari ring: “sa isang bayan ng Galilea na ang pangalan ay Nazaret.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ
  choice: Sa ikaanim na buwan
  rationale: Likas na pahayag ito ng panahon sa Filipino. Hindi tahasang isinalin ang mahinang pang-ugnay na δέ sapagkat sapat na ipinakikita ng ayos ng salaysay ang pagpapatuloy.
- source_word: ἀπεστάλη
  choice: isinugo
  rationale: Pinananatili ang tinig na balintiyak at ang diwa ng pagpapadala na may atas o layunin.
- source_word: ὁ ἄγγελος Γαβριὴλ
  choice: ang anghel na si Gabriel
  rationale: Sa konteksto, ang ἄγγελος ay makalangit na anghel, at ginagamit ang karaniwang anyong Filipino ng pangalang Gabriel.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: mula sa Diyos
  rationale: Pinananatili ang diin ng ἀπό sa pinagmulan; hindi ito ginawang “ng Diyos,” na mas tahasang magpapahayag ng gumagawa.
- source_word: εἰς πόλιν τῆς Γαλιλαίας
  choice: sa isang bayan sa Galilea
  rationale: Ang εἰς ay nagsasaad ng patutunguhan. Maaaring tumukoy ang πόλις sa isang bayan o lungsod; ang “bayan” ay natural at angkop sa Nazaret, habang ang genitibong τῆς Γαλιλαίας ay idyomatikong isinaling “sa Galilea.”
- source_word: ᾗ ὄνομα Ναζαρὲθ
  choice: na tinatawag na Nazaret
  rationale: Natural at maikli itong katumbas ng literal na “na ang pangalan ay Nazaret,” nang hindi binabago ang kahulugan.
theological_decisions:
- issue: Tinutukoy ng “ikaanim na buwan”
  choice: Pinanatili sa pangunahing teksto bilang “ikaanim na buwan,” at ipinaliwanag lamang sa talababa na tumutukoy ito sa pagbubuntis ni Elisabet.
  alternative: 'Tahasan sa teksto: “Sa ikaanim na buwan ng pagbubuntis ni Elisabet.”'
  rationale: Ipinahihiwatig ng konteksto sa Lucas 1:24 at 1:36 ang tinutukoy, ngunit hindi ito muling sinasabi ng Griyegong teksto sa talatang ito; kaya hindi idinagdag ang paliwanag sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “isinugo mula sa Diyos” upang mapanatili ang balintiyak na anyo at ang diin sa pinagmulan, at “bayan” bilang natural na saklaw ng πόλις para sa Nazaret.
