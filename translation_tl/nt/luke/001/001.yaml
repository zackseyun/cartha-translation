  text: Ἐπειδήπερ πολλοὶ ἐπεχείρησαν ἀνατάξασθαι διήγησιν περὶ τῶν πεπληροφορημένων ἐν ἡμῖν πραγμάτων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/001.yaml
  text: Since many have undertaken to compile an account concerning the matters that have been fulfilled among us,[a]
translation:
  language: tl
  text: Yamang marami na ang nagsikap na bumuo ng isang salaysay tungkol sa mga pangyayaring natupad sa gitna natin,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naisakatuparan”; o “lubos na natiyak sa gitna natin.”
    reason: 'Pinananatili ang mga posibleng kahulugan ng πεπληροφορημένων: katuparan o pagsasakatuparan, at ganap na katiyakan o pagpapatibay.'
lexical_decisions:
- source_word: Ἐπειδήπερ
  choice: Yamang
  rationale: Ipinakikilala nito ang pormal na paunang pahayag ni Lucas at ang batayang dahilan para sa susunod niyang sasabihin. Likas at marangal sa Filipino ang “Yamang.”
- source_word: πολλοὶ
  choice: marami
  rationale: Tuwirang pinananatili ang di-tiyak ngunit malaking bilang nang hindi nagdaragdag ng “iba” o tinutukoy kung sino sila.
- source_word: ἐπεχείρησαν
  choice: nagsikap
  rationale: Ipinahihiwatig ang pagsasagawa ng isang seryosong gawain nang hindi ipinapalagay na nabigo sila, bagaman maaari rin itong mangahulugang “nagtangka.”
- source_word: ἀνατάξασθαι
  choice: na bumuo
  rationale: Sa kontekstong pampanitikan, tumutukoy ito sa pag-aayos at pagsulat ng isang salaysay. Natural sa modernong Filipino ang “bumuo” at hindi labis na teknikal.
- source_word: διήγησιν
  choice: ng isang salaysay
  rationale: Pinananatili ang diwa ng organisadong pasalaysay na paglalahad at ang pormal na tono ng pambungad.
- source_word: περὶ
  choice: tungkol sa
  rationale: Karaniwan, malinaw, at angkop sa marangal na modernong Filipino.
- source_word: τῶν πεπληροφορημένων
  choice: na natupad
  rationale: Ang ganap na aspektong balintiyak na pandiwari ay malamang na tumutukoy sa mga bagay na naisakatuparan o dinala sa katuparan. Pinananatili ng “natupad” ang mahalagang diwang ito, habang inilalahad sa talababa ang ibang posibleng pakahulugan.
- source_word: ἐν ἡμῖν
  choice: sa gitna natin
  rationale: Ipinahihiwatig ang mga pangyayaring naganap sa kanilang kalipunan o karanasan nang hindi ipinapalagay na ang “natin” ay tumutukoy lamang sa isang tiyak na pangkat.
- source_word: πραγμάτων
  choice: mga pangyayari
  rationale: Sa konteksto ng salaysay, mas natural sa Filipino ang “mga pangyayari” kaysa “mga bagay” o “mga usapin,” habang nananatiling nakatuon sa mga gawa at kaganapang isasalaysay.
theological_decisions:
- issue: Kahulugan ng πεπληροφορημένων sa pormal na pambungad ni Lucas
  choice: natupad
  alternative: naisakatuparan; lubos na natiyak
  rationale: Kasama ng πραγμάτων, malamang na tumutukoy ito sa mga pangyayaring naisakatuparan o umabot sa katuparan. Gayunman, maaari ring dalhin ng pandiwa ang diwa ng lubos na katiyakan o pagpapatibay, kaya pinananatili ang tunay na leksikal na kalabuan sa talababa.
translation_notes:
  register: Pormal ngunit malinaw na modernong Filipino, na angkop sa marangal na pambungad ng isang sinaunang salaysay. Pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa mga kasunod na talata.
