  source_fidelity: 'Tapat ang salin sa Griyego: ang «Yamang» ay maayos na pambungad na nagbibigay ng sanhi/batayan; naipapahayag ng «marami na ang nagsikap na bumuo» ang ἐπεχείρησαν ἀνατάξασθαι nang hindi nagpapahiwatig ng kabiguan; at ang «isang salaysay tungkol sa mga pangyayaring natupad sa gitna natin» ay maingat na tumutugon sa διήγησιν περὶ τῶν πεπληροφορημένων ἐν ἡμῖν πραγμάτων. Napananatili rin ang nakabiting estruktura ng pangungusap sa pamamagitan ng kuwit.'
