  register: Modernong Filipino na malinaw at marangal. Pinili ang “binabalak nilang pangalanan” upang natural na maipakita ang aspektong di-pa-ganap o tinatangka ng ἐκάλουν, sa halip na magmukhang pinal na ang pangalang ibinigay.
