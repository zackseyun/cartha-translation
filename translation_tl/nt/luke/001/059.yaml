base_translation:
  language: en
  yaml_path: translation/nt/luke/001/059.yaml
  text: And it happened that on the eighth day they came to circumcise the child[a], and they were calling him Zechariah[b], after the name of his father.
translation:
  language: tl
  text: Noong ikawalong araw, dumating sila upang tuliin ang sanggol, at pinapangalanan nila siyang Zacarias[a], ayon sa pangalan ng kanyang ama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “at tinatawag nila siyang Zacarias.” Maaaring ipahiwatig ng anyong imperfect sa Griyego na nagaganap o tinatangka pa lamang ang pagpapangalan, na umaangkop sa pagtutuwid sa kasunod na talata.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “tinatawag nila siya ayon sa pangalan ng kanyang ama, na Zacarias,” na tumutukoy sa kaugaliang ipangalan ang isang bata sa kapamilya.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Nang
  rationale: Sa daloy ng salaysay, natural na ipinakikilala ng “Nang” ang sumunod na pangyayari at oras nang hindi gumagamit ng makalumang “At nangyari.”
- source_word: ἐν τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: ikawalong araw
  rationale: Tuwirang ipinahahayag ang tiyak na panahon sa natural na Tagalog.
- source_word: ἦλθον
  choice: dumating sila
  rationale: Pinananatili ang di-tiyak na maramihang simuno ng Griyego nang hindi tinutukoy kung sinu-sino sila.
- source_word: περιτεμεῖν
  choice: upang tuliin
  rationale: Malinaw na ipinahahayag ang layunin ng kanilang pagdating.
- source_word: τὸ παιδίον
  choice: ang sanggol
  rationale: Bagaman maaaring isaling “bata,” ang konteksto ng ikawalong araw matapos ipanganak ay ginagawang natural at tumpak ang “sanggol.”
- source_word: ἐκάλουν
  choice: binabalak nilang pangalanan
  rationale: Ipinahihiwatig ng imperfect ang isinasagawa o tangkang pagpapangalan, na hindi pa pinal sapagkat tututulan ito sa kasunod na talata.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ
  choice: gaya ng pangalan ng kanyang ama
  rationale: Natural na ipinapahayag sa Tagalog ang diwang ipapangalan ang bata sa kanyang ama, habang nililinaw ang kaugalian.
- source_word: Ζαχαρίαν
  choice: Zacarias
  rationale: Ginamit ang pamilyar at tradisyonal na anyo ng pangalang ito sa Bibliyang Tagalog.
