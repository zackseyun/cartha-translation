  text: at nagbangon siya para sa atin ng isang sungay ng kaligtasan sa sambahayan ng kanyang lingkod na si David,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang makapangyarihang Tagapagligtas.” Sa literal, “isang sungay ng kaligtasan,” isang larawang biblikal para sa makapangyarihang pagliligtas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν
  choice: nagbangon
  rationale: Pinananatili ang biblikal na idyoma ng Diyos na nagbabangon o nagpapalitaw ng tagapagligtas; ang payak na aspektong naganap ay angkop sa konteksto ng propetikong papuri.
- source_word: κέρας σωτηρίας
  choice: isang sungay ng kaligtasan
  rationale: Pinananatili ang kongkretong talinghagang biblikal para sa makapangyarihan at matagumpay na pagliligtas, pati ang anyong henitibo ng parirala.
- source_word: ἡμῖν
  choice: para sa atin
  rationale: 'Ipinahahayag ang datibo ng kapakinabangan: ang pagliligtas ay ibinangon alang-alang sa atin.'
- source_word: ἐν οἴκῳ Δαυὶδ
  choice: sa sambahayan ni David
  rationale: Ang 'sambahayan' ay natural na tumutukoy sa angkan o dinastiya at pinananatili ang Davidikong alusyon ng 'bahay.'
- source_word: παιδὸς αὐτοῦ
  choice: na kanyang lingkod
  rationale: Sa pagtukoy kay David, ang παῖς ay may diwang 'lingkod' ng Diyos, hindi batang anak.
theological_decisions:
- issue: Kung pananatilihin ang talinghagang 'sungay ng kaligtasan' o bibigyang-kahulugan bilang 'makapangyarihang Tagapagligtas'
  choice: Pinanatili sa pangunahing teksto ang 'isang sungay ng kaligtasan.'
  alternative: isang makapangyarihang Tagapagligtas
  rationale: Ang kongkretong larawan ay nakaugat sa wikang biblikal tungkol sa lakas, paghahari, at matagumpay na pagliligtas. Ang pagpapanatili rito ay umiiwas sa pagpapakitid sa tunay na saklaw ng talinghaga.
translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang di-karaniwang ngunit mahalagang larawang 'sungay ng kaligtasan,' at ipinaliwanag ito sa talababa. Ginamit ang 'sambahayan' upang maipahiwatig ang angkan o dinastiya ni David nang hindi nawawala ang biblikal na idyoma.
