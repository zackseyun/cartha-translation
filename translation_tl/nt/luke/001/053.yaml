  text: πεινῶντας ἐνέπλησεν ἀγαθῶν καὶ πλουτοῦντας ἐξαπέστειλεν κενούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/053.yaml
  text: He has filled the hungry with good things[a], and sent the rich away empty.
translation:
  language: tl
  text: Binusog niya ng mabubuting bagay ang mga nagugutom, at pinaalis niyang walang anuman[a] ang mga mayayaman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “walang dala.” Mas literal, “walang laman” o “walang anuman.”
    reason: Ang κενούς ay nagsasaad ng malawak na kalagayang ‘empty.’ Ang “walang dala” ay natural na idyomang Filipino ngunit mas tiyak na imaheng empty-handed.
lexical_decisions:
- source_word: πεινῶντας
  choice: ang mga nagugutom
  rationale: Ang kasalukuyang aktibong participle ay ginamit bilang pangngalan at tumutukoy nang tuwiran sa mga taong gutom. Hindi ito pinalakas tungo sa “nagugutom nang labis” at hindi rin ginawang espirituwal na talinghaga.
- source_word: ἐνέπλησεν
  choice: binusog niya
  rationale: Ipinahihiwatig ng pandiwa ang pagpuno hanggang masapatan. Sa konteksto ng mga nagugutom, ang “binusog” ang natural at malinaw na katumbas sa Tagalog; pinananatili ng aspektong ganap ang tiyak at natapos na kilos sa awit.
- source_word: ἀγαθῶν
  choice: ng mabubuting bagay
  rationale: Ang genitive ay nagsasaad ng nilalaman ng ipinambusog. Tuwirang pinananatili ng “mabubuting bagay” ang malawak na kahulugan at hindi nagdaragdag ng ideya ng mga kaloob na wala sa salita mismo.
- source_word: πλουτοῦντας
  choice: ang mga mayayaman
  rationale: Ang participle na ginamit bilang pangngalan ay naglalarawan sa mga taong mayaman at nagpapanatili ng konkretong panlipunang kaibahan sa mga nagugutom.
- source_word: ἐξαπέστειλεν
  choice: pinaalis niya
  rationale: Ang tambalang pandiwa ay nangangahulugang paalisin o papuntahin palayo. Natural sa Tagalog ang “pinaalis” at hindi ito nagdaragdag ng pormal na tagpong maaaring ipahiwatig ng “pinaalis sa harapan.”
- source_word: κενούς
  choice: walang dala
  rationale: Ang pang-uri ay naglalarawan sa kalagayan ng mga mayayaman nang sila ay paalisin. Ang “walang dala” ay natural na Tagalog para sa pagiging empty-handed, samantalang inilalagay sa talababa ang mas literal at mas malawak na anyo.
theological_decisions:
- issue: Panlipunan at teolohikal na pagbabaligtad sa awit ni Maria
  choice: Pinanatili ang konkretong pagsalungat ng “mga nagugutom” at “mga mayayaman.”
  alternative: Unawain ang mga nagugutom bilang mga nangangailangan sa espirituwal at ang mga mayayaman bilang mga mapagmataas o nasisiyahan sa sarili.
  rationale: Tahasang tinutukoy ng Griyego ang mga taong nagugutom at mayayaman. Maaaring magkaroon ng mas malawak na espirituwal na kabuluhan ang pahayag, ngunit hindi iyon ipinapalit sa payak at konkretong kahulugan ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “binusog” sa halip na mas mataas o posibleng espirituwalisadong “pinuspos,” at pinanatili ang balanseng ayos ng dalawang magkasalungat na pangkat.
