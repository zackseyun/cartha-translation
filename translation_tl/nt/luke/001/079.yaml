  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐπιφᾶναι τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις, τοῦ κατευθῦναι τοὺς πόδας ἡμῶν εἰς ὁδὸν εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/079.yaml
  text: to shine on those sitting in darkness and the shadow of death[a], to guide our feet into the way of peace.
translation:
  language: tl
  text: upang liwanagan ang mga nakaupo sa kadiliman at sa lilim ng kamatayan[a], upang gabayan ang ating mga paa sa daan ng kapayapaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anino ng kamatayan”; nauunawaan ng ilan ang parirala sa mas malawak na diwang “matinding kadiliman,” ngunit tahasang binabanggit sa Griyego ang “kamatayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφᾶναι
  choice: upang liwanagan
  rationale: Ipinahahayag ang layunin at pinananatili ang larawan ng liwanag na sumisinag sa mga nasa dilim.
- source_word: τοῖς ἐν σκότει ... καθημένοις
  choice: ang mga nakaupo sa kadiliman
  rationale: Pinananatili ang literal at matalinghagang larawan ng καθημένοις sa halip na gawing mas malabong ‘naninirahan.’
- source_word: σκότει
  choice: kadiliman
  rationale: Likas na katumbas na nagpapanatili sa literal at matalinghagang bisa ng salita.
- source_word: σκιᾷ θανάτου
  choice: sa lilim ng kamatayan
  rationale: Pinananatili ang tahasang pagbanggit sa kamatayan at ang biblikal na larawang ipinahihiwatig ng parirala.
- source_word: τοῦ κατευθῦναι
  choice: upang gabayan
  rationale: Ipinahahayag ang layunin at ang pagkilos ng pagtuturo ng tamang patutunguhan nang hindi labis na nililiteral bilang ‘ituwid.’
- source_word: τοὺς πόδας ἡμῶν
  choice: ang ating mga paa
  rationale: Pinananatili ang pisikal na talinghaga at ang pangmaramihang anyo.
- source_word: εἰς ὁδὸν εἰρήνης
  choice: sa daan ng kapayapaan
  rationale: Natural sa modernong Tagalog at pinananatili ang larawan ng daan at ang bukas na kahulugan ng kapayapaan.
theological_decisions:
- issue: Matalinghagang larawan ng kadiliman at patnubay
  choice: Panatilihin ang kadiliman, lilim ng kamatayan, mga paa, at daan nang walang paliwanag sa pangunahing teksto.
  alternative: Ipaliwanag ang mga ito bilang espirituwal na kamangmangan, panganib ng kamatayan, o pamumuhay na nagdudulot ng kapayapaan.
  rationale: Makatula at mapagpahiwatig ang talata; ang pagpapaliwanag sa mismong salin ay magpapakitid sa tunay na saklaw at tensiyong teolohikal ng mga larawan.
- issue: Kahulugan ng σκιᾷ θανάτου
  choice: lilim ng kamatayan
  alternative: matinding kadiliman
  rationale: Bagaman maaaring tumukoy ang kaugnay na biblikal na idyoma sa matinding kadiliman, tahasang naririto sa Griyego ang θανάτου, ‘kamatayan,’ kaya nararapat itong panatilihin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang matula at biblikal na mga larawan, habang ginamit ang natural na ‘liwanagan,’ ‘gabayan,’ at ‘daan ng kapayapaan.’
