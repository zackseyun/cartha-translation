  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι Οὕτως μοι ⸀πεποίηκεν κύριος ἐν ἡμέραις αἷς ἐπεῖδεν ⸀ἀφελεῖν ὄνειδός μου ἐν ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/025.yaml
  text: because this is how the Lord has dealt with me in the days when he looked on me[a], to take away my reproach among people.
translation:
  language: tl
  text: “Ganito ang ginawa sa akin ng Panginoon noong lingapin niya ako upang alisin ang kahihiyan ko[a] sa harap ng mga tao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kadustaan ko” o “paghamak sa akin.” Ang salitang Griyego ay tumutukoy lalo na sa kahihiyan o kawalang-dangal sa paningin ng lipunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Hindi isinalin nang hiwalay; ipinakilala ang tuwirang sinabi sa pamamagitan ng panipi
  rationale: Sa konteksto ng naunang ‘sinabi niya’ (tal. 24), maaaring magsilbing pananda ng nilalaman ng sinabi ang ὅτι. Ang ‘sapagkat’ ay posible, ngunit magiging alanganin sa natural na Filipino kung walang tahasang sugnay na pinangangatwiranan sa loob ng sipi.
- source_word: Οὕτως μοι πεποίηκεν κύριος
  choice: Ganito ang ginawa sa akin ng Panginoon
  rationale: Pinananatili ng ‘ganito’ ang diin sa paraan ng pagkilos, habang ang ‘ginawa sa akin’ ay tuwiran at natural na katumbas ng ποιέω kasama ang datibong μοι.
- source_word: ἐν ἡμέραις αἷς ἐπεῖδεν
  choice: noong lingapin niya ako
  rationale: Ang konstruksiyon ay temporal. Ipinahihiwatig ng ἐπεῖδεν ang pagtinging may malasakit o pagpapahalaga; mas natural dito ang ‘lingapin’ kaysa literal na ‘tingnan,’ nang hindi tinutukoy nang higit sa teksto kung paano siya tinulungan.
- source_word: ἀφελεῖν
  choice: upang alisin
  rationale: Pinananatili ang posibleng layunin o bunga ng infinitive nang hindi ito ginagawang hiwalay na pangunahing pandiwa.
- source_word: ὄνειδός μου
  choice: ang kahihiyan ko
  rationale: Sa Filipino, malinaw at natural na naipapahayag ng ‘kahihiyan’ ang kalagayang nagdudulot ng kawalang-dangal sa lipunan. Nililinaw ng talababa na panlabas na paghamak o kadustaan ang pangunahing diin, hindi lamang pansariling damdamin.
- source_word: ἐν ἀνθρώποις
  choice: sa harap ng mga tao
  rationale: Ipinapakita nito ang panlipunang saklaw kung saan nararanasan o kinikilala ang kahihiyan. Likas itong Filipino at hindi nililimitahan sa kalalakihan ang generic na ἀνθρώποις.
theological_decisions:
- issue: Tinutukoy ng κύριος
  choice: Ang Diyos ang tinutukoy sa titulong ‘Panginoon.’
  alternative: Walang mahalagang alternatibong pagbasa sa agarang konteksto.
  rationale: Ang sinasabi ni Elisabet ay tungkol sa pagkilos ng Diyos sa pag-aalis ng dungis na kaugnay ng kanyang pagkabaog. Hindi dinaragdagan ng salin ang talata ng mas tiyak na pagbasa kaysa sa hinihingi ng konteksto.
- issue: Panlipunang diwa ng ὄνειδος
  choice: ‘kahihiyan’ na ipinaliliwanag bilang panlipunang kadustaan o paghamak
  alternative: ‘kadustaan ko’ o ‘paghamak sa akin’
  rationale: Karaniwan at madaling maunawaan ang ‘kahihiyan,’ ngunit maaaring mapagkamalang panloob na damdamin lamang. Kaya pinananatili sa talababa ang panlabas at panlipunang diwa ng salitang Griyego.
- issue: Ugnayan ng ἐπεῖδεν at ἀφελεῖν
  choice: ‘lingapin niya ako upang alisin’
  alternative: ‘lingapin niya ako at alisin’
  rationale: Pinananatili ng ‘upang’ ang gramatikal na relasyon ng infinitive bilang layunin o kinalabasan, sa halip na tahasang gawing dalawang magkapantay na pagkilos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘lingapin’ bilang dignified ngunit buhay na salita para sa pagtinging may malasakit. Iniwasan ang mas literal ngunit di-likas na ‘sa mga araw na tumingin siya sa akin.’
