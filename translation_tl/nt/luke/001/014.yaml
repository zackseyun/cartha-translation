translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “malaking kagalakan” upang maiba sa “tuwa” at maipakita ang mas matinding diwa ng ἀγαλλίασις. Inilagay ang talababa pagkatapos ng pariralang may tunay na leksikal na kalabuan.
