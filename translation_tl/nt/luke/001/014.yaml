  text: And there will be joy and exultation for you[a], and many will rejoice at his birth.
translation:
  language: tl
  text: Magkakaroon ka ng tuwa at galak, at marami ang magagalak sa pagsilang niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil sa pagsilang niya.” Maaaring tukuyin ng pariralang Griego ang okasyon ng pagkagalak o ang dahilan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  choice: Magkakaroon
  rationale: Natural na Filipino para sa impersonal na hinaharap na nagpapahayag ng mangyayari, habang malinaw na iniuugnay kay Zacarias ang kasunod na tuwa at kagalakan.
- source_word: χαρά
  choice: tuwa
  rationale: Karaniwan at malinaw na katumbas ng χαρά sa makabagong Filipino.
- source_word: σοι
  choice: ka
  rationale: Ang panghalip na datibo ay tumutukoy sa taong makararanas ng tuwa; likas itong naipapahayag sa Filipino sa konstruksiyong “Magkakaroon ka.”
- source_word: ἀγαλλίασις
  choice: malaking kagalakan
  rationale: Pinananatili ang mas matindi at masiglang diwa kaysa χαρά, nang hindi gumagamit ng di-likas o labis na teknikal na salita.
- source_word: πολλοὶ
  choice: marami
  rationale: Tuwirang substantibong gamit na natural at sapat sa Filipino.
- source_word: ἐπὶ τῇ γενέσει αὐτοῦ
  choice: sa pagsilang niya
  rationale: Maaaring tukuyin ng ἐπί na may datibo ang okasyon o batayan ng kagalakan. Likas ang “sa pagsilang niya” at pinananatili ang bahagyang kalabuan.
- source_word: χαρήσονται
  choice: magagalak
  rationale: Natural na hinaharap ng pandiwang nagpapahayag ng kagalakan at umaalingawngaw sa mga pangngalang nauna.
