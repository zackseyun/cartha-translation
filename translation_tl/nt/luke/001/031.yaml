id: LUK.1.31
reference: Luke 1:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ συλλήμψῃ ἐν γαστρὶ καὶ τέξῃ υἱόν, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/031.yaml
  text: And behold[a], you will conceive in your womb and bear a son, and you will call his name Jesus.
translation:
  language: tl
  text: At narito, maglilihi ka sa iyong sinapupunan at magsisilang ng isang anak na lalaki, at tatawagin mo siyang Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na anyo, “tatawagin mo ang kaniyang pangalan na Jesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: narito
  rationale: Ginagamit bilang pantawag-pansin na nagpapatingkad sa kasunod na pahayag. Ang “narito” ay marangal at pamilyar sa makabagong mambabasa nang hindi ipinahihiwatig na kailangang tumingin si Maria sa isang bagay.
- source_word: συλλήμψῃ ἐν γαστρὶ
  choice: maglilihi ka sa iyong sinapupunan
  rationale: Pinananatili ang tiyak na diwa ng paglilihi at ang hayagang pagtukoy ng Griyego sa sinapupunan. Ang “iyong” ay likas na pagpapalinaw sa ikalawang panauhan na ipinahihiwatig ng pandiwa.
- source_word: τέξῃ υἱόν
  choice: magsisilang ng isang anak na lalaki
  rationale: Tumpak at natural na ipinapahayag ang panganganak at pinananatili ang tiyak na kasarian ng υἱόν.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: tatawagin mo siyang
  rationale: Likas na pariralang Filipino para sa pagbibigay ng pangalan, habang nananatiling malapit sa pandiwang καλέσεις. Inilalagay sa talababa ang mas literal na anyo ng buong pormula.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Ginagamit ang nakasanayang anyo ng pangalan sa Filipino para sa pangalan sa Bagong Tipan.
theological_decisions:
- issue: Paglalahad sa pormula ng pagbibigay ng pangalan na καλέσεις τὸ ὄνομα αὐτοῦ
  choice: tatawagin mo siyang Jesus
  alternative: tatawagin mong Jesus ang pangalan niya
  rationale: Walang doktrinal na usaping nilulutas dito. Pinili sa pangunahing teksto ang natural na Filipino, at pinanatili sa talababa ang mas literal na anyo upang maipakita ang biblikal na pormula ng pagpapangalan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ang “narito” ay sadyang bahagyang pormal upang mapanatili ang mariing himig ng pahayag ng anghel; ang natitirang pangungusap ay tuwiran at madaling maunawaan.
