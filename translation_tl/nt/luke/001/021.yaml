  verdict: revise
  source_fidelity: Ang “kung bakit siya nagtatagal” ay nagdaragdag ng tanong tungkol sa sanhi ng pagkaantala. Ang Griyego ay nagsasabing namangha sila sa kaniyang pagtatagal, hindi na sila ay nagtatanong kung ano ang dahilan nito. Ang “namamangha sila sa pagtatagal niya” ay mas tapat sa ἐθαύμαζον at ἐν τῷ χρονίζειν.
  naturalness: Natural at malinaw sa makabagong Filipino ang “Hinihintay ng mga tao si Zacarias, at namamangha sila sa pagtatagal niya sa santuwaryo.” Mas direkta ito kaysa sa kasalukuyang pananalitang may “kung bakit.”
  terminology: Ang “Zacarias” ay katanggap-tanggap na nakasanayang anyo sa Filipino. Ang “santuwaryo” ay angkop para sa ναός, at ang talababa ay wastong nagbibigay ng “templo” bilang mas pangkalahatang alternatibo habang ipinapaliwanag ang pagkakaiba sa bakuran ng templo.
