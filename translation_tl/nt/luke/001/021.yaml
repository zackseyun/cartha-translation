  text: Καὶ ἦν ὁ λαὸς προσδοκῶν τὸν Ζαχαρίαν, καὶ ἐθαύμαζον ἐν τῷ χρονίζειν ⸂ἐν τῷ ναῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/021.yaml
  text: And the people were waiting for Zechariah[a], and they were marveling at his delay in the temple.
translation:
  language: tl
  text: Hinihintay ng mga tao si Zacarias, at namamangha sila sa pagtatagal niya sa santuwaryo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, templo. Ang salitang Griyego ay tumutukoy sa mismong gusali ng templo, lalo na sa banal na bahagi nito, hindi sa buong bakuran ng templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς
  choice: mga tao
  rationale: Ang kolektibong pangngalan ay tumutukoy sa mga taong nagkakatipon at naghihintay sa labas; natural sa Tagalog ang maramihang “mga tao.”
- source_word: προσδοκῶν
  choice: hinihintay
  rationale: Kasama ng ἦν, ipinapahayag ng participle ang patuloy na paghihintay; malinaw at natural ang “hinihintay.”
- source_word: Ζαχαρίαν
  choice: Zacarias
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa makabagong tradisyong biblikal sa Filipino.
- source_word: ἐθαύμαζον
  choice: nagtataka sila
  rationale: Pinananatili nito ang patuloy na pagtataka ng mga tao nang hindi labis na pinatitindi ang diwa bilang lubos na pagkabigla.
- source_word: ἐν τῷ χρονίζειν
  choice: kung bakit siya nagtatagal
  rationale: Natural nitong ipinahahayag sa Tagalog na ang hindi inaasahang tagal ng pananatili ni Zacarias ang dahilan ng kanilang pagtataka. Hindi nito tinutukoy kung ano ang sanhi ng pagkaantala.
- source_word: ναῷ
  choice: santuwaryo
  rationale: Ang ναός dito ay mas tiyak na tumutukoy sa mismong banal na gusali o templo proper, hindi sa mas malawak na bakuran ng templo.
- source_word: αὐτόν
  choice: siya
  rationale: Ang accusative pronoun ang lohikal na simuno ng infinitive; sa sugnay na Tagalog, ang natural na anyo ay “siya.”
