id: LUK.12.58
reference: Luke 12:58
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς γὰρ ὑπάγεις μετὰ τοῦ ἀντιδίκου σου ἐπ’ ἄρχοντα, ἐν τῇ ὁδῷ δὸς ἐργασίαν ἀπηλλάχθαι ἀπ’ αὐτοῦ, μήποτε κατασύρῃ σε πρὸς τὸν κριτήν, καὶ ὁ κριτής σε ⸀παραδώσει τῷ πράκτορι, καὶ ὁ πράκτωρ σε ⸀βαλεῖ εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/058.yaml
  text: For as you are going with your accuser before a magistrate[a], make an effort on the way to be released from him, lest he drag you to the judge, and the judge hand you over to the officer, and the officer throw you into prison.
translation:
  language: tl
  text: Sapagkat habang papunta ka kasama ng nagsasakdal sa iyo upang humarap sa isang pinunong opisyal, sikapin mong makalaya sa kanya habang nasa daan pa,[a] baka kaladkarin ka niya sa hukom, at ibigay ka ng hukom sa opisyal, at itapon ka ng opisyal sa bilangguan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makipag-ayos sa kanya.” Literal sa Griyego ang “makalaya sa kanya,” ngunit sa konteksto ay malamang na tumutukoy ito sa paglutas ng usapin bago makarating sa hukom.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιδίκου
  choice: nagsasakdal sa iyo
  rationale: Ipinahihiwatig ng legal na tagpo ang kabilang panig na may dalang sakdal. Mas malinaw ito sa karaniwang mambabasa kaysa sa pangkalahatang “kalaban.”
- source_word: ἄρχοντα
  choice: isang pinuno
  rationale: Pinananatili nito ang malawak na diwa ng isang may kapangyarihang sibiko at ang pagkakaiba nito sa kasunod na κριτής, ang hukom.
- source_word: δὸς ἐργασίαν
  choice: sikapin mo
  rationale: Likas at tuwirang Filipino ito para sa idyomang nag-uutos ng masigasig na pagkilos.
- source_word: ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: makalaya sa kanya
  rationale: Malapit ito sa literal na diwa ng paglaya mula sa kabilang panig at hindi nito tahasang ipinapalit ang mas interpretibong ideya ng pakikipag-ayos.
- source_word: κατασύρῃ
  choice: kaladkarin
  rationale: Pinananatili nito ang marahas at mapilit na galaw ng pandiwa.
- source_word: κριτήν / κριτής
  choice: hukom
  rationale: Ito ang malinaw at karaniwang katawagang legal sa Filipino.
- source_word: παραδώσει
  choice: ibigay ka
  rationale: Ipinahahayag nito ang paglilipat ng bilanggo sa opisyal na magpapatupad ng pasiya; natural ito sa daloy ng pangungusap.
- source_word: πράκτορι / πράκτωρ
  choice: opisyal
  rationale: Sapat itong malawak para sa opisyal na nagpapatupad ng utos ng hukom nang hindi nag-aangkat ng tiyak na tungkuling mula sa makabagong sistemang legal.
- source_word: βαλεῖ εἰς φυλακήν
  choice: itapon ka sa bilangguan
  rationale: Pinananatili ng “itapon” ang matindi at buhay na puwersa ng βάλλω.
- source_word: ὡς γὰρ
  choice: Sapagkat habang
  rationale: Ang “sapagkat” ay nag-uugnay sa paliwanag sa naunang konteksto, samantalang ang “habang” ay natural na nagpapakilala sa sitwasyong inilalarawan.
- source_word: ἐν τῇ ὁδῷ
  choice: habang nasa daan pa
  rationale: Pinananatili nito ang literal na paglalakbay at binibigyang-diin ang pagkaapurahang kumilos bago makarating sa hukom.
theological_decisions:
- issue: Tiyak na espirituwal na pakahulugan ng legal na tagpo
  choice: Panatilihin ang legal na larawan nang hindi tahasang tinutukoy kung sino ang isinasagisag ng nagsasakdal, hukom, o bilangguan.
  alternative: Isalin ito bilang tuwirang panawagan na makipagkasundo sa Diyos bago ang huling paghuhukom.
  rationale: Legal na paghahalintulad ang tahasang sinasabi ng talata. Maaaring may pahiwatig ng pangwakas na paghuhukom sa mas malawak na konteksto, ngunit hindi iyon tuwirang ipinapaliwanag sa mismong talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pagkakasunod-sunod ng mga tauhan sa legal na proseso at ang matinding larawan ng pagkakaladkad at pagtatapon sa bilangguan. Inilagay ang talababa pagkatapos ng pariralang tinutukoy nito.
