source:
  edition: SBLGNT
  text: ⸀διαμερισθήσονται πατὴρ ἐπὶ υἱῷ καὶ υἱὸς ἐπὶ πατρί, μήτηρ ⸀ἐπὶ ⸀θυγατέρα καὶ θυγάτηρ ἐπὶ ⸂τὴν μητέρα⸃, πενθερὰ ἐπὶ τὴν νύμφην αὐτῆς καὶ νύμφη ἐπὶ τὴν ⸀πενθεράν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/053.yaml
  text: 'They will be divided: father against son and son against father[a], mother against daughter and daughter against mother[c][b], mother-in-law against her daughter-in-law and daughter-in-law against her mother-in-law.'
translation:
  language: tl
  text: 'Magkakabaha-bahagi sila[a]: ang ama laban sa anak na lalaki at ang anak na lalaki laban sa ama; ang ina laban sa anak na babae at ang anak na babae laban sa ina; ang biyenang babae laban sa kanyang manugang na babae[b], at ang manugang na babae laban sa kanyang biyenang babae.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “magkakawatak-watak sila.” Idinidiin ng pandiwang Griyego ang pagkakahati sa loob ng isang pangkat o sambahayan.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego para sa “manugang na babae” ay maaari ring mangahulugang “babaing ikakasal” sa ibang konteksto, ngunit dito, dahil ipinares ito sa “biyenang babae,” ang tinutukoy ay manugang na babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμερισθήσονται
  choice: magkakabaha-bahagi sila
  rationale: Ipinahahayag ng future passive ang kalagayan ng pagkakahati sa loob ng pamilya. Natural sa Filipino ang anyong ito at hindi nito ipinapasiya kung sino ang tahasang sanhi ng hidwaan.
- source_word: ἐπὶ
  choice: laban sa
  rationale: Sa paulit-ulit na ugnayang ito sa pagitan ng mga tao, ipinahihiwatig ng ἐπί ang pagsasalungatan; malinaw at likas na katumbas ang “laban sa.”
- source_word: πατήρ / υἱός
  choice: ama / anak na lalaki
  rationale: Pinananatili ang tiyak na ugnayang pangkasarian at ang magkabaligtad na pares ng ama at anak na lalaki.
- source_word: μήτηρ / θυγάτηρ
  choice: ina / anak na babae
  rationale: Pinananatili ang tiyak na ugnayang pangkasarian at ang magkabaligtad na pares ng ina at anak na babae.
- source_word: πενθερά
  choice: biyenang babae
  rationale: Maaaring tumukoy ang karaniwang salitang “biyenan” sa lalaki o babae; nililinaw ng “biyenang babae” ang pambabaeng anyo ng salitang Griyego.
- source_word: νύμφη
  choice: manugang na babae
  rationale: Bagaman maaari rin itong mangahulugang babaing ikakasal, itinatakda rito ng katambal na πενθερά ang kahulugang manugang na babae.
- source_word: αὐτῆς
  choice: sarili niyang
  rationale: Tahasan sa unang pares ng biyenan at manugang ang panghalip na nangangahulugang “kaniya.” Ginamit ang “sarili niyang” upang malinaw na iugnay ang manugang sa biyenang babae nang hindi nagiging alanganin sa Filipino.
theological_decisions:
- issue: Kalikasan ng pagkakahating inilalarawan
  choice: Paglalarawan ng pagkakahati at pagsasalungatan sa pamilya kaugnay ng misyon ni Jesus, hindi pagsang-ayon sa pagkapoot sa pamilya
  alternative: Isang pangkalahatang kasabihan lamang tungkol sa tensiyon sa pamilya
  rationale: Inililista ng talata ang magkabilang panig ng mga ugnayang pampamilya bilang bunga ng pagkakahating binanggit sa naunang konteksto. Pinananatili ng salin ang matinding pananalita nang hindi ipinahihiwatig na iniuutos o sinasang-ayunan ang gayong paglalaban.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inulit ang bawat katawagang pampamilya upang mapanatili ang mariing, magkabaligtad na ayos ng Griyego. Ginamit ang “anak na lalaki/babae,” “biyenang babae,” at “manugang na babae” para mapanatili ang mga tiyak na ugnayang ipinahahayag ng teksto.
