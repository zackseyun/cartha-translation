  to: 'Magkakabaha-bahagi sila[a]: ang ama laban sa anak na lalaki at ang anak na lalaki laban sa ama; ang ina laban sa anak na babae at ang anak na babae laban sa ina; ang biyenang babae laban sa kanyang manugang na babae[b], at ang manugang na babae laban sa kanyang biyenang babae.'
