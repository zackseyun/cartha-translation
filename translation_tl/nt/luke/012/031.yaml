reference: Luke 12:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πλὴν ζητεῖτε τὴν βασιλείαν ⸀αὐτοῦ, καὶ ⸀ταῦτα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/031.yaml
  text: But seek his kingdom[b][a], and these things will be added to you.
translation:
  language: tl
  text: Ngunit hanapin ninyo ang kanyang kaharian[b][a], at idaragdag sa inyo ang mga bagay na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaharian ng Diyos”; “kanyang kaharian” ang nasa Griyego, at ipinakikilala ng konteksto kung sino ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: “Ang kaharian ng Diyos” ang mababasa sa ilang manuskrito sa halip na “kanyang kaharian.”
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν
  choice: Ngunit
  rationale: Ipinakikita nito ang pagsalungat sa naunang pagbabawal na mabalisa at magtuon sa paghahanap ng mga materyal na pangangailangan, nang hindi dinaragdagan ang diin ng Griyego.
- source_word: ζητεῖτε
  choice: hanapin ninyo
  rationale: Ang pangkasalukuyang pautos ay tumutukoy sa patuloy na pagtutuon at paghahangad. Sa natural na Tagalog, kayang ipahiwatig ng pautos na “hanapin ninyo” ang ganitong nagpapatuloy na gawain nang hindi kailangang idagdag ang mas mapagpaliwanag na “patuloy.”
- source_word: βασιλείαν
  choice: kaharian
  rationale: Ang “kaharian” ang natural at kinikilalang salin na maaaring sumaklaw kapwa sa paghahari at sa nasasakupan; hindi nito nililimitahan ang kahulugan sa “pamamahala” lamang.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Pinananatili nito ang panghalip sa Griyego. Malinaw sa konteksto na ang tinutukoy ay ang Diyos, ngunit hindi iyon tahasang ipinapalit sa mismong teksto.
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Tumutukoy ito sa mga pangangailangang binanggit sa nakapaligid na konteksto. Walang salitang katumbas ng “lahat” sa tekstong ito, kaya hindi ito idinagdag mula sa kahawig na pahayag sa Mateo.
- source_word: προστεθήσεται
  choice: idaragdag
  rationale: Pinananatili ng anyong panghinaharap na balintiyak ang larawan ng pagdaragdag at hindi tahasang pinapangalanan ang gumagawa, gaya ng Griyego.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Tuwirang inilalarawan nito ang datibong tumatanggap at natural itong kasama ng balintiyak na “idaragdag.”
theological_decisions:
- issue: Ang tinutukoy ng αὐτοῦ
  choice: Pinanatili bilang “kanyang kaharian,” na ang tinutukoy ay ang Diyos ayon sa konteksto.
  alternative: Gawing tahasan bilang “kaharian ng Diyos.”
  rationale: Binabanggit sa agarang konteksto ang Ama at ang pag-aaruga ng Diyos, kaya makikilala ang tinutukoy. Ang pagpapanatili sa panghalip ay higit na tapat sa pangunahing tekstong Griyego at hindi inaalis ang lehitimong paglilinaw sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ninyo” para sa maramihang ikalawang panauhan at pinanatili ang maikli at tuwirang ayos ng talata.
