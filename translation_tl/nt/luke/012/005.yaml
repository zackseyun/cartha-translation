  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑποδείξω δὲ ὑμῖν τίνα φοβηθῆτε· φοβήθητε τὸν μετὰ τὸ ἀποκτεῖναι ⸂ἔχοντα ἐξουσίαν⸃ ἐμβαλεῖν εἰς τὴν γέενναν· ναί, λέγω ὑμῖν, τοῦτον φοβήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/005.yaml
  text: 'But I will show you whom to fear: fear the one who[a], after killing, has authority to throw into Gehenna. Yes, I tell you, fear this one.'
translation:
  language: tl
  text: 'Ngunit ipapakita ko sa inyo kung sino ang dapat ninyong katakutan: katakutan ninyo ang isa na, matapos siyang pumatay, ay may awtoridad na magtapon sa Gehenna[a]. Oo, sinasabi ko sa inyo, ang isang ito ang katakutan ninyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “impiyerno.” Ang salitang Griyego ay Gehenna, isang terminong kaugnay ng paghatol na nakaugat sa larawan ng Lambak ng Hinom.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδείξω
  choice: ipapakita ko
  rationale: Pinananatili nito ang diwa ng pagtuturo o pagtukoy nang hindi dinaragdagan ang teksto ng kahulugang gaya ng tahasang pagbababala.
- source_word: τίνα φοβηθῆτε
  choice: kung sino ang dapat ninyong katakutan
  rationale: Likas na Filipino para sa di-tuwirang tanong at malinaw na ipinahahayag ang hinihinging tugon.
- source_word: φοβήθητε
  choice: katakutan ninyo
  rationale: Pinananatili ang mariing pautos at ang pag-uulit ng salitang may diwang ‘matakot’; ang ‘igalang’ ay masyadong mahina sa konteksto ng paghatol.
- source_word: τὸν
  choice: ang may awtoridad
  rationale: Ang artikulo ay ginagamit bilang pangngalan at tumutukoy sa isang persona nang hindi nagdaragdag ng hayag na katawagang wala sa Griyego.
- source_word: μετὰ τὸ ἀποκτεῖναι
  choice: matapos pumatay
  rationale: Tuwirang pinananatili ang pagkakasunod sa panahon na ipinahahayag ng μετά kasama ng articular infinitive.
- source_word: ἔχοντα ἐξουσίαν
  choice: may awtoridad
  rationale: Ang ἐξουσία ay tumutukoy sa awtoridad o karapatang gumawa, hindi lamang sa hubad na kapangyarihan.
- source_word: ἐμβαλεῖν εἰς
  choice: magtapon sa
  rationale: Karaniwan at malinaw na modernong Filipino para sa marahas na kilos ng paghahagis o pagtatapon papasok sa isang kalagayan o dako.
- source_word: γέενναν
  choice: Gehenna
  rationale: Pinananatili ang tiyak na terminong Griyego at ang ugat nito sa larawan ng Lambak ng Hinom sa halip na agad itong tumbasan ng isang salitang may mas malawak na kalaunang mga kaugnayang teolohikal.
- source_word: ναί
  choice: Oo
  rationale: Maikli at mariing pagpapatibay na likas sa modernong Filipino.
- source_word: τοῦτον
  choice: siya
  rationale: Sa pangwakas na sugnay, ang ‘siya ang katakutan ninyo’ ay natural na Filipino at pinananatili ang mariing pagtukoy sa mismong personang nabanggit.
theological_decisions:
- issue: Pagsasalin ng γέεννα sa konteksto ng paghatol
  choice: Gehenna
  alternative: impiyerno
  rationale: Pinananatili sa pangunahing teksto ang mismong terminong Griyego upang hindi agad ipasok ang lahat ng kalaunang pakahulugan ng ‘impiyerno.’ Ibinibigay sa talababa ang karaniwang katumbas upang makatulong sa mambabasa nang hindi pinapawi ang makasaysayang larawan ng termino.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘awtoridad’ sapagkat mas tiyak ito kaysa ‘kapangyarihan’ para sa ἐξουσία. Inilagay ang ‘matapos pumatay’ sa hulihan ng pangunahing sugnay upang maging natural ang ayos sa Filipino habang nananatiling malinaw na nauuna ang pagpatay bago ang pagtatapon sa Gehenna.
