id: LUK.12.41
reference: Luke 12:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εἶπεν ⸀δὲ ὁ Πέτρος· Κύριε, πρὸς ἡμᾶς τὴν παραβολὴν ταύτην λέγεις ἢ καὶ πρὸς πάντας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/041.yaml
  text: Then Peter said[a], “Lord, are you telling this parable to us, or also to everyone?”
translation:
  language: tl
  text: Sinabi naman ni Pedro, “Panginoon, sinasabi mo ba ang talinghagang ito sa amin, o pati sa lahat?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν
  choice: Sinabi
  rationale: Ang aorist ng λέγω ay tuwirang nangangahulugang “sinabi.” Bagaman tanong ang nilalaman, sapat nang ipakita iyon sa ayos at bantas ng pangungusap.
- source_word: δὲ
  choice: naman
  rationale: Nagpapatuloy at bahagyang naglilipat ng pokus ang δέ sa pagsasalaysay. Likas sa modernong Tagalog ang “naman” sa pagpapakilala sa tugon ni Pedro.
- source_word: Κύριε
  choice: Panginoon
  rationale: Ang κύριος bilang tuwirang tawag kay Jesus ay angkop na isaling “Panginoon,” na nagpapanatili sa paggalang at sa maaaring kristolohikal na pahiwatig nang hindi ito pinalalabis.
- source_word: πρὸς ἡμᾶς
  choice: sa amin
  rationale: Ang πρός na may accusative kasunod ng λέγεις ay tumutukoy sa pinatutungkulan ng pagsasalita. Ang “sa amin” ang likas at tuwirang katumbas sa Tagalog.
- source_word: τὴν παραβολὴν ταύτην
  choice: ang talinghagang ito
  rationale: Ang παραβολή ay palagiang tumutukoy sa talinghaga sa mga Sinoptikong Ebanghelyo; pinananatili ng “talinghaga” ang anyong pampanitikan at ugnayang kanonikal.
- source_word: λέγεις
  choice: sinasabi mo
  rationale: Pinananatili ng aspektong imperpektibo ng present tense ang kasalukuyang pagbigkas o pagpapahayag ng talinghaga. Natural sa Tagalog ang “sinasabi mo ba.”
- source_word: ἢ καὶ
  choice: o pati
  rationale: Ipinapakita ng “o pati” kapwa ang pagpipilian na dala ng ἤ at ang pagdaragdag na dala ng καί.
- source_word: πρὸς πάντας
  choice: sa lahat
  rationale: Generic ang masculine plural na πάντας at tumutukoy sa mas malawak na pangkat ng mga nakikinig. Inclusive at natural sa Tagalog ang “sa lahat.”
theological_decisions:
- issue: Pagsasalin ng κύριος sa pagtawag ni Pedro kay Jesus
  choice: Panginoon
  alternative: Guro
  rationale: Pinananatili ng “Panginoon” ang karaniwang leksikal na kahulugan, ang magalang na pagtawag, at ang posibleng kristolohikal na bigat nang hindi ipinipilit ang isang mas tiyak na interpretasyon.
- issue: Generic masculine na πάντας
  choice: sa lahat
  alternative: sa lahat ng tao
  rationale: Ang “sa lahat” ay malinaw na sumasaklaw sa mas malawak na tagapakinig at hindi nililimitahan ang tinutukoy sa mga lalaki. Hindi rin nito idinaragdag ang salitang “tao,” na wala sa Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “talinghaga” bilang pamilyar na terminong biblikal, “naman” bilang mahinahong panandang pandiskurso, at “o pati sa lahat” upang mapanatili ang kaibahan ng “sa amin” at ng mas malawak na tagapakinig.
