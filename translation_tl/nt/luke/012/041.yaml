  source_fidelity: Tapat ang salin sa Griyegong teksto. Naipapahayag ng “Sinabi naman ni Pedro” ang Εἶπεν δὲ, at malinaw na napapanatili ng tanong ang kasalukuyang aspekto ng λέγεις. Wasto ang pagtutumbas ng πρὸς ἡμᾶς at πρὸς πάντας bilang “sa amin” at “sa lahat,” at ang “o pati” ay sapat na nagpapakita ng ἢ καὶ.
  naturalness: Natural at malinaw ang pangungusap sa modernong Filipino Tagalog. Ang “naman” ay angkop na panandang pagpapatuloy, at ang ayos na “sinasabi mo ba ang talinghagang ito sa amin, o pati sa lahat?” ay madaling unawain at marangal nang hindi lipas sa gamit.
