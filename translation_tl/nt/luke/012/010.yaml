id: LUK.12.10
reference: Luke 12:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πᾶς ὃς ἐρεῖ λόγον εἰς τὸν υἱὸν τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ τῷ δὲ εἰς τὸ ἅγιον πνεῦμα βλασφημήσαντι οὐκ ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/010.yaml
  text: And everyone who speaks a word against the Son of Man[a], it will be forgiven him[b]; but the one who blasphemes against the Holy Spirit will not be forgiven.
translation:
  language: tl
  text: At ang sinumang magsalita laban sa Anak ng Tao ay mapapatawad dahil dito; ngunit ang sinumang lumapastangan sa Banal na Espiritu ay hindi mapapatawad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὃς
  choice: ang sinumang
  rationale: Likas at pangkalahatang pahayag ito sa modernong Tagalog at pinananatili ang distributibo at walang-tanging saklaw ng Griyego.
- source_word: ἐρεῖ λόγον εἰς
  choice: magsalita laban sa
  rationale: Ang λόγον ay bahagi ng idyomang Griyego; sa Tagalog, sapat at mas natural ang “magsalita laban sa” kaysa sa literal ngunit mabigat na “magsalita ng isang salita laban sa.” Sa konteksto, ang εἰς ay nagpapahayag ng pagsalungat.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Anak ng Tao
  rationale: Ito ang nakaugaliang tumpak na salin ng titulong ginagamit ni Jesus at pinananatili nito ang Semitikong anyo at Kristolohikal na bigat.
- source_word: ἀφεθήσεται αὐτῷ
  choice: ipagpapatawad iyon sa kanya
  rationale: Pinananatili ng “iyon” ang ipinahihiwatig na kasalanan o pagsasalitang patatawarin, habang ang “sa kanya” ay tahasang kumakatawan sa αὐτῷ.
- source_word: τῷ ... βλασφημήσαντι
  choice: ang sinumang lumapastangan
  rationale: Ang substantibong aorist participle ay likas na naihahayag sa Tagalog sa ganitong pangkalahatang pormula. Hindi nito nililimitahan ang pahayag sa isang partikular na nakaraang pangyayari.
- source_word: τὸ ἅγιον πνεῦμα
  choice: Banal na Espiritu
  rationale: Ito ang malinaw at karaniwang makabagong katawagan sa banal na persona na tinutukoy ng teksto.
- source_word: οὐκ ἀφεθήσεται
  choice: hindi patatawarin
  rationale: Direkta at mariing inililipat nito ang negatibong future passive nang walang dagdag na paliwanag.
theological_decisions:
- issue: Ang pagkakaiba ng pagsasalita laban sa Anak ng Tao at paglapastangan sa Banal na Espiritu
  choice: Panatilihin ang tahasang pagkakaiba at ang magkaibang pahayag tungkol sa kapatawaran.
  alternative: Ipaliwanag sa mismong salin na ang una ay bunga ng kamangmangan at ang ikalawa ay pangwakas na kawalan ng pagsisisi.
  rationale: Hindi tinutukoy ng talata mismo ang mekanismo o eksaktong saklaw ng tinatawag na kasalanang hindi mapatatawad. Ang pagdaragdag ng paliwanag ay lulutas sa isang teolohikal na tensiyong sadyang hindi nilulutas ng tekstong Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Iniwasan ang sobrang literal na “magsalita ng isang salita,” ngunit pinanatili ang ipinahihiwatig na kasalanan sa “iyon” at ang matinding kaibahan ng dalawang sugnay.
