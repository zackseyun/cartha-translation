  text: ἐκεῖνος δὲ ὁ δοῦλος ὁ γνοὺς τὸ θέλημα τοῦ κυρίου ⸀αὐτοῦ καὶ μὴ ἑτοιμάσας ⸀ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ δαρήσεται πολλάς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/047.yaml
  text: But that servant[a], who knew his master's will and did not prepare or act according to his will, will be beaten with many blows.
translation:
  language: tl
  text: Ngunit ang aliping iyon na nakaalam sa kalooban ng kanyang panginoon at hindi naghanda o gumawa ayon sa kanyang kalooban ay hahampasin nang maraming beses[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tatanggap ng maraming hampas.” Sa Griyego, ipinahihiwatig lamang ang pangngalang “mga hampas” at hindi ito tahasang binanggit.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: alipin
  rationale: Tumutukoy ito sa isang taong nasa ilalim ng pagmamay-ari at kapangyarihan ng panginoon, hindi sa isang upahang lingkod. Ang “alipin” ang tuwiran at karaniwang katumbas sa makabagong Filipino.
- source_word: γνοὺς
  choice: nakaaalam
  rationale: Ipinahihiwatig ng participle na alam na ng alipin ang kalooban ng panginoon. Ang “nakaaalam” ay likas sa Filipino at malinaw na inilalarawan ang kalagayang ito.
- source_word: θέλημα
  choice: kalooban
  rationale: Ang “kalooban” ay angkop sa nais o ipinag-uutos ng panginoon at hindi nililimitahan ang kahulugan sa damdamin lamang.
- source_word: κυρίου αὐτοῦ
  choice: kanyang panginoon
  rationale: Sa tagpong sambahayan ng talinghaga, ang κύριος ay ang panginoon ng alipin. Ang maliit na titik at konteksto ay nagpapanatili sa relasyong panlipunan nang hindi ipinipilit na tuwirang banal na titulo ito sa pangungusap.
- source_word: ἑτοιμάσας
  choice: naghanda
  rationale: Pinananatili nito ang di-tiyak na layon ng pandiwa sa Griyego at natural itong nauunawaan sa Filipino.
- source_word: ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ
  choice: o kumilos ayon sa kalooban nito
  rationale: Ipinakikita nito ang ikalawang pagkukulang—ang hindi paggawa alinsunod sa nais ng panginoon—nang hindi nagdaragdag ng tiyak na gawa na wala sa Griyego.
- source_word: δαρήσεται
  choice: hahampasin
  rationale: Tuwiran nitong ipinapahayag ang future passive na pisikal na pagpaparusa nang hindi dinaragdagan ang uri ng pamalo o paraan ng paghampas.
- source_word: πολλάς
  choice: nang maraming beses
  rationale: Pambabaeng pangmaramihang pang-uri ito na may ipinahihiwatig ngunit di-binanggit na pangngalang gaya ng “mga hampas.” Ang “nang maraming beses” ay natural sa Filipino at pinananatili ang pag-uulit ng parusa.
theological_decisions:
- issue: Paglalarawan sa κύριος sa tagpong sambahayan ng talinghaga
  choice: panginoon
  alternative: Panginoon
  rationale: Tumutukoy muna ang salita sa nakatataas na may-ari ng alipin sa loob ng talinghaga. Ang “panginoon” ay nagpapanatili sa relasyong iyon at hinahayaang manatili ang mas malawak na pahiwatig ng talinghaga nang hindi ginagawang tuwirang banal na titulo ang salita rito.
- issue: Di-tahasang pangngalan sa πολλάς
  choice: hahampasin nang maraming beses
  alternative: tatanggap ng maraming hampas
  rationale: Hindi tahasang binanggit sa Griyego ang pangngalang “mga hampas.” Pinananatili ng pangunahing salin ang ellipsis sa paraang malinaw sa Filipino, habang itinatala sa talababa ang kongkretong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pero” upang natural na maipakita ang pagsalungat sa loob ng mahabang pangungusap; pinanatili ang konkretong larawan ng pisikal na parusa at ang hindi tinukoy na bagay na dapat ihanda.
