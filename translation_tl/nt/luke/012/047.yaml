revisions:
- from: Ngunit ang aliping iyon na nakaaalam sa kalooban ng kanyang panginoon, pero hindi naghanda o kumilos ayon sa kalooban nito, ay hahampasin nang maraming beses[a].
  to: Ngunit ang aliping iyon na nakaalam sa kalooban ng kanyang panginoon at hindi naghanda o gumawa ayon sa kanyang kalooban ay hahampasin nang maraming beses[a].
  rationale: Pinalitan ang "nakaaalam" ng "nakaalam" upang maipakita ang naunang kaalamang ipinahihiwatig ng aorist participle. Inalis ang kalabisan na "pero" at ginawang "gumawa ayon sa kanyang kalooban" ang ikalawang pandiwa upang mas tuwirang maipahayag ang ποιήσας πρὸς τὸ θέλημα αὐτοῦ. Pinanatili ang pambabaeng pangmaramihang ellipsis ng πολλάς sa natural na Filipino sa pamamagitan ng "nang maraming beses," na may talababa para sa "maraming hampas."
