    reason: lexical_alternative
  revision_rationale: Pinalitan ang "nakaaalam" ng "nakaalam" upang maipakita ang naunang kaalamang ipinahihiwatig ng aorist participle. Inalis ang kalabisan na "pero" at ginawang "gumawa ayon sa kanyang kalooban" ang ikalawang pandiwa upang mas tuwirang maipahayag ang ποιήσας πρὸς τὸ θέλημα αὐτοῦ. Pinanatili ang pambabaeng pangmaramihang ellipsis ng πολλάς sa natural na Filipino sa pamamagitan ng "nang maraming beses," na may talababa para sa "maraming hampas."
