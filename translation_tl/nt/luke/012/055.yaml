  text: And when the south wind is blowing[a], you say[b], ‘There will be scorching heat,’ and it happens.
translation:
  language: tl
  text: At kapag umiihip ang hangin mula sa timog, sinasabi ninyo, “Magkakaroon ng matinding init,” at nagkakatotoo nga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νότον
  choice: hangin mula sa timog
  rationale: Sa konteksto ng panahon at kasama ng πνέοντα, tumutukoy ang νότον sa hanging nagmumula sa timog. Malinaw at natural ito sa makabagong Filipino.
- source_word: πνέοντα
  choice: umiihip
  rationale: Pinananatili ng aspektong pangkasalukuyan ng participle ang nagaganap na pag-ihip ng hangin.
- source_word: λέγετε
  choice: sinasabi ninyo
  rationale: Ang anyong pangkasalukuyan ay nagpapahayag ng karaniwang ginagawa ng mga kinakausap kapag napapansin nila ang ganitong lagay ng panahon.
- source_word: Καύσων
  choice: matinding init
  rationale: Ipinahahayag nito ang napakainit at nakapapasong lagay ng panahon nang natural at marangal sa Filipino, nang hindi gumagamit ng masyadong teknikal o makabagong terminong gaya ng “heat wave.”
- source_word: ἔσται
  choice: magkakaroon ng
  rationale: Natural na paraan ito sa Filipino upang ihayag ang darating na kalagayan ng matinding init.
- source_word: γίνεται
  choice: nagkakagayon nga
  rationale: Ipinahahayag nito na natutupad ang kanilang hula; ang “nga” ay likas na nagbibigay-diin sa aktuwal na pagkatotoo nito.
