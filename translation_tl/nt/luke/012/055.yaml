translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hangin mula sa timog” sa halip na literal na “timog” upang maging tahasang meteorolohikal ang diwa, at “matinding init” upang mapanatili ang tindi ng Καύσων.
