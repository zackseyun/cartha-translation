id: LUK.12.1
reference: Luke 12:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐν οἷς ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου, ὥστε καταπατεῖν ἀλλήλους, ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον· Προσέχετε ἑαυτοῖς ἀπὸ τῆς ζύμης, ⸂ἥτις ἐστὶν ὑπόκρισις, τῶν Φαρισαίων⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/001.yaml
  text: Meanwhile[a], when the many thousands of the crowd had gathered together, so that they were trampling one another, he began to say first to his disciples, “Beware of the leaven of the Pharisees[b], which is hypocrisy.”
translation:
  language: tl
  text: 'Samantala[a], nang magtipon ang libu-libong tao, kaya’t nagkakatapakan sila, nagsimula siyang magsalita, una sa kanyang mga alagad: “Mag-ingat kayo sa lebadura ng mga Pariseo[b], na siyang pagkukunwari.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa mga pangyayaring iyon.” Ang parirala sa Griyego ay maaaring magpahiwatig ng panahon o ng mga kalagayang kaugnay ng naunang tagpo.
    reason: lexical_alternative
  - marker: b
    text: O “Bantayan ninyo ang inyong mga sarili laban sa lebadura ng mga Pariseo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: Samantala
  rationale: Ipinahihiwatig ng idyoma ang kasabay na pangyayari at ang ugnayan nito sa naunang tagpo; natural itong naipapahayag sa modernong Tagalog bilang “Samantala.”
- source_word: ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου
  choice: nang magkatipon ang libu-libong tao
  rationale: Ipinapahayag ng genitive absolute ang kalagayang naganap bago o kasabay ng pangunahing kilos. Ang μυριάδες ay maaaring tumukoy sa mga sampung libo o, mas maluwag, sa napakalaking bilang; “libu-libong tao” ang natural at hindi labis na tiyak.
- source_word: ὥστε καταπατεῖν ἀλλήλους
  choice: hanggang sa nagkakatapakan na sila
  rationale: Ang ὥστε at infinitive ay nagsasaad ng bunga. Ang “nagkakatapakan” ay natural na nagpapakita ng nagpapatuloy at magulong pagkilos sa isa’t isa.
- source_word: ἤρξατο λέγειν
  choice: nagsimula siyang magsalita
  rationale: Natural na Tagalog ito para sa inceptive construction nang hindi pinatitigas ang literal na “nagsimulang sabihin.”
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον
  choice: una sa kanyang mga alagad
  rationale: Pinananatili nito ang posibleng diin na ang mga alagad ang unang kinausap, nang hindi nagdaragdag ng tahasang kasunod na talumpati.
- source_word: Προσέχετε ἑαυτοῖς ἀπὸ
  choice: Mag-ingat kayo sa
  rationale: Likas na Tagalog na babala ito at sapat na naihahatid ang reflexive na diwa ng pag-iingat para sa sarili.
- source_word: ζύμη
  choice: lebadura
  rationale: Pinananatili ang kongkretong larawan ng pampalsa sa halip na palitan ito ng interpretatibong “impluwensiya” o “turo.” Karaniwan at malinaw sa modernong Filipino ang “lebadura.”
- source_word: ἥτις ἐστὶν ὑπόκρισις
  choice: na siyang pagkukunwari
  rationale: Pinananatili ang tuwirang pagpapakilala ng teksto sa kahulugan ng talinghaga. Ang “pagkukunwari” ay malinaw at karaniwang katumbas ng ὑπόκρισις.
- source_word: τῶν Φαρισαίων
  choice: ng mga Pariseo
  rationale: Likas na ipinapahayag sa Tagalog ang genitibong naglalarawan o nag-uugnay sa lebadura sa mga Pariseo.
theological_decisions:
- issue: Matalinghagang gamit ng ζύμη
  choice: Panatilihin ang “lebadura,” na mismong iniuugnay ng teksto sa pagkukunwari.
  alternative: Isalin nang interpretatibo bilang “turo,” “impluwensiya,” o “masamang impluwensiya.”
  rationale: Ipinaliliwanag na ng talata ang larawan bilang pagkukunwari; ang pagpapanatili sa “lebadura” ay nag-iingat sa panliteratura at teolohikal na bisa ng talinghaga nang hindi ito pinakikitid.
- issue: Saklaw ng πρῶτον
  choice: “una sa kanyang mga alagad,” na nagbibigay-priyoridad sa unang kausap.
  alternative: “Una sa lahat, sinabi niya sa kanyang mga alagad,” bilang panandang pandiskurso.
  rationale: Maaaring ikabit ang πρῶτον sa prayoridad ng kausap o sa pagkakasunod ng pahayag. Pinananatili ng salin ang malamang na diwang naratibo nang hindi iginigiit ang isang detalyadong pagkakasunod na hindi tahasang sinabi.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang biblikal na talinghagang “lebadura,” habang iniwasan ang kahoy na sintaks at labis na interpretasyon.
