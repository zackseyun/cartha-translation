base_translation:
  language: en
  yaml_path: translation/nt/luke/012/050.yaml
  text: But I have a baptism to undergo[c][b][a], and how distressed I am until it is accomplished.
translation:
  language: tl
  text: Ngunit may bautismo akong dapat pagdaanan[a][b], at gayon na lamang ang pagkabalisa ko[c] hanggang sa ito ay maganap!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “may bautismong kailangan kong tanggapin.” Sa Griyego, tahasang inuulit ang salitang-ugat ng “bautismo”: “may bautismong dapat kong bautismuhan.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “bautismo” rito ay metaporikal at tumutukoy sa matinding pagdurusang malapit nang pagdaanan ni Jesus.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “gayon na lamang ang pagkagipit ko” o “gayon na lamang ang pagkapuwersa sa akin” hanggang sa ito ay maganap.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: bautismo
  rationale: Pinananatili ang tahasang larawan ng bautismo sa Griyego sa halip na tuwirang palitan ito ng “pagdurusa” o “kamatayan.”
- source_word: ἔχω βαπτισθῆναι
  choice: may bautismo akong dapat pagdaanan
  rationale: Likas sa makabagong Tagalog ang “dapat pagdaanan” at ipinahahayag nito ang nalalapit na pangangailangan o pananagutan, habang nananatili ang bautismo bilang pangunahing larawan.
- source_word: πῶς
  choice: gayon na lamang
  rationale: Ipinahahayag nito ang padamdam at tindi ng πῶς sa natural na paraang Tagalog.
- source_word: συνέχομαι
  choice: ang pagkabalisa ko
  rationale: Ipinahahayag ang matinding panloob na pagkagipit o pagkapighati nang hindi lubusang isinasara ang mas malawak na diwa ng pagiging napipigil o naiipit.
- source_word: ἕως ὅτου
  choice: hanggang sa
  rationale: Karaniwan at malinaw na panandang temporal sa Tagalog para sa hantungan ng kalagayang inilalarawan.
- source_word: τελεσθῇ
  choice: ito ay maganap
  rationale: Ipinahahayag ang pagkakaroon ng ganap na katuparan ng pangyayari, nang hindi inaangkat ang natatanging pananalita ng Juan 19:30.
theological_decisions:
- issue: Ang metaporikal na tinutukoy ng “bautismo”
  choice: Pinanatili sa teksto ang “bautismo” bilang metapora sa darating na pagdurusa at kamatayan ni Jesus.
  alternative: Tuwirang isalin bilang “pagdurusa,” “kamatayan,” pangkalahatang matinding pagsubok, o literal na bautismo sa tubig.
  rationale: Itinuturo ng konteksto sa nalalapit na paghihirap ni Jesus, ngunit ang pagpapalit sa metapora ng isang tahasang paliwanag ay mag-aalis sa sadyang larawan at tensiyong taglay ng orihinal.
- issue: Saklaw ng συνέχομαι
  choice: pagkabalisa
  alternative: pagkagipit, pagiging naiipit, o pagiging napipigil
  rationale: Ang salita ay maaaring maglarawan ng matinding emosyonal na hirap o ng pagiging nasasakal ng isang puwersa o pananagutan. Ang pangunahing salin ay malinaw at natural, habang inilalahad sa talababa ang tunay na saklaw ng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang metapora ng bautismo at ang padamdam na tindi ng pahayag. Ang “pagdaanan” at “maganap” ay likas sa karaniwang gamit ngunit sapat na pormal para sa tekstong biblikal.
