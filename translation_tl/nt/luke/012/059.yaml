base_translation:
  language: en
  yaml_path: translation/nt/luke/012/059.yaml
  text: I tell you[a], you will certainly not get out of there until you have paid even the last lepton.
translation:
  language: tl
  text: Sinasabi ko sa iyo, hinding-hindi ka makalalabas mula roon hangga't hindi mo nabayaran maging ang kahuli-hulihang lepton.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “ang kahuli-hulihang maliit na barya.” Ang lepton ay isang napakaliit na barya.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω σοι
  choice: Sinasabi ko sa iyo
  rationale: Natural na pormula ng tuwirang pakikipag-usap na pinananatili ang pangkasalukuyang anyo at personal na diin.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: hinding-hindi ka makalalabas
  rationale: Ipinahahayag ng οὐ μή kasama ng aorist subjunctive ang mariing pagtanggi sa isang mangyayari sa hinaharap; malinaw itong naihahatid ng “hinding-hindi.”
- source_word: ἐκεῖθεν
  choice: mula roon
  rationale: Tuwirang ipinahahayag ang kahulugang paglabas mula sa lugar na tinutukoy.
- source_word: ἕως
  choice: hangga't hindi
  rationale: Sa pangungusap na may mariing negatibong pangunahing sugnay, natural sa Filipino ang “hangga't hindi” upang tukuyin ang kundisyong dapat munang matupad.
- source_word: καὶ τὸ ἔσχατον
  choice: maging ang kahuli-hulihang
  rationale: Ang “maging” ay naghahatid sa intensibong gamit ng καί, at ang “kahuli-hulihan” ay nagdiriin sa ganap na kabuuan ng pagbabayad.
- source_word: λεπτόν
  choice: lepton
  rationale: Pinananatili ang tiyak na makasaysayang pangalan ng napakaliit na baryang Griyego; ipinaliliwanag ito sa talababa.
- source_word: ἀποδῷς
  choice: mo nababayaran
  rationale: Ipinahihiwatig ng aorist subjunctive pagkatapos ng ἕως ang pagkumpleto ng kabayaran bago makalabas; ang anyong ito ay natural sa Filipino sa nasabing konstruksyon.
theological_decisions:
- issue: Kahulugan ng larawan ng pagkakautang at pagkabilanggo
  choice: Panatilihin ang larawan ng pagkakakulong hanggang sa ganap na mabayaran ang utang nang hindi tinutukoy ang teolohikal na kahulugan nito.
  alternative: Ipaliwanag ito bilang babala tungkol sa prosesong legal sa lupa, paghuhukom ng Diyos, o parusang purgatoryal.
  rationale: Hindi tahasang tinutukoy ng talata kung ano ang sinasagisag ng pagkakakulong at pagbabayad. Ang di-mapagpasyang salin ay nagpapanatili sa tunay na teolohikal na tensiyon at umiiwas sa pagpasok ng doktrinang wala mismo sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hinding-hindi” para sa mariing negasyon at pinanatili ang “lepton” para sa katumpakang pangkasaysayan, na may paliwanag sa talababa.
