  text: καὶ ⸀ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ὥρᾳ οὐ δοκεῖτε ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/040.yaml
  text: You also must be ready[c][b][a], because the Son of Man is coming at an hour you do not expect.
translation:
  language: tl
  text: Maging handa rin kayo,[a] sapagkat darating ang Anak ng Tao[b] sa oras na hindi ninyo inaasahan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kayo rin ay maging handa.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “ang Anak ng Tao,” isang titulong ginagamit ni Jesus para sa sarili, na malamang ay may alingawngaw ng Daniel 7:13–14.
    reason: cross_reference
  - marker: c
    text: Maaari ring “sa oras na hindi ninyo iniisip” o “kapag hindi ninyo ito inaasahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς
  choice: Kayo rin
  rationale: 'Ipinakikita ng καὶ kasama ng hayag na ὑμεῖς na kabilang at binibigyang-diin ang mga kausap: gaya ng mga lingkod sa naunang paglalarawan, kailangan din nilang maging handa.'
- source_word: γίνεσθε ἕτοιμοι
  choice: dapat maging handa
  rationale: Ang pangkasalukuyang pautos na γίνεσθε ay nananawagan ng patuloy na kalagayan o disposisyon ng pagiging handa. Likas sa modernong Tagalog ang “dapat maging handa” at malinaw nitong naihahatid ang bigat ng utos.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala ng ὅτι ang dahilan ng utos. Ang “sapagkat” ay malinaw, marangal, at angkop sa rehistro ng salin.
- source_word: ᾗ ὥρᾳ οὐ δοκεῖτε
  choice: sa oras na hindi ninyo inaasahan
  rationale: Temporal ang gamit ng pariralang datibo, at sa kontekstong ito ang δοκεῖτε ay tumutukoy sa inaakalang o inaasahang panahon. Pinananatili ng salin ang di-tiyak at di-inaasahang oras.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Ito ang kinikilalang literal na salin ng titulong ginagamit ni Jesus para sa sarili at pinananatili nito ang posibleng ugnayan sa Daniel 7:13–14.
- source_word: ἔρχεται
  choice: darating
  rationale: Bagaman pangkasalukuyan ang anyong Griyego, may futuristikong gamit ito rito. Ang “darating” ang natural na paraan sa Tagalog upang ipahayag ang nalalapit na pagdating sa kontekstong ito nang hindi nagdaragdag ng sistemang eskatolohikal.
theological_decisions:
- issue: Pagsasalin sa kristolohikal na titulong ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  alternative: ang Taong Anak / ang Isang Tao
  rationale: Pinananatili ng “Anak ng Tao” ang pormal na anyo ng titulo at ang mesiyaniko at apokaliptikong alingawngaw nito, lalo na ang posibleng kaugnayan sa Daniel 7, nang hindi ipinapasok sa teksto ang dagdag na paliwanag.
- issue: Temporal na bisa ng ἔρχεται sa babalang eskatolohikal
  choice: darating
  alternative: dumarating
  rationale: Maaaring futuristiko ang pangkasalukuyang Griyego. Sa Tagalog, ang “darating” ang idiomatikong anyo para sa tiyak ngunit hindi alam na panahon ng pagdating; ang “dumarating” ay maaaring maling maunawaan bilang nagaganap na o paulit-ulit na kilos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sapagkat” upang mapanatili ang dignidad nang hindi nagiging lipas, at iniwasan ang mas teknikal o denominasyonal na pananalita.
