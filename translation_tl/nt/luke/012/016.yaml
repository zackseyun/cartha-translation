base_translation:
  language: en
  yaml_path: translation/nt/luke/012/016.yaml
  text: Then he told them a parable[a], saying, “The land of a certain rich man produced abundantly.”
translation:
  language: tl
  text: 'At isinalaysay niya sa kanila ang isang talinghaga: “Ang lupain ng isang mayamang lalaki ay namunga nang sagana.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagbigay ng masaganang ani” o “naging napakabunga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: At isinalaysay niya
  rationale: Ang δέ ay isang banayad na pang-ugnay, kaya ang “At” ay natural at hindi nagpapahiwatig ng matinding pagsalungat. Dahil ang παραβολή ang tuwirang layon, mas likas sa Filipino ang “isinalaysay” kaysa sa literal na “sinabi ang isang talinghaga.”
- source_word: παραβολὴν
  choice: isang talinghaga
  rationale: Ang “talinghaga” ang kinikilalang katawagan sa Filipino para sa παραβολή bilang natatanging anyo ng pagtuturo sa mga Ebanghelyo.
- source_word: πρὸς αὐτοὺς
  choice: sa kanila
  rationale: Tuwirang pinananatili nito ang mga taong pinatutungkulan ni Jesus.
- source_word: λέγων
  choice: ipinakilala sa pamamagitan ng tutuldok
  rationale: Ipinakikilala ng participle ang mismong nilalaman ng talinghaga. Sa natural na Filipino, sapat at malinaw ang tutuldok bago ang sipi, sa halip na ulitin ang “na sinasabi.”
- source_word: Ἀνθρώπου τινὸς πλουσίου
  choice: ng isang mayamang lalaki
  rationale: 'Ang parirala ay nagpapakita ng pag-aari: ang lupain ay sa isang mayamang lalaki. Sinasalamin ng “isang” ang di-tiyak na τινός, habang pinananatili ng “lalaki” ang panlalaking reperente.'
- source_word: εὐφόρησεν
  choice: namunga nang sagana
  rationale: Tumutukoy ang pandiwa sa mahusay o masaganang pamumunga ng lupain. Ang “namunga nang sagana” ay natural, maikli, at pinananatili ang larawang agrikultural.
- source_word: ἡ χώρα
  choice: ang lupain
  rationale: Sa konteksto, tumutukoy ang χώρα sa lupaing pansakahan o pag-aari, hindi sa isang bansa. Mas angkop ang “lupain” kaysa “bansa” o ang mas makitid na “bukid.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tradisyonal ngunit karaniwang nauunawaang “talinghaga,” at ginamit ang natural na ayos ng pangungusap nang hindi pinapawi ang detalye ng Griyego.
