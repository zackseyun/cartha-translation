translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “mga tao” sa halip na mas teknikal o makalumang “mga pulutong,” at “nagkakagayon nga” upang mapanatili ang maikli ngunit mariing pagtatapos ng Griyego.
