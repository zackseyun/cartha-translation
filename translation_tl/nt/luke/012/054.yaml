  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τοῖς ὄχλοις· Ὅταν ⸀ἴδητε νεφέλην ἀνατέλλουσαν ⸀ἐπὶ δυσμῶν, εὐθέως λέγετε ⸀ὅτι Ὄμβρος ἔρχεται, καὶ γίνεται οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/054.yaml
  text: He was also saying to the crowds[a], “When you see a cloud rising in the west, you immediately say, ‘A rainstorm is coming,’ and so it happens.”
translation:
  language: tl
  text: Sinabi rin niya sa mga tao, “Kapag nakakita kayo ng ulap na tumataas sa kanluran, agad ninyong sinasabi, ‘May paparating na malakas na ulan[a],’ at ganoon nga ang nangyayari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ulan.” Ang salitang Griyego na ὄμβρος ay maaaring tumukoy sa ulan sa pangkalahatan o, nang mas tiyak, sa malakas na ulan o buhos ng ulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Sinabi
  rationale: Bagaman imperfect ang pandiwa at maaaring magpahiwatig ng nagpapatuloy na pagsasalita, mas natural sa salaysay na Tagalog ang “Sinabi”; hindi kinakailangang gawing “patuloy niyang sinasabi” sa kontekstong ito.
- source_word: δὲ καὶ
  choice: rin
  rationale: Ipinahahayag ng “rin” ang dagdag na pahayag sa naunang sinabi, nang hindi labis na isinasalin ang banayad na pang-ugnay na δέ.
- source_word: τοῖς ὄχλοις
  choice: sa mga tao
  rationale: Pinananatili ng “mga tao” ang diwang maramihan at mas natural ito sa modernong Tagalog kaysa “sa mga karamihan” o “sa mga pulutong.”
- source_word: Ὅταν ἴδητε
  choice: Kapag nakakita kayo
  rationale: Natural na ipinahahayag ng “kapag” ang pangkalahatan o paulit-ulit na kundisyon ng ὅταν na may subjunctive.
- source_word: νεφέλην
  choice: ulap
  rationale: Ang salita ay payak na nangangahulugang “ulap”; hindi idinagdag sa mismong salita ang ideya ng ulang dala nito.
- source_word: ἀνατέλλουσαν
  choice: na tumataas
  rationale: Tuwirang pinananatili nito ang larawan ng ulap na umaangat o lumilitaw sa abot-tanaw.
- source_word: ἐπὶ δυσμῶν
  choice: sa kanluran
  rationale: Natural na lokatibong pananalita sa Tagalog para sa ulap na nakikitang tumataas sa gawing kanluran.
- source_word: εὐθέως
  choice: agad
  rationale: Maikli, natural, at tumpak na katumbas ng agarang pagkilos.
- source_word: λέγετε
  choice: ninyong sinasabi
  rationale: Ang kasalukuyang aspekto ay nagpapahayag ng nakagawiang tugon; malinaw itong naihahatid sa konstruksyong Tagalog.
- source_word: ὅτι
  choice: panandang ipinahihiwatig ng tuwirang sipi
  rationale: Ipinakikilala nito ang nilalaman ng sinasabi; sa Tagalog, natural itong katawanin ng bantas at tuwirang sipi.
- source_word: Ὄμβρος
  choice: malakas na ulan
  rationale: Maaaring tumukoy ang ὄμβρος sa ulan sa pangkalahatan o sa buhos/malakas na ulan. Pinili ang natural na “malakas na ulan,” habang inilalagay sa talababa ang mas pangkalahatang posibilidad.
- source_word: ἔρχεται
  choice: May paparating
  rationale: Natural na Tagalog para sa nalalapit na pagdating ng ulan at pinananatili ang imminenteng puwersa ng kasalukuyang panahunan.
- source_word: καὶ γίνεται οὕτως
  choice: at nagkakagayon nga
  rationale: Pinananatili ang diwa na ang hinulaang pangyayari ay talagang nagaganap, kasama ang pagpapatibay ng οὕτως.
