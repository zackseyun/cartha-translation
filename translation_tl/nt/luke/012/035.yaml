translation:
  language: tl
  text: Panatilihing nakabigkis ang inyong mga damit sa baywang at nagliliyab ang inyong mga ilawan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Maging handa kayong kumilos.” Ang larawan ay ng pagtitipon at pagtatali sa baywang ng mahabang kasuotan upang malayang makakilos.
    reason: cultural_note
lexical_decisions:
- source_word: Ἔστωσαν
  choice: Lagi kayong ... at panatilihing
  rationale: Ang ikatlong panauhang pangkasalukuyang pautos ay ginawang natural na tuloy-tuloy na paghimok sa Tagalog. Ang “lagi” at “panatilihing” ay nagpapahayag ng patuloy na kahandaan.
- source_word: ὑμῶν
  choice: kayong / inyong
  rationale: Ang genitibong panghalip ay may diwang paari para sa dalawang parirala; inayos ito ayon sa likas na balangkas ng Tagalog.
- source_word: ὀσφύες
  choice: baywang
  rationale: Tumutukoy ito sa bahagi ng katawan sa may balakang o baywang. Ang “baywang” ay malinaw at makabagong salita, hindi tulad ng mas makalumang “balakang” sa ganitong idyoma.
- source_word: περιεζωσμέναι
  choice: nakabigkis
  rationale: Pinananatili ng “nakabigkis” ang konkretong larawan ng damit na natipon at naitali sa baywang bilang paghahanda sa pagkilos, gayundin ang resultang kalagayan ng perfect passive participle.
- source_word: λύχνοι
  choice: mga ilawan
  rationale: Ang λύχνος ay konkretong ilawang de-langis, hindi abstraktong liwanag. Ang “ilawan” ang likas at tiyak na katumbas.
- source_word: καιόμενοι
  choice: nagliliyab
  rationale: Ipinahihiwatig ng present participle ang nagpapatuloy na pagliyab. Kasama ng “panatilihing,” malinaw na hindi lamang sinindihan kundi patuloy na umaapoy ang mga ilawan.
theological_decisions:
- issue: Idyomatikong larawan ng kahandaan
  choice: Panatilihin sa pangunahing teksto ang konkretong larawan ng pagkakabigkis sa baywang.
  alternative: Maging handa kayong kumilos / Ihanda ninyo ang inyong kasuotan para sa pagkilos.
  rationale: Ang Griyego ay gumagamit ng isang tiyak na larawang pangkultura. Hindi ito pinalitan ng purong pagpapakahulugan upang mapanatili ang talinghaga at ang puwang nito, ngunit ipinaliwanag sa talababa ang ipinahihiwatig na kahandaan.
translation_notes:
  register: Makabago at marangal na Filipino. Ang “nakabigkis sa baywang” ay bahagyang mataas ang antas ngunit madaling maunawaan at mahalaga upang mapanatili ang sinaunang larawan; ipinapaliwanag ng talababa ang kahulugang pangkultura.
