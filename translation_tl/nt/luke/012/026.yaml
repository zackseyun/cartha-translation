  yaml_path: translation/nt/luke/012/026.yaml
  text: If[a], then, you are not able to do even the smallest thing, why are you anxious about the rest?
translation:
  language: tl
  text: Kung gayon, kung hindi ninyo kayang gawin kahit ang pinakamaliit na bagay, bakit kayo nag-aalala tungkol sa mga natitirang bagay?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: Kaya, kung
  rationale: Pinananatili nito ang kondisyon ng εἰ at ang paghinuha ng οὖν mula sa naunang sinabi, sa likas na ayos ng modernong Tagalog.
- source_word: οὐδὲ ἐλάχιστον
  choice: kahit ang pinakamaliit na bagay
  rationale: Ang ἐλάχιστον ay substantibong neuter at tumutukoy sa pinakamaliit o pinakakaunting bagay; nilinaw ng “bagay” ang elipsis nang hindi pinalalawak ang diwa.
- source_word: δύνασθε
  choice: hindi ninyo kayang gawin
  rationale: Ipinahahayag nito ang kakayahan o kawalan ng kakayahan, at likas itong kaugnay ng ipinahiwatig na paggawa sa pangungusap.
- source_word: τί
  choice: bakit
  rationale: Sa retorikal na tanong na ito, ang τί ay tumutukoy sa dahilan at likas na isinasalin bilang “bakit.”
- source_word: περὶ τῶν λοιπῶν
  choice: tungkol sa iba pa
  rationale: Tinutukoy ng τῶν λοιπῶν ang natitirang mga bagay bukod sa “pinakamaliit na bagay”; maikli at likas sa Tagalog ang “iba pa.”
- source_word: μεριμνᾶτε
  choice: nag-aalala
  rationale: Ipinapahayag nito ang patuloy na pag-aalala sa konteksto, nang hindi ipinahihiwatig na ipinagbabawal ang lahat ng maingat na pag-iisip.
theological_decisions:
- issue: Diwa ng μεριμνάω sa turo ni Jesus tungkol sa pagtitiwala sa Diyos
  choice: nag-aalala
  alternative: nababalisa; nag-aasikaso
  rationale: Ang “nag-aalala” ay tumutukoy sa di-nararapat na pag-aalala sa konteksto, ngunit hindi nito awtomatikong itinuturing na mali ang lahat ng wastong pagmamalasakit o paghahanda.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Pinanatili ang retorikal na kondisyon at ang paghinuha mula sa naunang argumento.
