  text: So is the one who stores up treasure for himself and is not rich toward God[a].
translation:
  language: tl
  text: Gayon din ang taong nag-iipon ng kayamanan para sa sarili ngunit hindi mayaman sa harap ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mayaman para sa Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Gayon din
  rationale: Inilalapat nito sa nakikinig ang kalagayang inilarawan sa naunang talinghaga; natural at mariing panapos ito sa Filipino.
- source_word: ὁ θησαυρίζων
  choice: ang taong nag-iipon ng kayamanan
  rationale: Ang may artikulong pangkasalukuyang pandiwaring Griyego ay tumutukoy sa sinumang taong kinikilala sa ganitong gawain. Pinananatili ng parirala ang tahasang diwa ng pag-iimbak ng kayamanan.
- source_word: ἑαυτῷ
  choice: para sa sarili
  rationale: Ipinahahayag ng datibong reflexive na ang pag-iipon ay para sa sariling kapakinabangan.
- source_word: καὶ μὴ
  choice: ngunit hindi
  rationale: Bagaman karaniwang 'at' ang καί, likas sa Filipino ang 'ngunit' upang ihayag ang malinaw na paghahambing ng dalawang magkasalungat na kalagayan nang hindi binabago ang diwa.
- source_word: εἰς θεόν
  choice: sa harap ng Diyos
  rationale: Sa pagkakaugnay nito sa πλουτέω, maaaring ipahiwatig ng εἰς ang kaugnayan o pagtataya ng Diyos. Ang 'sa harap ng Diyos' ay natural sa Filipino; itinatala sa talababa ang mas literal na direksiyonal na pagbasa.
- source_word: πλουτῶν
  choice: mayaman
  rationale: Ang pandiwari ay likas na naihahayag bilang pang-uri sa Filipino at pinananatili ang paghahambing sa naipong kayamanan.
theological_decisions:
- issue: Pangkalahatang tinutukoy ng panlalaking isahang pandiwari
  choice: ang taong
  alternative: ang lalaking
  rationale: Bagaman panlalaking isahan ang anyong Griyego, substantibong pangkalahatan ang gamit nito. Ang 'taong' ay natural at tumpak sa Filipino at hindi nililimitahan sa mga lalaki ang moral na aplikasyon.
- issue: Kahulugan ng εἰς θεὸν πλουτῶν
  choice: mayaman sa harap ng Diyos
  alternative: mayaman para sa Diyos / mayaman tungo sa Diyos
  rationale: Hindi tahasang ipinapaliwanag ng talata kung ano ang bumubuo sa ganitong kayamanan. Pinananatili ng salin ang kaugnayan sa Diyos nang hindi ito pinalalawak bilang isang tiyak na doktrinal na paliwanag; inilalahad sa talababa ang mas literal na alternatibo.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang 'Gayon din' bilang maikli at mariing paglalapat ng talinghaga, at iniwasan ang pagpapaliwanag kung ano mismo ang ibig sabihin ng pagiging mayaman kaugnay ng Diyos.
