- from: Ngunit maging ang lahat ng buhok sa inyong ulo ay bilang na. Kaya huwag kayong matakot; higit kayong mahalaga kaysa sa maraming maya.
  to: Ngunit maging ang lahat ng buhok sa inyong ulo ay binilang na. Huwag kayong matakot; higit kayong mahalaga kaysa sa maraming maya.
  rationale: Pinalitan ang “bilang na” ng “binilang na” upang malinaw na maipakita ang natapos na pagbibilang na may kasalukuyang resulta, at inalis ang “Kaya” upang huwag magdagdag ng ugnayang hindi tahasang nasa pinagmulan. Pinanatili ang maramihang panghalip, ang larawan ng mga buhok, at ang paghahambing ng halaga sa maraming maya.
