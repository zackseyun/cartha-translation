base_translation:
  language: en
  yaml_path: translation/nt/luke/012/007.yaml
  text: But even the hairs of your head have all been counted[a]. Do not fear[b]; you are worth more than many sparrows.
translation:
  language: tl
  text: Ngunit maging ang lahat ng buhok sa inyong ulo ay binilang na. Huwag kayong matakot; higit kayong mahalaga kaysa sa maraming maya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Ngunit maging
  rationale: Pinananatili ang pagsalungat ng ἀλλά at ang pagpapadiin ng καί, habang natural ang daloy sa makabagong Tagalog.
- source_word: αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι
  choice: ang lahat ng buhok sa inyong ulo
  rationale: Likas na Tagalog na nagpapanatili sa kongkretong larawan at sa saklaw ng πᾶσαι, na tumutukoy sa lahat ng buhok.
- source_word: ἠρίθμηνται
  choice: ay bilang na
  rationale: Ipinahihiwatig ng perpektong pasibo na natapos na ang pagbibilang at nananatili ang resulta; maikli at malinaw ang 'bilang na' sa Tagalog.
- source_word: μὴ φοβεῖσθε
  choice: huwag kayong matakot
  rationale: Direkta, natural, at maramihang pautos na katumbas ng anyong Griyego.
- source_word: πολλῶν στρουθίων
  choice: sa maraming maya
  rationale: Ang 'maya' ang karaniwang makabagong katawagan sa maliit na ibong tinutukoy sa agarang konteksto at pinananatili nito ang ugnayan sa naunang talata.
- source_word: διαφέρετε
  choice: higit kayong mahalaga kaysa
  rationale: Sa konteksto, ang pandiwa ay nagpapahayag ng nakahihigit na halaga, hindi lamang pagiging naiiba.
theological_decisions:
- issue: Paghahambing sa halaga ng mga alagad at ng mga maya
  choice: higit kayong mahalaga kaysa sa maraming maya
  alternative: mas malaki ang halaga ninyo kaysa sa maraming maya
  rationale: Malinaw nitong ipinapahayag ang pangangatwiran mula sa mas maliit tungo sa mas mahalaga tungkol sa mapagmalasakit na kaalaman ng Diyos, nang hindi nagdaragdag ng mas malawak na doktrinang hindi tahasang sinasabi ng talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang maramihang 'inyong/kayong' upang tumpak na katawanin ang mga anyong pangmaramihan sa Griyego. Walang footnote dahil walang tekstuwal o leksikal na kalabuan dito na kailangang ilahad para sa karaniwang mambabasa.
