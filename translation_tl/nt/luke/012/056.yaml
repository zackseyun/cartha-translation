  text: ὑποκριταί, τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ οἴδατε δοκιμάζειν, τὸν ⸂δὲ καιρὸν⸃ τοῦτον πῶς ⸂οὐκ οἴδατε δοκιμάζειν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/056.yaml
  text: Hypocrites! You know how to interpret the appearance of the earth and the sky[a], but how is it that you do not know how to interpret this time?
translation:
  language: tl
  text: Mga mapagkunwari! Marunong kayong kumilala sa anyo ng lupa at ng langit, ngunit paanong hindi ninyo makilala ang panahong ito[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapanahunang ito” o “mapagpasyang panahong ito.” Ang Griyegong καιρός ay maaaring tumukoy sa isang makabuluhan o angkop na panahon, hindi lamang sa panahon sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριταί
  choice: Mga mapagkunwari
  rationale: Tuwirang panawag at pagsaway ito sa mga taong hindi tapat ang ipinakikita; natural at malinaw ito sa makabagong Tagalog.
- source_word: πρόσωπον
  choice: anyo
  rationale: Sa pariralang ito, tumutukoy ang salita sa nakikitang kalagayan o hitsura, hindi sa literal na mukha.
- source_word: γῆς καὶ τοῦ οὐρανοῦ
  choice: lupa at langit
  rationale: Ang tambalang ito ay tumutukoy sa nakikitang lupa at kalangitan na pinagmamasdan upang matukoy ang lagay ng panahon; pinananatili ng “langit” ang natural na pananalita sa Tagalog.
- source_word: οἴδατε δοκιμάζειν
  choice: marunong kayong unawain
  rationale: Ipinahahayag ng οἴδατε kasama ng pawatas ang kakayahang kumilala o umunawa batay sa pagsusuri. Ang “marunong … unawain” ay natural at nauunawaan ng karaniwang mambabasa.
- source_word: καιρὸν τοῦτον
  choice: panahong ito
  rationale: Direktang pinananatili nito ang demonstratibo at ang temporal na kahulugan nang hindi labis na tinutukoy kung bakit mahalaga o mapagpasya ang panahon.
- source_word: πῶς οὐκ οἴδατε δοκιμάζειν
  choice: ngunit bakit hindi ninyo maunawaan
  rationale: Ang πῶς ay isang mapanuyang retorikal na tanong. Sa Tagalog, “bakit” ang natural na naghahatid ng matinding pagsaway, habang inuulit ng “maunawaan” ang pangunahing diwa ng δοκιμάζειν.
theological_decisions:
- issue: Kahulugan ng καιρός sa pagsaway ni Jesus
  choice: panahong ito
  alternative: kapanahunang ito; mapagpasyang panahong ito
  rationale: Maaaring nagpapahiwatig ang καιρός ng isang makabuluhan o angkop na sandali, ngunit hindi tahasang ipinapaliwanag ng talata ang buong teolohikal na kabuluhan nito. Pinananatili ng salin ang tunay na lawak at tensiyon ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Tuwiran ang pagsaway, ngunit iniiwasan ang lipas o labis na teknikal na pananalita. Inilagay ang talababa pagkatapos ng “panahong ito,” ang mismong pariralang ipinapaliwanag nito.
