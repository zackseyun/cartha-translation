  naturalness: Natural ang karamihan ng draft, ngunit mas idiomatiko at mas malinaw ang “anyo ng lupa at ng langit.” Ang “kumilala” ay mas angkop sa pagkilala/pagkilatis ng mga palatandaan kaysa “unawain.”
