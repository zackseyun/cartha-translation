  yaml_path: translation/nt/luke/012/015.yaml
  text: Then he said to them, “Watch out and guard yourselves from every kind of greed, because a person’s life does not consist in the abundance of his possessions.”
translation:
  language: tl
  text: Pagkatapos, sinabi niya sa kanila, “Magmasid kayo at mag-ingat laban sa bawat uri ng kasakiman,[a] sapagkat ang buhay ng isang tao ay hindi nakasalalay sa dami ng kanyang mga ari-arian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “laban sa lahat ng pag-iimbot.” Ang salitang Griyego na πλεονεξία ay maaaring tumukoy sa kasakiman, pag-iimbot, o labis na paghahangad na magkaroon pa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Mag-ingat kayo
  rationale: Ang maramihang pautos ay isang matinding babala; natural at malinaw sa makabagong Tagalog ang “Mag-ingat kayo.”
- source_word: φυλάσσεσθε
  choice: bantayan ninyo ang inyong sarili
  rationale: Pinananatili nito ang reflexive na diwa ng gitna/pasibong pautos at ang hiwalay na diin nito kasunod ng unang babala.
- source_word: ἀπὸ πάσης πλεονεξίας
  choice: laban sa bawat uri ng kasakiman
  rationale: Malawak ang πλεονεξία at tumutukoy sa sakim na pagnanais na magkaroon pa; inilalarawan ng “bawat uri” ang saklaw ng πάσης.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang babala at angkop ang “sapagkat” sa marangal ngunit likas na rehistro.
- source_word: οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ αὐτοῦ ἐστιν
  choice: ang buhay ng isang tao ay hindi nakasalalay sa dami
  rationale: Likas na ipinahahayag sa Tagalog ng “hindi nakasalalay” na ang buhay ay hindi nababatay o nabubuo sa pagkakaroon ng kasaganaan.
- source_word: ἐκ τῶν ὑπαρχόντων αὐτῷ
  choice: ng kanyang mga ari-arian
  rationale: Sa konteksto, ang ὑπάρχοντα ay mga pag-aari o bagay na taglay ng tao; maikli at malinaw ang “mga ari-arian.”
theological_decisions:
- issue: Pangkalahatang panlalaking pahayag
  choice: ang buhay ng isang tao ... kanyang mga ari-arian
  alternative: ang kanyang buhay ... kanyang mga ari-arian
  rationale: Pangkalahatan ang tinutukoy ng τινί at αὐτοῦ, hindi lalaki lamang. Malinaw na ipinakikita ng “isang tao” ang pangkalahatang saklaw nang hindi binabago ang isahang anyo.
- issue: Saklaw ng πλεονεξία
  choice: bawat uri ng kasakiman
  alternative: lahat ng pag-iimbot
  rationale: Sinasaklaw ng salita ang malawak na sakim at mapag-angking pagnanais, hindi lamang ang pagnanasa sa pag-aari ng iba; pinananatili ng talababa ang leksikal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang magkatambal na “Mag-ingat” at “bantayan ... ang inyong sarili” upang mapanatili ang dalawang pautos sa Griyego; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
