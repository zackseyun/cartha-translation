  text: For where your treasure is[a], there your heart will be also.
translation:
  language: tl
  text: Sapagkat kung nasaan ang inyong kayamanan, doon din mapupunta ang inyong puso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Sapagkat saanman naroon ang inyong kayamanan, doon din mapupunta ang inyong puso.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: kung nasaan
  rationale: Natural na ipinakikilala sa Filipino ang sugnay na nagsasaad ng lugar at napapanatili ang pangkalahatang bisa ng kasabihan.
- source_word: γάρ
  choice: sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan nito sa naunang tagubilin.
- source_word: θησαυρός
  choice: kayamanan
  rationale: Tuwirang katumbas na likas sa Filipino at maaaring tumukoy kapwa sa yaman at sa bagay na lubhang pinahahalagahan.
- source_word: καρδία
  choice: puso
  rationale: Pinananatili ang biblikal na larawan ng sentro ng pagmamahal, hangarin, at paninindigan nang hindi nililimitahan sa isang aspektong sikolohikal.
- source_word: ἐκεῖ
  choice: naroon
  rationale: Pinananatili ang ugnayang panlugar na 'kung nasaan... naroon...' sa natural na Filipino.
- source_word: καὶ
  choice: din
  rationale: Ipinahahayag ang dagdag na diin na kasama ng kayamanan ang puso.
- source_word: ἔσται
  choice: '[ipinapahayag sa] naroon'
  rationale: Ang anyong 'naroon' ay natural na panaguri sa Filipino; bagaman hindi lantad ang panandang panghinaharap, ipinahahayag ng buong kasabihan ang tiyak na kalalabasan na nasa Griyegong future.
- source_word: ὑμῶν
  choice: inyong
  rationale: Magalang at maramihang panghalip na paari, na tumutugma sa ikalawang panauhang maramihan sa parehong paglitaw.
theological_decisions:
- issue: Kahulugang antropolohikal ng 'puso'
  choice: Panatilihin ang 'puso' bilang sentro ng pagmamahal, hangarin, at paninindigan ng tao.
  alternative: Isalin nang mas pagpapakahulugan bilang 'mga hangarin' o 'isip'.
  rationale: Pinananatili nito ang lawak ng biblikal na larawan at ang pampanitikang puwersa ng kasabihan nang hindi pinapaliit ang kahulugan.
- issue: Panghinaharap na ἔσται
  choice: Gamitin ang likas na Filipino na 'naroon din ang inyong puso'.
  alternative: 'Gawing lantad: ''naroon din mapupunta ang inyong puso''.'
  rationale: Ang 'mapupunta' ay maaaring magdagdag ng ideya ng paggalaw na wala sa pandiwang εἰμί. Ang payak na 'naroon' ay mas tapat sa panaguring panlugar at gumagana bilang tiyak na kasabihan sa Filipino.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinili ang 'sapagkat' at 'inyong' upang mapanatili ang dignidad at ang maramihang kausap, habang natural pa rin sa karaniwang mambabasa.
