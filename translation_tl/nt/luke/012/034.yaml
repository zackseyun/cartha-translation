  source_fidelity: Tumpak ang pangunahing ugnayang “kung nasaan ... naroon/doon din,” ang “kayamanan,” “puso,” at ang maramihang-magagalang na “inyong.” Gayunman, hindi naipapakita ng payak na “naroon” ang malinaw na panghinaharap na ἔσται. Ang “mapupunta” ay likas na paraan sa modernong Filipino upang maipahayag ang resultang panghinaharap ng kasabihan, bagaman may bahagyang idiomatikong larawan ng pagtuon/pagkiling.
  naturalness: Natural at marangal ang pangungusap. Mas karaniwan at mas malinaw ang pares na “kung nasaan ... doon din” kaysa “kung nasaan ... naroon din,” lalo na sa panghinaharap na pahayag na “mapupunta ang inyong puso.”
  terminology: Ang “kayamanan” ay angkop para sa θησαυρός, at ang “puso” ay wastong nagpapanatili sa malawak na biblikal na kahulugan ng καρδία. Ang “sapagkat” ay angkop na panandang nagpapaliwanag para sa γάρ.
