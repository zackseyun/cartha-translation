  text: Truly I tell you that he will appoint him over all that he has[a].
translation:
  language: tl
  text: 'Sinasabi ko sa inyo ang totoo: itatalaga niya siya upang mamahala sa lahat ng kanyang pag-aari.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lahat ng kanyang ari-arian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθῶς
  choice: Tunay na
  rationale: Nagbibigay-diin sa katotohanan at katiyakan ng pahayag at likas pakinggan sa marangal na makabagong Tagalog.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Pinananatili ang tuwirang pakikipag-usap at may-awtoridad na pormula ng pananalita.
- source_word: ὅτι
  choice: ':'
  rationale: Ginamit ang tutuldok upang likas na ipakilala sa Tagalog ang nilalaman ng sinasabi, nang hindi binabago ang ugnayang sintaktiko.
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: sa lahat ng kanyang ari-arian
  rationale: Ipinahahayag ang saklaw ng kapangyarihan sa lahat ng pag-aari ng panginoon; ang 'ari-arian' ay sapat na malawak upang tumukoy sa mga pag-aari o kayamanan.
- source_word: καταστήσει
  choice: pamamahalain niya
  rationale: Sa konteksto, nangangahulugan itong magtalaga o maglagay ng isang tao upang mamahala; natural na ipinahahayag ng 'pamamahalain' ang ipinagkatiwalang awtoridad.
- source_word: αὐτόν
  choice: siya
  rationale: Pinananatili ang isahang reperensiya sa lalaking tauhan ng talinghaga; bagaman walang gramatikal na kasarian ang panghalip sa Tagalog, malinaw ito mula sa konteksto.
theological_decisions:
- issue: Panlalaking panghalip sa tauhan ng talinghaga
  choice: Gamitin ang isahang “siya” ayon sa konteksto
  alternative: Gumamit ng tahasang katawagang “ang lingkod” o anyong maramihan na neutral sa kasarian
  rationale: Masusing tinutukoy ng Griyego ang iisang lalaking tauhan. Ang natural na Tagalog na “siya” ay hindi minamarkahan ang kasarian ngunit hindi rin ginagawang maramihan o binabago ang reperensiya.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang “pamamahalain” kaysa sa mas literal ngunit di-gaanong tiyak na “ilalagay” upang maipahayag ang awtoridad na ipinagkakatiwala sa konteksto.
