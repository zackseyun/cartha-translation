    rationale: Ang τὰ ὑπάρχοντα αὐτοῦ ay “mga pag-aari/ari-arian niya,” hindi mga taong kaniyang tinatangkilik.
  - severity: low
    issue: Medyo mabigat ang pandiwang “pamamahalain.”
    rationale: Bagaman nauunawaan at hindi mali ang diwa, mas malinaw at karaniwan sa makabagong Tagalog ang “itatalaga niya siya upang mamahala,” na tuwirang naghahayag ng καταστήσει at ng awtoridad na ipinagkakatiwala.
  revised_text: 'Sinasabi ko sa inyo ang totoo: itatalaga niya siya upang mamahala sa lahat ng kanyang pag-aari.[a]'
