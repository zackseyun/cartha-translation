  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: ang nagsasalita ay mariing nagpapatunay na itatalaga ng panginoon ang lingkod upang mamahala sa lahat ng pag-aari ng panginoon. Gayunman, ang “mga tinatangkilik” sa talababa ay hindi wastong leksikal na kapalit ng τὰ ὑπάρχοντα, na tumutukoy sa mga pag-aari o ari-arian.'
  naturalness: Nauunawaan ang kasalukuyang salin, ngunit mas tuwiran at likas ang “Itatalaga niya siya upang mamahala...” kaysa “pamamahalain niya siya.” Ang “Sinasabi ko sa inyo ang totoo” ay makabago at pinananatili ang mariing pormula ng ἀληθῶς λέγω ὑμῖν.
  terminology: “Pag-aari” ay malawak at angkop para sa τὰ ὑπάρχοντα; hindi nito nililimitahan ang kahulugan sa lupain o gusali lamang. Ang “ari-arian” ay maaaring ilagay bilang leksikal na alternatibo. Hindi angkop ang “mga tinatangkilik,” na karaniwang tumutukoy sa mga taong sinusuportahan o pinoprotektahan.
  issues:
