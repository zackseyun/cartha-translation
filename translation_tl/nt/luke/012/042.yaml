  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂καὶ εἶπεν⸃ ὁ κύριος· Τίς ἄρα ἐστὶν ὁ πιστὸς οἰκονόμος, ⸀ὁ φρόνιμος, ὃν καταστήσει ὁ κύριος ἐπὶ τῆς θεραπείας αὐτοῦ τοῦ διδόναι ἐν καιρῷ ⸀τὸ σιτομέτριον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/042.yaml
  text: And the Lord said[a], “Who then is the faithful and prudent steward[b], whom the master will appoint over his household staff to give them their food allowance at the proper time?”
translation:
  language: tl
  text: At sinabi ng Panginoon, “Sino nga ang tapat at matalinong[a] katiwala na itatalaga ng kaniyang amo upang mamahala sa mga tauhan sa sambahayan ng amo at magbigay sa kanila ng nakatalagang rasyon ng pagkain[b] sa tamang panahon?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “may mahusay na pagpapasiya” o “marunong.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal na kahulugan, “ang rasyon ng butil,” samakatuwid ay ang sinukat na bahagi ng pagkain na itinakda para sa bawat tauhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Panginoon / amo
  rationale: Isinalin ang unang ὁ κύριος bilang “Panginoon” sapagkat tumutukoy ito kay Jesus bilang nagsasalita. Ang ikalawa ay “amo” sapagkat tumutukoy ito sa may-ari ng sambahayan sa loob ng talinghaga. Iisang salitang Griyego ang ginamit, ngunit hinihingi ng magkaibang antas ng salaysay ang natural na pagkakaibang ito sa Tagalog.
- source_word: πιστός
  choice: tapat
  rationale: Ipinahihiwatig dito ang pagiging mapagkakatiwalaan sa tungkuling ipinagkatiwala; malinaw at likas sa konteksto ang “tapat.”
- source_word: οἰκονόμος
  choice: katiwala
  rationale: Ang οἰκονόμος ay taong pinagkatiwalaang mamahala sa sambahayan o ari-arian. Pinananatili ng “katiwala” ang diwa ng pananagutang ipinagkaloob, hindi lamang pangkalahatang pamamahala.
- source_word: φρόνιμος
  choice: matalino
  rationale: Tumutukoy ito sa praktikal na karunungan at mahusay na pagpapasiya. Natural sa karaniwang Tagalog ang “matalino,” habang inilalahad sa talababa ang mas tiyak na alternatibo.
- source_word: καταστήσει
  choice: itatalaga
  rationale: Sa kontekstong ito, nangangahulugan ang pandiwa ng paglalagay sa isang posisyon ng pananagutan; malinaw itong ipinapahayag ng “itatalaga.”
- source_word: θεραπεία
  choice: mga tauhan ng sambahayan
  rationale: Dito, ang θεραπεία ay kolektibong tumutukoy sa pangkat ng mga tagapaglingkod o tauhan, hindi sa abstraktong paglilingkod o panggagamot.
- source_word: ἐν καιρῷ
  choice: sa tamang panahon
  rationale: Ipinapahayag nito ang angkop o itinakdang oras; malinaw at natural ang “sa tamang panahon.”
- source_word: σιτομέτριον
  choice: takdang pagkain
  rationale: Ang salita ay tumutukoy sa sinukat at iniukol na rasyon, na sa kasaysayang konteksto ay rasyon ng butil. Inihahatid ng “takdang pagkain” ang tungkuling mamahagi, at pinananatili sa talababa ang literal na detalye.
theological_decisions:
- issue: Magkaibang salin sa dalawang paglitaw ng κύριος
  choice: “Panginoon” para kay Jesus na nagsasalita; “amo” para sa may-ari ng sambahayan sa talinghaga
  alternative: “Panginoon” sa dalawang paglitaw
  rationale: Iisang terminong Griyego ang nasa dalawang lugar, ngunit magkaiba ang agarang tinutukoy. Pinananatili ng saling ito ang titulo ni Jesus at nililinaw ang panloob na tauhan ng talinghaga nang hindi ipinagpapalagay na magkaiba ang saklaw ng salitang κύριος.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “katiwala” upang mapanatili ang diwa ng ipinagkatiwalang pamamahala, at “mga tauhan ng sambahayan” upang linawin ang kolektibong kahulugan ng θεραπεία. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto at tumutugma sa kani-kanilang talababa.
