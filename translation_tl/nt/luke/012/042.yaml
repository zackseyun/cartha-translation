  to: At sinabi ng Panginoon, “Sino nga ang tapat at matalinong[a] katiwala na itatalaga ng kaniyang amo upang mamahala sa mga tauhan sa sambahayan ng amo at magbigay sa kanila ng nakatalagang rasyon ng pagkain[b] sa tamang panahon?”
  rationale: Pinalitan ang malabong “sambahayan nito” ng “sambahayan ng amo” upang malinaw na maipakita ang tinutukoy ng αὐτοῦ. Pinalitan din ang “takdang pagkain” ng “nakatalagang rasyon ng pagkain” upang mas tumpak na maihatid ang σιτομέτριον. Hindi binago ang saklaw o diwa ng talinghaga, at napanatili ang mga panandang talababa sa kanilang kaukulang salita.
