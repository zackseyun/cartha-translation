  to: Pag-isipan ninyo ang mga uwak:[a] hindi sila naghahasik at hindi rin umaani; wala silang silid-imbakan o kamalig,[b] at pinapakain sila ng Diyos. Gaano pa nga kayong higit na mahalaga kaysa sa mga ibon![c]
  rationale: Pinalitan ang pangatnig na nagpapahiwatig ng pagsalungat ng payak na “at,” alinsunod sa καί, at pinalitan ang causative na “pinakakain” ng “pinapakain” upang maipahayag ang tuwirang, patuloy na pagpapakain ng Diyos. Inayos din ang pares ng negasyong pandiwa para sa mas natural na modernong Filipino. Napanatili ang lahat ng footnote anchor at ang pagkakaiba ng dalawang katawagan sa imbakan.
