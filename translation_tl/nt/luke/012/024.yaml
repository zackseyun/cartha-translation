id: LUK.12.24
reference: Luke 12:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: κατανοήσατε τοὺς κόρακας ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν, οἷς οὐκ ἔστιν ταμεῖον οὐδὲ ἀποθήκη, καὶ ὁ θεὸς τρέφει αὐτούς· πόσῳ μᾶλλον ὑμεῖς διαφέρετε τῶν πετεινῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/024.yaml
  text: 'Consider the ravens: they neither sow nor reap[a]; they have neither storeroom nor barn, and God feeds them[c][b]. How much more valuable are you than the birds!'
translation:
  language: tl
  text: Pag-isipan ninyo ang mga uwak:[a] hindi sila naghahasik at hindi rin umaani; wala silang silid-imbakan o kamalig,[b] at pinapakain sila ng Diyos. Gaano pa nga kayong higit na mahalaga kaysa sa mga ibon![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Masdan ninyong mabuti ang mga uwak.”
    reason: lexical_alternative
  - marker: b
    text: 'Dalawang magkaibang salitang Griyego ang ginamit: ang ταμεῖον ay “silid-imbakan,” at ang ἀποθήκη ay “kamalig.”'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “Gaano pa nga kayo kahalaga kaysa sa mga ibon!”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Pag-isipan ninyo
  rationale: Ipinahahayag ng pautos na pandiwa ang masusing pagmamasid at pagninilay, hindi lamang ang panandaliang pagtingin.
- source_word: κόρακας
  choice: mga uwak
  rationale: Tiyak na tumutukoy ang κόραξ sa uwak at pinananatili nito ang kongkretong larawan ng Griyego.
- source_word: σπείρουσιν οὐδὲ θερίζουσιν
  choice: hindi sila naghahasik ni umaani
  rationale: Pinananatili ang magkatambal na gawaing pansakahan at ang maikli at balanseng anyo ng orihinal.
- source_word: ταμεῖον
  choice: silid-imbakan
  rationale: Tumutukoy ito sa isang panloob na lugar na pinag-iimbakan; ang 'silid-imbakan' ay malinaw na naiiba sa kasunod na kamalig.
- source_word: ἀποθήκη
  choice: kamalig
  rationale: Ang kamalig ay gusali o lugar na imbakan ng ani at natural na katumbas sa kontekstong pansakahan.
- source_word: τρέφει
  choice: pinakakain
  rationale: Tuwirang ipinahahayag ang patuloy at aktibong paglalaan ng Diyos para sa mga ibon.
- source_word: πόσῳ μᾶλλον
  choice: Gaano pa nga ... higit
  rationale: Natural na inilalahad sa Filipino ang pangangatwirang mula sa mas maliit tungo sa mas mahalaga.
- source_word: διαφέρετε
  choice: kayong higit na mahalaga
  rationale: Sa konteksto, ang pandiwa ay tumutukoy sa pagiging nakahihigit sa halaga, hindi lamang sa pagiging naiiba.
- source_word: τῶν πετεινῶν
  choice: kaysa sa mga ibon
  rationale: Pangkalahatang tawag ito sa mga ibon; lumalawak ang paghahambing mula sa mga uwak tungo sa mga ibon.
theological_decisions:
- issue: Pagkalinga ng Diyos bilang batayan ng paghahambing
  choice: ngunit pinakakain sila ng Diyos
  alternative: at sila ay pinangangalagaan ng Diyos
  rationale: Tahasang sinasabi ng teksto na ang Diyos ang nagpapakain sa kanila. Pinananatili ng salin ang aktibong pagkilos ng Diyos nang hindi pinalalawak ang pahayag sa doktrinang hindi tahasang binanggit.
- issue: Diwa ng διαφέρετε sa paghahambing
  choice: higit na mahalaga
  alternative: higit ang halaga
  rationale: Pinananatili ang diin sa natatanging halaga ng mga kausap kumpara sa mga ibon, nang hindi ipinapaliwanag kung saan nagmumula ang halagang iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang “ninyo/kayo” ayon sa ὑμεῖς. Pinanatili ang masiglang retorikal na diin sa hulihan sa pamamagitan ng tandang padamdam.
