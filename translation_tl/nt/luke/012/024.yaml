  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing daloy at mga leksikal na pagpili: ang mga uwak, paghahasik at pag-aani, ang magkaibang imbakan, at ang paghahambing sa mga ibon. Gayunman, ang “ngunit” ay nagbibigay ng salungat na ugnayan na wala sa simpleng καί (“at”) ng Griyego, at ang “pinakakain” ay maaaring mabasa bilang pagpapakain sa pamamagitan ng iba sa halip na tuwirang “pinapakain.”'
  naturalness: Malinaw at modernong Filipino ang salin. Mas natural at mas malinaw ang inuulit na negatibo sa dalawang pandiwa (“hindi sila naghahasik at hindi rin umaani”) kaysa sa “ni umaani.”
  terminology: Ang “uwak,” “silid-imbakan,” at “kamalig” ay angkop at napapanatili ang pagkakaiba ng κόρακες, ταμεῖον, at ἀποθήκη. Ang “higit na mahalaga” ay angkop sa diwa ng διαφέρετε sa kontekstong ito.
  issues:
  - severity: medium
    issue: “ngunit pinakakain sila ng Diyos”
    rationale: Ang καί ay pang-ugnay na “at,” hindi pangkontrast na “ngunit.” Bukod dito, ang “pinakakain” ay causative at maaaring magpahiwatig na ipinapagawa ng Diyos sa iba ang pagpapakain. Ang τρέφει ay mas tuwirang naipapahayag ng “pinapakain sila ng Diyos.”
  - severity: low
    issue: “hindi sila naghahasik ni umaani”
    rationale: Nauunawaan ito, ngunit mas natural sa makabagong Filipino ang “hindi sila naghahasik at hindi rin umaani,” na malinaw na pinananatili ang parehong negasyon ng οὐ ... οὐδέ.
