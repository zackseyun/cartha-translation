  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται ⸂ἐπὶ τὴν ἡλικίαν αὐτοῦ προσθεῖναι⸃ ⸀πῆχυν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/025.yaml
  text: And which of you, by worrying, is able to add a cubit to his lifespan?
translation:
  language: tl
  text: At sino sa inyo ang makapagdaragdag ng isang siko sa haba ng kanyang buhay sa pamamagitan ng pag-aalala?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makapagdaragdag ng isang siko sa kanyang tangkad.” Ang salitang isinaling “haba ng kanyang buhay” ay maaari ring tumukoy sa tangkad.
    reason: Pinananatili ang tunay na ambigwidad ng ἡλικία nang hindi pinapalawak ang kahulugan nito o inilalarawan nang di-tumpak ang πῆχυς.
lexical_decisions:
- source_word: μεριμνῶν
  choice: sa pamamagitan ng pag-aalala
  rationale: Likas na ipinapahayag sa Filipino ang paraan o dahilan ng pagtatangka, habang pinananatili ang diwa ng patuloy na pagkabalisa.
- source_word: ἡλικίαν
  choice: haba ng kanyang buhay
  rationale: Maaaring tumukoy ang salita sa edad, haba ng buhay, o pangangatawan. Sa konteksto ng pagdaragdag ng isang yunit ng haba, ang 'haba ng kanyang buhay' ay natural at tumutugma sa agarang konteksto, ngunit dapat kilalanin ang alternatibong pagbasa.
- source_word: πῆχυν
  choice: isang siko
  rationale: Pinananatili ang sinaunang yunit ng haba at ang matalinghagang tensiyon ng pahayag, sa halip na gawing tahasang sukat ng panahon.
- source_word: δύναται ... προσθεῖναι
  choice: makapagdaragdag
  rationale: Natural na Filipino na malinaw na naghahayag ng kakayahang 'magdagdag,' nang hindi binabago ang retorikal na tanong.
theological_decisions:
- issue: Kung ang ἡλικία ay 'buhay/edad' o 'tangkad'
  choice: haba ng kanyang buhay
  alternative: tangkad niya
  rationale: Ang kasunod na talata ay tumutukoy sa kawalan ng kakayahan sa isang napakaliit na bagay, na umaayon sa pagdaragdag sa haba ng buhay; gayunman, tunay na leksikal na posibilidad ang 'tangkad,' kaya inilagay ito sa talababa sa halip na tahimik na alisin.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang 'siko' bilang tradisyonal na katawagan sa cubit; ipinapaliwanag sa talababa ang pangunahing alternatibong pagbasa.
