id: LUK.12.30
reference: Luke 12:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ταῦτα γὰρ πάντα τὰ ἔθνη τοῦ κόσμου ⸀ἐπιζητοῦσιν, ὑμῶν δὲ ὁ πατὴρ οἶδεν ὅτι χρῄζετε τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/030.yaml
  text: For all these things the nations of the world seek[a], but your Father knows that you need these things.
translation:
  language: tl
  text: Sapagkat ang lahat ng ito ay hinahanap ng mga bansa sa mundo[a], ngunit alam ng inyong Ama na kailangan ninyo ang mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Hentil sa mundo.” Ang salitang Griyego ay maaaring mangahulugang “mga bansa” o “mga Hentil.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα ... πάντα
  choice: ang lahat ng ito
  rationale: Tumutukoy ito sa mga pangangailangang materyal na binanggit sa konteksto. Likas sa Filipino ang pariralang ito at malinaw na pinananatili ang kabuuang saklaw ng πᾶς.
- source_word: τὰ ἔθνη τοῦ κόσμου
  choice: mga bansa sa mundo
  rationale: Maaaring mangahulugan ang ἔθνη ng mga bansa o mga Hentil. Pinananatili ng saling ito ang malawak at tuwirang diwa ng parirala, habang inilalagay sa talababa ang tunay na alternatibong leksikal.
- source_word: ἐπιζητοῦσιν
  choice: hinahangad
  rationale: Ipinapahayag ng ἐπιζητέω ang masigasig na paghahanap o pagpupunyagi para makamit ang isang bagay. Ang “hinahangad” ay natural sa Filipino at angkop sa aktibong pagpupursigi sa mga pangangailangang ito.
- source_word: ὑμῶν ... ὁ πατήρ
  choice: inyong Ama
  rationale: Tumpak nitong ipinapahayag ang ugnayang paari at hindi idinaragdag ang “nasa langit,” na wala sa tekstong Griyego ng talatang ito.
- source_word: οἶδεν
  choice: alam
  rationale: Bagaman anyong perpekto ang οἶδα, pangkasalukuyan ang gamit nito rito; natural at tumpak ang “alam.”
- source_word: χρῄζετε
  choice: kailangan ninyo
  rationale: Direkta at makabagong Filipino ito para sa kahulugang “may pangangailangan kayo.”
- source_word: τούτων
  choice: ang mga ito
  rationale: Pinananatili nito ang demonstratibo at ang malinaw na pagtukoy pabalik sa mga bagay na binanggit, nang hindi nagiging mabigat ang pag-uulit.
theological_decisions:
- issue: Ang pagtutol sa pagitan ng paghahangad ng mundo at pagtitiwala ng mga anak sa Ama
  choice: Panatilihin ang “mga bansa sa mundo” at “inyong Ama” nang walang paliwanag na idinaragdag sa mismong teksto.
  alternative: Isalin ang ἔθνη bilang “mga Hentil” upang higit na idiin ang pagkakaiba kaugnay ng tipan, o idagdag ang “nasa langit” bago ang “Ama.”
  rationale: Ipinakikita ng talata ang kaibahan ng paghahangad na karaniwan sa mundo at ng kaugnayan ng mga alagad sa Diyos bilang kanilang Ama. Pinananatili ng salin ang tensiyong ito nang hindi pinakikitid ang ἔθνη o nag-aangkat ng pananalita mula sa kapantay na salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mundo” sa halip na mas lumang “sanlibutan,” at pinanatili ang “Ama” bilang pantanging katawagan sa Diyos sa konteksto.
