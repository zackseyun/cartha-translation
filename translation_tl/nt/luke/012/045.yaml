base_translation:
  language: en
  yaml_path: translation/nt/luke/012/045.yaml
  text: But if that servant says in his heart[a], ‘My master delays in coming,’ and begins to beat the male servants and the female servants, and to eat and drink and get drunk[b],
translation:
  language: tl
  text: Ngunit kung sabihin ng aliping iyon[a] sa sarili niya,[b] “Nagtatagal bago dumating ang amo ko,”[c] at magsimula siyang bugbugin ang mga aliping lalaki at mga aliping babae, at kumain, uminom, at malasing,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lingkod.” Ang Griyegong δοῦλος ay tumutukoy rito sa isang alipin, isang taong nasa ilalim ng awtoridad ng amo sa sambahayan.
    reason: lexical_alternative
  - marker: b
    text: Literal, “sa kanyang puso.”
    reason: literal_rendering
  - marker: c
    text: Maaari ring “panginoon ko.” Sa talinghaga, ang Griyegong κύριος ay tumutukoy sa nakatataas sa sambahayan.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: alipin
  rationale: Ipinakikita ng “alipin” ang nakagapos at mababang katayuan ng δοῦλος sa sambahayan, na mahalaga sa tagpong ito ng kapangyarihan at pananagutan.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: sa sarili niya
  rationale: Ito ang likas na modernong Tagalog para sa panloob at pribadong pagsasalita; pinananatili sa talababa ang literal na larawan ng “puso.”
- source_word: Χρονίζει … ἔρχεσθαι
  choice: Nagtatagal bago dumating
  rationale: Ipinahahayag nito ang nagpapatuloy na pagkaantala ng pagdating nang hindi ipinapalagay ang dahilan nito.
- source_word: κύριός μου
  choice: amo ko
  rationale: Sa loob ng talinghaga, tumutukoy ito sa nakatataas sa sambahayan, kaya mas malinaw ang “amo” kaysa sa titulong maaaring unawaing tuwirang banal.
- source_word: ἄρξηται τύπτειν
  choice: magsimula siyang bugbugin
  rationale: Pinananatili ang pasimulang aspekto ng ἄρξηται at ang marahas, posibleng paulit-ulit na pananakit na ipinahihiwatig ng τύπτειν.
- source_word: τοὺς παῖδας καὶ τὰς παιδίσκας
  choice: ang mga lalaking lingkod at mga babaeng lingkod
  rationale: Pinananatili ang hayag na pagkakaiba ng panlalaki at pambabaeng pangkat at ang kanilang tungkulin sa sambahayan.
- source_word: ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι
  choice: kumain, uminom, at malasing
  rationale: Direkta at natural na inilalahad ang sunod-sunod na pagpapakasasa, nang hindi dinaragdagan ang tindi o dalas na wala sa Griyego.
theological_decisions:
- issue: Ang kahulugan ng κύριος sa talinghaga
  choice: amo
  alternative: panginoon
  rationale: Ang tinutukoy sa mismong tagpo ay ang nakatataas na tao sa sambahayan. Iniiwasan ng “amo” ang di-sinasadyang paglilipat sa tuwirang banal na titulo, habang kinikilala sa talababa ang ibang lehitimong salin.
- issue: Ang katayuang panlipunan ng δοῦλος
  choice: alipin
  alternative: lingkod
  rationale: Mahalaga rito ang mahigpit na herarkiya at pananagutan sa sambahayan; mas malinaw itong naihahayag ng “alipin” kaysa sa mas malawak at mas banayad na “lingkod.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal ang himig. Ginamit ang “sa sarili niya” bilang likas na idyoma, habang pinanatili sa talababa ang literal na larawan. Ang “amo,” “alipin,” at “mga lingkod” ay sadyang pinag-iba upang maipakita ang mga ugnayang panlipunan sa Griyegong teksto nang hindi nagpapasok ng natatanging doktrinal na pagbasa.
