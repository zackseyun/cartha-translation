id: LUK.12.12
reference: Luke 12:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὸ γὰρ ἅγιον πνεῦμα διδάξει ὑμᾶς ἐν αὐτῇ τῇ ὥρᾳ ἃ δεῖ εἰπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/012.yaml
  text: for the Holy Spirit will teach you in that very hour what you must say[a].
translation:
  language: tl
  text: Sapagkat ituturo sa inyo ng Banal na Espiritu sa mismong oras na iyon kung ano ang dapat ninyong sabihin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa oras ding iyon” o “sa oras na iyon.” Idiniriin ng pananalitang Griyego ang mismong sandali ng pangangailangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan nito sa naunang pangako at natural itong panimula sa makabagong Tagalog.
- source_word: τὸ ἅγιον πνεῦμα
  choice: ang Banal na Espiritu
  rationale: Karaniwan, malinaw, at marangal na salin ng pariralang tumutukoy sa banal na Espiritu bilang gumaganap ng pagtuturo.
- source_word: διδάξει
  choice: ituturo
  rationale: Tuwirang ipinahahayag ng anyong panghinaharap ang ipinangakong pagtuturo ng Espiritu.
- source_word: ὑμᾶς
  choice: sa inyo
  rationale: Ipinakikita ng panghalip na maramihan ang maramihang kausap, na malinaw na naihahatid ng “inyo.”
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: sa mismong oras na iyon
  rationale: Inihahatid ng “mismong” ang diin ng αὐτῇ sa tiyak at agarang sandali ng pangangailangan.
- source_word: ἃ
  choice: kung ano ang
  rationale: Natural na Tagalog para sa nilalaman ng ituturo, nang hindi ginagawang mabigat ang literal na “mga bagay na.”
- source_word: δεῖ
  choice: dapat
  rationale: Ipinahahayag ang kinakailangan o nararapat sabihin sa sitwasyon; mas natural dito kaysa sa mas mabigat na “kailangang-kailangan.”
- source_word: εἰπεῖν
  choice: sabihin
  rationale: Natural at tuwirang katumbas ng infinitibong tumutukoy sa kanilang bibigkasin.
theological_decisions:
- issue: Pagkakilala sa Banal na Espiritu
  choice: Inilalarawan ang Banal na Espiritu bilang aktibong tagapagturo na magsasabi sa mga alagad kung ano ang dapat nilang sabihin.
  alternative: Unawain bilang di-personal na impluwensiya o inspirasyon ng Diyos.
  rationale: Ang Banal na Espiritu ang tahasang simuno ng aktibong pandiwang “ituturo”; pinananatili ng salin ang personal na pagkilos na nasa teksto nang hindi nagdaragdag ng mas malawak na pormulang doktrinal.
- issue: Lakas ng δεῖ
  choice: dapat ninyong sabihin
  alternative: kailangan ninyong sabihin
  rationale: Ang “dapat” ay nagpapanatili sa kahulugan ng kinakailangan o nararapat nang hindi nagpapasya kung ang diin ay ganap na pangangailangan o obligasyong angkop sa sandali.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo/inyo” upang hayagang ipakita na maramihan ang kausap. Ang ayos na “ituturo sa inyo ng Banal na Espiritu” ay natural sa Tagalog at pinananatiling malinaw ang Espiritu bilang gumaganap.
