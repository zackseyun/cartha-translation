  text: καὶ ἐρῶ τῇ ψυχῇ μου· Ψυχή, ἔχεις πολλὰ ἀγαθὰ κείμενα εἰς ἔτη πολλά· ἀναπαύου, φάγε, πίε, εὐφραίνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/019.yaml
  text: And I will say to my soul[a], ‘Soul, you have many good things laid up for many years. Rest, eat, drink[b], be merry.’
translation:
  language: tl
  text: At sasabihin ko sa aking sarili[a], ‘Sarili ko, marami kang mabubuting bagay na nakaimbak para sa maraming taon. Magpahinga ka, kumain, uminom, at magpakasaya.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaluluwa” o “buhay.” Ang salitang Griyego na ψυχή ay maaaring tumukoy sa sarili, kaluluwa, o buhay ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρῶ
  choice: sasabihin ko
  rationale: Tuwirang ipinapahayag ang panghinaharap na kilos ng pagsasalita at natural sa makabagong Tagalog.
- source_word: ψυχῇ / Ψυχή
  choice: aking sarili / Sarili
  rationale: Sa konteksto, kinakausap ng lalaki ang kaniyang sariling pagkatao. Mas natural sa Tagalog ang “sarili” kaysa literal na “kaluluwa,” nang hindi ginagawang teknikal na pahayag tungkol sa antropolohiya ang talata.
- source_word: πολλὰ ἀγαθὰ
  choice: maraming mabubuting bagay
  rationale: Pinananatili nito ang lawak ng ἀγαθά habang malinaw na tumutukoy sa naipong mga materyal na pakinabang sa konteksto.
- source_word: κείμενα
  choice: nakaimbak
  rationale: Sa konteksto ng mga kamalig at naipong ani, natural na ipinahihiwatig ng participle ang mga bagay na nakalaan o nakatago sa imbakan.
- source_word: εἰς ἔτη πολλά
  choice: para sa maraming taon
  rationale: Malinaw na ipinapahayag ang inaasahang haba ng panahong mapakikinabangan ang nakaimbak na mga bagay.
- source_word: ἀναπαύου
  choice: Magpahinga ka
  rationale: Natural na pautos sa Tagalog na naghahayag ng pamamahinga at pagpapakaluwag.
- source_word: φάγε
  choice: kumain
  rationale: Tuwirang salin ng payak na pautos.
- source_word: πίε
  choice: uminom
  rationale: Tuwirang salin ng payak na pautos.
- source_word: εὐφραίνου
  choice: magpakasaya
  rationale: Ipinahahayag ang pagpapakasaya o masayang pagpapakalugod sa sarili; natural ito sa kasalukuyang Tagalog at akma sa konteksto.
theological_decisions:
- issue: Pagpapakahulugan sa ψυχή sa isang pakikipag-usap sa sarili sa loob ng talinghaga
  choice: sarili
  alternative: kaluluwa; buhay
  rationale: Hindi kinakailangang magturo rito ang talata ng teknikal na paghahati ng katawan at kaluluwa. Ang “sarili” ay likas na paraan sa Tagalog upang ilarawan ang taong kinakausap ang kaniyang kalooban, samantalang inilalagay sa talababa ang leksikal na lawak ng ψυχή.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sarili” upang maging natural ang retorikal na pakikipag-usap sa sarili; pinanatili sa talababa ang tunay na lawak ng ψυχή. Ang sunod-sunod na mga pautos ay maikli upang mapanatili ang diin ng Griyego.
