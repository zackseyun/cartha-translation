id: LUK.12.27
reference: Luke 12:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: κατανοήσατε τὰ κρίνα πῶς αὐξάνει· οὐ κοπιᾷ οὐδὲ νήθει· λέγω δὲ ὑμῖν, οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/027.yaml
  text: 'Consider the lilies[a], how they grow: they do not labor or spin; yet I tell you[b], not even Solomon in all his glory was clothed like one of these.'
translation:
  language: tl
  text: Masdan ninyong mabuti ang mga liryo[a], kung paano sila lumalaki. Hindi sila nagpapagal ni umiikid ng sinulid. Ngunit sinasabi ko sa inyo, kahit si Solomon, sa buong kaluwalhatian niya, ay hindi nagdamit na gaya ng isa sa mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bulaklak” o “mga bulaklak sa parang”; espesipikong “mga liryo” ang nasa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Pagmasdan ninyo
  rationale: Ipinahahayag ng pautos na anyo ang masusing pagmamasid at pagbubulay, hindi lamang ang basta pagtingin.
- source_word: τὰ κρίνα
  choice: ang mga liryo
  rationale: Tiyak na liryo ang karaniwang kahulugan ng κρίνα; pinanatili ang espesipikong larawan ng Griyego sa halip na gawing pangkalahatang “mga bulaklak.”
- source_word: πῶς αὐξάνει
  choice: kung paano sila lumalaki
  rationale: Natural sa Tagalog ang maramihang panghalip bagaman isahan ang pandiwa sa Griyego dahil karaniwang ganito ang pagtutugma sa neuter plural.
- source_word: οὐ κοπιᾷ
  choice: Hindi sila nagpapagal
  rationale: Ang κοπιάω ay tumutukoy sa mabigat na paggawa o pagpapagal; ang “nagpapagal” ay dignified at malinaw sa modernong Tagalog.
- source_word: οὐδὲ νήθει
  choice: ni nag-iikid ng sinulid
  rationale: Ang νήθω ay pag-iikid ng hibla upang maging sinulid. Nilinaw ang bagay na iniikid upang hindi mapagkamalan ang ibang kahulugan ng “ikid.”
- source_word: λέγω δὲ ὑμῖν
  choice: Ngunit sinasabi ko sa inyo
  rationale: Pinananatili ng “ngunit” ang banayad na pagsalungat o paglipat na ipinahahayag ng δέ.
- source_word: οὐδὲ Σολομὼν
  choice: kahit si Solomon
  rationale: 'Natural na ipinahahayag ng “kahit” sa negatibong pangungusap ang diin ng οὐδέ: maging ang maringal na hari ay hindi nakapantay.'
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: sa buong kaluwalhatian niya
  rationale: Ang “kaluwalhatian” ay nagpapanatili ng mas malawak na resonansiya ng δόξα habang malinaw na tumutukoy rito sa karangyaan ni Solomon.
- source_word: περιεβάλετο
  choice: ay hindi nadamitan
  rationale: Ang anyong middle/passive ay likas na naipapahayag sa Tagalog sa “nadamitan,” nang hindi tinutukoy kung sino ang nagdamit sa kaniya.
- source_word: ὡς ἓν τούτων
  choice: na gaya ng isa sa mga ito
  rationale: Tuwirang paghahambing ito; malinaw na tumutukoy ang “mga ito” sa mga liryo.
theological_decisions:
- issue: Saklaw ng larawang bulaklak
  choice: Pinanatili ang espesipikong “mga liryo.”
  alternative: mga bulaklak; mga bulaklak sa parang
  rationale: Tahasan ang κρίνα sa Griyego. Hindi kailangang palawakin ang salita upang maipahayag ang aral tungkol sa pangangalaga ng Diyos.
- issue: Kahulugan ng δόξα sa paglalarawan kay Solomon
  choice: kaluwalhatian
  alternative: karangyaan; kaningningan
  rationale: Ang “kaluwalhatian” ay nauunawaan sa konteksto bilang maharlikang karilagan at pinananatili rin ang mas malawak na biblikal na saklaw ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nag-iikid ng sinulid” upang maging tiyak ang sinaunang gawaing tinutukoy, at pinanatili ang “kaluwalhatian” dahil malinaw ang kahulugan nitong karangyaan sa konteksto.
