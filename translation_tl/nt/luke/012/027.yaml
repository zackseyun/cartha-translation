    issue: Ang “ay hindi nadamitan” ay hindi pinakamalapit na salin ng περιεβάλετο.
    rationale: Maaaring magpahiwatig ang “nadamitan” na may ibang nagbihis kay Solomon o na siya ay nabigyan ng damit. Ang middle na anyo ng Griyego ay mas ligtas na isalin bilang “ay hindi nagdamit.”
  - severity: low
