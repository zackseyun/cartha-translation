  source_fidelity: Tumpak ang pangunahing kahulugan at ang pagtukoy sa mga liryo. Gayunman, ang “nadamitan” ay karaniwang nangangahulugang binihisan o binigyan ng damit ng iba, samantalang ang Griyegong περιεβάλετο ay mas tuwirang tumutukoy sa pananamit/pagdadamit ni Solomon mismo. Ang “nagdamit” ay mas angkop at hindi nagsasaad ng tagapagbihis.
  naturalness: Makabago at malinaw ang karamihan ng teksto. Mas natural at masinsin ang “Masdan ninyong mabuti,” na nagpapahiwatig ng maingat na pagsasaalang-alang sa κατανοήσατε, kaysa sa “Pagmasdan” lamang.
  terminology: Ang “mga liryo,” “nagpapagal,” “umiikid ng sinulid,” at “kaluwalhatian” ay angkop. Pinanatili ang “kaluwalhatian” dahil nauunawaan ito rito bilang maharlikang karangyaan.
  issues:
