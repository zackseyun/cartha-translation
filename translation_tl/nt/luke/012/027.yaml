  to: Masdan ninyong mabuti ang mga liryo[a], kung paano sila lumalaki. Hindi sila nagpapagal ni umiikid ng sinulid. Ngunit sinasabi ko sa inyo, kahit si Solomon, sa buong kaluwalhatian niya, ay hindi nagdamit na gaya ng isa sa mga ito.
