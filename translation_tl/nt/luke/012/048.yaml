id: LUK.12.48
reference: Luke 12:48
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γνοὺς ποιήσας δὲ ἄξια πληγῶν δαρήσεται ὀλίγας. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ’ αὐτοῦ, καὶ ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/048.yaml
  text: But the one who did not know[a], yet did what deserved blows, will receive few. From everyone to whom much was given, much will be required, and from the one to whom they entrusted much[b], they will ask even more.
translation:
  language: tl
  text: Ngunit ang hindi nakaalam[a], bagaman gumawa ng mga bagay na karapat-dapat sa mga hampas, ay tatanggap lamang ng kaunting hampas. Sa bawat taong binigyan ng marami, marami ang hihingin sa kanya; at sa taong pinagkatiwalaan nila ng marami, mas marami pa ang hihingin nila sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang bagay na hindi niya nalaman ay hindi tahasang binanggit sa talatang ito; ipinahihiwatig ng naunang talata na ito ang kalooban ng kanyang panginoon.
    reason: contextual_clarification
  - marker: b
    text: Sa Griyego, walang tahasang tinukoy na simuno ang mga pandiwang isinaling “pinagkatiwalaan nila” at “hihingin nila.”
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ὁ ... μὴ γνοὺς
  choice: ang hindi nakaalam
  rationale: Pinananatili nito ang payak na diwa ng participyo at hindi tahasang dinaragdagan ang bagay na hindi niya nalaman; ipinahihiwatig iyon ng konteksto.
- source_word: ποιήσας ... ἄξια πληγῶν
  choice: gumawa ng mga bagay na karapat-dapat sa mga hampas
  rationale: Malinaw na ipinapakita ang kaugnayan ng ginawa at ng nararapat na kaparusahan habang pinananatili ang kongkretong larawan ng mga hampas.
- source_word: δαρήσεται ὀλίγας
  choice: kaunting hampas lamang ang tatanggapin
  rationale: Ang pandiwang δέρω ay tumutukoy sa paghampas, at ang pambabaeng pang-uring ὀλίγας ay tumutukoy sa ipinahihiwatig na πληγάς, ‘mga hampas.’ Ang salin ay likas sa Filipino at malinaw na tumutukoy sa kakaunting bilang, hindi lamang sa mahinang paghampas.
- source_word: παντὶ ... ᾧ ἐδόθη πολύ
  choice: sa bawat taong binigyan ng marami
  rationale: Natural na inilalahad sa Filipino ang pangkalahatang simulain ng pananagutan nang hindi tinutukoy kung ano mismo ang ibinigay.
- source_word: πολὺ ζητηθήσεται παρ’ αὐτοῦ
  choice: marami ang hihingin sa kanya
  rationale: Sa kontekstong ito, ang ζητέω ay may diwang paghingi o pag-aatas bilang pananagutan; ang ‘hihingin’ ay malinaw at hindi labis na matindi.
- source_word: ᾧ παρέθεντο πολύ
  choice: sa taong pinagkatiwalaan nila ng marami
  rationale: Ipinapahayag ng παρατίθημι ang pagbibigay ng isang bagay sa pangangalaga o pananagutan ng iba. Pinananatili rin ang di-tiyak na maramihang tagaganap ng pandiwa.
- source_word: περισσότερον αἰτήσουσιν αὐτόν
  choice: mas marami pa ang hihingin nila sa kanya
  rationale: Pinananatili ang paghahambing na ipinahihiwatig ng περισσότερον at ang tahasang di-tiyak na maramihang tagaganap, nang hindi pinapangalanan kung sino ang ‘sila.’
theological_decisions:
- issue: Kalikasan at antas ng kaparusahan
  choice: Panatilihin ang kongkretong larawan ng kakaunting hampas.
  alternative: Gawing pangkalahatang ‘kaunting parusa’ o gawing mas tiyak na ‘mga latigo.’
  rationale: Gumagamit ang talata ng larawang talinghaga tungkol sa magkakaibang antas ng kaparusahan ayon sa kaalaman at pananagutan. Hindi dapat palabuin ang larawan o tukuyin ang isang pamamaraang hindi naman sinabi ng teksto.
- issue: Tagaganap sa huling sugnay
  choice: Panatilihin ang di-tiyak na ‘nila’ sa ‘pinagkatiwalaan nila’ at ‘hihingin nila.’
  alternative: Tukuyin ang Diyos o ang mga tao bilang tagaganap.
  rationale: Mga pandiwang nasa ikatlong panauhang maramihan ang ginamit sa Griyego nang walang tahasang simuno. Ang pagtukoy sa isang partikular na tagaganap ay higit sa mismong sinasabi ng teksto.
- issue: Bagay na hindi nalaman
  choice: Iwan itong di-tahasang tinukoy sa pangunahing teksto.
  alternative: Idagdag ang ‘kalooban ng kanyang panginoon’ mula sa naunang talata.
  rationale: Bagaman malinaw ang kaugnayan sa naunang talata, walang tahasang layon ang γνοὺς sa talatang ito. Pinananatili ng salin ang pormal na pagkaipinahiwatig nito.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang ‘mga hampas’ upang mapanatili ang kongkretong larawan ng teksto, at ‘pinagkatiwalaan’ upang natural na maipahayag ang pananagutang iniatang. Iniwasan ang mas teknikal o makalumang ‘mga palo,’ ‘mga latay,’ at ‘hihingan ng pagsusulit.’
