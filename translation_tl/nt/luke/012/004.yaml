id: LUK.12.4
reference: Luke 12:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν τοῖς φίλοις μου, μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων τὸ σῶμα καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/004.yaml
  text: But I say to you[a], my friends, do not fear those who kill the body and after that have nothing more they can do.
translation:
  language: tl
  text: 'Ngunit sinasabi ko sa inyo, mga kaibigan ko: huwag kayong matakot sa mga pumapatay ng katawan at pagkatapos niyon ay wala na silang magagawa pa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at pagkatapos niyon ay hindi na nila kayang gumawa ng anuman pa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ
  choice: Ngunit sinasabi ko
  rationale: Ipinapakita ng “ngunit” ang banayad na paglipat o pagsalungat na dala ng δέ, habang pinananatili ng “sinasabi ko” ang tuwirang pananalita ni Jesus.
- source_word: ὑμῖν τοῖς φίλοις μου
  choice: sa inyo, mga kaibigan ko
  rationale: Ang pariralang “mga kaibigan ko” ay paliwanag kung sino ang tinutukoy ng “inyo”; pinananatili nito kapwa ang panghalip at ang magiliw na pagtawag.
- source_word: μὴ φοβηθῆτε
  choice: huwag kayong matakot
  rationale: Likas at tuwirang pagbabawal ito sa makabagong Tagalog, at ang maramihang “kayo” ay tumutugma sa ὑμῖν.
- source_word: ἀπὸ τῶν ἀποκτεινόντων
  choice: sa mga pumapatay
  rationale: Pagkatapos ng pandiwang “matakot,” likas na ipinakikilala ng “sa” ang kinatatakutan; ang kasalukuyang participle ay ginawang pangkalahatang paglalarawan sa mga pumapatay.
- source_word: τὸ σῶμα
  choice: ang katawan
  rationale: Tuwirang tumutukoy ang σῶμα sa pisikal na katawan, nang hindi nagdaragdag ng hindi tahasang binanggit sa talata.
- source_word: καὶ μετὰ ταῦτα
  choice: at pagkatapos niyon
  rationale: Ang “niyon” ay likas na tumutukoy sa naunang pagpatay sa katawan at malinaw na pinananatili ang temporal na pagkakasunod-sunod.
- source_word: μὴ ἐχόντων περισσότερόν τι ποιῆσαι
  choice: wala na silang magagawa pa
  rationale: Likas sa Tagalog ang pariralang ito at ipinapahayag ang hangganan ng kanilang kakayahan pagkatapos nilang patayin ang katawan.
theological_decisions:
- issue: Hangganan ng kapangyarihan ng tao pagkatapos ng kamatayan ng katawan
  choice: Sinasabi lamang na pagkatapos patayin ang katawan ay wala nang magagawa pa ang mga pumapatay.
  alternative: Idagdag na hindi nila kayang patayin ang kaluluwa.
  rationale: Hindi tahasang binabanggit sa talatang ito ang kaluluwa. Bagaman nililinaw ng kasunod na konteksto ang higit na awtoridad ng Diyos, hindi iyon idinaragdag dito upang mapanatili ang mismong saklaw at tensiyon ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga kaibigan ko” bilang natural na pantawag at ang “wala na silang magagawa pa” bilang payak na pahayag ng limitasyon ng tao.
