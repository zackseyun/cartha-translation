base_translation:
  language: en
  yaml_path: translation/nt/luke/012/043.yaml
  text: Blessed is that servant whom his master[a], when he comes, will find doing thus.
translation:
  language: tl
  text: Mapalad ang aliping iyon na, pagdating ng kanyang amo[a], ay madaratnan ng kanyang amo na gumagawa nang gayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Panginoon.” Ang salitang Griyego ay maaaring mangahulugang “amo” sa tagpo ng sambahayan sa talinghaga o “Panginoon” kapag isinasaalang-alang ang mas malawak na aplikasyon nito.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: Mapalad
  rationale: Likas at marangal na katumbas ng pormulang pagpapahayag ng pinagpalang kalagayan; hindi lamang ito pansariling saya.
- source_word: δοῦλος
  choice: alipin
  rationale: Tuwirang pinananatili ang kalagayang nasa ilalim ng kapangyarihan ng isang amo sa sambahayang larawan ng talinghaga.
- source_word: ἐκεῖνος
  choice: iyon
  rationale: Pinananatili ang pagtuturo at pagbibigay-diin ng demonstratibo sa partikular na alipin.
- source_word: κύριος
  choice: amo
  rationale: Sa lantad na larawan ng talinghaga, ito ang nakatataas sa alipin sa isang sambahayan. Inilalagay sa talababa ang “Panginoon” upang mapanatili ang mas malawak na teolohikal na pahiwatig.
- source_word: ἐλθὼν
  choice: pagdating
  rationale: Natural na sugnay na temporal sa Filipino at malinaw na ipinapakita ang pagdating bago ang pagkakatagpo.
- source_word: εὑρήσει
  choice: madaratnan
  rationale: Ang panghinaharap na anyo ay pinananatili, at ang “madaratnan” ay natural sa konteksto ng pag-uwi ng amo at pagkakitang abala ang alipin.
- source_word: ποιοῦντα οὕτως
  choice: gumagawa nang gayon
  rationale: Maikli at malinaw na tumutukoy pabalik sa gawaing inilarawan sa naunang konteksto.
theological_decisions:
- issue: Maaaring tumukoy ang κύριος kapwa sa amo sa talinghaga at sa Panginoon sa mas malawak na aplikasyon.
  choice: amo sa pangunahing teksto
  alternative: Panginoon
  rationale: Ang agarang tagpo ay ugnayan ng amo at alipin sa sambahayan, ngunit maaaring magpahiwatig ang pagbabalik ng amo sa pagdating ng Panginoon; kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabagong, dignificado, at madaling maunawaang Filipino. Ginamit ang “Mapalad” bilang pormulang kahawig ng mga pagpapahayag ng pagpapala, at inayos ang pangungusap upang maging natural nang hindi inaalis ang diin sa pagdating at pagkakatagpo.
