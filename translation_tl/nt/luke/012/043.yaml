  source_fidelity: 'Tumpak ang pangunahing pagtutumbas: ang μακάριος ay “Mapalad,” ang δοῦλος ay “alipin,” ang κύριος ay “amo” sa lantad na tagpo ng talinghaga, at ang panghinaharap na εὑρήσει ay naipapahayag ng “madaratnan.” Napananatili rin ng “gumagawa nang gayon” ang patuloy na aspekto ng ποιοῦντα at ang pagbabalik-tukoy ng οὕτως.'
  naturalness: 'May hindi kanais-nais na kalabuan sa “madaratnan nitong”: maaaring tila ang alipin ang siyang daratnan o makatatagpo, sa halip na ang amo ang makatatagpo sa alipin. Ang tahasang “madaratnan ng kanyang amo” ay mas malinaw at natural, bagaman inuulit nito ang pariralang “kanyang amo.”'
