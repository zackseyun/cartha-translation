id: LUK.12.22
reference: Luke 12:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Διὰ τοῦτο ⸂λέγω ὑμῖν⸃, μὴ μεριμνᾶτε τῇ ⸀ψυχῇ τί φάγητε, μηδὲ τῷ ⸀σώματι τί ἐνδύσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/022.yaml
  text: Then he said to his disciples[a], “For this reason I tell you, do not worry about your life, what you will eat, nor about your body[b], what you will wear.”
translation:
  language: tl
  text: 'At sinabi niya sa kanyang mga alagad, “Dahil dito, sinasabi ko sa inyo: huwag kayong mag-alala[a] tungkol sa inyong buhay[b]—kung ano ang kakainin ninyo—ni tungkol sa inyong katawan—kung ano ang isusuot ninyo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mabalisa.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kaluluwa”; dito, ang salitang Griego ay tumutukoy sa buhay sa diwa ng makalupang pag-iral ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: At sinabi niya
  rationale: Ang δέ ay banayad na pang-ugnay. Likas sa salaysay ang “At,” at hindi nito pinalalabas na matindi ang pagsalungat.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: sa kanyang mga alagad
  rationale: Pinananatili ang tahasang αὐτοῦ (“kanyang”), at “mga alagad” ang karaniwan at malinaw na katumbas ng μαθηταί.
- source_word: Διὰ τοῦτο
  choice: Dahil dito
  rationale: Tumutukoy ang parirala sa naunang turo at ipinakikita ang dahilan o pagbubuod na humahantong sa utos.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Tuwirang tinutumbasan ang kasalukuyang λέγω at pinananatili ang tahasang pakikipag-usap sa mga alagad.
- source_word: μὴ μεριμνᾶτε
  choice: huwag kayong mag-alala
  rationale: Sa kontekstong ito, tumutukoy ang μεριμνάω sa balisang pag-aalala. Natural at madaling maunawaan sa modernong Tagalog ang “mag-alala.”
- source_word: τῇ ψυχῇ
  choice: tungkol sa inyong buhay
  rationale: Dito, ang ψυχή ay tumutukoy sa buhay o makalupang pag-iral na nangangailangan ng pagkain, hindi kinakailangang sa di-materyal na kaluluwa.
- source_word: τί φάγητε
  choice: kung ano ang kakainin ninyo
  rationale: Natural na ipinahahayag sa Tagalog ang di-tuwirang tanong at ang pagkilos na nakatuon sa hinaharap sa pamamagitan ng “kung ano ang kakainin ninyo.”
- source_word: μηδὲ τῷ σώματι
  choice: ni tungkol sa inyong katawan
  rationale: Pinananatili ng “ni” ang koordinasyon ng ikalawang bagay na hindi dapat ipag-alala at ang pagkakapantay ng dalawang parirala.
- source_word: τί ἐνδύσησθε
  choice: kung ano ang isusuot ninyo
  rationale: Ang middle form ng ἐνδύω ay tumutukoy sa pagsusuot ng damit; ang salin ay natural at kaayon ng estruktura ng “kung ano ang kakainin ninyo.”
theological_decisions:
- issue: Kahulugan ng ψυχή sa kontekstong ito
  choice: buhay
  alternative: kaluluwa
  rationale: Ang pagkakaugnay ng ψυχή sa pagkain at ng σώμα sa pananamit ay tumutukoy sa pang-araw-araw na buhay at pag-iral. Hindi kinakailangang ipakahulugan dito ang ψυχή bilang hiwalay na di-materyal na kaluluwa; gayunman, inilalahad sa talababa ang leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang mga gitling na em upang malinaw na maiugnay ang pagkain sa buhay at ang pananamit sa katawan. Inilagay ang mga panandang [a] at [b] kaagad sa mga salitang tinutukoy ng kani-kanilang talababa.
