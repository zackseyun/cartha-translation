  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐχὶ πέντε στρουθία ⸀πωλοῦνται ἀσσαρίων δύο; καὶ ἓν ἐξ αὐτῶν οὐκ ἔστιν ἐπιλελησμένον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/006.yaml
  text: Are not five sparrows sold for two assaria? Yet not one of them is forgotten before God[a][b].
translation:
  language: tl
  text: Hindi ba ipinagbibili ang limang maya sa halagang dalawang asarion? Gayunman, ni isa sa kanila ay hindi nakalimutan ng Diyos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa halagang dalawang maliliit na baryang tanso.” Ang asarion ay isang maliit na baryang tanso ng Roma.
    reason: cultural_note
  - marker: b
    text: O “ni isa sa kanila ay hindi napapansin sa paningin ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: maya
  rationale: Sa kontekstong ito, tumutukoy ang diminutibong pangngalan sa maliliit na ibong karaniwang ipinagbibili, tradisyonal na nauunawaan bilang mga maya. Ang “maya” ay natural at tiyak sa modernong Tagalog.
- source_word: πωλοῦνται
  choice: ipinagbibili
  rationale: Pinananatili nito ang pangkasalukuyang pasibong anyo ng Griyego at likas itong pakinggan sa tanong tungkol sa karaniwang presyo sa pamilihan.
- source_word: ἀσσαρίων δύο
  choice: sa halagang dalawang asarion
  rationale: Pinananatili ang tiyak na pangalan ng sinaunang baryang Romano sa halip na palitan ito ng hindi eksaktong makabagong halaga; ipinaliliwanag ito sa talababa.
- source_word: ἐπιλελησμένον
  choice: nalilimutan
  rationale: Ipinapahayag ng perfect participle ang kalagayan ng pagiging nakalimutan. Ang “nalilimutan” ay tuwiran at natural, nang hindi pinalalawak ang pahayag tungo sa mas ganap na doktrina ng pagkalinga.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: sa harap ng Diyos
  rationale: Malapit itong katumbas ng Griyego at pinananatili ang larawan ng isang nilalang na nasa pansin o presensiya ng Diyos.
- source_word: οὐχὶ ... ;
  choice: Hindi ba ...?
  rationale: Ang οὐχί ay nagpapakilala ng retorikal na tanong na umaasang sasang-ayon ang nakikinig; natural itong naipahahayag sa Tagalog sa “Hindi ba...?”
- source_word: καὶ ἓν ἐξ αὐτῶν οὐκ
  choice: Gayunman, ni isa sa kanila ay hindi
  rationale: Ipinakikita ng “Gayunman” ang kontras sa maliit nilang halaga sa pamilihan, samantalang malinaw na pinananatili ng “ni isa” ang diin sa bawat isang ibon.
theological_decisions:
- issue: Wika tungkol sa pag-alaala at pagkalinga ng Diyos
  choice: ni isa sa kanila ay hindi nalilimutan sa harap ng Diyos
  alternative: ni isa sa kanila ay hindi napapabayaan sa paningin ng Diyos
  rationale: Ang “nalilimutan” ang mas malapit sa leksikal na diwa at pinananatili ang pahayag tungkol sa mapagmasid na kaalaman ng Diyos nang hindi ipinapasok ang mas malawak na paliwanag tungkol sa probidensiya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “maya” bilang karaniwang tawag sa sparrow at pinanatili ang sinaunang katawagang “asarion,” na ipinaliwanag sa talababa. Ang ayos ng pangungusap ay natural sa Tagalog habang pinananatili ang retorikal na tanong, kontras, at hindi lubos na nilulutas na diwa ng “sa harap ng Diyos.”
