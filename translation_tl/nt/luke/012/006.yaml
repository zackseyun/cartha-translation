  source_fidelity: 'Tumpak ang pangunahing pag-unawa: ang στρουθία ay maaaring “maya,” ang πωλοῦνται ay “ipinagbibili,” at ang dalawang asarion ay wastong napanatili bilang sinaunang baryang Romano. Gayunman, ang “nalilimutan” ay mas aspektong pangkasalukuyan/paulit-ulit kaysa sa perfect participle na ἐπιλελησμένον, na nagsasaad ng kalagayan ng hindi pagiging nakalimutan. Mas tumpak at likas ang “hindi nakalimutan ng Diyos.”'
  naturalness: Malinaw at marangal ang draft, ngunit medyo di-karaniwan sa Filipino ang “hindi nalilimutan sa harap ng Diyos.” Ang paggamit ng Diyos bilang tagaganap—“hindi nakalimutan ng Diyos”—ay mas natural at naipahihiwatig pa rin ang “sa harap ng Diyos” bilang pagiging nasa pansin niya.
  terminology: Ang “maya” at “asarion” ay angkop. Ang “baryang tanso ng Roma” ay malinaw. Ang alternatibong talababa ay dapat tumukoy sa “overlooked,” hindi sa mas malawak na ideyang “napapabayaan,” upang hindi magdagdag ng doktrina ng pagkalinga na hindi tuwirang sinasabi ng salita.
  issues:
  - severity: medium
    issue: Aspekto ng “nalilimutan”
    rationale: Ang Griyegong perfect participle ἐπιλελησμένον ay mas malapit sa “nakalimutan”/“hindi nakalimutan” kaysa sa imperfective na “nalilimutan.”
  - severity: low
    issue: Di-natural na “sa harap ng Diyos” kasunod ng “nalilimutan”
    rationale: Bagaman malapit sa literal na anyo, mas likas sa modernong Filipino ang “hindi nakalimutan ng Diyos,” na wastong naghahatid ng diwa ng pagiging hindi nalilimutan sa paningin ng Diyos.
  - severity: medium
    issue: Ang “napapabayaan” sa talababa ay mas malawak kaysa sa leksikal na alternatibo
    rationale: Ang “overlooked” ay mas tumpak na maipapahayag bilang “hindi napapansin” o “hindi nalalampasan sa pansin”; ang “napapabayaan” ay nagpapahiwatig ng kakulangan sa pag-aalaga.
