- from: Hindi ba ipinagbibili ang limang maya sa halagang dalawang asarion? Gayunman, ni isa sa kanila ay hindi nalilimutan sa harap ng Diyos.[a][b]
  to: Hindi ba ipinagbibili ang limang maya sa halagang dalawang asarion? Gayunman, ni isa sa kanila ay hindi nakalimutan ng Diyos.[a][b]
  rationale: Inayos ang aspekto ng pandiwa upang masalamin ang perfect participle na “having been forgotten,” at ginawang mas likas sa Filipino ang kaugnayan sa Diyos sa pamamagitan ng “hindi nakalimutan ng Diyos.” Pinalitan din ang alternatibong “napapabayaan” ng “hindi napapansin” upang manatiling leksikal at hindi magdagdag ng mas malawak na pahayag tungkol sa pagkalinga.
