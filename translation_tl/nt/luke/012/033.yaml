id: LUK.12.33
reference: Luke 12:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πωλήσατε τὰ ὑπάρχοντα ὑμῶν καὶ δότε ἐλεημοσύνην· ποιήσατε ἑαυτοῖς βαλλάντια μὴ παλαιούμενα, θησαυρὸν ἀνέκλειπτον ἐν τοῖς οὐρανοῖς, ὅπου κλέπτης οὐκ ἐγγίζει οὐδὲ σὴς διαφθείρει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/033.yaml
  text: Sell your possessions and give alms[a]. Make for yourselves money bags that do not wear out, an unfailing treasure in the heavens[b], where no thief comes near and no moth destroys.
translation:
  language: tl
  text: Ipagbili ninyo ang inyong mga ari-arian at magbigay kayo ng limos.[a] Gumawa kayo para sa inyong mga sarili ng mga supot ng salaping hindi naluluma—isang kayamanang hindi nauubos sa mga langit,[b] kung saan walang magnanakaw na makalalapit at walang gamu-gamo na makapaninira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magbigay kayo sa mga nangangailangan.” Ang salitang Griyego ay tumutukoy sa pagbibigay bilang gawa ng awa para sa mga nangangailangan.
    reason: lexical_alternative
  - marker: b
    text: 'O “sa langit.” Maramihan ang anyo sa Griyego: “sa mga langit.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πωλήσατε
  choice: Ipagbili ninyo
  rationale: Tuwirang pautos sa maramihan; ipinahahayag ang tiyak na pagkilos nang hindi idinaragdag na kailangang ubusin o ipagbili ang lahat.
- source_word: τὰ ὑπάρχοντα ὑμῶν
  choice: ang inyong mga ari-arian
  rationale: Likas at malinaw na tawag sa mga pag-aari o pag-aaring materyal ng mga kinakausap.
- source_word: δότε ἐλεημοσύνην
  choice: magbigay kayo sa mga nangangailangan
  rationale: Ipinahahayag sa makabagong Tagalog ang kongkretong pagkakawanggawa o pagbibigay bilang gawa ng awa sa nangangailangan, sa halip na gumamit ng hindi gaanong karaniwang salitang 'limos' na maaaring magpahiwatig lamang ng maliit na abuloy.
- source_word: ποιήσατε ἑαυτοῖς
  choice: Gumawa kayo para sa inyong sarili
  rationale: Pinananatili ang pautos at ang diwang ang kilos ay para sa kapakinabangan ng mismong mga kinakausap.
- source_word: βαλλάντια
  choice: mga lukbutan
  rationale: Ang lukbutan ay sisidlan ng salapi at pinananatili nito ang konkretong talinghaga ng sinaunang supot ng salapi.
- source_word: μὴ παλαιούμενα
  choice: hindi naluluma
  rationale: Malapit sa literal na diwang hindi tumatanda o naluluma at natural na inilalarawan ang mga lukbutan.
- source_word: θησαυρὸν ἀνέκλειπτον
  choice: isang kayamanang hindi nauubos
  rationale: Ipinapakita ang diwa ng ἀνέκλειπτος bilang hindi pumapalya o nauubusan, sa malinaw na kasalukuyang Tagalog.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: sa kalangitan
  rationale: Ang kolektibong 'kalangitan' ay natural sa Tagalog habang naipahihiwatig ang anyong maramihan ng Griyego.
- source_word: ὅπου κλέπτης οὐκ ἐγγίζει
  choice: kung saan walang magnanakaw na makalalapit
  rationale: Pinananatili ang larawang pangkalawakan ng magnanakaw na hindi nakalalapit.
- source_word: οὐδὲ σὴς διαφθείρει
  choice: at walang bukbok na makasisira
  rationale: Sa Filipino, 'bukbok' ang natural na tawag sa mapanirang insektong sumisira sa nakaimbak na ari-arian; inililipat nito nang malinaw ang funksiyon ng σής sa konteksto.
theological_decisions:
- issue: Saklaw ng ἐλεημοσύνην sa utos tungkol sa mga ari-arian
  choice: magbigay kayo sa mga nangangailangan
  alternative: magbigay kayo ng limos
  rationale: Ginagawang malinaw ang gawa ng awa para sa nangangailangan nang hindi ito ginagawang pangkalahatang programang pang-ekonomiya o nililimitahan sa maliit na limos.
- issue: Anyong maramihan ng ἐν τοῖς οὐρανοῖς
  choice: sa kalangitan
  alternative: sa langit
  rationale: Pinananatili ng kolektibong anyo ang tekstura ng Griyegong maramihan, ngunit iniiwasan ang di-likas na 'sa mga langit' sa modernong Tagalog.
- issue: Ugnayan ng mga lukbutan at kayamanan
  choice: mga lukbutang hindi naluluma—isang kayamanang hindi nauubos
  alternative: mga lukbutang hindi naluluma, at isang kayamanang hindi nauubos
  rationale: 'Ang gatlang ay nagpapanatili sa malapit na appositional na ugnayan: ang talinghaga ng mga lukbutan ay ipinaliliwanag bilang kayamanang hindi nauubos, nang hindi ginagawang dalawang hiwalay na utos.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'lukbutan' upang mapanatili ang konkretong talinghaga ng sisidlan ng salapi; bagaman hindi pang-araw-araw ang salita, madaling maunawaan ito sa pangungusap. Ang 'mga nangangailangan' ay mas natural at mas malawak na tapat sa gawa ng awa kaysa sa 'mahihirap' lamang.
