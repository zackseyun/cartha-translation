revisions:
- from: Ipagbili ninyo ang inyong mga ari-arian at magbigay kayo sa mga nangangailangan.[a] Gumawa kayo para sa inyong sarili ng mga lukbutang hindi naluluma—isang kayamanang hindi nauubos sa kalangitan,[b] kung saan walang magnanakaw na makalalapit at walang bukbok na makasisira.
  to: Ipagbili ninyo ang inyong mga ari-arian at magbigay kayo ng limos.[a] Gumawa kayo para sa inyong mga sarili ng mga supot ng salaping hindi naluluma—isang kayamanang hindi nauubos sa mga langit,[b] kung saan walang magnanakaw na makalalapit at walang gamu-gamo na makapaninira.
