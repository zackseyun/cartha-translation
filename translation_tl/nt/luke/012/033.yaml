  naturalness: Mas natural sa modernong Filipino ang “mga supot ng salaping hindi naluluma” at “gamu-gamo na makapaninira.” Ang “para sa inyong mga sarili” ay wastong maramihang reflexive na anyo.
  terminology: “Limos” ang tuwirang tradisyonal ngunit nauunawaang katumbas ng ἐλεημοσύνην; nililinaw ng talababa na ito ay pagbibigay sa mga nangangailangan. “Mga langit” ay pinanatili upang katawanin ang maramihang Griyego, bagaman ang “kalangitan” ay posible ring idiomatikong salin.
