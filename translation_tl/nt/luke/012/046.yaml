  to: Darating ang amo ng aliping iyon sa araw na hindi inaasahan ng alipin ang kanyang pagdating at sa oras na hindi niya alam. Hahatiin niya ang alipin sa dalawa[a] at itatakda ang kanyang bahagi kasama ng mga hindi tapat[b].
  rationale: Inayos ang unang sugnay upang malinaw na ang alipin ay hindi umaasa sa pagdating ng amo, nang hindi binabago ang pagkakaiba ng hindi pag-asam (προσδοκᾷ) at hindi pagkaalam (γινώσκει). Pinalitan ang mas maluwag na “bibigyan siya ng lugar” ng “itatakda ang kanyang bahagi” upang mas maipakita ang τὸ μέρος αὐτοῦ at ang hudisyal na puwersa ng θήσει. Ang pangunahing teksto ay nananatiling literal sa marahas na larawan; ang idyomatikong posibilidad ay nasa talababa.
