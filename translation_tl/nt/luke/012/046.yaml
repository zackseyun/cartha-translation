base_translation:
  language: en
  yaml_path: translation/nt/luke/012/046.yaml
  text: the master of that servant will come on a day when he does not expect him and at an hour he does not know[b][a], and will cut him in pieces and assign his place with the unfaithful.
translation:
  language: tl
  text: Darating ang amo ng aliping iyon sa araw na hindi inaasahan ng alipin ang kanyang pagdating at sa oras na hindi niya alam. Hahatiin niya ang alipin sa dalawa[a] at itatakda ang kanyang bahagi kasama ng mga hindi tapat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain ng ilan ang pananalitang ito bilang idyoma na nangangahulugang “paparusahan siya nang napakatindi.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mga hindi sumasampalataya.”
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: amo
  rationale: Sa parabulang ito, tinutukoy ng salita ang amo ng isang alipin. Likas sa modernong Tagalog ang “amo” at hindi nito ipinapalagay na tuwirang titulong kristolohikal ang gamit dito.
- source_word: δοῦλος
  choice: alipin
  rationale: Malinaw sa tagpo ang ugnayang pagmamay-ari at kapangyarihan; pinananatili ng “alipin” ang bigat ng δοῦλος na hindi lubos na naihahatid ng mas banayad na “lingkod.”
- source_word: ἥξει
  choice: darating
  rationale: Karaniwang katumbas ito ng pagdating ng amo at angkop sa babalang nasa hinaharap.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: sa araw na hindi niya inaasahang darating ito
  rationale: Ipinahihiwatig ng Griyego na ang hindi inaasahan ng alipin ay ang pagdating ng amo. Nilinaw ito sa Tagalog upang maiwasan ang malabong panghalip.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: sa oras na hindi niya alam
  rationale: Pinananatili nito ang pagkakaiba ng προσδοκάω, “umasa/maghintay,” at γινώσκω, “malaman.”
- source_word: διχοτομήσει
  choice: hahatiin siya ... sa dalawa
  rationale: Literal na tumutukoy ang pandiwa sa paghahati o pagputol sa dalawa. Pinananatili sa pangunahing teksto ang marahas na larawan, habang inilalagay sa talababa ang posibleng idyomatikong pagkaunawa.
- source_word: τὸ μέρος αὐτοῦ
  choice: bibigyan siya ng lugar
  rationale: Ang μέρος ay maaaring “bahagi,” “takdang kapalaran,” o “lugar.” Ang pariralang “bibigyan siya ng lugar kasama” ay natural sa Tagalog at naghahatid ng ideya ng itinakdang kalalagyan.
- source_word: ἀπίστων
  choice: mga hindi tapat
  rationale: Sa konteksto ng aliping nagtaksil sa ipinagkatiwala sa kanya, ang “hindi tapat” ang pinakamalapit sa agarang diwa. Gayunman, maaari ring mangahulugan ang salita ng “mga hindi sumasampalataya,” kaya isinama iyon sa talababa.
- source_word: θήσει
  choice: bibigyan ... ng lugar
  rationale: Sa konstruksyong ito, ipinahihiwatig ng τίθημι ang paglalagay o pagtatalaga sa isang kalalagyan o kapalaran; natural itong naipahayag sa Tagalog sa pariralang ito.
theological_decisions:
- issue: Kung literal na pananatilihin ang marahas na larawan ng διχοτομήσει o gagawing idyoma para sa matinding parusa
  choice: Pinanatili sa pangunahing teksto ang “hahatiin siya ... sa dalawa.”
  alternative: “paparusahan siya nang napakatindi”
  rationale: Tunay na nasa Griyego ang marahas na larawan at mahalaga sa tindi ng babala. Hindi tiyak na idyomatiko lamang ito, kaya hindi dapat palitan nang tahimik; ang alternatibong pagkaunawa ay nasa talababa.
- issue: Kung ang ἀπίστων ay tumutukoy sa mga hindi tapat o sa mga hindi sumasampalataya
  choice: mga hindi tapat
  alternative: mga hindi sumasampalataya
  rationale: Ang katapatan ng alipin ang agarang paksa ng parabula, ngunit maaaring magdala rin ang ἄπιστος ng diwa ng kawalan ng pananampalataya. Pinananatili ng talababa ang dalawang posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “amo” at “alipin” upang malinaw ang ugnayan sa parabulang sambahayan. Iniwasan ang sobrang pormal na ayos at pinanatili ang pagkakaiba ng hindi pag-asam at hindi pagkaalam.
