  yaml_path: translation/nt/luke/012/017.yaml
  text: And he reasoned within himself[a], saying, ‘What will I do[b], since I have nowhere to gather my crops?’
translation:
  language: tl
  text: 'At nag-isip-isip siya sa sarili niya, na sinasabi: “Ano ang gagawin ko, dahil wala akong lugar kung saan ko matitipon ang aking ani?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελογίζετο
  choice: nag-isip-isip
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang nagpapatuloy na panloob na pag-iisip o pagbubulay. Likas sa modernong Tagalog ang “nag-isip-isip” at naipapakita nito ang masusing pag-iisip nang hindi labis na teknikal.
- source_word: ἐν ἑαυτῷ λέγων
  choice: 'siya:'
  rationale: Sa Tagalog, sapat at natural ang “nag-isip-isip siya” upang ipahayag ang panloob na pagsasalita; ipinakikilala ng tutuldok ang mismong laman ng iniisip niya nang hindi ipinahihiwatig na binigkas niya ito nang malakas.
- source_word: Τί ποιήσω
  choice: Ano ang gagawin ko?
  rationale: Natural na deliberatibong tanong ito sa kasalukuyang Tagalog at pinananatili ang diwa ng aorist subjunctive.
- source_word: ὅτι οὐκ ἔχω ποῦ
  choice: Wala akong mapaglalagyan
  rationale: Idiomatiko sa Tagalog ang pariralang ito at malinaw na ipinapahayag ang kawalan ng lugar para sa ani. Ang ugnayang sanhi ay likas na nauunawaan mula sa kasunod na pangungusap.
- source_word: συνάξω
  choice: mapaglalagyan
  rationale: Bagaman pangunahing nangangahulugang “tipunin,” sa kontekstong ito ang suliranin ay kung saan ilalagay o iimbak ang ani. Inihahatid ng “mapaglalagyan” ang kontekstuwal na diwa at tumutugma sa susunod na talata tungkol sa mga kamalig.
- source_word: τοὺς καρπούς μου
  choice: aking ani
  rationale: Ang καρποί dito ay bunga o produksiyong pansakahan. Mas natural at tiyak sa konteksto ang “ani” kaysa literal na “mga bunga.”
