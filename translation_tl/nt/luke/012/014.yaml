  source_fidelity: Ang “rito” ay hindi wastong katumbas ng αὐτῷ (“sa kanya”) sa pangungusap na ito. Dagdag din sa Griyego ang “ng ari-arian”; bagaman mana ang konteksto, ang μεριστής ay nananatiling mas malawak na “tagahati/divider.” Ang maramihang saklaw ng ἐφ’ ὑμᾶς ay dapat manatili.
  naturalness: Mas natural at malinaw ang “sinabi niya sa kanya.” Ang pantawag na “Tao” ay mas malapit sa Ἄνθρωπε kaysa “Lalaki,” na maaaring magtunog bilang paglalarawan lamang ng kasarian. Ang “tagahati sa inyo” ay maikli at pinananatili ang tungkuling tinutukoy nang walang dagdag na paliwanag.
  terminology: “Hukom” ay wastong salin ng κριτής. “Tagahati” ay sapat para sa μεριστής at hindi ipinapalit ang interpretatibong “tagapamagitan” o idinadagdag ang “ari-arian.”
