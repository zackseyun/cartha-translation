base_translation:
  language: en
  yaml_path: translation/nt/luke/012/014.yaml
  text: But he said to him, “Man, who appointed me a judge or divider over you?”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanya, “Tao, sino ang nagtalaga sa akin bilang hukom o tagahati sa inyo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνθρωπε
  choice: Lalaki
  rationale: Tuwirang pantawag sa isang lalaking kausap; pinananatili ang bahagyang matigas at mapaglayong tono nang hindi gumagamit ng lipas na “Mama.”
- source_word: κατέστησεν
  choice: nagtalaga
  rationale: Natural na salin ng pandiwang tumutukoy sa paghirang o pagtatalaga sa isang tungkulin.
- source_word: κριτὴν
  choice: hukom
  rationale: Karaniwang katumbas na malinaw na tumutukoy sa may awtoridad na humatol sa usapin.
- source_word: μεριστὴν
  choice: tagahati ng ari-arian
  rationale: Sa konteksto ng alitan tungkol sa mana, nililinaw ang bagay na hahatiin habang pinananatili ang kongkretong diwa ng “divider,” sa halip na ipalit ang mas interpretatibong “tagapamagitan.”
- source_word: ἐφ’ ὑμᾶς
  choice: ninyo
  rationale: Ang panghalip ay maramihan at tumutukoy sa mga sangkot sa alitan; sa Filipino, natural itong ikinakabit sa mga tungkuling binanggit.
theological_decisions:
- issue: Saklaw ng pagtanggi ni Jesus
  choice: Isinalin bilang tanong kung sino ang nagtalaga sa kaniya sa partikular na papel na hukom o tagahati ng ari-arian sa kanila.
  alternative: Isalin bilang pangkalahatang pagtanggi ni Jesus sa anumang tungkulin bilang hukom.
  rationale: Hindi dapat palawakin ang retorikal na tanong upang maging ganap na doktrinal na pahayag tungkol sa lahat ng anyo ng paghatol; ang agarang konteksto ay alitan sa mana.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “rito” para sa αὐτῷ at ang maramihang “ninyo” para sa ὑμᾶς. Walang footnote marker dahil walang footnote.
