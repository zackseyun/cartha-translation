id: LUK.12.11
reference: Luke 12:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀εἰσφέρωσιν ὑμᾶς ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας, μὴ ⸀μεριμνήσητε πῶς ⸂ἢ τί⸃ ἀπολογήσησθε ἢ τί εἴπητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/011.yaml
  text: But whenever they bring you before the synagogues and the rulers and the authorities[a], do not worry about how or what you should say in your defense, or what you should say[b];
translation:
  language: tl
  text: Ngunit kapag iniharap nila kayo sa mga sinagoga, mga pinuno, at mga awtoridad[a], huwag kayong mag-alala kung paano o kung ano ang isasagot ninyo sa pagtatanggol sa inyong sarili, o kung ano ang sasabihin ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga sinagoga, mga pinuno, at mga awtoridad” ay tumutukoy sa mga lupon at opisyal—panrelihiyon man o sibil—na maaaring magsiyasat sa mga alagad.
    reason: cultural_note
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Ngunit kapag
  rationale: Ipinahihiwatig ng ὅταν ang isang pangyayaring maaaring maulit o mangyari sa hinaharap; ang δέ ay banayad na paglipat o pagsalungat, kaya natural ang “Ngunit kapag” sa konteksto.
- source_word: εἰσφέρωσιν ὑμᾶς
  choice: dinala nila kayo
  rationale: Sa kasunod na ἐπί at sa kontekstong hudisyal, tumutukoy ito sa pagdadala sa isang tao upang humarap sa mga lupon o awtoridad.
- source_word: ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: sa harap ng mga sinagoga, mga pinuno, at mga may kapangyarihan
  rationale: Ang “sa harap ng” ay malinaw na naghahatid ng diwang pagharap para siyasatin o litisin. Pinananatili ang tatlong magkakaugnay ngunit magkakaibang katawagan sa Griyego.
- source_word: συναγωγάς
  choice: mga sinagoga
  rationale: Pinananatili ang literal na institusyong tinutukoy; sa konteksto, maaari itong metonimikong tumukoy sa mga lupong nakaugnay sa sinagoga.
- source_word: ἀρχάς
  choice: mga pinuno
  rationale: Sa kontekstong pampamahalaan at hudisyal, tumutukoy ito sa mga namumuno o opisyal, hindi sa espirituwal na mga kapangyarihan.
- source_word: ἐξουσίας
  choice: mga may kapangyarihan
  rationale: Ipinahahayag nito ang mga taong o katawang may ipinagkaloob na awtoridad; natural at malinaw ito sa modernong Tagalog.
- source_word: μὴ μεριμνήσητε
  choice: huwag kayong mag-alala
  rationale: Ang pandiwa ay tumutukoy sa balisang pag-aalala o labis na pag-iisip; karaniwan at tuwiran ang “mag-alala.”
- source_word: πῶς ἢ τί ἀπολογήσησθε
  choice: kung paano ninyo ipagtatanggol ang inyong sarili
  rationale: Ang ἀπολογήσησθε ay may hudisyal na diwa ng pagsagot o pagtatanggol sa sarili. Sa Tagalog, likas nang saklaw ng “kung paano ... ipagtatanggol” ang paraan at nilalaman ng pagtatanggol, habang ang tekstuwal na “o kung ano” ay ipinaliliwanag sa talababa upang hindi maging asiwa ang pangunahing teksto.
- source_word: ἢ τί εἴπητε
  choice: o kung ano ang sasabihin ninyo
  rationale: Pinananatili nito ang hiwalay na huling sugnay tungkol sa mismong sasabihin, gaya ng nasa Griyego.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na magalang at madaling maunawaan. Ginamit ang “mga may kapangyarihan” sa halip na mas teknikal na “mga awtoridad,” at pinanatili ang hudisyal na diwa ng talata nang hindi ginagawang tahasang “mga hukuman” ang mga sinagoga.
