  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kamalig” dahil pamilyar ito sa kontekstong agrikultural, habang inilagay sa talababa ang mas malawak na “imbakan.” Pinanatili ang direkta at mapagpasiyang tono ng sunod-sunod na mga pandiwang panghinaharap.
