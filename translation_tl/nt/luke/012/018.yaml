  text: 'And he said[a], ‘This is what I will do: I will tear down my barns and build larger ones[c][b], and there I will gather all my grain and my goods.’'
translation:
  language: tl
  text: 'At sinabi niya, “Ito ang gagawin ko: Gigibain ko ang aking mga kamalig[a] at magtatayo ako ng mas malalaking kamalig. Doon ko titipunin ang lahat ng butil[b] at mga ari-arian[c] ko.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga imbakan” para sa “mga kamalig” (ἀποθήκας).
    reason: lexical_alternative
  - marker: b
    text: Ang “butil” (σῖτος) ay maaari ring mas partikular na mangahulugang “trigo” sa ilang konteksto.
    reason: lexical_alternative
  - marker: c
    text: O “mga pag-aari” para sa “mga ari-arian” (τὰ ἀγαθά μου).
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο ποιήσω
  choice: Ito ang gagawin ko
  rationale: Natural na Filipino na pinananatili ang pagbibigay-diin sa planong kasunod ng τοῦτο.
- source_word: καθελῶ
  choice: Gigibain ko
  rationale: Malinaw at kongkretong tumutukoy sa pagpapabagsak o pagtanggal sa mga umiiral na gusali.
- source_word: ἀποθήκας
  choice: mga kamalig
  rationale: Angkop sa kontekstong agrikultural at likas na tawag sa mga gusaling imbakan ng ani; maaari rin itong mangahulugang mas pangkalahatang mga imbakan.
- source_word: μείζονας οἰκοδομήσω
  choice: magtatayo ako ng mas malalaki
  rationale: Isinusuplay ang ipinahihiwatig na mga kamalig at pinananatili ang paghahambing na “mas malalaki.”
- source_word: συνάξω ἐκεῖ
  choice: Doon ko titipunin
  rationale: Tuwirang pinananatili ang diwa ng pagtitipon at ang pook na tinutukoy ng ἐκεῖ, nang hindi ito ginagawang mas interpretibong “iimbakin.”
- source_word: πάντα τὸν σῖτον
  choice: ang lahat ng aking butil
  rationale: Ang σῖτος ay karaniwang butil at kung minsan ay partikular na trigo. Ang “aking” ay likas sa pananalita ng may-ari at kaagapay ng tahasang “aking mga ari-arian” sa kasunod na parirala.
- source_word: τὰ ἀγαθά μου
  choice: mga ari-arian
  rationale: Pinananatili ang malawak na diwa ng mga pag-aari o materyal na bagay at hindi ito nililimitahan sa salapi o kayamanan lamang.
