  source_fidelity: Ang pangunahing diwa at pagkakasunod-sunod ng mga pandiwang panghinaharap ay tapat sa Griyego. Gayunman, ang «aking» sa «lahat ng aking butil» ay walang katumbas na tahasang possessive sa πάντα τὸν σῖτον. Bagaman maaaring ipahiwatig ng konteksto na sarili niyang ani ang tinutukoy, hindi ito dapat idagdag sa pangunahing teksto.
  naturalness: Natural at marangal ang pangungusap. Mas malinaw sa makabagong Filipino na ulitin ang ipinahihiwatig na pangngalan sa «mas malalaking kamalig» kaysa iwan ang «mas malalaki» na maaaring bahagyang bitin.
  terminology: Ang «kamalig» ay angkop para sa ἀποθήκας sa kontekstong agrikultural; ang «butil» ay angkop para sa σῖτος; at ang «mga ari-arian» ay katanggap-tanggap para sa τὰ ἀγαθά μου. Ang mga talababa ay wasto ang mga marker at ang mga alternatibong leksikal.
