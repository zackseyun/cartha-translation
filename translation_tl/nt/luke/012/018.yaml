  to: 'At sinabi niya, “Ito ang gagawin ko: Gigibain ko ang aking mga kamalig[a] at magtatayo ako ng mas malalaking kamalig. Doon ko titipunin ang lahat ng butil[b] at mga ari-arian[c] ko.”'
