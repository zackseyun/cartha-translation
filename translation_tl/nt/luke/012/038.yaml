id: LUK.12.38
reference: Luke 12:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂κἂν ἐν τῇ δευτέρᾳ κἂν⸃ ἐν τῇ τρίτῃ φυλακῇ ἔλθῃ καὶ εὕρῃ οὕτως, μακάριοί ⸀εἰσιν ἐκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/038.yaml
  text: Even if he comes in the second watch[a], or even in the third, and finds them so[b], blessed are those servants.
translation:
  language: tl
  text: Kahit dumating siya sa ikalawang pagbabantay sa gabi[a], o kahit sa ikatlo, at matagpuan niya sila sa gayong kalagayan, pinagpala ang mga aliping iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa ikalawang yugto ng pagbabantay sa gabi, o kahit sa ikatlong yugto.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “pinagpala ang mga iyon.” Ang tinutukoy ay ang mga alipin na binanggit sa malapit na konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν ... κἂν
  choice: Kahit ... o kahit
  rationale: 'Pinananatili nito ang inuulit na diin at ang di-tiyak na kondisyong may pagpap concessive na diwa: mangyari man ito sa alinman sa dalawang oras.'
- source_word: δευτέρᾳ ... τρίτῃ φυλακῇ
  choice: ikalawang pagbabantay sa gabi ... ikatlo
  rationale: Ang φυλακή rito ay isang takdang yugto ng pagbabantay sa gabi. Isinama ang “sa gabi” upang maging malinaw sa karaniwang mambabasa; hindi ito tumutukoy sa bilangguan o himpilan ng mga bantay.
- source_word: ἔλθῃ
  choice: dumating siya
  rationale: Ang aorist subjunctive sa kondisyong ito ay likas na naipahahayag sa Filipino sa anyong “dumating,” na nagpapanatili sa di-tiyak na posibilidad sa hinaharap.
- source_word: εὕρῃ οὕτως
  choice: matagpuan niya sila sa gayong kalagayan
  rationale: Tumutukoy ang οὕτως sa kalagayang inilarawan sa naunang talata. Ang “gayong kalagayan” ay natural sa Filipino at hindi tahasang nilulutas kung aling detalye ng naunang paglalarawan ang binibigyang-diin.
- source_word: μακάριοι
  choice: pinagpala
  rationale: Ipinahahayag nito ang pagiging nasa kalugud-lugod at kanais-nais na kalagayan, at pinananatili ang bigat ng biblikal na pahayag kaysa sa simpleng “masaya” o “mapalad.”
- source_word: ἐκεῖνοι
  choice: ang mga aliping iyon
  rationale: Literal itong “ang mga iyon,” ngunit malinaw na ang tinutukoy ay ang mga alipin sa malapit na konteksto. Ang pagbanggit sa “mga alipin” ay nagbibigay-linaw nang hindi nagdaragdag ng bagong diwa.
theological_decisions:
- issue: Paglalantad sa tinutukoy ng ἐκεῖνοι
  choice: ang mga aliping iyon
  alternative: ang mga iyon
  rationale: Demonstrative pronoun lamang ang nasa Griyego, ngunit ang malinaw na tinutukoy nito ay ang mga alipin ng panginoon sa naunang konteksto. Inilantad ang antecedent para sa linaw, habang itinala sa talababa ang literal na anyo.
- issue: Kahulugan ng οὕτως
  choice: sa gayong kalagayan
  alternative: na handa
  rationale: Hindi tahasang sinasabi ng talata ang “handa”; itinuturo lamang ng οὕτως ang naunang paglalarawan. Pinananatili ng salin ang sanggunian at hindi isinasara ang saklaw nito sa iisang paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “alipin” upang tumugma sa malinaw na antecedent sa konteksto, ngunit hindi ito ipinakilalang salin ng salitang wala mismo sa talatang ito. Ang “pagbabantay sa gabi” ay mas madaling maunawaan kaysa sa teknikal na “watch,” habang napapanatili ang sinaunang paghahati ng magdamag.
