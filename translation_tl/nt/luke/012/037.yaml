source:
  edition: SBLGNT
  text: μακάριοι οἱ δοῦλοι ἐκεῖνοι, οὓς ἐλθὼν ὁ κύριος εὑρήσει γρηγοροῦντας· ἀμὴν λέγω ὑμῖν ὅτι περιζώσεται καὶ ἀνακλινεῖ αὐτοὺς καὶ παρελθὼν διακονήσει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/037.yaml
  text: Blessed are those servants whom the Lord[a], when he comes, will find staying awake. Truly I say to you, he will dress himself for service and have them recline at the table[c][b], and he will come and serve them.
translation:
  language: tl
  text: Pinagpala ang mga aliping iyon na madaratnan ng Panginoon[a] na gising pa rin pagdating niya. Tunay na sinasabi ko sa inyo, magbibihis siya upang maglingkod[b], pauupuin niya sila sa hapag[c], at lalapit siya at maglilingkod sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “amo” o “panginoon ng sambahayan”; ang Griyegong kyrios ay maaaring mangahulugan ng “Panginoon” o “amo” sa tagpong ito.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “bibigkisan niya ang sarili.” Ibig sabihin, ihahanda niya ang kaniyang kasuotan para sa paglilingkod.
    reason: cultural_note
  - marker: c
    text: Sa literal, pahihigain o pahihilig niya sila sa hapag, ayon sa kaugalian noon sa pagkain.
    reason: cultural_note
lexical_decisions:
- source_word: μακάριοι
  choice: Pinagpala
  rationale: Pinananatili nito ang maringal at panrelihiyong himig ng pahayag ng pagpapala, sa halip na limitahan ito sa pansariling saya o magandang kapalaran.
- source_word: δοῦλοι
  choice: mga alipin
  rationale: Maliwanag sa talinghaga ang ugnayang panlipunan ng panginoon at mga taong nakatali sa sambahayan; mas tuwirang inilalarawan ng “alipin” ang δοῦλος kaysa “lingkod.”
- source_word: κύριος
  choice: Panginoon
  rationale: Maaaring tumukoy sa panginoon ng sambahayan, ngunit pinananatili ng “Panginoon” ang karaniwang katumbas at ang posibleng mas malalim na alingawngaw ng talinghaga nang hindi iyon ipinipilit.
- source_word: γρηγοροῦντας
  choice: gising pa rin
  rationale: Tuwirang ipinahahayag ang patuloy na pagpupuyat o pagiging handa sa pagdating ng panginoon.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Tunay na sinasabi ko sa inyo
  rationale: Pinananatili ang mariing pormula ni Jesus sa natural ngunit maringal na modernong Tagalog.
- source_word: περιζώσεται
  choice: magbibihis siya upang maglingkod
  rationale: Ipinahahayag ang kahulugan ng pagbibigkis o paghahanda ng kasuotan para sa aktibong paglilingkod, na mas nauunawaan sa modernong Tagalog.
- source_word: ἀνακλινεῖ αὐτούς
  choice: pauupuin niya sila sa hapag
  rationale: Natural itong paglalarawan sa pagpupuwesto sa kanila para sa isang salu-salo; ipinapaliwanag sa talababa ang literal na kaugaliang paghilig sa hapag.
- source_word: παρελθὼν
  choice: lalapit siya
  rationale: Sa konteksto ng paglilingkod sa hapag, ipinahihiwatig nito ang paglapit o pag-ikot ng panginoon sa mga nakahain.
- source_word: διακονήσει αὐτοῖς
  choice: paglingkuran sila
  rationale: Malinaw nitong ipinapahayag ang praktikal na paglilingkod, lalo na ang pagsisilbi sa hapag, nang walang di-kinakailangang tonong pansimbahan.
theological_decisions:
- issue: Pagpapakahulugan sa κύριος sa loob ng talinghaga na maaaring may kristolohikal na alingawngaw
  choice: Panginoon
  alternative: panginoon ng sambahayan o amo
  rationale: Pinananatili ng “Panginoon” ang karaniwang katawagan at ang posibleng alingawngaw na ang Panginoon mismo ang maglilingkod, samantalang kinikilala sa talababa ang agarang tagpo ng sambahayan.
- issue: Pagpapakahulugan sa δοῦλος sa tagpo ng sambahayan
  choice: alipin
  alternative: lingkod
  rationale: Mahalaga sa larawan ang hindi pantay at nakatali nilang kalagayan sa panginoon; kaya “alipin” ang mas tapat sa terminong Griyego, nang hindi ipinapalagay ang isang tiyak na makabagong anyo ng pang-aalipin.
translation_notes:
  register: Modernong Filipino Tagalog na maringal ngunit madaling maunawaan. Ginamit ang “alipin” para sa tahasang ugnayang sambahayan, “Panginoon” upang mapanatili ang leksikal at teolohikal na puwang ng κύριος, at mga natural na parirala para sa sinaunang kaugalian sa kasuotan at pagkain.
