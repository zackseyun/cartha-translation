  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ θεός· ⸀Ἄφρων, ταύτῃ τῇ νυκτὶ τὴν ψυχήν σου ⸀ἀπαιτοῦσιν ἀπὸ σοῦ· ἃ δὲ ἡτοίμασας, τίνι ἔσται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/020.yaml
  text: But God said to him, ‘Fool! This very night your life is being demanded back from you, and the things you prepared—whose will they be?’
translation:
  language: tl
  text: Ngunit sinabi sa kanya ng Diyos, “Hangal! Sa gabi ring ito, babawiin sa iyo ang iyong buhay.[a] At ang mga inihanda mo, kanino mapupunta ang mga iyon?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang iyong kaluluwa.” Ang salitang Griyego ay maaaring mangahulugang “buhay” o “kaluluwa,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφρων
  choice: Hangal
  rationale: Tuwirang tawag na may matinding pagsaway; natural at marangal sa modernong Tagalog nang hindi dinaragdagan ang diwa.
- source_word: ταύτῃ τῇ νυκτί
  choice: Sa gabi ring ito
  rationale: Ipinahahayag ang diin at agarang pagdating ng pangyayari sa natural na Tagalog.
- source_word: ψυχήν
  choice: buhay
  rationale: Sa konteksto, tumutukoy ito sa buhay ng lalaki na matatapos nang gabing iyon; hindi nito ipinipilit ang mas makitid na antropolohikal na kahulugan ng “kaluluwa.”
- source_word: ἀπαιτοῦσιν ἀπὸ σοῦ
  choice: babawiin sa iyo
  rationale: Ang ἀπαιτέω ay maaaring mangahulugang singilin o hinging pabalik. Ang di-tiyak na maramihang tagaganap ay likas na naipahahayag sa Tagalog nang hindi tumutukoy kung sino ang babawi.
- source_word: ἃ δὲ ἡτοίμασας
  choice: ang mga inihanda mo
  rationale: Malapit sa Griyego at malinaw na tumutukoy sa mga naipong ari-arian o bagay.
- source_word: τίνι ἔσται
  choice: kanino mapupunta ang mga iyon?
  rationale: Natural na tanong sa Tagalog tungkol sa magiging pag-aari o tatanggap, habang pinananatili ang retorikal na puwersa.
theological_decisions:
- issue: Pagpapakahulugan sa ψυχή sa konteksto ng kamatayan
  choice: buhay
  alternative: kaluluwa
  rationale: Ang agarang konteksto ay ang nalalapit na kamatayan ng lalaki. Pinananatili sa talababa ang “kaluluwa” bilang tunay na alternatibong kahulugan ng salitang Griyego.
- issue: Di-tiyak na tagaganap ng ἀπαιτοῦσιν
  choice: babawiin sa iyo
  alternative: hihingin nila sa iyo
  rationale: Hindi tinutukoy ng Griyego kung sino ang ipinahihiwatig ng maramihang pandiwa. Iniiwasan ng salin ang pag-imbento ng tiyak na mga tagaganap habang pinananatili ang diwa ng sapilitang pagbawi.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “Sa gabi ring ito” para sa diin at “kanino mapupunta” bilang natural na pagpapahayag ng magiging pag-aari.
