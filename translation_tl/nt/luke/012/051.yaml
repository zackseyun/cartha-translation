  source_fidelity: Tumpak ang salin sa SBLGNT. Ang retorikal na tanong (δοκεῖτε), layunin ng pagparito (παρεγενόμην ... δοῦναι), mariing pagtanggi (οὐχί, λέγω ὑμῖν), at matalas na pagsalungat tungo sa διαμερισμόν ay lahat naipahayag nang walang pagpapalambot o dagdag na pagpapakahulugan.
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “Inaakala ba ninyong naparito ako” ay angkop sa tuwiran ngunit mataas na rehistro ng pananalita ni Jesus. Ang “kundi sa halip ay pagkakahati-hati” ay nauunawaan at sapat na natural bilang pagpapatuloy ng pinutol na paghahambing sa orihinal.
  terminology: Ang “kapayapaan” para sa εἰρήνην at “pagkakahati-hati” para sa διαμερισμόν ay angkop, malawak, at tapat sa konteksto ng kasunod na pagkakabaha-bahagi ng mga sambahayan. Hindi nito ipinapataw ang anumang doktrinal na pagpapaliwanag.
