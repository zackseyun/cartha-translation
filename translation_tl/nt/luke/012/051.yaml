id: LUK.12.51
reference: Luke 12:51
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: δοκεῖτε ὅτι εἰρήνην παρεγενόμην δοῦναι ἐν τῇ γῇ; οὐχί, λέγω ὑμῖν, ἀλλ’ ἢ διαμερισμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/051.yaml
  text: Do you think that I came to give peace on the earth? No[a], I tell you[b], but rather division.
translation:
  language: tl
  text: Inaakala ba ninyong naparito ako upang magbigay[a] ng kapayapaan sa lupa[b]? Hindi, sinasabi ko sa inyo, kundi sa halip ay pagkakahati-hati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “maghatid.” Literal na “magbigay” ang pandiwang Griyego.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “sa lupain,” yamang ang salitang Griyego ay maaaring tumukoy sa lupa o sa isang partikular na lupain; mas malamang dito ang mas malawak na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖτε
  choice: Inaakala ba ninyo
  rationale: Likas na modernong Tagalog para sa retorikal na tanong na tuwirang humahamon sa palagay ng mga nakikinig.
- source_word: εἰρήνην
  choice: kapayapaan
  rationale: Karaniwang katumbas na nagpapanatili ng malawak na diwa, kabilang ang kapayapaan at pagkakasundo sa lipunan.
- source_word: παρεγενόμην
  choice: naparito ako
  rationale: Ipinahahayag ang pagdating ni Jesus na may layunin at mas natural sa kontekstong ito kaysa sa simpleng “dumating ako.”
- source_word: δοῦναι
  choice: upang magbigay
  rationale: Pinananatili ang literal na diwa ng pandiwa at malinaw na ipinakikita ang layunin ng pagparito.
- source_word: ἐν τῇ γῇ
  choice: sa lupa
  rationale: Pinananatili ang malawak at sadyang hindi ganap na tinutukoy na saklaw ng γῆ, na maaaring tumukoy sa lupa o sa isang lupain.
- source_word: οὐχί
  choice: Hindi
  rationale: Maikli at mariing sagot sa retorikal na tanong.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Tuwirang katumbas na natural at marangal sa modernong Tagalog.
- source_word: ἀλλ’ ἢ
  choice: kundi sa halip ay
  rationale: Malinaw na pinatitindi ang salungatan sa pagitan ng kapayapaan at pagkakahati-hati.
- source_word: διαμερισμόν
  choice: pagkakahati-hati
  rationale: Tuwirang ipinahahayag ang pagkabaha-bahagi ng mga tao, lalo na sa mga ugnayang pampamilya sa kasunod na konteksto.
theological_decisions:
- issue: Kung palalambutin ang mariing pagsalungat sa pagitan ng kapayapaan at pagkakahati-hati
  choice: Pinanatili ang tahasang pahayag na hindi kapayapaan kundi pagkakahati-hati ang tinutukoy na bunga ng pagparito ni Jesus sa kontekstong ito.
  alternative: Isalin nang mas interpretatibo bilang “hindi kapayapaan kundi alitan,” o ipahiwatig na di-sinasadyang bunga lamang ito.
  rationale: Matalim ang pagsalungat sa Griyego. Hindi ito dapat pakinisin upang alisin ang tensiyon sa ibang mga tekstong nagsasalita tungkol sa kapayapaan; nililinaw ng kasunod na konteksto ang pagkakahating nagaganap sa mga sambahayan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang retorikal na tanong at ang matalim na salungatan ng orihinal nang hindi nilulutas ang teolohikal na tensiyon.
