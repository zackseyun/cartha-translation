id: LUK.12.36
reference: Luke 12:36
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς ὅμοιοι ἀνθρώποις προσδεχομένοις τὸν κύριον ἑαυτῶν πότε ἀναλύσῃ ἐκ τῶν γάμων, ἵνα ἐλθόντος καὶ κρούσαντος εὐθέως ἀνοίξωσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/036.yaml
  text: And you, be like men waiting for their lord when he returns from the wedding feast, so that when he comes and knocks, they may open to him at once.
translation:
  language: tl
  text: At kayo ay maging tulad ng mga taong naghihintay sa pagbabalik ng kanilang panginoon mula sa handaan ng kasal, upang kapag dumating siya at kumatok, agad nila siyang pagbuksan ng pinto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅμοιοι ἀνθρώποις
  choice: maging tulad kayo ng mga tao
  rationale: Likas at malinaw na Tagalog para sa paghahambing; ang ἄνθρωποι ay pangkalahatang “mga tao,” hindi kailangang tukuying mga lalaki.
- source_word: προσδεχομένοις
  choice: naghihintay
  rationale: Ipinahahayag ang patuloy at sabik na paghihintay na hinihingi ng konteksto nang hindi nagdaragdag ng saloobing hindi tahasang nasa pandiwa.
- source_word: τὸν κύριον ἑαυτῶν
  choice: kanilang panginoon
  rationale: Pinananatili ang κύριος bilang “panginoon,” ayon sa ugnayan ng mga lingkod at ng may kapangyarihan sa kanila, at kaayon ng ibinigay na konsultasyong Ingles.
- source_word: πότε ἀναλύσῃ ἐκ τῶν γάμων
  choice: sa pagbabalik ... mula sa handaan ng kasal
  rationale: Sa kontekstong ito, ang ἀναλύω ay pag-alis mula sa isang lugar upang bumalik; ang πληθυντικός γάμοι ay idiomatikong tumutukoy sa pagdiriwang o handaan ng kasal.
- source_word: εὐθέως ἀνοίξωσιν αὐτῷ
  choice: agad nila siyang mapagbuksan
  rationale: Natural na Tagalog na nagpapanatili sa agarang pagbubukas ng pinto para sa panginoon.
theological_decisions:
- issue: Paglalarawan sa κύριος sa talinghaga
  choice: panginoon
  alternative: amo
  rationale: Ang “panginoon” ay tuwirang katumbas na nagpapanatili sa lawak ng κύριος at sa posibleng teolohikal na alingawngaw, nang hindi tahasang ipinapaliwanag kung sino ang kinakatawan niya.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “handaan ng kasal” sa halip na literal na maramihang “mga kasal,” at pinanatiling isang tuloy-tuloy, likas na pangungusap ang talata.
