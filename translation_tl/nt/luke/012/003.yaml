  text: ἀνθ’ ὧν ὅσα ἐν τῇ σκοτίᾳ εἴπατε ἐν τῷ φωτὶ ἀκουσθήσεται, καὶ ὃ πρὸς τὸ οὖς ἐλαλήσατε ἐν τοῖς ταμείοις κηρυχθήσεται ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/003.yaml
  text: Therefore[a], whatever you said in the darkness will be heard in the light, and what you spoke into the ear in the inner rooms will be proclaimed on the housetops.
translation:
  language: tl
  text: Kaya, anumang sinabi ninyo sa dilim ay maririnig sa liwanag, at ang ibinulong ninyo sa tainga sa loob ng mga silid ay ipahahayag mula sa mga bubungan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa ibabaw ng mga bubungan.” Maraming bahay noon ay may patag na bubong na maaaring gamiting lugar para sa hayagang pagpapahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: Kaya
  rationale: Ginagamit ang idyoma bilang hinuha mula sa naunang pahayag tungkol sa paglalantad ng mga bagay na nakatago. Natural at malinaw sa modernong Filipino ang “Kaya.”
- source_word: ὅσα
  choice: anumang
  rationale: 'Pinananatili nito ang malawak at di-tiyak na saklaw ng panghalip: lahat ng anumang sinabi nang lihim.'
- source_word: ἐν τῇ σκοτίᾳ … ἐν τῷ φωτί
  choice: sa dilim … sa liwanag
  rationale: Pinananatili ang matinding paghahambing at ang sabay na literal at matalinghagang larawan ng paglilihim at paglalantad.
- source_word: ἀκουσθήσεται
  choice: ay maririnig
  rationale: Tuwirang ipinapahayag ang future passive at hindi tinutukoy kung sino o ano ang maglalantad.
- source_word: πρὸς τὸ οὖς ἐλαλήσατε
  choice: ibinulong ninyo sa tainga ng iba
  rationale: Ipinahihiwatig ng pagsasalita patungo sa tainga ang pribado at mahinang pagsasalita. Ginagawang natural ng “ibinulong” ang idyoma habang pinananatili ang malinaw na larawan ng tainga.
- source_word: ἐν τοῖς ταμείοις
  choice: sa loob ng mga silid
  rationale: Ang ταμεῖον ay maaaring tumukoy sa panloob, pribado, o imbakan na silid. Sa kontekstong ito, ang “sa loob ng mga silid” ay naghahatid ng ideya ng sarado at pribadong lugar nang hindi nililimitahan ito sa bodega.
- source_word: κηρυχθήσεται
  choice: ay ipahahayag
  rationale: Ipinakikita nito ang hayagan at pampublikong pagpapatalastas nang hindi ipinapasok ang mas makitid na relihiyosong diwa ng “ipangangaral.”
- source_word: ἐπὶ τῶν δωμάτων
  choice: mula sa mga bubungan
  rationale: Bagaman maaaring literal na “sa ibabaw ng mga bubungan,” mas natural sa Filipino ang “mula sa mga bubungan” para sa larawang ang pahayag ay ipinagsisigawan nang hayagan mula sa patag na bubong.
theological_decisions:
- issue: Saklaw at panahon ng paglalantad sa mga bagay na lihim
  choice: Panatilihing pangkalahatan ang babala na ang lihim na sinabi ay magiging hayag.
  alternative: Tukuyin itong eksklusibo bilang paglalantad sa huling paghuhukom o bilang paglalantad sa kasalukuyang kasaysayan.
  rationale: May kaugnayan ang konteksto sa pagbubunyag ng pagkukunwari, ngunit hindi espesipikong sinasabi ng talata kung kailan o sa anong paraan magaganap ang paglalantad. Hindi ito dapat tahimik na lutasin ng salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ibinulong” upang natural na maipahayag ang idyomang pagsasalita sa tainga, habang pinanatili ang magkapares na larawan ng dilim/liwanag at pribadong silid/bubungan.
