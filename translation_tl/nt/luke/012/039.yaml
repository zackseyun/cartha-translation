  source_fidelity: 'Kailangang malinaw na maipahayag ang kontrapaktuwal na resulta ng οὐκ ἂν ἀφῆκεν: hindi lamang “hindi niya hahayaang,” kundi “hindi niya sana hinayaang.” Ang διορυχθῆναι ay iisang pandiwang pasibo na literal na tumutukoy sa paghuhukay/pagbubutas nang lagusan, hindi dalawang magkahiwalay na kilos na “hukayin at pasukin.”'
  naturalness: Natural at malinaw sa modernong Tagalog ang “hindi niya sana hinayaang pasukin nang sapilitan ang kaniyang bahay.” Iniiwasan nito ang medyo di-natural at kalabisan na “hukayin at pasukin,” habang ang literal na larawan ay inilalagay sa talababa.
  terminology: Ang “panginoon ng sambahayan” ay katanggap-tanggap para sa οἰκοδεσπότης at pinananatili ang papel niya bilang ulo ng sambahayan. Ang “bahay” ay wastong katumbas ng οἶκος sa kontekstong ito.
  issues:
