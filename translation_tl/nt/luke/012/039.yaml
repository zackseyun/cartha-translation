base_translation:
  language: en
  yaml_path: translation/nt/luke/012/039.yaml
  text: 'But know this: if the master of the house had known at what hour the thief was coming[a], he would not have allowed his house to be broken into.'
translation:
  language: tl
  text: 'Ngunit unawain ninyo ito: kung nalaman ng panginoon ng sambahayan kung anong oras darating ang magnanakaw, hindi niya sana hinayaang pasukin nang sapilitan ang kaniyang bahay[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hukayin nang lagusan,” na tumutukoy sa pagbubutas sa dingding ng bahay upang makapasok.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δὲ γινώσκετε
  choice: Ngunit unawain ninyo ito
  rationale: Ang γινώσκετε ay pangkasalukuyang pautos na maramihan at nananawagan ng malinaw na pagkilala o pagkaunawa. Likas sa modernong Tagalog ang “unawain ninyo ito,” habang ipinahihiwatig ng “Ngunit” ang paglipat o pagtutunggali ng δέ.
- source_word: ὅτι
  choice: ': kung'
  rationale: Ipinakikilala ng ὅτι ang nilalaman ng dapat unawain; natural sa Tagalog na katawanin ito ng tutuldok bago ang kondisyong “kung.”
- source_word: οἰκοδεσπότης
  choice: panginoon ng sambahayan
  rationale: Tumutukoy ito sa pinuno o may kapangyarihan sa bahay at sambahayan. Pinananatili ng “panginoon ng sambahayan” ang panlipunang diwa, hindi lamang ang pagmamay-ari ng gusali.
- source_word: ποίᾳ ὥρᾳ
  choice: kung anong oras
  rationale: Tuwirang pinananatili ang pagtukoy sa oras at likas itong pakinggan sa kasalukuyang Tagalog.
- source_word: ὁ κλέπτης ἔρχεται
  choice: darating ang magnanakaw
  rationale: Bagaman pangkasalukuyan ang ἔρχεται sa Griyego, tumutukoy ito sa inaasahang pagdating sa loob ng kondisyong salungat sa nangyari. Ang “darating” ang natural na pananaw sa Tagalog.
- source_word: οὐκ ἂν ἀφῆκεν
  choice: hindi niya hahayaang
  rationale: Ipinahahayag ng οὐκ ἂν ἀφῆκεν ang kinalabasang hindi sana naganap. Sa Tagalog, malinaw at natural na naipahihiwatig ng “hindi niya hahayaang” ang kontrapaktuwal na diwa sa kontekstong nagsisimula sa “kung nalaman.”
- source_word: διορυχθῆναι
  choice: hukayin at pasukin
  rationale: Literal na tumutukoy ang pandiwa sa paghuhukay o pagbutas upang makapasok, gaya ng pagdaan sa dingding ng bahay. Pinananatili ng saling ito ang kongkretong larawan at nililinaw ang layuning pagpasok.
- source_word: τὸν οἶκον αὐτοῦ
  choice: ang kaniyang bahay
  rationale: Tuwirang katumbas ng οἶκος ang “bahay” at angkop ito sa pisikal na larawang pagbutas at pagpasok.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “panginoon ng sambahayan” upang mapanatili ang papel ng οἰκοδεσπότης, at pinanatili sa teksto ang kongkretong larawan ng διορύσσω sa halip na gawing pangkalahatang “looban.”
