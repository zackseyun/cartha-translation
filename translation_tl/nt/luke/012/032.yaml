  text: Μὴ φοβοῦ, τὸ μικρὸν ποίμνιον, ὅτι εὐδόκησεν ὁ πατὴρ ὑμῶν δοῦναι ὑμῖν τὴν βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/032.yaml
  text: Do not fear[a], little flock[c][b], because your Father was pleased to give you the kingdom.
translation:
  language: tl
  text: Huwag kayong matakot[a], munting kawan[b], sapagkat ikinalugod ng inyong Ama na ibigay sa inyo ang kaharian[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Huwag kayong mangamba.”
    reason: lexical_alternative
  - marker: b
    text: O “maliit na kawan.”
    reason: lexical_alternative
  - marker: c
    text: Ang “kaharian” ay maaari ring unawain bilang “paghahari,” na nagbibigay-diin sa maharlikang pamamahala ng Diyos, gayundin sa kahariang ibinibigay sa kanyang bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Huwag kang matakot
  rationale: Ang pang-isahang pautos ay tuwirang nakatuon sa ‘kawan’ bilang isang kabuuan. Likas at malinaw sa makabagong Tagalog ang ‘Huwag kang matakot.’
- source_word: τὸ μικρὸν ποίμνιον
  choice: munting kawan
  rationale: Pinananatili ng ‘kawan’ ang larawang pastoral, habang ipinahihiwatig ng ‘munting’ ang kaliitan at magiliw na tono ng μικρόν.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikita nito na ang kasunod na pahayag ang dahilan kung bakit hindi sila dapat matakot.
- source_word: εὐδόκησεν
  choice: ikinalugod
  rationale: Ipinahahayag nito ang mabuting kalooban at kasiyahan ng Ama nang hindi dinaragdagan ang teksto ng mas teknikal na ideya tungkol sa pasiya o pagtatalaga.
- source_word: ὁ πατὴρ ὑμῶν
  choice: inyong Ama
  rationale: Pinananatili ang maramihang ‘inyong’ at hindi idinaragdag ang ‘makalangit,’ na wala sa Griyego.
- source_word: δοῦναι ὑμῖν
  choice: na ibigay sa inyo
  rationale: Tuwiran at natural na katumbas ng infinitibo at datibong panghalip.
- source_word: τὴν βασιλείαν
  choice: ang kaharian
  rationale: Pamilyar na katawagang biblikal ito na maaaring sumaklaw kapwa sa maharlikang pamamahala ng Diyos at sa kahariang ipinagkakaloob sa kanyang bayan.
theological_decisions:
- issue: Saklaw ng βασιλεία
  choice: ang kaharian
  alternative: ang paghahari
  rationale: Maaaring tumukoy ang salita sa sakop ng kaharian o sa aktuwal na paghahari. Pinananatili ng ‘kaharian’ ang malawak at pamilyar na kahulugan, samantalang nililinaw sa talababa ang lehitimong alternatibo.
- issue: Diwa ng εὐδόκησεν kaugnay ng kalooban ng Diyos
  choice: ikinalugod
  alternative: minabuti
  rationale: Itinatampok nito ang mabuting kasiyahan at pagkukusa ng Ama nang hindi ginagawang teknikal na pahayag tungkol sa banal na pasiya.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang pang-isahang ‘kang’ dahil ang kinakausap ay ang ‘kawan’ bilang isang kabuuan, ngunit pinanatili ang maramihang ‘inyong’ at ‘sa inyo’ para sa mga taong bumubuo rito.
