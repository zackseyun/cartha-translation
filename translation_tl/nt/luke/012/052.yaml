id: LUK.12.52
reference: Luke 12:52
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔσονται γὰρ ἀπὸ τοῦ νῦν πέντε ἐν ⸂ἑνὶ οἴκῳ⸃ διαμεμερισμένοι, τρεῖς ἐπὶ δυσὶν καὶ δύο ἐπὶ τρισίν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/052.yaml
  text: For from now on there will be five in one house divided[a], three against two and two against three,
translation:
  language: tl
  text: Sapagkat mula ngayon, magkakahati-hati ang limang tao sa iisang bahay[a]—tatlo laban sa dalawa at dalawa laban sa tatlo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sambahayan.” Ang salitang Griyego ay maaaring tumukoy sa mismong bahay o sa pamilya at iba pang kabilang sa tahanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: ang limang tao ... magkakahati-hati
  rationale: Isinasama ang panghinaharap na diwa sa pandiwang “magkakahati-hati”; idinagdag ang “tao” upang maging likas at malinaw sa Tagalog na ang bilang na lima ay tumutukoy sa mga miyembro ng tahanan.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan nito sa naunang pahayag tungkol sa pagkakabaha-bahagi.
- source_word: ἀπὸ τοῦ νῦν
  choice: mula ngayon
  rationale: Likas at tuwirang katumbas ng pananalitang tumutukoy sa panahong magsisimula ngayon at magpapatuloy.
- source_word: πέντε
  choice: limang tao
  rationale: Ang “lima” ay tumutukoy sa mga tao sa loob ng bahay; ginagawang tahasan ito para sa natural na Tagalog nang hindi binabago ang kahulugan.
- source_word: ἐν ἑνὶ οἴκῳ
  choice: sa iisang bahay
  rationale: Pinananatili ang konkretong salitang οἶκος at ang diin ng ἑνί sa isang bahay, habang inilalagay sa talababa ang posibleng diwang sambahayan.
- source_word: διαμεμερισμένοι
  choice: magkakahati-hati
  rationale: Ipinahahayag ang kalagayan ng isang pangkat na nahati at nagkakasalungatan; natural ito sa modernong Tagalog.
- source_word: τρεῖς ἐπὶ δυσὶν
  choice: tatlo laban sa dalawa
  rationale: Malinaw na inilalarawan ng “laban sa” ang pagsasalungatan at pinananatili ang bilang at ayos ng Griyego.
- source_word: καὶ δύο ἐπὶ τρισίν
  choice: at dalawa laban sa tatlo
  rationale: Pinananatili ang paralelismo at simetriya ng pangwakas na parirala.
theological_decisions:
- issue: Kung ang οἶκος ay isasaling konkretong “bahay” o panlipunang “sambahayan”
  choice: bahay
  alternative: sambahayan
  rationale: Ang “bahay” ang mas malapit sa anyo ng Griyego at maaari pa ring tumukoy sa mga taong naninirahan doon. Dahil tahasang binabanggit sa kasunod na talata ang mga ugnayang pampamilya, ang “sambahayan” ay tunay na posibleng diwa at kaya inilagay sa talababa sa halip na sapilitang pagpasyahan sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Sapagkat” para sa paliwanag na ugnayan, at ang gitling na em dash upang malinaw na ipakilala ang pagkakahating tatlo laban sa dalawa.
