revisions:
- from: Ngunit kung gayon din damitan ng Diyos ang damo sa parang[a], na naririto ngayon at bukas ay itinatapon sa pugon[b], gaano pa kaya kayo, kayong kakaunti ang pananampalataya!
  to: Ngunit kung ganito damitan ng Diyos ang damo sa parang[a], na naririto ngayon at bukas ay itinatapon sa pugon[b], gaano pa kaya niya damitan kayo, kayong mahina ang pananampalataya!
  rationale: Inayos ang idyoma para sa οὕτως, tahasang ibinalik ang pandiwang «damitan» sa ikalawang bahagi ng paghahambing, at ginawang mas natural ang tuwirang pagtawag sa mga may mahinang pananampalataya. Hindi binago ang saklaw ng metapora, ang temporal na kaibhan ng ngayon at bukas, o ang tono ng pagsaway.
