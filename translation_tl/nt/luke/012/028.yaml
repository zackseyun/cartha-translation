review_pass:
  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing diwa ng salin: ang damo sa parang ay pansamantala, inaalagaan o dinaramtan ng Diyos, at ang mga alagad ay higit na aasikasuhin. Gayunman, ang «gayon din» ay hindi ang pinakanatural na katumbas ng οὕτως sa ganitong pangungusap, at ang di-nakasaad na pandiwang kaugnay ng «kayo» ay mas mabuting ilahad upang malinaw na mapanatili ang paghahambing ng Griyego.'
  naturalness: May bahagyang kabigatan sa «kung gayon din damitan ng Diyos» at «kayong kakaunti ang pananampalataya.» Ang «Kung ganito damitan ng Diyos» at «kayong mahina ang pananampalataya» ay mas likas sa modernong Filipino habang nananatiling tuwiran ang banayad na pagsaway.
  terminology: Ang «damo,» «parang,» at «pugon» ay angkop. Pinanatili ang «damitan» para sa metapora ng ἀμφιέζει. Inayos ang talababa sa «damo» upang hindi magmungkahi ng «pananim,» na mas madaling magpahiwatig ng sinasadyang itinanim na pananim kaysa sa pangkalahatang χόρτος sa talinghagang ito.
  issues:
  - severity: medium
    issue: Hindi gaanong natural ang «kung gayon din damitan ng Diyos ang damo.»
    rationale: Ang οὕτως ay tumutukoy sa paraang inilarawan sa naunang konteksto; mas idiomatiko rito ang «kung ganito damitan ng Diyos.»
  - severity: medium
    issue: Hindi malinaw na naipahahayag ang pandiwang inilalapat sa «kayo» sa «gaano pa kaya kayo.»
    rationale: Bagaman maaaring ipahiwatig sa Tagalog, ang «gaano pa kaya niya damitan kayo» ay malinaw na pinananatili ang sentral na paghahambing ng ἀμφιέζει at ὑμᾶς.
  - severity: low
    issue: Medyo hindi likas ang «kayong kakaunti ang pananampalataya.»
    rationale: Maaaring magtunog bilang dami ng pananampalataya o bilang bilang ng mga taong may pananampalataya. Ang «kayong mahina ang pananampalataya» ay natural na katumbas ng vocative na ὀλιγόπιστοι nang hindi ito pinatitindi.
  revised_text: Ngunit kung ganito damitan ng Diyos ang damo sa parang[a], na naririto ngayon at bukas ay itinatapon sa pugon[b], gaano pa kaya niya damitan kayo, kayong mahina ang pananampalataya!
