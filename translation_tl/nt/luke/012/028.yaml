base_translation:
  language: en
  yaml_path: translation/nt/luke/012/028.yaml
  text: But if God so clothes the grass in the field[a], which is here today and tomorrow is thrown into an oven, how much more will he clothe you[b], you of little faith!
translation:
  language: tl
  text: Ngunit kung ganito damitan ng Diyos ang damo sa parang[a], na naririto ngayon at bukas ay itinatapon sa pugon[b], gaano pa kaya niya damitan kayo, kayong mahina ang pananampalataya!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga halaman” o “halamang-damo” para sa “damo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “pugon” ay isang hurnong ginagamit sa pagluluto; maaaring gamiting panggatong ang tuyong damo mula sa parang.
    reason: cultural_note
lexical_decisions:
- source_word: χόρτον
  choice: damo
  rationale: Karaniwang tumutukoy ang χόρτος sa damo o iba pang mababang halamang tumutubo sa parang. Likas at malinaw ang “damo” sa modernong Tagalog, habang pinananatili ng talababa ang mas malawak na posibilidad.
- source_word: ἐν ἀγρῷ
  choice: sa parang
  rationale: Ipinahihiwatig ng parirala ang halamang tumutubo sa bukas na lupain. Mas natural sa kontekstong ito ang “sa parang” kaysa sa maaaring magpahiwatig ng sinasakang bukid.
- source_word: ὄντα σήμερον καὶ αὔριον ... βαλλόμενον
  choice: na naririto ngayon at bukas ay itinatapon
  rationale: Pinalalawak nang bahagya ang siksik na mga participle ng Griyego upang maging malinaw at natural sa Tagalog, habang pinananatili ang matinding paghahambing ng ngayon at bukas at ang panandaliang buhay ng damo.
- source_word: κλίβανον
  choice: pugon
  rationale: Ang κλίβανος ay pugon na ginagamit sa pagluluto, hindi isang makabagong industriyal na hurno. Ang “pugon” ay maikli, dignified, at angkop sa sinaunang konteksto.
- source_word: ἀμφιέζει
  choice: damitan
  rationale: Ang pandiwa ay nangangahulugang bihisan o damitan. Ang “damitan” ay malinaw na nagpapanatili sa larawan ng Diyos na nagkakaloob ng kasuutan at umaayon sa paghahambing sa pananamit ng mga tao.
- source_word: πόσῳ μᾶλλον
  choice: gaano pa kaya
  rationale: Likas na idyomang Tagalog ito para sa pangangatwirang mula sa mas maliit tungo sa mas dakila. Hindi nito kailangang ulitin ang pandiwang “damitan,” na malinaw na ipinahihiwatig ng pangungusap.
- source_word: ὀλιγόπιστοι
  choice: kayong kakaunti ang pananampalataya
  rationale: Pinananatili nito ang tuwirang pagtawag at banayad na pagsaway ng vocative, nang hindi ito ginagawang teknikal na pahayag tungkol sa kaligtasan o ganap na kawalan ng pananampalataya.
- source_word: εἰ δὲ
  choice: Ngunit kung
  rationale: Ipinahahayag ng “Ngunit” ang bahagyang pagsalungat o pagliko sa pangangatwiran, at ng “kung” ang kondisyonal na anyo ng Griyego.
- source_word: ὁ θεὸς
  choice: Diyos
  rationale: Tuwirang katumbas ito ng hayag na simuno sa Griyego at hindi nangangailangan ng pagpapalawak.
- source_word: οὕτως
  choice: gayon din
  rationale: Ipinahihiwatig nito ang paraan ng pagdadamit ng Diyos sa damo at likas na nag-uugnay sa naunang paglalarawan ng mga halaman sa konteksto.
theological_decisions:
- issue: Lakas at tono ng ὀλιγόπιστοι sa pagtawag ni Jesus
  choice: 'Tuwiran ngunit banayad na pagsaway: “kayong kakaunti ang pananampalataya”'
  alternative: “kayong kulang sa pananampalataya” o mas matinding pagsaway na nagpapahiwatig ng kawalan ng tunay na pananampalataya
  rationale: Pinupuna ng salita ang mahinang pagtitiwala sa Diyos ngunit hindi nito nilulutas kung ano ang implikasyon nito sa kaligtasan o pagtalikod. Pinananatili ng salin ang pastoral na tensiyon at tuwirang tono ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “parang” upang ilarawan ang bukas na lupaing tinutubuan ng damo, at pinanatili ang retorikal na diin ng pangangatwirang mula sa damo tungo sa mga alagad.
