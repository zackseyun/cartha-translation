  terminology: Ang “apoy” ay wastong pinananatiling matalinghaga at hindi binibigyan ng isang doktrinal na pakahulugan. Ang “daigdig” ay mas angkop kaysa “sa ibabaw ng lupa” para sa malawak na saklaw ng γῆ sa talatang ito. Napananatili ang talababa upang ipakita ang mahirap at mas literal na anyo ng huling sugnay.
