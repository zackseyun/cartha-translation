  text: I came to cast fire on the earth[a], and how I wish it were already kindled!
translation:
  language: tl
  text: “Naparito ako upang maghagis ng apoy sa daigdig, at lubos kong ninanais na napasiklab na sana ito![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O mas literal: “At ano ang nais ko kung napasiklab na ito?” Mahirap unawain ang sugnay sa Griyego; ipinahahayag ng pangunahing teksto ang malamang na idyomatikong diwa ng matinding pagnanais.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πῦρ
  choice: apoy
  rationale: Pinananatili ang matalinghagang larawan nang hindi ito tahasang ipinapakahulugan bilang paghatol, paglilinis, Espiritu, o pagkakahati.
- source_word: ἦλθον
  choice: Naparito ako
  rationale: Natural at marangal na pahayag sa Filipino tungkol sa layunin ng pagparito ni Jesus.
- source_word: βαλεῖν
  choice: upang maghagis
  rationale: Pinananatili ang masigla at kongkretong diwa ng βάλλω na ‘maghagis,’ sa halip na pahinain bilang ‘magdala.’
- source_word: ἐπὶ τὴν γῆν
  choice: sa ibabaw ng lupa
  rationale: Ang γῆ ay maaaring lupa o daigdig; ang pariralang ito ay malapit sa anyo ng Griyego at hindi nililimitahan sa isang partikular na lupain.
- source_word: καὶ τί θέλω εἰ ἤδη ἀνήφθη;
  choice: at gustong-gusto kong nagningas na sana ito!
  rationale: Ipinahahayag ang malamang na idyomatikong puwersa bilang matinding pagnanais, habang inilalagay sa talababa ang mas literal ngunit mahirap na pagbasa.
- source_word: ἤδη
  choice: na sana
  rationale: Sa natural na Filipino, ang ideya ng ‘already’ sa isang di-pa-natutupad na hangarin ay naipahahayag ng ‘na sana.’
- source_word: ἀνήφθη
  choice: nagningas
  rationale: Ang pandiwa ay pasibong ‘napasiklab/nagningas’; natural na inilalarawan ng ‘nagningas’ ang apoy na sinindihan at patuloy na nagliliyab.
theological_decisions:
- issue: Kahulugan ng ‘apoy’ sa sinabi ni Jesus
  choice: Panatilihin ang talinghagang ‘apoy’ nang hindi tinutukoy ang iisang kahulugan.
  alternative: Tahasang isalin bilang paghatol, paglilinis, Espiritu Santo, o krisis at pagkakahating dulot ng misyon ni Jesus.
  rationale: Hindi ipinaliliwanag ng mismong talata ang talinghaga; pinananatili nito ang tunay na teolohikal na tensiyon at mga posibleng alingawngaw sa konteksto.
- issue: Puwersa ng τί θέλω εἰ ἤδη ἀνήφθη
  choice: Isalin bilang bulalas ng matinding pagnanais.
  alternative: 'Isalin bilang literal na tanong: ‘At ano ang gusto ko kung nagningas na ito?’'
  rationale: Mahirap at maaaring higit sa isa ang pagkaunawa sa Griyegong sugnay. Ang bulalas ng pagnanais ang malamang na idyomatikong diwa at natural sa Filipino, ngunit pinananatili sa talababa ang literal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Naparito ako’ para sa solemneng pahayag ng misyon at ‘maghagis ng apoy’ upang mapanatili ang matingkad na larawan ng orihinal. Ang panandang talababa [a] ay nasa pangunahing teksto.
