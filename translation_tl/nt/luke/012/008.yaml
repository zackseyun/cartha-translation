  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν, πᾶς ὃς ἂν ⸀ὁμολογήσῃ ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ὁμολογήσει ἐν αὐτῷ ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/008.yaml
  text: And I tell you[a], everyone who confesses me before men, the Son of Man also will confess before the angels of God.
translation:
  language: tl
  text: 'Sinasabi ko naman sa inyo: Sinumang kumilala sa akin sa harap ng mga tao, kikilalanin din siya ng Anak ng Tao sa harap ng mga anghel ng Diyos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kumilala” ay maaari ring isaling “hayagang magpahayag na kinikilala.” Iisang pandiwang Griego ang ginamit sa pagkilala kay Jesus at sa pagkilala ng Anak ng Tao sa taong iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ ὑμῖν
  choice: Sinasabi ko naman sa inyo
  rationale: Pinananatili ng “sinasabi ko” ang kasalukuyang anyo at taimtim na pahayag, samantalang ang “naman” ay likas na naghahatid ng banayad na pag-uugnay ng δέ nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: πᾶς ὃς ἂν
  choice: Sinumang
  rationale: 'Likas at maikli itong pagpapahayag ng di-tiyak ngunit pangkalahatang kondisyon: saklaw nito ang bawat taong gagawa ng sinasabi.'
- source_word: ὁμολογήσῃ ... ὁμολογήσει
  choice: kumilala ... kikilalanin
  rationale: Ang ὁμολογέω rito ay tumutukoy sa hayagan at pampublikong pagkilala. Ang pag-uulit ng iisang salitang-ugat sa Filipino ay nagpapanatili sa sinadyang tumbasan ng pagkilala kay Jesus at ng pagkilala ng Anak ng Tao sa taong iyon.
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: sa akin ... siya
  rationale: Ang ἐν kasabay ng ὁμολογέω ay idyomatiko rito. Ang “kumilala sa akin” at “kikilalanin ... siya” ay natural sa Filipino at naghahatid ng personal at pampublikong pagkilala nang hindi ipinipilit ang literal ngunit malabong “sa loob ko/niya.”
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: sa harap ng mga tao
  rationale: Ang “sa harap” ay nagpapanatili sa diwa ng hayagang pagkilala sa presensiya ng iba. Ang ἀνθρώπων ay tumutukoy sa mga tao sa pangkalahatan, at likas na inklusibo ang “mga tao” sa Filipino.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang kinikilalang titulo at ang teolohikal at Danielikong bigat nito, sa halip na iparaphrase.
- source_word: ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ
  choice: sa harap ng mga anghel ng Diyos
  rationale: Tuwirang salin ito na nagpapanatili sa maringal at pampublikong tagpong makalangit.
theological_decisions:
- issue: Ang katumbasang pormula ng pagkilala na gumagamit ng ἐν at datibo
  choice: Isinalin nang idyomatiko bilang “kumilala sa akin ... kikilalanin din siya.”
  alternative: “magpahayag tungkol sa akin ... magpapahayag tungkol sa kanya” o ang literal na “kumilala sa loob ko/niya”
  rationale: Hindi natural at maaaring makalito sa Filipino ang literal na pagpapanatili ng ἐν. Ang piniling anyo ay nagpapanatili sa pampublikong pagkilala at sa katumbasan ng dalawang sugnay nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Saklaw ng ἀνθρώπων
  choice: “mga tao,” na tumutukoy sa sangkatauhan sa pangkalahatan
  alternative: “mga lalaki”
  rationale: Bagaman panlalaking pangmaramihan ang anyong Griego, ang gamit nito rito ay pangkalahatan. Ang “mga tao” ang eksaktong natural na katumbas sa Filipino at hindi nililimitahan ang tinutukoy sa mga lalaking nasa hustong gulang.
- issue: Pagkakakilanlan ng “Anak ng Tao”
  choice: 'Pinanatili bilang titulo: “Anak ng Tao.”'
  alternative: Ipaliwanag sa mismong teksto bilang tuwirang pagtukoy kay Jesus
  rationale: Ang titulo ay sariling pagtukoy ni Jesus at may natatanging biblikal na alingawngaw. Ang tahasang pagpapaliwanag nito sa teksto ay mag-aalis ng ilang tunay na pahiwatig at tensiyong taglay ng pananalita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “naman” bilang banayad na pang-ugnay, “sinumang” para sa pangkalahatang kondisyon, at magkatulad na salitang-ugat sa “kumilala/kikilalanin” upang marinig ang retorikal na katumbasan ng orihinal.
