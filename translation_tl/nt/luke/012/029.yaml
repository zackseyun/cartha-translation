id: LUK.12.29
reference: Luke 12:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μὴ ζητεῖτε τί φάγητε ⸀καὶ τί πίητε, καὶ μὴ μετεωρίζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/029.yaml
  text: And you[a], do not seek what you may eat and what you may drink, and do not be unsettled.
translation:
  language: tl
  text: At kayo naman, huwag ninyong hanapin kung ano ang kakainin ninyo at kung ano ang iinumin ninyo, at huwag kayong mabagabag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “huwag kayong mag-alala,” “huwag kayong maligalig,” o, sa mas literal na paglalarawan, “huwag kayong manatiling nakabitin sa pag-aalinlangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: kayo naman
  rationale: Tahasang binibigyang-diin ng Griyego ang panghalip. Likas na naipakikita sa Tagalog ng “kayo naman” ang pagbaling ng pansin sa mga alagad nang hindi gumagamit ng mabigat na “kayo mismo.”
- source_word: ζητεῖτε
  choice: hanapin
  rationale: Pinananatili ng “hanapin” ang payak na diwa ng ζητέω at ang utos laban sa patuloy na pagtutuon sa pagkain at inumin, nang hindi ipinahihiwatig na masama ang karaniwang paghahanda para sa mga ito.
- source_word: τί φάγητε
  choice: kung ano ang kakainin ninyo
  rationale: Natural itong Tagalog para sa bukas o mapagpasiyang diwa ng parirala at hindi nito ginagawang tiyak o predestinado ang magiging pagkain.
- source_word: τί πίητε
  choice: kung ano ang iinumin ninyo
  rationale: Kaagapay ito ng parirala tungkol sa pagkain at pinananatili ang magkatulad na kayarian ng Griyego.
- source_word: μετεωρίζεσθε
  choice: mabagabag
  rationale: Ipinahahayag ng “mabagabag” ang pagkabalisa, ligalig, o kawalang-kapanatagan na saklaw ng bihirang pandiwang ito, habang hindi ito lubusang ipinapantay sa karaniwang salita para sa pag-aalala.
- source_word: καὶ ... καὶ ... καὶ
  choice: at ... at ... at
  rationale: Pinananatili ang pinagsama-samang ritmo at koordinasyon ng mga sugnay sa Griyego; likas din sa Tagalog ang pag-uulit ng “at” dito.
theological_decisions:
- issue: Kung ang utos ay nagbabawal sa karaniwang paghahanda para sa pagkain at inumin o sa balisang paghahangad sa mga ito
  choice: Tuwirang utos laban sa paghahanap na may kasamang pagkabagabag tungkol sa pagkain at inumin
  alternative: Pagbabawal sa lahat ng karaniwang pagpaplano para sa pagkain at inumin, o panawagan na huwag pahalagahan ang mga pangangailangan ng katawan
  rationale: Sa konteksto, tinutugunan ni Jesus ang balisang pagtutuon sa mga pangangailangan, hindi ang kabutihan ng pagkain at inumin o ang makatuwirang paghahanda para sa mga ito. Hindi rin nilulutas ng salin ang tensiyon sa pamamagitan ng pagdaragdag ng paliwanag sa pangunahing teksto.
translation_notes:
  register: Makabagong, malinaw, at marangal na Tagalog. Ginamit ang “kayo naman” upang ihayag ang diin sa tahasang panghalip; pinili ang “mabagabag” upang mapanatili ang natatanging larawan ng μετεωρίζεσθε at maiwasang agad itong gawing kapareho ng karaniwang salitang “mag-alala.”
