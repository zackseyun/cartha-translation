  text: Εἶπεν δέ τις ⸂ἐκ τοῦ ὄχλου αὐτῷ⸃· Διδάσκαλε, εἰπὲ τῷ ἀδελφῷ μου μερίσασθαι μετ’ ἐμοῦ τὴν κληρονομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/013.yaml
  text: Then someone from the crowd said to him[a], “Teacher, tell my brother to divide the inheritance with me.”
translation:
  language: tl
  text: Pagkatapos, may isang tao mula sa karamihan na nagsabi sa kanya, “Guro, sabihin mo sa kapatid ko na bigyan niya ako ng bahagi sa mana.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hatiin niya ang mana kasama ko” o “ilaan niya sa akin ang bahagi ko sa mana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: Pagkatapos, ... nagsabi
  rationale: Ang δέ ay banayad na pang-ugnay sa salaysay; ipinahihiwatig ng “Pagkatapos” ang natural na pagpapatuloy nang hindi ginagawang matindi ang pagsalungat.
- source_word: τις ἐκ τοῦ ὄχλου
  choice: may isang mula sa karamihan
  rationale: Pinananatili nito ang pagiging di-tiyak ng τις at ang diwang pinagmulan o pagiging kabilang na ipinapahayag ng ἐκ τοῦ ὄχλου.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Tuwirang isinasalin ang datibong di-tuwirang layon na tumutukoy kay Jesus.
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Natural at kasalukuyang tawag sa isang tagapagturo, nang hindi nagdaragdag ng higit na diwa ng awtoridad.
- source_word: εἰπὲ τῷ ἀδελφῷ μου
  choice: sabihin mo sa kapatid ko
  rationale: Natural na Filipino para sa pautos na anyo ng λέγω na sinusundan ng datibong taong kakausapin.
- source_word: μερίσασθαι μετ’ ἐμοῦ τὴν κληρονομίαν
  choice: na hatiin niya sa akin ang mana
  rationale: Ipinahahayag ng μερίσασθαι ang paghahati o pamamahagi, habang pinananatili ng “sa akin” ang ugnayang ipinahahayag ng μετ’ ἐμοῦ nang hindi tiyakang ipinapalagay na dalawang tao lamang ang paghahatian.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mana” bilang karaniwan at malawak na katumbas ng κληρονομία, at iniwasang gawing mas teknikal ang sitwasyong legal kaysa sa sinasabi ng Griyego.
