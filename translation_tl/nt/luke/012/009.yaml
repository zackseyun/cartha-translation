id: LUK.12.9
reference: Luke 12:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἀρνησάμενός με ἐνώπιον τῶν ἀνθρώπων ἀπαρνηθήσεται ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/009.yaml
  text: But the one who denies me before men will be denied before the angels of God[a][b].
translation:
  language: tl
  text: Ngunit ang nagkakaila sa akin sa harap ng mga tao ay ikakaila sa harap ng mga anghel ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “itatatwa.” Magkaugnay ang dalawang pandiwang Griyego para sa “nagkakaila” at “ikakaila,” ngunit maaaring mas mariin ang pangalawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνησάμενός
  choice: ang nagkakaila
  rationale: Ang pandiwaring may pantukoy ay tumutukoy sa isang tao bilang pangkalahatang halimbawa. Likas sa modernong Tagalog ang kasalukuyang anyong “nagkakaila” para sa ganitong pangkalahatang simulain.
- source_word: με
  choice: sa akin
  rationale: Tahasang pinananatili ang panghalip na tumutukoy kay Jesus; hinihingi ng pandiwang “nagkakaila” ang panandang “sa” sa natural na Tagalog.
- source_word: ἐνώπιον
  choice: sa harap ng
  rationale: Natural at tuwirang katumbas na nagpapanatili sa diwa ng hayagan o pampublikong pagharap.
- source_word: τῶν ἀνθρώπων
  choice: mga tao
  rationale: Saklaw nito ang mga tao sa pangkalahatan at malinaw na naihahambing sa “mga anghel ng Diyos,” nang hindi nagpapahiwatig na lalaki lamang ang tinutukoy.
- source_word: ἀπαρνηθήσεται
  choice: ay ikakaila
  rationale: Pinananatili nito ang ugnayang pandiwa ng “nagkakaila … ikakaila” at ang balintunang pagganti sa pahayag. Ang anyong pokus-sa-layon ay hindi tahasang nagdaragdag kung sino ang gagawa ng pagkakaila.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: mga anghel ng Diyos
  rationale: Tuwirang salin ng pariralang genitibo at natural sa marangal na modernong Tagalog.
- source_word: δὲ
  choice: Ngunit
  rationale: Malinaw nitong ipinakikita ang pagsalungat sa naunang pahayag sa talata 8.
theological_decisions:
- issue: Pagkakakilanlan ng di-binanggit na gumagawa sa “ikakaila”
  choice: Panatilihin ang pahayag na walang tahasang gumagawa.
  alternative: Idagdag ang “ng Anak ng Tao” o “ng Diyos” bilang gumagawa.
  rationale: Balintiyak ang pandiwang Griyego at hindi nito pinapangalanan ang gumagawa. Bagaman maaaring magpahiwatig ang konteksto ng isang tiyak na gumagawa, hindi ito tahasang sinasabi ng talata, kaya pinananatili ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikli at mariing magkatapat na kayarian ng dalawang sugnay, gayundin ang hindi pinangalanang gumagawa sa ikalawang sugnay.
