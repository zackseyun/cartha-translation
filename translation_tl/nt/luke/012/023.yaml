  text: ἡ ⸀γὰρ ψυχὴ πλεῖόν ἐστιν τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/023.yaml
  text: For life is more than food[a], and the body more than clothing.
translation:
  language: tl
  text: Sapagkat ang buhay[a] ay higit kaysa pagkain, at ang katawan ay higit kaysa pananamit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaluluwa” o “sarili.” Ang salitang Griego na ψυχή ay maaaring mangahulugang “buhay,” “sarili,” o “kaluluwa”; sa kontekstong ito, mas angkop ang “buhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag o batayan sa naunang utos na huwag mabalisa; likas at malinaw na pang-ugnay ang “sapagkat” sa Filipino.
- source_word: ψυχή
  choice: buhay
  rationale: Sa konteksto ng pagkain, pananamit, at pag-aalala sa pangangailangan, tumutukoy ito sa buhay ng tao, hindi lamang sa di-materyal na kaluluwa.
- source_word: πλεῖόν
  choice: higit kaysa
  rationale: Pinananatili ang tuwirang paghahambing nang hindi dinaragdagan ng interpretasyong “mas mahalaga.” Inulit sa ikalawang sugnay para sa natural at malinaw na Filipino.
- source_word: τροφή
  choice: pagkain
  rationale: Karaniwan at tuwirang katumbas sa kontekstong ito.
- source_word: σῶμα
  choice: katawan
  rationale: Tuwirang tumutukoy sa pisikal na katawan na inihahambing sa pananamit.
- source_word: ἔνδυμα
  choice: pananamit
  rationale: Natural na pangkalahatang tawag sa anumang isinusuot o pantakip sa katawan.
theological_decisions:
- issue: Kahulugan ng ψυχή sa turo tungkol sa pag-aalala at pagtustos
  choice: Isinaling “buhay”
  alternative: kaluluwa; sarili
  rationale: Ang pagkakatambal ng ψυχή sa pagkain at ng katawan sa pananamit ay nagpapakitang ang tinutukoy ay buhay ng tao sa kontekstong ito. Hindi nito itinatanggi ang ibang kahulugan ng ψυχή sa ibang talata.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang simetrikong paghahambing ng buhay sa pagkain at ng katawan sa pananamit.
