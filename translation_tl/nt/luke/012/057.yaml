  yaml_path: translation/nt/luke/012/057.yaml
  text: And why do you not judge for yourselves what is right?[a]
translation:
  language: tl
  text: At bakit hindi ninyo mismo pinagpapasiyahan kung ano ang tama?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kung ano ang makatarungan” o “ang tamang gawin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ καὶ
  choice: At bakit
  rationale: Likas na panimula ito sa isang retorikal na tanong na nagpapatuloy at nagpapatingkad sa naunang pangangatwiran; pinananatili ng “At” ang ugnay nang hindi pilit na isinasalin ang bawat kataga.
- source_word: ἀφ’ ἑαυτῶν
  choice: sa ganang inyong sarili
  rationale: Ipinahihiwatig ng parirala ang paghatol batay sa sariling pagkukusa o kakayahang umunawa. Ang “sa ganang inyong sarili” ay dignificado at malinaw na tumutukoy sa sariling pagsusuri, hindi sa pansariling kapakinabangan.
- source_word: οὐ κρίνετε
  choice: hindi ninyo hatulan
  rationale: Ang κρίνω ay tumutukoy rito sa pagsusuri at pagpapasiya. Pinananatili ng “hatulan” ang pangunahing diwang evaluatibo at ang retorikal na anyo ng tanong.
- source_word: τὸ δίκαιον
  choice: kung ano ang tama
  rationale: 'Ang pang-uring nasa anyong neutral na isahan ay ginagamit bilang pangngalan: ang tama o makatarungang bagay. Natural sa modernong Filipino ang “kung ano ang tama” at pinananatili nito ang malawak na moral at praktikal na diwa.'
theological_decisions:
- issue: Saklaw ng kahulugan ng τὸ δίκαιον
  choice: kung ano ang tama
  alternative: kung ano ang makatarungan; ang tamang gawin
  rationale: Hindi dapat paliitin ang parirala tungo lamang sa teknikal o legal na katarungan. Ang “kung ano ang tama” ay nagpapanatili sa malawak na etikal at praktikal na saklaw, habang inilalahad sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang pangmaramihang “ninyo” ayon sa anyo ng Griyego. Ang “sa ganang inyong sarili” ay bahagyang pormal ngunit malinaw at angkop sa retorikal na tono.
