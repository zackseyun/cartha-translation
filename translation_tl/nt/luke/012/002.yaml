id: LUK.12.2
reference: Luke 12:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐδὲν δὲ συγκεκαλυμμένον ἐστὶν ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/002.yaml
  text: But nothing is covered up that will not be revealed[c][b][a], and hidden that will not be known.
translation:
  language: tl
  text: Ngunit walang natatakpan[a] na hindi mabubunyag[c], at walang nakatago[b] na hindi malalaman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ikinubli.” Ginagamit ng Griyego ang larawan ng isang bagay na natakpan at pagkatapos ay nabunyag.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lihim.”
    reason: lexical_alternative
  - marker: c
    text: Ang pahayag ay maaaring tumukoy sa pagbubunyag sa kalaunan, sa kasalukuyang panahon man o sa huling paghuhukom.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: walang
  rationale: Likas na katumbas sa Tagalog ng ganap na pagtangging “nothing”; pinananatili nito ang saklaw na walang anumang hindi kabilang.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang pagpapatuloy na may bahagyang pagsalungat; ang “Ngunit” ay angkop sa konteksto at malinaw sa makabagong Tagalog.
- source_word: συγκεκαλυμμένον
  choice: natatakpan
  rationale: Ang perpektong pasibong anyo ay tumutukoy sa isang bagay na nasa kalagayang natakpan. Pinananatili ng “natatakpan” ang larawan ng pagtatakip at ang kaibahan nito sa pagbubunyag.
- source_word: ἀποκαλυφθήσεται
  choice: mabubunyag
  rationale: Ang hinaharap na pasibong diwa ay likas na naihahayag sa “mabubunyag,” na nagpapanatili sa ideya ng isang bagay na ilalantad nang hindi tinutukoy kung sino ang magbubunyag.
- source_word: κρυπτὸν
  choice: nakatago
  rationale: Tumpak at karaniwang salin ito ng bagay na hindi lantad. Hindi nito nililimitahan ang kahulugan sa isang sinadyang “lihim.”
- source_word: γνωσθήσεται
  choice: malalaman
  rationale: Likas sa Tagalog ang “malalaman” para sa hinaharap na pagdating sa pagkaalam; pinananatili nito ang resultang magiging hayag sa kaalaman.
- source_word: ὃ οὐκ / ὃ οὐ
  choice: na hindi
  rationale: Ang “na hindi” ay natural na nag-uugnay sa dalawang magkatulad na sugnay at pinananatili ang negatibong kayarian ng Griyego.
theological_decisions:
- issue: Saklaw at panahon ng pagbubunyag
  choice: Isang malawak na pahayag na ang anumang natatakpan o nakatago ngayon ay mabubunyag o malalaman sa kalaunan.
  alternative: Maaaring tumukoy ito nang natatangi sa pagbubunyag sa huling paghuhukom, o sa paglalantad ng pagkukunwari sa kasalukuyang panahon.
  rationale: Ipinahihiwatig ng mga pandiwang nasa hinaharap ang darating na pagbubunyag ngunit hindi itinatakda ng Griyego ang tiyak na panahon. Kaya hindi nililimitahan ng salin ang pahayag sa kasalukuyan lamang o sa huling paghuhukom lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkatulad na ayos ng dalawang sugnay at ang larawan ng pagtatakip at pagbubunyag, habang inuulit ang “walang” sa ikalawang sugnay para sa likas at malinaw na Tagalog.
