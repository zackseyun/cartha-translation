  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂Ἡ μὲν οὖν ἐκκλησία καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας εἶχεν εἰρήνην οἰκοδομουμένη, καὶ πορευομένη τῷ φόβῳ τοῦ κυρίου καὶ τῇ παρακλήσει τοῦ ἁγίου πνεύματος ἐπληθύνετο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/031.yaml
  text: So then the church throughout all Judea and Galilee and Samaria had peace and was being built up[a]; and walking in the fear of the Lord and in the encouragement of the Holy Spirit[b], it was multiplying.
translation:
  language: tl
  text: Kaya ang iglesya sa buong Judea, Galilea, at Samaria ay namuhay nang payapa at patuloy na pinatatatag.[a] Namuhay ito nang may takot sa Panginoon at sa pagpapalakas-loob ng Banal na Espiritu,[b] at patuloy itong dumami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “ang mga iglesya” ang mababasa sa halip na “ang iglesya.”
    reason: textual_variant
  - marker: b
    text: Maaari ring isalin na “kaaliwan” o “panghihikayat” ng Banal na Espiritu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: ang iglesya
  rationale: Sinusunod ng pangunahing teksto ang isahang anyo ng SBLGNT at inilalarawan ang iglesya bilang isang kabuuan sa tatlong rehiyon.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας
  choice: sa buong Judea, Galilea, at Samaria
  rationale: Likas na ipinahahayag sa Tagalog ang panrehiyon at malawak na saklaw ng κατά at ὅλης nang hindi nagiging mabigat ang pangungusap.
- source_word: εἶχεν εἰρήνην
  choice: namuhay nang payapa
  rationale: Ipinahahayag nito ang kalagayan ng kapayapaan ng iglesya; mas natural ito sa modernong Tagalog kaysa sa literal na 'may kapayapaan.'
- source_word: οἰκοδομουμένη
  choice: patuloy na pinatatatag
  rationale: Ipinakikita ng 'patuloy' ang nagpapatuloy na kilos, samantalang malinaw na naihahatid ng 'pinatatatag' ang metaporikal na pagpapatibay sa iglesya.
- source_word: πορευομένη
  choice: namuhay
  rationale: Sa konteksto, tumutukoy ito sa paraan ng pamumuhay o pagkilos. Ang literal na 'lumalakad' ay maaaring hindi natural o madaling maunawaan sa karaniwang Tagalog.
- source_word: τῷ φόβῳ τοῦ κυρίου
  choice: nang may takot sa Panginoon
  rationale: Pinananatili nito ang mahalagang biblikal na pahayag at ang posibilidad ng mapitagang takot, sa halip na paliitin agad ang kahulugan sa paggalang lamang.
- source_word: τῇ παρακλήσει τοῦ ἁγίου πνεύματος
  choice: may pagpapalakas ng Banal na Espiritu
  rationale: Ang 'pagpapalakas' ay natural sa konteksto ng pagpapatatag at pagdami, habang ang mas malawak na saklaw na aliw o panghihikayat ay inilalagay sa talababa.
- source_word: ἐπληθύνετο
  choice: patuloy itong dumami
  rationale: Malinaw na ipinahahayag nito ang nagpapatuloy na pagdami ng kolektibong iglesya at natural itong basahin sa Tagalog.
theological_decisions:
- issue: Bilang at tinutukoy ng ἐκκλησία
  choice: 'kolektibong isahan: ''ang iglesya'''
  alternative: 'maramihang tekstuwal na variant: ''ang mga iglesya'''
  rationale: Isahan ang anyo sa ibinigay na SBLGNT, pati ang mga pandiwa at pandiwaring tumutukoy rito. Inilalagay sa talababa ang mahalagang variant na maramihan.
- issue: Kahulugan ng 'takot sa Panginoon'
  choice: panatilihin ang salitang 'takot' upang saklawin ang mapitagang pagkamangha at masunuring kabanalan
  alternative: '''paggalang sa Panginoon'' lamang'
  rationale: Ang literal at tradisyonal na pahayag ay nagpapanatili ng teolohikal na lalim at hindi tahimik na nag-aalis ng tunay na tensiyon sa salitang φόβος.
- issue: Saklaw ng παράκλησις kaugnay ng Banal na Espiritu
  choice: pagpapalakas
  alternative: kaaliwan o panghihikayat
  rationale: Ang salita ay maaaring tumukoy sa pagpapalakas, kaaliwan, o panghihikayat. Pinili ang natural na salitang angkop sa konteksto, at pinanatili sa talababa ang iba pang tunay na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang 'iglesya' bilang karaniwang terminong biblikal, 'Panginoon' para sa κύριος, at 'Banal na Espiritu' bilang pamantayang makabagong katawagan. Iniwasan ang sobrang literal na 'lumalakad' at ang di-natural na 'may kapayapaan,' ngunit pinanatili ang teolohikal na pahayag na 'takot sa Panginoon.'
