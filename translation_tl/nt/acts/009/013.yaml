id: ACT.9.13
reference: Acts 9:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ Ἁνανίας· Κύριε, ⸀ἤκουσα ἀπὸ πολλῶν περὶ τοῦ ἀνδρὸς τούτου, ὅσα κακὰ ⸂τοῖς ἁγίοις σου ἐποίησεν⸃ ἐν Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/013.yaml
  text: But Ananias answered[a], “Lord, I have heard from many about this man, how much evil he has done to your saints in Jerusalem.”
translation:
  language: tl
  text: Ngunit sumagot si Ananias, “Panginoon, marami na akong narinig mula sa maraming tao tungkol sa taong ito—kung gaano karaming masasamang bagay ang ginawa niya sa iyong mga banal sa Jerusalem.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη δὲ
  choice: Ngunit sumagot si Ananias
  rationale: Ipinahihiwatig ng δέ ang bahagyang pagsalungat o pag-aatubili sa tugon ni Ananias; natural at tapat dito ang “Ngunit,” habang tuwirang tinutumbasan ng “sumagot” ang ἀπεκρίθη.
- source_word: Κύριε
  choice: Panginoon
  rationale: Karaniwang salin ito ng κύριος at pinananatili ang paggalang at bigat ng tuwirang pakikipag-usap ni Ananias kay Jesus.
- source_word: ἤκουσα ἀπὸ πολλῶν
  choice: marami na po akong narinig
  rationale: Natural sa modernong Tagalog ang ganitong ayos para sa impormasyong nagmula sa maraming tao at mahalaga pa rin sa kasalukuyang pagtutol ni Ananias. Ang “po” ay naghahatid ng paggalang na likas sa pakikipag-usap sa Panginoon nang hindi nagdaragdag ng hiwalay na titulo.
- source_word: περὶ τοῦ ἀνδρὸς τούτου
  choice: tungkol sa taong ito
  rationale: Tuwirang pinananatili ang περί at ang demonstratibong τούτου sa natural na Tagalog.
- source_word: ὅσα κακὰ
  choice: kung gaano karaming kasamaan
  rationale: Pinananatili ang diwa ng lawak o dami sa ὅσα at ang moral na bigat ng κακά. Ang “kasamaan” ay mas dignified at natural kaysa “masasamang bagay,” bagaman maaaring tumukoy ang Griyego sa maraming masasamang gawa.
- source_word: τοῖς ἁγίοις σου
  choice: sa iyong mga banal
  rationale: Pinananatili ng “mga banal” ang terminong ἅγιοι para sa mga mananampalataya at ang panghalip na “iyong,” nang hindi ito pinapaliit sa mas pangkalahatang “mga tao.”
- source_word: ἐποίησεν
  choice: ang ginawa niya
  rationale: Ang “ginawa” ang tuwiran at malawak na katumbas ng ποιέω at hindi nagdaragdag ng tiyak na uri ng pagkakasala.
- source_word: ἐν Ἰερουσαλήμ
  choice: sa Jerusalem
  rationale: Karaniwang lokatibong salin sa Tagalog.
theological_decisions:
- issue: Ang tinutukoy at puwersa ng Κύριε sa pakikipag-usap ni Ananias
  choice: Tuwirang pagtawag kay Jesus bilang “Panginoon”
  alternative: “Ginoo” o “Amo” bilang paggalang lamang
  rationale: Sa agarang konteksto, tumutugon si Ananias sa muling nabuhay na si Jesus sa isang pangitain. Kaya ang “Panginoon” ay angkop sa salaysay at pinananatili ang teolohikal na bigat nang hindi lumalampas sa teksto.
- issue: Pagkakakilanlan ng τοῖς ἁγίοις σου
  choice: “iyong mga banal” bilang tawag sa mga mananampalatayang nauukol sa Panginoon
  alternative: “iyong mga hinirang” o “iyong bayan”
  rationale: Ang “mga banal” ang pinakamalapit na katumbas ng ἅγιοι at iniiwasang magpasok ng konseptong hindi tahasang nasa parirala.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal ngunit madaling maunawaan. Ginamit ang “po” upang maging natural ang paggalang sa tuwirang pananalita; iniwasan ang sobrang makaluma o denominasyonal na pananalita. Walang talababa dahil walang alternatibong kailangang ilahad upang mapanatili ang tunay na ambiguwidad ng talata.
