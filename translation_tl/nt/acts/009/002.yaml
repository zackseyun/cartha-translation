id: ACT.9.2
reference: Acts 9:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ᾐτήσατο παρ’ αὐτοῦ ἐπιστολὰς εἰς Δαμασκὸν πρὸς τὰς συναγωγάς, ὅπως ἐάν τινας εὕρῃ τῆς ὁδοῦ ὄντας, ἄνδρας τε καὶ γυναῖκας, δεδεμένους ἀγάγῃ εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/002.yaml
  text: and asked him for letters to the synagogues in Damascus[a], so that if he found any belonging to the Way, both men and women, he might bring them bound to Jerusalem.
translation:
  language: tl
  text: at humingi siya sa kanya ng mga liham para sa mga sinagoga sa Damasco, upang kung may matagpuan siyang sinumang kabilang sa Daan[a], lalaki man o babae, madala niya silang nakagapos sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nasa Daan” o “mga tagasunod ng Daan.” Ginagamit dito ng Griyego ang isang sinaunang katawagan sa kilusang Cristiano.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾐτήσατο παρ’ αὐτοῦ
  choice: humingi siya sa kanya
  rationale: Ipinahahayag ng αἰτέω kasama ng παρά at genitive ang paghiling sa isang tao. Likas sa modernong Tagalog ang “humingi siya sa kanya” at hindi nito dinaragdagan ang uri o bisa ng hiniling.
- source_word: ἐπιστολὰς
  choice: mga liham
  rationale: Tuwirang katumbas ito ng ἐπιστολή. Ipinahihiwatig ng konteksto na may kaugnayan ang mga liham sa pahintulot, ngunit hindi iyon tahasang idinagdag sa pangunahing teksto.
- source_word: εἰς Δαμασκὸν πρὸς τὰς συναγωγάς
  choice: para sa mga sinagoga sa Damasco
  rationale: Malinaw at natural nitong ipinakikitang ang mga liham ay nakalaan sa mga sinagogang nasa Damasco, nang hindi inuulit nang alanganin ang dalawang Griyegong pariralang pang-ukol.
- source_word: ὅπως ἐάν
  choice: upang kung
  rationale: Pinananatili ng “upang” ang layunin at ng “kung” ang kondisyong ipinahahayag ng ἐάν kasama ng subjunctive.
- source_word: τινας
  choice: sinuman
  rationale: Ang di-tiyak na panghalip sa isang kondisyong pangungusap ay likas na isinasalin bilang “sinuman.”
- source_word: τῆς ὁδοῦ ὄντας
  choice: kabilang sa Daan
  rationale: Pinananatili nito ang “Daan” bilang makasaysayang katawagan sa unang kilusang Cristiano at ipinahahayag nang natural ang ugnayang nasa genitive nang hindi ito labis na ipinapaliwanag.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: lalaki man o babae
  rationale: Tahasang pinananatili ang pagsaklaw sa kapuwa lalaki at babae. Ang anyong ito ay natural kasunod ng isahang di-tiyak na “sinuman.”
- source_word: δεδεμένους
  choice: nakagapos
  rationale: Inilalarawan ng perfect passive participle ang kalagayan ng mga dadalhin. Hindi tinutukoy ng Griyego kung lubid, tanikala, o ibang pantali ang ginamit, kaya hindi iyon dinagdagan.
- source_word: ἀγάγῃ εἰς Ἰερουσαλήμ
  choice: madala niya sila ... sa Jerusalem
  rationale: Ang subjunctive sa sugnay ng layunin ay angkop na ipinahayag sa “madala niya,” at natural sa Tagalog ang “sa Jerusalem” bilang patutunguhan.
theological_decisions:
- issue: Pagpapakahulugan sa τῆς ὁδοῦ
  choice: Daan
  alternative: kilusang tinatawag na Daan; mga tagasunod ng Daan
  rationale: Ang parirala ay nagsisilbing kinikilalang katawagan sa unang pamayanang Cristiano. Pinananatili ng “Daan” ang makasaysayang katawagan at ang bahagyang talinghaga nito sa halip na gawing tahasang paliwanag ang pangunahing teksto.
- issue: Tahasang pagbanggit sa ἄνδρας τε καὶ γυναῖκας
  choice: lalaki man o babae
  alternative: kapuwa mga lalaki at mga babae
  rationale: Hindi ginawang pangkalahatang “mga tao” ang parirala, sapagkat binibigyang-diin ng Griyego na saklaw ng balak na pagdakip ang kapuwa lalaki at babae.
translation_notes:
  register: Gumamit ng makabagong, malinaw, at marangal na Tagalog. Pinanatili ang anyong tuloy ng pangungusap sa pamamagitan ng pambungad na “at,” sapagkat karugtong ang talata ng naunang salaysay. Ginamit ang “sinagoga,” “Damasco,” at “Jerusalem” bilang mga karaniwang anyo sa Tagalog, at inilagay ang talababa sa mismong katawagang “Daan” na ipinaliliwanag nito.
