  text: εὗρεν δὲ ἐκεῖ ἄνθρωπόν τινα ⸂ὀνόματι Αἰνέαν⸃ ἐξ ἐτῶν ὀκτὼ κατακείμενον ἐπὶ ⸀κραβάττου, ὃς ἦν παραλελυμένος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/033.yaml
  text: And there he found a certain man named Aeneas[a], bedridden for eight years, who was paralyzed.
translation:
  language: tl
  text: At doon ay natagpuan niya ang isang lalaking nagngangalang Eneas, na walong taon nang nakaratay sa higaan[a] at paralisado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakahiga sa isang banig” o “nakahiga sa isang papag.”
    reason: Ipinakikita ng mga alternatibong ito ang mas literal at kongkretong larawan ng κράβαττος, na maaaring tumukoy sa isang payak na banig, papag, o higaan.
lexical_decisions:
- source_word: εὗρεν δὲ ἐκεῖ
  choice: At doon ay natagpuan niya
  rationale: Ipinahahayag ng δέ ang pagpapatuloy ng salaysay, ng ἐκεῖ ang lugar, at ng εὗρεν ang payak na kilos ng pagkakatagpo. Likas sa Filipino ang ayos na ito at hindi ito nagdaragdag ng diwa.
- source_word: ἄνθρωπόν τινα
  choice: isang lalaki
  rationale: Tinutukoy ng parirala ang isang partikular ngunit hindi pa naipakikilalang tao. Sapat nang ipinahahayag ng “isang lalaki” ang tungkuling ito sa natural na modernong Filipino; magiging matigas ang “isang tiyak na lalaki.”
- source_word: ὀνόματι Αἰνέαν
  choice: nagngangalang Eneas
  rationale: Karaniwang katumbas sa Filipino ng konstruksiyong may ὀνόματι ang “nagngangalang.” Isinalin sa anyong matagal nang ginagamit sa Filipino ang pangalang Αἰνέας bilang “Eneas.”
- source_word: ἐξ ἐτῶν ὀκτὼ
  choice: walong taon nang
  rationale: Ipinahahayag ng parirala ang tagal ng kalagayang nagpapatuloy hanggang sa sandali ng salaysay. Natural itong sinasabi sa Filipino sa pamamagitan ng “walong taon nang.”
- source_word: κατακείμενον ἐπὶ κραβάττου
  choice: nakaratay sa higaan
  rationale: Ipinahahayag ng κατακείμενον ang patuloy na pagkakahiga, samantalang ang κράβαττος ay isang payak na higaan, banig, o papag. Ang “nakaratay sa higaan” ay malinaw at natural, habang pinananatili sa talababa ang mas kongkretong mga posibleng kahulugan ng κράβαττος.
- source_word: ὃς ἦν παραλελυμένος
  choice: at paralisado
  rationale: Tumutukoy ang perfect participle sa namamalaging kalagayan ng lalaki. Direktang ipinahahayag ito ng “paralisado,” at iniuugnay ng “at” sa naunang paglalarawan nang hindi ipinapalagay na sanhi lamang ito ng pagkakaratay.
theological_decisions: []
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Filipino. Pinanatili ang iisang pangungusap at ang dalawang magkaugnay na paglalarawan—matagal na pagkakaratay at pagkaparalisado—nang hindi ginagawang tahasang sanhi ang isa sa isa.
