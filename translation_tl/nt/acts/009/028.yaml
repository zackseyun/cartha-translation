id: ACT.9.28
reference: Acts 9:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἦν μετ’ αὐτῶν εἰσπορευόμενος ⸂καὶ ἐκπορευόμενος⸃ εἰς ⸀Ἰερουσαλήμ, παρρησιαζόμενος ἐν τῷ ὀνόματι τοῦ ⸀κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/028.yaml
  text: And he was with them in Jerusalem, going in and going out, speaking boldly in the name of the Lord.
translation:
  language: tl
  text: At kasama siya ng mga apostol sa Jerusalem, pumapasok at lumalabas, at buong tapang na nagsasalita sa pangalan ng Panginoon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν μετ’ αὐτῶν
  choice: Kasama siya ng mga alagad
  rationale: Ipinapahayag ng imperfect na ἦν at ng μετά na nagpapatuloy ang pakikisama niya sa grupong binanggit sa konteksto. Ginawang tahasan ang 'mga alagad' sa halip na 'sila' upang maging malinaw at natural sa Filipino nang hindi nagdaragdag ng bagong tinutukoy.
- source_word: εἰσπορευόμενος καὶ ἐκπορευόμενος
  choice: malayang pumapasok at lumalabas
  rationale: Pinananatili ng 'pumapasok at lumalabas' ang magkapares na kilos at paulit-ulit na aspekto ng mga participle. Ang 'malayang' ay likas na naghahatid sa Filipino ng idyomatikong diwa ng malayang pakikisalamuha at pagkilos.
- source_word: εἰς Ἰερουσαλήμ
  choice: sa Jerusalem
  rationale: Bagaman karaniwang nangangahulugang 'papasok sa' ang εἰς, dito ay gumaganap itong lokatibo at tumutukoy sa Jerusalem bilang lugar ng pagkilos; kaya 'sa Jerusalem' ang malinaw na salin.
- source_word: παρρησιαζόμενος
  choice: buong tapang na nagsasalita
  rationale: Sinasaklaw nito ang hayagan, malaya, at walang-takot na pagsasalita. Natural ito sa modernong Filipino at angkop sa paulit-ulit o nagpapatuloy na kilos ng participle.
- source_word: ἐν τῷ ὀνόματι
  choice: sa pangalan ng
  rationale: Pinananatili nito ang biblikal na parirala at ang malawak na posibilidad ng kahulugan—awtoridad, pagkatawan, at pagpapahayag—nang hindi nililimitahan sa isa lamang.
- source_word: τοῦ κυρίου
  choice: ng Panginoon
  rationale: Isinasalin ang κύριος bilang titulong 'Panginoon' at hindi pinapalitan ng pangalang Jesus, kahit si Jesus ang tinutukoy sa konteksto.
theological_decisions:
- issue: Ang tinutukoy ng 'Panginoon'
  choice: Pinanatili sa pangunahing teksto ang titulong 'Panginoon.'
  alternative: Tahasang isalin bilang 'Jesus.'
  rationale: κυρίου, hindi Ἰησοῦ, ang nasa tekstong Griyego. Pinananatili ng salin ang mahalagang titulo at hindi tahasang nilulutas sa pangunahing teksto ang tinutukoy nito, bagaman malinaw sa konteksto na si Jesus iyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang 'mga alagad' bilang malinaw na kontekstuwal na reperente ng αὐτῶν. Ang 'malayang pumapasok at lumalabas' ay mas likas kaysa sa literal ngunit maaaring malabong 'pumapasok at lumalabas' lamang.
