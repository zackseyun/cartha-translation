  revision_rationale: Pinalitan ang “mga alagad” ng “mga apostol” ayon sa agarang konteksto at inalis ang interpretibong “malayang.” Pinanatili ang magkapares na “pumapasok at lumalabas,” ang patuloy na pakikisama, ang matapang na pagsasalita, at ang titulong “Panginoon.”
