  text: καὶ ἦν ἡμέρας τρεῖς μὴ βλέπων, καὶ οὐκ ἔφαγεν οὐδὲ ἔπιεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/009.yaml
  text: And for three days he was without sight[a], and he neither ate nor drank.
translation:
  language: tl
  text: Sa loob ng tatlong araw, hindi siya nakakakita[a], at hindi siya kumain ni uminom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “walang nakikita.” Ipinahihiwatig ng parirala na hindi makakita si Saulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἡμέρας τρεῖς
  choice: Sa loob ng tatlong araw
  rationale: Ang accusative na ἡμέρας τρεῖς ay nagsasaad ng haba ng panahon. Likas sa modernong Tagalog ang “sa loob ng tatlong araw,” habang ang kalagayang ipinahahayag ng ἦν ay naipapakita ng kasunod na “hindi siya nakakakita.”
- source_word: μὴ βλέπων
  choice: hindi siya nakakakita
  rationale: Tuwirang pinananatili nito ang diwa ng participial phrase na “hindi nakakakita” nang gamitin sa pangunahing teksto ang mas matinding pangngalang o pang-uring “bulag.”
- source_word: οὐκ ἔφαγεν
  choice: hindi siya kumain
  rationale: Ang aorist na ἔφαγεν ay payak na tumutukoy sa pagkain; ang “hindi siya kumain” ay natural at tapat sa anyo ng Griyego.
- source_word: οὐδὲ ἔπιεν
  choice: ni uminom
  rationale: Ang οὐδὲ ay nag-uugnay sa ikalawang negatibong pandiwa. Ang pares na “hindi… kumain ni uminom” ay maikli at natural sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang literal na diwa ng μὴ βλέπων at iniwasang gawing “bulag” sa pangunahing teksto upang hindi higitan ang tahasang sinasabi ng parirala.
