id: ACT.9.15
reference: Acts 9:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ κύριος· Πορεύου, ὅτι σκεῦος ἐκλογῆς ⸂ἐστίν μοι⸃ οὗτος τοῦ βαστάσαι τὸ ὄνομά μου ἐνώπιον ⸀ἐθνῶν ⸀τε καὶ βασιλέων υἱῶν τε Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/015.yaml
  text: But the Lord said to him[a], “Go[b], because this man is a chosen instrument of mine to carry my name before the Gentiles and kings and the sons of Israel,”
translation:
  language: tl
  text: Ngunit sinabi sa kanya ng Panginoon, “Humayo ka, sapagkat ang taong ito ay isang kasangkapang pinili para sa akin upang dalhin ang aking pangalan sa harap ng mga Hentil[a], mga hari, at mga anak na lalaki ng Israel[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bansa.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga anak na lalaki ng Israel” ay tradisyonal na biblikal na katawagan para sa bayan ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang marangal na salin ng titulong κύριος; sa salaysay na ito, tumutukoy ito sa muling nabuhay na si Jesus na nagsasalita nang may awtoridad.
- source_word: Πορεύου
  choice: Humayo ka
  rationale: Malinaw at marangal na pautos na angkop sa konteksto, nang hindi nagdaragdag ng tiyak na patutunguhan.
- source_word: σκεῦος ἐκλογῆς ἐστίν μοι
  choice: isang kasangkapang pinili ko
  rationale: Ipinapahayag ang metaporikal na diwa ng σκεῦος bilang ginagamit para sa isang layunin at ang personal na pagpili ng nagsasalita, sa natural na Filipino.
- source_word: τοῦ βαστάσαι τὸ ὄνομά μου
  choice: upang dalhin ang aking pangalan
  rationale: Pinananatili ang layunin ng pawatas at ang mahalagang biblikal na larawan ng pagdadala sa pangalan, kasama ang diwa ng pagkatawan at hayagang pagpapatotoo.
- source_word: ἐνώπιον
  choice: sa harap ng
  rationale: Tuwirang katumbas na angkop sa konteksto ng pampublikong pagpapatotoo.
- source_word: ἐθνῶν
  choice: mga Hentil
  rationale: Sa pagkakatapat nito sa Israel, pinakamalamang na tumutukoy ito sa mga taong hindi Judio; inilalagay sa talababa ang mas literal na alternatibong “mga bansa.”
- source_word: βασιλέων
  choice: mga hari
  rationale: Tuwiran, tiyak, at natural na salin ng termino.
- source_word: υἱῶν Ἰσραήλ
  choice: mga anak na lalaki ng Israel
  rationale: Pinananatili ang panlalaking pananalita ng Griyego at ang tradisyonal na biblikal na katawagan, habang nililinaw sa talababa na kolektibong tumutukoy ito sa bayan ng Israel.
- source_word: τε ... καὶ ... τε
  choice: ng ... ng ... at ng
  rationale: Natural na Filipino na koordinasyon ng tatlong pangkat; hindi kailangang tumbasan nang hiwa-hiwalay ang bawat partikulang Griyego.
theological_decisions:
- issue: Maaaring lagyan ng sistematikong doktrinal na kahulugan ang ἐκλογῆς (“pagpili”).
  choice: kasangkapang pinili ko
  alternative: sisidlan ng pagkahirang
  rationale: Malinaw sa talata ang pagpili ng Diyos para sa isang misyong gagampanan, ngunit hindi dapat ipasok sa salin ang mas makitid na mga pagtatalo tungkol sa doktrina ng pagkahirang.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Humayo” bilang malinaw na pautos na may biblikal na dignidad; pinanatili ang mga larawang “kasangkapan” at “dalhin ang aking pangalan” nang hindi pinapaliwanag nang labis sa mismong teksto.
