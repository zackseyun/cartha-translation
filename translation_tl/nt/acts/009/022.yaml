reference: Acts 9:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Σαῦλος δὲ μᾶλλον ἐνεδυναμοῦτο καὶ ⸀συνέχυννεν ⸀τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ, συμβιβάζων ὅτι οὗτός ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/022.yaml
  text: But Saul kept gaining strength all the more and was confounding the Jews living in Damascus[a], proving that this one is the Messiah.
translation:
  language: tl
  text: Ngunit lalo pang lumalakas si Saulo at patuloy niyang nililito ang mga Judiong naninirahan sa Damasco, habang pinatutunayan niyang si Jesus[a] ang Mesiyas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang isang ito.” Tumutukoy ito kay Jesus.
    reason: Nililinaw ang tahasang reperente sa salin habang itinatala ang demonstrative na anyo ng Griyego.
lexical_decisions:
- source_word: μᾶλλον ἐνεδυναμοῦτο
  choice: lalo pang lumakas
  rationale: Ipinahahayag ng imperfect na pandiwa ang patuloy na paglakas, habang pinananatili ng “lalo pa” ang paghahambing at pag-igting ng μᾶλλον nang hindi tinutukoy kung kanino nagmula ang lakas.
- source_word: συνέχυννεν
  choice: nilito niya
  rationale: Tumutukoy ang pandiwa sa paglalagay sa kalituhan o pagkataranta; natural ang “nilito” sa konteksto ng pangangatwiran at hindi nito dinaragdagan ang teksto ng tahasang ideya ng pagkatalo sa debate.
- source_word: τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ
  choice: ang mga Judiong naninirahan sa Damasco
  rationale: Tuwirang tinutukoy nito ang lokal na pangkat ng mga Judio sa Damasco at iniiwasan ang labis na paglalahat.
- source_word: συμβιβάζων
  choice: sa pamamagitan ng pagpapatunay
  rationale: 'Ipinakikita ng participle kung paano sila nilito ni Saulo: pinagbubuklod niya ang mga katibayan upang patunayan ang kaniyang konklusyon.'
- source_word: οὗτός
  choice: si Jesus
  rationale: Emphatic ang demonstrative at tumutukoy sa ipinangangaral na si Jesus ayon sa konteksto. Ginawang tahasan ang reperente para maging malinaw at natural sa Tagalog; minarkahan sa talababa ang literal na anyo.
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Titular dito ang Χριστός at tumutukoy sa ipinangakong pinahiran; pinananatili ng “Mesiyas” ang kontekstong Judio.
theological_decisions:
- issue: Pag-render sa ὁ χριστός bilang titulo
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Malinaw na titulo ang parirala rito, hindi bahagi ng personal na pangalan, kaya ang “Mesiyas” ang mas tuwirang nagpapahayag sa papel ng ipinangakong pinahiran.
- issue: Pagpapahayag sa reperente ng οὗτός
  choice: si Jesus
  alternative: ang isang ito / siya
  rationale: Si Jesus ang reperente sa naunang konteksto. Nililinaw ito sa pangunahing teksto para sa natural na Tagalog, ngunit inilalagay sa talababa ang mas literal na anyo upang hindi maitago ang demonstrative na anyo ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “mga Judio” at “Mesiyas” bilang karaniwang katawagang biblikal; iniwasan ang mas pormal ngunit di-likas na “nanggugulo sa pag-iisip” at ang sobrang teknikal na pananalita.
