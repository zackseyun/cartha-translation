  text: καὶ εὐθέως ἀπέπεσαν ⸂αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν⸃ ⸀ὡς λεπίδες, ἀνέβλεψέν τε καὶ ἀναστὰς ἐβαπτίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/018.yaml
  text: And immediately something like scales fell from his eyes[a], and he regained his sight; then he got up and was baptized,
translation:
  language: tl
  text: At agad na nalaglag mula sa kanyang mga mata ang parang mga kaliskis,[a] at nakakita siyang muli. Pagkatapos, tumayo siya at siya ay binautismuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “nalaglag mula sa kanyang mga mata ang gaya ng mga kaliskis.” Paghahambing ang gamit sa Griyego; inilalarawan nito ang anyo ng nalaglag at hindi tahasang sinasabing literal itong mga kaliskis.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: agad
  rationale: Likas at malinaw na ipinahahayag ang agarang pagkakasunod ng pangyayari sa modernong Tagalog.
- source_word: ἀπέπεσαν
  choice: nalaglag
  rationale: Ipinahahayag ang pagkalaglag at pagkahiwalay, habang ang pariralang 'mula sa kanyang mga mata' ang tumutukoy sa pinanggalingan.
- source_word: αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν
  choice: mula sa kanyang mga mata
  rationale: Natural na katumbas sa Tagalog ng paggalaw palayo sa mga mata.
- source_word: ὡς λεπίδες
  choice: ang parang mga kaliskis
  rationale: Pinananatili ng 'parang' ang paghahambing na ipinahahayag ng ὡς at hindi sinasabing literal na mga kaliskis ang nalaglag.
- source_word: ἀνέβλεψεν
  choice: nakakita siyang muli
  rationale: Sa konteksto ng paggaling mula sa pagkabulag, tumutukoy ang pandiwa sa muling pagkakita, hindi lamang sa pagtingala.
- source_word: τε καὶ
  choice: at ... Pagkatapos
  rationale: Natural na iniuugnay sa Tagalog ang magkakasunod na kilos nang hindi mekanikal na ginagaya ang dalawang pang-ugnay sa Griyego.
- source_word: ἀναστὰς
  choice: tumayo siya
  rationale: Maikli at natural na paglalarawan sa kilos na kasunod ng muling pagkakita.
- source_word: ἐβαπτίσθη
  choice: binautismuhan
  rationale: Pinananatili ang balintiyak na anyo at ang kinikilalang terminong biblikal nang hindi itinatakda ang paraan ng bautismo.
theological_decisions:
- issue: Neutral at tapat na pagsasalin ng βαπτίζω
  choice: binautismuhan
  alternative: inilubog
  rationale: Hindi tinutukoy ng talata ang paraan ng bautismo. Ang 'binautismuhan' ay tapat sa pandiwa at hindi nag-aangkat ng partikular na paninindigang denominasyonal.
- issue: Kung literal na mga kaliskis ang nalaglag
  choice: parang mga kaliskis
  alternative: mga kaliskis
  rationale: Ang ὡς ay naghahayag ng paghahambing. Pinananatili ng salin ang paglalarawan nang hindi nagpapasyang literal na mga kaliskis ang bagay na nalaglag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'nakakita siyang muli' para sa konteksto ng paggaling, at 'binautismuhan' bilang karaniwan at neutral na terminong biblikal.
