  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν δέ· Τίς εἶ, κύριε; ὁ ⸀δέ· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/005.yaml
  text: And he said[a], “Who are you, Lord?” And he said, “I am Jesus, whom you are persecuting.”
translation:
  language: tl
  text: Sinabi niya, “Sino po kayo, Panginoon?[a]” Sumagot siya, “Ako si Jesus na inuusig mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ginoo.” Ang Griyegong κύριε ay maaaring gamitin bilang magalang na pantawag; isinalin itong “Panginoon” dito dahil sa konteksto ng pagpapahayag at sa karaniwang salin ng κύριος.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Sinabi niya
  rationale: Ang aorist na εἶπεν ay karaniwang pandiwang pasalaysay; natural na inilalantad sa Tagalog ang di-tiyak na simuno. Hindi na hiwalay na isinalin ang mahinang pang-ugnay na δέ upang manatiling likas ang daloy.
- source_word: Τίς εἶ
  choice: Sino po kayo
  rationale: Tuwirang tanong tungkol sa pagkakakilanlan. Ang “po” at “kayo” ay natural na nagpapahayag ng paggalang sa modernong Tagalog nang hindi pa ipinapalagay ang buong pagkaunawa ni Saulo sa kausap.
- source_word: κύριε
  choice: Panginoon
  rationale: Ito ang karaniwang salin ng κύριος at angkop sa konteksto ng makalangit na pagpapahayag; pinananatili sa talababa ang posibilidad na isa lamang itong magalang na pagtawag.
- source_word: ὁ δέ
  choice: Sumagot siya
  rationale: Sa palitang-salita, natural na ipinahihiwatig ng parirala ang tugon ng ikalawang nagsasalita. Nililinaw ng “sumagot” ang tungkulin nito sa diskurso nang hindi nagdaragdag ng nilalaman.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: Ako si Jesus
  rationale: Likas na Tagalog na pagpapakilala sa sarili at pinananatili ang diin ng hayag na ἐγώ.
- source_word: ὃν σὺ διώκεις
  choice: na inuusig mo
  rationale: Ang pangkasalukuyang διώκεις ay nagpapakita ng nagpapatuloy na pag-uusig. Ang “mo” ay kinakailangang tumutukoy sa gumagawa at sapat na naghahatid ng tahasang σὺ.
theological_decisions:
- issue: Ang kahulugan ng κύριε bago ipakilala ng nagsasalita ang sarili bilang Jesus
  choice: Panginoon
  alternative: ginoo
  rationale: Maaaring maging magalang na pantawag ang κύριε, kaya hindi dapat ipalagay na ganap na ang pagkilala ni Saulo sa sandaling iyon. Gayunman, pinananatili ng “Panginoon” ang karaniwang salin at ang bigat ng konteksto ng pagpapahayag, habang itinatala sa talababa ang tunay na leksikal na posibilidad.
- issue: Ang pagkakaugnay ng pag-uusig kay Jesus at sa kanyang mga tagasunod
  choice: “Jesus na inuusig mo” nang walang paliwanag sa pangunahing teksto
  alternative: “Jesus, na inuusig mo sa pamamagitan ng pag-uusig sa aking mga tagasunod”
  rationale: Tahasang sinabi ng Griyego na si Jesus ang inuusig. Hindi idinaragdag sa talata ang teolohikal na paliwanag kung paano nauugnay rito ang pag-uusig sa kanyang mga tagasunod.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “po/kayo” bilang likas na tanda ng paggalang, samantalang ang “Panginoon” ay nagpapanatili sa leksikal at salaysay-teolohikal na bigat ng κύριε.
