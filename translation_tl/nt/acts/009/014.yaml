  source_fidelity: 'Tumpak ang pangunahing diwa: si Saul ay may ipinagkaloob na awtoridad mula sa mga punong pari upang gapusin ang lahat ng tumatawag sa pangalan ni Jesus. Gayunman, ang ayos na “narito siya na may awtoridad” ay hindi likas na paraan upang isalin ang ὧδε ἔχει ἐξουσίαν; mas malinaw na italaga ang ὧδε sa “dito.”'
