  terminology: Ang “awtoridad,” “mga punong pari,” at “gapusin” ay angkop. Ang “tumatawag sa iyong pangalan” ay mahusay na pagpapanatili ng biblikal na idyoma. Ang kasalukuyang talababa ay dapat ayusin sapagkat ang “dumudulog sa iyong pangalan” ay hindi likas na alternatibo at ang paglalarawan nito ay dapat tumukoy sa pagtawag sa pangalan ng isang tao.
