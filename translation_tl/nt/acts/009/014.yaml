  text: And here he has authority from the chief priests to bind all who call on your name[a].
translation:
  language: tl
  text: At dito ay may awtoridad siya mula sa mga punong pari na gapusin ang lahat ng tumatawag sa iyong pangalan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng tumatawag sa iyong pangalan.” Ang pananalitang Griyego ay karaniwang idyoma sa Biblia para sa pagtawag o pagdalangin sa pangalan ng isang tao, kadalasan sa panalangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: narito
  rationale: Likas at maikli itong panumbas sa pang-abay na tumutukoy sa lugar; sa konteksto, ang tinutukoy ay ang Damasco.
- source_word: ἐξουσίαν
  choice: awtoridad
  rationale: Ipinapahayag nito ang opisyal at ipinagkaloob na kapahintulutan, hindi lamang kakayahan o lakas.
- source_word: παρὰ τῶν ἀρχιερέων
  choice: mula sa mga punong pari
  rationale: Ang παρά na may genitive ay nagpapahiwatig ng pinagmulan ng awtoridad; ang “mga punong pari” ang karaniwang tawag sa pangkat ng mga pinunong saserdote sa Jerusalem.
- source_word: δῆσαι
  choice: gapusin
  rationale: Pinananatili nito ang kongkretong larawan ng Griyego habang malinaw na nagpapahiwatig ng pagdakip at pagpigil.
- source_word: πάντας τοὺς ἐπικαλουμένους
  choice: ang lahat ng tumatawag
  rationale: Ang participle na may artikulo ay tumutukoy sa lahat ng taong tumatawag o dumudulog; natural sa Filipino ang “tumatawag” at pinananatili nito ang biblikal na idyoma.
- source_word: τὸ ὄνομά σου
  choice: sa iyong pangalan
  rationale: Tuwirang pinananatili ang salitang “pangalan,” na sa biblikal na gamit ay kaugnay ng persona at awtoridad ng tinatawag.
theological_decisions:
- issue: Diwa ng “tumatawag sa iyong pangalan” na tuwirang sinabi kay Jesus
  choice: Panatilihin ang idyomang “tumatawag sa iyong pangalan.”
  alternative: “nananalangin sa iyo” o “dumudulog sa iyong awtoridad”
  rationale: Maaaring saklawin ng biblikal na parirala ang pananalangin, pagdalangin, at pagkilala ng katapatan kay Jesus. Pinananatili ng salin ang bigat nito nang hindi ito nililimitahan o pinalalawak sa isang tiyak na doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “awtoridad” para sa opisyal na kapahintulutan at “gapusin” upang mapanatili ang larawan ng orihinal; iniwasan ang labis na pagpapaliwanag sa mismong talata.
