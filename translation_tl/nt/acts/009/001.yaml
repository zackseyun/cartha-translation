  text: Ὁ δὲ Σαῦλος ἔτι ἐμπνέων ἀπειλῆς καὶ φόνου εἰς τοὺς μαθητὰς τοῦ κυρίου, προσελθὼν τῷ ἀρχιερεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/001.yaml
  text: But Saul[a], still breathing threats and murder against the disciples of the Lord, came to the high priest
translation:
  language: tl
  text: Ngunit si Saulo, na patuloy pa ring humihinga ng pagbabanta at pagpaslang[a] laban sa mga alagad ng Panginoon, ay lumapit sa mataas na pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagpatay.” Maaaring tumukoy ang salitang Griyego na φόνος sa pagpatay o pagpaslang; pinili ang “pagpaslang” upang maipahayag ang marahas at masamang layunin sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ang banayad na pagsalungat at ang pagbabalik ng salaysay kay Saulo mula sa naunang tagpo.
- source_word: ἔτι ἐμπνέων
  choice: nag-aalab pa rin
  rationale: Natural na idyomang Filipino para sa patuloy at matinding kalagayang inilalarawan ng literal na larawang ‘humihinga’; pinananatili nito ang sigla at tindi ng poot nang hindi nagiging alanganin ang parirala.
- source_word: ἀπειλῆς
  choice: pagbabanta
  rationale: Ang pangngalang di-mabilang ay angkop sa konstruksyong nagpapahayag ng patuloy na marahas na disposisyon.
- source_word: φόνου
  choice: pagpaslang
  rationale: Saklaw ng φόνος ang pagpatay o pagpaslang; malinaw na ipinahahayag ng ‘pagpaslang’ ang marahas at masamang layunin nang hindi ipinapalagay na naisagawa na ang pagpatay.
- source_word: εἰς τοὺς μαθητὰς
  choice: laban sa mga alagad
  rationale: Sa konteksto ng pagbabanta at karahasan, ang εἰς ay may direksiyong salungat; natural itong ipinahahayag ng ‘laban sa.’
- source_word: μαθητὰς
  choice: mga alagad
  rationale: Karaniwan, tumpak, at marangal na katawagan sa mga nakatalagang tagasunod sa konteksto ng Mga Gawa.
- source_word: τοῦ κυρίου
  choice: ng Panginoon
  rationale: Karaniwang salin ng κύριος at natural na tumutukoy sa Panginoon na kinabibilangan at sinusundan ng mga alagad.
- source_word: προσελθὼν
  choice: lumapit
  rationale: Tuwirang ipinapahayag ang paglapit ni Saulo sa pinakapunong pari at angkop sa participial na kilos na humahantong sa susunod na talata.
- source_word: τῷ ἀρχιερεῖ
  choice: sa pinakapunong pari
  rationale: Kinikilalang terminong Filipino para sa nag-iisang mataas na pinunong saserdote sa kontekstong ito.
theological_decisions:
- issue: Pagpapakahulugan sa κύριος sa τοῦ κυρίου
  choice: Panginoon
  alternative: Guro
  rationale: Ang ‘Panginoon’ ang karaniwan at kontekstuwal na salin ng κύριος sa Lucas–Mga Gawa, at dito ay tumutukoy sa kinikilalang Panginoon ng mga alagad nang hindi binabawasan ang teolohikal na bigat ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang ‘nag-aalab pa rin’ bilang malinaw na idyomatikong katumbas ng masalimuot na larawang Griyego na ἔτι ἐμπνέων, samantalang pinanatili ang tindi ng patuloy na pagbabanta at hangaring pumatay. Ang ‘pinakapunong pari’ ay pinili bilang pamilyar na terminong biblikal.
