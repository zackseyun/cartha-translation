  text: Ἐγένετο δὲ Πέτρον διερχόμενον διὰ πάντων κατελθεῖν καὶ πρὸς τοὺς ἁγίους τοὺς κατοικοῦντας Λύδδα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/032.yaml
  text: As Peter was passing through all of them, he also went down to the saints living in Lydda.
translation:
  language: tl
  text: Habang naglalakbay si Pedro sa lahat ng dako, bumaba rin siya patungo sa mga banal na naninirahan sa Lida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διερχόμενον διὰ πάντων
  choice: naglalakbay ... sa buong lugar
  rationale: Sa konteksto, inilalarawan nito ang paglibot ni Pedro sa mga pamayanan o lugar, hindi tahasang pagdaan sa lahat ng tao. Pinananatili ng parirala ang lawak nang hindi nagdaragdag ng tiyak na referent na wala sa Griyego.
- source_word: κατελθεῖν
  choice: pumunta
  rationale: Bagaman literal na maaaring 'bumaba,' karaniwang ginagamit ang pandiwa para sa pagpunta sa isang lugar; natural sa Filipino ang 'pumunta' dahil walang mahalagang topograpikong diin dito.
- source_word: τοὺς ἁγίους
  choice: mga banal
  rationale: Pinananatili ang maagang Kristiyanong katawagan para sa mga mananampalataya at ang kaugnayang teolohikal nito sa pagiging ibinukod para sa Diyos.
- source_word: Λύδδα
  choice: Lida
  rationale: Likas na transliterasyon sa Filipino ng pangalang Griyego na Λύδδα.
theological_decisions:
- issue: Pagkakakilanlan ng τοὺς ἁγίους
  choice: mga banal
  alternative: mga mananampalataya
  rationale: Ang mas pormal na salin ay nagpapanatili sa teolohikal na katawagan ng teksto nang hindi ito pinapaliit sa isang paliwanag lamang.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginawang likas ang salaysay sa Filipino habang pinananatili ang hindi tiyak na saklaw ng διὰ πάντων at ang katawagang 'mga banal.'
