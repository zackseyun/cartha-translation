base_translation:
  language: en
  yaml_path: translation/nt/acts/009/043.yaml
  text: And he stayed in Joppa for many days with a certain Simon[a], a tanner.
translation:
  language: tl
  text: At nanatili siya nang maraming araw sa Joppa, kasama ng isang lalaking nagngangalang Simon[a], na mangungulti ng balat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa bahay ng isang lalaking nagngangalang Simon.” Maaaring ipahiwatig ng pang-ukol sa Griyego na nakituloy siya sa bahay nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... μεῖναι
  choice: nanatili siya
  rationale: Ang ἐγένετο na sinusundan ng infinitive ay isang karaniwang idyoma. Ang tuwirang pandiwang “nanatili siya” ang likas na paraan sa Tagalog upang ihayag ang pangyayari nang hindi nagiging salitang-salita.
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay at hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: ἡμέρας ἱκανὰς
  choice: nang maraming araw
  rationale: Sa pananalitang tumutukoy sa tagal, ang ἱκανός ay nangangahulugang marami o may kahabaang panahon. Likas at malinaw sa Tagalog ang “nang maraming araw.”
- source_word: ἐν Ἰόππῃ
  choice: sa Joppa
  rationale: Pinanatili ang kinikilalang transliterasyon ng pangalang-heograpiko.
- source_word: παρά τινι Σίμωνι
  choice: kasama ng isang lalaking nagngangalang Simon
  rationale: Ang παρά na may datibo ay maaaring tumukoy sa pananatili kasama ng isang tao o sa bahay nito. Ipinahahayag ng “isang lalaking nagngangalang” ang pagiging di-tiyak ng τινι, habang pinananatili sa talababa ang posibleng lokatibong diwa.
- source_word: βυρσεῖ
  choice: mangungulti ng balat
  rationale: Tiyak na tumutukoy ang βυρσεύς sa taong nagkukulti ng balat ng hayop upang maging katad. Mas eksakto ito kaysa sa pangkalahatang “gumagawa ng katad.”
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Tagalog. Pinanatili ang payak na daloy ng salaysay at ang banayad na kalabuan kung si Pedro ay inilalarawang kasama ni Simon o nakikituloy sa bahay nito.
