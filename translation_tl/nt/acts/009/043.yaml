  source_fidelity: Tumpak na naihahayag ng salin ang idiomang ἐγένετο ... μεῖναι bilang “nanatili siya,” ang tagal na ἡμέρας ἱκανὰς bilang “nang maraming araw,” at ang para + datibo bilang pananatili kasama ni Simon. Napananatili rin ang di-tiyak na τινι sa “isang lalaking nagngangalang Simon.” Ang “mangungulti ng balat” ay sapat na tiyak para sa βυρσεῖ, isang tagapagproseso ng mga balat upang maging katad.
  naturalness: Likas, malinaw, at angkop sa makabagong marangal na Tagalog ang daloy ng pangungusap. Ang “kasama ng isang lalaking nagngangalang Simon” ay maayos na pagsasalin ng ugnayang ipinahihiwatig ng παρά, nang hindi ipinipilit sa pangunahing teksto ang kahulugang “sa bahay.”
  terminology: Wasto ang “Joppa” ayon sa ibinigay na patakaran sa mga pangalan, at ang “mangungulti ng balat” ay mas tiyak kaysa sa mas malawak na katawagang tumutukoy lamang sa paggawa ng katad. Wala ring problemang teolohikal o rehistral.
