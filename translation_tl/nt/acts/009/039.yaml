    issue: “Lumapit sa kanya” para sa παρέστησαν αὐτῷ
    rationale: Naglalarawan ito ng paglapit, samantalang ang Griyego sa kontekstong ito ay mas malapit sa pagharap/pagtayo sa tabi ni Pedro. Hindi nito sapat na naihahatid ang posisyon ng mga biyuda habang sila'y umiiyak at nagpapakita ng mga kasuotan.
  - severity: low
    issue: Malabo ang panghalip sa “noong kasama pa nila siya”
    rationale: Maaaring pansamantalang mabasa na si Pedro ang tinutukoy ng “siya.” Dapat tahasang banggitin si Dorcas upang maihatid ang μετ’ αὐτῶν οὖσα nang walang kalabuan.
