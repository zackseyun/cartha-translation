translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Iniwasan ang sobrang teknikal o makalumang pananalita, habang pinanatili ang sinaunang uri ng mga kasuotan at ang bahagyang kalabuan ng παρέστησαν αὐτῷ sa pamamagitan ng likas na “lumapit sa kanya.”
