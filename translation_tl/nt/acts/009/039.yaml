id: ACT.9.39
reference: Acts 9:39
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Πέτρος συνῆλθεν αὐτοῖς· ὃν παραγενόμενον ἀνήγαγον εἰς τὸ ὑπερῷον, καὶ παρέστησαν αὐτῷ πᾶσαι αἱ χῆραι κλαίουσαι καὶ ἐπιδεικνύμεναι χιτῶνας καὶ ἱμάτια ὅσα ἐποίει μετ’ αὐτῶν οὖσα ἡ Δορκάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/039.yaml
  text: So Peter got up and went with them[a]. When he arrived, they took him up to the upper room, and all the widows stood beside him[c][b], weeping and showing the tunics and garments that Dorcas made while she was with them.
translation:
  language: tl
  text: Kaya tumindig si Pedro at sumama sa kanila. Pagdating niya, dinala nila siya sa silid sa itaas. Tumayo sa tabi niya ang lahat ng biyuda, na umiiyak at ipinakikita ang mga tunika at balabal[a] na ginawa ni Dorcas[b] habang kasama pa nila si Dorcas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga tunika at balabal” ay salin ng dalawang magkaibang katawagang Griyego, na malamang ay tumutukoy sa panloob at panlabas na kasuotan.
    reason: cultural_note
  - marker: b
    text: Dorcas ang pangalang Griyego niya; sa Mga Gawa 9:36, tinatawag din siyang Tabita.
    reason: cross_reference
lexical_decisions:
- source_word: ἀναστὰς
  choice: tumindig
  rationale: Ipinahahayag ang pagbangon ni Pedro upang kumilos; likas at marangal ito sa modernong Tagalog.
- source_word: συνῆλθεν αὐτοῖς
  choice: sumama sa kanila
  rationale: Sa konteksto, sinamahan ni Pedro ang mga sugo; malinaw at natural ang parirala.
- source_word: παραγενόμενον
  choice: Pagdating niya
  rationale: Maayos na ipinakikita ang panahong kaugnayan ng participle sa kasunod na kilos.
- source_word: ἀνήγαγον εἰς τὸ ὑπερῷον
  choice: dinala nila siya sa silid sa itaas
  rationale: Pinananatili ang paitaas na pagdadala at malinaw na inilalarawan ang kuwartong nasa itaas.
- source_word: παρέστησαν αὐτῷ
  choice: Lumapit sa kanya
  rationale: Natural na inilalarawan ang mga biyudang pumuwesto sa harap o tabi ni Pedro, nang hindi ginagawang pormal na paghaharap ang eksena.
- source_word: πᾶσαι αἱ χῆραι
  choice: ang lahat ng biyuda
  rationale: Tuwirang tinutukoy ang buong pangkat ng mga babaeng namatayan ng asawa.
- source_word: κλαίουσαι
  choice: na umiiyak
  rationale: Ipinakikita ang nagpapatuloy na pagdadalamhati.
- source_word: ἐπιδεικνύμεναι
  choice: ipinakikita
  rationale: Payak at tumpak na inilalarawan ang pagpapakita nila ng mga damit kay Pedro.
- source_word: χιτῶνας καὶ ἱμάτια
  choice: mga tunika at balabal
  rationale: 'Pinananatili ang pagkakaiba ng dalawang katawagang Griyego: karaniwang kasuotang panloob at panlabas na kasuotan.'
- source_word: ὅσα ἐποίει
  choice: na ginawa
  rationale: Natural na salin ng imperfect sa loob ng relatibong sugnay; hindi ipinipilit ang habitual na diwa bagaman maaaring ipahiwatig iyon ng anyo.
- source_word: μετ’ αὐτῶν οὖσα
  choice: noong kasama pa nila siya
  rationale: Malinaw na ipinahihiwatig na buhay at kapiling pa nila si Dorcas nang gawin niya ang mga kasuotan.
