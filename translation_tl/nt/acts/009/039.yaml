revisions:
- from: Kaya tumindig si Pedro at sumama sa kanila. Pagdating niya, dinala nila siya sa silid sa itaas. Lumapit sa kanya ang lahat ng biyuda, na umiiyak at ipinakikita ang mga tunika at balabal[a] na ginawa ni Dorcas[b] noong kasama pa nila siya.
  to: Kaya tumindig si Pedro at sumama sa kanila. Pagdating niya, dinala nila siya sa silid sa itaas. Tumayo sa tabi niya ang lahat ng biyuda, na umiiyak at ipinakikita ang mga tunika at balabal[a] na ginawa ni Dorcas[b] habang kasama pa nila si Dorcas.
  rationale: Pinalitan ang “Lumapit sa kanya” ng “Tumayo sa tabi niya” upang mas tumpak na maipakita ang παρέστησαν αὐτῷ sa tagpong nagdadalamhati ang mga biyuda sa harap ni Pedro. Pinalitan din ang di-malinaw na panghalip sa huling sugnay ng hayag na “si Dorcas.” Hindi binabago ng mga ito ang kahulugan, ang dalawang uri ng kasuotan, o ang mga footnote anchor.
