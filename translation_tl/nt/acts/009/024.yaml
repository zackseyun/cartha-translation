  text: ἐγνώσθη δὲ τῷ Σαύλῳ ἡ ἐπιβουλὴ αὐτῶν. ⸂παρετηροῦντο δὲ καὶ⸃ τὰς πύλας ἡμέρας τε καὶ νυκτὸς ὅπως αὐτὸν ἀνέλωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/024.yaml
  text: But their plot became known to Saul[a]. They were also watching the gates day and night so that they might kill him.
translation:
  language: tl
  text: Ngunit nalaman ni Saulo ang balak nila. Binabantayan din nila ang mga pintuan[a] araw at gabi upang patayin siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga pintuan ng lungsod.” “Mga pintuan” lamang ang nasa Griyego; nauunawaan mula sa konteksto na mga pintuan ito ng lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώσθη δὲ τῷ Σαύλῳ
  choice: Ngunit nalaman ni Saulo
  rationale: Natural na Filipino ito para sa di-tahasang pasibong pahayag na ang balak ay nakarating sa kaalaman ni Saulo; hindi nito tinutukoy kung sino ang nagbalita sa kaniya.
- source_word: ἐπιβουλὴ
  choice: balak
  rationale: Sa konteksto, tumutukoy ito sa lihim at masamang planong patayin si Saulo. Ang “balak” ay malinaw at natural, habang ipinakikita ng kasunod na sugnay ang marahas na layunin nito.
- source_word: παρετηροῦντο
  choice: Binabantayan
  rationale: Ipinahihiwatig ng imperfect ang patuloy na pagmamanman. Ang “binabantayan” ay angkop sa pagbabantay sa mga labasan upang mahuli si Saulo, nang hindi ito ginagawang simpleng pagguwardiya lamang.
- source_word: πύλας
  choice: mga pintuan
  rationale: Pinananatili ang payak na “mga pintuan” ng Griyego. Mula sa tagpuan, nauunawaang mga pintuan ito ng lungsod, ngunit hindi idinaragdag ang “ng lungsod” sa pangunahing teksto.
- source_word: ἡμέρας τε καὶ νυκτὸς
  choice: araw at gabi
  rationale: Karaniwan at malinaw na pariralang Filipino na nagpapahayag ng walang-tigil na pagbabantay.
- source_word: ὅπως αὐτὸν ἀνέλωσιν
  choice: upang patayin siya
  rationale: Pinananatili ng “upang” ang layunin ng pagbabantay, at tuwirang ipinapahayag ng “patayin” ang kahulugan ng ἀναιρέω sa kontekstong ito.
- source_word: δὲ ... δὲ καὶ
  choice: Ngunit ... din
  rationale: 'Ang “Ngunit” ay naghuhudyat ng kaibahan: nalaman ni Saulo ang lihim na balak. Ang “din” ay nagdaragdag ng aktuwal nilang pagbabantay sa mga pintuan.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “siya” sa halip na pinaikling “siya’y” para sa mas natural na kasalukuyang daloy. Inilagay ang talababa pagkatapos ng “mga pintuan,” ang salitang aktuwal na nililinaw nito.
