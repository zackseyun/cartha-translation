id: ACT.9.27
reference: Acts 9:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ ἐπιλαβόμενος αὐτὸν ἤγαγεν πρὸς τοὺς ἀποστόλους, καὶ διηγήσατο αὐτοῖς πῶς ἐν τῇ ὁδῷ εἶδεν τὸν κύριον καὶ ὅτι ἐλάλησεν αὐτῷ καὶ πῶς ἐν Δαμασκῷ ἐπαρρησιάσατο ἐν τῷ ὀνόματι ⸀τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/027.yaml
  text: But Barnabas took hold of him and brought him to the apostles, and told them how on the road he had seen the Lord, and that he had spoken to him, and how in Damascus he had spoken boldly in the name of Jesus.
translation:
  language: tl
  text: Ngunit hinawakan siya ni Bernabe at dinala sa mga apostol. Isinalaysay niya sa kanila kung paano nakita ni Saulo ang Panginoon sa daan, at na nagsalita sa kanya ang Panginoon, at kung paano buong tapang na nagsalita si Saulo sa Damasco sa pangalan ni Jesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βαρναβᾶς
  choice: Bernabe
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa modernong salin sa Filipino.
- source_word: ἐπιλαβόμενος αὐτὸν
  choice: hinawakan siya
  rationale: Pinananatili nito ang konkretong diwa ng paghawak o pag-akay, habang ang konteksto ay nagpapakitang tumulong si Bernabe at hindi marahas na dumakip.
- source_word: ἤγαγεν πρὸς τοὺς ἀποστόλους
  choice: dinala sa mga apostol
  rationale: Natural sa Filipino at tumpak na naghahayag na iniharap ni Bernabe si Saulo sa mga apostol.
- source_word: διηγήσατο
  choice: Isinalaysay niya
  rationale: Ipinahihiwatig ng pandiwa ang detalyadong pagkukuwento o pag-uulat, kaya mas angkop ang “isinalaysay” kaysa simpleng “sinabi.”
- source_word: πῶς ἐν τῇ ὁδῷ
  choice: kung paano ... sa daan
  rationale: Tumutukoy ito sa daan patungong Damasco, hindi sa “Daan” bilang tawag sa kilusan.
- source_word: εἶδεν τὸν κύριον
  choice: nakita ni Saulo ang Panginoon
  rationale: Ginawang lantad ang tinutukoy ng panghalip upang maging malinaw at natural sa Filipino; pinanatili ang titulong “Panginoon.”
- source_word: ὅτι ἐλάλησεν αὐτῷ
  choice: nakipag-usap sa kanya ang Panginoon
  rationale: Malinaw sa konteksto na ang Panginoon ang nagsalita kay Saulo. Ang “nakipag-usap” ay natural na Filipino para sa personal na pakikipagsalita sa kanya.
- source_word: ἐπαρρησιάσατο
  choice: buong tapang na nagsalita
  rationale: Pinananatili ang diwa ng malaya, hayagan, at matapang na pagsasalita nang hindi nililimitahan sa teknikal na “nangaral.”
- source_word: ἐν τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: sa pangalan ni Jesus
  rationale: Pinananatili ang biblikal na idyoma na nagpapahiwatig ng kaugnayan sa awtoridad at pagkakilanlan ni Jesus.
theological_decisions:
- issue: Ang tinutukoy ng “Panginoon” sa karanasan ni Saulo sa daan
  choice: Ang “Panginoon” ay tumutukoy kay Jesus
  alternative: Isang mas pangkalahatang pagtukoy sa Diyos
  rationale: Sa agarang konteksto ng Mga Gawa 9, ang muling nabuhay na si Jesus ang nagpakita at nagsalita kay Saulo; pinagtitibay rin ito ng hulíng pariralang “sa pangalan ni Jesus.” Gayunman, pinanatili sa teksto ang titulong “Panginoon” sa halip na palitan ito ng pangalang Jesus.
- issue: Paglilinaw sa mga paksa ng magkakasunod na pandiwa
  choice: Tahasan ang “ni Saulo,” “ang Panginoon,” at “si Saulo”
  alternative: Panatilihin lamang ang magkakasunod na panghalip gaya ng estruktura ng Griyego
  rationale: Sa Griyego, natutukoy sa balarila at konteksto ang mga paksa; sa Filipino, maaaring lumabo kung sino ang nakakita, nagsalita, at buong tapang na nagsalita. Ang paglilinaw ay hindi nagdaragdag ng bagong interpretasyon kundi ipinapahayag ang ugnayang nasa pangungusap.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang “Ngunit” upang katawanin ang δέ at ipakita ang pagsalungat sa pag-aalinlangan ng mga alagad sa naunang talata. Walang footnote dahil walang mahalagang tekstuwal o leksikal na alternatibong kailangang iharap sa mambabasa sa talatang ito.
