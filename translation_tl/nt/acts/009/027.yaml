  source_fidelity: 'Kailangang panatilihin ang natatanging sugnay na ὅτι ἐλάλησεν αὐτῷ: ang Panginoon ay nagsalita kay Saulo. Ang “kung paano nakipag-usap sa kanya ang Panginoon” ay bahagyang nagpapahiwatig ng kapwaang pag-uusap at binabago ang ugnayan ng mga pangatnig.'
  naturalness: Natural at angkop sa modernong Filipino ang karamihan ng salin. Ang “na nagsalita sa kanya ang Panginoon” ay mas tapat sa Griyego at nananatiling malinaw sa loob ng mahabang pangungusap.
  terminology: Wasto ang “Bernabe,” “mga apostol,” “Panginoon,” “Damasco,” at “sa pangalan ni Jesus.” Ang “buong tapang na nagsalita” ay angkop para sa ἐπαρρησιάσατο.
