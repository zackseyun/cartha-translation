    rationale: Ang ὅτι ay “na,” hindi ikalawang “kung paano,” at ang ἐλάλησεν ay “nagsalita,” hindi kinakailangang isang kapwaang “nakipag-usap.” Ang rebisyon ay nagpapanatili ng saklaw at direksiyon ng kilos sa pinagmulan.
