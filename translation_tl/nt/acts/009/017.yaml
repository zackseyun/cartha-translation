id: ACT.9.17
reference: Acts 9:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπῆλθεν δὲ Ἁνανίας καὶ εἰσῆλθεν εἰς τὴν οἰκίαν, καὶ ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας εἶπεν· Σαοὺλ ἀδελφέ, ὁ κύριος ἀπέσταλκέν με, ⸀Ἰησοῦς ὁ ὀφθείς σοι ἐν τῇ ὁδῷ ᾗ ἤρχου, ὅπως ἀναβλέψῃς καὶ πλησθῇς πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/017.yaml
  text: So Ananias went and entered the house, and laying his hands on him he said, “Brother Saul, the Lord has sent me—Jesus, the one who appeared to you on the road by which you were coming—so that you may regain your sight and be filled with the Holy Spirit.”
translation:
  language: tl
  text: Kaya umalis si Ananias at pumasok sa bahay. Ipinatong niya kay Saulo ang kanyang mga kamay at sinabi, “Kapatid na Saulo, isinugo ako ng Panginoon—si Jesus na nagpakita sa iyo sa daang tinatahak mo[a]—upang muli kang makakita[b] at mapuspos ng Banal na Espiritu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa daang nilalakbay mo.”
    reason: lexical_alternative
  - marker: b
    text: O “manumbalik ang iyong paningin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν δὲ
  choice: Kaya umalis
  rationale: Ipinahihiwatig ng δέ ang pagpapatuloy bunga ng naunang utos, samantalang pinananatili ng “umalis” ang galaw ng ἀπέρχομαι nang natural sa Filipino.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν
  choice: pumasok sa bahay
  rationale: Direkta at likas na katumbas ng pagpasok sa tinutukoy na bahay.
- source_word: ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας
  choice: Ipinatong niya kay Saulo ang kanyang mga kamay
  rationale: Pinananatili ang pisikal na kilos ng pagpapatong ng mga kamay at ginagawang malinaw ang tinutukoy ng panghalip sa natural na Filipino.
- source_word: Σαοὺλ ἀδελφέ
  choice: Kapatid na Saulo
  rationale: Likas na anyong pantawag sa Filipino na nagpapanatili sa mainit at mapagtanggap na tawag na ἀδελφέ.
- source_word: ὁ κύριος ἀπέσταλκέν με
  choice: isinugo ako ng Panginoon
  rationale: Ang “isinugo” ay angkop sa awtorisadong pagpapadala, at ang konteksto ang nagpapahayag ng patuloy na kabuluhan ng perpektong anyo.
- source_word: Ἰησοῦς ὁ ὀφθείς σοι
  choice: si Jesus na nagpakita sa iyo
  rationale: Pinananatili si “Jesus” bilang aposisyon na tumutukoy sa “Panginoon,” ayon sa ayos at diin ng tekstong Griyego.
- source_word: ἐν τῇ ὁδῷ ᾗ ἤρχου
  choice: sa daang tinatahak mo
  rationale: Ang “daan” ay literal, at ang “tinatahak mo” ay natural na nagpapahayag ng nagpapatuloy na paglalakbay na nasa imperpektong ἤρχου nang hindi pilit na tinutukoy ang direksiyon.
- source_word: ὅπως ἀναβλέψῃς
  choice: upang muli kang makakita
  rationale: Ipinapahayag ng “upang” ang layunin at ng “muling makakita” ang pagbabalik ng paningin sa konteksto ng pagpapagaling.
- source_word: πλησθῇς πνεύματος ἁγίου
  choice: mapuspos ng Banal na Espiritu
  rationale: Ang “mapuspos” ay dignified at karaniwang biblikal na katumbas ng πληρόω; malinaw na tumutukoy ang parirala sa banal na Espiritu.
theological_decisions:
- issue: Aposisyon ng Ἰησοῦς sa ὁ κύριος
  choice: “isinugo ako ng Panginoon—si Jesus na nagpakita sa iyo…”
  alternative: “isinugo ako ng Panginoong Jesus, na nagpakita sa iyo…”
  rationale: Pinananatili ng pinili ang tunay na aposisyunal na ayos at retorikal na paghinto ng Griyego, habang malinaw pa ring kinikilala si Jesus bilang ang Panginoon.
- issue: Anarthrous na πνεύματος ἁγίου
  choice: “ng Banal na Espiritu”
  alternative: “ng banal na espiritu”
  rationale: Sa konteksto ng Mga Gawa, tumutukoy ito sa natatanging banal na Espiritu; hindi nangangailangan ng di-tiyak na kahulugan ang kawalan ng artikulo sa Griyego.
- issue: Lakas ng ἀδελφέ sa pagtawag kay Saulo
  choice: “Kapatid na Saulo”
  alternative: “Saulo, kapatid”
  rationale: Pinananatili nito ang pagtanggap at pakikipag-ugnayang ipinahihiwatig ng pantawag nang hindi nililimitahan iyon sa isang denominasyonal na pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kay Saulo” sa kilos ng pagpapatong upang maiwasan ang malabong sunod-sunod na panghalip. Pinanatili ang dash upang katawanin ang aposisyon at teolohikal na tensiyon ng orihinal sa halip na tahimik na isaayos bilang “Panginoong Jesus.”
