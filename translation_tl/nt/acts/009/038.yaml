  source_fidelity: 'Tapat ang salin sa pangunahing ugnayan ng talata: malapit ang Lida sa Joppa, nabalitaan ng mga alagad na naroon si Pedro, nagsugo sila ng dalawang lalaki sa kanya, at ipinakiusap ng mga isinugo na huwag siyang magpaliban sa pagpunta. Ang “Dahil” ay angkop na pagpapahayag ng background circumstance at ng sanhi na ipinahihiwatig ng genitive absolute.'
