  text: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ οἱ μαθηταὶ ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ ἀπέστειλαν ⸂δύο ἄνδρας⸃ πρὸς αὐτὸν παρακαλοῦντες· Μὴ ⸀ὀκνήσῃς διελθεῖν ἕως ⸀ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/038.yaml
  text: Since Lydda was near Joppa[a], the disciples, hearing that Peter was there, sent two men to him, urging, “Do not delay to come to us.”
translation:
  language: tl
  text: Dahil malapit ang Lida sa Joppa, nabalitaan ng mga alagad na naroon si Pedro. Kaya nagsugo sila sa kanya ng dalawang lalaki na mahigpit na nakikiusap, “Huwag mong ipagpaliban ang pagpunta sa amin.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Huwag kang mag-atubiling pumunta sa amin.” Maaaring mangahulugan ang pandiwa ng pag-aatubili o pagpapaliban.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ
  choice: Dahil malapit ang Lida sa Joppa
  rationale: Ang genitive absolute ay nagbibigay ng kalagayang nasa likod ng pagkilos ng mga alagad at nagpapahiwatig ng dahilan. Likas sa Tagalog ang “Dahil malapit” at hindi na kailangan ng hiwalay na panandang katumbas ng δέ.
- source_word: Λύδδας / Ἰόππῃ
  choice: Lida / Joppa
  rationale: Ginamit ang mga anyong transliterado mula sa mga pangalang Griyego sa konteksto ng Bagong Tipan.
- source_word: οἱ μαθηταὶ ἀκούσαντες
  choice: nabalitaan ng mga alagad
  rationale: Ipinahahayag nito na nalaman muna ng mga alagad ang balita bago sila nagsugo. Ang “mga alagad” ang karaniwan at tiyak na salin ng μαθηταί sa Mga Gawa.
- source_word: ὅτι Πέτρος ἐστὶν ἐν αὐτῇ
  choice: na naroon si Pedro
  rationale: Ang αὐτῇ ay tumutukoy sa Lida; natural na naihahayag ito sa Tagalog sa pamamagitan ng “naroon.”
- source_word: ἀπέστειλαν δύο ἄνδρας πρὸς αὐτόν
  choice: nagsugo sila sa kanya ng dalawang lalaki
  rationale: Tuwirang pinananatili ang kilos, patutunguhan, at bilang ng mga isinugo.
- source_word: παρακαλοῦντες
  choice: na mahigpit na nakikiusap
  rationale: Ipinakikita ng παρακαλέω rito ang taimtim at apurahang pakiusap nang hindi ipinapalagay na sila ay nagmamakaawa.
- source_word: Μὴ ὀκνήσῃς διελθεῖν ἕως ἡμῶν
  choice: Huwag mong ipagpaliban ang pagpunta sa amin
  rationale: Maaaring tumukoy ang ὀκνέω sa pag-aatubili o pagpapaliban. Ang “ipagpaliban” ay angkop sa apurahang kahilingan, samantalang ang διελθεῖν ἕως ἡμῶν ay likas na naihahayag bilang “pagpunta sa amin.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Hinati sa dalawang pangungusap ang mahabang estrukturang Griyego upang maging natural at madaling maunawaan, habang pinanatili ang ugnayang sanhi sa pamamagitan ng “Dahil” at “Kaya.”
