id: ACT.9.10
reference: Acts 9:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἦν δέ τις μαθητὴς ἐν Δαμασκῷ ὀνόματι Ἁνανίας, καὶ εἶπεν πρὸς αὐτὸν ⸂ἐν ὁράματι ὁ κύριος⸃· Ἁνανία. ὁ δὲ εἶπεν· Ἰδοὺ ἐγώ, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/010.yaml
  text: There was a disciple in Damascus named Ananias, and the Lord said to him in a vision, “Ananias.” And he said, “Here I am, Lord.”
translation:
  language: tl
  text: May isang alagad sa Damasco na nagngangalang Ananias, at sinabi sa kanya ng Panginoon sa isang pangitain, “Ananias.” Sumagot siya, “Narito ako, Panginoon.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: May
  rationale: Ipinakikilala nito ang isang bagong tauhan sa salaysay. Likas sa modernong Tagalog ang konstruksiyong “May isang…”; hindi na kailangang dagdagan ng tahasang panandang temporal.
- source_word: τις μαθητὴς
  choice: isang alagad
  rationale: Ang τις ay di-tiyak at nagpapakilala ng isang tauhan; sapat na itong ipahayag sa “isang,” nang hindi gumagamit ng mas mabigat na “isang tiyak na.”
- source_word: ἐν Δαμασκῷ
  choice: sa Damasco
  rationale: Tuwirang lokatibong parirala; “Damasco” ang nakaugaliang anyong Filipino ng pangalan ng lugar.
- source_word: ὀνόματι Ἁνανίας
  choice: na ang pangalan ay Ananias
  rationale: Natural at malinaw na pagpapahayag sa Tagalog ng idyomang Griyego para sa pagpapangalan.
- source_word: εἶπεν πρὸς αὐτὸν
  choice: Sinabi sa kanya
  rationale: Tuwirang katumbas ng λέγω na may πρός at akusatibo; pinananatili ang direktang kilos ng pagsasalita.
- source_word: ἐν ὁράματι
  choice: sa isang pangitain
  rationale: Ipinapahayag ang kalagayan o paraan kung saan kinausap ng Panginoon si Ananias.
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: May artikulo ang Griyego at tumutukoy sa banal na tagapagsalita sa pangitain; ang “Panginoon” ang karaniwan at marangal na salin.
- source_word: Ἁνανία
  choice: Ananias
  rationale: Pangalan sa anyong pantawag; pinanatili ang karaniwang transliterasyon.
- source_word: Ἰδοὺ ἐγώ
  choice: Narito ako
  rationale: Likas na idyomatikong tugon sa Tagalog na nagpapahayag ng pagdinig, pagharap, at kahandaang tumugon.
- source_word: κύριε
  choice: Panginoon
  rationale: Bagaman maaari itong mangahulugang “ginoo” sa ibang konteksto, dito ay tugon ito sa Panginoong nagsasalita sa pangitain.
theological_decisions:
- issue: Tinutukoy ng ὁ κύριος at κύριε sa pangitain
  choice: Kapwa isinalin na “Panginoon,” na sa konteksto ay tumutukoy sa muling nabuhay na Jesus
  alternative: Isang mas pangkalahatang banal na tagapagsalita o ang pantawag na “ginoo”
  rationale: Sa mas malawak na salaysay ng Gawa 9, ang Panginoong nagsasalita at nag-aatas kay Ananias ay si Jesus. Gayunman, hindi idinagdag ang pangalang “Jesus” sa talata upang hindi palawakin ang tahasang teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Hinati sa tatlong pangungusap upang maging natural ang daloy, habang pinananatili ang lahat ng nilalaman at ang banayad na transisyon ng Griyego.
