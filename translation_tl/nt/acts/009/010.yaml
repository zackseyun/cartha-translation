  to: May isang alagad sa Damasco na nagngangalang Ananias, at sinabi sa kanya ng Panginoon sa isang pangitain, “Ananias.” Sumagot siya, “Narito ako, Panginoon.”
  rationale: Pinalitan ang tandang padamdam ng tuldok upang hindi magdagdag ng diin na wala sa Griyego, at pinasimple ang pagpapakilala sa pangalan sa isang mas natural na modernong Tagalog na anyo. Napanatili ang lahat ng nilalaman, ang banayad na transisyon ng salaysay, at ang pagkakasunod ng mga pangyayari.
