id: ACT.9.26
reference: Acts 9:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παραγενόμενος δὲ ⸀εἰς Ἰερουσαλὴμ ⸀ἐπείραζεν κολλᾶσθαι τοῖς μαθηταῖς· καὶ πάντες ἐφοβοῦντο αὐτόν, μὴ πιστεύοντες ὅτι ἐστὶν μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/026.yaml
  text: And when he came to Jerusalem[a], he was trying to join the disciples, but they were all afraid of him, not believing that he was a disciple.
translation:
  language: tl
  text: Pagdating niya sa Jerusalem, sinikap niyang makisama sa mga alagad[a]. Ngunit natatakot silang lahat sa kaniya dahil hindi sila naniniwalang isa siyang alagad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, iugnay ang sarili niya nang malapit sa mga alagad.
    reason: Ipinakikita ng alternatibo ang mas literal na diwa ng κολλᾶσθαι—ang pagdikit o malapit na pag-uugnay ng sarili—na mas matindi nang bahagya kaysa sa natural na pangunahing saling “makisama.”
lexical_decisions:
- source_word: Παραγενόμενος
  choice: Pagdating niya
  rationale: Ipinahahayag ng aorist participle ang pangyayaring nauna sa pangunahing kilos. Likas sa modernong Tagalog ang “Pagdating niya” at malinaw ang ugnayang temporal.
- source_word: δὲ
  choice: '[hindi tahasang isinalin]'
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay. Sapat nang ipinahihiwatig ng bagong pangungusap ang pagpapatuloy, kaya hindi kailangang piliting isalin bilang “at” o “ngayon.”
- source_word: εἰς Ἰερουσαλήμ
  choice: sa Jerusalem
  rationale: Karaniwang direksiyonal na gamit ng εἰς sa pangalan ng lungsod; sa Tagalog, natural na saklaw ng “Pagdating ... sa Jerusalem” ang kahulugang pagpunta roon.
- source_word: ἐπείραζεν
  choice: sinikap niya
  rationale: Ang imperfect ay naglalarawan ng pagtatangkang isinasagawa. Ipinapahayag ng “sinikap” ang tunay na pagsubok nang hindi nagpapahiwatig ng tukso.
- source_word: κολλᾶσθαι
  choice: sumama
  rationale: Sa kontekstong panlipunan, tumutukoy ito sa paglapit at pakikipag-ugnay nang malapit sa pangkat. Natural sa Tagalog ang “sumama,” habang iniiwasan ang pagpapahiwatig ng isang pormal na proseso ng pagiging miyembro.
- source_word: τοῖς μαθηταῖς
  choice: sa mga alagad
  rationale: Tumutukoy ang tiyak na parirala sa kilalang pangkat ng mga alagad sa Jerusalem. Ang “mga alagad” ang malinaw at nakaugaliang salin.
- source_word: καὶ πάντες ἐφοβοῦντο αὐτόν
  choice: Ngunit natatakot silang lahat sa kaniya
  rationale: 'Bagaman καί ang pang-ugnay, kontrastibo ang pag-unlad ng diwa: nagsikap siyang sumama, ngunit takot sila. Pinananatili ng “natatakot” ang nagpapatuloy na kalagayang ipinahahayag ng imperfect.'
- source_word: μὴ πιστεύοντες
  choice: dahil hindi sila naniniwala
  rationale: Ang participle na may μή ay nagbibigay ng dahilan ng kanilang takot. Ginagawang tahas ng “dahil” ang likas na ugnayang sanhi sa Tagalog.
- source_word: ὅτι ἐστὶν μαθητής
  choice: na isa siyang alagad
  rationale: Walang obligadong tense backshift sa Tagalog. Ang hulma na “isa siyang alagad” ay natural at tapat sa nilalaman ng sugnay.
- source_word: μαθητής
  choice: alagad
  rationale: Ang “alagad” ang karaniwan at angkop na terminong biblikal para sa isang nakatalagang tagasunod at mag-aaral.
theological_decisions:
- issue: Uri ng pakikipag-ugnayang sinikap ni Saulo sa mga mananampalataya sa Jerusalem
  choice: “sumama sa mga alagad”
  alternative: “iugnay ang sarili niya sa mga alagad”
  rationale: Ipinakikita ng teksto ang pagsisikap niyang tanggapin at makisalamuha sa komunidad, hindi ang pagdaan sa isang pormal na ritwal o institusyonal na proseso ng pagiging miyembro. Pinananatili ng salin at talababa ang panlipunan at malapit na diwa ng κολλᾶσθαι nang hindi nagpapasok ng mas huling kaayusang pansimbahan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “kaniya” sa halip na kolokyal na “kanya.” Inilagay ang talababa pagkatapos ng pariralang tunay nitong ipinapaliwanag.
