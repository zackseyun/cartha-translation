base_translation:
  language: en
  yaml_path: translation/nt/acts/009/016.yaml
  text: For I will show him how much he must suffer for my name[a].
translation:
  language: tl
  text: Sapagkat ako ang magpapakita sa kanya kung gaano karaming pagdurusa ang kailangan niyang tiisin alang-alang sa aking pangalan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil sa aking pangalan” o “para sa kapakanan ng aking pangalan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: ako
  rationale: Pinanatili ang tahasang panghalip upang maipahayag ang diin sa nagsasalita, bagaman likas na kasama na ito sa pandiwang Filipino.
- source_word: γὰρ
  choice: sapagkat
  rationale: Nagbibigay ito ng paliwanag o batayan para sa naunang pahayag; ang “sapagkat” ay malinaw at marangal na pang-ugnay sa makabagong Filipino.
- source_word: ὑποδείξω
  choice: ipapakita
  rationale: Tuwirang ipinapahayag ang hinaharap na pagkilos na magpakita o magpaalam.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Likas na katumbas sa Filipino ng datibong di-tuwirang layon.
- source_word: ὅσα
  choice: kung gaano karami
  rationale: Sa kayariang may δεῖ at pawatas, tumutukoy ito sa lawak o dami ng pagdurusa, hindi kinakailangang sa isang talaan ng mga bagay.
- source_word: δεῖ
  choice: dapat
  rationale: Pinananatili ang diwa ng pangangailangan nang hindi tinutukoy kung ito ay tadhana, paghirang, o ibang mas tiyak na teolohikal na paliwanag.
- source_word: ὑπὲρ
  choice: alang-alang sa
  rationale: Sa kaugnayan nito sa “aking pangalan,” malinaw nitong ipinapahayag ang dahilan o kapakanan na pinagtitiisan, habang ang ibang posibleng nuance ay inilalagay sa talababa.
- source_word: τοῦ ὀνόματός μου
  choice: aking pangalan
  rationale: Pinanatili ang “pangalan,” na maaaring saklawin ang persona, awtoridad, at hayagang pagkilala kay Jesus.
- source_word: παθεῖν
  choice: pagdusahan
  rationale: Likas na pandiwang Filipino para sa pagdanas ng hirap o pagdurusa; sa kayariang “dapat niyang pagdusahan,” naipahahayag din ang lawak na tinutukoy ng ὅσα.
theological_decisions:
- issue: Uri ng pangangailangang ipinahahayag ng δεῖ
  choice: dapat
  alternative: itinadhanang / itinalagang
  rationale: Nagsasaad ang talata ng pangangailangan ngunit hindi tahasang nililinaw kung ito ay lohikal, providensiyal, o hayagang itinakda. Pinananatili ng “dapat” ang tensiyong ito nang hindi nagdaragdag ng mas deterministikong pakahulugan.
- issue: Saklaw ng ὑπὲρ τοῦ ὀνόματός μου
  choice: alang-alang sa aking pangalan
  alternative: dahil sa aking pangalan / para sa kapakanan ng aking pangalan
  rationale: Maaaring ipahiwatig ng ὑπέρ ang dahilan, kapakanan, o pakikiisa sa pangalan ni Jesus. Ang pangunahing salin ay natural at malawak, at pinananatili sa talababa ang mga posibleng alternatibo.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “sapagkat” at “alang-alang” bilang pormal ngunit karaniwang mga salita; iniwasan ang mas lumang anyong “nararapat” at ang interpretibong “itinadhana.”
