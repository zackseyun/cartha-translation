- from: Sapagkat ipapakita ko sa kanya kung gaano karami ang dapat niyang pagdusahan alang-alang sa aking pangalan.[a]
  to: Sapagkat ako ang magpapakita sa kanya kung gaano karaming pagdurusa ang kailangan niyang tiisin alang-alang sa aking pangalan.[a]
