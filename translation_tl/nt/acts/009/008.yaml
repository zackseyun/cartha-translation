  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἠγέρθη δὲ ⸀Σαῦλος ἀπὸ τῆς γῆς, ἀνεῳγμένων ⸀δὲ τῶν ὀφθαλμῶν αὐτοῦ ⸀οὐδὲν ἔβλεπεν· χειραγωγοῦντες δὲ αὐτὸν εἰσήγαγον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/008.yaml
  text: But Saul got up from the ground[a], and though his eyes were open, he saw nothing. So they led him by the hand and brought him into Damascus.
translation:
  language: tl
  text: Tumayo si Saulo mula sa lupa, ngunit kahit nakadilat ang kanyang mga mata, wala siyang makita. Kaya inakay nila siya sa kamay at dinala sa Damasco.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγέρθη
  choice: Tumayo
  rationale: 'Ang aorist passive ng ἐγείρω ay ginagamit dito sa diwang intransitibo: bumangon o tumayo si Saulo mula sa pagkakahandusay. Natural at tuwiran sa modernong Tagalog ang “tumayo.”'
- source_word: ἀπὸ τῆς γῆς
  choice: mula sa lupa
  rationale: Ang γῆ ay tumutukoy sa lupang kinahulugan ni Saulo, hindi sa daigdig o sa isang teritoryo.
- source_word: ἀνεῳγμένων ... τῶν ὀφθαλμῶν αὐτοῦ
  choice: kahit nakadilat ang kanyang mga mata
  rationale: 'Ang genitive absolute ay nagpapahayag ng kasabay na kalagayan na may malinaw na pagsalungat sa konteksto: nakadilat ang mga mata niya ngunit hindi siya nakakakita. Pinananatili ng “kahit” ang ironiyang ito nang natural sa Tagalog.'
- source_word: οὐδὲν ἔβλεπεν
  choice: wala siyang makita
  rationale: Natural itong pahayag sa Tagalog para sa ganap na kawalan ng kakayahang makakita at tapat sa kahulugan ng Griyego.
- source_word: χειραγωγοῦντες
  choice: inakay nila siya sa kamay
  rationale: Tiyak na inilalarawan ng pandiwa ang pag-akay sa isang tao sa pamamagitan ng paghawak sa kamay, kaya pinananatili ang kongkretong larawan.
- source_word: εἰσήγαγον εἰς Δαμασκόν
  choice: dinala sa Damasco
  rationale: Ipinahihiwatig ng εἰσάγω ang pagdadala papasok sa lugar. Sapat at natural sa Tagalog ang “dinala sa Damasco,” yamang naipahayag na sa naunang parirala ang paraan ng paggabay.
- source_word: Σαῦλος
  choice: Saulo
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang biblikal.
- source_word: Δαμασκόν
  choice: Damasco
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalan ng lungsod.
