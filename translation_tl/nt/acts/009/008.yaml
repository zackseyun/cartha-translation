  source_fidelity: 'Tapat ang salin sa Griyego: si Saulo ay bumangon mula sa lupa; nakadilat ang kanyang mga mata ngunit wala siyang makita; at inakay siya ng mga kasama niya papasok sa Damasco. Ang aspektong nagpapatuloy ng ἔβλεπεν ay natural na naipahayag sa “wala siyang makita.”'
