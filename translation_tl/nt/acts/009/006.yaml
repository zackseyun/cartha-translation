base_translation:
  language: en
  yaml_path: translation/nt/acts/009/006.yaml
  text: But get up and enter the city[a], and you will be told what you must do.
translation:
  language: tl
  text: Ngunit bumangon ka at pumasok sa lungsod, at sasabihin sa iyo[a] kung ano ang dapat mong gawin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na ayos: “sasabihin sa iyo kung ano ang kinakailangan mong gawin.”'
    reason: Ipinakikita ang di-tiyak na pasibong pahayag at ang impersonal na pagpapahayag ng pangangailangan sa Griyego, na isinalin nang mas natural sa pangunahing teksto.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Nagpapahiwatig ito ng pagliko mula sa naunang tanong ni Saulo tungo sa utos; ang “Ngunit” ay maikli, natural, at malinaw na panalungat.
- source_word: ἀνάστηθι
  choice: bumangon ka
  rationale: Ang aorist imperative ay tuwirang utos kay Saulo na bumangon mula sa pagkadapa; natural ito sa modernong Tagalog.
- source_word: εἴσελθε εἰς τὴν πόλιν
  choice: pumasok sa lungsod
  rationale: Pinagsasama ng natural na pariralang Tagalog ang pandiwa at direksiyong ipinahahayag ng εἰς, nang hindi nawawala ang diwa ng pagpasok.
- source_word: λαληθήσεταί σοι
  choice: sasabihin sa iyo
  rationale: Pinananatili nito ang di-tiyak na tagapagsalita ng anyong pasibo sa Griyego at mas natural kaysa sa lubhang literal na “ipagsasalita sa iyo.”
- source_word: ὅ τί
  choice: kung ano
  rationale: Natural nitong ipinakikilala sa Tagalog ang nilalaman ng sasabihin kay Saulo.
- source_word: σε δεῖ ποιεῖν
  choice: ang dapat mong gawin
  rationale: Ang “dapat” ay malinaw na nagpapahayag ng pangangailangan o obligasyong taglay ng δεῖ, nang hindi tahasang tinutukoy kung sino ang nagtakda nito.
theological_decisions:
- issue: Lakas at pinagmumulan ng pangangailangang ipinahahayag ng δεῖ
  choice: dapat
  alternative: kailangan
  rationale: Pinananatili ng “dapat” ang malakas na diwa ng obligasyon o pangangailangan, ngunit hindi nito nilulutas nang lampas sa teksto kung ang diin ay nasa banal na layunin, utos, o praktikal na pangangailangan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “lungsod” sa halip na “siyudad” para sa neutral at dignified na rehistro; pinanatili ang tuwirang utos at ang di-tiyak na tagapagsalita ng Griyego.
