id: ACT.9.41
reference: Acts 9:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: δοὺς δὲ αὐτῇ χεῖρα ἀνέστησεν αὐτήν, φωνήσας δὲ τοὺς ἁγίους καὶ τὰς χήρας παρέστησεν αὐτὴν ζῶσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/041.yaml
  text: And giving her his hand[a], he raised her up; then he called the saints and the widows and presented her alive.
translation:
  language: tl
  text: Iniabot niya kay Tabita ang kanyang kamay at ibinangon siya[a]. Pagkatapos, tinawag niya ang mga banal at ang mga biyuda, at iniharap niya sa kanila si Tabita na buhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinulungan siyang bumangon” o “pinatayo siya.” Ang pandiwang Griyego ay maaaring mangahulugang pagpapabangon o pagpapatayo sa isang tao; sa kontekstong ito, may himig din itong kaugnay ng muling pagkabuhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς ... χεῖρα
  choice: Iniabot niya kay Tabita ang kanyang kamay
  rationale: Ang parirala ay tumutukoy sa pag-abot ng kamay upang tulungan siyang makatayo. Ginamit ang pangalang “Tabita” mula sa malinaw na naunang tinutukoy sa salaysay upang maiwasan ang malabong sunod-sunod na panghalip sa natural na Tagalog.
- source_word: ἀνέστησεν
  choice: ibinangon siya
  rationale: Pinananatili ng “ibinangon” ang diwa ng pagpapabangon o pagpapatayo at ang pahiwatig ng wikang kaugnay ng muling pagkabuhay, nang hindi ipinapalagay na ang pandiwang ito lamang ang nagsasaad ng pagbuhay sa kanya.
- source_word: φωνήσας
  choice: tinawag niya
  rationale: Natural itong katumbas ng pagtawag o pagpapapunta sa pangkat, at malinaw sa ayos ng pangungusap na nauna ito sa pagharap kay Tabita sa kanila.
- source_word: τοὺς ἁγίους
  choice: ang mga banal
  rationale: Tuwirang salin ito ng karaniwang katawagan sa Bagong Tipan para sa mga taong ibinukod para sa Diyos. Hindi ito pinalitan ng mas interpretibong “mga mananampalataya.”
- source_word: τὰς χήρας
  choice: ang mga biyuda
  rationale: Tuwirang salin ito at pinananatili ang hiwalay na pagbanggit sa mga biyuda, na mahalaga sa naunang salaysay.
- source_word: παρέστησεν
  choice: iniharap niya sa kanila
  rationale: Ipinahihiwatig ng pandiwa na dinala o iniharap niya si Tabita sa harap ng mga tinawag. Ang “sa kanila” ay likas na ipinahihiwatig ng konteksto at kailangan para sa malinaw na Tagalog.
- source_word: ζῶσαν
  choice: na buhay
  rationale: 'Predikatibo ang gamit ng participle: iniharap niya si Tabita bilang isang taong buhay. Ang “na buhay” ang pinakanatural at mariing salin sa kontekstong ito.'
theological_decisions:
- issue: Ang pandiwang ἀνέστησεν at ang kaugnayan nito sa muling pagkabuhay
  choice: ibinangon siya
  alternative: tinulungan siyang bumangon / pinatayo siya
  rationale: Ang “ibinangon” ay angkop kapwa sa agarang kilos ng pagtulong kay Tabita na makatayo at sa mas malawak na himig ng salaysay tungkol sa pagpapanumbalik niya sa buhay. Hindi nito nilulutas nang labis ang sadyang magkapatong na mga diwa ng pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “biyuda,” na karaniwan at madaling maunawaan, at pinanatili ang “mga banal” bilang tuwirang katawagan sa tekstong Griyego. Inulit ang pangalang Tabita para sa likas at hindi malabong pagtukoy sa Tagalog.
