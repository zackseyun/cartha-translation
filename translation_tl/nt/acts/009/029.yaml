  text: ἐλάλει τε καὶ συνεζήτει πρὸς τοὺς Ἑλληνιστάς· οἱ δὲ ἐπεχείρουν ⸂ἀνελεῖν αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/029.yaml
  text: And he was speaking and debating with the Hellenists[a], but they were attempting to kill him.
translation:
  language: tl
  text: Patuloy siyang nagsasalita at nakikipagtalo sa mga Helenista[a], ngunit sinisikap nilang patayin siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Judiong nagsasalita ng Griyego.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλει
  choice: Patuloy siyang nagsasalita
  rationale: Ipinahihiwatig ng imperfect na ang pagsasalita ay nagpapatuloy o nauulit sa salaysay; likas sa Tagalog ang pariralang ito.
- source_word: τε καὶ
  choice: at
  rationale: Likas na pinag-uugnay ng “at” ang dalawang magkaugnay na kilos nang hindi pinabibigat ang pangungusap.
- source_word: συνεζήτει
  choice: nakikipagtalo
  rationale: Ipinakikita ng pandiwa ang masiglang pakikipagtalastasan o pakikipagtalo, hindi lamang neutral na pag-uusap, at angkop ito sa sumunod na pagkapoot.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: sa mga Helenista
  rationale: Sa pandiwa ng pakikipagtalo, ipinahihiwatig ng πρός ang pakikipag-ugnayan sa kausap; sapat na itong naipapahayag ng “nakikipagtalo sa” sa natural na Tagalog.
- source_word: Ἑλληνιστάς
  choice: mga Helenista
  rationale: Pinananatili ng transliteradong katawagan ang tiyak na pangkat panlipunan at pangwikang tinutukoy sa Mga Gawa; ipinaliliwanag sa talababa na sila ay mga Judiong nagsasalita ng Griyego.
- source_word: οἱ δὲ
  choice: ngunit ... sila
  rationale: Malinaw na ipinahihiwatig ng “ngunit” ang salungat na tugon nila sa ginagawa ni Saulo.
- source_word: ἐπεχείρουν
  choice: tinangka
  rationale: Malinaw at dignified ang “tinangka” para sa pagsisimula o pagsisikap na gawin ang isang bagay. Bagaman imperfect ang anyo, hindi kailangang piliting gawing progresibo sa Tagalog dahil natural na naipahihiwatig ng konteksto ang kanilang pagsisikap.
- source_word: ἀνελεῖν αὐτόν
  choice: patayin siya
  rationale: Tuwirang kahulugan dito ng ἀναιρέω ang pagpatay; ito ang pinakamalinaw at pinakanatural na modernong Tagalog.
theological_decisions:
- issue: Pagkakakilanlan ng Ἑλληνιστάς
  choice: mga Helenista, na ipinaliliwanag bilang mga Judiong nagsasalita ng Griyego
  alternative: mga Griyego; mga taong nagsasalita ng Griyego
  rationale: Sa Mga Gawa, ang Ἑλληνισταί ay katawagan sa isang kinikilalang pangkat na pangwika at panlipunan, lalo na sa kaibahan sa mga Hebreo sa Gawa 6:1. Iniiwasan ng saling ito ang pagpapalagay na mga Hentil sa pangkalahatan ang kausap ni Saulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Helenista” upang mapanatili ang tiyak na katawagan sa teksto, kasama ang paliwanag sa talababa para sa karaniwang mambabasa.
