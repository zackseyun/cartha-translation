  text: καὶ πεσὼν ἐπὶ τὴν γῆν ἤκουσεν φωνὴν λέγουσαν αὐτῷ Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/004.yaml
  text: And falling to the ground, he heard a voice saying to him, “Saul, Saul, why are you persecuting me?”
translation:
  language: tl
  text: At nang bumagsak siya sa lupa, nakarinig siya ng isang tinig na nagsasabi sa kanya, “Saulo, Saulo, bakit mo ako inuusig?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν ἐπὶ τὴν γῆν
  choice: nang siya'y bumagsak sa lupa
  rationale: Isinasalin ang aorist participle bilang likas na sugnay na pangyayari sa Tagalog. Ang “sa lupa” ay angkop sa kilos na pagbagsak patungo sa ibabaw ng lupa.
- source_word: ἤκουσεν φωνὴν
  choice: narinig niya ang isang tinig
  rationale: Ang φωνή ay “tinig” dito, hindi lamang “tunog,” sapagkat may kasunod na malinaw na pananalita.
- source_word: λέγουσαν αὐτῷ
  choice: na nagsasabi sa kanya
  rationale: Malapit sa konstruksiyong Griyego at likas na nagpapakilala sa tuwirang sinabi.
- source_word: Σαοὺλ Σαούλ
  choice: Saulo, Saulo
  rationale: Ginagamit ang nakasanayang anyong Tagalog ng pangalan at pinananatili ang pag-uulit na nagbibigay-diin sa pagtawag.
- source_word: τί
  choice: bakit
  rationale: Sa ganitong gamit, ang τί ay nagtatanong ng dahilan at natural na isinasaling “bakit.”
- source_word: με
  choice: ako
  rationale: Tuwirang pinananatili ang panghalip upang manatili ang pagkakakilanlan ng nagsasalita sa mga inuusig ni Saulo.
- source_word: διώκεις
  choice: inuusig mo
  rationale: Ang aspektong imperpektibo ng “inuusig” ay angkop sa kasalukuyan at nagpapatuloy na pagkilos; mas tiyak ito sa konteksto kaysa “hinahabol.”
theological_decisions:
- issue: Pagkakakilanlan ng nagsasalita sa mga taong sinasalakay ni Saulo
  choice: Pinanatili ang tuwirang “ako” nang walang paliwanag na dagdag.
  alternative: “ang aking mga tagasunod” o “ang aking mga tao”
  rationale: Ang mismong talata ay nagsasaad na ang nagsasalita ang inuusig. Dapat panatilihin ang teolohikal na bigat at tensiyong ito sa halip na ipaliwanag ito sa salin.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinili ang “tinig” at “inuusig” bilang malinaw at karaniwang bokabularyong biblikal nang hindi nagiging lipas o labis na pormal.
