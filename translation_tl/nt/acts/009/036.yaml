  verdict: revise
  source_fidelity: Tumpak ang tagpuan, pagkakakilanlan kay Tabita bilang babaeng alagad, at ang pagbibigay ng katumbas na pangalang Dorcas. Gayunman, ang “Lagi siyang gumagawa” ay pangunahing nagsasaad lamang ng nakagawiang pagkilos at hindi sapat na naihahayag ang πλήρης (“puspos/puno ng”); hindi rin nito kasinglinaw na naikakabit ang patuloy na paggawa sa kapwa “mabubuting gawa” at “pagkakawanggawa.”
  naturalness: Natural ang karamihan ng draft, ngunit bahagyang mabigat ang “kapag isinalin, ang tawag sa kanya ay Dorcas.” Mas maayos sa modernong Tagalog ang isang sugnay na tuwirang nag-uugnay sa pagsasalin at sa pangalang Dorcas. Ang “puspos” ay dignified ngunit nauunawaang modernong rehistro sa ganitong paglalarawang biblikal.
  terminology: Ang “alagad na babae” ay wastong nagpapakita ng pambabaeng μαθήτρια. Ang “pagkakawanggawa” ay angkop para sa ἐλεημοσύναι, sapagkat hindi nito ikinukulong ang diwa sa pagbibigay lamang ng limos. Pinanatili ang Tabita at Dorcas bilang mga pangalan.
  issues:
