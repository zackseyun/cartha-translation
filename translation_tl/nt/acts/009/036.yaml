  text: Ἐν Ἰόππῃ δέ τις ἦν μαθήτρια ὀνόματι Ταβιθά, ἣ διερμηνευομένη λέγεται Δορκάς· αὕτη ἦν πλήρης ⸂ἔργων ἀγαθῶν⸃ καὶ ἐλεημοσυνῶν ὧν ἐποίει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/036.yaml
  text: In Joppa there was a disciple named Tabitha[a], which translated is called Dorcas. She was full of good works and acts of mercy that she was doing.
translation:
  language: tl
  text: Sa Joppa ay may isang alagad na babae na nagngangalang Tabita[a], na kapag isinalin ay tinatawag na Dorcas. Puspos siya ng mabubuting gawa at pagkakawanggawang patuloy niyang ginagawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Dorcas ay ang katumbas na pangalang Griyego ng Tabita; kapuwa nangangahulugang “gasela.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθήτρια
  choice: alagad na babae
  rationale: Ang pangngalan ay tahasang pambabae at natatangi sa Bagong Tipan. Nililinaw ng salin na si Tabita ay isang babaeng alagad, sa natural na modernong Tagalog.
- source_word: ὀνόματι Ταβιθά
  choice: na nagngangalang Tabita
  rationale: Natural na katumbas sa Tagalog ng idyomang nagpapakilala sa pangalan ng isang tao.
- source_word: Ἐν Ἰόππῃ δέ
  choice: Sa Joppa ay
  rationale: Inililipat nang natural ang tagpuan; hindi na dinaragdagan ng tahasang temporal na panandang wala sa Griyego. Ang banayad na pagpapatuloy ng δέ ay naipahihiwatig ng daloy ng salaysay.
- source_word: διερμηνευομένη λέγεται Δορκάς
  choice: kapag isinalin, ang tawag sa kanya ay Dorcas
  rationale: Pinananatili kapwa ang ideya ng pagsasalin at ang gamit ng katumbas na pangalang Griyego, sa halip na palitan lamang ito ng kahulugang 'gasela.'
- source_word: πλήρης ἔργων ἀγαθῶν καὶ ἐλεημοσυνῶν ὧν ἐποίει
  choice: Lagi siyang gumagawa ng mabubuting gawa at nagkakawanggawa
  rationale: Ipinahahayag sa likas na Tagalog ang kasaganaan at nakaugaliang pagpapatuloy na ipinahihiwatig ng πλήρης at ng imperfect na ἐποίει. Ang 'nagkakawanggawa' ay tumutukoy sa mahabaging pagtulong o pagbibigay sa nangangailangan.
theological_decisions:
- issue: Tahasan bang ipakita ang pambabaeng anyo ng μαθήτρια
  choice: alagad na babae
  alternative: alagad
  rationale: Bagaman makikilala ang kasarian sa pangalan at mga panghalip, tahasang pambabae ang bihirang salitang Griyego. Ang 'alagad na babae' ay tumpak at malinaw nang hindi nagdaragdag ng katayuang hindi sinasabi ng teksto.
- issue: Saklaw ng ἐλεημοσυνῶν
  choice: nagkakawanggawa
  alternative: gumagawa ng mga gawa ng awa; nagbibigay ng limos
  rationale: Ang salita ay maaaring tumukoy sa paglilimos o mahabaging pagkakawanggawa. Pinananatili ng 'nagkakawanggawa' ang praktikal na pagtulong sa nangangailangan nang hindi ito nililimitahan sa salapi lamang.
- issue: Ugnayan ng πλήρης at ὧν ἐποίει
  choice: Lagi siyang gumagawa
  alternative: Puspos siya ng ... na ginagawa niya
  rationale: Ang literal na anyo ay magiging mabigat at paulit-ulit sa Tagalog. Ang 'lagi' ay natural na naghahatid ng sagana at nakagawiang paggawa, habang hindi ginagawang minsanang kilos ang imperfect.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang karaniwang biblikal na 'alagad' at ang natural na 'nagkakawanggawa'; iniwasan ang mas luma o mas teknikal na 'paglilimos' bilang tanging pakahulugan.
