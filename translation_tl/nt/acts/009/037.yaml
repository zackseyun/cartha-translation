base_translation:
  language: en
  yaml_path: translation/nt/acts/009/037.yaml
  text: In those days it happened that she became sick and died. After washing her[a], they laid her in an upstairs room.
translation:
  language: tl
  text: Noong mga araw na iyon, nagkasakit siya at namatay. Matapos nila siyang hugasan, inihiga nila siya sa isang silid sa itaas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa silid sa mataas na palapag.” Ang Griyego ay tumutukoy lamang sa isang silid na nasa mataas na palapag.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις
  choice: Nang mga araw na iyon
  rationale: Likas na panimulang temporal sa salaysay. Hindi na isinatinig nang hiwalay ang pormulang ἐγένετο δὲ dahil sapat nang ipinakikita ng sugnay ang paglitaw at pag-usad ng pangyayari.
- source_word: ἀσθενήσασαν αὐτὴν ἀποθανεῖν
  choice: nagkasakit siya at namatay
  rationale: Ginagawang likas na mga pandiwang may panahunan sa Tagalog ang Griyegong participle at infinitive, habang pinananatili ang pagkakasunod ng pagkakasakit at pagkamatay.
- source_word: λούσαντες
  choice: Matapos siyang paliguan
  rationale: Ipinahahayag ang kilos na natapos bago ang pangunahing pandiwa. Sa konteksto, ang pinaliguan ay ang katawan niya matapos siyang mamatay, ngunit hindi idinaragdag sa pangunahing teksto ang salitang ‘katawan’ na wala sa Griyego.
- source_word: ἔθηκαν αὐτὴν
  choice: inihiga nila siya
  rationale: Ang ‘inihiga’ ay likas at angkop sa paglalagay ng bangkay, habang nananatiling malapit sa kahulugan ng τίθημι na ‘ilagay’ o ‘ihiga.’
- source_word: ἐν ὑπερῴῳ
  choice: sa isang silid sa itaas
  rationale: Ang ὑπερῷον ay silid sa mataas na palapag. Ang ‘isang silid sa itaas’ ay malinaw at hindi nagpapahiwatig na ito ay isang partikular o kilalang silid.
theological_decisions:
- issue: Kung ang ὑπερῴῳ ay dapat isalin sa tradisyonal na paraang maaaring magpahiwatig ng isang partikular na ‘silid sa itaas’
  choice: sa isang silid sa itaas
  alternative: sa silid sa itaas
  rationale: Walang pantukoy ang pariralang Griyego at pangunahing inilalarawan lamang nito ang lokasyon sa mataas na palapag. Pinipigilan ng napiling salin ang di-sinasadyang pag-uugnay rito sa ibang kilalang silid sa salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang likas na daloy ng salaysay at iniwasan ang arkaikong ‘nangyari nga’ o ang mas teknikal na ‘silid sa itaas na palapag.’
