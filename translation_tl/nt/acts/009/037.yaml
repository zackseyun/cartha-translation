  source_fidelity: Ang salin ay wastong naghahayag ng pagkakasunod na nagkasakit siya, namatay, hinugasan, at inilagay sa silid na nasa itaas. Gayunman, ang “Nang mga araw na iyon” ay hindi likas sa gamit na ito; “Noong mga araw na iyon” ang karaniwang katumbas. Ang “Matapos nila siyang hugasan” ay mas tuwirang tumutugon sa λούσαντες kaysa “Matapos siyang paliguan,” na maaaring magpahiwatig ng karaniwang pagpapaligo.
  naturalness: Malinaw at marangal ang pangungusap, ngunit ang pagbabagong “Noong” at ang mas payak na “hugasan” ay higit na likas sa makabagong Filipino. Inilipat din ang talababa upang malinaw na nakakabit ito sa “silid sa itaas.”
  terminology: Ang “silid sa itaas” ay angkop para sa ὑπερῷον at hindi nagpapahiwatig ng isang partikular na kilalang silid. Ang “inihiga” ay katanggap-tanggap sa konteksto ng paglalagay ng yumao.
