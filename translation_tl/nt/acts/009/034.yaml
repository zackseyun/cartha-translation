id: ACT.9.34
reference: Acts 9:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Πέτρος· Αἰνέα, ἰᾶταί σε Ἰησοῦς ⸀Χριστός· ἀνάστηθι καὶ στρῶσον σεαυτῷ· καὶ εὐθέως ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/034.yaml
  text: And Peter said to him[a], “Aeneas, Jesus the Messiah heals you[b]. Get up and make your bed.” And immediately he got up.
translation:
  language: tl
  text: At sinabi sa kanya ni Pedro, “Eneas, pinagagaling ka ng Mesiyas na si Jesus.[a] Bumangon ka at ayusin mo ang sarili mong higaan.[b]” At agad siyang bumangon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Pinagagaling ka ni Jesucristo.” Ang Χριστός ay maaaring isalin bilang “Cristo,” ngunit isinalin dito bilang “Mesiyas” upang maipakita ang tungkulin nito bilang titulo.
    reason: alternative_reading
  - marker: b
    text: O “ihanda mo ang iyong higaan para sa iyong sarili.”
    reason: alternative_reading
lexical_decisions:
- source_word: Αἰνέα
  choice: Eneas
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang Griyego na Αἰνέας.
- source_word: ἰᾶταί
  choice: pinagagaling
  rationale: Ang kasalukuyang panahunang ἰᾶταί ay isang tuwirang pahayag na nagsasakatuparan o nagpapahayag ng pagpapagaling. Pinananatili ng “pinagagaling” ang anyong pangkasalukuyan nang hindi ito tahasang ginagawang natapos na kilos.
- source_word: Ἰησοῦς Χριστός
  choice: ang Mesiyas na si Jesus
  rationale: Likas sa modernong Tagalog ang ayos na ito at malinaw na ipinakikilalang titulo ang Χριστός, hindi apelyido ni Jesus.
- source_word: ἀνάστηθι
  choice: Bumangon ka
  rationale: Natural at tuwirang utos ito sa isang taong nakahiga.
- source_word: στρῶσον σεαυτῷ
  choice: ayusin mo ang sarili mong higaan
  rationale: Ang στρώννυμι ay tumutukoy sa paglalatag o pag-aayos ng higaan. Ipinahahayag ng “sarili mong” ang σεαυτῷ at ang panunumbalik ng kakayahan ni Eneas na asikasuhin ang kanyang higaan.
- source_word: εὐθέως
  choice: agad
  rationale: Maikli at natural na katumbas na nagpapanatili sa diin sa kagyat na pagtugon.
- source_word: ἀνέστη
  choice: bumangon siya
  rationale: Tumutugma ito sa naunang utos at malinaw na isinasalaysay ang agarang resulta.
theological_decisions:
- issue: Paglalarawan sa Χριστός sa pahayag ng pagpapagaling
  choice: ang Mesiyas na si Jesus
  alternative: Jesucristo
  rationale: Sa kontekstong ito, maituturing na titulo ang Χριστός. Ipinakikita ng saling “Mesiyas” ang kahulugan nito, samantalang ang “Jesucristo” ay lehitimong tradisyonal na anyo ngunit maaaring mabasa na parang nakapirming pangalan.
- issue: Aspekto ng ἰᾶταί
  choice: pinagagaling ka
  alternative: pinagaling ka na
  rationale: Kasalukuyang anyo ang pandiwang Griyego. Hindi tahasang nilulutas ng salin kung ang diin ay nasa mismong sandali ng pagpapagaling o sa resultang tiyak nang natamo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang “higaan” sa halip na “kama” dahil maaari itong tumukoy sa anumang sapin o tulugan at hindi ipinapalagay na may balangkas ang higaan ni Eneas.
