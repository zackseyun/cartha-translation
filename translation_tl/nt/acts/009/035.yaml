id: ACT.9.35
reference: Acts 9:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶδαν αὐτὸν πάντες οἱ κατοικοῦντες Λύδδα καὶ τὸν ⸀Σαρῶνα, οἵτινες ἐπέστρεψαν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/035.yaml
  text: And all those living in Lydda and Sharon saw him[b][a], and they turned to the Lord.
translation:
  language: tl
  text: Nakita siya ng lahat ng naninirahan sa Lida at Saron[a], at bumaling sila sa Panginoon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kapatagan ng Saron.”
    reason: lexical_alternative
  - marker: b
    text: Ang “bumaling sa Panginoon” ay maaari ring isaling “nagbalik-loob sa Panginoon” o “nagbalik sa Panginoon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδαν
  choice: Nakita
  rationale: Ang aorist ng ὁράω ay payak na tumutukoy sa pagkakita nila kay Eneas matapos siyang mapagaling.
- source_word: πάντες οἱ κατοικοῦντες
  choice: lahat ng naninirahan
  rationale: Pinananatili nito ang diwa ng substantival participle at likas itong pakinggan sa makabagong Tagalog.
- source_word: Λύδδα
  choice: Lida
  rationale: Karaniwang anyong Tagalog ng pangalan ng lugar na Lydda.
- source_word: τὸν Σαρῶνα
  choice: Saron
  rationale: Tumutukoy ito sa rehiyon o kapatagan ng Saron; hindi kailangang tumbasan nang mekanikal ang artikulong Griyego.
- source_word: οἵτινες
  choice: at ... sila
  rationale: Ipinahahayag nito nang malinaw at natural ang kasunod na ginawa ng mga taong kababanggit lamang.
- source_word: ἐπέστρεψαν ἐπὶ τὸν κύριον
  choice: bumaling ... sa Panginoon
  rationale: Pinananatili ng 'bumaling' ang larawan ng pagharap sa Panginoon nang hindi ipinapalagay na dati na silang sumampalataya o gumagamit ng higit na teknikal na terminong teolohikal.
- source_word: κύριον
  choice: Panginoon
  rationale: Ito ang likas at kinikilalang salin ng titulong κύριος; hindi dinaragdagan ng pangalang 'Jesus' na wala sa mismong talata.
theological_decisions:
- issue: Tinutukoy ng “Panginoon”
  choice: Panginoon
  alternative: Panginoong Jesus
  rationale: Malinaw na malamang si Jesus ang tinutukoy ayon sa konteksto, ngunit κύριον lamang ang nasa tekstong Griyego; kaya pinananatili ang mismong titulo.
- issue: Diwa ng ἐπέστρεψαν
  choice: bumaling
  alternative: nagbalik-loob; nahikayat na sumampalataya; nagbalik
  rationale: Ipinahihiwatig ng pandiwa ang pagtugon sa Panginoon sa pananampalataya at pagsisisi, ngunit hindi nito sapilitang ipinapalagay ang dating pagtalikod gaya ng maaaring ipahiwatig ng 'nagbalik,' at hindi rin ito ginagawang teknikal na pormulang teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “naninirahan” at “bumaling” upang mapanatili ang biblikal na larawan nang hindi maging lipas o labis na teknikal.
