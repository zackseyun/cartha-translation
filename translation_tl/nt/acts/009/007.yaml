id: ACT.9.7
reference: Acts 9:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ ἄνδρες οἱ συνοδεύοντες αὐτῷ εἱστήκεισαν ἐνεοί, ἀκούοντες μὲν τῆς φωνῆς μηδένα δὲ θεωροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/007.yaml
  text: The men traveling with him stood speechless[a], hearing the voice but seeing no one.
translation:
  language: tl
  text: Ang mga lalaking kasama niya sa paglalakbay ay nakatayong hindi makapagsalita; naririnig nila ang tinig[a], ngunit wala silang nakikitang sinuman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, tunog. Ang salitang Griyego ay maaaring mangahulugang “tinig” o “tunog”; ihambing sa Gawa 22:9.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνδρες
  choice: Ang mga lalaki
  rationale: Tuwirang katumbas ng parirala; hindi na tahasang isinalin ang banayad na pang-ugnay na δέ upang maging natural ang daloy sa Filipino.
- source_word: οἱ συνοδεύοντες αὐτῷ
  choice: kasama niya sa paglalakbay
  rationale: Ipinahihiwatig ng συνοδεύω ang pagsama sa isang paglalakbay; malinaw at likas ang pariralang ito sa modernong Filipino.
- source_word: εἱστήκεισαν
  choice: nakatayo
  rationale: Ang anyong pluperfect ay may stative na diwa rito at naglalarawan sa kanilang kalagayang nakatayo, nang hindi dinaragdagan ng ideyang tahasang ‘huminto’ sila.
- source_word: ἐνεοί
  choice: hindi makapagsalita
  rationale: Mas tiyak itong naghahatid ng kawalan ng kakayahang magsalita kaysa sa ‘tahimik’ lamang, habang hindi ipinapasok sa teksto ang dahilan ng kanilang pagkabigla.
- source_word: ἀκούοντες μὲν τῆς φωνῆς
  choice: naririnig nila ang tinig[a]
  rationale: Ang φωνή ay karaniwang ‘tinig’ ngunit maaari ring ‘tunog.’ Pinili ang ‘tinig’ sa pangunahing teksto para sa malapit na leksikal na katumbas, at pinanatili sa talababa ang tunay na alternatibo.
- source_word: μηδένα δὲ θεωροῦντες
  choice: ngunit wala silang nakikitang sinuman
  rationale: Likas na Filipino ito para sa pagkakita o pagmamasid na walang taong nakikita; pinananatili ng ‘sinuman’ na tao ang tinutukoy ng μηδένα.
theological_decisions:
- issue: Ang waring tensiyon ng Gawa 9:7 at Gawa 22:9 tungkol sa narinig ng mga kasama ni Saulo
  choice: ‘tinig’ sa pangunahing teksto, na may talababa para sa ‘tunog’
  alternative: ‘tunog’ sa pangunahing teksto upang ipahiwatig na may narinig silang tunog ngunit hindi nila naunawaan ang tinig
  rationale: Saklaw ng φωνή ang parehong ‘tinig’ at ‘tunog.’ Hindi tahasang sinasabi ng talata kung naunawaan ng mga kasama ang kanilang narinig, kaya hindi ipinilit sa salin ang isang paliwanag na mag-aayos sa dalawang salaysay. Inilalantad ng talababa ang leksikal na kalabuan at hinahayaang manatili ang tensiyon.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang ‘hindi makapagsalita’ sa halip na mas kolokyal na ‘natulala’ upang hindi magdagdag ng sanhi o emosyon na hindi tahasang nasa Griyego. Ang tuldok-kuwit ay nagpapanatili sa magkakaugnay na paglalarawan sa iisang pangungusap.
