  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληροῦντο ἡμέραι ἱκαναί, συνεβουλεύσαντο οἱ Ἰουδαῖοι ἀνελεῖν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/023.yaml
  text: When many days had passed[c][b][a], the Jews conspired to kill him.
translation:
  language: tl
  text: Nang makalipas ang maraming araw,[a] nagsabwatan ang mga Judio[b] na patayin siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “nang makumpleto ang maraming araw.”'
    reason: lexical_alternative
  - marker: b
    text: Sa konteksto, tumutukoy ito sa isang partikular na pangkat ng mga Judiong sumasalungat kay Saulo, hindi sa lahat ng Judio.
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Nang
  rationale: Likas na panandang temporal sa Filipino; ipinahihiwatig ang paglipat sa susunod na pangyayari nang hindi pilit na isinasalin ang mahinang pang-ugnay na δέ.
- source_word: ἐπληροῦντο ἡμέραι ἱκαναί
  choice: makalipas ang maraming araw
  rationale: Sa panahong paksa, ang ἐπληροῦντο ay idyomatikong tumutukoy sa paglipas o pagkakumpleto ng panahon, at ang ἱκαναί ay nangangahulugang marami o may kalakihang bilang.
- source_word: συνεβουλεύσαντο
  choice: nagsabwatan
  rationale: Ipinahahayag nito ang sama-samang pagpaplano na may masamang layunin, gaya ng nililinaw ng infinitibong ἀνελεῖν.
- source_word: οἱ Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Pinananatili ang tahasang katawagang etniko-relihiyoso ng Griyego nang hindi ito pinakikitid sa 'mga pinuno,' na hindi sinasabi ng talata.
- source_word: ἀνελεῖν αὐτόν
  choice: na patayin siya
  rationale: Direkta at natural na salin ng layuning kitilin ang buhay ni Saulo; hindi dinaragdagan ng legal na kulay ang pandiwa.
theological_decisions:
- issue: Saklaw ng οἱ Ἰουδαῖοι sa salaysay na may pag-uusig
  choice: ang mga Judio
  alternative: ang mga pinunong Judio; ang mga Judeano
  rationale: Pinananatili ang anyo ng pinagmulang teksto. Nililinaw sa talababa na sa konteksto ay isang partikular na pangkat ng mga sumasalungat kay Saulo ang tinutukoy, hindi ang lahat ng Judio.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “nagsabwatan” para sa maikli at likas na pagpapahayag ng sama-samang masamang balak; iniwasan ang mas makalumang “nagsanggunian.”
