id: ACT.9.40
reference: Acts 9:40
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐκβαλὼν δὲ ἔξω πάντας ὁ Πέτρος ⸀καὶ θεὶς τὰ γόνατα προσηύξατο, καὶ ἐπιστρέψας πρὸς τὸ σῶμα εἶπεν· Ταβιθά, ἀνάστηθι. ἡ δὲ ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς, καὶ ἰδοῦσα τὸν Πέτρον ἀνεκάθισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/040.yaml
  text: But Peter put them all outside[a], knelt down and prayed, and turning toward the body said, “Tabitha, arise.” Then she opened her eyes, and when she saw Peter, she sat up.
translation:
  language: tl
  text: Ngunit pinalabas ni Pedro ang lahat. Pagkatapos, lumuhod siya at nanalangin. Humarap siya sa katawan at sinabi, “Tabita, bumangon ka.”[a] Dumilat siya, at nang makita niya si Pedro, umupo siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tumayo ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλὼν ... ἔξω πάντας
  choice: pinalabas ni Pedro ang lahat
  rationale: Likas na Filipino ito para sa pagpapalabas sa lahat ng naroon, nang hindi ipinahihiwatig ang labis na puwersang maaaring taglayin ng “itinaboy.”
- source_word: θεὶς τὰ γόνατα
  choice: lumuhod siya
  rationale: Ang idyoma ay tumutukoy sa pagluhod, dito bilang kilos bago manalangin.
- source_word: προσηύξατο
  choice: nanalangin
  rationale: Karaniwan at tuwirang katumbas ng pandiwang Griyego.
- source_word: ἐπιστρέψας πρὸς τὸ σῶμα
  choice: Humarap siya sa katawan
  rationale: Pinananatili ang pisikal na pagbaling ni Pedro patungo sa katawan; “katawan” ang tuwirang katumbas ng σῶμα at hindi nito pinatitindi ang salita bilang “bangkay.”
- source_word: Ταβιθά
  choice: Tabita
  rationale: Ginamit ang nakaugaliang makabagong baybay sa Filipino ng pangalang Tabitha.
- source_word: ἀνάστηθι
  choice: bumangon ka
  rationale: Saklaw nito ang pagbangon mula sa pagkakahiga at likas itong pakinggan sa modernong Filipino, habang nananatili ang bigat ng utos sa konteksto ng muling pagkabuhay.
- source_word: ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς
  choice: Dumilat siya
  rationale: Likas at maikli itong paraan sa Filipino upang sabihing binuksan niya ang kaniyang mga mata.
- source_word: ἰδοῦσα τὸν Πέτρον
  choice: nang makita niya si Pedro
  rationale: Ginagawang malinaw ang pagkakasunod-sunod ng mga pangyayari ayon sa gamit ng participle.
- source_word: ἀνεκάθισεν
  choice: umupo siya
  rationale: Sa konteksto, nangangahulugan itong bumangon sa pagkakahiga upang maupo; sapat at natural ang “umupo” kasunod ng pagbukas ng mga mata.
- source_word: δὲ / καί
  choice: Ngunit / Pagkatapos / at
  rationale: Ipinahahayag ng mga pang-ugnay ang pag-usad ng salaysay; iba-ibang likas na pang-ugnay sa Filipino ang ginamit ayon sa tungkulin ng bawat isa.
theological_decisions:
- issue: Wika ng utos na may kaugnayan sa muling pagkabuhay
  choice: bumangon ka
  alternative: tumayo ka
  rationale: Maaaring tumukoy ang ἀνάστηθι sa pagbangon o pagtayo. Pinili ang “bumangon ka” dahil ang babae ay nakahiga at dahil pinananatili nito ang pahiwatig ng pagpapanumbalik sa buhay nang hindi nagdaragdag ng paliwanag na wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang masyadong pormal o lipas na pananalita, ngunit pinanatili ang taimtim na himig ng tagpo. Ang marker na [a] ay inilagay agad pagkatapos ng utos na tinutukoy nito.
