id: ACT.9.42
reference: Acts 9:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: γνωστὸν δὲ ἐγένετο καθ’ ὅλης ⸀τῆς Ἰόππης, καὶ ⸂ἐπίστευσαν πολλοὶ⸃ ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/042.yaml
  text: And it became known throughout all Joppa, and many believed in the Lord.
translation:
  language: tl
  text: At nalaman ito sa buong Jope, at marami ang sumampalataya sa Panginoon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωστὸν ... ἐγένετο
  choice: nalaman ito
  rationale: Likas sa modernong Tagalog ang impersonal na “nalaman ito” at pinananatili nito ang diwa ng pangyayaring naging hayag ang naunang himala nang hindi tumutukoy ng gumawa.
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay; natural at hindi mapanghimasok ang “At.”
- source_word: καθ’ ὅλης τῆς Ἰόππης
  choice: sa buong Jope
  rationale: Ipinahahayag ng κατά na may genitive ang paglaganap sa saklaw ng lugar, habang pinananatili ng “buong” ang diin ng ὅλης.
- source_word: Ἰόππης
  choice: Jope
  rationale: Ginamit ang nakasanayang anyong Tagalog ng pangalang Joppa sa Bagong Tipan.
- source_word: ἐπίστευσαν
  choice: sumampalataya
  rationale: Sa kontekstong ito, natural na ipinahahayag ng “sumampalataya” ang pagdating sa pananampalataya na nakapaloob sa aorist na pandiwa.
- source_word: πολλοὶ
  choice: marami
  rationale: Sapat at natural ang substantibong “marami,” nang hindi na nagdaragdag ng salitang wala sa Griyego.
- source_word: ἐπὶ τὸν κύριον
  choice: sa Panginoon
  rationale: Kasama ng πιστεύω, tinutukoy ng ἐπί at accusative ang pinagtutuunan ng pagtitiwala; ang “sumampalataya sa Panginoon” ang natural na katumbas sa Tagalog.
- source_word: κύριον
  choice: Panginoon
  rationale: Pinananatili ng “Panginoon” ang kapuwa marangal at teolohikal na bigat ng titulong κύριος sa Mga Gawa.
theological_decisions:
- issue: Pagpapahayag sa πιστεύω + ἐπὶ τὸν κύριον
  choice: sumampalataya sa Panginoon
  alternative: naniwala sa Panginoon
  rationale: Mas malinaw na ipinahahayag ng “sumampalataya” ang personal na pagtitiwala sa Panginoon, ngunit hindi nito dinaragdagan o nililimitahan ang kahulugan sa isang mas makitid na pormulang doktrinal.
- issue: Pagpapahayag sa κύριος
  choice: Panginoon
  alternative: Guro
  rationale: Ang “Panginoon” ang karaniwang katumbas at pinananatili nito ang kristolohikal na bigat ng titulo sa konteksto ng Mga Gawa.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, malinaw, at marangal. Pinili ang “Jope” bilang nakasanayang anyong biblikal sa Tagalog at iniwasan ang hindi kailangang pagpapaliwanag sa mismong talata.
