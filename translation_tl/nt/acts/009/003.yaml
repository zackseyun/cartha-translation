  text: ἐν δὲ τῷ πορεύεσθαι ἐγένετο αὐτὸν ἐγγίζειν τῇ Δαμασκῷ, ⸂ἐξαίφνης τε αὐτὸν περιήστραψεν⸃ φῶς ⸀ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/003.yaml
  text: As he was traveling[a], it happened that he was drawing near to Damascus, and suddenly a light from heaven flashed around him.
translation:
  language: tl
  text: Habang naglalakbay siya at papalapit na sa Damasco, biglang kumislap sa paligid niya ang isang liwanag mula sa langit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa kalangitan.” Ang salitang Griyego na οὐρανός ay maaaring mangahulugang “langit” o “kalangitan,” bagaman sa kontekstong ito ay malamang na ipinahihiwatig ng “langit” ang banal na pinagmulan ng liwanag.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ τῷ πορεύεσθαι
  choice: Habang naglalakbay siya
  rationale: Ipinahahayag ng ἐν kasama ang articular infinitive ang kasabay na kilos. Likas sa makabagong Filipino ang “Habang naglalakbay siya,” at hindi na kailangang dagdagan ng tahasang panandang gaya ng “Ngayon.”
- source_word: ἐγένετο
  choice: isinanib sa daloy ng pangungusap
  rationale: Dito, ang ἐγένετο ay karaniwang panandang pasalaysay ni Lucas. Sa Filipino, magiging mabigat at di-likas ang tahasang “nangyari na”; naipahahayag ang pagdating ng pangyayari sa temporal na balangkas at sa “biglang.”
- source_word: αὐτὸν ἐγγίζειν τῇ Δαμασκῷ
  choice: papalapit na sa Damasco
  rationale: Pinananatili ng “papalapit na” ang nagpapatuloy na kilos ng present infinitive at ipinakikitang malapit na siya sa lungsod, hindi pa kinakailangang nakapasok dito.
- source_word: ἐξαίφνης τε
  choice: biglang
  rationale: Malinaw na ipinahahayag ng “biglang” ang di-inaasahang pagsiklab ng pangyayari; likas nang naiuugnay ng ayos ng pangungusap ang sugnay sa nauna.
- source_word: περιήστραψεν
  choice: kumislap sa paligid niya
  rationale: Sinasaklaw nito kapuwa ang biglaang pagliwanag at ang kahulugan ng liwanag na nakapalibot sa kanya.
- source_word: φῶς
  choice: isang liwanag
  rationale: Ang “isang” ay likas na nagpapakilala sa di-tiyak na liwanag na unang lumilitaw sa salaysay.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Sa konteksto ng pagpapahayag mula sa Diyos sa Lucas–Mga Gawa, “langit” ang malamang na kahulugan, bagaman maaari ring tumukoy ang salitang Griyego sa kalangitan.
theological_decisions:
- issue: Kahulugan ng οὐρανός sa konteksto ng isang makalangit na pagpapahayag
  choice: mula sa langit
  alternative: mula sa kalangitan
  rationale: Mas angkop sa konteksto ang “langit” bilang pinagmulan ng liwanag at pinananatili nito ang bigat na teolohikal ng salaysay nang hindi tahasang idinaragdag na mula ito sa Diyos. Itinatala sa talababa ang tunay na alternatibong leksikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang likas na ayos ng pangungusap sa halip na gayahin nang mekanikal ang Griyegong panandang pasalaysay. Inilagay ang [a] pagkatapos ng “langit,” sapagkat doon tumutukoy ang talababa.
