- from: Namangha ang lahat ng nakarinig sa kanya at sinabi nila, “Hindi ba ito ang lalaking sumalanta sa Jerusalem sa mga tumatawag sa pangalang ito[a]? At hindi ba siya naparito para rito—upang dalhin silang nakagapos sa mga punong pari?”
  to: Namangha ang lahat ng nakarinig sa kanya at patuloy nilang sinasabi, “Hindi ba ito ang lalaking sumalanta sa Jerusalem laban sa mga tumatawag sa pangalang ito[a]? At hindi ba siya naparito para sa layuning ito—upang dalhin silang nakagapos sa mga punong pari?”
  rationale: Inayos ang aspekto ng pandiwang “sinasabi” upang maipakita ang imperfect na ἔλεγον, at pinasigla ang ayos ng pangungusap para maging natural na modernong Filipino. Pinanatili ang retorikal na dalawang tanong, ang lakas ng πορθήσας sa “sumalanta,” at ang hindi tahasang “pangalang ito.”
