  terminology: Ang “sumalanta,” “mga tumatawag sa pangalang ito,” “nakagapos,” at “mga punong pari” ay angkop at tapat sa konteksto. Pinananatili ng “pangalang ito” ang hindi tahasang pagtukoy ng Griyego kay Jesus.
