id: ACT.9.21
reference: Acts 9:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες καὶ ἔλεγον· Οὐχ οὗτός ἐστιν ὁ πορθήσας ⸀ἐν Ἰερουσαλὴμ τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο, καὶ ὧδε εἰς τοῦτο ἐληλύθει ἵνα δεδεμένους αὐτοὺς ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/021.yaml
  text: And all who heard him were amazed and were saying[a], “Isn’t this the man who devastated in Jerusalem those who call on this name? And had he not come here for this purpose[b], that he might bring them bound to the chief priests?”
translation:
  language: tl
  text: Namangha ang lahat ng nakarinig sa kanya at patuloy nilang sinasabi, “Hindi ba ito ang lalaking sumalanta sa Jerusalem laban sa mga tumatawag sa pangalang ito[a]? At hindi ba siya naparito para sa layuning ito—upang dalhin silang nakagapos sa mga punong pari?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga nananawagan sa pangalang ito.” Ang “tumatawag sa pangalan” ay idyomang biblikal para sa pag-apela o pananalangin sa pangalan at para sa hayag na pagkakaugnay rito. Si Jesus ang tinutukoy sa konteksto, ngunit hindi siya tahasang pinapangalanan sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: Namangha
  rationale: Natural na Filipino para sa patuloy na matinding pagkagulat ng mga nakarinig, nang hindi dinaragdagan ang diwa ng pandiwa.
- source_word: πάντες οἱ ἀκούοντες
  choice: ang lahat ng nakarinig sa kanya
  rationale: Ginagawang malinaw ang ipinahihiwatig na layon ng pakikinig mula sa konteksto habang pinananatili ang saklaw na “lahat.”
- source_word: πορθήσας
  choice: sumalanta
  rationale: Mas matindi ito kaysa karaniwang “umusig” at ipinahihiwatig ang mapanirang paglusob, ngunit hindi nito ipinapalagay na pinatay ang lahat.
- source_word: τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο
  choice: mga tumatawag sa pangalang ito
  rationale: Pinananatili ang biblikal na idyoma ng pagtawag o pag-apela sa pangalan, pati ang hindi tahasang pagbanggit kung kaninong pangalan ito.
- source_word: εἰς τοῦτο
  choice: para rito
  rationale: Maikli at likas na pagpapahayag ng layunin sa Filipino.
- source_word: ἐληλύθει
  choice: naparito
  rationale: Ipinahihiwatig ng anyong ito na nakarating na siya roon bago ang kasalukuyang pag-uusap; natural itong katumbas ng pluperfect sa konteksto.
- source_word: δεδεμένους
  choice: nakagapos
  rationale: Pinananatili ang kalagayang bunga ng paggapos nang hindi ipinapalagay na tanikala ang tiyak na ginamit.
- source_word: ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς
  choice: dalhin ... sa mga punong pari
  rationale: Likas na Filipino at tapat sa kilos ng pagdadala sa mga awtoridad; hindi labis na tinutukoy kung ihaharap ba sila sa pormal na paglilitis.
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Angkop na katawagan sa pangkat ng mga pinunong makasaserdote, hindi sa maraming sabay-sabay na dakilang pari.
theological_decisions:
- issue: Kung tahasang tutukuyin bilang “pangalan ni Jesus” ang τὸ ὄνομα τοῦτο
  choice: Panatilihin ang “pangalang ito”
  alternative: “pangalan ni Jesus”
  rationale: Hindi tahasang binabanggit ng Griyego ang pangalang Jesus sa pariralang ito. Malinaw ang tinutukoy mula sa konteksto, kaya pinananatili ang retorikal at teolohikal na pahiwatig.
- issue: Lakas ng paglalarawan sa dating ginawa ni Saulo
  choice: Gamitin ang “sumalanta”
  alternative: “umusig” o “lumipol”
  rationale: Ang πορθέω ay mas matindi kaysa “umusig,” samantalang ang “lumipol” ay maaaring magpahiwatig ng ganap na pagpatay na hindi tahasang sinasabi ng teksto.
translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na ayos ng dalawang retorikal na tanong. Pinanatili ang biblikal na idyomang “tumatawag sa pangalang ito,” ngunit nilinaw ito sa talababa. Ang “sumalanta sa Jerusalem sa mga…” ay bahagyang pormal ngunit pinananatiling malinaw na ang pagsalanta ay ginawa sa Jerusalem laban sa mga taong tinutukoy.
