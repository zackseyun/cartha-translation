  to: At nakita niya sa isang pangitain ang isang lalaking nagngangalang Ananias na pumasok at ipinatong ang kanyang mga kamay sa kanya upang muli siyang makakita[a].
  rationale: Inayos ang ayos ng pariralang tumutukoy sa pagpapatong ng mga kamay upang malinaw na ang mga kamay ay kay Ananias. Ginawang mas tuwiran ang layuning sugnay, habang pinanatili ang kahulugang ang paningin ni Saul ay maibabalik. Napanatili ang saklaw at kawalang-doktrinal na pagpapakahulugan ng Griyego.
