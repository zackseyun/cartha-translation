  source_fidelity: 'Tumpak ang pangunahing diwa: nakita ni Saul sa pangitain si Ananias na pumapasok, nagpapatong ng mga kamay sa kanya, upang manumbalik ang kanyang paningin. Gayunman, ang "ipinatong sa kanya ang mga kamay" ay hindi malinaw na ang mga kamay ay kay Ananias, samantalang malinaw ito sa Griyego sa pamamagitan ng pakikiisa ng participle sa "isang lalaking ... Ananias."'
  naturalness: Natural sa pangkalahatan ang salin, ngunit mas malinaw at mas likas ang ayos na "ipinatong ang kanyang mga kamay sa kanya." Ang "upang muli siyang makakita" ay natural at tuwirang nagpapahayag ng layunin.
  terminology: Ang "pangitain," "lalaking nagngangalang Ananias," at "ipinatong ... ang mga kamay" ay angkop na modernong Filipino at hindi nagpapataw ng sakramental o ibang doktrinal na kahulugan.
  issues:
