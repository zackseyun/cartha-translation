  text: καὶ εἶδεν ⸂ἄνδρα ἐν ὁράματι Ἁνανίαν ὀνόματι⸃ εἰσελθόντα καὶ ἐπιθέντα αὐτῷ ⸀χεῖρας ὅπως ἀναβλέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/012.yaml
  text: and he has seen in a vision a man named Ananias coming in and laying his hands on him so that he might regain his sight[a][b].
translation:
  language: tl
  text: At nakita niya sa isang pangitain ang isang lalaking nagngangalang Ananias na pumasok at ipinatong ang kanyang mga kamay sa kanya upang muli siyang makakita[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang manumbalik ang kanyang paningin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: nakita niya
  rationale: Ang aorist na pandiwa ay tumutukoy sa pagkakitang naganap sa pangitain. Ang aspektong perpektibo ng “nakita” ay likas sa Filipino at hindi kailangang dagdagan ng panandang katumbas ng English present perfect.
- source_word: ἄνδρα
  choice: isang lalaki
  rationale: Tumutukoy ito sa isang lalaking nasa hustong gulang, na kalauna’y pinangalanang Ananias.
- source_word: ἐν ὁράματι
  choice: sa isang pangitain
  rationale: Likas at tuwirang pagpapahayag ng paraan o kalagayan kung saan niya nakita ang pangyayari.
- source_word: Ἁνανίαν ὀνόματι
  choice: nagngangalang Ananias
  rationale: Likas na makabagong Filipino para sa idyomang nagpapakilala sa tao sa pamamagitan ng pangalan.
- source_word: εἰσελθόντα
  choice: na pumasok
  rationale: Inilalarawan ng participle ang ginawa ni Ananias sa pangitain. Ang “pumasok” ay malinaw at hindi labis na nagtatakda ng sunod-sunod na kilos.
- source_word: ἐπιθέντα αὐτῷ χεῖρας
  choice: ipinatong sa kanya ang mga kamay
  rationale: Pinananatili ang pisikal na kilos at ang kinikilalang biblikal na idyoma nang hindi dinaragdagan ang kahulugang teolohikal nito.
- source_word: ὅπως
  choice: upang
  rationale: Malinaw at marangal na panandang Filipino para sa layunin.
- source_word: ἀναβλέψῃ
  choice: manumbalik ang kanyang paningin
  rationale: Sa konteksto ng paggaling mula sa pagkabulag, nangangahulugan itong muling magkaroon ng paningin, hindi lamang tumingala.
theological_decisions:
- issue: Kung bibigyan ng tiyak na sakramental o karismatikong kahulugan ang pagpapatong ng mga kamay
  choice: ipinatong sa kanya ang mga kamay
  alternative: inilagay sa kanya ang mga kamay
  rationale: Ang Griyego ay nagsasaad ng pisikal na kilos ngunit hindi tahasang ipinapaliwanag dito ang teolohikal na bisa nito. Pinananatili ng salin ang biblikal na pananalita nang hindi nagpapasok ng partikular na doktrinal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangungusap bilang pagpapatuloy sa naunang pahayag sa pamamagitan ng “At,” at iniwasan ang teknikal o denominasyonal na pananalita.
