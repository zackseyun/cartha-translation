  - severity: low
    issue: Mas idiomatiko ang direktang layuning "upang muli siyang makakita."
    rationale: Ito ay malinaw na katumbas ng ἀναβλέψῃ sa kontekstong ito at iniiwasan ang posibleng malabong taglay sa "manumbalik ang kanyang paningin."
