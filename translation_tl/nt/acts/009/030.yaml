  text: ἐπιγνόντες δὲ οἱ ἀδελφοὶ κατήγαγον αὐτὸν εἰς Καισάρειαν καὶ ἐξαπέστειλαν αὐτὸν εἰς Ταρσόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/030.yaml
  text: When the brothers learned this[a], they brought him down to Caesarea and sent him off to Tarsus.
translation:
  language: tl
  text: Nang malaman ito ng mga kapatid[a], dinala nila siya pababa sa Cesarea at ipinadala nila siya sa Tarso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kapatid na lalaki at babae.” “Mga kapatid” ang literal na nasa Griyego, ngunit sa kontekstong ito maaari itong tumukoy nang mas malawak sa pamayanan ng mga mananampalataya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: Nang malaman ito
  rationale: Ang aorist participle ay nagsasaad ng pangyayaring nagtulak sa kasunod na mga kilos. Bagaman walang tahasang layon sa Griyego, likas sa Tagalog na idagdag ang “ito,” na tumutukoy sa banta sa naunang talata.
- source_word: οἱ ἀδελφοὶ
  choice: mga kapatid
  rationale: Ang “mga kapatid” ang natural at pormal na katumbas ng pangmaramihang ἀδελφοί sa wikang ginagamit ng mga mananampalataya. Maaari itong tumukoy sa mas malawak na pamayanan ng mga sumasampalataya, kaya nilinaw iyon sa talababa.
- source_word: κατήγαγον
  choice: dinala nila siya pababa
  rationale: Pinananatili ng “pababa” ang direksiyonal na diwa ng κατάγω, na angkop sa paglalakbay patungo sa baybaying Cesarea.
- source_word: Καισάρειαν
  choice: Cesarea
  rationale: Karaniwang anyong Filipino ng pangalan ng lungsod; hindi kailangang idagdag ang makasaysayang katawagang Maritima sa pangunahing teksto.
- source_word: ἐξαπέστειλαν
  choice: pinapunta
  rationale: Natural itong nagpapahayag na ipinadala nila siya mula sa Cesarea patungo sa Tarso. Iniiwasan nito ang posibleng di-likas na “ipinadala palayo” habang pinananatili ang pasulong na galaw ng salaysay.
- source_word: Ταρσόν
  choice: Tarso
  rationale: Karaniwang anyong Filipino ng pangalan ng lungsod.
theological_decisions:
- issue: Saklaw ng ἀδελφοί sa isang posibleng halo-halong pamayanan
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae; mga kapwa mananampalataya
  rationale: Ang “mga kapatid” ay malapit sa anyo ng Griyego at sa gamit Kristiyano sa Tagalog, ngunit maaari ring saklawin ang buong pamayanan ng mga mananampalataya. Pinananatili ng talababa ang posibilidad na iyon nang hindi nilulutas nang lampas sa ebidensiya ang kasarian ng mga tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Nang malaman ito” para sa likas na daloy ng salaysay, at pinanatili ang direksiyonal na “pababa.”
