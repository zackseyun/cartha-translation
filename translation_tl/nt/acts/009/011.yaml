revisions:
- from: Sinabi sa kanya ng Panginoon, “Tumindig ka at pumunta sa lansangang tinatawag na Matuwid. Sa bahay ni Judas, hanapin mo si Saulo na taga-Tarso,[a] sapagkat nananalangin siya ngayon.”
  to: Sinabi sa kanya ng Panginoon, “Tumindig ka at pumunta sa lansangang tinatawag na Tuwid. Sa bahay ni Judas, hanapin mo si Saulo na taga-Tarso,[a] sapagkat, narito, nananalangin siya ngayon.”
  rationale: Pinalitan ang “Matuwid” ng “Tuwid” upang maging mas malinaw na pangalan ng lansangan sa modernong Filipino. Idinagdag ang “narito” upang maipahayag ang ἰδού, samantalang pinananatili ang “sapagkat” para sa γάρ at ang “nananalangin siya ngayon” para sa kasalukuyang aspektong ipinahihiwatig ng προσεύχεται. Walang idinagdag na pagkakakilanlan sa “Panginoon” na wala sa mismong sugnay.
