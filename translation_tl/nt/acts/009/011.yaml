source:
  edition: SBLGNT
  text: ὁ δὲ κύριος πρὸς αὐτόν· ⸀Ἀναστὰς πορεύθητι ἐπὶ τὴν ῥύμην τὴν καλουμένην Εὐθεῖαν καὶ ζήτησον ἐν οἰκίᾳ Ἰούδα Σαῦλον ὀνόματι Ταρσέα, ἰδοὺ γὰρ προσεύχεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/011.yaml
  text: And the Lord said to him[a], “Get up and go to the street called Straight, and in the house of Judas look for a man named Saul, from Tarsus, for behold, he is praying.”
translation:
  language: tl
  text: Sinabi sa kanya ng Panginoon, “Tumindig ka at pumunta sa lansangang tinatawag na Tuwid. Sa bahay ni Judas, hanapin mo si Saulo na taga-Tarso,[a] sapagkat, narito, nananalangin siya ngayon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “si Saulo ng Tarso.” Ang salitang Griego na Ταρσέα ay nagpapakilala kay Saulo ayon sa kanyang pinagmulan sa Tarso.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang salin ng titulong κύριος sa Bagong Tipan; pinananatili nitong di-tahasang binanggit sa talata ang pagkakakilanlan ng nagsasalita.
- source_word: Ἀναστὰς πορεύθητι
  choice: Tumindig ka at pumunta
  rationale: Likas na utos sa Filipino na naghahatid sa pagkilos na ipinahihiwatig ng aorist participle at kasunod na imperative.
- source_word: ῥύμην
  choice: lansangan
  rationale: Tumutukoy sa isang daan sa loob ng lungsod; dignified at malinaw sa modernong Filipino.
- source_word: τὴν καλουμένην Εὐθεῖαν
  choice: tinatawag na Matuwid
  rationale: Pinananatili ang anyong pangalan ng lansangan at isinasalin ang kahulugan ng Εὐθεῖαν.
- source_word: ἐν οἰκίᾳ Ἰούδα
  choice: Sa bahay ni Judas
  rationale: Natural na Filipino para sa lokasyon kung saan hahanapin si Saulo.
- source_word: ζήτησον
  choice: hanapin mo
  rationale: Ang ζητέω rito ay paghanap sa isang tao; tuwiran at natural ang salin.
- source_word: Σαῦλον ὀνόματι Ταρσέα
  choice: si Saulo na taga-Tarso
  rationale: Likas na ipinahahayag sa Filipino ang pangalan at pinagmulan; ang Ταρσέα ay pang-uring tumutukoy sa taga-Tarso.
- source_word: ἰδοὺ γὰρ
  choice: sapagkat
  rationale: Malinaw na pinananatili ang nagbibigay-katwirang gamit ng γάρ; ang pansin-tawag ng ἰδού ay naihahatid nang natural sa kasalukuyang kilos sa halip na sa alanganing literal na 'masdan'.
- source_word: προσεύχεται
  choice: nananalangin siya ngayon
  rationale: Ipinahahayag ang nagpapatuloy na kilos ng present tense sa mismong panahong sinusugo si Ananias.
theological_decisions:
- issue: Tinutukoy ng κύριος
  choice: Panginoon
  alternative: Panginoong Jesus
  rationale: Bagaman ipinakikilala ng konteksto ang nagsasalita bilang si Jesus, κύριος lamang ang nasa sugnay; hindi idinaragdag sa pangunahing teksto ang pangalang wala rito.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “lansangan” at “nananalangin” para sa bahagyang pormal na himig ng salaysay, habang nananatiling madaling maunawaan.
