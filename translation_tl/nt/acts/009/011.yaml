    rationale: Bagaman maaari itong mangahulugang straight, mas tuwiran at mas natural na pangalan ng daan sa modernong Filipino ang “Tuwid,” na pinananatili ang kahulugan ng Εὐθεῖαν nang walang di-kailangang moral na kulay.
