  source_fidelity: Kailangang ipakita ang pansin-tawag ng ἰδού. Ang kasalukuyang “sapagkat nananalangin siya ngayon” ay nagpapahayag ng γάρ at ng kasalukuyang kilos ng προσεύχεται, ngunit hindi ang ἰδού. Ang “narito” ay likas na katumbas nito sa marangal na salaysay. Mas angkop ding pangalan ng lansangan ang “Tuwid” kaysa “Matuwid,” na karaniwang may malakas na konotasyong moral sa modernong Filipino.
  naturalness: Malinaw at natural ang kabuuang pangungusap. Ang “narito” ay bahagyang pormal ngunit angkop sa rehistrong pasalaysay ng talata. Ang “lansangang tinatawag na Tuwid” ay malinaw na tunog-pangalan ng kalye.
  terminology: Ang “Panginoon,” “Saulo,” “Tarso,” at “nananalangin” ay angkop at pare-pareho sa karaniwang modernong Tagalog na gamit sa Bibliya. Pinananatili ng “taga-Tarso” ang kahulugang pinagmulan ng Ταρσέα; nananatiling angkop ang alternatibong tala na “ng Tarso.”
