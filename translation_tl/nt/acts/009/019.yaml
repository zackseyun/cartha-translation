  text: And after taking food[a], he regained his strength. And he was with the disciples in Damascus for some days[c][b],
translation:
  language: tl
  text: Pagkatapos niyang kumain[a], nanumbalik ang kanyang lakas[b]. Ilang araw siyang kasama ng mga alagad sa Damasco[c].
  philosophy: optimal-equivalence
