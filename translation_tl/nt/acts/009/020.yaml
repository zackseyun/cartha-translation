source:
  edition: SBLGNT
  text: καὶ εὐθέως ἐν ταῖς συναγωγαῖς ἐκήρυσσεν τὸν ⸀Ἰησοῦν ὅτι οὗτός ἐστιν ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/020.yaml
  text: And immediately in the synagogues he began proclaiming Jesus[b][a], that he is the Son of God.
translation:
  language: tl
  text: At agad niyang ipinahayag sa mga sinagoga na si Jesus ang Anak ng Diyos[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ipinangaral niya si Jesus.” Ang pandiwang Griyego ay tumutukoy sa hayagang pagpapahayag sa madla.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Siya ay Anak ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: kaagad
  rationale: Likas at malinaw na ipinapahayag ang agarang pagkilos na tinutukoy ng pang-abay.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: sa mga sinagoga
  rationale: Tuwirang pinananatili ang lokatibong diwa at ang anyong maramihan.
- source_word: ἐκήρυσσεν
  choice: ipinahayag
  rationale: Ipinahihiwatig ang hayagang pagpapahayag sa madla; hindi ito nililimitahan sa makabagong ideya ng pormal na sermon. Ang aspektong imperpektibo ay naipauunawa sa daloy ng salaysay nang hindi dinaragdagan ng tahasang 'nagsimulang,' na hindi leksikal na nakasaad.
- source_word: τὸν Ἰησοῦν
  choice: si Jesus
  rationale: Pinananatili si Jesus bilang tuwirang layon ng pandiwa, gaya sa Griyego, sa halip na idagdag ang 'tungkol kay.'
- source_word: ὅτι οὗτός ἐστιν
  choice: na siya ang
  rationale: Natural sa Tagalog at malinaw na tumutukoy kay Jesus. Bagaman may diin ang demonstratibong οὗτός, magiging alanganin sa karaniwang Tagalog ang literal na 'ang isang ito' sa kontekstong ito.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ang Anak ng Diyos
  rationale: Tuwiran at kinikilalang salin ng pamagat na Cristolohikal, na pinananatili ang tiyak na anyo at bigat ng pahayag.
theological_decisions:
- issue: Pamagat na Cristolohikal sa pahayag ni Saulo
  choice: ang Anak ng Diyos
  alternative: Anak ng Diyos
  rationale: Pinananatili ng 'ang Anak ng Diyos' ang tiyak na artikulo at ang buong lakas ng pagkakakilanlan sa Griyego, nang walang dagdag na paliwanag na doktrinal.
- issue: Referensiya ng οὗτός
  choice: siya
  alternative: ang isang ito
  rationale: Ang 'siya' ay natural at malinaw na tumutukoy kay Jesus. Hindi nito dinaragdagan ang teksto, samantalang ang mas literal na alternatibo ay maaaring tumunog na mapanglayo o hindi likas sa modernong Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'sinagoga' bilang karaniwang terminong biblikal. Ang gitling-pahaba bago ang sugnay na nilalaman ay tumutulong linawin na ang sumusunod ay ang mensahe tungkol kay Jesus.
