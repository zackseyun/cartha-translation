  naturalness: Hindi likas ang pagbubukas na “At kaagad, sa mga sinagoga ay ...” dahil sa comma at sa hindi karaniwang ayos ng mga parirala. Mas natural at marangal ang “At agad niyang ipinahayag sa mga sinagoga na ...”. Hindi kailangan ang gitling-pahaba; sapat at mas tuwiran ang sugnay na “na si Jesus ang Anak ng Diyos.”
  terminology: Ang “sinagoga,” “Jesus,” at “ang Anak ng Diyos” ay angkop sa modernong Filipino Tagalog at pinananatili ang pagkakakilanlan at bigat ng titulong ὁ υἱὸς τοῦ θεοῦ. Ang “ipinahayag” ay angkop na hindi masyadong makitid na salin ng κηρύσσω; nililinaw ng talababa ang diwa nitong hayagang pagpapahayag sa madla.
