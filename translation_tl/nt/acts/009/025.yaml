base_translation:
  language: en
  yaml_path: translation/nt/acts/009/025.yaml
  text: But his disciples took him by night and lowered him through the wall in a large basket[a][b].
translation:
  language: tl
  text: Ngunit isang gabi, kinuha siya ng kanyang mga alagad at ibinaba sa pamamagitan ng pader[a] habang nasa isang malaking basket.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “sa isang daanan sa pader.” Literal na sinasabi ng Griyego na “sa pamamagitan ng pader,” na malamang ay tumutukoy sa isang siwang o bintana sa pader ng lungsod.
    reason: lexical_alternative
  - marker: b
    text: Dalawang magkalapit na pandiwa para sa pagpapababa ang ginamit sa Griyego (“ibinaba” at “ibinababâ”), na matingkad na naglalarawan kung paano siya pinatakas.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: kinuha
  rationale: Ipinapahayag nito ang pagkuha sa kanya ng mga alagad upang tulungan siyang makatakas, nang hindi dinaragdagan ang diwa ng teksto.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ng δέ ang banayad na pagsalungat sa naunang balak na patayin siya.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: kanyang mga alagad
  rationale: Pinananatili ang tahasang panghalip na αὐτοῦ at ang karaniwang salin ng μαθηταί.
- source_word: νυκτός
  choice: kinagabihan
  rationale: Likas na makabagong Tagalog para sa genitibong panahong nangangahulugang sa gabi; malinaw at maikli sa salaysay.
- source_word: διὰ τοῦ τείχους
  choice: pinaraan sa pader
  rationale: Ipinahihiwatig ang pagdaan sa pader nang hindi tahasang nagdaragdag ng 'butas' o 'bintana,' na wala sa Griyego.
- source_word: καθῆκαν αὐτόν
  choice: ibinaba
  rationale: Ang καθίημι rito ay tumutukoy sa pagbaba sa isang tao mula sa mataas na lugar.
- source_word: χαλάσαντες
  choice: ibinaba ... na pinaraan
  rationale: Sa natural na Tagalog, isinama ang paraan ng pagpapababa sa pangungusap; ipinaliliwanag sa talababa ang dalawang magkalapit na pananalita sa Griyego.
- source_word: ἐν σπυρίδι
  choice: sa isang malaking basket
  rationale: Ang σπυρίς ay malaking uri ng basket, sapat upang mailulan ang isang tao.
theological_decisions: []
