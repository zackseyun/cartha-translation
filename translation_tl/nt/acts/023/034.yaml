  yaml_path: translation/nt/acts/023/034.yaml
  text: After reading it and asking what province he was from[a], and learning that he was from Cilicia,
translation:
  language: tl
  text: Matapos basahin ng gobernador ang liham at itanong kung saang lalawigan nagmula si Pablo, nalaman niyang taga-Cilicia si Pablo,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναγνοὺς
  choice: Matapos basahin ng gobernador ang liham
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa pagtatanong. Ipinahiwatig ng konteksto na ang bumasa ay ang gobernador at liham ang binasa; nilinaw ang mga ito upang maging natural at madaling maunawaan sa Tagalog.
- source_word: δὲ
  choice: —
  rationale: Mahinang pang-ugnay ito sa salaysay at hindi kailangang tumbasan nang hiwalay; naipahihiwatig na ng maayos na daloy ng pangungusap ang tungkulin nito.
- source_word: καὶ
  choice: —
  rationale: Ang pag-uugnay ng mga kilos ay natural na naipahayag sa Tagalog sa pamamagitan ng sunod na mga sugnay, kaya hindi kailangan ang tahasang «at» sa unang dugtungan.
- source_word: ἐπερωτήσας
  choice: itinanong niya
  rationale: Tuwirang tanong ang ipinahihiwatig ng pandiwa. Ang anyong ito ay natural sa modernong Tagalog at pinananatili ang pagkakasunod ng mga kilos.
- source_word: ἐκ ποίας ἐπαρχείας ἐστίν
  choice: kung saang lalawigan nagmula si Pablo
  rationale: Ang ἐπαρχεία ay isang lalawigang administratibo ng Roma. Ang «saang lalawigan nagmula» ay malinaw at natural; ginamit ang pangalang Pablo mula sa agarang konteksto upang maiwasan ang malabong panghalip.
- source_word: πυθόμενος
  choice: Nang malaman niya
  rationale: Ipinahihiwatig ng middle participle ang pagkakatamo ng impormasyon. Ang «Nang malaman niya» ay malinaw na nagpapakita ng kasunod na pangyayari.
- source_word: ὅτι ἀπὸ Κιλικίας
  choice: na taga-Cilicia ito
  rationale: Ang ἀπό na may pangalan ng lugar ay tumutukoy sa pinagmulan. Ang «taga-Cilicia» ay maikli at likas sa Tagalog; ang «ito» ay tumutukoy kay Pablo.
- source_word: Κιλικίας
  choice: Cilicia
  rationale: Karaniwang anyong Filipino ng pangalan ng lalawigang Romano.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Nilinaw sa pangunahing teksto ang ipinahihiwatig ng konteksto—ang gobernador, ang liham, at si Pablo—habang inilagay sa talababa ang mas pormal na ayos na malapit sa magkakasunod na participle ng Griyego. Pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na talata.
