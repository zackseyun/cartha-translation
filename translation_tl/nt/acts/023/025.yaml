  text: He wrote a letter having this form:[a]
translation:
  language: tl
  text: Sumulat siya ng isang liham na ganito ang nilalaman:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sumulat siya ng isang liham na ganito ang anyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψας
  choice: Sumulat siya
  rationale: Ang aorist participle ay ginawang pandiwang may tiyak na panauhan para sa natural na daloy ng salaysay sa Tagalog; ang tinutukoy na gumagawa ay ang kumandante sa naunang talata.
- source_word: ἐπιστολὴν
  choice: isang liham
  rationale: Ang “liham” ay malinaw, natural, at marangal na katumbas ng isang nakasulat na komunikasyon.
- source_word: ἔχουσαν
  choice: na ... ang
  rationale: Isinalin ang participle bilang sugnay na naglalarawan sa liham, isang natural na kayarian sa Tagalog na nagpapanatili sa ugnayan nito sa ἐπιστολήν.
- source_word: τύπον
  choice: anyo
  rationale: Ang τύπος dito ay tumutukoy sa anyo, balangkas, o pagkakasulat ng liham; pinananatili ng “anyo” ang lawak ng salitang Griyego nang hindi ito nililimitahan sa nilalaman lamang.
- source_word: τοῦτον
  choice: ganito
  rationale: Ang demonstratibo ay tumuturo pasulong sa tekstong susunod; natural itong ipinahahayag sa Tagalog bilang “ganito.”
