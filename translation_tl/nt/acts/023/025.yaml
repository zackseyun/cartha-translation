  verdict: revise
  source_fidelity: Ang “Sumulat siya ng isang liham” ay tapat sa γράψας ἐπιστολήν at ang pandiwang may tahasang paksa ay natural na pagsasalin ng participle sa daloy ng Tagalog na salaysay. Gayunman, sa kontekstong sinusundan agad ng mismong teksto ng liham, ang “na ganito ang anyo” ay maaaring magpahiwatig ng pisikal o biswal na hugis. Ang τύπον dito ay tumutukoy sa ipinapasok na pormula o nilalaman ng liham; mas malinaw itong maipahahayag sa pangunahing teksto bilang “na ganito ang nilalaman,” habang maaaring itala ang mas malapit na “anyo” bilang alternatibo.
  naturalness: Hindi mali ang draft, ngunit mas idiomatiko at malinaw sa modernong Filipino ang karaniwang panimulang pormulang “Sumulat siya ng isang liham na ganito ang nilalaman:” kaysa “na ganito ang anyo:”.
  terminology: Ang “liham” ay angkop at nasa wastong rehistro. Walang isyung teolohikal o pangngalan. Pinananatili ng talababa ang mas malapit na leksikal na saklaw ng τύπος nang hindi ipinipilit na pisikal ang kahulugan nito.
