revisions:
- from: Kaya ngayon, kayong kasama ng kapulungan ay magpabatid sa kumander na dalhin niya si Pablo pababa sa inyo[a], na para bang sisiyasatin ninyo nang mas mabuti ang mga bagay tungkol sa kanya[b]. Ngunit nakahanda kaming patayin siya bago pa siya makalapit[c].
  to: Kaya ngayon, kayo, kasama ang kapulungan, ay magpabatid sa kumander na dalhin niya siya pababa sa inyo[a], na para bang sisiyasatin ninyo nang mas mabuti ang mga bagay tungkol sa kanya[b]. Ngunit nakahanda kaming patayin siya bago pa siya makalapit[c].
  rationale: Nilinaw ang pakikiisa ng mga kausap at ng kapulungan sa pamamagitan ng “kayo, kasama ang kapulungan,” upang maipakita ang σὺν. Pinalitan ang idinagdag na pangalang “Pablo” ng “siya,” alinsunod sa panghalip na αὐτόν sa pinagmulan. Hindi binago ang kahulugan, antas ng wika, o mga talababa maliban sa pag-aayon ng talababa a sa panghalip sa binagong teksto.
