  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: νῦν οὖν ὑμεῖς ἐμφανίσατε τῷ χιλιάρχῳ σὺν τῷ συνεδρίῳ ⸀ὅπως ⸂καταγάγῃ αὐτὸν εἰς⸃ ὑμᾶς ὡς μέλλοντας διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ· ἡμεῖς δὲ πρὸ τοῦ ἐγγίσαι αὐτὸν ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/015.yaml
  text: Now therefore[a], you, together with the council, make it known to the commander so that he may bring him down to you, as though you were about to examine more carefully the things concerning him[c][b]. But we are ready to kill him before he comes near.
translation:
  language: tl
  text: Kaya ngayon, kayo, kasama ang kapulungan, ay magpabatid sa kumander na dalhin niya siya pababa sa inyo[a], na para bang sisiyasatin ninyo nang mas mabuti ang mga bagay tungkol sa kanya[b]. Ngunit nakahanda kaming patayin siya bago pa siya makalapit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dalhin niya siya sa harap ninyo.” Literal na may diwang pagdadala pababa ang pandiwang Griyego.
    reason: lexical_alternative
  - marker: b
    text: O “na para bang mas maingat ninyong sisiyasatin ang kanyang kaso.” Ipinahihiwatig ng pananalita ang pagkukunwaring magsasagawa pa sila ng masusing pagsisiyasat.
    reason: lexical_alternative
  - marker: c
    text: O “bago pa siya makarating.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφανίσατε
  choice: magpabatid
  rationale: Ang pandiwang pautos ay tumutukoy sa pormal na pagpapaalam sa isang awtoridad. Likas sa Filipino ang “magpabatid” at hindi nito labis na nililinaw kung pakiusap o kahilingan ang mismong mensahe.
- source_word: χιλιάρχῳ
  choice: kumander
  rationale: Tumutukoy ito sa Romanong opisyal na namumuno sa isang pangkat ng mga kawal. Malinaw at madaling maunawaan ang “kumander” nang hindi gumagamit ng teknikal na katawagang “tribuno.”
- source_word: σὺν τῷ συνεδρίῳ
  choice: kasama ng kapulungan
  rationale: Pinananatili nito ang diwa ng pakikiisa o pagsama at isinasalin ang συνέδριον bilang kilalang lupong tagapamahala nang hindi ipinapasok sa pangunahing teksto ang teknikal na pangalang “Sanhedrin.”
- source_word: καταγάγῃ αὐτὸν εἰς ὑμᾶς
  choice: dalhin niya si Pablo pababa sa inyo
  rationale: Pinananatili ng “pababa” ang direksiyonal na diwa ng κατάγω. Ginamit ang pangalang “Pablo” sa halip na sunod-sunod na panghalip upang maging malinaw at natural sa Filipino.
- source_word: ὡς μέλλοντας
  choice: na para bang
  rationale: Ipinahihiwatig nito ang ipinakikitang layunin na hindi naman totoo, ngunit hindi dinaragdagan ng tahasang salitang “pagkukunwari” ang Griyego.
- source_word: διαγινώσκειν ἀκριβέστερον
  choice: sisiyasatin ninyo nang mas mabuti
  rationale: Ang “sisiyasatin” ay angkop sa kontekstong hudisyal, at ang “nang mas mabuti” ay likas na paraan upang ipahayag ang higit na maingat o masusing pagsusuri.
- source_word: τὰ περὶ αὐτοῦ
  choice: ang mga bagay tungkol sa kanya
  rationale: Malapit ito sa malawak na pananalita ng Griyego at hindi agad nililimitahan ang tinutukoy sa teknikal na “kaso.”
- source_word: πρὸ τοῦ ἐγγίσαι αὐτὸν
  choice: bago pa siya makalapit
  rationale: 'Pinananatili nito ang temporal at pansaklaw na diwa: kikilos sila bago makarating nang malapit si Pablo.'
- source_word: ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν
  choice: nakahanda kaming patayin siya
  rationale: Direkta at malinaw na isinasalin nito ang kahandaan at ang kahulugan ng ἀναιρέω sa konteksto, nang hindi nagdaragdag ng hiwalay na moral na paghatol gaya ng “paslangin.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Pinili ang “kapulungan” at “kumander” bilang madaling maunawaang mga katawagan; pinanatili ang “pababa” upang maipakita ang direksiyonal na detalye ng Griyego. Inayos ang mga talababa ayon sa mismong pariralang tinutukoy ng bawat isa.
