id: ACT.23.18
reference: Acts 23:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν παραλαβὼν αὐτὸν ἤγαγεν πρὸς τὸν χιλίαρχον καὶ φησίν· Ὁ δέσμιος Παῦλος προσκαλεσάμενός με ἠρώτησεν τοῦτον τὸν ⸀νεανίαν ἀγαγεῖν πρὸς σέ, ἔχοντά τι λαλῆσαί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/018.yaml
  text: So he took him and brought him to the commander and said[a], “The prisoner Paul called me to him and asked me to bring this young man to you[b], because he has something to say to you.”
translation:
  language: tl
  text: Kaya isinama siya ng opisyal at dinala sa kumander[a]. Sinabi nito, “Ipinatawag ako ng bilanggong si Pablo at hiniling niyang dalhin ko sa iyo ang binatang ito, dahil may sasabihin siya sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na χιλίαρχος ay tumutukoy sa isang mataas na opisyal ng hukbong Romano; ayon sa tradisyon, “tribuno.”
    reason: cultural_note
lexical_decisions:
- source_word: παραλαβὼν αὐτὸν
  choice: isinama siya ng opisyal
  rationale: Ipinapahayag ng παραλαμβάνω ang pagsama o pagkuha sa binata upang ihatid. Ang “opisyal” ay nilinaw mula sa agarang konteksto, kung saan ang gumagawa nito ay ang senturyon, nang hindi inuulit ang mas teknikal na titulo.
- source_word: ἤγαγεν πρὸς τὸν χιλίαρχον
  choice: dinala sa kumander
  rationale: Likas sa modernong Tagalog ang “dinala” para sa kilos patungo sa tahasang destinasyon. Ang “kumander” ay malinaw at madaling maunawaang katumbas ng Romanong opisyal na χιλίαρχος.
- source_word: φησίν
  choice: Sinabi nito
  rationale: Bagaman nasa kasalukuyang panahunan ang Griyego bilang historical present, mas natural sa salaysay na Tagalog ang pangnagdaang “sinabi.”
- source_word: Ὁ δέσμιος Παῦλος
  choice: ang bilanggong si Pablo
  rationale: Ang δέσμιος ay taong nakagapos o nasa kustodiya; “bilanggo” ang malinaw at karaniwang katawagan sa kontekstong ito.
- source_word: προσκαλεσάμενός με
  choice: Ipinatawag ako
  rationale: Ipinahihiwatig ng middle participle na pinapunta ni Pablo sa kaniya ang opisyal. Maikli at natural itong naipapahayag ng “ipinatawag ako.”
- source_word: ἠρώτησεν ... ἀγαγεῖν
  choice: hiniling niyang dalhin ko
  rationale: Ang ἐρωτάω rito ay isang pakiusap, hindi pagtatanong; kaya “hiniling” ang angkop na magalang ngunit tuwirang salin.
- source_word: τοῦτον τὸν νεανίαν
  choice: ang binatang ito
  rationale: Ang νεανίας ay isang batang lalaki o kabataang lalaki. Dignified at natural sa Tagalog ang “binata” sa kontekstong ito.
- source_word: ἔχοντά τι λαλῆσαί σοι
  choice: dahil may sasabihin siya sa iyo
  rationale: Ang participial phrase ay naglalarawan sa binata at nagpapaliwanag sa dahilan ng paghiling. Natural sa Tagalog ang “may sasabihin siya sa iyo,” habang ang “dahil” ay nagpapakita ng paliwanag na likas sa konteksto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, maayos, at marangal. Ginamit ang “binata” at “kumander” bilang mga salitang madaling maunawaan, habang inilagay sa talababa ang historikal na detalye ng ranggong Romano.
