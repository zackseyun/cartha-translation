id: ACT.23.33
reference: Acts 23:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἵτινες εἰσελθόντες εἰς τὴν Καισάρειαν καὶ ἀναδόντες τὴν ἐπιστολὴν τῷ ἡγεμόνι παρέστησαν καὶ τὸν Παῦλον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/033.yaml
  text: When they entered Caesarea and delivered the letter to the governor[b][a], they also presented Paul to him.
translation:
  language: tl
  text: Pagpasok nila sa Cesarea, ibinigay nila sa gobernador ang liham at iniharap din sa kanya si Pablo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵτινες
  choice: nila
  rationale: Tumutukoy ito sa mga kawal na naghatid mula sa naunang talata. Likas sa Tagalog na ipahayag ang simuno sa panghalip na nasa pandiwa at sa kasunod na sugnay.
- source_word: εἰσελθόντες
  choice: Pagpasok
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa mga pangunahing pandiwa; malinaw at natural itong naihahayag sa sugnay na “Pagpasok nila.”
- source_word: Καισάρειαν
  choice: Cesarea
  rationale: Ito ang karaniwang anyong Filipino ng pangalan ng lungsod; hindi kailangang idagdag sa pangunahing teksto ang heograpikong paglilinaw na Maritima.
- source_word: ἀναδόντες
  choice: ibinigay
  rationale: Sa konteksto, opisyal na iniabot o ipinagkatiwala ang liham sa gobernador. Ang “ibinigay” ay tuwiran at natural nang hindi nagdaragdag ng paraang hindi tahasang sinabi sa Griyego.
- source_word: ἐπιστολήν
  choice: liham
  rationale: Karaniwan at angkop na salin para sa isang nakasulat na komunikasyon, kabilang ang opisyal na liham.
- source_word: ἡγεμόνι
  choice: gobernador
  rationale: Tumpak at madaling maunawaang tawag sa Romanong opisyal ng lalawigan sa kontekstong ito.
- source_word: παρέστησαν
  choice: iniharap
  rationale: Sa legal at opisyal na tagpo, ipinahihiwatig ng pandiwa ang pagdadala at paghaharap ng isang tao sa isang may kapangyarihan.
- source_word: καὶ
  choice: din
  rationale: 'Ang ikalawang καί ay nagdaragdag ng isa pang ginawa ng mga tagapaghatid: bukod sa pagbibigay ng liham, iniharap din nila si Pablo.'
- source_word: Παῦλον
  choice: Pablo
  rationale: Ito ang nakaugaliang anyong Filipino ng pangalang Παῦλος.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Ang panghalip ay tumutukoy sa gobernador at natural na kaakibat ng pandiwang “iniharap.”
