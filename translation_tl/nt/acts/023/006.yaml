id: ACT.23.6
reference: Acts 23:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Γνοὺς δὲ ὁ Παῦλος ὅτι τὸ ἓν μέρος ἐστὶν Σαδδουκαίων τὸ δὲ ἕτερον Φαρισαίων ⸀ἔκραζεν ἐν τῷ συνεδρίῳ· Ἄνδρες ἀδελφοί, ἐγὼ Φαρισαῖός εἰμι, υἱὸς ⸀Φαρισαίων· περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν ⸀ἐγὼ κρίνομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/006.yaml
  text: But Paul[a], knowing that one part were Sadducees and the other Pharisees, cried out in the council, “Men, brothers, I am a Pharisee, a son of Pharisees[c][b]. It is concerning the hope and resurrection of the dead that I am being judged.”
translation:
  language: tl
  text: Ngunit nang malaman ni Pablo na ang isang pangkat ay mga Saduceo at ang isa naman ay mga Pariseo, sumigaw siya sa kapulungan[a], “Mga kapatid, ako’y Pariseo, anak ng mga Pariseo[b]. Tungkol sa pag-asa at muling pagkabuhay ng mga patay ako’y nililitis[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa Sanhedrin.” Ang salitang Griyego ay maaaring tumukoy nang pantangi sa mataas na konseho ng mga Judio.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawain na “anak ng mga magulang na Pariseo” o “inapo ng mga Pariseo.”
    reason: alternative_reading
  - marker: c
    text: O “Nililitis ako tungkol sa pag-asa sa muling pagkabuhay ng mga patay.”
    reason: alternative_reading
lexical_decisions:
- source_word: Γνοὺς δὲ ὁ Παῦλος
  choice: Ngunit nang malaman ni Pablo
  rationale: Likas na ipinahahayag sa Tagalog ang pangyayaring ipinakikilala ng aorist participle, habang pinananatili ng “ngunit” ang pang-ugnay na δέ.
- source_word: τὸ ἓν μέρος ... τὸ δὲ ἕτερον
  choice: ang isang pangkat ... ang isa naman
  rationale: Sa konteksto, ang μέρος ay tumutukoy sa dalawang pangkat sa loob ng kapulungan; mas natural sa modernong Tagalog ang “pangkat” kaysa literal na “bahagi.”
- source_word: Σαδδουκαίων / Φαρισαίων
  choice: mga Saduceo / mga Pariseo
  rationale: Karaniwan at madaling makilalang anyong Filipino ng mga pangalan ng dalawang pangkat na Judio.
- source_word: ἔκραζεν
  choice: sumigaw
  rationale: Pinananatili ang diwa ng malakas at hayagang pagsasalita nang hindi nagiging labis na pormal.
- source_word: ἐν τῷ συνεδρίῳ
  choice: sa harap ng kapulungan
  rationale: Ipinahihiwatig ang pagsasalita sa konsehong nakakatipon; inilalagay sa talababa ang mas tiyak na katawagang “Sanhedrin.”
- source_word: Ἄνδρες ἀδελφοί
  choice: Mga kapatid
  rationale: Ang “Mga kapatid” ang natural at marangal na panawagan sa modernong Tagalog para sa mga lalaking kausap; hindi kailangang ulitin ang literal na ἄνδρες bilang “mga lalaki,” na magiging pilit sa Filipino.
- source_word: Φαρισαῖός εἰμι
  choice: ako ay Pariseo
  rationale: Tuwirang pinananatili ang pangkasalukuyang pagpapakilala ni Pablo sa sarili.
- source_word: υἱὸς Φαρισαίων
  choice: anak ng mga Pariseo
  rationale: Pinananatili ang maramihang anyo at idyomang pampamilya ng Griyego nang hindi nililimitahan kung ito ay tumutukoy sa mga magulang o mas malawak na angkan.
- source_word: περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν
  choice: Dahil sa pag-asa at muling pagkabuhay ng mga patay
  rationale: Pinananatili ang koordinasyon ng “pag-asa” at “muling pagkabuhay” sa Griyego at ang mga ito bilang usaping dahilan ng paglilitis.
- source_word: κρίνομαι
  choice: ako nililitis
  rationale: Natural na katumbas sa kontekstong hudisyal at malinaw na nagsasaad ng kasalukuyang paglilitis kay Pablo.
theological_decisions:
- issue: Kahulugan ng υἱὸς Φαρισαίων
  choice: anak ng mga Pariseo
  alternative: anak ng mga magulang na Pariseo; inapo ng mga Pariseo
  rationale: Hindi tiyak sa parirala kung tuwirang magulang, angkan, o tradisyong pampangkat ang tinutukoy; pinananatili ng pangunahing salin ang idyoma at inilalahad sa talababa ang saklaw nito.
- issue: Ugnayan ng “pag-asa” at “muling pagkabuhay”
  choice: pag-asa at muling pagkabuhay ng mga patay
  alternative: pag-asa sa muling pagkabuhay ng mga patay
  rationale: Pinag-uugnay ng καί ang dalawang pangngalan, ngunit maaaring maunawaan ang pag-asa bilang nakatuon sa pagkabuhay na muli. Hindi pinapawi ng pangunahing teksto ang gramatikal na tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “kapulungan” sa pangunahing teksto upang maging malinaw sa karaniwang mambabasa, habang inilagay ang teknikal na “Sanhedrin” sa talababa. Iningatan ang ambiguwidad sa pinagmulan ni Pablo bilang Pariseo at sa ugnayan ng pag-asa at muling pagkabuhay.
