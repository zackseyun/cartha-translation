  source_fidelity: Kailangang itama ang “sa harap ng kapulungan,” sapagkat ang ἐν τῷ συνεδρίῳ ay nagsasaad na nagsalita si Pablo sa/sa loob ng kapulungan o konseho, hindi sa harap nito. Ang “Tungkol sa” ay mas tuwirang tumutumbas sa περί (“hinggil sa/tungkol sa”) kaysa “Dahil sa,” bagaman parehong posible sa konteksto ng paglilitis.
  naturalness: Natural at marangal sa modernong Filipino Tagalog ang “sa kapulungan,” “Mga kapatid,” at “ako’y nililitis.” Ang “Mga kapatid” ay isang likas na katumbas ng nakaugaliang panawagang Ἄνδρες ἀδελφοί; ang sapilitang “mga lalaki” ay hindi natural sa ganitong pormal na pananalita.
  terminology: Ang “Saduceo,” “Pariseo,” “Sanhedrin,” at “muling pagkabuhay” ay angkop at malinaw. Pinananatili ng “anak ng mga Pariseo” ang hindi tiyak na saklaw ng υἱὸς Φαρισαίων, at pinananatili ng “pag-asa at muling pagkabuhay ng mga patay” ang koordinasyon sa Griyego.
