revisions:
- from: Ngunit nang malaman ni Pablo na ang isang pangkat ay mga Saduceo at ang isa naman ay mga Pariseo, sumigaw siya sa harap ng kapulungan[a], “Mga kapatid, ako ay Pariseo, anak ng mga Pariseo[b]. Dahil sa pag-asa at muling pagkabuhay ng mga patay kaya ako nililitis[c].”
  to: Ngunit nang malaman ni Pablo na ang isang pangkat ay mga Saduceo at ang isa naman ay mga Pariseo, sumigaw siya sa kapulungan[a], “Mga kapatid, ako’y Pariseo, anak ng mga Pariseo[b]. Tungkol sa pag-asa at muling pagkabuhay ng mga patay ako’y nililitis[c].”
  rationale: Pinalitan ang “sa harap ng kapulungan” ng “sa kapulungan” upang maipahayag ang ἐν nang walang maling pahiwatig na nasa labas si Pablo. Pinalitan ang “Dahil sa” ng “Tungkol sa” upang mas tumpak na katawanin ang περί at mapanatili ang pahayag bilang paksa ng paglilitis. Hindi binago ang mga ambiguwidad tungkol sa “anak ng mga Pariseo” at sa ugnayan ng pag-asa at muling pagkabuhay.
