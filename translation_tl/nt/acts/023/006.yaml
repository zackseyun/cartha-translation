    rationale: Maiintindihan ito bilang dahilan ng kaso, ngunit ang περί ay tuwirang “tungkol sa/hinggil sa.” Ang pagbabagong ito ay mas malapit sa pahayag ni Pablo at hindi nagdaragdag ng interpretasyon.
