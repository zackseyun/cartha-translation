  text: Claudius Lysias[a], to the most excellent governor Felix, greetings.
translation:
  language: tl
  text: 'Si Claudio Lisias, sa lubhang kagalang-galang na Gobernador Felix: Pagbati.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa Kagalang-galang na Gobernador Felix.” Ang salitang Griego na κρατίστῳ ay isang pormal na katawagang nagpapahayag ng mataas na paggalang.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κλαύδιος Λυσίας
  choice: Claudio Lisias
  rationale: Isinalin sa karaniwang anyong Filipino ang mga pangalang Griego, nang hindi binabago ang pagkakakilanlan ng tao.
- source_word: τῷ κρατίστῳ
  choice: para sa lubhang kagalang-galang na
  rationale: Ang κρατίστῳ ay pasukdol na katawagang nagpapahayag ng mataas at pormal na paggalang. Pinananatili ng “lubhang kagalang-galang” ang tindi at opisyal na himig nito.
- source_word: ἡγεμόνι
  choice: Gobernador
  rationale: Sa kontekstong Romano, ang ἡγεμών ay isang opisyal na namamahala. Ang “Gobernador” ang pinakamalinaw at pinakanatural na katumbas nang hindi nagtatakda ng mas teknikal na titulong hindi tahasang ibinigay ng teksto.
- source_word: Φήλικι
  choice: Felix
  rationale: Ginamit ang nakagawiang anyo ng pangalang ito sa Filipino.
- source_word: χαίρειν
  choice: Pagbati
  rationale: Sa pambungad ng isang liham, ang χαίρειν ay nakaugaliang pormula ng pagbati, hindi isang utos na “magalak.”
theological_decisions: []
translation_notes:
  register: Pormal at marangal ang himig upang umangkop sa pambungad ng isang opisyal na liham, ngunit nananatiling malinaw sa karaniwang mambabasang Filipino. Ginamit ang “Mula kay … para sa …” bilang natural na pagpapahayag ng sinaunang pormula ng liham.
