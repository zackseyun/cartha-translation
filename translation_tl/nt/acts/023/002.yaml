base_translation:
  language: en
  yaml_path: translation/nt/acts/023/002.yaml
  text: But the high priest Ananias ordered those standing by him to strike him on the mouth[a].
translation:
  language: tl
  text: Ngunit iniutos ng kataas-taasang pari na si Ananias sa mga nakatayo sa tabi niya na hampasin si Pablo sa bibig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sampalin si Pablo sa bibig.” Maaaring tumukoy ang pandiwang Griego sa paghampas sa pangkalahatan; posible ang “sampalin,” ngunit mas tiyak iyon kaysa sa tahasang sinasabi ng Griego.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ang bigla at salungat na tugon sa naunang sinabi ni Pablo nang hindi pinalalabis ang pagsalungat.
- source_word: ὁ ἀρχιερεὺς Ἁνανίας
  choice: ang kataas-taasang pari na si Ananias
  rationale: Ang “kataas-taasang pari” ang malinaw at karaniwang katawagan sa natatanging tungkuling tinutukoy; isinalin sa pamantayang anyong Tagalog ang pangalang Ἁνανίας.
- source_word: ἐπέταξεν
  choice: iniutos
  rationale: Pinananatili nito ang diwa ng makapangyarihan at tuwirang pag-uutos sa natural na modernong Tagalog.
- source_word: τοῖς παρεστῶσιν αὐτῷ
  choice: sa mga nakatayo sa tabi niya
  rationale: Pinananatili ang lantad na kahulugang panglokasyon ng participle at ang pagtukoy na sila ay malapit kay Ananias.
- source_word: τύπτειν
  choice: hampasin
  rationale: 'Malawak ang saklaw ng pandiwa: tumama o manakit sa pamamagitan ng paghampas. Hindi nito labis na tinutukoy kung sampal o ibang uri ng hampas.'
- source_word: αὐτοῦ τὸ στόμα
  choice: si Pablo sa bibig
  rationale: Bagaman literal na “ang bibig niya,” natural sa Tagalog na tukuyin ang taong hinampas at ang bahagi ng katawan. Ginawang lantad si Pablo upang maiwasan ang kalituhan sa magkasunod na panghalip na maaaring kapuwa tumukoy kay Ananias o Pablo.
