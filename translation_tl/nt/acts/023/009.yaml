  source_fidelity: 'Kailangang palitan ang “Kaya,” na masyadong inferensiyal para sa δέ; mas tapat ang simpleng pagsasalaysay na “Nagkaroon nga” o “Pagkatapos.” Ang “malaking sigawan” ay mas tuwirang katumbas ng κραυγὴ μεγάλη kaysa “matinding sigawan.” Napananatili ng salin ang mga pangunahing diwa: mga eskriba/tagapagturo ng Kautusan na nasa panig ng mga Pariseo, ang mariin o masidhing pagtatalo, ang kawalang-nakikitang pagkakamali kay Pablo, ang di-tiyak na “isang espiritu,” at ang biglang naputol na pangwakas na sugnay.'
  naturalness: Natural at malinaw ang modernong Filipino. Gayunman, mas natural at mas malapit sa pagkakaugnay ng Griyego na iugnay ang pagtayo at pakikipagtalo sa iisang pangungusap, bago ipakilala ang kanilang sinabi.
  terminology: Ang “tagapagturo ng Kautusan” ay katanggap-tanggap na pagpapaliwanag ng γραμματεῖς sa kontekstong Judio, bagaman mas teknikal ang “eskriba.” Ang “isang espiritu” at “isang anghel” ay wastong nagpapanatili ng pangkalahatan at walang-pantukoy na pakahulugan; hindi dapat gawing “ang Espiritu.”
