  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐγένετο δὲ κραυγὴ μεγάλη, καὶ ἀναστάντες ⸂τινὲς τῶν γραμματέων⸃ τοῦ μέρους τῶν Φαρισαίων διεμάχοντο λέγοντες· Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ· εἰ δὲ πνεῦμα ἐλάλησεν αὐτῷ ἢ ⸀ἄγγελος—
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/009.yaml
  text: Then a great outcry arose[a], and some of the scribes of the party of the Pharisees stood up and contended, saying, “We find nothing wrong in this man[b]. But if a spirit or an angel has spoken to him—”
translation:
  language: tl
  text: Nagkaroon nga ng malaking sigawan, at tumayo ang ilan sa mga tagapagturo ng Kautusan mula sa pangkat ng mga Pariseo at mahigpit na nakipagtalo. Sinabi nila, “Wala kaming nakikitang anumang mali sa taong ito. Ngunit kung isang espiritu o isang anghel ang nagsalita sa kanya—”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Biglang napuputol sa tekstong Griyego ang pangungusap na “Ngunit kung isang espiritu o isang anghel ang nagsalita sa kanya—”
    reason: abrupt_ending
lexical_decisions:
- source_word: κραυγὴ μεγάλη
  choice: matinding sigawan
  rationale: Likas sa modernong Filipino at naipapahayag ang malakas at magulong pagsigaw na tinutukoy ng parirala.
- source_word: ἀναστάντες
  choice: tumayo
  rationale: Tuwirang inilalarawan ang pagkilos ng mga tagapagturo nang magsalita sila sa kapulungan.
- source_word: τινὲς τῶν γραμματέων
  choice: ilan sa mga tagapagturo ng Kautusan
  rationale: Sa kontekstong Judio, ang γραμματεῖς ay mga dalubhasa at guro ng Kautusan; mas malinaw ito sa karaniwang mambabasang Filipino kaysa sa hiram na terminong “eskriba.”
- source_word: τοῦ μέρους τῶν Φαρισαίων
  choice: na kabilang sa pangkat ng mga Pariseo
  rationale: Ipinahahayag ang pagkakaugnay nila sa paksyon o panig ng mga Pariseo sa konseho.
- source_word: διεμάχοντο
  choice: mariin silang nakipagtalo
  rationale: Ipinakikita ang nagpapatuloy at masidhing pakikipagtalo ng pandiwang Griyego.
- source_word: Οὐδὲν κακὸν εὑρίσκομεν
  choice: Wala kaming nakikitang anumang masama
  rationale: Natural na Filipino na nagpapanatili sa diwang mapanuri o panghukuman ng pahayag.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: sa taong ito
  rationale: Tuwiran at kontekstuwal na tumutukoy kay Pablo.
- source_word: εἰ δὲ
  choice: Ngunit kung
  rationale: Pinananatili ang kondisyunal at hindi natapos na pahayag ng tekstong Griyego.
- source_word: πνεῦμα
  choice: isang espiritu
  rationale: Pinananatili ang pangkalahatan at di-tiyak na kahulugan, lalo na dahil itinatambal ito sa “isang anghel.”
- source_word: ἐλάλησεν αὐτῷ
  choice: ang nagsalita sa kanya
  rationale: Natural na salin ng naganap na pagsasalita nang hindi dinaragdagan ang nilalaman.
- source_word: ἄγγελος
  choice: isang anghel
  rationale: Ang sobrenatural na kaibahan nito sa “espiritu” ay nagpapakitang anghel, hindi taong mensahero, ang tinutukoy.
theological_decisions:
- issue: Kahulugan ng πνεῦμα kapag itinambal sa ἄγγελος
  choice: isang espiritu
  alternative: ang Espiritu
  rationale: Ang anyong walang pantukoy at ang pagkakatambal sa “isang anghel” ay pumapabor sa pangkalahatang espirituwal na nilalang. Hindi nito tiyak na kinikilala ang Espiritu Santo, kaya pinananatili ang naratibong kawalang-katiyakan.
- issue: Hindi natapos na huling sugnay
  choice: Pinanatili ang putol na pahayag sa pamamagitan ng em dash
  alternative: 'Gawing buong tanong: “Paano kung isang espiritu o isang anghel ang nagsalita sa kanya?”'
  rationale: Biglang napuputol ang pangungusap sa tekstong Griyego. Ang em dash ay pinakamalapit na paraan upang mapanatili ang anyo at tensiyon nito nang hindi tahimik na kinukumpleto ang sinabi.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tagapagturo ng Kautusan” sa halip na teknikal o di-gaanong pamilyar na “eskriba,” at pinanatili ang em dash upang katawanin ang biglang pagkaputol ng orihinal.
