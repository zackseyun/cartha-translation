revisions:
- from: Kaya nagkaroon ng matinding sigawan, at tumayo ang ilan sa mga tagapagturo ng Kautusan na kabilang sa pangkat ng mga Pariseo. Mariin silang nakipagtalo at sinabi, “Wala kaming nakikitang anumang masama sa taong ito. Ngunit kung isang espiritu o isang anghel ang nagsalita sa kanya—”[a]
  to: Nagkaroon nga ng malaking sigawan, at tumayo ang ilan sa mga tagapagturo ng Kautusan mula sa pangkat ng mga Pariseo at mahigpit na nakipagtalo. Sinabi nila, “Wala kaming nakikitang anumang mali sa taong ito. Ngunit kung isang espiritu o isang anghel ang nagsalita sa kanya—”[a]
  rationale: Pinalitan ang inferensiyal na “Kaya” ng pangkaraniwang pang-ugnay sa pagsasalaysay, ginawang “malaking sigawan” ang κραυγὴ μεγάλη, at pinagsama ang pagtayo at masidhing pakikipagtalo upang mas malinaw na maipakita ang ugnayan ng mga pandiwang Griyego. Pinanatili ang “isang espiritu,” ang “isang anghel,” at ang em dash, kaya hindi kinukumpleto o tinutukoy nang lampas sa orihinal ang putol na pahayag.
