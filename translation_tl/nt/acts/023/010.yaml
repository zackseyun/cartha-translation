source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀γινομένης στάσεως ⸀φοβηθεὶς ὁ χιλίαρχος μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν ἐκέλευσεν τὸ στράτευμα ⸀καταβὰν ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν, ἄγειν ⸀τε εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/010.yaml
  text: And when a great dispute arose[a], the commander, fearing that Paul might be torn apart by them, ordered the troops to go down, seize him from among them[c][b], and bring him into the barracks.
translation:
  language: tl
  text: Nang magkaroon ng matinding alitan[a], natakot ang kumandante na baka pagpira-pirasuhin nila si Pablo[b]. Kaya inutusan niya ang mga kawal na bumaba, agawin si Pablo mula sa gitna nila, at dalhin siya sa kuwartel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagkakagulo” o “sigalot.” Ang salitang Griyego na στάσις ay maaaring tumukoy sa matinding hidwaan at, sa ilang konteksto, sa kaguluhang sibil o pag-aalsa.
    reason: lexical_alternative
  - marker: b
    text: O “baka magkaluray-luray si Pablo sa mga kamay nila.” Matingkad ang salitang Griyego at nagpapahiwatig ng marahas na paghila o pagpunit.
    reason: lexical_alternative
  - marker: c
    text: Ang “kuwartel” ay salin ng παρεμβολή, na maaari ring literal na mangahulugang “kampo”; dito, tumutukoy ito sa himpilan ng mga Romanong kawal sa Jerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: πολλῆς δὲ γινομένης στάσεως
  choice: Nang maging matindi ang alitan
  rationale: Ang genitive absolute ay ginawang likas na sugnay na pangyayari. Saklaw ng στάσις ang matinding alitan, pagkakagulo, o pag-aalsa; sa kontekstong ito, “alitan” ang pinakatumpak nang hindi ipinapalagay na isa na itong pormal na rebelyon, at pinananatili ng “matindi” ang πολλῆς.
- source_word: φοβηθεὶς
  choice: natakot
  rationale: Ipinahahayag ng aorist participle ang takot na naging dahilan ng sumunod na utos ng kumandante.
- source_word: ὁ χιλίαρχος
  choice: ang kumandante
  rationale: Tumutukoy ito sa Romanong opisyal na namumuno sa malaking pangkat ng mga kawal. Malinaw at likas sa makabagong Filipino ang “kumandante” nang hindi nangangailangan ng teknikal na transliterasyon.
- source_word: μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν
  choice: na baka pagpira-pirasuhin nila si Pablo
  rationale: Pinananatili ng “baka” ang kinatatakutang posibilidad, samantalang inihahatid ng “pagpira-pirasuhin” ang marahas at matingkad na puwersa ng διασπάω.
- source_word: ἐκέλευσεν
  choice: inutusan niya
  rationale: Direkta at likas na salin sa kontekstong militar; nilinaw ng panghalip na ang kumandante ang nagbigay ng utos.
- source_word: τὸ στράτευμα
  choice: ang mga kawal
  rationale: Ang kolektibong katawagan sa pangkat ng mga sundalo ay natural na ipinahayag sa Filipino bilang “mga kawal.”
- source_word: καταβὰν
  choice: na bumaba
  rationale: Pinananatili nito ang kilos pababa mula sa kinaroroonan ng hukbo patungo sa kapulungan sa ibaba.
- source_word: ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν
  choice: agawin si Pablo mula sa gitna nila
  rationale: Ipinahahayag ng “agawin” ang biglaan at sapilitang pagkuha na taglay ng ἁρπάζω, at pinananatili ng “mula sa gitna nila” ang lokasyong nasa Griyego.
- source_word: ἄγειν τε
  choice: at dalhin siya
  rationale: Likas na Filipino ito para sa pag-akay o pagdadala kay Pablo patungo sa tahasang binanggit na destinasyon.
- source_word: εἰς τὴν παρεμβολήν
  choice: sa kuwartel
  rationale: Bagaman maaaring literal na “kampo” ang παρεμβολή, sa salaysay na ito ay tumutukoy ito sa himpilan o tirahan ng mga Romanong kawal sa Jerusalem; “kuwartel” ang malinaw na katumbas sa konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “kumandante,” “mga kawal,” at “kuwartel” sa halip na mga teknikal o transliteradong terminong militar. Pinanatili ang marahas na larawan ng διασπάω at ang posibilidad na ipinahihiwatig ng μή na may subjunctive.
