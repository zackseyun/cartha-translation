  text: σὺ οὖν μὴ πεισθῇς αὐτοῖς, ἐνεδρεύουσιν γὰρ αὐτὸν ἐξ αὐτῶν ἄνδρες πλείους τεσσεράκοντα, οἵτινες ἀνεθεμάτισαν ἑαυτοὺς μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀνέλωσιν αὐτόν, καὶ νῦν ⸂εἰσιν ἕτοιμοι⸃ προσδεχόμενοι τὴν ἀπὸ σοῦ ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/021.yaml
  text: So do not be persuaded by them, for more than forty men from among them are lying in ambush for him, who have bound themselves under a curse neither to eat nor to drink until they have killed him. And now they are ready, waiting for the promise from you.
translation:
  language: tl
  text: Kaya huwag kang magpapadala sa kanila, sapagkat mahigit sa apatnapung lalaki mula sa kanila ang nag-aabang upang tambangan siya. Isinailalim nila ang kanilang sarili sa isang sumpa[a] na hindi sila kakain ni iinom hanggang sa mapatay nila siya. At ngayon ay handa na sila, hinihintay ang pangako mo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nangako sila sa ilalim ng sumpa”; kasama sa pananalitang Griyego ang diwa na isinusumpa nila ang kanilang sarili kung hindi nila ito matutupad.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, hinihintay nila ang iyong pagsang-ayon o pahintulot.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθῇς
  choice: magpapadala
  rationale: Sa konteksto ng babala laban sa pagpapahinuhod sa kanilang kahilingan, natural na ipinapahayag ng “huwag kang magpapadala” ang pasibong diwa ng pagpapaimpluwensiya nang hindi ito ginagawang simpleng pakikinig lamang.
- source_word: ἐνεδρεύουσιν
  choice: nag-aabang upang tambangan
  rationale: Pinananatili nito ang kongkretong larawan ng palihim na paghihintay para sa marahas na pagsalakay.
- source_word: ἐξ αὐτῶν
  choice: mula sa kanila
  rationale: Ipinakikitang ang mahigit apatnapung lalaki ay kabilang sa grupong kababanggit lamang.
- source_word: ἄνδρες πλείους τεσσεράκοντα
  choice: mahigit apatnapung lalaki
  rationale: Natural at tumpak na salin ng paghahambing na kasama ng bilang.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: isinailalim nila ang kanilang sarili sa isang sumpa
  rationale: Pinananatili ang ideya ng taimtim na pananagutan na may ipinapataw na sumpa sa sarili kapag hindi natupad ang panata.
- source_word: μήτε φαγεῖν μήτε πιεῖν
  choice: hindi sila kakain ni iinom
  rationale: Natural na Filipino na nagpapanatili sa magkatambal na pagbabawal.
- source_word: ἕως οὗ ἀνέλωσιν αὐτόν
  choice: hanggang sa mapatay nila siya
  rationale: Malinaw na inilalahad ang marahas at nakamamatay na layon ng ἀναιρέω sa kontekstong ito.
- source_word: εἰσιν ἕτοιμοι
  choice: handa na sila
  rationale: Direkta at natural na katumbas; ang “na” ay angkop sa kasalukuyang kalagayang binibigyang-diin.
- source_word: προσδεχόμενοι
  choice: naghihintay
  rationale: Ipinahahayag ang may inaasahang paghihintay, na nililinaw ng kasunod na layon.
- source_word: τὴν ἀπὸ σοῦ ἐπαγγελίαν
  choice: sa pangako mo
  rationale: Pinananatili ang karaniwang kahulugan ng ἐπαγγελία bilang “pangako,” habang ang talababa ay naglilinaw sa kontekstuwal na diwa ng pagsang-ayon o pahintulot.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “magpapadala” para sa likas na babala laban sa pagpapaimpluwensiya, at pinanatili ang “sumpa” at “pangako” upang huwag burahin ang lakas at posibleng lawak ng mga salitang Griyego.
