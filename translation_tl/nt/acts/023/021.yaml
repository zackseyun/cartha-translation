revisions:
- from: Kaya huwag kang magpapadala sa kanila, sapagkat mahigit apatnapung lalaki mula sa kanila ang nag-aabang upang tambangan siya. Isinailalim nila ang kanilang sarili sa isang sumpa[a] na hindi sila kakain ni iinom hanggang sa mapatay nila siya. At ngayon ay handa na sila, naghihintay sa pangako mo.[b]
  to: Kaya huwag kang magpapadala sa kanila, sapagkat mahigit sa apatnapung lalaki mula sa kanila ang nag-aabang upang tambangan siya. Isinailalim nila ang kanilang sarili sa isang sumpa[a] na hindi sila kakain ni iinom hanggang sa mapatay nila siya. At ngayon ay handa na sila, hinihintay ang pangako mo.[b]
  rationale: Inayos lamang ang dalawang usaping pangwika—ang karaniwang konstruksiyong “mahigit sa” at ang mas natural na pandiwang “hinihintay”—nang hindi binabago ang kahulugan, saklaw, o antas ng katiyakan ng tekstong Griyego. Pinanatili ang mga anchor ng talababa sa mga salitang nangangailangan ng leksikal at kontekstuwal na paglilinaw.
