id: ACT.23.12
reference: Acts 23:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ποιήσαντες ⸂συστροφὴν οἱ Ἰουδαῖοι⸃ ἀνεθεμάτισαν ἑαυτοὺς λέγοντες μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/012.yaml
  text: When day came[a], the Jews formed a conspiracy and bound themselves under a curse[b], saying that they would neither eat nor drink until they had killed Paul.
translation:
  language: tl
  text: 'Pagsapit ng umaga, nagsabwatan ang mga Judio[a] at ipinasailalim nila ang kanilang sarili sa isang sumpa[b]: hindi sila kakain ni iinom hanggang hindi nila mapapatay si Pablo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa kontekstong ito, ang “mga Judio” ay tumutukoy sa partikular na pangkat ng mga Judiong kasangkot sa sabwatan, hindi sa buong bayang Judio.
    reason: cultural_note
  - marker: b
    text: O “isinumpa ang kanilang sarili.” Tumutukoy ito sa isang panatang nagpapasapit ng sumpa sa kanilang sarili kung hindi nila ito matupad.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Pagsapit ng umaga
  rationale: Likas na salin ng genitive absolute na nagsasaad ng paglipat ng panahon; malinaw sa modernong Tagalog.
- source_word: ποιήσαντες συστροφὴν
  choice: nagsabwatan
  rationale: Ipinahihiwatig ng parirala ang organisado at lihim na pag-uugnayan para sa balak na pagpatay, hindi basta pagbuo ng magulong pangkat.
- source_word: οἱ Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Pinananatili ang tahasang katawagan ng Griyego; nililinaw sa talababa na isang partikular na pangkat ang tinutukoy sa konteksto.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: isinumpa ang kanilang sarili
  rationale: Inihahatid nito ang ideya ng panatang may ipinapataw na sumpa sa sarili kapag hindi natupad, nang hindi gumagamit ng di-pamilyar na terminong teknikal.
- source_word: λέγοντες μήτε φαγεῖν μήτε πιεῖν
  choice: na nagsasabing hindi sila kakain ni iinom
  rationale: Natural na Tagalog para sa nilalaman ng kanilang panata at pinananatili ang magkatambal na pagtanggi.
- source_word: ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον
  choice: hangga't hindi nila napapatay si Pablo
  rationale: 'Natural na pagpapahayag sa Tagalog ng hangganan ng panata: hindi sila kakain o iinom bago maisagawa ang pagpatay.'
theological_decisions:
- issue: Saklaw ng katawagang οἱ Ἰουδαῖοι
  choice: Pinanatili sa teksto ang “mga Judio,” na may paglilinaw sa talababa tungkol sa partikular na pangkat.
  alternative: “ilang Judio” o “mga pinunong Judio”
  rationale: Hindi tahasang sinasabi ng Griyego ang “ilan” o “mga pinuno,” kaya hindi ito idinagdag sa pangunahing teksto; gayunman, pinipigilan ng talababa ang maling pagbasa na buong bayang Judio ang sangkot.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “nagsabwatan” para sa maikli at natural na paglalarawan ng organisadong balak, at pinanatili ang mabigat na diwa ng sariling sumpa sa panata.
