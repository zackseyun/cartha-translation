  yaml_path: translation/nt/acts/023/017.yaml
  text: So Paul called one of the centurions and said[a], “Take this young man to the commander, for he has something to report to him.”
translation:
  language: tl
  text: Tinawag ni Pablo ang isa sa mga senturyon at sinabi, “Dalhin mo ang binatang ito sa kumandante, sapagkat may nais siyang iulat[a] sa kanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sabihin sa kanya.” Ang pandiwang Griyego ay maaaring mangahulugang mag-ulat, magbalita, o magsabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Tinawag
  rationale: Ipinahihiwatig ng aorist middle participle na tinawag ni Pablo ang senturyon upang lumapit sa kanya. Likas at malinaw sa makabagong Tagalog ang “tinawag.”
- source_word: δὲ
  choice: Hindi isinalin nang hiwalay
  rationale: Dito, ang δέ ay banayad na panandang pasalaysay lamang. Sapat na naihahayag sa Tagalog ng pagkakasunod ng mga pangungusap ang pagpapatuloy ng salaysay nang hindi nagdaragdag ng mas matibay na ugnayang gaya ng “kaya.”
- source_word: ἕνα τῶν ἑκατονταρχῶν
  choice: isa sa mga senturyon
  rationale: Ang “senturyon” ang kinikilalang katawagang historikal sa opisyal na Romano na namumuno sa humigit-kumulang isang daang kawal.
- source_word: ἔφη
  choice: sinabi
  rationale: Payak at di-kapansin-pansing pandiwa ito para sa tuwirang pagsasalita sa isang salaysay.
- source_word: νεανίαν
  choice: binatang ito
  rationale: Ang νεανίας ay tumutukoy sa isang nakababatang lalaki. Ang “binata” ay maikli, likas, at angkop sa konteksto.
- source_word: ἄπαγε
  choice: Dalhin mo
  rationale: Ang pautos na ἄπαγε ay nangangahulugang akayin o dalhin ang isang tao patungo sa iba. Pinakanatural sa Tagalog ang “Dalhin mo” sa tagubiling ito.
- source_word: πρὸς τὸν χιλίαρχον
  choice: sa kumandante
  rationale: Sa konteksto, ang χιλίαρχος ay ang kilalang mataas na opisyal ng hukbong Romano. Nauunawaan agad ang “kumandante” at pinananatili nito ang katangiang militar ng tungkulin.
- source_word: ἔχει γὰρ ἀπαγγεῖλαί τι αὐτῷ
  choice: sapagkat mayroon siyang iuulat dito
  rationale: Ang ἔχει na may infinitive ay nagsasaad na may isang bagay siyang gagawin o sasabihin, at ang ἀπαγγέλλω ay maaaring mangahulugang mag-ulat, magbalita, o magsabi. Ang “iuulat” ay angkop sa agarang impormasyong ihahatid sa opisyal; ang “dito” ay malinaw na tumutukoy sa kumandante at umiiwas sa magkakasunod na malabong panghalip.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang historikal na “senturyon,” samantalang ginamit ang mas madaling maunawaang “kumandante” sa halip na teknikal na “tribuno” o transliteradong “kiliarka.”
