source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν· Τύπτειν σε μέλλει ὁ θεός, τοῖχε κεκονιαμένε· καὶ σὺ κάθῃ κρίνων με κατὰ τὸν νόμον, καὶ παρανομῶν κελεύεις με τύπτεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/003.yaml
  text: Then Paul said to him[a], “God is about to strike you, you whitewashed wall! And do you sit judging me according to the law, and yet in violation of the law command me to be struck?”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Pablo sa kanya, “Malapit ka nang hampasin ng Diyos[a], ikaw na pader na pinaputi! Nakaupo ka at humahatol sa akin ayon sa Kautusan, ngunit labag sa Kautusan ay inuutusan mo akong hampasin?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hahampasin ka ng Diyos.” Sa literal, “Malapit ka nang hampasin ng Diyos,” na maaaring magdiin sa pagiging nalalapit ng kilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τύπτειν σε μέλλει ὁ θεός
  choice: Malapit ka nang hampasin ng Diyos
  rationale: Ipinahahayag ng μέλλει kasama ng pawatas ang nalalapit o nakaambang kilos. Likas sa modernong Tagalog ang “malapit ka nang,” at pinananatili nitong mas malinaw ang diwa ng pagiging nalalapit kaysa sa payak na “hahampasin ka.”
- source_word: τοῖχε κεκονιαμένε
  choice: ikaw na pinaputing pader
  rationale: Pinananatili ang matalim na metapora ng pader na pinahiran o pinaputi upang magmukhang malinis sa labas. Ang “pinaputing pader” ay malinaw at dignified nang hindi ipinapaliwanag sa mismong talata ang ipinahihiwatig na pagkukunwari o kabulukan.
- source_word: κάθῃ
  choice: Nakaupo ka
  rationale: Pinananatili ang kongkretong pandiwang “umupo” at ang retorikal na talim ng tanong, sa halip na palabuin ito bilang simpleng pagganap sa tungkulin ng hukom.
- source_word: κρίνων με κατὰ τὸν νόμον
  choice: upang hatulan ako ayon sa Kautusan
  rationale: Ang “ayon sa Kautusan” ay tumpak sa κατὰ τὸν νόμον at naghahanda sa tahasang pagsalungat ng παρανομῶν. Ginamit ang malaking titik dahil sa konteksto ay tumutukoy ito sa Kautusang sinusunod ng konsehong Judio.
- source_word: παρανομῶν
  choice: labag sa Kautusan
  rationale: Tuwirang ipinakikita nito ang pagkilos na salungat sa Kautusan at pinananatili ang paralelismong “ayon sa Kautusan” / “labag sa Kautusan.”
- source_word: κελεύεις με τύπτεσθαι
  choice: ang pag-uutos mong hampasin ako
  rationale: Pinananatili ang diwa ng awtoritatibong utos sa κελεύεις at ang pasibong ideya na si Pablo ang ipahahampas, habang natural ang ayos sa Tagalog.
- source_word: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν
  choice: Pagkatapos, sinabi ni Pablo sa kanya
  rationale: Payak at natural na salaysay ito para sa τότε at sa pormulang pagsasalita, nang walang idinagdag na interpretasyon.
theological_decisions:
- issue: Kalikasan ng pahayag na “Τύπτειν σε μέλλει ὁ θεός”
  choice: Isinalin bilang tiyak na pahayag tungkol sa nalalapit na pagkilos ng Diyos
  alternative: “Hampasin ka sana ng Diyos” bilang sumpa o kahilingan
  rationale: Ang μέλλει + pawatas ay likas na nagpapahayag ng nakaambang kilos, hindi ng isang kahilingan. Hindi hinuhusgahan ng salin kung tama o mali ang asal ni Pablo sa pagsabi nito.
- issue: Pagkakakilanlan ng νόμος
  choice: Kautusan
  alternative: batas
  rationale: Sa paglilitis sa harap ng konsehong Judio, natural na tumutukoy ang salita sa Kautusang nagsisilbing pamantayan nila. Gayunman, hindi dinaragdagan ng salin ang teksto ng mas espesipikong paliwanag gaya ng “Kautusan ni Moises.”
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang matalas na retorika ni Pablo at ang legal na pagsalungat ng “ayon sa Kautusan” at “labag sa Kautusan.”
