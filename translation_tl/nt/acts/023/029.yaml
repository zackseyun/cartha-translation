  text: I found that he was being accused concerning questions of their law[b][a], but charged with nothing deserving death or imprisonment.
translation:
  language: tl
  text: Nalaman kong inaakusahan siya tungkol sa mga usapin sa kanilang Kautusan[a], ngunit wala siyang anumang sakdal na nararapat sa parusang kamatayan o pagkabilanggo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tungkol sa mga pinagtatalunang bagay sa kanilang Kautusan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “walang anumang karapat-dapat sa kamatayan o mga gapos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρον
  choice: Nalaman kong
  rationale: Ipinahahayag ng aorist na εὗρον ang naging konklusyon ng pinuno matapos niyang siyasatin ang usapin. Likas sa modernong Tagalog ang “Nalaman kong.”
- source_word: ἐγκαλούμενον
  choice: inaakusahan siya
  rationale: 'Pinananatili nito ang pasibong diwa ng participle: may mga paratang na inihaharap laban sa kanya, nang hindi ipinahihiwatig na napatunayan na siyang nagkasala.'
- source_word: περὶ ζητημάτων
  choice: tungkol sa mga usapin
  rationale: Ang ζητήματα ay maaaring tumukoy sa mga tanong, usapin, o bagay na pinagtatalunan. Ang “mga usapin” ay natural at hindi labis na nagpapasya kung gaano katindi ang pagtatalo.
- source_word: τοῦ νόμου αὐτῶν
  choice: sa kanilang Kautusan
  rationale: Pinananatili ng “kanilang” ang pananaw ng Romanong opisyal, at ginagamit ang “Kautusan” para sa batas na kaugnay ng tradisyong Judio sa kontekstong ito.
- source_word: μηδὲν ... ἄξιον θανάτου ἢ δεσμῶν
  choice: walang ... na nararapat sa kamatayan o pagkabilanggo
  rationale: Ipinahahayag nito ang legal na diwa ng pagiging karapat-dapat sa parusang kamatayan o pagkakagapos. Ang “pagkabilanggo” ay mas malinaw at natural kaysa literal na “mga gapos.”
- source_word: ἔχοντα ἔγκλημα
  choice: walang paratang laban sa kanya
  rationale: Ang parirala ay tumutukoy sa paratang o sakdal na nakaharap laban sa kanya. Hindi ginamit ang “nagkasala” upang hindi magpahiwatig ng hatol na wala sa Griyego.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang legal na himig at ang pagkakaiba ng paratang sa napatunayang pagkakasala. Ginamit ang malaking titik sa “Kautusan” bilang kontekstuwal na tawag sa Kautusang Judio, hindi bilang pagdaragdag ng interpretasyong denominasyonal.
