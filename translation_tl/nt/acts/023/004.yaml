  yaml_path: translation/nt/acts/023/004.yaml
  text: Those standing nearby said[a], “Are you insulting God’s high priest?”
translation:
  language: tl
  text: Sinabi ng mga taong nakatayo sa malapit, “Nilalait[a] mo ba ang mataas na pari ng Diyos?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Iniinsulto mo ba ang mataas na pari ng Diyos?”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ παρεστῶτες
  choice: mga nakatayo sa tabi
  rationale: Ang articular participle ay tumutukoy sa mga taong naroon malapit kay Pablo. Likas sa modernong Tagalog ang “nakatayo sa tabi” at pinananatili nito ang diwang panlunan ng παρίστημι.
- source_word: εἶπαν
  choice: Sinabi
  rationale: Ang aorist indicative ay nagsusulong sa salaysay bilang isang payak at natapos na kilos; natural dito ang “Sinabi.”
- source_word: ἀρχιερέα
  choice: pinakapunong pari
  rationale: Sa kontekstong ito, ang ἀρχιερεύς ay tumutukoy sa pinakamataas na paring Judio. Tiyak at madaling maunawaan ang “pinakapunong pari” at naiiwasan ang maaaring malabong “mataas na pari.”
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Direktang pinananatili ng pariralang genitive ang kaugnayan ng tungkulin sa Diyos nang hindi nagdaragdag ng pagsang-ayon sa asal ng taong humahawak nito.
- source_word: λοιδορεῖς
  choice: Nilalait mo ba
  rationale: Ang λοιδορέω ay tumutukoy sa mapanlait o mapang-abusong pananalita. Ang “nilalait” ay malinaw, kasalukuyan, at angkop sa mapanumbat na tanong.
theological_decisions:
- issue: Diwa ng τοῦ θεοῦ bilang paglalarawan sa pinakapunong pari
  choice: “pinakapunong pari ng Diyos”
  alternative: “pinakapunong paring ukol sa Diyos”
  rationale: Kinikilala ng parirala ang tungkulin ayon sa kaugnayan nito sa Diyos, ngunit hindi nito kinakailangang ipinahahayag na sinasang-ayunan ng Diyos ang asal ng taong humahawak sa tungkulin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nilalait” bilang natural na katumbas ng pandiwang tumutukoy sa pasalitang paghamak; inilagay ang talababa upang maipakita ang mas matinding alternatibong diwa.
