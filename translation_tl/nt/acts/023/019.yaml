base_translation:
  language: en
  yaml_path: translation/nt/acts/023/019.yaml
  text: So the commander took him by the hand and[a], drawing aside in private, began asking[b], “What is it that you have to report to me?”
translation:
  language: tl
  text: Kaya hinawakan siya ng kumander sa kamay at isinama siya sa isang tabi nang sarilinan,[a] saka nagtanong, “Ano ang mayroon kang ibabalita sa akin?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lumayo silang dalawa nang sarilinan.”
    reason: lexical_alternative
  - marker: b
    text: O “Ano ang mayroon kang iuulat sa akin?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιλαβόμενος ... τῆς χειρὸς αὐτοῦ
  choice: hinawakan siya ... sa kamay
  rationale: Pinananatili nito ang konkretong kilos ng paghawak sa kamay nang hindi nagpapahiwatig ng dahas; natural din ito sa makabagong Tagalog.
- source_word: δὲ
  choice: Kaya
  rationale: Sa konteksto, nagsisilbi itong likas na pag-usad ng salaysay at tugon sa sinabi sa naunang talata.
- source_word: ὁ χιλίαρχος
  choice: ang kumander
  rationale: Malinaw at pamilyar na katawagan ito para sa Romanong opisyal ng hukbo; iniiwasan nito ang teknikal at di-pamilyar na transliterasyon.
- source_word: ἀναχωρήσας κατ’ ἰδίαν
  choice: matapos silang lumayo nang sarilinan
  rationale: Ipinahahayag nito kapwa ang paglayo sa iba at ang pribadong kalagayan. Ang 'silang' ay likas na pagpapahayag sa Tagalog ng ipinahihiwatig ng konteksto, bagaman walang tahasang layon sa Griyego.
- source_word: ἐπυνθάνετο
  choice: nagtanong
  rationale: Natural sa Tagalog ang payak na anyong ito para sa di-ganap na aspektong Griyego sa ganitong salaysay; ang 'nagsimulang magtanong' ay maaaring magmukhang paulit-ulit ang pagtatanong.
- source_word: Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι
  choice: Ano ang ipababalita mo sa akin?
  rationale: Natural at tuwirang tanong ito. Ang 'ipababalita' ay nagpapanatili sa diwa ng paghahatid o pag-uulat ng impormasyon, hindi lamang pangkaraniwang pagsasabi.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kumander” bilang karaniwang katawagan sa opisyal ng hukbo, at pinanatiling maikli at natural ang tuwirang tanong.
