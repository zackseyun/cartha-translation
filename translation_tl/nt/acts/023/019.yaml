  naturalness: Ang “nang sarilinan” ay mas likas kapag ang dalawang tao ay inilalarawang magkasamang lumihis o pumunta sa isang tabi. Ang “Ano ang mayroon kang ibabalita sa akin?” ay mas natural at mas malapit sa konstruksiyong ἔχεις + infinitive kaysa “Ano ang ipababalita mo sa akin?”
  terminology: Ang “kumander” ay katanggap-tanggap na makabagong Filipino para sa χιλίαρχος sa salaysay na ito. Ang “ibabalita” ay sapat na malawak upang isalin ang ἀπαγγεῖλαι, na maaaring mangahulugang magbalita o mag-ulat, nang hindi labis na itinatakda ang teknikal na antas ng ulat.
