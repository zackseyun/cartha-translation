- from: Kaya hinawakan siya ng kumander sa kamay at, matapos silang lumayo nang sarilinan,[a] nagtanong, “Ano ang ipababalita mo sa akin?”[b]
  to: Kaya hinawakan siya ng kumander sa kamay at isinama siya sa isang tabi nang sarilinan,[a] saka nagtanong, “Ano ang mayroon kang ibabalita sa akin?”[b]
  rationale: Inayos ang participial na parirala upang maging idiomatiko sa modernong Filipino at mapanatili ang kontekstuwal na implikasyon na isinama ng kumander ang binata sa isang pribadong lugar. Pinalitan ang “ipababalita” ng “mayroon kang ibabalita,” na mas tumpak na naghahatid ng ἔχεις ἀπαγγεῖλαί μοι nang walang di-likas na sanhiang kahulugan. Pinanatili ang mahinahong salaysay at ang hindi sobrang teknikal na “kumander.”
