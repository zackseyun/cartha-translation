base_translation:
  language: en
  yaml_path: translation/nt/acts/023/001.yaml
  text: And Paul[a], looking intently at the council, said, “Brothers, I have lived before God with an entirely good conscience up to this day.”
translation:
  language: tl
  text: Tinitigan ni Pablo ang kapulungan at sinabi, “Mga kapatid, namuhay ako[a] sa harap ng Diyos nang may ganap na malinis na budhi hanggang sa araw na ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “namuhay ako bilang isang mamamayan sa harap ng Diyos,” upang mapanatili ang sibikong pahiwatig ng pandiwang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: Tinitigan
  rationale: Ipinahahayag ng aorist participle ang tuwiran at matamang pagtitig; natural at malinaw sa makabagong Tagalog ang “tinitigan.”
- source_word: δὲ
  choice: at
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay; sapat at di-mabigat ang “at” sa Tagalog.
- source_word: τῷ συνεδρίῳ
  choice: ang kapulungan
  rationale: Tumutukoy sa konsehong Judio sa kontekstong ito. Isinasalin ang karaniwang pangngalan sa halip na gumamit ng transliterasyong “Sanhedrin.”
- source_word: Ἄνδρες ἀδελφοί
  choice: Mga kapatid
  rationale: Likas na anyo ito ng tuwirang pagtawag sa mga lalaking kausap at iniiwasan ang alanganing literal na “mga lalaking kapatid.”
- source_word: πάσῃ συνειδήσει ἀγαθῇ
  choice: nang may lubos na malinis na budhi
  rationale: Ipinahahayag ng pariralang datibo ang paraan ng pamumuhay, at ng πάσῃ ang ganap o malawak na saklaw ng pahayag. Mas natural sa Tagalog ang “malinis na budhi” kaysa literal na “mabuting budhi.”
- source_word: πεπολίτευμαι
  choice: namuhay ako
  rationale: Ang perfect form ay tumutukoy sa asal o pamumuhay mula sa nakaraan hanggang sa kasalukuyan. Pinananatili ng “namuhay ako” ang pangkalahatang diwa nang hindi ipinipilit sa pangunahing teksto ang posibleng sibikong pahiwatig.
- source_word: τῷ θεῷ
  choice: sa harap ng Diyos
  rationale: Ipinahahayag nito ang pamumuhay na may kaugnayan sa Diyos at nasa ilalim ng kaniyang pagtingin; idiomatiko at angkop sa konteksto ng budhi ang “sa harap ng Diyos.”
- source_word: ἄχρι ταύτης τῆς ἡμέρας
  choice: hanggang sa araw na ito
  rationale: Malinaw na pinananatili nito ang pagpapatuloy mula sa nakaraan hanggang sa mismong oras ng pagsasalita.
theological_decisions:
- issue: Saklaw ng pahayag ni Pablo sa πεπολίτευμαι at πάσῃ συνειδήσει ἀγαθῇ
  choice: Isang pahayag tungkol sa kaniyang paraan ng pamumuhay sa harap ng Diyos at sa malinis niyang budhi
  alternative: Isang teknikal na pahayag tungkol sa pagkamamamayan, o isang tahasang pag-angkin ng ganap na kawalang-kasalanan
  rationale: Maaaring may sibikong pahiwatig ang πολιτεύομαι, ngunit sa konteksto ay pangunahing inilalarawan nito ang asal o pamumuhay. Ang pahayag tungkol sa budhi ay pinananatiling matibay nang hindi dinaragdagan bilang doktrina ng ganap na kawalang-kasalanan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kapulungan” bilang malinaw na salin ng karaniwang pangngalan at “malinis na budhi” bilang likas na katumbas sa Filipino.
