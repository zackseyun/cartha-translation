  text: Τῇ δὲ ἐπιούσῃ νυκτὶ ἐπιστὰς αὐτῷ ὁ κύριος εἶπεν· ⸀Θάρσει, ὡς γὰρ διεμαρτύρω τὰ περὶ ἐμοῦ εἰς Ἰερουσαλὴμ οὕτω σε δεῖ καὶ εἰς Ῥώμην μαρτυρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/011.yaml
  text: But on the following night[a], the Lord stood by him and said, “Take courage, for just as you have testified about me in Jerusalem[b], so you must also testify in Rome.”
translation:
  language: tl
  text: Ngunit nang sumunod na gabi, tumayo sa tabi niya ang Panginoon at sinabi, “Lakasan mo ang loob![a] Sapagkat kung paanong nagpatotoo ka tungkol sa akin sa Jerusalem, gayon din ay kailangan mong magpatotoo sa Roma.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Magpakatatag ka!”
    reason: lexical_alternative
  - marker: b
    text: Ang “nagpatotoo” at “magpatotoo” ay mula sa magkaugnay na mga salita sa Griyego para sa pagpapatotoo o pagsaksi; ang unang pandiwa ay maaari ring magpahiwatig ng mariing pagpapatotoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπιούσῃ νυκτί
  choice: Nang sumunod na gabi
  rationale: Likas at malinaw na ipinapahayag nito ang susunod na gabi. Hindi ginawang tahasang panalungat ang δέ sapagkat banayad na pagpapatuloy ng salaysay ang gamit nito rito.
- source_word: ἐπιστὰς αὐτῷ
  choice: tumayo sa tabi niya
  rationale: Pinananatili nito ang larawan ng Panginoon na nakatayo malapit kay Pablo, sa halip na idagdag ang mas interpretibong “nagpakita.”
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Ito ang karaniwan at marangal na salin ng κύριος. Hindi idinagdag ang “Jesus” upang manatili sa tahasang pagkakasabi ng tekstong Griyego.
- source_word: Θάρσει
  choice: Lakasan mo ang loob!
  rationale: Natural na makabagong Tagalog ito para sa utos na magkaroon ng tapang at pinananatili ang tono ng pagpapalakas-loob.
- source_word: διεμαρτύρω
  choice: nagpatotoo ka
  rationale: Malinaw nitong ipinapahayag ang natapos nang pagpapatotoo ni Pablo at napapanatili ang ugnayang leksikal sa μαρτυρῆσαι.
- source_word: τὰ περὶ ἐμοῦ
  choice: tungkol sa akin
  rationale: Natural at tuwirang katumbas ito ng mga bagay na may kinalaman sa nagsasalita.
- source_word: εἰς Ἰερουσαλήμ
  choice: sa Jerusalem
  rationale: Bagaman εἰς ang pang-ukol, sa kontekstong ito ang “sa Jerusalem” ang likas na Tagalog para sa lugar kung saan naganap ang pagpapatotoo.
- source_word: οὕτω
  choice: gayon din
  rationale: Ipinakikita nito ang pagtutumbas sa pagpapatotoo ni Pablo sa Jerusalem at sa gagawin niya sa Roma.
- source_word: σε δεῖ
  choice: kailangan mong
  rationale: Malinaw nitong pinananatili ang diwa ng pangangailangan, nang hindi ito pinalalawak tungo sa determinismo o kapalaran.
- source_word: καὶ εἰς Ῥώμην μαρτυρῆσαι
  choice: magpatotoo sa Roma
  rationale: Ang “magpatotoo” ay tumutugma sa naunang “nagpatotoo,” habang ang Roma ay malinaw na inihahayag bilang susunod na lugar ng pagpapatotoo.
theological_decisions:
- issue: Pagkakakilanlan ng ὁ κύριος
  choice: Isinalin bilang “ang Panginoon,” nang hindi tahasang dinaragdagan ng “Jesus.”
  alternative: “ang Panginoong Jesus”
  rationale: Ipinahihiwatig ng konteksto ng Mga Gawa at ng “tungkol sa akin” na ang muling nabuhay na si Jesus ang nagsasalita, ngunit “ang Panginoon” lamang ang tahasang nasa Griyego. Pinananatili ng salin ang mismong pahayag ng teksto.
- issue: Lakas ng δεῖ
  choice: “kailangan mong”
  alternative: “itinakdang” o “nararapat mong”
  rationale: Ipinapahayag nito ang tunay na pangangailangan sa balak ng Diyos nang hindi ipinapalagay o ipinapaliwanag ang mekanismo nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Lakasan mo ang loob” bilang natural na pagpapalakas-loob, at pinanatili ang pag-uulit ng “nagpatotoo/magpatotoo” upang marinig ang ugnayan ng dalawang pandiwang Griyego.
