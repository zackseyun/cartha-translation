  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔφη τε ὁ Παῦλος· Οὐκ ᾔδειν, ἀδελφοί, ὅτι ἐστὶν ἀρχιερεύς· γέγραπται γὰρ ⸀ὅτι Ἄρχοντα τοῦ λαοῦ σου οὐκ ἐρεῖς κακῶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/005.yaml
  text: And Paul said, “I did not know, brothers, that he is the high priest; for it is written, ‘You shall not speak evil of a ruler of your people.’”
translation:
  language: tl
  text: At sinabi ni Pablo, “Hindi ko alam, mga kapatid, na siya ang punong pari; sapagkat nasusulat, ‘Huwag kang magsalita ng masama laban sa isang pinuno ng iyong bayan.’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Huwag mong alipustain ang isang pinuno ng iyong bayan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε ὁ Παῦλος
  choice: At sinabi ni Pablo
  rationale: Ang τέ ay banayad na pang-ugnay, at ang ἔφη ay nagpapakilala ng tuwirang sinabi; natural na pinananatili ng “At sinabi ni Pablo” ang daloy ng salaysay.
- source_word: Οὐκ ᾔδειν
  choice: Hindi ko alam
  rationale: Tuwiran at likas itong katumbas ng pahayag tungkol sa hindi pagkaalam, nang hindi ipinapalagay kung hindi niya nakilala ang tao o hindi niya alam ang katungkulan nito.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Karaniwang dignified na tawag ito sa kapwa kasapi ng pangkat at angkop sa pagharap ni Pablo sa konseho; hindi kailangang dagdagan ng paliwanag na wala sa Griyego.
- source_word: ὅτι ἐστὶν ἀρχιερεύς
  choice: na siya ang punong pari
  rationale: Pinananatili ang present-tense na ἐστίν sa natural na Tagalog at malinaw na tumutukoy sa katungkulan ng taong pinag-uusapan.
- source_word: γέγραπται γὰρ
  choice: sapagkat nasusulat
  rationale: Pamilyar at marangal na pormula ito sa pagsipi ng Kasulatan at pinananatili ang diwa ng perfect passive.
- source_word: Ἄρχοντα
  choice: isang pinuno
  rationale: Ang anarthrous na pangngalan ay may pangkalahatang diwa; ang “pinuno” ay malawak at angkop sa legal at pampamayanang konteksto.
- source_word: τοῦ λαοῦ σου
  choice: ng iyong bayan
  rationale: Ang “bayan” ay natural na tumutukoy sa sariling sambayanan at pinananatili ang pangkomunidad na diwa ng λαός.
- source_word: οὐκ ἐρεῖς κακῶς
  choice: Huwag kang magsalita ng masama laban sa
  rationale: Ipinapahayag nito ang imperatibong gamit ng future indicative at pinananatili ang malawak na kahulugan ng κακῶς nang hindi nililimitahan sa isang uri lamang ng mapanirang pananalita.
theological_decisions:
- issue: Kung ipaliliwanag kung bakit sinabi ni Pablo na hindi niya alam na punong pari ang kausap
  choice: Hindi nagdagdag ng paliwanag
  alternative: Isalin bilang “Hindi ko siya nakilalang punong pari” o magpahiwatig ng pagkutya
  rationale: Hindi nilulutas ng mismong Griyego kung literal na hindi alam ni Pablo, hindi niya nakilala ang tao, o may ibang retorikal na layunin; pinananatili ng salin ang tunay na kalabuan.
- issue: Panahunan ng ἐστὶν sa pahayag tungkol sa punong pari
  choice: na siya ang punong pari
  alternative: na siya noon ang punong pari
  rationale: Present tense ang ἐστίν. Natural sa Tagalog ang sugnay na walang tahasang pandiwang panahunan, kaya napapanatili ang anyo at diwa nang hindi sapilitang ginagawang nakaraan.
- issue: Paglalahad ng sipi mula sa Kasulatan
  choice: sapagkat nasusulat
  alternative: sapagkat sinasabi ng Kasulatan
  rationale: Pinananatili nito ang pormulang γέγραπται at ang awtoritatibong bigat ng nakasulat na sipi nang walang idinadagdag na denominasyonal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “punong pari” bilang madaling maunawaang tawag sa ἀρχιερεύς at “mga kapatid” bilang karaniwang bokatibong panawagan. Iniwasan ang lipas o labis na teknikal na pananalita habang pinananatili ang anyo ng sipi sa Kasulatan.
