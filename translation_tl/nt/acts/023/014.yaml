  to: Lumapit ang mga lalaking ito sa mga punong pari at sa mga nakatatanda at sinabi, “Isinumpa namin ang aming sarili[a] na hindi titikim ng anuman hanggang sa mapatay namin si Pablo.”
  rationale: Pinalitan ang "mga matatandang pinuno" ng "mga nakatatanda" upang maipakita ang institusyonal na pangkat ng mga elder nang hindi labis na inuugnay ang termino sa edad. Pinasimple ang pormula ng panata sa "Isinumpa namin ang aming sarili," na tuwiran, likas, at pinananatili ang sariling sumpang ipinahahayag ng Griyego; nasa talababa ang mas literal na anyo at paliwanag.
