  text: οἵτινες προσελθόντες τοῖς ἀρχιερεῦσιν καὶ τοῖς πρεσβυτέροις εἶπαν· Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς μηδενὸς γεύσασθαι ἕως οὗ ἀποκτείνωμεν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/014.yaml
  text: These men came to the chief priests and the elders and said[a], “We have bound ourselves under a curse to taste nothing until we kill Paul.”
translation:
  language: tl
  text: Lumapit ang mga lalaking ito sa mga punong pari at sa mga nakatatanda at sinabi, “Isinumpa namin ang aming sarili[a] na hindi titikim ng anuman hanggang sa mapatay namin si Pablo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “Sa pamamagitan ng sumpa ay isinumpa namin ang aming sarili.” Ang Griyego ay tumutukoy sa isang panatang may sumpang ipinapataw ng mga nanunumpa sa kanilang sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: ang mga lalaking ito
  rationale: Tumutukoy ito sa mga kasabwat na binanggit sa naunang talata; ginagawang malinaw ang tinutukoy sa natural na salaysay sa Filipino.
- source_word: προσελθόντες
  choice: lumapit
  rationale: Ipinapakita ng aorist participle ang kilos na nauna sa pagsasalita; maikli at likas itong salin sa Filipino.
- source_word: ἀρχιερεῦσιν
  choice: mga punong pari
  rationale: Karaniwang tawag sa kolektibong pangkat ng mga nakatataas na paring Judio sa kontekstong ito.
- source_word: πρεσβυτέροις
  choice: mga matatandang pinuno
  rationale: Sa kontekstong institusyonal, mga kinikilalang lider ang tinutukoy, hindi lamang matatandang lalaki.
- source_word: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: isinailalim namin ang aming sarili sa isang sumpa
  rationale: Ipinahahayag nito ang isang panatang may sumpang babagsak sa mismong nanunumpa kapag hindi niya tinupad ang pangako. Iniiwasan ng salin ang teknikal at mas huling gamit ng salitang “anatema.”
- source_word: μηδενὸς γεύσασθαι
  choice: hindi titikim ng anuman
  rationale: Pinananatili ang literal na larawan ng γεύομαι at ang ganap na pagtanggi ng μηδενός; nauunawaan sa konteksto bilang hindi pagkain o pag-inom.
- source_word: ἕως οὗ ἀποκτείνωμεν
  choice: hanggang sa mapatay namin
  rationale: Ipinapakita ang takdang hangganan ng kanilang panata at ang pinaplanong pangyayari nang hindi nagdaragdag ng legal na katawagang gaya ng “paslangin.”
- source_word: τὸν Παῦλον
  choice: si Pablo
  rationale: Ginagamit ang nakaugaliang anyo ng pangalan sa Filipino.
theological_decisions:
- issue: Kahulugan ng pormulang panunumpa na Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: isinailalim namin ang aming sarili sa isang sumpa
  alternative: mahigpit kaming nanumpa
  rationale: Pinananatili ng piniling salin ang sariling sumpang kaakibat ng panata, sa halip na gawing pangkalahatang taimtim na pangako lamang o gamitin ang katawagang pansimbahang “anatema.”
translation_notes:
  register: Makabago at malinaw na Filipino na may marangal na himig. Ginamit ang “mga matatandang pinuno” upang linawin ang tungkulin ng mga elder, at inilagay ang mas literal na pormula ng sumpa sa talababa dahil magiging mabigat at di-likas iyon sa pangunahing teksto.
