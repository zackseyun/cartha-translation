  naturalness: Marangal at malinaw ang kabuuang himig, ngunit mas likas ang “paratang na ibinibintang nila sa kanya” kaysa “paratang na isinasakdal nila laban sa kanya.” Ang “kanilang konseho” ay mas malinaw na terminong pampamahalaan/hudisyal kaysa “kapulungan” sa kontekstong ito.
  terminology: Ang “paratang” ay angkop para sa αἰτία sa kontekstong legal. Isinasalin ng “konseho” ang συνέδριον nang hindi ipinipilit ang “Sanhedrin”; ang huli ay dapat manatiling alternatibo sa talababa.
