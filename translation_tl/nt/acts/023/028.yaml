  yaml_path: translation/nt/acts/023/028.yaml
  text: And wanting to know the charge for which they were accusing him[a], I brought him down to their council.
translation:
  language: tl
  text: At sa pagnanais kong malaman ang paratang na ibinibintang nila sa kanya, dinala ko siya pababa sa kanilang konseho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanilang Sanhedrin.” Ang salitang Griyego na συνέδριον ay tumutukoy sa isang konseho; sa kontekstong ito, malamang na ito ang namumunong konseho ng mga Hudyo sa Jerusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενός τε ἐπιγνῶναι
  choice: At dahil nais kong malaman
  rationale: Ipinahahayag ng participle ang layunin o motibo ni Lisias, habang pinananatili ng “At” ang banayad na dugtong ng τε sa naunang pangungusap.
- source_word: τὴν αἰτίαν
  choice: ang paratang
  rationale: Sa kontekstong legal, tumutukoy ang αἰτία sa saligan o nilalaman ng sakdal, kaya mas angkop ang “paratang” kaysa sa pangkalahatang “dahilan.”
- source_word: δι’ ἣν ἐνεκάλουν αὐτῷ
  choice: na isinasakdal nila laban sa kanya
  rationale: Ipinakikita ng aspektong imperfect ang nagpapatuloy na pagsasakdal, at malinaw na naihahayag ng “laban sa kanya” ang diwang adversatibo ng datibo sa ἐγκαλέω.
- source_word: κατήγαγον
  choice: dinala ko siya
  rationale: Natural ito sa modernong Tagalog. Hindi isinama ang literal na “pababa” sapagkat maaaring maging pilit o magpahiwatig ng tiyak na topograpiya na hindi kailangang idiin sa salin.
- source_word: τὸ συνέδριον αὐτῶν
  choice: sa kapulungan nila
  rationale: Ang “kapulungan” ay isang likas at marangal na salin ng συνέδριον at hindi agad naglilimita sa mas espesipikong tradisyonal na katawagang “Sanhedrin.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal, na may bahagyang legal na himig. Ginamit ang “isinasakdal” upang mapanatili ang legal at nagpapatuloy na diwa ng pandiwa, at “kapulungan” upang maisalin ang termino nang hindi labis na tinutukoy ang institusyon sa pangunahing teksto.
