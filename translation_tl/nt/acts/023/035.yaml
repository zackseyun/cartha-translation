  yaml_path: translation/nt/acts/023/035.yaml
  text: “I will hear your case,” he said[b][a], “when your accusers also arrive.” And he ordered that he be kept under guard in Herod’s praetorium.
translation:
  language: tl
  text: “Didinggin ko ang iyong kaso,” sabi niya, “kapag dumating na rin ang mga nagsasakdal sa iyo.” At iniutos niya na bantayan siya sa pretorio[a] ni Herodes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pretorio ay ang opisyal na tirahan o himpilan ng Romanong gobernador; dito, malamang na ang palasyo ni Herodes sa Cesarea.
    reason: cultural_note
lexical_decisions:
- source_word: Διακούσομαί σου
  choice: Didinggin ko ang iyong kaso
  rationale: Ang διακούω ay maaaring magpahiwatig ng lubusang pakikinig o pagdinig sa isang panig. Sa kontekstong legal, likas sa Tagalog ang “didinggin ko ang iyong kaso,” nang hindi ipinipilit sa pangunahing teksto ang tahasang “nang lubusan.”
- source_word: ὅταν καὶ οἱ κατήγοροί σου παραγένωνται
  choice: kapag dumating na rin ang mga nag-aakusa sa iyo
  rationale: Pinananatili ng “kapag” ang panghinaharap na kundisyon ng ὅταν, ng “rin” ang καί, at ng “mga nag-aakusa” ang legal na diwa ng κατήγοροι.
- source_word: κελεύσας
  choice: At iniutos niyang
  rationale: Ginawang pandiwang may hangganan ang aorist participle upang maging natural ang salaysay sa Tagalog habang pinananatili ang kasunod na kilos.
- source_word: ἐν τῷ πραιτωρίῳ τοῦ Ἡρῴδου
  choice: sa pretorio ni Herodes
  rationale: Pinanatili ang makasaysayang terminong πραιτώριον bilang “pretorio,” at nilinaw sa talababa na tumutukoy ito sa opisyal na tirahan o himpilan ng gobernador.
- source_word: φυλάσσεσθαι αὐτόν
  choice: bantayan si Pablo
  rationale: Ipinahahayag ng passive infinitive ang pananatili niya sa ilalim ng pagbabantay. Tahasang ginamit ang pangalang Pablo upang maging malinaw at natural ang reperensiya sa Tagalog.
