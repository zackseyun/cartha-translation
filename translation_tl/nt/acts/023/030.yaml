id: ACT.23.30
reference: Acts 23:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μηνυθείσης δέ μοι ἐπιβουλῆς εἰς τὸν ⸀ἄνδρα ἔσεσθαι ⸀ἐξαυτῆς ἔπεμψα πρὸς σέ, παραγγείλας καὶ τοῖς κατηγόροις ⸀λέγειν πρὸς αὐτὸν ἐπὶ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/030.yaml
  text: And when I was informed that there would be a plot against the man[a], I sent him to you at once, also ordering his accusers to state their case before you.
translation:
  language: tl
  text: Nang ipaalam sa akin na may binabalak laban sa taong ito, agad ko siyang ipinadala sa iyo. Inutusan ko rin ang mga nag-aakusa sa kanya na iharap sa iyo ang kanilang kaso laban sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μηνυθείσης
  choice: Nang ipaalam sa akin
  rationale: Isinasalin ang aorist passive genitive absolute bilang likas na sugnay na temporal habang pinananatili ang diwang pasibo.
- source_word: ἐπιβουλῆς
  choice: may binabalak
  rationale: Ipinahahayag ang isang masamang balak o pakana nang hindi ito nililimitahan sa tiyak na paraang gaya ng pananambang.
- source_word: εἰς τὸν ἄνδρα
  choice: laban sa taong ito
  rationale: Ipinakikita ng “laban sa” ang direksiyon ng masamang balak; nililinaw ng “taong ito” na si Pablo ang tinutukoy sa liham.
- source_word: ἐξαυτῆς
  choice: agad
  rationale: Maikli at natural na katumbas ng adberbyong nagpapahiwatig ng agarang pagkilos.
- source_word: ἔπεμψα πρὸς σέ
  choice: ipinadala sa iyo
  rationale: Likas sa Tagalog ang tahasang layon na “siya,” na malinaw na tumutukoy kay Pablo batay sa konteksto.
- source_word: παραγγείλας καὶ τοῖς κατηγόροις
  choice: Inutusan ko rin ang mga nag-aakusa sa kanya
  rationale: Ginawang hiwalay na pangungusap ang participial construction upang maging malinaw at natural, habang pinananatili ang kasabay na utos sa mga tagapag-akusa.
- source_word: λέγειν πρὸς αὐτὸν
  choice: iharap ... ang kanilang kaso laban sa kanya
  rationale: Ipinakikita ang panghukuman na gamit ng literal na “magsalita sa/laban sa kanya” nang malinaw sa karaniwang mambabasa.
- source_word: ἐπὶ σοῦ
  choice: sa iyo
  rationale: Sa kontekstong panghukuman, nangangahulugan itong iharap ang usapin sa harap at sa awtoridad ni Felix.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na may marangal at malinaw na himig na angkop sa opisyal na liham. Pinili ang “taong ito” sa halip na mas pormal ngunit hindi gaanong likas na “ang lalaki.”
