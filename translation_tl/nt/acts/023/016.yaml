  text: Ἀκούσας δὲ ὁ υἱὸς τῆς ἀδελφῆς Παύλου ⸂τὴν ἐνέδραν⸃ παραγενόμενος καὶ εἰσελθὼν εἰς τὴν παρεμβολὴν ἀπήγγειλεν τῷ Παύλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/016.yaml
  text: But when Paul’s sister’s son heard of the ambush[c][b][a], he came and entered the barracks and reported it to Paul.
translation:
  language: tl
  text: Ngunit nang marinig ng anak na lalaki ng kapatid na babae ni Pablo[a] ang tungkol sa pananambang[b], pumunta siya at pumasok sa himpilan ng mga sundalo[c], at ibinalita iyon kay Pablo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pamangking lalaki ni Pablo”; sa literal, “ang anak na lalaki ng kapatid na babae ni Pablo.”
    reason: lexical_alternative
  - marker: b
    text: O “pakana” o “sabwatan.” Mas tiyak na tumutukoy ang salitang Griyego sa pananambang o palihim na pag-aabang upang sumalakay.
    reason: lexical_alternative
  - marker: c
    text: O “kampo.” Sa kontekstong ito, malamang na tumutukoy ang salita sa kuwartel o himpilan ng mga sundalong Romano.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: nang marinig
  rationale: Ang aorist participle ay nagpapahiwatig ng kilos na nauna sa pangunahing pandiwa. Likas sa Tagalog ang “nang marinig” para sa temporal na ugnayang ito.
- source_word: δὲ
  choice: Ngunit
  rationale: 'Naghuhudyat ang δέ ng pag-usad ng salaysay na may bahagyang pagsalungat: nabunyag ang planong pananambang.'
- source_word: ὁ υἱὸς τῆς ἀδελφῆς Παύλου
  choice: ang anak na lalaki ng kapatid na babae ni Pablo
  rationale: Tahasang pinananatili ang tiyak na ugnayang pampamilya sa Griyego, sa halip na paikliin agad bilang “pamangkin ni Pablo.”
- source_word: τὴν ἐνέδραν
  choice: ang tungkol sa pananambang
  rationale: Ang ἐνέδρα ay tiyak na tumutukoy sa pag-aabang upang salakayin ang isang tao. Pinananatili ng “pananambang” ang kongkretong diwa nito.
- source_word: παραγενόμενος
  choice: pumunta siya
  rationale: Ipinapahayag ng participle ang pagdating niya bago siya pumasok; natural at malinaw sa Tagalog ang “pumunta siya.”
- source_word: εἰσελθὼν εἰς τὴν παρεμβολὴν
  choice: pumasok sa himpilan ng mga sundalo
  rationale: Maaaring mangahulugan ang παρεμβολή ng kampo o kuwartel. Sa konteksto ng pagkakapiit ni Pablo sa ilalim ng mga Romano, ang himpilan ng mga sundalo ang malamang na tinutukoy.
- source_word: ἀπήγγειλεν
  choice: ibinalita iyon
  rationale: Ang ἀπαγγέλλω ay tumutukoy sa paghahatid o pag-uulat ng impormasyon; malinaw na ang “iyon” ay ang nabalitaang pananambang.
- source_word: τῷ Παύλῳ
  choice: kay Pablo
  rationale: Tuwirang isinasalin ang dative indirect object sa natural na pariralang Tagalog.
