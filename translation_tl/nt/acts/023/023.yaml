  source_fidelity: Maayos na naihahatid ng draft ang pagpapatawag sa dalawang senturyon, ang bilang at mga uri ng hukbo, at ang patutunguhang Cesarea. Gayunman, ang hiwalay na pangungusap na “Aalis sila” ay nagdaragdag ng isang tahasang pahayag ng pag-alis na wala sa Griyego. Ang pariralang ἀπὸ τρίτης ὥρας τῆς νυκτός ay pinakamainam na iugnay sa utos bilang panahong magsisimula ang paghahanda/pagkilos, nang hindi nililinaw nang higit kaysa sa teksto kung alin ang eksaktong kilos.
  naturalness: Natural at malinaw ang “ipinatawag,” “senturyon,” “mangangabayo,” at “kawal na may sibat.” Mas matapat at mas maayos ang isang pangungusap na nagpapanatili sa pariralang pang-oras bilang bahagi ng utos.
  terminology: Ang “senturyon” ay angkop para sa ἑκατοντάρχης; ang “mangangabayo” ay malinaw para sa ἱππεῖς. Katanggap-tanggap ang “mga kawal na may sibat” para sa hindi tiyak na δεξιολάβοι, kung may talababa na nagsasaad ng kawalang-katiyakan. Ang “Cesarea” ay wastong anyong Filipino.
