translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at angkop sa salaysay. Ginamit ang ‘kawal’ at ‘mangangabayo’ bilang likas na katawagang militar. Hinati sa dalawang pangungusap ang utos upang maging malinaw na ang pariralang pang-oras ay tumutukoy sa pag-alis, hindi lamang sa paghahanda.
