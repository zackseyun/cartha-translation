  text: Καὶ προσκαλεσάμενός ⸂τινας δύο⸃ τῶν ἑκατονταρχῶν εἶπεν· Ἑτοιμάσατε στρατιώτας διακοσίους ὅπως πορευθῶσιν ἕως Καισαρείας, καὶ ἱππεῖς ἑβδομήκοντα καὶ δεξιολάβους διακοσίους, ἀπὸ τρίτης ὥρας τῆς νυκτός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/023.yaml
  text: And calling two of the centurions to him[a], he said, “Prepare two hundred soldiers to go as far as Caesarea, and seventy horsemen and two hundred spearmen[b], at the third hour of the night.”
translation:
  language: tl
  text: At ipinatawag niya ang dalawa sa mga senturyon at sinabi, “Maghanda kayo ng dalawang daang kawal na pupunta hanggang Cesarea, kasama ang pitumpung mangangabayo at dalawang daang kawal na may sibat[a], simula sa ikatlong oras ng gabi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bantay sa kanang panig”; hindi tiyak ang eksaktong kahulugan ng bihirang terminong isinaling “mga kawal na may sibat.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, mga ikatlong oras mula nang magsimula ang gabi, humigit-kumulang alas nuwebe ng gabi ayon sa pagbibilang ng oras ng mga Judio.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενός
  choice: ipinatawag niya
  rationale: Likas na Filipino para sa pagpapalapit o pagpapaharap ng mga tao sa kaniya, at maayos na ipinakikilala ang pangunahing pandiwang ‘sinabi.’
- source_word: τινας δύο τῶν ἑκατονταρχῶν
  choice: ang dalawa sa mga senturyon
  rationale: Ang τινας δύο ay natural na naipapahayag bilang ‘dalawa’; ang ‘senturyon’ ay nakikilalang katawagan sa Romanong opisyal na namumuno sa humigit-kumulang isang daang kawal.
- source_word: Ἑτοιμάσατε
  choice: Maghanda kayo
  rationale: Tuwirang pautos sa dalawang senturyon; malinaw at natural sa makabagong Filipino.
- source_word: στρατιώτας διακοσίους
  choice: dalawang daang kawal
  rationale: Tuwirang katumbas na pinananatiling hiwalay sa mga mangangabayo at sa ikatlong pangkat ng mga kawal.
- source_word: ὅπως πορευθῶσιν
  choice: na pupunta
  rationale: Ipinahahayag nang natural ang layunin ng paghahanda nang hindi nagpapabigat sa pangungusap.
- source_word: ἕως Καισαρείας
  choice: hanggang Cesarea
  rationale: Pinananatili ang diwa ng ἕως na paglalakbay hanggang sa itinakdang lugar.
- source_word: ἱππεῖς ἑβδομήκοντα
  choice: pitumpung mangangabayo
  rationale: Malinaw at maikli para sa mga nakasakay na kawal.
- source_word: δεξιολάβους διακοσίους
  choice: dalawang daang kawal na may sibat
  rationale: Ang bihirang terminong δεξιολάβος ay hindi tiyak ang eksaktong uri ng kawal. Ang saling ito ay nauunawaan sa kontekstong militar, habang inilalahad sa talababa ang kawalang-katiyakan.
- source_word: ἀπὸ τρίτης ὥρας τῆς νυκτός
  choice: Aalis sila sa ikatlong oras ng gabi
  rationale: Pinananatili ang ἀπό bilang simula ng pagkilos at ang sinaunang paraan ng pagtukoy ng oras; nililinaw sa talababa ang tinatayang modernong oras.
