  to: At ipinatawag niya ang dalawa sa mga senturyon at sinabi, “Maghanda kayo ng dalawang daang kawal na pupunta hanggang Cesarea, kasama ang pitumpung mangangabayo at dalawang daang kawal na may sibat[a], simula sa ikatlong oras ng gabi[b].”
