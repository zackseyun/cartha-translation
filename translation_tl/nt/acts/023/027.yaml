  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὸν ἄνδρα τοῦτον συλλημφθέντα ὑπὸ τῶν Ἰουδαίων καὶ μέλλοντα ἀναιρεῖσθαι ὑπ’ αὐτῶν ἐπιστὰς σὺν τῷ στρατεύματι ⸀ἐξειλάμην, μαθὼν ὅτι Ῥωμαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/027.yaml
  text: This man was seized by the Jews and was about to be killed by them[a], and I came with the troops and rescued him, having learned that he is a Roman.
translation:
  language: tl
  text: Ang taong ito ay dinakip ng mga Judio[a] at malapit na nilang patayin, ngunit dumating ako kasama ang mga kawal at iniligtas ko siya matapos kong malaman na Romano siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taga-Judea.” Maaaring tumukoy ang salitang Griyego sa mga Judio bilang pangkat na etniko at panrelihiyon o sa mga tao ng Judea bilang rehiyon. Dito, malamang na tumutukoy ito sa pulutong o mga kalabang Judio sa Jerusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: συλλημφθέντα
  choice: dinakip
  rationale: Ipinahihiwatig ng pasibong participle ang sapilitang paghuli. Natural ang “dinakip” at hindi nito kinakailangang ipahiwatig ang isang pormal at legal na pag-aresto.
- source_word: Ἰουδαίων
  choice: mga Judio
  rationale: Maaaring tumukoy ang salita sa mga Judio bilang pangkat na etniko-relihiyoso o sa mga taga-Judea. Sa konteksto, tumutukoy ito sa grupong Judio sa Jerusalem na kumakalaban kay Pablo; inilagay sa talababa ang heograpikong alternatibo.
- source_word: μέλλοντα ἀναιρεῖσθαι
  choice: papatayin na sana nila
  rationale: Ipinapahayag ng μέλλω at infinitive ang nalalapit na pangyayari, at ang ἀναιρέω rito ay nangangahulugang pumatay. Malinaw at likas sa Filipino ang pariralang ito, habang ang “sana” ay nagpapakitang hindi natuloy ang nakaambang pagpatay.
- source_word: ἐπιστὰς
  choice: Dumating ako
  rationale: Nagsasaad ang participle ng pagdating o paglapit upang mamagitan. Naipakikita ng kasunod na pagliligtas ang diwa ng interbensiyon nang hindi ito idinaragdag nang tahasan.
- source_word: σὺν τῷ στρατεύματι
  choice: kasama ang mga kawal
  rationale: Tumutukoy ang στράτευμα sa isang pangkat militar. Mas natural sa kasalukuyang Filipino ang “mga kawal” kaysa sa hiram na “tropa,” nang hindi tinutukoy ang eksaktong laki ng pangkat.
- source_word: ἐξειλάμην
  choice: iniligtas ko siya
  rationale: Ang middle form ng ἐξαιρέω ay nangangahulugang magligtas mula sa panganib, na angkop sa nakaambang pagpatay.
- source_word: μαθὼν
  choice: nang malaman ko
  rationale: Pinananatili nito ang ugnayang pangyayari ng aorist participle sa pangunahing pandiwa at ang pagkakasunod na inilalahad mismo ng liham, nang hindi itinutuwid ayon sa naunang salaysay.
- source_word: Ῥωμαῖός ἐστιν
  choice: isa siyang Romano
  rationale: Tuwirang katumbas ito ng Ῥωμαῖος. Ipinahihiwatig ng legal na konteksto ang pagkamamamayang Romano, ngunit hindi iyon ginagawang tahasan sa salin.
theological_decisions:
- issue: Makasaysayan at retorikal na paglalahad sa liham ng kumandante
  choice: Isinalin nang tuwiran ang pahayag ng kumandante at pinanatiling ipinahahayag niyang nalaman niya ang pagiging Romano ni Pablo kaugnay ng pagliligtas.
  alternative: Baguhin o palawakin ang pangungusap upang iayon nang tahasan ang pagkakasunod-sunod sa mas buong salaysay sa Mga Gawa 21–22.
  rationale: Sariling paglalahad ito ni Claudio Lisias, na naglalarawan sa kanyang ginawa sa paraang pabor sa kanya. Hindi dapat lutasin ng salin ang tensiyon sa naunang salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Gumamit ng “mga kawal” para sa likas ngunit dignified na katawagan sa pangkat militar. Hinati sa dalawang pangungusap upang maging madaling unawain habang pinananatili ang koordinasyon at daloy ng Griyego.
