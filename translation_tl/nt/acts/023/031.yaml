base_translation:
  language: en
  yaml_path: translation/nt/acts/023/031.yaml
  text: So the soldiers[a], according to what had been ordered them[b], took Paul and brought him by night to Antipatris.
translation:
  language: tl
  text: Kaya, ayon sa iniutos sa kanila, isinama ng mga kawal si Pablo at dinala siya sa Antipatris sa gabi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ μὲν οὖν στρατιῶται
  choice: Kaya ... ng mga kawal
  rationale: Ang οὖν ay nagpapakita ng pagpapatuloy o bunga sa salaysay, kaya natural ang “Kaya.” Hindi kailangang isalin nang hiwalay ang μέν dahil pang-ugnay ito sa susunod na bahagi ng salaysay.
- source_word: κατὰ τὸ διατεταγμένον αὐτοῖς
  choice: ayon sa iniutos sa kanila
  rationale: Pinananatili nito ang diwang pasibo ng perpektong participle at ang pagtukoy sa utos na naibigay na sa kanila.
- source_word: ἀναλαβόντες
  choice: isinama
  rationale: Ipinahihiwatig ng aorist participle na kinuha nila si Pablo upang sumama sa kanilang paglalakbay. Mas natural dito ang “isinama” kaysa sa literal ngunit posibleng mapanlinlang na “kinuha.”
- source_word: ἤγαγον
  choice: dinala siya
  rationale: Ang ἄγω ay maaaring mangahulugang akayin, ihatid, o dalhin. Dahil may tiyak na patutunguhan at nasa ilalim ng pagbabantay si Pablo, ang “dinala siya” ang malinaw at natural.
- source_word: διὰ νυκτός
  choice: nang gabing iyon
  rationale: Ang pariralang ito ay tumutukoy sa paglalakbay sa panahon ng gabi. Ang “nang gabing iyon” ay likas sa makabagong Tagalog at hindi kinakailangang magpahiwatig na buong magdamag ang paglalakbay.
- source_word: Ἀντιπατρίδα
  choice: Antipatris
  rationale: Isinalin sa karaniwang transliterasyon ang pangalan ng lugar.
