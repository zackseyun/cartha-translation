  yaml_path: translation/nt/acts/023/013.yaml
  text: There were more than forty who had formed this conspiracy[a].
translation:
  language: tl
  text: Mahigit sa apatnapu ang bumuo ng sabwatang ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lampas sa apatnapu.”
    reason: Ibinibigay ang likas na alternatibong pagkakasalin ng πλείους τεσσεράκοντα.
lexical_decisions:
- source_word: πλείους τεσσεράκοντα
  choice: mahigit sa apatnapu
  rationale: 'Likas at malinaw nitong ipinahahayag ang paghahambing na kasama ng bilang: higit sa apatnapu, nang hindi nagdaragdag ng pangngalang wala sa Griyego.'
- source_word: συνωμοσίαν
  choice: sabwatang
  rationale: Ang “sabwat” ay tumutukoy sa lihim na pagkakasundo o pagsasabwatan at angkop sa pormal ngunit madaling maunawaang rehistro.
- source_word: ποιησάμενοι
  choice: bumuo
  rationale: Sa pagkakaugnay nito sa συνωμοσίαν, ipinahihiwatig ng aorist middle participle na ginawa o binuo nila ang sabwatan; natural sa Filipino ang “bumuo ng sabwatan.”
- source_word: ἦσαν δὲ
  choice: '[ipinahayag sa hulma na “Mahigit sa apatnapu ang…”]'
  rationale: Ginawang natural na pangungusap sa Filipino ang eksistensiyal na pahayag. Hindi tahasang isinalin ang mahinang pang-ugnay na δέ sapagkat sapat itong naipahihiwatig ng daloy.
- source_word: οἱ ταύτην τὴν συνωμοσίαν ποιησάμενοι
  choice: ang bumuo ng sabwatang ito
  rationale: Isinasalin nito ang substantival participle bilang likas na sugnay na tumutukoy sa mga taong bumuo ng sabwatan.
