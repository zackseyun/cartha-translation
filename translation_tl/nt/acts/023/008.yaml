id: ACT.23.8
reference: Acts 23:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Σαδδουκαῖοι ⸀μὲν γὰρ λέγουσιν μὴ εἶναι ἀνάστασιν ⸀μήτε ἄγγελον μήτε πνεῦμα, Φαρισαῖοι δὲ ὁμολογοῦσιν τὰ ἀμφότερα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/008.yaml
  text: For the Sadducees say there is no resurrection[a], nor angel nor spirit, but the Pharisees acknowledge both.
translation:
  language: tl
  text: Sapagkat sinasabi ng mga Saduceo na walang muling pagkabuhay, ni anghel ni espiritu; ngunit kinikilala ng mga Pariseo ang dalawang ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “ngunit kinikilala ng mga Pariseo ang lahat ng tatlo”—samakatuwid, ang muling pagkabuhay, anghel, at espiritu. Literal na “pareho” ang sinasabi ng Griyego, na pinakamalapit na tumutukoy sa “anghel” at “espiritu,” ngunit inuunawa ito ng ilan nang mas malawak batay sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: mga Saduceo
  rationale: Karaniwang makabagong Tagalog na transliterasyon ng pangalan ng pangkat na Judio.
- source_word: μὲν γὰρ
  choice: Sapagkat
  rationale: Ipinahahayag nito ang paliwanag sa pagkakahati na binanggit sa konteksto, nang hindi isinasalin nang labis ang bawat partikulo.
- source_word: λέγουσιν
  choice: sinasabi
  rationale: Tuwirang salin ng pangkasalukuyang pandiwang naglalahad ng paniniwala ng mga Saduceo.
- source_word: μὴ εἶναι
  choice: walang
  rationale: Likas at maikling Tagalog para sa pagtanggi sa pag-iral sa sugnay na kasunod ng 'sinasabi.'
- source_word: ἀνάστασιν
  choice: muling pagkabuhay
  rationale: Karaniwang biblikal ngunit malinaw na katawagan sa resurrection bilang isang realidad o kategorya.
- source_word: μήτε ἄγγελον μήτε πνεῦμα
  choice: ni anghel ni espiritu
  rationale: Pinananatili ang magkatugmang pagtanggi at ang isahang anyo ng dalawang pangngalan sa Griyego.
- source_word: Φαρισαῖοι
  choice: mga Pariseo
  rationale: Karaniwang makabagong Tagalog na transliterasyon ng pangalan ng pangkat.
- source_word: ὁμολογοῦσιν
  choice: kinikilala
  rationale: Sa kontekstong ito, nangangahulugang tinatanggap o pinatutunayang totoo; iniiwasan nito ang ibang diwa ng 'ipinapahayag' o 'ikinukumpisal.'
- source_word: τὰ ἀμφότερα
  choice: ang dalawang ito
  rationale: Tapat na pinananatili ang 'kapuwa/dalawa' ng Griyego at likas na itinuturo sa agarang pares na 'anghel' at 'espiritu,' nang hindi ginagawang 'tatlo' sa pangunahing teksto.
theological_decisions:
- issue: Saklaw ng τὰ ἀμφότερα ('ang dalawang ito') sa kinikilala ng mga Pariseo
  choice: Ang pangunahing teksto ay nagpapanatili sa literal na 'ang dalawang ito,' na pinakamalapit na tumutukoy sa anghel at espiritu.
  alternative: Maaaring unawain na kinikilala ng mga Pariseo ang lahat ng tatlo—muling pagkabuhay, anghel, at espiritu.
  rationale: Ang Griyego ay gumagamit ng ἀμφότερα, 'kapuwa' o 'pareho,' hindi ng salitang 'lahat' o 'tatlo.' Gayunman, kabilang sa mas malawak na konteksto ang muling pagkabuhay, kaya pinananatili sa talababa ang posibleng mas malawak na pagkaunawa sa halip na lutasin nang tahimik ang tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'Sapagkat' para sa paliwanag, at pinanatili ang maikli at balanseng paghahambing ng dalawang pangkat. Ang panandang talababa [a] ay inilagay pagkatapos ng sugnay na may tunay na kalabuan.
