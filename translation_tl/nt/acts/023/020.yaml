id: ACT.23.20
reference: Acts 23:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὅτι Οἱ Ἰουδαῖοι συνέθεντο τοῦ ἐρωτῆσαί σε ὅπως αὔριον ⸂τὸν Παῦλον καταγάγῃς εἰς τὸ συνέδριον⸃ ὡς ⸀μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/020.yaml
  text: He said[a], “The Jews have agreed to ask you to bring Paul down to the Sanhedrin tomorrow[b], as though they were going to inquire more accurately about him.”
translation:
  language: tl
  text: Sinabi niya, “Nagkasundo ang mga Judio[a] na hilingin sa iyo na dalhin mo si Pablo pababa sa Sanhedrin[b] bukas, na para bang balak nilang magsiyasat pa nang mas masusi tungkol sa kanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa kontekstong ito, tumutukoy ito sa partikular na pangkat ng mga Judio na kasangkot sa balak laban kay Pablo, hindi sa lahat ng Judio.
    reason: contextual_clarification
  - marker: b
    text: O “kapulungan.” Ang salitang Griyego ay malamang na tumutukoy rito sa Sanhedrin, ang namumunong kapulungang Judio.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέθεντο
  choice: nagkasundo
  rationale: Ipinahahayag ng anyong middle ng pandiwa ang sama-samang pagkakasundo o pagbuo ng isang plano. Hindi likas na nangangahulugang ‘nagsabwatan’ ang salita, bagaman masama ang layunin ayon sa konteksto.
- source_word: τοῦ ἐρωτῆσαί σε
  choice: na hilingin sa iyo
  rationale: Ang articular infinitive ay nagsasaad ng nilalaman o layunin ng kanilang pagkakasundo; mas angkop dito ang magalang na paghiling kaysa karaniwang pagtatanong.
- source_word: καταγάγῃς
  choice: dalhin mo ... pababa
  rationale: Pinananatili nito ang direksiyong ipinahihiwatig ng κατά-, mula sa kuta patungo sa lugar ng kapulungan.
- source_word: συνέδριον
  choice: Sanhedrin
  rationale: Sa kontekstong ito ng Mga Gawa, tumutukoy ang salita sa namumunong kapulungang Judio sa Jerusalem, hindi lamang sa isang pangkalahatang konseho.
- source_word: ὡς
  choice: na para bang
  rationale: Ipinahihiwatig nito ang ikinukunwaring dahilan ng kahilingan nang hindi ginagawang tahasan sa salin ang pandaraya.
- source_word: μέλλον τι ἀκριβέστερον πυνθάνεσθαι
  choice: balak nilang magsiyasat pa nang mas masusi
  rationale: Ipinapakita ng μέλλον ang nilalayon o napipintong gagawin, ng πυνθάνομαι ang pag-alam sa pamamagitan ng pagtatanong o pagsisiyasat, at ng comparative na ἀκριβέστερον ang higit na pagiging masusi o eksakto.
- source_word: περὶ αὐτοῦ
  choice: tungkol sa kanya
  rationale: Direkta at likas na salin ng pariralang pang-ukol.
- source_word: Οἱ Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Pinananatili ang tahasang katawagan ng Griyego. Nililinaw sa talababa na ang tinutukoy ng konteksto ay ang partikular na pangkat na kasangkot sa balak laban kay Pablo.
theological_decisions:
- issue: Saklaw ng katawagang Οἱ Ἰουδαῖοι sa salaysay na may paglalaban
  choice: ang mga Judio
  alternative: ang mga pinunong Judio; ang mga Judeano
  rationale: Hindi tahasang nililimitahan ng Griyego ang katawagan sa mga pinuno, kaya pinananatili ang anyo nito habang nililinaw sa talababa na hindi nito tinutukoy ang lahat ng Judio.
- issue: Kung tahasang tatawaging pagkukunwari ang kanilang sinabi
  choice: na para bang
  alternative: sa pagkukunwaring
  rationale: Pinananatili ng ‘na para bang’ ang puwersa ng ὡς at ang ipinahihiwatig na huwad na dahilan, nang hindi higit na pinatitingkad kaysa sa mismong Griyego.
translation_notes:
  register: Gumamit ng makabago ngunit marangal at madaling maunawaang Filipino. Ang ‘dalhin ... pababa’ ay nagpapanatili sa direksiyong nasa Griyego; ang ‘magsiyasat pa nang mas masusi’ ay likas na nagpapahayag ng paghahangad na makakuha ng mas eksaktong impormasyon.
