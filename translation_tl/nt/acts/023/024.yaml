translation:
  language: tl
  text: At maghanda rin kayo ng mga hayop na masasakyan[a], upang maisakay ninyo si Pablo sa mga iyon at madala ninyo siyang ligtas kay Gobernador Felix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga hayop na sinasakyan”; hindi tinutukoy ng salitang Griyego kung anong uri ng hayop ang mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήνη
  choice: mga hayop na masasakyan
  rationale: Malawak ang kahulugan ng κτήνη at hindi nito tinutukoy kung anong uri ng hayop ang gagamitin. Likas sa Filipino ang pariralang ito at hindi nito ipinapalagay na mga kabayo ang mga iyon.
- source_word: τε
  choice: at ... rin
  rationale: Iniuugnay ng τε ang tagubiling ito sa naunang mga utos; malinaw at likas itong naipapahayag sa Filipino sa pamamagitan ng “at ... rin.”
- source_word: παραστῆσαι
  choice: maghanda kayo
  rationale: Sa konteksto ng utos, ang diwa ay tiyaking nakahanda at magagamit ang mga hayop. Ang “maghanda kayo” ay malinaw na naghahatid ng praktikal na puwersa nito.
- source_word: ἵνα
  choice: upang
  rationale: Ipinakikilala ng ἵνα ang layunin ng paghahanda.
- source_word: ἐπιβιβάσαντες
  choice: maisakay nila si Pablo
  rationale: Ang pandiwa ay nangangahulugang pasakayin ang isang tao. Isinalin ang participle bilang unang kilos sa magkaugnay na serye upang maging natural sa Filipino habang nananatili ang pagkakasunod ng mga kilos.
- source_word: διασώσωσι
  choice: madala siyang ligtas
  rationale: Binibigyang-diin ng διασῴζω ang ligtas na pagdating matapos malampasan ang panganib; ang pariralang ito ay angkop sa konteksto ng armadong paghatid.
- source_word: πρὸς
  choice: kay
  rationale: Ipinahihiwatig ng πρός ang pagdadala patungo sa isang tao; “kay” ang natural na panandang Filipino bago ang pangalan.
- source_word: ἡγεμόνα
  choice: Gobernador
  rationale: Tumutukoy ang ἡγεμών sa pinunong namamahala sa lalawigan; “Gobernador” ang malinaw at karaniwang katawagan sa kontekstong Romano.
