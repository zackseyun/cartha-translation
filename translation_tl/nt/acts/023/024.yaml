translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga hayop na masasakyan” sa halip na “mga kabayo” upang mapanatili ang hindi tiyak na uri ng hayop sa Griyego. Isinalin ang participle at pangunahing pandiwa bilang magkaugnay na mga kilos para sa natural na daloy.
