  text: ὁ μὲν οὖν χιλίαρχος ἀπέλυσε τὸν ⸀νεανίσκον παραγγείλας μηδενὶ ἐκλαλῆσαι ὅτι ταῦτα ἐνεφάνισας πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/022.yaml
  text: So the commander dismissed the young man[a], instructing him, “Tell no one that you have reported these things to me.”
translation:
  language: tl
  text: Kaya pinauwi ng kumander ang binata at inutusan, “Huwag mong sabihin kaninuman na ipinaalam mo sa akin ang mga bagay na ito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιλίαρχος
  choice: kumander
  rationale: Tumutukoy sa mataas na opisyal ng hukbong Romano. Ang “kumander” ay malinaw at natural sa makabagong Filipino nang hindi nagpapasok ng labis na teknikal na ranggo.
- source_word: ἀπέλυσε
  choice: pinauwi
  rationale: Sa konteksto, tinapos ng opisyal ang pakikipag-usap at pinaalis ang binata. Mas natural dito ang “pinauwi” kaysa “pinalaya,” na maaaring magpahiwatig na siya ay nakabilanggo.
- source_word: νεανίσκον
  choice: binata
  rationale: Ipinapahayag nito na siya ay isang batang lalaki o kabataang lalaki; ang “binata” ay maikli, magalang, at natural sa Filipino.
- source_word: παραγγείλας
  choice: inutusan
  rationale: Nagsasaad ito ng may-awtoridad na tagubilin. Ang “inutusan” ay angkop sa direktibang ibinigay ng isang opisyal.
- source_word: μηδενὶ ἐκλαλῆσαι
  choice: Huwag mong sabihin kaninuman
  rationale: Natural at tuwirang ipinapahayag nito ang pagbabawal na ibunyag ang impormasyon sa sinuman.
- source_word: ἐνεφάνισας
  choice: ipinaalam
  rationale: Ang pandiwa ay nangangahulugang ipabatid o iulat ang isang bagay, lalo na sa isang may awtoridad. Ang “ipinaalam” ay natural at hindi labis na teknikal.
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili nito ang pangmaramihang demonstratibo at ang pagtukoy sa impormasyong naibahagi na.
- source_word: πρὸς ἐμέ
  choice: sa akin
  rationale: Likas na Filipino para sa direksiyon ng pagpapaalam o pag-uulat sa kumander.
