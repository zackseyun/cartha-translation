  text: But on the next day[a], after letting the horsemen go on with him, they returned to the barracks.
translation:
  language: tl
  text: Ngunit kinabukasan, pinayagan nilang magpatuloy na kasama niya ang mga kawal na nakasakay sa kabayo, at bumalik sila sa kuwartel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kampo.” Ang salitang Griyego ay maaaring tumukoy sa kampo o himpilang militar; dito, malamang na tumutukoy ito sa kuwartel o tanggulang Romano sa Jerusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Ngunit kinabukasan
  rationale: Ang τῇ ἐπαύριον ay likas na isinasaling “kinabukasan.” Ginamit ang “ngunit” para sa banayad na paglipat o bahagyang pagsalungat na ipinahihiwatig ng δέ sa daloy ng salaysay.
- source_word: ἐάσαντες
  choice: hinayaan nilang
  rationale: Ipinahihiwatig ng aorist participle na pinahintulutan muna nilang magpatuloy ang mga kawal bago sila bumalik; natural itong ipinahayag sa Tagalog sa pamamagitan ng “hinayaan nilang.”
- source_word: τοὺς ἱππεῖς
  choice: ang mga kawal na nakakabayo
  rationale: Tumutukoy ang ἱππεῖς sa mga nakasakay na kawal. Mas malinaw ito sa karaniwang mambabasa kaysa sa teknikal na “kabalyerya” at mas tiyak kaysa sa “mga mangangabayo.”
- source_word: ἀπέρχεσθαι σὺν αὐτῷ
  choice: magpatuloy kasama niya
  rationale: Sa konteksto, nagpatuloy sa paglalakbay ang mga kawal na nakakabayo kasama ni Pablo habang bumalik ang iba. Pinananatili ng “kasama niya” ang di-tahasang pagkakakilanlan ng αὐτῷ sa mismong talata.
- source_word: ὑπέστρεψαν
  choice: bumalik sila
  rationale: Direkta at natural na katumbas ito ng “bumalik” o “nagbalik.”
- source_word: εἰς τὴν παρεμβολήν
  choice: sa kuwartel
  rationale: Maaaring mangahulugan ang παρεμβολή ng kampo o himpilang militar. Sa kontekstong ito, malamang na tinutukoy nito ang kuwartel o tanggulang Romano sa Jerusalem.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga kawal na nakakabayo” sa halip na teknikal na “kabalyerya,” at pinanatili ang panghalip na “niya” sa halip na idagdag ang pangalang Pablo na wala sa tekstong Griyego ng talata.
