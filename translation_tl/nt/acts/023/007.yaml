  text: τοῦτο δὲ αὐτοῦ ⸀λαλοῦντος ἐγένετο στάσις τῶν Φαρισαίων ⸂καὶ Σαδδουκαίων⸃, καὶ ἐσχίσθη τὸ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/007.yaml
  text: And as he was saying this[a], a dispute arose between the Pharisees and Sadducees[b], and the assembly was divided.
translation:
  language: tl
  text: Habang sinasabi niya ito, nagkaroon ng alitan[a] sa pagitan ng mga Pariseo at mga Saduseo, at nahati ang kapulungan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi pagkakasundo.”
    reason: lexical_alternative
  - marker: b
    text: O, “ang mga tao”; o, “ang karamihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ αὐτοῦ λαλοῦντος
  choice: Habang sinasabi niya ito
  rationale: Ang genitive absolute na may present participle ay nagpapahayag ng kilos na kasabay ng sumunod na pangyayari. Likas sa Filipino ang “habang” at malinaw nitong pinananatili ang aspektong nagpapatuloy.
- source_word: ἐγένετο στάσις
  choice: nagkaroon ng alitan
  rationale: Ipinahihiwatig ng ἐγένετο ang pagsisimula o paglitaw ng στάσις. Ang “alitan” ay natural at sapat na malawak upang saklawin ang pagtatalo, hindi pagkakasundo, at pagkakabaha-bahagi.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: sa pagitan ng mga Pariseo at mga Saduseo
  rationale: Bagaman genitive ang anyong Griyego, malinaw na tinutukoy nito ang dalawang magkatunggaling pangkat; “sa pagitan ng” ang natural na katumbas sa Filipino.
- source_word: ἐσχίσθη
  choice: nahati
  rationale: Pinananatili ng “nahati” ang larawan ng paghihiwalay na taglay ng passive na σχίζω nang hindi nagiging labis na literal.
- source_word: τὸ πλῆθος
  choice: ang kapulungan
  rationale: Sa konteksto, tumutukoy ito sa nagkakatipong pangkat sa pagdinig, hindi sa isang di-tiyak na pulutong lamang. Ang “kapulungan” ay dignified at malinaw, habang inilalagay sa talababa ang mas literal na mga alternatibo.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na natural at marangal. Ginamit ang karaniwang anyong “Pariseo” at “Saduseo,” at iniwasan ang labis na pormal o makalumang pananalita.
