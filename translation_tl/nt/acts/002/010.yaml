  source_fidelity: Tapat ang salin sa talaang heograpiko ng Griyego. Ang “sa dakong Cirene” ay angkop na maingat na pagsasalin ng τῆς κατὰ Κυρήνην at hindi nagtatakda ng mas tiyak na hangganang heograpiko. Ang “mga taga-Roma na pansamantalang naninirahan doon” ay wastong naghahatid ng οἱ ἐπιδημοῦντες Ῥωμαῖοι bilang mga Romanong pansamantalang nasa lugar ng pangyayari.
