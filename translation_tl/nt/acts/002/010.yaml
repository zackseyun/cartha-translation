  text: Φρυγίαν τε καὶ Παμφυλίαν, Αἴγυπτον καὶ τὰ μέρη τῆς Λιβύης τῆς κατὰ Κυρήνην, καὶ οἱ ἐπιδημοῦντες Ῥωμαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/010.yaml
  text: Phrygia and Pamphylia[a], Egypt and the parts of Libya toward Cyrene, and the visiting Romans[b],
translation:
  language: tl
  text: Frigia at Pamfilia, Egipto at ang mga bahagi ng Libya sa dakong Cirene[a], at ang mga taga-Roma na pansamantalang naninirahan doon[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga rehiyon ng Libya sa palibot ng Cirene.”
    reason: lexical_alternative
  - marker: b
    text: O “ang mga taga-Roma na pansamantalang namamalagi roon” o “mga bisitang taga-Roma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Φρυγίαν
  choice: Frigia
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan ng rehiyon.
- source_word: τε καὶ
  choice: at
  rationale: Likas na pang-ugnay ito sa Filipino para sa magkakasunod na lugar sa talaan.
- source_word: Παμφυλίαν
  choice: Pamfilia
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan ng rehiyon.
- source_word: Αἴγυπτον
  choice: Egipto
  rationale: Ito ang karaniwang pangalan ng bansa sa modernong Filipino.
- source_word: τὰ μέρη τῆς Λιβύης
  choice: ang mga bahagi ng Libya
  rationale: Pinananatili ng “mga bahagi” ang kongkretong diwa ng μέρη nang malinaw at natural sa Filipino.
- source_word: τῆς κατὰ Κυρήνην
  choice: sa dakong Cirene
  rationale: Ipinahahayag nito ang kaugnayang heograpiko sa Cirene nang hindi tiyakang ipinapalagay kung ang ibig sabihin ay “patungo,” “malapit,” o “sa palibot” nito.
- source_word: οἱ ἐπιδημοῦντες Ῥωμαῖοι
  choice: ang mga taga-Roma na pansamantalang naninirahan doon
  rationale: Ipinakikita ng parirala na sila ay mula sa Roma at pansamantalang namamalagi sa lugar na tinutukoy ng konteksto, sa halip na mga permanenteng residente.
