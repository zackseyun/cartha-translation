  naturalness: Natural sa kabuuan ang rehistro, ngunit mas malinaw at mas idiomatiko ang “lahat ng mga ito na nagsasalita” kaysa “lahat ng nagsasalitang ito.” Ang pag-uugnay ng sinabi nila sa unang pangungusap ay mas maayos ding sumasalamin sa participial na λέγοντες.
