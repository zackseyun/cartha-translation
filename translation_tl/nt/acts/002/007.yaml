  to: At labis silang namangha at nagtaka, at sinabi nila, “Tingnan ninyo![a] Hindi ba taga-Galilea ang lahat ng mga ito na nagsasalita?”
  rationale: Inayos ang ayos ng pariralang tumutukoy sa mga nagsasalita upang malinaw na ang “lahat ng mga ito” ang tinutukoy na mga tao. Pinag-ugnay rin ang pagpapahayag ng pagkamangha at ang kasunod na sinabi nila, nang hindi binabago ang kahulugan, antas ng katiyakan, o panrehiyong katawagan sa pinagmulan ng mga nagsasalita.
