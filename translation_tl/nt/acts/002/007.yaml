base_translation:
  language: en
  yaml_path: translation/nt/acts/002/007.yaml
  text: And they were astonished and amazed[a], saying, “Look, are not all these who are speaking Galileans?”
translation:
  language: tl
  text: At labis silang namangha at nagtaka, at sinabi nila, “Tingnan ninyo![a] Hindi ba taga-Galilea ang lahat ng mga ito na nagsasalita?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Masdan ninyo!”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: labis silang namangha
  rationale: Ipinahahayag ng di-ganap na anyo ang matinding pagkagulat o pagkamangha. Ang “labis silang namangha” ay natural sa modernong Tagalog at pinananatili ang lakas ng pandiwa.
- source_word: δὲ
  choice: At
  rationale: Banayad itong pang-ugnay na nagpapatuloy sa salaysay; natural dito ang “At.”
- source_word: καὶ
  choice: at
  rationale: Pinag-uugnay nito ang dalawang reaksiyon bilang magkasabay at pinagsama-samang tugon.
- source_word: ἐθαύμαζον
  choice: nagtaka
  rationale: Saklaw ng pandiwa ang pagtataka o paghanga. Ang “nagtaka” ay malinaw at nakatutulong na mapanatiling magkaiba ang dalawang magkalapit na reaksiyon.
- source_word: λέγοντες
  choice: Sinabi nila
  rationale: Ipinakikilala ng participle ang nilalaman ng kanilang sinabi. Ginawang hiwalay na pangungusap para sa natural at malinaw na daloy sa Tagalog.
- source_word: Οὐχ
  choice: Hindi ba
  rationale: Ang negatibong tanong ay umaasang sasang-ayon ang kausap; tuwirang naipahahayag ito ng “Hindi ba.”
- source_word: ἰδοὺ
  choice: Tingnan ninyo
  rationale: Pantawag-pansin ito. Ang “Tingnan ninyo” ay kasalukuyan, malinaw, at may angkop na puwersang panturo.
- source_word: πάντες οὗτοί
  choice: lahat ... ito
  rationale: Tumutukoy ito sa buong pangkat na pinag-uusapan nang hindi nagdaragdag ng salitang “mga lalaki,” na hindi tahasang nasa Griyego.
- source_word: οἱ λαλοῦντες
  choice: mga nagsasalita
  rationale: Ang substantival present participle ay tumutukoy sa mga taong kasalukuyang nagsasalita.
- source_word: Γαλιλαῖοι
  choice: mga taga-Galilea
  rationale: Ito ang natural na katawagang Tagalog para sa mga taong mula sa Galilea at hindi nagdaragdag ng paliwanag tungkol sa kanilang katayuan o pananalita.
theological_decisions:
- issue: Ipinahihiwatig na panlipunan o panrehiyong puwersa ng “mga taga-Galilea”
  choice: Pinanatili ang payak na katawagang panrehiyon na “mga taga-Galilea.”
  alternative: “mga taga-Galilea na walang pinag-aralan” o paliwanag tungkol sa kanilang punto
  rationale: Ipinakikita ng talata ang pagkagulat sa kanilang pagiging taga-Galilea ngunit hindi nito tahasang sinasabi ang dahilan. Ang pagdaragdag ng katayuan, edukasyon, o punto ay magpapasok ng hinuha sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinanatili ang dalawang magkalapit ngunit hindi lubos na magkaparehong reaksiyon sa “labis na namangha at nagtaka,” at hindi ipinaliwanag nang higit sa teksto ang kabuluhan ng pagiging taga-Galilea.
