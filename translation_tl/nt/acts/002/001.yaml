id: ACT.2.1
reference: Acts 2:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἐν τῷ συμπληροῦσθαι τὴν ἡμέραν τῆς πεντηκοστῆς ἦσαν ⸂πάντες ὁμοῦ⸃ ἐπὶ τὸ αὐτό,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/001.yaml
  text: And when the day of Pentecost had fully come[a], they were all together in one place.
translation:
  language: tl
  text: Nang sumapit na ang araw ng Pentecostes[a], silang lahat ay magkakasama sa iisang lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “habang sumasapit sa kaganapan ang araw ng Pentecostes.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συμπληροῦσθαι
  choice: sumapit na
  rationale: Ang temporal na pariralang ἐν τῷ συμπληροῦσθαι ay nagsasaad na ang itinakdang araw ay sumapit o umabot sa kaganapan nito. Likas sa modernong Tagalog ang “nang sumapit na,” samantalang ang mas literal na “habang natutupad” ay maaaring magbigay ng di-inaasahang teolohikal na diin. Inilalagay sa talababa ang alternatibong nagpapakita ng aspektong progresibo.
- source_word: πεντηκοστῆς
  choice: Pentecostes
  rationale: Ang “Pentecostes” ang nakaugaliang pangalan sa Tagalog para sa kapistahang Judio na tinutukoy ng Griyegong Πεντηκοστή; pinananatili nito ang terminong ginamit sa salaysay sa halip na palitan ng pangalang mula sa Hebreong tradisyon.
- source_word: πάντες
  choice: silang lahat
  rationale: Malinaw at likas nitong ipinahihiwatig ang kabuuan ng grupong tinutukoy sa naunang konteksto.
- source_word: ὁμοῦ
  choice: magkakasama
  rationale: Tuwirang ipinapahayag nito ang pagiging magkakasama ng buong pangkat.
- source_word: ἐπὶ τὸ αὐτό
  choice: sa iisang lugar
  rationale: Pinananatili nito ang posibleng lokatibong diwa ng idyoma at iniiwasang ulitin lamang ang kahulugan ng ὁμοῦ.
theological_decisions:
- issue: Hindi tahasang binanggit na simuno ng ἦσαν
  choice: silang lahat
  alternative: lahat ay
  rationale: Kinukuha ang tinutukoy na pangkat mula sa naunang konteksto nang hindi tinutukoy kung ang saklaw nito ay ang Labindalawa lamang o ang mas malawak na pangkat; sa gayon ay hindi nilulutas ng salin ang isang bagay na hindi tahasang nilinaw ng talata.
- issue: Diwa ng συμπληροῦσθαι sa temporal na parirala
  choice: sumapit na
  alternative: habang sumasapit sa kaganapan
  rationale: Ang pangunahing teksto ay natural sa Tagalog at nagpapahayag ng pagdating ng itinakdang araw. Pinananatili ng talababa ang posibleng prosesong diwa ng present passive infinitive nang hindi ito ginagawang hiwalay na doktrinal na pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “iisang lugar” upang mapanatili ang pagkakaiba ng ὁμοῦ at ἐπὶ τὸ αὐτό, at iniwasan ang labis na literal ngunit alanganing “natutupad ang araw.”
