  text: καὶ ἐπλήσθησαν ⸀πάντες πνεύματος ἁγίου, καὶ ἤρξαντο λαλεῖν ἑτέραις γλώσσαις καθὼς τὸ πνεῦμα ἐδίδου ⸂ἀποφθέγγεσθαι αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/004.yaml
  text: And they were all filled with the Holy Spirit and began to speak in other tongues[a], as the Spirit was giving them utterance.
translation:
  language: tl
  text: Napuspos silang lahat ng Banal na Espiritu at nagsimulang magsalita sa ibang mga wika[a], ayon sa ipinagkakaloob ng Espiritu sa kanila na kakayahang magsalita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ibang mga dila.” Maaaring mangahulugan ang salitang Griyego ng “mga dila” o “mga wika”; ipinakikita ng kasunod na konteksto na naunawaan ng mga nakikinig ang sinasalita bilang tunay na mga wikang ginagamit ng mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: napuspos
  rationale: Ang aorist passive ng πίμπλημι ay tumutukoy sa pagkapuno o pagkakalooban ng kapangyarihan. Ang “napuspos” ay likas at marangal na katumbas sa kontekstong ito.
- source_word: πάντες
  choice: silang lahat
  rationale: Malinaw nitong ipinahahayag na saklaw ang buong pangkat na naroon.
- source_word: πνεύματος ἁγίου
  choice: ng Banal na Espiritu
  rationale: Sa konteksto ng Mga Gawa 2, tumutukoy ito sa banal na Espiritung ipinangako ni Jesus at kumikilos bilang tagapagbigay ng kakayahang magsalita.
- source_word: ἤρξαντο λαλεῖν
  choice: nagsimulang magsalita
  rationale: Pinananatili nito ang ingressive na diwa ng ἄρχομαι kasama ng infinitive—ang pagsisimula ng kilos sa salaysay.
- source_word: ἑτέραις γλώσσαις
  choice: sa ibang mga wika
  rationale: Maaaring mangahulugan ang γλῶσσαις ng mga dila o mga wika. Ang “mga wika” ay natural sa makabagong Filipino at kaayon ng paglalarawan sa Mga Gawa 2:6–11, habang inilalahad sa talababa ang literal at leksikal na alternatibo.
- source_word: καθὼς
  choice: ayon sa
  rationale: Ipinakikita nito na ang kanilang pagsasalita ay naaayon sa ipinagkakaloob ng Espiritu.
- source_word: ἐδίδου
  choice: ipinagkakaloob
  rationale: Ang aspektong di-ganap ng imperfect ay naipahihiwatig ng pangkasalukuyang anyong “ipinagkakaloob,” na naglalarawan ng patuloy na pagkilos habang nagsasalita sila.
- source_word: ἀποφθέγγεσθαι
  choice: na ipahayag
  rationale: Ang pandiwa ay tumutukoy sa malinaw o hayagang pagbigkas, kung minsan ay may maringal o pampublikong himig. Ang “ipahayag” ay mas angkop kaysa sa simpleng “sabihin” nang hindi ito nililimitahan sa propesiya.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Likas itong katumbas ng dative na tumutukoy sa mga tumatanggap ng ipinagkakaloob ng Espiritu.
theological_decisions:
- issue: Kung ang πνεύματος ἁγίου ay personal na pagtukoy sa banal na Espiritu o pangkalahatang “banal na espiritu.”
  choice: Banal na Espiritu
  alternative: banal na espiritu
  rationale: Sa daloy ng Mga Gawa 2, ang tinutukoy ay ang tiyak na banal na Espiritung ipinangako ni Jesus at siyang kumikilos sa kasunod na sugnay.
- issue: Kung ang γλώσσαις ay isasaling “mga dila” o “mga wika.”
  choice: ibang mga wika
  alternative: ibang mga dila
  rationale: Parehong saklaw ng salitang Griyego ang mga kahulugang ito. Pinili ang natural na “mga wika” dahil ipinakikita ng kasunod na konteksto na nakilala ng mga nakikinig ang sarili nilang mga wika; pinananatili naman sa talababa ang literal na alternatibo upang hindi maitago ang lawak ng salitang Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “napuspos” bilang kinikilalang salitang biblikal na nauunawaan pa rin sa kasalukuyan. Iniwasan ang katawagang nakatali sa isang partikular na denominasyonal na paliwanag.
