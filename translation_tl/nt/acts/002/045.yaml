  text: καὶ τὰ κτήματα καὶ τὰς ὑπάρξεις ἐπίπρασκον καὶ διεμέριζον αὐτὰ πᾶσιν καθότι ἄν τις χρείαν εἶχεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/045.yaml
  text: And they were selling their property and possessions and distributing them to all[a], as anyone had need.
translation:
  language: tl
  text: Ipinagbibili nila ang kanilang mga ari-arian at mga pag-aari[a], at ipinapamahagi nila ang mga iyon sa lahat, ayon sa pangangailangan ng bawat isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga lupain at mga pag-aari.” Malamang na pinag-iiba ng dalawang salitang Griyego ang mga uri ng pagmamay-ari: ang κτήματα ay madalas tumukoy sa mga lupain o ari-arian, at ang ὑπάρξεις naman sa mga pag-aari sa mas pangkalahatang diwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήματα
  choice: mga ari-arian
  rationale: Karaniwang tumutukoy sa mga pag-aaring nakuha, madalas ay lupain o iba pang hindi natitinag na ari-arian; pinananatili nitong naiiba ang salita sa kasunod na ὑπάρξεις.
- source_word: ὑπάρξεις
  choice: mga pag-aari
  rationale: Tumutukoy sa mga bagay o kagamitan na pagmamay-ari; ang pariralang ito ay likas sa modernong Tagalog at sapat na naiiba sa 'mga ari-arian.'
- source_word: ἐπίπρασκον
  choice: ipinagbibili nila
  rationale: Ipinahihiwatig ng imperpektong panahunan ang nagpapatuloy o paulit-ulit na pagbebenta sa nakaraan, hindi lamang isang minsanang natapos na kilos.
- source_word: διεμέριζον
  choice: ipinamahagi
  rationale: Likas na inilalarawan ang paghahati at pagbibigay sa komunidad nang hindi tinutukoy kung ano mismo ang paraan ng pamamahagi.
- source_word: αὐτά
  choice: ang mga iyon
  rationale: Pinananatili ang panghalip ng Griyego at hindi tahasang ipinapalagay na 'napagbentahan' lamang ang tinutukoy, bagaman maaari itong maunawaan sa konteksto.
- source_word: πᾶσιν
  choice: sa lahat
  rationale: Tapat at maikli para sa malawak na pagtukoy sa mga tumatanggap sa loob ng konteksto ng komunidad.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: ayon sa pangangailangan ng bawat isa
  rationale: Likas na Tagalog na naghahayag na ang pamamahagi ay nakaayon sa indibidwal na pangangailangan at pinananatili ang di-tiyak na saklaw ng τις.
theological_decisions:
- issue: Ang katangian ng pagbabahagi ng mga mananampalataya
  choice: Inilalarawan ng talata ang nagpapatuloy o paulit-ulit na pagbebenta at pamamahagi ayon sa pangangailangan, nang hindi sinasabing pormal na inalis ang pribadong pagmamay-ari.
  alternative: Itinuturo ng talata ang ganap na sama-samang pagmamay-ari bilang tuntunin para sa lahat ng Kristiyano.
  rationale: Ang mga pandiwang imperpekto ay naglalarawan ng nagpapatuloy o paulit-ulit na gawain. Hindi tahasang sinasabi ng teksto na nagwakas ang lahat ng pribadong pagmamay-ari o na pangkalahatang utos ito, kaya nananatiling deskriptibo ang salin.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang 'ipinagbibili' upang ihayag ang paulit-ulit o nagpapatuloy na kilos, at iniwasang gawing tahasan ang 'napagbentahan' dahil αὐτά ay nananatiling panghalip sa Griyego.
