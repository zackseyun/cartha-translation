base_translation:
  language: en
  yaml_path: translation/nt/acts/002/041.yaml
  text: So those who received his word were baptized[a], and about three thousand souls were added on that day.
translation:
  language: tl
  text: Kaya ang mga tumanggap ng kanyang salita ay binautismuhan, at noong araw na iyon ay nadagdag ang humigit-kumulang tatlong libong kaluluwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga tao.” Ang salitang Griyego na isinaling “mga kaluluwa” ay karaniwang paraan ng pagbilang sa mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν οὖν
  choice: Kaya ang mga
  rationale: Ipinahihiwatig ng mga kataga ang bunga at pagpapatuloy ng salaysay mula sa naunang pangangaral. Natural sa makabagong Tagalog ang “Kaya ang mga” nang hindi labis na pinatitindi ang lohikal na ugnayan.
- source_word: ἀποδεξάμενοι
  choice: tumanggap
  rationale: Ipinapahayag ng pandiwa ang positibong pagtanggap sa ipinahayag. Malawak at natural ang “tumanggap” at hindi nito dinaragdagan ang teksto ng mas tahasang interpretasyon.
- source_word: τὸν λόγον αὐτοῦ
  choice: sa kanyang salita
  rationale: Tumutukoy ang λόγος sa ipinahayag na mensahe ni Pedro. Pinananatili ng “salita” ang malapit na ugnayan sa salitang Griyego at nauunawaan sa konteksto bilang kanyang ipinangaral.
- source_word: ἐβαπτίσθησαν
  choice: binautismuhan
  rationale: Tuwirang ipinapahayag ng anyong balintiyak na naganap sa kanila ang bautismo, nang walang idinadagdag na pananaw tungkol sa paraan o bisa nito.
- source_word: προσετέθησαν
  choice: nadagdag
  rationale: Pinananatili ng “nadagdag” ang balintiyak na anyo at hindi tahasang tinutukoy kung kanino o saan sila nadagdag, sapagkat hindi iyon nakasaad sa talata.
- source_word: ψυχαὶ
  choice: kaluluwa
  rationale: Malapit itong katumbas ng salitang Griyego, ngunit maaari ring gamitin ang ψυχή bilang pagtukoy sa buong tao. Nililinaw sa talababa ang karaniwang kahulugang ito upang maiwasang ituring ang salita bilang tiyak na pahayag tungkol sa sangkap ng tao.
- source_word: ὡσεὶ τρισχίλιαι
  choice: humigit-kumulang tatlong libo
  rationale: Malinaw at likas na ipinahihiwatig ng “humigit-kumulang” ang pagtatantiya sa ὡσεί.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: nang araw na iyon
  rationale: Ito ang natural na pariralang temporal sa Tagalog para sa pangyayaring naganap sa tinutukoy na araw.
theological_decisions:
- issue: Kung tahasang tutukuyin ang pangkat na dinagdagan
  choice: 'Iniwan itong di-tiyak: “nadagdag”'
  alternative: “nadagdag sa kanila” o “nadagdag sa iglesya”
  rationale: Walang tahasang layon ang προσετέθησαν sa talatang ito. Ipinahihiwatig ng konteksto ang pagsama sa pamayanan ng mga mananampalataya, ngunit hindi ito dinagdagan sa salin.
- issue: Ang kahulugang antropolohikal ng ψυχαί
  choice: “kaluluwa” sa pangunahing teksto, na may talababa tungkol sa kahulugang “mga tao”
  alternative: “mga tao” o “mga katao”
  rationale: Pinananatili ng pangunahing teksto ang leksikal na anyo, habang kinikilala ng talababa na karaniwang ginagamit ang salitang Griyego sa pagbilang ng buong mga tao at hindi kinakailangang bilang teknikal na pahayag tungkol sa isang di-materyal na bahagi.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang bahagyang biblikal na “salita” at “kaluluwa,” ngunit ginawang natural ang ayos ng pangungusap at nilinaw sa talababa ang idyomatikong gamit ng ψυχαί.
