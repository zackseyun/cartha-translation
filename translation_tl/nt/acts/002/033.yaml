review_pass:
  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tama: ang pagdakila ni Jesus, ang pagtanggap mula sa Ama, at ang pagbubuhos ay naipapahayag. Gayunman, ang “ibinuhos niya ang nakikita at naririnig ninyo ngayon” ay hindi malinaw na isinasalin ang demonstratibong τοῦτο (“ito”) na nililinaw ng kasunod na sugnay, at ang “ngayon” ay idinagdag kahit wala sa Griyego.'
  naturalness: Makabago at natural ang karamihan ng wika. Mas malinaw at mas maayos ang “ibinuhos niya ito—ang nakikita at naririnig ninyo mismo,” sapagkat pinananatili nito ang ugnayan ng “ito” at ng nakikitang/naririnig na pangyayari.
  terminology: Ang “sa kanan ng Diyos,” “Ama,” at “Banal na Espiritu” ay angkop at marangal na mga katawagan. Ang “ipinangakong Banal na Espiritu” ay isang pinahihintulutang idiomatikong pagbasa, habang wastong pinananatili sa talababa ang alternatibong pagbasa tungkol sa pangako.
  issues:
  - severity: medium
    issue: Hindi tahasang naisasalin ang τοῦτο (“ito”).
    rationale: Ginagawang tuwirang layon ng “ibinuhos” ang “ang nakikita at naririnig ninyo,” samantalang ang Griyego ay “ibinuhos niya ito, na siya ninyong nakikita at naririnig.” Dapat manatili ang demonstratibo upang hindi mabago ang estruktura at upang mapanatili ang maingat na pagtukoy ng teksto.
  - severity: low
    issue: Idinagdag ang “ngayon.”
    rationale: Bagaman ang kasalukuyang mga pandiwa ay tumutukoy sa agarang karanasan ng mga tagapakinig, walang katumbas na salitang “ngayon” sa pinagmulang teksto. Hindi ito kailangan upang maging natural ang Filipino.
  - severity: low
    issue: Hindi naipapakita ang diin ng tahasang ὑμεῖς.
    rationale: Ang “ninyo mismo” ay natural na paraan upang maipahayag ang diin na “kayo mismo,” nang hindi nagiging mabigat ang pangungusap.
