revisions:
- from: Kaya, matapos siyang itaas sa kanan ng Diyos[a] at tanggapin mula sa Ama ang ipinangakong Banal na Espiritu[b], ibinuhos niya ang nakikita at naririnig ninyo ngayon.
  to: Kaya, nang maitaas siya sa kanan ng Diyos[a] at matanggap niya mula sa Ama ang ipinangakong Banal na Espiritu[b], ibinuhos niya ito—ang nakikita at naririnig ninyo mismo.
