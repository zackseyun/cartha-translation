  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τῇ δεξιᾷ οὖν τοῦ θεοῦ ὑψωθεὶς τήν τε ἐπαγγελίαν τοῦ ⸂πνεύματος τοῦ ἁγίου⸃ λαβὼν παρὰ τοῦ πατρὸς ἐξέχεεν τοῦτο ⸀ὃ ⸀ὑμεῖς βλέπετε καὶ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/033.yaml
  text: Therefore[a], having been exalted to the right hand of God, and having received from the Father the promise of the Holy Spirit[b], he has poured out this that you yourselves are seeing and hearing.
translation:
  language: tl
  text: Kaya, nang maitaas siya sa kanan ng Diyos[a] at matanggap niya mula sa Ama ang ipinangakong Banal na Espiritu[b], ibinuhos niya ito—ang nakikita at naririnig ninyo mismo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pamamagitan ng kanang kamay ng Diyos.” Sa Griyego, maaaring tumukoy ang parirala sa kinaroroonan o kalagayan ng pagdakila—“sa kanan”—o sa paraan o kapangyarihang ginamit—“sa pamamagitan ng kanang kamay.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “ang pangako tungkol sa Banal na Espiritu.” Maaaring unawain ang Griyego na ang Espiritu mismo ang ipinangakong kaloob, o na tumutukoy ito sa pangakong nauukol sa Espiritu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δεξιᾷ τοῦ θεοῦ
  choice: sa kanan ng Diyos
  rationale: Pinakamalinaw itong tumutukoy sa marangal na kalagayan sa kanan ng Diyos, alinsunod sa tema ng pagluklok sa konteksto; posible rin ang instrumental na diwa, kaya inilagay iyon sa talababa.
- source_word: οὖν
  choice: Kaya
  rationale: Natural na Filipino para sa pang-ugnay na naghahayag ng kongklusyon o bunga mula sa naunang pangangatwiran.
- source_word: ὑψωθεὶς
  choice: matapos siyang itaas
  rationale: Ipinapakita ang pasibong kilos at ang pagkakauna nito sa pangunahing pandiwang 'ibinuhos'; sa konteksto, ang pagtaas ay may diwa ng pagdakila at pagluklok.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου
  choice: ang ipinangakong Banal na Espiritu
  rationale: Natural na ipinahahayag na ang Espiritu ang ipinangakong kaloob na tinanggap at pagkatapos ay ibinuhos, habang pinananatili sa talababa ang posibleng pagbasa na 'ang pangako tungkol sa Banal na Espiritu.'
- source_word: λαβὼν παρὰ τοῦ πατρὸς
  choice: tanggapin mula sa Ama
  rationale: Pinananatili ang Ama bilang pinagmulan at ipinahahayag ang kilos na nauna sa pagbubuhos.
- source_word: ἐξέχεεν
  choice: ibinuhos niya
  rationale: Ang ganap na kilos ay natural na isinasalin sa Filipino sa aspektong perpektibo; malinaw sa kasunod na sugnay na nakikita pa ang mga bunga nito.
- source_word: τοῦτο ὃ ὑμεῖς βλέπετε καὶ ἀκούετε
  choice: ang nakikita at naririnig ninyo ngayon
  rationale: Natural na Filipino ito para sa demonstratibo at sugnay na pantukoy; ang 'ngayon' ay inilalantad ang kasalukuyang sitwasyong ipinahihiwatig ng mga pandiwang nasa pangkasalukuyan.
theological_decisions:
- issue: Kung ang τῇ δεξιᾷ τοῦ θεοῦ ay nangangahulugang itinaas 'sa kanan' ng Diyos o 'sa pamamagitan ng kanang kamay/kapangyarihan' ng Diyos
  choice: sa kanan ng Diyos
  alternative: sa pamamagitan ng kanang kamay ng Diyos
  rationale: Mas angkop sa konteksto ng pagdakila at pagluklok, lalo na sa kasunod na sipi mula sa Awit 110, ngunit pinahihintulutan ng datibong Griyego ang instrumental na pagbasa kaya pinanatili iyon sa talababa.
- issue: Kung ang τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου ay ang Espiritu bilang ipinangakong kaloob o ang pangakong nauukol sa Espiritu
  choice: ang ipinangakong Banal na Espiritu
  alternative: ang pangako tungkol sa Banal na Espiritu
  rationale: Sinusuportahan ng kasunod na 'ibinuhos' ang pag-unawa na ang Espiritu ang ipinangakong tinanggap, ngunit tunay na may sintaktikong kalabuan kaya inilahad ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kaya” sa halip na mas pormal na “Samakatuwid,” at ang natural na ayos ng mga sugnay upang madaling maunawaan sa pagbasa at pakikinig. Ang mga markang [a] at [b] ay nasa pangunahing teksto at tumutugma sa mga talababa.
