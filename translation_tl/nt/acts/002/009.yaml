translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinananatili ang pagkakaiba ng unang tatlong etnonimo at ng kasunod na mga pangalang heograpiko. Ginamit ang semicolon upang madaling makita ang paglipat mula sa mga bayan patungo sa mga naninirahan sa mga rehiyon.
