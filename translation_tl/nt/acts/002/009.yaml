lexical_decisions:
- source_word: Πάρθοι
  choice: mga Parto
  rationale: Karaniwang anyong Filipino ng tawag sa mga taong mula sa Partia; pinananatili ang etnonimo sa halip na gawing pangalan lamang ng lugar.
- source_word: Μῆδοι
  choice: mga Medo
  rationale: Karaniwang anyong Filipino ng etnonimong tumutukoy sa mga taga-Media.
- source_word: Ἐλαμῖται
  choice: mga Elamita
  rationale: Malinaw at nakaugaliang anyong Filipino para sa mga taong mula sa Elam.
- source_word: οἱ κατοικοῦντες
  choice: mga naninirahan sa
  rationale: Likas na salin ng substantibong pangkasalukuyang pandiwari at pinananatili ang diwa ng mga taong naninirahan sa mga kasunod na rehiyon.
- source_word: τὴν Μεσοποταμίαν
  choice: Mesopotamia
  rationale: Pamantayang pangalang heograpiko sa Filipino; hindi na kailangang katawanin ang artikulong Griyego.
- source_word: Ἰουδαίαν
  choice: Judea
  rationale: Pamilyar na anyong Filipino ng pangalan ng rehiyon at hindi ito pinalalawak tungo sa etniko o panrelihiyong kahulugan.
- source_word: τε καὶ
  choice: at
  rationale: Sa mahabang talaan, likas na koordinasyon sa Filipino ang “at.” Ang bahagyang pandagdag na puwersa ng τε καί ay tunay ngunit hindi kailangang gawing mabigat sa pangunahing teksto; itinatala ang maaaring alternatibo sa talababa.
- source_word: Καππαδοκίαν
  choice: Capadocia
  rationale: Karaniwang anyong Filipino ng pangalan ng rehiyon.
- source_word: Πόντον
  choice: Ponto
  rationale: Karaniwang anyong Filipino ng pangalan ng sinaunang rehiyon.
- source_word: τὴν Ἀσίαν
  choice: Asia
  rationale: Pinananatili ang pangalan sa teksto, samantalang nililinaw sa talababa na ang tinutukoy ay ang probinsiyang Romano at hindi ang makabagong kontinente.
