base_translation:
  language: en
  yaml_path: translation/nt/acts/002/009.yaml
  text: Parthians and Medes and Elamites[a], and those living in Mesopotamia, Judea and Cappadocia, Pontus and Asia[b],
translation:
  language: tl
  text: Mga Parto, mga Medo, at mga Elamita; at mga naninirahan sa Mesopotamia, Judea at Capadocia,[a] Ponto at Asia[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tambalang Griyego na τε καί ay karaniwang maisasaling “at,” ngunit maaari ring magpahiwatig ng bahagyang pandagdag na diin, gaya ng “gayundin.”
