  rationale: Pinalitan ang temporal na “matapos alisin” ng “sa pagkakalag,” upang maipakita ang participial na ugnayan ng λύσας sa “muling binuhay” nang hindi ipinipilit ang pagkakasunod ng panahon. Pinalinaw ang huling sugnay upang mas tapat na maipahayag na hindi kayang patuloy na hawakan ng kamatayan si Jesus. Pinanatili ang leksikal na ambigwidad ng ὠδῖνας at ang panghalip na tumutukoy sa kamatayan sa mga talababa.
