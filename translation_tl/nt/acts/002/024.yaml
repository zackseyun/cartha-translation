  text: ὃν ὁ θεὸς ἀνέστησεν λύσας τὰς ὠδῖνας τοῦ θανάτου, καθότι οὐκ ἦν δυνατὸν κρατεῖσθαι αὐτὸν ὑπ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/024.yaml
  text: whom God raised up[a], having loosed the pains of death[b], because it was not possible for him to be held by it.
translation:
  language: tl
  text: Siya’y muling binuhay ng Diyos sa pagkakalag sa mga hapdi ng kamatayan[a], sapagkat hindi maaaring patuloy siyang hawakan nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang isinaling “mga hapdi” ay maaari ring mangahulugang “mga hapdi ng panganganak.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hawak nito”; pinakamalamang na ang “nito” ay tumutukoy sa kamatayan—“hawak ng kamatayan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: Siya’y
  rationale: Tumutukoy kay Jesus sa naunang talata. Ang panghalip ang pinakanatural sa Filipino, bagaman hindi ganap na matutularan ang anyong relative pronoun ng Griyego.
- source_word: ἀνέστησεν
  choice: muling binuhay
  rationale: Sa konteksto, tumutukoy ito sa ginawa ng Diyos na pagbuhay kay Jesus mula sa kamatayan. Likas at malinaw ang pariralang ito sa modernong Filipino nang hindi gumagamit ng mas teknikal na terminong teolohikal.
- source_word: λύσας
  choice: matapos alisin
  rationale: Ipinahahayag ng aorist participle ang kilos na kaakibat ng muling pagbuhay. Ang “alisin” ay natural kasama ng “mga hapdi” at pinananatili ang diwa ng pagpapakawala o pagkalag, nang hindi ginagawang “mga gapos” ang salitang ὠδῖνας.
- source_word: τὰς ὠδῖνας τοῦ θανάτου
  choice: ang mga hapdi ng kamatayan
  rationale: Maaaring tumukoy ang ὠδῖνας sa matinding kirot o sa hapdi ng panganganak. Ang “mga hapdi” ay malinaw at marangal, habang inilalagay sa talababa ang mas tiyak na larawan ng panganganak.
- source_word: καθότι
  choice: sapagkat
  rationale: Malinaw na nagpapakilala ng dahilan at angkop sa marangal ngunit kasalukuyang rehistro.
- source_word: οὐκ ἦν δυνατὸν
  choice: hindi maaaring
  rationale: Malapit sa impersonal na pahayag ng Griyego at hindi dinaragdagan ang diin lampas sa teksto.
- source_word: κρατεῖσθαι
  choice: manatili siyang hawak
  rationale: Ipinapakita ang patuloy na pagpigil o pagkakahawak ng kamatayan. Mas natural ito sa Filipino kaysa sa literal na “siya’y hawakan.”
- source_word: ὑπ’ αὐτοῦ
  choice: nito
  rationale: Pinananatili ang panghalip ng Griyego; ang pinakamalapit at pinakanatural na tinutukoy nito ay “kamatayan.”
theological_decisions:
- issue: Tinutukoy ng ὑπ’ αὐτοῦ
  choice: Ang panghalip ay tumutukoy sa kamatayan.
  alternative: Maaaring unawain nang literal bilang “niya/niyon,” ngunit hindi natural sa konteksto na tumukoy ito sa Diyos o sa ibang personal na tagaganap.
  rationale: Ang θανάτου ang pinakamalapit at pinakaugnay na antecedent. Ipinapaliwanag ng pangungusap na hindi kayang patuloy na hawakan ng kamatayan si Jesus; pinananatili ng “nito” ang anyong panghalip ng orihinal.
- issue: Kahulugan ng ὠδῖνας
  choice: “mga hapdi” sa pangunahing teksto
  alternative: “mga hapdi ng panganganak” o “matitinding kirot”
  rationale: Saklaw ng salita ang kirot ng panganganak at, sa mas malawak na gamit, matinding hapdi. Hindi nililimitahan ng pangunahing teksto ang larawan, samantalang itinatala ng talababa ang tunay na leksikal na posibilidad.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Iniwasan ang mas teknikal na “muling nabuhay” bilang pangngalan o doktrinal na pormula, at pinanatili ang konkretong larawan ng kamatayan na humahawak kay Jesus.
