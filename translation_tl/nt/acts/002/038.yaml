id: ACT.2.38
reference: Acts 2:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πέτρος δὲ ⸂πρὸς αὐτούς· Μετανοήσατε⸃, καὶ βαπτισθήτω ἕκαστος ὑμῶν ⸀ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν ⸀τῶν ἁμαρτιῶν ⸀ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/038.yaml
  text: And Peter said to them[a], “Repent, and let each of you be baptized in the name of Jesus the Messiah for the forgiveness of your sins[b], and you will receive the gift of the Holy Spirit.”
translation:
  language: tl
  text: At sinabi ni Pedro sa kanila, “Magsisi kayo, at magpabautismo ang bawat isa sa inyo sa pangalan ni Jesus na Mesiyas para sa kapatawaran ng inyong mga kasalanan,[a] at tatanggapin ninyo ang kaloob ng Banal na Espiritu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “para sa kapatawaran ng inyong mga kasalanan” ay tuwirang salin ng Griyego. Magkakaiba ang pagkaunawa kung paano nauugnay rito ang bautismo sa kapatawaran; hindi nilulutas ng salin ang usaping iyon nang lampas sa mismong pananalita ng teksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετανοήσατε
  choice: Magsisi kayo
  rationale: Tuwirang pautos sa maramihan na nananawagan ng tiyak na pagsisisi at pagbabalik-loob; likas at malinaw ito sa modernong Tagalog.
- source_word: βαπτισθήτω ἕκαστος ὑμῶν
  choice: magpabautismo ang bawat isa sa inyo
  rationale: Pinananatili ang pautos, ang pasibong diwa ng pagpapabautismo, at ang distributibong diin ng ἕκαστος sa bawat indibidwal.
- source_word: ἐπὶ τῷ ὀνόματι
  choice: sa pangalan ni
  rationale: Karaniwang katumbas sa konteksto ng bautismo; hindi nito labis na nililimitahan ang posibleng diwa ng batayan, awtoridad, o pagpapahayag ng pananampalataya.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Ipinakikita ang Χριστός bilang titulo sa konteksto ng mesiyanikong pahayag ni Pedro, habang nananatiling natural sa Tagalog.
- source_word: εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: para sa kapatawaran ng inyong mga kasalanan
  rationale: Tuwirang isinasalin ang layon o resultang ipinahihiwatig ng εἰς at pinananatili ang maramihang ‘mga kasalanan’ nang hindi nilulutas ang usaping teolohikal.
- source_word: λήμψεσθε τὴν δωρεὰν
  choice: tatanggapin ninyo ang kaloob
  rationale: Natural na panghinaharap na pangako sa Tagalog; sapat ang ‘kaloob’ upang ipahayag ang δωρεά.
- source_word: τοῦ ἁγίου πνεύματος
  choice: ng Banal na Espiritu
  rationale: Pamantayan, makabago, at marangal na katawagan sa Tagalog.
theological_decisions:
- issue: Ugnayan ng bautismo at kapatawaran sa εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: Isalin nang hayagan bilang “para sa kapatawaran ng inyong mga kasalanan.”
  alternative: “upang mapatawad ang inyong mga kasalanan” o “dahil pinatawad na ang inyong mga kasalanan”
  rationale: Pinananatili ng napiling anyo ang pagkakaugnay sa tekstong Griyego ngunit hindi nagpapasiya kung paano eksaktong nauugnay ang bautismo sa kapatawaran.
- issue: Pagpapakahulugan sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa pangangaral ni Pedro sa Gawa 2, malinaw na aktibo ang kahulugan nito bilang titulong mesiyaniko; ang “Mesiyas” ang naghahayag ng kahulugan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “magpabautismo” bilang likas na pasibong pahayag at ang “Jesus na Mesiyas” upang malinaw na maipakita ang titulo.
