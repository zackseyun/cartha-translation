  text: ἐγνώρισάς μοι ὁδοὺς ζωῆς, πληρώσεις με εὐφροσύνης μετὰ τοῦ προσώπου σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/028.yaml
  text: You made known to me the paths of life[b][a]; you will fill me with gladness with your presence.
translation:
  language: tl
  text: Ipinabatid mo sa akin ang mga landas ng buhay[a]; pupunuin mo ako ng kagalakan sa iyong presensya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga daan ng buhay.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “kasama ng iyong mukha”; isang paraan ng pagsasabing “sa iyong presensya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισάς μοι
  choice: Ipinabatid mo sa akin
  rationale: Tuwirang ipinapahayag ang aorist na kilos at ang di-tuwirang layon na μοι. Natural sa modernong Tagalog ang “ipinabatid” at pinananatili nito ang diwang ‘ginawang malaman.’
- source_word: ὁδοὺς ζωῆς
  choice: ang mga landas ng buhay
  rationale: Pinananatili ng “mga landas” ang kongkreto at maramihang ὁδούς. Hindi tahasang nilulutas ng “ng buhay” kung ang mga ito ay landas na may katangian ng buhay o humahantong sa buhay.
- source_word: πληρώσεις με
  choice: pupunuin mo ako
  rationale: Malinaw at karaniwang katumbas ng future active na ‘you will fill me,’ nang hindi nagdaragdag ng paliwanag.
- source_word: εὐφροσύνης
  choice: ng kagalakan
  rationale: Ang genitive ay nagsasaad ng nilalaman ng pagpuno. Ang “kagalakan” ay natural, marangal, at angkop sa masayang diwa ng εὐφροσύνη.
- source_word: μετὰ τοῦ προσώπου σου
  choice: sa iyong presensya
  rationale: Ang literal na ‘kasama ng iyong mukha’ ay idyomang tumutukoy sa personal na presensya. Inihahatid ng “sa iyong presensya” ang diwa nang malinaw at natural, habang itinatala sa talababa ang literal na larawan.
theological_decisions:
- issue: Ang idyoma ng mukha bilang presensya ng Diyos sa sipi mula sa Awit
  choice: sa iyong presensya
  alternative: kasama ng iyong mukha; sa harap mo
  rationale: Pinananatili ng salin ang kagalakang kaugnay ng agarang presensya ng Diyos nang hindi nagpapasok ng karagdagang doktrinal na paliwanag. Ang literal na anyo ay inilalagay sa talababa upang hindi mawala ang larawan sa Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “landas” upang mapanatili ang kongkretong larawan at ang maramihan, at “presensya” upang natural na maipahayag ang idyoma. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
