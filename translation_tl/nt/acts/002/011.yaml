  text: Ἰουδαῖοί τε καὶ προσήλυτοι, Κρῆτες καὶ Ἄραβες, ἀκούομεν λαλούντων αὐτῶν ταῖς ἡμετέραις γλώσσαις τὰ μεγαλεῖα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/011.yaml
  text: both Jews and proselytes[a], Cretans and Arabs—we hear them speaking in our own languages the mighty works of God.
translation:
  language: tl
  text: Kapuwa mga Judio at mga nagbalik-loob sa Judaismo, mga taga-Creta at mga Arabe—naririnig namin silang nagpapahayag ng mga dakilang gawa ng Diyos sa sarili naming mga wika[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “mga dila.” Ang salitang Griyego ay maaaring mangahulugang “mga dila” o “mga wika”; sa kontekstong ito, mas angkop ang mga makikilalang wika ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖοί
  choice: mga Judio
  rationale: Sa konteksto ng talaan ng mga pangkat na naroon, tumutukoy ito sa bayang Judio, hindi lamang sa mga naninirahan sa Judea.
- source_word: τε καὶ
  choice: at
  rationale: Likas na ipinapahayag ng “at” sa Filipino ang magkaugnay na pagbanggit sa mga Judio at mga nagbalik-loob; magiging pilit dito ang literal na “kapuwa ... at.”
- source_word: προσήλυτοι
  choice: mga nagbalik-loob sa Judaismo
  rationale: Nililinaw nito para sa karaniwang mambabasa na ang tinutukoy ay mga di-Judiong yumakap sa pananampalataya at pamumuhay ng mga Judio.
- source_word: Κρῆτες
  choice: mga taga-Creta
  rationale: Natural na katawagan sa Filipino para sa mga naninirahan o nagmula sa Creta.
- source_word: Ἄραβες
  choice: mga Arabe
  rationale: Kasalukuyan at karaniwang katawagan sa Filipino para sa mga Arab.
- source_word: ἀκούομεν λαλούντων αὐτῶν
  choice: naririnig natin silang nagsasalita
  rationale: Pinananatili ang kasalukuyang tuwirang karanasan ng mga nagsasalita at ang pangkalahatang diwa ng λαλέω.
- source_word: ταῖς ἡμετέραις γλώσσαις
  choice: sa sarili nating mga wika
  rationale: Ipinahahayag ng “sarili nating” ang diin ng ἡμετέραις, at ang “mga wika” ang pinakanatural sa kontekstong nakikilala ng mga tao ang kani-kanilang wika.
- source_word: τὰ μεγαλεῖα τοῦ θεοῦ
  choice: tungkol sa mga dakilang gawa ng Diyos
  rationale: Ang “mga dakilang gawa” ay malinaw at marangal na paglalarawan sa mga kahanga-hanga at makapangyarihang ginawa ng Diyos; idinagdag ang “tungkol sa” upang maging natural ang ugnayan nito sa “nagsasalita” sa Filipino.
theological_decisions:
- issue: Kahulugan ng γλώσσαις sa konteksto ng Pentecostes
  choice: mga makikilalang wika ng tao
  alternative: mga dila o ekstátikong pananalita
  rationale: Binibigyang-diin ng agarang konteksto na naririnig ng maraming pangkat ang pananalita sa kani-kanilang sariling wika. Gayunman, itinatala sa talababa ang literal at mas malawak na saklaw ng salitang Griyego sa halip na burahin ang leksikal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga nagbalik-loob sa Judaismo” sa halip na teknikal na “mga proselita” upang madaling maunawaan, at inilagay ang talababa pagkatapos ng “mga wika,” na siyang salitang tinutukoy nito.
