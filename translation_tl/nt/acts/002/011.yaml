  rationale: Inayos ang salin upang tuwirang maipahayag ang τὰ μεγαλεῖα τοῦ θεοῦ bilang nilalaman ng kanilang pagpapahayag, ginamit ang “namin” para sa tinig ng pangkat na nagsasalita, at idinagdag ang likas na “Kapuwa ... at ...” upang maipakita ang τε καί. Walang binagong kahulugan sa mga pangalan, sa pagkakakilanlan ng mga proselita, o sa pag-unawa sa γλῶσσαι bilang mga wikang nakikilala sa agarang konteksto.
