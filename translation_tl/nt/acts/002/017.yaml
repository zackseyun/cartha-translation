id: ACT.2.17
reference: Acts 2:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἔσται ἐν ταῖς ἐσχάταις ἡμέραις, λέγει ὁ θεός, ἐκχεῶ ἀπὸ τοῦ πνεύματός μου ἐπὶ πᾶσαν σάρκα, καὶ προφητεύσουσιν οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν, καὶ οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται, καὶ οἱ πρεσβύτεροι ὑμῶν ⸀ἐνυπνίοις ἐνυπνιασθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/017.yaml
  text: And it will be in the last days[a], says God, that I will pour out from my Spirit on all flesh, and your sons and your daughters will prophesy, and your young men will see visions[b], and your old men will dream dreams.
translation:
  language: tl
  text: At mangyayari sa mga huling araw, sabi ng Diyos, na ibubuhos ko mula sa aking Espiritu[a] sa lahat ng laman[b]. Magpapahayag ng propesiya ang inyong mga anak na lalaki at ang inyong mga anak na babae; makakakita ng mga pangitain ang inyong mga binata, at mananaginip ng mga panaginip ang inyong matatandang lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas natural ding isalin: “ibubuhos ko ang aking Espiritu.” Literal na mababasa sa Griyego ang “mula sa aking Espiritu.”'
    reason: lexical_alternative
  - marker: b
    text: O “sa lahat ng tao.” Ang “lahat ng laman” ay propetikong idyoma para sa mga tao sa malawak na saklaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: sa mga huling araw
  rationale: Likas at matatag na salin ng eskatolohikal na parirala nang hindi tinutukoy nang higit sa teksto ang eksaktong saklaw ng panahong ito.
- source_word: λέγει ὁ θεός
  choice: sabi ng Diyos
  rationale: Pinananatili ang pormula ng pahayag sa kasalukuyang anyo at natural ito sa modernong Tagalog.
- source_word: ἐκχεῶ
  choice: ibubuhos ko
  rationale: Pinananatili ang kongkretong talinghaga ng pagbubuhos at malinaw na ipinahahayag ang panghinaharap.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: mula sa aking Espiritu
  rationale: Tuwirang pinananatili ang ἀπό bilang “mula sa,” sa halip na alisin ang di-pangkaraniwang anyo ng orihinal.
- source_word: ἐπὶ πᾶσαν σάρκα
  choice: sa lahat ng laman
  rationale: Pinananatili ang propetikong larawang “lahat ng laman” at ang kaugnayan nito sa Joel; inilalagay sa talababa ang mas malinaw na idyomatikong kahulugan.
- source_word: προφητεύσουσιν
  choice: magpapahayag ng propesiya
  rationale: Malinaw at likas sa kasalukuyang Tagalog, habang pinananatili ang tiyak na diwa ng propetikong pagsasalita.
- source_word: οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν
  choice: ang inyong mga anak na lalaki at ang inyong mga anak na babae
  rationale: Pinananatili ang tahasang pagbanggit sa dalawang kasarian at ang pag-uulit ng “inyong” sa Griyego.
- source_word: οἱ νεανίσκοι ὑμῶν
  choice: ang inyong mga binata
  rationale: Ang “binata” ay maikli at tumpak na tumutukoy sa mga kabataang lalaki, kaayon ng kasunod na paghahambing ayon sa edad.
- source_word: ὁράσεις ὄψονται
  choice: makakakita ng mga pangitain
  rationale: Natural na katumbas sa Tagalog ng magkaugat na pariralang Griyego.
- source_word: οἱ πρεσβύτεροι ὑμῶν
  choice: ang inyong matatandang lalaki
  rationale: Ipinakikita ang paghahambing batay sa edad at iniiwasang ipahiwatig ang katungkulan sa pamamagitan ng salitang “mga elder” o “mga pinuno.”
- source_word: ἐνυπνίοις ἐνυπνιασθήσονται
  choice: mananaginip ng mga panaginip
  rationale: Pinananatili ang retorikal na pag-uulit ng magkaugat na mga salita at ang kaagapay nitong estruktura sa “makakakita ng mga pangitain.”
theological_decisions:
- issue: Saklaw at idyomatikong bisa ng “lahat ng laman”
  choice: Panatilihin sa pangunahing teksto ang literal na “lahat ng laman.”
  alternative: “lahat ng tao” o “buong sangkatauhan”
  rationale: Pinananatili nito ang propetikong pananalita at malawak na saklaw ng pangako nang hindi pinapawi ang larawan ng orihinal; nililinaw ng talababa ang idyomatikong kahulugan.
- issue: Ang tinutukoy ng πνεῦμα sa pagbubuhos ng Diyos
  choice: “aking Espiritu,” na may malaking E
  alternative: “aking espiritu”
  rationale: Sa siping propetiko, ang tinutukoy ay ang Espiritu ng Diyos; ipinahihiwatig ito ng malaking titik nang walang idinaragdag na paliwanag sa mismong teksto.
- issue: Di-pangkaraniwang ἀπὸ sa “mula sa aking Espiritu”
  choice: Panatilihin ang “mula sa” sa pangunahing teksto.
  alternative: “ibubuhos ko ang aking Espiritu”
  rationale: Ang Griyego ay tahasang gumagamit ng ἀπό. Ang literal na anyo ay nagpapanatili sa tensiyon ng pananalita nang hindi ipinapalagay na hinahati ang Espiritu; tinutukoy sa talababa ang mas natural na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang propetikong larawang “lahat ng laman,” ang tahasang pagbanggit sa mga anak na lalaki at babae, at ang paghahambing ng mga binata at matatandang lalaki. Inilagay ang mga talababa sa mismong mga pariralang kanilang ipinapaliwanag.
