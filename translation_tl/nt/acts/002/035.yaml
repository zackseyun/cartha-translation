translation:
  language: tl
  text: hanggang sa gawin kong tuntungan ng iyong mga paa ang iyong mga kaaway[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “hanggang sa ilagay ko ang iyong mga kaaway bilang tuntungan ng iyong mga paa.”
    reason: lexical_alternative
  - marker: b
    text: Inuulit ng linyang ito ang Awit 110:1, isang awit tungkol sa pagkakaluklok ng hari na may mesiyanikong kahulugan.
    reason: cross_reference
lexical_decisions:
- source_word: ἕως ἂν
  choice: hanggang sa
  rationale: Likas na ipinahahayag sa modernong Tagalog ang hangganang temporal na tumutukoy sa isang pangyayari sa hinaharap.
- source_word: θῶ
  choice: gawin kong
  rationale: Bagaman ang τίθημι ay literal na “ilagay,” ang “gawin kong” ang natural na katumbas sa hulmaing may panaguring “tuntungan,” at pinananatili nito ang diwa ng paglalagay sa isang kalagayan o tungkulin.
- source_word: τοὺς ἐχθρούς σου
  choice: ang iyong mga kaaway
  rationale: Tuwirang salin na nagpapanatili sa personal at maharlikang diwa ng pagsalungat sa sipi.
- source_word: ὑποπόδιον
  choice: tuntungan
  rationale: Karaniwan at dignified na salitang Tagalog para sa patungan ng mga paa; pinananatili nito ang kongkretong larawan ng pagpapasakop.
- source_word: τῶν ποδῶν σου
  choice: ng iyong mga paa
  rationale: Tapat sa anyong henitibo ng Griyego at natural sa pariralang Tagalog na “tuntungan ng iyong mga paa.”
theological_decisions:
- issue: Maharlikang larawan ng pagpapasakop sa sipi mula sa Awit 110:1
  choice: Panatilihin ang kongkretong larawang “tuntungan ng iyong mga paa.”
  alternative: hanggang sa lubusan kong mapasuko sa ilalim ng iyong mga paa ang iyong mga kaaway
  rationale: Ang metapora ay mahalaga sa konteksto ng pagkakaluklok at mesiyanikong pahiwatig ng Awit 110:1. Hindi ito dapat palitan sa pangunahing teksto ng paliwanag tungkol sa ganap na pagkatalo o pagpapasakop.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang metapora at ayos na malinaw sa karaniwang mambabasa; ginamit ang “iyong” sa halip na mas kolokyal na “mo” upang umayon sa dignidad ng siping patula.
