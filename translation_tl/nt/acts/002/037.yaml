base_translation:
  language: en
  yaml_path: translation/nt/acts/002/037.yaml
  text: When they heard this[a], they were pierced to the heart, and they said to Peter and the rest of the apostles, “What should we do[b], brothers?”
translation:
  language: tl
  text: Nang marinig nila ito, natusok ang kanilang puso[a], at sinabi nila kay Pedro at sa iba pang mga apostol, “Ano ang dapat naming gawin, mga kapatid[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “labis silang nabagabag.” Inilalarawan ng salitang Griego ang isang matalim na panloob na pagkabagabag o pagkakumbinsi.
    reason: lexical_alternative
  - marker: b
    text: Sa Griego, “mga lalaki, mga kapatid,” isang nakaugaliang katawagan na maaaring isalin na “mga kapatid” o, ayon sa konteksto, tumukoy sa mga kapatid na lalaki at babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Nang marinig nila ito
  rationale: Ipinakikita ng aorist participle ang pangyayaring sinundan ng kanilang tugon; likas sa Tagalog ang “nang,” at ang “ito” ay tumutukoy sa katatapos na pahayag ni Pedro. Hindi na hiwalay na isinalin ang δέ sapagkat sapat na ang daloy ng pangungusap upang ipakita ang pagsulong ng salaysay.
- source_word: κατενύγησαν τὴν καρδίαν
  choice: natusok ang kanilang puso
  rationale: Pinananatili nito ang matalim na metapora ng Griego para sa matinding panloob na pagkabagabag o pagkakumbinsi, sa halip na palitan agad ng isang paliwanag.
- source_word: εἶπόν τε
  choice: at sinabi nila
  rationale: Direktang isinasalin ang λέγω bilang “sinabi” at ipinahahayag ng “at” ang malapit na pagkakaugnay sa naunang kilos.
- source_word: πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους
  choice: kay Pedro at sa iba pang mga apostol
  rationale: Malinaw na ibinubukod si Pedro sa natitirang mga apostol habang nananatiling natural ang Tagalog.
- source_word: Τί ποιήσωμεν
  choice: Ano ang dapat naming gawin
  rationale: Ipinahahayag ng “dapat” ang deliberative subjunctive—humihingi sila ng wastong hakbang na gagawin—at ang “naming” ay eksklusibo dahil kausap nila si Pedro at ang mga apostol.
- source_word: ἄνδρες ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay natural at marangal na katawagan sa Tagalog. Ang literal na pag-uulit na “mga lalaking kapatid” ay magiging pilit; inilalahad sa talababa ang gramatikal na anyong panlalaki at ang posibleng saklaw nito.
theological_decisions:
- issue: Likas at lawak ng panloob na tugon
  choice: natusok ang kanilang puso
  alternative: labis na nabagabag ang kanilang puso
  rationale: Pinananatili ang metapora at hindi tinutukoy nang higit sa teksto kung ang damdamin ay pagsisisi, pagkakumbinsi, takot, o matinding pagkabagabag.
- issue: Kasariang ipinahihiwatig ng ἄνδρες ἀδελφοί
  choice: mga kapatid
  alternative: mga lalaking kapatid
  rationale: Ang parirala ay gramatikal na panlalaki ngunit isa ring nakaugaliang katawagan. Hindi ipinipilit sa pangunahing teksto kung eksklusibong mga lalaki ang tinutukoy; pinananatili sa talababa ang tunay na anyo at posibleng saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang metapora ng pusong natusok at gumamit ng eksklusibong “naming” upang malinaw na ang nagtatanong ay iba sa mga apostol na kanilang kinakausap.
