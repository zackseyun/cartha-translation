  text: αἰνοῦντες τὸν θεὸν καὶ ἔχοντες χάριν πρὸς ὅλον τὸν λαόν. ὁ δὲ κύριος προσετίθει τοὺς σῳζομένους καθ’ ἡμέραν ⸂ἐπὶ τὸ αὐτό⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/047.yaml
  text: praising God and having favor with all the people[a]. And the Lord was adding day by day those who were being saved to them.
translation:
  language: tl
  text: na nagpupuri sa Diyos at kinalulugdan ng buong bayan. At araw-araw ay idinaragdag ng Panginoon sa kanilang bilang[a] ang mga inililigtas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pariralang Griyego ay maaari ring unawain bilang “sama-sama” o “sa iisang lugar.” Ang “sa kanilang bilang” ay kontekstuwal na pagpapalinaw.
    reason: Pinananatili ang leksikal at sintaktikong kalabuan ng ἐπὶ τὸ αὐτό, habang nililinaw na ang pangunahing salin ay pagbasa batay sa konteksto ng “idinaragdag.”
lexical_decisions:
- source_word: αἰνοῦντες τὸν θεόν
  choice: na nagpupuri sa Diyos
  rationale: Ipinahahayag ng pangkasalukuyang participle ang patuloy na gawain ng pamayanan; natural sa makabagong Tagalog ang “nagpupuri sa Diyos.”
- source_word: ἔχοντες χάριν πρὸς ὅλον τὸν λαόν
  choice: at kinalulugdan ng buong bayan
  rationale: Ang idyoma ay malamang na tumutukoy sa pagtatamo nila ng pagsang-ayon o mabuting pagtingin ng mas malawak na sambayanan, hindi sa pagpapakita nila ng pabor dito.
- source_word: ὁ δὲ κύριος
  choice: At ... ang Panginoon
  rationale: Pinananatili ang magaan na pag-uugnay ng δέ at ang karaniwang salin ng κύριος bilang “Panginoon.”
- source_word: προσετίθει
  choice: ay idinaragdag
  rationale: Ipinakikita ng imperpektong pandiwa ang paulit-ulit o nagpapatuloy na pagkilos; kasama ng “araw-araw,” malinaw ito sa natural na Tagalog.
- source_word: τοὺς σῳζομένους
  choice: ang mga inililigtas
  rationale: Pinananatili ng pangkasalukuyang pasibong anyo ang pandiwang diwa at ang paglalarawan sa kaligtasan bilang nagaganap, sa halip na gawing estatiko na “mga ligtas.”
- source_word: καθ’ ἡμέραν
  choice: araw-araw
  rationale: Natural at tumpak na Tagalog para sa pamamahaging diwa ng kilos sa bawat sunod na araw.
- source_word: ἐπὶ τὸ αὐτό
  choice: sa kanilang bilang
  rationale: Sa kasunod ng “idinaragdag,” ipinahihiwatig ng konteksto ang pagdaragdag sa umiiral na pamayanan. Interpretatibo ang “bilang,” kaya inilalahad sa talababa ang tunay na alternatibong kahulugan.
theological_decisions:
- issue: Aspekto at teolohiya ng kaligtasan sa τοὺς σῳζομένους
  choice: ang mga inililigtas
  alternative: ang mga naligtas; ang mga ligtas
  rationale: Sinasalamin nito ang pangkasalukuyang pasibong participle nang hindi nagpapasiya sa mas malawak na mga pagtatalong teolohikal tungkol sa kaayusan o yugto ng kaligtasan.
- issue: Kahulugan ng ἐπὶ τὸ αὐτό
  choice: sa kanilang bilang
  alternative: sama-sama; sa iisang lugar
  rationale: Ang pagdaragdag sa pamayanan ang pinakamalamang na diwa sa konteksto, ngunit maaaring mangahulugan ang parirala ng “sama-sama” o “sa iisang lugar”; pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buong bayan” para sa mas malawak na populasyon at ang “kinalulugdan” upang natural na ipahayag ang pagtatamo ng mabuting pagtingin. Inilagay ang “araw-araw” sa unahan ng sugnay para sa maayos na daloy.
