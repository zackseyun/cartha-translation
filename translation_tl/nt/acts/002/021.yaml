base_translation:
  language: en
  yaml_path: translation/nt/acts/002/021.yaml
  text: And it shall be that everyone who calls on the name of the Lord will be saved[a].
translation:
  language: tl
  text: At mangyayari na ang sinumang tumawag sa pangalan ng Panginoon ay maliligtas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang bawat tumatawag sa pangalan ng Panginoon.” Hango ang pariralang ito sa Joel 2:32, kung saan ang “Panginoon” ay tumutukoy kay YHWH; sa Mga Gawa, ginagamit ni Pedro ang siping ito sa kanyang pagpapahayag tungkol kay Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσται
  choice: mangyayari
  rationale: Ang hinaharap na anyo ng εἰμί ay bahagi ng pormulang nagpapakilala sa mangyayari. Likas sa modernong Tagalog ang “mangyayari” at napapanatili nito ang makahulang himig.
- source_word: πᾶς ὃς ἐὰν
  choice: ang bawat tumatawag
  rationale: Ipinahahayag ng konstruksiyon ang isang walang-tanging pangkalahatang kondisyon. Ang “bawat tumatawag” ay natural at malinaw, habang ang talababa ay nagbibigay ng katumbas na “sinumang tumawag.”
- source_word: ἐπικαλέσηται
  choice: tumatawag sa
  rationale: Sa idyomang biblikal na kasama ang “pangalan,” nangangahulugan itong dumulog o manawagan nang may pagtitiwala at pagsamba. Ang “tumatawag sa pangalan” ay malinaw at pamilyar na salin.
- source_word: τὸ ὄνομα
  choice: pangalan
  rationale: Pinanatili nang tuwiran ang “pangalan” dahil mahalaga ang buong biblikal na pariralang “tumawag sa pangalan,” na may ugnayang tipan at pagsamba.
- source_word: κυρίου
  choice: Panginoon
  rationale: Isinalin ang κύριος bilang “Panginoon” nang hindi tinutukoy nang higit sa sinasabi ng tekstong Griyego kung sino ang tinutukoy nito.
- source_word: σωθήσεται
  choice: ay maliligtas
  rationale: Ang hinaharap na balintiyak ng σῴζω ay tuwirang naihahayag ng “maliligtas,” na nag-iingat sa mga diwa ng pagliligtas mula sa panganib at kaligtasang espirituwal.
theological_decisions:
- issue: Ang tinutukoy ng “Panginoon” sa sipi mula kay Joel ayon sa paggamit nito sa Mga Gawa
  choice: Panatilihin sa pangunahing teksto ang “Panginoon” nang hindi tahasang tinutukoy kung sino ang tinutukoy nito.
  alternative: Sa orihinal na konteksto ng Joel, tumutukoy ito kay YHWH; sa pagpapahayag ni Pedro sa Mga Gawa, inilalapat ang sipi sa kontekstong nakasentro kay Jesus.
  rationale: “Panginoon” lamang ang sinasabi ng tekstong Griyego. Pinananatili ng saling ito ang alingawngaw ng Joel at ang kristolohikal na konteksto ng Mga Gawa nang hindi nilulutas sa mismong salin ang tunay na teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at may bahagyang makahulang himig. Iniwasan ang lipas na “mangyayari nga” at pinanatili ang pamilyar na biblikal na pariralang “tumatawag sa pangalan ng Panginoon.”
