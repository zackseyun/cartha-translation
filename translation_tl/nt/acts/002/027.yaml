id: ACT.2.27
reference: Acts 2:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἐγκαταλείψεις τὴν ψυχήν μου εἰς ⸀ᾅδην, οὐδὲ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/027.yaml
  text: because you will not abandon my soul to Hades[c][b][a], nor will you let your Holy One see decay.
translation:
  language: tl
  text: sapagkat hindi mo ako pababayaan sa Hades[a], ni hahayaan mong makaranas ng pagkabulok[c] ang iyong Banal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa Sheol,” ayon sa Hebreong teksto na pinagmulan ng siping ito; “Hades” ang nasa Griyego.
    reason: alternative_reading
  - marker: b
    text: O “iyong tapat.”
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, pisikal na pagkabulok o agnas; ang tradisyonal na salin ay “katiwalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείψεις
  choice: pababayaan
  rationale: Likas sa modernong Tagalog at malinaw na ipinahahayag ang hindi pag-iwan o pagpapabaya sa isang tao sa isang kalagayan o dako.
- source_word: τὴν ψυχήν μου
  choice: ako
  rationale: Sa siping ito, ang ψυχή ay maaaring tumukoy sa buhay o mismong sarili ng nagsasalita. Ang “ako” ay natural sa Tagalog at hindi nagpapasok ng teknikal na paghahati ng tao sa katawan at kaluluwa.
- source_word: εἰς ᾅδην
  choice: sa Hades
  rationale: Pinananatili ang katawagang Griyego para sa dako ng mga patay at iniiwasang ipantay ito agad sa “impiyerno” o “libingan.” Sa pandiwang “pababayaan,” natural sa Tagalog ang “sa Hades.”
- source_word: δώσεις ... ἰδεῖν
  choice: hahayaan mong makaranas
  rationale: Ang literal na “ibibigay na makita” ay idyomang nangangahulugang pahintulutang maranasan. Mas malinaw at natural sa Tagalog ang “hahayaan mong makaranas.”
- source_word: τὸν ὅσιόν σου
  choice: iyong Banal
  rationale: Ang ὅσιος ay maaaring mangahulugang banal, tapat, o deboto sa Diyos. Pinananatili ng “iyong Banal” ang leksikal at kristolohikal na bigat ng konteksto.
- source_word: διαφθοράν
  choice: pagkabulok
  rationale: Malinaw na tumutukoy sa pisikal na pagkabulok o agnas at hindi sa moral na katiwalian.
theological_decisions:
- issue: Kahulugan ng ᾅδης sa sipi tungkol sa muling pagkabuhay
  choice: Hades
  alternative: Sheol; dako ng mga patay; libingan
  rationale: Sinusunod ang Griyegong teksto at iniiwasang ipasok ang mas huling doktrinal na kahulugan ng “impiyerno.” Itinatala sa talababa ang Hebreong pinagmulan ng sipi.
- issue: Saklaw ng ψυχή sa τὴν ψυχήν μου
  choice: ako
  alternative: ang aking kaluluwa; ang aking buhay
  rationale: Pinananatili ang posibleng diwa ng buong sarili o buhay nang hindi ginagawang teknikal na pahayag tungkol sa kalagayan ng kaluluwa pagkatapos ng kamatayan.
- issue: Kristolohikal na pagkakakilanlan ng τὸν ὅσιόν σου
  choice: iyong Banal
  alternative: iyong tapat; iyong banal na lingkod
  rationale: Iniuugnay mismo ng konteksto ng Gawa 2 ang salmo kay Jesus. Ang “iyong Banal” ay nagpapanatili sa banal at mesiyanikong diin nang walang idinadagdag na doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “ako” para sa idiomatikong kabuuan ng τὴν ψυχήν μου, at “makaranas ng pagkabulok” upang malinaw na maipahayag ang Griyegong idyoma nang hindi mawala ang pisikal na diwa.
