id: ACT.2.36
reference: Acts 2:36
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀσφαλῶς οὖν γινωσκέτω πᾶς οἶκος Ἰσραὴλ ὅτι καὶ κύριον ⸂αὐτὸν καὶ χριστὸν⸃ ⸂ἐποίησεν ὁ θεός⸃, τοῦτον τὸν Ἰησοῦν ὃν ὑμεῖς ἐσταυρώσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/036.yaml
  text: Therefore let all the house of Israel know for certain that God has made him both Lord and Messiah—this Jesus whom you crucified[a][b].
translation:
  language: tl
  text: Kaya, dapat malaman nang buong katiyakan ng buong sambahayan ng Israel na ginawa ng Diyos na kapwa Panginoon at Mesiyas[a][b] ang Jesus na ito—siya na ipinako ninyo sa krus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang titulong Griyego ay Χριστός (Christos); isinalin itong “Mesiyas” upang maipakita ang kahulugan nito bilang titulo sa pahayag ni Pedro sa Israel.
    reason: alternative_reading
  - marker: b
    text: Sa konteksto, ang “ginawa ng Diyos na kapwa Panginoon at Mesiyas” ay tumutukoy sa pagdakila at hayag na pagtatalaga kay Jesus sa mga tungkuling ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλῶς
  choice: nang buong katiyakan
  rationale: Ipinahahayag ng pang-abay ang matibay at ganap na katiyakan ng pahayag ni Pedro; natural at marangal ito sa modernong Filipino.
- source_word: οὖν
  choice: Kaya
  rationale: Malinaw nitong ipinakikita na ang pahayag ay kongklusyon mula sa naunang pangangatuwiran tungkol sa muling pagkabuhay at pagkadakila kay Jesus.
- source_word: γινωσκέτω
  choice: dapat malaman
  rationale: Isinasalin nito ang pautos na ikatlong panauhan sa paraang natural sa Filipino, nang hindi ginagawang simpleng mungkahi ang utos.
- source_word: πᾶς οἶκος Ἰσραήλ
  choice: buong sambahayan ng Israel
  rationale: Pinananatili ang korporatibo at biblikal na larawan ng Israel bilang isang sambahayan, sa halip na paikliin lamang bilang 'buong Israel.'
- source_word: κύριον
  choice: Panginoon
  rationale: Ang 'Panginoon' ay nagpapanatili sa mataas na awtoridad ng titulo at sa ugnayan nito sa naunang sipi ni Pedro.
- source_word: Χριστόν
  choice: Mesiyas
  rationale: Sa pahayag ni Pedro sa Israel, malinaw na titulo ang Χριστός; ipinahahayag ng 'Mesiyas' ang kahulugan nito sa halip na gamitin lamang ang transliterasyong 'Cristo.'
- source_word: ἐποίησεν
  choice: ginawa
  rationale: Pinananatili ang payak at malawak na leksikal na puwersa ng pandiwa, sa halip na paliitin agad ito sa 'hinirang' o 'itinalaga.' Nililinaw sa talababa ang kahulugan nito sa konteksto.
- source_word: καὶ κύριον αὐτὸν καὶ χριστόν
  choice: kapwa Panginoon at Mesiyas
  rationale: Ang 'kapwa ... at ...' ay natural na katumbas ng dobleng καί at malinaw na iniuugnay kay Jesus ang dalawang titulo.
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: ang Jesus na ito
  rationale: Pinananatili ang mariing demonstratibo at itinuturo ang mismong makasaysayang Jesus na paksa ng pangangaral.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: siya na ipinako ninyo sa krus
  rationale: Tuwiran nitong pinananatili ang paratang ni Pedro at ang hayag na pagtukoy sa pananagutan ng mga kausap.
theological_decisions:
- issue: Kahulugan ng 'ginawa ng Diyos na kapwa Panginoon at Mesiyas'
  choice: Pinanatili ang 'ginawa' at ipinaliwanag bilang pagdakila at hayag na pagtatalaga kay Jesus sa mga tungkuling ito sa kasaysayan ng pagliligtas.
  alternative: Isalin ang ἐποίησεν bilang 'itinalaga' o unawain itong pagbabago sa likas na pagkatao o pagka-Diyos ni Jesus.
  rationale: Ang 'ginawa' ang tuwirang katumbas ng pandiwang Griyego at pinananatili ang tensiyon ng pahayag. Sa konteksto ng muling pagkabuhay at pagdakila, hindi kinakailangang ipakahulugan ito bilang paglikha o pagbabago sa likas na pagkatao ni Jesus.
- issue: Pagpapakahulugan sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Dahil kinakausap ni Pedro ang buong sambahayan ng Israel at ipinahahayag ang katuparan ng mga pangako, nangingibabaw rito ang gamit bilang titulo.
translation_notes:
  register: Modernong Filipino na marangal at malinaw, na may bahagyang biblikal na himig sa pariralang “buong sambahayan ng Israel.” Pinanatili ang tuwirang bigat ng paratang na “ipinako ninyo sa krus” at ang tunay na leksikal na tensiyon ng “ginawa.”
