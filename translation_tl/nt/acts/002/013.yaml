  text: ἕτεροι δὲ ⸀διαχλευάζοντες ἔλεγον ὅτι Γλεύκους μεμεστωμένοι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/013.yaml
  text: But others[a], mocking, were saying, “They are filled with sweet wine.”
translation:
  language: tl
  text: Ngunit nanunuya ang iba at sinasabi, “Punô sila ng matamis na alak[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bagong alak.” Ang Griyegong γλεῦκος ay tumutukoy sa matamis at sariwang alak; posible ang tradisyonal na saling “bagong alak,” ngunit hindi nito gaanong tiyak na naipahahayag ang katangian ng alak.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: ang iba
  rationale: Ginagamit ang pang-uri bilang pangngalan upang tukuyin ang ibang pangkat sa karamihan; likas at malinaw sa Filipino ang “ang iba.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita rito ang pagsalungat sa naunang tugon ng mga namangha at nagtanong.
- source_word: διαχλευάζοντες
  choice: nanunuya
  rationale: Ipinahahayag nito ang mapanlibak na pagkutya nang hindi pinatitindi nang higit sa diwa ng Griyego.
- source_word: ἔλεγον
  choice: sinasabi
  rationale: Ang aspektong imperpektibo ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagsasalita; natural itong naipahahayag ng “sinasabi” sa Filipino.
- source_word: ὅτι
  choice: tuwirang sipi
  rationale: Ipinakilala ang nilalaman ng sinabi bilang tuwirang pananalita, na natural sa Filipino at naaayon sa konteksto.
- source_word: Γλεύκους
  choice: matamis na alak
  rationale: Ang γλεῦκος ay tumutukoy sa matamis at sariwang alak o must; mas tiyak ang “matamis na alak” kaysa “bagong alak,” habang inilalagay sa talababa ang tradisyonal na alternatibo.
- source_word: μεμεστωμένοι
  choice: Punô
  rationale: Pinananatili nito ang larawan ng pagiging punô sa alak at ang kalagayang ipinahahayag ng perfect passive participle, nang hindi tahasang pinapalitan ng interpretasyong “lasing.”
- source_word: εἰσίν
  choice: sila
  rationale: Sa panaguring “Punô sila,” likas na naipahahayag sa Filipino ang pangkasalukuyang copular na diwa kahit walang hiwalay na katumbas ng “are.”
theological_decisions:
- issue: Kung tahasang isasalin bilang “lasing” ang paratang
  choice: Pinanatili ang “Punô sila”
  alternative: “Lasing sila” o “Sobra silang nakainom”
  rationale: Bagaman malinaw na pagkalasing ang ipinaparatang sa konteksto, ang Griyego ay literal na nagsasabing sila ay “punô” ng matamis na alak. Pinananatili ng salin ang mismong larawan at hindi nito tahasang nilulutas ang ipinahihiwatig lamang.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “nanunuya” para sa mapanlibak na kilos at ang “Punô sila” upang mapanatili ang matalinghagang pahayag ng orihinal.
