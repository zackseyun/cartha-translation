id: ACT.2.5
reference: Acts 2:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ⸀ἐν Ἰερουσαλὴμ κατοικοῦντες Ἰουδαῖοι, ἄνδρες εὐλαβεῖς ἀπὸ παντὸς ἔθνους τῶν ὑπὸ τὸν οὐρανόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/005.yaml
  text: There were Jews living in Jerusalem[b][a], devout men from every nation under heaven.
translation:
  language: tl
  text: May mga Judiong[a] naninirahan sa Jerusalem—mga lalaking maka-Diyos mula sa bawat bansang nasa silong ng langit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Judeano.” Dito, mas pinapaboran ng konteksto ang mas malawak na kahulugang etniko at panrelihiyon dahil sinasabing nagmula sila sa bawat bansang nasa silong ng langit.
    reason: alternative_reading
  - marker: b
    text: Ang “nasa silong ng langit” ay isang biblikal na idyoma na nangangahulugang nasa buong daigdig.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: May mga
  rationale: Likas na ipinapahayag sa Filipino ang pag-iral ng pangkat sa pamamagitan ng “may mga.” Ang δέ ay banayad na pang-ugnay sa pagpapatuloy ng salaysay at hindi kailangang tumbasan ng salitang nagpapahiwatig ng matinding pagsalungat.
- source_word: ἐν Ἰερουσαλὴμ κατοικοῦντες
  choice: naninirahan sa Jerusalem
  rationale: Ipinahihiwatig ng κατοικοῦντες ang paninirahan sa isang lugar, hindi lamang pansamantalang pagtigil. Natural sa Filipino ang ayos na ito.
- source_word: Ἰουδαῖοι
  choice: mga Judio
  rationale: Bagaman maaari ring tumukoy sa mga Judeano, mas angkop dito ang mas malawak na etniko-relihiyosong kahulugan dahil nagmula sila sa mga bansa sa buong daigdig.
- source_word: ἄνδρες
  choice: mga lalaki
  rationale: Tiyak na panlalaki ang ἄνδρες at hindi ang pangkalahatang salita para sa mga tao, kaya pinanatili ang kasarian ng orihinal.
- source_word: εὐλαβεῖς
  choice: maka-Diyos
  rationale: Ipinahahayag nito ang taimtim na paggalang at maingat na pamumuhay sa harap ng Diyos. Ang “maka-Diyos” ay malinaw at likas sa modernong Filipino nang hindi gumagamit ng katawagang may makitid na denominasyonal na kulay.
- source_word: ἀπὸ παντὸς ἔθνους
  choice: mula sa bawat bansa
  rationale: Ang ἔθνος dito ay tumutukoy sa mga bansa o mga bayan ng daigdig; pinananatili ng “bawat bansa” ang malawak at retorikal na pahayag.
- source_word: τῶν ὑπὸ τὸν οὐρανόν
  choice: nasa silong ng langit
  rationale: Pinananatili nito ang biblikal na idyoma ng Griyego habang nililinaw sa talababa na tumutukoy ito sa buong daigdig.
theological_decisions:
- issue: Kahulugan ng Ἰουδαῖοι
  choice: mga Judio
  alternative: mga Judeano
  rationale: Ang paglalarawan sa kanila bilang nagmula sa bawat bansang nasa silong ng langit ay pumapabor sa etniko-relihiyosong kahulugan kaysa sa makitid na panrehiyong kahulugan.
- issue: Pagpapanatili sa kasarian ng ἄνδρες
  choice: mga lalaki
  alternative: mga tao
  rationale: Partikular na panlalaki ang pangngalang Griyego; ang paggamit ng “mga tao” ay magpapalabo sa detalyeng tahasang nasa teksto.
- issue: Saklaw ng “bawat bansang nasa silong ng langit”
  choice: pinanatili bilang malawak na biblikal na idyoma
  alternative: mula sa buong daigdig
  rationale: Pinananatili ng salin ang talinghaga at retorikal na lawak ng orihinal nang hindi ito ginagawang isang teknikal na pahayag tungkol sa literal na presensiya ng bawat bansa.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang gitling upang malinaw na ipaliwanag ng ikalawang parirala kung sino ang mga Judiong tinutukoy. Pinanatili ang biblikal na idyomang “nasa silong ng langit,” kalakip ang paliwanag sa talababa.
