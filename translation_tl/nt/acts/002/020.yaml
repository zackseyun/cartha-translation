  text: ὁ ἥλιος μεταστραφήσεται εἰς σκότος καὶ ἡ σελήνη εἰς αἷμα πρὶν ⸀ἢ ⸀ἐλθεῖν ἡμέραν κυρίου τὴν μεγάλην καὶ ἐπιφανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/020.yaml
  text: The sun will be turned into darkness[a], and the moon into blood, before the great and glorious day of the Lord comes.
translation:
  language: tl
  text: Ang araw ay magiging kadiliman, at ang buwan ay magiging dugo, bago dumating ang dakila at maluwalhating[a] araw ng Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hayag” o “kapansin-pansin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστραφήσεται
  choice: magiging
  rationale: Likas sa modernong Tagalog ang hulma na “magiging kadiliman” para ipahayag ang pagbabagong patungo sa isang kalagayan. Hindi nito ipinapaliwanag kung paano mangyayari ang pagbabago.
- source_word: εἰς σκότος
  choice: magiging kadiliman
  rationale: Pinananatili ang matindi at makahulang larawan ng araw na nagiging kadiliman, sa halip na pahinain ito bilang basta pagdidilim lamang.
- source_word: εἰς αἷμα
  choice: magiging dugo
  rationale: Pinananatili ang tuwiran at matinding larawang “dugo,” sa halip na ipakahulugang “pulang gaya ng dugo.”
- source_word: πρὶν ἢ ἐλθεῖν
  choice: bago dumating
  rationale: Natural at malinaw na pagpapahayag sa Tagalog ng ugnayang temporal sa Griyego.
- source_word: ἡμέραν κυρίου
  choice: araw ng Panginoon
  rationale: Pinananatili ang nakaugaliang makahulang parirala tungkol sa araw ng banal na pagdalaw o paghatol at iniiwasang ipagkamali ito sa isang araw ng sanlinggo.
- source_word: μεγάλην
  choice: dakila
  rationale: Ang “dakila” ay angkop sa mataas at makahulang himig ng μέγας sa kontekstong ito.
- source_word: ἐπιφανῆ
  choice: maningning
  rationale: Ipinahahayag ng “maningning” ang marilag at kapansin-pansing katangian ng araw habang nananatiling natural sa Tagalog. Inilalagay sa talababa ang mga alternatibong “hayag” at “kapansin-pansin” upang mapanatili ang lawak ng kahulugan.
theological_decisions:
- issue: Ang makahulang pariralang ἡμέραν κυρίου sa sipi mula kay Joel
  choice: araw ng Panginoon
  alternative: araw na nauukol sa Panginoon
  rationale: Pinananatili ng “araw ng Panginoon” ang ugnayan sa pananalita ng mga propeta at hindi ito nililimitahan sa isang karaniwang araw ng pagsamba.
- issue: Ang kahulugan ng ἐπιφανῆ sa kontekstong eskatolohikal
  choice: maningning
  alternative: hayag; kapansin-pansin
  rationale: Maaaring tumukoy ang salita sa pagiging lantad o kapansin-pansin, gayundin sa marilag na ningning. Ginamit ang natural na “maningning” sa teksto at itinabi sa talababa ang mahahalagang alternatibo upang hindi maitago ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na nagpapanatili sa matindi at makahulang larawan ng talata. Ginamit ang “Panginoon” bilang karaniwang katumbas ng κύριος.
