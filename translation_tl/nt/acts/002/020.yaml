  source_fidelity: Tumpak na naihahatid ng draft ang pagbabagong inilalarawan sa μεταστραφήσεται, ang matinding larawan ng araw na nagiging kadiliman at buwan na nagiging dugo, at ang ugnayang temporal na “bago dumating.” Ang “araw ng Panginoon” ay wastong katumbas ng ἡμέραν κυρίου. Gayunman, ang “maningning” ay pangunahing tumutukoy sa literal na ningning at masyadong pinasisikip ang ἐπιφανῆ, na maaaring mangahulugang maluwalhati, hayag, o kapansin-pansin.
  naturalness: Makinis, malinaw, at angkop sa marangal na makahulang rehistro ang pangungusap. Mas natural at mas angkop sa saklaw ng huling pang-uri ang “dakila at maluwalhating araw” kaysa “dakila at maningning na araw.”
