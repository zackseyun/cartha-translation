  text: προϊδὼν ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ χριστοῦ ὅτι ⸂οὔτε ἐγκατελείφθη⸃ εἰς ⸀ᾅδην ⸀οὔτε ἡ σὰρξ αὐτοῦ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/031.yaml
  text: 'Foreseeing this[a], he spoke about the resurrection of the Messiah: that he was neither abandoned to Hades[d][c][b], nor did his flesh see decay.'
translation:
  language: tl
  text: 'Nakita niya nang patiuna ang mangyayari, at nagsalita siya tungkol sa muling pagkabuhay ng Mesiyas: hindi siya pinabayaan sa Hades[a], ni nakaranas ng pagkabulok ang kanyang laman.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Hades” ay tumutukoy sa daigdig ng mga patay, hindi partikular sa lugar ng pangwakas na kaparusahan. Maaari ring isalin ang parirala na “hindi siya iniwan sa Hades.”
    reason: cultural_note_and_lexical_alternative
  - marker: b
    text: 'Sa literal: “ni nakita ng kanyang laman ang pagkabulok.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδὼν
  choice: Dahil nakita na niya nang patiuna ang mangyayari
  rationale: Ipinahahayag ng aorist participle ang pagkaunawa ni David bago naganap ang tinutukoy. Ginawang tahasang sanhi ang ugnayan sa pangunahing pandiwa upang maging natural sa Tagalog; ang “ang mangyayari” ay ipinahiwatig ng konteksto.
- source_word: ἐλάλησεν
  choice: nagsalita siya
  rationale: Tuwirang katumbas ng λαλέω at angkop sa pormal na pagpapaliwanag ni Pedro sa siniping Kasulatan.
- source_word: περὶ τῆς ἀναστάσεως
  choice: tungkol sa muling pagkabuhay
  rationale: Natural na katumbas ng περί na may genitive; pinananatili ang tiyak na paksa ng pahayag.
- source_word: τοῦ χριστοῦ
  choice: ng Mesiyas
  rationale: Dito, ang Χριστός ay titulong tumutukoy sa ipinangakong pinahiran ng Diyos sa argumento ni Pedro mula sa Kasulatan.
- source_word: οὔτε ἐγκατελείφθη
  choice: hindi siya pinabayaan
  rationale: Ang passive ng ἐγκαταλείπω ay nangangahulugang iwan o pabayaan. Likas sa Tagalog ang “pinabayaan” at ipinahahayag nito ang hindi pag-iwan sa kanya sa kalagayan ng kamatayan.
- source_word: εἰς ᾅδην
  choice: sa Hades
  rationale: Sa Tagalog, ang “sa” ay natural na makapaghahayag ng direksiyon o lokasyon ayon sa hinihingi ng pandiwa. Pinananatili ng “Hades” ang tiyak na terminong Griyego nang hindi ito ipinapantay sa lugar ng pangwakas na kaparusahan.
- source_word: ἡ σὰρξ αὐτοῦ
  choice: ang kanyang laman
  rationale: Literal at pisikal ang gamit ng σάρξ dito. Pinananatili ng “laman” ang bokabularyo at diin sa pisikal na pagkatao ng Mesiyas.
- source_word: εἶδεν διαφθοράν
  choice: nakaranas ng pagkabulok
  rationale: Ang literal na idyomang “nakakita ng pagkabulok” ay hindi likas sa modernong Tagalog. Ang “nakaranas ng pagkabulok” ay malinaw na naghahatid ng diwang hindi nabulok ang kanyang laman.
theological_decisions:
- issue: Pagsasalin ng Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Prominente rito ang gamit bilang titulo sa propetikong pangangatwiran ni Pedro tungkol sa pinahirang ipinangako sa Kasulatan.
- issue: Pagsasalin ng ᾅδης
  choice: Hades
  alternative: daigdig ng mga patay
  rationale: Pinananatili ang terminong Griyego at iniiwasang ipakahulugang ito ang tiyak na lugar ng pangwakas na paghuhukom.
- issue: Pagsasalin ng σάρξ
  choice: laman
  alternative: katawan
  rationale: Literal at pisikal ang tinutukoy; pinananatili ng “laman” ang leksikal na anyo at ang diin sa tunay na pisikal na muling pagkabuhay.
- issue: Ugnayan ng εἰς sa ἐγκατελείφθη
  choice: pinabayaan sa Hades
  alternative: iniwan sa Hades / pinabayaan tungo sa Hades
  rationale: Maaaring magpahiwatig ang parirala ng pag-iwan sa loob ng Hades o pagpapabaya tungo rito. Ang “sa Hades” ay natural sa Tagalog at hindi sapilitang nilulutas ang bahagyang kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Mesiyas” bilang titulong madaling maunawaan, at pinanatili ang “Hades” para sa katumpakang teolohikal. Iniwasan ang di-likas na literalismong “nakakita ng pagkabulok,” ngunit inilagay ito sa talababa.
