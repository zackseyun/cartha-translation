id: ACT.2.30
reference: Acts 2:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: προφήτης οὖν ὑπάρχων, καὶ εἰδὼς ὅτι ὅρκῳ ὤμοσεν αὐτῷ ὁ θεὸς ἐκ καρποῦ τῆς ὀσφύος ⸀αὐτοῦ καθίσαι ἐπὶ ⸂τὸν θρόνον⸃ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/030.yaml
  text: Therefore[a], being a prophet and knowing that God had sworn to him with an oath to seat one from the fruit of his loins on his throne,
translation:
  language: tl
  text: Kaya, bilang propeta, alam niyang taimtim na sumumpa sa kanya ang Diyos na pauupuin sa kanyang trono ang isa sa kanyang mga inapo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa bunga ng kanyang balakang,” isang idyoma para sa isa sa kanyang mga inapo.
    reason: Ipinapaliwanag ang konkretong larawang pangangkan sa Griyego na isinalin nang idyomatiko sa pangunahing teksto.
lexical_decisions:
- source_word: προφήτης
  choice: propeta
  rationale: Karaniwang katawagan sa taong nagsasalita ayon sa pahayag ng Diyos; tuwiran at likas sa modernong Filipino.
- source_word: οὖν
  choice: kaya
  rationale: Ipinapakita ang lohikal na bunga ng naunang sinabi tungkol kay David, sa paraang natural sa Filipino.
- source_word: ὑπάρχων καὶ εἰδὼς
  choice: bilang propeta, alam niyang
  rationale: Pinananatili ang pangyayaring inilalarawan ng dalawang participle habang iniiwasan ang mabigat at di-likas na hulma sa Filipino.
- source_word: ὅρκῳ ὤμοσεν
  choice: taimtim na sumumpa
  rationale: Ang pang-abay na “taimtim” ay naghahatid ng diin ng magkaugnay na pangngalan at pandiwa sa Griyego nang hindi gumagamit ng paulit-ulit na pariralang di-likas sa Filipino.
- source_word: ἐκ καρποῦ τῆς ὀσφύος αὐτοῦ
  choice: isa sa kanyang mga inapo
  rationale: Ito ang malinaw at natural na katumbas ng idyoma para sa pisikal na angkan; inilalahad sa talababa ang literal na larawan.
- source_word: καθίσαι
  choice: pauupuin
  rationale: 'Pinananatili ang causative na diwa: ang Diyos ang maglalagay o magpapaupo sa inapo bilang hari.'
- source_word: ἐπὶ τὸν θρόνον αὐτοῦ
  choice: sa kanyang trono
  rationale: Likas na parirala sa Filipino para sa pagluklok; ang panghalip ay pinananatili at pinakamalamang na tumutukoy sa trono ni David.
theological_decisions:
- issue: Ang maharlikang pangako sa angkan ni David
  choice: Pinanatili ang panunumpa, ang inapo, at ang trono nang hindi idinaragdag ang salitang “Mesiyas.”
  alternative: “pauupuin ang Mesiyas sa kanyang trono”
  rationale: Iniuugnay ng konteksto ang pangako kay Jesus, ngunit sa talatang ito mismo ay inilalahad ito bilang pangako tungkol sa isang inapo ni David. Hinahayaang gawin ng kasunod na konteksto ang tahasang paglalapat.
- issue: Tinutukoy ng huling αὐτοῦ
  choice: “kanyang trono,” na likas na nauunawaang trono ni David
  alternative: Tahasan itong gawing “trono ng Diyos” o “trono ng inapo”
  rationale: Ang pinakamalapit na lohikal na sanggunian sa pangakong dinastiko ay si David, ngunit pinananatili sa salin ang panghalip ng Griyego sa halip na gawing tahasan ang pangalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “taimtim na sumumpa” upang mapanatili ang diin ng panunumpa, at “mga inapo” upang maging madaling maunawaan ang idyomang Griyego habang iniingatan ang literal na larawan sa talababa.
