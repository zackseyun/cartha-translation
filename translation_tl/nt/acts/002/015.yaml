  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ang mga ito” upang iwasang magdagdag ng kasariang hindi tahasang ipinahihiwatig ng demonstratibong Griyego. Inilagay ang talababa pagkatapos ng sinaunang pahayag ng oras, na siyang ipinapaliwanag nito.
