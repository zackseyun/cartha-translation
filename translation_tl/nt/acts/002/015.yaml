  yaml_path: translation/nt/acts/002/015.yaml
  text: For these are not drunk[a], as you suppose, for it is the third hour of the day.
translation:
  language: tl
  text: Sapagkat hindi lasing ang mga ito, gaya ng inaakala ninyo, dahil ikatlong oras ng araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Iyon ay bandang alas-nuwebe ng umaga ayon sa pagbilang ng oras ng mga Hudyo.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Sapagkat hindi
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang pahayag, habang tuwirang isinasalin ng “hindi” ang οὐ.
- source_word: ὡς ὑμεῖς ὑπολαμβάνετε
  choice: gaya ng inaakala ninyo
  rationale: Likas sa makabagong Tagalog ang “inaakala” para sa ὑπολαμβάνετε, at pinananatili ng “ninyo” ang tuwirang pagtukoy sa mga nakikinig.
- source_word: οὗτοι
  choice: ang mga ito
  rationale: Tuwirang demonstratibo ito na hindi nagdaragdag ng “mga lalaki” o ibang pagkakakilanlang hindi tahasang nasa Griyego.
- source_word: μεθύουσιν
  choice: lasing
  rationale: Ang “lasing” ang pinakanatural na paglalarawan sa kalagayang ipinaparatang sa kanila.
- source_word: ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας
  choice: dahil ikatlong oras pa lamang ng araw
  rationale: Ipinakikita ng “dahil” ang ikalawang γάρ bilang dahilan ng pagtanggi ni Pedro sa paratang. Pinananatili ang sinaunang paraan ng pagbilang ng oras sa pangunahing teksto; ang “pa lamang” ay natural na Tagalog na nagpapahayag sa konteksto na napakaaga pa ng oras.
- source_word: ὥρα τρίτη
  choice: ikatlong oras
  rationale: Pinananatili ang makasaysayang katawagan sa oras sa halip na palitan ito ng makabagong oras sa pangunahing teksto.
