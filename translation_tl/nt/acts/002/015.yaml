  - severity: low
    issue: Hindi naipapakita ng footnote marker ang saklaw nito sa pinakatumpak na anyo matapos alisin ang “pa lamang.”
    rationale: Ang marker ay dapat manatiling kasunod mismo ng “ikatlong oras ng araw,” ang pariralang ipinapaliwanag ng talababa.
