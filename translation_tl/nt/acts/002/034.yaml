id: ACT.2.34
reference: Acts 2:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐ γὰρ Δαυὶδ ἀνέβη εἰς τοὺς οὐρανούς, λέγει δὲ αὐτός· Εἶπεν ⸀ὁ κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/034.yaml
  text: For David did not ascend into the heavens[a], but he himself says, ‘The Lord said to my Lord, “Sit at my right hand,”’
translation:
  language: tl
  text: 'Sapagkat hindi umakyat si David sa mga langit[a], ngunit siya mismo ay nagsasabi:


    “Sinabi ng Panginoon sa aking Panginoon,


    ‘Maupo ka sa aking kanan,’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Awit 110:1. Sa tekstong Hebreo, ang unang “Panginoon” ay kumakatawan sa banal na pangalang YHWH; ihambing: “Sinabi ni YHWH sa aking Panginoon.”'
    reason: Ipinapakita ang mahalagang pinagmulan ng sipi sa Hebreo at ang pagkakaiba ng dalawang katawagan roon, habang pinananatili sa pangunahing teksto ang dalawang κύριος ng Griyego.
lexical_decisions:
- source_word: ἀνέβη
  choice: umakyat
  rationale: Likas at tuwirang katumbas sa Filipino ng pag-akyat, at sa kontekstong ito ay tumutukoy sa pag-akyat sa langit.
- source_word: τοὺς οὐρανούς
  choice: kalangitan
  rationale: Pinananatili ang malawak at mataas na rehistro ng pangmaramihang anyong Griyego nang hindi nagiging pilit sa modernong Filipino.
- source_word: λέγει δὲ αὐτός
  choice: sa halip, siya mismo ang nagsabi
  rationale: Ipinahahayag ng “sa halip” ang banayad na pagsalungat ng δέ, at pinananatili ng “siya mismo” ang diin ng αὐτός. Ginamit ang karaniwang Filipino na panahunan sa pagpapakilala ng sipi.
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Sinusunod ang dalawang magkatulad na κύριος sa tekstong Griyego; ang pagkakakilanlan ng unang termino bilang YHWH sa tekstong Hebreo ay inilagay sa talababa.
- source_word: τῷ κυρίῳ μου
  choice: sa aking Panginoon
  rationale: Pinananatili ang magkatulad na katawagang “Panginoon” at ang mesiyanikong lakas ng sipi; ang “panginoon” bilang karaniwang amo ay maaaring magpahina sa konteksto.
- source_word: Κάθου
  choice: Maupo ka
  rationale: Natural at magalang ngunit tuwirang pautos sa modernong Filipino, angkop sa utos na maupo sa luklukan.
- source_word: ἐκ δεξιῶν μου
  choice: sa aking kanan
  rationale: Karaniwang idyomang Filipino para sa lugar ng karangalan at awtoridad sa kanan ng nagsasalita.
theological_decisions:
- issue: Pag-render sa dalawang paglitaw ng κύριος sa sipi mula sa Awit 110:1
  choice: 'Parehong isinalin na “Panginoon” sa pangunahing teksto: “Sinabi ng Panginoon sa aking Panginoon.”'
  alternative: “Sinabi ni YHWH sa aking Panginoon” o “Sinabi ng PANGINOON sa aking Panginoon,” ayon sa pinagbabatayang Hebreo.
  rationale: Parehong κύριος ang nasa tekstong Griyegong SBLGNT. Upang unahin ang agarang pinagmulang Griyego at huwag pag-ibahin sa pangunahing teksto ang dalawang terminong magkapareho roon, parehong “Panginoon” ang ginamit; ipinaliwanag sa talababa ang mahalagang pinagmulan sa Hebreo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ang “kalangitan” ay nagpapanatili ng biblikal na taas ng pananalita; ang “sa aking kanan” ay natural na idyoma. Ang anyong patula at mga panipi ay naghihiwalay sa sipi mula sa Awit.
