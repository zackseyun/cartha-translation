  text: καὶ πῶς ἡμεῖς ἀκούομεν ἕκαστος τῇ ἰδίᾳ διαλέκτῳ ἡμῶν ἐν ᾗ ἐγεννήθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/008.yaml
  text: And how is it that each of us hears in our own native language?[a]
translation:
  language: tl
  text: At paano ngang naririnig ng bawat isa sa atin ang sarili nating wikang kinagisnan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sarili nating diyalekto, na kinasilangan natin.”
    reason: Pinananatili ang posibleng mas makitid na kahulugan ng διάλεκτος at ang mas literal na anyo ng ἐν ᾗ ἐγεννήθημεν.
lexical_decisions:
- source_word: καὶ πῶς
  choice: At paano nga
  rationale: Pinananatili ng “At” ang pang-ugnay na καί, habang ipinahihiwatig ng “paano nga” ang pagtatakang taglay ng tanong.
- source_word: ἡμεῖς ... ἕκαστος
  choice: bawat isa sa atin
  rationale: 'Likas na salin ito sa Filipino ng mariing diwang pamahagi: bawat taong kabilang sa nagsasalitang pangkat.'
- source_word: ἀκούομεν
  choice: naririnig
  rationale: Ipinapahayag ng pangkasalukuyang anyo ang aktuwal nilang nararanasan habang nagsasalita ang mga alagad.
- source_word: τῇ ἰδίᾳ διαλέκτῳ ἡμῶν
  choice: ang sarili nating wika
  rationale: Maaaring mangahulugan ang διάλεκτος ng wika o diyalekto. Mas malinaw at hindi teknikal sa karaniwang mambabasa ang “wika,” at pinananatili ng “sarili nating” ang ἰδίᾳ ἡμῶν.
- source_word: ἐν ᾗ ἐγεννήθημεν
  choice: wikang kinagisnan
  rationale: Likas na ipinahahayag sa modernong Filipino ang wikang kaugnay ng kapanganakan at paglaki bilang “wikang kinagisnan,” nang hindi ginagawang matigas ang literal na pariralang “kung saan tayo ipinanganak.”
