  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦσαν δὲ προσκαρτεροῦντες τῇ διδαχῇ τῶν ἀποστόλων καὶ τῇ ⸀κοινωνίᾳ, τῇ κλάσει τοῦ ἄρτου καὶ ταῖς προσευχαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/042.yaml
  text: And they were devoting themselves to the apostles' teaching and the fellowship[c][b][a], to the breaking of bread and the prayers.
translation:
  language: tl
  text: At patuloy silang nakatuon sa turo ng mga apostol, sa pakikibahagi[a], sa pagpuputol-putol ng tinapay[b], at sa mga panalangin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pakikisama,” “pagbabahaginan,” o “komunyon.”
    reason: lexical_alternative
  - marker: b
    text: Ang “pagpuputol-putol ng tinapay” ay maaaring tumukoy sa mga salu-salo sa pangkalahatan, bagaman nauunawaan ito ng marami rito na kabilang ang Hapunan ng Panginoon.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “mga itinakdang panalangin”; maaaring ipinahihiwatig ng pantukoy sa Griyego ang kinikilalang mga oras o anyo ng panalangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ προσκαρτεροῦντες
  choice: At matiyaga silang nagpatuloy
  rationale: Ipinahahayag ng anyong ἦσαν + participle ang tuloy-tuloy at nakaugaliang pagkilos noon, samantalang ipinakikita ng προσκαρτερέω ang matatag at masigasig na pananatili. Likas sa modernong Tagalog ang pariralang ito at hindi nito pinapahina ang diwa ng pagtitiyaga.
- source_word: τῇ διδαχῇ τῶν ἀποστόλων
  choice: sa turo ng mga apostol
  rationale: Ang “turo” ay natural at madaling maunawaan, at hindi kasing teknikal o sistematiko ng “doktrina.” Ang genitive ay inuunawang tumutukoy sa turong ibinigay ng mga apostol.
- source_word: τῇ κοινωνίᾳ
  choice: sa pakikisama
  rationale: Ipinahahayag ng “pakikisama” ang sama-samang buhay at pakikibahagi ng komunidad nang hindi nililimitahan ang salita sa pagbabahagi ng ari-arian o sa isang sakramental na kahulugan lamang.
- source_word: τῇ κλάσει τοῦ ἄρτου
  choice: sa pagpipira-piraso ng tinapay
  rationale: Pinananatili nito ang kongkretong idyoma ng Griyego at ang kalabuan kung karaniwang salu-salo, Hapunan ng Panginoon, o kapwa ang tinutukoy.
- source_word: ταῖς προσευχαῖς
  choice: sa mga panalangin
  rationale: Likas sa Tagalog ang maramihang anyong ito. Hindi tahasang naipakikita ng Tagalog ang definite article ng Griyego, kaya inilalahad sa talababa ang posibleng pagtukoy sa kinikilalang mga oras o anyo ng panalangin.
theological_decisions:
- issue: Kung ang κλάσει τοῦ ἄρτου ay dapat tahasang tukuyin bilang Hapunan ng Panginoon o Eukaristiya
  choice: Pinanatili bilang “pagpipira-piraso ng tinapay”
  alternative: “Hapunan ng Panginoon,” “Eukaristiya,” o mga salu-salong kabilang ang Hapunan ng Panginoon
  rationale: Maaaring tumukoy ang parirala sa karaniwang pagsasalo ng pagkain at maaari ring kabilang dito ang alaalang hapunan ni Jesus. Hindi sapat ang mismong pananalita upang gawing tiyak ang isang sakramental na pagbasa.
- issue: Kung ang κοινωνία ay dapat limitahan sa materyal na pagbabahagi o sakramental na komunyon
  choice: Isinalin bilang “pakikisama” na may malawak na diwa ng sama-samang buhay at pakikibahagi
  alternative: “pagbabahaginan,” “pakikibahagi,” o “komunyon”
  rationale: Malawak ang saklaw ng κοινωνία at maaaring kabilang ang espirituwal, panlipunan, at materyal na pagbabahagi. Iniiwasan ng pangunahing salin ang maagang pagpapasya sa isang mas makitid na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “turo” sa halip na mas teknikal na “doktrina,” at pinanatili ang mga malalawak o hindi tiyak na kahulugan ng κοινωνία at κλάσις τοῦ ἄρτου sa pamamagitan ng pangunahing teksto at mga talababa.
