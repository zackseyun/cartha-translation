review_pass:
  verdict: revise
  source_fidelity: Ang «matyaga silang nagpatuloy» ay bahagyang nakakakuha sa pagtitiyaga ng προσκαρτεροῦντες, ngunit hindi gaanong malinaw ang patuloy na pag-uukol ng sarili na ipinahihiwatig ng periphrastic imperfect. Ang «pakikisama» ay maaaring mangahulugan lamang ng pagiging palakaibigan o pakikitungo at mas makitid kaysa κοινωνία. Ang «pagpipira-piraso ng tinapay» ay labis na literal at hindi likas para sa nakapirming pariralang κλάσις τοῦ ἄρτου.
  naturalness: Mas natural sa modernong Filipino ang «Patuloy silang nakatuon» para sa tuloy-tuloy na debosyon, «pakikibahagi» para sa malawak na diwa ng κοινωνία, at «pagpuputol-putol ng tinapay» para sa κλάσις τοῦ ἄρτου. Pinananatili ng mga ito ang marangal ngunit di-arkaykong rehistro.
  terminology: Pinananatili ang «turo ng mga apostol» at «mga panalangin». Ang «pakikibahagi» ay hindi nagtatakda kung ang κοινωνία ay panlipunan, materyal, o sakramental. Ang «pagpuputol-putol ng tinapay» ay hindi rin humahatol kung pangkaraniwang salu-salo o Hapunan ng Panginoon ang tinutukoy.
  issues:
  - severity: medium
    issue: Ang «pakikisama» ay hindi sapat na katumbas ng κοινωνία.
    rationale: Sa kasalukuyang gamit, madalas itong tumutukoy sa pakikitungo o pagiging palakaibigan. Hindi nito kasinglinaw na naihahayag ang magkatuwang na pakikibahagi at sama-samang buhay na saklaw ng κοινωνία.
  - severity: medium
    issue: Hindi likas ang «pagpipira-piraso ng tinapay».
    rationale: Bagaman nauunawaan, nagmumungkahi ito ng pagdurog o pagpipira-piraso at hindi ito ang karaniwang Filipino para sa idyomang «breaking of bread». Ang «pagpuputol-putol ng tinapay» ay mas natural at nananatiling di-tiyak.
  - severity: low
    issue: Bahagyang mahina ang aspektong progresibo sa «matiyaga silang nagpatuloy».
    rationale: Ang «Patuloy silang nakatuon» ay mas tuwirang naghahayag ng nagpapatuloy na matatag na pag-uukol ng sarili.
