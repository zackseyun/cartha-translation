revisions:
- from: Ang taong ito[a], na ibinigay ayon sa itinakdang pasya at paunang kaalaman ng Diyos, ay pinatay ninyo[b] sa pamamagitan ng pagpapako sa kanya sa krus sa kamay ng mga taong walang kinikilalang kautusan.
  to: Ang taong ito[a], na ibinigay ayon sa itinakdang pasya at paunang kaalaman ng Diyos, ay ipinako ninyo sa krus sa pamamagitan ng mga taong labag sa kautusan at pinatay ninyo.[b]
  rationale: Inayos ang pagkakasunod ng mga parirala upang malinaw na ang mga taong ἀνόμοι ang namagitan sa pagpapako, samantalang ang “ninyo” ay nananatiling tahasang responsable sa pagpapako at pagpatay. Pinanatili ang tensiyon sa pagitan ng itinakdang pasya at paunang kaalaman ng Diyos at ng pananagutan ng tao. Ang mga talababa ay nananatiling wastong nakaangkla sa “Ang taong ito” at “pinatay ninyo.”
