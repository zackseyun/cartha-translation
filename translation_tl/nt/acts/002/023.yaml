base_translation:
  language: en
  yaml_path: translation/nt/acts/002/023.yaml
  text: this man[a], delivered up according to the determined plan and foreknowledge of God[b], you killed by nailing him to a cross through the hands of lawless men.
translation:
  language: tl
  text: Ang taong ito[a], na ibinigay ayon sa itinakdang pasya at paunang kaalaman ng Diyos, ay ipinako ninyo sa krus sa pamamagitan ng mga taong labag sa kautusan at pinatay ninyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang isang ito.”
    reason: lexical_alternative
  - marker: b
    text: O “ipinapatay ninyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: Ang taong ito
  rationale: Tumutukoy kay Jesus at pinananatili ang tuwirang, panturong diin ng demonstratibo; mas likas ito sa Filipino kaysa sa literal na “ang isang ito.”
- source_word: τῇ ὡρισμένῃ βουλῇ
  choice: ayon sa itinakdang pasya
  rationale: Ipinahahayag ng ὡρισμένῃ ang bagay na itinakda o tiniyak, at ang βουλή ay pasya, layunin, o panukala. Ang “ayon sa” ay malinaw na nag-uugnay sa pagkakabigay kay Jesus sa pasya ng Diyos nang hindi labis na tinutukoy ang eksaktong tungkulin ng datibo.
- source_word: καὶ προγνώσει
  choice: at paunang kaalaman
  rationale: Direktang ipinahahayag ang pagkakaalam nang una, sa paraang mas madaling maunawaan ng karaniwang mambabasa kaysa sa teknikal na “presensya” o hiram na katawagan.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Genitibong tumutukoy sa Diyos bilang may taglay kapwa ng itinakdang pasya at ng paunang kaalaman.
- source_word: ἔκδοτον
  choice: ibinigay
  rationale: Nangangahulugang ibinigay o ipinasa sa kapangyarihan ng iba. Pinananatili ng anyong balintiyak ang hindi binanggit na tagapagbigay sa mismong sugnay.
- source_word: διὰ χειρὸς ἀνόμων
  choice: sa kamay ng mga taong walang kinikilalang kautusan
  rationale: Ang “sa kamay ng” ay likas na idyomang Filipino para sa namamagitang pagkilos. Ang ἀνόμων ay pinananatiling kaugnay ng kawalan o pagsuway sa kautusan, sa halip na gawing pangkalahatang “masasamang tao.”
- source_word: προσπήξαντες
  choice: sa pamamagitan ng pagpapako sa kanya sa krus
  rationale: Ang pandiwa ay tumutukoy sa pagkakabit o pagpapako; nililinaw ng “sa krus” ang paraang ipinahihiwatig ng konteksto ng pagbitay kay Jesus.
- source_word: ἀνείλατε
  choice: pinatay ninyo
  rationale: Tuwiran at mariing katumbas ng pandiwa sa kontekstong ito, at pinananatili ang tahasang pananagutan ng mga kinakausap ni Pedro.
theological_decisions:
- issue: Ugnayan ng itinakdang pasya ng Diyos at pananagutan ng tao
  choice: Magkasabay na pinanatili ang pagkakabigay kay Jesus ayon sa itinakdang pasya at paunang kaalaman ng Diyos at ang paratang na “pinatay ninyo.”
  alternative: Palambutin ang itinakdang pasya ng Diyos, o ituon ang buong pananagutan sa mga taong nagsagawa ng pagpapako.
  rationale: Kapwa tahasang nasa Griyego ang banal na pasya at kaalaman at ang pananagutan ng mga kinakausap. Hindi nilulutas ng salin ang tensiyong ito ayon sa isang sistemang teolohikal.
- issue: Pagkakakilanlan ng ἀνόμων
  choice: mga taong walang kinikilalang kautusan
  alternative: mga Hentil; masasamang tao; mga lumalabag sa batas
  rationale: Hindi tahasang pinapangalanan ng teksto ang mga Romano o mga Hentil. Pinananatili ng salin ang lawak at posibleng pahiwatig ng salitang may kaugnayan sa kautusan nang hindi nagdaragdag ng tiyak na pagkakakilanlan.
translation_notes:
  register: Makabago, marangal, at tuwiran ang Filipino. Ginamit ang “pasya” sa halip na mas arkaykong “kapasyahan” o teknikal na “konseho,” at pinanatili ang matinding paratang ni Pedro. Ang “sa kamay ng” ay isang likas na idyoma para sa pagkilos sa pamamagitan ng mga tagapamagitan.
