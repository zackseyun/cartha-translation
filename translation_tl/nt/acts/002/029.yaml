  text: Ἄνδρες ἀδελφοί, ἐξὸν εἰπεῖν μετὰ παρρησίας πρὸς ὑμᾶς περὶ τοῦ πατριάρχου Δαυίδ, ὅτι καὶ ἐτελεύτησεν καὶ ἐτάφη, καὶ τὸ μνῆμα αὐτοῦ ἔστιν ἐν ἡμῖν ἄχρι τῆς ἡμέρας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/029.yaml
  text: Men[a], brothers, I may speak to you with boldness about the patriarch David, that he both died and was buried, and his tomb is among us to this day.
translation:
  language: tl
  text: '“Mga kapatid[a], maaari akong magsalita nang buong tapang sa inyo tungkol sa patriarkang si David: namatay siya at inilibing, at ang kanyang libingan ay nasa piling natin hanggang sa araw na ito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “Mga lalaki, mga kapatid,” isang pormal na panawagan sa mga kapwa Israelitang nagkakatipon.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Mga kapatid[a]
  rationale: Ang dobleng panawagang Griyego ay literal na tumutukoy sa ‘mga lalaking kapatid,’ ngunit ang ganitong anyo ay hindi likas sa modernong Tagalog. Pinananatili ng ‘Mga kapatid’ ang magalang at pampamayanang panawagan; inilalahad sa talababa ang tahasang panlalaking anyo.
- source_word: ἐξὸν εἰπεῖν
  choice: maaari akong magsalita
  rationale: Ipinapahayag nito ang kalayaan o pahintulot na magsalita, hindi lamang ang kakayahang gawin iyon.
- source_word: μετὰ παρρησίας
  choice: nang buong tapang
  rationale: Inihahatid nito ang hayag, malaya, at matapang na pananalita na ipinahihiwatig ng παρρησία.
- source_word: περὶ τοῦ πατριάρχου Δαυίδ
  choice: tungkol sa patriarkang si David
  rationale: Pinananatili ang titulong πατριάρχης bilang ‘patriarka,’ sa likas na kayariang Tagalog para sa isang titulo bago ang pangalan.
- source_word: καὶ ἐτελεύτησεν καὶ ἐτάφη
  choice: namatay siya at inilibing
  rationale: Tumpak at natural na inilalahad ang dalawang magkakaugnay na katotohanan. Hindi kailangang piliting tumbasan ang dobleng καί ng ‘kapwa’ dahil magiging mabigat sa Tagalog.
- source_word: τὸ μνῆμα αὐτοῦ
  choice: ang kanyang libingan
  rationale: Ang ‘libingan’ ay malinaw na tumutukoy sa lugar ng paglilibing at mas karaniwan sa modernong Tagalog kaysa sa ‘puntod’ sa ganitong pormal na pahayag.
- source_word: ἔστιν ἐν ἡμῖν
  choice: narito pa rin sa piling natin
  rationale: Ipinahihiwatig ng parirala ang patuloy na presensiya ng libingan sa lugar o pamayanang kinabibilangan ng nagsasalita at mga tagapakinig.
- source_word: ἄχρι τῆς ἡμέρας ταύτης
  choice: hanggang sa araw na ito
  rationale: Direkta at likas na katumbas ng temporal na idyoma, na nagsasaad na nananatili ang libingan sa panahon ng pagsasalita.
theological_decisions:
- issue: Kasarian at saklaw ng pambungad na panawagan
  choice: Mga kapatid[a]
  alternative: Mga lalaking kapatid; Mga kapatid na lalaki
  rationale: Tahasan ngang panlalaki ang ἄνδρες ἀδελφοί, ngunit ang literal na dobleng panawagan ay asiwa sa modernong Tagalog. Hindi rin idinaragdag ang ‘mga kapatid na babae,’ sapagkat hindi iyon tahasang nasa Griyego. Pinananatili sa talababa ang pormal at panlalaking anyo ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘patriarka’ bilang kinikilalang terminong historikal, at iniwasan ang sobrang literal na pambungad na magiging hindi natural sa kasalukuyang gamit.
