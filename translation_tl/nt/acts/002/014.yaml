  source_fidelity: 'Tapat ang salin sa pangunahing Griyegong mga yunit: naipapahayag ang pagtindig ni Pedro kasama ng Labing-isa, ang pagtaas ng tinig, at ang mariin at pampublikong pagsasalita. Ang dalawang pangkat na tinatawag—ang mga lalaking taga-Judea at ang lahat ng naninirahan sa Jerusalem—ay malinaw na napapanatiling magkaiba. Ang “alamin ninyo ito” ay katanggap-tanggap na modernong pautos para sa γνωστὸν ἔστω, at ang “pakinggang mabuti” ay wastong naghahatid ng masidhing pakikinig sa ἐνωτίσασθε.'
