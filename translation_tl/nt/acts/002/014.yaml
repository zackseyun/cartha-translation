  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Σταθεὶς δὲ ⸀ὁ Πέτρος σὺν τοῖς ἕνδεκα ἐπῆρεν τὴν φωνὴν αὐτοῦ καὶ ἀπεφθέγξατο αὐτοῖς· Ἄνδρες Ἰουδαῖοι καὶ οἱ κατοικοῦντες Ἰερουσαλὴμ ⸀πάντες, τοῦτο ὑμῖν γνωστὸν ἔστω καὶ ἐνωτίσασθε τὰ ῥήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/014.yaml
  text: 'But Peter[a], standing with the eleven, raised his voice and declared to them: “Men of Judea and all who dwell in Jerusalem, let this be known to you[b], and give ear to my words.”'
translation:
  language: tl
  text: 'Ngunit tumayo si Pedro kasama ng labing-isa, itinaas ang kanyang tinig, at nagpahayag sa kanila: “Mga lalaking taga-Judea[a] at kayong lahat na naninirahan sa Jerusalem, alamin ninyo ito at pakinggang mabuti ang aking mga salita.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Mga lalaking Judio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σταθεὶς
  choice: tumayo
  rationale: Ang aorist participle ay naglalarawan sa pagkilos at tindig ni Pedro bago siya magsalita; natural at tuwiran ang “tumayo” sa makabagong Tagalog.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita nito ang paglipat at pagsalungat sa panunuya sa naunang talata.
- source_word: σὺν τοῖς ἕνδεκα
  choice: kasama ng labing-isa
  rationale: Tuwirang ipinahahayag ang pagsama ng labing-isang apostol kay Pedro.
- source_word: ἐπῆρεν τὴν φωνὴν αὐτοῦ
  choice: itinaas ang kanyang tinig
  rationale: Pinananatili ang larawang Griyego at malinaw na ipinahihiwatig ang malakas na pagsasalita sa madla.
- source_word: ἀπεφθέγξατο
  choice: nagpahayag
  rationale: Ang pandiwa ay tumutukoy sa hayagan at mariing pagsasalita; ang “nagpahayag” ay marangal at hindi nagdaragdag ng tahasang pahayag tungkol sa inspirasyon.
- source_word: Ἄνδρες Ἰουδαῖοι
  choice: Mga lalaking taga-Judea
  rationale: Pinananatili ang panlalaking anyo ng ἄνδρες at ang posibleng heograpikong diwa ng Ἰουδαῖοι sa konteksto; inilalagay sa talababa ang lehitimong alternatibong etnorelihiyosong pagbasa.
- source_word: οἱ κατοικοῦντες Ἰερουσαλὴμ πάντες
  choice: kayong lahat na naninirahan sa Jerusalem
  rationale: Natural na tuwirang pakikipag-usap sa Tagalog at malinaw na naihahayag ang πάντες.
- source_word: τοῦτο ὑμῖν γνωστὸν ἔστω
  choice: alamin ninyo ito
  rationale: Maikli at natural na pautos sa Tagalog na nagpapanatili sa pormal na pagpapabatid ng parirala.
- source_word: ἐνωτίσασθε
  choice: pakinggang mabuti
  rationale: Ipinahahayag ang pautos na makinig nang buong pansin, hindi lamang makarinig.
- source_word: τὰ ῥήματά μου
  choice: ang aking mga salita
  rationale: Tuwirang katumbas na nagpapanatili sa pagtukoy sa binibigkas na mga salita ni Pedro.
theological_decisions:
- issue: Pagpapakahulugan sa Ἰουδαῖοι bilang heograpiko o etnorelihiyosong katawagan
  choice: mga lalaking taga-Judea
  alternative: mga lalaking Judio
  rationale: Maaaring tumukoy ang salita sa mga taga-Judea o sa mga Judio. Ang pangunahing teksto ay sumusunod sa heograpikong pagbasa na angkop sa kasunod na pagbanggit sa Jerusalem, habang pinananatili sa talababa ang tunay na alternatibo.
- issue: Kung dapat bang ipahiwatig ng ἀπεφθέγξατο ang kinasihang o propetikong pananalita
  choice: nagpahayag
  alternative: nagsalita sa kanila
  rationale: Ipinakikita ng “nagpahayag” ang mariin at pampublikong pananalita nang hindi ipinapasok sa pandiwa lamang ang isang tahasang teolohikal na paliwanag tungkol sa inspirasyon.
- issue: Pagpapanatili sa panlalaking anyo ng ἄνδρες
  choice: Mga lalaking
  alternative: Mga tao
  rationale: Tahasang panlalaki ang Griyegong ἄνδρες, kaya hindi ito ginawang neutral sa kasarian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino para sa pampublikong pahayag. Ginamit ang “pakinggang mabuti” bilang likas na Tagalog para sa masidhing pautos na makinig, at iniwasan ang sobrang makalumang mga parirala.
