base_translation:
  language: en
  yaml_path: translation/nt/acts/002/039.yaml
  text: For the promise is for you and for your children and for all who are far off[b][a], as many as the Lord our God calls.
translation:
  language: tl
  text: Sapagkat ang pangako ay para sa inyo, sa inyong mga anak, at sa lahat ng nasa malayo[a], sa lahat ng tatawagin ng Panginoon nating Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lahat ng malalayo.” Maaaring tumukoy ang parirala sa mga malayo sa lugar, sa mga malayo sa tipan, o sa kapuwa kahulugan.
    reason: lexical_alternative
  - marker: b
    text: O “gaano man karami ang tatawagin ng Panginoon nating Diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Sapagkat
  rationale: Ipinakikita ang lohikal na kaugnayan nito sa naunang panawagan ni Pedro at natural sa makabagong Tagalog.
- source_word: ἐπαγγελία
  choice: ang pangako
  rationale: Tuwirang pinananatili ang kahulugan ng pangngalan; hindi ito pinalitan ng “ipinangakong kaloob,” bagaman ang Banal na Espiritu ang nasa agarang konteksto.
- source_word: τέκνοις
  choice: mga anak
  rationale: Natural at malinaw na katumbas na nagpapanatili sa ugnayang pampamilya nang hindi nililimitahan ang edad.
- source_word: πᾶσι τοῖς εἰς μακράν
  choice: sa lahat ng nasa malayo
  rationale: Pinananatili ang posibleng literal na distansiya at mas malawak na pahiwatig ng pagiging malayo sa tipan, nang hindi nagpapasiya sa pagitan ng mga ito.
- source_word: ὅσους ἂν προσκαλέσηται
  choice: sa lahat ng tatawagin
  rationale: Ipinahahayag ang di-tiyak ngunit komprehensibong saklaw ng ὅσους ἂν at ang pandiwang nasa subjunctive, nang hindi idinaragdag ang “sa kanyang sarili,” na hindi tahasang nasa teksto.
- source_word: κύριος ὁ θεὸς ἡμῶν
  choice: ng Panginoon nating Diyos
  rationale: Natural na Tagalog na nagpapanatili sa pagkakakilanlan ng tumatawag bilang “ang Panginoon nating Diyos.”
theological_decisions:
- issue: Saklaw ng “mga nasa malayo”
  choice: Malawak na pananalitang hindi nililimitahan sa mga Judiong nasa diaspora o sa mga Hentil lamang.
  alternative: Maaaring tumukoy sa mga taong malayo sa lugar, malayo sa tipan, o sa kapuwa kahulugan.
  rationale: Hindi nilulutas ng mismong talata ang eksaktong tinutukoy, kaya pinananatili ng salin ang tunay na kalabuan.
- issue: Kahulugan ng pagtawag ng Diyos
  choice: “sa lahat ng tatawagin ng Panginoon nating Diyos”
  alternative: Maaaring ipaliwanag bilang mabisang pagtawag o pangkalahatang paanyaya.
  rationale: Malinaw sa Griyego na ang pangako ay sumasaklaw sa mga tatawagin ng Diyos, ngunit hindi tinutukoy rito ang mekanismo ng pagtawag; iniiwasan ng salin ang denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang em dash upang malinaw na iugnay ang huling parirala bilang paglilinaw sa saklaw ng naunang mga grupo, habang pinananatili ang sintaktikong kaugnayan at teolohikal na tensiyon ng Griyego.
