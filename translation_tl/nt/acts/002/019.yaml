  source_fidelity: Ang «magpapakita ako» ay isang posibleng idyomatikong pagpapakahulugan sa konteksto, ngunit ang δώσω ay tuwirang pandiwang “magbibigay ako.” Dahil optimal-equivalence ang layunin at hindi kinakailangan ang paglihis para maging malinaw ang Tagalog, dapat panatilihin ang pandiwang nagbibigay. Ang «mga kababalaghan ... mga tanda,» «langit sa itaas ... lupa sa ibaba,» at «dugo, apoy, at singaw ng usok» ay tapat sa Griyego at pinananatili ang kosmikong saklaw at sunod-sunod na larawan.
  naturalness: Marangal at madaling maunawaan ang talata. Katanggap-tanggap ang «magbibigay ako ng mga kababalaghan» sa makahulang rehistro, bagaman mas karaniwan sa malayang pananalita ang «magpapakita.» Ang «singaw ng usok» ay medyo di-karaniwang parirala ngunit sinasadyang malapit sa ἀτμίδα καπνοῦ at angkop sa matingkad na makahulang larawan.
  terminology: Ang «kababalaghan» para sa τέρατα at «mga tanda» para sa σημεῖα ay mahusay na magkapareha. Ang «langit» at «lupa» ay wasto para sa heaven/earth na kaibahan. Hindi kailangan ng talababa kapag ang pangunahing teksto mismo ay gumagamit ng mas tuwirang katumbas ng δώσω.
  issues:
