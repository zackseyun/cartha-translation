    rationale: Ang kasalukuyang talababa ay pangunahing nagbibigay ng alternatibong «magbibigay ako.» Kapag iyon na ang nasa teksto, wala nang kailangang lexical-alternative note; ang pag-alis nito ay nag-aalis din ng hindi kailangang marker.
