  text: καὶ δώσω τέρατα ἐν τῷ οὐρανῷ ἄνω καὶ σημεῖα ἐπὶ τῆς γῆς κάτω, αἷμα καὶ πῦρ καὶ ἀτμίδα καπνοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/019.yaml
  text: 'And I will give wonders in the heaven above and signs on the earth below: blood and fire and a cloud of smoke.'
translation:
  language: tl
  text: 'At magbibigay ako ng mga kababalaghan sa langit sa itaas at mga tanda sa lupa sa ibaba: dugo, apoy, at singaw ng usok.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δώσω
  choice: magpapakita ako
  rationale: Bagaman literal na “magbibigay ako,” likas sa Filipino ang “magpapakita” kapag ang layon ay mga kababalaghan at tanda; malinaw nitong ipinahahayag na ang Diyos ang magpapangyari at maghahayag ng mga ito.
- source_word: τέρατα
  choice: mga kababalaghan
  rationale: Tumutukoy sa pambihirang mga pangyayaring pumupukaw ng paghanga o pangamba; hindi ito nililimitahan sa mga himala ng pagpapagaling.
- source_word: ἐν τῷ οὐρανῷ ἄνω
  choice: sa langit sa itaas
  rationale: Pinananatili ang tahasang ugnayang patayo at ang kaibahan nito sa lupa sa ibaba; ang “langit” ay angkop sa marangal at kosmikong larawan ng sipi.
- source_word: σημεῖα
  choice: mga tanda
  rationale: Natural at matatag na katumbas na nagpapahiwatig ng mga pangyayaring may kahulugan, hindi lamang kakaibang penomeno.
- source_word: ἐπὶ τῆς γῆς κάτω
  choice: sa lupa sa ibaba
  rationale: Ang γῆ rito ay kosmikong katapat ng langit, kaya “lupa” ang angkop kaysa sa mas lokal na “lupain.”
- source_word: αἷμα
  choice: dugo
  rationale: Tuwirang salin na nagpapanatili sa kongkreto at matinding larawan.
- source_word: πῦρ
  choice: apoy
  rationale: Tuwirang salin na nagpapanatili sa malinaw na larawang apokaliptiko.
- source_word: ἀτμίδα καπνοῦ
  choice: singaw ng usok
  rationale: 'Malapit sa anyo at kahulugan ng Griyego: ang ἀτμίς ay singaw, ulap-singaw, o manipis na hamog. Pinananatili nito ang kakaibang parirala sa halip na gawing payak na “makapal na usok.”'
theological_decisions:
- issue: Mga kosmikong lokasyon sa sipi mula kay Joel
  choice: langit sa itaas … lupa sa ibaba
  alternative: himpapawid sa itaas … lupain sa ibaba
  rationale: Pinananatili ng napiling salin ang malawak na langit-lupa na kaibahan at hindi ipinapaliit ang larawan tungo sa penomenong pangpanahon o lokal na lupain.
- issue: Lakas ng pandiwang δώσω sa kaugnayan ng mga tanda
  choice: magpapakita ako
  alternative: magbibigay ako
  rationale: Hindi binabago ang Diyos bilang pinagmumulan ng mga tanda, ngunit gumagamit ng mas natural na Filipino para sa pagpapangyari o pagpapakita ng mga kababalaghan. Ang mas literal na anyo ay itinatala sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang repetisyong “sa itaas … sa ibaba,” ang kosmikong langit-lupa na kaibahan, at ang matingkad na sunod-sunod na larawan. Ang tandang [a] ay nasa pangunahing teksto at tumutugma sa talababa.
