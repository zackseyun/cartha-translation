    issue: Ang «magpapakita ako» ay nagpapaluwag sa δώσω.
    rationale: Ang δώσω ay “magbibigay ako,” hindi pangunahing “magpapakita ako.” Ang huli ay maaaring ipaliwanag bilang kontekstuwal na kahulugan, ngunit hindi nito napapanatili ang tahasang pandiwang ginamit sa sipi ni Joel.
  - severity: low
