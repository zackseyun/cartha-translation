  yaml_path: translation/nt/acts/002/012.yaml
  text: And they all were amazed and perplexed[a], saying to one another, “What does this mean?”
translation:
  language: tl
  text: Lahat sila ay namamangha at naguguluhan, at sinasabi sa isa’t isa, “Ano ang ibig sabihin nito?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Ano ang nais nitong maging?” Isa itong idyoma na ang ibig sabihin ay “Ano ang ibig sabihin nito?” o “Ano ang kabuluhan nito?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: namangha
  rationale: Ipinahahayag nito ang matinding pagkagulat o pagkamangha. Natural ang “namangha” sa makabagong Tagalog at hindi nagdudulot ng maling pahiwatig na maaaring idulot ng sobrang literal na salin.
- source_word: δὲ
  choice: at
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay, hindi isang mariing pagsalungat.
- source_word: πάντες
  choice: lahat sila
  rationale: Pinananatili nito ang diin na ang buong pangkat ay nagkaroon ng gayong reaksiyon.
- source_word: διηπόρουν
  choice: naguguluhan
  rationale: Ipinahahayag ng pandiwa ang patuloy na pagkalito at kawalan ng katiyakan kung paano uunawain ang pangyayari.
- source_word: ἄλλος πρὸς ἄλλον
  choice: sa isa’t isa
  rationale: Ito ang natural at malinaw na katumbas sa Tagalog ng panumbalikang pahayag.
- source_word: λέγοντες
  choice: sinasabi
  rationale: Pinananatili ng anyong ito ang kasabay at nagpapatuloy na pagsasalita ng mga tao habang sila ay namamangha at naguguluhan.
- source_word: Τί θέλει τοῦτο εἶναι;
  choice: Ano ang ibig sabihin nito?
  rationale: Ang konstruksiyong τί θέλει + pawatas ay isang idyomang nagtatanong tungkol sa kahulugan o kabuluhan ng isang pangyayari. Ang saling ito ang natural na pagpapahayag sa Tagalog nang hindi dinaragdagan ang kahulugan.
