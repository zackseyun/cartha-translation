id: ACT.2.46
reference: Acts 2:46
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν τε προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ ἱερῷ, κλῶντές τε κατ’ οἶκον ἄρτον, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/046.yaml
  text: And day by day[a], continuing together with one purpose in the temple courts, and breaking bread from house to house, they were sharing meals with gladness and simplicity of heart[d][c][b],
translation:
  language: tl
  text: Araw-araw, patuloy silang nagtitipon nang may iisang layunin sa mga patyo ng templo[a], at naghahati-hati ng tinapay sa iba't ibang bahay[b]; nakikibahagi sila sa salu-salo[c] nang may galak at payak na puso[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay tumutukoy sa buong kompleks ng templo, hindi lamang sa panloob na santuwaryo.
    reason: cultural_note
  - marker: b
    text: Ang “paghahati-hati ng tinapay” ay maaaring tumukoy sa karaniwang sama-samang pagkain, bagaman nauunawaan din ito ng ilan na maaaring kabilang ang Hapunan ng Panginoon.
    reason: alternative_reading
  - marker: c
    text: O, “pagkain.”
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “taos-pusong kalooban” o “bukás-palad na puso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Araw-araw
  rationale: Likas na distributibong parirala sa modernong Tagalog na nagpapahayag ng paulit-ulit na gawain bawat araw.
- source_word: προσκαρτεροῦντες
  choice: patuloy silang
  rationale: Ipinahahayag ng kasalukuyang participle ang tuloy-tuloy at matiyagang pagpapatuloy nang hindi labis na pinatitindi ang debosyonal na diwa.
- source_word: ὁμοθυμαδόν
  choice: nagkakaisa
  rationale: Natural na ipinahahayag sa Tagalog ang pagkakaisa at iisang layunin ng pangkat; hindi lamang pisikal na pagsasama.
- source_word: ἐν τῷ ἱερῷ
  choice: sa mga looban ng templo
  rationale: Ang ἱερόν ay tumutukoy sa buong kompleks ng templo, hindi lamang sa panloob na santuwaryo; nililinaw ito ng 'mga looban.'
- source_word: κλῶντές ... ἄρτον
  choice: nagpipira-piraso ng tinapay
  rationale: Pinananatili ang konkretong idyoma ng Griyego at ang posibleng saklaw nito mula sa karaniwang salu-salo hanggang sa hapunang may espirituwal na kabuluhan.
- source_word: κατ’ οἶκον
  choice: sa bahay-bahay
  rationale: Karaniwang Tagalog na distributibong pahayag para sa gawaing nagaganap sa iba’t ibang tahanan.
- source_word: μετελάμβανον τροφῆς
  choice: Sama-sama nilang kinakain ang kanilang pagkain
  rationale: Ipinakikita ang patuloy na pakikibahagi sa pagkain sa kontekstong pangkomunidad; natural ito sa Tagalog at hindi ipinapalagay na ang pandiwa ay nangangahulugang namamahagi lamang.
- source_word: τροφῆς
  choice: pagkain
  rationale: Tuwirang katumbas na nananatiling malapit sa leksikal na kahulugan at hindi nililimitahan sa isang tiyak na uri ng kainan.
- source_word: ἐν ἀγαλλιάσει
  choice: nang may galak
  rationale: Malinaw at marangal na katumbas ng masidhing kagalakan, nang hindi nagiging magarbo ang pananalita.
- source_word: ἀφελότητι καρδίας
  choice: tapat na puso
  rationale: Natural sa modernong Tagalog at naihahatid ang kawalang-pagkukunwari o bukas na kalooban; inilalahad sa talababa ang iba pang posibleng diin ng pambihirang salita.
theological_decisions:
- issue: Kung ang 'pagpipira-piraso ng tinapay' ay dapat tahasang tukuyin bilang Hapunan ng Panginoon
  choice: Panatilihin ang malawak na idyomang 'nagpipira-piraso ng tinapay' sa konteksto ng sama-samang pagkain.
  alternative: Isalin ito bilang karaniwang salu-salo lamang, o tahasang tawaging Hapunan ng Panginoon.
  rationale: Maaaring tumukoy ang parirala sa karaniwang pagkain at maaari ring umalingawngaw sa pagsasalo ng Hapunan ng Panginoon. Sinusuportahan ng τροφῆς ang aktuwal na pagkain, ngunit hindi nito ganap na inaalis ang posibleng espirituwal na pahiwatig; kaya pinananatili ang tensiyon at nililinaw sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang 'bahay-bahay' at 'nagkakaisa' bilang likas na mga pahayag, habang pinanatili sa mga talababa ang leksikal at teolohikal na kalabuan.
