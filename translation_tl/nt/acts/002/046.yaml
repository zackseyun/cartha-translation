  rationale: Pinalitan ang hindi natural na “nagpipira-piraso” ng mas likas na “naghahati-hati,” at ang mas makitid na “tapat na puso” ng “payak na puso,” na mas mahusay na pinananatili ang lawak ng ἀφελότης. Inayos din ang salin ng μετελάμβανον τροφῆς at ang kaugnay na talababa upang maging natural at leksikal na magkakatugma, nang hindi nilulutas ang pinagtatalunang sakramental na pahiwatig ng ‘breaking bread.’
