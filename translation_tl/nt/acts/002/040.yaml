base_translation:
  language: en
  yaml_path: translation/nt/acts/002/040.yaml
  text: And with many other words he solemnly testified and kept urging them[a], saying, “Be saved from this crooked generation.”
translation:
  language: tl
  text: Sa marami pang ibang salita, taimtim siyang nagpatotoo at patuloy na humimok sa kanila[a], na sinasabi, “Maligtas kayo mula sa likong salinlahing ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Iligtas ninyo ang inyong sarili mula sa likong salinlahing ito.” Pasibo ang pandiwang Griyego na isinaling “Maligtas kayo,” ngunit isinasalin itong mas aktibo sa ilang salin upang ipakita ang panawagang tumugon ang mga nakikinig.
    reason: alternative_reading
lexical_decisions:
- source_word: ἑτέροις τε λόγοις πλείοσιν
  choice: sa pamamagitan ng marami pang ibang salita
  rationale: Pinananatili nito ang instrumental na diwa ng parirala at kapuwa ang ἑτέροις (“ibang”) at πλείοσιν (“marami pa”), habang natural pa rin sa Tagalog.
- source_word: διεμαρτύρατο
  choice: taimtim siyang nagpatotoo
  rationale: Ipinahahayag nito ang mariin at seryosong pagpapatotoo ng διαμαρτύρομαι nang hindi ito nililimitahan sa kahulugang “nagbabala.”
- source_word: παρεκάλει
  choice: patuloy silang hinimok
  rationale: Ang “patuloy” ay nagpapakita sa aspektong di-ganap ng imperfect, at ang “hinimok” ay angkop sa mapilit na panawagan sa kontekstong ito.
- source_word: Σώθητε
  choice: Maligtas kayo
  rationale: Pinananatili ang pasibong anyo ng aorist imperative at ang tunay na panawagan sa mga nakikinig, nang hindi ginagawang tahasang pagliligtas sa sarili.
- source_word: ἀπὸ
  choice: mula sa
  rationale: Natural na nagpapahayag ng paghiwalay o pagkalayo mula sa tinutukoy na salinlahi.
- source_word: γενεᾶς
  choice: salinlahi
  rationale: Tuwirang katumbas na tumutukoy sa magkakasabay na nabubuhay na pangkat ng mga tao at nagpapanatili ng biblikal na himig.
- source_word: σκολιᾶς
  choice: likong
  rationale: Pinananatili ang metaporang moral ng σκολιός—isang bagay na hindi tuwid—sa maikli at malinaw na salitang Tagalog.
theological_decisions:
- issue: Tinig at ahensiya sa Σώθητε
  choice: Maligtas kayo
  alternative: Iligtas ninyo ang inyong sarili
  rationale: Pasibo ang pandiwang Griyego, kaya pinananatili ang anyong iyon upang hindi magpahiwatig ng mas matinding sariling pagliligtas kaysa sa sinasabi ng teksto. Gayunman, dahil pautos ito, nananatili ang tunay na panawagan sa mga nakikinig na tumugon.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “salinlahi” upang panatilihin ang leksikal at biblikal na diwa ng γενεά, at “liko” upang mapanatili ang malinaw na larawang moral ng σκολιός. Inilagay ang panandang [a] sa pangunahing teksto at itinugma ito sa talababa.
