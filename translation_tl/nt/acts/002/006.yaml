  naturalness: Ang binagong pangungusap ay malinaw at likas sa makabagong Filipino. Ang “tunog” ay mas neutral at mas malapit sa φωνή kaysa “ingay,” na maaaring magpahiwatig ng hindi kanais-nais o magulong ingay. Ang “ang kanilang pagsasalita” ay mas natural at hindi malabo kaysa “na nagsasalita sila.”
  terminology: Wastong pinili ang “wika” sa pangunahing teksto para sa διάλεκτος, na may talababa para sa mas literal na “diyalekto.” Ang “bawat isa ... sa sarili niyang wika” ay angkop na distributibong pagpapahayag at walang di-kinakailangang pagtukoy sa kasarian.
