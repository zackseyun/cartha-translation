base_translation:
  language: en
  yaml_path: translation/nt/acts/002/006.yaml
  text: And when this sound occurred[a], the crowd came together and was bewildered[b], because each one was hearing them speaking in his own dialect.
translation:
  language: tl
  text: Nang mangyari ang tunog na ito, nagtipon ang maraming tao at naguluhan, sapagkat naririnig ng bawat isa ang kanilang pagsasalita sa sarili niyang wika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa sarili niyang diyalekto.” Maaaring tumukoy ang salitang Griyego sa isang wika o, nang mas tiyak, sa katutubo o panrehiyong anyo ng pananalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ τῆς φωνῆς ταύτης
  choice: Nang marinig ang ingay na ito
  rationale: Ang pariralang genitive absolute ay nagbibigay ng pangyayaring temporal. Maaaring tumukoy ang φωνή sa tunog, ingay, o tinig. Ginamit ang likas na pariralang Filipino na “nang marinig ang ingay na ito” upang ipahayag na ang naririnig na pangyayari ang naging dahilan ng pagtitipon, nang hindi tinutukoy kung iyon ay tunog ng hangin o ng pagsasalita.
- source_word: συνῆλθε τὸ πλῆθος
  choice: nagtipon ang maraming tao
  rationale: Ipinahahayag ng συνέρχομαι ang pagtitipon sa isang lugar, at ang πλῆθος ay isang malaking pangkat. Mas natural sa kasalukuyang Filipino ang “maraming tao” kaysa “karamihan” o “kalipunan” sa tagpong ito.
- source_word: συνεχύθη
  choice: naguluhan
  rationale: Saklaw ng pandiwa ang pagkalito o pagkabagabag. Ang “naguluhan” ay malinaw, natural, at hindi nagdaragdag ng hiwalay na damdaming wala sa teksto.
- source_word: ἤκουον εἷς ἕκαστος
  choice: naririnig ng bawat isa
  rationale: Pinananatili ng “naririnig” ang patuloy na aspekto ng imperfect, habang pinananatili ng “bawat isa” ang mariing distributibong diwa.
- source_word: τῇ ἰδίᾳ διαλέκτῳ
  choice: sa sarili niyang wika
  rationale: Maaaring mangahulugan ang διάλεκτος ng wika o diyalekto, lalo na ng katutubong o panrehiyong pananalita. “Wika” ang mas natural at madaling maunawaan sa Filipino; inilalagay sa talababa ang mas tiyak na alternatibong “diyalekto.”
- source_word: λαλούντων αὐτῶν
  choice: na nagsasalita sila
  rationale: Ang panghalip ay tumutukoy sa mga tagapagsalitang nabanggit na sa konteksto. Hindi sila tinukoy nang mas makitid bilang mga apostol, yamang hindi iyon tahasang sinasabi ng talatang ito.
theological_decisions:
- issue: Kung ang himala ay nasa pagsasalita o sa pandinig
  choice: naririnig ng bawat isa na nagsasalita sila sa sarili niyang wika
  alternative: nagsasalita sila sa sari-saring wika
  rationale: Sinusunod ng salin ang pokus ng talata sa karanasan ng bawat nakikinig at hindi nilulutas nang higit sa sinasabi ng teksto kung paano eksaktong naganap ang himala.
- issue: Distributibong pagtukoy sa bawat tagapakinig
  choice: bawat isa ... sa sarili niyang wika
  alternative: bawat isa ... sa kani-kanilang wika
  rationale: Pinananatili ng isahang “sarili niyang” ang distributibong anyo ng εἷς ἕκαστος at ἰδίᾳ. Sa Filipino, ang “niya” ay hindi nakatali sa kasarian, kaya tumpak at natural ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang teknikal o makalumang mga salita sa pangunahing teksto; inilagay sa talababa ang “diyalekto” bilang mas literal na alternatibo.
