  yaml_path: translation/nt/acts/002/002.yaml
  text: And suddenly there came from heaven a sound like that of a violent rushing wind[a], and it filled the whole house where they were sitting.
translation:
  language: tl
  text: At biglang nagkaroon ng isang tunog mula sa langit na gaya ng malakas na hanging humahagibis[a], at pinuno nito ang buong bahay kung saan sila nakaupo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang tunog na gaya ng malakas na hanging rumaragasa.” Inihahambing ng Griyego ang tunog sa malakas at gumagalaw na hangin; hindi nito tahasang sinasabing may tunay na hangin na naroon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: nagkaroon
  rationale: Likas na pangyayaring pananalita sa Filipino para sa paglitaw ng isang tunog; naiiwasan ang matigas na literal na “nangyari.”
- source_word: ἄφνω
  choice: biglang
  rationale: Malinaw at karaniwang katumbas na nagpapahayag ng di-inaasahang pagdating.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Pinananatili ang langit bilang pinagmulan, hindi lamang ang pisikal na himpapawid.
- source_word: ἦχος
  choice: isang tunog
  rationale: Malawak at di-mapagpalagay na katumbas; hindi nito tinutukoy nang higit sa sinabi ng Griyego ang uri ng narinig.
- source_word: ὥσπερ
  choice: gaya ng
  rationale: Malinaw na pinananatili ang paghahambing at hindi sinasabing tunay na hangin mismo ang naroon.
- source_word: φερομένης
  choice: humahagibis
  rationale: Natural na inilalarawan sa Filipino ang mabilis at malakas na pagkilos ng hangin habang pinananatili ang dinamikong diwa ng participle.
- source_word: πνοῆς βιαίας
  choice: malakas na hangin
  rationale: Ang πνοή sa konteksto ay tumutukoy sa umiihip o gumagalaw na hangin, at ang βίαιος ay nagpapahiwatig ng puwersa. Ang “malakas” ay dignified at natural nang hindi nagmumungkahi ng mapaminsalang karahasan.
- source_word: ἐπλήρωσεν
  choice: napuno nito
  rationale: Pinananatiling ang tunog ang tinutukoy na pumuno sa bahay, ayon sa gramatika ng pangungusap.
- source_word: ὅλον τὸν οἶκον
  choice: ang buong bahay
  rationale: Direkta at natural na pinananatili ang kabuuang saklaw ng ὅλον.
- source_word: οὗ ἦσαν καθήμενοι
  choice: na kinauupuan nila
  rationale: Maikli at likas na Filipino para sa lugar kung saan sila nakaupo, habang pinananatili ang tagpo.
theological_decisions:
- issue: Kung literal na hangin o tunog na inihambing sa hangin ang inilalarawan
  choice: Tunog na gaya ng ugong ng humahagibis na malakas na hangin
  alternative: Isang literal na malakas na hangin ang pumuno sa bahay
  rationale: Ang ὥσπερ ay tahasang pananda ng paghahambing. Hindi dapat gawing literal na hangin ang inilalarawan kung tunog ang paksa ng tekstong Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ugong” upang maging natural ang pandinig na paghahambing, ngunit nananatiling “tunog” ang pangunahing katawagan at hindi ipinapalagay na literal na hangin ang naroon.
