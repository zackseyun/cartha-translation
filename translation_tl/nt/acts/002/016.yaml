id: ACT.2.16
reference: Acts 2:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτό ἐστιν τὸ εἰρημένον διὰ τοῦ προφήτου Ἰωήλ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/016.yaml
  text: But this is what was spoken through the prophet Joel:[a]
translation:
  language: tl
  text: Sa halip, ito ang sinabi sa pamamagitan ng propetang si Joel:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinabi ng propetang si Joel.” Maaaring magpahayag ng ahensiya ang Griyego, ngunit higit na pinananatili ng “sa pamamagitan ng” ang papel ni Joel bilang propetikong tagapamagitan ng mensahe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sa halip
  rationale: Itinatama nito ang maling palagay ng mga tao sa naunang konteksto; mas malinaw sa Filipino ang «Sa halip» kaysa payak na «Ngunit» para sa ganitong pagtutuwid.
- source_word: τοῦτό
  choice: ito
  rationale: Tumutukoy ang demonstratibo sa pangyayaring kasalukuyang nasasaksihan.
- source_word: ἐστιν
  choice: ang
  rationale: Sa likas na pangungusap na Filipino, naipapahayag ang kopulang Griyego sa pamamagitan ng panaguring nominal nang walang hiwalay na katumbas ng «is».
- source_word: τὸ εἰρημένον
  choice: ang sinabi
  rationale: Ang artikulo at perpektong pasibong participle ay substantibo; natural na ipinapahayag sa Filipino bilang «ang sinabi» habang pinananatili ang di-tiyak na tagapagsalita.
- source_word: διὰ
  choice: sa pamamagitan ng
  rationale: Ang διά na may genitive ay nagpapahiwatig ng tagapamagitan o instrumento, kaya malinaw na naipapakita ang tungkulin ni Joel bilang propetikong tagapamagitan.
- source_word: τοῦ προφήτου
  choice: propetang si
  rationale: Natural na anyong Filipino para sa titulo bago ang pangalan ng isang tao.
- source_word: Ἰωήλ
  choice: Joel
  rationale: Ginamit ang nakaugaliang baybay ng pangalan sa mga Bibliyang Filipino.
theological_decisions:
- issue: Propetikong pamamagitan sa διὰ τοῦ προφήτου Ἰωήλ
  choice: sa pamamagitan ng propetang si Joel
  alternative: sinabi ng propetang si Joel
  rationale: Pinananatili ng pangunahing salin ang posibleng diwa na si Joel ang tagapamagitan ng mensahe, nang hindi tahasang tinutukoy sa talata kung sino ang pinagmulan nito o nagdaragdag ng teorya tungkol sa inspirasyon.
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Ginamit ang «Sa halip» upang natural na maipakita ang pagtutuwid sa konteksto, at «sa pamamagitan ng» upang mapanatili ang ugnayang ipinahihiwatig ng Griyegong διά.
