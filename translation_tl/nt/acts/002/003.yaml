  text: καὶ ὤφθησαν αὐτοῖς διαμεριζόμεναι γλῶσσαι ὡσεὶ πυρός, ⸂καὶ ἐκάθισεν⸃ ἐφ’ ἕνα ἕκαστον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/003.yaml
  text: And tongues like fire appeared to them, being divided, and it came to rest on each one of them[a].
translation:
  language: tl
  text: At nagpakita sa kanila ang mga dilang tulad ng apoy, na nagkakahiwa-hiwalay, at dumapo ito sa bawat isa sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga dilang nagkakahiwa-hiwalay, na parang apoy” o “mga dila, na waring apoy.” Itinatampok ng pananalitang Griyego kapuwa ang nakikitang anyo at ang pagkakahati o pagkakabahagi nito sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθησαν
  choice: nagpakita
  rationale: 'Likas na salin para sa intransitibong diwa ng aorist passive: ang mga iyon ay naging nakikita sa kanila.'
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwirang ipinahihiwatig ang mga taong nakakita sa pagpapakita.
- source_word: διαμεριζόμεναι
  choice: na naghahati-hati
  rationale: Pinananatili ang kasalukuyang participial na anyo at ang kalabuan kung ang mga dila ay nahahati, naghihiwalay, o naipamamahagi.
- source_word: γλῶσσαι
  choice: mga dila
  rationale: Pinananatili ang biswal na larawan ng hugis-dila at ang leksikal na kaugnayan nito sa pagsasalita sa kasunod na salaysay; hindi ito pinapaliit sa 'mga ningas' o inuunahang ipakahulugan bilang mga wika.
- source_word: ὡσεὶ πυρός
  choice: tulad ng apoy
  rationale: Malinaw na paghahambing ito, hindi pahayag na literal na apoy ang nakita.
- source_word: ἐκάθισεν
  choice: ito ay lumapag
  rationale: Pinananatili ang mahalagang isahang pandiwa sa Griyego. Ang 'lumapag' ay likas para sa isang nakikitang bagay na tumigil o nanahan sa ibabaw ng isang tao, nang hindi gumagamit ng alanganing literal na 'umupo.'
- source_word: ἐφ’ ἕνα ἕκαστον αὐτῶν
  choice: sa bawat isa sa kanila
  rationale: Pinananatili ang diin na umabot ang pagpapakita sa bawat indibidwal.
theological_decisions:
- issue: Kalikasan ng pagpapakita noong Pentecostes
  choice: Isinalin bilang 'mga dilang tulad ng apoy,' hindi bilang literal na apoy o bilang mga wika lamang.
  alternative: mga ningas ng apoy; mga wikang tila apoy
  rationale: Ang ὡσεὶ ay nagpapahayag ng paghahambing, samantalang ang γλῶσσαι ay nagpapanatili kapuwa sa nakikitang larawan at sa kaugnayan nito sa pagsasalita. Hindi dapat gawing literal na apoy ang tanda o ikahon agad bilang mga wikang sinasalita.
- issue: Pagkakatugma ng maramihang 'mga dila' at isahang ἐκάθισεν
  choice: Pinanatili ang isahan sa 'ito ay lumapag.'
  alternative: lumapag ang mga ito
  rationale: Isahan ang pandiwang Griyego at maaaring tumukoy sa kabuuang pagpapakita bilang isang kolektibong penomeno. Hindi tahimik na ginawang maramihan ang tunay na tensiyong gramatikal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang 'mga dila' upang hindi mawala ang sadyang ugnayan ng biswal na tanda sa pagsasalita. Ang pariralang 'na naghahati-hati' ay medyo kapansin-pansin ngunit sadyang nagpapanatili sa tunay na kalabuan ng participle sa Griyego.
