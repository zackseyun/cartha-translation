revisions:
- from: At may mga dilang tulad ng apoy na nagpakita sa kanila, na naghahati-hati, at ito ay lumapag sa bawat isa sa kanila.[a]
  to: At nagpakita sa kanila ang mga dilang tulad ng apoy, na nagkakahiwa-hiwalay, at dumapo ito sa bawat isa sa kanila.[a]
  rationale: Pinalitan ang aktibong “naghahati-hati” ng “nagkakahiwa-hiwalay” upang mas tapat na maipahayag ang participle na διαμεριζόμεναι bilang isang prosesong pagkakahati o pagkakahiwalay. Pinalitan ang “lumapag” ng “dumapo” para sa mas likas na Filipino, ngunit pinanatili ang isahang panghalip na “ito” upang maipakita ang isahang ἐκάθισεν at ang posibleng kolektibong pagtukoy nito sa kabuuang pagpapakita.
