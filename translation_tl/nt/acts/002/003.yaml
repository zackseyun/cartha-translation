  source_fidelity: 'Ang pangunahing larawan ay napanatili: mga dila na tulad ng apoy ang nagpakita sa kanila, at ang isahang ἐκάθισεν ay maaaring tumukoy sa kolektibong pagpapakita. Gayunman, ang “na naghahati-hati” ay karaniwang aktibong nangangahulugang may hinahati ang mga dila, samantalang ang διαμεριζόμεναι rito ay mas natural na ‘nagkakahiwa-hiwalay’ o ‘nahahati/nagkakabahagi.’'
  naturalness: Mas likas at mas malinaw ang “nagkakahiwa-hiwalay” kaysa “naghahati-hati.” Ang “dumapo” ay higit na idiomatiko kaysa “lumapag” para sa isang nakikitang penomenong tumigil sa ibabaw ng mga tao, habang hindi nito ipinipilit na literal na apoy ito.
