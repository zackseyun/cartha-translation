revisions:
- from: At nagkaroon ng takot ang bawat isa[a], at maraming kababalaghan at tanda ang patuloy na nagagawa sa pamamagitan ng mga apostol.
  to: At nagkaroon ng takot ang bawat isa[a], at maraming kababalaghan at mga tanda ang nagaganap sa pamamagitan ng mga apostol.
  rationale: Pinalitan ang ‘patuloy na nagagawa’ ng ‘nagaganap’ upang maging likas sa Tagalog at malinaw na ang kababalaghan at mga tanda ang paulit-ulit o patuloy na nangyayari sa imperfect na salaysay. Inayos ang talababa upang magbigay ng mas direktang alternatibo para sa nuance na ‘awe,’ samantalang pinananatili sa pangunahing teksto ang ‘takot’ bilang pinakamalapit at hindi mapagpasyang salin ng φόβος.
