base_translation:
  language: en
  yaml_path: translation/nt/acts/002/043.yaml
  text: And fear came upon every soul[a], and many wonders and signs were being done through the apostles.
translation:
  language: tl
  text: At nagkaroon ng takot ang bawat isa[a], at maraming kababalaghan at mga tanda ang nagaganap sa pamamagitan ng mga apostol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Pagkamangha ang bumalot sa lahat.” Sa literal, “nagkaroon ng takot ang bawat kaluluwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγίνετο ... φόβος
  choice: nagkaroon ng takot
  rationale: Likas sa makabagong Tagalog ang pariralang ito at ipinahihiwatig nitong lumitaw o namayani ang takot, nang hindi labis na pinatitindi ang diwa ng Griyego.
- source_word: δὲ
  choice: At
  rationale: Nagpapatuloy ito sa salaysay at hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: πάσῃ ψυχῇ
  choice: ang bawat isa
  rationale: Ang literal na ‘bawat kaluluwa’ ay tumutukoy sa bawat tao; ang ‘bawat isa’ ang mas natural na katumbas sa kasalukuyang Tagalog. Inilalagay sa talababa ang literal na anyo.
- source_word: φόβος
  choice: takot
  rationale: Pinananatili ng ‘takot’ ang buong puwersa at posibleng saklaw ng salita, kabilang ang pangingilabot at paghanga, sa halip na paliitin ito sa ‘pagkamangha.’
- source_word: πολλά
  choice: maraming
  rationale: Ito ang tuwiran at natural na katumbas ng dami.
- source_word: τέρατα
  choice: kababalaghan
  rationale: Itinatampok nito ang pambihira at kamangha-manghang katangian ng mga gawa, habang nananatiling naiiba sa ‘mga tanda.’
- source_word: σημεῖα
  choice: tanda
  rationale: Pinananatili nito ang diwang ang mga gawang ito ay may itinuturo o pinatutunayan, at pinananatili rin ang nakapares na ‘kababalaghan at tanda.’
- source_word: διὰ τῶν ἀποστόλων
  choice: sa pamamagitan ng mga apostol
  rationale: Ipinakikita ng διά na ang mga apostol ang kasangkapan o tagapamagitan ng pagkilos, nang hindi sila kinakailangang gawing sukdulang pinagmulan nito.
- source_word: ἐγίνετο
  choice: patuloy na nagagawa
  rationale: Ipinahahayag ng ‘patuloy’ ang diwang nagpapatuloy o nauulit ng imperfect, at ang ‘nagagawa’ ay angkop sa mga kababalaghan at tanda na nagaganap sa pamamagitan ng mga apostol.
theological_decisions:
- issue: Saklaw ng φόβος bilang tugon sa mga tanda sa pamamagitan ng mga apostol
  choice: takot
  alternative: pagkamangha / mapitagang pagkamangha
  rationale: Maaaring saklawin ng φόβος ang takot at pagkamangha sa harap ng pagkilos ng Diyos. Pinananatili ng ‘takot’ ang leksikal at teolohikal na tensiyon sa halip na lutasin ito bilang pagkamangha lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘kababalaghan at tanda’ bilang magkaibang ngunit magkaugnay na termino, at pinanatili ang ‘sa pamamagitan ng’ upang maipakita ang instrumental na diwa ng Griyego.
