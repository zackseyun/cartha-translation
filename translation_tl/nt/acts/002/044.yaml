  yaml_path: translation/nt/acts/002/044.yaml
  text: And all the believers were together and had all things in common,[a]
translation:
  language: tl
  text: At magkakasama ang lahat ng sumasampalataya, at magkakasalo sila sa lahat ng bagay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nasa iisang lugar.” Ang pananalitang Griyego ay maaaring tumukoy sa pagiging magkakasama o sama-samang nagtitipon.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: lahat
  rationale: Pinananatili ang saklaw ng salitang Griyego sa buong pangkat na tinutukoy ng kasunod na participle.
- source_word: δὲ
  choice: At
  rationale: Nagsasaad ito rito ng payak na pagpapatuloy ng salaysay, hindi ng matinding pagsalungat.
- source_word: οἱ πιστεύοντες
  choice: mga sumasampalataya
  rationale: Likas sa modernong Tagalog at naipapahayag ang pangkat na kinikilala sa kanilang pananampalataya; hindi ipinipilit kung ang aspekto ay dapat unawaing isang natapos lamang na pagkilos.
- source_word: ἦσαν ἐπὶ τὸ αὐτό
  choice: magkakasama
  rationale: Natural na katumbas ng idyomang maaaring tumukoy sa kanilang pagiging sama-sama o pagkakatipon, nang hindi labis na tinutukoy ang lokasyon.
- source_word: εἶχον
  choice: ay para sa
  rationale: Sa kombinasyong εἶχον ἅπαντα κοινά, ipinahahayag ang patuloy na kalagayang ang mga ari-arian ay itinuturing na magkakasalo ang komunidad, sa natural na Tagalog.
- source_word: ἅπαντα κοινά
  choice: ang lahat ng kanilang pag-aari ay para sa lahat
  rationale: Inihahayag nang malinaw at natural ang komunal na paggamit o pagkakaroon ng mga bagay; ang 'pag-aari' ay angkop sa konteksto, samantalang hindi nito sinasabing inalis na ang bawat anyo ng personal na pagmamay-ari.
theological_decisions:
- issue: Kalikasan ng sama-samang pamumuhay at pag-aari ng komunidad
  choice: Isinalin ang talata bilang paglalarawan na ang mga sumasampalataya ay magkakasama at ibinabahagi sa lahat ang kanilang mga pag-aari.
  alternative: Unawain ito bilang tahasang utos ng isang pangkalahatang sistemang pang-ekonomiya para sa lahat ng pamayanang Kristiyano.
  rationale: Inilalarawan ng Griyego ang ginagawa ng komunidad; wala rito ang anyo ng isang utos o tahasang pangkalahatang tuntunin. Hindi rin nilulutas ng salin ang mas malawak na tanong tungkol sa eksaktong anyo ng kanilang pagmamay-ari.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga sumasampalataya” sa halip na mas institusyonal na “mga mananampalataya,” at ipinaliwanag sa natural na paraan ang idyomang tungkol sa pagkakaroon ng lahat ng bagay bilang κοινά.
