  verdict: revise
  source_fidelity: Ang unang sugnay na “At magkakasama ang lahat ng mga sumasampalataya” ay tapat sa πάντες ... οἱ πιστεύοντες ἦσαν ἐπὶ τὸ αὐτό. Gayunman, ang “lahat ng kanilang pag-aari ay para sa lahat” ay bahagyang nagpapakitid sa ἅπαντα (“lahat ng bagay”) tungo sa mga ari-arian at maaaring magpahiwatig na para ito sa lahat ng tao, hindi lamang sa pangkat ng mga sumasampalataya. Ang “magkakasalo sila sa lahat ng bagay” ay mas malinaw na itinatali ang pagiging karaniwan sa komunidad nang hindi nagtatakda ng anyo ng legal na pagmamay-ari.
  naturalness: Likas at malinaw sa modernong Filipino Tagalog ang “magkakasama” at “magkakasalo sila sa lahat ng bagay.” Iniiwasan nito ang medyo malabong “para sa lahat.”
  terminology: Ang “mga sumasampalataya” ay angkop na katumbas ng οἱ πιστεύοντες at ang “magkakasalo” ay angkop sa κοινά nang hindi ipinapasok ang isang doktrinang pang-ekonomiya o legal na konsepto ng pagmamay-ari.
  issues:
  - severity: medium
    issue: Ang “lahat ng kanilang pag-aari” ay mas makitid kaysa “lahat ng bagay.”
    rationale: Ang ἅπαντα ay literal na “lahat ng bagay.” Bagaman ang konteksto ay may kinalaman sa mga ari-arian, hindi kailangang limitahan ng salin ang saklaw sa “pag-aari.”
  - severity: medium
    issue: Malabo ang saklaw ng “para sa lahat.”
    rationale: Maaari itong basahin bilang para sa lahat ng tao sa pangkalahatan. Ang Griyego ay tumutukoy sa mga mananampalataya bilang pangkat na may mga bagay na κοινά.
  revised_text: At magkakasama ang lahat ng sumasampalataya, at magkakasalo sila sa lahat ng bagay.[a]
