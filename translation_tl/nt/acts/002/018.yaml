review_pass:
  verdict: revise
  source_fidelity: Ang “Maging,” “mga aliping lalaki at aliping babae,” “sa mga araw na iyon,” at “mula sa aking Espiritu” ay maingat na tumutugon sa Griyego. Gayunman, ang “magsasalita sila bilang mga propeta” ay pagpapaliwanag ng προφητεύσουσιν sa halip na tuwirang salin nito.
  naturalness: Marangal at malinaw ang pangungusap, bagaman ang pag-uulit ng “sa aking mga aliping…” at “sa kanila” ay bahagyang mabigat. Maaaring panatilihin ang “sa kanila” upang maging natural ang pagtukoy ng “ibubuhos,” habang pinananatili ang pangunang parirala para sa mariing diin.
  terminology: Ang “aliping lalaki at aliping babae” ay angkop at pinananatili ang kasarian at mababang katayuang panlipunan ng δούλους/δούλας. Ang “magpopropesiya” ang tuwirang modernong Filipino na katumbas ng προφητεύσουσιν; hindi nito binabawasan ang termino tungo lamang sa pagsasalita.
  issues:
  - severity: medium
    issue: Ang “magsasalita sila bilang mga propeta” ay hindi tuwirang salin ng προφητεύσουσιν.
    rationale: Ang pandiwang Griyego ay nangangahulugang “magpopropesiya.” Ang kasalukuyang parirala ay maaaring tumukoy lamang sa pagsasalita na parang o bilang isang propeta at nagpapaliwanag sa halip na panatilihin ang leksikal na termino.
  revised_text: Maging sa aking mga aliping lalaki at aliping babae, sa mga araw na iyon ay ibubuhos ko sa kanila ang mula sa aking Espiritu, at magpopropesiya sila.
  revised_footnotes:
  - marker: a
    text: O “sa aking mga lingkod na lalaki at mga lingkod na babae.” Ang mga salitang Griyego ay maaaring tumukoy sa mga lingkod o mga alipin; ginamit dito ang “alipin” upang mapanatili ang diin sa kanilang mababang katayuan sa lipunan.
    reason: lexical_alternative
  - marker: b
    text: O “ibubuhos ko ang aking Espiritu.” Mas literal sa Griyego ang “mula sa aking Espiritu.”
    reason: lexical_alternative
  revision_rationale: Pinalitan ang nagpapaliwanag na “magsasalita sila bilang mga propeta” ng “magpopropesiya sila,” na mas tuwirang katumbas ng προφητεύσουσιν at karaniwang gamit sa modernong Filipino Tagalog. Walang ibang pagbabagong kailangan sa kahulugan o mga talababa.
