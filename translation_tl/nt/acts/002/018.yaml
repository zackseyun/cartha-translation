  text: καί γε ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου ἐν ταῖς ἡμέραις ἐκείναις ἐκχεῶ ἀπὸ τοῦ πνεύματός μου, καὶ προφητεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/018.yaml
  text: Even on my male servants and my female servants in those days I will pour out from my Spirit[b][a], and they will prophesy.
translation:
  language: tl
  text: Maging sa aking mga aliping lalaki at aliping babae, sa mga araw na iyon ay ibubuhos ko sa kanila ang mula sa aking Espiritu, at magpopropesiya sila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καί γε
  choice: Maging
  rationale: 'Ipinahahayag nito ang mariing pagdaragdag: umaabot ang ipinangako kahit sa mga taong mababa ang katayuan sa lipunan.'
- source_word: ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου
  choice: sa aking mga aliping lalaki at aliping babae
  rationale: Pinananatili ng “alipin” ang mababang katayuang panlipunan na mahalaga sa talata, at ng “lalaki at babae” ang hayagang pagkakaibang pangkasarian sa Griyego.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: sa mga araw na iyon
  rationale: Likas at tuwirang katumbas ng pariralang panahunan at ng demonstratibong “iyon.”
- source_word: ἐκχεῶ
  choice: ibubuhos ko
  rationale: Pinananatili ang metapora ng masaganang pagbibigay at ang aspektong panghinaharap ng pandiwa.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: ang mula sa aking Espiritu
  rationale: Pinananatili ang ἀπό na “mula sa” sa halip na gawing tuwirang “ang aking Espiritu”; idinagdag ang “sa kanila” bilang likas na Tagalog na pagtukoy sa mga naunang tatanggap.
- source_word: προφητεύσουσιν
  choice: magsasalita sila bilang mga propeta
  rationale: Malinaw at madaling maunawaang pagpapahayag ng pagpopropesiya nang hindi nagpapasok ng nilalamang wala sa teksto.
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλος/δούλη sa konteksto ng pagbuhos ng Espiritu
  choice: mga aliping lalaki at aliping babae
  alternative: mga lingkod na lalaki at mga lingkod na babae
  rationale: Mas malinaw na pinananatili ng “alipin” ang diin sa mababang katayuang panlipunan at ang nakakagulat na lawak ng kaloob ng Diyos, habang hindi inaalis ang pagkakaibang lalaki at babae.
- issue: Pagpapakahulugan sa ἀπὸ τοῦ πνεύματός μου
  choice: ang mula sa aking Espiritu
  alternative: ang aking Espiritu
  rationale: Pinananatili nito ang tunay na ἀπό (“mula sa”) at ang posibleng partitive na diwa nang hindi ipinapasiya kung ang tinutukoy ay isang bahagi o ang kabuuan ng Espiritu.
translation_notes:
  register: Makabago at marangal na Filipino, na may malinaw na sintaks para sa karaniwang mambabasa. Ginamit ang “alipin” para sa panlipunang diin, at “magsasalita bilang mga propeta” bilang madaling maunawaang katumbas ng teknikal na pandiwang “magpropesiya.”
