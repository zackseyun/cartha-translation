id: ACT.2.26
reference: Acts 2:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὰ τοῦτο ηὐφράνθη ⸂ἡ καρδία μου⸃ καὶ ἠγαλλιάσατο ἡ γλῶσσά μου, ἔτι δὲ καὶ ἡ σάρξ μου κατασκηνώσει ἐπ’ ἐλπίδι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/026.yaml
  text: Because of this my heart was glad[a], and my tongue rejoiced; moreover, even my flesh will dwell in hope.
translation:
  language: tl
  text: Dahil dito, nagalak ang puso ko, at nagbunyi ang dila ko; higit pa rito, maging ang laman ko ay mananahan sa pag-asa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang katawan ko ay magpapahinga nang may pag-asa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dahil dito
  rationale: Tuwirang ipinapahayag nito ang sanhi o batayan, gaya ng διά na may akusatibong τοῦτο, sa natural na modernong Tagalog.
- source_word: ηὐφράνθη ἡ καρδία μου
  choice: nagalak ang puso ko
  rationale: Pinananatili ang biblikal na idyoma ng “puso” bilang panloob na pagkatao, habang likas na ipinahahayag ng “nagalak” ang diwang intransitibo ng pandiwa.
- source_word: ἠγαλλιάσατο ἡ γλῶσσά μου
  choice: nagbunyi ang dila ko
  rationale: Ipinahihiwatig ng pandiwa ang masidhing galak; ang “nagbunyi” ay marangal at masigla, at ang “dila” ay nagpapanatili sa matalinghagang larawan ng Griyego.
- source_word: ἔτι δὲ καὶ
  choice: higit pa rito, maging
  rationale: Kapuwa nito naipapakita ang pagpapatuloy ng pahayag at ang pagbibigay-diin sa kasunod na “laman.”
- source_word: ἡ σάρξ μου
  choice: ang laman ko
  rationale: Literal at antropolohikal ang σάρξ dito, hindi tumutukoy sa makasalanang kalikasan. Pinananatili ng “laman” ang salita at ang tensiyong teolohikal ng sipi.
- source_word: κατασκηνώσει
  choice: mananahan
  rationale: Pinananatili nito ang larawan ng paninirahan o pagkakampo nang hindi agad nililimitahan ang kahulugan sa pagpapahinga.
- source_word: ἐπ’ ἐλπίδι
  choice: sa pag-asa
  rationale: Natural itong Tagalog para sa kalagayan o batayan ng may pag-asang katiwasayan, nang hindi nagdaragdag ng paliwanag na wala sa teksto.
theological_decisions:
- issue: Pagpapakahulugan sa σάρξ sa konteksto ng muling pagkabuhay
  choice: ang laman ko
  alternative: ang katawan ko
  rationale: Literal ang termino rito at bahagi ng siping kalauna’y iniuugnay ni Pedro sa muling pagkabuhay. Hindi pinapalitan ng salin ang “laman” ng mas interpretibong “katawan,” ngunit inilalagay ang alternatibo sa talababa para sa linaw.
- issue: Diwa ng κατασκηνώσει ἐπ’ ἐλπίδι
  choice: mananahan sa pag-asa
  alternative: magpapahinga nang may pag-asa
  rationale: Pinananatili ng pangunahing salin ang larawan ng ligtas na pananahan at hindi paunang nilulutas ang implikasyon nito tungkol sa kamatayan at muling pagkabuhay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinananatili ang makatang paralelismo ng “puso” at “dila,” pati ang literal na “laman” at larawan ng pananahan.
