  text: Δαυὶδ γὰρ λέγει εἰς αὐτόν· Προορώμην τὸν κύριον ἐνώπιόν μου διὰ παντός, ὅτι ἐκ δεξιῶν μού ἐστιν ἵνα μὴ σαλευθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/025.yaml
  text: For David says concerning him, ‘I kept seeing the Lord before me continually, because he is at my right hand, so that I may not be shaken.’
translation:
  language: tl
  text: Sapagkat ganito ang sinasabi ni David tungkol sa kanya, “Patuloy kong nakikita[a] ang Panginoon[b] sa harap ko, sapagkat nasa kanan ko siya upang hindi ako matinag.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Nakini-kinita ko nang patiuna.” Sa ilang konteksto, ang pandiwang Griyego ay maaaring mangahulugang makakita nang patiuna, ngunit dito, ang “sa harap ko” at ang diwang palagian ay higit na pumapabor sa patuloy na pagkakita.
    reason: lexical_alternative
  - marker: b
    text: Sinisipi rito ni Pedro ang Awit 16:8. Sa tekstong Hebreo ng Awit, ang katawagang pinagmulan nito ay ang banal na pangalang YHWH.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει εἰς αὐτόν
  choice: sinasabi ... tungkol sa kanya
  rationale: Sa pormulang nagpapakilala sa sipi, ang εἰς αὐτόν ay tumutukoy sa taong paksa ng sinasabi, hindi sa taong tuwirang kinakausap. Pinananatili ng “sinasabi” ang pangkasalukuyang anyo ng λέγει.
- source_word: Προορώμην ... διὰ παντός
  choice: Patuloy kong nakikita
  rationale: Ipinahahayag ng imperpektong Προορώμην at ng διὰ παντός ang nagpapatuloy o palagiang pagkilos. Natural sa modernong Tagalog ang “patuloy kong nakikita” at hindi nito binibigyan ng di-kinakailangang kahulugang prediktibo ang pandiwa.
- source_word: κύριον
  choice: ang Panginoon
  rationale: Tuwirang katumbas ito ng κύριον at pinananatili nito ang katawagang nasa sipi nang hindi ipinapasok sa teksto ang isang tiyak na interpretasyon sa tinutukoy nito.
- source_word: ἐνώπιόν μου
  choice: sa harap ko
  rationale: Pinananatili nito ang payak na larawang pang-ugnayan at pangkinalalagyan ng Griyego.
- source_word: ἐκ δεξιῶν μού
  choice: nasa kanan ko
  rationale: Natural itong salin ng idyomang tumutukoy sa pagkapuwesto sa kanang panig, na maaari ring magpahiwatig ng pag-alalay o pag-iingat nang hindi iyon idinaragdag sa teksto.
- source_word: ἵνα μὴ σαλευθῶ
  choice: upang hindi ako matinag
  rationale: Ang “upang” ay angkop sa layunin o bunga ng ἵνα, at ang “matinag” ay nagpapanatili sa talinghaga ng pagkawala ng katatagan.
theological_decisions:
- issue: Ang tinutukoy ng “Panginoon” sa sipi ng Awit ayon sa paggamit ni Pedro
  choice: Panatilihin ang “Panginoon” nang walang karagdagang pagkakakilanlan sa pangunahing teksto.
  alternative: “YHWH” o “Mesiyas”
  rationale: Ginagamit ni Pedro ang Awit 16 kaugnay ng Mesiyas, ngunit κύριον ang mismong nasa tekstong Griyego. Pinananatili ng salin ang tensiyon sa pagitan ng orihinal na konteksto ng Awit at ng kristolohikal na paggamit dito ni Pedro.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “matinag” upang mapanatili ang matalinghagang himig ng Awit, at iniwasan ang mas denominasyonal o interpretibong pagtukoy sa “Panginoon.”
