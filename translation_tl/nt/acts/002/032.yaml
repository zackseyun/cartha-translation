  verdict: revise
  source_fidelity: 'Maayos na naipapahayag ng draft na ang Diyos ang muling bumuhay kay Jesus at na ang pangkat na nagsasalita ay pawang mga saksi. Gayunman, ang «nito» ay hindi tapat na katumbas ng προσωπικό na genitibong οὗ, na tuwirang tumutukoy kay Jesus: «of whom.» Maaari itong magmukhang saksi sila sa isang pangyayari o pahayag, sa halip na mga saksi tungkol sa kanya.'
  naturalness: Natural at marangal ang ayos na «Ang Jesus na ito ay muling binuhay ng Diyos.» Mas malinaw at likas sa modernong Filipino ang «tungkol sa kanya» pagkatapos ng «mga saksi» kaysa «nito.»
