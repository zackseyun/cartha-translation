  text: τοῦτον τὸν Ἰησοῦν ἀνέστησεν ὁ θεός, οὗ πάντες ἡμεῖς ἐσμεν μάρτυρες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/032.yaml
  text: God raised up this Jesus[a], of whom we all are witnesses.
translation:
  language: tl
  text: Ang Jesus na ito ay muling binuhay ng Diyos,[a] at kaming lahat ay mga saksi tungkol sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ang Jesus na ito ay ibinangon ng Diyos.” Dito, ang pandiwang Griyego ay tumutukoy sa muling pagkabuhay mula sa kamatayan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: ang Jesus na ito
  rationale: Pinananatili nito ang mariing pantukoy na τοῦτον at natural nitong itinuturo sa Filipino ang Jesus na kababanggit lamang.
- source_word: ἀνέστησεν
  choice: muling binuhay
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa pagbuhay mula sa kamatayan. Malinaw sa karaniwang mambabasa ang “muling binuhay” at nananatiling Diyos ang gumagawa.
- source_word: ὁ θεός
  choice: ng Diyos
  rationale: Tahasang pinananatili ang Diyos bilang simuno ng pagkilos, bagaman nasa natural na ayos na pasibo ang pangungusap sa Filipino.
- source_word: οὗ
  choice: nito
  rationale: Ang genitibong panghalip ay likas na iniuugnay sa pagiging mga saksi. Sa Filipino, ang “mga saksi nito” ay maaaring tumukoy sa katatapos na pahayag o pangyayaring muling pagkabuhay nang hindi sapilitang nilulutas ang saklaw.
- source_word: πάντες ἡμεῖς
  choice: kaming lahat
  rationale: Pinananatili ang diin sa kabuuan ng pangkat sa natural na ayos ng Filipino; eksklusibo ang “kami” dahil kausap ni Pedro ang mga tagapakinig na hindi kabilang sa tinutukoy na mga saksi.
- source_word: ἐσμεν μάρτυρες
  choice: ay mga saksi
  rationale: Pinananatili ang pangngalang kayarian ng Griyego sa halip na gawing pandiwang “nagpapatotoo.”
theological_decisions:
- issue: Paglalarawan sa muling pagkabuhay
  choice: muling binuhay ng Diyos
  alternative: ibinangon ng Diyos
  rationale: Tahasang iniuugnay ng talata sa Diyos ang pagkabuhay ni Jesus mula sa kamatayan. Mas malinaw sa modernong Filipino ang “muling binuhay” kaysa “ibinangon,” na maaari ring mangahulugang pinatayo lamang.
- issue: Tinutukoy ng οὗ
  choice: mga saksi nito
  alternative: mga saksi tungkol sa kanya
  rationale: Maaaring iugnay ang panghalip kay Jesus o sa pangyayaring ipinahayag tungkol sa kanya. Ang “nito” ay likas na tumutukoy sa katatapos na pahayag at hindi labis na nilulutas ang posibleng saklaw.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang natural na ayos na pasibo upang mapanatiling prominente ang “ang Jesus na ito,” gaya ng mariing pantukoy sa Griyego, habang malinaw pa ring Diyos ang gumawa.
