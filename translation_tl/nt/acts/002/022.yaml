- from: '“Mga lalaking Israelita, pakinggan ninyo ang mga salitang ito: si Jesus na Nazareno[a], isang lalaking pinatunayan sa inyo ng Diyos sa pamamagitan ng mga himala, mga kababalaghan, at mga tanda[b] na ginawa ng Diyos sa pamamagitan niya sa gitna ninyo, gaya ng nalalaman ninyo mismo—”'
  to: '“Mga lalaking Israelita, pakinggan ninyo ang mga salitang ito: si Jesus na Nazareno[a], isang lalaking pinatunayan sa inyo ng Diyos sa pamamagitan ng mga himala, mga kababalaghan, at mga tanda[b] na ginawa ng Diyos sa pamamagitan niya sa gitna ninyo, gaya ng alam ninyo mismo—”'
