id: ACT.2.22
reference: Acts 2:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἄνδρες Ἰσραηλῖται, ἀκούσατε τοὺς λόγους τούτους. Ἰησοῦν τὸν Ναζωραῖον, ἄνδρα ⸂ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ⸃ εἰς ὑμᾶς δυνάμεσι καὶ τέρασι καὶ σημείοις οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς ἐν μέσῳ ὑμῶν, ⸀καθὼς αὐτοὶ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/022.yaml
  text: 'Men of Israel[a], hear these words: Jesus the Nazarene, a man attested to you by God with miracles and wonders and signs that God did through him in your midst[b], just as you yourselves know—'
translation:
  language: tl
  text: '“Mga lalaking Israelita, pakinggan ninyo ang mga salitang ito: si Jesus na Nazareno[a], isang lalaking pinatunayan sa inyo ng Diyos sa pamamagitan ng mga himala, mga kababalaghan, at mga tanda[b] na ginawa ng Diyos sa pamamagitan niya sa gitna ninyo, gaya ng alam ninyo mismo—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “si Jesus na taga-Nazaret” o “si Jesus na Nazoreo.” Ang Griyegong Ναζωραῖος ay maaaring isalin sa higit sa isang paraan bilang bansag o pagtukoy sa pinagmulan o pagkakakilanlan niya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga makapangyarihang gawa, mga kababalaghan, at mga tanda.” Ang Griyegong δυνάμεσι ay literal na tumutukoy sa mga kapangyarihan o makapangyarihang gawa at sa kontekstong ito ay karaniwang nauunawaan bilang mga himala.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Mga lalaking Israelita
  rationale: Pinananatili ang tahasang panlalaking anyo ng ἄνδρες at ang katawagang etniko na Ἰσραηλῖται, habang natural pa rin bilang tuwirang panawagan sa makabagong Tagalog.
- source_word: ἀκούσατε τοὺς λόγους τούτους
  choice: pakinggan ninyo ang mga salitang ito
  rationale: Ang προστακτική na ἀκούσατε ay panawagang magbigay-pansin. Mas natural sa Tagalog ang “pakinggan” kaysa literal na “dinggin” sa ganitong pampublikong pananalita, at pinananatili ng “mga salitang ito” ang λόγους.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: si Jesus na Nazareno
  rationale: Pinananatili ng “Nazareno” ang anyong pantukoy o bansag ng Ναζωραῖος nang hindi ipinapalagay na heograpikong parirala lamang ito.
- source_word: ἄνδρα
  choice: isang lalaki
  rationale: Tahasang nangangahulugang “lalaki” ang ἄνδρα; hindi ito ginawang mas malabong “tao” o “isa.”
- source_word: ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ εἰς ὑμᾶς
  choice: pinatunayan sa inyo ng Diyos
  rationale: Ipinahahayag ng ἀποδεδειγμένον ang hayag na pagpapatunay o pagpapatotoo. Pinananatili ng ayos ang Diyos bilang pinagmulan o gumaganap at ang mga tagapakinig bilang pinagpakitaan ng katibayan.
- source_word: δυνάμεσι καὶ τέρασι καὶ σημείοις
  choice: mga himala, mga kababalaghan, at mga tanda
  rationale: Sa kontekstong ito, ang δυνάμεις ay mga pagpapamalas ng kapangyarihan at natural na naipahahayag bilang “mga himala.” Pinananatili rin ang tatluhang hanay at ang pagkakaiba ng mga katawagan.
- source_word: οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς
  choice: na ginawa ng Diyos sa pamamagitan niya
  rationale: Malinaw na pinananatili ang Diyos bilang simuno ng ginawa at si Jesus bilang tagapamagitan, ayon sa ὁ θεὸς at δι’ αὐτοῦ.
- source_word: ἐν μέσῳ ὑμῶν
  choice: sa gitna ninyo
  rationale: Tuwirang sinasalamin ang idyomang nangangahulugang “sa piling ninyo” o “kabilang sa inyo,” habang pinananatili ang matingkad na larawan ng Griyego.
- source_word: καθὼς αὐτοὶ οἴδατε
  choice: gaya ng nalalaman ninyo mismo
  rationale: Pinananatili ng “ninyo mismo” ang diin ng αὐτοὶ at ng “gaya ng” ang καθώς.
theological_decisions:
- issue: Paglalarawan kay Jesus bilang ἄνδρα
  choice: Panatilihin ang “isang lalaki” sa pangunahing teksto.
  alternative: “isang tao” o “isa”
  rationale: Tahasang sinasabi ng Griyego na ἄνδρα. Pinananatili nito ang pahayag ng talata tungkol sa tunay na pagkatao ni Jesus nang hindi gumagawa ng anumang dagdag na pahayag tungkol sa kaniyang kalikasan.
- issue: Pagkilos ng Diyos sa mga himala
  choice: 'Gawing simuno ang Diyos: “na ginawa ng Diyos sa pamamagitan niya.”'
  alternative: “na ginawa niya sa gitna ninyo”
  rationale: Tahasang pinapangalanan ng Griyego ang Diyos bilang gumaganap at minamarkahan si Jesus bilang tagapamagitan. Pinananatili nito ang sariling paraan ng paglalahad ng talata at hindi nilulutas ang mas malawak na tensiyong kristolohikal.
- issue: Kalikasan ng pagpapatunay kay Jesus
  choice: “pinatunayan sa inyo ng Diyos”
  alternative: “sinang-ayunan ng Diyos”
  rationale: Ang “pinatunayan” ay nakatuon sa hayag na katibayang ibinigay sa mga tagapakinig; ang “sinang-ayunan” ay maaaring magpahiwatig lamang ng pagsang-ayon at magpasok ng kahulugang hindi sapat na saklaw ng parirala.
translation_notes:
  register: Makabago, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “Mga lalaking Israelita” upang mapanatili ang kasarian at etnikong katawagan ng orihinal; “pakinggan” at “nalalaman ninyo mismo” ay malinaw sa karaniwang mambabasa. Pinanatili ang em dash dahil nagpapatuloy ang pangungusap sa susunod na talata.
