id: ACT.11.20
reference: Acts 11:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦσαν δέ τινες ἐξ αὐτῶν ἄνδρες Κύπριοι καὶ Κυρηναῖοι, οἵτινες ⸀ἐλθόντες εἰς Ἀντιόχειαν ἐλάλουν ⸀καὶ πρὸς τοὺς ⸀Ἑλληνιστάς, εὐαγγελιζόμενοι τὸν κύριον Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/020.yaml
  text: But some of them were men from Cyprus and Cyrene[a], who, when they came to Antioch, were also speaking to the Hellenists, proclaiming the good news about the Lord Jesus.
translation:
  language: tl
  text: Ngunit ang ilan sa kanila ay mga lalaking taga-Cyprus at taga-Cirene. Pagdating nila sa Antioquia, patuloy silang nagsalita rin sa mga Helenista[a] at ipinahayag nila ang mabuting balita tungkol sa Panginoong Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mga Griyego” ang mababasa sa ilang manuskrito sa halip na “mga Helenista.” Kung ang basang ito ang orihinal, ang diwa ay nakipag-usap sila sa mga Hentil, hindi lamang sa mga Judiong nagsasalita ng Griyego.
    reason: textual_variant
lexical_decisions:
- source_word: τινες
  choice: ang ilan
  rationale: Tumutukoy sa isang di-tiyak na bahagi ng naunang pangkat; natural at malinaw ito sa modernong Tagalog.
- source_word: ἄνδρες
  choice: mga lalaki
  rationale: Tiyak na pangngalang panlalaki para sa mga lalaking nasa hustong gulang ang ginamit sa Griyego, kaya pinanatili ang kasarian.
- source_word: Κύπριοι καὶ Κυρηναῖοι
  choice: taga-Cyprus at taga-Cirene
  rationale: Ipinahahayag ng mga pang-uring ito ang kanilang pinagmulan; ang hulmahang “taga-” ay natural sa Tagalog.
- source_word: ἐλθόντες εἰς Ἀντιόχειαν
  choice: Pagdating nila sa Antioquia
  rationale: Likas na temporal na pagpapahayag ng aorist participle sa Tagalog.
- source_word: ἐλάλουν
  choice: nagsalita
  rationale: Natural na salaysay sa Tagalog; sa kontekstong ito, ang kilos na pakikipag-usap o pangangaral sa mga tao ang mahalaga, bagaman hindi tahasang minamarkahan ang aspektong imperpektibo.
- source_word: καὶ πρὸς
  choice: rin ... sa
  rationale: Ang καί ay malamang na pandagdag dito, na nagpapakitang lumawak ang mga kinausap; ang “rin” ang natural na katumbas.
- source_word: τοὺς Ἑλληνιστάς
  choice: mga Helenista
  rationale: Sinusunod ang tekstong SBLGNT at pinananatili ang katawagang maaaring tumukoy sa mga Judiong nagsasalita ng Griyego; ipinaliliwanag ang makabuluhang ibang basa sa talababa.
- source_word: εὐαγγελιζόμενοι
  choice: ipinahayag ang magandang balita tungkol sa
  rationale: Malinaw at madaling maunawaang pagpapahayag ng gawaing pagbabalita at ng nilalaman nito.
- source_word: τὸν κύριον Ἰησοῦν
  choice: Panginoong Jesus
  rationale: Pinananatili ang kristolohikal na titulong κύριος, gamit ang natural na ayos ng pangalan at titulo sa Tagalog.
theological_decisions:
- issue: Pagkakakilanlan ng τοὺς Ἑλληνιστάς at tekstuwal na baryanteng Ἕλληνας
  choice: Sinusunod sa pangunahing teksto ang SBLGNT na “mga Helenista,” na karaniwang tumutukoy sa mga Judiong nagsasalita ng Griyego.
  alternative: “mga Griyego,” na sa kontekstong ito ay maaaring tumukoy sa mga Hentil
  rationale: Mahalaga ang pagkakaiba sa pag-unawa sa paglawak ng misyon. Hindi dapat tahimik na pagpasiyahan ng salin ang tekstuwal at teolohikal na tensiyon, kaya inilalagay ang ibang basa sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang “Helenista” sa pangunahing teksto upang sundin ang ibinigay na SBLGNT, habang ipinaliliwanag agad sa talababa ang kahulugan at ang mahalagang tekstuwal na baryante.
