  to: Ngunit ang ilan sa kanila ay mga lalaking taga-Cyprus at taga-Cirene. Pagdating nila sa Antioquia, patuloy silang nagsalita rin sa mga Helenista[a] at ipinahayag nila ang mabuting balita tungkol sa Panginoong Jesus.
