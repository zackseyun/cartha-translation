base_translation:
  language: en
  yaml_path: translation/nt/acts/011/016.yaml
  text: Then I remembered the word of the Lord[a], how he said, ‘John baptized with water, but you will be baptized in the Holy Spirit.’
translation:
  language: tl
  text: 'Pagkatapos, naalala ko ang sinabi ng Panginoon: “Nagbautismo si Juan sa tubig, ngunit babautismuhan kayo sa Espiritu Santo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pamamagitan ng Espiritu Santo.” Ang preposisyong Griyego ay maaaring unawain bilang “sa” o “sa pamamagitan ng.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθην
  choice: naalala ko
  rationale: 'Likas at tuwirang katumbas ng deponent na anyong may aktibong diwa: ipinahahayag ni Pedro na naalala niya ang sinabi.'
- source_word: δὲ
  choice: Pagkatapos
  rationale: Nagpapahiwatig dito ng banayad na pagsulong sa salaysay, hindi ng matinding pagsalungat.
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: ang sinabi ng Panginoon
  rationale: Ang ῥῆμα ay tumutukoy sa binigkas na pahayag; mas natural sa makabagong Tagalog ang “sinabi” kaysa “salita” bago ang tuwirang sipi. Pinananatili ng “Panginoon” ang bigat at awtoridad ng κύριος.
- source_word: ὡς ἔλεγεν
  choice: kung paano niya sinabi
  rationale: Ipinakikilala nito ang nilalaman ng naalalang pahayag. Ang payak na “sinabi” ay natural at hindi nagpapahiwatig nang walang katiyakan na paulit-ulit itong sinabi.
- source_word: Ἰωάννης μὲν ... ὑμεῖς δὲ
  choice: si Juan ... ngunit ... kayo
  rationale: Natural na ipinahahayag ng “ngunit” ang paghahambing at pagsalungat na dala ng μὲν ... δὲ; pinananatili ang tahasang “kayo” bilang diin.
- source_word: ἐβάπτισεν ὕδατι
  choice: nagbautismo ... sa tubig
  rationale: Ang “nagbautismo” ang kinikilalang terminong kontekstuwal. Sa Tagalog, natural ang “sa tubig” at maaari itong tumukoy sa elemento o larangan ng bautismo.
- source_word: βαπτισθήσεσθε
  choice: babautismuhan kayo
  rationale: Tumpak na naghahatid sa hinaharap at balintiyak na anyo ng pandiwa.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: sa Espiritu Santo
  rationale: Ang “sa” ang pinakanatural na salin sa Tagalog at pinananatili nito ang lawak ng ἐν; maaaring maunawaan ang parirala bilang “sa loob/larangan ng” o “sa pamamagitan/kasangkapan ng,” kaya nililinaw ang alternatibo sa talababa.
theological_decisions:
- issue: Pagsasalin ng κύριος
  choice: Panginoon
  alternative: Guro
  rationale: Ang konteksto ay tumutukoy sa awtoritatibong sinabi ni Jesus; pinananatili ng “Panginoon” ang karaniwang gamit at teolohikal na bigat nang hindi nagdaragdag ng paliwanag.
- issue: Diwa ng ἐν sa ἐν πνεύματι ἁγίῳ
  choice: sa Espiritu Santo
  alternative: sa pamamagitan ng Espiritu Santo
  rationale: Maaaring lokatibo o instrumental ang ἐν. Ang “sa” sa pangunahing teksto ay likas at may sapat na lawak, habang inilalahad sa talababa ang posibleng instrumental na pagkaunawa upang hindi lutasin nang sapilitan ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sinabi ng Panginoon” sa halip na mas literal ngunit hindi gaanong likas na “salita ng Panginoon.” Ang talababa ay inilagay kaagad sa pariralang tinutukoy nito.
