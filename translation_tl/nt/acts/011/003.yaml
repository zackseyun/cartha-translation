  yaml_path: translation/nt/acts/011/003.yaml
  text: saying[a], “You went in to uncircumcised men and ate with them.”
translation:
  language: tl
  text: na nagsasabi, “Pumasok ka sa kinaroroonan ng mga lalaking hindi tuli[a] at kumain kang kasama nila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pariralang “mga lalaking hindi tuli” ay tumutukoy sa mga lalaking walang tanda ng pagtutuli sa tipang Judio—samakatuwid, sa mga Hentil.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: na sinasabi, “
  rationale: Pinananatili ang pandiwaring nag-uugnay sa naunang salaysay, at ginagawang tuwirang sipi ang ipinapasok ng ὅτι.
- source_word: Εἰσῆλθες πρὸς ἄνδρας
  choice: Pumasok ka sa tahanan ng mga lalaki
  rationale: Ipinahahayag nang natural sa Filipino ang konkretong pagpasok at paglapit sa mga taong tinutukoy; ang “tahanan” ay nagpapalinaw sa kinakailangang lugar nang hindi binabago ang diwa ng paratang.
- source_word: ἀκροβυστίαν ἔχοντας
  choice: hindi tuli
  rationale: Pinananatili ang tahasang katawagang may kaugnayan sa pagtutuli, sa halip na palitan agad ng mas interpretibong “mga Hentil.”
- source_word: συνέφαγες αὐτοῖς
  choice: kumaing kasama nila
  rationale: Likas na Filipino na malinaw na nagpapahayag ng sama-samang pagkain na nasa tambalang pandiwa.
theological_decisions:
- issue: Kung isasalin ang ἀκροβυστίαν ἔχοντας bilang “mga Hentil” o bilang “hindi tuli”
  choice: hindi tuli
  alternative: mga Hentil
  rationale: Ang mismong paratang ay nakatuon sa pagtutuli bilang tanda ng tipan at hangganang panlipunan-relihiyoso. Pinananatili ng “hindi tuli” ang diin at tensiyon ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang pambungad na “na sinasabi” ay sadyang nagpapanatili sa pagkakaugnay ng talata sa naunang pangungusap.
