  text: εἰς ἣν ἀτενίσας κατενόουν καὶ εἶδον τὰ τετράποδα τῆς γῆς καὶ τὰ θηρία καὶ τὰ ἑρπετὰ καὶ τὰ πετεινὰ τοῦ οὐρανοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/006.yaml
  text: As I looked intently into it[a], I was considering it, and I saw the four-footed animals of the earth, the wild beasts, the reptiles, and the birds of the sky.
translation:
  language: tl
  text: Nang titigan ko nang mabuti ang loob nito, pinagmasdan ko itong mabuti, at nakita ko ang mga hayop sa lupa na may apat na paa, ang mababangis na hayop, ang mga gumagapang na nilalang[a], at ang mga ibon sa himpapawid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga reptilya.” Mas malawak ang salitang Griyego at maaari itong tumukoy sa mga nilalang na gumagapang o umuusad sa lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν
  choice: ang loob nito
  rationale: Tumutukoy ito sa sisidlan o telang nakita ni Pedro. Ipinahihiwatig ng εἰς kasama ng ἀτενίζω na nakatuon ang tingin sa loob nito, hindi lamang sa ibabaw nito.
- source_word: ἀτενίσας
  choice: tinitigan kong mabuti
  rationale: Likas itong pahayag sa makabagong Filipino para sa masinsin at nakapokus na pagtingin.
- source_word: κατενόουν
  choice: maingat ko itong sinuri
  rationale: Ipinahahayag nito ang patuloy at mapanuring pagmamasid, na ikinaiiba sa payak na εἶδον na kasunod. Ang “Habang” ay tumutulong magpahiwatig ng nagpapatuloy na kilos.
- source_word: εἶδον
  choice: Nakita ko
  rationale: Payak at tuwirang katumbas ito ng aorist na pandiwa at malinaw na naiiba sa naunang masusing pagsusuri.
- source_word: τὰ τετράποδα τῆς γῆς
  choice: ang mga hayop sa lupa na may apat na paa
  rationale: Napananatili nito ang kategoryang may apat na paa at ang tahasang pagtukoy sa lupa, sa paraang madaling maunawaan.
- source_word: τὰ θηρία
  choice: ang mababangis na hayop
  rationale: Ipinakikita nito ang pagkakaiba ng mga mailap o mababangis na hayop sa mas malawak na naunang kategorya.
- source_word: τὰ ἑρπετὰ
  choice: ang mga gumagapang na nilalang[a]
  rationale: Mas malawak ito kaysa “mga reptilya” at mas mahusay na nagpapanatili sa kategoryang ginagamit sa mga salaysay ng paglikha at sa mga tuntunin tungkol sa kalinisan.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ang mga ibon sa himpapawid
  rationale: Ang “mga ibon” ay natural sa talaang ito, at ang “himpapawid” ay malinaw na tumutukoy sa kalangitan bilang tirahan ng mga ibon.
