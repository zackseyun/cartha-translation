  to: Nang titigan ko nang mabuti ang loob nito, pinagmasdan ko itong mabuti, at nakita ko ang mga hayop sa lupa na may apat na paa, ang mababangis na hayop, ang mga gumagapang na nilalang[a], at ang mga ibon sa himpapawid.
  rationale: Pinalitan ang “maingat ko itong sinuri” ng “pinagmasdan ko itong mabuti” upang maging mas natural sa modernong Filipino at mas malapit sa mapanuring kahulugan ng κατενόουν. Pinag-isa ang daloy ng pangungusap upang mapanatili ang pagkakaugnay ng pagtitig, pagmamasid, at pagkakita. Hindi binago ang mga kategorya ng hayop o ang footnote anchor at nilalaman nito.
