  source_fidelity: 'Ang pangunahing kahulugan at pagkakasunod ng mga kilos ay naipapahayag nang tapat: ang masinsing pagtingin sa loob ng sisidlan, ang mapanuring pagmamasid, at ang pagkakita sa mga kategorya ng hayop. Gayunman, ang “Habang tinitigan ... sinuri” ay hindi gaanong malinaw na naghihiwalay sa nakatuong pagtingin (ἀτενίσας) at sa nagpapatuloy na pagmamasid/pagsasaalang-alang (κατενόουν), at ang paghahati sa dalawang pangungusap ay bahagyang nagpapahina sa magkakaugnay na daloy ng Griyego.'
  naturalness: Natural ang karamihan ng bokabularyo. Mas idiomatiko at mas malapit sa pandiwang κατενόουν ang “pinagmasdan ko itong mabuti” kaysa “maingat ko itong sinuri,” na maaaring magpahiwatig ng pisikal o teknikal na pagsusuri. Ang isang tuloy-tuloy na pangungusap ay mas malinaw sa salaysay na ito.
  terminology: Ang “mga hayop sa lupa na may apat na paa,” “mababangis na hayop,” “mga gumagapang na nilalang,” at “mga ibon sa himpapawid” ay angkop at napananatili ang magkakaibang kategorya. Wasto ring panatilihin ang “mga gumagapang na nilalang” bilang pangunahing salin ng ἑρπετά at ilagay ang “mga reptilya” bilang alternatibo.
