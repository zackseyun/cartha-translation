lexical_decisions:
- source_word: ἐξῆλθεν
  choice: pumunta
  rationale: Sa kontekstong ito, natural na ipinahahayag ng “pumunta” ang pagkilos patungo sa Tarso. Hindi kailangang gawing literal na “lumabas,” dahil walang malinaw na pinanggalingang lugar na binanggit sa mismong talata at magiging alanganin iyon sa modernong Tagalog.
- source_word: δὲ
  choice: Pagkatapos
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay; ang “Pagkatapos” ay natural na tanda ng pagsulong ng pangyayari at hindi nagpapahiwatig ng pagsalungat.
- source_word: εἰς Ταρσόν
  choice: sa Tarso
  rationale: Ipinahihiwatig ng εἰς kasunod ng pandiwa ng pagkilos ang destinasyon. Ang “sa Tarso” ang karaniwang natural na anyo sa Tagalog pagkatapos ng “pumunta.”
- source_word: ἀναζητῆσαι
  choice: upang hanapin
  rationale: Ang pawatas ay nagsasaad ng layunin. Malinaw at natural ang “upang hanapin,” habang mapananatili sa talababa ang posibleng mas masidhing diwang “masusing hanapin.”
- source_word: Σαῦλον
  choice: Saulo
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang Saul sa salin ng Bibliya.
