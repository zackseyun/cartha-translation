  text: Then he went out to Tarsus to look for Saul,[a]
translation:
  language: tl
  text: Pagkatapos, pumunta siya sa Tarso upang hanapin si Saulo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang masusing hanapin si Saulo” o “upang matunton si Saulo.”
