base_translation:
  language: en
  yaml_path: translation/nt/acts/011/015.yaml
  text: And as I began to speak[c][b][a], the Holy Spirit fell on them just as it had on us at the beginning.
translation:
  language: tl
  text: Nang magsimula akong magsalita,[a] bumaba sa kanila ang Banal na Espiritu, kung paanong bumaba rin ito sa atin noong pasimula.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “habang nagsisimula akong magsalita.” Ang pagkakabuo sa Griyego ay maaaring magpahiwatig ng “nang” o “habang.”
    reason: lexical_alternative
  - marker: b
    text: Malamang na ang “noong pasimula” ay tumutukoy sa unang pagbuhos ng Espiritu sa mga alagad, samakatuwid ay sa Pentecostes.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν
  choice: At nang magsimula akong magsalita
  rationale: Ang ἐν kasama ng articular infinitive ay nagsasaad ng panahong kasabay ng kilos; natural sa modernong Tagalog ang “nang magsimula akong magsalita” at ipinakikitang naganap ito sa mismong pagsisimula ng pagsasalita ni Pedro.
- source_word: ἐπέπεσεν
  choice: bumaba sa
  rationale: Ang ἐπιπίπτω ἐπί ay masiglang idyoma sa Mga Gawa para sa pagdating ng Espiritu sa mga tao. Ang “bumaba sa” ay malinaw at natural sa Tagalog, habang pinananatili ang larawan ng pagkilos mula sa itaas nang hindi dinaragdagan ang kahulugan.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: ang Banal na Espiritu
  rationale: Ito ang pamantayan, malinaw, at marangal na salin sa modernong Tagalog.
- source_word: ὥσπερ καὶ ἐφ’ ἡμᾶς
  choice: gaya rin ng nangyari sa atin
  rationale: Pinananatili ng “gaya rin” ang malapit na paghahambing at ang diin ng καί; ang ipinahiwatig na pangyayari ay likas na inilalahad sa Tagalog upang maiwasan ang pilit na “gaya rin sa atin.”
- source_word: ἐν ἀρχῇ
  choice: noong pasimula
  rationale: Ang parirala ay temporal at tumutukoy sa isang naunang panimulang pangyayari. Ang “noong pasimula” ay idiomatiko at hindi ito tahasang pinangangalang Pentecostes sa pangunahing teksto.
theological_decisions:
- issue: Tinutukoy ng ἐν ἀρχῇ
  choice: Pinanatili sa teksto bilang “noong pasimula,” na malamang ay tumutukoy sa unang pagbuhos ng Espiritu sa mga alagad.
  alternative: Isang pangkalahatang “noong una” na walang tiyak na pagtukoy sa Pentecostes.
  rationale: Inihahambing ni Pedro ang nangyari sa sambahayan ni Cornelio sa naunang nangyari “sa atin.” Malamang na Pentecostes ang tinutukoy, ngunit hindi ito tahasang pinangalanan ng Griyegong teksto, kaya pinananatiling malawak ang pangunahing salin at ipinapaliwanag lamang sa talababa.
- issue: Larawan ng ἐπέπεσεν para sa pagkilos ng Espiritu
  choice: “bumaba sa kanila”
  alternative: “dumating sa kanila” o ang higit na literal ngunit di-likas na “nahulog sa kanila”
  rationale: Pinananatili ng “bumaba” ang masiglang larawan ng Griyego nang hindi nagmumungkahi ng aksidente o pisikal na pagkahulog, at hindi rin nito tinutukoy ang paraan o sakramental na kahulugan ng pangyayari.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Iniwasan ang sobrang literal na “nahulog” at ang tahasang paglalagay ng “Pentecostes” sa pangunahing teksto. Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
