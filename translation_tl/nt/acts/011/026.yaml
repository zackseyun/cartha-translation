  text: καὶ εὑρὼν ⸀ἤγαγεν εἰς Ἀντιόχειαν. ἐγένετο δὲ ⸂αὐτοῖς καὶ⸃ ἐνιαυτὸν ὅλον συναχθῆναι ⸀ἐν τῇ ἐκκλησίᾳ καὶ διδάξαι ὄχλον ἱκανόν, χρηματίσαι τε ⸀πρώτως ἐν Ἀντιοχείᾳ τοὺς μαθητὰς Χριστιανούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/026.yaml
  text: And when he found him, he brought him to Antioch. And for a whole year they met together with the church and taught a considerable crowd; and it was in Antioch that the disciples were first called Christians.
translation:
  language: tl
  text: Nang matagpuan niya si Saulo, dinala niya ito sa Antioquia. Sa loob ng isang buong taon, nagtipon sila kasama ng iglesya[a] at nagturo sa maraming tao. Sa Antioquia unang tinawag na “mga Kristiyano” ang mga alagad.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagtipon sila sa iglesya.” Ang “iglesya” rito ay tumutukoy sa pamayanan ng mga mananampalataya, hindi kinakailangang sa isang gusali.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “unang tinawag na mga Kristiyano.” Malamang na ang pangalang ito ay nagsimula bilang katawagang ginagamit ng publiko sa Antioquia.
    reason: cultural_note
lexical_decisions:
- source_word: εὑρὼν
  choice: Nang matagpuan niya si Saulo
  rationale: Ang aorist participle ay likas na ipinahayag bilang sugnay na panahunan. Ginamit ang pangalang Saulo, na malinaw na tinutukoy sa naunang talata, upang maiwasan ang alanganing sunod-sunod na panghalip sa Tagalog.
- source_word: ἤγαγεν
  choice: dinala niya ito
  rationale: Sa konteksto, ang ἄγω ay tumutukoy sa pagdadala kay Saulo sa Antioquia; natural at tumpak ang “dinala.”
- source_word: ἐνιαυτὸν ὅλον
  choice: Sa loob ng isang buong taon
  rationale: Malinaw na ipinapahayag ang tagal ng dalawang kasunod na gawain.
- source_word: συναχθῆναι ἐν τῇ ἐκκλησίᾳ
  choice: nagtipon sila kasama ng iglesya
  rationale: Ipinapakita ang pakikipagtipon nina Bernabe at Saulo sa pamayanang Cristiano at iniiwasang ipakahulugan ang ἐκκλησία bilang gusali.
- source_word: ἐκκλησίᾳ
  choice: iglesya
  rationale: Karaniwang katawagan sa modernong Filipino para sa pamayanang Cristiano; sa kontekstong ito ay hindi pangunahing tumutukoy sa isang gusali.
- source_word: διδάξαι ὄχλον ἱκανόν
  choice: nagturo sa maraming tao
  rationale: Natural na Filipino para sa pagtuturo sa isang malaking bilang ng mga tao, nang hindi labis na pinatitindi ang ἱκανόν.
- source_word: χρηματίσαι πρώτως
  choice: unang tinawag
  rationale: Pinananatili ang diwang pagtawag o pagtatalaga sa kanila sa isang pangalan sa unang pagkakataon.
- source_word: Χριστιανούς
  choice: mga Kristiyano
  rationale: Ito ay nakatatag nang katawagan sa isang pangkat, hindi lamang tuwirang paggamit sa titulong Χριστός; “mga Kristiyano” ang natural at kinikilalang katumbas sa Filipino.
theological_decisions:
- issue: Kung isasalin ba ang Χριστιανούς ayon sa etimolohiya nito o bilang nakatatag na pangalan ng pangkat
  choice: mga Kristiyano
  alternative: mga tagasunod ng Cristo / mga Mesianista
  rationale: Sa talata, ang salita ay isang pampublikong katawagan sa mga alagad. Ang “mga Kristiyano” ang kinikilalang pangalan at hindi nagdaragdag ng sektaryanong pakahulugan.
- issue: Kung ang ἐκκλησία ay pamayanan o gusali
  choice: iglesya bilang pamayanang kasama nilang nagtipon
  alternative: nagtipon sila sa loob ng gusali ng iglesya
  rationale: Sa unang-siglong konteksto ng Mga Gawa, ang ἐκκλησία ay tumutukoy sa kapulungan o pamayanan. Hindi dapat ipasok ang ideya ng isang nakatalagang gusali.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Antioquia” bilang nakaugaliang anyong biblikal at ang “Kristiyano” bilang natural na makabagong katawagan. Iningatan ang diin ng huling sugnay sa Antioquia bilang lugar kung saan unang ginamit ang pangalan.
