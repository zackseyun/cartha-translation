base_translation:
  language: en
  yaml_path: translation/nt/acts/011/011.yaml
  text: And behold[a], immediately three men arrived at the house where we were, having been sent to me from Caesarea.
translation:
  language: tl
  text: At narito, noon ding iyon ay dumating sa bahay na kinaroroonan namin ang tatlong lalaking isinugo sa akin mula sa Cesarea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaagad” o “sa mismong sandaling iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili ang pantawag-pansing gamit ng salitang Griyego at ang masiglang daloy ng salaysay nang hindi gumagamit ng lipas o labis na pormal na pananalita.
- source_word: ἐξαυτῆς
  choice: noon din
  rationale: Likas sa modernong Tagalog at malinaw na ipinahihiwatig ang agarang pagdating sa mismong sandaling iyon.
- source_word: τρεῖς ἄνδρες
  choice: ang tatlong lalaki
  rationale: Tuwirang isinasalin ang tiyak na bilang at ang panlalaking katawagan sa pinagmulan.
- source_word: ἐπέστησαν ἐπὶ τὴν οἰκίαν
  choice: dumating sa bahay
  rationale: Ipinahahayag ang kontekstuwal na diwa ng biglang pagdating sa isang lugar sa natural na Tagalog.
- source_word: ἐν ᾗ ἦμεν
  choice: na kinaroroonan namin
  rationale: Pinananatili ang payak na pahayag tungkol sa lokasyon at hindi idinaragdag na doon sila nanunuluyan.
- source_word: ἀπεσταλμένοι
  choice: isinugo
  rationale: Inihahayag ang pasibong pagkasugo na nauna sa kanilang pagdating; likas at marangal ang anyo sa Tagalog.
- source_word: ἀπὸ Καισαρείας πρός με
  choice: sa akin mula sa Cesarea
  rationale: Malinaw na ipinakikita na si Pedro ang nilayong puntahan at Cesarea ang pinagmulan nila.
