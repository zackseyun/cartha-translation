  text: ⸂ὅτε δὲ⸃ ἀνέβη Πέτρος εἰς ⸀Ἰερουσαλήμ, διεκρίνοντο πρὸς αὐτὸν οἱ ἐκ περιτομῆς
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/002.yaml
  text: But when Peter went up to Jerusalem[a], those of the circumcision were disputing with him.
translation:
  language: tl
  text: Ngunit nang umakyat si Pedro sa Jerusalem, nakikipagtalo sa kanya ang mga kabilang sa pagtutuli[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “ang mga mula sa pagtutuli.” Maaari rin itong isaling “ang pangkat ng pagtutuli” o “ang mga mananampalatayang tuli.” Tinutukoy nito ang isang pangkat ayon sa kaugnayan nila sa pagtutuli.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ngunit nang
  rationale: Ipinahihiwatig ng δέ ang pag-usad ng salaysay na may bahagyang pagsalungat; natural itong naipapahayag sa Filipino bilang “Ngunit nang.”
- source_word: ἀνέβη
  choice: umakyat
  rationale: Pinananatili nito ang karaniwang heograpiko at topograpikong pananalita tungkol sa pagpunta sa Jerusalem.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Ginamit ang nakasanayang anyo ng pangalan ng lugar sa modernong Filipino.
- source_word: διεκρίνοντο
  choice: nakipagtalo
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa hayagang pakikipagtalo o pagtutol kay Pedro, hindi lamang sa pag-aalinlangan. Ang anyong Griyego ay maaaring magpahiwatig ng nagpapatuloy na pagtutol, ngunit hindi kailangang gawing tahasang “patuloy” sa Filipino.
- source_word: πρὸς αὐτόν
  choice: sa kanya
  rationale: Kasama ng pandiwa ng pakikipagtalo, ipinakikita ng parirala kung kanino tuwirang nakatuon ang pagtatalo nang hindi pinatitingkad nang labis ang pagkapoot.
- source_word: οἱ ἐκ περιτομῆς
  choice: ang mga kabilang sa pagtutuli
  rationale: Pinananatili nito ang pagkakakilanlan ng pangkat ayon sa pagtutuli nang hindi tiyak na ipinapakahulugang isa na itong pormal na partido o na saklaw nito ang lahat ng Judiong mananampalataya.
theological_decisions:
- issue: Pagkakakilanlan ng οἱ ἐκ περιτομῆς
  choice: mga taong nakikilala sa kaugnayan nila sa pagtutuli
  alternative: lahat ng Judiong mananampalataya, o isang pormal na “partido ng pagtutuli”
  rationale: Tinutukoy ng Griyego ang isang pangkat sa pamamagitan ng kaugnayan nito sa pagtutuli, ngunit hindi nito tahasang nililinaw kung ito ay pormal na partido o kung eksaktong sino ang saklaw. Kaya pinanatili sa salin at talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “mga kabilang sa pagtutuli” ay bahagyang pormal ngunit nauunawaan at nakatutulong na mapanatili ang kalabuan ng orihinal nang hindi nagdaragdag ng isang pormal na katawagang pampangkat.
