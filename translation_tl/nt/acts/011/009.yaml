revisions:
- from: Ngunit sa ikalawang pagkakataon, isang tinig mula sa langit ang sumagot, “Ang nilinis ng Diyos ay huwag mong ituring na karaniwan[a].”
  to: Ngunit muling sumagot mula sa langit ang isang tinig, “Huwag mong ituring na marumi ang nilinis ng Diyos[a].”
  rationale: Inilipat ang pang-abay upang maging mas likas ang daloy ng Filipino nang hindi binabago ang diin na ito ay ang ikalawang tugon. Pinalitan ang "ituring na karaniwan" ng "ituring na marumi" upang malinaw na maihatid ang rituwal na kahulugan sa konteksto; ang mas literal na "pangkaraniwan" ay pinanatili sa talababa upang hindi mawala ang leksikal na pagkakaiba ng κοινόω at καθαρίζω.
