base_translation:
  language: en
  yaml_path: translation/nt/acts/011/009.yaml
  text: But a voice answered from heaven a second time[a], ‘What God has made clean, you must not call common.’
translation:
  language: tl
  text: Ngunit muling sumagot mula sa langit ang isang tinig, “Huwag mong ituring na marumi ang nilinis ng Diyos[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Huwag mong tawaging pangkaraniwan” o “huwag mong ituring na di-malinis.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: sumagot
  rationale: Karaniwang salin ng deponent na ἀποκρίνομαι at angkop sa daloy ng salaysay.
- source_word: φωνὴ
  choice: isang tinig
  rationale: Pinananatili ang di-tiyak na pagkakakilanlan ng nagsasalita at hindi ito labis na tinutukoy.
- source_word: ἐκ δευτέρου
  choice: sa ikalawang pagkakataon
  rationale: Tuwirang ipinahahayag na ito ang pangalawang pagbigkas, hindi lamang isang di-tiyak na pag-uulit.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Sa kontekstong ito, ang οὐρανός ay tumutukoy sa langit bilang pinagmulan ng tinig, hindi lamang sa himpapawid.
- source_word: Ἃ
  choice: Ang
  rationale: Ginagawang likas sa Tagalog ang neuter plural relative construction bilang pangkalahatang bagay o uri nang hindi kailangang ulitin ang ‘mga bagay na.’
- source_word: ὁ θεὸς
  choice: Diyos
  rationale: Tuwirang salin ng tahasang simuno.
- source_word: ἐκαθάρισεν
  choice: nilinis
  rationale: Ipinahahayag ang natapos na pagkilos ng Diyos; sa Tagalog, sapat ang aspektong perpektibo upang ipakita ang kilos na may umiiral na bunga.
- source_word: σὺ
  choice: mong
  rationale: Ang ikalawang panauhan ay malinaw na pinananatili sa pariralang ‘huwag mong,’ na natural sa Tagalog at may sapat na diin.
- source_word: μὴ κοίνου
  choice: huwag mong ituring na karaniwan
  rationale: Pinananatili ang pangunahing diwa ng κοινόω bilang pagturing na common o di-nakatalaga, sa halip na agad itong ipantay sa ‘marumi.’ Ang ‘ituring’ ay mas angkop dito kaysa literal na ‘gawing,’ sapagkat pagbabawal ito sa pagtatalaga o paghatol ni Pedro sa nilinis na ng Diyos.
theological_decisions:
- issue: Ang kahulugan ng κοινόω sa wikang may kaugnayan sa rituwal na kalinisan
  choice: ituring na karaniwan
  alternative: ituring na marumi o di-malinis
  rationale: Ang ‘karaniwan’ ay nagpapanatili sa kaibhan ng bagay na nilinis ng Diyos at ng bagay na itinuturing na common o hindi banal. Gayunman, dahil maaari itong mangahulugang rituwal na marumi sa kontekstong Judio, inilalagay ang mas malinaw na alternatibo sa talababa sa halip na tahimik na ipalit sa pangunahing teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ang ‘sa ikalawang pagkakataon’ ay malinaw ngunit hindi mabigat; ang ‘isang tinig’ ay hindi nagpapakilala nang higit sa sinasabi ng Griyego. Sadyang pinanatili sa pangunahing teksto ang bahagyang teknikal na ‘karaniwan,’ at nilinaw sa talababa ang kahulugang rituwal.
