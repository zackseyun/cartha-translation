  text: ἀναστὰς δὲ εἷς ἐξ αὐτῶν ὀνόματι Ἅγαβος ἐσήμανεν διὰ τοῦ πνεύματος λιμὸν ⸀μεγάλην μέλλειν ἔσεσθαι ἐφ’ ὅλην τὴν οἰκουμένην· ⸀ἥτις ἐγένετο ἐπὶ ⸀Κλαυδίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/028.yaml
  text: And one of them[a], named Agabus, stood up and indicated by the Spirit that a great famine was about to come over the whole inhabited world—which happened in the time of Claudius.
translation:
  language: tl
  text: Tumayo ang isa sa kanila, na nagngangalang Agabo, at ipinahiwatig niya sa pamamagitan ng Espiritu na magkakaroon ng matinding taggutom sa buong daigdig[a]—na nangyari noong panahon ni Claudio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa buong mundong tinitirhan”; sa Lucas—Mga Gawa, maaari rin itong tumukoy nang mas tiyak sa mundong saklaw ng Roma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: Tumayo
  rationale: Likas at tuwirang ipinahahayag ang kilos ni Agabo sa pagtitipon.
- source_word: ἐσήμανεν
  choice: ipinahiwatig
  rationale: Pinananatili ang diwa ng ‘nagpahiwatig/nagpaalam’ nang hindi labis na tinutukoy ang tiyak na paraan ng pahayag bilang isang pormal na pormula ng propesiya.
- source_word: διὰ τοῦ πνεύματος
  choice: sa pamamagitan ng Espiritu
  rationale: Malinaw na ipinahahayag ang paraan o ahensiya; ang malaking titik sa ‘Espiritu’ ay angkop sa kontekstong tumutukoy sa Banal na Espiritu.
- source_word: λιμὸν μεγάλην
  choice: isang matinding taggutom
  rationale: Sa Filipino, mas likas ilarawan ang tindi ng taggutom kaysa sabihing ‘malaking taggutom,’ habang tapat na naihahatid ang μεγάλην.
- source_word: μέλλειν ἔσεσθαι
  choice: magkakaroon
  rationale: Natural na Filipino para sa hinaharap na pagdating o pag-iral ng taggutom; pinananatili ng konteksto ang hulang mangyayari ito.
- source_word: ἐφ’ ὅλην τὴν οἰκουμένην
  choice: sa buong daigdig na tinitirhan
  rationale: Pinananatili ang literal na saklaw ng οἰκουμένη nang hindi agad nililimitahan sa Imperyong Romano; inilalahad sa talababa ang posibleng mas tiyak na saklaw.
- source_word: ἥτις ἐγένετο
  choice: at nangyari nga ito
  rationale: Likas na inuugnay sa Filipino ang hulang taggutom at ang kalaunang katuparan nito; ipinahihiwatig ng ‘nga’ ang pagpapatunay nang hindi nagdaragdag ng bagong nilalaman.
- source_word: ἐπὶ Κλαυδίου
  choice: noong panahon ni Claudio
  rationale: Tumpak at madaling maunawaang kronolohikal na pahayag, nang hindi ipinapasok sa teksto ang salitang ‘paghahari’ na hindi tahasang nasa Griyego.
theological_decisions:
- issue: Tinutukoy ng διὰ τοῦ πνεύματος
  choice: Ang Banal na Espiritu ang tinutukoy, kaya ‘Espiritu’ ang ginamit.
  alternative: Isang pahayag na kinasihan ng espiritu sa di-gaanong tiyak na diwa.
  rationale: Sa Mga Gawa, ang ‘Espiritu’ sa konteksto ng propetikong kapahayagan ay karaniwang tumutukoy sa Banal na Espiritu.
- issue: Saklaw ng οἰκουμένη
  choice: Pinanatili sa pangunahing teksto ang ‘buong daigdig na tinitirhan.’
  alternative: ‘Buong mundo’ o, nang mas tiyak, ‘buong daigdig ng Roma.’
  rationale: Maaaring tumukoy ang salita sa daigdig na tinitirhan sa pangkalahatan o sa mundong saklaw ng Roma. Hindi nilulutas nang tahasan sa pangunahing teksto ang tunay na lawak nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong Filipino na ‘Agabo’ at ‘Claudio.’ Iniwasan ang arkaikong pananalita at pinanatili ang posibleng kalabuan sa lawak ng οἰκουμένη sa pamamagitan ng talababa.
