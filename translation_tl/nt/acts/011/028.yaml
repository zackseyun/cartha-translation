revisions:
- from: Tumayo ang isa sa kanila na nagngangalang Agabo at ipinahiwatig sa pamamagitan ng Espiritu na magkakaroon ng isang matinding taggutom sa buong daigdig na tinitirhan[a]—at nangyari nga ito noong panahon ni Claudio.
  to: Tumayo ang isa sa kanila, na nagngangalang Agabo, at ipinahiwatig niya sa pamamagitan ng Espiritu na magkakaroon ng matinding taggutom sa buong daigdig[a]—na nangyari noong panahon ni Claudio.
  rationale: Pinakinis ang pangunahing teksto upang maging mas likas sa modernong Filipino, habang iniingatan sa talababa ang leksikal na diwa at ang hindi tiyak na saklaw ng οἰκουμένη. Inalis ang “nga” at inihanay ang pangwakas na sugnay sa relatibong ugnayan nito sa taggutom, alinsunod sa ἥτις ἐγένετο.
