  source_fidelity: Tumpak na naihahatid ng salin ang saklaw ng pandiwang διῆλθον ἕως (“nakarating hanggang”), ang kaugnayan ng kapighatian sa nangyari kay Esteban, at ang mariing paghihigpit na ang salita ay ipinahayag lamang sa mga Judio. Ang “nangalat” ay likas na Tagalog na paglalarawan ng mga taong naikalat/nagkahiwa-hiwalay sa ganitong konteksto, kahit hindi tahasang minamarkahan ang pasibo tulad ng Griyego.
