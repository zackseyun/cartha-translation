id: ACT.11.19
reference: Acts 11:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διασπαρέντες ἀπὸ τῆς θλίψεως τῆς γενομένης ἐπὶ Στεφάνῳ διῆλθον ἕως Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας μηδενὶ λαλοῦντες τὸν λόγον εἰ μὴ μόνον Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/019.yaml
  text: So then[a], those who had been scattered because of the affliction that arose over Stephen went as far as Phoenicia and Cyprus and Antioch[c][b], speaking the word to no one except Jews.
translation:
  language: tl
  text: Kaya nga, ang mga nangalat dahil sa paghihirap[a] na bumangon kaugnay ni Esteban ay nakarating hanggang Fenicia, Chipre, at Antioquia. Hindi nila ipinahayag ang salita[b] kaninuman maliban sa mga Judio lamang.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pag-uusig.” Ang salitang Griyego ay maaaring tumukoy sa paghihirap, kagipitan, o pag-uusig ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Ang “salita” rito ay tumutukoy sa ipinahahayag na mensahe tungkol kay Jesus; maaari ring “ang mensahe.”
    reason: lexical_alternative
  - marker: c
    text: 'Mariin ang Griyego: “maliban lamang sa mga Judio” o “maliban sa mga Judio lamang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διασπαρέντες
  choice: ang mga nangalat
  rationale: Pinananatili ang diwang pasibo/resultatibo ng pagkakawatak-watak ng mga mananampalataya, habang natural sa makabagong Tagalog ang “nangalat” sa kontekstong ito.
- source_word: θλίψεως
  choice: paghihirap
  rationale: Ang θλῖψις ay malawak na tumutukoy sa kagipitan, pagdurusa, o matinding panggigipit. Hindi ito awtomatikong nililimitahan sa teknikal na diwa ng “pag-uusig,” bagaman iyon ang ipinahihiwatig ng konteksto.
- source_word: τῆς γενομένης ἐπὶ Στεφάνῳ
  choice: na bumangon kaugnay ni Esteban
  rationale: Ipinahahayag nito na ang kagipitan ay sumiklab may kaugnayan sa nangyari kay Esteban, nang hindi labis na tinutukoy kung ito ay dahil lamang sa kaniya o laban lamang sa kaniya.
- source_word: διῆλθον ἕως
  choice: nakarating hanggang
  rationale: Natural na ipinakikita sa Tagalog ang lawak ng kanilang paglalakbay patungo sa mga binanggit na lugar.
- source_word: Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας
  choice: Fenicia, Chipre, at Antioquia
  rationale: Ginagamit ang karaniwang anyong Filipino ng mga pangalang heograpiko.
- source_word: μηδενὶ λαλοῦντες τὸν λόγον
  choice: Hindi nila ipinahayag ang salita kaninuman
  rationale: Ang “ipinahayag” ay angkop sa konteksto ng pagpapalaganap ng mensahe, samantalang pinananatili ng “ang salita” ang paulit-ulit na terminolohiya ni Lucas.
- source_word: εἰ μὴ μόνον Ἰουδαίοις
  choice: maliban sa mga Judio lamang
  rationale: Pinananatili ng “lamang” ang tahasang diin ng μόνον sa paghihigpit ng tagapakinig sa mga Judio.
theological_decisions:
- issue: Uri ng kagipitang kasunod ng nangyari kay Esteban
  choice: paghihirap
  alternative: pag-uusig
  rationale: Tiyak na may pag-uusig sa konteksto, ngunit mas malawak ang saklaw ng θλῖψις. Pinananatili ng salin ang lawak ng salita at inilalagay sa talababa ang mas tiyak na maaaring kahulugan.
- issue: Kahulugan ng τὸν λόγον sa Mga Gawa
  choice: ang salita
  alternative: ang mensahe tungkol kay Jesus
  rationale: Pinananatili nito ang tematikong pananalita ni Lucas at hindi tahasang dinaragdagan ang teksto, habang nililinaw sa talababa ang tinutukoy sa konteksto.
- issue: Diin ng paghihigpit sa mga tagapakinig
  choice: maliban sa mga Judio lamang
  alternative: maliban sa mga Judio
  rationale: Ang εἰ μή kasama ng μόνον ay mariing naghihigpit sa pangkat na pinangaralan; ang “lamang” ay nagpapanatili ng diing iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maging natural at madaling maunawaan nang hindi binabago ang ugnayang lohikal. Ginamit ang “Judio” bilang karaniwang makabagong katawagan at pinanatili ang “ang salita” bilang mahalagang terminolohiya sa Mga Gawa.
