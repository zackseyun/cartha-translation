id: ACT.11.1
reference: Acts 11:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἤκουσαν δὲ οἱ ἀπόστολοι καὶ οἱ ἀδελφοὶ οἱ ὄντες κατὰ τὴν Ἰουδαίαν ὅτι καὶ τὰ ἔθνη ἐδέξαντο τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/001.yaml
  text: The apostles and the brothers who were throughout Judea heard that the Gentiles also had received the word of God[a].
translation:
  language: tl
  text: Nabalitaan ng mga apostol at ng mga kapatid sa buong Judea na tinanggap din ng mga Hentil ang salita ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay maaaring tumukoy nang mas malawak sa mga kapwa mananampalataya, kapwa lalaki at babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: Nabalitaan
  rationale: Ang aorist ng ἀκούω ay tumutukoy rito sa pagkarinig nila ng isang ulat; natural sa makabagong Tagalog ang “nabalitaan.”
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang panandang diskurso ito na naglilipat ng salaysay, hindi matinding pagsalungat; hindi kailangan ng hiwalay na katumbas sa natural na Tagalog.
- source_word: οἱ ἀπόστολοι
  choice: mga apostol
  rationale: Ito ang kinikilalang katawagan sa tiyak na grupong apostoliko sa Mga Gawa.
- source_word: οἱ ἀδελφοὶ
  choice: mga kapatid
  rationale: Ang “kapatid” ay likas na walang tinutukoy na kasarian sa Tagalog at maaaring tumukoy sa kapwa mananampalataya, kaya napapanatili nito ang malawak na posibleng saklaw ng Griyego.
- source_word: οἱ ὄντες κατὰ τὴν Ἰουδαίαν
  choice: sa buong Judea
  rationale: Ipinahihiwatig ng κατά na nakakalat sila sa iba’t ibang bahagi ng Judea, hindi lamang na nasa rehiyong iyon.
- source_word: ὅτι καὶ τὰ ἔθνη
  choice: na ... din ng mga Hentil
  rationale: Ang καί ay nagpapatingkad na pati ang mga di-Judio ay kabilang; malinaw itong naipapahayag ng “din.”
- source_word: ἐδέξαντο
  choice: tinanggap
  rationale: Ang δέχομαι ay maaaring mangahulugang tumanggap o malugod na tumanggap; akma ang karaniwang idyomang “tinanggap ... ang salita.”
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Pinananatili nito ang pamilyar na biblikal na katawagan para sa mensaheng ipinahayag mula sa Diyos.
theological_decisions:
- issue: Saklaw ng ἀδελφοὶ sa komunidad ng mga mananampalataya
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga mananampalataya
  rationale: Bagaman panlalaking pangmaramihan ang anyong Griyego, maaari itong tumukoy nang mas malawak sa kapwa mananampalataya. Ang Tagalog na “mga kapatid” ay tapat sa metapora at hindi sapilitang nililimitahan ang kasarian.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nabalitaan” para sa natural na daloy ng iniulat na pangyayari at “sa buong Judea” upang mapanatili ang distributibong diwa ng pariralang Griyego.
