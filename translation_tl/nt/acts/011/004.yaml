- from: Ngunit ipinaliwanag sa kanila ni Pedro ang lahat nang sunod-sunod[a]. Sinabi niya,
  to: 'Ngunit nagsimulang magpaliwanag si Pedro sa kanila ayon sa pagkakasunod-sunod[a]:'
