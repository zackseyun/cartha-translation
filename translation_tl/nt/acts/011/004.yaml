translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maiwasan ang alanganing literal na anyong “nagsimulang magpaliwanag … na sinasabi,” habang pinananatili ang daloy patungo sa tuwirang pananalita.
