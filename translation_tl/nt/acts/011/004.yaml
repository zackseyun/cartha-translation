  yaml_path: translation/nt/acts/011/004.yaml
  text: But Peter began and explained it to them in order[a], saying,
translation:
  language: tl
  text: 'Ngunit nagsimulang magpaliwanag si Pedro sa kanila ayon sa pagkakasunod-sunod[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang sunod-sunod” o “isa-isang inilahad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος
  choice: ipinaliwanag … ni Pedro
  rationale: Ang aorist participle ay idyomatikong kaugnay ng pangunahing pandiwa at maaaring hindi hiwalay na isalin sa Tagalog; ang pagsisimula ng salaysay ay likas nang ipinahihiwatig ng pagpapaliwanag at ng kasunod na “Sinabi niya.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinapakita nito ang banayad na pagsalungat o paglipat mula sa paratang sa naunang talata tungo sa tugon ni Pedro.
- source_word: Πέτρος
  choice: Pedro
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa makabagong saling Tagalog.
- source_word: ἐξετίθετο
  choice: ipinaliwanag
  rationale: Sa konteksto, ang imperfect middle ay tumutukoy sa paglalahad o pagpapaliwanag ni Pedro ng nangyari; malinaw at natural ang “ipinaliwanag.”
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwirang katumbas ng dative plural na tumutukoy sa mga kausap ni Pedro.
- source_word: καθεξῆς
  choice: nang sunod-sunod
  rationale: Pinananatili nito ang diwa ng paglalahad ayon sa pagkakasunod-sunod nang hindi ipinapalagay na ang kahulugan ay “mula sa simula.”
- source_word: λέγων
  choice: Sinabi niya,
  rationale: Natural na ipinakikilala sa Tagalog ang tuwirang pananalitang kasunod, habang pinananatili ang ugnayan nito sa pagpapaliwanag ni Pedro.
