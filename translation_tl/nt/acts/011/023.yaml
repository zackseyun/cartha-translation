  to: Pagdating niya, nakita niya ang biyaya ng Diyos[a]. Nagalak siya at patuloy niyang hinimok ang lahat na manatili sa Panginoon[b] nang may matatag na pasiya sa puso.
  rationale: Inayos ang pambungad upang maging likas na modernong Filipino, habang pinananatili ang pagkakasunod ng pagdating, pagkakita, at pagkagalak. Pinalitan ang mas makitid na “manatiling tapat” ng “manatili sa Panginoon,” na mas malapit sa προσμένειν τῷ κυρίῳ at hindi nagdaragdag ng espesipikong teolohikal na pagpapakahulugan. Inayos din ang talababa a upang maging tunay na alternatibong leksikal at malinaw ang pagkakaangkla nito.
