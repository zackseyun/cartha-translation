  text: ὃς παραγενόμενος καὶ ἰδὼν τὴν χάριν ⸀τὴν τοῦ θεοῦ, ἐχάρη καὶ παρεκάλει πάντας τῇ προθέσει τῆς καρδίας ⸀προσμένειν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/023.yaml
  text: When he arrived and saw the grace of God, he rejoiced and kept urging them all to remain devoted to the Lord with purpose of heart,
translation:
  language: tl
  text: Pagdating niya, nakita niya ang biyaya ng Diyos[a]. Nagalak siya at patuloy niyang hinimok ang lahat na manatili sa Panginoon[b] nang may matatag na pasiya sa puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kagandahang-loob ng Diyos.” Maaaring tumukoy ang parirala sa nakikitang katibayan ng mapagbiyayang pagkilos ng Diyos sa kanila.
    reason: lexical_alternative
  - marker: b
    text: O “patuloy na kumapit sa Panginoon” o “manatiling tapat sa Panginoon.”
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενος
  choice: Pagdating niya
  rationale: Ipinahahayag ng aorist participle ang pagdating ni Bernabe sa lugar; likas at tuwiran ito sa modernong Filipino.
- source_word: ἰδὼν
  choice: pagkakita
  rationale: Pinananatili ang karaniwang pandiwang pandama ng ὁράω nang hindi ipinapakahulugan agad bilang espirituwal na pagkaunawa.
- source_word: τὴν χάριν τὴν τοῦ θεοῦ
  choice: sa biyaya ng Diyos
  rationale: Ang “biyaya” ay nagpapanatili sa bigat at lawak ng χάρις, kasama ang diwa ng mapagbiyayang pagkilos ng Diyos na nakikita sa nangyari.
- source_word: ἐχάρη
  choice: nagalak siya
  rationale: Natural at marangal na salin ng pandiwang nangangahulugang natuwa o nagalak.
- source_word: παρεκάλει
  choice: patuloy niyang hinimok
  rationale: Ipinakikita ng “patuloy” ang nagaganap o inuulit na kilos ng imperfect, samantalang ang “hinimok” ay angkop sa mapagpalakas-loob na pakiusap.
- source_word: πάντας
  choice: ang lahat
  rationale: Tumutukoy sa lahat ng mananampalatayang naroon nang hindi nagdaragdag ng bagong saklaw.
- source_word: τῇ προθέσει τῆς καρδίας
  choice: nang may matatag na pasiya sa puso
  rationale: Ang πρόθεσις ay layunin o matibay na pasiya, at ang καρδία ay sentro ng kalooban at hangarin; malinaw at natural ang parirala sa Filipino.
- source_word: προσμένειν
  choice: na manatiling tapat
  rationale: Ipinahahayag ang patuloy at matatag na pananatiling kaugnay ng Panginoon. Ang “tapat” ay nagbibigay-linaw sa debosyon o matibay na pagkapit na ipinahihiwatig sa konteksto, habang inilalahad sa talababa ang mas pormal na salin.
- source_word: τῷ κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang titulong κύριος sa karaniwang biblikal na anyong Filipino, nang hindi pinapalitan ng paliwanag sa mismong teksto.
theological_decisions:
- issue: Kahulugan ng “biyaya ng Diyos” sa konteksto
  choice: Pinanatili ang pariralang “biyaya ng Diyos,” na maaaring tumukoy sa nakikitang bunga ng mapagbiyayang pagkilos ng Diyos sa mga mananampalataya sa Antioquia.
  alternative: Tahasang isalin bilang “ang ginawa ng Diyos sa pamamagitan ng kanyang biyaya.”
  rationale: Hindi nililimitahan ng salin ang χάρις sa isang tiyak na bunga o kilos, kaya napapanatili ang teolohikal na lawak ng parirala.
- issue: Lakas ng προσμένειν τῷ κυρίῳ
  choice: “manatiling tapat sa Panginoon,” bilang patuloy at matatag na pagkapit sa kanya
  alternative: “manatili sa Panginoon” o “patuloy na manatili sa piling ng Panginoon”
  rationale: Malinaw sa modernong Filipino ang diwa ng nagpapatuloy na kaugnayan at debosyon, ngunit kinikilala sa talababa ang mas literal at mas hindi tiyak na anyo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nagalak,” “hinimok,” at “matatag na pasiya sa puso” upang mapanatili ang dignidad ng salaysay nang hindi nagiging lipas o labis na pormal. Ang mga pananda [a] at [b] ay kapwa nasa pangunahing teksto.
