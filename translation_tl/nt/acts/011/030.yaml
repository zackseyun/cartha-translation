  yaml_path: translation/nt/acts/011/030.yaml
  text: And they did so[a], sending it to the elders by the hand of Barnabas and Saul.
translation:
  language: tl
  text: 'At ginawa nila ito: ipinadala nila ito sa mga matatanda sa pamamagitan nina Bernabe at Saulo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃ καὶ ἐποίησαν
  choice: At iyon nga ang ginawa nila
  rationale: Ang panghalip na ὃ ay tumutukoy sa napagpasiyahang pagtulong sa naunang talata. Likas sa Tagalog ang “iyon ... ang ginawa nila,” at ipinahihiwatig ng “nga” ang pagpapatibay na talagang isinagawa nila iyon.
- source_word: ἀποστείλαντες
  choice: ipinadala nila
  rationale: Ang aorist participle ay nagpapaliwanag kung paano nila isinagawa ang pasiya. Ang ganap na pandiwang Tagalog ay natural sa salaysay at malinaw na nag-uugnay sa ipinadalang tulong.
- source_word: πρὸς τοὺς πρεσβυτέρους
  choice: sa mga matatanda
  rationale: Tumutukoy ang πρεσβύτεροι sa kinikilalang mga pinuno ng pamayanan. Ang “mga matatanda” ay karaniwan, malinaw, at hindi nag-aangkat ng mas teknikal na katawagang pangdenominasyon.
- source_word: διὰ χειρὸς
  choice: sa pamamagitan nina
  rationale: 'Ang literal na idyomang “sa pamamagitan ng kamay nina” ay hindi likas sa modernong Tagalog. Ang “sa pamamagitan nina” ay tumpak na naghahayag ng ahensiya: sina Bernabe at Saulo ang naghatid.'
- source_word: Βαρναβᾶ καὶ Σαύλου
  choice: Bernabe at Saulo
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng mga pangalang biblikal.
- source_word: implicit object from context
  choice: ito
  rationale: Walang tahasang layon sa Griyego, ngunit malinaw mula sa naunang talata na ang tinutukoy ay ang tulong. Ang “ito” ay nagpapanatili sa pagiging matipid at hindi labis na nagtatakda ng anyo ng ipinadala.
