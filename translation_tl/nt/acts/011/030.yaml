  source_fidelity: 'Ang pangkalahatang kahulugan ay tapat sa Griyego: isinagawa nila ang naunang ipinangakong tulong sa pamamagitan nina Bernabe at Saulo, patungo sa mga matatanda. Gayunman, ang “nga” ay maaaring magdagdag ng di-gaanong malinaw na diin na wala namang tahasang hinihingi ng καί o ng buong pangungusap.'
