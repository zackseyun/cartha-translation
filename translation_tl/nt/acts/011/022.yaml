  text: ἠκούσθη δὲ ὁ λόγος εἰς τὰ ὦτα τῆς ἐκκλησίας τῆς ⸀οὔσης ἐν ⸀Ἰερουσαλὴμ περὶ αὐτῶν, καὶ ἐξαπέστειλαν ⸀Βαρναβᾶν ἕως Ἀντιοχείας·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/022.yaml
  text: The report about them reached the ears of the church in Jerusalem[a], and they sent out Barnabas as far as Antioch.
translation:
  language: tl
  text: Nakarating sa pandinig ng iglesya sa Jerusalem ang balita tungkol sa kanila,[a] at isinugo nila si Bernabe hanggang sa Antioquia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Narinig ng iglesya sa Jerusalem ang balita tungkol sa kanila”; literal, “ang balita ay narinig hanggang sa mga tainga ng iglesya sa Jerusalem.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσθη ... εἰς τὰ ὦτα
  choice: Nakarating sa pandinig
  rationale: Likas na salin ito ng idyomang Griyego na literal na tumutukoy sa balitang ‘narinig sa mga tainga’; pinananatili nito ang diwa ng impormasyong nakarating sa kaalaman ng iglesya.
- source_word: ὁ λόγος
  choice: ang balita
  rationale: Sa konteksto, tumutukoy ang λόγος sa ulat o balita tungkol sa mga taong at pangyayaring naunang binanggit, hindi sa isang pormal na talumpati.
- source_word: ἐκκλησίας
  choice: iglesya
  rationale: Karaniwan at nauunawaang katawagan ito sa pamayanang Kristiyano sa makabagong Filipino.
- source_word: τῆς οὔσης ἐν Ἰερουσαλήμ
  choice: sa Jerusalem
  rationale: Natural na pinaikli sa Filipino ang pariralang tumutukoy sa iglesyang naroon sa Jerusalem nang walang nawawalang kahulugan.
- source_word: περὶ αὐτῶν
  choice: tungkol sa kanila
  rationale: Pinananatili ang panghalip at ang posibilidad na saklaw nito ang mga taong naunang tinukoy, sa halip na tahasang palitan ng ‘mga pangyayaring ito.’
- source_word: ἐξαπέστειλαν
  choice: isinugo nila
  rationale: Ang ‘isinugo’ ay natural at may sapat na lakas upang ipahayag ang sinadyang pagpapadala kay Bernabe.
- source_word: Βαρναβᾶν
  choice: Bernabe
  rationale: Ginamit ang nakagawiang anyo ng pangalang ito sa Filipino.
- source_word: ἕως Ἀντιοχείας
  choice: hanggang Antioquia
  rationale: Pinananatili ng ‘hanggang’ ang diwa ng ἕως bilang hangganan o patutunguhan, sa halip na gawing payak lamang na ‘sa Antioquia.’
- source_word: δὲ
  choice: kaya
  rationale: Isinaad ang ugnayang pasalaysay at lohikal ng pagkarinig ng balita at ng sumunod na pagsusugo; hindi ito isinalin bilang temporal na ‘ngayon.’
theological_decisions:
- issue: Tinutukoy ng ‘isinugo nila’
  choice: Ang kolektibong iglesya sa Jerusalem ang naunang tinutukoy ng ‘nila.’
  alternative: Mga apostol, matatanda, o ibang di-tinukoy na mga pinuno sa loob ng iglesya ang nagsugo sa kaniya.
  rationale: Ang pinakamalapit na hayag na pinagmulan ng paksa ay ang iglesya sa Jerusalem. Hindi tinutukoy ng talata ang isang mas makitid na pangkat ng mga pinuno, kaya hindi iyon idinagdag sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang larawang may kaugnayan sa pandinig nang hindi gumagamit ng alanganing literal na ‘sa mga tainga.’ Ang [a] ay nakalagay agad pagkatapos ng sugnay na nililinaw nito.
