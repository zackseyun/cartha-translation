  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸂ἀνεσπάσθη πάλιν⸃ ἅπαντα εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/010.yaml
  text: This happened three times[a], and everything was drawn up again into heaven.
translation:
  language: tl
  text: Nangyari ito nang tatlong beses, at ang lahat ay muling hinila paitaas sa langit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang lahat ay muling iniakyat sa langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ito
  rationale: Tumutukoy sa pangyayaring pangitain na kababanggit lamang, nang hindi idinaragdag ang salitang “pangitain,” na hindi tahasang nasa Griyego.
- source_word: ἐγένετο
  choice: Nangyari
  rationale: Likas at malinaw na katumbas para sa pagganap o pag-iral ng isang pangyayari sa salaysay.
- source_word: ἐπὶ τρίς
  choice: nang tatlong ulit
  rationale: Ipinahahayag ang pag-uulit sa tatlong pagkakataon sa natural na modernong Tagalog.
- source_word: ἀνεσπάσθη
  choice: hinila paitaas
  rationale: Pinananatili ang balintiyak na diwa at ang larawan ng paghatak pataas, nang hindi tinutukoy kung sino ang kumilos.
- source_word: πάλιν
  choice: muling
  rationale: Malinaw na ipinahahayag ang pag-uulit o pagbabalik.
- source_word: ἅπαντα
  choice: ang lahat
  rationale: Malawak at hindi tiyak ang saklaw ng neuter plural; hindi nito nililimitahan ang tinutukoy sa mga hayop o sa telang nakita.
- source_word: εἰς τὸν οὐρανόν
  choice: sa langit
  rationale: Sa konteksto ng pangitain, ang οὐρανός ay higit na tumutukoy sa langit kaysa sa kalangitan lamang; ang paitaas na galaw ay naipahahayag na ng pandiwa.
theological_decisions:
- issue: Ang tinutukoy ng ἅπαντα sa ulat ni Pedro tungkol sa pangitain
  choice: ang lahat
  alternative: ang buong bagay / lahat ng iyon / lahat ng mga hayop
  rationale: Pinananatili ang malawak na pagtukoy ng Griyego at iniiwasang tukuyin nang mas makitid kaysa sa mismong talata.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “tatlong ulit” para sa likas na daloy at “hinila paitaas” upang mapanatili ang kongkretong larawan at balintiyak na tinig ng Griyego.
