  text: εἶπον δέ· Μηδαμῶς, κύριε, ⸀ὅτι κοινὸν ἢ ἀκάθαρτον οὐδέποτε εἰσῆλθεν εἰς τὸ στόμα μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/008.yaml
  text: But I said, ‘By no means, Lord, because nothing common or unclean has ever entered my mouth.’
translation:
  language: tl
  text: Ngunit sinabi ko, ‘Hinding-hindi, Panginoon, sapagkat walang anumang karaniwan[a] o marumi ang kailanman pumasok sa aking bibig.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang «karaniwan» ay tumutukoy rito sa isang bagay na itinuturing na karaniwan o di-banal sa ritwal na kahulugan, at naiiba sa «marumi.»
    reason: Nililinaw ang natatanging ritwal na gamit ng κοινόν at ang pagkakaiba nito sa ἀκάθαρτον, nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
lexical_decisions:
- source_word: Μηδαμῶς
  choice: Hinding-hindi
  rationale: Natural at mariing pagtanggi sa modernong Tagalog, na nagpapanatili sa lakas ng Griyegong ekspresyon.
- source_word: κύριε
  choice: Panginoon
  rationale: Karaniwang salin ng direktang pagtawag na κύριε at angkop sa konteksto ng pangitain.
- source_word: κοινὸν
  choice: itinuturing na karaniwan
  rationale: Sa kontekstong ritwal, ang κοινός ay hindi simpleng ‘ordinaryo’ kundi itinuturing na hindi banal o hindi nararapat kainin; pinananatili ng parirala ang pagkakaiba nito sa ἀκάθαρτον.
- source_word: ἀκάθαρτον
  choice: marumi
  rationale: Tuwirang salin na sa konteksto ay tumutukoy sa ritwal na karumihan, nang hindi nagdaragdag ng interpretasyong denominasyonal.
- source_word: εἰσῆλθεν εἰς τὸ στόμα μου
  choice: pumasok sa aking bibig
  rationale: Pinananatili ang kongkretong idyoma ng pinagmulang teksto sa natural na Tagalog.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinahahayag ang dahilan ng pagtanggi ni Pedro, kaayon ng sintaktikong gamit dito.
theological_decisions:
- issue: Pagkakaiba ng κοινόν at ἀκάθαρτον
  choice: ‘itinuturing na karaniwan o marumi’
  alternative: ‘di-banal o marumi’
  rationale: Pinananatiling magkahiwalay ang dalawang kategorya nang hindi ipinapantay o tahasang nilulutas ang eksaktong ritwal na saklaw ng κοινόν.
- issue: Pagkakakilanlan ng tinatawag na κύριε
  choice: ‘Panginoon’ nang walang dagdag na paliwanag
  alternative: ‘Ginoo’ o tahasang pagtukoy kay Jesus
  rationale: Pinananatili ang anyo at posibleng teolohikal na bigat ng direktang tawag, ngunit hindi nagdaragdag ng pagkakakilanlang hindi tahasang nakasaad sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at malinaw na pasalitang daloy. Ginamit ang ‘Hinding-hindi’ para sa mariing pagtanggi at ‘sapagkat’ para sa malinaw na ugnayang sanhi. Walang footnote dahil sapat na naipahahayag sa teksto ang pangunahing leksikal na pagkakaiba.
