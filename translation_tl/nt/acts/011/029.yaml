  text: τῶν δὲ μαθητῶν καθὼς εὐπορεῖτό τις ὥρισαν ἕκαστος αὐτῶν εἰς διακονίαν πέμψαι τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/029.yaml
  text: So the disciples determined[a], each according to his ability[b], to send relief to the brothers living in Judea.
translation:
  language: tl
  text: Kaya nagpasiya ang mga alagad na ang bawat isa, ayon sa kanyang kakayahan[a], ay magpadala ng tulong sa mga kapatid[b] na naninirahan sa Judea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa kanyang makakaya” o “ayon sa lawak ng kanyang kabuhayan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kapatid” ay malamang na tumutukoy sa mga kapwa mananampalataya sa Judea, kabilang ang buong pamayanang Kristiyano.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητῶν
  choice: mga alagad
  rationale: Karaniwang katawagan sa Mga Gawa para sa mga tagasunod ni Jesus at natural na terminong biblikal sa modernong Tagalog.
- source_word: ὥρισαν
  choice: nagpasiya
  rationale: Ipinapahayag ang sinadya at sama-samang pagpapasyang tinutukoy ng ὁρίζω nang hindi labis na pormal.
- source_word: καθὼς εὐπορεῖτό τις ... ἕκαστος αὐτῶν
  choice: ang bawat isa, ayon sa kanyang kakayahan
  rationale: 'Pinananatili ang distributibong diwa: ang ambag ng bawat isa ay ayon sa kanyang taglay na kakayahan o kaparaanan.'
- source_word: εἰς διακονίαν πέμψαι
  choice: magpadala ng tulong
  rationale: Sa konteksto ng nalalapit na taggutom, ang διακονία ay praktikal na paglilingkod o ayuda; ang pariralang ito ay likas sa Tagalog at hindi nagtatakda ng eksaktong anyo ng ipinadala.
- source_word: τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ
  choice: na naninirahan sa Judea
  rationale: Tuwirang salin ng participial phrase sa natural at kasalukuyang Tagalog.
- source_word: ἀδελφοῖς
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay nagpapanatili sa pampamilyang katawagan ng Griyego at karaniwang tumutukoy sa mga kapwa mananampalataya.
theological_decisions:
- issue: Saklaw ng ἀδελφοῖς sa pamayanang Cristiano sa Judea
  choice: mga kapatid
  alternative: mga kapwa mananampalataya / mga kapatid na lalaki at babae
  rationale: Pinananatili ng pangunahing teksto ang pampamilyang tayutay ng Griyego. Ipinapaliwanag sa talababa na sa kontekstong Cristiano maaari itong tumukoy sa buong pamayanan, hindi lamang sa mga lalaki.
- issue: Kalikasan ng διακονία
  choice: tulong
  alternative: paglilingkod / ministeryo
  rationale: Ang konteksto ng paghahanda para sa taggutom ay tumutukoy sa praktikal na ayuda. Hindi nililimitahan ng “tulong” kung salapi, pagkain, o ibang anyo ng suporta ang ipinadala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nagpasiya” at “magpadala ng tulong” para sa natural na daloy, habang pinanatili ang distributibong “bawat isa” at ang pampamilyang katawagang “mga kapatid.”
