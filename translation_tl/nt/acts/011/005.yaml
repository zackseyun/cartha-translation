- from: '“Nasa lungsod ako ng Joppa at nananalangin. Habang nasa kalagayang tila wala sa sarili, nakakita ako ng isang pangitain: may isang bagay[a] na parang malaking kumot na bumababa, na ibinababa mula sa langit sa apat na sulok nito,[b] at umabot iyon sa akin.”'
  to: '“Nasa lungsod ako ng Joppa at nananalangin. Habang nasa isang kalagayang tila wala sa sarili, nakakita ako ng isang pangitain: may isang bagay[a] na parang malaking tela na bumababa, na ibinababa mula sa langit sa pamamagitan ng apat na sulok nito,[b] at umabot iyon sa akin.”'
  rationale: Pinalitan ang “malaking kumot” ng “malaking tela” upang hindi magdagdag ng gamit o uri ng tela na hindi tahasang tinutukoy ng Griyego. Nilinaw rin ang ugnayan ng pagbaba at ng apat na sulok. Walang binagong kahulugan hinggil sa pangitain o sa kalagayan ni Pedro.
