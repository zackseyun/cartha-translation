id: ACT.11.5
reference: Acts 11:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος καὶ εἶδον ἐν ἐκστάσει ὅραμα, καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ, καὶ ἦλθεν ἄχρι ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/005.yaml
  text: 'I was in the city of Joppa praying[a], and in a trance I saw a vision: something like a large sheet was coming down, being lowered from heaven by four corners[b], and it came to me.'
translation:
  language: tl
  text: '“Nasa lungsod ako ng Joppa at nananalangin. Habang nasa isang kalagayang tila wala sa sarili, nakakita ako ng isang pangitain: may isang bagay[a] na parang malaking tela na bumababa, na ibinababa mula sa langit sa pamamagitan ng apat na sulok nito,[b] at umabot iyon sa akin.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang uri ng sisidlan.” Malawak ang kahulugan ng salitang Griyego para sa bagay, kagamitan, o sisidlan bago ito ihambing sa isang malaking tela.
    reason: lexical_alternative
  - marker: b
    text: O “ibinaba mula sa langit sa apat na dulo nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος
  choice: Nasa lungsod ako ng Joppa at nananalangin
  rationale: Pinananatili ang tahasang pagbanggit sa lungsod at ang nagpapatuloy na pananalangin, ngunit gumagamit ng likas na ayos ng pangungusap sa modernong Tagalog.
- source_word: ἐν ἐκστάσει
  choice: Habang nasa kalagayang tila wala sa sarili
  rationale: Ipinahihiwatig ang di-pangkaraniwang kalagayan ng kamalayan sa pangitain nang hindi gumagamit ng “kawalan ng malay,” na maaaring magpahiwatig ng ganap na pagkawala ng ulirat, o ng “ekstasi,” na maaaring magpahiwatig lamang ng matinding emosyon.
- source_word: ὅραμα
  choice: isang pangitain
  rationale: Karaniwan at malinaw na salin para sa isang biswal na kapahayagan.
- source_word: σκεῦός τι
  choice: may isang bagay
  rationale: Malawak ang saklaw ng σκεῦος—bagay, sisidlan, o kagamitan—kaya hindi ito ginagawang mas tiyak bago ilarawan na parang malaking kumot.
- source_word: ὡς ὀθόνην μεγάλην
  choice: na parang malaking kumot
  rationale: Ang “malaking kumot” ay madaling mailarawan ng karaniwang mambabasa at hindi nagdaragdag ng espesipikong materyal gaya ng lino.
- source_word: καταβαῖνον ... καθιεμένην ἐκ τοῦ οὐρανοῦ
  choice: na bumababa, na ibinababa mula sa langit
  rationale: Pinananatili ang parehong ideya ng pababang kilos at ng pasibong pagpapababa sa bagay.
- source_word: τέσσαρσιν ἀρχαῖς
  choice: sa apat na sulok nito
  rationale: Sa konteksto ng malaking telang inilalarawan, ang “apat na sulok” ang pinakanatural na katumbas ng apat na dulo o extremidad.
- source_word: ἦλθεν ἄχρι ἐμοῦ
  choice: umabot iyon sa akin
  rationale: Malinaw na ipinapahayag na ang bagay ay dumating hanggang sa kinaroroonan ni Pedro.
theological_decisions:
- issue: Paglalarawan sa kalagayan ni Pedro nang tumanggap siya ng pangitain
  choice: Habang nasa kalagayang tila wala sa sarili, nakakita ako ng isang pangitain
  alternative: Habang nasa trans, nakakita ako ng isang pangitain
  rationale: 'Pinananatiling magkahiwalay ang ἐκστάσει at ὅραμα: inilalarawan ng una ang kalagayan ni Pedro at ng ikalawa ang kaniyang nakita. Iniiwasan din ang mga konotasyon ng hipnosis o ng lubos na pagkawala ng malay.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Iniwasan ang labis na tradisyonal na “pagkawili” at ang posibleng nakalilitong “kawalan ng ulirat.” Ang “tila” ay tumutulong na ilarawan ang visionary state nang hindi sabihing ganap na nawalan ng malay si Pedro.
