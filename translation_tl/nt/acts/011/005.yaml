    rationale: Ang ὀθόνη ay isang malapad na tela o sapin; hindi hinihingi ng Griyego ang gamit nitong pantakip bilang kumot. Ang “malaking tela” ay nag-iingat ng mas angkop na saklaw.
  - severity: low
    issue: Medyo malabo ang “ibinababa mula sa langit sa apat na sulok nito.”
    rationale: Maaaring mabasa ang parirala bilang lokasyon sa halip na paraan ng pagbaba. Ang “sa pamamagitan ng apat na sulok nito” ay mas malinaw na tumutugma sa τέσσαρσιν ἀρχαῖς.
