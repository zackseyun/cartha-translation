  text: καὶ ἦν χεὶρ κυρίου μετ’ αὐτῶν, πολύς τε ἀριθμὸς ⸀ὁ πιστεύσας ἐπέστρεψεν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/021.yaml
  text: And the hand of the Lord was with them[b][a], and a great number who believed turned to the Lord.
translation:
  language: tl
  text: At kasama nila ang kamay ng Panginoon[a], at napakaraming sumampalataya[b] ang bumaling sa Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang kamay ng Panginoon ay sumakanila.” Ang parirala ay isang biblikal na tayutay para sa aktibong kapangyarihan o pagsang-ayon ng Panginoon.
    reason: lexical_alternative
  - marker: b
    text: O “na sumampalataya” o “pagkasampalataya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χεὶρ κυρίου
  choice: kamay ng Panginoon
  rationale: Pinananatili ang biblikal na talinghaga para sa aktibong kapangyarihan o pagsang-ayon ng Panginoon, sa halip na palitan ito ng tahasang interpretasyong “kapangyarihan.”
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang salin ng κύριος bilang titulo; hindi tinutukoy nang higit sa sinasabi ng Griyego kung si Jesus o ang Diyos ang tuwirang tinutukoy.
- source_word: μετ’ αὐτῶν
  choice: sumakanila
  rationale: Likas at marangal na paraang Tagalog upang ipahayag na ang presensiya at pagtulong ng Panginoon ay kasama nila.
- source_word: πολύς τε ἀριθμός
  choice: napakarami
  rationale: Natural na modernong Tagalog para sa malaking bilang ng mga tao, nang hindi kailangang panatilihin ang mas mabigat na nominal na pariralang “isang malaking bilang.”
- source_word: ὁ πιστεύσας
  choice: sumampalataya
  rationale: Ang aorist participle ay tumutukoy nang pangkatan sa mga naniwala; ang anyong pandiwa ay malinaw at natural sa Tagalog.
- source_word: ἐπέστρεψεν ἐπὶ τὸν κύριον
  choice: nagbalik-loob sa Panginoon
  rationale: Ipinapahayag nito ang pagbaling o conversion tungo sa Panginoon. Sa kasalukuyang Tagalog, ang “nagbalik-loob” ay hindi kinakailangang mangahulugang dati na silang kabilang, bagaman ang literal na “bumaling” ay posible rin.
theological_decisions:
- issue: Tinutukoy ng “Panginoon” sa konteksto
  choice: Panatilihin lamang ang “Panginoon” sa dalawang paglitaw.
  alternative: Tahasang tukuyin bilang “Panginoong Jesus” o bilang “Diyos.”
  rationale: Bagaman maaaring tumukoy kay Jesus ang κύριος sa konteksto ng Mga Gawa at pagbabalik-loob, “Panginoon” lamang ang nasa Griyego; pinananatili nito ang pagiging bukas ng reperensiya.
- issue: Ugnayan ng “sumampalataya” at “nagbalik-loob”
  choice: Isalin bilang magkakaugnay na kilos nang hindi tahasang itinatakda ang eksaktong temporal na pagkakasunod.
  alternative: “Pagkatapos sumampalataya” o “dahil sumampalataya.”
  rationale: Maaaring maunawaan ang aorist participle bilang nauna o kasabay sa pangunahing pandiwa. Hindi idinaragdag ng salin ang “pagkatapos” o “dahil,” kaya hindi nito nilulutas ang tunay na sintaktikong puwang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang biblikal na larawang “kamay ng Panginoon.” Ginamit ang “sumakanila” bilang maikli at likas na pahayag ng presensiya at pagtulong, at ang “nagbalik-loob” bilang karaniwang pananalita para sa pagbaling sa Panginoon.
