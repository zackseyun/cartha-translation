base_translation:
  language: en
  yaml_path: translation/nt/acts/011/014.yaml
  text: He will speak words to you by which you and all your household will be saved[a].
translation:
  language: tl
  text: Magsasalita siya sa iyo ng mga salita, at sa pamamagitan ng mga salitang iyon[a] ay maliligtas ka at ang buong sambahayan mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga salitang iyon” o “sa loob ng mga salitang iyon”; ipinahihiwatig ng pananalitang Griyego na ang mga salita ang paraan kung saan dumarating ang kaligtasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: siya
  rationale: Ang panghalip na pamanggit ay tumutukoy sa lalaking binanggit bago nito; sa natural na Filipino, malinaw itong ipinahahayag bilang “siya.”
- source_word: λαλήσει
  choice: magsasalita
  rationale: Pinananatili ang panghinaharap at ang karaniwang diwa ng λαλέω na pagsasalita o paghahayag ng mensahe.
- source_word: ῥήματα
  choice: mga salita
  rationale: Tuwirang pinananatili ang maramihang konkretong pangngalan, sa halip na pakinisin bilang “mensahe.”
- source_word: πρὸς σὲ
  choice: sa iyo
  rationale: Sa pandiwa ng pagsasalita, ipinakikita ng πρός at accusative ang taong pinatutungkulan.
- source_word: ἐν οἷς
  choice: sa pamamagitan ng mga iyon
  rationale: 'Ipinahahayag nito ang malamang na instrumental na gamit ng ἐν: ang mga salitang sasabihin ang paraang ginagamit upang dumating ang kaligtasan; inilalagay sa talababa ang mas literal na posibleng anyo.'
- source_word: σωθήσῃ
  choice: maliligtas
  rationale: Ang future passive ng σῴζω ay likas at teolohikal na angkop na isalin bilang “maliligtas” sa konteksto ng pagpapahayag ng ebanghelyo sa Mga Gawa.
- source_word: σὺ
  choice: ka
  rationale: Ang tahasang panghalip sa Griyego ay naipakikita sa “ka,” na siyang unang kasapi ng pinagtambal na saklaw.
- source_word: πᾶς ὁ οἶκός σου
  choice: ang buong sambahayan mo
  rationale: Ang οἶκος ay tumutukoy sa yunit ng sambahayan, hindi lamang sa gusali; ang “buong sambahayan” ay natural at nagpapanatili sa kolektibong saklaw.
theological_decisions:
- issue: Kahulugan ng kaligtasan sa konteksto ng sambahayan ni Cornelio
  choice: “maliligtas,” nang hindi dinaragdagan ang talata ng paliwanag tungkol sa eksaktong mekanismo ng kaligtasan
  alternative: “maililigtas” o “maliligtas mula sa kapahamakan”
  rationale: Ang konteksto ay tungkol sa pakikinig sa ipinahayag na mabuting balita at pagtanggap ng kaligtasan. Pinananatili ng salin ang soteriolohikal na bigat ng σῴζω nang hindi nag-aangkat ng isang partikular na sistematikong paliwanag.
- issue: Saklaw ng “buong sambahayan mo”
  choice: Pinananatili ang kolektibong saklaw ng pangako nang hindi ipinahihiwatig na awtomatiko ang kaligtasan ng bawat isa hiwalay sa kanilang tugon
  alternative: Isalin o ipaliwanag ito bilang awtomatikong kaligtasan ng sambahayan
  rationale: Binabanggit ng Griyego ang buong sambahayan, ngunit hindi tinatalakay sa talatang ito ang lahat ng kondisyon o paraan ng pakikibahagi ng bawat miyembro. Dapat manatili ang teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “sambahayan” upang tukuyin ang lahat ng kabilang sa bahay at hindi ang gusali lamang. Ang ayos na “sa pamamagitan ng mga iyon” ay bahagyang pormal ngunit malinaw na nag-uugnay sa kaligtasan sa mga salitang ipahahayag.
