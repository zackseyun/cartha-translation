id: ACT.11.12
reference: Acts 11:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂τὸ πνεῦμά μοι⸃ συνελθεῖν αὐτοῖς μηδὲν ⸀διακρίναντα. ἦλθον δὲ σὺν ἐμοὶ καὶ οἱ ἓξ ἀδελφοὶ οὗτοι, καὶ εἰσήλθομεν εἰς τὸν οἶκον τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/012.yaml
  text: And the Spirit told me to go with them[a], making no distinction. These six brothers also came with me, and we entered the man's house.
translation:
  language: tl
  text: Sinabi sa akin ng Espiritu na sumama ako sa kanila nang hindi nagtatangi.[a] Sumama rin sa akin ang anim na kapatid na ito, at pumasok kami sa bahay ng lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang hindi nag-aatubili” o “nang hindi nag-aalinlangan.” Ang anyong Griyego ay maaaring mangahulugang hindi nagtatangi o hindi nag-uurong-sulong.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμά
  choice: ang Espiritu
  rationale: Sa konteksto ng paghahayag at paggabay sa Mga Gawa, tumutukoy ito sa Banal na Espiritu. Pinananatili ng “ang Espiritu” ang mismong anyo ng Griyego nang hindi idinaragdag ang “Banal,” na hindi hayag sa talata.
- source_word: εἶπεν ... μοι
  choice: Sinabi sa akin
  rationale: Tuwirang katumbas ito na natural sa Filipino at malinaw na nagpapakilala sa tagubilin ng Espiritu.
- source_word: συνελθεῖν αὐτοῖς
  choice: na sumama ako sa kanila
  rationale: Sa konteksto, ang infinitive ay tumutukoy sa pagsama o paglakad kasama ng mga lalaking dumating upang sunduin si Pedro.
- source_word: μηδὲν διακρίναντα
  choice: nang hindi nagtatangi
  rationale: Maaaring tumukoy ang διακρίνω sa pagtatangi, pag-aalinlangan, o pag-aatubili. Ang “hindi nagtatangi” ay angkop sa agarang konteksto ng pagtawid ni Pedro sa hangganan sa pagitan ng Judio at Hentil, habang inilalahad sa talababa ang ibang tunay na posibilidad.
- source_word: οἱ ἓξ ἀδελφοὶ οὗτοι
  choice: ang anim na kapatid na ito
  rationale: Ang “kapatid” ay likas na katawagan sa kapwa mananampalataya sa Filipino; ang bilang at pantukoy na “ito” ay nagpapanatili sa detalye ng Griyego.
- source_word: εἰσήλθομεν
  choice: pumasok kami
  rationale: Natural at tuwirang salaysay ito ng kilos sa modernong Filipino.
- source_word: τὸν οἶκον τοῦ ἀνδρός
  choice: sa bahay ng lalaki
  rationale: Pinananatili nito ang tahasang pagbanggit sa ἀνήρ sa halip na palitan ng panghalip, at natural pa rin sa Filipino.
theological_decisions:
- issue: Kahulugan ng μηδὲν διακρίναντα sa salaysay ni Pedro
  choice: nang hindi nagtatangi
  alternative: nang hindi nag-aatubili / nang hindi nag-aalinlangan
  rationale: Malakas na sinusuportahan ng konteksto ng pagpasok sa tahanan ng isang Hentil ang diwa ng hindi pagtatangi. Gayunman, maaari ring ilarawan ng anyong Griyego ang hindi pag-aatubili o hindi pag-aalinlangan, kaya pinananatili ang mga iyon sa talababa upang hindi alisin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal, na may likas na ayos ng pangungusap. Ginamit ang “kapatid” bilang katawagan sa anim na lalaking kapwa mananampalataya. Inilagay ang pananda ng talababa kaagad pagkatapos ng pariralang may leksikal na kalabuan.
