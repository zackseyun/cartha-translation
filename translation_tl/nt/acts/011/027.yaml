  text: Ἐν ταύταις δὲ ταῖς ἡμέραις κατῆλθον ἀπὸ Ἱεροσολύμων προφῆται εἰς Ἀντιόχειαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/027.yaml
  text: In those days prophets came down from Jerusalem to Antioch[a].
translation:
  language: tl
  text: Sa mga araw na iyon, bumaba mula sa Jerusalem patungong Antioquia ang mga propeta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ταύταις δὲ ταῖς ἡμέραις
  choice: Nang mga araw na iyon
  rationale: Likas na panandang temporal sa Tagalog na pinananatili ang diwa ng ‘sa mga araw na iyon.’ Banayad lamang ang pang-ugnay na δέ at hindi kailangang tumbasan ng hiwalay na salita.
- source_word: κατῆλθον
  choice: bumaba
  rationale: Pinananatili ang heograpiko at patayong diwa ng κατέρχομαι. Hindi kailangang ipilit sa pandiwang Tagalog ang pagkakaibang ‘came/went,’ na karaniwang ipinahihiwatig na ng pinagmulan at patutunguhan.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: mula sa Jerusalem
  rationale: Tuwirang tinutumbasan ng ‘mula sa’ ang ἀπό; ginagamit ang karaniwang anyong Filipino ng pangalan ng lungsod.
- source_word: προφῆται
  choice: mga propeta
  rationale: Ang karaniwan at malawak na katawagan ang pinanatili, nang hindi nililimitahan ang kanilang tungkulin sa isang partikular na pagpapakahulugan.
- source_word: εἰς Ἀντιόχειαν
  choice: patungong Antioquia
  rationale: Malinaw na ipinahahayag ang paggalaw tungo sa lungsod; ‘Antioquia’ ang nakaugaliang anyong Filipino ng pangalan.
theological_decisions:
- issue: Saklaw ng katawagang προφῆται sa konteksto ng mga iglesya sa Jerusalem at Antioquia
  choice: mga propeta
  alternative: mga gurong propetiko; mga mensaherong kinasihan
  rationale: Hindi tiyak na nililinaw ng Griyego rito ang eksaktong saklaw ng kanilang ministeryo. Pinananatili ng ‘mga propeta’ ang lawak at teolohikal na tensiyon ng orihinal nang hindi nag-aangkat ng pananaw ng isang denominasyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Inuna ang temporal na parirala at inilagay sa hulihan ang simuno upang maging maayos ang daloy ng pangungusap.
