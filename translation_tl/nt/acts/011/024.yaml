id: ACT.11.24
reference: Acts 11:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι ἦν ἀνὴρ ἀγαθὸς καὶ πλήρης πνεύματος ἁγίου καὶ πίστεως. καὶ προσετέθη ὄχλος ἱκανὸς τῷ κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/024.yaml
  text: For he was a good man[a], full of the Holy Spirit and of faith. And a considerable crowd was added to the Lord.
translation:
  language: tl
  text: Sapagkat isa siyang mabuting tao, puspos ng Banal na Espiritu at ng pananampalataya.[a] At isang malaking pulutong ang nadagdag sa Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katapatan.” Ang salitang Griyego na pistis ay maaaring mangahulugang “pananampalataya,” “pagtitiwala,” o “katapatan”; dito ay ginamit sa pangunahing teksto ang karaniwang saling “pananampalataya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag na kaugnay ng naunang papuri kay Bernabe.
- source_word: ἀνὴρ ἀγαθὸς
  choice: isa siyang mabuting tao
  rationale: Tumutukoy ito kay Bernabe at tuwirang ipinahahayag ang kaniyang mabuting katangian; natural sa modernong Tagalog ang 'tao' sa ganitong panaguri.
- source_word: πλήρης
  choice: puspos
  rationale: Dignified at karaniwang salin sa kontekstong espirituwal, at pinananatili ang diwa ng pagiging ganap na taglay o pinaghaharian.
- source_word: πνεύματος ἁγίου
  choice: ng Banal na Espiritu
  rationale: Sa Lucas–Mga Gawa, karaniwan itong tumutukoy sa banal na persona ng Espiritu, hindi lamang sa banal na disposisyon.
- source_word: πίστεως
  choice: ng pananampalataya
  rationale: Ito ang pangunahing katumbas ng πίστις; nananatiling posible sa konteksto ang 'katapatan,' kaya inilagay iyon sa talababa.
- source_word: προσετέθη
  choice: nadagdag
  rationale: Pinananatili ang pasibong diwa ng pandiwa nang hindi tahasang nagdaragdag ng hindi binanggit na tagaganap.
- source_word: ὄχλος ἱκανὸς
  choice: isang malaking pulutong
  rationale: Likas at malinaw na Filipino para sa isang karamihang may kapansin-pansing laki.
- source_word: τῷ κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang tahasang layon ng Griyego sa halip na palitan ito ng 'sa iglesya' o 'sa kapulungan.'
theological_decisions:
- issue: Kahulugan ng πνεύματος ἁγίου
  choice: Banal na Espiritu bilang banal na persona
  alternative: isang banal na espiritu o disposisyon
  rationale: Ang gamit sa Lucas–Mga Gawa at ang paglalarawan kay Bernabe ay pumapabor sa pagtukoy sa Banal na Espiritu.
- issue: Diwa ng πίστεως sa paglalarawan kay Bernabe
  choice: pananampalataya
  alternative: katapatan
  rationale: Kapuwa posible ang tiwala/pananampalataya at tapat na katangian, ngunit 'pananampalataya' ang karaniwang salin; pinanatili sa talababa ang tunay na leksikal na posibilidad.
- issue: Pinagdaragdagan sa προσετέθη ... τῷ κυρίῳ
  choice: ang mga tao ay nadagdag sa Panginoon
  alternative: ang mga tao ay nadagdag sa iglesya o kapulungan
  rationale: Tahasang sinasabi ng Griyego na 'sa Panginoon'; hindi ito pinalitan ng ipinahihiwatig na pagsapi sa pamayanan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang 'puspos' upang mapanatili ang biblikal na dignidad nang hindi nagiging lipas, at 'malaking pulutong' bilang natural na paglalarawan sa ὄχλος ἱκανός.
