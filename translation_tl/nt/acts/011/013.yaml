  yaml_path: translation/nt/acts/011/013.yaml
  text: And he reported to us how he had seen the angel standing in his house and saying[a], ‘Send to Joppa and summon Simon, who is called Peter.’
translation:
  language: tl
  text: At ikinuwento niya sa amin kung paano niya nakita ang anghel na nakatayo sa kanyang bahay at sinabi, “Magsugo ka sa Jope at ipasundo si Simon na tinatawag na Pedro.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: ikinuwento
  rationale: Ipinahihiwatig ng pandiwa ang pagbibigay o paghahatid ng salaysay; natural sa makabagong Filipino ang “ikinuwento” sa kontekstong ito.
- source_word: δὲ
  choice: At
  rationale: Banayad na pang-ugnay ito na nagpapatuloy sa salaysay, hindi nagpapakita ng matinding pagsalungat.
- source_word: πῶς
  choice: kung paano
  rationale: Pinananatili nito ang paraan o nilalaman ng iniulat sa halip na gawing simpleng “na.”
- source_word: εἶδεν
  choice: nakita
  rationale: Ang naganap na pagkakita ay nauna sa pagkukuwento; malinaw na ito sa Filipino kahit walang hiwalay na anyong past perfect.
- source_word: τὸν ἄγγελον
  choice: ang anghel
  rationale: May tiyak na artikulo ang Griyego at tumutukoy sa partikular na anghel sa pangitain ni Cornelio.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: sa loob ng kanyang bahay
  rationale: Tahasang inilalarawan ang pisikal na lokasyon sa tahanan; nililinaw ng “sa loob” ang locative na diwa.
- source_word: σταθέντα
  choice: nakatayo
  rationale: Natural na inilalarawan sa Filipino ang tindig o presensiya ng anghel nang hindi gumagamit ng alanganing literal na anyo.
- source_word: εἰπόντα
  choice: nagsasabi
  rationale: Pinananatili ang participial na daloy na kaugnay ng “nakatayo,” gaya ng nasa Griyego.
- source_word: Ἀπόστειλον
  choice: Magsugo ka
  rationale: Isahan at pautos ang pandiwa; hindi dinaragdagan ng tahasang layon gaya ng “mga tao,” na wala sa talata.
- source_word: εἰς Ἰόππην
  choice: sa Jope
  rationale: Ang pang-ukol ay nagsasaad ng patutunguhan; “Jope” ang nakaugaliang anyong Filipino ng pangalan ng lungsod.
- source_word: μετάπεμψαι
  choice: ipasundo
  rationale: Ipinahihiwatig ng gitnang pandiwa ang pagpapadala ng isang tao upang sunduin at papuntahin ang tinutukoy; natural at eksakto ang “ipasundo” sa Filipino.
- source_word: τὸν ἐπικαλούμενον Πέτρον
  choice: si Simon na tinatawag na Pedro
  rationale: Malinaw nitong kinikilala si Simon sa pangalang karaniwang itinatawag sa kanya at pinananatili ang attributive na diwa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “kung paano” at ang magkaugnay na paglalarawang “nakatayo… at nagsasabi” upang masundan ang estruktura at nuance ng Griyego nang hindi nagiging mekanikal.
