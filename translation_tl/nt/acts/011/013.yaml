revisions:
- from: At ikinuwento niya sa amin kung paano niya nakita ang anghel na nakatayo sa loob ng kanyang bahay at nagsasabi, “Magsugo ka sa Jope at ipasundo si Simon na tinatawag na Pedro.”
  to: At ikinuwento niya sa amin kung paano niya nakita ang anghel na nakatayo sa kanyang bahay at sinabi, “Magsugo ka sa Jope at ipasundo si Simon na tinatawag na Pedro.”
  rationale: Pinalitan lamang ang 'nagsasabi' ng 'sinabi' upang maging natural ang naratibong aspekto sa Filipino at maipahayag nang wasto ang aorist participle na εἰπόντα. Ang 'sa kanyang bahay' ay sapat para sa ἐν τῷ οἴκῳ αὐτοῦ; inalis ang 'loob' dahil hindi ito kinakailangan upang ipahayag ang simpleng lokasyon.
