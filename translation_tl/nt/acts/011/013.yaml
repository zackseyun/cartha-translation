review_pass:
  verdict: revise
  source_fidelity: 'Tumpak sa kabuuan ang pagsasalin ng mga pangunahing elemento: ang pag-uulat, ang ''kung paano,'' ang anghel sa bahay, ang utos na magsugo sa Jope, at ang pagkakakilanlan kay Simon Pedro. Gayunman, ang ''nagsasabi'' ay aspektuwal na parang nagpapatuloy ang pagsasalita at hindi pinakanatural na pagpapakilala ng tuwirang sipi. Ang aorist participle na εἰπόντα, na kaugnay ng nakaraang pangitain, ay mas mahusay na maipapahayag bilang ''at sinabi.'''
  naturalness: Natural ang karamihan ng pangungusap sa makabagong Filipino. Mas maayos at mas idiomatiko ang magkasunod na paglalarawan bilang 'nakatayo ... at sinabi' kaysa 'nakatayo ... at nagsasabi,' lalo na bago ang tuwirang pananalita.
  terminology: Ang 'anghel,' 'Jope,' 'Simon,' at 'Pedro' ay angkop at magkakatugma sa karaniwang terminolohiyang Filipino sa Biblia. Ang 'ipasundo' ay isang wastong, natural na paraan upang ihayag ang μετάπεμψαι ('magpasundo' o 'magpadala para tawagin').
  issues:
  - severity: low
    issue: Ang 'nagsasabi' ay hindi angkop na aspektong pangnaratibo bago ang tuwirang sipi.
    rationale: Ang εἰπόντα ay aorist participle at tumutukoy sa sinabi ng anghel sa pangitain. Sa Filipino, ang 'at sinabi' ay mas natural at mas malinaw na nagmamarka ng nakaraang pagsasalita nang hindi nagpapahiwatig na nagpapatuloy pa ito.
  revised_text: At ikinuwento niya sa amin kung paano niya nakita ang anghel na nakatayo sa kanyang bahay at sinabi, “Magsugo ka sa Jope at ipasundo si Simon na tinatawag na Pedro.”
