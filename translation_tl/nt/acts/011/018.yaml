id: ACT.11.18
reference: Acts 11:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ ταῦτα ἡσύχασαν καὶ ⸀ἐδόξασαν τὸν θεὸν λέγοντες· ⸀Ἄρα καὶ τοῖς ἔθνεσιν ὁ θεὸς τὴν μετάνοιαν ⸂εἰς ζωὴν ἔδωκεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/018.yaml
  text: When they heard these things[a], they became quiet and glorified God, saying[b], “Then God has also granted to the Gentiles the change of mind that leads to life.”
translation:
  language: tl
  text: Nang marinig nila ang mga bagay na ito, tumahimik sila at niluwalhati ang Diyos. Sinabi nila, “Kung gayon, ipinagkaloob din ng Diyos sa mga Hentil[a] ang pagsisising humahantong sa buhay.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bansa.” Dito, ang “mga Hentil” ay tumutukoy sa mga hindi Judio.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “pagsisisi patungo sa buhay” o “pagsisisi para sa buhay.” Ang pariralang Griyego ay maaaring magpahayag ng direksiyon, layunin, o resulta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες δὲ ταῦτα
  choice: Nang marinig nila ang mga bagay na ito
  rationale: Ipinahahayag ng aorist participle ang pangyayaring nauna sa pangunahing mga pandiwa. Likas sa Tagalog ang sugnay na may “Nang,” at ang banayad na pang-ugnay na δέ ay hindi kailangang isalin nang hiwalay.
- source_word: ἡσύχασαν
  choice: tumahimik sila
  rationale: Ipinahihiwatig ng pandiwa na tumigil sila sa pagtutol at hindi na nagsalita. Ang “tumahimik” ay maikli, natural, at hindi nagdaragdag ng motibong hindi tahasang sinabi.
- source_word: ἐδόξασαν τὸν θεόν
  choice: niluwalhati ang Diyos
  rationale: Pinananatili nito ang karaniwang teolohikal na bigat ng δοξάζω sa Lucas–Mga Gawa; mas tuwiran ito kaysa sa mas maluwag na “pinuri.”
- source_word: λέγοντες
  choice: Sinabi nila
  rationale: Ginawang hiwalay na pangungusap ang participle upang maging malinaw at natural sa modernong Tagalog habang ipinakikilala pa rin ang nilalaman ng kanilang tugon.
- source_word: Ἄρα
  choice: Kung gayon
  rationale: Malinaw nitong ipinakikita na ang sinabi nila ay konklusyong hinango mula sa ulat ni Pedro.
- source_word: καὶ τοῖς ἔθνεσιν
  choice: din ... sa mga Hentil
  rationale: Ipinakikita ng “din” ang inklusibong diin ng καί. Sa kontekstong ito, ang ἔθνεσιν ay tumutukoy sa mga hindi Judio, kaya mas malinaw ang “mga Hentil” kaysa “mga bansa.”
- source_word: τὴν μετάνοιαν
  choice: ang pagsisisi
  rationale: Ang “pagsisisi” ang natural at kinikilalang katumbas ng μετάνοια sa Tagalog. Hindi ito pinalawak sa isang depinisyong maaaring magpaliit sa saklaw ng salitang Griyego.
- source_word: εἰς ζωήν
  choice: humahantong sa buhay
  rationale: Likas itong paraan sa Tagalog upang ipahayag ang direksiyon o resultang taglay ng εἰς, habang ang posibleng literal na anyo ay inilalagay sa talababa.
- source_word: ἔδωκεν
  choice: ipinagkaloob
  rationale: Inilalarawan ng Griyego ang pagsisisi bilang ibinigay ng Diyos. Ang “ipinagkaloob” ay angkop sa Diyos bilang simuno at pinananatili ang diwa ng kaloob nang hindi nagpapasok ng karagdagang sistemang doktrinal.
theological_decisions:
- issue: Ang pagsisisi bilang kaloob ng Diyos
  choice: “ipinagkaloob ... ang pagsisisi”
  alternative: “ibinigay ... ang pagsisisi”
  rationale: Tahasang inilalahad ng teksto na ang Diyos ang nagbigay ng pagsisisi sa mga Hentil. Pinananatili ito nang hindi nagpapasiya sa mas malawak na usapin tungkol sa ugnayan ng pagkilos ng Diyos at tugon ng tao.
- issue: Kahulugan ng εἰς ζωήν
  choice: “humahantong sa buhay”
  alternative: “patungo sa buhay” o “para sa buhay”
  rationale: Maaaring magpahayag ang εἰς ng direksiyon, layunin, o resulta. Ang pangunahing salin ay natural at nagpapanatili sa kaugnayan ng pagsisisi at buhay, samantalang kinikilala sa talababa ang ibang posibleng anyo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang karaniwang bokabularyong biblikal na “niluwalhati,” “Hentil,” at “pagsisisi,” ngunit inayos ang sintaks upang maging natural sa kasalukuyang Tagalog. Inilagay ang bawat panandang talababa sa mismong pariralang tinatalakay nito.
