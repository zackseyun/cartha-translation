  to: Kung gayon, kung ibinigay ng Diyos sa kanila ang kaparehong kaloob na ibinigay niya sa atin na sumampalataya sa Panginoong Jesus, ang Mesiyas, sino ako upang hadlangan ang Diyos?[a]
  rationale: Pinalitan ang panimulang “Kaya, kung” ng mas likas na “Kung gayon, kung,” nilinaw ang paghahambing na nasa ἴσην δωρεάν sa “kaparehong kaloob,” at inayos ang titulo bilang “Panginoong Jesus, ang Mesiyas.” Napanatili ang deskriptibong ugnayan ng “atin na sumampalataya,” ang retorikal na “sino ako,” at ang direktang layon na “hadlangan ang Diyos.” Inilipat ang umiiral na talababa upang nakaangkla ito sa “Mesiyas.”
