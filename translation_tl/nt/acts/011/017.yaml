  text: εἰ οὖν τὴν ἴσην δωρεὰν ἔδωκεν αὐτοῖς ὁ θεὸς ὡς καὶ ἡμῖν πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν, ⸀ἐγὼ τίς ἤμην δυνατὸς κωλῦσαι τὸν θεόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/017.yaml
  text: If then God gave to them the same gift as also to us who believed in the Lord Jesus the Messiah[b][a], who was I that I could hinder God?
translation:
  language: tl
  text: Kung gayon, kung ibinigay ng Diyos sa kanila ang kaparehong kaloob na ibinigay niya sa atin na sumampalataya sa Panginoong Jesus, ang Mesiyas, sino ako upang hadlangan ang Diyos?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang salitang Griyego na Χριστός ay nangangahulugang “Mesiyas” o “Pinahiran.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσην δωρεάν
  choice: ang kaloob ding ibinigay niya sa atin
  rationale: Ipinahahayag ng ἴσην ang pagkakapantay o pagkakatulad ng kaloob. Ang ayos na ito ay natural sa Tagalog at malinaw na inihahambing ang kaloob sa kanila at sa atin.
- source_word: πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν
  choice: sa atin na sumampalataya sa Panginoong Jesus na Mesiyas
  rationale: Ang aorist participle na πιστεύσασιν ay tumutukoy sa ἡμῖν; pinananatili ng deskriptibong salin na “na sumampalataya” ang ugnayang gramatikal nang hindi ipinipilit na temporal lamang ang diwa. Ang ἐπὶ na may akusatibo ay likas na naipahahayag sa Tagalog sa pandiwang “sumampalataya sa.”
- source_word: κύριον
  choice: Panginoon
  rationale: Titulo ito ni Jesus sa pahayag na ito, kaya “Panginoon” ang angkop at karaniwang salin.
- source_word: Χριστόν
  choice: Mesiyas
  rationale: Nananatiling aktibo rito ang kahulugan ng Χριστός bilang titulo ng pinahiran ng Diyos; kaya “Mesiyas” ang ginamit sa halip na tratuhing bahagi lamang ng pangalan.
- source_word: ἐγὼ τίς ἤμην δυνατὸς
  choice: sino ako para
  rationale: Natural na idyomang Tagalog ito para sa retorikal na pagpapakumbaba at kawalan ng karapatang salungatin ang ginawa ng Diyos.
- source_word: κωλῦσαι
  choice: hadlangan
  rationale: Tuwirang ipinahahayag nito ang pagpigil o pagharang at napapanatili ang matinding larawan ng pagtatangkang humadlang mismo sa Diyos.
- source_word: τὸν θεόν
  choice: ang Diyos
  rationale: Tuwirang layon ito ng κωλῦσαι; pinananatili ng salin ang kapansin-pansing pahayag na ang pagtutol sa pangyayari ay paghadlang sa Diyos.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστόν sa titulong κύριον Ἰησοῦν Χριστόν
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay may malinaw na puwersa bilang titulo rito. Pinananatili ng “Mesiyas” ang mesianikong kahulugan nang hindi nagdaragdag ng denominasyonal na paliwanag.
- issue: Ugnayan ng πιστεύσασιν sa ἡμῖν
  choice: 'deskriptibo: “sa atin na sumampalataya”'
  alternative: 'temporal: “sa atin nang sumampalataya tayo”'
  rationale: Dative plural ang participle at tumutugma sa ἡμῖν. Ang deskriptibong anyo ay mas malapit sa estruktura ng Griyego at hindi nagpapasya nang higit sa teksto kung temporal o anterior ang pangunahing diin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaloob” para sa δωρεά at ang natural na retorikal na “sino ako para hadlangan ang Diyos?” Pinanatiling maikli ang pangungusap at iniwasan ang labis na teknikal o denominasyonal na pananalita.
