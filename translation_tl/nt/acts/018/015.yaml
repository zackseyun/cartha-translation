  text: εἰ δὲ ⸀ζητήματά ἐστιν περὶ λόγου καὶ ὀνομάτων καὶ νόμου τοῦ καθ’ ὑμᾶς, ὄψεσθε αὐτοί· ⸀κριτὴς ἐγὼ τούτων οὐ βούλομαι εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/015.yaml
  text: But if these are questions about a word and names and your own law[a], you yourselves will see to it; I do not want to be a judge of these things.
translation:
  language: tl
  text: Ngunit kung ang mga usaping ito ay tungkol sa isang salita[a], mga pangalan, at sa sarili ninyong batas, kayo mismo ang mag-asikaso sa mga ito. Ayaw kong maging hukom sa mga bagay na ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang mensahe” o “isang aral.” Malawak ang kahulugan ng salitang Griyego na λόγος at maaaring tumukoy sa pinagtatalunang turo o katawagan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματά
  choice: mga usapin
  rationale: Tumutukoy ito sa mga bagay na pinagtatalunan o sinisiyasat. Ang “mga usapin” ay likas sa makabagong Filipino at hindi nito ipinapalagay na talagang palaaway ang pagtatalo.
- source_word: περὶ λόγου
  choice: tungkol sa isang salita
  rationale: Malawak ang kahulugan ng λόγος at maaaring tumukoy sa salita, mensahe, pangangaral, o aral. Pinananatili ng “isang salita” ang pagiging bukás ng Griyego, habang nililinaw sa talababa ang ibang posibilidad.
- source_word: ὀνομάτων
  choice: sa mga pangalan
  rationale: Tuwirang katumbas ito ng pangmaramihang ὀνομάτων at hindi tinutukoy kung karaniwang pangalan, titulo, o katawagan ang pinagtatalunan.
- source_word: νόμου τοῦ καθ’ ὑμᾶς
  choice: sa sarili ninyong Kautusan
  rationale: Ipinahihiwatig ng parirala na ang Kautusang ito ay nauukol sa kanila, hindi sa batas Romano. Ipinakikita ng “sarili ninyong” ang pagdistansiya ni Galio; ginamit ang malaking titik dahil tumutukoy ito sa Kautusang Judio.
- source_word: ὄψεσθε αὐτοί
  choice: kayo na mismo ang bahala
  rationale: Idyomatiko ang anyong ito sa diwang “kayo mismo ang mag-asikaso.” Likas ito sa Filipino at pinananatili ang diin ng αὐτοί.
- source_word: κριτὴς
  choice: hukom
  rationale: Ang “hukom” ang malinaw at likas na terminong Filipino sa kontekstong legal.
- source_word: τούτων
  choice: sa mga bagay na ito
  rationale: Malawak na tinutukoy nito ang lahat ng usaping kababanggit pa lamang.
- source_word: οὐ βούλομαι εἶναι
  choice: Ayaw kong maging
  rationale: Natural na ipinahahayag nito ang personal na kawalan ng pagnanais o pagkukusang gampanan ang papel na iyon, nang hindi pinalalakas bilang isang teknikal na hatol.
theological_decisions:
- issue: Saklaw ng λόγος sa pagtanggi ni Galio
  choice: “isang salita,” na may talababa tungkol sa mas malawak na saklaw
  alternative: “isang mensahe,” “isang aral,” o “doktrina”
  rationale: Hindi tiyak sa teksto kung ang λόγος ay tumutukoy sa partikular na salita o katawagan, sa mensahe, o sa aral. Hindi dapat tahimik na limitahan ng salin ang kahulugan sa isang tiyak na teolohikal na paksa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “kayo na mismo ang bahala” ay isang likas na idyoma para sa utos na sila ang umasikaso sa usapin. Pinanatili ang legal na himig sa “mga usapin” at “hukom,” at ang tunay na kalabuan ng λόγος sa pangunahing teksto at talababa.
