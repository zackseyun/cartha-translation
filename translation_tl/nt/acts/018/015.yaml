- from: Ngunit kung ang mga ito ay mga usapin tungkol sa isang salita[a], sa mga pangalan, at sa sarili ninyong Kautusan, kayo na mismo ang bahala. Ayaw kong maging hukom sa mga bagay na ito.”
  to: Ngunit kung ang mga usaping ito ay tungkol sa isang salita[a], mga pangalan, at sa sarili ninyong batas, kayo mismo ang mag-asikaso sa mga ito. Ayaw kong maging hukom sa mga bagay na ito.”
  rationale: Inalis ang malaking titik sa “batas” upang hindi gawing mas tiyak ang di-tiyak na νόμου τοῦ καθ’ ὑμᾶς. Pinalitan ang idyomang “ang bahala” ng “mag-asikaso” upang mas tumpak na maipahayag ang mariing ὄψεσθε αὐτοί at mapanatili ang legal na rehistro. Ang talababa ay pinanatili sapagkat wasto nitong inilalahad ang mga posibleng saklaw ng λόγος nang hindi pumipili ng isang interpretasyong teolohikal.
