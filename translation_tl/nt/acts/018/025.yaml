  to: Ang lalaking ito ay naturuan na tungkol sa daan ng Panginoon. Nag-aalab siya sa espiritu[a], at patuloy siyang nagsasalita at nagtuturo nang tumpak tungkol kay Jesus. Ang alam lamang niya ay ang bautismo ni Juan.
  rationale: Inayos ang pariralang ukol sa pagtuturo upang maging malinaw na ang “daan ng Panginoon” ang nilalaman ng natanggap na tagubilin. Pinalitan ang “nag-aalab ang kanyang espiritu” ng “Nag-aalab siya sa espiritu” upang mapanatili sa pangunahing teksto ang kalabuan ng τῷ πνεύματι, habang ang talababa ay maingat na naghahayag ng posibleng pagtukoy sa Banal na Espiritu. Hindi binago ang kahulugan ng iba pang sugnay.
