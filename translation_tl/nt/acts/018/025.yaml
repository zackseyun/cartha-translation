id: ACT.18.25
reference: Acts 18:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗτος ἦν κατηχημένος τὴν ὁδὸν τοῦ κυρίου, καὶ ζέων τῷ πνεύματι ἐλάλει καὶ ἐδίδασκεν ἀκριβῶς τὰ περὶ τοῦ ⸀Ἰησοῦ, ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/025.yaml
  text: This man had been instructed in the way of the Lord[a], and being fervent in spirit, he was speaking and teaching accurately the things concerning Jesus, knowing only the baptism of John.
translation:
  language: tl
  text: Ang lalaking ito ay naturuan na tungkol sa daan ng Panginoon. Nag-aalab siya sa espiritu[a], at patuloy siyang nagsasalita at nagtuturo nang tumpak tungkol kay Jesus. Ang alam lamang niya ay ang bautismo ni Juan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nag-aalab sa Espiritu,” na maaaring tumukoy sa Banal na Espiritu sa halip na sa sariling espiritu ni Apolos.
    reason: alternative_reading
lexical_decisions:
- source_word: κατηχημένος
  choice: naturuan na
  rationale: Ipinahihiwatig ng perfect passive participle ang pagtuturong natanggap na noon at may nananatiling bunga. Likas sa modernong Tagalog ang “naturuan na” at hindi nito ipinapasok ang mas huling teknikal na kahulugan ng katesismo.
- source_word: τὴν ὁδὸν τοῦ κυρίου
  choice: sa daan ng Panginoon
  rationale: Pinananatili nito ang sinaunang Kristiyanong idyoma ng “daan” at ang karaniwang salin ng κύριος bilang “Panginoon.”
- source_word: ζέων τῷ πνεύματι
  choice: nag-aalab ang kanyang espiritu
  rationale: Ipinapahayag ng ζέων ang matinding sigasig na tulad ng pag-aalab. Ang pangunahing salin ay tumutukoy sa panloob na sigasig ni Apolos, habang inilalahad sa talababa ang posibleng pagtukoy sa Banal na Espiritu.
- source_word: ἐλάλει καὶ ἐδίδασκεν
  choice: patuloy siyang nagsasalita at nagtuturo
  rationale: Ang mga imperfect verb ay nagpapahiwatig ng nagpapatuloy o nakagawiang gawain; malinaw itong naipahahayag ng “patuloy.”
- source_word: ἀκριβῶς
  choice: nang tumpak
  rationale: Inilalarawan nito ang kawastuhan at katiyakan ng kanyang pagsasalita at pagtuturo, kasabay ng binanggit na hangganan ng kanyang kaalaman.
- source_word: τὰ περὶ τοῦ Ἰησοῦ
  choice: tungkol kay Jesus
  rationale: Natural at malinaw itong katumbas sa Tagalog nang hindi nililimitahan ang malawak na saklaw ng mga bagay na may kinalaman kay Jesus.
- source_word: ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου
  choice: Ang alam lamang niya ay ang bautismo ni Juan
  rationale: Pinananatili ang limitasyon ng μόνον nang hindi tahasang nagdaragdag ng panandang pasalungat na wala sa anyong Griyego. Hinati bilang hiwalay na pangungusap upang maging natural at malinaw sa Tagalog.
theological_decisions:
- issue: Kahulugan ng τῷ πνεύματι sa ζέων τῷ πνεύματι
  choice: espiritu ni Apolos / panloob na sigasig
  alternative: ang Banal na Espiritu
  rationale: Maaaring tumukoy ang parirala sa sariling espiritu ni Apolos o sa Banal na Espiritu. Ginamit sa pangunahing teksto ang malamang na idyomatikong diwa ng panloob na sigasig, ngunit pinanatili sa talababa ang kabilang pagbasa upang hindi alisin ang tunay na teolohikal na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang idyomang “daan ng Panginoon,” ginamit ang “bautismo” bilang malawak na kinikilalang terminong biblikal, at iniwasan ang labis na teknikal o denominasyonal na pananalita.
