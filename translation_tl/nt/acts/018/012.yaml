id: ACT.18.12
reference: Acts 18:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Γαλλίωνος δὲ ⸂ἀνθυπάτου ὄντος⸃ τῆς Ἀχαΐας κατεπέστησαν ⸂ὁμοθυμαδὸν οἱ Ἰουδαῖοι⸃ τῷ Παύλῳ καὶ ἤγαγον αὐτὸν ἐπὶ τὸ βῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/012.yaml
  text: But while Gallio was proconsul of Achaia[a], the Jews rose up together against Paul and brought him before the tribunal[b],
translation:
  language: tl
  text: Ngunit noong si Galion ang proconsul ng Acaya, sama-samang tumindig laban kay Pablo ang mga Judio[a] at dinala siya sa hukuman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “ang mga Judio.” Dito, tumutukoy ito sa lokal na pangkat ng mga Judio na kumilos laban kay Pablo, hindi sa lahat ng Judio sa pangkalahatan.
    reason: cultural_note
  - marker: b
    text: Maaari ring “sa luklukan ng paghatol.” Ang salitang Griyego ay tumutukoy sa opisyal na plataporma o upuang pinagdarausan ng paghatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γαλλίωνος
  choice: Galio
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Gallio.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig nito ang banayad na paglipat at pagsalungat sa bagong pangyayari sa salaysay.
- source_word: ἀνθυπάτου ὄντος
  choice: nang ... ay proconsul
  rationale: Likas na ipinapahayag sa Filipino ang temporal na genitive absolute at pinananatili ang tiyak na titulong Romano.
- source_word: Ἀχαΐας
  choice: Acaya
  rationale: Ginamit ang kinagawiang anyong Filipino ng pangalan ng lalawigang Romano.
- source_word: κατεπέστησαν
  choice: kumilos laban
  rationale: Ipinapahayag ang sama-samang mapanlabang pagkilos nang hindi ipinapalagay na tahasang marahas o pisikal ang pag-atake.
- source_word: ὁμοθυμαδὸν
  choice: sama-sama
  rationale: Malinaw at natural na naghahatid ng diwa ng nagkakaisang pagkilos.
- source_word: οἱ Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Tuwirang isinasalin ang Griyego nang hindi ito nililimitahan sa mga pinuno lamang; nililinaw sa talababa ang lokal na saklaw sa konteksto.
- source_word: τῷ Παύλῳ
  choice: laban kay Pablo
  rationale: Ipinakikita ang mapanlabang ugnayang hinihingi ng pandiwang κατεπέστησαν.
- source_word: ἤγαγον αὐτὸν
  choice: dinala siya
  rationale: Ang neutral na 'dinala' ay angkop sa legal na tagpo at hindi nagdaragdag ng diwang 'kinaladkad.'
- source_word: ἐπὶ τὸ βῆμα
  choice: sa hukuman
  rationale: Natural at malinaw sa makabagong Filipino para sa opisyal na lugar o upuang pinagdarausan ng paghatol.
theological_decisions:
- issue: Saklaw ng οἱ Ἰουδαῖοι sa salaysay ng alitan
  choice: ang mga Judio
  alternative: ang mga pinunong Judio / ang ilang Judio
  rationale: Hindi tinutukoy ng Griyego na mga pinuno lamang o tahasang nagsasabing 'ilan,' kaya pinanatili ang tuwirang katawagan. Gayunman, nililinaw ng talababa na ang tinutukoy sa tagpong ito ay ang lokal na pangkat na kumilos laban kay Pablo, hindi ang lahat ng Judio sa pangkalahatan.
- issue: Uri ng βῆμα
  choice: hukuman
  alternative: luklukan ng paghatol
  rationale: Pinananatili ng 'hukuman' ang legal na diwa sa paraang madaling maunawaan, habang inilalahad sa talababa ang mas literal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tiyak na titulong Romanong “proconsul”; ginamit ang “hukuman” para madaling maunawaan ang legal na tagpo, kalakip ang mas literal na paliwanag sa talababa.
