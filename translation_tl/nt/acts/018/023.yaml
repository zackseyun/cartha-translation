    rationale: Ipinahihiwatig ng καθεξῆς ang sunod-sunod na pag-usad, ngunit hindi tinutukoy ng teksto ang bawat indibiduwal na lugar na dinaanan. Ang “sunod-sunod na naglakbay” ay mas malapit at hindi labis na tumutukoy.
