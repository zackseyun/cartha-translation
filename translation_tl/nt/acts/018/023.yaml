base_translation:
  language: en
  yaml_path: translation/nt/acts/018/023.yaml
  text: And after spending some time there[a], he departed and traveled from place to place through the Galatian region and Phrygia, strengthening all the disciples.
translation:
  language: tl
  text: Matapos manatili roon nang ilang panahon, umalis siya at sunod-sunod na naglakbay sa mga lupain ng Galacia at Frigia,[a] habang pinalalakas ang lahat ng alagad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “naglakbay nang sunod-sunod sa mga lupain ng Galacia at Frigia” o “dumaan ayon sa pagkakasunod-sunod sa mga lupain ng Galacia at Frigia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας χρόνον τινά
  choice: Matapos manatili roon nang ilang panahon
  rationale: Ang idyomang ποιέω + χρόνον ay tumutukoy sa pagpapalipas o pananatili nang ilang panahon. Likas sa Tagalog ang “manatili,” at ang “roon” ay nilinaw mula sa naunang lokasyon sa konteksto.
- source_word: ἐξῆλθεν
  choice: umalis siya
  rationale: Sa salaysay ng paglalakbay, ang literal na “lumabas” ay nangangahulugang umalis mula sa isang lugar; “umalis” ang malinaw at natural na katumbas.
- source_word: διερχόμενος καθεξῆς
  choice: isa-isang dinaanan
  rationale: Pinagsasama nito ang patuloy na pagdaan at ang sunod-sunod na progreso ng paglalakbay. Pinananatili ng “isa-isang dinaanan” ang diwa ng καθεξῆς nang hindi ipinapalagay ang isang tiyak na heograpikong ruta.
- source_word: τὴν Γαλατικὴν χώραν καὶ Φρυγίαν
  choice: ang lupain ng Galacia at Frigia
  rationale: Ang χώρα ay lupain o rehiyon. Ang “lupain ng Galacia” ay hindi nagtatakda kung teknikal na lalawigang Romano o mas malawak na etnikong rehiyon ang tinutukoy; natural ding iugnay rito ang Frigia.
- source_word: στηρίζων
  choice: habang pinalalakas
  rationale: Ang στηρίζω ay magpalakas, magpatatag, o gawing matibay. Ang “pinalalakas” ay nagpapanatili sa malawak na pastoral na kahulugan at sa kasabay na kilos ng participle.
- source_word: πάντας τοὺς μαθητάς
  choice: ang lahat ng alagad
  rationale: Ang “alagad” ang karaniwang katawagan sa mga tagasunod ni Jesus, at malinaw na pinananatili ng “lahat” ang πάντας.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Frigia” at “Galacia,” mga karaniwang anyong Filipino ng mga pangalang heograpiko. Inilagay ang talababa pagkatapos ng dalawang rehiyon dahil ang alternatibo ay tumutukoy sa ugnayan ng διερχόμενος at καθεξῆς sa buong pariralang pangheograpiya.
