  yaml_path: translation/nt/acts/018/011.yaml
  text: So he stayed there a year and six months, teaching the word of God among them.
translation:
  language: tl
  text: Kaya nanatili siya roon nang isang taon at anim na buwan, habang itinuturo niya sa kanila ang salita ng Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: nanatili siya roon
  rationale: Bagaman literal na maaaring mangahulugang “umupo,” idyomatiko itong tumutukoy rito sa pananatili sa isang lugar sa loob ng takdang panahon. Likas sa modernong Tagalog ang “nanatili siya roon.”
- source_word: δὲ
  choice: Kaya
  rationale: Mahinang pang-ugnay ang δέ. Sa daloy mula sa naunang pagpapalakas ng loob ng Panginoon tungo sa ginawa ni Pablo, ang “Kaya” ay nagpapahayag ng banayad na bunga nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: ἐνιαυτὸν καὶ μῆνας ἓξ
  choice: nang isang taon at anim na buwan
  rationale: Tuwirang ipinahahayag ang haba ng panahon. Ang “nang” ang likas na pananda ng tagal sa Tagalog.
- source_word: διδάσκων
  choice: at itinuro
  rationale: Ipinahihiwatig ng kasalukuyang participle ang patuloy at kasabay na pagtuturo habang nananatili siya. Sa Tagalog, natural na maihahayag ito bilang magkakaugnay na kilos; nauunawaan sa konteksto na nagpatuloy ang pagtuturo sa panahong iyon.
- source_word: ἐν αὐτοῖς
  choice: sa kanila
  rationale: Ang ἐν kasama ng panghalip ay may panlipunan o lokatibong diwa rito. Natural sa Tagalog ang “sa kanila,” na maaaring tumukoy sa pagtuturo sa gitna nila o sa kanila bilang mga tinuturuan.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Pinananatili nito ang nakaugaliang biblikal na pahayag at ang teolohikal na lawak ng λόγος bilang mensaheng nagmumula sa Diyos.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang karaniwang “salita ng Diyos” sa halip na paliwanag na “mensahe ng Diyos” upang mapanatili ang biblikal na resonansiya. Walang kinakailangang talababa sa talatang ito.
