  source_fidelity: 'Tapat ang salin sa SBLGNT: naipapahayag ang nagsasalita bilang “ang Panginoon,” ang panahon (“sa gabi”), ang instrumental na paraan ng paghahayag (“sa pamamagitan ng isang pangitain”), at ang magkatuwang na utos na huwag matakot, magpatuloy sa pagsasalita, at huwag manahimik. Hindi nito idinaragdag ang pangalang “Jesus,” bagaman maaaring iyon ang tinutukoy sa konteksto.'
