id: ACT.18.9
reference: Acts 18:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος ⸂ἐν νυκτὶ δι’ ὁράματος⸃ τῷ Παύλῳ· Μὴ φοβοῦ, ἀλλὰ λάλει καὶ μὴ σιωπήσῃς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/009.yaml
  text: And the Lord said to Paul in the night through a vision[a], “Do not be afraid, but keep speaking and do not be silent,”
translation:
  language: tl
  text: At sinabi ng Panginoon kay Pablo sa gabi sa pamamagitan ng isang pangitain[a], “Huwag kang matakot. Sa halip, patuloy kang magsalita at huwag kang manahimik.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa isang pangitain.” Literal sa Griyego, “sa pamamagitan ng isang pangitain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Pinananatili ang titulong nasa Griyego nang hindi dinaragdagan ng tahasang pagkilalang “Jesus.” Sa konteksto ng Mga Gawa, malamang na tumutukoy ito sa muling nabuhay na si Jesus.
- source_word: ἐν νυκτὶ
  choice: sa gabi
  rationale: Likas at malinaw na panandang temporal sa modernong Tagalog.
- source_word: δι’ ὁράματος
  choice: sa pamamagitan ng isang pangitain
  rationale: 'Ipinapakita ang instrumental na diwa ng διά na may genitive: ang pangitain ang paraang ginamit sa pakikipag-usap.'
- source_word: Μὴ φοβοῦ
  choice: Huwag kang matakot
  rationale: Natural na pagbabawal sa Tagalog at tapat sa diwa ng kasalukuyang imperative.
- source_word: ἀλλὰ λάλει
  choice: Sa halip, patuloy kang magsalita
  rationale: Ang “patuloy” ay naghahayag ng nagpapatuloy na kilos na ipinahihiwatig ng present imperative λάλει; ang “sa halip” ay malinaw na naghahatid ng pagsalungat ng ἀλλά.
- source_word: καὶ μὴ σιωπήσῃς
  choice: at huwag kang manahimik
  rationale: Natural na katumbas ng pagbabawal at pinananatili ang magkatambal na utos na magsalita at huwag manahimik.
theological_decisions:
- issue: Ang tinutukoy ng “Panginoon”
  choice: Isinalin lamang bilang “ang Panginoon.”
  alternative: “ang Panginoong Jesus”
  rationale: ὁ κύριος lamang ang nakasulat sa Griyego. Bagaman karaniwang tumutukoy ito kay Jesus sa Mga Gawa, hindi dapat idagdag sa salin ang pangalang hindi tahasang nasa talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “sa pamamagitan ng” upang mapanatili ang instrumental na anyo ng Griyego, at hinati sa dalawang pangungusap ang direktang pananalita para sa likas na daloy.
