  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗτός τε ἤρξατο παρρησιάζεσθαι ἐν τῇ συναγωγῇ· ἀκούσαντες δὲ αὐτοῦ ⸂Πρίσκιλλα καὶ Ἀκύλας⸃ προσελάβοντο αὐτὸν καὶ ἀκριβέστερον αὐτῷ ἐξέθεντο τὴν ⸂ὁδὸν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/026.yaml
  text: And he began to speak boldly in the synagogue. But when Priscilla and Aquila heard him[a], they took him aside and explained the way of God to him more accurately.
translation:
  language: tl
  text: At nagsimula siyang magsalita nang buong tapang sa sinagoga. Ngunit nang marinig nina Priscila at Aquila ang kanyang pagsasalita, isinama nila siya[a] at ipinaliwanag nila sa kanya ang daan ng Diyos nang mas tumpak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isinama nila siya sa isang tabi” o “tinanggap nila siya.” Ang pandiwang Griyego ay maaaring mangahulugang isama o tanggapin ang isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός τε ἤρξατο
  choice: At nagsimula siya
  rationale: Tumutukoy ang οὗτος kay Apolos sa naunang konteksto, kaya natural ang panghalip na “siya.” Ang τέ ay nagbibigay ng banayad na pag-uugnay, na ipinahahayag ng “At,” at ang ἤρξατο ay “nagsimula.”
- source_word: παρρησιάζεσθαι
  choice: magsalita nang buong tapang
  rationale: Ipinahahayag ng pandiwa ang hayagan, malaya, at matapang na pagsasalita. Natural sa modernong Tagalog ang “nang buong tapang” at hindi nito nililimitahan ang kilos sa pangangaral lamang.
- source_word: ἐν τῇ συναγωγῇ
  choice: sa sinagoga
  rationale: Tuwirang lokatibong parirala; “sinagoga” ang kinikilalang salin sa Tagalog.
- source_word: ἀκούσαντες δὲ αὐτοῦ
  choice: Ngunit nang marinig siya
  rationale: Temporal ang gamit ng participle na ἀκούσαντες. Ang δέ ay banayad na paglipat o pagsalungat, na angkop na ipinahahayag ng “Ngunit.”
- source_word: Πρίσκιλλα καὶ Ἀκύλας
  choice: Priscila at Aquila
  rationale: Ginamit ang karaniwang anyong Tagalog ng mga pangalang ito; pinanatili ang pagkakasunod ng mga pangalan sa tekstong Griyego.
- source_word: προσελάβοντο αὐτὸν
  choice: isinama nila siya
  rationale: Maaaring mangahulugan ang προσλαμβάνομαι ng pagsama, pagtanggap, o paglapit/pagbukod sa isang tao. Ang “isinama” ay natural at pinananatiling bukas kung dinala nila siya sa isang mas pribadong lugar o tinanggap sa kanilang samahan; nililinaw sa talababa ang iba pang posibilidad.
- source_word: ἀκριβέστερον
  choice: nang mas tumpak
  rationale: 'Pinananatili nito ang pahambing na diwa: ipinaliwanag nila ang bagay nang may higit na katumpakan o katiyakan kaysa sa naunang pagkaunawa ni Apolos.'
- source_word: ἐξέθεντο
  choice: ipinaliwanag
  rationale: Ang ἐκτίθημι sa gitnang tinig dito ay nangangahulugang ilahad o ipaliwanag. Malinaw at kasalukuyan ang “ipinaliwanag.”
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: ang daan ng Diyos
  rationale: Malapit ito sa kayarian ng Griyego at pinananatili ang malawak na ekspresyon ng teksto nang hindi agad tinutumbasan ng isang mas tiyak na sistemang doktrinal.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Natural na Tagalog para sa di-tuwirang layon ng “ipinaliwanag.”
theological_decisions:
- issue: Ang ginawa nina Priscila at Aquila kay Apolos
  choice: isinama nila siya
  alternative: ibinukod nila siya; tinanggap nila siya
  rationale: Hindi ganap na tiyak ang saklaw ng προσελάβοντο. Iminumungkahi ng kasunod na pagpapaliwanag ang isang mas personal na pag-uusap, ngunit hindi tahasang sinasabi ng Griyego na “ibinukod.” Kaya pinili ang “isinama,” at inilagay sa talababa ang mga leksikal na alternatibo upang hindi magpasok ng di-nakasulat na pampublikong pagsaway o pormal na kaayusang pansimbahan.
- issue: Kahulugan ng “daan ng Diyos”
  choice: pinanatili ang mismong ekspresyong “daan ng Diyos”
  alternative: mensahe ng kaligtasan ng Diyos; buong pananampalatayang Kristiyano; moral na pamumuhay ayon sa Diyos
  rationale: Malamang na tumutukoy ito sa mensahe at landas ng pananampalatayang Kristiyano, ngunit hindi iyon higit na tinutukoy ng talata. Pinananatili ng salin ang teolohikal na lawak at tensiyon ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “nang buong tapang” at “nang mas tumpak” para sa malinaw na daloy. Iniwasan ang mas lumang “nangaral nang buong katapangan” at ang teknikal na “ipinaliwanag nang mas eksakto.”
