  text: ἐπιλαβόμενοι δὲ ⸀πάντες Σωσθένην τὸν ἀρχισυνάγωγον ἔτυπτον ἔμπροσθεν τοῦ βήματος· καὶ οὐδὲν τούτων τῷ Γαλλίωνι ⸀ἔμελεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/017.yaml
  text: Then they all seized Sosthenes[a], the synagogue ruler, and beat him in front of the tribunal. But Gallio paid no attention to these things.
translation:
  language: tl
  text: Pagkatapos, sinunggaban nilang lahat si Sostenes[a], ang pinuno ng sinagoga, at pinagbubugbog siya sa harap ng hukuman. Ngunit hindi man lamang pinansin ni Galio ang mga bagay na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “lahat ng mga Griego” ang mababasa sa halip na “silang lahat” lamang. Mas maikli ang pinakamaagang teksto at hindi nito tinutukoy kung sino ang pangkat.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: sinunggaban
  rationale: Ipinahahayag nito ang marahas na pagdakip o paghawak na humantong sa pambubugbog.
- source_word: πάντες
  choice: nilang lahat
  rationale: Pinananatili ang diwa ng kabuuan ngunit hindi tinutukoy kung sino ang pangkat, gaya ng Griyegong teksto.
- source_word: ἀρχισυνάγωγον
  choice: pinuno ng sinagoga
  rationale: Likas at malinaw na tawag sa pangunahing opisyal ng isang sinagoga.
- source_word: ἔτυπτον
  choice: binugbog
  rationale: Ang imperpektong anyo ay naglalarawan ng nagpapatuloy o paulit-ulit na pananakit; likas na naipahihiwatig ito ng pandiwang 'binugbog' sa konteksto.
- source_word: ἔμπροσθεν τοῦ βήματος
  choice: sa harap ng hukuman
  rationale: Ang βῆμα ay ang opisyal na lugar o platapormang pinagdarausan ng paghatol; 'hukuman' ang malinaw at karaniwang katumbas sa modernong Filipino.
- source_word: οὐδὲν τούτων ... ἔμελεν
  choice: hindi man lamang ito pinansin
  rationale: Natural na Filipino para sa idyomang nagsasabing walang anumang malasakit o pansin si Galio sa mga pangyayaring iyon.
- source_word: δέ
  choice: Pagkatapos
  rationale: Minamarkahan nito ang pagsulong ng salaysay.
- source_word: καί
  choice: Ngunit
  rationale: Ipinakikita ang kontras sa pagitan ng karahasan ng pangkat at kawalang-pansin ni Galio.
theological_decisions:
- issue: Pagkakakilanlan ng πάντες ('lahat')
  choice: Hindi tinukoy sa pangunahing teksto kung sino ang 'lahat.'
  alternative: Lahat ng mga Griego; lahat ng mga Judio
  rationale: πάντες lamang ang mababasa sa pinakamaagang teksto at walang tahasang pangngalang tumutukoy sa pangkat. Hindi dapat idagdag ng salin ang isang pagkakakilanlang hindi sinasabi ng pinagmulang teksto.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang 'sinagoga' at 'hukuman' bilang malinaw na mga terminong angkop sa konteksto; pinanatili ang tunay na kalabuan sa pagkakakilanlan ng pangkat.
