  text: Ὡς δὲ κατῆλθον ἀπὸ τῆς Μακεδονίας ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος, συνείχετο τῷ ⸀λόγῳ ὁ Παῦλος, διαμαρτυρόμενος τοῖς Ἰουδαίοις ⸀εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/005.yaml
  text: But when Silas and Timothy came down from Macedonia[a], Paul was occupied with the word[b], solemnly testifying to the Jews that Jesus is the Messiah.
translation:
  language: tl
  text: Ngunit nang dumating mula sa Macedonia sina Silas at Timoteo, lubos na nakatuon si Pablo sa salita[a], habang taimtim siyang nagpapatotoo sa mga Judio na si Jesus ang Mesiyas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “napipilitan ng salita” o “lubos na abala sa mensahe.” Maaaring ipahiwatig ng pandiwang Griego ang pagiging lubhang abala, nasasakop, o napipilitan ng isang bagay.
    reason: lexical_alternative
  - marker: b
    text: Sa Griego, “Cristo.” Ginamit dito ang salita bilang titulo, kaya isinaling “Mesiyas.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Nang
  rationale: Ipinahahayag nito ang paglipat ng salaysay at ang panahong kaugnayan ng pagdating nina Silas at Timoteo sa sumunod na ginawa ni Pablo. Hindi kailangang piliting isalin nang hiwalay ang δέ sa Filipino.
- source_word: κατῆλθον ἀπὸ τῆς Μακεδονίας
  choice: dumating mula sa Macedonia
  rationale: Ang κατέρχομαι ay literal na maaaring ‘bumaba’ o ‘pumarito,’ ngunit sa likas na Filipino, mas malinaw ang ‘dumating mula’ nang hindi ipinapalagay na mahalaga rito ang direksiyon ng pagbaba.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: sina Silas at Timoteo
  rationale: Likas na ipinahahayag ng ‘sina’ ang pinagsamang mga taong simuno, kaya hindi na kailangan ang mas mabigat na ‘kapwa sina.’
- source_word: συνείχετο
  choice: lubos na natuon
  rationale: Ipinapanatili nito ang diwang si Pablo ay lubhang nasasakop, abala, o nakatalaga sa gawain, ngunit hindi nito tiyak na ipinapakahulugang may panlabas o espirituwal na puwersang pumipilit sa kaniya.
- source_word: τῷ λόγῳ
  choice: sa salita
  rationale: Pinananatili ang karaniwang bokabularyo ni Lucas para sa ipinahahayag na mensahe. Ang dative ay maaaring tumukoy sa bagay o larangang lubos na pinagtuunan ni Pablo.
- source_word: διαμαρτυρόμενος
  choice: taimtim na nagpapatotoo
  rationale: Taglay ng pandiwa ang pinatindi o mariing diwa ng pagbibigay-patotoo; ipinahahayag ito ng ‘taimtim’ nang hindi ginagawang pakikipagtalo lamang ang kilos.
- source_word: τοῖς Ἰουδαίοις
  choice: sa mga Judio
  rationale: Sa kontekstong ito, tumutukoy ito sa mga Judio bilang pangkat na etnorelihiyoso, hindi lamang sa mga taga-Judea.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: na si Jesus ang Mesiyas
  rationale: 'Ang predikatibong τὸν χριστόν ay titulo rito: pinatotohanan ni Pablo na si Jesus ang ipinangakong Mesiyas.'
theological_decisions:
- issue: Kung isasalin ang Χριστός bilang titulo o bilang anyong pangalan
  choice: Mesiyas
  alternative: Cristo
  rationale: May pantukoy ang χριστός at ginagamit bilang panaguri sa pagpapahayag sa mga Judio. Kaya malinaw na titulo ang gamit nito rito, hindi lamang bahagi ng pangalang ‘Jesu-Cristo.’
- issue: Kung ang συνέχομαι ay nagpapahiwatig ng sapilitang pag-udyok
  choice: lubos na natuon
  alternative: pinipilit ng salita
  rationale: Maaaring mangahulugan ang pandiwa ng pagiging abala, nasasakop, o napipilitan. Hindi tinutukoy ng konteksto kung sikolohikal, espirituwal, o praktikal ang pagpipilit, kaya pinili ang saling hindi tahasang lumulutas sa pinagmulan nito at inilagay sa talababa ang ibang posibilidad.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang ‘salita’ bilang terminong kaugnay ng pagpapahayag ng ebanghelyo, habang nilinaw sa talababa ang lawak ng kahulugan ng συνείχετο. Ang ‘taimtim na nagpapatotoo’ ay pormal ngunit madaling maunawaan at angkop sa diin ng salitang Griego.
