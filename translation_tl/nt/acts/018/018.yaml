source:
  edition: SBLGNT
  text: Ὁ δὲ Παῦλος ἔτι προσμείνας ἡμέρας ἱκανὰς τοῖς ἀδελφοῖς ἀποταξάμενος ἐξέπλει εἰς τὴν Συρίαν, καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας, κειράμενος ⸂ἐν Κεγχρεαῖς τὴν κεφαλήν⸃, εἶχεν γὰρ εὐχήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/018.yaml
  text: After Paul had remained many more days[a], he said farewell to the brothers and sailed away for Syria, and with him were Priscilla and Aquila. In Cenchreae he had his head shaved[e][d][c][b], for he had a vow.
translation:
  language: tl
  text: Matapos manatili roon si Pablo nang marami pang araw, nagpaalam siya sa mga kapatid at naglayag patungong Siria. Kasama niya sina Priscila at Aquila. Sa Cencrea ay nagpagupit si Pablo ng buhok[a], sapagkat may panata siya.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “inahit niya ang kanyang ulo.” Maaaring tumukoy ang pandiwang Griyego sa paggupit o pag-ahit ng buhok; hindi tiyak kung lubusang inahit ang ulo.
    reason: lexical_alternative
  - marker: b
    text: Ipinapalagay ng ilan na si Aquila, hindi si Pablo, ang nagpagupit at may panata. Gayunman, si Pablo ang pinakanatural na tinutukoy ng balarilang Griyego.
    reason: alternative_reading
  - marker: c
    text: “Panata” lamang ang sinasabi ng teksto. Madalas itong iugnay sa isang uri ng panatang Nazareo, ngunit hindi iyon tahasang tinukoy rito.
    reason: cultural_note
lexical_decisions:
- source_word: προσμείνας
  choice: manatili roon
  rationale: Ipinahihiwatig ng aorist participle ang pagkilos na nauna sa paglalayag. Likas sa Tagalog ang “manatili roon”; ang “roon” ay hango sa konteksto, hindi tahasang nasa Griyego.
- source_word: ἡμέρας ἱκανὰς
  choice: nang marami pang araw
  rationale: Ang ἱκανὰς ay tumutukoy sa malaking bilang, at pinananatili ng “pang” ang diwa ng ἔτι na karagdagang panahon.
- source_word: τοῖς ἀδελφοῖς
  choice: sa mga kapatid
  rationale: Ang “mga kapatid” ay likas at inklusibong katawagan sa modernong Tagalog para sa pamayanan ng mga mananampalataya, habang pinananatili ang pampamilyang talinghaga ng Griyego.
- source_word: ἀποταξάμενος
  choice: nagpaalam siya
  rationale: Natural na katumbas sa Tagalog ng paghingi ng pahintulot o pamamaalam bago umalis.
- source_word: ἐξέπλει εἰς τὴν Συρίαν
  choice: naglayag patungong Siria
  rationale: Malinaw na ipinapahayag ang pag-alis sakay ng sasakyang-dagat at ang destinasyon.
- source_word: σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας
  choice: Kasama niya sina Priscila at Aquila
  rationale: Ginawang hiwalay na pangungusap para sa malinaw at natural na daloy sa Tagalog, nang hindi binabago ang ugnayan ng mga kasama kay Pablo.
- source_word: κειράμενος ... τὴν κεφαλήν
  choice: nagpagupit siya ng buhok
  rationale: Ang κείρω ay maaaring mangahulugang gupitin o ahitan. Iniiwasan ng pangunahing teksto ang labis na pagtukoy na lubusang inahit ang ulo; inilalahad sa talababa ang alternatibo.
- source_word: ἐν Κεγχρεαῖς
  choice: Sa Cencrea
  rationale: Ginamit ang anyong madaling bigkasin at basahin sa Filipino para sa pangalan ng daungang lungsod.
- source_word: εἶχεν γὰρ εὐχήν
  choice: sapagkat may panata siya
  rationale: Direktang pinananatili ang pangkalahatang εὐχή nang hindi tinutukoy kung anong uri ng panata iyon.
theological_decisions:
- issue: Tinutukoy ng κειράμενος
  choice: Si Pablo ang nagpagupit
  alternative: Si Aquila ang nagpagupit
  rationale: Ang panlalaking isahang participle ay pinakanatural na bumabalik kay Pablo, ang pangunahing simuno. Gayunman, itinatala ang alternatibong pag-unawa dahil kay Aquila ang pinakamalapit na panlalaking pangalang isahan.
- issue: Uri ng εὐχή
  choice: Hindi tinukoy na “panata” lamang
  alternative: Panatang Nazareo
  rationale: εὐχή lamang ang sinasabi ng teksto; hindi nito tahasang kinikilalang panatang Nazareo iyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “mga kapatid” bilang natural na katawagan sa buong pamayanan ng mga mananampalataya. Hinati sa maiikling pangungusap ang mahabang estrukturang Griyego para sa maayos na daloy, habang pinanatili ang mga tunay na usaping leksikal at reperensiyal sa mga talababa.
