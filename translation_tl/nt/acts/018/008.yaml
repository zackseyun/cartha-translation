  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Κρίσπος δὲ ὁ ἀρχισυνάγωγος ἐπίστευσεν τῷ κυρίῳ σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ, καὶ πολλοὶ τῶν Κορινθίων ἀκούοντες ἐπίστευον καὶ ἐβαπτίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/008.yaml
  text: But Crispus[a], the synagogue ruler, believed in the Lord together with his whole household, and many of the Corinthians, hearing, were believing and were being baptized.
translation:
  language: tl
  text: Ngunit si Crispo, ang pinuno ng sinagoga, ay sumampalataya sa Panginoon kasama ang kanyang buong sambahayan. At marami sa mga taga-Corinto ang nakikinig, sumasampalataya, at binabautismuhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas karaniwang pananalita: “At marami sa mga taga-Corinto, nang makarinig, ay sumampalataya at binautismuhan.” Ang mga anyo ng pandiwa sa Griyego ay naglalarawan sa pagtugon bilang nagaganap o unti-unting umuunlad.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κρίσπος
  choice: Crispo
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Griyegong Κρίσπος.
- source_word: ἀρχισυνάγωγος
  choice: pinuno ng sinagoga
  rationale: Tuwirang ipinapahayag ang tungkulin bilang pangunahing opisyal ng sinagoga nang hindi dinaragdagan ang tiyak na saklaw ng kanyang pamamahala.
- source_word: ἐπίστευσεν τῷ κυρίῳ
  choice: sumampalataya sa Panginoon
  rationale: Likas na Filipino para sa πιστεύω na may datibo; pinanatili ang titulong κύριος bilang “Panginoon” at hindi pinalawak na “Panginoong Jesus.”
- source_word: σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: kasama ang kanyang buong sambahayan
  rationale: Ang οἶκος ay tumutukoy sa sambahayan, hindi lamang sa gusaling bahay; pinananatili ng “buong” ang ὅλῳ.
- source_word: πολλοὶ τῶν Κορινθίων
  choice: marami sa mga taga-Corinto
  rationale: 'Pinananatili ang diwang partitibo: marami mula sa mga naninirahan sa Corinto.'
- source_word: ἀκούοντες
  choice: habang nakikinig
  rationale: Inilalarawan ang pakikinig bilang kasabay ng umuunlad na pagtugon; hindi dinagdagan ang ipinahihiwatig ngunit hindi tahasang binanggit na layon ng pakikinig.
- source_word: ἐπίστευον
  choice: sumasampalataya
  rationale: Ang aspektong di-ganap ng imperpektibo ay ipinahahayag sa anyong nagaganap, na naglalarawan sa patuloy o sunod-sunod na pagtugon ng marami.
- source_word: ἐβαπτίζοντο
  choice: binabautismuhan
  rationale: Pinananatili ang tinig na balintiyak at ang nagaganap o umuunlad na aspekto ng imperpektibong pandiwa.
theological_decisions:
- issue: Saklaw ng pananampalataya ng “buong sambahayan”
  choice: Isinalin nang tuwiran na sumampalataya si Crispo kasama ang kanyang buong sambahayan, nang hindi ipinaliliwanag kung paano nakibahagi ang bawat isa.
  alternative: Sabihing bawat miyembro ay personal na sumampalataya, o ituring lamang itong pangkalahatang paglalarawan sa sambahayan.
  rationale: Hindi nililinaw ng Griyego ang paraan ng pakikibahagi ng bawat kasapi, kaya pinananatili ang pahayag at ang teolohikal na tensiyon nang walang denominasyonal na pagpapasya.
- issue: Tinutukoy ng “Panginoon”
  choice: Panginoon
  alternative: Panginoong Jesus
  rationale: Bagaman si Jesus ang malinaw na tinutukoy ayon sa konteksto ng Mga Gawa, κύριος lamang ang nasa teksto, kaya hindi ito pinalawak sa pangunahing salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinuno ng sinagoga” at “sambahayan” bilang mga salitang madaling maunawaan ngunit tumpak. Bahagyang mas pormal ang ikalawang pangungusap upang maipakita ang aspektong umuunlad ng mga pandiwang Griyego; ibinigay sa talababa ang mas karaniwang idyomatikong anyo.
