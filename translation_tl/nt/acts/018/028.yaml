  rationale: Inayos ang sugnay na participial sa pamamagitan ng “habang ipinakikita niya” upang malinaw na si Apolos ang nagpapakita mula sa mga Kasulatan. Pinalitan ang “sa harap ng madla” ng “sa publiko” bilang mas tuwirang modernong Tagalog para sa δημοσίᾳ, nang hindi nagdaragdag ng ideya na may tiyak na pulutong na naroroon. Hindi binago ang kahulugan o ang mga talababa.
