id: ACT.18.28
reference: Acts 18:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εὐτόνως γὰρ τοῖς Ἰουδαίοις διακατηλέγχετο δημοσίᾳ ἐπιδεικνὺς διὰ τῶν γραφῶν εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/028.yaml
  text: For he powerfully refuted the Jews in public[b][a], demonstrating through the Scriptures that Jesus is the Messiah.
translation:
  language: tl
  text: Sapagkat mariin niyang pinabulaanan sa publiko ang mga Judio, habang ipinakikita niya sa pamamagitan ng mga Kasulatan na si Jesus ang Mesiyas.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “na ang Mesiyas ay si Jesus.” Pinahihintulutan ng ayos ng sugnay sa Griyego ang alinmang pagkakasunod.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “ang Cristo”; isinalin ditong “ang Mesiyas” sapagkat ginagamit ang salita bilang titulo.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐτόνως
  choice: mariin
  rationale: Ipinahahayag nito ang masidhi at mapuwersang paraan ng pangangatwiran, hindi lamang ang lakas ng tinig o sigla.
- source_word: διακατηλέγχετο
  choice: pinabulaanan
  rationale: Tumutukoy ito sa masusing pagpapakitang mali ang argumento ng mga kausap; natural at dignificado ang pandiwang ito sa makabagong Tagalog.
- source_word: τοῖς Ἰουδαίοις
  choice: ang mga Judio
  rationale: Tuwirang tinutukoy ang mga Judiong kausap o sumasalungat sa pampublikong talakayan, nang hindi idinaragdag sa pangunahing teksto ang interpretatibong salitang 'kalaban.'
- source_word: δημοσίᾳ
  choice: sa harap ng madla
  rationale: Likas na Tagalog na nagpapahayag na hayagan at pampubliko ang pangyayari.
- source_word: ἐπιδεικνὺς
  choice: ipinakikita
  rationale: Pinananatili ang diwa ng makatuwiran at nakabatay-sa-ebidensiyang pagpapakita, nang hindi labis na pinatitindi bilang isang ganap na 'patunay.'
- source_word: διὰ τῶν γραφῶν
  choice: sa pamamagitan ng mga Kasulatan
  rationale: Malinaw na ipinahahayag ang mga Kasulatan bilang kasangkapan o paraan ng kaniyang pagpapakita.
- source_word: τὸν χριστὸν
  choice: ang Mesiyas
  rationale: Dito ay titulo ang Χριστός para sa ipinangakong Pinahiran, kaya pinananatili ng 'Mesiyas' ang kontekstong Judio at maka-Kasulatan.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Karaniwang anyo ng pangalang Ἰησοῦς sa Tagalog.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: na si Jesus ang Mesiyas
  rationale: Natural na ayos sa Tagalog para sa pahayag na kinikilala si Jesus bilang Mesiyas, habang inilalahad sa talababa ang tunay na sintaktikong alternatibo.
theological_decisions:
- issue: Pag-render sa Χριστός bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa pangungusap na ito, kinikilala si Jesus bilang ang ipinangakong pinahiran; mas malinaw na naihahatid ng 'Mesiyas' ang gamit bilang titulo kaysa sa posibleng pag-unawa sa 'Cristo' bilang bahagi ng pangalan.
- issue: Ayos ng sugnay na εἶναι τὸν χριστὸν Ἰησοῦν
  choice: si Jesus ang Mesiyas
  alternative: ang Mesiyas ay si Jesus
  rationale: Kapuwa maaaring katawanin ng Griyegong sugnay. Pinili ang mas natural na ayos sa Tagalog, ngunit hindi ikinubli ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga Judio” bilang tuwirang katumbas ng teksto at ang “sa harap ng madla” bilang likas na pahayag para sa pampublikong tagpo. Ang mga talababa ay kapuwa minarkahan sa pangunahing teksto.
