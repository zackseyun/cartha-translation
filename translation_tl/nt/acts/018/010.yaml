  text: διότι ἐγώ εἰμι μετὰ σοῦ καὶ οὐδεὶς ἐπιθήσεταί σοι τοῦ κακῶσαί σε, διότι λαός ἐστί μοι πολὺς ἐν τῇ πόλει ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/010.yaml
  text: because I am with you[a], and no one will attack you to harm you[b], because I have many people in this city.
translation:
  language: tl
  text: sapagkat ako ay kasama mo, at walang sinumang sasalakay sa iyo upang saktan ka,[a] sapagkat marami akong tao sa lungsod na ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “walang sinumang maglalagay ng kamay laban sa iyo upang saktan ka.”
    reason: lexical_alternative
  - marker: b
    text: Ang “marami akong tao sa lungsod na ito” ay malamang na tumutukoy sa maraming taga-Corinto na nauukol sa Panginoon, kabilang ang mga sasampalataya pa.
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: sapagkat
  rationale: Malinaw na ipinahahayag ang sanhi o batayan kapwa ng naunang utos at ng kasunod na pangako.
- source_word: ἐγώ εἰμι μετὰ σοῦ
  choice: kasama mo ako
  rationale: Likas na pahayag ng katiyakan sa Filipino; ang hulíng posisyon ng “ako” ay nagbibigay ng banayad na diin na kaayon ng tahasang ἐγώ.
- source_word: οὐδεὶς
  choice: walang sinuman
  rationale: Tuwirang katumbas na natural at marangal sa makabagong Filipino.
- source_word: ἐπιθήσεταί σοι
  choice: sasalakay sa iyo
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa at datibo sa mapanlabang pagkilos laban kay Pablo. Iniiwasan nito ang labis na literal ngunit di-likas na anyo.
- source_word: τοῦ κακῶσαί σε
  choice: upang saktan ka
  rationale: Pinananatili ang layunin ng mapanlabang pagkilos at ang malawak na saklaw ng κακόω, na maaaring tumukoy sa pananakit o pagpapahamak.
- source_word: λαός
  choice: tao
  rationale: Ginamit bilang pangkat na tumutukoy sa mga taong nauukol sa nagsasalita; sa pariralang “marami akong tao,” natural sa Filipino ang kolektibong diwa nang hindi dinaragdagan ang teksto ng “mga tagasunod.”
- source_word: ἐστί μοι
  choice: marami akong tao
  rationale: Ang εἰμί na may datibong μοι ay nagpapahayag ng pag-aari o kaugnayan; natural itong ipinapahayag sa Filipino sa hulmaing “mayroon ako” o “marami akong.”
- source_word: πολὺς
  choice: marami
  rationale: Tuwirang ipinapahayag ang dami ng λαός.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: sa lungsod na ito
  rationale: Ang “lungsod” ay angkop sa πόλις at sa urbanong konteksto ng Corinto; malinaw ding pinananatili ang demonstratibong ταύτῃ.
theological_decisions:
- issue: Kahulugan ng “marami akong tao” sa lungsod
  choice: Pinanatili sa pangunahing teksto ang malawak na pahayag na “marami akong tao,” na maaaring tumukoy sa mga nasa Corinto na nauukol sa Panginoon, kabilang ang mga sasampalataya pa lamang.
  alternative: Unawain ito bilang pagtukoy lamang sa maraming taong naroon na at handang kumampi kay Pablo.
  rationale: Sa konteksto ng Mga Gawa, ang pag-angkin ng Diyos sa isang “bayan” o “mga tao” ay higit sa simpleng bilang ng populasyon. Gayunman, hindi nililinaw ng mismong pangungusap kung sinu-sino sila o kailan sila sasampalataya, kaya hindi ito nilimitahan sa pangunahing salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sapagkat” sa halip na mas kolokyal na “kasi,” at iniwasan ang mga katawagang gaya ng “mga tagasunod” o “mga hinirang” upang hindi lutasin sa salin ang tunay na teolohikal na tensiyon ng λαός ἐστί μοι πολύς.
