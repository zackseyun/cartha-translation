  yaml_path: translation/nt/acts/018/027.yaml
  text: And when he wanted to go across to Achaia[a], the brothers encouraged him and wrote to the disciples to welcome him. When he arrived[b], he greatly helped those who had believed through grace.
translation:
  language: tl
  text: Nang nais ni Apolos na tumawid patungong Acaya, hinimok siya ng mga kapatid[a] at sumulat sila sa mga alagad upang malugod siyang tanggapin. Pagdating niya, malaki ang naitulong niya sa mga sumampalataya sa pamamagitan ng biyaya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay maaaring tumukoy sa mas malawak na pamayanan ng mga mananampalataya, kasama ang mga babae, bagaman panlalaking anyo ang ginamit sa Griyego.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “Sa pamamagitan ng biyaya, malaki ang naitulong niya sa mga sumampalataya.” Maaaring iugnay ang pariralang Griyego na “sa pamamagitan ng biyaya” sa pagtulong ni Apolos sa halip na sa kanilang pagsampalataya.'
    reason: alternative_reading
lexical_decisions:
- source_word: βουλομένου δὲ αὐτοῦ
  choice: Nang nais ni Apolos
  rationale: Ang genitive absolute ay nagsasaad ng kalagayang kaugnay ng hangarin ni Apolos. Likas sa makabagong Tagalog ang “nang nais,” at tahasang pinangalanan si Apolos upang maging malinaw ang reperensiya ng panghalip.
- source_word: διελθεῖν εἰς τὴν Ἀχαΐαν
  choice: na tumawid patungong Acaya
  rationale: Pinananatili ng “tumawid” ang diwa ng paglalakbay mula sa Efeso patungo sa rehiyon ng Acaya, nang hindi nagiging labis na teknikal.
- source_word: προτρεψάμενοι
  choice: pinalakas ng loob siya
  rationale: Sa konteksto, nagpapahiwatig ito ng positibong paghimok at suporta. Mas natural at magaan sa Tagalog ang “pinalakas ng loob” kaysa “hinimok,” bagaman kapuwa posible.
- source_word: οἱ ἀδελφοὶ
  choice: mga kapatid
  rationale: Ang “mga kapatid” ang karaniwang inklusibong katawagan sa Tagalog para sa kapatiran ng mga mananampalataya, samantalang pinananatili ang talinghaga ng ugnayang pampamilya sa Griyego.
- source_word: ἔγραψαν τοῖς μαθηταῖς
  choice: sinulatan nila ang mga alagad doon
  rationale: Tumpak na ipinapahayag ng “sinulatan” ang γράφω na may datibo. Idinagdag ang “doon” bilang likas na paglilinaw na ang mga alagad ay nasa destinasyon, hindi bilang bagong teolohikal na impormasyon.
- source_word: ἀποδέξασθαι αὐτόν
  choice: na malugod siyang tanggapin
  rationale: Ipinahahayag ng “malugod na tanggapin” ang positibo at magiliw na pagtanggap na hinihingi ng konteksto.
- source_word: ὃς παραγενόμενος
  choice: Pagdating niya
  rationale: Maikli at natural itong temporal na paglilipat sa Tagalog at malinaw na tumutukoy kay Apolos.
- source_word: συνεβάλετο πολὺ
  choice: malaki ang naitulong niya
  rationale: Idyomatiko sa Tagalog at malinaw na ipinakikita ang malaking pakinabang na naibigay ni Apolos sa mga sumampalataya.
- source_word: τοῖς πεπιστευκόσιν
  choice: sa mga sumampalataya
  rationale: Ang “mga sumampalataya” ay natural na tumutukoy sa mga taong nakapasok na sa kalagayan ng pananampalataya. Hindi kailangang gawing tahasang pluperfect sa Tagalog upang maipahayag ang resultative sense ng perfect participle.
- source_word: διὰ τῆς χάριτος
  choice: sa pamamagitan ng biyaya
  rationale: Pinananatili nito ang instrumental na diwa at hindi idinaragdag ang “ng Diyos,” na hindi tahasang nasa Griyego. Sa pangunahing teksto, ikinakabit ito sa kanilang pagsampalataya.
theological_decisions:
- issue: Pagkakabit ng διὰ τῆς χάριτος
  choice: 'Ikinabit sa “mga sumampalataya”: “mga sumampalataya sa pamamagitan ng biyaya.”'
  alternative: 'Maaaring ikabit sa pagtulong ni Apolos: “sa pamamagitan ng biyaya ay malaki ang naitulong niya sa mga sumampalataya.”'
  rationale: Mas likas na nauugnay ang parirala sa pinakamalapit na participle na πεπιστευκόσιν, ngunit tunay na posible sa sintaks ang pagkakabit nito sa συνεβάλετο. Kaya pinili sa pangunahing teksto ang mas malamang na pagbasa at pinanatili sa talababa ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang anyong “Acaya” at ang likas na ekspresyong “pinalakas ng loob.” Ang mga tunay na kalabuan sa saklaw ng “mga kapatid” at sa pagkakabit ng “sa pamamagitan ng biyaya” ay hindi pinawi kundi ipinaliwanag sa mga talababa.
