  yaml_path: translation/nt/acts/018/013.yaml
  text: saying[b][a], “This man is persuading people to worship God contrary to the law.”
translation:
  language: tl
  text: na nagsasabi, “Hinihikayat ng taong ito ang mga tao na sumamba sa Diyos nang labag sa batas[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “salungat sa batas” o “laban sa batas.”
    reason: lexical_alternative
  - marker: b
    text: Malamang na ang tinutukoy ng mga nag-aakusa ay ang batas ng mga Judio, bagaman “ang batas” lamang ang sinasabi sa Griyego.
    reason: cultural_note
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: na nagsasabi, “…”
  rationale: Ang participle ay nagpapakilala sa nilalaman ng paratang, at likas sa Tagalog na ihayag ito bilang tuwirang pananalita.
- source_word: Παρὰ τὸν νόμον
  choice: nang salungat sa Kautusan
  rationale: Ipinahahayag ng παρά na may accusative ang pagsalungat o paglabag. Pinananatili ng “salungat” ang tonong legal nang hindi labis na nilulutas kung anong uri ng paglabag ang ipinaparatang.
- source_word: ἀναπείθει
  choice: Hinihikayat
  rationale: Ipinahahayag nito ang patuloy na pagsisikap na mangumbinsi o makahikayat, nang hindi idinaragdag ang negatibong diwa ng “inililigaw,” na hindi kinakailangan ng Griyego.
- source_word: οὗτος
  choice: ng taong ito
  rationale: Pinananatili ang mapagturong diin ng demonstrative sa loob ng paratang, ngunit iniiwasan ang sobrang mapanlibak na pananalita.
- source_word: τοὺς ἀνθρώπους
  choice: ang mga tao
  rationale: Generic ang ἄνθρωποι rito, kaya ang “mga tao” ay wasto at likas sa modernong Tagalog.
- source_word: σέβεσθαι τὸν θεόν
  choice: na sumamba sa Diyos
  rationale: Sa kontekstong panrelihiyon, tumutukoy ang σέβομαι sa pagsamba o debosyon; malinaw at natural ang “sumamba sa Diyos.”
- source_word: τὸν νόμον
  choice: Kautusan
  rationale: Hindi tahasang tinutukoy ng Griyego kung ito ay “Kautusang Judio” o “aming Kautusan.” Ginamit ang “Kautusan” bilang dignified na katumbas habang pinananatili ang kawalan ng tahasang pantukoy sa pinagmulan nito.
theological_decisions:
- issue: Ang tinutukoy ng “Kautusan” sa paratang
  choice: Panatilihin sa pangunahing teksto ang “Kautusan” nang hindi dinaragdagan ng “Judio” o “aming.”
  alternative: Kautusang Judio; aming Kautusan
  rationale: Malamang na Kautusang Judio ang ibig sabihin ng mga nag-aakusa, ngunit τὸν νόμον lamang ang nasa Griyego. Inilalagay sa talababa ang paliwanag upang hindi maisingit sa teksto ang hindi tahasang sinabi.
- issue: Lakas ng negatibong diwa ng ἀναπείθει
  choice: Hinihikayat
  alternative: Inililigaw; kinukumbinsi
  rationale: Ang pandiwa ay maaaring gamitin sa panghihikayat o paghimok. Hindi nito sapilitang ipinahahayag na mapanlinlang ang ginagawa, kaya hindi ginamit ang “inililigaw.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang legal na tono ng paratang at ang di-tiyak na pagtukoy ng Griyego sa “Kautusan.”
