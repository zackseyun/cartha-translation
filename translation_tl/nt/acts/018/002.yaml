source:
  edition: SBLGNT
  text: καὶ εὑρών τινα Ἰουδαῖον ὀνόματι Ἀκύλαν, Ποντικὸν τῷ γένει, προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ διὰ τὸ ⸀διατεταχέναι Κλαύδιον χωρίζεσθαι πάντας τοὺς Ἰουδαίους ⸀ἀπὸ τῆς Ῥώμης, προσῆλθεν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/002.yaml
  text: And he found a Jew named Aquila[a], a native of Pontus, who had recently come from Italy with Priscilla his wife because Claudius had ordered all the Jews to leave Rome; and he went to them.
translation:
  language: tl
  text: At natagpuan niya ang isang Judiong nagngangalang Aquila, na tubong Ponto, na kamakailan lamang dumating mula sa Italia kasama ang asawa niyang si Priscila, sapagkat iniutos ni Claudio na umalis sa Roma ang lahat ng Judio.[a] At lumapit siya sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “palayasin mula sa Roma ang lahat ng Judio.” Mas literal na nagsasaad ang Griyego ng pagkahiwalay mula sa Roma; sa pangunahing teksto, ginamit ang likas na pananalitang “umalis sa Roma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρών
  choice: natagpuan
  rationale: Tuwirang ipinapahayag ang aorist participle bilang naunang kilos bago pinuntahan ni Pablo ang mag-asawa.
- source_word: τινα Ἰουδαῖον
  choice: isang Judio
  rationale: Tumutukoy ito sa isang indibidwal ayon sa kaniyang pagkakakilanlang etniko at panrelihiyon; likas at tuwiran sa modernong Filipino ang “isang Judio.”
- source_word: ὀνόματι Ἀκύλαν
  choice: nagngangalang Aquila
  rationale: Karaniwang Filipino na paraan ng pagpapakilala sa pangalan ng isang tao.
- source_word: Ποντικὸν τῷ γένει
  choice: tubong Ponto
  rationale: Malinaw at likas na ipinahahayag ang heograpikong pinagmulan o lugar ng kapanganakan.
- source_word: προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας
  choice: Kararating lamang nito mula sa Italia
  rationale: Pinananatili ang diwa ng kamakailang pagdating at ang resultang may kaugnayan pa sa kasalukuyang tagpo.
- source_word: καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ
  choice: kasama ang asawa niyang si Priscila
  rationale: Ipinakikitang kasama ni Aquila si Priscila sa pagdating mula sa Italia, sa likas na ayos ng Filipino.
- source_word: διὰ τὸ διατεταχέναι Κλαύδιον
  choice: sapagkat iniutos ni Claudio
  rationale: Ang διά kasama ng articular infinitive ay nagpapahayag ng sanhi, at ang διατάσσω ay tumutukoy rito sa opisyal na utos.
- source_word: χωρίζεσθαι πάντας τοὺς Ἰουδαίους ἀπὸ τῆς Ῥώμης
  choice: umalis sa Roma ang lahat ng Judio
  rationale: Likas sa Filipino at tapat sa pangunahing diwa ng pagkahiwalay o paglayo mula sa Roma, nang hindi pinatitindi agad bilang sapilitang pagpapatapon.
- source_word: προσῆλθεν αὐτοῖς
  choice: pinuntahan niya sila
  rationale: Likas na salaysay sa Filipino para sa paglapit o pagpunta ni Pablo sa mag-asawa.
theological_decisions:
- issue: Kahulugan ng Ἰουδαῖον / Ἰουδαίους
  choice: Judio / mga Judio
  alternative: taga-Judea / mga taga-Judea
  rationale: Sa kontekstong ito, ang utos ay nakatuon sa mga Judio sa Roma bilang isang bayang may etniko at panrelihiyong pagkakakilanlan, hindi lamang sa mga nagmula sa Judea.
- issue: Lakas ng χωρίζεσθαι ἀπὸ τῆς Ῥώμης
  choice: umalis sa Roma
  alternative: palayasin mula sa Roma
  rationale: Ang Griyego ay literal na nagsasaad ng pagkahiwalay mula sa Roma. Dahil utos ito ni Claudio, maaaring magpahiwatig ng pagpapaalis, ngunit hindi kailangang gawing tahasan iyon sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “Judio,” “Ponto,” “Italia,” “Priscila,” at “Claudio” bilang natural na anyong Filipino ng mga pangalan at katawagan. Hinati sa tatlong pangungusap upang maiwasan ang mabigat na mahabang kayarian habang pinananatili ang lohikal na ugnayan ng orihinal.
