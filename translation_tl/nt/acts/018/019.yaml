base_translation:
  language: en
  yaml_path: translation/nt/acts/018/019.yaml
  text: They came to Ephesus[a], and he left them there[c][b]; but he himself entered into the synagogue and reasoned with the Jews.
translation:
  language: tl
  text: Dumating sila sa Efeso,[a] at iniwan niya roon ang mga kasama niya.[b] Ngunit siya mismo ay pumasok sa sinagoga at nakipagtalakayan sa mga Judio.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Nakarating sila sa Efeso.”
    reason: lexical_alternative
  - marker: b
    text: Ang mga kasama niya ay sina Priscila at Aquila na binanggit sa naunang talata.
    reason: cross_reference
  - marker: c
    text: Maaari ring “nakipag-usap nang may pangangatuwiran” o “nakipagpalitan ng katuwiran.” Ipinahihiwatig ng Griyego ang isang pag-uusap na may paglalahad at pagsusuri ng mga katuwiran.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατήντησαν
  choice: Dumating sila
  rationale: Tumutukoy ang pandiwa sa pagdating o pag-abot sa isang destinasyon. Likas sa modernong Tagalog ang “dumating sila sa Efeso” at pinananatili nito ang pangmaramihang simuno.
- source_word: δὲ
  choice: at / Ngunit
  rationale: Mahinang pang-ugnay o panalungat ang δέ. Ang una ay ipinahayag sa “at” bilang pagpapatuloy ng salaysay; ang ikalawa ay “Ngunit” upang ipakita ang kaibahan ng pananatili ng mga kasama at ng sariling ginawa ni Pablo.
- source_word: κἀκείνους
  choice: ang mga kasama niya
  rationale: Ang anyo ay nangangahulugang “at ang mga iyon” at tumutukoy sa mga kasamang nabanggit sa naunang talata. Ginawang “mga kasama niya” upang maging malinaw at natural nang hindi inilalagay sa pangunahing teksto ang kanilang mga pangalan.
- source_word: κατέλιπεν ... αὐτοῦ
  choice: iniwan niya roon
  rationale: Ipinahahayag ng pandiwa ang pag-iwan sa isang lugar, at lokatibo ang αὐτοῦ, “doon/roon.” Magkasamang malinaw na naihahatid ng “iniwan niya roon” ang dalawang sangkap.
- source_word: αὐτὸς
  choice: siya mismo
  rationale: Mariin ang panghalip at ipinakikitang siya, bilang kaiba sa mga iniwan niyang kasama, ang pumasok sa sinagoga.
- source_word: εἰσελθὼν εἰς τὴν συναγωγήν
  choice: pumasok sa sinagoga
  rationale: Ang participle ay nagsasaad ng kilos na nauuna at kaugnay ng pangunahing pandiwa. Natural itong ipinahayag sa Tagalog bilang sunod na pandiwa.
- source_word: διελέξατο
  choice: nakipagtalakayan
  rationale: Sa konteksto ng Mga Gawa, ipinahihiwatig ng διαλέγομαι ang may katuwirang pakikipag-usap o pagpapalitan ng mga pananaw. Ang “nakipagtalakayan” ay may diwang diyalogo at hindi kailangang mangahulugang mainitang pakikipagtalo.
- source_word: τοῖς Ἰουδαίοις
  choice: sa mga Judio
  rationale: Direktang katawagang etniko at panrelihiyon ito. Hindi ito pinaliit sa “mga pinunong Judio,” sapagkat wala ang gayong pagtitiyak sa Griyego.
