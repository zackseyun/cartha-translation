  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Judio,” “sinagoga,” at “Efeso” bilang karaniwang anyong biblikal. Inilagay ang bawat pananda ng talababa kaagad pagkatapos ng salitang o pariralang tinutukoy nito.
