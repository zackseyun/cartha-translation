  text: And he drove them away from the judgment seat[a].
translation:
  language: tl
  text: At itinaboy niya sila palayo sa luklukan ng hukom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “palayo sa hukuman” o “palayo sa tribunal.” Ang salitang Griyego na βῆμα ay tumutukoy sa opisyal na luklukan o plataporma kung saan ginaganap ang pagdinig at paghatol sa isang kaso.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay na nagpapatuloy sa salaysay nang hindi nagdaragdag ng interpretasyon.
- source_word: ἀπήλασεν
  choice: itinaboy
  rationale: Ipinahihiwatig ng pandiwa ang mariin at may-awtoridad na pagpapaalis; mas tumpak ito kaysa sa mas banayad na “pinaalis” o “pinauwi.”
- source_word: αὐτοὺς
  choice: sila
  rationale: Likas na panghalip sa Filipino na hinahayaang matukoy mula sa konteksto ang mga taong tinutukoy.
- source_word: ἀπὸ τοῦ βήματος
  choice: mula sa hukuman
  rationale: Sa kontekstong ito, ang βῆμα ay ang opisyal na upuan o plataporma ng hukom at, sa pagpapalawak, ang lugar ng paglilitis. Ang “mula sa hukuman” ay natural sa modernong Filipino at malinaw na nagsasaad ng pagpapaalis sa lugar ng pagdinig.
theological_decisions: []
translation_notes:
  register: Maikli, dignified, at natural na modernong Filipino. Ginamit ang “itinaboy” upang mapanatili ang mariing kilos ng orihinal, at “hukuman” sa pangunahing teksto upang madaling maunawaan; nililinaw ng talababa ang pisikal at opisyal na diwa ng βῆμα.
