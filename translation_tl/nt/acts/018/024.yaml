base_translation:
  language: en
  yaml_path: translation/nt/acts/018/024.yaml
  text: A certain Jew named Apollos[a], an Alexandrian by birth, an eloquent man, arrived in Ephesus, being mighty in the Scriptures.
translation:
  language: tl
  text: May isang Judiong nagngangalang Apolos na dumating sa Efeso. Taga-Alejandria siya, isang lalaking mahusay magsalita[a] at bihasa sa mga Kasulatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang lalaking maalam.” Ang salitang Griego na λόγιος ay maaaring tumukoy sa kahusayan sa pagsasalita o sa pagiging maalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: Judio
  rationale: Tumutukoy ito sa etniko at relihiyosong pagkakakilanlan ni Apolos, hindi lamang sa kaniyang pinagmulang lugar.
- source_word: δέ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang panandang pasalaysay ito. Sapat na sa natural na Tagalog ang pagsisimula ng bagong pangungusap nang walang tahasang “ngayon” o “ngunit.”
- source_word: τις
  choice: may isang
  rationale: Natural nitong pinananatili ang bahagyang di-tiyak na pagpapakilala sa isang bagong tauhan.
- source_word: Ἀπολλῶς ὀνόματι
  choice: na nagngangalang Apolos
  rationale: Karaniwan at malinaw na paraan ito ng pagpapakilala ng pangalan sa makabagong Tagalog.
- source_word: Ἀλεξανδρεὺς τῷ γένει
  choice: tubong Alejandria
  rationale: Ipinahahayag nito nang natural ang pinagmulan o lugar ng kapanganakan nang hindi ipinapasok ang makabagong konsepto ng lahi.
- source_word: ἀνὴρ λόγιος
  choice: mahusay siyang magsalita
  rationale: Ang λόγιος ay maaaring tumukoy sa kahusayan sa pagsasalita o sa pagiging maalam. Pinili sa teksto ang unang diwa at pinanatili sa talababa ang tunay na alternatibo.
- source_word: κατήντησεν εἰς Ἔφεσον
  choice: dumating siya sa Efeso
  rationale: Direkta at likas na salin ng pagdating sa tinutukoy na destinasyon.
- source_word: δυνατὸς ὢν ἐν ταῖς γραφαῖς
  choice: lubos na bihasa sa mga Kasulatan
  rationale: Ipinahahayag nito ang matinding kakayahan at malalim na kaalaman ni Apolos tungkol sa mga sagradong Kasulatan sa natural na Tagalog.
