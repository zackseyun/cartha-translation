id: ACT.18.22
reference: Acts 18:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ κατελθὼν εἰς Καισάρειαν, ἀναβὰς καὶ ἀσπασάμενος τὴν ἐκκλησίαν, κατέβη εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/022.yaml
  text: And after going down to Caesarea[a], he went up and greeted the church, then went down to Antioch.
translation:
  language: tl
  text: Pagkababa niya sa Cesarea, umakyat siya at binati ang iglesya,[a] at pagkatapos ay bumaba siya patungong Antioquia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na ang tinutukoy ay ang iglesya sa Jerusalem. Tahasang binabanggit ng maraming salin ang Jerusalem dito, ngunit hindi ito pinangalanan sa tekstong Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: κατελθὼν
  choice: Pagkababa niya
  rationale: Ipinahahayag ang naunang kilos ng aorist participle at pinananatili ang direksiyonal na pananalita ni Lucas.
- source_word: Καισάρειαν
  choice: Cesarea
  rationale: Karaniwang makabagong baybay sa Filipino para sa pangalang-lugar; ang Cesarea sa baybayin ang nauunawaan sa konteksto.
- source_word: ἀναβὰς
  choice: umakyat siya
  rationale: Pinananatili ang direksiyonal na kahulugan nang hindi tahasang idinaragdag ang Jerusalem, na hindi pinangalanan sa Griyego.
- source_word: ἀσπασάμενος
  choice: binati
  rationale: Tuwirang salin ng pandiwang tumutukoy sa pagbati, at hindi ito dinaragdagan ng ideya ng mas mahabang pagdalaw.
- source_word: τὴν ἐκκλησίαν
  choice: ang iglesya
  rationale: Natural at karaniwang katawagan sa Filipino para sa pamayanang Kristiyano sa kontekstong ito.
- source_word: κατέβη
  choice: bumaba siya patungong
  rationale: Pinananatili ang direksiyonal at topograpikong pananalita ng salaysay habang natural na ipinapakita ang patutunguhan.
- source_word: Ἀντιόχειαν
  choice: Antioquia
  rationale: Karaniwang anyong Filipino ng pangalan; ang Antioquia sa Siria ang malinaw na tinutukoy sa konteksto, ngunit hindi kailangang idagdag ang “sa Siria” sa pangunahing teksto.
theological_decisions:
- issue: Kung dapat tukuyin bilang Jerusalem ang di-binanggit na patutunguhan ng “umakyat siya”
  choice: Hindi tahasang pinangalanan ang patutunguhan sa pangunahing teksto.
  alternative: Isaling “umakyat siya sa Jerusalem.”
  rationale: Mahigpit na ipinahihiwatig ng pagkakasunod-sunod ng paglalakbay at ng pagbati sa iglesya na Jerusalem ang tinutukoy, ngunit hindi ito pinangalanan sa tekstong Griyego. Kaya pinananatili sa salin ang tunay na pagkaipinahiwatig lamang at inilalagay sa talababa ang malamang na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkakasunod na “bumaba—umakyat—bumaba” upang maipakita ang topograpikong paraan ng pagsasalaysay ni Lucas; inilagay ang pananda ng talababa pagkatapos ng “iglesya” upang maiugnay ito sa malamang na iglesya sa Jerusalem.
