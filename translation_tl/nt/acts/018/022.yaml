  source_fidelity: 'Tapat ang salin sa pagkakasunod at direksiyonal na wika ng Griyego: bumaba sa Cesarea, umakyat at bumati sa iglesya, saka bumaba patungong Antioquia. Wala itong idinagdag na ‘Jerusalem’ sa pangunahing teksto, kaya napananatili ang hindi tahasang binanggit na patutunguhan ng ἀναβὰς.'
  naturalness: Natural, malinaw, at angkop sa modernong Filipino ang “Pagkababa niya sa Cesarea,” “umakyat siya at binati ang iglesya,” at “bumaba siya patungong Antioquia.” Maayos ding naipapakita ng pag-uulit ng bumaba/umakyat ang estilo ng salaysay.
