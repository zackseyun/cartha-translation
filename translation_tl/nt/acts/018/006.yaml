  text: ἀντιτασσομένων δὲ αὐτῶν καὶ βλασφημούντων ἐκτιναξάμενος τὰ ἱμάτια εἶπεν πρὸς αὐτούς· Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν· καθαρὸς ἐγώ· ἀπὸ τοῦ νῦν εἰς τὰ ἔθνη πορεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/006.yaml
  text: But when they opposed and reviled him, he shook out his garments and said to them, “Your blood be on your own heads. I am innocent. From now on I will go to the Gentiles.”
translation:
  language: tl
  text: Ngunit nang salungatin nila at magsalita sila nang mapanlait,[a] ipinagpag niya ang kanyang mga damit at sinabi sa kanila, “Ang inyong dugo ay mapasa inyong sariling mga ulo.[b] Wala akong pananagutan. Mula ngayon, pupunta ako sa mga Hentil.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mamusong.” Ang pandiwang Griyego ay maaaring tumukoy sa pamumusong o sa mapanlait at mapang-abusong pananalita.
    reason: lexical_alternative
  - marker: b
    text: Ang “Ang inyong dugo ay mapasa inyong sariling mga ulo” ay isang idyomang nangangahulugang sila mismo ang mananagot sa mga ibubunga nito.
    reason: cultural_note
  - marker: c
    text: Maaari ring “sa mga bansa”; sa kontekstong ito, tumutukoy ito sa mga hindi Judio.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιτασσομένων
  choice: salungatin
  rationale: Ipinahahayag ng pandiwari ang aktibo at matinding pagsalungat sa ipinangangaral ni Pablo; natural at tuwiran ang “salungatin” sa makabagong Tagalog.
- source_word: βλασφημούντων
  choice: magsalita nang mapanlait
  rationale: Maaaring tumukoy ang pandiwa sa pamumusong o mapang-abusong pananalita. Hindi tahasang binabanggit sa Griyego kung sino ang tuwirang nilalait, kaya hindi ito dinagdagan ng “siya”; pinananatili sa talababa ang alternatibong “mamusong.”
- source_word: ἐκτιναξάμενος τὰ ἱμάτια
  choice: ipinagpag niya ang kanyang mga damit
  rationale: Malapit ito sa simbolikong kilos na inilalarawan ng Griyego at likas na nauunawaan sa Tagalog bilang paghiwalay ng sarili sa pananagutan.
- source_word: Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν
  choice: Ang inyong dugo ay mapasa inyong sariling mga ulo
  rationale: Pinananatili ang maringal at hudisyal na idyoma, pati ang pangmaramihang “mga ulo,” sa halip na ipalit agad ang paliwanag nito.
- source_word: καθαρὸς ἐγώ
  choice: Wala akong pananagutan
  rationale: 'Metaporikal dito ang “malinis”: ipinahahayag ni Pablo na hindi na siya mananagot sa magiging bunga ng kanilang pagtanggi. Mas malinaw ito kaysa sa literal na “malinis ako.”'
- source_word: ἀπὸ τοῦ νῦν
  choice: Mula ngayon
  rationale: Natural na pariralang temporal na nagpapahiwatig ng isang tiyak na pagbabago sa direksiyon ng gawain ni Pablo.
- source_word: εἰς τὰ ἔθνη
  choice: sa mga Hentil
  rationale: Sa kontekstong salungat sa mga tagapakinig sa sinagoga, tumutukoy ang ἔθνη sa mga hindi Judio; pinananatili sa talababa ang mas literal na “mga bansa.”
- source_word: πορεύσομαι
  choice: pupunta ako
  rationale: Tuwiran at natural na salin ng hinaharap na kilos at layunin ni Pablo.
theological_decisions:
- issue: Pormula ng pananagutan sa “Ang inyong dugo ay mapasa inyong sariling mga ulo”
  choice: Isang taimtim na pahayag na sila ang mananagot sa mga bunga ng kanilang pagtanggi, hindi si Pablo.
  alternative: Isang sumpa na hinihiling ni Pablo na sumapit sa kanila.
  rationale: Kaayon ito ng biblikal na pananalita tungkol sa dugo at pananagutan ng bantay. Pinananatili ng salin ang idyoma at bigat nito nang hindi ito ginagawang mas matinding sumpa kaysa sa hinihingi ng teksto.
- issue: Di-tahasang layon ng βλασφημούντων
  choice: Hindi tinukoy sa pangunahing teksto kung si Pablo, ang kanyang mensahe, o ang Diyos ang tuwirang nilalait.
  alternative: “Nilait nila siya” o “namusong sila.”
  rationale: Walang nakasaad na layon sa Griyego. Ang “magsalita nang mapanlait” ay nagpapanatili ng saklaw at kalabuan ng pandiwa, habang binabanggit sa talababa ang posibilidad na “mamusong.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang solemneng idyoma tungkol sa dugo at mga ulo, ngunit isinalin ang καθαρὸς ἐγώ ayon sa kahulugang pananagutan upang maiwasan ang maling pakahulugang pisikal o ritwal na kalinisan.
