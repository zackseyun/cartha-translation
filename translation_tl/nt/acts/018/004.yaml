base_translation:
  language: en
  yaml_path: translation/nt/acts/018/004.yaml
  text: And he was reasoning in the synagogue every Sabbath and persuading Jews and Greeks[a][b][c].
translation:
  language: tl
  text: Tuwing Sabbath, nakikipagtalakayan siya[a] sa sinagoga at hinihikayat[b] ang mga Judio at mga Griego.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nangangatwiran” o “nakikipagtalo.” Ang pandiwang Griyego ay maaaring tumukoy sa makatuwirang pag-uusap, pagtalakay, o pangangatwiran.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sinisikap niyang hikayatin.” Ipinahihiwatig ng anyo ng pandiwa ang nagpapatuloy o paulit-ulit na pagkilos, hindi kinakailangang ang lubos na tagumpay nito.
    reason: lexical_alternative
  - marker: c
    text: Maaaring tumukoy ito sa mga Griegong kaugnay ng sinagoga; mas malawak naman itong inuunawa ng ilan bilang “mga Hentil.”
    reason: alternative_reading
lexical_decisions:
- source_word: διελέγετο
  choice: nakikipagpalitan siya ng katuwiran
  rationale: Ipinahahayag ang paulit-ulit na makatuwirang pagtalakay o pangangatuwiran na maaaring may kasamang pagtatalo, habang pinananatili ang diyalogong pahiwatig ng pandiwa.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang pang-ugnay lamang ito sa daloy ng salaysay; sapat na sa natural na Tagalog ang pagsisimula sa pariralang pamanahon.
- source_word: ἐν τῇ συναγωγῇ
  choice: sa sinagoga
  rationale: Tuwirang lokatibong salin na likas sa Tagalog.
- source_word: κατὰ πᾶν σάββατον
  choice: tuwing Sabbath
  rationale: Malinaw na ipinahahayag ang distributibo at paulit-ulit na kilos sa bawat Sabbath.
- source_word: ἔπειθέν
  choice: hinihikayat
  rationale: Pinananatili ang patuloy na pagsisikap na makahikayat nang hindi tiyak na sinasabing nagtagumpay siya sa lahat ng kausap.
- source_word: τε
  choice: at
  rationale: Likas na inuugnay ang ikalawang kilos sa nauna.
- source_word: Ἰουδαίους
  choice: mga Judio
  rationale: Karaniwang modernong katawagan sa pangkat etnorelihiyoso sa kontekstong ito.
- source_word: Ἕλληνας
  choice: mga Griego
  rationale: Pinananatili ang espesipikong katawagan ng Griyego sa halip na palawakin agad bilang mga Hentil.
theological_decisions:
- issue: Pagkakakilanlan ng Ἕλληνας sa konteksto ng sinagoga
  choice: mga Griego
  alternative: mga Hentil; mga Griegong may takot sa Diyos
  rationale: “Mga Griego” mismo ang sinasabi ng talata. Maaaring kaugnay sila ng sinagoga, ngunit hindi sila tahasang tinatawag dito na mga may takot sa Diyos.
- issue: Bunga ng ἔπειθέν
  choice: hinihikayat
  alternative: kinukumbinsi; sinisikap hikayatin
  rationale: Ang aspektong imperpekto ay nagpapakita ng nagpapatuloy o paulit-ulit na pagkilos, ngunit hindi dapat sapilitang ipakahulugan na tiyak ang tagumpay o tahasang idagdag na pagtatangka lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “nakikipagpalitan ng katuwiran” upang mapanatili ang makatuwiran at interaktibong katangian ng διελέγετο, at “hinihikayat” upang maiwasang igiit na laging matagumpay ang panghihikayat.
