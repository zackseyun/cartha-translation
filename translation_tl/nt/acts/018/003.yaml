  text: And because he was of the same trade[a], he stayed with them and worked, for they were tentmakers by trade.
translation:
  language: tl
  text: At dahil kapareho niya ang kanilang hanapbuhay, nanatili siya sa kanila at nagtrabaho, sapagkat gumagawa sila ng mga tolda bilang hanapbuhay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring tumukoy sa mga manggagawa sa katad; maaaring mas malawak ang saklaw ng salitang Griyego kaysa sa paggawa lamang ng tolda.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ ὁμότεχνον εἶναι
  choice: dahil iisa ang kanilang hanapbuhay
  rationale: Ang διά na sinusundan ng articular infinitive ay nagsasaad ng dahilan. Ang ὁμότεχνος ay tumutukoy sa pagkakaroon ng kaparehong hanapbuhay o kasanayan; malinaw at natural sa Tagalog ang “iisa ang kanilang hanapbuhay.”
- source_word: ἔμενεν παρ’ αὐτοῖς
  choice: tumuloy siya sa kanila
  rationale: Sa kontekstong ito, ang μένω παρά ay nagpapahiwatig na nanirahan o nakituloy si Pablo kina Aquila at Priscila. Ang “tumuloy sa kanila” ay likas na salitang Filipino para sa pansamantalang paninirahan sa tahanan ng iba.
- source_word: ἠργάζετο
  choice: nagtrabaho
  rationale: Ang ἐργάζομαι ay tumutukoy rito sa paggawa sa kanilang hanapbuhay. Sapat na ipinahahayag ng “nagtrabaho” ang patuloy na gawain sa daloy ng salaysay.
- source_word: σκηνοποιοὶ
  choice: paggawa ng mga tolda
  rationale: Ang pinakakaraniwan at malamang na kahulugan ng σκηνοποιός ay gumagawa ng tolda. Ginawang pariralang tumutukoy sa hanapbuhay upang maging natural sa Filipino habang pinananatili ang tiyak na uri ng gawain.
- source_word: τῇ τέχνῃ
  choice: ang hanapbuhay nila ay
  rationale: Ang τέχνη ay kasanayan, gawain, o hanapbuhay. Inilalahad ng dative phrase na ito kung ano ang kanilang propesyon, kaya malinaw itong naipahayag sa ganitong ayos.
