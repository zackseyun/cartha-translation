  register: Gumamit ng modernong, malinaw, at marangal na Filipino. Pinanatili ang ugnayang sanhi at ang pag-uulit tungkol sa hanapbuhay na nasa Griyego, ngunit inayos ito sa likas na balangkas ng Tagalog.
