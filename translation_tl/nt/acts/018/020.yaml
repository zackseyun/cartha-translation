  text: ἐρωτώντων δὲ αὐτῶν ἐπὶ πλείονα χρόνον ⸀μεῖναι οὐκ ἐπένευσεν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/020.yaml
  text: But when they asked him to stay for a longer time[a], he did not consent,
translation:
  language: tl
  text: Ngunit nang hilingin nilang manatili siya nang mas matagal, hindi siya pumayag,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi siya sumang-ayon” o “tinanggihan niya ang kahilingan.” Ang pandiwang Griyego ay nangangahulugang sumang-ayon o pumayag sa isang kahilingan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτώντων
  choice: nang hilingin
  rationale: Ang kasalukuyang participle sa genitive absolute ay likas na isinalin bilang sugnay na panahunan. Sa konteksto, ang pandiwa ay tumutukoy sa isang pakiusap, kaya mas angkop ang “hilingin” kaysa sa payak na “tanungin.”
- source_word: δὲ
  choice: Ngunit
  rationale: 'Nagpapakita ito ng banayad na pagsalungat: hiniling nilang manatili siya, ngunit hindi niya pinagbigyan ang kahilingan.'
- source_word: αὐτῶν
  choice: nila / siya
  rationale: Ang αὐτῶν ay tumutukoy sa mga taga-Efeso na humihiling; nililinaw ng natural na balarilang Tagalog ang tagaganap at ang tinutukoy nilang manatili.
- source_word: ἐπὶ πλείονα χρόνον
  choice: nang mas matagal
  rationale: Natural na pariralang Tagalog ito para sa isang pinahabang panahon at pinananatili ang pahambing na diwa ng πλείονα.
- source_word: μεῖναι
  choice: manatili
  rationale: Tuwirang ipinapahayag ang pananatili sa isang lugar at angkop sa marangal na salaysay.
- source_word: οὐκ ἐπένευσεν
  choice: hindi siya pumayag
  rationale: Ang ἐπινεύω ay nangangahulugang pagsang-ayon o pagpayag sa isang kahilingan. Ang “hindi siya pumayag” ay natural at hindi kasingdiin ng “tumanggi siya.”
theological_decisions: []
