  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hilingin” upang ipakita na pakiusap ang ἐρωτάω sa konteksto, at “hindi siya pumayag” upang mapanatili ang diing hindi labis na matindi ng orihinal.
