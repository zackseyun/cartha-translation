  text: but after taking leave and saying[a], “I will return to you again[b], if God wills,” he set sail from Ephesus.
translation:
  language: tl
  text: Ngunit, matapos magpaalam, sinabi niya[a], “Muli akong babalik sa inyo, kung loloobin ng Diyos,” at naglayag siya mula sa Efeso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, wala ang “at sinabi, ‘Muli akong babalik sa inyo, kung loloobin ng Diyos.’”
    reason: textual_variant
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Ipinakikita ang pagsalungat sa naunang pakiusap na manatili pa siya; likas at marangal na pang-ugnay sa Filipino.
- source_word: ἀποταξάμενος
  choice: matapos magpaalam
  rationale: Inihahayag ng aorist middle participle ang pagpapaalam bago ang paglalayag at pinananatili ang pagkakasunod ng mga kilos.
- source_word: καὶ εἰπών
  choice: at magsabi
  rationale: Pinananatili ang ikalawang participle na kaagapay ng pagpapaalam, sa natural na anyong Filipino.
- source_word: Πάλιν ἀνακάμψω πρὸς ὑμᾶς
  choice: Babalik akong muli sa inyo
  rationale: Tuwirang ipinahahayag ang hinaharap na pagbabalik; pinananatili ng “muli” ang πάλιν bagaman may bahagyang likas na pag-uulit kasama ng “babalik.”
- source_word: τοῦ θεοῦ θέλοντος
  choice: kung loloobin ng Diyos
  rationale: Ang genitive absolute ay nagpapahayag na nakasalalay ang plano sa kalooban ng Diyos; malinaw at karaniwang pahayag ito sa modernong Filipino.
- source_word: ἀνήχθη
  choice: naglayag siya
  rationale: Sa salaysay ng paglalakbay, ang pandiwa ay may tiyak na pandagat na diwang umalis sakay ng barko.
- source_word: ἀπὸ τῆς Ἐφέσου
  choice: mula sa Efeso
  rationale: Karaniwang pagpapahayag ng pinanggalingang lugar at kumbensiyonal na anyong Filipino ng pangalan ng lungsod.
theological_decisions:
- issue: Pagpapahayag ng kalooban ng Diyos kaugnay ng plano ni Pablo
  choice: kung loloobin ng Diyos
  alternative: kung nanaisin ng Diyos; sa kalooban ng Diyos
  rationale: Tahasang Diyos (θεοῦ), hindi Panginoon, ang nasa tekstong Griyego. Pinananatili rin ang pagiging nakasalalay ng plano sa banal na kalooban nang hindi ito ginagawang tiyak na pangako.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “magpaalam,” “babalik,” at “naglayag” bilang mga karaniwang salitang madaling maunawaan, habang pinananatili ang kondisyunal na diwa ng plano ni Pablo.
