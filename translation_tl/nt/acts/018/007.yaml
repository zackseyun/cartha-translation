id: ACT.18.7
reference: Acts 18:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ μεταβὰς ἐκεῖθεν ⸀εἰσῆλθεν εἰς οἰκίαν τινὸς ὀνόματι ⸀Τιτίου Ἰούστου σεβομένου τὸν θεόν, οὗ ἡ οἰκία ἦν συνομοροῦσα τῇ συναγωγῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/007.yaml
  text: And after leaving there[a], he entered the house of a man named Titius Justus, who worshiped God[b], whose house was next to the synagogue.
translation:
  language: tl
  text: At pag-alis niya roon, pumasok siya sa bahay ng isang lalaking nagngangalang Titius Justus, na sumasamba sa Diyos,[a] at ang bahay nito ay katabi ng sinagoga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “may takot sa Diyos” o “isang sumasamba sa Diyos.” Ang pariralang Griyego ay maaaring tumukoy sa isang Hentil na deboto sa Diyos ng Israel.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nakadugtong sa” o “magkahangganan sa” sinagoga.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: pag-alis niya roon
  rationale: Likas sa modernong Tagalog at malinaw na ipinahahayag ang paglayo mula sa naunang lugar bago ang pangunahing kilos.
- source_word: εἰσῆλθεν εἰς οἰκίαν τινὸς
  choice: pumasok siya sa bahay ng isang lalaki
  rationale: Tuwirang inililipat ang kilos at ang di-tiyak na pagtukoy sa may-ari ng bahay.
- source_word: ὀνόματι Τιτίου Ἰούστου
  choice: nagngangalang Titius Justus
  rationale: Karaniwang pormula sa Tagalog para sa ὀνόματι na sinusundan ng pangalang pantangi; pinananatili ang transliterasyon ng pangalan.
- source_word: σεβομένου τὸν θεόν
  choice: na sumasamba sa Diyos
  rationale: Malinaw at likas na paglalarawan sa debosyon niya sa Diyos ng Israel nang hindi ginagawang tahasang teknikal na katawagan ang parirala.
- source_word: οὗ ἡ οἰκία
  choice: at ang bahay nito
  rationale: Iniiwasan ang mabigat at malabong sunod-sunod na sugnay na may 'na' habang malinaw na si Titius Justus ang tinutukoy.
- source_word: συνομοροῦσα
  choice: katabi
  rationale: Maikli at natural na nagpapahayag ng magkadugtong o magkahangganang lokasyon; inilalahad sa talababa ang mas tiyak na posibilidad.
- source_word: συναγωγῇ
  choice: sinagoga
  rationale: Pamantayan at madaling maunawaang katawagan sa kontekstong Judio.
theological_decisions:
- issue: Paglalarawan kay Titius Justus bilang σεβόμενος τὸν θεόν
  choice: na sumasamba sa Diyos
  alternative: na may takot sa Diyos; isang sumasamba sa Diyos
  rationale: Ipinahahayag ng Griyego ang debosyon niya sa Diyos ng Israel, ngunit hindi hinihingi ng talata na gawing teknikal na kategoryang panlipunan o panrelihiyon ang parirala.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “katabi” sa pangunahing teksto para sa natural na daloy, habang pinananatili sa talababa ang mas tiyak na diwa ng pagkakadugtong o pagkakaroon ng iisang hangganan.
