  text: ⸀Μετὰ ταῦτα ⸀χωρισθεὶς ἐκ τῶν Ἀθηνῶν ἦλθεν εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/001.yaml
  text: After this[a], he left Athens and went to Corinth.
translation:
  language: tl
  text: Pagkatapos nito[a], umalis siya sa Atenas at pumunta sa Corinto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na salin, “Pagkatapos ng mga bagay na ito, pag-alis niya mula sa Atenas, pumunta siya sa Corinto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Pagkatapos nito
  rationale: Likas na panandang temporal sa makabagong Tagalog at pinananatili ang pagkakasunod-sunod ng salaysay; maaari ring mas pormal na isaling “Pagkatapos ng mga bagay na ito.”
- source_word: χωρισθεὶς
  choice: umalis siya
  rationale: Bagaman anyong aorist passive participle, idyomatiko rito ang diwang pag-alis mula sa isang lugar. Malinaw at natural sa Tagalog ang “umalis siya.”
- source_word: ἐκ τῶν Ἀθηνῶν
  choice: sa Atenas
  rationale: Kasama ng pandiwang “umalis,” natural na ipinahahayag sa Tagalog ang pinanggalingang lugar sa pamamagitan ng “sa,” na katumbas ng diwa ng ἐκ na “mula sa.”
- source_word: ἦλθεν
  choice: pumunta
  rationale: Bagaman maaaring mangahulugang “dumating” o “pumaroon,” ang “pumunta” ang natural na paglalarawan ng paglalakbay patungo sa ibang lungsod mula sa pananaw ng salaysay.
- source_word: εἰς Κόρινθον
  choice: sa Corinto
  rationale: Ipinahihiwatig ng εἰς ang patutunguhan; karaniwang Tagalog ang “pumunta sa Corinto.”
