  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Atenas” at “Corinto,” ang karaniwang anyong Filipino ng mga pangalan ng lungsod. Pinanatili ang talababa upang maipakita ang mas pormal na anyo ng pariralang Griyego at ng participle.
