  text: μέλλοντος δὲ τοῦ Παύλου ἀνοίγειν τὸ στόμα εἶπεν ὁ Γαλλίων πρὸς τοὺς Ἰουδαίους· Εἰ ⸀μὲν ἦν ἀδίκημά τι ἢ ῥᾳδιούργημα πονηρόν, ὦ Ἰουδαῖοι, κατὰ λόγον ἂν ἀνεσχόμην ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/014.yaml
  text: But as Paul was about to open his mouth[a], Gallio said to the Jews, “If it were some wrongdoing or a serious crime, O Jews[c][b], I would reasonably put up with you.
translation:
  language: tl
  text: Ngunit nang magsasalita na sana si Pablo[a], sinabi ni Galio sa mga Judio, “Kung ito sana ay isang paglabag o masamang gawaing kriminal[b], mga Judio, makatuwiran lamang na pagtiisan ko kayo[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang bubuksan na sana ni Pablo ang kanyang bibig.” Literal sa Griyego ang “buksan ang bibig,” isang idyoma para sa pagsisimulang magsalita.
    reason: lexical_alternative
  - marker: b
    text: O “buktot na krimen” o “masamang gawaing kriminal.” Pinagsasama ng pariralang Griyego ang salitang tumutukoy sa kriminal na asal at ang pang-uring nangangahulugang “masama” o “buktot.”
    reason: lexical_alternative
  - marker: c
    text: O “makatuwiran lamang na pagbigyan ko kayo.” Sa konteksto, ipinahihiwatig ni Galio na may sapat siyang dahilan upang pagtiisan at pakinggan ang kanilang reklamo kung ito ay tunay na paglabag o gawaing kriminal.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλοντος ... τοῦ Παύλου ἀνοίγειν τὸ στόμα
  choice: nang bubuksan na sana ni Pablo ang kanyang bibig
  rationale: Ipinapakita ng genitive absolute na malapit nang magsalita si Pablo. Pinananatili ng salin ang Griyegong idyomang “buksan ang bibig,” habang ipinahihiwatig ng “na sana” na hindi siya nakapagsimula dahil naunang nagsalita si Galio.
- source_word: δὲ
  choice: Ngunit
  rationale: 'Nagpapakita ito ng banayad na pagsalungat sa takbo ng salaysay: magsasalita na sana si Pablo, ngunit nauna si Galio.'
- source_word: Γαλλίων
  choice: Galio
  rationale: Isinalin ang pangalang pantangi ayon sa natural at karaniwang transliterasyon sa Filipino.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: sa mga Judio
  rationale: Tuwirang pinananatili ang tinutukoy ng Griyego nang hindi idinaragdag ang interpretatibong “mga nagsakdal na Judio.”
- source_word: Εἰ μὲν ἦν
  choice: Kung tungkol sana ito
  rationale: Natural na ipinahahayag sa Filipino ang kondisyong ipinapalagay na salungat sa aktuwal na kalagayan. Hindi hiwalay na isinalin ang μέν sapagkat nagsisilbi itong paghahanda sa kasunod na paghahambing.
- source_word: ἀδίκημά τι
  choice: anumang paglabag
  rationale: Sinasaklaw ng “paglabag” ang legal na pagkakasala o ginawang mali nang hindi labis na tinutukoy ang uri nito.
- source_word: ῥᾳδιούργημα πονηρόν
  choice: masamang krimen
  rationale: Pinananatili nito kapuwa ang kriminal at moral na bigat ng parirala; iniiwasan ang mas interpretatibong “malubhang krimen,” sapagkat ang πονηρόν ay pangunahing nangangahulugang masama o buktot.
- source_word: ὦ Ἰουδαῖοι
  choice: mga Judio
  rationale: Natural na tuwirang tawag ito sa Filipino. Hindi kailangang tumbasan nang hiwalay ang ὦ ng artipisyal o makalumang “O.”
- source_word: κατὰ λόγον
  choice: makatuwiran lamang
  rationale: Ipinahahayag nito na may wastong batayan si Galio na pagbigyan ang reklamo kung tunay na usaping kriminal iyon.
- source_word: ἀνεσχόμην ὑμῶν
  choice: pagtiisan ko kayo
  rationale: Pinananatili ang bahagyang mapanuyang tono ng ἀνέχομαι, na maaaring mangahulugang magtiis o magpasensiya sa isang tao, sa halip na gawing tahasang “dinggin ang inyong kaso.”
