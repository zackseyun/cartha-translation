  naturalness: 'May ilang di-likas na anyo ang draft: “nang bubuksan na sana ni Pablo ang kanyang bibig” ay hindi karaniwang paraan ng pagpapahayag sa modernong Filipino, at “Kung tungkol sana ito sa” ay parehong hindi natural at nagbabago ng sintaksis. Mas malinaw ang binagong teksto.'
  terminology: Ang “mga Judio,” “paglabag,” at “pagtiisan ko kayo” ay angkop. Pinalitan ang “masamang krimen,” na medyo paulit-ulit at di-likas sa Filipino, ng “masamang gawaing kriminal,” na pinananatili ang kriminal at masamang katangian ng ῥᾳδιούργημα πονηρόν.
