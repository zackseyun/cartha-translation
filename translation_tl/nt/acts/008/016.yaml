  text: ⸀οὐδέπω γὰρ ἦν ἐπ’ οὐδενὶ αὐτῶν ἐπιπεπτωκός, μόνον δὲ βεβαπτισμένοι ὑπῆρχον εἰς τὸ ὄνομα τοῦ ⸀κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/016.yaml
  text: For he had not yet fallen upon any of them[b][a]; they had only been baptized into the name of the Lord Jesus.
translation:
  language: tl
  text: Sapagkat hindi pa bumaba ang Banal na Espiritu sa sinuman sa kanila[a]; nabautismuhan lamang sila sa pangalan ng Panginoong Jesus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “hindi pa dumating sa sinuman sa kanila.”
    reason: lexical_alternative
  - marker: b
    text: O, mas literal, “nabautismuhan lamang sila tungo sa pangalan ng Panginoong Jesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέπω
  choice: hindi pa
  rationale: Likas at malinaw na katumbas sa modernong Tagalog ng temporal na diwa na hindi pa nangyayari hanggang sa puntong iyon.
- source_word: ἐπ’ οὐδενὶ αὐτῶν
  choice: sa sinuman sa kanila
  rationale: Ipinapahayag ang pagdating sa mga tao at natural na kaagapay ng pandiwang “bumababa” sa Tagalog.
- source_word: ἐπιπεπτωκός
  choice: bumababa
  rationale: Pinananatili ang larawang mula sa ἐπιπίπτω habang ginagamit ang natural na pananalita sa Tagalog para sa pagdating ng Espiritu sa isang tao; ang ganap na aspekto ay naihahatid ng “hindi pa.”
- source_word: μόνον
  choice: lamang
  rationale: Malinaw na minamarkahan ang limitasyon at kaibahan sa naunang sugnay.
- source_word: βεβαπτισμένοι ὑπῆρχον
  choice: nabautismuhan sila
  rationale: Natural na Tagalog para sa naunang naganap na bautismo at sa kalagayang bunga nito.
- source_word: εἰς τὸ ὄνομα
  choice: sa pangalan
  rationale: Ito ang malinaw at karaniwang idyomatikong anyo sa Tagalog; inilalagay sa talababa ang mas literal na “tungo sa pangalan.”
- source_word: κυρίου Ἰησοῦ
  choice: Panginoong Jesus
  rationale: Natural na anyo sa Tagalog ng titulo at pangalang κύριος Ἰησοῦ.
theological_decisions:
- issue: Di-binanggit na simuno ng ἐπιπεπτωκός
  choice: Tahasan itong tinukoy bilang “ang Banal na Espiritu,” batay sa agarang konteksto ng talata 15.
  alternative: Gumamit ng panghalip na “siya” o iwang di-tahasan ang simuno.
  rationale: Hindi likas at maaaring malabo ang panghalip sa Tagalog, samantalang malinaw na ang Banal na Espiritu ang tinutukoy sa naunang talata. Hindi nito dinaragdagan ang teolohikal na nilalaman.
- issue: Pananalita tungkol sa bautismo εἰς τὸ ὄνομα
  choice: “sa pangalan ng Panginoong Jesus” sa pangunahing teksto
  alternative: “tungo sa pangalan ng Panginoong Jesus”
  rationale: Pinipili ang natural na idyoma sa Tagalog nang hindi pinagpapasiyahan ang mga susunod na pagtatalong doktrinal tungkol sa pormula o bisa ng bautismo; pinananatili sa talababa ang mas literal na direksiyonal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bumababa” upang mapanatili ang larawan ng pagdating mula sa itaas nang hindi maging matigas ang literal na “nahuhulog.” Ang mga marker na [a] at [b] ay inilagay kaagad pagkatapos ng mga pariralang tinutukoy ng bawat talababa.
