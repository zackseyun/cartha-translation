  rationale: Pinalitan ang di-ganap na “bumababa” ng perpektibong “bumaba” upang maipahayag ang ἐπιπεπτωκός at ang temporal na “hindi pa” nang mas tumpak at natural. Iniayon din ang aspekto ng talababa a sa pangunahing teksto. Walang binago sa kahulugan, sa pagtukoy sa Banal na Espiritu mula sa konteksto, o sa maingat na idyomatikong pagsasalin ng bautismo “sa pangalan.”
