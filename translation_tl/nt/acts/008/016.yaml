  source_fidelity: Ang tahasang “ang Banal na Espiritu” ay wastong pagtukoy sa di-binanggit na simuno mula sa agarang konteksto (v. 15). Gayunman, ang “hindi pa bumababa” ay di-ganap/imperfective at mas madaling mangahulugang hindi pa siya kasalukuyang bumababa. Ang perpektong ἐπιπεπτωκός, na may οὐδέπω, ay mas tumpak na maipahahayag ng “hindi pa bumaba.” Ang “nabautismuhan lamang sila” ay angkop na naghahayag ng naunang bautismo bilang tanging karanasang binibigyang-diin sa sugnay.
  naturalness: Natural at marangal ang pangunahing balangkas. Mas idiomatiko at malinaw sa modernong Filipino ang perpektibong “hindi pa bumaba” sa kontekstong ito. Ang “sa pangalan” ay ang karaniwang natural na katumbas sa Tagalog ng idyomang bautismal na εἰς τὸ ὄνομα; ang literal na direksiyonal na alternatibo ay maaaring manatili sa talababa.
  terminology: Ang “Banal na Espiritu,” “nabautismuhan,” at “Panginoong Jesus” ay angkop at pare-pareho ang rehistro. Hindi pinipilit ng salin ang anumang kasunod na doktrina tungkol sa bautismo.
