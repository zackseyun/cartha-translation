base_translation:
  language: en
  yaml_path: translation/nt/acts/008/029.yaml
  text: Then the Spirit said to Philip[a], “Go over and join this chariot.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng Espiritu kay Felipe, “Lumapit ka at sumabay[a] sa karwaheng ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Lumapit ka at manatili kang malapit sa karwaheng ito.”
    reason: Pinananatili ng alternatibo ang mas literal na diwa ng κολλήθητι bilang pagdikit o pananatiling malapit.
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Pagkatapos, sinabi
  rationale: Ang δέ ay nagsusulong ng salaysay at hindi nagpapahiwatig ng matinding pagsalungat; natural na ipinahahayag ito ng “Pagkatapos” sa konteksto. Ang εἶπεν ay payak na “sinabi.”
- source_word: τὸ πνεῦμα
  choice: ang Espiritu
  rationale: Sa konteksto ng Mga Gawa, tumutukoy ito sa Espiritu Santo, ngunit pinananatili ng salin ang kawalan ng ἅγιον sa mismong parirala.
- source_word: τῷ Φιλίππῳ
  choice: kay Felipe
  rationale: Likas na anyong Filipino para sa pangalang Philip at sa datibong di-tuwirang layon.
- source_word: Πρόσελθε
  choice: Lumapit ka
  rationale: Tuwirang ipinapahayag ang utos na kumilos patungo sa karwahe nang hindi ipinapalagay kung gaano ito kalayo.
- source_word: κολλήθητι
  choice: sumabay
  rationale: Sa tagpong gumagalaw ang karwahe, natural na ipinahahayag ng “sumabay” ang paglapit at pananatiling kaagapay nito. Hindi nito ipinahihiwatig na kailangang literal na kumapit si Felipe.
- source_word: τῷ ἅρματι τούτῳ
  choice: sa karwaheng ito
  rationale: Ang ἅρμα ay sasakyang hila ng kabayo, kaya ang “karwahe” ay malinaw at natural sa modernong Filipino. Pinananatili ng “ito” ang proximal na τούτῳ.
theological_decisions:
- issue: Ang tinutukoy ng τὸ πνεῦμα
  choice: ang Espiritu, na sa konteksto ay ang Espiritu Santo
  alternative: isang di-tiyak na espiritu o espirituwal na udyok
  rationale: Paulit-ulit na inilalarawan sa Mga Gawa ang Espiritu bilang personal na banal na tagapagbigay ng patnubay. Gayunman, hindi dinaragdagan ng salin ng salitang “Santo” ang tekstong Griego.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “Felipe” at “karwahe,” mga anyong madaling maunawaan at nakasanayan sa saling biblikal; iniwasan ang mas literal ngunit alanganing “idikit mo ang iyong sarili.”
