base_translation:
  language: en
  yaml_path: translation/nt/acts/008/028.yaml
  text: And he was returning[a], seated in his chariot[b], and was reading Isaiah the prophet.
translation:
  language: tl
  text: Habang nagbabalik siya, nakaupo siya sa kanyang karwahe at binabasa[b] ang propetang si Isaias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, ang ayos ay “ang propetang Isaias.”
    reason: lexical_alternative
  - marker: b
    text: Noong sinaunang panahon, madalas na ginagawa nang malakas ang pagbabasa. Posible ang “binabasa nang malakas,” ngunit hindi ito tahasang sinasabi ng pandiwang Griyego rito.
    reason: cultural_note
lexical_decisions:
- source_word: ἦν τε ὑποστρέφων
  choice: Pabalik na siya noon
  rationale: Ipinapahayag ng ἦν kasama ng pangkasalukuyang pandiwari ang nagpapatuloy na kilos sa nakaraan. Pinananatili ng “pabalik na siya noon” ang aspektong ito nang hindi idinaragdag na umuuwi siya, na hindi tahasang sinabi sa Griyego.
- source_word: καθήμενος
  choice: habang nakaupo
  rationale: Inilalarawan ng pandiwari ang posisyon niya kasabay ng paglalakbay at pagbabasa. Likas sa modernong Tagalog ang “habang nakaupo” para sa magkasabay na kalagayan at kilos.
- source_word: ἐπὶ τοῦ ἅρματος αὐτοῦ
  choice: sa kanyang karwahe
  rationale: Maaaring literal na mangahulugang “sa ibabaw ng,” ngunit sa Tagalog, sapat at likas ang “sa kanyang karwahe” para sa pagsakay sa ganitong sasakyan.
- source_word: ἀνεγίνωσκεν
  choice: binabasa niya
  rationale: Ipinakikita ng imperpektong anyo ang nagpapatuloy na pagbabasa. Hindi idinagdag sa pangunahing teksto ang “nang malakas” sapagkat bagaman karaniwan noon ang pagbasa nang malakas, hindi iyon tahasang hinihingi ng pandiwa.
- source_word: τὸν προφήτην Ἠσαΐαν
  choice: ang aklat ng propetang si Isaias
  rationale: Literal na “ang propetang si Isaias,” ngunit sa konteksto ang binabasa ay ang mga isinulat o aklat na nauugnay kay Isaias. Nililinaw ng “aklat” ang likas na kahulugan sa Tagalog nang hindi tinutukoy ang isang partikular na sipi.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “karwahe” bilang pamilyar na katawagan sa sinaunang sasakyang ἅρμα, at inayos ang mga sugnay upang maging likas ang daloy habang pinananatili ang sabay-sabay at nagpapatuloy na mga kilos.
