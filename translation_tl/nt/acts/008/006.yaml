  register: Modernong Filipino na malinaw at marangal. Ginamit ang 'Felipe,' ang karaniwang anyong Filipino ng pangalan. Inilagay nang maaga ang 'buong pagkakaisa' upang mapanatili ang diin ng Griyego sa sama-samang pagtugon.
