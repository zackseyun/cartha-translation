base_translation:
  language: en
  yaml_path: translation/nt/acts/008/006.yaml
  text: And the crowds with one accord paid close attention to what was being said by Philip[b][a], as they heard him and saw the signs that he was doing.
translation:
  language: tl
  text: At ang mga tao ay nagkaisang nakinig nang mabuti[a] sa mga sinasabi ni Felipe, habang pinakikinggan nila siya at nakikita ang mga tandang ginagawa niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinakikinggan nang mabuti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: nakinig nang mabuti
  rationale: Ipinapahayag nito ang masusing at patuloy na pagbibigay-pansin sa sinasabi ni Felipe; natural ito sa modernong Filipino sa kontekstong pasalita.
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito sa daloy ng salaysay at hindi kailangang ipakahulugang pagsalungat.
- source_word: οἱ ὄχλοι
  choice: ang mga tao
  rationale: Tumutukoy ito sa nagkatipong karamihan. Mas natural sa Filipino ang 'mga tao' rito kaysa sa mabigat na 'mga karamihan,' bagaman hindi nito tuwirang tinutularan ang anyong maramihan ng Griyego.
- source_word: τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου
  choice: sa sinasabi ni Felipe
  rationale: Natural at tuwirang ipinapahayag ang nilalaman ng patuloy na pagsasalita at ang nagsasalita, nang hindi dinaragdagan bilang 'mensahe.'
- source_word: ὁμοθυμαδὸν
  choice: buong pagkakaisang
  rationale: Pinananatili ang diwa ng nagkakaisa at magkakasamang pagtugon ng karamihan.
- source_word: ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν
  choice: habang naririnig nila siya at nakikita
  rationale: Ipinapakita ang kasabay na pangyayari. Ang anyo ng αὐτούς sa ibinigay na teksto ay alanganin, ngunit sa konteksto ang tinutukoy na naririnig ay si Felipe.
- source_word: τὰ σημεῖα
  choice: ang mga tanda
  rationale: Tuwirang katumbas ng σημεῖα at hindi nagdaragdag ng interpretatibong salitang 'himala,' kahit pambihira ang mga gawa sa konteksto.
- source_word: ἃ ἐποίει
  choice: ginagawa niya
  rationale: Pinananatili ang nagpapatuloy na aspekto ng imperpektong pandiwa sa tagpo.
