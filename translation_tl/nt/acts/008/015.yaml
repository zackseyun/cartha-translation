  text: οἵτινες καταβάντες προσηύξαντο περὶ αὐτῶν ὅπως λάβωσιν πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/015.yaml
  text: who came down and prayed for them so that they might receive the Holy Spirit[a][b].
translation:
  language: tl
  text: na bumaba at nanalangin para sa kanila upang matanggap nila ang Banal na Espiritu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na pagkababa nila ay nanalangin.”
    reason: lexical_alternative
  - marker: b
    text: O “na, nang makababa sila, ay nanalangin.”
    reason: previous_rendering
lexical_decisions:
- source_word: οἵτινες
  choice: na
  rationale: Ipinagpapatuloy nito ang pangungusap at tumutukoy kina Pedro at Juan sa naunang talata. Ang “na” ang likas na panandang pang-ugnay sa Filipino sa ganitong kayarian.
- source_word: καταβάντες
  choice: bumaba
  rationale: Ang aorist participle ay tumutukoy sa pagkilos na nauna sa pananalangin. Sa natural na Filipino, malinaw na naipahihiwatig ng sunuran na “bumaba at nanalangin” ang pagkakasunod ng mga kilos nang hindi pinabibigat ang pangungusap.
- source_word: προσηύξαντο
  choice: nanalangin
  rationale: Tuwirang salin ng pandiwang tumutukoy sa pananalangin; walang natatanging diwang kailangang idagdag mula sa anyong middle.
- source_word: περὶ αὐτῶν
  choice: para sa kanila
  rationale: Sa kontekstong kasama ng pananalangin, ipinahihiwatig ng περί at genitive ang pananalangin alang-alang sa ibang tao. Natural at malinaw sa modernong Filipino ang “para sa kanila.”
- source_word: ὅπως
  choice: upang
  rationale: Pinananatili ng “upang” ang layunin o inaasahang bunga ng panalangin at angkop ito sa marangal ngunit madaling maunawaang rehistro.
- source_word: λάβωσιν
  choice: matanggap nila
  rationale: Ang anyong subjunctive pagkatapos ng ὅπως ay bahagi ng sugnay na nagsasaad ng layunin. Ang “matanggap nila” ay natural sa Filipino at hindi nagdaragdag ng di-tiyak na kahulugang wala naman sa Griyego.
- source_word: πνεῦμα ἅγιον
  choice: ang Banal na Espiritu
  rationale: Sa konteksto ng Mga Gawa, tumutukoy ito sa banal na Espiritung ipinagkakaloob sa mga mananampalataya. Ang “ang Banal na Espiritu” ang kinagawiang malinaw na pagtukoy sa personal at banal na tinutukoy.
theological_decisions:
- issue: Kung ang πνεῦμα ἅγιον ay tumutukoy sa isang pangkalahatang “banal na espiritu” o sa personal na Banal na Espiritu
  choice: ang Banal na Espiritu
  alternative: isang banal na espiritu
  rationale: Ipinakikita ng konteksto ng salaysay sa Mga Gawa na ang tinutukoy ay ang ipinangakong Espiritu na tinatanggap ng mga mananampalataya. Nililinaw ng salin ang referent nang hindi nagdaragdag ng doktrinal na paliwanag sa teksto.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang payak na magkasunod na pandiwang “bumaba at nanalangin” para sa maayos na daloy, habang inilagay sa mga talababa ang mas tahasang temporal na mga salin ng aorist participle.
