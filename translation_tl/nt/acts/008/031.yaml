  yaml_path: translation/nt/acts/008/031.yaml
  text: And he said[a], “How could I[b], unless someone guides me?” Then he urged Philip to come up and sit with him.
translation:
  language: tl
  text: Sumagot siya, “Paano ko nga mauunawaan kung walang gagabay sa akin?[a]” Pagkatapos, taimtim na nakiusap siya kay Felipe na umakyat at maupong kasama niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kung walang aakay sa akin.” Ang pandiwang Griego ay maaaring tumukoy kapuwa sa literal na pag-akay at sa paggabay tungo sa pagkaunawa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “taimtim niyang inanyayahan si Felipe na umakyat at maupong kasama niya.” Ang pandiwa ay maaaring mangahulugan ng marubdob na pakiusap o paanyaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πῶς γὰρ ἂν δυναίμην
  choice: Paano ko nga mauunawaan
  rationale: Ipinahihiwatig ng optative na may ἄν ang posibilidad o kakayahang nakasalalay sa isang kondisyon. Dahil ang konteksto ay pag-unawa sa Kasulatan, likas sa Tagalog ang “Paano ko nga mauunawaan,” habang pinananatili ang diwa ng kawalan ng kakayahan kung walang tutulong.
- source_word: ἐὰν μή τις ὁδηγήσει με
  choice: kung walang gagabay sa akin
  rationale: Ang ὁδηγέω ay literal na gumabay o umakay, ngunit maaari ring tumukoy sa paggabay tungo sa pagkaunawa. Pinananatili ng “gagabay” ang dalawang larawang ito nang hindi nililimitahan sa “magpapaliwanag.”
- source_word: παρεκάλεσέν
  choice: taimtim niyang inanyayahan
  rationale: Saklaw ng παρακαλέω ang pakiusap, paghimok, at pag-anyaya. Sa tagpong ito, malinaw na paanyaya itong may diin; ipinahahayag ng “taimtim niyang inanyayahan” ang magalang ngunit marubdob na pakiusap.
- source_word: τε
  choice: Pagkatapos
  rationale: Bahagyang nag-uugnay ang τέ sa mga sugnay. Ang “Pagkatapos” ay natural na naghahayag ng pagsulong ng salaysay.
- source_word: ἀναβάντα
  choice: na umakyat
  rationale: Pinananatili ng “umakyat” ang spatial na larawan ng ἀναβαίνω, sapagkat inaanyayahan si Felipe na umakyat sa karwahe.
- source_word: καθίσαι σὺν αὐτῷ
  choice: maupong kasama niya
  rationale: Tuwirang ipinahahayag nito ang καθίζω na may σύν at hindi ipinapalagay na tiyak na “sa tabi” ang posisyon.
- source_word: Φίλιππον
  choice: Felipe
  rationale: Ginamit ang nakagawiang anyo ng pangalang Philip sa modernong saling Bibliya sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “mauunawaan” upang gawing malinaw ang ipinahihiwatig ng konteksto, ngunit pinanatili ang “gagabay” upang hindi mawala ang sadyang lawak ng larawan sa Griego. Ang mga panandang [a] at [b] ay inilagay sa mismong teksto at tumutugma sa mga talababa.
