base_translation:
  language: en
  yaml_path: translation/nt/acts/008/039.yaml
  text: And when they came up out of the water[a], the Spirit of the Lord carried Philip away, and the eunuch saw him no longer, for he went on his way rejoicing.
translation:
  language: tl
  text: Nang umahon sila mula sa tubig, biglang inagaw palayo ng Espiritu ng Panginoon si Felipe.[a] Hindi na muling nakita ng eunuko si Felipe, sapagkat masayang nagpatuloy siya sa kanyang paglalakbay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dinala palayo si Felipe.” Maaaring idiin ng pandiwang Griyego ang biglaan at mapuwersang pag-aalis sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος
  choice: Nang umahon sila mula sa tubig
  rationale: Ipinahahayag ng ἀναβαίνω kasama ng ἐκ ang pag-ahon mula sa tubig. Likas sa Tagalog ang pariralang ito at hindi nito tinutukoy nang higit sa teksto ang paraan ng bautismo.
- source_word: πνεῦμα κυρίου
  choice: Espiritu ng Panginoon
  rationale: Sa gamit ng Lucas–Mga Gawa, karaniwan itong tumutukoy sa Espiritu ng Diyos na kumikilos bilang banal na persona; pinananatili rin ang karaniwang salin ng κύριος bilang “Panginoon.”
- source_word: ἥρπασεν
  choice: dinala palayo
  rationale: Tinutukoy ng ἁρπάζω ang biglaan at malakas na pag-aalis. Malinaw at marangal sa modernong Tagalog ang “dinala palayo,” habang inilalagay sa talababa ang mas mariing “inagaw.”
- source_word: οὐκ εἶδεν αὐτὸν οὐκέτι
  choice: Hindi na siya nakita
  rationale: Likas nitong ipinahahayag na mula sa sandaling iyon ay hindi na muling nakita ng eunuko si Felipe.
- source_word: ὁ εὐνοῦχος
  choice: ang eunuko
  rationale: Tuwirang katumbas ito ng tahasang katawagan sa Griyego at nagpapanatili ng pagkakaugnay sa naunang salaysay.
- source_word: ἐπορεύετο τὴν ὁδὸν αὐτοῦ
  choice: nagpatuloy ... sa kanyang paglalakbay
  rationale: Ang aspektong imperpektibo ay nagpapakita ng nagpapatuloy na pagkilos, at ang ὁδός dito ay tumutukoy sa kanyang paglalakbay, hindi lamang sa isang literal na daan.
- source_word: χαίρων
  choice: na nagagalak
  rationale: Pinananatili nito ang pandiwang diwa ng kasalukuyang pandiwari at inilalarawan ang kagalakang kasabay ng pagpapatuloy niya sa paglalakbay.
theological_decisions:
- issue: Kung ang πνεῦμα κυρίου ay tumutukoy sa Banal na Espiritu o sa isang di-personal na puwersang mula sa Diyos
  choice: Espiritu ng Panginoon bilang personal na banal na tagakilos
  alternative: isang espiritu o puwersang mula sa Panginoon
  rationale: Sa Lucas–Mga Gawa, ang pariralang ito ay karaniwang tumutukoy sa Espiritu ng Diyos na kumikilos nang personal at makapangyarihan. Hindi na idinagdag ang salitang “Banal,” sapagkat wala iyon sa mismong parirala.
- issue: Kung gaano katindi dapat ipahayag ang ἥρπασεν
  choice: dinala palayo, na may mas mariing alternatibo sa talababa
  alternative: inagaw
  rationale: Ipinahihiwatig ng konteksto ang mahimalang pag-aalis kay Felipe. Pinananatiling malinaw at natural ng pangunahing salin ang pangyayari, samantalang iniingatan ng talababa ang puwersa at pagkabiglaang maaaring taglay ng pandiwa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Inulit ang “eunuko” sa huling sugnay upang maiwasan ang kalituhan sa tinutukoy ng panghalip, at pinanatili ang “sapagkat” para sa γάρ kahit nananatiling bahagyang bukas ang lohikal na ugnayan nito sa naunang pahayag.
