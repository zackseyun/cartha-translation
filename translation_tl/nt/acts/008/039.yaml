  source_fidelity: Ang “dinala palayo” ay maaaring tumukoy sa pag-aalis, ngunit kulang ito sa biglaan at mapuwersang diin ng ἥρπασεν. Ang “biglang inagaw palayo” ay mas malapit sa pandiwang Griyego at sa kilos ng Espiritu sa salaysay. Napananatili ang pag-ahon mula sa tubig, ang hindi na muling pagkakita ng eunuko kay Felipe, at ang patuloy niyang masayang paglalakbay.
  naturalness: Mas natural at malinaw sa modernong Filipino Tagalog ang “Hindi na muling nakita ng eunuko si Felipe” kaysa sa ayos na “Hindi na siya nakita ng eunuko.” Ang “masayang nagpatuloy sa kanyang paglalakbay” ay mas pangkasalukuyang gamit kaysa “na nagagalak,” habang naipahahayag pa rin ang kasabay na kagalakan.
  terminology: Ang “Espiritu ng Panginoon,” “Felipe,” at “eunuko” ay angkop at pinananatili. Hindi idinaragdag ang “Banal” sa πνεῦμα κυρίου. Ang “inagaw palayo” ay pinili para sa ἥρπασεν nang walang pagdaragdag ng isang partikular na paliwanag sa paraan ng pangyayari.
