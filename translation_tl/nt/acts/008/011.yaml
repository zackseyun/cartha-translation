  text: And they paid attention to him because for a considerable time he had amazed them with his magic arts[a][b].
translation:
  language: tl
  text: At binigyan nila siya ng pansin sapagkat matagal na niya silang pinamangha sa pamamagitan ng kanyang mga salamangka.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa loob ng mahabang panahon.”
    reason: lexical_alternative
  - marker: b
    text: O “sa pamamagitan ng kanyang pangkukulam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: nakinig sila sa kanya
  rationale: Sa konteksto, ang προσέχω na may datibong layon ay tumutukoy sa pagbibigay-pansin o pakikinig sa isang tao. Ang “nakinig sila sa kanya” ay natural sa modernong Tagalog at naipahihiwatig ang patuloy nilang pagsunod sa sinasabi niya.
- source_word: διὰ τὸ ἱκανῷ χρόνῳ
  choice: sapagkat matagal na
  rationale: Ang διά na may articular infinitive ay nagsasaad ng dahilan, at ang ἱκανῷ χρόνῳ ay tumutukoy sa mahaba o malaking haba ng panahon. Ang “matagal na” ay malinaw at likas sa Tagalog.
- source_word: ταῖς μαγείαις
  choice: sa pamamagitan ng kanyang mga salamangka
  rationale: Ang μαγεία ay tumutukoy sa mga gawaing mahika. Ang “mga salamangka” ay madaling maunawaan at hindi nagpapasiya kung ang mga ito ay panlilinlang, gawaing okulto, o pareho. Idinagdag ang “kanyang” ayon sa malinaw na konteksto.
- source_word: ἐξεστακέναι
  choice: pinahahanga
  rationale: Dito, ang ἐξίστημι ay nangangahulugang magdulot ng matinding pagkamangha. Ang “pinahahanga” ay natural na nagpapakita ng matagal na epekto sa mga tao nang hindi ipinahihiwatig na literal silang nakulam.
- source_word: αὐτούς
  choice: sila
  rationale: Tumutukoy ito sa mga taong binanggit sa konteksto bilang mga pinahanga ni Simon.
theological_decisions:
- issue: Likas ng mga gawain ni Simon sa μαγείαις
  choice: mga salamangka
  alternative: pangkukulam; mahika
  rationale: Inilalarawan ng talata ang mga gawain bilang μαγεία ngunit hindi nito nililinaw kung ang mga ito ay panlilinlang, gawaing okulto, o kapwa. Pinananatili ng “mga salamangka” ang paglalarawan nang hindi nagdaragdag ng tiyak na doktrinal na paghatol.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang payak na “matagal na” at “mga salamangka” para madaling maunawaan ng karaniwang mambabasa, habang pinananatili sa mga talababa ang mas pormal o mas matinding mga alternatibo.
