id: ACT.8.37
reference: Acts 8:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: robinson-pierpont-2005-byzantine
  text: Εἶπεν δὲ ὁ Φίλιππος, Εἰ πιστεύεις ἐξ ὅλης τῆς καρδίας, ἔξεστιν. Ἀποκριθεὶς δὲ εἶπεν, Πιστεύω τὸν υἱὸν τοῦ θεοῦ εἶναι τὸν Ἰησοῦν Χριστόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/037.yaml
  text: And Philip[a] said, “If you believe with all your heart, you may.” And he answered and said, “I believe that Jesus is the Messiah, the Son of God.”
translation:
  language: tl
  text: Sinabi naman ni Felipe[a], “Kung sumasampalataya ka nang buong puso, maaari kang magpabautismo.” Sumagot siya, “Sumasampalataya akong si Jesus ang Mesiyas, ang Anak ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wala ang talatang ito sa pinakamaagang mga manuskritong Griego, kabilang ang mga papiro mula sa ikatlong siglo at ang Codex Sinaiticus at Codex Vaticanus mula sa ikaapat na siglo, gayundin sa mga sinaunang saling Coptic. Matatagpuan naman ito sa nakararaming manuskritong nasa tradisyong Byzantine at sa tradisyong Latin, at sinipi ito ng mga sinaunang ama ng iglesya gaya nina Irenaeus at Cyprian mula pa noong huling bahagi ng ikalawang siglo. Madalas itong ituring ng mga iskolar na isang sinaunang pormulang ginagamit sa seremonya ng bautismo na kalaunan ay naisama sa salaysay ng Mga Gawa.
    reason: textual_critical
lexical_decisions:
- source_word: ἔξεστιν
  choice: maaari kang magpabautismo
  rationale: Ang impersonal na pandiwa ay nagpapahayag ng pahintulot. Tahasang inilagay ang ipinahihiwatig na pagpapabautismo mula sa naunang tanong upang maging likas at malinaw sa Tagalog.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: nang buong puso
  rationale: Pinananatili nito ang karaniwang biblikal na idyoma para sa ganap at taimtim na pananampalataya.
- source_word: Πιστεύω / πιστεύεις
  choice: sumasampalataya / Sumampalataya
  rationale: Mas angkop ang “sumasampalataya” kaysa simpleng “naniniwala” sa konteksto ng taimtim na pagtitiwala at pagpapahayag ng pananampalataya.
- source_word: Χριστόν
  choice: Mesiyas
  rationale: Dito ay pamagat ang Χριστός, kaya ang “Mesiyas” ay malinaw na naghahatid ng kahulugan nito sa halip na ituring lamang na bahagi ng pangalan ni Jesus.
theological_decisions:
- issue: Anyo ng pahayag tungkol kay Jesus
  choice: “si Jesus ang Mesiyas, ang Anak ng Diyos”
  alternative: “si Jesu-Cristo ang Anak ng Diyos”
  rationale: Inilalahad ang Χριστός bilang titulong “Mesiyas” at pinananatili ang kasunod na “Anak ng Diyos” bilang kaakibat na pagkakakilanlan, nang hindi nagpapasok ng karagdagang paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Felipe,” “Mesiyas,” at “Diyos” ayon sa karaniwang bokabularyong biblikal sa Tagalog; iniwasan ang labis na teknikal o denominasyonal na pananalita.
