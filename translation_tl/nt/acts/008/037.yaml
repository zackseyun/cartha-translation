  source_fidelity: Tapat ang salin sa tekstong Griyego ng Robinson-Pierpont. Ang “nang buong puso” ay wasto para sa ἐξ ὅλης τῆς καρδίας, at ang “maaari kang magpabautismo” ay isang likas na paglalahad ng pahintulot na ipinahihiwatig ng ἔξεστιν sa agarang konteksto ng bautismo. Naipapahayag din nang tama ang pagpapahayag ng pananampalataya kay Jesus bilang Mesiyas at Anak ng Diyos.
