source:
  edition: SBLGNT
  text: ⸀πολλοὶ γὰρ τῶν ἐχόντων πνεύματα ἀκάθαρτα βοῶντα φωνῇ μεγάλῃ ⸀ἐξήρχοντο, πολλοὶ δὲ παραλελυμένοι καὶ χωλοὶ ἐθεραπεύθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/007.yaml
  text: For many who had unclean spirits[a], they came out crying with a loud voice; and many who were paralyzed and lame were healed.
translation:
  language: tl
  text: Sapagkat marami sa mga taong may maruruming espiritu[a] ang nilabasan ng mga ito habang sumisigaw nang malakas; at marami ring paralisado at pilay ang pinagaling.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, ang participle na isinaling “sumisigaw” ay pinakanatural na tumutukoy sa maruruming espiritu habang lumalabas ang mga ito.
    reason: Nililinaw ang gramatikal na kaugnayan ng participle, yamang maaaring mapagkamalang mga taong may maruruming espiritu ang sumisigaw.
lexical_decisions:
- source_word: πολλοὶ γὰρ τῶν ἐχόντων
  choice: Sapagkat mula sa maraming taong may
  rationale: Pinananatili ng “Sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang pahayag. Ang “mula sa maraming taong may” ay likas na paraan sa Tagalog upang ipakilala ang mga taong nilalabasan ng mga espiritu nang hindi dinaragdagan ang teksto ng mas tiyak na ideya ng pagsanib.
- source_word: πνεύματα ἀκάθαρτα
  choice: maruruming espiritu
  rationale: Karaniwan at tumpak na katumbas sa salaysay ng Lucas–Mga Gawa para sa mga espiritung itinuturing na marumi.
- source_word: βοῶντα φωνῇ μεγάλῃ
  choice: habang sumisigaw nang malakas
  rationale: Malinaw na ipinahahayag ang kasabay na kilos at lakas ng sigaw; ang anyong neuter plural sa Griyego ay umaayon sa “mga espiritu.”
- source_word: ἐξήρχοντο
  choice: lumabas ang mga espiritu
  rationale: Ginawang tahasang paksa ang mga espiritu upang maiwasan ang malabong panghalip sa Tagalog, habang pinananatili ang di-ganap na aspektong pasalaysay sa natural na paraan.
- source_word: παραλελυμένοι
  choice: paralisado
  rationale: Makabago, malinaw, at karaniwang salitang Filipino para sa kalagayang inilalarawan ng perfect passive participle.
- source_word: χωλοὶ
  choice: pilay
  rationale: Likas at di-mapanghamak na katawagan sa mga nahihirapang lumakad.
- source_word: ἐθεραπεύθησαν
  choice: pinagaling
  rationale: Pinananatili ang diwang pasibo ng pandiwa nang hindi tinutukoy sa sugnay kung sino ang gumawa ng pagpapagaling.
theological_decisions:
- issue: Kung sino ang sumisigaw at lumalabas
  choice: Ang maruruming espiritu ang sumisigaw nang malakas at lumalabas mula sa mga tao.
  alternative: Ang mga taong may maruruming espiritu ang sumisigaw habang lumalabas ang mga espiritu.
  rationale: Ang neuter plural na participle na βοῶντα ay likas na umaayon sa neuter plural na πνεύματα ἀκάθαρτα, kaya ang mga espiritu ang gramatikal na tinutukoy na sumisigaw. Nilinaw ito sa Tagalog nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang tahasang “ang mga espiritu” sa ikalawang sugnay para sa kalinawan ng tinutukoy, at iniwasan ang “sinasaniban” sapagkat mas tiyak iyon kaysa sa payak na τῶν ἐχόντων.
