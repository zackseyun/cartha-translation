  to: Sapagkat marami sa mga taong may maruruming espiritu[a] ang nilabasan ng mga ito habang sumisigaw nang malakas; at marami ring paralisado at pilay ang pinagaling.
  rationale: Pinalitan ang hindi gaanong likas na “mula sa maraming taong may” ng “marami sa mga taong may,” na tuwirang naghahatid ng partitive na konstruksyon sa Griyego. Ginamit ang “ang nilabasan ng mga ito” upang malinaw na ang mga espiritu ang lumabas mula sa mga tao, habang ang “mga ito” at ang talababa ay nagpapanatili ng malinaw na referent ng pagsigaw. Walang idinagdag na pagpapakahulugang doktrinal.
