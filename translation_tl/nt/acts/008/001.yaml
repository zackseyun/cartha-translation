id: ACT.8.1
reference: Acts 8:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἦν συνευδοκῶν τῇ ἀναιρέσει αὐτοῦ. Ἐγένετο δὲ ἐν ἐκείνῃ τῇ ἡμέρᾳ διωγμὸς μέγας ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις· πάντες δὲ διεσπάρησαν κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας πλὴν τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/001.yaml
  text: Saul was approving of his execution. And on that day a great persecution arose against the church in Jerusalem[a], and they were all scattered throughout the regions of Judea and Samaria, except the apostles.
translation:
  language: tl
  text: 'Sang-ayon si Saulo sa pagpatay sa kanya.[a]


    Nang araw na iyon, nagsimula ang matinding pag-uusig laban sa iglesya sa Jerusalem, at silang lahat ay nangalat sa iba''t ibang lugar sa Judea at Samaria, maliban sa mga apostol.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kanya” ay tumutukoy kay Esteban. Maaari ring isalin ang parirala na “sa pagbitay sa kanya,” “sa kanyang kamatayan,” o, nang mas mapagpakahulugan, “sa pagpaslang sa kanya.” Ang Griyego ay tumutukoy sa gawa ng pagpatay sa kanya.
    reason: Nililinaw ang kontekstuwal na tinutukoy ng panghalip at inilalahad ang mahahalagang alternatibong leksikal nang hindi pinapawi ang saklaw ng salitang Griyego.
lexical_decisions:
- source_word: Σαῦλος
  choice: Saulo
  rationale: Karaniwang anyong Tagalog ng pangalang Griyego na Σαῦλος.
- source_word: ἦν συνευδοκῶν
  choice: Sumasang-ayon
  rationale: Ipinahihiwatig ng periphrastic construction ang patuloy o kasabay na pagsang-ayon ni Saulo; natural itong naipahahayag sa kasalukuyang Tagalog ayon sa daloy ng salaysay.
- source_word: τῇ ἀναιρέσει αὐτοῦ
  choice: sa pagpatay sa kanya
  rationale: Tumutukoy ang ἀναίρεσις sa gawa ng pagkitil o pagpatay, hindi lamang sa kamatayan. Iniiwasan ng 'pagpatay' ang posibleng pahiwatig ng legal na pagiging lehitimo ng 'pagbitay' at ang mas tahasang moral-legal na hatol ng 'pagpaslang.'
- source_word: Ἐγένετο
  choice: nagsimula
  rationale: Sa konteksto, ipinakikilala nito ang pagsiklab o pagsisimula ng pag-uusig; mas natural sa Tagalog ang 'nagsimula' kaysa literal na 'nangyari.'
- source_word: διωγμὸς μέγας
  choice: matinding pag-uusig
  rationale: Natural na Tagalog para sa pag-uusig na malaki o malubha ang tindi, habang pinananatili ang diin ng μέγας.
- source_word: ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις
  choice: laban sa iglesya sa Jerusalem
  rationale: Ipinapakita ng 'laban sa' ang mapanlabang direksiyon ng ἐπί, at malinaw na tinutukoy ng kasunod na parirala ang iglesyang nasa Jerusalem.
- source_word: πάντες δὲ διεσπάρησαν
  choice: at silang lahat ay nangalat
  rationale: Pinananatili ang diin ng πάντες at ang pasibong bunga ng sapilitang pagkakawatak-watak, sa natural na ekspresyong Tagalog.
- source_word: κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας
  choice: sa mga lupain ng Judea at Samaria
  rationale: Ang χώρας ay mga teritoryo o lupain; sapat na ipinahihiwatig ng 'nangalat sa mga lupain' ang pagkalat sa iba't ibang bahagi ng dalawang rehiyon.
- source_word: πλὴν τῶν ἀποστόλων
  choice: maliban sa mga apostol
  rationale: Tuwirang ipinahahayag ang eksepsiyong minamarkahan ng πλήν.
theological_decisions:
- issue: Pagpapakahulugan sa ἀναιρέσει αὐτοῦ kaugnay ng pagkamatay ni Esteban
  choice: sa pagpatay sa kanya
  alternative: sa pagbitay sa kanya; sa pagpaslang sa kanya; sa kanyang kamatayan
  rationale: Pinananatili ng 'pagpatay' ang pagtukoy sa mismong gawa ng pagkitil nang hindi ipinapalagay na lehitimong legal na pagbitay iyon o tahasang idinadagdag ang moral-legal na kategoryang 'pagpaslang.'
- issue: Saklaw ng πάντες
  choice: silang lahat ... maliban sa mga apostol
  alternative: lahat ng mananampalataya; ang bawat isa
  rationale: Pinananatili ang pampanitikang lakas ng 'lahat' at ang tahasang eksepsiyon ng mga apostol, nang hindi nilalagyan ng mas tiyak na katawagang wala sa talata.
- issue: Antecedent ng αὐτοῦ
  choice: kanya, na tumutukoy kay Esteban ayon sa naunang konteksto
  alternative: Esteban
  rationale: Pinananatili sa pangunahing teksto ang panghalip ng Griyego at iniiwasang palitan ito ng pangalang hindi inuulit sa mismong talata; nililinaw sa talababa ang kontekstuwal na tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang 'iglesya' bilang pamilyar at maikling katawagan sa kapulungan ng mga mananampalataya. Ang dalawang pangungusap at talatang hati ay nagpapanatili sa biglang paglipat mula sa pagsang-ayon ni Saulo tungo sa malawakang pag-uusig.
