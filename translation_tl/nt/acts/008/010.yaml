  text: ᾧ προσεῖχον ⸀πάντες ἀπὸ μικροῦ ἕως μεγάλου λέγοντες· Οὗτός ἐστιν ἡ Δύναμις τοῦ θεοῦ ἡ ⸀καλουμένη Μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/010.yaml
  text: They all paid attention to him[a], from the least to the greatest, saying, “This man is the power of God that is called Great.”
translation:
  language: tl
  text: Binibigyang-pansin siya ng lahat, mula sa pinakamababa hanggang sa pinakadakila, at sinasabi nila, “Ang taong ito ang kapangyarihan ng Diyos na tinatawag na Dakila.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ito ang tinatawag na Dakilang Kapangyarihan ng Diyos.” Maaaring unawain ang Griyego bilang isang mas maikling pahayag na anyong pamagat.'
    reason: alternative_reading
lexical_decisions:
- source_word: ᾧ προσεῖχον
  choice: Nakikinig sa kanya
  rationale: Sa kontekstong ito, ang προσέχω ay masinsing pagbibigay-pansin o pakikinig sa isang tao. Natural sa makabagong Tagalog ang “nakikinig sa kanya” at hindi nito pinalalabis ang diwa tungo sa debosyon o katapatan.
- source_word: πάντες
  choice: ang lahat
  rationale: 'Pinananatili nito ang tahasang saklaw ng pangmaramihang paksa: lahat ng taong tinutukoy sa konteksto.'
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: mula sa pinakamababa hanggang sa pinakadakila
  rationale: Ito ay isang merismong sumasaklaw sa buong antas ng lipunan. Ang “pinakamababa” at “pinakadakila” ay naghahayag ng katayuan, hindi pisikal na laki.
- source_word: λέγοντες
  choice: at sinasabi
  rationale: Ipinapakita ng kasalukuyang participle na kasabay ng kanilang pakikinig ang paulit-ulit o patuloy nilang pagsasabi.
- source_word: Οὗτός
  choice: Ang taong ito
  rationale: Ang demonstratibo ay tumutukoy kay Simon bilang tao. Malinaw at natural sa Tagalog ang “ang taong ito.”
- source_word: ἡ Δύναμις τοῦ θεοῦ
  choice: ang kapangyarihan ng Diyos
  rationale: Pinananatili ang articular at tila pamagat na anyo ng parirala, pati ang pambihirang pag-aangkin ng mga tao tungkol kay Simon.
- source_word: ἡ καλουμένη Μεγάλη
  choice: na tinatawag na Dakila
  rationale: Pinananatili ang pasibong diwa ng καλουμένη bilang katawagan at ang Μεγάλη bilang ipinapalagay na titulo o epiteto.
- source_word: Μεγάλη
  choice: Dakila
  rationale: Ang pambabaeng pang-uri ay kaayon ng Δύναμις at gumaganap bilang katawagan. Ang “Dakila” ay mas angkop sa isang titulo kaysa sa “Malaki.”
theological_decisions:
- issue: Kung ang pahayag ng mga tao ay isang pormal na titulong banal o isang paglalarawan kay Simon
  choice: 'Isinalin bilang iniulat na pag-aangkin ng mga tao: “Ang taong ito ang kapangyarihan ng Diyos na tinatawag na Dakila.”'
  alternative: “Ito ang tinatawag na Dakilang Kapangyarihan ng Diyos.”
  rationale: Iniulat lamang ng tagapagsalaysay ang paniniwala ng mga tao at hindi niya ito pinagtitibay. Pinananatili ng pangunahing salin ang tahasang pagkakaugnay ni Simon at ng “kapangyarihan ng Diyos,” samantalang inilalagay sa talababa ang mas siksik at tila pamagat na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinakamababa” sa halip na literal na “pinakamaliit” upang maipahayag ang antas sa lipunan; pinanatili ang kakaiba at tila pamagat na pahayag ng karamihan nang hindi ito ipinapakitang pagsang-ayon ng tagapagsalaysay.
