  text: ὁ δὲ Σίμων καὶ αὐτὸς ἐπίστευσεν, καὶ βαπτισθεὶς ἦν προσκαρτερῶν τῷ Φιλίππῳ, θεωρῶν τε ⸂σημεῖα καὶ δυνάμεις μεγάλας γινομένας⸃ ἐξίστατο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/013.yaml
  text: And Simon himself also believed[a], and after being baptized he continued with Philip, and as he saw signs and great works of power happening, he was amazed.
translation:
  language: tl
  text: Maging si Simon mismo ay naniwala, at matapos siyang bautismuhan, patuloy siyang sumama kay Felipe. Habang nakikita niya ang mga tanda at mga dakilang gawa ng kapangyarihan[a] na nagaganap, labis siyang namangha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga dakilang himala.” Ang salitang Griyego ay maaaring tumukoy sa mga pagpapamalas ng kapangyarihan, pati na sa mga himala.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: maging si Simon mismo
  rationale: Pinananatili ng “maging” ang diwang pandagdag ng καί at ng “mismo” ang pagbibigay-diin ng αὐτός.
- source_word: ἐπίστευσεν
  choice: naniwala
  rationale: Tuwirang katumbas ito ng pandiwa at hindi nito ipinagpapasiya kung tunay, ganap, o panlabas lamang ang pananampalataya ni Simon.
- source_word: βαπτισθεὶς
  choice: matapos siyang bautismuhan
  rationale: Malinaw at likas nitong ipinahahayag na nauna ang bautismo sa patuloy niyang pananatili kay Felipe.
- source_word: ἦν προσκαρτερῶν τῷ Φιλίππῳ
  choice: patuloy siyang nanatiling kasama ni Felipe
  rationale: Ipinahahayag nito ang nagpapatuloy na pagkakapit o palagiang pakikisama kay Felipe, ayon sa periphrastic imperfect.
- source_word: θεωρῶν
  choice: habang nakikita niya
  rationale: Ipinakikita nito ang nagpapatuloy na pagmamasid na kasabay at sanhi ng kanyang pagkamangha.
- source_word: σημεῖα
  choice: mga tanda
  rationale: Pinananatili ng “mga tanda” ang pahiwatig na ang mga pangyayari ay may ipinakikita o pinatutunayan, hindi lamang pambihirang gawa.
- source_word: δυνάμεις μεγάλας
  choice: mga dakilang gawa ng kapangyarihan
  rationale: Mas malapit ito sa leksikal na diwa ng δυνάμεις bilang mga pagpapamalas o gawa ng kapangyarihan kaysa sa agad na pagpapakahulugang “mga himala.”
- source_word: γινομένας
  choice: na nagaganap
  rationale: Likas nitong inilalarawan ang mga tandang at gawang kapangyarihang nangyayari sa harap ni Simon.
- source_word: ἐξίστατο
  choice: labis siyang namangha
  rationale: Ipinahahayag ng “labis” ang matinding at nagpapatuloy na pagkamanghang taglay ng pandiwa sa kontekstong ito.
theological_decisions:
- issue: Kung dapat bang ipasiya ng salin na tunay o huwad ang paniniwala ni Simon
  choice: Isinalin lamang bilang “naniwala.”
  alternative: “tunay na sumampalataya,” “nagkunwaring naniwala,” o “mababaw lamang ang paniniwala”
  rationale: Sinasabi ng talata na naniwala si Simon at nabautismuhan, ngunit hindi nito tahasang nilulutas ang mga tanong na lumilitaw sa sumunod na salaysay. Pinananatili ng payak na salin ang teolohikal na tensiyon.
- issue: Kung ang δυνάμεις ay dapat tuwirang ipakahulugang mga himala
  choice: “mga dakilang gawa ng kapangyarihan” sa pangunahing teksto
  alternative: “mga dakilang himala”
  rationale: Maaaring tumukoy ang salita sa mga himala, ngunit ang mas malapit na salin ay nagpapanatili sa diin sa kapangyarihang nahahayag sa mga gawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bautismuhan” bilang karaniwang katawagang biblikal, at hinati sa tatlong pangungusap upang maging natural ang daloy nang hindi inaalis ang mga ugnayang ipinahahayag ng mga participle sa Griyego.
