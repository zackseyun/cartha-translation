id: ACT.8.24
reference: Acts 8:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν· Δεήθητε ὑμεῖς ὑπὲρ ἐμοῦ πρὸς τὸν κύριον ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ ὧν εἰρήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/024.yaml
  text: But Simon answered[a], “You pray to the Lord for me, so that nothing of what you have said may come upon me.”
translation:
  language: tl
  text: Ngunit sumagot si Simon, “Kayo ang manalangin sa Panginoon para sa akin, upang huwag mangyari sa akin ang alinman sa mga sinabi ninyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: sumagot
  rationale: Ang participle na ἀποκριθείς kasama ng εἶπεν ay karaniwang idyomang Griyego na nagpapakilala ng tugon. Sapat at likas sa Tagalog ang “sumagot” nang hindi inuulit ang diwa bilang “sumagot at sinabi.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ng δέ ang bahagyang pagsalungat at paglipat mula sa pagsaway ni Pedro tungo sa tugon ni Simon.
- source_word: Δεήθητε ὑμεῖς
  choice: Kayo ang manalangin
  rationale: Ang Δεήθητε ay isang pautos na humihiling ng panalangin, at binibigyang-diin ng tahasang ὑμεῖς na sila ang hinihiling ni Simon na manalangin. Naipahahayag ito nang natural ng hulma na “Kayo ang.”
- source_word: ὑπὲρ ἐμοῦ
  choice: para sa akin
  rationale: Ipinahihiwatig ng ὑπέρ na ang panalangin ay gagawin alang-alang o bilang pamamagitan para kay Simon; ang “para sa akin” ang karaniwang modernong pahayag nito.
- source_word: πρὸς τὸν κύριον
  choice: sa Panginoon
  rationale: Sa pandiwang “manalangin,” natural sa Tagalog ang “sa Panginoon” bilang patutunguhan ng panalangin.
- source_word: ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ ὧν εἰρήκατε
  choice: upang huwag mangyari sa akin ang alinman sa mga sinabi ninyo
  rationale: Pinananatili ng “upang” ang layunin o inaasam na bunga ng panalangin. Ang “alinman sa mga sinabi ninyo” ay natural na paglalahad ng μηδὲν ... ὧν, at ipinahihiwatig ng “mangyari sa akin” ang pagdating ng ibinalang kapahamakan nang hindi nagiging alanganin ang Tagalog.
theological_decisions:
- issue: Ang tinutukoy ng τὸν κύριον
  choice: Panginoon
  alternative: Diyos; Panginoong Jesus
  rationale: “Panginoon” lamang ang sinabi ng tekstong Griyego. Hindi nito tahasang nililinaw kung ang tinutukoy ay ang Diyos o ang muling nabuhay na si Jesus, kaya pinanatili ng salin ang antas ng katiyakan ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kayo ang manalangin” upang madama ang diin sa tahasang panghalip na ὑμεῖς, habang iniwasan ang matigas at di-likas na literal na pag-uulit ng “sumagot at sinabi.”
