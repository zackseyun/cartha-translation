id: ACT.8.33
reference: Acts 8:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν τῇ ⸀ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη· ⸀τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/033.yaml
  text: In his humiliation justice was taken away from him[b][a]. Who will recount his generation? For his life is taken from the earth.
translation:
  language: tl
  text: Sa kanyang pagkakahamak, inalis sa kanya ang katarungan[b]. Sino ang makapagsasalaysay tungkol sa kanyang salinlahi[a]? Sapagkat inaalis sa lupa ang kanyang buhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanyang mga kaapu-apuhan” o “kanyang mga kapanahon.” Malawak at hindi tiyak ang kahulugan ng salitang Griyego na isinaling “salinlahi” sa siping ito mula sa Isaias 53.
    reason: alternative_reading
  - marker: b
    text: O “inalis sa kanya ang paghatol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώσει
  choice: pagkakahamak
  rationale: Ipinahihiwatig nito ang kalagayan ng matinding pagpapababa at paghamak na dinanas, nang hindi ipinapalagay na kusang pagpapakumbaba ang tinutukoy.
- source_word: κρίσις
  choice: katarungan
  rationale: Sa kontekstong legal at ng di-makatarungang pagdurusa, likas na ipinapahayag ng “katarungan” na ipinagkait sa kanya ang makatarungang paghatol o paglilitis; pinananatili sa talababa ang mas literal na alternatibong “paghatol.”
- source_word: ἤρθη
  choice: inalis sa kanya
  rationale: Tapat itong naghahayag ng pasibong pag-aalis o pagkakait at natural sa Filipino kasama ng “katarungan.”
- source_word: γενεὰν
  choice: salinlahi
  rationale: Malawak din ang saklaw ng “salinlahi” at hindi nito lubusang nilulutas kung mga kaapu-apuhan, mga kapanahon, o salinlahing kinabibilangan niya ang tinutukoy.
- source_word: διηγήσεται
  choice: makapagsasalaysay
  rationale: Ipinapahayag nito ang detalyadong pagkukuwento o paglalahad at ang retorikal na diwa ng tanong.
- source_word: αἴρεται
  choice: inaalis
  rationale: Pinananatili ng aspektong nagaganap ng “inaalis” ang masiglang kasalukuyang anyo ng Griyegong pandiwa.
- source_word: γῆς
  choice: lupa
  rationale: Ang “lupa” ang tuwirang katumbas at natural sa pahayag tungkol sa pag-aalis ng buhay mula sa daigdig ng mga nabubuhay.
- source_word: ζωὴ
  choice: buhay
  rationale: Tuwirang tumutukoy ito sa pisikal na buhay sa konteksto ng kamatayan ng nagdurusang lingkod.
theological_decisions:
- issue: Kahulugan ng “kanyang salinlahi”
  choice: Pinanatili sa pangunahing teksto ang malawak at hindi ganap na tiyak na “kanyang salinlahi.”
  alternative: “kanyang mga kaapu-apuhan” o “kanyang mga kapanahon”
  rationale: Mahirap tiyakin ang kahulugan ng pariralang hango sa Isaias 53. Pinananatili ng salin ang tunay na kalabuan sa halip na ipasya kung ang tinutukoy ay ang kanyang angkan, mga kapanahon, o panahon.
- issue: Diwa ng κρίσις
  choice: katarungan
  alternative: paghatol
  rationale: Sa konteksto, ipinakikita ng “katarungan” na ipinagkait ang makatarungang pagtrato o paglilitis. Gayunman, inilalagay sa talababa ang “paghatol” upang mapanatili ang leksikal na posibilidad.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinili ang “pagkakahamak” upang idiin ang dinanas na pagpapababa, at “salinlahi” upang mapanatili ang kalabuan ng sipi. Ang “inaalis” ay sadyang nagpapanatili sa kasalukuyang anyo ng huling pandiwang Griyego.
