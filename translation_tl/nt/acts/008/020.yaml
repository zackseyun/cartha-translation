source:
  edition: SBLGNT
  text: Πέτρος δὲ εἶπεν πρὸς αὐτόν· Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν ὅτι τὴν δωρεὰν τοῦ θεοῦ ἐνόμισας διὰ χρημάτων κτᾶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/020.yaml
  text: But Peter said to him[a], “May your silver perish with you[b], because you thought you could acquire the gift of God with money.”
translation:
  language: tl
  text: Ngunit sinabi ni Pedro sa kanya, “Mapahamak nawa ang salapi[a] mo, kasama ka, sapagkat inakala mong makakamit[b] mo sa pamamagitan ng pera ang kaloob ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pilak.” Ang salitang Griego ay literal na tumutukoy sa pilak o salaping pilak, na karaniwang ginagamit na pantukoy sa pera.
    reason: lexical_alternative
  - marker: b
    text: O “matamo” o “makuha.” Ang diwa ay itinuring ni Simon na ang kaloob ng Diyos ay maaaring makuha kapalit ng bayad.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριόν
  choice: salapi
  rationale: Literal itong tumutukoy sa pilak o salaping pilak, ngunit sa makabagong Tagalog, ang “salapi” ang likas at marangal na tawag sa perang tinutukoy rito. Napananatili rin nito ang bahagyang pagkakaiba sa χρημάτων, na isinaling “pera.”
- source_word: σὺν σοὶ
  choice: kasama mo
  rationale: Tuwirang ipinahahayag nito na kapuwa si Simon at ang kanyang salapi ang saklaw ng mabigat na pahayag ni Pedro.
- source_word: εἴη εἰς ἀπώλειαν
  choice: mapahamak nawa
  rationale: Ang optative na εἴη ay nagpapahayag ng isang matinding hangarin o sumpang pahayag. Ang “mapahamak nawa” ay likas sa Tagalog at hindi nagdaragdag ng tiyak na doktrina tungkol sa walang-hanggang kaparusahan.
- source_word: δωρεὰν
  choice: kaloob
  rationale: Ang “kaloob” ay natural at marangal na katumbas ng isang bagay na ibinigay, at malinaw ang pagsalungat nito sa pagtatangkang makamit iyon sa pera.
- source_word: ἐνόμισας
  choice: inakala mong
  rationale: Malinaw nitong ipinahahayag ang kahulugang ‘inisip’ o ‘ipinalagay,’ habang ang hulaping “-ng” ay natural na nag-uugnay sa kasunod na sugnay.
- source_word: διὰ χρημάτων
  choice: sa pamamagitan ng pera
  rationale: 'Tumpak nitong pinananatili ang instrumental na diwa ng διά na may genitive: pera ang paraang inaakalang magagamit upang makamit ang kaloob.'
- source_word: κτᾶσθαι
  choice: makakamit
  rationale: Sinasaklaw nito ang diwang ‘matamo’ o ‘makuha’ nang hindi ipinapalagay na ang pandiwa mismo ay nangangahulugang ‘bilhin’; ang komersiyal na ideya ay nasa pariralang “sa pamamagitan ng pera.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita nito ang pagsalungat ng tugon ni Pedro sa kahilingan ni Simon sa naunang talata.
theological_decisions:
- issue: Lakas at saklaw ng pahayag ni Pedro laban kay Simon at sa kanyang salapi
  choice: 'Isang matinding hangarin o sumpang pahayag ng kapahamakan: “Mapahamak nawa ang salapi mo kasama mo”'
  alternative: Isang tuwirang hula ng pagkawasak, o isang tahasang pormula ng walang-hanggang kaparusahan
  rationale: Ang optative εἴη ay mas angkop na katawanin bilang hangarin o imprekasyon kaysa simpleng pahayag ng mangyayari. Ang “mapahamak” ay nagpapanatili sa tindi at sa lawak ng ἀπώλεια nang hindi tahasang nilulutas kung pansamantala o pangwakas ang kapahamakang tinutukoy.
translation_notes:
  register: Makabago at madaling maunawaang Filipino na may marangal na himig. Ginamit ang “mapahamak nawa” upang mapanatili ang matinding optative na pahayag, at ang “kaloob ng Diyos” bilang natural na pariralang panrelihiyon nang hindi nag-aangkat ng denominasyonal na paliwanag.
