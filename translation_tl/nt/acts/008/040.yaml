  text: Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/040.yaml
  text: But Philip was found at Azotus[a], and as he passed through, he was proclaiming the good news to all the cities until he came to Caesarea.
translation:
  language: tl
  text: Ngunit natagpuan si Felipe sa Azoto[a]. Sa pagdaan niya, ipinangangaral niya ang mabuting balita sa lahat ng lungsod hanggang sa makarating siya sa Cesarea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “biglang lumitaw sa Azoto.” Mas literal na sinasabi ng Griyego na “natagpuan sa Azoto,” na sa konteksto ay maaaring magpahiwatig ng biglaang paglilipat ng Diyos nang hindi ito tahasang sinasabi.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ng banayad na paglipat o pagsalungat sa naunang pangyayari, kung saan biglang inalis ng Espiritu si Felipe.
- source_word: εὑρέθη
  choice: natagpuan
  rationale: Pinananatili ang neutral na anyong balintiyak ng Griyego at hindi tahasang ipinapakahulugan kung paano napunta roon si Felipe.
- source_word: εἰς Ἄζωτον
  choice: sa Azoto
  rationale: Sa konstruksiyong ito, tinutukoy ng εἰς ang kinalalagyan ni Felipe nang matagpuan siya; natural sa Tagalog ang “sa Azoto.”
- source_word: διερχόμενος
  choice: Habang naglalakbay siya sa lugar na iyon
  rationale: Ipinahahayag ang kasabay at nagpapatuloy na pagdaan ni Felipe sa rehiyon sa paraang malinaw sa modernong Tagalog.
- source_word: εὐηγγελίζετο
  choice: ipinangangaral niya ang mabuting balita
  rationale: Ipinakikita ng aspektong imperpekto ang patuloy o paulit-ulit na pagpapahayag; malinaw at hindi teknikal ang “mabuting balita.”
- source_word: τὰς πόλεις πάσας
  choice: sa lahat ng lungsod
  rationale: Tumutukoy sa kabuuan ng mga lungsod na dinaanan niya, na siyang mga lugar kung saan niya ipinahayag ang mabuting balita.
- source_word: ἕως τοῦ ἐλθεῖν αὐτὸν
  choice: hanggang sa makarating siya
  rationale: Natural na ipinahahayag sa Tagalog ang hangganan ng nagpapatuloy na paglalakbay at pangangaral.
- source_word: εἰς Καισάρειαν
  choice: sa Cesarea
  rationale: Tinutukoy ang destinasyon ng pagdating; “Cesarea” ang natural na anyong Filipino ng pangalan.
theological_decisions:
- issue: Kung dapat bang tahasang ipakahulugan ang εὑρέθη bilang mahimalang paglitaw o paglilipat kay Felipe
  choice: Panatilihin sa pangunahing teksto ang neutral na “natagpuan”
  alternative: “biglang lumitaw” o “natagpuan niya ang sarili niya” sa Azoto
  rationale: Malakas ang pahiwatig ng konteksto na kumilos ang Diyos, ngunit “natagpuan” lamang ang tahasang sinasabi ng Griyego. Hinahayaan nitong ang konteksto ang magpahiwatig ng pambihirang paglilipat nang hindi nagdaragdag ng interpretasyon sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang bahagyang pormal na himig ng salaysay, iniwasan ang teknikal na wikang pansimbahan, at ginamit ang “Azoto” at “Cesarea” bilang natural na anyong Filipino ng mga pangalang pantangi.
