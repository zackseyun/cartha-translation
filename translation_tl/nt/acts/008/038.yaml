  naturalness: Natural at malinaw ang “lumusong sa tubig” at “binautismuhan.” Mas maayos ang paralelong pagbanggit na “si Felipe at ang eunuko” kaysa “sina Felipe at ang eunuko,” na naghahalo ng panandang pangmaramihan at pang-isahang parirala.
  terminology: Panatilihin ang “karwahe,” “eunuko,” at “binautismuhan.” Ang mga ito ay tumutugma sa saklaw ng ἅρμα, εὐνοῦχος, at βαπτίζω nang hindi nagdadagdag ng interpretasyong doktrinal.
