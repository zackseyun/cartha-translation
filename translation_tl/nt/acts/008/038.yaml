base_translation:
  language: en
  yaml_path: translation/nt/acts/008/038.yaml
  text: And he ordered the chariot to stop[a], and both Philip and the eunuch went down into the water, and he baptized him.
translation:
  language: tl
  text: At iniutos niyang ihinto ang karwahe, at kapwa lumusong sa tubig si Felipe at ang eunuko, at binautismuhan ni Felipe ang eunuko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκέλευσεν στῆναι τὸ ἅρμα
  choice: ipinahinto niya ang karwahe
  rationale: Likas sa modernong Tagalog ang causative na “ipinahinto” para sa utos na patigilin ang sasakyan; pinananatili nito ang awtoritatibong diwa ng ἐκέλευσεν at ang idiomatikong kahulugan ng στῆναι kaugnay ng ἅρμα.
- source_word: ἅρμα
  choice: karwahe
  rationale: Sa konteksto ng paglalakbay ng opisyal, ang “karwahe” ay malinaw at natural na tawag sa sasakyang tinutukoy, nang hindi nagdaragdag ng detalyeng wala sa teksto.
- source_word: κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ
  choice: kapwa lumusong sa tubig
  rationale: Ang “kapwa” ay tahasang nagpapanatili sa ἀμφότεροι. Ang “lumusong sa tubig” ay likas na Tagalog at pinananatili ang direksiyonal na puwersa ng εἰς, na nagsasaad ng pagpasok sa tubig.
- source_word: ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος
  choice: sina Felipe at ang eunuko
  rationale: Malinaw nitong tinutukoy ang dalawang taong kapwa lumusong, habang iniiwasan ang mabigat na pag-uulit ng “kapwa.”
- source_word: εὐνοῦχος
  choice: eunuko
  rationale: Ang “eunuko” ang tuwirang katumbas at nagpapanatili ng leksikal na pagkakakilanlan ng lalaki sa salaysay; ang “opisyal” lamang ay maaaring magpalabo sa tahasang katawagan ng Griyego.
- source_word: ἐβάπτισεν αὐτόν
  choice: binautismuhan siya ni Felipe
  rationale: Ang “binautismuhan” ang kinikilalang neutral na salin ng βαπτίζω sa kontekstong Kristiyano. Ang tahasang pagbanggit kay Felipe bilang gumagawa ay natural sa Tagalog at nililinaw ang reperente ng pandiwa at panghalip.
theological_decisions:
- issue: Kung dapat bang ipasiya ng salin ang paraan ng bautismo
  choice: Panatilihin ang “lumusong sa tubig” at “binautismuhan” nang walang dagdag na paglalarawan sa paraan.
  alternative: Isalin ang βαπτίζω bilang “inilubog,” o pahinain ang εἰς bilang paglapit lamang “sa may tubig.”
  rationale: Malinaw sa Griyego na kapwa pumasok sa tubig at binautismuhan ni Felipe ang eunuko, ngunit hindi dapat magdagdag ang salin ng denominasyonal na konklusyon tungkol sa eksaktong paraan ng bautismo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “karwahe” bilang natural na katawagan sa sasakyan at “eunuko” para sa tuwirang leksikal na pagpapatuloy. Hindi kailangan ang talababa dahil ang “lumusong sa tubig” ay natural na naipapahayag ang karaniwang direksiyonal na diwa ng εἰς nang hindi isinasara ang teolohikal na usapin.
