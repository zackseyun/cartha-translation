    text: Ang salitang Griyego ay maaari ring tumukoy sa isang opisyal ng palasyo sa ilang konteksto, ngunit malamang na literal na “eunuko” ang ibig sabihin dito.
    reason: lexical_alternative
  - marker: b
    text: Ang “Candace” ay maaaring isang titulong dinastiko ng reyna, hindi personal na pangalan.
    reason: cultural_note
  revision_rationale: Pinalitan ang “umalis” ng “naglakbay” upang maipahayag ang ἐπορεύθη, at inayos ang huling sugnay bilang “nagpunta na” upang ipakita ang naunang kilos ng ἐληλύθει. Ginawang “At narito” ang pantawag-pansin para sa ἰδού. Pinanatili ang literal na “eunuko,” ang mataas na katungkulan ng lalaki, ang kaugnayan niya kay Candace, at ang dalawang talababa. Ang panghalip na “nito” ay natural na tumutukoy kay Candace bilang reyna at iniiwasan ang paulit-ulit na “ng reyna.”
