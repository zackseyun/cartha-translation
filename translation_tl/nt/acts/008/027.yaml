  text: καὶ ἀναστὰς ἐπορεύθη, καὶ ἰδοὺ ἀνὴρ Αἰθίοψ εὐνοῦχος δυνάστης ⸀Κανδάκης βασιλίσσης Αἰθιόπων, ὃς ἦν ἐπὶ πάσης τῆς γάζης αὐτῆς, ὃς ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/027.yaml
  text: So he got up and went[a]. And behold, an Ethiopian man, a eunuch, a high official of Candace, queen of the Ethiopians, who was over all her treasury, had come to Jerusalem to worship[b],
translation:
  language: tl
  text: Kaya bumangon siya at naglakbay. At narito, isang lalaking Etiope—isang eunuko at mataas na opisyal ni Candace, reyna ng mga Etiope—na namamahala sa buong kabang-yaman nito at nagpunta na sa Jerusalem upang sumamba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: bumangon
  rationale: Likas na salin ng aorist participle na nagpapakita ng pagkilos bago ang pangunahing pandiwa; hindi nito ipinapalagay na nakahiga siya.
- source_word: ἐπορεύθη
  choice: umalis
  rationale: Sa konteksto ng pagsunod sa utos na maglakbay, malinaw at natural na ipinahihiwatig nito na humayo siya.
- source_word: ἰδοὺ
  choice: At naroon
  rationale: Pinananatili ang pantawag-pansing gamit ng ἰδού sa salaysay nang hindi gumagamit ng makalumang pananalita.
- source_word: ἀνὴρ Αἰθίοψ
  choice: isang lalaking Etiope
  rationale: Pinananatili ang tahasang ἀνήρ at ang katawagang etniko, sa natural at maikling anyong Tagalog.
- source_word: εὐνοῦχος
  choice: eunuko
  rationale: Ito ang pangunahing literal na kahulugan at hindi ito inuulit lamang ang ranggong opisyal na malinaw nang ipinahahayag ng δυνάστης.
- source_word: δυνάστης
  choice: mataas na opisyal
  rationale: Ipinahahayag ang kapangyarihan at mataas na katungkulan ng lalaki nang hindi siya tinatawag na isang nagsasariling pinuno.
- source_word: Κανδάκης βασιλίσσης Αἰθιόπων
  choice: ni Candace, reyna ng mga Etiope
  rationale: Malapit sa anyo ng Griyego at pinananatili ang Candace sa teksto habang ipinapaliwanag sa talababa na maaaring titulo ito.
- source_word: ἐπὶ πάσης τῆς γάζης αὐτῆς
  choice: namamahala sa buong kabang-yaman ng reyna
  rationale: Ipinakikita kapuwa ang pananagutang administratibo ng ἐπί at ang kabang-yamang tinutukoy ng γάζα; nilinaw ang reperente ng panghalip para sa natural na Tagalog.
- source_word: ἐληλύθει
  choice: nagpunta
  rationale: Ipinahahayag ang naunang pagpunta ng opisyal; malinaw na ang ugnayang temporal sa pagkakasunod ng salaysay kahit walang tahasang katumbas ng pluperfect sa karaniwang Tagalog.
- source_word: προσκυνήσων
  choice: upang sumamba
  rationale: Natural na ipinahahayag ang layunin ng future participle sa konteksto ng paglalakbay sa Jerusalem.
- source_word: εἰς Ἰερουσαλήμ
  choice: sa Jerusalem
  rationale: Karaniwang Tagalog para sa direksiyon o destinasyon patungo sa isang lungsod.
theological_decisions:
- issue: Kung literal na “eunuko” o mas pangkalahatang “opisyal ng palasyo” ang εὐνοῦχος
  choice: eunuko
  alternative: opisyal ng palasyo
  rationale: Ang literal na kahulugan ang karaniwan at malamang na mahalaga sa pagkakakilanlan ng tauhan. Bukod dito, ipinahahayag na ng δυνάστης ang kanyang katungkulan, kaya mawawala ang isang tunay na aspekto ng teksto kung “opisyal” lamang ang gagamitin.
- issue: Kung personal na pangalan o titulong dinastiko ang Κανδάκη
  choice: Candace sa pangunahing teksto, na may talababa tungkol sa posibilidad na titulo ito
  alternative: Kandake bilang titulong maharlika
  rationale: Hindi tiyak sa anyong Griyego lamang kung paano ito mauunawaan ng mambabasa; pinananatili ng transliterasyon ang tradisyonal na anyo habang hindi ikinukubli ang makasaysayang posibilidad na ito ay titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “At naroon” bilang natural na pantawag-pansin, at hinati ang mahabang pangungusap na Griyego upang maging madaling maunawaan nang hindi inaalis ang mga ugnayan ng mga sugnay.
