revisions:
- from: Kaya bumangon siya at umalis. At naroon ang isang lalaking Etiope, isang eunuko[a] at mataas na opisyal ni Candace[b], reyna ng mga Etiope. Siya ang namamahala sa buong kabang-yaman ng reyna at nagpunta sa Jerusalem upang sumamba.
  to: Kaya bumangon siya at naglakbay. At narito, isang lalaking Etiope—isang eunuko at mataas na opisyal ni Candace, reyna ng mga Etiope—na namamahala sa buong kabang-yaman nito at nagpunta na sa Jerusalem upang sumamba.
  rationale: Pinalitan ang “umalis” ng “naglakbay” upang maipahayag ang ἐπορεύθη, at inayos ang huling sugnay bilang “nagpunta na” upang ipakita ang naunang kilos ng ἐληλύθει. Ginawang “At narito” ang pantawag-pansin para sa ἰδού. Pinanatili ang literal na “eunuko,” ang mataas na katungkulan ng lalaki, ang kaugnayan niya kay Candace, at ang dalawang talababa. Ang panghalip na “nito” ay natural na tumutukoy kay Candace bilang reyna at iniiwasan ang paulit-ulit na “ng reyna.”
