id: ACT.8.14
reference: Acts 8:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ οἱ ἐν Ἱεροσολύμοις ἀπόστολοι ὅτι δέδεκται ἡ Σαμάρεια τὸν λόγον τοῦ θεοῦ, ἀπέστειλαν πρὸς ⸀αὐτοὺς Πέτρον καὶ Ἰωάννην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/014.yaml
  text: When the apostles in Jerusalem heard that Samaria had received the word of God, they sent Peter and John to them,
translation:
  language: tl
  text: Nang mabalitaan ng mga apostol na nasa Jerusalem na tinanggap ng Samaria ang salita ng Diyos, isinugo nila sina Pedro at Juan sa kanila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: Nang mabalitaan
  rationale: Ang aorist participle ay nagbibigay ng pangyayaring nauna sa pangunahing pandiwa. Natural sa Tagalog ang “Nang mabalitaan” at ipinahihiwatig na nakarating sa mga apostol ang balita.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay ito sa pagpapatuloy ng salaysay. Hindi kailangan ng hiwalay na “ngayon” o “ngunit” sa Tagalog, sapagkat natural nang naipapakita ng sugnay na “Nang” ang pag-usad ng salaysay.
- source_word: οἱ ἐν Ἱεροσολύμοις ἀπόστολοι
  choice: ang mga apostol na nasa Jerusalem
  rationale: Tuwirang ipinakikita na ang tinutukoy ay ang mga apostol na naroroon sa Jerusalem.
- source_word: δέδεκται
  choice: tinanggap
  rationale: Ang perfect form ay tumutukoy sa natapos na pagtanggap na may nananatiling bunga. Sa kontekstong pasalaysay, malinaw at natural ang “tinanggap”; naipahihiwatig ng “Nang mabalitaan” na nauna na ang pagtanggap.
- source_word: ἡ Σαμάρεια
  choice: ang Samaria
  rationale: Pinananatili ang pangalang-pook na ginagamit nang metonimiko para sa mga naninirahan doon, gaya ng Griyego, nang hindi pinapaliit ang sanggunian sa mas tiyak na “mga Samaritano.”
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Pinananatili nito ang karaniwang biblikal na pananalita at ang lawak ng kahulugan ng λόγος, sa halip na agad itong paliitin sa “mensahe.”
- source_word: ἀπέστειλαν
  choice: isinugo nila
  rationale: Ang “isinugo” ay natural at marangal na katumbas ng pagpapadala ng mga kinatawan, at angkop sa konteksto ng mga apostol.
- source_word: πρὸς αὐτοὺς
  choice: roon
  rationale: Ang panghalip na Griyego ay tumutukoy sa mga taong kinakatawan ng “Samaria.” Mas natural sa Tagalog ang “roon” kasunod ng metonimikong pangalang-pook at hindi nito kailangang gawing tahasan ang “mga Samaritano.”
- source_word: Πέτρον καὶ Ἰωάννην
  choice: sina Pedro at Juan
  rationale: Ginamit ang karaniwang anyong Tagalog ng mga pangalan at ang pantukoy na “sina” para sa dalawang tao.
theological_decisions:
- issue: Metonimikong gamit ng “Samaria”
  choice: tinanggap ng Samaria ang salita ng Diyos
  alternative: tinanggap ng mga Samaritano ang salita ng Diyos
  rationale: Ang Griyego ay gumagamit ng pangalang-pook bilang kolektibong tawag sa mga tao roon. Pinananatili ng salin ang anyong ito at iniiwasang magdagdag ng mas makitid na pagpapakahulugan.
- issue: Pagpapakahulugan sa λόγος
  choice: salita ng Diyos
  alternative: mensahe ng Diyos
  rationale: Pinananatili ng “salita” ang pamilyar na biblikal na idyoma at teolohikal na lalim, habang nauunawaan sa konteksto na ito ang ipinahayag na mensahe ng Diyos.
- issue: Ugnayan ng pagtanggap ng Samaria at pagsusugo ng mga apostol
  choice: Walang idinagdag na paliwanag sa dahilan o teolohikal na kahulugan ng pagsusugo
  alternative: Ipaliwanag na isinugo sila upang pagtibayin, siyasatin, o gawaran ng Espiritu ang mga mananampalataya
  rationale: Hindi tinutukoy ng talatang ito mismo ang layunin ng pagsusugo; ang pagdaragdag nito ay magpapasya nang lampas sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at angkop sa pagbasa nang malakas. Ginamit ang “mabalitaan” para sa natural na daloy ng salaysay, “isinugo” para sa marangal ngunit pangkaraniwang rehistro, at pinanatili ang “Samaria” at “salita ng Diyos” upang manatiling malapit sa Griyego.
