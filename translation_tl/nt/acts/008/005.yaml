  text: Φίλιππος δὲ κατελθὼν εἰς ⸀τὴν πόλιν τῆς Σαμαρείας ἐκήρυσσεν αὐτοῖς τὸν χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/005.yaml
  text: Philip went down to the city of Samaria and proclaimed the Messiah to them[a][b].
translation:
  language: tl
  text: Bumaba si Felipe sa lungsod ng Samaria[a][b] at ipinahayag niya sa kanila ang Mesiyas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang lungsod sa Samaria.” Maaaring tumukoy ang Griyego sa lungsod ng Samaria o sa isang lungsod sa rehiyon ng Samaria.
    reason: alternative_reading
  - marker: b
    text: O “sa lungsod ng Samaria.”
    reason: previous_rendering
lexical_decisions:
- source_word: δὲ
  choice: Hindi isinalin nang tahasan
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay. Hindi kailangan ng hiwalay na “ngayon” o “ngunit” sa natural na Tagalog.
- source_word: κατελθὼν
  choice: Bumaba
  rationale: Pinananatili ang direksiyonal na diwa ng κατέρχομαι at natural na isinama sa sunod-sunod na kilos sa Tagalog.
- source_word: τὴν πόλιν τῆς Σαμαρείας
  choice: sa lungsod ng Samaria
  rationale: Sinusunod ang tiyak na anyo ng Griyego, habang ang posibleng di-tiyak na pagkaunawa ay inilalagay sa talababa.
- source_word: ἐκήρυσσεν
  choice: ipinahayag
  rationale: Ipinahihiwatig nito ang hayagan at pampublikong pagpapahayag nang hindi nalilimitahan sa makabagong teknikal na gamit ng “nangaral.”
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwirang ipinakikita ang mga taong pinatunguhan ng pagpapahayag ni Felipe.
- source_word: τὸν χριστόν
  choice: ang Mesiyas
  rationale: Gumaganap dito ang Χριστός bilang titulo ng ipinangakong pinahiran, kaya “Mesiyas” ang malinaw at angkop na salin.
theological_decisions:
- issue: Pagkasalin sa Χριστός
  choice: Mesiyas
  alternative: Cristo / ang Cristo
  rationale: Sa konteksto ng ipinahahayag ni Felipe, ang salita ay gumaganap bilang titulo, hindi lamang bilang pangalang pantangi. Pinananatili ng “Mesiyas” ang kaugnayan nito sa pag-asang Judio nang hindi nagdaragdag ng denominasyonal na paliwanag.
- issue: Pagkakakilanlan ng πόλις τῆς Σαμαρείας
  choice: ang lungsod ng Samaria
  alternative: isang lungsod sa Samaria
  rationale: May pantukoy ang πόλιν sa tekstong Griyego, ngunit maaaring tumukoy ang parirala sa partikular na lungsod o sa isang lungsod sa rehiyon. Pinanatili sa pangunahing teksto ang mas pormal na tiyak na anyo at inilagay sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabagong Filipino Tagalog na payak ngunit marangal. Ginamit ang “ipinahayag” para sa pampublikong paghahayag at “Mesiyas” bilang titulong madaling maunawaan. Ang mga panandang talababa [a] at [b] ay kapuwa nasa pangunahing teksto.
