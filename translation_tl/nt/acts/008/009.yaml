  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀνὴρ δέ τις ὀνόματι Σίμων προϋπῆρχεν ἐν τῇ πόλει μαγεύων καὶ ⸀ἐξιστάνων τὸ ἔθνος τῆς Σαμαρείας, λέγων εἶναί τινα ἑαυτὸν μέγαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/009.yaml
  text: A certain man named Simon had previously been in the city practicing magic and astonishing the people of Samaria[a], saying that he himself was someone great[b],
translation:
  language: tl
  text: May isang lalaking nagngangalang Simon na dati nang nasa lungsod at nagsasagawa ng mahika[a], na pinamamangha ang mga taga-Samaria at sinasabing siya mismo ay isang dakilang tao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagsasagawa ng pangkukulam.” Tumutukoy ang pandiwang Griyego sa pagsasagawa ng mga gawaing mahika.
    reason: lexical_alternative
  - marker: b
    text: O “siya ay isang taong dakila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: May isang lalaki
  rationale: Tinutukoy ng ἀνήρ ang isang lalaki, at ipinahihiwatig ng τις na hindi pa tiyak na kilala sa salaysay ang bagong tauhan. Ang δέ ay banayad na panandang paglilipat at hindi kailangang tumbasan ng tahasang pang-ugnay sa natural na Tagalog.
- source_word: ὀνόματι Σίμων
  choice: nagngangalang Simon
  rationale: Likas na ekspresyon sa Tagalog para sa dative na ὀνόματι kasama ng pangalang pantangi.
- source_word: προϋπῆρχεν ἐν τῇ πόλει
  choice: dati nang nasa lungsod
  rationale: Ipinapanatili ng “dati na” ang naunang pag-iral o presensiya na ipinahihiwatig ng imperfect na προϋπῆρχεν, nang hindi dinaragdagan ang tagal nito.
- source_word: μαγεύων
  choice: nagsasagawa ng mahika
  rationale: Tuwirang inilalarawan ang patuloy na paggawa ng mga gawaing mahika nang hindi ipinapasok ang isang paliwanag tungkol sa pinagmumulan o tunay na bisa ng mga ito.
- source_word: ἐξιστάνων τὸ ἔθνος τῆς Σαμαρείας
  choice: labis na pinanggigilalas ng mga taga-Samaria
  rationale: Ipinahahayag ng ἐξιστάνων ang pagdudulot ng matinding pagkamangha. Ang “mga taga-Samaria” ay natural na pagtukoy sa kolektibong populasyon, sa halip na gawing politikal ang ἔθνος bilang “bansa.”
- source_word: λέγων
  choice: Sinasabi niyang
  rationale: Malapit ito sa payak na λέγων at hindi agad hinahatulan bilang huwad ang pahayag ni Simon.
- source_word: εἶναί τινα ἑαυτὸν μέγαν
  choice: siya mismo ay isang dakilang tao
  rationale: Ipinananatili ng “siya mismo” ang diin ng ἑαυτόν, samantalang ang “isang dakilang tao” ay natural na naghahatid ng τινα … μέγαν bilang pag-aangkin ng kadakilaan o mataas na kahalagahan.
theological_decisions:
- issue: Paglalarawan sa gawain ni Simon
  choice: “nagsasagawa ng mahika”
  alternative: “nagsasagawa ng pangkukulam”
  rationale: Sapat na inilalarawan ng talata ang pagsasagawa niya ng mga sining na mahika ngunit hindi nito tahasang sinasabi kung pandaraya, kapangyarihang espirituwal, o iba pa ang pinagmumulan. Hindi iyon nilulutas ng salin.
- issue: Pag-aangkin ni Simon tungkol sa sarili
  choice: “siya mismo ay isang dakilang tao”
  alternative: “siya ay isang taong mahalaga”
  rationale: Pinananatili ng “dakila” ang malakas at sadyang malawak na μέγαν, pati ang tensiyon ng sariling pagdakila ni Simon, nang hindi tinutukoy kung anong uri ng kadakilaan ang inaangkin niya.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “mahika” bilang madaling maunawaang katawagan at ang “pinanggigilalas” upang maipahayag ang matinding pagkamangha nang hindi nagiging kolokyal. Hinati sa dalawang pangungusap para sa malinaw at natural na daloy sa Tagalog.
