  yaml_path: translation/nt/acts/008/004.yaml
  text: So those who had been scattered went through the region proclaiming the word[a][b][c].
translation:
  language: tl
  text: Kaya ang mga nangalat ay naglakbay sa iba’t ibang lugar habang ipinangangaral ang mensahe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “ibinabalita bilang mabuting balita ang salita”; tumutukoy ito sa mensahe tungkol kay Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν
  choice: Kaya ang mga
  rationale: Ipinahihiwatig ng οὖν ang bunga ng naunang pag-uusig at pangangalat. Likas sa Tagalog ang “Kaya,” samantalang hindi kailangang isalin nang hiwalay ang μέν na gumaganap bilang panandang pandiskurso.
- source_word: διασπαρέντες
  choice: nangalat
  rationale: Ang aorist passive participle ay tumutukoy sa mga mananampalatayang naikalat dahil sa pag-uusig. Sa Tagalog, natural at malinaw ang “nangalat” sa kontekstong ito nang hindi nangangailangan ng mabigat na pasibong anyo.
- source_word: διῆλθον
  choice: naglakbay sa iba’t ibang lugar
  rationale: Ipinahihiwatig ng διέρχομαι rito ang pagpunta sa iba’t ibang lugar, hindi lamang ang minsanang pagdaan. Ginagawang malinaw ng salin ang naglalakbay na pagkilos nang hindi nagdaragdag ng tiyak na rehiyong wala sa Griyego.
- source_word: εὐαγγελιζόμενοι
  choice: habang ipinangangaral
  rationale: Ipinapakita ng participle ang kasabay at patuloy na gawain habang naglalakbay sila. Ang “ipinangangaral” ay dignified at madaling maunawaan; ipinaliliwanag sa talababa ang likas na diwa ng pagbabalita ng mabuting balita.
- source_word: τὸν λόγον
  choice: ang mensahe
  rationale: Sa konteksto, ang λόγος ay ang mensaheng Kristiyano tungkol kay Jesus. Mas natural at malinaw sa modernong Tagalog ang “mensahe” kaysa sa literal na “salita,” na maaaring mapagkamalang isang kataga lamang.
theological_decisions:
- issue: Pagpapakahulugan sa εὐαγγελιζόμενοι τὸν λόγον
  choice: ipinangangaral ang mensahe
  alternative: ibinabalita bilang mabuting balita ang salita
  rationale: Direktang layon ng pandiwang εὐαγγελίζομαι ang τὸν λόγον; ang mismong mensahe ang ibinabalita bilang mabuting balita. Iniiwasan ng salin ang di-likas na pariralang “mabuting balita ng salita” at hindi rin nagdaragdag ng “ng Diyos,” na wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “mensahe” upang ihatid ang kontekstuwal na diwa ng λόγος, habang pinananatili sa talababa ang mas literal na anyo at ang diwa ng εὐαγγελίζομαι.
