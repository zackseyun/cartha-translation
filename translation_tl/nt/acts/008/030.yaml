  text: προσδραμὼν δὲ ὁ Φίλιππος ἤκουσεν αὐτοῦ ἀναγινώσκοντος ⸂Ἠσαΐαν τὸν προφήτην⸃ καὶ εἶπεν· Ἆρά γε γινώσκεις ἃ ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/030.yaml
  text: So Philip ran up and heard him reading Isaiah the prophet[a], and said, “Do you really understand what you are reading?”
translation:
  language: tl
  text: Kaya tumakbo si Felipe papunta sa kanya at narinig niyang binabasa nito ang aklat ni propeta Isaias. Sinabi niya, “Nauunawaan mo ba talaga[a] ang binabasa mo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Nauunawaan mo nga ba ang binabasa mo?” Nagbibigay-diin sa tanong ni Felipe ang mga partikula sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμὼν
  choice: tumakbo ... papunta sa kanya
  rationale: Ipinahahayag ng aorist participle ng προστρέχω ang mabilis na pagtakbo patungo sa lalaki; pinananatili ng salin ang buhay na kilos at direksiyon.
- source_word: δὲ
  choice: Kaya
  rationale: Dito, nagsisilbi ang δέ bilang pang-ugnay sa pagpapatuloy ng salaysay; likas sa Filipino ang “Kaya” sa kontekstong ito.
- source_word: ἤκουσεν αὐτοῦ ἀναγινώσκοντος
  choice: narinig niyang binabasa nito
  rationale: Ipinahihiwatig ng konstruksiyong ἀκούω kasama ang genitive participle na narinig ni Felipe ang lalaki habang nagbabasa. Hindi idinagdag ang “nang malakas” dahil hindi iyon tahasang nakasaad sa Griyego.
- source_word: Ἠσαΐαν τὸν προφήτην
  choice: ang propetang si Isaias
  rationale: Ginagamit sa Griyego ang pangalan ng propeta bilang metonimiya para sa kaniyang isinulat. Ang pariralang ito ay pamilyar at marangal sa Filipino nang hindi tahasang nagdaragdag ng “aklat” o “isinulat.”
- source_word: εἶπεν
  choice: Sinabi niya
  rationale: Tuwirang katumbas ito ng λέγω; malinaw naman sa kasunod na tuwirang pananalita na isang tanong ang sinabi.
- source_word: Ἆρά γε
  choice: ba talaga
  rationale: Pinananatili ng “ba” ang anyong patanong at ng “talaga” ang diin o mapanuring lakas ng pinagsamang mga partikulang ἆρα γε.
- source_word: γινώσκεις
  choice: Nauunawaan mo
  rationale: Sa konteksto, tumutukoy ang γινώσκω sa pagkaunawa sa kahulugan ng binabasa, hindi lamang sa pagkilala o pagkakaalam.
- source_word: ἃ ἀναγινώσκεις
  choice: ang binabasa mo
  rationale: Tumutukoy ang panghalip na ἃ sa nilalaman ng kasalukuyang binabasa; natural na naipapahayag ito sa Filipino sa aspektong imperpektibo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nito” upang malinaw na ang lalaking nilapitan ni Felipe ang nagbabasa, at pinanatili ang idiomang “ang propetang si Isaias” bilang likas na metonimiya para sa akda ng propeta.
