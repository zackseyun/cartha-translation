  text: Σαῦλος δὲ ἐλυμαίνετο τὴν ἐκκλησίαν κατὰ τοὺς οἴκους εἰσπορευόμενος, σύρων τε ἄνδρας καὶ γυναῖκας παρεδίδου εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/003.yaml
  text: But Saul was ravaging the church[a], entering house after house; dragging off both men and women[b], he was handing them over to prison.
translation:
  language: tl
  text: Ngunit winawasak ni Saulo ang iglesya. Pumapasok siya sa mga bahay-bahay, kinakaladkad ang mga lalaki at babae, at ipinauubaya sila upang ibilanggo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλυμαίνετο
  choice: winawasak
  rationale: 'Malakas ang diwa ng pandiwa: marahas at patuloy na pamiminsala, hindi lamang pangkalahatang pag-uusig. Ipinahihiwatig ng aspektong imperpektibo ang nagpapatuloy o paulit-ulit na pagkilos.'
- source_word: τὴν ἐκκλησίαν
  choice: ang iglesya
  rationale: Sa konteksto ng Mga Gawa, tumutukoy ito sa pamayanan ng mga mananampalataya; pamilyar at angkop sa modernong Tagalog ang “iglesya.”
- source_word: κατὰ τοὺς οἴκους
  choice: ang sunod-sunod na bahay
  rationale: 'Ipinakikita nito ang distributibong diwa ng κατά kasama ng pangmaramihang οἴκους: isa-isang bahay ang pinapasok.'
- source_word: εἰσπορευόμενος
  choice: pinapasok niya
  rationale: Natural na inilalahad sa Tagalog ang kasabay at paulit-ulit na pagkilos na siyang paraan ng pamiminsala ni Saulo.
- source_word: σύρων
  choice: kinakaladkad palabas
  rationale: Pinananatili ng “kinakaladkad” ang puwersa at karahasan ng σύρω; nililinaw ng “palabas” ang pagkuha sa kanila mula sa mga bahay, ayon sa konteksto.
- source_word: ἄνδρας καὶ γυναῖκας
  choice: ang mga lalaki at mga babae
  rationale: 'Tahasan nitong pinananatili ang saklaw ng teksto: kapwa lalaki at babae ang dinadakip.'
- source_word: παρεδίδου
  choice: ipinapasok sila
  rationale: Sa pariralang may “sa bilangguan,” natural itong nagsasaad na paulit-ulit silang ipinauubaya sa opisyal na pagkakapiit, bagaman hindi inuulit nang tahasan ang ideya ng “paghahatid.”
- source_word: εἰς φυλακήν
  choice: sa bilangguan
  rationale: Tumutukoy ito sa kulungan o opisyal na pagkakapiit; dignified at malinaw ang “bilangguan.”
theological_decisions:
- issue: Tindi ng ginawa ni Saulo laban sa iglesya bago ang kanyang pagbabalik-loob
  choice: winawasak ni Saulo ang iglesya
  alternative: inuusig ni Saulo ang iglesya
  rationale: Mas malakas kaysa karaniwang “inuusig” ang λυμαίνομαι at naglalarawan ng marahas, sistematikong pamiminsala. Hindi nito ipinapasok ang anumang paliwanag na teolohikal na wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang mga aspektong imperpektibo (“winawasak,” “pinapasok,” “kinakaladkad,” “ipinapasok”) upang maipakita ang nagpapatuloy at paulit-ulit na pagkilos. Walang talababa dahil walang tunay na kalabuan na kailangang ilagay sa aparatong tekstuwal; ang mga marker sa ibinigay na English POB ay tila hindi tugma sa mismong mga talababa nito.
