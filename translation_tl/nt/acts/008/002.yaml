  text: συνεκόμισαν δὲ τὸν Στέφανον ἄνδρες εὐλαβεῖς καὶ ⸀ἐποίησαν κοπετὸν μέγαν ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/002.yaml
  text: But devout men buried Stephen and made great lamentation over him[a][b].
translation:
  language: tl
  text: Ngunit inilibing si Esteban ng mga lalaking maka-Diyos[a], at labis nila siyang ipinagluksa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inihanda si Esteban para sa libing” o “dinala si Esteban upang ilibing.” Maaaring bigyang-diin ng pandiwang Griyego ang pag-aasikaso o pagdadala sa bangkay, gayundin ang mismong paglilibing.
    reason: lexical_alternative
  - marker: b
    text: Ang “labis na ipinagluksa” ay maaaring tumukoy sa hayagan at maririnig na mga pagpapahayag ng dalamhati, hindi lamang sa panloob na kalungkutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκόμισαν
  choice: inilibing
  rationale: Sa konteksto ng pagkamatay ni Esteban, tumutukoy ang pandiwa sa pag-aasikaso at pagdadala sa kaniyang bangkay hanggang sa paglilibing. Ang “inilibing” ang pinakanatural na buod ng kilos sa makabagong Tagalog, habang inilalahad sa talababa ang mas literal na saklaw.
- source_word: δέ
  choice: Ngunit
  rationale: Nagpapahiwatig ito ng banayad na paglipat o pagsalungat sa marahas na pagkamatay ni Esteban sa naunang salaysay.
- source_word: ἄνδρες εὐλαβεῖς
  choice: mga lalaking maka-Diyos
  rationale: Pinananatili ng “mga lalaki” ang tiyak na panlalaking anyo ng ἄνδρες, at natural na ipinapahayag ng “maka-Diyos” ang taimtim na paggalang at debosyon ng εὐλαβεῖς.
- source_word: ἐποίησαν κοπετὸν μέγαν
  choice: labis nila siyang ipinagluksa
  rationale: Idyomatiko sa Tagalog ang “ipinagluksa,” at malinaw na naipapahayag ng “labis” ang tindi ng μέγαν. Ang panlabas at hayagang katangian na maaaring taglayin ng κοπετός ay pinananatili sa talababa.
- source_word: ἐπ’ αὐτῷ
  choice: siyang ipinagluksa
  rationale: Isinasama ng hulaping panghalip sa pandiwang “ipinagluksa” ang diwa ng pagluluksa para kay Esteban nang natural at maikli sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “Esteban,” ang karaniwang anyong Filipino ng pangalan. Pinili ang idyomatikong “labis nila siyang ipinagluksa” sa halip na ang mas literal ngunit di-gaanong natural na “gumawa sila ng malaking panaghoy.”
