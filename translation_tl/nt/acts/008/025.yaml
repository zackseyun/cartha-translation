  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διαμαρτυράμενοι καὶ λαλήσαντες τὸν λόγον τοῦ κυρίου ⸀ὑπέστρεφον εἰς ⸀Ἱεροσόλυμα, πολλάς τε κώμας τῶν Σαμαριτῶν ⸀εὐηγγελίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/025.yaml
  text: So[a], after they had solemnly testified and spoken the word of the Lord, they were returning to Jerusalem[b], and were proclaiming the good news in many Samaritan villages.
translation:
  language: tl
  text: Kaya, matapos silang taimtim na magpatotoo at magpahayag ng salita ng Panginoon, bumabalik sila sa Jerusalem at ipinangangaral ang mabuting balita sa maraming nayon ng mga Samaritano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαμαρτυράμενοι
  choice: taimtim na magpatotoo
  rationale: Ipinahahayag ang seryoso at mariing diwa ng pandiwa nang hindi nililimitahan ito sa kahulugang ‘magbabala.’
- source_word: λαλήσαντες
  choice: magsalita
  rationale: Tuwirang katumbas na angkop dahil kasunod ang layong ‘salita ng Panginoon’; hindi na kailangang dagdagan ng paliwanag.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: salita ng Panginoon
  rationale: Pinananatili ang karaniwang biblikal na katumbas ng λόγος at ang teolohikal na taginting ng κύριος.
- source_word: ὑπέστρεφον
  choice: pabalik na sila
  rationale: Ipinakikita ang nagpapatuloy na kilos ng imperfect at natural itong pakinggan sa makabagong Tagalog.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lugar sa Filipino.
- source_word: πολλάς τε κώμας τῶν Σαμαριτῶν
  choice: sa maraming nayon ng mga Samaritano
  rationale: Malapit sa estruktura ng Griyego at malinaw na pinananatili ang tahasang pagtukoy sa mga Samaritano.
- source_word: εὐηγγελίζοντο
  choice: ipinangangaral ang magandang balita
  rationale: Malinaw at likas na pagpapahayag ng patuloy na pagpapalaganap ng mabuting balita, nang hindi umaasa sa teknikal na salitang pansimbahan.
theological_decisions:
- issue: Pagkakakilanlan ng di-tahasang simuno
  choice: Pinanatili ang ‘sila’ nang hindi nagdaragdag ng mga pangalan.
  alternative: Tahasang tukuyin sina Pedro at Juan.
  rationale: Bagaman ipinakikilala ng konteksto sina Pedro at Juan, plural lamang ang simuno sa Griyego; hindi dapat magpasok sa talata ng mga pangalang wala rito.
- issue: Ugnayan ng pagbabalik at pangangaral
  choice: Ginamit ang ‘habang’ upang ipakitang kasabay ng pagbabalik ang patuloy na pangangaral.
  alternative: 'Ihanay bilang dalawang payak na kilos: ‘bumalik sila ... at ipinangaral nila.’'
  rationale: Parehong imperfect ang ὑπέστρεφον at εὐηγγελίζοντο, kaya ang salin ay nagpapanatili ng nagpapatuloy at magkakaugnay na mga kilos.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinili ang ‘taimtim na magpatotoo’ upang mapanatili ang bigat ng διαμαρτύρομαι, at ‘magandang balita’ bilang malinaw na katumbas ng εὐαγγελίζομαι. Walang footnote dahil walang mahalagang tekstuwal o leksikal na kalabuan na kailangang ilahad sa mambabasa sa talatang ito.
