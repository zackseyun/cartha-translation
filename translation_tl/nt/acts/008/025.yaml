revisions:
- from: Kaya, matapos silang taimtim na magpatotoo at magsalita ng salita ng Panginoon, pabalik na sila sa Jerusalem habang ipinangangaral ang magandang balita sa maraming nayon ng mga Samaritano.
  to: Kaya, matapos silang taimtim na magpatotoo at magpahayag ng salita ng Panginoon, bumabalik sila sa Jerusalem at ipinangangaral ang mabuting balita sa maraming nayon ng mga Samaritano.
  rationale: Inayos ang kolokasyon para sa likas na modernong Filipino, pinanatili ang bigat ng διαμαρτυράμενοι sa “taimtim na magpatotoo,” at isinalin ang dalawang imperfect bilang magkaugnay na patuloy na kilos nang hindi ipinapataw ang mas tiyak na kahulugang “habang.” Walang footnote na kailangan sapagkat walang mahalagang ambigwidad na hindi kayang dalhin ng salin.
