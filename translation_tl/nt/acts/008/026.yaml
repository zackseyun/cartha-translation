id: ACT.8.26
reference: Acts 8:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἄγγελος δὲ κυρίου ἐλάλησεν πρὸς Φίλιππον λέγων· Ἀνάστηθι καὶ πορεύου κατὰ μεσημβρίαν ἐπὶ τὴν ὁδὸν τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν· αὕτη ἐστὶν ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/026.yaml
  text: An angel of the Lord spoke to Philip[a], saying[b], “Get up and go south to the road that goes down from Jerusalem to Gaza.” This is a deserted road.
translation:
  language: tl
  text: 'Isang anghel naman ng Panginoon ang nagsalita kay Felipe: “Tumayo ka at pumunta sa dakong timog[a], sa daang bumababa mula Jerusalem patungong Gaza.” Liblib ang daang ito.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa katanghaliang-tapat.” Maaaring tumukoy ang pariralang Griyego sa direksiyon (“timog”) o sa oras (“katanghaliang-tapat”).
    reason: alternative_reading
  - marker: b
    text: O “Disyerto ito,” na maaaring mangahulugang dumaraan ang ruta sa isang ilang na lupain sa halip na sabihing liblib ang mismong daan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγγελος δὲ κυρίου
  choice: Isang anghel naman ng Panginoon
  rationale: Ang “isang anghel” ay likas na salin ng anarthrous singular; ipinahihiwatig ng “naman” ang banayad na pag-uugnay o paglipat ng δέ nang hindi nagdaragdag ng tahasang panahong wala sa Griyego. Pinananatili ng “ng Panginoon” ang banal na kaugnayan nang hindi labis na tinutukoy ang pagkakakilanlan ng anghel.
- source_word: ἐλάλησεν πρὸς Φίλιππον λέγων
  choice: ang nagsalita kay Felipe
  rationale: Natural sa Filipino ang tuwirang pagpapakilala sa kasunod na sipi gamit ang tutuldok; naipapahayag nito ang kilos ng pagsasalita at ang participial na λέγων nang hindi inuulit ang “nagsalita ... na sinasabi.”
- source_word: Ἀνάστηθι καὶ πορεύου
  choice: Tumayo ka at pumunta
  rationale: Malinaw at kasalukuyang Filipino para sa dalawang pautos; pinananatili ang agarang pagkilos na hinihingi ng teksto.
- source_word: κατὰ μεσημβρίαν
  choice: sa dakong timog[a]
  rationale: Sa konteksto ng pagpunta sa isang ruta, malamang na direksiyon ang tinutukoy. Gayunman, tunay na maaari ring mangahulugang “sa katanghaliang-tapat,” kaya inilagay ang alternatibo sa talababa.
- source_word: ἐπὶ τὴν ὁδὸν τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν
  choice: sa daang bumababa mula Jerusalem patungong Gaza
  rationale: Pinananatili ng “bumababa” ang heograpikong paglalarawan mula sa mataas na Jerusalem, habang natural ang “patungong Gaza” sa Filipino.
- source_word: αὕτη ἐστὶν ἔρημος
  choice: Liblib ang daang ito.[b]
  rationale: Ang pambabaeng αὕτη ay natural na tumutukoy pabalik sa ὁδός, kaya nilinaw ang “daan.” Sinasaklaw ng “liblib” ang di-matao o ilang na katangian nang hindi agad pinipiling ibig sabihin na literal na disyerto.
theological_decisions:
- issue: Pagkakakilanlan ng “anghel ng Panginoon”
  choice: Isinalin nang tuwiran bilang “isang anghel ... ng Panginoon,” na nagpapahayag ng banal na kaugnayan o pagsusugo ngunit hindi higit sa sinasabi ng teksto.
  alternative: “Isang anghel na isinugo ng Diyos,” o ang pag-unawa rito bilang isang natatanging nagpapahayag na “anghel ng Panginoon.”
  rationale: Hindi hinihingi ng talata na tukuyin pa nang mas espesipiko ang mensahero; pinananatili ng salin ang pagpipigil at kalabuan ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Felipe” at mga pangalang “Jerusalem” at “Gaza” sa karaniwang anyong madaling makilala. Iniwasan ang salitang-salitang “na sinasabi” dahil hindi ito likas sa Filipino; tutuldok ang maayos na naghahatid sa mismong sinabi.
