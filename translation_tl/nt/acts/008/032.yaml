  text: ἡ δὲ περιοχὴ τῆς γραφῆς ἣν ἀνεγίνωσκεν ἦν αὕτη· Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ ⸀κείραντος αὐτὸν ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/032.yaml
  text: 'The passage of Scripture that he was reading was this: “Like a sheep he was led to slaughter[a], and like a lamb before the one shearing it is silent[b], so he does not open his mouth.”'
translation:
  language: tl
  text: 'Ito ang bahagi ng Kasulatan na binabasa niya: “Gaya ng isang tupa, dinala siya upang katayin[a]; at gaya ng isang korderong tahimik sa harap ng gumugupit sa kanya[b], gayon din hindi niya ibinubuka ang kanyang bibig.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patungo sa katayan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa harap ng tagagupit”; literal sa Griyego, “sa harap ng gumugupit sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιοχὴ τῆς γραφῆς
  choice: bahagi ng Kasulatan
  rationale: Tumutukoy ito sa isang tiyak na bahagi o sipi ng kinikilalang banal na Kasulatan. Likas at malinaw sa modernong Filipino ang “bahagi ng Kasulatan.”
- source_word: ἀνεγίνωσκεν
  choice: binabasa niya
  rationale: Ipinahihiwatig ng imperfect ang nagpapatuloy na kilos sa nakaraan; natural na naipapahayag ito sa Filipino ng aspektong imperpektibo na “binabasa.”
- source_word: Ὡς πρόβατον
  choice: Gaya ng isang tupa
  rationale: Pinananatili ng “gaya ng” ang paghahambing na ipinakikilala ng ὡς, at ang “tupa” ang pangkalahatang katawagan na kaiba sa mas tiyak na ἀμνός.
- source_word: ἐπὶ σφαγὴν ἤχθη
  choice: dinala siya upang katayin
  rationale: Ipinapahayag nito ang pasibong pagdadala patungo sa pagkatay. Mas natural sa Filipino ang “upang katayin” kaysa sa literal ngunit alanganing “sa katayan,” habang nananatili ang layunin o hantungan ng pagdadala.
- source_word: ἀμνὸς
  choice: kordero
  rationale: Ang ἀμνός ay partikular na batang tupa; pinananatili ng “kordero” ang pagkakaiba nito sa πρόβατον na “tupa.”
- source_word: ἐναντίον τοῦ κείραντος αὐτὸν
  choice: sa harap ng naggugupit dito
  rationale: Malapit nitong sinusundan ang lokatibong “sa harap ng” at ang participial na “ang naggugupit.” Ginamit ang “dito” upang malinaw na ang kordero ang ginugupitan.
- source_word: ἄφωνος
  choice: tahimik
  rationale: Sa larawang ito, ang kahulugan ay hindi umiimik o hindi tumutunog. Ang “tahimik” ay natural at hindi nagpapahiwatig na likas itong pipi.
- source_word: οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ
  choice: hindi niya ibinubuka ang kanyang bibig
  rationale: Pinananatili ng aspektong imperpektibo sa Filipino ang masiglang present tense ng sipi. Ang pagkakasunod ng paghahambing ay sapat nang nagpapahiwatig ng οὕτως nang hindi kailangang magdagdag ng mabigat na “kaya naman.”
theological_decisions:
- issue: Ang sipi mula sa Isaias 53 ay inilalapat kay Jesus sa kasunod na konteksto
  choice: Pinanatili ang literal na anyo ng paghahambing at hindi tahasang pinangalanan si Jesus sa talatang ito.
  alternative: Isang paliwanag na salin na tuwirang tatawag kay Jesus bilang nagdurusang lingkod.
  rationale: Ang talata mismo ay naglalahad muna ng sipi sa Kasulatan; ang salaysay sa konteksto ang nagbibigay ng Kristolohikal na pagkakakilanlan. Hindi dapat ipasok sa mismong sipi ang paliwanag na wala sa Griyego.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang bahagyang makatang ritmo ng sipi, ang pagkakaiba ng “tupa” at “kordero,” at ang mga talababa para sa tunay na mga alternatibong leksikal.
