  text: ⸀ἰδὼν δὲ ὁ Σίμων ὅτι διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ ⸀πνεῦμα προσήνεγκεν αὐτοῖς χρήματα
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/018.yaml
  text: But when Simon saw that the Spirit was given through the laying on of the apostles’ hands[a], he offered them money,
translation:
  language: tl
  text: Ngunit nang makita ni Simon na ibinibigay ang Espiritu[a] sa pamamagitan ng pagpapatong ng mga kamay ng mga apostol, nag-alok siya sa kanila ng salapi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Banal na Espiritu.” “Ang Espiritu” lamang ang nasa tekstong Griyego, ngunit ang Banal na Espiritu ang tinutukoy sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: nang makita
  rationale: Ang aorist participle ay gumaganap na temporal sa konteksto; likas sa Tagalog ang “nang makita” at malinaw nitong ipinapakita ang pangyayaring humantong sa ginawa ni Simon.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na paglipat o pagsalungat mula sa naunang salaysay; ang “Ngunit” ay angkop sa reaksiyon ni Simon.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων
  choice: sa pamamagitan ng pagpapatong ng mga apostol ng kanilang mga kamay
  rationale: Ang διά na may genitive ay nagpapahayag ng paraan o kasangkapan. Pinananatili ng salin ang kilos ng mga apostol at ang kanilang mga kamay nang hindi ipinahihiwatig na sila ang sukdulang pinagmumulan ng Espiritu.
- source_word: δίδοται
  choice: ibinibigay
  rationale: Pinananatili ng aspektong di-ganap at tinig na balintiyak ang present passive ng Griyego, habang natural pa rin sa salaysay na Tagalog.
- source_word: τὸ πνεῦμα
  choice: ang Espiritu
  rationale: Tuwirang katumbas ito ng tekstong Griyego, na nagsasabing “ang Espiritu”; malinaw sa konteksto na ang tinutukoy ay ang Banal na Espiritu.
- source_word: προσήνεγκεν αὐτοῖς χρήματα
  choice: nag-alok siya sa kanila ng salapi
  rationale: Ang προσφέρω ay nangangahulugang mag-alok o magharap, at ang χρήματα ay pera o salapi. Ang ayos na ito ay malinaw at likas sa marangal na modernong Tagalog.
theological_decisions:
- issue: Ang tinutukoy ng τὸ πνεῦμα
  choice: ang Espiritu, na tumutukoy sa Banal na Espiritu
  alternative: ang Banal na Espiritu
  rationale: Pinananatili sa pangunahing teksto ang mismong mas maikling katawagan sa Griyego, habang nililinaw sa talababa ang malinaw na tinutukoy nito sa konteksto.
- issue: Ang paraan ng pagbibigay ng Espiritu
  choice: ibinibigay ang Espiritu sa pamamagitan ng pagpapatong ng mga apostol ng kanilang mga kamay
  alternative: ipinagkakaloob ang Banal na Espiritu sa pagpapatong ng kamay ng mga apostol
  rationale: Pinananatili ng salin ang ipinahahayag na paraan o instrumentality nang hindi ginagawang sukdulang pinagmumulan ng Espiritu ang mga apostol at nang hindi nagdaragdag ng konklusyong sakramental o kontra-sakramental.
translation_notes:
  register: Gumamit ng makabago ngunit marangal na Tagalog. Pinili ang “salapi” kaysa “pera” sa pangunahing teksto upang mapanatili ang dignidad ng estilong biblikal nang hindi nagiging lipas o mahirap unawain.
