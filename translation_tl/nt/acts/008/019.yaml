  verdict: revise
  source_fidelity: Tumpak na naisasalin ng draft ang pautos na maramihan, ang inklusibong «din ... sa akin,» ang ἐξουσία bilang «awtoridad,» ang layuning ipinahahayag ng ἵνα, at ang pagtanggap ng Banal na Espiritu. Wasto rin ang paggamit ng «Banal na Espiritu» para sa πνεῦμα ἅγιον sa kontekstong ito.
  naturalness: May dalawang bahagyang di-likas na pahayag. Sa salaysay na sinusundan ng tuwirang sipi, mas natural ang «na nagsabi» kaysa «na sinasabi.» Gayundin, ang «sinumang patungan ko ng mga kamay» ay maaaring maunawaan ngunit hindi ang pinakanatural na Filipino para sa pagpapatong ng mga kamay sa isang tao. Ang «sinumang papatungan ko ng aking mga kamay» ay malinaw at idiomatiko.
  terminology: Ang «awtoridad» ay angkop para sa ἐξουσία at ang talababa ay wastong naghahayag ng «kapangyarihan» bilang alternatibo. Ang «Banal na Espiritu» ay natural, matatag na gamit sa modernong Filipino, at hindi nagpapasok ng di-tiyak na kahulugan.
  issues:
  - severity: low
    issue: «na sinasabi» ay di-likas sa ganitong narratibong pagpapakilala ng tuwirang pananalita.
    rationale: Bagaman present participle ang λέγων, karaniwang isinasalin ito sa Filipino bilang «na nagsabi» sa salaysay; napapanatili nito ang kaugnayan sa naunang kilos nang hindi nagiging parang kasalukuyang paulit-ulit na pagsasalita.
  - severity: medium
    issue: «ang sinumang patungan ko ng mga kamay» ay alanganin ang konstruksiyon para sa ἐπιθῶ τὰς χεῖρας.
    rationale: Ang pandiwang «papatungan» kasama ng «aking mga kamay» ay mas malinaw na nagsasaad na si Simon ang magpapatong ng kanyang mga kamay sa sinumang tao, habang pinananatili ang di-tiyak na saklaw ng ᾧ ἐὰν.
