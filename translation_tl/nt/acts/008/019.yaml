  text: λέγων· Δότε κἀμοὶ τὴν ἐξουσίαν ταύτην ἵνα ᾧ ἐὰν ἐπιθῶ τὰς χεῖρας λαμβάνῃ πνεῦμα ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/019.yaml
  text: saying[a], “Give me also this authority, so that anyone on whom I lay my hands may receive the Holy Spirit.”
translation:
  language: tl
  text: na nagsabi, “Ibigay din ninyo sa akin ang awtoridad na ito[a], upang ang sinumang papatungan ko ng aking mga kamay ay tumanggap ng Banal na Espiritu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kapangyarihang ito.” Ang salitang Griyego ay maaaring mangahulugang awtoridad, karapatan, o kapangyarihang kumilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: na sinasabi
  rationale: Pinananatili ang anyong pandiwaring nag-uugnay sa kilos ni Simon sa naunang talata, sa halip na gawin itong hiwalay na pangungusap.
- source_word: Δότε
  choice: Ibigay ninyo
  rationale: Ang pautos ay nasa maramihan; malinaw na ipinakikita ng “ninyo” na higit sa isang tao ang kinakausap.
- source_word: κἀμοί
  choice: din ... sa akin
  rationale: 'Ipinahahayag ang diwang inklusibo ng καί + ἐμοί: hinihingi ni Simon na magkaroon din siya nito.'
- source_word: ἐξουσίαν ταύτην
  choice: ang awtoridad na ito
  rationale: Ang ἐξουσία ay maaaring tumukoy sa awtoridad, karapatan, o kapangyarihang kumilos. Pinananatili ng “awtoridad” ang kaibhan nito sa mga salitang Griyego na mas tuwirang nangangahulugang lakas o kapangyarihan.
- source_word: ἵνα
  choice: upang
  rationale: Likas at marangal na panandang Filipino para sa layunin o nilalayong bunga.
- source_word: ᾧ ἐὰν
  choice: ang sinumang
  rationale: Malinaw na ipinahahayag ang di-tiyak at pangkalahatang kondisyon ng pariralang Griyego.
- source_word: ἐπιθῶ τὰς χεῖρας
  choice: patungan ko ng mga kamay
  rationale: Pinananatili ang kongkretong larawan at ang maramihang “mga kamay,” gamit ang karaniwang pananalita para sa pagpapatong ng mga kamay.
- source_word: λαμβάνῃ
  choice: ay tumanggap
  rationale: Sa sugnay na pinangungunahan ng ἵνα, ipinahahayag nito ang nilalayong resulta nang hindi labis na tinutukoy ang aspekto.
- source_word: πνεῦμα ἅγιον
  choice: Banal na Espiritu
  rationale: Sa konteksto ng Mga Gawa, tumutukoy ito sa banal na Espiritu ng Diyos. Hindi kailangan sa natural na Filipino ang katumbas ng tiyak na pantukoy na Ingles na “the.”
theological_decisions:
- issue: Kung ang πνεῦμα ἅγιον na walang artikulo ay dapat unawaing di-tiyak
  choice: Banal na Espiritu
  alternative: isang banal na espiritu
  rationale: Malinaw sa konteksto ng Mga Gawa na ang tinutukoy ay ang Espiritu ng Diyos. Ang “isang banal na espiritu” ay magpapasok ng kahulugang hindi sinusuportahan ng salaysay.
- issue: Kung ang ἐξουσία ay dapat isaling “kapangyarihan” o “awtoridad”
  choice: awtoridad
  alternative: kapangyarihan
  rationale: Saklaw ng salita ang awtoridad, karapatan, at kakayahang kumilos. Pinipili ang “awtoridad” upang mapanatili ang leksikal na kaibhan mula sa mga terminong mas tuwirang tumutukoy sa kapangyarihan, habang kinikilala sa talababa ang posibleng salin.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang “awtoridad,” isang karaniwang hiram na salita sa kasalukuyang Filipino, upang mapanatili ang saklaw ng ἐξουσία. Nananatili ang panimulang “na sinasabi” dahil nakaugnay ang talata sa naunang pangungusap.
