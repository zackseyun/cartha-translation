  text: οὐκ ἔστιν σοι μερὶς οὐδὲ κλῆρος ἐν τῷ λόγῳ τούτῳ, ἡ γὰρ καρδία σου οὐκ ἔστιν εὐθεῖα ⸀ἔναντι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/021.yaml
  text: You have neither part nor share in this matter, because your heart is not right before God.
translation:
  language: tl
  text: Wala kang bahagi o pakikibahagi sa usaping ito, sapagkat ang puso mo ay hindi matuwid sa harap ng Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μερὶς οὐδὲ κλῆρος
  choice: bahagi ni karapatan
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit hindi lubos na magkaparehong termino: ang μερίς ay “bahagi,” samantalang ang κλῆρος ay tumutukoy sa bahaging nauukol o karapatang makibahagi. Mas natural ito sa modernong Tagalog kaysa literal na “bahagi ni lote.”'
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: sa bagay na ito
  rationale: Sa konteksto, ang λόγος ay tumutukoy sa usaping pinag-uusapan, hindi lamang sa binigkas na salita; kaya natural at tumpak ang “bagay na ito.”
- source_word: εὐθεῖα
  choice: matuwid
  rationale: Ang “matuwid” ay nagpapanatili sa metaporang moral ng Griyego at angkop sa dignidad ng talata.
- source_word: ἔναντι τοῦ θεοῦ
  choice: sa harap ng Diyos
  rationale: Tuwirang inilalarawan ang pagtataya ng Diyos at natural na pariralang biblikal sa Tagalog.
theological_decisions:
- issue: Saklaw ng pagtanggi kay Simon
  choice: “Wala kang bahagi ni karapatan sa bagay na ito”
  alternative: “Wala kang bahagi ni mana sa salitang ito”
  rationale: Hindi pinalalawak ang pahayag tungo sa tiyak na hatol tungkol sa kaligtasan o pagiging kabilang sa iglesia. Iniiwan itong nakatuon sa bagay na hinihingi ni Simon, ayon sa agarang konteksto.
- issue: Kalagayan ng puso sa harap ng Diyos
  choice: “ang puso mo ay hindi matuwid sa harap ng Diyos”
  alternative: “hindi tama ang puso mo sa paningin ng Diyos”
  rationale: Pinananatili ng “matuwid” ang larawang εὐθεῖα nang hindi dinaragdagan ang teksto ng isang partikular na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, dignificado, at madaling maunawaan. Ginamit ang “ni” sa tambalang negatibong “Wala kang bahagi ni karapatan” upang malinaw na katawanin ang οὐδέ (“ni/ni rin”).
