source:
  edition: SBLGNT
  text: ἀνοίξας δὲ ὁ Φίλιππος τὸ στόμα αὐτοῦ καὶ ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/035.yaml
  text: Then Philip opened his mouth[a], and beginning from this Scripture[b], he proclaimed the good news about Jesus to him.
translation:
  language: tl
  text: At nagsalita si Felipe at, simula sa Kasulatang ito, ipinahayag niya sa kanya ang mabuting balita tungkol kay Jesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνοίξας ... τὸ στόμα αὐτοῦ
  choice: nagsimulang magsalita
  rationale: Idyomang Griyego ito na nangangahulugang nagsimulang magsalita. Mas natural sa makabagong Tagalog ang kahulugang ito kaysa sa literal na “ibinuka ang kanyang bibig.”
- source_word: δὲ
  choice: Kaya
  rationale: Ipinagpapatuloy nito ang salaysay at ipinakikitang tugon ni Felipe ang pagsasalita niya sa tanong ng opisyal sa naunang talata.
- source_word: ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης
  choice: mula sa Kasulatang ito
  rationale: Pinananatili ng “mula” ang diwa ng ἀπό bilang panimulang punto ng pagpapaliwanag ni Felipe; ang “Kasulatan” ay tumutukoy sa sagradong sulat na binabasa sa konteksto.
- source_word: εὐηγγελίσατο
  choice: ipinahayag ... ang mabuting balita
  rationale: Malinaw at likas itong katumbas ng pandiwang nangangahulugang maghayag ng mabuting balita, nang hindi nagkakaroon ng labis na institusyonal na himig ang “nangaral.”
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Tuwirang isinasalin ang panghalip, na sa konteksto ay tumutukoy sa opisyal na Etiope.
- source_word: τὸν Ἰησοῦν
  choice: tungkol kay Jesus
  rationale: Sa konstruksyong kasama ng εὐαγγελίζομαι, si Jesus ang nilalaman at sentro ng ipinahayag na mabuting balita. Likas sa Tagalog ang “mabuting balita tungkol kay Jesus.”
theological_decisions:
- issue: Diwa ng εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν
  choice: ipinahayag niya sa kanya ang mabuting balita tungkol kay Jesus
  alternative: ipinangaral niya sa kanya si Jesus
  rationale: Ipinakikita ng Griyego na si Jesus ang nilalaman at sentro ng pagpapahayag. Nililinaw ito ng napiling salin sa natural na Tagalog nang hindi nagdaragdag ng isang partikular na doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Isinalin ayon sa diwa ang Griyegong idyoma sa pagsisimulang magsalita, habang pinanatili ang “Kasulatan” bilang kinikilalang sagradong teksto.
