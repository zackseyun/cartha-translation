  text: ὡς δὲ ἐπορεύοντο κατὰ τὴν ὁδόν, ἦλθον ἐπί τι ὕδωρ, καί φησιν ὁ εὐνοῦχος· Ἰδοὺ ὕδωρ, τί κωλύει με ⸀βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/036.yaml
  text: And as they were going along the road, they came to some water, and the eunuch says, “Look, water! What prevents me from being baptized?”
translation:
  language: tl
  text: Habang nagpapatuloy sila sa daan, nakarating sila sa isang lugar na may tubig. Sabi ng eunuko, “Tingnan mo, may tubig! Ano ang humahadlang para mabautismuhan ako?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἐπορεύοντο κατὰ τὴν ὁδόν
  choice: Habang nagpapatuloy sila sa daan
  rationale: Likas sa modernong Tagalog at tapat sa sabayang kilos na ipinahahayag ng ὡς at ng imperfect na ἐπορεύοντο.
- source_word: ἐπί τι ὕδωρ
  choice: sa isang lugar na may tubig
  rationale: Ipinahahayag ang di-tiyak na τι at iniiwasan ang di-likas na literal na ‘sa ilang tubig.’
- source_word: φησιν
  choice: Sinabi
  rationale: Bagaman historical present ang Griyego, mas natural sa tuloy-tuloy na salaysay sa Tagalog ang pangnagdaang ‘sinabi.’
- source_word: ὁ εὐνοῦχος
  choice: ang eunuko
  rationale: Pinananatili ang tiyak na katawagan ng teksto; ang ‘eunuko’ ay maikli at kinikilalang salin sa kontekstong biblikal.
- source_word: Ἰδοὺ ὕδωρ
  choice: Tingnan mo, may tubig!
  rationale: Natural na padamdam sa Tagalog na naghahatid ng pansin at biglang pagkakita na ipinahahayag ng Ἰδού.
- source_word: τί κωλύει με βαπτισθῆναι
  choice: Ano ang humahadlang para mabautismuhan ako?
  rationale: Pinananatili ang tanong tungkol sa posibleng hadlang at ang pasibong diwa ng βαπτισθῆναι nang hindi tinutukoy kung sino ang magbabautismo.
theological_decisions:
- issue: Saklaw ng tanong tungkol sa bautismo
  choice: Ano ang humahadlang para mabautismuhan ako?
  alternative: May dahilan ba para hindi ako bautismuhan?
  rationale: Ang napiling anyo ay mas malapit sa τί κωλύει at hindi nagdaragdag ng mga kundisyon o paliwanag na wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at angkop sa pampublikong pagbasa. Ginamit ang ‘eunuko’ at ‘mabautismuhan’ bilang pamilyar na mga terminong biblikal, habang pinanatiling natural ang daloy ng salaysay.
