id: ACT.8.23
reference: Acts 8:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰς γὰρ χολὴν πικρίας καὶ σύνδεσμον ἀδικίας ὁρῶ σε ὄντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/023.yaml
  text: For I see that you are in the gall of bitterness and the bond of unrighteousness[a][b].
translation:
  language: tl
  text: Sapagkat nakikita kong nasa apdo ka ng kapaitan[b] at nasa gapos ng kalikuan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tanikala ng kawalang-katarungan” o “tanikala ng kasamaan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “apdo ng kapaitan” ay isang matinding metapora na malamang na umaalingawngaw sa wika ng Lumang Tipan tungkol sa nakalalasong kapaitan (ihambing ang Deuteronomio 29:18 LXX).
    reason: cross_reference
lexical_decisions:
- source_word: εἰς
  choice: nasa
  rationale: Sa konstruksyong εἰς ... ὁρῶ σε ὄντα, ipinahahayag ng εἰς ang kalagayan o saklaw na kinaroroonan ni Simon, kaya likas sa Filipino ang “nasa” kaysa sa literal na “papasok sa.”
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinakikita ng γάρ na ang pangungusap ay dahilan ng naunang pagsaway ni Pedro. Pinananatili ng “sapagkat” ang ugnayang ito sa isang marangal at malinaw na rehistro.
- source_word: χολὴν πικρίας
  choice: apdo ng kapaitan
  rationale: Pinananatili ang matinding metapora ng Greek at ang posibleng alingawngaw nito sa wika ng Lumang Tipan. Ang “apdo” ay hindi pinalalabnaw tungo sa simpleng “kapaitan” o “sama ng loob.”
- source_word: σύνδεσμον ἀδικίας
  choice: gapos ng kalikuan
  rationale: Ang σύνδεσμος ay isang bagay na nagbibigkis o gumagapos, kaya ang “gapos” ay malinaw at matalinghaga. Sinasaklaw ng “kalikuan” ang moral na di-pagkamatuwid ng ἀδικία nang hindi ito nililimitahan sa panlipunang kawalang-katarungan lamang.
- source_word: ὁρῶ
  choice: nakikita ko
  rationale: Maaaring tumukoy ang ὁράω rito sa pagkilala o pagkaunawa sa kalagayan ni Simon. Likas sa Filipino ang “nakikita ko” kapuwa sa literal at matalinghagang diwa.
- source_word: σε ὄντα
  choice: nakikita kong ... ka
  rationale: Ang accusative-plus-participle pagkatapos ng ὁρῶ ay likas na ipinapahayag sa Filipino sa hulmaing “nakikita kong ... ka,” na nagpapanatili sa diwa nang hindi nagiging mekanikal ang pangungusap.
theological_decisions:
- issue: Matalinghagang paglalarawan sa moral at espirituwal na kalagayan ni Simon
  choice: 'Pinanatili ang dalawang metapora: “apdo ng kapaitan” at “gapos ng kalikuan.”'
  alternative: Ipaliwanag nang tuwiran bilang “punô ng mapait na lason at bihag ng kasalanan/kawalang-katarungan.”
  rationale: Gumagamit ang Greek ng masinsin at matitinding metapora, hindi ng tahasang paliwanag sa doktrina. Ang pagpapanatili sa mga ito ay nag-iingat sa tindi at tunay na lawak ng pahayag nang hindi nagdaragdag ng interpretasyong wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Sadyang pinanatili ang di-karaniwang larawang “apdo ng kapaitan” upang hindi mawala ang talinghaga at posibleng alingawngaw sa Kasulatan; ipinaliliwanag ito sa talababa. Inilagay ang bawat pananda kaagad pagkatapos ng pariralang tinutukoy nito.
