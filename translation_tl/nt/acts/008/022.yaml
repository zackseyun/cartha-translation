- from: Kaya talikuran mo ang kasamaan mong ito at manalangin ka sa Panginoon, baka sakaling patawarin ka sa hangarin ng puso mo.[a]
  to: Kaya magsisi ka dahil sa kasamaan mong ito at manalangin ka sa Panginoon, baka sakaling patawarin ka dahil sa hangarin ng puso mo.[a]
  rationale: Pinalitan ang “talikuran mo” ng “magsisi ka” upang tuwirang maisalin ang μετανόησον, nang pinananatili ang kaugnayan ng pagsisisi sa kasamaan sa pamamagitan ng “dahil sa.” Nilinaw ang ugnayan ng kapatawaran at ng panloob na hangarin sa mas natural na Filipino, habang pinanatili ang sinadyang pag-iingat ng “baka sakaling.”
