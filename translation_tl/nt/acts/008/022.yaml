source:
  edition: SBLGNT
  text: μετανόησον οὖν ἀπὸ τῆς κακίας σου ταύτης, καὶ δεήθητι τοῦ ⸀κυρίου εἰ ἄρα ἀφεθήσεταί σοι ἡ ἐπίνοια τῆς καρδίας σου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/022.yaml
  text: Therefore repent of this wickedness of yours[a], and pray to the Lord, if perhaps the intent of your heart may be forgiven you.
translation:
  language: tl
  text: Kaya magsisi ka dahil sa kasamaan mong ito at manalangin ka sa Panginoon, baka sakaling patawarin ka dahil sa hangarin ng puso mo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “baka sakaling patawarin ka dahil sa kaisipan ng puso mo.”
    reason: Pinananatili ang leksikal na alternatibo ng ἐπίνοια, na maaaring mangahulugang “kaisipan” bukod sa “hangarin.”
lexical_decisions:
- source_word: μετανόησον
  choice: talikuran mo
  rationale: Ang aorist imperative ay nananawagan ng tiyak at agarang pagsisisi. Sa kontekstong ito, likas sa modernong Filipino ang “talikuran mo” at malinaw na ipinahihiwatig ang pagbabagong-loob, hindi lamang pagbabago ng isip.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita nito na ang utos ay bunga ng naunang pagsaway ni Pedro; natural at malinaw ang “Kaya” sa Filipino.
- source_word: ἀπὸ τῆς κακίας σου ταύτης
  choice: ang kasamaan mong ito
  rationale: Ang κακία ay tumutukoy rito sa moral na kasamaan. Pinananatili ng “mong ito” ang diin ng Griyego sa sariling kasamaan ni Simon.
- source_word: δεήθητι
  choice: manalangin ka
  rationale: Ang pandiwa ay tumutukoy sa taimtim na paghingi. Ang “manalangin” ay angkop sa relihiyosong konteksto at likas na Filipino.
- source_word: τοῦ κυρίου
  choice: sa Panginoon
  rationale: Pinananatili ang karaniwang salin ng κύριος nang hindi tinutukoy sa salin kung ang reperensiya ay partikular na kay Jesus o sa Diyos.
- source_word: εἰ ἄρα
  choice: baka sakaling
  rationale: Likas na Filipino itong nagpapahayag ng posibilidad at pag-aalinlangan, kaya hindi nito ginagawang tiyak o imposible ang kapatawaran.
- source_word: ἀφεθήσεταί σοι
  choice: patawarin ka
  rationale: Malinaw at natural na ipinahahayag ang kapatawarang tatanggapin ni Simon. Sa ugnay na “baka sakaling,” nananatili ang di-tiyak na himig ng sugnay.
- source_word: ἡ ἐπίνοια
  choice: hangarin
  rationale: Maaaring mangahulugan ang ἐπίνοια ng kaisipan, layunin, o balak. Ang “hangarin” ay angkop sa panloob na intensiyong nasa likod ng kahilingan ni Simon.
- source_word: τῆς καρδίας σου
  choice: ng puso mo
  rationale: Malapit ito sa anyong genitibo ng Griyego at pinananatili ang biblikal na paglalarawan sa puso bilang bukal ng panloob na hangarin.
theological_decisions:
- issue: Antas ng katiyakan tungkol sa posibilidad ng kapatawaran
  choice: Ipinag-uutos ni Pedro ang pagsisisi at pananalangin, ngunit inilalahad ang kapatawaran bilang isang posibilidad sa pariralang “baka sakaling.”
  alternative: Tiyak na patatawarin si Simon kapag nagsisi siya; o ipinahihiwatig ni Pedro na imposible o halos imposibleng patawarin siya.
  rationale: Sadyang may pag-iingat ang εἰ ἄρα. Pinananatili ng salin ang tensiyong ito at hindi ginagawang garantiya o kawalang-pag-asa ang sinabi ni Pedro.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “talikuran” bilang idiomatikong pahayag ng pagsisisi at “baka sakaling” upang mapanatili ang tunay na kondisyonal na himig ng Griyego.
