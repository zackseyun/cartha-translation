  yaml_path: translation/nt/acts/008/034.yaml
  text: Then the eunuch answered Philip and said[a], “I ask you, about whom does the prophet say this—about himself or about someone else?”
translation:
  language: tl
  text: Sumagot ang eunuko kay Felipe at sinabi, “Nakikiusap ako sa iyo[a], tungkol kanino sinasabi ito ng propeta? Tungkol ba ito sa sarili niya o sa iba?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Ipinamamanhik ko sa iyo.” Ang salitang Griyego ay nagpapahayag ng magalang na pakiusap at maaari ring magpahiwatig ng mas matinding pagsusumamo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Kaya nagtanong
  rationale: Ang participle na ἀποκριθείς kasama ng εἶπεν ay isang karaniwang pormulang panarratibo para sa pagtugon sa naunang sinabi o pangyayari. Sa konteksto, tanong ang mismong tugon, kaya natural sa Tagalog ang “nagtanong”; ang δέ ay ipinahayag bilang banayad na pagpapatuloy sa “Kaya,” hindi bilang matinding pagsalungat.
- source_word: ὁ εὐνοῦχος
  choice: ang eunuko
  rationale: Tiyak na tumutukoy ang pangngalan sa isang eunuko. Pinananatili nito ang katawagan at pagkakakilanlan ng tauhan sa salaysay sa halip na gawing pangkalahatang “opisyal.”
- source_word: τῷ Φιλίππῳ
  choice: kay Felipe
  rationale: Ang datibo ang tumutukoy sa taong kinausap. “Kay Felipe” ang natural na anyo sa Tagalog.
- source_word: Δέομαί σου
  choice: Nakikiusap ako sa iyo
  rationale: Ang δέομαι ay magalang at maaaring may diin na pakiusap. Ang “Nakikiusap ako sa iyo” ay natural at magalang, habang ang posibleng mas mariing diwa ay inilalahad sa talababa.
- source_word: περὶ τίνος
  choice: tungkol kanino
  rationale: Ang περί na may genitibo ay nagpapahayag ng paksa o tinutukoy; tuwirang naipapahayag ito ng “tungkol kanino.”
- source_word: ὁ προφήτης λέγει τοῦτο
  choice: ito sinasabi ng propeta
  rationale: Ang τοῦτο ay tumutukoy sa kasulatang kababasa lamang. Ang ayos na ito ay natural sa Tagalog at pinananatili ang propeta bilang gumagawa ng pagsasabi.
- source_word: περὶ ἑαυτοῦ
  choice: tungkol ba sa sarili niya
  rationale: Ang reflexive na ἑαυτοῦ ay bumabalik sa propeta. Nililinaw ng “sarili niya” ang reflexive na ugnayan nang hindi dinaragdagan ang kahulugan.
- source_word: περὶ ἑτέρου τινός
  choice: o sa iba
  rationale: Ang ἑτέρου τινός ay nangangahulugang ibang tao o sinumang iba. Sa malinaw na konteksto ng “kanino,” sapat at natural ang “sa iba.”
