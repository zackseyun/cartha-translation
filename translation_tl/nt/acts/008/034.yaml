translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “eunuko” bilang tiyak na katawagan sa tauhan. Ginamit ang “Nakikiusap” upang maipahayag ang magalang na puwersa ng δέομαι nang hindi labis na pinatitingkad ang damdamin.
