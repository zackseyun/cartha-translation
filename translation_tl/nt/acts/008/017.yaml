  text: Then they laid their hands on them, and they were receiving the Holy Spirit.
translation:
  language: tl
  text: Pagkatapos, ipinatong nila ang kanilang mga kamay sa kanila, at sila naman ay tumanggap ng Banal na Espiritu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas tahasang isinasalamin ang aspekto ng Griyego: “Pagkatapos, ipinapatong nila ang kanilang mga kamay sa kanila, at sila naman ay tumatanggap ng Banal na Espiritu.” Kapwa imperpektibo ang dalawang pandiwa sa Griyego; maaari itong magpahiwatig ng nagpapatuloy o paulit-ulit na kilos sa salaysay.'
    reason: Ipinakikita ang mas mahigpit na pagtutumbas sa aspektong imperpektibo ng dalawang pandiwang Griyego, habang pinananatiling natural ang pangunahing tekstong Filipino.
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Likas na panandang pansunod sa salaysay; ipinakikitang ito ang sumunod na ginawa ng mga apostol.
- source_word: ἐπετίθεσαν τὰς χεῖρας
  choice: ipinatong nila … ang kanilang mga kamay
  rationale: Ang “ipatong ang mga kamay” ang malinaw at karaniwang katumbas ng kilos na tinutukoy. Ginamit ang naganap na anyo sa pangunahing teksto para sa likas na salaysay sa Tagalog, habang ipinaliliwanag sa talababa ang aspektong imperpektibo ng Griyego.
- source_word: ἐπ’ αὐτούς
  choice: sa mga iyon
  rationale: Tumutukoy ito sa mga taong pinatungan ng kamay. Ang “mga iyon” ay tumutulong na maiba sila sa naunang “nila,” na tumutukoy sa mga apostol.
- source_word: ἐλάμβανον
  choice: tinatanggap
  rationale: Pinananatili ng aspektong imperpektibo ang nagpapatuloy o paulit-ulit na pagtanggap habang isinasagawa ang pagpapatong ng mga kamay, nang hindi ipinapalagay na ang diin ay sa pagsisimula ng pagtanggap.
- source_word: πνεῦμα ἅγιον
  choice: ang Banal na Espiritu
  rationale: Sa konteksto ng Mga Gawa, tumutukoy ito sa banal na Espiritung ipinagkakaloob sa mga mananampalataya; natural sa Tagalog ang tiyak at personal na katawagang “ang Banal na Espiritu.”
theological_decisions:
- issue: Kung ang πνεῦμα ἅγιον ay di-tiyak na espiritu o ang banal at personal na Espiritu
  choice: ang Banal na Espiritu
  alternative: isang banal na espiritu
  rationale: Sa agarang konteksto at sa gamit ng Lucas–Mga Gawa, ang tinutukoy ay ang ipinangakong banal na Espiritu, hindi ang isang di-tiyak na espiritu.
- issue: Kung paano ihahayag ang dalawang pandiwang imperpektibo
  choice: Naganap na anyo sa pagpapatong, imperpektibong anyo sa pagtanggap, na may talababa tungkol sa dalawang imperpektibo
  alternative: ipinapatong nila … at tinatanggap
  rationale: Pinananatiling natural ang daloy ng salaysay habang malinaw na naihahayag ang nagpapatuloy o paulit-ulit na pagtanggap. Hindi itinatago ng talababa na kapwa imperpektibo ang dalawang pandiwa sa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga iyon” upang mabawasan ang kalituhan sa magkaibang tinutukoy ng “nila” at ng mga tumatanggap, nang hindi nagdaragdag ng katawagang wala sa talata.
