id: ACT.8.12
reference: Acts 8:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐπίστευσαν τῷ Φιλίππῳ εὐαγγελιζομένῳ ⸀περὶ τῆς βασιλείας τοῦ θεοῦ καὶ τοῦ ὀνόματος Ἰησοῦ Χριστοῦ, ἐβαπτίζοντο ἄνδρες τε καὶ γυναῖκες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/012.yaml
  text: But when they believed Philip as he proclaimed the good news about the kingdom of God and the name of Jesus the Messiah[a], they were being baptized, both men and women.
translation:
  language: tl
  text: Ngunit nang maniwala sila kay Felipe habang ipinahahayag niya ang mabuting balita tungkol sa kaharian ng Diyos at sa pangalan ni Jesus na Mesiyas[a], sila ay binabautismuhan, kapwa lalaki at babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pangalan ni Jesus Cristo.” Ang salitang Griyego na Χριστός ay isang titulong nangangahulugang “Mesiyas.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ngunit nang
  rationale: Ipinapahayag ng “nang” ang panahong ugnayan, at pinananatili ng “ngunit” ang banayad na pagsalungat o bagong pag-unlad sa salaysay.
- source_word: ἐπίστευσαν τῷ Φιλίππῳ
  choice: maniwala sila kay Felipe
  rationale: Ang πιστεύω na may datibo ay tumutukoy rito sa paniniwala kay Felipe bilang tagapagpahayag, hindi sa pananampalataya sa kaniya bilang tagapagligtas. Likas sa Tagalog ang “maniwala kay Felipe” sa ganitong diwa.
- source_word: εὐαγγελιζομένῳ
  choice: habang ipinahahayag niya ang magandang balita
  rationale: Pinananatili nito ang nagpapatuloy na kilos ng kasalukuyang participle at malinaw na inilalahad ang diwa ng paghahatid ng mabuting balita.
- source_word: περὶ
  choice: tungkol sa
  rationale: Tuwirang ipinakikilala nito ang paksa ng ipinahahayag ni Felipe.
- source_word: τῆς βασιλείας τοῦ θεοῦ
  choice: kaharian ng Diyos
  rationale: Ito ang malinaw, karaniwan, at teolohikal na bukas na salin; hindi nito nililimitahan ang βασιλεία sa teritoryo lamang o sa paghahari lamang.
- source_word: τοῦ ὀνόματος Ἰησοῦ Χριστοῦ
  choice: sa pangalan ni Jesus na Mesiyas
  rationale: Pinananatili ang “pangalan,” na maaaring kumatawan sa persona, kapangyarihan, awtoridad, o nahayag na pagkakakilanlan. Isinalin ang Χριστός bilang titulong “Mesiyas.”
- source_word: ἐβαπτίζοντο
  choice: binabautismuhan sila
  rationale: 'Pinananatili ng aspektong progresibo at tinig na balintiyak ang imperfect passive ng Griyego: nagpapatuloy o paulit-ulit ang pagbautismo habang tumutugon ang mga tao.'
- source_word: ἄνδρες τε καὶ γυναῖκες
  choice: kapwa mga lalaki at mga babae
  rationale: Malinaw na pinananatili ang inklusibong pagtukoy ng τε … καὶ sa dalawang pangkat.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ sa Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  alternative: Jesus Cristo
  rationale: Gumaganap dito ang Χριστός bilang titulong mesiyaniko. Ginagawang malinaw ng “na Mesiyas” ang titulong diwa nang hindi ito tinatratong apelyido; kinikilala sa talababa ang nakaugaliang anyong “Cristo.”
- issue: Diwa ng “pangalan” sa τοῦ ὀνόματος
  choice: pinanatili ang “pangalan”
  alternative: awtoridad o pagkakakilanlan ni Jesus
  rationale: Maaaring saklawin ng ὄνομα ang persona, awtoridad, reputasyon, at nahayag na pagkakakilanlan. Ang literal ngunit likas na “pangalan” ang pinakamahusay na nagpapanatili sa lawak at tunay na kalabuan nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Felipe,” “Mesiyas,” at “binabautismuhan” bilang mga anyong pamilyar sa bokabularyong biblikal. Pinanatili ang aspektong nagpapatuloy ng pandiwang Griyego at ang tahasang pagbanggit sa mga lalaki at mga babae.
