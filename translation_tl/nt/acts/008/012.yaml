revisions:
- from: Ngunit nang maniwala sila kay Felipe habang ipinahahayag niya ang magandang balita tungkol sa kaharian ng Diyos at sa pangalan ni Jesus na Mesiyas[a], binabautismuhan sila—kapwa mga lalaki at mga babae.
  to: Ngunit nang maniwala sila kay Felipe habang ipinahahayag niya ang mabuting balita tungkol sa kaharian ng Diyos at sa pangalan ni Jesus na Mesiyas[a], sila ay binabautismuhan, kapwa lalaki at babae.
  rationale: Pinalitan ang “magandang balita” ng nakaugaliang “mabuting balita,” inayos ang salita upang maging mas natural ang progresibong balintiyak, at pinasimple ang inklusibong parirala. Inihanay din ang anyo ng pangalan sa talababa sa “Jesus” ng pangunahing teksto. Walang binagong kahulugan o teolohikal na pagpapakahulugan.
