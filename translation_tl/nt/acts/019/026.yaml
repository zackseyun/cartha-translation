revisions:
- from: Nakikita at naririnig ninyo na hindi lamang sa Efeso kundi sa halos buong Asia[a], hinikayat ng Paulong ito ang napakaraming tao at inilayo sila, sa pagsasabing ang mga diyos na gawa ng kamay ng tao[b] ay hindi mga diyos.
  to: Nakikita at naririnig ninyo na hindi lamang sa Efeso kundi sa halos buong Asia[a], ang Pablong ito ay nanghikayat at nagpalayo sa isang malaking pangkat ng mga tao, sa pagsasabing ang mga diyos na ginawa ng mga kamay[b] ay hindi mga diyos.
  rationale: Inayos ang tindi ng bilang, ang pandiwang nagsasaad ng pagpapatalikod, at ang anyo ng pangalan upang maging mas tapat at natural ang salin. Itinama rin ang talababa b upang wasto nitong maipaliwanag ang Griyegong participial expression. Napanatili ang sinadyang polemikal na pahayag na ang mga diyos na gawa ng kamay ay hindi mga diyos.
