source:
  edition: SBLGNT
  text: καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/026.yaml
  text: And you see and hear that not only in Ephesus but in almost all of Asia[a], this Paul has persuaded and turned away a considerable crowd[b], saying that gods made by hands are not gods.
translation:
  language: tl
  text: Nakikita at naririnig ninyo na hindi lamang sa Efeso kundi sa halos buong Asia[a], ang Pablong ito ay nanghikayat at nagpalayo sa isang malaking pangkat ng mga tao, sa pagsasabing ang mga diyos na ginawa ng mga kamay[b] ay hindi mga diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Asia” rito ay ang lalawigan ng Roma sa kanlurang bahagi ng Asia Menor, hindi ang buong kontinente ng Asia ngayon.
    reason: geographical_note
  - marker: b
    text: Sa literal, “ang mga ginagawa sa pamamagitan ng mga kamay,” isang idyomang tumutukoy sa mga diyus-diyosang ginawa ng tao.
    reason: cultural_note
lexical_decisions:
- source_word: θεωρεῖτε καὶ ἀκούετε
  choice: Nakikita at naririnig ninyo
  rationale: Pinananatili ang magkatambal na pangkasalukuyang pag-apela ni Demetrio sa nakikita at naririnig mismo ng mga kausap niya.
- source_word: οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας
  choice: hindi lamang sa Efeso kundi sa halos buong Asia
  rationale: Likas na isinasalin sa Filipino ang idyomatikong genitive bilang pook; ang σχεδόν ay malinaw na naipahahayag ng “halos.”
- source_word: ὁ Παῦλος οὗτος
  choice: ang Paulong ito
  rationale: Napananatili ang mapanghamak o mapagwalang-bahalang himig ng demonstratibo sa pananalita ni Demetrio nang hindi nagdaragdag ng mas matinding insulto.
- source_word: πείσας μετέστησεν
  choice: hinikayat ... at inilayo
  rationale: Ipinapakita ang panghihikayat bilang paraan o kasabay na kilos na nagbunsod sa maraming tao na tumalikod sa dati nilang paninindigan, nang hindi ipinapalagay na sila ay nilinlang.
- source_word: ἱκανὸν ὄχλον
  choice: napakaraming tao
  rationale: Ipinahahayag sa natural na Filipino ang isang malaking bilang ng mga taong sapat upang maging seryosong banta sa kabuhayan ng mga panday.
- source_word: οἱ διὰ χειρῶν γινόμενοι
  choice: mga diyos na gawa ng kamay ng tao
  rationale: Natural na Filipino para sa mga diyus-diyosang likha ng kasanayan ng tao; nililinaw ng “tao” ang ipinahihiwatig na kaibahan sa tunay na pagka-Diyos.
- source_word: οὐκ εἰσὶν θεοὶ
  choice: ay hindi mga diyos
  rationale: Direktang pinananatili ang pagtanggi sa pagka-diyos ng mga bagay na ginawa ng tao, nang hindi idinaragdag ang salitang “tunay” o iba pang paliwanag.
theological_decisions:
- issue: Paglalahad sa pahayag ni Pablo laban sa mga diyus-diyosan nang hindi nagpapasok ng mas malawak na metapisikong pahayag
  choice: ang mga diyos na gawa ng kamay ng tao ay hindi mga diyos
  alternative: ang mga bagay na gawa ng kamay ng tao ay hindi mga diyos
  rationale: Tuwirang itinatanggi ng Griyego ang banal na katayuan ng mga diyos na nililikha ng tao. Pinananatili ng salin ang sadyang tensiyon sa pagtawag sa kanila na “mga diyos” at kasabay na pagkakait na sila nga ay mga diyos.
translation_notes:
  register: Modernong Filipino na may marangal ngunit karaniwang pananalita. Ginamit ang “Asia” alinsunod sa pangalang heograpiko sa teksto at nilinaw sa talababa ang sinaunang saklaw nito. Ang ayos na “hinikayat ... at inilayo” ay nagpapanatili sa dalawang kilos ng Griyego habang nananatiling madaling maunawaan.
