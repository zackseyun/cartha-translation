  text: ἠγάγετε γὰρ τοὺς ἄνδρας τούτους οὔτε ἱεροσύλους οὔτε βλασφημοῦντας τὴν θεὸν ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/037.yaml
  text: For you have brought these men here who are neither temple robbers nor blasphemers of our goddess[a].
translation:
  language: tl
  text: Sapagkat dinala ninyo rito ang mga lalaking ito, na hindi naman mga magnanakaw sa templo at hindi rin lumalapastangan sa ating diyosa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ating diyosa” ay tumutukoy kay Artemis ng Efeso. Sa Griyego, may di-karaniwang anyo ang parirala, ngunit malinaw sa konteksto na si Artemis ang tinutukoy.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἠγάγετε
  choice: dinala ninyo rito
  rationale: Ang aorist ng ἄγω ay tumutukoy sa natapos na pagdadala sa mga lalaki sa kapulungan; natural sa Tagalog ang “dinala ninyo rito,” at malinaw nitong ipinahihiwatig ang kasalukuyang tagpuan.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o paliwanag na sumusuporta sa naunang sinabi ng tagapagsalita.
- source_word: τοὺς ἄνδρας τούτους
  choice: ang mga lalaking ito
  rationale: Karaniwang tumutukoy ang ἀνήρ sa mga lalaki, at pinananatili ng “ito” ang deiktikong diin ng τούτους.
- source_word: οὔτε ... οὔτε
  choice: hindi naman ... at hindi rin
  rationale: Likas itong paraan sa modernong Tagalog upang ipahayag ang magkaugnay na dobleng pagtanggi ng Griyego.
- source_word: ἱεροσύλους
  choice: mga magnanakaw sa templo
  rationale: Tumutukoy ang salita sa mga nagnanakaw mula sa templo o lumalapastangan sa sagradong pag-aari; malinaw at kongkreto sa konteksto ang saling ito.
- source_word: βλασφημοῦντας
  choice: lumalapastangan
  rationale: Ipinahihiwatig ng pandiwari ang mapang-abuso o mapanirang pananalita laban sa isang diyos; ang “lumalapastangan” ay angkop sa panrelihiyon at pampublikong konteksto.
- source_word: τὴν θεὸν ἡμῶν
  choice: ating diyosa
  rationale: Ang pambabaeng pantukoy na τὴν at ang konteksto ay malinaw na tumutukoy kay Artemis; kaya tumpak at natural ang “diyosa.”
theological_decisions:
- issue: Paglalarawan kay Artemis sa pariralang τὴν θεὸν ἡμῶν
  choice: ating diyosa
  alternative: ating diyos
  rationale: Ang nagsasalita ay isang opisyal na taga-Efeso at si Artemis ang tinutukoy. Inilalarawan lamang ng salin ang pananalita at paniniwala ng nagsasalita; hindi nito pinagtitibay ang paganong pagsamba.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang paliwanag na “Sapagkat,” ang tuwirang pagtukoy sa “mga lalaking ito,” at ang dobleng pagtanggi nang hindi ginagawang labis na teknikal ang pangungusap.
