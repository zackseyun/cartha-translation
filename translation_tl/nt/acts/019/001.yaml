  text: Ἐγένετο δὲ ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ Παῦλον διελθόντα τὰ ἀνωτερικὰ μέρη ⸀ἐλθεῖν εἰς Ἔφεσον καὶ ⸀εὑρεῖν τινας μαθητάς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/001.yaml
  text: It happened that while Apollos was in Corinth[a], Paul passed through the inland regions and came to Ephesus and found some disciples[b],
translation:
  language: tl
  text: Nang si Apolos ay nasa Corinto, dumaan si Pablo sa mga rehiyong nasa loob ng lupain[a], dumating sa Efeso, at nakatagpo roon ng ilang alagad[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga dakong nasa itaas” o “mga panloob na rehiyon.” Malamang na tumutukoy ang parirala sa rutang dumaraan sa mas mataas na lupain sa loob, sa halip na sa daang malapit sa baybayin.
    reason: lexical_alternative
  - marker: b
    text: Hindi tinutukoy rito kung kaninong “mga alagad” sila. Ipinakikita ng mga sumunod na talata na nauugnay sila sa bautismo ni Juan.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Nang
  rationale: Ang pormulang pasalaysay ay likas na isinama sa sugnay na panahunan sa Filipino; iniiwasan nito ang mabigat at di-likas na “Nangyari na” habang pinananatili ang paglipat ng salaysay.
- source_word: ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ
  choice: si Apolos ay nasa Corinto
  rationale: Ang articular infinitive na may ἐν τῷ ay nagpapahayag ng magkasabay na panahon, kaya natural itong binuo bilang “Nang si Apolos ay nasa Corinto.”
- source_word: διελθόντα
  choice: dumaan
  rationale: Ipinahihiwatig ng aorist participle ang paglalakbay ni Pablo sa mga rehiyon bago siya makarating sa Efeso.
- source_word: τὰ ἀνωτερικὰ μέρη
  choice: mga dakong nasa loob ng lupain
  rationale: Bagaman literal na maaaring “mga dakong nasa itaas,” malamang na tumutukoy ito sa panloob o matataas na rehiyon, salungat sa rutang baybayin. Malinaw ang heograpikong diwa nang hindi labis na nililimitahan ang kahulugan.
- source_word: ἐλθεῖν εἰς Ἔφεσον
  choice: pumunta sa Efeso
  rationale: Tuwiran at natural na paglalarawan ng pagdating o pagkilos patungo sa lungsod.
- source_word: καὶ εὑρεῖν
  choice: at nakatagpo roon
  rationale: Ang “nakatagpo” ay likas sa Filipino para sa pagkakita o pagkakasumpong sa mga tao; idinagdag ang “roon” upang malinaw na sa Efeso naganap ang pagtatagpo.
- source_word: τινας μαθητάς
  choice: ilang alagad
  rationale: Pinananatili ng “ilang” ang di-tiyak na τινας at ng “alagad” ang karaniwang kahulugan ng μαθητής nang hindi pa tinutukoy kung kaninong mga alagad sila.
theological_decisions:
- issue: Pagkakakilanlan ng μαθητάς
  choice: ilang alagad
  alternative: ilang alagad ni Juan; ilang alagad ni Jesus
  rationale: Hindi tinutukoy ng talata kung kaninong mga alagad sila. Nililinaw lamang ng mga sumusunod na talata ang kaugnayan nila sa bautismo ni Juan, kaya hindi dapat paunang lutasin sa pangunahing teksto ang kanilang pagkakakilanlan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Apolos,” “Corinto,” at “Efeso” ayon sa karaniwang anyong Filipino ng mga pangalang biblikal. Pinanatiling neutral ang “ilang alagad,” at inilagay sa talababa ang tunay na heograpikong alternatibo ng τὰ ἀνωτερικὰ μέρη.
