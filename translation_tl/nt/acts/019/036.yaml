  yaml_path: translation/nt/acts/019/036.yaml
  text: Therefore[a], since these things are undeniable[c][b], it is necessary for you to remain calm and to do nothing rash.
translation:
  language: tl
  text: Kaya, yamang hindi maikakaila ang mga bagay na ito, kailangan ninyong manatiling mahinahon[a] at huwag gumawa ng anumang padalus-dalos na bagay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “manatiling kalmado” o “manatiling panatag.”
    reason: lexical_alternative
  - marker: b
    text: O “huwag gumawa ng anumang walang-ingat” o “huwag kumilos nang minamadali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναντιρρήτων
  choice: hindi maikakaila
  rationale: Ipinapahayag ng salita na ang mga bagay na tinutukoy ay hindi makatuwirang masasalungat o mapagtatalunan. Ang “hindi maikakaila” ay natural at malinaw sa makabagong Tagalog.
- source_word: οὖν
  choice: Kaya
  rationale: Nagpapakita ito ng kongklusyon mula sa naunang pangangatwiran. Likas sa Tagalog ang “Kaya” sa ganitong ugnayang lohikal.
- source_word: ὄντων τούτων
  choice: yamang ... ang mga bagay na ito
  rationale: Ang genitive absolute ay nagbibigay ng batayan ng kasunod na panawagan; malinaw na naipahahayag ng “yamang” ang ganitong dahilang pangyayari.
- source_word: δέον ἐστίν
  choice: kailangan
  rationale: Nagsasaad ang impersonal na parirala ng pangangailangan o pananagutan. Direkta at natural ang “kailangan” nang hindi pinatitindi ang diwa.
- source_word: κατεσταλμένους ὑπάρχειν
  choice: manatiling mahinahon
  rationale: Inilalarawan ng parirala ang patuloy na kalagayang panatag at kontrolado. Mas angkop ang “manatiling mahinahon” kaysa simpleng “tumahimik,” na maaaring mangahulugan lamang ng hindi pagsasalita.
- source_word: μηδὲν προπετὲς πράσσειν
  choice: huwag gumawa ng anumang padalos-dalos
  rationale: Ang προπετής ay tumutukoy sa kilos na minadali o ginawa nang walang sapat na pag-iisip. Karaniwan at eksakto sa Tagalog ang “padalos-dalos.”
