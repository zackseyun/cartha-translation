- from: Napuno ng kaguluhan ang buong lungsod, at sama-sama silang sumugod sa teatro, habang sapilitang kinakaladkad sina Gayo at Aristarco—mga taga-Macedonia na kasama ni Pablo sa paglalakbay.[a]
  to: Napuno ng kaguluhan ang lungsod, at sama-sama silang sumugod sa teatro, habang sapilitang kinaladkad nila sina Gayo at Aristarco—mga taga-Macedonia na kasama ni Pablo sa paglalakbay.[a]
  rationale: Inalis ang “buong” upang huwag magdagdag sa saklaw ng pahayag ng Griyego. Pinalitan ang “kinakaladkad” ng “kinaladkad” upang mas maayos na maipahayag ang aorist na marahas na pagkuha at pagdadala, habang pinananatili ang natural na Filipino at ang ugnayan ng kilos sa pagsugod ng karamihan sa teatro.
