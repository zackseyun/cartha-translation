base_translation:
  language: en
  yaml_path: translation/nt/acts/019/029.yaml
  text: And the city was filled with confusion[a], and they rushed together into the theater, dragging along Gaius and Aristarchus, Macedonians who were Paul’s traveling companions.
translation:
  language: tl
  text: Napuno ng kaguluhan ang lungsod, at sama-sama silang sumugod sa teatro, habang sapilitang kinaladkad nila sina Gayo at Aristarco—mga taga-Macedonia na kasama ni Pablo sa paglalakbay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sapilitang dinakip” o “biglang sinunggaban.” Binibigyang-diin ng salitang Griyego ang marahas na pagkuha sa kanila; ipinakikita ng “kinaladkad” ang sapilitan nilang pagdadala kasabay ng pagdagsa ng mga tao sa teatro.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθη ἡ πόλις τῆς συγχύσεως
  choice: Napuno ng kaguluhan ang buong lungsod
  rationale: Pinananatili ng “napuno” ang pasibong diwa ng pandiwa, habang natural na ipinahahayag ng “kaguluhan” ang magulong kalagayan ng lungsod.
- source_word: ὥρμησάν
  choice: sumugod
  rationale: Ipinahahayag nito ang biglaan, maramihan, at marahas na pagkilos ng mga tao.
- source_word: ὁμοθυμαδόν
  choice: sama-sama
  rationale: Sa konteksto ng kaguluhan, tumutukoy ito sa sabay-sabay na pagkilos ng pangkat, hindi sa positibong pagkakaisa.
- source_word: θέατρον
  choice: teatro
  rationale: Tuwirang katumbas ito ng pampublikong teatro; hindi kailangang gawing mas tiyak na “amphitheater.”
- source_word: συναρπάσαντες
  choice: habang sapilitang kinakaladkad
  rationale: Naihahayag nito kapwa ang marahas na pagdakip at ang sapilitang pagdadala sa mga lalaki patungo sa teatro.
- source_word: Γάϊον καὶ Ἀρίσταρχον
  choice: sina Gayo at Aristarco
  rationale: Ginamit ang kinagawiang anyong Filipino ng mga pangalang biblikal.
- source_word: Μακεδόνας
  choice: mga taga-Macedonia
  rationale: Natural at malinaw na ipinahahayag ang kanilang heograpikong pinagmulan.
- source_word: συνεκδήμους Παύλου
  choice: kasama ni Pablo sa paglalakbay
  rationale: Natural na Filipino ito para sa mga taong naglalakbay kasama ni Pablo sa labas ng kanilang tahanan.
