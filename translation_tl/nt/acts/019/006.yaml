revisions:
- from: At nang ipatong ni Pablo ang kanyang mga kamay sa kanila, bumaba sa kanila ang Banal na Espiritu, at nagsimula silang magsalita sa mga wika[a] at magpahayag ng propesiya.
  to: Nang ipinatong ni Pablo ang kanyang mga kamay sa kanila, dumating sa kanila ang Banal na Espiritu, at nagsalita sila sa mga wika[a] at nagpropesiya.
  rationale: Inalis ang di-singaw na imaheng pababa sa “bumaba” at isinalin ang ἦλθε ... ἐπ’ αὐτούς bilang “dumating sa kanila.” Inayos ang anyo ng pandiwang tumutukoy sa pagpapatong ng mga kamay. Ginamit ang karaniwang narratibong “nagsalita” at “nagpropesiya” para sa mga imperfect, nang hindi nagdaragdag ng tiyak na pagsisimulang hindi kinakailangang ipinipilit ng anyo. Inayos din ang talababa upang malinaw na mapanatili ang leksikal at teolohikal na kalabuan ng γλώσσαις.
