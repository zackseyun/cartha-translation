  text: καὶ ἐπιθέντος αὐτοῖς τοῦ ⸀Παύλου χεῖρας ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς, ἐλάλουν τε γλώσσαις καὶ ἐπροφήτευον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/006.yaml
  text: And when Paul laid his hands on them[a], the Holy Spirit came upon them, and they began speaking in tongues and prophesying.
translation:
  language: tl
  text: Nang ipinatong ni Pablo ang kanyang mga kamay sa kanila, dumating sa kanila ang Banal na Espiritu, at nagsalita sila sa mga wika[a] at nagpropesiya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay maaaring mangahulugang “mga dila” o “mga wika.” Hindi nililinaw ng talatang ito kung mga wikang pantao o ibang uri ng pananalita ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθέντος αὐτοῖς τοῦ Παύλου χεῖρας
  choice: nang ipatong ni Pablo ang kanyang mga kamay sa kanila
  rationale: Ginawang sugnay na panahunan ang aorist genitive absolute, at pinanatili ang likas na idyomang Tagalog na “ipatong ang mga kamay.”
- source_word: ἦλθε ... ἐπ’ αὐτούς
  choice: bumaba sa kanila
  rationale: Sa konteksto ng pagdating ng Espiritu, natural sa Tagalog ang “bumaba sa kanila” at naipahahayag nito ang kilos na nakatuon sa kanila, bagaman maaari ring isaling “dumating sa kanila.”
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: ang Banal na Espiritu
  rationale: Ito ang malinaw at karaniwang makabagong katawagan sa Filipino.
- source_word: ἐλάλουν
  choice: nagsimula silang magsalita
  rationale: Ipinahahayag ng imperfect sa kontekstong pasalaysay ang pagsisimula at nagpapatuloy na kilos; natural itong naihahatid sa Filipino sa “nagsimula silang magsalita.”
- source_word: γλώσσαις
  choice: sa mga wika
  rationale: Ang γλῶσσα ay maaaring tumukoy sa dila o wika. Sa Filipino, ang “mga wika” ang natural na parirala para sa uri ng pagsasalitang inilalarawan, habang nililinaw sa talababa ang saklaw ng salitang Griyego.
- source_word: ἐπροφήτευον
  choice: magpahayag ng propesiya
  rationale: Malinaw na ipinahahayag ang gawaing propetiko nang hindi gumagamit ng mas luma o di-gaanong likas na anyong “manghula.”
- source_word: τε ... καί
  choice: at
  rationale: Likas na pinag-uugnay sa Filipino ng “at” ang dalawang magkaugnay na kilos.
theological_decisions:
- issue: Kalikasan ng γλώσσαις sa Mga Gawa 19:6
  choice: “mga wika” sa pangunahing teksto, na may talababa tungkol sa literal na “mga dila” at sa hindi ganap na tiyak na uri ng pananalita
  alternative: “mga dila” o “ibang mga wika”
  rationale: Ang Griyego ay maaaring mangahulugang mga dila o mga wika. Hindi tinutukoy ng talata lamang kung ito ay mga kilalang wikang pantao o ibang uri ng pananalitang kaloob ng Espiritu, kaya hindi dapat resolbahin ng salin ang pinagtatalunang usapin.
- issue: Pagdating ng Banal na Espiritu
  choice: “bumaba sa kanila ang Banal na Espiritu”
  alternative: “dumating sa kanila ang Banal na Espiritu”
  rationale: Inilalarawan nito ang pangyayari ayon sa salaysay at hindi nagdaragdag ng paliwanag tungkol sa pagkakasunod-sunod ng karanasan o sa sanhi nitong sakramental.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang “manghula,” na maaaring mapagkamalang paghula lamang sa hinaharap, at ginamit ang “magpahayag ng propesiya” upang ipakita ang propetikong pagsasalita.
