  rationale: Pinalitan ang “sinidlan ng takot” ng mas natural na “binalot ng takot,” na malinaw na naghahatid ng pagdating ng takot sa buong pangkat nang walang labis na pagpapakahulugan. Inayos ang ayos ng huling pangungusap upang maging higit na natural habang pinananatili ang imperfect na diwa sa “patuloy na dinakila.”
