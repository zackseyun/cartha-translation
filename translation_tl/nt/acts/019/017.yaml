  text: τοῦτο δὲ ἐγένετο γνωστὸν πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν τοῖς κατοικοῦσιν τὴν Ἔφεσον, καὶ ⸀ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς, καὶ ἐμεγαλύνετο τὸ ὄνομα τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/017.yaml
  text: And this became known to all the Jews and Greeks living in Ephesus[a], and fear fell upon them all[b], and the name of the Lord Jesus was being magnified.
translation:
  language: tl
  text: Nalaman ito ng lahat ng Judio at Griyego na naninirahan sa Efeso, at binalot ng takot ang lahat[a]. Ang pangalan ng Panginoong Jesus ay patuloy na dinakila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bumagsak ang takot sa kanilang lahat”; maaari ring “dinatnan silang lahat ng takot.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “itinaas” o “lubos na pinarangalan ang pangalan ng Panginoong Jesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ito
  rationale: Tumutukoy ang pang-isahang demonstratibo sa naunang pangyayari; natural at sapat na tiyak ang “ito” sa Filipino.
- source_word: ἐγένετο γνωστὸν
  choice: nalaman
  rationale: Natural na ipinahahayag ng “nalaman” na ang pangyayari ay naging hayag o umabot sa kaalaman ng mga tao, nang hindi ginagawang tahasang may isang tagapagbalita.
- source_word: πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: ng lahat ng Judio at Griyego
  rationale: Ang datibo ang tumutukoy sa mga taong nakaalam; pinananatili ng “lahat” ang saklaw ng πᾶσιν at malinaw na binabanggit ang dalawang pangkat.
- source_word: τοῖς κατοικοῦσιν τὴν Ἔφεσον
  choice: naninirahan sa Efeso
  rationale: Karaniwan at makabagong katumbas ito ng κατοικέω at kapuwa inilalarawan ang mga Judio at Griyego.
- source_word: ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς
  choice: silang lahat ay sinidlan ng takot
  rationale: Natural na idyomang Filipino ito para sa pagdating at paglaganap ng takot sa kanilang lahat. Inilalagay sa talababa ang mas matalinghagang anyo ng Griyego.
- source_word: φόβος
  choice: takot
  rationale: Saklaw ng “takot” ang pangunahing diwa nang hindi nililimitahan ito sa sindak lamang o binibigyang-kahulugan agad bilang pagpipitagan.
- source_word: ἐμεγαλύνετο
  choice: patuloy na dinakila
  rationale: Ipinahahayag ng “patuloy” ang aspektong di-ganap ng imperfect, samantalang ang “dinakila” ay natural na nagsasaad ng pampublikong pagdakila o mataas na pagpapahalaga.
- source_word: τὸ ὄνομα
  choice: ang pangalan
  rationale: Pinananatili ang tahasang “pangalan” at ang biblikal na kaugnayan nito sa dangal, pagkakakilanlan, at awtoridad sa halip na paliitin ito sa “reputasyon.”
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ng Panginoong Jesus
  rationale: Ginagamit ang karaniwang anyong Filipino ng titulong κύριος para kay Jesus, at malinaw na inuugnay ito sa “pangalan.”
theological_decisions:
- issue: Pagpapakahulugan sa φόβος bilang takot o pagpipitagan
  choice: takot
  alternative: pagkamangha o pagpipitagan
  rationale: Maaaring maglaman ng takot at pagkamangha ang φόβος, ngunit “takot” ang pinakamalawak at hindi gaanong mapagpasyang salin sa konteksto ng naunang pagpapamalas ng espirituwal na kapangyarihan.
- issue: Pagsasalin sa κύριος bilang titulo ni Jesus
  choice: Panginoon
  alternative: Guro o Amo
  rationale: Dito ay kristolohikal na titulo ang κύριος; pinananatili ng “Panginoon” ang bigat nito nang hindi ito pinapaliit sa ugnayang panlipunan ng amo at lingkod.
- issue: Kung isasalin ang τὸ ὄνομα bilang pangalan o reputasyon
  choice: ang pangalan ng Panginoong Jesus
  alternative: ang reputasyon ng Panginoong Jesus
  rationale: Tahasan ang “pangalan” sa Griyego at may mas malawak na biblikal na diwa kaysa reputasyon lamang; hindi dapat paliitin ang pahiwatig nito sa dangal at awtoridad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sinidlan ng takot” sa pangunahing teksto upang maging natural, habang pinanatili sa talababa ang matingkad na metapora ng Griyego. Ang “patuloy na” ay nagpapakita ng aspektong imperfect ng ἐμεγαλύνετο.
