  text: εἶπεν δὲ Παῦλος· ⸀Ἰωάννης ἐβάπτισεν βάπτισμα μετανοίας, τῷ λαῷ λέγων εἰς τὸν ἐρχόμενον μετ’ αὐτὸν ἵνα πιστεύσωσιν, τοῦτ’ ἔστιν εἰς ⸀τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/004.yaml
  text: And Paul said[a], “John baptized with a baptism of repentance, telling the people to believe in the one coming after him—that is, in Jesus.”
translation:
  language: tl
  text: Sinabi naman ni Pablo, “Nagbautismo si Juan ng bautismo ng pagsisisi, at sinabi niya sa mga tao na sumampalataya sila sa darating pagkatapos niya—iyon ay, kay Jesus.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβάπτισεν βάπτισμα μετανοίας
  choice: Nagbautismo ... ng bautismo ng pagsisisi
  rationale: Pinananatili ang magkaugnay na pandiwa at pangngalan sa Griyego, na natural pa rin sa pormal at biblikal na Filipino. Ang “pagsisisi” ay nagpapahayag ng pagbabago ng isip at pagbaling ng kalooban na tinutukoy ng μετάνοια.
- source_word: τῷ λαῷ
  choice: sa mga tao
  rationale: Tapat ito sa kolektibong kahulugan ng λαός nang hindi idinaragdag na tahasang mga Israelita ang tinutukoy.
- source_word: λέγων
  choice: at sinabi niya
  rationale: Ipinapahayag nang natural ang kasabay na mensahe ni Juan habang malinaw na si Juan, hindi si Pablo, ang simuno.
- source_word: εἰς τὸν ἐρχόμενον μετ’ αὐτὸν
  choice: sa darating na kasunod niya
  rationale: Ang “sumampalataya sa” ay natural na katumbas ng πιστεύω εἰς. Ipinakikita ng “darating na kasunod niya” kapuwa ang pagdating at ang pagkakasunod kay Juan.
- source_word: ἵνα πιστεύσωσιν
  choice: na sumampalataya sila
  rationale: Pinananatili ang puwersa ng utos o layuning nilalaman ng pangangaral ni Juan nang hindi pinipilit ang ἵνα sa isang mas makitid na pagbasa.
- source_word: τοῦτ’ ἔστιν
  choice: samakatuwid
  rationale: Ginagamit bilang natural na panandang nagpapaliwanag at tumutukoy kung sino ang “darating na kasunod niya.”
- source_word: εἰς τὸν Ἰησοῦν
  choice: kay Jesus
  rationale: Dahil ipinagpapatuloy ang diwang “sumampalataya,” natural sa Filipino ang “kay Jesus.” Hindi idinagdag ang titulong Cristo o Mesiyas na wala sa tekstong Griyego.
theological_decisions:
- issue: Ugnayan ng bautismo ni Juan at pananampalataya kay Jesus
  choice: Inilalarawan ang bautismo ni Juan bilang bautismo ng pagsisisi, kalakip ang panawagang sumampalataya sa darating na kasunod niya, na kinikilalang si Jesus.
  alternative: Ipahiwatig na ang bautismo ni Juan mismo ang nagdulot ng pananampalatayang Cristiano, o iwang hindi kilala ang darating na kasunod niya.
  rationale: Magkahiwalay ngunit magkaugnay sa pangungusap ang pagbautismo ni Juan at ang mensaheng sinabi niya sa mga tao. Tahasang kinikilala ng huling parirala na si Jesus ang tinutukoy, nang walang idinaragdag na sistematikong paliwanag tungkol sa bisa ng bautismo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang terminong “bautismo” at ang cognate na “nagbautismo ... ng bautismo” para sa lapit sa Griyego, habang inayos ang pangungusap upang madaling maunawaan ng karaniwang mambabasa.
