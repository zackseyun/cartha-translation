  source_fidelity: Tumpak sa kabuuan ang paglalarawan sa bautismo ni Juan bilang “bautismo ng pagsisisi” at ang panawagan niyang sumampalataya sa taong darating pagkatapos niya, na tahasang kinilala bilang Jesus. Gayunman, ang “samakatuwid” ay karaniwang nagpapahiwatig ng konklusyon o bunga, samantalang ang τοῦτ’ ἔστιν ay isang tuwirang paglilinaw o pagkakakilanlan (“iyon ay”).
  naturalness: Malinaw ang pangungusap, ngunit mas natural ang “sa darating pagkatapos niya” kaysa “sa darating na kasunod niya.” Ang una ay tuwirang nagpapahayag ng χρονological succession na nasa μετ’ αὐτόν nang walang bahagyang kalabuan ng “kasunod.”
  terminology: Ang “bautismo,” “pagsisisi,” at “sumampalataya” ay angkop sa marangal at modernong rehistrong Filipino. Hindi dapat idagdag ang “Cristo” o “Mesiyas,” sapagkat pangalan lamang na Jesus ang nasa Griyego.
  issues:
