    rationale: Ang Griyego ay nagpapaliwanag kung sino ang “darating pagkatapos niya”; hindi ito naghihinuha ng isang konklusyon mula sa naunang pahayag. Ang “iyon ay” ang mas tumpak na panandang nagpapaliwanag.
  - severity: low
    issue: Medyo di-natural at maaaring malabo ang “darating na kasunod niya.”
    rationale: Mas tuwiran at likas sa Filipino ang “darating pagkatapos niya,” na pinananatili ang ideya ng isang darating na tao na sumusunod kay Juan.
