source:
  edition: SBLGNT
  text: ἀποστείλας δὲ εἰς τὴν Μακεδονίαν δύο τῶν διακονούντων αὐτῷ, Τιμόθεον καὶ Ἔραστον, αὐτὸς ἐπέσχεν χρόνον εἰς τὴν Ἀσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/022.yaml
  text: So after sending into Macedonia two of those who were ministering to him—Timothy and Erastus—he himself stayed for a time in Asia[a].
translation:
  language: tl
  text: Kaya pagkatapos niyang isugo sa Macedonia ang dalawa sa mga naglilingkod sa kanya—sina Timoteo at Erasto—siya mismo ay nanatili nang ilang panahon sa Asia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tinutukoy ay ang Romanong lalawigan ng Asia sa kanlurang Asia Minor, hindi ang kontinente ng Asia sa makabagong kahulugan.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποστείλας
  choice: pagkatapos niyang isugo
  rationale: Ipinahahayag ang kilos ng aorist participle bilang nauna sa pangunahing pandiwang ἐπέσχεν, habang nananatiling natural sa Tagalog.
- source_word: δὲ
  choice: Kaya
  rationale: Banayad na pang-ugnay ito na nagpapatuloy sa salaysay, hindi matinding pagsalungat.
- source_word: εἰς τὴν Μακεδονίαν
  choice: sa Macedonia
  rationale: Sa modernong Tagalog, likas na ipinahahayag ng “sa” ang patutunguhan; hindi kailangang piliting gawing tahasang “papasok sa.”
- source_word: δύο τῶν διακονούντων αὐτῷ
  choice: ang dalawa sa mga naglilingkod sa kanya
  rationale: Pinananatili ang ideya ng personal na paglilingkod nang hindi ipinapalagay na may tiyak silang katungkulan o opisyal na titulo.
- source_word: Τιμόθεον καὶ Ἔραστον
  choice: sina Timoteo at Erasto
  rationale: Ginamit ang mga karaniwang anyong Tagalog ng mga pangalang biblikal at ang pantukoy na “sina” para sa dalawang tao.
- source_word: αὐτὸς
  choice: siya mismo
  rationale: Pinananatili ang diin at paghahambing kay Pablo laban sa dalawang isinugo niya.
- source_word: ἐπέσχεν χρόνον
  choice: nanatili muna nang ilang panahon
  rationale: Likas na salin ng idyomang tumutukoy sa pananatili sa loob ng di-tiyak na panahon; ang “muna” ay tumutulong ipakita ang pansamantalang pananatili sa daloy ng salaysay.
- source_word: εἰς τὴν Ἀσίαν
  choice: sa Asia
  rationale: 'Sa ugnayan nito sa ἐπέσχεν χρόνον, lokatibo ang diwa: nanatili siya sa Asia. Ipinaliliwanag sa talababa ang makasaysayang saklaw ng pangalan.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang diin ng αὐτός sa “siya mismo” at iniwasang gawing opisyal na titulo ang διακονούντων.
