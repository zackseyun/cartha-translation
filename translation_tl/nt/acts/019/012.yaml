source:
  edition: SBLGNT
  text: ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ⸀ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια καὶ ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ⸀ἐκπορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/012.yaml
  text: so that even handkerchiefs or work aprons were carried away from his body to the sick[a], and the diseases left them[b], and the evil spirits went out.
translation:
  language: tl
  text: Kaya maging mga panyo o mga epron ay dinadala mula sa balat ni Pablo papunta sa mga maysakit, at nawawala sa kanila ang mga karamdaman, at lumalabas ang masasamang espiritu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: kaya
  rationale: Ipinahahayag ang bunga ng pambihirang mga himalang binanggit sa naunang talata.
- source_word: ἐπὶ τοὺς ἀσθενοῦντας
  choice: sa mga maysakit
  rationale: Likas at malinaw na salin para sa mga taong may karamdaman at sa patutunguhan ng mga bagay.
- source_word: ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ
  choice: na idinampi sa balat ni Pablo ay dinadala
  rationale: Ipinakikita ang pagdadala ng mga telang nanggaling sa pagkakadikit sa kaniyang balat; pinangalanan si Pablo upang maging malinaw ang reperente sa Filipino.
- source_word: σουδάρια
  choice: mga panyo
  rationale: Karaniwang tawag sa mga telang ginagamit na pamunas ng mukha o pawis.
- source_word: σιμικίνθια
  choice: epron sa trabaho
  rationale: Tumutukoy sa epron o kasuotang ginagamit sa manwal na paggawa; nililinaw ng pariralang 'sa trabaho' ang gamit nito.
- source_word: ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους
  choice: nawawala ang kanilang mga karamdaman
  rationale: Natural sa Filipino at pinananatili ang larawan na humihiwalay o nawawala sa mga maysakit ang mga karamdaman.
- source_word: τά τε πνεύματα τὰ πονηρὰ ἐκπορεύεσθαι
  choice: lumalabas ang masasamang espiritu
  rationale: Tuwirang isinasalin ang karaniwang paglalarawan sa pag-alis ng masasamang espiritu mula sa mga tao.
theological_decisions:
- issue: Ang pagpapagaling at pagpapalayas ng masasamang espiritu na kaugnay ng mga telang nanggaling kay Pablo
  choice: Isinalaysay nang tuwiran ang pangyayari nang hindi ipinapaliwanag ang mekanismo nito.
  alternative: Ipahiwatig ang pagsamba sa mga relikya, o ituring ang pangyayari bilang simboliko lamang.
  rationale: Iniuulat ng teksto ang pambihirang pangyayari ngunit hindi nagtatatag ng doktrina tungkol sa mga relikya at hindi rin binabawasan ang supernatural na pahayag.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang karaniwang 'panyo' at ang madaling maunawaang 'epron sa trabaho.' Ang mas literal na 'balat' ay pinanatili para sa χρώς, samantalang ang konstruksyon ay inayos upang maging natural sa Tagalog.
