  verdict: revise
  source_fidelity: Ang idinampi sa balat ni Pablo ay nagdaragdag ng ideyang idinampi o sadyang ipinahid ang mga tela sa kaniya. Hindi ito tahasang sinasabi ng ἀπὸ τοῦ χρωτὸς αὐτοῦ, na nagsasaad lamang na ang mga tela ay mula sa kaniyang balat/katawan. Ang salin ay dapat panatilihin ang direksiyong ito nang walang dagdag na kilos.
  naturalness: Natural at malinaw ang karamihan ng pangungusap, ngunit mas tuwiran at maayos sa modernong Filipino ang “mula sa balat ni Pablo ay dinadala ... papunta sa mga maysakit.” Ang “mga epron” ay sapat at mas hindi nagpapaliit sa kahulugan kaysa “epron sa trabaho.”
  terminology: Ang “mga panyo,” “mga karamdaman,” at “masasamang espiritu” ay angkop. Pinanatili ang “balat” para sa χρώς, na literal na tumutukoy sa ibabaw ng katawan/skin, nang hindi ipinapahiwatig ang anumang doktrina o mekanismo.
  issues:
