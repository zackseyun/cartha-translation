    issue: Ang “na idinampi sa balat ni Pablo” ay may idinagdag na kilos.
    rationale: Hindi sinasabi ng Griyego na idinampi ang mga panyo o epron kay Pablo; sinasabi nitong dinala ang mga ito mula sa kaniyang χρώς (“balat”).
  - severity: low
    issue: Ang “epron sa trabaho” ay mas espesipiko kaysa kailangan.
    rationale: Ang σιμικίνθια ay mga apron o kasuotang pangtrabaho, ngunit ang “mga epron” ay sapat, natural, at hindi labis na nagpapakahulugan.
  revised_text: Kaya maging mga panyo o mga epron ay dinadala mula sa balat ni Pablo papunta sa mga maysakit, at nawawala sa kanila ang mga karamdaman, at lumalabas ang masasamang espiritu.
