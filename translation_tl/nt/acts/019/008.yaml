  source_fidelity: 'Tumpak ang pangunahing diwa: pumasok siya sa sinagoga, matapang na nagsalita nang tatlong buwan, at ang paksa ay ang kaharian ng Diyos. Gayunman, ang «nakikipagkatuwiranan» ay hindi ang pinakanatural o pinakatiyak na modernong Filipino para sa διαλεγόμενος at maaaring magpahiwatig ng pakikipagtalo. Mas malinaw ang «nakikipagpaliwanagan,» na nagpapanatili ng diwang pakikipag-usap na may pangangatwiran. Ang tahasang «sa kanila» ay isang ligtas na paglilinaw sa ipinahihiwatig na mga tagapakinig ng πείθων.'
  naturalness: Marangal at malinaw ang pangungusap sa kabuuan. Gayunman, ang pares na «nakikipagkatuwiranan at nanghihikayat tungkol sa» ay bahagyang mabigat at hindi gaanong natural. Ang «nakikipagpaliwanagan at nanghihikayat sa kanila tungkol sa» ay mas idiomatiko sa modernong Filipino.
  terminology: Ang «sinagoga» at «kaharian ng Diyos» ay angkop at dapat panatilihin. Ang «buong tapang na nagsalita» ay wastong salin ng ἐπαρρησιάζετο at, kasama ng «sa loob ng tatlong buwan,» sapat na naihahatid ang aspektong nagpapatuloy.
