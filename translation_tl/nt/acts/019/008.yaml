  text: Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο ἐπὶ μῆνας τρεῖς διαλεγόμενος καὶ ⸀πείθων περὶ τῆς βασιλείας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/008.yaml
  text: And entering the synagogue[a], he spoke boldly for three months[b], reasoning and persuading them about the kingdom of God.
translation:
  language: tl
  text: Pagpasok niya sa sinagoga, buong tapang siyang nagsalita sa loob ng tatlong buwan, nakikipagpaliwanagan at nanghihikayat sa kanila tungkol sa kaharian ng Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθὼν
  choice: Pagpasok niya
  rationale: Likas na ipinahahayag sa Tagalog ang pang-abay na gamit ng aorist participle at ipinakikitang ito ang kalagayang nauna sa pangunahing kilos.
- source_word: συναγωγήν
  choice: sinagoga
  rationale: Tiyak na tumutukoy sa lugar ng pagtitipon at pagsamba ng mga Judio; malinaw at kinikilalang katawagan ito sa Filipino.
- source_word: ἐπαρρησιάζετο
  choice: buong tapang siyang nagsalita
  rationale: Ipinahahayag ang hayag at matapang na pagsasalita; ang patuloy na kilos ng imperfect ay sinusuportahan ng pariralang 'sa loob ng tatlong buwan.'
- source_word: ἐπὶ μῆνας τρεῖς
  choice: sa loob ng tatlong buwan
  rationale: Natural na salin ng pariralang nagsasaad ng tagal.
- source_word: διαλεγόμενος
  choice: nakikipagkatuwiranan
  rationale: Ipinakikita ang pakikipagtalakayan na may paliwanag at pangangatwiran, hindi lamang isang panig na pagsasalita.
- source_word: πείθων
  choice: nanghihikayat
  rationale: Inilalarawan ang aktibong panghihikayat nang hindi ipinapalagay na talagang nakumbinsi ang lahat ng nakikinig.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: tungkol sa kaharian ng Diyos
  rationale: Direktang ipinahahayag ang paksa; pinananatili ng 'kaharian ng Diyos' ang mahalaga at nakikilalang parirala sa Bagong Tipan.
theological_decisions:
- issue: Hindi tahasang binanggit sa Griyego ang layon ng πείθων.
  choice: Hindi nagdagdag ng tahasang layon sa 'nanghihikayat.'
  alternative: nanghihikayat sa kanila
  rationale: Maaaring gamitin ang pandiwang Filipino nang walang tahasang layon, kaya napapanatili ang anyo at bahagyang kalabuan ng Griyego habang malinaw pa rin sa konteksto na ang mga nasa sinagoga ang kinakausap.
- issue: Saklaw ng kahulugan ng βασιλεία τοῦ θεοῦ.
  choice: kaharian ng Diyos
  alternative: paghahari ng Diyos
  rationale: Maaaring tumukoy ang βασιλεία sa kaharian o paghahari. Ang 'kaharian ng Diyos' ay tumpak, pamilyar, at hindi isinasara ang teolohikal na lawak ng parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang iisang mahabang pangungusap upang maipakita ang ugnayan ng pangunahing kilos at ng dalawang kasabay na participle, nang hindi nagiging mabigat ang daloy.
