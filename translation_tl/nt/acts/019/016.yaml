  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀ἐφαλόμενος ⸂ὁ ἄνθρωπος ἐπ’ αὐτοὺς⸃ ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρὸν ⸂κατακυριεύσας ἀμφοτέρων⸃ ἴσχυσεν κατ’ αὐτῶν, ὥστε γυμνοὺς καὶ τετραυματισμένους ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/016.yaml
  text: And the man in whom the evil spirit was leaped on them[a], and after overpowering both of them, prevailed against them[c][b], so that they fled out of that house naked and wounded.
translation:
  language: tl
  text: At ang lalaking kinaroroonan ng masamang espiritu ay dumamba sa kanila[a] at, matapos niyang daigin ang dalawa sa kanila[b], nanaig laban sa kanila, kaya tumakas silang hubad at sugatan palabas ng bahay na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lumukso sa kanila” o “sumagpang sa kanila.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “ang dalawa sa kanila.” Bagaman higit sa dalawa ang binabanggit sa mas malawak na konteksto, tahasang dalawa ang tinutukoy rito ng teksto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφαλόμενος
  choice: dumamba
  rationale: Ipinahahayag ng pandiwa ang biglaan at marahas na pagtalon o pagsagpang sa isang tao. Likas at matingkad sa Filipino ang “dumamba” sa ganitong tagpo.
- source_word: ὁ ἄνθρωπος
  choice: ang lalaki
  rationale: Panlalaking isahan ang pangngalan at tumutukoy sa lalaking kinaroroonan ng espiritu.
- source_word: ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρόν
  choice: kinaroroonan ng masamang espiritu
  rationale: Pinananatili nito ang paglalarawan ng Griyego na ang espiritu ay nasa loob ng lalaki, nang hindi gumagamit ng mas teknikal na terminong wala mismo sa parirala.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: ang masamang espiritu
  rationale: Karaniwan, malinaw, at angkop sa konteksto ng pagpapalayas ng espiritu ang saling ito.
- source_word: κατακυριεύσας
  choice: nadaig
  rationale: Ipinahahayag nito ang pagkuha ng ganap na pangingibabaw sa pamamagitan ng lakas.
- source_word: ἀμφοτέρων
  choice: silang dalawa
  rationale: Tahasang tumutukoy ang salita sa dalawa; pinananatili ng salin ang detalyeng ito sa kabila ng tensiyon nito sa mas malawak na konteksto.
- source_word: ἴσχυσεν κατ’ αὐτῶν
  choice: nanaig siya laban sa kanila
  rationale: Pinananatili nito ang hiwalay na diwa ng pagiging mas malakas at pagwawagi laban sa kanila, sa halip na isama lamang sa naunang “nadaig.”
- source_word: γυμνούς
  choice: hubad
  rationale: Tuwirang inilalarawan ng Griyego ang kalagayan nila bilang hubad, hindi lamang punit ang damit.
- source_word: τετραυματισμένους
  choice: sugatan
  rationale: Ipinahahayag nito ang resultang kalagayan ng mga nasaktan matapos ang marahas na sagupaan.
- source_word: ἐκφυγεῖν
  choice: tumakas
  rationale: Saklaw nito ang diwa ng pagtakas o pagkaligtas sa pamamagitan ng mabilis na pag-alis.
- source_word: ἐκ τοῦ οἴκου ἐκείνου
  choice: mula sa bahay na iyon
  rationale: Malinaw nitong ipinahahayag ang paglabas at paglayo nila sa tinukoy na bahay.
theological_decisions:
- issue: Paglalarawan sa kaugnayan ng masamang espiritu sa lalaki
  choice: ang lalaking kinaroroonan ng masamang espiritu
  alternative: ang lalaking sinapian ng masamang espiritu
  rationale: Mas malapit ang pinili sa literal na paglalarawan na nasa lalaki ang espiritu at hindi nito ipinapasok ang isang teknikal na terminong higit sa sinasabi ng Griyego.
- issue: Saklaw ng ἀμφοτέρων kaugnay ng mas malaking pangkat
  choice: silang dalawa
  alternative: silang lahat
  rationale: Tahasang “dalawa” ang nasa Griyego. Pinananatili ang tekstuwal na tensiyon sa halip na pakinisin ito batay sa pagbanggit sa mas maraming anak ni Esceva sa konteksto.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “dumamba” upang mapanatili ang biglaan at marahas na kilos, at pinanatili ang “silang dalawa” nang hindi nilulutas ang tensiyon nito sa konteksto.
