translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang 'kapulungan' upang mapanatili ang posibleng sibikong kahulugan ng δῆμος, at inilagay sa talababa ang lehitimong alternatibong 'karamihan.'
