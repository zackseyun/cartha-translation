  yaml_path: translation/nt/acts/019/030.yaml
  text: But when Paul wanted to go in among the assembly[a], the disciples would not let him.
translation:
  language: tl
  text: Ngunit nang nais ni Pablo na pumasok sa kapulungan[a], hindi siya pinayagan ng mga alagad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa gitna ng kapulungan” o “sa gitna ng karamihan.” Sa kontekstong sibiko rito, ang salitang Griyego na δῆμος ay maaaring tumukoy sa nagkakatipong mamamayan bilang isang pampublikong kapulungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παύλου
  choice: Pablo
  rationale: Ginamit ang nakaugaliang anyo ng pangalang Παῦλος sa modernong Tagalog.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinapakita ng δέ ang bahagyang pagsalungat o pagbabago ng pokus mula sa kilos ng karamihan tungo sa balak ni Pablo.
- source_word: βουλομένου
  choice: nang gustong
  rationale: Ang genitive absolute ay nagpapahayag ng balak o hangarin ni Pablo; natural at tuwiran sa Tagalog ang 'nang gustong.'
- source_word: εἰσελθεῖν
  choice: pumasok
  rationale: Tumpak at likas na katumbas ng kilos na pagpasok.
- source_word: εἰς τὸν δῆμον
  choice: sa gitna ng kapulungan
  rationale: Maaaring tumukoy ang δῆμος sa nagkakatipong mamamayan bilang pampublikong katawan o sa karamihan. Pinananatili ng 'kapulungan' ang aspektong sibiko, habang ipinahihiwatig ng 'sa gitna' ang pagpasok sa pangkat.
- source_word: οὐκ εἴων
  choice: hindi siya pinahintulutan
  rationale: Ipinahahayag ang patuloy o mariing pagpigil na taglay ng imperfect εἴων sa natural at marangal na Tagalog.
- source_word: οἱ μαθηταί
  choice: mga alagad
  rationale: Tuwirang pinananatili ang diwa ng μαθηταί bilang mga tagasunod o nag-aaral, nang hindi idinaragdag ang pag-aaring hindi tahasang nasa Griyego.
