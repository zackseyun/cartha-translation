  naturalness: Hindi likas at hindi ganap na balarila sa modernong Tagalog ang ‘nang gustong pumasok ni Pablo.’ Mas malinaw at natural ang ‘nang nais ni Pablo na pumasok.’ Ang ‘pumasok sa kapulungan’ ay mas tuwiran kaysa ‘pumasok sa gitna ng kapulungan,’ nang hindi binabago ang kahulugan.
