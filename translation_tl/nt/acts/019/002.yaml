  text: εἶπέν ⸀τε πρὸς αὐτούς· Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες; οἱ ⸀δὲ πρὸς αὐτόν· Ἀλλ’ οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/002.yaml
  text: And he said to them[a], “Did you receive the Holy Spirit when you believed?” And they said to him, “No[b], we have not even heard that there is a Holy Spirit.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Tinanggap ba ninyo ang Banal na Espiritu nang sumampalataya kayo?[a]” Sumagot sila sa kanya, “Hindi. Ni hindi nga namin narinig na may Banal na Espiritu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pagkatapos ninyong sumampalataya?” Ang Griyegong participle ay maaaring unawain na may bahagyang naiibang temporal na diin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “Ni hindi nga namin narinig kung may Banal na Espiritu,” o, bilang mas interpretatibong salin, “Ni hindi nga namin narinig na ipinagkaloob na ang Banal na Espiritu.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: At sinabi niya sa kanila
  rationale: Ang τέ ay magaan na nag-uugnay sa naunang salaysay; natural itong naipapahayag sa Tagalog sa pamamagitan ng “At,” samantalang tuwirang isinasalin ng “sinabi” ang εἶπεν.
- source_word: Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες
  choice: Tinanggap ba ninyo ang Banal na Espiritu nang sumampalataya kayo?
  rationale: Ipinahahayag ng “nang sumampalataya kayo” ang temporal na kaugnayan ng aorist participle πιστεύσαντες sa ἐλάβετε nang hindi iginigiit kung eksaktong kasabay o kasunod ang pagtanggap.
- source_word: πνεῦμα ἅγιον
  choice: ang Banal na Espiritu
  rationale: Sa konteksto, tumutukoy ito sa Banal na Espiritu ng Diyos, kaya ang tiyak at nakaugaliang anyong “ang Banal na Espiritu” ang pinakaangkop.
- source_word: οἱ δὲ πρὸς αὐτόν
  choice: Sumagot sila sa kanya
  rationale: Bagaman walang inuulit na tahasang pandiwa sa Griyego, likas na ipinahihiwatig ng konteksto ang pagsagot; ang “Sumagot” ay mas natural sa usapang Tagalog at hindi binabago ang diwa.
- source_word: Ἀλλ’ οὐδ’
  choice: Hindi. Ni hindi nga
  rationale: Pinananatili ng pariralang ito ang mariing pagtanggi at ang lakas ng οὐδέ sa natural na modernong Tagalog.
- source_word: οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν
  choice: Ni hindi nga namin narinig na may Banal na Espiritu
  rationale: Ito ang tuwirang pagbasa sa maikling Griyegong pahayag. Hindi idinaragdag sa pangunahing teksto ang paliwanag na “naipagkaloob na,” sapagkat hindi iyon tahasang nakasaad.
theological_decisions:
- issue: Temporal na kaugnayan ng pagsampalataya at pagtanggap sa Banal na Espiritu
  choice: “nang sumampalataya kayo”
  alternative: “pagkatapos ninyong sumampalataya” o “sa pagsampalataya ninyo”
  rationale: Hindi mag-isang nilulutas ng participle na πιστεύσαντες kung mahigpit na kasunod o kasabay ang pagtanggap. Pinananatili ng salin ang temporal na kaluwagan at iniiwasang magpasok ng denominasyonal na konklusyon.
- issue: Kahulugan ng hindi nila pagkarinig tungkol sa Banal na Espiritu
  choice: “Ni hindi nga namin narinig na may Banal na Espiritu”
  alternative: “Ni hindi nga namin narinig kung may Banal na Espiritu” o, bilang interpretasyon, “Ni hindi nga namin narinig na ipinagkaloob na ang Banal na Espiritu”
  rationale: Tuwiran ngunit maikli ang Griyego at maaaring unawain sa higit sa isang paraan. Pinili ang payak na diwa sa pangunahing teksto at inilagay sa talababa ang tunay na mga alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “ninyo/kayo” para sa maramihang kausap at iniwasan ang arkaiko o labis na teknikal na pananalita. Ang lahat ng talababa ay minarkahan sa pangunahing teksto.
