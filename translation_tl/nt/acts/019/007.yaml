  text: May humigit-kumulang labindalawang lalaki sa kabuuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦσαν
  choice: sila
  rationale: Sa konstruksiyong Filipino, likas na ipinahahayag ng panghalip na “sila” ang pangmaramihang paksa ng ἦσαν; hindi kailangang isalin nang hiwalay ang pandiwang “maging” sa ganitong pangungusap.
- source_word: δὲ
  choice: —
  rationale: Mahinang pang-ugnay ang δέ at walang malinaw na pagsalungat dito; hindi na ito tahasang isinalin upang maging natural ang daloy sa Filipino.
- source_word: οἱ πάντες
  choice: silang lahat
  rationale: Pinananatili nito ang diwang tumutukoy sa kabuuan ng pangkat at natural itong gamitin sa Filipino kapag ibinibigay ang kabuuang bilang.
- source_word: ἄνδρες
  choice: lalaki
  rationale: Ang ἀνήρ ay tiyak na tumutukoy sa mga lalaki, kaya hindi ito ginawang pangkalahatang “mga tao.”
- source_word: ὡσεὶ
  choice: humigit-kumulang
  rationale: Malinaw at dignified na katumbas ito ng panandang nagpapahiwatig ng pagtatantiya.
- source_word: δώδεκα
  choice: labindalawa
  rationale: Tuwirang katumbas ng bilang na δώδεκα.
theological_decisions: []
