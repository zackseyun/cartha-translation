  register: Modernong Filipino na natural at marangal. Inilagay sa unahan ang “Humigit-kumulang labindalawang lalaki” upang malinaw ang tinatayang bilang, habang pinananatili ng “silang lahat” ang pagbubuod sa buong pangkat.
