revisions:
- from: Mula sa karamihan, iniharap nila si Alejandro[a], matapos siyang itulak sa unahan ng mga Judio. Sumenyas si Alejandro sa pamamagitan ng kamay at nais niyang ipagtanggol ang sarili sa kapulungan.[b]
  to: Mula sa karamihan ay iniharap nila si Alejandro[a], sapagkat itinulak siya sa unahan ng mga Judio. Sumenyas si Alejandro gamit ang kaniyang kamay at nagnais na magbigay ng pagtatanggol sa kapulungan.[b]
  rationale: Pinalitan ang temporal na “matapos” ng paliwanag na “sapagkat,” alinsunod sa tungkulin ng genitive absolute sa konteksto. Pinalitan din ang masyadong tiyak na “ipagtanggol ang sarili” ng “magbigay ng pagtatanggol” upang mapanatili ang saklaw ng ἀπολογεῖσθαι. Iningatan ang pagkakaiba ng karamihan at kapulungan, at inayos ang talababa a upang hindi rin magpahiwatig ng hindi kinakailangang temporal na ugnayan.
