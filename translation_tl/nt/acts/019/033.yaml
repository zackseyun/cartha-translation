base_translation:
  language: en
  yaml_path: translation/nt/acts/019/033.yaml
  text: And from the crowd they brought forward Alexander[a], since the Jews had pushed him forward; and Alexander, motioning with his hand[b], wanted to make a defense to the assembly.
translation:
  language: tl
  text: Mula sa karamihan ay iniharap nila si Alejandro[a], sapagkat itinulak siya sa unahan ng mga Judio. Sumenyas si Alejandro gamit ang kaniyang kamay at nagnais na magbigay ng pagtatanggol sa kapulungan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iniharap nila si Alejandro mula sa karamihan … nang iharap siya ng mga Judio.” Dalawang magkaugnay na pandiwa ang ginagamit sa Griyego para sa pampublikong pagdadala kay Alejandro sa unahan.
    reason: lexical_alternative
  - marker: b
    text: O “sa mga mamamayan.” May pampubliko at sibikong diwa ang salitang ito at naiiba sa “karamihan” sa unang bahagi ng talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεβίβασαν
  choice: iniharap nila
  rationale: Sa konteksto ng ἐκ τοῦ ὄχλου at ng tuwirang layon na si Alejandro, tumutukoy ito sa pagdadala o paghaharap sa kaniya mula sa karamihan, hindi sa pagtuturo o pagpapayo.
- source_word: προβαλόντων αὐτὸν τῶν Ἰουδαίων
  choice: matapos siyang itulak sa unahan ng mga Judio
  rationale: Ipinapakita ng genitive absolute kung paano siya naiharap. Ang 'itulak sa unahan' ay natural sa Filipino at hindi kinakailangang magpahiwatig ng marahas na pagtulak.
- source_word: κατασείσας τὴν χεῖρα
  choice: sumenyas ... sa pamamagitan ng kamay
  rationale: Pinananatili nito ang kilos ng kamay upang makuha ang pansin nang hindi tahasang idinaragdag na humihingi siya ng katahimikan.
- source_word: ἤθελεν ἀπολογεῖσθαι
  choice: nais niyang ipagtanggol ang sarili
  rationale: Pinananatili ng 'nais' ang di-natupad na hangarin, at likas na ipinapahayag sa Filipino ng 'ipagtanggol ang sarili' ang pampublikong depensa sa kontekstong ito.
- source_word: τῷ δήμῳ
  choice: sa kapulungan
  rationale: Ang δῆμος ay may pampubliko at sibikong diwa rito; naiiba ang 'kapulungan' sa pangkalahatang 'karamihan' na katumbas ng ὄχλος.
- source_word: ὄχλου
  choice: karamihan
  rationale: Likas na modernong katumbas ito ng pangkalahatang masa ng mga tao at naipag-iiba sa kapulungan sa hulihan ng talata.
- source_word: Ἀλέξανδρον / Ἀλέξανδρος
  choice: Alejandro
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Alexander.
