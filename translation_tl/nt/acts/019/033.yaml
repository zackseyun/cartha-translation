  - severity: medium
    issue: Ang “ipagtanggol ang sarili” ay nagdaragdag ng tahasang layon sa ἀπολογεῖσθαι.
    rationale: Bagaman maaaring ganito ang praktikal na kahulugan sa tagpo, ang Griyego ay nagsasabing nais niyang magbigay ng pagtatanggol sa kapulungan; mas mabuting huwag tukuyin ang layon ng depensa.
