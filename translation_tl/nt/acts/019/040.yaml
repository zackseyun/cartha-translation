  source_fidelity: 'Ang pangunahing diwa at ayos ng pangungusap ay tapat sa Griyego: kasalukuyang panganib ng legal na paratang, kawalan ng sapat na batayan, kawalan ng maibibigay na paliwanag, at ang pagpapauwi sa kapulungan. Gayunman, ang “pag-aaklas” bilang pangunahing salin ng στάσις ay mas tiyak at mas mabigat kaysa hinihingi ng agarang konteksto, na isang magulong pampublikong pangyayari. Mas maingat ang “kaguluhan,” habang pinananatili sa talababa ang mas mabibigat na posibilidad.'
