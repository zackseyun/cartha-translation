revisions:
- from: Sapagkat nanganganib tayong maparatangan ng pag-aaklas[a] dahil sa nangyari ngayon, yamang wala namang dahilan para rito, at hindi natin maipapaliwanag ang magulong pagtitipong ito.[b] At pagkasabi niya ng mga ito, pinauwi niya ang kapulungan.[c]
  to: Sapagkat nanganganib tayong maparatangan ng pagkakasangkot sa kaguluhan[a] dahil sa nangyari ngayon, yamang wala namang dahilan para rito, at hindi natin maipapaliwanag ang magulong pagtitipong ito.[b] Matapos niyang sabihin ang mga ito, pinauwi niya ang kapulungan.[c]
  rationale: Pinalitan ang pangunahing “pag-aaklas” ng “kaguluhan” upang huwag magpahiwatig ng mas tiyak na insureksiyon kaysa ipinahihiwatig ng konteksto, ngunit iningatan ang legal na diwa sa pamamagitan ng “maparatangan ng pagkakasangkot.” Inayos din ang pangwakas na pangungusap para sa mas natural na daloy. Napanatili ang lahat ng footnote anchor at ang pagkakaiba ng magulong pagtitipon at pormal na kapulungan.
