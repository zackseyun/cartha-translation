source:
  edition: SBLGNT
  text: καὶ γὰρ κινδυνεύομεν ἐγκαλεῖσθαι στάσεως περὶ τῆς σήμερον μηδενὸς αἰτίου ὑπάρχοντος περὶ οὗ οὐ δυνησόμεθα ⸀ἀποδοῦναι λόγον ⸀περὶ τῆς συστροφῆς ταύτης. καὶ ταῦτα εἰπὼν ἀπέλυσεν τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/040.yaml
  text: For indeed we are in danger of being charged with rioting over what happened today[a], since there is no cause for it, and we will not be able to give an account for this commotion. And after saying these things[c][b], he dismissed the assembly.
translation:
  language: tl
  text: Sapagkat nanganganib tayong maparatangan ng pagkakasangkot sa kaguluhan[a] dahil sa nangyari ngayon, yamang wala namang dahilan para rito, at hindi natin maipapaliwanag ang magulong pagtitipong ito.[b] Matapos niyang sabihin ang mga ito, pinauwi niya ang kapulungan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pag-aaklas,” “pag-aalsa,” o “sedisyon.” Ang salitang Griyego ay maaaring tumukoy sa isang seryosong kaguluhang sibil; sa kontekstong ito, tumutukoy ito sa magulong pampublikong pangyayari.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kaguluhang ito” o “nagkagulong pangkat na ito.” Tumutukoy ang salitang Griyego sa magulong pagkakatipon at naiiba sa mas pormal na “kapulungan” sa sumunod na pangungusap.
    reason: lexical_alternative
  - marker: c
    text: Ang salitang isinaling “kapulungan” ay siya ring salitang Griyego na madalas isaling “iglesya” sa ibang talata, ngunit dito ay tumutukoy ito sa pampublikong kapulungan sa Efeso.
    reason: cross_reference
lexical_decisions:
- source_word: κινδυνεύομεν
  choice: nanganganib tayo
  rationale: Ipinahahayag ng pangkasalukuyang pandiwa ang kasalukuyan at tunay na panganib; natural din ito sa modernong Tagalog.
- source_word: ἐγκαλεῖσθαι
  choice: maparatangan
  rationale: Pinananatili nito ang legal o panghukuman na diwa ng pandiwa sa babala ng kalihim ng lungsod.
- source_word: στάσεως
  choice: ng pag-aaklas
  rationale: Maaaring tumukoy ang salita sa kaguluhang sibil, sedisyon, o pag-aalsa. Ipinakikita ng “pag-aaklas” ang bigat ng posibleng paratang sa ilalim ng pamahalaang Romano nang hindi tahasang ipinapalagay na ganap na insureksiyon ang naganap.
- source_word: περὶ τῆς σήμερον
  choice: dahil sa nangyari ngayon
  rationale: Natural na ipinahahayag sa Tagalog ang di-tuwirang Griyegong parirala at malinaw na iniuugnay ito sa pangyayari nang araw na iyon.
- source_word: μηδενὸς αἰτίου ὑπάρχοντος
  choice: yamang wala namang dahilan para rito
  rationale: Ipinahahayag nito ang genitive absolute at ang kawalan ng makatuwiran o legal na batayan para sa kaguluhan.
- source_word: ἀποδοῦναι λόγον
  choice: maipapaliwanag
  rationale: Natural na katumbas ito ng idyomang “magbigay ng paliwanag/pagsusulit” sa kontekstong kailangang managot sa mga awtoridad.
- source_word: συστροφῆς
  choice: magulong pagtitipon
  rationale: Sinasaklaw nito ang diwa ng nagkumpulan at magulong pangkat, at malinaw itong ipinagkaiba sa mas pormal na ἐκκλησία sa hulihan ng talata.
- source_word: ἐκκλησίαν
  choice: kapulungan
  rationale: Dito ay tumutukoy ito sa pampublikong kapulungan sa Efeso, hindi sa iglesya; ang “kapulungan” ay angkop sa sibikong konteksto.
- source_word: ἀπέλυσεν
  choice: pinauwi
  rationale: Natural sa Tagalog para sa pagpapawalang-saysay o pagpapaalis sa mga taong nagtipon, habang pinananatili ang kilos ng opisyal na nagwakas sa kapulungan.
