  terminology: Napananatili ang mahalagang pagkakaiba ng συστροφή bilang “magulong pagtitipon” at ἐκκλησία bilang “kapulungan.” Ang “kapulungan” ay angkop sa sibikong, hindi eklesyal, na kahulugan. Ang talababa sa “kapulungan” ay wasto at kapaki-pakinabang.
