base_translation:
  language: en
  yaml_path: translation/nt/acts/019/032.yaml
  text: So then some were shouting one thing and some another[a], for the assembly was in confusion, and most of them did not know why they had come together.
translation:
  language: tl
  text: Kaya may sumisigaw ng isang bagay, at may iba namang sumisigaw ng iba, sapagkat magulo ang kapulungan[a], at hindi alam ng karamihan kung bakit sila nagtipon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagtitipon” o “maraming tao.” Ang salitang Griyego na ἐκκλησία ay tumutukoy rito sa isang pampublikong kapulungang sibiko, hindi sa iglesya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον
  choice: Kaya iba-iba ang isinisigaw ng mga tao
  rationale: Likas na ipinahahayag sa modernong Tagalog ang distributibong diwa na may sumisigaw ng isang bagay at may iba namang ibang bagay. Ang aspektong nagaganap ng ἔκραζον ay pinananatili ng “isinisigaw.”
- source_word: ἐκκλησία
  choice: kapulungan
  rationale: Sa kontekstong ito, tumutukoy ito sa pampublikong pagtitipon at hindi sa iglesya. Ang “kapulungan” ay tumpak at marangal na katumbas, habang pinananatili ang ugnayang leksikal sa isang pormal na pagtitipon.
- source_word: συγκεχυμένη
  choice: magulo
  rationale: Inilalarawan ng perpektong partisipa ang kalagayang bunga ng pagkakagulo. Natural sa Tagalog ang “magulo ang kapulungan.”
- source_word: οἱ πλείους
  choice: karamihan
  rationale: Tuwirang ipinahahayag nito ang substantibong kahulugang “ang nakararami” sa mga nagtipon.
- source_word: τίνος ἕνεκα
  choice: kung bakit
  rationale: Ito ang natural at maikling katumbas sa Tagalog ng tanong tungkol sa dahilan.
- source_word: συνεληλύθεισαν
  choice: sila nagtipon
  rationale: Ipinahahayag nito ang naunang pagdating at pagsasama-sama ng mga tao. Hindi kailangang tahasang markahan ang pluperfect sa Tagalog dahil malinaw na ang temporal na ugnayan sa konteksto.
