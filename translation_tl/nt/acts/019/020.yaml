  text: So the word of the Lord was growing mightily and prevailing[a].
translation:
  language: tl
  text: Kaya patuloy na lumalaganap at nananaig nang may kapangyarihan ang salita ng Panginoon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Kaya patuloy na lumalaganap at makapangyarihang nananaig ang salita ng Panginoon.” Ang pariralang κατὰ κράτος ay maaaring ipahayag bilang “nang may kapangyarihan,” “nang makapangyarihan,” o “nang buong lakas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Kaya
  rationale: Ipinakikita ang bunga ng mga naunang pangyayari. Natural sa modernong Tagalog ang “Kaya” at napapanatili nito ang resultative na diwa.
- source_word: κατὰ κράτος
  choice: nang buong lakas
  rationale: Ang idyoma ay nagpapahiwatig ng lakas o makapangyarihang bisa. Pinananatili ng “nang buong lakas” ang noun-based na diwa ng κράτος at natural itong naglalarawan sa paglaganap ng salita.
- source_word: τοῦ κυρίου
  choice: ng Panginoon
  rationale: Tuwirang isinasalin ang titulong κύριος bilang “Panginoon” nang hindi ginagawang tahasan sa teksto ang ipinahihiwatig na reperente.
- source_word: ὁ λόγος
  choice: ang salita
  rationale: Tumutukoy ito sa ipinahahayag na mensahe o ebanghelyo, ngunit pinananatili ng “ang salita” ang paulit-ulit na pananalita sa Mga Gawa at ang anyo ng Griyego.
- source_word: ηὔξανεν
  choice: patuloy na lumalaganap
  rationale: Ipinahihiwatig ng imperfect ang nagpapatuloy na pag-unlad. Sa konteksto ng ipinahahayag na salita, mas natural at malinaw ang “lumalaganap” kaysa literal na “lumalaki.”
- source_word: ἴσχυεν
  choice: nananaig
  rationale: Ipinahahayag ng ἰσχύω ang pagiging malakas at mabisa. Sa kontekstong ito, ang “nananaig” ay naghahatid ng diwa ng patuloy at mabisang pagsulong nang hindi inaalis ang hiwalay na ideya ng paglaganap.
theological_decisions:
- issue: Ang reperente ng “Panginoon” sa τοῦ κυρίου
  choice: Panginoon
  alternative: Panginoong Jesus
  rationale: Malakas na ipinahihiwatig ng konteksto na si Jesus ang tinutukoy, ngunit “Panginoon” lamang ang tahasang nasa Griyego. Pinananatili ng salin ang anyo at hindi tahimik na nilulutas ang reperente.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lumalaganap” para sa natural na paglalarawan sa pagsulong ng ipinahahayag na salita, at pinanatiling magkahiwalay ang mga ideya ng paglago at pananagumpay.
