id: ACT.19.39
reference: Acts 19:39
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀περαιτέρω ἐπιζητεῖτε, ἐν τῇ ἐννόμῳ ἐκκλησίᾳ ἐπιλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/039.yaml
  text: But if you seek anything further[a], it will be settled in the lawful assembly.
translation:
  language: tl
  text: Ngunit kung may iba pa kayong hinihiling[a], lulutasin iyon sa kapulungang naaayon sa batas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung may iba pa kayong usaping nais iharap.” Ang Griyego ay tumutukoy sa isang kapulungang sibiko na binuo ayon sa batas, hindi sa iglesya.
    reason: lexical_alternative
lexical_decisions:
- source_word: περαιτέρω
  choice: iba pa
  rationale: Ipinahahayag ng pang-abay ang isang bagay na karagdagan o lampas sa kasalukuyang usapin; natural sa modernong Tagalog ang “iba pa.”
- source_word: ἐπιζητεῖτε
  choice: hinihiling
  rationale: Maaaring mangahulugang maghanap, humiling, o maghangad ang pandiwa. Sa kontekstong sibiko, ipinahihiwatig nito ang pagsusulong ng karagdagang usapin nang hindi ito ginagawang labis na teknikal.
- source_word: ἐννόμῳ
  choice: naaayon sa batas
  rationale: Malinaw nitong ipinapahayag na ang kapulungan ay binuo at nagpupulong alinsunod sa legal na kaayusan.
- source_word: ἐκκλησίᾳ
  choice: kapulungan
  rationale: Tumutukoy rito sa nagkakatipong katawang sibiko, hindi sa iglesyang Kristiyano. Pinananatili ng “kapulungan” ang diwang pampublikong pagtitipon.
- source_word: ἐπιλυθήσεται
  choice: lulutasin iyon
  rationale: Tinutumbasan nito ang hinaharap na balintiyak at ang diwa ng pormal na paglutas sa usapin.
- source_word: τι
  choice: may
  rationale: Kasama ng “iba pa” sa sugnay na pasubali, natural nitong ipinapahayag ang di-tiyak na anumang karagdagang bagay o usapin.
theological_decisions:
- issue: Pagbibigay-kahulugan sa ἐκκλησία sa di-Kristiyanong kontekstong sibiko
  choice: kapulungan
  alternative: iglesya; pagpupulong
  rationale: Ang tinutukoy ay isang legal na kapulungang sibiko sa Efeso, hindi ang pamayanang Kristiyano. Iniiwasan ng “kapulungan” ang maling pahiwatig na eklesyal habang pinananatili ang pangunahing diwa ng nagkakatipong katawan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapulungan” para sa kontekstong sibiko at ang pariralang “naaayon sa batas” upang maging madaling maunawaan ang legal na katangian nito.
