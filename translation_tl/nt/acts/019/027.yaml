id: ACT.19.27
reference: Acts 19:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς ⸂Ἀρτέμιδος ἱερὸν⸃ εἰς οὐθὲν λογισθῆναι, μέλλειν ⸀τε καὶ καθαιρεῖσθαι ⸂τῆς μεγαλειότητος⸃ αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/027.yaml
  text: And not only is this trade of ours in danger of coming into disrepute, but also the temple of the great goddess Artemis may be counted as nothing, and even her majesty—whom all Asia and the world worships—may be brought down.
translation:
  language: tl
  text: At hindi lamang nanganganib na masira ang reputasyon ng hanapbuhay nating ito, kundi baka ituring ding walang halaga ang templo ng dakilang diyosang si Artemis, at baka maibagsak pa ang kanyang kadakilaan[b]—siya na sinasamba ng buong Asya at ng sanlibutan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ng daigdig na tinitirhan.” Madalas tumukoy ang salitang Griyego sa mundong may naninirahan, lalo na sa mas malawak na mundong Romano.
    reason: lexical_alternative
  - marker: b
    text: O “karangyaan” o “kadakilaan.” Mahirap ang pagkakabuo ng Griyego; maaaring tumukoy ito sa pagbaba ng mataas na katayuan o kaningningan ni Artemis.
    reason: lexical_alternative
lexical_decisions:
- source_word: κινδυνεύει
  choice: nanganganib
  rationale: Likas na Filipino para sa kasalukuyang panganib o posibilidad ng masamang mangyari.
- source_word: τὸ μέρος
  choice: hanapbuhay nating ito
  rationale: Sa konteksto, tumutukoy ito sa gawaing pinagkakakitaan ng mga panday, hindi sa abstraktong “bahagi.”
- source_word: εἰς ἀπελεγμὸν ἐλθεῖν
  choice: na masira ang pangalan
  rationale: Ipinahahayag ang pagkakaroon ng masamang reputasyon o paghamak sa kanilang hanapbuhay sa natural na modernong Filipino.
- source_word: ἱερὸν
  choice: templo
  rationale: Malinaw na tumutukoy sa banal na lugar o kompleks ng templo ni Artemis sa Efeso.
- source_word: εἰς οὐθὲν λογισθῆναι
  choice: ituring ding walang kabuluhan
  rationale: Pinananatili ang ideya ng paghatol na isang bagay ay walang halaga o saysay.
- source_word: μέλλειν τε καὶ καθαιρεῖσθαι
  choice: baka maibagsak pa
  rationale: Ipinakikita ang kinatatakutang nalalapit na pagbaba o pagkawala ng mataas na katayuan; ang “baka” ay umaayon sa saklaw ng κινδυνεύει.
- source_word: τῆς μεγαλειότητος αὐτῆς
  choice: mula sa kanyang kadakilaan
  rationale: 'Pinananatili ang mahirap na ugnayang gramatikal: si Artemis ang ibababa o aalisin mula sa kanyang mataas na kalagayan, nang hindi labis na nilulutas ang ekspresyon.'
- source_word: ὅλη ἡ Ἀσία
  choice: buong Asia
  rationale: Tumutukoy sa Romanong lalawigan ng Asia; pinanatili ang pangalang heograpiko upang hindi mapagkamalang buong kontinenteng makabagong Asia.
- source_word: ἡ οἰκουμένη
  choice: sanlibutan
  rationale: Natural at marangal na katumbas ng daigdig na tinitirhan o kilalang mundo; nililinaw sa talababa ang saklaw.
- source_word: σέβεται
  choice: sinasamba
  rationale: Ang konteksto ay tahasang panrelihiyon at kultiko, kaya mas angkop kaysa sa mas mahinang “iginagalang.”
theological_decisions:
- issue: Paglalahad ng paganong katawagang panrelihiyon nang hindi ito pinahihina o sinasang-ayunan
  choice: dakilang diyosang si Artemis ... sinasamba
  alternative: tinatawag na dakilang diyosang si Artemis ... iginagalang
  rationale: Iniulat ng talata ang pananalita ni Demetrio. Walang panandang paglayo gaya ng “tinatawag na” sa Griyego, kaya tuwirang pinananatili ang kanyang pahayag bilang iniulat na pananalita.
- issue: Mahirap na genitive sa καθαιρεῖσθαι τῆς μεγαλειότητος αὐτῆς
  choice: maibagsak ... mula sa kanyang kadakilaan
  alternative: maalis ang kanyang kadakilaan
  rationale: Ang pinili ay mas malapit sa anyo ng Griyego, kung saan ang paksa ng passive infinitive ay maaaring unawain bilang si Artemis na ibinababa mula sa kanyang kadakilaan; hindi tahimik na ginagawang tuwirang layon ang “kadakilaan.”
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “hanapbuhay” para sa ekonomikong konteksto, “templo” bilang karaniwang katawagan, at “sanlibutan” para sa marangal ngunit pamilyar na rehistro. Inilagay ang lahat ng marker na [a] at [b] sa pangunahing teksto.
