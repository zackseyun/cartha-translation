base_translation:
  language: en
  yaml_path: translation/nt/acts/019/019.yaml
  text: And many of those who had practiced magic arts brought their books together and were burning them in front of everyone[b][a]; and they totaled up their value and found it to be fifty thousand pieces of silver.
translation:
  language: tl
  text: At marami sa mga dating nagsasagawa ng mahika[a] ang nagtipon ng kanilang mga aklat at sinusunog ang mga ito sa harap ng lahat; at kinuwenta nila ang halaga ng mga iyon at natuklasang umabot ito sa limampung libong pirasong pilak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga gawaing okulto.” Literal na tumutukoy ang Griyegong pananalita sa mga bagay o gawaing may kaugnayan sa kakaiba o mahiwaga, ngunit sa kontekstong ito ay tumutukoy ito sa mga gawaing mahika.
    reason: lexical_alternative
  - marker: b
    text: Literal na “limang miryad ng pilak,” samakatuwid ay limampung libo. Hindi tinutukoy ang eksaktong uri ng baryang pilak.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκανοὶ
  choice: marami
  rationale: Tumutukoy ito sa malaking bilang ng mga tao, at ang “marami” ay natural at malinaw sa makabagong Tagalog.
- source_word: τὰ περίεργα πραξάντων
  choice: mga dating nagsasagawa ng mahika
  rationale: Sa konteksto ng Efeso, tumutukoy ang parirala sa mga gawaing mahika o okulto, hindi lamang sa mga bagay na kakaiba o kinahihiligan.
- source_word: συνενέγκαντες
  choice: nagtipon
  rationale: Ipinahihiwatig ng pandiwari na pinagsama-sama nila sa isang lugar ang mga aklat bago sunugin.
- source_word: τὰς βίβλους
  choice: kanilang mga aklat
  rationale: Ang βίβλους ay malawak na tumutukoy sa mga nakasulat na aklat o balumbon; natural sa Tagalog ang “mga aklat,” at malinaw sa konteksto na pag-aari nila ang mga ito.
- source_word: κατέκαιον
  choice: sinunog
  rationale: Bagaman imperfect ang anyo at maaaring ilarawan ang nagaganap na pagsusunog, ang payak na “sinunog” ang mas natural na salaysay sa Tagalog nang hindi binabago ang pangyayari.
- source_word: ἐνώπιον πάντων
  choice: sa harap ng lahat
  rationale: Pinananatili nito ang diin sa hayagan at pampublikong pagsusunog.
- source_word: συνεψήφισαν
  choice: Nang tuusin nila
  rationale: Ang pandiwa ay nangangahulugang kalkulahin o pagsama-samahin ang halaga; idiomatiko at malinaw ang “tuusin.”
- source_word: τὰς τιμὰς αὐτῶν
  choice: ang halaga ng mga iyon
  rationale: Ang τιμή rito ay tumutukoy sa halagang salapi, hindi sa karangalan.
- source_word: ἀργυρίου μυριάδας πέντε
  choice: limampung libong pirasong pilak
  rationale: Ang literal na bilang ay limang laksa, samakatuwid ay limampung libo; hindi tinutukoy ng Griyego ang eksaktong uri ng barya, kaya hindi ito pinangalanan.
theological_decisions:
- issue: Kahulugan ng τὰ περίεργα sa konteksto ng Efeso
  choice: mga nagsasagawa ng mahika
  alternative: mga nagsasagawa ng mga gawaing okulto; mga gumagawa ng mga kakaibang bagay
  rationale: Ang agarang konteksto ay tungkol sa mga eksorsista, masasamang espiritu, at mga aklat na may kaugnayan sa mahika. Malinaw ang “mahika” nang hindi nagdaragdag ng partikular na doktrinang wala sa teksto.
- issue: Aspekto ng κατέκαιον
  choice: sinunog
  alternative: sinusunog; nagsimulang magsunog
  rationale: Ang imperfect ay maaaring maglarawan ng nagpapatuloy na kilos, ngunit sa natural na Tagalog na salaysay, sapat ang aspektong perpektibo upang ilahad ang pampublikong pagsusunog. Hindi ipinapalagay kung gaano katagal ang kilos.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “aklat” sa halip na teknikal na “balumbon,” at “tuusin” para sa malinaw na pagkalkula ng kabuuang halaga. Inilagay ang mga talababa sa mismong bahaging nililinaw ng bawat isa.
