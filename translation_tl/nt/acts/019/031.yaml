  text: τινὲς δὲ καὶ τῶν Ἀσιαρχῶν, ὄντες αὐτῷ φίλοι, πέμψαντες πρὸς αὐτὸν παρεκάλουν μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/031.yaml
  text: And even some of the Asiarchs[a], being his friends[c][b], sent word to him and urged him not to venture into the theater.
translation:
  language: tl
  text: Maging ang ilan sa mga Asiarka[a], na mga kaibigan niya, ay nagpadala sa kanya ng mensahe[b] at mahigpit siyang pinakiusapang huwag pumasok sa teatro.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mga “Asiarka” ay mga prominenteng opisyal na may kaugnayan sa Romanong lalawigan ng Asia.
    reason: cultural_note
  - marker: b
    text: O “nagpasabi sa kanya.”
    reason: lexical_alternative
  - marker: c
    text: O “huwag niyang ipasok ang sarili niya sa teatro” o “huwag siyang pumunta sa teatro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ καὶ τῶν Ἀσιαρχῶν
  choice: Maging ang ilan sa mga Asiarka
  rationale: Ipinahihiwatig ng τινὲς ang di-tiyak na bahagi ng isang pangkat, at binibigyang-diin ng καὶ na maging ang ilang prominenteng opisyal ay kumampi kay Pablo. Pinanatili ang teknikal na titulong Ἀσιαρχῶν sa anyong Filipino at ipinaliwanag ito sa talababa.
- source_word: ὄντες αὐτῷ φίλοι
  choice: na mga kaibigan niya
  rationale: Natural itong paglalarawan sa kanilang kaugnayan kay Pablo at pinananatili ang tahasang diwa ng φίλοι nang hindi ito pinahihinang maging basta palakaibigan lamang.
- source_word: πέμψαντες πρὸς αὐτὸν
  choice: nagpadala sa kanya ng mensahe
  rationale: Walang tahasang layon ang πέμψαντες sa Griyego, ngunit ipinahihiwatig ng konteksto na mensahe ang ipinadala. Likas at malinaw ito sa modernong Tagalog.
- source_word: παρεκάλουν
  choice: mahigpit siyang pinakiusapan
  rationale: Ipinapahayag ng παρακαλέω rito ang marubdob na pakiusap. Ang 'mahigpit' ay naghahatid ng bigat nito, samantalang ang anyong nagdaan ay maayos sa salaysay.
- source_word: μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον
  choice: huwag pumasok sa teatro
  rationale: Ang literal na larawan ay ang hindi pagbibigay o paghaharap ng sarili papasok sa teatro. Sa konteksto, ang natural na diwa ay huwag pumasok o magtungo roon; inilalagay sa talababa ang mas literal na alternatibo upang mapanatili ang saklaw ng pahayag.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang teknikal na titulong “Asiarka” sa halip na palitan ito ng pangkalahatang “pinuno,” at ipinaliwanag sa talababa. Ginamit ang “teatro” bilang pampublikong tanghalan at lugar ng pagtitipon sa sinaunang lungsod, hindi bilang palabas mismo.
