  text: Ἀκούσαντες δὲ καὶ γενόμενοι πλήρεις θυμοῦ ἔκραζον λέγοντες· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/028.yaml
  text: When they heard this and became full of wrath[a], they were crying out, saying, “Great is Artemis of the Ephesians!”
translation:
  language: tl
  text: Nang marinig nila ito, napuno sila ng poot[a] at patuloy na sumigaw, “Dakila si Artemis ng mga taga-Efeso!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “napuno sila ng matinding galit,” “nag-alab ang kanilang galit,” o “napuno sila ng matinding poot.” Literal na “naging punô ng θυμός,” na tumutukoy sa matinding galit o poot.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: Nang marinig nila ito
  rationale: Ang aorist participle ay nagpapakilala sa pangyayaring nauna sa pangunahing kilos. Likas sa Tagalog ang “Nang marinig nila ito,” at ang “ito” ay malinaw na ipinahihiwatig ng konteksto.
- source_word: δὲ
  choice: at
  rationale: Mahinang pang-ugnay ito rito, hindi mariing panalungat; pinananatili ng “at” ang maayos na daloy ng mga kilos.
- source_word: γενόμενοι πλήρεις θυμοῦ
  choice: mapuno sila ng poot
  rationale: Pinananatili nito ang larawan ng Griyego na sila ay “naging punô” ng matinding galit, habang nananatiling natural at marangal sa modernong Tagalog.
- source_word: θυμοῦ
  choice: poot
  rationale: Ang θυμός ay tumutukoy sa matindi at nag-aalab na galit. Ang “poot” ay maikli, malinaw, at sapat ang tindi para sa reaksiyon ng nagkakagulong karamihan.
- source_word: ἔκραζον
  choice: patuloy silang sumigaw
  rationale: Ang imperfect tense ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagsigaw; malinaw itong naihahayag ng “patuloy.”
- source_word: λέγοντες
  choice: —
  rationale: Hindi na kailangang isalin nang hiwalay bilang “na sinasabi” sapagkat likas na ipinakikilala ng tutuldok at tuwirang sipi ang nilalaman ng kanilang sigaw.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: Dakila si Artemis ng mga taga-Efeso!
  rationale: Pinananatili ng ayos na ito ang mariin at mala-sigaw na pagpuri, gayundin ang ugnayang genitive kay Artemis bilang diyosa ng mga taga-Efeso.
- source_word: Ἄρτεμις
  choice: Artemis
  rationale: Tinutumbasan sa transliterasyon ang pantanging pangalan ng diyosa sa halip na isalin.
- source_word: Ἐφεσίων
  choice: ng mga taga-Efeso
  rationale: Ang anyong genitive plural ay tumutukoy sa mga mamamayan ng Efeso; mas eksakto ang “ng mga taga-Efeso” kaysa “ng Efeso.”
theological_decisions:
- issue: Paglalahad ng paganong pagbubunyi nang hindi ito ipinahahayag bilang pagsang-ayon ng tagapagsalin
  choice: Dakila si Artemis ng mga taga-Efeso!
  alternative: Si Artemis ng mga taga-Efeso ay dakila!
  rationale: Inilalahad ito bilang tuwirang sigaw ng karamihan at pinananatili ang mariing anyo ng orihinal, nang hindi pinapalambot ang idolatrosong nilalaman o nagdaragdag ng komentaryong teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “patuloy” upang ipakita ang aspektong duratibo ng ἔκραζον, at pinanatili ang maikli at maindayog na anyo ng sigaw ng karamihan.
