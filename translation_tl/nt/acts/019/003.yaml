  verdict: revise
  source_fidelity: Ang draft ay wastong naghahatid ng pangunahing tanong at tugon, kabilang ang paulit-ulit na «sa» para sa εἰς at ang passive na «kayo binautismuhan.» Gayunman, ang «Kaya» sa pambungad ay hindi angkop na katumbas ng εἶπέν τε, sapagkat ang οὖν (‘kung gayon’) ay nasa loob ng tanong at hindi dapat ilipat upang gawing sanhi-bunga ang pagsasalaysay.
  naturalness: Natural at malinaw ang «Kung gayon, sa ano kayo binautismuhan?» sa isang matapat at bahagyang pormal na salin. Mas natural na pang-ugnay sa salaysay ang «At sinabi niya» kaysa «Kaya sinabi niya.»
  terminology: Ang «bautismo» at «binautismuhan» ay angkop na modernong Filipino Tagalog at pinananatili ang terminong ritwal nang walang dagdag na doktrinal na pagpapakahulugan. Ang «bautismo ni Juan» ay tumpak para sa γενitive na Ἰωάννου.
