    rationale: Ang τε ay banayad na dugtong sa salaysay, samantalang ang οὖν ang nagpapahiwatig ng «kung gayon» sa mismong tanong. Ang «Kaya sinabi niya» ay maaaring magpahiwatig na ang pagsasalita mismo ang resulta ng naunang pangyayari at nagdodoble ng inferensiya sa «Kung gayon.»
  revised_text: At sinabi niya, “Kung gayon, sa ano kayo binautismuhan?” Sumagot sila, “Sa bautismo ni Juan.”
