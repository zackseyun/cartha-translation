  yaml_path: translation/nt/acts/019/003.yaml
  text: And he said[a], “Into what then were you baptized?” And they said, “Into John's baptism.”
translation:
  language: tl
  text: At sinabi niya, “Kung gayon, sa ano kayo binautismuhan?” Sumagot sila, “Sa bautismo ni Juan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπέν τε
  choice: Kaya sinabi niya
  rationale: Ang λέγω ay tuwirang ‘sabihin.’ Banayad na nag-uugnay ang τε sa naunang usapan; kasama ng οὖν sa tanong, natural sa Tagalog ang ‘Kaya sinabi niya’ bilang pagpapatuloy at bunga ng naunang sagot.
- source_word: Εἰς τί οὖν
  choice: Kung gayon, sa ano
  rationale: Ipinahahayag ng ‘kung gayon’ ang inferensiyang dala ng οὖν. Pinananatili ng ‘sa ano’ ang εἰς at ang pagkakatulad ng tanong at sagot, bagaman bahagyang di-karaniwan ito sa modernong Tagalog.
- source_word: ἐβαπτίσθητε
  choice: kayo binautismuhan
  rationale: 'Tumpak na pinananatili ng anyong pokus-sa-layon ang aorist passive: sila ang tumanggap ng kilos ng pagbautismo.'
- source_word: Εἰς τὸ Ἰωάννου βάπτισμα
  choice: Sa bautismo ni Juan
  rationale: 'Inuulit ang ‘sa’ para sa εἰς at pinananatili ang retorikal na paralelismo: ‘sa ano?’ / ‘sa bautismo ni Juan.’ Natural na ipinahahayag ng ‘ni Juan’ ang genitibong Ἰωάννου.'
- source_word: βάπτισμα
  choice: bautismo
  rationale: Ang ‘bautismo’ ang kinikilalang makabagong katawagan sa ritwal na tinutukoy at hindi nito pinapalitan ang salita ng isang interpretatibong paglalarawan.
theological_decisions:
- issue: Kung pananatilihin ang inuulit na εἰς sa tanong at sagot
  choice: Isalin kapwa bilang ‘sa’
  alternative: ‘Anong bautismo ang tinanggap ninyo?’ / ‘Ang bautismo ni Juan.’
  rationale: Pinananatili ng ‘sa’ ang pagkakahanay ng Griyego at ang diwa ng pagkakaugnay o pagkakakilanlan sa bautismo nang hindi ipinapasok ang isang partikular na teolohiya tungkol sa bautismo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘binautismuhan’ at ‘bautismo,’ na karaniwan at madaling maunawaan. Ang ‘sa ano’ ay sinadyang panatilihin upang masalamin ang paulit-ulit na εἰς at ang tensiyon ng orihinal na pahayag.
