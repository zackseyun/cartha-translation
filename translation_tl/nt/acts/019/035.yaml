  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καταστείλας δὲ ⸂ὁ γραμματεὺς τὸν ὄχλον⸃ φησίν· Ἄνδρες Ἐφέσιοι, τίς γάρ ἐστιν ⸀ἀνθρώπων ὃς οὐ γινώσκει τὴν Ἐφεσίων πόλιν νεωκόρον οὖσαν τῆς ⸀μεγάλης Ἀρτέμιδος καὶ τοῦ διοπετοῦς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/035.yaml
  text: But after the city clerk had quieted the crowd, he said, “Men of Ephesus, for what man is there who does not know that the city of the Ephesians is temple-keeper of the great Artemis and of the image fallen from heaven?”
translation:
  language: tl
  text: Ngunit nang mapatahimik na ng kalihim ng lungsod ang mga tao, sinabi niya, “Mga lalaking taga-Efeso, sino ba ang hindi nakaaalam na ang lungsod ng mga taga-Efeso ang tagapag-ingat ng templo ng dakilang Artemis[a] at ng imaheng nahulog mula sa langit[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagapangalaga ng templo ng dakilang Artemis.” Ang salitang Griyego ay tumutukoy sa isang lungsod na kinikilalang tagapangalaga ng isang templo o kulto.
    reason: lexical_alternative
  - marker: b
    text: O “ng bagay na nahulog mula sa langit.” Tumutukoy ang salitang Griyego sa isang bagay na pinaniniwalaang nahulog mula sa kalangitan; dito, malamang na imaheng pangkulto na nauugnay kay Artemis.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστείλας
  choice: nang mapatahimik na
  rationale: Ipinahihiwatig ng aorist participle na nauna ang pagpapatahimik sa pagsasalita; natural itong ipinapahayag sa Tagalog sa pamamagitan ng “nang ... na.”
- source_word: ὁ γραμματεὺς
  choice: kalihim ng lungsod
  rationale: Sa kontekstong sibiko, tumutukoy ito sa isang opisyal ng lungsod, hindi sa isang eskribang Judio.
- source_word: τὸν ὄχλον
  choice: ang mga tao
  rationale: Natural na tawag sa nagkakatipong madla sa modernong Tagalog; iniiwasan ang mas mabigat na “karamihan.”
- source_word: Ἄνδρες Ἐφέσιοι
  choice: Mga lalaking taga-Efeso
  rationale: Pinananatili ang tahasang panlalaking anyo ng pormal na pakikipag-usap.
- source_word: τίς γάρ ἐστιν ἀνθρώπων ὃς οὐ γινώσκει
  choice: sino ba ang hindi nakaaalam
  rationale: Natural na retorikal na tanong sa Tagalog; sapat nang ipinahihiwatig ng “sino” ang sangkatauhan nang hindi inuulit ang salitang “tao.”
- source_word: τὴν Ἐφεσίων πόλιν
  choice: ang lungsod ng mga taga-Efeso
  rationale: Malinaw na pinananatili ang genitibong parirala ng Griyego.
- source_word: νεωκόρον
  choice: tagapag-ingat ng templo
  rationale: Ipinapahayag ang pagkilala sa lungsod bilang tagapangalaga ng templo o kulto; mas natural ito kaysa sa isang tambalang teknikal na katawagan.
- source_word: τῆς μεγάλης Ἀρτέμιδος
  choice: ng dakilang Artemis
  rationale: Pinananatili ang kinikilalang marangal na titulo sa debosyong taga-Efeso nang hindi ito sinasang-ayunan ng tagapagsalaysay.
- source_word: τοῦ διοπετοῦς
  choice: ng imaheng nahulog mula sa langit
  rationale: Ang salita ay tumutukoy sa isang bagay na pinaniniwalaang nahulog mula sa kalangitan; sa konteksto, malamang na imaheng pangkulto ang tinutukoy.
theological_decisions:
- issue: Paglalahad sa paganong pahayag tungkol kay Artemis at sa διοπετές
  choice: 'Isinalin nang tuwiran bilang iniulat na pahayag: “tagapag-ingat ng templo ng dakilang Artemis at ng imaheng nahulog mula sa langit.”'
  alternative: “tagapangalaga ng templo ng dakilang Artemis at ng bagay na nahulog mula sa langit”
  rationale: Iniingatan nito ang sinabi ng opisyal nang hindi ipinahihiwatig na pinatutunayan ng Kasulatan ang paganong paniniwala. Nililinaw ng “imahe” ang malamang na tinutukoy, habang ipinapakita ng talababa ang literal na lawak ng salita.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kalihim ng lungsod” para sa opisyal na tungkulin at pinanatili ang “Mga lalaking taga-Efeso” upang katawanin ang tahasang panlalaking bokatibo. Ang mga panandang [a] at [b] ay kapwa lumilitaw sa pangunahing teksto.
