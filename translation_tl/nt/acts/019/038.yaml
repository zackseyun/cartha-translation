translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang legal na himig ng pahayag, ang maramihang “mga prokonsul,” at ang katumbasang “isa't isa” nang hindi nilulutas ang mga maaaring kalabuan ng tekstong Griyego.
