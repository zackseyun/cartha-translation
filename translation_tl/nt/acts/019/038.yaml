  text: εἰ μὲν οὖν Δημήτριος καὶ οἱ σὺν αὐτῷ τεχνῖται ἔχουσιν πρός τινα λόγον, ἀγοραῖοι ἄγονται καὶ ἀνθύπατοί εἰσιν, ἐγκαλείτωσαν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/038.yaml
  text: If[a], then, Demetrius and the craftsmen with him have a complaint against anyone, court sessions are being held and there are proconsuls[b]; let them bring charges against one another.
translation:
  language: tl
  text: Kaya, kung may reklamo si Demetrio at ang mga bihasang manggagawang kasama niya laban kaninuman, idinaraos ang mga sesyon ng hukuman[a] at may mga prokonsul[b]; magsampa sila ng kaso laban sa isa't isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nakabukas ang mga hukuman para sa paglilitis.” Ang pariralang Griyego ay tumutukoy sa opisyal na idinaraos na mga pagdinig o paglilitis.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “naroroon” o “maaaring lapitan ang mga prokonsul.” Maaaring tumukoy ang maramihang anyo sa tanggapan ng prokonsul sa pangkalahatang diwang administratibo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: Kaya, kung
  rationale: Likas na ipinahahayag sa Filipino ang lohikal na pagpapatuloy ng οὖν at ang kondisyong εἰ; hindi na hiwalay na isinalin ang mahinang pantulong na μέν.
- source_word: Δημήτριος
  choice: Demetrio
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Griyego.
- source_word: οἱ σὺν αὐτῷ τεχνῖται
  choice: ang mga kasamang bihasang manggagawa niya
  rationale: Ang τεχνῖται ay mga manggagawang may kasanayan o artisan. Hindi ito pinakitid sa “mga panday-pilak,” yamang hindi iyon tahasang sinasabi sa talata.
- source_word: ἔχουσιν πρός τινα λόγον
  choice: may reklamo ... laban kaninuman
  rationale: Ipinahahayag ng idyoma ang isang usapin o reklamong legal laban sa isang tao; malinaw at natural sa modernong Filipino ang “may reklamo laban.”
- source_word: ἀγοραῖοι ἄγονται
  choice: idinaraos ang mga sesyon ng hukuman
  rationale: Tumutukoy ang parirala sa opisyal na idinaraos na mga paglilitis o takdang sesyon ng hukuman at pinananatili ang pasibong anyo.
- source_word: ἀνθύπατοί εἰσιν
  choice: may mga prokonsul
  rationale: Ang ἀνθύπατοι ay mga Romanong opisyal ng lalawigan. Pinanatili ang maramihang anyo ng Griyego sa halip na tahimik itong gawing isahan.
- source_word: ἐγκαλείτωσαν ἀλλήλοις
  choice: magsampa sila ng kaso laban sa isa't isa
  rationale: Malinaw na legal ang diwa ng pandiwa, at pinananatili ng “laban sa isa't isa” ang katumbasang ipinahahayag ng ἀλλήλοις.
