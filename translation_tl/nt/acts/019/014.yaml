id: ACT.19.14
reference: Acts 19:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦσαν δέ ⸀τινος Σκευᾶ Ἰουδαίου ἀρχιερέως ἑπτὰ ⸀υἱοὶ τοῦτο ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/014.yaml
  text: There were seven sons of a Jewish chief priest named Sceva doing this[a].
translation:
  language: tl
  text: May pitong anak na lalaki ang isang Judiong punong pari na nagngangalang Esceva, at ginagawa nila ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mataas na pari.” Maaaring tumukoy ang salitang Griyego sa mataas na pari o, sa mas malawak na diwa, sa isang punong pari o taong kabilang sa angkan ng mga mataas na pari.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δέ
  choice: May ... at
  rationale: Ipinapahayag ang pag-iral ng pitong anak at natural na inuugnay ang sugnay sa salaysay, nang hindi nagdaragdag ng tahasang panandang temporal.
- source_word: τινος Σκευᾶ
  choice: ang isang ... na nagngangalang Esceva
  rationale: Pinananatili ng “isang” ang di-tiyak na pagpapakilala kay Esceva, habang natural sa Tagalog ang “na nagngangalang.”
- source_word: Ἰουδαίου
  choice: Judio
  rationale: Tumutukoy rito sa etniko at panrelihiyong pagkakakilanlan, hindi lamang sa heograpikong pinagmulan.
- source_word: ἀρχιερέως
  choice: punong pari
  rationale: Maaaring tumukoy ang salita sa mataas na pari o, sa mas malawak na diwa, sa isang pangunahing pari; iniiwasan ng “punong pari” ang tiyak na pag-aangking si Esceva ang nag-iisang nanunungkulang mataas na pari.
- source_word: ἑπτὰ υἱοὶ
  choice: pitong anak na lalaki
  rationale: Tuwirang salin na malinaw na ipinapakita ang kasarian ng υἱοί.
- source_word: τοῦτο ποιοῦντες
  choice: ginagawa nila ito
  rationale: Tumutukoy ang isahang demonstratibo sa gawaing binanggit sa naunang konteksto; ipinahihiwatig ng anyo ng pandiwa ang nagpapatuloy o karaniwang gawain.
theological_decisions:
- issue: Kahulugan ng ἀρχιερεύς bilang titulo ni Esceva
  choice: punong pari
  alternative: mataas na pari
  rationale: Saklaw ng salitang Griyego ang “mataas na pari” at ang mas malawak na “punong pari.” Dahil hindi nakikilalang nanungkulang mataas na pari si Esceva, pinananatili ng pangunahing salin ang mas maingat na kahulugan at inilalagay sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “Judio” at “punong pari” bilang malinaw at karaniwang mga terminong biblikal; hindi nilutas nang labis ang leksikal na kalabuan ng ἀρχιερεύς.
