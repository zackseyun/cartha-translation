id: ACT.19.23
reference: Acts 19:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ κατὰ τὸν καιρὸν ἐκεῖνον τάραχος οὐκ ὀλίγος περὶ τῆς ὁδοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/023.yaml
  text: At that time there arose no small disturbance concerning the Way[a].
translation:
  language: tl
  text: Nang panahong iyon, nagkaroon ng hindi maliit na kaguluhan tungkol sa Daan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “daan.” Dito, tumutukoy ito sa kilusang Kristiyano, isang katawagang paulit-ulit na ginagamit sa Mga Gawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: nagkaroon
  rationale: Ipinakikilala ng γίνομαι ang paglitaw o pangyayari ng isang kalagayan. Likas sa makabagong Filipino ang “nagkaroon” kasama ng simuno nitong “kaguluhan,” at pinananatili nito ang diwang pangyayari.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay sa salaysay ang δέ. Sapat nang ipinahihiwatig ng paglipat sa bagong pangyayari ang ugnayan, kaya hindi kailangang magdagdag ng “ngayon” o magpahiwatig ng matinding pagsalungat.
- source_word: κατὰ τὸν καιρὸν ἐκεῖνον
  choice: Nang panahong iyon
  rationale: Natural at malinaw na panandang temporal sa Filipino, na tumutukoy sa panahong inilalarawan ng konteksto.
- source_word: τάραχος
  choice: kaguluhan
  rationale: Saklaw ng “kaguluhan” ang gulo o pagkabagabag nang hindi agad tinutukoy ang pangyayari bilang isang ganap na riot bago iyon ilahad ng salaysay.
- source_word: οὐκ ὀλίγος
  choice: hindi maliit
  rationale: Pinananatili ang litotes ni Lucas sa halip na pakinisin bilang “malaki” o “matindi,” habang nananatiling nauunawaan sa Filipino.
- source_word: περὶ
  choice: tungkol sa
  rationale: Malinaw at karaniwang katumbas para sa bagay na pinapaksa o sanhi ng kaguluhan.
- source_word: τῆς ὁδοῦ
  choice: Daan
  rationale: Sa Mga Gawa, ginagamit ang ἡ ὁδός bilang kinikilalang tawag sa kilusang Kristiyano. Ang malaking titik ay tumutulong na ipakitang pantanging katawagan ito, hindi lamang literal na landas.
theological_decisions:
- issue: Paglalarawan sa τῆς ὁδοῦ bilang katawagan sa isang kilusan
  choice: Daan
  alternative: daan
  rationale: Ang “Daan” ay paulit-ulit na katawagan sa Mga Gawa para sa kilusang sumusunod kay Jesus. Pinananatili ng malaking titik ang referensiyang ito nang walang idinaragdag na denominasyonal na pakahulugan.
translation_notes:
  register: Makabago, payak, at marangal na Filipino. Pinanatili ang estilistikong litotes na “hindi maliit,” at ginamit ang “Daan” bilang pantanging katawagan na may paliwanag sa talababa.
