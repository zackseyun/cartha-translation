  terminology: Ang “binautismuhan,” “sa pangalan,” at “Panginoong Jesus” ay mga kinikilalang at angkop na terminong Tagalog. Ang “sa pangalan” ay idiomatikong katumbas ng εἰς τὸ ὄνομα sa ganitong konteksto. Maayos na itinatala ng talababa ang mas direksiyonal na puwersa ng εἰς nang hindi ipinipilit ang isang doktrinal na pagpapakahulugan.
