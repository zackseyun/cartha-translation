id: ACT.19.5
reference: Acts 19:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ ἐβαπτίσθησαν εἰς τὸ ὄνομα τοῦ κυρίου Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/005.yaml
  text: And when they heard this[a], they were baptized in the name of the Lord Jesus.
translation:
  language: tl
  text: Nang marinig nila ito, binautismuhan sila sa pangalan[a] ng Panginoong Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “tungo sa pangalan.” Maaaring ipahiwatig ng Griyego ang pag-uugnay o pagkakabilang sa Panginoong Jesus.'
    reason: Pinananatili ang direksiyonal at mapag-ugnay na puwersa ng εἰς at ang tunay na lawak ng kahulugan nito.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Nang marinig nila ito
  rationale: Ang aorist participle ay gumaganap na temporal. Likas sa Tagalog ang “Nang marinig nila ito,” at ang “ito” ay tumutukoy sa naunang sinabi, bagaman hindi inuulit ang layon sa Griyego.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang pang-ugnay ito sa daloy ng salaysay. Sapat nang ipinahihiwatig ng pagkakasunod ng mga sugnay sa Tagalog, kaya hindi kailangan ang pilit na “at” o “ngunit.”
- source_word: ἐβαπτίσθησαν
  choice: binautismuhan sila
  rationale: 'Pinananatili nito ang aorist passive: sila ang tumanggap ng bautismo.'
- source_word: εἰς τὸ ὄνομα
  choice: sa pangalan
  rationale: Ang “sa” ang pinakanatural na katumbas sa Tagalog at maaari nitong saklawin ang direksiyon, pag-uugnay, o kaugnayan na ipinahihiwatig ng εἰς. Nilalagyan ng talababa upang hindi mawala ang mas literal na puwersang “tungo sa pangalan.”
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ng Panginoong Jesus
  rationale: Ginagamit ang kinikilalang titulong “Panginoon” para kay Jesus at ang natural na anyong Tagalog na “Panginoong Jesus.”
theological_decisions:
- issue: Pananalita tungkol sa bautismo at εἰς τὸ ὄνομα
  choice: sa pangalan ng Panginoong Jesus
  alternative: tungo sa pangalan ng Panginoong Jesus
  rationale: Mas natural at malinaw sa modernong Tagalog ang “sa pangalan,” ngunit hindi nito dapat tahimik na alisin ang direksiyonal o mapag-ugnay na puwersa ng εἰς. Kaya binabanggit sa talababa ang mas literal na posibilidad nang hindi nagpapataw ng isang tiyak na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang karaniwang biblikal na “binautismuhan” at “Panginoong Jesus,” habang iniwasan ang di-likas na literalismong “tungo sa pangalan” sa pangunahing teksto.
