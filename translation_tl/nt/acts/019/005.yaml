  source_fidelity: Tapat ang salin sa Griyego. Wasto ang temporal na “Nang marinig nila ito” para sa ἀκούσαντες, at ang “binautismuhan sila” ay nagpapanatili sa tinig na passive ng ἐβαπτίσθησαν. Ang hindi hiwalay na pagsasalin sa mahinang pang-ugnay na δέ ay natural sa Tagalog at hindi nagbabago sa daloy ng salaysay.
