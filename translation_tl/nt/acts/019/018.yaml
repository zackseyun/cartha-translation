  text: πολλοί τε τῶν πεπιστευκότων ἤρχοντο ἐξομολογούμενοι καὶ ἀναγγέλλοντες τὰς πράξεις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/018.yaml
  text: And many of those who had believed were coming[a], confessing and disclosing their practices.
translation:
  language: tl
  text: Marami rin sa mga sumampalataya ang dumarating, na nagtatapat at nagsisiwalat ng kanilang mga gawain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga ginawa nila.”
    reason: Ipinapakita ang leksikal na alternatibo para sa πράξεις, na maaaring tumukoy sa mga gawain o sa mga bagay na kanilang ginawa.
lexical_decisions:
- source_word: πολλοί τε
  choice: Marami rin
  rationale: Ang “marami” ang tuwirang katumbas ng πολλοί, at ipinahihiwatig ng “rin” ang banayad na pagpapatuloy at pag-uugnay ng τέ sa naunang salaysay.
- source_word: τῶν πεπιστευκότων
  choice: sa mga sumampalataya
  rationale: Ipinapahayag nito ang naunang pagsampalataya na may nagpapatuloy na kabuluhan, nang hindi gumagamit ng teknikal na katawagang panggrupo.
- source_word: ἤρχοντο
  choice: ang dumarating
  rationale: Pinananatili ng aspektong di-ganap ng “dumarating” ang nagpapatuloy o nauulit na kilos ng imperpektong ἤρχοντο nang hindi tahasang dinaragdagan ng “patuloy” o “paulit-ulit.”
- source_word: ἐξομολογούμενοι
  choice: ipinagtatapat
  rationale: Tuwirang ipinapahayag ang pagkilala o pagtatapat habang hindi nililimitahan sa isang tiyak na uri ng kasalanan.
- source_word: ἀναγγέλλοντες
  choice: isinisiwalat
  rationale: Ang “isinisiwalat” ay likas sa konteksto ng paglalantad ng mga dating ikinukubling gawain at naiiba ang diin sa “ipinagtatapat.”
- source_word: τὰς πράξεις αὐτῶν
  choice: ang kanilang mga gawain
  rationale: Saklaw ng “mga gawain” ang mga gawa o nakagawiang aktibidad; pinananatili nitong mas malawak ang salita kaysa sa tahasang “mga kasalanan” o “mga gawaing mahika.”
theological_decisions:
- issue: Kung ang πεπιστευκότων ay dapat gawing nakapirming katawagang panggrupo o paglalarawan sa mga taong sumampalataya na.
  choice: mga sumampalataya
  alternative: mga mananampalataya
  rationale: Mas malapit ang “mga sumampalataya” sa pandiwang anyo ng Griyego at hindi ito ginagawang teknikal na katawagang eklesyal.
- issue: Kung ang τὰς πράξεις αὐτῶν ay partikular na tumutukoy sa mga kasalanan, gawaing mahika, o mga gawain sa pangkalahatan.
  choice: kanilang mga gawain
  alternative: kanilang mga kasalanan; kanilang mga gawaing mahika
  rationale: Bagaman mga gawaing mahika ang agarang konteksto, mas malawak ang πράξεις. Pinananatili ng “mga gawain” ang saklaw at tensiyon ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “rin” bilang likas na pang-ugnay sa salaysay at iniwasan ang masyadong makitid na pagtukoy sa “mga kasalanan” o “mga gawaing mahika.”
