  text: τοῦτο δὲ ἐγένετο ἐπὶ ἔτη δύο, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου, Ἰουδαίους τε καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/010.yaml
  text: This continued for two years[a], so that all who lived in Asia heard the word of the Lord, both Jews and Greeks.
translation:
  language: tl
  text: Nagpatuloy ito nang dalawang taon, kaya narinig ng lahat ng naninirahan sa Asia[a] ang salita ng Panginoon—kapuwa mga Judio at mga Griego.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tumutukoy ito sa lalawigang Romano ng Asia, sa kanlurang bahagi ng Asia Minor, hindi sa makabagong kontinente ng Asia.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: Nagpatuloy ito
  rationale: Bagaman maaaring literal na sabihing “nangyari ito,” tumutukoy ang parirala sa patuloy na pagtuturo na binanggit sa naunang talata; natural na ipinahahayag ng “Nagpatuloy ito” ang tagal ng gawain.
- source_word: ἐπὶ ἔτη δύο
  choice: nang dalawang taon
  rationale: Ipinahahayag ng ἐπί na may akusatibo ang haba ng panahon; ang “nang dalawang taon” ay natural sa modernong Tagalog.
- source_word: ὥστε
  choice: kaya
  rationale: Ipinakikilala ng ὥστε ang naging bunga ng naunang gawain. Malinaw at likas na naghahayag ng resultang ito ang “kaya.”
- source_word: πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν
  choice: lahat ng naninirahan sa Asia
  rationale: Pinananatili nito ang pangkalahatang saklaw ng πάντας at ang diwa ng κατοικοῦντας bilang mga nakatira roon. Ang makasaysayang kahulugan ng Asia ay nililinaw sa talababa.
- source_word: ἀκοῦσαι
  choice: narinig
  rationale: Tuwirang ipinahahayag nito ang resultang nakasaad sa aorist infinitive nang hindi nagdaragdag ng diwang wala sa Griyego.
- source_word: τὸν λόγον
  choice: ang salita
  rationale: Pinananatili ng “salita” ang paulit-ulit na terminolohiya ni Lucas para sa ipinahahayag na mensahe at ang teolohikal na himig ng λόγος.
- source_word: τοῦ κυρίου
  choice: ng Panginoon
  rationale: 'Ang genitibo ay natural na naglalarawan sa λόγον: “ang salita ng Panginoon.” Ang “Panginoon” ang kinagawiang marangal na katumbas ng κύριος sa kontekstong ito.'
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: mga Judio at mga Griego
  rationale: Iniuugnay ng τε καὶ ang dalawang pangkat nang inklusibo. Sapat na likas sa Tagalog ang “mga Judio at mga Griego,” at malinaw na kapuwa sila kabilang sa “lahat.”
theological_decisions:
- issue: Kahulugan ng “Asia”
  choice: Ang Romanong lalawigan ng Asia sa kanlurang Asia Minor
  alternative: Ang makabagong kontinente ng Asia o mas malawak na rehiyon nito
  rationale: Sa Mga Gawa, karaniwang tumutukoy ang Ἀσία sa Romanong lalawigan. Pinananatili sa pangunahing teksto ang pangalang “Asia,” habang iniiwasan ng talababa ang anakronistikong pagkaunawa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Judio” at “Griego” bilang natural na katawagan sa mga pangkat, at pinanatili ang “salita ng Panginoon” upang mapangalagaan ang bokabularyo at teolohikal na himig ni Lucas.
