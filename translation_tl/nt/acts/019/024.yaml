id: ACT.19.24
reference: Acts 19:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Δημήτριος γάρ τις ὀνόματι, ἀργυροκόπος, ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος παρείχετο τοῖς τεχνίταις ⸂οὐκ ὀλίγην ἐργασίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/024.yaml
  text: For a certain man named Demetrius[a], a silversmith who made silver shrines of Artemis[b], was providing the craftsmen with no small business.
translation:
  language: tl
  text: Sapagkat may isang lalaking nagngangalang Demetrio, isang platero na gumagawa ng mga dambanang pilak ni Artemis[a]. Nagbibigay siya sa mga bihasang manggagawa ng hindi kakaunting pagkakakitaan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga templong pilak ni Artemis” o “mga pilak na huwaran ng templo ni Artemis.” Ginamit sa Griyego ang naous (“mga dambana/templo”), na malamang na tumutukoy sa maliliit na bagay na ginawa kaugnay ng pagsamba kay Artemis.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “hindi kakaunting pagkakakitaan,” isang paraang nagpapahiwatig ng malaking kalakalan o kita sa pamamagitan ng pagsasabi ng kabaligtaran nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang salaysay.
- source_word: Δημήτριος ... ὀνόματι
  choice: nagngangalang Demetrio
  rationale: Likas na pagpapakilala sa isang tao sa modernong Tagalog; ginamit ang nakaugaliang anyong Tagalog ng pangalang Griyego.
- source_word: ἀργυροκόπος
  choice: platero
  rationale: Karaniwan at tiyak na tawag sa manggagawang humuhubog o gumagawa ng mga bagay na pilak.
- source_word: ναοὺς ἀργυροῦς Ἀρτέμιδος
  choice: mga dambanang pilak ni Artemis
  rationale: Ang ναός ay maaaring templo o santuwaryo, ngunit sa kontekstong pangkalakalan ay malamang na maliliit na dambana o huwaran; hindi tinutukoy nang higit sa ipinahihiwatig ng teksto ang eksaktong anyo ng mga ito.
- source_word: παρείχετο
  choice: Nagbibigay siya
  rationale: Ipinahihiwatig ng imperfect ang patuloy o nakagawiang gawain ni Demetrio.
- source_word: τοῖς τεχνίταις
  choice: sa mga bihasang manggagawa
  rationale: Tumutukoy sa mga sanay na manggagawa sa nasabing hanapbuhay at hindi lamang sa pangkalahatang mga trabahador.
- source_word: οὐκ ὀλίγην ἐργασίαν
  choice: hindi kakaunting pagkakakitaan
  rationale: Pinananatili ang litotes ng Griyego habang ipinahahayag ang malaking hanapbuhay, kalakalan, o kita na nalilikha nito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang pangalang Artemis mula sa Griyego sa halip na gamitin ang Romanong pangalang Diana. Hinati sa dalawang pangungusap para sa likas at madaling pag-unawa nang hindi binabago ang lohikal na ugnayan.
