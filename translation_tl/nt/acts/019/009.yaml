revisions:
- from: Ngunit nang magmatigas ang ilan at tumangging maniwala,[a] at nilalait nila ang Daan[b] sa harap ng maraming tao, lumayo si Pablo sa kanila at ibinukod ang mga alagad. Araw-araw siyang nakikipagtalakayan sa bulwagan ni Tirano.[c]
  to: Ngunit nang ang ilan ay nagmatigas at sumuway, at nilalait ang Daan[b] sa harap ng maraming tao, lumayo si Pablo sa kanila at ibinukod ang mga alagad. Araw-araw siyang nangangatuwiran sa bulwagan ni Tirano.[c]
  rationale: Pinalitan ang pangunahing salin ng ἠπείθουν ng “sumuway” upang masunod ang volitional na puwersa ng Griyego at ang English audit trail, samantalang napanatili sa talababa ang alternatibong ‘tumangging maniwala.’ Pinalitan din ang “nakikipagtalakayan” ng “nangangatuwiran” upang mas tumpak na maipahayag ang διαλεγόμενος. Ang iba pang mga pagpili, kabilang ang “Daan,” “mga alagad,” at “bulwagan ni Tirano,” ay pinanatili.
