id: ACT.19.9
reference: Acts 19:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ’ αὐτῶν ἀφώρισεν τοὺς μαθητάς, καθ’ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ ⸀Τυράννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/009.yaml
  text: But when some became hardened and disobedient[a], speaking evil of the Way before the crowd, he withdrew from them and set apart the disciples[c][b], reasoning daily in the lecture hall of Tyrannus.
translation:
  language: tl
  text: Ngunit nang ang ilan ay nagmatigas at sumuway, at nilalait ang Daan[b] sa harap ng maraming tao, lumayo si Pablo sa kanila at ibinukod ang mga alagad. Araw-araw siyang nangangatuwiran sa bulwagan ni Tirano.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ang “Daan” ay isang sinaunang katawagan sa kilusang Kristiyano sa Mga Gawa.
    reason: cultural_note
  - marker: c
    text: Maaari ring “sa paaralan ni Tirano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκληρύνοντο
  choice: magmatigas
  rationale: Ipinahahayag ng imperpektong anyo ang nagpapatuloy na pagmamatigas. Likas sa modernong Tagalog ang “magmatigas” at hindi nito tiyak na ipinapasiya kung sino ang sanhi ng kalagayan.
- source_word: ἠπείθουν
  choice: tumangging maniwala
  rationale: Maaaring mangahulugan ang ἀπειθέω ng hindi paniniwala, pagsuway, o pagtangging mahikayat. Sa konteksto ng pagtutol sa mensahe ni Pablo, pinananatili ng pariralang ito ang sinasadyang pagtanggi habang ang talababa ay naglalahad ng ibang posibilidad.
- source_word: κακολογοῦντες
  choice: nilalait nila
  rationale: Tumutukoy ito sa hayagan at mapanirang pagsasalita laban sa Daan. Ang “nilalait” ay malinaw at natural, nang hindi ipinapalagay ang teknikal o legal na kahulugan ng paninirang-puri.
- source_word: τὴν ὁδὸν
  choice: ang Daan
  rationale: Sa Mga Gawa, ginagamit ang “Daan” bilang kinikilalang tawag sa kilusang sumusunod kay Jesus. Pinananatili ng malaking titik ang gamit nito bilang katawagan.
- source_word: ἐνώπιον τοῦ πλήθους
  choice: sa harap ng maraming tao
  rationale: Malinaw nitong ipinakikita na hayagan at pampubliko ang kanilang pagtutol.
- source_word: ἀποστὰς ἀπ’ αὐτῶν
  choice: lumayo si Pablo sa kanila
  rationale: Ipinahahayag nito ang tiyak na paghiwalay sa mga tumututol. Tinukoy si Pablo upang maging malinaw sa Tagalog ang paksa ng magkakasunod na kilos.
- source_word: ἀφώρισεν τοὺς μαθητάς
  choice: ibinukod ang mga alagad
  rationale: Pinananatili ng “ibinukod” ang sinadyang paghihiwalay sa mga alagad mula sa grupong salungat, at ang “mga alagad” ang karaniwang salin ng μαθηταί.
- source_word: καθ’ ἡμέραν
  choice: araw-araw
  rationale: Natural at tuwirang ipinahahayag ang palagiang gawain sa bawat araw.
- source_word: διαλεγόμενος
  choice: nakikipagtalakayan
  rationale: Saklaw nito ang makatuwiran at mapanghikayat na pagpapaliwanag na may palitan ng usapan, nang hindi awtomatikong nagpapahiwatig ng mainitang pakikipagtalo.
- source_word: ἐν τῇ σχολῇ Τυράννου
  choice: sa bulwagan ni Tirano
  rationale: Ang σχολή ay maaaring tumukoy sa paaralan o bulwagang ginagamit sa pagtuturo. Mas malinaw sa modernong mambabasa ang “bulwagan,” habang inilalahad sa talababa ang alternatibo.
theological_decisions:
- issue: Ang “Daan” bilang katawagan sa kilusang Kristiyano
  choice: Ginamit ang malaking titik sa “Daan” bilang kinikilalang katawagan
  alternative: Maliit na titik na “daan” bilang pangkalahatang landas o paraan ng pamumuhay
  rationale: Sa Mga Gawa, gumaganap ang parirala bilang katawagan sa kilusang sumusunod kay Jesus. Ipinakikita ito ng malaking titik nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
- issue: Saklaw ng ἠπείθουν
  choice: tumangging maniwala
  alternative: sumuway; ayaw magpahikayat
  rationale: Pinagsasama ng pangunahing salin ang kawalan ng pananampalataya at ang sinasadyang pagtanggi, ngunit pinananatili sa talababa ang tunay na leksikal na posibilidad ng pagsuway o pagtangging mahikayat.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bulwagan” upang maiwasan ang modernong institusyonal na dating ng “paaralan” sa pangunahing teksto; pinanatili naman sa talababa ang posibleng literal na salin. Inayos ang ayos ng pangungusap upang maging likas sa Tagalog habang nananatili ang pagkakasunod ng mga kilos sa Griyego.
