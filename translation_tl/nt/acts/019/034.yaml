  text: ἐπιγνόντες δὲ ὅτι Ἰουδαῖός ἐστιν φωνὴ ἐγένετο μία ἐκ πάντων ⸀ὡς ἐπὶ ὥρας δύο κραζόντων· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/034.yaml
  text: But when they recognized that he was a Jew[a], one voice arose from them all, crying out for about two hours, “Great is Artemis of the Ephesians!”
translation:
  language: tl
  text: Ngunit nang makilala nilang siya ay isang Judio[a], iisa ang naging sigaw ng lahat, at mga dalawang oras silang sumisigaw, “Dakila si Artemis ng mga taga-Efeso!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang taga-Judea.” Maaaring tumukoy ang salitang Griyego sa isang Judio o sa isang taong mula sa Judea; dito, mas malamang ang mas malawak na kahulugang etniko at panrelihiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: nang makilala nila
  rationale: 'Ipinahahayag ng aorist participle ang naunang pangyayari: nakilala muna ng mga tao ang pagkakakilanlan ni Alejandro bago sila nagsimulang sumigaw.'
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita nito ang pagsalungat sa naunang pagtatangkang magsalita.
- source_word: Ἰουδαῖός
  choice: isang Judio
  rationale: Sa konteksto ng Efeso, mas malamang na tumutukoy ito sa pagkakakilanlang etniko at panrelihiyon kaysa sa pinagmulan lamang sa Judea.
- source_word: φωνὴ ἐγένετο μία ἐκ πάντων
  choice: nagkaisa ang tinig nilang lahat
  rationale: Natural na Tagalog ito na pinananatili ang larawan ng iisang tinig at ang pagkakaisa ng sigaw ng buong karamihan.
- source_word: ὡς ἐπὶ ὥρας δύο
  choice: halos dalawang oras
  rationale: Ipinahahayag ng ὡς sa sukat ng panahon ang pagtatantiya, hindi eksaktong tagal.
- source_word: κραζόντων
  choice: silang sumisigaw
  rationale: Pinananatili ng anyong ito ang patuloy at malakas na pagsigaw ng karamihan.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: Dakila si Artemis ng mga taga-Efeso!
  rationale: Pinananatili ang mariing pagpupugay, ang pangalan ng diyosa, at ang kaugnayan niya sa mga taga-Efeso.
theological_decisions:
- issue: Kahulugan ng Ἰουδαῖος
  choice: isang Judio
  alternative: isang taga-Judea
  rationale: Ang tugon ng karamihan sa Efeso ay pinakamalinaw na nauugnay sa pagkakakilanlang etniko at panrelihiyon ni Alejandro. Gayunman, inilalagay sa talababa ang posibleng heograpikong kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Judio” bilang karaniwang katawagang biblikal sa modernong Filipino, at ang “nagkaisa ang tinig” upang mapanatili ang metapora ng Griyego nang hindi nagiging asiwa ang pangungusap.
