  source_fidelity: Tumpak na naihahatid ng draft ang adversatibong pagliko (δέ), ang pagkilala ng karamihan sa pagkakakilanlan ni Alejandro bilang Ἰουδαῖος, ang nagkakaisang sigaw, ang tinatayang tagal na dalawang oras, at ang aklamasyon para kay Artemis. Ang talababa ay wastong nagpapanatili ng leksikal na alternatibong “taga-Judea.”
  naturalness: Ang “nagkaisa ang tinig nilang lahat” ay nauunawaan ngunit hindi lubos na likas sa makabagong Tagalog. Mas natural at malinaw ang “iisa ang naging sigaw ng lahat,” na pinananatili ang idiomang Griyego tungkol sa iisang tinig mula sa lahat. Ang “mga dalawang oras” ay likas na paraan upang ipahayag ang tinatayang sukat ng ὡς ἐπὶ ὥρας δύο.
  terminology: Ang “Judio” ay angkop na karaniwang katawagang biblikal para sa mas malawak na etniko-panrelihiyong kahulugan sa kontekstong ito; ang “taga-Judea” ay dapat manatili bilang alternatibo sa talababa. Ang “Artemis” at “mga taga-Efeso” ay wasto at natural.
