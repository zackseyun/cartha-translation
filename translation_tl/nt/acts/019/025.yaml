  text: After gathering them together[a], along with the workmen occupied with such things, he said, “Men, you know that from this business we have our prosperity.
translation:
  language: tl
  text: Matapos niyang tipunin sila at ang mga manggagawang may kinalaman sa gayong mga bagay, sinabi niya, “Mga ginoo, alam ninyo na sa hanapbuhay na ito nagmumula ang ating kasaganaan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kalakal na ito nanggagaling ang ating kayamanan.”
    reason: Pinananatili ang mga posibleng kahulugan ng ἐργασία bilang “kalakal” at εὐπορία bilang “kayamanan,” na mas tuwirang nagbibigay-diin sa kita at ari-arian.
lexical_decisions:
- source_word: συναθροίσας
  choice: Tinipon niya
  rationale: Ang aorist participle ay nagsasaad ng kilos na kaugnay at nauuna sa pangunahing pandiwang ‘sinabi.’ Ang ‘tinipon niya’ ay natural sa Tagalog at malinaw na naghudyat ng pagtitipon.
- source_word: τοὺς περὶ τὰ τοιαῦτα ἐργάτας
  choice: ang mga manggagawang gumagawa ng gayong mga bagay
  rationale: Pinananatili nito ang malawak na kahulugan ng ἐργάτας at ang hindi tiyak na pagtukoy ng περὶ τὰ τοιαῦτα, nang hindi nililimitahan ang mga manggagawa sa isang espesipikong uri ng likhang-sining.
- source_word: Ἄνδρες
  choice: Mga ginoo
  rationale: Tumutukoy ang vocative sa mga lalaking kasamahan. Sa modernong Tagalog, ang ‘Mga ginoo’ ay isang natural at marangal na tuwirang tawag sa pangkat ng mga lalaki.
- source_word: ἐπίστασθε
  choice: alam ninyo
  rationale: Direkta at natural nitong ipinapahayag ang kaalaman o pagkaunawang taglay na ng mga kausap.
- source_word: ἐκ ταύτης τῆς ἐργασίας
  choice: sa hanapbuhay na ito
  rationale: Sa kontekstong pangkabuhayan, ang ἐργασία ay tumutukoy sa gawaing pinagkakakitaan o kalakalan. Ang ‘hanapbuhay’ ay malinaw sa karaniwang mambabasa habang hindi sobrang espesipiko.
- source_word: ἡ εὐπορία ἡμῖν ἐστιν
  choice: nagmumula ang ating kasaganaan
  rationale: Ipinapakita nito na ang εὐπορία—kasaganaan o kaginhawaang materyal—ay nagmumula sa nasabing hanapbuhay, ayon sa konstruksiyong ἐκ ... ἐστιν.
