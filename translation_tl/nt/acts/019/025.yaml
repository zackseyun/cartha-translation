translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang ‘Mga ginoo’ bilang likas na tawag sa mga lalaking kausap, at ‘hanapbuhay’ upang ihayag ang komersiyal na konteksto nang hindi nagpapasok ng detalye na wala sa talata.
