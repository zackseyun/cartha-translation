    issue: Ang “sa patnubay ng Espiritu” ay higit na tiyak kaysa sa ἐν τῷ πνεύματι.
    rationale: Ang Griyego ay literal na “sa Espiritu/espiritu” at pinagtatalunan kung tumutukoy ito sa Banal na Espiritu o sa panloob na diwa/pagpapasiya ni Pablo. Ang “patnubay” ay nagdaragdag ng konsepto ng paggabay na hindi hayagang nasa parirala.
  revised_text: Pagkatapos maganap ang mga bagay na ito, nagpasiya si Pablo sa Espiritu[a] na dumaan sa Macedonia at Acaya at pagkatapos ay magtungo sa Jerusalem. Sinabi niya, “Pagkatapos kong makarating doon, kailangan ko ring makita ang Roma.”
