id: ACT.19.21
reference: Acts 19:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληρώθη ταῦτα, ἔθετο ὁ Παῦλος ἐν τῷ πνεύματι διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν πορεύεσθαι εἰς ⸀Ἱεροσόλυμα, εἰπὼν ὅτι Μετὰ τὸ γενέσθαι με ἐκεῖ δεῖ με καὶ Ῥώμην ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/021.yaml
  text: After these things were completed[a], Paul resolved in the Spirit to go to Jerusalem after passing through Macedonia and Achaia, saying, “After I have been there[b], I must also see Rome.”
translation:
  language: tl
  text: Pagkatapos maganap ang mga bagay na ito, nagpasiya si Pablo sa Espiritu[a] na dumaan sa Macedonia at Acaya at pagkatapos ay magtungo sa Jerusalem. Sinabi niya, “Pagkatapos kong makarating doon, kailangan ko ring makita ang Roma.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kaniyang espiritu.” Maaaring tumukoy ang pariralang Griyego sa sariling panloob na pagpapasiya ni Pablo o sa Banal na Espiritu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπληρώθη
  choice: matapos
  rationale: Sa kontekstong ito, ang παθητικό ng πληρόω ay tumutukoy sa pagkumpleto ng mga naunang pangyayari, hindi sa katuparan ng hula. Likas sa Tagalog ang “Nang matapos ang mga bagay na ito.”
- source_word: ἔθετο
  choice: nagpasiya
  rationale: Ang idyomatikong gitnang anyo ng τίθημι ay nagpapahayag ng matibay at sinasadyang pagpapasiya. Malinaw at kasalukuyang gamit ang “nagpasiya.”
- source_word: ἐν τῷ πνεύματι
  choice: sa patnubay ng Espiritu
  rationale: Pinili sa pangunahing teksto ang pagbasa na tumutukoy sa Banal na Espiritu, gaya ng daloy ng misyon sa Lucas–Mga Gawa. Ginawang natural sa Tagalog ang relasyon sa pamamagitan ng “sa patnubay,” habang inilalahad sa talababa ang tunay na posibilidad na tumukoy ito sa sariling espiritu ni Pablo.
- source_word: διελθὼν
  choice: pagkatapos dumaan
  rationale: Ipinahihiwatig ng aorist participle na mauuna ang pagdaan sa Macedonia at Acaya bago ang pagpunta sa Jerusalem.
- source_word: πορεύεσθαι
  choice: na magtungo
  rationale: Ang “magtungo” ay natural at marangal na katumbas ng malawak na pandiwa ng pagkilos o paglalakbay.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lugar sa modernong Filipino.
- source_word: Μετὰ τὸ γενέσθαι με ἐκεῖ
  choice: Pagkatapos kong makarating doon
  rationale: Natural na ipinapahayag sa Tagalog ang articular infinitive construction bilang pagdating at pagkanaroon sa lugar bago ang susunod na hakbang.
- source_word: δεῖ
  choice: kailangan ko
  rationale: Pinananatili nito ang puwersa ng pangangailangan, na sa Lucas–Mga Gawa ay maaari ring magpahiwatig ng layuning itinakda ng Diyos nang hindi iyon labis na ipinapaliwanag.
- source_word: ἰδεῖν
  choice: makita
  rationale: Pinananatili ang literal na pandiwang “makita”; sa konteksto ng paglalakbay, likas din itong nagpapahiwatig ng pagdalaw sa Roma.
theological_decisions:
- issue: Tinutukoy ng ἐν τῷ πνεύματι
  choice: sa patnubay ng Espiritu
  alternative: sa kaniyang espiritu / sa kaniyang kalooban
  rationale: Walang tahasang panghalip na paari sa Griyego, kaya maaaring tumukoy ang parirala sa paggabay ng Banal na Espiritu o sa panloob na pagpapasiya ni Pablo. Pinili sa teksto ang unang pagbasa dahil sa madalas na pag-uugnay ni Lucas ng mga pasiyang pangmisyon sa Espiritu, ngunit pinanatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Acaya,” ang karaniwang anyong Filipino ng Achaia. Iniwasan ang labis na literal ngunit alanganing ayos ng pangungusap, habang pinanatili ang pagkakasunod-sunod ng pagdaan sa Macedonia at Acaya bago ang Jerusalem at ang kalabuan tungkol sa πνεῦμα.
