translation:
  language: tl
  text: At patuloy na gumawa ang Diyos ng mga pambihirang himala sa pamamagitan ng mga kamay ni Pablo,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga makapangyarihang gawa na hindi pangkaraniwan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δυνάμεις
  choice: mga himala
  rationale: Sa kontekstong ito, ang pangmaramihang δύναμις ay tumutukoy sa makapangyarihang mga gawa, kaya malinaw at natural ang “mga himala” sa modernong Filipino.
- source_word: τε
  choice: At
  rationale: Nag-uugnay ang τε sa naunang salaysay; likas na katumbas dito ang “At.”
- source_word: οὐ τὰς τυχούσας
  choice: mga pambihirang
  rationale: Ang idyoma ay literal na “hindi pangkaraniwan” o “hindi basta-basta.” Ipinahahayag ng “pambihirang” ang diin sa natural na Filipino, habang inilalagay sa talababa ang mas literal na anyo.
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Hayagang Diyos ang simuno ng pandiwa; pinananatili nito ang diin sa banal na pagkilos.
- source_word: ἐποίει
  choice: patuloy na gumagawa
  rationale: Ang aspektong imperpektibo ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagkilos sa nakaraan; malinaw itong naihahatid ng “patuloy na gumagawa.”
- source_word: διὰ τῶν χειρῶν Παύλου
  choice: sa pamamagitan ng mga kamay ni Pablo
  rationale: Pinananatili ang kongkretong idyoma ng Griyego at ipinakikitang si Pablo ang kasangkapang ginamit, hindi ang pangunahing pinagmulan ng kapangyarihan.
- source_word: Παύλου
  choice: Pablo
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Filipino.
theological_decisions:
- issue: Ang gumagawa ng mga himala
  choice: Ang Diyos ang gumagawa, sa pamamagitan ng mga kamay ni Pablo.
  alternative: Si Pablo mismo ang gumagawa ng mga himala.
  rationale: Ang ὁ θεὸς ang tahasang simuno ng ἐποίει, samantalang ang διὰ τῶν χειρῶν Παύλου ay nagpapahayag ng instrumentong ginamit. Pinananatili ng salin ang pagkakaibang ito nang hindi ipinapalagay na may nagsasariling kapangyarihan si Pablo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at natural. Pinanatili ang “mga kamay” upang maingatan ang kongkretong larawan at ang diin sa Diyos bilang kumikilos sa pamamagitan ni Pablo.
