id: ACT.19.13
reference: Acts 19:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐπεχείρησαν δέ τινες ⸀καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ κυρίου Ἰησοῦ λέγοντες· ⸀Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν ⸀ὃν Παῦλος κηρύσσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/013.yaml
  text: But some also of the itinerant Jewish exorcists attempted to invoke the name of the Lord Jesus over those who had evil spirits[a], saying, “I adjure you by Jesus[d][c][b], whom Paul proclaims.”
translation:
  language: tl
  text: Ngunit tinangka rin ng ilang Judiong eksorsistang naglalakbay na gamitin ang pangalan ng Panginoong Jesus sa mga may masasamang espiritu,[a] na sinasabi, “Mahigpit ko kayong inaatasan sa pamamagitan ni Jesus,[b] na ipinapahayag ni Pablo.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “mga may masasamang espiritu”; maaari ring unawaing “mga sinapian ng masasamang espiritu.”
    reason: lexical_alternative
  - marker: b
    text: O “Inaatasan ko kayo sa ilalim ng panunumpa sa pamamagitan ni Jesus” o “Mahigpit ko kayong iniuutos sa pamamagitan ni Jesus.” Ang pandiwa ay tumutukoy sa isang taimtim na pag-aatas na may panunumpa.
    reason: lexical_alternative
  - marker: c
    text: O “na ipinangangaral ni Pablo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεχείρησαν
  choice: tinangka
  rationale: Tumpak at natural na ipinahahayag ang pagsubok na gawin ang isang bagay nang hindi ipinahihiwatig na nagtagumpay ito.
- source_word: τινες καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν
  choice: ilan sa mga Judiong nagpapalipat-lipat na nagpapalayas ng masasamang espiritu
  rationale: Pinananatili ng “ilan” at “rin” ang τινες at καί; inilalarawan ng “nagpapalipat-lipat” ang paglalakbay sa iba't ibang lugar, at mas malinaw sa karaniwang mambabasa ang pariralang pandiwa kaysa sa teknikal na “eksorsista.”
- source_word: ὀνομάζειν ἐπὶ ... τὸ ὄνομα
  choice: gamitin ang pangalan ... laban sa
  rationale: Sa kontekstong ito, ang pagbanggit sa pangalan ay isang pormula ng pagpapalayas. Ang “gamitin ang pangalan” ay likas sa Filipino at hindi ipinahihiwatig na taimtim silang dumadalangin kay Jesus.
- source_word: τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: mga may masasamang espiritu
  rationale: Malapit ito sa literal na “mga may masasamang espiritu” at hindi nagpapasok ng mas tahasang konsepto ng ganap na pag-aari o possession.
- source_word: τὰ πνεύματα τὰ πονηρά
  choice: masasamang espiritu
  rationale: Karaniwan, malinaw, at angkop na salin ng πνεύματα πονηρά sa espirituwal na konteksto.
- source_word: τὸ ὄνομα τοῦ κυρίου Ἰησοῦ
  choice: ang pangalan ng Panginoong Jesus
  rationale: Pinananatili ang kristolohikal na titulong κύριος bilang “Panginoon” sa natural na anyong Filipino.
- source_word: Ὁρκίζω ὑμᾶς
  choice: Inaatasan ko kayo nang may panunumpa
  rationale: Ipinakikita ang pormal at mapanumpang lakas ng ὁρκίζω; mas nauunawaan ito kaysa sa bihirang terminong “isinusumpa ko kayo,” na maaari ring maling maunawaan bilang pagkokondena.
- source_word: τὸν Ἰησοῦν ὃν Παῦλος κηρύσσει
  choice: sa pangalan ni Jesus, na ipinapahayag ni Pablo
  rationale: Ang akusatibo pagkatapos ng ὁρκίζω ay tumutukoy sa batayan ng mapanumpang pag-aatas. Ginagawang natural sa Filipino ang kahulugan sa pamamagitan ng “sa pangalan ni Jesus”; ang κηρύσσει ay “ipinapahayag,” na saklaw ang pampublikong paghahayag o pangangaral.
theological_decisions:
- issue: Pagsasalin sa κύριος sa pariralang τοῦ κυρίου Ἰησοῦ
  choice: Panginoon
  alternative: Guro / Amo
  rationale: Taglay ng “Panginoon” ang karaniwang honoripiko at teolohikal na bigat ng τίτλος sa Mga Gawa nang hindi nagpapaliit sa kahulugan nito.
- issue: Kung tahasang sasabihing sinapian ang τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: mga may masasamang espiritu
  alternative: mga sinapian ng masasamang espiritu
  rationale: Literal na sinasabi ng Griyego na sila ay “may” masasamang espiritu. Bagaman maaaring tumukoy ito sa pagsapi, hindi ginagawang mas tiyak ng salin ang antas o uri ng impluwensiya.
- issue: Kung ang ὀνομάζειν ay ipapakitang taimtim na pagtawag kay Jesus
  choice: gamitin ang pangalan
  alternative: tumawag sa pangalan
  rationale: Ipinakikita ng konteksto na ginamit ng mga eksorsista ang pangalan bilang pormula; iniiwasan ng napiling salin ang pagpapahiwatig na tunay silang nananampalataya o nananalangin kay Jesus.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Iniwasan ang sobrang teknikal na “eksorsista” sa pangunahing teksto, ngunit pinanatili ang pormal na tono ng mapanumpang pag-aatas. Ang lahat ng talababa ay may katumbas na marker sa pangunahing teksto.
