revisions:
- from: Ngunit tinangka rin ng ilan sa mga Judiong nagpapalipat-lipat na nagpapalayas ng masasamang espiritu na gamitin ang pangalan ng Panginoong Jesus laban sa mga may masasamang espiritu,[a] na sinasabi, “Inaatasan ko kayo nang may panunumpa sa pangalan ni Jesus,[b] na ipinapahayag ni Pablo.”[c]
  to: Ngunit tinangka rin ng ilang Judiong eksorsistang naglalakbay na gamitin ang pangalan ng Panginoong Jesus sa mga may masasamang espiritu,[a] na sinasabi, “Mahigpit ko kayong inaatasan sa pamamagitan ni Jesus,[b] na ipinapahayag ni Pablo.”[c]
  rationale: Inayos ang pormula ng pag-aatas upang huwag magdagdag ng ‘pangalan’ sa τὸν Ἰησοῦν at upang maipahayag ang ‘by Jesus’ sa natural na Filipino. Pinalitan din ang masikip na “laban sa” at ang mabigat na paglalarawan sa mga eksorsista, nang hindi binabago ang antas ng ipinahihiwatig ng pinagmulan tungkol sa mga may masasamang espiritu.
  reviewer_model: gpt-5.6-terra
