  source_fidelity: Tumpak na naipapahayag ang ἀποκριθὲν ... εἶπεν αὐτοῖς bilang “sumagot sa kanila,” ang τὸ πνεῦμα τὸ πονηρόν bilang “ang masamang espiritu,” at ang mariing pagsalungat sa huling tanong. Napananatili rin ang pangmaramihang kausap sa “kayo.” Ang “Kilala ko si Jesus, at alam ko kung sino si Pablo” ay isang maingat at natural na paraan upang katawanin ang magkaibang γινώσκω at ἐπίσταμαι nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
