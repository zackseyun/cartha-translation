  text: ἀποκριθὲν δὲ τὸ πνεῦμα τὸ πονηρὸν εἶπεν ⸀αὐτοῖς· ⸀Τὸν Ἰησοῦν γινώσκω καὶ τὸν Παῦλον ἐπίσταμαι, ὑμεῖς δὲ τίνες ἐστέ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/015.yaml
  text: But the evil spirit answered them[a], “Jesus I know, and Paul I recognize—but who are you?”
translation:
  language: tl
  text: Ngunit sumagot sa kanila ang masamang espiritu, “Kilala ko si Jesus, at alam ko kung sino si Pablo[a]—ngunit sino kayo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “Kilala ko si Jesus, at kilala ko si Pablo.” Dalawang magkaibang pandiwa ang ginamit sa Griyego: γινώσκω (“kilala”) at ἐπίσταμαι (“alam” o “kilala”). Maaaring may bahagyang pagkakaiba ang diwa ng mga ito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθὲν ... εἶπεν αὐτοῖς
  choice: sumagot sa kanila
  rationale: Ang participle na ἀποκριθέν kasama ng εἶπεν ay isang karaniwang Griyegong paraan ng pagpapakilala sa tugon. Pinagsama ito sa natural na Tagalog na “sumagot sa kanila” upang mapanatili ang diwang tumutugon nang walang paulit-ulit na “sumagot at sinabi.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang paglipat na may banayad na pagsalungat mula sa pagtatangka ng mga nagpapalayas ng demonyo tungo sa tugon ng espiritu.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: ang masamang espiritu
  rationale: Sa konteksto, ang πνεῦμα ay isang personal na espirituwal na nilalang at ang πονηρόν ay tumutukoy sa kasamaan. Ang “masamang espiritu” ay malinaw at karaniwang pahayag sa modernong Tagalog.
- source_word: Τὸν Ἰησοῦν γινώσκω
  choice: Kilala ko si Jesus
  rationale: Ang γινώσκω rito ay likas na maisasalin na “kilala,” na nagpapahayag ng pagkakilala sa isang persona. Napananatili rin ng pag-una kay Jesus ang diin ng Griyego.
- source_word: τὸν Παῦλον ἐπίσταμαι
  choice: alam ko kung sino si Pablo
  rationale: Iba ang pandiwang ἐπίσταμαι sa naunang γινώσκω. Ang “alam ko kung sino” ay natural na Tagalog na nagpapanatili ng posibleng pagkakaiba sa pagitan ng personal na pagkakilala at pagkaalam o pagkilala kung sino ang isang tao, nang hindi nagtatakda ng tiyak na antas ng kaalaman.
- source_word: ὑμεῖς δὲ τίνες ἐστέ
  choice: ngunit sino kayo?
  rationale: May diin ang pangmaramihang ὑμεῖς at may pagsalungat ang δέ. Ang “ngunit sino kayo?” ay maikli at natural, at malinaw sa konteksto na maramihan ang “kayo.”
theological_decisions:
- issue: Pagpapanatili sa pagkakaiba ng γινώσκω at ἐπίσταμαι sa sinabi ng masamang espiritu
  choice: “Kilala ko si Jesus, at alam ko kung sino si Pablo”
  alternative: “Kilala ko si Jesus, at kilala ko si Pablo”
  rationale: Dalawang magkaibang pandiwa ang ginamit sa Griyego, kaya pinanatili sa salin ang posibleng retorikal na pagkakaiba. Hindi nito ipinapalagay ang isang partikular na doktrina tungkol sa antas o uri ng kaalaman ng masamang espiritu.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, tuwiran, at marangal. Ginamit ang “masamang espiritu,” na mas likas sa ordinaryong mambabasa kaysa sa mas teknikal o mas mabigat na mga katawagan. Pinanatili ng gitling na em dash ang matalim na pagsalungat bago ang tanong.
