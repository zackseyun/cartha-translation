  text: ⸀εἴπας δὲ ταῦτα καὶ λαβὼν ἄρτον εὐχαρίστησεν τῷ θεῷ ἐνώπιον πάντων καὶ κλάσας ἤρξατο ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/035.yaml
  text: And after saying these things and taking bread[a], he gave thanks to God in the presence of all, and after breaking it, he began to eat.
translation:
  language: tl
  text: Matapos niyang sabihin ang mga iyon, kumuha siya ng tinapay at nagpasalamat sa Diyos sa harap ng lahat[a]. Pagkatapos niya itong pagputul-putulin, nagsimula siyang kumain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa presensya ng lahat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπας δὲ ταῦτα
  choice: Pagkasabi nito
  rationale: Ipinapakita ng pariralang ito na nauna ang sinabi ni Pablo bago ang sumunod na mga kilos. Ang “nito” ay natural na tumutukoy sa mga sinabi niya sa naunang talata, habang ang banayad na pang-ugnay na δέ ay likas nang naipahihiwatig ng pagpapatuloy ng salaysay.
- source_word: λαβὼν ἄρτον
  choice: kumuha siya ng tinapay
  rationale: Natural ito sa makabagong Tagalog at hindi nito labis na tinutukoy kung isang buong tinapay o isang bahagi lamang ang kinuha.
- source_word: εὐχαρίστησεν τῷ θεῷ
  choice: nagpasalamat sa Diyos
  rationale: Tuwirang ipinahahayag nito ang karaniwang kahulugan ng εὐχαριστέω at pinananatili ang Diyos bilang tahasang pinag-uukulan ng pasasalamat.
- source_word: ἐνώπιον πάντων
  choice: sa harap ng lahat
  rationale: Malinaw at natural na ipinapakita nito na hayagang ginawa ni Pablo ang pasasalamat habang naroroon at nakatingin ang lahat.
- source_word: κλάσας
  choice: Pagkapira-piraso niya rito
  rationale: Ipinapakita ng anyong pandiwari na natapos muna ang pagpira-piraso sa tinapay bago siya nagsimulang kumain. Ang “rito” ay tumutukoy sa tinapay nang hindi inuulit ang pangngalan.
- source_word: ἤρξατο ἐσθίειν
  choice: nagsimula siyang kumain
  rationale: Pinananatili nito ang tahasang diwa ng pagsisimula sa konstruksiyong ἄρχομαι na may pawatas.
theological_decisions:
- issue: Posibleng alusyon sa Hapunan ng Panginoon sa pagkakasunod-sunod ng pagkuha ng tinapay, pagpapasalamat, pagpira-piraso, at pagkain
  choice: Isinalin ang mga kilos bilang payak na salaysay ng pagkain.
  alternative: Gumamit ng tradisyonal o liturhikal na pananalitang higit na nagpapahiwatig ng Hapunan ng Panginoon.
  rationale: Maaaring ipaalala ng mga kilos ang ibang tagpo ng pagpira-piraso ng tinapay, ngunit hindi tahasang tinatawag ng talata ang pangyayaring ito na Hapunan ng Panginoon. Kaya hindi dinagdagan ng salin ang teolohikal na pahiwatig ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang sunod-sunod na kilos at ang pampublikong katangian ng pasasalamat, nang hindi ginagawang liturhikal ang pananalita.
