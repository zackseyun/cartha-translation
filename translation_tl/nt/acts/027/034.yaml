  text: διὸ παρακαλῶ ὑμᾶς ⸀μεταλαβεῖν τροφῆς, τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει· οὐδενὸς γὰρ ὑμῶν θρὶξ ⸀ἀπὸ τῆς κεφαλῆς ⸀ἀπολεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/034.yaml
  text: Therefore I urge you to take some food[a], for this is for your preservation; for not a hair from the head of any of you will perish.
translation:
  language: tl
  text: Kaya hinihimok ko kayong kumain, sapagkat para ito sa inyong kaligtasan[a]; sapagkat ni isang buhok sa ulo ng sinuman sa inyo ay hindi malalaglag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa inyong pagkaligtas.” Ang salitang Griyego ay maaaring mangahulugang “kaligtasan,” “pagkaligtas,” o “pag-iingat”; sa kontekstong ito, tumutukoy ito sa pisikal na pananatiling buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kaya
  rationale: Likas na panandang Filipino sa konklusyong hinango mula sa naunang kalagayan at pakiusap.
- source_word: παρακαλῶ
  choice: hinihimok ko
  rationale: Ipinahahayag ang taimtim at mariing paghimok ni Pablo nang hindi nagiging labis na pormal.
- source_word: μεταλαβεῖν τροφῆς
  choice: kumain
  rationale: Ang parirala ay nangangahulugang kumuha ng pagkain o sustansiya; ang payak na 'kumain' ang pinakanatural sa modernong Tagalog.
- source_word: τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει
  choice: sapagkat kailangan ninyo ito upang maligtas
  rationale: Ipinakikita ng konteksto na ang σωτηρία ay pisikal na kaligtasan o pananatiling buhay. Natural sa Tagalog ang 'kailangan ... upang maligtas' at pinananatili nito ang ugnayan sa ideya ng pagliligtas.
- source_word: οὐδενὸς γὰρ ὑμῶν
  choice: ng sinuman sa inyo
  rationale: 'Pinananatili ang distributibong diwa: ang katiyakan ay para sa bawat isa sa kanila.'
- source_word: θρὶξ ἀπὸ τῆς κεφαλῆς
  choice: kahit isang buhok mula sa ulo
  rationale: Pinananatili ang kongkretong larawan at idiomatikong diin sa ganap na pisikal na kaligtasan.
- source_word: ἀπολεῖται
  choice: malalaglag
  rationale: Sa pagtukoy sa buhok, natural sa Tagalog ang 'malalaglag.' Ipinahahayag nito na wala ni isang buhok ang mawawala, nang hindi gumagamit ng di-likas na 'mapapahamak' para sa buhok.
theological_decisions:
- issue: Kahulugan ng σωτηρία sa konteksto
  choice: pisikal na pagkaligtas o pananatiling buhay
  alternative: espirituwal na kaligtasan
  rationale: Ang agarang konteksto ay ang panganib sa dagat at ang katiyakang mabubuhay ang lahat ng sakay. Gayunman, ang salitang 'maligtas' at ang talababa ay nagpapanatili sa mas malawak na saklaw ng salitang Griyego sa halip na lubusang burahin ang leksikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang 'hinihimok' upang mapanatili ang taimtim na tono, at 'kumain' sa halip na mas pormal at di-likas na parirala. Ang dobleng 'sapagkat' ay sumusunod sa dalawang γάρ ng Griyego at malinaw pa rin sa Tagalog.
