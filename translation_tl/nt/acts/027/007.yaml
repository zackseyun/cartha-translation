  source_fidelity: 'Tumpak sa kabuuan ang ruta at ugnayang sanhi: mabagal na paglalayag nang maraming araw, pagdating sa tapat ng Cnido nang may kahirapan, paghadlang ng hangin, at paglalayag sa kublihang panig ng Creta sa tapat ng Salmone. Gayunman, ang “hirap na hirap” ay mas matindi kaysa sa μόλις, na nagsasaad ng kahirapan o halos hindi pag-abot.'
  naturalness: Likas at malinaw ang karamihan ng salin. Mas tuwiran at mas mahinahon sa modernong Filipino ang “nahirapan kaming makarating” kaysa “hirap na hirap kaming nakarating.”
