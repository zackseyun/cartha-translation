  text: ἐν ἱκαναῖς δὲ ἡμέραις βραδυπλοοῦντες καὶ μόλις γενόμενοι κατὰ τὴν Κνίδον, μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου, ὑπεπλεύσαμεν τὴν Κρήτην κατὰ Σαλμώνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/007.yaml
  text: For many days we were sailing slowly[a], and with difficulty we came opposite Cnidus. Since the wind did not allow us to go farther, we sailed under the lee of Crete[b], off Salmone.
translation:
  language: tl
  text: Sa loob ng maraming araw ay mabagal kaming naglayag, at nahirapan kaming makarating sa tapat ng Cnido. Dahil hindi kami pinahintulutan ng hangin na magpatuloy,[a] naglayag kami sa panig ng Creta na kubli sa hangin,[b] sa tapat ng Salmone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “hindi kami pinahintulutan ng hangin na lumapit.” Hindi tahasang binabanggit sa Griyego ang kilos na hinadlangan.
    reason: lexical_alternative
  - marker: b
    text: Literal na, “naglayag kami sa ilalim ng Creta”—ibig sabihin, sa panig ng isla na protektado o kubli sa hangin.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἱκαναῖς δὲ ἡμέραις
  choice: Sa loob ng maraming araw
  rationale: Ipinahahayag ng parirala ang mahabang panahong lumipas habang nagpapatuloy ang mabagal na paglalayag.
- source_word: βραδυπλοοῦντες
  choice: mabagal ang paglalayag namin
  rationale: Pinananatili nito ang tahasang larawan ng paglalayag at hindi ito isinasama sa hiwalay na diwa ng μόλις.
- source_word: μόλις γενόμενοι κατὰ τὴν Κνίδον
  choice: hirap na hirap kaming nakarating sa tapat ng Cnido
  rationale: Ipinakikita ng μόλις ang matinding hirap, samantalang ang κατά sa kontekstong pandagat ay tumutukoy sa pagiging katapat ng pook.
- source_word: μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου
  choice: Dahil hindi kami pinahintulutan ng hangin na magpatuloy
  rationale: Ang genitive absolute ay nagbibigay ng dahilan sa pagbabago ng ruta; ang 'magpatuloy' ay likas na pagpapahayag ng ipinahihiwatig na hadlang sa kanilang pag-usad.
- source_word: ὑπεπλεύσαμεν τὴν Κρήτην
  choice: naglayag kami sa panig ng Creta na kubli sa hangin
  rationale: Sa gamit-pandagat, tumutukoy ito sa paglalayag sa protektado o leeward na panig ng isla.
- source_word: κατὰ Σαλμώνην
  choice: sa tapat ng Salmone
  rationale: Sa paglalarawan ng rutang pandagat, ang parirala ay tumutukoy sa kinalalagyan ng sasakyan sa dagat kaugnay ng baybaying palatandaan.
- source_word: Κνίδον / Κρήτην / Σαλμώνην
  choice: Cnido / Creta / Salmone
  rationale: Ginamit ang mga anyong madaling basahin sa Filipino at malapit sa tradisyonal na transliterasyon ng mga pangalang Griyego.
