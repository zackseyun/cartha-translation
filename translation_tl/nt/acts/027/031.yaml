source:
  edition: SBLGNT
  text: εἶπεν ὁ Παῦλος τῷ ἑκατοντάρχῃ καὶ τοῖς στρατιώταις· Ἐὰν μὴ οὗτοι μείνωσιν ἐν τῷ πλοίῳ, ὑμεῖς σωθῆναι οὐ δύνασθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/031.yaml
  text: Paul said to the centurion and the soldiers[a], “Unless these men remain in the ship, you cannot be saved.”
translation:
  language: tl
  text: Sinabi ni Pablo sa senturyon at sa mga sundalo, “Kung hindi mananatili sa barko ang mga lalaking ito, hindi kayo maliligtas.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makaliligtas.” Ang salitang Griyego ay nangangahulugang “maligtas”; dito, tumutukoy ito sa pisikal na pagkaligtas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: senturyon
  rationale: Karaniwang salin sa Filipino para sa ranggong militar na Romano; maikli at angkop sa makasaysayang konteksto.
- source_word: οὗτοι
  choice: ang mga lalaking ito
  rationale: Tumutukoy ang panghalip pamatlig sa mga mandaragat na nagtangkang umalis sa barko. Nilinaw ng “mga lalaki” ang tinutukoy nang hindi binabago ang diwa.
- source_word: μείνωσιν
  choice: mananatili
  rationale: Likas na katumbas ng μένω sa kondisyong babala at tumutukoy sa hindi pag-alis sa barko.
- source_word: πλοίῳ
  choice: barko
  rationale: Tumutukoy sa malaking sasakyang-dagat sa salaysay; mas tiyak at natural kaysa “bangka.”
- source_word: σωθῆναι
  choice: maliligtas
  rationale: Pinananatili ang malawak na saklaw ng pandiwang σῴζω, habang malinaw sa konteksto na pisikal na kaligtasan mula sa sakuna ang tinutukoy.
- source_word: οὐ δύνασθε
  choice: hindi kayo ...
  rationale: Ang “hindi kayo maliligtas” ay natural na Filipino na nagpapahayag ng kawalan ng kakayahan o posibilidad sa konstruksiyong ito.
theological_decisions:
- issue: Kung isasalin ang σωθῆναι sa tahasang pisikal na pananalita o sa mas malawak na salitang “maliligtas.”
  choice: maliligtas
  alternative: makaliligtas / maililigtas mula sa kapahamakan
  rationale: Pisikal na pagkaligtas sa bagyo at pagkawasak ng barko ang malinaw na diwa sa konteksto, hindi walang-hanggang kaligtasan. Gayunman, pinananatili ng “maliligtas” ang saklaw ng salitang Griyego at hinahayaang ang konteksto ang magtakda ng uri ng kaligtasan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “senturyon” bilang kinikilalang makasaysayang ranggo at “barko” para sa malaking sasakyang-dagat. Inilagay ang pananda ng talababa kaagad pagkatapos ng salitang tinutukoy.
