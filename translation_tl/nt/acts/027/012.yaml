  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀνευθέτου δὲ τοῦ λιμένος ὑπάρχοντος πρὸς παραχειμασίαν οἱ πλείονες ἔθεντο βουλὴν ἀναχθῆναι ⸀ἐκεῖθεν, εἴ πως δύναιντο καταντήσαντες εἰς Φοίνικα παραχειμάσαι, λιμένα τῆς Κρήτης βλέποντα κατὰ λίβα καὶ κατὰ χῶρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/012.yaml
  text: And because the harbor was unsuitable for wintering[a], the majority decided to put out from there[c][b], if somehow they might reach Phoenix and spend the winter there—a harbor of Crete facing southwest and northwest.
translation:
  language: tl
  text: Dahil hindi angkop ang daungan para magpalipas ng taglamig, nagpasiya ang nakararami na pumalaot mula roon[a], kung sakaling makarating sila sa Fenix[b] upang doon magpalipas ng taglamig. Ang Fenix ay isang daungan sa Creta na nakaharap sa timog-kanluran at hilagang-kanluran.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Griego ay terminong pandagat na nangangahulugang umalis sa daungan o maglayag patungo sa laot.
    reason: lexical_alternative
  - marker: b
    text: Ang Fenix ay isang daungan sa pulo ng Creta. Sa ilang salin, ang pangalan nito ay “Fenice” o “Phoenix.”
    reason: cultural_note
  - marker: c
    text: Mahirap tiyakin ang eksaktong kahulugan ng huling pariralang pandireksiyon. Karaniwan itong isinasaling “timog-kanluran at hilagang-kanluran”; maaaring mas tiyak na “kanluran-hilagang-kanluran” ang ikalawang direksiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνευθέτου
  choice: hindi angkop
  rationale: Tumutukoy ito sa pagiging hindi naaangkop ng daungan para sa layuning manatili roon sa panahon ng taglamig; natural at malinaw ang “hindi angkop” sa makabagong Tagalog.
- source_word: λιμένος
  choice: daungan
  rationale: Karaniwang salitang Tagalog ito para sa isang harbor o ligtas na himpilan ng mga sasakyang-dagat.
- source_word: πρὸς παραχειμασίαν
  choice: para magpalipas ng taglamig
  rationale: Malinaw nitong ipinahahayag ang layuning manatili sa isang lugar sa buong panahon ng taglamig.
- source_word: οἱ πλείονες
  choice: ang nakararami
  rationale: Tumpak nitong inilalarawan ang mas malaking bahagi ng pangkat nang hindi ipinapalagay kung sino-sino ang bumoto o nagpasiya.
- source_word: ἔθεντο βουλήν
  choice: nagpasiya
  rationale: Ang idyoma ay nagpapahiwatig ng pagbuo ng isang sama-samang pasiya; likas at tuwiran ang “nagpasiya.”
- source_word: ἀναχθῆναι ἐκεῖθεν
  choice: pumalaot mula roon
  rationale: Sa kontekstong pandagat, ang ἀνάγω ay nangangahulugang umalis sa daungan at magtungo sa laot.
- source_word: εἴ πως δύναιντο
  choice: sa pag-asang
  rationale: Natural nitong naihahatid sa Tagalog ang pinagsamang diwa ng pag-asa at kawalang-katiyakan sa εἴ πως kasama ng optative na δύναιντο.
- source_word: καταντήσαντες εἰς Φοίνικα
  choice: makarating sila sa Fenix
  rationale: Ang pandiwari ay tumutukoy sa pagdating sa nilalayong patutunguhan; “makarating” ay natural at pinananatili ang potensiyal na diwa ng pangungusap.
- source_word: Φοίνικα
  choice: Fenix
  rationale: Makabagong transliterasyong madaling basahin sa Filipino para sa pangalan ng daungan sa Creta, at hindi ito ipinagkakamali sa rehiyon ng Fenicia.
- source_word: παραχειμάσαι
  choice: doon magpalipas ng taglamig
  rationale: Pinananatili nito ang inilaang layunin ng paglalakbay at ang lokatibong diwa ng konteksto.
- source_word: βλέποντα
  choice: nakaharap
  rationale: Natural itong pananalita sa Filipino para sa heograpikong oryentasyon o bukana ng isang daungan.
- source_word: κατὰ λίβα καὶ κατὰ χῶρον
  choice: sa timog-kanluran at hilagang-kanluran
  rationale: Ito ang tradisyonal at malamang na kahulugan ng dalawang terminong pandireksiyon, habang inilalahad sa talababa ang tunay na kawalang-katiyakan sa ikalawang termino.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na may marangal ngunit madaling maunawaang himig. Ginamit ang “pumalaot” bilang likas na terminong pandagat, at hinati sa dalawang pangungusap ang mahabang kayariang Griego para sa kalinawan nang hindi binabago ang ugnayan ng mga ideya. Pinanatili sa talababa ang hindi tiyak na heograpikong direksiyon.
