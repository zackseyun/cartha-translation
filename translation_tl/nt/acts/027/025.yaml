  text: διὸ εὐθυμεῖτε, ἄνδρες· πιστεύω γὰρ τῷ θεῷ ὅτι οὕτως ἔσται καθ’ ὃν τρόπον λελάληταί μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/025.yaml
  text: Therefore[a], take courage, men, for I believe God that it will be just as it has been told to me.
translation:
  language: tl
  text: Kaya lakasan ninyo ang inyong loob, mga lalaki, sapagkat naniniwala ako sa Diyos[a]. Magiging gayon nga ang mangyayari, ayon sa sinabi sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagtitiwala ako sa Diyos.” Maaaring idiin ng pagkakabuo sa Griyego ang pagtitiwala sa Diyos o ang paniniwala sa sinabi niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kaya
  rationale: Malinaw at likas na nagpapakita ng kongklusyon mula sa naunang katiyakan at panghihikayat.
- source_word: εὐθυμεῖτε
  choice: lakasan ninyo ang inyong loob
  rationale: Likas na makabagong Tagalog na utos na magkaroon ng tapang at tiwala sa gitna ng panganib.
- source_word: ἄνδρες
  choice: mga lalaki
  rationale: Pinananatili ang tahasang panlalaking tawag sa mga kasama ni Pablo sa barko.
- source_word: πιστεύω τῷ θεῷ
  choice: naniniwala ako sa Diyos
  rationale: Naipahahayag ang personal na pagtitiwala kay Diyos at ang paniniwala sa sinabi niya; pinananatili sa talababa ang maaaring diin na 'nagtitiwala ako sa Diyos.'
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala ang nilalaman ng paniniwala ni Pablo, hindi ang dahilan nito.
- source_word: οὕτως ἔσται καθ’ ὃν τρόπον
  choice: mangyayari ang lahat ayon sa
  rationale: Natural na Filipino para sa eksaktong pagtutugma ng mangyayari sa paraang ipinahayag; ang 'ang lahat' ay tumutukoy sa mga bagay na sinabi sa naunang mensahe.
- source_word: λελάληταί μοι
  choice: sinabi niya sa akin
  rationale: Likas na aktibong pagpapahayag sa Filipino ng banal na mensaheng sinabi kay Pablo; ang Diyos ang malinaw na tagapagsalita mula sa konteksto.
theological_decisions:
- issue: Pagpapakahulugan sa πιστεύω τῷ θεῷ
  choice: naniniwala ako sa Diyos
  alternative: nagtitiwala ako sa Diyos; naniniwala ako sa sinabi ng Diyos
  rationale: Maaaring idiin ng konstruksiyong Griyego ang pagtitiwala mismo sa Diyos o ang paniniwala sa kanyang sinabi. Pinananatili ng pangunahing salin ang dalawang ugnay na diwa hangga't maaari, at inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang idyomang “lakasan ang loob” at pinanatili ang panlalaking tawag na “mga lalaki.”
