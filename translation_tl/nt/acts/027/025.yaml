    issue: Idinagdag ang “ang lahat.”
    rationale: Walang katumbas ang “lahat” sa οὕτως ἔσται καθ’ ὃν τρόπον; ang teksto ay nagsasabing magiging gayon ang mangyayari, ayon sa sinabi kay Pablo.
  - severity: low
    issue: Ginawang tahasan ang Diyos bilang nagsalita sa pamamagitan ng “sinabi niya.”
    rationale: Ang λελάληταί μοι ay passive na “sinabi/ipinahayag sa akin.” Bagaman Diyos ang malinaw na pinagmulan sa konteksto, mas tapat na huwag magdagdag ng panghalip na wala sa talata.
