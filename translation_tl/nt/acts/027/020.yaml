  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μήτε δὲ ἡλίου μήτε ἄστρων ἐπιφαινόντων ἐπὶ πλείονας ἡμέρας, χειμῶνός τε οὐκ ὀλίγου ἐπικειμένου, λοιπὸν περιῃρεῖτο ⸂ἐλπὶς πᾶσα⸃ τοῦ σῴζεσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/020.yaml
  text: And when neither sun nor stars appeared for many days[a], and no small storm was pressing on us, from then on all hope of our being saved was gradually taken away.
translation:
  language: tl
  text: Nang hindi nagpakita ang araw ni ang mga bituin sa loob ng maraming araw, at habang patuloy na humahagupit ang matinding bagyo, mula noon ay unti-unting nawala ang lahat ng pag-asa naming maliligtas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makaligtas.” Ang pandiwang Griyego ay maaaring mangahulugang “maligtas” o “makaligtas”; dito, tumutukoy ito sa pisikal na pagkaligtas mula sa bagyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφαινόντων
  choice: nagpakita
  rationale: Ipinahihiwatig ng pandiwari na hindi nakita o nasilayan ang mga bagay sa langit; natural ang “nagpakita” at hindi nito labis na binibigyang-diin ang kanilang liwanag.
- source_word: ἐπὶ πλείονας ἡμέρας
  choice: sa loob ng maraming araw
  rationale: Malinaw at likas itong pagpapahayag ng mahabang panahong tinutukoy ng pariralang Griyego.
- source_word: χειμῶνός
  choice: bagyo
  rationale: Sa kontekstong pandagat, tumutukoy ito sa mabagyong panahon, hindi sa panahon ng taglamig.
- source_word: οὐκ ὀλίγου
  choice: matinding
  rationale: Ang literal na litotes na “hindi maliit” ay magiging pilit sa Tagalog; natural na naihahatid ng “matinding” ang diin nito.
- source_word: ἐπικειμένου
  choice: patuloy na humahagupit
  rationale: Inilalarawan nito ang bagyong patuloy na dumidiin o nananalasa; ipinananatili ng “patuloy” ang duratibong aspekto ng pandiwari.
- source_word: λοιπὸν
  choice: unti-unting
  rationale: Kasama ng imperpektong περιῃρεῖτο, ipinakikita nito ang sumunod at nagpapatuloy na pagkawala ng pag-asa. Sa natural na Tagalog, ipinahahayag ito sa progresibong “unti-unting naglaho.”
- source_word: περιῃρεῖτο
  choice: naglaho
  rationale: Ang imperpektong pasibo ay nagpapakita ng pag-asang patuloy na inaalis o nawawala; natural na naihahatid ito ng “unti-unting naglaho.”
- source_word: ἐλπὶς πᾶσα
  choice: lahat ng pag-asa
  rationale: Pinananatili nito ang kabuuang saklaw ng πᾶσα at natural sa modernong Tagalog.
- source_word: τοῦ σῴζεσθαι ἡμᾶς
  choice: pag-asa naming maliligtas
  rationale: Ipinahahayag nito ang nilalaman ng kanilang pag-asa at pinananatili ang malawak na saklaw ng σῴζω, habang nililinaw ng konteksto na pisikal na kaligtasan ang tinutukoy.
theological_decisions:
- issue: Kahulugan ng σῴζεσθαι sa salaysay tungkol sa panganib sa dagat
  choice: Pisikal na pagkaligtas mula sa kamatayan sa dagat, isinaling “maliligtas”
  alternative: “makaligtas” o “mailigtas”
  rationale: Ang agarang konteksto ay bagyo, pagkawasak ng barko, at pananatiling buhay, kaya pisikal na pagliligtas ang tinutukoy at hindi espirituwal na kaligtasan. Gayunman, pinananatili ng “maliligtas” ang karaniwang leksikal na ugnayan sa ideya ng pagliligtas.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “ni” sa tambalang negatibong “hindi … ni …,” at ang natural na “matinding bagyo” sa halip na literal ngunit pilit na “hindi maliit na bagyo.”
