base_translation:
  language: en
  yaml_path: translation/nt/acts/027/038.yaml
  text: And when they had eaten enough[c][b][a], they began to lighten the ship by throwing the wheat into the sea.
translation:
  language: tl
  text: Matapos silang mabusog sa pagkain[a], sinimulan nilang pagaanin ang barko[b] sa pamamagitan ng pagtatapon ng trigo[c] sa dagat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matapos silang mapuno ng pagkain” o “nang makakain na sila nang sapat.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pinapagaan nila ang barko” o “pinagaan nila ang barko.” Maaaring idiin ng imperfect sa Griyego ang nagpapatuloy na proseso o ang pagsisimula ng kilos.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “butil.” Mas malawak ang maaaring kahulugan ng salitang Griyego, ngunit malamang na trigo ang tinutukoy rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: κορεσθέντες … τροφῆς
  choice: matapos silang mabusog sa pagkain
  rationale: Ipinapahayag ng aorist passive participle ang pagkabusog o pagkapuno dahil sa pagkain; likas sa modernong Tagalog ang temporal na pariralang “matapos silang mabusog sa pagkain.”
- source_word: δὲ
  choice: matapos
  rationale: Ang δέ ay banayad na pang-ugnay na nagpapatuloy sa salaysay; hindi na ito isinalin nang hiwalay sapagkat natural nang naipapakita ng temporal na pagbubukas ang pag-usad ng pangyayari.
- source_word: ἐκούφιζον
  choice: sinimulan nilang pagaanin
  rationale: Maaaring ipahiwatig ng imperfect ang nagpapatuloy o nagsisimulang kilos. Pinili ang inceptive na diwa, habang itinatala sa talababa ang ibang posibleng pagbasa.
- source_word: τὸ πλοῖον
  choice: ang barko
  rationale: Ang “barko” ang karaniwan at angkop na salitang Tagalog para sa malaking sasakyang-dagat sa kontekstong ito.
- source_word: ἐκβαλλόμενοι
  choice: sa pamamagitan ng pagtatapon
  rationale: Ipinakikita ng participle kung paano nila pinagaan ang barko; malinaw at natural sa Tagalog ang pariralang nagsasaad ng paraan.
- source_word: τὸν σῖτον
  choice: ang trigo
  rationale: Karaniwang tumutukoy ang σῖτος sa trigo, bagaman maaari rin itong tumukoy nang mas malawak sa butil; pinanatili sa pangunahing teksto ang mas tiyak na kahulugan.
- source_word: εἰς τὴν θάλασσαν
  choice: sa dagat
  rationale: Direkta at natural na katumbas ito ng pariralang nagsasaad ng direksiyon patungo sa dagat.
theological_decisions: []
