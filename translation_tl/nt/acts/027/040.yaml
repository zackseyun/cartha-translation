id: ACT.27.40
reference: Acts 27:40
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὰς ἀγκύρας περιελόντες εἴων εἰς τὴν θάλασσαν, ἅμα ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων, καὶ ἐπάραντες τὸν ἀρτέμωνα τῇ πνεούσῃ κατεῖχον εἰς τὸν αἰγιαλόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/040.yaml
  text: And after casting off the anchors[a], they left them in the sea; at the same time loosening the ropes of the rudders, and hoisting the foresail to the wind[b], they made for the beach.
translation:
  language: tl
  text: Kinalag nila ang mga angkla at iniwan ang mga iyon sa dagat. Kasabay nito, kinalagan nila ang mga tali ng mga timon, itinaas sa hangin ang layag sa unahan[a], at tumungo sa dalampasigan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “layag sa tuktok”; hindi tiyak kung anong eksaktong uri ng layag ang tinutukoy ng salitang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελόντες
  choice: kinalag
  rationale: Sa kontekstong pandagat, tumutukoy ito sa pag-aalis o pagpapakawala sa mga angkla; ang “kinalag” ay natural at hindi nagdaragdag ng ideyang pinutol ang mga ito.
- source_word: ἀγκύρας
  choice: mga angkla
  rationale: Karaniwang makabagong salin ng tuwirang terminong pandagat.
- source_word: εἴων εἰς τὴν θάλασσαν
  choice: iniwan ang mga iyon sa dagat
  rationale: Malinaw na ang tinutukoy ay ang mga angklang pinakawalan at tuluyang iniwan.
- source_word: ἅμα
  choice: kasabay nito
  rationale: Pinananatili ang sabayang ugnayan ng mga kilos.
- source_word: ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων
  choice: kinalagan nila ang mga tali ng mga timon
  rationale: Ang bihirang terminong ζευκτηρίας ay tumutukoy sa mga panali o pangkabit na humahawak sa aparatong panimon; malinaw at natural sa Filipino ang “mga tali.”
- source_word: ἐπάραντες
  choice: itinaas
  rationale: Tuwirang inilalarawan ang pagtaas ng layag nang hindi gumagamit ng di-pamilyar na teknikal na salita.
- source_word: ἀρτέμωνα
  choice: layag sa unahan
  rationale: Hindi tiyak kung anong eksaktong layag ang tinutukoy ng bihirang terminong pandagat; inilalarawan ng saling ito ang malamang na lokasyon nito nang hindi labis na nagpapasiya.
- source_word: τῇ πνεούσῃ
  choice: sa hangin
  rationale: Natural na Filipino para sa pagtaas o paghaharap ng layag sa umiihip na hangin.
- source_word: κατεῖχον εἰς τὸν αἰγιαλόν
  choice: tumungo sa dalampasigan
  rationale: Ipinahahayag ang pandagat na diwang naglayag o nagpakanlong sila sa direksiyon ng mismong tabing-dagat.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod at magkakasabay na mga kilos sa salaysay. Hindi isinama ang footnote ng English consultation layer tungkol sa mga tali ng timon sa marker ng “mga angkla,” sapagkat mali ang pagkakaugnay nito; sa Griyego, malinaw ang “mga angkla,” samantalang ang bihirang terminong ζευκτηρίας ang tumutukoy sa mga tali o pangkabit ng mga timon.
