  yaml_path: translation/nt/acts/027/033.yaml
  text: Until the day was about to dawn[a], Paul kept urging them all to take some food, saying, “Today is the fourteenth day that you have continued in suspense without eating, having taken nothing.”
translation:
  language: tl
  text: Hanggang sa malapit nang magbukang-liwayway, patuloy na hinihimok ni Pablo ang lahat na kumain. Sinabi niya, “Ngayon ang ikalabing-apat na araw na patuloy kayong naghihintay nang balisa[a] at hindi kumakain; wala kayong naisusubo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naghihintay”; maaaring tumukoy ang salitang Griyego sa simpleng paghihintay, bagaman sa konteksto ng bagyo ay malamang na may diwa ito ng pagkabalisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄχρι δὲ οὗ ἡμέρα ἤμελλεν γίνεσθαι
  choice: Habang papalapit ang bukang-liwayway
  rationale: Natural na Tagalog para sa panahong humahantong sa nalalapit na pagsikat ng araw; pinananatili ang temporal na ugnayan nang hindi gumagamit ng alanganing literal na anyo.
- source_word: παρεκάλει
  choice: patuloy na hinimok
  rationale: Ipinahahayag ang patuloy o paulit-ulit na kilos ng imperfect at ang mariing pakiusap sa konteksto.
- source_word: ἅπαντας μεταλαβεῖν τροφῆς
  choice: ang lahat na kumain
  rationale: Malinaw at likas na salin ng pagkuha ng pagkain; ang “lahat” ay sumasaklaw sa lahat ng sakay.
- source_word: Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν
  choice: Labing-apat na araw na
  rationale: Karaniwang modernong Tagalog na naghahatid sa diwang ang kasalukuyang araw ang ikalabing-apat.
- source_word: προσδοκῶντες
  choice: naghihintay nang balisa
  rationale: Pinananatili ang batayang diwa ng paghihintay habang ipinahihiwatig ang balisang kalagayan sa gitna ng bagyo; itinatala sa talababa ang mas neutral na posibilidad.
- source_word: ἄσιτοι διατελεῖτε
  choice: hindi kumakain
  rationale: Hindi ginamit ang “nag-aayuno,” na maaaring magpahiwatig ng kusang gawaing panrelihiyon; malinaw na tumutukoy sa patuloy na hindi pagkain.
- source_word: μηθὲν προσλαβόμενοι
  choice: wala kayong naisubo
  rationale: Likas na idyomang Tagalog para sa hindi pagkain ng anuman at pinananatili ang mariing pag-uulit ng Griyego.
