  to: Hanggang sa malapit nang magbukang-liwayway, patuloy na hinihimok ni Pablo ang lahat na kumain. Sinabi niya, “Ngayon ang ikalabing-apat na araw na patuloy kayong naghihintay nang balisa[a] at hindi kumakain; wala kayong naisusubo.”
