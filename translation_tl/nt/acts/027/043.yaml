base_translation:
  language: en
  yaml_path: translation/nt/acts/027/043.yaml
  text: But the centurion[a], wanting to save Paul, kept them from their plan, and ordered those who were able to swim to jump overboard first and get to land[b],
translation:
  language: tl
  text: Ngunit ang senturyon, dahil nais niyang iligtas si Pablo, ay pinigilan sila sa kanilang balak. Iniutos niyang ang mga marunong lumangoy ay maunang tumalon mula sa barko at makarating sa lupa[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pagkatapon nila ng kanilang sarili, sila ang mauunang pumunta sa lupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: senturyon
  rationale: Ang “senturyon” ang kinikilalang makabagong katawagan sa opisyal ng hukbong Romano at mas tiyak kaysa sa pagpapaliwanag na “pinuno ng sandaang kawal.”
- source_word: βουλόμενος διασῶσαι τὸν Παῦλον
  choice: sapagkat nais niyang iligtas si Pablo
  rationale: Ipinahahayag ng participle ang hangarin ng senturyon; ang “sapagkat” ay likas na nagpapakita ng ugnayang dahilan sa Filipino nang hindi dinaragdagan ang diwa.
- source_word: ἐκώλυσεν αὐτοὺς τοῦ βουλήματος
  choice: pinigilan sila ... sa balak nila
  rationale: Tumutukoy ito sa pagpigil sa mga kawal na isagawa ang balak na binanggit sa naunang talata.
- source_word: ἐκέλευσέν τε
  choice: Iniutos niyang
  rationale: Malinaw at natural na katumbas ng utos na ibinigay ng nakatataas na opisyal.
- source_word: τοὺς δυναμένους κολυμβᾶν
  choice: ang mga marunong lumangoy
  rationale: Karaniwang paraan sa modernong Filipino upang tukuyin ang mga may kakayahang lumangoy.
- source_word: ἀπορίψαντας πρώτους
  choice: ang maunang tumalon mula sa barko
  rationale: Ipinahahayag ang literal na pagtatapon ng sarili mula sa sasakyan at ang pagkakasunod-sunod; tahasang binanggit ang barko ayon sa malinaw na konteksto.
- source_word: ἐπὶ τὴν γῆν ἐξιέναι
  choice: pumunta sa lupa
  rationale: Pinananatili ang direksiyonal na diwa patungo sa tuyong lupa at iniiwasang ipalagay na tiyak nang narating nila iyon.
