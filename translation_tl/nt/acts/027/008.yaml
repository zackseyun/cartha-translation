  yaml_path: translation/nt/acts/027/008.yaml
  text: And with difficulty coasting along it[a], we came to a certain place called Fair Havens, near which was a city named Lasea.
translation:
  language: tl
  text: At sa kabila ng hirap sa paglalayag namin sa kahabaan ng baybayin nito,[a] nakarating kami sa isang lugar na tinatawag na Magagandang Daungan. Malapit dito ang isang lungsod na Lasea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “bahagya kaming nakapaglayag sa kahabaan ng baybayin nito.” Ang salitang Griyego na παραλεγόμενοι ay terminong pandagat para sa paglalayag sa kahabaan ng baybayin.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόλις
  choice: hirap na hirap
  rationale: Ipinahahayag nito na naisagawa lamang ang paglalayag nang may matinding hirap; natural at malinaw ito sa makabagong Tagalog.
- source_word: τε
  choice: At
  rationale: Iniuugnay nito ang pangungusap sa naunang salaysay nang hindi labis na binibigyang-diin ang partikula.
- source_word: παραλεγόμενοι
  choice: naglalayag sa kahabaan ng baybayin
  rationale: Tiyak na naipakikita ang pandagat na diwa ng paglalayag nang malapit at kahilera ng baybayin.
- source_word: αὐτήν
  choice: nito
  rationale: Pinananatili ang panghalip ng Griyego, na tumutukoy sa Creta sa naunang konteksto, sa halip na tahasang palitan ng pangalan ang tinutukoy.
- source_word: ἤλθομεν
  choice: nakarating kami
  rationale: Natural na salin ng pandiwa ng paggalaw sa konteksto ng pagdating sa isang destinasyon.
- source_word: εἰς τόπον τινά
  choice: sa isang lugar
  rationale: Pinananatili ang pagiging di-tiyak ng τινά sa natural na Tagalog.
- source_word: καλούμενον
  choice: tinatawag na
  rationale: Karaniwang pananalita sa pagpapakilala ng pangalan ng isang lugar.
- source_word: Καλοὺς Λιμένας
  choice: Magagandang Daungan
  rationale: Isinasalin ang makahulugang pangalang Griyego sa malinaw na Tagalog; ang maramihang anyo ng Λιμένας ay pinananatili sa “Daungan.”
- source_word: ᾧ ἐγγὺς ἦν πόλις Λασαία
  choice: na malapit sa lungsod ng Lasea
  rationale: Natural na Tagalog na nagpapanatili sa ugnayang heograpikal; hindi kailangang gawing tahasang tiyak o di-tiyak ang πόλις sapagkat hindi ito likas na minamarkahan sa Tagalog.
