revisions:
- from: At habang hirap na hirap kaming naglalayag sa kahabaan ng baybayin nito,[a] nakarating kami sa isang lugar na tinatawag na Magagandang Daungan, na malapit sa lungsod ng Lasea.
  to: At sa kabila ng hirap sa paglalayag namin sa kahabaan ng baybayin nito,[a] nakarating kami sa isang lugar na tinatawag na Magagandang Daungan. Malapit dito ang isang lungsod na Lasea.
  rationale: Inayos ang ayos ng pangungusap upang malinaw na ang Lasea ay isang lungsod na malapit sa Magagandang Daungan, at hindi lamang isang tiyak na lungsod na pinagmumodipikahan ng naunang pangngalan. Ginawang mas idiomatiko ang pagpapahayag ng μόλις at ng pandagat na participle, habang pinananatili ang hirap, ang paglalayag sa tabi ng baybayin ng Creta, ang pagiging di-tiyak ng “isang lugar” at “isang lungsod,” at ang mga pangalan ng lugar.
