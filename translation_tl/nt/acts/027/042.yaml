  yaml_path: translation/nt/acts/027/042.yaml
  text: The soldiers’ plan was to kill the prisoners, so that no one might swim away and escape.
translation:
  language: tl
  text: Nagbalak naman ang mga kawal na patayin ang mga bilanggo, baka may makalangoy palayo at makatakas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν δὲ στρατιωτῶν βουλὴ ἐγένετο
  choice: Nagpasya naman ang mga kawal
  rationale: Natural na ipinahahayag sa Tagalog ang literal na ideyang ‘nagkaroon ng balak ang mga kawal’; ang δέ ay banayad na paglipat o pagsalungat kaya isinalin bilang ‘naman.’
- source_word: τοὺς δεσμώτας
  choice: ang mga bilanggo
  rationale: Sa konteksto, tumutukoy ito sa mga taong nakagapos o nasa kustodiya; ‘mga bilanggo’ ang malinaw at karaniwang tawag.
- source_word: ἀποκτείνωσιν
  choice: patayin
  rationale: Tuwirang katumbas ng layuning kitilin ang buhay.
- source_word: μή τις ἐκκολυμβήσας διαφύγῃ
  choice: upang walang makalangoy palayo at makatakas
  rationale: 'Pinananatili ang negatibong layunin ng μή at ang dalawang kaugnay na kilos: paglangoy palayo mula sa sakuna at tuluyang pagtakas.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignipikado, at natural. Ginamit ang ‘kawal’ para sa makasaysayang konteksto at ‘naman’ upang banayad na katawanin ang δέ nang hindi nagdaragdag ng tahasang panandang-panahon.
