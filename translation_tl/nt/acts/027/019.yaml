  yaml_path: translation/nt/acts/027/019.yaml
  text: And on the third day they threw the ship’s gear overboard with their own hands[a].
translation:
  language: tl
  text: Noong ikatlong araw, itinapon nila sa dagat ang mga kagamitan ng barko gamit ang sarili nilang mga kamay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sila mismo ang nagtapon ng mga kagamitan ng barko.”
    reason: Ipinapakita ang alternatibong idiomatikong pagpapahayag ng αὐτόχειρες, na maaaring idiin ang mga gumagawa (“sila mismo”) sa halip na ang literal na paraan (“gamit ang sarili nilang mga kamay”).
lexical_decisions:
- source_word: τῇ τρίτῃ
  choice: nang ikatlong araw
  rationale: Ang datibong may ordinal ay panandang panahunan. Likas sa modernong Tagalog ang “nang ikatlong araw” at malinaw nitong ipinahahayag ang ipinahihiwatig na “araw.”
- source_word: αὐτόχειρες
  choice: sa pamamagitan ng sarili nilang mga kamay
  rationale: Pinananatili nito ang mariing diwa na ang mga sakay mismo ang gumawa ng mabigat na pagtatapon, at hindi lamang sila ang nag-utos nito.
- source_word: τὴν σκευὴν τοῦ πλοίου
  choice: ang mga kagamitan ng barko
  rationale: Sa kontekstong pandagat, ang σκευή ay tumutukoy sa kagamitan ng barko. Ang maramihang “mga kagamitan” ay natural sa Tagalog bilang kolektibong katumbas ng isahang pangngalang Griyego.
- source_word: ἔρριψαν
  choice: itinapon nila sa dagat
  rationale: Ang pandiwa ay nangangahulugang “itinapon.” Ginagawang hayag ng “sa dagat” ang direksiyong likas sa konteksto ng pagtatapon mula sa barko, nang hindi binabago ang kilos.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang “barko” at “mga kagamitan” bilang karaniwang salitang madaling maunawaan; pinanatili ang diin ng αὐτόχειρες sa pangunahing teksto.
