  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐκρίθη τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν, παρεδίδουν τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ σπείρης Σεβαστῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/001.yaml
  text: When it was decided that we should sail for Italy[a], they handed over both Paul and some other prisoners to a centurion named Julius, of the Augustan Cohort.
translation:
  language: tl
  text: Nang mapagpasyahang maglayag kami patungong Italia, ipinaubaya nila si Pablo at ang ilan pang bilanggo sa isang senturyon na nagngangalang Julio, na kabilang sa Kohortang Augusta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kohortang Imperyal” o “kohorta ng Sebaste.” Ang Griegong Σεβαστῆς ay kaugnay ng titulong Augustus o ng emperador, ngunit hindi tiyak ang eksaktong makasaysayang yunit na tinutukoy.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς δὲ ἐκρίθη
  choice: Nang mapagpasiyahan
  rationale: Ipinahahayag ng aorist passive ang isang pasiyang ginawa nang hindi tinutukoy kung sino ang nagpasiya. Likas sa modernong Tagalog ang “mapagpasiyahan,” at ang “nang” ay maayos na nag-uugnay sa kasunod na pangyayari.
- source_word: τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν
  choice: na maglayag kami patungong Italia
  rationale: Ang articular infinitive ang nilalaman ng pasiya. Pinananatili ng “maglayag” ang tiyak na paglalakbay sa dagat at ng “kami” ang unang-panauhang pagsasalaysay.
- source_word: παρεδίδουν
  choice: ibinigay nila ... sa pangangalaga
  rationale: Sa konteksto, tumutukoy ito sa pormal na paglilipat ng kustodiya. Mas malinaw sa karaniwang Tagalog ang buong pariralang ito kaysa sa literal ngunit maaaring malabong “ipinaubaya.”
- source_word: τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας
  choice: si Pablo at ang ilan pang bilanggo
  rationale: Natural na naipahahayag sa Tagalog ang τε...καί sa pamamagitan ng “si ... at ang ...”; ang “ilan pang bilanggo” ay tumpak at madaling maunawaan.
- source_word: ἑκατοντάρχῃ
  choice: isang senturyon
  rationale: Ang dative ang tumutukoy sa tumanggap ng mga bilanggo. Ang “isang” ay angkop sapagkat dito pa lamang ipinakikilala ang opisyal; pinananatili ng “senturyon” ang tiyak na ranggong Romano.
- source_word: ὀνόματι Ἰουλίῳ
  choice: na nagngangalang Julio
  rationale: Ito ang natural at marangal na Tagalog para sa pormulang nagpapakilala ng pangalan.
- source_word: σπείρης Σεβαστῆς
  choice: na kabilang sa Pangkat Augusta
  rationale: Ang σπεῖρα ay isang yunit militar na karaniwang tinutumbasan ng cohort, samantalang ang Σεβαστή ay maaaring opisyal na pantanging tawag na kaugnay ni Augustus o ng emperador. Pinananatili ng “Augusta” ang anyong pantangi at ang kawalang-katiyakan sa eksaktong makasaysayang yunit, na nililinaw sa talababa.
theological_decisions:
- issue: Ang makasaysayang katawagang militar na σπείρης Σεβαστῆς
  choice: Pangkat Augusta
  alternative: Pangkat ng Emperador; Kohortang Augusta; pangkat mula sa Sebaste
  rationale: Hindi ito usaping doktrinal ngunit may tunay na leksikal at makasaysayang kalabuan. Ang “Pangkat Augusta” ay nababasa bilang pangalan ng yunit nang hindi tiyak na ipinapakahulugang ito ay imperyal o nagmula sa Sebaste; inilalahad sa talababa ang mga posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “Italia” bilang karaniwang anyong Filipino ng pangalan ng bansa, “Julio” bilang natural na anyong Tagalog ng Julius, at “senturyon” upang mapanatili ang tiyak na ranggong Romano. Ang marker na [a] ay nasa pangunahing teksto at tumutugma sa talababa.
