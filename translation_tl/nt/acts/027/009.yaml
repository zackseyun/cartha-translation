base_translation:
  language: en
  yaml_path: translation/nt/acts/027/009.yaml
  text: Since considerable time had passed and the voyage was already dangerous[a], because even the Fast had already gone by, Paul was advising them[b],
translation:
  language: tl
  text: Nakalipas ang mahabang panahon, at mapanganib na ang paglalayag[a] dahil nakalipas na rin ang Pag-aayuno[b]; kaya nagpapayo si Pablo sa kanila,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “alanganin na ang paglalayag.”
    reason: lexical_alternative
  - marker: b
    text: Malamang na tumutukoy ito sa pag-aayuno sa Araw ng Pagtubos, ang taunang pag-aayuno ng mga Judio. Hudyat din ng panahong ito na lalong nagiging mapanganib ang paglalayag sa dagat.
    reason: cultural_note
lexical_decisions:
- source_word: Ἱκανοῦ ... χρόνου διαγενομένου
  choice: Mahabang panahon na ang lumipas
  rationale: Ipinapahayag ng pariralang Griyego na malaking panahon na ang nagdaan. Likas sa makabagong Tagalog ang ganitong ayos at hindi nito pinalalabis ang tiyak na haba ng pagkaantala.
- source_word: ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς
  choice: mapanganib na ang paglalayag
  rationale: Ang ἐπισφαλής ay tumutukoy sa pagiging mapanganib o alanganin, at ang πλοῦς dito ay ang paglalakbay sa dagat o gawain ng paglalayag, hindi ang barko mismo.
- source_word: διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι
  choice: dahil lumipas na maging ang Pag-aayuno
  rationale: Pinananatili ng “dahil” ang malinaw na ugnayang sanhi, ng “lumipas na” ang ganap nang pagdaan nito, at ng “maging” ang diin ng καί. Ginawang pantanging katawagan ang “Pag-aayuno” sapagkat malamang na tumutukoy ito sa kilalang taunang pag-aayuno ng mga Judio.
- source_word: παρῄνει
  choice: pinayuhan sila
  rationale: Ang pandiwa ay maaaring mangahulugang magpayo o manghikayat. Ang “pinayuhan sila” ay malinaw at hindi nagdaragdag ng mas matinding diwa ng pagbabala kaysa sa mismong salita.
