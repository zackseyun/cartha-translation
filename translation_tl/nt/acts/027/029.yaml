  naturalness: May kaunting kabigatan ang “At dahil natatakot silang.” Mas natural at tuwiran ang “Sa takot nila na baka…”. Ang “mag-umaga na” ay natural na Filipino para sa ideyang maging araw na, nang hindi labis na nililimitahan sa mismong bukang-liwayway.
  terminology: Ang “hulihan ng barko” at “angkla” ay malinaw at angkop. Pinalitan ang “matatarik na batuhan” sa talababa dahil ang τραχεῖς ay “magaspang, mabato, o masukal na mapanganib,” hindi partikular na “matatarik.”
