  text: φοβούμενοί τε ⸂μή που κατὰ⸃ τραχεῖς τόπους ἐκπέσωμεν ἐκ πρύμνης ῥίψαντες ἀγκύρας τέσσαρας ηὔχοντο ἡμέραν γενέσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/029.yaml
  text: And fearing that we might run aground on rocky places[b][a], they dropped four anchors from the stern and prayed for day to come.
translation:
  language: tl
  text: Sa takot nila na baka sumadsad kami sa mga mabatong lugar[a], naghulog sila ng apat na angkla mula sa hulihan ng barko at nanalangin silang mag-umaga na.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “baka matangay kami patungo sa magagaspang na batuhan” o “baka sumadsad kami sa magagaspang na lugar.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “nanalangin silang maging araw na”; ibig sabihin, hinangad nilang dumating ang liwanag ng araw.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβούμενοί
  choice: dahil natatakot silang
  rationale: Ipinapahayag ng participle ang takot bilang dahilan ng sumunod nilang ginawa; natural sa Tagalog ang sugnay na may “dahil” habang napapanatili ang ugnayang ito.
- source_word: μή που κατὰ τραχεῖς τόπους ἐκπέσωμεν
  choice: baka mapadpad kami sa mababatong lugar
  rationale: Ipinahihiwatig ng parirala ang pangambang matangay o mapunta ang barko sa mapanganib at magaspang na bahagi ng baybayin o mga batuhan. Pinananatili ng “kami” ang unang panauhang maramihan ng ἐκπέσωμεν, na kabilang ang tagapagsalaysay.
- source_word: ἐκ πρύμνης
  choice: mula sa hulihan ng barko
  rationale: Tiyak na tumutukoy ang πρύμνα sa stern; mas madaling maunawaan ng karaniwang mambabasa ang “hulihan ng barko” kaysa sa teknikal na “popa.”
- source_word: ῥίψαντες ἀγκύρας τέσσαρας
  choice: naghulog sila ng apat na angkla
  rationale: Natural na paglalarawan ito sa Tagalog ng pagpapababa o paghahagis ng mga angkla at ipinapakitang nauna ang kilos na ito sa pananalangin.
- source_word: ηὔχοντο
  choice: nanalangin silang
  rationale: Maaaring mangahulugan ang εὔχομαι ng manalangin o humiling. Sa kontekstong ito, ang “nanalangin” ay matibay na posibilidad at kaayon ng aspektong patuloy ng imperfect, nang hindi dinaragdagan ang nilalaman ng kanilang panalangin.
- source_word: ἡμέραν γενέσθαι
  choice: magbukang-liwayway na
  rationale: Natural nitong ipinahahayag ang literal na ideyang “maging araw na,” ibig sabihin, dumating na ang liwanag ng umaga.
theological_decisions:
- issue: Kung ang ηὔχοντο ay tahasang panalangin o pagnanais lamang
  choice: nanalangin
  alternative: hiniling o inasam
  rationale: Karaniwang saklaw ng pandiwa ang pananalangin, ngunit may leksikal na posibilidad ding simpleng pagnanais; kaya hindi tinutukoy kung kanino nakatuon ang panalangin at itinatala sa talababa ang alternatibo.
translation_notes:
  register: Makabago at malinaw na Filipino na may marangal na himig. Ginamit ang karaniwang “hulihan ng barko” sa halip na teknikal na “popa,” ngunit pinanatili ang “angkla” bilang pamilyar na terminong pandagat. Ang “kami” ay sadyang pinanatili upang sundin ang unang panauhang maramihan sa Griyego, samantalang “sila” ang gumagawa ng mga pangunahing kilos.
