revisions:
- from: At dahil natatakot silang baka mapadpad kami sa mababatong lugar[a], naghulog sila ng apat na angkla mula sa hulihan ng barko at nanalangin silang magbukang-liwayway na.[b]
  to: Sa takot nila na baka sumadsad kami sa mga mabatong lugar[a], naghulog sila ng apat na angkla mula sa hulihan ng barko at nanalangin silang mag-umaga na.[b]
  rationale: Ginawang “sumadsad” ang pangunahing pandiwang pandagat upang maipahayag ang panganib na tinutukoy ng ἐκπέσωμεν. Pinakinis ang pambungad na sugnay para sa natural na modernong Filipino. Iniwasan sa talababa ang “matatarik,” na hindi tahasang ipinahihiwatig ng Griyego. Pinanatili ang “kami” para sa unang panauhang maramihan ng pinangangambahang mangyari, at ang “sila” para sa kasunod na mga kilos, gaya ng nasa salaysay.
