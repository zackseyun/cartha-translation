  yaml_path: translation/nt/acts/027/037.yaml
  text: There were 276 persons in the ship in all[a].
translation:
  language: tl
  text: Lahat-lahat, 276 katao kami sa barko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na ayos: “Lahat-lahat, 276 kaluluwa kami sa barko.” Ang “kaluluwa” rito ay nangangahulugang “tao,” hindi partikular na di-materyal na kaluluwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμεθα
  choice: kami
  rationale: Ang pandiwa ay nasa unang panauhang maramihan, kaya pinananatili ng “kami” ang tahasang pananaw ng Griyego habang natural pa rin sa Filipino.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay lamang ito sa salaysay; sapat na ang daloy ng konteksto at hindi kailangang lagyan ng “ngayon,” na maaaring magpahiwatig ng panahong wala sa salita.
- source_word: αἱ πᾶσαι ψυχαὶ
  choice: lahat-lahat ... katao
  rationale: Sa kontekstong ito, ang ψυχαί ay tumutukoy sa mga taong sakay, hindi partikular sa di-materyal na kaluluwa. Ipinapahayag ng “lahat-lahat” ang πᾶσαι at ang kabuuang bilang.
- source_word: ἐν τῷ πλοίῳ
  choice: sa barko
  rationale: Karaniwan at likas na Filipino ang “sa barko” para sa mga taong sakay ng sasakyang-dagat.
- source_word: διακόσιαι ἑβδομήκοντα ἕξ
  choice: '276'
  rationale: Pinananatili ang eksaktong bilang sa madaling basahing anyong numero.
theological_decisions:
- issue: Kahulugan ng ψυχαί
  choice: katao
  alternative: kaluluwa
  rationale: Ang salita ay ginagamit dito bilang bilang ng mga tao o buhay na sakay; ang “kaluluwa” ay maaaring maling magpahiwatig na ang talata ay nagtuturo tungkol sa di-materyal na bahagi ng tao.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “barko” at “katao” bilang karaniwan at madaling maunawaang mga salita; pinanatili ang unang panauhang “kami” mula sa Griyego.
