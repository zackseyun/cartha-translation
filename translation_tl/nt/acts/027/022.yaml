  text: καὶ τὰ νῦν παραινῶ ὑμᾶς εὐθυμεῖν, ἀποβολὴ γὰρ ψυχῆς οὐδεμία ἔσται ἐξ ὑμῶν πλὴν τοῦ πλοίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/022.yaml
  text: And now I urge you to take courage[a], for there will be no loss of life among you[b], except for the ship.
translation:
  language: tl
  text: At ngayon, hinihimok ko kayong lakasan ang inyong loob[a], sapagkat walang sinuman sa inyo ang mamamatay[b]; ang barko lamang ang mawawala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “manatili kayong matatag” o “huwag kayong panghinaan ng loob.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “walang mawawalang buhay mula sa inyo.” Ang ψυχή rito ay tumutukoy sa pisikal na buhay, hindi partikular sa kaluluwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: At ngayon
  rationale: Likas na panandang temporal sa Filipino na nag-uugnay sa kasalukuyang paghihimok ni Pablo sa naunang sinabi.
- source_word: παραινῶ
  choice: hinihimok ko
  rationale: Ipinapahayag ang mariin ngunit mapagmalasakit na payo o paghikayat ng pandiwa.
- source_word: εὐθυμεῖν
  choice: lakasan ang inyong loob
  rationale: Karaniwang modernong Filipino para sa pagpapanatili o pagkakaroon ng tapang at mabuting loob sa gitna ng panganib.
- source_word: ἀποβολὴ ψυχῆς
  choice: walang sinuman ... ang mamamatay
  rationale: Sa kontekstong ito, ang ψυχή ay pisikal na buhay; ang personal na pahayag na ito ay malinaw at likas sa Filipino habang ipinapahayag ang kawalan ng pagkamatay.
- source_word: ἐξ ὑμῶν
  choice: sa inyo
  rationale: Tinutukoy ang pangkat na mula rito ay walang buhay na mawawala.
- source_word: πλὴν τοῦ πλοίου
  choice: ang barko lamang ang mawawala
  rationale: 'Ipinapakita nang natural ang kaibahan: maliligtas ang mga tao ngunit mawawala ang barko.'
theological_decisions:
- issue: Kahulugan ng ψυχή
  choice: pisikal na buhay, na isinaling “walang sinuman ... ang mamamatay”
  alternative: kaluluwa
  rationale: Ang agarang konteksto ay kaligtasan mula sa pagkamatay sa dagat, hindi isang pahayag tungkol sa di-materyal na kaluluwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “barko” bilang karaniwang salita sa halip na mas teknikal o makalumang katawagan; pinanatili ang mariing paghihikayat at ang malinaw na kaibahan sa pagitan ng kaligtasan ng mga tao at pagkawala ng sasakyan.
