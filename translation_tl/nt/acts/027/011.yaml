- from: Ngunit mas pinaniwalaan ng senturyon ang piloto at ang may-ari ng barko kaysa sa mga sinabi ni Pablo.
  to: Ngunit higit na naniwala ang senturyon sa piloto at sa may-ari ng barko kaysa sa mga sinasabi ni Pablo.
