  text: ὁ δὲ ἑκατοντάρχης τῷ κυβερνήτῃ καὶ τῷ ναυκλήρῳ ⸂μᾶλλον ἐπείθετο⸃ ἢ τοῖς ⸀ὑπὸ Παύλου λεγομένοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/011.yaml
  text: But the centurion paid more attention to the pilot and the shipowner than to what was being said by Paul[a].
translation:
  language: tl
  text: Ngunit higit na naniwala ang senturyon sa piloto at sa may-ari ng barko kaysa sa mga sinasabi ni Pablo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: senturyon
  rationale: Karaniwang katawagang pangkasaysayan sa opisyal na Romano na namumuno sa isang yunit ng mga kawal; tiyak at pamilyar sa salin-Bibliya.
- source_word: κυβερνήτῃ
  choice: piloto
  rationale: Sa kontekstong pandagat, tumutukoy sa taong nagpapatakbo at gumagabay sa barko; pinananatili nitong naiiba ang tungkulin niya sa ναύκληρος.
- source_word: ναυκλήρῳ
  choice: may-ari ng barko
  rationale: Karaniwang tumutukoy sa may-ari o pangunahing tagapangasiwa ng barko at malinaw na naiiba sa piloto.
- source_word: μᾶλλον ἐπείθετο
  choice: mas pinaniwalaan
  rationale: Ipinahahayag ang paghikayat o pagbibigay ng higit na tiwala sa pasiya ng dalawang taong-dagat, habang pinananatili ang paghahambing ng μᾶλλον.
- source_word: τοῖς ὑπὸ Παύλου λεγομένοις
  choice: sa mga sinabi ni Pablo
  rationale: Natural na Filipino para sa substantivized passive participle na tumutukoy sa mga salitang payo o babala ni Pablo.
- source_word: δὲ
  choice: Ngunit
  rationale: Malinaw na ipinakikita ang pagsalungat sa naunang babala ni Pablo.
- source_word: ἢ
  choice: kaysa
  rationale: Likas na panandang Filipino para sa paghahambing na kaugnay ng μᾶλλον.
