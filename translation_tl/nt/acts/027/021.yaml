revisions:
- from: Matapos silang hindi makakain nang matagal,[a] tumayo si Pablo sa gitna nila at sinabi, “Mga ginoo, dapat ay nakinig kayo sa akin[b] at hindi pumalaot mula sa Creta. Sa gayon, naiwasan sana natin ang pinsala at kawalang ito.”[c]
  to: Matapos ang mahabang panahong hindi sila nakakain,[a] tumayo si Pablo sa gitna nila at sinabi, “Mga ginoo, dapat sana ay nakinig kayo sa akin[b] at hindi pumalaot mula sa Creta, upang naiwasan sana ninyo ang pinsalang ito at pagkalugi.”[c]
  rationale: Itinama ang panauhan mula “natin” tungo sa “ninyo,” sapagkat ang pagsaway ni Pablo ay para sa mga kausap niya. Pinakinis ang pambungad para sa likas na modernong Filipino at pinalitan ang “kawalan” ng “pagkalugi” upang mas malinaw na maipahayag ang ζημία, samantalang pinananatili ang maingat na pagkakaiba nito sa “pinsala.”
