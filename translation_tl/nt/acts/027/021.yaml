  naturalness: Mas natural ang “Matapos ang mahabang panahong hindi sila nakakain” kaysa “Matapos silang hindi makakain nang matagal.” Ang “pagkalugi” ay mas idiomatiko at mas tiyak sa konteksto kaysa “kawalan.”
  terminology: Pinananatili ang “Pablo,” “Creta,” at “pumalaot.” Ang “Mga ginoo” ay magalang at natural na pagtawag sa pangkat ng mga lalaking kausap; ang talababa ay nagpapaliwanag nang hindi ipinipilit ang kahulugan ng ἀσιτία.
