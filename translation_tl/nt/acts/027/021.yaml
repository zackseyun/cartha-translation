  text: Πολλῆς ⸀τε ἀσιτίας ὑπαρχούσης τότε σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν εἶπεν· Ἔδει μέν, ὦ ἄνδρες, πειθαρχήσαντάς μοι μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/021.yaml
  text: Since they had gone a long time without food, then Paul stood up among them and said, “Men, you should have listened to me and not set sail from Crete, and so have avoided this damage and loss.”
translation:
  language: tl
  text: Matapos ang mahabang panahong hindi sila nakakain,[a] tumayo si Pablo sa gitna nila at sinabi, “Mga ginoo, dapat sana ay nakinig kayo sa akin[b] at hindi pumalaot mula sa Creta, upang naiwasan sana ninyo ang pinsalang ito at pagkalugi.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Matapos ang matagal na hindi pagkain.” Ang salitang Griego ay maaaring tumukoy sa kawalan ng pagkain o sa kusang pag-iwas sa pagkain; sa konteksto ng bagyo, mas malamang na matagal silang hindi nakakain.
    reason: lexical_alternative
  - marker: b
    text: O “sumunod kayo sa akin.” Maaaring mangahulugan ang pandiwa na sumunod sa isang tagubilin o awtoridad; dito, tumutukoy ito sa pagbibigay-pansin sa payo ni Pablo.
    reason: lexical_alternative
  - marker: c
    text: Ang “pinsala” at “pagkalugi” ay malamang na tumutukoy, ayon sa pagkakasunod, sa aktuwal na kapinsalaan at sa materyal na pagkawala.
    reason: cultural_note
lexical_decisions:
- source_word: Πολλῆς τε ἀσιτίας ὑπαρχούσης
  choice: Matapos silang hindi makakain nang matagal
  rationale: Ang genitive absolute ay nagbibigay ng kalagayang nauna sa pagsasalita ni Pablo. Sa konteksto ng bagyo, ang ἀσιτία ay mas malamang na tumutukoy sa matagal na hindi pagkain kaysa sa sinasadyang pag-aayuno.
- source_word: σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν
  choice: tumayo si Pablo sa gitna nila
  rationale: Natural itong salin sa Filipino para sa pagkilos ni Pablo upang hayagang magsalita sa buong pangkat.
- source_word: Ἔδει μέν, ὦ ἄνδρες
  choice: Mga ginoo, dapat ay
  rationale: Ang imperfect na ἔδει ay nagsasaad ng nararapat sanang ginawa. Ang “Mga ginoo” ay isang magalang at kasalukuyang paraan ng tuwirang pagtawag sa mga lalaking sakay.
- source_word: πειθαρχήσαντάς μοι
  choice: nakinig kayo sa akin
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa pagsunod o pagbibigay-pansin sa payo ni Pablo nang hindi ipinahihiwatig na mayroon siyang pormal na kapangyarihan sa kanila.
- source_word: μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης
  choice: hindi pumalaot mula sa Creta
  rationale: Ang ἀνάγω ay terminong pandagat na nangangahulugang umalis patungong laot; malinaw at natural dito ang “pumalaot.”
- source_word: κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν
  choice: Sa gayon, naiwasan sana natin ang pinsala at kawalang ito
  rationale: Sa kontekstong ito, ang κερδαίνω ay may idiomatikong diwang hindi sana natamo o naranasan ang masamang bunga. Pinananatili ng “pinsala at kawalan” ang dalawang magkaugnay ngunit posibleng magkaibang bunga ng sakuna.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pumalaot” bilang likas na terminong pandagat at “Mga ginoo” bilang magalang na pagtawag sa pangkat ng mga lalaki. Pinanatili ang bahagyang pagkakaiba ng “pinsala” at “kawalan,” gayundin ang leksikal na kalabuan ng ἀσιτία sa talababa.
