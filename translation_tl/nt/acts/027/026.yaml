  rationale: Nagpapahayag ito ng banayad na pagsalungat sa naunang pahayag habang nagpapatuloy ang salaysay.
- source_word: δεῖ ἡμᾶς
  choice: kailangan tayong
  rationale: Likas itong anyo sa modernong Tagalog at pinananatili ang diwa ng kinakailangang mangyari.
- source_word: εἰς νῆσον τινα
  choice: sa isang pulo
  rationale: Pinananatili ng “isang” ang pagiging di-tiyak ng pulo, at ang “sa” ay natural kasama ng pandiwang “mapadpad.”
- source_word: ἐκπεσεῖν
  choice: mapadpad
  rationale: Sa kontekstong pandagat, ipinahihiwatig nito ang pagdating sa pampang dahil sa puwersa ng dagat o hangin, nang hindi labis na tinutukoy ang eksaktong paraan.
