lexical_decisions:
- source_word: σφοδρῶς
  choice: marahas
  rationale: Ipinahahayag ang matinding puwersa ng bagyo sa natural at malinaw na Tagalog.
- source_word: χειμαζομένων
  choice: patuloy kaming ... hinahampas ng bagyo
  rationale: Pinananatili ang pasibong diwa ng pagiging nasa matinding unos; ipinahihiwatig ng “patuloy” ang nagpapatuloy na kilos ng participle.
- source_word: ἡμῶν
  choice: kaming
  rationale: Ang genitive absolute ay likas na isinalin bilang sugnay na ang nagsasalita at mga kasama niya ang paksa.
- source_word: τῇ ἑξῆς
  choice: kinabukasan
  rationale: Natural at tuwirang katumbas ng temporal na pariralang “sa sumunod na araw.”
- source_word: ἐκβολὴν
  choice: itapon sa dagat ang mga kargamento
  rationale: Ang pangngalan ay terminong pandagat para sa pagtatapon ng karga upang gumaan ang barko; ginawang pandiwang parirala para sa likas na Tagalog.
- source_word: ἐποιοῦντο
  choice: sinimulan nilang itapon
  rationale: Ipinakikita ang pagsisimula at nagpapatuloy na katangian ng kilos na isinasalaysay ng imperfect middle.
