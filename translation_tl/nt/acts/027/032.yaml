lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Ipinahahayag ang kasunod na pangyayari sa salaysay nang natural sa makabagong Tagalog.
- source_word: ἀπέκοψαν
  choice: pinutol
  rationale: Tuwirang ipinahahayag ang pagputol o paglagot sa mga lubid.
- source_word: οἱ στρατιῶται
  choice: ang mga sundalo
  rationale: Karaniwan at malinaw na makabagong katumbas ng salitang tumutukoy sa mga kawal.
- source_word: τὰ σχοινία
  choice: ang mga lubid
  rationale: Malinaw na katumbas para sa mga lubid o tali na gamit sa sasakyang-dagat.
- source_word: τῆς σκάφης
  choice: ng bangka
  rationale: Ang skaphē ay ang mas maliit na bangkang kasama ng malaking barko; likas at malinaw sa Tagalog ang “bangka.”
- source_word: εἴασαν αὐτὴν
  choice: hinayaan itong
  rationale: Pinananatili ang diwa ng sadyang pagpapabaya o pagpapahintulot na mangyari ang kasunod na kilos.
- source_word: ἐκπεσεῖν
  choice: maanod palayo
  rationale: Sa kontekstong pandagat, maaaring tumukoy ang pandiwa sa pagkalayo ng bangka matapos putulin ang mga lubid; natural sa Tagalog ang “maanod palayo,” habang inilalahad sa talababa ang mas literal na larawan.
