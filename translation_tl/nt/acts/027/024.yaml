  text: λέγων· Μὴ φοβοῦ, Παῦλε· Καίσαρί σε δεῖ παραστῆναι, καὶ ἰδοὺ κεχάρισταί σοι ὁ θεὸς πάντας τοὺς πλέοντας μετὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/024.yaml
  text: saying, ‘Do not be afraid, Paul. You must stand before Caesar, and look, God has granted to you all those sailing with you.’
translation:
  language: tl
  text: na nagsabi, “Huwag kang matakot, Pablo. Kailangang humarap ka kay Cesar. At tingnan mo, ipinagkaloob sa iyo ng Diyos ang lahat ng kasama mong naglalayag.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: na nagsabi
  rationale: Likas na nag-uugnay sa naunang sugnay habang pinananatili ang participial na diwa ng pagsasalita.
- source_word: Μὴ φοβοῦ
  choice: Huwag kang matakot
  rationale: Direkta at natural na salin ng kasalukuyang pautos na may negasyon.
- source_word: δεῖ παραστῆναι
  choice: Kailangang humarap ka
  rationale: Pinananatili ang diwa ng banal na pangangailangan at ang pagharap sa harapan ng pinuno.
- source_word: Καίσαρί
  choice: kay Cesar
  rationale: Karaniwang makabagong Tagalog na anyo ng titulong Caesar.
- source_word: ἰδοὺ
  choice: masdan mo
  rationale: Pinananatili ang pansin-tawag ng Griyego sa isang marangal ngunit nauunawaang paraan.
- source_word: κεχάρισταί σοι
  choice: ipinagkaloob sa iyo
  rationale: Ipinahahayag ang mapagbiyayang pagkakaloob na nasa perfect tense nang hindi labis na ipinapaliwanag ang implikasyon nito.
- source_word: πάντας τοὺς πλέοντας μετὰ σοῦ
  choice: ang lahat ng kasama mong naglalayag
  rationale: Natural na Tagalog na nagpapanatili sa saklaw na ‘lahat’ at sa aktuwal na paglalayag kasama ni Pablo.
theological_decisions:
- issue: Diwa ng θεὸς ... κεχάρισταί σοι
  choice: ipinagkaloob sa iyo ng Diyos
  alternative: iniligtas ng Diyos alang-alang sa iyo
  rationale: Ang teksto ay tahasang nagsasabing ipinagkaloob sila kay Pablo; hindi nito tuwirang sinasabi rito ang mekanismo o batayan ng kanilang pagliligtas, kaya hindi iyon idinagdag.
- issue: Pangangailangan sa δεῖ
  choice: Kailangang humarap ka kay Cesar
  alternative: Nakatakdang humarap ka kay Cesar
  rationale: Ang ‘kailangang’ ay nagpapanatili sa lakas at bahagyang bukas na katangian ng impersonal na δεῖ, nang hindi tahasang nilalagyan ng paliwanag ang pinagmulan ng pangangailangan.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at malinaw. Ginamit ang “masdan mo” upang maipakita ang retorikal na ἰδοὺ, bagaman bahagya itong mas pormal kaysa pang-araw-araw na pananalita.
