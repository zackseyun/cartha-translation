base_translation:
  language: en
  yaml_path: translation/nt/acts/027/041.yaml
  text: But falling into a place where two seas met[a], they ran the ship aground; and the bow, having stuck fast, remained immovable, but the stern was being broken up by the force.
translation:
  language: tl
  text: Ngunit nang mapunta sila sa isang lugar na pinagtatagpuan ng dalawang dagat[a], isinadsad nila roon ang barko. Bumaon ang unahan nito at nanatiling hindi magalaw, ngunit unti-unting nagkakalas ang hulihan dahil sa matinding puwersa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang lugar sa pagitan ng dalawang dagat.” Bihira ang salitang Griyego at maaaring tumukoy sa isang daluyan, buhanginan, o lugar na pinagtatagpuan ng dalawang anyong-tubig o agos.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπεσόντες
  choice: nang mapunta sila
  rationale: Ipinakikita ang biglaan at di-kanais-nais na pagdating ng barko sa lugar nang hindi labis na tinutukoy kung eksaktong bumangga o naanod ito.
- source_word: τόπον διθάλασσον
  choice: isang lugar na pinagtatagpuan ng dalawang dagat
  rationale: Pinananatili ang pambihira at hindi ganap na tiyak na larawan ng διθάλασσος, sa halip na tukuyin agad itong buhanginan o daluyan.
- source_word: ἐπέκειλαν τὴν ναῦν
  choice: isinadsad nila roon ang barko
  rationale: Ang ἐπικέλλω ay terminong pandagat para sa pagsadsad o pagpapaahon ng sasakyang-dagat; natural at malinaw sa Filipino ang 'isinadsad.'
- source_word: πρῷρα
  choice: unahan nito
  rationale: Malinaw sa karaniwang mambabasa at tumutukoy sa harapang bahagi ng barko nang hindi nangangailangan ng teknikal na terminong pandagat.
- source_word: ἐρείσασα
  choice: Bumaon
  rationale: Ipinahihiwatig ng ἐρείδω na ang unahan ay mariing naitulos o naipit sa kinasadsaran.
- source_word: ἔμεινεν ἀσάλευτος
  choice: hindi na makilos
  rationale: Natural na ipinapahayag ang pananatiling matatag at hindi magalaw ng unahan ng barko.
- source_word: πρύμνα
  choice: hulihan
  rationale: Karaniwang salitang Filipino para sa likurang bahagi ng barko at katumbas ng πρύμνα.
- source_word: ἐλύετο
  choice: unti-unting nawawasak
  rationale: Inilalarawan ng imperpektong anyong pasibo ang nagpapatuloy na pagkakalas at pagkawasak ng hulihan.
- source_word: ὑπὸ τῆς βίας
  choice: dahil sa matinding puwersa
  rationale: Pinananatili ang tahasang 'puwersa' ng Griyego nang hindi idinaragdag sa pangunahing teksto ang 'mga alon,' bagaman iyon ang malamang na puwersa ayon sa konteksto.
