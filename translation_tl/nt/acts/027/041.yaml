translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang 'unahan' at 'hulihan' sa halip na mas teknikal na mga terminong pandagat. Pinanatili sa talababa ang likas na kawalang-katiyakan ng τόπον διθάλασσον, at hindi tahasang idinagdag ang 'mga alon' sa βίας.
