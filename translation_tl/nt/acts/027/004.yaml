  text: κἀκεῖθεν ἀναχθέντες ὑπεπλεύσαμεν τὴν Κύπρον διὰ τὸ τοὺς ἀνέμους εἶναι ἐναντίους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/004.yaml
  text: And from there[a], after putting out to sea, we sailed under the lee of Cyprus, because the winds were against us.
translation:
  language: tl
  text: At mula roon, pagkapalaot namin, naglayag kami sa panig ng Ciprus na nasisilungan sa hangin[a], dahil salungat sa amin ang mga hangin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “naglayag kami sa gawing nasisilungan ng Ciprus.” Ang pandiwang Griyego ay terminong pandagat para sa paglalayag sa panig ng isang pulo na nasisilungan sa hangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: At mula roon
  rationale: Likas na ipinahahayag ang pang-ugnay na καί at ang ἐκεῖθεν, habang pinananatili ang daloy ng salaysay.
- source_word: ἀναχθέντες
  choice: pagkapalaot namin
  rationale: Sa gamit-pandagat, ang ἀνάγω ay nangangahulugang pumalaot o maglayag mula sa daungan. Ipinakikita ng anyong participle na nauna ang pagkilos na ito sa sumunod na paglalayag.
- source_word: ὑπεπλεύσαμεν
  choice: naglayag kami sa panig ... na kubli sa hangin
  rationale: Ang ὑποπλέω ay terminong pandagat para sa paglalayag sa panig ng isang pulo na nasisilungan mula sa hangin; mas malinaw ito kaysa sa literal na 'naglayag sa ilalim.'
- source_word: τὴν Κύπρον
  choice: Ciprus
  rationale: Karaniwang anyong Filipino ng pangalan ng pulo na Κύπρος.
- source_word: διὰ τὸ ... εἶναι
  choice: dahil
  rationale: Ang διά kasama ng articular infinitive ay nagpapahayag ng dahilan; malinaw at natural sa modernong Tagalog ang 'dahil.'
- source_word: τοὺς ἀνέμους
  choice: ang mga hangin
  rationale: Pinananatili ang maramihang anyo ng pangngalang Griyego.
- source_word: ἐναντίους
  choice: salungat sa amin
  rationale: Ipinahahayag ang masamang direksiyon ng mga hangin kaugnay ng kanilang paglalakbay. Ang 'sa amin' ay likas na ipinahihiwatig ng konteksto bagaman walang tahasang panghalip sa Griyego.
