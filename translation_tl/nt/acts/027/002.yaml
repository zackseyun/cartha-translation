  text: ἐπιβάντες δὲ πλοίῳ Ἀδραμυττηνῷ ⸀μέλλοντι πλεῖν ⸀εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους ἀνήχθημεν ὄντος σὺν ἡμῖν Ἀριστάρχου Μακεδόνος Θεσσαλονικέως·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/002.yaml
  text: So we boarded an Adramyttian ship that was about to sail to the places along Asia, and put out to sea, with Aristarchus, a Macedonian from Thessalonica, being with us.
translation:
  language: tl
  text: At sumakay kami sa isang barkong mula sa Adramitio na nakatakdang maglayag patungo sa mga lugar sa kahabaan ng Asia[a][b]. Pumalaot kami kasama si Aristarco, isang taga-Macedonia mula sa Tesalonica.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Asia” rito ay ang lalawigang Romano sa kanlurang Asia Minor, hindi ang modernong kontinente ng Asia.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “patungo sa mga daungan sa baybayin ng Asia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιβάντες
  choice: sumakay kami
  rationale: Sa kontekstong pandagat, tumutukoy ito sa pagsakay o pag-akyat sa isang sasakyang-dagat. Natural at malinaw sa makabagong Tagalog ang “sumakay kami.”
- source_word: δὲ
  choice: At
  rationale: Nagpapatuloy ito ng salaysay at hindi nagpapahayag ng matinding pagsalungat. Ang “At” ay magaan at likas na pang-ugnay sa Tagalog.
- source_word: πλοίῳ Ἀδραμυττηνῷ
  choice: isang barkong mula sa Adramitio
  rationale: Ipinakikilala ng pang-uri ang barko ayon sa pinagmulan o daungang kaugnay nito. Mas malinaw sa karaniwang mambabasa ang “mula sa Adramitio” kaysa sa isang di-pamilyar na pang-uring hango sa pangalan.
- source_word: μέλλοντι πλεῖν
  choice: na nakatakdang maglayag
  rationale: Ipinahihiwatig ng μέλλω kasama ng pawatas ang nalalapit o nilalayong paglalayag. Saklaw ng “nakatakdang” ang planadong pag-alis nang hindi labis na nililimitahan sa agarang sandali.
- source_word: εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους
  choice: patungo sa mga lugar sa kahabaan ng Asia
  rationale: Pinananatili nito ang malawak na heograpikong diwa ng mga lugar na sunod-sunod sa kahabaan ng Asia, nang hindi tahasang idinaragdag sa pangunahing teksto ang “mga daungan” o “baybayin,” bagaman ipinahihiwatig iyon ng kontekstong pandagat.
- source_word: Ἀσίαν
  choice: Asia
  rationale: Pinananatili ang makasaysayang pangalang heograpiko; nililinaw sa talababa na lalawigang Romano ang tinutukoy at hindi ang buong modernong kontinente.
- source_word: ἀνήχθημεν
  choice: Pumalaot kami
  rationale: Karaniwang idyomang pandagat ang pandiwa para sa pag-alis sa daungan at pagtungo sa laot. Likas at tiyak sa Tagalog ang “pumalaot kami.”
- source_word: ὄντος σὺν ἡμῖν
  choice: kasama si Aristarco
  rationale: Inilalahad nito ang kasabay na kalagayan na si Aristarco ay kasama ng pangkat. Maikli at natural ang anyong Tagalog.
- source_word: Ἀριστάρχου
  choice: Aristarco
  rationale: Ginamit ang nakagawiang anyong Filipino ng personal na pangalan.
- source_word: Μακεδόνος Θεσσαλονικέως
  choice: isang taga-Macedonia mula sa Tesalonica
  rationale: Pinananatili nito kapwa ang mas malawak na rehiyon at ang tiyak na lungsod na pinagmulan ni Aristarco sa paraang hindi mabigat pakinggan sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; ginamit ang karaniwang bokabularyong pandagat na “maglayag” at “pumalaot.” Pinanatili sa pangunahing teksto ang mas malawak na “mga lugar sa kahabaan” at inilagay sa talababa ang mas tiyak na posibleng pagbasa na “mga daungan sa baybayin.”
