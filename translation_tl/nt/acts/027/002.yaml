  source_fidelity: 'Tumpak na naihahatid ng salin ang pagkakasunod ng mga pangyayari: pagsakay sa barkong kaugnay ng Adramitio, paglalayag nito patungo sa mga lugar sa Asia, at pagsama ni Aristarco. Ang “nakatakdang maglayag” ay katanggap-tanggap na paglalahad ng μέλλοντι πλεῖν, at ang “pumalaot” ay angkop sa pandagat na ἀνήχθημεν.'
