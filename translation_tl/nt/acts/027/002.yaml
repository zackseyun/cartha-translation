  terminology: Ang mga pangalang Adramitio, Aristarco, Macedonia, at Tesalonica ay magkakatugma at madaling makilala sa Filipino. Wasto at kapaki-pakinabang ang talababa sa “Asia” upang tukuyin ang lalawigang Romano, hindi ang modernong kontinente. Hindi naglalaman ang talata ng pinagtatalunang terminong teolohikal.
