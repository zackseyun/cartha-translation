translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang karaniwang “angkla” at iniwasan ang labis na teknikal na terminong pandagat. Pinanatili ang pansariling palagay sa “inakala” at hindi ginawang tiyak ang tagumpay ng kanilang balak.
