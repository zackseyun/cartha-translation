  text: Ὑποπνεύσαντος δὲ νότου δόξαντες τῆς προθέσεως κεκρατηκέναι ἄραντες ἆσσον παρελέγοντο τὴν Κρήτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/013.yaml
  text: And when a south wind began to blow gently[a], thinking that they had obtained their purpose, they weighed anchor and sailed along Crete[c][b], close inshore.
translation:
  language: tl
  text: Nang bahagyang umihip ang hanging timog, inakala nilang nakamit na nila ang kanilang layunin. Kaya itinaas nila ang angkla[a] at naglayag sa kahabaan ng Creta, mas malapit sa baybayin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “nang maiangat [ang angkla].” Sa kontekstong pandagat, tumutukoy ito sa pag-angat ng angkla upang makapaglayag.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “naglayag sila sa kahabaan ng Creta, na mas malapit sa pampang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποπνεύσαντος
  choice: umihip nang marahan
  rationale: Ipinahihiwatig ng ὑποπνέω ang banayad o mahinang pag-ihip; natural at malinaw ito sa makabagong Tagalog.
- source_word: νότου
  choice: ang hanging timog
  rationale: Ang νότος ay hanging nagmumula sa timog. Ang pariralang ito ay mas natural kaysa sa literal na “timog na hangin.”
- source_word: δόξαντες
  choice: inakala nilang
  rationale: Nagsasaad dito ang δοκέω ng pansariling palagay ng mga mandaragat, hindi ng tiyak na kaalaman.
- source_word: τῆς προθέσεως κεκρατηκέναι
  choice: maisasakatuparan na nila ang kanilang balak
  rationale: Sa konteksto, ang πρόθεσις ay kanilang nilalayong plano, at ang κρατέω ay tumutukoy sa pagkakamit o pagkontrol dito. Pinananatili ng salin ang diwa na naniwala silang pabor na ang kalagayan upang matupad ang balak.
- source_word: ἄραντες
  choice: itinaas nila ang angkla
  rationale: Literal na “itinaas,” ngunit sa kontekstong pandagat ay ipinahihiwatig ang pag-angat ng angkla upang makapaglayag.
- source_word: παρελέγοντο
  choice: naglayag sa kahabaan
  rationale: Ang παραλέγομαι ay terminong pandagat para sa paglalayag sa kahabaan ng isang baybayin.
- source_word: ἆσσον
  choice: malapit sa baybayin
  rationale: Ang συγκριτικό na pang-abay ay nangangahulugang “mas malapit”; sa konteksto ng paglalayag sa tabi ng Creta, malinaw na ang tinutukoy ay pagiging malapit sa baybayin.
- source_word: τὴν Κρήτην
  choice: ng Creta
  rationale: Tahasang tinutukoy ng Griyego ang pulo ng Creta; ang pandiwang pandagat at kasunod na parirala ang nagpapakita na sa kahabaan ng baybayin nito sila naglayag.
