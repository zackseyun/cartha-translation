  yaml_path: translation/nt/acts/027/014.yaml
  text: But not long after[b][a], a typhonic wind called Euraquilo rushed down against it.
translation:
  language: tl
  text: Ngunit hindi nagtagal, isang hanging parang ipuipo na tinatawag na Eurakilon ang biglang humagupit mula sa pulo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “Euroklidon” ang mababasa sa halip na “Eurakilon.”
    reason: textual_variant
  - marker: b
    text: O “isang marahas na hanging mula sa hilagang-silangan.” Malamang na tumutukoy ang pangalan sa isang hanging-bagyo mula sa hilagang-silangan, ngunit inihaharap ito ng tekstong Griyego bilang pangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολὺ
  choice: hindi nagtagal
  rationale: Likas na pananalitang Filipino para sa maikling panahong lumipas; pinananatili ang diwa nang hindi literal at matigas.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ang biglang masamang pagbabago sa takbo ng salaysay.
- source_word: ἔβαλεν κατ’ αὐτῆς
  choice: humagupit dito
  rationale: Ipinapahayag ang marahas na pagdating ng hangin. Ang “dito” ay hindi labis na nagpapasya kung ang tinutukoy ng pambabaeng panghalip ay ang pulo, baybayin, o kaugnay na lugar sa konteksto.
- source_word: ἄνεμος τυφωνικὸς
  choice: isang hanging parang ipuipo
  rationale: Ang τυφωνικός ay tumutukoy sa marahas at umiikot na hanging-bagyo. Mas malinaw sa karaniwang mambabasa ang “parang ipuipo” kaysa teknikal na salitang meteorolohikal.
- source_word: ὁ καλούμενος
  choice: na tinatawag na
  rationale: Natural na pormulang Filipino sa pagpapakilala ng pangalan o katawagan.
- source_word: Εὐρακύλων
  choice: Eurakilon
  rationale: Transliterasyon ng pangalang nasa SBLGNT; hindi ito tahimik na isinalin bilang direksiyon ng hangin.
