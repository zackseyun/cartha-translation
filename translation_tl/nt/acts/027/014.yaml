translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “humagupit” upang ihatid ang biglaan at marahas na kilos ng hangin, at “parang ipuipo” upang maging madaling maunawaan nang hindi nagtatakda ng makabagong eksaktong uri ng bagyo.
