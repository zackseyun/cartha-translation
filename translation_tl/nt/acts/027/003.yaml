base_translation:
  language: en
  yaml_path: translation/nt/acts/027/003.yaml
  text: And on the next day we put in at Sidon[a], and Julius, treating Paul kindly[b], permitted him to go to his friends and receive care.
translation:
  language: tl
  text: Kinabukasan ay dumaong kami sa Sidon. At si Julio, na makataong nakitungo kay Pablo[a], ay pinahintulutan si Pablo na pumunta sa mga kaibigan niya upang tumanggap ng pangangalaga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mabait na nakitungo si Julio kay Pablo.” Ang salitang Griyego ay nagbibigay-diin sa makatao at mabuting pakikitungo niya kay Pablo.
    reason: lexical_alternative
  - marker: b
    text: O “upang makatanggap ng pag-aasikaso.” Malawak ang pariralang Griyego at maaaring tumukoy sa kinakailangang tulong o pangangalaga mula sa mga kaibigan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἑτέρᾳ
  choice: Kinabukasan
  rationale: Likas at malinaw na salin ng temporal na parirala sa daloy ng salaysay; tumutukoy ito sa sumunod na araw.
- source_word: κατήχθημεν εἰς Σιδῶνα
  choice: dumaong kami sa Sidon
  rationale: Ipinapahayag ng pandiwa ang pandagat na paglapit at paghinto ng sasakyang-dagat sa isang daungan, kaya mas tiyak ang “dumaong” kaysa pangkalahatang “dumating.”
- source_word: φιλανθρώπως ... χρησάμενος
  choice: Magandang makitungo ... kay Pablo
  rationale: Natural na Tagalog para sa makatao, mabait, at mapagmalasakit na pakikitungo ni Julio kay Pablo, nang hindi dinaragdagan ang antas ng damdamin.
- source_word: ἐπέτρεψεν
  choice: pinahintulutan niya
  rationale: Tumpak na nagsasaad ng pagbibigay ng pahintulot at angkop sa dignidad ng salaysay.
- source_word: πρὸς τοὺς φίλους
  choice: sa mga kaibigan nito
  rationale: Ang artikulo ay tumutukoy sa mga kaibigang kaugnay ni Pablo; malinaw sa Tagalog ang panghalip na “nito” at iniiwasan ang kalituhan sa tagaganap.
- source_word: πορευθέντι
  choice: pumunta
  rationale: Ang aorist participle ay natural na isinasalin bilang kilos na pinahintulutang gawin ni Pablo.
- source_word: ἐπιμελείας τυχεῖν
  choice: upang maalagaan
  rationale: Natural at malawak na katumbas ng pagtanggap o pagtatamo ng kinakailangang pag-aasikaso mula sa mga kaibigan.
