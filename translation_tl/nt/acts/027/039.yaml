base_translation:
  language: en
  yaml_path: translation/nt/acts/027/039.yaml
  text: When day came[a], they did not recognize the land, but they noticed a certain bay with a beach, into which they planned, if they could, to run the ship ashore.
translation:
  language: tl
  text: Pagsapit ng umaga, hindi nila nakilala ang lupain. Ngunit napansin nila ang isang look na may dalampasigan, at binalak nilang isadsad[a] doon ang barko, kung magagawa nila iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ipaahon ang barko sa dalampasigan.” Ang pandiwang Griyego ay tumutukoy sa sapilitang pagtutulak o pagpapatakbo ng sasakyang-dagat papunta sa pampang.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ ἡμέρα ἐγένετο
  choice: Pagsapit ng umaga
  rationale: Natural na temporal na parirala sa modernong Tagalog na nagpapahayag ng pagdating ng liwanag ng araw; hindi na kailangang gawing hiwalay na salita ang mahinang panandang pasalaysay na δέ.
- source_word: τὴν γῆν οὐκ ἐπεγίνωσκον
  choice: hindi nila nakilala ang lupain
  rationale: Ang ἐπιγινώσκω ay tumutukoy sa pagkilala o pagtukoy sa isang pook, at pinananatili ng “lupain” ang malawak na kahulugan ng γῆ nang hindi nililimitahan ito sa baybayin lamang.
- source_word: κόλπον δέ τινα κατενόουν
  choice: Ngunit napansin nila ang isang look
  rationale: Ang κόλπος sa kontekstong pandagat ay isang look o pasok ng dagat sa lupa; ipinahihiwatig ng “isang” ang pagiging di-tiyak ng τινα, at ang “napansin” ay angkop sa mapanuring pagtanaw ng κατανοέω.
- source_word: ἔχοντα αἰγιαλὸν
  choice: na may dalampasigan
  rationale: Tuwirang inilalarawan ng αἰγιαλός ang tabing-dagat o dalampasigan; hindi idinagdag ang ideyang mabuhangin sapagkat wala iyon sa Griyego.
- source_word: εἰς ὃν
  choice: doon
  rationale: Sa natural na Tagalog, malinaw na ang “doon” ay tumutukoy sa look na kanilang patutunguhan at naipapahayag nito ang direksiyon ng εἰς.
- source_word: ἐβουλεύοντο
  choice: binalak nila
  rationale: Ipinapahayag ng βουλεύομαι dito ang pagbubuo ng balak o pasya tungkol sa gagawin sa barko, nang hindi ipinahihiwatig na tiyak silang magtatagumpay.
- source_word: εἰ δύναιντο
  choice: kung magagawa nila
  rationale: Pinananatili nito ang kondisyon at posibilidad na ipinapahayag ng εἰ kasama ng optative.
- source_word: ἐξῶσαι τὸ πλοῖον
  choice: isadsad ang barko
  rationale: Sa kontekstong pandagat, ang ἐξωθέω ay tumutukoy sa sapilitang pagpapaahon o pagpapatakbo ng sasakyang-dagat sa pampang; “isadsad” ang maikli, natural, at tiyak na katumbas sa Tagalog.
