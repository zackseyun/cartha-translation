  yaml_path: translation/nt/acts/027/023.yaml
  text: For this very night an angel of the God to whom I belong and whom I also worship stood by me[b][a],
translation:
  language: tl
  text: Sapagkat ngayong gabi mismo, tumayo sa tabi ko ang isang anghel ng Diyos na kinabibilangan ko[a] at sinasamba ko rin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “na kanya ako.”
    reason: lexical_alternative
  - marker: b
    text: O “pinaglilingkuran ko rin”; ang salitang Griyego ay maaaring tumukoy sa sagradong paglilingkod o pagsambang iniaalay sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέστη
  choice: tumayo sa tabi ko
  rationale: Pinananatili nito ang literal na diwang panlunan ng biglang pagharap at pagtayo ng anghel sa tabi ni Pablo, sa halip na ang mas mapagpaliwanag na “nagpakita sa akin.”
- source_word: γάρ
  choice: Sapagkat
  rationale: Ipinakikita nito na ang pangungusap ay nagbibigay ng dahilan sa pagtitiwala ni Pablo ayon sa konteksto.
- source_word: ταύτῃ τῇ νυκτί
  choice: ngayong gabi mismo
  rationale: Likas sa modernong Tagalog at naipahahayag ang diin at pagiging kagyat ng demonstratibong parirala.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Iniuugnay nito ang anghel sa Diyos at maayos na sinusundan ng mga sugnay na naglalarawan sa kaugnayan ni Pablo sa Diyos.
- source_word: οὗ εἰμι
  choice: na nagmamay-ari sa akin
  rationale: Likas nitong ipinahahayag ang literal na “na sa kaniya ako” o “whose I am,” nang hindi dinaragdagan ang saklaw ng pahayag.
- source_word: ᾧ καὶ λατρεύω
  choice: at siya ring sinasamba ko
  rationale: Ang λατρεύω kapag Diyos ang tinutukoy ay nagpapahiwatig ng banal o panrelihiyong paglilingkod; malinaw na naipahahayag ito ng “sinasamba,” habang pinananatili ng “rin” ang καί.
- source_word: ἄγγελος
  choice: isang anghel
  rationale: Sa konteksto ng mensaheng mula sa Diyos at pagbibigay-katiyakan, malinaw na makalangit na anghel ang tinutukoy, hindi karaniwang taong sugo.
theological_decisions:
- issue: Pagpapahayag sa οὗ εἰμι
  choice: na nagmamay-ari sa akin
  alternative: na sa kaniya ako
  rationale: Malinaw at natural na ipinahahayag ng pangunahing salin ang pagiging pag-aari ni Pablo ng Diyos. Inilalagay sa talababa ang mas literal na anyo upang mapanatili ang istruktura at bahagyang lawak ng orihinal.
- issue: Pagpapahayag sa λατρεύω
  choice: sinasamba ko
  alternative: pinaglilingkuran ko
  rationale: Sa kaugnayan sa Diyos, ang pandiwa ay tumutukoy sa sagradong paglilingkod o pagsamba. Mas malinaw dito ang “sinasamba,” ngunit lehitimo ang “pinaglilingkuran,” kaya pinananatili ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “ngayong gabi mismo” para sa diin, at iniwasan ang arkaikong ayos. Parehong nakalagay sa pangunahing teksto ang mga panandang [a] at [b].
