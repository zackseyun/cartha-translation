revisions:
- from: Nang tangayin ng hangin ang barko at hindi na ito makasalungat dito, hinayaan na lamang namin itong matangay.[a]
  to: Nang matangay ang barko at hindi ito makaharap sa hangin, sumuko na kami at nagpatangay.
  rationale: Inalis ang hindi tahasang ahenteng “ng hangin” sa unang pasibong pandiwa at ang dagdag na “na” sa kawalang-kaya. Pinalitan ang malabong “makasalungat dito” ng “makaharap sa hangin,” na mas malapit sa ἀντοφθαλμεῖν sa kontekstong pandagat. Isinalin ang dalawang pangmaramihang pandiwa bilang “sumuko na kami at nagpatangay” upang mapanatili ang pagpapasya nilang magpaubaya at ang nagpapatuloy na pasibong pagdadala sa kanila. Inilagay ang dating pagtuon sa barko bilang alternatibo sa talababa.
