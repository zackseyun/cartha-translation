  yaml_path: translation/nt/acts/027/015.yaml
  text: And when the ship was caught and could not face the wind[a], we gave way and were driven along.
translation:
  language: tl
  text: Nang matangay ang barko at hindi ito makaharap sa hangin, sumuko na kami at nagpatangay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναρπασθέντος
  choice: tangayin ng hangin
  rationale: Ipinahihiwatig ng aorist passive participle na biglang nasakop ng panlabas na puwersa ang barko. Likas sa konteksto ang pagtukoy sa hangin bilang puwersang tumangay rito.
- source_word: πλοίου
  choice: barko
  rationale: Ang “barko” ang karaniwan at malinaw na modernong salin sa kontekstong pandagat.
- source_word: μὴ δυναμένου
  choice: hindi na ito
  rationale: Ginawang likas na sugnay sa Filipino ang participial na pagpapahayag ng kawalan ng kakayahan; ipinahihiwatig ng “na” ang pagbabagong dulot ng unos nang hindi dinaragdagan ang diwa.
- source_word: ἀντοφθαλμεῖν
  choice: makasalungat
  rationale: Sa kontekstong pandagat, tumutukoy ito sa kakayahan ng barko na humarap o sumalungat sa hangin. Ang “makasalungat” ay malinaw at hindi nangangailangan ng teknikal na terminong pandagat.
- source_word: ἀνέμῳ
  choice: sa hangin / ng hangin
  rationale: Ang ἄνεμος ay “hangin”; hindi ito pinalakas tungo sa “unos” o “malakas na hangin,” bagaman mabagyo ang mas malawak na konteksto.
- source_word: ἐπιδόντες
  choice: hinayaan na lamang namin
  rationale: Ipinahihiwatig nito ang pagtigil sa paglaban at ang pagpapabaya sa barko sa puwersa ng hangin. Likas sa Filipino ang tahasang pagbanggit sa ipinahiwatig na layon na “ito,” ang barko.
- source_word: ἐφερόμεθα
  choice: itong matangay
  rationale: 'Inilalarawan ng imperfect passive ang patuloy na pagkilos sa ilalim ng panlabas na puwersa. Pinagsama ito nang likas sa naunang participle: “hinayaan ... itong matangay.”'
- source_word: δέ
  choice: Nang
  rationale: Sa halip na piliting isalin nang hiwalay ang pang-ugnay na δέ, isinama ang pagpapatuloy ng salaysay sa likas na pangungusap na nagsisimula sa “Nang.”
