  text: But after running under the shelter of a small island called Cauda[a], we were barely able to secure the ship’s boat.
translation:
  language: tl
  text: Ngunit nang mapadaan kami sa masisilungang panig ng isang maliit na pulong tinatawag na Cauda[a], halos hindi namin nakayang mapasakamay ang bangkang kasama ng barko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang dumaan kami sa panig na kanlungan sa hangin ng isang maliit na pulong tinatawag na Cauda.” Gumagamit ang Griyego ng pananalitang pandagat para sa paglalayag sa panig ng pulo na nasisilungan sa hangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: νησίον ... τι
  choice: isang maliit na pulo
  rationale: Pinananatili nito ang di-tiyak na pagtukoy at ang pinaliit na diwa ng νησίον sa natural na modernong Tagalog.
- source_word: δέ
  choice: Ngunit
  rationale: Nagbibigay ito ng banayad na pagsalungat o paglipat sa salaysay habang pansamantalang nakasilong ang barko.
- source_word: ὑποδραμόντες
  choice: nang makadaan kami sa bahaging nasisilungan ng
  rationale: Sa kontekstong pandagat, tumutukoy ito sa pagdaan sa panig ng pulo na protektado sa hangin; malinaw ito nang hindi gumagamit ng labis na teknikal na termino.
- source_word: καλούμενον Καῦδα
  choice: na tinatawag na Cauda
  rationale: Tuwirang tinutukoy ang pangalan ng pulo at pinananatili ang transliterasyong Cauda ng SBLGNT.
- source_word: ἰσχύσαμεν μόλις
  choice: halos hindi namin nakayang
  rationale: Ipinahahayag nito ang matinding hirap at ang diwang muntik nang hindi maisagawa ang sumunod na kilos.
- source_word: περικρατεῖς γενέσθαι
  choice: maseguro
  rationale: Sa kontekstong ito, ipinahihiwatig ng parirala ang paghawak, pagkontrol, at pagtiyak na ligtas ang bangka.
- source_word: τῆς σκάφης
  choice: ang maliit na bangka ng barko
  rationale: Nililinaw na ito ang mas maliit na bangkang kasama ng malaking sasakyang-dagat, hindi ang mismong barko.
