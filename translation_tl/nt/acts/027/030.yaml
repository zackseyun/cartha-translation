  text: τῶν δὲ ναυτῶν ζητούντων φυγεῖν ἐκ τοῦ πλοίου καὶ χαλασάντων τὴν σκάφην εἰς τὴν θάλασσαν προφάσει ὡς ἐκ πρῴρης ⸂ἀγκύρας μελλόντων⸃ ἐκτείνειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/030.yaml
  text: And when the sailors were seeking to escape from the ship and had lowered the skiff into the sea under the pretense of being about to lay out anchors from the bow[b][a],
translation:
  language: tl
  text: Nang sinisikap ng mga mandaragat na tumakas mula sa barko at naibaba na nila sa dagat ang maliit na bangka[a], sa pagkukunwaring maglalatag sila ng mga angkla mula sa unahan ng barko[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay tumutukoy sa maliit na bangkang dala ng barko.
    reason: lexical_clarification
  - marker: b
    text: O “mula sa prowa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ναυτῶν
  choice: mga mandaragat
  rationale: Likas at malinaw na katawagan sa modernong Filipino para sa mga tauhang nagpapatakbo ng barko.
- source_word: ζητούντων φυγεῖν
  choice: nagtatangkang tumakas
  rationale: Ipinapahayag ang pagtatangka o layunin ng ζητέω na may infinitive, at ang pag-abandona nila sa barko.
- source_word: ἐκ τοῦ πλοίου
  choice: mula sa barko
  rationale: Natural na salin ng pinagmumulang tinatakasan.
- source_word: χαλασάντων τὴν σκάφην
  choice: ibinaba nila ... ang maliit na bangka
  rationale: Ang σκάφη ay maliit na bangkang dala ng barko; mas madaling maunawaan ito kaysa sa teknikal o hiram na terminong pandagat.
- source_word: εἰς τὴν θάλασσαν
  choice: sa dagat
  rationale: Natural na Filipino para sa pagpapababa ng bangka tungo sa tubig-dagat.
- source_word: προφάσει ὡς
  choice: na nagkukunwaring
  rationale: Malinaw na ipinahihiwatig ng πρόφασις ang huwad na dahilan na nagkukubli sa tunay nilang balak.
- source_word: ἐκ πρῴρης
  choice: mula sa unahan ng barko
  rationale: Tumpak ngunit mas madaling maunawaan ng karaniwang mambabasa kaysa sa teknikal na 'prow' o 'bow.'
- source_word: ἀγκύρας
  choice: mga angkla
  rationale: Tuwirang salin ng pangmaramihang anyo.
- source_word: μελλόντων ἐκτείνειν
  choice: maglalatag
  rationale: Sa kontekstong pandagat, tumutukoy sa balak na ilabas o ilatag ang mga angkla; naipahihiwatig ng anyong pandiwa ang kanilang sinasabing nalalapit na gagawin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang karaniwang 'maliit na bangka' at 'unahan ng barko' sa pangunahing teksto, habang inilagay sa talababa ang teknikal na alternatibong 'prowa.'
