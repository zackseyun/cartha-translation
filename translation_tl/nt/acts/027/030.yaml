revisions:
- from: Habang nagtatangkang tumakas mula sa barko ang mga mandaragat, ibinaba nila sa dagat ang maliit na bangka[a], na nagkukunwaring maglalatag sila ng mga angkla mula sa unahan ng barko[b].
  to: Nang sinisikap ng mga mandaragat na tumakas mula sa barko at naibaba na nila sa dagat ang maliit na bangka[a], sa pagkukunwaring maglalatag sila ng mga angkla mula sa unahan ng barko[b],
