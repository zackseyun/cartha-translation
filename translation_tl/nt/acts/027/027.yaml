  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὡς δὲ τεσσαρεσκαιδεκάτη νὺξ ἐγένετο διαφερομένων ἡμῶν ἐν τῷ Ἀδρίᾳ, κατὰ μέσον τῆς νυκτὸς ὑπενόουν οἱ ναῦται προσάγειν τινὰ αὐτοῖς χώραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/027.yaml
  text: When the fourteenth night had come[a], as we were being driven along in the Adriatic Sea[b], about midnight the sailors began to suspect that some land was drawing near to them.
translation:
  language: tl
  text: Nang sumapit ang ikalabing-apat na gabi, habang tinatangay kami sa Dagat Adria[a], bandang hatinggabi ay nagsimulang maghinala ang mga mandaragat na may lupain na papalapit sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang sinaunang pangalang “Adria” ay maaaring tumukoy sa mas malawak na bahagi ng gitnang Mediteraneo sa rehiyong ito, hindi lamang sa modernong Adriatic Sea.
    reason: cultural_note
  - marker: b
    text: Sa literal, “naghihinala ang mga mandaragat na may isang lupain na lumalapit sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσαρεσκαιδεκάτη νὺξ ἐγένετο
  choice: sumapit ang ikalabing-apat na gabi
  rationale: Ang γίνομαι kasama ng pahayag ng panahon ay nangangahulugang dumating o sumapit ang panahong iyon. Likas sa modernong Tagalog ang “sumapit” at malinaw nitong pinananatili ang pagkakasunod ng mga gabi.
- source_word: διαφερομένων ἡμῶν
  choice: habang tinatangay kami
  rationale: Ipinahihiwatig ng kasalukuyang balintiyak na pandiwari ang patuloy at hindi nila kontroladong pagkilos. Ang “tinatangay” ay angkop sa konteksto ng bagyo at mas matindi kaysa simpleng “inaanod.”
- source_word: ἐν τῷ Ἀδρίᾳ
  choice: sa Dagat Adria
  rationale: Pinananatili ang sinaunang pangalang heograpiko sa halip na ipantay ito nang walang paliwanag sa mas makitid na modernong Adriatic Sea. Nililinaw ng “Dagat” na katubigan ang tinutukoy.
- source_word: κατὰ μέσον τῆς νυκτός
  choice: bandang hatinggabi
  rationale: Napananatili ng “bandang” ang tinatayang panahon ng parirala, samantalang natural at maikli ang “hatinggabi.”
- source_word: ὑπενόουν
  choice: nagsimulang maghinala
  rationale: Ipinapahayag ng “maghinala” ang pansamantala at hindi pa tiyak na palagay. Ang “nagsimulang” ay kumakatawan sa posibleng pasimula o umuunlad na diwa ng imperfect.
- source_word: οἱ ναῦται
  choice: ang mga mandaragat
  rationale: Ang “mga mandaragat” ay malinaw, dignidad, at karaniwang katawagan sa mga tauhang nagpapatakbo ng barko.
- source_word: προσάγειν
  choice: papalapit
  rationale: Pinananatili nito ang pananaw ng konstruksiyong Griyego na waring ang lupain ang lumalapit sa kanila, sa halip na tahasang baguhin ang simuno at sabihing sila ang papalapit sa lupa.
- source_word: τινὰ ... χώραν
  choice: may lupain
  rationale: Ipinakikita ng “may lupain” na nakaramdam sila ng di-tiyak at hindi pa nakikilalang kalupaan. Ang “lupain” ay mas angkop dito kaysa sa “bansa” o “rehiyon.”
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: 'Pinananatili ang datibong pananaw ng orihinal: ang lupain ay waring papalapit sa mga mandaragat.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “Dagat Adria” upang maiwasang makitid ang sinaunang heograpikong katawagan, at pinanatili ang di-pangkaraniwang pananaw na ang lupain ang waring lumalapit sa kanila.
