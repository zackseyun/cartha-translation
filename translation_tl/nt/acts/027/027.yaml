- from: Nang sumapit ang ikalabing-apat na gabi, habang tinatangay kami sa Dagat Adria[a], bandang hatinggabi ay nagsimulang maghinala ang mga mandaragat na may lupaing papalapit sa kanila.[b]
  to: Nang sumapit ang ikalabing-apat na gabi, habang tinatangay kami sa Dagat Adria[a], bandang hatinggabi ay nagsimulang maghinala ang mga mandaragat na may lupain na papalapit sa kanila.[b]
  rationale: Idinagdag ang “na” upang maging ganap at natural ang pariralang Tagalog na naglalarawan sa di-tiyak na lupain. Pinanatili ang lahat ng iba pang pagpili, kabilang ang pasibong “tinatangay,” ang “bandang hatinggabi,” at ang perspektibang ang lupain ang waring lumalapit sa mga mandaragat.
