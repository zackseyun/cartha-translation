  yaml_path: translation/nt/acts/027/005.yaml
  text: After sailing across the open sea along Cilicia and Pamphylia[b][a], we came down to Myra in Lycia.
translation:
  language: tl
  text: Matapos naming tawirin ang laot sa tapat ng Cilicia at Pamfilia[a], bumaba kami sa Mira sa Licia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kahabaan ng Cilicia at Pamfilia,” na tumutukoy sa rutang malapit o kahilera ng baybayin ng mga rehiyong iyon.
    reason: lexical_alternative
  - marker: b
    text: O “dumating kami sa Mira sa Licia.” Sa literal, “bumaba kami”; sa ganitong salaysay ng paglalakbay, maaari itong gamitin para sa pagdating sa isang lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέλαγος
  choice: laot
  rationale: Ang “laot” ay likas at maikling salin para sa bukas na dagat, at pinananatili ang tiyak na diwang pandagat ng πέλαγος.
- source_word: τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν
  choice: sa kahabaan ng Cilicia at Pamfilia
  rationale: Ipinahihiwatig ng κατά na ang ruta ay nasa kahabaan o sa may baybayin ng mga rehiyong ito; natural itong naipahahayag sa Filipino sa pariralang ito nang hindi labis na tinutukoy ang eksaktong layo sa pampang.
- source_word: διαπλεύσαντες
  choice: matapos naming tawirin
  rationale: Ipinakikita ng aorist participle na natapos muna ang pagtawid bago ang kilos ng pangunahing pandiwa; malinaw at natural sa Filipino ang “matapos naming tawirin.”
- source_word: κατήλθομεν
  choice: dumaong kami
  rationale: Sa salaysay ng paglalayag, maaaring tumukoy ang pandiwa sa pagdating sa isang daungan. Ang “dumaong” ay natural sa kontekstong pandagat, habang itinatala sa talababa ang literal na direksiyonal na diwa.
- source_word: Μύρα τῆς Λυκίας
  choice: Mira sa Licia
  rationale: Tinutukoy ng genitive ang rehiyong kinaroroonan ng Mira; ang “sa Licia” ang likas na anyo sa Filipino.
- source_word: τε
  choice: ipinahihiwatig sa daloy ng pangungusap
  rationale: Mahina lamang ang pang-ugnay na puwersa ng τε at hindi nangangailangan ng hiwalay na katumbas sa natural na Filipino.
