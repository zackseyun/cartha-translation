  text: κἀκεῖ εὑρὼν ὁ ⸀ἑκατοντάρχης πλοῖον Ἀλεξανδρῖνον πλέον εἰς τὴν Ἰταλίαν ἐνεβίβασεν ἡμᾶς εἰς αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/006.yaml
  text: There the centurion found an Alexandrian ship sailing for Italy[a], and he put us on board it.
translation:
  language: tl
  text: At doon, nakakita ang senturyon ng isang barkong Alejandrino na naglalayag patungong Italya, at pinasakay niya kami rito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖ
  choice: Doon ay
  rationale: Ipinahihiwatig ng tambalang salita ang ‘at doon’ o ‘doon din.’ Natural sa salaysay na Tagalog ang ‘Doon ay,’ habang naiuugnay pa rin nito ang pangyayari sa naunang paglalakbay.
- source_word: εὑρὼν
  choice: nakakita
  rationale: Ang aorist participle ay ginawang likas na pandiwang Tagalog na nagsasaad ng naunang kilos bago ang pagpapasakay.
- source_word: ἑκατοντάρχης
  choice: senturyon
  rationale: Ito ang tiyak at karaniwang katawagan sa opisyal ng hukbong Romano na tinutukoy ng salitang Griyego.
- source_word: πλοῖον Ἀλεξανδρῖνον
  choice: isang barkong mula sa Alejandria
  rationale: Maaaring tumukoy ang pang-uri sa pinagmulan o pagkakaugnay ng barko sa Alejandria. Mas malinaw sa karaniwang mambabasa ang ‘mula sa Alejandria’ kaysa sa pang-uring ‘Alejandrino.’
- source_word: πλέον εἰς τὴν Ἰταλίαν
  choice: na naglalayag patungong Italia
  rationale: Pinananatili nito ang kasalukuyang kilos ng participle at ang Italia bilang direksiyon o destinasyon ng barko.
- source_word: ἐνεβίβασεν ἡμᾶς εἰς αὐτό
  choice: pinasakay niya kami roon
  rationale: 'Malinaw na naihahayag ng ‘pinasakay’ ang causative na diwa ng pandiwa: ang senturyon ang nag-ayos o nag-utos na sumakay sila sa barko.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘barko’ at ‘naglalayag’ bilang natural na bokabularyong pandagat, at pinanatili ang teknikal ngunit pamilyar na ranggong ‘senturyon.’
