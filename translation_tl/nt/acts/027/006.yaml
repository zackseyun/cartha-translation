  source_fidelity: Tumpak ang pangunahing daloy ng pangungusap at ang causative na diwa ng ἐνεβίβασεν. Gayunman, ang “mula sa Alejandria” ay nagpapaliit sa mas malawak na pang-uring Ἀλεξανδρῖνον, na maaaring magpahiwatig ng kaugnayan o pinagmulan nang hindi ito higit na tinutukoy ng teksto.
  naturalness: Malinaw ang draft, ngunit mas natural at mas maayos ang daloy ng “At doon, nakakita...” kaysa “Doon ay nakakita...”. Ang “barkong Alejandrino” ay nananatiling nauunawaan at mas malapit sa anyo ng Griyego.
  terminology: Ang “senturyon,” “naglalayag patungong,” at “pinasakay” ay angkop at marangal na makabagong Filipino. Ginamit ang “Italya,” ang karaniwang makabagong anyong Filipino ng pangalan ng bansa.
