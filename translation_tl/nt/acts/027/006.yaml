    rationale: Ang “At doon, nakakita...” ay mas likas sa makabagong salaysay na Filipino at malinaw na naihahayag ang κἀκεῖ ('at doon').
  revised_text: At doon, nakakita ang senturyon ng isang barkong Alejandrino na naglalayag patungong Italya, at pinasakay niya kami rito.
