  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “barko” at “mga lubid na pansuporta” para sa madaling pagkaunawa, habang pinanatili sa talababa ang tunay na kawalang-katiyakan tungkol sa τὸ σκεῦος.
