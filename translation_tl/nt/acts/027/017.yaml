  yaml_path: translation/nt/acts/027/017.yaml
  text: After hoisting it up[a], they used supporting cables to undergird the ship; and fearing that they might run aground on the Syrtis[c][b], they lowered the sea anchor and so were driven along.
translation:
  language: tl
  text: Pagkaiahon nila ang maliit na bangka, gumamit sila ng mga lubid na pansuporta upang bigkisan ang barko. Dahil nangangamba silang sumadsad sa Sirte[b], ibinaba nila ang kagamitan[a], at sa gayon ay patuloy silang tinangay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kagamitang pandagat,” “tackle,” o “angkla sa dagat.” Ang salitang Griyego ay pangkalahatang tumutukoy sa kagamitan, kaya hindi tiyak kung ano mismo ang ibinaba nila.
    reason: lexical_alternative
  - marker: b
    text: Ang Sirte ay isang bantog at mapanganib na lugar ng mabababaw na tubig at mga bunton ng buhangin sa may baybayin ng Hilagang Aprika.
    reason: cultural_note
lexical_decisions:
- source_word: ἣν ἄραντες
  choice: Pagkaiahon nila rito
  rationale: Ang panghalip ay tumutukoy sa maliit na bangka sa naunang talata, at ipinahihiwatig ng aorist participle na nauna ang pag-ahon dito bago ang sumunod na pagkilos.
- source_word: βοηθείαις
  choice: mga lubid na pansuporta
  rationale: Bagaman literal na nangangahulugang mga tulong o suporta, sa kontekstong pandagat ay tumutukoy ito sa mga lubid na ipinangtibay sa katawan ng barko.
- source_word: ὑποζωννύντες τὸ πλοῖον
  choice: upang bigkisan sa ilalim ang barko
  rationale: Pinananatili nito ang larawan ng pagpapadaan o pagtatali ng mga lubid sa ilalim ng katawan ng barko upang patibayin iyon.
- source_word: μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν
  choice: sumadsad sa Sirte
  rationale: Natural na pagpapahayag ito sa Filipino para sa panganib na mapadpad at maipit ang barko sa mababaw o mabuhanging lugar.
- source_word: Σύρτιν
  choice: Sirte
  rationale: Isinalin sa karaniwang anyong Filipino ang pangalang heograpiko; nililinaw sa talababa ang panganib na tinutukoy nito.
- source_word: χαλάσαντες τὸ σκεῦος
  choice: ibinaba nila ang kagamitan
  rationale: Ang σκεῦος ay pangkalahatang salitang nangangahulugang kagamitan o kasangkapan. Hindi tiyak kung anong kagamitang pandagat ang tinutukoy, kaya hindi ito nilimitahan sa angkla.
- source_word: οὕτως ἐφέροντο
  choice: sa gayong kalagayan ay tinangay sila ng hangin
  rationale: Ipinakikita ng imperfect passive ang patuloy na paggalaw dahil sa puwersang panlabas; ang hangin ang malinaw na puwersa sa konteksto.
