  to: Pagkaiahon nila ang maliit na bangka, gumamit sila ng mga lubid na pansuporta upang bigkisan ang barko. Dahil nangangamba silang sumadsad sa Sirte[b], ibinaba nila ang kagamitan[a], at sa gayon ay patuloy silang tinangay.
  rationale: Pinalitan ang hindi angkop na “rito” ng malinaw na pantukoy sa maliit na bangka. Inalis ang hayag na “ng hangin” upang huwag lumampas sa sinasabi ng talata, habang pinanatili ng “patuloy silang tinangay” ang diwa ng imperfect passive. Pinino rin ang talababa upang maipakita ang tunay na kawalang-katiyakan ng τὸ σκεῦος nang hindi nagbibigay ng “layag” bilang pangunahing leksikal na alternatibo.
