  text: λέγων αὐτοῖς· Ἄνδρες, θεωρῶ ὅτι μετὰ ὕβρεως καὶ πολλῆς ζημίας οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ τῶν ψυχῶν ἡμῶν μέλλειν ἔσεσθαι τὸν πλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/010.yaml
  text: saying to them[a], “Men, I perceive that the voyage is about to be with disaster and great loss, not only of the cargo and the ship[b], but also of our lives.”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Mga ginoo, nakikita kong ang paglalayag na ito ay malapit nang magdulot ng kapahamakan[a] at malaking kawalan—hindi lamang sa kargamento at sa barko, kundi pati sa ating mga buhay[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matinding pinsala.” Ang salitang Griyego ay maaaring tumukoy sa marahas na paghihirap o pinsalang kaakibat ng paglalayag.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga kaluluwa”; sa kontekstong ito, ang ibig sabihin ay “mga buhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: Sinabi niya sa kanila
  rationale: Natural na panimulang salaysay sa Filipino para sa participleng nagpapakilala sa tuwirang sinabi; pinananatili ang daloy nang hindi nagpapalabis.
- source_word: Ἄνδρες
  choice: Mga ginoo
  rationale: Magalang at likas na panawag sa isang pangkat ng mga lalaking sakay ng barko; mas natural sa modernong Filipino kaysa sa literal na “Mga lalaki.”
- source_word: θεωρῶ
  choice: nakikita kong
  rationale: Sa konteksto, tumutukoy ito sa maingat na pagkilala o pagtataya, hindi lamang sa pisikal na pagtingin. Ang “nakikita kong” ay karaniwang paraan sa Filipino upang ipahayag ang ganitong pagkaunawa.
- source_word: μετὰ ὕβρεως καὶ πολλῆς ζημίας
  choice: may kasamang kapahamakan at malaking kawalan
  rationale: Ipinapahayag ng μετά ang kalagayang sasabay sa paglalayag. Sa kontekstong pandagat, ang ὕβρις ay tumutukoy sa matinding pinsala o marahas na paghihirap, samantalang ang ζημία ay pagkawala o pagkalugi.
- source_word: οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ
  choice: hindi lamang ng kargamento at ng barko, kundi pati
  rationale: Pinananatili ang balangkas na “hindi lamang... kundi pati,” at malinaw na iniuugnay ang inaasahang kawalan sa kargamento at barko.
- source_word: τῶν ψυχῶν ἡμῶν
  choice: ating mga buhay
  rationale: Ang ψυχή rito ay tumutukoy sa pisikal na buhay na nanganganib sa pagkawasak ng barko, hindi partikular sa di-materyal na kaluluwa.
- source_word: μέλλειν ἔσεσθαι
  choice: ay may kasamang
  rationale: Sa pahayag ng pagtataya, natural nitong naihahatid sa Filipino ang inaasahang mangyayari sa nalalapit na paglalayag, nang hindi ginagawang ganap na tiyak ang babala.
- source_word: τὸν πλοῦν
  choice: ang paglalayag na ito
  rationale: Ang πλοῦς ay paglalakbay sa dagat. Idinagdag ang “na ito” bilang likas na pagtukoy sa nalalapit na paglalayag na pinag-uusapan.
theological_decisions:
- issue: Kahulugan ng ψυχή sa banta ng pagkawasak ng barko
  choice: mga buhay
  alternative: mga kaluluwa
  rationale: Ang agarang konteksto ay panganib ng pisikal na kamatayan. Hindi dapat ipasok dito ang teknikal na doktrina tungkol sa kaluluwa, bagaman itinatala sa talababa ang mas literal na anyo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Mga ginoo” bilang natural na magalang na panawag, at pinanatili sa mga talababa ang mahahalagang leksikal na alternatibo at tunay na lawak ng kahulugan.
