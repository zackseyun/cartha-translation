  to: Sinabi niya sa kanila, “Mga ginoo, nakikita kong ang paglalayag na ito ay malapit nang magdulot ng kapahamakan[a] at malaking kawalan—hindi lamang sa kargamento at sa barko, kundi pati sa ating mga buhay[b].”
