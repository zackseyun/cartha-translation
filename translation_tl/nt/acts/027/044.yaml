  text: and the rest[a], some on planks and some on pieces from the ship. And so it happened that all were brought safely to land.
translation:
  language: tl
  text: At ang iba naman, ang ilan ay nasa ibabaw ng mga tabla at ang ilan ay nasa ibabaw ng ilang bagay mula sa barko. Sa ganitong paraan, nakarating silang lahat nang ligtas sa pampang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Griyego ay maaari ring isalin na “naligtas”; dito ay tumutukoy ito sa pisikal na pagkaligtas sa pagkawasak ng barko at sa ligtas na pagdating sa lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς λοιποὺς
  choice: ang iba naman
  rationale: Tumutukoy ito sa mga natitirang tao na hindi kabilang sa naunang binanggit; natural sa makabagong Tagalog ang “ang iba naman.”
- source_word: οὓς μὲν ... οὓς δὲ
  choice: ang ilan ... at ang ilan
  rationale: Malinaw nitong hinahati sa dalawang pangkat ang mga natitirang tao nang hindi pilit ang pagkakasunod sa Griyego.
- source_word: ἐπὶ σανίσιν
  choice: nakakapit sa mga tabla
  rationale: Ang σανίς ay tabla o malapad na piraso ng kahoy. Idinagdag ang “nakakapit” bilang likas na pagpapahayag ng gamit ng mga tabla sa konteksto ng pagkalunod ng barko.
- source_word: ἐπί τινων τῶν ἀπὸ τοῦ πλοίου
  choice: sa mga bagay na mula sa barko
  rationale: Pinananatili ang pagiging di-tiyak ng τινων at hindi ipinapalagay na pawang mga piraso o labi ng barko ang tinutukoy.
- source_word: οὕτως
  choice: Sa ganitong paraan
  rationale: Tumutukoy pabalik sa paraang inilarawan kung paano sila nakarating sa lupa.
- source_word: ἐγένετο πάντας διασωθῆναι
  choice: nakarating silang lahat nang ligtas
  rationale: Natural na inilalahad sa Tagalog ang kinalabasan at ang pisikal na pagliligtas sa gitna ng pagkawasak ng barko.
- source_word: ἐπὶ τὴν γῆν
  choice: sa pampang
  rationale: Sa kontekstong pandagat, ang γῆ ay ang tuyong lupa o pampang na kabaligtaran ng dagat.
theological_decisions:
- issue: Posibleng espirituwal na kahulugan ng διασωθῆναι
  choice: nakarating silang lahat nang ligtas sa pampang
  alternative: naligtas silang lahat at nakarating sa pampang
  rationale: Sa agarang konteksto, ang pandiwa ay tumutukoy sa pisikal na pagkaligtas mula sa pagkawasak ng barko. Iniiwasan ng pangunahing salin ang di-kinakailangang espirituwal na pahiwatig, habang inilalagay sa talababa ang mas literal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang di-tiyak na “mga bagay na mula sa barko,” at ginamit ang “nakakapit” upang maging natural ang paglalarawan sa Tagalog.
