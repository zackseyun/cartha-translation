  yaml_path: translation/nt/acts/027/028.yaml
  text: And after taking soundings[a], they found twenty fathoms; then after going a little farther and taking soundings again, they found fifteen fathoms.
translation:
  language: tl
  text: At nagsukat sila ng lalim[a] at natuklasan nilang dalawampung dipa[b] ito. Nang makausad sila nang kaunti, muli silang nagsukat at natuklasan nilang labinlimang dipa ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “naghulog sila ng tingga”; sinusukat noon ang lalim ng dagat gamit ang lubid na may pabigat na tingga.
    reason: lexical_alternative
  - marker: b
    text: Ang isang dipa rito ay humigit-kumulang 1.8 metro.
    reason: measurement_clarification
lexical_decisions:
- source_word: βολίσαντες
  choice: nang sukatin nila ang lalim
  rationale: Tumutukoy ang pandiwa sa pagsukat ng lalim ng dagat sa pamamagitan ng paghuhulog ng panukat na may pabigat. Natural at malinaw sa modernong Tagalog ang saling ito, habang ipinapaliwanag sa talababa ang tiyak na paraang pandagat.
- source_word: εὗρον
  choice: nalaman nilang ... iyon
  rationale: Inihahayag nito ang resultang nakuha sa pagsukat. Mas natural sa Tagalog ang “nalaman” kaysa sa literal ngunit alanganing “natagpuan” sa kontekstong ito.
- source_word: ὀργυιὰς
  choice: dipa
  rationale: Ang dipa ang pinakamalapit na katutubong yunit sa nautical fathom at angkop sa konteksto ng pagsukat ng lalim, bagaman nililinaw sa talababa ang tinatayang modernong katumbas.
- source_word: εἴκοσι
  choice: dalawampu
  rationale: Tuwirang salin ng bilang.
- source_word: βραχὺ διαστήσαντες
  choice: pagkausad nila nang kaunti
  rationale: Ipinahihiwatig ng parirala na nagpatuloy ang barko sa maikling distansiya bago ang ikalawang pagsukat. Pinananatili ng “umusad nang kaunti” ang di-tiyak na layo.
- source_word: πάλιν
  choice: muli
  rationale: Tuwirang ipinahahayag ang pag-uulit ng pagsukat.
- source_word: δεκαπέντε
  choice: labinlima
  rationale: Tuwirang salin ng bilang.
- source_word: καὶ ... δὲ ... καὶ
  choice: At ... Pagkausad ... muli
  rationale: Ginawang likas na sunod-sunod na pagsasalaysay sa Tagalog; hindi binigyan ng matinding pagsalungat ang δέ dahil pang-ugnay ito ng kasunod na pangyayari rito.
