  text: Ἐσίγησεν δὲ πᾶν τὸ πλῆθος, καὶ ἤκουον Βαρναβᾶ καὶ Παύλου ἐξηγουμένων ὅσα ἐποίησεν ὁ θεὸς σημεῖα καὶ τέρατα ἐν τοῖς ἔθνεσιν δι’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/012.yaml
  text: And the whole assembly fell silent[a], and they listened to Barnabas and Paul as they related what signs and wonders God had done among the Gentiles through them.
translation:
  language: tl
  text: At tumahimik ang buong kapulungan, at nakinig sila kina Bernabe at Pablo habang isinasalaysay ng dalawa ang mga tanda at mga kababalaghang ginawa ng Diyos sa gitna ng mga Hentil[a] sa pamamagitan nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa gitna ng mga bansa.” Sa konteksto ng pagpupulong sa Jerusalem, ang ἔθνεσιν ay partikular na tumutukoy sa mga Hentil.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐσίγησεν
  choice: tumahimik
  rationale: Ipinahihiwatig ng aorist ang pagpasok ng kapulungan sa katahimikan bilang pangyayaring naglilipat sa salaysay.
- source_word: πᾶν τὸ πλῆθος
  choice: ang buong kapulungan
  rationale: Sa konteksto ng pagpupulong sa Jerusalem, tumutukoy ito sa buong nagkakatipong pangkat; mas angkop ang “kapulungan” kaysa “karamihan” o “madla.”
- source_word: ἤκουον
  choice: nakinig sila
  rationale: Ipinakikita ng imperfect ang nagpapatuloy at masusing pakikinig; natural itong ipinahahayag sa Filipino bilang “nakinig sila.”
- source_word: Βαρναβᾶ καὶ Παύλου
  choice: kina Bernabe at Pablo
  rationale: Ginamit ang nakaugaliang anyong Filipino ng mga pangalang biblikal at ang pantukoy na “kina” para sa dalawang tao.
- source_word: ἐξηγουμένων
  choice: habang isinasalaysay ng dalawa
  rationale: Tumutukoy ito sa detalyadong pagkukuwento o pag-uulat. Nililinaw ng “ng dalawa” na sina Bernabe at Pablo ang nagsasalaysay nang hindi paulit-ulit ang kanilang mga pangalan.
- source_word: ὅσα ἐποίησεν ὁ θεὸς σημεῖα καὶ τέρατα
  choice: ang mga tanda at mga kababalaghang ginawa ng Diyos
  rationale: 'Pinananatili ang Diyos bilang tahasang simuno at inuunawa ang ὅσα kasama ng mga layong σημεῖα καὶ τέρατα: isinalaysay nila kung gaano karaming gayong gawa ang ginawa ng Diyos. Natural sa Filipino ang paglalagay ng “ginawa ng Diyos” pagkatapos ng pares.'
- source_word: σημεῖα καὶ τέρατα
  choice: mga tanda at mga kababalaghan
  rationale: Pinananatili ang karaniwang pares sa Lucas nang hindi idinaragdag ang salitang “mahimala,” na hindi tahasang nasa Griyego.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: sa mga Hentil
  rationale: Sa konteksto ng konseho sa Jerusalem, partikular itong tumutukoy sa mga hindi Judio, bagaman maaari ring literal na isalin bilang “sa mga bansa.”
- source_word: δι’ αὐτῶν
  choice: sa pamamagitan nila
  rationale: 'Malinaw na ipinahahayag ang instrumentong diwa ng διά na may genitive: Diyos ang pangunahing gumagawa, at sina Bernabe at Pablo ang mga kasangkapan.'
theological_decisions:
- issue: Ang pagkilos ng Diyos sa misyon ng mga apostol
  choice: Diyos ang gumawa ng mga tanda at kababalaghan sa pamamagitan nina Bernabe at Pablo.
  alternative: Sina Bernabe at Pablo ang pangunahing gumawa ng mga tanda at kababalaghan.
  rationale: Ang ὁ θεὸς ang simuno ng ἐποίησεν, samantalang ang δι’ αὐτῶν ay nagpapakilala kina Bernabe at Pablo bilang mga kasangkapan. Pinananatili ng salin ang kaibhang ito nang hindi itinatanggi ang tunay nilang pakikibahagi.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kapulungan” para sa pormal na pagtitipon at “Hentil” bilang pamilyar na terminong biblikal; inilakip sa pangunahing teksto ang panandang talababa [a].
