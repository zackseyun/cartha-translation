  verdict: revise
  source_fidelity: Tumpak na naipapakita ng salin ang paghimik ng buong kapulungan, ang patuloy na pakikinig kay Bernabe at Pablo, at ang Diyos bilang siyang gumawa ng mga tanda at kababalaghan sa pamamagitan nila. Gayunman, mas malinaw na katumbas ng ἐν τοῖς ἔθνεσιν ang “sa gitna ng mga Hentil” kaysa sa payak na “sa mga Hentil,” na maaari ring unawain bilang direksiyon o tatanggap ng kilos.
  naturalness: Natural at marangal ang kabuuang Tagalog. Ang “habang isinasalaysay ng dalawa” ay maayos na paglalapat ng participial na pag-uulat. Ang “sa gitna ng mga Hentil” ay higit na likas at tiyak para sa diwang “among the Gentiles.”
  terminology: Ang “kapulungan,” “Bernabe at Pablo,” “mga tanda at mga kababalaghan,” at “mga Hentil” ay angkop sa modernong Filipino Tagalog at sa pamilyar na rehistrong biblikal. Pinananatili ng “sa pamamagitan nila” ang instrumental na diwa ng δι’ αὐτῶν at ang pangunahing pagkilos ng Diyos.
  issues:
