  source_fidelity: Tumpak na naihahatid ang mariing paninindigan ni Pablo (ἠξίου), ang pagtangging isama ang tinutukoy na lalaki, ang naunang paghiwalay niya kina Pablo at Bernabe sa Pamfilia, at ang hindi niya pagsama sa gawain. Ang “sa Pamfilia” ay likas na Tagalog na pagsasalin ng pariralang tumutukoy sa lugar ng paghiwalay; hindi nito ipinipilit ang mas malakas na pagbasa na “nag-abandona.”
