id: ACT.15.38
reference: Acts 15:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παῦλος δὲ ἠξίου, τὸν ἀποστάντα ἀπ’ αὐτῶν ἀπὸ Παμφυλίας καὶ μὴ συνελθόντα αὐτοῖς εἰς τὸ ἔργον, μὴ ⸀συμπαραλαμβάνειν τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/038.yaml
  text: But Paul insisted that they should not take along this man[a], who had withdrawn from them from Pamphylia and had not gone with them to the work.
translation:
  language: tl
  text: Ngunit iginiit ni Pablo na huwag nilang isama ang taong ito[a], na humiwalay sa kanila sa Pamfilia at hindi sumama sa kanila sa gawain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nag-abandona sa kanila sa Pamfilia.” Maaaring isalin nang mas matindi ang pandiwaring Griyego, ngunit pinananatili sa pangunahing teksto ang hindi gaanong mapanuring “humiwalay sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίου
  choice: iginiit
  rationale: Ipinahihiwatig ng imperpektong anyo at ng konteksto ng pagtatalo ang matatag na pasya ni Pablo, hindi lamang isang payak na mungkahi.
- source_word: ἀποστάντα
  choice: humiwalay sa kanila
  rationale: Pinananatili nito ang pangunahing diwa ng paglayo o pag-alis nang hindi agad ipinapasok ang mas mapanuring kahulugang “tumakas” o “nag-abandona.”
- source_word: ἀπ’ αὐτῶν ἀπὸ Παμφυλίας
  choice: sa kanila sa Pamfilia
  rationale: Ang unang pariralang may ἀπό ay nagsasaad ng paghiwalay kina Pablo at Bernabe; natural na nauunawaan sa Tagalog ang Pamfilia bilang lugar kung saan nangyari ang paghiwalay.
- source_word: μὴ συνελθόντα αὐτοῖς
  choice: hindi sumama sa kanila
  rationale: Malinaw at likas itong paglalarawan sa hindi niya pagpapatuloy bilang kasama nila sa paglalakbay.
- source_word: εἰς τὸ ἔργον
  choice: sa gawain
  rationale: Malapit ito sa kongkretong “gawain” ng Griyego at iniiwasang limitahan ang kahulugan sa mas interpretibong “misyon.”
- source_word: μὴ συμπαραλαμβάνειν τοῦτον
  choice: huwag nilang isama ang taong ito
  rationale: Ipinapakita nito na ang mariing pasya ni Pablo ay huwag isama ang tinutukoy na lalaki; pinananatili rin ng “ang taong ito” ang bahagyang diin ng demonstratibong τοῦτον.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pamfilia,” ang karaniwang anyong Filipino ng pangalan ng lugar, at pinanatili ang pag-igting ng salaysay nang hindi hinahatulan nang labis ang motibo ng taong tinutukoy.
