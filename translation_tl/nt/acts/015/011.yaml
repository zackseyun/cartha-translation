base_translation:
  language: en
  yaml_path: translation/nt/acts/015/011.yaml
  text: But through the grace of the Lord Jesus we believe that we will be saved[b][a], just as they also will be.
translation:
  language: tl
  text: Ngunit naniniwala tayong maliligtas tayo sa pamamagitan ng biyaya ng Panginoong Jesus, gaya rin nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “naniniwala tayong maligtas sa pamamagitan ng biyaya ng Panginoong Jesus, sa parehong paraan gaya rin nila.” Ipinahihiwatig sa huling bahagi: “gaya rin nilang maliligtas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sa halip
  rationale: Malakas na pagsalungat ito sa naunang pahayag tungkol sa pamatok na hindi kayang pasanin; natural sa Filipino ang “Sa halip” sa ganitong konteksto.
- source_word: διὰ τῆς χάριτος
  choice: sa pamamagitan ng biyaya
  rationale: Ipinapahayag ng διά na may genitive ang paraan o kasangkapan; malinaw at likas sa Filipino ang pariralang ito.
- source_word: χάριτος
  choice: biyaya
  rationale: Karaniwang salitang Filipino para sa mapagbiyayang pagkilos o kaloob ng Diyos sa konteksto ng kaligtasan.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ng Panginoong Jesus
  rationale: Pinananatili ang kaugnayan ng genitive sa “biyaya” at ginagamit ang natural na anyong Filipino ng titulo at pangalan.
- source_word: πιστεύομεν
  choice: naniniwala tayo
  rationale: Tuwirang ipinapahayag ang matibay na paniniwala ng nagsasalita at ng kaniyang mga kasamang Judio.
- source_word: σωθῆναι
  choice: maliligtas tayo
  rationale: Ang aorist passive infinitive pagkatapos ng πιστεύομεν ay natural na naipapahayag sa Filipino bilang sugnay na tumutukoy sa inaasahang kaligtasan.
- source_word: καθ’ ὃν τρόπον
  choice: gaya
  rationale: Maikli at natural na paghahambing sa modernong Filipino habang pinananatili ang diwa ng parehong paraan.
- source_word: κἀκεῖνοι
  choice: rin nila
  rationale: Pinananatili ng “rin” ang καί sa κἀκεῖνοι. Sapat ang elipsis sa Filipino upang ipahiwatig na sila rin ay maliligtas sa gayunding paraan.
theological_decisions:
- issue: Direksiyon ng paghahambing sa pahayag ni Pedro
  choice: Ang “tayo” na mga Judio ang sinasabing maliligtas gaya rin ng “sila” na mga Gentil.
  alternative: Sila ay maliligtas gaya natin.
  rationale: 'Ganito ang ayos at diin ng Griyego: ang kaligtasan ng mga Judio ay inihahambing sa kaligtasan ng mga Gentil, kaya hindi ipinahihiwatig na kailangang maging Judio muna ang mga Gentil.'
- issue: Kaligtasan sa pamamagitan ng biyaya
  choice: Binabanggit lamang na ang kaligtasan ay sa pamamagitan ng biyaya ng Panginoong Jesus.
  alternative: Palawakin bilang isang pormulang doktrinal tungkol sa biyaya, pananampalataya, at mga gawa.
  rationale: Hindi dapat idagdag sa salin ang mga detalyeng hindi tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang inklusibong “tayo” dahil kabilang ang kausap na kapulungan sa pangkat na tinutukoy ni Pedro. Ang “gaya rin nila” ay natural na elipsis sa Filipino at pinananatili ang mahalagang direksiyon ng paghahambing.
