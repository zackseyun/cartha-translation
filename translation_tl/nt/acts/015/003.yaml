id: ACT.15.3
reference: Acts 15:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν προπεμφθέντες ὑπὸ τῆς ἐκκλησίας διήρχοντο τήν ⸀τε Φοινίκην καὶ Σαμάρειαν ἐκδιηγούμενοι τὴν ἐπιστροφὴν τῶν ἐθνῶν, καὶ ἐποίουν χαρὰν μεγάλην πᾶσι τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/003.yaml
  text: So then[a], having been sent on their way by the church, they passed through both Phoenicia and Samaria, describing in detail the conversion of the Gentiles[b], and they brought great joy to all the brothers.
translation:
  language: tl
  text: Kaya nga, matapos silang tulungan ng iglesya sa pagpapatuloy ng kanilang paglalakbay, dumaan sila sa Fenicia at Samaria, na detalyadong isinasalaysay ang pagbabalik-loob ng mga Hentil[a], at nagdulot sila ng malaking kagalakan sa lahat ng mga kapatid[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pagbaling ng mga Hentil.”
    reason: lexical_alternative
  - marker: b
    text: Dito, ang “mga kapatid” ay tumutukoy sa mga kapwa mananampalataya at malamang na kabilang ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: προπεμφθέντες
  choice: matapos silang tulungan ... sa pagpapatuloy ng kanilang paglalakbay
  rationale: Ipinahihiwatig ng pandiwa ang pagtulong sa mga manlalakbay upang makapagpatuloy sila, hindi lamang ang simpleng pagsusugo. Hindi rin nito labis na tinutukoy kung pisikal silang inihatid.
- source_word: ἐκκλησίας
  choice: iglesya
  rationale: Sa konteksto ng Mga Gawa, tumutukoy ito sa pamayanang Kristiyano; ang “iglesya” ang malinaw at karaniwang salin sa makabagong Filipino.
- source_word: διήρχοντο
  choice: naglakbay sila sa
  rationale: Ipinakikita ng aspektong imperpektibo ang nagpapatuloy na paglalakbay sa mga rehiyon. Likas sa Filipino ang pariralang ito.
- source_word: τήν τε Φοινίκην καὶ Σαμάρειαν
  choice: sa Fenicia at Samaria
  rationale: Magkaugnay na binabanggit ang dalawang rehiyon. Sapat na sa natural na Filipino ang “at” upang ipakita ang ugnayang iyon.
- source_word: ἐκδιηγούμενοι
  choice: Detalyado nilang isinalaysay
  rationale: Pinananatili nito ang pinatinding diwa ng masusi o ganap na pagsasalaysay.
- source_word: ἐπιστροφὴν
  choice: pagbabalik-loob
  rationale: Ito ang karaniwang Filipino para sa relihiyosong pagbaling o conversion. Pinananatili sa talababa ang mas literal na “pagbaling.”
- source_word: τῶν ἐθνῶν
  choice: ng mga Hentil
  rationale: Sa konteksto ng Gawa 15, tumutukoy ito sa mga hindi Judio na tumatanggap sa mensahe, hindi lamang sa mga bansa bilang mga politikal na pangkat.
- source_word: ἐποίουν χαρὰν μεγάλην
  choice: nagdulot sila ng malaking kagalakan
  rationale: Natural na ipinapahayag sa Filipino ang sanhi ng matinding kagalakan habang pinananatili ang diwang causative ng parirala.
- source_word: πᾶσι τοῖς ἀδελφοῖς
  choice: sa lahat ng mga kapatid
  rationale: Ang “mga kapatid” ay anyong malapit sa pinagmulan at likas ding maaaring tumukoy sa kabuuang pamayanan ng mga mananampalataya sa Filipino.
theological_decisions:
- issue: Ang kahulugan ng ἐπιστροφή kaugnay ng pagtanggap sa mga Hentil
  choice: pagbabalik-loob
  alternative: pagbaling
  rationale: Malinaw na ipinahahayag ng “pagbabalik-loob” ang relihiyosong pagbabago sa kontekstong ito nang hindi nagdaragdag ng isang tiyak na sistematikong doktrina. Ang mas literal na larawan ng pagbaling ay inilalagay sa talababa.
- issue: Ang saklaw ng ἀδελφοί sa pamayanan ng mga mananampalataya
  choice: mga kapatid
  alternative: mga kapwa mananampalataya
  rationale: Pinananatili ng “mga kapatid” ang pampamilyang katawagan ng tekstong Griyego. Sa Filipino, maaari rin itong likas na sumaklaw sa mga lalaki at babae; nililinaw ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iglesya,” “Hentil,” at “mga kapatid” bilang mga pamilyar na katawagang biblikal, habang iniwasan ang labis na teknikal o makalumang pananalita.
