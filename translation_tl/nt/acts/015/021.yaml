  source_fidelity: 'Ang draft ay wastong nagsasalin sa pangunahing daloy ng talata: ang matagal nang pag-iral, distributibong “sa bawat lungsod,” mga sinagoga, at regular na pagbasa tuwing Sabbath. Gayunman, ang “mga tagapangaral” ay hindi malinaw na naipapahayag ang tuwirang layon ng κηρύσσοντας αὐτόν (“mga nangangaral tungkol sa kanya”).'
  naturalness: Likas ang karamihan ng pananalita. Mas malinaw at mas natural sa makabagong Filipino ang pandiwang “mga nangangaral tungkol sa kanya” kaysa sa pangngalang “mga tagapangaral,” na maaaring magmukhang walang layon at hindi sapat na kumakatawan sa “him.”
  terminology: Ang “Moises,” “sinagoga,” at “Sabbath” ay angkop at marangal na mga terminong biblikal. Ang talababa ay angkop na nagpapaliwanag sa metonimikong paggamit kay Moises, ngunit dapat umayon ang literal na paglalarawan nito sa binagong pangunahing teksto.
