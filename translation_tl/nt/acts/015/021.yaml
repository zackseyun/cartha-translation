id: ACT.15.21
reference: Acts 15:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ ἐκ γενεῶν ἀρχαίων κατὰ πόλιν τοὺς κηρύσσοντας αὐτὸν ἔχει ἐν ταῖς συναγωγαῖς κατὰ πᾶν σάββατον ἀναγινωσκόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/021.yaml
  text: For from ancient generations Moses has had those who proclaim him in every city[a], being read in the synagogues every Sabbath.
translation:
  language: tl
  text: Sapagkat mula pa noong mga sinaunang salinlahi, si Moises ay may mga nangangaral tungkol sa kanya sa bawat lungsod[a], at binabasa siya sa mga sinagoga tuwing Sabbath.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “si Moises … ay may mga nangangaral tungkol sa kanya … binabasa siya.” Ang “Moises” ay kumakatawan dito sa mga isinulat o Kautusang kaugnay niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Moises
  rationale: Karaniwang anyo ng pangalang biblikal sa modernong Filipino; pinananatili ang personal na pangalan at ang metonimiya ng Griyego.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinahihiwatig na ang talata ay nagbibigay ng paliwanag o batayan sa naunang pahayag.
- source_word: ἐκ γενεῶν ἀρχαίων
  choice: mula pa noong mga sinaunang salinlahi
  rationale: Pinananatili ang temporal na diwa, ang pangmaramihang 'salinlahi,' at ang matagal nang pagpapatuloy.
- source_word: κατὰ πόλιν
  choice: sa bawat lungsod
  rationale: Likas na Filipino para sa distributibong diwang 'lungsod sa lungsod' o 'sa bawat lungsod.'
- source_word: τοὺς κηρύσσοντας αὐτὸν
  choice: mga tagapangaral
  rationale: Ang 'mga tagapangaral [ni Moises]' ay likas at maikli, at pinananatili ang diwa ng pampublikong pagpapahayag ng κηρύσσω nang hindi tahasang pinapalitan si Moises ng kanyang Kautusan.
- source_word: ἔχει
  choice: ay may
  rationale: Pinananatili ang kasalukuyang anyo ng Griyego; ang 'mula pa noong' ang nagpapahayag ng kalagayang nagsimula noong una at nagpapatuloy.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: sa mga sinagoga
  rationale: Tumutukoy sa regular na lugar ng pampublikong pagbasa.
- source_word: κατὰ πᾶν σάββατον
  choice: tuwing Sabbath
  rationale: Natural at malinaw na Filipino para sa paulit-ulit na pangyayari sa bawat Sabbath.
- source_word: ἀναγινωσκόμενος
  choice: at binabasa siya
  rationale: Pinananatili ang pasibong participyal na ideya at ang metonimikong panghalip na tumutukoy kay Moises, nang hindi nagdaragdag ng tiyak na sanhi.
theological_decisions:
- issue: Metonimikong pagtukoy kay Moises
  choice: Panatilihin ang personal na pagtukoy kay Moises at ang 'siya' sa pangunahing teksto.
  alternative: Tahasan itong isalin bilang 'Kautusan ni Moises' o 'mga isinulat ni Moises.'
  rationale: Ang Griyego ay tuwirang nagsasabing 'Moises' at 'siya.' Ang pagpapaliwanag na tumutukoy ito sa mga isinulat o Kautusang kaugnay niya ay inilalagay sa talababa upang hindi palitan ng interpretasyon ang mismong anyo ng teksto.
- issue: Ugnayan ng ἀναγινωσκόμενος sa pangunahing sugnay
  choice: Isalin bilang 'at binabasa siya,' na pinananatiling bukas ang eksaktong pang-abay na ugnayan.
  alternative: Isalin bilang 'sapagkat binabasa siya' o 'yamang binabasa siya.'
  rationale: Maaaring magpahiwatig ng paliwanag ang participle, ngunit hindi tahasang minarkahan ang sanhi; iniiwasang gawing mas tiyak kaysa sa Griyego ang ugnayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'tagapangaral' upang maging likas ang konstruksiyon sa Filipino, habang ipinaliliwanag sa talababa ang literal na metonimiya. Ang 'Sabbath' ay pinanatili bilang kilalang terminong biblikal.
