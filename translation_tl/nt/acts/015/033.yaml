  text: ποιήσαντες δὲ χρόνον ἀπελύθησαν μετ’ εἰρήνης ἀπὸ τῶν ἀδελφῶν πρὸς τοὺς ⸂ἀποστείλαντας αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/033.yaml
  text: And after spending some time there[a], they were sent off in peace from the brothers to those who had sent them.
translation:
  language: tl
  text: At matapos silang manatili roon nang ilang panahon, pinahintulutan silang umalis nang may kapayapaan ng mga kapatid[a] patungo sa mga nagsugo sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kapatid na lalaki at babae” o “mga mananampalataya.” Ang salitang Griyego ay nasa anyong panlalaking maramihan, “mga kapatid,” ngunit sa kontekstong ito ay malamang na inklusibong tumutukoy sa buong komunidad ng mga sumasampalataya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες ... χρόνον
  choice: matapos silang manatili roon nang ilang panahon
  rationale: Ang idyomang Griyego ay tumutukoy sa paggugol o pananatili sa isang lugar sa loob ng isang panahon. Idinagdag ang “roon” ayon sa konteksto ng kanilang pananatili sa Antioquia, bagaman hindi ito tahasang nasa Griyego.
- source_word: δὲ
  choice: At
  rationale: Banayad na pang-ugnay ito na nagpapatuloy sa salaysay; likas at hindi mapanghimasok ang “At” sa Filipino.
- source_word: ἀπελύθησαν
  choice: pinayaon sila
  rationale: Sa konteksto, magalang silang pinahintulutang umalis at inihatid ng komunidad, hindi pinalaya mula sa pagkakabilanggo o basta pinaalis.
- source_word: μετ’ εἰρήνης
  choice: nang may kapayapaan
  rationale: Pinananatili nito ang diwa ng mapayapang paghayo na may mabuting kalooban o basbas, nang hindi nagdaragdag ng salitang “basbas” na hindi tahasang nasa teksto.
- source_word: ἀπὸ τῶν ἀδελφῶν
  choice: ng mga kapatid
  rationale: Ang “mga kapatid” ay likas na salin ng αρσενικό na πληθυντικό na ἀδελφῶν at maaari ring gamitin nang inklusibo sa Filipino para sa buong komunidad ng mga mananampalataya.
- source_word: πρὸς τοὺς ἀποστείλαντας αὐτούς
  choice: patungo sa mga nagsugo sa kanila
  rationale: Ang parirala ay tumutukoy sa mga taong naunang nagsugo sa kanila. Hindi idinagdag ang “pabalik” upang hindi gawing tahasan sa salin ang ideyang kontekstuwal lamang.
theological_decisions:
- issue: Inklusibong saklaw ng ἀδελφοί
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae; mga mananampalataya
  rationale: Masculine plural ang anyong Griyego ngunit malamang na tumutukoy sa komunidad ng mga mananampalataya sa kabuuan. Ang “mga kapatid” sa Filipino ay tapat sa anyo at natural ding maaaring maunawaan nang inklusibo; nililinaw ito sa talababa nang hindi ipinipilit ang isang mas tiyak na pakahulugan sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinayaon” upang ipahiwatig ang magalang na pagpapaalis o paghahatid, at ang “nang may kapayapaan” upang mapanatili ang tradisyonal na diwa ng mapayapang paghayo at mabuting kalooban.
