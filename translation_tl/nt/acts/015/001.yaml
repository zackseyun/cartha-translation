base_translation:
  language: en
  yaml_path: translation/nt/acts/015/001.yaml
  text: And some men came down from Judea and were teaching the brothers[a], “Unless you are circumcised according to the custom of Moses, you cannot be saved.”
translation:
  language: tl
  text: At may ilang lalaking bumaba mula sa Judea at patuloy na nagturo sa mga kapatid[a], “Malibang magpatuli kayo ayon sa kaugalian ni Moises, hindi kayo maaaring maligtas.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, panlalaking maramihan ang salitang isinaling “mga kapatid”; malamang na tumutukoy ito rito sa buong komunidad ng mga mananampalataya, kasama ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at ang sunod-sunod na daloy ng salaysay ni Lucas.
- source_word: τινες
  choice: may ilang lalaki
  rationale: Tumutukoy ito sa di-tiyak ngunit partikular na mga taong nasa panlalaking maramihan; natural sa Tagalog ang “may ilang lalaki.”
- source_word: κατελθόντες ἀπὸ τῆς Ἰουδαίας
  choice: bumaba mula sa Judea
  rationale: Pinananatili ang pandiwang nagsasaad ng pagbaba at ang pinanggalingang lugar, sa halip na gawing payak na “nanggaling.”
- source_word: ἐδίδασκον
  choice: nagtuturo
  rationale: Ipinahihiwatig ng imperpektong aspekto ang nagpapatuloy o paulit-ulit na pagtuturo; ang “nagtuturo” ay natural at hindi nagdaragdag ng diin.
- source_word: τοὺς ἀδελφοὺς
  choice: sa mga kapatid
  rationale: Ang karaniwang salitang Tagalog na “mga kapatid” ang likas na katumbas. Hindi nito sapilitang nililimitahan ang tinutukoy sa mga lalaki, kaya nililinaw sa talababa ang anyo at gamit ng Griyego.
- source_word: Ἐὰν μὴ
  choice: Malibang
  rationale: Maikli at likas na pagpapahayag sa Tagalog ng negatibong kondisyong “unless.”
- source_word: περιτμηθῆτε
  choice: magpatuli kayo
  rationale: Ito ang natural na Tagalog para sa pagpapasailalim sa pagtutuli. Bagaman pasibo ang anyong Griyego, naipahahayag ng “magpatuli” ang pagtanggap sa gawa nang hindi nagiging mabigat o di-likas.
- source_word: τῷ ἔθει τῷ Μωϋσέως
  choice: ayon sa kaugalian ni Moises
  rationale: Ang ἔθος ay nakaugaliang gawain o kaugalian; pinananatili ng “ayon sa” ang pamantayang ipinahahayag ng pariralang datibo nang hindi dinaragdagan ng ideyang “ipinamana.”
- source_word: οὐ δύνασθε σωθῆναι
  choice: hindi kayo maaaring maligtas
  rationale: Pinananatili ng “hindi maaaring” ang tahasang ideya ng kawalan ng kakayahan sa δύνασθε, at ng “maligtas” ang soteriolohikal na diwa ng σωθῆναι sa konteksto.
theological_decisions:
- issue: Kahulugan ng σωθῆναι sa pagtatalo tungkol sa pagtutuli
  choice: maligtas
  alternative: mailigtas o mapalaya
  rationale: Ang usapin sa konteksto ay kung kailangan ang pagtutuli para sa kaligtasan. Pinananatili ng “maligtas” ang bigat ng pahayag nang hindi nagpapasok ng partikular na sistemang doktrinal.
- issue: Saklaw ng τοὺς ἀδελφοὺς
  choice: mga kapatid, na may talababa
  alternative: mga mananampalataya; mga kapatid na lalaki
  rationale: Panlalaking maramihan ang Griyego ngunit malamang na tumutukoy sa komunidad ng mga mananampalataya. Ang “mga kapatid” ay natural sa Tagalog at pinananatili ng talababa ang tunay na usaping leksikal at posibleng inklusibong gamit.
- issue: Pagpapanatili sa pahayag bilang turo ng ilang dumating mula sa Judea
  choice: tuwirang sipi nang walang paliwanag sa mismong talata
  alternative: lagyan ng panghatol o paliwanag na mali ang kanilang turo
  rationale: Iniuulat lamang ng talata ang kanilang pag-aangkin. Hindi dapat paunang lutasin ng salin ang pagtatalong bubuuin ng kasunod na salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang payak na daloy ng salaysay, ang nagpapatuloy na kilos ng pagtuturo, at ang matinding pahayag na hindi maaaring maligtas, habang iniiwasan ang tunog na sobrang teknikal o denominasyonal.
