id: ACT.15.4
reference: Acts 15:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ εἰς ⸀Ἱεροσόλυμα ⸀παρεδέχθησαν ⸀ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων, ἀνήγγειλάν τε ὅσα ὁ θεὸς ἐποίησεν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/004.yaml
  text: When they arrived in Jerusalem[a], they were welcomed by the church and the apostles and the elders, and they reported all that God had done with them.
translation:
  language: tl
  text: Pagdating nila sa Jerusalem, tinanggap sila ng iglesya, ng mga apostol, at ng mga nakatatanda. Isinalaysay nila ang lahat ng ginawa ng Diyos kasama nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pamamagitan nila” o “sa gitna nila.” Literal sa Griyego ang “kasama nila.”
    reason: Pinananatili ang maaaring saklaw ng μετ’ αὐτῶν nang hindi ipinipilit ang instrumental o lokatibong pakahulugan.
lexical_decisions:
- source_word: παραγενόμενοι δὲ εἰς Ἱεροσόλυμα
  choice: Pagdating nila sa Jerusalem
  rationale: Likas na ipinahahayag sa Tagalog ng “pagdating” ang pangyayaring nauna sa mga pangunahing pandiwa. Hindi na hiwalay na isinalin ang mahinang pang-ugnay na δέ.
- source_word: παρεδέχθησαν
  choice: tinanggap sila
  rationale: Pinananatili nito ang diwang pasibo ng malugod na pagtanggap sa kanila, nang hindi nagdaragdag ng paraang hindi tahasang sinabi sa Griyego.
- source_word: ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων
  choice: ng iglesya, ng mga apostol, at ng mga nakatatanda
  rationale: Ang ἀπό ay tumutukoy rito sa mga gumawa ng pagtanggap. Ang “iglesya” ay ang pamayanang Kristiyano, at ang “mga nakatatanda” ay likas na salin para sa kinikilalang mga pinuno nang hindi gumagamit ng katawagang nakatali sa isang denominasyon.
- source_word: ἀνήγγειλάν τε
  choice: Isinalaysay nila
  rationale: Ipinahahayag nito ang pagbibigay nila ng ulat tungkol sa mga nangyari; sapat na sa daloy ng Tagalog ang bagong pangungusap upang iugnay ito sa naunang kilos.
- source_word: ὅσα ὁ θεὸς ἐποίησεν
  choice: ang lahat ng ginawa ng Diyos
  rationale: Malawak at tuwiran ang “ginawa,” gaya ng ποιέω, at ipinakikita ng konteksto na nauna ang mga gawang ito sa kanilang pagsasalaysay.
- source_word: μετ’ αὐτῶν
  choice: kasama nila
  rationale: Ito ang pinakamalapit na salin ng μετά na may genitive at pinananatili ang pagiging bukás ng parirala kung ang diin ay pakikipag-ugnayan, pagkilos sa pamamagitan nila, o pagkilos sa gitna nila.
theological_decisions:
- issue: Ang kaugnayan ng Diyos at ng mga sugo sa pariralang μετ’ αὐτῶν
  choice: ginawa ng Diyos kasama nila
  alternative: ginawa ng Diyos sa pamamagitan nila; ginawa ng Diyos sa gitna nila
  rationale: Tinutukoy ng teksto ang Diyos bilang pangunahing kumikilos ngunit hindi nito tahasang nililimitahan ang papel ng mga sugo sa pagiging kasangkapan lamang o ang gawain sa isang lokasyon. Pinananatili ng “kasama nila” ang tensiyon at lawak ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang biblikal na “iglesya” at ang hindi denominasyonal na “mga nakatatanda.” Inilagay ang talababa sa mismong pariralang tinatalakay nito.
