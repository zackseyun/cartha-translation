    issue: Malabo ang “mga binigti.”
    rationale: Bagaman maaaring literal na tumukoy sa “mga bagay na binigti,” sa modernong Filipino mas madaling mabasa ito bilang mga taong binitay o sinakal. Dahil ang πνικτῶν ay nasa listahang may kinalaman sa pagkain at dugo, kailangang linawin sa pangunahing teksto na hayop ang tinutukoy.
  - severity: low
