  source_fidelity: Tumpak ang pangunahing pag-uuri ng apat na ipinag-uutos na iwasan, ang kondisyunal na diwa ng διατηροῦντες ἑαυτούς, ang εὖ πράξετε, at ang pangwakas na epistolaryong ἔρρωσθε. Gayunman, ang “mga binigti” sa pangunahing teksto ay maaaring karaniwang unawain bilang mga taong binigti at hindi sapat na malinaw na tumutukoy sa bagay na pangkain/hayop sa kontekstong ito.
  naturalness: Makabago at malinaw sa kabuuan. Mas natural at mas tiyak sa Filipino ang “mga hayop na binigti” para sa πνικτῶν. Ang “Kung iiwasan ninyo ang mga ito” ay mas idiomatiko kaysa “Kung iingatan ninyo ang inyong sarili mula sa mga ito,” habang pinananatili ang kondisyunal na kahulugan.
  terminology: Ang “mga diyos-diyosan,” “dugo,” at “seksuwal na imoralidad” ay angkop at pinananatili ang lawak ng Griyego. Ang talababa sa πορνεία ay wastong naghahayag ng interpretatibong posibilidad nang hindi ito ipinapataw sa pangunahing teksto.
