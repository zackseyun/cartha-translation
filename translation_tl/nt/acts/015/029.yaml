    rationale: Literal na naiimpluwensiyahan ito ng Greek construction. Ang “iiwasan ninyo ang mga ito” ay likas na Filipino at sapat na naghahatid ng diwa ng pag-iingat ng sarili laban sa mga nakalistang bagay.
