  text: ἀπέχεσθαι εἰδωλοθύτων καὶ αἵματος καὶ ⸀πνικτῶν καὶ πορνείας· ἐξ ὧν διατηροῦντες ἑαυτοὺς εὖ πράξετε. ἔρρωσθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/029.yaml
  text: to abstain from food sacrificed to idols[a], from blood, from what has been strangled, and from sexual immorality. If you keep yourselves from these things, you will do well[d][c][b]. Farewell.
translation:
  language: tl
  text: na umiwas kayo sa mga inihandog sa mga diyos-diyosan[a], sa dugo, sa mga hayop na binigti[b], at sa seksuwal na imoralidad[c]. Kung iiwasan ninyo ang mga ito, mabuti ang gagawin ninyo. Paalam.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pagkaing inihandog sa mga diyos-diyosan.”
    reason: lexical_alternative
  - marker: b
    text: O “karneng mula sa mga hayop na binigti” o “mga bagay na binigti.”
    reason: lexical_alternative
  - marker: c
    text: Maaaring unawain nang malawakan ang salitang Griyego na isinaling “seksuwal na imoralidad,” bagaman inuunawa ito ng ilang tagapagpaliwanag nang mas tiyak ayon sa mga pagbabawal sa Levitico.
    reason: alternative_reading
  - marker: d
    text: O “Manatili kayong malusog.” Ang salitang Griyego ay isang nakaugaliang pangwakas na pagbati sa liham.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθαι
  choice: umiwas kayo
  rationale: Natural at malinaw na Filipino para sa patuloy na pag-iwas o pagpipigil sa mga nakalistang bagay; ang “kayo” ay angkop sa di-tuwirang tagubiling ipinagpapatuloy ng infinitive.
- source_word: εἰδωλοθύτων
  choice: mga inihandog sa mga diyos-diyosan
  rationale: Pinananatili ang malawak na substantibong diwa ng mga bagay, lalo na pagkain o karne, na inihandog sa pagsamba sa mga diyos-diyosan nang hindi nililimitahan ang teksto sa karne lamang.
- source_word: αἵματος
  choice: dugo
  rationale: Tuwirang salin na nagpapanatili sa maikli at hindi pinalawak na anyo ng Griyego.
- source_word: πνικτῶν
  choice: mga binigti
  rationale: Tumutukoy sa mga hayop na pinatay sa pamamagitan ng pagsakal o pagbigti, kaya hindi naalis nang maayos ang dugo; pinananatili ang substantibong lawak ng salita.
- source_word: πορνείας
  choice: seksuwal na imoralidad
  rationale: Makabagong malawak na katumbas na hindi basta nililimitahan ang salita sa pakikipagtalik bago ikasal o sa isang uri lamang ng ipinagbabawal na ugnayan.
- source_word: ἐξ ὧν
  choice: mula sa mga ito
  rationale: Malinaw na ibinabalik ang tinutukoy sa buong listahan ng mga ipinagbabawal.
- source_word: διατηροῦντες ἑαυτούς
  choice: Kung iingatan ninyo ang inyong sarili
  rationale: Ipinapahayag nang natural sa Filipino ang kondisyunal na diwa ng participle habang pinananatili ang ideya ng maingat na pag-iwas.
- source_word: εὖ πράξετε
  choice: mabuti ang gagawin ninyo
  rationale: Natural na idyomang Filipino para sa paggawa ng tama o nararapat, nang hindi ito ipinakahulugang pangakong uunlad sila.
- source_word: ἔρρωσθε
  choice: Paalam
  rationale: Sa kontekstong liham, isa itong nakaugaliang pangwakas na pagbati, hindi pangunahing literal na utos na magpakalakas.
theological_decisions:
- issue: Kahulugan ng πορνεία sa pasiya ng mga apostol
  choice: seksuwal na imoralidad
  alternative: pakikiapid; mga bawal na pag-aasawa o pagsasamang kaugnay ng Levitico 18
  rationale: Maaaring malawak ang kahulugan ng termino, bagaman inuunawa ito ng ilan nang mas tiyak ayon sa konteksto ng mga pagbabawal sa Levitico. Hindi ito nililimitahan ng mismong talata, kaya pinananatili sa pangunahing teksto ang mas malawak na diwa at inilalagay sa talababa ang interpretatibong posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “diyos-diyosan,” “seksuwal na imoralidad,” at “Paalam” bilang madaling maunawaang mga anyo; iniwasan ang arkaikong “pakikiapid” sa pangunahing teksto at hindi nilimitahan ang εἰδωλοθύτων sa karne lamang.
