  naturalness: Malinaw at makabago ang karamihan ng salin. Bagaman mas markado at bahagyang mas pormal ang “Mga lalaki, mga kapatid,” ito ang pinakaligtas na paraan upang mapanatili ang dalawang bokatibo nang walang idinagdag na pangatnig o pagpapalawak.
  terminology: Wasto ang “Santiago” bilang nakaugaliang Tagalog na anyo ng Ἰάκωβος, at ang “makinig kayo sa akin” ay natural na katumbas ng ἀκούσατέ μου. Dapat iayon ang talababa sa binagong pangunahing teksto at iwasang ipakahulugan ang dalawang bokatibo bilang isang pariralang nangangahulugang “mga kapatid na lalaki.”
