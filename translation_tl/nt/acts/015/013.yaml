base_translation:
  language: en
  yaml_path: translation/nt/acts/015/013.yaml
  text: And after they became silent[a], James answered, saying, “Brothers[b], listen to me.”
translation:
  language: tl
  text: Nang tumahimik na sila[a], tumugon si Santiago, “Mga lalaki, mga kapatid,[b] makinig kayo sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Nang hindi na sila nagsalita.” Tinutukoy ng pariralang Griego ang sandaling natapos nang magsalita ang mga naunang tagapagsalita.
    reason: lexical_alternative
  - marker: b
    text: Sa Griego, literal na “Mga lalaki, mga kapatid,” isang pormal na panlalaking pagtawag. Tinutukoy nito ang mga lalaking kausap sa kapulungan bilang mga kapatid.
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς
  choice: Nang tumahimik na sila
  rationale: Ipinahahayag ng μετά kasama ang articular infinitive ang panahong kasunod ng naunang pagsasalita. Likas sa Tagalog ang “nang tumahimik na sila” at maaari itong tumukoy sa paghinto nila sa pagsasalita.
- source_word: ἀπεκρίθη
  choice: tumugon
  rationale: Ang ἀποκρίνομαι ay nangangahulugang sumagot o tumugon. Ang “tumugon” ay angkop sa pormal na daloy ng talakayan at hindi nangangailangang may tuwirang tanong muna.
- source_word: Ἰάκωβος
  choice: Santiago
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga saling Bibliya sa Tagalog para sa Ἰάκωβος sa kontekstong ito.
- source_word: λέγων
  choice: ipinahihiwatig ng tuwirang sipi pagkatapos ng “tumugon”
  rationale: Hindi na isinalin nang hiwalay ang participle na λέγων sapagkat magiging mabigat at paulit-ulit ang “tumugon ... na sinasabi.” Likas na ipinakikilala ng “tumugon” at ng panipi ang mismong sinabi.
- source_word: Ἄνδρες ἀδελφοί
  choice: Mga kapatid na lalaki
  rationale: Ang parirala ay isang pormal at tahasang panlalaking pagtawag. Sinasaklaw ng “mga kapatid na lalaki” ang diwa ng dalawang vocative nang hindi gumagamit ng di-likas na “mga lalaki, mga kapatid.”
- source_word: ἀκούσατέ μου
  choice: makinig kayo sa akin
  rationale: Tuwirang ipinapahayag ng maramihang pautos ang panawagan sa kapulungan na bigyang-pansin ang sasabihin ni Santiago.
theological_decisions:
- issue: Tahasan at panlalaking pagtawag na Ἄνδρες ἀδελφοί
  choice: Panatilihin sa pangunahing teksto bilang “Mga kapatid na lalaki”
  alternative: “Mga kapatid” o “Mga kapatid na lalaki at babae”
  rationale: Parehong panlalaki ang ἄνδρες at ἀδελφοί. Pinananatili ng salin ang anyo ng tuwirang pagtawag nang hindi nagdaragdag ng “at babae,” habang inililinaw sa talababa ang saklaw ng tagpo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Inalis ang hiwalay na salin ng λέγων upang maiwasan ang di-likas na pag-uulit, ngunit pinanatili ang pormal na tono at ang tahasang panlalaking pagtawag ng Griego.
