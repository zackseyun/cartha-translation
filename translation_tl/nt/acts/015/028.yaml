  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔδοξεν γὰρ τῷ ⸂πνεύματι τῷ ἁγίῳ⸃ καὶ ἡμῖν μηδὲν πλέον ἐπιτίθεσθαι ὑμῖν βάρος πλὴν ⸂τούτων τῶν ἐπάναγκες⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/028.yaml
  text: For it seemed good to the Holy Spirit and to us to place on you no greater burden than these necessary things:[a][b]
translation:
  language: tl
  text: Sapagkat minabuti ng Banal na Espiritu at namin na huwag nang magpataw sa inyo ng anumang dagdag na pasanin maliban sa mga kinakailangang bagay na ito:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sapagkat ipinasiya ng Banal na Espiritu at namin.” Ang pariralang Griyego ay maaari ring isalin bilang mas tahasang pormula ng pagpapasiya.
    reason: lexical_alternative
  - marker: b
    text: O “mga pangunahing bagay na ito” o “mga kinakailangang kahilingang ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: minabuti
  rationale: Ang impersonal na anyo ng δοκέω ay isang pormula ng pinagpasiyahang mabuti. Likas sa modernong Tagalog ang “minabuti” at pinananatili nito ang deliberatibong himig nang hindi ginagawang pansariling palagay lamang ang pasiya.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: ng Banal na Espiritu
  rationale: Sa konstruksiyong Tagalog na “minabuti ng,” natural na ginagawang tagaganap ang datibong Griyego. Personal na tinutukoy ng parirala ang Banal na Espiritu.
- source_word: καὶ ἡμῖν
  choice: at namin
  rationale: Pinananatili nito ang koordinasyon ng Banal na Espiritu at ng nagsasalitang kapulungan sa iisang pormulang “minabuti ... ng/namin.”
- source_word: μηδὲν πλέον
  choice: huwag nang ... anumang dagdag na
  rationale: Ipinahahayag ng πλέον kasama ng βάρος na walang karagdagang pasaning ipapataw; natural sa Tagalog ang “huwag nang ... anumang dagdag na pasanin.”
- source_word: ἐπιτίθεσθαι
  choice: magpataw sa
  rationale: Ang “magpataw” ay malinaw at karaniwang katumbas ng paglalagay ng isang obligasyon o pasanin sa iba.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Tuwirang tinutukoy ang mga tatanggap ng ipinapataw na pasanin.
- source_word: βάρος
  choice: pasanin
  rationale: Pinananatili ng “pasanin” ang metapora para sa mga obligasyong ipinapataw sa mga mananampalatayang Hentil.
- source_word: πλὴν
  choice: maliban sa
  rationale: Ipinakikilala nito ang eksepsiyon sa negatibong pahayag tungkol sa anumang dagdag na pasanin.
- source_word: τούτων τῶν ἐπάναγκες
  choice: mga bagay na ito na kinakailangan
  rationale: Malapit ito sa Griyego at tumuturo sa mga tiyak na tagubilin sa susunod na talata nang hindi paunang nagpapasiya kung ang mga iyon ay “mahahalagang aral” o pormal na “mga kahilingan.”
theological_decisions:
- issue: Ugnayan ng Banal na Espiritu sa pasiya ng kapulungan
  choice: Inilalahad ang pasiya bilang minabuti ng Banal na Espiritu at ng apostolikong kapulungan.
  alternative: Maaaring ipakahulugan ang pahayag bilang purong pormulang retorikal ng pagkakasundong pantao.
  rationale: Pinananatili ng salin ang magkatugmang pagtukoy sa Banal na Espiritu at sa “amin,” nang hindi binabawasan ang personal na pagkilos ng Espiritu o ipinapantay lamang ito sa opinyon ng tao.
- issue: Saklaw ng pasiya para sa mga mananampalatayang Hentil
  choice: Walang karagdagang pasaning ipapataw bukod sa mga bagay na tinukoy na kinakailangan.
  alternative: Maaaring basahin ito bilang lubos na pag-aalis ng lahat ng obligasyon o bilang komprehensibong pagpapataw ng Kautusang Mosaiko.
  rationale: Pinananatili ng “anumang dagdag na pasanin ... maliban” ang limitadong saklaw at tensiyon ng teksto nang hindi nag-aangkat ng isang sistemang doktrinal tungkol sa kautusan at biyaya.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “minabuti” bilang likas na pormula ng sama-samang pasiya, “magpataw” para sa institusyonal ngunit hindi labis na teknikal na tono, at “pasanin” upang mapanatili ang metapora ng Griyego.
