  yaml_path: translation/nt/acts/015/031.yaml
  text: And when they had read it[a], they rejoiced because of its encouragement.
translation:
  language: tl
  text: Matapos nilang basahin ang sulat, nagalak sila dahil sa pagpapalakas-loob na dulot nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “nagalak sila sa panghihikayat na dulot nito” o “sa kaaliwang dulot nito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνόντες
  choice: Nang mabasa nila ang sulat
  rationale: Ang aorist participle ay nagpapahayag ng kilos na nauna sa pangunahing pandiwa. Ipinahihiwatig ng naunang talata na ang binasa ay ang sulat, kaya tahasang binanggit ito para sa natural at malinaw na Tagalog.
- source_word: δὲ
  choice: (hindi tahasang isinalin)
  rationale: Mahinang pang-ugnay ang δέ. Sapat na sa Tagalog ang temporal na pambungad na “Nang” upang maayos na maiugnay ang pangungusap sa naunang salaysay nang hindi maging pilit ang “at.”
- source_word: ἐχάρησαν
  choice: nagalak sila
  rationale: Pinananatili ng “nagalak” ang aktibong diwa at masidhing kagalakan ng χαίρω, sa isang dignified ngunit madaling maunawaang rehistro.
- source_word: ἐπὶ
  choice: dahil sa
  rationale: Sa kasamang datibo, ipinapahayag dito ng ἐπί ang sanhi o batayan ng kanilang kagalakan.
- source_word: τῇ παρακλήσει
  choice: pampalakas-loob na mensahe nito
  rationale: Malawak ang saklaw ng παράκλησις at maaaring tumukoy sa pagpapalakas-loob, panghihikayat, o kaaliwan. Ang “pampalakas-loob” ang pinakaangkop sa epekto ng sulat sa konteksto; nilinaw ng “mensahe nito” na mula sa nilalaman ng sulat ang pagpapalakas-loob.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sulat” sa halip na panghalip lamang dahil ito ang malinaw na tinutukoy sa naunang talata. Pinanatili sa talababa ang saklaw ng kahulugan ng παράκλησις.
