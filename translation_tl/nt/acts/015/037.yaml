lexical_decisions:
- source_word: Βαρναβᾶς
  choice: Bernabe
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa modernong salin ng Bibliya sa Filipino.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng pang-ugnay ang banayad na pagsalungat sa naunang mungkahi ni Pablo.
- source_word: ἐβούλετο
  choice: nais
  rationale: Likas at marangal na Filipino ito para sa pagnanais o intensiyon ni Bernabe, nang hindi pinalalabis ang diin.
- source_word: συμπαραλαβεῖν
  choice: isama
  rationale: Malinaw nitong ipinapahayag ang pagkuha sa isang tao bilang kasama ng pangkat sa paglalakbay.
- source_word: καὶ
  choice: rin
  rationale: 'Pinananatili nito ang pandagdag na diwa: nais ni Bernabe na isama pati si Juan.'
- source_word: Ἰωάννην
  choice: Juan
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: τὸν καλούμενον Μᾶρκον
  choice: na tinatawag na Marcos
  rationale: Tuwirang pinananatili ang participial na pagkakakilanlan at hindi ipinapasok sa parirala ang salitang 'rin,' yamang ang καὶ ay maaaring umugnay sa mismong layon.
- source_word: Μᾶρκον
  choice: Marcos
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Filipino.
