  yaml_path: translation/nt/acts/015/037.yaml
  text: But Barnabas wanted to take along also John[a], who was called Mark.
translation:
  language: tl
  text: Ngunit nais ni Bernabe na isama rin si Juan[a], na tinatawag na Marcos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “si Juan, na tinatawag ding Marcos.”
