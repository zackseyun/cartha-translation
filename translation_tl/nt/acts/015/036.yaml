  text: Μετὰ δέ τινας ἡμέρας εἶπεν ⸂πρὸς Βαρναβᾶν Παῦλος⸃· Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα τοὺς ⸀ἀδελφοὺς κατὰ ⸂πόλιν πᾶσαν⸃ ἐν αἷς κατηγγείλαμεν τὸν λόγον τοῦ κυρίου, πῶς ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/036.yaml
  text: After some days[a], Paul said to Barnabas, “Let us return now and visit the brothers in every city where we proclaimed the word of the Lord, and see how they are.”
translation:
  language: tl
  text: Pagkalipas ng ilang araw, sinabi ni Pablo kay Bernabe, “Bumalik tayo ngayon at dalawin ang mga kapatid[a] sa bawat lungsod kung saan ipinangaral natin ang salita ng Panginoon, at tingnan natin kung ano ang kalagayan nila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, panlalaking pangmaramihan ang salitang ginamit, ngunit maaari itong kumatawan sa buong pangkat ng mga mananampalataya, kapwa lalaki at babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δέ τινας ἡμέρας
  choice: Pagkalipas ng ilang araw
  rationale: Ipinahahayag ng μετά na may accusative na panahong lumipas bago ang sumunod na pangyayari; pinananatili ng salin ang di-tiyak na pagitan.
- source_word: εἶπεν πρὸς Βαρναβᾶν Παῦλος
  choice: sinabi ni Pablo kay Bernabe
  rationale: Natural at tuwirang paglilipat ng kilos ng pagsasalita, ng nagsasalita, at ng kausap.
- source_word: Ἐπιστρέψαντες δὴ
  choice: Bumalik tayo ngayon
  rationale: Ang participle kasama ng hortatory subjunctive ay likas na naihahayag bilang isang paanyayang sama-samang kumilos; ipinapakita ng “ngayon” ang diin ng δή.
- source_word: ἐπισκεψώμεθα
  choice: dalawin
  rationale: Tumutukoy ito sa pagpunta upang makita ang kalagayan ng mga tao nang may malasakit; hindi dinaragdagan ng salin ang tiyak na layuning hindi tahasang sinabi.
- source_word: τοὺς ἀδελφοὺς
  choice: ang mga kapatid
  rationale: Ang “mga kapatid” ay natural na saling Filipino ng panlalaking pangmaramihang terminong pampamilya at maaari ring tumukoy sa buong pangkat ng mga mananampalataya.
- source_word: κατὰ πόλιν πᾶσαν
  choice: sa bawat lungsod
  rationale: Pinananatili nito ang distributibong diwa ng κατά—bawat lungsod na napuntahan nila.
- source_word: ἐν αἷς κατηγγείλαμεν
  choice: na pinangaralan natin
  rationale: Ang καταγγέλλω ay pagpapahayag o pangangaral sa publiko; ang “pinangaralan” ay natural sa konteksto at pinananatili ang saklaw sa mga lungsod.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: ng salita ng Panginoon
  rationale: Pinananatili ang tradisyonal at eksaktong ugnayan ng λόγος at κύριος nang hindi nililimitahan kung ang genitive ay pag-aari o kaugnayan.
- source_word: πῶς ἔχουσιν
  choice: kung ano na ang kalagayan nila
  rationale: Natural na Filipino para sa idyomang nagtatanong kung kumusta o nasa anong kalagayan sila, habang nananatiling marangal ang rehistro.
theological_decisions:
- issue: Saklaw ng ἀδελφοί sa malamang na halo-halong kasarian na pangkat
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae; mga mananampalataya
  rationale: Sa Filipino, ang “kapatid” ay hindi minamarkahan ang kasarian kaya tumpak nitong naihahayag ang terminong pampamilya at ang malamang na saklaw sa buong pamayanang Kristiyano. Nililinaw sa talababa ang anyong panlalaki ng Griyego upang hindi maitago ang datos ng pinagmulan.
- issue: Salin ng κύριος
  choice: Panginoon
  alternative: Guro; Panginoong Jesus
  rationale: Ang “Panginoon” ang tuwiran at karaniwang salin; hindi idinaragdag ang pangalang “Jesus,” na hindi tahasang nasa talata.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “Bernabe,” “lungsod,” “pinangaralan,” at “kalagayan” upang maging malinaw sa karaniwang mambabasa nang hindi nagiging labis na kolokyal. Inilagay ang marker na [a] kaagad pagkatapos ng “mga kapatid.”
