    text: Sa Griyego, panlalaking pangmaramihan ang salitang ginamit, ngunit maaari itong kumatawan sa buong pangkat ng mga mananampalataya, kapwa lalaki at babae.
    reason: lexical_alternative
  revision_rationale: Inayos ang sugnay na tumutukoy sa mga lungsod upang malinaw na ang “salita ng Panginoon” ang ipinangaral sa mga lugar na iyon, gaya ng Griyegong ἐν αἷς κατηγγείλαμεν τὸν λόγον τοῦ κυρίου. Inalis din ang hindi kinakailangang “na” sa paglalarawan ng kanilang kalagayan. Walang binagong kahulugan, pangalan, o teolohikal na termino.
