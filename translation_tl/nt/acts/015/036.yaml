- from: Pagkalipas ng ilang araw, sinabi ni Pablo kay Bernabe, “Bumalik tayo ngayon at dalawin ang mga kapatid[a] sa bawat lungsod na pinangaralan natin ng salita ng Panginoon, at tingnan natin kung ano na ang kalagayan nila.”
  to: Pagkalipas ng ilang araw, sinabi ni Pablo kay Bernabe, “Bumalik tayo ngayon at dalawin ang mga kapatid[a] sa bawat lungsod kung saan ipinangaral natin ang salita ng Panginoon, at tingnan natin kung ano ang kalagayan nila.”
