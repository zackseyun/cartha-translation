base_translation:
  language: en
  yaml_path: translation/nt/acts/015/025.yaml
  text: it seemed good to us[a], having come to one accord, to choose men and send them to you with our beloved Barnabas and Paul[b],
translation:
  language: tl
  text: Matapos kaming magkaisa[a], minabuti naming pumili ng mga lalaki[b] at isugo sila sa inyo kasama ng aming minamahal na sina Bernabe at Pablo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang maging iisa ang aming pasya” o “nang may iisang kalooban.”
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy ito sa mga lalaking sugo; tahasang “mga lalaki” ang nasa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν ἡμῖν
  choice: minabuti namin
  rationale: Likas na pormal na pananalita ito para sa isang pasyang napagkasunduan. Pinananatili nito ang diwang deliberatibo nang hindi pinatitindi bilang tahasang utos.
- source_word: γενομένοις ὁμοθυμαδόν
  choice: matapos kaming magkaisa
  rationale: Ipinahihiwatig ng participle at adverb na dumating ang pangkat sa iisang pasya; malinaw at natural itong ipinahahayag ng “matapos kaming magkaisa.”
- source_word: ἐκλεξαμένοις
  choice: pumili
  rationale: Kaugnay ito ng pasyang ipinahayag sa “minabuti namin” at natural na bumubuo sa magkahanay na kilos na “pumili … at isugo.”
- source_word: ἄνδρας
  choice: mga lalaki
  rationale: Ang ἀνήρ ay tumutukoy rito sa mga lalaking nasa hustong gulang, at ayon sa konteksto ay sina Judas at Silas. Hindi ito ginawang pangkalahatang “mga tao.”
- source_word: πέμψαι πρὸς ὑμᾶς
  choice: isugo sila sa inyo
  rationale: Ang “sila” ay malinaw na tumutukoy sa mga lalaking pinili at kinakailangan para sa natural na pangungusap sa Filipino.
- source_word: σὺν
  choice: kasama ng
  rationale: Tuwirang ipinahahayag ang pagsama o accompaniment sa natural na Filipino.
- source_word: τοῖς ἀγαπητοῖς ἡμῶν
  choice: minamahal naming
  rationale: Pinananatili nito ang magiliw ngunit marangal na paglalarawan sa relasyon ng mga sumulat kina Bernabe at Pablo.
- source_word: Βαρναβᾷ καὶ Παύλῳ
  choice: sina Bernabe at Pablo
  rationale: Ginamit ang karaniwang anyo ng mga pangalan sa makabagong Bibliyang Filipino, kasama ang panandang “sina” na angkop sa dalawang pangalan ng tao.
theological_decisions:
- issue: Sama-samang tono ng pagpapasya sa liham mula sa Jerusalem
  choice: minabuti namin
  alternative: nagpasya kami
  rationale: Ang konstruksyong may δοκέω ay nagpapahayag ng sama-samang pagsang-ayon o paghatol. Ang “minabuti namin” ay hindi nagdaragdag ng higit na mariing awtoritatibong tono kaysa sa hayag sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormal na tono ng liham at ang init ng “minamahal naming,” habang iniwasan ang labis na teknikal o makalumang pananalita.
