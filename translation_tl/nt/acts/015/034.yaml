translation:
  language: tl
  text: Ngunit minabuti ni Silas na manatili roon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wala ang talatang ito sa pinakamaagang mga manuskritong Griyego, kabilang ang Papyrus 74 mula sa ikatlong siglo at ang Sinaiticus at Vaticanus mula sa ikaapat na siglo, gayundin sa mga sinaunang salin sa wikang Coptic. Matatagpuan ito sa karamihan ng mga manuskrito sa tradisyong Byzantine, sa ilang mas huling manuskritong Alexandrian at Kanluranin, at sa mga tradisyong Latin at Siryako. Malamang na idinagdag ito ng isang tagakopya noong bandang huli upang ipaliwanag kung bakit nasa Antioquia pa si Silas upang sumama kay Pablo sa talata 40, bagaman sinasabi sa talata 33 na umalis sina Judas at Silas.
    reason: textual_critical
lexical_decisions:
- source_word: ἔδοξε … τῷ Σίλᾳ (δοκέω)
  choice: minabuti ni Silas
  rationale: Ang impersonal na δοκέω na may datibo ay nangangahulugang itinuring ng isang tao na mabuti o nararapat ang isang pasiya. Ang “minabuti ni Silas” ay likas sa makabagong Tagalog at pinananatili ang diwa ng kusang pagpapasiya nang hindi ito ginagawang mas mariin kaysa sa Griyego.
- source_word: ἐπιμεῖναι (ἐπιμένω)
  choice: na manatili
  rationale: Tumutukoy ito sa patuloy na pananatili sa isang lugar; malinaw at dignified ang “manatili” sa kontekstong ito.
- source_word: αὐτοῦ
  choice: roon
  rationale: Ginamit bilang pang-abay na panlunan at tumutukoy sa Antioquia sa konteksto.
- source_word: δέ
  choice: Ngunit
  rationale: Ipinahihiwatig ng konteksto ang pagsalungat sa naunang pag-alis ng mga isinugo; ang “Ngunit” ay natural na naghahayag ng ugnayang iyon.
