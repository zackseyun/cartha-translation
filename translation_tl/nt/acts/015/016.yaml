- from: “Pagkatapos ng mga bagay na ito, babalik ako, at muli kong itatayo ang bumagsak na tolda ni David[a]; muli kong itatayo ang mga nawasak na bahagi nito, at ibabangon ko itong muli.[b]”
  to: “Pagkatapos ng mga pangyayaring ito, babalik ako, at muli kong itatayo ang bumagsak na tolda ni David[a]; muli kong itatayo ang mga guho nito, at itatayo ko itong muli.[b]”
  rationale: 'Pinakinis ang Tagalog nang hindi binabago ang saklaw o pagkakasunod ng Griyego: pinananatili ang plural na temporal na parirala, ang metapora ng tolda, ang pag-uulit ng “muling pagtatayo,” ang mga guho bilang mga bagay na winasak, at ang huling larawan ng pagtatayo nang tuwid. Ginawang mas maingat ang talababa upang hindi nito ipakahulugan nang lubusan ang metapora.'
