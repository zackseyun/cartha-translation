    issue: Hindi likas ang "Pagkatapos ng mga bagay na ito."
    rationale: Bagaman literal, hindi ito karaniwang modernong Tagalog para sa temporal na paglipat. Ang "Pagkatapos ng mga pangyayaring ito" ay natural at pinananatili ang plural na demonstratibo.
  - severity: low
    issue: May di-kinakailangang pag-uulit ng "muli" sa pangwakas na sugnay.
    rationale: Ang ἀνορθώσω ay "itatayo/ibabangon" o "ipapanumbalik"; ang dagdag na "muli" ay hindi tahasang nasa pandiwa at nababawasan ang masining na pagkakaiba nito sa naunang ἀνοικοδομήσω.
  - severity: low
