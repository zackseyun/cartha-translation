  text: Μετὰ ταῦτα ἀναστρέψω καὶ ἀνοικοδομήσω τὴν σκηνὴν Δαυὶδ τὴν πεπτωκυῖαν καὶ τὰ ⸀κατεσκαμμένα αὐτῆς ἀνοικοδομήσω καὶ ἀνορθώσω αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/016.yaml
  text: After these things I will return[a], and I will rebuild the fallen tent of David; I will rebuild its ruins, and I will restore it[b],
translation:
  language: tl
  text: “Pagkatapos ng mga pangyayaring ito, babalik ako, at muli kong itatayo ang bumagsak na tolda ni David[a]; muli kong itatayo ang mga guho nito, at itatayo ko itong muli.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tabernakulo ni David.” Ang salitang Griyego ay maaaring mangahulugang “tolda” o “tabernakulo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “tolda ni David” ay isang propetikong metapora na maaaring tumukoy sa pagpapanumbalik na kaugnay ng angkan o kaharian ni David.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Pagkatapos ng mga bagay na ito
  rationale: Pinananatili nito ang pangmaramihang demonstratibo at ang temporal na paglipat sa sipi, habang nananatiling malinaw sa makabagong Tagalog.
- source_word: ἀναστρέψω
  choice: babalik ako
  rationale: Sa kontekstong ito, ang pandiwa ay nangangahulugang pagbabalik, at pinananatili ng salin ang pangako ng Diyos sa unang panauhan.
- source_word: ἀνοικοδομήσω
  choice: muli kong itatayo
  rationale: Ipinahahayag nito ang muling pagtatayo o pagpapanumbalik ng isang nawasak na estruktura sa natural na Tagalog.
- source_word: σκηνὴν Δαυὶδ
  choice: tolda ni David
  rationale: Ang σκηνή ay literal na tolda o tabernakulo. Pinananatili ng “tolda” ang metapora nang hindi ito tuwirang ipinapakahulugang ang dinastiya o kaharian ni David.
- source_word: τὴν πεπτωκυῖαν
  choice: ang bumagsak
  rationale: Ipinakikita ng perfect participle ang kalagayang bunga ng pagbagsak; malinaw at maikli itong naihahayag ng “bumagsak.”
- source_word: τὰ κατεσκαμμένα αὐτῆς
  choice: ang mga nawasak na bahagi nito
  rationale: Tumutukoy ang pangmaramihang perfect passive participle sa mga bahaging winasak o ibinagsak. Mas natural ito kaysa literal na “mga guho nito” bilang layon ng “itatayo.”
- source_word: ἀνορθώσω
  choice: ibabangon ko itong muli
  rationale: Pinananatili nito ang larawan ng muling pagtindig o pag-aayos sa bumagsak na tolda at iniiwasang gawing mas abstrakto ang pandiwa.
- source_word: αὐτήν
  choice: ito
  rationale: Tumutukoy ang panghalip sa tolda; “ito” ang natural na panghalip para sa isang bagay sa Tagalog.
theological_decisions:
- issue: Metaporikal na diwa ng “tolda ni David”
  choice: Panatilihin ang metapora bilang “tolda ni David.”
  alternative: “sambahayan ni David,” “dinastiya ni David,” o “kaharian ni David”
  rationale: Maaaring tumukoy ang propetikong larawan sa pagpapanumbalik na kaugnay ng angkan o paghahari ni David, ngunit hindi tuwirang pinangalanan ng Griyego ang interpretasyong iyon. Kaya pinananatili sa pangunahing teksto ang tunay na metapora at inililinaw lamang sa talababa ang posibleng tinutukoy nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang anyo ng propetikong sipi, ang pag-uulit ng pangakong muling pagtatayo, at ang kongkretong larawan ng bumagsak na toldang muling ibinabangon.
