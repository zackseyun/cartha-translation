  text: καὶ τούτῳ συμφωνοῦσιν οἱ λόγοι τῶν προφητῶν, καθὼς γέγραπται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/015.yaml
  text: 'And with this the words of the prophets agree[a], just as it is written:'
translation:
  language: tl
  text: 'At kaayon nito ang mga salita ng mga propeta, gaya ng nasusulat:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Likas na pang-ugnay ito sa Filipino at ipinagpapatuloy ang pangangatwiran ni Santiago.
- source_word: τούτῳ
  choice: nito
  rationale: Pinananatili nitong malawak ang pagtukoy ng panghalip sa naunang pahayag o pangyayari, nang hindi tinutukoy nang labis kung ano mismo ang tinutukoy.
- source_word: συμφωνοῦσιν
  choice: kaayon
  rationale: Malinaw at natural na ipinahahayag nito na ang mga salita ng mga propeta ay kasang-ayon o katugma ng naunang sinabi.
- source_word: οἱ λόγοι
  choice: ang mga salita
  rationale: Tuwirang tumutukoy sa mga pahayag ng mga propeta na nakasulat sa Kasulatan.
- source_word: τῶν προφητῶν
  choice: ng mga propeta
  rationale: Natural na anyong paari o pinagmulan sa Filipino.
- source_word: καθὼς
  choice: gaya ng
  rationale: Ipinakikita ang pagkakatugma ng pahayag sa susunod na sipi sa Kasulatan.
- source_word: γέγραπται
  choice: nasusulat
  rationale: Karaniwan, marangal, at tumpak na pormula sa Filipino para sa pagsipi sa Kasulatan; naipahihiwatig din ang nananatiling bisa ng naisulat.
theological_decisions:
- issue: Tinutukoy ng τούτῳ sa talumpati ni Santiago
  choice: Isinaling “nito,” na tumutukoy nang malawakan sa naunang pahayag o pangyayari.
  alternative: Tahasang tukuyin bilang pagbabalik-loob ng mga Hentil, pahayag ni Pedro, o layunin ng Diyos.
  rationale: Hindi espesipikong pinangalanan ng Griyego ang tinutukoy, kaya pinananatili ng salin ang tunay na lawak at kalabuan nito.
translation_notes:
  register: Modernong Filipino na natural, maikli, at marangal. Ang “kaayon nito” ay mas idiomatiko kaysa sa literal na “sumasang-ayon dito” kapag ang simuno ay “mga salita,” habang pinananatili ang diin ng nauunang τούτῳ.
