  text: kilala mula pa noong sinaunang panahon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas buong mababasa sa ilang manuskrito: “kilala mula pa sa kawalang-hanggan” o “na siyang nagpapakilala ng mga bagay na ito mula pa noong sinaunang panahon.”'
    reason: textual_variant
lexical_decisions:
- source_word: γνωστὰ
  choice: kilala
  rationale: Pang-uring ginagamit bilang panaguri sa sugnay na walang tahasang pandiwa. Ang “kilala” ang tuwiran at likas na salin; hindi nito idinaragdag ang pandiwang diwang nasa “ipinaalam.”
- source_word: ἀπ’
  choice: mula pa noong
  rationale: Ipinapahayag ng ἀπό ang panimulang punto sa panahon. Likas sa modernong Tagalog ang “mula pa noong” sa ganitong maikling pahayag.
- source_word: αἰῶνος
  choice: unang panahon
  rationale: Sa idyomang ito, maaaring tumukoy ang αἰών sa napakatagal nang nakaraan o sinaunang panahon. Pinananatili ng “unang panahon” ang temporal na diwa nang hindi ito tiyak na ginagawang “walang hanggan.”
theological_decisions:
- issue: Saklaw ng panahon ng pagkakilala ng Diyos sa maikling sugnay
  choice: Isinalin bilang pagkakilala mula pa noong unang panahon, nang hindi pinalalawak tungo sa tahasang pahayag tungkol sa walang-hanggang paunang kaalaman.
  alternative: “kilala mula pa sa walang hanggan” o “na siyang nagpapakilala ng mga bagay na ito mula pa noong unang panahon”
  rationale: 'Napakaikli ng teksto ng SBLGNT: γνωστὰ ἀπ’ αἰῶνος. Dapat panatilihin ang ikli at tunay na posibilidad ng kahulugan nito, habang inilalagay sa talababa ang mas mahahabang pagbasa ng ibang manuskrito.'
translation_notes:
  register: Maikli, marangal, at natural na modernong Tagalog; pinanatili ang putol at siksik na anyo ng Griyegong sugnay dahil bahagi ito ng nagpapatuloy na pangungusap.
