  text: And there arose such a sharp disagreement that they separated from one another[a], and Barnabas took Mark and sailed away to Cyprus,
translation:
  language: tl
  text: At nagkaroon ng matinding pagtatalo[a], kaya naghiwalay sila sa isa’t isa. Isinama ni Bernabe si Marcos at naglayag patungong Ciprus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matinding pag-aalitan.” Ang salitang Griyego ay maaari ring tumukoy sa matinding sagupaan o pag-uudyok.
