lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: At nagkaroon
  rationale: Natural na panimulang salaysay sa Filipino na nagpapakilala sa sumunod na pangyayari nang hindi pinalalakas ang banayad na pang-ugnay na δέ.
- source_word: παροξυσμὸς
  choice: napakatinding pagtatalo
  rationale: Ipinahahayag ang matindi at tahasang hidwaan sa konteksto, hindi lamang panloob na pagkainis o simpleng di-pagkakasundo.
- source_word: ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων
  choice: kaya naghiwalay sila
  rationale: Likas na Filipino para sa resultang ipinahahayag ng ὥστε at sa gantihang pagkakahiwalay na tinutukoy ng ἀπ’ ἀλλήλων.
- source_word: τόν τε Βαρναβᾶν
  choice: Isinama ni Bernabe
  rationale: Ang τε ay nagpapasimula sa unang kaugnay na kilos matapos ang paghihiwalay; ginawang hiwalay na pangungusap upang maging malinaw at natural sa Filipino.
- source_word: παραλαβόντα τὸν Μᾶρκον
  choice: Isinama ni Bernabe si Marcos
  rationale: Ang παραλαμβάνω rito ay nangangahulugang pagsama o pagdadala ng isang kasama; pinananatili ang pangalang Marcos lamang gaya ng Griyego.
- source_word: ἐκπλεῦσαι εἰς Κύπρον
  choice: naglayag patungong Ciprus
  rationale: Ipinahahayag ang pag-alis sa pamamagitan ng paglalayag at ang destinasyong Ciprus sa malinaw na modernong Filipino.
theological_decisions:
- issue: Paglalarawan sa alitan ng mga magkatuwang sa gawaing apostoliko
  choice: napakatinding pagtatalo
  alternative: matinding di-pagkakasundo
  rationale: Hindi pinalalambot o hinahatulan ng salin ang tunay at matinding alitan nina Pablo at Bernabe; inilalahad lamang nito ang tensiyong nasa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at pasalaysay. Ginamit ang karaniwang mga anyong pangalang Bernabe, Marcos, at Ciprus. Pinanatili ang kuwit sa dulo dahil nagpapatuloy ang pangungusap sa kasunod na talata.
