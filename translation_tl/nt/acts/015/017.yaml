base_translation:
  language: en
  yaml_path: translation/nt/acts/015/017.yaml
  text: so that the remnant of mankind may seek the Lord[a], even all the Gentiles on whom my name has been called, says the Lord[c][b], who does these things
translation:
  language: tl
  text: upang hanapin ng nalalabing sangkatauhan ang Panginoon, at upang hanapin din siya ng lahat ng mga Hentil[a] na sa kanila ay itinawag ang aking pangalan[b], sabi ng Panginoon[c] na gumagawa ng mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng mga bansa.” Maaaring mangahulugan ang salitang Griyego ng “mga Hentil” o “mga bansa.”
    reason: alternative_reading
  - marker: b
    text: Sa literal, “na sa kanila ay itinawag ang aking pangalan.” Maaari ring isalin, “na tinatawag sa aking pangalan.” Ang idyomang ito ay nagpapahiwatig ng pagkakaugnay o pagkakakilanlan sa pangalan ng Panginoon.
    reason: lexical_alternative
  - marker: c
    text: Umaalingawngaw ang linyang ito sa Amos 9:12 ayon sa anyong makikita sa Griyegong Kasulatan, kung saan binibigyang-diin ang mga bansa o mga Hentil na nagtataglay ng pangalan ng Panginoon.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπως ἂν
  choice: upang
  rationale: Likas na panandang Filipino para sa layunin o nilalayong bunga ng sugnay na may pasakali.
- source_word: ἐκζητήσωσιν
  choice: hanapin
  rationale: Tumpak at natural na salin ng masidhing pandiwang ‘humanap’; hindi ipinilit sa pangunahing teksto ang posibleng diin ng unlaping ἐκ-.
- source_word: οἱ κατάλοιποι τῶν ἀνθρώπων
  choice: ang nalalabing sangkatauhan
  rationale: Pinananatili ng ‘nalalabi’ ang diwa ng mga naiwan at ang alingawngaw ng siping propetiko, samantalang kolektibo at hindi nakatali sa kasarian ang ‘sangkatauhan.’
- source_word: τὸν κύριον
  choice: ang Panginoon
  rationale: Karaniwan, marangal, at malinaw na katumbas ng κύριος sa konteksto ng sipi mula sa Kasulatan.
- source_word: πάντα τὰ ἔθνη
  choice: lahat ng mga Hentil
  rationale: Sa agarang konteksto ng kapulungan sa Jerusalem, tumutukoy ito sa mga hindi Judio; inilagay sa talababa ang posibleng ‘mga bansa.’
- source_word: ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς
  choice: na tinawag sa aking pangalan
  rationale: Natural na Filipino na nagpapahayag ng pagkakakilanlan at pag-aari sa banal na pangalan, habang hindi lubusang pinapawi ang di-karaniwang idyoma ng Griyego.
- source_word: λέγει κύριος
  choice: sabi ng Panginoon
  rationale: Natural na pormulang propetiko sa Filipino at pinananatili ang Kasulatan bilang buhay na pahayag.
- source_word: ποιῶν ταῦτα
  choice: na gumagawa ng mga bagay na ito
  rationale: Malinaw na iniuugnay ang kasalukuyang pandiwari sa Panginoon at pinananatili ang kaniyang pagkilos.
theological_decisions:
- issue: Kahulugan ng ἔθνη sa usapin ng pagtanggap sa mga hindi Judio
  choice: mga Hentil
  alternative: mga bansa
  rationale: Ang agarang talakayan sa Gawa 15 ay ang pagtanggap sa mga hindi Judio, kaya ‘mga Hentil’ ang pinakamalinaw sa konteksto. Gayunman, tunay na saklaw ng salita ang ‘mga bansa,’ kaya pinanatili iyon sa talababa.
- issue: Saklaw ng οἱ κατάλοιποι τῶν ἀνθρώπων
  choice: ang nalalabing sangkatauhan
  alternative: ang iba pa sa sangkatauhan
  rationale: Pinananatili ng ‘nalalabi’ ang propetikong tensiyon ng isang natirang pangkat, sa halip na gawing payak lamang na ‘iba pa,’ at hindi ginagawang panlalaki ang pangkalahatang pagtukoy.
- issue: Idyoma ng banal na pangalan
  choice: na tinawag sa aking pangalan
  alternative: na tinatawag na aking bayan
  rationale: Hindi tahasang idinagdag sa Griyego ang ‘aking bayan.’ Ang napiling salin ay nagpapanatili ng ugnayan sa pangalan at pag-aari nang hindi ipinapasok ang isang paliwanag sa pangunahing teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘Hentil’ dahil pamilyar ito sa bokabularyong biblikal at eksakto sa konteksto; iniwasan ang labis na literal na ayos na magiging alanganin sa Filipino. Inilagay ang lahat ng pananda ng talababa sa mismong teksto.
