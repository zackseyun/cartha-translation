lexical_decisions:
- source_word: διὸ
  choice: Kaya
  rationale: Ipinapakita nito ang kongklusyong hinango ni Santiago mula sa naunang pangangatwiran at natural ito sa modernong Filipino.
- source_word: ἐγὼ κρίνω
  choice: ang pasya ko ay
  rationale: Pinananatili ang tahasang unang panauhan at ipinahahayag ang isang pinag-isipang pasya, hindi basta pansariling palagay.
- source_word: μὴ παρενοχλεῖν
  choice: huwag nating pahirapan
  rationale: Ipinahahayag ang praktikal at pangkalahatang mungkahi ni Santiago na huwag silang dulutan ng sagabal o di-kinakailangang hirap.
- source_word: τοῖς ἀπὸ τῶν ἐθνῶν
  choice: ang mga mula sa mga Hentil
  rationale: Pinananatili ang personal na pagtukoy at ang diwa ng pinagmulan sa mga bansang hindi Judio.
- source_word: ἐθνῶν
  choice: mga Hentil
  rationale: Sa kontekstong Judio-Kristiyano, tumutukoy ito sa mga taong hindi Judio; ang 'mga Hentil' ang malinaw at kinikilalang katumbas.
- source_word: ἐπιστρέφουσιν
  choice: na nanunumbalik
  rationale: Pinananatili ang larawang pandiwa ng pagharap o pagbaling sa Diyos at ang aspektong nagpapatuloy ng kasalukuyang participle.
- source_word: ἐπὶ τὸν θεόν
  choice: sa Diyos
  rationale: Natural na Filipino para sa direksiyon ng pagbaling na ipinahahayag ng parirala.
theological_decisions:
- issue: Kung pansariling opinyon lamang ni Santiago o isang mungkahing pasya para sa kapulungan ang pangungusap
  choice: ang pasya ko ay huwag nating pahirapan
  alternative: hinahatulan kong huwag pahirapan
  rationale: Tahasang pinananatili ang personal na pasya ni Santiago, habang ang 'nating' ay nagpapakita ng praktikal na mungkahi niya sa buong kapulungan nang hindi ginagawang utos lamang sa iba.
- issue: Kung ang ἐπιστρέφουσιν ay dapat isaling teknikal na 'nagkokumberte'
  choice: nanunumbalik sa Diyos
  alternative: nagbabalik-loob sa Diyos
  rationale: Iniiwasan ang mas teknikal o denominasyonal na pananalita at pinananatili ang larawan ng pagbaling patungo sa Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Hentil' bilang karaniwang terminong biblikal para sa hindi Judio, at iniwasan ang masyadong teknikal na wika tungkol sa pagbabalik-loob.
