  text: Therefore I judge that we should not trouble those from among the Gentiles who are turning to God[b][a],
translation:
  language: tl
  text: Kaya ang pasya ko[b] ay huwag nating pahirapan ang mga taong mula sa hanay ng mga Hentil[a] na bumabaling sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
