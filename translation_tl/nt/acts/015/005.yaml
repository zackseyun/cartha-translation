  text: ἐξανέστησαν δέ τινες τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων πεπιστευκότες, λέγοντες ὅτι δεῖ περιτέμνειν αὐτοὺς παραγγέλλειν τε τηρεῖν τὸν νόμον Μωϋσέως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/005.yaml
  text: But some of those from the party of the Pharisees who had believed stood up[a], saying that it is necessary to circumcise them and to command them to keep the law of Moses.
translation:
  language: tl
  text: Ngunit tumayo ang ilang sumampalataya na kabilang sa pangkat ng mga Pariseo[a] at nagsabi, “Kailangang tuliin sila at utusang sundin ang Kautusan ni Moises.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sekta ng mga Pariseo.” Ang salitang Griyego rito ay tumutukoy sa isang kinikilalang pangkat o paaralan, hindi kinakailangang sa “erehiya” sa kalaunang teknikal na kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν
  choice: tumayo
  rationale: Likas na nagsasaad ng pagtayo upang magsalita sa kapulungan, nang hindi dinaragdagan ang tindi ng kilos.
- source_word: τινες
  choice: ang ilan
  rationale: Tuwirang katumbas ng di-tiyak na pangmaramihang panghalip; hindi nagdaragdag ng kasariang hindi tahasang nasa Griyego.
- source_word: τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων
  choice: sa mga mula sa pangkat ng mga Pariseo
  rationale: Ang αἵρεσις dito ay kinikilalang pangkat o paaralan, hindi ‘erehiya’ sa kalaunang teknikal na kahulugan.
- source_word: πεπιστευκότες
  choice: na sumampalataya
  rationale: 'Pinananatili ang pandiwang diwa ng perfect participle: naganap na ang pagsampalataya at nananatili ang kalagayang bunga nito.'
- source_word: λέγοντες
  choice: at sinabi
  rationale: Natural na salaysay sa Filipino para sa participleng nagpapakilala sa nilalaman ng kanilang sinabi, nang walang idinagdag na diin gaya ng ‘iginiit.’
- source_word: δεῖ
  choice: Kailangang
  rationale: Pinananatili ang di-personal na pahayag ng pangangailangan at hindi tinutukoy kung kanino nagmumula ang sinasabing obligasyon.
- source_word: περιτέμνειν αὐτούς
  choice: tuliin sila
  rationale: Direkta at natural na katumbas ng aktibong infinitive at layon nito.
- source_word: παραγγέλλειν
  choice: utusang
  rationale: Ipinapakita ang awtoritatibong lakas ng pandiwa; mas matindi kaysa simpleng ‘turuan’ ngunit hindi labis na marahas.
- source_word: τε τηρεῖν
  choice: sundin
  rationale: Sa konteksto ng kautusan, malinaw at natural na ipinahahayag ang patuloy na pagtalima; ang pang-ugnay ay isinama sa ugnayang ‘at utusang.’
- source_word: τὸν νόμον Μωϋσέως
  choice: ang Kautusan ni Moises
  rationale: Tuwirang genitive construction; ang malaking titik sa ‘Kautusan’ ay tumutukoy sa kinikilalang Kautusan ni Moises.
theological_decisions:
- issue: Kahulugan ng αἵρεσις sa konteksto ng pangkat na Judio
  choice: pangkat
  alternative: sekta
  rationale: Ang salita rito ay tumutukoy sa kinikilalang grupo sa loob ng Judaismo. Iniiwasan ng ‘pangkat’ ang posibleng mapanghamak o kalaunang teknikal na diwa ng ‘sekta’ o ‘erehiya.’
- issue: Lakas at aspekto ng πεπιστευκότες
  choice: na sumampalataya
  alternative: na mga mananampalataya
  rationale: Pinananatili ng pandiwang anyo ang tahasang pahayag na sumampalataya sila habang patuloy na hinihingi ang pagtutuli at pagsunod sa Kautusan; hindi nilulutas ang teolohikal na tensiyon sa pamamagitan ng isang katawagang pangkat lamang.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang ‘Pariseo,’ ‘Kautusan,’ at ‘Moises’ bilang karaniwang anyo sa Bibliyang Tagalog. Ang talababa ay inilagay sa πεπιστευκότες upang maipakita ang nagpapatuloy na kalagayang ipinahihiwatig ng perfect participle.
