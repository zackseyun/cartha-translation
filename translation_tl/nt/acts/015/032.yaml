  text: Ἰούδας τε καὶ Σιλᾶς, καὶ αὐτοὶ προφῆται ὄντες, διὰ λόγου πολλοῦ παρεκάλεσαν τοὺς ἀδελφοὺς καὶ ἐπεστήριξαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/032.yaml
  text: Judas and Silas[a], who were themselves prophets, encouraged the brothers at length and strengthened them.
translation:
  language: tl
  text: Sina Judas at Silas, na mga propeta rin, ay nagpalakas ng loob sa mga kapatid[a] sa pamamagitan ng mahabang pananalita at nagpatatag sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay “mga kapatid” na nasa panlalaking anyo, ngunit maaari itong tumukoy sa buong pamayanan ng mga mananampalataya, kasama ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας
  choice: Judas
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa Bagong Tipan sa Filipino.
- source_word: τε καὶ
  choice: at
  rationale: Likas na pinag-uugnay sa Filipino ang dalawang pangalan sa payak na “at,” habang napapanatili ang malapit na koordinasyon.
- source_word: Σιλᾶς
  choice: Silas
  rationale: Ito ang nakasanayang transliterasyon ng pangalan sa Filipino.
- source_word: καὶ αὐτοὶ προφῆται ὄντες
  choice: na sila mismo ay mga propeta
  rationale: Pinananatili ng “sila mismo” ang diin ng αὐτοὶ, at ipinapahayag ng sugnay ang paliwanag na kalagayan nina Judas at Silas.
- source_word: προφῆται
  choice: mga propeta
  rationale: Tuwiran at karaniwang katumbas ito ng terminong Griyego nang hindi pinahihina ang tungkulin.
- source_word: διὰ λόγου πολλοῦ
  choice: matagal ... sa pamamagitan ng kanilang pananalita
  rationale: Ipinahihiwatig ng parirala ang malawakan o mahabang pasalitang paglilingkod; natural itong ipinahayag sa Filipino nang hindi ikinukulong sa literal na “maraming salita.”
- source_word: παρεκάλεσαν
  choice: nagpalakas ng loob
  rationale: Saklaw nito ang paghikayat at pampatibay na angkop sa konteksto ng paglilingkod sa kapuwa mananampalataya.
- source_word: τοὺς ἀδελφοὺς
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay likas na salin ng ἀδελφοί sa Filipino at maaari ring tumukoy sa buong pamayanang mananampalataya nang hindi kailangang magdagdag ng kasarian sa pangunahing teksto.
- source_word: ἐπεστήριξαν
  choice: pinatatag sila
  rationale: Ipinakikita nito ang pagpapalakas o pagpapatibay at pinananatiling bukod sa naunang pagkilos na “nagpalakas ng loob.”
theological_decisions:
- issue: Saklaw ng τοὺς ἀδελφοὺς sa pamayanang maaaring binubuo ng mga lalaki at babae
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga mananampalataya
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, madalas itong gamitin para sa buong pamayanang Kristiyano. Ang “mga kapatid” sa Filipino ay tapat sa larawang pampamilya at natural na hindi tiyak sa kasarian; nililinaw ng talababa ang posibleng saklaw.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang “mga propeta” bilang tuwirang terminong teolohikal, at pinag-iba ang “nagpalakas ng loob” at “pinatatag” upang maipakita ang dalawang magkahiwalay na kilos.
