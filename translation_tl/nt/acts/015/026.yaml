  text: ἀνθρώποις παραδεδωκόσι τὰς ψυχὰς αὐτῶν ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/026.yaml
  text: men who have given up their lives for the name of our Lord Jesus the Messiah[a][b].
translation:
  language: tl
  text: mga lalaking isinapanganib ang kanilang buhay alang-alang sa pangalan ng Panginoon nating si Jesus na Mesiyas.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ipinaubaya ang kanilang buhay”; isang pahayag na nangangahulugang inilantad nila ang sarili sa panganib na ikamatay.'
    reason: lexical_alternative
  - marker: b
    text: 'Griyego: “Jesus Christos.” Ang Christos ay titulong nangangahulugang “Mesiyas” o “Pinahiran.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνθρώποις
  choice: mga lalaking
  rationale: Tumutukoy ito kina Bernabe at Pablo sa naunang sugnay. Bagaman maaaring pangkalahatan ang ἄνθρωπος, tiyak na mga lalaki ang tinutukoy rito.
- source_word: παραδεδωκόσι
  choice: isinapanganib
  rationale: Ang perpektong pandiwaring ito mula sa παραδίδωμι ay literal na may diwang ‘ipinaubaya’ o ‘ibinigay.’ Kasama ng ‘kanilang buhay,’ ipinahihiwatig nitong inilantad nila ang sarili sa panganib na ikamatay, hindi na talagang namatay sila.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: ang kanilang buhay
  rationale: Sa kontekstong ito, ang ψυχή ay tumutukoy sa buhay ng tao, hindi partikular sa di-materyal na ‘kaluluwa.’
- source_word: ὑπὲρ
  choice: alang-alang sa
  rationale: Malinaw at natural nitong ipinahahayag ang dahilan o kapakanang tinutukoy ng ὑπέρ na may genitive.
- source_word: τοῦ ὀνόματος
  choice: sa pangalan
  rationale: Pinananatili ang biblikal na ‘pangalan,’ na maaaring sumaklaw sa persona, karangalan, at kapangyarihan ng tinutukoy.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ng Panginoon nating
  rationale: Ang ‘Panginoon’ ang kinikilalang salin ng κύριος at pinananatili ang bigat ng titulong ginagamit para kay Jesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: si Jesus na Mesiyas
  rationale: Pangalan ang Ἰησοῦ, samantalang ang Χριστός ay titulong nangangahulugang ‘Mesiyas’ o ‘Pinahiran.’ Natural sa Filipino ang ‘Jesus na Mesiyas’ sa ganitong pagkakaugnay.
theological_decisions:
- issue: Lakas ng παραδεδωκόσι τὰς ψυχὰς αὐτῶν
  choice: isinapanganib ang kanilang buhay
  alternative: isinuko ang kanilang buhay
  rationale: Hindi sinasabi ng konteksto na namatay na sina Bernabe at Pablo. Iniiwasan ng napiling salin ang maling pahiwatig ng aktuwal na kamatayan habang pinananatili ang diwa ng pagharap sa nakamamatay na panganib.
- issue: Pagpapakahulugan sa Χριστοῦ bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Isinasalin ang kahulugan ng titulong Χριστός sa halip na ituring itong apelyido o isa lamang bahagi ng pangalan. Ang talababa ay nagpapanatili ng ugnayan sa nakaugaliang anyong ‘Cristo.’
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinili ang likas na idyomang “isinapanganib ang kanilang buhay” upang maging malinaw sa karaniwang mambabasa nang hindi ipinahihiwatig na talagang namatay ang mga tinutukoy. Ang parirala ay bahagi ng pangungusap na nagsisimula sa naunang talata.
