  text: ἀλλὰ ἐπιστεῖλαι αὐτοῖς τοῦ ⸀ἀπέχεσθαι τῶν ἀλισγημάτων τῶν εἰδώλων καὶ τῆς πορνείας καὶ ⸀τοῦ πνικτοῦ καὶ τοῦ αἵματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/020.yaml
  text: but to write to them to abstain from the pollutions of idols[a], and from sexual immorality, and from what has been strangled[c][b], and from blood.
translation:
  language: tl
  text: Sa halip, sumulat sa kanila na umiwas sa mga karumihang kaugnay ng mga diyus-diyosan[a], sa seksuwal na imoralidad[b], sa hayop na binigti[c], at sa dugo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga karumihang dulot ng mga diyus-diyosan.” Ginagawang mas tiyak ito ng ilang salin bilang “pagkaing inihandog sa mga diyus-diyosan,” ngunit mas malawak ang salitang Griyego rito.
    reason: lexical_alternative
  - marker: b
    text: O “pakikiapid.” Maaaring tumukoy ang salitang Griyego sa seksuwal na imoralidad sa malawak na diwa; inuunawa naman ito ng ilan dito bilang partikular na ipinagbabawal na mga pagsasama.
    reason: alternative_reading
  - marker: c
    text: Literal na “ang binigti”; tumutukoy ito sa hayop na pinatay nang hindi pinatulo nang maayos ang dugo nito.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιστεῖλαι
  choice: sulatan
  rationale: Tumutukoy ito sa pagpapadala ng nakasulat na tagubilin sa konteksto ng liham ng konseho sa Jerusalem. Ang “sulatan” ay natural sa Tagalog at pinananatili ang diwang pasulat.
- source_word: ἀπέχεσθαι
  choice: umiwas sa
  rationale: Malinaw at likas na ipinapahayag ng “umiwas sa” ang kusang paglayo o hindi pakikibahagi sa mga nakalistang bagay.
- source_word: ἀλισγημάτων
  choice: mga karumihan
  rationale: Ang salita ay tumutukoy sa pagdungis o karumihan, lalo na sa kontekstong panrelihiyon. Hindi ito nilimitahan sa isang partikular na uri ng pagkain.
- source_word: τῶν εἰδώλων
  choice: kaugnay ng mga diyus-diyosan
  rationale: Ipinapakita nito ang ugnayan ng mga karumihan sa mga diyus-diyosan nang hindi labis na tinutukoy kung ang ibig sabihin ay pagkain lamang na inihandog sa kanila.
- source_word: πορνείας
  choice: seksuwal na imoralidad
  rationale: Makabago at malinaw itong panumbas na nagpapanatili sa malawak na saklaw ng terminong Griyego, sa halip na limitahan ito sa pakikipagtalik bago ang kasal.
- source_word: τοῦ πνικτοῦ
  choice: karne ng hayop na binigti
  rationale: Bagaman literal na “ang binigti,” ipinahihiwatig ng konteksto ang hayop na pinatay nang hindi pinatulo nang maayos ang dugo. Ginagawang malinaw ng salin ang tinutukoy sa natural na Tagalog.
- source_word: τοῦ αἵματος
  choice: dugo
  rationale: Pinananatili ng payak na “dugo” ang maikli at hindi labis na tinukoy na pananalita ng Griyego.
theological_decisions:
- issue: Saklaw ng pagbabawal na kaugnay ng mga diyus-diyosan
  choice: “mga karumihang kaugnay ng mga diyus-diyosan”
  alternative: “pagkaing inihandog sa mga diyus-diyosan”
  rationale: Mas malawak ang ἀλισγημάτων τῶν εἰδώλων kaysa sa tiyak na terminong ginagamit para sa pagkaing inihandog sa mga diyus-diyosan. Pinananatili ng salin ang mas malawak na diwa.
- issue: Kahulugan ng πορνεία sa utos ng mga apostol
  choice: “seksuwal na imoralidad”
  alternative: “pakikiapid” o “mga ipinagbabawal na ugnayang seksuwal”
  rationale: Maaaring tumukoy ang salita sa seksuwal na kasalanan sa pangkalahatan o, ayon sa ilang pagbasa sa kontekstong ito, sa partikular na ipinagbabawal na mga pagsasama. Hindi nilulutas ng pangunahing teksto ang usaping ito.
- issue: Katangian at tagal ng mga pagbabawal sa listahan
  choice: Inilahad lamang ang mga bagay na dapat iwasan
  alternative: Ipaliwanag ang mga ito bilang pansamantalang tuntunin sa pakikisalo o bilang permanenteng utos para sa lahat
  rationale: Hindi ipinapaliwanag ng talata mismo ang buong layunin o tagal ng mga pagbabawal, kaya hindi nagdagdag ang salin ng konklusyong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “diyus-diyosan,” “seksuwal na imoralidad,” at “binigti” bilang mga salitang madaling maunawaan ngunit angkop sa pormal na pagbasa ng Kasulatan. Pinanatili ang lapad at mga hindi tiyak na aspekto ng Griyego sa pamamagitan ng mga talababa.
