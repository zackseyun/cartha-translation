id: ACT.15.10
reference: Acts 15:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: νῦν οὖν τί πειράζετε τὸν θεόν, ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον τῶν μαθητῶν ὃν οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς ἰσχύσαμεν βαστάσαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/010.yaml
  text: Now then[c][b][a], why are you testing God by putting a yoke on the neck of the disciples that neither our fathers nor we have been able to bear?
translation:
  language: tl
  text: Kaya ngayon, bakit ninyo sinusubok ang Diyos[a] sa pamamagitan ng paglalagay ng pamatok[b] sa leeg ng mga alagad—isang pamatok na hindi nakayang pasanin ng aming mga ninuno[c] ni namin?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “inilalagay ang Diyos sa pagsubok.”
    reason: lexical_alternative
  - marker: b
    text: Ang “pamatok” ay metapora para sa isang ipinapataw na obligasyon; sa konteksto, tumutukoy ito sa mga kahilingang ipinapataw sa mga alagad.
    reason: cultural_note
  - marker: c
    text: Sa literal, “aming mga ama,” na tumutukoy rito sa mga ninuno o naunang salinlahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Kaya ngayon
  rationale: Likas na ipinahahayag sa modernong Tagalog ang parehong transisyon at lohikal na bunga ng νῦν οὖν.
- source_word: τί πειράζετε τὸν θεόν
  choice: bakit ninyo sinusubok ang Diyos
  rationale: Pinananatili ang retorikal na tanong at ang diwa ng πειράζω bilang pagsubok o paglalagay sa Diyos sa pagsubok.
- source_word: ἐπιθεῖναι
  choice: sa pamamagitan ng paglalagay
  rationale: Ipinakikita na ang paglalagay ng pamatok ang paraan o nilalaman ng pagsubok sa Diyos.
- source_word: ζυγὸν
  choice: pamatok
  rationale: Pinananatili ang malinaw na metapora ng isang ipinapataw na obligasyon sa halip na ipalit agad ang interpretasyong “pasanin” o “kautusan.”
- source_word: ἐπὶ τὸν τράχηλον τῶν μαθητῶν
  choice: sa leeg ng mga alagad
  rationale: Tuwirang salin na nagpapanatili sa matingkad na larawan at natural pa rin sa Tagalog.
- source_word: ὃν
  choice: isang pamatok na
  rationale: Inuulit ang tinutukoy upang maging malinaw at natural ang kaugnay na sugnay sa Tagalog.
- source_word: οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς
  choice: hindi ... ng aming mga ninuno ni namin
  rationale: Ang “mga ninuno” ay natural at malinaw na tumutukoy sa naunang mga salinlahi; pinananatili ang kapwa negatibong paghahambing.
- source_word: ἰσχύσαμεν βαστάσαι
  choice: nakayang pasanin
  rationale: Likas na Tagalog para sa kakayahang magdala o magtiis sa pamatok, habang pinananatili ang metapora.
theological_decisions:
- issue: Saklaw ng metaporang “pamatok”
  choice: Pinanatili bilang metapora ng ipinapataw na obligasyon nang hindi tahasang tinutukoy kung ito ang buong Kautusan ni Moises o isang mas makitid na pangkat ng mga kahilingan.
  alternative: Ipaliwanag sa pangunahing teksto bilang buong Kautusan ni Moises, o bilang pagtutuli at mga kaugnay na kahilingan.
  rationale: Ang konteksto ay tungkol sa mga kahilingang ipinapataw sa mga alagad, ngunit hindi espesipikong nilulutas ng talata mismo ang eksaktong saklaw ng “pamatok.”
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang biblikal na terminong “mga alagad” at ang matingkad na metaporang “pamatok,” habang ginamit ang “mga ninuno” bilang pinakanatural na pagtukoy sa mga naunang salinlahi.
