  terminology: Ang “Diyos,” “mga alagad,” at “pamatok” ay angkop sa marangal ngunit modernong rehistro. Ang “mga ninuno” sa pangunahing teksto ay natural na salin ng πατέρες sa historikal na diwa, habang wastong ipinapaliwanag ng talababa ang literal na “mga ama.”
