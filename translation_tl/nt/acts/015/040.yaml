  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παῦλος δὲ ἐπιλεξάμενος Σιλᾶν ἐξῆλθεν παραδοθεὶς τῇ χάριτι τοῦ ⸀κυρίου ὑπὸ τῶν ἀδελφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/040.yaml
  text: But Paul chose Silas and departed[b][a], having been commended by the brothers to the grace of the Lord.
translation:
  language: tl
  text: Ngunit pinili ni Pablo si Silas at umalis, matapos na ipagkatiwala ng mga kapatid si Pablo[a] sa biyaya ng Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ihabilin” o “ipaubaya sa biyaya ng Panginoon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinapakita nito ang bahagyang pagsalungat sa pag-alis ni Bernabe sa naunang talata.
- source_word: ἐπιλεξάμενος
  choice: pinili
  rationale: Likas at tuwirang ipinapahayag na personal na pinili ni Pablo si Silas bago siya umalis.
- source_word: Σιλᾶν
  choice: Silas
  rationale: Ginamit ang nakasanayang anyo ng personal na pangalan sa Filipino.
- source_word: ἐξῆλθεν
  choice: umalis
  rationale: Sa salaysay ng paglalakbay, nangangahulugan itong umalis o humayo; ang “umalis” ay malinaw at natural sa modernong Filipino.
- source_word: παραδοθεὶς
  choice: matapos siyang ipagkatiwala
  rationale: Ipinapahayag ng pasibong pandiwari na ipinagkatiwala si Pablo ng komunidad sa pangangalagang kaugnay ng biyaya ng Panginoon, nang hindi inaalis ang saklaw na “ihabilin” o “ipaubaya.”
- source_word: τῇ χάριτι
  choice: sa biyaya
  rationale: Pinananatili ang mahalagang teolohikal na pangngalang χάρις bilang “biyaya,” sa halip na paliitin ito sa isang paliwanag gaya ng “mapagpalang pangangalaga.”
- source_word: τοῦ κυρίου
  choice: ng Panginoon
  rationale: Tapat sa karaniwang titulong κύριος at hindi tinutukoy nang higit sa mismong teksto kung ang tahasang tinutukoy ay si Jesus o ang Diyos.
- source_word: ὑπὸ τῶν ἀδελφῶν
  choice: ng mga kapatid
  rationale: Ang “mga kapatid” ang likas na salin sa Filipino at maaari ring tumukoy sa buong komunidad ng mga mananampalataya, babae man o lalaki.
theological_decisions:
- issue: Tinutukoy ng “Panginoon”
  choice: Panginoon
  alternative: Panginoong Jesus; Diyos
  rationale: Hindi tahasang tinutukoy ng Griyego kung sino ang tinutukoy ng κύριος, kaya pinanatili ang antas ng katiyakan ng orihinal.
- issue: Saklaw ng “mga kapatid”
  choice: mga kapatid, na may paliwanag sa talababa
  alternative: mga kapatid na lalaki; mga mananampalataya
  rationale: Ang ἀδελφῶν ay anyong panlalaking maramihan sa Griyego ngunit maaari itong tumukoy sa mas malawak na komunidad. Sa Filipino, natural na maaaring maging inklusibo ang “mga kapatid,” at nililinaw ito sa talababa.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Pinanatili ang “biyaya” at “Panginoon” bilang mahahalagang terminong teolohikal, habang iniwasang tukuyin nang higit sa Griyegong teksto ang tinutukoy ng “Panginoon.”
