  naturalness: Natural ang rehistro at karamihan ng mga salita. Ang tahasang pagbanggit muli kay Pablo sa pasibong sugnay ay bahagyang mas malinaw at mas natural kaysa sa panghalip na may posibleng maling sanggunian.
