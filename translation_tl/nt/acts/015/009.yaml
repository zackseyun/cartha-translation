  yaml_path: translation/nt/acts/015/009.yaml
  text: And he made no distinction between us and them[a], having cleansed their hearts by faith.
translation:
  language: tl
  text: At hindi siya gumawa ng anumang pagtatangi sa pagitan natin at nila, matapos niyang linisin ang kanilang mga puso sa pamamagitan ng pananampalataya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pananampalataya.” Maaaring ipahayag ng datibong Griyego ang paraan o kasangkapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐθὲν διέκρινεν
  choice: hindi siya gumawa ng anumang pagtatangi
  rationale: Natural na idyomang Filipino ito para sa diwang ‘hindi nagtakda o gumawa ng pagkakaiba,’ at pinananatili ang tahasang pagkakaila ng Griyego.
- source_word: μεταξὺ ἡμῶν τε καὶ αὐτῶν
  choice: sa atin at sa kanila
  rationale: Sa pariralang ‘gumawa ng pagtatangi,’ likas sa Filipino ang ‘sa atin at sa kanila’ upang ipahayag ang dalawang pangkat na hindi pinag-iba.
- source_word: τῇ πίστει
  choice: sa pamamagitan ng pananampalataya
  rationale: 'Ipinapahayag nito ang malamang na instrumental na gamit ng datibo: pananampalataya bilang paraan o kasangkapan ng paglilinis.'
- source_word: καθαρίσας
  choice: yamang nilinis niya
  rationale: Inilalahad ang aorist participle bilang kaugnay na batayan o kasabay na katibayan ng pangunahing pahayag, nang hindi labis na pinipirmi ang eksaktong ugnayang temporal.
- source_word: τὰς καρδίας αὐτῶν
  choice: ang kanilang mga puso
  rationale: Ang ‘mga puso’ ay pamilyar at marangal na katumbas ng καρδίαι, na tumutukoy sa panloob na pagkatao at hindi lamang sa damdamin.
theological_decisions:
- issue: Kahulugan at gamit ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala
  rationale: Ang ‘pananampalataya’ ang karaniwang katumbas sa kontekstong teolohikal na ito. Hindi hinihingi ng talata ang ‘katapatan,’ at hindi rin dapat paliitin ang kahulugan sa sikolohikal na pagtitiwala lamang.
- issue: Ugnayan ng καθαρίσας sa κύριος na pandiwa
  choice: yamang nilinis niya
  alternative: pagkatapos niyang linisin
  rationale: 'Maaaring ipahiwatig ng aorist participle ang naunang kilos, ngunit ang ‘yamang’ ay nagpapanatili rin sa lohikal na ugnayan: ang paglilinis sa kanilang mga puso ang nagpapakitang walang ginawang pagtatangi ang Diyos.'
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘pagtatangi’ bilang malinaw at karaniwang salita para sa pagkakaiba ng pagtrato sa mga pangkat; iniwasan ang mas teknikal o mas mabigat na ‘diskriminasyon.’
