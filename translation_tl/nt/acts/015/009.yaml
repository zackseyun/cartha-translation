  source_fidelity: 'Tumpak ang pangunahing diwa ng draft: walang ginawang pagtatangi ang Diyos sa dalawang pangkat, at nilinis niya ang puso ng mga Gentil sa pamamagitan ng pananampalataya. Ngunit ang “yamang” ay tahasang nagdaragdag ng ugnayang sanhi na hindi ipinapahayag ng aorist participle na καθαρίσας. Mas ligtas na ipakita ito bilang naunang kaugnay na kilos.'
