  verdict: revise
  source_fidelity: Ang pangunahing kinakailangang ayos ay ang ἐν ὑμῖν, na nangangahulugang “sa gitna ninyo/among you,” hindi “mula sa inyo.” Ang binagong ayos ay malinaw na ipinapakitang si Pedro ang pinili ng Diyos sa gitna ng kausap na pangkat. Napananatili ang pagkakasunod ng “marinig” at “sumampalataya.”
  naturalness: Natural at marangal ang “Sa gitna ninyo ako pinili ng Diyos” sa modernong Filipino Tagalog. Ang iba pang mga pahayag, kabilang ang “mahabang pagtatalo,” “mga unang araw,” at “sa pamamagitan ng aking bibig,” ay malinaw at angkop sa rehistro ng salaysay at talumpati.
  terminology: Ang “Mga kapatid,” “mga Hentil,” “ebanghelyo,” at “sumampalataya” ay matatag at angkop na mga terminong Filipino. Inayos ang unang talababa upang tumpak na ilarawan ang literal na anyo ng Griyegong pantawag bilang “Mga lalaki, mga kapatid,” sa halip na “Mga lalaking kapatid,” na maaaring mangahulugang mga kapatid na biologically lalaki.
  issues:
  - severity: medium
    issue: Ang “pumili ang Diyos mula sa inyo” ay hindi tumpak na salin ng ἐν ὑμῖν.
    rationale: Ang ἐν ay “sa/sa gitna/among,” samantalang ang “mula sa” ay nagpapahiwatig ng pinagmulan o paghihiwalay. Ang “Sa gitna ninyo ako pinili ng Diyos” ay pinananatili ang kahulugan at malinaw na inilalahad ang ipinahihiwatig na si Pedro ang pinili.
  - severity: low
    issue: Hindi tumpak ang paglalarawan sa literal na anyo ng Ἄνδρες ἀδελφοί sa talababa a.
    rationale: Mas malapit sa anyong Griyego ang “Mga lalaki, mga kapatid” kaysa “Mga lalaking kapatid.” Ang huli ay maaaring maunawaan bilang paglalarawan sa kasarian ng mga kapatid, hindi bilang kumbensiyonal na dobleng pantawag.
