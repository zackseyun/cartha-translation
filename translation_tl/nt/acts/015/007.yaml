  to: Matapos ang mahabang pagtatalo, tumayo si Pedro at sinabi sa kanila, “Mga kapatid,[a] alam ninyo na noong mga unang araw[b] ay sa gitna ninyo ako pinili ng Diyos upang sa pamamagitan ng aking bibig ay marinig ng mga Hentil[c] ang salita ng ebanghelyo at sumampalataya.”
