  text: πολλῆς δὲ ⸀ζητήσεως γενομένης ἀναστὰς Πέτρος εἶπεν πρὸς αὐτούς· Ἄνδρες ἀδελφοί, ὑμεῖς ἐπίστασθε ὅτι ἀφ’ ἡμερῶν ἀρχαίων ⸂ἐν ὑμῖν ἐξελέξατο ὁ θεὸς⸃ διὰ τοῦ στόματός μου ἀκοῦσαι τὰ ἔθνη τὸν λόγον τοῦ εὐαγγελίου καὶ πιστεῦσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/007.yaml
  text: And after much debate had taken place[a], Peter stood up and said to them, “Brothers[c][b], you know that from ancient days God chose among you that through my mouth the Gentiles should hear the word of the gospel and believe.”
translation:
  language: tl
  text: Matapos ang mahabang pagtatalo, tumayo si Pedro at sinabi sa kanila, “Mga kapatid,[a] alam ninyo na noong mga unang araw[b] ay sa gitna ninyo ako pinili ng Diyos upang sa pamamagitan ng aking bibig ay marinig ng mga Hentil[c] ang salita ng ebanghelyo at sumampalataya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Mga lalaki, mga kapatid.” Panlalaking maramihan ang tawag sa Griyego; ang “Mga kapatid” ay natural na tawag sa kapulungan at maaaring kumatawan sa mas malawak na pangkat.
    reason: lexical_alternative
  - marker: b
    text: O “mula pa noong unang panahon.”
    reason: lexical_alternative
  - marker: c
    text: O “mga bansa.” Dito, tumutukoy ito sa mga taong hindi Judio.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῆς ... ζητήσεως γενομένης
  choice: Matapos ang mahabang pagtatalo
  rationale: Ipinahahayag ng genitive absolute ang naunang pangyayari. Ang “pagtatalo” ay natural sa Filipino at angkop sa seryosong pagtalakay na may hindi pagkakasundo, nang hindi kinakailangang magpahiwatig ng matinding alitan.
- source_word: ἀναστὰς
  choice: tumayo
  rationale: Tuwirang inilalarawan ang kilos ni Pedro bago siya nagsalita.
- source_word: Ἄνδρες ἀδελφοί
  choice: Mga kapatid
  rationale: Likas na pormula ito ng pakikipag-usap sa kapwa miyembro ng sambayanan. Pinananatili ng “Mga kapatid” ang diwang pampamilya nang hindi gumagamit ng alanganing literal na “Mga lalaking kapatid.”
- source_word: ἐπίστασθε
  choice: alam ninyo
  rationale: Tuwiran at natural na pagpapahayag ng kaalamang taglay na ng mga kausap.
- source_word: ἀφ’ ἡμερῶν ἀρχαίων
  choice: noong mga unang araw
  rationale: Sa konteksto, tumutukoy ito sa mas naunang yugto ng mga pangyayaring alam ng kapulungan, hindi sa napakalayong sinaunang panahon. Pinananatili rin sa talababa ang mas literal na posibilidad.
- source_word: ἐν ὑμῖν ἐξελέξατο ὁ θεὸς
  choice: pumili ang Diyos mula sa inyo
  rationale: Ipinakikita nito na ang pinili ng Diyos ay isang tao mula sa pangkat na kinakausap ni Pedro, habang hindi nililinaw nang higit sa sinasabi ng Griyego kung paano eksaktong nauugnay ang ἐν ὑμῖν sa pagpili.
- source_word: διὰ τοῦ στόματός μου
  choice: sa pamamagitan ng aking bibig
  rationale: Pinananatili ang matingkad na metapora ng Griyego na si Pedro ang kasangkapang nagsasalita.
- source_word: τὰ ἔθνη
  choice: mga Hentil
  rationale: Sa usapin ng kapulungan sa Jerusalem, tumutukoy ito sa mga taong hindi Judio. Nananatili sa talababa ang mas malawak na leksikal na kahulugang “mga bansa.”
- source_word: τὸν λόγον τοῦ εὐαγγελίου
  choice: ang salita ng ebanghelyo
  rationale: Malapit ito sa pormal na anyo ng parirala ni Lucas at malinaw pa rin sa karaniwang mambabasa.
- source_word: πιστεῦσαι
  choice: sumampalataya
  rationale: Ipinahahayag ang pagtugon nang may pananampalataya at kaagapay ito ng infinitibong “marinig,” nang hindi nagdaragdag ng mas masalimuot na pormulang teolohikal.
theological_decisions:
- issue: Ang panlalaking anyo ng Ἄνδρες ἀδελφοί at ang saklaw ng kausap
  choice: Mga kapatid
  alternative: Mga lalaking kapatid; Mga kapatid na lalaki at babae
  rationale: Ang “Mga kapatid” ang natural at marangal na tawag sa Filipino at hindi tahasang nagdaragdag ng “mga babae” sa anyong Griyego. Ipinaliliwanag ng talababa ang literal na panlalaking anyo at ang posibleng kinatawang saklaw nito.
- issue: Kahulugan ng τὰ ἔθνη sa konteksto ng pagpasok ng mga hindi Judio
  choice: mga Hentil
  alternative: mga bansa
  rationale: Sentral sa konteksto ang pagkakaiba ng mga Judio at hindi Judio. Kaya mas tiyak ang “mga Hentil,” habang kinikilala sa talababa ang mas malawak na kahulugan.
- issue: Saklaw ng pagpili sa ἐν ὑμῖν ἐξελέξατο ὁ θεός
  choice: pumili ang Diyos mula sa inyo
  alternative: pumili ang Diyos sa gitna ninyo
  rationale: Ang “mula sa inyo” ay natural na nagpapahiwatig na si Pedro ang pinili mula sa pangkat, ngunit hindi nito pinalalawak ang pahayag tungo sa doktrina ng pagpili na lampas sa agarang tungkuling ipangaral sa mga Hentil.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang bahagyang pormal na mga pariralang “sa pamamagitan ng aking bibig” at “salita ng ebanghelyo” upang maingatan ang retorikal at leksikal na tekstura ng Griyego. Inayos ang mga marker ayon sa pagkakasunod ng paglitaw sa pangunahing teksto.
