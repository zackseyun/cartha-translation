  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: γράψαντες διὰ χειρὸς ⸀αὐτῶν· Οἱ ἀπόστολοι καὶ οἱ ⸀πρεσβύτεροι ἀδελφοὶ τοῖς κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν ἀδελφοῖς τοῖς ἐξ ἐθνῶν χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/023.yaml
  text: 'Having written by their hand: “The apostles and the elder brothers[a], to the brothers from among the Gentiles in Antioch and Syria and Cilicia[c][b], greetings.”'
translation:
  language: tl
  text: 'Sumulat sila ng liham at ipinadala ito sa pamamagitan ng mga lalaking iyon[a]: “Ang mga apostol at ang mga nakatatandang kapatid[b], para sa mga kapatid[c] mula sa mga Hentil sa Antioquia, Siria, at Cilicia: Pagbati.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa pamamagitan nila.” Literal sa Griyego, “sa pamamagitan ng kamay nila.” Tumutukoy ito sa paghahatid ng liham sa pamamagitan ng mga lalaking pinili sa naunang talata.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring basahin bilang “mga matatanda, mga kapatid.” Maraming salin ang bumabasa rito bilang “ang mga apostol at ang mga matatanda, mga kapatid,” samantalang ang Griyego ay mas likas na mababasang “mga nakatatandang kapatid.”
    reason: alternative_reading
  - marker: c
    text: Ang “mga kapatid” dito ay maaaring tumukoy nang pangkalahatan sa mga kapwa mananampalataya—sa buong komunidad, kasama ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψαντες
  choice: Sumulat sila
  rationale: Ang aorist participle ay tumutukoy sa ginawa nilang pagsulat bilang kasunod na hakbang sa salaysay. Ginawang ganap na pandiwa sa Filipino upang maging natural habang nananatili ang kilos ng pagsulat.
- source_word: διὰ χειρὸς αὐτῶν
  choice: sa pamamagitan ng kamay ng mga ito
  rationale: Pinananatili ang larawang nasa idyomang Griyego at ang pagtukoy sa mga lalaking inatasang maghatid ng liham; ipinaliliwanag sa talababa ang mas likas na diwang ‘sa pamamagitan nila’ o ‘ipinaabot sa kanila.’
- source_word: ἀπόστολοι
  choice: mga apostol
  rationale: Karaniwan at kinikilalang katawagan sa Filipino para sa mga awtorisadong sugo at pinuno ng unang iglesya.
- source_word: πρεσβύτεροι ἀδελφοὶ
  choice: mga nakatatandang kapatid
  rationale: Sinusundan nito ang pinakamalapit na ugnayang sintaktiko ng πρεσβύτεροι at ἀδελφοί, nang hindi ginagawang tiyak na ikatlong pangkat ang ‘mga kapatid.’ Dahil maaari ring unawain ang parirala bilang ‘mga matatanda, mga kapatid,’ inilalahad ang alternatibo sa talababa.
- source_word: ἀδελφοῖς
  choice: mga kapatid
  rationale: Ang ‘mga kapatid’ ay likas sa Filipino, hindi nakatali sa kasariang gramatikal, at angkop na katawagan sa magkakapananampalataya; nililinaw sa talababa na maaaring saklaw nito ang buong komunidad, kasama ang mga babae.
- source_word: τοῖς ἐξ ἐθνῶν
  choice: mula sa mga Hentil
  rationale: Ipinahahayag ang pinagmulan o pagkakabilang ng mga tatanggap mula sa mga bansang hindi Judio, ayon sa ἐξ na may genitive.
- source_word: χαίρειν
  choice: Pagbati
  rationale: Ito ang nakaugaliang pambungad ng liham, hindi isang utos na magsaya.
- source_word: κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν
  choice: na nasa Antioquia, Siria, at Cilicia
  rationale: Likas na ipinahahayag sa Filipino ang lokasyon o pagkakabahagi ng mga tatanggap sa tatlong pinangalanang lugar.
theological_decisions:
- issue: Ugnayan ng πρεσβύτεροι at ἀδελφοί sa pagkakakilanlan ng mga nagpadala
  choice: mga nakatatandang kapatid
  alternative: mga matatanda, mga kapatid
  rationale: Walang ikalawang pantukoy bago ang ἀδελφοί, kaya maaaring basahin itong malapit na kaugnay o appositional sa πρεσβύτεροι. Gayunman, hindi ganap na isinasara ng Griyego ang karaniwang pagbasa na ‘ang mga matatanda, mga kapatid’; pinananatili ang tensiyong ito sa talababa.
- issue: Saklaw ng ἀδελφοῖς sa komunidad ng mga mananampalataya
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae
  rationale: Ang salitang Filipino na ‘kapatid’ ay likas na maaaring tumukoy sa anumang kasarian. Nananatili ang pamilyang talinghaga ng Griyego at nililinaw na maaaring kasama ang kababaihan sa tinutukoy na buong komunidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormal na anyo ng pambungad-liham at ang idyomang “sa pamamagitan ng kamay,” habang ang mga hindi agad likas o sintaktikong hindi tiyak na bahagi ay ipinaliwanag sa maiikling talababa.
