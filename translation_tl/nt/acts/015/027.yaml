base_translation:
  language: en
  yaml_path: translation/nt/acts/015/027.yaml
  text: Therefore we have sent Judas and Silas[b][a], who themselves will report the same things by word of mouth.
translation:
  language: tl
  text: Kaya isinugo namin sina Judas at Silas, na sila mismo ang magpapahayag nang pasalita ng mga bagay ding ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na «sa pamamagitan ng salita»; ibig sabihin, ipahahayag nila nang pasalita ang parehong nilalaman bilang karagdagan sa nakasulat na liham.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστάλκαμεν
  choice: isinugo namin
  rationale: Ang aspektong perpekto ay nagpapahiwatig ng naganap na pagsusugo na may kaugnayan pa sa kasalukuyan; sa natural na Tagalog, sapat itong naihahatid ng «isinugo namin» sa konteksto ng liham.
- source_word: οὖν
  choice: Kaya
  rationale: Natural at malinaw na nagpapakita ng kongklusyon mula sa naunang pasiya ng kapulungan.
- source_word: Ἰούδαν καὶ Σιλᾶν
  choice: sina Judas at Silas
  rationale: Ginamit ang karaniwang anyong Tagalog para sa dalawang pangalan ng tao.
- source_word: αὐτοὺς
  choice: sila mismo
  rationale: Pinananatili ang diin na ang mismong mga sugo ang personal na magpapatunay sa nilalaman ng liham.
- source_word: διὰ λόγου
  choice: nang pasalita
  rationale: Likas na Tagalog para sa komunikasyong binibigkas, bilang karagdagan sa nakasulat na liham.
- source_word: ἀπαγγέλλοντας
  choice: ang magsasabi
  rationale: Ipinahahayag nang natural ang gagawin ng mga isinugo, habang pinananatili ang ugnayan ng participle kina Judas at Silas.
- source_word: τὰ αὐτά
  choice: ng gayunding mga bagay
  rationale: Direktang pinananatili ang malawak na reperensiya ng Griyego sa parehong nilalaman, sa halip na paliitin ito sa interpretatibong «mensahe».
