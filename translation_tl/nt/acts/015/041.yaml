  yaml_path: translation/nt/acts/015/041.yaml
  text: And he went through Syria and Cilicia, strengthening the churches.
translation:
  language: tl
  text: At dumaan siya sa Siria at Cilicia habang pinatatatag niya ang mga iglesya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διήρχετο
  choice: nilibot niya
  rationale: Ang imperpektong anyo ay naglalarawan ng patuloy na paglalakbay sa mga rehiyon. Natural sa Tagalog ang “nilibot” para sa pagdaan sa iba’t ibang lugar, nang hindi labis na tinutukoy ang tagal.
- source_word: δὲ
  choice: At
  rationale: Banayad na pang-ugnay ito na nagpapatuloy sa salaysay; “At” ang payak at natural na katumbas.
- source_word: Συρίαν
  choice: Siria
  rationale: Karaniwang anyong Tagalog ng pangalan ng rehiyon.
- source_word: Κιλικίαν
  choice: Cilicia
  rationale: Karaniwang transliterasyon sa Tagalog ng pangalan ng rehiyon.
- source_word: ἐπιστηρίζων
  choice: na pinatatatag
  rationale: Ipinapakita ng pandiwaring ito ang kasabay na gawain ng pagbibigay-lakas at pagpapatibay upang manatiling matatag ang mga mananampalataya; mas malawak ito kaysa emosyonal na pagpapalakas-loob lamang.
- source_word: ἐκκλησίας
  choice: mga iglesya
  rationale: Sa konteksto ng Mga Gawa, tumutukoy ito sa mga lokal na pamayanan ng mga Cristiano. Ang “mga iglesya” ay malinaw, natural, at karaniwang gamit sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang maikling daloy ng salaysay at ang ugnayan ng paglalakbay sa pagpapatatag ng mga lokal na iglesya.
