base_translation:
  language: en
  yaml_path: translation/nt/acts/015/024.yaml
  text: Since we have heard that some went out from us and troubled you with words[a], unsettling your souls, to whom we gave no instructions[b],
translation:
  language: tl
  text: Dahil nabalitaan namin na ginulo kayo ng ilang umalis mula sa amin sa pamamagitan ng kanilang mga salita at nilito ang inyong kalooban[a]—mga taong hindi namin inutusan[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang inyong mga kaluluwa”; tumutukoy ito sa inyong panloob na pagkatao, hindi lamang sa damdamin.
    reason: lexical_alternative
  - marker: b
    text: O “hindi kami nagbigay sa kanila ng anumang tagubilin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ ἠκούσαμεν
  choice: Dahil nabalitaan namin
  rationale: Natural na panimulang sanhi sa Filipino; ipinahihiwatig ng “nabalitaan” na nakarating sa kanila ang ulat at mahalaga ito sa kasalukuyang liham.
- source_word: τινὲς ἐξ ἡμῶν ἐξελθόντες
  choice: ang ilan na umalis mula sa amin
  rationale: Pinananatili ang pinagmulan at pag-alis ng mga taong tinutukoy, nang hindi ipinahihiwatig na awtorisado sila.
- source_word: ἐτάραξαν ὑμᾶς λόγοις
  choice: ginulo kayo ... sa pamamagitan ng kanilang mga salita
  rationale: Inihahayag ang kaguluhan o pagkabalisa na dulot ng kanilang sinabi at pinananatili ang instrumental na diwa ng λόγοις.
- source_word: ἀνασκευάζοντες τὰς ψυχὰς ὑμῶν
  choice: nilito nila ang inyong kalooban
  rationale: Sa kontekstong ito, ang bihirang ἀνασκευάζω ay tumutukoy sa matinding paggulo o pagwasak sa panloob na katatagan; ang “kalooban” ay likas na Filipino para sa panloob na pagkatao, hindi lamang emosyon.
- source_word: οἷς οὐ διεστειλάμεθα
  choice: gayong hindi naman namin sila inutusan
  rationale: Malinaw na itinatanggi ang utos o pahintulot ng kapulungan sa mga taong iyon. Ang “gayong” ay naghahayag ng relasyonal na pagsalungat nang hindi nagdaragdag ng bagong dahilan.
theological_decisions:
- issue: Kung tahasang ipahahayag na walang awtorisasyon ang mga manggugulo
  choice: hindi naman namin sila inutusan
  alternative: hindi kami nagbigay sa kanila ng anumang tagubilin
  rationale: Ang sugnay na Griyego ay tuwirang nagkakaila na inutusan sila ng mga nagsugo ng liham. Hindi idinaragdag kung ano mismo ang diumano'y iniutos.
- issue: Pagpapakahulugan sa τὰς ψυχὰς ὑμῶν
  choice: ang inyong kalooban
  alternative: ang inyong mga kaluluwa
  rationale: Ang ψυχή rito ay tumutukoy sa panloob na pagkatao o buhay ng mga kausap, hindi isang teknikal na pahayag tungkol sa hiwalay na sangkap ng tao; pinananatili sa talababa ang mas literal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kalooban” sa halip na mekanikal na “mga kaluluwa,” habang inilagay sa talababa ang literal na anyo. Ang pangungusap ay sadyang nagtatapos sa gitling sapagkat nagpapatuloy ang nilalaman ng liham sa kasunod na talata.
