source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν ἀπολυθέντες ⸀κατῆλθον εἰς Ἀντιόχειαν, καὶ συναγαγόντες τὸ πλῆθος ἐπέδωκαν τὴν ἐπιστολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/030.yaml
  text: So[a], after being sent off, they went down to Antioch, and after gathering the multitude[c][b], they delivered the letter.
translation:
  language: tl
  text: Kaya, matapos silang payagang umalis[a], bumaba sila sa Antioquia[b]. Tinipon nila ang kapulungan[c] at ibinigay ang sulat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matapos silang pormal na paalisin” o “matapos silang payagang humayo.” Ang salitang Griyego ay maaaring tumukoy sa pormal na pagpapahintulot na umalis o pagpapaalis sa isang pagtitipon.
    reason: lexical_alternative
  - marker: b
    text: Ang “bumaba” ay nagpapakita ng direksiyonal na diwa ng pandiwang Griyego, malamang dahil mas mataas ang kinaroroonan ng Jerusalem kaysa Antioquia.
    reason: cultural_note
  - marker: c
    text: Maaari ring “ang pangkat” o “ang kongregasyon.” Tinutukoy ng parirala ang nagkakatipong pangkat sa Antioquia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολυθέντες
  choice: matapos silang payagang umalis
  rationale: Ipinapahayag nito na pormal silang pinahintulutang umalis mula sa pagtitipon sa Jerusalem, nang hindi ipinapalagay na sila ay pinalaya mula sa pagkakabilanggo.
- source_word: κατῆλθον
  choice: bumaba sila
  rationale: Pinananatili ang direksiyonal na diwa ng pandiwa, na angkop sa paglalakbay mula sa mas mataas na Jerusalem patungong Antioquia.
- source_word: συναγαγόντες
  choice: tinipon nila
  rationale: Likas sa modernong Tagalog at malinaw na inilalarawan ang pagkilos na nauna sa pagbibigay ng sulat.
- source_word: τὸ πλῆθος
  choice: ang buong kapulungan
  rationale: Sa konteksto, tumutukoy ito sa nagkakatipong pangkat ng mga mananampalataya. Ang “kapulungan” ay mas natural kaysa “karamihan” dito, habang ang “buo” ay nagpapahiwatig sa pangkalahatang katawan nang hindi ito ginagawang teknikal na katawagan.
- source_word: ἐπέδωκαν
  choice: ibinigay
  rationale: Malinaw at natural na nagsasaad ng pormal na pag-abot ng sulat sa nagkakatipong pangkat.
- source_word: ἐπιστολήν
  choice: ang sulat
  rationale: Karaniwang modernong katumbas ito ng ἐπιστολή at hindi gumagamit ng di-kinakailangang makalumang pananalita.
