translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Iniwasan ang labis na makalumang “ipinagkaloob” at ang posibleng teknikal o denominasyonal na dating ng “iglesia/kongregasyon” sa pangunahing teksto. Inayos sa dalawang pangungusap para sa likas na daloy sa Tagalog, habang pinananatili ang pagkakasunod-sunod ng mga kilos.
