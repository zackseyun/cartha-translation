base_translation:
  language: en
  yaml_path: translation/nt/acts/015/006.yaml
  text: So the apostles and the elders gathered together to consider this matter[a][b].
translation:
  language: tl
  text: Kaya nagtipon ang mga apostol at ang mga matatanda[a] upang pag-usapan ang usaping ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga matatanda” ay tumutukoy rito sa kinikilalang mga pinuno ng iglesya, hindi lamang sa mga taong may edad.
    reason: lexical_clarification
  - marker: b
    text: 'Sa literal: “upang makita tungkol sa salitang ito.” Sa konteksto, ang “salita” ay ang usapin o paksang pinagtatalunan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνήχθησάν
  choice: nagtipon
  rationale: Bagaman pormal na pasibo ang anyong Griyego, likas itong tumutukoy rito sa sama-samang pagpupulong. Ang “nagtipon” ay natural sa modernong Tagalog at hindi nagpapahiwatig na may ibang tahasang nagtipon sa kanila.
- source_word: τε
  choice: Kaya
  rationale: Bahagyang nag-uugnay ang partikula sa naunang pagtatalo at sa sumunod na pagpupulong. Ang “Kaya” ay malinaw na nagpapakita ng daloy ng salaysay.
- source_word: ἀπόστολοι
  choice: mga apostol
  rationale: Ito ang nakasanayan at tiyak na katawagan sa kinikilalang mga apostolikong pinuno sa Mga Gawa.
- source_word: πρεσβύτεροι
  choice: mga matatanda
  rationale: Sa konteksto, tumutukoy ito sa kinikilalang mga pinuno ng pamayanan, hindi lamang sa mga lalaking may edad. Pinananatili ng salin ang biblikal na katawagan nang hindi ipinapasok ang mas huling anyo ng pamamahala ng simbahan.
- source_word: ἰδεῖν
  choice: upang pag-usapan
  rationale: Literal itong “upang makita,” ngunit sa konteksto ay nagpapahayag ng sama-samang pagsasaalang-alang at pagsusuri. Ang “pag-usapan” ay natural sa Tagalog at hindi ipinahihiwatig na napagpasiyahan na agad ang usapin.
- source_word: περὶ τοῦ λόγου τούτου
  choice: ang usaping ito
  rationale: Ang λόγος dito ay tumutukoy sa paksang pinagtatalunan, hindi lamang sa isang binigkas na salita. Ang “usaping ito” ang malinaw at likas na katumbas sa konteksto.
theological_decisions:
- issue: Kahulugang institusyonal ng πρεσβύτεροι sa pagpupulong sa Jerusalem
  choice: Isinalin bilang “mga matatanda,” na tumutukoy sa kinikilalang mga pinuno nang walang idinaragdag na tiyak na sistemang pansimbahan.
  alternative: “mga presbitero” bilang teknikal na katungkulan sa mas huling estruktura ng simbahan
  rationale: Kinikilala ng talata ang mga pinuno ng iglesya sa Jerusalem, ngunit hindi nito itinatakda ang alinmang mas huling denominasyonal na kaayusan.
- issue: Layuning deliberatibo ng pagpupulong
  choice: “upang pag-usapan ang usaping ito,” na nagpapakita ng pagsusuri at pagsasaalang-alang
  alternative: “upang pagpasyahan ang usaping ito”
  rationale: Ang ἰδεῖν ay nagpapahiwatig ng pagharap at pagsasaalang-alang sa usapin; hindi dapat adelantadong ipahiwatig ng salin na mayroon nang pasiya sa puntong ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “nagtipon” at “pag-usapan” bilang likas na pananalita, habang pinananatili sa talababa ang literal na anyo at leksikal na puwang ng Griyego.
