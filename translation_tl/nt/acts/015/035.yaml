  naturalness: Natural ang karamihan ng salin, ngunit mas malinaw at mas idiomatiko ang paglalagay sa “salita ng Panginoon” bilang pagpapaliwanag sa ipinahahayag na mabuting balita. Ang aspekto ng mga participle ay mas mabuting ihayag sa “nagtuturo at nagpapahayag” kaysa sa perpektibong “nagturo” at “nagpahayag.”
  terminology: Ang mga pangalang Pablo, Bernabe, at Antioquia ay angkop sa modernong Filipino Tagalog at sa nakasanayang Bibliyang Filipino. Wasto ring panatilihin ang “Panginoon” nang hindi tinutukoy nang higit ang referent. Ang “salita ng Panginoon” ay angkop na salin ng λόγον τοῦ κυρίου.
