  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παῦλος δὲ καὶ Βαρναβᾶς διέτριβον ἐν Ἀντιοχείᾳ διδάσκοντες καὶ εὐαγγελιζόμενοι μετὰ καὶ ἑτέρων πολλῶν τὸν λόγον τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/035.yaml
  text: But Paul and Barnabas stayed in Antioch[a], teaching and proclaiming the good news of the word of the Lord[c][b], with many others also.
translation:
  language: tl
  text: Ngunit nanatili sina Pablo at Bernabe sa Antioquia[a], at nagtuturo at nagpapahayag sila ng mabuting balita[b]—ang salita ng Panginoon[c]—kasama ang marami pang iba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gumugol ng ilang panahon sa Antioquia.” Maaaring idiin ng pandiwang Griyego ang pananatili roon sa loob ng isang panahon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nangaral ng ebanghelyo.” Ang pandiwang Griyego ay nangangahulugang maghayag o magbalita ng mabuting balita.
    reason: lexical_alternative
  - marker: c
    text: Ang “salita ng Panginoon” ay karaniwang parirala sa Mga Gawa para sa mensahe ng Panginoon; maaari ring isaling “mensahe ng Panginoon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: nanatili
  rationale: Ipinahahayag ng imperpektong pandiwa ang patuloy na pananatili o paggugol ng panahon sa isang lugar. Likas at malinaw sa modernong Tagalog ang “nanatili.”
- source_word: διδάσκοντες
  choice: nagturo
  rationale: Tuwirang inilalarawan ang patuloy na gawaing kasabay ng kanilang pananatili; ang anyong pandiwang Filipino ay natural sa salaysay.
- source_word: εὐαγγελιζόμενοι
  choice: nagpahayag ng mabuting balita
  rationale: Pinananatili nito ang kahulugan ng paghahayag o pagbabalita ng mabuting balita nang hindi umaasa sa mas teknikal na pananalitang pansimbahan.
- source_word: μετὰ καὶ ἑτέρων πολλῶν
  choice: kasama ang marami pang iba
  rationale: Malinaw na ipinakikitang hindi lamang sina Pablo at Bernabe ang gumagawa nito, at naipapakita ng “pang” ang dagdag na diwa ng καί.
- source_word: τὸν λόγον
  choice: salita
  rationale: Bagaman maaari ring mangahulugang “mensahe” ang λόγος, pinananatili ng “salita” ang kilalang pariralang ginagamit sa Mga Gawa at ang pagkakaugnay nito sa iba pang talata.
- source_word: τοῦ κυρίου
  choice: ng Panginoon
  rationale: Pinananatili ang karaniwang titulo at hindi nililinaw nang higit sa mismong Griyego kung sino ang tinutukoy sa pariralang ito.
theological_decisions:
- issue: Ang tinutukoy ng “Panginoon” sa “salita ng Panginoon”
  choice: Pinanatiling “Panginoon” nang walang dagdag na pagtukoy.
  alternative: “salita ng Panginoong Jesus” o “mensahe mula sa Panginoon”
  rationale: Sa Mga Gawa, maaaring tumukoy ang “Panginoon” lalo na kay Jesus, ngunit κύριος lamang ang nasa Griyego. Pinananatili ng salin ang posibleng lawak at teolohikal na tensiyon ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Ginamit ang “Antioquia,” “Pablo,” at “Bernabe” bilang mga anyong pamilyar sa tradisyong Bibliyang Filipino, habang iniwasan ang makaluma o sobrang teknikal na pananalita.
