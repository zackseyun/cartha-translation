base_translation:
  language: en
  yaml_path: translation/nt/acts/015/008.yaml
  text: And God[a], who knows the heart, bore witness to them by giving them the Holy Spirit just as he did to us,
translation:
  language: tl
  text: At ang Diyos, na nakaaalam ng nilalaman ng puso,[a] ay nagpatotoo sa kanila sa pamamagitan ng pagbibigay niya sa kanila ng Banal na Espiritu, gaya rin ng ibinigay niya sa atin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na nakakakilala sa mga puso.”
    reason: Mas tuwirang paglalarawan sa καρδιογνώστης, isang pambihirang tambalang salitang nangangahulugang nakakakilala sa puso o panloob na pagkatao.
lexical_decisions:
- source_word: καρδιογνώστης
  choice: na nakaaalam ng nilalaman ng puso
  rationale: Ipinahahayag ng pambihirang tambalang salita ang Diyos bilang nakakakilala sa panloob na pagkatao. Natural sa modernong Tagalog ang sugnay na ito at hindi nito nililimitahan ang kahulugan sa pisikal na puso.
- source_word: θεὸς
  choice: ang Diyos
  rationale: Karaniwang salin ng θεός; ang καρδιογνώστης ay inilalahad bilang paglalarawan sa Diyos.
- source_word: ἐμαρτύρησεν αὐτοῖς
  choice: nagpatotoo sa kanila
  rationale: Pinananatili ang evidensiyal na diwa ng μαρτυρέω at ang datibong αὐτοῖς nang hindi tahasang pinapangalanan sa talata ang mga Hentil.
- source_word: δοὺς
  choice: nang ibigay niya
  rationale: Ipinakikita ng pariralang ito kung paano nagpatotoo ang Diyos. Natural itong Tagalog at pinananatili ang ugnayan ng participle sa pangunahing pandiwa.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: ang Banal na Espiritu
  rationale: Pamantayan at kasalukuyang katawagan sa Tagalog para sa tiyak na titulong ito.
- source_word: καθὼς καὶ ἡμῖν
  choice: gaya rin ng ginawa niya sa atin
  rationale: Elliptical ang Griyego; inuulit sa diwa ang pagbibigay. Nililinaw ng natural na Tagalog ang paghahambing nang walang idinaragdag na doktrinal na paliwanag.
theological_decisions:
- issue: Ang patotoo ng Diyos sa pamamagitan ng pagkakaloob ng Espiritu
  choice: Pinatutunayan ng Diyos ang tungkol sa “kanila” sa pamamagitan ng pagbibigay sa kanila ng Banal na Espiritu, gaya ng sa “atin.”
  alternative: Tahasang tukuyin ang “kanila” bilang mga Hentil o idagdag na ipinakita ng Diyos na tinanggap niya sila.
  rationale: Panghalip lamang ang αὐτοῖς; ang konteksto ang tumutukoy kung sino sila. Hindi idinaragdag ng salin ang paliwanag tungkol sa etnisidad, pagtanggap, o katayuan sa tipan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nakaaalam” at “nagpatotoo” bilang pormal ngunit karaniwang nauunawaang mga salita; iniwasan ang sobrang literal at di-natural na tambalang katawagan.
