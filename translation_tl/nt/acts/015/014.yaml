source:
  edition: SBLGNT
  text: Συμεὼν ἐξηγήσατο καθὼς πρῶτον ὁ θεὸς ἐπεσκέψατο λαβεῖν ἐξ ἐθνῶν ⸀λαὸν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/014.yaml
  text: Simeon has recounted how God first visited the Gentiles to take from them a people for his name[a][b][c].
translation:
  language: tl
  text: Isinalaysay ni Simeon[a] kung paanong unang dinalaw ng Diyos ang mga Hentil[b] upang kumuha mula sa mga Hentil ng isang bayan para sa kanyang pangalan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Simon.” Ang anyong “Simeon” ang ginamit dito ni Santiago.
    reason: lexical_alternative
  - marker: b
    text: O “mula sa mga bansa,” ibig sabihin, mula sa mga hindi Judio.
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, isang bayang pag-aari ng Diyos at kinikilala sa pamamagitan ng kanyang pangalan.
    reason: cultural_note
lexical_decisions:
- source_word: Συμεὼν
  choice: Simeon
  rationale: Pinanatili ang anyong ‘Simeon’ na ginamit ni Santiago sa talata, sa halip na iayon sa mas pamilyar na ‘Simon.’
- source_word: ἐξηγήσατο
  choice: Isinalaysay
  rationale: Ipinahihiwatig ng pandiwa ang paglalahad ng isang pangyayari o ulat; natural itong tumutukoy rito sa kababang salaysay ni Simeon sa kapulungan.
- source_word: καθὼς
  choice: kung paanong
  rationale: Ipinakikilala nito ang nilalaman at paraan ng isinalaysay; pinananatili ng ‘kung paanong’ ang bahaging ito ng diwa sa natural na Tagalog.
- source_word: πρῶτον
  choice: sa unang pagkakataon
  rationale: Malinaw at natural nitong ipinahahayag na ang kilos ng Diyos ay isang pasimulang yugto, nang hindi ipinapalagay na tumutukoy ito sa pagkakasunod-sunod ng mga taong tinanggap.
- source_word: ἐπεσκέψατο
  choice: dinalaw
  rationale: Pinananatili nito ang biblikal na larawan ng pagdalaw ng Diyos na may layunin at malasakit, nang hindi agad nilulutas ang lawak ng kahulugan bilang simpleng ‘pagtulong’ o ‘paglingap.’
- source_word: λαβεῖν
  choice: upang kumuha
  rationale: Tuwirang ipinapahayag ng pawatas ang layunin ng pagdalaw ng Diyos; hindi ito pinalitan ng mas interpretatibong ‘tipunin’ o ‘tanggapin.’
- source_word: ἐξ ἐθνῶν
  choice: mula sa kanila / mga Hentil
  rationale: Sa konteksto ng Gawa 15, ang ἔθνη ay mga hindi Judio. Ang ‘mula sa kanila’ ay natural na nagsasaad na mula sa mga Hentil kumukuha ang Diyos ng isang bayan.
- source_word: λαὸν
  choice: isang bayan
  rationale: Ang ‘bayan’ ay natural na salin para sa isang sama-samang kinikilalang λαός at pinananatili ang biblikal na diwa nang hindi ito nililimitahan sa isang etnikong pangkat.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: para sa kanyang pangalan
  rationale: Pinananatili ang sadyang matimbang at tipanang idyoma ng orihinal sa halip na patagin bilang ‘para sa kanyang sarili.’
theological_decisions:
- issue: Kung isasalin ang ἐξ ἐθνῶν bilang ‘mga Hentil’ o ‘mga bansa’
  choice: mga Hentil
  alternative: mga bansa
  rationale: Ang usapin sa Gawa 15 ay ang pagtanggap sa mga hindi Judio. Malinaw na ipinakikita ng ‘mga Hentil’ ang kaibahang Judio–Hentil na mahalaga sa konteksto.
- issue: Kung ipapaliwanag ang τῷ ὀνόματι αὐτοῦ bilang ‘para sa kanyang sarili’
  choice: para sa kanyang pangalan
  alternative: para sa kanyang sarili
  rationale: Pinananatili ng literal ngunit nauunawaang idyoma ang tipanang pahiwatig ng isang bayang pag-aari ng Diyos at kaugnay ng kanyang pangalan, nang hindi inaalis ang teolohikal na lalim nito.
- issue: Kung palalawakin ang ἐπεσκέψατο bilang ‘pinag-ukulan ng malasakit’
  choice: dinalaw
  alternative: pinag-ukulan ng malasakit
  rationale: Ang ‘dinalaw’ ay nagpapanatili sa biblikal na larawan at sa posibilidad ng mapagbiyayang pagkilos ng Diyos nang hindi ipinapasok sa pangunahing teksto ang isang paliwanag lamang sa saklaw ng pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang biblikal na mga idyomang ‘dinalaw’ at ‘para sa kanyang pangalan,’ habang ginawang natural ang ayos ng pangungusap para sa karaniwang mambabasa.
