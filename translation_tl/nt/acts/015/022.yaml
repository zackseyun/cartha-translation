id: ACT.15.22
reference: Acts 15:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τότε ἔδοξε τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις σὺν ὅλῃ τῇ ἐκκλησίᾳ ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν πέμψαι εἰς Ἀντιόχειαν σὺν ⸀τῷ Παύλῳ καὶ Βαρναβᾷ, Ἰούδαν τὸν ⸀καλούμενον Βαρσαββᾶν καὶ Σιλᾶν, ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/022.yaml
  text: 'Then it seemed good to the apostles and the elders, together with the whole church, to choose men from among them and send them to Antioch with Paul and Barnabas: Judas, who was called Barsabbas, and Silas, men who were leading among the brothers.'
translation:
  language: tl
  text: 'Pagkatapos, minabuti ng mga apostol at ng mga nakatatanda, kasama ang buong iglesya, na pumili ng mga lalaki mula sa kanilang hanay at ipadala sila sa Antioquia kasama nina Pablo at Bernabe: si Judas, na tinatawag na Barsabas, at si Silas, mga lalaking nangunguna sa gitna ng mga kapatid.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lalaking pinuno sa gitna ng mga kapatid.” Ang “mga kapatid” ay malamang na tumutukoy rito sa buong pamayanan ng mga mananampalataya, kabilang ang mga babae.
    reason: Nagbibigay ng leksikal na alternatibo para sa ἡγουμένους at nililinaw ang malamang na malawak na saklaw ng ἀδελφοῖς.
lexical_decisions:
- source_word: ἔδοξε
  choice: minabuti
  rationale: Likas na salin sa konteksto ng sama-samang pagpapasya; pinananatili nito ang diwang itinuring nilang mabuti nang hindi ginagawang tahasang pormal na kautusan.
- source_word: τοῖς πρεσβυτέροις
  choice: mga matatandang tagapangasiwa
  rationale: Ipinahihiwatig ang kinikilalang tungkulin sa pamayanan, hindi lamang katandaan sa edad, habang nananatiling madaling maunawaan sa makabagong Tagalog.
- source_word: σὺν ὅλῃ τῇ ἐκκλησίᾳ
  choice: kasama ang buong iglesya
  rationale: Tuwirang pinananatili ang pakikibahagi ng buong nagkakatipong pamayanang Cristiano nang hindi nagpapasok ng partikular na modelo ng pamamahala sa iglesya.
- source_word: ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν
  choice: na pumili ng mga lalaki mula sa kanilang kapulungan
  rationale: Ang infinitibong ayos ay natural sa Tagalog; pinananatili ng 'mga lalaki' ang tiyak na panlalaking ἄνδρας, at nililinaw ng 'mula sa kanilang kapulungan' na kabilang sa pamayanan ang mga pinili.
- source_word: πέμψαι εἰς Ἀντιόχειαν
  choice: at ipadala sila sa Antioquia
  rationale: Natural na pagpapahayag ng ikalawang kilos na nakapaloob sa pasya; tahasang idinagdag ang panghalip na kailangan sa Tagalog.
- source_word: σὺν τῷ Παύλῳ καὶ Βαρναβᾷ
  choice: kasama nina Pablo at Bernabe
  rationale: Karaniwang anyong Tagalog para sa pagsama sa dalawang taong may pangalang pantangi.
- source_word: Ἰούδαν τὸν καλούμενον Βαρσαββᾶν
  choice: si Judas na tinatawag na Barsabas
  rationale: Pinananatili ang deskriptibong puwersa ng participle at malinaw na itinatangi ang palayaw o ibang tawag sa kaniya.
- source_word: ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς
  choice: mga lalaking nangunguna sa mga kapatid
  rationale: Ang 'nangunguna' ay nagpapanatili sa aktibong participial na diwa at hindi awtomatikong ginagawang pormal na titulo ang kanilang pamumuno.
- source_word: ἀδελφοῖς
  choice: mga kapatid
  rationale: Sa Tagalog, ang 'mga kapatid' ay likas na katumbas na hindi nakatali sa kasarian at maaari ring tumukoy sa buong pamayanan ng mga mananampalataya, gaya ng malamang na gamit dito.
theological_decisions:
- issue: Lawak ng pakikibahagi ng buong iglesya sa pasya
  choice: Inilalahad ang buong iglesya na kasama ng mga apostol at matatandang tagapangasiwa sa paghatol na mabuti ang pagpili at pagpapadala.
  alternative: Ang mga apostol at matatandang tagapangasiwa lamang ang pormal na nagpasiya, at naroon lamang ang iglesya.
  rationale: Pinakamalikas na inuugnay ng σὺν ὅλῃ τῇ ἐκκλησίᾳ ang buong iglesya sa ἔδοξε at sa kasunod na pagpili at pagpapadala, ngunit hindi tinutukoy ng salin ang isang partikular na sistema ng pamamahala.
- issue: Katangian ng pamumuno nina Judas at Silas
  choice: mga lalaking nangunguna sa mga kapatid
  alternative: mga pinuno ng mga kapatid
  rationale: Pinananatili ng salin ang kinikilalang pamumuno nang hindi ipinapalagay na ang ἡγουμένους ay isang tiyak at pormal na titulo ng katungkulan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'iglesya' para sa nagkakatipong pamayanang Cristiano at 'matatandang tagapangasiwa' upang maiwasang mapagkamalang edad lamang ang πρεσβύτεροι. Ang mga pangalang pantangi ay nasa karaniwang anyong Filipino.
