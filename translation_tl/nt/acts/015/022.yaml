revisions:
- from: Pagkatapos, minabuti ng mga apostol at ng mga matatandang tagapangasiwa, kasama ang buong iglesya, na pumili ng mga lalaki mula sa kanilang kapulungan at ipadala sila sa Antioquia kasama nina Pablo at Bernabe. Ang pinili nila ay si Judas na tinatawag na Barsabas, at si Silas—mga lalaking nangunguna sa mga kapatid.[a]
  to: 'Pagkatapos, minabuti ng mga apostol at ng mga nakatatanda, kasama ang buong iglesya, na pumili ng mga lalaki mula sa kanilang hanay at ipadala sila sa Antioquia kasama nina Pablo at Bernabe: si Judas, na tinatawag na Barsabas, at si Silas, mga lalaking nangunguna sa gitna ng mga kapatid.[a]'
  rationale: Pinalitan ang “mga matatandang tagapangasiwa” ng “mga nakatatanda” upang huwag magdagdag ng katungkulang wala sa Griyego. Inayos ang “mula sa kanilang kapulungan” bilang “mula sa kanilang hanay” at ang huling paglalarawan bilang “mga lalaking nangunguna sa gitna ng mga kapatid” para sa mas tapat at likas na Filipino. Pinanatili ang pakikibahagi ng buong iglesya, ang panlalaking ἄνδρας, at ang hindi-pormal na paglalarawan ng pamumuno.
