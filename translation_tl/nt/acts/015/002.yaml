id: ACT.15.2
reference: Acts 15:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: γενομένης ⸀δὲ στάσεως καὶ ζητήσεως οὐκ ὀλίγης τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτοὺς ἔταξαν ἀναβαίνειν Παῦλον καὶ Βαρναβᾶν καί τινας ἄλλους ἐξ αὐτῶν πρὸς τοὺς ἀποστόλους καὶ πρεσβυτέρους εἰς Ἰερουσαλὴμ περὶ τοῦ ζητήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/002.yaml
  text: And after no small dissension and debate had arisen between Paul and Barnabas and them[c][b][a], they appointed Paul and Barnabas and some others from among them to go up to the apostles and elders in Jerusalem about this issue.
translation:
  language: tl
  text: At nang magkaroon ng matinding alitan at pagtatalo sina Pablo at Bernabe sa kanila, itinalaga nila sina Pablo at Bernabe at ilan pang iba mula sa kanila na umakyat sa Jerusalem, sa mga apostol at mga nakatatanda, ukol sa usaping ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “umakyat sa Jerusalem,” isang karaniwang paraan ng pagsasalita tungkol sa paglalakbay patungo roon.
    reason: cultural_note
lexical_decisions:
- source_word: γενομένης δὲ
  choice: At dahil nagkaroon
  rationale: Ipinakikita ng genitive absolute ang pangyayaring naging kalagayan o dahilan bago ang pangunahing kilos; natural sa Tagalog ang “At dahil nagkaroon” sa kontekstong ito.
- source_word: στάσεως καὶ ζητήσεως οὐκ ὀλίγης
  choice: matinding pagtatalo at debate
  rationale: Ang στάσις ay seryosong alitan o pagtutol, at ang ζήτησις ay aktibong pakikipagtalo. Isinalin ang litotes na οὐκ ὀλίγης ayon sa diin nitong nagpapahiwatig ng tindi, sa halip na piliting panatilihin ang di-natural na anyong “hindi maliit.”
- source_word: τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτούς
  choice: sina Pablo at Bernabe laban sa kanila
  rationale: Tinutukoy ng parirala ang mga panig sa alitan; ang “kanila” ay bumabalik sa mga lalaking mula sa Judea sa naunang talata. Ang “laban sa” ay malinaw sa Tagalog ngunit hindi nagpapahiwatig ng pisikal na labanan.
- source_word: ἔταξαν
  choice: itinakda nila
  rationale: Maaaring mangahulugang nagtakda, nag-ayos, o nagtalaga ang τάσσω. Pinananatili ng “itinakda” ang sadyang pasya ng komunidad nang hindi labis na nagpapahiwatig ng isang pormal na katungkulan.
- source_word: ἀναβαίνειν ... εἰς Ἰερουσαλήμ
  choice: pumunta sa Jerusalem
  rationale: Literal na “umakyat” ang ἀναβαίνω at karaniwang idyoma ito sa paglalakbay patungong Jerusalem. Mas natural sa modernong Tagalog ang “pumunta”; ipinaliliwanag sa talababa ang idyoma.
- source_word: τινας ἄλλους ἐξ αὐτῶν
  choice: kasama ang ilan pang mula sa kanila
  rationale: Ipinakikita nito na may karagdagang mga kinatawang pinili mula sa lokal na pangkat, nang hindi dinaragdagan ang kasarian o tungkulin na hindi tahasang sinabi.
- source_word: τοὺς ἀποστόλους καὶ πρεσβυτέρους
  choice: mga apostol at mga matatanda
  rationale: Pinananatili ang kinikilalang katawagang “apostol.” Sa salaysay ng Mga Gawa, ang πρεσβύτεροι ay mga kinikilalang pinuno; “mga matatanda” ang tuwirang tradisyonal na salin nang hindi nagdaragdag ng partikular na sistemang pansimbahan.
- source_word: περὶ τοῦ ζητήματος τούτου
  choice: tungkol sa usaping ito
  rationale: Ang ζήτημα ay ang pinagtatalunang bagay o tanong; natural at malinaw sa modernong Tagalog ang “usapin.”
theological_decisions:
- issue: Pagkakakilanlan ng mga nagtatalong panig
  choice: Iniharap ang alitan bilang pagtatalo nina Pablo at Bernabe laban sa “kanila,” na tumutukoy sa mga lalaking mula sa Judea sa naunang talata.
  alternative: Maaaring gawing “nakipagtalo nang matindi sa kanila sina Pablo at Bernabe.”
  rationale: Sinusunod nito ang pinakamalapit na reperente sa salaysay at hindi nagdaragdag ng anumang konklusyong doktrinal.
- issue: Institusyonal na diwa ng ἔταξαν
  choice: “Itinakda nila” upang ipakita ang sinadyang pasya ng pangkat.
  alternative: “Itinalaga nila” o “nagpasya silang papuntahin.”
  rationale: Iniiwasan ng salin ang pagpapahiwatig ng mas pormal na kaayusang pansimbahan kaysa sa malinaw na sinasabi ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “debate” bilang pangkaraniwang modernong salita upang maiba ang berbal na diskusyon sa mas malawak na “pagtatalo.” Ang litotes na “hindi maliit” ay natural na ipinahayag bilang “matindi.”
