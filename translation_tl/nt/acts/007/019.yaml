  text: οὗτος κατασοφισάμενος τὸ γένος ἡμῶν ἐκάκωσεν τοὺς ⸀πατέρας τοῦ ποιεῖν ⸂τὰ βρέφη ἔκθετα⸃ αὐτῶν εἰς τὸ μὴ ζῳογονεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/019.yaml
  text: This man[a], having dealt shrewdly with our people, mistreated our fathers[c][b], causing their infants to be exposed so that they would not be kept alive.
translation:
  language: tl
  text: Ang haring ito[a] ay tusong nakitungo sa ating bayan at pinagmalupitan ang ating mga ninuno, anupat iniwan nila sa labas ang kanilang mga sanggol[b] upang hindi mapanatiling buhay ang mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang taong ito.” Ang tinutukoy ay ang haring binanggit sa talata 18.
    reason: referent_clarification
  - marker: b
    text: Ibig sabihin, iniwan sa labas ang mga sanggol upang mamatay.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: Ang haring ito
  rationale: Tumutukoy ang demonstratibo sa haring binanggit sa naunang talata. Nilinaw ang reperente sa natural na Tagalog nang hindi pinapangalanan bilang Paraon.
- source_word: κατασοφισάμενος
  choice: ay tusong kumilos laban sa
  rationale: Ipinahahayag nito ang mapanlinlang at tusong pakikitungo na nakapipinsala; ang “laban sa” ay angkop sa negatibong puwersa ng pandiwa sa konteksto.
- source_word: τὸ γένος ἡμῶν
  choice: ating bayan
  rationale: Tumutukoy sa sambayanan ng Israel bilang isang pangkat etniko; natural ito sa modernong Tagalog at iniiwasan ang malabong “lahi.”
- source_word: ἐκάκωσεν
  choice: pinagmalupitan
  rationale: Tumpak na naghahatid ng masamang pagtrato at pananakit na ipinahihiwatig ng pandiwa.
- source_word: τοὺς πατέρας
  choice: ating mga ninuno
  rationale: Sa konteksto, ang πατέρες ay mga ninuno ng Israel. Mas malinaw at likas ito kaysa literal na “mga ama.”
- source_word: τοῦ ποιεῖν τὰ βρέφη ἔκθετα αὐτῶν
  choice: anupat ipinatapon niya ang kanilang mga sanggol
  rationale: Ang articular infinitive ay maaaring magpahayag ng paraan o bunga. Iniiwasan ng “anupat” ang labis na pagtukoy kung sapilitan ba o sanhi lamang, samantalang ang “ipinatapon” ay naghahatid ng pagpapabaya sa mga sanggol upang mamatay.
- source_word: εἰς τὸ μὴ ζῳογονεῖσθαι
  choice: upang hindi manatiling buhay ang mga ito
  rationale: Pinananatili ang layunin at ang diwang ‘hindi mapanatiling buhay’ ng passive infinitive sa natural na Tagalog.
theological_decisions:
- issue: Kung paraan, bunga, o sapilitang utos ang τοῦ ποιεῖν
  choice: anupat ipinatapon niya
  alternative: sa pagpilit sa kanila na itapon
  rationale: Hindi tahasang taglay ng gramatika lamang ang mas malakas na ideya ng pamimilit. Pinananatili ng salin ang ugnayang sanhi o bunga nang hindi tahimik na nilulutas ang sintaktikong puwang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ninuno” sa halip na literal na “mga ama,” at “ipinatapon” na may paliwanag sa talababa upang maipahayag ang sinaunang kaugalian ng infant exposure nang hindi nagiging teknikal.
