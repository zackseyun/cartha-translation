revisions:
- from: Ang haring ito[a] ay tusong kumilos laban sa ating bayan at pinagmalupitan ang ating mga ninuno, anupat ipinatapon niya ang kanilang mga sanggol[b] upang hindi manatiling buhay ang mga ito.
  to: Ang haring ito[a] ay tusong nakitungo sa ating bayan at pinagmalupitan ang ating mga ninuno, anupat iniwan nila sa labas ang kanilang mga sanggol[b] upang hindi mapanatiling buhay ang mga ito.
  rationale: Binago ang pandiwa upang ang mga ninuno, gaya sa Griyego, ang malinaw na kaugnay ng pag-iwan sa labas ng kanilang mga sanggol. Pinanatili ng “anupat” ang ugnayan ng paraan o bunga sa pagmamalupit nang hindi labis na ipinapasok ang ideya ng sapilitang utos. Inayos din ang paglalarawan sa tusong pakikitungo para sa mas natural na modernong Tagalog.
