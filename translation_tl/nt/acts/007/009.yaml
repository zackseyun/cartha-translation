  text: Καὶ οἱ πατριάρχαι ζηλώσαντες τὸν Ἰωσὴφ ἀπέδοντο εἰς Αἴγυπτον· καὶ ἦν ὁ θεὸς μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/009.yaml
  text: And the patriarchs, being jealous of Joseph, sold him into Egypt; and God was with him,
translation:
  language: tl
  text: At ang mga patriyarka ay nainggit kay Jose at ipinagbili nila siya para dalhin sa Egipto, at ang Diyos ay kasama niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατριάρχαι
  choice: mga patriyarka
  rationale: Tumutukoy ito sa mga anak ni Jacob bilang mga kinikilalang ninuno ng Israel. Pinananatili ng “mga patriyarka” ang tiyak na makasaysayan at teolohikal na diwa ng salita.
- source_word: ζηλώσαντες
  choice: dahil nainggit kay Jose
  rationale: Ipinakikita ng aorist participle ang inggit bilang dahilan ng ginawa nila. Natural sa modernong Tagalog ang “dahil nainggit” at malinaw nitong naiuugnay ang damdamin sa pagbebenta.
- source_word: ἀπέδοντο
  choice: ipinagbili nila siya
  rationale: Sa salaysay tungkol kay Jose, malinaw na aktuwal na pagbebenta ang tinutukoy, hindi lamang pagbibigay o pagpapasa sa iba.
- source_word: εἰς Αἴγυπτον
  choice: upang dalhin sa Egipto
  rationale: Sa konteksto, ipinagbili si Jose sa mga taong magdadala sa kaniya sa Egipto. Iniiwasan nito ang di-natural at posibleng mapanlinlang na “ipinagbili sa Egipto,” na maaaring magpahiwatig na naganap doon ang transaksiyon.
- source_word: ἦν ὁ θεὸς μετ’ αὐτοῦ
  choice: kasama niya ang Diyos
  rationale: Payak at natural nitong ipinahahayag ang presensiya ng Diyos kay Jose, habang pinananatiling panghalip ang αὐτοῦ dahil malinaw ang tinutukoy nito.
theological_decisions:
- issue: Ang presensiya ng Diyos sa gitna ng pagdurusa ni Jose
  choice: Ngunit kasama niya ang Diyos
  alternative: at kasama niya ang Diyos
  rationale: Ang καί ay karaniwang “at,” ngunit dito ay may malinaw na kontekstuwal na pagsalungat sa pagtataksil ng mga patriyarka. Likas na ipinahahayag ng “ngunit” ang tensiyong iyon nang hindi nagdaragdag ng paliwanag tungkol sa pagkalinga o providensiya ng Diyos na wala mismo sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang teknikal ngunit karaniwang biblikal na katawagang “mga patriyarka.” Isinaayos ang unang sugnay bilang dahilan at kilos para sa malinaw na daloy, at isinalin ang patungong Egipto ayon sa ipinahihiwatig ng salaysay sa Genesis.
