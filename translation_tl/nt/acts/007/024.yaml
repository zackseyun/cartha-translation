  text: καὶ ἰδών τινα ἀδικούμενον ἠμύνατο καὶ ἐποίησεν ἐκδίκησιν τῷ καταπονουμένῳ πατάξας τὸν Αἰγύπτιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/024.yaml
  text: And when he saw someone being wronged[b][a], he defended him and brought justice for the one being oppressed by striking down the Egyptian.
translation:
  language: tl
  text: Nang makita niya ang isang taong inaapi, ipinagtanggol niya ito at ipinaghiganti[a] ang inaapi sa pamamagitan ng paghampas[b] sa Egipcio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “iginawad ang katarungan para sa inaapi.” Ang pariralang Griyego na ἐποίησεν ἐκδίκησιν ay maaaring mangahulugang paghihiganti o pagbibigay-katarungan para sa isang inaapi.
    reason: lexical_alternative
  - marker: b
    text: O, “sa paghampas sa Egipcio.” Ang pandiwa ay maaari lamang mangahulugang “hampasin”; bagaman ipinahihiwatig ng konteksto na ikinamatay ito ng Egipcio, hindi tahasang isinasaad ng pandiwa mismo ang pagpatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδών
  choice: Nang makita niya
  rationale: Ginawang sugnay na panahunan ang aorist participle upang natural na maipakita sa Filipino ang pangyayaring nagbunsod sa sumunod na pagkilos.
- source_word: τινα
  choice: may isang tao
  rationale: Pinananatili nito ang pagiging di-tiyak ng panghalip nang hindi nagdaragdag ng kasariang hindi tahasang nasa Griyego.
- source_word: ἀδικούμενον
  choice: ginagawan ng masama
  rationale: Natural itong Filipino para sa isang taong dumaranas ng di-makatarungang pagtrato, at napapanatili ang moral na diwa ng ἀδικέω.
- source_word: ἠμύνατο
  choice: ipinagtanggol niya ito
  rationale: Ipinapahayag nito ang aktibong pagdamay at pagtatanggol sa taong sinasaktan, na siyang diwa ng middle form sa konteksto.
- source_word: ἐποίησεν ἐκδίκησιν
  choice: ipinaghiganti
  rationale: Mas tuwirang sinasalamin nito ang avenging o vindicating force ng idyomang Griyego kaysa sa isang ganap na hudisyal na parirala, habang inilalahad sa talababa ang alternatibong diwang katarungan.
- source_word: τῷ καταπονουμένῳ
  choice: ang inaapi
  rationale: Maikli at natural itong paglalarawan sa taong dumaranas ng mabigat at patuloy na pagmamalupit.
- source_word: πατάξας
  choice: sa pamamagitan ng paghampas
  rationale: Pinananatili ang pangunahing kahulugan ng πατάσσω na ‘hampasin’ nang hindi isinasama sa mismong pandiwa ang kamatayang nalalaman mula sa mas malawak na konteksto.
- source_word: τὸν Αἰγύπτιον
  choice: sa Egipcio
  rationale: Karaniwang substantibong katawagan sa Filipino para sa taong mula sa Ehipto.
theological_decisions:
- issue: Saklaw ng ἐκδίκησιν sa ginawa ni Moises
  choice: ipinaghiganti
  alternative: iginawad ang katarungan sa
  rationale: Maaaring tumukoy ang salita sa paghihiganti, pagbibigay-katarungan, o pagtatanggol sa karapatan ng biktima. Pinananatili ng pangunahing salin ang matalas na avenging sense ng Griyego, at nililinaw ng talababa ang posibleng justice-oriented na pagbasa nang hindi ginagawang doktrinal na pagsang-ayon ang paglalarawan.
- issue: Kung tahasang sasabihing napatay ang Egipcio sa πατάξας
  choice: paghampas
  alternative: pagpabagsak o pagpatay
  rationale: Ang pandiwang Griyego mismo ay nangangahulugang humampas; bagaman nakamamatay ang kinalabasan ayon sa konteksto ng salaysay, hindi iyon tahasang isinasaad ng pandiwa lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Egipcio” bilang natural na katawagan sa tao, at iniwasang gawing mas tiyak kaysa sa Griyego ang pagkakakilanlan ng taong inaapi at ang leksikal na kahulugan ng paghampas.
