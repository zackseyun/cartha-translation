  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap ayon sa bantas ng SBLGNT; ginamit ang “gayundin” upang natural na maipahayag ang magkatambal na αὐτὸς καὶ οἱ πατέρες ἡμῶν.
