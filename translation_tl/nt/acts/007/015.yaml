  text: And Jacob went down into Egypt[a], and he died, he and our fathers.
translation:
  language: tl
  text: At bumaba si Jacob sa Ehipto. Namatay siya at ang ating mga ninuno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ating mga ama.” Literal na “ating mga ama”; tumutukoy ito sa mga ninuno ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: bumaba
  rationale: Pinananatili ang direksiyonal na diwa ng καταβαίνω at ang nakaugaliang paglalarawan sa paglalakbay patungong Egipto.
- source_word: Ἰακώβ
  choice: Jacob
  rationale: Ginamit ang karaniwang makabagong anyo ng pangalang biblikal sa Filipino.
- source_word: εἰς Αἴγυπτον
  choice: sa Egipto
  rationale: Natural sa Filipino ang “sa Egipto” para sa pagkilos papasok o patungo sa isang bansa; sapat itong naghahatid ng diwa ng εἰς nang hindi nagiging pilit.
- source_word: ἐτελεύτησεν
  choice: namatay
  rationale: Tuwiran, malinaw, at karaniwang katumbas ng pandiwang tumutukoy sa pagkamatay.
- source_word: αὐτὸς
  choice: siya
  rationale: Pinananatili ang tahasang panghalip na tumutukoy kay Jacob.
- source_word: οἱ πατέρες ἡμῶν
  choice: ang ating mga ninunong ama
  rationale: Nililinaw ng “ninuno” na ang tinutukoy ay mga ama ng Israel noong unang panahon, habang pinananatili ng “ama” ang panlalaking katawagan ng Greek na πατέρες.
theological_decisions:
- issue: Pagpapahayag sa πατέρες sa salaysay ng kasaysayan ng Israel
  choice: ating mga ninunong ama
  alternative: ating mga ninuno
  rationale: Pinananatili nito kapwa ang kaugnayang pangkasaysayan sa mga ninuno ng Israel at ang panlalaking katawagan ng orihinal, nang hindi ipinahihiwatig na ang tinutukoy ay mga agarang ama lamang.
