  text: 'But the Most High does not dwell in things made by hands[a], just as the prophet says:'
translation:
  language: tl
  text: 'Ngunit ang Kataas-taasan ay hindi naninirahan sa mga bagay na gawa ng kamay ng tao[a], gaya ng sinasabi ng propeta:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sa mga templong gawa ng kamay ng tao.” Mas malawak ang Griyego: “sa mga bagay na gawa ng kamay ng tao,” bagaman ang templo ang agarang tinutukoy sa konteksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ngunit
  rationale: Malinaw na ipinakikita ang matinding pagsalungat sa naunang pahayag tungkol sa bahay na itinayo ni Solomon.
- source_word: ὁ ὕψιστος
  choice: ang Kataas-taasan
  rationale: Pinananatili ang kinikilalang titulo ng Diyos nang hindi idinaragdag ang salitang “Diyos,” na wala sa Griyego.
- source_word: ἐν χειροποιήτοις
  choice: sa mga bagay na ginawa ng mga kamay
  rationale: Pinananatili ang malawak at maramihang diwa ng χειροποιήτοις; hindi ito nililimitahan sa mga templo kahit iyon ang agarang konteksto.
- source_word: κατοικεῖ
  choice: naninirahan
  rationale: Natural at marangal na katumbas para sa paninirahan o pagtahan, lalo na sa usapin ng presensiya ng Diyos.
- source_word: καθὼς
  choice: gaya ng
  rationale: Ipinakikita ang pagkakatugma ng pahayag sa kasunod na sipi mula sa propeta.
- source_word: ὁ προφήτης λέγει
  choice: sinasabi ng propeta
  rationale: Pinananatili ang pangkasalukuyang pormula ng pagsipi at hindi idinaragdag ang pangalang Isaias, na hindi tahasang binanggit sa talata.
theological_decisions:
- issue: Kung tutukuyin sa pangunahing teksto ang χειροποιήτοις bilang mga templo
  choice: Panatilihin ang mas malawak na “mga bagay na ginawa ng mga kamay.”
  alternative: “mga templong ginawa ng mga kamay”
  rationale: Bagaman templo ang agarang paksa, mas malawak ang salitang Griyego at maaaring magtaglay ng pagpuna sa mga gawang-taong bagay o gusaling panrelihiyon.
- issue: Kung palalawakin ang ὁ ὕψιστος bilang “Kataas-taasang Diyos”
  choice: “ang Kataas-taasan”
  alternative: “ang Kataas-taasang Diyos”
  rationale: Maliwanag na Diyos ang tinutukoy, ngunit walang θεός sa Griyego; pinananatili ng salin ang titulo nang walang dagdag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “naninirahan” sa halip na mas makalumang “tumatahan,” at pinanatili ang bahagyang literal na “ginawa ng mga kamay” upang maipakita ang diin ng salitang Griyego sa gawang-tao.
