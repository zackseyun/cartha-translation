id: ACT.7.49
reference: Acts 7:49
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὁ οὐρανός μοι θρόνος, ⸂ἡ δὲ⸃ γῆ ὑποπόδιον τῶν ποδῶν μου· ποῖον οἶκον οἰκοδομήσετέ μοι, λέγει κύριος, ἢ τίς τόπος τῆς καταπαύσεώς μου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/049.yaml
  text: Heaven is my throne[a], and the earth is the footstool for my feet. What kind of house will you build for me, says the Lord, or what is the place of my rest?
translation:
  language: tl
  text: “Ang langit ang aking trono, at ang lupa ang tuntungan ng aking mga paa. Anong uri ng bahay ang itatayo ninyo para sa akin, sabi ng Panginoon, o ano ang lugar ng aking kapahingahan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρανός
  choice: langit
  rationale: Tumutukoy ito sa makalangit na dako na inihahambing sa lupa, hindi lamang sa nakikitang kalawakan.
- source_word: θρόνος
  choice: trono
  rationale: Karaniwang katumbas para sa luklukan ng paghahari at malinaw na pinananatili ang maharlikang larawan.
- source_word: γῆ
  choice: lupa
  rationale: Kosmiko ang saklaw nito dahil ipinares sa langit, hindi sa isang partikular na lupain.
- source_word: ὑποπόδιον τῶν ποδῶν μου
  choice: tuntungan ng aking mga paa
  rationale: Natural at dignified na Filipino na pinananatili ang larawan at ang tahasang pagbanggit sa mga paa.
- source_word: ποῖον
  choice: Anong uri ng
  rationale: Nagtatanong tungkol sa uri o katangian, hindi lamang kung alin.
- source_word: οἶκον
  choice: bahay
  rationale: Ang Griyego ay literal na 'bahay'; hindi ito pinalitan ng 'templo' upang ang konteksto ang magpahiwatig ng kaugnayan sa templo.
- source_word: οἰκοδομήσετέ
  choice: itatayo ninyo
  rationale: Direktang katumbas ng future indicative sa isang retorikal na tanong.
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang salin ng κύριος sa Bagong Tipan at angkop sa pormulang nagpapakilala sa nagsasalita.
- source_word: τόπος
  choice: lugar
  rationale: Natural at tuwirang katumbas sa Filipino.
- source_word: κατάπαυσις
  choice: kapahingahan
  rationale: Pinananatili ang diwa ng banal na pamamahinga at ang anyong pangngalan ng orihinal.
theological_decisions:
- issue: Paglilipat ng κύριος sa sipi mula sa Isaias kung saan ang nagsasalita ay ang Diyos ng Israel
  choice: Panginoon
  alternative: YHWH
  rationale: κύριος ang nasa tekstong Griyego ng Mga Gawa; pinananatili ng 'Panginoon' ang anyo ng tekstong pinagmulan nang hindi ipinapalit ang Hebreong pangalan.
- issue: Kahulugan ng οἶκος sa konteksto ng templo
  choice: bahay
  alternative: templo
  rationale: Bagaman templo ang tinutukoy sa konteksto, 'bahay' ang tahasang salita at pinananatili nito ang retorikal na lawak ng sipi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paralelismo at retorikal na mga tanong ng sipi. Ginamit ang 'tuntungan ng aking mga paa' bilang natural na katumbas ng Griyegong genitive; hindi kailangan ang talababa.
