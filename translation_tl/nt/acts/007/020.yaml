  yaml_path: translation/nt/acts/007/020.yaml
  text: At that time Moses was born[a], and he was beautiful to God. He was brought up for three months in his father's house.
translation:
  language: tl
  text: Nang panahong iyon ay ipinanganak si Moises, at siya ay kaaya-aya sa paningin ng Diyos.[a] Inalagaan siya sa loob ng tatlong buwan sa bahay ng kanyang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “maganda sa paningin ng Diyos.” Ang salitang Griego ay maaari ring mangahulugang “makisig” o “kahanga-hanga,” ngunit tahasang binabanggit ang Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ καιρῷ
  choice: Nang panahong iyon
  rationale: Likas na pariralang Filipino para sa pagtukoy sa panahong kasalukuyang tinatalakay.
- source_word: ἐγεννήθη
  choice: ipinanganak
  rationale: Karaniwang katumbas sa konteksto ng kapanganakan at pinananatili ang anyong balintiyak.
- source_word: Μωϋσῆς
  choice: Moises
  rationale: Nakagawiang anyo ng pangalan sa Filipino.
- source_word: ἀστεῖος
  choice: maganda
  rationale: Pinananatili ang payak na diwa ng pisikal na kagandahan o pagiging kaaya-aya nang hindi ito ginagawang mas tiyak na ‘natatangi’ o ‘may magandang kinabukasan.’
- source_word: τῷ θεῷ
  choice: sa paningin ng Diyos
  rationale: Likas na Filipino para sa datibo ng pagtataya o pagsasaalang-alang at malinaw na pinananatili ang tahasang pagtukoy sa Diyos.
- source_word: ὃς
  choice: siya
  rationale: Sinisimulan ang kasunod na pangungusap sa natural na paraan habang malinaw na si Moises pa rin ang tinutukoy.
- source_word: ἀνετράφη
  choice: inalagaan
  rationale: Sa konteksto ng isang sanggol sa loob ng tatlong buwan, natural itong nagpapahayag ng pagkalinga at pagpapalaki sa kanya.
- source_word: μῆνας τρεῖς
  choice: Tatlong buwan
  rationale: Natural na pagpapahayag ng tagal sa Filipino; nauunawaan ang ‘sa loob ng’ nang hindi na kailangang tahasang idagdag.
- source_word: ἐν τῷ οἴκῳ τοῦ πατρός
  choice: sa bahay ng kanyang ama
  rationale: Malinaw at karaniwang paraan ng pagpapahayag sa Filipino na pinananatili ang sambahayan ng ama bilang lugar.
theological_decisions:
- issue: Kahulugan ng ἀστεῖος τῷ θεῷ
  choice: maganda sa paningin ng Diyos
  alternative: maganda sa Diyos; kaaya-aya sa paningin ng Diyos; isang magandang sanggol
  rationale: Pinananatili nito ang tahasang pagtukoy sa Diyos at ang maaaring diwa ng pagtataya mula sa kanyang paningin, ngunit hindi nagpapasok ng mas matinding pahayag tungkol sa banal na pagpili o natatanging kapalaran.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Pinanatili ang payak na daloy ng salaysay at iniwasan ang arkaikong bokabularyo.
