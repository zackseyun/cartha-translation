  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐγὼ ὁ θεὸς τῶν πατέρων σου, ὁ θεὸς Ἀβραὰμ ⸀καὶ Ἰσαὰκ ⸁καὶ Ἰακώβ. ἔντρομος δὲ γενόμενος Μωϋσῆς οὐκ ἐτόλμα κατανοῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/032.yaml
  text: I am the God of your fathers[a], the God of Abraham and Isaac and Jacob[b]. Then Moses became terrified and did not dare to look closely.
translation:
  language: tl
  text: “Ako ang Diyos ng iyong mga ninuno, ang Diyos ni Abraham, ni Isaac, at ni Jacob.” Nasindak si Moises at hindi siya nangahas na tumingin nang mabuti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “masusing pagmasdan” o “suriin.” Ang pandiwang Griyego ay maaaring tumukoy sa maingat na pagtingin o masusing pagsasaalang-alang.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ
  choice: Ako ang
  rationale: Binibigyang-diin ng hayag na panghalip ang nagsasalita. Sa likas na Filipino, ang sugnay na pagkakakilanlan ay maayos na ipinahahayag bilang “Ako ang,” nang hindi nagdaragdag ng kahulugang wala sa Griyego.
- source_word: τῶν πατέρων σου
  choice: ng iyong mga ninuno
  rationale: Bagaman literal na “mga ama,” ang πατέρων dito ay tumutukoy sa mga ninuno ni Moises. Ang “mga ninuno” ang malinaw at likas na modernong Filipino habang pinananatili ang kaugnayang pangkasaysayan at tipan.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: ang Diyos ni Abraham, ni Isaac, at ni Jacob
  rationale: Ang pag-uulit ng “ni” ay malinaw na nag-uugnay sa Diyos sa bawat patriyarka at nagbibigay ng marangal na himig sa sipi. Ang “at” bago ang huling pangalan ay likas sa Filipino.
- source_word: ἔντρομος ... γενόμενος
  choice: Nasindak
  rationale: Ipinahahayag ng ἔντρομος ang matinding takot na maaari ring may kasamang panginginig, at ng γενόμενος ang pagpasok sa kalagayang iyon. Ang “nasindak” ay maikli, natural, at sapat ang tindi.
- source_word: οὐκ ἐτόλμα
  choice: hindi siya nangahas
  rationale: Tumpak at karaniwang katumbas ng kawalan ng lakas-loob na gawin ang kasunod na kilos.
- source_word: κατανοῆσαι
  choice: na tumingin nang mabuti
  rationale: Sa konteksto ng nakikitang pangitain, malamang na tumutukoy ito sa maingat na pagtingin, ngunit maaari rin itong magpahiwatig ng masusing pagmamasid o pagsusuri. Pinananatili ng salin at talababa ang lawak na ito.
theological_decisions:
- issue: Ang anyo ng banal na pagpapakilala sa sipi mula sa Exodo
  choice: Ako ang Diyos ng iyong mga ninuno
  alternative: Ako, ang Diyos ng iyong mga ninuno
  rationale: Walang tahasang pandiwa sa Griyegong pormula, ngunit natural na kailangan sa Filipino ang panandang “ang” upang ipahayag ang pagkakakilanlan. Hindi nito pinapalawak ang sipi tungo sa ibang teolohikal na pormula.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mga ninuno” sa halip na literal ngunit di-likas na “mga ama,” at “Nasindak” upang malinaw na maipahayag ang tindi ng tugon ni Moises.
