base_translation:
  language: en
  yaml_path: translation/nt/acts/007/006.yaml
  text: 'But God spoke in this way: that his offspring would be a foreign resident in a strange land[a], and they would enslave it and mistreat it for four hundred years.'
translation:
  language: tl
  text: 'Ngunit ganito ang sinabi ng Diyos: “Ang kanyang binhi ay magiging dayuhang naninirahan sa lupaing pag-aari ng iba,[a] at aalipinin nila ito at pagmamalupitan nila ito sa loob ng apatnaraang taon.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas natural: “Ang kanyang mga inapo ay maninirahan bilang mga dayuhan sa lupaing hindi kanila, at aalipinin sila at pagmamalupitan sa loob ng apatnaraang taon.” Kolektibong isahan ang gamit ng Griyego: “binhi … ito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησεν δὲ οὕτως ὁ θεὸς
  choice: Ngunit ganito ang sinabi ng Diyos
  rationale: Pinananatili ng “ngunit” ang banayad na pag-usad o pagsalungat ng δέ, at hayagang isinasalin ng “ganito” ang οὕτως. Mas natural sa makabagong Tagalog ang “sinabi” kaysa sa literal na “nagsalita” sa ganitong pagpapakilala ng nilalaman.
- source_word: τὸ σπέρμα αὐτοῦ
  choice: ang kanyang binhi
  rationale: Ang σπέρμα ay kolektibong isahan na tumutukoy sa mga inapo ni Abraham. Pinananatili ng “binhi” ang isahang anyo at ang mahalagang bokabularyo ng tradisyon ng pangako, bagaman ipinaliliwanag sa talababa ang mas likas na “mga inapo.”
- source_word: πάροικον
  choice: dayuhang naninirahan
  rationale: Ipinahahayag nito kapwa ang paninirahan at ang katayuang hindi katutubo o hindi kabilang sa lupain, nang hindi ipinapalagay na saglit lamang ang pagtigil.
- source_word: ἐν γῇ ἀλλοτρίᾳ
  choice: sa lupaing pag-aari ng iba
  rationale: Ang ἀλλότριος ay pangunahing tumutukoy sa pag-aari o pagiging nauukol sa iba. Ang saling ito ay malinaw at natural at ipinakikitang hindi sariling lupain ng binhi ang lugar.
- source_word: δουλώσουσιν αὐτὸ
  choice: aalipinin nila ito
  rationale: Tuwirang ipinahahayag ng “aalipinin” ang paggawa sa isang tao o bayan na alipin. Pinananatili ng “ito” ang kolektibong isahang αὐτό na tumutukoy sa “binhi.”
- source_word: κακώσουσιν
  choice: pagmamalupitan
  rationale: Saklaw nito ang pananakit, pagpapahirap, at masamang pakikitungo nang hindi nililimitahan ang uri ng pagdurusa.
- source_word: ἔτη τετρακόσια
  choice: sa loob ng apatnaraang taon
  rationale: Likas na paraan ito sa Tagalog upang ipahayag ang haba ng panahong saklaw ng mga kilos.
theological_decisions:
- issue: Kolektibong isahang pagtukoy sa binhi ni Abraham
  choice: Pinanatili sa pangunahing teksto ang “binhi ... ito.”
  alternative: “mga inapo ... sila”
  rationale: Isahan sa Griyego ang σπέρμα at ang tumutukoy ritong αὐτό. Ang pagpapanatili nito ay hindi nag-aalis sa kolektibong kahulugan at iniiwasang burahin ang kapansin-pansing anyo ng pananalita sa tradisyon ng pangako; ibinibigay sa talababa ang mas karaniwang plural na Tagalog.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang pormal na “ganito ang sinabi” at ang kolektibong isahang “binhi ... ito,” habang inilagay sa talababa ang mas natural na plural na pagpapahayag.
