translation_notes:
  register: Makabago, tuwiran, at dignified na pasalitang Tagalog. Ginamit ang “Ehipsiyo,” ang karaniwang makabagong tawag sa taong mula sa Ehipto. Walang idinagdag na paliwanag o denominasyonal na pagbasa.
