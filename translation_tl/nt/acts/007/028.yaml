  text: ‘Gusto mo ba akong patayin, tulad ng pagpatay mo kahapon sa Ehipsiyo?’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ... θέλεις
  choice: Gusto mo rin ba
  rationale: Natural na tanong sa Tagalog na umaasa ng pagtanggi o nagpapahayag ng pangamba; ang “rin” ay malinaw na inuugnay ang bantang ginawa sa nagsasalita sa naunang pagpatay sa Ehipsiyo.
- source_word: ἀνελεῖν / ἀνεῖλες
  choice: patayin / pagpatay mo
  rationale: Sa kontekstong ito, ang αἱρέω sa anyong ito ay nangangahulugang pumatay, hindi lamang alisin o kunin.
- source_word: ὃν τρόπον
  choice: gaya ng
  rationale: Maikli at likas na katumbas ng paghahambing na “sa paraang” o “kung paanong.”
- source_word: ἐχθὲς τὸν Αἰγύπτιον
  choice: kahapon sa Ehipsiyo
  rationale: Pinananatili ang tahasang panahon at ang pagkakakilanlan ng taong pinatay; natural ang ayos na ito sa Tagalog.
