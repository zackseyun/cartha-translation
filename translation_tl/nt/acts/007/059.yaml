  text: καὶ ἐλιθοβόλουν τὸν Στέφανον ἐπικαλούμενον καὶ λέγοντα· Κύριε Ἰησοῦ, δέξαι τὸ πνεῦμά μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/059.yaml
  text: And they were stoning Stephen as he called out and said[a], “Lord Jesus, receive my spirit.”
translation:
  language: tl
  text: Habang pinagbabatuhan nila ng mga bato si Esteban, nananawagan siya at nagsasabi,[a] “Panginoong Jesus, tanggapin mo ang aking espiritu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “habang siya ay nananawagan at nagsasabi.” Ang participle na Griyego ay maaari ring magpahiwatig ng pagtawag sa isang persona o pananawagan sa panalangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθοβόλουν
  choice: patuloy nilang binabato
  rationale: Ipinahahayag ng imperpektong pandiwa ang nagpapatuloy na kilos; likas sa Filipino ang pariralang ito at malinaw na hindi minsanang paghagis lamang ang tinutukoy.
- source_word: ἐπικαλούμενον
  choice: habang tumatawag siya
  rationale: Ang participle ay tumutukoy kay Esteban at maaaring mangahulugang pagtawag o taimtim na pagdalangin sa isang persona. Pinananatili ng salin ang likas na daloy at ang tuwirang pagtawag niya kay Jesus, habang inilalahad sa talababa ang mas tahasang kahulugang panalangin.
- source_word: λέγοντα
  choice: at nagsasabi
  rationale: Pinananatili ang koordinasyon ng dalawang Greek participle at ang kasabay na kilos nang hindi ginagawang sunod-sunod ang mga ito.
- source_word: Κύριε Ἰησοῦ
  choice: Panginoong Jesus
  rationale: Karaniwan, marangal, at tuwirang anyo ng pagtawag kay Jesus; pinananatili ang kristolohikal na bigat ng κύριος nang walang dagdag na pagpapakahulugan.
- source_word: δέξαι
  choice: tanggapin mo
  rationale: Ang pautos na anyo sa konteksto ng panalangin ay natural na naihahayag sa Filipino bilang “tanggapin mo,” na nagpapakita ng pagtitiwala at pagsusumamo.
- source_word: τὸ πνεῦμά μου
  choice: ang aking espiritu
  rationale: Ang “espiritu” ang malinaw at kinikilalang katumbas sa konteksto ng kamatayan at pagtitiwala ng sarili kay Jesus; ang “aking” ay angkop sa marangal na rehistro.
theological_decisions:
- issue: Kung dapat bang gawing tahasan na panalangin o invocation kay Jesus ang ἐπικαλούμενον
  choice: Isinalin sa pangunahing teksto bilang “habang tumatawag siya” at pinanatili ang tuwirang panawagang “Panginoong Jesus.”
  alternative: “habang nananalangin siya” o “habang tumatawag siya sa kanya”
  rationale: Malinaw sa mismong sinabi na si Jesus ang kinakausap ni Esteban. Gayunman, hindi tahasang may layon ang participle sa Greek, kaya hindi idinagdag sa pangunahing teksto ang “sa kanya,” at hindi rin pinalitan ng mas makitid na “nananalangin.” Ipinaliliwanag sa talababa ang mas tahasang posibleng diwa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “patuloy nilang binabato” upang likas na maipakita ang aspektong nagpapatuloy, at “aking espiritu” upang mapanatili ang solemneng himig ng huling panalangin ni Esteban.
