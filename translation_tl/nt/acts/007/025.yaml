  source_fidelity: Tumpak na naihahatid ng draft ang palagay ni Moises, ang pagkaunawa ng kanyang mga kapwa Israelita, ang pagkilos ng Diyos, at ang pagtutol na ipinahahayag sa huling sugnay. Gayunman, ang panghalip sa “sa pamamagitan ng kanyang kamay” ay maaaring natural na iugnay sa Diyos, samantalang ang αὐτοῦ sa Griyego ay tumutukoy kay Moises.
  naturalness: Natural at marangal ang “Inakala ni Moises” at ang magkatugmang “nauunawaan / naunawaan.” Mas malinaw at kasing-natural ang tahasang “kamay ni Moises” kaysa sa panghalip na may malabong tinutukoy.
  terminology: Ang “mga kapatid” ay katanggap-tanggap bilang pagpapanatili ng pangkamag-anak na pananalita, na nililinaw ng talababa. Ang “inililigtas sila” ay angkop sa σωτηρία sa agarang konteksto ng pagliligtas ng Israel at hindi nagpapataw ng makitid na espirituwal na kahulugan.
  issues:
