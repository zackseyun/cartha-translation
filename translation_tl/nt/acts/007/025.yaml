  text: ἐνόμιζεν δὲ συνιέναι τοὺς ⸀ἀδελφοὺς ὅτι ὁ θεὸς διὰ χειρὸς αὐτοῦ δίδωσιν ⸂σωτηρίαν αὐτοῖς⸃, οἱ δὲ οὐ συνῆκαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/025.yaml
  text: He supposed that his brothers understood that God was giving them deliverance through his hand[b][a], but they did not understand.
translation:
  language: tl
  text: Inakala ni Moises na nauunawaan ng kanyang mga kapatid[a] na inililigtas sila ng Diyos sa pamamagitan ng kamay ni Moises[b], ngunit hindi nila naunawaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay tumutukoy sa kapwa niya mga Israelita; pananalitang pangkamag-anakan na panlalaking maramihan ang ginamit sa Griyego.
    reason: cultural_note
  - marker: b
    text: Ang “sa pamamagitan ng kamay ni Moises” ay isang idyoma na nangangahulugang kumikilos ang Diyos sa pamamagitan ni Moises.
    reason: idiom_note
lexical_decisions:
- source_word: ἐνόμιζεν
  choice: Inakala
  rationale: Natural na Filipino para sa palagay o inaasahan ni Moises sa kontekstong pasalaysay; hindi kailangang gawing progresibo upang maipahayag ang aspektong imperpekto.
- source_word: συνιέναι / συνῆκαν
  choice: nauunawaan / naunawaan
  rationale: Pinananatili ang pag-uulit ng magkaugnay na pandiwang Griyego at ang malinaw na pagtutunggali sa pagitan ng palagay ni Moises at ng tunay na tugon ng mga Israelita.
- source_word: ἀδελφοὺς
  choice: mga kapatid
  rationale: Pinananatili ang pananalitang pangkamag-anakan; sa konteksto, tumutukoy ito sa kapwa mga Israelita ni Moises.
- source_word: διὰ χειρὸς αὐτοῦ
  choice: sa pamamagitan ng kanyang kamay
  rationale: Pinananatili ang matingkad na idyoma ng Griyego tungkol sa kamay bilang kasangkapan o ahensiya, habang malinaw pa rin sa modernong Filipino.
- source_word: δίδωσιν σωτηρίαν αὐτοῖς
  choice: inililigtas sila
  rationale: Ang literal na 'nagbibigay sa kanila ng pagliligtas' ay mabigat sa Filipino. Ang pandiwang anyo ay natural at ipinahahayag ang aktuwal na pagliligtas ng Diyos sa pamamagitan ni Moises.
theological_decisions:
- issue: Kahulugan ng σωτηρία sa salaysay tungkol kay Moises
  choice: inililigtas
  alternative: binibigyan sila ng kaligtasan / naghahatid sa kanila ng pagliligtas
  rationale: Sa agarang konteksto, tumutukoy ito sa pagliligtas sa Israel mula sa pang-aapi. Ang 'inililigtas' ay saklaw kapwa ang konkretong pagliligtas at ang mas malawak na teolohikal na diwa nang hindi nililimitahan ito sa espirituwal na kaligtasan lamang.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang pangalang “Moises” sa halip na paulit-ulit na panghalip upang maging malinaw ang tinutukoy sa hiwalay na talata. Pinanatili ang larawan ng “kamay” mula sa Griyego at ipinaliwanag ito sa talababa.
