  text: καὶ ἔδωκεν αὐτῷ διαθήκην περιτομῆς· καὶ οὕτως ἐγέννησεν τὸν Ἰσαὰκ καὶ περιέτεμεν αὐτὸν τῇ ἡμέρᾳ τῇ ὀγδόῃ, ⸀καὶ Ἰσαὰκ τὸν Ἰακώβ, ⸁καὶ Ἰακὼβ τοὺς δώδεκα πατριάρχας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/008.yaml
  text: And he gave him the covenant of circumcision. And so he fathered Isaac and circumcised him on the eighth day, and Isaac fathered Jacob, and Jacob the twelve patriarchs.
translation:
  language: tl
  text: At ibinigay ng Diyos sa kanya ang tipan ng pagtutuli. Kaya naging ama siya ni Isaac at tinuli niya ito sa ikawalong araw; si Isaac ay naging ama ni Jacob, at si Jacob ay naging ama ng labindalawang patriyarka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκην περιτομῆς
  choice: ang tipan ng pagtutuli
  rationale: Ang “tipan” ang karaniwang salin ng διαθήκη sa kontekstong biblikal, at ang pariralang “ng pagtutuli” ay nagpapanatili sa ugnayang gramatikal at tumutukoy sa tiyak na tipang ibinigay kay Abraham.
- source_word: οὕτως
  choice: At gayon nga
  rationale: Pinananatili nito ang pag-uugnay sa naunang pagbibigay ng tipan at ang pagpapatuloy ng salaysay, nang hindi nagpapasok ng mas tiyak na paliwanag kaysa sa Griyego.
- source_word: ἐγέννησεν
  choice: naging ama siya ni Isaac
  rationale: Likas at malinaw ito sa modernong Filipino at tumpak na ipinahahayag ang panlalaking genealogical na diwa ng pandiwa nang hindi gumagamit ng makalumang “ipinanganak.”
- source_word: περιέτεμεν
  choice: tinuli niya ito
  rationale: Ang “tinuli” ang tuwiran at karaniwang salin ng περιτέμνω; ang “ito” ay malinaw na tumutukoy kay Isaac.
- source_word: τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: sa ikawalong araw
  rationale: Tuwirang ipinapahayag nito ang panahong tinutukoy ng pariralang datibo, nang hindi idinaragdag ang “pagkapanganak,” na ipinahihiwatig lamang ng konteksto.
- source_word: πατριάρχας
  choice: mga patriyarka
  rationale: Pinananatili nito ang kinikilalang katawagang biblikal para sa labindalawang lalaking pinagmulan ng mga lipi ng Israel.
- source_word: Ἰσαὰκ / Ἰακώβ
  choice: Isaac / Jacob
  rationale: Ginagamit ang nakagawiang anyo ng mga pangalang ito sa modernong saling Filipino ng Bibliya.
theological_decisions:
- issue: Pagiging tiyak ng tipang ibinigay kay Abraham
  choice: “ang tipan ng pagtutuli”
  alternative: “isang tipan ng pagtutuli”
  rationale: Tumutukoy ang konteksto sa tiyak at makikilalang tipang ibinigay ng Diyos kay Abraham, lalo na sa salaysay ng Genesis 17, nang hindi nagdaragdag ng sistematikong paliwanag.
- issue: Pagpapahayag ng γεννάω sa talaangkanan
  choice: “naging ama”
  alternative: “nagkaanak” o “ipinanganak”
  rationale: Ang “naging ama” ay natural, malinaw, at nagpapanatili sa panlalaking genealogical na relasyon. Iniiwasan ng “ipinanganak” ang posibleng maling pahiwatig na ang lalaking simuno ang nanganak.
- issue: Simuno ng ἔδωκεν
  choice: Tahasan ang “Diyos”
  alternative: Panghalip lamang na “siya”
  rationale: Bagaman ipinagpapatuloy lamang ng Griyego ang simuno mula sa naunang konteksto, ang tahasang “Diyos” ay kailangan sa Filipino upang maiwasan ang kalituhan kung sino ang nagbigay, nang hindi binabago ang kahulugan.
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Ginamit ang “patriyarka” bilang pamantayang katawagang biblikal; pinanatili ang maikli at sunod-sunod na ayos ng talaangkanan.
