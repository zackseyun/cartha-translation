  naturalness: Karaniwang natural ang wika, ngunit ang “At gayon nga” ay hindi likas sa modernong Filipino sa ganitong ugnayang inferential at pagsasalaysay. Ang mas payak na “Kaya” ay malinaw at natural. Pinagdikit din ang mga sugnay na magkakaugnay upang masundan ang daloy ng Griyego.
