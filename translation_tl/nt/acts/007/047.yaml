translation:
  language: tl
  text: Ngunit ipinagtayo ni Solomon ang Diyos ng isang bahay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang templo”; sa Griyego, “isang bahay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σολομῶν
  choice: Solomon
  rationale: Karaniwang anyo ng pangalang ito sa makabagong Filipino at malinaw na tumutukoy sa anak ni David.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat o pag-usad ng salaysay; ang “Ngunit” ay nagpapanatili ng kaibahan sa naunang pagnanais ni David na makapagtayo ng tahanan para sa Diyos.
- source_word: οἰκοδόμησεν
  choice: ipinagtayo
  rationale: Tumutukoy ito sa literal na pagtatayo ng isang gusali. Likas sa Filipino ang hulma na “ipinagtayo siya ... ng” upang ipahayag na itinayo ang gusali para sa Diyos.
- source_word: αὐτῷ
  choice: siya
  rationale: Ang panghalip na datibo ay tumutukoy sa Diyos at naipahahayag sa Filipino sa pokus na benepaktibo ng pandiwang “ipinagtayo.”
- source_word: οἶκον
  choice: isang bahay
  rationale: Ang salitang Griyego ay literal na “bahay,” bagaman templo ang tinutukoy sa konteksto. Pinananatili ng “bahay” ang sadyang pananalita at ang tensiyon sa kasunod na pahayag tungkol sa paninirahan ng Kataas-taasan.
theological_decisions:
- issue: Kung isasalin ang οἶκον bilang “bahay” o bibigyang-kahulugang “templo”
  choice: bahay
  alternative: templo
  rationale: Ginamit ng teksto ang pangkalahatang salitang οἶκος, hindi ang mas tiyak na ναός o ἱερόν. Pinananatili ng “bahay” ang bokabularyo ng pinagmulan at ang teolohikal na tensiyon sa kasunod na talata; inilalagay sa talababa ang “templo” bilang wastong kontekstuwal na kahulugan.
translation_notes:
  register: Makabago, payak, at marangal na Filipino. Ang “ipinagtayo siya ni Solomon ng isang bahay” ay natural na benepaktibong ayos at malinaw na nagsasabing para sa Diyos ang gusali nang hindi ginagawang tahasang “templo” ang nasa pangunahing teksto.
