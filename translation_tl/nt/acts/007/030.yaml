  text: Καὶ πληρωθέντων ἐτῶν τεσσεράκοντα ὤφθη αὐτῷ ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ ⸀ἄγγελος ἐν φλογὶ πυρὸς βάτου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/030.yaml
  text: And after forty years had passed[a], an angel appeared to him in the wilderness of Mount Sinai[c][b], in a flame of fire from a bush.
translation:
  language: tl
  text: Pagkalipas ng apatnapung taon[a], nagpakita sa kanya ang isang anghel sa ilang ng Bundok Sinai[c], sa ningas ng apoy mula sa isang palumpong[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang makumpleto ang apatnapung taon.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa ningas ng apoy ng isang palumpong”; ibig sabihin, ang ningas ay kaugnay ng palumpong. Tingnan ang Exodo 3:2.
    reason: cross_reference
  - marker: c
    text: Iniuugnay ito ng ilang tagapagpaliwanag sa “ang anghel ng PANGINOON” sa Exodo 3:2, ngunit “isang anghel” lamang ang sinasabi rito sa Mga Gawa.
    reason: alternative_reading
lexical_decisions:
- source_word: πληρωθέντων ἐτῶν τεσσεράκοντα
  choice: Pagkalipas ng apatnapung taon
  rationale: Likas na Filipino para sa genitive absolute na nagsasaad ng panahong natapos; pinananatili sa talababa ang mas literal na diwa ng ‘nang makumpleto ang apatnapung taon.’
- source_word: ὤφθη αὐτῷ
  choice: nagpakita sa kanya
  rationale: Ang pasibong anyo ng ὁράω ay karaniwang ginagamit para sa pagpapakita ng isang makalangit na nilalang; mas natural ito kaysa ‘nakita niya.’
- source_word: ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ
  choice: sa ilang malapit sa Bundok Sinai
  rationale: Ang ἔρημος ay ‘ilang’ o ‘disyerto.’ Nililinaw ng ‘malapit sa’ ang kaugnayang heograpiko ng genitibong parirala nang hindi ipinahihiwatig na ang ilang ay pag-aari ng bundok.
- source_word: ἄγγελος
  choice: isang anghel
  rationale: Sa konteksto, makalangit na sugo ang tinutukoy; hindi dinaragdagan ang teksto ng tiyak na katawagang ‘ang anghel ng Panginoon.’
- source_word: ἐν φλογὶ πυρὸς βάτου
  choice: sa ningas ng apoy mula sa isang palumpong
  rationale: Pinananatili ang masidhing larawan ng φλογὶ πυρός at natural na ipinahahayag na kaugnay ng palumpong ang apoy, habang itinatala sa talababa ang siksik at literal na estruktura ng Griyego.
theological_decisions:
- issue: Pagkakakilanlan ng ἄγγελος sa konteksto ng pagpapakita ng Diyos
  choice: isang anghel
  alternative: ang anghel ng Panginoon
  rationale: ἄγγελος lamang ang nasa Griyegong teksto ng Mga Gawa 7:30. Hindi dapat ipasok sa pangunahing teksto ang mas tiyak na katawagan mula sa Exodo 3:2; binabanggit lamang ang ugnayan sa talababa.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang ‘ilang,’ ‘Bundok Sinai,’ at ‘palumpong’ bilang pamilyar na bokabularyong biblikal; iniwasan ang labis na literal ngunit di-likas na ayos at ang pagdaragdag ng denominasyonal na pakahulugan.
