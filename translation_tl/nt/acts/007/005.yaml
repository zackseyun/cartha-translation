  source_fidelity: Kailangang palitan ang “pagkamatay niya,” dahil ang μετ’ αὐτόν ay “pagkatapos niya” / “kasunod niya” at hindi tahasang tumutukoy sa kamatayan. Ang “bagaman wala siyang anak” ay tapat na naghahatid ng posibleng concessive na diwa ng genitive absolute nang hindi idinadagdag ang aspektong “pa.”
  naturalness: Natural at marangal ang pangkalahatang Tagalog. Mas diretso at tumpak ang “pagkatapos niya” kaysa “pagkamatay niya.” Ang “ni kahit isang yapak na lupa” ay isang likas na paraan upang ipahayag ang idyomang tumutukoy sa pinakamaliit na bahagi ng lupain.
  terminology: Ang “mana,” “bilang pag-aari,” “mga inapo,” at “anak” ay angkop at malinaw sa modernong Filipino Tagalog. Pinananatili ng “mga inapo pagkatapos niya” ang saklaw ng σπέρματι at ang temporal na kahulugan ng μετ’ αὐτόν nang walang di-ibinigay na pagpapakahulugan.
  issues:
  - severity: medium
    issue: Ang “pagkamatay niya” para sa μετ’ αὐτόν ay labis na tiyak.
    rationale: Ang Griyego ay nagsasabing “pagkatapos niya” o “kasunod niya,” hindi “pagkamatay niya.” Bagaman maaaring kasangkot ang pagsunod ng mga inapo sa panahon, hindi dapat ilagay sa teksto ang kamatayan bilang tahasang kahulugan.
  - severity: low
    issue: Ang “wala pa siyang anak” ay nagdaragdag ng aspektong “pa/yet.”
    rationale: Wala sa οὐκ ὄντος αὐτῷ τέκνου ang katumbas ng “pa.” Mas malapit ang “wala siyang anak,” samantalang napapanatili ng “bagaman” ang concessive na pagbasa at ng talababa ang temporal na alternatibo.
