  text: καὶ οὐκ ἔδωκεν αὐτῷ κληρονομίαν ἐν αὐτῇ οὐδὲ βῆμα ποδός, καὶ ἐπηγγείλατο δοῦναι αὐτῷ εἰς κατάσχεσιν αὐτὴν καὶ τῷ σπέρματι αὐτοῦ μετ’ αὐτόν, οὐκ ὄντος αὐτῷ τέκνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/005.yaml
  text: And he gave him no inheritance in it[a], not even a foot's length, but promised to give it to him as a possession, and to his offspring after him[b], though he had no child.
translation:
  language: tl
  text: At hindi siya binigyan ng Diyos ng anumang mana sa lupaing iyon[a], ni kahit isang yapak na lupa. Ngunit ipinangako ng Diyos na ibibigay sa kanya ang lupaing iyon bilang pag-aari, at sa kanyang mga inapo pagkatapos niya, bagaman wala siyang anak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring isalin: “ni kahit kapirasong lupa.” Ang pahayag sa Griyego ay isang idyoma para sa pinakamaliit na bahagi ng lupa.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaaring isalin: “noong wala siyang anak.” Maaaring unawain ang anyong Griyego bilang temporal, bagaman malakas na ipinahihiwatig ng konteksto ang diwang “bagaman wala siyang anak.”'
    reason: alternative_reading
lexical_decisions:
- source_word: κληρονομίαν
  choice: mana
  rationale: Pinananatili ng “mana” ang legal at tipanang diwa ng bahaging tinatanggap sa lupain, sa halip na gawing pangkalahatang “ari-arian” lamang.
- source_word: οὐδὲ βῆμα ποδός
  choice: kahit kapirasong lupang matutungtungan
  rationale: Likas na salin ito ng idyomang tumutukoy sa pinakamaliit na bahagi ng lupa; pinananatili rin nito ang larawan ng paa at pagtuntong.
- source_word: ἐπηγγείλατο
  choice: ipinangako
  rationale: Tuwirang ipinahahayag nito ang matibay na pangako ng Diyos nang walang di-kinakailangang pagpapalawak.
- source_word: εἰς κατάσχεσιν
  choice: bilang pag-aari
  rationale: Malinaw na ipinahahayag nito na ang lupain ay ibibigay upang maging pag-aari.
- source_word: σπέρματι
  choice: mga inapo
  rationale: Bagaman pang-isahan ang anyo ng salitang Griyego, kolektibo ang kahulugan nito rito; “mga inapo” ang natural at malinaw na katumbas sa modernong Tagalog.
- source_word: μετ’ αὐτόν
  choice: pagkamatay niya
  rationale: Sa konteksto ng pagmamana at sunod na salinlahi, ipinahahayag nito nang natural ang temporal na diwa ng “pagkatapos niya,” nang hindi inuulit ang pangalang Abraham.
- source_word: οὐκ ὄντος αὐτῷ τέκνου
  choice: bagaman wala pa siyang anak
  rationale: Inililitaw ng “bagaman” ang malamang na pasalungat na diwa ng pangyayari, samantalang ang “pa” ay natural na nagpapahiwatig na wala siyang anak noong panahong ibinigay ang pangako.
- source_word: τέκνου
  choice: anak
  rationale: Mas malawak at mas tumpak ito kaysa “lalaking anak,” sapagkat walang kasariang tinutukoy ang τέκνον.
theological_decisions:
- issue: Ang pasalungat o temporal na diwa ng kawalan ni Abraham ng anak
  choice: bagaman wala pa siyang anak
  alternative: nang wala pa siyang anak
  rationale: Maaaring unawain ang genitive absolute bilang temporal, ngunit sa argumento ni Esteban, kapansin-pansin na ibinigay ang pangako sa kabila ng kawalan ni Abraham ng anak. Pinananatili ng talababa ang tunay na gramatikal na alternatibo.
- issue: Ang Diyos bilang paksa ng mga pandiwa
  choice: inuulit ang “Diyos” sa ikalawang sugnay
  alternative: gumamit lamang ng panghalip na “siya”
  rationale: Malinaw sa konteksto na Diyos ang paksa. Ang pagbanggit sa Diyos ay nag-aalis ng kalituhan sa Tagalog nang hindi nagdaragdag ng bagong teolohikal na pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “lupaing iyon” upang maging malinaw ang tinutukoy ng panghalip, at iniwasan ang makaluma o labis na teknikal na pananalita.
