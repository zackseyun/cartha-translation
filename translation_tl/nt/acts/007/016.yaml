  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ μετετέθησαν εἰς Συχὲμ καὶ ἐτέθησαν ἐν τῷ μνήματι ⸀ᾧ ὠνήσατο Ἀβραὰμ τιμῆς ἀργυρίου παρὰ τῶν υἱῶν Ἑμμὼρ ⸀ἐν Συχέμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/016.yaml
  text: and they were carried over to Shechem and laid in the tomb that Abraham had bought for a price of silver from the sons of Hamor in Shechem[a].
translation:
  language: tl
  text: At dinala sila sa Shekem at inilagay sa libingang binili ni Abraham sa halagang pilak mula sa mga anak ni Hamor sa Shekem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pinagsasama ng pananalita ni Esteban ang mga detalyeng maaaring ihambing sa Genesis 23, kung saan bumili si Abraham kay Efron ng isang libingan sa Macpela, at sa Genesis 33:19, kung saan bumili si Jacob ng lupa malapit sa Shekem mula sa mga anak ni Hamor.
    reason: cross_reference
lexical_decisions:
- source_word: μετετέθησαν
  choice: dinala
  rationale: Sa konteksto, tumutukoy ang aorist passive sa paglilipat ng mga labi ng mga patriyarka. Likas sa Filipino ang “dinala” at malinaw na ipinahihiwatig ang paglipat sa ibang lugar.
- source_word: Συχὲμ / Συχέμ
  choice: Shekem
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar na Shechem, na malapit sa bigkas ng Griyego.
- source_word: ἐτέθησαν
  choice: inilagay
  rationale: Tuwirang katumbas ng passive na pandiwa at angkop sa konteksto ng paglalagak sa isang libingan.
- source_word: μνήματι
  choice: libingan
  rationale: Tumutukoy sa lugar na pinaglilibingan; natural at marangal itong salita sa modernong Filipino.
- source_word: ᾧ
  choice: -ng
  rationale: Ginamit ang pang-angkop sa “libingang binili” upang natural na maipahayag sa Filipino ang sugnay na naglalarawan sa libingan.
- source_word: ὠνήσατο
  choice: binili
  rationale: Tuwirang ipinapahayag ang pagbili nang hindi nagdaragdag ng kahulugang wala sa Griyego.
- source_word: τιμῆς ἀργυρίου
  choice: sa halagang pilak
  rationale: Pinananatili ang ideya ng bayad o halaga na binubuo ng pilak, sa maikli at natural na Filipino.
- source_word: παρὰ τῶν υἱῶν Ἑμμὼρ
  choice: mula sa mga anak ni Hamor
  rationale: Ang παρά na may genitive ay nagpapahayag ng pinagmulan; malinaw na pinananatili ng salin ang mga anak ni Hamor bilang pinagbilan.
- source_word: ἐν Συχέμ
  choice: sa Shekem
  rationale: Tuwirang pinananatili ang panghuling pariralang panlunan nang hindi tiyak na nilulutas kung nakaugnay ito kay Hamor o sa transaksiyon.
theological_decisions:
- issue: Tensiyong pangkasaysayan sa mga salaysay ng pagbili ng libingan sa Genesis
  choice: 'Pinanatili ang mismong diwa ng pananalita ni Esteban: si Abraham ang bumili ng libingan mula sa mga anak ni Hamor sa Shekem.'
  alternative: Itugma ito sa pagbili ni Jacob sa Genesis 33:19, o sa pagbili ni Abraham sa Macpela sa Genesis 23.
  rationale: Dapat katawanin ng salin ang tekstong Griyego ayon sa pagkakasulat nito, hindi palitan ito ng isang ipinagpalagay na pagtutugma. Ang kaugnay na tensiyon ay ipinaliliwanag sa talababa.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Pinanatili ang maikling daloy ng Griyego at ang hindi lubusang tiyak na pagkakaugnay ng panghuling “sa Shekem,” habang inilagay ang paghahambing sa Genesis sa talababa sa halip na baguhin ang pangunahing teksto.
