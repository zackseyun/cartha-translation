    issue: Ang “habang gumagawa” ay nagbibigay ng di-kinakailangang sabayang-aspekto sa participle na ποιήσας.
    rationale: Ang mga tandang binabanggit ay nasa Ehipto, Dagat na Pula, at ilang; ang huling saklaw ay tumatagal nang apatnapung taon. Ang “habang” ay maaaring magpahiwatig na ang lahat ng ito ay nangyari habang mismo niyang inilalabas ang bayan. Ang simpleng “at gumawa” ay nananatiling tapat sa kaugnay na pagkilos nang hindi ipinipilit ang sabayang panahon.
