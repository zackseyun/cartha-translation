  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗτος ἐξήγαγεν αὐτοὺς ποιήσας τέρατα καὶ σημεῖα ἐν ⸀γῇ Αἰγύπτῳ καὶ ἐν Ἐρυθρᾷ Θαλάσσῃ καὶ ἐν τῇ ἐρήμῳ ἔτη τεσσεράκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/036.yaml
  text: This man led them out[a], performing wonders and signs in the land of Egypt and at the Red Sea and in the wilderness for forty years.
translation:
  language: tl
  text: Ang taong ito ang naglabas sa kanila at gumawa ng mga kababalaghan at mga tanda sa lupain ng Egipto, sa Dagat na Pula[a], at sa ilang sa loob ng apatnapung taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Dagat ng mga Tambo.” Ang tekstong Griyego ay literal na “Dagat na Pula” (Ἐρυθρὰ Θάλασσα), ang karaniwang tawag dito sa Bagong Tipan at sa Septuagint.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Ang taong ito
  rationale: Pinananatili nito ang mariing pagtukoy ni Esteban kay Moises at mas natural sa Tagalog kaysa sa literal na “ang isang ito.”
- source_word: ἐξήγαγεν αὐτοὺς
  choice: ang naglabas sa kanila
  rationale: Tumpak na ipinahahayag ang pag-akay o pagdadala palabas sa konteksto ng Exodo, habang ipinakikita si Moises bilang taong ginamit sa pagkilos na ito.
- source_word: ποιήσας
  choice: habang gumagawa
  rationale: Ipinakikita ang malapit na kaugnayan ng mga kababalaghan at tanda sa paglabas at kasunod na paglalakbay, nang hindi ginagawang hiwalay na pangunahing pandiwa ang participle.
- source_word: τέρατα καὶ σημεῖα
  choice: mga kababalaghan at mga tanda
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit magkaibang termino: mga gawang pumupukaw ng pagkamangha at mga gawang nagsisilbing tanda.'
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: sa lupain ng Egipto
  rationale: Isinasama ang γῇ at pinananatili ang magkahanay na mga pook sa pangungusap.
- source_word: ἐν Ἐρυθρᾷ Θαλάσσῃ
  choice: sa Dagat na Pula
  rationale: Ito ang tuwirang kahulugan ng karaniwang pangalang Griyego sa Bagong Tipan at Septuagint; likas ding saklaw ng “sa” ang lokasyon ng mga pangyayari roon.
- source_word: ἐν τῇ ἐρήμῳ
  choice: sa ilang
  rationale: Ang “ilang” ay karaniwan at biblikal na katawagan para sa lugar ng paglalakbay ng Israel, at hindi nito ipinahihiwatig na purong buhangin lamang ang lupain.
- source_word: ἔτη τεσσεράκοντα
  choice: sa loob ng apatnapung taon
  rationale: Malinaw at natural na ipinapahayag sa Tagalog ang tagal ng panahon.
theological_decisions:
- issue: Ang tinutukoy ng demonstrative at ang papel ni Moises sa Exodo
  choice: Mariing tinutukoy si Moises bilang taong naglabas sa Israel at gumawa ng mga tanda.
  alternative: Gamitin lamang ang “siya,” na magpapahina sa mariing pagtukoy; o magdagdag ng paliwanag na tahasang nagtatakda kung paano nauugnay ang pagkilos niya sa pagkilos ng Diyos.
  rationale: Ang οὗτος ay mariin at tumutukoy pabalik kay Moises. Pinananatili ng salin ang papel na ibinibigay sa kanya ng teksto bilang taong gumaganap, ngunit hindi nagdaragdag ng pahayag kung siya ba ay kumilos nang hiwalay sa Diyos o bilang kasangkapan ng Diyos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kababalaghan,” “tanda,” at “ilang” bilang pamilyar na mga salitang biblikal nang hindi nagiging lipas o labis na teknikal.
