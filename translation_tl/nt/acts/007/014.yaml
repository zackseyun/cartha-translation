  text: ἀποστείλας δὲ Ἰωσὴφ μετεκαλέσατο ⸂Ἰακὼβ τὸν πατέρα αὐτοῦ⸃ καὶ πᾶσαν τὴν συγγένειαν ἐν ψυχαῖς ἑβδομήκοντα πέντε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/014.yaml
  text: Then Joseph sent and summoned Jacob his father and all his relatives[a], seventy-five persons in all.
translation:
  language: tl
  text: Pagkatapos, nagpasugo si Jose at ipinatawag ang kanyang amang si Jacob at ang lahat ng kamag-anak ni Jacob—pitumpu't limang katao lahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang talata sa Lumang Tipan, “pitumpu” ang kabuuang bilang (halimbawa, sa Hebreong teksto ng Genesis 46:27 at Exodo 1:5); dito sa Mga Gawa ay “pitumpu't lima.”
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστείλας
  choice: nagpasugo
  rationale: Ang aorist participle ay tumutukoy sa pagpapadala ni Jose ng mensahe o mga sugo bago niya ipinatawag ang pamilya. Likas sa Tagalog ang “nagpasugo” at hindi nito ipinapalagay ang isang tahasang layon na wala sa Griyego.
- source_word: δὲ
  choice: Pagkatapos
  rationale: Minamarkahan nito ang pagsulong ng salaysay; malinaw at natural ang “Pagkatapos” sa muling pagsasalaysay ni Esteban.
- source_word: μετεκαλέσατο
  choice: ipinatawag
  rationale: Ipinahihiwatig ng pandiwang nasa middle voice ang pagpapatawag sa isang tao upang pumunta. Ang “ipinatawag” ay maikli, natural, at tumpak.
- source_word: Ἰακὼβ τὸν πατέρα αὐτοῦ
  choice: ang kanyang amang si Jacob
  rationale: Natural na anyo ito sa makabagong Tagalog para sa appositional na pariralang “Jacob, his father.”
- source_word: πᾶσαν τὴν συγγένειαν
  choice: ang lahat ng kanilang mga kamag-anak
  rationale: Ang συγγένεια ay tumutukoy sa buong pangkat ng magkakamag-anak. Ginamit ang “kanilang” upang likas na tukuyin ang magkakamag-anak nina Jacob at Jose at maiwasang magmukhang kay Jose lamang ang ugnayan.
- source_word: ἐν ψυχαῖς
  choice: katao lahat
  rationale: Idyoma ito sa pagbibilang ng mga tao, hindi pagtuturo tungkol sa hiwalay na kaluluwa. Likas sa Tagalog ang “katao lahat.”
- source_word: ἑβδομήκοντα πέντε
  choice: pitumpu't lima
  rationale: Tuwirang salin ng bilang na nasa tekstong Griyego.
theological_decisions:
- issue: Kabuuang bilang ng sambahayan ni Jacob kumpara sa ilang teksto sa Lumang Tipan
  choice: pitumpu't limang katao lahat
  alternative: pitumpung katao
  rationale: Hayagang “pitumpu't lima” ang nasa Griyegong teksto ng Mga Gawa. Pinanatili ito sa pangunahing teksto at ipinaliwanag sa talababa ang pagkakaiba sa Hebreong teksto ng ilang talata sa Lumang Tipan, sa halip na pag-isahin nang sapilitan ang mga bilang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagpasugo” at “ipinatawag” upang maipakita ang dalawang magkaugnay ngunit magkaibang kilos sa Griyego. Ang gitling bago ang bilang ay nagpapalinaw na iyon ang kabuuang bilang ng buong pangkat.
