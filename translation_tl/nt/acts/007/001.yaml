  text: Then the high priest said[a], “Are these things so?”
translation:
  language: tl
  text: At sinabi ng mataas na pari[a], “Totoo ba ang mga bagay na ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ganito nga ba?” o, nang mas tahasan, “Totoo ba ang mga paratang na ito?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: sinabi
  rationale: Pinananatili nito ang karaniwang salaysay na gamit ng aorist ng λέγω. Bagaman tanong ang kasunod, natural pa rin sa Filipino ang ‘sinabi’ bago ang tuwirang tanong.
- source_word: δὲ
  choice: At
  rationale: Dito, ang δέ ay banayad na nag-uugnay at nagsusulong sa salaysay. Ang ‘At’ ay natural at hindi labis na binibigyang-diin ang pagkakasunod-sunod.
- source_word: ἀρχιερεύς
  choice: pinakapunong pari
  rationale: Tumutukoy ito sa nag-iisang pinakamataas na pari na namumuno sa pagdinig, hindi sa mas malawak na pangkat ng mga punong pari.
- source_word: Εἰ
  choice: ba
  rationale: Sa tuwirang tanong, ang εἰ ay nagpapakilala ng tanong na masasagot ng oo o hindi; natural itong ipinahahayag sa Filipino sa pamamagitan ng ‘ba.’
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang pangmaramihang demonstratibo at ang tunay na lawak ng reperensiya nito. Sa konteksto, tumutukoy ito sa mga paratang, ngunit hindi iyon tahasang ipinapasok sa pangunahing teksto.
- source_word: οὕτως ἔχει
  choice: Totoo ...
  rationale: Ang idyomang οὕτως ἔχει ay nangangahulugang ‘ganito nga ang kalagayan’ o ‘totoo ang bagay na ito.’ Ang ‘Totoo ba’ ay malinaw at likas sa makabagong Filipino sa kontekstong hudisyal.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘pinakapunong pari’ upang malinaw na maiba ang nag-iisang mataas na pari sa pangkat ng mga punong pari. Ang talababa ay nagpapanatili sa mas literal at mas kontekstuwal na mga posibilidad ng tanong.
