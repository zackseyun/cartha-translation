  text: οἵτινες ἐλάβετε τὸν νόμον εἰς διαταγὰς ἀγγέλων, καὶ οὐκ ἐφυλάξατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/053.yaml
  text: you who received the law as delivered by angels[a], and did not keep it.
translation:
  language: tl
  text: Kayong tumanggap ng Kautusan na ipinarating sa pamamagitan ng mga anghel[a], ngunit hindi ninyo ito sinunod.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ayon sa mga kaayusang ginawa ng mga anghel” o “sa utos ng mga anghel.” Mahirap tiyakin ang eksaktong diwa ng pariralang Griyego, ngunit tinutukoy nito ang pagkakaloob ng Kautusan na may pamamagitan ng mga anghel.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Kayong
  rationale: Pinananatili ang tuwirang pagtukoy sa mga kausap ni Esteban at ang mapanumbat na diin ng kwalitatibong panghalip.
- source_word: ἐλάβετε
  choice: tumanggap
  rationale: Likas na salin para sa pagtanggap sa Kautusan at hindi nagpapahiwatig na kusang-loob nila itong tinanggap nang higit sa sinasabi ng Griyego.
- source_word: τὸν νόμον
  choice: ang Kautusan
  rationale: Tumutukoy sa Kautusan ni Moises; ang malaking titik ay malinaw na nagtatangi rito bilang tiyak na Kautusan sa kontekstong biblikal.
- source_word: εἰς διαταγὰς ἀγγέλων
  choice: na ipinarating sa pamamagitan ng mga anghel
  rationale: Natural sa modernong Tagalog at ipinahahayag ang pangunahing diwa ng pagkakasangkot o pamamagitan ng mga anghel, nang hindi labis na nililinaw ang mahirap at pinagtatalunang eksaktong gamit ng διαταγαί.
- source_word: ἀγγέλων
  choice: mga anghel
  rationale: Sa konteksto, mga makalangit na nilalang ang tinutukoy, hindi mga taong sugo.
- source_word: οὐκ ἐφυλάξατε
  choice: ngunit hindi ninyo ito sinunod
  rationale: Sa kaugnayan ng Kautusan, ang φυλάσσω ay nangangahulugang tuparin o sundin; mas natural sa kasalukuyang Tagalog ang “sinunod” kaysa literal na “iningatan.”
theological_decisions:
- issue: Kahulugan ng εἰς διαταγὰς ἀγγέλων at ang pamamagitan ng mga anghel
  choice: Ipinahayag na ang Kautusan ay ipinarating sa pamamagitan ng mga anghel.
  alternative: Maaaring unawain bilang pagtanggap sa Kautusan “ayon sa mga kautusang isinaayos ng mga anghel” o “sa utos ng mga anghel.”
  rationale: Malinaw na iniuugnay ng talata ang mga anghel sa pagkakaloob ng Kautusan, ngunit hindi tiyak ang eksaktong ugnayang ipinahihiwatig ng εἰς διαταγὰς. Pinananatili ng salin at talababa ang pangunahing diwa at ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Kautusan” para sa Mosaic Law at “sinunod” para sa idiomatikong diwa ng pagtupad dito. Ang panapos na panipi ay nagpapatuloy sa mas malawak na talumpati ni Esteban ayon sa konteksto.
