id: ACT.7.45
reference: Acts 7:45
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἣν καὶ εἰσήγαγον διαδεξάμενοι οἱ πατέρες ἡμῶν μετὰ Ἰησοῦ ἐν τῇ κατασχέσει τῶν ἐθνῶν ὧν ἐξῶσεν ὁ θεὸς ἀπὸ προσώπου τῶν πατέρων ἡμῶν ἕως τῶν ἡμερῶν Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/045.yaml
  text: which our fathers in turn brought in with Joshua at the dispossession of the nations that God drove out from before our fathers[b][a], until the days of David.
translation:
  language: tl
  text: Ito rin ang dinala ng ating mga ninuno, matapos nila itong tanggapin bilang mga kahalili[b], kasama ni Josue[a], nang angkinin nila ang lupain ng mga bansang pinalayas ng Diyos mula sa harap ng ating mga ninuno, hanggang sa panahon ni David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “Ἰησοῦς”; ang pangalang ito ay maaaring tumukoy kay Jesus o kay Josue. Dito, si Josue na anak ni Nun ang tinutukoy.
    reason: alternative_reading
  - marker: b
    text: O “matapos nila itong tanggapin nang magkakasunod.” Binibigyang-diin ng pandiwaring Griyego ang sunod-sunod na pagtanggap ng mga salinlahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: ito
  rationale: Tumutukoy ang pambabaeng panghalip sa tolda o tabernakulo sa naunang talata. Ang “ito” ang natural na pagpapatuloy sa Filipino.
- source_word: εἰσήγαγον
  choice: dinala ... roon
  rationale: Ipinahahayag ng εἰσάγω ang pagdadala papasok sa lupain. Ang “roon” ay nilinaw sa kasunod na pahayag tungkol sa lupain, nang hindi ginagawang mabigat ang pangungusap.
- source_word: διαδεξάμενοι
  choice: matapos nila itong manahin
  rationale: Ipinakikita ng pandiwaring ito na tinanggap ng sumunod na salinlahi ang tolda mula sa nauna. Ang “manahin” ay malinaw at likas na Filipino, habang ang talababa ay nagpapanatili sa diwa ng sunod-sunod na pagtanggap.
- source_word: οἱ πατέρες ἡμῶν
  choice: ating mga ninuno
  rationale: Sa kontekstong pangkasaysayan, mas malinaw sa karaniwang mambabasa ang “mga ninuno” kaysa literal na “mga ama,” at nananatili ang kolektibong kaugnayan sa Israel ng nakaraan.
- source_word: μετὰ Ἰησοῦ
  choice: kasama ni Josue
  rationale: Iisa ang anyong Griyego ng pangalang Jesus at Josue, ngunit malinaw sa konteksto ng pagpasok sa lupain na si Josue na anak ni Nun ang tinutukoy.
- source_word: ἐν τῇ κατασχέσει τῶν ἐθνῶν
  choice: nang angkinin nila ang lupain ng mga bansa
  rationale: Ang κατάσχεσις ay maaaring tumukoy sa pagkuha o pag-angkin ng pag-aari. Idinagdag ang “lupain” bilang hayag na bagay na inaangkin ayon sa konteksto, hindi ang mga tao mismo.
- source_word: ὧν ἐξῶσεν ὁ θεὸς
  choice: mga bansang pinalayas ng Diyos
  rationale: Ang ἐξωθέω ay nangangahulugang itulak o palayasin. Ang “pinalayas” ay tuwiran, natural, at angkop sa salaysay ng pagsakop sa lupain.
- source_word: ἀπὸ προσώπου τῶν πατέρων ἡμῶν
  choice: mula sa harap ng ating mga ninuno
  rationale: Pinananatili nito ang Semitikong larawang “mula sa harap,” sa halip na tahimik na gawing “para sa” o “dahil sa,” at inuulit ang katawagang “ating mga ninuno.”
- source_word: ἕως τῶν ἡμερῶν Δαυίδ
  choice: hanggang sa panahon ni David
  rationale: Natural na Filipino ito para sa temporal na pariralang “hanggang sa mga araw ni David.”
theological_decisions:
- issue: Tinutukoy ng Ἰησοῦ
  choice: Josue
  alternative: Jesus
  rationale: Magkapareho ang anyo ng dalawang pangalan sa Griyego, ngunit ang pagpasok ng Israel sa lupain pagkatapos ni Moises ay malinaw na tumutukoy kay Josue na anak ni Nun. Itinatala ng talababa ang pormal na kalabuan ng pangalan.
- issue: Talab ng διαδεξάμενοι
  choice: Tinanggap o minana ng mga ninuno ang tolda bilang mga sumunod na tagapag-ingat bago nila ito dinala
  alternative: Dinala lamang nila ito nang sila naman ang sumunod, nang hindi tahasang binabanggit ang pagtanggap
  rationale: May diwa ang pandiwari ng paghalili at pagtanggap mula sa naunang salinlahi. Pinananatili ng “matapos nila itong manahin” ang parehong elemento sa malinaw na Filipino.
- issue: Kaugnayan ng “hanggang sa panahon ni David”
  choice: Hayagang iniugnay sa pananatili ng tolda sa lupain
  alternative: Iwan bilang nakabitin na temporal na parirala sa mahabang pangungusap
  rationale: Walang tahasang pandiwa sa Griyego sa huling parirala, ngunit ang natural na ipinahihiwatig sa konteksto ay nanatili roon ang tolda. Ang hiwalay na pangungusap ay nagpapalinaw nang hindi binabago ang pangkasaysayang saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga ninuno” sa halip na literal na “mga ama” upang maiwasan ang maling pagkaunawa, at “Josue” bilang karaniwang anyong Filipino ng pangalang Joshua. Pinanatili sa talababa ang kalabuan ng pangalang Griyego at ang diwa ng paghalili sa pagitan ng mga salinlahi.
