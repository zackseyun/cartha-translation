id: ACT.7.4
reference: Acts 7:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε ἐξελθὼν ἐκ γῆς Χαλδαίων κατῴκησεν ἐν Χαρράν. κἀκεῖθεν μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ μετῴκισεν αὐτὸν εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/004.yaml
  text: Then, after he had gone out from the land of the Chaldeans, he settled in Haran. And from there, after his father died, God moved him into this land in which you now live,
translation:
  language: tl
  text: Pagkatapos niyang umalis sa lupain ng mga Caldeo, nanirahan siya sa Haran. At mula roon, pagkamatay ng kanyang ama, inilipat siya ng Diyos[a] sa lupaing ito na tinitirhan ninyo ngayon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “inilipat niya siya.” Hindi tahasang binabanggit sa Griyego ang simuno, bagaman ipinahihiwatig ng konteksto na ang Diyos iyon.
    reason: lexical_alternative
  - marker: b
    text: Ayon kay Esteban, naganap ang paglipat na ito pagkamatay ng ama ni Abraham. Ihambing ang Genesis 11:32; 12:4 para sa kaugnay na pagkakasunod ng mga pangyayari.
    reason: cross_reference
lexical_decisions:
- source_word: τότε ἐξελθὼν
  choice: Pagkatapos niyang umalis
  rationale: Ipinahahayag ng aorist participle ang kilos na nauna sa paninirahan. Natural sa modernong Tagalog ang temporal na sugnay na ito; hindi na kailangang isalin nang hiwalay ang τότε dahil malinaw na ang pagkakasunod sa “Pagkatapos.”
- source_word: ἐκ γῆς Χαλδαίων
  choice: sa lupain ng mga Caldeo
  rationale: Pinananatili ang buong heograpiko-etnikong parirala sa halip na paikliin bilang “Caldea.” Sa pandiwang “umalis,” natural na panandang pinagmulan ang “sa.”
- source_word: κατῴκησεν
  choice: nanirahan siya
  rationale: Ang “nanirahan” ay kasalukuyan, marangal, at nagpapahiwatig ng pagtira sa isang lugar nang mas tiyak kaysa “tumira” lamang.
- source_word: ἐν Χαρράν
  choice: sa Haran
  rationale: Karaniwang anyo sa Tagalog ang “sa” para sa lokasyon; pinananatili ang pangalang Haran.
- source_word: κἀκεῖθεν
  choice: At mula roon
  rationale: Pinananatili ang kapuwa pang-ugnay na καί at ang diwa ng pinagmulan sa ἐκεῖθεν.
- source_word: μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ
  choice: pagkamatay ng kanyang ama
  rationale: Malinaw at natural na ipinahahayag ang temporal na pagkakasunod ng articular infinitive na may μετά.
- source_word: μετῴκισεν αὐτὸν
  choice: inilipat siya ng Diyos
  rationale: 'Ang μετοικίζω ay causative: pinapangyari ang paglipat o paninirahan sa ibang lugar. Walang hayag na simuno sa sugnay na Griyego, ngunit ang Diyos ang nauunawaang gumagawa ayon sa konteksto; inilalagay ang paliwanag sa talababa upang mapanatili ang tunay na tekstuwal na detalye.'
- source_word: εἰς τὴν γῆν ταύτην
  choice: sa lupaing ito
  rationale: Natural sa Tagalog ang “sa” kasunod ng “inilipat,” habang pinananatili ng “lupain” ang γῆ at ang deiktikong “ito.”
- source_word: εἰς ἣν ὑμεῖς νῦν κατοικεῖτε
  choice: na tinitirhan ninyo ngayon
  rationale: Natural na relative clause sa modernong Tagalog; malinaw na maramihan ang “ninyo” at napapanatili ang νῦν.
theological_decisions:
- issue: Hindi hayag na simuno ng μετῴκισεν
  choice: Isinalin bilang “inilipat siya ng Diyos,” na may talababa tungkol sa di-hayag na simuno.
  alternative: “inilipat niya siya” o isang balintiyak na anyong walang binanggit na tagagawa
  rationale: Sa Griyego, third-person singular ang pandiwa ngunit walang tahasang simuno. Ipinakikilala ng naunang konteksto ang Diyos bilang gumagawa. Ang pagbanggit sa Diyos ay nagpapalinaw sa Tagalog, samantalang kinikilala ng talababa ang pormal na ambiguwidad.
- issue: Pagkakasunod ng pagkamatay ng ama at paglipat ni Abraham
  choice: Pinanatili ang pahayag ni Esteban na naganap ang paglipat pagkamatay ng kanyang ama.
  alternative: Baguhin o palabuin ang temporal na pahayag upang itugma ang isang harmonisadong kronolohiya.
  rationale: Dapat isalin ang teksto ng Mga Gawa ayon sa pagkakasulat nito at huwag tahimik na lutasin ang kaugnay na kronolohikal na tensiyon sa Genesis.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “mga Caldeo,” “lupain,” at “nanirahan” bilang pormal ngunit karaniwang bokabularyo. Iniwasan ang arkaikong ayos at pinanatili sa talababa ang ambiguwidad ng simuno at ang kronolohikal na tensiyon.
