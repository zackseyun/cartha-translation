  text: καὶ εἶπεν· Ἰδοὺ θεωρῶ τοὺς οὐρανοὺς ⸀διηνοιγμένους καὶ τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν ἑστῶτα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/056.yaml
  text: And he said[a], “Look, I see the heavens opened[b], and the Son of Man standing at the right hand of God.”
translation:
  language: tl
  text: At sinabi niya, “Tingnan ninyo! Nakikita kong nakabukas ang kalangitan[a], at ang Anak ng Tao[b] na nakatayo sa kanan ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “nakikita kong nabuksan na ang kalangitan.” Ang Griyego ay gumagamit ng perpektong pandiwaring pasibo, na naglalarawan sa kalangitan bilang nabuksan na at nananatiling bukás sa pangitain ni Esteban.
    reason: lexical_alternative
  - marker: b
    text: Ang “Anak ng Tao” ay isang kinikilalang titulong Mesiyaniko na umaalingawngaw sa Daniel 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Tingnan ninyo!
  rationale: Ginamit bilang panawag-pansin na nagpapahayag ng biglaan at matinding pagkakita ni Esteban. Natural ito sa makabagong Filipino at hindi kasing-arkaiko ng “Masdan ninyo.”
- source_word: θεωρῶ
  choice: Nakikita ko
  rationale: Ipinahihiwatig ng pangkasalukuyang anyo ang nagpapatuloy na pagkakita. Ang “nakikita ko” ay natural at hindi nagdaragdag ng interpretasyon sa pangitain.
- source_word: τοὺς οὐρανοὺς
  choice: ang kalangitan
  rationale: Ang “kalangitan” ay natural na kolektibong katawagan sa Filipino na nagpapanatili ng marangal at teolohikal na himig ng pangitain; ang “mga langit” ay mas literal sa bilang ngunit hindi gaanong natural sa kasalukuyang gamit.
- source_word: διηνοιγμένους
  choice: nabuksan
  rationale: Pinananatili ng anyong ito ang diwang pasibo at ang kalagayang bunga ng naunang pagbubukas, na ipinahihiwatig ng perpektong pandiwaring Griyego.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang kinikilalang titulo at ang kaugnayan nito sa Daniel 7:13, nang hindi ito ginagawang paliwanag lamang gaya ng “Ang Taong Hinirang.”
- source_word: ἐκ δεξιῶν
  choice: sa kanan
  rationale: Ito ang natural na idyomang Filipino para sa marangal at makapangyarihang puwesto sa tabi ng Diyos. Iniiwasan nito ang sobrang literal na “sa kanang kamay,” na maaaring magpahiwatig ng pisikal na kamay bilang lokasyon.
- source_word: ἑστῶτα
  choice: nakatayo
  rationale: Tuwirang pinananatili ang tindig na tahasang nasa teksto at hindi ito itinutugma sa ibang talatang naglalarawan kay Jesus na nakaupo.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Tuwirang salin ng genitibong parirala; walang kailangang dagdag na paliwanag sa pangunahing teksto.
theological_decisions:
- issue: Ang Kristolohikal na titulong υἱὸς τοῦ ἀνθρώπου
  choice: Anak ng Tao
  alternative: Ang Taong Hinirang
  rationale: Ang tradisyonal at literal na titulo ang higit na nagpapanatili sa anyo ng Griyego at sa alusyon nito sa Daniel 7:13.
- issue: Ang tindig ng itinaas na si Jesus
  choice: nakatayo sa kanan ng Diyos
  alternative: nakaupo sa kanan ng Diyos
  rationale: Tahasan sa talata ang “nakatayo.” Hindi ito isinaayos ayon sa mas karaniwang paglalarawan kay Cristo bilang nakaupo, kaya nananatili ang natatanging detalye at teolohikal na tensiyon ng teksto.
- issue: Ang kalagayan ng kalangitan sa pangitain
  choice: nabuksan ang kalangitan
  alternative: bukas ang kalangitan
  rationale: Ang “nabuksan” ay mas malinaw na nagpapakita ng pasibong pangyayari at ng nananatiling bunga nito, habang ang “bukas” ay natural ngunit hindi gaanong hayag ang naunang pagbubukas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Tingnan ninyo!” para sa agarang panawag-pansin, “kalangitan” bilang natural na kolektibong katawagan, at “sa kanan ng Diyos” bilang pamilyar na idyomang biblikal. Ang bawat talababa ay inilagay kaagad pagkatapos ng pariralang tinutukoy nito.
