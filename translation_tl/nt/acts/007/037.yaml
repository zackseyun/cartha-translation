id: ACT.7.37
reference: Acts 7:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ Μωϋσῆς ὁ ⸀εἴπας τοῖς υἱοῖς Ἰσραήλ· Προφήτην ὑμῖν ἀναστήσει ⸂ὁ θεὸς⸃ ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/037.yaml
  text: This is the Moses who said to the sons of Israel[a], ‘God will raise up for you a prophet from among your brothers[c][b], like me.’
translation:
  language: tl
  text: Siya ang Moises na nagsabi sa mga anak na lalaki ni Israel[a], “Magbabangon ang Diyos ng isang propeta[b] para sa inyo mula sa inyong mga kapatid[c], tulad ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga Israelita.” Literal na “mga anak na lalaki ni Israel” ang Griyego.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawain nang mas interpretatibo bilang “ang Propeta,” ayon sa kilalang pangako sa Deuteronomio 18:15 at sa pagkakapit nito kay Jesus sa Mga Gawa.
    reason: alternative_reading
  - marker: c
    text: Ang “mga kapatid” dito ay tumutukoy sa mga kapuwa Israelita; panlalaking maramihan ang anyo sa Griyego.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ Μωϋσῆς
  choice: Siya ang Moises
  rationale: Pinananatili nito ang mariing pagkakakilanlan kay Moises sa daloy ng talumpati, habang natural pa rin sa makabagong Tagalog.
- source_word: εἴπας
  choice: na nagsabi
  rationale: Natural na kamag-anak na sugnay para sa atributibong aorist participle.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: sa mga anak ni Israel
  rationale: Malapit sa tiyak na salitang υἱοῖς at pinananatili ang tunog ng sipi mula sa Lumang Tipan.
- source_word: Προφήτην
  choice: isang propeta
  rationale: Ang pangngalan ay walang artikulo; hindi ipinapasok sa pangunahing teksto ang interpretatibong titulong “ang Propeta.”
- source_word: ἀναστήσει
  choice: Magbabangon
  rationale: Pinananatili ang larawan ng pagkilos ng Diyos sa pagtatalaga o pagpapalitaw ng propeta at ang karaniwang biblikal na gamit ng ἀνίστημι.
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Likas na anyo sa Tagalog para sa tahasang simuno ng pandiwa.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: mula sa inyong mga kapatid
  rationale: Ipinahahayag ang pinagmulan mula sa loob ng pangkat at pinananatili ang pampamilya at pambansang diwa ng ἀδελφῶν.
- source_word: ὡς ἐμέ
  choice: na tulad ko
  rationale: Tuwirang ipinapahayag ang paghahambing kay Moises; ang “na” ay nagpapalinaw sa ugnayan nito sa “propeta.”
theological_decisions:
- issue: Sipi sa Deuteronomio 18:15 at ang mesiyanikong kahulugan nito
  choice: isang propeta
  alternative: ang Propeta
  rationale: Mahalaga kay Cristo ang sipi sa konteksto ng Mga Gawa, ngunit walang artikulo ang Προφήτην. Hindi dapat ipilit sa pangunahing teksto ang interpretatibong titulo; maipakikita ito sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang mariing pagtukoy kay Moises at ang tunog ng sipi sa Kasulatan nang hindi ginagawang labis na literal o denominasyonal ang pangunahing teksto.
