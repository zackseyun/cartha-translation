- from: Siya ang Moises na nagsabi sa mga anak ni Israel[a], “Magbabangon ang Diyos para sa inyo ng isang propeta[b] mula sa inyong mga kapatid[c], na tulad ko.”
  to: Siya ang Moises na nagsabi sa mga anak na lalaki ni Israel[a], “Magbabangon ang Diyos ng isang propeta[b] para sa inyo mula sa inyong mga kapatid[c], tulad ko.”
