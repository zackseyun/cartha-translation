  text: ἀκούσας δὲ Ἰακὼβ ὄντα ⸂σιτία εἰς Αἴγυπτον⸃ ἐξαπέστειλεν τοὺς πατέρας ἡμῶν πρῶτον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/012.yaml
  text: But when Jacob heard that there was grain in Egypt[a], he sent out our fathers the first time.
translation:
  language: tl
  text: Ngunit nang mabalitaan ni Jacob na may butil sa Egipto[a], isinugo niya ang ating mga ninuno sa unang pagkakataon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga panustos sa Egipto.” Maaaring tumukoy ang Griegong σιτία sa mga panustos sa mas malawak na diwa, bagaman malamang na “butil” ang ibig sabihin sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: nang mabalitaan
  rationale: Ang aorist participle ay temporal kaugnay ng pangunahing pandiwa. Likas sa Filipino ang “nang mabalitaan” at ipinahihiwatig nitong natanggap ni Jacob ang balita, habang pinananatili ang pagkakasunod ng mga pangyayari.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagbibigay ito ng banayad na paglipat na may bahagyang pagsalungat sa naunang taggutom; hindi nito pinalalabis ang puwersa ng pang-ugnay.
- source_word: ὄντα ⸂σιτία εἰς Αἴγυπτον⸃
  choice: na may butil sa Egipto
  rationale: Ang accusative-and-participle construction pagkatapos ng ἀκούω ay likas na ipinahayag bilang di-tuwirang pahayag. Ang “may” ay malinaw at karaniwang paraan ng pagsasabi ng pag-iral sa Filipino.
- source_word: σιτία
  choice: butil
  rationale: Maaaring tumukoy ang salita sa butil o mas malawak na panustos na pagkain. Sa konteksto ng taggutom at salaysay tungkol kay Jose, “butil” ang mas malamang na kahulugan, ngunit itinatala sa talababa ang mas malawak na posibilidad.
- source_word: ἐξαπέστειλεν
  choice: isinugo niya roon
  rationale: Ang “isinugo” ay marangal at natural na katumbas ng pagpapadala sa isang misyon o paglalakbay. Idinagdag ang “roon” upang likas na maipahiwatig sa Filipino ang direksiyon patungong Egipto na taglay ng konteksto, nang hindi inuulit ang pangalan ng lugar.
- source_word: τοὺς πατέρας ἡμῶν
  choice: ang ating mga ninuno
  rationale: Sa kontekstong ito, tumutukoy ito sa mga lalaking ninuno ng Israel, partikular sa mga anak ni Jacob. Mas natural sa modernong Filipino ang “mga ninuno” kaysa literal na “mga ama natin,” na maaaring mapagkamalang tumutukoy sa agarang mga magulang.
- source_word: πρῶτον
  choice: sa unang pagkakataon
  rationale: Malinaw nitong ipinahahayag na ito ang una sa mahigit isang pagpunta at inihahanda ang mambabasa sa ikalawang pagdalaw na babanggitin kasunod.
theological_decisions:
- issue: Pagpapahayag ng τοὺς πατέρας ἡμῶν
  choice: ang ating mga ninuno
  alternative: ang ating mga ama
  rationale: Ang tinutukoy ay tiyak na mga lalaking ninuno sa kasaysayan ng Israel, ngunit sa kasalukuyang Filipino, ang literal na “mga ama” ay madaling unawaing mga ama ng mismong henerasyon. Pinananatili ng “mga ninuno” ang ugnayang pampamilya at pangkasaysayan nang hindi ipinapasok ang mas interpretatibong katawagang “mga patriarka.”
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “mabalitaan” at “isinugo” upang maging idiomatiko nang hindi nawawala ang maingat na pagkakasunod at himig ng salaysay. Ang marker na [a] ay inilagay kaagad pagkatapos ng salitang saklaw nito.
