  text: ὁ δὲ Μωϋσῆς ἰδὼν ⸀ἐθαύμασεν τὸ ὅραμα. προσερχομένου δὲ αὐτοῦ κατανοῆσαι ἐγένετο φωνὴ ⸀κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/031.yaml
  text: 'When Moses saw it[a], he marveled at the sight. And as he came near to look closely[c][b], a voice of the Lord came:'
translation:
  language: tl
  text: Nang makita ito ni Moises, namangha siya sa nakita niya.[a] Habang lumalapit siya upang tingnan ito nang mabuti, dumating ang isang tinig ng Panginoon:[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pangitain.” Ang salitang Griyego ay maaaring tumukoy sa isang nakikitang anyo o pangitain; pinili rito ang “nakita niya” dahil tumutugon si Moises sa nakikita niyang kababalaghan ng palumpong.
    reason: lexical_alternative
  - marker: b
    text: O “nagkaroon ng isang tinig ng Panginoon.”
    reason: lexical_alternative
  - marker: c
    text: Maaaring asahan ng ilan ang “YAHWE” o “ang PANGINOON” dahil umaalingawngaw sa tagpong ito ang Exodo 3; ngunit “Panginoon” (κύριος) ang mababasa sa tekstong Griyego rito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: Nang makita ito
  rationale: Ang aorist participle ay nagsasaad ng pangyayaring nauna sa pangunahing pandiwa. Likas sa Tagalog ang temporal na pariralang “Nang makita ito,” at ang “ito” ay tumutukoy sa nakikitang pangyayari sa konteksto.
- source_word: ἐθαύμασεν
  choice: namangha
  rationale: Ipinahahayag ng θαυμάζω ang matinding pagtataka o paghanga; malinaw at likas sa makabagong Tagalog ang “namangha.”
- source_word: τὸ ὅραμα
  choice: sa tanawin
  rationale: Maaaring tumukoy ang ὅραμα sa isang nakikitang anyo o pangitain. Ang “tanawin” ay angkop dito dahil tumutugon si Moises sa nakikitang kababalaghan ng palumpong, nang hindi ipinapalagay na panloob na pangitain lamang iyon.
- source_word: προσερχομένου
  choice: habang lumalapit siya
  rationale: Ang genitive absolute ay nagpapahayag ng kasabay na pangyayari o panahon. Pinananatili ng salin ang pagkilos ni Moises papalapit.
- source_word: κατανοῆσαι
  choice: upang tingnan itong mabuti
  rationale: Ang κατανοέω ay nangangahulugang magmasid o magsuri nang mabuti. Natural sa Tagalog ang “tingnan itong mabuti” at malinaw ang biswal na pokus.
- source_word: ἐγένετο φωνὴ
  choice: dumating ang isang tinig
  rationale: Ang ἐγένετο kasama ng pangngalan ay nagpapakilala ng isang pangyayari. Pinananatili ng “dumating ang isang tinig” ang eventive na anyo at hindi idinaragdag ang di-tahasang “narinig.”
- source_word: κυρίου
  choice: Panginoon
  rationale: Ang κύριος ay isinaling “Panginoon,” ang karaniwang marangal na katumbas sa Tagalog. Sa pariralang “mula sa Panginoon,” natural na ipinahahayag ang pinagmulan ng tinig.
theological_decisions:
- issue: Pagsasalin ng κύριος sa konteksto ng pagpapakita ng Diyos
  choice: Panginoon
  alternative: YAHWE / ang PANGINOON
  rationale: κύριος ang nasa tekstong Griyego, hindi ang Tetragrammaton. Kaya “Panginoon” ang tuwirang salin. Bagaman inuugnay ng tagpo ang Exodo 3 at maaaring asahan ng ilan ang anyong kumakatawan sa YHWH, hindi iyon dapat tahimik na ipalit sa salitang Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay sa Filipino. Ginamit ang “namangha,” “tanawin,” at “tingnan itong mabuti” bilang mga salitang madaling maunawaan ngunit angkop sa tekstong biblikal. Inilagay ang mga pananda ng talababa sa mismong bahaging tinutukoy ng bawat paliwanag.
