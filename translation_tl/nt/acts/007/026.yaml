id: ACT.7.26
reference: Acts 7:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τῇ τε ἐπιούσῃ ἡμέρᾳ ὤφθη αὐτοῖς μαχομένοις καὶ ⸀συνήλλασσεν αὐτοὺς εἰς εἰρήνην εἰπών· Ἄνδρες, ἀδελφοί ⸀ἐστε· ἱνατί ἀδικεῖτε ἀλλήλους;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/026.yaml
  text: And on the following day he appeared to them as they were fighting and was trying to reconcile them to peace[a], saying, ‘Men, you are brothers[b]; why are you wronging one another?’
translation:
  language: tl
  text: Kinabukasan, nagpakita siya sa kanila habang nag-aaway sila. Sinikap niyang pagkasunduin sila[a] at sinabi, “Mga lalaki, magkapatid kayo. Bakit ninyo ginagawan ng masama ang isa’t isa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pinagkakasundo niya sila upang magkaayos.” Maaaring tumukoy ang imperfect na pandiwa sa nagpapatuloy na pagkilos; sa konteksto, malamang na ipinahihiwatig nito ang pagtatangkang hindi nagtagumpay.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἐπιούσῃ ἡμέρᾳ
  choice: Kinabukasan
  rationale: Likas at malinaw na salin ng panandang-panahong tumutukoy sa sumunod na araw.
- source_word: ὤφθη
  choice: nagpakita siya
  rationale: Ang anyong pasibo ng ὁράω ay karaniwang may diwang intransitibo na ‘lumitaw’ o ‘nagpakita’ sa ganitong pagsasalaysay.
- source_word: αὐτοῖς μαχομένοις
  choice: sa kanila habang nag-aaway sila
  rationale: Ipinakikita ng kasalukuyang participle ang nagpapatuloy na pag-aaway nang magpakita si Moises.
- source_word: συνήλλασσεν αὐτοὺς εἰς εἰρήνην
  choice: Sinikap niyang pagkasunduin sila
  rationale: Ipinahihiwatig ng imperfect sa konteksto ang patuloy ngunit hindi nagtagumpay na pagtatangkang ibalik sila sa mapayapang ugnayan. Ang ‘pagkasunduin’ ay natural na Filipino para sa pagpapayapa sa dalawang nag-aaway.
- source_word: Ἄνδρες
  choice: Mga lalaki
  rationale: Pinananatili ang tuwirang pagtukoy sa dalawang lalaking kausap, nang hindi dinaragdagan ng antas ng paggalang na maaaring ipahiwatig ng ‘mga ginoo.’
- source_word: ἀδελφοί ἐστε
  choice: magkapatid kayo
  rationale: Ang pahayag ay umaapela sa kanilang pagkakaugnay bilang mga kababayan at kapwa Israelita; pinananatili ng ‘magkapatid’ ang larawan ng iisang pamilya.
- source_word: ἀδικεῖτε ἀλλήλους
  choice: ginagawan ng masama ang isa’t isa
  rationale: Sinasaklaw nito ang diwa ng paggawa ng mali o kawalang-katarungan laban sa kapwa at pinananatili ang tumbasang kahulugan ng ἀλλήλους.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maging natural ang daloy nang hindi binabago ang ugnayan ng mga kilos. Ang ‘Mga lalaki’ ay bahagyang pormal ngunit pinananatili ang tahasang Ἄνδρες; ang ‘magkapatid kayo’ ay nagpapanatili sa apela sa kanilang magkakaugnay na pagkakakilanlan.
