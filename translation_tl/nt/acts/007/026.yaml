  source_fidelity: 'Tapat ang salin sa Griyego: ang ‘Kinabukasan’ ay tumutugon sa τῇ ἐπιούσῃ ἡμέρᾳ; ang ‘nagpakita siya’ ay angkop para sa narratibong ὤφθη; at malinaw na naipapakita ng ‘habang nag-aaway sila’ ang kasabay na kilos ng μαχομένοις. Ang ‘Sinikap niyang pagkasunduin sila’ ay natural na naghahatid ng konatibong/di-natapos na diwa ng imperfect na συνήλλασσεν sa konteksto. Nananatili rin ang apela sa magkapatid na ugnayan at ang kapwaang diwa ng ἀλλήλους.'
  naturalness: Natural, malinaw, at marangal ang makabagong Filipino. Ang paghahati sa dalawang pangungusap ay hindi nakasisira sa ugnayan ng mga kilos. Ang ‘Mga lalaki, magkapatid kayo’ ay bahagyang pormal ngunit angkop sa tuwirang panawagan at pinananatili ang pagkakaiba ng Ἄνδρες at ἀδελφοί.
  terminology: Ang ‘magkapatid’ ay wastong salin ng ἀδελφοί sa kontekstong dalawang lalaking magkakaugnay bilang kapwa Israelita. Ang ‘ginagawan ng masama ang isa’t isa’ ay sapat na tumutukoy sa paggawa ng mali laban sa kapwa at hindi nagdaragdag ng pakahulugang doktrinal.
