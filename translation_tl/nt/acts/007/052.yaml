  text: τίνα τῶν προφητῶν οὐκ ἐδίωξαν οἱ πατέρες ὑμῶν; καὶ ἀπέκτειναν τοὺς προκαταγγείλαντας περὶ τῆς ἐλεύσεως τοῦ δικαίου οὗ νῦν ὑμεῖς προδόται καὶ φονεῖς ⸀ἐγένεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/052.yaml
  text: Which of the prophets did your fathers not persecute? And they killed those who announced beforehand the coming of the Righteous One[a], of whom you have now become betrayers and murderers[c][b],
translation:
  language: tl
  text: Sino sa mga propeta ang hindi inusig ng inyong mga ninuno?[a] At pinatay nila ang mga naunang nagpahayag tungkol sa pagdating ng Matuwid,[b] na siya namang pinagtaksilan at pinaslang ninyo; kayo ngayon ay naging mga tagapagkanulo at mamamatay-tao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “mga ama ninyo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “ang Makatarungan.”
    reason: lexical_alternative
  - marker: c
    text: 'Mas literal: “na siya namang kayo ngayon ay naging mga tagapagkanulo at mamamatay-tao.”'
    reason: formal_alternative
lexical_decisions:
- source_word: τίνα τῶν προφητῶν
  choice: Sino sa mga propeta
  rationale: Likas sa modernong Tagalog at pinananatili ang partitive na anyo at retorikal na puwersa ng tanong.
- source_word: ἐδίωξαν
  choice: inusig
  rationale: Tumpak na ipinahahayag ang marahas at mapaniil na pagtrato sa mga propeta.
- source_word: οἱ πατέρες ὑμῶν
  choice: inyong mga ninuno
  rationale: Sa kontekstong pangkasaysayan, mas malinaw sa karaniwang mambabasa kaysa literal na 'mga ama,' habang nananatili ang kolektibong kaugnayan sa naunang mga salinlahi.
- source_word: ἀπέκτειναν
  choice: Pinatay
  rationale: Direkta, malinaw, at hindi arkaikong katumbas.
- source_word: τοὺς προκαταγγείλαντας
  choice: ang mga nagpahayag nang una
  rationale: Pinananatili kapwa ang diwa ng pagpapahayag at ang temporal na pro- na nagsasaad ng paunang pagpapahayag.
- source_word: περὶ τῆς ἐλεύσεως
  choice: tungkol sa pagdating
  rationale: Malinaw na isinasalin ang paksa ng paunang pagpapahayag nang hindi dinaragdagan ang kahulugan.
- source_word: τοῦ δικαίου
  choice: ang Matuwid
  rationale: Pinananatili ang tiyak at tila pamagat na gamit ng articular singular para kay Jesus; natural din ito bilang titulong Tagalog.
- source_word: οὗ
  choice: na siya namang
  rationale: Natural na iniuugnay sa Tagalog ang 'Matuwid' sa kasunod na paratang laban sa mga tagapakinig.
- source_word: νῦν
  choice: ngayon
  rationale: Pinananatili ang temporal na paghahambing sa ginawa ng mga ninuno.
- source_word: προδόται
  choice: ipinagkanulo
  rationale: Sa natural na Tagalog, mas malinaw ang pandiwang pahayag kaysa abstraktong pangngalang 'mga tagapagkanulo'; ipinahahayag nito ang personal na pagtataksil o pagsasakamay.
- source_word: φονεῖς
  choice: pinaslang
  rationale: Ipinahahayag ang may-salang pagpatay nang mas matindi kaysa neutral na 'pinatay,' at maayos na tumutugma sa pandiwang ayos ng pangungusap.
- source_word: ἐγένεσθε
  choice: kayo ... ngayon
  rationale: Ang predicative na 'naging mga tagapagkanulo at mamamatay-tao' ay natural na nirestrukturang pandiwa sa Tagalog; ang resultant culpability ay nananatili sa tuwirang paratang.
theological_decisions:
- issue: Pagpapakahulugan sa τοῦ δικαίου bilang katawagang tumutukoy kay Jesus
  choice: ang Matuwid
  alternative: ang Isang Matuwid; ang Makatarungan
  rationale: Tinutukoy ng konteksto ang tiyak na taong ipinahayag ng mga propeta. Ang malaking titik ay nagpapakita ng gamit na parang titulo nang hindi nagdaragdag ng denominasyonal na paliwanag.
- issue: Ugnayan ng mga tagapakinig sa pagkakanulo at pagpatay kay Jesus
  choice: na siya namang ipinagkanulo at pinaslang ninyo ngayon
  alternative: na dahil sa kanya ay naging mga tagapagkanulo at mamamatay-tao kayo ngayon
  rationale: Ang napiling anyo ay natural at tuwiran sa Tagalog. Gayunman, ang Griyego ay literal na nagsasabing sila ay 'naging mga tagapagkanulo at mamamatay-tao,' kaya itinatala ang mas pormal na anyo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'mga ninuno' para sa historikal na πατέρες, na may literal na anyo sa talababa. Ang huling sugnay ay ginawang natural na aktibong paratang sa Tagalog, habang inilagay sa talababa ang mas pormal na predicative construction upang mapanatili ang anyo at tensiyon ng Griyego.
