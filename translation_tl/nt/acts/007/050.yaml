  text: Did not my hand make all these things?[a][b]
translation:
  language: tl
  text: Hindi ba ginawa ng kamay ko ang lahat ng mga bagay na ito?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, sa mas dinamikong salin, “Hindi ba ako ang gumawa ng lahat ng mga bagay na ito?”
    reason: lexical_alternative
  - marker: b
    text: Ang linyang ito ay umaalingawngaw sa Isaias 66:2.
    reason: cross_reference
lexical_decisions:
- source_word: οὐχὶ
  choice: Hindi ba
  rationale: Ipinakikilala ng οὐχί ang isang retorikal na tanong na umaasang sasang-ayon ang nakikinig; likas itong naihahayag sa makabagong Tagalog sa pamamagitan ng “Hindi ba.”
- source_word: ἡ χείρ μου
  choice: ang kamay ko
  rationale: Pinananatili nito ang konkretong larawang antropomorpiko ng salitang χείρ at ang pagkakaugnay ng sipi sa Isaias 66:2, sa halip na agad itong ipakahulugang “kapangyarihan ko” o simpleng “ako.”
- source_word: ἐποίησεν
  choice: ang gumawa
  rationale: Sa konteksto, ang ποιέω ay tumutukoy sa paglikha o paggawa. Ang hulma na “ang kamay ko ang gumawa” ay natural sa Tagalog at pinananatili ang kamay bilang tahasang gumaganap.
- source_word: ταῦτα πάντα
  choice: ng lahat ng bagay na ito
  rationale: Naipapahayag nito kapwa ang kabuuang saklaw ng πάντα at ang pantukoy na puwersa ng ταῦτα.
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa Diyos
  choice: Panatilihin ang “ang kamay ko” bilang larawan ng pagkilos ng Diyos
  alternative: Isalin nang mas dinamiko bilang “Hindi ba ako ang gumawa ng lahat ng bagay na ito?”
  rationale: Ang talata ay umaalingawngaw sa Isaias 66:2 at sadyang gumagamit ng konkretong larawan ng kamay para sa malikhaing pagkilos ng Diyos. Ang pagpapanatili rito ay umiiwas sa hindi kailangang pagpapaliwanag o pag-aalis ng imahen.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang retorikal na tanong at ang konkretong larawang “kamay ko,” habang ginamit ang karaniwang ayos na “Hindi ba ... ang gumawa” para maging natural sa ordinaryong mambabasa.
