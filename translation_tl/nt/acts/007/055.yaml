id: ACT.7.55
reference: Acts 7:55
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑπάρχων δὲ πλήρης πνεύματος ἁγίου ἀτενίσας εἰς τὸν οὐρανὸν εἶδεν δόξαν θεοῦ καὶ Ἰησοῦν ἑστῶτα ἐκ δεξιῶν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/055.yaml
  text: But being full of the Holy Spirit[a], he gazed into heaven and saw the glory of God, and Jesus standing at the right hand of God[b],
translation:
  language: tl
  text: Ngunit, puspos ng Espiritu Santo, tumitig siya sa langit[a] at nakita niya ang kaluwalhatian ng Diyos at si Jesus na nakatayo sa kanan ng Diyos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tumingin siyang mabuti sa langit.”
    reason: lexical_alternative
  - marker: b
    text: Ang pananalitang “sa kanan ng Diyos” ay isang biblikal na idyoma para sa dako ng pinakamataas na karangalan at awtoridad.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπάρχων
  choice: puspos
  rationale: Ang kasalukuyang pandiwaring ὑπάρχων ay nagpapakilala sa patuloy na kalagayan niya. Sa Filipino, likas na naipapahayag ang puwersa nito sa pariralang “puspos ng Espiritu Santo” nang hindi na isinasalin nang hiwalay ang “being.”
- source_word: πλήρης πνεύματος ἁγίου
  choice: puspos ng Espiritu Santo
  rationale: Ang “puspos” ay natural at marangal na salin ng idyomang tumutukoy sa lubos na pagkilos o paghahari ng Espiritu sa isang tao.
- source_word: ἀτενίσας
  choice: tumitig
  rationale: Ipinahahayag ng “tumitig” ang masidhi at nakatuong pagtingin, hindi lamang karaniwang pagtingin.
- source_word: εἰς τὸν οὐρανόν
  choice: sa langit
  rationale: Sa konteksto ng pangitain, ang οὐρανός ay tumutukoy sa langit bilang makalangit na dako, hindi lamang sa nakikitang himpapawid.
- source_word: εἶδεν
  choice: nakita niya
  rationale: Direkta at likas na salin ng pangunahing pandiwa sa nagdaang aspekto.
- source_word: δόξαν θεοῦ
  choice: ang kaluwalhatian ng Diyos
  rationale: Pinananatili nito ang malinaw at biblikal na parirala para sa nahahayag na kadakilaan ng Diyos.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Ginamit ang karaniwang anyo ng pangalan sa modernong Filipino.
- source_word: ἑστῶτα
  choice: nakatayo
  rationale: Malinaw nitong inilalarawan ang tindig ni Jesus sa pangitain at pinananatili ang vivid na detalye ng Griyego.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: sa kanan ng Diyos
  rationale: Ito ang natural na Filipino para sa biblikal na idyoma ng kinaroroonang may pinakamataas na karangalan at awtoridad; hindi angkop dito ang literal na “mula sa kanan.”
- source_word: δέ
  choice: Ngunit
  rationale: Ipinakikita nito ang banayad na pagsalungat sa marahas na kilos ng karamihan sa naunang konteksto.
theological_decisions:
- issue: Ang πνεύματος ἁγίου bilang personal na pagtukoy sa banal na Espiritu
  choice: Espiritu Santo
  alternative: banal na espiritu
  rationale: Sa gamit ng Lucas–Mga Gawa at sa agarang konteksto, tumutukoy ito sa banal na Espiritu, hindi lamang sa banal na saloobin o impersonal na puwersa.
- issue: Ang pangitain kay Jesus sa kanan ng Diyos
  choice: si Jesus na nakatayo sa kanan ng Diyos
  alternative: si Jesus na nakatayo mula sa kanan ng Diyos
  rationale: Pinananatili ng salin ang pagkakaiba ni Jesus at ng Diyos sa gramatika, gayundin ang larawan ng pagdakila. Hindi nilulutas o dinaragdagan ang kahulugan ng kaniyang pagtayo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang maikling daloy ng pangungusap at ang biblikal na idyomang “sa kanan ng Diyos,” habang iniwasan ang arkaiko o labis na denominasyonal na pananalita.
