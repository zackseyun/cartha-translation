  terminology: Ang “bayan” ay angkop para sa λαός sa talatang ito. Ang “ipinangako” ay mas tumpak na termino kaysa “ipinahayag” para sa ὡμολόγησεν. Inayos din ang talababa upang ang mga alternatibo at paliwanag ay hindi magmungkahi ng diwang “pagtatalaga,” na wala sa teksto.
