  text: Καθὼς δὲ ἤγγιζεν ὁ χρόνος τῆς ἐπαγγελίας ἧς ⸀ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ, ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη ἐν Αἰγύπτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/017.yaml
  text: But as the time of the promise that God had made to Abraham was drawing near[a], the people increased and multiplied in Egypt,
translation:
  language: tl
  text: Ngunit habang papalapit ang panahon ng pangakong ipinangako ng Diyos kay Abraham[a], lumago at dumami ang bayan sa Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pangakong ibinigay ng Diyos kay Abraham” o “pangakong pinagtibay ng Diyos kay Abraham.” Ang pandiwang Griyego rito ay maaaring tumukoy sa isang hayag na pangakong pinanghahawakan; ang “ipinangako” ay ginagamit upang malinaw na maipahayag ang diwang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς δὲ
  choice: Ngunit habang
  rationale: Ipinahahayag ng “habang” ang temporal na ugnayan ng καθώς, samantalang ang “ngunit” ay nagpapanatili sa banayad na paglipat na minamarkahan ng δέ.
- source_word: ἤγγιζεν
  choice: papalapit
  rationale: Ang aspektong di-ganap ng pandiwa ay nagpapakita ng nagpapatuloy na paglapit; likas itong naihahayag sa Filipino sa “habang papalapit.”
- source_word: ὁ χρόνος τῆς ἐπαγγελίας
  choice: ang panahon ng pangako
  rationale: Tuwirang pinananatili ang karaniwang kahulugan ng χρόνος bilang “panahon” at ng ἐπαγγελία bilang “pangako,” nang hindi nagdaragdag ng di-tiyak na diwang “takdang panahon.”
- source_word: ἧς ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ
  choice: na ipinahayag ng Diyos kay Abraham
  rationale: Sa kontekstong ito, ang ὁμολογέω ay tumutukoy sa hayagang pagpapahayag o pagtatalaga ng pangako. Ang “ipinahayag” ay malinaw at hindi nagpapasok ng mas matinding diwa ng panunumpa.
- source_word: ηὔξησεν ὁ λαὸς
  choice: lumago ang bayan
  rationale: Ang “lumago” ay natural na katumbas ng pagdami o paglaki ng isang kolektibong bayan; ang λαός ay tumutukoy rito sa Israel bilang isang bayan.
- source_word: καὶ ἐπληθύνθη
  choice: at dumami
  rationale: Pinananatili ng “dumami” ang hiwalay na diin ng ikalawang pandiwa at natural na ipinapahayag ang pagdami ng bilang.
- source_word: ἐν Αἰγύπτῳ
  choice: sa Ehipto
  rationale: Karaniwang lokatibong parirala at pamantayang anyong Filipino ng pangalang Αἴγυπτος.
theological_decisions:
- issue: Ang kahulugan ng ὡμολόγησεν kaugnay ng pangako ng Diyos kay Abraham
  choice: ipinahayag
  alternative: ipinangako; pinagtibay; isinumpa
  rationale: Ang “ipinahayag” ay nagpapanatili sa diwa ng isang hayag na pagtatalaga nang hindi ginagawang tahasang panunumpa ang pandiwa. Nananatili rin ang kaugnayan nito sa “pangako” nang hindi lubhang inuulit ang parehong salitang-ugat.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong λαός at ang magkatambal na “lumago at dumami” upang mapanatili ang dalawang magkaibang pandiwa sa Griyego.
