  text: καὶ τὸ ἔθνος ᾧ ⸀ἐὰν ⸀δουλεύσουσιν κρινῶ ἐγώ, ⸂ὁ θεὸς εἶπεν⸃, καὶ μετὰ ταῦτα ἐξελεύσονται καὶ λατρεύσουσίν μοι ἐν τῷ τόπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/007.yaml
  text: And I will judge the nation that they will serve[a], God said[b], and after these things they will come out and worship me in this place.
translation:
  language: tl
  text: “At hahatulan ko ang bansang paglilingkuran nila[a],” sabi ng Diyos. “Pagkatapos nito, lalabas sila at sasamba sa akin[b] sa lugar na ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bansang aalipin sa kanila” o “bansang paglilingkuran nila bilang mga alipin.” “Maglingkod” ang pandiwang ginamit sa Griyego, ngunit pagkaalipin ng Israel sa Ehipto ang konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “maglilingkod sa akin.” Ang pandiwang Griyego ay maaaring tumukoy sa sagradong paglilingkod o pagsambang iniuukol sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνος
  choice: bansa
  rationale: Tumutukoy ito sa bansang aalipin sa mga inapo ni Abraham, na umaalingawngaw sa Genesis 15:14. Ang “bansa” ang likas at tuwirang katumbas sa kontekstong ito.
- source_word: ᾧ ἐὰν δουλεύσουσιν
  choice: paglilingkuran nila
  rationale: Ipinahihiwatig ng pandiwa at ng datibong panghalip ang bansang paglilingkuran nila. Pinananatili ng saling ito ang anyong pandiwa at ang bahagyang kalabuan ng Griyego, samantalang nililinaw sa talababa na sapilitang pagkaalipin ang konteksto.
- source_word: κρινῶ ἐγώ
  choice: hahatulan ko
  rationale: Ipinapahayag nito ang paglalapat ng Diyos ng hatol. Ang “hahatulan ko” ay malapit sa anyo ng Griyego at hindi labis na tinutukoy kung paano isasagawa ang hatol.
- source_word: ὁ θεὸς εἶπεν
  choice: sabi ng Diyos
  rationale: Likas itong panandang nagsasaad kung sino ang nagsasalita sa loob ng sipi, habang pinananatili ang tahasang pagbanggit sa Diyos.
- source_word: μετὰ ταῦτα
  choice: pagkatapos nito
  rationale: Natural sa makabagong Tagalog at malinaw na pinananatili ang pagkakasunod-sunod ng mga pangyayari.
- source_word: ἐξελεύσονται
  choice: lalabas sila
  rationale: Tumutukoy ito sa paglabas ng Israel mula sa bansang umalipin sa kanila at tuwirang kumakatawan sa pandiwa ng Griyego.
- source_word: λατρεύσουσίν μοι
  choice: sasamba sa akin
  rationale: Ang λατρεύω kapag iniuukol sa Diyos ay tumutukoy sa panrelihiyong paglilingkod o pagsamba. Malinaw na naipapahayag ng “sasamba” ang kahulugang ito sa kasalukuyang Tagalog.
- source_word: ἐν τῷ τόπῳ τούτῳ
  choice: sa lugar na ito
  rationale: Ito ang natural at tuwirang salin ng pariralang tumutukoy sa partikular na lugar sa pangako.
theological_decisions:
- issue: Kahulugan ng δουλεύω sa konteksto ng pagkaalipin
  choice: paglilingkuran nila
  alternative: aalipinin sila / paglilingkuran nila bilang mga alipin
  rationale: Bagaman malinaw na pagkaalipin sa Ehipto ang konteksto, pandiwang “maglingkod” ang ginamit sa Griyego. Pinananatili sa pangunahing teksto ang anyong iyon at inilalagay sa talababa ang mas tahasang diwa ng sapilitang paglilingkod.
- issue: Kahulugan ng λατρεύω kapag ang Diyos ang pinag-uukulan
  choice: sasamba sa akin
  alternative: maglilingkod sa akin
  rationale: Tumutukoy ang salita sa sagrado o panrelihiyong paglilingkod sa Diyos, hindi lamang sa pangkaraniwang paggawa. Ang “sasamba” ang pinakamalinaw na katumbas, habang itinatala ang “maglilingkod” bilang leksikal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang natural na “pagkatapos nito” sa halip na ang mas literal ngunit mabigat na “pagkatapos ng mga bagay na ito.” Inilagay ang mga panipi upang malinaw ang pagpapatuloy ng siniping pananalita ng Diyos, at itinapat ang bawat talababa sa mismong salitang tinatalakay nito.
