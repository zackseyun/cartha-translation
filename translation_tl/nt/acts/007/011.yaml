  text: ἦλθεν δὲ λιμὸς ἐφ’ ὅλην τὴν ⸀Αἴγυπτον καὶ Χανάαν καὶ θλῖψις μεγάλη, καὶ οὐχ ηὕρισκον χορτάσματα οἱ πατέρες ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/011.yaml
  text: A famine came over all Egypt and Canaan[a], and great distress, and our fathers could not find food.
translation:
  language: tl
  text: Dumating ang taggutom sa buong Egipto at Canaan, at nagkaroon ng matinding paghihirap; hindi makahanap ng pagkain ang ating mga ama[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga ama” ay tumutukoy rito sa mga ninuno ng Israel.
    reason: Nililinaw ang makasaysayang saklaw ng literal na panlalaking katawagang πατέρες.
lexical_decisions:
- source_word: ἦλθεν δὲ λιμὸς
  choice: Dumating ang taggutom
  rationale: Ang “dumating” ay likas na paglalarawan sa pagsapit ng taggutom at pinananatili ang pangyayaring ipinahihiwatig ng aorist. Hindi na ginamitan ng hiwalay na panandang diskurso ang δέ sapagkat sapat na malinaw sa Filipino ang pagpapatuloy ng salaysay.
- source_word: ἐφ’ ὅλην τὴν Αἴγυπτον καὶ Χανάαν
  choice: sa buong Egipto at Canaan
  rationale: Ipinapahayag ng “sa buong” ang lawak ng sakuna sa dalawang lupain nang natural sa modernong Filipino.
- source_word: θλῖψις μεγάλη
  choice: matinding paghihirap
  rationale: Tumutukoy ito sa mabigat na kalagayang dulot o kaakibat ng taggutom, hindi sa isang natatanging teknikal o eskatolohikal na “kapighatian.”
- source_word: οὐχ ηὕρισκον
  choice: hindi makahanap
  rationale: Naipahahayag nito ang nagpapatuloy na kawalan ng kakayahang makakuha ng pagkain sa panahon ng krisis.
- source_word: χορτάσματα
  choice: pagkain
  rationale: Malawak ang kahulugan nito bilang pagkain o panustos; iniiwasan ng “pagkain” ang sobrang tiyak na “butil” at ang posibleng maling pagkaunawa sa “pakain sa hayop.”
- source_word: οἱ πατέρες ἡμῶν
  choice: ang ating mga ama
  rationale: Pinananatili nito ang tahasang panlalaking katawagan ng Griyego, habang nililinaw sa talababa na ang tinutukoy ay ang mga ninuno ng Israel.
theological_decisions:
- issue: Panlalaking katawagan para sa mga ninuno ng Israel
  choice: ang ating mga ama
  alternative: ang ating mga ninuno
  rationale: Ang πατέρες ay tahasang “mga ama” at tumutukoy sa mga lalaking ninuno ng Israel sa kasaysayan. Pinanatili sa pangunahing teksto ang anyong panlalaki, ngunit nilinaw ang saklaw nito sa talababa upang hindi mapagkamalang mga kagyat na ama lamang.
- issue: Ugnayan ng taggutom at matinding paghihirap
  choice: kasabay ng matinding paghihirap
  alternative: at nagkaroon ng matinding paghihirap
  rationale: Ang Griyego ay nag-uugnay lamang ng λιμός at θλῖψις μεγάλη nang hindi tahasang itinatakda ang eksaktong sanhi. Ipinakikita ng “kasabay” ang magkaugnay na pagdating ng mga ito nang hindi labis na nilulutas ang relasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “taggutom” at “matinding paghihirap” bilang mga karaniwang salitang madaling maunawaan, habang pinanatili ang “mga ama” dahil tahasang panlalaki ang orihinal at ang konteksto ay tungkol sa mga ninuno ng Israel.
