  text: καὶ ἐκβαλόντες ἔξω τῆς πόλεως ἐλιθοβόλουν. καὶ οἱ μάρτυρες ἀπέθεντο τὰ ἱμάτια ⸀αὐτῶν παρὰ τοὺς πόδας νεανίου καλουμένου Σαύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/058.yaml
  text: And after they had driven him out of the city[a], they were stoning him. And the witnesses laid their outer garments at the feet of a young man called Saul.
translation:
  language: tl
  text: At matapos nila siyang itaboy palabas ng lungsod, binabato nila siya ng mga bato. Inilapag naman ng mga saksi ang kanilang mga panlabas na damit[a] sa paanan ng isang binatang nagngangalang Saulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga damit” o “mga balabal”; malawak ang kahulugan ng salitang Griyego at karaniwang tumutukoy sa damit na isinusuot sa ibabaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: matapos nila siyang itaboy palabas
  rationale: Ipinahihiwatig ng aorist participle na nauna ang sapilitang pagpapalabas bago ang patuloy na pagbato. Likas sa modernong Tagalog ang “itaboy palabas” at pinananatili nito ang puwersa ng kilos.
- source_word: ἔξω τῆς πόλεως
  choice: palabas ng lungsod
  rationale: Kaakibat ng pandiwang “itaboy,” malinaw nitong ipinapakita ang paggalaw mula sa loob patungo sa labas ng lungsod.
- source_word: ἐλιθοβόλουν
  choice: binabato nila siya
  rationale: Ang imperpektibong anyo ay naglalarawan ng kilos na nagpapatuloy sa tagpong iyon. Sa Tagalog, likas na naihahayag ito ng aspektong di-ganap na “binabato.”
- source_word: οἱ μάρτυρες
  choice: mga saksi
  rationale: Tumutukoy ito sa mga saksing may papel sa usaping legal at sa pagbitay, hindi sa mas huling kahulugang “martir.”
- source_word: ἀπέθεντο
  choice: inilapag
  rationale: Malinaw at likas itong paglalarawan sa paghubad at paglalagay ng mga damit sa isang lugar.
- source_word: τὰ ἱμάτια αὐτῶν
  choice: kanilang mga panlabas na damit
  rationale: Karaniwang tumutukoy ang ἱμάτια sa damit na isinusuot sa ibabaw. Pinananatili ng salin ang lawak ng termino nang hindi ito nililimitahan sa isang tiyak na uri ng balabal.
- source_word: παρὰ τοὺς πόδας
  choice: sa paanan
  rationale: Ito ang likas na idyomatikong Tagalog para sa paglalagay ng isang bagay sa tabi o malapit sa mga paa ng isang tao.
- source_word: νεανίου
  choice: isang binata
  rationale: Ang νεανίας ay isang medyo batang lalaki o lalaking nasa kabataan; ang “binata” ay maikli, natural, at angkop sa konteksto.
- source_word: καλουμένου Σαύλου
  choice: nagngangalang Saulo
  rationale: Likas na katumbas ito ng “tinatawag na” o “pinangalanang” at malinaw na ipinakikilala ang pangalan.
theological_decisions:
- issue: Pagkilala sa μάρτυρες sa konteksto ng pagbitay
  choice: Isinalin bilang “mga saksi” sa legal na diwa.
  alternative: “mga martir”
  rationale: Sa agarang konteksto, sila ang mga nagpatotoo at nakikibahagi sa pagsasagawa ng pagbato. Ang “mga martir” ay magpapasok ng mas huling eklesiastikong kahulugan na hindi hinihingi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “binabato” upang likas na ipahayag ang nagpapatuloy na kilos, at inilagay ang talababa sa “mga panlabas na damit,” ang salitang talagang tinutukoy ng leksikal na paliwanag.
