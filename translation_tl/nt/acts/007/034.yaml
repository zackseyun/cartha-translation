  text: ἰδὼν εἶδον τὴν κάκωσιν τοῦ λαοῦ μου τοῦ ἐν Αἰγύπτῳ, καὶ τοῦ στεναγμοῦ ⸀αὐτοῦ ἤκουσα, καὶ κατέβην ἐξελέσθαι αὐτούς· καὶ νῦν δεῦρο ⸀ἀποστείλω σε εἰς Αἴγυπτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/034.yaml
  text: I have surely seen the mistreatment of my people in Egypt[a], and I have heard their groaning, and I have come down to deliver them. And now come[b], I will send you to Egypt.
translation:
  language: tl
  text: “Talagang nakita ko ang pagmamalupit sa aking bayan sa Ehipto[a], at narinig ko ang kanilang pagdaing. Bumaba ako upang iligtas sila[b]. At ngayon, halika; isusugo kita sa Ehipto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pagpapahirap” o “pang-aapi.”
    reason: lexical_alternative
  - marker: b
    text: O, “sagipin sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν εἶδον
  choice: Talagang nakita ko
  rationale: Ang participle at finite verb na magkasamang ginagamit ay isang Semitikong paraan ng pagdidiin, na umaalingawngaw sa Exodo 3:7. Likas sa modernong Tagalog ang “talagang nakita ko” at napapanatili nito ang diin nang hindi ginagaya nang mekanikal ang anyong Griyego.
- source_word: κάκωσιν
  choice: pagmamalupit
  rationale: Tumutukoy ang salita sa masama at marahas na pagtrato o pang-aapi. Malinaw sa karaniwang mambabasa ang “pagmamalupit” at hindi nito nililimitahan ang kahulugan sa isang tiyak na uri ng pampolitikang pang-aapi.
- source_word: λαοῦ μου τοῦ ἐν Αἰγύπτῳ
  choice: aking bayan sa Ehipto
  rationale: Pinananatili ng “aking bayan” ang pag-aangkin at posibleng pahiwatig ng tipan, samantalang natural na inilalahad ng “sa Ehipto” ang lokasyon.
- source_word: τοῦ στεναγμοῦ αὐτοῦ
  choice: kanilang pagdaing
  rationale: Bagaman isahan ang panghalip sa Griyego dahil kolektibo ang λαός, likas sa Tagalog ang maramihang “kanilang” para sa mga taong bumubuo sa bayan. Ang “pagdaing” ay nagsasaad ng hinaing na dulot ng matinding paghihirap.
- source_word: κατέβην
  choice: Bumaba ako
  rationale: Pinananatili nito ang tuwirang antropomorpikong pananalita tungkol sa pagkilos ng Diyos, nang hindi ito ipinapaliwanag o pinapahina.
- source_word: ἐξελέσθαι
  choice: upang iligtas
  rationale: Sa gitnang tinig, nangangahulugan ito rito ng pagsagip o pagliligtas mula sa panganib at pang-aapi. Ang “iligtas” ay malinaw, natural, at may sapat na lawak ng kahulugan.
- source_word: δεῦρο
  choice: halika
  rationale: Gumaganap itong paanyaya o utos kay Moises na lumapit at tumugon. Ang “halika” ang maikli at natural na katumbas.
- source_word: ἀποστείλω σε εἰς Αἴγυπτον
  choice: isusugo kita sa Ehipto
  rationale: Mas angkop sa banal na pag-aatas ang “isusugo” kaysa sa pangkalahatang “ipapadala,” habang tuwirang pinananatili ng anyong panghinaharap ang “I will send you.”
theological_decisions:
- issue: Antropomorpikong paglalarawan sa pagbaba ng Diyos
  choice: Bumaba ako
  alternative: Nanaog ako / Pumarito ako
  rationale: Tuwirang sinasabi ng teksto na bumaba ang Diyos upang kumilos para sa kanyang bayan. Pinananatili ng salin ang larawan at teolohikong tensiyon sa halip na ipaliwanag ito bilang simpleng pakikialam lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bayan” para sa kolektibong λαός, “pagdaing” para sa στεναγμός, at “isusugo” para sa banal na pag-aatas. Inilipat ang ikalawang talababa sa “iligtas sila,” dahil doon nauukol ang alternatibong leksikal na rescue/deliver; hindi ito nauukol sa δεῦρο (“halika”).
