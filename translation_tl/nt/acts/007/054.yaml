base_translation:
  language: en
  yaml_path: translation/nt/acts/007/054.yaml
  text: When they heard these things[a], they were cut to the heart and gnashed their teeth at him.
translation:
  language: tl
  text: Nang marinig nila ang mga bagay na ito[a], nagngitngit ang kanilang kalooban, at nagngalit sila ng kanilang mga ngipin laban sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para bang hinihiwa ang kanilang mga puso.” Literal na inilalarawan ng pandiwang Griyego na para bang “hinihiwa nang lubos” ang kanilang mga puso, isang matingkad na larawan ng matinding panloob na pagkabagabag o galit.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντες δὲ ταῦτα
  choice: Nang marinig nila ang mga bagay na ito
  rationale: Ginagawang likas na sugnay na panahunan sa Tagalog ang participle na Ἀκούοντες. Hindi kailangang isalin nang hiwalay ang mahinang panandang diskurso na δὲ, sapagkat malinaw na sa daloy ng salaysay ang pag-usad. Pinananatili ng “mga bagay na ito” ang plural na ταῦτα at ang pagtukoy nito sa naunang sinabi ni Esteban.
- source_word: διεπρίοντο ταῖς καρδίαις αὐτῶν
  choice: nagngitngit ang kanilang kalooban
  rationale: Ang διεπρίοντο ay literal na may larawang “nalalagari/nahiwang lubos” ngunit idyomatikong nagpapahayag dito ng matinding panloob na galit o pagkabagabag. Ang “nagngitngit ang kanilang kalooban” ay natural at marangal na Tagalog na naghahatid ng matinding panloob na poot, habang ipinapaliwanag sa talababa ang matingkad na literal na larawan.
- source_word: ἔβρυχον τοὺς ὀδόντας
  choice: nagngalit sila ng kanilang mga ngipin
  rationale: Pinananatili ang kongkretong larawan ng pagkiskis o pagngangalit ng mga ngipin bilang pagpapakita ng matinding galit.
- source_word: ἐπ’ αὐτόν
  choice: laban sa kanya
  rationale: Ipinahihiwatig ng ἐπί sa kontekstong ito ang direksiyon ng pagkapoot. Likas sa Tagalog ang “laban sa kanya” at hindi nito pinalalabo ang kanilang pagkapoot kay Esteban.
