id: ACT.7.60
reference: Acts 7:60
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: θεὶς δὲ τὰ γόνατα ἔκραξεν φωνῇ μεγάλῃ· Κύριε, μὴ στήσῃς αὐτοῖς ⸂ταύτην τὴν ἁμαρτίαν⸃· καὶ τοῦτο εἰπὼν ἐκοιμήθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/060.yaml
  text: Then[a], kneeling down, he cried out with a loud voice, “Lord, do not hold this sin against them.” And after saying this[b], he fell asleep.
translation:
  language: tl
  text: Pagkatapos ay lumuhod siya at sumigaw nang malakas, “Panginoon, huwag mo silang papanagutin sa kasalanang ito[a].” Pagkasabi nito, nakatulog siya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “huwag mong ibilang sa kanila ang kasalanang ito” o “huwag mong iparatang sa kanila ang kasalanang ito.”
    reason: lexical_alternative
  - marker: b
    text: Ang “nakatulog” ay karaniwang pahayag para sa pagkamatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὶς δὲ τὰ γόνατα
  choice: Pagkatapos ay lumuhod siya
  rationale: Ang literal na idyomang ‘inilagay ang mga tuhod’ ay tumutukoy sa pagluhod. Ipinahahayag ng ‘Pagkatapos’ ang pagsulong ng salaysay na ipinahihiwatig ng δέ.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: sumigaw nang malakas
  rationale: Likas na modernong Tagalog ito para sa malakas na pagsigaw na tahasang inilalarawan ng pariralang Griyego.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang marangal at kinikilalang titulo sa Bagong Tipan; sa konteksto, kay Jesus nakatuon ang panawagan.
- source_word: μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: huwag mo silang papanagutin sa kasalanang ito
  rationale: Ipinahahayag nito ang diwang huwag ilagay o ituring na pananagutan nila ang kasalanan, habang pinananatili ang tahasang ‘ito’ ng ταύτην.
- source_word: καὶ τοῦτο εἰπὼν
  choice: Pagkasabi nito
  rationale: Natural at maikli itong katumbas ng temporal na participle at malinaw na tumutukoy sa naunang panalangin.
- source_word: ἐκοιμήθη
  choice: nakatulog siya
  rationale: Pinananatili nito ang talinghaga ng pagtulog na ginagamit ng tekstong Griyego bilang karaniwang pahayag para sa kamatayan.
theological_decisions:
- issue: Talinghaga ng pagtulog sa ἐκοιμήθη
  choice: nakatulog siya
  alternative: namatay siya / pumanaw siya
  rationale: Pinananatili ang mismong talinghaga ng Griyego at ang teolohikal na himig nito nang hindi ito pinapalitan ng tuwirang paliwanag.
- issue: Pagtawag na Κύριε sa panalangin ni Esteban
  choice: Panginoon
  alternative: Ginoo / Panginoon ko
  rationale: Ang ‘Panginoon’ ang natural na katumbas ng titulong κύριος at, ayon sa konteksto ng naunang talata, tumutukoy kay Jesus nang hindi nagdaragdag ng paliwanag sa teksto.
- issue: Forensikong diwa ng μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: huwag mo silang papanagutin sa kasalanang ito
  alternative: huwag mong ibilang sa kanila ang kasalanang ito
  rationale: Pinananatili nito ang diwa ng paglalagay ng kasalanan sa pananagutan ng isang tao, ngunit gumagamit ng malinaw at kasalukuyang Tagalog.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang tuwirang panalangin, ang forensikong diwa ng pananagutan, at ang talinghaga ng pagtulog para sa kamatayan. Inilagay ang bawat panandang talababa sa mismong pariralang ipinaliliwanag nito.
