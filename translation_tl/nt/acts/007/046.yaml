base_translation:
  language: en
  yaml_path: translation/nt/acts/007/046.yaml
  text: who found favor before God and asked to find a dwelling place for the God of Jacob[a].
translation:
  language: tl
  text: na nakasumpong ng lingap sa harap ng Diyos at humiling na makahanap ng isang tirahan para sa Diyos ni Jacob.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang tabernakulo para sa Diyos ni Jacob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν χάριν
  choice: kinalugdan
  rationale: Ang idyomang Griyego ay nangangahulugang tumanggap o magtamo ng pabor. Likas sa modernong Tagalog ang “kinalugdan” at malinaw nitong ipinapakita na ang Diyos ang nagbigay ng pabor.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: ng Diyos
  rationale: Sa pariralang “kinalugdan ng Diyos,” likas nang naipahahayag ang diwang “nakasumpong ng pabor sa harap ng Diyos” nang hindi nagiging mabigat o artipisyal ang Tagalog.
- source_word: ᾐτήσατο
  choice: humiling
  rationale: Ang “humiling” ay malinaw at marangal na katumbas ng paghaharap ng isang kahilingan, nang hindi labis na pormal.
- source_word: εὑρεῖν
  choice: na makahanap
  rationale: Pinananatili nito ang literal na diwa ng infinitibong “makahanap,” sa halip na tahimik na ipakahulugang “maglaan” o “magtayo.”
- source_word: σκήνωμα
  choice: isang tahanan
  rationale: Ang salita ay tumutukoy sa tirahan o tahanan at hindi kinakailangang teknikal na tumukoy sa tabernakulo o templo. Natural at malawak ang “tahanan” sa Tagalog.
- source_word: τῷ θεῷ Ἰακώβ
  choice: para sa Diyos ni Jacob
  rationale: Ipinahahayag ng “para sa” ang datibong ugnayan, at pinananatili ng “Diyos ni Jacob” ang pamilyar na biblikal na katawagan.
theological_decisions:
- issue: Ang uri ng gusali o tirahang hiniling ni David
  choice: isang tahanan para sa Diyos ni Jacob
  alternative: isang tabernakulo para sa Diyos ni Jacob
  rationale: Mas malawak ang σκήνωμα kaysa sa teknikal na katawagang templo. Pinananatili ng “tahanan” ang kalabuan at tensiyon sa salaysay, yamang sa kasunod na talata ay si Solomon ang nagtayo ng bahay.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ang sugnay ay pinanatiling nakaugnay sa naunang talata sa pamamagitan ng pambungad na “na,” ayon sa anyo at daloy ng Griyego.
