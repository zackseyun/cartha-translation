  source_fidelity: Ang “kinalugdan ng Diyos” ay katanggap-tanggap na pagpapahayag ng pagkakaroon ng pabor, ngunit isinasama nito ang ἐνώπιον τοῦ θεοῦ sa isang di-tahasang paraan. Mas malinaw na naipapakita ng “nakasumpong ng lingap sa harap ng Diyos” ang buong idyoma at ang relasyunal na diwa nito. Ang “tahanan” ay posibleng salin ng σκήνωμα, ngunit ang “tirahan” ay mas angkop para sa isang lugar na tinitirhan at hindi nagdadala ng karaniwang domestikong dating ng “tahanan.”
