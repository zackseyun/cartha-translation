base_translation:
  language: en
  yaml_path: translation/nt/acts/007/029.yaml
  text: So Moses fled at this word[a], and became a sojourner in the land of Midian[b], where he fathered two sons.
translation:
  language: tl
  text: Sa sinabing ito[a], tumakas si Moises at namuhay bilang isang dayuhan[b] sa lupain ng Midian. Doon ay naging ama siya ng dalawang anak na lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Dahil sa pahayag na ito” o “Nang marinig niya ang pahayag na ito.” Ang pariralang Griyego ay maaaring tumukoy sa pagkakataon o sa agarang dahilan ng pagtakas ni Moises.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nanirahan bilang isang banyaga” o “naging residenteng dayuhan.” Tumutukoy ang salita sa taong naninirahan sa lupaing hindi niya sariling bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: tumakas
  rationale: Malinaw na ipinapahayag ng pandiwang φεύγω ang mabilis na paglayo upang umiwas sa panganib; likas at tuwiran sa Filipino ang “tumakas.”
- source_word: δὲ
  choice: Dahil
  rationale: Sa konteksto, iniuugnay ng δέ ang pagtakas ni Moises sa naunang sinabi. Ang “Dahil” ay natural na naghahatid ng banayad na ugnayang sanhi na ipinahihiwatig ng salaysay.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: sa sinabing iyon
  rationale: Ang λόγος dito ay tumutukoy sa naunang pahayag. Ang “sa sinabing iyon” ay mas natural kaysa literal na “sa salitang iyon,” habang pinananatili sa talababa ang posibilidad na tumukoy ang parirala sa pagkakataon o agarang sanhi ng pagtakas.
- source_word: ἐγένετο πάροικος
  choice: namuhay bilang dayuhan
  rationale: Ang πάροικος ay isang taong naninirahan sa lupaing hindi kanya. Ipinahahayag ng “namuhay bilang dayuhan” ang kalagayan ni Moises nang hindi gumagamit ng teknikal o lipas na katawagan.
- source_word: ἐν γῇ Μαδιάμ
  choice: sa lupain ng Midian
  rationale: Pinananatili ng “lupain ng Midian” ang heograpikong anyo ng γῇ Μαδιάμ.
- source_word: οὗ
  choice: Doon
  rationale: Itinuturo ng οὗ ang Midian bilang lugar ng sumunod na pangyayari. Ang “Doon” ay malinaw at natural sa paghahati ng pangungusap sa Filipino.
- source_word: ἐγέννησεν υἱοὺς δύο
  choice: nagkaroon siya ng dalawang anak na lalaki
  rationale: Si Moises ang panlalaking simuno ng γεννάω, ngunit sa natural na Filipino, ang “nagkaroon siya ng dalawang anak na lalaki” ang malinaw at di-makalumang paraan upang sabihing naging ama siya ng dalawang anak.
