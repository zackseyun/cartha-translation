  text: καὶ ἐμοσχοποίησαν ἐν ταῖς ἡμέραις ἐκείναις καὶ ἀνήγαγον θυσίαν τῷ εἰδώλῳ, καὶ εὐφραίνοντο ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/041.yaml
  text: And in those days they made a calf and offered a sacrifice to the idol[b][a], and they were rejoicing in the works of their hands.
translation:
  language: tl
  text: Noong mga araw na iyon, gumawa sila ng isang guya[a] at naghandog ng hain sa diyus-diyosan, at nagagalak sila sa mga gawa ng sarili nilang mga kamay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “humubog sila ng isang guya.”
    reason: lexical_alternative
  - marker: b
    text: O “nagagalak sila sa mga ginawa ng sarili nilang mga kamay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοσχοποίησαν
  choice: gumawa sila ng isang guya
  rationale: Tuwirang ipinapahayag ng pandiwa ang paggawa o paghubog ng isang guya. Hindi na kailangang idagdag ang “diyus-diyosan” dito dahil malinaw itong tinutukoy sa kasunod na parirala.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: nang mga araw na iyon
  rationale: Likas na makabagong Tagalog para sa karaniwang pariralang temporal, habang pinananatili ang pagtukoy sa panahong iyon.
- source_word: ἀνήγαγον θυσίαν
  choice: naghandog ng hain
  rationale: Sa kontekstong pansamba, ipinahihiwatig ng parirala ang paghahandog. Pinananatili ng “hain” ang tiyak na sakripisyal na diwa.
- source_word: τῷ εἰδώλῳ
  choice: sa diyus-diyosan
  rationale: Ang tiyak na diyus-diyosan ay ang guyang kababanggit lamang. Ang “diyus-diyosan” ay malinaw at pinananatili ang mapanuring puwersa ng εἴδωλον.
- source_word: εὐφραίνοντο
  choice: nagagalak sila
  rationale: Ipinahihiwatig ng imperpektong anyo ang nagpapatuloy na pagkagalak. Natural sa Tagalog ang “nagagalak sila” at hindi nito dinaragdagan ang teksto ng mas tiyak na ideya ng pagdiriwang.
- source_word: ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν
  choice: sa gawa ng sarili nilang mga kamay
  rationale: Pinananatili nito ang biblikal na larawang tumutuligsa sa pagsamba sa bagay na sila rin ang gumawa, ngunit mas natural kaysa sa lubhang literal na “mga gawa ng kanilang mga kamay.”
theological_decisions:
- issue: Wika at retorikal na puwersa ng pagsamba sa diyus-diyosan
  choice: Gamitin ang “diyus-diyosan” at panatilihin ang larawan ng “gawa ng sarili nilang mga kamay.”
  alternative: Gamitin ang mas neutral na “larawan” at ang payak na “sa ginawa nila.”
  rationale: Ang pananalita ni Esteban ay tahasang tumutuligsa sa idolatriya. Pinananatili ng salin ang hatol na iyon at ang alingawngaw ng biblikal na pagpuna nang hindi nagdaragdag ng denominasyonal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “guya,” “hain,” at “diyus-diyosan” bilang mga salitang madaling maunawaan ngunit angkop sa biblikal na konteksto. Pinanatili ang aspekto ng patuloy na pagkagalak at ang matalim na ironiyang sila mismo ang gumawa ng sinasamba nila.
