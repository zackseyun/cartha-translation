  text: But crying out with a loud voice[a], they covered their ears and rushed together at him,
translation:
  language: tl
  text: Ngunit sumigaw sila nang malakas, tinakpan nila ang kanilang mga tainga, at sama-sama silang sumugod sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nang magkakaisa.” Binibigyang-diin ng salitang Griyego ang kanilang nagkakaisang pagkilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξαντες
  choice: sumigaw
  rationale: Ang aorist participle ng κράζω ay tumutukoy sa malakas na pagsigaw. Natural sa Tagalog ang sunod-sunod na pandiwang “sumigaw … tinakpan … sumugod,” at hindi nito dinaragdagan ang emosyon na hindi tiyak sa Griyego.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang pagliko o bahagyang pagsalungat mula sa pangitain ni Esteban tungo sa marahas na reaksiyon ng mga nakikinig.
- source_word: φωνῇ μεγάλῃ
  choice: nang malakas
  rationale: Ito ang natural at malinaw na katumbas sa modernong Tagalog ng idyomang “sa malakas na tinig,” nang hindi nawawala ang diin sa lakas ng sigaw.
- source_word: συνέσχον τὰ ὦτα αὐτῶν
  choice: tinakpan ang kanilang mga tainga
  rationale: Ang parirala ay idyomang nagsasaad na sinarhan o tinakpan nila ang kanilang mga tainga upang hindi makarinig. Ito ang pinakanatural na modernong Tagalog.
- source_word: ὥρμησαν
  choice: sumugod
  rationale: Ipinahihiwatig ng ὁρμάω ang biglaan at mapuwersang pagkilos patungo sa isang tao. Ang “sumugod” ay likas na Tagalog at angkop sa kontekstong mapanlaban.
- source_word: ὁμοθυμαδὸν
  choice: sabay-sabay
  rationale: Ipinakikita ng pang-abay ang nagkakaisang pagkilos ng pangkat. Natural ang “sabay-sabay,” habang inilalagay sa talababa ang posibleng mas tahasang diwang “na nagkakaisa.”
- source_word: ἐπ’ αὐτόν
  choice: sa kanya
  rationale: Sa kasamang pandiwang “sumugod,” malinaw na ipinahihiwatig ng ἐπί na ang pagkilos ay nakatuon kay Esteban; natural sa Tagalog ang “sumugod sa kanya.”
