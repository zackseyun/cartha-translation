  text: καὶ ἐπαιδεύθη ⸀Μωϋσῆς πάσῃ σοφίᾳ Αἰγυπτίων, ἦν δὲ δυνατὸς ἐν λόγοις καὶ ἔργοις ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/022.yaml
  text: And Moses was educated in all the wisdom of the Egyptians, and he was mighty in his words and deeds.
translation:
  language: tl
  text: Tinuruan si Moises sa lahat ng karunungan ng mga Ehipsiyo, at makapangyarihan siya sa kanyang mga salita at gawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pananalita at pagkilos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαιδεύθη
  choice: Tinuruan
  rationale: Ipinahihiwatig ng pasibong pandiwa na tumanggap si Moises ng malawak na pagtuturo o paghuhubog. Natural at malinaw sa modernong Tagalog ang “tinuruan,” nang hindi nililimitahan ang diwa sa pormal na pag-aaral lamang.
- source_word: πάσῃ σοφίᾳ Αἰγυπτίων
  choice: sa lahat ng karunungan ng mga Ehipsiyo
  rationale: Pinananatili nito ang lawak ng πάσῃ at ang karunungang nauugnay sa mga Ehipsiyo bilang nilalaman o larangan ng pagtuturo.
- source_word: δυνατὸς
  choice: makapangyarihan
  rationale: Ipinapahayag nito ang lakas at bisa ng δυνατός at likas itong iugnay sa sumusunod na “mga salita at gawa.”
- source_word: ἐν λόγοις καὶ ἔργοις αὐτοῦ
  choice: sa kanyang mga salita at gawa
  rationale: Pinananatili ang balanseng tambalan ng λόγοις at ἔργοις, habang malinaw na iniuugnay ng “kanyang” ang mga ito kay Moises. Hindi kailangang ulitin ang panghalip bago ang “gawa” sa Tagalog.
theological_decisions:
- issue: Ang saklaw ng kakayahan ni Moises sa λόγοις
  choice: “makapangyarihan siya sa kanyang mga salita at gawa”
  alternative: Ipaliwanag ang “mga salita” bilang reputasyon, epekto, o kakayahan lamang sa halip na sariling pananalita ni Moises
  rationale: Isinasalin ang pahayag ni Esteban ayon sa sarili nitong diwa at hindi ito ipinapaliwanag upang ipantugma sa Exodo 4:10. Sa gayon, nananatili ang tunay na tensiyon sa pagitan ng dalawang pahayag.
translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang maikling balanseng ayos ng “mga salita at gawa” at iniwasan ang sobrang pagpapaliwanag.
