  text: εἶπεν δὲ αὐτῷ ὁ κύριος· Λῦσον τὸ ὑπόδημα τῶν ποδῶν σου, ὁ γὰρ τόπος ⸀ἐφ’ ᾧ ἕστηκας γῆ ἁγία ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/033.yaml
  text: Then the Lord said to him[a], ‘Take off the sandals from your feet, for the place on which you are standing is holy ground.’
translation:
  language: tl
  text: Sinabi sa kanya ng Panginoon, “Hubarin mo ang sandalyas mula sa iyong mga paa,[a] sapagkat banal na lupa ang lugar na kinatatayuan mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Kalagin mo ang sandalyas mula sa iyong mga paa.” Isahan ang “sandalyas” sa Griyego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang marangal na salin ng κύριος bilang titulo; pinananatili nito ang paggalang at hindi ipinapasok ang anyong pantukoy sa banal na pangalan na wala sa tekstong Griyego.
- source_word: Λῦσον
  choice: Hubarin mo
  rationale: Bagaman literal na nangangahulugang ‘kalagin’ o ‘luwagan,’ ang likas na diwa nito kaugnay ng panyapak ay alisin o hubarin.
- source_word: τὸ ὑπόδημα τῶν ποδῶν σου
  choice: ang sandalyas sa iyong mga paa
  rationale: Ang ὑπόδημα ay pormal na isahan, ngunit maaaring kolektibong tumukoy sa panyapak; ang ‘sandalyas’ ay likas sa modernong Tagalog, habang ang talababa ay nagpapanatili sa mas literal na anyo.
- source_word: ὁ γὰρ τόπος
  choice: sapagkat … ang lugar
  rationale: Isinasalin ng ‘sapagkat’ ang paliwanag na puwersa ng γάρ, at ang ‘lugar’ ang tuwirang katumbas ng τόπος.
- source_word: ἐφ’ ᾧ ἕστηκας
  choice: na kinatatayuan mo
  rationale: Natural na Tagalog na nagpapanatili sa diwa ng ἐπί at sa kasalukuyang kalagayang ipinahihiwatig ng perpektong ἕστηκας.
- source_word: γῆ ἁγία
  choice: banal na lupa
  rationale: Sa lokal na tagpo, ‘lupa’ ang pinakaangkop sa γῆ; pinananatili ng ‘banal’ ang relihiyosong bigat ng ἁγία.
theological_decisions:
- issue: Pagsasalin ng κύριος sa sipi tungkol sa pagpapakita ng Diyos sa nagliliyab na palumpong
  choice: Panginoon
  alternative: YHWH / ANG PANGINOON
  rationale: κύριος ang nasa tekstong Griyego, hindi ang Tetragrammaton; kaya ‘Panginoon’ ang tapat sa agarang pinagmulan habang pinananatili ang banal na paggalang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang likas na ‘hubarin’ sa pangunahing teksto, habang inilagay sa talababa ang literal na ‘kalagin’ at ang pormal na isahang anyo ng ‘sandalyas.’
