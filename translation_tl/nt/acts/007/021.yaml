  text: ⸂ἐκτεθέντος δὲ αὐτοῦ ἀνείλατο αὐτὸν⸃ ἡ θυγάτηρ Φαραὼ καὶ ἀνεθρέψατο αὐτὸν ἑαυτῇ εἰς υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/021.yaml
  text: But when he had been exposed[b][a], Pharaoh’s daughter took him up and raised him as her own son.
translation:
  language: tl
  text: Ngunit nang siya’y iwan sa labas[a], kinuha siya[b] ng anak na babae ng Faraon at pinalaki bilang sarili niyang anak.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang ilagay siya sa labas.” Ang Griyego ay maaaring tumukoy sa paglalantad o pag-iwan ng isang sanggol sa labas.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dinampot siya.” Ang pandiwang Griyego ay maaaring tumukoy sa pagkuha sa isang sanggol na iniwan sa labas.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “para maging anak” o “bilang anak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτεθέντος
  choice: nang ilabas at iwan siya
  rationale: Ang aorist passive participle ng ἐκτίθημι ay tumutukoy rito sa paglalagay ng sanggol sa labas at pag-iwan sa kaniya. Pinananatili ng parirala ang kongkretong kilos nang hindi ginagawang tahasang ganap na pagtalikod ang motibo.
- source_word: δὲ
  choice: Ngunit
  rationale: Naghuhudyat ang δέ ng paglipat at bahagyang pagsalungat mula sa pag-iwan kay Moises tungo sa pagkalinga sa kaniya.
- source_word: ἀνείλατο
  choice: kinuha siya
  rationale: Sa kontekstong ito, ang middle form ng ἀναιρέω ay nangangahulugang kunin o damputin ang isang sanggol na iniwan sa labas. Hindi ginamit ang “inampon” sapagkat ang pagiging anak ay hiwalay na ipinahahayag sa hulihan ng talata.
- source_word: ἡ θυγάτηρ Φαραὼ
  choice: ang anak na babae ng Faraon
  rationale: Likas at malinaw na pagpapahayag sa Filipino ng ugnayang genitibo.
- source_word: ἀνεθρέψατο
  choice: pinalaki
  rationale: Ang ἀνατρέφω ay tumutukoy sa pag-aaruga at pagpapalaki sa isang bata.
- source_word: ἑαυτῇ εἰς υἱόν
  choice: bilang sarili niyang anak
  rationale: Magkasamang ipinahahayag ng reflexive dative at εἰς υἱόν na pinalaki niya si Moises sa katayuan ng anak na nauukol sa kaniya; natural itong naihahatid ng “bilang sarili niyang anak.”
theological_decisions:
- issue: Kung tahasang tatawaging pag-aampon ang ginawa ng anak na babae ng Faraon
  choice: Panatilihing magkahiwalay ang pagkuha sa sanggol at ang pagpapalaki sa kaniya bilang anak.
  alternative: “inampon siya ng anak na babae ng Faraon”
  rationale: Hindi mismong terminong legal para sa pag-aampon ang ἀνείλατο, at hiwalay na ipinakikita ng εἰς υἱόν ang kinahinatnang ugnayan bilang anak. Iniiwasan nitong magpasok ng mas tiyak na legal o teolohikal na konsepto kaysa sa sinasabi ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “anak na babae ng Faraon” upang maiwasan ang posibleng kalabuan ng “anak ng Faraon,” at pinanatiling payak ang salaysay nang hindi ginagawang teknikal na terminong legal ang ugnayan.
