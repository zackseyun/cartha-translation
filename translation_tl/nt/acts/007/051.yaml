  naturalness: 'Likas at mariin ang modernong Filipino: “matitigas ang batok,” “hindi tuli ang puso at mga tainga,” at “Gaya ng inyong mga ninuno, gayon din kayo.” Ang bahagyang eliptikal na huling sugnay ay natural sa retorikal na Filipino at tumutugma sa pagkakaayos ng Griyego.'
  terminology: Ang “Espiritu Santo” ay angkop na pamantayang katawagan. Ang “hindi tuli” ay wastong nagpapanatili sa literal at pangtipang metapora, sa halip na ipaliwanag ito bilang simpleng katigasan ng puso o pagiging bingi. Ang “mga ninuno,” na may talababa para sa literal na “mga ama,” ay isang katanggap-tanggap na likas na salin para sa tinutukoy na mga naunang salinlahi.
