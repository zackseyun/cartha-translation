id: ACT.7.51
reference: Acts 7:51
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Σκληροτράχηλοι καὶ ἀπερίτμητοι ⸀καρδίαις καὶ τοῖς ὠσίν, ὑμεῖς ἀεὶ τῷ πνεύματι τῷ ἁγίῳ ἀντιπίπτετε, ὡς οἱ πατέρες ὑμῶν καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/051.yaml
  text: You stiff-necked people[a], uncircumcised in hearts and ears, you always resist the Holy Spirit; as your fathers did, so do you.
translation:
  language: tl
  text: “Kayong mga matitigas ang batok at hindi tuli ang puso at mga tainga! Lagi ninyong nilalabanan ang Espiritu Santo. Gaya ng inyong mga ninuno[a], gayon din kayo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “inyong mga ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σκληροτράχηλοι
  choice: mga matitigas ang batok
  rationale: Pinananatili ang matingkad na metapora ng Griyego at ang kaugnayan nito sa pananalita ng Lumang Tipan, sa halip na gawing payak lamang na “mga matigas ang ulo” o “mga suwail.”
- source_word: ἀπερίτμητοι
  choice: hindi tuli
  rationale: Pinananatili ang literal na katawagang kaugnay ng tipan sapagkat umaalingawngaw rito ang pananalita ng mga propeta tungkol sa panloob na paghihimagsik.
- source_word: καρδίαις καὶ τοῖς ὠσίν
  choice: ang puso at mga tainga
  rationale: Ipinahahayag ang dative of respect bilang mga bahaging hindi tuli. Ang isahang “puso” ay likas sa Filipino sa ganitong pangkalahatang tuwirang pagtawag, samantalang malinaw na tumutukoy ito sa puso ng bawat kausap.
- source_word: ἀεὶ
  choice: lagi
  rationale: Likas at tuwirang salin ng pang-abay na nagsasaad ng nagpapatuloy na huwaran.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: ang Espiritu Santo
  rationale: Karaniwang makabagong katawagan sa Filipino para sa tiyak at personal na banal na tinutukoy sa konteksto ng Mga Gawa.
- source_word: ἀντιπίπτετε
  choice: nilalabanan
  rationale: Naghahatid ng aktibong pagsalungat at paglaban nang hindi nagpapalawak nang lampas sa diwa ng pandiwang Griyego.
- source_word: ὡς
  choice: Gaya ng
  rationale: Likas na nagpapakilala sa paghahambing ng kasalukuyang mga kausap at ng naunang salinlahi.
- source_word: οἱ πατέρες ὑμῶν
  choice: inyong mga ninuno[a]
  rationale: Ang “mga ninuno” ang likas at malinaw na Filipino para sa mga ama ng naunang salinlahi; itinatala sa talababa ang mas literal na anyong Griyego.
- source_word: καὶ ὑμεῖς
  choice: gayon din kayo
  rationale: Pinananatili ang maigsi at mariing paghahambing ng Griyego, na may pandiwang nauunawaan mula sa naunang sugnay.
theological_decisions:
- issue: Tinutukoy ng “Espiritu Santo”
  choice: Ang personal at banal na Espiritu Santo
  alternative: Banal na espiritu bilang pangkalahatang impluwensiya o disposisyon mula sa Diyos
  rationale: Sa Mga Gawa, karaniwang tumutukoy ang tiyak na pariralang ito sa Espiritu Santo bilang personal na banal na kumikilos. Ipinakikita ng malaking titik ang kontekstuwal na pagbasa nang walang idinaragdag sa teksto.
- issue: Larawang kaugnay ng pagtutuli at tipan
  choice: Panatilihin ang “hindi tuli” bilang paglalarawan sa puso at mga tainga
  alternative: Ipaliwanag bilang “sarado ang puso at ayaw makinig”
  rationale: Sinasadya ng talata ang alingawngaw ng wikang propetiko at pangtipan. Ang pagpapanatili sa metapora ay hindi nagpapaliit dito bilang pangkalahatang suliraning sikolohikal lamang.
- issue: Katawagan sa naunang salinlahi
  choice: inyong mga ninuno, na may talababa para sa literal na “mga ama”
  alternative: inyong mga ama
  rationale: Ang “mga ninuno” ay malinaw at likas sa modernong Filipino para sa tinutukoy na mga salinlahi ng Israel, habang pinangangalagaan ng talababa ang panlalaking anyo ng Griyego.
translation_notes:
  register: Makabago ngunit marangal at mariin ang pananalita. Pinanatili ang matatalas na metaporang “matitigas ang batok” at “hindi tuli” upang madama ang propetikong paratang, habang ginawang likas sa Filipino ang ayos ng pangungusap.
