  yaml_path: translation/nt/acts/007/003.yaml
  text: And he said to him[a], ‘Go out from your land and from your kindred, and come into the land that I will show you.’
translation:
  language: tl
  text: At sinabi niya sa kanya, “Umalis ka sa iyong lupain at sa iyong angkan[a], at pumunta ka sa lupaing ipakikita ko sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kamag-anak” o “pamilya.” Ang Griyegong συγγένεια ay tumutukoy sa pangkat ng mga magkakamag-anak o sa angkan ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτόν
  choice: sinabi niya sa kanya
  rationale: Pinananatili ang tuwirang pormulang pasalaysay at ang panghalip ng Griyego sa halip na palitan ito ng pangalang Abraham.
- source_word: Ἔξελθε ἐκ τῆς γῆς σου
  choice: Umalis ka sa iyong lupain
  rationale: Likas sa modernong Tagalog ang “umalis” para sa utos na lumabas o lumisan, habang ang “lupain” ay nagpapanatili sa malawak na teritoryal na diwa ng γῆ nang hindi nagpapahiwatig ng makabagong bansang-estado.
- source_word: συγγενείας
  choice: angkan
  rationale: Ipinahahayag ng “angkan” ang kolektibong pangkat na magkakamag-anak o may iisang salinlahi; hindi ito nililimitahan sa sambahayan lamang.
- source_word: δεῦρο εἰς τὴν γῆν
  choice: pumunta ka sa lupain
  rationale: Bagaman may deiktikong diwa na “halika” ang δεῦρο, mas natural sa iniulat na pananalita sa Tagalog ang “pumunta” kapag isang lupain ang patutunguhan. Naipahahayag pa rin nito ang iniutos na pagkilos tungo sa lugar.
- source_word: ἣν ἄν σοι δείξω
  choice: ipakikita ko sa iyo
  rationale: Ang sugnay na may ἄν at aorist subjunctive ay nakatuon sa hinaharap sa kontekstong ito; malinaw at likas ang “ipakikita ko sa iyo” nang hindi nagpapahiwatig ng pag-aalinlangan.
