  source_fidelity: 'Tumpak sa kabuuan ang salin: naipapahayag nito ang participial na ugnayan, ang utos kay Aaron, ang literal na «mga diyos,» ang pagpunta sa unahan, ang dahilan na ipinakikilala ng γάρ, at ang paglabas mula sa lupain ng Egipto. Gayunman, ang «ano na ang nangyari» ay nagdaragdag ng aspektong ‘na/already’ na hindi tahasang nasa τί ἐγένετο αὐτῷ.'
  naturalness: Malinaw at marangal ang rehistro. Mas natural at mas eksakto ang «kung ano ang nangyari sa kaniya» kaysa «kung ano na ang nangyari sa kaniya.» Ang «mauuna sa amin» ay katanggap-tanggap at pinananatili ang diwang ‘go before,’ nang hindi idinaragdag ang kahulugang ‘mamumuno.’
  terminology: Ang «mga diyos» ay wastong pangunahing salin ng θεοὺς; ang «mga diyus-diyosan» ay nararapat lamang bilang alternatibo sa talababa. Ang mga pangalang Aaron, Moises, at Egipto ay katanggap-tanggap sa pormal na makabagong Filipino.
