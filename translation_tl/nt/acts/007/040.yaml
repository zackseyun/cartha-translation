id: ACT.7.40
reference: Acts 7:40
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰπόντες τῷ Ἀαρών· Ποίησον ἡμῖν θεοὺς οἳ προπορεύσονται ἡμῶν· ὁ γὰρ Μωϋσῆς οὗτος, ὃς ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου, οὐκ οἴδαμεν τί ⸀ἐγένετο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/040.yaml
  text: saying to Aaron[a], ‘Make gods for us who will go before us, for this Moses[b], who led us out from the land of Egypt—we do not know what has happened to him.’
translation:
  language: tl
  text: na nagsabi kay Aaron, “Gumawa ka para sa amin ng mga diyos[a] na mauuna sa amin. Sapagkat ang Moises na ito, na naglabas sa amin mula sa lupain ng Egipto—hindi namin alam kung ano ang nangyari sa kaniya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga diyus-diyosan.” Literal na “mga diyos” ang salitang Griyego, na umaalingawngaw sa pananalita ng salaysay sa Exodo at pinananatili ang mismong pag-aangkin ng mga tao sa halip na palitan ito ng isang interpretatibong katawagan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντες τῷ Ἀαρών
  choice: na nagsabi kay Aaron
  rationale: Ang aorist participle ay likas na iniuugnay sa naunang salaysay sa Tagalog sa pamamagitan ng “na nagsabi,” habang malinaw na ipinakikilala ang sinabi kay Aaron.
- source_word: Ποίησον ἡμῖν
  choice: Gumawa ka para sa amin
  rationale: Tuwirang ipinapahayag ang pautos na anyo at ang benepaktibong ἡμῖν sa natural na modernong Tagalog.
- source_word: θεοὺς
  choice: mga diyos
  rationale: Ito ang tuwirang kahulugan ng plural na θεός at pinananatili ang mismong pag-aangkin ng mga tao at ang alusyon sa salaysay ng Exodo, sa halip na palitan ito agad ng interpretatibong “mga diyus-diyosan.”
- source_word: οἳ προπορεύσονται ἡμῶν
  choice: na mauuna sa amin
  rationale: Pinananatili nito ang diwa ng paglakad o pagpunta sa unahan nang hindi idinaragdag ang mas interpretatibong ideya ng pamumuno.
- source_word: ὁ γὰρ Μωϋσῆς οὗτος
  choice: Sapagkat ang Moises na ito
  rationale: Ang “sapagkat” ay naghahayag ng dahilan, at ang “Moises na ito” ay nagpapanatili sa demonstratibong diin at maaaring mapanglayong tono ng οὗτος.
- source_word: ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου
  choice: naglabas sa amin mula sa lupain ng Egipto
  rationale: Pinananatili ang kilos ng paglalabas at ang tahasang γῆς, “lupain,” sa malinaw na Tagalog.
- source_word: οὐκ οἴδαμεν τί ἐγένετο αὐτῷ
  choice: hindi namin alam kung ano na ang nangyari sa kaniya
  rationale: Natural na Tagalog ito para sa kawalan nila ng kaalaman tungkol sa sinapit ni Moises; tumutulong ang “na” upang ipahiwatig ang kasalukuyang resulta nang hindi labis na nililinaw ang aspekto.
theological_decisions:
- issue: Pagpapakahulugan sa θεοὺς sa konteksto ng idolatriya
  choice: mga diyos
  alternative: mga diyus-diyosan
  rationale: Ginagamit ng Griyego ang karaniwang salita para sa “mga diyos,” hindi ang hiwalay na katawagang tahasang nangangahulugang “mga diyus-diyosan.” Pinananatili ng pangunahing teksto ang pananalita at teolohikal na kabalintunaan ng kahilingan ng mga tao.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaniya” sa pormal na baybay at ang gitling na em dash upang katawanin ang biglang paglipat sa pangunahing pahayag. Pinanatili ang “lupain ng Egipto” dahil tahasang naroon ang γῆς sa pinagmulan.
