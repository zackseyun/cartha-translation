id: ACT.7.38
reference: Acts 7:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ γενόμενος ἐν τῇ ἐκκλησίᾳ ἐν τῇ ἐρήμῳ μετὰ τοῦ ἀγγέλου τοῦ λαλοῦντος αὐτῷ ἐν τῷ ὄρει Σινᾶ καὶ τῶν πατέρων ἡμῶν, ὃς ἐδέξατο ⸀λόγια ζῶντα δοῦναι ⸀ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/038.yaml
  text: This is the one who was in the assembly in the wilderness with the angel who was speaking to him on Mount Sinai[a], and with our fathers[c][b]; he received living oracles to give to us.
translation:
  language: tl
  text: Siya ang nasa kapulungan sa ilang, kasama ng anghel na nagsasalita sa kanya sa Bundok Sinai at ng ating mga ninuno.[a] Tumanggap siya ng mga salitang buhay[b] upang ibigay sa atin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ating mga ninuno” ay tumutukoy sa mga ninunong Israelita; maaari ring isaling “ating mga ama.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga buhay na pahayag” o “mga pahayag na nagbibigay-buhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: kapulungan
  rationale: Tumutukoy sa Israel na nagkakatipon sa ilang. Iniiwasan ng “kapulungan” ang pagpasok ng mas huling institusyonal na diwa ng “iglesia,” habang pinananatili ang pangunahing kahulugan ng salitang Griyego.
- source_word: ἐρήμῳ
  choice: ilang
  rationale: Ito ang natural at tradisyonal na salitang Tagalog para sa ilang na dinaanan ng Israel; hindi ito kasinsikip ng kahulugang “disyerto.”
- source_word: ἀγγέλου
  choice: anghel
  rationale: Sa konteksto ng Sinai at ng talumpati sa Mga Gawa 7, isang makalangit na nilalang ang tinutukoy, hindi isang taong mensahero.
- source_word: λαλοῦντος
  choice: na nakikipag-usap
  rationale: Ipinahihiwatig ng anyo ng pandiwa ang nagpapatuloy na pakikipag-usap sa tagpo, at natural itong pakinggan sa Filipino.
- source_word: ὄρει Σινᾶ
  choice: Bundok Sinai
  rationale: Ito ang karaniwang anyo ng pangalan ng lugar sa modernong Filipino.
- source_word: πατέρων ἡμῶν
  choice: ating mga ninuno
  rationale: Sa konteksto, tumutukoy ito sa mga ninunong Israelita. Mas natural at malinaw sa Filipino ang “mga ninuno” kaysa literal na “mga ama,” nang hindi binabago ang tinutukoy.
- source_word: ἐδέξατο
  choice: tumanggap
  rationale: Malinaw nitong inilalarawan si Moises bilang tumanggap ng pahayag ng Diyos.
- source_word: λόγια
  choice: mga pahayag
  rationale: Ang λόγια ay mga banal na pahayag o kapahayagan, hindi karaniwang mga salita lamang. Mas malinaw sa ordinaryong mambabasa ang “mga pahayag” kaysa “mga orakulo.”
- source_word: ζῶντα
  choice: buhay na
  rationale: Pinananatili nito ang tuwirang paglalarawan ng Griyego at ang teolohikal na tensiyon, sa halip na agad ipakahulugang “nagbibigay-buhay.”
- source_word: δοῦναι
  choice: upang ibigay
  rationale: Natural na ipinapahayag nito ang layunin ng pagtanggap ni Moises sa mga pahayag.
- source_word: ἡμῖν
  choice: sa atin
  rationale: Pinananatili nito ang pakikiisa ni Esteban at ng kanyang mga tagapakinig sa kasaysayan ng Israel.
- source_word: ὁ γενόμενος
  choice: Siya ang kasama
  rationale: Sa pangungusap, ang parirala ay tumutukoy kay Moises bilang naroon at kabilang sa kapulungan; ang “kasama” ay natural ngunit hindi nagpapahiwatig na siya lamang ay pisikal na naroroon.
theological_decisions:
- issue: Kung isasalin ang ἐκκλησίᾳ bilang “iglesia” tungkol sa Israel sa ilang
  choice: kapulungan
  alternative: iglesia; kongregasyon
  rationale: Ang tinutukoy ay ang nagkakatipong Israel sa ilang. Hindi kailangan ng teksto na ituring ito bilang ang mas huling institusyon ng iglesia; pinananatili ng “kapulungan” ang leksikal na diwa nang hindi nagpapataw ng gayong konklusyon.
- issue: Kung bibigyang-kahulugan ang λόγια ζῶντα bilang “mga pahayag na nagbibigay-buhay”
  choice: mga buhay na pahayag
  alternative: mga salitang buhay; mga pahayag na nagbibigay-buhay
  rationale: Sadyang masinsin at mayaman ang pariralang Griyego. Pinananatili ng “mga buhay na pahayag” ang paglalarawan sa mga pahayag bilang buhay, nang hindi nililimitahan ang kahulugan sa pagiging nagbibigay-buhay lamang.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kapulungan” sa halip na “iglesia” upang hindi magpasok ng mas huling institusyonal na kahulugan. Ang “mga buhay na pahayag” ay bahagyang di-karaniwan ngunit sadyang pinananatili ang masinsin at bukás na paglalarawan ng Griyego.
