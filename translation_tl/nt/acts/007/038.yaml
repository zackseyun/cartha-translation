    rationale: Ang pariralang Griyego ay tumutukoy kay Moises bilang nasa kapulungan sa ilang. Sa Filipino, ang “kasama ng kapulungan” ay maaaring mangahulugang kasama, kaanib, o ka-partner ng kapulungan, at hindi malinaw na siya ay naroon sa loob nito.
  - severity: low
    issue: Ang “nakikipag-usap sa kanya” ay may bahagyang kapwaang diwa.
    rationale: Ang λαλοῦντος αὐτῷ ay inilalarawan ang anghel bilang nagsasalita kay Moises; hindi kinakailangang ihayag na kapwa silang nag-uusap.
  - severity: low
    issue: Ang “mga buhay na pahayag” ay bahagyang hindi pangkaraniwan sa modernong Filipino.
    rationale: Bagaman malapit sa anyo ng Griyego, mas natural ang “mga salitang buhay,” na pinananatili pa rin ang katangian ng mga salita bilang “buhay” at hindi awtomatikong binibigyang-kahulugang “nagbibigay-buhay.”
