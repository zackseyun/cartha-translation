  to: Siya ang nasa kapulungan sa ilang, kasama ng anghel na nagsasalita sa kanya sa Bundok Sinai at ng ating mga ninuno.[a] Tumanggap siya ng mga salitang buhay[b] upang ibigay sa atin.
