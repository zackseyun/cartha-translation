  source_fidelity: Kailangang itama ang “Siya ang kasama ng kapulungan,” sapagkat ang ὁ γενόμενος ἐν τῇ ἐκκλησίᾳ ay nagsasaad na si Moises ay nasa/present sa kapulungan, hindi lamang na kasama o kaanib nito. Ang “nakikipag-usap” ay katanggap-tanggap sa pangkalahatan ngunit mas reciprocal kaysa sa λαλοῦντος αὐτῷ, na tuwirang “nagsasalita sa kanya.” Ang “upang ibigay sa atin” ay wastong naghahayag ng layunin ng δοῦναι ἡμῖν.
  naturalness: Mas natural at malinaw sa modernong Filipino ang “Siya ang nasa kapulungan” at “anghel na nagsasalita sa kanya.” Ang “mga buhay na pahayag” ay nauunawaan ngunit medyo di-karaniwang kolokasyon; “mga salitang buhay” ay mas likas habang pinananatili ang maikling, bukás na paglalarawan ng λόγια ζῶντα.
  terminology: Ang “kapulungan,” “ilang,” “anghel,” at “Bundok Sinai” ay angkop. Pinananatili ang “ating mga ninuno” bilang likas na Filipino para sa πατέρων ἡμῶν, na may talababa para sa mas literal na “ating mga ama.” Ang “mga salitang buhay” ay isang maingat na salin ng λόγια ζῶντα; hindi nito ipinapataw ang mas makitid na “nagbibigay-buhay.”
