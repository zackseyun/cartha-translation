  text: καὶ ἐξείλατο αὐτὸν ἐκ πασῶν τῶν θλίψεων αὐτοῦ, καὶ ἔδωκεν αὐτῷ χάριν καὶ σοφίαν ἐναντίον Φαραὼ βασιλέως Αἰγύπτου, καὶ κατέστησεν αὐτὸν ἡγούμενον ἐπ’ Αἴγυπτον ⸀καὶ ὅλον τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/010.yaml
  text: and rescued him from all his afflictions[a], and gave him favor and wisdom before Pharaoh king of Egypt[c][b], and appointed him ruler over Egypt and over all his household.
translation:
  language: tl
  text: at iniligtas siya sa lahat ng kanyang paghihirap,[a] at binigyan siya ng pabor[b] at karunungan sa harap ng Faraon, na hari ng Egipto. Itinalaga siya nitong tagapamahala ng Egipto at ng buong sambahayan ng Faraon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lahat ng kanyang mga kagipitan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “pabor” dito ay mabuting pagtingin at pagtanggap sa harap ng Faraon; maaari ring isaling “biyaya.”
    reason: lexical_alternative
  - marker: c
    text: O “ginawa siyang pinuno ng Egipto at ng buong sambahayan ng Faraon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξείλατο
  choice: iniligtas
  rationale: Ipinahihiwatig ng anyong panggitna ng ἐξαιρέω ang aktibong pagliligtas mula sa panganib o matinding kalagayan. Likas at malinaw sa makabagong Tagalog ang “iniligtas.”
- source_word: θλίψεων
  choice: mga paghihirap
  rationale: Saklaw ng θλῖψις dito ang mga pagdurusa, kagipitan, at mabibigat na karanasan ni Jose. Ang “mga paghihirap” ay karaniwan at hindi nagdaragdag ng natatanging eskatolohikal na diwa.
- source_word: χάριν
  choice: lingap
  rationale: Tumutukoy rito ang χάρις sa mabuting pagtingin at pagtanggap kay Jose sa harap ng Faraon. Pinananatili ng “lingap” ang positibong pabor nang hindi agad ipinapasok ang mas teknikal na teolohikal na gamit ng “biyaya.”
- source_word: σοφίαν
  choice: karunungan
  rationale: Tuwirang katumbas ito ng σοφία at kabilang dito ang praktikal na pagkaunawang kinilala ng Faraon.
- source_word: ἐναντίον
  choice: sa harap ng
  rationale: Ipinapahayag ng ἐναντίον ang kalagayan sa presensya o paningin ng isang tao. Likas sa Tagalog ang “sa harap ng Faraon.”
- source_word: κατέστησεν
  choice: itinalaga
  rationale: Ang καθίστημι rito ay paglalagay sa isang tungkulin o posisyon ng awtoridad; malinaw itong ipinahahayag ng “itinalaga.”
- source_word: ἡγούμενον
  choice: tagapamahala
  rationale: Tumutukoy ang ἡγούμενον sa isang namumuno o may kapangyarihang mamahala. Ang “tagapamahala” ay natural at hindi labis na tumutukoy sa isang modernong burukratikong posisyon.
- source_word: ἐπ’ Αἴγυπτον
  choice: sa Egipto
  rationale: Kasunod ng “itinalaga bilang tagapamahala,” likas na ipinahahayag ng “sa Egipto” ang saklaw ng kanyang kapamahalaan.
- source_word: ὅλον τὸν οἶκον αὐτοῦ
  choice: sa buong sambahayan nito
  rationale: Ang οἶκος ay tumutukoy sa sambahayan o sambahayang ari-arian at pamamahala ng Faraon, hindi lamang sa gusali. Ginamit ang “nito” upang malinaw na tumukoy sa Faraon at maiwasan ang pag-aakalang sambahayan ni Jose.
theological_decisions:
- issue: Hindi tahasang binanggit na simuno ng mga pandiwa
  choice: Hindi idinagdag ang pangalang “Diyos”; ipinagpatuloy ang magkakaugnay na pandiwa mula sa naunang konteksto.
  alternative: Tahasan itong isalin bilang “Iniligtas siya ng Diyos…”
  rationale: Sa Griyego, ipinagpapatuloy ng mga pandiwang pang-isahan ang konteksto ng 7:9, kung saan ang Diyos ang kasama ni Jose, ngunit hindi inuulit sa talatang ito ang pangngalang θεός. Pinananatili ng salin ang estilong ito at hindi ginagawang tahasan ang ipinahiwatig lamang.
- issue: Kahulugan ng χάρις sa kaugnayan kay Faraon
  choice: “lingap,” bilang mabuting pagtingin at pagtanggap sa harap ng Faraon
  alternative: “biyaya,” na maaaring marinig bilang teknikal na katawagang teolohikal
  rationale: Ang agarang konteksto ay tungkol sa pagkilala at pagtanggap ng Faraon kay Jose. Hindi itinatanggi ng pagpiling ito na Diyos ang nagbibigay, ngunit hindi rin nito ipinapasok ang mas malawak na doktrinal na diwa na hindi hinihingi ng parirala.
translation_notes:
  register: Makabagong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang “Faraon” at “Egipto” bilang pamilyar na anyong biblikal. Hinati sa dalawang pangungusap upang maging malinaw ang mahabang serye ng mga sugnay nang hindi binabago ang ugnayan ng mga kilos.
