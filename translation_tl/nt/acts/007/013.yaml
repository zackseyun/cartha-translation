  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ δευτέρῳ ⸀ἀνεγνωρίσθη Ἰωσὴφ τοῖς ἀδελφοῖς αὐτοῦ, καὶ φανερὸν ἐγένετο τῷ Φαραὼ τὸ ⸀γένος Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/013.yaml
  text: And on the second visit Joseph was recognized by his brothers[b][a], and Joseph’s family became known to Pharaoh.
translation:
  language: tl
  text: At sa ikalawang pagpunta, nakilala si Jose ng kanyang mga kapatid,[a] at nalaman ng Faraon ang tungkol sa angkan ni Jose.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagpakilala si Jose sa kanyang mga kapatid.” Pasibo ang pandiwang Griyego, ngunit sa konteksto ay maaaring tumukoy ito sa paghahayag ni Jose ng kanyang pagkakakilanlan sa kanila.
    reason: lexical_alternative
  - marker: b
    text: O “pamilya” o “mga kamag-anak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ δευτέρῳ
  choice: sa ikalawang pagpunta
  rationale: Ang parirala ay tumutukoy sa ikalawang pagkakataon ng pagpunta ng mga kapatid ni Jose sa Ehipto; natural sa Tagalog ang tahasang pagbanggit sa pagpunta.
- source_word: ἀνεγνωρίσθη
  choice: nakilala si Jose ng kanyang mga kapatid
  rationale: Pinananatili nito ang pasibong anyo ng Griyego at ang tunay na posibilidad na ang diin ay nasa pagkakilala nila sa kanya, habang ipinapaliwanag sa talababa ang kontekstuwal na diwang nagpakilala siya.
- source_word: ἀδελφοῖς
  choice: mga kapatid
  rationale: Sa konteksto, ang tinutukoy ay ang mga lalaking kapatid ni Jose; karaniwan at malinaw sa Tagalog ang 'mga kapatid.'
- source_word: φανερὸν ἐγένετο
  choice: nalaman
  rationale: Natural nitong ipinahahayag sa Tagalog na ang dating hindi alam ay naging hayag o kilala sa Faraon.
- source_word: γένος
  choice: angkan
  rationale: Mas tiyak kaysa 'pamilya' ang 'angkan' para sa pangkat ng mga kamag-anak o pinagmulan ni Jose, at iniiwasan nito ang makabagong maling diwa ng 'lahi.'
- source_word: τῷ Φαραώ
  choice: ng Faraon
  rationale: Sa aktibong natural na balangkas na 'nalaman ng Faraon,' malinaw na naipapakita ang Faraon bilang taong nakaalam.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili sa pangunahing teksto ang pasibong pahiwatig ng ἀνεγνωρίσθη at gumamit ng talababa para sa kontekstuwal na alternatibo. Ang 'Faraon' ay ginamit bilang titulo nang walang pantukoy, ayon sa karaniwang biblikal na gamit sa Filipino.
