  yaml_path: translation/nt/acts/007/044.yaml
  text: The tent of testimony was with our fathers in the wilderness[a], just as the one speaking to Moses directed him to make it according to the pattern that he had seen[c][b],
translation:
  language: tl
  text: Ang tolda ng patotoo ay kasama ng ating mga ninuno sa ilang,[a] gaya ng iniutos ng nagsasalita kay Moises na gawin niya ito ayon sa huwarang nakita niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tabernakulo ng patotoo.”
    reason: lexical_alternative
  - marker: b
    text: Ang Griyego ay literal na “ang nagsasalita kay Moises”; hindi nito tahasang pinangalanan ang nagsasalita.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἡ σκηνὴ τοῦ μαρτυρίου
  choice: ang tolda ng patotoo
  rationale: Ang “tolda” ay natural at malinaw na katumbas ng σκηνή bilang naililipat na tirahan o santuwaryo. Pinananatili ng “ng patotoo” ang genitibong parirala at ang kaugnayan nito sa banal na patotoo.
- source_word: τοῖς πατράσιν ἡμῶν
  choice: sa ating mga ninuno
  rationale: Sa konteksto, tumutukoy ito sa mga ninunong Israelita. Mas natural sa modernong Tagalog ang “mga ninuno” kaysa literal na “mga ama,” nang hindi binabago ang tinutukoy.
- source_word: ἐν τῇ ἐρήμῳ
  choice: sa ilang
  rationale: Ang “ilang” ay maikli, dignified, at nakaugat sa gamit-biblikal para sa wilderness, hindi lamang isang tuyong disyerto.
- source_word: καθὼς διετάξατο
  choice: gaya ng iniutos
  rationale: Ipinahahayag ng “iniutos” ang awtoritatibong tagubilin ng διετάξατο, habang likas sa Tagalog ang “gaya ng” para sa καθὼς.
- source_word: ὁ λαλῶν τῷ Μωϋσῇ
  choice: ang nakikipag-usap kay Moises
  rationale: Pinananatili ang substantibong kasalukuyang participle at hindi tahasang pinapangalanan ang nagsasalita, gaya ng Griyego.
- source_word: ποιῆσαι αὐτὴν
  choice: na gawin niya iyon
  rationale: Natural na ipinahahayag sa Tagalog ang ipinag-uutos na paggawa ng tolda; ang “niya” ay tumutukoy kay Moises at ang “iyon” sa tolda.
- source_word: κατὰ τὸν τύπον
  choice: ayon sa huwaran
  rationale: Ang “huwaran” ay angkop sa τύπος bilang modelong ipinakita at susundin sa paggawa.
- source_word: ὃν ἑωράκει
  choice: nakita niya
  rationale: Malinaw sa pagkakasunod ng salaysay na nakita na ni Moises ang huwaran bago niya ginawa ang tolda; hindi kailangang piliting ipahayag ang pluperfect sa Tagalog.
theological_decisions:
- issue: Pagkakakilanlan ng ὁ λαλῶν τῷ Μωϋσῇ
  choice: Iniwan itong di-tahasang pinangalanan bilang “ang nakikipag-usap kay Moises.”
  alternative: “ang Diyos na nakipag-usap kay Moises” o “ang Panginoong nakipag-usap kay Moises”
  rationale: Bagaman maliwanag sa mas malawak na konteksto kung sino ang nagsasalita, hindi siya tahasang pinangalanan sa Griyegong pangungusap. Iniiwasan ng salin na gawing mas eksplisito ang teksto kaysa sa orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “tolda” sa pangunahing teksto dahil mas madaling maunawaan kaysa “tabernakulo,” ngunit inilagay ang tradisyonal na katawagan sa talababa. Pinili ang “mga ninuno” bilang natural na kontekstuwal na salin ng “ating mga ama.”
