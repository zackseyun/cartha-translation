translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kapwa nito” upang maiwasan ang posibleng modernong kahulugang heograpiko ng “kapitbahay,” at ang “pinuno at hukom namin” bilang likas na Tagalog para sa paghamon sa awtoridad.
