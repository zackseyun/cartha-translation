  source_fidelity: 'Ang draft ay wastong naghahatid sa pangunahing daloy: ang lalaking gumagawa ng di-makatarungan ay itinulak palayo si Moises at kinuwestiyon ang awtoridad nito bilang pinuno at hukom. Gayunman, ang “kapwa nito” ay hindi likas at maaaring magtunog na ang ‘kapwa’ ay pag-aari ng isang bagay; mas malinaw ang “kanyang kapwa.” Ang “palayo” ay idinagdag upang malinaw na maipakita ang puwersa/dismissive na aspekto ng ἀπώσατο.'
  naturalness: Mas natural sa modernong Filipino ang “lalaking gumagawa ng masama sa kanyang kapwa” kaysa “lalaking gumagawa ng masama sa kapwa nito.” Ang pananatili ng “siya” para kay Moises ay angkop sa agos ng salaysay at hindi kailangang palitan ng pangalan.
