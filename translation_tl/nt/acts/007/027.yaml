base_translation:
  language: en
  yaml_path: translation/nt/acts/007/027.yaml
  text: But the man who was wronging his neighbor pushed him away[a], saying, ‘Who appointed you ruler and judge over us?’
translation:
  language: tl
  text: Ngunit itinulak palayo siya ng lalaking gumagawa ng masama sa kanyang kapwa[a] at sinabi, “Sino ang nagtalaga sa iyo bilang pinuno at hukom namin?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itinaboy siya.” Maaaring idiin ng pandiwang Griyego ang marahas na pisikal na pagtulak o ang tahasang pagtataboy.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶν
  choice: gumagawa ng masama
  rationale: Ipinapahayag ng pariralang ito ang patuloy na di-makatarungang pagkilos na ipinahihiwatig ng kasalukuyang participle, nang hindi nililimitahan ang uri ng pananakit.
- source_word: πλησίον
  choice: kapwa nito
  rationale: Likas sa makabagong Tagalog at malinaw na tumutukoy sa taong ginagawan niya ng masama; pinananatili nito ang diwa ng isang kapwa o taong malapit sa konteksto.
- source_word: ἀπώσατο
  choice: itinulak siya
  rationale: Pinananatili ang kongkreto at posibleng marahas na pisikal na pagtanggi ng pandiwa, habang natural sa salaysay.
- source_word: κατέστησεν
  choice: nagtalaga
  rationale: Natural na katumbas sa konteksto ng pagbibigay ng opisyal na kapangyarihan o tungkulin.
- source_word: ἄρχοντα
  choice: pinuno
  rationale: Direktang ipinahahayag ang posisyon ng pamumuno at awtoridad.
- source_word: δικαστὴν
  choice: hukom
  rationale: Karaniwang katumbas na nagpapanatili sa hudisyal na tungkuling kaagapay ng pagiging pinuno.
- source_word: ἐφ’ ἡμῶν
  choice: namin
  rationale: Sa pariralang “pinuno at hukom namin,” likas na naipapahayag sa Tagalog ang awtoridad na hinahamon, nang hindi nangangailangan ng mas mabigat na “sa ibabaw namin.”
