  text: ᾧ οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι οἱ πατέρες ἡμῶν, ἀλλὰ ἀπώσαντο καὶ ἐστράφησαν ⸂ἐν ταῖς καρδίαις⸃ αὐτῶν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/039.yaml
  text: Our fathers were unwilling to become obedient to him[a], but rejected him and turned back in their hearts to Egypt[b],
translation:
  language: tl
  text: Tumanggi ang ating mga ninuno na sumunod sa kanya. Sa halip, itinakwil nila siya[a] at sa kanilang mga puso ay bumaling silang pabalik sa Ehipto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itinulak nila siya palayo” o “itinaboy nila siya.” Maaaring ipahiwatig ng pandiwang Griyego ang pagtataboy kay Moises.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, kahit nasa ilang pa sila, sa kanilang kalooban ay nanabik silang bumalik sa Ehipto.
    reason: cultural_note
lexical_decisions:
- source_word: ᾧ
  choice: sa kanya
  rationale: 'Ang panghalip na datibo ay tumutukoy kay Moises at likas na ipinapahayag sa Tagalog bilang layon ng “sumunod”: “sumunod sa kanya.”'
- source_word: οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι
  choice: Ayaw sumunod
  rationale: Ipinahahayag nito ang kusang pagtanggi nilang maging masunurin. Mas natural sa makabagong Tagalog ang “ayaw sumunod” kaysa sa literal ngunit mabigat na “ayaw maging masunurin,” habang napapanatili ang diin sa kanilang kalooban.
- source_word: οἱ πατέρες ἡμῶν
  choice: ating mga ninuno
  rationale: Tumutukoy ito sa mga naunang salinlahi ng Israel. Ang “mga ninuno” ang malinaw at karaniwang tawag sa modernong Tagalog; ang literal na “ating mga ama” ay maaaring mapagkamalang tumutukoy lamang sa mga agarang ama.
- source_word: ἀπώσαντο
  choice: itinakwil nila siya
  rationale: Saklaw ng pandiwa ang pagtataboy o mariing pagtanggi kay Moises. Malinaw na naihahatid ng “itinakwil” ang relational na pagtanggi, habang inilalagay sa talababa ang mas pisikal na larawan ng salita.
- source_word: ἐστράφησαν
  choice: bumaling silang pabalik
  rationale: Ipinahihiwatig ng konteksto ang pagbabalik ng kanilang hangarin sa dati nilang kinalalagyan. Pinananatili ng “bumaling silang pabalik” ang kilos ng pagtalikod sa kasalukuyang landas at pagtuon muli sa Ehipto.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: sa kanilang puso
  rationale: Pinananatili ang biblikal na idyoma ng puso bilang sentro ng hangarin at pasiya, at nililinaw na panloob ang kanilang pagbaling.
- source_word: εἰς Αἴγυπτον
  choice: sa Ehipto
  rationale: Ipinapakita ng εἰς ang direksiyon ng kanilang pagbaling. Naipahihiwatig na ng “pabalik” ang ideya ng pagbabalik kaya sapat at natural ang “sa Ehipto.”
theological_decisions:
- issue: Ang uri ng pagbaling ng Israel sa Ehipto
  choice: “sa kanilang puso ay bumaling silang pabalik sa Ehipto”
  alternative: “sa puso nila ay ninais nilang bumalik sa Ehipto”
  rationale: Tahasan sa Griyego ang panloob na pagbaling ngunit hindi nito basta pinapalitan ang kilos ng isang paliwanag tungkol sa pagnanais. Pinananatili ng napiling salin ang metaporikal at teolohikal na tensiyon sa pagitan ng kanilang pisikal na kinaroroonan sa ilang at ng panloob nilang pagbabalik-loob sa Ehipto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga ninuno” sa halip na literal na “mga ama” upang malinaw na tumukoy sa mga naunang salinlahi ng Israel. Hinati sa dalawang pangungusap para sa likas na daloy nang hindi binabago ang lohikal na pagsalungat ng Griyego.
