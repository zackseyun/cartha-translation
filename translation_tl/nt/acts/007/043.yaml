language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀνελάβετε τὴν σκηνὴν τοῦ Μολὸχ καὶ τὸ ἄστρον τοῦ ⸀θεοῦ ⸀Ῥαιφάν, τοὺς τύπους οὓς ἐποιήσατε προσκυνεῖν αὐτοῖς. καὶ μετοικιῶ ὑμᾶς ἐπέκεινα Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/043.yaml
  text: And you took up the tent of Moloch and the star of the god Rephan[a], the images that you made to worship them[c][b], and I will deport you beyond Babylon.
translation:
  language: tl
  text: At dinala ninyo ang tolda ni Moloc at ang bituin ng diyos na si Refan[a]—ang mga larawang[b] ginawa ninyo upang sambahin ang mga iyon. At ipatatapon ko kayo sa kabila pa ng Babilonia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreong teksto ng Amos 5:26 ay “inyong diyos na si Refan” ang diwa ng parirala, kaya gayon ang salin ng ilan. Dito sa Mga Gawa ay “ang diyos na si Refan” ang nakasulat.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin na “mga anyo” o “mga representasyon.”
    reason: lexical_alternative
  - marker: c
    text: “Sa kabila pa ng Babilonia” ang nakasulat dito sa Mga Gawa. Sa Amos 5:27, karaniwang isinasalin ang pinagmulang sipi na “sa kabila pa ng Damasco.”
    reason: cross_reference
lexical_decisions:
- source_word: ἀνελάβετε
  choice: dinala ninyo
  rationale: Ipinahahayag ng pandiwang ito ang pagbuhat o pagdadala ng mga bagay na ginagamit sa pagsamba. Natural sa makabagong Tagalog ang “dinala ninyo” at hindi nito labis na nililinaw kung paano dinala ang mga iyon.
- source_word: σκηνὴν
  choice: tolda
  rationale: Literal na tumutukoy ang σκηνή sa isang tolda. Iniiwasan ng “tolda” ang maaaring maling pag-uugnay sa lehitimong tabernakulo ng Diyos, samantalang ang “dambana” ay mas mapagpakahulugan.
- source_word: Μολὸχ
  choice: Moloc
  rationale: Isang kinikilalang anyong Filipino ng pangalang pantangi; malapit ito sa tunog ng Griyegong Μολόχ.
- source_word: ἄστρον
  choice: bituin
  rationale: Ito ang tuwiran at karaniwang kahulugan ng ἄστρον. Hindi idinagdag sa pangunahing teksto ang interpretasyong “sagisag ng bituin.”
- source_word: τοῦ θεοῦ Ῥαιφάν
  choice: ng diyos na si Refan
  rationale: Tapat ito sa mismong pagbasa ng Griyegong teksto ng Mga Gawa, “ang diyos na si Refan,” sa halip na iayon sa Hebreong Amos 5:26 na may “inyong diyos.”
- source_word: Ῥαιφάν
  choice: Refan
  rationale: Malinaw na transliterasyon sa Filipino ng pangalang Griyego.
- source_word: τύπους
  choice: mga larawan
  rationale: Sa konteksto ng idolatriya, tumutukoy ang τύπους sa mga anyo o representasyong ginawa para sa pagsamba. Karaniwan at malinaw sa Tagalog ang “mga larawan,” habang inilalagay sa talababa ang ibang posibleng salin.
- source_word: ἐποιήσατε
  choice: ginawa ninyo
  rationale: Tuwirang isinasalin ang aorist at pinananatili ang paratang na sila mismo ang gumawa ng mga bagay na iyon.
- source_word: προσκυνεῖν αὐτοῖς
  choice: upang sambahin ang mga iyon
  rationale: Sa kontekstong panrelihiyon, natural na katumbas ng προσκυνεῖν ang “sambahin.” Ginawang malinaw ng “mga iyon” na ang tinutukoy ay ang naunang mga bagay o larawan.
- source_word: μετοικιῶ
  choice: ipatatapon ko kayo
  rationale: Ipinahahayag nito ang sapilitang paglilipat sa pagkakatapon. Maikli, natural, at may wastong bigat ang “ipatatapon.”
- source_word: ἐπέκεινα Βαβυλῶνος
  choice: sa kabila pa ng Babilonia
  rationale: Pinananatili ang kahulugang “beyond” at ang pangalang nasa Griyegong teksto ng Mga Gawa. Ang “pa” ay natural na naghahatid ng diwang lampas sa lugar na binanggit.
theological_decisions:
- issue: Naiiba ang patutunguhan ng pagkakatapon sa sipi ni Esteban kumpara sa karaniwang pagbasa sa Amos 5:27.
  choice: sa kabila pa ng Babilonia
  alternative: sa kabila pa ng Damasco
  rationale: Tahasan ang “Babilonia” sa Griyegong teksto ng Mga Gawa 7:43. Hindi ito iniayon sa Amos; sa halip, pinanatili ang pagkakaiba at ipinaliwanag sa talababa.
- issue: Naiiba ang pariralang tumutukoy kay Refan sa Hebreong pinagmulan ng Amos 5:26.
  choice: ng diyos na si Refan
  alternative: ng inyong diyos na si Refan
  rationale: Ang Griyegong teksto ng Mga Gawa ang pangunahing batayan at may tiyak na pantukoy, hindi panghalip na “inyong.” Pinananatili sa talababa ang mahalagang pagkakaiba sa pinagmulan.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinili ang karaniwang “tolda,” “bituin,” “mga larawan,” at “ipatatapon” upang maging malinaw sa ordinaryong mambabasa. Pinanatili ang tuwirang ayos at bigat ng paratang, gayundin ang mga pagkakaiba ng Mga Gawa sa teksto ng Amos, nang hindi pinagtutugma o nilulutas ang mga iyon.
