  text: until another king arose over Egypt[b][a], who did not know Joseph.
translation:
  language: tl
  text: hanggang sa bumangon ang ibang hari bilang pinuno ng Ehipto[a], na hindi nakakilala kay Jose.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagkaroon ng kapangyarihan sa Ehipto.” Literal na “bumangon” ang pandiwang Griyego.
    reason: lexical_alternative
  - marker: b
    text: Ang “hindi nakakilala kay Jose” ay maaari ring magpahiwatig na hindi kinilala o hindi pinahalagahan ng hari si Jose.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι οὗ
  choice: hanggang sa
  rationale: Likas at tuwirang ipinapahayag nito ang hangganan ng panahong tinutukoy.
- source_word: ἀνέστη
  choice: bumangon
  rationale: Pinananatili nito ang larawan ng literal na pandiwang Griyego, habang ipinahihiwatig ng konteksto ang paglitaw o pag-upo ng isang bagong hari sa kapangyarihan.
- source_word: βασιλεὺς ἕτερος
  choice: ibang hari
  rationale: Tuwirang katumbas ito ng parirala at malinaw na ibinubukod ang haring ito sa naunang pinuno.
- source_word: ἐπ’ Αἴγυπτον
  choice: upang mamahala sa Egipto
  rationale: Sa pagkakaugnay nito sa hari, ipinapahayag ng parirala ang paghahari o pamamahala sa Egipto; nililinaw ng saling ito ang idiomatikong diwa.
- source_word: οὐκ ᾔδει
  choice: hindi nakakilala
  rationale: Pinananatili nito ang pangunahing diwa ng 'hindi nakaaalam/nakakikilala' nang hindi tiyak na nilulutas kung kawalan ito ng personal na pagkakilala o sadyang hindi pagkilala sa halaga at katayuan ni Jose.
- source_word: τὸν Ἰωσήφ
  choice: kay Jose
  rationale: Ginamit ang karaniwang makabagong anyo ng pangalan sa Filipino at ang angkop na panandang pantao.
theological_decisions:
- issue: Saklaw ng “hindi nakakilala” kay Jose
  choice: Pinanatili ang “hindi nakakilala” sa pangunahing teksto.
  alternative: “Hindi kumilala” o “hindi nagpahalaga” kay Jose.
  rationale: Maaaring tumukoy ang pahayag sa kawalan ng kaalaman tungkol kay Jose o sa hindi pagkilala sa kanya at sa kanyang nagawa. Hindi dapat piliin nang tahasan ang isa lamang sa mga implikasyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang biblikal na larawang “bumangon,” ngunit nilinaw ang pamamahala sa Egipto. Ginamit ang pag-uulit na “isang haring” upang maging malinaw ang ugnayan ng sugnay at maiwasang mapagkamalang ang Egipto ang tinutukoy ng kasunod na parirala.
