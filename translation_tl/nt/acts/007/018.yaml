  source_fidelity: Kailangang baguhin ang “upang mamahala,” sapagkat nagdaragdag ito ng layunin (“in order to rule”) na wala sa ἐπ’ Αἴγυπτον. Ipinahahayag ng Griyego na ang hari ay bumangon bilang pinuno sa/over Egypt. Ang “hindi nakakilala kay Jose” ay sapat na pinananatili ang pangunahing kahulugan at ang posibleng mas malawak na pahiwatig.
  naturalness: Mas natural at tuwiran ang “bilang pinuno ng Ehipto” kaysa “upang mamahala sa Egipto,” at ang sugnay na “na hindi nakakilala kay Jose” ay malinaw na tumutukoy sa hari.
  terminology: Ang “hari,” “Ehipto,” at “Jose” ay karaniwan at angkop sa makabagong Filipino Tagalog. Pinananatili ng “bumangon” ang larawan ng ἀνέστη; nililinaw ng talababa ang mas idiomatikong alternatibo.
