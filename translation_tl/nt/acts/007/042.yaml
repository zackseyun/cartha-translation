id: ACT.7.42
reference: Acts 7:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔστρεψεν δὲ ὁ θεὸς καὶ παρέδωκεν αὐτοὺς λατρεύειν τῇ στρατιᾷ τοῦ οὐρανοῦ, καθὼς γέγραπται ἐν βίβλῳ τῶν προφητῶν· Μὴ σφάγια καὶ θυσίας προσηνέγκατέ μοι ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ, οἶκος Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/042.yaml
  text: 'But God turned away and gave them over to serve the host of heaven[a], just as it is written in the book of the prophets: ‘Did you offer to me slain offerings and sacrifices for forty years in the wilderness[d][c][b], O house of Israel?’'
translation:
  language: tl
  text: 'Ngunit tumalikod ang Diyos at ibinigay niya sila upang maglingkod sa hukbo ng langit[a], gaya ng nasusulat sa aklat ng mga propeta[b]: “Sambahayan ng Israel, naghandog ba kayo sa akin ng mga kinatay na handog at mga hain sa loob ng apatnapung taon sa ilang?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumamba sa hukbo ng langit.” Ang pandiwang Griego ay maaaring tumukoy sa panrelihiyong paglilingkod o pagsamba. Ang “hukbo ng langit” ay biblikal na katawagan sa mga katawang makalangit at, sa idolatriya, sa mga kapangyarihang iniuugnay sa mga ito.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: O “sa balumbon ng mga propeta.”
    reason: lexical_alternative
  - marker: c
    text: Sipi mula sa Amos 5:25.
    reason: cross_reference
lexical_decisions:
- source_word: ἔστρεψεν
  choice: tumalikod
  rationale: Sa pagkakaugnay nito sa sumunod na παρέδωκεν, ipinahihiwatig nito ang pagtalikod ng Diyos bilang paghatol, hindi lamang pisikal na pagbaling.
- source_word: παρέδωκεν αὐτούς
  choice: hinayaan niya sila
  rationale: Likas ito sa modernong Tagalog at ipinapahayag ang mapanghatol na pagpapabaya o pagsuko sa kanila sa pinili nilang pagsamba, nang hindi ipinahihiwatig na ang Diyos ang lumikha ng kanilang kasalanan.
- source_word: λατρεύειν
  choice: maglingkod
  rationale: Maaaring tumukoy ang pandiwa sa paglilingkod na panrelihiyon o pagsamba. Pinananatili ng “maglingkod” ang lawak ng kahulugan; nililinaw sa talababa ang alternatibo.
- source_word: τῇ στρατιᾷ τοῦ οὐρανοῦ
  choice: sa hukbo ng langit
  rationale: Pinananatili nito ang karaniwang biblikal na parirala at ang posibleng pagtukoy sa mga bagay o kapangyarihan sa kalangitan na sinamba bilang mga diyos.
- source_word: ἐν βίβλῳ τῶν προφητῶν
  choice: sa aklat ng mga propeta
  rationale: Malinaw at likas sa kasalukuyang Tagalog; maaaring mangahulugan ang βίβλος ng aklat o balumbon.
- source_word: Μὴ ... προσηνέγκατέ μοι
  choice: naghandog ba kayo sa akin ...?
  rationale: Isinasalin bilang retorikal na tanong na inaasahang sagutin nang hindi, habang pinananatiling natural ang ayos sa Tagalog.
- source_word: σφάγια καὶ θυσίας
  choice: mga hayop na pinatay bilang handog at ng iba pang mga hain
  rationale: Inilalantad nito ang natatanging diwa ng σφάγια bilang mga kinatay na handog at iniiwasan ang lubos na pag-uulit sa θυσίας.
- source_word: ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ
  choice: sa loob ng apatnapung taon sa ilang
  rationale: Natural na Tagalog para sa tagal at lugar; ang “ilang” ay ang kinagawiang biblikal na katawagan sa wilderness.
- source_word: οἶκος Ἰσραήλ
  choice: Mga sambahayan ng Israel
  rationale: Pinananatili ang kolektibong katawagang “house of Israel” sa isang dignificado at nauunawaang anyo.
theological_decisions:
- issue: Pagkilos ng Diyos sa paghatol
  choice: “Tumalikod” at “hinayaan niya silang” maglingkod
  alternative: “Ibinigay niya sila upang sumamba” o “pinahintulutan lamang niya sila”
  rationale: Pinananatili ang bigat ng mapanghatol na pagsuko sa kanila ayon sa pinili nilang idolatriya, ngunit hindi sinasabing ang Diyos ang tuwirang may-akda ng kanilang kasalanan.
- issue: Tinutukoy ng “hukbo ng langit”
  choice: Pinanatili bilang malawak na biblikal na parirala
  alternative: “mga bituin,” “mga anghel,” o “mga bagay sa kalangitan”
  rationale: Hindi lubusang tinutukoy ng parirala kung mga katawang makalangit o mga kapangyarihang iniuugnay sa mga ito ang nasa isip; pinananatili ng salin ang tunay na lawak na ito.
- issue: Retorikal na tanong mula sa Amos 5:25
  choice: Pinanatili bilang tanong na inaasahang sagutin nang hindi
  alternative: Gawing tahasang pahayag na hindi sila naghandog sa Diyos
  rationale: Pinananatili nito ang anyo at tensiyon ng sipi nang hindi tahasang nilulutas ang kaugnayan nito sa mga handog ng Israel sa ilang.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado ngunit madaling maunawaan. Ginamit ang “ilang,” “handog,” at “hain” bilang pamilyar na bokabularyong biblikal. Iniwasan ang sobrang arkaikong ayos, habang pinanatili ang retorikal na tanong at ang ambiguwidad ng mga pangunahing parirala.
