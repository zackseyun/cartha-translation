id: ACT.7.35
reference: Acts 7:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τοῦτον τὸν Μωϋσῆν, ὃν ἠρνήσαντο εἰπόντες· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστήν, τοῦτον ὁ θεὸς ⸀καὶ ἄρχοντα καὶ λυτρωτὴν ⸂ἀπέσταλκεν σὺν⸃ χειρὶ ἀγγέλου τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/035.yaml
  text: This Moses[a], whom they rejected, saying, ‘Who appointed you a ruler and a judge?’—this man God sent as both ruler and redeemer by the hand of the angel who appeared to him in the bush.
translation:
  language: tl
  text: Ang Moises na ito, na itinakwil nila nang sabihin nila, “Sino ang nagtalaga sa iyo bilang pinuno at hukom?”—siya ring isinugo ng Diyos bilang pinuno at manunubos[a], sa pamamagitan ng kamay ng anghel na nagpakita sa kanya sa palumpong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagapagpalaya.” Ang salitang Griyego ay tumutukoy sa isang nagdudulot ng paglaya o pagtubos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσαντο
  choice: itinakwil
  rationale: Ipinahihiwatig ng pandiwa rito ang tahasang pagtanggi kay Moises at sa kanyang awtoridad; mas malinaw ito kaysa sa simpleng “itinanggi.”
- source_word: κατέστησεν
  choice: nagtalaga
  rationale: Ang tanong ay tungkol sa pagkakaloob ng katungkulan at awtoridad, kaya likas at tumpak ang “nagtalaga.”
- source_word: ἄρχοντα
  choice: pinuno
  rationale: Tumutukoy ito sa taong gumagamit ng awtoridad. Ang “pinuno” ay malinaw sa makabagong Filipino at napapanatili sa dalawang paglitaw ang kabalintunaang ang itinakwil nilang pinuno ang siyang isinugo ng Diyos bilang pinuno.
- source_word: δικαστήν
  choice: hukom
  rationale: Tuwirang katumbas ito ng taong humahatol at natural sa konteksto.
- source_word: λυτρωτὴν
  choice: manunubos
  rationale: Pinananatili ng “manunubos” ang diwa ng pagpapalaya o pagtubos na taglay ng λυτρωτής, habang inilalahad sa talababa ang mas pangkaraniwang alternatibo.
- source_word: ἀπέσταλκεν
  choice: isinugo
  rationale: Ang “isinugo” ay natural sa salaysay at angkop sa pagpapadala ng Diyos sa isang kinatawan para sa natatanging gawain.
- source_word: σὺν χειρὶ
  choice: sa pamamagitan ng kamay ng
  rationale: Pinananatili nito ang Semitikong larawang nasa Griyego at ang papel ng anghel bilang kasangkapan o tagapamagitan, nang hindi lubusang pinapantay sa simpleng “sa tulong ng.”
- source_word: ἀγγέλου
  choice: anghel
  rationale: Sa salaysay tungkol sa palumpong, tumutukoy ito sa makalangit na nilalang na nagpakita kay Moises; “anghel” ang malinaw at karaniwang salin.
- source_word: τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ
  choice: na nagpakita sa kanya sa palumpong
  rationale: Bagaman pasibo ang anyo ng participle, idyomatikong nangangahulugan itong “nagpakita.” Hindi idinagdag ang “nagliliyab” sapagkat wala iyon sa mismong talatang ito.
- source_word: Τοῦτον ... τοῦτον
  choice: Ang Moises na ito ... siya ring
  rationale: 'Napapanatili nito ang madiing pag-uulit ng demonstratibo sa natural na Filipino: ang mismong itinakwil nila ang siyang isinugo ng Diyos.'
- source_word: καὶ ἄρχοντα καὶ λυτρωτὴν
  choice: bilang pinuno at manunubos
  rationale: Malinaw na inilalahad ang dalawang magkaugnay na tungkuling ibinigay ng Diyos kay Moises nang hindi nagdaragdag ng kahulugang wala sa Griyego.
theological_decisions:
- issue: Paglalarawan kay Moises bilang λυτρωτής sa kasaysayan ng pagliligtas
  choice: manunubos
  alternative: tagapagpalaya
  rationale: Pinananatili ng “manunubos” ang masinsing diwa ng paglaya at pagtubos sa salita, pati ang teolohikal na bigat ng papel ni Moises bilang isinugong kinatawan ng Diyos. Hindi nito ipinapantay nang tahasan si Moises sa ibang manunubos o dinaragdagan ang tipolohiyang hindi tahasang sinasabi ng talata.
- issue: Papel ng anghel sa pariralang σὺν χειρὶ ἀγγέλου
  choice: sa pamamagitan ng kamay ng anghel
  alternative: sa tulong ng anghel
  rationale: Pinananatili ang matalinghagang “kamay” at ang posibleng diwa ng ahensiya o pagtulong, sa halip na paliitin ang ugnayan sa iisang interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang retorikal na diin sa “Moises na ito ... siya ring,” gayundin ang biblikal na larawang “sa pamamagitan ng kamay.” Ginamit ang “palumpong” nang hindi idinaragdag ang “nagliliyab,” na hindi tahasang nasa talatang ito.
