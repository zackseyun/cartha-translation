  source_fidelity: 'Tapat ang salin sa Griyego: naipapahayag ang magaan na pang-ugnay ng δέ, ang pormal na panawagan, ang utos na makinig, ang titulong “Diyos ng kaluwalhatian,” ang pagpapakita sa Abraham, at ang pagkakasunod na nasa Mesopotamia ito bago siya nanirahan sa Haran. Ang “nagpakita” ay likas na Tagalog para sa ὤφθη sa kontekstong ito at hindi labis na pagpapakahulugan.'
