id: ACT.7.2
reference: Acts 7:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη· Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατε· Ὁ θεὸς τῆς δόξης ὤφθη τῷ πατρὶ ἡμῶν Ἀβραὰμ ὄντι ἐν τῇ Μεσοποταμίᾳ πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/002.yaml
  text: 'And he said[a], “Brothers and fathers, listen: the God of glory appeared to our father Abraham when he was in Mesopotamia[b], before he lived in Haran.”'
translation:
  language: tl
  text: At sinabi niya, “Mga kapatid at mga ama, makinig kayo. Ang Diyos ng kaluwalhatian ay nagpakita sa ating amang si Abraham noong nasa Mesopotamia siya, bago siya nanirahan sa Haran.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bago siya tumira sa Haran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: At sinabi niya
  rationale: Ang δέ ay banayad na pang-ugnay sa pagpapatuloy ng salaysay; natural sa Tagalog ang “At sinabi niya” nang hindi ito binibigyan ng di-kailangang pagsalungat.
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: Mga kapatid at mga ama
  rationale: Pormal at tahasang panlalaki ang panawagan sa mga lalaking kaharap. Sa Tagalog, natural na nasasaklaw ng “mga kapatid at mga ama” ang puwersa ng ἄνδρες sa pormulang ito nang hindi inuulit ang “mga lalaki.”
- source_word: ἀκούσατε
  choice: makinig kayo
  rationale: Tuwirang pautos ito upang hingin ang pansin ng buong kausap; malinaw at likas sa makabagong Tagalog ang maramihang “kayo.”
- source_word: Ὁ θεὸς τῆς δόξης
  choice: Ang Diyos ng kaluwalhatian
  rationale: Pinananatili nito ang anyong henitibo ng Griyego at ang posibleng alingawngaw ng pananalita sa Kasulatan, sa halip na gawing “maluwalhating Diyos.”
- source_word: ὤφθη
  choice: nagpakita
  rationale: Sa konteksto ng pagpapakita ng Diyos, likas at tapat ang aktibong anyong Tagalog na “nagpakita”; hindi nito idinaragdag ang mas interpretatibong “ipinahayag ang sarili.”
- source_word: τῷ πατρὶ ἡμῶν Ἀβραὰμ
  choice: sa ating amang si Abraham
  rationale: Natural sa Tagalog ang ayos na ito at pinananatili ang sama-samang pagkilala kay Abraham bilang ama ng nagsasalita at ng kanyang mga tagapakinig.
- source_word: ὄντι ἐν τῇ Μεσοποταμίᾳ
  choice: noong nasa Mesopotamia siya
  rationale: Ipinahahayag nang malinaw at natural ang temporal na gamit ng partisipyong ὄντι.
- source_word: πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν
  choice: bago siya nanirahan sa Haran
  rationale: Maaaring mangahulugan ang κατοικέω na manirahan o tumira nang matatag sa isang lugar. Ang “nanirahan” ay natural at bahagyang pinananatili ang diwa ng paninirahan nang hindi labis na iginigiit ang pagiging permanente.
theological_decisions:
- issue: Panlalaking pormal na pagtawag sa mga tagapakinig
  choice: Mga kapatid at mga ama
  alternative: Mga lalaki, mga kapatid at mga ama
  rationale: Hindi ginagawang neutral ang tahasang panlalaking panawagan. Gayunman, sa Tagalog ay tunog mabigat at tila tatlong magkakahiwalay na pangkat ang literal na pagdaragdag ng “mga lalaki”; sapat na naihahatid ng pormal na “mga kapatid at mga ama” ang gamit ng buong pormula.
- issue: Pagkakasalin sa banal na titulong θεὸς τῆς δόξης
  choice: Ang Diyos ng kaluwalhatian
  alternative: Ang maluwalhating Diyos
  rationale: Pinananatili ng pinili ang estrukturang “Diyos ng kaluwalhatian” at ang posibleng ugnay nito sa wika ng Lumang Tipan, sa halip na payakin bilang pang-uri.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga ama” bilang pormal na magalang na tawag sa nakatatandang mga lalaking pinuno, hindi bilang literal na pagtukoy sa mga magulang. Ang hulihang alternatibo ay inilagay sa talababa dahil may saklaw ang κατοικέω mula sa simpleng pagtira hanggang sa paninirahan o pagtira nang matatag.
