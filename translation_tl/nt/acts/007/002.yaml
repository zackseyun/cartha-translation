  terminology: Wasto at pare-pareho ang “Diyos ng kaluwalhatian,” “ating amang si Abraham,” “Mesopotamia,” at “Haran.” Ang “mga ama” ay akma sa pormal na tawag sa mga nakatatandang lalaking pinuno. Ang talababa ay wastong nakaangkla at nagbibigay ng lehitimong alternatibo para sa κατοικῆσαι.
