    issue: Ang edad ay isinaling parang ganap na umabot na sa apatnapu.
    rationale: Ang “sumapit ... sa edad na apatnapu” at lalo na ang talababa na “nang siya ay apatnapung taong gulang na” ay naglilimita sa ἐπληροῦτο, na nasa imperpektibo at idiomatikong tumutukoy sa papalapit/pagkaganap ng panahong apatnapung taon. Dapat panatilihin ang bahagyang di-ganap na aspekto.
  - severity: low
    issue: Hindi tugma ang aspektong “malubos” sa mas literal na paliwanag sa talababa.
    rationale: Ang “nang malubos” ay perpektibo, samantalang ang Griyego ay “habang nalulubos” o “nang papalapit nang malubos,” kaya dapat itong ayusin kasabay ng pangunahing teksto.
