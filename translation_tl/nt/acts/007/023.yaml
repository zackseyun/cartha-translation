  text: Ὡς δὲ ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος, ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ ἐπισκέψασθαι τοὺς ἀδελφοὺς αὐτοῦ τοὺς υἱοὺς Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/023.yaml
  text: When he was approaching forty years of age[a], it came into his heart to visit his brothers[c][b], the sons of Israel.
translation:
  language: tl
  text: Nang mag-aapatnapung taong gulang na siya[a], umusbong sa puso niya[b] ang hangaring dalawin ang kanyang mga kapatid—ang mga anak ni Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal: “habang nalulubos para sa kanya ang panahong apatnapung taon”; ibig sabihin, nang papalapit na siyang mag-apatnapung taong gulang.'
    reason: lexical_alternative
  - marker: b
    text: O “pumasok sa puso niya”; isang idyoma para sa panloob na hangarin o pasiya.
    reason: lexical_alternative
  - marker: c
    text: Ang “mga kapatid” ay tumutukoy sa mga kapwa niya Israelita. Maaari ring isalin ang “mga anak ni Israel” bilang “mga Israelita.”
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Nang
  rationale: Likas na ipinakikilala ng “Nang” ang temporal na paglipat sa salaysay; hindi na kailangang dagdagan ng hiwalay na panandang diskurso.
- source_word: ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος
  choice: sumapit siya sa edad na apatnapu
  rationale: Ipinahahayag nito sa natural na Tagalog ang idyomatikong pagkalubos ng apatnapung taon nang hindi ipinapalagay na hindi pa siya ganap na apatnapu.
- source_word: ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: umusbong sa puso niya
  rationale: Pinananatili ang larawang tumutukoy sa pagkakaroon ng panloob na hangarin o pasiya, ngunit malinaw at likas pa rin sa makabagong Tagalog.
- source_word: ἐπισκέψασθαι
  choice: dalawin
  rationale: Ang “dalawin” ang pinakamaikli at natural na katumbas sa konteksto; maaari ring taglayin ng pandiwa ang diwang alamin o tingnan ang kalagayan nila.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: ang kanyang mga kapatid
  rationale: Pinananatili ang katawagang pampamilya sa Griyego; nililinaw ng kasunod na parirala na ang tinutukoy ay ang mga kapwa niya Israelita.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: ang mga anak ni Israel
  rationale: Tuwirang pinananatili ang tradisyonal at pampamilyang katawagan ng Griyego, sa halip na paikliin lamang bilang “mga Israelita.”
theological_decisions:
- issue: Pampamilyang katawagan at pagkakakilanlang etniko
  choice: ang kanyang mga kapatid—ang mga anak ni Israel
  alternative: ang mga kapwa niya Israelita
  rationale: Walang doktrinang pinapasyahan dito. Pinananatili ng salin ang dalawang magkaugnay na katawagan sa Griyego at nililinaw na ang “mga kapatid” ay tumutukoy sa kanyang sariling bayan.
- issue: Likas na hangarin o sinadyang pasiya
  choice: umusbong sa puso niya ang hangaring
  alternative: nagpasya siya
  rationale: Hindi tahasang nilulutas ng Griyegong idyoma kung gaano kapormal o biglaan ang pasiya. Pinananatili ng salin ang panloob na larawan at ang bahagyang kalabuan nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang idyoma ng puso at ang pampamilyang katawagang “mga anak ni Israel,” habang ipinaliwanag sa talababa ang kahulugan ng mga ito.
