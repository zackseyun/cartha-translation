  text: Μήτι τὸ ὕδωρ ⸂δύναται κωλῦσαί⸃ τις τοῦ μὴ βαπτισθῆναι τούτους οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον ⸀ὡς καὶ ἡμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/047.yaml
  text: Surely no one can withhold the water so that these people should not be baptized[b][a], can they? For they have received the Holy Spirit just as we have.
translation:
  language: tl
  text: “May sinuman bang makapagkakait ng tubig[a] sa mga taong ito upang hindi sila mabautismuhan? Tinanggap din nila ang Banal na Espiritu, gaya natin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “May sinuman bang makahahadlang upang hindi mabautismuhan sa tubig ang mga taong ito?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μήτι
  choice: May ... ba?
  rationale: Ginamit ang retorikal na tanong na natural sa Tagalog at malinaw na umaasang ‘wala’ ang sagot.
- source_word: τὸ ὕδωρ
  choice: sa paggamit ng tubig
  rationale: Tinutukoy ng tiyak na parirala ang tubig na gagamitin sa bautismo. Idinagdag ang ‘paggamit’ upang maging natural ang ugnayan ng ‘tubig’ at ‘pumigil’ sa Tagalog nang hindi binabago ang diwa.
- source_word: δύναται κωλῦσαί τις
  choice: May makapipigil ba
  rationale: Tumpak na ipinahahayag ang kakayahang humadlang o magbawal, habang pinananatili ang retorikal na anyo.
- source_word: τοῦ μὴ βαπτισθῆναι
  choice: upang hindi mabautismuhan
  rationale: 'Pinananatili ang diwa ng paghadlang sa isang kilos at ang pasibong anyo: ang mga taong ito ang tatanggap ng bautismo.'
- source_word: τούτους
  choice: ang mga taong ito
  rationale: Natural at inklusibong pagtukoy sa pangkat ng mga tao nang hindi ipinapalagay na pawang lalaki sila.
- source_word: οἵτινες
  choice: Tinanggap nila
  rationale: Isinalin bilang hiwalay na pangungusap upang maging malinaw at natural sa Tagalog ang batayan ng retorikal na tanong; nananatili ang nagpapakilalang at bahagyang sanhiing diwa ng sugnay.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: ang Banal na Espiritu
  rationale: Karaniwan, makabago, at marangal na salin ng titulo.
- source_word: ἔλαβον
  choice: Tinanggap
  rationale: Ang payak na aspektong naganap sa Tagalog ay nagpapahayag ng natapos na pagtanggap na mahalaga pa rin sa kasalukuyang argumento.
- source_word: ὡς καὶ ἡμεῖς
  choice: gaya rin natin
  rationale: Pinananatili ang tahasang paghahambing sa karanasan ng nagsasalita at ng kaniyang mga kasamahan.
theological_decisions:
- issue: Ugnayan ng pagtanggap sa Espiritu at bautismo sa tubig
  choice: Malinaw na nauna nang tinanggap ng mga taong ito ang Banal na Espiritu, at ito ang batayan ng pagtutol sa paghadlang sa kanilang bautismo sa tubig.
  alternative: Salin na hindi malinaw kung nauna ang pagtanggap sa Espiritu kaysa sa bautismo.
  rationale: Ito ang pagkakasunod-sunod at argumento ng salaysay sa Griyego. Hindi nilulutas ng salin ang mas malawak na usaping sakramental o denominasyonal.
translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang retorikal na tanong at iniwasan ang mabigat na literalismong “ipagbawal ang tubig” sa pangunahing teksto; inilagay iyon bilang leksikal na alternatibo sa talababa.
