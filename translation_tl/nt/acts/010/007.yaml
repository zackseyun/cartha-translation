- from: Nang makaalis na ang anghel na nakikipag-usap sa kanya, tinawag niya ang dalawa sa mga lingkod ng kanyang sambahayan[a] at isang debotong kawal na kabilang sa mga palaging naglilingkod sa kanya.
  to: Nang umalis na ang anghel na nagsasalita sa kanya, tinawag niya ang dalawa sa mga lingkod ng kanyang sambahayan[a] at isang debotong kawal na kabilang sa mga palaging nasa paglilingkod sa kanya.
  rationale: Ginawa ang maliliit na pagbabago upang masundan nang mas tumpak ang payak na pag-alis ng anghel at ang isang-direksiyong pagsasalita nito kay Cornelio. Pinanatili ang antas ng wika, ang ambiguity ng κοινωνikong katayuan ng οἰκέται sa pangunahing teksto, at ang mas tahasang alternatibong “alipin” sa talababa.
