  text: ὡς δὲ ἀπῆλθεν ὁ ἄγγελος ὁ λαλῶν ⸀αὐτῷ, φωνήσας δύο τῶν ⸀οἰκετῶν καὶ στρατιώτην εὐσεβῆ τῶν προσκαρτερούντων αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/007.yaml
  text: When the angel who was speaking to him had gone away[a], he called two of his household servants and a devout soldier from among those attending him.
translation:
  language: tl
  text: Nang umalis na ang anghel na nagsasalita sa kanya, tinawag niya ang dalawa sa mga lingkod ng kanyang sambahayan[a] at isang debotong kawal na kabilang sa mga palaging nasa paglilingkod sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dalawa sa mga alipin ng kanyang sambahayan.” Ang salitang Griyego na οἰκέται ay tumutukoy sa mga lingkod na kabilang sa sambahayan at maaari ring tahasang mangahulugang mga alipin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἀπῆλθεν
  choice: Nang makaalis na
  rationale: Likas na ipinahahayag sa Filipino ang kilos na natapos bago ang pagtawag, nang hindi labis na binibigyang-diin ang δέ.
- source_word: ὁ ἄγγελος
  choice: ang anghel
  rationale: Sa konteksto ng pangitain ni Cornelio, isang makalangit na sugo ang tinutukoy, kaya anghel ang angkop kaysa sa pangkalahatang sugo.
- source_word: ὁ λαλῶν αὐτῷ
  choice: na nakikipag-usap sa kanya
  rationale: Pinananatili nito ang pangkasalukuyang diwa ng participle at likas na kinikilala ang anghel bilang kausap ni Cornelio.
- source_word: φωνήσας
  choice: tinawag niya
  rationale: Malinaw at natural itong salin ng pagtawag o pagpapatawag; ang tinutukoy ng di-hayag na paksa ay si Cornelio.
- source_word: δύο τῶν οἰκετῶν
  choice: dalawa sa mga lingkod ng kanyang sambahayan
  rationale: Ipinakikita ng sambahayan na ang οἰκέται ay mga lingkod na nakaugnay sa bahay, habang inilalagay sa talababa ang mas tuwirang posibilidad na alipin.
- source_word: στρατιώτην εὐσεβῆ
  choice: isang debotong kawal
  rationale: Ang deboto ay nagpapahayag ng taimtim na pagkamaka-relihiyon nang hindi idinaragdag ang mas tiyak na katawagang may takot sa Diyos.
- source_word: τῶν προσκαρτερούντων αὐτῷ
  choice: na kabilang sa mga palaging naglilingkod sa kanya
  rationale: Ipinakikita ng kabilang sa ang partitive na anyo at ng palaging naglilingkod ang patuloy at matapat na pag-aasikaso sa kanya.
theological_decisions:
- issue: Kalikasan ng ἄγγελος sa konteksto
  choice: anghel
  alternative: sugo
  rationale: Inilalarawan ng agarang konteksto ang isang makalangit na nilalang sa pangitain ni Cornelio, kaya hinihingi ng konteksto ang anghel.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” upang mapanatili ang domestikong ugnayan ng οἰκέται, at ang mas tahasang “alipin” ay inilagay sa talababa upang hindi maitago ang posibleng katayuang panlipunan.
