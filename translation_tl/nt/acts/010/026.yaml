  text: ὁ δὲ Πέτρος ⸂ἤγειρεν αὐτὸν⸃ λέγων· Ἀνάστηθι· καὶ ἐγὼ αὐτὸς ἄνθρωπός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/026.yaml
  text: But Peter raised him up[a], saying, “Stand up[c][b]; I too am a man.”
translation:
  language: tl
  text: Ngunit itinayo siya ni Pedro[a] at sinabi, “Tumayo ka[b]. Tao rin ako.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ibinangon siya,” “inalalayan siyang tumayo,” o “tinulungan siyang bumangon.”
    reason: lexical_alternative
  - marker: b
    text: O “Bumangon ka.”
    reason: lexical_alternative
  - marker: c
    text: O “Ako mismo ay tao rin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν αὐτὸν
  choice: itinayo siya
  rationale: Karaniwang ipinahihiwatig ng ἐγείρω ang pagpapabangon o pagtayo sa isang tao. Sa konteksto, ibinangon ni Pedro si Cornelio mula sa pagkakayukod nito; tuwiran ang “itinayo siya” nang hindi tinutukoy kung paano niya ginawa iyon.
- source_word: Ἀνάστηθι
  choice: Tumayo ka
  rationale: Ang pautos na anyo ng ἀνίστημι ay nag-uutos na bumangon at tumayo. Natural at malinaw sa modernong Tagalog ang “Tumayo ka” sa agarang pisikal na konteksto.
- source_word: καὶ ἐγὼ αὐτὸς
  choice: rin ako
  rationale: 'Nagbibigay ang καὶ at αὐτός ng mariing pagsasama: si Pedro mismo ay kapwa tao rin. Likas na naihahatid ng “rin ako” ang diwa, habang maaaring gawing lantad sa talababa ang diin ng αὐτός.'
- source_word: ἄνθρωπός εἰμι
  choice: Tao ... ako
  rationale: Tuwirang tumutukoy ang ἄνθρωπος sa pagiging tao ni Pedro. Hindi idinagdag ang “lamang,” sapagkat wala itong tahasang katumbas sa Griyego.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapakita ang δέ ng banayad na pagsalungat sa ginawang pagpapatirapa ni Cornelio sa naunang talata. Malinaw itong naihahatid ng “Ngunit.”
theological_decisions:
- issue: Ang tugon ni Pedro sa pagpapatirapa ni Cornelio
  choice: Ipinakikitang pinatayo ni Pedro si Cornelio at iniugnay ang pagtutuwid sa kanilang magkaparehong pagiging tao.
  alternative: Maaaring unawain ang sinabi bilang payak na pagpapakumbaba lamang, nang walang mas malawak na teolohikal na pahiwatig.
  rationale: Pinananatili ng “Tumayo ka. Tao rin ako” ang payak na diwa at tensiyon ng teksto, nang hindi nagdaragdag ng isang ganap na doktrina tungkol sa pagsamba o pagpaparangal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “itinayo” at “Tumayo ka” upang mapanatili ang pisikal na kilos ng konteksto; iniwasan ang “tao lamang” dahil magiging dagdag itong interpretasyon. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
