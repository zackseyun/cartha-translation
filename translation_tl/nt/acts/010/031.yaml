  naturalness: Likas, malinaw, at marangal ang makabagong Tagalog. Ang ayos na “Cornelio, dininig ang panalangin mo” ay angkop sa pagsasalaysay na may pormal na rehistro. Ang “sa harap ng Diyos” ay natural at malapit sa kahulugan ng Griyego.
