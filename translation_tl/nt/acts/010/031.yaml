id: ACT.10.31
reference: Acts 10:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ φησί· Κορνήλιε, εἰσηκούσθη σου ἡ προσευχὴ καὶ αἱ ἐλεημοσύναι σου ἐμνήσθησαν ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/031.yaml
  text: And he said[a], ‘Cornelius, your prayer has been heard, and your alms have been remembered before God.’
translation:
  language: tl
  text: At sinabi niya, “Cornelio, dininig ang panalangin mo, at inalala sa harap ng Diyos ang mga tulong mo sa mga nangangailangan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga limos mo” o “mga pagkakawanggawa mo.” Ang salitang Griyego ay tumutukoy sa mahabaging pagbibigay o paggawa para sa mga nangangailangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησί
  choice: sinabi niya
  rationale: Ang makasaysayang pangkasalukuyan sa Griyego ay likas na isinasalin sa pangnagdaan sa makabagong salaysay na Tagalog.
- source_word: Κορνήλιε
  choice: Cornelio
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang Cornelius.
- source_word: εἰσηκούσθη
  choice: dininig
  rationale: Ipinapanatili ng pandiwang balintiyak ang di-tahasang gumagawa at ipinahihiwatig na tinanggap at pinakinggan ang panalangin.
- source_word: προσευχὴ
  choice: panalangin
  rationale: Karaniwan at tuwirang katumbas sa Tagalog; pinanatili ang isahan.
- source_word: ἐλεημοσύναι
  choice: mga tulong mo sa mga nangangailangan
  rationale: Malinaw nitong ipinahahayag ang mahabaging pagbibigay o mga gawa para sa nangangailangan nang hindi gumagamit ng hindi na gaanong karaniwang salitang “limos,” na maaari ring magpahiwatig ng pagbibigay lamang sa namamalimos.
- source_word: ἐμνήσθησαν
  choice: inalala
  rationale: Pinananatili ang biblikal na wika ng pag-alaala at ang anyong balintiyak, sa halip na gawing paliwanag na “napansin ng Diyos.”
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: sa harap ng Diyos
  rationale: Tuwirang katumbas na likas sa Tagalog at nagpapanatili sa diwa ng presensya at pagkilala ng Diyos.
theological_decisions:
- issue: Kahulugan ng mga mahabaging gawa ni Cornelio
  choice: mga tulong mo sa mga nangangailangan
  alternative: mga limos mo; mga pagkakawanggawa mo
  rationale: Ipinakikita ng teksto ang kongkretong mahabaging pagbibigay o paggawa, ngunit hindi nito tahasang itinuturo na ang mga iyon ay nagkamit ng kaligtasan o merito.
- issue: Wika ng banal na pag-alaala
  choice: inalala sa harap ng Diyos
  alternative: napansin ng Diyos; binigyang-pansin ng Diyos
  rationale: Pinananatili ang mabigat na biblikal na idyoma ng pag-alaala at hindi nilulutas ang ipinahihiwatig nitong ugnayan sa Diyos sa pamamagitan ng isang mas makitid na pagpapaliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Cornelio,” ang nakaugaliang anyong Tagalog ng pangalan, at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
