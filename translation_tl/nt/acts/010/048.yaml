id: ACT.10.48
reference: Acts 10:48
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: προσέταξεν ⸀δὲ αὐτοὺς ⸂ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ βαπτισθῆναι⸃. τότε ἠρώτησαν αὐτὸν ἐπιμεῖναι ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/048.yaml
  text: So he ordered them to be baptized in the name of Jesus the Messiah[a]. Then they asked him to remain for some days.
translation:
  language: tl
  text: Kaya iniutos niyang bautismuhan sila sa pangalan ni Jesus na Mesiyas[a]. Pagkatapos, hiniling nila sa kanya na manatili pa nang ilang araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa mas tradisyonal na katawagan, “Jesus Cristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: προσέταξεν
  choice: iniutos
  rationale: Nagsasaad ang pandiwa ng makapangyarihang tagubilin; natural at malinaw sa modernong Tagalog ang “iniutos.”
- source_word: δὲ
  choice: Kaya
  rationale: Dito ay nagpapatuloy ito sa salaysay at nagpapahiwatig ng bunga ng mga naunang pangyayari, hindi ng matinding pagsalungat.
- source_word: ἐν τῷ ὀνόματι
  choice: sa pangalan
  rationale: Pinananatili ng pamilyar na idyoma ang maaaring saklaw na awtoridad, pagkilala, at pagtawag sa pangalan nang hindi nililimitahan sa iisang paliwanag.
- source_word: Ἰησοῦ Χριστοῦ
  choice: ni Jesus na Mesiyas
  rationale: Ang Χριστός ay gumaganap bilang titulo; natural na ipinakikita ng “na Mesiyas” sa Tagalog na titulo ito ni Jesus, hindi apelyido.
- source_word: βαπτισθῆναι
  choice: bautismuhan sila
  rationale: Tuwirang ipinapahayag ang pasibong infinitibo sa natural na kayariang Tagalog at hindi ipinapasok ang mas makitid na interpretasyong “ilubog.”
- source_word: τότε
  choice: Pagkatapos
  rationale: Malinaw nitong ipinakikita ang sumunod na pangyayari sa salaysay.
- source_word: ἠρώτησαν
  choice: hiniling
  rationale: Sa konteksto, ang pandiwa ay isang magalang na pakiusap o kahilingan, hindi simpleng pagtatanong.
- source_word: ἐπιμεῖναι
  choice: manatili pa
  rationale: Ipinahihiwatig ng ἐπιμένω ang pagpapatuloy ng pananatili; natural sa Tagalog ang “manatili pa.”
- source_word: ἡμέρας τινάς
  choice: nang ilang araw
  rationale: Pinananatili nito ang di-tiyak na tagal nang hindi pinipiling “kaunti” o “marami.”
theological_decisions:
- issue: Pagbibigay-kahulugan sa Χριστοῦ sa pormula ng bautismo
  choice: Mesiyas
  alternative: Cristo
  rationale: Isinasalin ang kahulugan ng titulong Χριστός bilang “Mesiyas,” habang kinikilala sa talababa ang tradisyonal na transliterasyong “Cristo.” Hindi nilulutas nang higit sa Griyego ang teolohikal na saklaw ng pariralang “sa pangalan.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “bautismuhan” bilang karaniwang terminong biblikal at “manatili pa” upang likas na maipahayag ang pagpapatuloy.
