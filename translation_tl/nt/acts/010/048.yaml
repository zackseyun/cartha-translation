  source_fidelity: 'Tumpak na naihahatid ang pagkakasunod ng salaysay at ang pangunahing kahulugan ng Griyego: ang makapangyarihang utos na mabautismuhan sila, ang pormulang “sa pangalan ni Jesus na Mesiyas,” at ang sumunod na kahilingang manatili siya nang di-tiyak na bilang ng araw. Ang “Kaya” ay katanggap-tanggap na pagsasalin ng δέ sa kontekstong ito, at ang “Pagkatapos” ay likas na panandang sunod-sunod para sa τότε.'
  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang “iniutos niyang bautismuhan sila,” “hiniling nila sa kanya,” at “manatili pa nang ilang araw” ay maayos na daloy at angkop sa marangal na rehistro ng salaysay.
  terminology: Ang “bautismuhan” ay malawak na nauunawaan at hindi nagpapataw ng paraan ng bautismo. Ang “Mesiyas” ay wastong salin ng titulong Χριστός, at ang “Jesus na Mesiyas” ay nagpapakitang titulo ito. Ang talababa para sa tradisyonal na “Jesus Cristo” ay angkop at wasto ang pagkakaangkla.
