id: ACT.10.28
reference: Acts 10:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔφη τε πρὸς αὐτούς· Ὑμεῖς ἐπίστασθε ὡς ἀθέμιτόν ἐστιν ἀνδρὶ Ἰουδαίῳ κολλᾶσθαι ἢ προσέρχεσθαι ἀλλοφύλῳ· κἀμοὶ ὁ θεὸς ἔδειξεν μηδένα κοινὸν ἢ ἀκάθαρτον λέγειν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/028.yaml
  text: And he said to them[a], “You yourselves know how unlawful it is for a Jewish man to associate with or visit a foreigner[b]; but God has shown me to call no person common or unclean.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Alam na alam ninyo na bawal para sa isang lalaking Judio ang makisalamuha o dumalaw sa isang taong mula sa ibang bayan.[a] Ngunit ipinakita sa akin ng Diyos na hindi ko dapat tawaging karaniwan[b] o marumi ang sinumang tao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang Hentil.” Ang salitang Griyego ay literal na tumutukoy sa taong kabilang sa ibang bayan o pangkat.
    reason: lexical_alternative
  - marker: b
    text: Ang “karaniwan” ay salin ng κοινόν, isang katawagang naiiba sa “marumi” (ἀκάθαρτον). Pinananatili ng dalawang salita ang magkaibang kategoryang pangkadalisayan sa Judaismo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε πρὸς αὐτούς
  choice: At sinabi niya sa kanila
  rationale: Pinananatili ng “At” ang banayad na pag-uugnay ng τέ sa naunang salaysay nang hindi ipinapalagay ang mas tiyak na pagkakasunod-sunod.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: Alam na alam ninyo
  rationale: Ipinahahayag ng pag-uulit na “alam na alam” ang diin ng tahasang Ὑμεῖς sa natural na modernong Tagalog.
- source_word: ὡς ἀθέμιτόν ἐστιν
  choice: na bawal
  rationale: Saklaw ng ἀθέμιτος ang hindi pinahihintulutan o salungat sa kinikilalang tuntunin at kaugalian. Natural ang “bawal” at hindi nito labis na nililinaw kung batas o umiiral na kaugaliang panrelihiyon ang tinutukoy.
- source_word: ἀνδρὶ Ἰουδαίῳ
  choice: para sa isang lalaking Judio
  rationale: Pinananatili nito ang isahan at tahasang panlalaking anyo ng Griyego.
- source_word: κολλᾶσθαι
  choice: makisalamuha
  rationale: Sa kontekstong panlipunan, natural nitong ipinahahayag ang pakikisama o pakikipag-ugnayan na nasa diwa ng pandiwang literal na nangangahulugang kumapit o makisama.
- source_word: ἢ προσέρχεσθαι
  choice: o dumalaw
  rationale: Sa konteksto ng pagpunta ni Pedro sa bahay ng isang hindi Judio, “dumalaw” ang natural na pagpapahayag ng praktikal na diwa ng paglapit o pagpunta.
- source_word: ἀλλοφύλῳ
  choice: isang taong mula sa ibang bayan
  rationale: Ang ἀλλόφυλος ay literal na taong kabilang sa ibang bayan o pangkat. Iniiwasan nito ang mas interpretatibong “Hentil” habang malinaw na naihahatid ang kaibahan ng bayan.
- source_word: κἀμοὶ ὁ θεὸς ἔδειξεν
  choice: Ngunit ipinakita sa akin ng Diyos
  rationale: Bagaman literal na “at sa akin,” malinaw na pasalungat ang ugnayan sa konteksto; natural itong naihahatid ng “Ngunit.”
- source_word: μηδένα ... ἄνθρωπον
  choice: ang sinumang tao
  rationale: Pangkalahatan ang ἄνθρωπος dito at hindi tumutukoy lamang sa lalaki.
- source_word: κοινὸν
  choice: karaniwan
  rationale: Pinananatili nito ang pangunahing kahulugan at ang natatanging kategorya ng κοινός sa wikang may kinalaman sa ritwal na kadalisayan, sa halip na ihalintulad ito sa ἀκάθαρτος.
- source_word: ἢ ἀκάθαρτον
  choice: o marumi
  rationale: Ang “marumi” ay natural at karaniwang katumbas ng terminong tumutukoy sa kawalan ng ritwal na kalinisan; pinananatili rin nito ang pagkakaiba sa “karaniwan.”
- source_word: λέγειν
  choice: tawaging
  rationale: Natural na isinasalin ang pandiwa bilang pagtawag o pagturing sa isang tao sa ganitong paraan, nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Ugnayan ng ipinagbabawal na pakikisalamuha at ng pahayag ng Diyos
  choice: Inilalarawan ang pakikisalamuha bilang “bawal,” habang malinaw na pinananatili ang itinuro ng Diyos kay Pedro na huwag tawaging karaniwan o marumi ang sinumang tao.
  alternative: Isalin ang ἀθέμιτον bilang “hindi kanais-nais” lamang, o gawing iisang kategorya ang “karaniwan” at “marumi.”
  rationale: Hindi dapat pahinain ang unang pahayag na para bang simpleng asal lamang ang usapin, ngunit hindi rin dapat tukuyin nang higit sa Griyego kung anong uri ng batas o kaugalian ang pinagmulan nito. Mahalaga ring manatili ang paglalapat ng pangitain sa tao at ang dalawang magkaibang katawagang pangkadalisayan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Alam na alam ninyo” upang mapanatili ang diin, “makisalamuha” para sa ugnayang panlipunan, at “taong mula sa ibang bayan” upang maiwasan ang di-kinakailangang pagpapakahulugang etniko o denominasyonal. Ang “karaniwan o marumi” ay sadyang pinanatiling dalawang magkaibang katawagan.
