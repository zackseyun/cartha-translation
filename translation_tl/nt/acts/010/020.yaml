id: ACT.10.20
reference: Acts 10:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ ἀναστὰς κατάβηθι καὶ πορεύου σὺν αὐτοῖς μηδὲν διακρινόμενος, ⸀ὅτι ἐγὼ ἀπέσταλκα αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/020.yaml
  text: But get up[a], go down, and go with them, doubting nothing, because I have sent them.
translation:
  language: tl
  text: Ngunit bumangon ka, bumaba, at sumama sa kanila nang hindi nag-aalinlangan[a], sapagkat ako ang nagsugo sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang hindi gumagawa ng pagtatangi.” Maaaring mangahulugan ang salitang Griyego ng hindi pag-aalinlangan o pag-aatubili, o ng hindi pagtatangi; maaaring umalingawngaw ang ikalawang diwa sa tema ng kabanata tungkol sa mga Judio at mga Hentil.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Malinaw na naghuhudyat ng pagsalungat sa naunang pagkalito ni Pedro at inililipat siya sa agarang pagkilos.
- source_word: ἀναστὰς
  choice: bumangon ka
  rationale: Ang aorist participle ay bahagi ng sunod-sunod na pautos; natural at tuwiran sa modernong Tagalog ang “bumangon ka.”
- source_word: κατάβηθι
  choice: bumaba
  rationale: Pinananatili ang kilos pababa mula sa kinaroroonan ni Pedro sa bubungan.
- source_word: πορεύου σὺν αὐτοῖς
  choice: sumama sa kanila
  rationale: Sa konteksto, ang pagpunta kasama nila ay likas na ipinahahayag sa Tagalog bilang “sumama sa kanila,” nang hindi na inuulit ang “pumunta.”
- source_word: μηδὲν διακρινόμενος
  choice: nang hindi nag-aalinlangan
  rationale: Pinakamalinaw sa agarang konteksto ang diwa ng hindi pag-aalinlangan o pag-aatubili, habang inilalagay sa talababa ang posibleng diwa ng hindi pagtatangi.
- source_word: ὅτι
  choice: sapagkat
  rationale: Likas at marangal na panandang sanhi na nagbibigay ng dahilan sa pagsunod ni Pedro.
- source_word: ἐγὼ ἀπέσταλκα αὐτούς
  choice: ako ang nagsugo sa kanila
  rationale: Ang ayos na “ako ang” ay nagpapakita ng diin ng tahasang ἐγώ; ang “nagsugo” ay natural na Tagalog para sa natapos na pagsusugong may bisa sa kasalukuyang tagpo.
theological_decisions:
- issue: Kahulugan ng μηδὲν διακρινόμενος kaugnay ng pagtanggap sa mga Hentil
  choice: “nang hindi nag-aalinlangan” sa pangunahing teksto
  alternative: “nang hindi gumagawa ng pagtatangi”
  rationale: Ang agarang konteksto ay ang pagkalito ni Pedro at ang utos ng Espiritu na sumama sa mga lalaki, kaya ang diwa ng hindi pag-aalinlangan ang pangunahing salin. Gayunman, maaaring tumukoy ang pandiwa sa hindi pagtatangi, na umaalingawngaw sa temang Judio-Hentil ng kabanata; pinananatili ang tunay na kalabuan sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “sumama” upang maging natural ang utos na pumunta kasama ng mga sugo, at inilagay ang pananda ng talababa sa mismong pariralang may leksikal at teolohikal na kalabuan.
