id: ACT.10.22
reference: Acts 10:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κορνήλιος ἑκατοντάρχης, ἀνὴρ δίκαιος καὶ φοβούμενος τὸν θεὸν μαρτυρούμενός τε ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων, ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ καὶ ἀκοῦσαι ῥήματα παρὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/022.yaml
  text: They said[a], “Cornelius, a centurion, a righteous man and one who fears God, and who is well spoken of by the whole nation of the Jews[e][d][c][b], was divinely instructed by a holy angel to summon you to his house and to hear words from you.”
translation:
  language: tl
  text: Sinabi nila, “Si Cornelio, isang senturyon, ay isang taong matuwid at may takot sa Diyos. Mabuti ang patotoo tungkol sa kanya ng buong sambayanang Judio. Tinagubilinan siya ng isang banal na anghel na ipatawag ka sa kanyang bahay at pakinggan ang mga sasabihin mo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “at makarinig ng mga salita mula sa iyo.”
    reason: Pinananatili ang mas literal na anyo bilang alternatibo habang gumagamit ng natural na Tagalog sa pangunahing teksto.
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: senturyon
  rationale: Ang “senturyon” ang kinikilalang makasaysayang katawagan sa isang opisyal ng hukbong Romano na namumuno sa isang yunit ng mga kawal.
- source_word: ἀνὴρ δίκαιος
  choice: isang taong matuwid
  rationale: Pinananatili ng “matuwid” ang moral at panrelihiyong diwa ng δίκαιος nang hindi nagdaragdag ng doktrinal na konklusyon.
- source_word: φοβούμενος τὸν θεόν
  choice: may takot sa Diyos
  rationale: Likas itong idyomang biblikal sa Tagalog at pinananatili ang diwa ng paggalang at debosyon sa Diyos.
- source_word: μαρτυρούμενος
  choice: Mabuti ang patotoo tungkol sa kanya
  rationale: Ipinahahayag nito ang paborableng patotoong ibinibigay ng iba tungkol kay Cornelio.
- source_word: ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων
  choice: ng buong sambayanang Judio
  rationale: Ang “sambayanan” ay malinaw na tumutukoy sa pangkat ng mga tao at umiiwas sa makabagong pampolitikang kahulugan ng “bansa.”
- source_word: ἐχρηματίσθη
  choice: Tinagubilinan siya
  rationale: Sa konteksto, tumutukoy ang pandiwa sa pagtanggap ng tagubiling mula sa langit; hayagang tinutukoy ng kasunod na parirala ang banal na anghel bilang tagapamagitan.
- source_word: ἀγγέλου ἁγίου
  choice: ng isang banal na anghel
  rationale: Tuwirang kinakatawan ang pang-uri na ἁγίου at natural ang ayos sa Tagalog.
- source_word: μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ
  choice: na ipatawag ka sa kanyang bahay
  rationale: Ang “ipatawag” ay natural at maikli para sa pagpapasundo o pagpapapunta sa isang tao sa itinakdang lugar.
- source_word: ἀκοῦσαι ῥήματα παρὰ σοῦ
  choice: at pakinggan ang mga sasabihin mo
  rationale: Natural itong Tagalog para sa literal na “makinig sa mga salitang mula sa iyo” at hindi nito itinatakda kung sermon, mensahe, o ibang uri ng pananalita ang nilalaman.
theological_decisions:
- issue: Paglalarawan sa kabanalan ni Cornelio nang hindi ipinapasok ang mga doktrinal na kategoryang wala sa talata
  choice: isang taong matuwid at may takot sa Diyos
  alternative: isang debotong tao
  rationale: Pinananatili nito ang dalawang tahasang paglalarawan sa Griyego at hindi nagpapasya tungkol sa kanyang kalagayan sa tipan o kaligtasan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “senturyon” bilang pamilyar na terminong historikal, “sambayanang Judio” upang tukuyin ang pangkat ng mga tao, at maiikling pangungusap upang maging malinaw ang mahabang estrukturang Griyego nang hindi binabago ang ugnayan ng mga ideya.
