  verdict: approve
  source_fidelity: 'Tumpak na naipapahayag ng salin ang mga pangunahing sangkap ng Griyego: si Cornelio ay senturyon, matuwid, may takot sa Diyos, may mabuting patotoo mula sa buong sambayanang Judio, at tinagubilinan ng isang banal na anghel na ipatawag si Pedro sa kanyang bahay upang marinig ang mga salita nito. Ang paghahati sa dalawang pangungusap ay hindi nagbabago sa ugnayan ng mga ideya.'
  naturalness: Natural at marangal ang modernong Filipino. Ang “senturyon,” “taong matuwid,” “may takot sa Diyos,” at “buong sambayanang Judio” ay malinaw at angkop sa rehistro. Ang “ipatawag ka sa kanyang bahay” ay isang katanggap-tanggap na likas na pagsasalin ng pagpapapasundo/pagpapapunta sa tao sa bahay ni Cornelio.
  terminology: Wasto at pare-pareho ang mga katawagang historikal at panrelihiyon. Hindi ipinapasok ng “taong matuwid at may takot sa Diyos” ang anumang karagdagang doktrinal na pagpapasiya tungkol kay Cornelio. Ang “banal na anghel” ay kumakatawan sa tahasang pang-uri sa pinagmulan.
