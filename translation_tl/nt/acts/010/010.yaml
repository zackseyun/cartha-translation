  text: ἐγένετο δὲ πρόσπεινος καὶ ἤθελεν γεύσασθαι· παρασκευαζόντων δὲ ⸀αὐτῶν ⸀ἐγένετο ἐπ’ αὐτὸν ἔκστασις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/010.yaml
  text: He became very hungry and wanted to eat[a]; but while they were preparing it[b], a trance came over him.
translation:
  language: tl
  text: Gutom na gutom siya at nais niyang kumain[a]. Ngunit habang naghahanda sila ng pagkain, nawalan siya ng ulirat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nais niyang tumikim.” Literal na “tumikiim” ang pandiwang Griyego, ngunit tumutukoy ito rito sa pagkain.
    reason: lexical_alternative
  - marker: b
    text: O “dinatnan siya ng ekstasi.” Tumutukoy ang salitang Griyego rito sa isang nabagong kalagayan ng kamalayan na kaugnay ng pangitaing naghahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο … πρόσπεινος
  choice: Gutom na gutom siya
  rationale: Ipinahahayag ng ἐγένετο ang pagsapit ng kalagayan, at masidhi ang πρόσπεινος. Likas sa Tagalog ang “gutom na gutom” at hindi na kailangang tahasang isalin ang pandiwang “naging.”
- source_word: ἤθελεν
  choice: nais niyang
  rationale: Natural at marangal na katumbas ito ng patuloy na pagnanais sa konteksto.
- source_word: γεύσασθαι
  choice: kumain
  rationale: Bagaman literal na maaaring mangahulugang “tikman,” tumutukoy rito ang pandiwa sa pagkain.
- source_word: παρασκευαζόντων αὐτῶν
  choice: habang naghahanda sila ng pagkain
  rationale: Ipinakikita ng genitive absolute ang kasabay na kilos. Nilinaw ang ipinahihiwatig na pagkain nang hindi tinutukoy kung anong putahe iyon.
- source_word: ἐγένετο ἐπ’ αὐτὸν
  choice: nalagay siya sa
  rationale: Inilalarawan ng parirala ang biglang pagsapit sa kanya ng isang natatanging kalagayan; mas natural ito sa Tagalog kaysa sa literal na “dumating sa kanya.”
- source_word: ἔκστασις
  choice: isang kalagayang wala sa sarili
  rationale: Sa konteksto, tumutukoy ito sa nabagong kalagayan ng kamalayan na kaugnay ng paghahayag, hindi lamang sa pagkagulat. Iniiwasan din nito ang karaniwang modernong kahulugan ng “ekstasi” bilang matinding galak.
theological_decisions:
- issue: Ang uri ng kalagayang tinutukoy ng ἔκστασις
  choice: isang kalagayang wala sa sarili
  alternative: ekstasi; pagkawala ng ulirat; pagkagulat
  rationale: Kasunod agad nito ang isang pangitain, kaya higit ito sa simpleng pagkagulat. Gayunman, hindi idinagdag sa pangunahing teksto na tuluyan siyang nawalan ng malay o na ito ay isang partikular na uri ng mistikal na karanasan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang karaniwang idyomang “gutom na gutom,” habang pinanatiling maingat at hindi sobrang teknikal ang paglalarawan sa ἔκστασις.
