  source_fidelity: Tumpak ang pangunahing diwa ng gutom at pagnanais kumain, at ang paghahanda ng pagkain ay isang katanggap-tanggap na paglilinaw ng ipinahihiwatig na bagay. Gayunman, ang “nalagay siya sa isang kalagayang wala sa sarili” ay masyadong di-tuwiran para sa ἔκστασις at hindi gaanong malinaw na ito ay biglaang visionary state na dumating sa kanya. Ang “nawalan ng ulirat” ay matatag na modernong katumbas sa kontekstong ito at hindi naman kinakailangang magpahiwatig ng tuluyang pagkawalang-malay.
  naturalness: Likas ang “Gutom na gutom siya” at “habang naghahanda sila ng pagkain.” Mas natural at mas maigsi sa modernong Tagalog ang “nawalan siya ng ulirat” kaysa “nalagay siya sa isang kalagayang wala sa sarili.” Hindi natural ang alternatibong pananalitang “sinidlan siya ng ekstasi.”
  terminology: Pinananatili ng “nawalan ng ulirat” ang kahulugang trance-like ng ἔκστασις sa salaysay nang hindi ipinipilit ang makabagong, masayang konotasyon ng “ekstasi.” Inayos ang talababa upang ang literal na alternatibo para sa γεύσασθαι ay hindi magdagdag ng bagay na wala sa Griyego at upang maging malinaw ang alternatibo para sa ἔκστασις.
