id: ACT.10.33
reference: Acts 10:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐξαυτῆς οὖν ἔπεμψα πρὸς σέ, σύ τε καλῶς ἐποίησας παραγενόμενος. νῦν οὖν πάντες ἡμεῖς ἐνώπιον τοῦ θεοῦ πάρεσμεν ἀκοῦσαι πάντα τὰ προστεταγμένα σοι ὑπὸ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/033.yaml
  text: So I sent for you at once[a], and you did well to come. Now then[b], we are all here before God to hear everything that has been commanded to you by the Lord.
translation:
  language: tl
  text: Kaya agad kitang ipinasundo[a], at mabuti ang ginawa mong pagparito. Ngayon nga, narito kaming lahat sa harap ng Diyos upang pakinggan ang lahat ng ipinag-utos sa iyo ng Panginoon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaagad” o “nang walang pagkaantala.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “ng Panginoon.” Sa konteksto, malamang na tumutukoy ito kay Jesus, bagaman inuunawa ito ng ilan bilang pagtukoy sa Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: agad
  rationale: Likas at malinaw na ipinahahayag ng “agad” ang dagliang pagkilos ni Cornelio nang walang di-kailangang pormalidad.
- source_word: οὖν
  choice: Kaya / Ngayon
  rationale: Sa unang gamit, ipinakikita ng “Kaya” ang bunga ng naunang paliwanag; sa “νῦν οὖν,” likas na inililipat ng “Ngayon” ang usapan sa layunin ng pagtitipon.
- source_word: ἔπεμψα πρὸς σέ
  choice: nagpasundo sa iyo
  rationale: Bagaman literal na “nagpadala sa iyo,” malinaw sa konteksto na nagsugo si Cornelio ng mga tao upang papuntahin si Pedro; likas sa Tagalog ang “nagpasundo.”
- source_word: καλῶς ἐποίησας παραγενόμενος
  choice: mabuti at naparito ka
  rationale: Pinananatili nito ang pagsang-ayon ni Cornelio at natural na ipinahahayag sa Tagalog ang pagdating ni Pedro.
- source_word: πάντες ἡμεῖς
  choice: kaming lahat
  rationale: Pinananatili ang diin sa kabuuan ng mga taong nagkatipon kasama ni Cornelio.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: sa harap ng Diyos
  rationale: Malapit ito sa anyo ng Griyego at pinananatili ang taimtim na diwa ng kanilang pagkakatipon sa presensiya ng Diyos.
- source_word: πάρεσμεν ἀκοῦσαι
  choice: narito ... upang pakinggan
  rationale: Ang “narito” ay natural na katumbas ng pagiging presente, at ang “upang pakinggan” ay malinaw na naghahayag ng layunin at kusang pakikinig.
- source_word: πάντα τὰ προστεταγμένα σοι
  choice: lahat ng ipinag-utos sa iyo
  rationale: Pinananatili nito ang kabuuan at awtoritatibong lakas ng utos, pati ang diwang nauna nang ibinigay ang mga tagubilin.
- source_word: τοῦ κυρίου
  choice: ng Panginoon
  rationale: Tuwirang pinananatili ang titulong nasa Griyego nang hindi tahasang tinutukoy sa salin kung si Jesus o ang Diyos ang tinutukoy.
theological_decisions:
- issue: Ang tinutukoy ng τοῦ κυρίου (“ng Panginoon”)
  choice: Pinanatili bilang “ng Panginoon” sa pangunahing teksto.
  alternative: “ng Diyos,” o ang mapagpaliwanag na “ng Panginoong Jesus”
  rationale: “Panginoon” lamang ang nasa Griyego. Malamang na tumutukoy ito kay Jesus ayon sa konteksto ng Mga Gawa 10, ngunit maaari rin itong unawain bilang pagtukoy sa Diyos. Hindi nilulutas ng salin ang tunay na kalabuan ng teksto.
translation_notes:
  register: Makabagong Filipino na malinaw, magalang, at taimtim. Ginamit ang likas na “nagpasundo” para sa kontekstuwal na kahulugan ng pagpapadala ng mga sugo, habang pinanatili ang “sa harap ng Diyos” at “Panginoon” upang mapangalagaan ang teolohikal na bigat at kalabuan ng orihinal.
