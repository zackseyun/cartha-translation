  text: καταβὰς δὲ Πέτρος πρὸς τοὺς ἄνδρας εἶπεν· Ἰδοὺ ἐγώ εἰμι ὃν ζητεῖτε· τίς ἡ αἰτία δι’ ἣν πάρεστε;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/021.yaml
  text: So Peter went down to the men and said[a], “Look, I am the one you are looking for. Why are you here?”
translation:
  language: tl
  text: Kaya bumaba si Pedro papunta sa mga lalaki at sinabi, “Narito ako—ako ang hinahanap ninyo. Ano ang dahilan kung bakit narito kayo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβὰς
  choice: bumaba
  rationale: 'Pinananatili ang direksiyong ipinahihiwatig ng καταβαίνω: bumaba si Pedro mula sa kinaroroonan niya patungo sa mga bisita.'
- source_word: δὲ
  choice: Kaya
  rationale: Dito, ang δέ ay nag-uugnay sa kasunod na pangyayari sa salaysay, hindi nagpapahayag ng matinding pagsalungat.
- source_word: πρὸς τοὺς ἄνδρας
  choice: at lumapit sa mga lalaki
  rationale: Ipinahihiwatig ng πρός na kumilos si Pedro patungo sa mga lalaki; likas sa Tagalog ang tahasang pandiwang “lumapit” kasunod ng “bumaba.”
- source_word: Ἰδοὺ ἐγώ εἰμι ὃν ζητεῖτε
  choice: Ako ang hinahanap ninyo
  rationale: Likas at tuwiran itong pagkakakilanlan sa Tagalog. Hindi na kailangang isalin nang hiwalay ang ἰδού, sapagkat magiging pilit ang “Tingnan ninyo” sa ganitong pahayag at sapat nang naipapakita ng tuwirang pagsagot ang pansin na hinihingi nito.
- source_word: τίς ἡ αἰτία δι’ ἣν πάρεστε
  choice: Ano ang dahilan at narito kayo?
  rationale: Pinananatili ang tahasang ουσιαστικό na αἰτία (“dahilan”) at ang kasalukuyang kalagayan ng πάρεστε (“narito kayo”), sa halip na gawing payak na “Bakit kayo naparito?”
