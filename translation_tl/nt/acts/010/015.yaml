base_translation:
  language: en
  yaml_path: translation/nt/acts/010/015.yaml
  text: 'And a voice came to him again a second time: “What God has made clean[a], you must not call common.”'
translation:
  language: tl
  text: 'At sa ikalawang pagkakataon, muling nagsalita sa kanya ang isang tinig: “Ang nilinis ng Diyos, huwag mong ituring na karaniwan.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “huwag mong ituring na marumi” o “huwag mong tratuhing di-dalisay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: isang tinig
  rationale: Likas sa Tagalog ang di-tiyak na “isang tinig” para sa pangngalang walang pantukoy; nakatuon ang salaysay sa muling narinig na pahayag.
- source_word: πάλιν ἐκ δευτέρου
  choice: muling … sa ikalawang pagkakataon
  rationale: Pinananatili ang bahagyang mariing pag-uulit ng dalawang ekspresyon sa Griyego sa paraang malinaw at katanggap-tanggap sa modernong Tagalog.
- source_word: πρὸς αὐτόν
  choice: sa kanya
  rationale: Karaniwang Tagalog para sa pananalitang tuwirang ipinarating kay Pedro.
- source_word: Ἃ
  choice: Ang
  rationale: Ginagamit bilang pangkalahatang kolektibong pantukoy sa anumang nilinis ng Diyos; hindi nito nililimitahan ang tinutukoy sa isang bagay lamang.
- source_word: ὁ θεὸς
  choice: Diyos
  rationale: Karaniwang anyo sa Tagalog kapag tumutukoy sa Diyos.
- source_word: ἐκαθάρισεν
  choice: nilinis
  rationale: Tuwirang ipinapahayag ang tiyak na pagkilos ng Diyos at pinananatili ang ugnay sa wikang ritwal tungkol sa pagiging malinis.
- source_word: σὺ
  choice: mong
  rationale: Ang panghalip sa “huwag mong” ay malinaw na nag-uukol ng utos kay Pedro; sapat ang diin nito sa natural na Tagalog.
- source_word: μὴ κοίνου
  choice: huwag mong ituring na karaniwan
  rationale: Ang “ituring na karaniwan” ay nagpapanatili sa kategoryang κοινός at sa kaibhan nito sa tahasang “marumi,” habang natural na nagpapahayag ng ipinagbabawal na paghatol o pagtrato.
theological_decisions:
- issue: Paglalarawan sa kadalisayan sa pangitain ni Pedro
  choice: “huwag mong ituring na karaniwan” sa pangunahing teksto
  alternative: “huwag mong ituring na marumi” o “huwag mong ituring na di-dalisay”
  rationale: Magkatunggali sa talata ang κοινόω at καθαρίζω. Ang “karaniwan” ay nagpapanatili sa natatanging kategorya ng ritwal na pagiging common/profane at hindi ito basta pinapantay sa ἀκάθαρτος, bagaman maaaring mas malinaw sa ilang mambabasa ang mga alternatibong nasa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang ayos na “muling … sa ikalawang pagkakataon” ay sadyang nagpapanatili sa pag-uulit ng Griyego. Ginamit ang “ituring na karaniwan” upang mapanatili ang mahalagang wikang pangkadalisayan, na may mas interpretibong mga katumbas sa talababa.
