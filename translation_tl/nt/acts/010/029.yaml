  text: Therefore I came without objection when I was sent for[a]. So I ask[b], for what reason did you send for me?
translation:
  language: tl
  text: 'Kaya nga, nang ipasundo ako, pumunta ako nang walang pagtutol.[a] Kaya itinatanong ko: sa anong dahilan ninyo ako ipinasundo?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “nang walang pag-aatubili.” Mas literal, ang Griyego ay nangangahulugang “nang walang pagtutol” o “nang hindi nakikipagtalo.”'
    reason: lexical_alternative
  - marker: b
    text: 'O: “bakit ninyo ako ipinasundo?” Mas literal: “sa anong dahilan ninyo ako ipinasundo?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: Kaya nga
  rationale: Ipinakikita ng διό ang bunga ng naunang paliwanag, habang likas na naihahatid ng “nga” ang bahagyang diin ng καί.
- source_word: ἀναντιρρήτως
  choice: nang walang pagtutol
  rationale: Pinananatili nito ang pangunahing diwa ng hindi pagsalungat, pakikipagtalo, o pagtutol, sa halip na paliitin ang kahulugan tungo lamang sa kawalan ng pag-aatubili.
- source_word: ἦλθον
  choice: pumunta ako
  rationale: Sa pananaw ng nagsasalita sa kinaroroonan ng mga kausap, natural sa modernong Tagalog ang “pumunta ako”; tuwiran nitong isinasalin ang kilos ng pagparoon.
- source_word: μεταπεμφθείς
  choice: nang ipasundo ako
  rationale: Pinananatili ng pariralang ito ang pasibong anyo at ang diwa ng pagpapatawag o pagpapasundo nang hindi tahasang nagdaragdag ng gumaganap na hindi binanggit sa sugnay.
- source_word: πυνθάνομαι οὖν
  choice: Kaya itinatanong ko
  rationale: Ang “itinatanong ko” ay malinaw na kasalukuyang pagtatanong, at ang “kaya” ay naghahatid ng lohikal na paglipat ng οὖν.
- source_word: τίνι λόγῳ
  choice: sa anong dahilan
  rationale: Mas malapit ito sa literal na “sa anong dahilan” kaysa sa pinaikling “bakit,” ngunit natural pa rin sa pormal at dignified na Tagalog.
- source_word: μετεπέμψασθέ με
  choice: ninyo ako ipinasundo
  rationale: Malinaw nitong ipinahahayag na ang mga kausap ang nagpadala upang sunduin o tawagin si Pedro, at pinananatili ang kaugnayan sa naunang μεταπεμφθείς.
