translation_notes:
  register: Modernong Filipino Tagalog na malinaw at dignified. Ginamit ang “ipasundo” bilang likas na katumbas ng pagpapatawag sa pamamagitan ng mga mensahero, at pinanatili ang bahagyang pormal na “sa anong dahilan” upang tumbasan ang anyo ng Griyego.
