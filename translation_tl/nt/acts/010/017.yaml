source:
  edition: SBLGNT
  text: Ὡς δὲ ἐν ἑαυτῷ διηπόρει ὁ Πέτρος τί ἂν εἴη τὸ ὅραμα ὃ εἶδεν, ⸀ἰδοὺ οἱ ἄνδρες οἱ ἀπεσταλμένοι ⸀ὑπὸ τοῦ Κορνηλίου διερωτήσαντες τὴν οἰκίαν ⸀τοῦ Σίμωνος ἐπέστησαν ἐπὶ τὸν πυλῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/017.yaml
  text: While Peter was inwardly perplexed as to what the vision that he had seen might mean[a], behold, the men who had been sent by Cornelius, having asked directions to Simon’s house[b], stood at the gate.
translation:
  language: tl
  text: Habang labis na naguguluhan si Pedro kung ano ang maaaring kahulugan ng pangitaing nakita niya[a], biglang dumating ang mga lalaking isinugo ni Cornelio. Matapos magtanong kung saan ang bahay ni Simon, tumigil sila sa may pintuang-daan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kung ano kaya ang pangitaing nakita niya.” Mas literal ito sa Griego, ngunit malamang na ang tinutukoy rito ay ang kahulugan o kabuluhan ng pangitain.
    reason: lexical_alternative
  - marker: b
    text: O, “sa may pasukan.” Ang salitang Griego ay maaaring tumukoy sa pintuang-daan o sa lugar ng pasukan ng isang bahay.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Habang
  rationale: Likas na ipinakikilala ang kasabay na pangyayari at sapat na naihahatid ang temporal na diwa; hindi na kailangan ang dagdag na “ngayon.”
- source_word: ἐν ἑαυτῷ διηπόρει
  choice: palaisip si Pedro
  rationale: Ipinahihiwatig ang patuloy at panloob na pagkalito o matinding pag-iisip ni Pedro sa natural na modernong Tagalog.
- source_word: τί ἂν εἴη
  choice: kung ano ang kahulugan
  rationale: Sa konteksto, sinisikap ni Pedro na maunawaan ang kabuluhan ng pangitain; itinatala sa talababa ang mas literal na posibilidad.
- source_word: τὸ ὅραμα ὃ εἶδεν
  choice: pangitaing nakita niya
  rationale: Tuwiran, malinaw, at natural na salin ng pariralang tumutukoy sa naunang pangitain.
- source_word: ἰδοὺ
  choice: naroon
  rationale: Pinananatili ang biglang pagtutok ng salaysay sa bagong pangyayari nang hindi gumagamit ng makalumang “masdan.”
- source_word: οἱ ἄνδρες οἱ ἀπεσταλμένοι ὑπὸ τοῦ Κορνηλίου
  choice: ang mga lalaking isinugo ni Cornelio
  rationale: Pinananatili ang pagtukoy sa mga lalaki at ang pasibong ideya na sila ay ipinadala ni Cornelio.
- source_word: διερωτήσαντες τὴν οἰκίαν τοῦ Σίμωνος
  choice: Matapos nilang ipagtanong ang bahay ni Simon
  rationale: Ipinakikita ng “matapos” na nauna ang pagtatanong sa kanilang pagtigil sa pintuang-daan; idiomatiko ang “ipagtanong” para sa paghahanap ng direksiyon o kinaroroonan.
- source_word: ἐπέστησαν ἐπὶ τὸν πυλῶνα
  choice: huminto sila sa may pintuang-daan
  rationale: Ipinahahayag ang pagdating at pagtayo o paghinto nila sa lugar ng pasukan; ang “pintuang-daan” ay mas tiyak kaysa simpleng “pinto.”
