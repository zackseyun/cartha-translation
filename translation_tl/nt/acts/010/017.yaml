revisions:
- from: Habang palaisip si Pedro kung ano ang kahulugan ng pangitaing nakita niya[a], naroon ang mga lalaking isinugo ni Cornelio. Matapos nilang ipagtanong ang bahay ni Simon, huminto sila sa may pintuang-daan[b].
  to: Habang labis na naguguluhan si Pedro kung ano ang maaaring kahulugan ng pangitaing nakita niya[a], biglang dumating ang mga lalaking isinugo ni Cornelio. Matapos magtanong kung saan ang bahay ni Simon, tumigil sila sa may pintuang-daan[b].
  rationale: Pinalitan ang “palaisip” ng “labis na naguguluhan” upang maipahayag ang lakas at patuloy na aspekto ng pandiwang Griego. Ginawang “biglang dumating” ang salaysay upang likas na maihatid ang ἰδού, habang ang “tumigil sila sa may pintuang-daan” ay nagpapanatili sa lokasyong isinasaad ng ἐπέστησαν ἐπὶ τὸν πυλῶνα. Nilinaw ang naunang pagtatanong para sa bahay ni Simon nang walang pagdaragdag ng kahulugan.
