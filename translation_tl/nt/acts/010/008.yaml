  text: καὶ ἐξηγησάμενος ⸂ἅπαντα αὐτοῖς⸃ ἀπέστειλεν αὐτοὺς εἰς τὴν Ἰόππην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/008.yaml
  text: And after explaining everything to them, he sent them to Joppa.
translation:
  language: tl
  text: Matapos niyang ipaliwanag sa kanila ang lahat, isinugo niya sila sa Jope.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγησάμενος
  choice: Matapos niyang ipaliwanag
  rationale: Ang aorist middle participle ay nagpapahayag ng kilos na nauna sa pangunahing pandiwa. Likas sa makabagong Tagalog ang “matapos niyang ipaliwanag” at ipinahihiwatig nitong inilahad ni Cornelio nang buo at malinaw ang nangyari.
- source_word: ἅπαντα αὐτοῖς
  choice: sa kanila ang lahat
  rationale: Ang ἅπαντα ay komprehensibo, “ang lahat,” at ang αὐτοῖς ang tumutukoy sa mga pinagpaliwanagan. Pinananatili ng ayos na ito ang likas at malinaw na Tagalog.
- source_word: ἀπέστειλεν αὐτούς
  choice: isinugo niya sila
  rationale: Ang ἀποστέλλω ay nangangahulugang magpadala o magsugo. Ang “isinugo” ay angkop sa mga taong pinapunta upang gumanap ng isang tiyak na atas, nang hindi nagdaragdag ng di-tahasang pagmamadali.
- source_word: εἰς τὴν Ἰόππην
  choice: sa Jope
  rationale: Ipinapahayag ng εἰς ang patutunguhan. “Sa Jope” ang likas na anyo sa Tagalog; “Jope” ang nakaugaliang Filipino na pangalan ng lugar.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “isinugo” upang ipakita ang may-layuning pagpapadala, at pinanatiling tuwiran ang maikling salaysay.
