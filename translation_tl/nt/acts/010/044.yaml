id: ACT.10.44
reference: Acts 10:44
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἔτι λαλοῦντος τοῦ Πέτρου τὰ ῥήματα ταῦτα ἐπέπεσε τὸ πνεῦμα τὸ ἅγιον ἐπὶ πάντας τοὺς ἀκούοντας τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/044.yaml
  text: While Peter was still speaking these words[a], the Holy Spirit fell upon all those hearing the word.
translation:
  language: tl
  text: Habang sinasabi pa ni Pedro ang mga salitang ito, bumaba ang Banal na Espiritu sa lahat ng nakikinig sa mensahe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dumating ang Banal na Espiritu sa lahat ng nakikinig sa salita.”
    reason: Nagbibigay ng mas banayad na salin ng ἐπέπεσε at ng mas tuwirang leksikal na katumbas ng λόγος, nang hindi inaalis ang posibilidad ng alinmang pagbasa.
lexical_decisions:
- source_word: Ἔτι λαλοῦντος τοῦ Πέτρου
  choice: Habang sinasabi pa ni Pedro
  rationale: Ang genitive absolute na may present participle, kasama ang ἔτι, ay nagsasaad ng kilos na nagpapatuloy nang mangyari ang pangunahing kilos. Likas sa Tagalog ang “habang ... pa” upang mapanatili ang sabayang pangyayari.
- source_word: τὰ ῥήματα ταῦτα
  choice: ang mga salitang ito
  rationale: Tumutukoy ang ῥήματα sa mismong mga sinasabi ni Pedro; tuwiran at natural ang “mga salitang ito.”
- source_word: ἐπέπεσε
  choice: bumaba ... sa
  rationale: Sa kontekstong ang Banal na Espiritu ang gumaganap, natural sa modernong Tagalog ang “bumaba sa” at pinananatili nito ang malinaw at biglaang pagdating na ipinahihiwatig ng ἐπιπίπτω, nang hindi gumamit ng di-angkop na literal na “nahulog.”
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: ang Banal na Espiritu
  rationale: Ito ang malinaw, kasalukuyan, at karaniwang salin ng pariralang Griyego sa Tagalog.
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: sa lahat ng nakikinig
  rationale: Pinananatili ng “lahat” ang saklaw ng πάντας, at ng aspektong nagpapatuloy sa “nakikinig” ang present participle na ἀκούοντας.
- source_word: τὸν λόγον
  choice: sa mensahe
  rationale: Sa konteksto ng pangangaral ni Pedro, tumutukoy ang λόγος sa ipinahahayag na mensahe, hindi sa isang hiwalay na salita. Malinaw ito sa ordinaryong mambabasang Tagalog.
theological_decisions:
- issue: Paglalarawan sa pagkilos ng Espiritu sa ἐπέπεσε
  choice: bumaba ang Banal na Espiritu sa lahat
  alternative: dumating ang Banal na Espiritu sa lahat
  rationale: Pinananatili ng “bumaba ... sa” ang kongkreto at masiglang paglalarawan ni Lucas, ngunit hindi nito dinaragdagan ang teksto ng anumang tiyak na doktrina tungkol sa karanasang ito.
- issue: Kahulugan ng λόγος sa konteksto ng pagpapahayag
  choice: mensahe
  alternative: salita
  rationale: Nililinaw ng “mensahe” na ang tinutukoy ay ang ipinahahayag ni Pedro. Gayunman, tunay na posibleng salin ang “salita,” kaya inilalahad ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Iniwasan ang sobrang literal na “nahulog” para sa pagkilos ng Espiritu, ngunit pinanatili ang lakas ng salaysay sa “bumaba.”
