  yaml_path: translation/nt/acts/010/012.yaml
  text: In it were all the four-footed animals and reptiles of the earth[c][b][a], and birds of the sky.
translation:
  language: tl
  text: Sa loob nito ay may lahat ng hayop na may apat na paa, mga gumagapang sa lupa[a], at mga ibon sa langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga nilalang na gumagapang sa lupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Naroon
  rationale: Tumutukoy ito sa sisidlang tulad ng malaking kumot sa pangitain. Likas sa modernong Tagalog ang “naroon” at pinananatili nito ang diwang lokatibo nang hindi inuulit ang sisidlan.
- source_word: ὑπῆρχεν
  choice: ang
  rationale: Kasama ng “naroon,” likas na ipinahahayag nito ang pag-iral o presensya ng mga hayop sa loob ng nakita; iniiwasan ang mas mapagpakahulugang “nakapaloob.”
- source_word: πάντα
  choice: lahat
  rationale: Pinananatili ang malawak at komprehensibong saklaw ng Griyego nang hindi idinaragdag ang interpretasyong “lahat ng uri.”
- source_word: τὰ τετράποδα
  choice: mga hayop na may apat na paa
  rationale: Malinaw at karaniwang pananalita ito para sa mga hayop na apat ang paa, at hindi teknikal tulad ng “kuwadrupedo.”
- source_word: ἑρπετὰ τῆς γῆς
  choice: mga gumagapang sa lupa
  rationale: Mas malawak ang ἑρπετά kaysa sa makabagong biyolohikal na kategoryang “reptilya”; kaya pinananatili ng “mga gumagapang” ang saklaw at ang ugnayan nito sa lupa.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: mga ibon sa himpapawid
  rationale: Sa konteksto, natural at sapat ang “mga ibon”; ang “himpapawid” ay tumutukoy sa kalangitan bilang lugar na nililiparan, hindi sa tirahan ng Diyos.
- source_word: καὶ ... καὶ
  choice: mga …, mga …, at mga …
  rationale: Ginawang likas na serye sa Tagalog ang magkakaugnay na mga pangkat habang pinananatili ang tatlong kategorya.
