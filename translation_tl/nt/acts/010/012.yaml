  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “naroon” upang natural na maiugnay ang talata sa sisidlang binanggit sa naunang talata. Iniwasan ang “reptilya” dahil mas makitid iyon kaysa sa saklaw ng Griyegong ἑρπετά.
