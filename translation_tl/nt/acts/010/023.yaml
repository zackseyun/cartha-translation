base_translation:
  language: en
  yaml_path: translation/nt/acts/010/023.yaml
  text: So he invited them in and gave them lodging[a]. The next day he got up and went out with them[b], and some of the brothers from Joppa went with him.
translation:
  language: tl
  text: Kaya inanyayahan niya silang pumasok at pinatuloy[a]. Kinabukasan, bumangon siya at umalis kasama nila, at ilan sa mga kapatid[b] mula sa Jope ang sumama sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinatuloy bilang mga panauhin”; ang salitang Griyego ay tumutukoy sa magiliw na pagtanggap at pagbibigay ng matutuluyan.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kapatid” ay salin ng panlalaking pangmaramihang anyo sa Griyego; sa sinaunang gamit ng mga Cristiano, maaari rin itong tumukoy nang mas malawak sa mga kapwa mananampalataya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσκαλεσάμενος
  choice: pinapasok niya sila
  rationale: Likas na Filipino para sa pagpapapasok sa mga sugo; naipapakita ang kilos nang hindi dinaragdagan ang teksto.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahahayag ang bunga ng naunang pag-uusap at angkop sa daloy ng salaysay.
- source_word: ἐξένισεν
  choice: pinatuloy
  rationale: Sa konteksto, tumutukoy ito sa pagtanggap bilang mga panauhin at pagbibigay ng matutuluyan; likas at tiyak ang “pinatuloy” sa Filipino.
- source_word: Τῇ δὲ ἐπαύριον
  choice: Kinabukasan
  rationale: Maikli, natural, at tapat na panandang temporal.
- source_word: ἀναστὰς
  choice: bumangon siya
  rationale: Pinananatili ang tahasang kilos ng participle at hindi ito ipinapaloob lamang sa pag-alis.
- source_word: ἐξῆλθεν
  choice: umalis
  rationale: Sa konteksto ng pagsisimula ng paglalakbay, mas natural sa Filipino kaysa sa literal na “lumabas,” habang pinananatili ang diwa ng pag-alis.
- source_word: σὺν αὐτοῖς
  choice: kasama nila
  rationale: Payak at likas na pagpapahayag ng pagsama.
- source_word: καί
  choice: at ... rin
  rationale: Ang “rin” ay natural na nagpapakita na bukod kay Pedro at sa mga sugo, may iba pang sumama.
- source_word: τινες
  choice: ilan
  rationale: Karaniwang katumbas ng di-tiyak na pangmaramihang anyo.
- source_word: ἀδελφῶν
  choice: mga kapatid
  rationale: Ang “mga kapatid” ang karaniwang tawag sa Filipino sa kapwa mananampalataya at hindi gramatikal na nagtatakda ng kasarian gaya ng anyong Griyego.
- source_word: τῶν ἀπὸ Ἰόππης
  choice: mula sa Jope
  rationale: Malinaw na ipinahahayag ang pinagmulan ng mga kapatid; “Jope” ang nakaugaliang anyong Filipino ng pangalan.
- source_word: συνῆλθον αὐτῷ
  choice: sumama rin sa kanya
  rationale: Sa konteksto, ipinahahayag ng pandiwa ang pagsama kay Pedro sa paglalakbay.
theological_decisions:
- issue: Saklaw ng ἀδελφῶν sa tawag sa mga mananampalataya
  choice: mga kapatid
  alternative: mga lalaking kapatid; mga kapwa mananampalataya
  rationale: Masculine plural ang anyong Griyego, ngunit maaari itong gamitin bilang katawagan sa mga kapananampalataya. Ang likas na Filipino na “mga kapatid” ay nagpapanatili sa katawagang pampamilya at sa posibleng saklaw nito nang hindi nagpapasya sa kasarian ng bawat kasama.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “pinatuloy” para sa kongkretong gawa ng pagpapatulóy sa mga panauhin, at pinanatiling payak ang galaw ng salaysay. Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
