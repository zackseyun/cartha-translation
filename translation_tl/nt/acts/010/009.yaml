id: ACT.10.9
reference: Acts 10:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον ὁδοιπορούντων ἐκείνων καὶ τῇ πόλει ἐγγιζόντων ἀνέβη Πέτρος ἐπὶ τὸ δῶμα προσεύξασθαι περὶ ὥραν ἕκτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/009.yaml
  text: On the next day[a], while those men were traveling and drawing near to the city, Peter went up on the housetop to pray, about the sixth hour.
translation:
  language: tl
  text: Kinabukasan, habang naglalakbay ang mga lalaking iyon at papalapit sa lungsod, umakyat si Pedro sa bubong ng bahay upang manalangin, bandang ikaanim na oras[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, bandang tanghali ayon sa paraan ng mga Hudyo sa pagbibilang ng mga oras sa maghapon.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Kinabukasan
  rationale: Likas at malinaw na temporal na pananalita sa Tagalog para sa “sa sumunod na araw.” Hindi na isinalin nang hiwalay ang mahinang pang-ugnay na δέ, sapagkat sapat na ang daloy ng salaysay.
- source_word: ὁδοιπορούντων ἐκείνων
  choice: habang naglalakbay ang mga lalaking iyon
  rationale: Ipinahahayag ng “habang” ang kasabay na kilos ng genitive absolute. Ang “mga lalaking iyon” ay malinaw na tumutukoy sa mga sugo ni Cornelio sa naunang konteksto.
- source_word: καὶ τῇ πόλει ἐγγιζόντων
  choice: at papalapit sa lungsod
  rationale: Pinananatili ng “papalapit” ang diwa ng ἐγγίζω at likas itong kaugnay ng nagpapatuloy na paglalakbay.
- source_word: ἀνέβη
  choice: umakyat
  rationale: Tuwirang salaysay ng pagkilos pataas patungo sa bubungan.
- source_word: ἐπὶ τὸ δῶμα
  choice: sa bubungan
  rationale: Ang δῶμα ay tumutukoy dito sa naaakyatang patag na bubong ng bahay. Ang “bubungan” ay maikli at madaling maunawaan sa Tagalog.
- source_word: προσεύξασθαι
  choice: upang manalangin
  rationale: Malinaw na ipinakikita ng “upang” ang layunin ng pag-akyat, gaya ng gamit ng infinitive sa Griyego.
- source_word: περὶ ὥραν ἕκτην
  choice: bandang ikaanim na oras
  rationale: Pinananatili ang sinaunang paraan ng pagtukoy sa oras at ang pagtatantiya ng περί sa salitang “bandang”; ipinaliliwanag sa talababa ang katumbas nito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili sa pangunahing teksto ang pananalitang “ikaanim na oras” mula sa kulturang pinagmulan, habang inilagay sa talababa ang paliwanag na ito ay bandang tanghali.
