translation:
  language: tl
  text: At may isang tinig na nagsabi sa kanya, “Tumayo ka, Pedro. Kumatay ka[a] at kumain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maghain ka at kumain.” Ang pandiwang isinaling “kumatay” ay maaari ring mangahulugang “maghain,” ngunit sa konteksto ng pangitain ay malamang na tumutukoy ito sa pagpatay ng hayop upang kainin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: may ... na nagsabi
  rationale: Sa pagsama sa φωνὴ at πρὸς αὐτόν, likas sa modernong Tagalog na ihayag ang pagdating ng tinig bilang “may isang tinig na nagsabi sa kanya,” habang pinananatili ang pangyayaring may narinig siyang mensahe.
- source_word: φωνὴ
  choice: isang tinig
  rationale: Sa kontekstong ito ng pangitain, tumutukoy ito sa malinaw na tinig na nagsasalita, hindi lamang sa isang tunog.
- source_word: πρὸς αὐτόν
  choice: sa kanya
  rationale: Ipinahihiwatig ng πρός na ang pananalita ay tuwirang nakatuon kay Pedro.
- source_word: Ἀναστάς
  choice: Tumayo ka
  rationale: Ang aorist participle ay gumaganap bilang utos bago ang kasunod na mga pautos. Ang “Tumayo ka” ay tuwiran, natural, at marangal sa modernong Tagalog.
- source_word: Πέτρε
  choice: Pedro
  rationale: Ito ang nakaugaliang anyong Tagalog ng pangalang Πέτρος at malinaw na ginagamit bilang pantawag.
- source_word: θῦσον
  choice: Pumatay ka
  rationale: Bagaman maaari rin itong mangahulugang “maghain,” sa pangitaing ito ay pangunahing tumutukoy ang utos sa pagpatay ng hayop upang kainin. Pinananatili sa talababa ang tunay na leksikal na alternatibo.
- source_word: φάγε
  choice: kumain
  rationale: Tuwirang katumbas ito ng pautos na φάγε at natural sa Tagalog.
- source_word: καὶ
  choice: At / at
  rationale: Pinananatili ng unang “At” ang pagpapatuloy ng salaysay, at ng ikalawang “at” ang pagkakaugnay ng mga utos na pumatay at kumain.
theological_decisions:
- issue: Kung gagamit ng wikang pansakripisyo para sa θῦσον
  choice: “Pumatay ka” sa pangunahing teksto
  alternative: “Maghain ka”
  rationale: Ang agarang konteksto ay ang paghahanda ng mga hayop bilang pagkain sa pangitain, hindi isang tahasang utos na magsagawa ng ritwal na paghahain. Gayunman, dahil tunay na maaaring magtaglay ng kahulugang pansakripisyo ang pandiwa, inilalahad ang alternatibo sa talababa sa halip na burahin ang tensiyong leksikal.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang karaniwang pangalang “Pedro” at maiikling pautos upang mapanatili ang lakas at linaw ng orihinal.
