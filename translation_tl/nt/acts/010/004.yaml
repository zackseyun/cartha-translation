base_translation:
  language: en
  yaml_path: translation/nt/acts/010/004.yaml
  text: But he stared at him[a], and becoming afraid, said, “What is it, Lord?” And he said to him, “Your prayers and your acts of mercy have gone up as a memorial before God.”
translation:
  language: tl
  text: Tinitigan ni Cornelio ang anghel at natakot. Sinabi niya, “Ano iyon, Panginoon?” Sinabi naman ng anghel sa kanya, “Ang mga panalangin mo at ang mga pagkakawanggawa mo[a] ay umakyat bilang isang alaala sa harap ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga paglilimos.” Ang salitang Griyego ay tumutukoy lalo na sa maawaing pagbibigay sa mga nangangailangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: Tinitigan
  rationale: Ipinahihiwatig ng pandiwa ang matindi at matamang pagtitig. Likas at malinaw sa modernong Tagalog ang “tinitigan.”
- source_word: ἔμφοβος γενόμενος
  choice: at natakot
  rationale: Ipinapakita ng parirala ang pagpasok sa kalagayan ng takot. Pinananatili ng “natakot” ang diwang ito nang hindi pinalalabis bilang matinding sindak.
- source_word: Τί ἐστιν
  choice: Ano iyon
  rationale: Tuwirang tanong ito tungkol sa dahilan o layunin ng pagpapakita ng anghel. Likas sa Tagalog ang “Ano iyon?” sa ganitong konteksto.
- source_word: κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang magalang at mataas na anyo ng pagtawag. Sa konteksto, maaari itong maging mapitagang pagtawag sa makalangit na mensahero at hindi kinakailangang isang ganap na pahayag tungkol sa pagkakakilanlan niya.
- source_word: προσευχαί
  choice: mga panalangin
  rationale: Karaniwan, malinaw, at tuwirang katumbas sa Tagalog.
- source_word: ἐλεημοσύναι
  choice: mga pagkakawanggawa
  rationale: Tumutukoy ang salita lalo na sa maawaing pagbibigay sa mga nangangailangan. Mas malinaw sa maraming modernong mambabasa ang “pagkakawanggawa” kaysa sa tradisyonal na “limos.”
- source_word: ἀνέβησαν
  choice: ay umakyat
  rationale: Pinananatili ang larawang pataas na pag-akyat na kaugnay ng panalangin at paghahandog, sa halip na gawing abstraktong “tinanggap.”
- source_word: εἰς μνημόσυνον
  choice: bilang pag-alaala
  rationale: Pinananatili ang wikang may kaugnayan sa pag-alaala sa harap ng Diyos nang hindi tahasang dinaragdagan ng salitang “handog,” na wala sa parirala.
- source_word: ἔμπροσθεν τοῦ θεοῦ
  choice: sa harap ng Diyos
  rationale: Tuwiran at likas na katumbas na nagsasaad ng pagdating sa presensiya o pansin ng Diyos.
theological_decisions:
- issue: Diwa ng κύριε sa pagtawag ni Cornelio sa makalangit na mensahero
  choice: Panginoon
  alternative: Ginoo
  rationale: Pinananatili ng “Panginoon” ang mataas at mapitagang rehistro ng κύριε. Gayunman, hindi ipinapalagay ng salin na kinikilala rito ni Cornelio ang anghel bilang si Jesus; maaari itong gumana bilang magalang na pagtawag sa isang makalangit na nilalang.
- issue: Kabuluhan ng εἰς μνημόσυνον
  choice: bilang pag-alaala
  alternative: bilang handog na nagpapaalaala
  rationale: May alingawngaw ang parirala ng wikang pansakripisyo, ngunit hindi tahasang nakasaad ang “handog.” Kaya pinanatili ang bahagyang di-tiyak na larawan sa halip na tukuyin ito nang higit sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Tahasang pinangalanan sina Cornelio at ang anghel upang maiwasan ang malabong sunod-sunod na panghalip sa Tagalog; malinaw ang mga tinutukoy mula sa konteksto. Pinanatili ang metaporang “umakyat” at ang medyo pormal na “pag-alaala” upang maingatan ang larawang nasa tekstong Griyego.
