revisions:
- from: Tinitigan ni Cornelio ang anghel at natakot. Sinabi niya, “Ano iyon, Panginoon?” Sumagot ang anghel, “Ang mga panalangin mo at ang mga pagkakawanggawa mo[a] ay umakyat bilang pag-alaala sa harap ng Diyos.”
  to: Tinitigan ni Cornelio ang anghel at natakot. Sinabi niya, “Ano iyon, Panginoon?” Sinabi naman ng anghel sa kanya, “Ang mga panalangin mo at ang mga pagkakawanggawa mo[a] ay umakyat bilang isang alaala sa harap ng Diyos.”
  rationale: Pinalitan ang «bilang pag-alaala» ng «bilang isang alaala» upang maging likas ang Filipino at maingatan ang diwa ng μνημόσυνον bilang memorial sa harap ng Diyos. Pinalitan ang «Sumagot» ng «Sinabi naman» upang masundan ang payak na pandiwang εἶπεν. Pinanatili ang mga pangalang Cornelio at ang anghel bilang mga kontekstuwal na paglilinaw na hindi nagbabago sa kahulugan.
