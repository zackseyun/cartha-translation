  - severity: low
    issue: «Sumagot ang anghel» para sa εἶπεν δὲ αὐτῷ
    rationale: Ang Griyego ay payak na «sinabi naman niya sa kanya.» Ang «Sinabi naman ng anghel» ay mas malapit dito at hindi nagdaragdag ng lakas na maaaring taglay ng «sumagot.»
