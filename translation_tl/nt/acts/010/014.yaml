  source_fidelity: Ang mariing Μηδαμῶς ay wastong naipapahayag ng “Hinding-hindi,” at ang κύριε ay angkop na “Panginoon.” Gayunman, ang “itinuturing na karaniwan” ay nagdaragdag ng diwang pagtatasa na wala sa Griyego at hindi sapat na naihahatid ang ritwal na gamit ng κοινόν. Ang “di-banal” ay mas malapit sa pagkakaiba nito sa ἀκάθαρτον (“marumi”), habang pinananatili ang καὶ (“at”).
  naturalness: Natural at marangal ang pangungusap sa modernong Filipino. Ang “Hindi pa ako kailanman kumain” ay bahagyang mas tuwiran at pangkaraniwan kaysa “kailanma’y hindi pa ako kumain.”
  terminology: Pinanatili ang “Panginoon” para sa κύριε nang hindi nilulutas ang sinasadyang bukas na saklaw ng titulo. Isinasalin ang κοινόν bilang “di-banal” sa ritwal na diwa nito, at ang ἀκάθαρτον bilang “marumi”; hindi pinagsasama o ginagawang alternatibo ang dalawang termino.
