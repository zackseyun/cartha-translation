  text: ὁ δὲ Πέτρος εἶπεν· Μηδαμῶς, κύριε, ὅτι οὐδέποτε ἔφαγον πᾶν κοινὸν ⸀καὶ ἀκάθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/014.yaml
  text: But Peter said, “By no means, Lord, because I have never eaten anything common and unclean.”
translation:
  language: tl
  text: Ngunit sinabi ni Pedro, “Hinding-hindi, Panginoon! Sapagkat hindi pa ako kailanman kumain ng anumang bagay na di-banal at marumi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: Hinding-hindi
  rationale: Malakas at natural na pagtanggi sa modernong Tagalog, na angkop sa mariing Griyegong ekspresyon.
- source_word: κύριε
  choice: Panginoon
  rationale: Pinananatili ang tuwirang pagtawag ni Pedro at ang posibleng bigat teolohikal ng titulo.
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinahahayag ang dahilan ng pagtanggi ni Pedro nang hindi binabago ang ugnayang lohikal.
- source_word: κοινὸν
  choice: itinuturing na karaniwan
  rationale: Sa kontekstong ritwal, ang κοινός ay tumutukoy sa bagay na itinuturing na hindi banal o nadungisan; nilinaw ang ganitong diwa nang hindi ito ipinapantay lamang sa ἀκάθαρτος.
- source_word: ἀκάθαρτον
  choice: marumi
  rationale: Karaniwang salin para sa ritwal na karumihan at malinaw sa konteksto ng mga pagkaing ipinagbabawal.
- source_word: καὶ
  choice: at
  rationale: Pinananatili ang koordinasyong ‘at’ ng tekstong SBLGNT sa halip na gawing ‘o.’
theological_decisions:
- issue: Ugnayan ng ‘karaniwan’ at ‘marumi’
  choice: Pinanatili ang ‘at’ sa ‘karaniwan at marumi.’
  alternative: ‘karaniwan o marumi’
  rationale: Ang ibinigay na SBLGNT ay may καὶ; kaya hindi ginawang alternatibong mga kategorya ang dalawang termino, kahit maaaring saklawin ng pahayag ang pagkaing nasa gayong kalagayan.
- issue: Pagkilala sa tinatawag na κύριε
  choice: Isinalin bilang ‘Panginoon’ nang walang karagdagang pagpapakilala.
  alternative: ‘ginoo’ o tahasang pagkilala sa nagsasalita bilang Diyos/Jesus
  rationale: Pinananatili ang posibleng referensiya at teolohikal na tensiyon ng salaysay sa halip na tahasang lutasin ito.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ang “kailanma’y” ay bahagyang pormal ngunit natural sa salaysay; ang “itinuturing na” ay tumutulong maipakita ang ritwal na diwa ng κοινός.
