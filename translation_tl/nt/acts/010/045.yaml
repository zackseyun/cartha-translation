  yaml_path: translation/nt/acts/010/045.yaml
  text: And the believers from the circumcision who had come with Peter were astonished[c][b][a], because the gift of the Holy Spirit had been poured out even on the Gentiles.
translation:
  language: tl
  text: At namangha ang mga Judiong mananampalataya[a] na sumama kay Pedro, sapagkat pati sa mga Hentil[b] ay naibuhos na[c] ang kaloob ng Banal na Espiritu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga mananampalatayang mula sa pagtutuli,” isang katawagang tumutukoy sa mga Judiong mananampalataya.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “sa mga Hentil din.” Ang Griyego ay maaaring magpahayag ng pagdaragdag, ngunit dito ay malamang na binibigyang-diin ang pagkagulat: “pati sa mga Hentil.”'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “naibuhos.” Itinatampok ng ganap na anyo sa Griyego ang natapos nang kilos na may nagpapatuloy na bunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: namangha
  rationale: Ipinahahayag nito ang matinding pagkagulat at paghanga sa natural at kasalukuyang Tagalog nang hindi gumagamit ng labis o malabong idyoma.
- source_word: οἱ ἐκ περιτομῆς πιστοὶ
  choice: ang mga mananampalatayang kabilang sa mga tuli
  rationale: Pinananatili ang pagkakakilanlan ng pangkat batay sa pagtutuli habang nililinaw sa natural na Tagalog na mga mananampalatayang Judio ang tinutukoy.
- source_word: ὅσοι συνῆλθαν τῷ Πέτρῳ
  choice: na dumating na kasama ni Pedro
  rationale: Likas na ipinahahayag sa Tagalog ang pagsama nila kay Pedro at tinutukoy kung aling mga mananampalataya ang namangha.
- source_word: καὶ ἐπὶ τὰ ἔθνη
  choice: pati sa mga Hentil
  rationale: Sa konteksto, ang ἔθνη ay mga di-Judio; ang “pati” ay nagpapahayag ng pagdaragdag at ng di-inaasahang saklaw na nagbibigay-diin sa kanilang pagkagulat.
- source_word: ἡ δωρεὰ
  choice: ang kaloob
  rationale: Malinaw at karaniwang salin ito para sa isang bagay na malayang ipinagkaloob.
- source_word: τοῦ ἁγίου πνεύματος
  choice: ng Banal na Espiritu
  rationale: Karaniwan, dignipikado, at malawak na nauunawaang modernong katawagan; pinananatili rin nito ang ugnayang genitibo ng parirala.
- source_word: ἐκκέχυται
  choice: naibuhos na
  rationale: Ang anyong ganap na balintiyak ay tumutukoy sa naganap nang pagbubuhos na may nakikitang nagpapatuloy na bunga; likas itong naipahahayag ng “naibuhos na” sa salaysay.
theological_decisions:
- issue: Pagpapakahulugan sa ἔθνη sa konteksto ng pagtanggap sa Espiritu
  choice: mga Hentil
  alternative: mga bansa
  rationale: Ang tahasang paghahambing sa kabanata ay sa pagitan ng mga mananampalatayang Judio at mga di-Judio, kaya mas tiyak ang “mga Hentil” kaysa “mga bansa.”
- issue: Aspekto ng ἐκκέχυται
  choice: naibuhos na
  alternative: ibinuhos
  rationale: Pinananatili ng “naibuhos na” ang natapos nang kilos at ang bunga nitong umiiral at nasasaksihan, nang hindi nagpapasya nang higit sa ipinahihiwatig ng Griyego.
- issue: Ugnayan sa pariralang τοῦ ἁγίου πνεύματος
  choice: kaloob ng Banal na Espiritu
  alternative: kaloob na Banal na Espiritu
  rationale: Pinananatili ng pariralang genitibo ang maaaring pag-unawa sa Espiritu bilang kaloob o bilang kaugnay na pinagmumulan nito, sa halip na tahasang lutasin ang ugnayan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignipikado, at angkop sa pampublikong pagbasa. Ginamit ang “kabilang sa mga tuli” upang mapanatili ang larawan ng orihinal nang hindi nagiging lubhang literal o alanganin; ginamit ang “pati” upang natural na maipahayag ang diin at pagkagulat.
