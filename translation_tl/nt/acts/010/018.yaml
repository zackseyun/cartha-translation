base_translation:
  language: en
  yaml_path: translation/nt/acts/010/018.yaml
  text: And they called out and asked whether Simon[a], who is called Peter, was staying here.
translation:
  language: tl
  text: Tumawag sila at nagtanong kung dito nanunuluyan[a] si Simon na tinatawag na Pedro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, tumutuloy bilang panauhin. Ang pandiwang Griego ay tumutukoy sa pananatili sa tahanan ng iba bilang panauhin.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσαντες
  choice: Tumawag sila
  rationale: Ipinahihiwatig ng aorist participle na tumawag muna sila bago nagtanong. Likas sa modernong Tagalog ang “tumawag sila” at hindi nito ipinapalagay na sumigaw sila.
- source_word: ἐπυνθάνοντο
  choice: nagtanong
  rationale: Malinaw at natural ang “nagtanong” para sa kanilang pagtatanong sa mga nasa bahay. Hindi kailangang piliting ipakita ang aspektong imperfect sapagkat malinaw na ang daloy ng salaysay.
- source_word: εἰ
  choice: kung
  rationale: Ang “kung” ang karaniwang pananda ng di-tuwirang tanong sa Tagalog.
- source_word: Σίμων ὁ ἐπικαλούμενος Πέτρος
  choice: si Simon na tinatawag na Pedro
  rationale: Pinananatili nito ang parehong pangalan at ang participial na pagkakakilanlan nang malinaw at natural.
- source_word: ἐνθάδε
  choice: doon
  rationale: Bagaman literal na deiktiko ang “dito,” natural sa di-tuwirang salaysay sa Tagalog ang “doon” para sa bahay na kinaroroonan at tinutukoy ng mga dumating.
- source_word: ξενίζεται
  choice: nanunuluyan
  rationale: Ang “nanunuluyan” ay natural na nagsasaad ng pansamantalang pananatili sa tahanan ng iba at pinananatili ang diwa ng pagiging panauhin nang hindi mabigat ang pananalita.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal ang pananalita. Ginamit ang karaniwang “Pedro” para sa Πέτρος at ang natural na “nanunuluyan” para sa konteksto ng pagtanggap bilang panauhin.
