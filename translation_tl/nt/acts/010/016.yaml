  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸀εὐθὺς ἀνελήμφθη τὸ σκεῦος εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/016.yaml
  text: This happened three times[b][a], and immediately the vessel was taken up into heaven.
translation:
  language: tl
  text: Nangyari ito nang tatlong ulit, at agad na iniakyat ang lalagyan[a] sa langit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kumot.” Ang salitang Griyego ay tumutukoy sa isang lalagyan, sisidlan, o gamit, ngunit inilalarawan ito sa mas malawak na konteksto bilang isang bagay na tulad ng malaking kumot.
    reason: lexical_alternative
  - marker: b
    text: O “sa kalangitan.” Ang salitang Griyego ay maaaring mangahulugang “kalangitan” o “langit”; mas angkop dito ang “langit” dahil sa konteksto ng pangitain.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο
  choice: ito
  rationale: Tumutukoy pabalik sa pangitaing paulit-ulit na naganap; natural at malinaw ang “ito” sa makabagong Tagalog.
- source_word: δὲ
  choice: —
  rationale: Mahinang pang-ugnay ito sa salaysay at likas na naisasama sa daloy ng pangungusap nang walang hiwalay na katumbas.
- source_word: ἐγένετο
  choice: nangyari
  rationale: Karaniwang gamit ng γίνομαι para sa isang pangyayaring naganap; ang “nangyari” ang natural na katumbas sa Tagalog.
- source_word: ἐπὶ τρίς
  choice: nang tatlong ulit
  rationale: Malinaw na ipinahihiwatig ang tatlong pag-uulit ng pangyayari sa natural na makabagong Tagalog.
- source_word: εὐθὺς
  choice: agad
  rationale: Pinananatili ang diwa ng bigla at mabilis na sumunod na kilos nang hindi nagiging mabigat ang pananalita.
- source_word: ἀνελήμφθη
  choice: iniakyat
  rationale: Pinananatili ang pasibong anyo at ang direksiyong paitaas, nang hindi tinutukoy kung sino ang gumawa ng kilos.
- source_word: τὸ σκεῦος
  choice: ang lalagyan
  rationale: Malawak ang kahulugan ng σκεῦος bilang sisidlan, lalagyan, o gamit. Hindi nito labis na tinutukoy ang anyo ng bagay, samantalang ipinakikita ng mas malawak na konteksto na tila malaking kumot iyon.
- source_word: εἰς τὸν οὐρανόν
  choice: sa langit
  rationale: Ang “sa langit” ay natural na Tagalog para sa paggalaw patungo sa itaas at sa banal na dako sa konteksto ng pangitain; nananatili sa talababa ang posibleng kahulugang “kalangitan.”
theological_decisions:
- issue: Tinutukoy ng οὐρανός sa pangitain ni Pedro
  choice: langit
  alternative: kalangitan
  rationale: Maaaring tumukoy ang οὐρανός sa langit bilang banal na dako o sa nakikitang kalangitan. Mas angkop ang “langit” sa konteksto ng isang pangitaing bumababa mula roon at muling umaakyat doon, ngunit hindi ikinukubli ang leksikal na posibilidad na “kalangitan.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang payak na ayos ng salaysay at iniwasan ang mga salitang lipas o labis na teknikal.
