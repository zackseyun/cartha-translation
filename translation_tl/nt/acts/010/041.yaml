base_translation:
  language: en
  yaml_path: translation/nt/acts/010/041.yaml
  text: not to all the people[a], but to witnesses who had been chosen beforehand by God—to us[b], who ate and drank with him after he rose from the dead.
translation:
  language: tl
  text: hindi sa buong bayan, kundi sa mga saksing noon pa man ay pinili[a] ng Diyos—sa amin, na kumain at uminom na kasama niya matapos siyang mabuhay na muli mula sa mga patay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “itinalaga na nang una.”
    reason: lexical_alternative
  - marker: b
    text: O, “matapos siyang ibangon mula sa mga patay.” Likas na maisalin dito ang Griyego bilang “matapos siyang mabuhay na muli mula sa mga patay,” bagaman may mga talata sa Bagong Tipan na gumagamit ng tahasang anyong balintiyak.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ παντὶ τῷ λαῷ
  choice: hindi sa buong bayan
  rationale: Ipinapakita ng παντί kasama ng λαῷ ang saklaw ng mga taong pinagpakitaan ni Jesus. Likas sa Filipino ang “buong bayan” at malinaw ang kaibahan nito sa limitadong pangkat ng mga saksi.
- source_word: μάρτυσι
  choice: sa mga saksi
  rationale: Sa Mga Gawa, karaniwang tumutukoy ang μάρτυς sa mga nagpapatotoo tungkol sa kanilang nakita. Tuwiran at malinaw ang “mga saksi.”
- source_word: τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ
  choice: noon pa man ay pinili ng Diyos
  rationale: Ipinahihiwatig ng perfect passive participle ang naunang pagpili ng Diyos na nananatiling mahalaga. Nililinaw ng “noon pa man” ang pagiging pauna nang hindi nagiging mabigat o di-likas ang pangungusap.
- source_word: ἡμῖν
  choice: sa amin
  rationale: Nasa apposition ito sa “mga saksi” at tiyak na kinikilala kung sino ang mga saksing tinutukoy. Ginamit ang gatlang upang malinaw ang paglilinaw.
- source_word: οἵτινες
  choice: na
  rationale: Ipinakikilala nito ang paglalarawan sa mga saksing tinukoy. Ang “na” ang pinakanatural na pang-ugnay sa estrukturang Filipino.
- source_word: συνεφάγομεν καὶ συνεπίομεν αὐτῷ
  choice: kumain at uminom na kasama niya
  rationale: Pinananatili nito ang kongkretong diwa ng magkasalong pagkain at pag-inom at ang pagbibigay-diin ng mga pandiwang may συν- sa pakikisama kay Jesus.
- source_word: μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: matapos siyang bumangon mula sa mga patay
  rationale: Temporal ang konstruksyon ng μετά at natural na intransitive ang diwa ng ἀναστῆναι rito. Ang “bumangon mula sa mga patay” ay malinaw at malapit sa anyo ng Griyego.
theological_decisions:
- issue: Paglalarawan sa muling pagkabuhay sa ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: matapos siyang bumangon mula sa mga patay
  alternative: matapos siyang ibangon mula sa mga patay
  rationale: Natural na inilalarawan ng anyong Griyego rito ang pagkilos na “bumangon.” Hindi nito itinatanggi ang pagkilos ng Diyos sa muling pagkabuhay na tahasang sinasabi sa ibang talata; pinananatili lamang nito ang pagkakahayag ng talatang ito at ang diin sa pisikal na realidad ng muling nabuhay na si Jesus.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pira-pirasong sintaktikong anyo ng talata dahil ipinagpapatuloy nito ang pandiwa at kaisipan ng naunang talata. Ang “noon pa man” ay kolokyal ngunit marangal at mas natural kaysa sa literal na “pinili nang una.”
