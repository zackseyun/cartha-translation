  text: ἀλλ’ ἐν παντὶ ἔθνει ὁ φοβούμενος αὐτὸν καὶ ἐργαζόμενος δικαιοσύνην δεκτὸς αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/035.yaml
  text: but in every nation the one who fears him and does what is righteous is acceptable to him[a][b][c].
translation:
  language: tl
  text: kundi sa bawat bansa, ang sinumang may takot sa kanya at gumagawa ng matuwid ay kalugod-lugod sa kanya[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at nagsasagawa ng katuwiran.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego na δικαιοσύνη ay karaniwang tumutukoy sa “katuwiran”; sa ilang konteksto, maaari rin itong tumukoy sa “katarungan.”
    reason: lexical_alternative
  - marker: c
    text: O “ay tinatanggap niya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  choice: kundi
  rationale: Nagpapahayag ito ng malinaw na pagsalungat sa naunang pahayag na walang itinatangi ang Diyos; natural ang “kundi” sa pagpapatuloy ng pangungusap.
- source_word: ἐν παντὶ ἔθνει
  choice: sa bawat bansa
  rationale: Tuwirang pinananatili ang saklaw na distributibo ng παντί at ang karaniwang kahulugan ng ἔθνος nang hindi ito nililimitahan sa makabagong konsepto ng etnisidad.
- source_word: ὁ φοβούμενος αὐτὸν
  choice: ang sinumang may takot sa kanya
  rationale: Likas sa modernong Tagalog at hindi nakatali sa kasarian; pinananatili ng “may takot” ang diwa ng mapitagang pagkatakot sa Diyos.
- source_word: καὶ ἐργαζόμενος δικαιοσύνην
  choice: at gumagawa ng matuwid
  rationale: Ipinahahayag ang aktibong asal ng ἐργάζομαι at pinananatili ang moral na diwa ng δικαιοσύνη sa isang maikli at likas na pariralang Tagalog.
- source_word: δικαιοσύνην
  choice: matuwid
  rationale: Sa tambalang pandiwang ito, mas natural ang “gumagawa ng matuwid” kaysa “gumagawa ng katuwiran,” habang nananatiling malinaw ang diwa ng matuwid na pagkilos.
- source_word: δεκτὸς αὐτῷ ἐστιν
  choice: ay kalugod-lugod sa kanya
  rationale: Ipinahahayag ang pagiging katanggap-tanggap o kanais-nais sa Diyos bilang panaguring pang-uri, nang hindi tahasang ipinapasok ang ideya na ang tao ay nagkakamit ng kaligtasan sa pamamagitan ng gawa.
theological_decisions:
- issue: Kung itinuturo ng talata ang kaligtasan sa pamamagitan ng mga gawa o inilalarawan ang taong tinatanggap ng Diyos nang walang pagtatangi sa bansa
  choice: 'Pinanatili ang tuwirang ugnayan sa teksto: ang may takot sa Diyos at gumagawa ng matuwid ay kalugod-lugod sa kanya.'
  alternative: Maaaring isalin nang mas malakas bilang “tinatanggap niya,” o ipaliwanag bilang pagkakamit ng pagtanggap o bilang katibayan ng pananampalatayang nagliligtas.
  rationale: Hindi nilulutas ng salin ang mas malawak na debateng teolohikal. Pinananatili nito ang diin ng konteksto sa kawalan ng pagtatangi ng Diyos at ang tunay na tensiyon ng pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “sinumang” upang maging likas at hindi nakatali sa kasarian, at “kalugod-lugod” upang mapanatili ang panaguring diwa ng δεκτός. Ang mga panghalip na tumutukoy sa Diyos ay hindi ginawang malaking titik, alinsunod sa karaniwang modernong gamit at sa ibinigay na estilo.
