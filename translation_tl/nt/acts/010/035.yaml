  terminology: Magkakatugma ang “matuwid” sa pangunahing salin at ang “katuwiran” sa talababang leksikal. Wasto ring pinananatili ng “kalugod-lugod” ang predicative na diwa ng δεκτός nang hindi ipinahihiwatig na ang pagtanggap ng Diyos ay kinita sa pamamagitan ng gawa.
