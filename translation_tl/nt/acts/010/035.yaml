  source_fidelity: 'Tumpak ang salin sa lahat ng pangunahing bahagi ng Griyego: ang ἀλλ’ ay naipahayag ng “kundi”; ang ἐν παντὶ ἔθνει ng “sa bawat bansa”; ang substantival participle ng “ang sinumang may takot sa kanya”; ang aktibong ἐργαζόμενος δικαιοσύνην ng “gumagawa ng matuwid”; at ang δεκτὸς αὐτῷ ἐστιν ng “ay kalugod-lugod sa kanya.” Hindi nito dinaragdagan o nilulutas ang teolohikal na saklaw ng pahayag.'
