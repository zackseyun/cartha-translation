translation:
  language: tl
  text: Deboto siya at may takot sa Diyos[a], kasama ang buo niyang sambahayan. Gumagawa siya ng maraming gawaing kawanggawa para sa mga tao[b], at palagi siyang nananalangin sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “may pagpipitagan sa Diyos.” Ang parirala ay maaari ring magsilbing kinikilalang paglalarawan sa isang Gentil na sumasamba sa Diyos ng Israel.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagbibigay ng maraming limos.” Ang salitang Griyego ay madalas tumukoy nang mas tiyak sa mga kaloob na ibinibigay sa mga nangangailangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβὴς
  choice: deboto
  rationale: Ipinahahayag nito ang taimtim na paggalang sa Diyos na nakikita sa pamumuhay. Ang “deboto” ay maikli, natural, at nauunawaan sa makabagong Filipino nang hindi nagdaragdag ng tiyak na katawagang panrelihiyon.
- source_word: φοβούμενος τὸν θεὸν
  choice: may takot sa Diyos
  rationale: Pinananatili nito ang biblikal na idyoma at ang diwa ng magalang na pagpipitagan, sa halip na paliitin ito sa karaniwang pagkatakot lamang.
- source_word: σὺν παντὶ τῷ οἴκῳ αὐτοῦ
  choice: kasama ang buo niyang sambahayan
  rationale: Ang οἶκος ay tumutukoy sa buong yunit ng sambahayan, hindi lamang sa gusaling tinitirhan. Natural sa Filipino ang “buo niyang sambahayan.”
- source_word: ποιῶν ἐλεημοσύνας πολλὰς
  choice: marami siyang ginagawang pagkakawanggawa
  rationale: Ipinapakita nito ang paulit-ulit at saganang pagtulong. Iniiwasan ng “pagkakawanggawa” na limitahan ang kahulugan sa maliliit na limos, habang pinananatili sa talababa ang mas tiyak na posibleng diwa ng mapagkawanggawang kaloob.
- source_word: τῷ λαῷ
  choice: para sa bayan
  rationale: Ipinahahayag ng “para sa” ang benepisyaryong gamit ng datibo. Pinananatili ng “bayan” ang kolektibo at tiyak na diwa ng λαός sa konteksto.
- source_word: δεόμενος τοῦ θεοῦ
  choice: nananalangin sa Diyos
  rationale: Sa kontekstong naglalarawan sa kanyang debosyon, malinaw at natural na ipinahahayag ng “nananalangin” ang pagdulog at paghiling sa Diyos.
- source_word: διὰ παντός
  choice: palagi
  rationale: Ipinahahayag nito ang nagpapatuloy at regular na gawain nang hindi ipinahihiwatig na literal itong walang anumang paghinto.
theological_decisions:
- issue: Paglalahad sa katawagang nauugnay sa mga Gentil na kumikilala sa Diyos ng Israel
  choice: may takot sa Diyos
  alternative: may pagpipitagan sa Diyos; isang may takot sa Diyos bilang kinikilalang katawagan
  rationale: Pinananatili ng pangunahing teksto ang karaniwang pandiwang diwa ng parirala at ang posibleng makasaysayang gamit nito bilang paglalarawan sa isang Gentil na sumasamba sa Diyos ng Israel. Hindi nito ipinapasya sa teksto ang antas ng pagiging teknikal ng katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “deboto” sa pangkalahatang kahulugan ng taimtim na relihiyosong pamumuhay, ang “sambahayan” para sa panlipunang yunit ng οἶκος, at ang “pagkakawanggawa” bilang madaling maunawaang paglalahad sa ἐλεημοσύνη. Ang ayos ay ginawang natural sa Filipino habang pinananatili ang magkakaugnay na paglalarawan sa talata.
