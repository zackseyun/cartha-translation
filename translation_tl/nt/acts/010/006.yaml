base_translation:
  language: en
  yaml_path: translation/nt/acts/010/006.yaml
  text: He is lodging with a certain Simon[a], a tanner, whose house is by the sea.
translation:
  language: tl
  text: Nakikituloy[a] siya sa isang lalaking nagngangalang Simon, isang mangungulti ng balat. Ang bahay ni Simon ay nasa tabi ng dagat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, Nanunuluyan
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενίζεται
  choice: Nakikituloy
  rationale: Ipinahihiwatig ng anyong pangkasalukuyang middle/passive na siya ay tinatanggap bilang panauhin at pansamantalang nanunuluyan sa bahay ng iba. Likas sa makabagong Tagalog ang “nakikituloy” at napapanatili nito ang diwang iyon.
- source_word: παρά τινι Σίμωνι
  choice: sa isang lalaking nagngangalang Simon
  rationale: Ang παρά na may dative ay tumutukoy sa panunuluyan sa piling o bahay ng isang tao, at ang τις ay di-tiyak. Mas natural sa Tagalog ang “isang lalaking nagngangalang Simon” kaysa sa literal ngunit matigas na “sa isang Simon.”
- source_word: βυρσεῖ
  choice: isang mangungulti ng balat
  rationale: Ang βυρσεύς ay taong nagpoproseso ng balat ng hayop upang maging katad. Pinananatili ng “mangungulti” ang tiyak na hanapbuhay, samantalang nililinaw ng “ng balat” ang salitang maaaring hindi pamilyar sa ilang mambabasa.
- source_word: ᾧ ἐστιν οἰκία
  choice: ang bahay nito
  rationale: Tinutukoy ng pariralang Griyego si Simon bilang may-ari o nakatira sa bahay. Hinati sa bagong pangungusap upang maging malinaw at natural sa Tagalog nang hindi nagdaragdag ng bagong kahulugan.
- source_word: παρὰ θάλασσαν
  choice: nasa tabi ng dagat
  rationale: Ang παρά na may accusative ay nagsasaad dito ng malapit na lokasyon. Ang “sa tabi ng dagat” ay tuwiran at karaniwang pahayag sa Tagalog.
- source_word: οὗτος
  choice: siya
  rationale: Tumutukoy ito pabalik kay Pedro sa konteksto. Ang “siya” ang natural na panghalip sa Tagalog; hindi kailangan ang mas mabigat na “ang taong ito.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nakikituloy” para sa karaniwang pananalita at ang mas tiyak na “mangungulti ng balat” para sa sinaunang hanapbuhay. Hinati sa dalawang pangungusap ang sugnay upang maiwasan ang malabong kaugnayan ng panghalip at mapanatili ang likas na daloy.
