id: ACT.10.24
reference: Acts 10:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂τῇ δὲ⸃ ἐπαύριον ⸀εἰσῆλθεν εἰς τὴν Καισάρειαν. ὁ δὲ Κορνήλιος ἦν προσδοκῶν αὐτοὺς συγκαλεσάμενος τοὺς συγγενεῖς αὐτοῦ καὶ τοὺς ἀναγκαίους φίλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/024.yaml
  text: On the next day he entered Caesarea[a]. Now Cornelius was expecting them and had called together his relatives and close friends.
translation:
  language: tl
  text: Kinabukasan, pumasok siya sa Cesarea.[a] Samantala, naghihintay sa kanila si Cornelio; tinipon na niya ang kanyang mga kamag-anak at matatalik na kaibigan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isahan ang pandiwang Griyego na isinaling “pumasok siya,” ngunit maramihan ang kasunod na panghalip na “sa kanila.” Malamang na nakatuon ang pandiwa kay Pedro bilang pangunahing tauhan, samantalang kasama sa hinihintay ni Cornelio ang mga kasama niya.
    reason: textual_variant
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Kinabukasan
  rationale: Likas at maikli itong salin ng idyomatikong panandang-panahon na tumutukoy sa sumunod na araw; naipahihiwatig ng daloy ng salaysay ang banayad na pag-uugnay ng δέ.
- source_word: εἰσῆλθεν
  choice: pumasok siya
  rationale: Pinananatili ang isahang anyo ng pandiwang Griyego at ang payak na kahulugang ‘pumasok.’
- source_word: Καισάρειαν
  choice: Cesarea
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar na Caesarea.
- source_word: ὁ δὲ Κορνήλιος
  choice: Samantala, ... si Cornelio
  rationale: Ipinakikita ng ‘Samantala’ ang banayad na paglipat ng pokus kay Cornelio nang hindi nagdaragdag ng matinding pagsalungat.
- source_word: ἦν προσδοκῶν αὐτούς
  choice: naghihintay sa kanila
  rationale: Ipinahahayag ng aspektong nagpapatuloy ang ginagawa ni Cornelio, habang pinananatili ng ‘sa kanila’ ang tahasang maramihang panghalip na αὐτούς.
- source_word: συγκαλεσάμενος
  choice: tinipon na niya
  rationale: Ipinahihiwatig ng ‘na’ na naganap na ang pagtitipon bago o habang naghihintay si Cornelio; natural ito sa makabagong salaysay sa Filipino.
- source_word: τοὺς συγγενεῖς αὐτοῦ
  choice: ang kanyang mga kamag-anak
  rationale: Direkta, malinaw, at karaniwang salin ng συγγενεῖς.
- source_word: τοὺς ἀναγκαίους φίλους
  choice: matatalik na kaibigan
  rationale: Sa pariralang ito, ang ἀναγκαῖος ay tumutukoy sa malapit o pinagkakatiwalaang mga kaibigan, hindi sa literal na ‘kinakailangan.’
