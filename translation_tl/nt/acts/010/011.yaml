base_translation:
  language: en
  yaml_path: translation/nt/acts/010/011.yaml
  text: and he sees heaven opened[a], and something like a large sheet descending, being lowered by its four corners to the earth[c][b],
translation:
  language: tl
  text: At nakita niyang bukás ang langit[a], at may isang bagay[c] na parang malaking tela na bumababa, na ibinababa sa lupa sa apat na sulok nito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “himpapawid.” Ang salitang Griyego ay maaaring tumukoy sa langit o sa himpapawid.
    reason: lexical_alternative
  - marker: b
    text: O “sa apat na dulo nito.”
    reason: lexical_alternative
  - marker: c
    text: Ang “isang bagay” ay maaari ring isaling “isang sisidlan” o “isang kagamitan”; hindi tiyak ang katawagang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: nakita niya
  rationale: Ang makasaysayang kasalukuyan sa Griyego ay likas na isinasalaysay sa aspektong naganap sa modernong Tagalog; pinananatili nitong tuwiran at malinaw ang kilos.
- source_word: οὐρανὸν ἀνεῳγμένον
  choice: bukás ang langit
  rationale: Maaaring mangahulugan ang οὐρανός na langit o himpapawid, ngunit mas angkop sa konteksto ng pangitain at paghahayag ang “langit.”
- source_word: καταβαῖνον
  choice: bumababa
  rationale: Ipinahahayag ang nagpapatuloy na kilos pababa sa natural na Tagalog.
- source_word: σκεῦός τι
  choice: may isang bagay
  rationale: Malawak at di-tiyak ang σκεῦός τι; iniiwasan ng “bagay” ang di-makatwirang pagtukoy rito bilang sisidlan o kagamitan.
- source_word: ὡς ὀθόνην μεγάλην
  choice: parang malaking kumot
  rationale: Pinananatili ng “parang” ang paghahambing. Ang “kumot” ay natural at madaling mailarawang malaking sapin ng tela, nang hindi tiyak na ipinapalagay ang materyales nito.
- source_word: τέσσαρσιν ἀρχαῖς
  choice: sa apat na sulok nito
  rationale: Bagaman ang ἀρχαί ay maaari ring tumukoy sa mga dulo, “mga sulok” ang pinakanatural para sa bagay na parang malaking kumot.
- source_word: καθιέμενον
  choice: na ibinababa
  rationale: Pinananatili ang pasibong anyo at ang hiwalay na diwa mula sa “bumababa,” nang hindi tinutukoy kung sino ang nagpapababa.
- source_word: ἐπὶ τῆς γῆς
  choice: sa lupa
  rationale: Sa konteksto ng kilos pababa, natural na ipinahahayag ng “sa lupa” ang hantungan nang hindi labis na pormal.
theological_decisions:
- issue: Kahulugan ng οὐρανός sa konteksto ng pangitain
  choice: langit
  alternative: himpapawid
  rationale: Ang pinagmumulan ng bumababang bagay ay inilalarawan sa isang pangitaing may katangian ng paghahayag; pinananatili ng “langit” ang puwersang ito nang walang idinadagdag na doktrina.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “bukás” na may tuldik upang hindi mapagkamalang tumutukoy sa susunod na araw. Pinanatili ang di-tiyak na pagkakakilanlan ng bagay at ang parehong kilos na “bumababa” at “ibinababa.”
