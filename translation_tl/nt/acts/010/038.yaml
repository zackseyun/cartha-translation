id: ACT.10.38
reference: Acts 10:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/038.yaml
  text: 'Jesus of Nazareth: how God anointed him with the Holy Spirit and with power[a]; he went about doing good and healing all who were oppressed by the devil[c][b], because God was with him.'
translation:
  language: tl
  text: Si Jesus na mula sa Nazaret—kung paano siya pinahiran ng Diyos ng Banal na Espiritu at kapangyarihan. Naglibot siya na gumagawa ng mabuti at nagpapagaling sa lahat ng inaapi ng diyablo, sapagkat ang Diyos ay kasama niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ
  choice: Si Jesus na mula sa Nazaret
  rationale: Tuwirang ipinahahayag ng ἀπό ang pinagmulan ni Jesus. Natural sa modernong Tagalog ang “mula sa Nazaret” at hindi nito dinaragdagan ang pagkakakilanlang nasa teksto.
- source_word: ὡς
  choice: kung paanong
  rationale: Ipinakikilala nito ang paliwanag tungkol kay Jesus sa siksik na kayarian ng pangungusap. Napananatili ng “kung paanong” ang paraan o salaysay na himig nang hindi ito ginagawang paghahambing lamang.
- source_word: ἔχρισεν
  choice: pinahiran
  rationale: Ito ang tuwirang katumbas ng χρίω at pinananatili ang mesiyanikong alingawngaw ng salita nang hindi isinasalin bilang paliwanag na “itinalagang Mesiyas.”
- source_word: πνεύματι ἁγίῳ καὶ δυνάμει
  choice: ng Banal na Espiritu at ng kapangyarihan
  rationale: Sa pandiwang “pinahiran,” likas sa Tagalog ang gamit ng “ng” upang ipahayag ang ipinampahid o ipinagkaloob. Pinananatiling magkahiwalay ang Banal na Espiritu at kapangyarihan gaya sa Griyego.
- source_word: διῆλθεν
  choice: naglakbay siya sa iba't ibang lugar
  rationale: Ipinahahayag nito ang palipat-lipat na ministeryo ni Jesus. Mas malinaw ito sa karaniwang mambabasa kaysa sa literal ngunit malabong “dumaan siya.”
- source_word: εὐεργετῶν
  choice: gumagawa ng mabuti
  rationale: Maikli, natural, at sapat na malawak upang saklawin ang mapagkalingang gawa na tinutukoy ng participle.
- source_word: ἰώμενος
  choice: nagpapagaling
  rationale: Tuwiran at karaniwang salin ng gawain ng pagpapagaling sa kontekstong ito.
- source_word: πάντας τοὺς καταδυναστευομένους
  choice: sa lahat ng mga pinahihirapan
  rationale: Ipinahahayag ng “pinahihirapan” ang patuloy at mapaniil na paghahari sa kanila nang hindi nililimitahan ang uri ng kanilang pagdurusa.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: ng diyablo
  rationale: Karaniwang malinaw na tawag sa personal na masamang nilalang na tinutukoy rito ng διάβολος.
- source_word: ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ
  choice: sapagkat kasama niya ang Diyos
  rationale: Pinananatili ng “sapagkat” ang sanhi o batayan ng naunang ministeryo, at natural ang “kasama niya ang Diyos” sa dignidad ng talata.
theological_decisions:
- issue: Kaugnayan ng pagpapahid kay Jesus sa kanyang pagkakakilanlan at misyon
  choice: Panatilihin ang “pinahiran” nang walang idinagdag na paliwanag.
  alternative: “Itinalaga bilang Mesiyas” o “binigyan ng kapangyarihan.”
  rationale: Ang mismong talata ay gumagamit ng wika ng pagpapahid. Pinananatili nito ang biblikal at mesiyanikong pahiwatig ngunit hindi ipinapasok sa salin ang isang paliwanag na lampas sa tahasang sinabi.
- issue: Pagtukoy sa πνεύματι ἁγίῳ
  choice: “Banal na Espiritu” bilang personal na banal na pagtukoy.
  alternative: “banal na espiritu” bilang impersonal na lakas.
  rationale: Sa Mga Gawa, ang pariralang ito ay karaniwang tumutukoy sa Banal na Espiritu, at ibinubukod pa siya rito sa “kapangyarihan.”
- issue: Lakas ng ὅτι sa huling sugnay
  choice: 'Isalin bilang sanhi: “sapagkat kasama niya ang Diyos.”'
  alternative: Mahinang pag-uugnay na “at kasama niya ang Diyos,” o “dahil” bilang mas kolokyal na anyo.
  rationale: Ibinibigay ng sugnay ang dahilan o batayan ng mabisa at mapagpagaling na ministeryo ni Jesus. Hindi nito nilulutas o binabawasan ang mas malawak na Kristolohikal na tensiyon.
- issue: Kayarian ng ὃς at kaugnayan nito kay Jesus
  choice: Gawing bagong sugnay na “naglakbay siya” pagkatapos ng tuldok-kuwit.
  alternative: Panatilihin bilang “na naglakbay,” na maaaring maging mabigat at malabo matapos ang sugnay na “kung paanong.”
  rationale: Malinaw na si Jesus ang tinutukoy ng ὃς. Ang pag-uulit ng “siya” ay natural na Tagalog at pinananatili ang kahulugan nang hindi ginagaya ang alanganing siksik na sintaks.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “Nazaret,” “Banal na Espiritu,” at “diyablo” bilang pamilyar na anyong biblikal. Ang tuldok-kuwit ay tumutulong na ipakita ang dalawang magkakaugnay na paglalarawan kay Jesus habang iniiwasan ang mabigat na magkakasunod na pantukoy.
