translation:
  language: tl
  text: Habang nakikipag-usap sa kanya si Pedro, pumasok siya at nadatnan niyang maraming taong nagkatipon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Habang nakikipag-usap sa kanya si Pedro, pumasok siya at nakita niyang maraming taong nagkatipon.” Ginagamit sa Griyego ang kasalukuyang panahunan sa pandiwang isinaling “nakita” bilang masiglang paraan ng pagsasalaysay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνομιλῶν
  choice: habang nakikipag-usap
  rationale: Ipinahahayag ng kasalukuyang pandiwaring pantukoy ang kilos na nagpapatuloy kasabay ng pagpasok; natural sa makabagong Tagalog ang “habang nakikipag-usap.”
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Sa pandiwang συνομιλέω, tinutukoy ng datibo ang kausap; ang “sa kanya” ang likas na katumbas sa Tagalog.
- source_word: εἰσῆλθεν
  choice: pumasok siya
  rationale: Ang aorist ang pangunahing kilos sa salaysay at tuwirang isinasalin ng “pumasok.”
- source_word: εὑρίσκει
  choice: nakita niyang
  rationale: Bagaman nasa historical present ang Griyego, mas natural ang aspektong naganap sa salaysay na Tagalog. Sa konteksto, ang “nakita” ay malinaw na nagpapahayag ng pagkatuklas sa mga taong naroon.
- source_word: συνεληλυθότας
  choice: nagkakatipon doon
  rationale: Ang perfect participle ay naglalarawan sa maraming taong dumating na at magkakasamang naroon. Pinananatili ng “nagkakatipon doon” ang larawan ng pagtitipon nang hindi mabigat ang pananalita.
- source_word: πολλούς
  choice: marami
  rationale: Ginagamit ang pang-uri bilang pangngalan para sa maraming tao; malinaw sa Tagalog ang “marami” ayon sa konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Idinagdag ang pangalang “Pedro” upang luminaw ang paksa sa Tagalog; walang katumbas na tahasang pangngalan sa talata ngunit siya ang paksa mula sa konteksto. Inilagay ang “doon” upang maging natural ang paglalarawan sa mga taong nagkatipon sa loob.
