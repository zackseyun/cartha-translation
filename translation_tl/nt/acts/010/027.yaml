  source_fidelity: Ang “nagkakatipon” ay nagpapahiwatig ng kasalukuyang nagaganap na pagtitipon, samantalang ang συνεληλυθότας ay perfect participle at tumutukoy sa mga taong nakapagtipon na. Ang “nadatnan niyang maraming taong nagkatipon” ay mas tumpak na naghahatid ng resultang kalagayang ito. Katanggap-tanggap ang pagtukoy kay Pedro, dahil malinaw siyang paksa sa agarang konteksto, bagaman hindi siya tahasang pinangalanan sa Griyego ng talatang ito.
  naturalness: Natural at malinaw sa makabagong Filipino ang binagong pangungusap. Ang “nadatnan niyang” ay idiomatikong katumbas ng pagpasok at pagkatuklas na naroon na ang maraming tao.
  terminology: Walang problemang pangteolohikal o pangalang pantangi. Pinananatili ang marangal ngunit di-makalumang rehistro.
