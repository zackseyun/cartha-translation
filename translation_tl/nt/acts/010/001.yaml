  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maging natural sa karaniwang mambabasa, habang pinananatili ang lahat ng impormasyong nasa Griyego. Ginamit ang 'isa siyang' upang malinaw na iugnay ang ranggo kay Cornelio.
