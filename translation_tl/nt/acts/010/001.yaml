  text: Ἀνὴρ δέ ⸀τις ἐν Καισαρείᾳ ὀνόματι Κορνήλιος, ἑκατοντάρχης ἐκ σπείρης τῆς καλουμένης Ἰταλικῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/001.yaml
  text: There was a man in Caesarea named Cornelius[a], a centurion from the cohort called the Italian Cohort[b],
translation:
  language: tl
  text: May isang lalaki sa Cesarea na nagngangalang Cornelio[a], isang senturyon mula sa pangkat ng hukbong tinatawag na Pangkat Italyano[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang lalaking nasa Cesarea.” Gumagamit ang Griyego ng di-tiyak na pananalita upang ipakilala ang isang bagong tauhan.
    reason: lexical_alternative
  - marker: b
    text: Ang “pangkat ng hukbo” ay isang yunit ng hukbong Romano. Ang “Pangkat Italyano” ay malamang na tumutukoy sa isang yunit na kaugnay ng Italia o binubuo ng mga sundalong Italyano.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: May isang lalaki
  rationale: Likas na panimulang salaysay sa Tagalog na nagpapanatili sa di-tiyak na pagpapakilala ng τις at sa tahasang panlalaking ἀνήρ. Hindi isinalin nang hiwalay ang mahinang pang-ugnay na δέ dahil hindi kailangan sa natural na daloy ng Tagalog.
- source_word: ἐν Καισαρείᾳ
  choice: sa Cesarea
  rationale: Tuwirang lokatibong salin; ginagamit ang karaniwang anyong Tagalog ng pangalan ng lugar.
- source_word: ὀνόματι Κορνήλιος
  choice: na nagngangalang Cornelio
  rationale: Natural at marangal na katumbas ng idyomang Griyego; ginagamit ang nakaugaliang anyong Tagalog ng pangalan.
- source_word: ἑκατοντάρχης
  choice: senturyon
  rationale: Tumpak at maikling katawagang pangkasaysayan para sa Romanong opisyal militar; nililinaw ng konteksto at talababa ang tungkulin.
- source_word: ἐκ σπείρης
  choice: sa pangkat ng hukbo
  rationale: Ipinahahayag ang pagiging kabilang sa Romanong yunit nang mas madaling maunawaan kaysa sa teknikal na hiram na salitang 'cohort.'
- source_word: τῆς καλουμένης Ἰταλικῆς
  choice: tinatawag na Pangkat Italyano
  rationale: Pinananatili ang καλουμένης na 'tinatawag na' at ginagawang malinaw na οἸταλική ang pangalan o pantukoy sa yunit.
