base_translation:
  language: en
  yaml_path: translation/nt/acts/010/040.yaml
  text: God raised this one on the third day and granted him to become visible[b][a],
translation:
  language: tl
  text: Ang taong ito[a] ay muling binuhay ng Diyos sa ikatlong araw, at ipinagkaloob niyang siya ay makita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “siya” o “ang lalaking ito.” May diin ang demonstratibo sa Griyego.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “ipinagkaloob niyang siya ay magpakita” o “ginawa siyang hayag.” Literal sa Griyego: “ibinigay niya na siya ay maging nakikita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: Ang taong ito
  rationale: Pinananatili nito ang diin ng nauunang demonstratibo at malinaw na tumutukoy kay Jesus, habang natural pa rin sa Filipino.
- source_word: ὁ θεὸς
  choice: ng Diyos
  rationale: Ito ang tahasang gumaganap sa pandiwang ἤγειρεν; inilagay sa karaniwang ayos ng pangungusap sa Filipino.
- source_word: ἤγειρεν
  choice: muling binuhay
  rationale: Sa konteksto ng muling pagkabuhay, malinaw at likas sa modernong Filipino ang pariralang ito, nang walang idinaragdag na paliwanag.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: sa ikatlong araw
  rationale: Tuwirang ipinapahayag ang takdang panahon nang hindi tinutukoy kung paano binilang ang mga araw.
- source_word: ἔδωκεν
  choice: niloob
  rationale: Sa kasunod na infinitive construction, ipinahihiwatig nito na ipinagkaloob o itinakda ng Diyos na mangyari ang pagpapahayag, nang hindi ginagawang di-likas ang Filipino.
- source_word: αὐτὸν
  choice: siya’y
  rationale: Karaniwang panghalip na tumutukoy kay Jesus at nagsisilbing paksa ng sugnay na nakapaloob.
- source_word: ἐμφανῆ
  choice: mahayag
  rationale: Ipinapahayag ang pagiging nakikita o lantad; ang “mahayag” ay marangal at natural sa kontekstong ito.
- source_word: γενέσθαι
  choice: mahayag
  rationale: Isinasama sa pandiwang Filipino ang diwang ‘maging hayag’ o ‘lumitaw,’ sa halip na piliting panatilihin ang hiwalay at di-likas na katumbas ng ‘maging.’
theological_decisions:
- issue: Pagkilos ng Diyos sa muling pagkabuhay
  choice: muling binuhay ng Diyos
  alternative: ibinangon ng Diyos
  rationale: Tahasan nitong pinananatili na ang Diyos ang kumilos kay Jesus sa ikatlong araw. Pinili ang “muling binuhay” upang malinaw ang konteksto ng muling pagkabuhay sa ordinaryong Filipino.
- issue: Pagpapahayag kay Jesus matapos siyang muling buhayin
  choice: niloob niyang siya’y mahayag
  alternative: ginawa niyang makita siya
  rationale: Pinananatili nito ang pagkakaiba ng muling pagbuhay at ng kasunod na pagpapakita o pagiging hayag ni Jesus. Hindi rin nito labis na nilulutas kung ang ἔδωκεν ay dapat idiing pahintulot, pagkakaloob, o pagsasagawa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “siya’y” bilang katanggap-tanggap na pinaikling anyo sa estilong pampanitikan ng Kasulatan; iniwasan ang sobrang literal ngunit di-likas na konstruksiyon.
