id: ACT.10.39
reference: Acts 10:39
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀ἡμεῖς μάρτυρες πάντων ὧν ἐποίησεν ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων ⸀καὶ Ἰερουσαλήμ· ὃν καὶ ἀνεῖλαν κρεμάσαντες ἐπὶ ξύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/039.yaml
  text: And we are witnesses of all that he did both in the land of the Jews and in Jerusalem[a]. They also put him to death by hanging him on a tree.
translation:
  language: tl
  text: At kami ay mga saksi sa lahat ng ginawa niya sa lupain ng mga Judio at sa Jerusalem. Pinatay rin nila siya sa pamamagitan ng pagbitin sa kanya sa isang punongkahoy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kahoy”; ayon sa ipinahihiwatig ng paraan ng pagpatay, “krus.” Ang salitang Griyego ay nangangahulugang “punongkahoy” o “kahoy” at malamang na umaalingawngaw sa Deuteronomio 21:23.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: mga saksi
  rationale: Karaniwan at natural itong salin sa konteksto ng patotoo, at ipinahihiwatig dito ang tuwirang pagsaksi ng mga apostol.
- source_word: πάντων ὧν ἐποίησεν
  choice: sa lahat ng ginawa niya
  rationale: Pinananatili nito ang saklaw ng πάντων at natural ang ayos sa modernong Tagalog.
- source_word: ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων
  choice: sa lupain ng mga Judio
  rationale: Ang χώρα ay maaaring tumukoy sa lupain, rehiyon, o teritoryo. Hindi ito isinaling 'Judea' upang hindi labis na tukuyin ang administratibong hangganan.
- source_word: ἀνεῖλαν
  choice: pinatay nila siya
  rationale: Tuwirang ipinapahayag ng ἀναιρέω rito ang pagkitil ng buhay; malinaw at natural ang 'pinatay' sa Tagalog.
- source_word: κρεμάσαντες ἐπὶ ξύλου
  choice: sa pamamagitan ng pagbitin sa kanya sa isang punongkahoy
  rationale: Ipinakikita ng 'sa pamamagitan ng' ang ugnayan ng participle sa pangunahing pandiwa, samantalang pinananatili ng 'punongkahoy' ang kongkretong larawan ng ξύλον at ang posibleng alusyon sa Deuteronomio 21:23.
theological_decisions:
- issue: Pagpapakahulugan sa ξύλου sa konteksto ng pagpapako kay Jesus
  choice: sa isang punongkahoy
  alternative: sa isang krus; sa kahoy
  rationale: ξύλον ang ginamit, hindi σταυρός. Pinananatili ng 'punongkahoy' ang mismong leksikal na larawan at ang malamang na alusyon sa Deuteronomio 21:23, nang hindi tahasang pinapalitan ito ng interpretatibong 'krus.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'mga Judio' bilang natural na katawagang etniko-relihiyoso, habang ang 'lupain' ay nagpapanatili ng heograpikong diwa nang hindi ito nililimitahan sa pormal na pangalan ng isang lalawigan.
