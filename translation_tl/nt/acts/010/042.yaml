id: ACT.10.42
reference: Acts 10:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ παρήγγειλεν ἡμῖν κηρύξαι τῷ λαῷ καὶ διαμαρτύρασθαι ὅτι ⸀οὗτός ἐστιν ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ κριτὴς ζώντων καὶ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/042.yaml
  text: And he commanded us to proclaim to the people and to testify solemnly that this is the one appointed by God as judge of the living and the dead[a].
translation:
  language: tl
  text: At iniutos niya sa amin na ipahayag sa bayan at taimtim na patotohanan na siya ang itinalaga ng Diyos bilang hukom ng mga buhay at mga patay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang itinakda ng Diyos na maging hukom ng mga buhay at mga patay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλεν
  choice: iniutos
  rationale: Ipinapahayag nito ang awtoritatibong tagubilin o utos, hindi lamang payak na pagtuturo.
- source_word: κηρύξαι
  choice: ipahayag
  rationale: Likas sa modernong Tagalog at angkop sa diwa ng hayagang pagpapahayag sa madla, nang hindi nililimitahan sa pormal na sermon.
- source_word: τῷ λαῷ
  choice: sa bayan
  rationale: Pinananatili ang articular at kolektibong diwa ng λαός at hindi tahasang idinaragdag ang “Israel,” na wala sa mismong talata.
- source_word: διαμαρτύρασθαι
  choice: taimtim na patotohanan
  rationale: Pinagsasama nito ang diwa ng pagpapatotoo at ang mariin o seryosong paraan nito.
- source_word: οὗτός
  choice: siya
  rationale: Bagaman mariin ang demonstrative, mas natural sa Tagalog ang “siya” sa kontekstong malinaw na si Jesus ang tinutukoy.
- source_word: ὁ ὡρισμένος
  choice: ang itinalaga
  rationale: Ipinahihiwatig ng perfect passive participle ang pagtatalaga ng Diyos na may nananatiling bisa; malinaw at kasalukuyang gamit ang “itinalaga.”
- source_word: ὑπὸ τοῦ θεοῦ
  choice: ng Diyos
  rationale: Tuwirang ipinapakita ang Diyos bilang gumaganap sa pasibong pandiwari.
- source_word: κριτὴς
  choice: Hukom
  rationale: Ang “Hukom” ang natural na pangngalang panaguri para sa tungkuling ipinagkaloob sa kanya; ginamit ang malaking titik bilang pantukoy na titulo sa kontekstong ito.
- source_word: ζώντων καὶ νεκρῶν
  choice: ng mga buhay at mga patay
  rationale: Tumpak at maringal na katumbas ng pares na genitive at pinananatili ang saklaw sa kapuwa buhay at patay.
theological_decisions:
- issue: Lakas at saklaw ng pagtatalaga ng Diyos kay Jesus bilang hukom
  choice: itinalaga ng Diyos bilang Hukom ng mga buhay at mga patay
  alternative: itinakda ng Diyos na maging Hukom ng mga buhay at mga patay
  rationale: Pinananatili ang tahasang pahayag na ang Diyos ang nagtalaga kay Jesus at na ang kanyang paghatol ay sumasaklaw sa mga buhay at mga patay, nang hindi nagdaragdag ng mas huling sistematikong pormulasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinili ang “sa bayan” upang mapanatili ang kolektibong diwa ng λαός nang hindi tahasang dinaragdagan ng “Israel.”
