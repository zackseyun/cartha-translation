  to: At sinabi ni Cornelio, “Apat na araw na ang nakalipas, sa ganito ring oras, nananalangin ako sa aking bahay noong ikasiyam na oras[a]. At narito, isang lalaki ang tumayo sa harap ko, na nakasuot ng maningning na damit.”
