id: ACT.10.30
reference: Acts 10:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὁ Κορνήλιος ἔφη· Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας ⸀ἤμην τὴν ⸀ἐνάτην προσευχόμενος ἐν τῷ οἴκῳ μου, καὶ ἰδοὺ ἀνὴρ ἔστη ἐνώπιόν μου ἐν ἐσθῆτι λαμπρᾷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/030.yaml
  text: And Cornelius said, “Four days ago, up to this hour, I was praying at the ninth hour in my house, and behold, a man stood before me in bright clothing.”
translation:
  language: tl
  text: At sinabi ni Cornelio, “Apat na araw na ang nakalipas, sa ganito ring oras, nananalangin ako sa aking bahay noong ikasiyam na oras[a]. At narito, isang lalaki ang tumayo sa harap ko, na nakasuot ng maningning na damit.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, bandang alas tres ng hapon.
    reason: cultural_note
lexical_decisions:
- source_word: ἔφη
  choice: sinabi
  rationale: Ang aorist na pambungad sa tuwirang pananalita ay likas na isinasalin sa payak na naganap na aspekto sa Filipino.
- source_word: Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας
  choice: Apat na araw na ang nakalipas, sa ganito ring oras
  rationale: Ipinahahayag nito na nangyari ang iniulat sa katulad na oras apat na araw bago ang kasalukuyang sandali; natural ito sa modernong Filipino at pinananatili ang ugnayan sa parehong oras.
- source_word: ἤμην ... προσευχόμενος
  choice: nananalangin ako
  rationale: Ipinakikita ng periphrastic imperfect ang nagpapatuloy na kilos noon; ang anyong ito ay natural sa Filipino sa loob ng salaysay.
- source_word: τὴν ἐνάτην
  choice: nang ikasiyam na oras
  rationale: Pinananatili ang sinaunang paraan ng pagtukoy sa oras sa pangunahing teksto; ipinaliliwanag sa talababa ang katumbas nito sa makabagong oras.
- source_word: ἐν τῷ οἴκῳ μου
  choice: sa aking bahay
  rationale: Tuwiran at natural na katumbas ng pisikal na lokasyong tinutukoy ng οἶκος.
- source_word: ἰδοὺ
  choice: At narito
  rationale: Pinananatili ang pantawag-pansing bisa at kasiglahan ng salaysay nang hindi tahasang idinaragdag na biglaan ang pangyayari.
- source_word: ἀνὴρ
  choice: isang lalaki
  rationale: Pinananatili ang panlalaking katawagang ginamit para sa anyong nakita ni Cornelio, nang hindi pa ito tahasang tinatawag na anghel.
- source_word: ἔστη ἐνώπιόν μου
  choice: tumayo sa harap ko
  rationale: Tuwirang ipinahahayag ang pagpuwesto ng lalaki sa harap ni Cornelio.
- source_word: ἐν ἐσθῆτι λαμπρᾷ
  choice: nakasuot ng maningning na damit
  rationale: Ipinahahayag ang maliwanag o maringal na anyo ng kasuotan sa malinaw at dignified na modernong Filipino.
theological_decisions:
- issue: Paglalahad ng τὴν ἐνάτην
  choice: ikasiyam na oras
  alternative: mga alas tres ng hapon
  rationale: Pinananatili sa pangunahing teksto ang orihinal na paraan ng pagbibilang ng oras at inilalagay sa talababa ang makabagong katumbas upang hindi mapalitan ang kontekstong pangkultura.
- issue: Pagkakakilanlan ng ἀνὴρ
  choice: isang lalaki
  alternative: isang anghel
  rationale: Inilalarawan lamang ng talata ang nakitang anyo bilang lalaki; hindi tahasang ipinapasok rito ang pagkakakilanlang maaaring mahinuha mula sa mas malawak na konteksto.
translation_notes:
  register: Modernong Filipino na natural at madaling maunawaan, ngunit may dignidad na angkop sa salaysay. Pinanatili ang sinaunang tawag sa oras at ang pantawag-pansing “narito” upang mapangalagaan ang kulay at diin ng Griyego.
