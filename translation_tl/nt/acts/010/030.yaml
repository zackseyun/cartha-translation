  source_fidelity: 'Tumpak na naihahatid ng draft ang pangunahing diwa ng Griyego: nagsalita si Cornelio, tinukoy ang apat na araw at ang kasalukuyang oras, ang patuloy niyang pananalangin sa bahay sa ikasiyam na oras, at ang lalaking tumayo sa harap niya na may maningning na kasuotan. Hindi nito idinadagdag na ang lalaki ay anghel.'
