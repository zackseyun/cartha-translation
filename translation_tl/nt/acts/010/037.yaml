  naturalness: Likas ang “Alam na alam ninyo,” ngunit magiging mas malinaw at mas natural ang tahasang “nagsimula ito” upang maiwasan ang malabong pagkakaugnay ng sugnay. Ang “ipinahayag” ay mas malapit din sa saklaw ng κηρύσσω na “proclaimed” kaysa sa “ipinangaral,” habang nananatiling angkop sa Tagalog na rehistrong biblikal.
