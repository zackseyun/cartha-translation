  text: ὑμεῖς οἴδατε τὸ γενόμενον ῥῆμα καθ’ ὅλης τῆς Ἰουδαίας, ⸀ἀρξάμενος ἀπὸ τῆς Γαλιλαίας μετὰ τὸ βάπτισμα ὃ ἐκήρυξεν Ἰωάννης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/037.yaml
  text: You yourselves know the thing that happened throughout all Judea[a], beginning from Galilee after the baptism that John proclaimed[b],
translation:
  language: tl
  text: Alam na alam ninyo ang nangyari sa buong Judea[a]. Nagsimula ito sa Galilea pagkatapos ng bautismong ipinahayag ni Juan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mensahe sa buong Judea.” Ang salitang Griyego na ῥῆμα ay maaaring mangahulugang “salita,” “mensahe,” “usapin,” o “bagay/pangyayari.”
    reason: lexical_alternative
  - marker: b
    text: Medyo alanganin ang pagkakaugnay ng salitang Griyego na isinaling “nagsimula ito,” ngunit malinaw na itinuturo nito ang Galilea bilang panimulang lugar ng tinutukoy na pangyayari o usapin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς οἴδατε
  choice: Alam na alam ninyo
  rationale: Ang tahasang panghalip na ὑμεῖς ay nagbibigay-diin. Likas sa modernong Tagalog ang pag-uulit na “alam na alam” upang maipahayag ang diin nang hindi nagiging mabigat ang parirala.
- source_word: τὸ γενόμενον ῥῆμα
  choice: ang nangyari
  rationale: Maaaring tumukoy ang ῥῆμα sa salita, mensahe, bagay, o pangyayari. Kasama ng γενόμενον at ng paglaganap nito sa isang rehiyon, natural na buod ang “ang nangyari,” habang inilalagay sa talababa ang tunay na alternatibong “mensahe.”
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: sa buong Judea
  rationale: Ipinahahayag ng κατά na may genitive ang lawak sa isang rehiyon; malinaw at likas sa Tagalog ang “sa buong Judea.”
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: na nagsimula sa Galilea
  rationale: Pinananatili ang Galilea bilang pinagmulan o panimulang lugar. Ginagawang likas sa Tagalog ang maluwag at alanganing ugnayang sintaktiko ng participle nang hindi nagdaragdag ng bagong paksa.
- source_word: μετὰ τὸ βάπτισμα
  choice: pagkatapos ng bautismo
  rationale: Temporal ang μετά na may accusative. Ang “bautismo” ang karaniwan at malinaw na katawagan sa modernong Tagalog.
- source_word: ὃ ἐκήρυξεν Ἰωάννης
  choice: ipinangaral ni Juan
  rationale: Ang κηρύσσω ay pampublikong paghahayag o pangangaral. Sa kontekstong biblikal, likas at nauunawaan ang “ipinangaral,” at si Juan ang karaniwang anyo ng pangalan sa Tagalog.
theological_decisions:
- issue: Kahulugan ng ῥῆμα sa buod ni Pedro
  choice: Isinalin sa pangunahing teksto bilang “ang nangyari,” na sumasaklaw sa hayag na mga pangyayari tungkol kay Jesus.
  alternative: “ang mensaheng lumaganap” o mas literal na “ang salitang nangyari”
  rationale: Ang konteksto ay tumutukoy sa isang bagay na nalaman sa buong Judea at nagsimula sa Galilea. Gayunman, hindi ipinagkakait ang leksikal na posibilidad na mensahe ang diin, kaya inilalahad iyon sa talababa.
- issue: Tinutukoy ng ἀρξάμενος
  choice: Iniugnay sa kabuuang pangyayari sa pamamagitan ng “na nagsimula sa Galilea.”
  alternative: Panatilihin ang isang maluwag na pariralang “nagsisimula sa Galilea,” o unawaing may ipinahihiwatig na “ito ay nagsimula.”
  rationale: Masculine ang participle samantalang neuter ang ῥῆμα, kaya alanganin ang sintaks. Malinaw naman ang panimulang lokasyon; ang salin ay nagpapakinis sa Tagalog ngunit hindi nagpapasya nang higit sa hinihingi ng diwa.
- issue: “Bautismong ipinangaral” bilang layon ng κηρύσσω
  choice: 'Pinanatili ang tuwirang ugnayan: “bautismong ipinangaral ni Juan.”'
  alternative: “pagkatapos ipangaral ni Juan ang bautismo” o “pagkatapos ng bautismong ipinahayag ni Juan”
  rationale: Ang relative pronoun ὃ ay tuwirang tumutukoy sa βάπτισμα. Hindi nililinaw kung ritwal, panawagan, o buong ministeryo ni Juan ang nasa isip nang higit sa sinasabi ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Alam na alam ninyo” upang mapanatili ang diin ng tahasang ὑμεῖς; pinili ang “ang nangyari” sa halip na mabigat na “ang bagay na nangyari.” Ang kuwit sa hulihan ay pinanatili dahil nagpapatuloy ang pangungusap sa kasunod na talata.
