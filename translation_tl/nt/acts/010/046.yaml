  text: ἤκουον γὰρ αὐτῶν λαλούντων γλώσσαις καὶ μεγαλυνόντων τὸν θεόν. τότε ⸀ἀπεκρίθη Πέτρος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/046.yaml
  text: 'For they were hearing them speaking in tongues and magnifying God[a]. Then Peter answered:'
translation:
  language: tl
  text: 'Sapagkat naririnig nila silang nagsasalita ng mga wika[a] at dumadakila sa Diyos. Pagkatapos ay sumagot si Pedro:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga dila.” Maaaring tumukoy ang salitang Griyego sa mga dila o mga wika; hindi nilulutas ng parirala rito kung ano ang tiyak na uri ng pananalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουον
  choice: naririnig nila
  rationale: Ipinahihiwatig ng aspektong imperpekto ang nagpapatuloy na pakikinig; natural itong naipapahayag sa Filipino sa anyong “naririnig nila.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag o batayan para sa naunang pahayag; malinaw at marangal na pang-ugnay ang “sapagkat.”
- source_word: αὐτῶν
  choice: ang mga iyon
  rationale: Pinananatili ang panghalip at ang pagtukoy nito sa mga taong kababanggit lamang, nang hindi ipinapasok sa teksto ang interpretatibong katawagang “mga Hentil.”
- source_word: λαλούντων γλώσσαις
  choice: nagsasalita ng mga wika
  rationale: Likas sa Filipino ang “nagsasalita ng mga wika,” habang pinananatili ng “mga wika” ang saklaw ng γλώσσαις nang hindi tiyakang nilulutas ang uri ng pananalita.
- source_word: μεγαλυνόντων
  choice: dumadakila
  rationale: Ipinahahayag ng “dumadakila” ang pagpupuri at pagkilala sa kadakilaan ng Diyos, malapit sa diwa ng μεγαλύνω at natural sa makabagong Filipino.
- source_word: τὸν θεόν
  choice: sa Diyos
  rationale: Karaniwang salin ng tuwirang layon, na ginagamit sa paraang hinihingi ng pandiwang Filipino na “dumadakila.”
- source_word: τότε
  choice: Pagkatapos ay
  rationale: Minamarkahan nito ang kasunod na pangyayari sa salaysay sa natural na Filipino.
- source_word: ἀπεκρίθη
  choice: sumagot
  rationale: Tuwirang katumbas ng ἀποκρίνομαι ang “sumagot”; maaari itong tumukoy sa pagtugon sa isang sitwasyon kahit walang tahasang naunang tanong.
- source_word: Πέτρος
  choice: Pedro
  rationale: Karaniwang anyong Filipino ng pangalang Πέτρος.
theological_decisions:
- issue: Kahulugan ng γλώσσαις sa konteksto ng pananalitang dulot ng Espiritu
  choice: mga wika
  alternative: mga dila
  rationale: Maaaring tumukoy ang γλῶσσα sa pisikal na dila o sa wika, at ang parirala ay naging katawagan din sa natatanging pananalita. Pinili ang natural na “mga wika” sa pangunahing teksto, ngunit nililinaw sa talababa na hindi nito nilulutas kung mga kilalang wika o ibang uri ng pananalita ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang arkaikong “nang magkagayo’y” at ang interpretatibong pagdaragdag ng “mga Hentil.”
