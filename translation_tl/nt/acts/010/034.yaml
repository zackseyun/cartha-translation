id: ACT.10.34
reference: Acts 10:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀνοίξας δὲ Πέτρος τὸ στόμα εἶπεν· Ἐπ’ ἀληθείας καταλαμβάνομαι ὅτι οὐκ ἔστιν προσωπολήμπτης ὁ θεός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/034.yaml
  text: Then Peter opened his mouth and said[b][a], “Truly I understand that God is not one who shows partiality,”
translation:
  language: tl
  text: At ibinuka ni Pedro ang kanyang bibig at sinabi, “Tunay ngang nauunawaan ko[a] na ang Diyos ay hindi nagtatangi ng tao[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “talagang natatalos ko” o “sa katotohanan ay nauunawaan ko.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hindi tagatanggap ng mukha,” isang idyomang nangangahulugang hindi kumikiling o nagtatangi batay sa pagkakakilanlan o katayuan ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνοίξας ... τὸ στόμα
  choice: ibinuka ... ang kanyang bibig
  rationale: Pinananatili ang Semitikong idyoma at ang pormal na bigat ng pambungad, habang nananatiling malinaw sa makabagong Tagalog.
- source_word: δὲ
  choice: At
  rationale: Nagsisilbi itong pang-ugnay sa pagpapatuloy ng salaysay; natural dito ang “At” nang hindi dinaragdagan ng tiyak na temporal na diwa.
- source_word: Ἐπ’ ἀληθείας
  choice: Tunay ngang
  rationale: Ipinahahayag nito ang katiyakan at taimtim na pagkilala ni Pedro sa katotohanang kanyang sinasabi.
- source_word: καταλαμβάνομαι
  choice: nauunawaan ko
  rationale: Ipinapahayag ng pandiwa ang pagkaunawa o pagkatalos. Hindi idinagdag ang “ngayon” sapagkat hindi ito tahasang nasa Griyego.
- source_word: προσωπολήμπτης
  choice: nagtatangi ng tao
  rationale: Likas na Tagalog na paglalahad ng taong humahatol o kumikiling batay sa panlabas na pagkakakilanlan o katayuan; pinananatili ang personal na saklaw ng tambalang salitang Griyego.
- source_word: ὁ θεός
  choice: ang Diyos
  rationale: Karaniwang katumbas ng θεός at malinaw na paksa ng pahayag.
theological_decisions:
- issue: Paglalahad sa kawalan ng pagtatangi ng Diyos nang hindi nililimitahan ang kahulugan sa isang sistemang teolohikal
  choice: ang Diyos ay hindi nagtatangi ng tao
  alternative: ang Diyos ay walang kinikilingan; ang Diyos ay hindi nagpapakita ng paboritismo
  rationale: Tapat ito sa pahayag tungkol sa pagkilos ng Diyos nang walang pagtatangi batay sa tao, lalo na sa konteksto ng mga bansa, nang hindi inuunahan o nilulutas ang paliwanag ng kasunod na mga talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Sadyang pinanatili ang idyomang “ibinuka ... ang bibig” dahil nauunawaan ito at nagdadala ng pormal na bigat; ipinaliwanag sa talababa ang di-literal na kahulugan ng προσωπολήμπτης.
