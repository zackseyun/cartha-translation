  text: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον, συναντήσας αὐτῷ ὁ Κορνήλιος πεσὼν ἐπὶ τοὺς πόδας προσεκύνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/025.yaml
  text: And when Peter entered[a], Cornelius met him and fell at his feet and paid him homage.
translation:
  language: tl
  text: Nang pumasok si Pedro,[a] sinalubong siya ni Cornelio at nagpatirapa sa paanan niya at nagbigay-pugay sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumamba sa kanya.” Ang pandiwang Griego ay maaaring mangahulugang sumamba o magpatirapa bilang pagpaparangal, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον
  choice: Nang papasok na si Pedro
  rationale: Likas na salaysay sa modernong Tagalog ang pariralang ito at malinaw nitong ipinapahayag ang pangyayaring kasabay ng pagpasok ni Pedro. Ang aspektong “papasok na” ay umaangkop sa pagsalubong ni Cornelio sa mismong pagdating niya.
- source_word: συναντήσας αὐτῷ
  choice: sinalubong siya
  rationale: Sa konteksto ng pagdating ni Pedro, mas natural at tiyak ang “sinalubong” kaysa sa pangkalahatang “nakipagkita,” at pinananatili nito ang aktibong pagharap ni Cornelio sa kanya.
- source_word: πεσὼν ἐπὶ τοὺς πόδας
  choice: nagpatirapa sa paanan niya
  rationale: Ipinahahayag ng “nagpatirapa” ang pisikal na pagbagsak at mababang tindig, samantalang malinaw na tinutukoy ng “sa paanan niya” ang posisyon ni Cornelio kay Pedro.
- source_word: προσεκύνησεν
  choice: nagbigay-galang sa kanya
  rationale: Maaaring tumukoy ang προσκυνέω sa pagsamba o sa pagpapatirapa bilang labis na paggalang. Pinananatili ng “nagbigay-galang” ang kilos ng pagpupugay nang hindi agad nilulutas ang tanong kung itinuring ni Cornelio na banal si Pedro; inilalahad sa talababa ang mas matinding alternatibo.
theological_decisions:
- issue: Ang kahulugan ng προσκυνέω na nakatuon kay Pedro
  choice: nagbigay-galang sa kanya
  alternative: sumamba sa kanya
  rationale: Malawak ang saklaw ng pandiwa, mula sa pagpapatirapa o pagpupugay hanggang sa pagsamba. Dahil agad na tinanggihan ni Pedro ang kilos sa talata 26 sa pagsasabing tao rin siya, ipinakikita ng pangunahing salin ang matinding paggalang nang hindi ipinapalagay na ang kilos ay wastong pagsambang ukol sa Diyos. Gayunman, tunay na posibleng leksikal ang “sumamba,” kaya pinananatili ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Cornelio” bilang karaniwang Tagalog na anyo ng pangalan at ang “nagpatirapa” upang mailarawan nang malinaw ang kilos nang hindi nagiging labis na teknikal.
