  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τούτῳ πάντες οἱ προφῆται μαρτυροῦσιν, ἄφεσιν ἁμαρτιῶν λαβεῖν διὰ τοῦ ὀνόματος αὐτοῦ πάντα τὸν πιστεύοντα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/043.yaml
  text: All the prophets testify about him that everyone who believes in him receives forgiveness of sins through his name[a].
translation:
  language: tl
  text: Ang lahat ng propeta ay nagpapatotoo tungkol sa kanya[a] na ang bawat sumasampalataya sa kanya ay tumatanggap ng kapatawaran ng mga kasalanan sa pamamagitan ng kanyang pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sa kanya ay nagpapatotoo ang lahat ng propeta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: tungkol sa kanya
  rationale: Ang datibong demonstratibo na kaugnay ng μαρτυροῦσιν ay likas na tumutukoy sa taong siyang paksa ng patotoo. Pinananatili ng “tungkol sa kanya” ang sanggunian kay Jesus nang hindi nagdaragdag ng paliwanag.
- source_word: πάντες οἱ προφῆται
  choice: ang lahat ng propeta
  rationale: Tuwirang ipinapahayag nito ang kabuuang saklaw ng patotoong propetiko at natural ito sa makabagong Filipino.
- source_word: μαρτυροῦσιν
  choice: nagpapatotoo
  rationale: Pinananatili nito ang pampatotoo o pang-ebidensiyang lakas ng pandiwa at karaniwang nauunawaan sa Filipino.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: kapatawaran sa mga kasalanan
  rationale: Ito ang natural at nakaugaliang katumbas ng parirala sa Bagong Tipan, at malinaw nitong ipinahahayag ang pagpapatawad sa kasalanan.
- source_word: λαβεῖν
  choice: tumatanggap
  rationale: Bagaman pawatas sa Griyego, nakapaloob ito sa nilalaman ng patotoo; ang pandiwang “tumatanggap” ay natural sa Filipino at nagpapanatili sa pangkalahatang pahayag.
- source_word: διὰ τοῦ ὀνόματος αὐτοῦ
  choice: sa pamamagitan ng kanyang pangalan
  rationale: Pinananatili nito ang biblikal na idyoma at ang diwa ng pamamagitan o kaparaanang nakasalig sa persona at awtoridad ni Jesus, nang hindi tahasang ipinapalit ang interpretasyong “awtoridad.”
- source_word: πάντα τὸν πιστεύοντα
  choice: ang bawat sumasampalataya
  rationale: Ang panlalaking anyong isahan sa Griyego ay pangkalahatan at distributibo, hindi limitado sa mga lalaki. Ang “bawat sumasampalataya” ay tumpak at likas sa Filipino.
- source_word: εἰς αὐτόν
  choice: sa kanya
  rationale: Kasama ng πιστεύω, ipinahahayag ng εἰς ang pananampalataya o pagtitiwalang nakatuon sa isang persona. Ang “sumasampalataya sa kanya” ang natural na katumbas sa Filipino.
theological_decisions:
- issue: Saklaw at kaugnayan ng kapatawaran, pananampalataya, at pangalan ni Jesus
  choice: Ang bawat sumasampalataya kay Jesus ay tumatanggap ng kapatawaran sa mga kasalanan sa pamamagitan ng kanyang pangalan.
  alternative: Maaaring palawakin ang pahayag gamit ang mas tiyak na sistematikong paliwanag tungkol sa paraan ng kaligtasan.
  rationale: Pinananatili ng salin ang mismong ugnayang ipinahayag ng teksto—si Jesus, pananampalataya, at kapatawaran—nang hindi nagdaragdag ng natatanging pormulang doktrinal.
- issue: Pangkalahatang panlalaking participle
  choice: ang bawat sumasampalataya
  alternative: bawat lalaking sumasampalataya
  rationale: Ang panlalaking participle ay ginagamit nang pangkalahatan at hindi nagpapahiwatig na mga lalaki lamang ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagpapatotoo” upang mapanatili ang bigat ng μαρτυροῦσιν, at “sa pamamagitan ng kanyang pangalan” upang hindi mawala ang biblikal na idyoma o mapalitan ito ng mas makitid na pagpapakahulugan.
