  text: εἶδεν ἐν ὁράματι φανερῶς ὡσεὶ ⸀περὶ ὥραν ἐνάτην τῆς ἡμέρας ἄγγελον τοῦ θεοῦ εἰσελθόντα πρὸς αὐτὸν καὶ εἰπόντα αὐτῷ· Κορνήλιε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/003.yaml
  text: He saw clearly in a vision[a], about the ninth hour of the day, an angel of God coming in to him and saying to him[b], “Cornelius.”
translation:
  language: tl
  text: Nakita niya nang malinaw[a] sa isang pangitain, bandang ikasiyam na oras ng araw[b], ang isang anghel ng Diyos na pumasok sa kinaroroonan niya at nagsabi sa kanya, “Cornelio.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang maliwanag.”
    reason: lexical_alternative
  - marker: b
    text: Iyon ay bandang alas tres ng hapon ayon sa makabagong pagbibilang ng oras.
    reason: cultural_note
lexical_decisions:
- source_word: εἶδεν
  choice: nakita
  rationale: Ang aorist indicative ng ὁράω ay tuwirang nagsasalaysay ng isang pangyayaring nakita; pinananatili ng “nakita” ang kongkretong karanasan sa pangitain.
- source_word: ἐν ὁράματι
  choice: sa isang pangitain
  rationale: Ang ὅραμα ay isang pangitain o sobrenatural na tanawin. Karaniwan, malinaw, at hindi labis na nagpapakahulugan ang “sa isang pangitain.”
- source_word: φανερῶς
  choice: malinaw
  rationale: Ipinahihiwatig ng pang-abay na ang nakita ay hayag at tiyak, hindi malabo. Natural sa modernong Tagalog ang “malinaw.”
- source_word: ὡσεὶ περὶ ὥραν ἐνάτην τῆς ἡμέρας
  choice: nang bandang ikasiyam na oras ng araw
  rationale: Pinananatili ang sinaunang paraan ng pagbibilang ng oras; ang “bandang” ay likas na nagpapahayag ng pagtatantiya sa ὡσεὶ περὶ.
- source_word: ἄγγελον τοῦ θεοῦ
  choice: isang anghel ng Diyos
  rationale: Sa konteksto ng pangitain, ang ἄγγελος ay isang makalangit na sugo, kaya mas tiyak ang “anghel” kaysa sa pangkalahatang “sugo.”
- source_word: εἰσελθόντα πρὸς αὐτὸν
  choice: na pumasok sa kinaroroonan niya
  rationale: Isinasalin nito ang kilos ng pagpasok patungo sa presensiya ni Cornelio sa natural na Tagalog nang hindi nagdaragdag ng tiyak na uri ng silid o gusali.
- source_word: καὶ εἰπόντα αὐτῷ
  choice: at nagsabi sa kanya
  rationale: Bagaman participle ang anyong Griyego, ang finite na “nagsabi” ay mas natural sa Tagalog at malinaw na kasunod na kilos ng anghel.
- source_word: Κορνήλιε
  choice: Cornelio
  rationale: Ito ang nakaugaliang anyong Tagalog ng pangalang Κορνήλιος; ipinakikita ng kuwit at tuwirang pananalita ang gamit na pantawag.
theological_decisions:
- issue: Kalikasan ng ἄγγελος sa konteksto
  choice: makalangit na anghel
  alternative: taong sugo
  rationale: Ang pangyayari ay tahasang nagaganap sa isang pangitain at ang nilalang ay tinawag na “ng Diyos,” kaya ang makalangit na anghel ang payak na diwa rito. Walang idinagdag na paliwanag tungkol sa kalikasan o ranggo nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili sa pangunahing teksto ang “ikasiyam na oras” para maging lantad ang sinaunang paraan ng pagbibilang, habang nasa talababa ang makabagong katumbas. Inilagay ang mga pananda ng talababa sa mismong mga pariralang kanilang ipinaliliwanag.
