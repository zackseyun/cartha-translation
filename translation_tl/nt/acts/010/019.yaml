  source_fidelity: Tapat ang salin sa Griyego. Ang “Habang pinag-iisipan pa ni Pedro ang pangitain” ay sapat na nagpapahayag ng nagpapatuloy na masusing pagninilay sa διενθυμουμένου περὶ τοῦ ὁράματος. Ang “Espiritu,” “mga lalaki,” at “naghahanap sa iyo” ay tumutugma sa τὸ πνεῦμα, ἄνδρες, at ζητοῦντές σε nang walang di-kinakailangang dagdag.
  naturalness: Likas at malinaw ang modernong Tagalog. Ang “Tingnan mo” ay isang buhay at angkop na pantawag-pansin para sa ἰδού; ang “may mga lalaking naghahanap sa iyo” ay natural na paraan upang ipahayag ang nominative na pangkat sa Tagalog.
  terminology: Ang “pangitain” at “Espiritu” ay angkop na marangal ngunit karaniwang bokabularyong biblikal. Tama ang pagpapanatili sa “mga lalaki,” sapagkat tiyak na panlalaki ang ἄνδρες sa kontekstong ito. Hindi idinaragdag ng salin ang “Banal,” na wala sa mismong talata.
