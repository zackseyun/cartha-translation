  text: τοῦ δὲ Πέτρου διενθυμουμένου περὶ τοῦ ὁράματος εἶπεν ⸂αὐτῷ τὸ πνεῦμα⸃· Ἰδοὺ ⸀ἄνδρες ⸀ζητοῦντές σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/019.yaml
  text: While Peter was still pondering the vision, the Spirit said to him, “Look, men are seeking you.”
translation:
  language: tl
  text: Habang pinag-iisipan pa ni Pedro ang pangitain, sinabi sa kanya ng Espiritu, “Tingnan mo, may mga lalaking naghahanap sa iyo[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hinahanap ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διενθυμουμένου
  choice: pinag-iisipan pa
  rationale: Ipinahihiwatig ng pandiwaring Griyego ang patuloy at masusing pag-iisip. Likas sa modernong Tagalog ang “pinag-iisipan pa” at malinaw nitong ipinapakita na abala pa si Pedro sa pag-unawa sa pangitain.
- source_word: περὶ τοῦ ὁράματος
  choice: ang pangitain
  rationale: Sa Tagalog, natural na tuwirang gawing layon ng “pinag-iisipan” ang “pangitain”; nananatili ang diwa ng pag-iisip tungkol dito.
- source_word: τὸ πνεῦμα
  choice: ang Espiritu
  rationale: Sa konteksto ng Mga Gawa 10, tumutukoy ito sa banal na Espiritung gumagabay kay Pedro. Hindi idinagdag ang “Banal” sapagkat walang ἅγιον sa talata.
- source_word: εἶπεν αὐτῷ
  choice: sinabi sa kanya
  rationale: Malapit ito sa anyo ng Griyego at natural sa kasalukuyang Tagalog.
- source_word: Ἰδοὺ
  choice: Tingnan mo
  rationale: Ginagamit ang ἰδού upang itawag ang pansin sa kasunod na pahayag. Napananatili ng “Tingnan mo” ang puwersang ito nang hindi gumagamit ng makalumang pananalita.
- source_word: ἄνδρες
  choice: mga lalaki
  rationale: Ang ἀνήρ ay tumutukoy rito sa mga lalaking nasa hustong gulang, kaya hindi ito ginawang pangkalahatang “mga tao.”
- source_word: ζητοῦντές σε
  choice: naghahanap sa iyo
  rationale: Karaniwang kahulugan ng ζητέω sa kontekstong ito ang aktibong paghahanap sa isang tao. Natural ang pariralang ito sa Tagalog at pinananatili ang patuloy na aspekto ng pandiwari.
theological_decisions:
- issue: Ang tinutukoy ng τὸ πνεῦμα
  choice: Ang “Espiritu” ay ang banal na Espiritung nagsasalita kay Pedro.
  alternative: Isang di-tiyak na espiritu o panloob na espirituwal na udyok.
  rationale: Sa daloy ng Mga Gawa 10, ang nagsasalita ang Espiritung mula sa Diyos na gumagabay sa misyon ni Pedro. Ang “Espiritu” ay nagpapanatili nito nang hindi idinaragdag sa teksto ang salitang “Banal.”
- issue: Kasarian sa ἄνδρες
  choice: mga lalaki
  alternative: mga tao; mga bisita
  rationale: Tiyak na panlalaki ang ἀνήρ sa talatang ito. Kaya pinanatili ang kasarian sa halip na gawing neutral.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pangitain” at “Espiritu” bilang pamilyar na bokabularyong biblikal, ngunit iniwasan ang makalumang katumbas ng ἰδού. Ang “pa” ay nagpapahayag ng nagpapatuloy na pagninilay sa loob ng sugnay na “habang,” hindi ng hiwalay na teolohikong pagpapakahulugan.
