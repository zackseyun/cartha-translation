id: ACT.10.32
reference: Acts 10:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πέμψον οὖν εἰς Ἰόππην καὶ μετακάλεσαι Σίμωνα ὃς ἐπικαλεῖται Πέτρος· οὗτος ξενίζεται ἐν οἰκίᾳ Σίμωνος βυρσέως παρὰ ⸀θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/032.yaml
  text: Therefore send to Joppa and summon Simon[a], who is called Peter. He is lodging in the house of Simon, a tanner[b], by the sea.
translation:
  language: tl
  text: Kaya magsugo ka sa Joppa at ipatawag mo si Simon[a], na tinatawag na Pedro. Siya ay nakikituloy sa bahay ni Simon na mangungulti ng balat[b], sa tabi ng dagat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipasundo mo si Simon”; ang pandiwang Griyego ay tumutukoy sa pagpapatawag sa isang tao upang pumunta sa nagpatawag.
    reason: lexical_alternative
  - marker: b
    text: Ang “mangungulti ng balat” ay manggagawang nagpoproseso ng balat ng hayop upang maging katad; maaari ring isalin na “manggagawa ng katad.”
    reason: cultural_clarification
lexical_decisions:
- source_word: πέμψον οὖν εἰς Ἰόππην
  choice: Kaya magsugo ka sa Joppa
  rationale: Ipinapahayag ng “kaya” ang ugnayang lohikal ng οὖν, at natural na utos sa Filipino ang “magsugo ka” para sa pagpapadala ng mga mensahero.
- source_word: μετακάλεσαι
  choice: ipatawag mo
  rationale: Tumpak at likas na ipinahihiwatig ng “ipatawag” ang pagpapatawag sa isang tao upang pumunta sa nagsasalita.
- source_word: Σίμωνα ὃς ἐπικαλεῖται Πέτρος
  choice: si Simon, na tinatawag na Pedro
  rationale: Pinananatili nito ang tuwirang pagkilala sa ibang pangalang gamit kay Simon nang hindi nagdaragdag ng kahulugang wala sa Griyego.
- source_word: ξενίζεται
  choice: nakikituloy
  rationale: Ipinahihiwatig nito na si Pedro ay panauhing pinatutuloy sa bahay ng iba, na siyang diwa ng pandiwang Griyego.
- source_word: ἐν οἰκίᾳ Σίμωνος βυρσέως
  choice: sa bahay ni Simon na tagapagbilad ng balat
  rationale: Pinananatili ang tahasang pagbanggit sa bahay at inilalarawan ang hanapbuhay ni Simon sa paraang mauunawaan ng karaniwang mambabasa.
- source_word: παρὰ θάλασσαν
  choice: sa tabi ng dagat
  rationale: Natural na katumbas ito ng lokasyong nasa gilid o malapit sa dagat.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “nakikituloy” upang natural na maipahayag ang pagtanggap kay Pedro bilang panauhin, at ang “tagapagbilad ng balat” upang makilala ang tradisyonal na hanapbuhay nang hindi gumamit ng malabong hiram na salita.
