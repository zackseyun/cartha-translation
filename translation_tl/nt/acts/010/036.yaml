  text: τὸν λόγον ⸀ὃν ἀπέστειλεν τοῖς υἱοῖς Ἰσραὴλ εὐαγγελιζόμενος εἰρήνην διὰ Ἰησοῦ Χριστοῦ· οὗτός ἐστιν πάντων κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/036.yaml
  text: the message that he sent to the sons of Israel[c][b][a], proclaiming peace through Jesus the Messiah—he is Lord of all.
translation:
  language: tl
  text: ang mensaheng ipinadala niya sa mga anak ng Israel[a], na nagpapahayag ng mabuting balita ng kapayapaan sa pamamagitan ni Jesus na Mesiyas[b]—siya mismo[c] ang Panginoon ng lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa sambayanan ng Israel.” Literal na “sa mga anak ng Israel.”
    reason: lexical_alternative
  - marker: b
    text: 'Griyego: “Jesus Cristo”; ang Cristo ay titulong nangangahulugang “Mesiyas.”'
    reason: alternative_reading
  - marker: c
    text: 'O, “siya ang Panginoon ng lahat.” May diin ang demonstratibo sa Griyego: “ang isang ito ang Panginoon ng lahat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: ang mensahe
  rationale: Sa konteksto, tumutukoy ang λόγος sa nilalaman ng pahayag na ipinadala ng Diyos, kaya mas likas at malinaw ang “mensahe” kaysa “salita.”
- source_word: ὃν ἀπέστειλεν
  choice: na ipinadala niya
  rationale: Pinananatili nito ang kaugnayan ng sugnay sa “mensahe.” Ang tinutukoy ng “niya” ay ang Diyos ayon sa mas malawak na pangungusap.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: sa mga anak ng Israel
  rationale: Tuwirang pinananatili ang tradisyonal at kolektibong katawagan ng Griyego para sa bayan ng Israel.
- source_word: εὐαγγελιζόμενος
  choice: nang ipahayag niya ang mabuting balita
  rationale: Ipinahahayag ng pandiwari hindi lamang ang pangkalahatang pagpapahayag kundi ang pagdadala ng mabuting balita; ginawang tahasang sugnay upang maging natural sa Filipino.
- source_word: εἰρήνην
  choice: ng kapayapaan
  rationale: Ang “kapayapaan” ang tuwirang katumbas at maaaring saklawin ang pakikipagkasundo at kabutihang kalagayan nang hindi pinalalawak ang teksto.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: sa pamamagitan ni Jesus na Mesiyas
  rationale: Pinananatili ang gamit na instrumental ng διά at isinasalin ang Χριστός bilang titulong “Mesiyas” sa halip na ituring lamang na bahagi ng pangalan.
- source_word: οὗτός
  choice: siya mismo
  rationale: Natural na ipinahahayag sa Filipino ng “siya mismo” ang diin ng demonstratibong οὗτός nang hindi gumagamit ng alanganing literal na “ang isang ito.”
- source_word: πάντων κύριος
  choice: ang Panginoon ng lahat
  rationale: Tuwirang ipinahahayag nito ang pangkalahatang saklaw ng paghahari at awtoridad na nasa genitibong πάντων.
theological_decisions:
- issue: Paglilipat ng Χριστοῦ sa Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  alternative: Jesucristo
  rationale: Gumaganap dito ang Χριστός bilang titulo. Ang “Mesiyas” ay nagpapanatili sa titular at mesiyanikong diwa sa halip na gawin itong tila apelyido.
- issue: Paglilipat ng κύριος sa πάντων κύριος
  choice: Panginoon
  alternative: Pinuno
  rationale: Pinananatili ng “Panginoon” kapwa ang awtoridad at bigat ng pahayag tungkol kay Jesus; ang “Pinuno” ay mas makitid at maaaring magpahina sa diwa.
- issue: Diin ng οὗτός ἐστιν πάντων κύριος
  choice: siya mismo ang Panginoon ng lahat
  alternative: siya ang Panginoon ng lahat
  rationale: Ipinakikita ng “mismo” ang diin ng demonstratibo sa mismong si Jesus, nang hindi nagdaragdag ng paliwanag na wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong bahagi ng mas mahabang pangungusap sa konteksto ng Mga Gawa 10:34–37, kaya nagsisimula sa “ang mensahe” sa halip na magdagdag ng hiwalay na “Ito.” Lahat ng talababa ay may katumbas na pananda sa pangunahing teksto.
