id: ACT.10.5
reference: Acts 10:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ νῦν πέμψον ⸂ἄνδρας εἰς Ἰόππην⸃ καὶ μετάπεμψαι Σίμωνά ⸂τινα ὃς ἐπικαλεῖται Πέτρος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/005.yaml
  text: And now send men to Joppa and summon a certain Simon who is called Peter[a].
translation:
  language: tl
  text: At ngayon, magsugo ka ng mga lalaki sa Joppa at ipasundo mo ang isang Simon na tinatawag na Pedro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang lalaking nagngangalang Simon, na kilala bilang Pedro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay na καὶ at ang panandang pamanahon na νῦν, at likas ang daloy nito sa modernong Tagalog.
- source_word: πέμψον
  choice: magsugo ka
  rationale: Tuwirang pautos na angkop sa pagpapadala ng mga tao para sa isang gawain; mas tiyak dito kaysa sa payak na 'magpadala.'
- source_word: ἄνδρας
  choice: mga lalaki
  rationale: Tahasang tumutukoy ang ἀνήρ sa mga lalaking isinugo; hindi ginawang 'mga mensahero' upang maiwasang magdagdag ng tungkuling hindi tahasang sinabi.
- source_word: εἰς Ἰόππην
  choice: sa Joppa
  rationale: Likas na Tagalog na pagpapahayag ng direksiyon patungo sa isang lugar.
- source_word: μετάπεμψαι
  choice: ipasundo mo
  rationale: Ipinahahayag ang pagpapadala ng mga tao upang dalhin o papuntahin ang isang tao sa nagsasalita, nang hindi ipinahihiwatig ang sapilitang pagdakip.
- source_word: Σίμωνά τινα
  choice: ang isang Simon
  rationale: Pinananatili ang di-tiyak ngunit makikilalang tao na ipinahahayag ng τινα; natural ito sa Tagalog.
- source_word: ὃς ἐπικαλεῖται Πέτρος
  choice: na tinatawag na Pedro
  rationale: Tapat at malinaw na ipinahahayag ang pangalang ginagamit para kay Simon, nang hindi ito ginagawang apelyido.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang 'magsugo' at 'ipasundo' upang mapanatili ang pagkakaiba ng πέμψον at μετάπεμψαι. Ang panandang [a] ay nasa pangunahing teksto.
