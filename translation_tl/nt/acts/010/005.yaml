  source_fidelity: Tapat ang salin sa utos na magpadala ng mga lalaking emisaryo sa Joppa at magpasundo kay Simon na tinatawag na Pedro. Napananatili ang pagkakaiba ng πέμψον (“magsugo”) at μετάπεμψαι (“ipasundo”), gayundin ang di-tiyak na pagpapakilala ng τὶς sa “isang Simon.”
  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang “At ngayon” ay bahagyang pormal ngunit angkop sa daloy ng pagsasalaysay at sa register ng teksto. Ang “ipasundo mo” ay idiomatiko at hindi nagpapahiwatig ng sapilitan o marahas na pagdadala.
  terminology: Wasto ang “Joppa” at ang tradisyonal at malawak na gamit na pangalang “Pedro” para sa Πέτρος. Ang “mga lalaki” ay tumutugon sa ἄνδρας at hindi nagdaragdag ng tungkuling tulad ng “mga mensahero.” Ang talababa ay isang wastong leksikal na alternatibo at ang [a] ay wastong nakaangkla sa pariralang tumutukoy kay Simon/Pedro.
