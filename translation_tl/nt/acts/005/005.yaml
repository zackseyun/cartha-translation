  source_fidelity: 'Tumpak na naisasalin ang daloy ng Griyego: temporal na ''nang marinig,'' ang pagbagsak bago ang kamatayan, at ang pagsapit ng malaking takot sa lahat ng nakarinig. Hindi ito nagdaragdag ng paliwanag sa sanhi ng pagkamatay. Ang ''nito'' sa huling sugnay ay isang katanggap-tanggap na natural na pagtukoy sa napakinggan, bagaman hindi ito hayagang tinutukoy ng Griyego.'
  naturalness: Malinaw, marangal, at likas ang pangunahing salin sa modernong Filipino Tagalog. Gayunman, hindi natural at hindi wastong katumbas ng ἐξέψυξεν ang nasa talababa na 'hinugot ang huling hininga'; ang pandiwang iyon ay nangangahulugang paghila o pagkuha, hindi paghinga nang huli.
  terminology: Ang 'Ananias,' 'mga salitang ito,' 'bumagsak,' 'nalagutan ng hininga,' at 'matinding takot' ay angkop sa salaysay at sa register. Pinananatili ng 'nalagutan ng hininga' ang idiomatikong pahiwatig ng pagpanaw nang hindi nagpapataw ng mekanismo ng kamatayan.
