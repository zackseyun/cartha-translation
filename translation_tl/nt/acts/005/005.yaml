  text: ἀκούων δὲ ὁ Ἁνανίας τοὺς λόγους τούτους πεσὼν ἐξέψυξεν· καὶ ἐγένετο φόβος μέγας ἐπὶ πάντας τοὺς ⸀ἀκούοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/005.yaml
  text: But when Ananias heard these words[a], he fell down and died. And great fear came upon all who heard.
translation:
  language: tl
  text: Ngunit nang marinig ni Ananias ang mga salitang ito, bumagsak siya at nalagutan ng hininga.[a] At nagkaroon ng matinding takot ang lahat ng nakarinig nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “namatay.” Mas literal, “huminga nang huli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούων
  choice: nang marinig
  rationale: Ginawang sugnay na panahunan ang kasalukuyang participle upang likas na maipahayag sa Tagalog ang agarang pagkakasunod ng pagkarinig at pagbagsak.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinapakita ng δέ ang banayad na pagsalungat o biglang pag-usad ng salaysay matapos ang sinabi ni Pedro.
- source_word: ὁ Ἁνανίας
  choice: ni Ananias
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Ἁνανίας at ang panandang angkop sa pandiwang pokus sa layon.
- source_word: τοὺς λόγους τούτους
  choice: ang mga salitang ito
  rationale: Tumutukoy ang λόγους sa mga salitang kababanggit lamang na sinabi ni Pedro; tuwiran at natural ang salin.
- source_word: πεσὼν
  choice: bumagsak siya
  rationale: Pinananatili ang konkretong larawan ng pagkahulog sa halip na ang mas mapagpaliwanag na 'nawalan ng malay' o 'gumuho.'
- source_word: ἐξέψυξεν
  choice: nalagutan ng hininga
  rationale: Ipinahahayag nito nang natural sa modernong Tagalog ang kamatayan habang pinananatili ang larawang leksikal ng pagkalagot o pag-alis ng hininga.
- source_word: ἐγένετο φόβος μέγας
  choice: nagkaroon ng matinding takot
  rationale: Likas na konstruksiyon ito sa Tagalog para sa pagsapit at paglaganap ng matinding takot.
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: ang lahat ng nakarinig nito
  rationale: Ang participle ay substantibo at tumutukoy sa lahat ng nakarinig. Idinagdag ang 'nito' bilang likas na panghalip sa Tagalog nang hindi nililimitahan kung tuwirang mga salita o balita tungkol sa pangyayari ang narinig.
theological_decisions:
- issue: Paraan o sanhi ng pagkamatay ni Ananias
  choice: Isinalaysay lamang na bumagsak siya at nalagutan ng hininga, nang hindi tinutukoy ang mekanismo ng kamatayan.
  alternative: Sabihing namatay siya dahil sa pagkabigla, o na tuwirang pinatay siya ng Diyos.
  rationale: Malinaw na inilalahad ng Griyego ang agarang kamatayan ngunit hindi tahasang sinasabi kung paano ito nangyari o kung anong tiyak na mekanismo ang ginamit ng Diyos; dapat panatilihin ang teolohikal na tensiyong iyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang malinaw na galaw ng salaysay at ang matinding epekto nito, habang iniwasang magdagdag ng paliwanag tungkol sa sanhi ng kamatayan na wala sa Griyegong teksto.
