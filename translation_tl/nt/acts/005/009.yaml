source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Πέτρος πρὸς αὐτήν· Τί ὅτι συνεφωνήθη ὑμῖν πειράσαι τὸ πνεῦμα κυρίου; ἰδοὺ οἱ πόδες τῶν θαψάντων τὸν ἄνδρα σου ἐπὶ τῇ θύρᾳ καὶ ἐξοίσουσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/009.yaml
  text: But Peter said to her[a], “Why did you agree together to test the Spirit of the Lord? Look, the feet of those who buried your husband are at the door[b], and they will carry you out.”
translation:
  language: tl
  text: Ngunit sinabi sa kanya ni Pedro, “Bakit kayo nagkasundo[a] na subukin ang Espiritu ng Panginoon? Tingnan mo! Nasa pintuan ang mga paa ng mga naglibing sa asawa mo, at bubuhatin ka nila palabas.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “nagsabwatan.”'
    reason: Ipinakikita ang mas matinding kontekstuwal na diwa ng pagkakasundo nang hindi ito ipinipilit sa pangunahing salin.
lexical_decisions:
- source_word: Τί ὅτι συνεφωνήθη ὑμῖν
  choice: Bakit kayo nagkasundo
  rationale: Likas sa modernong Tagalog ang tanong na “Bakit,” at ipinahahayag ng “kayo nagkasundo” ang kapwa pakikibahagi sa isang kasunduan. Hindi agad pinatitindi ang pandiwa tungo sa “nagsabwatan,” bagaman ipinahihiwatig iyon ng konteksto.
- source_word: πειράσαι
  choice: na subukin
  rationale: Maaaring mangahulugan ang pandiwa ng pagtukso o pagsubok. Dahil ang layon ay ang Espiritu ng Panginoon, malinaw at angkop dito ang “subukin.”
- source_word: τὸ πνεῦμα κυρίου
  choice: ang Espiritu ng Panginoon
  rationale: Pinananatili nito ang anyong henitibo ng Griyego at ang malamang na pagtukoy sa Banal na Espiritu nang hindi idinaragdag ang salitang “Banal,” na wala sa talata.
- source_word: ἰδοὺ
  choice: Tingnan mo!
  rationale: Isang tuwirang panawag-pansin ang ἰδού. Ang “Tingnan mo!” ay natural, napapanahon, at nagpapanatili ng biglaang diin.
- source_word: οἱ πόδες τῶν θαψάντων
  choice: ang mga paa ng mga naglibing
  rationale: Pinananatili ang matingkad at literal na larawan ng “mga paa,” sa halip na palitan ito ng mas malayang “mga yabag.”
- source_word: τὸν ἄνδρα σου
  choice: sa asawa mo
  rationale: Sa konteksto, ang ἀνήρ ay tumutukoy sa asawa ni Safira, hindi lamang sa isang lalaki.
- source_word: ἐπὶ τῇ θύρᾳ
  choice: nasa pintuan na
  rationale: Natural na ipinahahayag sa Tagalog ang agarang pagdating o presensya sa pasukan. Ang “na” ay angkop sa konteksto, bagaman hindi ito hiwalay na salita sa Griyego.
- source_word: ἐξοίσουσίν σε
  choice: ilalabas ka rin nila
  rationale: Tumpak na sinasabi ng Griyego na ilalabas siya. Ang “rin” ay likas na naghahayag ng pagkakatulad ng sasapitin niya sa asawa niya, na malinaw sa konteksto, nang idagdag ang hindi tahasang “bangkay.”
theological_decisions:
- issue: Tinutukoy ng “Espiritu ng Panginoon”
  choice: Pinanatili ang “Espiritu ng Panginoon” bilang malamang na pagtukoy sa Banal na Espiritu.
  alternative: Tahasan itong isalin na “Banal na Espiritu” o unawain nang mas pangkalahatan bilang espirituwal na presensya ng Panginoon.
  rationale: Malakas ang kaugnayan nito sa Banal na Espiritu sa konteksto ng Gawa 5:3, ngunit hindi idinagdag sa salin ang “Banal” upang hindi lumampas sa mismong pananalita ng Griyego.
- issue: Tindi ng paratang ni Pedro
  choice: “nagkasundo”
  alternative: “nagsabwatan”
  rationale: Ang pandiwa ay pangunahing tumutukoy sa pagkakasundo. Malubha ang sabwatan ayon sa konteksto, ngunit hindi kailangang ipasok ang mas matinding interpretasyon sa pangunahing teksto.
translation_notes:
  register: 'Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “mo” at “kayo” ayon sa likas na bilang sa Griyego: isahan ang kausap, ngunit maramihan ang kasangkot sa pagkakasundo. Pinanatili ang matingkad na pariralang “mga paa” at ang nagbabantang tuwiran ng huling sugnay.'
