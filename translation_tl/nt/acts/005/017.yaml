  text: Ἀναστὰς δὲ ὁ ἀρχιερεὺς καὶ πάντες οἱ σὺν αὐτῷ, ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων, ἐπλήσθησαν ζήλου
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/017.yaml
  text: But the high priest rose up[a], and all those with him—that is[b], the party of the Sadducees—and were filled with jealousy.
translation:
  language: tl
  text: Ngunit tumindig ang mataas na saserdote, at ang lahat ng kasama niya—ang pangkat ng mga Saduseo[a]—ay napuspos ng panibugho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sekta ng mga Saduseo.” Ang salitang Griyego ay maaaring tumukoy sa isang pangkat, paaralan ng kaisipan, o sekta.
    reason: lexical_alternative
  - marker: b
    text: O “inggit.” Maaari ring mangahulugan ang salitang Griyego ng “sigasig,” ngunit mas angkop dito ang negatibong diwa dahil sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς
  choice: kumilos
  rationale: Ang aorist participle ng ἀνίστημι ay ginagamit dito bilang panimulang idyoma para sa tiyak na pagkilos, hindi lamang sa literal na pagtayo. Likas sa makabagong Tagalog ang “kumilos” at inihahanda nito ang kasunod na hakbang ng pinakapunong pari.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ng δέ ang banayad na pagsalungat sa naunang mabuting pagtanggap ng mga tao sa mga apostol.
- source_word: ὁ ἀρχιερεὺς
  choice: ang pinakapunong pari
  rationale: Ito ang malinaw at nakaugaliang katawagan sa natatanging tungkuling tinutukoy ng isahang ἀρχιερεύς.
- source_word: πάντες οἱ σὺν αὐτῷ
  choice: ang lahat ng kasama niya
  rationale: Pinananatili nito ang ugnayang ipinahihiwatig ng parirala nang hindi tinutukoy nang higit sa teksto ang opisyal na katayuan ng grupo.
- source_word: ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων
  choice: ang pangkat ng mga Saduceo
  rationale: Ang αἵρεσις dito ay isang kinikilalang pangkat o paksyon sa loob ng Judaismo. Mas malinaw ang “pangkat” sa karaniwang mambabasa at hindi nito ipinapasok ang mas huling kahulugan ng maling aral na maaaring taglayin ng “erehiya.”
- source_word: ἐπλήσθησαν
  choice: napuspos
  rationale: Pinananatili ng “napuspos” ang pasibong idyomang nangangahulugang lubusang mapuno ng isang saloobin.
- source_word: ζήλου
  choice: inggit
  rationale: Maaaring mangahulugan ang ζῆλος ng sigasig, panibugho, o inggit. Sa konteksto ng kanilang pagkontra sa mga apostol, nangingibabaw ang masamang diwang mainggitin.
theological_decisions:
- issue: Kahulugan ng αἵρεσις
  choice: pangkat
  alternative: sekta
  rationale: Tumutukoy ito sa isang panrelihiyon at panlipunang pangkat sa loob ng Judaismo, hindi sa teknikal at mas huling konsepto ng “erehiya.” Iniiwasan ng “pangkat” ang di-kinakailangang doktrinal na paghatol.
- issue: Kahulugan ng ζῆλος sa konteksto
  choice: inggit
  alternative: sigasig o panibugho
  rationale: Tunay na maraming posibleng kahulugan ang salita, ngunit ipinakikita ng agarang konteksto ng pag-uusig na negatibo ang motibo. Inilalagay sa talababa ang ibang saklaw ng salita upang hindi maitago ang leksikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kumilos” bilang likas na salin ng panimulang idyomang Ἀναστὰς; ang tahasang “siya” ay nilagay upang malinaw na kapwa ang pinakapunong pari at ang mga kasama niya ang napuspos ng inggit. Nasa mismong kaugnay na mga salita ang lahat ng panandang talababa.
