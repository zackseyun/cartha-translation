  terminology: Pinalitan ang “pinakapunong pari” ng “mataas na saserdote” para sa karaniwang terminong biblikal. Ginamit ang “Saduseo,” isang mas karaniwang Filipino/Tagalog na anyo ng pangalan. Pinanatili ang “pangkat” para sa αἵρεσις upang hindi magpahiwatig ng ‘erehiya.’
