base_translation:
  language: en
  yaml_path: translation/nt/acts/005/014.yaml
  text: And even more believers in the Lord were being added—multitudes of both men and women[a].
translation:
  language: tl
  text: At lalo pang nadaragdagan ang mga sumasampalataya sa Panginoon—napakaraming lalaki at babae[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumasama” o “idinadagdag.” Maaaring unawain ang pandiwang Griyego bilang patuloy na pagdami; ang anyong balintiyak nito ay maaaring magpahiwatig na ang Diyos ang nagdaragdag sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: μᾶλλον
  choice: lalo pang
  rationale: Likas nitong ipinahahayag sa Filipino ang pinatinding pagdami sa konteksto.
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito rito, hindi matinding panalungat, kaya ang “At” ay angkop sa pagpapatuloy ng salaysay.
- source_word: προσετίθεντο
  choice: nadaragdagan
  rationale: Ipinahahayag ng aspektong imperpektibo ang nagpapatuloy na pagdaragdag, at pinananatili ng anyong ito ang di-tahasang gumagawa ng kilos.
- source_word: πιστεύοντες
  choice: mga sumasampalataya
  rationale: Ginagamit ang participle bilang pangngalan para sa mga taong kinikilala sa kanilang pananampalataya.
- source_word: τῷ κυρίῳ
  choice: sa Panginoon
  rationale: Sa ugnayan nito sa πιστεύοντες, tinutukoy nito ang Panginoon bilang pinagtutuunan ng pananampalataya.
- source_word: κύριος
  choice: Panginoon
  rationale: Pinananatili nito ang mapitagang titulo at ang puwersang Kristolohikal nang hindi tahasang pinapalitan ng pangalang “Jesus.”
- source_word: πλήθη
  choice: napakaraming
  rationale: Natural nitong ipinahahayag ang napakalaking bilang na tinutukoy ng pangmaramihang πλήθη, bagaman ginagawang pang-uri sa Filipino para sa malinaw at magaan na daloy.
- source_word: ἀνδρῶν τε καὶ γυναικῶν
  choice: lalaki at babae
  rationale: Pinananatili nito ang kapuwa pangkat na tahasang binabanggit sa Griyego; ang “napakaraming” ang nagsasaad ng pangmaramihang diwa.
theological_decisions:
- issue: Tinutukoy at puwersa ng “Panginoon”
  choice: Pinananatili ang “Panginoon,” na sa konteksto ng Mga Gawa ay tumutukoy kay Jesus at siyang pinagtutuunan ng pananampalataya.
  alternative: Maaaring marinig ang “Panginoon” bilang mas pangkalahatang pagtukoy sa Diyos.
  rationale: Sa mga buod ng pagpapahayag sa Mga Gawa, madalas tumukoy ang κύριος sa muling nabuhay na si Jesus. Hindi ito pinalawak sa “Panginoong Jesus” upang huwag magsabi nang higit sa mismong teksto.
- issue: Tinig at aspekto ng προσετίθεντο
  choice: 'Patuloy na pasibo o di-tahasang pagdaragdag: “nadaragdagan.”'
  alternative: 'Panggitna o di-palipat na diwa: “sumasama.”'
  rationale: Pinananatili ng “nadaragdagan” ang nagpapatuloy na kilos at ang posibilidad na ang Diyos ang di-binanggit na gumagawa, nang hindi siya ginagawang tahasang simuno.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sumasampalataya” sa halip na mas teknikal o denominasyonal na katawagan, at pinanatili ang bahagyang kalabuan tungkol sa gumagawa ng pagdaragdag.
