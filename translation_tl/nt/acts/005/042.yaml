id: ACT.5.42
reference: Acts 5:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πᾶσάν τε ἡμέραν ἐν τῷ ἱερῷ καὶ κατ’ οἶκον οὐκ ἐπαύοντο διδάσκοντες καὶ εὐαγγελιζόμενοι ⸂τὸν χριστὸν Ἰησοῦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/042.yaml
  text: And every day[a], in the temple and from house to house, they did not stop teaching and proclaiming the good news that Jesus is the Messiah.
translation:
  language: tl
  text: At araw-araw, sa templo at sa bahay-bahay, hindi sila tumitigil sa pagtuturo at pagpapahayag ng mabuting balita na si Jesus ang Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang mas literal: “ipinapahayag ang mabuting balita tungkol kay Jesus na Mesiyas” o “ipinapahayag si Jesus bilang Mesiyas.”'
    reason: Pinananatili ang posibleng pagbasa sa τὸν χριστὸν Ἰησοῦν bilang pariralang layon, sa halip na tahasang sugnay ng nilalaman.
lexical_decisions:
- source_word: πᾶσάν τε ἡμέραν
  choice: At araw-araw
  rationale: Likas sa modernong Tagalog at pinananatili ang diwa ng palagian at paulit-ulit na gawain; ang “At” ay nag-uugnay sa naunang salaysay gaya ng τε.
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Ang ἱερόν ay tumutukoy sa kabuuang kompleks ng templo. Ang “sa templo” ay maikli, malinaw, at hindi labis na nagpapakahulugan.
- source_word: κατ’ οἶκον
  choice: sa bahay-bahay
  rationale: Ipinahahayag ng κατά na distributibo ang pagkilos sa iba’t ibang bahay, hindi lamang sa sarili nilang tahanan.
- source_word: οὐκ ἐπαύοντο
  choice: hindi sila tumitigil
  rationale: Pinananatili ng aspektong imperpekto ang tuloy-tuloy na pagkilos; natural ito sa kasalukuyang Tagalog bilang paglalarawan sa nakagawiang gawain noon.
- source_word: διδάσκοντες
  choice: sa pagtuturo
  rationale: Karaniwang katumbas ng διδάσκω at maayos na kapantay ng kasunod na pandiwang kilos.
- source_word: εὐαγγελιζόμενοι
  choice: pagpapahayag ng mabuting balita
  rationale: Malinaw at madaling maunawaan, habang pinananatili ang diwa ng paghahayag ng mabuting balita.
- source_word: τὸν χριστὸν Ἰησοῦν
  choice: na si Jesus ang Mesiyas
  rationale: 'Ipinapahayag nang natural sa Tagalog ang nilalaman ng mabuting balita: ang mesiyanikong pagkakakilanlan ni Jesus. Isinalin ang titulong Χριστός bilang “Mesiyas,” hindi bilang pangalang pantangi.'
theological_decisions:
- issue: Pagbibigay-kahulugan sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay gumaganap ang Χριστός bilang titulo at sentro ng ipinahahayag tungkol kay Jesus; ang “Mesiyas” ang tuwirang nagsasaad ng kahulugan nito.
- issue: Sintaktikong kaugnayan ng τὸν χριστὸν Ἰησοῦν sa εὐαγγελιζόμενοι
  choice: 'Nilalaman ng pahayag: “na si Jesus ang Mesiyas”'
  alternative: 'Tuwirang layon: “ipinapahayag ang mabuting balita tungkol kay Jesus na Mesiyas” o “ipinapahayag si Jesus bilang Mesiyas”'
  rationale: Maaaring basahin ang pariralang akusatibo bilang layon ng pandiwa, ngunit sa natural na Tagalog ay malinaw na naipapahayag ang nilalaman sa sugnay na “na si Jesus ang Mesiyas.” Pinananatili sa talababa ang tunay na sintaktikong posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “bahay-bahay” bilang natural na distributibong anyo at iniwasan ang mas makaluma o denominasyonal na pananalita.
