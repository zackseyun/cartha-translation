  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐνοσφίσατο ἀπὸ τῆς τιμῆς, συνειδυίης καὶ τῆς ⸀γυναικός, καὶ ἐνέγκας μέρος τι παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/002.yaml
  text: And he kept back some of the price[a], with his wife also knowing it, and bringing a certain part[b], he laid it at the apostles’ feet.
translation:
  language: tl
  text: At palihim siyang nagtabi para sa sarili ng bahagi ng halagang pinagbilhan[a], na alam din ng kanyang asawa; at nang magdala siya ng isang bahagi, inilagay niya ito sa paanan ng mga apostol.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “palihim na nagkait mula sa halagang pinagbilhan.” Ipinahihiwatig ng pandiwang Griyego ang mapanlinlang na pagtatabi ng isang bagay para sa sarili.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa mga paa ng mga apostol,” isang kongkretong paglalarawan ng paglalagay ng salapi sa harap nila.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνοσφίσατο
  choice: palihim siyang nagtabi para sa sarili
  rationale: Ipinahahayag nito ang mapanlinlang at pansariling pagkakait na taglay ng pandiwa, nang hindi ito pinapakahulugang tahasang legal na pagnanakaw.
- source_word: ἀπὸ τῆς τιμῆς
  choice: mula sa pinagbilhan
  rationale: Sa konteksto, ang τιμή ay ang halagang natanggap sa pagbebenta; natural at malinaw sa modernong Tagalog ang “pinagbilhan.”
- source_word: συνειδυίης καὶ τῆς γυναικός
  choice: at alam din ito ng kanyang asawa
  rationale: 'Pinananatili ang kasabay na pangyayari at ang καί (“din”): batid ng asawa ang ginawa.'
- source_word: ἐνέγκας μέρος τι
  choice: Pagkatapos, dinala niya ang isang bahagi
  rationale: Ipinakikita ng “Pagkatapos” na nauna ang pagdadala sa pangunahing kilos, habang pinananatili ng “isang bahagi” ang di-tiyak na μέρος τι.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν
  choice: inilagay iyon sa paanan ng mga apostol
  rationale: Pinananatili ang kongkretong larawan at ang paulit-ulit na pananalita sa Mga Gawa tungkol sa paglalagak ng salapi sa harap ng mga apostol.
theological_decisions:
- issue: Moral na bigat ng ginawa ni Ananias
  choice: Isinalin bilang palihim na pagtatabi para sa sarili, hindi bilang neutral na paglalaan ng bahagi.
  alternative: “nagtira siya ng bahagi ng pinagbilhan”
  rationale: Ang νοσφίζομαι at ang konteksto ay nagpapahiwatig ng lihim at mapanlinlang na pagkakait. Pinananatili ang negatibong puwersa nang hindi nagdaragdag ng doktrinang wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Hinati sa dalawang pangungusap ang mahabang kayariang Griyego upang maging natural ang daloy, ngunit pinanatili ang pagkakasunod-sunod ng mga kilos, ang kaalaman ng asawa, at ang kongkretong larawang “sa paanan ng mga apostol.”
