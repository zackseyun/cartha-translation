revisions:
- from: At palihim siyang nagtabi para sa sarili mula sa pinagbilhan[a]—at alam din ito ng kanyang asawa. Pagkatapos, dinala niya ang isang bahagi at inilagay iyon sa paanan ng mga apostol.[b]
  to: At palihim siyang nagtabi para sa sarili ng bahagi ng halagang pinagbilhan[a], na alam din ng kanyang asawa; at nang magdala siya ng isang bahagi, inilagay niya ito sa paanan ng mga apostol.[b]
  rationale: Pinalitan ang malabong “mula sa pinagbilhan” ng “ng bahagi ng halagang pinagbilhan,” na mas natural at malinaw na tumutukoy sa sale price. Inayos din ang ugnayan ng pagdadala at paglalagay upang maipakita ang participial na kayarian nang hindi nagdaragdag ng labis na temporal na diin. Napanatili ang saklaw ng kahulugan, ang moral na bigat ng pandiwa, ang kaalaman ng asawa, at ang mga umiiral na footnote anchor.
