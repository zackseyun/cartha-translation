  text: ἄγγελος δὲ κυρίου ⸀διὰ νυκτὸς ⸀ἤνοιξε τὰς θύρας τῆς φυλακῆς ἐξαγαγών τε αὐτοὺς εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/019.yaml
  text: But an angel of the Lord opened the doors of the prison during the night, brought them out, and said,
translation:
  language: tl
  text: Ngunit isang anghel ng Panginoon ang nagbukas ng mga pinto ng bilangguan sa gabi, inilabas sila, at sinabi,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: isang anghel
  rationale: Ang pangngalan ay walang pantukoy, kaya natural ang “isang anghel.” Sa konteksto ng mahimalang pagbubukas ng bilangguan, isang makalangit na nilalang ang tinutukoy, hindi isang taong sugo.
- source_word: κυρίου
  choice: ng Panginoon
  rationale: Pinananatili nito ang karaniwang biblikal na pariralang “anghel ng Panginoon” at ang kinikilalang kahulugan ng κύριος sa kontekstong ito.
- source_word: διὰ νυκτός
  choice: kinagabihan
  rationale: Temporal ang parirala at tumutukoy sa pangyayaring naganap sa gabi. Ang “kinagabihan” ay natural sa salaysay at hindi nagdaragdag ng diwa.
- source_word: ἤνοιξε
  choice: binuksan
  rationale: Tuwirang katumbas ito ng ἀνοίγω. Hindi ginamit ang “in-unlock” sapagkat walang tahasang binanggit na kandado.
- source_word: τὰς θύρας τῆς φυλακῆς
  choice: ang mga pinto ng bilangguan
  rationale: Pinananatili ang maramihang “mga pinto” at ang payak na kahulugan ng φυλακή bilang bilangguan.
- source_word: ἐξαγαγών
  choice: Inilabas niya sila
  rationale: Ipinahihiwatig ng participle na pinangyari ng anghel na makalabas sila. Hiniwalay bilang bagong pangungusap upang maging malinaw at natural sa modernong Tagalog.
- source_word: τε
  choice: at
  rationale: Ang banayad na pang-ugnay ay likas na naipahahayag ng “at.”
- source_word: εἶπεν
  choice: sinabi
  rationale: Karaniwang salin ito ng aorist ng λέγω at maayos na naghahatid sa mismong pananalita sa kasunod na talata.
theological_decisions:
- issue: Kalikasan ng ἄγγελος sa konteksto
  choice: makalangit na anghel
  alternative: taong sugo
  rationale: Ang mahimalang pagbubukas ng mga pinto at pagpapalabas sa mga bilanggo ay malinaw na umaayon sa isang makalangit na anghel. Gayunman, walang idinagdag na paglalarawan na wala sa teksto.
- issue: Pagpapakahulugan sa κύριος
  choice: Panginoon
  alternative: panginoon o amo
  rationale: Sa pariralang ἄγγελος κυρίου, ang “Panginoon” ang likas at kinikilalang biblikal na katawagan, nang hindi tinutukoy nang higit sa tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “bilangguan” sa halip na mas kolokyal na “kulungan.” Ang mahabang sugnay sa Griyego ay hinati sa dalawang pangungusap para sa natural na daloy, habang pinananatili ang pagkakasunod-sunod ng mga kilos.
