  source_fidelity: Tumpak na naihahatid ng “Dinakip nila” ang puwersang pag-aresto ng ἐπέβαλον τὰς χεῖρας ἐπὶ sa kontekstong ito. Ang “mga apostol” ay angkop na itinatag na tawag para sa ἀποστόλους. Ang “ikinulong sa pampublikong piitan” ay isang natural at makatwirang pagsasalin ng ἔθεντο αὐτοὺς ἐν τηρήσει δημοσίᾳ; ang talababa ay wastong nagpapanatili ng mas malawak na saklaw ng τήρησις bilang kustodiya o detensiyon, hindi lamang gusaling piitan.
