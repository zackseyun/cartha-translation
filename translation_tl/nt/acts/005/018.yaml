translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Tagalog. Isinalin ang idyomang Griyego ayon sa puwersa nitong pagdakip, habang nilinaw sa talababa ang saklaw ng parirala para sa pampublikong detensiyon.
