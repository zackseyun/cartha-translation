base_translation:
  language: en
  yaml_path: translation/nt/acts/005/018.yaml
  text: And they laid hands on the apostles and put them in public custody[a].
translation:
  language: tl
  text: Dinakip nila ang mga apostol at ikinulong sa pampublikong piitan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inilagay sa pampublikong kustodiya.” Ang pariralang Griyego ay maaaring tumukoy sa detensiyon o pagkakapiit sa pangkalahatan, hindi lamang sa isang gusaling piitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ
  choice: dinakip
  rationale: Ang literal na idyomang ‘ipinatong ang mga kamay sa’ ay tumutukoy rito sa marahas o sapilitang pagdakip. Mas natural at malinaw sa modernong Tagalog ang ‘dinakip’ kaysa literal na ‘pinatungan ng kamay.’
- source_word: ἀποστόλους
  choice: mga apostol
  rationale: Sa Mga Gawa, ito ang kinikilalang tawag sa mga isinugo ni Jesus, hindi lamang pangkalahatang ‘mga mensahero.’
- source_word: ἔθεντο
  choice: ikinulong
  rationale: Sa pagsama nito sa ἐν τηρήσει, ipinahihiwatig ng τίθημι ang paglalagay sa kalagayan o lugar ng pagkakapiit. Natural na ipinapahayag ito sa Tagalog sa pamamagitan ng ‘ikinulong.’
- source_word: ἐν τηρήσει
  choice: sa ... piitan
  rationale: Ang τήρησις ay maaaring tumukoy sa pagbabantay, kustodiya, o lugar at kalagayan ng detensiyon. Ang ‘piitan’ ay malinaw ngunit pinananatili ng talababa ang mas malawak na posibleng diwa.
- source_word: δημοσίᾳ
  choice: pampublikong
  rationale: Binabago nito ang τηρήσει at malamang na tumutukoy sa pampubliko o karaniwang lugar ng detensiyon, hindi sa lihim o pribadong pagkakapiit.
