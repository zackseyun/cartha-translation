  source_fidelity: Ang “mga kawal” ay masyadong tiyak at karaniwang nangangahulugang mga sundalo. Ang ὑπηρέται ay mga opisyal na tagapaglingkod/attendant na inutusang kumilos; sa konteksto maaari silang maging mga bantay ng templo, ngunit hindi ito tahasang sinasabi ng talata. Mas tapat ang “mga opisyal.” Napananatili ng “ang mga apostol” ang malinaw na tinutukoy ng αὐτούς batay sa naunang konteksto.
