  text: But when the officers arrived, they did not find them in the prison; so they returned and reported,
translation:
  language: tl
  text: Ngunit nang dumating ang mga opisyal, hindi nila natagpuan ang mga apostol sa bilangguan; kaya bumalik sila at nag-ulat,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: pagdating
  rationale: Likas na ipinahahayag sa modernong Tagalog ang pangyayaring kasabay ng pagdating ng mga kawal, nang hindi ginagawang hiwalay na pangunahing pandiwa ang participle.
- source_word: ὑπηρέται
  choice: mga kawal
  rationale: Sa kontekstong ito, tumutukoy ito sa mga opisyal na tauhang inutusang kumuha sa mga apostol, hindi sa mga karaniwang tagapaglingkod. Ang “mga kawal” ay malinaw at natural, bagaman hindi nito tahasang nililimitahan ang mga ito bilang bantay sa templo.
- source_word: οὐχ εὗρον
  choice: hindi nila natagpuan
  rationale: Tuwiran at natural na salin ng pandiwa sa kontekstong pasalaysay.
- source_word: αὐτούς
  choice: ang mga apostol
  rationale: Ginawang tahas ang tinutukoy ng panghalip upang maiwasan ang malabong “sila” sa Tagalog; malinaw sa naunang konteksto na ang mga apostol ang tinutukoy.
- source_word: ἐν τῇ φυλακῇ
  choice: sa bilangguan
  rationale: Tumutukoy sa tiyak na bilangguang nabanggit na sa salaysay; sa Tagalog, sapat na ang “sa bilangguan” upang ipahayag iyon nang natural.
- source_word: ἀναστρέψαντες
  choice: bumalik sila
  rationale: Ipinahahayag ang pagbabalik mula sa bilangguan patungo sa mga nagsugo sa kanila sa maikli at karaniwang pananalita.
- source_word: ἀπήγγειλαν
  choice: nag-ulat
  rationale: Ang pandiwa ay tumutukoy sa pagbibigay ng opisyal na ulat; ang “nag-ulat” ay maikli at angkop sa tagpo.
- source_word: δέ
  choice: Ngunit / Kaya
  rationale: Ang unang δέ ay nagpapakita ng pagsalungat sa inaasahang makikita ang mga apostol. Ang ikalawa ay magaan na pang-ugnay; natural na ipinakikita ng “Kaya” ang pagkakasunod ng pagbabalik at pag-uulat.
