  to: Habang hindi pa ito naipagbibili, hindi ba nananatiling iyo ito? At nang maipagbili na ito, hindi ba nasa kapangyarihan mo pa rin ang pinagbilhan nito?[a] Bakit mo inilagay sa puso mo ang bagay na ito? Hindi ka nagsinungaling sa mga tao[b] kundi sa Diyos.
