  text: οὐχὶ μένον σοὶ ἔμενεν καὶ πραθὲν ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν; τί ὅτι ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο; οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/004.yaml
  text: While it remained unsold[a], did it not remain yours? And after it was sold[b], was it not under your authority? Why is it that you have set this matter in your heart? You have not lied to men but to God.
translation:
  language: tl
  text: Habang hindi pa ito naipagbibili, hindi ba nananatiling iyo ito? At nang maipagbili na ito, hindi ba nasa kapangyarihan mo pa rin ang pinagbilhan nito?[a] Bakit mo inilagay sa puso mo ang bagay na ito? Hindi ka nagsinungaling sa mga tao[b] kundi sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nasa iyong pamamahala ang pinagbilhan nito” o “malaya kang magpasya kung ano ang gagawin sa pinagbilhan nito.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga tao” rito ay tumutukoy sa mga tao sa pangkalahatan, hindi lamang sa mga lalaki.
    reason: lexical_clarification
lexical_decisions:
- source_word: μένον σοὶ ἔμενεν
  choice: Noong hindi pa naipagbibili ang lupa, hindi ba nanatili itong iyo?
  rationale: Pinananatili ang pag-uulit ng μένω sa diwa ng patuloy na pagmamay-ari bago ang bentahan. Idinagdag ang “lupa” mula sa malinaw na konteksto ng talata 3 upang maging likas sa Tagalog ang sugnay.
- source_word: πραθὲν
  choice: nang maipagbili na
  rationale: Likas na isinasalin sa Tagalog ang aorist passive participle bilang sugnay na pasibo, habang pinananatili ang pagkakasunod ng pangyayari.
- source_word: ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν
  choice: nasa kapangyarihan mo ang napagbentahan nito
  rationale: Ang ἐξουσία ay tumutukoy sa karapatan o malayang pamamahala. Ipinahahayag ng “nasa kapangyarihan mo” na malaya si Ananias na magpasya tungkol sa napagbentahan, hindi lamang na hawak niya iyon.
- source_word: τί ὅτι
  choice: Bakit
  rationale: Ang tuwirang “Bakit” ay natural at sapat na matindi sa modernong Tagalog bilang tanong na sumasaway.
- source_word: ἔθου ἐν τῇ καρδίᾳ σου
  choice: inilagay sa puso mo
  rationale: Pinananatili ang metaporang “puso” at ang diwa ng panloob na pagpapasya o layunin nang hindi ito nililimitahan sa “binalak.”
- source_word: τὸ πρᾶγμα τοῦτο
  choice: ang bagay na ito
  rationale: Ang malawak at neutral na “bagay” ay katumbas ng πρᾶγμα at hinahayaang ang konteksto ang magtakda ng bigat na moral nito.
- source_word: οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ
  choice: Hindi ka nagsinungaling sa mga tao kundi sa Diyos
  rationale: Ang “mga tao” ay natural at tumpak na pangkalahatang katumbas ng ἀνθρώποις sa Filipino at malinaw na pinananatili ang paghahambing sa Diyos.
theological_decisions:
- issue: Ugnayan ng pagsisinungaling sa Banal na Espiritu sa talata 3 at sa Diyos sa talata 4
  choice: Isinalin nang tuwiran bilang “sa Diyos.”
  alternative: “sa Diyos, samakatuwid ay sa Banal na Espiritu”
  rationale: Ang mismong talata ay nagsasabing τῷ θεῷ. Hindi dapat idagdag sa pangunahing teksto ang paliwanag na teolohikal, bagaman mahalaga ang ugnayan nito sa naunang talata.
- issue: Kalayaan ni Ananias sa lupa at sa napagbentahan
  choice: “nasa kapangyarihan mo ang napagbentahan nito”
  alternative: Pag-aari mo lamang ang napagbentahan nito
  rationale: Ipinakikita ng argumento ni Pedro na ang kasalanan ay pandaraya, hindi ang hindi pagbibigay ng buong ari-arian. Pinananatili ng salin ang tunay na karapatan niyang magpasya.
- issue: Saklaw ng ἀνθρώποις
  choice: “mga tao”
  alternative: “mga lalaki”
  rationale: Dito, ang ἄνθρωπος ay tumutukoy sa mga tao sa pangkalahatan, hindi lamang sa mga lalaking nasa hustong gulang.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at tuwiran. Pinanatili ang metaporang “puso,” ang retorikal na mga tanong, at ang mariing paghahambing ng mga tao at Diyos. Ginamit ang “naipagbibili/maipagbili” bilang dignified ngunit madaling maunawaang anyo.
