  yaml_path: translation/nt/acts/005/010.yaml
  text: Then she immediately fell at his feet and died. When the young men came in, they found her dead, and they carried her out and buried her beside her husband.
translation:
  language: tl
  text: Agad siyang bumagsak sa paanan niya at namatay. Nang pumasok ang mga binata, natagpuan nila siyang patay, at inilabas nila siya at inilibing sa tabi ng kanyang asawa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραχρῆμα
  choice: Agad
  rationale: Likas at tuwirang katumbas sa modernong Tagalog ng bigla at kaagad na pangyayari.
- source_word: πρὸς τοὺς πόδας αὐτοῦ
  choice: sa paanan nito
  rationale: Pinananatili ang ugnayan kay Pedro ayon sa konteksto, habang iniiwasan ang posibleng kalituhan ng panghalip na “niya” sa kasunod na pagbanggit sa babae.
- source_word: ἐξέψυξεν
  choice: namatay
  rationale: Ang pandiwa ay idyomatikong tumutukoy sa pagkalagot ng hininga o pagkamatay; “namatay” ang malinaw at natural na katumbas sa kasalukuyang Tagalog.
- source_word: οἱ νεανίσκοι
  choice: mga binata
  rationale: Tumpak na tumutukoy sa mga lalaking bata pa ang edad, at natural sa Tagalog.
- source_word: πρὸς τὸν ἄνδρα αὐτῆς
  choice: sa tabi ng kanyang asawa
  rationale: Sa konteksto ng paglilibing, ang πρός ay natural na ipinahahayag bilang “sa tabi ng”; ang ἀνήρ dito ay asawa niyang lalaki.
