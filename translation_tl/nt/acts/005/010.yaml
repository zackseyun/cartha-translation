  to: Agad siyang bumagsak sa paanan niya at namatay. Nang pumasok ang mga binata, natagpuan nila siyang patay, at inilabas nila siya at inilibing sa tabi ng kanyang asawa.
  rationale: Pinalitan ang di-natural na “nito” ng “niya” para sa taong tinutukoy sa konteksto, at inalis ang “Kaya” upang huwag magdagdag ng ugnayang sanhi na wala sa pinagmulan. Pinanatili ang payak, marangal, at modernong Tagalog na katumbas ng bawat sugnay.
