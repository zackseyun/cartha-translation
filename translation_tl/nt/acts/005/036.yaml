  text: πρὸ γὰρ τούτων τῶν ἡμερῶν ἀνέστη Θευδᾶς, λέγων εἶναί τινα ἑαυτόν, ᾧ ⸀προσεκλίθη ⸂ἀνδρῶν ἀριθμὸς ὡς⸃ τετρακοσίων· ὃς ἀνῃρέθη, καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διελύθησαν καὶ ἐγένοντο εἰς οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/036.yaml
  text: For before these days Theudas rose up[a], claiming to be somebody, and a number of men, about four hundred, joined him. He was killed[c][b], and all who had been persuaded by him were scattered and came to nothing.
translation:
  language: tl
  text: Sapagkat bago ang mga araw na ito ay lumitaw si Teudas, na nagpakilalang mahalagang tao.[a] May mga apatnaraang lalaking umanib sa kanya.[b] Pinatay siya, at ang lahat ng nahikayat niya ay nagkawatak-watak at nauwi sa wala.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nag-aangking siya ay isang taong may kahalagahan.” Idyoma ito para sa pagpapakilala sa sarili bilang isang taong mahalaga.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pumanig sa kanya,” “sumama sa kanya,” o “kumampi sa kanya.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ang lahat ng sumusunod sa kanya.” Mas literal, “ang lahat ng nahikayat niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ γὰρ τούτων τῶν ἡμερῶν
  choice: Sapagkat bago ang mga araw na ito
  rationale: Pinananatili ng “Sapagkat” ang paliwanag na ugnayan ng γάρ sa pangangatwiran ni Gamaliel, at malinaw na ipinahahayag ng “bago ang mga araw na ito” ang naunang panahon.
- source_word: ἀνέστη Θευδᾶς
  choice: lumitaw si Teudas
  rationale: Sa konteksto, ang ἀνέστη ay tumutukoy sa paglitaw o pagsulpot ni Teudas bilang pinuno, hindi sa muling pagkabuhay. Natural sa Filipino ang “lumitaw” at hindi ito nagdaragdag ng himagsik na hindi tahasang sinasabi rito.
- source_word: λέγων εἶναί τινα ἑαυτόν
  choice: nag-angking isa siyang taong mahalaga
  rationale: Ang idyomang τινα ἑαυτόν ay nagpapahiwatig na ipinakilala niya ang sarili bilang taong may kabuluhan o katanyagan. Ginagawang tahas ng salin ang idyomatikong diwa para sa karaniwang mambabasa.
- source_word: ᾧ προσεκλίθη
  choice: pumanig sa kanya
  rationale: Ipinahahayag nito ang pag-ugnay o pagpanig ng mga tao kay Teudas. Ang “pumanig” ay natural at pinananatili ang diwa ng kusang pag-anib sa isang pinuno.
- source_word: ἀνδρῶν ἀριθμὸς ὡς τετρακοσίων
  choice: May mga lalaking ... humigit-kumulang apatnaraan
  rationale: Pinananatili ang tiyak na panlalaking kahulugan ng ἀνδρῶν at ang pagtatantiya ng ὡς. Mas natural sa Filipino ang ganitong ayos kaysa literal na “bilang ng mga lalaki.”
- source_word: ὃς ἀνῃρέθη
  choice: Pinatay siya
  rationale: Direkta at modernong katumbas ito ng pasibong ἀνῃρέθη sa kontekstong ito.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: ang lahat ng naniwala sa kanya
  rationale: Ang ἐπείθοντο ay maaaring maglarawan sa mga nahikayat o napaniwala ni Teudas. Ang “naniwala sa kanya” ay natural, habang inilalahad sa talababa ang mas literal na alternatibo.
- source_word: διελύθησαν
  choice: nagkawatak-watak
  rationale: Ipinahahayag nito ang pagkabuwag at pagkahiwa-hiwalay ng pangkat, hindi lamang pisikal na pagkalat.
- source_word: ἐγένοντο εἰς οὐδέν
  choice: nauwi sa wala ang kanyang kilusan
  rationale: Ang “nauwi sa wala” ay natural na katumbas ng idyoma. Ang “kanyang kilusan” ay isang kontekstuwal na tagatukoy sa kolektibong pagsisikap ng pangkat at iniiwasan ang malabong paksa sa Filipino.
theological_decisions:
- issue: Makasaysayang pagbanggit kay Teudas sa talumpati ni Gamaliel
  choice: Isinalin ang pahayag nang tuwiran bilang bahagi ng pangangatwiran ni Gamaliel.
  alternative: Magdagdag ng pag-aalinlangan o baguhin ang salita upang iayon sa mga panlabas na rekonstruksiyong pangkasaysayan.
  rationale: Inilalahad ng Griyegong teksto ang halimbawang ito sa loob ng talumpati ni Gamaliel. Hindi tungkulin ng salin na ipasok sa talata ang isang pagpapasya o pagsasakatugma tungkol sa pagkakakilanlan at kronolohiya ni Teudas.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Teudas” ayon sa karaniwang pag-aangkop ng pangalang Griyego sa Filipino. Iniwasan ang sobrang literal na mga pariralang magiging matigas o malabo, habang pinanatili ang paliwanag na daloy, tinatayang bilang, at pagbagsak ng kilusan.
