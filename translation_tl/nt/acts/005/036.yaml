revisions:
- from: Sapagkat bago ang mga araw na ito, lumitaw si Teudas at nag-angking isa siyang taong mahalaga.[a] May mga lalaking pumanig sa kanya,[b] na humigit-kumulang apatnaraan. Pinatay siya, at nagkawatak-watak ang lahat ng naniwala sa kanya,[c] kaya nauwi sa wala ang kanyang kilusan.
  to: Sapagkat bago ang mga araw na ito ay lumitaw si Teudas, na nagpakilalang mahalagang tao.[a] May mga apatnaraang lalaking umanib sa kanya.[b] Pinatay siya, at ang lahat ng nahikayat niya ay nagkawatak-watak at nauwi sa wala.[c]
  rationale: Inalis ang idinagdag na “kanyang kilusan” upang hindi tahasang magpasok ng paksa na hindi pinangalanan sa Griyego. Inayos ang ayos ng pangungusap para malinaw na ang humigit-kumulang apatnaraan ay mga lalaking umanib kay Teudas, at pinili ang “nahikayat” upang ipakita ang diwa ng ἐπείθοντο. Inayos din ang mga talababa upang maging natural at tumpak ang mga alternatibong salin.
