  source_fidelity: Ang draft ay tapat sa pangunahing pagkakasunod-sunod ng mga kilos at maayos na pinananatili ang pahambing na anyo ng οἱ νεώτεροι. Gayunman, ang “inilabas” ay hindi tahasang naipapahayag ang pandiwang ἐξενέγκαντες, na tumutukoy sa pagdadala palabas; kailangan itong linawin bilang “dinala siya palabas.”
