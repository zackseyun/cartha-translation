  text: Then the young men rose[a], wrapped him up, carried him out, and buried him.
translation:
  language: tl
  text: Pagkatapos, tumayo ang mga nakababatang lalaki[a], binalot nila siya, dinala siya palabas, at inilibing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kabataang lalaki.” Pahambing ang anyo ng salitang Griyego na νεώτεροι at maaaring mangahulugang “mga nakababatang lalaki” o, sa mas pangkalahatan, “mga kabataang lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: tumayo
  rationale: Ipinahihiwatig ng aorist participle na tumayo sila upang kumilos; payak at natural ang “tumayo” sa salaysay.
- source_word: δὲ
  choice: Pagkatapos
  rationale: Minamarkahan ng δέ ang pagsulong ng salaysay; malinaw na ipinapakita ng “Pagkatapos” ang kasunod na pangyayari.
- source_word: οἱ νεώτεροι
  choice: ang mga nakababatang lalaki
  rationale: Comparative ang anyo ng νεώτεροι, kaya pinananatili ng “nakababatang lalaki” ang posibleng paghahambing sa mas matatandang naroon, habang inilalahad sa talababa ang mas pangkalahatang kahulugan.
- source_word: συνέστειλαν
  choice: binalot siya
  rationale: Sa konteksto, tumutukoy ito sa pagbabalot o pagsasaayos sa katawan bago ito ilabas at ilibing. Ang “binalot siya” ay malinaw at hindi labis na nagpapakahulugan.
- source_word: αὐτὸν
  choice: siya
  rationale: Ang panghalip ay tumutukoy kay Ananias bilang tuwirang layon.
- source_word: ἐξενέγκαντες
  choice: inilabas
  rationale: Ipinapahayag ng ἐκφέρω ang pagdadala sa katawan palabas; sapat at natural sa Filipino ang “inilabas” sa konteksto.
- source_word: ἔθαψαν
  choice: inilibing
  rationale: Tuwiran at karaniwang katumbas ito ng θάπτω.
