base_translation:
  language: en
  yaml_path: translation/nt/acts/005/008.yaml
  text: But Peter answered her[a], “Tell me, did you sell the land for this much?” And she said, “Yes, for this much.”
translation:
  language: tl
  text: Sumagot naman sa kanya si Pedro, “Sabihin mo sa akin, ipinagbili ba ninyo ang lupa[a] sa ganitong halaga?” Sinabi niya, “Oo, sa ganyang halaga.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ari-arian” o “bukid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη δὲ πρὸς αὐτὴν Πέτρος
  choice: Sumagot naman sa kanya si Pedro
  rationale: Pinananatili ng “sumagot” ang karaniwang diwa ng ἀποκρίνομαι, samantalang natural na ipinapahayag ng “sa kanya” ang πρὸς αὐτήν. Ipinahihiwatig ng “naman” ang paglipat ng salaysay na dala ng δέ nang hindi labis na binibigyang-diin ang pagsalungat.
- source_word: Εἰπέ μοι
  choice: Sabihin mo sa akin
  rationale: Tuwirang utos ito na natural at malinaw sa modernong Tagalog.
- source_word: εἰ
  choice: ba
  rationale: Ang εἰ ay nagpapakilala rito ng tanong na masasagot ng oo o hindi; natural itong ipinapahayag sa Tagalog sa pamamagitan ng “ba.”
- source_word: τοσούτου
  choice: sa ganitong halaga / sa ganyang halaga
  rationale: Tumutukoy ang salita sa tiyak na halagang pinag-uusapan. Ang “ganitong” sa tanong at “ganyang” sa sagot ay natural na pagbabago ng pananaw ng nagsasalita habang pinananatili ang iisang halaga.
- source_word: τὸ χωρίον
  choice: ang lupa
  rationale: Maaaring tumukoy ang χωρίον sa isang piraso ng lupa, bukid, o ari-arian. Ang “lupa” ang pinakanatural at hindi labis na tiyak sa kontekstong ito.
- source_word: ἀπέδοσθε
  choice: ipinagbili ba ninyo
  rationale: Sa kontekstong pangkalakalan, ang ἀποδίδωμι ay nangangahulugang magbenta. Pinananatili ng “ninyo” ang pangmaramihang anyo ng pandiwa, na angkop sa mag-asawang sangkot sa pagbebenta.
- source_word: Ναί
  choice: Oo
  rationale: Payak at tuwirang katumbas ng afirmatibong sagot.
- source_word: ἡ δὲ εἶπεν
  choice: Sinabi niya
  rationale: Malapit ito sa payak na pandiwang εἶπεν at iniiwasang magdagdag ng himig o motibong wala sa teksto.
