  source_fidelity: Tumpak na naipapahayag ang tanong ni Pedro tungkol sa halagang pinagbentahan ng lupa at ang maikling pagsang-ayon ng babae. Napananatili ang pangmaramihang pandiwa sa ἀπέδοσθε sa pamamagitan ng “ninyo,” habang ang “niya” sa tugon ay wastong tumutukoy sa babae. Katanggap-tanggap ang “naman” para sa δέ bilang mahinahong pag-usad ng salaysay.
