id: ACT.5.32
reference: Acts 5:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ⸀ἐσμεν μάρτυρες τῶν ῥημάτων τούτων, καὶ τὸ ⸀πνεῦμα τὸ ἅγιον ὃ ἔδωκεν ὁ θεὸς τοῖς πειθαρχοῦσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/032.yaml
  text: And we are witnesses of these things[a], and so is the Holy Spirit[c][b], whom God has given to those who obey him.
translation:
  language: tl
  text: At kami ay mga saksi sa mga bagay na ito[a], at saksi rin ang Banal na Espiritu, na ibinigay ng Diyos sa mga tumatalima sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga salitang ito” o “mga usaping ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: mga saksi
  rationale: Karaniwan at malinaw itong katawagan sa mga taong nagpapatotoo batay sa kanilang nasaksihan, gaya ng gamit sa Mga Gawa.
- source_word: ῥημάτων
  choice: mga bagay
  rationale: Sa kontekstong ito, maaaring tumukoy ang ῥήματα hindi lamang sa mga salita kundi sa mga bagay o usaping pinatototohanan. Likas sa Filipino ang “mga bagay na ito,” habang inilalahad sa talababa ang tunay na lawak ng kahulugan.
- source_word: πνεῦμα τὸ ἅγιον
  choice: ang Banal na Espiritu
  rationale: Ito ang malinaw at karaniwang makabagong katawagan sa Filipino para sa personal na banal na tinutukoy sa Lucas–Mga Gawa.
- source_word: ἔδωκεν
  choice: ibinigay
  rationale: Tumpak nitong ipinapahayag ang aorist na kilos nang hindi ipinipilit kung minsanan o may patuloy na bunga ang pagbibigay.
- source_word: πειθαρχοῦσιν
  choice: mga tumatalima
  rationale: Ipinahihiwatig ng πειθαρχέω ang pagsunod sa isang may awtoridad. Mas malinaw na naipapahayag ng “tumatalima” ang diwang ito kaysa sa mas malawak na “sumusunod.”
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Pinananatili nito ang panghalip ng Griyego, na malinaw na tumutukoy sa Diyos.
theological_decisions:
- issue: Kung inilalarawan ang Banal na Espiritu bilang kapwa saksi ng mga apostol
  choice: “at saksi rin ang Banal na Espiritu”
  alternative: “at ang Banal na Espiritu [ay saksi rin]”
  rationale: Walang nakasulat na pandiwa sa ikalawang sugnay ng Griyego, ngunit likas na dinadala rito ang panaguring “mga saksi” mula sa unang sugnay. Ginagawang malinaw ng salin ang ugnayang ito nang walang idinaragdag na bagong diwa.
- issue: Personal na pagtukoy sa Banal na Espiritu
  choice: Gamitin ang likas na pang-ugnay na “na”
  alternative: Tahasan ang “siya na”
  rationale: Ang anyong neuter ng panghalip sa Griyego ay dulot ng gramatikal na kasarian ng πνεῦμα. Walang ganitong pagkakaiba sa Filipino; natural na tumutukoy ang “na” sa Banal na Espiritu nang hindi pinapalabo o labis na pinatitindi ang personal na pagtukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tumatalima” upang mapanatili ang diwa ng pagsunod sa awtoridad, at ang “saksi rin” upang natural na maipahayag ang ipinahiwatig na panaguri sa ikalawang sugnay.
