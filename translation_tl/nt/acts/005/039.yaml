  text: εἰ δὲ ἐκ θεοῦ ἐστιν, οὐ ⸀δυνήσεσθε καταλῦσαι ⸀αὐτούς·) μήποτε καὶ θεομάχοι εὑρεθῆτε. ἐπείσθησαν δὲ αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/039.yaml
  text: But if it is from God[a], you will not be able to overthrow them. You may even be found to be fighting against God.” So they were persuaded by him[c][b],
translation:
  language: tl
  text: Ngunit kung ito ay mula sa Diyos, hindi ninyo sila[a] magagawang pabagsakin.[b] Baka lumabas pang lumalaban kayo sa Diyos.[c]” Kaya sumang-ayon sila sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sila” ay pinakanatural na tumutukoy sa mga apostol, bagaman maaari rin itong unawain nang mas malawak bilang kanilang kilusan o gawain.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin na “gibain,” “lipulin,” o “pawalang-bisa.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “mga kalaban ng Diyos”; sa literal, “mga lumalaban sa Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ θεοῦ
  choice: mula sa Diyos
  rationale: Ipinahahayag ng ἐκ ang pinagmulan; likas at malinaw sa modernong Tagalog ang “mula sa Diyos.”
- source_word: δυνήσεσθε
  choice: magagawang
  rationale: Pinananatili nito ang hinaharap na kakayahang ipinahahayag ng anyong future ng δύναμαι.
- source_word: καταλῦσαι
  choice: pabagsakin
  rationale: Sa konteksto, tumutukoy ito sa pagpapabagsak o pagpawalang-bisa sa mga apostol at sa gawaing kinakatawan nila, hindi lamang sa pisikal na pagwasak.
- source_word: αὐτούς
  choice: sila
  rationale: Ang panghalip ay panlalaking maramihan at pinakanatural na tumutukoy sa mga apostol; pinananatili ng “sila” ang personal na layon.
- source_word: μήποτε
  choice: Baka ... pa
  rationale: Likas na ipinahahayag ng pariralang ito ang babala tungkol sa isang hindi kanais-nais na maaaring kalabasan.
- source_word: θεομάχοι
  choice: lumalaban ... sa Diyos
  rationale: Ipinahahayag nito sa natural na Tagalog ang literal na diwang “mga lumalaban sa Diyos” nang hindi pinahihina ang bigat ng babala.
- source_word: εὑρεθῆτε
  choice: lumabas
  rationale: Sa pariralang “baka lumabas pang,” naihahatid ang diwang matuklasan o mapatunayang nasa gayong kalagayan.
- source_word: ἐπείσθησαν δὲ αὐτῷ
  choice: Kaya nahikayat niya sila
  rationale: Natural na aktibong pagbabalangkas ito sa Tagalog para sa pasibong Griyego at ipinakikitang tinanggap ng kapulungan ang payo niya; pinananatili rin ang inferensiyal na daloy sa “Kaya.”
theological_decisions:
- issue: Tinutukoy ng αὐτούς sa babala tungkol sa hindi nila magagawang pabagsakin
  choice: Tumutukoy ang “sila” sa mga apostol o mga lalaking nasa harap ng kapulungan.
  alternative: Maaaring unawain itong mas malawak na tumutukoy sa kanilang kilusan o gawain, kaugnay ng “balak o gawaing ito” sa naunang talata.
  rationale: Panlalaking maramihan ang Griyegong panghalip at pinakamalapit na tumutukoy sa mga tao. Gayunman, inilalahad sa talababa ang mas malawak na pagkaunawa upang mapanatili ang tunay na kalabuan at hindi gawing pangkalahatang pangako ang babala ni Gamaliel.
- issue: Diwa ng θεομάχοι
  choice: “lumalaban kayo sa Diyos”
  alternative: “mga kalaban ng Diyos” o, mas literal, “mga mandirigma laban sa Diyos”
  rationale: Pinananatili ng pandiwang anyo ang matinding babala na maaaring ang mismong ginagawa nila ay pakikipaglaban sa Diyos, nang hindi nagdaragdag ng isang tiyak na doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “ninyo/kayo” para sa maramihang kausap at iniwasan ang sobrang pormal o makalumang bokabularyo. Ang “pabagsakin” at “lumabas pang lumalaban” ay idiomatiko ngunit nananatiling malapit sa lakas at tensiyon ng Griyego.
