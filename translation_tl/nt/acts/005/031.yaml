  source_fidelity: 'Tapat ang pangunahing diwa ng salin sa Griyego: ang mariing pamatlig, ang pagtataas ni Jesus ng Diyos, ang mga titulong ἀρχηγός at σωτήρ, ang layunin ng pagbibigay, at ang mga kaloob sa Israel ay napapanatili. Gayunman, ang “kapatawaran sa mga kasalanan” ay hindi ang karaniwang o pinakatumpak na Filipino para sa ἄφεσιν ἁμαρτιῶν; “kapatawaran ng mga kasalanan” ang wastong relasyon at mas malinaw na katumbas.'
  naturalness: Ang ayos na “Ang isang ito ay itinaas ng Diyos” ay nauunawaan ngunit mabigat at di-gaanong likas. Mas malinaw at mas natural ang paglalagay ng pandiwa sa unahan habang pinananatili ang diin ng “ang isang ito.” Ang “pagkalooban” ay mas angkop ding pormal na pandiwa kaysa “bigyan” sa ganitong rehistro.
  terminology: Ang “Pinuno,” “Tagapagligtas,” at “pagsisisi” ay angkop at matatag na mga katawagang Filipino sa kontekstong ito. Pinanatili ang “sa kanyang kanan” at ang talababa upang hindi burahin ang tunay na posibleng instrumental na pagbasa ng τῇ δεξιᾷ αὐτοῦ.
