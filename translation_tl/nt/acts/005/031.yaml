revisions:
- from: Ang isang ito ay itinaas ng Diyos sa kanyang kanan bilang Pinuno at Tagapagligtas[a], upang bigyan ang Israel ng pagsisisi at kapatawaran sa mga kasalanan.
  to: Itinaas ng Diyos ang isang ito sa kanyang kanan bilang Pinuno at Tagapagligtas[a], upang pagkalooban ang Israel ng pagsisisi at kapatawaran ng mga kasalanan.
  rationale: Inayos ang ayos ng pangungusap para sa mas likas na modernong Filipino, pinalitan ang “bigyan” ng mas angkop na “pagkalooban,” at itinuwid ang idiomatikong relasyon sa “kapatawaran ng mga kasalanan.” Hindi binago ang saklaw ng kahulugan, mga titulo, o ang kalabuan ng datibong parirala; ang huli ay malinaw na pinananatili sa talababa.
