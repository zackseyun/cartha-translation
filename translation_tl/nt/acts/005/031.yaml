base_translation:
  language: en
  yaml_path: translation/nt/acts/005/031.yaml
  text: God exalted this one to his right hand as Leader and Savior[a], to give repentance to Israel and forgiveness of sins.
translation:
  language: tl
  text: Itinaas ng Diyos ang isang ito sa kanyang kanan bilang Pinuno at Tagapagligtas[a], upang pagkalooban ang Israel ng pagsisisi at kapatawaran ng mga kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng kanyang kanang kamay.” Maaaring unawain ang pariralang Griyego sa paraang instrumental, bagaman sa kontekstong ito ay malamang na tumutukoy ito sa pagluklok sa kanan ng Diyos, ang lugar ng pinakamataas na karangalan.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτον
  choice: ang isang ito
  rationale: Pinananatili ang mariing pamatlig na tuwirang tumutukoy kay Jesus, sa halip na gawing karaniwang panghalip lamang.
- source_word: ἀρχηγὸν
  choice: Pinuno
  rationale: Saklaw ng salita ang nangunguna o nakatayo sa unahan; malinaw at likas ang “Pinuno” sa konteksto ng karangalan at pamamahala.
- source_word: σωτῆρα
  choice: Tagapagligtas
  rationale: Karaniwan at angkop na salin sa kontekstong tumutukoy kay Cristo, at taglay nito ang diwa ng pagliligtas.
- source_word: ὕψωσεν
  choice: itinaas
  rationale: Ipinahahayag ang pagtataas sa katayuan at karangalan; sa pariralang “sa kanyang kanan,” malinaw na higit ito sa pisikal na pag-angat.
- source_word: τῇ δεξιᾷ αὐτοῦ
  choice: sa kanyang kanan
  rationale: Pinananatili ang posibleng lokatibong diwa ng pinakamataas na karangalan at kapangyarihan, habang inilalahad sa talababa ang instrumentong pagbasa.
- source_word: τοῦ δοῦναι
  choice: upang bigyan
  rationale: Malinaw na ipinahahayag ang layuning dala ng articular infinitive.
- source_word: μετάνοιαν
  choice: pagsisisi
  rationale: Sa makabagong wikang biblikal, ipinahahayag nito ang pagbabagong-loob at pagtalikod sa kasalanan, hindi lamang pagbabago ng isip.
- source_word: τῷ Ἰσραὴλ
  choice: ang Israel
  rationale: Likas na tumutukoy sa tumatanggap sa konstruksiyong Filipino na “bigyan ang Israel ng...”
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: kapatawaran sa mga kasalanan
  rationale: Malinaw at karaniwang Filipino para sa pamamalagi ng pagpapatawad sa mga kasalanan.
theological_decisions:
- issue: Kahulugan ng pagtataas kay Jesus kaugnay ng kanan ng Diyos
  choice: Itinaas siya sa kanan ng Diyos, ang kalagayan ng pinakamataas na karangalan at awtoridad.
  alternative: Itinaas siya sa pamamagitan ng kanang kamay o kapangyarihan ng Diyos.
  rationale: Pinapaboran ng konteksto at ng karaniwang larawan ng pagluklok sa Bagong Tipan ang lokatibo o kaugnay na pagbasa, ngunit maaari ring maging instrumental ang datibong Griyego kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang diin ng pamatlig at ang tunay na kalabuan ng pariralang datibo sa pamamagitan ng talababa.
