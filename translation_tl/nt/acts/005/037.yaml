  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μετὰ τοῦτον ἀνέστη Ἰούδας ὁ Γαλιλαῖος ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς καὶ ἀπέστησε ⸀λαὸν ὀπίσω αὐτοῦ· κἀκεῖνος ἀπώλετο καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διεσκορπίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/037.yaml
  text: After this[a], Judas the Galilean rose up in the days of the census and drew away people after him. He also perished[b], and all who were persuaded by him were scattered.
translation:
  language: tl
  text: Pagkatapos nito, bumangon si Judas na taga-Galilea noong panahon ng sensus[a] at hinikayat niyang tumalikod ang mga tao at sumunod sa kanya.[b] Nasawi rin siya, at nagkawatak-watak ang lahat ng nahikayat niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “noong panahon ng opisyal na pagpapatala.” Ang salitang Griyego ay maaaring tumukoy sa sensus o opisyal na pagpapatala.
    reason: lexical_alternative
  - marker: b
    text: O “inakay niya ang mga tao upang sumunod sa kanya.” Ang pandiwang Griyego ay maaaring magpahiwatig ng paghikayat sa mga tao na lumayo sa dating katapatan at sumunod sa iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τοῦτον
  choice: Pagkatapos nito
  rationale: Likas na temporal ang μετά na may akusatibo rito at tumutukoy sa kasunod na pangyayari, hindi kinakailangang sa mismong tao.
- source_word: ἀνέστη
  choice: bumangon
  rationale: Ipinahihiwatig dito ang paglitaw o pagbangon ng isang pinuno, hindi ang muling pagkabuhay.
- source_word: Ἰούδας ὁ Γαλιλαῖος
  choice: Judas na taga-Galilea
  rationale: Natural sa modernong Tagalog ang pantukoy sa pinagmulan na “taga-Galilea,” habang pinananatili ang pangalang Judas.
- source_word: ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς
  choice: noong panahon ng sensus
  rationale: Ang ἀπογραφή ay opisyal na pagtatala o sensus; natural at malinaw sa Tagalog ang “noong panahon ng sensus.”
- source_word: ἀπέστησε λαὸν ὀπίσω αὐτοῦ
  choice: inakay niya ang mga tao na sumunod sa kanya
  rationale: Ipinapahayag ang sanhi ng paglayo o pagtalikod ng mga tao upang sumunod sa kanya, ngunit iniiwasang magdagdag ng tahasang wikang “paghihimagsik” na wala sa parirala.
- source_word: λαὸν
  choice: mga tao
  rationale: Kolektibo at walang artikulo ang λαόν; ang “mga tao” ay hindi nagpapahiwatig na buong bayan o bansa ang tinutukoy.
- source_word: κἀκεῖνος ἀπώλετο
  choice: Nasawi rin siya
  rationale: Pinananatili ng “rin” ang diwa ng κἀκεῖνος, at ipinahihiwatig ng “nasawi” ang pagkamatay nang hindi tinutukoy kung paano ito nangyari.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: ang lahat ng nahikayat niya
  rationale: Inihihiwalay nito ang diwa ng πείθω—ang pagkahikayat o pagkumbinsi—mula sa naunang paglalarawan ng pagsunod.
- source_word: διεσκορπίσθησαν
  choice: nagkawatak-watak
  rationale: Natural na Tagalog ito para sa pagkakalat o pagkakahiwa-hiwalay ng isang pangkat matapos mawala ang pinuno nito.
theological_decisions:
- issue: Paglalarawang historikal at pampolitika sa kilusan ni Judas
  choice: Inilarawan siyang bumangon at umakay ng mga taong sumunod sa kanya nang hindi tahasang tinatawag na rebelde.
  alternative: “namuno sa isang paghihimagsik” o “nag-aklas”
  rationale: Bagaman may kontekstong pampolitika ang pangyayari, hindi tahasang gumagamit ang talata ng pangngalan para sa rebelyon. Pinananatili ng salin ang saklaw at pagpipigil ng Griyego.
- issue: Paraan ng pagkamatay ni Judas
  choice: “Nasawi”
  alternative: “pinatay”
  rationale: Ipinahihiwatig ng ἀπώλετο na siya ay namatay o napahamak, ngunit hindi tinutukoy ng talata ang paraan o gumawa nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “sensus” at ang natural na “taga-Galilea.” Ang mga talababa ay inilagay sa mismong pariralang tinutukoy ng bawat alternatibo.
