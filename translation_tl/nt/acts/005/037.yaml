  naturalness: Ang binagong pangungusap ay natural at malinaw sa makabagong Filipino. Ang “hinikayat niyang tumalikod ... at sumunod” ay mas tuwirang naghahatid ng kahulugan kaysa “inakay ... na sumunod.”
  terminology: Ang “Judas na taga-Galilea,” “sensus,” “nasawi,” at “nagkawatak-watak” ay angkop at marangal. Hindi nagdaragdag ang salin ng terminong paghihimagsik o ng tiyak na paraan ng kamatayan.
