  text: καὶ ἐγένετο φόβος μέγας ἐφ’ ὅλην τὴν ἐκκλησίαν καὶ ἐπὶ πάντας τοὺς ἀκούοντας ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/011.yaml
  text: And great fear came upon the whole church and upon all who heard these things[a].
translation:
  language: tl
  text: At nagkaroon ng matinding takot ang buong iglesya at ang lahat ng nakarinig ng mga bagay na ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “iglesya” (ἐκκλησία) ay maaari ring isaling “kapulungan” o “kongregasyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: nagkaroon
  rationale: Kasama ng φόβος bilang simuno, ipinahihiwatig nito ang paglitaw o pagdating ng takot. Ang “nagkaroon ng … takot” ay natural sa modernong Tagalog at nagpapanatili sa pangyayaring naganap.
- source_word: φόβος μέγας
  choice: matinding takot
  rationale: Sa konteksto ng biglaang paghatol kina Ananias at Safira, φόβος ay tunay na takot, hindi lamang pagpipitagan. Ang “matindi” ay likas na katumbas ng nagpapalakas na μέγας.
- source_word: ἐφ’ ὅλην τὴν ἐκκλησίαν
  choice: ang buong iglesya
  rationale: Ang ἐκκλησία rito ay ang kabuuang pamayanan ng mga mananampalataya. Pinananatili ng “buong” ang saklaw ng ὅλην; sa konstruksyong “nagkaroon ng takot ang,” likas nang naipahahayag ang epekto ng ἐπί sa mga taong dinatnan ng takot.
- source_word: πάντας τοὺς ἀκούοντας ταῦτα
  choice: ang lahat ng nakarinig ng mga bagay na ito
  rationale: Ang “nakarinig” ay natural na paglalahad ng participle sa nakaraang salaysay. Pinananatili ng “mga bagay na ito” ang pangmaramihang ταῦτα sa halip na gawing iisang “ito.”
theological_decisions:
- issue: Paglalarawan sa ἐκκλησία
  choice: iglesya
  alternative: kapulungan; kongregasyon
  rationale: Tumutukoy ang salita sa pamayanan ng mga mananampalataya sa konteksto ng Mga Gawa. Ang “iglesya” ang karaniwan at malinaw na katawagan sa modernong Tagalog, nang hindi dinaragdagan ang teksto ng isang tiyak na kaayusang denominasyonal.
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “matinding takot” bilang mas natural kaysa sa literal na “malaking takot,” at pinanatili ang “mga bagay na ito” upang maipakita ang pangmaramihang anyo ng Griyego.
