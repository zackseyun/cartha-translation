  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀λέγων· Παραγγελίᾳ παρηγγείλαμεν ὑμῖν μὴ διδάσκειν ἐπὶ τῷ ὀνόματι τούτῳ, καὶ ἰδοὺ πεπληρώκατε τὴν Ἰερουσαλὴμ τῆς διδαχῆς ὑμῶν, καὶ βούλεσθε ἐπαγαγεῖν ἐφ’ ἡμᾶς τὸ αἷμα τοῦ ἀνθρώπου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/028.yaml
  text: saying[a], “We strictly ordered you not to teach in this name, and look, you have filled Jerusalem with your teaching, and you intend to bring this man's blood upon us.”
translation:
  language: tl
  text: Sinabi niya, “Mahigpit namin kayong inutusan na huwag magturo sa pangalang ito, at tingnan ninyo—pinuno ninyo ang Jerusalem ng inyong turo, at balak ninyong ipasan sa amin ang dugo ng taong ito.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas tahasang pananalita, “panagutin kami sa pagkamatay ng taong ito.” Ang “ipasan sa amin ang dugo” ay idyomang tumutukoy sa pananagutan sa pagkamatay ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: Sinabi niya
  rationale: Ang participle ay nakaugnay sa punong pari sa naunang talata. Ginawang ganap na pangungusap upang maging natural sa Filipino habang pinananatili ang pagpapatuloy ng salaysay.
- source_word: Παραγγελίᾳ παρηγγείλαμεν
  choice: Mahigpit namin kayong inutusan
  rationale: Ang pangngalan at kauri nitong pandiwa ay nagbibigay-diin sa utos. Likas na naihahatid ng “mahigpit” ang diin nang hindi ginagaya ang alanganing pag-uulit sa Griyego.
- source_word: μὴ διδάσκειν
  choice: huwag magturo
  rationale: Tuwirang inilalahad nito ang nilalaman ng pagbabawal at hindi ipinapalagay ang mas interpretibong diwang “tumigil sa pagtuturo.”
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: sa pangalang ito
  rationale: Pinananatili nito ang wika ng pangalan, na sa Mga Gawa ay maaaring tumukoy sa awtoridad at pagkakakilanlang kaugnay ng pangalang iyon, sa halip na paliitin ang diwa sa “tungkol sa.”
- source_word: ἰδοὺ
  choice: tingnan ninyo
  rationale: Naghahatid ito ng mapanuro at mapanagutang diin ng pahayag sa natural na modernong Filipino.
- source_word: πεπληρώκατε τὴν Ἰερουσαλὴμ
  choice: pinuno ninyo ang Jerusalem
  rationale: Pinananatili ang metapora ng pagpuno at ang bunga sa kasalukuyan ng naganap nang pagkilos.
- source_word: τῆς διδαχῆς ὑμῶν
  choice: ng inyong turo
  rationale: Ang “turo” ay malinaw, karaniwan, at hindi gaanong teknikal kaysa “doktrina,” habang tapat sa διδαχή.
- source_word: βούλεσθε
  choice: balak ninyo
  rationale: Ipinapahayag nito ang layunin o hangarin na ipinaparatang sa mga apostol, at natural itong sinusundan ng pandiwang pawatas sa Filipino.
- source_word: ἐπαγαγεῖν ἐφ’ ἡμᾶς
  choice: ipasan sa amin
  rationale: Inilalarawan ng parirala ang paglalagay ng isang pasanin o pananagutan sa kanila. Ang “ipasan” ay natural sa Filipino at pinananatili ang matalinghagang anyo.
- source_word: τὸ αἷμα τοῦ ἀνθρώπου τούτου
  choice: ang dugo ng taong ito
  rationale: Pinananatili nito ang imahen ng dugo at ang mapaglayong pagtukoy na “taong ito,” sa halip na tahasang pangalanan si Jesus o ipaliwanag agad ang pananagutan sa pangunahing teksto.
theological_decisions:
- issue: Diwa ng “ipasan sa amin ang dugo ng taong ito”
  choice: Panatilihin sa pangunahing teksto ang imahen ng dugo bilang pasaning ipinapataw sa mga nagsasalita.
  alternative: “Papanagutin kami sa pagkamatay ng taong ito.”
  rationale: Ang Griyegong idyoma ay nagpapahiwatig ng pananagutan o pagkakasala sa pagkamatay ng isang tao, ngunit hindi ito tahasang ipinapaliwanag sa pangungusap. Pinananatili ng salin ang imahen at tensiyon ng orihinal; nililinaw ng talababa ang ipinahihiwatig na kahulugan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Pero tingnan ninyo” upang mapanatili ang matalim at mapanagutang tono; iniwasan ang mas makalumang “narito” o “masdan.”
