  naturalness: Malinaw at makabago ang pangkalahatang rehistro. Mas natural at mas tuwirang Filipino ang “Kaya’t” para sa resultang ὥστε, at ang “matakpan ng anino” ay mas karaniwang pahayag kaysa “matabingan ng anino” sa ganitong paglalarawan.
  terminology: Ang “maysakit,” “lansangan,” “higaan,” “banig,” at “anino” ay angkop. Pinananatili ng “kahit anino niya lamang” ang minimal na inaasahan sa κἄν nang hindi sinasabing ang anino ang siyang nagpagaling.
