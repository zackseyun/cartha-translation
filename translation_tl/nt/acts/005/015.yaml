    rationale: Nauunawaan ito, ngunit ang “matakpan ... ng anino” ay mas idiomatiko sa modernong Filipino at malinaw na naghahatid ng ἐπισκιάσῃ nang walang dagdag na pahiwatig ng pagpapagaling.
