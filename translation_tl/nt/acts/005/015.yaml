  text: ὥστε ⸂καὶ εἰς⸃ τὰς πλατείας ἐκφέρειν τοὺς ἀσθενεῖς καὶ τιθέναι ἐπὶ ⸀κλιναρίων καὶ κραβάττων, ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ⸀ἐπισκιάσῃ τινὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/015.yaml
  text: so that they even carried the sick out into the streets and laid them on cots and mats[a], so that as Peter was coming by[c][b], even his shadow might overshadow some of them.
translation:
  language: tl
  text: Kaya’t inilalabas pa nga nila ang mga maysakit sa mga lansangan[a] at inihihiga sa mga higaan at banig[b], upang, sa pagdaan ni Pedro, kahit anino niya lamang ay matakpan ang sinuman sa kanila.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa malalawak na daan” o “sa mga pampublikong liwasan.” Maaaring tumukoy ang Griyegong πλατείας sa malalawak na lansangan o bukás na pampublikong lugar.
    reason: lexical_alternative
  - marker: b
    text: O “sa mga kama at papag.” Dalawang magkaibang uri ng higaan o sapin sa pagtulog ang tinutukoy ng Griyego.
    reason: lexical_alternative
  - marker: c
    text: 'Inilalahad ng talata ang layunin ng mga tao: inilagay nila roon ang mga maysakit upang kahit anino lamang ni Pedro ay matakpan ang sinuman sa kanila. Hindi tahasang sinasabi rito na ang anino mismo ang nagpagaling.'
    reason: theological_clarification
lexical_decisions:
- source_word: ὥστε
  choice: Dahil dito
  rationale: Ipinahahayag nito ang bunga ng lumalawak na impluwensiya ng mga apostol sa naunang konteksto.
- source_word: καὶ εἰς τὰς πλατείας
  choice: pa nga ... sa mga lansangan
  rationale: Ipinakikita ng “pa nga” ang diin ng καί, habang ang “mga lansangan” ay natural na katumbas ng malalawak na daan o pampublikong lugar na tinutukoy ng πλατείας.
- source_word: ἐκφέρειν τοὺς ἀσθενεῖς
  choice: inilalabas ... ang mga maysakit
  rationale: Malinaw nitong inilalarawan ang pagdadala sa mga maysakit mula sa loob patungo sa pampublikong lugar.
- source_word: τιθέναι ἐπὶ κλιναρίων καὶ κραβάττων
  choice: inihihiga sa mga higaan at banig
  rationale: Natural ito sa Filipino para sa paglalagay ng mga maysakit sa dalawang magkaibang uri ng tulugan o sapin, nang hindi nagtatakda ng mas tiyak na anyo kaysa sa ipinahihiwatig ng Griyego.
- source_word: ἐρχομένου Πέτρου
  choice: sa pagdaan ni Pedro
  rationale: Nahahagip nito ang kilos na ipinahihiwatig ng genitive absolute—ang paglapit at pagdaan ni Pedro sa kinaroroonan nila.
- source_word: κἂν ἡ σκιὰ ἐπισκιάσῃ
  choice: matabingan man lamang ng anino niya
  rationale: Ang “man lamang” ay nagpapahayag ng pinakakaunting pakikipagdikit na inaasahan nila, at ang “matabingan ng anino” ay natural na Filipino para sa paglaganap o pagtakip ng anino sa isang tao.
- source_word: τινὶ αὐτῶν
  choice: ang ilan sa kanila
  rationale: Ipinahahayag nito na maaaring matabingan ang sinumang indibidwal mula sa pangkat ng mga maysakit.
theological_decisions:
- issue: Kung dapat bang ipahiwatig na ang anino mismo ni Pedro ang may kapangyarihang magpagaling
  choice: Inilalahad lamang ang layunin o pag-asa ng mga tao na matabingan ng anino ni Pedro ang ilan sa mga maysakit.
  alternative: Sabihing ang anino ni Pedro mismo ang nagpagaling sa kanila.
  rationale: Ang ἵνα na sinusundan ng subjunctive ay nagpapahayag dito ng layunin o inaasahang posibilidad. Hindi tahasang sinasabi ng talatang ito na ang anino mismo ang nagpagaling, kaya pinananatili ng salin ang pagpipigil ng salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Ang “Dahil dito,” “pa nga,” at “sa pagdaan” ay natural sa karaniwang mambabasa, habang pinananatili ng “matabingan man lamang” ang pag-asa ng mga tao at ang hindi tahasang pahayag ng Griyego tungkol sa pagpapagaling.
