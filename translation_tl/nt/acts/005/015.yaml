revisions:
- from: Dahil dito, inilalabas pa nga nila ang mga maysakit sa mga lansangan[a] at inihihiga sa mga higaan at banig[b], upang sa pagdaan ni Pedro, matabingan man lamang ng anino niya ang ilan sa kanila.[c]
  to: Kaya’t inilalabas pa nga nila ang mga maysakit sa mga lansangan[a] at inihihiga sa mga higaan at banig[b], upang, sa pagdaan ni Pedro, kahit anino niya lamang ay matakpan ang sinuman sa kanila.[c]
  rationale: Pinalitan ang pangmaramihang “ilan sa kanila” ng singular na walang-tiyak na “sinuman sa kanila” upang tumpak na maipahayag ang τινὶ αὐτῶν. Pinahusay din ang idyoma at ang resultang ugnayan nang hindi binabago ang kahulugan, ang antas ng katiyakan, o ang maingat na pagsasalaysay ng talata tungkol sa anino ni Pedro.
