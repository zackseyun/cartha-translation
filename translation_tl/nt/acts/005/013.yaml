id: ACT.5.13
reference: Acts 5:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τῶν δὲ λοιπῶν οὐδεὶς ἐτόλμα κολλᾶσθαι αὐτοῖς, ἀλλ’ ἐμεγάλυνεν αὐτοὺς ὁ λαός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/013.yaml
  text: But none of the rest dared to join them; rather, the people held them in high esteem.
translation:
  language: tl
  text: Ngunit walang sinuman sa iba ang nangahas na makisama sa kanila; sa halip, mataas ang pagtingin sa kanila ng mga tao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν λοιπῶν
  choice: sa iba
  rationale: Natural na tumutukoy sa iba pang mga taong hindi kabilang sa grupong binanggit, nang hindi nililinaw nang higit sa sinasabi ng Griyego kung sino sila.
- source_word: ἐτόλμα
  choice: nangahas
  rationale: Tumpak na ipinahahayag ang lakas-loob na gawin ang isang bagay sa kabila ng panganib o pangamba.
- source_word: κολλᾶσθαι αὐτοῖς
  choice: makisama sa kanila
  rationale: Ipinahahayag ang paglapit at pakikiugnay sa grupo; mas natural sa modernong Tagalog kaysa sa literal na 'dumikit,' habang hindi kinakailangang gawing pormal na pagiging miyembro.
- source_word: ἐμεγάλυνεν αὐτοὺς ὁ λαός
  choice: mataas ang pagtingin sa kanila ng mga tao
  rationale: Idyomatikong inilalarawan ang pagpupuri, paggalang, o pagpapahalaga ng sambayanan sa kanila.
theological_decisions:
- issue: Pagkakakilanlan ng 'iba' at ng tinutukoy ng 'kanila'
  choice: Hindi tahasang tinukoy; pinanatili bilang 'sa iba' at 'sa kanila.'
  alternative: Tukuyin ang 'iba' bilang mga di-mananampalataya at ang 'kanila' bilang mga apostol o iglesya.
  rationale: Hindi tuwirang nililinaw ng talata ang mga reperent; ang konteksto ay maaaring magtulak sa ilang pagbasa, ngunit nararapat panatilihin ang tunay na kalabuan ng teksto.
- issue: Ugnayan ng dalawang sugnay sa ἀλλά
  choice: sa halip
  alternative: ngunit
  rationale: 'Malinaw na ipinakikita ang kabalintunaan: hindi sila nangahas makisama, samantalang mataas ang pagtingin ng mga tao sa grupo. Hindi nito ginagawang sanhi ang ikalawang sugnay.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'makisama' sa diwang paglapit o pakikiugnay sa isang grupo, hindi lamang pakikisalamuha; iniwasan ang labis na teknikal o denominasyonal na pananalita.
