    issue: Hindi likas ang “Ang Diyos ... ang nagbangon kay Jesus.”
    rationale: Ang “nagbangon” sa anyong ito ay hindi ang karaniwang transitive na pagbuo para sa pagbangon o pag-angat sa isang tao. Ang “Ibinangon ng Diyos ... si Jesus” ay malinaw na nagmamarka kay Jesus bilang layon ng pandiwa at mas maayos sa modernong Tagalog.
  - severity: low
    issue: Medyo mabigat ang “sa pamamagitan ng pagbitin sa kanya.”
    rationale: Sapat at mas idiomatiko ang instrumental na “sa pagbitin sa kaniya,” na naghahatid pa rin ng κρεμάσαντες bilang paraan ng pagpatay.
