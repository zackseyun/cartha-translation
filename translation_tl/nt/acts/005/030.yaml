  text: ὁ θεὸς τῶν πατέρων ἡμῶν ἤγειρεν Ἰησοῦν, ὃν ὑμεῖς διεχειρίσασθε κρεμάσαντες ἐπὶ ξύλου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/030.yaml
  text: The God of our fathers raised up Jesus[b][a], whom you killed by hanging on a tree.
translation:
  language: tl
  text: Ibinangon[a] ng Diyos ng ating mga ninuno si Jesus, na pinatay ninyo sa pagbitin sa kaniya sa isang punongkahoy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “muling binuhay.” Maaaring tumukoy ang pandiwa rito sa muling pagkabuhay, bagaman hindi tahasang sinasabi sa Griyego ng talatang ito na “mula sa mga patay.”
    reason: lexical_alternative
  - marker: b
    text: O “sa isang krus.” Ang literal na nasa Griyego ay “sa isang punongkahoy,” na malamang na umaalingawngaw sa Deuteronomio 21:23.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Ang Diyos ng ating mga ninuno
  rationale: Likas sa modernong Tagalog ang pariralang ito at pinananatili nito ang pormulang tumutukoy sa Diyos na sinamba ng mga ninuno ng Israel. Mas malinaw sa karaniwang mambabasa ang “mga ninuno” kaysa sa literal ngunit maaaring mapagkamalang agarang mga magulang na “mga ama.”
- source_word: ἤγειρεν
  choice: nagbangon
  rationale: Pinananatili ng “nagbangon” ang transitive na diwa ng ἐγείρω at hinahayaang marinig ang pahiwatig ng muling pagkabuhay nang hindi idinaragdag sa pangunahing teksto ang tahasang “mula sa mga patay,” na wala sa talata.
- source_word: Ἰησοῦν
  choice: kay Jesus
  rationale: Karaniwang anyo ng pangalan sa Tagalog; ang “kay” ang likas na pananda sa taong layon ng pandiwa.
- source_word: διεχειρίσασθε
  choice: pinatay ninyo
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa marahas na pagkilos na humantong sa kamatayan. Tuwiran at malinaw ang “pinatay ninyo.”
- source_word: κρεμάσαντες
  choice: sa pamamagitan ng pagbitin sa kanya
  rationale: Ipinakikita ng parirala ang paraang ginamit sa pagpatay at malinaw na tinutukoy si Jesus bilang layon ng pagbitin.
- source_word: ἐπὶ ξύλου
  choice: sa isang punongkahoy
  rationale: Pinananatili nito ang pangunahing leksikal na larawan ng ξύλον at ang malamang na alusyon sa Deuteronomio 21:23, sa halip na agad itong ipakahulugang “krus.”
theological_decisions:
- issue: Kung gagawing tahasan ang muling pagkabuhay sa pagsasalin ng ἤγειρεν
  choice: nagbangon
  alternative: muling binuhay
  rationale: Malakas na ipinahihiwatig ng konteksto ang muling pagkabuhay, ngunit hindi tahasang sinasabi sa talatang ito ang “mula sa mga patay.” Pinananatili ng napiling salita ang saklaw at tensiyon ng Griyego.
- issue: Kung isasalin ang ξύλον bilang “krus” o pananatilihin ang larawan ng punongkahoy
  choice: sa isang punongkahoy
  alternative: sa isang krus
  rationale: ξύλον ang ginamit, hindi σταυρός. Ang “punongkahoy” ay nagpapanatili sa orihinal na larawan at sa posibleng alusyon sa Deuteronomio, habang malinaw pa rin sa konteksto na tumutukoy ito sa pagpapako kay Jesus.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga ninuno” bilang likas na katumbas ng pormulang pangkasulatan, at pinanatili ang “punongkahoy” upang hindi mawala ang intertekstuwal na alusyon.
