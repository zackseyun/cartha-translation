  naturalness: Kailangang ayusin ang pandiwang “nagbangon kay Jesus.” Sa modernong Filipino, mas likas ang “Ibinangon ng Diyos ... si Jesus.” Ang “sa pagbitin sa kaniya” ay mas tuwiran at mas maigsi kaysa “sa pamamagitan ng pagbitin sa kanya,” nang walang pagbabago sa relasyon ng participle sa pangunahing pandiwa.
  terminology: Ang “Diyos ng ating mga ninuno” ay natural at angkop para sa pormulang τῶν πατέρων ἡμῶν. Ang “punongkahoy” ay nararapat na panatilihin kaysa “krus” sa pangunahing teksto. Ang “ibinangon” ay isang angkop na pormal ngunit naiintindihang katumbas na nagpapanatili sa saklaw ng ἐγείρω; ipinapaliwanag ng talababa ang posibleng diwang muling pagkabuhay.
  issues:
