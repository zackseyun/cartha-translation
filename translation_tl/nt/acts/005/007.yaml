  text: After an interval of about three hours, his wife came in, not knowing what had happened.
translation:
  language: tl
  text: Pagkalipas ng humigit-kumulang tatlong oras, pumasok ang asawa niya, na hindi niya alam ang nangyari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Makalipas
  rationale: Ang Ἐγένετο ay idyomatikong naglilipat sa susunod na pangyayari, at ang δὲ ay banayad na pang-ugnay. Sa Filipino, likas na naihahatid ng temporal na pambungad na “Makalipas” ang pag-usad ng salaysay nang hindi nagdaragdag ng tahasang “Ngayon” o mabigat na “At nangyari.”
- source_word: ὡς ὡρῶν τριῶν διάστημα
  choice: ang humigit-kumulang na tatlong oras
  rationale: Tinutukoy ng διάστημα ang lumipas na pagitan ng panahon, at ipinahihiwatig ng ὡς na tinatayang sukat ito. Pinananatili ng “humigit-kumulang” ang aproksimasyon.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: ang asawa niya
  rationale: Sa konteksto, ang γυνή ay tumutukoy sa asawa ni Ananias. Likas sa Filipino ang “asawa niya,” at malinaw ang reperensiya mula sa naunang salaysay.
- source_word: μὴ εἰδυῖα
  choice: na hindi alam
  rationale: Inilalarawan ng participle ang kalagayan ng asawa habang pumapasok siya. Ang sugnay na “na hindi alam” ay natural at pinananatili ang kasabay na di-pagkakaalam.
- source_word: τὸ γεγονὸς
  choice: ang nangyari
  rationale: Ang substantival perfect participle ay tumutukoy sa pangyayaring naganap na bago siya pumasok. Ang “ang nangyari” ay maikli, natural, at tumpak.
- source_word: εἰσῆλθεν
  choice: pumasok
  rationale: Direkta at likas na katumbas ng pagpasok sa lugar; hindi kailangang tukuyin ang direksiyong “naparito” o “pumaroon,” na hindi tahasang nililinaw ng teksto.
