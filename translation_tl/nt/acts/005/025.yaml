  text: παραγενόμενος δέ τις ἀπήγγειλεν αὐτοῖς ὅτι Ἰδοὺ οἱ ἄνδρες οὓς ἔθεσθε ἐν τῇ φυλακῇ εἰσὶν ἐν τῷ ἱερῷ ἑστῶτες καὶ διδάσκοντες τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/025.yaml
  text: But someone came and reported to them[a], “Look, the men whom you put in prison are standing in the temple and teaching the people.”
translation:
  language: tl
  text: Ngunit may dumating at nag-ulat sa kanila, “Tingnan ninyo! Ang mga lalaking ipinasok ninyo sa bilangguan ay nakatayo sa templo[a] at nagtuturo sa mga tao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa mga bakuran ng templo.” Ang Griyegong ἱερόν ay tumutukoy sa buong kompleks ng templo, hindi lamang sa panloob na santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: may dumating
  rationale: Ipinahahayag ng aorist participle ang pagdating ng di-tinukoy na tagapagbalita bago siya nag-ulat; likas sa makabagong Tagalog ang pagkakasunod na ito.
- source_word: δέ
  choice: Ngunit
  rationale: Minamarkahan nito ang banayad na pagliko o pagsalungat sa inaasahan mula sa naunang tagpo.
- source_word: τις
  choice: may
  rationale: Pinananatili nitong di-tiyak ang pagkakakilanlan ng dumating nang hindi nagdaragdag ng kasarian na hindi kailangang idiin sa Tagalog.
- source_word: ἀπήγγειλεν
  choice: nag-ulat
  rationale: Ang pormal na paghahatid ng balita sa mga pinuno ay malinaw na naipahahayag ng “nag-ulat.”
- source_word: Ἰδοὺ
  choice: Tingnan ninyo!
  rationale: Natural at masiglang panawag-pansin ito sa nakakagulat na balita, nang walang makalumang himig.
- source_word: οὓς ἔθεσθε ἐν τῇ φυλακῇ
  choice: ipinasok ninyo sa bilangguan
  rationale: Pinananatili ang konkretong diwa ng paglalagay sa kilalang lugar ng pagkakakulong at natural pa rin sa Tagalog.
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Ang ἱερόν ay tumutukoy sa kompleks ng templo; “sa templo” ang maikli at karaniwang salin, habang nililinaw sa talababa ang mas tiyak na saklaw.
- source_word: ἑστῶτες καὶ διδάσκοντες
  choice: nakatayo ... at nagtuturo
  rationale: Pinananatili ang dalawang sabayang kalagayan o gawain na tahasang binabanggit sa Griyego.
- source_word: τὸν λαόν
  choice: mga tao
  rationale: Likas na kolektibong pagtukoy ito sa mga taong tinuturuan, nang hindi nagdaragdag ng paliwanag na wala sa teksto.
