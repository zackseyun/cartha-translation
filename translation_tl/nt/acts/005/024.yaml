base_translation:
  language: en
  yaml_path: translation/nt/acts/005/024.yaml
  text: When the captain of the temple and the chief priests heard these words[a], they were perplexed about them, wondering what this might come to.
translation:
  language: tl
  text: Nang marinig ng pinuno ng mga bantay sa templo at ng mga punong pari ang balitang ito, litong-lito sila kung ano ang kahihinatnan nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kung ano ang maaaring mangyari dahil dito.” Ang pahayag sa Griyego ay nagtatanong tungkol sa magiging resulta o kahihinatnan ng pangyayari.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  choice: Nang marinig
  rationale: Likas na panandang temporal sa salaysay; naihahatid ng “nang” ang ugnayan ng ὡς sa pandiwang nasa nakaraan, habang hindi na kailangang gawing tahas ang banayad na pang-ugnay na δέ.
- source_word: τοὺς λόγους τούτους
  choice: ang balitang ito
  rationale: Sa konteksto, ang λόγοι ay ang iniulat ng mga bantay sa naunang talata. Mas natural at tiyak sa modernong Tagalog ang “balitang ito” kaysa literal na “mga salitang ito.”
- source_word: ὅ τε στρατηγὸς τοῦ ἱεροῦ
  choice: ang pinuno ng mga bantay sa templo
  rationale: Ang στρατηγός ay opisyal na namamahala sa kaayusan at mga bantay ng templo. Nililinaw ng salin ang tungkulin nang hindi ipinapalagay na pinuno siya ng templo mismo.
- source_word: οἱ ἀρχιερεῖς
  choice: ang mga punong pari
  rationale: Ang maramihang ἀρχιερεῖς ay tumutukoy sa mga pinuno ng kaparian; “mga punong pari” ang malinaw at karaniwang katumbas.
- source_word: διηπόρουν περὶ αὐτῶν
  choice: litong-lito sila
  rationale: Ipinahahayag ng διηπόρουν ang matinding pagkalito at kawalan ng katiyakan. Sa daloy ng Tagalog, hindi na kailangang ulitin ang malabong panghalip na “tungkol sa mga iyon,” sapagkat malinaw na ang balita at pangyayari ang sanhi ng kanilang pagkalito.
- source_word: τί ἂν γένοιτο τοῦτο
  choice: kung ano ang kahihinatnan nito
  rationale: Napananatili ang kawalang-katiyakan ng optative na may ἄν at ang pagtuon sa maaaring resulta o patutunguhan ng pangyayari.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinuno ng mga bantay sa templo” upang maunawaan agad ng karaniwang mambabasa ang tungkulin ng opisyal, at “kahihinatnan” upang likas na maipahayag ang di-tiyak na magiging resulta.
