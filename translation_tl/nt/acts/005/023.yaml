  to: Sinabi nila, “Natagpuan naming mahigpit na nakasara ang bilangguan, na may ganap na seguridad, at nakatayo sa may mga pintuan ang mga bantay. Ngunit nang buksan namin ang mga pintuan, wala kaming natagpuang sinuman sa loob.”
