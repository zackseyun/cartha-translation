  register: Modernong Filipino Tagalog na malinaw at dignified. Pinanatili ang tuwirang ulat, ang larawang nakatayo ang mga bantay sa may mga pintuan, at ang diin na lubos na ligtas ang pagkakasara ng bilangguan.
