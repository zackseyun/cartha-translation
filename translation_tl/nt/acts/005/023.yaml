  source_fidelity: 'Ang salin ay tapat sa pangunahing daloy ng Griyego: ang ulat, ang bilangguan, mga bantay na nakatayo sa mga pintuan, at ang walang natagpuan sa loob. Gayunman, ang “mahigpit na nakasara” lamang ay hindi sapat na malinaw na naipapahayag ang ἐν πάσῃ ἀσφαλείᾳ, ang diin sa ganap na seguridad. Ang malabong “iyon” pagkatapos ng “mga pintuan” ay maaari ring linawin nang walang makabuluhang dagdag sa kahulugan.'
  naturalness: Natural at angkop ang pangkalahatang rehistro. Mas malinaw at mas idiomatiko sa modernong Filipino ang “na may ganap na seguridad” at ang tahasang “ang mga pintuan” kaysa sa “iyon.”
  terminology: Ang “bilangguan,” “mga bantay,” at “sa loob” ay angkop. Ang talababa sa draft ay hindi natural (“nakasara nang lubos na ligtas”) at ang “tiyak ang pagkakasara” ay hindi wastong nagpapaliwanag ng diin sa seguridad.
