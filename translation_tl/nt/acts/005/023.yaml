base_translation:
  language: en
  yaml_path: translation/nt/acts/005/023.yaml
  text: saying[a], “We found the prison securely locked, and the guards standing at the doors; but when we opened it, we found no one inside.”
translation:
  language: tl
  text: Sinabi nila, “Natagpuan naming mahigpit na nakasara ang bilangguan, na may ganap na seguridad, at nakatayo sa may mga pintuan ang mga bantay. Ngunit nang buksan namin ang mga pintuan, wala kaming natagpuang sinuman sa loob.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: Sinabi nila, “
  rationale: Ipinakikilala ng pariralang ito ang tuwirang ulat ng mga tauhan mula sa naunang talata. Natural sa modernong Tagalog ang tahasang pandiwang “Sinabi nila” habang pinananatili ang ugnayan sa salaysay.
- source_word: δεσμωτήριον
  choice: bilangguan
  rationale: Tumutukoy ito sa lugar na pinagkulungan. Ang “bilangguan” ay malinaw, dignified, at karaniwang katumbas sa modernong Tagalog.
- source_word: κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ
  choice: mahigpit na nakasara
  rationale: Ipinahihiwatig ng perfect passive participle ang nananatiling kalagayan ng pagkakasara, at idinidiin ng ἐν πάσῃ ἀσφαλείᾳ na lubos itong ligtas o tiyak. Natural na naipapahayag ito ng “mahigpit na nakasara”; inilalagay sa talababa ang mas tahasang alternatibo.
- source_word: φύλακας ἑστῶτας
  choice: nakatayo ... ang mga bantay
  rationale: Ang φύλακες ay mga bantay sa konteksto ng bilangguan, at inilalarawan sila ng ἑστῶτας na nakatayo sa kanilang kinalalagyan. Pinananatili ng salin ang nakikitang detalye nang hindi ipinapalagay ang higit pa sa teksto.
- source_word: ἐπὶ τῶν θυρῶν
  choice: sa may mga pintuan
  rationale: Ipinapahayag dito ng ἐπί na malapit o nasa tapat ng mga pintuan ang mga bantay. Ang “sa may mga pintuan” ay natural at hindi labis na tiyak sa eksaktong posisyon.
- source_word: ἀνοίξαντες
  choice: nang buksan namin iyon
  rationale: Ang aorist participle ay natural na isinasaling bilang pangyayaring nauna sa pagkakatuklas. Walang hayag na layon sa Griyego; ang “iyon” ay maingat na tumutukoy sa binuksang bilangguan o pasukan ayon sa konteksto.
- source_word: ἔσω
  choice: sa loob
  rationale: Ginagamit itong pang-abay na tumutukoy sa loob ng bilangguan. Ang “sa loob” ang malinaw at karaniwang modernong salin.
- source_word: οὐδένα
  choice: wala kaming natagpuang sinuman
  rationale: Ipinahahayag nito na walang taong natagpuan. Ang hulmaing ito ay malinaw at natural sa Tagalog habang pinananatili ang diin ng negatibong pahayag.
