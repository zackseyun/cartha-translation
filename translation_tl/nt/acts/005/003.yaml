id: ACT.5.3
reference: Acts 5:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀ὁ Πέτρος· Ἁνανία, διὰ τί ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου, ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον καὶ ⸀νοσφίσασθαι ἀπὸ τῆς τιμῆς τοῦ χωρίου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/003.yaml
  text: But Peter said[a], “Ananias[d][c][b], why has Satan filled your heart to lie to the Holy Spirit and to keep back some of the price of the land?”
translation:
  language: tl
  text: Ngunit sinabi ni Pedro, “Ananias, bakit pinuno ni Satanas ang puso mo para magsinungaling ka sa Banal na Espiritu[a] at magtabi para sa sarili mo ng bahagi ng pinagbilhan ng lupa[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “dayain ang Banal na Espiritu,” ngunit mas tuwiran dito ang “magsinungaling ... sa.”
    reason: lexical_alternative
  - marker: b
    text: Ang “lupa” ay maaari ring isaling “ari-arian” o “bukid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ ὁ Πέτρος
  choice: Ngunit sinabi ni Pedro
  rationale: Ang δέ ay banayad na pang-ugnay na may salungat na himig dito; natural sa Filipino ang “Ngunit” sa biglang pagharap ni Pedro kay Ananias.
- source_word: διὰ τί
  choice: bakit
  rationale: Ito ang tuwiran at likas na katumbas ng tanong tungkol sa dahilan.
- source_word: ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου
  choice: pinuno ni Satanas ang puso mo
  rationale: Pinananatili nito ang metapora at si Satanas bilang simuno, nang hindi ipinapakahulugang lubos na sinapian o nawalan ng pananagutan si Ananias.
- source_word: ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον
  choice: para magsinungaling ka sa Banal na Espiritu
  rationale: Likas sa modernong Filipino at pinananatili ang ugnayang layunin/bunga ng pawatas sa naunang “pinuno ... ang puso mo.” Ang ψεύδομαι na may tuwirang taong layon ay tumutukoy rito sa pagsisinungaling sa isang persona.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Banal na Espiritu
  rationale: Karaniwan, malinaw, at marangal na katawagan sa modernong Filipino.
- source_word: νοσφίσασθαι
  choice: magtabi para sa sarili mo
  rationale: Ipinahahayag nito ang pagtatago o pagkakaltas para sa sarili ng isang bahagi, nang hindi gumagamit ng masyadong teknikal o mapanghusgang salitang gaya ng “lustayin” o “embezzle.”
- source_word: ἀπὸ τῆς τιμῆς
  choice: ng bahagi ng pinagbilhan
  rationale: Ipinakikita ng ἀπό na bahagi lamang ng kabuuang halagang natanggap ang itinabi; natural sa Filipino ang “pinagbilhan” para sa halaga o proceeds ng bentahan.
- source_word: τοῦ χωρίου
  choice: ng lupa
  rationale: Ang χωρίον ay maaaring tumukoy sa lupa, bukid, o ari-arian; ang “lupa” ay natural at sapat na tiyak sa konteksto.
theological_decisions:
- issue: Ang pagkilos ni Satanas at ang pananagutan ni Ananias
  choice: Panatilihin ang “pinuno ni Satanas ang puso mo” habang tahasang si Ananias ang nagsisinungaling at nagtatabi.
  alternative: “Bakit mo hinayaang sakupin ka ni Satanas?”
  rationale: Si Satanas ang simuno ng ἐπλήρωσεν sa Griyego, ngunit nananatiling kinakausap si Ananias bilang may pananagutan. Hindi nilulutas ng salin ang tensiyong ito sa pamamagitan ng pagdaragdag ng pahintulot, sapilitang pagkontrol, o pagsapi.
- issue: Pagsisinungaling sa Banal na Espiritu
  choice: magsinungaling ka sa Banal na Espiritu
  alternative: dayain mo ang Banal na Espiritu
  rationale: Pinananatili ng tuwirang pananalita ang personal na layon ng pandiwa at ang matinding pahayag ng teksto tungkol sa Banal na Espiritu, nang walang idinaragdag na paliwanag na doktrinal.
- issue: Ugnayan ng pagpuno sa puso at ng dalawang pawatas
  choice: para magsinungaling ... at magtabi
  alternative: kaya nagsinungaling ... at nagtabi
  rationale: Ang konstruksyon ay maaaring magpahiwatig ng layunin o bunga. Ang “para” ay likas sa Filipino at hindi ginagawang dalawang hiwalay na naganap na kilos ang mga pawatas.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “pinuno” sa halip na mas arkaikong “pinuspos,” at “magtabi para sa sarili” sa halip na teknikal o labis na kolokyal na pananalita. Ang pangungusap ay nagpapanatili sa metapora at sa teolohikal na tensiyon ng Griyego.
