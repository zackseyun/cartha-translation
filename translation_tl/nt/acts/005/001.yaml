  text: Ἀνὴρ δέ τις Ἁνανίας ὀνόματι σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ ἐπώλησεν κτῆμα
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/001.yaml
  text: But a man named Ananias[a], with Sapphira his wife, sold a piece of property.
translation:
  language: tl
  text: Ngunit isang lalaking nagngangalang Ananias, kasama ang asawa niyang si Safira, ang nagbenta ng isang ari-arian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang pag-aari”; malawak ang saklaw ng salitang Griyego at maaaring tumukoy sa isang pag-aari o ari-arian.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: Ngunit isang lalaki
  rationale: Ipinakikilala ng ἀνήρ τις ang isang lalaki sa salaysay, at ipinahihiwatig ng δέ ang paghahambing na pasalungat sa naunang halimbawa ni Bernabe.
- source_word: Ἁνανίας ὀνόματι
  choice: nagngangalang Ananias
  rationale: Likas sa makabagong Tagalog ang “nagngangalang” para sa idyomang ὀνόματι, habang pinananatili ang karaniwang anyo ng pangalang Ananias.
- source_word: σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ
  choice: kasama ang asawa niyang si Safira
  rationale: Ang σύν ay nagsasaad ng pagsama, at malinaw na “asawa” ang kahulugan ng γυνή sa kontekstong may kaugnayang pag-aasawa.
- source_word: ἐπώλησεν
  choice: ang nagbenta
  rationale: Tuwirang ipinapahayag ng aorist na ἐπώλησεν ang natapos na kilos ng pagbebenta; ginamit ang ayos na “ang nagbenta” upang maging natural ang mahabang simuno sa Tagalog.
- source_word: κτῆμα
  choice: isang ari-arian
  rationale: Malawak ang κτῆμα at maaaring tumukoy sa isang pag-aari o real property. Ang “ari-arian” ay natural at hindi labis na tumutukoy kung lupa, bahay, o ibang pag-aari iyon.
theological_decisions:
- issue: Pasalungat na ugnayan sa naunang halimbawa ni Bernabe
  choice: Isinalin ang δέ bilang “Ngunit.”
  alternative: Maaaring “Samantala” o simpleng hindi tahasang isalin ang pang-ugnay.
  rationale: Ipinakikita ng konteksto ang paghahambing ng ginawa ni Bernabe at ng sumunod na ginawa nina Ananias at Safira. Pinananatili ng “Ngunit” ang banayad ngunit malinaw na pasalungat na puwersa ng δέ nang hindi ipinapaliwanag nang labis ang salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang natural na ayos ng pangungusap at ang tunay na lawak ng kahulugan ng κτῆμα.
