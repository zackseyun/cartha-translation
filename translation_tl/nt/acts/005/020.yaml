  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πορεύεσθε καὶ σταθέντες λαλεῖτε ἐν τῷ ἱερῷ τῷ λαῷ πάντα τὰ ῥήματα τῆς ζωῆς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/020.yaml
  text: Go and stand in the temple[c][b][a], and speak to the people all the words of this life.
translation:
  language: tl
  text: “Humayo kayo, tumayo sa mga bakuran ng templo, at sabihin ninyo sa mga tao ang lahat ng salita ng buhay na ito.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang lahat ng salita tungkol sa buhay na ito” o “ang lahat ng salita ukol sa ganitong pamumuhay.” Maaaring tumukoy ang parirala sa buhay na ipinahahayag sa ebanghelyo.
    reason: alternative_reading
lexical_decisions:
- source_word: Πορεύεσθε
  choice: Humayo kayo
  rationale: Likas at marangal na pautos sa Filipino na malinaw na nagpapahayag ng pag-alis at pagtungo.
- source_word: σταθέντες
  choice: tumayo
  rationale: Isinalin bilang kasunod na kilos na kaugnay ng pangunahing utos; natural nitong ipinapakita ang pagkakasunod ng pagpunta, pagtayo, at pagsasalita.
- source_word: λαλεῖτε
  choice: sabihin ninyo
  rationale: Malawak at karaniwang pandiwa para sa pagsasalita sa mga tao; hindi nito idinaragdag ang mas tiyak na diwa ng pormal na pagpapahayag na wala sa pandiwang Griyego.
- source_word: ἐν τῷ ἱερῷ
  choice: sa mga bakuran ng templo
  rationale: Ang ἱερόν ay tumutukoy sa buong kompleks ng templo, hindi lamang sa panloob na santuwaryo; ang pariralang ito ay malinaw at natural sa Filipino.
- source_word: τῷ λαῷ
  choice: sa mga tao
  rationale: Tuwirang salin na hindi nagpapakitid sa tinutukoy bilang pulutong lamang o tahasang nagdaragdag ng etnikong paglalarawan.
- source_word: πάντα τὰ ῥήματα
  choice: ang lahat ng salita
  rationale: Pinananatili ang kabuuang diwa ng πάντα at ang maramihang ῥήματα nang hindi agad ginagawang interpretatibong 'buong mensahe.'
- source_word: τῆς ζωῆς ταύτης
  choice: tungkol sa buhay na ito
  rationale: Sa Filipino, mas natural ang 'tungkol sa' para sa mga salitang may nilalaman o paksa, habang nananatiling bukás ang kahulugan ng 'buhay na ito.'
theological_decisions:
- issue: Kahulugan ng τῆς ζωῆς ταύτης (“buhay na ito”)
  choice: Panatilihin ang “buhay na ito” nang walang paliwanag sa mismong talata.
  alternative: “bagong buhay na ito,” “ganitong pamumuhay,” o “mensaheng nagbibigay-buhay”
  rationale: Maaaring tumukoy ang parirala sa buhay na ipinahahayag sa ebanghelyo, sa bagong buhay kay Jesus, o sa mensaheng kaugnay nito. Hindi nilulutas ng Griyego ang lahat ng posibilidad, kaya pinananatili ang maikli at mayamang pahayag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mga bakuran ng templo” upang malinaw na maipakita na ang ἱερόν ay ang kompleks ng templo, hindi lamang ang pinakaloob na santuwaryo. Ang “Humayo” ay bahagyang mataas ang register ngunit pamilyar at angkop sa tuwirang utos ng isang anghel.
