id: ACT.5.21
reference: Acts 5:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ εἰσῆλθον ὑπὸ τὸν ὄρθρον εἰς τὸ ἱερὸν καὶ ἐδίδασκον. Παραγενόμενος δὲ ὁ ἀρχιερεὺς καὶ οἱ σὺν αὐτῷ συνεκάλεσαν τὸ συνέδριον καὶ πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ, καὶ ἀπέστειλαν εἰς τὸ δεσμωτήριον ἀχθῆναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/021.yaml
  text: When they heard this[a], they entered the temple courts at daybreak and were teaching. But when the high priest arrived, and those with him, they called together the Sanhedrin and the whole council of the sons of Israel, and sent to the prison to have them brought.
translation:
  language: tl
  text: Nang marinig nila ito, pumasok sila sa mga patyo ng templo nang magbukang-liwayway at nagtuturo roon. Nang dumating ang punong pari at ang mga kasama niya, ipinatawag nila ang Sanhedrin at ang buong kapulungan ng matatandang pinuno ng mga anak ni Israel[a], at nagsugo sila sa bilangguan upang ipasundo ang mga apostol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang buong kapulungan ng matatandang pinuno ng Israel” o “ang buong konseho ng Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Nang marinig nila ito
  rationale: Ang aorist participle ay temporal at tumutukoy sa utos ng anghel sa naunang talata; malinaw at natural sa Tagalog ang tahasang “ito.”
- source_word: ὑπὸ τὸν ὄρθρον
  choice: pagsapit ng bukang-liwayway
  rationale: Ipinahahayag ng parirala ang oras sa madaling-araw; marangal at madaling maunawaan ang “bukang-liwayway.”
- source_word: εἰς τὸ ἱερὸν
  choice: sa mga patyo ng templo
  rationale: Ang ἱερόν ay tumutukoy sa malawak na kompleks o bakuran ng templo, hindi lamang sa santuwaryo; nililinaw ito ng “mga patyo.”
- source_word: ἐδίδασκον
  choice: nagtuturo roon
  rationale: Pinananatili ng aspektong imperpekto ang nagpapatuloy na gawain; tumutulong ang “roon” sa natural na daloy sa Tagalog.
- source_word: Παραγενόμενος
  choice: dumating
  rationale: Inilalahad ng aorist participle ang kasunod na pangyayari; natural sa salaysay ang tahasang pandiwang “dumating.”
- source_word: οἱ σὺν αὐτῷ
  choice: ang mga kasama niya
  rationale: Tapat ito sa di-tiyak na pagkakakilanlan ng grupong kasama ng punong pari at hindi nagdaragdag ng posisyong hindi sinabi sa Griyego.
- source_word: συνεκάλεσαν
  choice: Ipinatawag nila
  rationale: Ang pandiwa ay nangangahulugang tipunin sa pamamagitan ng pagtawag o pagpapatawag; ang “ipinatawag” ay natural para sa pormal na pagpupulong.
- source_word: τὸ συνέδριον
  choice: ang Sanhedrin
  rationale: Ginagamit ang kinikilalang makasaysayang katawagan para sa namumunong konsehong Judio, sa halip na alisin ang espesipikong institusyon.
- source_word: πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ
  choice: ang buong kapulungan ng matatandang pinuno ng mga anak ni Israel
  rationale: Ipinakikita ng “kapulungan ng matatandang pinuno” ang elder-body na tinutukoy ng γερουσία, habang pinananatili ng “mga anak ni Israel” ang tahasang pananalitang pampamilya at pambansa.
- source_word: δεσμωτήριον
  choice: bilangguan
  rationale: Karaniwan, malinaw, at pormal na katumbas ito ng lugar ng pagkakapiit.
- source_word: ἀχθῆναι αὐτούς
  choice: upang ipakuha ang mga apostol
  rationale: Ipinahahayag ng pasibong infinitive ang layunin ng pagsusugo upang dalhin sa kanila ang mga bilanggo. Tinukoy na “mga apostol” ang panghalip para maging malinaw sa Tagalog ang reperensiya nang hindi binabago ang kahulugan.
theological_decisions:
- issue: Pagpapakahulugan sa τῶν υἱῶν Ἰσραήλ
  choice: ng mga anak ni Israel
  alternative: ng Israel / ng mga Israelita
  rationale: Pinananatili ang tahasang familial-national na anyo ng Griyego at ang tunay na maskulinong ekspresyon, bagaman maaari itong unawain sa mas idyomatikong paraan bilang pagtukoy sa buong Israel.
- issue: Ugnayan ng συνέδριον at γερουσίαν
  choice: ang Sanhedrin at ang buong kapulungan ng matatandang pinuno
  alternative: ang Sanhedrin, samakatuwid, ang buong kapulungan ng matatandang pinuno
  rationale: Pinananatili ang pang-ugnay na καί (“at”) at ang posibleng pagkakaiba o pagpapalawak ng dalawang katawagan, sa halip na tiyakang gawing apposisyon ang parirala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “punong pari,” “Sanhedrin,” “kapulungan,” at “bilangguan” para sa malinaw na makasaysayan at pormal na tono. Hinati sa dalawang pangungusap ang ikalawang bahagi upang maiwasan ang mabigat na kayarian, nang hindi binabago ang pagkakasunod ng mga pangyayari.
