revisions:
- from: Nang marinig nila ito, pumasok sila sa mga patyo ng templo pagsapit ng bukang-liwayway at nagtuturo roon. Samantala, dumating ang punong pari at ang mga kasama niya. Ipinatawag nila ang Sanhedrin at ang buong kapulungan ng matatandang pinuno ng mga anak ni Israel[a], at nagsugo sila sa bilangguan upang ipakuha ang mga apostol.
  to: Nang marinig nila ito, pumasok sila sa mga patyo ng templo nang magbukang-liwayway at nagtuturo roon. Nang dumating ang punong pari at ang mga kasama niya, ipinatawag nila ang Sanhedrin at ang buong kapulungan ng matatandang pinuno ng mga anak ni Israel[a], at nagsugo sila sa bilangguan upang ipasundo ang mga apostol.
