  naturalness: Marangal at natural ang rehistro. Ang «nang magbukang-liwayway» ay mas tuwiran kaysa «pagsapit ng bukang-liwayway» sa pangungusap na ito, at ang pagpapanatili sa iisang pangungusap ng ikalawang salaysay ay mas malinaw na nagpapakita ng sunod-sunod na kilos.
  terminology: Ang «punong pari», «Sanhedrin», «mga patyo ng templo», at «bilangguan» ay angkop. Ang «kapulungan ng matatandang pinuno» ay katanggap-tanggap na modernong paglalarawan ng γερουσία. Pinananatili ang «mga anak ni Israel» at ang footnote para sa mas idyomatikong mga alternatibo.
