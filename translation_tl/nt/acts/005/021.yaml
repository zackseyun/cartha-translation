    issue: Ang «Samantala» ay hindi malinaw na nagmamarka sa temporal na ugnayan ng Παραγενόμενος.
    rationale: Ang Griyego ay nagpapakilala ng kasunod na pangyayari sa pamamagitan ng participle, «nang dumating ang punong pari». Ang «Samantala» ay maaaring magpahiwatig ng sabayang pangyayari sa halip na simpleng pagsunod sa salaysay.
  - severity: low
    issue: Ang «upang ipakuha ang mga apostol» ay medyo hindi gaanong likas sa kontekstong pormal.
    rationale: Bagaman nauunawaan, ang «upang ipasundo ang mga apostol» ay mas natural na Tagalog para sa pagpapadala sa bilangguan upang dalhin ang mga bilanggo sa mga nagpatawag.
