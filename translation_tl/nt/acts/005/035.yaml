  text: εἶπέν τε πρὸς αὐτούς· Ἄνδρες Ἰσραηλῖται, προσέχετε ἑαυτοῖς ἐπὶ τοῖς ἀνθρώποις τούτοις τί μέλλετε πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/035.yaml
  text: And he said to them[a], “Men of Israel, be careful what you are about to do with these men.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Mga lalaking Israelita, mag-ingat kayo sa gagawin ninyo sa mga taong ito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπέν τε
  choice: At sinabi niya
  rationale: Ang τέ ay banayad na nag-uugnay sa sinabi sa naunang salaysay; natural na pinananatili ito ng “At” nang hindi labis na binibigyang-diin ang pagkakasunod o bunga.
- source_word: πρὸς αὐτούς
  choice: sa kanila
  rationale: Kasama ng pandiwang “sinabi,” likas na tinutukoy ng πρός + accusative ang mga kinakausap; karaniwang salin sa Tagalog ang “sa kanila.”
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Mga lalaking Israelita
  rationale: Pinananatili nito ang tuwirang panawagang panlalaki at ang pagkakakilanlang Israelita sa Griyego, habang malinaw at natural sa makabagong Tagalog.
- source_word: προσέχετε ἑαυτοῖς
  choice: mag-ingat kayo
  rationale: Ipinahahayag nito ang utos na maging maingat at bantayan ang sariling pagkilos; ang panghalip na “kayo” at ang kasunod na “balak ninyong gawin” ay naghahatid ng reflexive na diwa.
- source_word: ἐπὶ τοῖς ἀνθρώποις τούτοις
  choice: sa mga taong ito
  rationale: Tinutukoy ng parirala ang mga taong magiging paksa o tatanggap ng kanilang gagawin. Hindi ginamit ang “laban sa” upang hindi magdagdag ng antas ng pagkapoot na hindi tahasang nakasaad sa Griyego.
- source_word: τί μέλλετε πράσσειν
  choice: sa balak ninyong gawin
  rationale: Sa konteksto, ang μέλλω + infinitive ay tumutukoy sa nalalapit o nilalayong pagkilos. Ang “balak ninyong gawin” ay natural na Tagalog at malinaw na naghahatid ng intensiyon, bagaman maaari ring bigyang-diin ng parirala ang nalalapit na pagkilos.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormal na panawagang “Mga lalaking Israelita,” ngunit ginawang likas sa Tagalog ang babala bilang “mag-ingat kayo sa balak ninyong gawin.”
