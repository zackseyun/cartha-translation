base_translation:
  language: en
  yaml_path: translation/nt/acts/005/012.yaml
  text: Many signs and wonders were being done among the people through the hands of the apostles[b][a], and they were all together in Solomon’s Portico.
translation:
  language: tl
  text: Maraming tanda at kababalaghan ang nagaganap sa gitna ng mga tao sa pamamagitan ng mga kamay ng mga apostol. At silang lahat ay sama-sama[a] sa Portiko ni Solomon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagkakaisa.” Idiniriin ng salitang Griyego ang kanilang pagkakaisa ng layunin, gayundin ang kanilang pagsasama-sama.
    reason: lexical_alternative
  - marker: b
    text: O “Kolonada ni Solomon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ ... τῶν χειρῶν τῶν ἀποστόλων
  choice: Sa pamamagitan ng mga kamay ng mga apostol
  rationale: Pinananatili ang kongkretong idyomang Griyego na “sa pamamagitan ng mga kamay” at ang diwa ng mga apostol bilang kasangkapan o tagapamagitan ng pagkilos.
- source_word: δὲ
  choice: At
  rationale: Dito, ang δέ ay banayad na nag-uugnay at nagpapatuloy sa salaysay, hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: ἐγίνετο
  choice: patuloy na ginagawa
  rationale: Ipinahahayag ng imperfect ang nagpapatuloy o paulit-ulit na pagkilos sa nakaraan; malinaw itong naihahatid ng “patuloy na ginagawa.”
- source_word: σημεῖα καὶ τέρατα
  choice: mga tanda at kababalaghan
  rationale: Ito ang likas at pamilyar na salin ng tambalang salita ni Lucas nang hindi nagdaragdag ng tahasang paliwanag na “makahimala.”
- source_word: πολλὰ
  choice: maraming
  rationale: Tuwirang ipinakikita ang dami ng mga tanda at kababalaghan.
- source_word: ἐν τῷ λαῷ
  choice: sa gitna ng mga tao
  rationale: Likas sa modernong Tagalog at hindi nililimitahan ang tinutukoy sa isang pangkat-etniko na hindi tahasang binanggit sa parirala.
- source_word: ὁμοθυμαδὸν
  choice: sama-sama
  rationale: Malinaw at likas na ipinahahayag ang sama-samang pagtitipon; inilalahad sa talababa ang kaugnay na diwa ng pagkakaisa.
- source_word: ἅπαντες
  choice: silang lahat
  rationale: Pinananatili ang komprehensibong saklaw habang iniiwang di-tiyak ang pangkat na tinutukoy ng panghalip.
- source_word: Στοᾷ Σολομῶντος
  choice: Portiko ni Solomon
  rationale: Ang “portiko” ay angkop na katawagang pang-arkitektura para sa isang may-bubong na hanay ng mga haligi; ibinibigay sa talababa ang mas naglalarawang alternatibo.
theological_decisions:
- issue: Ang tinutukoy ng “silang lahat”
  choice: Hindi tinukoy kung ang panghalip ay tumutukoy lamang sa mga apostol o sa mas malawak na pangkat ng mga mananampalataya.
  alternative: Tukuyin nang tahasan bilang “lahat ng mga apostol” o “lahat ng mananampalataya.”
  rationale: Hindi tahasang binabanggit sa Griyego ang antecedent ng ἅπαντες. Pinananatili ng salin ang tunay na kalabuan sa halip na magpasya para sa isang interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang kongkretong idyoma ng “mga kamay,” ang aspektong nagpapatuloy ng pandiwa, at ang di-tiyak na tinutukoy ng “silang lahat.”
