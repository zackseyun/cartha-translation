revisions:
- from: Sa pamamagitan ng mga kamay ng mga apostol, maraming tanda at kababalaghan ang patuloy na ginagawa sa gitna ng mga tao. At silang lahat ay sama-sama[a] sa Portiko ni Solomon.[b]
  to: Maraming tanda at kababalaghan ang nagaganap sa gitna ng mga tao sa pamamagitan ng mga kamay ng mga apostol. At silang lahat ay sama-sama[a] sa Portiko ni Solomon.[b]
  rationale: Pinalitan ang “patuloy na ginagawa” ng “nagaganap” upang mas natural na maihatid ang imperfect na ἐγίνετο sa Tagalog at maiwasan ang hindi sinasadyang kasalukuyang-panahong pagbasa. Pinanatili ang “sa pamamagitan ng mga kamay ng mga apostol,” ang kalabuan ng “silang lahat,” at lahat ng umiiral na footnote anchor at nilalaman.
