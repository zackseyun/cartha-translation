base_translation:
  language: en
  yaml_path: translation/nt/acts/005/026.yaml
  text: Then the captain went with the officers and brought them[a], not with force, for they were afraid of the people, lest they be stoned.
translation:
  language: tl
  text: Pagkatapos, nagtungo ang pinuno ng mga bantay sa templo[a] kasama ang mga tauhan at dinala niya ang mga apostol, ngunit hindi siya gumamit ng dahas, sapagkat natatakot silang batuhin sila ng mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “strategos.” Tinutukoy rito ang opisyal na namamahala sa kaayusan sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατηγὸς
  choice: pinuno ng mga bantay sa templo
  rationale: Tumutukoy ito sa opisyal na namamahala sa kaayusan sa templo, hindi sa isang Romanong heneral. Nililinaw ng salin ang tungkulin sa konteksto.
- source_word: ὑπηρέταις
  choice: mga tauhan
  rationale: Ang tinutukoy ay mga tauhang nasa ilalim ng pinuno at kasama niya sa pagkuha sa mga apostol. Likas ito sa Filipino at hindi labis na tumutukoy sa kanilang eksaktong katungkulan.
- source_word: ἤγαγεν αὐτούς
  choice: dinala nila ang mga apostol
  rationale: Ang ἄγω ay nangangahulugang akayin o dalhin. Ginawang tahas ang reperente ng αὐτούς bilang 'mga apostol' para sa malinaw at natural na Filipino; ang maramihang pandiwa ay umaayon sa pinuno kasama ng kanyang mga tauhan bilang gumaganap.
- source_word: οὐ μετὰ βίας
  choice: hindi sila gumamit ng dahas
  rationale: Malinaw at karaniwang paraan ito ng pagsasabi na hindi isinagawa ang pagkuha sa pamamagitan ng puwersa o karahasan.
- source_word: ἐφοβοῦντο γὰρ τὸν λαόν
  choice: sapagkat natatakot sila ... sa mga tao
  rationale: Pinananatili ang dahilan at ang patuloy na takot sa sitwasyon. Sa natural na Filipino, ang bagay ng takot ay naipapakita sa kasunod na sugnay tungkol sa pagbato.
- source_word: μὴ λιθασθῶσιν
  choice: batuhin sila ng mga tao
  rationale: Ipinahahayag nito ang kinatatakutang mangyari. Bagaman pasibo ang Griyego, mas natural sa Filipino ang aktibong ayos, at malinaw sa konteksto na ang mga tao ang maaaring bumato sa kanila.
- source_word: τότε ἀπελθὼν
  choice: Pagkatapos, pumunta
  rationale: Isinasalin ang sunod-sunod na kilos sa maayos at likas na salaysay sa Filipino nang hindi ginagawang mabigat ang participial construction.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang 'dahas' para sa sapilitang karahasan at 'mga tauhan' para maiwasan ang sobrang espesipikong katawagang hindi tahasang nasa Griyego. Ang marker na [a] ay inilagay agad pagkatapos ng pariralang ipinapaliwanag nito.
