  text: οἱ μὲν οὖν ἐπορεύοντο χαίροντες ἀπὸ προσώπου τοῦ συνεδρίου ὅτι ⸂κατηξιώθησαν ὑπὲρ τοῦ ὀνόματος⸃ ἀτιμασθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/041.yaml
  text: So they went on their way from the presence of the council[a], rejoicing that they had been counted worthy to be dishonored for the Name.
translation:
  language: tl
  text: Kaya umalis sila mula sa harapan ng Konseho, na nagagalak sapagkat itinuring silang karapat-dapat na dumanas ng paghamak alang-alang sa Pangalan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaaring isalin: “alang-alang sa pangalan ni Jesus.” Sa Griyego: “ang Pangalan,” isang mapitagang pinaikling pagtukoy na hindi tahasang ipinaliliwanag sa talata.'
    reason: Ipinapaliwanag ang malamang na tinutukoy ng absolutong pariralang Griyego nang hindi ito idinaragdag sa pangunahing teksto.
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: umalis sila
  rationale: Ipinahihiwatig ng imperfect ang kanilang paglayo mula sa Konseho. Natural sa salaysay ang “umalis sila,” bagaman hindi nito tahasang inilalarawan ang nagpapatuloy na pagkilos.
- source_word: χαίροντες
  choice: na nagagalak
  rationale: Pinananatili nito ang kasabay na kalagayan o paraan ng kanilang pag-alis at ang kaugnayan nito sa sumunod na dahilan.
- source_word: ἀπὸ προσώπου τοῦ συνεδρίου
  choice: mula sa harap ng Konseho
  rationale: Ang “mula sa harap” ay nagpapanatili sa idyomang tumutukoy sa pag-alis mula sa presensiya ng namamahalang kapulungan, habang ang “Konseho” ay madaling maunawaan ng karaniwang mambabasa.
- source_word: συνεδρίου
  choice: Konseho
  rationale: Tumutukoy ito sa namamahalang konsehong Judio na kilala bilang Sanhedrin. Isinalin ang katawagan sa halip na basta baybayin sa Tagalog upang maging mas madaling maunawaan.
- source_word: κατηξιώθησαν
  choice: itinuring silang karapat-dapat
  rationale: Pinananatili ng anyong balintiyak ang diwang may kumilalang karapat-dapat sila, nang hindi tahasang tinutukoy kung sino ang gumawa nito.
- source_word: ὑπὲρ
  choice: alang-alang sa
  rationale: Natural nitong ipinapahayag na ang paghamak ay dinanas kaugnay ng at dahil sa Pangalan.
- source_word: τοῦ ὀνόματος
  choice: Pangalan
  rationale: Pinananatili ang absolutong “ang Pangalan” bilang mapitagang pinaikling pagtukoy, sa halip na idagdag sa pangunahing teksto ang referenteng hindi tahasang binanggit sa Griyego.
- source_word: ἀτιμασθῆναι
  choice: na hamakin
  rationale: Ang “hamakin” ay natural na modernong Filipino para sa pagtrato nang walang dangal at pinananatili ang balintiyak na karanasan ng mga apostol.
theological_decisions:
- issue: Absolutong gamit ng “ang Pangalan”
  choice: Panatilihin ang “Pangalan” nang hindi pinalalawak sa pangunahing teksto.
  alternative: ang pangalan ni Jesus
  rationale: Ang Griyego ay may τοῦ ὀνόματος lamang. Malinaw sa konteksto na tumutukoy ito kay Jesus, ngunit ang tahasang pagdaragdag ng kaniyang pangalan sa pangunahing teksto ay mag-aalis sa mapitagang pagpapaikli at bahagyang pahiwatig ng orihinal.
- issue: Hindi tahasang gumagawa sa “itinuring na karapat-dapat”
  choice: Panatilihin ang balintiyak na “itinuring silang karapat-dapat.”
  alternative: itinuring sila ng Diyos na karapat-dapat
  rationale: Bagaman maaaring maunawaan na Diyos ang kumilala sa kanila bilang karapat-dapat, hindi siya tahasang pinangalanan bilang gumagawa sa Griyego; kaya hindi ito idinagdag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Konseho” para sa madaling pag-unawa at “hamakin” upang natural na maipahayag ang balangkas ng dangal at kahihiyan. Inilagay ang pananda ng talababa pagkatapos ng “Pangalan,” ang mismong pariralang ipinaliliwanag nito.
