  yaml_path: translation/nt/acts/005/027.yaml
  text: After bringing them in, they stood them before the council, and the high priest questioned them.
translation:
  language: tl
  text: Matapos nilang dalhin ang mga apostol, pinatayo nila ang mga ito sa harap ng kapulungan[a]. At tinanong sila ng pinakapunong pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sanhedrin.” Ang salitang Griyego na συνέδριον ay tumutukoy sa namamahalang kapulungan ng mga Hudyo.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀγαγόντες
  choice: Matapos nilang dalhin ang mga apostol
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa pangunahing pandiwang ἔστησαν. Ginawang tahasan ang tinutukoy ng panghalip bilang “mga apostol” upang maiwasan ang malabong pag-uulit ng “nila” at “kanila” sa Tagalog, ayon sa malinaw na konteksto.
- source_word: δὲ
  choice: —
  rationale: Banayad itong pang-ugnay na nagpapatuloy sa salaysay. Hindi na ito isinalin nang hiwalay sapagkat likas ang daloy ng Tagalog kahit wala ito.
- source_word: ἔστησαν
  choice: pinatayo nila ang mga ito sa harap
  rationale: Pinananatili ng “pinatayo” ang kongkretong diwa ng transitive ἵστημι—ang paglalagay sa kanila sa nakatayong kalagayan sa harap ng lupon—at natural ito sa tagpong panghukuman.
- source_word: ἐν τῷ συνεδρίῳ
  choice: sa harap ng kapulungan
  rationale: Ang συνέδριον ay tumutukoy rito sa namamahalang kapulungang Judio. Ang “sa harap ng” ay ang likas na Tagalog sa pagpapaharap sa isang lupong humahatol, samantalang pinananatili ng “kapulungan” ang karaniwang leksikal na diwa.
- source_word: ἐπηρώτησεν
  choice: tinanong
  rationale: Saklaw ng ἐπερωτάω ang pormal na pagtatanong. Sapat ang “tinanong” sa kontekstong panghukuman at hindi nito pinalalakas ang diwa tungo sa marahas na interogasyon.
- source_word: ὁ ἀρχιερεὺς
  choice: ang kataas-taasang pari
  rationale: Tiyak nitong ipinapahayag ang natatanging mataas na katungkulan ng ἀρχιερεύς at iniiwasang ipagkamali ito sa mas malawak na pangkat ng mga punong pari.
theological_decisions:
- issue: Pagpapahayag sa συνέδριον
  choice: ang kapulungan
  alternative: ang Sanhedrin
  rationale: Isinalin sa pangunahing teksto ang karaniwang kahulugan ng terminong Griyego sa halip na palitan ito ng tradisyonal na transliterasyon. Nililinaw ng talababa na ang tinutukoy ay ang Sanhedrin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga apostol” sa halip na paulit-ulit na mga panghalip upang maging natural at malinaw, nang hindi nagdaragdag ng bagong tinutukoy sa konteksto.
