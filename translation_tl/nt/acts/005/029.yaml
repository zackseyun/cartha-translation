    issue: Hindi ganap na nailalabas ng "sa halip na" ang komparatibong μᾶλλον ἢ.
    rationale: Ang Griyego ay nagsasaad ng priyoridad—"more than/rather than"—hindi lamang alternatibong pagpili. Ang "mas ... kaysa" ay malinaw na katumbas at natural sa modernong Filipino.
  revised_text: Ngunit sumagot si Pedro at ang mga apostol, “Mas dapat naming sundin ang Diyos kaysa ang mga tao.”
