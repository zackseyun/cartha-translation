  text: ἀποκριθεὶς δὲ Πέτρος καὶ οἱ ἀπόστολοι εἶπαν· Πειθαρχεῖν δεῖ θεῷ μᾶλλον ἢ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/029.yaml
  text: But Peter and the apostles answered[a], “We must obey God rather than men.”
translation:
  language: tl
  text: Ngunit sumagot si Pedro at ang mga apostol, “Mas dapat naming sundin ang Diyos kaysa ang mga tao.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπαν
  choice: sumagot
  rationale: Magkasamang bumubuo ang participle at pandiwang ito ng karaniwang pormula ng pagsagot. Sapat at natural sa Tagalog ang iisang pandiwang “sumagot,” nang hindi inuulit ang “sumagot at sinabi.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang bahagyang pagsalungat ng tugon ng mga apostol sa utos ng kapulungan.
- source_word: Πέτρος καὶ οἱ ἀπόστολοι
  choice: si Pedro at ang mga apostol
  rationale: Ginamit ang nakaugaliang anyo ng pangalan at ang malinaw at kinikilalang katawagang “mga apostol” para sa tiyak na pangkat na tinutukoy.
- source_word: Πειθαρχεῖν
  choice: sundin
  rationale: Ang πειθαρχέω ay pagsunod sa isang may awtoridad. Ang “sundin” ang pinakanatural na katumbas sa pangungusap na ito.
- source_word: δεῖ
  choice: Dapat naming
  rationale: Nagpapahayag ang δεῖ ng pangangailangan o obligasyon. Ginagawang hayag ng “naming” ang ipinahihiwatig na tagaganap—si Pedro at ang mga apostol.
- source_word: θεῷ
  choice: ang Diyos
  rationale: Ang Diyos ang layon ng pagsunod; tuwiran itong isinalin.
- source_word: μᾶλλον ἢ
  choice: sa halip na
  rationale: 'Malinaw at natural nitong ipinapahayag ang paghahambing at pagpili: pagsunod sa Diyos sa halip na sa mga tao.'
- source_word: ἀνθρώποις
  choice: ang mga tao
  rationale: Generic ang ἀνθρώποις at tumutukoy sa mga tao bilang kaibahan sa Diyos; sa konteksto, kabilang dito ang mga awtoridad na nag-utos sa kanila.
theological_decisions:
- issue: Ang lawak ng ἀνθρώποις sa paghahambing sa Diyos
  choice: mga tao
  alternative: mga pinunong tao
  rationale: Pinananatili ng “mga tao” ang pangkalahatang saklaw ng salitang Griyego at ang tuwirang kaibahan ng Diyos at ng tao. Hindi idinaragdag sa teksto ang “mga pinuno,” bagaman sila ang agarang tinutukoy sa konteksto.
- issue: Ang uri ng obligasyong ipinahahayag ng δεῖ
  choice: Dapat naming sundin
  alternative: Kailangan naming sundin
  rationale: Ang “dapat” ay likas na nagpapahayag ng moral na pananagutan dito nang hindi nilulutas kung ang diin ng δεῖ ay utos, pangangailangan, o kapwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at matinding paghahambing ng orihinal, habang iniwasan ang di-likas na pag-uulit sa pormulang ἀποκριθεὶς … εἶπαν.
