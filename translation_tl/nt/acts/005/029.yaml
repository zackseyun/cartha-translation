  source_fidelity: 'Tumpak ang pangkalahatang diwa at maayos na naisalin ang pormulang "sumagot," ang obligasyong nasa δεῖ, at ang paghahambing ng pagsunod sa Diyos at sa mga tao. Gayunman, ang "sa halip na" lamang ay maaaring magpahiwatig ng simpleng pamalit; ang μᾶλλον ἢ ay hayagang komparatibo: pagsunod sa Diyos nang higit kaysa sa mga tao.'
  naturalness: Natural at marangal ang Tagalog. Mas idiomatiko at mas malapit sa lakas ng Griyego ang "Mas dapat naming sundin ang Diyos kaysa ang mga tao."
  terminology: Ang "Diyos," "Pedro," at "mga apostol" ay angkop. Wasto ang "mga tao" para sa pangkalahatang ἀνθρώποις at hindi dapat higpitan sa "mga pinuno."
  issues:
