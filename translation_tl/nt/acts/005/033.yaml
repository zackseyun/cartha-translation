  text: But when they heard this, they were enraged and wanted to kill them.
translation:
  language: tl
  text: Ngunit nang marinig nila ito, nagngitngit sila[a] at nais nilang patayin ang mga apostol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “para silang nilalagari” o “tinagos sila sa kaibuturan”—isang paglalarawan ng matindi at mapoot na pagkabagabag.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Ngunit … sila
  rationale: Ginamit ang “Ngunit” upang ipakita ang bahagyang pagsalungat at ang biglang paglipat mula sa sinabi ng mga apostol tungo sa reaksiyon ng konseho; ang artikulo ay tumutukoy sa naunang binanggit na pangkat.
- source_word: ἀκούσαντες
  choice: nang marinig nila ito
  rationale: Ang aorist participle ay likas na ipinahayag bilang sugnay na panahunan; ang “ito” ay tumutukoy sa narinig nilang pahayag sa naunang konteksto.
- source_word: διεπρίοντο
  choice: nagngitngit sila
  rationale: Bagaman literal na naglalarawan ang pandiwa ng paglalagari o paghiwa nang tagos, ipinahihiwatig nito rito ang matindi at marahas na galit. Iniiwasan ng “nagngitngit” ang posibleng maling dating ng pagsisisi o pag-uusig ng budhi.
- source_word: ἐβούλοντο
  choice: nais nilang
  rationale: Ipinahahayag nito ang nagpapatuloy na pagnanais o balak na tinutukoy ng imperfect, sa isang dignidad ngunit natural na anyong Filipino.
- source_word: ἀνελεῖν
  choice: patayin
  rationale: Sa kontekstong ito, ang pandiwa ay tuwirang nangangahulugang kitilin ang buhay; malinaw at natural ang “patayin.”
- source_word: αὐτούς
  choice: ang mga apostol
  rationale: Ginawang tahas ang tinutukoy ng panghalip upang maiwasan ang malabong sunod-sunod na “nila/sila” sa Filipino; sila ang mga apostol na nililitis sa konteksto.
theological_decisions:
- issue: Kung ang διεπρίοντο ay nagpapahiwatig ng pagsisisi o matinding poot
  choice: Isinalin bilang “nagngitngit,” na nagsasaad ng matinding galit.
  alternative: “parang tinagos ang kanilang puso” o “nasaktan sila nang matindi”
  rationale: Ang kasunod na hangaring patayin ang mga apostol ay nagpapakitang mapoot at marahas ang reaksiyon. Gayunman, pinananatili sa talababa ang literal na larawang nakapaloob sa salitang Griyego.
translation_notes:
  register: Modernong Filipino na malinaw at dignidad. Pinili ang “nagngitngit” upang ihatid ang matinding poot nang hindi ipinahihiwatig ang nagsisising pagkabagabag na maaaring maidulot ng literal na idyoma. Ginawang tahas ang “mga apostol” sa hulihan para sa likas at malinaw na pagtukoy.
