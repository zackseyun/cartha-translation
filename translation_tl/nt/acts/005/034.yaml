id: ACT.5.34
reference: Acts 5:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀναστὰς δέ τις ἐν τῷ συνεδρίῳ Φαρισαῖος ὀνόματι Γαμαλιήλ, νομοδιδάσκαλος τίμιος παντὶ τῷ λαῷ, ἐκέλευσεν ἔξω ⸀βραχὺ τοὺς ⸀ἀνθρώπους ποιῆσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/034.yaml
  text: But a Pharisee named Gamaliel stood up in the council[a], a teacher of the law honored by all the people[b], and ordered the men to be put outside for a short time.
translation:
  language: tl
  text: Ngunit tumayo sa konseho[a] ang isang Pariseo na nagngangalang Gamaliel. Isa siyang guro ng Kautusan na iginagalang ng buong bayan. Iniutos niyang pansamantalang palabasin ang mga lalaki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “konseho” ay ang Sanhedrin, ang namumunong konseho ng mga Judio.
    reason: cultural_note
  - marker: b
    text: Sa literal, “gawing nasa labas sandali ang mga lalaki,” isang idyomang nangangahulugang pansamantala silang paalisin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς δέ
  choice: Ngunit tumayo
  rationale: Ipinakikita ng participle ang hayagang pagtayo ni Gamaliel sa kapulungan, at ang δέ ay banayad na pagbabago o pagsalungat sa takbo ng salaysay.
- source_word: τις ἐν τῷ συνεδρίῳ Φαρισαῖος
  choice: sa konseho ang isang Pariseo
  rationale: Likas sa Tagalog ang ayos na ito at pinananatili ang pagiging bagong ipinakilalang tauhan ng τις. Ang συνέδριον ay isinaling pangkalahatan bilang “konseho,” habang nililinaw sa talababa ang tiyak na institusyon.
- source_word: ὀνόματι Γαμαλιήλ
  choice: na nagngangalang Gamaliel
  rationale: Natural at marangal na katumbas ng pariralang nagpapakilala ng pangalan.
- source_word: νομοδιδάσκαλος
  choice: guro ng Kautusan
  rationale: Tuwirang ipinahahayag na siya ay nagtuturo ng Kautusan; ang malaking titik ay tumutukoy sa Kautusan ni Moises sa kontekstong Judio.
- source_word: τίμιος παντὶ τῷ λαῷ
  choice: iginagalang ng buong bayan
  rationale: Ang τίμιος ay tumutukoy sa mataas na pagkilala ng lipunan, at ang παντὶ τῷ λαῷ ay natural na “ng buong bayan” nang hindi idinaragdag ang “Israel” na wala sa Griyego.
- source_word: ἐκέλευσεν
  choice: Iniutos niya
  rationale: Pinananatili ang awtoritatibong lakas ng κελεύω sa konteksto ng paglilitis.
- source_word: ἔξω βραχὺ ... ποιῆσαι
  choice: ilabas muna sandali
  rationale: Natural na Tagalog para sa idyomang literal na “gawing nasa labas,” na nangangahulugang pansamantalang paalisin. Ang “muna sandali” ay malinaw na pansamantalang hakbang.
- source_word: τοὺς ἀνθρώπους
  choice: ang mga lalaki
  rationale: Sa konteksto, ang tinutukoy ay ang mga lalaking apostol na nakatayo sa harap ng konseho, kaya pinananatili ang tiyak na kasarian ng reperente.
theological_decisions:
- issue: Kasarian ng tinutukoy ng τοὺς ἀνθρώπους
  choice: ang mga lalaki
  alternative: ang mga tao
  rationale: Ang kontekstuwal na reperente ay ang mga lalaking apostol, hindi ang sangkatauhan o isang pangkat na hindi tinukoy ang kasarian.
- issue: Pagkilala sa συνέδριον
  choice: konseho sa teksto, Sanhedrin sa talababa
  alternative: Sanhedrin mismo sa teksto
  rationale: Pinananatili ng “konseho” ang karaniwang kahulugan ng salitang Griyego at iniiwasang gawing teknikal ang pangunahing teksto, samantalang nagbibigay ang talababa ng mahalagang historikal na pagkakakilanlan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Hinati sa tatlong pangungusap ang mahabang estrukturang Griyego upang maging madaling basahin nang hindi binabago ang ugnayan ng mga kaisipan. Ginamit ang “Kautusan” bilang pamilyar na katawagan sa Kautusan ni Moises.
