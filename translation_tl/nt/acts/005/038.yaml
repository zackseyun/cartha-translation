  source_fidelity: Ang “lamang” sa “mula lamang sa tao” ay wala sa Griyego. Bagaman umiiral ang paghahambing sa Diyos sa kasunod na talata, hindi ito dapat idagdag sa talatang ito. Ang “Kaya ngayon” ay mas malinaw na naghihinuha mula sa nauna kaysa sa simpleng καὶ τὰ νῦν (“At ngayon”).
  naturalness: Natural at marangal ang “lumayo kayo” at “pabayaan ninyo sila.” Mas tuwiran at likas ang “At ngayon” sa pambungad; maayos din ang “mula sa mga tao” para sa pangkalahatang pinagmulan.
  terminology: Ang “panukala” para sa βουλή at “gawain” para sa ἔργον ay angkop. Pinananatili ng “mawawasak ito” ang pasibong resulta ng καταλυθήσεται, bagaman malawak ang saklaw nito upang tumukoy sa panukala o gawain.
