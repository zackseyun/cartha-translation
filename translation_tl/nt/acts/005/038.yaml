  text: καὶ τὰ νῦν λέγω ὑμῖν, ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων καὶ ⸀ἄφετε αὐτούς· (ὅτι ἐὰν ᾖ ἐξ ἀνθρώπων ἡ βουλὴ ⸀αὕτη ἢ τὸ ἔργον τοῦτο, καταλυθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/038.yaml
  text: And now I tell you[a], keep away from these men and leave them alone; for if this plan or this work is from men, it will be overthrown[b],
translation:
  language: tl
  text: 'At ngayon, sinasabi ko sa inyo: lumayo kayo sa mga taong ito at pabayaan ninyo sila. Sapagkat kung ang panukalang ito o gawaing ito ay mula sa mga tao[a], mawawasak ito[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gawang-tao.”
    reason: lexical_alternative
  - marker: b
    text: O “mabibigo ito” o “mauuwi ito sa wala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: kaya ngayon
  rationale: Ang idyomatikong parirala ay naghahatid ng kasalukuyang payo batay sa naunang sinabi; natural sa Filipino ang “kaya ngayon” at malinaw ang ugnayang diskurso.
- source_word: ἀπόστητε
  choice: lumayo kayo sa
  rationale: Ang pautos ay humihiling ng paghiwalay at hindi pakikialam sa mga taong tinutukoy. Likas at malinaw sa modernong Filipino ang “lumayo kayo sa.”
- source_word: ἄφετε αὐτούς
  choice: pabayaan ninyo sila
  rationale: Sa konteksto, nangangahulugan itong huwag na silang pakialaman o usigin. Sapat na nahuhuli ng “pabayaan ninyo sila” ang idyomatikong diwa.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng payo ni Gamaliel; ang “sapagkat” ay dignified at malinaw na panandang sanhi.
- source_word: ἐὰν ᾖ ἐξ ἀνθρώπων
  choice: kung mula lamang sa tao
  rationale: Ang ἐξ ay tumutukoy sa pinagmulan. Ang “sa tao” ay generic sa Filipino at pinananatili ang paghahambing sa banal na pinagmulan sa susunod na talata; idinagdag ang “lamang” upang natural na maipahayag ang diwang ‘merely human’ nang hindi binabago ang kondisyon.
- source_word: βουλή
  choice: panukala
  rationale: Maaaring tumukoy ang βουλή sa plano, layunin, o pasiya. Ang “panukala” ay akma sa payong o planong binuo at naipag-iiba sa aktuwal na gawain.
- source_word: ἔργον
  choice: gawain
  rationale: Malawak itong salita para sa ginawa o isinasagawang pagkilos. Ang “gawain” ay natural at nagpapanatili ng kaibhan sa “panukala.”
- source_word: καταλυθήσεται
  choice: mawawasak ito
  rationale: Pinananatili ng anyong “mawawasak” ang pasibong diwa at maaaring tumukoy sa pagkabuwag, pagbagsak, o pagkawala ng bisa ng kilusan.
theological_decisions:
- issue: Pinagmulan na ipinahihiwatig ng ἐξ ἀνθρώπων
  choice: mula lamang sa tao
  alternative: mula sa mga tao; gawang-tao
  rationale: Generic ang ἀνθρώπων dito at inihahambing sa pinagmulan sa Diyos sa kasunod na talata. Sa Filipino, ang isahang generic na “tao” ay natural, walang di-kinakailangang pagtukoy sa kasarian, at hindi nilulutas ang kundisyunal na pangangatwiran ni Gamaliel.
- issue: Saklaw ng iisang pandiwang καταλυθήσεται sa “panukala” o “gawain”
  choice: mawawasak ito
  alternative: mabibigo ito; mauuwi ito sa wala
  rationale: Pinananatili ang iisang panghalip at ang posibleng kolektibong pagtukoy sa panukala o gawain, sa halip na tahasang tukuyin kung alin lamang ang mawawasak.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “ninyo” kasabay ng tahasang “kayo” upang maging natural ang mga pautos. Ang “sapagkat” ay bahagyang pormal ngunit pangkaraniwan sa saling pampanitikan at angkop sa pampublikong pagbasa.
