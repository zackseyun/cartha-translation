id: ACT.5.16
reference: Acts 5:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: συνήρχετο δὲ καὶ τὸ πλῆθος τῶν πέριξ ⸀πόλεων Ἰερουσαλήμ, φέροντες ἀσθενεῖς καὶ ὀχλουμένους ὑπὸ πνευμάτων ἀκαθάρτων, οἵτινες ἐθεραπεύοντο ἅπαντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/016.yaml
  text: And even the multitude from the towns around Jerusalem was coming together[a], bringing the sick and those troubled by unclean spirits[b], and they were all being healed.
translation:
  language: tl
  text: Maging ang napakaraming tao mula sa mga bayang nasa paligid ng Jerusalem ay patuloy na nagtitipon[a]. Dinadala nila ang mga maysakit at ang mga pinahihirapan ng maruruming espiritu[b], at silang lahat ay pinagagaling.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ay sama-samang dumarating.”
    reason: lexical_alternative
  - marker: b
    text: O “mga ginugulo ng maruruming espiritu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήρχετο
  choice: patuloy na nagtitipon
  rationale: Ipinahahayag ng imperpektong anyo ang nagpapatuloy o paulit-ulit na pagtitipon noong nakaraan; natural itong naipakikita sa Tagalog sa pamamagitan ng “patuloy na.”
- source_word: τὸ πλῆθος
  choice: ang napakaraming tao
  rationale: Tumutukoy ito sa isang malaking bilang ng mga tao bilang isang pangkat. Mas malinaw at natural sa modernong Tagalog ang “napakaraming tao” kaysa sa mas matandang “karamihan.”
- source_word: τῶν πέριξ πόλεων Ἰερουσαλήμ
  choice: mula sa mga bayang nasa paligid ng Jerusalem
  rationale: Ang πέριξ ay tumutukoy sa mga pamayanang malapit sa Jerusalem; pinananatili ng salin ang heograpikong diwa nang hindi nagpapahiwatig na pag-aari ng Jerusalem ang mga bayan.
- source_word: φέροντες
  choice: Dinadala nila
  rationale: Inilalarawan ng kasalukuyang participle kung ano ang ginagawa ng mga taong nagtitipon. Ginawang hiwalay na pangungusap upang maging malinaw at natural sa Tagalog.
- source_word: ἀσθενεῖς
  choice: mga maysakit
  rationale: Sa konteksto ng pagpapagaling, karaniwang tumutukoy ang salita sa mga taong may karamdaman.
- source_word: ὀχλουμένους
  choice: mga pinahihirapan
  rationale: Ipinahahayag nito na ang mga tao ay ginugulo o pinahihirapan. Ang “pinahihirapan” ay malinaw sa konteksto, habang inilalahad sa talababa ang mas banayad na alternatibo.
- source_word: ὑπὸ πνευμάτων ἀκαθάρτων
  choice: ng maruruming espiritu
  rationale: Pinananatili nito ang karaniwang biblikal na katawagan at ang diwa ng ἀκάθαρτος, nang hindi ito ginagawang sikolohikal na paglalarawan lamang.
- source_word: οἵτινες
  choice: silang lahat
  rationale: Ibinabalik nito ang tinutukoy sa dalawang pangkat—ang mga maysakit at ang mga pinahihirapan—at maayos na iniuugnay sa sumusunod na pahayag.
- source_word: ἐθεραπεύοντο
  choice: ay pinagagaling
  rationale: Pinananatili ng aspektong imperpektibo at tinig na balintiyak ang nagpapatuloy o paulit-ulit na pagpapagaling sa tagpong ito.
- source_word: ἅπαντες
  choice: lahat
  rationale: 'Tuwirang pinananatili ang ganap na saklaw ng pahayag: lahat ng mga taong dinala ay pinagagaling.'
theological_decisions:
- issue: Paglalarawan sa πνευμάτων ἀκαθάρτων
  choice: maruruming espiritu
  alternative: mga espiritung di-malinis
  rationale: Ang parirala ay tumutukoy sa masasamang espiritung personal sa salaysay ng Lucas–Mga Gawa. Pinananatili ng “maruruming espiritu” ang tradisyonal na biblikal na diwa nang hindi ito ipinapaliwanag nang lampas sa teksto.
- issue: Saklaw ng ἅπαντες
  choice: silang lahat ay pinagagaling
  alternative: pinagagaling ang bawat isa sa kanila
  rationale: Inilalahad ng teksto ang isang komprehensibong pahayag tungkol sa mga maysakit at pinahihirapang dinala sa tagpong ito; hindi nililimitahan o pinalalawak ng salin ang saklaw nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “bayang” para sa mga pamayanan sa paligid ng Jerusalem, “maruruming espiritu” bilang likas na biblikal na katawagan, at “patuloy na” upang ihayag ang aspektong imperpektibo.
