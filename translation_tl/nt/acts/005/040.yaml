id: ACT.5.40
reference: Acts 5:40
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενοι τοὺς ἀποστόλους δείραντες παρήγγειλαν μὴ λαλεῖν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ καὶ ⸀ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/040.yaml
  text: And after summoning the apostles[a], they beat them, ordered them not to speak in the name of Jesus, and released them.
translation:
  language: tl
  text: Pagkatapos nilang ipatawag ang mga apostol, binugbog nila ang mga ito, inutusan silang huwag magsalita sa pangalan ni Jesus[a], at pinakawalan sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari rin itong mangahulugang “tungkol sa pangalan ni Jesus” o “batay sa pangalan ni Jesus.” Maaaring saklawin ng idyomang Griyego ang pagsasalita tungkol kay Jesus at ang pagsasalita sa ilalim ng kanyang awtoridad.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: pagkatapos nilang ipatawag
  rationale: Ipinapakita ng aorist participle na nauna ang pagpapatawag sa mga sumunod na kilos; natural sa modernong Tagalog ang pagkakasunod na ito.
- source_word: τοὺς ἀποστόλους
  choice: ang mga apostol
  rationale: Ang “mga apostol” ang kinikilalang katawagan sa mga isinugong saksi ni Jesus at tiyak sa konteksto ng Mga Gawa.
- source_word: δείραντες
  choice: binugbog nila ang mga ito
  rationale: Ang δέρω ay nangangahulugang hampasin o bugbugin. Hindi tinutukoy ng salitang Griyego ang eksaktong paraan o instrumentong ginamit, kaya pinananatili ng “binugbog” ang pangkalahatang diwa.
- source_word: παρήγγειλαν
  choice: inutusang
  rationale: Malinaw na ipinahihiwatig ng παραγγέλλω ang isang mariing utos, at maikli at natural ang “inutusan” sa Tagalog.
- source_word: μὴ λαλεῖν
  choice: huwag magsalita
  rationale: Ipinapahayag ng μή kasama ng pawatas ang nilalaman ng pagbabawal; ang “magsalita” ay angkop sa pormal na tagpo.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: sa pangalan ni Jesus
  rationale: Pinananatili ng pariralang ito ang malawak na idyomang maaaring tumukoy sa pagsasalita tungkol kay Jesus, kaugnay ng kanyang pangalan, o sa ilalim ng kanyang awtoridad.
- source_word: ἀπέλυσαν
  choice: pinalaya
  rationale: Sa konteksto, nangangahulugan ang ἀπολύω na pakawalan mula sa pagkakapiit o pagpigil; ang “pinalaya” ay angkop sa legal na tagpo.
theological_decisions:
- issue: Pagpapakahulugan sa idyomang ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: sa pangalan ni Jesus
  alternative: tungkol sa pangalan ni Jesus; salig sa pangalan ni Jesus
  rationale: Maaaring saklawin ng parirala ang pagtukoy kay Jesus, ang pagsasalita sa ilalim ng kanyang awtoridad, at ang pampublikong pagpapatotoong nakaugnay sa kanya. Hindi nililimitahan ng salin ang parirala sa iisang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ang mga ito” upang malinaw na ang mga apostol ang binugbog, at ang “at saka” upang natural na ipakita na pinalaya lamang sila matapos bugbugin at utusan.
