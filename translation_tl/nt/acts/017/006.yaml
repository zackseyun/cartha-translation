  text: μὴ εὑρόντες δὲ αὐτοὺς ⸀ἔσυρον Ἰάσονα καί τινας ἀδελφοὺς ἐπὶ τοὺς πολιτάρχας, βοῶντες ὅτι Οἱ τὴν οἰκουμένην ἀναστατώσαντες οὗτοι καὶ ἐνθάδε πάρεισιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/006.yaml
  text: But when they did not find them[a], they dragged Jason and some brothers before the city authorities, shouting[c][b], “These men who have turned the world upside down have come here also,”
translation:
  language: tl
  text: Ngunit hindi nila sila natagpuan, kaya kinaladkad nila si Jason at ilang kapatid[a] sa harap ng mga opisyal ng lungsod,[b] habang sumisigaw, “Ang mga taong ito na naghasik ng kaguluhan sa daigdig[c] ay narito na rin!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay tumutukoy rito sa mga kapwa mananampalataya; maaaring kabilang dito ang mga babae ayon sa gamit ng salita sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “mga politarch,” isang lokal na titulong ginagamit sa Macedonia para sa mga opisyal ng lungsod.
    reason: cultural_note
  - marker: c
    text: Sa literal, “ang tinatahanang daigdig”; maaaring tumukoy ito sa daigdig na kilala noon, lalo na sa nasasakupan ng Roma.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ εὑρόντες δὲ αὐτοὺς
  choice: Ngunit nang hindi nila matagpuan ang mga iyon
  rationale: Ipinapahayag ng aorist participle ang pangyayaring nauna sa pangunahing kilos. Ang “nang hindi nila matagpuan” ay natural sa Tagalog at hindi tinutukoy nang higit sa Griyego kung sino ang hinahanap.
- source_word: ἔσυρον
  choice: kinaladkad
  rationale: Ang pandiwang σύρω ay nagpapahiwatig ng sapilitang paghila, kaya pinananatili ng “kinaladkad” ang pisikal at marahas na diwa.
- source_word: τινας ἀδελφοὺς
  choice: ang ilang kapatid
  rationale: Sa konteksto, ang ἀδελφοί ay tumutukoy sa ilang kapwa mananampalataya. Natural at maaaring maging inklusibo sa Tagalog ang “mga kapatid” nang hindi kailangang magdagdag ng kasarian sa pangunahing teksto.
- source_word: ἐπὶ τοὺς πολιτάρχας
  choice: sa harap ng mga opisyal ng lungsod
  rationale: Ipinahihiwatig ng parirala ang pagdadala sa kanila sa mga lokal na opisyal upang humarap sa mga ito. Malinaw sa karaniwang mambabasa ang tungkulin, habang inilalagay sa talababa ang natatanging titulong Macedonio.
- source_word: βοῶντες
  choice: Sumigaw sila
  rationale: Ang participle ay naglalarawan ng malakas na pagsigaw na kasabay ng pagdadala sa mga dinakip. Ang hiwalay na pangungusap ay natural at masigla sa Tagalog.
- source_word: οἱ τὴν οἰκουμένην ἀναστατώσαντες
  choice: Ang mga taong gumulo sa buong daigdig
  rationale: Ang ἀναστατόω ay nangangahulugang lumikha ng matinding kaguluhan o ligalig. Iniiwasan ng “gumulo” ang sobrang literal ngunit di-natural na idyomang “binaligtad ang mundo,” habang pinananatili ang mariing paratang.
- source_word: οὗτοι καὶ ἐνθάδε πάρεισιν
  choice: ay narito na rin
  rationale: Ang πάρειμι ay tumutukoy sa pagiging naroroon o pagdating at pananatili roon; malinaw na naipahahayag ng “narito na rin” ang pagdating at kasalukuyang presensya, pati ang diin ng καί.
