  to: Ngunit hindi nila sila natagpuan, kaya kinaladkad nila si Jason at ilang kapatid[a] sa harap ng mga opisyal ng lungsod,[b] habang sumisigaw, “Ang mga taong ito na naghasik ng kaguluhan sa daigdig[c] ay narito na rin!”
