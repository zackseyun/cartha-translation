translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga iyon” upang panatilihin ang reperensiya ng αὐτούς nang hindi idinaragdag ang mga pangalang wala sa talata. Ang sigaw ay ginawang hiwalay na pangungusap para sa likas na daloy sa Tagalog. Pinanatili ang hyperbole ng paratang, at nilinaw lamang sa talababa ang saklaw ng οἰκουμένη.
