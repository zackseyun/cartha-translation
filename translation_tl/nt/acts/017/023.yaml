base_translation:
  language: en
  yaml_path: translation/nt/acts/017/023.yaml
  text: For as I was passing through and observing your objects of worship[a], I even found an altar on which had been inscribed, ‘To an unknown god.’ Therefore[b], what you worship in ignorance—this I proclaim to you.
translation:
  language: tl
  text: 'Sapagkat habang nagdaraan ako at maingat na tinitingnan ang mga bagay na pinag-uukulan ninyo ng pagsamba, nakakita pa nga ako ng isang altar na may nakaukit na: “PARA SA ISANG DIYOS NA HINDI KILALA.”[a] Kaya, ang sinasamba ninyo nang hindi ninyo ito nakikilala—iyon ang ipinahahayag ko sa inyo.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “PARA SA DIYOS NA HINDI KILALA.” Walang pantukoy ang inskripsiyon sa Griyego, kaya posible ang di-tiyak o tiyak na pagkakasalin.'
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, neuter ang relative pronoun na isinaling “ang” at ang demonstrative na isinaling “iyon.” Maaari ring isalin ang parirala bilang “ang pinag-uukulan ninyo ng debosyon nang hindi ninyo nakikilala,” ngunit hindi nito tahasang sinasabing “ang Diyos na hindi ninyo nakikilala.”
    reason: alternative_reading
lexical_decisions:
- source_word: διερχόμενος
  choice: habang nagdaraan ako
  rationale: Ipinahahayag ang nagpapatuloy na kilos ng present participle at ang kaugnayang temporal nito sa kasunod na pagmamasid.
- source_word: ἀναθεωρῶν
  choice: maingat na tinitingnan
  rationale: Ipinakikita ang masusing pagmamasid, hindi lamang isang pahapyaw na pagtingin.
- source_word: τὰ σεβάσματα ὑμῶν
  choice: ang mga bagay na pinag-uukulan ninyo ng pagsamba
  rationale: Pinananatili ang malawak na saklaw ng σεβάσματα para sa mga bagay na iginagalang o sinasamba sa relihiyosong paraan, nang hindi ito nililimitahan sa mga dambana lamang.
- source_word: βωμὸν
  choice: altar
  rationale: Karaniwan at malinaw na salitang Filipino para sa βωμός sa kontekstong panrelihiyon.
- source_word: ἐπεγέγραπτο
  choice: may nakaukit na
  rationale: Likas na paglalarawan sa isang inskripsiyong nauna nang inilagay sa altar.
- source_word: Ἀγνώστῳ θεῷ
  choice: PARA SA ISANG DIYOS NA HINDI KILALA
  rationale: Ang 'isang' ay umaayon sa kawalan ng pantukoy sa Griyego at natural sa isang inskripsiyong naghahandog o nag-aalay.
- source_word: ὃ οὖν
  choice: Kaya ang … iyon
  rationale: Pinananatili ang pangangatwirang ipinahihiwatig ng οὖν at ang impersonal na pagtukoy ng neuter relative pronoun.
- source_word: ἀγνοοῦντες
  choice: nang hindi ninyo nalalaman
  rationale: Inilalarawan ang paraan ng kanilang pagsamba at pinananatili ang ugnayang retorikal sa 'hindi kilala.'
- source_word: εὐσεβεῖτε
  choice: sinasamba ninyo
  rationale: Malinaw at likas sa Filipino para sa relihiyosong debosyon sa kontekstong ito, habang ang mas literal na diwang 'pinag-uukulan ng debosyon' ay nananatiling posible.
- source_word: καταγγέλλω
  choice: ipinahahayag ko
  rationale: Ang pandiwa ay tumutukoy sa hayagan at may awtoridad na pagpapahayag.
theological_decisions:
- issue: Tinutukoy ng neuter relative pronoun na ὃ
  choice: ang sinasamba ninyo … iyon
  alternative: ang Diyos na sinasamba ninyo nang hindi ninyo nakikilala
  rationale: Hindi tuwirang ginagawang personal o panlalaki ang tinutukoy, sapagkat neuter ang panghalip sa Griyego. Sa gayon, napapanatili ang retorikal at teolohikal na tensiyon sa pananalita ni Pablo.
- issue: Pagiging tiyak ng Ἀγνώστῳ θεῷ
  choice: PARA SA ISANG DIYOS NA HINDI KILALA
  alternative: PARA SA DIYOS NA HINDI KILALA
  rationale: Walang pantukoy ang pariralang Griyego, kaya makatuwiran ang di-tiyak na salin; gayunman, posible rin ang tiyak na anyo bilang likas na pagbasa sa isang inskripsiyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “altar” bilang karaniwang salitang panrelihiyon at ang “pinag-uukulan … ng pagsamba” upang mapanatili ang lawak ng σεβάσματα. Ang malalaking titik sa inskripsiyon ay tumutulong na maipakita ang anyo nito bilang nakaukit na teksto.
