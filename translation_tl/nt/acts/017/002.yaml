  text: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ εἰσῆλθεν πρὸς αὐτοὺς καὶ ἐπὶ σάββατα τρία διελέξατο αὐτοῖς ἀπὸ τῶν γραφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/002.yaml
  text: And according to Paul's custom[a], he went in to them, and on three Sabbaths he reasoned with them from the Scriptures[c][b],
translation:
  language: tl
  text: Gaya ng nakaugalian ni Pablo, pumasok siya sa kinaroroonan nila. Sa tatlong Sabbath, nakipagtalakayan siya sa kanila batay sa mga Kasulatan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa mga Kasulatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ
  choice: Gaya ng nakaugalian ni Pablo
  rationale: Likas at malinaw na ipinahahayag nito ang matatag na kaugalian ni Pablo na nasa idyomang Griyego.
- source_word: εἰσῆλθεν πρὸς αὐτοὺς
  choice: pumasok siya at lumapit sa kanila
  rationale: Pinananatili nito kapwa ang diwa ng pagpasok sa εἰσῆλθεν at ang direksiyong patungo sa kanila sa πρὸς αὐτούς, nang hindi tahasang idinaragdag ang sinagoga sa talata.
- source_word: ἐπὶ σάββατα τρία
  choice: Sa loob ng tatlong Sabbath
  rationale: Ipinahahayag nito ang paglawak ng gawain sa tatlong magkakahiwalay na Sabbath; pinananatili sa talababa ang posibleng mas distributibong pagbasa.
- source_word: διελέξατο
  choice: nakipagtalakayan siya sa kanila
  rationale: Ipinakikita ng pandiwang may panumbalik na anyo ang pakikipag-usap na may pangangatwiran at palitan, hindi lamang isang panig na pagsasalita at hindi rin kinakailangang pag-aaway.
- source_word: ἀπὸ τῶν γραφῶν
  choice: batay sa mga Kasulatan
  rationale: Ang ἀπό ay nagpapahiwatig na ang mga Kasulatan ang pinagmulan o batayan ng kanyang pangangatwiran; kinikilala ng maramihang γραφαί ang koleksiyon ng mga banal na kasulatan.
theological_decisions:
- issue: Tinutukoy ng αὐτούς (“kanila”) sa gawain ni Pablo
  choice: Panatilihin ang panghalip na “kanila.”
  alternative: “sa sinagoga” o “sa mga Judio roon”
  rationale: Bagaman ipinakikilala ng naunang talata ang sinagoga at mga Judio, mga panghalip lamang ang ginagamit sa talatang ito. Iniiwasan ng salin ang pagdaragdag ng tahasang tinutukoy na wala mismo sa teksto.
- issue: Lakas at anyo ng διελέξατο
  choice: “nakipagtalakayan”
  alternative: “nakipag-usap,” “nakipagpalitan ng katuwiran,” o “nakipagtalo”
  rationale: Pinananatili nito ang diwa ng diyalogo at pangangatwiran nang hindi ipinapalagay na palaaway o tahasang salungatan ang pag-uusap.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Sabbath” bilang karaniwang katawagan sa araw ng pamamahinga ng mga Judio, at “mga Kasulatan” bilang kinikilalang katawagan sa mga sagradong sulatin. Inayos sa dalawang pangungusap para sa likas na daloy sa Filipino nang hindi binabago ang ugnayan ng mga sugnay.
