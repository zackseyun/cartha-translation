  text: ζητεῖν τὸν ⸀θεὸν εἰ ἄρα γε ψηλαφήσειαν αὐτὸν καὶ εὕροιεν, καί γε οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν ὑπάρχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/027.yaml
  text: that they should seek God[a], if perhaps they might grope for him and find him—though indeed he is not far from each one of us.
translation:
  language: tl
  text: upang hanapin nila ang Diyos, baka sakaling kapain nila siya at matagpuan nila siya—bagaman sa katunayan, hindi siya malayo sa bawat isa sa atin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητεῖν
  choice: upang hanapin nila
  rationale: Ang infinitibo ay nakaugnay sa naunang sugnay at nagpapahayag ng layunin o bunga; likas sa Tagalog ang sugnay na may “upang” upang mapanatili ang diwang ito.
- source_word: τὸν θεόν
  choice: ang Diyos
  rationale: Ang karaniwang likas at marangal na pagtukoy sa θεός sa kontekstong ito ay “ang Diyos.”
- source_word: εἰ ἄρα γε
  choice: baka sakaling
  rationale: Pinananatili nito ang pansamantala at di-tiyak na himig ng pinagsamang mga kataga nang hindi ginagawang tiyak o walang pag-asa ang paghahanap.
- source_word: ψηλαφήσειαν
  choice: kapain nila siya
  rationale: Ang ψηλαφάω ay naglalarawan ng paghahanap sa pamamagitan ng paghipo, gaya ng pagkapa sa dilim; malinaw at natural sa Tagalog ang “kapain.”
- source_word: καὶ εὕροιεν
  choice: at matagpuan
  rationale: Ang “matagpuan” ay likas na katuwang ng “kapain” at taglay pa rin ang modal na diwa mula sa “baka sakaling.”
- source_word: καί γε
  choice: gayong ... naman
  rationale: 'Ipinahahayag nito ang pasalungat o concessive na paglilinaw: bagaman alanganin ang paghahanap ng tao, tunay na malapit ang Diyos.'
- source_word: οὐ μακρὰν
  choice: hindi ... malayo
  rationale: Tuwiran at natural itong katumbas ng Griyegong pahayag.
- source_word: ἀπὸ ἑνὸς ἑκάστου ἡμῶν
  choice: sa bawat isa sa atin
  rationale: Pinananatili ng “bawat isa” ang distributibong diin ng ἑνὸς ἑκάστου.
- source_word: ὑπάρχοντα
  choice: siya
  rationale: Sa Tagalog, sapat at natural ang tahasang panghalip sa predikatibong pahayag na “hindi ... malayo”; ang aktuwal na pagkamalapit ang malinaw na ipinapahayag.
theological_decisions:
- issue: Ang kakayahang maabot ang Diyos at ang limitadong paghahanap ng tao
  choice: Pinanatili ang pag-aalinlangan ng paghahanap sa “baka sakaling kapain” at ang mariing katotohanan ng pagkamalapit ng Diyos sa “gayong hindi naman siya malayo.”
  alternative: Gawing payak na “hanapin at matagpuan” nang walang larawan ng pagkapa, o gawing mas tiyak ang tagumpay ng paghahanap.
  rationale: Magkasamang ipinahahayag ng Griyego ang limitadong pagkaunawa ng tao at ang tunay na pagkamalapit ng Diyos; hindi dapat alisin ng salin ang alinman sa dalawang ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “kapain” upang mapanatili ang kongkretong talinghaga ng paghahanap sa pamamagitan ng paghipo; hindi kailangan ang talababa dahil malinaw na ito sa mismong teksto.
