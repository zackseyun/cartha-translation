id: ACT.17.28
reference: Acts 17:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν αὐτῷ γὰρ ζῶμεν καὶ κινούμεθα καὶ ἐσμέν, ὡς καί τινες τῶν καθ’ ὑμᾶς ποιητῶν εἰρήκασιν· Τοῦ γὰρ καὶ γένος ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/028.yaml
  text: For in him we live and move and exist, as even some of your own poets have said, ‘For we also are his offspring.’
translation:
  language: tl
  text: 'Sapagkat sa kanya tayo nabubuhay, kumikilos, at umiiral, gaya rin ng sinabi ng ilan sa sarili ninyong mga makata: “Sapagkat tayo rin ay kanyang lahi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang payak at malawak na diwa ng Griyegong parirala nang hindi dinaragdagan ng paliwanag kung paano ang lahat ay nasa Diyos.
- source_word: κινούμεθα
  choice: kumikilos
  rationale: Likas at tuwirang katumbas sa modernong Tagalog; maaari nitong saklawin ang pagkilos o paggalaw.
- source_word: ἐσμέν
  choice: umiiral
  rationale: Sa sunod-sunod na 'nabubuhay, kumikilos, at umiiral,' malinaw nitong ipinahahayag ang eksistensiyal na diwa ng 'we are' nang hindi nagiging alanganin ang Tagalog.
- source_word: γένος
  choice: lahi
  rationale: Karaniwang salin na angkop sa sipi ng makata at kayang tumukoy sa pinagmulan o angkan; hindi nito ipinapasok ang mas tiyak na teolohikal na salitang 'mga anak.'
theological_decisions:
- issue: Kahulugan ng pagiging 'kanyang lahi'
  choice: Pinanatili ang “kanyang lahi” bilang malawak na pahayag tungkol sa ugnayan ng sangkatauhan sa Diyos bilang pinagmulan.
  alternative: “mga anak niya”
  rationale: Ang γένος ay hindi kinakailangang mangahulugan ng pagiging anak sa espirituwal o pansoteriolohiyang diwa; ang 'lahi' ay nagpapanatili sa saklaw at tensiyon ng orihinal.
- issue: Pahayag na ang buhay, pagkilos, at pag-iral ay 'sa kanya'
  choice: Isinalin nang tuwiran bilang “sa kanya” nang walang paliwanag.
  alternative: “sa pamamagitan niya” o “dahil sa kanya”
  rationale: Ang ἐν αὐτῷ ay literal na 'sa kanya'; ang pagpapalit sa sanhi o instrumento ay magpapasya sa ambiguwidad na hindi tahasang nilulutas ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Sapagkat” upang malinaw ang ugnayang paliwanag sa naunang talata, at pinanatili ang anyong patula ng huling sipi.
