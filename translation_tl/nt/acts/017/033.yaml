  choice: mula sa gitna nila
  rationale: Pinananatili nito ang kongkretong larawan na si Pablo ay umalis mula sa kinaroroonan ng pangkat, nang hindi ginagawang higit na tiyak ang kaugnayan niya sa kanila.
