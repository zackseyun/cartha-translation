  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐδὲ ὑπὸ χειρῶν ⸀ἀνθρωπίνων θεραπεύεται προσδεόμενός τινος, αὐτὸς διδοὺς πᾶσι ζωὴν καὶ πνοὴν ⸂καὶ τὰ⸃ πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/025.yaml
  text: Nor is he served by human hands[a], as though he needed anything, since he himself gives to all life and breath and all things.
translation:
  language: tl
  text: Hindi rin siya pinaglilingkuran ng mga kamay ng tao[a], na para bang may kailangan siya, sapagkat siya mismo ang nagbibigay sa lahat ng buhay, hininga, at lahat ng bagay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tumatanggap ng pagsamba o serbisyong panrelihiyon mula sa mga tao.” Ang pandiwang Griyego ay maaaring tumukoy sa paglilingkod o pag-aasikasong iniaalay sa kontekstong panrelihiyon; dito, ang diwa ay hindi umaasa ang Diyos sa paglilingkod ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεραπεύεται
  choice: pinaglilingkuran
  rationale: Sa konteksto ng mga kamay ng tao at ng kasunod na pahayag na hindi nangangailangan ang Diyos, tumutukoy ito sa paglilingkod o pag-aasikasong iniaalay sa isang diyos, hindi sa pagpapagaling. Likas sa Tagalog ang “pinaglilingkuran” at hindi nito nililimitahan ang diwa sa pagsamba lamang.
- source_word: ὑπὸ χειρῶν ἀνθρωπίνων
  choice: ng mga kamay ng tao
  rationale: Pinananatili ang konkretong idyoma ng Griyego at ang pahiwatig ng gawa o serbisyong pantao.
- source_word: προσδεόμενός τινος
  choice: na para bang may kailangan siya
  rationale: Ipinahahayag ang retorikal na diwa na ang Diyos ay hindi tumatanggap ng paglilingkod dahil may kakulangan siyang kailangang punan.
- source_word: αὐτὸς
  choice: siya mismo
  rationale: 'Pinananatili ang diin at ang kaibahan: sa halip na tumanggap dahil nangangailangan, ang Diyos mismo ang nagbibigay.'
- source_word: διδοὺς
  choice: ang nagbibigay
  rationale: Natural na isinasama sa sugnay na may “sapagkat” habang pinananatili ang ugnayang nagbibigay-dahilan ng participle.
- source_word: πᾶσι
  choice: sa lahat
  rationale: Pinananatili ang malawak at di-tiyak na saklaw ng Griyego nang hindi ito tahasang nililimitahan sa mga tao lamang.
- source_word: ζωὴν
  choice: buhay
  rationale: Tuwirang katumbas at natural sa Tagalog.
- source_word: πνοὴν
  choice: hininga
  rationale: Sa tambalang “buhay at hininga,” ito ang likas na kahulugan at malinaw na nagpapakita ng pagdepende ng mga nilalang sa Diyos.
- source_word: καὶ τὰ πάντα
  choice: at lahat ng bagay
  rationale: Pinananatili ang pangkalahatan at sumasaklaw-sa-lahat na puwersa ng parirala.
- source_word: οὐδὲ
  choice: Hindi rin
  rationale: Natural na ipinagpapatuloy nito ang naunang negatibong pahayag.
theological_decisions:
- issue: Kung tahasang kultiko ang salin sa θεραπεύεται o mas malawak na paglilingkod ang ipahahayag
  choice: pinaglilingkuran
  alternative: sinasamba; inaasikaso
  rationale: Saklaw ng “pinaglilingkuran” ang serbisyong panrelihiyon ngunit hindi nito pinaliliit ang salita sa panloob o tahasang pagsamba lamang. Pinananatili rin nito ang punto na hindi umaasa ang Diyos sa anumang paglilingkod ng tao.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang konkretong “mga kamay ng tao,” ang diin ng “siya mismo,” at ang malawak na saklaw ng “sa lahat” nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
