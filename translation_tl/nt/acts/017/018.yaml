id: ACT.17.18
reference: Acts 17:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἐπικουρείων ⸀καὶ Στοϊκῶν φιλοσόφων συνέβαλλον αὐτῷ, καί τινες ἔλεγον· Τί ἂν θέλοι ὁ σπερμολόγος οὗτος λέγειν; οἱ δέ· Ξένων δαιμονίων δοκεῖ καταγγελεὺς εἶναι· ὅτι τὸν Ἰησοῦν καὶ τὴν ἀνάστασιν εὐηγγελίζετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/018.yaml
  text: Some of the Epicurean and Stoic philosophers also engaged with him[a], and some were saying, “What is this babbler trying to say?” But others said[d][c][b], “He seems to be a proclaimer of foreign deities,” because he was proclaiming the good news about Jesus and the resurrection.
translation:
  language: tl
  text: May ilan din sa mga pilosopong Epicureo at Estoico na nakipagtalakayan sa kanya.[a] Sinabi ng ilan, “Ano kaya ang nais sabihin ng daldalerong ito?”[b] Ngunit sinabi naman ng iba, “Mukha siyang tagapagpahayag ng mga banyagang diyos.”[c][d] Sapagkat ipinangangaral niya ang mabuting balita tungkol kay Jesus at sa muling pagkabuhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakipag-usap sa kanya” o “nakipagtalo sa kanya”; ang pandiwang Griyego ay maaaring tumukoy sa aktibong talakayan o pagtatalo.
    reason: lexical_alternative
  - marker: b
    text: Ang “daldalero” ay salin ng isang mapanlibak na salitang literal na nauugnay sa “tagapulot ng binhi.” Ginagamit ito para sa taong itinuturing na namumulot at nag-uulit ng pira-pirasong ideya.
    reason: cultural_note
  - marker: c
    text: Maaari ring “mga banyagang demonyo” o “mga di-kilalang diyos.” Malamang na ang ibig sabihin nila ay mga banal na nilalang ayon sa sarili nilang paganong pananaw, hindi kinakailangang masasamang espiritu ayon sa pagkaunawang Kristiyano.
    reason: alternative_reading
  - marker: d
    text: Ayon sa ilang pagpapakahulugan, maaaring inakala ng mga taga-Atenas na ang “muling pagkabuhay” ay isa pang diyos o diyosa dahil ipinangangaral ni Pablo si Jesus at ang muling pagkabuhay.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέβαλλον αὐτῷ
  choice: Nakipagtalakayan ... sa kanya
  rationale: Ipinahihiwatig ng pandiwa ang aktibong pakikipag-usap na maaaring may kasamang pagtatalo. Sapat na malawak ang “nakipagtalakayan” upang hindi ipalagay na lubos na palaban ang usapan.
- source_word: σπερμολόγος
  choice: daldalero
  rationale: Mapanlibak ang salitang Griyego para sa taong namumulot ng pira-pirasong ideya at inuulit ang mga iyon. Likas at mapanghamak sa modernong Filipino ang “daldalero,” habang ipinaliliwanag sa talababa ang literal na larawan.
- source_word: Τί ἂν θέλοι ... λέγειν
  choice: Ano ba ang gustong sabihin ...?
  rationale: Likas na naihahatid nito ang mapag-alinlangan at mapanghamak na haka na ipinahihiwatig ng optative na may ἄν.
- source_word: Ξένων δαιμονίων
  choice: mga banyagang diyos
  rationale: Sa paganong pananaw ng mga nagsasalita, tumutukoy ito sa di-kilalang mga banal na nilalang, hindi kinakailangang sa masasamang demonyo ayon sa gamit Kristiyano.
- source_word: καταγγελεὺς
  choice: tagapagpahayag
  rationale: Tumutukoy ito sa isang taong hayagang nagpapahayag o nag-aanunsiyo at angkop sa marangal na register.
- source_word: εὐηγγελίζετο
  choice: ipinangangaral ... ang mabuting balita
  rationale: Pinananatili nito ang tiyak na diwa ng pagpapahayag ng mabuting balita, hindi lamang pangkalahatang pangangaral.
- source_word: ἀνάστασιν
  choice: muling pagkabuhay
  rationale: Karaniwang Filipino ito para sa konseptong ipinahahayag ni Pablo; hindi ito ginawang pangalang pantangi sa pangunahing teksto.
- source_word: Ἐπικουρείων καὶ Στοϊκῶν φιλοσόφων
  choice: mga pilosopong Epicureo at Estoico
  rationale: Natural na Filipino ang ayos at pinananatili ang mga pangalan ng dalawang paaralan ng pilosopiya.
theological_decisions:
- issue: Pag-render sa δαιμόνια sa paganong pananalita
  choice: mga banyagang diyos
  alternative: mga banyagang demonyo; mga di-kilalang banal na nilalang
  rationale: Inilalahad ng salaysay ang paratang ayon sa mga kategorya ng mga paganong tagapagsalita. Maiuugnay nang mali sa konseptong Kristiyano ng masasamang espiritu kung “demonyo” agad ang gagamitin.
- issue: Kung ituturing na personipikadong pangalan ang ἀνάστασις
  choice: muling pagkabuhay
  alternative: Muling Pagkabuhay bilang ipinagpalagay na pangalan ng isang diyosa
  rationale: Ipinaliliwanag ni Lucas ang nilalaman ng pangangaral ni Pablo, kaya pinanatili itong karaniwang pangngalan. Inilagay sa talababa ang posibleng maling pagkaunawa ng mga taga-Atenas.
translation_notes:
  register: Modernong Filipino na malinaw, natural, at marangal. Ginamit ang “Epicureo” at “Estoico,” mga anyong madaling bigkasin at makilala sa Filipino. Pinanatili ang panunuya sa tanong ngunit iniwasan ang sobrang magaspang na insulto.
