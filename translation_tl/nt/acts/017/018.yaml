  to: May ilan din sa mga pilosopong Epicureo at Estoico na nakipagtalakayan sa kanya.[a] Sinabi ng ilan, “Ano kaya ang nais sabihin ng daldalerong ito?”[b] Ngunit sinabi naman ng iba, “Mukha siyang tagapagpahayag ng mga banyagang diyos.”[c][d] Sapagkat ipinangangaral niya ang mabuting balita tungkol kay Jesus at sa muling pagkabuhay.
