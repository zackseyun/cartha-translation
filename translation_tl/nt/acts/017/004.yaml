source:
  edition: SBLGNT
  text: καί τινες ἐξ αὐτῶν ἐπείσθησαν καὶ προσεκληρώθησαν τῷ Παύλῳ καὶ τῷ Σιλᾷ, τῶν τε σεβομένων Ἑλλήνων ⸂πλῆθος πολὺ⸃ γυναικῶν τε τῶν πρώτων οὐκ ὀλίγαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/004.yaml
  text: And some of them were persuaded and joined Paul and Silas[a], along with a large number of the God-fearing Greeks and not a few of the leading women.
translation:
  language: tl
  text: At ang ilan sa kanila ay nahikayat at sumama kina Pablo at Silas[a], kasama ang isang malaking bilang ng mga Griyegong may takot sa Diyos at hindi kakaunti sa mga kilalang babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “naibilang sa panig nina Pablo at Silas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες ἐξ αὐτῶν
  choice: ang ilan sa kanila
  rationale: Likas na salin ng partitive expression at tumutukoy sa mga tagapakinig sa sinagoga sa naunang talata.
- source_word: ἐπείσθησαν
  choice: nahikayat
  rationale: Pinananatili nito ang diwa ng pagiging napaniwala ng mensahe nang hindi gumagamit ng mas tahasang salitang panampalataya na wala sa Griyego.
- source_word: προσεκληρώθησαν
  choice: sumama
  rationale: Sa konteksto, ipinahihiwatig ng pambihirang pandiwa ang pag-ugnay o pagpanig nila kina Pablo at Silas; malinaw at natural sa Filipino ang “sumama.”
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: kina Pablo at Silas
  rationale: Ang “kina” ay natural na panandang Filipino para sa ugnayang ipinahihiwatig ng datibo kasama ng pandiwa.
- source_word: τῶν τε σεβομένων Ἑλλήνων
  choice: mga Griyegong may takot sa Diyos
  rationale: Sa Mga Gawa, karaniwang tumutukoy ito sa mga Hentil na gumagalang sa Diyos ng Israel at nakaugnay sa pagsamba sa sinagoga.
- source_word: πλῆθος πολὺ
  choice: napakarami
  rationale: Natural at tuwirang ipinapahayag ang malaking bilang ng grupong tinutukoy.
- source_word: γυναικῶν τε τῶν πρώτων
  choice: mga prominenteng babae
  rationale: Ang πρῶτος dito ay tumutukoy sa katayuan o impluwensiya sa lipunan, hindi sa pagkakasunod-sunod.
- source_word: οὐκ ὀλίγαι
  choice: hindi kakaunti
  rationale: Pinananatili ang litotes o sadyang mapagpigil na pagbibigay-diin ni Lucas.
- source_word: τε ... τε
  choice: gayundin ... at
  rationale: Maayos nitong pinag-uugnay sa Filipino ang dalawang karagdagang pangkat.
theological_decisions:
- issue: Kung gagamit ng tahasang wikang tumutukoy sa pagbabalik-loob para sa ἐπείσθησαν
  choice: nahikayat
  alternative: sumampalataya
  rationale: πείθω ang ginamit, hindi πιστεύω; kaya pinananatili ng “nahikayat” ang leksikal na pagkakaiba at hindi nito pinalalabis ang sinabi ng teksto.
- issue: Kung gaano kalinaw na ilalahad ang relihiyosong pagkakakilanlan ng σεβομένων Ἑλλήνων
  choice: mga Griyegong may takot sa Diyos
  alternative: mga debotong Griyego / mga Griyegong sumasamba sa Diyos
  rationale: Ipinahihiwatig ng gamit sa Mga Gawa ang mga Hentil na may kaugnayan sa pagsambang Judio; malinaw ang salin ngunit hindi nagdaragdag ng denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang “hindi kakaunti” upang maipakita ang retorikal na paraan ng orihinal, at ginamit ang “prominente” sa panlipunang diwa ng πρῶτος.
