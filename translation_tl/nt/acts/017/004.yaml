  - severity: low
    issue: Hindi ganap na malinaw ang saklaw ng “gayundin.”
    rationale: Mas malinaw na iugnay nang tuwiran ang mga karagdagang pangkat sa pagsama kina Pablo at Silas sa pamamagitan ng “kasama ang.”
  - severity: low
    issue: Hindi sapat na naipapakita ng talababa ang nuwansang kaugnay ng προσεκληρώθησαν.
