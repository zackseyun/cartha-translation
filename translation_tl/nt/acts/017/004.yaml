revisions:
- from: At ang ilan sa kanila ay nahikayat at sumama kina Pablo at Silas[a], gayundin ang napakaraming Griyegong may takot sa Diyos at hindi kakaunti sa mga prominenteng babae.
  to: At ang ilan sa kanila ay nahikayat at sumama kina Pablo at Silas[a], kasama ang isang malaking bilang ng mga Griyegong may takot sa Diyos at hindi kakaunti sa mga kilalang babae.
  rationale: Pinalitan ang “gayundin ang napakaraming” ng “kasama ang isang malaking bilang” upang mas tumpak na maipakita ang πλῆθος πολύ at malinaw na maiugnay ang dalawang karagdagang pangkat sa pagsama kina Pablo at Silas. Pinalitan ang “mga prominenteng babae” ng mas likas na “mga kilalang babae,” na pinananatili ang diwa ng panlipunang katayuan. Inayos ang talababa upang mas malapit nitong maipakita ang pambihirang pandiwang προσεκληρώθησαν nang hindi nagpapataw ng interpretasyong doktrinal.
