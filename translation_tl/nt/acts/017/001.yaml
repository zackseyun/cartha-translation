id: ACT.17.1
reference: Acts 17:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Διοδεύσαντες δὲ τὴν Ἀμφίπολιν καὶ ⸀τὴν Ἀπολλωνίαν ἦλθον εἰς Θεσσαλονίκην, ὅπου ⸀ἦν συναγωγὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/001.yaml
  text: After passing through Amphipolis and Apollonia[a], they came to Thessalonica[b], where there was a synagogue of the Jews.
translation:
  language: tl
  text: Matapos nilang dumaan sa Amfipolis at Apolonia, nakarating sila sa Tesalonica, kung saan may sinagoga ang mga Judio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διοδεύσαντες
  choice: Matapos nilang dumaan
  rationale: Ipinahahayag ng aorist participle na nauna ang pagdaan sa dalawang lungsod bago sila nakarating sa Tesalonica. Likas sa makabagong Tagalog ang anyong ito at hindi nito ipinahihiwatig na doon sila nanatili.
- source_word: δὲ
  choice: —
  rationale: Banayad na pang-ugnay lamang ito sa daloy ng salaysay; hindi na kailangang tumbasan nang tahasan sa natural na Tagalog.
- source_word: τὴν Ἀμφίπολιν καὶ τὴν Ἀπολλωνίαν
  choice: sa Amfipolis at Apolonia
  rationale: Isinalin ang mga pangalang-pook ayon sa bigkas at baybay na angkop sa Filipino.
- source_word: ἦλθον εἰς Θεσσαλονίκην
  choice: nakarating sila sa Tesalonica
  rationale: Ipinakikita ng ἦλθον at εἰς ang pagpunta sa destinasyon. Mas natural sa kontekstong ito ang “nakarating” kaysa sa payak na “dumating,” habang pinananatili ang diwa ng kilos.
- source_word: ὅπου
  choice: kung saan
  rationale: Natural na katumbas sa Tagalog ng pang-abay na panlunan na nagpapakilala sa kasunod na sugnay.
- source_word: συναγωγὴ τῶν Ἰουδαίων
  choice: may sinagoga ang mga Judio
  rationale: Walang artikulo ang συναγωγή, kaya ang eksistensiyal na “may” ay angkop. Ang “ang mga Judio” ay natural na nagpapahayag na ang sinagoga ay kaugnay ng lokal na pamayanang Judio.
theological_decisions:
- issue: Kahulugan ng Ἰουδαίων sa salaysay
  choice: mga Judio
  alternative: mga taga-Judea
  rationale: Tumutukoy ito rito sa pamayanang Judio na may sinagoga sa Tesalonica, hindi lamang sa mga taong nagmula o naninirahan sa Judea.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maiikling pangungusap at karaniwang ayos ng salaysay, habang pinananatili ang ugnayang temporal at panlunan ng Griyego.
