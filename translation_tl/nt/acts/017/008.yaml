lexical_decisions:
- source_word: ἐτάραξαν
  choice: ginulo
  rationale: Ipinahahayag ng ταράσσω ang paglikha ng pagkabalisa o kaguluhan. Likas sa modernong Tagalog ang “ginulo” at maaari itong tumukoy sa naging epekto kapwa sa mga tao at sa mga opisyal nang hindi pinalalabis ang tindi.
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay sa pagpapatuloy ng salaysay ang δέ rito; natural itong isalin na “At.”
- source_word: τὸν ὄχλον
  choice: ang mga tao
  rationale: Tumutukoy ang ὄχλος sa isang pulutong. Mas natural sa karaniwang modernong Tagalog ang “ang mga tao” kaysa sa mas pormal na “ang karamihan” o sa “mandurumog,” na magdaragdag ng di-tiyak na poot.
- source_word: τοὺς πολιτάρχας
  choice: ang mga opisyal ng lungsod
  rationale: Ang πολιτάρχης ay isang lokal na titulong sibiko sa Macedonia. Malinaw sa mga mambabasa ang “mga opisyal ng lungsod,” samantalang ipinapaliwanag sa talababa ang mas tiyak na katawagan.
- source_word: ἀκούοντας ταῦτα
  choice: nang marinig ng mga ito ang mga bagay na iyon
  rationale: Ang participle na ἀκούοντας ay tumutukoy kapwa sa mga tao at sa mga opisyal, kaya tahasang ginagamit ang “ng mga ito” upang hindi mapagkamalang ang mga nanggugulo ang nakarinig. Pinananatili ng “mga bagay na iyon” ang maramihang ταῦτα.
