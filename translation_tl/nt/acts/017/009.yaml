  text: καὶ λαβόντες τὸ ἱκανὸν παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν ἀπέλυσαν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/009.yaml
  text: And after taking security from Jason and the others[a], they released them.
translation:
  language: tl
  text: Matapos tumanggap ng panagot mula kay Jason at sa iba pa[a], pinalaya nila ang mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sapat na halaga”; malamang na isang legal na garantiya o panagot upang matiyak ang mapayapang asal.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: Matapos silang kumuha
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa pangunahing pandiwang ἀπέλυσαν; likas sa Tagalog ang hulma na “matapos ...” upang mapanatili ang pagkakasunod ng mga pangyayari.
- source_word: τὸ ἱκανὸν
  choice: panagot
  rationale: Sa kontekstong legal, tumutukoy ang idyoma sa sapat na garantiya o segurong ibinigay upang matiyak ang pagsunod. Hindi nito nililimitahan ang kahulugan sa makabagong teknikal na “piyansa” o sa tiyak na halagang salapi.
- source_word: παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν
  choice: mula kay Jason at sa iba pa
  rationale: Ang παρά na may genitive ay nagpapahiwatig ng pinagmulan, kaya “mula kay.” Ang “iba pa” ay natural na katumbas ng λοιπῶν at tumutukoy sa iba pang kasamang sangkot.
- source_word: ἀπέλυσαν
  choice: pinalaya nila
  rationale: Sa kontekstong sibiko o legal, ang ἀπολύω ay nangangahulugang pakawalan o palayain ang mga taong pinigil. Ang “pinalaya” ay malinaw at marangal na salin.
- source_word: αὐτούς
  choice: ang mga ito
  rationale: Tumutukoy ang panghalip na maramihan sa mga taong pinigil, lalo na kina Jason at sa iba pa. Iniiwasan ng “mga ito” ang posibleng kalituhan ng “sila” kasunod ng ibang pangkat na gumaganap ng kilos.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang legal na himig nang hindi gumagamit ng makitid o nakatali-sa-isang-sistemang terminong gaya ng “piyansa.”
