  terminology: Ang ‘panagot’ ay angkop para sa τὸ ἱκανόν sa legal na konteksto at hindi labis na isinasapamantayan bilang ‘piyansa.’ Ang ‘sapat na halaga’ sa talababa ay pinananatili bilang alternatibong leksikal, samantalang ang paliwanag ay maingat na nagsasaad ng malamang na legal na gamit.
