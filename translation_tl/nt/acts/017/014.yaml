base_translation:
  language: en
  yaml_path: translation/nt/acts/017/014.yaml
  text: Then the brothers immediately sent Paul away to go as far as the sea[b][a], but both Silas and Timothy remained there.
translation:
  language: tl
  text: Pagkatapos nito, agad na ipinadala ng mga kapatid[a] si Pablo palayo upang magtungo hanggang sa dagat[b], ngunit kapuwa sina Silas at Timoteo ay nanatili roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, panlalaking pangmaramihan ang “mga kapatid”; maaari itong tumukoy nang sama-sama sa mga kapuwa mananampalataya, lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: O “hanggang sa baybayin” o “patungo sa dagat.” Maaaring tumukoy ang pananalita sa paglalakbay hanggang sa baybayin nang hindi nililinaw kung nagpatuloy si Pablo sakay ng barko.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως δὲ τότε
  choice: Kaya agad
  rationale: Ipinahahayag ang agarang kilos at ang pagpapatuloy ng salaysay nang hindi pilit na isinasalin nang hiwa-hiwalay ang bawat kataga.
- source_word: ἐξαπέστειλαν
  choice: pinaalis
  rationale: Natural sa modernong Tagalog at malinaw na ipinakikitang ipinadala si Pablo palayo sa lugar.
- source_word: οἱ ἀδελφοὶ
  choice: mga kapatid
  rationale: Karaniwang tawag sa mga kapuwa mananampalataya sa Tagalog; hindi ito likas na limitado sa mga lalaki, kaya napapanatili rin ang posibleng kolektibong diwa ng Griyego.
- source_word: πορεύεσθαι
  choice: pinapunta
  rationale: Ipinakikita ang layunin ng pagpapadala sa payak at natural na Tagalog.
- source_word: ἕως ἐπὶ τὴν θάλασσαν
  choice: hanggang sa baybayin
  rationale: Ang θάλασσα ay literal na dagat, ngunit sa pariralang nagsasaad ng paglalakbay, ang tinutukoy na mararating ay malamang na baybayin; pinananatili ng 'hanggang' ang hangganang ipinahihiwatig ng ἕως.
- source_word: ὑπέμεινάν
  choice: nanatili
  rationale: Sa kontekstong ito, ang pandiwa ay nangangahulugang manatili sa isang lugar, hindi magtiis.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: kapuwa ... sina Silas at Timoteo
  rationale: Pinananatili ang magkapares na diin ng τε ... καὶ sa natural na ayos ng Tagalog.
- source_word: ἐκεῖ
  choice: roon
  rationale: Natural na katumbas na panlunan, na tumutukoy sa lugar na iniwan ni Pablo.
theological_decisions:
- issue: Saklaw ng ἀδελφοί bilang tawag sa pamayanang sumasampalataya
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga mananampalataya
  rationale: Sa modernong Tagalog, ang 'mga kapatid' ay maaaring tumukoy nang kolektibo sa mga kapuwa mananampalataya nang hindi binabago ang larawang pampamilya ng salitang Griyego. Isinasama ang talababa upang ipabatid na panlalaking pangmaramihan ang anyo sa Griyego at maaaring kolektibo ang gamit.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang biblikal na pangalang “Timoteo” at ang likas na kolektibong tawag na “mga kapatid.”
