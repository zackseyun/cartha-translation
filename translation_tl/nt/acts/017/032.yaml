  text: Ἀκούσαντες δὲ ἀνάστασιν νεκρῶν οἱ μὲν ἐχλεύαζον οἱ δὲ εἶπαν Ἀκουσόμεθά σου ⸂περὶ τούτου καὶ πάλιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/032.yaml
  text: When they heard of the resurrection of the dead[a], some mocked, but others said, “We will hear you again about this.”
translation:
  language: tl
  text: Nang marinig nila ang tungkol sa muling pagkabuhay ng mga patay, nangutya ang ilan, ngunit sinabi naman ng iba, “Pakikinggan ka naming muli[a] tungkol dito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Pakikinggan ka namin tungkol dito sa ibang pagkakataon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Nang marinig nila
  rationale: Ipinahahayag ng aorist participle ang pangyayaring nagbigay-daan sa sumunod na mga tugon. Likas sa Tagalog ang “Nang marinig nila”; hindi na kailangang tumbasan nang hiwalay ang banayad na pang-ugnay na δὲ.
- source_word: ἀνάστασιν νεκρῶν
  choice: muling pagkabuhay ng mga patay
  rationale: Karaniwang malinaw na salin ito ng konsepto ng pagkabuhay na muli na kinasasangkutan ng mga patay bilang isang pangkat, nang hindi dinaragdagan ang teolohikal na diwa.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: ang ilan, ngunit ... naman ng iba
  rationale: Malinaw at likas na ipinakikita ng pares na ito ang magkasalungat na tugon ng dalawang pangkat.
- source_word: ἐχλεύαζον
  choice: nangutya
  rationale: Tuwirang inilalarawan nito ang mapanlibak na reaksiyon. Hindi idinagdag ang posibleng inceptive na diwang “nagsimulang,” sapagkat hindi iyon kailangang ipilit mula sa imperfect.
- source_word: Ἀκουσόμεθά σου
  choice: Pakikinggan ka namin
  rationale: Ang ἀκούω na may genitive ng tao ay tumutukoy sa pakikinig sa taong nagsasalita. Pinananatili ng “ka” ang isahang pagtukoy kay Pablo.
- source_word: περὶ τούτου καὶ πάλιν
  choice: muli tungkol dito
  rationale: Pinananatili ang tahasang πάλιν (“muli”) at ang paksa ng pakikinig, habang nananatiling natural sa modernong Tagalog.
theological_decisions:
- issue: Saklaw ng pariralang ἀνάστασιν νεκρῶν sa harap ng mga tagapakinig na pagano
  choice: muling pagkabuhay ng mga patay
  alternative: pagkabuhay mula sa mga patay
  rationale: Mas natural na tumutukoy ang parirala sa muling pagkabuhay na nauukol sa mga patay bilang pangkat. Hindi nito nililimitahan ang pahayag sa pagkabuhay ng isang partikular na tao o ipinapasok ang paliwanag na wala sa talata.
- issue: Ugnayan ng καὶ πάλιν sa pangungusap
  choice: Pakikinggan ka naming muli tungkol dito
  alternative: Pakikinggan ka namin tungkol dito sa ibang pagkakataon
  rationale: Maaaring idiin ng πάλιν ang muling pakikinig, na sa konteksto ay pakikinig sa ibang pagkakataon. Pinananatili sa pangunahing teksto ang tahasang “muli,” at inilalahad sa talababa ang natural na alternatibong nagpapakita ng temporal na diwa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “nangutya” sa halip na mas kolokyal na “pinagtawanan,” at iniwasan ang hindi kailangang pagpapaliwanag sa doktrina ng muling pagkabuhay.
