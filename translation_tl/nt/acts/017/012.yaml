  yaml_path: translation/nt/acts/017/012.yaml
  text: Therefore many of them believed[b][a], and not a few of the prominent Greek women and men.
translation:
  language: tl
  text: Kaya marami sa kanila ang sumampalataya, at hindi kakaunti sa mga kilalang[a] babaeng Griego at sa mga lalaki ang sumampalataya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kilalang” ay maaari ring isaling “iginagalang” o “mataas ang katayuan sa lipunan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griego, “hindi kakaunti,” isang paraan ng pagsasabing malaki-laki ang bilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ μὲν οὖν
  choice: Kaya marami
  rationale: Ang μὲν οὖν ay nagpapahiwatig ng transisyon at bunga ng masusing pagsasaliksik sa Kasulatan na binanggit sa naunang talata. Likas na ipinapahayag ito ng “Kaya” sa modernong Tagalog.
- source_word: ἐξ αὐτῶν
  choice: sa kanila
  rationale: 'Pinananatili nito ang partitive sense: marami mula sa grupong kababanggit lamang ang sumampalataya.'
- source_word: ἐπίστευσαν
  choice: sumampalataya
  rationale: Karaniwang salin ito ng πιστεύω sa kontekstong tumutukoy sa pagtugon sa ipinahayag na mensahe, nang hindi tahasang nagdaragdag ng layon na hindi nakasaad sa talata.
- source_word: τῶν Ἑλληνίδων γυναικῶν
  choice: mga babaeng Griego
  rationale: Ang Ἑλληνίδων ay tumutukoy sa kanilang pagiging Griego, at ang γυναικῶν ay “mga babae,” sapagkat walang relasyong mag-asawa na ipinahihiwatig dito.
- source_word: τῶν εὐσχημόνων
  choice: kilalang
  rationale: Sa kontekstong ito, ang εὐσχήμων ay nagpapahiwatig ng kinikilalang katayuan o pagiging prominente sa lipunan. Natural at madaling maunawaan sa Tagalog ang “kilalang,” habang inilalahad sa talababa ang saklaw ng kahulugan.
- source_word: οὐκ ὀλίγοι
  choice: hindi kakaunti
  rationale: Pinananatili nito ang litotes ng Griego sa halip na gawing payak na “marami.”
- source_word: καὶ
  choice: pati na rin
  rationale: Likas nitong iniuugnay sa Tagalog ang karagdagang mga grupong sumampalataya.
theological_decisions:
- issue: Kung lalagyan ng tahasang layon o mas detalyadong doktrinal na pananalita ang ἐπίστευσαν
  choice: sumampalataya
  alternative: sumampalataya sa Mesiyas; naniwala sa mensahe
  rationale: Hindi tahasang binabanggit sa talata ang layon ng pananampalataya, bagaman nauunawaan iyon mula sa konteksto. Pinananatili ng payak na salin ang pagkakasabi at hindi nagdaragdag ng doktrinal na detalye.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinanatili ang litotes na “hindi kakaunti” at ang walang tahasang layon na “sumampalataya.” Ang mga panandang [a] at [b] ay kapuwa lumilitaw sa pangunahing teksto at tumutugma sa mga talababa.
