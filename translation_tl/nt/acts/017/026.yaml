source:
  edition: SBLGNT
  text: ἐποίησέν τε ἐξ ⸀ἑνὸς πᾶν ἔθνος ἀνθρώπων κατοικεῖν ἐπὶ ⸂παντὸς προσώπου⸃ τῆς γῆς, ὁρίσας προστεταγμένους καιροὺς καὶ τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/026.yaml
  text: And he made from one man every nation of mankind to live on the whole face of the earth[a], having determined their appointed times and the boundaries of their dwelling place[b],
translation:
  language: tl
  text: Mula sa isang tao ay ginawa niya ang lahat ng bansa ng sangkatauhan upang manirahan sa buong ibabaw ng lupa,[a] at itinakda niya ang mga panahong itinalaga para sa kanila[b] at ang mga hangganan ng kanilang tirahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito ay “mula sa iisang dugo” sa halip na “mula sa isa.” Sinusunod ng pangunahing teksto ang pagbasa ng SBLGNT na “mula sa isa,” at idinagdag ang “tao” para sa kalinawan.
    reason: textual_variant
  - marker: b
    text: Maaari ring isalin na “ang mga itinakdang panahon nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησέν
  choice: ginawa niya
  rationale: Malawak ang saklaw ng ποιέω rito. Pinananatili ng “ginawa niya” ang diwa ng paglikha o pagpapangyari nang hindi labis na tinutukoy ang eksaktong paraan.
- source_word: τε
  choice: at
  rationale: Nag-uugnay ang τέ sa naunang pangangatwiran; natural itong ipinahahayag sa Filipino sa pamamagitan ng “at.”
- source_word: ἐξ ἑνὸς
  choice: mula sa isang tao
  rationale: Literal na “mula sa isa” ang SBLGNT. Idinagdag ang “tao” bilang malinaw at likas na ipinahihiwatig na referent sa Filipino, nang hindi ginagamit ang variant na “dugo.”
- source_word: πᾶν ἔθνος ἀνθρώπων
  choice: lahat ng bansa ng sangkatauhan
  rationale: Ipinahahayag nito ang bawat bansang bumubuo sa sangkatauhan. Mas natural sa modernong Filipino ang “lahat ng bansa” kaysa sa “bawat bansa ng mga tao.”
- source_word: κατοικεῖν
  choice: upang manirahan
  rationale: Malinaw na ipinahahayag ng “upang manirahan” ang layunin o kinalabasan ng infinitive at ang diwa ng permanenteng paninirahan.
- source_word: ἐπὶ παντὸς προσώπου τῆς γῆς
  choice: sa buong ibabaw ng lupa
  rationale: Ang πρόσωπον ay idiomatikong tumutukoy sa mukha o ibabaw. Ang “buong ibabaw ng lupa” ay malinaw at natural sa Filipino.
- source_word: ὁρίσας
  choice: itinakda niya
  rationale: Ipinahahayag nito ang pagtatakda ng Diyos ng mga limitasyon, habang maayos na inuugnay ang participle sa pangunahing pandiwa sa Filipino.
- source_word: προστεταγμένους καιρούς
  choice: mga panahong itinalaga para sa kanila
  rationale: Ang καιροί ay mahahalagang panahon o kapanahunan, at ang προστεταγμένους ay nagpapahiwatig na ang mga ito ay itinakda o itinalaga. Ginagawang tahas ng “para sa kanila” ang ugnayang ipinahihiwatig ng konteksto.
- source_word: ὁροθεσίας
  choice: mga hangganan
  rationale: Ang ὁροθεσία ay tumutukoy sa itinakdang mga hangganan o limitasyong heograpikal.
- source_word: τῆς κατοικίας αὐτῶν
  choice: ng kanilang tirahan
  rationale: Pinananatili ng “tirahan” ang kolektibong singular ng Griyego at likas itong tumutukoy sa dakong tinitirhan ng mga bansa.
theological_decisions:
- issue: Kung tahasang tutukuyin ang ipinahihiwatig ng ἐξ ἑνὸς
  choice: mula sa isang tao
  alternative: mula sa isa
  rationale: Walang “dugo” sa SBLGNT, kaya hindi iyon inilagay sa pangunahing teksto. Gayunman, maaaring bitin sa Filipino ang “mula sa isa”; nililinaw ng “tao” ang ipinahihiwatig na pinagmulang tao habang pinananatili ang punto tungkol sa iisang pinagmulan ng sangkatauhan.
- issue: Kung paano ipahahayag ang ἀνθρώπων nang saklaw ang buong sangkatauhan
  choice: sangkatauhan
  alternative: mga tao
  rationale: Kolektibo at pangkalahatan ang gamit ng salita rito. Malinaw na saklaw ng “sangkatauhan” ang lahat ng tao nang hindi nililimitahan sa kasariang lalaki.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinili ang “buong ibabaw ng lupa” bilang natural na katumbas ng biblikal na idyomang “buong mukha ng lupa.” Inilagay ang talababa [b] kaagad pagkatapos ng pariralang tinatalakay nito.
