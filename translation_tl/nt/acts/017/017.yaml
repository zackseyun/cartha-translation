base_translation:
  language: en
  yaml_path: translation/nt/acts/017/017.yaml
  text: So he was reasoning in the synagogue with the Jews and those who worshiped God[b][a], and in the marketplace every day with those who happened to be there.
translation:
  language: tl
  text: Kaya nakipagkatuwiranan siya sa sinagoga kasama ang mga Judio at ang mga sumasamba sa Diyos[a], at araw-araw sa pamilihan[b] kasama ang mga taong nagkataong naroroon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga may takot sa Diyos,” isang katawagan sa mga di-Judiong nakikibahagi sa pagsambang Judio.
    reason: lexical_alternative
  - marker: b
    text: Ang “pamilihan” ay hindi lamang lugar ng pagbili at pagbebenta; isa rin itong pampublikong sentro ng pagtitipon at mga gawaing sibiko.
    reason: cultural_note
lexical_decisions:
- source_word: διελέγετο
  choice: nakipagkatuwiranan
  rationale: Ipinahihiwatig ng imperpektong anyo ang paulit-ulit o nagpapatuloy na pakikipag-usap na may pangangatwiran; pinananatili rin ng anyong may “pakipag-” ang diyalogong katangian ng kilos.
- source_word: μὲν οὖν
  choice: Kaya
  rationale: Likas na nag-uugnay sa naunang konteksto at nagpapakita ng pagpapatuloy o bunga nang hindi nagiging matigas ang Filipino.
- source_word: συναγωγῇ
  choice: sinagoga
  rationale: Tumutukoy ito sa kilalang lugar at institusyon ng pagtitipong Judio.
- source_word: τοῖς Ἰουδαίοις
  choice: mga Judio
  rationale: Tumutukoy sa pamayanang Judio na nasa sinagoga, hindi lamang sa mga taga-Judea.
- source_word: τοῖς σεβομένοις
  choice: mga sumasamba sa Diyos
  rationale: Malinaw na ipinapahayag ang relihiyosong diwa sa konteksto ng sinagoga; ang “Diyos” ay likas na ipinahiwatig ng gamit sa Mga Gawa at ng konteksto.
- source_word: ἀγορᾷ
  choice: pamilihan
  rationale: Karaniwang salin para sa pampublikong lugar na may gawaing pangkalakalan, bagaman nagsilbi rin itong sentrong panlipunan at sibiko.
- source_word: κατὰ πᾶσαν ἡμέραν
  choice: araw-araw
  rationale: Natural at maikli itong pagpapahayag ng regular na pag-uulit bawat araw.
- source_word: πρὸς τοὺς παρατυγχάνοντας
  choice: sa sinumang naroroon
  rationale: Sinasaklaw nito ang mga taong nagkataong naroon o nakatagpo niya, nang hindi nililimitahan sa mga dumaraan lamang.
