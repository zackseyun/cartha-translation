translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inulit ang “nakipagkatuwiranan” sa ikalawang pangungusap upang maiwasan ang mabigat at malabong koordinasyon, habang pinananatili ang iisang nagpapatuloy na kilos ng tekstong Griyego. Inayos ang mga panandang talababa ayon sa mismong salitang tinutukoy ng bawat tala.
