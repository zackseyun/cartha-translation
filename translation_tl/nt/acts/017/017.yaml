- from: Kaya nakipagkatuwiranan siya sa sinagoga sa mga Judio at sa mga sumasamba sa Diyos[a]. Nakipagkatuwiranan din siya araw-araw sa pamilihan[b] sa sinumang naroroon.
  to: Kaya nakipagkatuwiranan siya sa sinagoga kasama ang mga Judio at ang mga sumasamba sa Diyos[a], at araw-araw sa pamilihan[b] kasama ang mga taong nagkataong naroroon.
  rationale: Pinag-isa ang pagsasalin ng iisang imperpektong pandiwa sa isang pangungusap at pinalitan ang «sinumang naroroon» ng «mga taong nagkataong naroroon» upang maipreserba ang maramihan at kontingenteng diwa ng παρατυγχάνοντας. Pinanatili ang mga terminong at talababa na tapat sa konteksto at natural sa Filipino.
