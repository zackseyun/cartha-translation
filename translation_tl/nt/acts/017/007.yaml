  text: οὓς ὑποδέδεκται Ἰάσων· καὶ οὗτοι πάντες ἀπέναντι τῶν δογμάτων Καίσαρος πράσσουσι, βασιλέα ⸂ἕτερον λέγοντες⸃ εἶναι Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/007.yaml
  text: These men[a], whom Jason has welcomed, are all acting against Caesar’s decrees[c][b], saying that there is another king—Jesus.
translation:
  language: tl
  text: Ang mga taong ito ay pinatuloy ni Jason[a], at silang lahat ay kumikilos laban sa mga kautusan[b] ng Emperador; sinasabi nilang may iba pang hari[c]—si Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinanggap bilang mga panauhin.” Ang salitang Griyego ay maaaring tumukoy sa pagtanggap o pagpapatuloy sa mga panauhin.
    reason: lexical_alternative
  - marker: b
    text: O “mga utos” o “mga opisyal na pasiya.”
    reason: lexical_alternative
  - marker: c
    text: O “ibang hari.” Inilalahad ng Griyego ang paratang na may isa pang hari, kaya ipinahihiwatig ang isang karibal sa paghahari ni Cesar.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδέδεκται
  choice: pinatuloy
  rationale: Ipinahihiwatig ng pandiwa ang pagtanggap sa kanila bilang mga panauhin at ang pagpapatuloy sa tahanan; natural at tiyak dito ang “pinatuloy.”
- source_word: ἀπέναντι
  choice: laban sa
  rationale: Malinaw nitong ipinapahayag ang pagsalungat o paglabag sa kontekstong pampolitika at legal.
- source_word: δογμάτων
  choice: mga utos
  rationale: Tumutukoy ito sa mga opisyal na kautusan o pasiya. Madaling maunawaan ang “mga utos,” habang inilalahad sa talababa ang mas pormal na alternatibo.
- source_word: πράσσουσι
  choice: kumikilos
  rationale: Pinananatili nito ang diwa ng kasalukuyan at patuloy na pagkilos sa paratang.
- source_word: βασιλέα ἕτερον
  choice: iba pang hari
  rationale: Tuwirang pinananatili ang βασιλεύς bilang “hari” at ang ideya ng isa pang hiwalay na naghahari o umaangkin ng paghahari.
- source_word: λέγοντες
  choice: sinasabi
  rationale: Tapat ito sa payak na lakas ng participle at hindi dinaragdagan ng pag-aalinlangan o diin na wala sa salita.
- source_word: εἶναι Ἰησοῦν
  choice: may iba pang hari—si Jesus
  rationale: Natural na binubuo sa Tagalog ang di-tuwirang pahayag at pinananatili ang madiing pagkakakilanlan kay Jesus sa hulihan.
- source_word: οὗτοι πάντες
  choice: silang lahat
  rationale: Pinananatili ang kolektibo at mariing saklaw ng paratang; malinaw na tumutukoy ito sa mga taong pinatuloy ni Jason.
theological_decisions:
- issue: Pampolitikang bigat ng paratang na hari si Jesus
  choice: Panatilihin ang “hari” at iharap ito bilang pag-angkin tungkol sa isa pang hari na salungat sa mga utos ng Emperador.
  alternative: Gawing “pinuno” o “tagapamahala” upang pahinain ang pampolitikang dating.
  rationale: Tahasang iniuugnay ng teksto ang paratang sa mga utos ni Caesar. Pinananatili ng “hari” ang tunay na pampolitika at teolohikal na tensiyon nang hindi ipinapaliwanag o nilulutas ito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Emperador” para sa Caesar bilang titulong pampolitika sa konteksto, at “pinatuloy” upang maipakita ang hospitable na diwa nang hindi nagiging mahaba ang pangunahing teksto.
