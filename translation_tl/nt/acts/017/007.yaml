  source_fidelity: 'Tumpak ang pangunahing diwa ng paratang: pinatuloy ni Jason ang mga taong ito, kumikilos sila laban sa mga opisyal na atas ni Caesar, at sinasabi nilang si Jesus ay isa pang hari. Gayunman, mas mabuting iwasan ang “sapagkat,” na maaaring magpahiwatig ng mas tuwirang ugnayang sanhi kaysa sa simpleng participial na paglalahad na λέγοντες (“na sinasabi”). Ang “mga kautusan” ay mas akma kaysa “mga utos” para sa δογμάτων sa kontekstong opisyal at pampubliko.'
  naturalness: Natural at malinaw ang rebisyon sa modernong Filipino Tagalog. Ang “Ang mga taong ito ay pinatuloy ni Jason” ay tuwirang tumutugon sa οὓς ὑποδέδεκται Ἰάσων, at ang semicolon bago “sinasabi nilang” ay natural na naghihiwalay sa nilalaman ng paratang nang hindi nagdaragdag ng interpretasyon.
  terminology: Pinananatili ang “hari” para sa βασιλεύς at “Emperador” bilang malinaw na pagtukoy sa katayuang pampolitika ni Caesar. Ginamit ang “mga kautusan” para sa δογμάτων. Inayos ang “Caesar” sa talababa bilang “Cesar” upang maging pare-pareho ang anyong Filipino.
