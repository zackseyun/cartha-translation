- from: Sila ang pinatuloy ni Jason[a], at silang lahat ay kumikilos laban sa mga utos[b] ng Emperador, sapagkat sinasabi nilang may iba pang hari[c]—si Jesus.
  to: Ang mga taong ito ay pinatuloy ni Jason[a], at silang lahat ay kumikilos laban sa mga kautusan[b] ng Emperador; sinasabi nilang may iba pang hari[c]—si Jesus.
  rationale: Pinalinaw ang panimulang pangngalan upang maipakita ang tinutukoy ng οὓς at ang demonstratibong bigat ng οὗτοι. Pinalitan ang “mga utos” ng “mga kautusan” para sa opisyal na χαρακτήρ ng δογμάτων. Pinalitan ang “sapagkat” ng paghihiwalay na may semicolon upang maipakita ang λέγοντες nang walang dagdag na ugnayang sanhi. Walang binagong kahulugan ng paratang o pampolitika at teolohikal na tensiyon nito.
