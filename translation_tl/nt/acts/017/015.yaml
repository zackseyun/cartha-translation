id: ACT.17.15
reference: Acts 17:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ ⸀καθιστάνοντες τὸν Παῦλον ⸀ἤγαγον ἕως Ἀθηνῶν, καὶ λαβόντες ἐντολὴν πρὸς τὸν Σιλᾶν καὶ ⸀τὸν Τιμόθεον ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτὸν ἐξῄεσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/015.yaml
  text: Those who were escorting Paul brought him as far as Athens[a], and after receiving instructions for Silas and Timothy to come to him as quickly as possible[b], they departed.
translation:
  language: tl
  text: Dinala si Pablo ng mga naghatid sa kanya hanggang Atenas.[a] Pagkatanggap nila ng bilin para kina Silas at Timoteo na pumunta sa kanya sa lalong madaling panahon,[b] umalis sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa Atenas.” Pinananatili ng “hanggang Atenas” ang diwa na sinamahan at inihatid nila si Pablo hanggang sa destinasyong iyon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “utos.” Ang salitang Griyego ay maaaring tumukoy sa isang awtoritatibong utos o sa isang bilin o tagubilin.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθιστάνοντες
  choice: mga naghatid sa kanya
  rationale: Sa konteksto, tumutukoy ito sa mga taong sumama kay Pablo at nagdala sa kanya nang ligtas sa patutunguhan. Natural sa modernong Tagalog ang “naghatid” at hindi nito ipinapalagay ang isang pormal o militar na eskort.
- source_word: ἤγαγον
  choice: Dinala
  rationale: Ipinapahayag ng aorist na pandiwa ang natapos na pagdadala kay Pablo sa Atenas. Ang “dinala” ay tuwiran at natural sa salaysay.
- source_word: ἕως Ἀθηνῶν
  choice: hanggang Atenas
  rationale: Pinananatili ng “hanggang” ang diwa ng lawak ng paglalakbay hanggang sa nasabing destinasyon, sa halip na gawing simpleng “sa Atenas.”
- source_word: λαβόντες ἐντολήν
  choice: Pagkatanggap nila ng bilin
  rationale: Ang temporal na “pagkatanggap” ay malinaw na nag-uugnay sa sumunod na kilos. Ang “bilin” ay maaaring magpahiwatig ng tagubilin o utos nang hindi labis na pinatitindi ang awtoritatibong himig.
- source_word: πρὸς τὸν Σιλᾶν καὶ τὸν Τιμόθεον
  choice: para kina Silas at Timoteo
  rationale: Ipinakikita ng “para kina” na sina Silas at Timoteo ang mga tatanggap ng bilin, at idiomatiko ito sa Tagalog.
- source_word: ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτόν
  choice: na pumunta sa kanya sa lalong madaling panahon
  rationale: Malinaw nitong inilalahad ang nilalaman at pagmamadali ng bilin. Pinananatiling tahasan ang panghalip na “sa kanya” gaya ng αὐτόν.
- source_word: ἐξῄεσαν
  choice: umalis sila
  rationale: Natural na pangwakas na kilos sa salaysay ang “umalis sila”; sapat nitong naihahatid ang pag-alis ng mga naghatid matapos tanggapin ang bilin.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “naghatid” at “bilin” bilang pangkaraniwang mga salitang natural sa salaysay, habang pinananatili sa mga talababa ang tunay na leksikal na mga alternatibo.
