base_translation:
  language: en
  yaml_path: translation/nt/acts/017/011.yaml
  text: These were more noble-minded than those in Thessalonica[a], for they received the word with all eagerness[b], examining the Scriptures daily to see whether these things were so.
translation:
  language: tl
  text: Mas marangal ang pag-iisip ng mga taong ito kaysa sa pag-iisip ng mga taga-Tesalonica[a], sapagkat buong pananabik nilang tinanggap ang salita[b] at araw-araw nilang sinuri ang mga Kasulatan upang tingnan kung talaga ngang gayon ang mga bagay na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “higit na marangal.” Maaaring tumukoy ang salitang Griyego sa mas kapuri-puring disposisyon o, bagaman hindi gaanong malamang dito, sa mas mataas na katayuan sa lipunan.
    reason: lexical_alternative
  - marker: b
    text: O “malugod nilang tinanggap ang mensahe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγενέστεροι
  choice: Higit na marangal ang pag-iisip
  rationale: Maaaring tumukoy ang paghahambing sa marangal na katayuan o sa kapuri-puring disposisyon. Ipinapaliwanag ng kasunod na sugnay ang kanilang pagiging marangal sa pamamagitan ng masigasig na pagtanggap at pagsusuri, kaya disposisyon ang itinampok nang hindi lubusang inaalis ang ibang posibleng kahulugan.
- source_word: οἵτινες
  choice: sapagkat
  rationale: Nagsisimula ito ng paliwanag kung bakit sila inilarawang higit na marangal ang pag-iisip; likas na ipinahahayag ng “sapagkat” ang ugnayang iyon sa Tagalog.
- source_word: ἐδέξαντο τὸν λόγον
  choice: tinanggap ang salita
  rationale: Pinananatili ng “salita” ang mahalagang katawagan na λόγος sa Mga Gawa, habang malinaw pa rin sa konteksto na tumutukoy ito sa ipinahayag na mensahe.
- source_word: μετὰ πάσης προθυμίας
  choice: buong pananabik
  rationale: Ipinahahayag nito ang lubos na kahandaan at masigasig na pagnanais na saklaw ng προθυμία at ng panuring na πάσης.
- source_word: τὸ καθ’ ἡμέραν
  choice: araw-araw
  rationale: Likas at tuwirang ipinahahayag nito ang nakagawiang pang-araw-araw na pagkilos.
- source_word: ἀνακρίνοντες
  choice: sinuri
  rationale: Ang pandiwa ay nangangahulugang maingat na pagsusuri o pagsisiyasat. Ang “sinuri” ay malinaw at angkop sa pagkukumpara ng pahayag sa mga Kasulatan.
- source_word: τὰς γραφὰς
  choice: ang mga Kasulatan
  rationale: Sa kontekstong ito, tumutukoy ito sa mga sagradong kasulatang Judio; “mga Kasulatan” ang karaniwan at tumpak na katawagan.
- source_word: εἰ ἔχοι ταῦτα οὕτως
  choice: kung talaga ngang gayon ang mga bagay na ito
  rationale: Pinananatili nito ang anyo ng di-tuwirang pagsisiyasat at ang ideya ng pagtiyak kung umaayon sa gayong kalagayan ang mga ipinahayag, sa halip na palitan agad ito ng mas interpretatibong “kung totoo.”
theological_decisions:
- issue: Kahulugan ng εὐγενέστεροι sa konteksto
  choice: Kapuri-puring disposisyon—“Higit na marangal ang pag-iisip”
  alternative: Mas marangal sa lahi o katayuan sa lipunan
  rationale: Iniuugnay mismo ng talata ang paglalarawan sa kanilang masigasig na pagtanggap at araw-araw na pagsusuri sa mga Kasulatan. Gayunman, inilalahad sa talababa ang tunay na leksikal na alternatibo.
- issue: Paglalarawan sa λόγος
  choice: “ang salita” sa pangunahing teksto
  alternative: “ang mensahe”
  rationale: Pinananatili ng “salita” ang biblikal na katawagan at pagkakaugnay nito sa paggamit sa Mga Gawa nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Kasulatan” bilang pamilyar na katawagang biblikal, at iniwasan ang pagdaragdag ng panimulang pang-ugnay na walang tahasang katumbas sa Griyego.
