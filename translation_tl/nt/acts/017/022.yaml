id: ACT.17.22
reference: Acts 17:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Σταθεὶς ⸀δὲ Παῦλος ἐν μέσῳ τοῦ Ἀρείου Πάγου ἔφη· Ἄνδρες Ἀθηναῖοι, κατὰ πάντα ὡς δεισιδαιμονεστέρους ὑμᾶς θεωρῶ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/022.yaml
  text: So Paul[a], standing in the midst of the Areopagus, said, “Men of Athens, I see that in every way you are very religious.”
translation:
  language: tl
  text: Kaya tumayo si Pablo sa gitna ng Areopago at sinabi, “Mga lalaking taga-Atenas, nakikita kong sa lahat ng bagay ay lubha kayong relihiyoso.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “masyado kayong mapamahiin” o “mas relihiyoso kayo.” Maaaring unawain ang salitang Griyego sa negatibo o positibong diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σταθεὶς
  choice: tumayo
  rationale: Likas na Filipino para sa aorist participle na nagtatakda ng kilos at tagpo bago magsalita si Pablo.
- source_word: δὲ
  choice: Kaya
  rationale: Nagbibigay ng banayad at natural na paglipat sa daloy ng salaysay, nang hindi ito ginagawang mariing pagsalungat.
- source_word: ἐν μέσῳ τοῦ Ἀρείου Πάγου
  choice: sa gitna ng Areopago
  rationale: Pinananatili ang literal na lokatibong diwa at hindi ipinapalagay kung lugar lamang o kapulungang kaugnay nito ang tinutukoy.
- source_word: Ἀρείου Πάγου
  choice: Areopago
  rationale: Karaniwang anyong Filipino ng pangalang Griyego; mas tuwirang kaugnay ng orihinal kaysa sa tradisyonal na “Burol ni Marte.”
- source_word: ἔφη
  choice: sinabi
  rationale: Natural na panimula ng tuwirang pananalita sa salaysay.
- source_word: Ἄνδρες Ἀθηναῖοι
  choice: Mga lalaking taga-Atenas
  rationale: Pinananatili ang panlalaking katawagan at ang pormal na tuwirang pagtawag sa mga taga-Atenas.
- source_word: κατὰ πάντα
  choice: sa lahat ng bagay
  rationale: Pinananatili ang malawak na saklaw ng obserbasyon ni Pablo sa malinaw na Filipino.
- source_word: ὡς
  choice: na
  rationale: Natural na nag-uugnay sa pandiwa ng pagmamasid at sa nilalaman ng napansin ni Pablo.
- source_word: δεισιδαιμονεστέρους
  choice: lubha kayong relihiyoso
  rationale: Naghahatid ng posibleng neutral o magalang na tono nang hindi agad ipinipilit ang negatibong diwang “mapamahiin”; inilalahad sa talababa ang tunay na leksikal na kalabuan at ang anyong pahambing.
- source_word: θεωρῶ
  choice: nakikita kong
  rationale: Maikli at natural na pagpapahayag ng masusing pagmamasid o pagkilala batay sa nakita.
theological_decisions:
- issue: Tono ng paglalarawan ni Pablo sa relihiyon ng mga taga-Atenas sa δεισιδαιμονεστέρους
  choice: Medyo neutral na “lubha kayong relihiyoso” sa pangunahing teksto
  alternative: “masyado kayong mapamahiin” o “mas relihiyoso kayo”
  rationale: Maaaring magtaglay ang salitang Griyego ng positibo, neutral, o negatibong himig. Pinananatili ng pangunahing salin ang maingat na retorika ni Pablo, samantalang inilalagay sa talababa ang ibang tunay na posibilidad.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang pormal na panlalaking pagtawag at ang pangalang Areopago, habang iniwasang lutasin nang tahasan ang kalabuan ng tono ni Pablo.
