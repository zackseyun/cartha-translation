    rationale: Sa modernong Tagalog, maaari itong maunawaan bilang ‘pagkatapos hayaang lumipas’ ang mga panahon. Ang “pinalampas ng Diyos” ay mas malinaw na tumutukoy sa pagkilos ng Diyos na pagtiis o hindi agarang paghatol.
  - severity: low
    issue: Ang tala ay nagdaragdag ng “ang kasama nitong kasalanan.”
    rationale: Bagaman kaayon ito ng mas malawak na konteksto, hindi ito tahasang sinasabi ng talata. Mas maingat na limitahan ang tala sa kahulugan ng pandiwa at sa hindi nito pagpapahiwatig ng pagsang-ayon.
