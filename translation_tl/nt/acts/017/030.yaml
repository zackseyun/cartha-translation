  text: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας ὑπεριδὼν ὁ θεὸς τὰ νῦν ⸀παραγγέλλει τοῖς ἀνθρώποις ⸀πάντας πανταχοῦ μετανοεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/030.yaml
  text: Therefore[a], having overlooked the times of ignorance, God now commands all people everywhere to repent[b],
translation:
  language: tl
  text: Kaya, pinalampas ng Diyos ang mga panahon ng kawalang-alam[a], ngunit ngayon ay inuutusan niya ang lahat ng tao sa lahat ng dako na magsisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pinalampas” ay maaaring mangahulugang tiniis ng Diyos ang mga panahong iyon o hindi siya agad humatol; hindi nito ibig sabihing sinang-ayunan niya ang kawalang-alam.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς μὲν οὖν χρόνους
  choice: Kaya ... ang mga panahon
  rationale: Ipinahihiwatig ng μὲν οὖν ang paglipat at bahagyang paghahambing ng mga dating panahon sa kasalukuyan; natural itong naihahatid ng “Kaya” at “ngayon.”
- source_word: τῆς ἀγνοίας
  choice: ng kawalang-alam
  rationale: Tuwirang isinasalin ang ἄγνοια nang hindi idinaragdag ang tahasang layon ng kawalang-alam, gaya ng “tungkol sa Diyos.”
- source_word: ὑπεριδὼν
  choice: matapos palampasin
  rationale: Ipinapahayag ng aorist participle ang naunang pagkilos ng Diyos. Ang “palampasin” ay nagpapanatili sa diwang hindi niya agad hinatulan ang mga panahong iyon, nang hindi ipinahihiwatig na sinang-ayunan niya ang mga ito.
- source_word: ὁ θεὸς
  choice: ng Diyos
  rationale: Ang Diyos ang simuno ng participle at ng pangunahing pandiwa; inilagay ang pangalan sa natural na ayos ng pangungusap sa Tagalog.
- source_word: τὰ νῦν
  choice: ngayon
  rationale: Malinaw na itinatapat nito ang kasalukuyang utos sa mga dating panahon.
- source_word: παραγγέλλει
  choice: inuutusan
  rationale: Pinananatili nito ang mariing puwersa ng παραγγέλλω bilang pagbibigay ng utos, hindi lamang pagpapahayag o pagtuturo.
- source_word: τοῖς ἀνθρώποις πάντας
  choice: ang lahat ng tao
  rationale: Generic ang ἄνθρωποι at saklaw ng πάντας ang lahat; ang “lahat ng tao” ay likas at hindi nililimitahan sa kalalakihan.
- source_word: πανταχοῦ
  choice: sa lahat ng dako
  rationale: Natural at dignified na katumbas ng adverb na nangangahulugang “everywhere.”
- source_word: μετανοεῖν
  choice: na magsisi
  rationale: Ang “magsisi” ang karaniwan at sapat na malawak na salin sa kontekstong ito, na hindi nililimitahan ang μετανοεῖν sa pagbabago lamang ng isip o damdamin.
theological_decisions:
- issue: Kahulugan ng naunang pagkilos ng Diyos sa “mga panahon ng kawalang-alam”
  choice: “Palampasin” sa diwa ng hindi agad paghatol o pagtitiis, hindi pagsang-ayon.
  alternative: “Hindi pinansin” o “ipinagpaumanhin nang lubos.”
  rationale: 'Pinananatili ng salin ang tensiyon sa ὑπεριδών: pinalampas ng Diyos ang mga panahong iyon, ngunit ipinakikita ng kasalukuyang utos na magsisi na hindi niya sinasang-ayunan ang kasalanan o idolatriya.'
- issue: Saklaw ng utos na magsisi
  choice: Lahat ng tao sa lahat ng dako.
  alternative: Mga lalaki lamang o mga Hentil lamang.
  rationale: Ang τοῖς ἀνθρώποις πάντας πανταχοῦ ay may pangkalahatan at pandaigdig na saklaw; walang batayan sa parirala upang limitahan ito sa isang kasarian o pangkat.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “kawalang-alam,” “palampasin,” at “magsisi” bilang karaniwang salitang madaling maunawaan ngunit angkop sa publikasyong biblikal.
