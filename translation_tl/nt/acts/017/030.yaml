  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: ang Diyos ay nagpakita ng pagtitiis sa mga dating panahon ng kawalang-alam at ngayon ay nag-uutos ng pagsisisi sa lahat ng tao sa lahat ng dako. Gayunman, ang “matapos palampasin” ay maaaring magpahiwatig lamang na hinayaang lumipas ang mga panahon, sa halip na ang Diyos ang ‘nagpalampas’ o nagtiis sa mga ito. Ang payak na “pinalampas” ay mas tuwiran at mas malapit sa ὑπεριδών.'
  naturalness: Natural at marangal ang karamihan ng salin. Mas malinaw at mas matatas ang paglalagay ng pangunahing pandiwa sa “pinalampas ng Diyos,” at ang “ngunit ngayon” ay maayos na naghahatid ng paghahambing ng dating panahon at kasalukuyan.
  terminology: Ang “kawalang-alam,” “inuutusan,” “lahat ng tao,” “sa lahat ng dako,” at “magsisi” ay angkop na mga katumbas. Pinananatili ng “magsisi” ang lawak ng μετανοεῖν nang hindi ito nililimitahan sa pagbabago lamang ng isip. Ang tala ay dapat magpaliwanag ng ‘pinalampas’ bilang pagtitiis o hindi agarang paghatol, nang hindi nagdaragdag ng hindi tahasang nasa talata.
