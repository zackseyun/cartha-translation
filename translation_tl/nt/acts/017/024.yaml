  text: ὁ θεὸς ὁ ποιήσας τὸν κόσμον καὶ πάντα τὰ ἐν αὐτῷ, οὗτος οὐρανοῦ καὶ γῆς ⸂ὑπάρχων κύριος⸃ οὐκ ἐν χειροποιήτοις ναοῖς κατοικεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/024.yaml
  text: The God who made the world and everything in it[a], being Lord of heaven and earth, does not dwell in temples made by hands.
translation:
  language: tl
  text: Ang Diyos na gumawa ng sanlibutan at ng lahat ng nasa sanlibutan—siya ang Panginoon ng langit at lupa—ay hindi naninirahan sa mga templong ginawa ng tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “mga templong ginawa ng mga kamay,” ibig sabihin, mga templong itinayo ng tao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας
  choice: na gumawa
  rationale: Ang aorist participle ay likas na naipapahayag sa Filipino bilang sugnay na naglalarawan sa Diyos; ang “gumawa” ay tuwirang katumbas ng ποιέω nang hindi ipinapasok ang mas tiyak na salitang “lumikha.”
- source_word: κόσμον
  choice: sanlibutan
  rationale: Tumutukoy rito sa kabuuan ng nilikhang daigdig o kaayusan. Ang “sanlibutan” ay malawak, dignified, at karaniwang salitang biblikal na nauunawaan pa rin sa modernong Filipino.
- source_word: πάντα τὰ ἐν αὐτῷ
  choice: lahat ng naririto
  rationale: Pinananatili nito ang saklaw ng πάντα at natural na iniuugnay ang panghalip sa sanlibutan; mas magaan ito kaysa “lahat ng bagay na nasa loob nito.”
- source_word: ὑπάρχων κύριος
  choice: siya ang Panginoon
  rationale: Ipinahahayag ang umiiral na kalagayan ng Diyos bilang Panginoon nang hindi ginagawang tahasang sanhi ang participle. Ang mga gitling ay nagpapanatili sa pariralang ito bilang paglalarawang nakapaloob sa pangunahing pangungusap.
- source_word: οὐρανοῦ καὶ γῆς
  choice: ng langit at lupa
  rationale: Natural at nakaugaliang pares sa Filipino, at malinaw na umaasa sa “Panginoon.”
- source_word: χειροποιήτοις
  choice: ginawa ng tao
  rationale: Ipinahahayag ang diwang “ginawa ng mga kamay,” ibig sabihin ay yari ng tao, sa natural na modernong Filipino. Inilalagay sa talababa ang mas literal na anyo.
- source_word: ναοῖς
  choice: mga templo
  rationale: Ang ναός ay banal na gusali o dambanang itinuturing na tirahan ng diyos; “mga templo” ang pinakamalinaw na pangkalahatang katumbas sa konteksto ng Atenas.
- source_word: κατοικεῖ
  choice: naninirahan
  rationale: Natural at dignified na katumbas ng “dwell/reside,” at pinananatili ang tuwirang pagtanggi sa paninirahan sa mga templong yari ng tao.
theological_decisions:
- issue: Ang pagiging higit ng Diyos sa sangnilikha laban sa paglilimita sa kaniya sa templo
  choice: Tuwirang sinasabing hindi naninirahan ang Maylalang at Panginoon ng langit at lupa sa mga templong ginawa ng tao.
  alternative: Maaaring ipakahulugang hindi makukulong o malilimitahan ang Diyos sa mga templo.
  rationale: Pinananatili ng salin ang tahasang pahayag ng Griyego at hindi ito pinalalawak tungo sa isang interpretatibong paraphrase tungkol sa pagkakakulong o paglilimita.
- issue: Gamit ng participle na ὑπάρχων
  choice: “siya ang Panginoon,” bilang nakapaloob na paglalarawan
  alternative: “dahil siya ang Panginoon,” bilang tahasang sanhi
  rationale: Maaaring magkaroon ng pansanhing pahiwatig ang participle sa konteksto, ngunit hindi ito tahasang minarkahan sa Griyego. Iniingatan ng salin ang hindi tiyak na ugnayan sa halip na pasiyahan itong causal.
translation_notes:
  register: Modernong Filipino na may dignified na biblikal na himig. Ginamit ang “sanlibutan” at “Panginoon,” ngunit iniwasan ang lipas o labis na pormal na balangkas. Ang em dash ay tumutulong na mapanatili ang participial na paglalarawan nang malinaw at natural.
