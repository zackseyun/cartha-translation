    issue: Hindi malinaw ang panghalip na saklaw sa “lahat ng naririto.”
    rationale: Ang πάντα τὰ ἐν αὐτῷ ay “lahat ng nasa loob/nasa saklaw nito,” na ang αὐτῷ ay tumutukoy sa κόσμον. Ang “naririto” ay maaaring unawain bilang “nasa lugar na ito,” at hindi nito malinaw na naiuugnay ang lahat ng bagay sa sanlibutan.
