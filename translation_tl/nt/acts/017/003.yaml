  to: Ipinaliwanag niya at inilahad ang mga patunay na kinailangang magdusa ang Mesiyas at mabuhay na muli mula sa mga patay,[a] at na ang Jesus na ito, na ipinahahayag ko sa inyo, ang Mesiyas.[b]
