  text: διανοίγων καὶ παρατιθέμενος ὅτι τὸν χριστὸν ἔδει παθεῖν καὶ ἀναστῆναι ἐκ νεκρῶν, καὶ ὅτι οὗτός ἐστιν ⸂ὁ χριστός, ὁ⸃ Ἰησοῦς ὃν ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/003.yaml
  text: explaining and demonstrating that the Messiah had to suffer and rise from the dead[a], and that this Jesus, whom I proclaim to you[b], is the Messiah.
translation:
  language: tl
  text: Ipinaliwanag niya at inilahad ang mga patunay na kinailangang magdusa ang Mesiyas at mabuhay na muli mula sa mga patay,[a] at na ang Jesus na ito, na ipinahahayag ko sa inyo, ang Mesiyas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “muling binuhay mula sa mga patay.” Aktibo ang anyo ng pandiwang Griyego rito, “mabuhay na muli,” bagaman sa ibang bahagi ng Bagong Tipan ay sinasabing muling binuhay ng Diyos si Jesus.
    reason: lexical_alternative
  - marker: b
    text: O “Cristo” sa dalawang paglitaw ng “Mesiyas.”
    reason: alternative_reading
lexical_decisions:
- source_word: διανοίγων
  choice: ipinaliliwanag
  rationale: Sa konteksto, binubuksan o nililinaw ni Pablo ang kahulugan ng Kasulatan; natural at malinaw sa makabagong Tagalog ang “ipinaliliwanag.”
- source_word: παρατιθέμενος
  choice: inilalahad ang katibayan
  rationale: Ipinahihiwatig ng pandiwa ang paglalagay sa harap ng mga nakikinig ng mga batayan o patunay. Iniiwasan nitong palabisín ang diwa bilang ganap na lohikal na pagpapatunay.
- source_word: τὸν χριστόν / ὁ χριστός
  choice: ang Mesiyas / ang siyang Mesiyas
  rationale: Titular ang Χριστός sa dalawang paglitaw at tumutukoy sa hinihintay na Pinahiran; pinananatili ng “Mesiyas” ang kontekstong Judio at maka-Kasulatan.
- source_word: ἔδει
  choice: kailangang
  rationale: Ipinahahayag nito ang kinakailangang pangyayari, na sa konteksto ay nakaugat sa Kasulatan at layunin ng Diyos.
- source_word: παθεῖν
  choice: magdusa
  rationale: Tuwirang katumbas ng infinitibong tumutukoy sa pagdurusa ng Mesiyas.
- source_word: ἀναστῆναι ἐκ νεκρῶν
  choice: muling mabuhay mula sa mga patay
  rationale: Aktibo ang anyong Griyego at pinananatili ng salin ang diwang “bumangon/muling mabuhay,” sa halip na tahimik na gawing balintiyak.
- source_word: καταγγέλλω ὑμῖν
  choice: ipinapahayag ko sa inyo
  rationale: Pinananatili nito ang diwa ng hayagang pagpapahayag nang hindi nililimitahan sa pormal na pangangaral.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός bilang titulo sa dalawang paglitaw
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang argumento ng talata ay na ang hinihintay na Pinahiran ay kailangang magdusa at muling mabuhay, at si Jesus ang Mesiyas na iyon. Nasa talababa ang tradisyonal na alternatibo.
- issue: Tinig ng ἀναστῆναι
  choice: muling mabuhay mula sa mga patay
  alternative: muling buhayin mula sa mga patay
  rationale: Aktibong infinitibo ang nasa Griyego. Hindi nito itinatanggi ang ibang pahayag ng Bagong Tipan na binuhay siyang muli ng Diyos; sinusunod lamang nito ang anyo ng pandiwa sa talatang ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “inilalahad ang katibayan” upang maipakita ang pagkakaiba ngunit ugnayan ng dalawang participle. Ang tuwirang pahayag sa hulihan ay nilagyan ng panipi para maging malinaw ang ipinahahayag ni Pablo.
