id: ACT.17.19
reference: Acts 17:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐπιλαβόμενοί ⸀τε αὐτοῦ ἐπὶ τὸν Ἄρειον Πάγον ἤγαγον, λέγοντες· Δυνάμεθα γνῶναι τίς ἡ καινὴ αὕτη ἡ ὑπὸ σοῦ λαλουμένη διδαχή;
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/019.yaml
  text: So they took hold of him and brought him to the Areopagus, saying, “May we know what this new teaching is that is being spoken by you?”
translation:
  language: tl
  text: Kaya hinawakan nila siya at dinala sa Areopago[a]. Sinabi nila, “Maaari ba naming malaman kung ano ang bagong turong ito na sinasabi mo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Areopago” ay maaaring tumukoy sa mismong burol o sa kapulungang kaugnay nito. Tinatawag din itong “Burol ni Ares” o, ayon sa tradisyong Latin, “Mars Hill.”
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιλαβόμενοί
  choice: hinawakan
  rationale: Ipinahahayag nito ang pisikal at matatag na pagkilos nang hindi ipinapalagay na ito ay marahas na pagdakip o simpleng magalang na paanyaya.
- source_word: τε
  choice: Kaya
  rationale: Banayad itong pang-ugnay na likas na nagdurugtong sa pangyayari sa naunang salaysay.
- source_word: ἐπὶ τὸν Ἄρειον Πάγον
  choice: sa Areopago
  rationale: Pinananatili ang pangalang Griyego sa anyong karaniwan at madaling bigkasin sa Filipino, nang hindi nilulutas kung ang tinutukoy ay ang burol, ang kapulungang kaugnay nito, o kapuwa.
- source_word: ἤγαγον
  choice: dinala
  rationale: Likas na katumbas ng ἄγω sa konteksto ng pagdadala sa isang destinasyon.
- source_word: λέγοντες
  choice: Sinabi nila
  rationale: Natural na Filipino para sa kasabay na kilos ng pagsasalita, at malinaw na ipinakikilalang sila ang nagsalita.
- source_word: Δυνάμεθα γνῶναι
  choice: Maaari ba naming malaman
  rationale: Ipinahahayag ang magalang na kahilingan, hindi lamang ang kakayahang malaman.
- source_word: καινὴ
  choice: bagong
  rationale: Direkta at malawak na katumbas ng καινός bilang bago o hindi pa pamilyar sa mga nakikinig.
- source_word: ὑπὸ σοῦ λαλουμένη
  choice: na sinasabi mo
  rationale: Natural at tumpak na Filipino para sa pasibong konstruksiyong Griyego; iniiwasan ang alanganing literal na 'na sinasalita mo' habang nananatili ang diwang ang turo ang ipinapahayag niya.
- source_word: διδαχή
  choice: turo
  rationale: Malinaw at pangkaraniwang modernong Filipino, at hindi kasing teknikal o eklesyastikal ng 'doktrina.'
theological_decisions:
- issue: Antas ng pamimilit sa pagdadala kay Pablo
  choice: Matatag na pisikal na pag-akay, ngunit hindi tahasang pagdakip
  alternative: Dinakip siya; o magalang lamang siyang inanyayahan
  rationale: Maaaring magpahiwatig ng paghawak o pagsunggab ang ἐπιλαμβάνομαι, ngunit hindi tahasang inilalarawan ng konteksto ang isang pag-aresto. Pinananatili ng 'hinawakan' ang tensiyon.
- issue: Kahulugan ng Ἄρειος Πάγος
  choice: Areopago bilang pangalang hindi nililinaw kung lugar o kapulungan
  alternative: Burol ni Ares/Mars Hill; o ang konseho ng Areopago
  rationale: Maaaring tumukoy ang parirala sa burol o sa kapulungang kaugnay nito. Hindi pinipili ng salin ang isa lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Maaari ba naming malaman” upang mapanatili ang magalang na tono, at “na sinasabi mo” bilang natural na Filipino kaysa sa pilit na pasibong hulma.
