  text: τινὲς δὲ ἄνδρες κολληθέντες αὐτῷ ἐπίστευσαν, ἐν οἷς καὶ Διονύσιος ὁ Ἀρεοπαγίτης καὶ γυνὴ ὀνόματι Δάμαρις καὶ ἕτεροι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/034.yaml
  text: But some men joined him and believed[a], among whom were also Dionysius the Areopagite, and a woman named Damaris[b], and others with them.
translation:
  language: tl
  text: Ngunit may ilang lalaking kumapit kay Pablo[a] at sumampalataya. Kabilang sa kanila si Dionisio na Areopagita[b], isang babaeng nagngangalang Damaris, at iba pang mga kasama nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakipag-ugnay nang malapit sa kanya” o “dumikit sa kanya”; ipinahihiwatig ng Griyego ang malapit na personal na pakikiugnay kay Pablo.
    reason: lexical_alternative
  - marker: b
    text: Ang “Areopagita” ay maaaring mangahulugang kasapi ng Areopago o isang taong may kaugnayan sa kapulungang iyon.
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ ἄνδρες
  choice: Ngunit may ilang lalaking
  rationale: Ipinahahayag ng “ngunit” ang banayad na pagsalungat sa naunang mga tugon; pinananatili ng “mga lalaking” ang tahasang panlalaking anyo ng ἄνδρες.
- source_word: κολληθέντες αὐτῷ
  choice: sumama kay Pablo
  rationale: Ipinahihiwatig ng κολλάομαι ang malapit na pakikiugnay o pagpanig sa isang tao. Nilinaw ang tinutukoy ng panghalip bilang si Pablo upang maging natural sa Tagalog, habang inilalagay sa talababa ang mas matinding leksikal na diwa.
- source_word: ἐπίστευσαν
  choice: sumampalataya
  rationale: Direktang inilalarawan ang pagtugon nila sa ipinahayag na mensahe nang hindi nagdaragdag ng tahasang layon na wala sa Griyego.
- source_word: ἐν οἷς καὶ
  choice: Kabilang sa kanila
  rationale: Natural na Tagalog para sa pagbanggit ng mga partikular na tao mula sa pangkat na sumampalataya.
- source_word: Διονύσιος ὁ Ἀρεοπαγίτης
  choice: Dionisio na Areopagita
  rationale: Ginagamit ang karaniwang anyong Filipino ng pangalan at pinananatili ang katawagang may kaugnayan sa Areopago, sapagkat hindi lubos na tiyak kung ito ay opisyal na kasapi o mas malawak na kaugnayan.
- source_word: γυνὴ ὀνόματι Δάμαρις
  choice: isang babaeng nagngangalang Damaris
  rationale: Tuwiran, malinaw, at likas na salin na pinananatili ang kasarian at pangalan.
- source_word: ἕτεροι σὺν αὐτοῖς
  choice: iba pang kasama nila
  rationale: Likas na ipinahahayag ang pagkakaroon ng karagdagang mga taong kasama ng dalawang pinangalanan.
theological_decisions:
- issue: Kahulugan ng πιστεύω sa konteksto
  choice: sumampalataya
  alternative: naniwala
  rationale: Ang “sumampalataya” ay angkop sa pagtugon sa pangangaral ni Pablo, ngunit hindi nito tinutukoy nang higit sa teksto ang isang tahasang layon o mas detalyadong pormulang doktrinal.
- issue: Lakas ng κολληθέντες αὐτῷ
  choice: sumama kay Pablo
  alternative: dumikit kay Pablo / nakipag-ugnay nang malapit sa kanya
  rationale: Ang pangunahing teksto ay ginawang natural sa modernong Tagalog, habang pinananatili sa talababa ang posibilidad ng mas malapit at matibay na personal na pakikiugnay.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Dionisio” at “Areopagita” bilang mga anyong madaling basahin sa Filipino; iniwasan ang sobrang pormal o makalumang ayos.
