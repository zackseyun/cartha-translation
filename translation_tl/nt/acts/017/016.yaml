base_translation:
  language: en
  yaml_path: translation/nt/acts/017/016.yaml
  text: While Paul was waiting for them in Athens[b][a], his spirit was provoked within him as he saw that the city was full of idols.
translation:
  language: tl
  text: Habang hinihintay ni Pablo ang mga kasama niya sa Atenas, labis na nabagabag ang kanyang espiritu sa loob niya[a] nang makita niyang punô ng mga diyos-diyosan ang lungsod[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “napukaw” o “naligalig”; ang pandiwang Griyego ay nagpapahiwatig ng matalas na panloob na pagkilos o pagkabalisa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lubos na lipos ng mga diyos-diyosan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδεχομένου
  choice: habang hinihintay
  rationale: Ipinahahayag ng pangkasalukuyang pandiwaring Griyego ang nagpapatuloy na paghihintay ni Pablo; natural sa modernong Tagalog ang “habang hinihintay.”
- source_word: παρωξύνετο
  choice: labis na nabagabag
  rationale: Ipinahahayag ng pandiwa ang matindi at nagpapatuloy na panloob na pagkilos o pagkabalisa. Malinaw at natural ang “labis na nabagabag,” habang inilalahad sa talababa ang mas matalas na mga posibleng diwa.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: ang kanyang espiritu
  rationale: Tuwirang pinananatili nito ang pagtukoy sa sariling espiritu ni Pablo at hindi nito ipinapalit ang mas interpretatibong “kalooban.”
- source_word: ἐν αὐτῷ
  choice: sa loob niya
  rationale: Pinananatili nito ang tahasang diin ng Griyego sa panloob na kinaroroonan ng pagkabagabag.
- source_word: θεωροῦντος
  choice: nang makita niyang
  rationale: Natural nitong ipinapahayag ang kasabay na masusing pagkakita o pagmamasid ni Pablo.
- source_word: κατείδωλον
  choice: punô ng mga diyos-diyosan
  rationale: Malinaw at tuwirang ipinahahayag nito na laganap sa lungsod ang mga imahen o bagay na sinasamba; hindi nito ipinapalagay ang mas interpretatibong diwang “lubos na alipin ng idolatriya.”
- source_word: πόλιν
  choice: ang lungsod
  rationale: Pinananatili ang tahasang “lungsod” sa Griyego, na malinaw na tumutukoy sa Atenas.
- source_word: δὲ
  choice: hindi isinalin bilang hiwalay na salita
  rationale: Dito ay banayad na panandang pasalaysay ang δέ. Sapat nang ipinahihiwatig ng sugnay na “Habang…” ang paglipat ng tagpo, kaya hindi kailangan ang dagdag na “Ngayon” o “Ngunit.”
theological_decisions:
- issue: Ang tinutukoy ng “espiritu”
  choice: Sariling espiritu ni Pablo
  alternative: Pagkilos o pag-uudyok ng Espiritu Santo
  rationale: Ang pariralang “kanyang espiritu” at ang kasunod na “sa loob niya” ay tumutukoy sa panloob na tugon ni Pablo. Hindi tahasang sinasabi ng talata na ang Espiritu Santo ang tinutukoy, kaya hindi iyon idinagdag sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang “espiritu” upang manatiling malapit sa πνεῦμα, at ginamit ang “punô” na may tuldik upang hindi mapagkamalang pangngalang “puno.”
