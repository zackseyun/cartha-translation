id: ACT.17.5
reference: Acts 17:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂ζηλώσαντες δὲ οἱ Ἰουδαῖοι καὶ προσλαβόμενοι⸃ τῶν ἀγοραίων ⸂ἄνδρας τινὰς⸃ πονηροὺς καὶ ὀχλοποιήσαντες ἐθορύβουν τὴν πόλιν, ⸂καὶ ἐπιστάντες⸃ τῇ οἰκίᾳ Ἰάσονος ἐζήτουν αὐτοὺς ⸀προαγαγεῖν εἰς τὸν δῆμον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/005.yaml
  text: But the Jews[a], becoming jealous and taking along some wicked men from the marketplace, formed a mob and were throwing the city into an uproar; and coming to Jason’s house, they were seeking to bring them out to the assembly.
translation:
  language: tl
  text: Ngunit dahil sa inggit, nagsama ang mga Judio[a] ng ilang masasamang lalaki mula sa pamilihan. Nagtitipon sila ng isang pulutong at naghasik ng kaguluhan sa lungsod. Pagdating nila sa bahay ni Jason, hinahanap nila ang mga ito upang ilabas at iharap sa kapulungang-bayan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa konteksto, isang partikular na pangkat ng mga Judio sa Tesalonica ang tinutukoy, hindi ang lahat ng Judio.
    reason: Nililinaw ang saklaw ng reperensiya sa salaysay nang hindi pinapalitan ang katawagang ginamit sa Griyego.
  - marker: b
    text: O “sa harap ng taong-bayan” o “sa pampublikong kapulungan.” Ang Griyegong δῆμος ay tumutukoy sa sibikong katawang nagtitipon sa publiko, hindi lamang sa isang di-tiyak na pulutong.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλώσαντες
  choice: nainggit
  rationale: Ipinapahayag nito ang motibong nauna sa mga sumunod na kilos at natural itong katumbas ng inggit sa kontekstong ito.
- source_word: οἱ Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Tuwirang pinananatili ang katawagang nasa Griyego; ipinapakita ng konteksto na isang partikular na pangkat sa Tesalonica ang tinutukoy, hindi ang lahat ng Judio.
- source_word: προσλαβόμενοι
  choice: nagsama sila
  rationale: Ipinahihiwatig ng middle participle na kumuha sila ng ibang mga tao upang mapabilang sa kanilang pangkat, nang hindi ipinapalagay na pormal na inupahan ang mga ito.
- source_word: τῶν ἀγοραίων
  choice: mula sa pamilihan
  rationale: Pinananatili ang kaugnayan sa agora o pampublikong pamilihan nang hindi idinaragdag ang interpretibong bansag na mga tambay.
- source_word: ἄνδρας τινὰς πονηρούς
  choice: ilang masasamang lalaki
  rationale: Pinananatili kapwa ang tahasang pagtukoy sa mga lalaki at ang negatibong moral na paglalarawan ng πονηρούς.
- source_word: ὀχλοποιήσαντες
  choice: bumuo ng isang marahas na pangkat
  rationale: Ipinapakita ang pagbuo ng isang hostile mob sa natural na Filipino; ang marahas na pangkat ay mas tiyak kaysa neutral na karamihan.
- source_word: ἐθορύβουν τὴν πόλιν
  choice: ginulo ang buong lungsod
  rationale: Natural at malinaw na inilalarawan ang malawakang kaguluhang idinulot nila; ang patuloy na kilos ng imperfect ay nauunawaan sa daloy ng salaysay.
- source_word: ἐπιστάντες τῇ οἰκίᾳ Ἰάσονος
  choice: pagdating nila sa bahay ni Jason
  rationale: Ang ἐφίστημι rito ay ang paglapit o pagdating sa bahay; iniiwasan ang mas matinding interpretasyong sinalakay na hindi tahasang hinihingi ng salita.
- source_word: ἐζήτουν
  choice: hinanap nila
  rationale: Sa konteksto ng pagpunta sa bahay, natural itong nagpapahiwatig ng patuloy na paghahanap o pagtatangkang matagpuan sila.
- source_word: αὐτούς
  choice: ang mga iyon
  rationale: Pinananatili ang panghalip ng Griyego at hindi tahasang pinapalitan ng mga pangalang ipinahihiwatig lamang ng konteksto.
- source_word: προαγαγεῖν
  choice: upang iharap
  rationale: Naihahatid nito ang diwang ilabas o dalhin pasulong ang mga hinahanap upang humarap sa pampublikong katawan.
- source_word: εἰς τὸν δῆμον
  choice: sa kapulungang-bayan
  rationale: Ipinapakita ang institusyonal at sibikong kahulugan ng δῆμος, hindi lamang isang di-tiyak na pulutong.
theological_decisions:
- issue: Pagkasalin sa οἱ Ἰουδαῖοι sa isang salaysay ng tunggalian
  choice: ang mga Judio
  alternative: ang mga pinunong Judio; ang mga Judeano
  rationale: Sinusunod ang tahasang pananalita ng Griyego nang hindi ito pinakikitid sa mga pinuno. Nililinaw ng talababa na ang reperensiya sa konteksto ay isang partikular na pangkat, upang hindi ito gawing pangkalahatang paratang laban sa lahat ng Judio.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kapulungang-bayan” upang ipakita na ang δῆμος ay ang sibikong katawang nagtitipon sa publiko, hindi basta isang pulutong.
