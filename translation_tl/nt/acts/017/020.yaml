  text: For you are bringing some strange things to our ears[b][a]. Therefore we want to know what these things mean.
translation:
  language: tl
  text: Sapagkat may ilang kakaibang bagay kang ipinaparinig sa amin.[a] Kaya nais naming malaman kung ano ang ibig sabihin ng mga ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “banyaga” o “hindi pamilyar.” Ang salitang Griyego ay maaaring tumukoy sa isang bagay na kakaiba dahil bago o banyaga ito sa nakikinig.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “kung ano ang nais na maging ng mga ito,” isang idyomang nangangahulugang “kung ano ang ibig sabihin ng mga ito” o “kung ano ang kabuluhan ng mga ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενίζοντα
  choice: kakaiba
  rationale: Inilalarawan nito ang mga bagay na bago, banyaga, o hindi pamilyar sa mga nakikinig. Natural sa modernong Tagalog ang “kakaiba” at hindi nito pinalalabis ang diwa bilang “kahanga-hanga” o “nakagugulat.”
- source_word: τινα
  choice: may mga bagay
  rationale: Pinananatili nito ang di-tiyak na pagtukoy sa ilang bahagi ng mensaheng narinig nila.
- source_word: εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν
  choice: ipinaparinig sa amin
  rationale: Natural na katumbas ito sa Tagalog ng literal na larawan na “dinadala sa aming mga pandinig,” habang malinaw na tumutukoy sa pagpaparinig o pagpapakilala ng mensahe.
- source_word: βουλόμεθα οὖν γνῶναι
  choice: Kaya nais naming malaman
  rationale: Ipinapahayag ng “nais” ang kusang hangarin, at ng “kaya” ang konklusyong ipinahihiwatig ng οὖν.
- source_word: τίνα θέλει ταῦτα εἶναι
  choice: kung ano ang ibig sabihin ng mga ito
  rationale: Idyomatiko ang Griyegong parirala at nagtatanong tungkol sa kahulugan o kabuluhan ng mga bagay na sinabi, hindi lamang sa kung ano ang mga iyon.
- source_word: γάρ
  choice: Sapagkat
  rationale: Pinananatili nito ang paliwanag na kaugnayan ng talata sa naunang pahayag.
