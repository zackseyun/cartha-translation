  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς δὲ ἔγνωσαν οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι ὅτι καὶ ἐν τῇ Βεροίᾳ κατηγγέλη ὑπὸ τοῦ Παύλου ὁ λόγος τοῦ θεοῦ, ἦλθον κἀκεῖ σαλεύοντες ⸂καὶ ταράσσοντες⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/013.yaml
  text: But when the Jews from Thessalonica learned that the word of God had been proclaimed by Paul in Berea also[a], they came there too[b], stirring up and troubling the crowds.
translation:
  language: tl
  text: Ngunit nang malaman ng mga Judiong mula sa Tesalonica na ipinahayag din ni Pablo sa Berea ang salita ng Diyos, pumunta rin sila roon at inuudyok at ginugulo ang mga pulutong.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: Ngunit nang
  rationale: Pinananatili ang banayad na pagsalungat sa naunang mabuting pagtanggap sa Berea at ang temporal na ugnayan ng pangyayari.
- source_word: ἔγνωσαν
  choice: malaman
  rationale: Ipinahihiwatig ng aorist ng γινώσκω rito ang pagkatuklas o pagkatanggap nila ng impormasyon.
- source_word: οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι
  choice: ang mga Judiong mula sa Tesalonica
  rationale: Malinaw na tinutukoy ang partikular na pangkat ayon sa pinagmulan, hindi ang lahat ng Judio.
- source_word: ὅτι καὶ ἐν τῇ Βεροίᾳ
  choice: na ... din ... sa Berea
  rationale: Ang καί ay tumutukoy sa Berea bilang karagdagang lugar na pinangaralan, gaya ng Tesalonica.
- source_word: κατηγγέλη
  choice: ipinahayag
  rationale: Ang aorist passive ng καταγγέλλω ay tumutukoy sa hayagang pagpapahayag; sa natural na Tagalog, sapat ang aspektong perpektibo nang hindi kailangang piliting ipahayag ang English pluperfect.
- source_word: ὑπὸ τοῦ Παύλου
  choice: ni Pablo
  rationale: Tuwirang ipinapakita ang personal na tagaganap ng pandiwang passive.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Pinananatili ang pamilyar at teolohikal na makahulugang parirala nang hindi nililimitahan ang λόγος sa isang mas makitid na kahulugan.
- source_word: ἦλθον κἀκεῖ
  choice: pumunta rin sila roon
  rationale: Natural na ipinapahayag ang κἀκεῖ bilang pagdating nila sa karagdagang lugar ding iyon.
- source_word: σαλεύοντες
  choice: sinulsulan
  rationale: Sa konteksto ng mga tao, tumutukoy ito sa pag-uudyok o pagpapakilos tungo sa kaguluhan, hindi sa literal na pagyanig.
- source_word: καὶ ταράσσοντες
  choice: at ginulo
  rationale: Pinananatili ang ikalawang kilos na nagpapalakas sa larawan ng pampublikong ligalig at pagkalito.
- source_word: τοὺς ὄχλους
  choice: ang mga tao
  rationale: Natural sa modernong Tagalog para sa mga nagkakatipong pangkat; iniiwasan ng salin ang mas mapanuring “mga mandurumog,” na lampas sa kahulugan ng ὄχλοι.
theological_decisions:
- issue: Paglilipat ng ὁ λόγος τοῦ θεοῦ
  choice: ang salita ng Diyos
  alternative: ang mensahe ng Diyos
  rationale: Pinananatili ang teolohikal na resonansiya at tunay na lawak ng parirala bilang banal na mensaheng ipinahahayag, nang hindi ito binibigyan ng mas makitid o mas huling teknikal na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Judiong mula sa Tesalonica” upang limitahan nang wasto ang tinutukoy na pangkat. Ang magkatambal na “sinulsulan at ginulo” ay nagpapanatili sa dalawang magkakaugnay ngunit hindi ganap na magkaparehong participle.
