  text: All the Athenians and the foreigners staying there would spend their time in nothing else than telling or hearing something newer[a].
translation:
  language: tl
  text: Walang ibang pinagkakaabalahan ang lahat ng taga-Atenas at ang mga dayuhang nananatili roon kundi ang magsabi ng isang bagay na mas bago o makinig sa gayon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas likas na pananalita, “isang bagong bagay.” Pahambing ang salitang Griyego—“mas bago”—na malamang ay nagpapahiwatig ng patuloy na pagkahilig sa pinakabagong bagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀθηναῖοι δὲ πάντες
  choice: ang lahat ng taga-Atenas
  rationale: Likas sa modernong Tagalog ang “mga taga-Atenas” bilang tawag sa mga Ateniense. Hindi hiwalay na isinalin ang banayad na pang-ugnay na δὲ sapagkat paliwanag na pahapyaw ang tungkulin nito at hindi kailangan ng tahasang panandang temporal.
- source_word: οἱ ἐπιδημοῦντες ξένοι
  choice: ang mga dayuhang naninirahan doon
  rationale: Ipinahihiwatig ng ἐπιδημοῦντες na ang mga dayuhan ay kasalukuyang nananatili o nakatira sa lugar; hindi nito kinakailangang sabihing permanente ang paninirahan.
- source_word: εἰς οὐδὲν ἕτερον ηὐκαίρουν
  choice: Walang ibang pinagkakaabalahan ... kundi
  rationale: Natural na idyomang Tagalog ito para sa paggugol o pag-uukol nila ng panahon sa wala nang iba. Naipahihiwatig ng anyong imperfect ng ηὐκαίρουν ang nakagawiang gawain.
- source_word: λέγειν τι ἢ ἀκούειν
  choice: ang magsabi o makinig ng isang bagay
  rationale: 'Pinananatili ang magkatimbang na dalawang infinitive: pagpapahayag at pakikinig. Ginamit ang “magsabi” sa halip na mas malawak na “magsalita” dahil kapuwa tumutukoy ang mga pandiwa sa bagay na bago.'
- source_word: τι καινότερον
  choice: isang bagay na mas bago
  rationale: Pinananatili ang anyong pahambing ng καινότερον, hindi lamang ang payak na “bago,” upang maipakita ang paghahangad sa anumang mas bago o pinakabagong balita o ideya.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “taga-Atenas” at ang idyomang “walang ibang pinagkakaabalahan ... kundi” upang maging natural habang pinananatili sa teksto ang mahalagang pahambing na “mas bago.”
