    issue: Di-karaniwang layon ng “makinig”
    rationale: Sa modernong Filipino, ang pandiwa ay karaniwang “makinig sa,” hindi “makinig ng.” Ang dating anyo ay nakababawas sa likas na daloy ng pangungusap.
  - severity: low
    issue: “Naninirahan” ay masyadong maaaring magpahiwatig ng permanente
    rationale: Ang ἐπιδημοῦντες ay tumutukoy sa mga dayuhang kasalukuyang nasa lungsod o nananatili roon; hindi kinakailangang permanenteng residente.
