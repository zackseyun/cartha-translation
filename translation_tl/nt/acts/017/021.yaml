  to: Walang ibang pinagkakaabalahan ang lahat ng taga-Atenas at ang mga dayuhang nananatili roon kundi ang magsabi ng isang bagay na mas bago o makinig sa gayon.[a]
  rationale: Inayos ang gamit ng “makinig” upang maging likas sa modernong Filipino at ginawang “nananatili roon” ang paglalarawan sa mga dayuhan upang hindi magpahiwatig ng permanenteng paninirahan. Napanatili ang habitual na diwa, ang saklaw ng lahat ng pangkat, at ang pahambing na “mas bago.”
