revisions:
- from: Sapagkat nagtakda siya ng isang araw kung kailan hahatulan niya nang matuwid[a] ang buong daigdig sa pamamagitan ng isang lalaking itinalaga niya. Pinatunayan niya ito sa lahat[b] sa pamamagitan ng muling pagbuhay sa lalaking iyon mula sa mga patay.
  to: Sapagkat nagtakda siya ng isang araw kung kailan hahatulan niya nang may katuwiran[a] ang buong daigdig sa pamamagitan ng isang lalaking itinalaga niya. Nagbigay siya ng katibayan sa lahat[b] sa pamamagitan ng pagbuhay sa kanya mula sa mga patay.
  rationale: Pinalitan ang malabong “Pinatunayan niya ito sa lahat” ng “Nagbigay siya ng katibayan sa lahat,” na mas tuwirang tumutugma sa πίστιν παρασχὼν πᾶσιν at malinaw na inuugnay ang katibayan sa pagbuhay sa itinalagang lalaki. Inayos rin ang huling panghalip upang mas malapit sa αὐτόν. Napanatili ang dalawang talababa at ang kanilang mga angkla.
