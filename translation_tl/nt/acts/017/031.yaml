id: ACT.17.31
reference: Acts 17:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀καθότι ἔστησεν ἡμέραν ἐν ᾗ μέλλει κρίνειν τὴν οἰκουμένην ἐν δικαιοσύνῃ ἐν ἀνδρὶ ᾧ ὥρισεν, πίστιν παρασχὼν πᾶσιν ἀναστήσας αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/031.yaml
  text: because he has fixed a day on which he is going to judge the inhabited world in righteousness by a man whom he appointed[b][a], having given proof to all by raising him from the dead.
translation:
  language: tl
  text: Sapagkat nagtakda siya ng isang araw kung kailan hahatulan niya nang may katuwiran[a] ang buong daigdig sa pamamagitan ng isang lalaking itinalaga niya. Nagbigay siya ng katibayan sa lahat[b] sa pamamagitan ng pagbuhay sa kanya mula sa mga patay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang may katarungan” (δικαιοσύνῃ).
    reason: lexical_alternative
  - marker: b
    text: O “nagbigay siya ng katiyakan sa lahat”; mas literal, “nagbigay siya ng pananampalataya sa lahat” (πίστιν παρασχὼν πᾶσιν). Sa kontekstong ito, ang diwa ay pampublikong katibayan o katiyakan.
    reason: alternative_reading
lexical_decisions:
- source_word: καθότι
  choice: Sapagkat
  rationale: Likas na panandang sanhi sa makabagong Tagalog at malinaw na iniuugnay ang pahayag sa naunang panawagan na magsisi.
- source_word: ἔστησεν ἡμέραν
  choice: nagtakda siya ng isang araw
  rationale: Ipinahahayag ang isang tiyak at itinalagang panahon, habang nananatiling natural sa Tagalog.
- source_word: ἐν ᾗ μέλλει κρίνειν
  choice: kung kailan hahatulan niya
  rationale: Ang μέλλει ay nagpapahiwatig ng nakatakdang kilos sa hinaharap; naihahatid ito ng hulmahang Tagalog nang hindi nagiging mabigat.
- source_word: τὴν οἰκουμένην
  choice: ang buong daigdig
  rationale: Ipinahahayag ang saklaw na pandaigdig ng οἰκουμένη, ang daigdig na tinitirhan ng mga tao, sa karaniwang wikang Tagalog.
- source_word: ἐν δικαιοσύνῃ
  choice: nang matuwid
  rationale: Natural na pang-abay sa Tagalog na nagpapanatili sa diwa ng δικαιοσύνη bilang katuwiran sa paraan ng paghatol.
- source_word: ἐν ἀνδρὶ ᾧ ὥρισεν
  choice: sa pamamagitan ng isang lalaking itinalaga niya
  rationale: Pinananatili ang tiyak na panlalaking kahulugan ng ἀνήρ at ang walang-artikulong anyo, samantalang malinaw na ipinakikita ang instrumental na gamit ng ἐν.
- source_word: πίστιν παρασχὼν πᾶσιν
  choice: Pinatunayan niya ito sa lahat
  rationale: Sa idyomang ito, ang πίστις kasama ng παρέχω ay tumutukoy sa ibinigay na katiyakan o patunay, hindi pangunahing sa pansariling pananampalataya.
- source_word: ἀναστήσας αὐτὸν ἐκ νεκρῶν
  choice: sa pamamagitan ng muling pagbuhay sa lalaking iyon mula sa mga patay
  rationale: Nililinaw na ang muling pagkabuhay ang paraan ng pagbibigay ng patunay; ang 'lalaking iyon' ay likas na tumutukoy pabalik sa itinalagang lalaki.
theological_decisions:
- issue: Kahulugan ng δικαιοσύνη sa konteksto ng paghatol
  choice: nang matuwid
  alternative: nang may katarungan
  rationale: Ang pangunahing salin ay nagpapanatili sa kaugnayan sa 'katuwiran,' ngunit ang 'katarungan' ay tunay ding posibleng diin sa kontekstong hudisyal at kaya inilagay sa talababa.
- issue: Kahulugan ng πίστις sa πίστιν παρασχὼν πᾶσιν
  choice: Pinatunayan niya ito sa lahat
  alternative: Binigyan niya ng katiyakan ang lahat; mas literal, binigyan niya ng pananampalataya ang lahat
  rationale: Ang idyoma ay tumutukoy sa pampublikong pagpapatunay o katiyakan sa pamamagitan ng muling pagkabuhay. Itinatala ng talababa ang mas literal na anyo upang hindi maitago ang leksikal na tensiyon.
- issue: Paglalarawan sa ἀνδρί
  choice: isang lalaki
  alternative: ang lalaking
  rationale: Tiyak na panlalaki ang ἀνήρ at walang artikulo ang parirala. Hindi pinangalanan sa talata ang lalaki, kaya hindi tahasang idinagdag ang pangalang Jesus.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Hinati sa dalawang pangungusap ang mahabang pangungusap na Griyego upang maging madaling maunawaan, nang hindi binabago ang lohikal na ugnayan. Ginamit ang 'buong daigdig' sa halip na literal ngunit di-likas na 'tinitirhang daigdig.'
