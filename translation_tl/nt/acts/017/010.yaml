  yaml_path: translation/nt/acts/017/010.yaml
  text: Then the brothers immediately sent both Paul and Silas away by night to Berea[a], and when they arrived[c][b], they went into the synagogue of the Jews.
translation:
  language: tl
  text: Agad namang ipinadala ng mga kapatid[a] sina Pablo at Silas sa gabi[b] patungong Berea. Pagdating nila roon, nagtungo sila sa sinagoga ng mga Judio.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego ay nasa anyong panlalaki, ngunit maaari itong tumukoy sa mas malawak na komunidad ng mga mananampalataya, kasama ang mga babae.
    reason: lexical_alternative
  - marker: b
