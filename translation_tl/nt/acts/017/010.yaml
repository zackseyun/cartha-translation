lexical_decisions:
- source_word: ἀδελφοὶ
  choice: mga kapatid
  rationale: Likas sa modernong Tagalog ang “mga kapatid” bilang tawag sa kapuwa mananampalataya at maaari itong tumukoy sa buong komunidad, habang pinananatili ang pampamilyang larawan ng salitang Griego.
- source_word: εὐθέως
  choice: agad
  rationale: Malinaw at natural na ipinahahayag ng “agad” ang mabilis at hindi ipinagpalibang pagkilos.
- source_word: διὰ νυκτός
  choice: nang gabi
  rationale: Ipinahahayag nito ang pagkilos sa oras ng gabi nang hindi dinaragdagan ang teksto ng palagay na iyon ay buong magdamag o isang tiyak na bahagi ng gabi.
- source_word: ἐξέπεμψαν
  choice: pinaalis
  rationale: Ang tambalang pandiwa ay may diwang pagpapalabas o pagpapalayo. Ang “pinaalis” ay angkop sa agarang paglisan nina Pablo at Silas, bagaman hindi nito tahasang ipinapaliwanag ang dahilan.
- source_word: τόν τε Παῦλον καὶ τὸν Σιλᾶν
  choice: sina Pablo at Silas
  rationale: Ang pantukoy na “sina” ay natural na tumutukoy sa parehong taong pinangalanan; hindi na kailangan ang mabigat na “kapwa sina” upang katawanin ang τε … καί.
- source_word: Βέροιαν
  choice: Berea
  rationale: Ginamit ang karaniwang anyo ng pangalan ng lugar sa mga saling Tagalog.
- source_word: οἵτινες παραγενόμενοι
  choice: Pagdating nila roon
  rationale: Ginawang likas na sugnay na temporal ang participle at malinaw na ang tinutukoy ay sina Pablo at Silas; ang “roon” ay tumutukoy sa Berea.
- source_word: συναγωγὴν τῶν Ἰουδαίων
  choice: sinagoga ng mga Judio
  rationale: Pinananatili ang ugnayang genitibo ng Griego. Tinutukoy nito ang sinagoga ng lokal na pamayanang Judio at hindi ito mapanirang paglalarawan.
- source_word: ἀπῄεσαν
  choice: nagtungo sila
  rationale: Natural na isinasalin nito ang pagpunta sa tinukoy na destinasyon at hindi pinapalakas ang pandiwa na para bang ang diin ay sa mismong pagpasok.
theological_decisions:
- issue: Saklaw ng ἀδελφοὶ sa komunidad ng mga mananampalataya
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae; mga mananampalataya
  rationale: Ang “mga kapatid” ay tapat sa larawang pampamilya at likas na maaaring maging inklusibo sa Tagalog. Hindi kailangang tahasang idagdag ang “na lalaki at babae,” ngunit nililinaw sa talababa ang anyong panlalaki ng salitang Griego at ang posibleng mas malawak na saklaw nito.
- issue: Paglalarawan sa συναγωγὴν τῶν Ἰουδαίων
  choice: sinagoga ng mga Judio
  alternative: sinagogang Judio
  rationale: Mas tuwirang pinananatili ng pangunahing salin ang pagkakabuo ng pariralang Griego. Ito ay pagkakakilanlan ng lokal na sinagoga, hindi isang teolohikal o mapanirang paghatol.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “nagtungo” bilang bahagyang pormal ngunit karaniwang salitang angkop sa salaysay. Inilagay ang lahat ng marker sa mismong bahaging nililinaw ng kaukulang talababa.
