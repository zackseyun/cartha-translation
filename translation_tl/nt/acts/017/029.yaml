id: ACT.17.29
reference: Acts 17:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: γένος οὖν ὑπάρχοντες τοῦ θεοῦ οὐκ ὀφείλομεν νομίζειν χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ, χαράγματι τέχνης καὶ ἐνθυμήσεως ἀνθρώπου, τὸ θεῖον εἶναι ὅμοιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/029.yaml
  text: Therefore[a], since we are God’s offspring, we ought not to think that the Divine Being is like gold or silver or stone[b], an image formed by human skill and imagination.
translation:
  language: tl
  text: Kaya, yamang tayo ay mga supling ng Diyos, hindi natin dapat isipin na ang pagka-Diyos[a] ay tulad ng ginto, pilak, bato, o isang imaheng inukit[b] ayon sa husay at kaisipan ng tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang Diyos” o “ang kalikasang maka-Diyos.” Malawak ang kahulugan ng Griyegong τὸ θεῖον para sa kung ano ang maka-Diyos; sa pangangatwiran ni Pablo rito, tumutukoy ito sa tunay na Diyos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isang nililok na imahen” o “isang bagay na inukit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γένος
  choice: lahi
  rationale: Sa konteksto, ipinahihiwatig nito ang pinagmulan at pagkakamag-anak sa Diyos. Ang “lahi” ay maikli at natural sa modernong Tagalog, bagaman hindi ito tumutukoy rito sa etnisidad.
- source_word: οὖν
  choice: Kaya
  rationale: Malinaw nitong ipinahahayag ang kongklusyon mula sa naunang pangangatwiran ni Pablo.
- source_word: ὑπάρχοντες
  choice: yamang tayo ay
  rationale: 'Ipinapakita ang malamang na sanhi o batayan ng kongklusyon: dahil tayo ay lahi ng Diyos.'
- source_word: οὐκ ὀφείλομεν νομίζειν
  choice: hindi natin dapat isipin
  rationale: Likas na Tagalog na nagpapahayag ng nararapat na paghatol, hindi lamang ng posibilidad.
- source_word: χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ
  choice: ginto, pilak, o bato
  rationale: Pinananatili ang tatlong materyales at ang tuwirang paghahambing ng Griyego.
- source_word: χαράγματι
  choice: isang larawang inukit
  rationale: Tumutukoy sa isang bagay o imaheng nililok o inuukit; malinaw ito sa konteksto ng mga diyus-diyosan.
- source_word: τέχνης καὶ ἐνθυμήσεως ἀνθρώπου
  choice: ayon sa husay at kaisipan ng tao
  rationale: Pinananatili ang dalawang sangkap—kasanayang pansining at disenyong nabuo sa isip—nang hindi pinagsasama ang mga ito.
- source_word: τὸ θεῖον
  choice: ang pagka-Diyos
  rationale: Pinananatili ang malawak at bahagyang abstraktong diwa ng substantibong Griyego, habang sa konteksto ay tumutukoy ito sa tunay na Diyos.
theological_decisions:
- issue: Ang diwa ng τὸ θεῖον sa isang monoteistikong pahayag na gumagamit ng pilosopikal na pananalita
  choice: ang pagka-Diyos
  alternative: ang Diyos; ang banal na kalikasan; ang Banal na Nilalang
  rationale: Ang “pagka-Diyos” ay nagpapanatili sa malawak na pormulasyon ng Griyego at hindi agad ginagawang karaniwang personal na titulo ang parirala. Nililinaw ng konteksto na ang tinutukoy ni Pablo ay ang tunay na Diyos, hindi isang puwersang walang personalidad.
- issue: Ang pahayag na ang mga tao ay γένος ng Diyos
  choice: tayo ay lahi ng Diyos
  alternative: tayo ay mga supling ng Diyos; nagmula tayo sa Diyos
  rationale: Pinananatili ang wika ng pinagmulan at pagkakamag-anak sa argumento ni Pablo nang hindi dinaragdagan ng paliwanag tungkol sa espirituwal na pag-aampon o kaligtasan na wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “Kaya” sa halip na mas pormal na “Samakatuwid,” at pinanatili ang bahagyang pilosopikal na himig sa “pagka-Diyos.” Parehong nakalagay sa pangunahing teksto ang mga markang [a] at [b].
