- from: Kaya, yamang tayo ay lahi ng Diyos, hindi natin dapat isipin na ang pagka-Diyos[a] ay tulad ng ginto, pilak, o bato—isang larawang inukit[b] ayon sa husay at kaisipan ng tao.
  to: Kaya, yamang tayo ay mga supling ng Diyos, hindi natin dapat isipin na ang pagka-Diyos[a] ay tulad ng ginto, pilak, bato, o isang imaheng inukit[b] ayon sa husay at kaisipan ng tao.
  rationale: Pinalitan ang “lahi” ng “mga supling” upang maipahayag ang γένος bilang ugnayan ng pinagmulan/kaangkanan, hindi etnisidad. Inayos ang serye ng mga bagay na pinaghahambingan upang malinaw na ang inukit na imahen ay gawang-tao, at pinino ang talababa para sa τὸ θεῖον nang hindi nilulutas ang sinadyang lawak ng termino.
