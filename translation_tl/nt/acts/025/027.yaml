  text: ἄλογον γάρ μοι δοκεῖ πέμποντα δέσμιον μὴ καὶ τὰς κατ’ αὐτοῦ αἰτίας σημᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/027.yaml
  text: For it seems unreasonable to me[a], when sending a prisoner, not also to indicate the charges against him.
translation:
  language: tl
  text: Sapagkat sa palagay ko, hindi makatuwirang magpadala ng isang bilanggo nang hindi rin inilalahad ang mga paratang laban sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinutukoy ang mga paratang laban sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογον
  choice: hindi makatuwiran
  rationale: Ipinapahayag nito na ang gagawin ay salat sa katwiran o wastong administratibong dahilan; natural at angkop sa legal na konteksto ang “hindi makatuwiran.”
- source_word: δοκεῖ μοι
  choice: sa palagay ko
  rationale: Pinananatili nito ang personal at bahagyang maingat na pagtataya ni Festo, sa halip na gawing ganap o tahasang hatol.
- source_word: πέμποντα
  choice: magpadala
  rationale: Ang participle ay inuunawa bilang kalagayang kaugnay ng kilos; sa Filipino, likas itong naipapahayag sa infinitive construction matapos ang “hindi makatuwiran.”
- source_word: δέσμιον
  choice: isang bilanggo
  rationale: Ito ang malinaw at karaniwang katawagan sa isang taong nasa kustodiya sa legal na kontekstong ito.
- source_word: μὴ καὶ
  choice: nang hindi rin
  rationale: 'Pinananatili ng “rin” ang dagdag na diwa ng καί: hindi dapat ipadala ang bilanggo nang wala ang kalakip na paglalahad ng mga paratang.'
- source_word: τὰς κατ’ αὐτοῦ αἰτίας
  choice: ang mga paratang laban sa kanya
  rationale: Sa kontekstong panghukuman, ang αἰτίαι ay mga paratang o sakdal; malinaw at likas sa modernong Filipino ang “mga paratang laban sa kanya.”
- source_word: σημᾶναι
  choice: inilalahad
  rationale: Ipinahihiwatig ng pandiwa ang pagpapabatid o pagtukoy sa mga paratang. Ang “inilalahad” ay natural sa pormal na administratibong konteksto nang hindi labis na ipinapalagay na detalyadong pagtutukoy ang ibig sabihin.
