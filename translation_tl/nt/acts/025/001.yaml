  text: Φῆστος οὖν ἐπιβὰς τῇ ἐπαρχείᾳ μετὰ τρεῖς ἡμέρας ἀνέβη εἰς Ἱεροσόλυμα ἀπὸ Καισαρείας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/001.yaml
  text: So Festus[a], after arriving in the province, went up from Caesarea to Jerusalem after three days,
translation:
  language: tl
  text: Kaya, nang dumating si Festo sa lalawigan[a], pagkaraan ng tatlong araw ay umakyat siya mula sa Cesarea patungong Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nang pumasok siya sa lalawigan” o “nang kunin niya ang pamamahala sa lalawigan.” Ang pandiwaring Griyego ay maaaring tumukoy sa pagdating ni Festo sa lalawigan at, bilang pahiwatig, sa pagsisimula ng kanyang pamamahala roon.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Nag-uugnay ito sa naunang salaysay at nagpapakita ng pagpapatuloy o bunga nang hindi nagiging labis na pormal.
- source_word: ἐπιβὰς τῇ ἐπαρχείᾳ
  choice: pagdating ni Festo sa lalawigan
  rationale: Pinananatili ang temporal na diwa ng participle at ang tuwirang kahulugan ng pagpasok o pagdating sa nasasakupang lalawigan, nang hindi tiyak na ipinapakahulugang pormal na panunungkulan.
- source_word: ἐπαρχείᾳ
  choice: lalawigan
  rationale: Tumutukoy sa isang administratibong lalawigan ng Roma; natural at nauunawaan ang 'lalawigan' sa modernong Filipino.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: pagkaraan ng tatlong araw
  rationale: Tuwirang ipinapahayag ang temporal na pagkakasunod na tinutukoy ng μετά na may accusative.
- source_word: ἀνέβη
  choice: umahon
  rationale: Pinananatili ang heograpiko at nakaugaliang biblikal na diwa ng pag-akyat patungong Jerusalem.
- source_word: εἰς Ἱεροσόλυμα
  choice: patungong Jerusalem
  rationale: Natural na pahayag ng destinasyon sa Filipino.
- source_word: ἀπὸ Καισαρείας
  choice: mula sa Cesarea
  rationale: Tumpak na ipinapahayag ang pinanggalingan; 'Cesarea' ang karaniwang anyong Filipino ng pangalan.
- source_word: Φῆστος
  choice: Festo
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Festus.
