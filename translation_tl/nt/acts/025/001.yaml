translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang salaysay na ugnayan, ang temporal na ayos, at ang tradisyonal na heograpikong diwa ng pag-ahon sa Jerusalem, habang inilagay sa talababa ang lehitimong kalabuan tungkol sa pagdating o pagsisimula ng pamamahala ni Festo.
