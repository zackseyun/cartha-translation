base_translation:
  language: en
  yaml_path: translation/nt/acts/025/005.yaml
  text: Therefore[a], let those among you who are able go down with me, and if there is anything wrong in the man[b], let them accuse him.
translation:
  language: tl
  text: “Kaya,” sabi niya, “bumaba silang kasama ko, ang mga may kakayahan sa inyo[a]. Kung may anumang mali sa taong iyon, paratangan nila siya.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga makapangyarihan sa inyo,” “ang mga prominenteng tao sa inyo,” o “ang mga may awtoridad sa inyo.” Maaaring tumukoy ang Griyegong δυνατοί sa mga taong makapangyarihan, prominente, o may kakayahan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “magharap sila ng mga sakdal laban sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν
  choice: Kaya ... ang mga
  rationale: Ipinahahayag ng οὖν ang pagpapatuloy at bunga ng naunang sinabi; likas itong naihahatid ng “Kaya” sa Filipino. Ang artikulong Οἱ ay kasama ng pang-uring δυνατοί upang tumukoy sa isang pangkat.
- source_word: ἐν ὑμῖν ... δυνατοὶ
  choice: ang mga may kakayahan sa inyo
  rationale: Maaaring mangahulugan ang δυνατοί ng may kakayahan, makapangyarihan, o prominenteng tao. Pinananatili ng “mga may kakayahan” ang tunay na lawak at kalabuan ng salita nang hindi ipinapalagay na mga pinuno o maimpluwensiyang tao lamang ang tinutukoy.
- source_word: φησίν
  choice: sabi niya
  rationale: Ang parentetikong φησίν ay tahasang tanda ng pagsasalita ng nagsasalaysay. Natural sa Filipino ang “sabi niya” sa loob ng tuwirang sipi.
- source_word: συγκαταβάντες
  choice: sumama sa akin pababa
  rationale: Ang σύν ay naihahatid ng “sumama sa akin,” at ang καταβάντες ng “pababa,” ayon sa karaniwang heograpikong paglalarawan sa paglalakbay mula Jerusalem patungong Cesarea.
- source_word: εἴ τί ἐστιν
  choice: kung may anumang
  rationale: Pinananatili nito ang kondisyunal at di-tiyak na diwa ng εἴ at τί.
- source_word: ἐν τῷ ἀνδρὶ
  choice: sa taong iyon
  rationale: Kasama ng “mali,” ipinapahayag nito ang ideya ng anumang masusumpungang kamalian sa taong tinutukoy, sa halip na agad gawing pormal na sakdal ang pariralang ἐν τῷ ἀνδρί.
- source_word: ἄτοπον
  choice: mali
  rationale: 'Malawak ang ἄτοπον: maaaring tumukoy sa hindi nararapat, wala sa lugar, o mali. Hindi ito pinalabis bilang tiyak na krimen o pagkakasala.'
- source_word: κατηγορείτωσαν αὐτοῦ
  choice: paratangan nila siya
  rationale: Ang κατηγορέω ay mangahulugang magparatang o magsakdal. Ang “paratangan” ay malinaw at natural, habang ang panghalip na αὐτοῦ ay idiomatikong inihayag bilang “siya.”
