  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang parentetikong “sabi niya” mula sa Griyego at ang legal na konteksto nang hindi ginagawang mas tiyak kaysa sa orihinal ang uri ng umano’y kamalian.
