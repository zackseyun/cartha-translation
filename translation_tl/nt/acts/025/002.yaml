  text: So the chief priests and the leading men of the Jews presented their case against Paul to him[a], and they urged him,
translation:
  language: tl
  text: Kaya iniharap sa kanya ng mga punong pari at ng mga kilalang lalaki sa mga Judio ang kanilang usapin laban kay Pablo[a], at mahigpit nilang hinilingan siya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipinaalam nila sa kanya ang tungkol kay Pablo” o “nagsampa sila sa harap niya ng mga paratang laban kay Pablo.” Ang pandiwang Griyego ay maaaring mangahulugang ipaalam ang isang bagay, at sa kontekstong ito ay malamang na may legal na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεφάνισάν
  choice: iniharap ... ang kanilang usapin laban
  rationale: Sa kontekstong legal sa harap ng gobernador, tumutukoy ito sa paglalahad ng isang usapin laban sa isang tao. Pinananatili ng salin ang legal na pahiwatig nang hindi ito ginagawang tahasang pormal na sakdal.
- source_word: τέ
  choice: Kaya
  rationale: Nag-uugnay ito sa kasunod na pangyayari sa naunang salaysay; natural na ipinahahayag ng “Kaya” ang daloy ng konteksto.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Tumutukoy kay Festo bilang taong pinagharapan ng usapin.
- source_word: οἱ ἀρχιερεῖς
  choice: mga punong pari
  rationale: Karaniwang katawagan sa pangkat ng matataas na pinunong saserdote sa Jerusalem.
- source_word: οἱ πρῶτοι τῶν Ἰουδαίων
  choice: mga pangunahing lalaki ng mga Judio
  rationale: Pinananatili nito ang panlalaking anyo at ang diwa ng mga lalaking prominente sa lipunan o pamunuan, sa halip na gawing mas malawak na “mga pinuno.”
- source_word: κατὰ τοῦ Παύλου
  choice: laban kay Pablo
  rationale: Ang κατά na may genitive dito ay nagpapahiwatig ng pagsalungat o paratang.
- source_word: παρεκάλουν
  choice: mahigpit ... hinilingan
  rationale: Ipinahihiwatig ng imperfect ang patuloy o paulit-ulit na pakiusap. Ang “mahigpit na hinilingan” ay angkop sa pampolitika at legal na tagpo at hindi kasing-emosyonal ng “nagmakaawa.”
- source_word: αὐτόν
  choice: siyang
  rationale: Tumutukoy muli kay Festo bilang taong mahigpit nilang hinihilingan.
