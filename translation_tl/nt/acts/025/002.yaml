translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang nakabiting wakas ng talata dahil nagpapatuloy ang pangungusap sa susunod na talata. Ang “mga pangunahing lalaki ng mga Judio” ay sadyang malapit sa anyo ng Griyego at nagpapanatili sa panlalaking pagtukoy.
