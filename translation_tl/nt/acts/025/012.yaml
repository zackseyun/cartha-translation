  text: τότε ὁ Φῆστος συλλαλήσας μετὰ τοῦ συμβουλίου ἀπεκρίθη· Καίσαρα ἐπικέκλησαι, ἐπὶ Καίσαρα πορεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/012.yaml
  text: Then Festus[a], after conferring with the council, answered, “You have appealed to Caesar; to Caesar you will go.”
translation:
  language: tl
  text: Noon, matapos makipagsangguni si Festo sa konseho, sumagot siya, “Umapela ka kay Cesar; kay Cesar ka pupunta.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sa harap ni Cesar ka pupunta.” May legal na diwa ang parirala: haharap ka sa hukuman ng emperador matapos umapela.'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Likas na panandang nagsasaad ng kasunod na pangyayari sa salaysay; kasama ng pariralang pandiwari, malinaw nitong inilalahad ang pagkakasunod-sunod.
- source_word: ὁ Φῆστος
  choice: ni Festo
  rationale: Karaniwang anyong Filipino ng pangalang Festus; ginamit sa konstruksiyong nakatuon sa naunang pakikipagsangguni.
- source_word: συλλαλήσας
  choice: makipagsangguni
  rationale: Ipinahihiwatig ng pandiwaring aorist ang kilos na nauna sa pagsagot, at ang pakikipagsangguni ay angkop sa deliberatibong konteksto.
- source_word: μετὰ τοῦ συμβουλίου
  choice: sa konseho
  rationale: Tumutukoy sa lupon na kinonsulta ni Festo; hindi idinagdag ang ‘kaniyang’ sapagkat hindi ito hayag sa Griyego.
- source_word: ἀπεκρίθη
  choice: sumagot siya
  rationale: Direkta at natural na salin na nagpapanatili sa pormal na himig ng legal na tagpo.
- source_word: Καίσαρα
  choice: Cesar
  rationale: Pinananatili ang Romanong titulo/pangalan sa karaniwang baybay na Filipino at ang legal na konteksto nito.
- source_word: ἐπικέκλησαι
  choice: Umapela ka kay
  rationale: Ang perpektong anyong nasa legal na diwa ay tumutukoy sa pormal na paghingi ng paglilitis sa ilalim ng kapangyarihan ni Cesar.
- source_word: ἐπὶ Καίσαρα
  choice: kay Cesar
  rationale: Kasama ng pandiwang ‘pupunta,’ ipinahahayag nito ang pagharap o pagdadala sa awtoridad na inapela; pinananatili sa talababa ang posibleng legal na diwang ‘sa harap ni Cesar.’
- source_word: πορεύσῃ
  choice: ka pupunta
  rationale: Tuwirang isinasalin ang pandiwa ng pagpunta sa hinaharap at iniiwasang idagdag ang pasibong ideyang ‘ipapadala,’ na hindi tahasang nasa Griyego.
