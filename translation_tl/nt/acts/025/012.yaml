translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘konseho’ at ‘umapela’ bilang madaling maunawaang mga terminong legal-administratibo. Inilagay ang talababa pagkatapos ng buong sipi, at naroon ang katugmang marker na [a] sa pangunahing teksto.
