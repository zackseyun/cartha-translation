source:
  edition: SBLGNT
  text: Ἡμερῶν δὲ διαγενομένων τινῶν Ἀγρίππας ὁ βασιλεὺς καὶ Βερνίκη κατήντησαν εἰς Καισάρειαν ἀσπασάμενοι τὸν Φῆστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/013.yaml
  text: After some days had passed[a], King Agrippa and Bernice arrived at Caesarea to greet Festus.
translation:
  language: tl
  text: Pagkalipas ng ilang araw, dumating sa Cesarea sina Haring Agripa at Bernice[a] upang batiin si Festo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ding isulat na “Berenice.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμερῶν δὲ διαγενομένων τινῶν
  choice: Pagkalipas ng ilang araw
  rationale: Likas na salin ng genitive absolute na nagbibigay ng panahong pinangyarihan; hindi na tahasang isinalin ang mahinang pang-ugnay na δέ.
- source_word: Ἀγρίππας ὁ βασιλεὺς
  choice: Haring Agripa
  rationale: Karaniwang ayos sa Filipino para sa titulong βασιλεύς at pangalang pantangi.
- source_word: Βερνίκη
  choice: Bernice
  rationale: Pinanatili ang anyong madaling makilala at karaniwang ginagamit sa mga saling Filipino; inilagay sa talababa ang mas tuwirang transliterasyong Berenice.
- source_word: κατήντησαν εἰς Καισάρειαν
  choice: dumating sa Cesarea
  rationale: Sa konteksto ng paglalakbay, malinaw at natural na ipinahahayag nito ang pagdating sa patutunguhan.
- source_word: ἀσπασάμενοι τὸν Φῆστον
  choice: upang batiin si Festo
  rationale: Ipinahahayag ang layunin o kasabay na pangyayari ng participle nang hindi dinaragdagan ng di-tiyak na seremonyal na kahulugan.
- source_word: Φῆστον
  choice: Festo
  rationale: Nakaugaliang Filipinong anyo ng pangalan ng Romanong gobernador.
theological_decisions: []
