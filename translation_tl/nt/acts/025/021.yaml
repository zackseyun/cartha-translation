revisions:
- from: Ngunit nang umapela si Pablo na manatili siyang nakabilanggo hanggang sa pasiya ng Emperador[a], iniutos kong panatilihin siyang nakabilanggo hanggang sa maipadala ko siya kay Cesar.
  to: Ngunit nang umapela si Pablo na panatilihin siya sa kustodiya para sa pasiya ng Emperador[a], iniutos kong panatilihin siya sa kustodiya hanggang sa maipadala ko siya kay Cesar.
  rationale: Pinalitan ang “hanggang sa pasiya” ng “para sa pasiya” upang maipakita ang εἰς bilang layon ng kustodiya, at ginawang “sa kustodiya” ang dalawang paglitaw ng τηρέω upang mapanatili ang legal na diwa at ang pag-uulit sa Griyego. Hindi binago ang kahulugan ng mga titulo o ang talababa.
