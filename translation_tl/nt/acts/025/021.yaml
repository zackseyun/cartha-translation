review_pass:
  verdict: revise
  source_fidelity: Ang "hanggang sa pasiya ng Emperador" ay nagpapalit sa εἰς τὴν ... διάγνωσιν (“para sa/patungo sa pasiya”) tungo sa isang pansamantalang hangganan. Mas tumpak ang “para sa pasiya,” habang ang kasunod na “hanggang sa maipadala” ang nagsasaad ng aktuwal na hangganan ng kustodiya.
  naturalness: Natural at malinaw sa modernong Filipino ang “panatilihin siya sa kustodiya.” Mas akma ito sa opisyal na detensiyon kaysa “nakabilanggo,” na maaaring magpahiwatig na nakahatol na siyang bilanggo.
  terminology: Pinananatili ang “umapela,” “pasiya,” “Emperador,” at “Cesar.” Ang “Emperador” ay angkop na kontekstuwal na salin ng Σεβαστός, at ang talababa ay wastong nagpapaliwanag ng titulong Griyego nang hindi ipinapantay ito sa personal na pangalan.
  issues:
  - severity: medium
    issue: Ang “hanggang sa pasiya ng Emperador” ay hindi tumpak na katumbas ng εἰς τὴν ... διάγνωσιν.
    rationale: Ang εἰς ay nagsasaad ng layon o layuning legal—pagpapanatili sa kustodiya para sa imperyal na pagpapasiya—hindi “hanggang” sa oras ng pagpapasiya.
  - severity: low
    issue: Ang “nakabilanggo” ay mas makitid kaysa sa legal na kustodiyang ipinahihiwatig ng τηρέω.
    rationale: Maaaring tumukoy ang “nakabilanggo” sa pagkabilanggo matapos ang hatol, samantalang ang talata ay ukol sa pagpigil o pagkakadetine habang hinihintay ang pagpapasiya at pagpapadala.
