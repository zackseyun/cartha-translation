  yaml_path: translation/nt/acts/025/021.yaml
  text: But when Paul appealed to be kept in custody for the decision of the Emperor[a], I ordered that he be kept in custody until I send him to Caesar.
translation:
  language: tl
  text: Ngunit nang umapela si Pablo na panatilihin siya sa kustodiya para sa pasiya ng Emperador[a], iniutos kong panatilihin siya sa kustodiya hanggang sa maipadala ko siya kay Cesar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “ang Sebastos,” isang titulong imperyal na katumbas ng “Augustus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσαμένου
  choice: umapela
  rationale: Sa kontekstong legal ng Roma, tumutukoy ito sa pormal na pag-apela; natural at tiyak sa modernong Filipino ang “umapela.”
- source_word: τηρηθῆναι / τηρεῖσθαι
  choice: manatili siyang nakabilanggo / panatilihin siyang nakabilanggo
  rationale: Ang τηρέω rito ay tumutukoy sa opisyal na kustodiya. Malinaw sa karaniwang Filipino ang “nakabilanggo,” at naipapakita ng magkaibang anyo ang pasibo at causative na daloy ng pangungusap.
- source_word: διάγνωσιν
  choice: pasiya
  rationale: Saklaw nito ang hudisyal na pagpapasiya nang hindi ipinapalagay kung pagdinig lamang o pinal na hatol ang tinutukoy.
- source_word: Σεβαστοῦ
  choice: Emperador
  rationale: Ang Σεβαστός ay titulong imperyal na katumbas ng Augustus. Mas natural at madaling maunawaan sa pangunahing teksto ang “Emperador,” habang inilalahad sa talababa ang literal at makasaysayang anyo ng titulo.
- source_word: ἀναπέμψω
  choice: maipadala ko
  rationale: Ipinahihiwatig nito ang pagpapadala kay Pablo sa nakatataas na awtoridad; natural sa Filipino ang “maipadala ko” at hindi kailangang tahasang tumbasan ang direksiyonal na sangkap ng pandiwa.
- source_word: πρὸς Καίσαρα
  choice: kay Cesar
  rationale: Pinananatili ang makasaysayang titulong Καῖσαρ bilang “Cesar,” na pamilyar at angkop sa salaysay ng Mga Gawa.
