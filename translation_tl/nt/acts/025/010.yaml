  text: εἶπεν δὲ ὁ Παῦλος· ⸂Ἐπὶ τοῦ βήματος Καίσαρος ἑστώς⸃ εἰμι, οὗ με δεῖ κρίνεσθαι. Ἰουδαίους οὐδὲν ⸀ἠδίκησα, ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/010.yaml
  text: But Paul said[a], “I am standing before Caesar’s tribunal, where I ought to be judged. I have done no wrong to the Jews[c][b], as you yourself know very well.”
translation:
  language: tl
  text: Ngunit sinabi ni Pablo, “Nakatayo ako sa hukuman ni Cesar[a][b], kung saan ako dapat litisin. Wala akong ginawang masama laban sa mga Judio[c], tulad ng lubos mo ring nalalaman.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “luklukan ng paghatol ni Cesar.” Ang Griyegong βῆμα ay tumutukoy sa opisyal na luklukan o hukuman ng hukom.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Nakatayo ako sa hukuman ni Cesar.” Binibigyang-diin ng anyong Griyego ang kasalukuyang legal na katayuan ni Pablo roon.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “Wala akong ginawang anumang paglabag laban sa mga Judio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βῆμα
  choice: hukuman
  rationale: Sa kontekstong ito, tumutukoy ang βῆμα sa opisyal na luklukan o tribunal na may kapangyarihang humatol. Likas at malinaw sa makabagong Filipino ang “hukuman,” at hindi nito nililimitahan ang kahulugan sa isang pisikal na upuan lamang.
- source_word: Καίσαρος
  choice: ni Cesar
  rationale: Pinananatili ng “Cesar” ang makasaysayan at legal na titulong Romano sa halip na palitan ito ng mas pangkalahatang “emperador.”
- source_word: ἑστώς εἰμι
  choice: Nakatayo ako
  rationale: Ipinapahayag ng periphrastic na anyo ang kasalukuyang legal na katayuan ni Pablo sa harap ng hukuman, habang pinananatili rin ang matingkad na larawan ng pagtayo roon.
- source_word: οὗ
  choice: kung saan
  rationale: Tumutukoy ito pabalik sa hukuman bilang wastong lugar o saklaw ng paglilitis; natural at sapat na tiyak sa Filipino ang “kung saan.”
- source_word: δεῖ
  choice: dapat
  rationale: Ipinahihiwatig ng δεῖ ang pangangailangan o nararapat na obligasyon. Sa konteksto, iginigiit ni Pablo ang wastong hurisdiksiyon para sa kaniyang kaso.
- source_word: κρίνεσθαι
  choice: litisin
  rationale: Sa pasibong legal na konteksto, ang κρίνεσθαι ay tumutukoy sa paghatol o paglilitis. Mas natural sa Filipino ang “litisin” para sa legal na proseso, nang hindi ipinapalagay ang magiging hatol.
- source_word: Ἰουδαίους
  choice: mga Judio
  rationale: Direkta nitong tinutukoy ang mga Judio na sinasabing gawan ni Pablo ng mali. Hindi sapat ang konteksto upang paliitin ito sa mga taga-Judea lamang o tahasang sa mga pinunong Judio.
- source_word: οὐδὲν ἠδίκησα
  choice: Wala akong ginawang masama
  rationale: Malinaw at natural nitong naipapahayag ang moral at legal na puwersa ng ἀδικέω—ang paggawa ng mali, pinsala, o kawalang-katarungan.
- source_word: ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις
  choice: gaya ng alam na alam mo mismo
  rationale: Ipinapakita ng “mo mismo” ang diin ng καὶ σύ, samantalang likas na ipinapahayag ng “alam na alam” ang masidhing diwa ng κάλλιον at ἐπιγινώσκεις nang hindi gumagamit ng alanganing literal na paghahambing.
theological_decisions:
- issue: Saklaw ng katawagang Ἰουδαίους
  choice: mga Judio
  alternative: mga pinunong Judio; mga taga-Judea
  rationale: Pinananatili ang malawak na katawagan ng Griyego at hindi tahasang nililimitahan ang tinutukoy sa mga pinuno o sa isang heograpikong pangkat, yamang hindi iyon tinutukoy ng talata mismo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hukuman” at “litisin” upang maipahayag nang natural ang legal na tagpo, habang pinanatili ang “Cesar” para sa makasaysayang titulong Romano. Iniwasan ang sobrang teknikal o makalumang pananalita.
