base_translation:
  language: en
  yaml_path: translation/nt/acts/025/006.yaml
  text: After spending among them no more than eight or ten days[a], he went down to Caesarea, and on the next day, after taking his seat on the tribunal, he ordered Paul to be brought in.
translation:
  language: tl
  text: Matapos siyang manatili sa piling nila nang hindi hihigit sa walo o sampung araw, bumaba siya sa Cesarea. Kinabukasan, naupo siya sa luklukan ng hukuman[a] at ipinag-utos na dalhin si Pablo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego na βῆμα ay tumutukoy sa opisyal na luklukan o plataporma ng paglilitis kung saan humahatol ang isang pinuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διατρίψας δὲ ἐν αὐτοῖς
  choice: Matapos siyang manatili sa piling nila
  rationale: Ipinahahayag ng aorist participle ang kilos na nauna sa pagpunta sa Cesarea. Likas sa Tagalog ang “matapos siyang manatili,” at pinananatili ng “sa piling nila” ang panlipunan at panlokasyong diwa ng ἐν αὐτοῖς.
- source_word: ἡμέρας οὐ πλείους ὀκτὼ ἢ δέκα
  choice: nang hindi hihigit sa walo o sampung araw
  rationale: Pinananatili nito ang tahasang hangganang ipinahihiwatig ng οὐ πλείους at ang hindi eksaktong bilang na “walo o sampu,” sa halip na gawing tiyak o palitan ng simpleng “mga.”
- source_word: καταβὰς εἰς Καισάρειαν
  choice: bumaba siya sa Cesarea
  rationale: Pinananatili ang karaniwang sinaunang heograpikong pananalitang “bumaba” para sa paglalakbay mula Jerusalem patungong Cesarea, habang ginagawang natural na sugnay sa Tagalog ang participle.
- source_word: τῇ ἐπαύριον
  choice: Kinabukasan
  rationale: Maikli, natural, at eksaktong katumbas ng araw kasunod ng kanyang pagdating.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: naupo siya sa upuang-hukom
  rationale: Sa kontekstong ito, ang βῆμα ay opisyal na upuan o platapormang ginagamit sa paghatol. Ang “upuang-hukom” ay malinaw sa karaniwang mambabasa at pinananatili ang kongkretong larawan ng teksto.
- source_word: ἐκέλευσεν τὸν Παῦλον ἀχθῆναι
  choice: ipinag-utos na dalhin si Pablo
  rationale: Ipinakikita ng “ipinag-utos” ang opisyal na utos, at ng “dalhin” ang passive infinitive nang hindi dinaragdagan kung saan eksaktong dadalhin si Pablo.
theological_decisions: []
translation_notes:
  register: Makabago at dignified na Filipino ang ginamit, na may malinaw na legal na himig. Pinanatili ang di-eksaktong “walo o sampung araw” at ang heograpikong “bumaba.” Inilagay ang talababa sa “upuang-hukom,” ang salitang aktuwal nitong nililinaw.
