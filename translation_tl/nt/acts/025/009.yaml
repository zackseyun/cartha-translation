base_translation:
  language: en
  yaml_path: translation/nt/acts/025/009.yaml
  text: But Festus[a], wanting to do the Jews a favor, answered Paul and said[c][b], “Do you want to go up to Jerusalem and there be judged before me concerning these things?”
translation:
  language: tl
  text: Ngunit si Festo, na nagnanais na magbigay ng pabor sa mga Judio,[a][b] ay sumagot kay Pablo at nagsabi, “Nais mo bang umahon sa Jerusalem at doon ka litisin sa harap ko hinggil sa mga bagay na ito?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagbigyan ang mga Judio”; nais ni Festo na magbigay ng pabor sa mga Judiong nagsasakdal kay Pablo.
    reason: lexical_alternative
  - marker: b
    text: Sa kontekstong ito, ang “mga Judio” ay tumutukoy sa mga Judiong nagsasakdal o mga pinunong nagsusulong ng kaso, hindi sa bawat Judio nang walang pagtatangi.
    reason: cultural_note
  - marker: c
    text: Maaari ring “hatulan” o “dinggin ang iyong kaso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: na nagnanais
  rationale: Ipinapahayag ng kasalukuyang participle ang patuloy na hangarin ni Festo; natural at marangal sa modernong Filipino ang “na nagnanais.”
- source_word: τοῖς Ἰουδαίοις
  choice: ang mga Judio
  rationale: Pinananatili ang malawak na katawagang nasa Griyego. Nililinaw sa talababa na sa konteksto ay tumutukoy ito sa mga Judiong nagsasakdal o namumuno, hindi sa lahat ng Judio.
- source_word: χάριν καταθέσθαι
  choice: pagbigyan
  rationale: Natural na ipinahahayag nito ang idyomang gumawa o magkaloob ng pabor upang mapalugod ang isang panig, nang hindi ipinapalagay ang mas tahasang mapagmanipulang motibo.
- source_word: ἀποκριθεὶς
  choice: sumagot
  rationale: Karaniwang salaysay na pananalita para sa tugon na nagpapakilala sa direktang sinabi.
- source_word: Θέλεις
  choice: Nais mo bang
  rationale: Direktang itinatanong ang kagustuhan ni Pablo at pinananatili ang diwa ng θέλω.
- source_word: εἰς Ἱεροσόλυμα ἀναβὰς
  choice: umahon sa Jerusalem
  rationale: Pinananatili ang kumbensiyonal at heograpikong diwa ng pag-ahon patungong Jerusalem.
- source_word: περὶ τούτων
  choice: tungkol sa mga bagay na ito
  rationale: Malawak at hindi labis na tiyak, gaya ng Griyego; hindi nito ipinapalit ang mas interpretibong “mga paratang.”
- source_word: κριθῆναι
  choice: litisin
  rationale: Sa kontekstong panghukuman, malinaw at natural ang “litisin,” habang ang talababa ay nagtatala ng mas literal na posibilidad na “hatulan.”
- source_word: ἐπ’ ἐμοῦ
  choice: sa harap ko
  rationale: Ipinapakita ang presensiya at awtoridad ni Festo sa paglilitis nang hindi nagpapasyang siya lamang ang hahatol.
theological_decisions:
- issue: Posibleng mapanlahatang pagbasa sa “ang mga Judio”
  choice: Panatilihin sa pangunahing teksto ang “ang mga Judio,” na tuwirang katumbas ng τοῖς Ἰουδαίοις, at linawin sa talababa ang kontekstuwal na saklaw.
  alternative: ang mga pinunong Judio; ang mga Judiong nagsasakdal
  rationale: Ang pagpapakitid sa pangunahing teksto ay magdaragdag ng interpretasyong hindi tahasang nakasaad sa pariralang Griyego. Gayunman, kailangan ang paglilinaw upang hindi ito maling ipakahulugan na tumutukoy sa lahat ng Judio nang walang pagtatangi.
- issue: Saklaw ng κριθῆναι sa kontekstong legal
  choice: litisin
  alternative: hatulan; dinggin ang iyong kaso
  rationale: Ang pandiwa ay maaaring tumukoy sa paghatol o paglilitis. Ang “litisin” ang pinakanatural sa tanong tungkol sa paglilipat ng lugar ng pagdinig, ngunit pinananatili sa talababa ang leksikal na lawak.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Festo,” “Pablo,” at “Jerusalem” ayon sa karaniwang anyong Filipino. Ang ayos ng pangungusap ay ginawang natural habang pinananatili ang motibo ni Festo, ang tanong tungkol sa pag-ahon sa Jerusalem, at ang hindi lubos na tiyak na saklaw ng mga terminong legal.
