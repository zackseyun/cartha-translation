base_translation:
  language: en
  yaml_path: translation/nt/acts/025/022.yaml
  text: Then Agrippa said to Festus[a], “I myself would like to hear the man.” “Tomorrow,” he says[c][b], “you will hear him.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Agripa kay Festo, “Gusto ko ring marinig ang taong iyon.” “Bukas,” sabi niya,[a] “maririnig mo siya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego, pangkasalukuyan ang anyo: “sinasabi niya.” Ginamit ito bilang masiglang paraan ng pagsasalaysay tungkol sa nakaraan.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “makikinig ka sa kanya.” Ang pahayag sa Griyego ay tumutukoy sa tuwirang pakikinig sa taong magsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας
  choice: Agripa
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan.
- source_word: δὲ
  choice: Pagkatapos
  rationale: Ipinahihiwatig dito ang pagpapatuloy ng salaysay nang hindi pinalalakas ang bahagyang pagsalungat.
- source_word: πρὸς τὸν Φῆστον
  choice: sinabi ... kay Festo
  rationale: Likas na Filipino para sa patutunguhan ng sinabi.
- source_word: Ἐβουλόμην
  choice: Gusto ko
  rationale: Sa kontekstong ito, natural na ipinapahayag ng di-ganap na anyo ang magalang o kasalukuyang pagnanais; magiging alanganin sa Filipino ang literal na aspektong nakaraan.
- source_word: καὶ αὐτὸς
  choice: rin
  rationale: Pinananatili ang posibleng panagdag na diwa ng καί; naipahihiwatig na mismo ng panghalip na “ko” ang personal na pakikilahok ni Agripa.
- source_word: τοῦ ἀνθρώπου
  choice: ang taong iyon
  rationale: Tumutukoy kay Pablo bilang tiyak na taong pinag-uusapan; natural sa Filipino ang deiktikong “iyon” sa ganitong usapan.
- source_word: ἀκοῦσαι
  choice: marinig
  rationale: Tuwirang katumbas na angkop sa pagdinig kay Pablo na magsalita.
- source_word: Αὔριον
  choice: Bukas
  rationale: Tuwirang salin ng temporal na pang-abay.
- source_word: φησίν
  choice: sabi niya
  rationale: Natural na salaysay sa Filipino; hindi karaniwang minamarkahan ng Filipino ang historikal na pangkasalukuyan sa paraang “sinasabi niya” rito, kaya ipinaliliwanag sa talababa ang anyong Griyego.
- source_word: ἀκούσῃ αὐτοῦ
  choice: maririnig mo siya
  rationale: Pinananatili ang payak na diwa ng pagdinig mismo sa taong magsasalita, habang kinikilala sa talababa ang posibleng “makikinig ka sa kanya.”
