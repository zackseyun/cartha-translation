translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Gusto ko ring” bilang likas na pahayag ng pagnanais at upang mapanatili ang panagdag na posibleng diwa ng καὶ αὐτός. Ang mga pangalang Agripa at Festo ay nasa nakaugaliang anyong Filipino.
