translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Hinati sa tatlong pangungusap ang mahabang Griyegong pangungusap upang maging malinaw ang pagkakasunod-sunod ng mga pangyayari, habang pinananatili ang ugnayang naratibo at ang dalawang genitive absolute.
