revisions:
- from: Kaya kinabukasan, dumating sina Agripa at Bernice nang may maringal na pagpapakitang-tao[a]. Pumasok sila sa bulwagan ng pagdinig kasama ang mga kumander ng hukbo at ang mga kilalang lalaki sa lungsod[b]. Pagkautos ni Festo, ipinasok si Pablo.
  to: Kaya, kinabukasan, dumating sina Agripa at Bernice na may malaking karangyaan[a] at pumasok sa bulwagan ng pagdinig kasama ng mga kumander ng hukbo at mga lalaking may mataas na katayuan sa lungsod[b]. Sa utos ni Festo, ipinasok si Pablo.
  rationale: Inayos ang mga pariralang maaaring magdagdag ng di-tiyak na kahulugan at pinili ang mas likas na modernong Tagalog. Nananatili ang seremonyal na dating ng φαντασία, ang panlalaking sanggunian ng ἀνδράσιν, ang mataas na katayuan ng mga lalaki sa lungsod, at ang balintiyak na pagdadala kay Pablo ayon sa utos ni Festo. Napanatili rin ang dalawang footnote anchor sa mga kaugnay na termino.
