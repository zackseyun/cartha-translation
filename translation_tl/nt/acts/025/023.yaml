  text: Τῇ οὖν ἐπαύριον ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης μετὰ πολλῆς φαντασίας καὶ εἰσελθόντων εἰς τὸ ἀκροατήριον σύν ⸀τε χιλιάρχοις καὶ ἀνδράσιν τοῖς κατ’ ⸀ἐξοχὴν τῆς πόλεως καὶ κελεύσαντος τοῦ Φήστου ἤχθη ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/023.yaml
  text: So on the next day, Agrippa and Bernice came with great pomp and entered the audience hall with both the military tribunes and the prominent men of the city, and at Festus's command Paul was brought in.
translation:
  language: tl
  text: Kaya, kinabukasan, dumating sina Agripa at Bernice na may malaking karangyaan[a] at pumasok sa bulwagan ng pagdinig kasama ng mga kumander ng hukbo at mga lalaking may mataas na katayuan sa lungsod[b]. Sa utos ni Festo, ipinasok si Pablo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na may malaking pagpaparangya” o “na may maringal na pagtatanghal.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga nangungunang lalaki sa lungsod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ οὖν ἐπαύριον
  choice: Kaya kinabukasan
  rationale: Ang temporal na parirala ay likas na isinasalin bilang “kinabukasan,” habang ang οὖν ay pinananatili bilang “Kaya” upang ipakita ang pagpapatuloy ng salaysay.
- source_word: ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης
  choice: dumating sina Agripa at Bernice
  rationale: Ginawang pandiwang may tahasang simuno ang genitive absolute para sa likas na daloy sa Tagalog. Ginamit ang karaniwang anyong Filipino ng mga pangalan.
- source_word: μετὰ πολλῆς φαντασίας
  choice: nang may maringal na pagpapakitang-tao
  rationale: Sa konteksto, tumutukoy ang φαντασία sa marangya at kapansin-pansing pampublikong pagpapakita. Pinananatili ng “pagpapakitang-tao” ang pahiwatig ng panlabas na karangyaan, hindi lamang simpleng dignidad.
- source_word: εἰσελθόντων εἰς τὸ ἀκροατήριον
  choice: Pumasok sila sa bulwagan ng pagdinig
  rationale: Ang ἀκροατήριον ay lugar para sa opisyal na pagdinig; malinaw at natural ang “bulwagan ng pagdinig” sa kontekstong pampamahalaan.
- source_word: σύν τε χιλιάρχοις
  choice: kasama ang mga kumander ng hukbo
  rationale: Ang χιλίαρχος ay mataas na opisyal militar. Mas madaling maunawaan sa modernong Tagalog ang “kumander ng hukbo” kaysa teknikal na hiram na “tribuno,” nang hindi ipinapalagay ang eksaktong modernong ranggo.
- source_word: ἀνδράσιν τοῖς κατ’ ἐξοχὴν τῆς πόλεως
  choice: ang mga kilalang lalaki sa lungsod
  rationale: Ipinahahayag ng κατ’ ἐξοχήν ang katanyagan o mataas na katayuan, at pinananatili ng “mga lalaki” ang tahasang panlalaking sanggunian ng ἀνδράσιν.
- source_word: κελεύσαντος τοῦ Φήστου
  choice: Pagkautos ni Festo
  rationale: Maikli at natural na salin ng genitive absolute na pinananatili ang opisyal na utos ni Festo.
- source_word: ἤχθη ὁ Παῦλος
  choice: ipinasok si Pablo
  rationale: Pinananatili ng anyong balintiyak ang di-tahasang mga tagapaghatid at ipinakikitang dinala si Pablo sa loob ayon sa utos.
