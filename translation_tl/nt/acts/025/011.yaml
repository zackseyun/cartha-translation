  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἀδικῶ καὶ ἄξιον θανάτου πέπραχά τι, οὐ παραιτοῦμαι τὸ ἀποθανεῖν· εἰ δὲ οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου, οὐδείς με δύναται αὐτοῖς χαρίσασθαι· Καίσαρα ἐπικαλοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/011.yaml
  text: If[a], then, I am doing wrong and have done anything deserving death, I do not refuse to die. But if there is nothing to the things these men are accusing me of, no one can hand me over to them as a favor. I appeal to Caesar.
translation:
  language: tl
  text: Kung gayon, kung gumagawa nga ako ng mali at may nagawa akong anumang bagay na nararapat ikamatay, hindi ako tumatangging mamatay. Ngunit kung wala ni isa sa mga ibinibintang ng mga taong ito laban sa akin ang totoo, walang sinumang maaaring magsuko sa akin sa kanila bilang pabor.[a] Umaapela ako kay Cesar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isuko ako sa kanila upang pagbigyan sila.” Kasama sa pandiwang Griyego ang diwa ng pagkakaloob o pagsuko sa isang tao bilang pabor.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶ
  choice: gumagawa nga ako ng mali
  rationale: Pinananatili ng aspektong pangkasalukuyan ang diwang kalagayan o patuloy na paggawa ng mali, habang ang “nga” ay tumutulong ipahayag ang diin ng μὲν sa unang sangay ng pangangatwiran.
- source_word: ἄξιον θανάτου
  choice: karapat-dapat sa kamatayan
  rationale: Likas at malinaw itong katumbas na nagpapanatili sa evaluative at legal na diwa ng pagiging nararapat patawan ng kamatayan nang hindi ginagawang mas teknikal kaysa sa Griyego.
- source_word: πέπραχά τι
  choice: may nagawa akong anumang
  rationale: Ipinahihiwatig ng “may nagawa” ang natapos na gawa na may kaugnayan sa kasalukuyang usapin, at pinananatili ng “anumang” ang kawalang-tiyak ng τι.
- source_word: οὐ παραιτοῦμαι τὸ ἀποθανεῖν
  choice: hindi ako tumatangging mamatay
  rationale: Tuwirang inilalahad nito ang kahulugang tumanggi o umiwas sa kamatayan at pinananatili ang kondisyunal na pagtanggap ni Pablo sa legal na hatol.
- source_word: οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου
  choice: walang katotohanan ang mga paratang sa akin ng mga taong ito
  rationale: Natural sa modernong Tagalog at ipinapahayag ang diwa na walang batayan o sustansiya ang kanilang mga paratang. Ang “katotohanan” ay malinaw na legal na pagbubuo ng ipinahihiwatig ng konstruksyon.
- source_word: χαρίσασθαι
  choice: ibigay ako sa kanila bilang pabor
  rationale: Pinananatili nito kapwa ang paghahatid o pagsuko sa isang tao at ang natatanging diwa ng pagkakaloob bilang pabor na taglay ng pandiwa.
- source_word: Καίσαρα ἐπικαλοῦμαι
  choice: Umaapela ako kay Cesar
  rationale: Ito ang malinaw at karaniwang legal na pananalita para sa pormal na pagdulog sa emperador.
- source_word: μὲν οὖν ... δὲ
  choice: Kaya, kung ... nga ... Ngunit kung
  rationale: Ipinakikita ng “kaya” ang lohikal na pagpapatuloy, ng “nga” ang diin sa unang kondisyon, at ng “ngunit” ang salungat na ikalawang kondisyon.
theological_decisions:
- issue: Legal na diwa ng pahayag ni Pablo tungkol sa kamatayan at pag-apela
  choice: Kondisyunal na tinatanggap ni Pablo ang kamatayan kung tunay siyang nagkasala ng bagay na nararapat dito, ngunit itinatanggi niyang may karapatan ang sinuman na isuko siya bilang pabor kung walang katotohanan ang mga paratang.
  alternative: Unawain ang sinabi bilang retorika lamang na walang anumang pagkilala sa pagiging lehitimo ng legal na hatol.
  rationale: Pangunahing legal ang talata. Pinananatili ng salin ang kondisyunal na pagtanggap sa kamatayan at ang pagtutol sa di-makatarungang pagsuko, nang hindi bumubuo ng mas malawak na doktrina tungkol sa parusang kamatayan.
translation_notes:
  register: Modernong Filipino Tagalog na pormal ngunit madaling maunawaan; pinanatili ang tono ng legal na pagtatanggol. Ginamit ang “Cesar” bilang nakaugaliang anyo ng titulong Romano at iniwasan ang sobrang teknikal na terminolohiyang legal.
