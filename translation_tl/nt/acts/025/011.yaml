revisions:
- from: Kaya, kung gumagawa nga ako ng mali at may nagawa akong anumang karapat-dapat sa kamatayan, hindi ako tumatangging mamatay. Ngunit kung walang katotohanan ang mga paratang sa akin ng mga taong ito, walang sinumang maaaring ibigay ako sa kanila bilang pabor.[a] Umaapela ako kay Cesar.
  to: Kung gayon, kung gumagawa nga ako ng mali at may nagawa akong anumang bagay na nararapat ikamatay, hindi ako tumatangging mamatay. Ngunit kung wala ni isa sa mga ibinibintang ng mga taong ito laban sa akin ang totoo, walang sinumang maaaring magsuko sa akin sa kanila bilang pabor.[a] Umaapela ako kay Cesar.
