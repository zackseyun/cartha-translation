base_translation:
  language: en
  yaml_path: translation/nt/acts/025/008.yaml
  text: 'Paul made his defense: “I have sinned in nothing against either the law of the Jews[a], or the temple, or Caesar.”'
translation:
  language: tl
  text: 'Ipinagtanggol ni Pablo ang kanyang sarili: “Hindi ako nagkasala ng anuman laban sa kautusan ng mga Judio[a], sa templo, o kay Cesar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Wala akong ginawang anumang paglabag laban sa kautusan ng mga Judio, sa templo, o kay Cesar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: Ipinagtanggol ni Pablo ang kanyang sarili
  rationale: Likas sa modernong Tagalog at pinananatili ang diwang legal ng paghahayag ng depensa sa hukuman.
- source_word: ὅτι
  choice: ipinakilala sa pamamagitan ng tutuldok at tuwirang sipi
  rationale: Ipinakikilala ng ὅτι ang nilalaman ng depensa; mas natural sa Tagalog ang tuwirang sipi.
- source_word: νόμον τῶν Ἰουδαίων
  choice: Kautusan ng mga Judio
  rationale: Pinananatili ang anyong henitibo at ang karaniwang katawagan sa kautusang tinutukoy sa konteksto.
- source_word: ἱερὸν
  choice: templo
  rationale: Karaniwang tumutukoy ang ἱερόν sa kabuuang templo o mga nasasakupan nito, hindi lamang sa pinakaloob na santuwaryo.
- source_word: Καίσαρά
  choice: Cesar
  rationale: Pinananatili ang titulo/pangalan ng Romanong emperador at ang legal-politikal na konteksto.
- source_word: τι
  choice: anumang
  rationale: Kasama ng negatibong pahayag, ipinakikita nito ang ganap at malawak na pagtanggi.
- source_word: ἥμαρτον
  choice: Wala akong anumang kasalanan
  rationale: Pinananatili ang ugnayang leksikal sa kasalanan habang ang pariralang 'laban sa' ay angkop din sa legal na konteksto.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: laban sa ... sa ... o kay
  rationale: Natural na Tagalog na talaan sa loob ng isang negatibong pahayag at pinananatili ang tatlong saklaw ng pagtanggi.
theological_decisions:
- issue: Legal kumpara sa moral na diwa ng ἥμαρτον
  choice: Wala akong anumang kasalanan
  alternative: Wala akong ginawang anumang paglabag
  rationale: Legal ang tagpo, ngunit karaniwang salita para sa pagkakasala ang ἁμαρτάνω. Hindi nililimitahan ng salin ang pahayag sa teknikal na paglabag lamang; inilalahad sa talababa ang posibleng legal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pormal na tagpong panghukuman. Ginamit ang 'Judio' at 'Cesar' bilang mga karaniwang katawagang biblikal; pinanatili ang moral at legal na tensiyon ng ἥμαρτον sa teksto at talababa.
