    rationale: Maaaring mabasa ito bilang pag-aangking walang kasalanan sa pangkalahatan. Ang “Hindi ako nagkasala ng anuman laban sa” ay tahasang nagsasaad ng pagkilos na itinanggi ni Pablo at pinananatili ang leksikal na diwa ng ἁμαρτάνω.
