base_translation:
  language: en
  yaml_path: translation/nt/acts/025/016.yaml
  text: To them I answered that it is not the custom of the Romans to hand over any man before the accused has the accusers face to face and receives an opportunity for a defense concerning the charge[a][b].
translation:
  language: tl
  text: Sumagot ako sa kanila na hindi kaugalian ng mga Romano na ibigay ang sinumang tao bilang pabor[a] bago personal na makaharap ng akusado ang mga nag-aakusa sa kanya at mabigyan siya ng pagkakataong ipagtanggol ang sarili laban sa paratang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isuko ang sinumang tao”; maaaring tumukoy ang pandiwang Griego sa pagbibigay o pagsuko ng isang tao upang pagbigyan ang kahilingan ng mga nag-aakusa.
    reason: lexical_alternative
  - marker: b
    text: Maaaring isalin ang huling bahagi na “magharap ng pagtatanggol tungkol sa paratang.”
    reason: translation_alternative
lexical_decisions:
- source_word: ἔθος
  choice: kaugalian
  rationale: Tumutukoy ito sa kinikilalang kaugalian o nakatatag na gawain; natural ang “kaugalian” sa kontekstong legal at pampamahalaan.
- source_word: Ῥωμαίοις
  choice: ng mga Romano
  rationale: Ang datibong maramihan ay tumutukoy sa mga Romano bilang sambayanan at legal na kapangyarihan, nang hindi nililimitahan sa mga opisyal lamang.
- source_word: χαρίζεσθαί
  choice: ibigay ... bilang pabor
  rationale: Pinananatili nito ang diwa ng pagbibigay o pagsuko ng isang tao bilang pagtugon sa hinihinging pabor, na higit na tiyak kaysa sa simpleng “ibigay.”
- source_word: τινα ἄνθρωπον
  choice: sinumang tao
  rationale: Ang ἄνθρωπον ay nasa panlalaking anyong gramatikal ngunit pangkalahatan ang gamit sa legal na konteksto; natural at tumpak sa Filipino ang “sinumang tao.”
- source_word: ὁ κατηγορούμενος
  choice: ang akusado
  rationale: Maikli, malinaw, at karaniwang katawagang legal para sa taong inaakusahan.
- source_word: κατὰ πρόσωπον
  choice: nakakaharap
  rationale: Natural nitong ipinahahayag ang harapang pagharap ng akusado at mga nag-aakusa nang hindi mekanikal ang pagsasalin ng idyoma.
- source_word: τόπον ... ἀπολογίας
  choice: pagkakataong ipagtanggol ang sarili
  rationale: Ang τόπος ay nangangahulugang pagkakataon o puwang, at ang ἀπολογία ay legal na pagtatanggol; malinaw at likas ang buong parirala sa modernong Filipino.
- source_word: ἐγκλήματος
  choice: paratang
  rationale: Tumutukoy ito sa legal na sakdal o akusasyon; madaling maunawaan ang “paratang” at ang legal na konteksto ay nananatiling malinaw.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na legal na himig. Ginamit ang “akusado,” “mga nag-aakusa,” at “paratang” upang maging madaling maunawaan nang hindi nawawala ang pormal na konteksto. Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto.
