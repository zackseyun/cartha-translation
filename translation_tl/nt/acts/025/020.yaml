base_translation:
  language: en
  yaml_path: translation/nt/acts/025/020.yaml
  text: And since I was at a loss about the investigation concerning these matters[b][a], I asked whether he wanted to go to Jerusalem and be judged there concerning them.
translation:
  language: tl
  text: At dahil naguguluhan ako tungkol sa usapin hinggil sa mga bagay na ito,[a] tinanong ko siya kung nais niyang pumunta sa Jerusalem at doon siya litisin tungkol sa mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil hindi ko malaman kung paano haharapin ang usapin hinggil sa mga bagay na ito.”
    reason: Ipinakikita ang posibleng pagpapahayag ng ἀπορούμενος na may ζήτησις bilang usapin o pagsisiyasat, nang hindi itinatakda na ang teksto ay tahasang tumutukoy sa paraan ng pagsisiyasat.
lexical_decisions:
- source_word: ἀπορούμενος
  choice: dahil hindi ko malaman
  rationale: Ipinahahayag nito ang pagkalito o kawalan ng katiyakan ni Festo; ipinakikita ng “dahil” ang malamang na sanhi sa konteksto.
- source_word: τὴν περὶ τούτων ζήτησιν
  choice: kung paano sisiyasatin ang mga bagay na ito
  rationale: Natural itong Filipino para sa pagsisiyasat o pagtalakay na hindi alam ni Festo kung paano haharapin, bagaman maaari ring unawain ang ζήτησις bilang usapin o pagtatalo.
- source_word: ἔλεγον εἰ βούλοιτο
  choice: tinanong ko siya kung nais niyang
  rationale: Bagaman literal na “sinabi ko kung,” gumaganap itong di-tuwirang tanong; pinananatili ng “nais” ang diwa ng βούλομαι nang hindi ito nililimitahan sa basta pagsang-ayon.
- source_word: πορεύεσθαι εἰς Ἱεροσόλυμα
  choice: pumunta sa Jerusalem
  rationale: Payak at natural na salin ng pagpunta sa pinangalanang lugar.
- source_word: κἀκεῖ κρίνεσθαι περὶ τούτων
  choice: at doon litisin tungkol sa mga ito
  rationale: Sa legal na konteksto, ang passive κρίνεσθαι ay tumutukoy sa pagharap sa paghatol o paglilitis; natural sa Filipino ang “litisin” habang nananatiling malinaw ang lugar at paksa.
theological_decisions: []
translation_notes:
  register: Makabago at dignified na Filipino, na may malinaw na legal na himig. Ginamit ang “litisin” bilang natural na katumbas sa kontekstong hudisyal, at nilagyan ng talababa ang tunay na leksikal na kalabuan sa pariralang tungkol sa ζήτησις.
