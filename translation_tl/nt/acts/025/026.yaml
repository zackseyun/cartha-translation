  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: περὶ οὗ ἀσφαλές τι γράψαι τῷ κυρίῳ οὐκ ἔχω· διὸ προήγαγον αὐτὸν ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ, βασιλεῦ Ἀγρίππα, ὅπως τῆς ἀνακρίσεως γενομένης σχῶ τί ⸀γράψω·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/026.yaml
  text: Concerning him I have nothing definite to write to my lord[a]. Therefore I have brought him before you all, and especially before you, King Agrippa, so that, after the examination has taken place[b], I may have something to write.
translation:
  language: tl
  text: Tungkol sa kanya, wala akong tiyak na maisulat sa aking panginoon.[a] Kaya iniharap ko siya sa inyong lahat, at lalo na sa iyo, Haring Agripa, upang, pagkatapos ng pagsisiyasat,[b] magkaroon ako ng maisusulat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas tahasan, “sa emperador.” Ang Griyego ay nagsasabing “sa aking panginoon,” isang opisyal na titulong ginagamit para sa emperador sa kontekstong ito.
    reason: alternative_reading
  - marker: b
    text: Ang “pagsisiyasat” ay maaari ring isaling “pagdinig” o “pagsusuri”; tumutukoy ito sa legal na pag-iimbestiga sa kaso ni Pablo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλές τι
  choice: tiyak na maisulat
  rationale: Ang ἀσφαλές ay tumutukoy sa impormasyong matibay o tiyak. Sa kontekstong administratibo at legal, likas sa Filipino ang “wala akong tiyak na maisulat.”
- source_word: τῷ κυρίῳ
  choice: sa aking panginoon
  rationale: Pinananatili nito ang leksikal na anyo ng κύριος at ang pormal na tono, habang nililinaw sa talababa na ang tinutukoy sa kontekstong ito ay ang emperador.
- source_word: προήγαγον αὐτὸν ἐφ’ ὑμῶν
  choice: iniharap ko siya sa inyong lahat
  rationale: Ipinahihiwatig ng προάγω rito ang pagdadala o paghaharap sa isang kapulungan; ipinakikita ng “inyong lahat” na maramihan ang ὑμῶν, bilang kaibahan sa kasunod na pang-isahang pagtukoy kay Agripa.
- source_word: καὶ μάλιστα ἐπὶ σοῦ
  choice: at lalo na sa iyo
  rationale: Ipinapanatili ng “lalo na” ang natatanging pagtuon kay Agripa sa gitna ng mas malaking pangkat.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Haring Agripa
  rationale: Likas at marangal na anyo ito sa modernong Filipino para sa bokatibong titulo at pangalan.
- source_word: τῆς ἀνακρίσεως γενομένης
  choice: matapos ang pagsisiyasat
  rationale: Ang ἀνάκρισις ay legal na pagsusuri, pagdinig, o pagsisiyasat. Ang “pagsisiyasat” ay malinaw at hindi labis na teknikal; ang genitive absolute ay likas na isinaling pansamantala bilang “matapos.”
- source_word: σχῶ τί γράψω
  choice: magkaroon ako ng maisusulat
  rationale: Pinananatili nito ang diwa ng σχῶ, “magkaroon ako,” at natural na ipinapahayag ang layuning makakuha ng nilalamang mailalagay sa opisyal na ulat.
theological_decisions:
- issue: Pagsasalin ng κύριος sa kontekstong imperyal at hindi teolohikal
  choice: aking panginoon
  alternative: emperador
  rationale: Bagaman ang κύριος ay karaniwang “Panginoon,” dito ay pormal na tawag ito sa Romanong emperador. Pinananatili ng pangunahing teksto ang leksikal na anyo at nililinaw ng talababa ang tiyak na tinutukoy, nang hindi ipinagpapalagay na banal ang titulo rito.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang pormal at legal na himig ng pahayag ni Festo, ang kaibahan ng maramihang “inyong lahat” at pang-isahang “iyo,” at ang tunay na saklaw ng mga salitang κύριος at ἀνάκρισις sa pamamagitan ng mga talababa.
