id: ACT.25.17
reference: Acts 25:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: συνελθόντων ⸀οὖν ἐνθάδε ἀναβολὴν μηδεμίαν ποιησάμενος τῇ ἑξῆς καθίσας ἐπὶ τοῦ βήματος ἐκέλευσα ἀχθῆναι τὸν ἄνδρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/017.yaml
  text: So when they had come together here[a], I made no delay, but on the next day I sat on the judgment seat and ordered the man to be brought.
translation:
  language: tl
  text: Kaya, nang magtipon sila rito, hindi ako nagpaliban. Kinabukasan, umupo ako sa luklukan ng hukom[a] at iniutos kong dalhin ang lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umupo ako sa tribunal.” Ang Griyegong βῆμα ay tumutukoy sa opisyal na luklukan ng hukom o sa plataporma ng hukuman.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνελθόντων
  choice: nang magtipon sila
  rationale: Isinasalin ang aorist genitive absolute bilang likas na sugnay na pamanahon; tumutukoy ang ipinahihiwatig na simuno sa mga nagtipong panig o tagapagsumbong.
- source_word: οὖν
  choice: Kaya
  rationale: Pinananatili ang ugnayang lohikal at pagpapatuloy ng salaysay sa sinabi ni Festo.
- source_word: ἐνθάδε
  choice: rito
  rationale: Likas at tuwirang katumbas ng pang-abay na tumutukoy sa lugar na malapit sa nagsasalita.
- source_word: ἀναβολὴν μηδεμίαν ποιησάμενος
  choice: hindi ako nagpaliban
  rationale: Likas na Filipino para sa idyomang nangangahulugang hindi ipinagpaliban o inantala ang paglilitis.
- source_word: τῇ ἑξῆς
  choice: Kinabukasan
  rationale: Maikli at natural na salin ng temporal na pariralang tumutukoy sa sumunod na araw.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: umupo ako sa luklukan ng hukom
  rationale: Pinananatili ang kongkretong kilos ng pag-upo at ang opisyal na hudisyal na kahulugan ng βῆμα, sa halip na gawing pangkalahatang pagharap lamang sa hukuman.
- source_word: ἐκέλευσα
  choice: iniutos ko
  rationale: Ang pandiwa ay tumutukoy sa pagbibigay ng opisyal na utos sa konteksto ng paglilitis.
- source_word: ἀχθῆναι
  choice: dalhin
  rationale: Ang balintiyak na infinitive ay natural na naipahahayag sa Filipino pagkatapos ng “iniutos kong,” nang hindi idinaragdag ang di-hayag na “papasok.”
- source_word: τὸν ἄνδρα
  choice: ang lalaki
  rationale: Tuwirang pinananatili ang pagtukoy kay Pablo bilang lalaki, nang hindi idinaragdag ang “inakusahan,” na ipinahihiwatig lamang ng konteksto.
