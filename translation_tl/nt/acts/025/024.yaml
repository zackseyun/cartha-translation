id: ACT.25.24
reference: Acts 25:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καί φησιν ὁ Φῆστος· Ἀγρίππα βασιλεῦ καὶ πάντες οἱ συμπαρόντες ἡμῖν ἄνδρες, θεωρεῖτε τοῦτον περὶ οὗ ⸀ἅπαν τὸ πλῆθος τῶν Ἰουδαίων ⸀ἐνέτυχόν μοι ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε, ⸀βοῶντες μὴ δεῖν ⸂αὐτὸν ζῆν⸃ μηκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/024.yaml
  text: And Festus says[a], “King Agrippa, and all the men present with us, you see this man, about whom the whole body of the Jews petitioned me, both in Jerusalem and here[b], shouting that he ought no longer to live.”
translation:
  language: tl
  text: At sinabi ni Festo, “Haring Agripa at lahat ng lalaking naririto kasama namin, nakikita ninyo ang taong ito. Tungkol sa kanya ay dumulog sa akin ang buong pangkat ng mga Judio[a], kapuwa sa Jerusalem at dito, at sumisigaw na hindi na siya dapat mabuhay[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang buong karamihan ng mga Judio.” Kolektibo ang pananalita sa Griyego at ibinubuod nito ang paglalarawan ni Festo sa mga tumututol; hindi nito kailangang tukuyin ang bawat Judio nang walang eksepsyon.
    reason: lexical_alternative
  - marker: b
    text: O “na hindi na siya dapat pang mabuhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: sinabi
  rationale: Bagaman pangkasalukuyan ang anyo ng pandiwa bilang historical present, ang pangnagdaang “sinabi” ang likas at marangal na salaysay sa modernong Tagalog.
- source_word: συμπαρόντες ἡμῖν ἄνδρες
  choice: lahat ng lalaking naririto kasama namin
  rationale: Pinananatili ang tiyak na pagtukoy sa mga lalaking dumalo at ang diwa ng sama-samang pagkanaroroon.
- source_word: θεωρεῖτε τοῦτον
  choice: nakikita ninyo ang taong ito
  rationale: Likas na Tagalog na pagtawag-pansin sa taong nasa harap ng kapulungan, nang hindi gumagamit ng makalumang pananalita.
- source_word: ἅπαν τὸ πλῆθος τῶν Ἰουδαίων
  choice: ang buong pangkat ng mga Judio
  rationale: Ipinahahayag ang kolektibong paglalarawan ni Festo nang hindi kinakailangang ipakahulugang bawat indibiduwal na Judio ay kabilang.
- source_word: ἐνέτυχόν μοι
  choice: dumulog sa akin
  rationale: Ang “dumulog” ay natural ngunit may pormal at legal na himig para sa paglapit na may kahilingan.
- source_word: ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε
  choice: kapuwa sa Jerusalem at dito
  rationale: Malinaw na tinutumbasan ang ugnayang τε … καί at ang pagtukoy sa kasalukuyang lugar ni Festo.
- source_word: βοῶντες
  choice: sumisigaw
  rationale: Pinananatili ang malakas at mapilit na paraan ng kanilang pagsasalita.
- source_word: μὴ δεῖν αὐτὸν ζῆν μηκέτι
  choice: na hindi na siya dapat mabuhay
  rationale: Pinananatili ang diwa ng ipinipilit na pangangailangan o nararapat, nang hindi ito ginagawang tahasang pormula ng hatol na kamatayan.
theological_decisions:
- issue: Pagtukoy sa “mga Judio” sa isang salungatang legal
  choice: Panatilihin ang “mga Judio” at ilarawan sila bilang isang kolektibong pangkat ayon sa sinabi ni Festo.
  alternative: “mga pinunong Judio” o “lahat ng Judio”
  rationale: Tahasan sa Griyego ang τῶν Ἰουδαίων, kaya hindi ito dapat paliitin sa mga pinuno lamang. Gayunman, ang πλῆθος at ang retorikal na pagbubuod ni Festo ay hindi kailangang unawain bilang pahayag tungkol sa bawat Judio nang walang eksepsyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “dumulog” upang mapanatili ang pormal na legal na tagpo, habang ang “sumisigaw” ay nagpapanatili sa tindi ng orihinal. Inilagay ang mga panandang talababa sa mismong mga pariralang kanilang ipinaliliwanag.
