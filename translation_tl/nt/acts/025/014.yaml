translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga usapin” upang mapanatili ang lawak ng idyomang Griyego, habang inilagay sa talababa ang mas tiyak na legal na pagbasa. Inilipat ang mga pananda ng talababa sa mga salitang talagang tinutukoy ng bawat paliwanag.
