lexical_decisions:
- source_word: πλείους ἡμέρας
  choice: ilang araw
  rationale: Sa temporal na gamit, ang parirala ay tumutukoy sa ilang araw o maraming araw na pananatili. Ang “ilang araw” ay likas sa makabagong Tagalog at hindi nagpapilit ng mahigpit na paghahambing.
- source_word: διέτριβον
  choice: nananatili
  rationale: Ipinahihiwatig ng pandiwa ang paggugol ng panahon o pananatili sa isang lugar; ang aspektong nagaganap ng “nananatili” ay angkop kasunod ng ὡς.
- source_word: ἀνέθετο
  choice: inilahad
  rationale: Ipinapakita ng gitnang anyo na iniharap ni Festo ang bagay sa hari upang isaalang-alang, hindi lamang na nagbigay siya ng impormasyon.
- source_word: τὰ κατὰ τὸν Παῦλον
  choice: ang mga usapin tungkol kay Pablo
  rationale: Pinananatili nito ang malawak na saklaw ng idyoma—mga bagay o usaping may kinalaman kay Pablo—nang hindi tiyak na nililimitahan ito sa pormal na kasong legal.
- source_word: Ἀνήρ τίς
  choice: May isang lalaki
  rationale: Likas itong panimula sa Tagalog para sa isang tiyak ngunit hindi pa pinapangalanang tao.
- source_word: καταλελειμμένος
  choice: iniwan
  rationale: Ang perpektong balintiyak na participle ay nagsasaad na iniwan siya ni Felix at nananatili ang bunga ng pagkakaawang iyon.
- source_word: δέσμιος
  choice: nakabilanggo
  rationale: Natural nitong ipinahahayag sa Tagalog ang patuloy na kalagayan niya bilang bilanggo, nang hindi idinaragdag na siya ay pinabayaan o iniwan sa isang partikular na gusali.
- source_word: βασιλεῖ
  choice: sa hari
  rationale: Tulad ng Griyego, pinananatili ang titulo at hindi inuulit ang pangalang Agripa, na malinaw na sa konteksto.
