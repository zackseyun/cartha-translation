  rationale: Pinalitan ang di-gaanong natural na «ginawang anumang» ng «nagawang,» upang maging malinaw na walang kilos siyang nagawa na nararapat sa kamatayan. Ginamit ang «siya mismo ang umapela» upang likas na maipahayag ang diin ng αὐτοῦ ... τούτου. Pinanatili ang pananahilan ng genitive absolute, ang panghukuman at marangal na rehistro, at ang lexical na alternatibo para sa Σεβαστός.
