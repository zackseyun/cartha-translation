  yaml_path: translation/nt/acts/025/025.yaml
  text: But I found that he had done nothing deserving death; and because he himself appealed to the Emperor[a], I decided to send him.
translation:
  language: tl
  text: Ngunit nalaman ko na wala siyang nagawang karapat-dapat sa kamatayan. At dahil siya mismo ang umapela sa Emperador[a], nagpasiya akong ipadala siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Augusto.” Ang titulong Griyego na Σεβαστός ay tumutukoy rito sa Romanong emperador.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελαβόμην
  choice: natuklasan ko
  rationale: Sa kontekstong panghukuman, tumutukoy ito sa naging pasiya o natuklasan ni Festo matapos suriin ang usapin. Likas sa Filipino ang “natuklasan ko” at hindi nito pinalalabis ang pormalidad ng legal na hatol.
- source_word: μηδὲν ἄξιον ... θανάτου
  choice: walang ... anumang karapat-dapat sa kamatayan
  rationale: Malapit ito sa anyo ng Griyego at malinaw na nagsasaad na walang ginawa ang lalaki na nararapat tumbasan ng kamatayan, nang hindi ipinapasok ang mas tiyak na pariralang “parusang kamatayan.”
- source_word: πεπραχέναι
  choice: ginawa
  rationale: Ang πράσσω rito ay tumutukoy sa nagawang kilos. Ang “ginawa” ay malawak, natural, at sapat na nabibigyan ng panghukumang diwa ng nakapaligid na pangungusap.
- source_word: αὐτοῦ δὲ τούτου ἐπικαλεσαμένου
  choice: dahil siya mismo ay umapela
  rationale: Ipinahahayag ng genitive absolute ang pangyayaring naging dahilan ng pasiya ni Festo. Pinananatili ng “siya mismo” ang diin ng αὐτοῦ ... τούτου.
- source_word: τὸν Σεβαστόν
  choice: Emperador
  rationale: Ang Σεβαστός ay titulong Griyego na katumbas ng Latin na Augustus at dito ay tumutukoy sa Romanong emperador bilang pinuno, hindi sa makasaysayang si Augusto lamang.
- source_word: ἔκρινα
  choice: nagpasiya ako
  rationale: Ipinahahayag nito ang opisyal at praktikal na pasiya ni Festo. Natural at malinaw sa modernong Filipino ang “nagpasiya.”
- source_word: πέμπειν
  choice: ipadadala siya
  rationale: Ang infinitive ay karugtong ng ἔκρινα; kailangang ipahayag sa Filipino ang ipinahihiwatig na layon na “siya.”
