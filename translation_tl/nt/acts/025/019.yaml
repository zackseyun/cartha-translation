  text: ζητήματα δέ τινα περὶ τῆς ἰδίας δεισιδαιμονίας εἶχον πρὸς αὐτὸν καὶ περί τινος Ἰησοῦ τεθνηκότος, ὃν ἔφασκεν ὁ Παῦλος ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/019.yaml
  text: Rather[a], they had certain disputes with him about their own religion and about a certain Jesus who had died, whom Paul claimed to be alive.
translation:
  language: tl
  text: Sa halip, ang mayroon sila laban sa kanya ay ilang usapin tungkol sa sarili nilang relihiyon[a] at tungkol sa isang Jesus na namatay, na iginiit ni Pablo na buhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sarili nilang pamahiin.” Ang salitang Griyego ay maaaring tumukoy nang neutral sa relihiyon o, mula sa pananaw ng isang tagalabas, nang mas mapanlibak sa pamahiin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: ilang usapin
  rationale: Tumutukoy ito sa mga puntong pinagtatalunan. Sa konteksto ng paglalahad ni Festo tungkol sa kaso, likas sa Filipino ang “mga usapin,” at ipinakikita ng pariralang “mga paratang nila laban sa kanya” na hindi lamang ito mga neutral na tanong.
- source_word: δέ
  choice: Sa halip
  rationale: 'Ipinakikita ng pang-ugnay ang pagtutuwid na kaibahan sa naunang pahayag: sa halip na mga krimeng inaasahan ni Festo, mga usaping panrelihiyon ang kanilang iniharap.'
- source_word: τινα
  choice: ilang
  rationale: Pinananatili nito ang di-tiyak na pagtukoy ng Griyego nang natural sa makabagong Filipino.
- source_word: περὶ τῆς ἰδίας δεισιδαιμονίας
  choice: hinggil sa sarili nilang relihiyon[a]
  rationale: Maaaring neutral o mapanlibak ang δεισιδαιμονία. Ang “relihiyon” ang malinaw at hindi labis na mapanlait na salin, samantalang pinananatili ng “sarili nilang” ang pagdistansiya ni Festo. Itinatala sa talababa ang posibleng negatibong diwa.
- source_word: εἶχον πρὸς αὐτόν
  choice: ang mga paratang nila laban sa kanya ay tungkol sa
  rationale: Ipinahihiwatig ng idyoma na may mga usaping iniharap nila laban kay Pablo. Ang pagbubuo ay natural sa Filipino at angkop sa legal na konteksto, ngunit hindi nito ginagawang tiyak na krimen ang mga usapin.
- source_word: καὶ περί τινος Ἰησοῦ
  choice: at tungkol sa isang Jesus
  rationale: Pinananatili ng “isang Jesus” ang malamig at di-pamilyar na paraan ng pagtukoy ni Festo sa taong tinutukoy.
- source_word: τεθνηκότος
  choice: na namatay
  rationale: Natural nitong ipinahahayag ang pagkamatay na nasa likod ng kasalukuyang kalagayang ipinapalagay ni Festo, at malinaw itong itinatambal sa pahayag na buhay siya.
- source_word: ὃν ἔφασκεν ὁ Παῦλος ζῆν
  choice: ngunit iginiit ni Pablo na buhay
  rationale: Ang “iginiit” ay naghahatid sa φάσκω bilang iniulat na pahayag na hindi pinagtitibay ni Festo. Ang “buhay” ay tuwirang nagpapanatili sa nilalaman ng ζῆν; ang “ngunit” ay natural na nagpapakita ng kaibahan sa “namatay.”
theological_decisions:
- issue: Pagpapakahulugan sa δεισιδαιμονία sa pananalita ni Festo
  choice: relihiyon
  alternative: pamahiin
  rationale: Bilang isang Romanong tagalabas, maaaring may pagdistansiya o bahagyang paghamak sa salita ni Festo, ngunit hindi kinakailangang tahasang mapanlait ito. Iniiwasan ng “relihiyon” ang labis na pagpapasya, habang inilalahad sa talababa ang alternatibong diwa.
- issue: Paglalahad sa pahayag tungkol sa muling pagkabuhay
  choice: iginiit ni Pablo na buhay
  alternative: sinabi ni Pablo na buhay
  rationale: Ipinakikita nitong ulat ito ni Festo tungkol sa paninindigan ni Pablo, hindi tuwirang pagpapatibay ng tagapagsalaysay sa mismong sugnay. Hindi rin nito itinatanggi ang muling pagkabuhay na pinagtitibay sa ibang bahagi ng aklat.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sa halip” upang maiugnay ang talata sa naunang kaibahan, “isang Jesus” upang mapanatili ang distansiya ni Festo, at isang talababa upang hindi ikubli ang saklaw ng kahulugan ng δεισιδαιμονία.
