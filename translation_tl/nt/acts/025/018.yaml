  text: Concerning him[a], when the accusers stood up, they brought no charge of the evil things that I was suspecting,
translation:
  language: tl
  text: Nang tumayo ang mga nag-aakusa tungkol sa kanya, wala silang iniharap na paratang tungkol sa masasamang bagay[a] na inaasahan kong ibibintang nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anumang krimeng inaasahan kong ibibintang nila.” Mas literal na “masasamang bagay” ang salitang Griego; maaari itong tumukoy sa maling gawain sa pangkalahatan, hindi lamang sa mga krimeng pormal na itinakda ng batas.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: sa kanya
  rationale: Tumutukoy kay Pablo bilang taong pinag-uusapan; likas sa Filipino ang paglalagay nito kasunod ng “nag-aakusa.”
- source_word: σταθέντες
  choice: Nang tumayo
  rationale: Isinasalin ang aorist participle bilang sugnay na panahunan at pinananatili ang larawan ng pagtayo ng mga tagapag-akusa upang ilahad ang kaso.
- source_word: οἱ κατήγοροι
  choice: ang mga nag-aakusa
  rationale: Direkta at madaling maunawaang katawagan sa mga naghaharap ng paratang sa legal na tagpuan.
- source_word: οὐδεμίαν αἰτίαν ἔφερον
  choice: wala silang iniharap na paratang
  rationale: Ang idyomang legal ay tumutukoy sa paghaharap ng isang paratang; natural sa modernong Filipino ang “iniharap na paratang.”
- source_word: ὧν
  choice: tungkol sa ... na
  rationale: Ipinakikita ang ugnayan ng paratang sa uri ng masasamang gawa na inaasahan ni Festo.
- source_word: ἐγὼ ὑπενόουν
  choice: na inaakala kong ginawa niya
  rationale: Ipinahahayag ang dating palagay o hinala ni Festo sa natural na Filipino; ang “ginawa niya” ay nililinaw ng legal at semantikong konteksto ng masasamang gawa.
- source_word: πονηρῶν
  choice: masasamang gawa
  rationale: Pinananatili ang malawak na diwa ng πονηρῶν bilang masasamang bagay o gawain nang hindi ito nililimitahan sa pormal na krimen.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw na himig legal. Ginamit ang “masasamang gawa” upang maging natural habang pinananatili ang mas malawak na saklaw ng Griego; inilagay sa talababa ang mas tiyak na alternatibong “krimen.”
