  naturalness: Natural at malinaw sa modernong Filipino ang “humihingi sila sa kanya ng isang pabor” at “habang naghahanda sila ng pananambang.” Mas maayos ang pandiwang “ipasundo” bilang alternatibo sa “ipatawag” kaysa sa dating paliwanag na “ipadala niya upang dalhin.”
  terminology: Ang “pabor laban kay Pablo,” “ipatawag,” “pananambang,” at “patayin” ay angkop at hindi nagdaragdag ng doktrinal o interpretatibong kulay. Pinanatili ang pangalang Pablo para sa kalinawan ng reperensiya.
