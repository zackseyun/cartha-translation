  yaml_path: translation/nt/acts/025/003.yaml
  text: asking a favor against him[a], that he would have him brought to Jerusalem, while setting an ambush to kill him on the way.
translation:
  language: tl
  text: 'at humihingi sila sa kanya ng isang pabor laban kay Pablo: ipatawag niya si Pablo sa Jerusalem,[a] habang naghahanda sila ng pananambang upang patayin siya sa daan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipasundo niya si Pablo upang dalhin sa Jerusalem.” Ang pandiwang Griyego ay maaaring mangahulugang “ipatawag” o “ipasundo/ipakuha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτούμενοι χάριν κατ’ αὐτοῦ
  choice: humihingi sila sa kanya ng pabor laban kay Pablo
  rationale: Likas na Filipino para sa idyomang paghingi ng pabor o konsesyon; tahasang pinangalanan si Pablo upang maiwasan ang malabong sunod-sunod na panghalip sa Filipino, habang pinananatili ang masamang layon ng κατ’ αὐτοῦ.
- source_word: ὅπως μεταπέμψηται αὐτὸν εἰς Ἰερουσαλήμ
  choice: ipatawag niya ito sa Jerusalem
  rationale: Ang μεταπέμπομαι ay maaaring mangahulugang ‘ipatawag’ o ‘ipakuha/ipadala upang dalhin.’ Ang ‘ipatawag’ ay maikli at natural, at pinananatili ang pagkilos ni Festo bilang nag-uutos na dalhin si Pablo.
- source_word: ἐνέδραν ποιοῦντες
  choice: nagbabalak silang tambangan
  rationale: Ipinahahayag nang natural sa Filipino ang paghahanda ng isang pananambang; ang konteksto ay nagpapakitang balak pa lamang itong isagawa.
- source_word: ἀνελεῖν αὐτὸν
  choice: patayin siya
  rationale: Direkta at neutral na katumbas ng infinitibong ἀνελεῖν sa kontekstong ito.
- source_word: κατὰ τὴν ὁδόν
  choice: sa daan
  rationale: Karaniwang modernong Filipino para sa pagpatay na balak isagawa habang naglalakbay.
