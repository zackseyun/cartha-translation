translation_notes:
  register: Modernong Filipino na malinaw at marangal. Hinati sa dalawang sugnay at ginamit ang “Ngunit” upang gawing lantad ang pagkakaiba ng ipinakitang kahilingan at lihim na balak, na likas na ipinahihiwatig ng konteksto. Ang marker na [a] ay inilagay pagkatapos ng buong pariralang tinutukoy nito.
