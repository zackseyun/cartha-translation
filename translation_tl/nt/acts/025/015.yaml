base_translation:
  language: en
  yaml_path: translation/nt/acts/025/015.yaml
  text: Concerning him[a], when I arrived in Jerusalem, the chief priests and the elders of the Jews informed me, asking for a sentence of condemnation against him.
translation:
  language: tl
  text: Tungkol sa kanya, nang dumating ako sa Jerusalem, ipinaalam sa akin ng mga punong pari at ng mga nakatatanda ng mga Judio ang tungkol sa kanya, at humiling sila ng hatol na pagkondena laban sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “humihiling na hatulan siya” o “humihiling ng hatol na laban sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: Tungkol sa kanya
  rationale: Tumutukoy ito kay Pablo at tahasang ipinakikilala ang usaping tinatalakay, gaya ng ayos ng Griyego.
- source_word: γενομένου μου εἰς Ἱεροσόλυμα
  choice: nang dumating ako sa Jerusalem
  rationale: Likas na ipinahahayag sa modernong Tagalog ang panahong kaugnayan at ang pagdating sa isang lugar.
- source_word: ἐνεφάνισαν
  choice: ipinaalam sa akin ... ang usapin
  rationale: Sa kontekstong legal at administratibo, nangangahulugan itong magbigay-alam o magharap ng isang bagay sa isang awtoridad. Idinagdag ang 'ang usapin' bilang likas na pantulong sa Tagalog, na ang tinutukoy ay naipakilala na sa 'Tungkol sa kanya.'
- source_word: οἱ ἀρχιερεῖς
  choice: mga punong pari
  rationale: Karaniwang tawag sa mga nangungunang awtoridad na pari, hindi sa iisang pinakapunong pari lamang.
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: matatandang pinuno ng mga Judio
  rationale: Ipinahahayag ng 'matatandang pinuno' ang tungkuling pampamayanan ng πρεσβύτεροι at iniiwasang unawain lamang sila bilang matatanda sa edad.
- source_word: αἰτούμενοι
  choice: hiniling nilang
  rationale: Malinaw na ipinahahayag ang pormal na kahilingang kasabay ng pagbibigay-alam kay Festo.
- source_word: κατ’ αὐτοῦ καταδίκην
  choice: hatulan siyang may sala
  rationale: Natural na pananalitang legal sa Tagalog para sa paghingi ng mapanghatol na pasiya laban sa isang tao, habang pinananatili ang diwa ng judicial condemnation.
