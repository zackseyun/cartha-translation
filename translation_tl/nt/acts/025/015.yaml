revisions:
- from: Tungkol sa kanya, nang dumating ako sa Jerusalem, ipinaalam sa akin ng mga punong pari at ng matatandang pinuno ng mga Judio ang usapin, at hiniling nilang hatulan siyang may sala.[a]
  to: Tungkol sa kanya, nang dumating ako sa Jerusalem, ipinaalam sa akin ng mga punong pari at ng mga nakatatanda ng mga Judio ang tungkol sa kanya, at humiling sila ng hatol na pagkondena laban sa kanya.[a]
  rationale: Pinalitan ang “matatandang pinuno” ng “mga nakatatanda” upang hindi magdagdag ng di-tahasang kahulugan. Pinalitan ang “ang usapin” ng “ang tungkol sa kanya” upang maipakita nang tuwiran ang περὶ οὗ. Inayos ang huling parirala bilang “hatol na pagkondena laban sa kanya” upang mas malapit na mailarawan ang legal na pangngalang καταδίκην.
