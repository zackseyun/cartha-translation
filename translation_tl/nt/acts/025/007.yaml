base_translation:
  language: en
  yaml_path: translation/nt/acts/025/007.yaml
  text: And when he arrived[a], the Jews who had come down from Jerusalem stood around him[b], bringing many serious charges that they were not able to prove.
translation:
  language: tl
  text: Pagdating niya, tumayo sa palibot niya[a] ang mga Judio[b] na bumaba mula sa Jerusalem. Marami at malulubhang paratang ang iniharap nila laban sa kanya, ngunit hindi nila mapatunayan ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinalibutan siya.” Maaaring bigyang-diin ng pandiwang Griyego ang pagtayo sa paligid ng isang tao; sa tagpong legal, maaari itong magpahiwatig ng paggigiit o paglalagay ng presyon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga taga-Judea.” Dito, ginamit ang “mga Judio” sapagkat ang tinutukoy ay mga Judiong tagapagparatang na mula sa Jerusalem, hindi lamang mga naninirahan sa Judea.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενομένου δὲ αὐτοῦ
  choice: Pagdating niya
  rationale: Ang genitive absolute ay nagsasaad ng panahong pangyayari. Likas sa Tagalog ang “Pagdating niya,” at pinananatili nito ang panghalip ng Griyego nang hindi inuulit ang pangalan mula sa konteksto.
- source_word: περιέστησαν αὐτὸν
  choice: tumayo sa palibot niya
  rationale: Ipinahihiwatig ng pandiwa ang pagtayo sa paligid o pagpalibot sa isang tao. Pinananatili ng pariralang ito ang pisikal na tagpo at hindi nito labis na dinaragdagan ang pahiwatig ng pananakot.
- source_word: οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι
  choice: ang mga Judio na bumaba mula sa Jerusalem
  rationale: Maaaring tumukoy ang Ἰουδαῖοι sa mga Judio o mga taga-Judea. Sa konteksto, sila ang mga Judiong tagapagparatang mula sa Jerusalem. Ang “bumaba” ay nagpapanatili sa karaniwang heograpikong paglalarawan ng paglalakbay mula sa Jerusalem.
- source_word: πολλὰ καὶ βαρέα αἰτιώματα
  choice: Marami at malulubhang paratang
  rationale: Ang αἰτιώματα ay mga pormal na sakdal o paratang, at ang βαρέα ay nagpapahayag ng bigat o tindi. Ang “malulubhang paratang” ay malinaw at angkop sa tagpong legal.
- source_word: καταφέροντες
  choice: iniharap nila laban sa kanya
  rationale: Sa kontekstong legal, ang participle ay tumutukoy sa paghaharap o pagsasampa ng mga paratang. Tahasang isinama ang “laban sa kanya” upang maging malinaw at natural sa Tagalog.
- source_word: ἃ οὐκ ἴσχυον ἀποδεῖξαι
  choice: ngunit hindi nila mapatunayan ang mga iyon
  rationale: Ang ἰσχύω na may infinitive ay nagpapahayag ng kakayahan, at ang ἀποδεῖξαι ay “patunayan” o “ipakita bilang totoo.” Ang “hindi nila mapatunayan” ay tuwiran at natural; ipinakikita ng “ngunit” ang malinaw na pagsalungat sa bigat ng kanilang mga paratang.
