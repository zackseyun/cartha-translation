  to: Ngunit sumagot ang kumander, “Malaking halaga ang ibinayad ko upang makamit ang pagkamamamayang ito.”[a] Sinabi naman ni Pablo, “Ngunit ako'y ipinanganak na mamamayan.”[b]
  rationale: Pinalitan ang hindi idiomatikong “isinilang na taglay iyon” ng “ipinanganak na mamamayan.” Pinananatili nito ang ipinahihiwatig na bagay ng γεγέννημαι—ang pagkamamamayan—at ang mariing kaibahan sa kumander na nagkamit nito sa malaking halaga. Inayos din ang talababa upang tumugma sa literal na ellipsis ng Griyego.
