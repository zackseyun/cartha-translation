  text: But the tribune answered[a], “I acquired this citizenship for a large sum.” But Paul said[b], “But I was even born with it.”
translation:
  language: tl
  text: Ngunit sumagot ang kumander, “Malaking halaga ang ibinayad ko upang makamit ang pagkamamamayang ito.”[a] Sinabi naman ni Pablo, “Ngunit ako'y ipinanganak na mamamayan.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Nakamit ko ang pagkamamamayang ito sa pamamagitan ng malaking halaga ng salapi.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “Ngunit ako naman ay ipinanganak na nga,” na ang pagkamamamayan ay nauunawaan mula sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: kumander
  rationale: Tumutukoy sa Romanong opisyal na namumuno sa humigit-kumulang isang libong kawal. Mas madaling maunawaan sa modernong Tagalog ang “kumander” kaysa sa teknikal na “tribuno,” habang nananatili ang ranggong militar sa konteksto.
- source_word: πολλοῦ κεφαλαίου
  choice: malaking halaga ang ibinayad ko
  rationale: Idyomatikong tumutukoy ang parirala sa malaking halagang salapi. Likas sa Tagalog ang ganitong ayos at malinaw nitong ipinapakita ang magastos na pagkamit nang hindi sinasabing higit sa ipinahihiwatig ng konteksto.
- source_word: τὴν πολιτείαν ταύτην
  choice: ang pagkamamamayang ito
  rationale: Legal na katayuan bilang mamamayang Romano ang tinutukoy, hindi pangkalahatang pamumuhay pampolitika. Pinananatili ng “pagkamamamayan” ang di-tahasang pagtukoy sa Roma mula sa konteksto.
- source_word: ἐκτησάμην
  choice: upang makamit
  rationale: Ang pandiwang nasa gitnang tinig ay nangangahulugang nagtamo o nagkamit para sa sarili. Hindi ginamit ang mas tiyak na “binili” upang hindi labis na tukuyin ang mekanismo, bagaman malinaw na may ibinayad na salapi.
- source_word: καὶ γεγέννημαι
  choice: isinilang na taglay iyon
  rationale: Ang perpektong anyo ay nagsasaad na si Pablo ay ipinanganak sa katayuang iyon at taglay pa rin niya ito. Sinasalamin ng “na” ang mariing kaibahan ng καί, at ang “iyon” ay likas na nagpupuno sa pagkamamamayang ipinahihiwatig lamang sa Griyego.
- source_word: δέ
  choice: ngunit / naman
  rationale: Nagpapakita ito ng banayad na pagsalungat at pagpapatuloy sa palitan ng salita. Ginamit ang “ngunit” sa malinaw na kaibahan at “naman” upang maging natural ang daloy ng ikalawang sugnay.
- source_word: ἔφη
  choice: sinabi
  rationale: Payak na pandiwa ng pagsasalita ito; ang “sinabi” ay natural at hindi nagdaragdag ng lakas na wala sa orihinal.
