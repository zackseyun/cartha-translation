  text: καὶ νῦν τί μέλλεις; ἀναστὰς βάπτισαι καὶ ἀπόλουσαι τὰς ἁμαρτίας σου ἐπικαλεσάμενος τὸ ὄνομα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/016.yaml
  text: And now why are you waiting? Rise[a], be baptized, and wash away your sins[b], calling on his name.
translation:
  language: tl
  text: At ngayon, bakit ka pa naghihintay? Tumayo ka, magpabautismo, at hugasan ang iyong mga kasalanan, na tumatawag sa kanyang pangalan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “na tumatawag sa kanyang pangalan” ay maaari ring unawain bilang “sa pamamagitan ng pagtawag sa kanyang pangalan.” Hindi lubusang tinutukoy ng Griyego kung ang pagtawag ay kasabay na kilos o paraan.
    reason: alternative_reading
lexical_decisions:
- source_word: τί μέλλεις
  choice: bakit ka pa naghihintay
  rationale: Sa kontekstong ito, ang tanong ay isang paghimok na huwag nang magpaliban, hindi tanong tungkol sa gagawin sa hinaharap. Likas at malinaw ito sa modernong Tagalog.
- source_word: ἀναστὰς
  choice: Tumayo ka
  rationale: Ang aorist participle ay kaakibat ng mga sumusunod na pautos; ang tahasang pautos ang natural na katumbas sa Tagalog at nagpapanatili sa agarang tono.
- source_word: βάπτισαι
  choice: magpabautismo
  rationale: Ipinahahayag ng anyong middle imperative ang pagpapabautismo ng kausap. Ang “magpabautismo” ay natural sa Tagalog at hindi nangangailangang tukuyin kung sino ang magbabautismo.
- source_word: ἀπόλουσαι
  choice: hugasan
  rationale: Tuwirang inilalarawan ng pandiwa ang paghuhugas o pag-aalis ng mga kasalanan. Sa pariralang “hugasan ang iyong mga kasalanan,” malinaw ang metaporang nasa Griyego nang hindi dinaragdagan ang kahulugan.
- source_word: τὰς ἁμαρτίας σου
  choice: ang iyong mga kasalanan
  rationale: Tuwirang pinananatili nito ang karaniwang kahulugan ng ἁμαρτία at ang panghalip na isahan.
- source_word: ἐπικαλεσάμενος
  choice: habang tumatawag sa
  rationale: Ikinakabit nito ang participle sa mga pautos nang hindi tiyakang nagpapasya kung ito ay paraan, kasabay na kilos, o kaugnay na pangyayari. Ipinaliliwanag sa talababa ang maaari ring mas instrumentong pagbasa.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: kanyang pangalan
  rationale: Pinananatili ang panghalip na αὐτοῦ sa halip na palitan ito ng tahasang titulong “Panginoon,” bagaman malinaw sa konteksto ang tinutukoy.
theological_decisions:
- issue: Ugnayan ng bautismo, paghuhugas ng mga kasalanan, at pagtawag sa kanyang pangalan
  choice: Pinananatili ang pagkakasunod-sunod ng mga pautos at ang bahagyang di-tiyak na ugnayan ng participle sa mga ito.
  alternative: Maaaring unawain na ang bautismo ang tiyak na paraan ng paghuhugas ng mga kasalanan, na ang pagtawag sa kanyang pangalan ang paraan nito, o na ang buong pahayag ay isang magkakaugnay na pangyayari ng pagsisimula sa pananampalataya.
  rationale: Hindi nilulutas ng kayarian ng Griyego ang lahat ng pinagtatalunang teolohikal na ugnayan. Ang salin at talababa ay nagpapanatili sa tensiyon sa halip na pumili ng isang denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “magpabautismo” bilang natural na katumbas ng middle imperative at iniwasang gawing tahasan ang “Panginoon” sapagkat panghalip ang nasa tekstong Griyego.
