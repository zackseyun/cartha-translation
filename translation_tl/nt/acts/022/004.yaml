  text: I persecuted this Way to the death[a], binding and delivering both men and women into prisons[b],
translation:
  language: tl
  text: Inusig ko ang Daang ito hanggang sa kamatayan,[a] habang iginagapos ko at inihahatid sa mga bilangguan ang mga lalaki at babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hanggang sa ikamatay.” Ipinahihiwatig ng parirala ang sukdulang lawak o tindi ng pag-uusig, na umaabot hanggang kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην τὴν ὁδὸν
  choice: ang Daang ito
  rationale: Literal na nangangahulugang “ang daang ito,” ngunit sa Mga Gawa ay ginagamit bilang tawag sa kilusang Kristiyano. Ang malaking titik sa “Daan” ay nagpapahiwatig ng ganitong gamit nang hindi pinapalitan ang larawan ng orihinal.
- source_word: ἐδίωξα
  choice: Inusig ko
  rationale: Sa konteksto, tumutukoy ito sa mapanlabang pagtugis at pagpapahirap sa mga mananampalataya; natural at tiyak dito ang “inusig.”
- source_word: ἄχρι θανάτου
  choice: hanggang sa kamatayan
  rationale: Pinananatili nito ang saklaw at nakamamatay na tindi ng pag-uusig, nang hindi tiyakang sinasabing si Pablo mismo ang pumatay sa kanila.
- source_word: δεσμεύων
  choice: iginagapos
  rationale: Pinananatili ang kongkretong larawan ng literal na paggapos sa halip na agad itong ipakahulugang “inaaresto.”
- source_word: παραδιδοὺς εἰς φυλακὰς
  choice: ipinapasok sa mga bilangguan
  rationale: Natural sa modernong Tagalog at malinaw na nagpapahayag ng paghahatid o pagbibigay sa kustodiya upang makulong; pinananatili rin ang maramihang φυλακάς.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: ang mga lalaki at mga babae
  rationale: Tahasang pinananatili ang diin na kapuwa lalaki at babae ang saklaw ng pag-uusig.
theological_decisions:
- issue: Kung ang ἡ ὁδός ay karaniwang pangngalan lamang o katawagan sa kilusang Kristiyano
  choice: “ang Daang ito,” na may malaking titik
  alternative: “ang daang ito” o “ang kilusang ito”
  rationale: Madalas gamitin sa Mga Gawa ang “Daan” bilang kinikilalang katawagan sa pananampalataya o kilusang Kristiyano. Pinananatili ng salin ang mismong metapora at ang malamang na katawagang diwa nito.
- issue: Kung ang ἄχρι θανάτου ay nangangahulugang personal na pagpatay ni Pablo o sukdulang saklaw ng kanyang pag-uusig
  choice: “hanggang sa kamatayan”
  alternative: “na nauwi sa kamatayan” o “hanggang ipapatay sila”
  rationale: Ang parirala ay nagpapahayag ng sukdulan at nakamamatay na tindi, ngunit hindi nito tahasang nililinaw ang eksaktong papel ni Pablo sa bawat kamatayan; pinananatili ng salin ang tensiyong iyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “bilangguan” sa halip na mas kolokyal na “kulungan,” at pinanatili ang kongkretong “iginagapos.”
