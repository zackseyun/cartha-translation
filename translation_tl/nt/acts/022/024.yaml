  text: ἐκέλευσεν ⸂ὁ χιλίαρχος εἰσάγεσθαι αὐτὸν⸃ εἰς τὴν παρεμβολήν, ⸀εἴπας μάστιξιν ἀνετάζεσθαι αὐτὸν ἵνα ἐπιγνῷ δι’ ἣν αἰτίαν οὕτως ἐπεφώνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/024.yaml
  text: The tribune ordered him to be brought into the barracks[a], saying that he should be examined by scourging[b], so that he might find out for what reason they were shouting against him like this.
translation:
  language: tl
  text: Iniutos ng kumandante na dalhin si Pablo sa kuwartel[a] at siyasatin sa pamamagitan ng paghagupit[b], upang malaman niya kung bakit ganoon na lamang silang sumisigaw laban sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kampo” o “kuta.” Dito, tumutukoy ang salita sa himpilang militar ng mga Romano sa Jerusalem.
    reason: cultural_note
  - marker: b
    text: O, “tanungin sa pamamagitan ng paghagupit.” Pinagsasama ng Griyego ang pagsisiyasat at ang tahasang paraang ginamit—ang paghagupit.
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: kumandante
  rationale: Tumutukoy ito sa mataas na opisyal ng hukbong Romano. Ang “kumandante” ay malinaw at natural sa modernong Filipino nang hindi nag-aangkin ng eksaktong katumbas na ranggo sa kasalukuyan.
- source_word: εἰσάγεσθαι αὐτὸν
  choice: dalhin si Pablo
  rationale: 'Pinananatili nito ang diwang pasibo: ibang mga tao ang magdadala sa kanya sa loob. Ginamit ang pangalang “Pablo” upang maging malinaw ang tinutukoy sa isang talatang binabasa nang hiwalay.'
- source_word: παρεμβολή
  choice: kuwartel
  rationale: Sa konteksto ng Jerusalem, tumutukoy ang salita sa himpilan o tirahan ng mga sundalong Romano; natural at tiyak dito ang “kuwartel.”
- source_word: εἴπας
  choice: at
  rationale: Ang participle ay nagpapakilala sa karagdagang ipinag-utos ng kumandante. Sa Filipino, natural na isama ito sa unang utos sa pamamagitan ng “at” kaysa literal na “na sinasabi.”
- source_word: μάστιξιν ἀνετάζεσθαι
  choice: siyasatin sa pamamagitan ng paghagupit
  rationale: Pinananatili ang wikang pang-imbestigasyon ng ἀνετάζεσθαι at tahasang ipinapakita ang malupit na paraang ipinahihiwatig ng instrumental na μάστιξιν.
- source_word: ἵνα ἐπιγνῷ
  choice: upang malaman niya
  rationale: Malinaw na ipinahahayag ang layunin ng kumandante na matuklasan ang dahilan ng sigawan.
- source_word: δι’ ἣν αἰτίαν
  choice: kung bakit
  rationale: Natural itong Filipino para sa pagtatanong sa dahilan at hindi nito ipinapasok ang mas teknikal na ideya ng isang pormal na sakdal.
- source_word: οὕτως ἐπεφώνουν αὐτῷ
  choice: gayon na lamang ang sigaw ng mga tao laban sa kanya
  rationale: Ipinahahayag ng “gayon na lamang” ang demonstratibo at matinding paraan ng pagsigaw, habang pinananatili ng “laban sa kanya” ang mapanlabang diwa at ng pariralang pandiwa ang nagpapatuloy na sigawan.
