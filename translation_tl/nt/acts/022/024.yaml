  verdict: revise
  source_fidelity: Tumpak na naihahatid ang utos ng χιλίαρχος na dalhin ang lalaki sa kuwartel at siyasatin sa pamamagitan ng paghagupit. Gayunman, ang “gayon na lamang ang sigaw ng mga tao” ay nominal na pagpapahayag at bahagyang pinahihina ang imperpektong pandiwa ἐπεφώνουν (“patuloy silang sumisigaw”). Mas malapit at natural ang pandiwang “sumisigaw.”
  naturalness: Malinaw at angkop ang register. Mas dumadaloy sa modernong Filipino ang “kung bakit ganoon na lamang silang sumisigaw laban sa kanya” kaysa sa “kung bakit gayon na lamang ang sigaw ng mga tao laban sa kanya.”
  terminology: Ang “kumandante,” “kuwartel,” “siyasatin,” at “paghagupit” ay angkop. Pinananatili ng “siyasatin” ang diwang pag-iimbestiga, at hindi ikinukubli ng “paghagupit” ang marahas na paraang tahasang nasa Griyego.
