base_translation:
  language: en
  yaml_path: translation/nt/acts/022/022.yaml
  text: They were listening to him up to this statement, and they raised their voices, saying, “Take such a man away from the earth, for it was not fitting for him to live.”
translation:
  language: tl
  text: Hanggang sa bahaging ito ng kanyang sinabi ay nakikinig sila sa kanya, ngunit itinaas nila ang kanilang mga tinig at sumigaw, “Alisin sa ibabaw ng lupa ang taong tulad nito![a] Sapagkat hindi nararapat na mabuhay siya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas idiomatiko, “Ipatay ang taong tulad nito!” Ipinahihiwatig ng sigaw na ito ang kahilingan nilang patayin siya.
    reason: lexical_alternative
  - marker: b
    text: O “Sapagkat hindi siya dapat mabuhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: Nakikinig sila
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang nagpapatuloy na pakikinig sa nakaraang tagpo; natural itong naipapahayag sa Filipino sa pamamagitan ng “nakikinig.”
- source_word: ἄχρι τούτου τοῦ λόγου
  choice: hanggang sa pahayag na ito
  rationale: Ang λόγος dito ay tumutukoy sa partikular na sinabi o punto sa talumpati ni Pablo na naging sanhi ng reaksiyon, hindi lamang sa isang salita.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: itinaas nila ang kanilang mga tinig
  rationale: Pinananatili nito ang larawan ng tekstong Griyego habang malinaw na ipinahihiwatig ang malakas at sama-samang pagsigaw.
- source_word: Αἶρε ἀπὸ τῆς γῆς
  choice: Alisin sa ibabaw ng lupa
  rationale: Sa mapusok na pautos na ito, ang αἴρω ay nangangahulugang alisin. Ang “sa ibabaw ng lupa” ay nagpapanatili sa larawan ng γῆ at sa pahiwatig na hinihingi nilang mawala siya sa hanay ng mga buhay.
- source_word: τὸν τοιοῦτον
  choice: ang taong ganyan
  rationale: Natural sa modernong Filipino at naipapahayag ang mapanghamak na pagtukoy ng madla nang hindi nagiging sobrang kolokyal.
- source_word: οὐ γὰρ καθῆκεν αὐτὸν ζῆν
  choice: Sapagkat hindi nararapat na mabuhay siya
  rationale: Ang καθήκω ay tumutukoy sa kung ano ang nararapat o angkop. Malapit ito sa anyo ng Griyego at malinaw na naghahayag ng hatol ng madla.
theological_decisions:
- issue: Kung tahasang isasalin bilang utos na patayin si Pablo ang sigaw ng madla
  choice: Pinanatili ang matalinghagang panawagang “Alisin sa ibabaw ng lupa” at ipinaliwanag ang pahiwatig sa talababa.
  alternative: “Patayin ang taong ganyan”
  rationale: Malinaw sa konteksto na kamatayan ang hinihingi nila, ngunit hindi tahasang gumagamit ang Griyego ng karaniwang pandiwang “patayin.” Pinananatili ng salin ang larawan at tindi ng orihinal nang hindi nilulutas sa pangunahing teksto ang pahiwatig nito.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “itinaas nila ang kanilang mga tinig” ay bahagyang pormal ngunit malinaw at pinananatili ang larawan ng orihinal; ang mismong sigaw ay tuwiran at mapusok.
