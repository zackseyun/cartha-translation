  source_fidelity: Ang pangunahing diwa ay naipapahayag, ngunit ang “Pagkatapos ay” ay nagdaragdag ng sunod-sunod na pagkilos na wala sa Griyego, kung saan pinagdurugtong ng καί ang kanilang pakikinig hanggang sa puntong iyon at ang bigla nilang pagsigaw. Ang “hanggang sa pahayag na ito” ay maaari ring gawing mas malinaw at natural bilang pagtukoy sa bahaging iyon ng sinabi ni Pablo.
  naturalness: 'May ilang bahagyang di-natural na bahagi: “Pagkatapos ay” at ang paghihiwalay sa dalawang pangungusap ay nagpapahina sa agarang reaksiyon ng madla. Ang “taong tulad nito” ay mas natural kaysa “taong ganyan” sa mapanghamak na pagtukoy sa isang tao sa ganitong pormal na salin. Napananatili ang marangal ngunit malinaw na rehistro.'
  terminology: Ang “hindi nararapat na mabuhay siya” ay tapat sa καθῆκεν at dapat panatilihin sa pangunahing teksto. Ang panawagang “Alisin sa ibabaw ng lupa” ay nagpapanatili ng larawan ng ἀπὸ τῆς γῆς at ng di-tahasang panawagan para sa kamatayan; dapat lamang gawing mas tumpak ang talababa at alisin ang maling anyong “Mawawala dapat.”
  issues:
