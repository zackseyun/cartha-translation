revisions:
- from: Nakikinig sila sa kanya hanggang sa pahayag na ito. Pagkatapos ay itinaas nila ang kanilang mga tinig at sinabi, “Alisin sa ibabaw ng lupa ang taong ganyan![a] Sapagkat hindi nararapat na mabuhay siya.”[b]
  to: Hanggang sa bahaging ito ng kanyang sinabi ay nakikinig sila sa kanya, ngunit itinaas nila ang kanilang mga tinig at sumigaw, “Alisin sa ibabaw ng lupa ang taong tulad nito![a] Sapagkat hindi nararapat na mabuhay siya.”[b]
  rationale: Pinag-ugnay ang pakikinig at ang kanilang agarang marahas na reaksiyon upang masundan ang sintaks at daloy ng Griyego. Ginawang “bahaging ito ng kanyang sinabi” ang λόγος upang malinaw na tumukoy sa puntong nagpasiklab ng sigaw. Pinanatili ang “Alisin sa ibabaw ng lupa” at “hindi nararapat na mabuhay siya” dahil kapwa malapit sa mga ekspresyong Griyego, habang ang mas idiomatikong pagpapakahulugang kamatayan ay nasa talababa.
