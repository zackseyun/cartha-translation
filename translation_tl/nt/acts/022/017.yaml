  text: Ἐγένετο δέ μοι ὑποστρέψαντι εἰς Ἰερουσαλὴμ καὶ προσευχομένου μου ἐν τῷ ἱερῷ γενέσθαι με ἐν ἐκστάσει
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/017.yaml
  text: And it happened to me that[a], after I had returned to Jerusalem and while I was praying in the temple, I fell into a trance[b],
translation:
  language: tl
  text: Nang makabalik ako sa Jerusalem, habang nananalangin ako sa templo[a], nangyari sa akin na mapunta ako sa isang kalagayang ekstasis[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay tumutukoy sa buong kompleks o bakuran ng templo, hindi lamang sa panloob na santuwaryo.
    reason: cultural_note
  - marker: b
    text: O “nasa isang trance.” Literal na sinasabi ng pariralang Griyego na “mapunta sa isang ekstasis,” isang idyoma para sa pagpasok sa kalagayang may pangitain.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: nangyari na nalagay ako
  rationale: Ipinahahayag nito ang sumunod na karanasan ni Pablo sa natural na Tagalog, habang pinananatili ang diwa ng pormulang pasalaysay at ang personal na pagkakasangkot na ipinahihiwatig ng μοι.
- source_word: ὑποστρέψαντι εἰς Ἰερουσαλήμ
  choice: Nang makabalik ako sa Jerusalem
  rationale: Ang aorist participle ay tumutukoy sa pagbabalik na nauna sa pangunahing pangyayari; malinaw at likas sa Tagalog ang temporal na sugnay na ito.
- source_word: καὶ προσευχομένου μου
  choice: habang nananalangin ako
  rationale: Ipinakikita ng genitive absolute ang kilos na nagpapatuloy kasabay ng pangunahing pangyayari.
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Karaniwang katawagan ito sa Tagalog; sa kontekstong Griyego, ang ἱερόν ay tumutukoy sa buong bakuran o kompleks ng templo, na nililinaw sa talababa.
- source_word: γενέσθαι με ἐν ἐκστάσει
  choice: nalagay ako sa isang kalagayang tila wala sa sarili
  rationale: Ang parirala ay idyoma para sa pagpasok sa isang pambihirang kalagayang kaugnay ng pangitain. Mas malinaw ito sa ordinaryong modernong Tagalog kaysa sa teknikal o madaling mapagkamalang salitang 'trance.'
theological_decisions:
- issue: Kalikasan ng karanasan ni Pablo na ἐν ἐκστάσει
  choice: kalagayang tila wala sa sarili
  alternative: nasa isang trance; nasa kalagayan ng matinding pagkamangha
  rationale: Inilalarawan lamang ng talata ang pambihirang kalagayan ni Pablo habang nananalangin; hindi nito ipinaliliwanag ang mekanismo o buong teolohikal na katangian ng karanasan. Pinananatili ng salin ang pagiging bukas ng pahayag nang walang dagdag na doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “nananalangin” bilang natural na anyo para sa patuloy na panalangin, at iniwasan ang sobrang teknikal na paglalarawan sa ἔκστασις. Ang kuwit sa hulihan ay pinanatili dahil nagpapatuloy ang pangungusap sa kasunod na talata.
