base_translation:
  language: en
  yaml_path: translation/nt/acts/022/011.yaml
  text: And since I could not see because of the brightness of that light[a], I came into Damascus being led by the hand by those who were with me.
translation:
  language: tl
  text: At yamang hindi ako makakita dahil sa ningning ng liwanag na iyon[a], dumating ako sa Damasco habang inaakay ako ng mga kasama ko at hawak nila ang aking kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “dahil sa kaluwalhatian ng liwanag na iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέβλεπον
  choice: makakita
  rationale: Sa konteksto ng pagkabulag matapos ang makalangit na liwanag, tumutukoy ito sa kawalan ng kakayahang makakita, hindi lamang sa kawalan ng kakayahang tumitig.
- source_word: ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου
  choice: dahil sa ningning ng liwanag na iyon
  rationale: Ipinapahayag ng δόξα rito ang matinding kislap o ningning ng liwanag na naging sanhi ng hindi pagkakita. Pinananatili ng talababa ang mas literal na ‘kaluwalhatian.’
- source_word: χειραγωγούμενος
  choice: inakay ako sa kamay
  rationale: Pinananatili nito ang tahasang larawan ng paggabay sa pamamagitan ng paghawak sa kamay at natural itong pakinggan sa Filipino.
- source_word: ὑπὸ τῶν συνόντων μοι
  choice: ng mga kasama ko
  rationale: Likas at maikli itong katumbas ng mga taong naroon at naglalakbay na kasama niya, nang hindi nagpapahiwatig ng pormal na katayuan.
- source_word: ἦλθον εἰς Δαμασκόν
  choice: hanggang sa Damasco
  rationale: Sa Filipino, ang ‘hanggang sa Damasco’ ay natural na nagpapahayag ng pag-akay at pagdating sa destinasyon, bagaman hindi nito tahasang inilalarawan ang pagpasok sa lungsod.
- source_word: ὡς δὲ
  choice: At dahil
  rationale: 'Ipinagpapatuloy nito ang salaysay at malinaw na ipinakikita ang ugnayang sanhi: dahil hindi siya makakita, kinailangan siyang akayin.'
theological_decisions:
- issue: Paglilipat ng δόξα sa konteksto ng makalangit na pagpapakita
  choice: ningning
  alternative: kaluwalhatian; kaningningan
  rationale: Sa pangungusap na ito, ang δόξα ay ang nakikitang ningning ng liwanag na naging sanhi ng pansamantalang pagkabulag. Ang ‘ningning’ ay malinaw at natural, samantalang pinananatili sa talababa ang mas literal at may teolohikal na bigat na ‘kaluwalhatian.’
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang ‘inakay ako sa kamay’ upang mapanatili ang matingkad na detalye ng Griyego, at ‘Damasco’ bilang karaniwang anyong Filipino ng pangalan ng lungsod.
