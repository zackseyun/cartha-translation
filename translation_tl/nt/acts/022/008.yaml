  text: ἐγὼ δὲ ἀπεκρίθην· Τίς εἶ, κύριε; εἶπέν τε πρὸς ⸀ἐμέ· Ἐγώ εἰμι Ἰησοῦς ὁ Ναζωραῖος ὃν σὺ διώκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/008.yaml
  text: And I answered[a], ‘Who are you, Lord?’ And he said to me, ‘I am Jesus the Nazarene[b], whom you are persecuting.’
translation:
  language: tl
  text: Sumagot ako, ‘Sino po kayo, Panginoon[a]?’ Sinabi niya sa akin, ‘Ako si Jesus na Nazareno[b], na inuusig mo.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain bilang magalang na pagtawag na katumbas ng “ginoo.” Ang Griyegong κύριε ay maaaring gamiting magalang na pantawag o bilang titulong “Panginoon.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “Jesus na taga-Nazaret” o “Jesus na Nazoreo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθην
  choice: Sumagot ako
  rationale: Likas at tuwirang katumbas sa modernong Tagalog ng aorist na ἀπεκρίθην sa salaysay.
- source_word: Τίς εἶ
  choice: Sino po kayo
  rationale: Ang ‘Sino kayo?’ ang tuwirang tanong; idinagdag ang ‘po’ upang likas na maipakita sa Tagalog ang magalang na pakikipag-usap na maaaring taglay ng κύριε.
- source_word: κύριε
  choice: Panginoon
  rationale: Pinananatili ang karaniwang salin ng κύριος at ang posibleng teolohikal na bigat nito, habang inilalahad sa talababa ang posibilidad na isa lamang itong magalang na pagtawag.
- source_word: εἶπέν τε πρὸς ἐμέ
  choice: Sinabi niya sa akin
  rationale: Natural na Tagalog para sa λέγω na may πρὸς ἐμέ; sapat na naipagpapatuloy ng ayos ng pangungusap ang mahinang pang-ugnay na τε.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: Ako si Jesus
  rationale: Ito ang natural na paraan ng tuwirang pagpapakilala sa Tagalog nang walang di-kailangang pagpapalawak.
- source_word: ὁ Ναζωραῖος
  choice: na Nazareno
  rationale: Pinananatili ang anyong bansag/pang-uri ng Griyego sa likas na pariralang Tagalog; maaaring tumukoy sa taong taga-Nazaret.
- source_word: ὃν σὺ διώκεις
  choice: na inuusig mo
  rationale: Ang διώκω rito ay nangangahulugang marahas o mapanlabang pag-uusig; ipinahihiwatig ng ‘inuusig’ ang nagpapatuloy na kilos ng pangkasalukuyang panahunan.
theological_decisions:
- issue: Kahulugan ng κύριε sa pagtawag ni Saulo
  choice: Panginoon
  alternative: ginoo / magalang na pagtawag lamang
  rationale: Maaaring hindi pa lubos na kilala ni Saulo ang nagsasalita, kaya may posibilidad na magalang na pagtawag lamang ang κύριε. Gayunman, pinananatili sa pangunahing teksto ang ‘Panginoon’ upang hindi alisin ang titulong maaaring sadyang pinapatingkad ng salaysay; ang kalabuan ay iniingatan sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘po/kayo’ upang maging likas ang magalang na direktang pananalita, ngunit pinanatili ang ‘Panginoon’ at ang talababa upang hindi lutasin nang sapilitan ang kalabuan ng κύριε. Ang ‘Nazareno’ ay mas pamilyar kaysa ‘Nazoreo’ ngunit mas malapit sa bansag na ὁ Ναζωραῖος kaysa sa tahasang lokatibong ‘taga-Nazaret.’
