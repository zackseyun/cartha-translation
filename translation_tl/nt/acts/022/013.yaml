revisions:
- from: Lumapit siya sa akin at tumayo sa tabi ko. Sinabi niya sa akin, ‘Kapatid na Saulo, makakita kang muli.’ At nang oras ding iyon, nakakita akong muli at tumingin sa kanya.[a]
  to: Lumapit siya sa akin at tumayo sa tabi ko. Sinabi niya sa akin, “Saulo, kapatid, manumbalik ang iyong paningin.”[a] At sa mismong oras ding iyon, nanumbalik ang aking paningin at tumingin ako sa kanya.
  rationale: Inayos ang pamanahong parirala upang maging wastong modernong Tagalog at ginawang mas tuwiran ang bokatibong pagtawag. Pinalitan ang pananalita para sa ἀναβλέπω ng likas na idyomang tumutukoy sa panunumbalik ng paningin; pinanatili ng talababa ang alternatibong leksikal na “tumingala.” Walang binago sa kahulugan o pagkakasunod-sunod ng salaysay.
