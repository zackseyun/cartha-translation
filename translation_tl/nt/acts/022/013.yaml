  yaml_path: translation/nt/acts/022/013.yaml
  text: He came to me[a], and standing by me said to me, ‘Brother Saul, receive your sight.’ And in that very hour I received my sight and looked at him.
translation:
  language: tl
  text: Lumapit siya sa akin at tumayo sa tabi ko. Sinabi niya sa akin, “Saulo, kapatid, manumbalik ang iyong paningin.”[a] At sa mismong oras ding iyon, nanumbalik ang aking paningin at tumingin ako sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang isinaling “manumbalik ang iyong paningin” at “nanumbalik ang aking paningin” ay maaari ring mangahulugang “tumingala,” ngunit sa konteksto ng pagkabulag at paggaling, mas malamang na tumutukoy ito sa panunumbalik ng paningin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν πρὸς ἐμέ
  choice: Lumapit siya sa akin
  rationale: Likas na salaysay sa Tagalog na pinananatili ang paglapit ni Ananias kay Saulo.
- source_word: ἐπιστάς
  choice: tumayo sa tabi ko
  rationale: Ipinahahayag ang pagpuwesto ni Ananias malapit at katabi ni Saulo.
- source_word: Σαοὺλ ἀδελφέ
  choice: Kapatid na Saulo
  rationale: Natural na anyo ng tuwirang pagtawag sa Tagalog; pinananatili ng “Kapatid” ang ugnayan o pakikipagkaisa na ipinahihiwatig ng bokatibong ἀδελφέ.
- source_word: ἀνάβλεψον
  choice: makakita kang muli
  rationale: Sa konteksto ng pagkabulag at paggaling, tumutukoy ito sa muling pagkakaroon ng paningin, hindi lamang sa pagtingala.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: nang oras ding iyon
  rationale: Pinananatili ang diin sa mismong oras ng pangyayari nang hindi ito pinapantay lamang sa “agad.”
- source_word: ἀνέβλεψα
  choice: nakakita akong muli
  rationale: Kaayon ng unang gamit ng ἀναβλέπω at malinaw na tumutukoy sa panunumbalik ng paningin.
- source_word: εἰς αὐτόν
  choice: tumingin sa kanya
  rationale: Pinananatili ang direksiyon ng tingin kay Ananias matapos manumbalik ang paningin.
- source_word: εἶπέν μοι
  choice: Sinabi niya sa akin
  rationale: Tahasan nitong kinakatawan ang μοι at natural ang ayos sa modernong Tagalog.
