  text: Ἐγένετο δέ μοι πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ περὶ μεσημβρίαν ἐξαίφνης ἐκ τοῦ οὐρανοῦ περιαστράψαι φῶς ἱκανὸν περὶ ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/006.yaml
  text: It happened that as I was traveling and drawing near to Damascus[a], about noon, suddenly a bright light from heaven flashed around me,
translation:
  language: tl
  text: Habang naglalakbay ako at papalapit sa Damasco, bandang tanghali, biglang kumislap sa palibot ko ang isang matinding liwanag[a] mula sa langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, isang malaking liwanag. Maaaring idiin ng salitang Griyego ang laki o ang tindi ng liwanag.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: Habang … ako
  rationale: Sa Filipino, natural na isinasama sa salaysay ang panimulang pormulang ito sa kasunod na pangyayari; malinaw pa rin ang unang panauhan sa “ako” nang hindi gumagamit ng matigas na “nangyari sa akin na.”
- source_word: πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ
  choice: naglalakbay ako at papalapit na sa Damasco
  rationale: Pinananatili ang nagpapatuloy na kilos ng dalawang participle at ang Damasco bilang lugar na nilalapitan.
- source_word: περὶ μεσημβρίαν
  choice: nang bandang tanghali
  rationale: Natural na ipinahahayag ang tinatayang oras na malapit sa katanghaliang-tapat.
- source_word: ἐξαίφνης
  choice: biglang
  rationale: Tuwirang ipinapakita ang di-inaasahang paglitaw ng liwanag.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Pinananatili ang posibleng makalangit o banal na pinagmulan, sa halip na limitahan ito sa atmosperikong “kalangitan.”
- source_word: περιαστράψαι
  choice: kumislap sa palibot ko
  rationale: Ipinahahayag kapwa ang biglaang pagsilay at ang paglibot ng liwanag sa nagsasalita.
- source_word: φῶς ἱκανὸν
  choice: isang matinding liwanag
  rationale: Ang ἱκανός ay maaaring tumukoy sa malaking antas o tindi; natural sa modernong Filipino ang “matinding liwanag” at hindi nito pinahihina ang lakas ng tagpo.
theological_decisions:
- issue: Kahulugan ng οὐρανός sa ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  alternative: mula sa kalangitan
  rationale: Sa konteksto ng pangitaing naranasan ni Pablo, mas napapanatili ng “langit” ang malamang na makalangit na pinagmulan nang hindi nagdaragdag ng tahasang paliwanag na teolohikal.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Damasco,” ang karaniwang anyong Filipino ng pangalan. Inilagay ang talababa pagkatapos ng “langit” ngunit tumutukoy ito sa pariralang “matinding liwanag”; maaari rin itong ilagay kaagad pagkatapos ng pariralang iyon sa panghuling typesetting upang ganap na luminaw ang saklaw.
