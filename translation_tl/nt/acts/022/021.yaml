  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρός με· Πορεύου, ὅτι ἐγὼ εἰς ἔθνη μακρὰν ἐξαποστελῶ σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/021.yaml
  text: And he said to me[a], ‘Go, because I will send you far away to the Gentiles.’
translation:
  language: tl
  text: At sinabi niya sa akin, “Humayo ka, sapagkat isusugo kita sa malayo, sa mga Hentil[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bansa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρός με
  choice: sinabi niya sa akin
  rationale: Likas at tuwirang paraan ito sa modernong Tagalog upang ipakilala ang pananalitang nakatuon sa isang tao.
- source_word: Πορεύου
  choice: Humayo ka
  rationale: Ipinahahayag ng pautos ang pag-alis o pagpunta. Ang “Humayo ka” ay maikli, marangal, at angkop sa tuwirang utos nang hindi nagdaragdag ng tiyak na destinasyon.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala rito ng ὅτι ang dahilan ng utos. Malinaw na pinananatili ng “sapagkat” ang ugnayang sanhi.
- source_word: ἐγὼ
  choice: ako (nakapaloob sa “isusugo”)
  rationale: Likas na nakapaloob sa anyong pandiwang Tagalog ang unang panauhan. Ang ayos ng pangungusap at tuwirang pangako ay sapat upang maipahiwatig ang diin nang hindi nagiging pilit ang “ako ang.”
- source_word: εἰς ἔθνη
  choice: sa mga Hentil
  rationale: Sa konteksto ng misyon ni Pablo sa Mga Gawa, tumutukoy ito sa mga hindi Judio. Pinananatili sa talababa ang literal na alternatibong “mga bansa.”
- source_word: μακρὰν
  choice: sa malayo
  rationale: Natural nitong ipinahahayag ang malaking distansiya nang hindi tinutukoy ang isang lugar na wala sa Griyego.
- source_word: ἐξαποστελῶ
  choice: isusugo
  rationale: Ang “isusugo” ay natural na katumbas ng pagpapadala sa isang tungkulin at angkop sa konteksto, habang hindi labis na ipinapaliwanag ang saklaw ng atas.
- source_word: σε
  choice: kita
  rationale: 'Ang “kita” ang natural na anyong Tagalog kapag ang nagsasalita ang gagawa ng pagkilos sa kausap: “isusugo kita.”'
theological_decisions:
- issue: Kahulugan ng ἔθνη sa konteksto ng apostolikong misyon
  choice: mga Hentil
  alternative: mga bansa
  rationale: Ang agarang konteksto ay ang pagsusugo kay Pablo sa mga hindi Judio, kaya malinaw na naihahatid ng “mga Hentil” ang makasaysayang pagkakaiba ng Judio at hindi Judio. Gayunman, tunay na saklaw ng salitang Griyego ang “mga bansa,” kaya inilagay ito bilang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na maikli at marangal. Ginamit ang “Humayo ka” bilang malinaw na pautos at “isusugo kita” upang natural na maipahayag ang unang panauhang paksa at ikalawang panauhang layon. Inilagay ang tandang [a] kaagad pagkatapos ng “mga Hentil,” ang salitang tinutukoy ng talababa.
