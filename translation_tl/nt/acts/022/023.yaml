lexical_decisions:
- source_word: κραυγαζόντων
  choice: sumisigaw
  rationale: Ipinahahayag ng kasalukuyang aktibong participle ang nagpapatuloy at malakas na pagsigaw ng mga tao; natural at malinaw ang “sumisigaw” sa modernong Tagalog.
- source_word: τε
  choice: at … din
  rationale: Iniuugnay ng τέ ang pagsigaw sa iba pang kasabay na kilos. Ginamit ang “at” at “din” upang maging maayos at natural ang daloy sa Tagalog.
- source_word: αὐτῶν
  choice: sila / kanilang
  rationale: Bagaman nasa anyong genitive sa Griyego, tahasang panghalip ang kailangan sa Tagalog upang maging likas ang sugnay at malinaw na iisang pangkat ang gumagawa ng mga kilos.
- source_word: ῥιπτούντων
  choice: inihahagis
  rationale: Ang pandiwa ay tumutukoy sa paghagis o pagpukol. Hindi idinagdag ang “hinuhubad” upang hindi lutasin ang tunay na kalabuan kung itinatapon nila palayo o ipinapaghahagisan lamang ang mga balabal sa matinding pagkagalit.
- source_word: τὰ ἱμάτια
  choice: ang kanilang mga balabal
  rationale: Karaniwang tumutukoy ang ἱμάτια sa mga panlabas na kasuotan. Mas tiyak at mas malinaw sa tagpong ito ang “mga balabal” kaysa sa pangkalahatang “mga kasuotan.”
- source_word: κονιορτόν
  choice: alikabok
  rationale: Ito ang tuwiran at karaniwang katumbas ng salitang Griyego at angkop sa kilos ng nagngangalit na karamihan.
- source_word: βαλλόντων
  choice: nagsasaboy
  rationale: Saklaw ng βάλλω ang paghagis. Sa alikabok, natural sa Tagalog ang “nagsasaboy,” at naipakikita nito ang marahas at paulit-ulit na kilos nang hindi inuulit ang “inihahagis.”
- source_word: εἰς τὸν ἀέρα
  choice: sa hangin
  rationale: Likas na Tagalog ito para sa direksiyong ipinahahayag ng pariralang Griyego at mas malapit kaysa “sa langit.”
