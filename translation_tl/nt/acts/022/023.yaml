    text: Maaari ring “itinatapon ang kanilang mga kasuotan” o “naghahagis-hagis ng kanilang mga kasuotan.” Maaaring tumukoy ang Griyego sa paghahagis ng mga kasuotan palayo o sa marahas na paghahagis-hagis ng mga ito dahil sa matinding galit.
