  text: οἱ δὲ σὺν ἐμοὶ ὄντες τὸ μὲν φῶς ⸀ἐθεάσαντο τὴν δὲ φωνὴν οὐκ ἤκουσαν τοῦ λαλοῦντός μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/009.yaml
  text: Those who were with me saw the light[a], but they did not hear the voice of the one speaking to me.
translation:
  language: tl
  text: Nakita ng mga kasama ko ang liwanag, ngunit hindi nila narinig[a] ang tinig ng nagsasalita sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi nila naunawaan ang tinig.” Ihambing sa Gawa 9:7, kung saan sinasabing narinig ng mga kasama ni Pablo ang tunog o tinig. Maaaring ang pagkakaiba ay pagitan ng pagdinig ng tunog at pag-unawa sa nagsasalita.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ σὺν ἐμοὶ ὄντες
  choice: ang mga kasama ko
  rationale: Likas at tumpak na salin ng ‘mga kasama ko’ o ‘mga taong kasama ko’; hindi idinagdag ang ‘mga lalaki,’ na hindi tahasang nasa Griyego.
- source_word: τὸ μὲν φῶς
  choice: ang liwanag
  rationale: Tuwirang katumbas ng φῶς. Hindi idinagdag ang ‘maliwanag’ o ‘matinding’ sapagkat hindi iyon sinasabi sa talatang ito.
- source_word: ἐθεάσαντο
  choice: nakita
  rationale: Natural na makabagong salin ng θεάομαι sa kontekstong ito, nang hindi nagpapahiwatig na sadya nilang tinitigan ang liwanag.
- source_word: τὴν δὲ φωνὴν
  choice: ang tinig
  rationale: Bagaman maaaring mangahulugan ang φωνή ng ‘tunog’ o ‘tinig,’ mas angkop dito ang ‘tinig’ dahil tinutukoy ang isang nagsasalita.
- source_word: οὐκ ἤκουσαν
  choice: hindi nila narinig
  rationale: Pinananatili ang karaniwang tuwirang kahulugan ng ἀκούω. Ang posibleng diwang ‘hindi naunawaan’ ay inilagay sa talababa upang hindi lutasin sa pangunahing teksto ang tensiyon sa Gawa 9:7.
- source_word: τοῦ λαλοῦντός μοι
  choice: ng nagsasalita sa akin
  rationale: Pinananatili ng aspektong nagpapatuloy ng ‘nagsasalita’ ang present participle na λαλοῦντος at malinaw na inuugnay ang tinig sa nagsasalita.
theological_decisions:
- issue: Tila may tensiyon sa Gawa 9:7 tungkol sa kung narinig ng mga kasama ni Pablo ang tinig
  choice: hindi nila narinig ang tinig ng nagsasalita sa akin
  alternative: hindi nila naunawaan ang tinig
  rationale: Pinananatili sa pangunahing teksto ang pinakadirektang pagbasa ng Griyego. Dahil maaaring magtaglay ng kontekstuwal na diwang ‘maunawaan’ ang ἀκούω, at sinasabi sa Gawa 9:7 na may narinig silang tunog/tinig, itinatala sa talababa ang alternatibo sa halip na ipasok ito sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na ‘mga kasama ko’ at ‘nakita’ sa halip na mas mabigat o makalumang pananalita. Inilagay ang marker [a] pagkatapos ng buong pahayag na nangangailangan ng paliwanag, upang malinaw na saklaw nito ang ‘hindi nila narinig ang tinig.’
