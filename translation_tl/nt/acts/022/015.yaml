base_translation:
  language: en
  yaml_path: translation/nt/acts/022/015.yaml
  text: For you will be a witness for him to all people of what you have seen and heard[a][b].
translation:
  language: tl
  text: Sapagkat magiging saksi ka para sa kanya[a] sa lahat ng tao[b] tungkol sa mga nakita at narinig mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kanya.” Maaaring unawain ang datibong Griyego sa higit sa isang magkalapit na paraan.
    reason: alternative_reading
  - marker: b
    text: Ang salitang Griyego ay nasa panlalaking anyong maramihan ngunit ginagamit dito para sa mga tao sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinahahayag dito ng ὅτι ang paliwanag o dahilan ng atas kay Pablo; likas sa Tagalog ang “sapagkat” at pinananatili nito ang ugnayang iyon.
- source_word: ἔσῃ
  choice: magiging
  rationale: Payak na panghinaharap ang anyo ng εἰμί, kaya malinaw at natural ang “magiging.”
- source_word: μάρτυς
  choice: saksi
  rationale: Tumutukoy ito sa taong nagpapatotoo batay sa kaniyang nakita at narinig; ang “saksi” ang tuwiran at karaniwang katumbas.
- source_word: αὐτῷ
  choice: para sa kanya
  rationale: Ipinahihiwatig ng datibo ang taong alang-alang sa kaniya o hinggil sa kaniya isinasagawa ang pagpapatotoo. Natural ang “para sa kanya,” habang kinikilala sa talababa ang posibleng “sa kanya.”
- source_word: πρὸς πάντας ἀνθρώπους
  choice: sa lahat ng tao
  rationale: Ipinahahayag ng πρός ang patutunguhan o tagapakinig ng pagpapatotoo. Ginagamit nang panlahat ang ἀνθρώπους, at likas ding tumutukoy sa lahat ng tao ang pariralang Tagalog.
- source_word: ὧν
  choice: tungkol sa mga
  rationale: Ang panghalip na genitibo ay nagpapakilala sa nilalaman ng patotoo—ang mga bagay na nakita at narinig—at malinaw itong naihahayag ng “tungkol sa mga.”
- source_word: ἑώρακας
  choice: nakita mo
  rationale: Ang perpektong anyo ay tumutukoy sa naranasan ni Pablo na nananatiling batayan ng kaniyang patotoo; sa kontekstong ito, natural na naihahatid iyon ng “nakita mo.”
- source_word: καὶ ἤκουσας
  choice: at narinig mo
  rationale: Pinananatili ang magkatambal na personal na karanasan ng pagkakita at pagkarinig sa malinaw at natural na Tagalog.
theological_decisions:
- issue: Ang kahulugan at tinutukoy ng αὐτῷ sa atas kay Pablo
  choice: “para sa kanya,” na tumutukoy sa Panginoon/Jesus bilang siyang ipagpapatotoo ni Pablo
  alternative: “sa kanya,” na hindi tahasang nagpapasiya kung ito ay datibo ng pakinabang, kaugnayan, o patutunguhan
  rationale: Itinuturo ng konteksto na si Pablo ay inaatasang magpatotoo alang-alang sa Panginoon/Jesus sa harap ng iba. Gayunman, may saklaw ang datibong Griyego na hindi ganap na naipapakita ng iisang pariralang Tagalog, kaya itinatala ang mas neutral na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “saksi” at “sa lahat ng tao” bilang mga karaniwang pariralang madaling maunawaan, habang pinananatili sa talababa ang tunay na kalabuan ng datibong αὐτῷ.
