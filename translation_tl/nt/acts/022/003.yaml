id: ACT.22.3
reference: Acts 22:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Ἐγώ εἰμι ἀνὴρ Ἰουδαῖος, γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας, ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ παρὰ τοὺς πόδας Γαμαλιήλ, πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου, ζηλωτὴς ὑπάρχων τοῦ θεοῦ καθὼς πάντες ὑμεῖς ἐστε σήμερον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/003.yaml
  text: I am a Jewish man[a], born in Tarsus of Cilicia, but brought up in this city at the feet of Gamaliel, educated according to the strictness of the law of our fathers[b], being zealous for God just as all of you are today.
translation:
  language: tl
  text: “Ako ay isang lalaking Judio, ipinanganak sa Tarso ng Cilicia ngunit lumaki sa lungsod na ito sa paanan ni Gamaliel[a]. Mahigpit akong tinuruan ayon sa kautusan ng ating mga ninuno[b], at buong sigasig ako sa Diyos, gaya ninyong lahat ngayon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa paanan ni Gamaliel” ay isang idyoma na nangangahulugang sinanay siya bilang mag-aaral sa ilalim ng pagtuturo ni Gamaliel.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “kautusang minana sa mga ninuno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ Ἰουδαῖος
  choice: isang lalaking Judio
  rationale: Pinananatili nito kapwa ang tahasang pagtukoy sa isang lalaking nasa hustong gulang (ἀνήρ) at ang pagkakakilanlang Judio (Ἰουδαῖος).
- source_word: γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας
  choice: ipinanganak sa Tarso ng Cilicia
  rationale: Natural na salin ng perfect participle ang “ipinanganak,” habang pinananatili ng “ng Cilicia” ang heograpikong ugnayan.
- source_word: ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ
  choice: ngunit lumaki sa lungsod na ito
  rationale: Ang ἀνατρέφω ay tumutukoy rito sa pagpapalaki o paglaki; ipinakikita ng “ngunit” ang kaibahan ng lugar ng kapanganakan at kinalakhan.
- source_word: παρὰ τοὺς πόδας Γαμαλιήλ
  choice: sa paanan ni Gamaliel
  rationale: Pinananatili ang malinaw at makasaysayang larawan ng pag-aaral bilang alagad sa ilalim ng isang guro; nililinaw ito sa talababa.
- source_word: πεπαιδευμένος κατὰ ἀκρίβειαν
  choice: Mahigpit akong tinuruan ayon sa
  rationale: Ipinahahayag ng “mahigpit” ang katumpakan at istriktong pagsunod na saklaw ng ἀκρίβεια, at natural ang “tinuruan” para sa pormal na pagsasanay.
- source_word: τοῦ πατρῴου νόμου
  choice: kautusan ng ating mga ninuno
  rationale: Ang “mga ninuno” ay tuwirang naghahatid ng diwang minana sa πατρῷος; ang “ating” ay nagpapanatili sa pakikiisa ni Pablo sa kaniyang mga Judiong tagapakinig.
- source_word: ζηλωτὴς ὑπάρχων τοῦ θεοῦ
  choice: masigasig ako para sa Diyos
  rationale: Inihahatid ng “masigasig” ang ζῆλος nang hindi ipinahihiwatig ang teknikal o pampolitikang katawagang “Zelote.”
- source_word: καθὼς πάντες ὑμεῖς ἐστε σήμερον
  choice: gaya ninyong lahat ngayon
  rationale: Pinananatili nito ang paghahambing at ang retorikal na pakikiisa ni Pablo sa kasalukuyang sigasig ng kaniyang mga tagapakinig.
theological_decisions:
- issue: Pagpapahayag ng πατρῴου νόμου bilang pinagsasaluhang pamanang Judio
  choice: kautusan ng ating mga ninuno
  alternative: kautusang minana sa mga ninuno
  rationale: Ang “ating” ay angkop sa konteksto ng talumpati at nagpapahayag ng pakikiisa ni Pablo sa mga tagapakinig, nang hindi nagpapasok ng sektaryong pagpapakahulugan.
- issue: Pagpapanatili sa idyomang παρὰ τοὺς πόδας Γαμαλιήλ
  choice: sa paanan ni Gamaliel
  alternative: sa ilalim ng pagtuturo ni Gamaliel
  rationale: Pinananatili ng literal na larawan ang makasaysayang ugnayan ng guro at alagad, habang inaalis ng talababa ang posibleng kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang larawang “sa paanan” ngunit nilinaw sa talababa. Hinati sa dalawang pangungusap ang mahabang sugnay na Griyego upang maging natural sa Filipino nang hindi binabago ang lohikal na daloy.
