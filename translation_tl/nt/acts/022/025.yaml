base_translation:
  language: en
  yaml_path: translation/nt/acts/022/025.yaml
  text: But when they had stretched him out with the straps[a], Paul said to the centurion standing there, “Is it lawful for you to flog a Roman citizen who is uncondemned?”
translation:
  language: tl
  text: Ngunit nang iunat nila siya gamit ang mga panaling katad, sinabi ni Pablo sa senturyong nakatayo roon, “Naaayon ba sa batas na hagupitin ninyo ang isang mamamayang Romano[a] na hindi pa nahahatulan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “isang taong Romano”; sa kontekstong legal, tumutukoy ito sa katayuan niya bilang mamamayang Romano.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέτειναν αὐτὸν τοῖς ἱμᾶσιν
  choice: iniunat nila siya at talian ng mga panaling katad
  rationale: Ipinahihiwatig ng προτείνω ang pag-uunat kay Pablo bilang paghahanda sa paghagupit, at ang ἱμᾶσιν ay mga panali o sintas na karaniwang yari sa katad. Malinaw at natural sa Filipino ang pinagsamang kilos.
- source_word: ἑστῶτα
  choice: nakatayo roon
  rationale: Inilalarawan ng participle ang senturyon na nakatayo sa tabi o naroroon; natural sa salaysay ang “nakatayo roon.”
- source_word: ἑκατόνταρχον
  choice: senturyon
  rationale: Ang “senturyon” ang tiyak at kinikilalang tawag sa opisyal na Romano na tinutukoy ng ranggong ito.
- source_word: ἄνθρωπον Ῥωμαῖον
  choice: isang mamamayang Romano[a]
  rationale: Literal itong “isang taong Romano,” ngunit sa legal na tanong ni Pablo, ang mahalagang diwa ay ang protektadong katayuan niya bilang mamamayang Romano. Nililinaw ng salin ang konteksto habang itinatala sa talababa ang literal na anyo.
- source_word: ἀκατάκριτον
  choice: hindi pa nahahatulan
  rationale: Tumutukoy ito sa isang taong wala pang hatol na nagpaparusa sa kaniya. Ang “hindi pa nahahatulan” ay malinaw, natural, at nagpapanatili sa legal na diin.
- source_word: ἔξεστιν ὑμῖν
  choice: Naaayon ba sa batas ... ninyo
  rationale: Ang tanong ay tungkol sa legal na pahintulot, kaya ang “naaayon ba sa batas” ay angkop sa kontekstong panghukuman.
- source_word: μαστίζειν
  choice: hagupitin
  rationale: Ang pandiwa ay tumutukoy sa matinding paghagupit bilang parusa o interogasyon. Karaniwan at sapat ang tindi ng “hagupitin” sa modernong Filipino.
