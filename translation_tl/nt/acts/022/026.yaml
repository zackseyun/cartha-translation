id: ACT.22.26
reference: Acts 22:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ ἑκατοντάρχης προσελθὼν ⸂τῷ χιλιάρχῳ ἀπήγγειλεν⸃ λέγων· ⸀Τί μέλλεις ποιεῖν; ὁ γὰρ ἄνθρωπος οὗτος Ῥωμαῖός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/026.yaml
  text: When the centurion heard this[a], he went to the commander and reported it, saying[b], “What are you about to do? For this man is a Roman citizen.”
translation:
  language: tl
  text: Nang marinig ito ng senturyon, lumapit siya sa kumander at nag-ulat, “Ano ang gagawin mo?[a] Sapagkat mamamayang Romano ang taong ito.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Ano ang balak mong gawin?” Maaaring tumukoy ang pananalitang Griyego sa nalalapit na kilos o sa nilalayong gawin.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “Romano ang taong ito.” Sa konteksto, nangangahulugan itong mayroon siyang pagkamamamayang Romano.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Nang marinig ito
  rationale: Ipinapakita ng aorist participle ang pangyayaring nauna sa paglapit at pag-uulat; likas sa Tagalog ang sugnay na may “nang.” Ang “ito” ay tumutukoy sa naunang sinabi ni Pablo.
- source_word: ἑκατοντάρχης
  choice: senturyon
  rationale: Tiyak at nakasanayang katawagan sa opisyal ng hukbong Romano na tinutukoy ng ἑκατοντάρχης.
- source_word: προσελθὼν
  choice: lumapit siya sa
  rationale: Malinaw na ipinahihiwatig ang paglapit sa nakatataas na opisyal at natural ang daloy sa makabagong Tagalog.
- source_word: χιλιάρχῳ
  choice: kumander
  rationale: Tumutukoy sa mataas na opisyal na namumuno sa yunit ng hukbong Romano. Mas madaling maunawaan ang “kumander” kaysa sa teknikal na “tribuno” o transliterasyong “kiliarko.”
- source_word: ἀπήγγειλεν
  choice: nag-ulat
  rationale: Ang pandiwa ay tumutukoy sa paghahatid ng impormasyon; ang “nag-ulat” ay angkop sa kontekstong militar.
- source_word: λέγων
  choice: nag-ulat, “…”
  rationale: Sa natural na Tagalog, sapat nang tuwirang sundan ng sipi ang “nag-ulat”; naipahihiwatig nito ang participial na λέγων nang hindi inuulit ang “sinabi.”
- source_word: Τί μέλλεις ποιεῖν;
  choice: Ano ang gagawin mo?
  rationale: Natural na tanong sa Tagalog na maaaring tumukoy kapuwa sa nalalapit na kilos at sa binabalak na gawin, kaya napapanatili ang saklaw ng μέλλω kasama ng infinitive.
- source_word: ὁ γὰρ ἄνθρωπος οὗτος
  choice: Sapagkat … ang taong ito
  rationale: Pinananatili ng “sapagkat” ang paliwanag na diin ng γάρ, at ang “taong ito” ay tuwirang tumutukoy sa lalaking pinag-uusapan.
- source_word: Ῥωμαῖός ἐστιν
  choice: mamamayang Romano
  rationale: Sa legal na konteksto, ang Ῥωμαῖος ay tumutukoy sa katayuan bilang mamamayan ng Roma, hindi lamang sa lahi o tirahan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “senturyon” para sa tiyak na ranggong Romano at “kumander” para sa madaling maunawaang katawagan sa nakatataas na opisyal. Inilagay ang mga panandang talababa sa mismong mga pariralang nililinaw ng mga ito.
