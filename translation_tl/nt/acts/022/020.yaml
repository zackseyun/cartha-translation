- from: At nang ibinubuhos ang dugo ni Esteban, na iyong saksi[a], naroon din ako mismo, sumasang-ayon sa kanila at nagbabantay sa mga balabal ng mga pumapatay sa kanya.
  to: At nang ibinubuhos ang dugo ni Esteban, na iyong saksi[a], ako mismo ay nakatayo roon, sumasang-ayon at nagbabantay sa mga balabal ng mga pumapatay sa kanya.
  rationale: Inalis ang “din” upang mapanatili ang emphatic na αὐτός bilang “ako mismo” nang walang idinagdag na kahulugang “rin.” Inayos din ang sintaks ng sugnay tungkol sa presensiya ni Pablo at pinakinis ang pananalita ng talababa, habang pinananatili ang aspekto, metapora, leksikal na pagpili, at footnote anchor ng draft.
