  text: καὶ ὅτε ⸀ἐξεχύννετο τὸ αἷμα Στεφάνου τοῦ μάρτυρός σου, καὶ αὐτὸς ἤμην ἐφεστὼς καὶ συνευδοκῶν ⸀καὶ φυλάσσων τὰ ἱμάτια τῶν ἀναιρούντων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/020.yaml
  text: And when the blood of Stephen your witness was being poured out[a], I myself was standing by and approving, and guarding the cloaks of those who were killing him.
translation:
  language: tl
  text: At nang ibinubuhos ang dugo ni Esteban, na iyong saksi[a], ako mismo ay nakatayo roon, sumasang-ayon at nagbabantay sa mga balabal ng mga pumapatay sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “martir.” Ang salitang Griyego ay maaaring mangahulugang “saksi,” at sa paggamit ng mga Kristiyano ay kalaunang lalo nang iniugnay sa isang taong namamatay dahil sa kanyang pagsaksi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεχύννετο
  choice: ibinubuhos
  rationale: Pinananatili ng aspektong di-ganap at tinig na balintiyak ang nagpapatuloy na kilos, pati ang matingkad na larawan ng dugong ibinubuhos.
- source_word: αἷμα
  choice: dugo
  rationale: Tuwiran at likas na katumbas sa Filipino.
- source_word: μάρτυρός
  choice: saksi
  rationale: Ito ang pangunahing leksikal na kahulugan ng μάρτυς; hindi agad ipinapasok sa pangunahing teksto ang kalaunang teknikal na gamit na “martir.”
- source_word: ἐφεστὼς
  choice: naroon
  rationale: Likas na ipinapahayag sa Filipino ang pagiging presente at nakatayo sa tabi ng pangyayari nang hindi dinaragdagan ang papel ni Pablo.
- source_word: συνευδοκῶν
  choice: sumasang-ayon sa kanila
  rationale: Ipinahahayag ang aktibong pagsang-ayon o pagsang-ayon sa ginagawa ng mga pumatay; ang “sa kanila” ay likas na ipinahihiwatig ng konteksto.
- source_word: φυλάσσων
  choice: nagbabantay
  rationale: Ang konkretong diwa ay pag-iingat o pagbabantay sa mga kasuotan.
- source_word: ἱμάτια
  choice: mga balabal
  rationale: Tumutukoy ito sa mga panlabas na kasuotan; mas tiyak at matingkad ang “mga balabal” kaysa pangkalahatang “mga damit.”
- source_word: ἀναιρούντων
  choice: mga pumapatay
  rationale: Tuwiran at natural na salin ng pagkitil ng buhay, nang hindi idinaragdag ang moral na pagtataya ng “pumapaslang.”
- source_word: αὐτὸς
  choice: ako mismo
  rationale: Pinananatili ang diin ng panghalip sa personal na pagkakasangkot ng nagsasalita.
theological_decisions:
- issue: Pagkakasalin ng μάρτυς bilang pagtukoy kay Esteban
  choice: saksi
  alternative: martir
  rationale: Ang “saksi” ang tuwirang leksikal na kahulugan, kahit kalaunan ay natatanging iniugnay ang salita sa namamatay dahil sa kanyang pagsaksi. Pinananatili sa talababa ang “martir” bilang makabuluhang alternatibo sa kontekstong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inilagay ang talababa pagkatapos ng “saksi,” ang salitang tinutukoy nito. Pinanatili ang matingkad na metapora ng pagbubuhos ng dugo at ang diin ng “ako mismo.”
