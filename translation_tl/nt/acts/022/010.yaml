  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπον δέ· Τί ποιήσω, κύριε; ὁ δὲ κύριος εἶπεν πρός με· Ἀναστὰς πορεύου εἰς Δαμασκόν, κἀκεῖ σοι λαληθήσεται περὶ πάντων ὧν τέτακταί σοι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/010.yaml
  text: Then I said[a], ‘What should I do, Lord?’ And the Lord said to me, ‘Get up and go into Damascus[b], and there you will be told about everything that has been appointed for you to do.’
translation:
  language: tl
  text: Sinabi ko[a], “Ano ang dapat kong gawin, Panginoon?” At sinabi sa akin ng Panginoon, “Tumayo ka at pumunta sa Damasco. At doon ay sasabihin sa iyo ang lahat ng itinakdang gawin mo[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sinabi ko naman.”
    reason: lexical_alternative
  - marker: b
    text: O “iniatas sa iyo na gawin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ποιήσω
  choice: Ano ang dapat kong gawin
  rationale: Ang deliberative aorist subjunctive ay humihingi ng patnubay tungkol sa nararapat na susunod na kilos. Likas sa modernong Tagalog ang “dapat kong gawin” at pinananatili nito ang diwa ng pananagutan o patnubay.
- source_word: κύριε / ὁ ... κύριος
  choice: Panginoon / ang Panginoon
  rationale: Pinananatili ng “Panginoon” ang iisang titulong ginamit sa tuwirang pakikipag-usap at sa pagkilala sa nagsalita, nang hindi pinahihina ang bigat nito sa salaysay ng Mga Gawa.
- source_word: Ἀναστὰς
  choice: Tumayo ka
  rationale: Ang participle ay may puwersang pautos at nauuna sa pagpunta. Ang “Tumayo ka” ay malinaw at likas na utos sa Tagalog.
- source_word: πορεύου εἰς Δαμασκόν
  choice: pumunta sa Damasco
  rationale: Karaniwang pandiwa ng pagpunta ang πορεύομαι. Likas sa Tagalog ang “pumunta sa Damasco” at malinaw na ipinahihiwatig ang paglalakbay patungo sa lungsod.
- source_word: κἀκεῖ
  choice: Doon
  rationale: Tuwirang ipinapahayag ng “Doon” ang lokasyon at ang kasunod na pangyayari; naipahihiwatig na ng bagong pangungusap ang pang-ugnay na καί.
- source_word: λαληθήσεται
  choice: sasabihin sa iyo
  rationale: 'Ang future passive na may dative σοι ay natural na naipapahayag sa Tagalog bilang di-tiyak ang gumagawa: “sasabihin sa iyo.” Hindi nito tinutukoy kung sino ang magsasalita, gaya ng Griyego.'
- source_word: περὶ πάντων
  choice: ang lahat
  rationale: Sa kayarian ng Tagalog, ang nilalaman ng sasabihin ay natural na ipinapahayag bilang “ang lahat,” na sinusundan ng sugnay na naglalarawan kung ano ang mga iyon.
- source_word: τέτακταί σοι ποιῆσαι
  choice: itinakdang gawin mo
  rationale: Pinananatili ng “itinakda” ang perfect passive at ang diwang ang gawain ay naisaayos na, habang ang “gawin mo” ay malinaw na tumutukoy sa tungkulin ni Pablo nang hindi tahasang tinutukoy ang gumawa ng pagtatalaga.
theological_decisions:
- issue: Puwersa ng τέτακταί kaugnay ng banal na paggabay at tungkulin
  choice: itinakdang gawin mo
  alternative: iniatas sa iyo na gawin
  rationale: Ipinahihiwatig ng “itinakda” na ang mga gagawin ni Pablo ay naisaayos na, ngunit hindi nito pinatitindi ang pahayag tungo sa isang partikular na sistemang teolohikal. Pinananatili rin ng passive ang hindi tahasang pagbanggit sa nagtakda.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pasalaysay na talumpati. Ginamit ang “Damasco,” ang nakaugaliang anyong Filipino ng pangalan ng lungsod. Ang di-tiyak na gumagawa sa “sasabihin” at “itinakda” ay sadyang pinanatili.
