  text: ἔπεσά τε εἰς τὸ ἔδαφος καὶ ἤκουσα φωνῆς λεγούσης μοι· Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/007.yaml
  text: I fell to the ground and heard a voice saying to me, ‘Saul, Saul, why are you persecuting me?’
translation:
  language: tl
  text: Bumagsak ako sa lupa at nakarinig ako ng isang tinig na nagsasabi sa akin, “Saulo, Saulo, bakit mo ako inuusig?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσά
  choice: Bumagsak ako
  rationale: Payak at natural na salin ng aorist na πίπτω; sapat nang ipinahihiwatig ng kasunod na pariralang “sa lupa” ang direksiyon ng pagbagsak.
- source_word: τε
  choice: '[hindi isinalin nang hiwalay]'
  rationale: Iniuugnay nito ang sugnay sa naunang salaysay; naipahahayag na sa Filipino ang daloy sa pamamagitan ng pagkakasunod ng mga sugnay at ng “at.”
- source_word: εἰς τὸ ἔδαφος
  choice: sa lupa
  rationale: Ito ang likas na ekspresyon sa Filipino para sa pagbagsak patungo sa ibabaw ng lupa.
- source_word: ἤκουσα
  choice: nakarinig ako
  rationale: Natural na salin ng aorist ng ἀκούω at malinaw na pinananatili ang unang panauhan.
- source_word: φωνῆς
  choice: isang tinig
  rationale: Ang genitive na kasunod ng ἀκούω ay likas na isinasalin bilang layon; ang “tinig” ay angkop dahil may kasunod itong tuwirang pananalita.
- source_word: λεγούσης μοι
  choice: na nagsasabi sa akin
  rationale: Pinananatili ang kasabay na kilos ng participle at ang dative na μοι.
- source_word: Σαοὺλ Σαούλ
  choice: Saulo, Saulo
  rationale: Ginagamit ang nakaugaliang anyong Filipino ng pangalan at pinananatili ang pag-uulit bilang mariing tuwirang pagtawag.
- source_word: τί
  choice: bakit
  rationale: Sa ganitong gamit, itinatanong ng τί ang dahilan ng kilos; “bakit” ang natural na katumbas sa Filipino.
- source_word: με
  choice: ako
  rationale: Tuwirang pinananatili ang unang-panauhang layon na tumutukoy sa nagsasalita.
- source_word: διώκεις
  choice: inuusig mo
  rationale: Sa konteksto ng pagkapoot at pang-aapi sa mga mananampalataya, “usigin” ang tiyak at natural na kahulugan; ipinakikita ng aspektong imperpektibo ang nagpapatuloy na gawain.
theological_decisions:
- issue: Ugnayan ng nagsasalita sa pag-uusig ni Saulo sa mga mananampalataya
  choice: Pinanatili ang tuwirang unang-panauhang “ako” nang walang paliwanag na idinagdag.
  alternative: Mga pagpapalawak gaya ng “ang aking mga tagasunod” o “ang aking bayan.”
  rationale: Nakasalalay ang teolohikal na bigat ng pahayag sa pagkilala ng nagsasalita na ang pag-uusig sa mga mananampalataya ay pag-uusig sa kaniya mismo. Dapat panatilihin ang pahayag at ang tensiyon nito nang hindi ito ipinapaliwanag sa loob ng salin.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Pinili ang “Saulo” bilang karaniwang anyong Filipino ng Σαούλ at ang “inuusig” bilang pamilyar ngunit dignidad na salitang angkop sa konteksto.
