base_translation:
  language: en
  yaml_path: translation/nt/acts/022/001.yaml
  text: Men[a], brothers and fathers, hear now my defense to you.
translation:
  language: tl
  text: “Mga lalaki, mga kapatid at mga ama, pakinggan ninyo ngayon ang aking pagtatanggol na inihaharap ko sa inyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοὶ
  choice: Mga kapatid
  rationale: Sa Filipino, ang literal na “mga lalaking kapatid” ay hindi natural bilang panawagan. Sapat na ipinahihiwatig ng “mga kapatid” ang magalang na pakikipagkapwa, habang ang kasunod na “mga ama” at ang konteksto ang nagpapanatili sa lalaking kausap ng Griyego.
- source_word: πατέρες
  choice: mga ama
  rationale: Pinananatili nito ang literal at magalang na katawagan sa nakatatanda o iginagalang na mga lalaki, nang hindi sila tahasang ginagawang mga opisyal na “matatanda.”
- source_word: ἀκούσατέ
  choice: pakinggan ninyo
  rationale: Ang pautos na “pakinggan ninyo” ay natural sa makabagong Filipino at malinaw na humihiling ng masusing pakikinig, hindi lamang pisikal na pagdinig.
- source_word: μου ... ἀπολογίας
  choice: ang aking pagtatanggol
  rationale: Ang ἀπολογία rito ay isang pormal na pagtatanggol o paliwanag, hindi paghingi ng paumanhin. Ang μου ay natural na ipinapahayag bilang paari.
- source_word: νυνὶ
  choice: ngayon
  rationale: Pinananatili ang diin sa agarang pakikinig sa pagtatanggol na ihaharap ni Pablo.
- source_word: πρὸς ὑμᾶς
  choice: sa harap ninyo
  rationale: Natural itong tumutukoy sa pagtatanggol na inihaharap at itinuturo sa mismong mga tagapakinig; iniiwasan din nito ang alanganing “pagtatanggol sa inyo,” na maaaring ipakahulugang pagtatanggol para sa kanila.
theological_decisions: []
translation_notes:
  register: Pormal at marangal na pananalita para sa isang pampublikong pagtatanggol, ngunit gumagamit ng karaniwan at malinaw na makabagong Filipino. Hindi isinama nang hiwalay ang literal na Ἄνδρες dahil magiging pilit ang “mga lalaki, mga kapatid at mga ama” sa Filipino; ang pagbati ay pinanatiling natural bilang “Mga kapatid at mga ama.”
