translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kumander” sa halip na teknikal na “tribuno” upang madaling maunawaan, habang pinanatili sa talababa ang impormasyong pangkasaysayan. Ang “magsisiyasat sana” ay pormal ngunit karaniwan, at hindi tahasang nilulutas sa pangunahing teksto ang paraan ng pagsisiyasat.
