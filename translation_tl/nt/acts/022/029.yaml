base_translation:
  language: en
  yaml_path: translation/nt/acts/022/029.yaml
  text: Therefore those who were about to examine him withdrew from him at once[b][a], and the tribune also became afraid when he realized that he was a Roman citizen and that he had bound him.
translation:
  language: tl
  text: Kaya, agad na lumayo sa kanya ang mga malapit nang magsiyasat sa kanya[a]. Natakot din ang kumander[b] nang malaman niyang mamamayang Romano si Pablo at na iginapos niya ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “yaong mga malapit nang magsiyasat sa kanya sa pamamagitan ng paghahagupit.” Ang pandiwang Griego ay maaaring tumukoy sa opisyal na pagsisiyasat, at nililinaw ng naunang talata na paghahagupit ang paraan nito.
    reason: lexical_alternative
  - marker: b
    text: Sa Griego, “chiliarch,” isang Romanong opisyal ng hukbo na may titulong kumander ng humigit-kumulang isang libong kawal, bagaman maaaring mag-iba ang aktuwal na bilang.
    reason: cultural_note
lexical_decisions:
- source_word: εὐθέως οὖν
  choice: Kaya agad
  rationale: Pinananatili ng “kaya” ang ugnayang bunga o hinuha sa naunang talata, at natural na ipinapahayag ng “agad” ang biglaang pagtugon.
- source_word: ἀπέστησαν ἀπ’ αὐτοῦ
  choice: lumayo sa kanya
  rationale: Natural na Tagalog para sa pag-atras o pagtigil sa nalalapit na gagawin kay Pablo.
- source_word: οἱ μέλλοντες αὐτὸν ἀνετάζειν
  choice: ang mga lalaking magsisiyasat sana sa kanya
  rationale: Ipinahihiwatig ng “sana” ang nakatakda ngunit hindi natuloy na opisyal na pagsisiyasat; hindi isinisingit sa teksto ang paghagupit, bagaman nililinaw iyon ng konteksto.
- source_word: χιλίαρχος
  choice: kumander
  rationale: Madaling maunawaan sa modernong Filipino at angkop sa Romanong opisyal na militar; inilalagay sa talababa ang mas tiyak na kontekstong pangkasaysayan.
- source_word: ἐφοβήθη
  choice: Natakot
  rationale: Tuwirang ipinapahayag ang paglitaw ng takot bilang tugon sa kanyang nalaman.
- source_word: ἐπιγνοὺς
  choice: nang malaman
  rationale: Natural na inilalarawan ang pagkatanto o pagkilala ng kumander sa legal na katayuan ni Pablo.
- source_word: Ῥωμαῖός ἐστιν
  choice: mamamayang Romano si Pablo
  rationale: Nililinaw na legal na pagkamamamayan ang tinutukoy, hindi lamang lahi; ang pagbanggit sa pangalan ay natural at iniiwasan ang malabong panghalip.
- source_word: αὐτὸν ἦν δεδεκώς
  choice: na naipagapos na niya ito
  rationale: Sinasalamin ang perpektong aspekto—naganap na ang paggapos at may nananatiling legal na kabuluhan—at natural na ipinahihiwatig ang pagpapatupad ng utos ng kumander.
