  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: προσελθὼν δὲ ὁ χιλίαρχος εἶπεν αὐτῷ· Λέγε μοι, ⸀σὺ Ῥωμαῖος εἶ; ὁ δὲ ἔφη· Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/027.yaml
  text: So the tribune came up and said to him[a], “Tell me, are you a Roman?” And he said[b], “Yes.”
translation:
  language: tl
  text: Kaya lumapit ang kumandante at sinabi sa kanya, “Sabihin mo sa akin, mamamayang Romano ka ba?[a]” Sumagot siya, “Oo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mamamayang Romano” ay tumutukoy sa isang taong may legal na pagkamamamayan ng Roma, gaya ng nililinaw ng nakapaligid na konteksto.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: lumapit
  rationale: Likas at tuwirang ipinapahayag ang paglapit ng opisyal kay Pablo bago ito nagsalita.
- source_word: δὲ
  choice: Kaya
  rationale: Sa konteksto, nagsisilbi itong pang-ugnay sa pagsulong ng salaysay, hindi bilang matinding pagsalungat.
- source_word: χιλίαρχος
  choice: kumandante
  rationale: Tumutukoy ito sa Romanong opisyal na namumuno sa isang malaking pangkat ng mga kawal. Mas madaling maunawaan ng karaniwang mambabasang Filipino ang “kumandante” kaysa sa teknikal na “tribuno.”
- source_word: εἶπεν αὐτῷ
  choice: sinabi sa kanya
  rationale: Pinananatili nito ang tahasang di-tuwirang layon na αὐτῷ at natural sa Filipino.
- source_word: Λέγε μοι
  choice: Sabihin mo sa akin
  rationale: Likas na katumbas ng pautos na pandiwa at datibong panghalip, habang pinananatili ang tuwirang lakas ng tanong.
- source_word: σὺ
  choice: ka
  rationale: Ang tahasang panghalip sa Griyego ay may bahagyang diin; likas itong naipahihiwatig sa ayos ng tanong sa Filipino nang hindi gumagamit ng mabigat na “ikaw mismo.”
- source_word: Ῥωμαῖος
  choice: mamamayang Romano
  rationale: Bagaman pang-uring ginamit bilang pangngalan ang salita, malinaw sa konteksto na legal na pagkamamamayan ng Roma ang tinutukoy. Ang saling ito ay natural at iwas sa posibleng pakahulugang simpleng taga-Roma lamang.
- source_word: Ναί
  choice: Oo
  rationale: Payak at tuwirang katumbas ng maikling sagot na pasang-ayon, nang walang idinagdag na salita.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kumandante” bilang madaling maunawaang katawagan sa Romanong opisyal; hindi na kailangan ang hiwalay na talababa para sa teknikal na ranggo sa maikling talatang ito. Ang lahat ng talababa ay may katugmang marker sa pangunahing teksto.
