  text: Ἁνανίας δέ τις ἀνὴρ ⸀εὐλαβὴς κατὰ τὸν νόμον μαρτυρούμενος ὑπὸ πάντων τῶν κατοικούντων Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/012.yaml
  text: A certain man[a], Ananias, devout according to the law, well spoken of by all the Jews living there,
translation:
  language: tl
  text: Isang lalaking nagngangalang Ananias, na deboto ayon sa Kautusan at mahusay na kinikilala ng lahat ng Judiong[a] naninirahan doon,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taga-Judea,” kung heograpiko-etniko ang kahulugan sa halip na tumukoy sa pamayanang Judio.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἁνανίας
  choice: Ananias
  rationale: Isinalin sa karaniwang anyong transliterado ng pangalang ito sa Filipino.
- source_word: δέ
  choice: hindi tinumbasan nang tahasan
  rationale: Mahinang panandang pandiskurso ito; sapat na sa Filipino ang daloy ng pangungusap at hindi kailangang dagdagan ng tahasang “ngayon” o “at.”
- source_word: τις ἀνὴρ
  choice: isang lalaki
  rationale: Pinananatili nito ang di-tiyak ngunit panlalaking pagtukoy; idinugtong ang “nagngangalang” upang maging natural ang pagpapakilala sa pangalang Ananias.
- source_word: εὐλαβὴς κατὰ τὸν νόμον
  choice: deboto ayon sa Kautusan
  rationale: Ipinahahayag ang taimtim na relihiyosong pamumuhay ni Ananias ayon sa Kautusang Judio, nang hindi nilalampasan ang saklaw ng Griyego.
- source_word: μαρτυρούμενος ὑπὸ πάντων
  choice: may magandang reputasyon sa lahat
  rationale: Natural na Filipino para sa pasibong diwang positibong pinatototohanan o pinupuri siya ng iba.
- source_word: τῶν κατοικούντων Ἰουδαίων
  choice: ng Judiong naninirahan doon
  rationale: Ang participle ay tumutukoy sa mga naninirahan sa lugar na binabanggit sa konteksto; ang “doon” ay likas na nagpapahayag nito sa Filipino.
theological_decisions:
- issue: Saklaw ng Ἰουδαίων
  choice: mga Judio
  alternative: mga taga-Judea
  rationale: Sa konteksto, ang tinutukoy ay ang pamayanang Judio na naninirahan sa Damasco, kaya mas nangingibabaw ang etniko-relihiyosong pagkakakilanlan kaysa heograpikong pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang malaking titik sa “Kautusan” dahil tumutukoy ito sa Kautusang Mosaiko. Inilagay ang talababa sa “Judiong,” ang salitang may tunay na alternatibong leksikal.
