  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ ὅτι τῇ Ἑβραΐδι διαλέκτῳ προσεφώνει αὐτοῖς μᾶλλον παρέσχον ἡσυχίαν. καὶ φησίν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/002.yaml
  text: 'But when they heard that he was addressing them in the Hebrew language[a], they became even more quiet. And he said:'
translation:
  language: tl
  text: 'Nang marinig nilang nagsasalita siya sa kanila sa wikang Hebreo[a], lalo pa silang tumahimik. At sinabi niya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “sa wikang Aramaiko.” Ang sabi sa Griyego ay “sa wikang Hebreo,” na sa kontekstong ito ay maaaring tumukoy sa lokal na wikang Semitiko ng Judea.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Nang marinig nila
  rationale: Ginawang likas na sugnay na panahunan sa Tagalog ang aorist participle. Hindi na tahasang isinalin ang δὲ sapagkat malinaw na sa daloy ang pagbabago ng reaksiyon at magiging pilit dito ang “ngunit.”
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: sa wikang Hebreo
  rationale: Pinananatili ang tahasang katawagan ng Griyego na “Hebreo,” samantalang inilalagay sa talababa ang posibleng pagtukoy nito sa Aramaic.
- source_word: προσεφώνει αὐτοῖς
  choice: nagsasalita siya sa kanila
  rationale: Ipinahihiwatig ng imperfect ang nagpapatuloy na pagsasalitang nakatuon sa mga nakikinig. Natural at malinaw ito sa modernong Tagalog.
- source_word: μᾶλλον παρέσχον ἡσυχίαν
  choice: lalo pa silang tumahimik
  rationale: Natural na ipinapahayag nito ang idyomang literal na “nagbigay sila ng higit na katahimikan” at pinananatili ang paghahambing na μᾶλλον.
- source_word: καὶ φησίν
  choice: 'At sinabi niya:'
  rationale: Isinalin sa karaniwang panahunang pasalaysay ang historical present; ipinahihiwatig ng tutuldok na kasunod ang talumpati ni Pablo.
theological_decisions:
- issue: Tinutukoy ng “wikang Hebreo”
  choice: Panatilihin ang “Hebreo” sa pangunahing teksto
  alternative: Unawain at isalin bilang “Aramaic”
  rationale: Ἑβραΐδι ang tahasang salita ng tekstong Griyego, ngunit maaari itong tumukoy sa lokal na wikang Semitiko, marahil ay Aramaic. Pinananatili ng pangunahing teksto ang anyo ng pinagmulan at ng talababa ang makasaysayang posibilidad nang hindi nilulutas ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “wikang Hebreo” sa halip na mas teknikal na “diyalektong Hebreo,” at pinanatili ang maikling transisyon patungo sa talumpati.
