  text: καὶ ἰδεῖν αὐτὸν λέγοντά μοι· Σπεῦσον καὶ ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ, διότι οὐ παραδέξονταί ⸀σου μαρτυρίαν περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/018.yaml
  text: and I saw him saying to me[a], ‘Hurry and get out of Jerusalem quickly, because they will not accept your testimony about me.’
translation:
  language: tl
  text: At nakita ko siyang nagsasabi sa akin, “Magmadali ka at umalis ka kaagad sa Jerusalem, sapagkat hindi nila tatanggapin[a] ang patotoo mo tungkol sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, tanggapin.
    reason: Leksikal na alternatibo para sa παραδέξονται; kapwa natural ang “tatanggapin” at “tanggapin” sa ganitong konteksto.
lexical_decisions:
- source_word: ἰδεῖν
  choice: nakita ko
  rationale: Bagaman pawatas ang anyo sa Griyego, ipinagpapatuloy nito ang salaysay ni Pablo tungkol sa pangitain. Ang may-taning na pandiwang “nakita ko” ang natural na katumbas sa Filipino.
- source_word: αὐτὸν λέγοντά μοι
  choice: siyang nagsasabi sa akin
  rationale: Pinananatili nito ang panghalip na tumutukoy sa naunang binanggit na Panginoon at ang participyal na paglalarawan sa kanya bilang nagsasalita kay Pablo, nang hindi nagdaragdag ng titulong wala sa talata.
- source_word: Σπεῦσον
  choice: Magmadali ka
  rationale: Ipinahahayag ng pautos na ito ang matinding pagmamadali sa natural at kasalukuyang Filipino.
- source_word: ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ
  choice: umalis ka kaagad sa Jerusalem
  rationale: Ang “umalis” ay natural na nagpapahayag ng paglabas mula sa lungsod, at ang “kaagad” ay nagpapanatili sa ikalawang pahayag ng pagmamadali sa Griyego.
- source_word: διότι
  choice: sapagkat
  rationale: Malinaw at marangal na pang-ugnay ito para sa dahilang kasunod ng utos.
- source_word: οὐ παραδέξονταί
  choice: hindi nila tatanggapin
  rationale: Sa kontekstong ito, ang παραδέχομαι ay tumutukoy sa pagtanggap o pagkilala nang may pagsang-ayon. Ang “tatanggapin” ang pinakanatural na gamit kasama ng “patotoo.”
- source_word: σου μαρτυρίαν
  choice: ang patotoo mo
  rationale: Ang “patotoo” ay nagpapanatili sa legal at pagpapahayag na diwa ng μαρτυρία at natural sa modernong Filipino.
- source_word: περὶ ἐμοῦ
  choice: tungkol sa akin
  rationale: Tumpak at natural na ipinahahayag nito ang paksa o tinutukoy ng patotoo.
theological_decisions:
- issue: Ang tinutukoy ng panghalip na αὐτόν sa pangitain ni Pablo
  choice: Pinanatili ang panghalip na “siya” sa “nakita ko siya,” gaya ng nasa Griyego.
  alternative: Tahasang isulat ang “Panginoon” o “Jesus.”
  rationale: Tinutukoy ng konteksto kung sino ang nagsasalita, ngunit panghalip lamang ang ginamit sa talatang ito. Iniiwasan nitong magdagdag ng interpretibong titulo sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang dobleng diin sa pagmamadali sa pamamagitan ng “Magmadali” at “kaagad.” Inilagay ang talababa sa “tatanggapin,” ang salitang aktuwal na may leksikal na alternatibo.
