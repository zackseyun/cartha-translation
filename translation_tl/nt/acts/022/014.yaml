  text: ὁ δὲ εἶπεν· Ὁ θεὸς τῶν πατέρων ἡμῶν προεχειρίσατό σε γνῶναι τὸ θέλημα αὐτοῦ καὶ ἰδεῖν τὸν δίκαιον καὶ ἀκοῦσαι φωνὴν ἐκ τοῦ στόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/014.yaml
  text: And he said[a], ‘The God of our fathers has appointed you to know his will, to see the Righteous One[b], and to hear a voice from his mouth,’
translation:
  language: tl
  text: At sinabi niya, “Pinili ka[a] ng Diyos ng ating mga ninuno upang malaman mo ang kanyang kalooban, makita ang Matuwid[b], at marinig ang isang tinig mula sa kanyang bibig.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Itinalaga ka.” Ang pandiwang Griyego ay maaaring mangahulugang pagpili o pagtatalaga sa isang gawain.
    reason: lexical_alternative
  - marker: b
    text: Ang “Matuwid” ay isang titulong tumutukoy kay Jesus; maaari ring isaling “ang Makatarungan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: At sinabi niya
  rationale: Natural na pagpapatuloy ng salaysay; hindi kailangang gawing tahasang pasalungat ang δέ rito.
- source_word: Ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: ang Diyos ng ating mga ninuno
  rationale: Tumpak na ipinahahayag ang ugnayan sa mga προγονong Israelita at mas natural sa kasalukuyang Filipino kaysa sa literal na “mga ama,” na maaaring mapagkamalang tumutukoy lamang sa agarang mga magulang.
- source_word: προεχειρίσατό σε
  choice: Pinili ka
  rationale: Ang προχειρίζομαι ay tumutukoy sa pagpili o pagtatalaga ng isang tao para sa isang layunin. Natural ang “pinili” sa Filipino, habang nililinaw sa talababa ang alternatibong “itinalaga.”
- source_word: γνῶναι τὸ θέλημα αὐτοῦ
  choice: upang malaman mo ang kanyang kalooban
  rationale: Pinananatili ang layuning ipinahihiwatig ng mga pawatas at ang malawak na kahulugan ng θέλημα bilang kalooban.
- source_word: ἰδεῖν τὸν δίκαιον
  choice: makita ang Matuwid
  rationale: Direktang salin ng ἰδεῖν at δίκαιος; ginamit bilang titulong tumutukoy kay Jesus ayon sa gamit nito sa Mga Gawa.
- source_word: ἀκοῦσαι φωνὴν ἐκ τοῦ στόματος αὐτοῦ
  choice: marinig ang tinig mula sa sarili niyang bibig
  rationale: Pinananatili ang kongkretong idyomang “mula sa kanyang bibig.” Ang “sarili niyang” ay natural na Filipino at nililinaw na ang tinig ay tuwirang mula sa Matuwid.
theological_decisions:
- issue: Kung ang τὸν δίκαιον ay titulo o karaniwang paglalarawan
  choice: Isinaling “ang Matuwid” bilang titulo para kay Jesus
  alternative: “ang isang matuwid” o “ang Makatarungan”
  rationale: Sa Mga Gawa 3:14 at 7:52, kinikilalang pantukoy kay Jesus ang pariralang ito. Ang malaking titik ay nagpapakita ng gamit bilang titulo nang hindi nagdaragdag ng pangalan.
- issue: Kung literal na “mga ama” ang πατέρων
  choice: “mga ninuno”
  alternative: “mga ama”
  rationale: Bagaman panlalaki ang anyong Griyego, sa pormulang ito ay tumutukoy ito sa mga ninuno ng Israel. Ang “mga ninuno” ang malinaw at likas na katumbas sa modernong Filipino at hindi binabago ang tipanang konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang sobrang literal na “mga ama” at pinanatili ang kongkretong larawan ng pagsasalitang nagmumula sa bibig. Parehong nasa pangunahing teksto ang mga panandang [a] at [b].
