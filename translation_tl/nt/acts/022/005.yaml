revisions:
- from: Gaya ng mapatutunayan tungkol sa akin ng pinakapunong pari at ng buong kapulungan ng matatandang pinuno. Tumanggap din ako sa kanila ng mga sulat para sa mga kapatid sa Damasco[a], at naglalakbay ako roon upang dalhin din sa Jerusalem, na nakagapos, ang mga naroon, nang sila ay maparusahan.
  to: Gaya rin ng mapatutunayan tungkol sa akin ng punong pari at ng buong kapulungan ng mga nakatatanda. Mula sa kanila ay tumanggap din ako ng mga sulat para sa mga kapatid sa Damasco[a], at naglalakbay ako roon upang dalhin sa Jerusalem, na nakagapos, maging ang mga naroon, nang sila ay maparusahan.
  rationale: Pinalitan ang mga katawagang hindi likas o hindi sapat na tumpak sa kasaysayang konteksto, at inayos ang pangungusap upang higit na luminaw ang layuning dalhin ang mga nasa Damasco sa Jerusalem bilang mga nakagapos. Pinanatili ang aspekto ng nagaganap na paglalakbay sa salaysay, ang “din/maging” para sa mga καί, at ang maingat na talababa sa ἀδελφοί.
