  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς καὶ ὁ ἀρχιερεὺς μαρτυρεῖ μοι καὶ πᾶν τὸ πρεσβυτέριον· παρ’ ὧν καὶ ἐπιστολὰς δεξάμενος πρὸς τοὺς ἀδελφοὺς εἰς Δαμασκὸν ἐπορευόμην ἄξων καὶ τοὺς ἐκεῖσε ὄντας δεδεμένους εἰς Ἰερουσαλὴμ ἵνα τιμωρηθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/005.yaml
  text: as also the high priest and the whole council of elders can testify for me. From them I also received letters to the brothers in Damascus[a], and I was traveling there to bring also those who were there, bound, to Jerusalem so that they might be punished.
translation:
  language: tl
  text: Gaya rin ng mapatutunayan tungkol sa akin ng punong pari at ng buong kapulungan ng mga nakatatanda. Mula sa kanila ay tumanggap din ako ng mga sulat para sa mga kapatid sa Damasco[a], at naglalakbay ako roon upang dalhin sa Jerusalem, na nakagapos, maging ang mga naroon, nang sila ay maparusahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kapatid na lalaki at babae.” “Mga kapatid” ang nasa Griyego, ngunit sa ilang konteksto ay maaari itong tumukoy sa mas malawak na pamayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς καὶ
  choice: Gaya ng
  rationale: Ipinakikilala nito ang patunay na nagpapatibay sa naunang pahayag ni Pablo; likas sa Filipino ang “Gaya ng mapatutunayan...”
- source_word: ὁ ἀρχιερεὺς
  choice: ang pinakapunong pari
  rationale: Malinaw na tumutukoy sa natatanging pangunahing awtoridad ng mga pari sa kontekstong ito.
- source_word: μαρτυρεῖ μοι
  choice: mapatutunayan tungkol sa akin
  rationale: Ipinahahayag ang kakayahan ng mga nabanggit na pagtibayin ang sinabi ni Pablo, nang hindi ipinapalagay na pabor sa kanya ang kanilang patotoo.
- source_word: πᾶν τὸ πρεσβυτέριον
  choice: ang buong kapulungan ng matatandang pinuno
  rationale: Ang πρεσβυτέριον ay isang kolektibong lupon, hindi lamang pangkat ng matatandang tao; nililinaw ng “mga pinuno” ang tungkulin nila.
- source_word: ἐπιστολάς
  choice: mga sulat
  rationale: Pinananatili ang payak na kahulugang leksikal; mahihinuha sa konteksto ang opisyal na gamit ng mga ito.
- source_word: πρὸς τοὺς ἀδελφοὺς
  choice: para sa mga kapatid
  rationale: Pinananatili ang katawagang pampangkat na ἀδελφοί nang hindi ipinapasok sa pangunahing teksto ang mas tiyak ngunit di-tahasang “mga kapwa Judio.”
- source_word: ἐπορευόμην
  choice: naglalakbay ako roon
  rationale: Ipinakikita ng aspektong imperpektibo ang patuloy na paglalakbay noon patungong Damasco.
- source_word: ἄξων
  choice: upang dalhin
  rationale: Ang panghinaharap na participle kasunod ng pandiwa ng paglalakbay ay nagpapahayag ng layunin.
- source_word: δεδεμένους
  choice: na nakagapos
  rationale: Pinananatili ang kalagayan nilang bihag, ngunit hindi nililimitahan sa tanikala ang paraan ng paggapos.
- source_word: ἵνα τιμωρηθῶσιν
  choice: nang sila ay maparusahan
  rationale: Malinaw na ipinahahayag ang layuning pagpaparusa nang hindi nagdaragdag ng tiyak na parusang hindi binanggit.
theological_decisions:
- issue: Saklaw ng ἀδελφοί sa pagtukoy sa pamayanan sa Damasco
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae; mga kapwa Judio
  rationale: Ang salitang Griyego ay panlalaking maramihan ngunit maaari, depende sa konteksto, na tumukoy sa mas malawak na pamayanan. Pinananatili sa teksto ang tradisyonal at likas na kolektibong “mga kapatid,” habang inilalahad sa talababa ang posibleng mas malawak na saklaw.
translation_notes:
  register: Makabago at marangal na Filipino, na may karaniwang bokabularyo at malinaw na ayos ng pangungusap. Ginamit ang “pinakapunong pari” at “kapulungan ng matatandang pinuno” upang maging madaling maunawaan nang hindi umaasa sa teknikal na terminong pansimbahan.
