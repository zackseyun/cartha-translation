base_translation:
  language: en
  yaml_path: translation/nt/acts/022/019.yaml
  text: And I said[a], ‘Lord[b], they themselves know that in every synagogue I was imprisoning and beating those who believe in you.’
translation:
  language: tl
  text: At sinabi ko, “Panginoon, sila mismo ay nakaaalam na noon ay ikinukulong at hinahampas ko sa bawat sinagoga ang mga sumasampalataya sa iyo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa iba’t ibang sinagoga.” Distributibo ang pariralang Griyego at tumutukoy sa paulit-ulit na pagkilos sa maraming sinagoga.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ εἶπον
  choice: At sinabi ko
  rationale: Likas at tuwirang salin ng καὶ ἐγώ at aorist na εἶπον; sapat na naipahihiwatig ng “ako” ang banayad na diin.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili ang magalang at kristolohikal na bigat ng pagtawag ni Pablo kay Jesus.
- source_word: αὐτοὶ ἐπίστανται
  choice: alam na alam nila
  rationale: 'Ipinahahayag ng reduplikasyong Filipino ang diin ng αὐτοί: ang mismong mga taong tinutukoy ay lubos na nakaaalam.'
- source_word: ἤμην φυλακίζων καὶ δέρων
  choice: ako noon ang nagkukulong at humahampas
  rationale: Ang “noon” at mga pandiwang nasa aspektong nagaganap ay naghahatid ng patuloy o nakagawiang kilos sa nakaraan na ipinahihiwatig ng periphrastic imperfect.
- source_word: κατὰ τὰς συναγωγάς
  choice: sa bawat sinagoga
  rationale: 'Natural na Filipino para sa distributibong κατά: paulit-ulit ang kilos sa iba’t ibang sinagoga.'
- source_word: τοὺς πιστεύοντας ἐπὶ σέ
  choice: mga sumasampalataya sa iyo
  rationale: Karaniwan, malinaw, at angkop sa dignidad ng teksto; pinananatili ang pananampalatayang nakatuon kay Jesus.
theological_decisions:
- issue: Pagtawag kay Jesus bilang κύριος
  choice: Panginoon
  alternative: Ginoo
  rationale: Ang “Panginoon” ay nagpapanatili sa paggalang at posibleng kristolohikal na bigat nang hindi dinaragdagan ang sinasabi ng teksto.
- issue: Aspekto ng dating pag-uusig ni Pablo
  choice: ako noon ang nagkukulong at humahampas
  alternative: ikinukulong at hinahampas ko noon
  rationale: Pinananatili ng napiling anyo ang diin sa “ako” at ang paulit-ulit o nakagawiang pagkilos sa nakaraan.
- issue: Kahulugan ng πιστεύοντας ἐπὶ σέ
  choice: sumasampalataya sa iyo
  alternative: nagtitiwala sa iyo
  rationale: Ang “sumasampalataya” ay natural sa konteksto at hindi inaalis ang saklaw na pagtitiwala na taglay ng pandiwa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “humahampas” sa halip na mas teknikal na “humahagupit” upang hindi tukuyin nang higit sa Griyego ang uri ng pambubugbog. Inilipat ang talababa sa pariralang talagang tinutukoy nito.
