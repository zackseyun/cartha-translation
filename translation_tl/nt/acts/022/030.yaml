revisions:
- from: Kinabukasan naman, nais ng kumandante na matiyak kung ano ang ipinararatang ng mga Judio[a] laban kay Pablo. Kaya kinalagan niya si Pablo at ipinag-utos na magtipon ang mga punong pari at ang buong kapulungan[b]. Pagkatapos, dinala niya si Pablo pababa at pinatayo sa harap nila.
  to: Kinabukasan naman, dahil nais ng kumandante na malaman nang may katiyakan kung ano ang ipinararatang ng mga Judio[a] laban kay Pablo, inalisan niya si Pablo ng mga gapos at ipinag-utos na magtipon ang mga punong pari at ang buong kapulungan[b]. Pagkatapos, dinala niya si Pablo pababa at pinatayo sa harap nila.
  rationale: Nilinaw ang idiomang γνῶναι τὸ ἀσφαλές bilang “malaman nang may katiyakan,” ginawang mas tiyak at natural ang ἔλυσεν αὐτόν batay sa konteksto ng pagkakagapos, at inalis ang hindi kailangang pahiwatig ng sanhi sa “Kaya.” Napanatili ang pagkakasunod ng mga kilos, ang “mga Judio” para sa Ἰουδαίων, at ang mga angkla at nilalaman ng talababa.
