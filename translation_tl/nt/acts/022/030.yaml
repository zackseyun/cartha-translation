id: ACT.22.30
reference: Acts 22:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον βουλόμενος γνῶναι τὸ ἀσφαλὲς τὸ τί κατηγορεῖται ⸀ὑπὸ τῶν Ἰουδαίων ἔλυσεν ⸀αὐτόν, καὶ ἐκέλευσεν ⸀συνελθεῖν τοὺς ἀρχιερεῖς καὶ ⸀πᾶν τὸ ⸀συνέδριον, καὶ καταγαγὼν τὸν Παῦλον ἔστησεν εἰς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/030.yaml
  text: But on the next day[a], wanting to know for certain what he was being accused of by the Jews, he released him and ordered the chief priests and the whole council to assemble; and bringing Paul down[b], he set him before them.
translation:
  language: tl
  text: Kinabukasan naman, dahil nais ng kumandante na malaman nang may katiyakan kung ano ang ipinararatang ng mga Judio[a] laban kay Pablo, inalisan niya si Pablo ng mga gapos at ipinag-utos na magtipon ang mga punong pari at ang buong kapulungan[b]. Pagkatapos, dinala niya si Pablo pababa at pinatayo sa harap nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pinunong Judio” o “mga taga-Judea.” Sa Griyego ay “mga Judio”; sa kontekstong ito, tumutukoy ito sa mga nagpaparatang kay Pablo, hindi sa lahat ng Judio nang walang pagtatangi.
    reason: lexical_alternative
  - marker: b
    text: Ang “kapulungan” ay tumutukoy sa Sanhedrin, ang namamahalang konseho ng mga Judio sa Jerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Kinabukasan naman
  rationale: Likas na salin ng temporal na idyomang ‘sa sumunod na araw’; ipinahihiwatig ng ‘naman’ ang banayad na paglipat ng salaysay na dala ng δέ.
- source_word: βουλόμενος γνῶναι τὸ ἀσφαλές
  choice: nais ... na matiyak
  rationale: Pinagsasama nito ang layunin ng βουλόμενος at ang diwa ng pag-alam nang may katiyakan sa γνῶναι τὸ ἀσφαλές.
- source_word: τὸ τί κατηγορεῖται ὑπὸ τῶν Ἰουδαίων
  choice: kung ano ang ipinararatang ng mga Judio laban kay Pablo
  rationale: Pinananatili ang pasibong diwa ng κατηγορεῖται at ang tahasang katawagang ‘mga Judio,’ habang nililinaw sa konteksto na ang tinutukoy ay ang mga nagpaparatang kay Pablo.
- source_word: ἔλυσεν αὐτόν
  choice: kinalagan niya si Pablo
  rationale: Ang λύω ay maaaring mangahulugang kalagan o pakawalan. Dito, dahil nananatili si Pablo sa kustodiya at agad siyang iniharap sa kapulungan, mas tiyak ang ‘kinalagan’ kaysa ‘pinalaya.’
- source_word: ἐκέλευσεν συνελθεῖν
  choice: ipinag-utos na magtipon
  rationale: Malinaw na ipinapahayag ang awtoritatibong utos ng κελεύω at ang sama-samang pagtitipon ng συνελθεῖν.
- source_word: τοὺς ἀρχιερεῖς
  choice: mga punong pari
  rationale: Karaniwang katawagan sa mga pangunahing awtoridad na pari; iniiwasan nitong ipahiwatig na maraming sabay-sabay na nanunungkulang pinakapunong pari.
- source_word: πᾶν τὸ συνέδριον
  choice: ang buong kapulungan
  rationale: Isinasalin ang συνέδριον bilang isang namamahalang kapulungan at pinananatili ng ‘buong’ ang πᾶν.
- source_word: καταγαγὼν τὸν Παῦλον
  choice: dinala niya si Pablo pababa
  rationale: Pinananatili ang direksiyong ipinahihiwatig ng καταγαγών, malamang mula sa himpilan o tanggulan patungo sa pulungan.
- source_word: ἔστησεν εἰς αὐτούς
  choice: pinatayo sa harap nila
  rationale: Likas na Filipino para sa pagpapaharap kay Pablo sa mga nagkakatipon, habang pinananatili ang sanhiang diwa ng ἔστησεν.
theological_decisions:
- issue: Saklaw ng Ἰουδαίων sa salaysay ng Mga Gawa
  choice: mga Judio
  alternative: mga pinunong Judio; mga taga-Judea
  rationale: Tahasan sa Griyego ang Ἰουδαίων. Pinananatili ng salin ang leksikal na katawagan at hindi tahimik na nililimitahan ito sa mga pinuno, ngunit ipinapaliwanag sa talababa na sa kontekstong ito ay ang mga nagpaparatang ang tinutukoy, hindi ang lahat ng Judio nang walang pagtatangi.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Hinati sa tatlong pangungusap ang mahabang pangungusap na Griyego upang maging malinaw ang sunod-sunod na kilos nang hindi binabago ang ugnayan ng mga ideya. Ginamit ang ‘kumandante’ upang gawing malinaw ang pahiwatig na simuno mula sa naunang konteksto.
