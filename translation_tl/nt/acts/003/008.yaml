  terminology: Ang “templo” at “Diyos” ay angkop at pare-pareho sa karaniwang modernong Filipino na gamit. Ang “lumulundag” ay mahusay na nagpapanatili ng patuloy o inuulit na kilos sa huling serye ng mga participle.
