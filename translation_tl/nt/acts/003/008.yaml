  text: καὶ ἐξαλλόμενος ἔστη καὶ περιεπάτει, καὶ εἰσῆλθεν σὺν αὐτοῖς εἰς τὸ ἱερὸν περιπατῶν καὶ ἁλλόμενος καὶ αἰνῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/008.yaml
  text: And leaping up, he stood and began to walk, and he entered the temple with them, walking and jumping and praising God.
translation:
  language: tl
  text: At lumundag siya, tumayo at nagsimulang maglakad. Pumasok siya sa templo kasama nila, habang naglalakad, lumulundag, at nagpupuri sa Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαλλόμενος
  choice: paglukso niya
  rationale: Ipinahahayag ang bigla at masiglang paglukso bago siya tumayo; pinananatili ang pagkakaiba nito sa sumunod na ἁλλόμενος.
- source_word: περιεπάτει
  choice: nagsimulang maglakad
  rationale: Ang imperpektong anyo ay likas na maisasalin dito bilang pagsisimula at pagpapatuloy ng paglakad.
- source_word: τὸ ἱερόν
  choice: templo
  rationale: Sa konteksto ng Mga Gawa, tumutukoy ito sa malawak na bakuran o kompleks ng templo, ngunit ang natural at karaniwang salin sa Filipino ay 'templo'.
- source_word: ἁλλόμενος
  choice: lumulundag
  rationale: Natural na Filipino para sa paulit-ulit na masayang pagtalon habang naglalakad; hindi nito inuulit nang eksakto ang unang 'paglukso'.
- source_word: αἰνῶν τὸν θεόν
  choice: nagpupuri sa Diyos
  rationale: Tuwirang inililipat ang patuloy na pagpupuri na ipinahahayag ng participle.
