  text: ἐπεγίνωσκον ⸀δὲ αὐτὸν ὅτι ⸀οὗτος ἦν ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος ἐπὶ τῇ Ὡραίᾳ Πύλῃ τοῦ ἱεροῦ, καὶ ἐπλήσθησαν θάμβους καὶ ἐκστάσεως ἐπὶ τῷ συμβεβηκότι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/010.yaml
  text: And they recognized him[a], that this was the man who used to sit for alms at the Beautiful Gate of the temple[b], and they were filled with amazement and astonishment at what had happened to him.
translation:
  language: tl
  text: Nakilala nilang siya nga ang lalaking dating nauupo upang humingi ng limos[a] sa Magandang Pintuan ng templo[b], at napuspos sila ng pagkamangha at matinding pagtataka sa nangyari sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ang nakaupo para sa limos.” Ipinakikita ng “dating nauupo” na nakagawian niya itong gawin bago siya gumaling.'
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego na ἱερόν ay tumutukoy sa buong bakuran o kompleks ng templo, hindi lamang sa panloob na santuwaryo (ναός).
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεγίνωσκον
  choice: Nakilala nila
  rationale: Ipinahihiwatig ng imperfect ang pagkilala ng mga tao habang pinagmamasdan nila siya; natural sa salaysay ang “nakilala nila.”
- source_word: δὲ
  choice: at
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay, hindi nagpapakita ng mariing pagsalungat.
- source_word: οὗτος ἦν
  choice: siya nga
  rationale: Pinananatili ng “nga” ang mariing pagtukoy na ang gumaling na lalaki ay siya ring kilalang namamalimos.
- source_word: ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος
  choice: ang lalaking dating nauupo upang humingi ng limos
  rationale: Ipinakikita ng “dating nauupo” ang nakagawiang kalagayan niya bago gumaling, samantalang malinaw na inilalahad ng “upang humingi ng limos” ang layunin ng pag-upo niya.
- source_word: ἐλεημοσύνην
  choice: limos
  rationale: Ang “limos” ang karaniwan at tiyak na salitang Filipino para sa salapi o tulong na ibinibigay sa dukha.
- source_word: ἐπὶ τῇ Ὡραίᾳ Πύλῃ
  choice: sa Magandang Pintuan
  rationale: Ginagamit ang parirala bilang pangalan o kinikilalang katawagan sa pintuan; ang “Magandang Pintuan” ay malinaw at natural sa Filipino.
- source_word: τοῦ ἱεροῦ
  choice: ng templo
  rationale: Ang “templo” ang natural na salin, bagaman ang ἱερόν ay tumutukoy sa kabuuang bakuran o kompleks ng templo, hindi lamang sa panloob na santuwaryo.
- source_word: ἐπλήσθησαν
  choice: napuspos sila
  rationale: Pinananatili nito ang larawang sila ay lubusang napuno o dinaig ng matinding damdamin.
- source_word: θάμβους
  choice: pagkamangha
  rationale: Tumutukoy ito sa matinding pagtatakang may paghanga o pagkabigla.
- source_word: ἐκστάσεως
  choice: matinding pagtataka
  rationale: Sa konteksto, tumutukoy ito sa pagiging halos wala sa sarili dahil sa pagkagulat, hindi sa mistikong ekstasi.
- source_word: ἐπὶ τῷ συμβεβηκότι αὐτῷ
  choice: sa nangyari sa kanya
  rationale: Malinaw at natural nitong ipinahahayag ang pangyayaring naganap sa lalaki at ang patuloy na epekto nito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “siya nga” upang mapanatili ang mariing pagkilala sa lalaki, at pinanatiling magkaiba ang “pagkamangha” at “matinding pagtataka” para katawanin ang dalawang magkaugnay ngunit hindi ganap na magkaparehong damdamin sa Griyego.
