id: ACT.3.17
reference: Acts 3:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ νῦν, ἀδελφοί, οἶδα ὅτι κατὰ ἄγνοιαν ἐπράξατε, ὥσπερ καὶ οἱ ἄρχοντες ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/017.yaml
  text: And now[a], brothers, I know that you acted in ignorance, just as your rulers also did.
translation:
  language: tl
  text: At ngayon, mga kapatid[a], alam kong kumilos kayo dahil sa kawalan ng kaalaman, gaya rin ng ginawa ng inyong mga pinuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “mga kapatid na lalaki”; maaari itong gamitin bilang pagtawag sa mas malawak na pangkat na kinabibilangan din ng mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ νῦν
  choice: At ngayon
  rationale: Likas na panandang pangdiskurso sa Tagalog na pinananatili ang pang-ugnay na καί at ang temporal na νῦν.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay likas at marangal na katumbas sa Tagalog; maaari itong tumukoy sa mga lalaki o sa mas malawak na pangkat depende sa konteksto.
- source_word: οἶδα
  choice: alam kong
  rationale: Tuwirang ipinahahayag ang kaalaman ni Pedro at natural ang pagkakaugnay nito sa kasunod na sugnay.
- source_word: κατὰ ἄγνοιαν
  choice: dahil sa kawalan ng kaalaman
  rationale: Ipinahahayag ang pagkilos na nagmula sa hindi pagkaalam nang hindi ipinahihiwatig na wala na silang pananagutan.
- source_word: ἐπράξατε
  choice: kumilos kayo
  rationale: Pinananatili ang pangkalahatang saklaw ng πράσσω at hindi nagdaragdag ng tahasang layon na wala sa talata.
- source_word: ὥσπερ καὶ
  choice: gaya rin ng ginawa
  rationale: Natural na inililipat sa Tagalog ang paghahambing at ang dagdag na diwa ng καί.
- source_word: οἱ ἄρχοντες ὑμῶν
  choice: inyong mga pinuno
  rationale: Ang “mga pinuno” ay malinaw at kasalukuyang katawagan para sa mga may kapangyarihang pampolitika at panrelihiyon sa konteksto.
theological_decisions:
- issue: Kung ang pahayag tungkol sa kawalan ng kaalaman ay dapat magpawalang-sala sa mga kumilos
  choice: Panatilihin ang “dahil sa kawalan ng kaalaman” nang hindi sinasabing nawawala ang pananagutan.
  alternative: “nang hindi ninyo nalalaman,” na maaaring marinig bilang mas ganap na pagpapawalang-sala
  rationale: Kinikilala ng talata ang kawalan ng kaalaman bilang salik, ngunit nananatili sa konteksto ang panawagan sa pagsisisi sa talata 19. Pinananatili ng salin ang tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “mga kapatid” sapagkat karaniwan itong hindi minamarkahan para sa kasarian sa Tagalog, habang nililinaw sa talababa ang anyong panlalaki ng salitang Griyego.
