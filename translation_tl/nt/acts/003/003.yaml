  yaml_path: translation/nt/acts/003/003.yaml
  text: When he saw Peter and John about to go into the temple, he began asking to receive alms.
translation:
  language: tl
  text: Nang makita niya sina Pedro at Juan na papasok na sa templo[a], ay nanghihingi siya sa kanila ng limos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego na ἱερόν ay tumutukoy sa mga bakuran o sa buong kompleks ng templo, hindi lamang sa panloob na santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἰδών
  choice: Nang makita niya
  rationale: Ginawang likas na sugnay na temporal sa Tagalog ang panghalip na tumutukoy sa lalaking pilay at ang aorist participle; pinananatili nito ang ugnayang ‘nang makita niya.’
- source_word: Πέτρον καὶ Ἰωάννην
  choice: sina Pedro at Juan
  rationale: Ginamit ang karaniwang anyo ng mga pangalan sa Tagalog at ang pantukoy na ‘sina’ para sa dalawang tao.
- source_word: μέλλοντας εἰσιέναι
  choice: na papasok na
  rationale: Ipinahihiwatig ng μέλλω kasama ng pawatas ang nalalapit na kilos; natural na ipinapahayag ito ng ‘papasok na’ sa Tagalog.
- source_word: εἰς τὸ ἱερόν
  choice: sa templo
  rationale: Likas sa Tagalog ang ‘pumasok sa templo.’ Ang ἱερόν ay tumutukoy sa bakuran o buong kompleks ng templo, kaya nilinaw ito sa talababa.
- source_word: ἠρώτα
  choice: humingi siya
  rationale: Ang imperfect ay maaaring magpahiwatig ng nagpapatuloy o paulit-ulit na paghingi, ngunit sa kontekstong ito ay natural at sapat ang ‘humingi’; hindi ipinapasok ang di-tiyak na diin na ‘nagsimulang.’
- source_word: ἐλεημοσύνην λαβεῖν
  choice: ng limos
  rationale: Sa Tagalog, ang ‘humingi ng limos’ ay likas at malinaw na katumbas ng paghinging makatanggap ng tulong para sa dukha; hindi na kailangang tahasang ulitin ang ‘tumanggap.’
