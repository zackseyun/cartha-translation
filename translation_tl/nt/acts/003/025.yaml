  to: Kayo ang mga anak[a] ng mga propeta at ng tipang ginawa ng Diyos sa inyong mga ninuno, nang sabihin niya kay Abraham, ‘At sa iyong binhi[b] pagpapalain ang lahat ng angkan sa daigdig.’
