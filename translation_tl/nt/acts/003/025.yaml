id: ACT.3.25
reference: Acts 3:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑμεῖς ἐστε ⸀οἱ υἱοὶ τῶν προφητῶν καὶ τῆς διαθήκης ἧς ⸂διέθετο ὁ θεὸς⸃ πρὸς τοὺς πατέρας ⸀ὑμῶν, λέγων πρὸς Ἀβραάμ Καὶ ἐν τῷ σπέρματί σου ⸀ἐνευλογηθήσονται πᾶσαι αἱ πατριαὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/025.yaml
  text: You are the sons of the prophets and of the covenant that God made with your fathers[a], saying to Abraham[b], ‘And in your offspring all the families of the earth will be blessed.’
translation:
  language: tl
  text: Kayo ang mga anak[a] ng mga propeta at ng tipang ginawa ng Diyos sa inyong mga ninuno, nang sabihin niya kay Abraham, ‘At sa iyong binhi[b] pagpapalain ang lahat ng angkan sa daigdig.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga anak na lalaki.” Sa Griyego, “mga anak na lalaki,” isang pananalitang tumutukoy sa mga tagapagmana o kabahagi sa tipan.
    reason: lexical_alternative
  - marker: b
    text: Ang “binhi” ay maaaring tumukoy nang sama-sama sa mga inapo ni Abraham at maaari ring magtaglay ng diwang tumutukoy sa isang kinatawan.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: mga anak na lalaki
  rationale: Pinananatili ang panlalaking anyo ng Griyego at ang diwa ng mga tagapagmana o kabahagi sa tipan; nililinaw sa talababa na kinakatawan nito ang mga anak sa mas malawak na diwa.
- source_word: προφητῶν
  choice: ng mga propeta
  rationale: Tuwirang genitibong salin; tumutukoy sa mga nakikibahagi sa pamanang ipinangako sa pamamagitan ng mga propeta, hindi kinakailangang mga literal na inapo nila.
- source_word: διαθήκης
  choice: tipan
  rationale: Ang 'tipan' ang likas at wastong katawagan sa kontekstong biblikal ng pangako ng Diyos kay Abraham at sa mga ninuno.
- source_word: διέθετο
  choice: ginawa
  rationale: Sa kasama ng διαθήκη, nangangahulugan itong gumawa o magtatag ng tipan; natural sa Filipino ang 'ginawa ang tipan.'
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: sa inyong mga ninuno
  rationale: Ang 'mga ninuno' ay natural at saklaw ang mga patriyarka; ang ugnayang ipinahihiwatig ng πρός ay malinaw sa pariralang 'tipang ginawa ... sa.'
- source_word: λέγων πρὸς Ἀβραάμ
  choice: nang sabihin niya kay Abraham
  rationale: Ginagawang likas na sugnay sa Filipino ang participle habang malinaw na Diyos ang nagsasalita.
- source_word: σπέρματί
  choice: binhi
  rationale: Pinananatili ng 'binhi' ang metaporang biblikal at ang tunay na kalabuan sa pagitan ng kolektibong mga inapo at ng maaaring isahang kinatawan.
- source_word: ἐν
  choice: sa pamamagitan ng
  rationale: Sa siping pangako, natural na ipinapahayag nito ang paraang o tagapamagitan ng pagpapala; hindi nito pinipilit kung kolektibo o isahan ang binhi.
- source_word: ἐνευλογηθήσονται
  choice: pagpapalain
  rationale: Tuwirang future passive na salin at natural sa makabagong Filipino.
- source_word: πατριαὶ
  choice: mga angkan
  rationale: Mas tiyak na katumbas ng mga pangkat-pamilyang tinutukoy ng πατριά kaysa sa payak na 'mga pamilya,' habang nauunawaan pa rin ng karaniwang mambabasa.
- source_word: γῆς
  choice: lupa
  rationale: Sa pangkalahatang saklaw ng pangako, ang 'lupa' ay tumutukoy sa buong daigdig, hindi lamang sa isang partikular na lupain.
theological_decisions:
- issue: Panlalaking katawagang kumakatawan sa mga tagapagmana sa υἱοὶ
  choice: mga anak na lalaki
  alternative: mga anak
  rationale: Pinananatili sa pangunahing teksto ang panlalaking anyo at pahiwatig ng pagiging tagapagmana sa tipan, habang ipinapaliwanag sa talababa ang mas malawak na saklaw nito.
- issue: Kolektibo at maaaring isahang diwa ng σπέρμα
  choice: binhi
  alternative: supling; mga inapo
  rationale: Ang 'binhi' ay hindi agad nagtatakda kung maramihan o isahan ang tinutukoy, kaya napapanatili ang tensiyong nasa wikang pinagmulan at sa paggamit nito sa teolohiyang biblikal.
- issue: Lakas ng ἐν sa pangakong Abrahamiko
  choice: sa pamamagitan ng iyong binhi
  alternative: sa iyong binhi
  rationale: Natural sa Filipino ang instrumental na pagbasa sa konteksto ng pagpapala, ngunit hindi nito tinutukoy nang higit sa teksto ang identidad o bilang ng binhi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'mga ninuno' sa halip na mas makalumang 'mga ama,' at 'angkan' upang mapanatili ang saklaw ng πατριαί. Ang 'binhi' ay bahagyang biblikal ang himig ngunit malinaw at mahalaga upang mapanatili ang leksikal at teolohikal na kalabuan ng σπέρμα.
