id: ACT.3.18
reference: Acts 3:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ἃ προκατήγγειλεν διὰ στόματος πάντων τῶν ⸀προφητῶν παθεῖν τὸν χριστὸν ⸀αὐτοῦ ἐπλήρωσεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/018.yaml
  text: But God thus fulfilled what he had announced beforehand through the mouth of all the prophets[b][a], that his Messiah would suffer.
translation:
  language: tl
  text: 'Ngunit sa ganitong paraan tinupad ng Diyos ang ipinahayag na niya noon pa sa pamamagitan ng bibig ng lahat ng propeta[a]: magdurusa ang kanyang Mesiyas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa pamamagitan ng lahat ng propeta.” Mas literal sa Griyego ang “sa pamamagitan ng bibig ng lahat ng propeta.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “kanyang Cristo”; isinalin ditong “kanyang Mesiyas” sapagkat ginagamit ang Χριστός bilang titulo.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang pagsalungat sa ginawa ng mga tagapakinig na binanggit sa naunang talata.
- source_word: προκατήγγειλεν
  choice: ipinahayag na niya noon pa
  rationale: Natural na ipinapahayag sa Tagalog kapwa ang paunang panahon at ang hayagang pagpapahayag na taglay ng pandiwa.
- source_word: διὰ στόματος πάντων τῶν προφητῶν
  choice: sa pamamagitan ng bibig ng lahat ng propeta
  rationale: Pinananatili ang konkretong idyomang biblikal at ang saklaw ng πάντων, habang malinaw pa rin sa makabagong mambabasa.
- source_word: παθεῖν
  choice: magdurusa
  rationale: Ipinapahayag nang natural ang nilalaman ng naunang pahayag nang hindi idinaragdag ang mas tahasang diwang 'kailangang' wala sa anyong ito lamang.
- source_word: τὸν χριστὸν αὐτοῦ
  choice: ang kanyang Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulo; pinananatili rin ang kaugnayan ng Mesiyas sa Diyos na ipinahihiwatig ng αὐτοῦ.
- source_word: ἐπλήρωσεν
  choice: tinupad
  rationale: Karaniwan, malinaw, at angkop na salin sa konteksto ng katuparan ng ipinahayag ng mga propeta.
- source_word: οὕτως
  choice: sa ganitong paraan
  rationale: 'Ipinakikita ang paraan ng pagtupad: sa pamamagitan ng pagdurusang katatapos lamang ilarawan.'
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa talumpating ito ni Pedro, ang salita ay gumaganap bilang titulong mesiyaniko sa halip na pangunahing maging pantanging pangalan.
- issue: Lakas ng modal na diwa ng παθεῖν
  choice: magdurusa
  alternative: kailangang magdusa
  rationale: Inilalahad nito ang nilalaman ng propesiya nang hindi tahasang nagdaragdag ng diwa ng pangangailangan na hindi ipinahahayag ng infinitive lamang.
translation_notes:
  register: Makabago at dignified na Filipino; pinanatili ang biblikal na idyomang “sa pamamagitan ng bibig” at gumamit ng tutuldok upang malinaw na ipakilala ang nilalaman ng naunang pahayag.
