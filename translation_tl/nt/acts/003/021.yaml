id: ACT.3.21
reference: Acts 3:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃν δεῖ οὐρανὸν μὲν δέξασθαι ἄχρι χρόνων ἀποκαταστάσεως πάντων ὧν ἐλάλησεν ὁ θεὸς διὰ ⸀στόματος τῶν ἁγίων ⸂ἀπ’ αἰῶνος αὐτοῦ προφητῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/021.yaml
  text: whom heaven must receive until the times of the restoration of all things that God spoke through the mouth of his holy prophets from of old.
translation:
  language: tl
  text: Siya ay kailangang tanggapin ng langit hanggang sa mga panahon ng pagpapanumbalik ng lahat ng bagay na sinabi ng Diyos sa pamamagitan ng bibig ng kanyang mga banal na propeta mula pa noong unang panahon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃν
  choice: Siya
  rationale: Tumutukoy kay Jesus sa naunang talata; ginawang tahasang simula ng pangungusap upang maging likas sa Tagalog.
- source_word: δεῖ ... δέξασθαι
  choice: kailangang tanggapin
  rationale: Pinananatili ang diwa ng banal na pangangailangan sa δεῖ at ang karaniwang kahulugan ng δέχομαι.
- source_word: οὐρανὸν
  choice: ng langit
  rationale: Pinananatili ang langit bilang simuno ng pagtanggap, gaya ng ayos at diwa ng Griyego.
- source_word: ἄχρι χρόνων
  choice: hanggang sa mga panahon
  rationale: Iginagalang ang maramihang χρόνοι at ang hangganang temporal ng ἄχρι.
- source_word: ἀποκαταστάσεως πάντων
  choice: pagpapanumbalik ng lahat ng bagay
  rationale: Malapit sa leksikal na diwa ng ganap na pagsasauli o pagpapanumbalik, nang hindi nilulutas ang saklaw ng πάντων.
- source_word: ὧν ἐλάλησεν ὁ θεὸς
  choice: na sinabi ng Diyos
  rationale: Pinananatili ang posibleng tuwirang kaugnayan ng panghalip sa 'lahat ng bagay,' alinsunod sa source text at audited consultation layer, sa halip na idagdag ang 'tungkol sa.'
- source_word: διὰ στόματος
  choice: sa pamamagitan ng bibig
  rationale: Pinananatili ang Semitikong idyoma ng pagsasalita ng Diyos sa pamamagitan ng mga propeta.
- source_word: ἀπ’ αἰῶνος
  choice: mula pa noong unang panahon
  rationale: Natural na Tagalog para sa temporal na idyomang nangangahulugang mula pa sa napakatagal na nakaraan.
theological_decisions:
- issue: Saklaw ng 'pagpapanumbalik ng lahat ng bagay'
  choice: Pinanatili ang malawak at hindi espesipikong pananalita ng teksto.
  alternative: Ipaliwanag ito bilang pansansinukob na kaligtasan o bilang pagpapanumbalik lamang ng Israel.
  rationale: Hindi tahasang nililinaw ng talata ang eksaktong saklaw; ang alinmang pagpapakitid o pagpapalawak ay mag-aangkat ng interpretasyong lampas sa teksto.
- issue: Kaugnayan ng ὧν
  choice: Isinalin bilang 'na sinabi ng Diyos,' na nag-uugnay sa 'lahat ng bagay.'
  alternative: Isalin bilang 'na tungkol dito ay sinabi ng Diyos' o 'tungkol sa mga iyon.'
  rationale: Ang anyong Griyego ay maaaring unawain sa estrukturang ito nang hindi nagdaragdag ng preposisyong 'tungkol sa'; pinananatili nito ang tunay na sintaktikong tensiyon.
- issue: Ang langit bilang tumatanggap kay Jesus
  choice: Pinanatili ang 'tanggapin ng langit.'
  alternative: Gawing 'manatili siya sa langit.'
  rationale: Ang alternatibo ay mas idiomatiko ngunit pinapalitan ang larawan at pandiwa ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na pormal ngunit madaling maunawaan. Pinanatili ang biblikal na larawang 'sa pamamagitan ng bibig' at ang teolohikal na kalabuan ng 'lahat ng bagay.'
