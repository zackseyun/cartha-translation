  source_fidelity: Kailangang ipakita ng salin ang imperfect na ἀνέβαινον. Ang “Umakyat” ay naglalahad ng natapos na kilos at hindi natitira ang aspektong nagaganap ng Griyego. Ang “Paakyat” ay natural na nagpapahiwatig na sila ay nasa pagkilos na pag-akyat/pagpunta sa templo. Napananatili rin ang ἱερόν bilang “templo,” ang takdang oras ng panalangin, at ang “ikasiyam na oras.”
  naturalness: Mas natural at matipid ang “Paakyat sina Pedro at Juan sa templo” kaysa “Umaakyat ... patungo,” habang malinaw pa rin ang direksiyong paakyat. Ang “ang ikasiyam na oras” ay maayos na pagpapaliwanag sa appositional na parirala ng Griyego.
  terminology: Ang “Pedro,” “Juan,” “templo,” “panalangin,” at “ikasiyam na oras” ay angkop sa marangal ngunit makabagong Filipino. Ang talababa ay wasto at hindi binubura ang sinaunang sistema ng oras sa pangunahing teksto.
