  text: ⸂Πέτρος δὲ⸃ καὶ Ἰωάννης ἀνέβαινον εἰς τὸ ἱερὸν ἐπὶ τὴν ὥραν τῆς προσευχῆς τὴν ἐνάτην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/001.yaml
  text: Peter and John were going up to the temple at the hour of prayer[a], the ninth hour.
translation:
  language: tl
  text: Paakyat sina Pedro at Juan sa templo sa oras ng panalangin[a], ang ikasiyam na oras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, mga alas tres ng hapon ayon sa makabagong pagbibilang ng oras.
    reason: cultural_note
lexical_decisions:
- source_word: δέ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay, hindi malakas na pagsalungat. Natural sa Tagalog na hayaan ang pagkakasunod ng salaysay na maghatid ng ugnayan.
- source_word: ἀνέβαινον
  choice: Umakyat
  rationale: Ipinahihiwatig ng pandiwa ang pag-akyat patungo sa templo. Bagaman imperfect ang anyo sa Griyego, ang simpleng aspektong naganap ay mas natural dito sa Tagalog at hindi ginagawang nakagawian ang kilos.
- source_word: ἱερόν
  choice: templo
  rationale: Tumutukoy ito sa templo o buong nasasakupan nito, hindi lamang sa panloob na santuwaryo. Ang “templo” ang malinaw at karaniwang salin.
- source_word: ἐπὶ τὴν ὥραν τῆς προσευχῆς
  choice: sa oras ng panalangin
  rationale: Likas na Tagalog ito para sa takdang oras na nauugnay sa panalangin at pinananatili ang estruktura ng parirala.
- source_word: τὴν ἐνάτην
  choice: nang ikasiyam na oras
  rationale: Pinananatili nito ang sinaunang paraan ng pagtukoy sa oras; inilalagay sa talababa ang katumbas sa makabagong pagbibilang.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina Pedro at Juan” bilang natural na panandang pangmaramihang pantangi. Pinanatili ang “ikasiyam na oras” sa pangunahing teksto upang hindi burahin ang sinaunang balangkas ng oras.
