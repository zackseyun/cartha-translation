base_translation:
  language: en
  yaml_path: translation/nt/acts/003/011.yaml
  text: While he was holding on to Peter and John[a], all the people, utterly astonished[b], ran together to them at the portico called Solomon’s.
translation:
  language: tl
  text: Habang mahigpit siyang nakakapit kina Pedro at Juan[a], ang lahat ng tao, na manghang-mangha, ay sabay-sabay na tumakbo patungo sa kanila sa portikong tinatawag na Portiko ni Solomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Habang mahigpit niyang hawak sina Pedro at Juan.” Maaaring tumukoy ang pandiwang Griyego sa mahigpit na paghawak o pagkapit.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κρατοῦντος δὲ αὐτοῦ
  choice: Habang mahigpit siyang nakakapit
  rationale: Ang genitive absolute na may present participle ay nagsasaad ng kasabay na kilos. Ipinahihiwatig ng κρατέω ang mahigpit na paghawak o pagkapit; natural sa Filipino ang “mahigpit na nakakapit” at hindi nito dinaragdagan ang motibo ng lalaking pinagaling.
- source_word: τὸν Πέτρον καὶ τὸν Ἰωάννην
  choice: kina Pedro at Juan
  rationale: Karaniwang anyo sa modernong Filipino ang mga pangalang Pedro at Juan; ang “kina” ang natural na pananda para sa dalawang taong kinakabitan.
- source_word: συνέδραμεν
  choice: patakbong nagtipon
  rationale: Pinananatili nito kapuwa ang mabilis na pagtakbo at ang sama-samang paglapit na ipinahihiwatig ng συντρέχω.
- source_word: πᾶς ὁ λαὸς
  choice: ang buong bayan
  rationale: Malapit ito sa kolektibong “lahat ng mga tao” ng Griyego at angkop sa mga taong naroon sa templo, nang hindi nililimitahan sa isang tiyak na laki ng pulutong.
- source_word: πρὸς αὐτούς
  choice: sa kanila
  rationale: Natural na Filipino para sa pagkilos patungo kina Pedro, Juan, at sa lalaking kasama nila ayon sa pangmaramihang αντούς.
- source_word: ἐπὶ τῇ στοᾷ
  choice: sa portiko
  rationale: Ang στοά ay isang may-bubong na hanay ng mga haligi. Ang “portiko” ay maikli at angkop na terminong pang-arkitektura sa konteksto ng templo.
- source_word: τῇ καλουμένῃ Σολομῶντος
  choice: tinatawag na Portiko ni Solomon
  rationale: Nililinaw sa Filipino ang buong pangalan ng lugar; ang pag-uulit ng “Portiko” ay mas natural kaysa sa bitin na “tinatawag na kay Solomon.”
- source_word: ἔκθαμβοι
  choice: Manghang-mangha sila
  rationale: Ipinapahayag nito ang matinding pagkagulat at paghanga ng ἔκθαμβοι. Ginawang hiwalay na maikling pangungusap upang maging malinaw at natural habang nananatili ang diin.
