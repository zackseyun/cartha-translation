translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “portiko” bilang eksaktong terminong pang-arkitektura; tumutukoy ito sa may-bubong na lakaran na may hanay ng mga haligi sa bakuran ng templo. Inilipat sa hiwalay na pangungusap ang ἔκθαμβοι para sa malinaw at natural na daloy.
