base_translation:
  language: en
  yaml_path: translation/nt/acts/003/009.yaml
  text: And all the people saw him walking and praising God,
translation:
  language: tl
  text: At nakita siya ng buong bayan na naglalakad at nagpupuri sa Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Karaniwang pang-ugnay ito at likas na ipinagpapatuloy ang salaysay nang hindi nagdaragdag ng mas tiyak na puwersang temporal.
- source_word: εἶδεν
  choice: nakita
  rationale: Tuwirang inilalahad ng aorist na anyo ng ὁράω na nakita ng mga tao ang lalaking pinagaling.
- source_word: πᾶς ὁ λαὸς
  choice: buong bayan
  rationale: Ang πᾶς kasama ng isahang pangngalang may pantukoy ay kolektibo ang diwa. Pinananatili ng “buong bayan” ang diwa ng λαός bilang sambayanan, hindi lamang isang nagkatipong pulutong.
- source_word: αὐτὸν
  choice: siya
  rationale: Tumutukoy ang panghalip sa lalaking pinagaling sa naunang konteksto.
- source_word: περιπατοῦντα
  choice: naglalakad
  rationale: Inilalarawan ng present participle ang nakikitang kilos ng lalaki at itinatampok ang bunga ng pagpapagaling.
- source_word: καὶ αἰνοῦντα
  choice: at nagpupuri
  rationale: Ang αἰνέω ay nangangahulugang magpuri, lalo na bilang pagkilala at pagsamba; natural at tuwiran sa Tagalog ang “nagpupuri.”
- source_word: τὸν θεόν
  choice: sa Diyos
  rationale: Ang Diyos ang tiyak na layon ng pagpuri; hinihingi ng natural na gamit sa Tagalog ang pang-ukol na “sa.”
