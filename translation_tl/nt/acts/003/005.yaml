  text: So he fixed his attention on them[a], expecting to receive something from them.
translation:
  language: tl
  text: At itinuon niya ang kanyang pansin sa kanila[a], na umaasang may matatanggap siya mula sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pinagtuunan niya sila ng pansin” / “Tinitigan niya sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Kaya ... niya
  rationale: Ang δέ ay banayad na pang-ugnay sa pagpapatuloy ng salaysay; ang “kaya” ay natural dito dahil tumutugon ang lalaki sa utos na tumingin, at ang “niya” ay tumutukoy sa lalaking lumpo.
- source_word: ἐπεῖχεν
  choice: itinuon ... ang kanyang pansin
  rationale: Sa kontekstong ito, ang ἐπέχω ay nangangahulugang ituon ang pansin sa isang tao. Ipinahihiwatig rin ng aspektong imperpektibo ang patuloy o matamang pagbibigay-pansin.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tumutukoy ito kina Pedro at Juan at likas na kaakibat ng pariralang “itinuon ... ang pansin.”
- source_word: προσδοκῶν
  choice: na umaasang
  rationale: Ipinapahayag ng participle ang kasabay na inaasahan ng lalaki habang nakatuon ang pansin niya sa kanila.
- source_word: τι
  choice: may ... siya
  rationale: Ang di-tiyak na τι ay kumakatawan sa isang bagay na inaasahan niyang tanggapin; natural itong ipinahahayag sa Filipino sa hulma ng “may matatanggap.”
- source_word: παρ’ αὐτῶν
  choice: mula sa kanila
  rationale: Ang παρά na may genitive ay nagpapahayag ng pinagmulan.
- source_word: λαβεῖν
  choice: matatanggap
  rationale: Ang “matatanggap” ay natural sa konteksto ng pag-asang mabigyan at hindi nagpapahiwatig ng sapilitang pagkuha.
