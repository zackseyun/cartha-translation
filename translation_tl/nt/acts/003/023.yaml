  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔσται δὲ πᾶσα ψυχὴ ἥτις ⸀ἂν μὴ ἀκούσῃ τοῦ προφήτου ἐκείνου ἐξολεθρευθήσεται ἐκ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/023.yaml
  text: And every person who does not listen to that prophet will be utterly destroyed from among the people[a].
translation:
  language: tl
  text: At ang bawat taong hindi makikinig sa propetang iyon ay lubusang lilipulin mula sa bayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ay ihihiwalay mula sa bayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ψυχὴ
  choice: bawat tao
  rationale: Bagaman literal na “bawat kaluluwa,” ang ψυχή sa idyomang ito ay tumutukoy sa isang indibidwal na tao. Ang “bawat tao” ay malinaw at natural sa makabagong Tagalog at hindi nagpapahiwatig ng di-kinakailangang antropolohikal na paghihiwalay ng kaluluwa at katawan.
- source_word: ἥτις ἂν μὴ ἀκούσῃ
  choice: hindi makikinig
  rationale: Ang konstruksiyon ay tumutukoy sa sinumang hindi tumutugon. Maaaring mangahulugan ang ἀκούω ng marinig, makinig, o tumalima; pinananatili ng “makikinig” ang diwa ng masunuring pakikinig nang hindi labis na ipinapaliwanag ito.
- source_word: τοῦ προφήτου ἐκείνου
  choice: sa propetang iyon
  rationale: Tumutukoy ito sa propetang gaya ni Moises sa naunang sipi. Karaniwang pangngalan ang “propeta,” sapagkat hindi ito tahasang pormal na titulo sa Griyego, bagaman tiyak ang tinutukoy.
- source_word: ἐξολεθρευθήσεται
  choice: ay lubusang lilipulin
  rationale: Ang pandiwa ay nagpapahayag ng matinding pagwasak o ganap na pag-aalis. Naipapakita ng “lubusang lilipulin” ang lakas ng salita; inilalagay sa talababa ang “ihihiwalay” bilang alternatibong naglalarawan sa pag-aalis mula sa bayan.
- source_word: ἐκ τοῦ λαοῦ
  choice: mula sa bayan
  rationale: Ipinahihiwatig ng ἐκ ang pag-aalis mula sa loob ng λαός. Sa kontekstong tipan, natural at marangal sa Tagalog ang “mula sa bayan,” at hindi nagdaragdag ng panghalip na wala sa Griyego.
theological_decisions:
- issue: Likas at saklaw ng hatol na ipinapahayag sa sipi o alusyon sa Deuteronomio 18:19
  choice: Ilarawan ito bilang lubusang paglipol o pag-aalis mula sa bayan nang hindi tinutukoy ang panahon o eksaktong anyo ng hatol.
  alternative: Unawain lamang bilang pagtitiwalag sa bayang may tipan, o tiyaking tumutukoy lamang sa pangwakas na hatol ng Diyos.
  rationale: Malubha ang babala ng teksto, ngunit hindi nito ganap na nililinaw kung ang hatol ay pansamantala, pangkomunidad, o eskatolohikal. Pinananatili ng salin ang tindi ng ἐξολεθρευθήσεται at ang aspektong pangkomunidad ng ἐκ τοῦ λαοῦ nang hindi ipinipilit ang isang sistematikong pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa λαός upang mapanatili ang kolektibo at tipanang diwa, at ang “makikinig” upang mapanatili ang saklaw mula pakikinig hanggang pagtugon o pagtalima.
