  source_fidelity: Tumpak na naisasalin ang πᾶσα ψυχή bilang “bawat taong,” ang di-tuwirang pangkalahatang sugnay bilang “hindi makikinig,” at ang hinaharap na pasibong ἐξολεθρευθήσεται bilang “ay lubusang lilipulin.” Pinananatili rin ng “mula sa bayan” ang ἐκ τοῦ λαοῦ nang hindi nagdaragdag ng “kanyang” o nililimitahan ang uri at panahon ng hatol.
  naturalness: Natural, malinaw, at marangal ang pangungusap sa makabagong Filipino. Ang ayos na “At ang bawat taong … ay …” ay angkop sa pagpapatuloy ng pangangatwiran ni Pedro at sa rehistrong pangkasulatan.
  terminology: Ang “propeta” ay wastong hindi ginagawang pormal na tituladong “Propeta,” at ang “bayan” ay angkop na katumbas ng λαός sa kontekstong ito. Ang “lubusang lilipulin” ay sapat na malakas para sa ἐξολεθρευθήσεται nang hindi nagpapataw ng isang partikular na doktrinal na pagbasa.
