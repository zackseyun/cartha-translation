  text: ὑμεῖς δὲ τὸν ἅγιον καὶ δίκαιον ἠρνήσασθε καὶ ᾐτήσασθε ἄνδρα φονέα χαρισθῆναι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/014.yaml
  text: But you denied the Holy and Righteous One[a], and asked for a murderer to be granted to you,
translation:
  language: tl
  text: Ngunit itinakwil ninyo ang Banal at Matuwid, at hiniling ninyong ipagkaloob sa inyo ang isang mamamatay-tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas malinaw ayon sa konteksto, “palayain para sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: Ngunit ... ninyo
  rationale: Ipinahahayag ng “ngunit” ang pagsalungat ng δέ, samantalang ang tahasang ὑμεῖς ay likas na naipapakita sa Filipino sa pamamagitan ng “ninyo”; hindi na kailangan ang mabigat na “kayo mismo” sa kontekstong ito.
- source_word: τὸν ἅγιον καὶ δίκαιον
  choice: ang Banal at Matuwid
  rationale: Ang magkasamang pang-uri na may artikulo ay ginagamit bilang pantanging tawag kay Jesus. Ang malaking titik ay nagpapakita ng titular na gamit nang hindi nagdaragdag ng kahulugang wala sa Griyego.
- source_word: ἠρνήσασθε
  choice: itinakwil
  rationale: Sa konteksto, ang ἀρνέομαι ay tumutukoy sa hayagang pagtanggi o pagtatwa kay Jesus. Mas malinaw sa karaniwang Filipino ang “itinakwil” kaysa “ikinaila” para sa aktuwal na pagpili laban sa kaniya, habang pinananatili ang relasyonal at pampublikong bigat ng pandiwa.
- source_word: ᾐτήσασθε
  choice: hiniling ninyo
  rationale: Tuwirang ipinapahayag nito ang kahulugan ng αἰτέω bilang paghiling sa may awtoridad, nang hindi pinatitingkad ito bilang isang pagdemanda.
- source_word: ἄνδρα φονέα
  choice: isang mamamatay-tao
  rationale: Ang φονεύς ay taong pumapatay o mamamatay-tao. Sa natural na Filipino, nakapaloob na sa “mamamatay-tao” ang pagiging isang tao ng ἄνδρα, kaya hindi kailangan ang alanganing “isang lalaking mamamatay-tao.”
- source_word: χαρισθῆναι ὑμῖν
  choice: ipagkaloob sa inyo
  rationale: Pinananatili nito ang mas malawak na diwa ng χαρίζομαι na pagkakaloob bilang pabor. Nililinaw sa talababa ang espesipikong kahulugang “palayain” ayon sa kontekstong hudisyal.
theological_decisions:
- issue: Kristolohikal na puwersa ng “τὸν ἅγιον καὶ δίκαιον”
  choice: 'Gamitin bilang pantanging tawag kay Jesus: “ang Banal at Matuwid”'
  alternative: 'Basahin bilang karaniwang paglalarawan lamang: “ang banal at matuwid”'
  rationale: Ang konstruksyon sa Griyego ay substantibal at tumutukoy kay Jesus sa pamamagitan ng dalawang mabibigat na katangian. Ang malaking titik ay nagpapahiwatig ng pantanging gamit ngunit hindi nagpapasok ng dagdag na doktrina.
- issue: Hudisyal na pahiwatig ng χαρισθῆναι
  choice: “ipagkaloob sa inyo” sa pangunahing teksto
  alternative: “palayain para sa inyo”
  rationale: Mas malawak ang leksikal na saklaw ng pandiwa kaysa “palayain,” bagaman iyon ang malinaw na kilos sa salaysay tungkol kay Barabas. Kaya nananatili ang mas malapit na salin sa teksto at inilalagay sa talababa ang kontekstuwal na paglilinaw.
translation_notes:
  register: Makabagong Filipino na tuwiran, marangal, at madaling maunawaan. Pinanatili ang matinding paghahambing sa pagitan ng “ang Banal at Matuwid” at “isang mamamatay-tao,” at iniwasan ang mas teknikal o lumang pananalita.
