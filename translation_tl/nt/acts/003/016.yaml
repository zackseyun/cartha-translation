id: ACT.3.16
reference: Acts 3:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ τοῦτον ὃν θεωρεῖτε καὶ οἴδατε ἐστερέωσεν τὸ ὄνομα αὐτοῦ, καὶ ἡ πίστις ἡ δι’ αὐτοῦ ἔδωκεν αὐτῷ τὴν ὁλοκληρίαν ταύτην ἀπέναντι πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/016.yaml
  text: And on the basis of faith in his name[a], his name itself has made strong this man whom you see and know[c][b]; and the faith that is through him has given him this wholeness in the presence of all of you.
translation:
  language: tl
  text: At dahil sa pananampalataya sa kanyang pangalan,[a] ang pangalan niya mismo ang nagpalakas sa taong ito na nakikita at kilala ninyo. At ang pananampalatayang sa pamamagitan niya ang nagbigay sa taong ito ng ganap na kalusugang ito[b] sa harap ninyong lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagtitiwala sa kanyang pangalan.” Ang salitang Griyego na pistis ay maaaring mangahulugang pananampalataya, pagtitiwala, o, sa ilang konteksto, katapatan.
    reason: lexical_alternative
  - marker: b
    text: O “ganap na kagalingan” o “lubos na pagiging malusog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ πίστει
  choice: salig sa pananampalataya
  rationale: Ipinahahayag ng ἐπί na may datibo ang batayan o saligan. Likas sa makabagong Tagalog ang “salig sa” at hindi nito nililimitahan ang diwa sa simpleng kasangkapan lamang.
- source_word: πίστει τοῦ ὀνόματος αὐτοῦ
  choice: pananampalataya sa kanyang pangalan
  rationale: Ang genitibong parirala ay nauunawaan dito bilang pananampalataya o pagtitiwala na nakatuon sa pangalan ni Jesus. Pinananatili ang “pangalan” bilang pagtukoy sa kanyang persona at awtoridad.
- source_word: ἐστερέωσεν
  choice: nagpalakas
  rationale: Tumutukoy ang pandiwa sa paggawa sa isang tao na matatag o malakas, na angkop sa hayag na paggaling ng lalaki.
- source_word: θεωρεῖτε καὶ οἴδατε
  choice: inyong nakikita at nakikilala
  rationale: Pinananatili ang kapuwa aktuwal na pagkakita at pagkakilala ng mga tagapakinig sa lalaki bilang pampublikong saksi sa nangyari.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: ang pangalan niya mismo
  rationale: Pinananatili ang inuulit at mariing paksa sa Griyego. Ang “mismo” ay nagpapalinaw sa diin nang hindi pinapalitan ang “pangalan” ng paliwanag na “si Jesus.”
- source_word: ἡ πίστις ἡ δι’ αὐτοῦ
  choice: ang pananampalatayang sa pamamagitan niya
  rationale: Pinananatili ang maikli at bahagyang bukas na diwa ng δι’ αὐτοῦ, nang hindi tiyak na ipinapasiya kung ang pananampalataya ay ibinigay, pinamagitan, o pinairal ni Jesus.
- source_word: ἔδωκεν αὐτῷ
  choice: nagbigay sa taong ito
  rationale: Ang payak na naganap na aspekto ay natural sa Tagalog; inulit ang “taong ito” upang malinaw ang tinutukoy ng panghalip.
- source_word: τὴν ὁλοκληρίαν ταύτην
  choice: lubos na kagalingang ito
  rationale: Ipinahahayag nito ang ganap at nakikitang pagpapanumbalik ng kalusugan. Ang “kagalingan” ay malinaw sa konteksto ng pisikal na pagpapagaling.
- source_word: ἀπέναντι πάντων ὑμῶν
  choice: sa harap ninyong lahat
  rationale: Natural at tuwirang ipinahahayag nito na nasaksihan ng buong madla ang paggaling.
theological_decisions:
- issue: Kanino ang pananampalataya at paano ito kaugnay ng pagpapagaling
  choice: Hindi tinukoy kung ang pananampalataya ay sa lalaking pinagaling, sa mga apostol, o ipinagkaloob ni Jesus; iniugnay lamang ito sa pangalan ni Jesus at sa pamamagitan niya.
  alternative: Tahasang tukuyin ito bilang pananampalataya ng lalaki, pananampalataya ng mga apostol, o pananampalatayang ibinigay ni Jesus.
  rationale: Hindi pinangalanan ng Griyego ang taong may pananampalataya. Pinananatili ng salin ang teolohikal na tensiyon at ang diin sa pangalan ni Jesus.
- issue: Kahulugan at bisa ng “pangalan”
  choice: Pinanatili ang “pangalan niya mismo” bilang paksa ng pagpapalakas.
  alternative: “Si Jesus mismo” o “ang kapangyarihan ng kanyang pangalan.”
  rationale: Ang “pangalan” ay metonimikong tumutukoy sa persona at awtoridad ni Jesus, ngunit mahalaga sa pananalita ng Mga Gawa ang mismong salitang ito at ang mariing pag-uulit nito.
- issue: Diwa ng δι’ αὐτοῦ
  choice: “sa pamamagitan niya”
  alternative: “na mula sa kanya” o “na ibinigay niya”
  rationale: Maaaring ipahiwatig ng parirala ang pamamagitan o pinagmulan. Hindi nilulutas ng salin ang hindi tahasang nilulutas ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang retorikal na pag-uulit ng “pangalan” at ang bahagyang di-tiyak na “sa pamamagitan niya,” habang iniwasan ang tunog na labis na teknikal o denominasyonal.
