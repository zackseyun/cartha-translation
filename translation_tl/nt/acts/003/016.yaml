    issue: “nakikilala” para sa οἴδατε
    rationale: Ang “nakikilala” ay kadalasang proseso ng pagkilala o pag-aalam tungkol sa isang tao. Ang οἴδατε rito ay tumutukoy sa katotohanang kilala na ng madla ang lalaking hayag nilang nakikita.
  - severity: medium
    issue: “lubos na kagalingan” para sa ὁλοκληρίαν
    rationale: Maaaring marinig ang “kagalingan” bilang pagpapagaling o paggaling na nagaganap. Ang Griyegong pangngalan ay mas tuwirang tumutukoy sa ganap na kalusugan/soundness na taglay na ngayon ng lalaki.
