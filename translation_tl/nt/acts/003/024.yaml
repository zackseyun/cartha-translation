  text: καὶ πάντες δὲ οἱ προφῆται ἀπὸ Σαμουὴλ καὶ τῶν καθεξῆς ὅσοι ἐλάλησαν καὶ κατήγγειλαν τὰς ἡμέρας ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/024.yaml
  text: And all the prophets from Samuel and those after him[a], as many as spoke[c][b], also announced these days.
translation:
  language: tl
  text: At lahat ng propeta, mula kay Samuel at sa mga sumunod sa kanya[a]—lahat ng nagsalita—ay nagpahayag din tungkol sa mga araw na ito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga propetang kasunod niya sa pagkakasunod-sunod.”
    reason: lexical_alternative
  - marker: b
    text: O “panahong ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες δὲ οἱ προφῆται
  choice: At ang lahat ng propeta
  rationale: Ang δέ ay banayad na pang-ugnay rito at likas na naipapahayag sa Tagalog sa pamamagitan ng “At,” nang hindi lumilikha ng di-kinakailangang pagsalungat.
- source_word: ἀπὸ Σαμουὴλ
  choice: mula kay Samuel
  rationale: Tuwirang ipinapakita ng ἀπό ang panimulang tauhan sa pagkakasunod-sunod ng mga propeta.
- source_word: τῶν καθεξῆς
  choice: ang mga sumunod sa kanya
  rationale: Ang substantibong parirala ay tumutukoy sa mga propetang kasunod ni Samuel; malinaw at natural ito sa makabagong Tagalog.
- source_word: ὅσοι ἐλάλησαν
  choice: lahat ng nagsalita
  rationale: Pinananatili nito ang saklaw ng ὅσοι at ang payak na kahulugan ng ἐλάλησαν, habang mas likas kaysa sa literal na “gaano man karami ang nagsalita.”
- source_word: καὶ κατήγγειλαν
  choice: ay nagpahayag din tungkol sa
  rationale: Ang καταγγέλλω ay pagpapahayag o paghahayag sa madla; hindi ito isinaling “humula” upang hindi idagdag ang mas tiyak na ideya ng prediksiyon na wala sa pandiwa mismo. Ang “tungkol sa” ay natural na paraan sa Tagalog upang iugnay ang ipinahayag sa layon nito.
- source_word: τὰς ἡμέρας ταύτας
  choice: mga araw na ito
  rationale: Tuwirang pinananatili ang temporal na larawan ng Griyego at ang pagtukoy sa kasalukuyang panahon ng katuparan sa talumpati ni Pedro.
theological_decisions:
- issue: Ang pagtukoy ng mga propeta sa kasalukuyang yugto ng katuparan
  choice: mga araw na ito
  alternative: panahong ito
  rationale: Pinananatili ng salin ang literal at teolohikal na bukas na pananalitang “mga araw,” sa halip na tahasang tukuyin ang eksaktong saklaw ng panahong tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Gumamit ng mga gitling upang maipakita na ang “lahat ng nagsalita” ay nagpapaliwanag sa saklaw ng mga propetang tinutukoy, nang hindi binabago ang diwa ng orihinal.
