id: ACT.3.20
reference: Acts 3:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅπως ἂν ἔλθωσιν καιροὶ ἀναψύξεως ἀπὸ προσώπου τοῦ κυρίου καὶ ἀποστείλῃ τὸν προκεχειρισμένον ὑμῖν χριστὸν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/020.yaml
  text: so that times of refreshing may come from the presence of the Lord[a], and that he may send the Messiah appointed for you, Jesus,
translation:
  language: tl
  text: upang dumating ang mga panahon ng kaginhawahan mula sa presensya ng Panginoon, at upang isugo niya si Jesus, ang Mesiyas na itinalaga para sa inyo[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “itinalaga sa inyo” o “itinalaga na noon para sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως ἂν
  choice: upang
  rationale: Likas na ipinahahayag ng “upang” ang layunin o resultang kaugnay ng naunang panawagan na magsisi, nang hindi labis na binibigyang-diin ang kawalang-katiyakan.
- source_word: ἔλθωσιν
  choice: dumating
  rationale: Kasunod ng “upang,” natural na naipahahayag ng anyong Filipino ang diwang subjunctive ng pandiwang Griyego.
- source_word: καιροὶ
  choice: mga panahon
  rationale: Pinananatili nito ang malawak na kahulugan ng mga natatangi o angkop na panahon nang hindi agad tinutukoy ang eksaktong eskatolohikal na iskedyul.
- source_word: ἀναψύξεως
  choice: kaginhawahan
  rationale: Saklaw nito ang diwa ng ginhawa, pagpapagaan, at panunumbalik ng sigla, at malinaw ito sa karaniwang mambabasa.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: mula sa presensya ng Panginoon
  rationale: Bagaman literal na “mula sa mukha,” ang idyoma ay tumutukoy sa presensya; ito ang natural at malinaw na salin sa modernong Filipino.
- source_word: ἀποστείλῃ
  choice: isugo niya
  rationale: Pinananatili ang ugnayan nito sa sugnay na may “upang” at ang aktibong pagkilos ng Panginoon bilang nagsusugo.
- source_word: προκεχειρισμένον
  choice: itinalaga
  rationale: Ipinahahayag ang naunang pagpili o pagtatalaga nang hindi mabigat na inuulit sa pangunahing teksto ang aspektong temporal na nasa unlapi.
- source_word: ὑμῖν
  choice: para sa inyo
  rationale: Natural nitong ipinahahayag na ang Mesiyas ay itinalaga para sa mga kausap o para sa kanilang kapakinabangan, habang kinikilala sa talababa ang posibleng “sa inyo.”
- source_word: χριστὸν
  choice: Mesiyas
  rationale: Dito ay gumaganap ang χριστός bilang titulo; ang “Mesiyas” ay nagpapanatili sa kahulugan at kontekstong Judio nito.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Karaniwang anyo sa Filipino ng personal na pangalan.
theological_decisions:
- issue: Kung isasalin ang χριστὸν bilang titulo o pananatilihin bilang tradisyonal na “Cristo”
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa kontekstong ito, ang salita ay titulong mesiyaniko na nakaugnay kay Jesus, kaya ang “Mesiyas” ang higit na hayag na naghahatid ng kahulugan nito.
- issue: Kahulugan ng προκεχειρισμένον ὑμῖν
  choice: itinalaga para sa inyo
  alternative: itinalaga sa inyo; itinalaga na noon para sa inyo
  rationale: Pinananatili ng pangunahing salin ang sentrong diwa ng pagtatalaga at ang natural na gamit ng datibo sa konteksto, samantalang inilalahad sa talababa ang iba pang lehitimong pagbasa at ang aspektong naunang pagtatalaga.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “presensya” sa halip na literal na “mukha” dahil idyomatiko ang pariralang Griyego. Inilagay ang panandang [a] sa pariralang tinutukoy mismo ng talababa.
