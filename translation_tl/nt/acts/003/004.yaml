base_translation:
  language: en
  yaml_path: translation/nt/acts/003/004.yaml
  text: And Peter[a], together with John, fixed his gaze on him and said, “Look at us.”
translation:
  language: tl
  text: Matiim[a] siyang tiningnan ni Pedro, kasama si Juan, at sinabi, “Tumingin ka sa amin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Tinitigan.” Ipinahihiwatig ng Griyegong pandiwa ang matamang pagtitig, hindi lamang isang saglit na pagtingin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: Matiim siyang tiningnan
  rationale: Ipinahahayag nito ang sinadya at matamang pagtingin, hindi lamang isang saglit na sulyap. Likas at marangal din itong pakinggan sa makabagong Filipino.
- source_word: δὲ
  choice: at
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay; hindi kinakailangang ipahiwatig ang mariing pagsalungat.
- source_word: σὺν τῷ Ἰωάννῃ
  choice: kasama si Juan
  rationale: Pinananatili nito ang diwa ng pakikisama ni Juan sa pagkilos ni Pedro nang hindi ginagawang hiwalay na pangunahing simuno si Juan.
- source_word: εἶπεν
  choice: sinabi
  rationale: Karaniwan at tuwirang katumbas ito ng pandiwa ng pagsasalita sa kontekstong ito.
- source_word: Βλέψον
  choice: Tumingin ka
  rationale: Tuwiran at likas na utos ito sa Filipino. Hindi dinaragdagan ng salin ang tindi ng utos, yamang ang pandiwang ito ay mas payak kaysa ἀτενίζω sa unang sugnay.
- source_word: εἰς ἡμᾶς
  choice: sa amin
  rationale: Sa Filipino, ang “tumingin sa amin” ang likas na paraan ng pagpapahayag ng pagtuon ng paningin sa mga nagsasalita.
- source_word: εἰς αὐτόν
  choice: siyang
  rationale: Ang panghalip ang layon ng matamang pagtingin; ang ayos na “Matiim siyang tiningnan” ay malinaw at natural sa Filipino.
