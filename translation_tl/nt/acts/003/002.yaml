  source_fidelity: 'Tumpak na naihahatid ang pangunahing diwa at mga aspekto ng Griyego: isang partikular ngunit di-pinangalanang lalaki, may kapansanan sa paglakad mula sa sinapupunan ng ina, na dinadala at araw-araw inilalagay sa pintuan ng templo upang mamalimos sa mga pumapasok. Ang layuning ipinahahayag ng τοῦ αἰτεῖν ay wastong naisalin sa “upang humingi.”'
  naturalness: Likas at malinaw ang modernong Filipino. Ang “hindi makalakad” ay magalang at madaling unawain; ang “Araw-araw siyang inilalagay” ay maayos na naghahayag ng nakaugaliang kilos. Katanggap-tanggap ang “sa may pintuan” para sa πρὸς τὴν θύραν sa kontekstong ito.
  terminology: Wasto ang “templo” para sa ἱερόν, na may angkop na talababa upang ipaliwanag na ang tinutukoy ay ang kompleks o bakuran, hindi lamang ang ναός. Ang “limos” ay angkop para sa ἐλεημοσύνην. Wasto ring napanatili ang literal na kahulugan ng pangalang Ὡραία bilang “Maganda.”
