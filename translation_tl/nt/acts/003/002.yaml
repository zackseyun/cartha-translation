id: ACT.3.2
reference: Acts 3:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καί τις ἀνὴρ χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων ἐβαστάζετο, ὃν ἐτίθουν καθ’ ἡμέραν πρὸς τὴν θύραν τοῦ ἱεροῦ τὴν λεγομένην Ὡραίαν τοῦ αἰτεῖν ἐλεημοσύνην παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/002.yaml
  text: And a certain man[a], lame from his mother’s womb, was being carried, whom they would place every day at the gate of the temple called Beautiful, to ask for alms from those entering into the temple[c][b],
translation:
  language: tl
  text: May isang lalaking hindi makalakad mula pa sa sinapupunan ng kanyang ina[b] na dinadala roon. Araw-araw siyang inilalagay sa may pintuan ng templo[a] na tinatawag na “Maganda”[c], upang humingi ng limos sa mga pumapasok sa templo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na ἱερόν ay tumutukoy sa buong kompleks o bakuran ng templo, hindi lamang sa panloob na santuwaryo (ναός).
    reason: cultural_note
  - marker: b
    text: O “mula nang ipanganak.”
    reason: lexical_alternative
  - marker: c
    text: Literal na “Maganda” ang pangalan ng pintuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τις ἀνὴρ
  choice: isang lalaki
  rationale: Ipinakikilala ng τις ang isang partikular ngunit hindi pinangalanang tao. Likas sa Tagalog ang “isang lalaki”; hindi kailangan ang mas mabigat na “isang tiyak na lalaki.”
- source_word: χωλὸς
  choice: hindi makalakad
  rationale: Malinaw at magalang itong paglalarawan sa kalagayan ng lalaki. Iniiwasan nito ang “lumpo,” na maaaring marinig bilang lipas o mapanlait, at ang “pilay,” na maaari lamang magpahiwatig ng pag-ika.
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: mula pa sa sinapupunan ng kanyang ina
  rationale: Pinananatili ang kongkretong larawan ng Griyego at ipinahihiwatig ng “mula pa” na taglay niya ang kalagayan mula nang ipanganak.
- source_word: ὑπάρχων
  choice: nakapaloob sa “hindi makalakad”
  rationale: Predikatibo ang participle at naglalarawan ng nagpapatuloy na kalagayan; hindi natural na isalin ito nang hiwalay sa Tagalog.
- source_word: ἐβαστάζετο
  choice: dinadala roon
  rationale: Ipinahahayag ng aspektong imperpektibo ang paulit-ulit o nagpapatuloy na pagdadala sa kanya; ang “roon” ay nililinaw ng kasunod na lokasyon nang hindi nagdaragdag ng bagong impormasyon.
- source_word: ἐτίθουν καθ’ ἡμέραν
  choice: Araw-araw siyang inilalagay
  rationale: Malinaw na ipinakikita ng “araw-araw” ang nakaugaliang kilos na ipinahahayag ng imperpekto at ng distributibong parirala.
- source_word: πρὸς τὴν θύραν τοῦ ἱεροῦ
  choice: sa may pintuan ng templo
  rationale: Ang “sa may” ay natural na katumbas ng lokasyong πρὸς sa kontekstong ito. Ang ἱερόν ay buong bakuran o kompleks ng templo, hindi lamang ang panloob na santuwaryo; ipinaliliwanag ito sa talababa.
- source_word: τὴν λεγομένην Ὡραίαν
  choice: na tinatawag na “Maganda”
  rationale: Pinananatili ang literal na kahulugan ng pangalang Ὡραία at malinaw na ipinakikitang ito ang tawag sa pintuan.
- source_word: τοῦ αἰτεῖν ἐλεημοσύνην
  choice: upang humingi ng limos
  rationale: Ang “upang” ay tahasang naghahayag ng layunin ng articular infinitive, at ang “limos” ang maikli at pangkaraniwang katawagan sa kaloob para sa nangangailangan.
- source_word: παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν
  choice: sa mga pumapasok sa templo
  rationale: Natural na ipinahahayag nito ang pinagmumulan ng limos at ang mga taong nasa proseso ng pagpasok sa kompleks ng templo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hindi makalakad” sa halip na “lumpo” o “pilay” upang maging tumpak at magalang, habang pinanatili ang larawan ng “sinapupunan ng kanyang ina” at ang literal na pangalan ng pintuan.
