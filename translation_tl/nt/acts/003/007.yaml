base_translation:
  language: en
  yaml_path: translation/nt/acts/003/007.yaml
  text: And taking him by the right hand[a], he raised him up; and immediately his feet and ankles were strengthened.
translation:
  language: tl
  text: Hinawakan niya ang kanang kamay ng lalaki at itinayo ito. Agad na tumibay ang mga paa at mga bukung-bukong nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιάσας
  choice: hinawakan
  rationale: Ipinapahayag nito ang pisikal na paghawak na nauna at kasabay ng pagtulong na maitayo ang lalaki, nang hindi ginagamit ang mas marahas na diwa ng “sinunggaban.”
- source_word: τῆς δεξιᾶς χειρός
  choice: sa kanang kamay
  rationale: Natural na katumbas sa Tagalog ng genitibong bahagi ng katawan na siyang hinawakan; hindi na kailangang idagdag ang tahasang panghalip na paari.
- source_word: ἤγειρεν αὐτόν
  choice: itinayo
  rationale: Tumpak at natural sa konteksto ng lalaking dating hindi makalakad; pinananatili nito ang kongkretong kilos ng pagbangon sa kaniya nang hindi dinaragdagan ng paliwanag.
- source_word: παραχρῆμα
  choice: agad
  rationale: Malinaw na ipinahahayag ang biglaan at kagyat na resulta ng pangyayari.
- source_word: ἐστερεώθησαν
  choice: lumakas
  rationale: Natural na Tagalog para sa pasibong/resultatibong diwa na naging matatag o malakas ang mga bahaging ito ng katawan, nang hindi tinutukoy ang ahente na hindi tahasang binanggit sa sugnay.
- source_word: αἱ βάσεις αὐτοῦ
  choice: ang mga paa nito
  rationale: Sa kontekstong anatomikal, ang βάσεις ay tumutukoy sa mga bahaging sumusuporta sa pagtayo; “mga paa” ang pinakanatural at sapat na tumpak na salin.
- source_word: τὰ σφυδρά
  choice: bukung-bukong
  rationale: Karaniwang salitang Filipino para sa bahagi o kasukasuan ng ankle; hindi nito nililimitahan ang kahulugan sa mga buto lamang.
theological_decisions:
- issue: Paglalarawan sa kagalingan
  choice: Iulat nang tuwiran ang agarang paglakas ng mga paa at bukung-bukong.
  alternative: Isalin bilang “gumaling” o tahasang idagdag na Diyos ang nagpalakas sa mga ito.
  rationale: Kongkretong inilalarawan ng Griyego ang pisikal na paglakas at hindi tahasang pinapangalanan sa sugnay ang ahente. Pinananatili ng salin ang salaysay nang walang idinagdag na paliwanag tungkol sa mekanismo ng himala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “ang lalaki” at “nito” upang maging malinaw ang mga reperente at maiwasan ang sunod-sunod na malabong panghalip. Walang footnote dahil ang “bukung-bukong” ay sapat na sumasaklaw sa σφυδρά; ang mas tiyak na “mga buto ng bukung-bukong” ay hindi kailangan.
