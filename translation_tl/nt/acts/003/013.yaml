id: ACT.3.13
reference: Acts 3:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ θεὸς Ἀβραὰμ καὶ ⸂Ἰσαὰκ καὶ⸃ Ἰακώβ, ὁ θεὸς τῶν πατέρων ἡμῶν, ἐδόξασεν τὸν παῖδα αὐτοῦ Ἰησοῦν, ὃν ὑμεῖς ⸀μὲν παρεδώκατε καὶ ⸀ἠρνήσασθε κατὰ πρόσωπον Πιλάτου, κρίναντος ἐκείνου ἀπολύειν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/013.yaml
  text: The God of Abraham and Isaac and Jacob[a], the God of our fathers, has glorified his servant Jesus, whom you handed over and denied before Pilate, when he had decided to release him.
translation:
  language: tl
  text: Ang Diyos nina Abraham, Isaac, at Jacob, ang Diyos ng ating mga ninuno, ay niluwalhati ang kanyang lingkod na si Jesus[a], na inyong ibinigay at itinanggi sa harap ni Pilato, nang ipasiya ni Pilato na palayain siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanyang anak na si Jesus.” Ang salitang Griyego na παῖς ay maaaring mangahulugang “anak” o “lingkod”; pinili rito ang “lingkod” dahil malamang na umaalingawngaw ito sa paglalarawan sa Lingkod ng Panginoon sa Isaias.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: Ang Diyos nina Abraham, Isaac, at Jacob
  rationale: Pinananatili ang pormulang tipan na umaalingawngaw sa Exodo 3:6, habang ginagamit ang likas na modernong ayos ng talaan sa Filipino.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: ang Diyos ng ating mga ninuno
  rationale: Ang “mga ninuno” ay malinaw at natural sa modernong Filipino at naihahatid ang kolektibong kahulugan ng πατέρων sa konteksto ng kasaysayan ng Israel.
- source_word: ἐδόξασεν
  choice: niluwalhati
  rationale: Pinananatili nito ang bigat ng δοξάζω at ang diwang ang Diyos ang nagbigay ng kaluwalhatian kay Jesus; hindi ito pinapaputla bilang simpleng “pinarangalan.”
- source_word: τὸν παῖδα αὐτοῦ Ἰησοῦν
  choice: ang kanyang lingkod na si Jesus
  rationale: Maaaring mangahulugan ang παῖς ng anak/bata o lingkod, ngunit malamang na umaalingawngaw rito ang Lingkod ng Panginoon sa Isaias. Inilalahad sa talababa ang tunay na alternatibo.
- source_word: παρεδώκατε
  choice: ibinigay ninyo
  rationale: Naihahatid nito ang pagkakaloob o pagsasalin kay Jesus sa kapangyarihan ng mga awtoridad nang hindi idinaragdag ang mas makitid na ideya ng personal na pagtataksil.
- source_word: ἠρνήσασθε
  choice: itinanggi
  rationale: Direkta at pamilyar itong katumbas ng ἀρνέομαι at pinananatili ang ugnayan sa iba pang mga salaysay ng pagkakaila o pagtatanggi kay Jesus.
- source_word: κατὰ πρόσωπον Πιλάτου
  choice: sa harap ni Pilato
  rationale: Likas na Filipino ito para sa idyomang literal na “sa mukha ni Pilato” at pinananatili ang diwa ng hayagan at personal na pagharap.
- source_word: κρίναντος ἐκείνου ἀπολύειν
  choice: nang ipasiya nitong palayain siya
  rationale: Inilalahad ang genitive absolute bilang pangyayaring panahunan, gaya ng pinahihintulutan ng Griyego, at pinananatili ang hudisyal na diwa ng pagpapasiya at pagpapalaya.
theological_decisions:
- issue: Kahulugan ng παῖς bilang titulo kay Jesus
  choice: lingkod
  alternative: anak o bata
  rationale: Mas malamang na tumutukoy ito sa wikang tungkol sa Lingkod sa Isaias. Gayunman, hindi inaalis ang leksikal na posibilidad na “anak/bata,” kaya inilalagay iyon sa talababa nang hindi ipinapantay ang παῖς sa ibang tahasang katawagan kay Jesus bilang Anak.
- issue: Paglalahad sa kilos na ἐδόξασεν
  choice: niluwalhati
  alternative: pinarangalan
  rationale: Ang “niluwalhati” ay nagpapanatili sa teolohikal at salaysay na bigat ng salita nang hindi tinutukoy sa mismong salin ang eksaktong paraan o sandali ng pagluluwalhati.
- issue: Ugnayan ng pasiya ni Pilato sa pagtatanggi ng mga nakikinig
  choice: nang ipasiya nitong palayain siya
  alternative: kahit ipinasiya nitong palayain siya
  rationale: Ang temporal na “nang” ay hindi nagdaragdag ng tahasang konsesibong “kahit,” bagaman malinaw sa konteksto ang matinding pagkakasalungat. Sa gayon ay napapanatili ang anyo at bahagyang kaluwagan ng participial construction.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mga ninuno” sa halip na literal na “mga ama” upang maging natural sa kasalukuyang gamit, at pinanatili ang mga salitang biblikal na “niluwalhati” at “lingkod” dahil mahalaga ang kanilang intertekstuwal at teolohikal na bigat.
