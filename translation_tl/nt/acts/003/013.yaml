  terminology: Ang “lingkod” para sa παῖς ay angkop at pinananatili ang malamang na alusyon sa Lingkod sa Isaias. Ang “niluwalhati” ay angkop para sa ἐδόξασεν. Ang talababa ay wasto sa pagbibigay ng “anak” bilang leksikal na alternatibo; inalis ang “bata” upang hindi magmungkahi ng di-natural na pagbasa sa pariralang ito.
