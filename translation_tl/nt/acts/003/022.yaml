id: ACT.3.22
reference: Acts 3:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μωϋσῆς ⸀μὲν εἶπεν ὅτι Προφήτην ὑμῖν ἀναστήσει κύριος ὁ ⸀θεὸς ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ· αὐτοῦ ἀκούσεσθε κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/022.yaml
  text: Moses indeed said[a], ‘The Lord God will raise up for you a prophet from among your brothers, like me[b]. You shall listen to him in everything he says to you.’
translation:
  language: tl
  text: Tunay ngang sinabi ni Moises, “Ang Panginoong Diyos[b] ay magbabangon para sa inyo ng isang propetang tulad ko mula sa inyong mga kapatid.[a] Makinig kayo sa kanya sa lahat ng sasabihin niya sa inyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa inyong mga kapwa Israelita.” Ang Griyego ay literal na “mula sa inyong mga kapatid,” isang pananalitang pangkamag-anakan na tumutukoy rito sa kapwa kabilang sa bayang Israel.
    reason: lexical_alternative
  - marker: b
    text: Sinisipi rito ng Mga Gawa ang Deuteronomio 18:15 na may bahagyang naiibang pananalita. Kapansin-pansing “ang Panginoong Diyos” ang nasa tekstong Griyego ng Mga Gawa, hindi “ang Panginoon ninyong Diyos.”
    reason: cross_reference
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Moises
  rationale: Karaniwang anyo ng pangalan sa makabagong saling Filipino.
- source_word: μὲν
  choice: tunay ngang
  rationale: Ipinakikita ang diin at pagpapatuloy ng argumento nang hindi pinabibigat ang pangungusap.
- source_word: εἶπεν ὅτι
  choice: sinabi … “…”
  rationale: Likas sa Filipino ang tuwirang sipi at malinaw nitong ipinakikilala ang siniping pahayag.
- source_word: Προφήτην
  choice: isang propeta
  rationale: Pinananatili ang di-tiyak na anyo ng Griyego at hindi ipinapasok sa salin ang interpretatibong titulong “ang Propeta.”
- source_word: ἀναστήσει
  choice: magbabangon
  rationale: Pinananatili ang larawan ng pagtatalaga o pagpapalitaw ng isang propeta, nang hindi ginagawang tahasang tumutukoy sa muling pagkabuhay.
- source_word: κύριος ὁ θεὸς
  choice: ang Panginoong Diyos
  rationale: Tapat sa mismong pananalita ng Griyego sa Mga Gawa, na walang panghalip na “inyong.”
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: mula sa inyong mga kapatid
  rationale: Pinananatili ang pananalitang pangkamag-anakan ng Griyego at ang diwang nagmumula siya sa loob ng bayang tipan.
- source_word: ὡς ἐμέ
  choice: tulad ko
  rationale: Tuwirang ipinahahayag ang paghahambing ng darating na propeta kay Moises.
- source_word: αὐτοῦ ἀκούσεσθε
  choice: Makinig kayo sa kanya
  rationale: Ipinahahayag ang mapag-utos at pansunuring lakas ng anyong panghinaharap, hindi lamang ang pisikal na pagdinig.
- source_word: κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς
  choice: sa lahat ng sasabihin niya sa inyo
  rationale: Natural na Filipino na pinananatili ang saklaw ng lahat ng anumang ipahahayag ng propeta.
theological_decisions:
- issue: Sipi mula sa Deuteronomio 18 at ang mesianikong pagkakakilanlan
  choice: Isinalin bilang “isang propeta” nang hindi tahasang idinaragdag ang “Mesiyas.”
  alternative: “ang Propeta” o tahasang “ang Mesiyas”
  rationale: Iniuugnay ni Pedro ang sipi kay Jesus sa konteksto, ngunit “isang propeta” ang mismong anyo ng pangungusap; hindi dapat ipasok sa sipi ang higit sa sinasabi nito.
- issue: Saklaw ng ἀδελφῶν
  choice: mga kapatid
  alternative: mga kapwa Israelita
  rationale: Pinananatili ang kongkretong wikang pangkamag-anakan ng teksto, habang nililinaw sa talababa ang kinatawang kahulugang pambayan o pangtipan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Panginoong Diyos,” “magbabangon,” at “Makinig kayo” upang mapanatili ang biblikal na bigat habang nananatiling natural sa ordinaryong mambabasa. Inilipat ang mga pananda ng talababa sa mismong mga pariralang kanilang nililinaw.
