  text: τὸν δὲ ἀρχηγὸν τῆς ζωῆς ἀπεκτείνατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, οὗ ἡμεῖς μάρτυρές ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/015.yaml
  text: but you killed the Author of life[a], whom God raised from the dead[b], of which we are witnesses.
translation:
  language: tl
  text: Ngunit pinatay ninyo ang Pinagmulan ng buhay[a], na binuhay na muli ng Diyos mula sa mga patay; mga saksi kami rito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Pinuno ng buhay,” “Tagapanguna ng buhay,” o “Tagapagsimula ng buhay.” Ang salitang Griyego ay maaaring tumukoy sa pinagmulan, pamumuno, o pangunguna.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga saksi kami tungkol sa kanya.” Maaaring tumukoy ang Griyego sa mismong taong binuhay na muli o sa pangyayari ng kanyang muling pagkabuhay.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: 'Nag-uugnay ito sa naunang paratang habang nagpapatingkad sa kabalintunaan: pinawalan ang mamamatay-tao, ngunit pinatay ang kaugnay sa buhay mismo.'
- source_word: ἀρχηγὸν
  choice: Pinagmulan
  rationale: Maaaring tumukoy ang ἀρχηγός sa nagpasimula, pinuno, o nangunguna. Sa pariralang τὸν ἀρχηγὸν τῆς ζωῆς, malinaw at likas sa Filipino ang “Pinagmulan ng buhay,” ngunit inilalahad sa talababa ang tunay na lawak ng salita.
- source_word: τῆς ζωῆς
  choice: ng buhay
  rationale: Direkta at natural na salin ng genitive, at pinananatili ang maikli at titulong anyo ng parirala.
- source_word: ἀπεκτείνατε
  choice: pinatay ninyo
  rationale: Tuwiran nitong ipinapahayag ang naganap na pagpatay nang hindi idinaragdag ang mas tiyak na legal o moral na pahiwatig ng “pinaslang.”
- source_word: ἤγειρεν ἐκ νεκρῶν
  choice: muling binuhay ... mula sa mga patay
  rationale: Karaniwan at malinaw na pananalita sa Filipino para sa pagkabuhay na muli; pinananatili rin nito ang larawan ng pagbangon mula sa kalipunan ng mga patay.
- source_word: οὗ
  choice: nito
  rationale: Pinananatiling bukas ang pagtukoy sa malapit na pahayag—lalo na sa muling pagkabuhay—nang hindi lubusang isinasara ang posibilidad na tumukoy ito kay Jesus mismo.
- source_word: μάρτυρές ἐσμεν
  choice: mga saksi kami
  rationale: Pinananatili ang pangngalang anyo at ang diin sa katayuan ng mga apostol bilang mga saksi.
theological_decisions:
- issue: Kahulugan ng ἀρχηγός bilang titulong tumutukoy kay Cristo
  choice: Pinagmulan ng buhay
  alternative: Pinuno ng buhay; Tagapanguna sa buhay; May-akda ng buhay
  rationale: Ipinahahayag ng pangunahing salin ang aspektong pinagmulan at ang kabalintunaang pinatay nila ang kaugnay sa buhay mismo. Gayunman, hindi ipinapalagay na ito lamang ang saklaw ng ἀρχηγός; nasa talababa ang mga kahulugang pamumuno at pangunguna.
- issue: Tinutukoy ng οὗ sa huling sugnay
  choice: mga saksi kami nito
  alternative: mga saksi kami tungkol sa kanya
  rationale: Maaaring iugnay ang panghalip sa muling pagkabuhay bilang pangyayari o sa taong muling binuhay. Ang “nito” ay natural na tumutukoy sa agarang pahayag, habang tahasang pinananatili sa talababa ang alternatibong pagbasa.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Ginamit ang “muling binuhay” sa halip na mas teknikal na anyo upang maging malinaw sa karaniwang mambabasa. Ang semicolon ay nagpapanatili sa iisang daloy ng pangungusap habang nililinaw ang huling sugnay.
