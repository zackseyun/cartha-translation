  naturalness: Ang 'Sa inyo muna' at 'isinugo niya siya' ay likas at naaangkop sa marangal na modernong Tagalog. Ang binagong sugnay na 'habang ibinabaling niya ang bawat isa sa inyo palayo...' ay malinaw na itinatakda ang gumaganap at ang layon, at maayos na naihahatid ang malapit na paraan/kaugnayan ng ἐν τῷ + infinitive.
  terminology: Ang 'lingkod' ay angkop para sa παῖς at pinananatili ang alingawngaw ng Lingkod sa Isaias nang hindi isinasalin itong 'anak' o 'Anak.' Ang 'masasamang gawain' ay katanggap-tanggap na maramihang pagpapahayag ng πονηριῶν. Gumamit ng maliit na titik sa 'lingkod' sa pangunahing teksto upang hindi magpataw ng titulong wala sa anyo ng Griyego; ipinapaliwanag ng talababa ang malamang na konteksto.
