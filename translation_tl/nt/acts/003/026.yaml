  text: ὑμῖν πρῶτον ⸂ἀναστήσας ὁ θεὸς⸃ τὸν παῖδα ⸀αὐτοῦ ἀπέστειλεν αὐτὸν εὐλογοῦντα ὑμᾶς ἐν τῷ ἀποστρέφειν ἕκαστον ἀπὸ τῶν πονηριῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/026.yaml
  text: To you first[a], God, having raised up his servant[b], sent him to bless you by turning each of you from your wicked ways.
translation:
  language: tl
  text: Sa inyo muna[a], matapos ibangon ng Diyos ang kanyang lingkod[b], isinugo niya siya upang pagpalain kayo habang ibinabaling niya ang bawat isa sa inyo palayo sa inyong masasamang gawain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ibangon” ay maaari ring mangahulugang “palitawin” o “italaga” ang kanyang lingkod, at hindi kinakailangang tumukoy lamang sa pagbuhay sa kanya mula sa mga patay.
    reason: alternative_reading
  - marker: b
    text: O “anak.” Ang Griyegong παῖς ay maaaring mangahulugang “lingkod” o “anak,” ngunit malamang na “lingkod” ang diwa rito dahil sa kaugnayan sa Lingkod sa aklat ni Isaias.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῖν πρῶτον
  choice: Sa inyo muna
  rationale: Likas na ipinapahayag sa Tagalog ang pag-una ng pagpapalang ipinadala sa mga Judiong kausap ni Pedro, habang pinananatili ang diwang patungo sa kanila.
- source_word: ἀναστήσας
  choice: matapos ibangon
  rationale: Pinananatili ng “ibangon” ang maaaring pagtukoy sa muling pagkabuhay o sa pagpapalitaw/pagtatalaga ng Diyos sa kanyang Lingkod; hindi tahasang nilulutas ang tunay na kalabuan ng Griyego.
- source_word: τὸν παῖδα αὐτοῦ
  choice: ang kanyang Lingkod
  rationale: Mas malamang na tumutukoy ang παῖς sa Lingkod na nasa likuran ng mga pahayag ni Isaias. Posible rin ang “anak,” ngunit maaari itong magpahiwatig ng ibang terminong Griyego at magkubli sa ugnayang ito.
- source_word: ἀπέστειλεν αὐτόν
  choice: isinugo niya siya
  rationale: Ang “isinugo” ay natural at marangal, at pinananatili ang diwa ng pagpapadala nang hindi dinaragdagan ang pormal na ideya ng paghirang.
- source_word: εὐλογοῦντα ὑμᾶς
  choice: upang pagpalain kayo
  rationale: Idyomatikong ipinapahayag ang layunin o bunga ng pagsusugo sa kanya.
- source_word: ἐν τῷ ἀποστρέφειν ἕκαστον
  choice: sa pamamagitan ng pagtalikod sa bawat isa sa inyo
  rationale: Ipinakikita ng “sa pamamagitan” ang paraan ng pagpapala, habang pinananatili ng “bawat isa” ang distributibong diin ng ἕκαστον.
- source_word: ἀπὸ τῶν πονηριῶν ὑμῶν
  choice: mula sa inyong masasamang gawain
  rationale: Ang pangmaramihang πονηριῶν ay tumutukoy sa kongkretong mga pagpapakita ng kasamaan; malinaw at natural sa modernong Tagalog ang “masasamang gawain.”
theological_decisions:
- issue: Kahulugan ng ἀναστήσας kaugnay ni Jesus
  choice: Pinanatili ang “matapos ibangon” nang hindi tinutukoy kung ito ay muling pagkabuhay o pagpapalitaw/pagtatalaga.
  alternative: “matapos buhayin mula sa mga patay” o “matapos italaga/palitawin”
  rationale: Maaaring marinig sa Griyego ang muling pagkabuhay, ngunit maaari rin nitong alingawngawin ang pangakong magbabangon ang Diyos ng isang propeta o lingkod. Pinananatili ng salin at talababa ang teolohikal na tensiyon.
- issue: Kristolohikal na diwa ng παῖς
  choice: Lingkod
  alternative: anak
  rationale: Pinakamalinaw nitong pinananatili ang malamang na kaugnayan sa Lingkod ni Isaias at iniiwasang ipasok dito ang mas tahasang katawagang filial kaysa sa mismong salitang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “muna” para sa natural na pag-una, “isinugo” para sa biblikal ngunit kasalukuyang rehistro, at malaking titik sa “Lingkod” upang malinaw na titulo ang gamit nang hindi dinaragdagan ang kahulugan ng Griyego.
