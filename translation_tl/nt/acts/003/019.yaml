  text: μετανοήσατε οὖν καὶ ἐπιστρέψατε ⸀πρὸς τὸ ἐξαλειφθῆναι ὑμῶν τὰς ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/019.yaml
  text: Therefore repent and turn back[a], so that your sins may be wiped away,
translation:
  language: tl
  text: Kaya magsisi kayo at manumbalik, upang mapawi[a] ang inyong mga kasalanan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mabura.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετανοήσατε
  choice: magsisi kayo
  rationale: Ang aorist active imperative ay nananawagan ng tiyak at buong pagtugon. Likas sa modernong Tagalog ang “magsisi,” at naipahahayag nito ang moral na bigat ng μετάνοια nang hindi inuulit ang diwa ng kasunod na ἐπιστρέψατε.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita nito ang kongklusyon o tugon na hinihingi batay sa naunang pangangatwiran, sa natural at malinaw na Tagalog.
- source_word: ἐπιστρέψατε
  choice: manumbalik
  rationale: Pinananatili nito ang aktibong diwa ng pagbabalik, na sa konteksto ay pagbabalik sa Diyos, nang hindi ipinapasok ang pasibong tunog o sistematikong kahulugan ng “makumberte.”
- source_word: πρὸς τὸ ἐξαλειφθῆναι
  choice: upang mapawi
  rationale: Likas na ipinahahayag ng “upang” ang layunin o inaasahang bunga nang hindi mahigpit na nagpapasiya sa pagitan ng dalawang kaugnay na gamit ng parirala.
- source_word: ἐξαλειφθῆναι
  choice: mapawi
  rationale: Ang pasibong anyo ay napananatili, at ang “mapawi” ay malinaw at marangal na paglalarawan sa lubusang pag-aalis. Inilalagay sa talababa ang mas kongkretong alternatibong “mabura.”
- source_word: ἁμαρτίας
  choice: mga kasalanan
  rationale: Ito ang tuwiran, malawak, at karaniwang katumbas ng pangmaramihang ἁμαρτίας.
theological_decisions:
- issue: Ugnayan ng pagsisisi, panunumbalik, at pag-aalis ng mga kasalanan
  choice: “upang mapawi ang inyong mga kasalanan”
  alternative: “para sa pagpawi ng inyong mga kasalanan”
  rationale: Pinananatili ng salin ang malinaw na ugnayang inilalahad ng talata, ngunit hindi nito tinutukoy ang isang mas detalyadong mekanismong doktrinal na hindi naman tahasang sinasabi rito.
- issue: Pinatutungkulan ng panunumbalik
  choice: “manumbalik” nang hindi tahasang idinaragdag ang “sa Diyos”
  alternative: “manumbalik sa Diyos”
  rationale: Malinaw sa konteksto na ang Diyos ang pinanunumbalikan, ngunit hindi tahasang nasa pariralang Griyego ang layon; kaya hindi ito idinagdag sa pangunahing teksto.
translation_notes:
  register: 'Modernong Filipino Tagalog na natural, maikli, at marangal. Ang “magsisi” at “manumbalik” ay magkaugnay ngunit hindi pinag-iisa: pinananatili ng una ang pagsisisi at ng ikalawa ang aktibong pagbabalik. Inilagay ang [a] pagkatapos ng “mapawi” sapagkat doon tumutukoy ang leksikal na alternatibo.'
