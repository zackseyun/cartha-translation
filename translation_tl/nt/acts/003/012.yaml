  text: ἰδὼν δὲ ⸀ὁ Πέτρος ἀπεκρίνατο πρὸς τὸν λαόν· Ἄνδρες Ἰσραηλῖται, τί θαυμάζετε ἐπὶ τούτῳ, ἢ ἡμῖν τί ἀτενίζετε ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ πεποιηκόσιν τοῦ περιπατεῖν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/012.yaml
  text: But when Peter saw it[a], he answered the people, “Men of Israel, why do you marvel at this[b], or why do you stare at us as though by our own power or godliness we had made him walk?”
translation:
  language: tl
  text: Nang makita ito ni Pedro, tumugon siya sa mga tao, “Mga lalaking Israelita, bakit kayo namamangha sa nangyaring ito? O bakit ninyo kami tinititigan[a] na para bang napalakad namin siya sa pamamagitan ng sarili naming kapangyarihan o kabanalan[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matamang tinitingnan.” Ipinahihiwatig ng pandiwa ang nakapako o tuloy-tuloy na pagtingin.
    reason: lexical_alternative
  - marker: b
    text: O “pagiging maka-Diyos” o “debosyon.” Itinatanggi ni Pedro na ang paggaling ng lalaki ay nagmula sa sarili nilang espirituwal na katangian o relihiyosong debosyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πέτρος
  choice: Nang makita ito ni Pedro
  rationale: Ginawang sugnay na panahunan ang aorist participle upang maging natural sa Tagalog. Ang “ito” ay tumutukoy, ayon sa konteksto, sa reaksiyon ng mga tao sa paggaling ng lalaki; ang δέ ay ipinahiwatig sa paglipat ng salaysay sa tugon ni Pedro sa halip na piliting tumbasan ng isang pangatnig.
- source_word: ἀπεκρίνατο πρὸς τὸν λαόν
  choice: tumugon siya sa mga tao
  rationale: Maaaring magpahayag ang ἀποκρίνομαι ng tugon sa isang pangyayari kahit walang naunang tahasang tanong. Natural at tapat dito ang “tumugon.”
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Mga lalaking Israelita
  rationale: Pinananatili ang tahasang panlalaking anyo ng ἄνδρες at ang pagkakakilanlang Israelita ng mga kinakausap, kahit medyo pormal ang tawag sa makabagong Tagalog.
- source_word: τί θαυμάζετε ἐπὶ τούτῳ
  choice: bakit kayo namamangha sa nangyaring ito
  rationale: Ang θαυμάζω ay nagpapahayag ng matinding pagtataka o pagkamangha. Nililinaw ng “nangyaring ito” na ang tinutukoy ng τούτῳ ay ang pangyayari ng pagpapagaling.
- source_word: ἢ ἡμῖν τί ἀτενίζετε
  choice: At bakit ninyo kami tinititigan
  rationale: Ang ἀτενίζω ay matamang o tuloy-tuloy na pagtingin. Ang “tinititigan” ay natural sa Tagalog at taglay ang lakas ng pandiwa. Isinalin ang ἤ bilang “At” upang natural na iugnay ang ikalawang retorikal na tanong nang hindi binabago ang alternatibong diin ng Griyego.
- source_word: ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ
  choice: na para bang ... sa pamamagitan ng sarili naming kapangyarihan o kabanalan
  rationale: Ipinakikita ng “para bang” ang maling palagay na itinatanggi ni Pedro. Idiniriin ng “sarili naming” ang ἰδίᾳ, at pinananatili ng “kabanalan” ang relihiyosong diwa ng εὐσέβεια nang hindi nagdaragdag ng isang doktrina tungkol sa merito.
- source_word: πεποιηκόσιν τοῦ περιπατεῖν αὐτόν
  choice: napalakad namin siya
  rationale: Likas na ipinahahayag ng “napalakad” ang pagpapangyaring makalakad ang lalaki at ang natapos na bungang ipinahihiwatig ng perfect participle.
theological_decisions:
- issue: Kung ang εὐσεβείᾳ ay dapat isaling para magpahiwatig na maaaring magmula ang himala sa espirituwal na merito ng mga apostol
  choice: kabanalan
  alternative: pagiging maka-Diyos; debosyon
  rationale: Itinatanggi ni Pedro na ang paggaling ay bunga ng sarili nilang kapangyarihan o espirituwal na katangian. Pinananatili ng “kabanalan” ang relihiyosong saklaw ng salita ngunit hindi nag-aangkat ng mas huling kategoryang teolohikal tungkol sa merito.
- issue: Ang panlalaking pantawag na Ἄνδρες Ἰσραηλῖται
  choice: Mga lalaking Israelita
  alternative: Mga Israelita; Bayang Israel
  rationale: Tahasan ang panlalaking anyo sa Griyego. Pinanatili ito sa salin sa halip na gawing neutral, nang hindi ipinapalagay na lalaki lamang ang lahat ng maaaring nakarinig.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog para sa pampublikong pananalita. Pinanatili ang retorikal na dalawang tanong at ang pormal na panawag na “Mga lalaking Israelita.” Ang mga talababa ay ikinabit sa mismong mga salitang may leksikal na alternatibo.
