  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν δὲ Πέτρος· Ἀργύριον καὶ χρυσίον οὐχ ὑπάρχει μοι, ὃ δὲ ἔχω τοῦτό σοι δίδωμι· ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου ⸀περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/006.yaml
  text: 'But Peter said[a], “Silver and gold I do not have, but what I do have, this I give to you: in the name of Jesus the Messiah the Nazarene[b], walk.”'
translation:
  language: tl
  text: 'Ngunit sinabi ni Pedro, “Wala akong pilak o ginto, ngunit ang mayroon ako, iyon ang ibinibigay ko sa iyo: sa pangalan ni Jesus na Mesiyas[a], ang Nazareno[b], lumakad ka.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Jesus na Cristo.” Isinalin dito ang titulong Griyego na Χριστός bilang “Mesiyas” upang mapanatili ang kahulugan nito.
    reason: alternative_reading
  - marker: b
    text: O “na taga-Nazaret.” Mas literal sa Griyego ang “ang Nazareno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀργύριον καὶ χρυσίον
  choice: pilak o ginto
  rationale: Pinananatili ang tahasang pagbanggit sa dalawang metal bilang karaniwang pahayag tungkol sa salapi o materyal na yaman. Sa pangungusap na may pagtanggi, mas natural sa Filipino ang “o” kaysa “at.”
- source_word: οὐχ ὑπάρχει μοι
  choice: Wala akong
  rationale: Likas na paraan ito sa Filipino upang ipahayag ang pag-aari na itinatanggi ng idyomang Griyego.
- source_word: ὃ δὲ ἔχω τοῦτό σοι δίδωμι
  choice: ngunit ibinibigay ko sa iyo ang mayroon ako
  rationale: Malinaw na pinananatili ang pagsalungat sa kawalan ng pilak o ginto at ang diin sa bagay na talagang maibibigay ni Pedro.
- source_word: ἐν τῷ ὀνόματι
  choice: sa pangalan ni
  rationale: Pinananatili ang anyo at teolohikal na bigat ng parirala; maaari rin nitong ipahiwatig ang awtoridad nang hindi iyon tahasang idinaragdag.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Isinalin ang Χριστός bilang titulong “Mesiyas,” samantalang pinanatili ang kinagawiang anyong Filipino ng pangalang Jesus.
- source_word: τοῦ Ναζωραίου
  choice: ang Nazareno
  rationale: Direktang pinananatili ang katawagang adjectival o titular sa Griyego sa halip na agad itong gawing “taga-Nazaret.”
- source_word: περιπάτει
  choice: lumakad ka
  rationale: Tuwirang utos ito na natural sa Filipino at hindi nagdaragdag ng interpretasyong tulad ng “magsimula kang lumakad.”
theological_decisions:
- issue: Pagkakasalin sa Χριστοῦ sa pormulang “sa pangalan”
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa kontekstong ito, malinaw pa rin ang gamit ng Χριστός bilang titulo. Pinananatili sa talababa ang tradisyonal na anyong “Cristo.”
- issue: Pahiwatig ng ἐν τῷ ὀνόματι
  choice: sa pangalan ni
  alternative: sa awtoridad ni
  rationale: Hindi tahasang nilulutas ang saklaw ng parirala bilang awtoridad, kapangyarihan, o pagkilos na nakabatay sa pangalan; pinananatili ang mas malawak na pahayag ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang konkretong “pilak o ginto,” ang pormulang “sa pangalan ni,” at ang maikli at tuwirang utos na “lumakad ka.”
