  yaml_path: translation/nt/acts/006/008.yaml
  text: Stephen[a], full of grace and power, was doing great wonders and signs among the people.
translation:
  language: tl
  text: Si Esteban, na puspos ng biyaya[a] at kapangyarihan, ay gumagawa noon ng mga dakilang kababalaghan at mga dakilang tanda sa gitna ng mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito ay mababasa ang “puspos ng pananampalataya at kapangyarihan” sa halip na “puspos ng biyaya at kapangyarihan.”
    reason: textual_variant
lexical_decisions:
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay, hindi matinding pagsalungat. Natural sa Tagalog ang pagpapatuloy ng pangungusap nang walang tahasang pang-ugnay rito.
- source_word: πλήρης χάριτος καὶ δυνάμεως
  choice: puspos ng biyaya at kapangyarihan
  rationale: Ipinahihiwatig ng πλήρης na si Esteban ay lubos na taglay o kinakitaan ng mga katangiang ito. Pinananatili ng “biyaya” ang lawak at teolohikal na himig ng χάρις, at ang “kapangyarihan” ang likas na kahulugan ng δύναμις sa konteksto ng mga himala.
- source_word: ἐποίει
  choice: gumagawa
  rationale: Ang aspektong imperfect ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na gawain sa nakaraang salaysay. Sa Tagalog, naipahahayag ito nang natural ng “gumagawa” sa konteksto.
- source_word: τέρατα καὶ σημεῖα μεγάλα
  choice: mga dakilang kababalaghan at mga dakilang tanda
  rationale: Pinananatili ang pagkakaiba ng τέρατα, na nagbibigay-diin sa pagkamangha, at σημεῖα, na nagbibigay-diin sa kahulugang itinuturo ng mga gawa. Inulit ang “dakilang” upang malinaw na inilalarawan nito ang dalawang pangngalan.
- source_word: ἐν τῷ λαῷ
  choice: sa gitna ng mga tao
  rationale: Likas na Tagalog ito para sa saklaw o kapaligiran kung saan naganap ang mga gawa, nang hindi nililimitahan kung sino lamang ang nakasaksi.
theological_decisions:
- issue: Tekstuwal na pagkakaiba sa χάριτος/πίστεως
  choice: biyaya
  alternative: pananampalataya
  rationale: Ang ibinigay na SBLGNT ay may χάριτος (“biyaya”), kaya ito ang sinusunod sa pangunahing teksto. Pinananatili sa talababa ang mahalagang alternatibong pagbasa na πίστεως (“pananampalataya”) upang hindi maitago ang tekstuwal at teolohikal na pagkakaiba.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “puspos” bilang pamilyar at dignified na pananalita sa kontekstong biblikal; malinaw naman sa pangkalahatang mambabasa ang natitirang bokabularyo.
