id: ACT.6.1
reference: Acts 6:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ταύταις πληθυνόντων τῶν μαθητῶν ἐγένετο γογγυσμὸς τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους ὅτι παρεθεωροῦντο ἐν τῇ διακονίᾳ τῇ καθημερινῇ αἱ χῆραι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/001.yaml
  text: In those days[a], as the disciples were increasing in number, a complaint arose from the Hellenists against the Hebrews[b], because their widows were being overlooked in the daily distribution.
translation:
  language: tl
  text: Noong mga araw na iyon, habang dumarami ang mga alagad, nagkaroon ng reklamo ang mga Helenista laban sa mga Hebreo[a], dahil napapabayaan ang kanilang mga biyuda sa araw-araw na pamamahagi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga Helenista” ay malamang na mga Judiong nagsasalita ng Griego, samantalang ang “mga Hebreo” ay malamang na mga Judiong nagsasalita ng Aramaico o Hebreo.
    reason: Paliwanag sa makasaysayan at kultural na mga katawagan.
  - marker: b
    text: 'Maaari ring isalin: “hindi napapansin sa araw-araw na paglilingkod.”'
    reason: Pinananatili ang posibleng kahulugan ng παρεθεωροῦντο at ang mas malawak na saklaw ng διακονία bilang paglilingkod o pamamahagi.
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ταύταις
  choice: Nang mga araw na iyon
  rationale: Likas na salin sa Filipino ng panandang temporal; ang mahinang puwersang pang-ugnay ng δέ ay hindi kailangang gawing tahasang pagsalungat.
- source_word: πληθυνόντων τῶν μαθητῶν
  choice: habang dumarami ang mga alagad
  rationale: Ipinapahayag ang pangyayaring nasa likuran ng pangunahing salaysay at ang patuloy na pagdami ng bilang.
- source_word: ἐγένετο γογγυσμός
  choice: nagkaroon ng reklamo
  rationale: Ang γογγυσμός ay maaaring tumukoy sa pagbulong-bulong o reklamo; ang pinili ay natural at angkop sa tiyak na hinaing na kasunod.
- source_word: τῶν Ἑλληνιστῶν
  choice: ang mga Helenista
  rationale: Pinananatili ang makasaysayang katawagan sa grupo sa halip na isara sa pangunahing teksto ang malamang na lingguwistiko at kultural na kahulugan nito.
- source_word: πρὸς τοὺς Ἑβραίους
  choice: laban sa mga Hebreo
  rationale: Ipinakikita ng πρός ang pinatutungkulan ng reklamo, at ang “laban sa” ay angkop sa panlipunang tensiyon ng konteksto.
- source_word: παρεθεωροῦντο
  choice: hindi nabibigyan ng nararapat na pansin
  rationale: Ipinahihiwatig ng imperpektong pasibo ang nagpapatuloy na kalagayan; hindi nito ipinapalagay na sinasadya ang hindi pagpansin.
- source_word: ἐν τῇ διακονίᾳ τῇ καθημερινῇ
  choice: sa araw-araw na pamamahagi
  rationale: Bagaman malawak ang διακονία bilang paglilingkod o ministeryo, itinuturo ng konteksto ng mga biyuda at materyal na paglalaan ang pamamahagi.
- source_word: αἱ χῆραι αὐτῶν
  choice: ang kanilang mga biyuda
  rationale: Pinananatili ang likas na pagtukoy ng panghalip sa mga Helenista at ang ugnayang panlipunan ng hinaing.
theological_decisions:
- issue: Pagkakakilanlan ng mga grupong Ἑλληνισταί at Ἑβραῖοι
  choice: Panatilihin sa teksto ang mga katawagang “Helenista” at “Hebreo,” at ipaliwanag sa talababa.
  alternative: “mga Judiong nagsasalita ng Griego” at “mga Judiong nagsasalita ng Aramaico o Hebreo”
  rationale: Hindi ganap na tinutukoy ng mismong mga katawagan ang lahat ng hangganang etniko, lingguwistiko, at kultural. Ang pagpapanatili sa mga ito ay umiiwas sa labis na pagpapaliwanag habang nagbibigay-linaw ang talababa.
- issue: Lakas at intensiyon ng παρεθεωροῦντο
  choice: “hindi nabibigyan ng nararapat na pansin”
  alternative: “napapabayaan”
  rationale: Pinananatili ng salin ang patuloy na pagkukulang nang hindi ipinapalagay na sinasadya ang pagtatangi; inilalahad sa talababa ang mas maikli at mas matinding alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “biyuda,” na karaniwan at malinaw sa kasalukuyang Filipino, at pinanatili ang makasaysayang mga katawagang “Helenista” at “Hebreo” na may paliwanag sa talababa.
