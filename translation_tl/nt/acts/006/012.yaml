  text: συνεκίνησάν τε τὸν λαὸν καὶ τοὺς πρεσβυτέρους καὶ τοὺς γραμματεῖς, καὶ ἐπιστάντες συνήρπασαν αὐτὸν καὶ ἤγαγον εἰς τὸ συνέδριον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/012.yaml
  text: So they stirred up the people and the elders and the scribes[a], and coming upon him, they seized him and brought him before the Sanhedrin,
translation:
  language: tl
  text: Kaya inudyukan nila ang mga tao, ang mga nakatatanda, at ang mga eskriba; pagkatapos ay bigla nilang nilapitan siya, dinakip siya, at dinala sa harap ng Sanedrin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “konseho.” Ang salitang Griyego na συνέδριον ay maaaring isalin sa mas pangkalahatang paraan, ngunit dito ay malamang na tumutukoy ito sa namumunong konsehong Hudyo, ang Sanedrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκίνησάν
  choice: inudyukan
  rationale: Ipinahahayag nito ang sadyang pag-udyok sa mga tao at pinuno na kumilos laban kay Esteban, nang hindi ipinapalagay na marahas na agad ang pagkilos.
- source_word: τε
  choice: Kaya
  rationale: Mahinang pang-ugnay ito; sa daloy ng salaysay, natural na ipinakikita ng “Kaya” ang kasunod na bunga ng naunang balak at pagkilos.
- source_word: τὸν λαὸν
  choice: ang mga tao
  rationale: Direkta at hindi labis na nililimitahan ang λαός bilang sambayanan o mga taong naroon.
- source_word: τοὺς πρεσβυτέρους
  choice: ang mga matatandang pinuno
  rationale: Sa kontekstong Hudyo at panghukuman, tumutukoy ito sa kinikilalang mga elder o pinuno, hindi lamang sa matatandang lalaki.
- source_word: τοὺς γραμματεῖς
  choice: ang mga tagapagturo ng Kautusan
  rationale: Mas malinaw ito sa karaniwang mambabasang Filipino kaysa “mga eskriba,” habang ipinahahayag ang kanilang tungkulin bilang mga dalubhasa sa Kasulatan at Kautusan.
- source_word: ἐπιστάντες
  choice: bigla nilang nilapitan
  rationale: Pinananatili ang diwa ng mabilis o biglaang paglapit na humantong sa pagdakip.
- source_word: συνήρπασαν
  choice: dinakip
  rationale: Natural at sapat na mariing Filipino para sa sapilitang pagsunggab o pagkuha sa isang tao.
- source_word: ἤγαγον
  choice: dinala
  rationale: Malinaw na ipinakikita ang pagpapapunta kay Esteban sa konseho matapos siyang dakpin, nang hindi ipinahihiwatig na kusang sumama siya.
- source_word: τὸ συνέδριον
  choice: Sanedrin
  rationale: Sa kontekstong ito, tumutukoy ito sa namumunong konsehong Hudyo sa Jerusalem; pinananatili ng makasaysayang katawagang “Sanedrin” ang institusyonal na katiyakan.
theological_decisions:
- issue: Pagpapakahulugan sa συνέδριον
  choice: Sanedrin
  alternative: konseho
  rationale: Makasaysayan at panghukuman ang usapin, hindi pangunahing doktrinal. Dahil sa tagpuang Jerusalem at sa pagbanggit sa mga pinuno at tagapagturo ng Kautusan, malamang na ang tinutukoy ay ang namumunong konsehong Hudyo.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “mga matatandang pinuno” at “mga tagapagturo ng Kautusan” upang maging malinaw sa ordinaryong mambabasa ang mga makasaysayang tungkulin. Inilipat ang pangalan ni Esteban mula sa panghalip upang maiwasan ang kalabuan sa Filipino; malinaw ang tinutukoy mula sa konteksto.
