reference: Acts 6:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἤρεσεν ὁ λόγος ἐνώπιον παντὸς τοῦ πλήθους, καὶ ἐξελέξαντο Στέφανον, ἄνδρα ⸀πλήρης πίστεως καὶ πνεύματος ἁγίου, καὶ Φίλιππον καὶ Πρόχορον καὶ Νικάνορα καὶ Τίμωνα καὶ Παρμενᾶν καὶ Νικόλαον προσήλυτον Ἀντιοχέα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/005.yaml
  text: And the proposal pleased the whole multitude[a], and they chose Stephen, a man full of faith and of the Holy Spirit, Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolaus[c][b], a proselyte of Antioch.
translation:
  language: tl
  text: Nagustuhan ng buong kapulungan ang panukalang ito, at pinili nila si Esteban, isang lalaking puspos ng pananampalataya[a] at ng Espiritu Santo, at sina Felipe, Procoro, Nicanor, Timon, Parmenas, at Nicolas[c], isang proselito[b] mula sa Antioquia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katapatan.” Ang salitang Griego ay maaaring mangahulugang pananampalataya, pagtitiwala, o katapatan.
    reason: lexical_alternative
  - marker: b
    text: Ang “proselito” ay isang Hentil na yumakap sa Judaismo.
    reason: cultural_note
  - marker: c
    text: 'Mas malapit sa paulit-ulit na mga pangatnig sa Griego: “si Esteban, isang lalaking puspos ng pananampalataya at ng Espiritu Santo, at si Felipe at si Procoro at si Nicanor at si Timon at si Parmenas at si Nicolas.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ λόγος
  choice: ang panukalang ito
  rationale: Tumutukoy ito sa mungkahing kasasabi lamang ng mga apostol, hindi sa abstraktong “salita.” Nililinaw ng “ito” ang ugnayan sa naunang pahayag.
- source_word: ἤρεσεν ... ἐνώπιον παντὸς τοῦ πλήθους
  choice: Nagustuhan ng buong kapulungan
  rationale: Likas na ipinapahayag sa Filipino na sinang-ayunan o kinalugdan ng buong nagkakatipong pangkat ang panukala. Iniiwasan ng “kapulungan” ang mas makitid na terminong pang-iglesia.
- source_word: ἐξελέξαντο
  choice: pinili nila
  rationale: Direkta at likas na katumbas ng pagpili ng kapulungan sa mga lalaking ito.
- source_word: ἄνδρα πλήρης πίστεως καὶ πνεύματος ἁγίου
  choice: isang lalaking puspos ng pananampalataya at ng Espiritu Santo
  rationale: Pinananatili ang tahasang ἀνήρ at ang paglalarawan kay Esteban. Ang “puspos” ay marangal at karaniwang biblikal na katumbas ng πλήρης.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Ito ang pinakanatural na pangunahing diwa sa paglalarawan kay Esteban; nananatili sa talababa ang posibleng diwang “katapatan.”
- source_word: πνεύματος ἁγίου
  choice: Espiritu Santo
  rationale: Sa konteksto ng Mga Gawa, tumutukoy ito sa banal na Espiritu bilang tiyak na persona, hindi lamang sa isang banal na disposisyon.
- source_word: προσήλυτον
  choice: proselito
  rationale: Tumpak na makasaysayang katawagan ito sa isang Hentil na yumakap sa Judaismo; ipinaliliwanag sa talababa para sa karaniwang mambabasa.
- source_word: Ἀντιοχέα
  choice: mula sa Antioquia
  rationale: Natural na Filipino para sa pang-uring tumutukoy sa pinagmulan o kaugnayan ni Nicolas sa Antioquia.
- source_word: Στέφανον, Φίλιππον, Πρόχορον, Νικάνορα, Τίμωνα, Παρμενᾶν, Νικόλαον
  choice: Esteban, Felipe, Procoro, Nicanor, Timon, Parmenas, at Nicolas
  rationale: Ginamit ang mga anyo ng pangalang nakagawian at madaling makilala sa tradisyong biblikal na Filipino.
theological_decisions:
- issue: Diwa ng πίστις sa paglalarawan kay Esteban
  choice: pananampalataya
  alternative: katapatan
  rationale: Maaaring tumukoy ang πίστις sa pananampalataya, pagtitiwala, o katapatan. Sa kontekstong ito, “pananampalataya” ang pinakanatural na pangunahing basa, ngunit hindi isinasara ang tunay na posibleng diwang “katapatan.”
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “kapulungan” bilang neutral na katawagan sa buong nagkakatipong pangkat, at “gayundin sina” upang malinaw na kabilang sa iisang listahan ang anim na pangalang kasunod ni Esteban nang hindi ginagaya ang mabigat na paulit-ulit na καί ng Griego.
