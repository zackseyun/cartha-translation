  naturalness: Karaniwang malinaw at angkop sa modernong Filipino ang wika. Mas tuwiran at likas ang “at pinili nila” at “at sina Felipe” kaysa “kaya pinili nila” at “gayundin sina Felipe,” habang napapanatili ang iisang talaan ng pitong pinili.
  terminology: Ang “kapulungan,” “pananampalataya,” “Espiritu Santo,” “proselito,” at mga anyo ng pangalan ay angkop. Ang “isang proselito mula sa Antioquia” ay wastong inilalapat kay Nicolas lamang.
