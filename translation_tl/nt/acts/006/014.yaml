  source_fidelity: 'Tumpak ang pangunahing nilalaman: ang paratang ay ipinahahayag bilang bagay na narinig ng mga saksi, pinananatili ang demonstratibong diin sa pagtukoy kay Jesus, ang ‘lugar na ito,’ at ang mga kaugaliang ipinamana ni Moises. Gayunman, ang αὐτοῦ λέγοντος ay mas tuwirang naipapahayag ng ‘siyang nagsasabi’ kaysa ‘siyang nagsabi,’ na maaaring magtunog isang hiwalay at tapos na pahayag.'
  naturalness: Marangal at likas ang daloy ng Filipino. Ang ‘gigibain,’ ‘lugar na ito,’ at ‘mga kaugalian’ ay malinaw at angkop. Mas natural din sa konstruksyong ‘narinig namin siyang … na’ ang pandiwang ‘nagsasabi.’
  terminology: Ang ‘Jesus na Nazareno’ ay katanggap-tanggap bilang nakikilalang katawagan at pinananatili ang paglalarawang ὁ Ναζωραῖος; ang alternatibong ‘taga-Nazaret’ ay wastong ibinigay sa talababa. Ang ‘mga kaugaliang ipinamana’ ay angkop para sa τὰ ἔθη at παρέδωκεν, nang hindi ipinipilit ang mas teknikal na ‘tradisyon.’
