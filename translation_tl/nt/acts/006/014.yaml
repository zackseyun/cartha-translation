id: ACT.6.14
reference: Acts 6:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀκηκόαμεν γὰρ αὐτοῦ λέγοντος ὅτι Ἰησοῦς ὁ Ναζωραῖος οὗτος καταλύσει τὸν τόπον τοῦτον καὶ ἀλλάξει τὰ ἔθη ἃ παρέδωκεν ἡμῖν Μωϋσῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/014.yaml
  text: For we heard him saying that this Jesus the Nazarene will destroy this place and will change the customs that Moses handed down to us[a][b][c].
translation:
  language: tl
  text: Sapagkat narinig namin siyang nagsasabi na gigibain nitong si Jesus na Nazareno[a] ang lugar na ito[b] at babaguhin niya ang mga kaugaliang ipinamana sa atin ni Moises.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nitong si Jesus na taga-Nazaret.”
    reason: lexical_alternative
  - marker: b
    text: Ang “lugar na ito” ay tumutukoy sa templo.
    reason: cultural_note
  - marker: c
    text: O “mga tradisyong ibinigay sa atin ni Moises.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκόαμεν
  choice: narinig namin
  rationale: Ang perpektong anyo ay nagpapahiwatig ng narinig na nananatiling mahalaga sa kasalukuyang paratang; likas sa Filipino ang payak na “narinig namin” sa ganitong salaysay.
- source_word: γὰρ
  choice: sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan nito sa naunang paratang.
- source_word: αὐτοῦ λέγοντος
  choice: siyang nagsabi
  rationale: Natural na Filipino para sa konstruksyong nagpapahayag na tuwirang narinig nila ang sinasabi ni Esteban.
- source_word: Ἰησοῦς ὁ Ναζωραῖος οὗτος
  choice: nitong si Jesus na Nazareno
  rationale: Pinananatili ng “nitong” ang madiing demonstratibo at bahagyang mapanlait na himig ng mga nag-aakusa; ang “Nazareno” ay likas at kinikilalang katawagan sa Filipino.
- source_word: καταλύσει
  choice: gigibain
  rationale: Sa konteksto ng templo, malinaw na ipinahihiwatig ng pandiwa ang paggiba o pagwasak ng isang gusali; mas tiyak at natural dito ang “gigibain.”
- source_word: τὸν τόπον τοῦτον
  choice: ang lugar na ito
  rationale: Tuwirang pinananatili ang “lugar” sa Griyego sa halip na tahasang idagdag ang “templo,” kahit iyon ang tinutukoy sa konteksto.
- source_word: ἀλλάξει
  choice: babaguhin niya
  rationale: Tuwirang katumbas ng pandiwang nasa hinaharap; idinagdag ang panghalip upang maging malinaw at natural ang daloy sa Filipino.
- source_word: τὰ ἔθη
  choice: ang mga kaugalian
  rationale: Saklaw nito ang minanang gawaing panlipunan at panrelihiyon nang hindi ipinapasok ang mas teknikal na kahulugan na maaaring taglayin ng “mga tradisyon.”
- source_word: ἃ παρέδωκεν ἡμῖν Μωϋσῆς
  choice: na ipinamana sa atin ni Moises
  rationale: Ipinahahayag ng “ipinamana” ang paghahatid ng mga kaugalian mula sa naunang salinlahi tungo sa sumunod, na siyang diwa ng παραδίδωμι rito.
theological_decisions:
- issue: Tinutukoy ng “ang lugar na ito”
  choice: Pinanatili sa pangunahing teksto ang literal na “ang lugar na ito.”
  alternative: ang templong ito; ang santuwaryong ito
  rationale: Bagaman malinaw sa konteksto na templo ang tinutukoy, “lugar” ang mismong ginamit sa Griyego. Hindi dapat gawing tahasan sa pangunahing teksto ang nananatiling pahiwatig sa pinagmulan.
- issue: Himig ng paratang laban kay Jesus
  choice: Pinanatili ang madiing “nitong si Jesus na Nazareno.”
  alternative: si Jesus na taga-Nazaret; si Jesus na Nazareno
  rationale: Sinasalamin nito ang mapanuligsa o mapanlait na himig ng mga nag-aakusa nang hindi dinaragdagan ang sinabi nila.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “gigibain” para sa konkretong banta laban sa templo, “mga kaugalian” para sa minanang mga gawain, at “ipinamana” upang natural na maipahayag ang paghahatid ng mga ito. Pinanatili ang retorikal na diin at tensiyon ng paratang.
