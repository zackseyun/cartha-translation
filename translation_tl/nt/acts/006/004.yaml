  yaml_path: translation/nt/acts/006/004.yaml
  text: But we will devote ourselves to prayer and to the ministry of the word[a].
translation:
  language: tl
  text: Ngunit itatalaga namin ang aming sarili sa pananalangin at sa paglilingkod sa salita[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ministeryo ng salita.” Ang salitang Griyego ay maaaring mangahulugang “paglilingkod” o “ministeryo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: namin ang aming sarili
  rationale: Ang tahasang panghalip sa Griyego ay may diin at kaibahan. Likas na naipapahayag ito sa Filipino sa pariralang “iuukol namin ang aming sarili,” kasama ng “Ngunit.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita nito ang kaibahan sa gawaing iniatas sa iba sa naunang konteksto.
- source_word: τῇ προσευχῇ
  choice: sa pananalangin
  rationale: Tumutukoy ito sa gawaing patuloy nilang pag-uukulan ng sarili; natural at malinaw ang “sa pananalangin” sa modernong Filipino.
- source_word: διακονίᾳ
  choice: paglilingkod
  rationale: Maaaring mangahulugan ang διακονία ng paglilingkod o ministeryo. Pinananatili ng “paglilingkod” ang ugnayan nito sa diwa ng serbisyo at iniiwasang magpasok ng di-hayag na pagkakahating klero-laiko.
- source_word: τοῦ λόγου
  choice: sa salita
  rationale: Pinananatili nito ang maagang Kristiyanong katawagang tumutukoy sa ipinahahayag na salita o mensahe ng Diyos, nang hindi idinaragdag sa pangunahing teksto ang salitang “Diyos,” na hindi tahasang naroon.
- source_word: προσκαρτερήσομεν
  choice: iuukol namin ang aming sarili
  rationale: Ipinahihiwatig ng pandiwa ang matatag at patuloy na pagtatalaga sa isang gawain. Ang hinaharap na “iuukol” ay tumutugma sa anyong future indicative ng Griyego.
theological_decisions:
- issue: Pagpapakahulugan sa διακονία kaugnay ng paglilingkod sa mga hapag sa agarang konteksto
  choice: paglilingkod sa salita
  alternative: ministeryo ng salita
  rationale: Iisang larangan ng kahulugan ng paglilingkod ang nasa praktikal na gawain at sa pagpapahayag. Ang “paglilingkod” ay nagpapanatili sa ugnayang ito at hindi nagpapahiwatig ng isang pormal na katungkulan o mahigpit na pagkakahating klero-laiko na hindi tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “pananalangin” sa halip na mas kolokyal na “pagdarasal,” at pinanatili ang “salita” upang hindi labis na ipaliwanag ang λόγος sa pangunahing teksto.
