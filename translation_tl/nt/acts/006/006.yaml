  verdict: revise
  source_fidelity: Ang “pinatayo” ay posibleng literal na paglalapat ng causative na ἔστησαν, ngunit sa kontekstong ito ay hindi nito pinakamalinaw na naihahatid ang diwa ng paghaharap ng pitong tao sa mga apostol. Ang “iniharap” ay mas tumpak at likas. Napapanatili ng “pagkatapos manalangin” ang nauunang kilos ng participle na προσευξάμενοι, at ang “ipinatong ... ang kanilang mga kamay” ay hindi nagdaragdag ng pakahulugang ordinasyon o iba pang tiyak na ritwal.
  naturalness: Ang “Pinatayo nila ang mga ito sa harap” ay medyo matigas sa modernong Filipino at maaaring magpahiwatig lamang na pinatindig sila. Mas likas ang “Iniharap nila ang mga ito sa mga apostol.” Inayos din ang ayos ng mga layon sa ikalawang sugnay upang maging mas dumadaloy ang pangungusap.
  terminology: Ang “mga apostol,” “manalangin,” at “ipinatong ... ang kanilang mga kamay” ay angkop sa marangal ngunit makabagong rehistro. Iniingatan ng talababa ang pagiging bukás ng kahulugan ng pagpapatong ng kamay at hindi ito tinutumbasan ng “ordinasyon.”
  issues:
  - severity: medium
    issue: Ang “pinatayo” ay masyadong literal at maaaring magbago ng diin ng ἔστησαν.
    rationale: Sa pariralang ἔστησαν ἐνώπιον, ang likas na diwa sa konteksto ay iharap o ilagay sa harap ng isang awtoridad, hindi lamang utusang tumayo ang mga tao.
  - severity: low
    issue: Mas mabigat kaysa kailangan ang ayos na “ipinatong nila sa mga ito ang kanilang mga kamay.”
    rationale: Ang “ipinatong nila ang kanilang mga kamay sa mga ito” ay mas natural na ayos sa Filipino, nang walang pagbabagong semantiko.
  revised_text: Iniharap nila ang mga ito sa mga apostol[a], at pagkatapos manalangin, ipinatong nila ang kanilang mga kamay sa mga ito.[b]
