  text: οὓς ἔστησαν ἐνώπιον τῶν ἀποστόλων, καὶ προσευξάμενοι ἐπέθηκαν αὐτοῖς τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/006.yaml
  text: These they set before the apostles[a], and after praying[b], they laid their hands on them.
translation:
  language: tl
  text: Iniharap nila ang mga ito sa mga apostol[a], at pagkatapos manalangin, ipinatong nila ang kanilang mga kamay sa mga ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inilagay nila ang mga ito sa harap ng mga apostol.”
    reason: lexical_alternative
  - marker: b
    text: Ang pagpapatong ng mga kamay ay maaaring magpahiwatig ng pampublikong pagtatalaga o pagpapala; binabanggit ng Griyego ang kilos ngunit hindi nito higit na nililinaw dito ang kahulugan nito sa buhay ng iglesya.
    reason: cultural_note
lexical_decisions:
- source_word: οὓς
  choice: ang mga ito
  rationale: Tumutukoy ito sa pitong lalaking binanggit sa naunang talata. Hindi na idinagdag ang salitang “lalaki” dahil malinaw na ang tinutukoy at wala itong tahasang katumbas sa panghalip na Griyego.
- source_word: ἔστησαν ἐνώπιον
  choice: pinatayo ... sa harap ng
  rationale: Pinananatili nito ang literal na larawang sanhi ng ἵστημι at ang diwa ng paglalagay sa presensiya ng mga apostol, habang likas pa rin sa Tagalog. Posible rin sa konteksto ang diwang “iniharap.”
- source_word: τῶν ἀποστόλων
  choice: mga apostol
  rationale: Ito ang nakasanayang katawagan sa kinikilalang pangkat ng mga apostol sa Mga Gawa at hindi kailangang palitan ng mas pangkalahatang “mga sugo.”
- source_word: προσευξάμενοι
  choice: pagkatapos nilang manalangin
  rationale: Ipinapakita ng aorist participle na nauna ang pananalangin sa pagpapatong ng mga kamay. Pinananatili ng “nilang” ang di-tahasang pangmaramihang simuno ng Griyego.
- source_word: ἐπέθηκαν αὐτοῖς τὰς χεῖρας
  choice: ipinatong nila sa mga ito ang kanilang mga kamay
  rationale: Tuwirang inilalarawan ang kilos nang hindi ito binibigyang-kahulugan bilang isang tiyak na seremonyang pansimbahan. Likas sa Tagalog ang paggamit ng “kanilang” para sa mga bahagi ng katawan.
theological_decisions:
- issue: Kahulugan ng pagpapatong ng mga kamay
  choice: Inilarawan lamang bilang “ipinatong nila sa mga ito ang kanilang mga kamay.”
  alternative: “inordinahan nila ang mga ito” o “itinalaga nila ang mga ito”
  rationale: Binabanggit ng Griyego ang pisikal at rituwal na kilos ngunit hindi nito tahasang tinutukoy rito kung ito ay ordinasyon, pagtatalaga, pagpapala, o pagkakaloob ng kapangyarihan. Pinananatili ng salin ang teolohikal na pagiging bukás ng pahayag.
- issue: Pagkakakilanlan ng gumagawa ng mga kilos
  choice: Pinanatili ang pangmaramihang “nila” nang hindi tahasang pinapangalanan ang simuno.
  alternative: Tahasan itong iugnay sa mga apostol o sa buong kapulungan.
  rationale: Iisang di-tahasang pangmaramihang simuno ang dinadala ng mga pandiwa sa Griyego, ngunit hindi ito muling pinangalanan sa talata. Ang pagdaragdag ng isang tiyak na pangkat ay higit sa tahasang sinasabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinatayo ... sa harap” upang manatiling malapit sa anyo ng Griyego, at ibinigay sa talababa ang mas idiomatikong “iniharap.” Ang “mga ito” ay natural na tumutukoy sa pitong lalaking naunang pinangalanan nang hindi nagdaragdag sa mismong talata.
