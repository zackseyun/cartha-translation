id: ACT.6.2
reference: Acts 6:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: προσκαλεσάμενοι δὲ οἱ δώδεκα τὸ πλῆθος τῶν μαθητῶν εἶπαν· Οὐκ ἀρεστόν ἐστιν ἡμᾶς καταλείψαντας τὸν λόγον τοῦ θεοῦ διακονεῖν τραπέζαις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/002.yaml
  text: So the Twelve called together the whole group of the disciples and said[c][b][a], “It is not right for us to abandon the word of God to serve tables.”
translation:
  language: tl
  text: Kaya tinipon ng Labindalawa ang buong pangkat ng mga alagad[a] at sinabi, “Hindi nararapat na pabayaan namin ang salita ng Diyos upang maglingkod sa mga hapag[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang karamihan ng mga alagad” o “ang buong bilang ng mga alagad.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, asikasuhin ang praktikal na pamamahagi na kaugnay ng mga pagkain at mga yaman ng pamayanan.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: tinipon
  rationale: Likas na modernong Tagalog para sa pagtawag sa isang pangkat upang magtipon; pinananatili ang diwa ng pagbuo ng kapulungan.
- source_word: δὲ
  choice: Kaya
  rationale: Nagsasaad dito ng pagpapatuloy at bunga ng naunang suliranin, hindi ng matinding pagsalungat.
- source_word: οἱ δώδεκα
  choice: ang Labindalawa
  rationale: Pinananatili ang tiyak at nakaugaliang katawagan sa pangkat nang hindi idinaragdag ang salitang 'apostol,' na wala sa Griyego.
- source_word: τὸ πλῆθος τῶν μαθητῶν
  choice: ang buong pangkat ng mga alagad
  rationale: Ipinahahayag ang kolektibong saklaw ng πλῆθος sa malinaw at kasalukuyang Tagalog, habang kinikilala sa talababa ang posibleng diin sa karamihan o kabuuang bilang.
- source_word: Οὐκ ἀρεστόν ἐστιν
  choice: Hindi nararapat
  rationale: Natural na ipinahahayag ang paghatol tungkol sa pagiging angkop o wasto, nang hindi ipinahihiwatig na mababa ang praktikal na paglilingkod.
- source_word: ἡμᾶς καταλείψαντας
  choice: na pabayaan namin
  rationale: Ang 'pabayaan' ay naghahatid ng diwa ng pag-iwan o pagpapabaya sa pangunahing tungkulin, ngunit hindi kasing-tindi ng 'talikuran,' na maaaring magpahiwatig ng lubusang pagtakwil.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Karaniwan at malinaw na salin na pinananatili ang teolohikal na bigat ng λόγος at ang posibleng pagtukoy sa mensaheng ipinangangaral.
- source_word: διακονεῖν
  choice: maglingkod
  rationale: Tuwirang katumbas na hindi nag-aangkat ng kalaunang teknikal o eklesiastikong kahulugan.
- source_word: τραπέζαις
  choice: sa mga hapag
  rationale: Pinananatili ang konkretong larawan ng Griyego. Ang kaugnayan nito sa pamamahagi ng pagkain at mga yaman ng pamayanan ay ipinaliliwanag sa talababa sa halip na isingit sa teksto.
theological_decisions:
- issue: Ugnayan ng pangunahing tungkulin ng Labindalawa at ng praktikal na paglilingkod
  choice: 'Inilahad ito bilang usapin ng nararapat na pagtutuon sa kanilang tungkulin: ''Hindi nararapat na pabayaan namin ang salita ng Diyos upang maglingkod sa mga hapag.'''
  alternative: “Hindi kalugod-lugod para sa amin…” o “Hindi katanggap-tanggap na…”
  rationale: Ang pangungusap ay naghihiwalay ng mga pananagutan, hindi nagpapababa sa dangal ng paglilingkod sa mga hapag. Pinananatili rin ng salin ang tensiyon sa pagitan ng dalawang mahalagang gawain nang hindi ito nilulutas sa pamamagitan ng paliwanag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang 'Labindalawa' bilang nakaugaliang pantanging katawagan, 'alagad' para sa μαθητής, at 'mga hapag' upang mapanatili ang larawan at bahagyang kalabuan ng orihinal.
