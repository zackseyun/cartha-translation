  source_fidelity: 'Tumpak ang salin sa pangunahing mga yunit ng Griyego: ang Labindalawa ay nagtipon/nagpatawag sa buong pangkat ng mga alagad at nagsalita; ang pahayag ay tungkol sa hindi pagiging nararapat ng pagpapabaya sa salita ng Diyos upang maglingkod sa mga hapag. Ang “Kaya” ay katanggap-tanggap na pagmamarka ng δέ bilang pagpapatuloy ng salaysay.'
  naturalness: Malinaw, likas, at marangal ang modernong Filipino Tagalog. Ang “Hindi nararapat na pabayaan namin … upang maglingkod sa mga hapag” ay maayos na idiomatikong pagbubuo at pinananatili ang praktikal na tensiyon ng pangungusap.
  terminology: Ang “Labindalawa,” “mga alagad,” “salita ng Diyos,” at “mga hapag” ay angkop at pare-pareho sa rehistro. Hindi idinagdag ang “mga apostol,” kaya nananatiling tapat sa hindi tahasang pagbanggit nito sa Griyego. Ang talababa sa “mga hapag” ay nagbibigay-linaw nang hindi inaalis sa teksto ang kongkretong larawan o ang bahagyang kalabuan ng τραπέζαις.
