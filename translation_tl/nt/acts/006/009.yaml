  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀνέστησαν δέ τινες τῶν ἐκ τῆς συναγωγῆς τῆς λεγομένης Λιβερτίνων καὶ Κυρηναίων καὶ Ἀλεξανδρέων καὶ τῶν ἀπὸ Κιλικίας καὶ Ἀσίας συζητοῦντες τῷ Στεφάνῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/009.yaml
  text: But some of those from the synagogue called the Synagogue of the Freedmen[a], and of the Cyrenians and Alexandrians, and of those from Cilicia and Asia[b], stood up and began arguing with Stephen.
translation:
  language: tl
  text: Ngunit tumindig ang ilan sa mga kabilang sa sinagoga na tinatawag na sinagoga ng mga Taong Pinalaya[a], mga taga-Cirene, mga taga-Alexandria, at mga mula sa Cilicia at Asia[b], at nakipagtalo sila kay Esteban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Libertino.” Ang salitang Griyego ay tumutukoy sa mga taong pinalaya mula sa pagkaalipin, at malamang na kabilang din dito ang kanilang mga inapo.
    reason: lexical_alternative
  - marker: b
    text: Ang “Asia” rito ay ang lalawigang Romano sa kanlurang Asia Minor, hindi ang buong kontinenteng tinatawag ngayong Asia.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστησαν
  choice: tumindig
  rationale: Pinananatili ang konkretong larawan ng pagtayo at ang pahiwatig ng pagharap bilang pagsalungat.
- source_word: δέ
  choice: Ngunit
  rationale: Ipinakikita ang banayad na pagkontra at ang paglipat ng salaysay mula sa gawain ni Esteban tungo sa pagsalungat sa kaniya.
- source_word: τινες τῶν ἐκ τῆς συναγωγῆς
  choice: ang ilan sa mga kabilang sa sinagoga
  rationale: 'Malinaw na ipinahahayag ang partitive na diwa: isang di-tiyak na pangkat mula sa mga kaugnay ng sinagoga.'
- source_word: συναγωγῆς
  choice: sinagoga
  rationale: Karaniwan at tumpak na katawagan sa pagtitipon o gusaling sambahan ng mga Judio.
- source_word: τῆς λεγομένης
  choice: tinatawag na
  rationale: Likas na ipinakikilala ang kinikilalang pangalan ng sinagoga nang walang mapanghamak na pahiwatig.
- source_word: Λιβερτίνων
  choice: mga Pinalaya
  rationale: Tumutukoy ito sa mga taong pinalaya mula sa pagkaalipin, o malamang sa kanilang mga inapo; iniiwasan ang maling makabagong kahulugan ng transliterasyong “Libertino.”
- source_word: Κυρηναίων καὶ Ἀλεξανδρέων
  choice: mga taga-Cirene at taga-Alexandria
  rationale: Natural sa modernong Tagalog ang anyong “taga-” para sa mga taong nagmula sa mga lungsod na ito.
- source_word: τῶν ἀπὸ Κιλικίας καὶ Ἀσίας
  choice: mga mula sa Cilicia at Asia
  rationale: Tahasang ipinakikita ang pinagmulang lugar at pinananatili ang makasaysayang pangalang Asia, na nililinaw sa talababa.
- source_word: συζητοῦντες
  choice: nakipagtalo sila
  rationale: Sa konteksto, ang pandiwa ay tumutukoy sa salungatang berbal, hindi sa neutral na talakayan. Ang tahasang sugnay ay natural sa Tagalog.
- source_word: τῷ Στεφάνῳ
  choice: kay Esteban
  rationale: Ang datibong katuwang ng συζητέω ay likas na isinasalin sa Tagalog sa pamamagitan ng “kay.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tumindig” upang mapanatili ang konkretong kilos at salungatang himig; ginawang tahasang sugnay ang huling participle para sa natural na daloy. Ang mga gitling na em dash ay naglilinaw sa mahaba at posibleng malabong talaan ng mga pangkat nang hindi ipinipilit kung iisa o higit sa isang sinagoga ang tinutukoy ng konstruksiyong Griyego.
