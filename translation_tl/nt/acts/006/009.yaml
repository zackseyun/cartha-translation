revisions:
- from: Ngunit tumindig ang ilan sa mga kabilang sa sinagogang tinatawag na Sinagoga ng mga Pinalaya[a]—mga taga-Cirene at taga-Alexandria, at mga mula sa Cilicia at Asia[b]—at nakipagtalo sila kay Esteban.
  to: Ngunit tumindig ang ilan sa mga kabilang sa sinagoga na tinatawag na sinagoga ng mga Taong Pinalaya[a], mga taga-Cirene, mga taga-Alexandria, at mga mula sa Cilicia at Asia[b], at nakipagtalo sila kay Esteban.
