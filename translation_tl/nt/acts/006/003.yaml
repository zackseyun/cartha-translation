base_translation:
  language: en
  yaml_path: translation/nt/acts/006/003.yaml
  text: But brothers[a], select from among yourselves seven men who are well attested, full of the Spirit and wisdom[d][c][b], whom we will appoint over this duty.
translation:
  language: tl
  text: Ngunit, mga kapatid,[a] pumili kayo mula sa inyong hanay ng pitong lalaking may mabuting reputasyon,[b] na puspos ng Espiritu[c] at karunungan. Sila ang itatalaga naming mamahala sa gawaing ito.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa anyong panlalaki, ngunit maaaring saklaw ng tawag ang mas malawak na kapulungan ng mga mananampalataya.
    reason: cultural_note
  - marker: b
    text: 'Sa mas literal na diwa: “mga lalaking may mabuting patotoo” o “mabuti ang patotoo ng iba tungkol sa kanila.”'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “Banal na Espiritu.” Sa Griyego, “Espiritu” lamang ang tahasang nakasaad.
    reason: alternative_reading
  - marker: d
    text: Ang “gawaing ito” ay tumutukoy sa praktikal na pananagutan kaugnay ng araw-araw na pamamahagi na binanggit sa konteksto.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκέψασθε
  choice: pumili kayo
  rationale: Sa konteksto, inuutusan ang kapulungan na humanap at pumili ng mga angkop na lalaki. Likas at malinaw sa makabagong Tagalog ang “pumili kayo,” at naipahihiwatig ng kasunod na “mula sa inyong hanay” na sila mismo ang kikilatis sa mga pipiliin.
- source_word: δέ
  choice: Kaya
  rationale: Bagaman maaaring pananda lamang ng paglipat ang δέ, inuugnay nito rito ang iminungkahing hakbang sa suliraning binanggit sa naunang mga talata. Mas natural sa Tagalog ang “Kaya” at naipapakita nito ang daloy ng pangangatwiran nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Karaniwang tawag ito sa kapuwa mananampalataya. Hindi likas na nilalagyan ng kasarian ang “mga kapatid” sa Tagalog; ipinaliliwanag sa talababa na panlalaki ang anyong Griyego ngunit maaaring saklaw ng pahayag ang buong kapulungan.
- source_word: ἄνδρας ἐξ ὑμῶν
  choice: mula sa inyong hanay ng pitong lalaki
  rationale: Tiyak na tumutukoy ang ἄνδρας sa mga lalaki, samantalang ipinakikita ng ἐξ ὑμῶν na pipiliin sila mula mismo sa komunidad.
- source_word: μαρτυρουμένους
  choice: may mabuting reputasyon
  rationale: Ipinahihiwatig ng participle na mabuti ang patotoo ng ibang tao tungkol sa kanila. Ang “may mabuting reputasyon” ay malinaw at natural sa kasalukuyang Tagalog; ang mas literal na diwa ay inilalahad sa talababa.
- source_word: πλήρεις πνεύματος καὶ σοφίας
  choice: puspos ng Espiritu at karunungan
  rationale: Pinananatili ng “puspos” ang larawan ng ganap na pagkapuno, at ng “Espiritu” ang anyo ng Griyego na walang tahasang salitang “banal.” Ang malaking titik ay nagpapahiwatig ng malamang na pagtukoy sa Espiritu ng Diyos ayon sa gamit sa Lucas–Mga Gawa.
- source_word: καταστήσομεν ἐπὶ τῆς χρείας ταύτης
  choice: itatalaga naming mamahala sa gawaing ito
  rationale: Ipinahihiwatig ng καταστήσομεν ang pormal na pagtatalaga, at ng ἐπί ang ipinagkatiwalang pangangasiwa. Sa konteksto, ang χρεία ay isang praktikal na gawain o pananagutan, hindi lamang isang abstraktong pangangailangan.
theological_decisions:
- issue: Kung ang πνεύματος ay tumutukoy sa espiritu sa pangkalahatan o sa Espiritu ng Diyos
  choice: Espiritu
  alternative: Banal na Espiritu; espiritu
  rationale: Sa Lucas–Mga Gawa, ang ganitong pagkapuspos bilang kwalipikasyon sa paglilingkod ay malamang na tumutukoy sa Espiritu ng Diyos. Gayunman, walang ἁγίου (“banal”) sa tekstong Griyego, kaya “Espiritu” ang nasa pangunahing teksto at hindi tahasang idinagdag ang “Banal.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mula sa inyong hanay” at “itatalaga naming mamahala” upang maging natural ang pangungusap habang napapanatili ang pagpili ng komunidad at ang pormal na pagtatalaga ng mga apostol. Hinati sa dalawang pangungusap ang mahabang sugnay na Griyego para sa mas malinaw na pagbasa nang hindi binabago ang ugnayan ng mga ideya.
