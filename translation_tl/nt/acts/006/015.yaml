  text: καὶ ἀτενίσαντες εἰς αὐτὸν ⸀πάντες οἱ καθεζόμενοι ἐν τῷ συνεδρίῳ εἶδον τὸ πρόσωπον αὐτοῦ ὡσεὶ πρόσωπον ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/015.yaml
  text: And all who were sitting in the council[a], fixing their eyes on him, saw his face like the face of an angel.
translation:
  language: tl
  text: At tinitigan siya ng lahat ng nakaupo sa kapulungan[a], at nakita nila ang mukha niya na tulad ng mukha ng isang anghel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sanhedrin.” Ang salitang Griyego ay tumutukoy sa konsehong namamahala.
    reason: cultural_note
lexical_decisions:
- source_word: ἀτενίσαντες
  choice: itinuon sa kanya … ang kanilang paningin
  rationale: Ipinahahayag nito ang matindi at patuloy na pagtitig, hindi isang saglit na pagtingin, habang nananatiling natural sa makabagong Tagalog.
- source_word: πάντες οἱ καθεζόμενοι
  choice: lahat ng nakaupo
  rationale: Pinananatili nito kapwa ang kabuuang saklaw ng πάντες at ang paglalarawan sa mga taong nakaupo.
- source_word: συνεδρίῳ
  choice: kapulungan
  rationale: Direktang tumutukoy ito sa konsehong namamahala sa kontekstong ito nang hindi ginagawang pantanging pangalan ang salita sa pangunahing teksto.
- source_word: πρόσωπον
  choice: mukha
  rationale: Ito ang malinaw at likas na katumbas sa Tagalog para sa nakikitang mukha ni Esteban.
- source_word: ὡσεὶ
  choice: tulad ng
  rationale: Pinananatili nito ang paghahambing o pagkakahawig nang hindi ipinapaliwanag kung anong katangian ang magkatulad.
- source_word: ἀγγέλου
  choice: isang anghel
  rationale: Sa konteksto, ang kahulugan ay ang makalangit na nilalang, hindi lamang isang taong mensahero.
theological_decisions:
- issue: Kalikasan ng paghahambing sa “tulad ng mukha ng isang anghel”
  choice: Isang pagtutulad na nagsasabing kahawig ng mukha ng isang anghel ang mukha ni Esteban, nang hindi tinutukoy ang eksaktong katangian ng pagkakahawig.
  alternative: Tiyak na pagtukoy sa maningning na kaluwalhatian, payapang kawalang-sala, o makalangit na awtoridad.
  rationale: Hindi nililinaw ng Griyego kung ningning, kapanatagan, dignidad, o iba pang katangian ang tinutukoy; kaya pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “kapulungan” sa pangunahing teksto at inilagay ang “Sanhedrin” sa talababa bilang paliwanag sa konteksto.
