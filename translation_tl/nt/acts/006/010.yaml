revisions:
- from: At hindi nila kayang mapantayan ang karunungan at ang Espiritung sa pamamagitan niya ay nagsasalita siya.[a]
  to: At hindi nila kayang salungatin ang karunungan at ang Espiritung nagbibigay-kakayahan kay Esteban habang nagsasalita siya.[a]
  rationale: Pinalitan ang «mapantayan» ng «salungatin» upang maihatid ang diwa ng ἀντιστῆναι sa konteksto ng pagtatalo. Inayos ang hindi likas na panghalipang konstruksyon at ginawang tahasan si Esteban. Ang «habang nagsasalita siya» ay nagpapakita ng di-ganap o nagpapatuloy na aspekto ng ἐλάλει. Ang Espiritu ay nananatiling piniling pagbasa batay sa konteksto, ngunit ang alternatibong pagbasa bilang sariling espiritu ni Esteban ay malinaw na pinananatili sa talababa.
