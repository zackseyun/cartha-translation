    rationale: Ang «taglay niya habang nagsasalita siya» ay maaaring magmukhang dagdag na paglalarawan. Mas tapat na ilarawan ang espiritu bilang kaugnay o nagbibigay-kakayahan sa pagsasalita ni Esteban.
