  source_fidelity: 'Kailangang baguhin ang «mapantayan»: ang ἀντιστῆναι ay tumutukoy sa pagsalungat, paglaban, o pagkontra, hindi sa pagpantay. Ang kasalukuyang sugnay na «sa pamamagitan niya ay nagsasalita siya» ay hindi rin malinaw o likas na Tagalog at may hindi tiyak na mga panghalip. Ang rebisyon ay naghahatid ng kawalan nila ng kakayahang salungatin ang karunungan at ang Espiritung nagbibigay-kakayahan kay Esteban sa patuloy niyang pagsasalita. Pinananatili ng talababa ang makatuwirang alternatibong pagbasa ng πνεύματι.'
  naturalness: Hindi likas at malabo ang «ang Espiritung sa pamamagitan niya ay nagsasalita siya.» Sa rebisyon, malinaw ang ugnayan ng Espiritu kay Esteban at marangal ngunit makabagong Filipino ang daloy.
  terminology: Ang «karunungan» at «Espiritu» ay angkop. Ang malaking titik sa «Espiritu» ay tumutugma sa piniling kontekstuwal na pagbasa, samantalang ang maliit na titik sa talababa ay maayos na nagpapanatili ng alternatibo nang hindi ito ipinipilit.
