  yaml_path: translation/nt/acts/006/010.yaml
  text: And they were not able to withstand the wisdom and the Spirit by which he was speaking[a].
translation:
  language: tl
  text: At hindi nila kayang salungatin ang karunungan at ang Espiritung nagbibigay-kakayahan kay Esteban habang nagsasalita siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang espiritung nagbibigay-kakayahan kay Esteban habang nagsasalita siya,” kung ang πνεύματι ay tumutukoy sa sariling espiritu ni Esteban sa halip na sa Banal na Espiritu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσχυον
  choice: hindi nila kayang
  rationale: Ipinahahayag ng imperpektong anyo ang patuloy nilang kawalan ng kakayahan; natural ito sa makabagong Tagalog.
- source_word: ἀντιστῆναι
  choice: mapantayan
  rationale: Sa konteksto ng pagtatalo, ipinahihiwatig nito na hindi nila kayang humarap nang matagumpay o makasagot sa karunungan at Espiritu sa pagsasalita ni Esteban.
- source_word: τῇ σοφίᾳ
  choice: ang karunungan
  rationale: Pinananatili ang tiyak na karunungang nahahayag sa pagsasalita ni Esteban.
- source_word: τῷ πνεύματι
  choice: ang Espiritu
  rationale: Pinakamalamang na tumutukoy sa Banal na Espiritu batay sa agarang konteksto ng Mga Gawa 6:5 at sa pagtatambal ng karunungan at Espiritu; ipinakikita ito ng malaking titik.
- source_word: ᾧ ἐλάλει
  choice: sa pamamagitan niya ay nagsasalita siya
  rationale: Ipinapahayag ang Espiritu bilang tagapagbigay-kakayahan sa patuloy na pagsasalita ni Esteban, habang ang “niya” ay angkop sa personal na pagkaunawa sa Espiritu.
theological_decisions:
- issue: Kung ang πνεύματι ay tumutukoy sa Banal na Espiritu o sa sariling espiritu ni Esteban
  choice: Espiritu
  alternative: espiritu
  rationale: Malakas na itinuturo ng konteksto sa Banal na Espiritu, ngunit hindi ito ganap na ipinipilit ng anyong leksikal kaya pinananatili sa talababa ang ibang posibilidad.
translation_notes:
  register: Makabago at marangal na Filipino; pinanatili ang progresibong diwa ng ἐλάλει at ang tunay na kalabuan ng πνεύματι sa talababa.
