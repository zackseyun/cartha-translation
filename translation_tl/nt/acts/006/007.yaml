base_translation:
  language: en
  yaml_path: translation/nt/acts/006/007.yaml
  text: And the word of God kept increasing[a], and the number of the disciples in Jerusalem kept multiplying greatly, and a large crowd of the priests were becoming obedient to the faith.
translation:
  language: tl
  text: Patuloy na lumaganap ang salita ng Diyos, at ang bilang ng mga alagad sa Jerusalem ay patuloy na dumami nang lubha; at napakaraming pari ang patuloy na tumatalima sa pananampalataya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sumusunod sa pananampalataya” o “nagiging masunurin sa pananampalataya.” Ang pariralang Griyego ay maaaring tumukoy sa pagtalima sa mensaheng Kristiyano, hindi lamang sa panloob na paniniwala o pagtitiwala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Pinananatili nito ang karaniwang biblikal na pananalita at hindi nililimitahan ang λόγος sa isang mas tiyak na kahulugang gaya ng “mensahe” o “pangangaral,” bagaman ang ipinahahayag na mensahe ng Diyos ang tinutukoy sa konteksto.
- source_word: ηὔξανεν
  choice: patuloy na lumaganap
  rationale: Ipinahihiwatig ng imperfect ang nagpapatuloy na paglago. Mas natural sa Filipino ang “lumaganap” kapag salita o mensahe ang paksa kaysa sa literal na “lumaki.”
- source_word: ἐπληθύνετο
  choice: patuloy na dumami
  rationale: Ipinakikita ng imperfect ang nagpapatuloy na pagdami at pinananatiling naiiba ang pandiwang ito sa ηὔξανεν.
- source_word: ὁ ἀριθμὸς τῶν μαθητῶν
  choice: ang mga alagad
  rationale: Natural sa Filipino na sabihin mismong dumami ang mga alagad; malinaw pa rin ang diwa ng pagdami ng kanilang bilang, at pinananatili ang mahalagang terminong “alagad” para sa μαθηταί.
- source_word: ἐν Ἰερουσαλὴμ
  choice: sa Jerusalem
  rationale: Tuwirang lokatibong salin.
- source_word: σφόδρα
  choice: nang husto
  rationale: Natural na pagpapahayag ng matinding antas ng pagdami nang hindi gumagamit ng makalumang pananalita.
- source_word: πολύς τε ὄχλος
  choice: napakarami rin
  rationale: Sa kontekstong tumutukoy sa mga pari bilang malaking pangkat, mas natural ang “napakarami” kaysa “isang malaking pulutong.” Isinasalin ng “rin” ang nagpapatuloy at nagdaragdag na gamit ng τε.
- source_word: τῶν ἱερέων
  choice: pari
  rationale: Tuwirang tumutukoy sa mga paring Judio na naglilingkod kaugnay ng templo.
- source_word: ὑπήκουον
  choice: tumatalima
  rationale: Ang “tumatalima” ay nagpapahayag ng pagsunod o pagpapasakop, at ang aspektong nagaganap ay angkop sa imperfect na anyo ng Griyego.
- source_word: τῇ πίστει
  choice: sa pananampalataya
  rationale: Pinananatili nito ang sadyang kaluwagan ng πίστις. Sa pariralang ito, maaari itong tumukoy sa pananampalataya bilang mensaheng pinaniniwalaan, hindi lamang sa panloob na pagtitiwala.
theological_decisions:
- issue: Kahulugan ng πίστις sa pariralang τῇ πίστει
  choice: sa pananampalataya
  alternative: sa mensahe ng pananampalataya; sa pananampalatayang Kristiyano
  rationale: Ang artikulo at ang pariralang “tumatalima sa pananampalataya” ay maaaring magpahiwatig ng obhetibong diwa—ang pinaniniwalaang mensahe o kapahayagan—ngunit hindi ito dapat gawing mas tiyak kaysa sa Griyego. Kaya pinanatili sa pangunahing teksto ang “pananampalataya” at ipinaliwanag ang saklaw nito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patuloy” upang katawanin ang nagpapatuloy na kilos ng mga imperfect na pandiwa, habang iniwasan ang sobrang literal ngunit di-natural na mga parirala.
