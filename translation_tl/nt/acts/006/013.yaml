  source_fidelity: 'Tapat ang salin sa Griyego: naipahayag ang pandagdag na kilos ("din"), ang legal na pagpapaharap ng mga bulaang saksi, ang patuloy na paratang ("walang tigil"), at ang pagsasalita laban sa banal na lugar at sa Kautusan. Hindi nito pinalalakas ang paratang nang lampas sa teksto.'
