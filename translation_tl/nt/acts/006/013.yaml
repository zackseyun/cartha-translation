id: ACT.6.13
reference: Acts 6:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔστησάν τε μάρτυρας ψευδεῖς λέγοντας· Ὁ ἄνθρωπος οὗτος οὐ παύεται ⸂λαλῶν ῥήματα⸃ κατὰ τοῦ τόπου τοῦ ⸀ἁγίου καὶ τοῦ νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/013.yaml
  text: They also set up false witnesses who said[c][b][a], “This man does not stop speaking against this holy place and the law,”
translation:
  language: tl
  text: Nagharap din sila ng mga bulaang saksi na nagsabi, “Ang taong ito ay walang tigil sa pagsasalita laban sa banal na lugar na ito[a] at sa Kautusan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “banal na lugar” ay tumutukoy rito sa templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησάν
  choice: Nagharap
  rationale: Sa kontekstong legal, tumutukoy ito sa pagpapaharap o paglalagay ng mga saksi upang tumestigo. Likas sa modernong Tagalog ang “nagharap” at hindi nito dinaragdagan ang pahiwatig ng sabwatan.
- source_word: τε
  choice: din
  rationale: Ipinakikita nito ang pandagdag na kilos sa daloy ng salaysay.
- source_word: μάρτυρας ψευδεῖς
  choice: mga bulaang saksi
  rationale: Karaniwang pahayag ito sa Tagalog para sa mga saksing nagbibigay ng huwad na patotoo at pinananatili ang legal na diwa.
- source_word: λέγοντας
  choice: na nagsabi
  rationale: Natural na isinasalin ang participle bilang sugnay na naglalahad ng sinabi ng mga saksi.
- source_word: Ὁ ἄνθρωπος οὗτος
  choice: Ang taong ito
  rationale: Tuwiran at may bahagyang mapanghamak na himig ayon sa konteksto, nang hindi nagiging labis na kolokyal.
- source_word: οὐ παύεται
  choice: walang tigil
  rationale: Malinaw nitong ipinahahayag ang patuloy na pagkilos na nasa pandiwang Griyego.
- source_word: λαλῶν ῥήματα
  choice: sa pagsasalita
  rationale: Ang tambalang Griyego ay idiomatikong nangangahulugang pagsasalita o pagsasabi ng mga bagay. Ang tahasang “mga salita” ay magiging mabigat at di-likas sa Tagalog nang walang dagdag na kahulugan.
- source_word: κατὰ
  choice: laban sa
  rationale: Sa mapanlabang paratang na ito, malinaw na nagsasaad ang κατά na ang pananalita ay nakatuon laban sa banal na lugar at sa Kautusan.
- source_word: τοῦ τόπου τοῦ ἁγίου
  choice: banal na lugar na ito
  rationale: Bagaman walang tahasang demonstrative sa Griyego, ang tinutukoy ay ang banal na lugar na naroon at kilala sa konteksto—ang templo. Natural sa paratang sa Tagalog ang “na ito.”
- source_word: τοῦ νόμου
  choice: sa Kautusan
  rationale: Tumutukoy ito sa Kautusan ni Moises sa kontekstong Judio. Ginamit ang malaking titik upang malinaw na makilala ang tiyak na katawagan sa Kautusan.
theological_decisions:
- issue: Tinutukoy ng “banal na lugar” at “Kautusan”
  choice: Ang paratang ay tungkol sa templo sa Jerusalem at sa Kautusan ni Moises, ngunit hindi ito pinalawak sa pangunahing teksto.
  alternative: Unawain bilang pangkalahatang banal na pook at tradisyong legal.
  rationale: Nililinaw ng agarang konteksto ng Mga Gawa ang mga referent, ngunit nararapat panatilihin sa salin ang mismong antas ng pagtukoy ng mga nagbibintang.
- issue: Tindi ng paratang
  choice: Pinanatili ang “pagsasalita laban” bilang mapanlabang legal na paratang.
  alternative: Isalin bilang “paglapastangan” o “paninirang-puri.”
  rationale: Hindi tahasang ginagamit ng Griyego sa talatang ito ang mas matitinding terminong iyon; hindi dapat patindihin ang sinabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural sa salaysay. Pinanatili ang himig ng isang pormal at mapanlabang paratang, ngunit iniwasan ang lipas o labis na legalistikong pananalita.
