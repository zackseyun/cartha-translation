  yaml_path: translation/nt/acts/006/011.yaml
  text: Then they secretly induced men to say[a], “We have heard him speaking blasphemous words against Moses and God.”
translation:
  language: tl
  text: Noon, palihim nilang sinulsulan ang mga lalaki na sabihin[a], “Narinig namin siyang nagsasalita ng mga salitang lapastangan laban kay Moises at sa Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “palihim nilang inudyukan ang mga lalaki.” Ipinahihiwatig ng pandiwang Griego ang palihim at di-tapat na pag-uudyok.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Kaya
  rationale: Ipinagpapatuloy nito ang salaysay at iniuugnay ang hakbang na ito sa naunang kabiguang madaig si Esteban sa pakikipagtalo; natural sa Filipino ang ‘Kaya’ sa kontekstong ito.
- source_word: ὑπέβαλον
  choice: lihim nilang sinulsulan
  rationale: Ipinahihiwatig ng pandiwa ang palihim at di-tapat na pag-uudyok sa iba na magsabi ng paratang.
- source_word: ἄνδρας
  choice: ang ilang lalaki
  rationale: Tiyak na mga lalaking tao ang tinutukoy ng ἀνήρ; idinagdag ang ‘ilang’ bilang natural na di-tiyak na pagpapahayag sa Filipino.
- source_word: λέγοντας
  choice: na sabihin
  rationale: Natural na ipinapahayag sa Filipino ang participle bilang layunin o nilalaman ng panunulsol.
- source_word: Ἀκηκόαμεν
  choice: Narinig namin
  rationale: Ang perpektong anyo ay nagsasaad ng naganap na pagdinig na pinanghahawakan nilang batayan ng kasalukuyang paratang; natural itong naihahayag sa Filipino sa simpleng aspektong naganap.
- source_word: αὐτοῦ λαλοῦντος
  choice: siyang nagsasalita
  rationale: Pinananatili ang patuloy na kilos ng λαλοῦντος at ang tuwirang diwa na sila raw mismo ang nakarinig sa kaniya.
- source_word: ῥήματα βλάσφημα
  choice: mga salitang lapastangan
  rationale: Pinananatili nito ang tahasang paratang na relihiyoso at mapanirang pananalita nang hindi ipinahihiwatig na totoo ang paratang.
- source_word: εἰς Μωϋσῆν καὶ τὸν θεόν
  choice: laban kay Moises at sa Diyos
  rationale: Sa konteksto ng paratang, ang εἰς ay nagsasaad ng pinatutungkulan ng paglapastangan; malinaw at natural ang ‘laban kay ... at sa ...’.
theological_decisions:
- issue: Katangian ng paratang laban kay Esteban
  choice: Iniulat bilang ‘mga salitang lapastangan laban kay Moises at sa Diyos.’
  alternative: ‘mapanirang mga salita tungkol kay Moises at sa Diyos’
  rationale: Ang ‘lapastangan’ ay nagpapanatili sa legal at relihiyosong bigat ng βλάσφημα. Dahil ipinakikita ng konteksto na ang mga lalaki ay lihim na sinulsulan, iniulat ang paratang nang hindi ito pinagtitibay bilang totoo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang ‘sinulsulan’ upang ihatid ang lihim at masamang pag-uudyok, at ‘lapastangan’ upang mapanatili ang bigat ng paratang nang hindi ito ineendorso.
