id: ACT.14.6
reference: Acts 14:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: συνιδόντες κατέφυγον εἰς τὰς πόλεις τῆς Λυκαονίας Λύστραν καὶ Δέρβην καὶ τὴν περίχωρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/006.yaml
  text: when they learned of it[a], they fled to the cities of Lycaonia—Lystra and Derbe—and the surrounding region,
translation:
  language: tl
  text: Nang malaman nila ito[a], tumakas sila patungo sa mga lungsod ng Licaonia—Listra at Derbe—at sa karatig na lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nang maunawaan nila ito” o “Nang mabatid nila ito.” Ipinahihiwatig ng salitang Griyego na naunawaan nila ang panganib na inilarawan sa naunang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδόντες
  choice: Nang malaman nila ito
  rationale: Ipinahihiwatig ng aorist participle ang pagkaunawa o pagkabatid nila sa panganib na binanggit sa naunang talata. Likas sa Tagalog ang paglalagay ng “ito” bilang layon mula sa konteksto.
- source_word: κατέφυγον
  choice: tumakas sila
  rationale: Sa konteksto, binibigyang-diin ng pandiwa ang kanilang agarang paglayo dahil sa panganib; tuwiran at natural ang “tumakas.”
- source_word: εἰς
  choice: patungo sa
  rationale: Tinutukoy ng εἰς kasunod ng pandiwa ng pagkilos ang destinasyon. Malinaw na ipinapahayag ito ng “patungo sa.”
- source_word: τὰς πόλεις τῆς Λυκαονίας
  choice: mga lungsod ng Licaonia
  rationale: Pinananatili nito ang panrehiyong ugnayan ng genitive at inihahanda ang kasunod na pagtukoy sa mga lungsod na Listra at Derbe.
- source_word: Λύστραν καὶ Δέρβην
  choice: Listra at Derbe
  rationale: Ginamit ang karaniwang anyong Filipino ng mga pangalang pook at itinuring ang mga ito bilang paliwanag kung aling mga lungsod ang tinutukoy.
- source_word: τὴν περίχωρον
  choice: karatig na lupain
  rationale: Saklaw ng περίχωρος ang lugar sa palibot ng mga nabanggit na lungsod. Ang “karatig na lupain” ay natural, marangal, at hindi nililimitahan sa lungsod o kabukiran lamang.
- source_word: καὶ ... καὶ
  choice: —Listra at Derbe—at
  rationale: Ipinakikita ng mga gitling na ang Listra at Derbe ang mga lungsod na tinutukoy, samantalang pinananatili ng huling “at” ang pagdaragdag sa karatig na lupain.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “Licaonia” at “Listra” bilang mga anyong madaling bigkasin sa Filipino; pinanatili ang istruktura at bahagyang kalabuan ng Griyego nang hindi labis na ipinapaliwanag ang tinutukoy ng “ito.”
