base_translation:
  language: en
  yaml_path: translation/nt/acts/014/010.yaml
  text: He said in a loud voice[b][a], “Stand upright on your feet.” And he leaped up and began walking.
translation:
  language: tl
  text: Sinabi niya sa malakas na tinig, “Tumayo kang tuwid sa iyong mga paa.” At lumukso siya at nagsimulang maglakad.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lumukso siya at naglakad-lakad.” Maaaring idiin ng pandiwang imperpekto ang patuloy na paglakad o ang pagsisimula nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ φωνῇ
  choice: nang malakas
  rationale: Likas at malinaw na pagpapahayag sa modernong Tagalog ng paraan at lakas ng pagsasalita.
- source_word: Ἀνάστηθι
  choice: Tumayo ka
  rationale: Tuwirang utos na tumindig, na angkop sa kasunod na paglalarawan ng tuwid na pagtayo sa mga paa.
- source_word: ἐπὶ τοὺς πόδας σου
  choice: sa iyong mga paa
  rationale: Pinananatili ang konkretong pagtukoy sa mga paa at ang natural na ekspresyon sa Tagalog.
- source_word: ὀρθός
  choice: nang tuwid
  rationale: Inilalarawan ang tuwid na tindig na ipinag-uutos; natural itong gumaganap bilang pang-abay sa Tagalog.
- source_word: ἥλατο
  choice: lumukso ang lalaki
  rationale: Pinananatili ang biglaan at masiglang kilos na ipinahihiwatig ng ἅλλομαι. Nilinaw ng 'ang lalaki' ang simuno sa Tagalog nang walang dagdag na interpretasyon.
- source_word: περιεπάτει
  choice: nagsimulang maglakad
  rationale: Ang imperpektong anyo ay maaaring unawain bilang pasimula o nagpapatuloy na kilos; ang saling ito ay natural sa salaysay at ipinapakita ang pagsisimula ng paglakad pagkatapos ng paglukso.
theological_decisions:
- issue: Himala at utos tungkol sa tindig
  choice: Ihayag nang tuwiran ang utos at ang agarang pisikal na tugon.
  alternative: Dagdagan ng paliwanag tungkol sa kahulugan o pinagmulan ng pagpapagaling.
  rationale: Direktang isinasalaysay ng Griyego ang utos at ang nakikitang tugon; hindi dapat dagdagan ng doktrinal na pagpapaliwanag.
- issue: Aspekto ng περιεπάτει
  choice: nagsimulang maglakad
  alternative: naglalakad
  rationale: Maaaring ipahiwatig ng imperpekto ang pasimula o pagpapatuloy ng kilos. Pinili ang pasimulang diwa sa pangunahing teksto, habang pinananatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang lipas na pananalita at pinanatili ang maikli at masiglang daloy ng salaysay.
