  text: χειροτονήσαντες δὲ αὐτοῖς ⸂κατ’ ἐκκλησίαν πρεσβυτέρους⸃ προσευξάμενοι μετὰ νηστειῶν παρέθεντο αὐτοὺς τῷ κυρίῳ εἰς ὃν πεπιστεύκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/023.yaml
  text: And after appointing elders for them in every church[a], and praying with fasting, they entrusted them to the Lord[c][b], in whom they had believed.
translation:
  language: tl
  text: Matapos silang magtalaga para sa bawat iglesya ng mga matatanda[a] at manalangin nang may pag-aayuno, ipinagkatiwala nila sila[b] sa Panginoon na kanilang pinanaligan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maghalal para sa bawat iglesya ng mga matatanda.” Sa ilang konteksto, ang pandiwang Griyego ay maaaring tumukoy sa pagpili sa pamamagitan ng pagboto o pagtataas ng kamay, ngunit dito ay maaari lamang itong mangahulugang pagtatalaga.
    reason: alternative_reading
  - marker: b
    text: Ang “sila” ay maaaring tumukoy sa lahat ng mananampalataya sa mga iglesya o, nang mas tiyak, sa mga bagong talagang matatanda.
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονήσαντες
  choice: matapos silang magtalaga
  rationale: Ang pandiwa ay tumutukoy sa pagpili o pagtatalaga. Bagaman maaari itong maiugnay sa pagpili sa pamamagitan ng pagtataas ng kamay, hindi tinutukoy ng talata ang isang tiyak na paraan ng halalan.
- source_word: κατ’ ἐκκλησίαν
  choice: sa bawat iglesya
  rationale: 'Ang κατά na may pangngalang isahan ay distributibo: ginawa ang pagtatalaga sa bawat lokal na kapulungan.'
- source_word: πρεσβυτέρους
  choice: mga matatanda
  rationale: Sa kontekstong ito, tumutukoy ito sa kinikilalang mga tagapanguna ng iglesya, hindi lamang sa matatandang lalaki. Ang “mga matatanda” ay malinaw at hindi nakatali sa isang partikular na denominasyonal na titulo.
- source_word: προσευξάμενοι μετὰ νηστειῶν
  choice: at manalangin nang may pag-aayuno
  rationale: Pinananatili nito ang panalanging sinabayan ng pag-aayuno at ang kaugnayan nito sa naunang kilos ng pagtatalaga.
- source_word: παρέθεντο
  choice: ipinagkatiwala nila
  rationale: Ipinahihiwatig ng middle voice ang paghahabilin ng mga tao sa pangangalaga ng iba; natural at personal ang “ipinagkatiwala” sa modernong Tagalog.
- source_word: τῷ κυρίῳ
  choice: sa Panginoon
  rationale: Ang datibo ang tumutukoy sa pinagkatiwalaan at sa pangangalaga niya inihabilin ang mga tao.
- source_word: εἰς ὃν πεπιστεύκεισαν
  choice: Panginoong kanilang pinanaligan
  rationale: Likas sa Tagalog ang “pinanaligan” para sa pananampalataya o pagtitiwalang nakatuon sa isang persona. Ipinahihiwatig ng pluperfect na nauna at nagpapatuloy ang kanilang pananampalataya.
- source_word: αὐτοῖς ... αὐτοὺς
  choice: para sa kanila ... sila
  rationale: Pinananatili ang mga panghalip ng Griyego upang hindi tahimik na lutasin kung ang ikalawang panghalip ay tumutukoy sa buong kapulungan o sa mga bagong talagang matatanda.
theological_decisions:
- issue: Kahulugan ng χειροτονήσαντες kaugnay ng pamamahala sa iglesya
  choice: magtalaga ng mga matatanda
  alternative: maghalal ng mga matatanda, posibleng sa pamamagitan ng pagtataas ng kamay
  rationale: Pinahihintulutan ng kasaysayang leksikal ang kaugnayan sa pagboto, ngunit hindi malinaw na itinatakda ng konteksto ang mekanismo. Ang “magtalaga” ay nagpapanatili sa pangunahing kilos nang hindi nag-aangkat ng denominasyonal na kaayusan.
- issue: Tinutukoy ng αὐτοὺς sa ipinagkatiwala nila sila
  choice: panatilihin ang panghalip na “sila”
  alternative: tahasang tukuyin ang buong kapulungan o ang mga bagong talagang matatanda
  rationale: Mas malawak na konteksto ang nagpapahiwatig sa mga alagad o kapulungan, ngunit maaari ring unawain ang pinakamalapit na tinutukoy bilang ang mga matatanda. Pinananatili ng salin at talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “iglesya” para sa lokal na kapulungan at “mga matatanda” bilang di-denominasyonal na katawagan sa kinikilalang mga tagapanguna. Ang ayos ng pangungusap ay sumusunod sa pagkakasunod ng dalawang participle bago ang pangunahing pandiwa, ngunit nananatiling likas sa Tagalog.
