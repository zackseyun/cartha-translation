id: ACT.14.22
reference: Acts 14:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐπιστηρίζοντες τὰς ψυχὰς τῶν μαθητῶν, παρακαλοῦντες ἐμμένειν τῇ πίστει καὶ ὅτι διὰ πολλῶν θλίψεων δεῖ ἡμᾶς εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/022.yaml
  text: strengthening the souls of the disciples[a], encouraging them to remain in the faith[c][b], and saying that through many afflictions we must enter the kingdom of God.
translation:
  language: tl
  text: Pinatitibay nila ang kalooban ng mga alagad at hinihikayat silang manatili sa pananampalataya, at sinasabi nilang, “Kailangan nating dumaan sa maraming paghihirap upang makapasok sa kaharian ng Diyos.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστηρίζοντες
  choice: Pinatatatag
  rationale: Ipinahahayag ang patuloy na pagpapalakas at pagpapatibay sa mga alagad nang hindi nagpapahiwatig ng pormal na pagtatatag.
- source_word: τὰς ψυχὰς
  choice: ang kalooban
  rationale: Sa konteksto, tumutukoy sa panloob na pagkatao at katatagan. Mas natural sa modernong Tagalog ang “kalooban” kaysa literal na “mga kaluluwa,” na maaaring magbigay ng di-kinakailangang dualistikong pakahulugan.
- source_word: τῶν μαθητῶν
  choice: ng mga alagad
  rationale: Karaniwan at matatag na salin sa Bagong Tipan para sa mga tagasunod at mag-aaral ni Jesus.
- source_word: παρακαλοῦντες
  choice: hinihikayat
  rationale: Pinananatili ang suportado ngunit mariing paghimok na angkop sa konteksto ng pagtitiis sa gitna ng paghihirap.
- source_word: ἐμμένειν
  choice: manatili
  rationale: Tumpak na naghahayag ng patuloy at matatag na pananatili sa isang bagay.
- source_word: τῇ πίστει
  choice: sa pananampalataya
  rationale: Ang may-pantukoy na Griyego ay malamang na tumutukoy sa kinikilalang pananampalatayang Kristiyano; natural na Tagalog ang parirala at maaari ring magpanatili ng bahagyang lawak ng kahulugan.
- source_word: διὰ πολλῶν θλίψεων
  choice: dumanas ng maraming paghihirap
  rationale: Idyomatikong inililipat ang ideya ng pagpasok sa pamamagitan ng maraming kapighatian o pagdurusa, habang pinananatili ang bigat ng θλῖψις.
- source_word: δεῖ ἡμᾶς
  choice: Kailangan nating
  rationale: Pinananatili ang di-maiiwasang pangangailangan na ipinahahayag ng δεῖ nang hindi dinaragdagan ang teolohikal na dahilan nito.
- source_word: εἰσελθεῖν εἰς
  choice: makapasok sa
  rationale: Natural na anyong Tagalog para sa pagpasok tungo sa kaharian; ang “maka-” ay angkop sa konstruksiyong kasunod ng “kailangan.”
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: kaharian ng Diyos
  rationale: Pamantayan, malinaw, at pinananatili kapuwa ang larangan at paghahari na maaaring taglayin ng βασιλεία.
theological_decisions:
- issue: Kahulugan ng τῇ πίστει
  choice: sa pananampalataya
  alternative: sa kanilang pananampalataya
  rationale: Hindi tahasang sinasabi ng Griyego ang “kanilang.” Pinananatili ng napiling salin ang posibilidad na tumukoy ito sa pananampalatayang Kristiyano bilang kinikilalang kabuuan, gayundin ang mas pangkalahatang diwa ng pananalig.
- issue: Lakas at saklaw ng δεῖ
  choice: Kailangan nating dumanas ng maraming paghihirap bago makapasok sa kaharian ng Diyos
  alternative: Sa pamamagitan ng maraming paghihirap, kailangan nating pumasok sa kaharian ng Diyos
  rationale: Pinananatili ang pangangailangan at ang kaugnayan ng paghihirap sa pagpasok, ngunit hindi ipinapaliwanag kung ito ay takdang paraan, karaniwang karanasan, o ibang uri ng teolohikal na pangangailangan.
- issue: Ugnayan ng θλίψεις at pagpasok sa kaharian
  choice: bago makapasok
  alternative: sa pamamagitan ng ... makapasok
  rationale: Ang διὰ na may genitive ay literal na “sa pamamagitan ng/daan sa.” Ginamit sa pangunahing teksto ang natural na “bago,” ngunit minarkahan ng talababa ang mas pormal na ugnayang maaaring magpahiwatig ng pagdaan sa mga paghihirap.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Hinati sa dalawang pangungusap at ginawang tuwirang pahayag ang ὅτι-clause para sa likas na daloy. Iniwasan ang “mga kaluluwa” dahil madaling mabasa bilang teknikal na paghihiwalay ng katawan at kaluluwa; “kalooban” ang ginamit para sa panloob na pagkatao at katatagan.
