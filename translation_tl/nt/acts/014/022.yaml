review_pass:
  verdict: revise
  source_fidelity: Kailangang baguhin ang pangunahing salin dahil ang “bago makapasok” ay ginagawang temporal na nauna ang mga paghihirap sa pagpasok, samantalang ang διὰ πολλῶν θλίψεων ay nagsasaad ng pagdaan sa/pamamagitan ng maraming paghihirap. Ang “sinasabi nilang” ay wastong kumakatawan sa ὅτι-clause.
  naturalness: Natural at malinaw ang “Pinatitibay nila ang kalooban ng mga alagad” at ang pahayag na “Kailangan nating dumaan sa maraming paghihirap upang makapasok...”; mas tumpak ito kaysa sa dating “bago makapasok.”
  terminology: Pinananatili ang mga karaniwang terminong “mga alagad,” “pananampalataya,” at “kaharian ng Diyos.” Ang “kalooban” ay katanggap-tanggap sa kontekstong ito para sa ψυχάς bilang panloob na pagkatao/katatagan, nang hindi ipinapataw ang isang teknikal na dualismo.
  issues:
  - severity: high
    issue: Ang “bago makapasok” ay salin ng temporal na pagkakasunod-sunod.
    rationale: Ang διὰ + genitive ay “sa pamamagitan ng/sa pagdaan sa,” hindi “bago.” Maaaring ipahiwatig ng dating salin na ang paghihirap ay ganap na nagaganap muna bago ang pagpasok, sa halip na ito ang landas o karanasang kaugnay ng pagpasok.
