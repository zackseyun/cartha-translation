  to: Pinatitibay nila ang kalooban ng mga alagad at hinihikayat silang manatili sa pananampalataya, at sinasabi nilang, “Kailangan nating dumaan sa maraming paghihirap upang makapasok sa kaharian ng Diyos.”
  rationale: Pinalitan ang “bago makapasok” ng “dumaan sa maraming paghihirap upang makapasok” upang maipahayag ang διὰ πολλῶν θλίψεων bilang pagdaan sa mga paghihirap, hindi lamang bilang isang pangyayaring nauuna sa panahon. Inalis ang talababa sapagkat ang pangunahing teksto ay malinaw na ngayong naghahayag ng kinakailangang ugnayang ito nang hindi nangangailangan ng alternatibong pormal na salin.
