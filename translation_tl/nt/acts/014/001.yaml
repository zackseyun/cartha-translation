  text: Ἐγένετο δὲ ἐν Ἰκονίῳ κατὰ τὸ αὐτὸ εἰσελθεῖν αὐτοὺς εἰς τὴν συναγωγὴν τῶν Ἰουδαίων καὶ λαλῆσαι οὕτως ὥστε πιστεῦσαι Ἰουδαίων τε καὶ Ἑλλήνων πολὺ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/001.yaml
  text: In Iconium they entered together into the synagogue of the Jews and spoke in such a way that a great multitude of both Jews and Greeks believed[a].
translation:
  language: tl
  text: Sa Iconio, magkasama silang pumasok sa sinagoga ng mga Judio at nagsalita sila sa paraang napakaraming Judio at Griego ang sumampalataya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa sinagogang Judio.” Sa Griyego, literal na “sa sinagoga ng mga Judio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: '[hindi hiwalay na isinalin]'
  rationale: Isang karaniwang panandang pasalaysay ang parirala. Hindi na ito ginawang “nangyari” o “ngayon” upang maiwasan ang mabigat o di-likas na simula; naipahihiwatig na ng daloy ng salaysay ang paglipat.
- source_word: ἐν Ἰκονίῳ
  choice: Sa Iconio
  rationale: Tuwirang pariralang panlunan; ginamit ang karaniwang anyong Filipino ng pangalan ng lugar.
- source_word: κατὰ τὸ αὐτό
  choice: magkasama
  rationale: Ipinahihiwatig ng idyoma rito ang magkasamang pagkilos nina Pablo at Bernabe.
- source_word: εἰσελθεῖν αὐτοὺς
  choice: silang pumasok
  rationale: Ginawang likas na pandiwang tahasan sa Filipino ang pawatas na nakasalalay sa pasalaysay na konstruksyon.
- source_word: εἰς τὴν συναγωγὴν τῶν Ἰουδαίων
  choice: sa sinagoga ng mga Judio
  rationale: Pinanatili ang tahasang genitibong “ng mga Judio,” habang gumagamit ng natural na ayos sa Filipino.
- source_word: λαλῆσαι
  choice: nagsalita
  rationale: Tuwiran at hindi labis na mapagpakahulugang katumbas ng pandiwa sa kontekstong ito.
- source_word: οὕτως ὥστε
  choice: nagsalita nang gayon na lamang, kaya
  rationale: Pinananatili nito kapwa ang diin sa paraan ng kanilang pagsasalita at ang naging bunga nito, sa natural na Filipino.
- source_word: πιστεῦσαι
  choice: sumampalataya
  rationale: Karaniwang salitang Filipino para sa pagtugon nang may pananampalataya; hindi dinaragdagan ang layon na hindi tahasang binanggit sa Griyego.
- source_word: Ἰουδαίων τε καὶ Ἑλλήνων
  choice: Judio at Griego
  rationale: Malinaw na pinagsasama ng τε καὶ ang dalawang pangkat; likas na naihahatid ito ng “at” sa saklaw ng “napakarami.”
- source_word: πολὺ πλῆθος
  choice: napakaraming
  rationale: Natural at malinaw na ipinapahayag sa Filipino ang napakalaking bilang nang hindi gumagamit ng makalumang “lubhang maraming karamihan.”
theological_decisions:
- issue: Kahulugan ng πιστεῦσαι sa salaysay ng pagtugon sa pangangaral
  choice: sumampalataya
  alternative: naniwala; naniwala sa mensahe
  rationale: Iniulat lamang ng pandiwa ang tugon ng mga Judio at Griego. Hindi tahasang tinutukoy sa talata ang layon ng paniniwala, kaya hindi idinagdag ang “sa mensahe.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Iconio,” “Judio,” “Griego,” at “sinagoga” bilang mga anyong madaling makilala ng karaniwang mambabasa. Ang “nang gayon na lamang, kaya” ay nagpapanatili sa ugnayan ng paraan at bunga sa οὕτως ὥστε.
