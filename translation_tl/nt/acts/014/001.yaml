  source_fidelity: Ang pangunahing nilalaman—ang magkasanib na pagpasok sa sinagoga, pagsasalita, at pagsampalataya ng maraming Judio at Griego—ay tapat sa Griyego. Gayunman, ang “nang gayon na lamang” ay karaniwang nangangahulugang sukdulan o pambihirang antas sa Filipino, hindi simpleng paraan ng pagsasalita; kaya hindi nito wastong naihahatid ang οὕτως ὥστε.
  naturalness: Natural ang karamihan ng pangungusap, ngunit ang “nagsalita nang gayon na lamang, kaya” ay may di-likas at bahagyang maling diin. Mas malinaw at makabago ang “nagsalita sila sa paraang …” upang maipakita ang paraan at resultang ipinahahayag ng Griyego.
  terminology: Ang “Iconio,” “sinagoga,” “Judio,” “Griego,” at “sumampalataya” ay angkop sa marangal at makabagong Filipino. Ang talababa ay nananatiling wastong alternatibong leksikal.
