  yaml_path: translation/nt/acts/014/009.yaml
  text: This man listened to Paul speaking[a], who, looking intently at him and seeing that he had faith to be saved,
translation:
  language: tl
  text: Nakinig ang lalaking ito kay Pablo habang nagsasalita siya. Tinitigan siya ni Pablo at nakita nitong may pananampalataya siya upang gumaling,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: ang lalaking ito
  rationale: Tumutukoy ito sa lalaking pilay na binanggit sa naunang talata; malinaw at natural sa Tagalog ang tahasang pagtukoy.
- source_word: ἤκουσεν
  choice: nakinig
  rationale: Bagaman maaari ring mangahulugang simpleng ‘narinig,’ ipinahihiwatig ng konteksto ang pagbibigay-pansin niya sa sinasabi ni Pablo.
- source_word: τοῦ Παύλου λαλοῦντος
  choice: habang nagsasalita si Pablo
  rationale: Likas na Tagalog na pagpapahayag ng kasabay na kilos ng pakikinig at pagsasalita.
- source_word: ἀτενίσας αὐτῷ
  choice: tinitigan siya ni Pablo
  rationale: Ipinapahayag ng pandiwa ang matindi at nakatuong pagtingin; nilinaw ang simuno upang maiwasan ang kalituhan sa panghalip.
- source_word: ἰδὼν
  choice: nang makitang
  rationale: Pinananatili ang konkretong wika ng pagkakita habang likas ding naipahihiwatig ang pagkilala o pagkaunawa.
- source_word: ἔχει πίστιν
  choice: may pananampalataya
  rationale: Sa konteksto, ang πίστις ay tumutukoy sa mapanampalatayang pagtugon ng lalaki, hindi sa katapatan bilang ugali.
- source_word: τοῦ σωθῆναι
  choice: siyang mapagaling
  rationale: Ang aorist passive infinitive ay tumutukoy rito sa pagtanggap ng pisikal na paggaling, gaya ng pinatutunayan ng kasunod na pangyayari; pinananatili sa talababa ang mas malawak na kahulugang ‘maligtas.’
theological_decisions:
- issue: Kahulugan ng σωθῆναι sa salaysay ng himalang pagpapagaling
  choice: mapagaling
  alternative: maligtas
  rationale: Ang agarang konteksto ay ang pisikal na pagpapanumbalik sa lalaking pilay. Gayunman, ang pandiwang Griyego ay maaari ring tumukoy sa pagliligtas sa mas malawak na diwa, kaya hindi inaalis ang posibilidad na iyon at inilalahad ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang sugnay na pangungusap upang maging malinaw na si Pablo ang tumitig at nakakita. Pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap at kilos sa susunod na talata.
