  text: ἐσχίσθη δὲ τὸ πλῆθος τῆς πόλεως, καὶ οἱ μὲν ἦσαν σὺν τοῖς Ἰουδαίοις οἱ δὲ σὺν τοῖς ἀποστόλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/004.yaml
  text: But the people of the city were divided[a], and some were with the Jews and some with the apostles.
translation:
  language: tl
  text: Ngunit nahati ang mga tao sa lungsod[a]. Ang ilan ay pumanig sa mga Judio, at ang iba naman ay pumanig sa mga apostol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nahati ang karamihan ng mga tao sa lungsod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσχίσθη
  choice: nahati
  rationale: Ang pasibong anyo ng σχίζω ay nangangahulugang ‘nahati’ o ‘nabiyak.’ Ang ‘nahati’ ay natural sa Filipino para sa pagkakahating panlipunan ng mga tao.
- source_word: τὸ πλῆθος τῆς πόλεως
  choice: ang mga tao sa lungsod
  rationale: Bagaman maaaring literal na tumukoy ang πλῆθος sa ‘karamihan’ o ‘napakaraming tao,’ dito ay malawak na tinutukoy nito ang mga mamamayan ng lungsod. Ang ‘mga tao sa lungsod’ ay malinaw at likas sa modernong Filipino.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat o bagong pangyayari kaugnay ng naunang talata; ang ‘Ngunit’ ay malinaw na naghahayag ng pagkakahating ibinunga ng mga naunang pangyayari.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: ang ilan ... ang iba naman
  rationale: Ipinakikita ng magkaugnay na parirala ang dalawang magkasalungat na pangkat. Natural at malinaw sa Filipino ang ‘ang ilan ... ang iba naman.’
- source_word: σὺν
  choice: pumanig sa
  rationale: Pangunahing ipinahihiwatig ng σύν ang pakikisama o pagkakaugnay. Sa konteksto ng nahating lungsod, likas na ipinapahayag ng ‘pumanig sa’ ang pagkampi ng bawat pangkat nang hindi dinaragdagan ang diwa.
- source_word: Ἰουδαίοις
  choice: mga Judio
  rationale: Walang pahiwatig sa talata na mga pinuno lamang ang tinutukoy. Ang ‘mga Judio’ ang tuwirang at karaniwang salin sa kontekstong ito.
- source_word: ἀποστόλοις
  choice: mga apostol
  rationale: Ang ‘apostol’ ay tanggap at pamilyar na katumbas ng ἀπόστολος. Dito ay tumutukoy ito kina Pablo at Bernabe, na hayagang tinawag na mga apostol sa Gawa 14:14.
theological_decisions:
- issue: Ang tinutukoy ng ‘mga apostol’
  choice: Panatilihin ang ‘mga apostol’ bilang katawagan ng salaysay kina Pablo at Bernabe.
  alternative: Isalin nang mas pangkalahatan bilang ‘mga sugo.’
  rationale: Hayagang tinatawag ni Lucas na ‘mga apostol’ sina Bernabe at Pablo sa Gawa 14:14. Pinananatili ng tuwirang salin ang katawagan ng teksto nang hindi nagpapasok ng mas makitid na doktrinal na pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘lungsod,’ ‘mga Judio,’ at ‘mga apostol’ bilang mga salitang pamilyar sa karaniwang mambabasa; pinili ang ‘pumanig’ upang likas na maipahayag ang pagkakampi sa konteksto.
