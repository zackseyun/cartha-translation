  text: Ἐπῆλθαν δὲ ἀπὸ Ἀντιοχείας καὶ Ἰκονίου Ἰουδαῖοι, καὶ πείσαντες τοὺς ὄχλους καὶ λιθάσαντες τὸν Παῦλον ἔσυρον ἔξω τῆς πόλεως, ⸀νομίζοντες αὐτὸν τεθνηκέναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/019.yaml
  text: But Jews came from Antioch and Iconium[a], and after persuading the crowds and stoning Paul, they dragged him outside the city, supposing that he was dead.
translation:
  language: tl
  text: Ngunit may dumating na mga Judio mula sa Antioquia at Iconio. Matapos nilang hikayatin ang mga tao at batuhin si Pablo ng mga bato, kinaladkad nila siya palabas ng lungsod dahil inaakala nilang patay na siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inaakala nilang namatay na siya.” Palagay nila ang sinasabi ng Griyego; hindi nito tahasang sinasabing talagang namatay si Pablo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπῆλθαν
  choice: may dumating
  rationale: Likas itong paglalahad sa Filipino ng pagdating ng mga kalabang nagmula sa ibang mga lungsod.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang pagbaligtad mula sa naunang mas mabuting pagtanggap kay Pablo tungo sa pagsalungat.
- source_word: Ἰουδαῖοι
  choice: mga Judio
  rationale: Tumutukoy ito rito sa mga Judiong dumating mula sa Antioquia at Iconio, hindi lamang sa mga taga-Judea.
- source_word: πείσαντες τοὺς ὄχλους
  choice: Matapos nilang hikayatin ang mga tao
  rationale: Pinananatili ng “matapos” ang pagkakasunod ng naunang kilos at ng pangunahing kilos; natural at hindi labis ang “hikayatin” para sa πείθω sa kontekstong ito.
- source_word: λιθάσαντες
  choice: batuhin si Pablo
  rationale: Tuwirang ipinapahayag ang marahas na pagpatay sa pamamagitan ng pagbato, bilang kilos na nauna sa pagkaladkad.
- source_word: ἔσυρον
  choice: kinaladkad nila
  rationale: Malinaw na inilalarawan ng “kinaladkad” ang marahas na kilos ng σύρω sa natural na salaysay na Filipino.
- source_word: ἔξω τῆς πόλεως
  choice: palabas ng lungsod
  rationale: Ipinakikita nito kapwa ang direksiyon ng pagkaladkad at ang hantungan sa labas ng lungsod.
- source_word: νομίζοντες
  choice: dahil inaakala nilang
  rationale: Inilalahad nito ang palagay ng mga sumalakay bilang dahilan ng kanilang ginawa, nang hindi ito itinatanghal na tiyak na katotohanan.
- source_word: τεθνηκέναι
  choice: patay na siya
  rationale: Natural na Filipino ito para sa perpektong pawatas na tumutukoy sa kalagayang bunga ng pagkamatay.
theological_decisions:
- issue: Kung sinasabi ng talata na talagang namatay si Pablo o na inakala lamang iyon ng mga sumalakay
  choice: “dahil inaakala nilang patay na siya”
  alternative: “dahil inaakala nilang namatay na siya”
  rationale: Tahasan lamang na iniulat ng Griyego ang palagay ng mga sumalakay (νομίζοντες), hindi ang aktuwal na pagkamatay ni Pablo. Kaya hindi pinatitibay ng salin ang isang konklusyong hindi tahasang sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Judio,” “Antioquia,” at “Iconio” bilang karaniwang anyong Filipino ng mga pangalan; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
