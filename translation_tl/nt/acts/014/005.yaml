translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginawang pandiwa ang ideya ng ὁρμή para maging natural ang pangungusap, habang pinananatili sa talababa ang mas kongkretong posibilidad na marahas na paglusob. Ang hulihang kuwit ay pinanatili dahil nagpapatuloy ang pangungusap sa kasunod na talata.
