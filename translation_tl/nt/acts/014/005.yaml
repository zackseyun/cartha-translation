  text: ὡς δὲ ἐγένετο ὁρμὴ τῶν ἐθνῶν τε καὶ Ἰουδαίων σὺν τοῖς ἄρχουσιν αὐτῶν ὑβρίσαι καὶ λιθοβολῆσαι αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/005.yaml
  text: And when an attempt was made by both the Gentiles and the Jews[a], together with their rulers, to mistreat them and to stone them[b],
translation:
  language: tl
  text: Nang magtangka[a] ang kapuwa mga Hentil at mga Judio[b], kasama ang kanilang mga pinuno, na pagmalupitan at batuhin sila,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang magkaroon ng biglaang paglusob” o “nang maglunsad sila ng paglusob.” Maaaring tumukoy ang salitang Griyego na ὁρμή sa isang marahas na pagkilos o paglusob; “magtangka” ang ginamit dito dahil ang pagmamalupit at pagbato ay inilalahad bilang mga nilalayong gawin, hindi bilang mga gawaing natapos na sa talatang ito.
    reason: lexical_alternative
  - marker: b
    text: Sa ilang konteksto, maaari ring isalin ang “mga Judio” bilang “mga taga-Judea.” Dito ay malamang na tumutukoy ito sa mga Judiong kalaban bilang isang pangkat, hindi lamang sa mga taong nagmula sa Judea.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο
  choice: Nang
  rationale: Ipinakikilala nito ang sumunod na pangyayari at pinananatili ang temporal na diwa ng ὡς; hindi kailangang gawing tahasang panalungat ang banayad na δέ sa natural na salaysay sa Tagalog.
- source_word: ὁρμὴ
  choice: magtangka
  rationale: Maaaring tumukoy ang ὁρμή sa biglang paglusob, marahas na pagkilos, o pagtatangka. Dahil ang kasunod na mga pawatas ay nagsasaad ng mga nilalayong gawin, natural na ipinahahayag ito sa Tagalog bilang pandiwang “magtangka” nang hindi sinasabing naisakatuparan ang mga iyon.
- source_word: τῶν ἐθνῶν
  choice: ang mga Hentil
  rationale: Sa kontekstong kaiba sa mga Judio, tumutukoy ang ἔθνη sa mga hindi Judio, hindi sa mga bansa bilang mga estadong pampolitika.
- source_word: τε καὶ
  choice: ang mga Hentil at mga Judio
  rationale: Ipinakikita ng magkatambal na τε καί na kapuwa kabilang sa pagkilos ang mga Hentil at mga Judio; sapat at natural sa Tagalog ang pag-uugnay na “at.”
- source_word: Ἰουδαίων
  choice: mga Judio
  rationale: Dito ay malamang na tumutukoy ito sa mga Judiong kalaban bilang isang pangkat, hindi lamang sa mga taong nagmula sa Judea.
- source_word: σὺν τοῖς ἄρχουσιν αὐτῶν
  choice: kasama ang kanilang mga pinuno
  rationale: Ang ἄρχοντες ay mga taong may awtoridad sa pamayanan o pamahalaan; malinaw at malawak ang “mga pinuno,” habang ipinapakita ng “kasama” ang σύν.
- source_word: ὑβρίσαι
  choice: na pagmalupitan
  rationale: Saklaw ng ὑβρίζω ang mapanghamak at marahas na pagmamaltrato. Ang “pagmalupitan” ay higit na angkop kaysa salitang limitado lamang sa pang-iinsulto.
- source_word: καὶ λιθοβολῆσαι
  choice: at batuhin
  rationale: Tuwirang katumbas ito ng λιθοβολέω. Hindi idinagdag ang “hanggang mamatay” sapagkat, bagaman maaaring iyon ang layunin, hindi tahasang sinasabi ng pandiwa ang kinalabasan.
- source_word: αὐτούς
  choice: sila
  rationale: Tumutukoy ang panghalip kina Pablo at Bernabe ayon sa agarang konteksto.
