  text: And they stayed with the disciples for no little time[a].
translation:
  language: tl
  text: At nanatili sila kasama ng mga alagad sa loob ng hindi maikling panahon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas likas na pananalita, “sa loob ng mahabang panahon” o “nang matagal-tagal.” Gumagamit ang Griyego ng litotes: “hindi maikling panahon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: nanatili sila roon
  rationale: Ang imperpektong anyo ay nagpapahiwatig ng patuloy na pananatili o pagpapalipas ng panahon sa isang lugar. Likas sa modernong Tagalog ang “nanatili sila roon” at malinaw nitong naihahatid ang diwang duratibo.
- source_word: δὲ
  choice: At
  rationale: Banayad na pang-ugnay ang δέ; ang “At” ay angkop sa payak na pagpapatuloy ng salaysay.
- source_word: χρόνον οὐκ ὀλίγον
  choice: nang hindi maikling panahon
  rationale: Pinananatili nito ang litotes ng Griyego—literal na “hindi maikling panahon”—nang hindi lubusang pinapakinis ang retorikal na anyo nito.
- source_word: σὺν τοῖς μαθηταῖς
  choice: kasama ng mga alagad
  rationale: Tuwirang ipinapahayag ng σύν na sila ay kasama ng mga alagad; sa konteksto, ang mga ito ay ang lokal na pangkat ng mga mananampalataya.
