source:
  edition: SBLGNT
  text: ⸀καίτοι οὐκ ἀμάρτυρον ⸀αὑτὸν ἀφῆκεν ⸀ἀγαθουργῶν, οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς καὶ καιροὺς καρποφόρους, ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/017.yaml
  text: Yet he did not leave himself without witness[a], doing good by giving you rains from heaven and fruitful seasons[c][b], filling your hearts with food and gladness.
translation:
  language: tl
  text: 'Gayunman, hindi niya iniwan ang kanyang sarili na walang patotoo, sapagkat gumagawa siya ng mabuti: binibigyan niya kayo ng ulan mula sa langit at ng mga panahong mabunga[b], at pinupuno niya ng pagkain at kagalakan ang inyong mga puso[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: O, “mga panahong namumunga.”
    reason: lexical_alternative
  - marker: c
    text: May ilang salin na gumagamit ng “aming mga puso” dahil sa pagkakaiba ng panghalip sa mga manuskrito; “inyong mga puso” ang mababasa sa SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: καίτοι
  choice: Gayunman
  rationale: 'Malinaw na ipinahahayag ang pagsalungat o konsesyon kaugnay ng naunang talata: bagaman pinahintulutan ng Diyos ang mga bansa na lumakad sa sarili nilang mga daan, hindi siya nawalan ng patotoo tungkol sa kanyang sarili.'
- source_word: ἀμάρτυρον
  choice: walang patotoo
  rationale: Pinananatili ang diwang testimonial o pangsaksi ng salitang Griyego; mas tiyak ito kaysa sa mas malawak na “walang katibayan.”
- source_word: αὑτὸν
  choice: ang kanyang sarili
  rationale: 'Pinananatili ang reflexive na diin: ang Diyos ang nagbigay ng patotoo tungkol sa mismong sarili niya sa pamamagitan ng kanyang kabutihan.'
- source_word: ἀγαθουργῶν
  choice: Gumawa siya ng mabuti
  rationale: Likas at tuwirang Filipino na naglalahad kung paano hindi iniwan ng Diyos ang kanyang sarili na walang patotoo.
- source_word: οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς
  choice: sa pamamagitan ng pagbibigay sa inyo ng mga ulan mula sa langit
  rationale: Ang “sa pamamagitan ng” ay nagpapakita ng ugnayang instrumental ng participle; ang maramihang “mga ulan” ay tumutugma sa anyong plural ng Griyego at nagpapahiwatig ng paulit-ulit na pag-ulan.
- source_word: καιροὺς καρποφόρους
  choice: mabubungang panahon
  rationale: Ang καιροί ay mga takdang panahon o kapanahunan, at ang καρποφόρους ay nangangahulugang namumunga o mabunga. Ang parirala ay natural sa Filipino at pinananatili ang larawang agrikultural.
- source_word: ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης
  choice: pinuspos niya ng pagkain at kagalakan
  rationale: Ang “pinuspos” ay nagpapahayag ng ganap na pagpuno o pagbibigay-kasiyahan, samantalang ang “pagkain at kagalakan” ay tuwirang tumutugma sa dalawang biyayang binanggit.
- source_word: τὰς καρδίας ὑμῶν
  choice: ang inyong mga puso
  rationale: Pinananatili ang metapora ng Griyego at ang panghalip na pangalawang panauhang maramihan na mababasa sa SBLGNT.
theological_decisions:
- issue: Ang patotoo ng Diyos sa pamamagitan ng kanyang kabutihan sa sangnilikha
  choice: Inilalarawan ang ulan, mabubungang panahon, pagkain, at kagalakan bilang mga gawang nagbibigay-patotoo tungkol sa Diyos.
  alternative: Ituring ang mga ito bilang mga prosesong likas lamang na walang ipinahihiwatig tungkol sa Diyos.
  rationale: Ang reflexive na “ang kanyang sarili,” kasama ng “walang patotoo” at ng mga participleng naglalarawan sa pagkilos ng Diyos, ay tahasang nag-uugnay sa kanyang mapagkalingang kabutihan at sa patotoo tungkol sa kanya. Hindi na pinalalawak ang pahayag lampas sa sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Gayunman” at “pinuspos” bilang pormal ngunit karaniwang mauunawaang mga salita. Hinati sa dalawang pangungusap ang mahabang estrukturang Griyego upang maging natural ang daloy nang hindi nawawala ang paliwanag na ang kabutihan ng Diyos ang nagsisilbing patotoo tungkol sa kanya.
