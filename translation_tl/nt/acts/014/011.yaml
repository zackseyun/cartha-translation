  text: οἵ ⸀τε ὄχλοι ἰδόντες ὃ ⸀ἐποίησεν Παῦλος ἐπῆραν τὴν φωνὴν αὐτῶν Λυκαονιστὶ λέγοντες· Οἱ θεοὶ ὁμοιωθέντες ἀνθρώποις κατέβησαν πρὸς ἡμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/011.yaml
  text: And when the crowds saw what Paul had done[a], they raised their voices, saying in the Lycaonian language, “The gods, having become like men[b], have come down to us!”
translation:
  language: tl
  text: Nang makita ng mga tao ang ginawa ni Pablo, malakas silang sumigaw sa wikang Licaoniano, “Ang mga diyos, na naging tulad ng mga tao, ay bumaba sa atin!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵ τε ὄχλοι ἰδόντες
  choice: Nang makita ng mga tao
  rationale: Ginawang temporal ang aorist participle na ἰδόντες sa natural na Tagalog. Ang ὄχλοι ay tumutukoy sa mga taong naroon; ang “mga tao” ay mas karaniwan at malinaw kaysa sa mas pormal na “mga pulutong.”
- source_word: ὃ ἐποίησεν Παῦλος
  choice: ang ginawa ni Pablo
  rationale: Tuwirang ipinapahayag ang naunang ginawa ni Pablo nang hindi nagdaragdag ng paliwanag na hindi tahasang nasa talata.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: malakas silang sumigaw
  rationale: Idyoma ito para sa malakas na pagsigaw. Mas natural ito sa makabagong Tagalog kaysa sa literal ngunit matigas na “itinaas nila ang kanilang tinig.”
- source_word: Λυκαονιστὶ λέγοντες
  choice: sa wikang Licaonia
  rationale: Nililinaw ng “wikang” na ang adverb ay tumutukoy sa wikang ginamit nila. Ang “Licaonia” ay anyong madaling basahin sa Tagalog.
- source_word: Οἱ θεοὶ
  choice: Ang mga diyos
  rationale: Pinananatili ang maramihan at ang paganong pananaw ng mga nagsasalita.
- source_word: ὁμοιωθέντες ἀνθρώποις
  choice: naging tulad ng mga tao
  rationale: Pinananatili ang diwa ng pagkakatulad sa ὁμοιωθέντες at hindi ito pinatitindi bilang isang tiyak na doktrina ng pagkakatawang-tao.
- source_word: κατέβησαν πρὸς ἡμᾶς
  choice: bumaba rito sa atin
  rationale: Ang “bumaba” ay tuwirang katumbas ng κατέβησαν; ang “rito sa atin” ay natural na Tagalog para sa pagdating mula sa itaas patungo sa kinaroroonan ng mga nagsasalita.
theological_decisions:
- issue: Paglalahad sa paganong pakahulugan ng mga tao nang hindi ipinapasok ang teolohiyang Kristiyano tungkol sa pagkakatawang-tao
  choice: Ang mga diyos ay naging tulad ng mga tao
  alternative: Ang mga diyos ay nag-anyong tao
  rationale: Mas malapit ang “naging tulad ng mga tao” sa pahayag ng pagkakatulad sa Griyego. Ang “nag-anyong tao” ay maaaring magpahiwatig nang mas tiyak na nagkatawang-tao o nagbalatkayo sila, kaya hindi iyon pinili.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang mas natural na idyomang “malakas silang sumigaw” sa halip na literal na pagsasalin ng pagtaas ng tinig. Walang talababa dahil sapat na naipapahayag sa pangunahing teksto ang tunay na diwa at hindi kailangan ang mga magulong marker sa English consultation layer.
