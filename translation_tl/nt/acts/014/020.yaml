  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: κυκλωσάντων δὲ ⸂τῶν μαθητῶν αὐτὸν⸃ ἀναστὰς εἰσῆλθεν εἰς τὴν πόλιν. καὶ τῇ ἐπαύριον ἐξῆλθεν σὺν τῷ Βαρναβᾷ εἰς Δέρβην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/020.yaml
  text: But after the disciples had gathered around him[a], he got up and went into the city[b]. And on the next day he went out with Barnabas to Derbe.
translation:
  language: tl
  text: Ngunit nang magtipon sa paligid niya ang mga alagad[a], bumangon siya at pumasok sa lungsod.[b] Kinabukasan, umalis siya at si Bernabe papuntang Derbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang palibutan siya ng mga alagad” o “nang pumaligid sa kanya ang mga alagad.”
    reason: lexical_alternative
  - marker: b
    text: O “tumayo siya.” Maaaring isaling “bumangon,” ngunit hindi tahasang sinasabi ng Griyego rito na muling binuhay si Pablo.
    reason: alternative_reading
lexical_decisions:
- source_word: κυκλωσάντων
  choice: nang palibutan
  rationale: Ang aorist participle ng κυκλόω ay tumutukoy sa pag形成 ng bilog sa paligid ng isang tao. Likas sa Tagalog ang “palibutan” at hindi nito likas na ipinahihiwatig ang masamang layunin; ipinakikita ng “mga alagad” na hindi mapanindak ang kilos.
- source_word: δὲ
  choice: Ngunit
  rationale: Naghuhudyat ang δέ ng banayad na pagsalungat o pagbabago mula sa naunang pangyayari, kung saan binato si Pablo at kinaladkad palabas ng lungsod.
- source_word: τῶν μαθητῶν
  choice: ng mga alagad
  rationale: Ang “alagad” ang karaniwan at matatag na salin ng μαθητής sa kontekstong biblikal.
- source_word: ἀναστὰς
  choice: bumangon siya
  rationale: Karaniwang inilalarawan ng ἀνίστημι rito ang pisikal na pagbangon ni Pablo. Ang “bumangon” ay natural at hindi tahasang nagsasabing binuhay siyang muli.
- source_word: εἰσῆλθεν εἰς τὴν πόλιν
  choice: pumasok sa lungsod
  rationale: Tumpak at natural na inililipat ng “pumasok sa lungsod” ang kilos na ipinahahayag ng εἰσέρχομαι na may εἰς.
- source_word: τῇ ἐπαύριον
  choice: Kinabukasan
  rationale: Maikli at likas na katumbas sa Tagalog ng temporal na pariralang “sa sumunod na araw.”
- source_word: ἐξῆλθεν
  choice: umalis
  rationale: Bagaman literal na “lumabas,” mas natural sa Tagalog ang “umalis” kapag kasunod ang patutunguhang lugar; napapanatili nito ang pag-alis mula sa lungsod.
- source_word: σὺν τῷ Βαρναβᾷ
  choice: sila ni Bernabe
  rationale: Natural na konstruksiyong Tagalog para sa pagsama ni Bernabe kay Pablo; malinaw sa naunang sugnay na si Pablo ang pangunahing paksa.
- source_word: Δέρβην
  choice: Derbe
  rationale: Karaniwang transliterasyon sa Filipino ng pangalan ng lugar.
theological_decisions:
- issue: Kung ang ἀναστὰς ay dapat isaling may pahiwatig ng muling pagkabuhay o mahimalang pagbuhay
  choice: 'Isinalin bilang karaniwang pisikal na kilos: “bumangon siya”'
  alternative: “muling nabuhay siya” o “ibinangon siya”
  rationale: Maaaring pambihira ang paggaling ni Pablo ayon sa konteksto, ngunit hindi tahasang sinasabi ng participle na binuhay siyang muli o may ibang nagbangon sa kanya. Pinananatili ng salin ang pagpipigil at kalabuan ng teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “lungsod,” “mga alagad,” at “Kinabukasan” para sa malinaw at natural na daloy. Ang ayos na “sila ni Bernabe” ay idiomatikong Filipino at hindi binabago ang pangunahing papel ni Pablo sa salaysay.
