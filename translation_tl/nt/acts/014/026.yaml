id: ACT.14.26
reference: Acts 14:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: κἀκεῖθεν ἀπέπλευσαν εἰς Ἀντιόχειαν, ὅθεν ἦσαν παραδεδομένοι τῇ χάριτι τοῦ θεοῦ εἰς τὸ ἔργον ὃ ἐπλήρωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/026.yaml
  text: And from there they sailed to Antioch[b][a], where they had been committed to the grace of God for the work that they had fulfilled.
translation:
  language: tl
  text: At mula roon ay naglayag sila patungong Antioquia, kung saan[a] sila dati nang ipinagkatiwala sa biyaya ng Diyos para sa gawaing natapos[b] nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas tahasan: “mula sa lugar na iyon sila dati nang ipinagkatiwala sa biyaya ng Diyos.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “tinupad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: At mula roon
  rationale: Pinananatili nito kapwa ang pang-ugnay na puwersa at ang pagtukoy sa lugar na kanilang nilisan.
- source_word: ἀπέπλευσαν
  choice: naglayag sila
  rationale: Likas sa Tagalog at malinaw na nagsasaad ng paglalakbay sa dagat; sapat nang ipinahihiwatig ng “mula roon” ang pag-alis.
- source_word: εἰς Ἀντιόχειαν
  choice: patungong Antioquia
  rationale: Ang “patungong” ang likas na katumbas ng εἰς kasunod ng pandiwa ng pagkilos; ginamit ang nakaugaliang anyong Tagalog ng pangalan ng lugar.
- source_word: ὅθεν
  choice: kung saan
  rationale: Natural itong nag-uugnay sa Antioquia bilang lugar ng naunang pagkakatiwala, habang inilalagay sa talababa ang mas tahasang diwang “mula sa lugar na iyon.”
- source_word: ἦσαν παραδεδομένοι
  choice: sila dati nang ipinagkatiwala
  rationale: Ipinahahayag ng “dati nang” ang naunang naganap na pagkilos, at ng “ipinagkatiwala” ang paglalagay sa pangangalaga ng biyaya ng Diyos nang hindi nagdaragdag ng partikular na doktrina tungkol sa pagtatalaga.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: sa biyaya ng Diyos
  rationale: Tuwirang pinananatili ang biyaya ng Diyos bilang siyang pinagkatiwalaan sa kanila, pati ang bigat na teolohikal ng parirala.
- source_word: εἰς τὸ ἔργον
  choice: para sa gawain
  rationale: Ang “gawain” ay malawak at tuwirang katumbas na hindi nagpapakahulugan nang higit sa konteksto.
- source_word: ὃ ἐπλήρωσαν
  choice: natapos nila
  rationale: Sa kontekstong ito, ang πληρόω ay tumutukoy sa pagdadala ng gawain hanggang sa kaganapan; natural at malinaw sa modernong Tagalog ang “natapos.”
theological_decisions:
- issue: Ang likas ng naunang ginawa kay Pablo at Bernabe sa Antioquia
  choice: ipinagkatiwala sa biyaya ng Diyos
  alternative: inihabilin sa biyaya ng Diyos
  rationale: Ipinakikita ng salin na inilagay sila sa mapagbiyayang pangangalaga ng Diyos para sa gawain, nang hindi ipinapasok ang isang natatanging denominasyonal na pagkaunawa sa pagsusugo o pagtatalaga.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang iisang pangungusap at ang teolohikal na pariralang “biyaya ng Diyos,” habang iniwasan ang teknikal o denominasyonal na pananalita.
