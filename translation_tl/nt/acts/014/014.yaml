source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος, διαρρήξαντες τὰ ἱμάτια ⸀αὐτῶν ⸀ἐξεπήδησαν εἰς τὸν ὄχλον κράζοντες
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/014.yaml
  text: But when the apostles Barnabas and Paul heard, they tore their garments and rushed out into the crowd, crying out,
translation:
  language: tl
  text: Ngunit nang marinig ito ng mga apostol na sina Bernabe at Pablo, pinunit nila ang kanilang mga damit[a] at mabilis na sumugod sa gitna ng mga tao[b], na sumisigaw,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pagpunit ng sariling damit ay kinaugaliang tanda ng dalamhati, matinding pagkabigla, o pagtutol sa pagbibigay ng karangalang lapastangan sa Diyos.
    reason: cultural_note
  - marker: b
    text: O “biglang lumundag sa gitna ng mga tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: nang marinig ito
  rationale: Ang aorist participle ay may temporal na diwa. Likas sa Tagalog ang “nang marinig,” at ang “ito” ay tumutukoy sa naunang pangyayari nang hindi dinaragdagan ang nilalaman.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang banayad na pagsalungat sa tangkang paghahandog ng mga tao at ang agarang reaksiyon ng mga apostol.
- source_word: οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος
  choice: ang mga apostol na sina Bernabe at Pablo
  rationale: Pinananatili ang tuwirang pagtukoy ng teksto kina Bernabe at Pablo bilang mga apostol, gamit ang karaniwang anyo ng mga pangalan sa Filipino.
- source_word: διαρρήξαντες τὰ ἱμάτια αὐτῶν
  choice: pinunit nila ang kanilang mga damit
  rationale: Tuwiran at natural itong nagsasaad ng kilos na tanda ng matinding pagkabigla, dalamhati, o pagtutol.
- source_word: ἐξεπήδησαν
  choice: mabilis na sumugod
  rationale: Ipinahahayag ng pandiwa ang biglaan, masigla, at apurahang pagkilos. Hindi idinagdag ang “lumabas,” sapagkat walang hiwalay na salitang tahasang nagsasaad nito sa Griyego.
- source_word: εἰς τὸν ὄχλον
  choice: sa gitna ng mga tao
  rationale: Ipinahahayag ang pagkilos papasok sa kumpol ng mga tao sa likas na modernong Tagalog.
- source_word: κράζοντες
  choice: na sumisigaw
  rationale: Pinananatili ang kasabay at malakas na pagsasalita na ipinahahayag ng present participle.
theological_decisions:
- issue: Ang pagtukoy ng “mga apostol” kina Bernabe at Pablo
  choice: Pinanatili ang “mga apostol na sina Bernabe at Pablo.”
  alternative: “Sina Bernabe at Pablo, na mga sugo” o isang paliwanag na nililimitahan ang katawagang apostol.
  rationale: Tuwirang kinikilala sila ng Griyegong teksto bilang οἱ ἀπόστολοι sa kontekstong ito. Hindi dapat lutasin sa salin ang mas malawak na usaping doktrinal tungkol sa saklaw ng katawagang “apostol.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “damit” sa halip na mas lumang “kasuotan,” at “sa gitna ng mga tao” upang natural na ipahayag ang pagkilos tungo sa karamihan.
