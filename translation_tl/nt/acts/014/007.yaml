  text: And there they were preaching the good news[a].
translation:
  language: tl
  text: At doon ay patuloy nilang ipinangangaral ang Magandang Balita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At doon din ay patuloy nilang ipinahahayag ang ebanghelyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖ
  choice: At doon
  rationale: Pinagsasama ng κἀκεῖ ang καί at ἐκεῖ. Likas sa daloy ng salaysay ang “At doon,” at napananatili nito kapwa ang pang-ugnay at ang pagtukoy sa lugar.
- source_word: εὐαγγελιζόμενοι
  choice: ipinangangaral ang Magandang Balita
  rationale: Ang εὐαγγελίζω ay nangangahulugang maghayag ng mabuting balita, lalo na ng mensahe tungkol kay Cristo. Malinaw at likas sa makabagong Tagalog ang “ipinangangaral ang Magandang Balita,” habang pinananatili ang aktibong diwa ng pandiwa.
- source_word: εὐαγγελιζόμενοι ἦσαν
  choice: patuloy nilang ipinangangaral
  rationale: Ang participle kasama ng imperfect na ἦσαν ay bumubuo ng periphrastic construction na nagpapahiwatig ng nagpapatuloy na kilos sa nakaraan. Ipinahahayag ito nang natural sa Tagalog sa pamamagitan ng “patuloy.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Magandang Balita” sa pangunahing teksto upang tuwirang ipakita ang kahulugan ng εὐαγγελίζω; inilagay sa talababa ang mas tradisyonal na “ebanghelyo.”
