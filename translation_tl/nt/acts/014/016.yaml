base_translation:
  language: en
  yaml_path: translation/nt/acts/014/016.yaml
  text: In past generations he allowed all the nations to walk in their own ways[a].
translation:
  language: tl
  text: Sa mga nagdaang salinlahi, hinayaan niyang lumakad ang lahat ng bansa sa sarili nilang mga daan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinahintulutan ang lahat ng Hentil na lumakad sa kani-kanilang mga daan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: niyang
  rationale: Ang panghalip na pamatlig ay tumutukoy sa Diyos sa naunang talata. Sa Filipino, natural na ipagpatuloy ang pangungusap sa “niyang” sa halip na gumamit ng tahasang “na siyang.”
- source_word: ἐν ταῖς παρῳχημέναις γενεαῖς
  choice: Sa mga nagdaang salinlahi
  rationale: Tumpak nitong ipinahahayag ang mga henerasyong lumipas, sa dignified ngunit nauunawaang modernong Filipino.
- source_word: εἴασεν
  choice: hinayaan
  rationale: Ipinapakita nito ang pagpapahintulot o hindi pagpigil, hindi ang pagsang-ayon o tuwirang pagtakda ng Diyos sa kanilang ginawa.
- source_word: πάντα τὰ ἔθνη
  choice: ang lahat ng bansa
  rationale: Pinananatili nito ang malawak at kolektibong saklaw ng ἔθνη; maaari rin itong tumukoy sa mga Hentil, kaya inilagay ang alternatibo sa talababa.
- source_word: πορεύεσθαι
  choice: lumakad
  rationale: Pinananatili ng “lumakad” ang metapora ng paglalakbay na, kasama ng “mga daan,” tumutukoy rin sa paraan ng pamumuhay.
- source_word: ταῖς ὁδοῖς αὐτῶν
  choice: sa sarili nilang mga daan
  rationale: Pinananatili nito ang larawan ng “mga daan” at malinaw na ipinahahayag ang pagmamay-aring nasa αὐτῶν nang hindi tahasang pinapalitan ang metapora ng “pamumuhay.”
theological_decisions:
- issue: Pagpapahintulot ng Diyos laban sa pagsang-ayon niya
  choice: “hinayaan”
  alternative: “sinang-ayunan” o “itinalagang”
  rationale: Ang εἴασεν ay nagsasaad ng pagpapahintulot. Hindi sinasabi ng talata na sinang-ayunan ng Diyos ang mga daan ng mga bansa o na siya ang tuwirang nagtakda sa mga iyon; pinananatili ng salin ang tensiyon sa pagitan ng kapamahalaan ng Diyos at pananagutan ng tao.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinanatili ang biblikal na metapora ng paglakad sa mga daan; ginamit ang “salinlahi” bilang pormal ngunit karaniwang nauunawaang katumbas ng γενεαί.
