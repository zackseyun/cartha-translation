  text: παραγενόμενοι δὲ καὶ συναγαγόντες τὴν ἐκκλησίαν ⸀ἀνήγγελλον ὅσα ἐποίησεν ὁ θεὸς μετ’ αὐτῶν καὶ ὅτι ἤνοιξεν τοῖς ἔθνεσιν θύραν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/027.yaml
  text: And when they arrived and gathered the church together[a], they reported all that God had done with them[b], and that he had opened a door of faith to the Gentiles.
translation:
  language: tl
  text: Pagdating nila, tinipon nila ang iglesya at isinalaysay ang lahat ng ginawa ng Diyos kasama nila[a], at na binuksan niya para sa mga Hentil[b] ang pintuan ng pananampalataya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ginawa ng Diyos sa pamamagitan nila.” Mas literal sa Griyego ang “kasama nila.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “para sa mga bansa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  choice: Pagdating nila
  rationale: Likas na Filipino para sa aorist participle na nagsasaad ng pangyayaring nauna sa pagtitipon.
- source_word: συναγαγόντες τὴν ἐκκλησίαν
  choice: tinipon nila ang iglesya
  rationale: Tumutukoy sa pagtawag at pagtitipon sa lokal na kapulungan ng mga mananampalataya; karaniwan at malinaw sa modernong Filipino ang “iglesya.”
- source_word: ἀνήγγελλον
  choice: isinalaysay
  rationale: Ang imperfect ay naglalarawan sa kanilang paglalahad ng nangyari. Ang “isinalaysay” ay angkop sa ulat tungkol sa misyon at hindi labis na pormal.
- source_word: ὅσα
  choice: ang lahat ng
  rationale: Natural na Filipino para sa kabuuan ng mga bagay na iniulat.
- source_word: ἐποίησεν ὁ θεὸς μετ’ αὐτῶν
  choice: ginawa ng Diyos kasama nila
  rationale: Pinananatili ang literal at sadyang bukas na diwa ng μετά na “kasama,” sa halip na tiyaking instrumental ang kahulugan bilang “sa pamamagitan nila.”
- source_word: ἤνοιξεν
  choice: binuksan niya
  rationale: Direktang inilalarawan ang natapos na pagkilos ng Diyos; sapat na sa Filipino ang aspektong ipinakikita ng pandiwa nang walang hiwalay na pluperfect.
- source_word: τοῖς ἔθνεσιν
  choice: para sa mga Hentil
  rationale: Sa konteksto ng Mga Gawa, tumutukoy ito sa mga hindi Judio, hindi pangunahin sa mga bansang pampolitika.
- source_word: θύραν πίστεως
  choice: ang pintuan ng pananampalataya
  rationale: Pinananatili ang metapora at ang bukas na ugnayang genitibo sa halip na ipaliwanag nang labis bilang pagkakataong manampalataya.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Karaniwan at angkop na salin ng πίστις sa kontekstong ito.
theological_decisions:
- issue: Kahulugan ng μετ’ αὐτῶν sa pagkilos ng Diyos
  choice: ginawa ng Diyos kasama nila
  alternative: ginawa ng Diyos sa pamamagitan nila; ginawa ng Diyos sa piling nila
  rationale: Ang Diyos ang malinaw na gumagawa, ngunit hindi nilulutas ng salin kung ang mga apostol ay instrumento, kasamang gumagawa, o mga taong kapiling niya sa pagkilos. Pinananatili nito ang pag-iingat ng Griyego.
- issue: Pagpapakahulugan sa ἔθνεσιν
  choice: mga Hentil
  alternative: mga bansa
  rationale: Sa salaysay, nangingibabaw ang pagkakaiba ng mga Judio at hindi Judio. Inihahatid ng “mga Hentil” ang puwersang ito nang hindi ginagawang mga estadong pampolitika ang tinutukoy.
- issue: Metapora ng θύραν πίστεως
  choice: pintuan ng pananampalataya
  alternative: pintuan para sa pananampalataya; pagkakataong manampalataya
  rationale: Pinananatili ang mismong metapora at hindi nililimitahan kung ang pananampalataya ay daan ng pagpasok, larangang binuksan, o tugong naging posible.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “iglesya,” “mga Hentil,” at “pananampalataya” bilang pamilyar na bokabularyong biblikal, habang pinanatili ang metapora at ang tunay na kalabuan ng μετ’ αὐτῶν.
