  text: ἐκάλουν τε ⸀τὸν Βαρναβᾶν Δία, τὸν δὲ Παῦλον Ἑρμῆν, ἐπειδὴ αὐτὸς ἦν ὁ ἡγούμενος τοῦ λόγου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/012.yaml
  text: And they were calling Barnabas Zeus[a], and Paul Hermes[b], because he was the chief speaker.
translation:
  language: tl
  text: Tinatawag nilang Zeus[a] si Bernabe, at Hermes naman si Pablo, sapagkat siya ang pangunahing tagapagsalita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang ilang tradisyonal na salin ay gumagamit ng “Jupiter” at “Mercury,” na mga Romanong pangalan ng mga diyos na ito; “Zeus” at “Hermes” ang nasa tekstong Griyego.
    reason: alternative_reading
  - marker: b
    text: 'Sa mas literal na anyo: “siya ang nangunguna sa pananalita” o “siya ang nangunguna sa pagsasalita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλουν
  choice: Tinatawag nila
  rationale: Ang aspektong imperpektibo ay nagpapakita ng nagpapatuloy na pagtawag o pagkilala ng mga tao; natural itong naipahahayag sa Filipino sa pamamagitan ng “tinatawag nila.”
- source_word: τε
  choice: at
  rationale: Banayad nitong iniuugnay ang pangungusap sa naunang salaysay; ang “at” ay natural na pang-ugnay sa Filipino.
- source_word: Δία
  choice: Zeus
  rationale: Tuwirang binabanggit ng tekstong Griyego ang pangalang Zeus, kaya hindi ito pinalitan ng katumbas na Romanong Jupiter.
- source_word: Ἑρμῆν
  choice: Hermes
  rationale: Tuwirang binabanggit ng tekstong Griyego ang pangalang Hermes, kaya hindi ito pinalitan ng katumbas na Romanong Mercury.
- source_word: ἐπειδὴ
  choice: sapagkat
  rationale: Malinaw at marangal na panandang sanhi ito, na nagpapaliwanag kung bakit itinuring ng mga tao si Pablo na si Hermes.
- source_word: αὐτὸς
  choice: siya
  rationale: Tumutukoy ito kay Pablo at bahagyang itinatangi siya kay Bernabe; sapat at natural ang “siya” sa konteksto.
- source_word: ὁ ἡγούμενος τοῦ λόγου
  choice: ang nangunguna sa pagsasalita
  rationale: Pinananatili nito ang larawan ng taong nangunguna o may pangunahing papel sa pagsasalita, nang hindi ginagawang teknikal na titulo ang parirala.
theological_decisions:
- issue: Mga pangalan ng mga paganong diyos
  choice: Zeus at Hermes sa pangunahing teksto
  alternative: Jupiter at Mercury
  rationale: Iniuulat lamang ng talata ang pagkilala ng mga taga-Listra kina Bernabe at Pablo. Ang mga pangalang Griyego ang nasa pinagmulang teksto, kaya hindi ipinalit ang tradisyonal na mga pangalang Romano.
- issue: Kahulugan ng ὁ ἡγούμενος τοῦ λόγου
  choice: ang nangunguna sa pagsasalita
  alternative: ang pangunahing tagapagsalita
  rationale: Ang piniling salin ay nagpapanatili sa kilos ng “pangunguna” at sa posibleng literal na ugnayan nito sa “pagsasalita,” sa halip na gawing isang tiyak na opisyal na tungkulin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang baybay na “Bernabe,” habang pinanatili ang orihinal na mga pangalang Griyego na “Zeus” at “Hermes.”
