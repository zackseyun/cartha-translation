- from: Kahit sinabi nila ang mga bagay na ito, bahagya pa rin nilang napigilan ang mga tao na maghandog sa kanila.
  to: Sa kabila ng mga salitang ito, halos hindi nila napigilan ang mga tao na maghandog sa kanila.
  rationale: 'Pinalitan ang pariralang maaaring maging malabo sa Filipino upang malinaw na maipahayag ang μόλις (“halos hindi”). Inayos din ang pambungad upang likas na maihatid ang concessive na diwa ng καὶ ταῦτα λέγοντες. Pinanatili ang saklaw at ambiguity ng orihinal: hindi tinutukoy kung ano ang ihahandog, at ang “sa kanila” ay nananatiling tumutukoy kina Pablo at Bernabe ayon sa konteksto.'
