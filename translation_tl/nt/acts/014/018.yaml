  yaml_path: translation/nt/acts/014/018.yaml
  text: Even by saying these things, they barely restrained the crowds from sacrificing to them.
translation:
  language: tl
  text: Sa kabila ng mga salitang ito, halos hindi nila napigilan ang mga tao na maghandog sa kanila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ταῦτα λέγοντες
  choice: Kahit sinabi nila ang mga bagay na ito
  rationale: 'Sa konteksto, ang καί ay may concessive na diwa: kahit matapos ang mariing paliwanag, nahirapan pa rin silang pigilan ang mga tao. Pinananatili rin ng ''mga bagay na ito'' ang sanggunian sa naunang sinabi.'
- source_word: μόλις κατέπαυσαν
  choice: bahagya pa rin nilang napigilan
  rationale: Ipinahahayag ng μόλις na muntik nang hindi magtagumpay ang pagpigil; natural sa Filipino ang 'bahagya pa rin' habang pinananatili ang diin ng Griyego.
- source_word: τοὺς ὄχλους
  choice: ang mga tao
  rationale: Ang maramihang ὄχλους ay tumutukoy sa nagkakatipong madla; sa kasalukuyang Filipino, mas natural dito ang 'mga tao' kaysa sa mas pormal na 'mga pulutong.'
- source_word: τοῦ μὴ θύειν αὐτοῖς
  choice: na maghandog sa kanila
  rationale: Ang θύειν ay paghahandog ng hayop bilang sakripisyo sa kontekstong panrelihiyon. Sapat ang 'maghandog' sa agarang konteksto, at malinaw na sina Pablo at Bernabe ang tinutukoy ng 'sa kanila.'
theological_decisions:
- issue: Uri ng paghahandog na tinangkang gawin ng mga tao
  choice: maghandog sa kanila
  alternative: maghain sa kanila
  rationale: Kapuwa posible ang 'maghandog' at 'maghain.' Pinili ang mas karaniwang 'maghandog' nang hindi binabawasan ang panrelihiyong diwa ng θύειν, na malinaw mula sa konteksto ng mga talata 13–18.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Iniwasan ang labis na literal na ayos ng pangungusap, ngunit pinanatili ang concessive na diin at ang ideyang halos hindi nila napigil ang madla.
