    issue: Hindi sapat na malinaw ang “bahagya pa rin nilang napigilan.”
    rationale: Ang μόλις ay nagsasaad na halos hindi nagtagumpay ang pagpigil. Sa Filipino, maaaring unawain ang “bahagya nilang napigilan” bilang limitadong antas ng pagpigil, hindi bilang napakahirap na pagpigil.
  - severity: low
    issue: Ang “Kahit sinabi nila” ay bahagyang nagpapahiwatig ng natapos na pagsasalita.
    rationale: Ang λέγοντες ay participle na kaugnay ng pangunahing kilos; ang “Sa kabila ng mga salitang ito” ay mas natural na pinananatili ang concessive na ugnayan nang hindi binibigyang-diin ang pagkakasunod matapos magsalita.
  revised_text: Sa kabila ng mga salitang ito, halos hindi nila napigilan ang mga tao na maghandog sa kanila.
