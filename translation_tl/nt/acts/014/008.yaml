revisions:
- from: Sa Listra ay may isang lalaking nakaupo na walang lakas ang mga paa.[a] Pilay na siya mula pa sa sinapupunan ng kanyang ina at hindi pa siya kailanman nakalakad.
  to: At sa Listra ay may isang lalaking nakaupo, na walang lakas sa mga paa.[a] Pilay siya mula pa sa sinapupunan ng kanyang ina at hindi kailanman nakalakad.
  rationale: Inayos ang idyoma para sa likas na Filipino at pinalitan ang “hindi pa ... kailanman” ng “hindi kailanman” upang ganap na maipahayag ang οὐδέποτε. Pinanatili ang magkahiwalay na paglalarawan ng kawalan ng lakas at pagkapilay, gayundin ang kahulugang mula sa sinapupunan ng ina.
