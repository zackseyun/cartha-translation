base_translation:
  language: en
  yaml_path: translation/nt/acts/014/008.yaml
  text: And in Lystra a certain man was sitting[a], powerless in his feet, lame from his mother's womb, who had never walked.
translation:
  language: tl
  text: At sa Listra ay may isang lalaking nakaupo, na walang lakas sa mga paa.[a] Pilay siya mula pa sa sinapupunan ng kanyang ina at hindi kailanman nakalakad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mahina ang kanyang mga paa.” Binibigyang-diin muna ng Griyego ang kawalan ng lakas bago tahasang sabihing pilay siya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: Sa Listra ay
  rationale: Hindi kailangang tumbasan nang hiwalay ang simpleng pang-ugnay na Καί; ang tuwirang pagsisimula sa tagpuan ay likas na pagpapatuloy ng salaysay sa Tagalog.
- source_word: τις ἀνὴρ
  choice: may isang lalaki
  rationale: Likas na ipinakikilala nito ang isang tiyak ngunit hindi pinangalanang lalaki, nang hindi gumagamit ng di-likas na “isang partikular na lalaki.”
- source_word: ἀδύνατος ... τοῖς ποσίν
  choice: walang lakas ang mga paa
  rationale: Pinananatili ang pangunahing diwa ng kawalan ng lakas o kakayahan sa mga paa at hindi ito isinasanib agad sa kasunod na χωλός, na tahasang nagsasabing pilay siya.
- source_word: ἐν Λύστροις
  choice: Sa Listra
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan ng lugar at inilagay ito sa unahan upang natural na maitakda ang tagpo.
- source_word: ἐκάθητο
  choice: nakaupo
  rationale: Ang aspektong imperpektibo ay naglalarawan sa nagpapatuloy na kalagayan ng lalaki sa tagpo; sapat at natural dito ang “nakaupo.”
- source_word: χωλός
  choice: Pilay
  rationale: Direkta at karaniwang salitang Filipino ito para sa pisikal na kalagayang inilalarawan ng Griyego.
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: mula pa sa sinapupunan ng kanyang ina
  rationale: Pinananatili ang matingkad na idyoma ng pinagmulang wika sa halip na paikliin lamang bilang “mula nang ipanganak.”
- source_word: οὐδέποτε περιεπάτησεν
  choice: hindi pa siya kailanman nakalakad
  rationale: Ipinahahayag ang buong buhay na kawalan ng karanasang makalakad hanggang sa sandaling iyon.
