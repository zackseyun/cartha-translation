  to: at sinasabi, “Mga ginoo, bakit ninyo ginagawa ang mga bagay na ito? Tao rin kaming katulad ninyo. Ipinapahayag namin sa inyo ang mabuting balita upang talikuran ninyo ang mga bagay na walang kabuluhan[b] at bumaling sa Diyos na buháy, na gumawa ng langit[a], lupa, dagat, at lahat ng nasa mga ito.”
