    issue: Hindi likas at malabo ang “Mga tao rin kami na tulad ninyo ang kalagayan.”
    rationale: Bagaman tama ang nilalayong diwa ng ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, may suliranin sa balarila at daloy ng Tagalog. Ang “Tao rin kaming katulad ninyo” ay natural at malinaw na nagpapatibay na sila rin ay mga tao.
  - severity: low
    issue: Hindi sapat na malinaw ang “lahat ng naroon.”
    rationale: Ang πάντα τὰ ἐν αὐτοῖς ay tumutukoy sa lahat ng nasa langit, lupa, at dagat. Ang “lahat ng nasa mga ito” ay pinananatili ang maramihang reperensiya at iniiwasan ang malabong “naroon.”
  - severity: low
    issue: Mas idiomatiko ang ayos na “mga bagay na walang kabuluhan.”
    rationale: Pareho ang kahulugan sa “mga walang-kabuluhang bagay,” ngunit ang binagong ayos ay mas karaniwan at mas magaan sa modernong Tagalog.
