id: ACT.14.15
reference: Acts 14:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ἄνδρες, τί ταῦτα ποιεῖτε; καὶ ἡμεῖς ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων ἐπιστρέφειν ἐπὶ ⸀θεὸν ζῶντα ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/015.yaml
  text: and saying[a], “Men, why are you doing these things? We also are men with the same nature as you, bringing you good news to turn from these worthless things to the living God[c][b], who made the heaven and the earth and the sea and everything in them.”
translation:
  language: tl
  text: at sinasabi, “Mga ginoo, bakit ninyo ginagawa ang mga bagay na ito? Tao rin kaming katulad ninyo. Ipinapahayag namin sa inyo ang mabuting balita upang talikuran ninyo ang mga bagay na walang kabuluhan[b] at bumaling sa Diyos na buháy, na gumawa ng langit[a], lupa, dagat, at lahat ng nasa mga ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kalangitan.” Pang-isahan ang salitang Griyego at bahagi ito ng pamilyar na pormula tungkol sa paglalang.
    reason: lexical_alternative
  - marker: b
    text: Sa konteksto, ang “mga bagay na walang kabuluhan” ay tumutukoy sa walang-saysay na paganong pagsamba, kabilang ang mga diyus-diyosan.
    reason: cultural_note
lexical_decisions:
- source_word: Ἄνδρες
  choice: Mga ginoo
  rationale: Magalang at natural na tuwirang tawag sa mga lalaking kaharap; iniiwasan ang di-likas na literal na “Mga lalaki.”
- source_word: ὁμοιοπαθεῖς ... ἄνθρωποι
  choice: Mga tao rin kami na tulad ninyo ang kalagayan
  rationale: Ipinahahayag ang magkatulad na kalagayang pantao nina Pablo at Bernabe at ng mga nakikinig, hindi lamang pagkakatulad ng damdamin.
- source_word: εὐαγγελιζόμενοι
  choice: Ipinapahayag namin sa inyo ang mabuting balita
  rationale: Pinananatili ang pandiwang diwa ng paghahayag ng mabuting balita sa malinaw at kasalukuyang Tagalog.
- source_word: ματαίων
  choice: mga walang-kabuluhang bagay
  rationale: Sinasalamin ang kahulugang walang saysay, hungkag, o walang pakinabang nang hindi nililimitahan ang salita sa mga diyus-diyosan lamang.
- source_word: ἐπιστρέφειν
  choice: upang talikuran ... at bumaling
  rationale: Natural na inilalahad sa Tagalog ang pagtalikod mula sa isang bagay at pagbaling patungo sa iba; ang “upang” ay nagpapakita ng layunin ng paghahayag.
- source_word: ἐπὶ θεὸν ζῶντα
  choice: sa Diyos na buháy
  rationale: Ipinakikita ang kilos patungo sa Diyos at ang kaibahan niya sa mga diyus-diyosang walang buhay.
- source_word: ἐποίησεν
  choice: gumawa
  rationale: Tuwirang katumbas ng ποιέω at angkop sa pormulang nagsasaad ng paglalang.
- source_word: τὸν οὐρανὸν
  choice: langit
  rationale: Natural na katumbas ng pang-isahang οὐρανός sa pormula ng paglalang; maaaring maunawaan din bilang kalangitan.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: lahat ng naroon
  rationale: Maikli at natural na saklaw ang lahat ng nasa langit, lupa, at dagat.
theological_decisions:
- issue: Kalagayang pantao nina Pablo at Bernabe laban sa pagbibigay sa kanila ng karangalang banal
  choice: Mga tao rin kami na tulad ninyo ang kalagayan
  alternative: Mga tao rin kaming likas na katulad ninyo
  rationale: Malinaw na itinatanggi na sila ay mga diyos habang pinananatili ang malawak na diwa ng iisang kalagayang pantao, hindi lamang magkatulad na emosyon.
- issue: Saklaw ng ματαίων
  choice: mga walang-kabuluhang bagay
  alternative: mga diyus-diyosan
  rationale: Bagaman paganong pagsamba at mga diyus-diyosan ang agarang konteksto, mas malawak ang salitang Griyego; pinananatili ito sa pangunahing teksto at nililinaw sa talababa.
- issue: Pagbaling sa Diyos na buháy
  choice: talikuran ... at bumaling sa Diyos na buháy
  alternative: magbalik-loob ... sa Diyos na buháy
  rationale: Iniiwasan ang posibleng palagay na dati na nilang sinasamba ang Diyos na ito at malinaw na inilalarawan ang pagtalikod at bagong direksiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Mga ginoo” bilang natural na panawagan sa mga lalaking kausap. Nilagyan ng tuldok ang pahayag tungkol sa kanilang pagkatao upang maiwasan ang mabigat na sunod-sunod na sugnay. Ang mga markang [a] at [b] ay kapuwa nasa pangunahing teksto.
