id: ACT.14.21
reference: Acts 14:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εὐαγγελισάμενοί τε τὴν πόλιν ἐκείνην καὶ μαθητεύσαντες ἱκανοὺς ὑπέστρεψαν εἰς τὴν Λύστραν καὶ ⸀εἰς Ἰκόνιον καὶ ⸁εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/021.yaml
  text: And after proclaiming the good news in that city and making many disciples[a], they returned to Lystra and to Iconium and to Antioch,
translation:
  language: tl
  text: Matapos nilang ipahayag ang magandang balita sa lungsod na iyon at gawing mga alagad ang maraming tao, bumalik sila sa Listra, sa Iconio, at sa Antioquia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐαγγελισάμενοί
  choice: Matapos nilang ipahayag ang magandang balita
  rationale: Ipinahahayag ng aorist participle ang kilos na nauna sa pangunahing pandiwang ὑπέστρεψαν. Likas at malinaw sa makabagong Tagalog ang “ipahayag ang magandang balita,” nang hindi umaasa sa mas teknikal na salitang “ebanghelyo.”
- source_word: τε
  choice: at
  rationale: Bahagyang nag-uugnay ang τε sa mga kilos sa pangungusap; ang “at” ang likas na katumbas sa Tagalog.
- source_word: τὴν πόλιν ἐκείνην
  choice: sa lungsod na iyon
  rationale: Tuwirang salin ng pariralang tumutukoy sa Derbe sa naunang konteksto.
- source_word: μαθητεύσαντες
  choice: gawing mga alagad
  rationale: 'Pinananatili nito ang aktibong diwa ng pandiwa: ang pag-akay sa mga tao upang maging mga alagad, hindi lamang ang pagtuturo sa mga dati nang alagad.'
- source_word: ἱκανοὺς
  choice: ang maraming tao
  rationale: Sa kontekstong ito, tumutukoy ang ἱκανός sa malaking bilang. Idinagdag ang “tao” bilang likas na ipinahihiwatig na layon sa Tagalog.
- source_word: ὑπέστρεψαν
  choice: bumalik sila
  rationale: Malinaw na pangunahing pandiwa ito na nagsasaad ng kanilang pagbabalik sa mga naunang lugar.
- source_word: εἰς τὴν Λύστραν καὶ εἰς Ἰκόνιον καὶ εἰς Ἀντιόχειαν
  choice: sa Listra, sa Iconio, at sa Antioquia
  rationale: Ang inuulit na “sa” ay nagpapanatili sa magkakahiwalay na mga destinasyon at sa maindayog na pagkakasunod ng Griyego.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong Filipino ng mga pangalang Listra, Iconio, at Antioquia. Pinanatili ang pagkakasunod ng dalawang naunang kilos bago ang pagbabalik.
