  source_fidelity: Tumpak na naipapahayag ng salin ang dalawang aorist participle bilang mga kilos na naganap bago ang pangunahing kilos na “bumalik sila.” Napananatili ang kahulugan ng εὐαγγελισάμενοι bilang pagpapahayag ng mabuting balita, ng μαθητεύσαντες bilang aktibong paggawa ng mga alagad, ng ἱκανούς bilang marami, at ang magkakasunod na tatlong destinasyon.
  naturalness: Likas at malinaw ang daloy sa makabagong Filipino. Ang “Matapos nilang ipahayag ... at gawing mga alagad ang maraming tao, bumalik sila ...” ay maayos na pangungusap at ang pag-uulit ng “sa” ay malinaw na naghihiwalay sa mga destinasyon.
  terminology: Ang “magandang balita” ay katanggap-tanggap na makabagong katumbas ng εὐαγγέλιον sa pandiwang anyo at hindi nawawala ang ebanghelisador na diwa sa konteksto. Ang “mga alagad” ay wastong katumbas ng μαθηταί. Ang mga anyong Listra, Iconio, at Antioquia ay karaniwang Filipino.
