  text: But the Jews who were disobedient stirred up the Gentiles and poisoned their minds against the brothers[a][b][c].
translation:
  language: tl
  text: Ngunit ang mga Judiong tumangging maniwala[a] ay sinulsulan ang mga Hentil at nilason ang kanilang kalooban[b] laban sa mga kapatid.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sumuway” o “naging masuwayin.” Maaaring tumukoy ang salitang Griyego sa pagtangging paniwalaan ang mensahe; sa kontekstong ito, malamang na ang tinutukoy ay ang pagtanggi sa mabuting balita.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “ang kanilang mga kaluluwa”; dito, ang diwa ay ang kanilang panloob na saloobin o kalooban.
    reason: lexical_alternative
  - marker: c
    text: Ang “mga kapatid” dito ay malamang na tumutukoy sa mga kapwa mananampalataya sa pangkalahatan, kabilang ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειθήσαντες
  choice: tumangging maniwala
  rationale: Sa kontekstong misyonero ng Mga Gawa, ipinahihiwatig nito ang sadyang hindi pagtanggap sa ipinahayag na mensahe; pinananatili ng “tumangging maniwala” ang diwa ng kapuwa kawalan ng pananampalataya at pagtutol.
- source_word: Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Tumutukoy ito sa partikular na mga Judiong sumalungat sa mensahe sa lokal na sinagoga, hindi sa lahat ng Judio.
- source_word: ἐπήγειραν
  choice: sinulsulan
  rationale: Natural na Filipino ito para sa pag-udyok sa iba tungo sa masamang saloobin o pagkilos.
- source_word: ἐκάκωσαν
  choice: nilason
  rationale: Kasama ng τὰς ψυχὰς at κατὰ, inilalarawan ng pandiwa ang pagpapasama o pagpapapoot ng panloob na saloobin; malinaw at matalinghaga itong naihahatid ng “nilason.”
- source_word: τὰς ψυχὰς
  choice: ang kanilang kalooban
  rationale: Dito, ang ψυχή ay tumutukoy sa panloob na saloobin o disposisyon, hindi sa isang teknikal na konsepto ng kaluluwa.
- source_word: τῶν ἐθνῶν
  choice: ang mga Hentil
  rationale: Sa paghahambing ng mga Judio at mga hindi Judio sa Mga Gawa, karaniwang tumutukoy ang ἔθνη sa mga Hentil.
- source_word: κατὰ τῶν ἀδελφῶν
  choice: laban sa mga kapatid
  rationale: Malapit ito sa anyo ng Griyego at natural sa wikang Kristiyanong Filipino; sa konteksto, malamang na kolektibong tumutukoy ito sa mga kapwa mananampalataya.
theological_decisions:
- issue: Saklaw ng ἀδελφῶν bilang pantukoy sa pamayanang Kristiyano
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae; mga mananampalataya
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, maaaring kolektibo itong tumukoy sa buong pamayanan ng mga mananampalataya. Pinananatili ng “mga kapatid” ang anyo at likas na inklusibong gamit sa Filipino, habang nililinaw ang saklaw sa talababa.
- issue: Kahulugan ng ἀπειθήσαντες
  choice: tumangging maniwala
  alternative: sumuway; naging masuwayin; hindi naniwala
  rationale: Hindi tahasang binabanggit ang layon sa Griyego, ngunit sa agarang konteksto ang pagtutol ay sa ipinangangaral na mensahe. Pinananatili sa talababa ang mas pormal na posibilidad na “sumuway.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kalooban” sa halip na literal na “kaluluwa” upang maipahayag ang panloob na disposisyon, at pinanatili ang matalinghagang “nilason” dahil natural itong naglalarawan ng pagpapasama ng saloobin.
