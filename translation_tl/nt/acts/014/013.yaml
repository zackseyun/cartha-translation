  text: ὅ ⸀τε ἱερεὺς τοῦ Διὸς τοῦ ὄντος πρὸ τῆς ⸀πόλεως ταύρους καὶ στέμματα ἐπὶ τοὺς πυλῶνας ἐνέγκας σὺν τοῖς ὄχλοις ἤθελεν θύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/013.yaml
  text: And the priest of Zeus[a], whose temple was before the city[b], brought bulls and wreaths to the gates and wanted to offer sacrifice with the crowds.
translation:
  language: tl
  text: At ang pari ni Zeus, na ang templo ay nasa labas ng lungsod[a], ay nagdala ng mga toro at mga putong[b] sa mga pintuang-daan, at kasama ng mga tao ay nais niyang maghandog ng hain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “si Zeus na nasa harap ng lungsod”; malamang na ang ibig sabihin ay ang templo o dambana ni Zeus na nasa labas ng lungsod.
    reason: alternative_reading
  - marker: b
    text: O, “mga garlanda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅ τε
  choice: At
  rationale: Likas na ipinagpapatuloy ng “At” ang salaysay nang hindi dinaragdagan ang puwersa ng pang-ugnay.
- source_word: ἱερεὺς τοῦ Διὸς
  choice: ang pari ni Zeus
  rationale: Pinananatili ang Griyegong pangalan na Zeus sa halip na gamitin ang Romanong katumbas na Jupiter.
- source_word: τοῦ ὄντος πρὸ τῆς πόλεως
  choice: na ang templo ay nasa labas ng lungsod
  rationale: Sa konteksto, tumutukoy ang parirala sa santuwaryo o templo ni Zeus na nasa harap ng lungsod, samakatuwid ay nasa labas nito. Ipinahayag ang ipinahihiwatig na “templo” upang maging malinaw sa natural na Tagalog.
- source_word: ταύρους
  choice: mga toro
  rationale: Tuwirang katumbas ito ng ταῦρος at angkop sa konteksto ng paghahain.
- source_word: στέμματα
  choice: mga putong
  rationale: Tumutukoy ito sa mga seremonyal na putong o kuwintas na ginagamit sa prusisyon ng paghahain; maikli at marangal ang “mga putong.”
- source_word: ἐπὶ τοὺς πυλῶνας
  choice: sa mga pintuang-daan
  rationale: Pinananatili ang anyong maramihan at malinaw na ipinapakita ang patutunguhan ng dinala.
- source_word: ἐνέγκας
  choice: nagdala
  rationale: Natural na isinasalaysay sa Tagalog bilang kilos na nagsisilbing kaligiran ng pangunahing layuning maghandog.
- source_word: σὺν τοῖς ὄχλοις
  choice: kasama ng mga tao
  rationale: Ipinahahayag na kasabay at kasang-ayon ng nagkakatipong mga tao ang pari; mas natural ito kaysa sa literal ngunit matigas na “kasama ng mga pulutong.”
- source_word: ἤθελεν θύειν
  choice: nais niyang maghandog ng hain
  rationale: Pinananatili ang diwa ng hangarin at ang panrelihiyong kahulugan ng θύω, hindi lamang ang pagkatay ng hayop.
theological_decisions:
- issue: Ipinahihiwatig na tinutukoy ng τοῦ ὄντος πρὸ τῆς πόλεως
  choice: Ang parirala ay inunawang tumutukoy sa templo ni Zeus na nasa labas ng lungsod.
  alternative: Maaaring isalin nang mas literal bilang “si Zeus na nasa harap ng lungsod,” na tuwirang inuugnay ang parirala kay Zeus.
  rationale: Karaniwang nakikilala ang isang diyos noong sinaunang panahon ayon sa kinaroroonan ng kaniyang templo, at akma ito sa konteksto ng pari at paghahain. Gayunman, pinananatili sa talababa ang literal na anyo at ang kaakibat nitong kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pari,” “templo,” at “maghandog ng hain” bilang karaniwang nauunawaang mga salitang panrelihiyon, habang iniwasan ang sobrang literal at hindi likas na ayos ng pangungusap.
