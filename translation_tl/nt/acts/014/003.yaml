revisions:
- from: Kaya nanatili sila roon nang mahabang panahon, at buong tapang na nagsalita para sa Panginoon,[a] na nagpapatotoo sa mensahe ng kanyang biyaya sa pamamagitan ng pagkakaloob na maganap ang mga tanda at mga kababalaghan sa pamamagitan ng kanilang mga kamay.
  to: Kaya nanatili sila roon nang mahabang panahon at nagsalita nang buong tapang para sa Panginoon,[a] na nagpapatotoo sa mensahe ng kanyang biyaya at nagkakaloob ng mga tanda at mga kababalaghan na maganap sa pamamagitan ng kanilang mga kamay.
  rationale: Inayos ang sintaks upang malinaw na kapwa ang pagpapatotoo sa mensahe at ang pagkakaloob ng mga tanda at kababalaghan ay mga kilos ng Panginoon. Inayos din ang talababa upang mapanatili ang kalabuan ng ἐπὶ τῷ κυρίῳ nang hindi magmumungkahing ang Panginoon ang tuwirang kausap. Walang idinagdag na pagkakakilanlan sa “Panginoon” o interpretasyong doktrinal.
