id: ACT.14.3
reference: Acts 14:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἱκανὸν μὲν οὖν χρόνον διέτριψαν παρρησιαζόμενοι ἐπὶ τῷ κυρίῳ τῷ μαρτυροῦντι ⸀τῷ λόγῳ τῆς χάριτος αὐτοῦ, διδόντι σημεῖα καὶ τέρατα γίνεσθαι διὰ τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/003.yaml
  text: So they stayed there a considerable time[a], speaking boldly for the Lord, who was bearing witness to the word of his grace, granting signs and wonders to be done through their hands.
translation:
  language: tl
  text: Kaya nanatili sila roon nang mahabang panahon at nagsalita nang buong tapang para sa Panginoon,[a] na nagpapatotoo sa mensahe ng kanyang biyaya at nagkakaloob ng mga tanda at mga kababalaghan na maganap sa pamamagitan ng kanilang mga kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagsalita nang buong tapang sa kaugnayan sa Panginoon” o “nang may pagtitiwala sa Panginoon.” Maaaring idiin ng pariralang Griyego na ang kanilang tapang ay nakabatay sa Panginoon o isinasagawa sa kaugnayan sa kanya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἱκανὸν ... χρόνον
  choice: nang mahabang panahon
  rationale: Ipinahihiwatig ng idyoma ang mahaba o kapansin-pansing tagal; natural at malinaw ito sa modernong Tagalog nang hindi nagtatakda ng eksaktong haba.
- source_word: διέτριψαν
  choice: nanatili sila roon
  rationale: Ipinapahayag ng pandiwa ang pananatili o paggugol ng panahon sa isang lugar; nililinaw ng “roon” ang konteksto ng salaysay.
- source_word: παρρησιαζόμενοι
  choice: buong tapang na nagsalita
  rationale: Pinananatili nito ang diwa ng hayag at walang-takot na pagsasalita.
- source_word: ἐπὶ τῷ κυρίῳ
  choice: para sa Panginoon
  rationale: Natural itong nagpapahayag na ang kanilang matapang na pagsasalita ay kaugnay ng paglilingkod sa Panginoon, habang inilalagay sa talababa ang posibleng diwa ng batayan, pagtitiwala, o saklaw.
- source_word: τῷ κυρίῳ
  choice: Panginoon
  rationale: Pinananatili ang titulong nasa Griyego nang hindi idinaragdag ang pangalang “Jesus,” na wala rito sa mismong teksto.
- source_word: τῷ μαρτυροῦντι
  choice: na nagpapatotoo
  rationale: Ang kasalukuyang pandiwari ay naglalarawan sa patuloy na pagpapatunay ng Panginoon sa panahon ng kanilang ministeryo.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: sa mensahe ng kanyang biyaya
  rationale: Ang λόγος ay tumutukoy rito sa ipinahahayag na mensahe; pinananatili ng “ng kanyang biyaya” ang siksik at maaaring may higit sa isang ugnayang diwa ng genitive.
- source_word: χάριτος
  choice: biyaya
  rationale: Karaniwan at teolohikal na mabigat na katumbas ito ng χάρις sa modernong Tagalog.
- source_word: διδόντι
  choice: sa pamamagitan ng pagkakaloob
  rationale: Ipinakikita nitong ang Panginoon ang nagbibigay ng kakayahan o pahintulot upang maganap ang mga himalang nagpapatunay sa mensahe.
- source_word: σημεῖα καὶ τέρατα
  choice: mga tanda at mga kababalaghan
  rationale: 'Pinananatili ang nakaugaliang biblikal na pares: ang mga gawa ay kapuwa nagpapahiwatig ng kahulugan at pumupukaw ng pagkamangha.'
- source_word: γίνεσθαι
  choice: maganap
  rationale: Natural sa Tagalog at hindi labis na itinatakda kung ang diin ay nasa paggawa o sa pangyayari ng mga tanda at kababalaghan.
- source_word: διὰ τῶν χειρῶν αὐτῶν
  choice: sa pamamagitan ng kanilang mga kamay
  rationale: Pinananatili ang konkretong idyomang Griyego at ang instrumental na papel ng mga apostol.
theological_decisions:
- issue: Tinutukoy ng “Panginoon”
  choice: Isinalin lamang na “Panginoon.”
  alternative: “Panginoong Jesus” o “Diyos”
  rationale: τῷ κυρίῳ lamang ang nasa Griyego. Hindi dapat idagdag ang espesipikong pagkakakilanlan na hindi tahasang binanggit, kahit malamang na tumutukoy ang konteksto sa muling nabuhay na si Jesus.
- issue: Diwa ng ἐπὶ τῷ κυρίῳ
  choice: “para sa Panginoon” sa pangunahing teksto
  alternative: “sa Panginoon,” “nang may pagtitiwala sa Panginoon,” o “na umaasa sa Panginoon”
  rationale: Maaaring ipahayag ng ἐπί na may dative ang batayan, pagtitiwala, o kaugnayan. Natural ang pangunahing salin, at pinananatili ng talababa ang tunay na kalabuan.
- issue: Ugnayan ng “mensahe” at “biyaya”
  choice: “mensahe ng kanyang biyaya”
  alternative: “kanyang mensaheng mapagbiyaya” o “mensahe tungkol sa kanyang biyaya”
  rationale: Hindi lubusang nilulutas ng salin kung ang genitive ay tumutukoy sa nilalaman, katangian, o pinagmulan ng mensahe.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “mensahe” para sa malinaw na kahulugan ng λόγος sa konteksto, “biyaya” bilang pamilyar na terminong biblikal, at pinanatili ang konkretong “sa pamamagitan ng kanilang mga kamay.”
