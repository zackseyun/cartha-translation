  yaml_path: translation/nt/acts/014/025.yaml
  text: And after speaking the word in Perga[a], they went down to Attalia,
translation:
  language: tl
  text: At matapos nilang ipahayag ang salita sa Perga, bumaba sila patungong Atalia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαλήσαντες
  choice: matapos nilang ipahayag
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa pangunahing pandiwa. Natural sa makabagong Tagalog ang “matapos nilang,” at sa konteksto ng pangangaral, ang “ipahayag” ay malinaw nang hindi kasing-tindi ng mas espesipikong “iproklama.”
- source_word: τὸν λόγον
  choice: ang salita
  rationale: Pinananatili nito ang paulit-ulit na sinaunang Kristiyanong katawagan para sa ipinangangaral na mensahe. Hindi idinagdag ang “ng Panginoon,” sapagkat wala iyon sa tekstong Griyego.
- source_word: ἐν Πέργῃ
  choice: sa Perga
  rationale: Ang ἐν kasama ng pangalan ng lungsod ay likas na isinasalin sa Tagalog bilang “sa.”
- source_word: κατέβησαν
  choice: bumaba sila
  rationale: Tuwirang pinananatili ang heograpikong diwa ng pagbaba mula sa panloob na Perga patungo sa baybaying Atalia.
- source_word: εἰς Ἀττάλειαν
  choice: patungong Atalia
  rationale: Natural na ipinahahayag ng “patungong” ang destinasyong tinutukoy ng εἰς.
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay na nagpapatuloy sa salaysay nang hindi nagdaragdag ng ibang temporal na diin.
theological_decisions: []
