  text: Κατήντησεν δὲ ⸀καὶ εἰς Δέρβην καὶ ⸀εἰς Λύστραν. καὶ ἰδοὺ μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος, υἱὸς ⸀γυναικὸς Ἰουδαίας πιστῆς, πατρὸς δὲ Ἕλληνος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/001.yaml
  text: He also came to Derbe and to Lystra[a]. And behold, a certain disciple was there named Timothy, the son of a believing Jewish woman, but of a Greek father[b],
translation:
  language: tl
  text: Dumating din siya sa Derbe at sa Listra. At narito, may isang alagad doon na nagngangalang Timoteo. Anak siya ng isang Judiong babaeng mananampalataya,[a] ngunit Griego ang kanyang ama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang Judiong babaeng tapat.” Ang salitang Griyego ay maaaring mangahulugang “mananampalataya” o “tapat”; sa kontekstong ito, mas malamang ang “mananampalataya.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Griego” rito ay tumutukoy sa etniko o kultural na pagkakakilanlan ng ama, hindi lamang sa mas malawak na katawagang “Hentil.”
    reason: lexical_clarification
lexical_decisions:
- source_word: Κατήντησεν
  choice: Dumating
  rationale: Ipinahahayag ng pandiwa ang pagdating sa isang lugar; natural at tuwiran ang “dumating” sa salaysay ng paglalakbay.
- source_word: δὲ καὶ
  choice: din
  rationale: Ipinakikita ang pagpapatuloy at karagdagang yugto ng paglalakbay nang hindi pinabibigat ang pang-ugnay.
- source_word: εἰς Δέρβην καὶ εἰς Λύστραν
  choice: sa Derbe at sa Listra
  rationale: Natural sa Filipino ang “sa” para sa patutunguhan; inulit ito upang bahagyang mapanatili ang estruktura ng Griyego.
- source_word: καὶ ἰδοὺ
  choice: At narito
  rationale: Pinananatili ang pantawag-pansing bisa ng ἰδού at ang kasiglahan ng salaysay.
- source_word: μαθητής τις ἦν ἐκεῖ
  choice: may isang alagad doon
  rationale: Natural na eksistensiyal na pahayag sa Filipino na pinananatili ang pagiging bagong ipinakilalang tao at ang lokasyong ipinahahayag ng ἐκεῖ.
- source_word: ὀνόματι Τιμόθεος
  choice: na nagngangalang Timoteo
  rationale: Karaniwan at marangal na paraan sa Filipino upang ipakilala ang pangalan.
- source_word: υἱὸς γυναικὸς Ἰουδαίας πιστῆς
  choice: Anak siya ng isang babaeng Judio na sumasampalataya
  rationale: Ang πιστή ay pinakamalamang na tumutukoy rito sa pagiging mananampalataya, ngunit inihahayag sa paraang malinaw at natural.
- source_word: πατρὸς δὲ Ἕλληνος
  choice: ngunit Griego ang kanyang ama
  rationale: Nililinaw sa natural na sintaks ng Filipino ang maikling eliptikong pariralang Griyego at pinananatili ang pagsalungat ng δέ.
theological_decisions:
- issue: Kahulugan ng πιστῆς bilang paglalarawan sa ina ni Timoteo
  choice: na sumasampalataya
  alternative: na tapat
  rationale: Sa konteksto at gamit sa Mga Gawa, mas malamang na kinikilala siya bilang isang mananampalataya. Gayunman, tunay na maaaring mangahulugan ang salita ng “tapat,” kaya inilagay ang alternatibo sa talababa.
- issue: Kahulugan ng Ἕλληνος
  choice: Griego
  alternative: Hentil
  rationale: Mas tiyak na tumutukoy ang salita sa isang taong Griego sa etnisidad o kulturang pagkakakilanlan; ang “Hentil” ay mas malawak at maaaring magpasok ng teolohikal na kategoryang hindi tahasang sinabi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pantawag-pansing “At narito,” ngunit ginawang natural ang kasunod na sugnay sa pamamagitan ng “may isang alagad doon.” Ginamit ang “babaeng Judio” at “Griego” bilang madaling maunawaang kasalukuyang mga katawagan.
