  text: ἀναγαγών τε αὐτοὺς εἰς τὸν ⸀οἶκον παρέθηκεν τράπεζαν καὶ ⸀ἠγαλλιάσατο πανοικεὶ πεπιστευκὼς τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/034.yaml
  text: And after bringing them up into the house[a], he set a meal before them and rejoiced greatly with his whole household[b], having believed in God.
translation:
  language: tl
  text: Pagkatapos niya silang iakyat sa bahay, ipinaghanda niya sila ng pagkain[a] at labis siyang nagalak kasama ang buo niyang sambahayan[b], bilang isang sumampalataya sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “naglagay siya ng hapag sa harap nila”; ang idyomang Griyego ay tumutukoy sa paghahanda o paghahain ng pagkain.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring idiin ng Griyego na ang buong sambahayan ay kasama sa kagalakan; inuunawa naman ng ilan na ipinahihiwatig ng sugnay na nakibahagi rin sa pagsampalataya ang sambahayan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγαγών
  choice: Pagkaakyat niya sa kanila
  rationale: Ipinahahayag ng aorist participle ang naunang pagkilos at ang pag-akyat mula sa bilangguan patungo sa bahay.
- source_word: οἶκον
  choice: bahay
  rationale: Tumutukoy sa bahay ng tagapagbantay ayon sa konteksto, nang hindi kailangang idagdag sa teksto ang panghalip na pag-aari.
- source_word: παρέθηκεν τράπεζαν
  choice: ipinaghanda niya sila ng pagkain
  rationale: Likas na salin ng idyomang Griyego na literal na paglalagay ng hapag ngunit tumutukoy sa paghahain o paglalaan ng pagkain.
- source_word: ἠγαλλιάσατο
  choice: Labis siyang nagalak
  rationale: Inilalarawan ng pandiwa ang masidhi at masiglang kagalakan.
- source_word: πανοικεὶ
  choice: kasama ang buo niyang sambahayan
  rationale: Pinananatili ang kolektibong saklaw ng lahat ng kabilang sa bahay o sambahayan.
- source_word: πεπιστευκὼς τῷ θεῷ
  choice: yamang sumampalataya siya sa Diyos
  rationale: Ang perfect participle ay tumutukoy sa natapos na pagsampalataya na may nagpapatuloy na bunga; pinananatili ng 'yamang' ang kaugnayan nito sa kagalakan nang hindi ito ginagawang hiwalay na pangunahing sugnay.
theological_decisions:
- issue: Saklaw ng kagalakan at pagsampalataya kaugnay ng sambahayan
  choice: Ang tagapagbantay ang tahasang paksa ng pagsampalataya, at nagalak siyang kasama ang buo niyang sambahayan.
  alternative: Maaaring unawain na ang buong sambahayan ay kapuwa nagalak at sumampalataya.
  rationale: Ang isahang participle na πεπιστευκώς ay pinakadirektang tumutukoy sa tagapagbantay, samantalang maaaring iugnay ang πανοικεὶ sa kagalakang kinasangkutan ng buong sambahayan. Hindi nilulutas nang lampas sa sintaks ang posibleng implikasyon na sumampalataya rin ang sambahayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” upang saklawin hindi lamang ang nukleyar na pamilya kundi ang lahat ng kabilang sa bahay; pinanatili sa talababa ang tunay na sintaktikong kalabuan.
