  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐποίει ἐπὶ πολλὰς ἡμέρας. διαπονηθεὶς ⸀δὲ Παῦλος καὶ ἐπιστρέψας τῷ πνεύματι εἶπεν· Παραγγέλλω σοι ⸀ἐν ὀνόματι Ἰησοῦ Χριστοῦ ἐξελθεῖν ἀπ’ αὐτῆς· καὶ ἐξῆλθεν αὐτῇ τῇ ὥρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/018.yaml
  text: And she kept doing this for many days[a]. But Paul, becoming greatly troubled, turned to the spirit and said[b], “I command you in the name of Jesus the Messiah to come out of her.” And it came out that very hour.
translation:
  language: tl
  text: 'At paulit-ulit niya itong ginawa sa loob ng maraming araw. Ngunit nang lubhang mabagabag si Pablo, humarap siya sa espiritu at sinabi, “Iniuutos ko sa iyo sa pangalan ni Jesus na siyang Mesiyas: lumabas ka sa kaniya.” At lumabas ito noon ding oras.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίει ἐπὶ πολλὰς ἡμέρας
  choice: patuloy niya itong ginawa sa loob ng maraming araw
  rationale: Ipinahahayag ng imperpektong ἐποίει ang nagpapatuloy o paulit-ulit na kilos; likas itong naihahatid ng “patuloy niya itong ginawa.”
- source_word: διαπονηθεὶς
  choice: nang lubha nang nabagabag
  rationale: Ipinahihiwatig ng pandiwaring ito ang matinding pagkabagabag o pagkayamot matapos maipit nang matagal, hindi lamang bahagyang pagkainis.
- source_word: ἐπιστρέψας
  choice: humarap siya
  rationale: Tumutukoy ito sa pisikal na paglingon o pagharap ni Pablo bago siya nagsalita; mas natural sa Filipino ang “humarap siya” sa kontekstong ito.
- source_word: τῷ πνεύματι
  choice: sa espiritu
  rationale: “Espiritu” lamang ang tahasang sinasabi ng Griyego; hindi dinagdagan ng “masama” o “demonyo,” yamang ipinakikilala na ng konteksto ang tinutukoy.
- source_word: Παραγγέλλω σοι
  choice: Iniuutos ko sa iyo
  rationale: Naghahayag ang παραγγέλλω ng makapangyarihang utos; tuwiran at marangal ang “Iniuutos ko sa iyo.”
- source_word: ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: sa pangalan ni Jesus na Mesiyas
  rationale: Pinananatili ng “Mesiyas” ang kahulugan ng Χριστός bilang titulo, at natural sa Filipino ang anyong “Jesus na Mesiyas.”
- source_word: ἐξελθεῖν ἀπ’ αὐτῆς
  choice: lumabas ka sa kaniya
  rationale: Karaniwan at malinaw itong pananalita sa Filipino para sa pagpapalayas sa isang espiritu mula sa isang tao.
- source_word: ἐξῆλθεν αὐτῇ τῇ ὥρᾳ
  choice: lumabas nga ito nang oras ding iyon
  rationale: Pinananatili nito ang orasang idyoma ng Griyego at ipinakikitang agad na natupad ang utos.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ sa pormula ng pag-uutos
  choice: Mesiyas
  alternative: Cristo
  rationale: Ginamit ang “Mesiyas” upang mapanatili ang aktibong diwa ng Χριστός bilang titulo at hindi ito magmukhang apelyido o nakapirming bahagi lamang ng pangalan.
- issue: Kung tahasang tatawaging masama o demonyo ang espiritu
  choice: espiritu
  alternative: masamang espiritu; demonyo
  rationale: πνεῦμα lamang ang nasa talata. Pinananatili ng salin ang eksaktong antas ng pagtukoy ng teksto, samantalang nililinaw ng mas malawak na konteksto ang likas ng espiritu.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinili ang “kaniya” sa halip na kolokyal na “kanya,” at pinanatili ang tuwiran at may awtoridad na himig ng utos ni Pablo.
