  to: 'At paulit-ulit niya itong ginawa sa loob ng maraming araw. Ngunit nang lubhang mabagabag si Pablo, humarap siya sa espiritu at sinabi, “Iniuutos ko sa iyo sa pangalan ni Jesus na siyang Mesiyas: lumabas ka sa kaniya.” At lumabas ito noon ding oras.'
  rationale: Inayos ang mga pariralang may maliit na suliranin sa likas na daloy ng Filipino nang hindi binabago ang saklaw ng kahulugan ng Griyego. Ang “paulit-ulit” ay malinaw na naghahayag ng imperpektong ἐποίει; “nang lubhang mabagabag” ay pinananatili ang puwersa ng διαπονηθείς; at “noon ding oras” ay naghahayag ng agarang katuparan. Walang footnote na kailangan sapagkat malinaw sa pangunahing teksto ang mga elementong ito at walang footnote anchor sa draft na dapat panatilihin.
