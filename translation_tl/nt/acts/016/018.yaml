  terminology: Napananatili ang “espiritu” nang walang idinagdag na “masama” o “demonyo,” alinsunod sa Griyego. Ang “Mesiyas” ay angkop para sa Χριστός bilang titulo. Pinanatili rin ang “Pablo” at “Jesus.”
