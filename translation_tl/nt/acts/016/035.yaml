base_translation:
  language: en
  yaml_path: translation/nt/acts/016/035.yaml
  text: And when day came[a], the magistrates sent the rod-bearers, saying, “Release those men.”
translation:
  language: tl
  text: Nang mag-umaga na, ipinadala ng mga mahistrado ang mga tagapagdala ng pamalo[a] upang sabihin, “Palayain mo ang mga lalaking iyon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lictor,” mga opisyal na tagapaglingkod ng mga mahistradong Romano na nagdadala ng mga pamalo bilang sagisag ng kanilang kapangyarihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμέρας δὲ γενομένης
  choice: Nang mag-umaga
  rationale: Likas na salin ng henitibong absolutong nagsasaad ng paglipat ng panahon; ipinahihiwatig rin ng pagkakasunod ng pangungusap ang pang-ugnay na δέ.
- source_word: ἀπέστειλαν
  choice: ipinadala
  rationale: Tuwirang salin ng aorist ng ἀποστέλλω at malinaw sa karaniwang Filipino.
- source_word: οἱ στρατηγοὶ
  choice: mga mahistrado
  rationale: Sa konteksto ng kolonya ng Filipos, tumutukoy ito sa mga opisyal na sibil ng Roma, hindi sa mga heneral ng hukbo.
- source_word: τοὺς ῥαβδούχους
  choice: mga tagapagdala ng pamalo
  rationale: Pinananatili ang kongkretong larawan at opisyal na tungkulin ng mga tauhang nagdadala ng mga pamalo bilang sagisag ng kapangyarihan ng mga mahistrado.
- source_word: λέγοντες
  choice: upang sabihin
  rationale: Natural na Filipino na nag-uugnay sa pagpapadala ng mga opisyal at sa mensaheng ipahahatid nila, nang hindi binabago ang nilalaman ng utos.
- source_word: Ἀπόλυσον
  choice: Palayain mo
  rationale: Pinananatili ang isahang pautos na anyo at ang legal na diwa ng pagpapalaya sa mga bilanggo.
- source_word: τοὺς ἀνθρώπους ἐκείνους
  choice: ang mga lalaking iyon
  rationale: Tumutukoy sa dalawang lalaking sina Pablo at Silas; tumpak sa kasarian at konteksto.
theological_decisions: []
