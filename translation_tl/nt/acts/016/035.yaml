  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mahistrado” para sa opisyal na kontekstong Romano at ang madaling maunawaang literal na “tagapagdala ng pamalo,” kalakip ang mas tiyak na katawagang pangkasaysayan sa talababa.
