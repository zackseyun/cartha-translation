  text: And taking them in that hour of the night[a], he washed their wounds, and he was baptized at once[c][b], he and all his household.
translation:
  language: tl
  text: Sa oras ding iyon ng gabi, dinala niya sila at hinugasan ang kanilang mga sugat.[a] Agad siyang binautismuhan, kasama ang lahat ng kabilang sa kanyang sambahayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na ayos ng Griyego, “hinugasan [niya sila] mula sa mga sugat”; ang diwa ay hinugasan niya ang kanilang mga sugat.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “buong pamilya niya.” Mas malawak ang salitang Griyego at maaaring tumukoy sa lahat ng kabilang sa kanyang tahanan.
    reason: alternative_reading
lexical_decisions:
- source_word: παραλαβὼν
  choice: dinala niya sila
  rationale: Ipinahihiwatig ng aorist participle na dinala o isinama muna ng bantay-bilangguan sina Pablo at Silas bago niya hinugasan ang kanilang mga sugat. Hindi tinutukoy ng salitang Griyego rito ang tiyak na lugar na pinagdalhan sa kanila.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτός
  choice: nang oras ding iyon ng gabi
  rationale: Pinananatili nito kapwa ang oras sa gabi at ang diin sa agarang pagtugon ng bantay-bilangguan.
- source_word: ἔλουσεν ἀπὸ τῶν πληγῶν
  choice: hinugasan ang kanilang mga sugat
  rationale: Ito ang likas na pagpapahayag sa modernong Tagalog para sa paghuhugas sa mga pinsalang dulot ng mga hampas, nang hindi mekanikal na ginagaya ang konstruksiyong Griyego.
- source_word: ἐβαπτίσθη
  choice: binautismuhan
  rationale: Tumpak nitong ipinapahayag ang balintiyak na pandiwa—tumanggap siya ng bautismo—nang hindi itinatakda ang paraan ng pagbautismo.
- source_word: οἱ αὐτοῦ πάντες
  choice: lahat ng kabilang sa kanyang sambahayan
  rationale: Mas malawak ito kaysa sa nukleyar na pamilya lamang at tumutukoy sa lahat ng kabilang sa kanyang saklaw na pantahanan.
- source_word: παραχρῆμα
  choice: agad
  rationale: Maikli at likas na salin na nagpapanatili sa diin ng salaysay sa pagiging kagyat.
theological_decisions:
- issue: Saklaw ng οἱ αὐτοῦ πάντες na tumanggap ng bautismo
  choice: lahat ng kabilang sa kanyang sambahayan
  alternative: buong pamilya niya
  rationale: Sinasabi ng talata na binautismuhan ang bantay-bilangguan at ang lahat ng kabilang sa kanyang sambahayan, ngunit hindi nito tinutukoy ang kanilang edad, indibiduwal na pagpapahayag ng pananampalataya, o ang paraan ng bautismo. Kaya hindi nilulutas ng salin ang mga sumunod na debateng pangdenominasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sambahayan” upang mapanatili ang mas malawak na saklaw ng ekspresyong Griyego, at iniwasang magdagdag ng paliwanag tungkol sa edad ng mga binautismuhan o sa paraan ng bautismo.
