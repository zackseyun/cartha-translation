  text: τοῦτον ἠθέλησεν ὁ Παῦλος σὺν αὐτῷ ἐξελθεῖν, καὶ λαβὼν περιέτεμεν αὐτὸν διὰ τοὺς Ἰουδαίους τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις, ᾔδεισαν γὰρ ἅπαντες ⸂ὅτι Ἕλλην ὁ πατὴρ αὐτοῦ⸃ ὑπῆρχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/003.yaml
  text: Paul wanted him to go out with him[a], and after taking him, he circumcised him because of the Jews who were in those places[c][b], for they all knew that his father was a Greek.
translation:
  language: tl
  text: Nais ni Pablo na isama siya sa paglalakbay[a]. Pagkatapos niya siyang kunin, tinuli niya siya dahil sa mga Judiong nasa mga lugar na iyon[b], sapagkat alam nilang lahat na Griego[c] ang ama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lumabas na kasama niya”; maaari ring isaling “sumama sa kanya.” Sa kontekstong ito, tumutukoy ito sa pag-alis upang maglakbay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “alang-alang sa mga Judio” o “dahil sa mga Judio.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “Griego.” Sa kontekstong ito, malamang na ipinahihiwatig din na hindi Judio ang ama ni Timoteo.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτον
  choice: siya
  rationale: Tumutukoy kay Timoteo mula sa naunang konteksto. Ang “siya” ay natural sa makabagong Tagalog at hindi nagdaragdag ng diin na wala sa Griyego.
- source_word: ἠθέλησεν
  choice: Nais
  rationale: Ipinahahayag ng θέλω ang hangarin o kagustuhan ni Pablo; dignified at natural ang “nais.”
- source_word: σὺν αὐτῷ ἐξελθεῖν
  choice: na isama siya sa paglalakbay
  rationale: Literal itong “lumabas na kasama niya,” ngunit sa konteksto ng Mga Gawa ay tumutukoy sa pag-alis upang maglakbay. Inihahatid ng salin ang idyomatikong diwa nang malinaw.
- source_word: λαβὼν
  choice: Kaya isinama niya ito
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauuna sa pagtutuli. Sa Tagalog, natural na ipinahahayag ang pagkakasunod sa pamamagitan ng “kaya” at ng pandiwang “isinama.”
- source_word: περιέτεμεν
  choice: tinuli
  rationale: Tuwiran at karaniwang salin ng περιτέμνω; hindi kailangan ang eupemismo.
- source_word: διὰ τοὺς Ἰουδαίους
  choice: dahil sa mga Judio
  rationale: Ang διά na may accusative ay nagsasaad ng dahilan o motibo. Pinananatili ng “dahil sa” ang lawak ng posibleng kahulugan nang hindi ipinapalagay ang tiyak na doktrinal na layunin.
- source_word: τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις
  choice: sa mga lugar na iyon
  rationale: Natural at malapit sa literal na “nasa mga lugar na iyon”; sa Tagalog, sapat nang ikabit ito sa “mga Judio.”
- source_word: ᾔδεισαν γὰρ ἅπαντες
  choice: sapagkat alam nilang lahat
  rationale: Pinananatili ng “sapagkat” ang paliwanag na hatid ng γάρ, at ng “lahat” ang diin ng ἅπαντες.
- source_word: Ἕλλην
  choice: Griego
  rationale: Tuwirang katawagan ito sa isang Griego. Sa kontekstong Judio, maaari rin itong magpahiwatig ng hindi Judio, kaya inilalahad iyon sa talababa sa halip na ipalit sa pangunahing teksto.
- source_word: ὁ πατὴρ αὐτοῦ ὑπῆρχεν
  choice: ang ama nito
  rationale: Ang payak na “ang ama nito” kasama ng panaguring “Griego” ay natural na katumbas ng “his father was,” nang walang dagdag na diin sa pinagmulan o kalagayan.
theological_decisions:
- issue: Dahilan ng pagtutuli kay Timoteo kaugnay ng mga Judiong naroon
  choice: Inilalarawan itong ginawa dahil sa mga Judiong nakaaalam na Griego ang ama ni Timoteo.
  alternative: Ipaliwanag itong patunay na kailangan ang pagtutuli para sa kaligtasan, o sabihing pawang estratehiyang pangmisyon lamang ito.
  rationale: Ang talata mismo ay nagbibigay ng dahilan ngunit hindi nito hayagang sinasabi ang mas malawak na doktrinal na kahulugan. Pinananatili ng salin ang tensiyon at hindi nagdaragdag ng konklusyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Judio” at “Griego” bilang pamilyar na mga katawagang biblikal. Iniwasan ang sobrang literal na “lumabas na kasama niya” sa pangunahing teksto dahil hindi natural sa Tagalog, ngunit pinanatili ito sa talababa.
