  yaml_path: translation/nt/acts/016/022.yaml
  text: And the crowd rose up together against them[a], and the magistrates, after tearing off their garments, were ordering them to be beaten with rods[b],
translation:
  language: tl
  text: At sabay-sabay na nagkaisa ang karamihan laban sa kanila[a]. Matapos punitin at hubarin ng mga mahistrado ang damit nina Pablo at Silas, iniutos nilang hampasin sila ng mga pamalo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nakisama sa paglusob sa kanila.” Binibigyang-diin ng pandiwang Griyego ang sama-samang mapanlabang pagkilos ng karamihan.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga mahistrado” ay mga Romanong opisyal na namamahala sa Filipos; sa mas teknikal na katawagan, mga pretor.
