lexical_decisions:
- source_word: συνεπέστη
  choice: sabay-sabay na kumilos laban
  rationale: Ipinapahayag nito ang sama-sama at marahas na pagkilos ng karamihan nang hindi ipinapalagay na pisikal na pananakit na agad ang mismong kahulugan ng pandiwa.
- source_word: ὄχλος
  choice: mga tao
  rationale: Natural ito sa makabagong Tagalog para sa nagkakatipong karamihan; iniiwasan ng “mandurumog” ang labis na pagpapakahulugang wala sa pangngalan mismo.
- source_word: κατ’ αὐτῶν
  choice: laban sa kanila
  rationale: Malinaw na ipinapakita ang salungat at mapanlabang diwa ng κατά sa kontekstong ito.
- source_word: στρατηγοὶ
  choice: mga pinuno ng lungsod
  rationale: Tumutukoy ito sa mga Romanong awtoridad na namamahala sa Filipos. Mas madaling maunawaan ang saling ito kaysa sa teknikal na “mga pretor,” habang nililinaw ng talababa ang historikal na titulo.
- source_word: περιρήξαντες
  choice: pinunit at hinubad
  rationale: Ang pandiwa ay tumutukoy sa marahas na pagpunit o paghila upang maalis ang damit. Ang pares na pandiwa ay natural sa Tagalog at nililinaw ang layunin ng kilos.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: ang damit nina Pablo at Silas
  rationale: Ginawang tahasan ang tinutukoy ng panghalip upang maiwasan ang maling pagkaunawang sariling damit ng mga pinuno ang hinubad nila.
- source_word: ἐκέλευον
  choice: ipinag-utos nilang
  rationale: Natural na naihahatid nito ang awtoritatibong utos; hindi kailangang pilitin sa Tagalog ang aspektong imperpektibo kung magiging alanganin ang pangungusap.
- source_word: ῥαβδίζειν
  choice: pagpaluin ... ng mga pamalo
  rationale: Tiyak nitong ipinapakita na mga pamalo, hindi latigo, ang ginamit sa parusang Romano.
