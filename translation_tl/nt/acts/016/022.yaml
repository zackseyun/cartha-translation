revisions:
- from: At sabay-sabay na kumilos laban sa kanila ang mga tao[a]. Pinunit at hinubad ng mga pinuno ng lungsod ang damit nina Pablo at Silas, at ipinag-utos nilang pagpaluin ang dalawa ng mga pamalo[b].
  to: At sabay-sabay na nagkaisa ang karamihan laban sa kanila[a]. Matapos punitin at hubarin ng mga mahistrado ang damit nina Pablo at Silas, iniutos nilang hampasin sila ng mga pamalo[b].
  rationale: Inayos ang katumbas ng ὄχλος at συνεπέστη upang maihatid ang sama-samang pagbangon ng karamihan laban kina Pablo at Silas. Ginamit ang “mga mahistrado” para sa στρατηγοί, habang iniiwan sa talababa ang teknikal na historikal na termino. Pinanatili ang naunang pagkakasunod ng pagpunit at paghubad ng damit bago ang utos na paluin sila ng mga pamalo.
