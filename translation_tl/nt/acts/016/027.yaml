base_translation:
  language: en
  yaml_path: translation/nt/acts/016/027.yaml
  text: When the jailer woke up and saw the prison doors standing open[a], he drew his sword and was about to kill himself[b], supposing that the prisoners had escaped.
translation:
  language: tl
  text: Nang magising ang bantay ng bilangguan at makita niyang nakabukas ang mga pinto ng bilangguan[a], binunot niya ang kanyang tabak[b] at papatayin na sana niya ang sarili, sa pag-aakalang nakatakas na ang mga bilanggo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na pagkakasabi, “makita niyang nabuksan na ang mga pinto ng bilangguan.” Binibigyang-diin ng anyong Griyego ang kalagayan ng mga pintong bukas na.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego na μάχαιρα ay maaaring tumukoy sa tabak o sa mas maikling sandatang may talim, gaya ng punyal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξυπνος ... γενόμενος
  choice: Nang magising
  rationale: Likas na modernong Tagalog para sa pagpasok sa kalagayang gising; pinananatili ang ingressive na diwa ng parirala.
- source_word: δεσμοφύλαξ
  choice: bantay ng bilangguan
  rationale: Tumutukoy sa opisyal na may pananagutan sa mga bilanggo. Mas malinaw sa karaniwang mambabasa kaysa sa hiram na salitang “dyeyler.”
- source_word: ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς
  choice: makitang nakabukas ang mga pinto ng bilangguan
  rationale: Ang “nakabukas” ay natural na naghahayag ng nagresultang kalagayan na ipinahihiwatig ng perfect passive participle, nang hindi kinakailangang tukuyin kung sino ang nagbukas.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: binunot niya ang kanyang tabak
  rationale: Ang pandiwa at pangngalan sa kontekstong ito ay tumutukoy sa pagbunot ng sandata; “tabak” ang pamantayan at marangal na katumbas, habang kinikilala sa talababa ang posibleng mas maikling sandata.
- source_word: ἤμελλεν ἑαυτὸν ἀναιρεῖν
  choice: papatayin na sana ang sarili
  rationale: Malinaw na ipinapahayag ang nalalapit ngunit hindi natuloy na kilos; likas ito sa Tagalog at hindi pinahihina ang kahulugang “patayin.”
- source_word: νομίζων
  choice: sa pag-aakalang
  rationale: Ipinakikita nitong ang inaakalang pagtakas ang dahilan ng kanyang gagawin, habang pinananatiling hinuha lamang iyon at hindi tiyak na kaalaman.
- source_word: ἐκπεφευγέναι
  choice: nakatakas na
  rationale: Ipinahahayag ng “na” ang inaakalang natapos nang pagtakas, kaayon ng perfect infinitive.
- source_word: τοὺς δεσμίους
  choice: ang mga bilanggo
  rationale: Pinakamalinaw at pinakanatural na tawag sa mga taong nakakulong sa kontekstong ito.
