translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Ginamit ang “bantay ng bilangguan” para sa tiyak na tungkulin at ang “nakabukas” upang mapanatili ang resultant-state nuance ng Griyego. Ang “papatayin na sana” ay idiomatikong naghahayag ng napipintong kilos na hindi natuloy.
