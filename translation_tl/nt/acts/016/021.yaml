  text: καὶ καταγγέλλουσιν ἔθη ἃ οὐκ ἔξεστιν ἡμῖν παραδέχεσθαι οὐδὲ ποιεῖν Ῥωμαίοις οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/021.yaml
  text: and they are proclaiming customs that it is not lawful for us to accept or practice[a], since we are Romans.
translation:
  language: tl
  text: at ipinangangaral nila ang mga kaugaliang hindi ipinahihintulot sa atin na tanggapin o isagawa, yamang mga Romano tayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bilang mga Romano” o “sapagkat mga Romano tayo.” Isinasaad ng pariralang Griyego ang dahilang ibinibigay ng mga nagsasakdal sa pagtanggi nila sa mga kaugaliang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: at
  rationale: Payak na pang-ugnay ito na nagpapatuloy sa paratang mula sa naunang talata.
- source_word: καταγγέλλουσιν
  choice: ipinangangaral nila
  rationale: Ipinahihiwatig ng pandiwa ang hayagang pagpapahayag. Ang “ipinangangaral” ay natural sa Filipino at hindi nito nililimitahan ang diwa sa pormal na pagtuturo.
- source_word: ἔθη
  choice: mga kaugalian
  rationale: Tumutukoy ang salita sa kinagawiang mga gawi o nakatatag na paraan ng pamumuhay; malinaw at karaniwan ang “mga kaugalian.”
- source_word: οὐκ ἔξεστιν
  choice: hindi ipinahihintulot
  rationale: Pinananatili nito ang legal at sibikong himig ng paratang nang hindi sinasabing totoo nga ang legal na pahayag ng mga nagsasakdal.
- source_word: παραδέχεσθαι
  choice: tanggapin
  rationale: Saklaw nito ang pagtanggap sa mga kaugaliang iyon bilang katanggap-tanggap o maaaring sundin, nang hindi pinakikitid ang kahulugan sa tahasang pag-aangkin sa mga iyon.
- source_word: οὐδὲ ποιεῖν
  choice: o isagawa
  rationale: Kapag kaugalian ang layon, ang ποιεῖν ay tumutukoy sa pagsasagawa o pagsunod dito. Natural ang “isagawa” sa legal-sibikong konteksto.
- source_word: Ῥωμαίοις οὖσιν
  choice: yamang tayo ay mga Romano
  rationale: Ipinapakita nito ang malamang na sanhi o batayang ibinibigay ng mga nagsasakdal, habang pinananatiling nakaugnay ang parirala sa pagbabawal.
theological_decisions:
- issue: Kalikasan ng sinasabing pagbabawal
  choice: 'Inilarawan ang paratang sa legal-sibikong pananalita: “hindi ipinahihintulot sa atin.”'
  alternative: “Hindi nararapat para sa atin.”
  rationale: Iniulat lamang ng talata ang paratang at hindi pinagtitibay na tama ang kanilang pakahulugan sa batas ng Roma. Pinananatili ng salin ang kanilang legal na pag-angkin nang walang dagdag na paghatol.
- issue: Gamit ng Ῥωμαίοις οὖσιν
  choice: 'Isinaling may panandang sanhi: “yamang tayo ay mga Romano.”'
  alternative: “bilang mga Romano” o “sapagkat mga Romano tayo”
  rationale: Malamang na isinasaad ng participial phrase ang dahilang ibinibigay ng mga nagsasakdal, ngunit inilalagay sa talababa ang mga malapit na anyo upang mapanatili ang saklaw ng Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pormal na himig ng legal-sibikong paratang, ngunit iniwasan ang labis na teknikal o makalumang pananalita.
