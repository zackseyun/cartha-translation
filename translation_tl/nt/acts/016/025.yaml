  text: Κατὰ δὲ τὸ μεσονύκτιον Παῦλος καὶ Σιλᾶς προσευχόμενοι ὕμνουν τὸν θεόν, ἐπηκροῶντο δὲ αὐτῶν οἱ δέσμιοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/025.yaml
  text: About midnight Paul and Silas were praying and singing hymns to God[a], and the prisoners were listening to them.
translation:
  language: tl
  text: Nang bandang hatinggabi, nananalangin sina Pablo at Silas at umaawit ng mga himno sa Diyos, habang nakikinig sa kanila ang mga bilanggo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “masusing nakikinig sa kanila ang mga bilanggo.” Maaaring magpahiwatig ang pandiwang Griyego ng masusi o sabik na pakikinig.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ τὸ μεσονύκτιον
  choice: Nang bandang hatinggabi
  rationale: Ang κατά na may accusative na panahunan ay tumutukoy rito sa humigit-kumulang na oras, kaya likas at tumpak ang “bandang hatinggabi.” Banayad lamang ang pag-uugnay ng δέ at hindi kailangang tumbasan ng hiwalay na salita.
- source_word: Παῦλος καὶ Σιλᾶς
  choice: sina Pablo at Silas
  rationale: Ginamit ang karaniwang anyo ng mga pangalang ito sa modernong salin sa Filipino, kasama ang angkop na pantukoy na “sina.”
- source_word: προσευχόμενοι
  choice: nananalangin
  rationale: Ang present participle ay nagsasaad ng patuloy na kilos na kasabay ng pag-awit; naipahahayag ito nang likas ng aspektong imperpektibo ng “nananalangin.”
- source_word: ὕμνουν
  choice: umaawit ng mga himno
  rationale: Ang ὑμνέω ay partikular na tumutukoy sa pag-awit ng mga himno o awit ng papuri, hindi lamang sa pangkalahatang pag-awit.
- source_word: τὸν θεόν
  choice: sa Diyos
  rationale: Malinaw na ipinakikita ng “sa Diyos” na ang Diyos ang pinatutungkulan ng kanilang mga himno.
- source_word: ἐπηκροῶντο
  choice: nakikinig
  rationale: Ipinahahayag ng anyong imperpekto ang patuloy na pakikinig. Maaaring kasama sa pandiwa ang diwa ng masusi o taimtim na pakikinig; pinanatiling payak ang pangunahing teksto at inilagay ang mas mariing posibilidad sa talababa.
- source_word: οἱ δέσμιοι
  choice: ang mga bilanggo
  rationale: Sa konteksto ng bilangguan, “mga bilanggo” ang pinakalikas at tuwirang katumbas ng δέσμιοι.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “habang” upang natural na maipakita ang magkasabay at nagpapatuloy na mga kilos nang hindi binabago ang ugnayang nasa Griyego. Inilagay ang talababa pagkatapos ng sugnay tungkol sa mga bilanggo, sapagkat doon tumutukoy ang leksikal na alternatibo.
