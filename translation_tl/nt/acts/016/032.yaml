  yaml_path: translation/nt/acts/016/032.yaml
  text: And they spoke the word of the Lord to him[c][b][a], together with all who were in his house.
translation:
  language: tl
  text: At sinabi nila sa kanya ang salita ng Panginoon[a], kasama ng lahat ng nasa kanyang bahay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mensahe tungkol sa Panginoon.” Ang pariralang Griyego na “ang salita ng Panginoon” ay maaaring tumukoy sa mensaheng pag-aari ng Panginoon, nagmumula sa kanya, o tungkol sa kanya.
    reason: alternative_reading
  - marker: b
    text: O “kasama ang buong sambahayan niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησαν
  choice: sinabi nila
  rationale: Ang aorist ng λαλέω ay tumutukoy rito sa tuwirang pagpapahayag ng mensahe. Likas sa modernong Tagalog ang “sinabi nila” at hindi nito idinaragdag ang pampublikong himig ng “ipinangaral.”
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Ang panghalip na datibo ay tumutukoy sa tagapagbantay ng bilangguan bilang kinausap.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: ang salita ng Panginoon
  rationale: Pinananatili nito ang karaniwang idyoma sa Bagong Tipan at ang lawak ng ugnayang ipinahihiwatig ng genitibong τοῦ κυρίου, nang hindi nagpapasiya kung ang salita ay mula sa Panginoon o tungkol sa Panginoon.
- source_word: σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: kasama ang lahat ng nasa kanyang bahay
  rationale: Tuwirang sinasalamin ng “kasama” ang σύν at ipinakikitang kabilang sa pakikinig ang lahat ng naroon, habang nananatiling natural sa Tagalog.
- source_word: οἰκίᾳ
  choice: bahay
  rationale: Maaaring tumukoy ang οἰκία sa pisikal na bahay o sa sambahayan. Ang “bahay” ang mas kongkretong katumbas at ang “lahat ng nasa” ang naglilinaw na mga tao ang tinutukoy.
theological_decisions:
- issue: Saklaw ng kahulugang “ang salita ng Panginoon”
  choice: ang salita ng Panginoon
  alternative: ang mensahe tungkol sa Panginoon; ang mensaheng mula sa Panginoon
  rationale: Maaaring ipahiwatig ng pariralang Griyego ang mensaheng pag-aari, nagmumula, o tumutukoy sa Panginoon. Pinananatili ng pangunahing salin ang tunay na kalabuan sa halip na paliitin ito.
- issue: Ugnayan ng lahat ng nasa bahay sa pagsasalita
  choice: kasama ang lahat ng nasa kanyang bahay
  alternative: at sa lahat ng nasa kanyang bahay
  rationale: Pinananatili ng “kasama” ang σύν. Ipinahihiwatig ng konteksto na kasama silang nakarinig, ngunit hindi binabago ang parirala upang maging tahasang ikalawang di-tuwirang layon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “salita ng Panginoon” upang mapanatili ang idyoma at kalabuan ng Griyego; iniwasan ang mas mabigat na “ipinangaral” dahil hindi iyon hinihingi ng ἐλάλησαν.
