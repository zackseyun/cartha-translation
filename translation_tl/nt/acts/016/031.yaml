id: ACT.16.31
reference: Acts 16:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Πίστευσον ἐπὶ τὸν κύριον ⸀Ἰησοῦν, καὶ σωθήσῃ σὺ καὶ ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/031.yaml
  text: And they said[a], “Believe in the Lord Jesus[b], and you will be saved—you and your household.”
translation:
  language: tl
  text: Sinabi nila, “Manampalataya ka sa Panginoong Jesus, at maliligtas ka—ikaw at ang iyong sambahayan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sambahayan” ay tumutukoy sa mga taong kabilang sa kanyang tahanan, hindi lamang sa bahay bilang gusali.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Sinabi nila
  rationale: Ang δέ ay mahinang pang-ugnay sa daloy ng salaysay; hindi kailangang gawing tahasang panalungat sa Filipino.
- source_word: Πίστευσον ἐπὶ τὸν
  choice: Manampalataya ka sa
  rationale: Ang aorist imperative ay nananawagan ng tiyak na pagtugon, at ang ἐπί + accusative ay tumutukoy sa persona na pinagtutuunan ng pananampalataya. Natural at matatag na katumbas sa modernong Tagalog ang “manampalataya sa.”
- source_word: κύριον Ἰησοῦν
  choice: Panginoong Jesus
  rationale: Pinananatili ng “Panginoon” ang karangalan at teolohikal na bigat ng κύριος, habang ginagamit ang karaniwang anyong Filipino ng pangalang Jesus.
- source_word: σωθήσῃ
  choice: maliligtas ka
  rationale: Ang future passive ng σῴζω ay angkop na isalin bilang “maliligtas,” na hindi naglilimita sa diwa sa pisikal o pansamantalang pagsagip lamang.
- source_word: σὺ καὶ ὁ οἶκός σου
  choice: ikaw at ang iyong sambahayan
  rationale: Ang οἶκος dito ay tumutukoy sa mga taong kabilang sa tahanan o sambahayan, hindi lamang sa gusali. Ang “sambahayan” ay maikli, natural, at nagpapanatili sa saklaw ng orihinal.
theological_decisions:
- issue: Saklaw ng pangako sa “ikaw at ang iyong sambahayan”
  choice: Tuwirang panatilihin ang pagkakasama ng bilanggo at ng kanyang sambahayan nang hindi ipinahihiwatig na awtomatiko silang maliligtas dahil lamang sa pananampalataya niya.
  alternative: Ipahiwatig ang awtomatikong kaligtasan ng buong sambahayan sa pamamagitan ng pananampalataya ng ulo nito, o paliitin ang pangako upang tumukoy lamang sa bilanggo.
  rationale: Binabanggit ng Griyego ang bilanggo at ang kanyang sambahayan, ngunit hindi nilulutas ng talatang ito lamang kung paano naaangkop ang pangako sa bawat kasapi. Pinananatili ng salin ang tunay na teolohikal na tensiyon nang walang idinaragdag na denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “manampalataya” upang mapanatili ang biblikal at relasyonal na diwa ng πιστεύω, at ang “sambahayan” upang malinaw na tukuyin ang pangkat ng mga taong nasa kanyang tahanan.
