  text: He was well spoken of by the brothers in Lystra and Iconium[a].
translation:
  language: tl
  text: Maganda ang patotoo ng mga kapatid sa Listra at Iconio tungkol sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay maaaring tumukoy sa mga kapatid na lalaki at babae—sa mga kapwa mananampalataya sa mga lugar na iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: tungkol sa kanya
  rationale: Tumutukoy ang panghalip na ito kay Timoteo sa naunang talata; inayos ang pangungusap ayon sa natural na daloy ng Tagalog.
- source_word: ἐμαρτυρεῖτο
  choice: Maganda ang patotoo tungkol sa kanya
  rationale: Ipinahihiwatig ng imperpektong pasibo na tumatanggap si Timoteo ng mabuting patotoo o pagkilala mula sa iba; malinaw at marangal itong pagpapahayag sa modernong Tagalog.
- source_word: ὑπὸ
  choice: ng
  rationale: Sa pasibong konstruksyon, tinutukoy nito ang mga taong pinagmumulan ng patotoo.
- source_word: τῶν ἐν Λύστροις καὶ Ἰκονίῳ
  choice: sa Listra at Iconio
  rationale: Inilalarawan nito ang mga kapatid na nasa dalawang lungsod; maikli at natural ang lokatibong parirala sa Tagalog.
- source_word: ἀδελφῶν
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay natural na katawagan sa Tagalog para sa kapwa mananampalataya at maaari ring sumaklaw sa mga lalaki at babae, gaya ng posibleng gamit ng pangmaramihang Griyego rito.
theological_decisions:
- issue: Saklaw ng ἀδελφῶν sa pamayanang Cristiano
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga kapwa mananampalataya
  rationale: Pinananatili ng “mga kapatid” ang metaporang pampamilya ng Griyego nang hindi ipinapalagay na lalaki lamang ang tinutukoy. Nililinaw sa talababa ang posibleng inklusibong saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang mga pangalang “Listra” at “Iconio,” na karaniwang anyong Filipino ng mga pangalan ng lungsod.
