  source_fidelity: Napananatili ng salin ang patuloy na pagsunod, ang malakas na pagsigaw, ang katawagang «mga alipin,» ang banal na titulong «Kataas-taasang Diyos,» at ang pagpapahayag ng daan tungo sa kaligtasan. Gayunman, ang dalawang magkahiwalay na pangungusap sa loob ng sigaw ay nagpapaluwag sa ugnayang inilalarawan ng οἵτινες («na ...»), at ang pangkasalukuyang anyong «ipinapahayag» ay hindi gaanong malinaw sa patuloy na aspekto ng Griyego.
  naturalness: Malinaw at modernong Filipino ang karamihan ng draft. Mas natural at mas malapit sa sintaksis ng pinagmulan ang isang tuloy-tuloy na tuwirang pahayag na may sugnay na «na nagpapahayag,» kaysa dalawang malayang pangungusap.
