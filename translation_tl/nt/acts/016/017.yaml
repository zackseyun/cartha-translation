source:
  edition: SBLGNT
  text: αὕτη ⸀κατακολουθοῦσα τῷ Παύλῳ καὶ ἡμῖν ἔκραζεν λέγουσα· Οὗτοι οἱ ἄνθρωποι δοῦλοι τοῦ θεοῦ τοῦ ὑψίστου εἰσίν, οἵτινες καταγγέλλουσιν ⸀ὑμῖν ὁδὸν σωτηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/017.yaml
  text: She kept following Paul and us and crying out[a], saying, “These men are servants of the Most High God, who are proclaiming to you the way of salvation.”
translation:
  language: tl
  text: Patuloy siyang sumusunod kay Pablo at sa amin at sumisigaw, “Ang mga taong ito ay mga alipin ng Kataas-taasang Diyos na nagpapahayag sa inyo ng daan tungo sa kaligtasan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang daan tungo sa kaligtasan.” Walang pantukoy bago ang salitang “daan” sa Griyego, kaya maaari itong maunawaan bilang tiyak o di-tiyak.
    reason: alternative_reading
lexical_decisions:
- source_word: κατακολουθοῦσα
  choice: Patuloy siyang sumusunod
  rationale: Ipinahihiwatig ng kasalukuyang pandiwaring kasama ng pandiwang nasa imperfect ang nagpapatuloy o paulit-ulit na pagsunod.
- source_word: ἔκραζεν
  choice: sumisigaw
  rationale: Inilalarawan ng imperfect ang patuloy o paulit-ulit na pagsasalita nang malakas, nang hindi nagdaragdag ng tiyak na damdamin.
- source_word: δοῦλοι
  choice: mga alipin
  rationale: Ipinahahayag dito ang pag-aari at lubos na pagpapasakop sa Diyos; mas tuwirang pinananatili ng “alipin” ang diwa ng δοῦλος kaysa “lingkod.”
- source_word: τοῦ θεοῦ τοῦ ὑψίστου
  choice: ng Kataas-taasang Diyos
  rationale: Natural at marangal na anyo sa modernong Filipino para sa titulong banal na “Diyos na Kataas-taasan.”
- source_word: καταγγέλλουσιν
  choice: Ipinapahayag nila
  rationale: Tumutukoy ang pandiwa sa hayagan at pampublikong pagpapahayag.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Pinananatili ang mga tagapakinig bilang di-tuwirang layon ng pagpapahayag.
- source_word: ὁδὸν σωτηρίας
  choice: ang daan tungo sa kaligtasan
  rationale: Natural sa Filipino at pinananatili ang larawan ng “daan” at ang layuning “kaligtasan”; inilalahad sa talababa ang tunay na kalabuan hinggil sa katiyakan nito.
theological_decisions:
- issue: Katiyakan o di-katiyakan ng ὁδὸν σωτηρίας
  choice: ang daan tungo sa kaligtasan
  alternative: isang daan tungo sa kaligtasan
  rationale: Walang pantukoy ang ὁδόν sa Griyego, ngunit hindi nito awtomatikong hinihingi ang di-tiyak na kahulugan. Mas natural sa konteksto ang tiyak na anyo sa Filipino, habang pinananatili ng talababa ang posibleng di-tiyak na pagbasa at hindi tahimik na nilulutas ang tensiyong teolohikal.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “alipin” upang mapanatili ang ugnayan ng pag-aari sa δοῦλοι, at iniwasan ang mas pormal o lumang ayos ng pangungusap.
