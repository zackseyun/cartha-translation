translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga opisyal” upang maging malinaw ang di-tahasang simuno mula sa naunang konteksto; pinanatili ang mapagpayapang tono ng kanilang pakiusap at inilagay sa talababa ang posibleng duratibo o paulit-ulit na puwersa ng imperfect.
