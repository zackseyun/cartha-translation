  yaml_path: translation/nt/acts/016/039.yaml
  text: And they came and appealed to them[a], and after leading them out[b], they asked them to leave the city.
translation:
  language: tl
  text: At pumunta ang mga opisyal at nakiusap sa kanila,[a] at matapos nila silang ilabas, hiniling nila[b] sa kanila na umalis sa lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mahigpit na nakiusap” o “pinakiusapan.” Malawak ang kahulugan ng pandiwang Griyego at maaari rin itong mangahulugang “umaliw” sa ibang konteksto, ngunit dito ay malamang na nagpapahiwatig ito ng mapagpakumbaba at mapagpayapang pakiusap matapos ang pagmamaltrato ng mga opisyal kina Pablo at Silas.
    reason: lexical_alternative
  - marker: b
    text: 'Ang pandiwang “hiniling” ay nasa aspektong imperfect sa Griyego at maaaring magpahiwatig ng patuloy o paulit-ulit na paghiling: “patuloy nilang hinihiling” o “paulit-ulit silang nakiusap.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: pumunta
  rationale: Ipinahahayag ng aorist participle ang pagpunta ng mga opisyal bago sila nakiusap; likas sa makabagong Tagalog ang payak na pandiwang ito.
- source_word: παρεκάλεσαν
  choice: nakiusap
  rationale: Sa konteksto, nakikiusap at nagpapahinahon ang mga opisyal matapos ang kanilang pagmamaltrato kina Pablo at Silas. Hindi ang kahulugang “umaliw” ang nangingibabaw rito.
- source_word: αὐτούς
  choice: sa kanila
  rationale: Tumutukoy kina Pablo at Silas at likas na katambal ng pandiwang “nakiusap.”
- source_word: ἐξαγαγόντες
  choice: matapos silang ilabas
  rationale: Pinananatili ang pagkakasunod-sunod ng mga kilos at ang diwang paglalabas sa kanila mula sa bilangguan o pagkakapiit.
- source_word: ἠρώτων
  choice: hiniling
  rationale: Ang ἐρωτάω rito ay magalang na paghiling. Bagaman imperfect ang anyo at maaaring magpahiwatig ng patuloy o paulit-ulit na paghiling, hindi ito kailangang gawing tahasan sa pangunahing teksto.
- source_word: ἀπελθεῖν ἀπὸ τῆς πόλεως
  choice: na umalis sila sa lungsod
  rationale: Natural at malinaw na Tagalog para sa infinitive phrase na nagsasaad ng nilalaman ng kahilingan.
