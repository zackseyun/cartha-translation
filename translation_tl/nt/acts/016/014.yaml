id: ACT.16.14
reference: Acts 16:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καί τις γυνὴ ὀνόματι Λυδία, πορφυρόπωλις πόλεως Θυατείρων σεβομένη τὸν θεόν, ἤκουεν, ἧς ὁ κύριος διήνοιξεν τὴν καρδίαν προσέχειν τοῖς λαλουμένοις ὑπὸ ⸀τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/014.yaml
  text: And a certain woman named Lydia[a], a seller of purple cloth from the city of Thyatira, who worshiped God, was listening; the Lord opened her heart to pay attention to what was being spoken by Paul.
translation:
  language: tl
  text: At may isang babaeng nagngangalang Lydia, na nagtitinda ng telang kulay-lila mula sa lungsod ng Tiatira, na sumasamba sa Diyos[a], ang nakikinig. Binuksan ng Panginoon ang kanyang puso upang bigyang-pansin niya ang mga sinasabi ni Pablo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang sumasamba sa Diyos”; ang parirala ay maaaring tumukoy sa isang di-Judiong deboto ng Diyos ng Israel.
    reason: Ipinakikita ang posibleng alternatibong pagsasalin at ang posibleng panlipunan-relihiyosong gamit ng σεβομένη τὸν θεόν nang hindi ito ginagawang tiyak na teknikal na katawagan sa pangunahing teksto.
lexical_decisions:
- source_word: καί τις γυνὴ ὀνόματι Λυδία
  choice: May isang babaeng nagngangalang Lydia
  rationale: Likas na panimulang pasalaysay sa Tagalog na pinananatili ang di-tiyak na force ng τις at malinaw na ipinakikilala si Lydia.
- source_word: πορφυρόπωλις
  choice: nagtitinda ng telang kulay-lila
  rationale: Malinaw sa karaniwang mambabasa at inilalarawan ang pangangalakal ng telang tinina ng mamahaling kulay-lila, nang hindi ipinapalagay na mga kasuotan lamang ang paninda.
- source_word: πόλεως Θυατείρων
  choice: taga-lungsod ng Tiatira
  rationale: Natural na pagpapahayag sa Tagalog ng pinagmulan o tirahang kaugnay ni Lydia.
- source_word: σεβομένη τὸν θεόν
  choice: Sumasamba siya sa Diyos
  rationale: Ipinahahayag ang paggalang at debosyon sa Diyos sa malinaw na modernong Tagalog; ang posibleng panlipunan-relihiyosong gamit ng parirala ay inilagay sa talababa.
- source_word: ἤκουεν
  choice: nakikinig
  rationale: Pinananatili ang nagpapatuloy na aspekto ng imperfect at mas sadyang pakikinig kaysa simpleng pagkarinig.
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Tuwirang pinananatili ang τίτulong κύριος nang hindi dinaragdagan ng tahasang reperenteng wala sa Griyego.
- source_word: διήνοιξεν τὴν καρδίαν
  choice: Binuksan ... ang kanyang puso
  rationale: Natural at kinikilalang idyoma sa Tagalog para sa panloob na pagtanggap o pagkaunawa.
- source_word: προσέχειν
  choice: upang pagtuunan niya ng pansin
  rationale: Nananatili sa kahulugan ng masusing pagbibigay-pansin at hindi pinalalawak tungo sa 'tumugon' o 'sumampalataya.'
- source_word: τοῖς λαλουμένοις ὑπὸ τοῦ Παύλου
  choice: ang mga sinasabi ni Pablo
  rationale: Natural na Tagalog na pinananatili ang nagpapatuloy na aspekto ng participle at malinaw na tinutukoy si Pablo bilang nagsasalita.
theological_decisions:
- issue: Ang tinutukoy ng ὁ κύριος
  choice: ang Panginoon
  alternative: ang Panginoong Jesus; ang Diyos
  rationale: Panginoon lamang ang tahasang sinasabi ng Griyego. Pinananatili ng salin ang pagiging bukas ng reperente at hindi ipinapasok sa teksto ang mas tiyak na pagkakakilanlan.
- issue: Kahulugan ng σεβομένη τὸν θεόν
  choice: Sumasamba siya sa Diyos
  alternative: isang may paggalang sa Diyos; isang di-Judiong deboto ng Diyos ng Israel
  rationale: Malinaw ang pangunahing diwa ng debosyon sa Diyos, habang iniiwasang gawing tiyak na teknikal na titulo sa pangunahing teksto ang parirala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kulay-lila” sa halip na mas teknikal o makalumang “purpura,” at hinati sa maiikling pangungusap upang maiwasan ang mabigat na sunod-sunod na sugnay habang pinananatili ang daloy at mga ugnayan ng Griyego.
