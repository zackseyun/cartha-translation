source:
  edition: SBLGNT
  text: καὶ ὅραμα ⸀διὰ νυκτὸς ⸂τῷ Παύλῳ ὤφθη⸃, ἀνὴρ ⸂Μακεδών τις ἦν⸃ ἑστὼς ⸀καὶ παρακαλῶν αὐτὸν καὶ λέγων· Διαβὰς εἰς Μακεδονίαν βοήθησον ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/009.yaml
  text: 'And a vision appeared to Paul in the night: a certain Macedonian man was standing and urging him[a], saying[c][b], “Come over into Macedonia and help us.”'
translation:
  language: tl
  text: 'Noong gabi[a], nagpakita kay Pablo ang isang pangitain: isang lalaking Macedonio[b] ang nakatayo at nakikiusap sa kanya. Sinabi niya, “Tumawid ka papuntang Macedonia[c] at tulungan mo kami.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa magdamag” o “kinagabihan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isang lalaki mula sa Macedonia.”
    reason: lexical_alternative
  - marker: c
    text: Sa Griyego, “Pagkatawid mo papuntang Macedonia, tulungan mo kami.” Ang “Tumawid ka … at tulungan” ay likas na nagpapahayag sa Filipino ng ugnayan ng participle at ng pautos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅραμα
  choice: pangitain
  rationale: Karaniwang salitang Filipino para sa isang nakikitang karanasang mapaghayag; hindi nito tinutukoy kung panaginip, panloob na impresyon, o pisikal na pagpapakita ang eksaktong anyo nito.
- source_word: διὰ νυκτός
  choice: sa gabi
  rationale: Tuwirang ipinahahayag ang panahong naganap ang pangitain, sa natural at kasalukuyang Filipino.
- source_word: τῷ Παύλῳ ὤφθη
  choice: nagpakita kay Pablo
  rationale: Inililipat nang natural ang pasibong anyo ng ὁράω na may datibo bilang isang bagay na nagpakita sa isang tao, nang hindi nagdaragdag kung paano ito nakita.
- source_word: ἀνὴρ Μακεδών τις
  choice: may isang lalaking taga-Macedonia
  rationale: Pinananatili ng “lalaki” ang tiyak na kasarian ng ἀνήρ; ang “isang” ay likas na nagpapahayag ng di-tiyak na τις, at malinaw na ipinahihiwatig ng “taga-Macedonia” ang pinagmulan o pagkakakilanlan.
- source_word: ἑστώς
  choice: na nakatayo
  rationale: Pinananatili ang larawang patuloy na nakatayo ang lalaki sa tagpo ng pangitain.
- source_word: παρακαλῶν
  choice: nakikiusap
  rationale: Ang konteksto ay isang taimtim na pakiusap para sa tulong; mas angkop ito kaysa sa mas mahinang “humihiling” o sa maaaring labis na matinding “nagmamakaawa.”
- source_word: λέγων
  choice: —
  rationale: Hindi na hiwalay na isinalin ang participle na “sinasabi” sapagkat natural nang ipinakikilala sa Filipino ng kuwit at tuwirang sipi ang nilalaman ng pakikiusap.
- source_word: Διαβάς
  choice: Tumawid ka
  rationale: 'Ang aorist participle na kaugnay ng pautos ay likas na naipapahayag sa Filipino bilang unang pautos sa magkakaugnay na kilos: tumawid at tumulong.'
- source_word: εἰς Μακεδονίαν
  choice: papuntang Macedonia
  rationale: Malinaw na ipinahahayag ang direksiyong pagpasok patungo sa Macedonia sa natural na Filipino.
- source_word: βοήθησον ἡμῖν
  choice: tulungan mo kami
  rationale: Tuwiran, simple, at matibay na katumbas ng pautos na humihingi ng tulong.
theological_decisions:
- issue: Likas na katangian ng karanasang tinutukoy ng ὅραμα at ὤφθη
  choice: Isinalin bilang isang pangitaing nagpakita kay Pablo, nang hindi nililinaw nang higit sa sinasabi ng teksto ang paraan ng karanasan.
  alternative: Maaaring ipakahulugan ito bilang panaginip, panloob na impresyon, o obhetibong pagpapakita.
  rationale: Tahasan itong tinatawag ng teksto na pangitain at sinasabing nagpakita ito kay Pablo sa gabi. Pinananatili ng salin ang mapaghayag na pangyayari ngunit hindi ipinapasya ang eksaktong penomenolohiya nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakikiusap” upang maipakita ang taimtim na apela nang hindi pinatitindi ito hanggang “nagmamakaawa.” Pinanatili ang “Macedonia” bilang karaniwang anyo ng pangalang heograpiko.
