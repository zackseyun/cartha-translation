  to: 'Noong gabi[a], nagpakita kay Pablo ang isang pangitain: isang lalaking Macedonio[b] ang nakatayo at nakikiusap sa kanya. Sinabi niya, “Tumawid ka papuntang Macedonia[c] at tulungan mo kami.”'
  rationale: Inayos ang ayos ng pangungusap para sa mas natural na modernong Filipino at pinalitan ang “taga-Macedonia” ng “Macedonio” upang mas tumpak na maipakita ang pagkakakilanlang inilalarawan ng Μακεδών. Ginawang hiwalay na pangungusap ang pagpapakilala sa tuwirang sipi upang malinaw na ang lalaking nasa pangitain ang nagsasalita, habang pinananatili ang kahulugan ng λέγων.
