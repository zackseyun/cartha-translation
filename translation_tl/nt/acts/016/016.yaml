id: ACT.16.16
reference: Acts 16:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ πορευομένων ἡμῶν εἰς ⸀τὴν προσευχὴν παιδίσκην τινὰ ἔχουσαν πνεῦμα ⸀πύθωνα ⸀ὑπαντῆσαι ἡμῖν, ἥτις ἐργασίαν πολλὴν παρεῖχεν τοῖς κυρίοις αὐτῆς μαντευομένη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/016.yaml
  text: And it happened that, as we were going to the place of prayer, a certain servant girl who had a python spirit met us, and she was bringing much profit to her masters by fortune-telling.
translation:
  language: tl
  text: Nangyari nga na, habang papunta kami sa lugar ng panalanginan, sinalubong kami ng isang aliping babae na may espiritu ni Python[a]. Nagdudulot siya ng malaking kita sa kaniyang mga amo sa pamamagitan ng panghuhula[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “espiritu ng panghuhula.” Literal sa Griyego, “espiritu ni Python,” isang katawagang kaugnay ng paghula.
    reason: alternative_reading
  - marker: b
    text: O “sa pagsasagawa ng panghuhula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: At nangyari
  rationale: Likas na panandang pasalaysay sa Filipino na pinananatili ang pagpapakilala ng bagong pangyayari nang hindi makaluma.
- source_word: πορευομένων ἡμῶν
  choice: habang papunta kami
  rationale: Ipinahahayag ang kasabay at nagpapatuloy na kilos ng genitive absolute.
- source_word: εἰς τὴν προσευχὴν
  choice: sa pook-dalanginan
  rationale: Ipinakikita na malamang ay isang kinikilalang lugar ng pananalangin, hindi lamang ang gawaing manalangin.
- source_word: παιδίσκην τινά
  choice: isang aliping babae
  rationale: Ang konteksto ng maraming amo at pakikinabang nila sa kaniya ay nagpapakitang mahalaga rito ang kaniyang kalagayang alipin.
- source_word: ἔχουσαν πνεῦμα πύθωνα
  choice: na may espiritu ni Python
  rationale: Pinananatili ang tiyak at kultural na katawagang Griyego sa halip na agad itong ipakahulugang pangkalahatang espiritu ng panghuhula.
- source_word: ὑπαντῆσαι ἡμῖν
  choice: sinalubong kami
  rationale: Natural na salin ng pagtatagpo at mas tiyak kaysa sa payak na 'nakasalubong namin.'
- source_word: ἐργασίαν πολλὴν παρεῖχεν
  choice: Malaki ang kinikita
  rationale: Malinaw na ipinahahayag ang malaking patuloy na pakinabang na pinansiyal sa natural na Filipino.
- source_word: τοῖς κυρίοις αὐτῆς
  choice: ng kaniyang mga amo
  rationale: Tumutukoy sa mga taong may kapangyarihan o pagmamay-ari sa aliping babae, hindi sa banal na titulong 'Panginoon.'
- source_word: μαντευομένη
  choice: sa panghuhula niya
  rationale: Karaniwan at madaling maunawaang katumbas ng gawaing mantiko o divinasyon.
theological_decisions:
- issue: Pagpapakahulugan sa πνεῦμα πύθωνα, isang katawagang may tiyak na ugnayang kultural sa panghuhula
  choice: espiritu ni Python
  alternative: espiritu ng panghuhula
  rationale: Pinananatili sa pangunahing teksto ang kakaibang ekspresyon ng Griyego at inilalagay sa talababa ang mas interpretatibong katumbas, upang hindi mapawi ang kultural at teolohikal na tensiyon.
- issue: Kung dapat bang ipakita ng salin ng παιδίσκη ang kalagayang alipin
  choice: aliping babae
  alternative: babaeng utusan
  rationale: Mahalaga sa konteksto ang pagsasamantala sa kaniya ng maraming amo at ang pakinabang na nakukuha nila mula sa kaniyang gawain.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “pook-dalanginan” upang tukuyin ang lugar, “aliping babae” upang maging malinaw ang kalagayang panlipunan, at “espiritu ni Python” upang mapanatili ang kultural na katiyakan ng orihinal. Hinati sa dalawang pangungusap para sa likas at malinaw na daloy.
