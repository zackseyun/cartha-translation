revisions:
- from: At nangyari, habang papunta kami sa pook-dalanginan, sinalubong kami ng isang aliping babae na may espiritu ni Python[a]. Malaki ang kinikita ng kaniyang mga amo sa panghuhula niya.[b]
  to: Nangyari nga na, habang papunta kami sa lugar ng panalanginan, sinalubong kami ng isang aliping babae na may espiritu ni Python[a]. Nagdudulot siya ng malaking kita sa kaniyang mga amo sa pamamagitan ng panghuhula[b].
  rationale: Inayos ang panimulang pananalita para sa likas na modernong daloy, pinalitan ang “pook-dalanginan” ng mas malinaw na “lugar ng panalanginan,” at ibinalik sa aliping babae ang gramatikal na papel na nagdudulot ng malaking kita sa kaniyang mga amo. Inayos din ang talababa b upang maging natural na Filipino. Pinananatili ang pangunahing saling “espiritu ni Python” at ang kinakailangang mga anchor.
