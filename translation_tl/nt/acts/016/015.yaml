id: ACT.16.15
reference: Acts 16:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς, παρεκάλεσεν λέγουσα· Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι, εἰσελθόντες εἰς τὸν οἶκόν μου ⸀μένετε· καὶ παρεβιάσατο ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/015.yaml
  text: And when she and her household were baptized[a], she urged us, saying, “If you have judged me to be faithful to the Lord, come into my house and stay.” And she prevailed upon us.
translation:
  language: tl
  text: Nang mabautismuhan siya at ang kanyang sambahayan, nakiusap siya sa amin, “Kung itinuring ninyo akong tapat sa Panginoon[a], pumasok kayo sa bahay ko at doon kayo tumuloy.” At napapayag niya kami sa kanyang pagpupumilit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang sumasampalataya sa Panginoon.” Ang pang-uring Griyego ay maaaring mangahulugang “tapat,” “mapagkakatiwalaan,” o “sumasampalataya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Nang
  rationale: Likas na ipinahahayag sa Filipino ang panahong ugnayan at pagkakasunod-sunod; hindi kailangang isalin nang hiwalay ang banayad na pang-ugnay na δέ.
- source_word: ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς
  choice: mabautismuhan siya at ang kanyang sambahayan
  rationale: Bagaman isahan ang pandiwa at unang tumutukoy kay Lydia, isinama ng kasunod na parirala ang kanyang buong sambahayan. Pinananatili ng ‘sambahayan’ ang panlipunang kahulugan ng οἶκος, hindi lamang ang gusali.
- source_word: παρεκάλεσεν
  choice: nakiusap siya sa amin
  rationale: Sa konteksto, ang παρακαλέω ay isang taimtim na pakiusap o paanyaya. Ang ‘nakiusap’ ay natural at may sapat na diin, habang ang matinding pagpupumilit ay malinaw na inilalahad sa huling sugnay.
- source_word: Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι
  choice: Kung itinuring ninyo akong tapat sa Panginoon
  rationale: Ipinahihiwatig ng perfect na κεκρίκατε ang nabuo nang pasiya o pagkilala. Pinananatili ng ‘tapat’ ang lawak ng πιστή bilang matapat, mapagkakatiwalaan, o sumasampalataya, nang hindi agad nililimitahan sa iisang diwa.
- source_word: εἰσελθόντες εἰς τὸν οἶκόν μου
  choice: pumasok kayo sa bahay ko
  rationale: Ang participle ay may lakas ng kasunod na utos o paanyaya. Dito, pisikal na tirahan ang tinutukoy ng οἶκος, kaya ‘bahay’ ang angkop, di tulad ng naunang ‘sambahayan.’
- source_word: μένετε
  choice: doon kayo tumuloy
  rationale: Sa konteksto ng pagpapatuloy sa bahay ni Lydia bilang mga panauhin, mas likas sa Filipino ang ‘tumuloy’ kaysa literal na ‘manatili.’
- source_word: παρεβιάσατο ἡμᾶς
  choice: napapayag niya kami sa kanyang pagpupumilit
  rationale: Ipinapakita ng παραβιάζομαι ang matinding paggigiit na nagtagumpay, ngunit hindi kinakailangang sapilitang pamimilit. Inilalarawan ng salin ang lakas ng kilos nang hindi nagpapahiwatig ng marahas na pamumuwersa.
theological_decisions:
- issue: Mga maaaring ipakahulugang denominasyonal mula sa bautismo ng sambahayan
  choice: Tahasang isinalaysay na nabautismuhan si Lydia at ang kanyang sambahayan, nang walang dagdag tungkol sa edad o kalagayan ng pananampalataya ng bawat kasapi.
  alternative: Ipahiwatig na may mga sanggol sa sambahayan, o na pawang hayagang mananampalataya lamang ang mga binautismuhan.
  rationale: Hindi tinutukoy ng talata ang bumubuo sa sambahayan at hindi nito tahasang pinagpapasiyahan ang mga kalaunang pagtatalo tungkol sa bautismo.
- issue: Kahulugan ng πιστὴν sa paglalarawan ni Lydia sa sarili
  choice: tapat sa Panginoon
  alternative: sumasampalataya sa Panginoon; mapagkakatiwalaan sa harap ng Panginoon
  rationale: Maaaring tumukoy ang pang-uri sa pananampalataya, katapatan, o pagiging mapagkakatiwalaan. Pinananatili ng ‘tapat’ ang makabuluhang kaluwagan at tensiyon ng Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘sambahayan’ para sa pangkat ng mga taong kabilang sa tahanan at ‘bahay’ para sa mismong tirahan. Inilagay ang talababa sa ‘tapat sa Panginoon,’ na siyang pariralang may tunay na leksikal na kalabuan.
