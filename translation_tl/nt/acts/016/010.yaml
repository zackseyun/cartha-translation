revisions:
- from: Nang makita niya ang pangitain, agad kaming nagsikap na makapunta sa Macedonia, sapagkat napagpasyahan naming tinawag kami ng Diyos upang ipahayag sa kanila ang magandang balita.
  to: Nang makita niya ang pangitain, agad naming sinikap na magtungo sa Macedonia, at nahinuha namin na tinawag kami ng Diyos upang ipahayag sa kanila ang mabuting balita.
  rationale: Pinalitan ang panandang sanhi at ang “napagpasyahan” upang maipahayag ang maingat na paghinuha ng pangkat mula sa pangitain. Pinahusay din ang pandiwa ng paglalakbay at ginamit ang karaniwang terminong “mabuting balita,” habang pinananatili ang kahulugan, unang panauhang maramihan, at marangal na modernong rehistro.
