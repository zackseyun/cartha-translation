id: ACT.16.10
reference: Acts 16:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς δὲ τὸ ὅραμα εἶδεν, εὐθέως ἐζητήσαμεν ἐξελθεῖν ⸀εἰς Μακεδονίαν, συμβιβάζοντες ὅτι προσκέκληται ἡμᾶς ὁ ⸀θεὸς εὐαγγελίσασθαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/010.yaml
  text: And when he had seen the vision[a], we immediately sought to go on into Macedonia[c][b], concluding that God had called us to proclaim the good news to them.
translation:
  language: tl
  text: Nang makita niya ang pangitain, agad naming sinikap na magtungo sa Macedonia, at nahinuha namin na tinawag kami ng Diyos upang ipahayag sa kanila ang mabuting balita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: Nang
  rationale: Likas na panandang temporal sa makabagong Tagalog at pinananatili ang mahinang pag-uugnay sa kasunod na pangyayari.
- source_word: τὸ ὅραμα
  choice: ang pangitain
  rationale: Karaniwan at tiyak na salin para sa isang bisyong may mapagpahayag na katangian.
- source_word: εἶδεν
  choice: makita niya
  rationale: 'Sa sugnay na pinangungunahan ng ''nang,'' malinaw ang pagkakasunod-sunod: nakita muna niya ang pangitain bago kumilos ang pangkat.'
- source_word: εὐθέως
  choice: agad
  rationale: Maikli, natural, at malinaw na naghahatid ng dagliang pagkilos.
- source_word: ἐζητήσαμεν
  choice: nagsikap kami
  rationale: Sa konteksto, ang ζητέω ay tumutukoy sa pagsisikap o paghahangad na maisagawa ang paglalakbay, hindi lamang sa paghahanap.
- source_word: ἐξελθεῖν εἰς Μακεδονίαν
  choice: na makapunta sa Macedonia
  rationale: Natural sa Tagalog para sa pag-alis patungo sa isang destinasyon; hindi kailangang piliting panatilihin ang literal na larawang 'lumabas papasok sa.'
- source_word: συμβιβάζοντες
  choice: sapagkat napagpasyahan naming
  rationale: Ipinahahayag ang pagbuo nila ng pasya mula sa pangitain; ang 'sapagkat' ay ginagawang malinaw ang ugnayang lohikal habang pinananatili ang sabayang kalagayan ng participle.
- source_word: προσκέκληται
  choice: tinawag kami
  rationale: Pinananatili ang banal na pagkukusa at ang diwa ng pagtawag o pagsusugo. Hindi kailangang gawing pluperfect sa Tagalog dahil malinaw na ang temporal na ugnayan sa konteksto.
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Tuwirang salin ng tiyak na simuno.
- source_word: εὐαγγελίσασθαι
  choice: upang ipahayag ... ang magandang balita
  rationale: Madaling maunawaan at tapat sa pandiwang diwa ng pagpapahayag ng mabuting balita, nang hindi gumagamit ng mas teknikal na 'mag-ebanghelyo.'
- source_word: αὐτούς
  choice: sa kanila
  rationale: Natural na Tagalog na tagatanggap ng ipinahahayag na magandang balita.
theological_decisions:
- issue: Paglipat ng salaysay sa unang panauhang maramihan (ἡμᾶς at ἐζητήσαμεν)
  choice: Panatilihin nang tuwiran bilang 'kami/kaming' at 'naming.'
  alternative: Gawing impersonal ang salaysay o ipaliwanag ang pagkakakilanlan ng tagapagsalaysay.
  rationale: Hayagang lumilipat ang Griyego sa unang panauhang maramihan. Dapat itong panatilihin nang hindi nagdaragdag ng teorya tungkol sa awtor.
- issue: Banal na paggabay sa προσκέκληται ἡμᾶς ὁ θεὸς
  choice: tinawag kami ng Diyos
  alternative: inaakay kami ng Diyos; inanyayahan kami ng Diyos
  rationale: Ang pandiwa ay nangangahulugang tumawag o magpatawag. Pinananatili ng 'tinawag' ang tahasang pagkukusa ng Diyos nang walang dagdag na doktrinal na pagpapakahulugan.
- issue: Lakas ng συμπιβάζοντες bilang paghinuha mula sa pangitain
  choice: napagpasyahan naming
  alternative: ipinapalagay naming; nahinuha naming
  rationale: Ipinakikita ng konteksto na pinag-ugnay ng pangkat ang pangitain at ang tawag ng Diyos upang makarating sa isang pasya; hindi nito sinasabing tumanggap ang bawat isa ng hiwalay na kapahayagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang 'Macedonia,' ang nakasanayang modernong anyo ng pangalang heograpiko. Pinanatili ang unang panauhang maramihan at iniwasan ang teknikal o labis na eklesiastikong pananalita.
