  source_fidelity: 'Tapat ang salin sa pagkakasunod ng mga kilos sa Griyego: paglabas mula sa tiyak na bilangguan, pagpunta kay Lydia, pagkakita sa mga kapatid, pagpapalakas ng loob sa kanila, at pag-alis. Ang temporal na “Pagkalabas nila” at “Nang makita nila” ay likas na katumbas ng mga aorist participle. Ang “pumunta sila kay Lydia” ay hindi nagdaragdag ng ‘bahay,’ samantalang nananatiling malinaw ang diwa ng pagdalaw.'
