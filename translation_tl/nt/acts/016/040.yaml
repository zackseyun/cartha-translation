id: ACT.16.40
reference: Acts 16:40
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐξελθόντες δὲ ⸀ἀπὸ τῆς φυλακῆς εἰσῆλθον πρὸς τὴν Λυδίαν, καὶ ἰδόντες ⸂παρεκάλεσαν τοὺς ἀδελφοὺς⸃ καὶ ἐξῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/040.yaml
  text: After they came out of the prison[a], they went to Lydia, and when they saw the brothers, they encouraged them and departed.
translation:
  language: tl
  text: Pagkalabas nila sa bilangguan, pumunta sila kay Lydia. Nang makita nila ang mga kapatid[a], pinalakas nila ang loob ng mga ito, at saka sila umalis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, panlalaking maramihan ang salitang isinaling “mga kapatid,” ngunit maaari itong tumukoy sa mga kapatid na lalaki at babae sa pananampalataya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες δὲ ἀπὸ τῆς φυλακῆς
  choice: Pagkalabas nila sa bilangguan
  rationale: Ang aorist participle ay natural na isinalin bilang sugnay na nagsasaad ng naunang pangyayari. Tinutukoy ng ‘bilangguan’ ang tiyak na lugar na kalalabasan lamang nina Pablo at Silas.
- source_word: εἰσῆλθον πρὸς τὴν Λυδίαν
  choice: pumunta sila kay Lydia
  rationale: Ipinahihiwatig ng parirala ang pagpunta upang dalawin si Lydia. Hindi idinagdag ang ‘bahay’ sapagkat hindi ito tahasang nasa Griyego, bagaman maaaring ipinahihiwatig ng konteksto.
- source_word: ἰδόντες
  choice: Nang makita nila
  rationale: Isinalin ang aorist participle bilang temporal na sugnay upang maging malinaw at natural ang daloy ng salaysay.
- source_word: παρεκάλεσαν
  choice: pinalakas nila ang loob
  rationale: Saklaw ng παρακαλέω ang paghikayat, pag-aliw, at pagpapatatag. Ang pariralang ito ay natural sa Tagalog at hindi nililimitahan ang diwa sa pormal na pangangaral o emosyonal na pag-aliw lamang.
- source_word: τοὺς ἀδελφούς
  choice: ang mga kapatid[a]
  rationale: Sa modernong Tagalog, ang ‘mga kapatid’ ay natural na tawag sa mga kapwa mananampalataya at hindi likas na nagtatakda ng kasarian. Ipinaliliwanag sa talababa ang anyong panlalaki ng salitang Griyego at ang maaaring inklusibong saklaw nito.
- source_word: ἐξῆλθαν
  choice: umalis
  rationale: Simple at natural na salaysay ito ng kanilang pag-alis; iniiwasan din nito ang alanganing pag-uulit ng ‘lumabas.’
theological_decisions:
- issue: Ang saklaw ng ἀδελφοί sa isang pagtitipon ng mga mananampalataya na malamang ay may mga babae at lalaki
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga kapatid sa pananampalataya
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, maaari itong tumukoy sa magkakahalong pangkat ng mga kapwa mananampalataya. Ang ‘mga kapatid’ ang pinakanatural na katumbas sa Tagalog at pinananatili sa talababa ang mahalagang impormasyong panggramatika at ang tunay na lawak ng posibleng tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, magalang, at angkop sa pampublikong pagbasa. Pinili ang maiikling sugnay at karaniwang bokabularyo habang pinananatili ang pagkakasunod-sunod at hindi tiyak na saklaw ng orihinal.
