base_translation:
  language: en
  yaml_path: translation/nt/acts/016/004.yaml
  text: As they went through the cities[a], they delivered to them for observance the decrees that had been decided by the apostles and elders in Jerusalem.
translation:
  language: tl
  text: Habang naglalakbay sila sa mga lungsod, ipinapasa nila sa kanila upang sundin nila ang mga pasiyang napagpasyahan ng mga apostol at matatanda sa Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ διεπορεύοντο τὰς πόλεις
  choice: Habang naglalakbay sila sa mga lungsod
  rationale: Ipinahahayag ng imperfect na διεπορεύοντο ang nagpapatuloy na paglalakbay sa iba’t ibang lungsod. Likas sa modernong Tagalog ang “naglalakbay ... sa mga lungsod” at hindi nito dinaragdagan ang detalye ng ruta.
- source_word: παρεδίδοσαν
  choice: ibinibigay nila
  rationale: Dito, tumutukoy ang pandiwa sa pormal na paghahatid o pagpapasa ng mga pasiyang may awtoridad. Ang “ibinibigay” ay malinaw at natural, at pinananatili ng aspektong di-ganap ang paulit-ulit na pagkilos habang naglalakbay sila.
- source_word: αὐτοῖς
  choice: sa mga naroon
  rationale: Panghalip lamang ang nasa Griyego at konteksto ang nagpapahiwatig sa mga taong nasa mga lungsod. Iniiwasan ng “mga naroon” ang tahasang pagdaragdag ng “mga mananampalataya” o “mga iglesya,” habang nililinaw ang natural na reperensiya sa Tagalog.
- source_word: φυλάσσειν
  choice: dapat sundin
  rationale: Ang φυλάσσειν ay nangangahulugang ingatan o tuparin sa diwang masusing pagsunod. Ang “dapat sundin” ay malinaw sa karaniwang mambabasa at angkop sa mga pasiyang ipinagkakatiwala sa kanila.
- source_word: τὰ δόγματα
  choice: mga pasiya
  rationale: Sa konteksto ng Gawa 15–16, ang δόγματα ay mga opisyal at may-awtoridad na pasiya. Ang “mga pasiya” ay likas sa Filipino at umiiwas sa posibleng anakronistikong dating ng “mga dogma” o sa pampamahalaang kulay ng “mga kautusan.”
- source_word: τὰ κεκριμένα
  choice: na pinagpasiyahan
  rationale: Ipinahihiwatig ng perfect passive participle ang mga pasiyang napagtibay na at nananatiling may bisa. Ipinapakita ng “pinagpasiyahan” na bunga ito ng naunang pagpapasya ng pangkat.
- source_word: τῶν ἀποστόλων καὶ πρεσβυτέρων
  choice: ng mga apostol at mga matatandang namumuno
  rationale: “Mga apostol” ang kinikilalang salin ng ἀπόστολοι. Sa kontekstong ito, ang πρεσβύτεροι ay mga kinikilalang lider, kaya nililinaw ng “mga matatandang namumuno” ang tungkulin at iniiwasan ang pagkaunawang edad lamang ang tinutukoy.
- source_word: τῶν ἐν Ἱεροσολύμοις
  choice: sa Jerusalem
  rationale: Ang pariralang pang-ukol ay tumutukoy sa lokasyon ng mga apostol at matatandang namumuno. Maikli, natural, at tapat ang “sa Jerusalem.”
theological_decisions:
- issue: Awtoridad ng mga pasiya mula sa Jerusalem
  choice: Isinalin ang δόγματα bilang “mga pasiya” at ang φυλάσσειν bilang “dapat sundin.”
  alternative: “mga kautusan” o “mga tuntunin”
  rationale: Pinananatili ng salin ang pormal at may-bisang katangian ng mga napagpasyahan sa Gawa 15, ngunit hindi nito ipinapalagay ang isang mas huling teknikal na konsepto ng dogma o isang partikular na doktrina tungkol sa awtoridad ng simbahan.
- issue: Pagkakakilanlan ng πρεσβύτεροι
  choice: “mga matatandang namumuno”
  alternative: “mga matatanda”
  rationale: Ipinakikita ng konteksto na mga kinikilalang pinuno ang tinutukoy, hindi lamang matatanda sa edad. Hindi tinutukoy ng salin ang isang partikular na makabagong denominasyonal na katungkulan.
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at madaling maunawaan. Pinanatili ang daloy ng salaysay at ang paulit-ulit na kilos ng mga pandiwang imperfect. Walang footnote dahil sapat na naihahatid ng “mga pasiya” ang kahulugan ng δόγματα; ang ibinigay na English footnote ay tila hindi tugma ang marker sa salitang tinatalakay.
