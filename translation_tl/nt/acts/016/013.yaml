  text: τῇ τε ἡμέρᾳ τῶν σαββάτων ἐξήλθομεν ἔξω τῆς ⸀πύλης παρὰ ποταμὸν οὗ ⸂ἐνομίζομεν προσευχὴν⸃ εἶναι, καὶ καθίσαντες ἐλαλοῦμεν ταῖς συνελθούσαις γυναιξίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/013.yaml
  text: On the Sabbath day we went outside the gate beside the river[a], where we supposed there was a place of prayer, and after sitting down we were speaking to the women who had gathered there.
translation:
  language: tl
  text: Noong araw ng Sabbath, lumabas kami sa tarangkahan at nagtungo sa tabi ng ilog, kung saan sa palagay namin ay may lugar para sa panalangin.[a] Pagkaupo namin, nakikipag-usap kami sa mga babaeng nagkatipon doon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kung saan sa palagay namin ay may panalangin.” Ang salitang Griyego ay maaaring tumukoy sa mismong panalangin o sa isang lugar na inilaan para sa panalangin; mas pinapaboran ng konteksto rito ang “lugar para sa panalangin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἡμέρᾳ τῶν σαββάτων
  choice: Nang araw ng Sabbath
  rationale: Ang parirala ay karaniwang idyoma sa Koine para sa araw ng Sabbath. Ang saling ito ay likas sa modernong Filipino at hindi ginagawang literal na “araw ng mga Sabbath.”
- source_word: ἐξήλθομεν ἔξω τῆς πύλης
  choice: pumunta kami sa labas ng tarangkahan
  rationale: Ipinahahayag nito ang paglabas at ang kinalalagyan sa labas ng tarangkahan nang hindi idinaragdag ang “lungsod,” na ipinahihiwatig lamang ng konteksto.
- source_word: παρὰ ποταμόν
  choice: sa tabi ng ilog
  rationale: Ang παρά na may accusative ay tumutukoy rito sa pagpunta sa isang lugar sa gilid ng ilog.
- source_word: οὗ ἐνομίζομεν προσευχὴν εἶναι
  choice: kung saan inakala naming may lugar na dalanginan
  rationale: Ang νομίζω ay “akala/isip,” at ang προσευχή ay maaaring tumukoy sa panalangin o sa isang lugar na inilaan para rito. Mas angkop sa tagpong heograpikal ang “lugar na dalanginan,” habang pinananatili sa talababa ang leksikal na alternatibo.
- source_word: καὶ καθίσαντες
  choice: Pagkaupo namin
  rationale: Ipinakikita ng aorist participle na nauna ang pag-upo sa pagsasalita; malinaw at natural itong naihahatid ng “Pagkaupo namin.”
- source_word: ἐλαλοῦμεν
  choice: nagsalita kami
  rationale: Ang λαλέω ay pagsasalita o pakikipag-usap. Pinili ang payak at hindi labis na interpretibong “nagsalita kami”; ang daloy ng pangungusap ang naghahatid ng nagaganap na pakikipag-usap.
- source_word: ταῖς συνελθούσαις γυναιξίν
  choice: sa mga babaeng nagkatipon doon
  rationale: Ang participle ay tumutukoy sa mga babaeng nagtipon na sa lugar. Ang “doon” ay likas na tumutukoy sa lokasyong kababanggit lamang.
theological_decisions:
- issue: Kahulugan ng προσευχή sa tagpong ito
  choice: lugar na dalanginan
  alternative: panalangin; sinagoga
  rationale: Maaaring tumukoy ang salita sa mismong panalangin o sa isang pook na inilaan para sa panalangin. Dahil lokasyon sa tabi ng ilog ang inilalarawan, mas malamang ang pook-dalanginan. Hindi ginamit ang “sinagoga” sapagkat mas tiyak iyon kaysa sa salitang Griyego.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang “Sabbath” bilang pamilyar na terminong biblikal; iniwasan ang mas teknikal na “sinagoga” at ang di-likas na literal na pag-uulit sa parirala tungkol sa paglabas ng tarangkahan.
