  text: ⸀ἀπήγγειλαν δὲ τοῖς στρατηγοῖς οἱ ῥαβδοῦχοι τὰ ῥήματα ταῦτα· ⸂ἐφοβήθησαν δὲ⸃ ἀκούσαντες ὅτι Ῥωμαῖοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/038.yaml
  text: So the rod-bearers reported these words to the magistrates[a], and they were afraid when they heard that they were Romans[c][b],
translation:
  language: tl
  text: Iniulat ng mga tagapagdala ng pamalo[b] sa mga pinuno ng lungsod[c] ang mga salitang ito. Natakot ang mga pinuno nang marinig nilang mga Romano[a] sina Pablo at Silas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga mamamayang Romano.” “Mga Romano” ang literal na nasa Griyego, ngunit sa kontekstong legal, ang mahalaga ay ang kanilang katayuang protektado bilang mga mamamayan ng Roma.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga tagapagdala ng pamalo” ay mga tagapaglingkod ng mga pinuno ng lungsod; tradisyonal silang tinatawag na mga lictor.
    reason: cultural_note
  - marker: c
    text: Ang “mga pinuno ng lungsod” ay salin ng στρατηγοί, ang mga pangunahing opisyal ng pamahalaan sa Filipos.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: Iniulat
  rationale: Ang pandiwang aorist ay tumutukoy sa pormal na paghahatid ng mensahe; natural ang “iniulat” sa konteksto ng mga opisyal.
- source_word: στρατηγοῖς
  choice: mga pinuno ng lungsod
  rationale: Tumutukoy ito sa mga pangunahing opisyal ng Filipos. Mas madaling maunawaan ang “mga pinuno ng lungsod” kaysa sa teknikal na “mga mahistrado,” habang nililinaw ng talababa ang tungkulin nila.
- source_word: ῥαβδοῦχοι
  choice: mga tagapagdala ng pamalo
  rationale: Pinananatili nito ang kongkretong larawan ng salitang Griyego at ang kaugnayan ng mga tagapaglingkod na ito sa kapangyarihan ng mga pinuno.
- source_word: τὰ ῥήματα ταῦτα
  choice: ang mga salitang ito
  rationale: Tuwirang salin ito na tumutukoy sa mensaheng kapapahayag lamang sa naunang talata.
- source_word: ἐφοβήθησαν
  choice: Natakot
  rationale: Simple at natural na salin ito ng reaksiyong ipinahahayag ng aorist na pandiwa nang hindi dinaragdagan ang tindi nito.
- source_word: ἀκούσαντες
  choice: nang marinig
  rationale: Likas na ipinahahayag sa Tagalog ang temporal at posibleng sanhiing ugnayan ng participle sa pangunahing pandiwa.
- source_word: Ῥωμαῖοί
  choice: mga Romano
  rationale: Pinananatili nito ang mismong anyo ng Griyego. Sa legal na konteksto, ang tinutukoy ay ang kanilang katayuan bilang mga mamamayang Romano, na ipinaliliwanag sa talababa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga pinuno ng lungsod” para sa madaling pagkaunawa, habang pinanatili ang literal na larawang “mga tagapagdala ng pamalo.” Idinagdag ang “sina Pablo at Silas” bilang likas na paglilinaw sa Tagalog ng implicit na paksa ng εἰσιν; hindi nito binabago ang tinutukoy sa konteksto.
