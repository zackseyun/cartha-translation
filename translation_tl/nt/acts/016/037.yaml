id: ACT.16.37
reference: Acts 16:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Παῦλος ἔφη πρὸς αὐτούς· Δείραντες ἡμᾶς δημοσίᾳ ἀκατακρίτους, ἀνθρώπους Ῥωμαίους ὑπάρχοντας, ἔβαλαν εἰς φυλακήν· καὶ νῦν λάθρᾳ ἡμᾶς ἐκβάλλουσιν; οὐ γάρ, ἀλλὰ ἐλθόντες αὐτοὶ ⸀ἡμᾶς ἐξαγαγέτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/037.yaml
  text: But Paul said to them[a], “After beating us publicly without trial, though we are Roman citizens, they threw us into prison; and now are they sending us out secretly? No indeed! Rather[c][b], let them come themselves and lead us out.”
translation:
  language: tl
  text: Ngunit sinabi ni Pablo sa kanila, “Matapos nila kaming paluin sa harap ng madla nang hindi pa nahahatulan[a], kami na mga mamamayang Romano[b], ibinilanggo nila kami. At ngayo’y palihim nila kaming pinalalabas? Hinding-hindi! Sa halip, sila mismo ang pumunta rito at umakay sa amin palabas[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang hindi hinatulan” o “nang walang hatol.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga taong Romano”; tumutukoy ito sa kanilang pagkamamamayang Romano at sa mga legal na proteksiyong kaakibat nito.
    reason: cultural_note
  - marker: c
    text: Maaari ring “ilabas kami” o “ihatid kami palabas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: sinabi
  rationale: Karaniwang pandiwa sa pagsasalaysay; natural ang payak na nagdaang aspekto sa Filipino.
- source_word: Δείραντες
  choice: Pinalo
  rationale: Tumpak at hindi labis na tiyak; hindi ipinapalagay ang isang partikular na paraan ng paghagupit.
- source_word: δημοσίᾳ
  choice: sa harap ng madla
  rationale: Malinaw at likas na pagpapahayag ng hayagang pagparusa.
- source_word: ἀκατακρίτους
  choice: nang hindi man lamang nahatulan
  rationale: Pinananatili ang pangunahing diwa na wala pang hatol na panghukuman, nang hindi nililimitahan ang salita sa kawalan lamang ng paglilitis.
- source_word: ἀνθρώπους Ῥωμαίους ὑπάρχοντας
  choice: gayong mga mamamayang Romano kami
  rationale: Ipinahahayag nang natural ang legal at sibikong katayuan nina Pablo at Silas; ang 'gayong' ay nagpapakita ng bigat ng kalagayang ito sa reklamo.
- source_word: ἔβαλαν εἰς φυλακήν
  choice: ibinilanggo nila kami
  rationale: Natural at mariing Filipino para sa pagkakulong, bagaman hindi ginagaya nang literal ang larawan ng 'paghagis' sa bilangguan.
- source_word: λάθρᾳ
  choice: palihim
  rationale: Direkta at natural na katumbas ng pagkilos nang lihim.
- source_word: ἐκβάλλουσιν
  choice: pinalalabas
  rationale: Pinananatili ang kasalukuyang kilos sa retorikal na tanong at ang diwang basta pagpapaalis.
- source_word: οὐ γάρ
  choice: Hinding-hindi!
  rationale: Likas at mariing pagtanggi sa modernong Filipino.
- source_word: ἐλθόντες αὐτοὶ
  choice: Sila mismo ang pumarito
  rationale: Pinananatili ang diin sa personal na pagdating ng mga mahistrado.
- source_word: ἡμᾶς ἐξαγαγέτωσαν
  choice: maglabas sa amin
  rationale: Direkta at natural; maaaring mangahulugan ding akayin o ihatid palabas.
theological_decisions:
- issue: Legal at sibikong bigat ng pagbanggit sa katayuang Romano
  choice: mga mamamayang Romano
  alternative: mga Romano
  rationale: Nililinaw nito na ang punto ay pagkamamamayan at ang kaakibat na legal na proteksiyon, hindi lamang lahi o tirahan.
- issue: Saklaw ng ἀκατακρίτους
  choice: nang hindi man lamang nahatulan
  alternative: nang walang paglilitis
  rationale: Mas malapit ito sa tahasang kahulugan na hindi sila nahatulan; hindi nito tahimik na ipinapantay ang kawalan ng hatol sa kawalan ng anumang paglilitis.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “pumarito” sa halip na mas kolokyal na “pumunta rito,” at pinanatili ang mariing tono ng pagtutol ni Pablo. Ang lahat ng marker [a], [b], at [c] ay nasa pangunahing teksto.
