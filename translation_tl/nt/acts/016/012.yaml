  terminology: Ang “Filipos,” “Macedonia,” “pangunahing lungsod,” at “kolonya ng Roma” ay angkop sa rehistro at sa kasaysayang tinutukoy. Ang “distrito” ay mas malapit sa μερίς kaysa sa kasalukuyang “bahaging iyon.”
