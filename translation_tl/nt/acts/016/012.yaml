  text: ⸀κἀκεῖθεν εἰς Φιλίππους, ἥτις ἐστὶν ⸂πρώτη τῆς μερίδος⸃ Μακεδονίας πόλις, κολωνία. ἦμεν δὲ ἐν ⸀ταύτῃ τῇ πόλει διατρίβοντες ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/012.yaml
  text: and from there to Philippi[a], which is a leading city of the district of Macedonia, a Roman colony[b]. And we stayed in this city for some days.
translation:
  language: tl
  text: At mula roon ay nagtungo kami sa Filipos,[a] na isang pangunahing lungsod sa distrito ng Macedonia at isang kolonya ng Roma.[b] Nanatili kami sa lungsod na ito nang ilang araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang unang lungsod sa distrito ng Macedonia.” Mahirap unawain nang tiyak ang pariralang Griyego; ang “una” ay maaaring tumukoy sa ranggo, katanyagan, o pagkakasunod-sunod.
    reason: alternative_reading
  - marker: b
    text: Ibig sabihin, isang lungsod na pinagkalooban ng natatanging katayuan sa ilalim ng pamamahala ng Roma.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖθεν εἰς Φιλίππους
  choice: at mula roon ay nagtungo kami sa Filipos
  rationale: Pinananatili ng “at mula roon” ang pagkakaugnay sa naunang salaysay ng paglalakbay. Bagaman walang hayag na pandiwa rito sa Griyego, likas sa Tagalog na punan ito ng “nagtungo kami” mula sa konteksto; ang “Filipos” ang nakagawiang anyong Tagalog ng pangalan.
- source_word: ἥτις
  choice: na
  rationale: Likas na ipinakikilala ng “na” ang kasunod na paliwanag tungkol sa Filipos nang hindi labis na binibigyang-diin ang bahagyang mapaglarawang himig ng panghalip.
- source_word: πρώτη τῆς μερίδος Μακεδονίας πόλις
  choice: isang pangunahing lungsod sa bahaging iyon ng Macedonia
  rationale: Maaaring tumukoy ang πρώτη sa ranggo, katanyagan, o pagkakasunod-sunod, kaya pinili ang “pangunahing” upang hindi ipilit ang kahulugang administratibo na hindi tiyak. Ang μερίς ay isinaling “bahagi,” at nilinaw ng “iyong” na bahagi ito ng Macedonia.
- source_word: κολωνία
  choice: isang kolonya ng Roma
  rationale: Tumutukoy ang salitang hiram na Griyego sa pormal na katayuan ng Filipos bilang kolonya ng Roma; ipinahahayag ang “Roma” upang maging malinaw sa modernong mambabasa.
- source_word: ἦμεν ... διατρίβοντες
  choice: Nanatili kami
  rationale: Ang periphrastic imperfect ay nagpapahiwatig ng patuloy na pananatili; maikli at natural itong naihahayag ng “Nanatili kami.”
- source_word: ἐν ταύτῃ τῇ πόλει
  choice: sa lungsod na ito
  rationale: Pinananatili ng “ito” ang demonstratibong diin ng ταύτῃ.
- source_word: ἡμέρας τινάς
  choice: nang ilang araw
  rationale: Ipinahahayag nito ang di-tiyak na haba ng panahon nang hindi ipinapalagay kung kaunti o marami ang eksaktong bilang.
theological_decisions:
- issue: Kahulugan ng πρώτη sa paglalarawan sa Filipos
  choice: isang pangunahing lungsod
  alternative: ang unang lungsod
  rationale: Mahirap ang pariralang Griyego at hindi tiyak kung ang πρώτη ay tumutukoy sa ranggo, katanyagan, o pagkakasunod-sunod. Iniiwasan ng “pangunahing” ang isang tiyak ngunit pinagtatalunang pahayag tungkol sa katayuang administratibo, habang inilalagay sa talababa ang mas literal na posibilidad.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Filipos” at “Macedonia” bilang pamilyar na mga anyo sa saling biblikal. Iniwasan ang teknikal na “distrito” dahil hindi tiyak ang eksaktong katangiang administratibo ng μερίς dito; ang paliwanag tungkol sa hirap ng parirala ay pinanatili sa talababa.
