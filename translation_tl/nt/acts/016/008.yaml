  text: παρελθόντες δὲ τὴν Μυσίαν κατέβησαν εἰς Τρῳάδα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/008.yaml
  text: So[a], passing by Mysia, they went down to Troas.
translation:
  language: tl
  text: At nilampasan[a] nila ang Misia at bumaba sila patungong Troas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dumaan sa Misia” o “nagpatuloy lampas sa Misia.” Maaaring isalin sa ilang magkalapit na paraan ang pandiwaring Griyego; ang diwa ay nagpatuloy sila sa paglalakbay sa halip na huminto roon.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρελθόντες
  choice: nilampasan
  rationale: Ang aorist participle ng παρέρχομαι na may tuwirang layong τὴν Μυσίαν ay nagpapahiwatig na nagpatuloy sila lampas sa rehiyon sa halip na huminto roon. Likas at maikli sa modernong Tagalog ang “nilampasan.”
- source_word: δὲ
  choice: Kaya,
  rationale: Banayad na pang-ugnay ang δέ. Dito, ipinahahayag ng “Kaya” ang pagpapatuloy ng salaysay mula sa naunang talata nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: Μυσίαν
  choice: Misia
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalan ng rehiyon.
- source_word: κατέβησαν
  choice: bumaba sila
  rationale: Pinananatili nito ang direksiyonal na diwa ng καταβαίνω, na maaaring tumukoy sa pagbaba patungo sa baybayin o sa mas mababang lugar.
- source_word: εἰς
  choice: patungong
  rationale: Sa pagsasalaysay ng paglalakbay tungo sa isang lungsod, natural sa Tagalog ang “patungong” bilang pagpapahayag ng destinasyon.
- source_word: Τρῳάδα
  choice: Troas
  rationale: Ginamit ang nakagawiang transliterasyon ng pangalan ng lugar.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang maikling daloy ng salaysay at ang posibleng pagkakaiba sa pag-unawa kung dumaan sila sa loob ng Misia o nilampasan ito.
