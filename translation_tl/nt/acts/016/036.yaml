  source_fidelity: 'Ang pangkalahatang diwa ay tapat sa Griyego: iniulat ng δεσμοφύλαξ ang mensahe ng mga στρατηγοί kay Pablo, at iniutos/ibinalita ang pagpapalaya at mapayapang pag-alis. Gayunman, ang “mga pinuno ng lungsod” ay masyadong malawak para sa στρατηγοί, na tumutukoy sa mga opisyal na mahistrado ng Filipos. Ang “na” sa “palayain na kayo” ay maaari ring magdagdag ng aspektong hindi tahasang nasa sugnay na Griyego.'
  naturalness: Natural ang estruktura ng tuwirang pananalita. Mas malinaw at mas maayos ang pagkakasunod sa “Kaya lumabas kayo ngayon at umalis nang payapa,” upang ang “ngayon” ay hindi kumapit nang alanganin sa “lumabas na kayo.”
  terminology: “Bantay ng bilangguan” at “Pablo” ay angkop. Mas tumpak na pangunahing salin ang “mga mahistrado” para sa στρατηγοί; maaaring ipaliwanag sa talababa ang teknikal na “mga pretor.”
  issues:
