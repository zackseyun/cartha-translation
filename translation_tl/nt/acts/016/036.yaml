  to: 'At ipinaalam ng bantay ng bilangguan kay Pablo ang mga salitang ito: “Nagpasabi ang mga mahistrado[a] na palayain kayo.[b] Kaya lumabas kayo ngayon at umalis nang payapa.”'
  rationale: Pinalitan ang pangkalahatang “mga pinuno ng lungsod” ng “mga mahistrado” upang masalamin ang tiyak na tungkuling sibil ng στρατηγοί nang hindi kinakailangang gamitin sa pangunahing teksto ang teknikal na “mga pretor.” Inalis ang “na” sa sugnay ng pagpapalaya at inayos ang posisyon ng “ngayon” upang maging mas tapat at malinaw ang pagkakasunod ng νῦν οὖν, ἐξελθόντες, at πορεύεσθε. Inayos din ang talababa upang hindi nito ipagpalagay na ang ipinadala ay kinakailangang isang “utos,” bagaman posible ito sa konteksto.
