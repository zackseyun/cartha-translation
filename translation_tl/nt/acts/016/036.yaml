  text: ἀπήγγειλεν δὲ ὁ δεσμοφύλαξ τοὺς λόγους ⸀τούτους πρὸς τὸν Παῦλον, ὅτι Ἀπέσταλκαν οἱ στρατηγοὶ ἵνα ἀπολυθῆτε· νῦν οὖν ἐξελθόντες πορεύεσθε ἐν εἰρήνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/036.yaml
  text: 'And the jailer reported these words to Paul: “The magistrates have sent word that you may be released[a]. So now[b], come out and go in peace.”'
translation:
  language: tl
  text: 'At ipinaalam ng bantay ng bilangguan kay Pablo ang mga salitang ito: “Nagpasabi ang mga mahistrado[a] na palayain kayo.[b] Kaya lumabas kayo ngayon at umalis nang payapa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga mahistrado” ay salin ng στρατηγοί, ang mga awtoridad sibil ng Filipos; sa mas teknikal na katawagan, “mga pretor.”
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin, “Nagpadala ang mga mahistrado ng mensahe na palayain kayo.” Walang tahasang layon ang “nagpadala” sa Griyego; ipinahihiwatig ng konteksto na mensahe o utos ang ipinadala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: ipinaalam
  rationale: Likas na Filipino para sa paghahatid o pag-uulat ng mensaheng natanggap, nang hindi labis na pormal.
- source_word: δεσμοφύλαξ
  choice: bantay ng bilangguan
  rationale: Malinaw at karaniwang katawagan sa taong namamahala at nagbabantay sa bilangguan.
- source_word: τοὺς λόγους τούτους
  choice: ang mga salitang ito
  rationale: Pinananatili ang kongkretong anyo ng Griyego at natural pa rin sa salaysay.
- source_word: Ἀπέσταλκαν
  choice: Nagpasabi
  rationale: Ipinahihiwatig ng pandiwa na nagpadala ang mga pinuno ng mensahe o utos; likas na ipinapahayag ito sa Filipino sa pamamagitan ng “nagpasabi.”
- source_word: οἱ στρατηγοὶ
  choice: ang mga pinuno ng lungsod
  rationale: Tumutukoy sa mga awtoridad sibil ng Filipos. Mas madaling maunawaan ito kaysa sa teknikal na “mga pretor” o “mga mahistrado.”
- source_word: ἵνα ἀπολυθῆτε
  choice: na palayain na kayo
  rationale: Ipinapahayag ang nilalaman o layunin ng ipinadalang utos at ang paglaya mula sa pagkakabilanggo.
- source_word: νῦν οὖν
  choice: Kaya ... ngayon
  rationale: Natural na pinananatili ang kapuwa panghinuha ng οὖν at ang agarang panahong ipinahihiwatig ng νῦν.
- source_word: ἐξελθόντες
  choice: lumabas na kayo
  rationale: Bagaman anyong participle, bahagi ito ng sunod-sunod na tagubilin at likas na isinasalin bilang utos sa Filipino.
- source_word: πορεύεσθε
  choice: umalis
  rationale: Payak at kasalukuyang Filipino para sa pagyaon o pag-alis mula sa lugar.
- source_word: ἐν εἰρήνῃ
  choice: nang payapa
  rationale: Natural na katumbas ng idyomang tumutukoy sa mapayapa at ligtas na pag-alis.
theological_decisions:
- issue: Lakas ng ἵνα ἀπολυθῆτε bilang pahintulot, utos, o layunin
  choice: na palayain na kayo
  alternative: upang palayain kayo; maaari na kayong palayain
  rationale: Hindi tahasang nilulutas ng Griyego kung ito ay pormal na pahintulot o utos. Ang pangunahing salin ay natural at medyo bukas, habang inilalahad sa talababa ang posibleng mas literal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bantay ng bilangguan” at “mga pinuno ng lungsod” sa halip na mas teknikal o di-pangkaraniwang mga katawagan. Pinanatili ang tuwirang pananalita at ang maikli, opisyal na himig ng mensahe.
