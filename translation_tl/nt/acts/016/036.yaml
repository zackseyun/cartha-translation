  - severity: low
    issue: Ang “palayain na kayo” ay may dagdag na diin ng pagkaapurahan o “already/now” sa sugnay ng pagpapalaya.
    rationale: Ang νῦν ay kasunod ng pahayag ng mga mahistrado at mas malinaw na maipapakita sa kasunod na “Kaya ... ngayon.” Ang “palayain kayo” ay sapat para sa ἵνα ἀπολυθῆτε.
