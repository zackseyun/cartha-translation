base_translation:
  language: en
  yaml_path: translation/nt/acts/016/024.yaml
  text: He[a], having received such an order[b], threw them into the inner prison and secured their feet in the stocks.
translation:
  language: tl
  text: Pagkatanggap niya ng gayong utos, itinapon niya sila sa panloob na bahagi ng bilangguan[a] at ipiniit ang kanilang mga paa sa pangawan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pinakaloob na bilangguan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa kahoy”; tumutukoy ito rito sa kagamitang kahoy na pang-ipit o panggapos sa mga paa ng bilanggo.
    reason: cultural_note
lexical_decisions:
- source_word: παραγγελίαν τοιαύτην
  choice: gayong utos
  rationale: Ang παραγγελία ay utos o tagubilin mula sa may awtoridad. Likas at tuwiran sa modernong Filipino ang “gayong utos.”
- source_word: λαβὼν
  choice: pagkatanggap
  rationale: Ipinahihiwatig ng aorist participle na naunang natanggap ang utos bago isinagawa ang pangunahing kilos; malinaw itong naipapahayag ng “pagkatanggap.”
- source_word: ἔβαλεν
  choice: itinapon
  rationale: Ang βάλλω ay may pangunahing diwang “ihagis” o “itapon.” Pinananatili ng “itinapon” ang marahas na himig ng pagtrato sa kanila, sa halip na palambutin ito bilang simpleng “inilagay.”
- source_word: ἐσωτέραν φυλακήν
  choice: loob na bahagi ng bilangguan
  rationale: Ang ἐσωτέραν ay pahambing at tumutukoy sa mas panloob at mas ligtas na bahagi ng bilangguan. Iniiwasan ng saling ito na tiyakang gawing pasukdol ang salita.
- source_word: ἠσφαλίσατο
  choice: ipiniit
  rationale: Sa konteksto ng paglalagay ng mga paa sa kagamitang panali, likas na ipinahahayag ng “ipiniit” ang pagtiyak na hindi makakawala ang mga bilanggo.
- source_word: τοὺς πόδας αὐτῶν
  choice: ang kanilang mga paa
  rationale: Tuwirang katumbas ito ng parirala at hindi pinalalawak ang πούς upang mangahulugang buong mga binti.
- source_word: εἰς τὸ ξύλον
  choice: sa pangawan
  rationale: Literal na “sa kahoy,” ngunit sa kontekstong ito ang ξύλον ay isang kagamitang kahoy na pang-ipit o panggapos sa mga paa. Ang “pangawan” ang maikli at angkop na katawagang Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang marahas na puwersa ng “itinapon,” habang ang “loob na bahagi” ay hindi labis na nagpapasya kung pahambing o pasukdol ang tinutukoy. Ang mga panandang talababa ay inilagay sa mismong mga pariralang nililinaw ng mga ito.
