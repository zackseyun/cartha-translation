  register: Modernong Filipino Tagalog na natural at marangal ang ginamit. Pinili ang malinaw ngunit matinding mga pandiwang “sinunggaban” at “kinaladkad” upang mapanatili ang puwersa ng salaysay. Iniwasan ang teknikal o denominasyonal na pananalita.
