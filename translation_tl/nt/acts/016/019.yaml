  - marker: a
    text: Sa literal, “lumabas na ang pag-asa sa kanilang pagkakakitaan.” Maaari ring isalin, “nawala na ang pag-asa nilang makinabang.”
    reason: lexical_alternative
  - marker: b
    text: Pangkalahatang salita ang isinaling “mga pinuno” para sa mga awtoridad ng lungsod; mas tiyak na katawagan ang ginagamit sa kasunod na talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι αὐτῆς
  choice: mga amo niya
  rationale: Sa konteksto, tumutukoy ito sa mga taong may pagmamay-ari at kapangyarihan sa aliping babae. Likas sa modernong Tagalog ang “mga amo niya” at malinaw nitong ipinahihiwatig ang mapagsamantalang ugnayan.
- source_word: ἐξῆλθεν
  choice: naglaho na
  rationale: Ipinahahayag ng aorist na ganap nang nawala ang inaasahan nilang kita. Mas natural ang “naglaho na” kaysa sa literal na “lumabas na,” habang itinatala sa talababa ang imahen at posibleng alingawngaw ng naunang paglabas ng espiritu.
- source_word: ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν
  choice: ang pag-asa nilang kumita
  rationale: Pinananatili ng “pag-asa” ang ἐλπίς, at ipinapahayag ng “kumita” ang kontekstuwal na diwa ng ἐργασία bilang pagkakakitaan o pakinabang, hindi lamang paggawa.
- source_word: ἐπιλαβόμενοι
  choice: sinunggaban nila
  rationale: Ipinakikita ng “sinunggaban” ang biglaan at marahas na pagdakip na ipinahihiwatig ng pandiwaring Griyego.
- source_word: εἵλκυσαν
  choice: kinaladkad
  rationale: Tumpak na ipinahahayag ng “kinaladkad” ang sapilitang paghila kina Pablo at Silas.
- source_word: ἀγορὰν
  choice: liwasang-bayan
  rationale: Ang ἀγορά ay hindi lamang pamilihan kundi sentrong pampubliko at pansibiko. Ang “liwasang-bayan” ay malinaw sa konteksto ng pagdadala sa kanila sa mga awtoridad.
- source_word: ἐπὶ τοὺς ἄρχοντας
  choice: sa harap ng mga pinuno
  rationale: Pangkalahatang katawagan ang ἄρχοντες para sa mga pinunong pansibiko. Iniingatan ng salin ang pagkakaiba nito sa mas tiyak na katawagang ginagamit sa kasunod na talata.
