  text: But when her masters saw that their hope of profit had gone out[a], they seized Paul and Silas and dragged them into the marketplace before the rulers[b],
translation:
  language: tl
  text: Ngunit nang makita ng mga amo niya na naglaho na ang pag-asa nilang kumita[a], sinunggaban nila sina Pablo at Silas at kinaladkad nila ang mga ito sa liwasang-bayan, sa harap ng mga pinuno[b].
