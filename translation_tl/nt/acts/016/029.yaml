  text: αἰτήσας δὲ φῶτα εἰσεπήδησεν καὶ ἔντρομος γενόμενος προσέπεσεν τῷ Παύλῳ καὶ ⸀τῷ Σιλᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/029.yaml
  text: Then[a], asking for lights, he rushed in, and trembling with fear he fell down before Paul and Silas[c][b],
translation:
  language: tl
  text: Pagkatapos, humingi siya ng mga ilaw at biglang sumugod papasok. Nanginginig sa takot, bumagsak siya sa harap nina Pablo at Silas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpatirapa siya sa harap nina Pablo at Silas.” Ang kilos ay nagpapahiwatig ng takot, pagsusumamo, o matinding paggalang, ngunit hindi kinakailangang pagsamba.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Pagkatapos
  rationale: Nagsasaad dito ng pagpapatuloy ng salaysay, hindi ng mariing pagsalungat.
- source_word: αἰτήσας φῶτα
  choice: humingi siya ng mga ilaw
  rationale: Ipinapakita ang kilos na nauna sa mabilis niyang pagpasok at pinananatili ang pangmaramihang φῶτα nang hindi tinutukoy kung mga lampara o sulo ang mga ito.
- source_word: εἰσεπήδησεν
  choice: mabilis na pumasok
  rationale: Natural sa modernong Tagalog at ipinahihiwatig ang biglaan at marahas na pagpasok, nang hindi kinakailangang sabihing literal siyang tumalon.
- source_word: ἔντρομος γενόμενος
  choice: Nanginginig sa takot
  rationale: Likas na salin ng idyomang Griyego na naghahayag kapwa ng matinding takot at pisikal na panginginig.
- source_word: προσέπεσεν τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: nagpatirapa siya sa harap nina Pablo at Silas
  rationale: Malinaw na inilalarawan ang pagbagsak o pagyukod sa harap nila bilang kilos ng matinding takot at pagsusumamo, ngunit hindi ito tahasang tinatawag na pagsamba.
theological_decisions:
- issue: Ang kahulugan ng kilos ng bantay-bilangguan sa harap nina Pablo at Silas
  choice: nagpatirapa siya sa harap nina Pablo at Silas
  alternative: sumamba siya kina Pablo at Silas
  rationale: Maaaring tumukoy ang προσπίπτω sa pagbagsak o pagpapatirapa sa harap ng isang tao dahil sa takot, paggalang, o pagsusumamo. Hindi hinihingi ng konteksto na unawain ito bilang pagsambang panrelihiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maging natural ang daloy habang pinananatili ang pagkakasunod-sunod ng mga kilos sa Griyego.
