  text: Ἀναχθέντες ⸀οὖν ⸀ἀπὸ Τρῳάδος εὐθυδρομήσαμεν εἰς Σαμοθρᾴκην, τῇ ⸀δὲ ἐπιούσῃ εἰς ⸂Νέαν Πόλιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/011.yaml
  text: So[a], after putting out to sea from Troas, we sailed straight to Samothrace, and on the following day to Neapolis,
translation:
  language: tl
  text: Kaya, nang pumalaot kami mula sa Troas, tuwiran kaming naglayag patungong Samotracia, at kinabukasan ay patungong Neapolis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: pagkapanhik namin sa barko
  rationale: Sa kontekstong pandagat, ang ἀνάγω ay tumutukoy sa paglayag o pag-alis sakay ng barko. Ang pariralang ito ay likas sa Filipino at pinananatili ang pagkakasunod ng kilos na ipinahihiwatig ng participle.
- source_word: οὖν
  choice: Kaya
  rationale: Nag-uugnay ang οὖν sa naunang pangyayari at nagpapatuloy sa salaysay; ang “Kaya” ay natural at hindi labis na pormal.
- source_word: ἀπὸ Τρῳάδος
  choice: mula sa Troas
  rationale: Tuwirang ipinahahayag ng ἀπό ang pinanggalingan; pinanatili ang nakaugaliang anyo ng pangalang Troas.
- source_word: εὐθυδρομήσαμεν
  choice: dumiretso kami
  rationale: Ang pandiwa ay nangangahulugang maglayag sa tuwid o direktang ruta. Sa malinaw na kontekstong pandagat, likas na ipinahahayag ng “dumiretso kami” ang direktang paglalakbay nang hindi inuulit ang ideya ng paglalayag.
- source_word: εἰς Σαμοθρᾴκην
  choice: sa Samotracia
  rationale: Ipinahahayag ng εἰς ang destinasyon. Ginamit ang anyong “Samotracia,” na madaling bigkasin at angkop sa ortograpiyang Filipino.
- source_word: τῇ δὲ ἐπιούσῃ
  choice: at kinabukasan
  rationale: Ang pariralang temporal ay nangangahulugang sa sumunod na araw; ang “kinabukasan” ang pinakanatural at maikli sa modernong Filipino, habang ang δέ ay kinakatawan ng “at.”
- source_word: εἰς Νέαν Πόλιν
  choice: sa Neapolis
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa nakaugaliang transliterasyon sa halip na isaling “Bagong Lungsod.”
