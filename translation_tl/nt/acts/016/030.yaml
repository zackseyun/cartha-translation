  text: And after bringing them outside[a], he said, “Sirs[b], what must I do so that I may be saved?”
translation:
  language: tl
  text: Pagkatapos niyang ilabas sila[a], sinabi niya, “Mga ginoo[b], ano ang dapat kong gawin upang maligtas ako?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagkatapos niyang dalhin sila sa labas.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Mga ginoo” ay salin ng Griegong kyrioi bilang magalang na pantawag dito, hindi bilang banal na titulong “Panginoon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προαγαγὼν
  choice: matapos niya silang ilabas
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa κύριος na pandiwang ἔφη. Likas sa modernong Tagalog ang “matapos” para malinaw ang pagkakasunod ng mga kilos.
- source_word: αὐτοὺς ἔξω
  choice: silang ilabas
  rationale: Ipinahihiwatig ng panghalip at ng ἔξω ang pagdadala sa kanila mula sa kinaroroonan nila patungo sa labas. Maikli at natural sa Tagalog ang “ilabas.”
- source_word: ἔφη
  choice: sinabi niya
  rationale: Bagaman imperfect ang anyo ng φημί, karaniwan itong payak na panimula sa tuwirang pananalita sa salaysay; ang “sinabi niya” ang natural na katumbas.
- source_word: Κύριοι
  choice: Mga ginoo
  rationale: Ang vocative plural ng κύριος ay magalang na pantawag dito kina Pablo at Silas, hindi banal na titulong “Panginoon.” Pinananatili ng “Mga ginoo” ang paggalang at ang maramihang bilang.
- source_word: τί με δεῖ ποιεῖν
  choice: ano ang dapat kong gawin
  rationale: Ipinapahayag ng δεῖ ang pangangailangan o nararapat gawin. Ang “dapat kong gawin” ay malinaw at likas, nang hindi dinaragdagan ang tanong.
- source_word: ἵνα σωθῶ
  choice: upang maligtas ako
  rationale: Pinananatili ng “upang” ang layunin o kinalabasang ipinahihiwatig ng ἵνα, at pinananatili ng “maligtas ako” ang balintiyak na tinig ng σωθῶ.
theological_decisions:
- issue: Kahulugan ng σωθῶ sa tanong ng tagapagbantay
  choice: maligtas
  alternative: mailigtas; masagip
  rationale: Maaaring tumukoy ang σώζω sa pagsagip mula sa panganib o sa kaligtasan sa mas malawak na espirituwal na diwa. Dahil sinusundan ang tanong ng sagot sa talata 31, ang “maligtas” ang pinakaangkop, habang hindi nito lubusang inaalis ang mas malawak na saklaw ng salita.
- issue: Diwa ng Κύριοι bilang pantawag
  choice: Mga ginoo
  alternative: Mga panginoon
  rationale: Sa kontekstong ito, magalang na panlipunang pantawag ang Κύριοι sa dalawang tao, hindi pagkilala sa kanila bilang banal na Panginoon. Iniiwasan ng salin ang maling teolohikal na pahiwatig.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang ayos ng salaysay, ang magalang na maramihang pantawag, at ang balintiyak na diwa ng “maligtas,” nang hindi nagpasok ng natatanging doktrinang denominasyonal.
