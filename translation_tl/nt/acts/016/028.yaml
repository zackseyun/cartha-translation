  text: But Paul shouted with a loud voice[a], saying, “Do not do yourself any harm, for we are all here.”
translation:
  language: tl
  text: Ngunit sumigaw nang malakas si Pablo, “Huwag kang gumawa ng anuman na makapipinsala sa iyong sarili[a], sapagkat narito kaming lahat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “Huwag mong saktan ang iyong sarili.” Mas malawak ang pahayag sa Griyego: “Huwag kang gumawa ng anumang masama sa iyong sarili,” ngunit sa konteksto ay tumutukoy ito sa balak ng bantay na saktan ang sarili niya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφώνησεν
  choice: sumigaw
  rationale: Ipinahihiwatig ng pandiwa at ng kasunod na φωνῇ μεγάλῃ ang malakas at apurahang pagtawag ni Pablo.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ng δέ ang bahagyang pagsalungat sa balak gawin ng bantay sa naunang talata.
- source_word: φωνῇ μεγάλῃ
  choice: nang malakas
  rationale: Natural itong pagpapahayag sa modernong Tagalog ng paraan ng pagsigaw, nang hindi inuulit ang ideya ng tinig.
- source_word: λέγων
  choice: direktang ipinakilala ang sipi
  rationale: Sa Tagalog, mas natural na sundan agad ng tuwirang sinabi ang pandiwang “sumigaw” kaysa idagdag pa ang “na sinasabi.”
- source_word: Μηδὲν πράξῃς σεαυτῷ κακόν
  choice: Huwag kang gumawa ng anumang masama sa iyong sarili
  rationale: Pinananatili nito ang malawak na diwa ng κακόν at ang reflexive na seautō, habang malinaw na tumutukoy sa agarang panganib na saktan ng bantay ang sarili niya.
- source_word: ἅπαντες
  choice: lahat
  rationale: Ipinahahayag nito ang kabuuan ng mga taong naroon, gaya ng diin ng ἅπαντες.
- source_word: γάρ
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan kung bakit hindi dapat saktan ng bantay ang sarili niya.
- source_word: ἐνθάδε
  choice: narito
  rationale: Maikli at natural itong katumbas ng pang-abay na tumutukoy sa lugar.
- source_word: ὁ Παῦλος
  choice: si Pablo
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalan at ang angkop na pantukoy sa pangalang pantangi.
