  source_fidelity: 'Tumpak ang pangunahing diwa ng draft: apurahang pagsigaw ni Pablo, ang pagbabawal na saktan o gawan ng masama ang sarili, at ang dahilan na naroon pa ang lahat. Gayunman, ang “gumawa ng anumang masama sa iyong sarili” ay maaaring unang maunawaan bilang paggawa ng moral na kasamaan sa sarili, sa halip na anumang gawang makapipinsala sa sarili. Ang rebisyon ay mas malinaw na naghahatid ng saklaw ng Griyegong μήδεν ... κακόν nang hindi nililimitahan ito sa isang tiyak na paraan ng pananakit.'
