id: ACT.16.6
reference: Acts 16:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Διῆλθον δὲ τὴν Φρυγίαν ⸀καὶ Γαλατικὴν χώραν, κωλυθέντες ὑπὸ τοῦ ἁγίου πνεύματος λαλῆσαι τὸν λόγον ἐν τῇ Ἀσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/006.yaml
  text: And they passed through the region of Phrygia and Galatia[b][a], having been forbidden by the Holy Spirit to speak the word in Asia.
translation:
  language: tl
  text: Dumaan sila sa rehiyon ng Frigia at Galacia[b], matapos silang pagbawalan ng Banal na Espiritu na ipahayag ang salita sa Asia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Asia” rito ay ang lalawigang Romano sa kanlurang bahagi ng Asia Minor, hindi ang kontinente ng Asia sa makabagong gamit.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “sa rehiyong Frigio at Galacio.” Maaaring unawain ang pagkakabuo ng pariralang Griyego bilang isang katawagan para sa iisang rehiyon.'
    reason: alternative_reading
lexical_decisions:
- source_word: Διῆλθον
  choice: dumaan sila
  rationale: Ipinahahayag ng aorist ng διέρχομαι ang paglalakbay na dumaraan sa isang lugar; natural at tuwiran sa modernong Tagalog ang “dumaan sila.”
- source_word: δὲ
  choice: At
  rationale: Banayad na pang-ugnay ito na nagpapatuloy sa salaysay; hindi ito kailangang bigyan ng mas mabigat na diwa.
- source_word: τὴν Φρυγίαν καὶ Γαλατικὴν χώραν
  choice: sa rehiyon ng Frigia at Galacia
  rationale: Isinasalin ang χώρα bilang “rehiyon” at pinananatiling madaling maunawaan ang dalawang heograpikong pangalan, habang inilalahad sa talababa ang posibleng pagbasa na iisang panrehiyong katawagan ang buong parirala.
- source_word: κωλυθέντες
  choice: sapagkat pinagbawalan sila
  rationale: Ang aorist passive participle ay nagsasaad na pinigil o pinagbawalan sila. Ginawang sugnay na may “sapagkat” upang maging natural sa Tagalog at ipakita na ang pagbabawal ang dahilan kung bakit sila dumaan sa nasabing rehiyon.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: ng Banal na Espiritu
  rationale: Malinaw na itinatangi ng parirala ang Banal na Espiritu bilang gumaganap sa pagbabawal.
- source_word: λαλῆσαι
  choice: na ipahayag
  rationale: Bagaman literal na “magsalita,” ang konteksto ng “salita” bilang mensaheng Kristiyano ay likas na naipapahayag sa Tagalog sa pandiwang “ipahayag,” nang hindi ito pinakikitid tungo sa teknikal na “mangaral.”
- source_word: τὸν λόγον
  choice: ang salita
  rationale: Pinananatili ang karaniwang bokabularyo ng Lucas–Mga Gawa at iniiwasang tahasang paliitin ito sa “ebanghelyo,” bagaman iyon ang mensaheng tinutukoy sa konteksto.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: sa Asia
  rationale: Pinananatili ang makasaysayang pangalang heograpiko at nililinaw sa talababa na lalawigang Romano ito, hindi ang modernong kontinente.
theological_decisions:
- issue: Ang gumaganap sa pagbabawal at ang pagkakakilanlan ng Espiritu
  choice: ng Banal na Espiritu
  alternative: ng banal na espiritu
  rationale: Ang artikulo at pang-uri sa pariralang Griyego, kasama ng gamit sa Lucas–Mga Gawa, ay tumutukoy sa Banal na Espiritu bilang tiyak na banal na gumaganap. Hindi nagdaragdag ang salin ng paliwanag na lampas sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Frigia,” “Galacia,” at “Asia” bilang karaniwang anyong Filipino ng mga pangalang heograpiko. Inayos ang participial construction bilang sugnay na sanhi para sa natural na daloy, habang pinananatili ang pangunahing ugnayan ng mga pangyayari.
