id: ACT.16.7
reference: Acts 16:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐλθόντες ⸀δὲ κατὰ τὴν Μυσίαν ἐπείραζον ⸀εἰς τὴν Βιθυνίαν ⸀πορευθῆναι καὶ οὐκ εἴασεν αὐτοὺς τὸ πνεῦμα ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/007.yaml
  text: But when they came to Mysia[a], they were trying to go into Bithynia, and the Spirit of Jesus did not permit them.
translation:
  language: tl
  text: Ngunit pagdating nila sa may Misia[a], sinikap nilang pumunta sa Bitinia, pero hindi sila pinahintulutan ng Espiritu ni Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malapit sa Misia” o “sa kahabaan ng Misia.” Malamang na tumutukoy ang pariralang Griyego sa pagdating nila sa hangganang rehiyon ng Misia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες δὲ
  choice: Ngunit pagdating nila
  rationale: Ang aorist participle ay may temporal na diwa, at ang δέ ay nagpapahiwatig ng banayad na paglipat o pagsalungat sa naunang salaysay.
- source_word: κατὰ τὴν Μυσίαν
  choice: sa may Misia
  rationale: Pinananatili ng “sa may” ang heograpikong kalabuan ng κατά, na maaaring tumukoy sa pagdating sa paligid, hangganan, o kahabaan ng Misia, nang hindi tiyak na sinasabing pumasok sila sa lalawigan.
- source_word: ἐπείραζον
  choice: sinikap nilang
  rationale: Ipinahahayag nito ang tangkang pagkilos; ang aspektong imperfective ay makikita sa pagkilos na kanilang tinangka ngunit hindi natuloy.
- source_word: εἰς τὴν Βιθυνίαν πορευθῆναι
  choice: pumunta sa Bitinia
  rationale: Natural itong Filipino para sa nilalayong paglalakbay patungo at papasok sa rehiyon; hindi kailangang ulitin ang diwang “papasok” dahil malinaw na ito sa konteksto.
- source_word: οὐκ εἴασεν αὐτοὺς
  choice: hindi sila pinahintulutan
  rationale: Tumpak na ipinapahayag ang hindi pagpapahintulot nang hindi pinatitindi sa mas malakas na “pinagbawalan.”
- source_word: τὸ πνεῦμα Ἰησοῦ
  choice: ang Espiritu ni Jesus
  rationale: Pinananatili ang di-pangkaraniwang tahasang ugnayan kay Jesus sa tekstong Griyego at hindi ito pinapalitan ng mas pamilyar na “Banal na Espiritu.”
theological_decisions:
- issue: Pag-render sa τὸ πνεῦμα Ἰησοῦ
  choice: ang Espiritu ni Jesus
  alternative: ang Banal na Espiritu; ang Espiritu
  rationale: Tahasang nasa Griyego ang Ἰησοῦ. Dapat panatilihin ang kristolohikal na pananalita ng talata sa halip na iayon ito sa mas karaniwang katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa may Misia” upang maging natural habang pinananatili ang heograpikong kalabuan; pinanatili rin ang “Espiritu ni Jesus” dahil iyon ang tahasang anyo ng Griyego.
