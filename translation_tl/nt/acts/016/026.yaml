  text: ἄφνω δὲ σεισμὸς ἐγένετο μέγας ὥστε σαλευθῆναι τὰ θεμέλια τοῦ δεσμωτηρίου, ἠνεῴχθησαν ⸀δὲ παραχρῆμα αἱ θύραι πᾶσαι, καὶ πάντων τὰ δεσμὰ ἀνέθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/026.yaml
  text: Suddenly there was a great earthquake[a], so that the foundations of the prison were shaken; and immediately all the doors were opened[b], and everyone's chains were unfastened.
translation:
  language: tl
  text: Biglang lumindol nang malakas, kaya nayanig ang mga pundasyon ng bilangguan. Agad na bumukas ang lahat ng pinto, at nakalag ang mga tanikala ng bawat isa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lumuwag ang mga gapos ng bawat isa.” Ang salitang Griyego na δεσμά ay maaaring tumukoy sa “mga gapos” o “mga tanikala,” at ang ἀνέθη ay maaaring mangahulugang “lumuwag” o “nakalag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφνω
  choice: Biglang
  rationale: Likas na salin sa makabagong Tagalog para sa bigla at di-inaasahang pangyayari.
- source_word: σεισμὸς ἐγένετο μέγας
  choice: lumindol nang malakas
  rationale: Natural na pariralang Tagalog na malinaw na naghahayag ng isang malakas na lindol, nang hindi dinaragdagan ang antas o epekto nito.
- source_word: ὥστε σαλευθῆναι
  choice: kaya nayanig
  rationale: Ipinahahayag ng ὥστε ang bunga; pinananatili ng “nayanig” ang diwang pasibo ng σαλευθῆναι.
- source_word: τὰ θεμέλια τοῦ δεσμωτηρίου
  choice: ang mga pundasyon ng bilangguan
  rationale: Tuwirang tumutukoy sa mga saligang bahagi ng gusaling pinagkukulungan; karaniwan at marangal ang “bilangguan.”
- source_word: ἠνεῴχθησαν ... αἱ θύραι πᾶσαι
  choice: bumukas ang lahat ng pinto
  rationale: Bagaman pasibo ang anyong Griyego, ang di-transitibong “bumukas” ang pinakanatural sa Tagalog at hindi nagpapasya kung sino ang nagbukas.
- source_word: παραχρῆμα
  choice: Agad
  rationale: Maikli at natural na katumbas ng pangyayaring naganap kaagad.
- source_word: πάντων
  choice: ng bawat isa
  rationale: Pinananatili ang saklaw sa lahat ng mga taong nakagapos nang hindi tahasang idinaragdag ang “mga bilanggo.”
- source_word: τὰ δεσμὰ
  choice: mga tanikala
  rationale: Konkretong katawagan sa mga panggapos sa konteksto ng pagkabilanggo, habang kinikilala sa talababa ang mas malawak na kahulugang “mga gapos.”
- source_word: ἀνέθη
  choice: nakalag
  rationale: Natural na Filipino para sa pagkakaluwag o pagkakatanggal sa pagkakakabit ng mga tanikala, nang hindi ipinahihiwatig na nakatakas na ang mga bilanggo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay sa Filipino. Ginamit ang “bilangguan” bilang karaniwang katawagan; hindi kailangan ng hiwalay na talababa para sa estilistikong alternatibong “piitan.”
