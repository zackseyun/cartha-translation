id: ACT.16.20
reference: Acts 16:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ προσαγαγόντες αὐτοὺς τοῖς στρατηγοῖς εἶπαν· Οὗτοι οἱ ἄνθρωποι ἐκταράσσουσιν ἡμῶν τὴν πόλιν Ἰουδαῖοι ὑπάρχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/020.yaml
  text: And after bringing them before the magistrates[a], they said, “These men are disturbing our city[b], being Jews,”
translation:
  language: tl
  text: At dinala nila ang dalawa sa harap ng mga mahistrado[a] at sinabi, “Ginugulo ng mga lalaking ito ang ating lungsod. Mga Judio[b] sila,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pretor,” ang mga opisyal na namamahala sa isang kolonya ng Roma gaya ng Filipos.
    reason: cultural_note
  - marker: b
    text: O “mga taga-Judea.” Ang salitang Griego ay maaaring tumukoy sa mga Judio sa pangkalahatan o sa mga taong mula sa Judea; dito, mas angkop ang “mga Judio” dahil etniko at panrelihiyong pagkakakilanlan ang ginagawang batayan ng paratang.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγαγόντες
  choice: dinala nila ... at sinabi
  rationale: Ipinahihiwatig ng aorist participle ang kilos na nauna sa pangunahing pandiwang ‘sinabi.’ Natural sa Tagalog ang magkasunod na ‘dinala ... at sinabi’ habang malinaw pa rin ang ayos ng mga pangyayari.
- source_word: στρατηγοῖς
  choice: mga mahistrado
  rationale: Sa Filipos, isang kolonya ng Roma, tumutukoy ito sa mga pangunahing opisyal ng lungsod. Ang ‘mga mahistrado’ ay malinaw ngunit napapanatili ang historikal na katawagan; ipinaliliwanag sa talababa ang teknikal na alternatibo.
- source_word: ἐκταράσσουσιν
  choice: ginugulo
  rationale: Ipinapahayag ng pandiwa ang matinding panggugulo o paglikha ng kaguluhan. Ang ‘ginugulo’ ay natural at tuwirang paratang sa kasalukuyang kilos.
- source_word: ἡμῶν τὴν πόλιν
  choice: ang ating lungsod
  rationale: Napapanatili ng ‘ating lungsod’ ang mapang-angking retorikang sibiko ng mga nagsasakdal.
- source_word: Ἰουδαῖοι
  choice: Mga Judio
  rationale: Sa kontekstong ito, ang termino ay malamang na tumutukoy sa etniko at panrelihiyong pagkakakilanlan nina Pablo at Silas, hindi lamang sa heograpikong pinagmulan.
- source_word: ὑπάρχοντες
  choice: sila
  rationale: Ang hiwalay na pangungusap na ‘Mga Judio sila’ ay likas sa Tagalog at pinananatili ang kaugnayan ng kanilang pagkakakilanlan sa paratang nang hindi tahasang pinipili kung ito ay sanhi o dagdag na kalagayan.
- source_word: Οὗτοι οἱ ἄνθρωποι
  choice: mga lalaking ito
  rationale: Partikular na tumutukoy ang panlalaking maramihan kina Pablo at Silas; tumpak at natural ang ‘mga lalaking ito.’
- source_word: αὐτοὺς
  choice: ang dalawa
  rationale: Tumutukoy ang panghalip kina Pablo at Silas. Nililinaw ng ‘ang dalawa’ ang reperente sa Tagalog nang hindi inuulit ang kanilang mga pangalan.
theological_decisions:
- issue: Pagbibigay-kahulugan sa Ἰουδαῖοι sa isang mapanirang paratang na etniko at panrelihiyon
  choice: Mga Judio
  alternative: Mga taga-Judea
  rationale: Sa Filipos, ang paratang ay naghaharap kina Pablo at Silas bilang mga kabilang sa bayang Judio na naiiba sa lokal na pagkakakilanlang Romano. Iniulat lamang ng talata ang mapanlabang pananalita ng mga nagsasakdal; hindi ito hatol ng tagapagsalaysay laban sa lahat ng Judio.
- issue: Ugnayan ng ὑπάρχοντες sa paratang
  choice: Mga Judio sila
  alternative: dahil mga Judio sila
  rationale: Hindi tahasang nilalagyan ng ‘dahil’ upang mapanatili ang bahagyang kalabuan kung ang participle ay nagbibigay ng dahilan o kalakip na mapanirang paglalarawan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘mahistrado’ bilang pormal ngunit karaniwang nauunawaang katawagan, at pinanatiling tuwiran ang mapanlabang tono bilang iniulat na pananalita, hindi bilang pagsang-ayon ng tagapagsalaysay.
