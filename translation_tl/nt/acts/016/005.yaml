base_translation:
  language: en
  yaml_path: translation/nt/acts/016/005.yaml
  text: So the churches were being strengthened in the faith and were increasing in number day by day[a].
translation:
  language: tl
  text: Kaya, patuloy na pinatatatag ang mga iglesya sa pananampalataya, at dumarami ang kanilang bilang araw-araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain na “pinatatatag sa kanilang pananampalataya.” Ang pariralang Griyego ay maaaring tumukoy sa pananampalatayang Kristiyano bilang magkakasamang paniniwala at pamumuhay, o sa pananampalataya sa mas pangkalahatang diwa.
    reason: alternative_reading
lexical_decisions:
- source_word: αἱ μὲν οὖν
  choice: Kaya
  rationale: Nagsisilbi itong buod at lohikal na bunga ng naunang salaysay. Likas sa modernong Tagalog ang “Kaya” at hindi nito labis na binibigyang-diin ang μέν, na walang tahasang katapat na pagsalungat dito.
- source_word: ἐκκλησίαι
  choice: mga iglesya
  rationale: Tumutukoy ito sa mga lokal na pamayanang Kristiyano. Karaniwan at malinaw sa modernong gamit ang “mga iglesya,” samantalang maaaring magpahiwatig lamang ng isang pagtitipon ang “mga kapulungan.”
- source_word: ἐστερεοῦντο
  choice: patuloy na pinatatatag
  rationale: Ipinapahayag ng imperfect passive ang nagpapatuloy na pagkilos noong nakaraan. Napananatili ng “patuloy na pinatatatag” ang aspektong ito at ang tinig na balintiyak.
- source_word: τῇ πίστει
  choice: sa pananampalataya
  rationale: Sinasaklaw ng “pananampalataya” kapwa ang pananampalatayang pinanghahawakan ng pamayanang Kristiyano at, ayon sa posibleng pagbasa, ang pagtitiwala ng mga mananampalataya. Hindi likas sa Tagalog na ipakita sa parehong paraan ang tiyak na artikulong Griyego, kaya nililinaw sa talababa ang tunay na kalabuan.
- source_word: ἐπερίσσευον τῷ ἀριθμῷ
  choice: dumarami sila
  rationale: Ipinahihiwatig ng imperfect ang patuloy na pagdami, at ipinapahayag ng pariralang may dative na ang paglago ay ayon sa bilang. Likas at tuwiran itong naihahatid ng “dumarami sila.”
- source_word: καθ’ ἡμέραν
  choice: araw-araw
  rationale: Ipinahihiwatig ng parirala ang paulit-ulit at tuloy-tuloy na pagdami sa bawat araw.
theological_decisions:
- issue: Kahulugan ng πίστις na may tiyak na artikulo
  choice: pananampalataya bilang pinanghahawakang pananampalataya ng pamayanang Kristiyano
  alternative: pananampalataya bilang personal na pagtitiwala ng mga mananampalataya
  rationale: Mas pinapaboran ng artikulo at ng konteksto tungkol sa mga iglesya ang panlahatan o pangkomunidad na kahulugan, ngunit tunay na posible rin ang mas pangkalahatang kahulugan ng pagtibay sa pananampalataya. Dahil hindi natural na maipakita sa Tagalog ang pagkakaibang ito sa pamamagitan lamang ng artikulo, pinananatili ang “pananampalataya” sa pangunahing teksto at ipinaliliwanag ang dalawang posibilidad sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “iglesya” bilang malinaw at karaniwang katawagan sa lokal na pamayanang Kristiyano. Ang “patuloy na” ay nagpapakita ng nagpapatuloy na kilos ng mga imperfect verb, at ang pagkakabuo ng pangungusap ay nananatiling natural sa karaniwang mambabasa.
