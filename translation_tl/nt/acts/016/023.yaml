  yaml_path: translation/nt/acts/016/023.yaml
  text: And after they had inflicted many blows on them[a], they threw them into prison[b], ordering the jailer to keep them securely.
translation:
  language: tl
  text: Matapos silang paluin nang maraming beses[a], itinapon sila sa bilangguan[b], at inutusan ang tagapagbantay ng bilangguan na mahigpit silang bantayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hampasin nang maraming beses.” Maraming ipinataw na hampas ang tinutukoy ng Griyego, ngunit hindi sinasabi rito kung anong kasangkapan ang ginamit.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kulungan”; ang salitang Griyego ay pangkalahatang tumutukoy sa isang lugar ng pagkakapiit.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάς ... πληγὰς
  choice: hagupitin nang maraming ulit
  rationale: Ipinahahayag nito ang maraming hampas na ipinataw sa kanila, nang hindi tinutukoy ang eksaktong pamalo o kasangkapan.
- source_word: τε
  choice: at
  rationale: Nag-uugnay ito sa pangyayaring nauna at sa pagpapatuloy ng salaysay.
- source_word: ἐπιθέντες
  choice: Matapos ... hagupitin
  rationale: Kasama ng πληγάς, ang literal na diwang 'ipataw' ay idyomatikong tumutukoy sa pagpapataw ng mga hampas; malinaw rin ang relasyong temporal ng participle sa pangunahing pandiwa.
- source_word: ἔβαλον εἰς φυλακήν
  choice: itinapon sila sa bilangguan
  rationale: Pinananatili ng 'itinapon' ang marahas at mariing dating ng βάλλω, habang ang 'bilangguan' ay natural na tawag sa lugar ng pagkakakulong.
- source_word: φυλακήν
  choice: bilangguan
  rationale: Sa konteksto, tumutukoy ito sa isang lugar ng pagkakapiit sa ilalim ng bantay.
- source_word: παραγγείλαντες
  choice: inutusan
  rationale: Ipinakikita nito ang awtoritatibong tagubilin kasabay ng pagpapakulong.
- source_word: δεσμοφύλακι
  choice: bantay-bilangguan
  rationale: Malinaw at kasalukuyang katawagan ito sa opisyal na responsable sa mga bilanggo.
- source_word: ἀσφαλῶς
  choice: mabuti upang hindi makatakas
  rationale: Sa konteksto ng pagbabantay sa bilanggo, ang diwa ay mahigpit o tiyak na pagkakapiit, hindi ang kaligtasan ng mga bilanggo.
- source_word: τηρεῖν
  choice: bantayan
  rationale: Natural itong tumutukoy sa pag-iingat at pagbabantay sa mga bilanggo.
- source_word: αὐτούς
  choice: sila / silang
  rationale: Tumutukoy kina Pablo at Silas bilang mga pinalo, ikinulong, at ipinabantay.
