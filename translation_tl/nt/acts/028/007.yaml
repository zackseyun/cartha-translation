  text: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον ὑπῆρχεν χωρία τῷ πρώτῳ τῆς νήσου ὀνόματι Ποπλίῳ, ὃς ἀναδεξάμενος ἡμᾶς ⸂τρεῖς ἡμέρας⸃ φιλοφρόνως ἐξένισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/007.yaml
  text: In the area around that place there were lands belonging to the chief man of the island[a], named Publius[c][b], who welcomed us and hosted us courteously for three days.
translation:
  language: tl
  text: Sa paligid ng lugar na iyon ay may mga lupain na pag-aari ng nangungunang tao sa pulo[a], na nagngangalang Publio. Malugod niya kaming tinanggap at magiliw na pinatuloy nang tatlong araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pangunahing pinuno ng pulo.” Ang Griyegong parirala ay maaaring isang titulo o tumukoy sa taong may pinakamataas na katayuan sa pulo.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον
  choice: Sa paligid ng lugar na iyon
  rationale: Likas na Filipino para sa pook na nakapalibot sa tinutukoy na lugar; hindi ginawang tahasang temporal ang banayad na pang-ugnay na δέ.
- source_word: ὑπῆρχεν χωρία
  choice: ay may mga lupain
  rationale: Ipinahahayag ang eksistensiyal na diwa ng ὑπῆρχεν at pinananatili ang maramihan at malawak na kahulugan ng χωρία bilang lupang pag-aari.
- source_word: τῷ πρώτῳ τῆς νήσου
  choice: pangunahing pinuno ng pulo
  rationale: Ipinakikita ang mataas o nangungunang katayuan ni Publio nang hindi ipinipilit ang isang tiyak na teknikal na katungkulan.
- source_word: ὀνόματι Ποπλίῳ
  choice: na nagngangalang Publio
  rationale: Natural na pagpapakilala sa pangalan; “Publio” ang nakaugaliang anyong Filipino ng Latin na Publius.
- source_word: ἀναδεξάμενος ἡμᾶς
  choice: Malugod niya kaming tinanggap
  rationale: Ipinahahayag ang pagtanggap sa mga panauhin at ang diwa ng mabuting pakikitungo sa konteksto.
- source_word: τρεῖς ἡμέρας
  choice: nang tatlong araw
  rationale: Natural na Filipino para sa akusatibo ng haba ng panahon.
- source_word: φιλοφρόνως
  choice: magiliw
  rationale: Inilalarawan ang maganda, mabait, at mapagpatuloy na paraan ng pag-asikaso.
- source_word: ἐξένισεν
  choice: pinatuloy
  rationale: Tumpak at maikling salitang Filipino para sa pagpapatira at pag-asikaso sa kanila bilang mga panauhin.
theological_decisions:
- issue: Katayuan ng τῷ πρώτῳ τῆς νήσου
  choice: pangunahing pinuno ng pulo
  alternative: pinakamataas na tao sa pulo
  rationale: Maaaring tumukoy ang parirala sa nangungunang tao o sa isang opisyal na titulo. Pinananatili ng salin ang mataas na katayuan nang hindi nagpapasiya kung eksaktong anong tanggapan ang hawak niya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maiwasan ang mabigat na sunod-sunod na sugnay, habang pinananatili ang ugnayan at ayos ng salaysay.
