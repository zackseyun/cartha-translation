source:
  edition: SBLGNT
  text: Ὅτε δὲ ⸀εἰσήλθομεν εἰς Ῥώμην, ⸂ἐπετράπη τῷ Παύλῳ⸃ μένειν καθ’ ἑαυτὸν σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/016.yaml
  text: When we entered Rome[a], Paul was permitted to stay by himself with the soldier guarding him.
translation:
  language: tl
  text: Nang pumasok kami sa Roma, pinahintulutan si Pablo na manirahang bukod, kasama ang sundalong nagbabantay sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “manatili nang bukod, kasama ang sundalong nagbabantay sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: Nang
  rationale: Ipinahahayag ng ὅτε ang panahong pinangyarihan ng sumunod na pangyayari. Mahinang pang-ugnay lamang dito ang δέ, kaya hindi na ito isinalin nang hiwalay sa natural na Tagalog.
- source_word: εἰσήλθομεν εἰς Ῥώμην
  choice: pumasok kami sa Roma
  rationale: Pinananatili nito ang tuwirang diwa ng pagpasok na taglay ng εἰσέρχομαι at ang unang panauhang maramihan ng pandiwa.
- source_word: ἐπετράπη τῷ Παύλῳ
  choice: pinahintulutan si Pablo
  rationale: Ang balintiyak na ἐπετράπη ay nagsasaad na pinagkalooban si Pablo ng pahintulot. Natural sa Tagalog ang pandiwang nakatuon sa layon na “pinahintulutan si Pablo.”
- source_word: μένειν
  choice: manirahan
  rationale: Sa konteksto ng pananatili ni Pablo sa Roma sa ilalim ng pagbabantay, ang “manirahan” ay natural at maaaring tumukoy sa pagtuloy o pananatili sa isang tirahan.
- source_word: καθ’ ἑαυτόν
  choice: nang bukod
  rationale: Ipinahihiwatig ng parirala na hiwalay o nasa sariling kaayusan si Pablo, hindi na ganap siyang walang kasama, sapagkat kasunod na binabanggit ang sundalong kasama niya.
- source_word: σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ
  choice: kasama ang sundalong nagbabantay sa kanya
  rationale: Malinaw na ipinapahayag ng σύν ang pagsama, at ng kasalukuyang participle ang patuloy na pagbabantay. Pinananatili ng “ang sundalo” ang tiyak na artikulo ng Griyego.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “manirahang bukod” upang maging natural sa konteksto ng tirahan habang hindi ipinahihiwatig na lubos na nag-iisa si Pablo.
