id: ACT.28.19
reference: Acts 28:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀντιλεγόντων δὲ τῶν Ἰουδαίων ἠναγκάσθην ἐπικαλέσασθαι Καίσαρα, οὐχ ὡς τοῦ ἔθνους μου ἔχων τι ⸀κατηγορεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/019.yaml
  text: But because the Jews objected[b][a], I was compelled to appeal to Caesar—not because I had anything to accuse my nation of.
translation:
  language: tl
  text: Ngunit dahil tumutol ang mga Judio[a][b], napilitan akong umapela kay Cesar—hindi dahil mayroon akong anumang paratang laban sa sarili kong bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “habang sinasalungat ako ng mga Judio” o “dahil kinontra ako ng mga Judio.”
    reason: lexical_alternative
  - marker: b
    text: Sa kontekstong legal na ito, ang “mga Judio” ay tumutukoy sa mga Judiong kumokontra at nag-aakusa kay Pablo, hindi sa lahat ng Judio sa pangkalahatan.
    reason: cultural_note
lexical_decisions:
- source_word: ἀντιλεγόντων
  choice: dahil tumutol
  rationale: Ipinapahayag ng genitive absolute ang kalagayang nagtulak sa ginawa ni Pablo. Likas sa modernong Filipino ang “tumutol” at angkop ito sa kontekstong legal, habang pinananatili ang posibilidad ng aktibong pagsalungat.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang bahagyang pagsalungat o paglipat mula sa naunang pahayag.
- source_word: τῶν Ἰουδαίων
  choice: ang mga Judio
  rationale: Tuwirang pinananatili ang pangkalahatang katawagang nasa Griyego, nang hindi dinaragdagan ang espesipikong “mga pinuno.” Nililinaw sa talababa ang saklaw nito sa konteksto.
- source_word: ἠναγκάσθην
  choice: napilitan ako
  rationale: Natural at malinaw na ipinahahayag sa Filipino ang pasibong diwa ng pamimilit o pangangailangan.
- source_word: ἐπικαλέσασθαι Καίσαρα
  choice: umapela kay Cesar
  rationale: Ang parirala ay teknikal na pananalitang legal para sa pagdulog sa emperador. Karaniwan at tiyak sa Filipino ang “umapela kay Cesar.”
- source_word: οὐχ ὡς
  choice: hindi dahil
  rationale: Likas na ipinakikilala nito ang paglilinaw ni Pablo na hindi masamang hangarin laban sa kanyang bayan ang dahilan ng apela.
- source_word: τοῦ ἔθνους μου
  choice: sa sarili kong bayan
  rationale: Ang ἔθνος ay tumutukoy sa sariling sambayanan o bansang etniko ni Pablo. Ang “sarili kong bayan” ay natural at marangal, at malinaw na tumutukoy sa kanyang mga kababayan bilang isang sambayanan.
- source_word: ἔχων τι κατηγορεῖν
  choice: mayroon akong anumang paratang laban sa
  rationale: Pinananatili nito ang legal na diwa ng κατηγορεῖν at malinaw na ipinapahayag na wala siyang sakdal o paratang laban sa kanyang bayan.
theological_decisions:
- issue: Saklaw ng katawagang “ang mga Judio” sa sensitibong kontekstong etniko at panrelihiyon
  choice: Panatilihin sa pangunahing teksto ang “ang mga Judio,” na may kontekstuwal na paglilinaw sa talababa.
  alternative: ang mga pinunong Judio; ang mga Judeano
  rationale: Hindi nililimitahan ng tekstong Griyego ang katawagan sa mga pinuno lamang. Gayunman, sa salaysay na ito tumutukoy ito sa mga Judiong tumututol at nag-aakusa kay Pablo, hindi sa lahat ng Judio sa pangkalahatan.
- issue: Ugnayang lohikal ng genitive absolute ἀντιλεγόντων δὲ τῶν Ἰουδαίων
  choice: dahil tumutol
  alternative: habang sinasalungat ako; nang salungatin ako
  rationale: Sa konteksto, ang pagtutol ang kalagayang nagtulak kay Pablo na umapela. Pinananatili sa talababa ang posibleng mas purong temporal o duratibong pagbasa.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “umapela” bilang kinikilalang terminong legal at “Cesar” bilang titulong nasa tekstong Griyego. Inilagay ang mga marker na [a][b] kaagad pagkatapos ng sensitibo at leksikal na parirala.
