id: ACT.28.8
reference: Acts 28:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐγένετο δὲ τὸν πατέρα τοῦ Ποπλίου πυρετοῖς καὶ ⸀δυσεντερίῳ συνεχόμενον κατακεῖσθαι, πρὸς ὃν ὁ Παῦλος εἰσελθὼν καὶ προσευξάμενος ἐπιθεὶς τὰς χεῖρας αὐτῷ ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/008.yaml
  text: It happened that the father of Publius was lying sick with fevers and dysentery. Paul went in to him[a], and after praying and laying his hands on him, healed him.
translation:
  language: tl
  text: Nagkataong nakahiga dahil sa karamdaman ang ama ni Publio; nilalagnat siya at may disenteriya. Pumasok si Pablo sa kinaroroonan niya, at matapos manalangin at ipatong ang kanyang mga kamay sa kanya, pinagaling niya siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Nagkataong
  rationale: Likas na panimulang salaysay sa Tagalog na naghahayag ng pangyayari nang hindi nagdaragdag ng tahasang panandang panahong wala sa Griyego.
- source_word: τὸν πατέρα τοῦ Ποπλίου
  choice: ang ama ni Publio
  rationale: Natural at tuwirang anyong Tagalog ng ugnayang genitibo.
- source_word: πυρετοῖς
  choice: nilalagnat siya nang pabalik-balik
  rationale: Pinananatili ang diwa ng tahasang maramihang anyo, na malamang ay tumutukoy sa paulit-ulit na pag-atake ng lagnat, sa paraang malinaw sa karaniwang mambabasa.
- source_word: δυσεντερίῳ
  choice: may disenteriya
  rationale: Ang terminong medikal ay tuwirang katumbas at nauunawaan pa rin sa modernong Filipino.
- source_word: συνεχόμενον
  choice: dahil sa karamdaman ... nilalagnat ... at may disenteriya
  rationale: Ipinahihiwatig ng kabuuang parirala na siya ay dinaranas o ginagapos ng mga sakit; inilalahad ito nang natural sa Tagalog nang hindi inuulit ang mabigat na pandiwang 'pinahihirapan.'
- source_word: κατακεῖσθαι
  choice: nakahiga dahil sa karamdaman
  rationale: Pinananatili kapwa ang pisikal na pagkakahiga at ang konteksto ng pagkakasakit, nang hindi labis na ipinapalagay na hindi na siya makabangon.
- source_word: πρὸς ὃν ὁ Παῦλος εἰσελθὼν
  choice: Pumasok si Pablo upang dalawin siya
  rationale: Malinaw na ipinakikita ang pagpasok ni Pablo sa kinaroroonan ng maysakit; ang 'upang dalawin' ay likas na Tagalog para sa paglapit sa isang maysakit sa loob ng isang lugar.
- source_word: προσευξάμενος
  choice: matapos manalangin
  rationale: 'Malinaw na ipinakikita ang pagkakasunod-sunod: nauna ang panalangin sa pangunahing kilos ng pagpapagaling.'
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: ipinatong niya rito ang kanyang mga kamay
  rationale: Tumpak na pinananatili ang karaniwang biblikal na kilos at ang maramihang 'mga kamay.'
- source_word: ἰάσατο αὐτόν
  choice: pinagaling siya
  rationale: Tuwiran at pamilyar na salin ng pandiwang tumutukoy sa pagpapagaling, nang walang dagdag na paliwanag tungkol sa paraan nito.
theological_decisions:
- issue: Kalikasan ng pagpapagaling na ginawa ni Pablo
  choice: Inilahad nang tuwiran ang pagkakasunod ng panalangin, pagpapatong ng mga kamay, at pagpapagaling.
  alternative: Tahasan itong tawaging isang agarang himala o bigyang-kahulugang sakramental ang pagpapatong ng mga kamay.
  rationale: Ipinahahayag ng talata ang pagpapagaling sa pamamagitan ng mapanalanging pagkilos ni Pablo, ngunit hindi nito nilalagyan ng teknikal na katawagan ang paraan, bilis, o teolohikal na mekanismo nito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang 'Publio,' ang nakaugaliang anyong Filipino ng pangalang Publius. Iniwasan ang sobrang teknikal o makalumang ayos, habang pinanatili ang maramihang diwa ng πυρετοῖς sa pariralang 'nang pabalik-balik.'
