  verdict: revise
  source_fidelity: 'Ang pangunahing kahulugan ng Griyego ay naipapahayag, kabilang ang metaporang manhid na puso, kusang pagpikit ng mga mata, at ang serye ng makita–makarinig–makaunawa–manumbalik. Gayunman, ang “Kung hindi, baka” ay hindi malinaw na Tagalog: ang “kung hindi” ay nangangailangan ng isang tahasang kondisyon at ang kasunod na “baka” ay lumilikha ng salungat na lohika. Ang μήποτε ay mas ligtas na katawanin ng “Baka,” habang itinatala sa talababa ang mas mariing diwang “upang huwag.”'
  naturalness: Mas likas ang “mabigat ang kanilang pandinig” kaysa “mabigat silang nakinig sa pamamagitan ng kanilang mga tainga.” Iniiwasan din ng rebisyon ang paulit-ulit at mekanikal na “sa pamamagitan ng,” ngunit pinananatili ang pag-uulit ng mga mata, tainga, at puso na mahalaga sa sipi.
  terminology: Ang “puso,” “bayan,” “manhid,” “manumbalik,” at “pagagalingin” ay angkop sa marangal ngunit modernong Filipino. Ang “manumbalik” ay hindi labis na naglilimita sa ἐπιστρέψωσιν sa isang teknikal o denominasyonal na kahulugan.
  issues:
  - severity: medium
    issue: Hindi malinaw ang “Kung hindi, baka.”
    rationale: Walang hayag na kondisyon na pinagbabatayan ng “Kung hindi,” at ang pagkakasunod nito sa “baka” ay hindi maayos na naghahatid ng μήποτε. Maaari nitong malabo ang layon o iniiwasang kahihinatnan sa sipi.
  - severity: low
    issue: Hindi likas ang “mabigat silang nakinig sa pamamagitan ng kanilang mga tainga.”
    rationale: Bagaman sinusubukan nitong tularan ang metapora ng βαρέως ἤκουσαν, mas karaniwan at malinaw sa Filipino ang “mabigat ang kanilang pandinig,” na pinananatili ang metaporang pandinig.
  - severity: low
