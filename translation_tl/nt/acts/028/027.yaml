    rationale: Ang paliwanag tungkol sa “upang huwag” ay nakalagay sa talababa na nakakabit sa “manumbalik,” samantalang ang tinutukoy nito ay ang naunang pang-ugnay na μήποτε. Dapat itong ikabit sa “Baka.”
