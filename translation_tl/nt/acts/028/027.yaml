id: ACT.28.27
reference: Acts 28:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/027.yaml
  text: For the heart of this people has become dull[a], and with their ears they heard heavily, and they closed their eyes; otherwise they might see with their eyes and hear with their ears and understand with their heart and turn back[b], and I would heal them.
translation:
  language: tl
  text: Sapagkat naging manhid ang puso ng bayang ito[a]; mabigat ang kanilang pandinig, at ipinikit nila ang kanilang mga mata. Baka[b] makakita sila sa kanilang mga mata, makarinig sa kanilang mga tainga, makaunawa sa kanilang puso, at manumbalik[c], at pagagalingin ko sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kumapal” o “naging matigas ang pakiramdam.” Ang Griyego ay literal na tumutukoy sa pagkapal o pagtaba, ngunit ginagamit dito bilang larawan ng pagiging manhid o hindi tumutugon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawain ang pang-ugnay sa mas malakas na diwang “upang huwag silang makakita … makarinig … makaunawa … at manumbalik, at pagalingin ko sila.” Pinananatili ng salin ang kalabuan ng sipi mula kay Isaias.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “bumalik,” “magbalik-loob,” o, ayon sa konteksto, “magsisi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: naging manhid
  rationale: Literal itong tumutukoy sa pagkapal o pagtaba, ngunit metaporikal dito para sa pagkawala ng pagiging sensitibo. Ang “naging manhid” ay likas sa modernong Filipino at pinananatili ang larawan ng espirituwal na kawalan ng pakiramdam.
- source_word: καρδία
  choice: puso
  rationale: Pinananatili ang biblikal na katawagang antropolohikal at ang pagkakaugnay nito sa kasunod na “makaunawa sa pamamagitan ng kanilang puso.”
- source_word: λαοῦ
  choice: bayan
  rationale: Ang “bayan” ay angkop sa kolektibong λαός at sa konteksto ng sipi mula kay Isaias; hindi nito nililimitahan ang diwa sa modernong estadong bansa.
- source_word: βαρέως ἤκουσαν
  choice: mabigat silang nakinig
  rationale: Pinananatili ang di-pangkaraniwang metapora ng “mabigat” habang gumagamit ng naiintindihang Filipino. Ipinahihiwatig nito ang hirap o pag-aatubiling makinig nang hindi ginagawang simpleng kawalan ng pandinig.
- source_word: ἐκάμμυσαν
  choice: ipinikit nila
  rationale: Likas na Filipino para sa sinadyang pagsasara ng mga mata at pinananatili ang aktibong pananagutan ng mga tao sa anyong pandiwa.
- source_word: μήποτε
  choice: Kung hindi, baka
  rationale: Naipapahayag nito ang negatibo o iniiwasang kahihinatnan sa natural na Filipino, habang ang mas malakas na layuning “upang huwag” ay inilalagay sa talababa upang mapanatili ang tunay na kalabuan.
- source_word: ἴδωσιν
  choice: makakita sila
  rationale: Ang anyong maka- ay natural na naghahatid ng posibilidad na ipinahihiwatig ng subjunctive.
- source_word: ἀκούσωσιν
  choice: makarinig
  rationale: Pinananatili ang leksikal na ugnayan sa naunang pandiwa ng pakikinig at umaayon sa magkakahanay na mga pandiwang maka-.
- source_word: συνῶσιν
  choice: makaunawa
  rationale: Malinaw at likas na katumbas na nababagay sa pariralang “sa pamamagitan ng kanilang puso.”
- source_word: ἐπιστρέψωσιν
  choice: manumbalik
  rationale: Pinananatili ang direksiyon ng pagbabalik at ang posibleng diwa ng pagbabalik-loob nang hindi tahasang nililimitahan sa teknikal na terminong “magsisi.”
- source_word: ἰάσομαι
  choice: pagagalingin ko
  rationale: Malinaw na hinaharap na anyo na, sa kayariang “Kung hindi, baka … at,” ay nagpapanatili sa kondisyunal na lohika ng sipi nang hindi binabago ang leksikal na “pagalingin.”
theological_decisions:
- issue: Layunin ng Diyos sa sipi mula kay Isaias
  choice: Isinalin ang μήποτε bilang “Kung hindi, baka” at inilagay ang mas malakas na purposive nuance sa talababa.
  alternative: “upang huwag silang makakita … at manumbalik, at pagalingin ko sila”
  rationale: Pinananatili nito ang tensiyon sa pagitan ng makadiyos na paghatol at pananagutan ng tao, nang hindi tahimik na nagpapasya kung purong layunin o iniiwasang kahihinatnan ang diin ng pang-ugnay.
- issue: Kahulugan ng ἐπιστρέψωσιν
  choice: manumbalik
  alternative: bumalik; magbalik-loob; magsisi
  rationale: Ang “manumbalik” ay nagpapanatili sa metapora ng pagtalikod at pagbabalik at hinahayaang manatili ang diwa ng conversion nang hindi nag-aangkat ng mas makitid o denominasyonal na pormulasyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang pag-uulit ng mata, tainga, at puso at ang medyo mabigat na ritmo ng propetikong sipi. Ginamit ang “sa pamamagitan ng” upang katawanin ang instrumental na mga parirala, at “manumbalik” upang maiwasan ang sobrang teknikal o denominasyonal na pananalita.
