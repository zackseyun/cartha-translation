revisions:
- from: Sapagkat naging manhid ang puso ng bayang ito[a]; mabigat silang nakinig sa pamamagitan ng kanilang mga tainga, at ipinikit nila ang kanilang mga mata. Kung hindi, baka makakita sila sa pamamagitan ng kanilang mga mata, makarinig sa pamamagitan ng kanilang mga tainga, makaunawa sa pamamagitan ng kanilang puso, at manumbalik[b], at pagagalingin ko sila.
  to: Sapagkat naging manhid ang puso ng bayang ito[a]; mabigat ang kanilang pandinig, at ipinikit nila ang kanilang mga mata. Baka[b] makakita sila sa kanilang mga mata, makarinig sa kanilang mga tainga, makaunawa sa kanilang puso, at manumbalik[c], at pagagalingin ko sila.
  rationale: Pinalitan ang di-malinaw na “Kung hindi, baka” ng “Baka,” na mas natural na naghahatid ng contingency at hinahayaang manatili ang pinagtatalunang lakas ng μήποτε; ang mas mariing purposive na pagbasa ay malinaw na nasa talababa at wastong nakaangkla. Pinalitan din ang di-likas na parirala tungkol sa pakikinig ng “mabigat ang kanilang pandinig,” na pinananatili ang metapora ng Griyego. Inayos ang mga talababa upang ang alternatibong pagbasa ng μήποτε ay nakakabit sa mismong pang-ugnay at ang alternatibo para sa ἐπιστρέψωσιν ay nakakabit sa “manumbalik.”
