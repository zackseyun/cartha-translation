  text: And when he had [a]said these things, the Jews departed, having a great dispute among themselves.
translation:
  language: tl
  text: At nang masabi niya ang mga bagay na ito,[a] umalis ang mga Judio na may matinding pagtatalo sa isa’t isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang buong talatang ito ay wala sa pinakamaagang mga manuskritong Griego (kabilang ang Papyrus 74 mula sa ika-3 siglo, Sinaiticus mula sa ika-4 na siglo, at Vaticanus mula sa ika-4 na siglo) at sa mga sinaunang salin sa Coptic. Naroon ito sa karamihang tradisyong Bizantino, gayundin sa mga sinaunang salin sa Latin at Syriac. Malamang na idinagdag ito ng isang tagakopya nang dakong huli upang bigyang-kaganapan ang salaysay tungkol sa pag-alis ng mga pinunong Judio.
    reason: textual_critical
lexical_decisions:
- source_word: συζήτησις
  choice: nagtatalo-talo
  rationale: Ang salita ay maaaring tumukoy sa talakayan, debate, o pagtatalo. Sa konteksto ng pagkakahati nila tungkol sa mensahe ni Pablo, ipinahihiwatig ng “matinding nagtatalo-talo” ang tindi ng hindi nila pagkakasundo habang nananatiling natural sa modernong Tagalog.
- source_word: ἀπέρχομαι
  choice: umalis
  rationale: Karaniwan itong pandiwa ng paglayo o pag-alis. Ang “umalis” ay malinaw, natural, at angkop sa salaysay.
- source_word: πολλὴν ἔχοντες ἐν ἑαυτοῖς
  choice: na matinding ... sa isa't isa
  rationale: Isinasalin nito ang diwa ng pagkakaroon nila ng malaking pagtatalo sa kanilang sariling pangkat, sa paraang likas sa Tagalog.
