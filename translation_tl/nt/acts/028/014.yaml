base_translation:
  language: en
  yaml_path: translation/nt/acts/028/014.yaml
  text: There we found brothers, and we were invited to stay with them seven days. And so we came to Rome.
translation:
  language: tl
  text: Doon ay nakatagpo kami ng mga kapatid[a], at inanyayahan kaming manatili sa kanila nang pitong araw. At sa gayon ay nakarating kami sa Roma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay malamang na tumutukoy sa mga kapwa mananampalataya.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: Doon
  rationale: Pang-abay na panlunan na tumutukoy sa Puteoli, ang lugar na kababanggit lamang; natural ito sa makabagong Tagalog.
- source_word: εὑρόντες
  choice: nakitagpo kami
  rationale: Ang aorist participle ay ginawang pandiwang may tahasang simuno upang maging natural sa Tagalog habang pinananatili ang pagkakasunod ng pangyayari.
- source_word: ἀδελφοὺς
  choice: mga kapatid
  rationale: Karaniwang tawag ito sa mga kapwa mananampalataya sa Mga Gawa; likas ding ginagamit ang “mga kapatid” sa Tagalog para sa isang pangkat na maaaring may mga lalaki at babae.
- source_word: παρεκλήθημεν
  choice: inanyayahan kami
  rationale: Ang pasibong anyo ay tumutukoy sa pakiusap o paanyayang tumuloy; ang “inanyayahan” ang pinakanatural sa konteksto ng pagpapatuloy.
- source_word: παρ’ αὐτοῖς
  choice: sa piling nila
  rationale: Ipinahihiwatig ng παρά na nanatili ang pangkat kasama ng mga kapatid; dignified at malinaw ang “sa piling nila.”
- source_word: ἐπιμεῖναι
  choice: manatili
  rationale: Tumpak na inilalarawan ang pansamantalang pagtigil sa paglalakbay at hindi ipinahihiwatig na permanenteng tumira.
- source_word: ἡμέρας ἑπτά
  choice: nang pitong araw
  rationale: Malinaw na ipinapahayag ang accusative of extent of time bilang tagal.
- source_word: καὶ οὕτως
  choice: At sa ganitong paraan
  rationale: Pinananatili ang maaaring tumukoy sa paraan o kinalabasan ng paglalakbay, sa halip na gawing simpleng pangwakas lamang.
- source_word: εἰς τὴν Ῥώμην ἤλθαμεν
  choice: nakarating kami sa Roma
  rationale: Natural na Tagalog para sa pagdating sa destinasyong tinutukoy ng εἰς at ἤλθαμεν.
theological_decisions:
- issue: Tinutukoy ng ἀδελφοὺς
  choice: mga kapwa mananampalataya sa lokal na pamayanang Cristiano
  alternative: mga kapatid sa laman o mga kapwa Judio sa pangkalahatan
  rationale: Sa ganitong konteksto ng Mga Gawa, lalo na sa pagtanggap at pagpapatuloy sa mga manlalakbay, pinakamalamang na mga kapwa mananampalataya ang tinutukoy. Gayunman, pinananatili sa teksto ang payak na “mga kapatid” upang hindi labis na tukuyin ang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang “sa piling nila” para sa likas na daloy at “sa ganitong paraan” upang mapanatili ang puwersa ng οὕτως.
