id: ACT.28.4
reference: Acts 28:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς δὲ εἶδον οἱ βάρβαροι κρεμάμενον τὸ θηρίον ἐκ τῆς χειρὸς αὐτοῦ, ⸂πρὸς ἀλλήλους ἔλεγον⸃· Πάντως φονεύς ἐστιν ὁ ἄνθρωπος οὗτος ὃν διασωθέντα ἐκ τῆς θαλάσσης ἡ δίκη ζῆν οὐκ εἴασεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/004.yaml
  text: When the islanders saw the creature hanging from his hand[a], they said to one another, “Surely this man is a murderer, whom Justice has not allowed to live[d][c][b], though he was brought safely from the sea.”
translation:
  language: tl
  text: Nang makita ng mga tagaroon[a] ang hayop na nakabitin sa kamay niya, sinabi nila sa isa’t isa, “Tiyak na mamamatay-tao ang taong ito. Kahit nailigtas siya mula sa dagat, hindi siya hinayaan ng Katarungan[b] na mabuhay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga barbaro,” isang karaniwang tawag noon ng mga Griyego sa mga taong hindi nagsasalita ng Griyego; hindi ito nangangahulugang mababangis o walang kabihasnan ang mga tagaroon.
    reason: lexical_alternative
  - marker: b
    text: Ang “Katarungan” ay salin ng Griyegong dikē. Dito, malamang na personipikado ito bilang kapangyarihang nagpaparusa sa masama, marahil ayon sa paniniwalang pagano ng mga tagaroon.
    reason: cultural_note
lexical_decisions:
- source_word: βάρβαροι
  choice: mga tagaroon
  rationale: Tumutukoy ito sa mga lokal na naninirahang hindi nagsasalita ng Griyego, hindi sa mga taong mabagsik o walang kabihasnan. Likas sa modernong Tagalog ang “mga tagaroon” at iniiwasan nito ang mapanlait na diwa ng literal na “mga barbaro.”
- source_word: κρεμάμενον
  choice: nakabitin
  rationale: Pinananatili nito ang larawang ang hayop ay nakasabit o nakabitin mula sa kamay ni Pablo nang hindi labis na tinutukoy kung paano ito nakakapit.
- source_word: τὸ θηρίον
  choice: ang hayop
  rationale: Pangkalahatang katawagan ang Griyego para sa isang hayop o nilalang. Bagaman ahas ang tinutukoy sa konteksto, hindi iyon muling espesipikong pinangalanan sa pariralang ito.
- source_word: πρὸς ἀλλήλους ἔλεγον
  choice: sinabi nila sa isa’t isa
  rationale: Malinaw na ipinahahayag ang usapan nila sa isa’t isa. Hindi kailangang gawing tahasang paulit-ulit ang imperpektong ἔλεγον sa natural na pagsasalaysay sa Tagalog.
- source_word: Πάντως
  choice: Tiyak
  rationale: Ipinahahayag nito ang matibay na paghihinuha ng mga tagaroon batay sa kanilang nakita.
- source_word: φονεύς
  choice: mamamatay-tao
  rationale: Ito ang karaniwan at malinaw na katumbas ng taong pumatay o mamamatay.
- source_word: διασωθέντα
  choice: nailigtas
  rationale: Pinananatili ang pasibong diwa ng pagkaligtas nang ligtas mula sa panganib, nang hindi nagpapahiwatig dito ng espirituwal na kaligtasan.
- source_word: ἡ δίκη
  choice: ang Katarungan
  rationale: Ang malaking titik ay nagpapakita na personipikado ang mapagparusang katarungan sa paniniwala ng mga tagaroon, ngunit hindi tahasang sinasabing pangalan ito ng isang partikular na diyosa.
- source_word: ζῆν οὐκ εἴασεν
  choice: hindi siya hinayaan … na mabuhay
  rationale: Natural nitong ipinahahayag sa Tagalog ang hindi pagpapahintulot sa kaniya na patuloy na mabuhay.
- source_word: ἐκ τῆς θαλάσσης
  choice: mula sa dagat
  rationale: Tumpak at natural itong katumbas ng ἐκ, samantalang ipinahahayag na ng pandiwang “nailigtas” ang pagdaan sa panganib sa dagat.
theological_decisions:
- issue: Personipikasyon ng δίκη
  choice: “Katarungan” na may malaking titik
  alternative: “katarungan” na maliit ang titik; “diyosang Katarungan”; “paghihiganti”
  rationale: Ipinahihiwatig ng konteksto na para sa mga tagaroon, isang kumikilos at nagpaparusang kapangyarihan ang Katarungan. Pinananatili ng personipikasyon ang kanilang pananaw nang hindi ipinapalagay na sinasang-ayunan ito ng tagapagsalaysay o na tiyak na isang partikular na diyosa ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga tagaroon” sa halip na literal na “mga barbaro” upang maiwasan ang maling mapanlait na pakahulugan. Ang tuwirang pananalita ay hinati sa dalawang pangungusap para sa likas at madaling maunawaang daloy, habang pinananatili ang lohika at tensiyon ng orihinal.
