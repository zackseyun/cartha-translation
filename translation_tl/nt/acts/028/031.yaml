  text: κηρύσσων τὴν βασιλείαν τοῦ θεοῦ καὶ διδάσκων τὰ περὶ τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ πάσης παρρησίας ἀκωλύτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/031.yaml
  text: proclaiming the kingdom of God and teaching the things concerning the Lord Jesus the Messiah with all boldness[a], unhindered.
translation:
  language: tl
  text: ipinapangaral ang kaharian ng Diyos at nagtuturo tungkol sa Panginoong Jesus na Mesiyas[a] nang may buong katapangan at walang hadlang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Panginoong Jesus Cristo.” Ang Griyegong Χριστός ay maaaring gamiting titulo (“Mesiyas”) o, sa ilang konteksto, katawagang halos naging bahagi na ng pangalan (“Cristo”).'
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσων
  choice: ipinapangaral
  rationale: Ipinahahayag nito ang patuloy at hayagang pagpapahayag ni Pablo, nang hindi nililimitahan ang gawain sa isang pormal na sermon.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Likas at nakaugaliang salin ito na napananatili ang saklaw ng βασιλεία bilang paghahari at kaharian.
- source_word: διδάσκων
  choice: itinuturo
  rationale: Tuwirang inilalarawan ang patuloy na gawaing pagtuturo, na kaagapay ng pangangaral.
- source_word: τὰ περὶ
  choice: ang mga bagay tungkol sa
  rationale: Pinananatili nito ang saklaw at bahagyang pormal na kayarian ng Griyego nang hindi labis na pinapakinis bilang simpleng 'tungkol sa.'
- source_word: τοῦ κυρίου
  choice: Panginoong
  rationale: Pinananatili ang kinikilalang kristolohikal na titulo at natural itong ikinakabit sa pangalan sa Tagalog.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong 'Mesiyas' at ginagamit ang 'na' upang maging malinaw at natural sa Tagalog na si Jesus ang tinutukoy na Mesiyas.
- source_word: μετὰ πάσης παρρησίας
  choice: nang buong tapang
  rationale: Ipinahahayag ang matapang, hayag, at walang-takot na pagsasalita; ipinapakita ng 'buong' ang diin ng πάσης.
- source_word: ἀκωλύτως
  choice: walang hadlang
  rationale: Maikli at natural na panapos na pinananatili ang matinding diin ng salaysay na hindi napigilan ang ministeryo.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός sa hanay ng mga titulong kristolohikal
  choice: Mesiyas
  alternative: Cristo
  rationale: Maaaring gumana ang Χριστός bilang titulo o bilang katawagang halos naging bahagi na ng pangalan. Dito ay pinananatili sa pangunahing teksto ang kahulugan ng titulo, habang inilalagay sa talababa ang pamilyar na alternatibong 'Cristo' upang hindi ikubli ang tunay na posibilidad sa Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang dalawang magkaugnay na pandiwari bilang magkapantay na patuloy na gawain. Ginamit ang 'nang buong tapang at walang hadlang' bilang natural at mariing pangwakas.
