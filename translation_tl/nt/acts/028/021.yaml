  source_fidelity: 'Tapat ang diwa ng salin sa Griyego: napananatili ang tugon na may δέ, ang dalawang magkaugnay na pagtanggi (οὔτε ... οὔτε), ang mga liham mula sa Judea, at ang magkahiwalay na pandiwang “nag-ulat o nagsabi.” Ang “mga kapatid” ay wastong iniwang hindi tinutukoy bilang mga Kristiyano.'
  naturalness: May bahagyang hindi likas at kalabisan sa “Wala kaming natanggap na anumang liham.” Mas natural ang “Wala kaming natanggap na liham.” Mas malinaw at mas maayos ding itugma ang ikalawang pagtanggi sa pamamagitan ng “ni wala ring ...” kaysa simpleng “at wala ring ...”.
  terminology: Ang “liham,” “Judea,” “mga kapatid,” “nag-ulat,” at “masama” ay angkop sa makabagong Filipino at sa antas ng pananalita ng talata. Ginawang “Kristiyanong mananampalataya” ang anyo sa talababa para sa mas karaniwang modernong baybay Filipino, nang walang pagbabago sa kahulugan.
