base_translation:
  language: en
  yaml_path: translation/nt/acts/028/021.yaml
  text: But they said to him[a], “We have received no letters from Judea about you[b], nor has any of the brothers who came reported or spoken anything evil about you.”
translation:
  language: tl
  text: Ngunit sinabi nila sa kanya, “Wala kaming natanggap na liham mula sa Judea tungkol sa iyo, ni wala ring sinuman sa mga kapatid[a] na dumating ang nag-ulat o nagsabi ng anumang masama tungkol sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay maaaring tumukoy sa mga kapwa Judio mula sa Judea; hindi tahasang sinasabi ng teksto na sila ay mga Kristiyanong mananampalataya.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πρὸς αὐτὸν εἶπαν
  choice: Ngunit sinabi nila sa kanya
  rationale: Ipinahahayag ng “ngunit” ang banayad na pagsalungat o pagpapatuloy ng δέ sa tugon, habang natural na isinasalin ang πρὸς αὐτόν bilang “sa kanya.”
- source_word: Ἡμεῖς οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα
  choice: Wala kaming natanggap na anumang liham ... tungkol sa iyo
  rationale: Pinananatili ang tahasang “kami” at ang unang bahagi ng magkaugnay na pagtangging οὔτε … οὔτε. Ang γράμματα ay mga liham o nakasulat na mensahe sa kontekstong ito.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: mula sa Judea
  rationale: Tuwirang heograpikong salin na hindi nagdaragdag ng hindi tahasang impormasyong pampolitika.
- source_word: παραγενόμενός τις τῶν ἀδελφῶν
  choice: sinuman sa mga kapatid na dumating
  rationale: Ang παραγενόμενος ay tumutukoy sa isang taong dumating. Hindi idinagdag ang “dito,” sapagkat ipinahihiwatig lamang iyon ng konteksto at hindi tahasang nasa Griyego.
- source_word: ἀπήγγειλεν ἢ ἐλάλησέν τι
  choice: nag-ulat o nagsabi ng anumang
  rationale: Bahagyang pinananatili ang pagkakaiba ng pagdadala ng ulat (ἀπαγγέλλω) at karaniwang pagsasalita (λαλέω), sa halip na pag-isahin ang dalawang pandiwa.
- source_word: πονηρόν
  choice: masama
  rationale: Malawak at natural na katumbas na nagpapanatili sa di-tiyak na saklaw ng salitang Griyego—maaaring masamang bagay, paratang, o ulat—nang hindi ito nililimitahan.
theological_decisions:
- issue: Tinutukoy ng τῶν ἀδελφῶν (“mga kapatid”)
  choice: Pinanatili bilang “mga kapatid” nang hindi tinutukoy kung mga mananampalatayang Cristiano sila.
  alternative: mga kapwa Judio; mga kapatid na Cristiano
  rationale: Sa konteksto, maaaring tumukoy ito sa mga kapwa Judio mula sa Judea, ngunit hindi tahasang nililinaw ng teksto ang kanilang pagkakakilanlan. Pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “liham,” “nag-ulat,” at “nagsabi” bilang pangkaraniwang mga salitang madaling maunawaan, habang pinananatili ang estruktura ng magkaugnay na pagtanggi at ang kalabuan ng “mga kapatid.”
