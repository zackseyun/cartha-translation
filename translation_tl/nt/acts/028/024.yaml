  text: And some were persuaded by what was being said[a], but others disbelieved.
translation:
  language: tl
  text: At may ilan ang nakumbinsi sa mga sinasabi, ngunit ang iba ay hindi naniwala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi nanampalataya” o “di-naniwala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείθοντο
  choice: nahikayat
  rationale: Ipinahihiwatig ng di-ganap na anyong middle/passive ang nagpapatuloy na pagtugon sa mensahe. Pinananatili ng “nahikayat” ang diwang nakumbinsi sila nang hindi agad ipinapakahulugang ganap na pananampalatayang nagliligtas.
- source_word: τοῖς λεγομένοις
  choice: sa mga sinasabi
  rationale: Tumutukoy ang articular present passive participle sa nilalaman ng nagpapatuloy na pagpapahayag. Likas sa Tagalog ang “sa mga sinasabi” at naipakikita nito ang nagpapatuloy na diskurso.
- source_word: ἠπίστουν
  choice: hindi naniwala
  rationale: Tuwirang inilalarawan nito ang kawalan ng paniniwala nang hindi idinaragdag ang mas malakas at maaaring volitional na diwa ng “tumangging maniwala.”
- source_word: οἱ μὲν ... οἱ δὲ
  choice: may ilang ... ngunit ang iba
  rationale: Likas nitong ipinahahayag sa Tagalog ang pagkakahati ng pangkat at ang pagsasalungat ng kanilang mga tugon.
- source_word: καὶ
  choice: At
  rationale: Iniuugnay nito ang talata sa naunang salaysay nang hindi labis na binibigyang-kahulugan ang relasyon ng mga pangyayari.
theological_decisions:
- issue: Likas ng magkasalungat na pagtugon
  choice: Ipinakikita ng talata na may mga nahikayat sa mensahe ni Pablo at may mga hindi naniwala, nang hindi tinutukoy ang kanilang pangwakas na kalagayang espirituwal.
  alternative: Ituring ang mga nahikayat bilang ganap nang tunay na mananampalataya at ang iba bilang sadyang tumanggi o pinatigas na mga di-mananampalataya.
  rationale: Ang Griyego ay naglalahad ng magkaibang agarang tugon sa mensahe ngunit hindi nito tahasang nilulutas ang mas malawak na usaping doktrinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nahikayat” upang mapanatili ang diwa ng πείθω bilang pagkumbinsi, at ang “hindi naniwala” upang maiwasang idagdag ang di-tiyak na diwa ng kusang pagtanggi.
