base_translation:
  language: en
  yaml_path: translation/nt/acts/028/025.yaml
  text: 'And since they were disagreeing with one another, they were leaving after Paul had said one final word: “The Holy Spirit spoke rightly through Isaiah the prophet to your fathers'
translation:
  language: tl
  text: Yamang hindi sila magkasundo sa isa’t isa, nag-alisan sila matapos sabihin ni Pablo ang isang pangwakas na salita:[a] “Tama ang sinabi ng Banal na Espiritu sa pamamagitan ni propetang Isaias sa inyong mga ama:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang salita” o “isang pahayag.” Literal na “isang salita” ang Griyego; dito ay tumutukoy ito sa isang pangwakas na pahayag.
    reason: lexical_alternative
  - marker: b
    text: O “sa inyong mga ninuno.” Literal na “sa inyong mga ama” ang Griyego; tumutukoy ito sa mga ninuno ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους
  choice: At dahil hindi sila magkasundo
  rationale: Likas na ipinahahayag sa modernong Tagalog ang kalagayan ng kanilang di-pagkakasundo sa isa't isa; ang ‘dahil’ ay angkop sa ugnayan nito sa pag-alis nila.
- source_word: ἀπελύοντο
  choice: nagsimula silang umalis
  rationale: Ang imperpektong anyo ay maaaring maglarawan sa pangkat na nagsisimula nang maghiwa-hiwalay at umalis.
- source_word: εἰπόντος τοῦ Παύλου
  choice: matapos sabihin ni Pablo
  rationale: Isinasalin ang genitive absolute bilang likas na sugnay na temporal at pinananatili ang kahulugan ng εἶπον na ‘sabihin.’
- source_word: ῥῆμα ἓν
  choice: isang pangwakas na salita
  rationale: Literal itong ‘isang salita,’ ngunit sa konteksto ay gumaganap bilang huling pahayag bago sila umalis; inilalahad sa talababa ang mas literal na mga alternatibo.
- source_word: Καλῶς
  choice: Tama
  rationale: Dito ay pinagtitibay ng καλῶς ang kawastuhan ng sinabi ng Banal na Espiritu, hindi lamang ang paraan ng pagsasalita.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: ang Banal na Espiritu
  rationale: Karaniwan, malinaw, at marangal na katumbas sa Tagalog ng tiyak na pariralang Griyego.
- source_word: ἐλάλησεν
  choice: sinabi
  rationale: Natural sa Tagalog ang ‘sinabi’ kapag kasunod ang nilalaman ng isang propetikong pahayag, habang nananatili ang diwang ‘nagsalita.’
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: sa pamamagitan ni propetang Isaias
  rationale: Malinaw na ipinakikita ang pamamagitan o instrumental na ahensiya na ipinahahayag ng διά na may genitive.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: sa inyong mga ninuno
  rationale: Sa konteksto, tumutukoy ang πατέρες sa mga ninuno ng Israel; ‘mga ninuno’ ang natural at eksaktong kolektibong tawag sa modernong Tagalog, samantalang inilalagay sa talababa ang literal na ‘mga ama.’
theological_decisions:
- issue: Ang tinutukoy ng ‘inyong mga ama’
  choice: inyong mga ninuno
  alternative: inyong mga ama
  rationale: Bagaman literal na ‘mga ama’ ang πατέρες, ang gamit dito ay tumutukoy sa mga ninuno ng Israel. Hindi binabago ng saling ‘mga ninuno’ ang referent, at pinananatili sa talababa ang literal na anyo.
- issue: Ang Banal na Espiritu bilang nagsasalita sa pamamagitan ng propeta
  choice: Tama ang sinabi ng Banal na Espiritu ... sa pamamagitan ni propetang Isaias
  alternative: Mahusay na nagsalita ang Banal na Espiritu sa pamamagitan ni propetang Isaias
  rationale: Pinananatili ang tahasang pag-uukol ng propetikong pananalita sa Banal na Espiritu at ang papel ni Isaias bilang tagapamagitan, nang hindi dinaragdagan o binabawasan ang pahayag ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at angkop sa pampublikong pagbasa. Ginamit ang ‘hindi sila magkasundo’ sa halip na mas mabigat na nominal na parirala, at ‘sa pamamagitan ni propetang Isaias’ upang malinaw na mapanatili ang propetikong ahensiya. Nagtatapos ang sipi sa tutuldok dahil nagpapatuloy sa susunod na talata ang tuwirang sipi.
