id: ACT.28.6
reference: Acts 28:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ προσεδόκων αὐτὸν μέλλειν πίμπρασθαι ἢ καταπίπτειν ἄφνω νεκρόν. ἐπὶ πολὺ δὲ αὐτῶν προσδοκώντων καὶ θεωρούντων μηδὲν ἄτοπον εἰς αὐτὸν γινόμενον, ⸀μεταβαλόμενοι ἔλεγον ⸂αὐτὸν εἶναι θεόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/006.yaml
  text: But they were expecting him to swell up or suddenly fall down dead. But after they had waited a long time and saw that nothing unusual was happening to him[a], they changed their minds and began saying that he was a god.
translation:
  language: tl
  text: Inaasahan nilang mamamaga siya o bigla siyang mabubuwal at mamamatay. Ngunit matapos silang maghintay nang matagal at makita nilang walang anumang di-pangkaraniwang nangyayari sa kanya[a], nagbago ang isip nila at nagsimulang magsabing isa siyang diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “walang anumang kakaiba” o “walang anumang hindi karaniwan” ang nangyayari sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεδόκων
  choice: Inaasahan nila
  rationale: Ipinahihiwatig ng imperpektong aspekto ang patuloy nilang paghihintay at pag-aakalang may mangyayari.
- source_word: πίμπρασθαι
  choice: mamamaga
  rationale: Sa konteksto ng kagat ng ahas, tumutukoy ito sa pamamaga ng katawan, hindi sa literal na pagkasunog.
- source_word: καταπίπτειν ἄφνω νεκρόν
  choice: biglang babagsak na patay
  rationale: Pinananatili nito ang biglaang pagbagsak at ang kinalabasang kamatayan.
- source_word: ἐπὶ πολὺ
  choice: matapos silang maghintay nang matagal
  rationale: Natural na temporal na paglalahad ito ng matagal na pagmamasid na ipinahihiwatig ng parirala at mga kasunod na participle.
- source_word: θεωρούντων
  choice: makitang
  rationale: Ipinapahayag nito ang masusing pagmamasid na humantong sa kanilang pagkakita sa kalagayan ni Pablo.
- source_word: μηδὲν ἄτοπον
  choice: walang anumang di-pangkaraniwang
  rationale: Pinananatili ang malawak na diwa ng ἄτοπος bilang kakaiba, di-karaniwan, o di-nararapat, nang hindi ito nililimitahan sa 'nakapipinsala.'
- source_word: μεταβαλόμενοι
  choice: nagbago ang isip nila
  rationale: Malinaw at likas itong nagpapahayag ng pagbaligtad ng kanilang naunang palagay.
- source_word: ἔλεγον
  choice: nagsimulang magsabi
  rationale: 'Naipakikita nito ang posibleng inceptive na puwersa ng imperpekto: nagsimula ang paulit-ulit o nagpapatuloy na pagsasabi.'
- source_word: θεόν
  choice: isang diyos
  rationale: Ang walang-artikulong θεόν sa paganong konteksto ay tumutukoy sa isa sa mga diyos, hindi sa Diyos na kinikilala sa pananampalatayang Cristiano.
theological_decisions:
- issue: Kung paano isasalin ang αὐτὸν εἶναι θεόν nang hindi ipinapasok ang isang Cristiano o kalaunang teolohikal na pag-aangkin tungkol kay Pablo
  choice: isa siyang diyos
  alternative: siya ang Diyos; banal siya
  rationale: Iniuulat ng salaysay ang maling palagay ng mga tagaroon. Ang paganong konteksto at ang walang-artikulong θεόν ay sumusuporta sa di-tiyak na 'isang diyos,' at iniiwasan nitong ipahiwatig na kinilala nila si Pablo bilang ang nag-iisang Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “di-pangkaraniwang” upang mapanatili ang lawak ng ἄτοπον; ipinaliliwanag ng talababa ang iba pang posibleng diwa. Ginamit ang maliit na titik sa “diyos” dahil paganong palagay ng mga tagaroon ang inilalarawan.
