  text: And he stayed for two whole years in his own rented lodging[a], and he welcomed all who came in to him[b],
translation:
  language: tl
  text: At nanatili siya nang dalawang buong taon sa sarili niyang inuupahang tirahan[a], at malugod niyang tinatanggap ang lahat ng pumupunta sa kanya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa sarili niyang inuupahang bahay.” Ang salitang Griyego na μίσθωμα ay tumutukoy sa inuupahang matutuluyan o tirahan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang lahat ng pumapasok sa kanya.” Mas literal na tumutukoy ang Griyego sa mga pumapasok o lumalapit sa kanya; sa konteksto, malamang na mga bisita silang pumapasok sa kanyang tirahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνέμεινεν
  choice: nanatili siya
  rationale: Ipinahahayag ng pandiwa rito ang patuloy na pananatili sa isang lugar. Likas at marangal sa Filipino ang “nanatili” at hindi nito dinaragdagan ang diwa tungo sa mas tiyak na “nanirahan.”
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay, hindi isang mariing pagsalungat.
- source_word: διετίαν ὅλην
  choice: nang dalawang buong taon
  rationale: Pinananatili nito ang haba ng panahon at ang diin ng ὅλην sa kabuuan ng dalawang taon.
- source_word: ἐν ἰδίῳ μισθώματι
  choice: sa sarili niyang inuupahang tirahan
  rationale: Ang μίσθωμα ay tumutukoy sa inuupahang matutuluyan o tirahan. Ang “tirahan” ay natural sa makabagong Filipino at hindi ipinapalagay na tiyak na isang buong bahay.
- source_word: ἀπεδέχετο
  choice: malugod niyang tinatanggap
  rationale: Ipinahihiwatig ng imperfect ang paulit-ulit o patuloy na pagtanggap, at naipakikita ng “malugod” ang magiliw na diwa ng ἀποδέχομαι.
- source_word: πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν
  choice: ang lahat ng pumapasok upang dalawin siya
  rationale: Pinananatili ng “pumapasok” ang tahasang diwang spatial ng εἰσπορεύομαι sa konteksto ng tirahan. Nililinaw ng “upang dalawin siya” ang likas na kahulugan sa Filipino nang hindi inaalis ang kilos ng pagpasok.
