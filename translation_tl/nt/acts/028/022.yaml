id: ACT.28.22
reference: Acts 28:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀξιοῦμεν δὲ παρὰ σοῦ ἀκοῦσαι ἃ φρονεῖς, περὶ μὲν γὰρ τῆς αἱρέσεως ταύτης γνωστὸν ⸂ἡμῖν ἐστιν⸃ ὅτι πανταχοῦ ἀντιλέγεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/022.yaml
  text: But we consider it proper to hear from you what you think[a], for concerning this sect it is known to us that it is spoken against everywhere.
translation:
  language: tl
  text: Ngunit minarapat naming marinig mula sa iyo kung ano ang pananaw mo, sapagkat tungkol sa sektang[a] ito, alam naming ito ay sinasalungat sa lahat ng dako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pangkat” o “kilusan.” Ang salitang Griyego na αἵρεσις dito ay hindi kinakailangang mangahulugang “erehiya” sa mas huling teknikal na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιοῦμεν
  choice: minarapat namin
  rationale: Ipinahahayag ng pandiwa ang magalang na paghatol na ang pakikinig kay Pablo ay angkop o nararapat, hindi isang mariing kahilingan.
- source_word: παρὰ σοῦ ἀκοῦσαι
  choice: marinig mula sa iyo
  rationale: Pinananatili nito ang diwang nais nilang marinig ang paliwanag mula mismo kay Pablo.
- source_word: ἃ φρονεῖς
  choice: kung ano ang pananaw mo
  rationale: Tumutukoy ang φρονέω rito sa pananaw o paninindigan ng isang tao; natural at malinaw ito sa makabagong Filipino.
- source_word: αἱρέσεως
  choice: sekta
  rationale: Tumutukoy ito rito sa isang kinikilalang pangkat o kilusang panrelihiyon, hindi kinakailangang sa teknikal at mas huling kahulugan ng maling aral.
- source_word: γνωστὸν ἡμῖν ἐστιν
  choice: alam naming
  rationale: Natural itong katumbas sa Filipino ng pormal na Griyegong pahayag na ‘nalalaman sa amin,’ nang hindi dinaragdagan ang antas ng katiyakan.
- source_word: πανταχοῦ
  choice: sa lahat ng dako
  rationale: Pinananatili nito ang malawak at lokatibong saklaw ng πανταχοῦ sa isang marangal at karaniwang anyo ng Filipino.
- source_word: ἀντιλέγεται
  choice: sinasalungat
  rationale: Ipinakikita ng anyong balintiyak na ang pangkat ay kinokontra o pinagsasalitaan laban dito sa maraming lugar, nang hindi tahasang tinutukoy kung sino ang gumagawa nito.
theological_decisions:
- issue: Pagpapakahulugan sa αἵρεσις
  choice: sekta
  alternative: erehiya
  rationale: Ang tinutukoy ay ang kilusang Kristiyano ayon sa pagtingin ng mga tagalabas, hindi isang pormal na paghatol na ito ay maling doktrina. Ang ‘erehiya’ ay magpapasok ng mas huling teknikal na kahulugang hindi hinihingi ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘minarapat namin’ upang mapanatili ang magalang at pormal na tono, habang ang ‘alam naming’ at ‘sinasalungat’ ay mas natural kaysa sa mekanikal na panggagaya sa balangkas ng Griyego.
