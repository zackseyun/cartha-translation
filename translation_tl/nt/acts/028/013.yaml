  text: ὅθεν ⸀περιελόντες κατηντήσαμεν εἰς Ῥήγιον. καὶ μετὰ μίαν ἡμέραν ἐπιγενομένου νότου δευτεραῖοι ἤλθομεν εἰς Ποτιόλους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/013.yaml
  text: From there[a], after weighing anchor, we came to Rhegium. And after one day, when a south wind came up, on the second day we came to Puteoli,
translation:
  language: tl
  text: Mula roon, matapos naming mag-alsa ng angkla[a], nakarating kami sa Regio. Pagkaraan ng isang araw, nang umihip ang hanging timog, nakarating kami sa Puteoli sa ikalawang araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matapos kaming pumalaot.” Ang salitang Griyego ay terminong pandagat na maaaring partikular na tumukoy sa pag-alsa ng angkla o mas pangkalahatan sa pag-alis upang maglayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Mula roon
  rationale: Likas na panandang panlunan sa salaysay at tapat sa kahulugang pinagmulan.
- source_word: περιελόντες
  choice: matapos naming mag-alsa ng angkla
  rationale: Sa kontekstong pandagat, tumutukoy ito sa pag-aalis ng humahawak sa barko upang makapaglayag; pinananatili sa talababa ang mas malawak na posibilidad na 'pumalaot.'
- source_word: κατηντήσαμεν
  choice: nakarating kami
  rationale: Malinaw na ipinahahayag ang pagdating sa tinukoy na hantungan.
- source_word: Ῥήγιον
  choice: Regio
  rationale: Makabagong transliterasyong madaling basahin sa Filipino para sa sinaunang pangalang Rhegium.
- source_word: μετὰ μίαν ἡμέραν
  choice: Pagkaraan ng isang araw
  rationale: Tuwirang pinananatili ang temporal na pagkakasunod ng Griyego.
- source_word: ἐπιγενομένου νότου
  choice: nang umihip ang hanging timog
  rationale: Natural na Filipino para sa genitive absolute at sa pagdating o pag-ihip ng hanging mula sa timog.
- source_word: δευτεραῖοι
  choice: kinabukasan
  rationale: Sa konteksto, ang pagdating ay sa ikalawang araw ng paglalayag; 'kinabukasan' ang pinakanatural na modernong Filipino at hindi nito ipinahihiwatig na lumipas pa ang isa pang buong araw matapos ang naunang temporal na parirala.
- source_word: ἤλθομεν
  choice: nakarating kami
  rationale: Sa pariralang may tahasang hantungan, natural na isinasalin ang pandiwang kilos bilang matagumpay na pagdating.
- source_word: Ποτιόλους
  choice: Puteoli
  rationale: Pinananatili ang karaniwang transliterasyon ng sinaunang pangalan ng lugar.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'Regio' bilang nababasang transliterasyon sa Filipino, samantalang pinanatili ang nakagawiang 'Puteoli.' Iniwasan ang sobrang literal na 'sa ikalawang araw' dahil kasunod ito ng 'pagkaraan ng isang araw' at maaaring magmukhang ikatlong araw sa Filipino; malinaw na ipinahahayag ng 'kinabukasan' ang nilalayong ikalawang araw ng paglalayag.
