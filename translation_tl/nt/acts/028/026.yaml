  text: ⸀λέγων· Πορεύθητι πρὸς τὸν λαὸν τοῦτον καὶ εἰπόν· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/026.yaml
  text: 'saying[a], ‘Go to this people and say: You will indeed hear, but you will never understand; and seeing, you will indeed see[b], but you will never perceive.’'
translation:
  language: tl
  text: 'na nagsasabi[a], “Pumunta ka sa bayang ito at sabihin mo: ‘Sa pakikinig ay makakarinig nga kayo, ngunit hinding-hindi ninyo mauunawaan; at sa pagtingin ay makakakita nga kayo[b], ngunit hinding-hindi ninyo makikita.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Sa pakikinig ay makakarinig kayo,” isang mariing pananalitang Hebreo na napanatili sa Griegong sipi mula kay Isaias.
    reason: lexical_alternative
  - marker: b
    text: 'Literal na inuulit ng Griyego ang wika ng paningin: “sa pagtingin ay makakakita kayo ... hinding-hindi ninyo makikita.” Sa kontekstong ito, ang huling “makikita” ay maaari ring magpahiwatig ng pagkilala o pag-unawa sa kahulugan ng nakikita.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: na nagsasabi
  rationale: Pinananatili ang kasalukuyang pandiwaring nag-uugnay sa talata sa naunang sugnay.
- source_word: Πορεύθητι
  choice: Pumunta ka
  rationale: Natural na pautos sa modernong Tagalog para sa idyomatikong pandiwa ng paggalaw.
- source_word: λαὸν τοῦτον
  choice: bayang ito
  rationale: Ang “bayan” ay kolektibong tumutukoy sa isang sambayanan at angkop sa makahulang sipi; hindi ito tumutukoy lamang sa isang lugar.
- source_word: εἰπόν
  choice: sabihin mo
  rationale: Tuwirang katumbas ng pautos na nagpapakilala sa mismong sasabihin.
- source_word: Ἀκοῇ ἀκούσετε
  choice: Talagang maririnig ninyo
  rationale: Ipinahahayag ng “talagang” ang diin ng magkaugnay na pangngalan at pandiwa nang hindi nagiging pilit sa Tagalog.
- source_word: οὐ μὴ συνῆτε
  choice: hinding-hindi ninyo mauunawaan
  rationale: Inihahatid ng “hinding-hindi” ang mariing pagtanggi ng οὐ μή.
- source_word: βλέποντες βλέψετε
  choice: talagang makikita ninyo
  rationale: Natural na Tagalog na nagpapanatili sa diin at paralelismo sa pandinig, bagaman hindi inuulit nang literal ang ugat ng pandiwang paningin.
- source_word: οὐ μὴ ἴδητε
  choice: hinding-hindi ninyo mapag-uunawa
  rationale: Ipinakikita ang kabiguang umunawa sa nakikita, habang ang literal na posibilidad na “makakita” ay pinananatili sa talababa.
theological_decisions:
- issue: Ang mga pandiwa ng pandinig at paningin sa sipi kay Isaias ay nagpapahiwatig ng kabiguang makaunawa.
  choice: Gamitin ang “mauunawaan” at “mapag-uunawa” upang maipakita ang panloob na pag-unawa na hindi nakakamit.
  alternative: Isalin ang huling pandiwa bilang “makakakita” upang mas mahigpit na mapanatili ang pag-uulit ng paningin.
  rationale: Pinagtatapat ng sipi ang aktuwal na pandinig at paningin sa kabiguang maunawaan ang kahulugan. Hindi nito inaalis ang literal na pag-uulit, sapagkat itinatala iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “bayan” sa kolektibong diwa at ang mariing “talagang” at “hinding-hindi” upang ipakita ang makahulang paralelismo at lakas ng mga anyong Griyego.
