translation_notes:
  register: Gumamit ng modernong, malinaw, at marangal na Tagalog. Iniwasan ang “mga barbaro” sa pangunahing teksto dahil mapanlait ang karaniwang dating nito ngayon, at iniwasan din ang “mga katutubo” dahil maaari itong magkaroon ng kolonyal na himig. Ang “sapagkat” ay nagpapanatili sa paliwanag na ugnayan ng γάρ.
