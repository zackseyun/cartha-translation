  text: οἵ ⸀τε βάρβαροι παρεῖχον οὐ τὴν τυχοῦσαν φιλανθρωπίαν ἡμῖν, ⸀ἅψαντες γὰρ πυρὰν προσελάβοντο πάντας ἡμᾶς διὰ τὸν ὑετὸν τὸν ἐφεστῶτα καὶ διὰ τὸ ψῦχος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/002.yaml
  text: And the local people showed us extraordinary kindness[b][a], for they lit a fire and welcomed all of us because of the rain that had set in and because of the cold.
translation:
  language: tl
  text: Nagpakita sa amin ang mga tagaroon[a] ng pambihirang kagandahang-loob[b], sapagkat nagsiga sila at malugod na tinanggap kaming lahat dahil sa ulan na nagsimula na at sa lamig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, βάρβαροι, na literal na “mga barbaro”; tumutukoy ito sa mga taong hindi nagsasalita ng Griyego. Dito, tumutukoy ito sa mga lokal na naninirahan sa isla at hindi nangangahulugang mababangis sila.
    reason: lexical_alternative
  - marker: b
    text: O “ng hindi pangkaraniwang kagandahang-loob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βάρβαροι
  choice: mga tagaroon
  rationale: Tumutukoy ito rito sa mga lokal na naninirahan sa isla na hindi nagsasalita ng Griyego, hindi sa mga taong mabangis o walang kabihasnan. Ang “mga tagaroon” ay natural at walang mapanlait o kolonyal na dating.
- source_word: οὐ τὴν τυχοῦσαν φιλανθρωπίαν
  choice: pambihirang kagandahang-loob
  rationale: Ang idyomang οὐ τὴν τυχοῦσαν ay nangangahulugang hindi pangkaraniwan, at ang φιλανθρωπία ay kabutihang makatao o kagandahang-loob. Malinaw at natural na ipinahahayag ng salin ang tindi ng kanilang kabutihan.
- source_word: παρεῖχον
  choice: nagpakita
  rationale: Kasama ng φιλανθρωπίαν, likas itong isalin bilang “nagpakita ng … kagandahang-loob.”
- source_word: ἅψαντες πυρὰν
  choice: nagsiga
  rationale: Ipinahihiwatig ng parirala ang pagsindi o pagpapaapoy ng isang siga. Maikli at natural sa Tagalog ang “nagsiga” nang hindi labis na tinutukoy ang laki ng apoy.
- source_word: προσελάβοντο
  choice: malugod na tinanggap
  rationale: Sa konteksto, tumutukoy ito sa magiliw at mapagpatuloy na pagtanggap, hindi kinakailangang pagpapatuloy sa isang bahay.
- source_word: πάντας ἡμᾶς
  choice: kaming lahat
  rationale: Pinananatili nito ang diin na walang sinuman sa pangkat ang hindi isinama sa pagtanggap.
- source_word: διὰ τὸν ὑετὸν τὸν ἐφεστῶτα
  choice: dahil sa bumubuhos na ulan
  rationale: Ang participle na ἐφεστῶτα ay naglalarawan sa ulang dumating na at patuloy na naroroon. Ipinahahayag ng “bumubuhos na ulan” ang kasalukuyan at masamang lagay ng panahon sa natural na Tagalog.
- source_word: διὰ τὸ ψῦχος
  choice: at sa lamig
  rationale: Tuwirang ipinahahayag nito ang malamig na kalagayang nag-udyok sa kanila na magsiga.
