revisions:
- from: Pagkatapos nilang magtakda ng araw kasama niya, mas marami sa kanila ang pumunta sa tinutuluyan niya.[a] Mula umaga hanggang gabi, ipinaliwanag[b] niya sa kanila ang kaharian ng Diyos at taimtim na nagpatotoo tungkol dito. Batay sa Kautusan ni Moises at sa mga Propeta, sinikap niyang hikayatin[c] sila tungkol kay Jesus.
  to: Nang magtakda sila ng isang araw kasama niya, mas marami sa kanila ang nagpunta sa kanyang tinutuluyan.[a] Ipinaliliwanag[b] niya sa kanila ang mga bagay na ito, habang taimtim na nagpapatotoo tungkol sa kaharian ng Diyos at nanghihikayat[c] sa kanila tungkol kay Jesus batay sa Kautusan ni Moises at sa mga Propeta, mula umaga hanggang gabi.
  rationale: Inayos ang pangungusap upang mapanatili ang sintaktikong pagkakaugnay ng patuloy na pagpapaliwanag, taimtim na pagpapatotoo tungkol sa kaharian ng Diyos, at panghihikayat tungkol kay Jesus mula sa Kautusan ni Moises at mga Propeta sa buong maghapon. Pinalitan ang interpretatibong “sinikap niyang hikayatin” ng “nanghihikayat,” na tapat sa aspektong patuloy ng Griyego nang hindi nagsasaad ng resulta.
