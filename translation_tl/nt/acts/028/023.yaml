id: ACT.28.23
reference: Acts 28:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ταξάμενοι δὲ αὐτῷ ἡμέραν ⸀ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν πλείονες, οἷς ἐξετίθετο διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ πείθων τε ⸀αὐτοὺς περὶ τοῦ Ἰησοῦ ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν ἀπὸ πρωῒ ἕως ἑσπέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/023.yaml
  text: After they had arranged a day with him[a], more of them came to him at his lodging. To them he was explaining, solemnly testifying about the kingdom of God and persuading them concerning Jesus from both the Law of Moses and the Prophets[c][b], from morning until evening.
translation:
  language: tl
  text: Nang magtakda sila ng isang araw kasama niya, mas marami sa kanila ang nagpunta sa kanyang tinutuluyan.[a] Ipinaliliwanag[b] niya sa kanila ang mga bagay na ito, habang taimtim na nagpapatotoo tungkol sa kaharian ng Diyos at nanghihikayat[c] sa kanila tungkol kay Jesus batay sa Kautusan ni Moises at sa mga Propeta, mula umaga hanggang gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa tuluyan niya” o “sa lugar na tinutuluyan niya.” Ang salitang Griyego ay tumutukoy sa tuluyan o matutuluyan.
    reason: lexical_alternative
  - marker: b
    text: O “inilalahad” o “ipinapaliwanag.”
    reason: lexical_alternative
  - marker: c
    text: O “sinisikap hikayatin.” Ang anyong Griyego ay tumutukoy sa patuloy na panghihikayat at hindi sinasabi rito kung nagtagumpay ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενοι ... αὐτῷ ἡμέραν
  choice: Pagkatapos nilang magtakda ng araw kasama niya
  rationale: Likas na ipinapahayag sa Tagalog ang pagtatakda nila, kasama si Pablo, ng araw para sa susunod na pagkikita.
- source_word: πλείονες
  choice: mas marami sa kanila
  rationale: 'Pinananatili ang pahambing na diwa: mas marami ang dumating kaysa sa naunang pangkat.'
- source_word: εἰς τὴν ξενίαν
  choice: sa tinutuluyan niya
  rationale: Ang ξενία ay tumutukoy sa tuluyan o pansamantalang tirahan; malinaw at likas sa modernong Tagalog ang “tinutuluyan.”
- source_word: ἐξετίθετο
  choice: ipinaliwanag
  rationale: Ipinahihiwatig ng pandiwa ang masinsinang paglalahad o pagpapaliwanag; ang saklaw na “mula umaga hanggang gabi” ay nagpapanatili sa tuloy-tuloy na aspekto.
- source_word: διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ
  choice: taimtim na nagpatotoo tungkol sa kaharian ng Diyos
  rationale: Pinananatili ng “taimtim na nagpatotoo” ang mariin at seryosong lakas ng διαμαρτύρομαι.
- source_word: πείθων ... αὐτοὺς περὶ τοῦ Ἰησοῦ
  choice: sinikap niyang hikayatin sila tungkol kay Jesus
  rationale: Ipinakikita ang patuloy na gawaing manghikayat nang hindi ipinapalagay na nagtagumpay ito sa lahat; inilalahad sa talababa ang mas tuwirang alternatibo.
- source_word: ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν
  choice: Batay sa Kautusan ni Moises at sa mga Propeta
  rationale: Ang ἀπό ay nagpapahayag dito ng pinagmulan o batayan ng pangangatwiran. Likas sa Tagalog ang “batay sa,” at pinananatili ang dalawang bahagi ng Kasulatan.
- source_word: ἀπὸ πρωῒ ἕως ἑσπέρας
  choice: Mula umaga hanggang gabi
  rationale: Tuwirang inilalarawan ang buong haba ng panahon nang hindi ipinapalagay na nagsimula ito sa mismong bukang-liwayway.
theological_decisions:
- issue: Ugnayan ng kaharian ng Diyos at ng patotoo tungkol kay Jesus
  choice: Inilalahad ang mga ito bilang magkaugnay na bahagi ng iisang buong-araw na pagpapaliwanag at panghihikayat batay sa Kasulatan ng Israel.
  alternative: Ituring ang kaharian ng Diyos at si Jesus bilang dalawang paksang walang ipinahihiwatig na ugnayan.
  rationale: Pinag-uugnay ng sintaks ang pagpapatotoo tungkol sa kaharian at ang panghihikayat tungkol kay Jesus sa iisang gawain, ngunit hindi dinaragdagan ng salin ang talata ng isang mas malawak na sistemang teolohikal.
- issue: Bunga ng panghihikayat ni Pablo
  choice: Hindi ipinapalagay na nahikayat ang lahat; binibigyang-diin ang pagsisikap niyang manghikayat.
  alternative: “Hinikayat niya sila,” na maaaring unawain bilang mismong kilos lamang o bilang matagumpay na panghihikayat.
  rationale: Maaaring ituon ng πείθων ang pansin sa proseso o pagsisikap, at ipinakikita ng kasunod na konteksto na hindi pare-pareho ang tugon. Pinananatili sa talababa ang mas literal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “Kautusan ni Moises” at “mga Propeta” bilang kinikilalang mga katawagan sa mga bahagi ng Kasulatan. Hinati sa maiikling pangungusap ang mahabang kayariang Griyego upang maging natural sa Tagalog, habang pinananatili ang iisang saklaw na “mula umaga hanggang gabi.”
