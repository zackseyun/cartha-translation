  - severity: medium
    issue: Ang “sinikap niyang hikayatin” ay mas interpretatibo kaysa sa πείθων.
    rationale: Ang kasalukuyang pandiwaring πείθων ay nagsasaad ng patuloy na panghihikayat; hindi nito tahasang sinasabing pagtatangka lamang. Maaaring ipahiwatig ng “nanghihikayat” ang proseso nang hindi nagpapalagay ng tagumpay.
  - severity: low
