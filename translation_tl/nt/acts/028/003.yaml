  yaml_path: translation/nt/acts/028/003.yaml
  text: But when Paul had gathered a bundle of sticks and put them on the fire[b][a], a viper came out because of the heat and fastened onto his hand.
translation:
  language: tl
  text: Nang makapulot si Pablo ng isang bungkos ng mga tuyong sanga at inilagay niya ang mga ito sa apoy, isang ulupong ang lumabas dahil sa init[a] at kumapit sa kamay niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “mula sa init.” Mas literal na ganito maisasalin ang pang-ukol sa Griyego, bagaman malamang na sanhi ang ipinahahayag dito: lumabas ang ulupong dahil sa init ng apoy.'
    reason: lexical_alternative
  - marker: b
    text: 'O, “dumakma sa kamay niya” o “kinagat ang kamay niya.” Mas malawak ang kahulugan ng pandiwang Griyego: “kumapit” o “humawak nang mahigpit.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: συστρέψαντος
  choice: makapagtipon
  rationale: Ipinapakita ng aorist participle ang kilos ni Pablo na nauna sa paglabas ng ulupong. Sa konteksto ng panggatong, ang diwa ay magtipon o mamulot nang sama-sama, hindi literal na pilipitin.
- source_word: φρυγάνων τι πλῆθος
  choice: isang bungkos ng mga tuyong sanga
  rationale: Ang φρύγανα ay maliliit at tuyong sanga o palumpong na ginagamit na panggatong, at ang τι πλῆθος ay tumutukoy sa di-tiyak na dami. Ang “isang bungkos” ay kongkreto at natural sa Filipino.
- source_word: ἐπιθέντος ἐπὶ τὴν πυράν
  choice: mailagay niya ang mga iyon sa apoy
  rationale: Malinaw at likas nitong ipinahahayag ang paglalagay ng natipong panggatong sa apoy habang pinananatili ang pagkakasunod ng mga kilos.
- source_word: ἔχιδνα
  choice: isang ulupong
  rationale: Ang ἔχιδνα ay partikular na tumutukoy sa makamandag na uri ng ahas, hindi lamang sa isang pangkalahatang ahas. Ang “ulupong” ang maikli at tiyak na katumbas.
- source_word: ἀπὸ τῆς θέρμης
  choice: dahil sa init
  rationale: 'Bagaman literal na maaaring isaling “mula sa init,” malamang na nagsasaad dito ang ἀπό ng sanhi: lumabas ang ulupong dahil sa init ng apoy.'
- source_word: ἐξελθοῦσα
  choice: lumabas
  rationale: Natural at tuwirang inilalarawan nito ang paglabas ng ulupong, nang hindi pinabibigat ang pangungusap sa anyong participle.
- source_word: καθῆψε τῆς χειρὸς αὐτοῦ
  choice: kumapit sa kamay niya
  rationale: Ang καθάπτω ay maaaring mangahulugang kumapit, dumakma, o humawak nang mahigpit. Pinananatili ng “kumapit” ang malawak na larawan ng pagkapit ng ulupong nang hindi tiyak na sinasabing kumagat ito.
