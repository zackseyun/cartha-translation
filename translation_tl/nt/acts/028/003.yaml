translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga tuyong sanga” bilang pangkaraniwang katawagan sa maliliit na panggatong, “ulupong” upang mapanatili ang tiyak na uri ng ahas, at “kumapit” upang hindi paliitin ang saklaw ng pandiwang Griyego.
