  text: γνωστὸν οὖν ⸂ἔστω ὑμῖν⸃ ὅτι τοῖς ἔθνεσιν ἀπεστάλη ⸀τοῦτο τὸ σωτήριον τοῦ θεοῦ· αὐτοὶ καὶ ⸀ἀκούσονται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/028.yaml
  text: Therefore let it be known to you that this salvation of God has been sent to the Gentiles[b][a]; they also will listen.
translation:
  language: tl
  text: Kaya dapat ninyong malaman na ang kaligtasang ito ng Diyos[a] ay ipinadala na sa mga Hentil; sila rin ay makikinig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kaligtasang ito mula sa Diyos.” Maaaring unawain sa higit sa isang magkalapit na paraan ang ugnayan ng mga salita sa Griyego.
    reason: lexical_alternative
  - marker: b
    text: O “sila rin ay makakarinig.” Maaaring mangahulugan ang pandiwa ng simpleng pagkarinig o ng pakikinig at pagtugon, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: Kaya dapat ninyong malaman
  rationale: 'Natural na Filipino ito para sa pormal na pahayag na may puwersang pautos: ipinababatid ni Pablo bilang kongklusyon mula sa naunang talakayan.'
- source_word: τοῖς ἔθνεσιν
  choice: sa mga Hentil
  rationale: Sa kontekstong Judio–di-Judio sa Mga Gawa, tumutukoy ito sa mga taong hindi Judio; pinananatili ng “mga Hentil” ang kinikilalang katawagang biblikal.
- source_word: ἀπεστάλη
  choice: ay ipinadala na
  rationale: Ipinahahayag ng aorist passive ang natapos na pagpapadala, at ipinakikita ng “na” ang kasalukuyang kabuluhan ng naganap.
- source_word: τοῦτο τὸ σωτήριον τοῦ θεοῦ
  choice: ang kaligtasang ito ng Diyos
  rationale: Pinananatili ang substantibong “kaligtasan” at ang sadyang maluwag na ugnayan ng genitibong τοῦ θεοῦ, sa halip na paliitin ito bilang mensahe lamang.
- source_word: αὐτοὶ καὶ ἀκούσονται
  choice: sila rin ay makikinig
  rationale: Ipinahihiwatig ng konteksto ang pagtanggap o pakikinig, hindi lamang pisikal na pagkarinig; isinasalin ng “rin” ang diin ng αὐτοὶ καί.
theological_decisions:
- issue: Kahulugan ng σωτήριον sa konteksto
  choice: kaligtasan
  alternative: mensaheng nagliligtas
  rationale: Ang salitang Griyego ay tumutukoy mismo sa kaligtasan. Bagaman kasama sa konteksto ang pagpapahayag, hindi kailangang limitahan ang malawak na diwa nito sa mensahe lamang.
- issue: Ugnayan ng τοῦ θεοῦ sa σωτήριον
  choice: kaligtasan ... ng Diyos
  alternative: kaligtasan ... mula sa Diyos
  rationale: Pinananatili ng pangunahing teksto ang tunay na kalabuan kung ang diin ay nasa pag-aari, pinagmulan, o kaugnayan sa Diyos; inilalahad sa talababa ang malapit na alternatibo.
- issue: Puwersa ng ἀκούσονται
  choice: makikinig
  alternative: makakarinig
  rationale: Sa paghahambing sa hindi pagtanggap ng ilan, malamang na tumutukoy ito sa handang pakikinig. Gayunman, hindi nito tahasang sinasabing lahat ay sasampalataya o maliligtas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Hentil” bilang pamilyar na katawagang biblikal para sa mga hindi Judio, at iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
