id: ACT.28.1
reference: Acts 28:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ διασωθέντες τότε ⸀ἐπέγνωμεν ὅτι ⸀Μελίτη ἡ νῆσος καλεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/001.yaml
  text: After we had been brought safely through[d][c][b][a], we then learned that the island was called Malta.
translation:
  language: tl
  text: Nang ligtas na kaming nakaraos[a], saka namin nalaman na Malta[b] ang tawag sa pulo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang ligtas kaming makatakas” o “nang maligtas kami.” Maaaring bigyang-diin ng pandiwang Griyego ang ligtas na pagkalampas sa panganib.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, Melitē, ang pulong tradisyonal na kinikilalang Malta.
    reason: cultural_note
  - marker: c
    text: Sa literal, “ang pulo ay tinatawag na Malta.” Gumagamit ang Griyego ng pangkasalukuyang anyong passive sa impormasyong iniulat.
    reason: lexical_alternative
lexical_decisions:
- source_word: διασωθέντες
  choice: Nang ligtas na kaming nakaraos
  rationale: Ipinahihiwatig ng aorist passive participle ang matagumpay na pagkaligtas mula sa panganib. Likas sa Tagalog ang “ligtas na nakaraos” at hindi nito nililimitahan ang kahulugan sa simpleng pagdating sa dalampasigan.
- source_word: τότε
  choice: saka
  rationale: 'Malinaw na ipinakikita ng “saka” ang pagkakasunod-sunod: matapos silang makaraos, noon nila nalaman ang pangalan ng pulo.'
- source_word: ἐπέγνωμεν
  choice: nalaman namin
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa pagkakaroon o pagkatuklas ng bagong impormasyon, hindi lamang sa pagkilala sa isang bagay na dati nang alam.
- source_word: Μελίτη
  choice: Malta
  rationale: Ginamit ang karaniwang makabagong pangalan ng pulong tradisyonal at pangkasaysayang kinikilalang tinutukoy ng Griyegong Μελίτη.
- source_word: ἡ νῆσος
  choice: ang pulo
  rationale: Ang “pulo” ay malinaw, maikli, at karaniwang salin ng νῆσος sa modernong Filipino.
- source_word: καλεῖται
  choice: ang tawag
  rationale: Natural na paraan ito sa Filipino upang ipahayag ang pangalan ng isang lugar. Bagaman nasa present passive ang Griyego, hindi kailangang piliting panatilihin ang anyong passive sa salin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Pinili ang “nakaraos” upang ipahiwatig ang pagkalampas sa panganib ng pagkawasak ng barko, at ang “saka” upang mapanatili ang malinaw na daloy ng salaysay.
