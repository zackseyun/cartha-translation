  text: καὶ καταχθέντες εἰς Συρακούσας ἐπεμείναμεν ἡμέρας τρεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/012.yaml
  text: And after putting in at Syracuse[a], we stayed there three days.
translation:
  language: tl
  text: At nang dumaong kami sa Siracusa[a], nanatili kami roon nang tatlong araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang makarating kami sa daungan ng Siracusa.” Ang pandiwang Griego ay ginagamit dito sa diwang pandagat.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταχθέντες
  choice: nang dumaong kami
  rationale: Sa konteksto ng paglalayag, ang κατάγω ay tumutukoy sa pagdaong o pagpasok ng sasakyang-dagat sa isang daungan. Likas at tiyak sa modernong Filipino ang “dumaong.”
- source_word: εἰς Συρακούσας
  choice: sa Siracusa
  rationale: Bagaman may diwang patungo o papasok ang εἰς, karaniwang ginagamit sa Filipino ang “sa” kasunod ng pandiwang “dumaong” upang tukuyin ang daungang narating.
- source_word: ἐπεμείναμεν
  choice: nanatili kami roon
  rationale: Ang ἐπιμένω ay nangangahulugang manatili. Ang “roon” ay likas na nagpapahayag na sa Siracusa sila nanatili, gaya ng ipinahihiwatig ng konteksto.
- source_word: ἡμέρας τρεῖς
  choice: nang tatlong araw
  rationale: Ang parirala ay akusatibo ng tagal ng panahon. Sa Filipino, natural itong ipinahahayag sa “nang tatlong araw.”
- source_word: Συρακούσας
  choice: Siracusa
  rationale: Ginamit ang anyong “Siracusa,” isang tuwirang transliterasyong angkop sa ortograpiyang Filipino para sa pangalan ng sinaunang lungsod.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at natural. Pinanatili ang pandagat na diwa ng participle sa pamamagitan ng “dumaong,” at inilagay ang kinakailangang panandang talababa sa mismong teksto.
