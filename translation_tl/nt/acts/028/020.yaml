base_translation:
  language: en
  yaml_path: translation/nt/acts/028/020.yaml
  text: For this reason[a], therefore, I asked to see you and to speak with you, for it is because of the hope of Israel that I am wearing this chain.
translation:
  language: tl
  text: Dahil nga rito, hiniling kong makita at makausap kayo, sapagkat dahil sa pag-asa ng Israel[a] ay nakatali ako sa tanikalang ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “pag-asang inaasahan ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ ταύτην οὖν τὴν αἰτίαν
  choice: Kaya dahil dito
  rationale: Pinananatili nito kapuwa ang paghihinuha ng οὖν at ang sanhi ng διὰ ταύτην τὴν αἰτίαν, ngunit natural pa rin sa makabagong Filipino.
- source_word: παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι
  choice: hiniling kong makita at makausap kayo
  rationale: Ipinahahayag ang magalang na paghiling at ang layuning personal na makita at makipag-usap sa kanila, nang hindi ito ginagawang legal na pag-apela.
- source_word: τῆς ἐλπίδος τοῦ Ἰσραήλ
  choice: pag-asang inaasahan ng Israel
  rationale: Natural na ipinahahayag ang pag-asang nauugnay sa Israel habang hindi nililimitahan kung ito ay tipan, Mesiyas, pagkabuhay na muli, o ang kabuuan ng mga ito. Inilalagay sa talababa ang mas pormal at posibleng mas malawak na anyong henitibo.
- source_word: τὴν ἅλυσιν ταύτην περίκειμαι
  choice: suot ko ang tanikalang ito
  rationale: Pinananatili ang kongkretong larawan ng περίκειμαι, na tumutukoy sa isang bagay na nakapalibot o nakasuot sa tao, at ang isahan ng ἅλυσις.
theological_decisions:
- issue: Kahulugan ng “pag-asa ng Israel”
  choice: pag-asang inaasahan ng Israel
  alternative: pag-asa ng Israel; pag-asa tungkol sa muling pagkabuhay; pag-asang mesianiko ng Israel
  rationale: Malawak at pahapyaw ang parirala sa Griyego. Maaaring saklaw nito ang mga pangako ng Diyos sa Israel, kabilang ang Mesiyas at muling pagkabuhay, kaya hindi tahasang nililinaw ang isa lamang na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “tanikalang ito” ay nagpapanatili sa pisikal na larawan ng pagkakabilanggo, at ang “suot ko” ay sadyang matingkad ngunit likas na mauunawaan sa konteksto.
