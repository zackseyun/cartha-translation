  text: ὁ μὲν οὖν ἀποτινάξας τὸ θηρίον εἰς τὸ πῦρ ἔπαθεν οὐδὲν κακόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/005.yaml
  text: So he[a], after shaking the creature off into the fire, suffered no harm.
translation:
  language: tl
  text: Kaya, matapos niyang ipagpag ang hayop[a] sa apoy, hindi siya nagtamo ng anumang pinsala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mabangis na hayop” o “nilalang.” Pangkalahatan ang salitang Griyego, bagaman ipinakikilala ito ng konteksto bilang isang ahas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν οὖν
  choice: Kaya ... niya
  rationale: Ang artikulo ay ginagamit bilang panghalip na tumutukoy kay Pablo, at ang μέν οὖν ay banayad na nagpapatuloy sa salaysay. Likas sa Tagalog ang tahasang panghalip na “niya” sa sugnay.
- source_word: ἀποτινάξας
  choice: ipinagpag
  rationale: Ipinahihiwatig ng aorist participle ang kilos na nauna sa pangunahing pandiwa. Sa Tagalog, natural na naipapakita ang pagkakasunod ng mga kilos sa “ipinagpag ... at,” nang hindi gumagamit ng mabigat na hulma.
- source_word: τὸ θηρίον
  choice: ang hayop
  rationale: Pangkalahatang tawag ang θηρίον sa isang hayop, bagaman malinaw sa konteksto na ahas ito. Pinananatili ng “hayop” ang lawak ng salitang Griyego.
- source_word: εἰς τὸ πῦρ
  choice: sa apoy
  rationale: Sa pandiwang “ipinagpag,” likas na ipinahihiwatig ng “sa apoy” ang direksiyong papasok o patungo sa apoy; mas natural ito kaysa “papasok sa apoy.”
- source_word: ἔπαθεν οὐδὲν κακόν
  choice: hindi siya napinsala
  rationale: Natural at malinaw na katumbas ito ng idyomang Griyego na nagsasabing wala siyang dinanas na masamang epekto o kapinsalaan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “hayop” upang mapanatili ang pangkalahatang kahulugan ng θηρίον, at inilagay ang marker kaagad pagkatapos ng salita.
