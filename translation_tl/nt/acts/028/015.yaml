id: ACT.28.15
reference: Acts 28:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: κἀκεῖθεν οἱ ἀδελφοὶ ἀκούσαντες τὰ περὶ ἡμῶν ⸀ἦλθαν εἰς ἀπάντησιν ἡμῖν ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν, οὓς ἰδὼν ὁ Παῦλος εὐχαριστήσας τῷ θεῷ ἔλαβε θάρσος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/015.yaml
  text: And from there the brothers[a], when they heard about us, came to meet us as far as Appius Forum and Three Taverns. When Paul saw them, he gave thanks to God and took courage.
translation:
  language: tl
  text: At mula roon, nang mabalitaan ng mga kapatid[a] ang tungkol sa amin, pumunta sila upang salubungin kami hanggang sa Pamilihan ni Apio at sa Tatlong Taberna. Nang makita sila ni Pablo, nagpasalamat siya sa Diyos at lumakas ang kanyang loob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay literal na “mga kapatid na lalaki,” ngunit karaniwan itong tawag sa mga kapwa mananampalataya at maaaring kabilang dito ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: At mula roon
  rationale: Pinananatili ang pang-ugnay at ang paglipat ng lugar sa nagpapatuloy na salaysay ng paglalakbay.
- source_word: οἱ ἀδελφοὶ
  choice: mga kapatid
  rationale: Karaniwang tawag ito sa mga kapwa mananampalataya. Likas sa Tagalog ang “mga kapatid” at hindi nito kailangang tukuyin ang kasarian; nililinaw sa talababa na maaaring kabilang ang mga babae.
- source_word: ἀκούσαντες τὰ περὶ ἡμῶν
  choice: nang mabalitaan ... ang tungkol sa amin
  rationale: Ipinahahayag ang temporal na gamit ng participle at ang diwang nakarating sa kanila ang ulat tungkol sa pangkat ni Pablo, nang hindi dinaragdagan ng tahasang salitang “balita” bilang hiwalay na layon.
- source_word: ἦλθαν εἰς ἀπάντησιν ἡμῖν
  choice: pumunta sila upang salubungin kami
  rationale: Ang parirala ay tumutukoy sa pagpunta upang salubungin ang dumarating na pangkat; malinaw at natural ito sa modernong Tagalog.
- source_word: ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν
  choice: hanggang sa Pamilihan ni Apio at sa Tatlong Taberna
  rationale: Ang “hanggang sa” ay nagpapanatili sa saklaw na ipinahihiwatig ng ἄχρι. Isinalin ang mga pangalang-lugar ayon sa kahulugan habang pinananatili ang mga pangalang pantangi.
- source_word: οὓς ἰδὼν ὁ Παῦλος
  choice: Nang makita sila ni Pablo
  rationale: Ginawang likas na temporal na sugnay sa Tagalog habang malinaw na ang mga kapatid ang tinutukoy ng panghalip.
- source_word: εὐχαριστήσας τῷ θεῷ
  choice: nagpasalamat siya sa Diyos
  rationale: Tapat na ipinapahayag ang pasasalamat ni Pablo sa Diyos at ang pagkakasunod ng mga pangyayari.
- source_word: ἔλαβε θάρσος
  choice: lumakas ang kanyang loob
  rationale: Natural na idyomang Tagalog para sa literal na “tumanggap ng lakas ng loob,” nang hindi ito ginagawang mas matinding “naging matapang.”
theological_decisions:
- issue: Saklaw ng οἱ ἀδελφοί sa pangkat ng mga Kristiyano
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae; mga mananampalataya
  rationale: Ang “mga kapatid” ay kapwa malapit sa anyong Griyego at likas na kolektibong tawag sa Tagalog. Hindi nito nilulutas nang sapilitan kung may mga babae sa pangkat, kaya inilalahad sa talababa ang posibleng inklusibong saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Pamilihan ni Apio” at “Tatlong Taberna” bilang madaling maunawaang mga pangalang-lugar, at “lumakas ang kanyang loob” bilang natural na katumbas ng idyomang Griyego.
