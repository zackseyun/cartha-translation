  text: τούτου ⸀δὲ γενομένου καὶ οἱ λοιποὶ οἱ ⸂ἐν τῇ νήσῳ ἔχοντες ἀσθενείας⸃ προσήρχοντο καὶ ἐθεραπεύοντο,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/009.yaml
  text: And after this happened[a], the rest of those on the island who had diseases also came and were healed.
translation:
  language: tl
  text: Matapos mangyari ito, lumapit din ang iba pang nasa isla na may mga karamdaman, at pinagaling sila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτου δὲ γενομένου
  choice: Pagkatapos mangyari ito
  rationale: Likas na ipinapahayag sa Tagalog ang temporal na genitive absolute at ang paglipat ng salaysay na minamarkahan ng δέ.
- source_word: οἱ λοιποί
  choice: ang iba pa
  rationale: Tumutukoy ito sa iba bukod sa naunang binanggit na ama ni Publio; mas natural sa Tagalog ang “iba pa” kaysa sa literal na “mga natitira.”
- source_word: οἱ ἐν τῇ νήσῳ
  choice: sa isla
  rationale: Ipinananatili ang lokasyon ng pangkat sa isla nang hindi inuulit ang pantukoy na magiging mabigat sa Tagalog.
- source_word: ἔχοντες ἀσθενείας
  choice: mga may karamdaman
  rationale: Tapat ito sa literal na diwang “may mga karamdaman” at natural sa modernong Tagalog; hindi nito nililimitahan ang saklaw sa isang tiyak na uri ng sakit.
- source_word: προσήρχοντο
  choice: lumapit
  rationale: Ipinahahayag ang paglapit nang hindi idinaragdag ang hindi tahasang layon na “sa kanya.” Sa konteksto, maaaring saklawin ng anyong Griyego ang paulit-ulit na paglapit ng mga tao.
- source_word: καὶ
  choice: din
  rationale: Ipinakikita na ang mga pagpapagaling na ito ay karagdagan sa naunang pagpapagaling.
- source_word: ἐθεραπεύοντο
  choice: pinagaling sila
  rationale: 'Malinaw at likas na Tagalog na nagpapanatili sa pasibong diwa: tumanggap sila ng pagpapagaling, bagaman hindi tahasang pinangalanan sa sugnay ang gumagawa.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at madaling maunawaan. Pinanatili ang pasibong pagpapagaling at hindi idinagdag ang “kay Pablo,” yamang ipinahihiwatig lamang iyon ng konteksto at hindi tahasang nasa talata.
