  source_fidelity: Tumpak ang salin sa pangunahing diwa ng talata. Ang “Pinarangalan din nila kami nang lubos” ay maayos na idiomatikong pagsasalin ng emphatic na πολλαῖς τιμαῖς ἐτίμησαν; ang cognate repetition at “many honors” ay wastong naipaliwanag sa talababa. Ang “nang papalaot na kami” ay angkop sa pandagat na gamit ng ἀναγομένοις, at ang “isinakay nila ang mga kailangan namin” ay malinaw na naghahatid ng ἐπέθεντο τὰ πρὸς τὰς χρείας bilang pagkakaloob at pagkakarga ng mga panustos.
