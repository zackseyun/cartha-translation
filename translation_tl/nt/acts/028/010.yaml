base_translation:
  language: en
  yaml_path: translation/nt/acts/028/010.yaml
  text: They also honored us greatly[a], and when we were setting sail[c][b], they put on board what we needed.
translation:
  language: tl
  text: Pinarangalan din nila kami nang lubos[a], at nang papalaot na kami[b], isinakay nila ang mga kailangan namin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “pinarangalan nila kami ng maraming parangal.” Inuulit sa Griyego ang salitang-ugat para sa “parangal.”'
    reason: lexical_alternative
  - marker: b
    text: O “nang magsisimula na kaming maglayag.” Ang pandiwa ay terminong pandagat para sa pag-alis sakay ng barko.
    reason: lexical_alternative
  - marker: c
    text: O “inilaan nila sa amin ang mga kailangan namin.” Mas literal na sinasabi ng Griyego na inilagay nila ang mga bagay na kailangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλαῖς τιμαῖς ἐτίμησαν
  choice: pinarangalan ... nang lubos
  rationale: Likas sa modernong Tagalog at malinaw na ipinahahayag ang matinding pagpaparangal. Iniiwasan nito ang alanganing literal na pag-uulit na “pinarangalan ng maraming parangal,” habang ang pag-uulit sa Griyego ay inilalahad sa talababa.
- source_word: ἀναγομένοις
  choice: nang papalaot na kami
  rationale: Sa kontekstong pandagat, ang ἀνάγω ay tumutukoy sa pagsisimula ng paglalayag o pagput out to sea; ang “papalaot” ay maikli, natural, at tiyak sa konteksto.
- source_word: ἐπέθεντο
  choice: isinakay nila
  rationale: Ipinahihiwatig ng pandiwang ito na inilagay ang mga bagay sa sasakyang-dagat. Ang “isinakay” ay natural na Tagalog at pinananatili ang konkretong kilos ng pagkakarga sa barko.
- source_word: τὰ πρὸς τὰς χρείας
  choice: ang mga kailangan namin
  rationale: Tumutukoy ang parirala sa mga bagay o panustos na kailangan. Pinananatili ng “mga kailangan namin” ang konkretong diwa nang hindi inuulit nang alanganin ang salitang “kailangan.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “papalaot” upang mapanatili ang pandagat na kahulugan, at inilagay sa mga talababa ang mas literal o alternatibong pagbasa.
