  to: Pagkaraan ng tatlong araw, ipinatawag ni Pablo ang mga pinuno ng mga Judio.[a] Nang magkatipon sila, sinabi niya sa kanila, “Ako, mga kapatid,[b] kahit wala akong ginawang anumang laban sa bayan o sa mga kaugalian ng mga ninuno,[c] ay ibinigay bilang bilanggo mula sa Jerusalem sa mga kamay ng mga Romano.[d]”
