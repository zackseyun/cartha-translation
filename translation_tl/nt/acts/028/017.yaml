  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς συγκαλέσασθαι ⸀αὐτὸν τοὺς ὄντας τῶν Ἰουδαίων πρώτους· συνελθόντων δὲ αὐτῶν ἔλεγεν πρὸς αὐτούς· ⸂Ἐγώ, ἄνδρες ἀδελφοί⸃, οὐδὲν ἐναντίον ποιήσας τῷ λαῷ ἢ τοῖς ἔθεσι τοῖς πατρῴοις δέσμιος ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/017.yaml
  text: It happened that after three days he called together the leading men of the Jews[a]. And when they had come together, he said to them, “I, brothers, though I had done nothing against the people or the customs of our fathers[d][c][b], was delivered as a prisoner from Jerusalem into the hands of the Romans.”
translation:
  language: tl
  text: Pagkaraan ng tatlong araw, ipinatawag ni Pablo ang mga pinuno ng mga Judio.[a] Nang magkatipon sila, sinabi niya sa kanila, “Ako, mga kapatid,[b] kahit wala akong ginawang anumang laban sa bayan o sa mga kaugalian ng mga ninuno,[c] ay ibinigay bilang bilanggo mula sa Jerusalem sa mga kamay ng mga Romano.[d]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga nangunguna sa mga Judio” o “mga pangunahing tao sa mga Judio.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kapatid” ay salin ng salitang Griyego na ἀδελφοί. Dito, kinakausap ni Pablo ang mga lalaking pinuno ng mga Judio na ipinatawag niya.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin na “mga kaugaliang minana sa mga ninuno.”
    reason: lexical_alternative
  - marker: d
    text: 'Maaari ring isalin na “ipinaubaya ... sa mga Romano.” Mas literal sa Griyego: “ibinigay sa mga kamay ng mga Romano.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς
  choice: Pagkaraan ng tatlong araw
  rationale: Ginagawang natural sa Tagalog ang karaniwang panandang pasalaysay ni Lucas nang hindi nagdaragdag ng tahasang ‘ngayon’; tuwirang pinananatili ang takdang panahon.
- source_word: συγκαλέσασθαι αὐτὸν
  choice: ipinatawag ni Pablo
  rationale: Ang ‘ipinatawag’ ay natural na katumbas ng pagpapatawag upang magtipon. Ginamit ang pangalang ‘Pablo’ upang luminaw ang reperente sa isang talatang binabasang mag-isa.
- source_word: τοὺς ὄντας τῶν Ἰουδαίων πρώτους
  choice: ang mga pinuno ng mga Judio
  rationale: Ang πρῶτοι ay tumutukoy sa katayuan o pagiging prominente, hindi sa pagkakasunod-sunod; malinaw at likas sa modernong Tagalog ang ‘mga pinuno.’
- source_word: συνελθόντων δὲ αὐτῶν
  choice: Nang magkatipon sila
  rationale: Natural na temporal na sugnay para sa Greek genitive absolute.
- source_word: Ἐγώ, ἄνδρες ἀδελφοί
  choice: Mga kapatid
  rationale: Pinananatili ang mapagkapatid na pakikiisa sa mga lalaking Judiong kausap. Hindi isinama ang literal na ‘mga lalaki’ at hiwalay na ‘ako’ dahil magiging asiwa sa kasalukuyang Tagalog; malinaw na ang nagsasalita sa kasunod na ‘ako.’
- source_word: οὐδὲν ἐναντίον ποιήσας
  choice: kahit wala akong ginawang anumang laban sa
  rationale: 'Ipinakikita ng ‘kahit’ ang kon sesibong puwersa ng participle: sa kabila ng kawalan niya ng ginawang laban sa kanila, ibinigay siya sa kustodiya.'
- source_word: τῷ λαῷ
  choice: ating bayan
  rationale: Sa konteksto, tumutukoy ang λαός sa bayang Judio. Ipinahahayag ng ‘ating’ ang pakikiisa ni Pablo sa mga kausap, bagaman walang tahasang panghalip sa Griyego.
- source_word: τοῖς ἔθεσι τοῖς πατρῴοις
  choice: mga kaugaliang minana natin sa ating mga ninuno
  rationale: Malinaw na ipinapahayag ang minanang katangian ng πατρῴοις at iniiwasan ang posibleng makitid na pagkaunawa sa literal na ‘mga ama.’
- source_word: δέσμιος
  choice: bilang bilanggo
  rationale: Tumpak na inilalarawan ang kalagayang legal at nasa kustodiya ni Pablo nang siya ay ibigay.
- source_word: ἐξ Ἱεροσολύμων
  choice: mula sa Jerusalem
  rationale: Tuwirang pahayag ng pinagmulan.
- source_word: παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων
  choice: ibinigay ... sa mga kamay ng mga Romano
  rationale: Pinananatili ang pasibong legal na diwa ng παραδίδωμι at ang konkretong idyomang ‘sa mga kamay,’ na nauunawaan din sa Tagalog bilang pagpapasailalim sa kapangyarihan o kustodiya.
theological_decisions:
- issue: Pagtawag na ἀδελφοί
  choice: Mga kapatid
  alternative: Mga lalaking kapatid / Mga kapatid na lalaki
  rationale: Mga lalaking pinunong Judio ang kausap, ngunit ang natural na Tagalog na ‘Mga kapatid’ ay sapat na nagpapahayag ng pakikiisa at hindi nagpapahiwatig na kababaihan ang kasama sa partikular na pangkat.
- issue: Puwersa ng οὐδὲν ἐναντίον ποιήσας
  choice: 'kon sesibo: ‘kahit wala akong ginawang anumang laban sa’'
  alternative: 'temporal o attendant: ‘na walang ginawang anumang laban sa’'
  rationale: Binibigyang-diin ng daloy ng pangungusap ang tensiyon sa pagitan ng sinasabing kawalang-sala ni Pablo at ng pagkakabigay sa kaniya sa mga Romano, nang hindi hinahatulan dito ang kabuuang usaping legal.
- issue: Pakikiisa ni Pablo sa bayang Judio at tradisyon nito
  choice: ‘ating bayan’ at ‘minana natin sa ating mga ninuno’
  alternative: ‘ang bayan’ at ‘mga kaugalian ng mga ninuno’
  rationale: Ang unang panauhang maramihan ay likas na ipinahihiwatig ng pagtawag niyang ‘mga kapatid’ at ng πατρῴοις sa kontekstong ito; ipinakikita nito ang pakikiisa nang hindi nagdaragdag ng denominasyonal na interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘Judio’ at ‘Romano’ bilang karaniwang katawagan. Pinanatili sa pangunahing teksto ang idyomang ‘sa mga kamay’ dahil natural pa rin ito sa Tagalog at mahalaga sa anyo ng pinagmulan; inilagay sa talababa ang alternatibong mas idiomatiko.
