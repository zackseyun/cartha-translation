  terminology: Ang 'mga Judio,' 'mga Romano,' 'mga kapatid,' at 'bilanggo' ay angkop sa modernong Filipino Tagalog at sa rehistrong pampanitikan ng salaysay. Ang 'mga pinuno ng mga Judio' ay wastong sumasagisag sa mga prominenteng kasapi ng pangkat.
