    issue: Ang “wala silang nakitang” ay nagdaragdag ng aspektong ‘nakita/natagpuan nila.’
    rationale: Ang teksto ay nagsasabing walang batayan para sa kamatayan sa kaso ni Pablo, hindi tahasang nagsasabing natagpuan ito ng mga awtoridad. Maaaring mahinuha ito sa konteksto, ngunit hindi kailangang ilagay sa pangunahing salin.
  - severity: low
    issue: Mas matapat ang “batayan” kaysa “sakdal” sa pangunahing salin.
    rationale: Maaaring mangahulugan ang αἰτία ng sakdal, ngunit saklaw din nito ang dahilan o legal na batayan. Ang “batayan” ay pinananatili ang lawak ng termino at tumutugma sa English audit trail.
  revised_text: na, matapos nila akong siyasatin, nais nilang palayain ako, sapagkat walang anumang batayan upang hatulan ako ng kamatayan.[a]
