  source_fidelity: Ang “wala silang nakitang” ay nagdaragdag ng tahasang pagkilos ng mga awtoridad na wala sa Griyego; ipinahahayag ng διὰ τὸ ... ὑπάρχειν ang dahilan bilang kawalan ng batayan. Ang “batayan upang hatulan ako ng kamatayan” ay mas malapit sa αἰτίαν θανάτου ἐν ἐμοί at nananatiling likas sa Tagalog.
  naturalness: Natural at marangal ang binagong pangungusap. Ang ayos na “nais nilang palayain ako” ay mas tuwiran kaysa sa paghihiwalay ng panghalip sa “nais nila akong palayain.”
  terminology: Ginamit ang “batayan” para sa legal na αἰτία at “hatulan ... ng kamatayan” upang ihayag ang hudisyal na saklaw ng θανάτου nang hindi ipinagpapalagay na isang tiyak na teknikal na katawagan ang nasa Griyego.
  issues:
