  text: Μετὰ δὲ τρεῖς μῆνας ⸀ἀνήχθημεν ἐν πλοίῳ παρακεχειμακότι ἐν τῇ νήσῳ Ἀλεξανδρίνῳ, παρασήμῳ Διοσκούροις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/011.yaml
  text: After three months we set sail in an Alexandrian ship that had wintered on the island[a], with the Dioscuri as its figurehead.
translation:
  language: tl
  text: Pagkalipas ng tatlong buwan, pumalaot kami sakay ng isang barkong mula sa Alejandria na nagpalipas ng taglamig sa pulo at may sagisag na Dioscuri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Dioscuri” ay sina Castor at Pollux, ang kambal na mga anak ni Zeus sa mitolohiyang Griyego-Romano.
    reason: Nililinaw ang proper name at ang paganong sanggunian nito para sa mga modernong mambabasa.
lexical_decisions:
- source_word: Μετὰ δὲ τρεῖς μῆνας
  choice: Pagkalipas ng tatlong buwan
  rationale: Ipinahahayag ng μετά na may akusatibo ang panahong lumipas bago nangyari ang kilos. Mahina lamang ang pag-uugnay ng δέ at hindi na kailangang katawanin nang hiwalay sa natural na Tagalog.
- source_word: ἀνήχθημεν
  choice: pumalaot kami
  rationale: Sa kontekstong pandagat, ang ἀνάγω ay nangangahulugang umalis patungong laot o magsimulang maglayag. Ang “pumalaot” ay maikli at likas sa Tagalog.
- source_word: ἐν πλοίῳ ... Ἀλεξανδρίνῳ
  choice: sakay ng isang barkong mula sa Alejandria
  rationale: Ang πλοῖον ay barko, at ang Ἀλεξανδρίνῳ ay nagsasaad ng pinagmulan o kaugnayan sa Alejandria. Mas malinaw sa karaniwang mambabasa ang “mula sa Alejandria” kaysa “barkong Alejandrino.”
- source_word: παρακεχειμακότι ἐν τῇ νήσῳ
  choice: na nagpalipas ng taglamig sa pulo
  rationale: Ang perpektong partisipyong παρακεχειμακότι ay tumutukoy sa barkong nanatili roon sa buong taglamig. Hindi pinangalanan ang pulo sa talata, kaya pinanatili ang “sa pulo” sa halip na idagdag ang Malta.
- source_word: παρασήμῳ Διοσκούροις
  choice: Ang sagisag nito ay ang Dioscuri
  rationale: Ang παράσημος ay maaaring tumukoy sa natatanging sagisag o tanda ng barko; hindi tiyak na isang inukit na pigura sa unahan, kaya hindi ito nilimitahan sa “rebulto sa proa.” Pinanatili ang proper name na Dioscuri at ipinaliwanag sa talababa.
theological_decisions:
- issue: Paglalarawan sa paganong sagisag na Διοσκούροις
  choice: ang Dioscuri
  alternative: ang Kambal na mga Diyos; sina Castor at Pollux
  rationale: Iniulat lamang ng teksto ang sagisag ng barko at hindi ito itinataguyod. Ang “Dioscuri” ang tuwirang katumbas ng pangalang Griyego at iniiwasang gawing bahagi ng pangunahing teksto ang interpretatibong bansag; nililinaw sa talababa kung sino ang tinutukoy.
- issue: Saklaw ng παρασήμῳ
  choice: sagisag
  alternative: rebulto sa proa; tatak
  rationale: Maaaring mangahulugan ang salita ng tanda, sagisag, o palatandaan ng barko. Pinananatili ng “sagisag” ang lehitimong kalabuan tungkol sa eksaktong anyo at kinalalagyan nito.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang “barko,” “pumalaot,” at “sagisag” bilang natural na mga salitang pandagat, habang pinanatili ang pangalang “Dioscuri” at ang kalabuan ng anyo ng sagisag.
