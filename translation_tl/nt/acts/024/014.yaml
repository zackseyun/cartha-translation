  to: Ngunit ipinahahayag ko sa iyo na ayon sa Daan, na tinatawag nilang sekta[a], sa ganitong paraan ako sumasamba sa Diyos ng aming mga ninuno[b], habang nananalig ako sa lahat ng nakasulat sa Kautusan at sa mga Propeta.
  rationale: Inayos ang pang-ugnay upang tuwirang maipakita ang ὅτι at ginawang participial ang huling parirala sa pamamagitan ng “habang nananalig ako,” na mas malapit sa πιστεύων at natural sa Filipino. Itinama rin ang paglalarawan sa literal na diwa ng τῷ πατρῴῳ θεῷ sa talababa. Pinanatili ang lahat ng pangunahing katawagan at ang ambigwidad ng αἵρεσις.
