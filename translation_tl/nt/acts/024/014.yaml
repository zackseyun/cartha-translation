id: ACT.24.14
reference: Acts 24:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁμολογῶ δὲ τοῦτό σοι ὅτι κατὰ τὴν ὁδὸν ἣν λέγουσιν αἵρεσιν οὕτως λατρεύω τῷ πατρῴῳ θεῷ, πιστεύων πᾶσι τοῖς κατὰ τὸν νόμον καὶ ⸂τοῖς ἐν⸃ τοῖς προφήταις γεγραμμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/014.yaml
  text: But I confess this to you[a], that according to the Way, which they call a sect, so I worship the God of our fathers, believing everything written in the Law and in the Prophets[b],
translation:
  language: tl
  text: Ngunit ipinahahayag ko sa iyo na ayon sa Daan, na tinatawag nilang sekta[a], sa ganitong paraan ako sumasamba sa Diyos ng aming mga ninuno[b], habang nananalig ako sa lahat ng nakasulat sa Kautusan at sa mga Propeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pangkat” o “paksyon.” Ang salitang Griyego ay maaaring tumukoy sa isang pangkat o sekta; hindi nito kinakailangang ibig sabihin dito ang “maling pananampalataya” sa mas huling teknikal na gamit.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang Diyos na minana mula sa mga ninuno” o “ang Diyos ng mga ninuno.” Tumutukoy ito sa Diyos na sinamba ng mga ninuno ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογῶ
  choice: ipinahahayag ko
  rationale: Ipinakikita rito ang hayagan at pormal na pagkilala ni Pablo sa harap ni Felix, nang hindi ipinahihiwatig na umaamin siya ng pagkakasala.
- source_word: κατὰ τὴν ὁδόν
  choice: ayon sa Daan
  rationale: Ang “Daan” ay katawagan sa sinaunang kilusang Cristiano sa Mga Gawa; pinananatili ng “ayon sa” ang diwa ng pagsunod o pag-ayon.
- source_word: αἵρεσιν
  choice: sekta
  rationale: Sa kontekstong ito, tumutukoy ito sa isang pangkat o paksyon, hindi kinakailangan sa teknikal at mas huling kahulugan ng maling aral.
- source_word: οὕτως λατρεύω
  choice: sa ganitong paraan ako sumasamba
  rationale: Malinaw na iniuugnay ng parirala ang paraan ng pagsamba ni Pablo sa naunang “ayon sa Daan,” habang ang λατρεύω ay tumutukoy sa paglilingkod na panrelihiyon o pagsamba.
- source_word: τῷ πατρῴῳ θεῷ
  choice: sa Diyos ng aming mga ninuno
  rationale: Natural nitong ipinahahayag sa Filipino ang Diyos na minana at sinamba ng mga ninuno ng Israel, at pinananatili ang pag-angkin ni Pablo ng pagpapatuloy sa pananampalataya ng Israel.
- source_word: πιστεύων πᾶσι τοῖς ... γεγραμμένοις
  choice: at pinaniniwalaan ko ang lahat ng nakasulat
  rationale: Ginagawang natural sa Filipino ang kasalukuyang participle habang pinananatili ang malapit na kaugnayan nito sa pagsamba ni Pablo at ang saklaw na “lahat.”
- source_word: κατὰ τὸν νόμον καὶ τοῖς ἐν τοῖς προφήταις γεγραμμένοις
  choice: sa Kautusan at sa mga Propeta
  rationale: Pinananatili nito ang kinikilalang mga bahagi ng Kasulatan ng mga Judio at ang parallel na ayos ng Griyego.
theological_decisions:
- issue: Ang kaugnayan ni Pablo sa pananampalataya ng Israel at sa Daan
  choice: Inilalarawan ni Pablo ang pagsamba ayon sa Daan bilang pagsamba sa Diyos ng kanilang mga ninuno at bilang pananampalataya sa Kautusan at sa mga Propeta.
  alternative: Ilarawan ang Daan bilang isang hiwalay na relihiyong salungat sa Judaismo.
  rationale: Tahasang pinagdudugtong ng talata ang Daan, ang Diyos ng mga ninuno, at ang mga Kasulatan ng Israel; kaya hindi dapat ipasok sa salin ang isang mas huling ganap na paghihiwalay.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “ipinahahayag” para sa pormal at hayagang pagkilala, “Daan” bilang makasaysayang titulo, at “sekta” na may talababa upang maiwasan ang anakronistikong diwa ng “erehiya.”
