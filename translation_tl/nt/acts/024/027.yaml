id: ACT.24.27
reference: Acts 24:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Διετίας δὲ πληρωθείσης ἔλαβεν διάδοχον ὁ Φῆλιξ Πόρκιον Φῆστον· θέλων τε ⸀χάριτα καταθέσθαι τοῖς Ἰουδαίοις ὁ Φῆλιξ κατέλιπε τὸν Παῦλον δεδεμένον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/027.yaml
  text: But when two years had been completed[a], Felix was succeeded by Porcius Festus; and because Felix wanted to lay up favor with the Jews, he left Paul bound.
translation:
  language: tl
  text: Pagkalipas ng dalawang taon, si Felix ay hinalinhan ni Porcio Festo. At dahil nais ni Felix na pagbigyan ang mga Judio[a], iniwan niyang nakagapos si Pablo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makuha ang mabuting kalooban ng mga Judio.” Maaaring mangahulugan ang pananalitang Griyego ng paggawa ng pabor para sa kanila o ng pagtatamo ng kanilang pagsang-ayon.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διετίας δὲ πληρωθείσης
  choice: Pagkalipas ng dalawang taon
  rationale: Ang genitive absolute ay nagsasaad ng panahong lumipas. Ang salin ay natural sa modernong Tagalog at tumpak na naghahayag na natapos ang dalawang taon.
- source_word: ἔλαβεν διάδοχον
  choice: ay hinalinhan ni
  rationale: Ito ang natural na paraang Tagalog upang ipahayag ang literal na diwang 'tumanggap ng kahalili' sa konteksto ng pagpapalit sa tungkulin.
- source_word: Πόρκιον Φῆστον
  choice: Porcio Festo
  rationale: Isinunod ang mga pangalang Romano sa nakaugaliang anyong Filipino.
- source_word: θέλων
  choice: dahil nais ni Felix
  rationale: Malinaw na ipinahahayag ng pariralang sanhi ang motibo ni Felix na taglay ng participle.
- source_word: χάριτα καταθέσθαι τοῖς Ἰουδαίοις
  choice: na pagbigyan ang mga Judio
  rationale: Natural na Filipino ito para sa idyomang maaaring mangahulugang gumawa o magkaloob ng pabor sa mga Judio. Pinananatili sa talababa ang isa pang posibleng diwa na hangaring makuha ang kanilang mabuting kalooban.
- source_word: κατέλιπε
  choice: iniwan niyang
  rationale: Ipinahahayag nito na nang umalis sa tungkulin si Felix, pinanatili niya si Pablo sa kasalukuyang kalagayan nito.
- source_word: δεδεμένον
  choice: nakagapos
  rationale: Pinananatili nito ang patuloy na kalagayang ipinahahayag ng perfect passive participle nang hindi ito nililimitahan sa tiyak na uri ng tanikala.
theological_decisions:
- issue: Ambiguity of χάριτα καταθέσθαι
  choice: pagbigyan ang mga Judio
  alternative: makuha ang mabuting kalooban ng mga Judio
  rationale: Maaaring tumukoy ang idyoma sa paggawa ng pabor para sa kanila o sa pagtatamo ng kanilang pabor. Pinili sa teksto ang natural na unang diwa, ngunit hindi inalis ang leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “Judio,” “Pablo,” at mga anyong “Porcio Festo” ayon sa karaniwang tradisyong Filipino sa mga pangalang biblikal.
