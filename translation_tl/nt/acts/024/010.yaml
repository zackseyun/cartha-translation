  to: 'Sumagot naman si Pablo nang senyasan siya ng gobernador na magsalita: “Dahil alam kong maraming taon ka nang hukom ng bansang ito, buong-loob kong ilalahad ang aking depensa[a] tungkol sa sarili ko.”'
