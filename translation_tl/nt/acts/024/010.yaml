  yaml_path: translation/nt/acts/024/010.yaml
  text: 'Then Paul answered[a], after the governor had nodded to him to speak: “Knowing that for many years you have been a judge over this nation, I gladly make my defense concerning myself.'
translation:
  language: tl
  text: 'Sumagot naman si Pablo nang senyasan siya ng gobernador na magsalita: “Dahil alam kong maraming taon ka nang hukom ng bansang ito, buong-loob kong ilalahad ang aking depensa[a] tungkol sa sarili ko.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “may lakas ng loob kong ilalahad ang aking depensa.” Ang salitang Griyego ay maaaring magpahiwatig ng kahandaan, lakas ng loob, o masayang kalooban.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθη τε
  choice: Pagkatapos, sumagot si Pablo
  rationale: Ang ἀπεκρίθη ay karaniwang nangangahulugang sumagot o tumugon, at ang τε ay bahagyang nag-uugnay sa pagpapatuloy ng salaysay. Likas sa makabagong Tagalog ang “Pagkatapos” sa ganitong konteksto.
- source_word: νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν
  choice: nang senyasan siya ng gobernador na magsalita
  rationale: Ginawang sugnay na panahunan ang genitive absolute. Maaaring tumukoy ang νεύω sa pagtango o ibang hudyat; pinananatili ng “senyasan” ang saklaw nito nang hindi ipinapalagay na tiyak na pagtango ang kilos.
- source_word: ἡγεμόνος
  choice: gobernador
  rationale: Tumutukoy ito rito sa Romanong awtoridad ng lalawigan; “gobernador” ang malinaw at karaniwang katumbas sa Filipino.
- source_word: Ἐκ πολλῶν ἐτῶν
  choice: maraming taon ka nang
  rationale: Ipinapahayag ng parirala ang tagal mula sa nakaraan hanggang sa kasalukuyan; natural itong inihahatid ng hulaping “nang” sa Filipino.
- source_word: ὄντα σε κριτὴν τῷ ἔθνει τούτῳ
  choice: hukom para sa bansang ito
  rationale: Pinananatili ng “hukom” ang legal na kahulugan ng κριτής. Ang datibong τῷ ἔθνει ay likas na maisasalin bilang “para sa bansang ito,” nang hindi dinaragdagan ang Griyego ng tahasang “namamahala sa.”
- source_word: ἐπιστάμενος
  choice: Dahil alam kong
  rationale: Ipinakikita ng participle ang batayan ng kahandaan ni Pablo na magsalita; malinaw at natural sa Filipino ang sanhiang “Dahil alam kong.”
- source_word: εὐθύμως
  choice: buong-loob
  rationale: Ang adverb ay maaaring magpahiwatig ng kahandaan, lakas ng loob, o masayang kalooban. Sinasaklaw ng “buong-loob” ang kusang kahandaan nang hindi ito nililimitahan sa emosyonal na tuwa lamang.
- source_word: τὰ περὶ ἐμαυτοῦ ἀπολογοῦμαι
  choice: ihaharap ang aking pagtatanggol tungkol sa sarili ko
  rationale: Ang ἀπολογοῦμαι ay terminong legal para sa paglalahad ng depensa. Pinananatili ng “aking pagtatanggol” ang tono ng paglilitis, at ang “tungkol sa sarili ko” ang tuwirang diwa ng τὰ περὶ ἐμαυτοῦ.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino na angkop sa tagpong legal. Ginamit ang “senyasan” sa halip na “tinanguan” upang mapanatili ang tunay na lawak ng νεύω, at “buong-loob” upang hindi labis na paliitin ang εὐθύμως tungo lamang sa tuwa o kumpiyansa.
