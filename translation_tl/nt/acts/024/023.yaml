  text: ⸀διαταξάμενος τῷ ἑκατοντάρχῃ τηρεῖσθαι ⸀αὐτὸν ἔχειν τε ἄνεσιν καὶ μηδένα κωλύειν τῶν ἰδίων αὐτοῦ ⸀ὑπηρετεῖν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/023.yaml
  text: And he ordered the centurion to keep him in custody[a], yet to let him have some freedom[b], and to prevent none of his own people from attending to his needs.
translation:
  language: tl
  text: At iniutos niya sa senturyon na bantayan si Pablo bilang isang bilanggo, ngunit bigyan siya ng kaunting kaluwagan[a] at huwag hadlangan ang sinuman sa mga taong malapit sa kanya[b] sa pag-aasikaso sa kanyang mga pangangailangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bigyan siya ng kaunting ginhawa” o “bigyan siya ng kaunting kalayaan.” Ang salitang Griyego ay maaaring tumukoy sa ginhawa, luwag, o isang antas ng kalayaan mula sa mahigpit na pagkakakulong.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa mga taong kanya.” Maaaring tumukoy ito sa mga kasamahan, kaibigan, o tagasuporta ni Pablo na pinahintulutang tumulong sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαταξάμενος
  choice: iniutos niya
  rationale: Likas na salaysay sa Tagalog para sa aorist participle; malinaw na ipinahahayag ang utos ni Felix nang hindi pinipilit ang anyong pandiwari.
- source_word: τῷ ἑκατοντάρχῃ
  choice: sa senturyon
  rationale: Tumpak at karaniwang katawagan sa opisyal na Romano na namumuno sa mga kawal.
- source_word: τηρεῖσθαι αὐτόν
  choice: bantayan si Pablo bilang isang bilanggo
  rationale: Ipinahahayag ang custodial na diwa ng τηρέω sa konteksto. Ginamit ang pangalang Pablo upang maging malinaw ang reperente ng panghalip sa isang hiwalay na talata.
- source_word: ἔχειν τε ἄνεσιν
  choice: bigyan siya ng kaunting kaluwagan
  rationale: Ang ἄνεσις ay maaaring mangahulugang ginhawa, luwag, o limitadong kalayaan. Ang 'kaunting kaluwagan' ay nagpapanatili sa lawak ng kahulugan at nililinaw na hindi ito ganap na paglaya.
- source_word: τε ... καὶ
  choice: ngunit ... at
  rationale: Pinag-uugnay ang dalawang tagubilin, habang ang 'ngunit' ay natural na nagpapakita ng kaibahan ng pagkakabilanggo at ipinagkaloob na kaluwagan.
- source_word: μηδένα κωλύειν
  choice: huwag hadlangan ang sinuman
  rationale: 'Tuwirang pinananatili ang pangkalahatang negatibong diwa: walang taong dapat pigilan o hadlangan.'
- source_word: τῶν ἰδίων αὐτοῦ
  choice: sa mga kasamahan niya
  rationale: Natural sa modernong Tagalog at hindi nililimitahan sa mga kamag-anak; tinutukoy ang mga taong malapit kay Pablo, gaya ng mga kaibigan o tagasuporta.
- source_word: ὑπηρετεῖν αὐτῷ
  choice: sa pag-aasikaso sa kanyang mga pangangailangan
  rationale: Ipinahahayag ang praktikal na paglilingkod o pagtulong sa konteksto ng pagkakabilanggo, nang walang di-kinakailangang eklesiastikal na pahiwatig.
