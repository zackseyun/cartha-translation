translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Pinili ang 'kaluwagan' upang mapanatili ang tunay na lawak ng ἄνεσις, at nilagyan ng talababa ang mga posibleng kahulugan. Ang 'mga kasamahan niya' ay mas natural kaysa literal na 'mga taong kanya' ngunit hindi ipinapalagay na pamilya ang tinutukoy.
