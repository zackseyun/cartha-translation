  yaml_path: translation/nt/acts/024/009.yaml
  text: And the Jews also joined in the charge[a], asserting that these things were so.
translation:
  language: tl
  text: Nakiisa rin sa paratang ang mga Judio[a] at iginiit na totoo ang mga bagay na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nakiisa rin ang mga Judio at iginiit na totoo ang mga bagay na ito.”
    reason: Pinananatili ng alternatibo ang mas pangkalahatang diwa ng pandiwang συνεπιτίθεμαι, nang hindi tahasang tinutukoy ang pakikiisa sa paratang.
lexical_decisions:
- source_word: συνεπέθεντο
  choice: nakiisa sa paratang
  rationale: Maaaring tumukoy ang pandiwa sa pakikiisa sa isang pagsalakay, pisikal man o pasalita. Dahil paglilitis ang konteksto, likas sa Filipino ang “nakiisa sa paratang,” na nagpapakitang sinuportahan nila ang mga akusasyong iniharap.
- source_word: δὲ καὶ
  choice: rin
  rationale: Ang δέ ay banayad na pang-ugnay at ang καί ay nagdaragdag sa mga Judio sa naunang kumikilos. Sapat at natural na naihahayag ng “rin” ang daloy at karagdagang pakikiisa.
- source_word: οἱ Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Tuwirang tinutukoy nito ang grupong Judiong naroon at nakikiisa sa paglilitis; hindi kailangang dagdagan sa pangunahing teksto ng salitang “mga tagapagparatang.”
- source_word: φάσκοντες
  choice: iginiit
  rationale: Ipinakikilala ng participle ang matibay nilang pahayag bilang suporta sa mga paratang. Ang “iginiit” ay angkop sa legal na tagpo at hindi nagpapahiwatig nang higit sa teksto.
- source_word: ταῦτα οὕτως ἔχειν
  choice: totoo ang mga bagay na ito
  rationale: Ang pariralang Griyego ay idyomatikong nangangahulugang ganito nga ang kalagayan o totoo ang mga nabanggit. Pinananatili ng “mga bagay na ito” ang malawak na pagtukoy ng ταῦτα sa lahat ng naunang sinabi.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Judio” bilang karaniwang katawagan at ang “paratang” upang ipakita ang legal na konteksto nang hindi pinatitindi ito bilang pisikal na pagsalakay.
