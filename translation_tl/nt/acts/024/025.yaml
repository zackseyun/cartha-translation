source:
  edition: SBLGNT
  text: διαλεγομένου δὲ αὐτοῦ περὶ δικαιοσύνης καὶ ἐγκρατείας καὶ τοῦ κρίματος τοῦ ⸀μέλλοντος ἔμφοβος γενόμενος ὁ Φῆλιξ ἀπεκρίθη· Τὸ νῦν ἔχον πορεύου, καιρὸν δὲ μεταλαβὼν μετακαλέσομαί σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/025.yaml
  text: But as he was discussing righteousness and self-control and the coming judgment, Felix became afraid and answered, “For now, go away. When I get an opportunity, I will summon you.”
translation:
  language: tl
  text: Ngunit habang tinatalakay niya ang tungkol sa katuwiran, pagpipigil sa sarili, at darating na paghuhukom, natakot si Felix at sumagot, “Umalis ka muna ngayon. Ipapatawag kita kapag nagkaroon ako ng pagkakataon.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαλεγομένου
  choice: habang ipinakikipag-usap niya
  rationale: Ipinahihiwatig ng pandiwa ang pagpapaliwanag o pakikipagtalakayan, hindi lamang isang payak na pagbanggit.
- source_word: δικαιοσύνης
  choice: katuwiran
  rationale: Pinananatili ang malawak na diwang moral at teolohikal ng dikαιοσύνη nang hindi ito nililimitahan sa legal na katarungan lamang.
- source_word: ἐγκρατείας
  choice: pagpipigil sa sarili
  rationale: Natural at malinaw na katumbas sa modernong Tagalog para sa pagpipigil sa mga pagnanasa at kilos.
- source_word: τοῦ κρίματος τοῦ μέλλοντος
  choice: sa darating na paghuhukom
  rationale: Direktang ipinapahayag ang hinaharap na paghatol na tinutukoy ng parirala.
- source_word: ἔμφοβος γενόμενος
  choice: natakot
  rationale: Maikli at natural na paglalarawan sa pagkapuno ni Felix ng takot.
- source_word: Τὸ νῦν ἔχον πορεύου
  choice: Maaari ka nang umalis sa ngayon
  rationale: 'Inihahatid ang pansamantalang pagpapaalis: sa kasalukuyan ay umalis muna siya.'
- source_word: καιρὸν δὲ μεταλαβών
  choice: kapag nagkaroon ako ng pagkakataon
  rationale: Ang καιρός dito ay angkop o maginhawang pagkakataon, hindi basta kronolohikal na oras.
- source_word: μετακαλέσομαί σε
  choice: Ipatatawag kita
  rationale: Tumpak na ipinahahayag ang pagpapatawag muli ni Felix kay Pablo.
theological_decisions:
- issue: Saklaw ng δικαιοσύνη
  choice: katuwiran
  alternative: katarungan
  rationale: Mas pinananatili ng “katuwiran” ang posibleng moral at teolohikal na lawak ng salita; ang “katarungan” ay maaaring magpaliit dito sa legal o panlipunang diwa.
- issue: Likas ng darating na κρίμα
  choice: darating na paghuhukom
  alternative: darating na hatol
  rationale: Ang “paghuhukom” ay nagpapanatili sa proseso o pangyayari ng paghatol at hindi inuunahan kung ano ang magiging hatol kay Felix.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang malinaw na bokabularyong panrelihiyon nang hindi nagdaragdag ng denominasyonal na paliwanag.
