  to: Ngunit, upang hindi na kita maantala[a] nang higit pa, nakikiusap ako na pakinggan mo kami nang sandali sa iyong kagandahang-loob[b].
  rationale: Pinalitan ang “maabala” ng “maantala” upang mas tumpak na maipahayag ang paghingi ng paumanhin sa pagkuha pa ng oras ng kausap. Ginawang “nang sandali” ang “nang maikli” para sa likas na Filipino, at inayos ang pariralang ukol sa kagandahang-loob upang maging mas idiomatiko nang hindi binabawasan ang legal at magalang na himig ng ἐπιείκεια.
