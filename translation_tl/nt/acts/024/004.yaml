base_translation:
  language: en
  yaml_path: translation/nt/acts/024/004.yaml
  text: But[a], so that I may not delay you any further[b], I beg you to hear us briefly, in your graciousness.
translation:
  language: tl
  text: Ngunit, upang hindi na kita maantala[a] nang higit pa, nakikiusap ako na pakinggan mo kami nang sandali sa iyong kagandahang-loob[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maabala” o “mapigilan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pagkamakatuwiran,” “kahinahunan,” o “pagpapahinuhod.” Ang salitang Griyego ay maaaring tumukoy sa makatarungan, mahinahon, o mapagparayang pakikitungo, lalo na sa paghatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ μὴ
  choice: Ngunit upang hindi
  rationale: Pinananatili ng “ngunit” ang banayad na pagsalungat ng δέ, at ng “upang hindi” ang layuning ipinahihiwatig ng ἵνα μή.
- source_word: ἐπὶ πλεῖόν
  choice: nang higit pa
  rationale: Likas na katumbas ng idyomang nangangahulugang higit pa o mas matagal, lalo na sa konteksto ng pag-ubos sa oras ng gobernador.
- source_word: σε ἐγκόπτω
  choice: kita maabala
  rationale: Ipinahihiwatig dito ng ἐγκόπτω ang pag-antala o pagkuha pa sa oras ni Felix; malinaw at magalang ang “maabala” sa makabagong Filipino.
- source_word: παρακαλῶ
  choice: nakikiusap ako
  rationale: Ang pandiwa ay isang magalang ngunit mariing pakiusap, na angkop sa pormal na pananalita sa pagdinig.
- source_word: ἀκοῦσαί σε ἡμῶν
  choice: pakinggan mo kami
  rationale: Tuwirang inilalarawan ang kahilingang dinggin sila, nang hindi nagdaragdag ng paliwanag na wala sa Griyego.
- source_word: συντόμως
  choice: nang maikli
  rationale: Pinananatili ang ideya ng kaiklian ng kanilang paglalahad, sa halip na gawing tiyak na haba ng panahon.
- source_word: τῇ σῇ ἐπιεικείᾳ
  choice: ayon sa iyong kagandahang-loob
  rationale: Ang “kagandahang-loob” ay natural na magalang na panawagan sa mabait at mapagbigay na pakikitungo, habang inilalahad sa talababa ang saklaw na makatuwiran, mahinahon, o mapagparaya.
