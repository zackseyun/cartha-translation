  naturalness: 'Kailangang ayusin ang dalawang parirala upang maging natural na modernong Filipino: “maantala” ang mas tuwirang magalang na pandiwa rito, at “pakinggan mo kami nang sandali” ang karaniwang ayos para sa maikling pagdinig. Ang “sa iyong kagandahang-loob” ay mas idiomatiko kaysa “ayon sa iyong kagandahang-loob” at nananatiling magalang na apela.'
  terminology: Ang “kagandahang-loob” ay angkop na pangunahing salin para sa ἐπιείκεια sa magalang na pananalita sa harap ng isang pinuno. Pinananatili ng talababa ang saklaw na katarungan, kahinahunan, at pagpapahinuhod, lalo na sa legal na konteksto.
