base_translation:
  language: en
  yaml_path: translation/nt/acts/024/018.yaml
  text: In these things they found me purified in the temple[a], not with a crowd nor with an uproar[b],
translation:
  language: tl
  text: Sa mga bagay na ito, natagpuan nila akong napadalisay na ayon sa ritwal sa templo[a], hindi kasama ng pulutong ni may kaguluhan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang «napadalisay na ayon sa ritwal» ay tumutukoy sa ritwal o seremonyal na pagdadalisay.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν αἷς
  choice: Sa mga pagkakataong ito
  rationale: Ipinahihiwatig ng pambabaeng pangmaramihang panghalip na panao ang naunang binanggit na mga gawain o pangyayari. Pinananatili ng salin ang ugnayang iyon sa natural na Tagalog nang hindi nililimitahan sa iisang tiyak na antecedent.
- source_word: εὗρόν με
  choice: natagpuan nila ako
  rationale: 'Karaniwan at tuwirang salin sa kontekstong pasalaysay: nadatnan o natagpuan ng mga tagapag-akusa si Pablo sa templo.'
- source_word: ἡγνισμένον
  choice: nakapagdalisay na ayon sa ritwal
  rationale: Ang perpektong pasibong participle ay tumutukoy sa natapos nang ritwal na pagdadalisay at sa kalagayang bunga nito. Sa natural na Tagalog, malinaw ang kultikong diwa sa pariralang ito.
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Ang ἱερόν ay tumutukoy sa buong nasasakupan ng templo, hindi lamang sa panloob na santuwaryo. Ang “sa templo” ang natural at karaniwang salin.
- source_word: οὐ μετὰ ὄχλου
  choice: wala akong kasamang maraming tao
  rationale: Ipinapakita ng μετὰ ὄχλου na hindi kasama o napalilibutan si Pablo ng isang pulutong. Ang “maraming tao” ay neutral at hindi nagpapahiwatig agad ng marahas na mob.
- source_word: οὐδὲ μετὰ θορύβου
  choice: ni anumang kaguluhan
  rationale: Ang θόρυβος ay ingay, pagkakagulo, o pampublikong ligalig. Ang “kaguluhan” ay natural at angkop sa legal na pagtatanggol ni Pablo.
