translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang anaporikong kalabuan ng ἐν αἷς sa “mga pagkakataong ito.” Ginawang tahasan ang ritwal na diwa ng ἡγνισμένον upang maiwasang mapagkamalan itong pangkalahatang moral na paglilinis; may footnote marker [a] sa mismong teksto.
