id: ACT.24.24
reference: Acts 24:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μετὰ δὲ ἡμέρας τινὰς παραγενόμενος ὁ Φῆλιξ σὺν Δρουσίλλῃ τῇ ⸀ἰδίᾳ γυναικὶ οὔσῃ Ἰουδαίᾳ μετεπέμψατο τὸν Παῦλον καὶ ἤκουσεν αὐτοῦ περὶ τῆς εἰς Χριστὸν ⸀Ἰησοῦν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/024.yaml
  text: After some days[a], Felix came with Drusilla, his own wife, who was Jewish[b], and sent for Paul and heard him concerning faith in Messiah Jesus.
translation:
  language: tl
  text: Pagkaraan ng ilang araw, dumating si Felix kasama ang sarili niyang asawang si Drusila, na Judio, at ipinatawag niya si Pablo at pinakinggan siya tungkol sa pananampalataya kay Mesias Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagtitiwala kay Mesias Jesus.” Maaari ring magpahiwatig ng aktibong pagtitiwala ang salitang Griyego na isinaling “pananampalataya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ἡμέρας τινὰς
  choice: Pagkaraan ng ilang araw
  rationale: Natural na temporal na pananalita sa Tagalog; hindi na kailangang tumbasan nang tahasan ang mahinang pang-ugnay na δέ.
- source_word: παραγενόμενος
  choice: dumating
  rationale: Ipinapahayag ng participle ang pagdating ni Felix sa tagpo.
- source_word: σὺν Δρουσίλλῃ
  choice: kasama si Drusila
  rationale: Tuwirang ipinapahayag ng σύν ang pagsama ni Drusila.
- source_word: τῇ ἰδίᾳ γυναικὶ
  choice: ang sarili niyang asawa
  rationale: Pinananatili ng “sarili niyang” ang diin ng ἰδίᾳ, bagaman bahagyang mas mariin ito kaysa karaniwang Tagalog.
- source_word: οὔσῃ Ἰουδαίᾳ
  choice: na isang Judio
  rationale: Makabago at di-arkaiskong pagtukoy sa pagkakakilanlang Judio ni Drusila; hindi kailangang gumamit ng may-kasariang katawagang tulad ng “Judia.”
- source_word: μετεπέμψατο
  choice: ipinatawag niya
  rationale: Likas na Tagalog para sa pagpapasundo o pagpapatawag sa isang tao.
- source_word: ἤκουσεν αὐτοῦ
  choice: pinakinggan ito
  rationale: Sa konteksto, ang ἀκούω na may genitive ay higit na nagsasaad ng sadyang pakikinig kaysa basta pagkarinig.
- source_word: περὶ τῆς εἰς Χριστὸν Ἰησοῦν πίστεως
  choice: tungkol sa pananampalataya kay Mesias Jesus
  rationale: Ang περί ay nagtatakda ng paksa, at ang εἰς pagkatapos ng πίστις ay tumutukoy sa pinag-uukulan ng pananampalataya.
- source_word: Χριστὸν Ἰησοῦν
  choice: Mesias Jesus
  rationale: Isinasalin ang Χριστός bilang titulong “Mesias” at pinananatili ang ayos ng Griyego.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Ito ang karaniwan at angkop na salin sa konstruksyong tumutukoy sa pananampalatayang nakatuon kay Jesus; maaaring idiin bilang pagtitiwala.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός
  choice: Mesias Jesus
  alternative: Cristo Jesus; si Jesus na Mesias
  rationale: Gumaganap dito ang Χριστός bilang titulo, kaya isinasalin itong “Mesias” sa halip na basta itransliterang “Cristo.”
- issue: Kahulugan ng πίστις εἰς Χριστὸν Ἰησοῦν
  choice: pananampalataya kay Mesias Jesus
  alternative: pagtitiwala kay Mesias Jesus
  rationale: Ang πίστις na sinusundan ng εἰς at accusative ay likas na tumutukoy sa pananampalataya o pagtitiwalang nakatuon kay Jesus, hindi sa katapatan ni Jesus.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maiwasan ang mabigat na sunod-sunod na sugnay habang pinananatili ang pagkakasunod ng salaysay. Ginamit ang “Judio” bilang pangngalan para sa babaeng si Drusila sapagkat karaniwang walang gramatikal na kasarian ang ganitong katawagan sa modernong Filipino.
