  source_fidelity: 'Tumpak ang pangunahing diwa at ang mga relasyon sa pangungusap: dumating si Felix kasama si Drusila, na Judio; ipinatawag niya si Pablo; at nakinig siya tungkol sa pananampalataya kay Mesias Jesus. Gayunman, ang panghalip na “ito” para kay Pablo ay hindi angkop sa modernong Tagalog; dapat “siya.”'
  naturalness: Malinaw ang salin, ngunit mas natural na iugnay si Drusila bilang “asawang si Drusila” at gamitin ang “siya” para sa taong si Pablo. Ang isang pangungusap ay mas malinaw ding nagpapanatili sa iisang paksa ni Felix sa magkakasunod na kilos.
  terminology: Ang “Mesias Jesus” ay wastong pagsasalin ng Χριστὸν Ἰησοῦν ayon sa ibinigay na patakaran. Ang “pananampalataya kay” ay tapat sa πίστις εἰς. Ang “Judio” ay katanggap-tanggap na makabagong katawagan at hindi kailangang lagyan ng pambabaeng anyo.
