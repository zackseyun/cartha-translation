  - severity: low
    issue: Bahagyang mabigat ang “si Drusila, ang sarili niyang asawa.”
    rationale: Mas idiomatiko sa modernong Filipino ang “ang sarili niyang asawang si Drusila,” habang napapanatili ang diin ng ἰδίᾳ.
