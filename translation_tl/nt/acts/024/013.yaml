  yaml_path: translation/nt/acts/024/013.yaml
  text: Nor can they prove to you the things of which they are now accusing me[a].
translation:
  language: tl
  text: Hindi rin nila mapatutunayan sa iyo ang mga bagay na ipinaparatang nila ngayon sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maiharap sa iyo” o “maipakita sa iyo.” Ang pandiwang Griyego ay maaaring mangahulugang magharap o magpatibay ng isang bagay; dito, tumutukoy ito sa pagpapatunay ng isang paratang sa usaping legal.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Hindi rin
  rationale: Ipinagpapatuloy nito ang pagtanggi ni Pablo mula sa naunang talata; natural sa modernong Tagalog ang “Hindi rin.”
- source_word: παραστῆσαι
  choice: mapatutunayan
  rationale: Bagaman maaari itong mangahulugang magharap o magpakita, sa kontekstong legal tumutukoy ito sa pagpapatibay o pagpapatunay ng paratang.
- source_word: δύνανταί
  choice: mapatutunayan
  rationale: Ang kakayahang ipinahahayag ng δύνανται ay natural na naisama sa anyong potensiyal na “mapatutunayan.”
- source_word: σοι
  choice: sa iyo
  rationale: Tuwirang isinasalin ang datibo na tumutukoy kay Felix, na siyang kinakausap ni Pablo.
- source_word: περὶ ὧν
  choice: ang mga bagay na
  rationale: Pinananatili ang malawak na pagtukoy sa mga usaping ipinaparatang nang hindi ito labis na tinutukoy bilang pormal na mga sakdal.
- source_word: νυνὶ
  choice: ngayon
  rationale: Tuwirang ipinahahayag ang kasalukuyang panahon ng pag-aakusa.
- source_word: κατηγοροῦσίν μου
  choice: ipinaparatang nila ngayon sa akin
  rationale: Ang “ipinaparatang” ay malinaw na nagdadala ng legal na diwa ng pandiwa, habang ang “sa akin” ay natural na katumbas ng genitibong panghalip.
