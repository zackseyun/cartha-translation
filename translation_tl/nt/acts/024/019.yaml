translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pananalitang angkop sa pagdinig sa harap ng isang opisyal, habang pinananatili ang hindi natupad na obligasyon sa ἔδει at ang di-tiyak na kondisyong εἴ τι ἔχοιεν.
