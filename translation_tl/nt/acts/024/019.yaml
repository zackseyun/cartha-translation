  text: τινὲς δὲ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι, οὓς ⸀ἔδει ἐπὶ σοῦ παρεῖναι καὶ κατηγορεῖν εἴ τι ἔχοιεν πρὸς ⸀ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/019.yaml
  text: But there are some Jews from Asia who ought to have been present before you and to accuse me[b][a], if they had anything against me.
translation:
  language: tl
  text: Ngunit may ilang Judio mula sa Asia[a] na dapat sana’y humarap sa iyo at magparatang laban sa akin[b], kung may anuman silang laban sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Asia” rito ay ang lalawigan ng Roma sa Asia Minor, hindi ang kontinenteng tinatawag ngayong Asia.
    reason: cultural_note
  - marker: b
    text: O “magharap ng paratang laban sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς
  choice: ilang
  rationale: Likas na Filipino para sa di-tiyak na pangkat o bilang, nang hindi ipinahihiwatig kung sinu-sino sila.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang pagsalungat sa naunang pahayag ni Pablo.
- source_word: ἀπὸ τῆς Ἀσίας
  choice: mula sa Asia
  rationale: Pinananatili ang makasaysayang pangalang heograpiko sa teksto; nililinaw sa talababa na lalawigan ng Roma ang tinutukoy.
- source_word: Ἰουδαῖοι
  choice: Judio
  rationale: Karaniwan at tuwirang katawagan sa modernong Filipino para sa mga taong Judio.
- source_word: ἔδει
  choice: dapat sana’y
  rationale: Ipinahahayag ang obligasyon o nararapat gawin na hindi natupad, ayon sa puwersa ng imperpektong ἔδει sa konteksto.
- source_word: ἐπὶ σοῦ παρεῖναι
  choice: humarap sa iyo
  rationale: Natural na pananalita sa kontekstong legal para sa pagharap sa opisyal o hukom.
- source_word: κατηγορεῖν
  choice: magparatang laban sa akin
  rationale: Tuwirang inilalarawan ang legal na pag-aakusa nang hindi labis na tinutukoy kung pormal nang naisampa ang kaso.
- source_word: εἴ τι ἔχοιεν πρὸς ἐμέ
  choice: kung mayroon man silang anumang laban sa akin
  rationale: Pinananatili ang malawak at bahagyang di-tiyak na pananalita ng Griyego, pati ang kondisyunal na diwa, sa halip na tukuying tiyak na sakdal ang kanilang taglay.
