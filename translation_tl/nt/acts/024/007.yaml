  text: But[a] Lysias the commander came and took him out of our hands with great force,
translation:
  language: tl
  text: Ngunit dumating si Lisias, ang kumander, at sapilitang kinuha siya mula sa aming mga kamay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang talatang ito—kasama ang hulihan ng talata 6 at ang simula ng talata 8—ay wala sa pinakamaagang mga manuskritong Griyego, kabilang ang Papyrus 74 mula sa ikatlong siglo at ang Sinaiticus at Vaticanus mula sa ikaapat na siglo, gayundin sa mga sinaunang saling Coptic. Napananatili naman ito sa tradisyong Bizantino ng nakararaming manuskrito, sa tradisyong Latin, at sa mas huling mga manuskritong Griyego. Tila isa itong maagang dagdag na editoryal na nagsasalaysay ng pakikialam ng kumander na Romano bago si Felix.
    reason: textual_critical
lexical_decisions:
- source_word: παρελθὼν
  choice: dumating
  rationale: Ang aorist participle ay nagsasaad ng pagdating ni Lisias sa tagpo; ginawang pandiwang may tiyak na panahunan upang maging natural ang daloy sa Tagalog.
- source_word: χιλίαρχος
  choice: kumander
  rationale: Tumutukoy ito sa mataas na opisyal ng hukbong Romano, literal na pinuno ng isang libo. Ang “kumander” ay malinaw at madaling maunawaan nang hindi nagpapanggap na eksaktong katumbas ang modernong ranggo.
- source_word: μετὰ πολλῆς βίας
  choice: sapilitan
  rationale: Ipinahahayag nito ang paggamit ng matinding pisikal na puwersa. Natural sa Tagalog ang “sapilitan” at hindi nito kinakailangang ipahiwatig ang malisyosong karahasan.
- source_word: ἐκ τῶν χειρῶν ἡμῶν ἀπήγαγεν
  choice: inagaw siya mula sa aming mga kamay
  rationale: Pinananatili nito ang matingkad na idyoma ng Griyego at ang pananaw ng mga nagsasakdal na kinuha si Pablo mula sa kanilang pagkakahawak.
