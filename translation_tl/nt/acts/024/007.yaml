translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “kumander” sa halip na teknikal na “tribuno,” at pinanatili ang retorikal na pananaw ng nagsasalita sa “aming mga kamay.”
