  text: ἅμα καὶ ἐλπίζων ὅτι χρήματα δοθήσεται αὐτῷ ὑπὸ τοῦ ⸀Παύλου· διὸ καὶ πυκνότερον αὐτὸν μεταπεμπόμενος ὡμίλει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/026.yaml
  text: At the same time he was hoping that money would be given to him by Paul[a]; therefore he also sent for him more often and talked with him.
translation:
  language: tl
  text: Kasabay nito, umaasa rin siya na bibigyan siya ni Pablo ng pera[a]. Dahil dito, mas madalas din niyang ipinapatawag si Pablo at kinakausap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tiyak ayon sa konteksto, “umaasa siyang susuhulan siya ni Pablo.” “Pera” lamang ang tahasang sinasabi sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα καὶ
  choice: Kasabay nito
  rationale: Ipinapahayag nito na ang pag-asang tumanggap ng pera ay kasabay ng naunang pangyayari, sa natural na modernong Tagalog.
- source_word: ἐλπίζων
  choice: umaasa rin siyang
  rationale: Ipinakikita ng kasalukuyang participle ang patuloy na pag-asa ni Felix habang paulit-ulit niyang ipinapatawag si Pablo; ang “rin” ay sumasalamin sa καί.
- source_word: χρήματα
  choice: pera
  rationale: Ang salitang Griyego ay pangkalahatang tumutukoy sa pera. Bagaman ipinahihiwatig ng konteksto ang suhol, hindi iyon tahasang sinasabi ng mismong salita.
- source_word: δοθήσεται αὐτῷ ὑπὸ τοῦ Παύλου
  choice: bibigyan siya ni Pablo
  rationale: Natural ito sa Tagalog at malinaw na si Pablo ang inaasahang pagmumulan ng pera, kahit ginawang aktibo ang pasibong ayos ng Griyego.
- source_word: διὸ καὶ
  choice: Kaya
  rationale: 'Malinaw na ipinapakita ang bunga o dahilan: dahil umaasa siyang mabibigyan ng pera, mas madalas niyang ipinatawag si Pablo.'
- source_word: πυκνότερον
  choice: mas madalas
  rationale: Tumpak at karaniwang panumbas sa pahambing na pang-abay na nagsasaad ng mas mataas na dalas.
- source_word: μεταπεμπόμενος
  choice: ipinatawag
  rationale: Ang gitnang participle ay nangangahulugang magpatawag o magsugo upang dalhin ang isang tao; ang “ipinatawag” ay angkop sa kalagayan ni Pablong nasa kustodiya.
- source_word: ὡμίλει αὐτῷ
  choice: kinausap ito
  rationale: Ipinahihiwatig ng pandiwa ang personal na pakikipag-usap, hindi isang pormal na talumpati. Ginamit ang “ito” upang maging malinaw na si Pablo ang kausap.
theological_decisions:
- issue: Kung tahasang tatawaging “suhol” ang perang inaasahan ni Felix
  choice: Panatilihin ang “pera” sa pangunahing teksto at ipaliwanag sa talababa ang malakas na pahiwatig ng suhol.
  alternative: “umaasa siyang susuhulan siya ni Pablo” o “umaasa siyang bibigyan siya ni Pablo ng suhol”
  rationale: Malakas ang pahiwatig ng katiwalian sa konteksto, ngunit χρήματα lamang, “pera,” ang ginamit ng Griyego. Pinananatili nito ang pagkakaiba sa pagitan ng tahasang sinabi at ng ipinahihiwatig.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinili ang natural na aktibong ayos na “bibigyan siya ni Pablo” sa halip na ang mas mabigat na pasibong hulma, habang pinananatili ang kahulugan at ang hindi tahasang pagtukoy sa suhol.
