  text: But Felix, having a more accurate knowledge about the Way, put them off, saying, “When Lysias the commander comes down, I will decide your case.”
translation:
  language: tl
  text: Ngunit ipinagpaliban muna ni Felix ang pagdinig sa kanila[a], dahil mas tumpak ang nalalaman niya tungkol sa Daan[b]. Sinabi niya, “Kapag bumaba ang kumander na si Lisias, pagpapasiyahan ko ang usapin ninyo[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “ipinagpaliban muna niya sila”; ang pandiwang Griyego ay maaaring tumukoy sa pagpapaliban o pansamantalang paghinto ng hakbang na panghukuman.
    reason: lexical_alternative
  - marker: b
    text: Ang “Daan” ay isang sinaunang katawagan sa kilusang Cristiano.
    reason: cultural_note
  - marker: c
    text: Maaari ring, “pagpapasiyahan ko ang mga bagay na nauukol sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνεβάλετο ... αὐτούς
  choice: ipinagpaliban muna ang pagdinig sa kanila
  rationale: Ipinahahayag nito sa natural na Filipino ang pagpapaliban ng hakbang na panghukuman habang pinananatiling mga taong nasasangkot ang tinutukoy ng αὐτούς. Ang “pagdinig” ay kontekstuwal na paglilinaw, kaya inilakip ang alternatibo sa talababa.
- source_word: ἀκριβέστερον εἰδὼς
  choice: na mas tumpak ang kaalaman
  rationale: Pinananatili ang paghahambing na diwa ng ἀκριβέστερον at ang pangkaalamang diwa ng εἰδὼς nang hindi tahasang ginagawang sanhi ang pariralang participial.
- source_word: τὰ περὶ τῆς ὁδοῦ
  choice: tungkol sa Daan
  rationale: Ang “Daan” ay natural ngunit kinikilalang katawagan sa kilusang Cristiano sa Mga Gawa; ang malaking titik at talababa ay nagpapahiwatig ng natatanging gamit nito.
- source_word: Ὅταν ... καταβῇ
  choice: Kapag bumaba rito
  rationale: Ang “kapag” ay angkop sa isang inaasahang pangyayari sa hinaharap. Pinananatili ng “bumaba” ang pandiwang heograpikal, at nililinaw ng “rito” ang pagdating sa kinaroroonan ni Felix.
- source_word: χιλίαρχος
  choice: kumander
  rationale: Malinaw at kasalukuyang katawagan ito para sa Romanong opisyal-militar, nang hindi gumagamit ng di-pamilyar na transliterasyon.
- source_word: διαγνώσομαι τὰ καθ’ ὑμᾶς
  choice: pagpapasiyahan ko ang usapin ninyo
  rationale: Inihahatid nito ang legal na diwa ng pagpapasiya sa mga bagay na nauukol sa kanila, habang hindi nagdaragdag ng tiyak na magiging hatol.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang legal na “pagdinig” at “usapin” para luminaw ang tagpo, ngunit iniwasang gawing mas tiyak kaysa sa Griyego ang magiging pasiya ni Felix.
