  text: ὃς καὶ τὸ ἱερὸν ἐπείρασεν βεβηλῶσαι, ὃν καὶ ⸀ἐκρατήσαμεν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/006.yaml
  text: He even tried to defile the temple[a], and we seized him,
translation:
  language: tl
  text: Tinangka pa nga niyang lapastanganin ang templo[a], at siya ay dinakip namin,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang manuskritong nagdaragdag dito ng mas mahabang teksto, kabilang ang pahayag na nilalayon nilang hatulan si Pablo ayon sa kanilang kautusan, ngunit sapilitang inalis siya sa kanilang kamay ni Lisias na kumander. Nagkakaiba-iba ang eksaktong anyo ng dagdag na ito.
    reason: textual_variant
lexical_decisions:
- source_word: ὃς
  choice: niyang
  rationale: Ang panghalip na paugnay ay tumutukoy kay Pablo. Sa natural na Tagalog, isinama ito sa pandiwang “tinangka” bilang “niyang” sa halip na gumamit ng literal at mabigat na “na siyang.”
- source_word: καὶ
  choice: pa nga
  rationale: Dito, pinatitindi ng καὶ ang paratang. Likas sa Tagalog ang “pa nga” upang ipahiwatig na umabot pa ang ibinibintang sa pagtatangkang lapastanganin ang templo.
- source_word: τὸ ἱερὸν
  choice: ang templo
  rationale: Ang ἱερόν ay tumutukoy sa kabuuang bakuran o kompleks ng templo, hindi lamang sa panloob na santuwaryo. Ang “templo” ang malinaw at karaniwang tawag sa Tagalog.
- source_word: ἐπείρασεν
  choice: Tinangka
  rationale: Sa kontekstong ito, ang πειράζω ay nangangahulugang sumubok o nagtangkang gawin ang isang bagay. Ang “tinangka” ay maikli, natural, at angkop sa pormal na paratang.
- source_word: βεβηλῶσαι
  choice: lapastanganin
  rationale: Ang βεβηλόω ay tumutukoy sa paglapastangan o paglabag sa kabanalan ng isang sagradong lugar. Pinananatili ng “lapastanganin” ang relihiyoso at seremonyal na bigat ng paratang nang hindi ito nililimitahan sa pisikal na pagdungis.
- source_word: ὃν
  choice: siya
  rationale: Ang panghalip ay muling tumutukoy kay Pablo bilang layon ng sumunod na pandiwa. Natural sa Tagalog ang “siya” pagkatapos ng “dinakip namin.”
- source_word: ἐκρατήσαμεν
  choice: dinakip namin
  rationale: Ang κρατέω ay maaaring mangahulugang sunggaban, hulihin, o dakpin. Ang “dinakip” ay nagpapanatili ng puwersahang paghawak nang hindi ipinapalagay ang isang ganap na pormal at legal na pag-aresto.
theological_decisions:
- issue: Anyo ng teksto sa Mga Gawa 24:6 kaugnay ng mas mahabang pagbasa sa ilang manuskrito
  choice: Isinalin lamang ang maikling tekstong nasa SBLGNT, na nagtatapos sa “kaya dinakip namin siya,”
  alternative: May ilang manuskritong nagdaragdag na nais nilang hatulan si Pablo ayon sa kanilang kautusan at na sapilitang kinuha siya ni Lisias na pinuno mula sa kanilang mga kamay; nagkakaiba-iba ang eksaktong anyo ng dagdag.
  rationale: Ang ibinigay na orihinal na tekstong Griyego ay ang maikling kritikal na pagbasa. Hindi isinama sa pangunahing teksto ang mas mahabang variant, ngunit itinabi ito sa talababa upang malaman ng mga mambabasa ang mahalagang pagkakaibang tekstuwal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “lapastanganin” upang maipahayag ang paglabag sa kabanalan ng templo, at “dinakip” upang mapanatili ang puwersahang diwa ng κρατέω. Ang kuwit sa hulihan ay sadyang nagpapanatili sa pagpapatuloy ng pangungusap sa kasunod na talata.
