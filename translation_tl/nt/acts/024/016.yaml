base_translation:
  language: en
  yaml_path: translation/nt/acts/024/016.yaml
  text: In view of this[a], I myself also strive always to have a blameless conscience before God and men.
translation:
  language: tl
  text: Dahil dito[a], ako mismo ay palaging nagsisikap ding magkaroon ng budhing walang kapintasan sa harap ng Diyos at ng mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “Sa bagay na ito.” Maaaring tumukoy ang pariralang Griyego sa kalagayan o katotohanang kababanggit lamang, o magpahayag ng dahilan: “Dahil dito.”'
    reason: Pinananatili ang posibleng saklaw ng ἐν τούτῳ at ang ugnayan nito sa naunang talata.
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Dahil dito
  rationale: Likas sa modernong Tagalog ang pariralang ito at ipinahihiwatig ang kaugnayan ng pagsisikap ni Pablo sa naunang binanggit niyang pag-asa. Nananatili sa talababa ang mas literal at posibleng pagbasa.
- source_word: καὶ αὐτὸς
  choice: ako mismo ... din
  rationale: Pinananatili ng “mismo” ang pagdiriin ng αὐτός at ng “din” ang pandagdag na diwa ng καί, nang hindi nagiging labis na mabigat ang pangungusap.
- source_word: ἀσκῶ
  choice: nagsisikap
  rationale: Ipinahahayag nito ang patuloy at sinasadyang moral na pagsasanay o pagpupunyagi na tinutukoy ng pandiwa.
- source_word: ἀπρόσκοπον
  choice: walang kapintasan
  rationale: Sa pagkakaugnay nito sa budhi, inilalarawan ng salita ang budhing hindi nararapat sisihin o pinagmumulan ng pagkatisod. Mas natural ito kaysa sa literal na “walang pagkatisod.”
- source_word: συνείδησιν
  choice: budhi
  rationale: Karaniwan at dignified na salitang Tagalog para sa panloob na kamalayang moral.
- source_word: ἔχειν
  choice: magkaroon
  rationale: Tuwirang ipinapahayag ang layon ng pagsisikap ni Pablo, nang hindi ipinapasok ang dagdag na diwa ng “panatilihin.”
- source_word: πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους
  choice: sa harap ng Diyos at ng mga tao
  rationale: Ipinakikita ng “sa harap” ang pananagutan at kaugnayan kapuwa sa Diyos at sa sangkatauhan. Ang “mga tao” ay likas na pangkalahatang katumbas ng ἀνθρώπους sa Tagalog.
- source_word: διὰ παντός
  choice: laging
  rationale: Malinaw at natural na ipinahahayag ang tuloy-tuloy na saklaw ng panahon.
theological_decisions:
- issue: Kaugnayan ng budhi sa Diyos at sa mga tao
  choice: sa harap ng Diyos at ng mga tao
  alternative: hinggil sa Diyos at sa mga tao
  rationale: Pinananatili ng “sa harap” ang diwa ng pananagutan nang hindi nililimitahan ang πρός sa alinman sa asal, reputasyon, o pansariling pakiramdam lamang.
- issue: Pangkalahatang saklaw ng ἀνθρώπους
  choice: mga tao
  alternative: mga lalaki
  rationale: Sa konteksto, ang ἀνθρώπους ay tumutukoy sa mga tao sa pangkalahatan, hindi lamang sa mga lalaking nasa hustong gulang. Eksaktong naipapahayag ng karaniwang Tagalog na “mga tao” ang saklaw na ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Iniwasan ang lipas o teknikal na pananalita; pinanatili naman ang pagdiriin ng “ako mismo ... din” at ang moral at panrelasyong bigat ng “budhing walang kapintasan.”
