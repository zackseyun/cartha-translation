  text: From him[a], by examining him yourself[b], you will be able to learn about all these things of which we accuse him.
translation:
  language: tl
  text: Mula sa kanya[a], sa pamamagitan ng sarili mong pagsisiyasat sa kanya[b], magagawa mong malaman ang lahat ng bagay na ito na ibinibintang namin laban sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang mas pormal: “Mula sa kanya, matapos mo siyang siyasatin, magagawa mong matiyak ang tungkol sa lahat ng bagay na ito na ibinibintang namin laban sa kanya.”'
    reason: lexical_alternative
  - marker: b
    text: May ilang manuskrito na nagdaragdag sa talata 7 ng pahayag na sapilitang kinuha ni kumandante Lisias si Pablo at iniutos na humarap kay Felix ang mga tagapagsakdal. Hindi kasama ang mga salitang iyon sa tekstong SBLGNT na sinusundan dito.
    reason: textual_variant
lexical_decisions:
- source_word: παρ’ οὗ
  choice: mula sa kanya
  rationale: Ang παρά na may genitive ay nagpapahayag ng pinagmumulan. Likas sa modernong Tagalog ang “mula sa kanya,” at ipinahihiwatig na kay Pablo mismo maaaring makuha ni Felix ang impormasyon.
- source_word: δυνήσῃ
  choice: malalaman mo
  rationale: Ang pandiwa ay nagsasaad na magkakaroon si Felix ng kakayahang malaman ang mga bagay na ito. Sa Tagalog, likas na naipapaloob ang ideya ng kakayahan sa “malalaman mo” nang hindi nagiging mabigat ang pangungusap.
- source_word: αὐτὸς
  choice: ikaw mismo
  rationale: Idinidiin ng panghalip na ang personal na pagsisiyasat ni Felix ang tinutukoy.
- source_word: ἀνακρίνας
  choice: kapag … nagsiyasat
  rationale: Sa kontekstong legal, ang ἀνακρίνω ay tumutukoy sa masusing pagsusuri o pagtatanong. Pinananatili ng “nagsiyasat” ang mas malawak na diwa kaysa sa simpleng “nagtanong.”
- source_word: περὶ πάντων τούτων
  choice: ang lahat ng bagay
  rationale: Ipinananatili nito ang saklaw ng πάντων τούτων, habang ang kaugnayang “tungkol sa” ay likas na naihahayag sa kasunod na pariralang “ipinaparatang namin.”
- source_word: ἐπιγνῶναι
  choice: malalaman
  rationale: Sa legal na konteksto, nangangahulugan itong matiyak o malaman matapos magsiyasat. Ang “malalaman” ay malinaw at natural sa karaniwang mambabasa.
- source_word: ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ
  choice: na ipinaparatang namin sa kanya
  rationale: Malinaw nitong pinananatili ang legal na diwa ng κατηγορέω at ang tahasang diin ng ἡμεῖς sa mga tagapagsakdal.
