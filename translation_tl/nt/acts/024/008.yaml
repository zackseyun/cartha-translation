  register: Makabago, malinaw, at marangal na Tagalog. Inayos ang pagkakasunod ng mga parirala upang maging natural sa Filipino, ngunit pinanatili ang diin sa personal na pagsisiyasat ni Felix, ang legal na himig, at ang diwa ng pagkuha ng impormasyon mula sa akusado.
