  naturalness: Natural at malinaw sa modernong Tagalog ang binagong ayos. Ang paglalagay ng “Mula sa kanya” sa unahan ay nagpapanatili ng diin ng παρ’ οὗ, samantalang ang “sa pamamagitan ng sarili mong pagsisiyasat sa kanya” ay malinaw na legal at idiomatiko.
  terminology: Ang “pagsisiyasat” ay angkop para sa ἀνακρίνω sa kontekstong panghukuman. Ang “ibinibintang namin laban sa kanya” ay natural na legal na katumbas ng κατηγοροῦμεν αὐτοῦ at mas malinaw kaysa “ipinaparatang namin sa kanya.”
