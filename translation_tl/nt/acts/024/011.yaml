source:
  edition: SBLGNT
  text: δυναμένου σου ⸀ἐπιγνῶναι, ὅτι οὐ πλείους εἰσίν μοι ἡμέραι ⸀δώδεκα ἀφ’ ἧς ἀνέβην προσκυνήσων ⸀εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/011.yaml
  text: as you are able to ascertain[a], that it has been no more than twelve days since I went up to Jerusalem to worship,
translation:
  language: tl
  text: Maaari mong tiyakin[a] na hindi hihigit sa labindalawang araw ang lumipas mula nang umakyat ako sa Jerusalem upang sumamba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, maaari mong alamin
    reason: lexical_alternative
lexical_decisions:
- source_word: δυναμένου σου ἐπιγνῶναι
  choice: Maaari mong tiyakin
  rationale: Ipinahahayag nito na kayang alamin at patunayan ni Felix ang mga pangyayari. Ang “tiyakin” ay likas sa makabagong Filipino at angkop sa kontekstong legal.
- source_word: οὐ πλείους εἰσίν μοι ἡμέραι δώδεκα
  choice: hindi hihigit sa labindalawang araw ang lumipas
  rationale: Isinasalin nito sa likas na Filipino ang idyomatikong Griyego tungkol sa haba ng panahong lumipas, habang pinananatili ang hangganang “hindi hihigit sa labindalawang araw.”
- source_word: ἀφ’ ἧς
  choice: mula nang
  rationale: Malinaw nitong itinatakda ang simula ng binibilang na panahon.
- source_word: ἀνέβην
  choice: umakyat ako
  rationale: Pinananatili nito ang karaniwang sinaunang paraan ng pagsasabing umaakyat patungong Jerusalem, sa halip na gawing payak lamang na “pumunta.”
- source_word: προσκυνήσων
  choice: upang sumamba
  rationale: Ipinahahayag ng pariralang ito ang layunin ng pag-akyat. Hindi idinagdag ang tahasang layon na “sa Diyos” sapagkat pahiwatig lamang ito sa Griyego.
- source_word: εἰς Ἰερουσαλήμ
  choice: sa Jerusalem
  rationale: Ito ang natural na Filipino para sa patutunguhang lungsod.
