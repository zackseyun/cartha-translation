translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang himig ng legal na pagtatanggol at ang saklaw ng magkakasunod na pagtanggi, habang iniwasan ang sobrang pormal na “pulutong” sa pangunahing teksto at ang labis na marahas na “mandurumog.”
