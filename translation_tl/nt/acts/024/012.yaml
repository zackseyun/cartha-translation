  text: καὶ οὔτε ἐν τῷ ἱερῷ εὗρόν με πρός τινα διαλεγόμενον ἢ ⸀ἐπίστασιν ποιοῦντα ὄχλου οὔτε ἐν ταῖς συναγωγαῖς οὔτε κατὰ τὴν πόλιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/012.yaml
  text: And they found me neither in the temple arguing with anyone nor stirring up a crowd[b][a], neither in the synagogues nor throughout the city.
translation:
  language: tl
  text: Hindi nila ako natagpuang nakikipagtalo kaninuman sa templo[a] o nagpapakilos ng pulutong[b], ni sa mga sinagoga ni saanman sa lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nakikipagkatuwiran kaninuman” o “nakikipag-usap kaninuman.” Ang pandiwang Griyego ay maaaring tumukoy sa pangangatuwiran, talakayan, o pagtatalo; sa kontekstong ito, ipinagtatanggol ni Pablo ang sarili laban sa paratang na nanggugulo siya sa publiko.
    reason: lexical_alternative
  - marker: b
    text: O, “nagiging sanhi ng pagtitipon ng isang pulutong.” Tumutukoy ang pananalitang Griyego sa pagpapakilos o pagbuo ng isang pulutong at maaaring magpahiwatig ng pampublikong kaguluhan, ngunit hindi nito kinakailangang ipahiwatig ang isang ganap na pag-aaklas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερῷ
  choice: templo
  rationale: Sa Mga Gawa, ang ἱερόν ay karaniwang tumutukoy sa buong bakuran o kompleks ng templo, hindi lamang sa panloob na santuwaryo. Likas at sapat na malawak ang “templo” sa Filipino.
- source_word: εὗρόν με
  choice: nila ako natagpuang
  rationale: 'Pinananatili nito ang diwa ng legal na pagtatanggol ni Pablo: hindi siya nasaksihan o nadatnang gumagawa ng mga ibinibintang.'
- source_word: πρός τινα διαλεγόμενον
  choice: nakikipagtalo kaninuman
  rationale: Maaaring mangahulugan ang διαλέγομαι ng pakikipag-usap, pangangatuwiran, o pakikipagtalo. Sa konteksto ng pagtatanggol laban sa paratang na panggugulo, ang “nakikipagtalo” ang likas na saling hindi naman labis ang tindi.
- source_word: ἐπίστασιν ποιοῦντα ὄχλου
  choice: nag-uudyok ng kaguluhan sa maraming tao
  rationale: Ipinahihiwatig ng parirala ang pagpapakilos o paglikha ng pampublikong pagkakagulo sa isang pulutong. Iniiwasan ng salin ang mas matinding “pag-aaklas” o “riot,” habang ipinakikita ang diwa ng ibinibintang na panggugulo.
- source_word: ὄχλου
  choice: maraming tao
  rationale: Likas sa modernong Filipino ang “maraming tao” para sa isang crowd; hindi ginamit ang “mandurumog” sapagkat magdaragdag iyon ng tiyak na marahas na diwa.
- source_word: συναγωγαῖς
  choice: mga sinagoga
  rationale: Ito ang karaniwan at malinaw na tawag sa mga pook ng pagtitipon at pagsamba ng mga Judio.
- source_word: κατὰ τὴν πόλιν
  choice: saanman sa lungsod
  rationale: 'Ipinapahayag nito ang saklaw na distributibo ng κατά: wala silang natagpuang ganitong ginagawa ni Pablo sa alinmang bahagi ng lungsod.'
