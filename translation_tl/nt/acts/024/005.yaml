  - severity: low
    issue: Hindi likas ang ayos ng unang sugnay.
    rationale: Ang “natuklasan naming salot ang taong ito” ay maaaring ayusin sa mas karaniwang modernong Filipino nang walang pagbabago sa kahulugan.
  revised_text: Sapagkat natuklasan namin na ang taong ito ay isang salot, na nag-uudyok ng mga kaguluhan sa gitna ng lahat ng Judio sa buong daigdig, at isa ring pangunahing pinuno ng pangkat ng mga Nazareno.
