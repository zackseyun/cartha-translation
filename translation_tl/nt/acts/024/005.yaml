  verdict: revise
  source_fidelity: 'Tumpak na naipapasa ng draft ang tatlong paratang: si Pablo ay tinawag na λοιμός (“salot”), inakusang kumikilos upang magdulot ng στάσεις, at itinuring na πρωτοστάτης ng αἵρεσις ng mga Nazareno. Gayunman, ang “ng mga kaguluhan sa lahat ng Judio” ay maaaring mangahulugang ang lahat ng Judio ang tinatamaan ng kaguluhan, samantalang ang Griyego ay tumutukoy sa kaguluhang pinupukaw sa gitna nila. Ang rebisyon ay nililinaw ito nang hindi tinutukoy kung anong antas ng pag-aalsa o karahasan ang nasasangkot.'
  naturalness: Ang “natuklasan naming salot ang taong ito” ay nauunawaan ngunit mabigat at hindi likas ang ayos sa modernong Filipino. Mas malinaw at natural ang “Natuklasan namin na ang taong ito ay isang salot.” Pinananatili ng isang pangungusap ang daloy ng pormal na legal na paratang sa orihinal.
  terminology: Ang “salot,” “mga kaguluhan,” “pangkat,” at “mga Nazareno” ay angkop. Ang “isang pangunahing pinuno” ay natural na katumbas ng πρωτοστάτης sa kontekstong ito at iniiwasang gawing teknikal na hatol na “erehiya” ang αἵρεσις.
