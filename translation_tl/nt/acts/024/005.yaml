  text: εὑρόντες γὰρ τὸν ἄνδρα τοῦτον λοιμὸν καὶ κινοῦντα ⸀στάσεις πᾶσι τοῖς Ἰουδαίοις τοῖς κατὰ τὴν οἰκουμένην πρωτοστάτην τε τῆς τῶν Ναζωραίων αἱρέσεως,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/005.yaml
  text: For we have found this man to be a plague, stirring up riots among all the Jews throughout the inhabited world, and also a ringleader of the sect of the Nazarenes,
translation:
  language: tl
  text: Sapagkat natuklasan namin na ang taong ito ay isang salot, na nag-uudyok ng mga kaguluhan sa gitna ng lahat ng Judio sa buong daigdig, at isa ring pangunahing pinuno ng pangkat ng mga Nazareno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιμόν
  choice: salot
  rationale: Pinananatili ang matinding, mapanirang bansag ng tagausig kay Pablo, sa natural at matalinghagang Filipino.
- source_word: κινοῦντα στάσεις
  choice: nag-uudyok ... ng mga kaguluhan
  rationale: Ang στάσεις ay maaaring tumukoy sa mga pag-aalsa, sedisyon, o mararahas na kaguluhan; ipinahahayag ng 'mga kaguluhan' ang saklaw nang hindi labis na tinutukoy na napatunayang mga riot ang lahat ng paratang.
- source_word: οἰκουμένην
  choice: buong daigdig
  rationale: Karaniwang natural na katumbas sa kontekstong Greco-Roman para sa tinatahanang mundo, na hindi kailangang unawain bilang bawat bahagi ng planeta.
- source_word: πρωτοστάτην
  choice: pangunahing pinuno
  rationale: Ipinahahayag ang isang nangunguna o prominenteng lider, gaya ng paratang sa teksto.
- source_word: αἱρέσεως
  choice: pangkat
  rationale: Sa kontekstong ito, tumutukoy ito sa isang kilusan o partidong panrelihiyon; iniiwasan ng 'pangkat' ang makabagong dogmatikong kahulugan ng 'erehiya.'
- source_word: Ναζωραίων
  choice: mga Nazareno
  rationale: Pinananatili ang makasaysayang katawagan ng mga tagausig sa kilusang kaugnay ni Jesus na taga-Nazaret.
theological_decisions:
- issue: Katayuan ng mga pahayag laban kay Pablo
  choice: Inilahad bilang paratang ng mga tagausig, hindi bilang paghatol ng tagapagsalaysay
  alternative: Gawing mas tiyak na tunay na salot at tagapagpasimula ng mga pag-aalsa si Pablo
  rationale: Bahagi ito ng talumpati ng pag-uusig; hindi dapat patotohanan ng salin ang akusasyon bilang obhetibong hatol.
- issue: Kahulugan ng αἵρεσις
  choice: pangkat
  alternative: sekta o erehiya
  rationale: Ang terminong Griyego rito ay maaaring tumukoy sa isang kinikilalang pangkat o kilusan at hindi pa awtomatikong nagdadala ng kalaunang teknikal na hatol na erehe.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Hinati sa dalawang pangungusap para sa malinaw at natural na daloy, habang pinananatili ang retorikal na bigat ng legal na paratang.
