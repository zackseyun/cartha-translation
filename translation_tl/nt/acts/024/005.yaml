- from: Sapagkat natuklasan naming salot ang taong ito. Nag-uudyok siya ng mga kaguluhan sa lahat ng Judio sa buong daigdig, at siya rin ang pangunahing pinuno ng pangkat ng mga Nazareno.
  to: Sapagkat natuklasan namin na ang taong ito ay isang salot, na nag-uudyok ng mga kaguluhan sa gitna ng lahat ng Judio sa buong daigdig, at isa ring pangunahing pinuno ng pangkat ng mga Nazareno.
  rationale: Inayos ang ayos ng pangungusap para sa likas na modernong Filipino at nilinaw na ang mga kaguluhan ay pinupukaw sa gitna ng mga Judio. Pinanatili ang mapanirang katangian ng mga paratang, ang saklaw na “buong daigdig,” at ang hindi-dogmatikong “pangkat” para sa αἵρεσις.
