  text: κληθέντος δὲ αὐτοῦ ἤρξατο κατηγορεῖν ὁ Τέρτυλλος λέγων· Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ καὶ ⸀διορθωμάτων γινομένων τῷ ἔθνει τούτῳ διὰ τῆς σῆς προνοίας
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/002.yaml
  text: 'And when he had been summoned[a], Tertullus began to accuse him, saying: “Since through you we are enjoying much peace[b], and reforms are being brought to this nation through your foresight,”'
translation:
  language: tl
  text: 'Nang ipatawag si Pablo, nagsimulang akusahan siya ni Tertulo, na nagsabi: “Dahil sa iyo ay nagtatamasa kami ng malaking kapayapaan, at dahil sa iyong maingat na pamamahala[b] ay naisasagawa ang mga pagbabago[a] para sa bansang ito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pagpapabuti” o “mga hakbang sa pagwawasto.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa pamamagitan ng iyong paunang pag-iisip.” Tumutukoy ito rito sa maingat na pagpaplano o pamamahala ng isang pinuno, hindi kinakailangang sa banal na providensiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθέντος δὲ αὐτοῦ
  choice: Nang maipatawag na si Pablo
  rationale: Ang pariralang genitive absolute ay naglalahad ng kalagayan bago ang pangunahing kilos. Nilinaw ang tinutukoy na si Pablo upang maging natural at hindi malabo sa Tagalog; ang “maipatawag” ay angkop sa legal na tagpo.
- source_word: ἤρξατο κατηγορεῖν
  choice: sinimulan siyang akusahan
  rationale: Pinananatili nito ang inceptive na diwa ng konstruksyon at ang tuwirang legal na kahulugan ng κατηγορέω.
- source_word: ὁ Τέρτυλλος
  choice: ni Tertulo
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang Tertullus.
- source_word: λέγων
  choice: Sinabi nito
  rationale: Natural na ipinakikilala sa modernong Tagalog ang nilalaman ng talumpati habang malinaw na si Tertulo ang nagsasalita.
- source_word: Πολλῆς εἰρήνης τυγχάνοντες
  choice: nagtatamasa kami ng lubos na kapayapaan
  rationale: Ipinahahayag ng τυγχάνω kasama ng genitive ang pagtatamo o pagdanas. Ang “nagtatamasa” ay natural at pinananatili ang mapamuring retorika ni Tertulo.
- source_word: διὰ σοῦ
  choice: Sa pamamagitan mo
  rationale: Tuwirang ipinahahayag ang ahensiya o paraang tinutukoy ng διά na may genitive.
- source_word: διορθωμάτων
  choice: mga pagbabago
  rationale: Ang διόρθωμα ay tumutukoy sa mga hakbang na nagwawasto o nagpapabuti. Ang “mga pagbabago” ay malinaw at hindi labis na tiyak; inilalahad sa talababa ang mas espesipikong mga posibilidad.
- source_word: γινομένων τῷ ἔθνει τούτῳ
  choice: naisasagawa ... para sa bansang ito
  rationale: Ang “naisasagawa” ay natural na kumakatawan sa mga pagbabagong nagaganap o isinasagawa, at ang dative ay angkop na isinaling “para sa bansang ito.”
- source_word: διὰ τῆς σῆς προνοίας
  choice: dahil sa iyong maingat na pamamahala
  rationale: Sa kontekstong ito, ang πρόνοια ay tumutukoy sa paunang pag-iisip at maingat na pangangasiwa ng isang pinuno. Ang parirala ay natural sa Tagalog at umiiwas sa di-sinasadyang teolohikal na pahiwatig ng “providensiya.”
theological_decisions:
- issue: Kahulugan ng πρόνοια sa di-teolohikal na konteksto ng pamamahala
  choice: maingat na pamamahala
  alternative: pagiging maagap; maingat na pagpaplano; providensiya
  rationale: Pinupuri rito ni Tertulo ang administrasyon ni Felix, hindi ang banal na pamamahala. Kaya pinili ang saling nagpapakita ng maingat at may-paunang-pag-iisip na pangangasiwa nang hindi nagdaragdag ng teolohikal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang pormal at mapamuring himig ng pambungad ni Tertulo sa legal na pagdinig. Ang mga marker na [a] at [b] ay kapwa nasa pangunahing teksto.
