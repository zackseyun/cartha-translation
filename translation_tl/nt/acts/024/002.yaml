  naturalness: Natural ang rehistrong legal at mapamuri, ngunit mas maayos ang daloy kung ang pagsasalita ni Tertulo ay ipinakikilalang “na nagsabi,” at kung ang pangungusap ay hindi hinahati sa dalawang malayang pangungusap.
  terminology: Ang “mga pagbabago” ay katanggap-tanggap para sa διορθωμάτων, na may mga alternatibong salin sa talababa. Ang “maingat na pamamahala” ay angkop para sa πρόνοια sa kontekstong administratibo at hindi nagdadala ng hindi sinasadyang teolohikal na kahulugan.
