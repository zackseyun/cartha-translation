  to: 'Nang ipatawag si Pablo, nagsimulang akusahan siya ni Tertulo, na nagsabi: “Dahil sa iyo ay nagtatamasa kami ng malaking kapayapaan, at dahil sa iyong maingat na pamamahala[b] ay naisasagawa ang mga pagbabago[a] para sa bansang ito.”'
