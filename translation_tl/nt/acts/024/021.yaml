  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἢ περὶ μιᾶς ταύτης φωνῆς ἧς ἐκέκραξα ⸂ἐν αὐτοῖς ἑστὼς⸃ ὅτι Περὶ ἀναστάσεως νεκρῶν ἐγὼ κρίνομαι σήμερον ⸀ἐφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/021.yaml
  text: 'or about this one statement that I shouted while standing among them: ‘It is concerning the resurrection of the dead that I am being judged before you today.’[a][b]'
translation:
  language: tl
  text: 'o tungkol sa iisang pahayag na ito na isinigaw ko habang nakatayo sa gitna nila: “Tungkol sa muling pagkabuhay ng mga patay ay nililitis ako sa harap ninyo ngayon.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sigaw” o “tinig” sa halip na “pahayag”; maaaring tumukoy ang salitang Griyego sa mismong sinabi o sa tinig o sigaw na ginamit sa pagsabi nito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “muling pagkabuhay mula sa mga patay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς
  choice: pahayag
  rationale: Bagaman maaari itong mangahulugang “tinig” o “sigaw,” dito ay tinutukoy ng περὶ at ng kasunod na nilalaman ang mismong sinabi; natural at malinaw sa Tagalog ang “pahayag.”
- source_word: ἐκέκραξα
  choice: isinigaw ko
  rationale: Ipinahihiwatig ng κράζω ang malakas at hayagang pagsasalita; pinananatili ng “isinigaw ko” ang lakas ng pandiwa.
- source_word: ἐν αὐτοῖς ἑστὼς
  choice: habang nakatayo sa gitna nila
  rationale: Pinananatili nito ang kasabay na kilos ng participle at ang lokasyong ipinahihiwatig ng ἐν αὐτοῖς.
- source_word: ἀναστάσεως νεκρῶν
  choice: muling pagkabuhay ng mga patay
  rationale: Ito ang tuwirang salin ng genitive construction at pinananatili ang pangkalahatang saklaw ng pahayag.
- source_word: κρίνομαι
  choice: nililitis ako
  rationale: Sa kontekstong panghukuman, mas natural sa modernong Tagalog ang “nililitis ako” at malinaw nitong ipinapahayag ang kasalukuyang pasibong diwa.
- source_word: ἐφ’ ὑμῶν
  choice: sa harap ninyo
  rationale: Ang parirala ay tumutukoy sa pagharap sa isang awtoridad o hukuman at hindi kinakailangang nagsasabing sila mismo ang tanging humahatol.
- source_word: ἢ
  choice: o
  rationale: Pinananatili ng payak na “o” ang ugnayan sa naunang pangungusap nang hindi tahasang dinaragdagan ng “maliban.”
- source_word: μιᾶς ταύτης
  choice: iisang ... na ito
  rationale: Ipinahahayag nito kapwa ang pagiging natatangi at ang tiyak na pagtukoy sa nasabing pahayag.
- source_word: σήμερον
  choice: ngayon
  rationale: Sa kontekstong paglilitis, natural na ipinahihiwatig ng “ngayon” ang “sa araw na ito.”
theological_decisions:
- issue: Saklaw ng usaping muling pagkabuhay
  choice: muling pagkabuhay ng mga patay
  alternative: muling pagkabuhay ni Jesus mula sa mga patay
  rationale: Pangkalahatan ang Griyegong περὶ ἀναστάσεως νεκρῶν. Hindi dapat paliitin ng salin ang tinutukoy tungo lamang sa muling pagkabuhay ni Jesus, kahit mahalaga iyon sa mas malawak na konteksto ng Mga Gawa.
- issue: Diwa ng κρίνομαι
  choice: nililitis ako
  alternative: hinahatulan ako
  rationale: Ang konteksto ay isang kasalukuyang pagdinig o paglilitis; ang “hinahatulan” ay maaaring magpahiwatig na naipapataw na ang hatol.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nililitis” para sa natural na wikang panghukuman, habang pinanatili ang lakas ng “isinigaw” at ang pangkalahatang pahayag tungkol sa muling pagkabuhay.
