  text: δι’ ἐτῶν δὲ πλειόνων ⸂ἐλεημοσύνας ποιήσων εἰς τὸ ἔθνος μου παρεγενόμην⸃ καὶ προσφοράς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/017.yaml
  text: After several years I came to bring alms to my nation[a], and offerings.
translation:
  language: tl
  text: Pagkaraan ng ilang taon, dumating ako upang magdala sa aking bayan ng tulong para sa mga dukha[a] at ng mga handog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “limos”—mga kaloob na kawanggawa para sa mga nangangailangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἐτῶν δὲ πλειόνων
  choice: Pagkaraan ng ilang taon
  rationale: Ang διά na may genitive sa pananalitang tumutukoy sa panahon ay nagsasaad ng agwat na lumipas. Ang “ilang taon” ay natural na katumbas ng idiomatikong gamit ng πλειόνων, at hindi kailangang gawing tahasang panalungat ang mahinang pang-ugnay na δέ.
- source_word: ἐλεημοσύνας
  choice: tulong para sa mga dukha
  rationale: Tumutukoy ang salita sa limos o mga kaloob na kawanggawa para sa mga nangangailangan. Mas malinaw sa karaniwang makabagong Tagalog ang pariralang ito kaysa sa “limos,” na maaari ring magpahiwatig ng perang hinihingi ng namamalimos.
- source_word: ποιήσων
  choice: upang magdala
  rationale: Bagaman literal na “gagawin,” bumubuo ito kasama ng ἐλεημοσύνας ng idyomang nangangahulugang magkaloob o maghatid ng tulong. Ang “magdala” ay angkop din sa pagpunta ni Pablo sa Jerusalem dala ang tulong.
- source_word: εἰς τὸ ἔθνος μου
  choice: sa aking bayan
  rationale: Dito, ang ἔθνος ay tumutukoy sa bansang Judio bilang sariling bayan ni Pablo. Pinananatili ng “bayan” ang kolektibo at pambansang diwa nang mas natural sa Tagalog kaysa “aking bansa” sa pangungusap na ito.
- source_word: παρεγενόμην
  choice: dumating ako
  rationale: Ang pandiwa ay nagsasaad ng pagdating o pagharap sa isang lugar; tuwiran at natural ang “dumating ako.”
- source_word: προσφοράς
  choice: mga handog
  rationale: Maaaring tumukoy ang προσφορά sa mga handog, kabilang ang handog na panrelihiyon. Hindi tinutukoy ng talata ang eksaktong uri, kaya pinananatili ang malawak na kahulugan.
theological_decisions:
- issue: Uri ng tulong na dinala ni Pablo sa Jerusalem
  choice: tulong para sa mga dukha
  alternative: limos; mga kaloob na kawanggawa
  rationale: Nililinaw nito ang mapagkawanggawang kahulugan ng ἐλεημοσύνας nang hindi nagdaragdag ng denominasyonal o doktrinal na pagpapakahulugan.
- issue: Eksaktong uri at layon ng προσφοράς
  choice: mga handog
  alternative: mga haing handog; mga handog sa Diyos
  rationale: Hindi tahasang binabanggit ng Griyego ang uri o tuwirang layon ng mga handog. Ang payak na “mga handog” ay nagpapanatili sa kaluwagan ng orihinal at hindi tahimik na nilulutas ang detalye.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa sariling bansang kinabibilangan ni Pablo at ang “tulong para sa mga dukha” upang maipahayag nang natural ang konkretong diwa ng kawanggawa.
