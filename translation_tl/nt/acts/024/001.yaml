  text: Μετὰ δὲ πέντε ἡμέρας κατέβη ὁ ἀρχιερεὺς Ἁνανίας μετὰ ⸂πρεσβυτέρων τινῶν⸃ καὶ ῥήτορος Τερτύλλου τινός, οἵτινες ἐνεφάνισαν τῷ ἡγεμόνι κατὰ τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/001.yaml
  text: After five days[a], the high priest Ananias came down with some elders and a certain orator named Tertullus, and they brought charges against Paul before the governor.
translation:
  language: tl
  text: Pagkaraan ng limang araw, bumaba ang punong saserdoteng si Ananias kasama ang ilang matatandang pinuno at isang orador na nagngangalang Tertulo.[a] Iniharap nila sa gobernador ang mga paratang laban kay Pablo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang abogadong nagngangalang Tertulo”; ang salitang Griego ay maaaring tumukoy sa isang pampublikong tagapagsalita o kinatawang nagsasalita sa usaping legal.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ πέντε ἡμέρας
  choice: Pagkaraan ng limang araw
  rationale: Ipinapahayag ng μετά na may akusatibo ang lumipas na panahon. Hindi na tahasang isinalin ang mahinang pang-ugnay na δέ upang maging likas ang daloy sa Tagalog.
- source_word: κατέβη
  choice: bumaba
  rationale: Pinananatili ang direksiyong ipinahihiwatig ng καταβαίνω sa paglalakbay mula Jerusalem patungong Cesarea.
- source_word: ὁ ἀρχιερεὺς Ἁνανίας
  choice: ang mataas na paring si Ananias
  rationale: Tumutukoy ang ἀρχιερεύς sa natatanging katungkulan ng punong saserdoteng Judio; ang 'mataas na pari' ang malinaw at nakaugaliang salin sa Filipino.
- source_word: μετὰ πρεσβυτέρων τινῶν
  choice: kasama ang ilang matatandang pinuno
  rationale: Ipinakikita ng τινῶν na ilan lamang ang kasama, at nililinaw ng 'pinuno' na ang πρεσβύτεροι rito ay mga lider na Judio, hindi lamang matatanda sa edad.
- source_word: ῥήτορος Τερτύλλου τινός
  choice: isang orador na nagngangalang Tertulo
  rationale: Maaaring tumukoy ang ῥήτωρ sa pampublikong mananalumpati o kinatawang nagsasalita sa usaping legal. Pinananatili ng 'orador' ang lawak na iyon, habang inilalahad sa talababa ang legal na alternatibo.
- source_word: οἵτινες ἐνεφάνισαν
  choice: Iniharap nila ... ang mga paratang
  rationale: Sa kontekstong panghukuman, ang ἐμφανίζω ay pormal na paghaharap ng paratang o sakdal. Likas sa Filipino ang hiwalay na pangungusap na may malinaw na paksang 'nila.'
- source_word: τῷ ἡγεμόνι κατὰ τοῦ Παύλου
  choice: sa gobernador ang mga paratang laban kay Pablo
  rationale: Ang ἡγεμών ay Romanong gobernador, at ang κατά na may henitibo ay may diwang legal na 'laban kay.'
