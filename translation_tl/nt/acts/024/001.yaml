translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'matatandang pinuno' upang maiwasang mapagkamalang simpleng pagtukoy sa edad o awtomatikong iugnay sa mga pinuno ng iglesya. Inilagay ang panandang [a] matapos ang pangalan ni Tertulo dahil ang talababa ay tumutukoy sa kahulugan ng ῥήτωρ.
