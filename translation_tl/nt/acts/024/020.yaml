  yaml_path: translation/nt/acts/024/020.yaml
  text: Or let these men themselves say what wrongdoing they found when I stood before the council,[a]
translation:
  language: tl
  text: O hayaan ang mga taong ito mismo na magsabi kung anong paglabag ang nakita nila nang tumayo ako sa harap ng konseho,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa harap ng Sanhedrin.” Ang συνέδριον sa Griyego ay tumutukoy sa konsehong Judio.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: O
  rationale: Nagpapakilala ito ng isa pang hamon sa pagtatanggol ni Pablo; ang payak na “O” ay likas at tapat sa pang-ugnay na Griyego.
- source_word: αὐτοὶ οὗτοι
  choice: mismo ng mga lalaking ito
  rationale: Pinananatili ng “mismo” ang diin ng αὐτοί, habang malinaw na itinuturo ng “mga lalaking ito” ang mga taong naroon.
- source_word: εἰπάτωσαν
  choice: hayaang sabihin
  rationale: Isinasalin nito ang ikatlong-panauhang pautos sa paraang natural sa makabagong Tagalog at angkop sa isang legal na pagtatanggol.
- source_word: τί εὗρον
  choice: kung anong ... ang nakita nila
  rationale: Humihingi ito ng tiyak na maling gawa na natuklasan umano nila; ang “nakita” ay tuwiran at likas sa konteksto.
- source_word: ἀδίκημα
  choice: kasalanan
  rationale: Dito ay tumutukoy sa maling gawa o paglabag na maaaring iparatang. Ang “kasalanan” ay malawak at natural, nang hindi nililimitahan ito sa isang tiyak na krimen.
- source_word: στάντος μου
  choice: nang tumayo ako
  rationale: Ipinapahayag nito nang maikli ang temporal na ugnayan ng aorist participle sa pagharap ni Pablo sa kapulungan.
- source_word: ἐπὶ τοῦ συνεδρίου
  choice: sa harap ng kapulungan
  rationale: Ang συνέδριον dito ay ang konsehong Judio. Ang “kapulungan” ay madaling maunawaan sa pangunahing teksto, habang inilalagay sa talababa ang mas tiyak na terminong “Sanhedrin.”
