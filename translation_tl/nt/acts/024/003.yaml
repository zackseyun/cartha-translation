translation_notes:
  register: Pormal at marangal ang himig, angkop sa isang pambungad na pahayag sa paglilitis. Gumamit ng kasalukuyan at madaling maunawaang Filipino habang pinananatili ang retorikal na lawak ng dalawang magkatambal na parirala.
