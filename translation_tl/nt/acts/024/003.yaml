  text: πάντῃ τε καὶ πανταχοῦ ἀποδεχόμεθα, κράτιστε Φῆλιξ, μετὰ πάσης εὐχαριστίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/003.yaml
  text: In every way and everywhere we acknowledge this[a], most excellent Felix, with all gratitude.
translation:
  language: tl
  text: Sa lahat ng paraan at sa lahat ng dako ay kinikilala namin ito[a] nang may lubos na pasasalamat, kagalang-galang na Felix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinatanggap namin ito” o “malugod namin itong tinatanggap.” Maaaring mangahulugan ang pandiwang Griyego ng pagtanggap o malugod na pagtanggap, ngunit dito ay malamang na tumutukoy ito sa hayagang pagkilala sa mga kapakinabangang iniuugnay kay Felix.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντῃ
  choice: sa lahat ng paraan
  rationale: Ipinahahayag ang lawak sa bawat paraan o aspekto, at hindi pangunahing tumutukoy sa panahon.
- source_word: τε καὶ
  choice: at
  rationale: Likas na pinag-uugnay sa Filipino ang dalawang pariralang πάντῃ at πανταχοῦ.
- source_word: πανταχοῦ
  choice: sa lahat ng dako
  rationale: Tuwirang pinananatili ang lokatibong diwa na saklaw ang bawat lugar.
- source_word: ἀποδεχόμεθα
  choice: kinikilala namin ito
  rationale: Sa pormal na talumpati sa harap ni Felix, malamang na tumutukoy ito sa hayagang pagkilala o pagtanggap sa mga kapakinabangang iniuugnay sa kanyang pamamahala; idinagdag ang “ito” bilang likas na ipinahihiwatig na layon.
- source_word: κράτιστε
  choice: kagalang-galang
  rationale: Pormal na pantawag sa isang mataas na opisyal; marangal at natural ito sa modernong Filipino nang hindi ginagawang mas tiyak na titulo ang Griyego.
- source_word: Φῆλιξ
  choice: Felix
  rationale: Ginamit ang nakaugaliang transliterasyon ng pangalang pantangi sa Filipino.
- source_word: μετὰ πάσης εὐχαριστίας
  choice: nang may lubos na pasasalamat
  rationale: Likas na Filipino para sa saloobing kaakibat ng pagkilala, habang pinananatili ang diin ng πάσης sa ganap na pasasalamat.
