  text: having hope in God—which these men themselves also accept—that there is going to be a resurrection of both the righteous and the unrighteous[a].
translation:
  language: tl
  text: May pag-asa ako sa Diyos—isang pag-asang tinatanggap din ng mga taong ito mismo[a]—na magkakaroon ng muling pagkabuhay kapwa ng mga matuwid at ng mga di-matuwid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang pag-asang hinihintay din ng mga taong ito mismo.” Ang pandiwa ay maaaring mangahulugang “tanggapin” o “hintayin/asamin”; dito, malamang na idiniriin ang pag-asang pareho nilang kinikilala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδα ἔχων εἰς τὸν θεόν
  choice: May pag-asa ako sa Diyos
  rationale: Likas sa modernong Tagalog at pinananatili ang pag-asa na nakatuon sa Diyos; ang unang panauhan ay hinihingi ng konteksto ng pagsasalita ni Pablo.
- source_word: ἣν καὶ αὐτοὶ οὗτοι προσδέχονται
  choice: na siya ring pinanghahawakan ng mga taong ito
  rationale: Ang “siya” ay tumutukoy sa pag-asa, at ang “rin” at “mga taong ito” ay nagpapanatili sa diin ng καὶ αὐτοὶ οὗτοι. Ang “pinanghahawakan” ay natural na nagpapahayag ng pagtanggap sa isang paniniwala habang hindi lubusang inaalis ang diwa ng inaasahan.
- source_word: ἀνάστασιν
  choice: muling pagkabuhay
  rationale: Karaniwan, malinaw, at wastong terminong Tagalog para sa pagkabuhay mula sa kamatayan.
- source_word: μέλλειν ἔσεσθαι
  choice: magkakaroon
  rationale: Malinaw na naghahayag ng panghinaharap na pag-iral ng muling pagkabuhay nang hindi ipinahihiwatig na ito ay mangyayari kaagad.
- source_word: δικαίων τε καὶ ἀδίκων
  choice: kapwa ng mga matuwid at ng mga di-matuwid
  rationale: Pinananatili ang saklaw sa dalawang pangkat at ang tahasang moral na paghahambing ng τε καὶ.
theological_decisions:
- issue: Saklaw at kalikasan ng muling pagkabuhay sa pahayag ni Pablo
  choice: muling pagkabuhay kapwa ng mga matuwid at ng mga di-matuwid
  alternative: isang pangkalahatang muling pagkabuhay na hindi itinatampok ang pagkakaibang moral
  rationale: Tahasan sa Griyego ang dalawang pangkat. Hindi tinutukoy ng salin ang oras, pagkakasunod-sunod, o iba pang sistematikong detalye na wala sa talata.
- issue: Kahulugan ng προσδέχονται
  choice: pinanghahawakan
  alternative: hinihintay
  rationale: Sa konteksto, itinatampok ni Pablo ang pag-asang pareho nilang kinikilala. Gayunman, tunay na posible sa pandiwa ang diwa ng paghihintay, kaya pinananatili iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “di-matuwid” upang mapanatili ang tuwirang kasalungat ng “matuwid,” at ang mga gitling-panaklong upang luminaw ang sugnay na tumutukoy sa pag-asa.
