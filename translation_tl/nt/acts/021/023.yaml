base_translation:
  language: en
  yaml_path: translation/nt/acts/021/023.yaml
  text: 'Therefore do what we tell you: we have four men who are under a vow of their own[a][b].'
translation:
  language: tl
  text: 'Kaya gawin mo ang sinasabi namin sa iyo: may apat kaming lalaking may panatang nakaatang sa kanila[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “na sila mismo ang nanata.” Literal na, “may panata sa kanilang sarili.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring ipahiwatig ng mas malawak na konteksto na ito ay isang panatang gaya ng sa Nazareo, ngunit “panata” lamang ang sinasabi ng talatang ito.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο οὖν
  choice: Kaya
  rationale: Ipinahahayag ng οὖν ang lohikal na bunga o kasunod na hakbang; likas sa makabagong Tagalog ang “Kaya,” habang ang τοῦτο ay naipapaloob sa utos na sumunod.
- source_word: ποίησον
  choice: gawin mo
  rationale: Tuwiran at natural na katumbas ito ng aorist imperative; malinaw na si Pablo ang inuutusan.
- source_word: ὅ σοι λέγομεν
  choice: ang sinasabi namin sa iyo
  rationale: Pinananatili nito ang nilalaman ng utos at ang kasalukuyang pagsasalita ng pangkat nang hindi nagiging pilit sa Tagalog.
- source_word: εἰσὶν ἡμῖν
  choice: may ... kaming
  rationale: Ang existential construction na may dative ay likas na ipinahahayag sa Tagalog sa pamamagitan ng “may ... kami.”
- source_word: ἄνδρες τέσσαρες
  choice: apat ... lalaki
  rationale: Tumpak na tinutukoy ng ἄνδρες ang apat na lalaking nasa hustong gulang; inayos ang salita ayon sa natural na sintaks ng Tagalog.
- source_word: εὐχὴν ἔχοντες
  choice: na may ... panata
  rationale: Pinananatili ang payak at pangkalahatang diwa ng “may panata” nang hindi tinutukoy ang uri nito.
- source_word: ἀφ’ ἑαυτῶν
  choice: sarili silang
  rationale: Ang “may sarili silang panata” ay natural na Tagalog at ipinahihiwatig na ang panata ay nauukol sa kanila mismo, nang hindi pinipilit ang mas teknikal na pagpapakahulugan.
theological_decisions:
- issue: Uri ng panata
  choice: Pangkalahatang “panata” lamang ang ginamit sa pangunahing teksto.
  alternative: panatang Nazareo
  rationale: Bagaman maaaring ituro ng mas malawak na konteksto ang isang panatang gaya ng sa Nazareo, εὐχήν lamang ang tahasang sinasabi ng talata; kaya hindi ito tinukoy nang higit sa pinahihintulutan ng teksto.
- issue: Kalagayan o pagkilos ng pananata
  choice: “may sarili silang panata”
  alternative: “sila mismo ang nanata”
  rationale: Pinananatili ng pangunahing salin ang kalagayang ipinahahayag ng participle ἔχοντες at hindi tiyakang ginagawang isang nagdaang pagkilos ang parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kaya” para sa maayos na transisyon at “may sarili silang panata” upang maging natural sa Tagalog habang pinananatiling pangkalahatan ang εὐχή at ang kaugnayan nito sa mga lalaki mismo.
