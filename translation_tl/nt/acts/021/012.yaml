  text: ὡς δὲ ἠκούσαμεν ταῦτα, παρεκαλοῦμεν ἡμεῖς τε καὶ οἱ ἐντόπιοι τοῦ μὴ ἀναβαίνειν αὐτὸν εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/012.yaml
  text: When we heard these things[a], we and the local people urged him not to go up to Jerusalem.
translation:
  language: tl
  text: Nang marinig namin ang mga bagay na ito, kami at ang mga tagaroon ay patuloy na nakiusap[a] sa kanya na huwag siyang umakyat sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mahigpit na nakiusap” o “taimtim na nakiusap.” Ang pandiwa ay maaari ring magpahiwatig ng marubdob na pagsusumamo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἠκούσαμεν ταῦτα
  choice: Nang marinig namin ang mga ito
  rationale: Likas na ipinapahayag ng “nang” ang temporal na ugnayan, at pinananatili ng “ang mga ito” ang pangmaramihang demonstratibo na tumutukoy sa naunang pahayag ni Agabo.
- source_word: παρεκαλοῦμεν
  choice: nakiusap
  rationale: Sa kontekstong ito, ang παρακαλέω ay may diwang taimtim na paghimok o pagsusumamo. Ang “nakiusap” ay natural sa modernong Tagalog at hindi labis na nagpapatingkad ng damdamin; inilalahad sa talababa ang mas mariing posibleng diwa.
- source_word: ἡμεῖς τε καὶ οἱ ἐντόπιοι
  choice: kami at ang mga tagaroon
  rationale: Malinaw na pinaghihiwalay at pinagsasama nito ang pangkat ng tagapagsalaysay at ang mga taong naninirahan sa lugar. Ang “mga tagaroon” ay maikli, natural, at dignified.
- source_word: τοῦ μὴ ἀναβαίνειν αὐτὸν
  choice: sa kanya na huwag umakyat
  rationale: Ipinahahayag nito ang nilalaman ng pakiusap at pinananatili ang pandiwang “umakyat,” ang karaniwang direksiyonal na pananalita para sa pagpunta sa Jerusalem.
- source_word: εἰς Ἰερουσαλήμ
  choice: sa Jerusalem
  rationale: Karaniwan at natural na pagpapahayag ng destinasyon sa Tagalog.
theological_decisions:
- issue: Direksiyonal na pananalita para sa pagpunta sa Jerusalem
  choice: umakyat sa Jerusalem
  alternative: pumunta sa Jerusalem
  rationale: Tahasang ginagamit ng Griyego ang ἀναβαίνειν (“umakyat”). Pinananatili nito ang heograpiko at nakaugaliang paraan ng pagsasalita nang hindi nagdaragdag ng teolohikal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga tagaroon” sa halip na mas kolokyal na “mga lokal,” at pinanatili ang “umakyat sa Jerusalem” upang maipakita ang direksiyonal na idyoma ng orihinal.
