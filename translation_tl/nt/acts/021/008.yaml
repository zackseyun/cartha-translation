id: ACT.21.8
reference: Acts 21:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τῇ δὲ ἐπαύριον ἐξελθόντες ⸀ἤλθομεν εἰς Καισάρειαν, καὶ εἰσελθόντες εἰς τὸν οἶκον Φιλίππου τοῦ εὐαγγελιστοῦ ὄντος ἐκ τῶν ἑπτὰ ἐμείναμεν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/008.yaml
  text: On the next day we departed and came to Caesarea[a], and entering the house of Philip the evangelist, who was one of the seven, we stayed with him.
translation:
  language: tl
  text: Kinabukasan, umalis kami at dumating sa Cesarea. Pagpasok namin sa bahay ni Felipe, ang ebanghelista, na isa sa pito,[a] nanuluyan kami sa kanyang bahay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, isa siya sa pitong lalaking naunang itinalaga upang maglingkod sa Jerusalem (tingnan ang Mga Gawa 6:3–6).
    reason: cross_reference
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Kinabukasan
  rationale: Likas at maikling panandang temporal sa makabagong Tagalog; pinananatili nito ang sunod-sunod na daloy ng salaysay nang hindi pilit na isinasalin ang δέ.
- source_word: ἐξελθόντες
  choice: umalis kami
  rationale: Ipinahahayag ang pag-alis mula sa naunang lugar sa natural na anyong Tagalog; ang participle ay ginawang pandiwang may tahasang simuno.
- source_word: ἤλθομεν εἰς Καισάρειαν
  choice: dumating sa Cesarea
  rationale: Sa konteksto ng paglalakbay patungo sa isang destinasyon, malinaw na ipinahahayag ng “dumating” ang kilos ng κύριο/main verb nang hindi nagiging alanganin ang deiktikong “pumunta” o “naparito.”
- source_word: Καισάρειαν
  choice: Cesarea
  rationale: Karaniwang anyong Filipino ng pangalang heograpiko, na sapat upang tukuyin ang lungsod nang hindi nagdaragdag ng “Maritima” na wala sa teksto.
- source_word: εἰσελθόντες εἰς τὸν οἶκον
  choice: Pumasok kami sa bahay
  rationale: Natural na sugnay sa Tagalog na nagpapanatili sa pagkakasunod ng mga kilos at sa tuwirang kahulugan ng οἶκος bilang bahay.
- source_word: Φιλίππου
  choice: Felipe
  rationale: Nakaugaliang anyong Filipino ng pangalang Philip/Φίλιππος.
- source_word: τοῦ εὐαγγελιστοῦ
  choice: na ebanghelista
  rationale: Ang “ebanghelista” ay kinikilalang terminong Filipino para sa εὐαγγελιστής at pinananatili ang tila katawagan sa gawain o ministeryo nang hindi ito pinalalawak.
- source_word: ὄντος ἐκ τῶν ἑπτὰ
  choice: at isa sa pito
  rationale: Malinaw na iniuugnay kay Felipe ang dalawang paglalarawan—ebanghelista at kabilang sa pito—nang hindi ginagawang teknikal na titulo ang “pito.”
- source_word: ἐμείναμεν παρ’ αὐτῷ
  choice: tumuloy kami sa kanya
  rationale: Sa konteksto ng paglalakbay at pagtanggap bilang panauhin, ang “tumuloy sa kanya” ay natural na Filipino para sa pananatili sa tahanan ng isang tao.
theological_decisions:
- issue: Pagkakakilanlan kay Felipe bilang “isa sa pito”
  choice: Panatilihin ang “isa sa pito” at ipaliwanag lamang sa talababa ang pahiwatig sa Mga Gawa 6.
  alternative: Gawing “isa sa Pitong Lingkod” o tahasang tawaging diyakono.
  rationale: Hindi nagbibigay ang talata ng teknikal na pangalan ng tungkulin. Ang payak na paglalarawan ay nagpapanatili sa historikal na pahiwatig nang hindi nag-aangkat ng kalaunang katawagang pang-estruktura ng iglesya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginawang magkakaugnay ngunit hindi masalimuot ang mga sugnay ng Griyego. Ginamit ang “tumuloy” bilang likas na pananalita sa konteksto ng panunuluyan, at iniwasang gawing teknikal na titulo ang “pito.”
