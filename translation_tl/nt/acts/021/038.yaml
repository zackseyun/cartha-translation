  text: οὐκ ἄρα σὺ εἶ ὁ Αἰγύπτιος ὁ πρὸ τούτων τῶν ἡμερῶν ἀναστατώσας καὶ ἐξαγαγὼν εἰς τὴν ἔρημον τοὺς τετρακισχιλίους ἄνδρας τῶν σικαρίων;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/038.yaml
  text: Then you are not the Egyptian who some days ago stirred up a revolt and led the four thousand men of the assassins out into the wilderness?[a]
translation:
  language: tl
  text: Kung gayon, hindi ikaw ang Ehipsiyong ilang araw na ang nakalipas ay nagpasimula ng pag-aalsa at umakay patungo sa ilang sa apat na libong lalaking mamamatay-tao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lalaking may punyal”; sa Griyego, “mga Sicarii,” isang pangkat na kilala sa palihim na pag-atake gamit ang punyal.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἄρα
  choice: Kung gayon, hindi ikaw
  rationale: Ipinahihiwatig ng parirala ang isang hinuha na inilalahad bilang tanong. Likas sa modernong Tagalog ang “Kung gayon” para sa ganitong inferensiya.
- source_word: ὁ Αἰγύπτιος
  choice: ang Egipcio
  rationale: Ang pantukoy ay tumutukoy sa isang kilala o bantog na taong mula sa Ehipto; pinananatili ng “ang Egipcio” ang tiyak na pagtukoy.
- source_word: πρὸ τούτων τῶν ἡμερῶν
  choice: ilang araw na ang nakalipas
  rationale: Natural na ipinapahayag nito ang isang pangyayaring naganap kamakailan nang hindi nagtatakda ng eksaktong bilang ng mga araw.
- source_word: ἀναστατώσας
  choice: nagpasimula ng pag-aalsa
  rationale: Sa kontekstong pampolitika, tumutukoy ito sa paglikha o pag-udyok ng kaguluhang mapanghimagsik, hindi lamang sa karaniwang kalituhan.
- source_word: ἐξαγαγὼν εἰς τὴν ἔρημον
  choice: nagdala sa ilang
  rationale: Malinaw at natural nitong ipinahahayag ang pag-akay o pagdadala sa pangkat mula sa kinaroroonan nila tungo sa isang ilang na pook.
- source_word: τοὺς τετρακισχιλίους ἄνδρας
  choice: sa apat na libong lalaki
  rationale: Pinananatili ang tiyak na pangkat na ipinakikilala ng pantukoy at ang tahasang pagtukoy sa mga lalaki.
- source_word: τῶν σικαρίων
  choice: mamamatay-tao
  rationale: Tumutukoy ang σικάριοι sa mga lalaking kilala sa palihim na pagpatay gamit ang punyal. Nauunawaan agad ang “mamamatay-tao,” habang inilalagay sa talababa ang mas literal at makasaysayang katawagan.
