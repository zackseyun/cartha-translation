  text: ἐπιτρέψαντος δὲ αὐτοῦ ὁ Παῦλος ἑστὼς ἐπὶ τῶν ἀναβαθμῶν κατέσεισε τῇ χειρὶ τῷ λαῷ, πολλῆς δὲ σιγῆς γενομένης ⸀προσεφώνησεν τῇ Ἑβραΐδι διαλέκτῳ λέγων
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/040.yaml
  text: 'And when he had given permission[a], Paul, standing on the steps, motioned with his hand to the people. And when a great silence had come, he addressed them in the Hebrew language, saying:'
translation:
  language: tl
  text: 'Nang bigyan siya ng pahintulot ng kumandante, si Pablo ay nakatayo sa mga baitang at sinenyasan ng kamay ang mga tao. Nang magkaroon ng matinding katahimikan, nagsalita siya sa kanila sa wikang Hebreo[a], na sinasabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “sa wikang Aramaico.” Ang Griyego ay nagsasabing “sa wikang/diyalektong Hebreo,” na sa kontekstong ito ay maaaring tumukoy sa lokal na wikang Semitiko na karaniwang tinatawag na Aramaico.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτρέψαντος δὲ αὐτοῦ
  choice: Nang pahintulutan siya ng kumander
  rationale: Ang pariralang ito ay isang genitive absolute na tumutukoy sa kumander sa naunang konteksto. Nilinaw ang tinutukoy ng panghalip upang maging natural at malinaw sa Tagalog.
- source_word: ἑστὼς ἐπὶ τῶν ἀναβαθμῶν
  choice: na nakatayo sa mga baitang
  rationale: Inilalarawan ng perfect participle ang kinalalagyan ni Pablo, hindi ang pagkilos na pagtayo niya. Ang “mga baitang” ay tuwirang tumutukoy sa hagdanang paakyat sa himpilan.
- source_word: κατέσεισε τῇ χειρὶ τῷ λαῷ
  choice: sinenyasan ng kamay ang mga tao
  rationale: Ipinahihiwatig ng pandiwa ang pagkumpas bilang hudyat sa mga tao, malamang upang patahimikin sila o ihanda silang makinig. Pinanatili sa salin ang tahasang pagbanggit sa kamay.
- source_word: τῷ λαῷ
  choice: ang mga tao
  rationale: Karaniwang kahulugan ng λαός ang “mga tao.” Bagaman isang nagkakatipong pulutong ang tinutukoy rito, hindi naidagdag sa pangunahing teksto ang mas interpretibong “karamihan.”
- source_word: πολλῆς δὲ σιγῆς γενομένης
  choice: Nang lubos nang tumahimik ang mga tao
  rationale: Likas sa modernong Tagalog ang ganitong paglalarawan sa pagdating ng matinding katahimikan. Ang mga tao ang malinaw na tinutukoy sa konteksto.
- source_word: προσεφώνησεν
  choice: kinausap niya sila
  rationale: Ang pandiwa ay tumutukoy sa pampublikong pagharap at pagsasalita sa mga tagapakinig. Ang “kinausap” ay malinaw at natural sa Tagalog.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: sa wikang Hebreo
  rationale: Literal na sinasabi ng Griyego na “sa wikang/diyalektong Hebreo.” Pinanatili sa pangunahing teksto ang katawagang nasa pinagmulan, habang inilagay sa talababa ang posibleng pagtukoy nito sa Aramaico.
- source_word: λέγων
  choice: 'at sinabi:'
  rationale: Ang participle ay nagpapakilala sa tuwirang pananalitang kasunod. Ang “at sinabi:” ay mas likas sa Tagalog kaysa sa literal na “na sinasabi.”
theological_decisions:
- issue: Kung Hebreo o Aramaico ang wikang tinutukoy
  choice: wikang Hebreo sa pangunahing teksto
  alternative: Aramaico
  rationale: Ἑβραΐδι ang tahasang katawagan sa tekstong Griyego, ngunit maaari itong tumukoy sa lokal na wikang Semitiko na karaniwang tinatawag na Aramaico. Pinanatili ang katawagan ng pinagmulan at hindi nilutas nang palihim ang tunay na leksikal at pangkasaysayang kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Iniwasan ang labis na literal na ayos na magiging mabigat sa karaniwang mambabasa, ngunit pinanatili ang mahahalagang detalye ng Griyego at ang kalabuan tungkol sa wikang ginamit ni Pablo.
