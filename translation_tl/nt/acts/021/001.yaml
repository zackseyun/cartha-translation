base_translation:
  language: en
  yaml_path: translation/nt/acts/021/001.yaml
  text: After we had torn ourselves away from them and put out to sea[a], we ran a straight course and came to Cos, and on the next day to Rhodes, and from there to Patara.
translation:
  language: tl
  text: Matapos kaming mahirapang humiwalay sa kanila, diretso kaming naglayag patungong Kos[a]. Kinabukasan, nakarating kami sa Rodas, at mula roon ay nagpunta kami sa Patara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Cos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἐγένετο
  choice: Matapos
  rationale: Likas na ipinahahayag sa Filipino ang temporal na paglipat sa kasunod na pangyayari nang hindi mekanikal na ginagaya ang idyomang Griyego.
- source_word: ἀποσπασθέντας ἀπ’ αὐτῶν
  choice: naming piliting humiwalay sa kanila
  rationale: Pinananatili nito ang matinding diwa ng ἀποσπάω—isang paghihiwalay na mahirap gawin—sa halip na gawing payak na pag-alis lamang.
- source_word: ἀναχθῆναι
  choice: makapaglayag
  rationale: Sa kontekstong pandagat, tumutukoy ito sa pag-alis ng sasakyang-dagat upang maglayag; maikli at natural ang salin sa Filipino.
- source_word: εὐθυδρομήσαντες
  choice: dumiretso kami
  rationale: Ipinahahayag nito ang tuwiran o deretsong ruta ng paglalayag sa natural na modernong Filipino.
- source_word: ἤλθομεν εἰς
  choice: nakarating kami sa
  rationale: Malinaw at likas itong pananalita para sa pagdating sa isang lugar sa salaysay ng paglalakbay.
- source_word: Κῶ
  choice: Kos
  rationale: Ito ang tuwirang makabagong transliterasyon ng pangalang Griyego at karaniwang pangalan ngayon ng pulo.
- source_word: τῇ δὲ ἑξῆς
  choice: Kinabukasan
  rationale: Natural at eksaktong katumbas sa Filipino ng ‘sa sumunod na araw.’
- source_word: Ῥόδον
  choice: Rodas
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Rhodes.
- source_word: κἀκεῖθεν
  choice: at mula roon
  rationale: Pinananatili ang pagkakaugnay ng susunod na bahagi ng paglalakbay.
- source_word: Πάταρα
  choice: Patara
  rationale: Tuwirang transliterasyon ng pangalan ng lugar.
