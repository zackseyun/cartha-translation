  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang mas lumang 'kuwartel' sa pangunahing teksto ngunit pinanatili ito sa paliwanag; ginamit ang 'kumander' bilang karaniwang katawagan sa opisyal na militar.
