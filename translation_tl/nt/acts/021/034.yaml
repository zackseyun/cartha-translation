  source_fidelity: Ang "iba-iba ang isinisigaw ng mga tao sa karamihan" ay nagpapahiwatig ng magkakaibang sigaw, ngunit hindi nito malinaw na naipapakita ang distributibong paghahambing na "ang ilan ... at ang iba" (ἄλλοι ... ἄλλο τι). Ang "tunay na nangyari" ay katanggap-tanggap sa diwa, ngunit ang "kung ano ang tiyak" ay mas malapit sa τὸ ἀσφαλές, ang bagay na mapagkakatiwalaan o matitiyak. Ang utos at ang layuning papunta sa παρεμβολή ay naipapahayag nang wasto.
  naturalness: Natural ang kabuuang daloy, ngunit mas malinaw at mas likas ang tuwirang "Ang ilan sa karamihan ... at ang iba naman ...". Ang "kuwartel" ay mas tiyak at karaniwan sa modernong Filipino para sa mga barracks kaysa "himpilan ng mga sundalo," na maaaring magmungkahi ng mas pangkalahatang estasyon o himpilan.
  terminology: Ang "kumander" ay angkop sa opisyal na militar sa konteksto. Ginamit ang "kuwartel" para sa παρεμβολή; pinananatili ng talababa ang mahalagang kontekstong Romano nang hindi ipinapasok ang dagdag na detalye sa pangunahing teksto.
