  - severity: low
    issue: Ang pangunahing katawagan para sa παρεμβολή ay masyadong malawak.
    rationale: Ang "himpilan ng mga sundalo" ay nauunawaan, ngunit ang "kuwartel" ay mas tuwirang katumbas ng contextual na "barracks" at tumutugma sa paliwanag ng talababa.
