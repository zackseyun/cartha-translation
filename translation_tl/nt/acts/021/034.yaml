revisions:
- from: Ngunit iba-iba ang isinisigaw ng mga tao sa karamihan. Dahil hindi matiyak ng kumander ang tunay na nangyari[a] dahil sa kaguluhan, iniutos niyang dalhin si Pablo sa himpilan ng mga sundalo[b].
  to: Ngunit ang ilan sa karamihan ay sumisigaw ng isang bagay, at ang iba naman ay iba. Dahil hindi matiyak ng kumander kung ano ang tiyak dahil sa kaguluhan, iniutos niyang dalhin siya sa kuwartel[a].
  rationale: Binago ang unang pangungusap upang malinaw na maipakita ang contrast na “ang ilan ... ang iba,” habang pinanatili ang nagpapatuloy na diwa ng imperfect na “sumisigaw.” Pinalitan ang “tunay na nangyari” ng mas literal na “kung ano ang tiyak” para sa τὸ ἀσφαλές, at ginawang “kuwartel” ang pangunahing salin ng παρεμβολή. Inalis ang lexical-alternative footnote dahil ang dating mga alternatibo ay hindi na kinakailangan at ang natitirang talababa ay nakapuwesto sa terminong binibigyang-paliwanag.
