base_translation:
  language: en
  yaml_path: translation/nt/acts/021/034.yaml
  text: But some in the crowd were shouting one thing[a], and others another. Since he was not able to learn the facts because of the uproar[b], he ordered him to be brought into the barracks.
translation:
  language: tl
  text: Ngunit ang ilan sa karamihan ay sumisigaw ng isang bagay, at ang iba naman ay iba. Dahil hindi matiyak ng kumander kung ano ang tiyak dahil sa kaguluhan, iniutos niyang dalhin siya sa kuwartel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kuwartel” ay tumutukoy sa himpilang militar ng mga Romano, malamang na nasa loob ng tanggulang karugtong ng lugar ng templo.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλοι δὲ ἄλλο τι ἐπεφώνουν ἐν τῷ ὄχλῳ
  choice: iba-iba ang isinisigaw ng mga tao sa karamihan
  rationale: Likas na ipinahahayag sa modernong Tagalog ang distributibong ἄλλοι...ἄλλο τι at ang nagpapatuloy na kilos ng imperfect na ἐπεφώνουν, nang hindi tinatawag na mandurumog ang karamihan.
- source_word: μὴ δυναμένου δὲ αὐτοῦ γνῶναι τὸ ἀσφαλές
  choice: Dahil hindi matiyak ng kumander ang tunay na nangyari
  rationale: Ipinahahayag ang sanhi ng genitive absolute at ang diwa ng τὸ ἀσφαλές bilang mapananaligan o tiyak na salaysay. Nililinaw ng 'kumander' ang reperente ng panghalip mula sa konteksto nang hindi nagdaragdag ng bagong tauhan.
- source_word: διὰ τὸν θόρυβον
  choice: dahil sa kaguluhan
  rationale: Ang θόρυβος ay tumutukoy hindi lamang sa ingay kundi sa magulong pagkakagulo; natural at angkop dito ang 'kaguluhan.'
- source_word: ἐκέλευσεν ἄγεσθαι αὐτὸν
  choice: iniutos niyang dalhin si Pablo
  rationale: Pinananatili ang tiyak na utos at hindi tinutukoy kung sinu-sino ang inutusang magdala. Ginamit ang pangalan upang maging malinaw ang reperente sa isang nagsasariling talata.
- source_word: εἰς τὴν παρεμβολήν
  choice: sa himpilan ng mga sundalo
  rationale: Sa konteksto, ang παρεμβολή ay ang kwartel o himpilang militar ng Roma na kaugnay ng tanggulan sa tabi ng templo. Mas madaling maunawaan ng karaniwang mambabasa ang 'himpilan ng mga sundalo.'
