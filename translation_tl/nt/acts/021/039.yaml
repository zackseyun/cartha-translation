  text: εἶπεν δὲ ὁ Παῦλος· Ἐγὼ ἄνθρωπος μέν εἰμι Ἰουδαῖος, Ταρσεὺς τῆς Κιλικίας, οὐκ ἀσήμου πόλεως πολίτης· δέομαι δέ σου, ἐπίτρεψόν μοι λαλῆσαι πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/039.yaml
  text: But Paul said[a], “I am indeed a Jewish man, a citizen of Tarsus in Cilicia, of no insignificant city. And I beg you, permit me to speak to the people.”
translation:
  language: tl
  text: Ngunit sinabi ni Pablo, “Ako ay isang Judio, taga-Tarso sa Cilicia, at mamamayan ng Tarso, isang lungsod na hindi hamak. Nakikiusap ako sa iyo, pahintulutan mo akong magsalita sa mga tao.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος μέν εἰμι Ἰουδαῖος
  choice: Ako ay isang Judio
  rationale: Likas at malinaw itong pagpapakilala sa modernong Tagalog. Hindi kailangang isalin nang hiwalay ang ἄνθρωπος bilang “lalaki” dahil ang pariralang idiomatiko sa Tagalog ay “isang Judio,” habang ang μέν ay naipahihiwatig ng diin sa pagkakabuo ng pangungusap.
- source_word: Ταρσεὺς τῆς Κιλικίας
  choice: taga-Tarso sa Cilicia
  rationale: Ang “taga-Tarso” ang natural na katumbas ng pang-uring Ταρσεύς at malinaw na ipinakikita ang pinagmulan ni Pablo; pinananatiling hiwalay ang kasunod na pagbanggit sa pagiging mamamayan.
- source_word: οὐκ ἀσήμου πόλεως
  choice: ng isang lungsod na hindi hamak
  rationale: Pinananatili nito ang litotes ng Griyego—literal na “hindi walang kabuluhan/di-kilala”—sa isang natural at dignified na pariralang Tagalog.
- source_word: πολίτης
  choice: mamamayan
  rationale: Ipinahahayag nito ang kaugnayan at katayuang sibiko ni Pablo sa lungsod ng Tarso, hindi lamang na siya ay naninirahan doon.
- source_word: δέομαι δέ σου
  choice: Nakikiusap ako sa iyo
  rationale: Ipinakikita ang taimtim at magalang na pakiusap nang hindi nagiging labis na marubdob o makaluma.
- source_word: ἐπίτρεψόν μοι
  choice: pahintulutan mo ako
  rationale: Ang pormal ngunit karaniwang pananalitang ito ay angkop sa pakikipag-usap ni Pablo sa isang opisyal ng hukbo.
- source_word: λαλῆσαι πρὸς τὸν λαόν
  choice: magsalita sa mga tao
  rationale: Direkta at natural na isinasalin ang pampublikong pagsasalita at pinananatili ang λαός bilang “mga tao,” sa halip na paliitin agad ang kahulugan tungo sa “karamihan.”
theological_decisions:
- issue: Kahulugan ng Ἰουδαῖος sa konteksto
  choice: Judio
  alternative: taga-Judea
  rationale: Hiwalay na tinukoy ni Pablo ang Tarso sa Cilicia bilang kanyang pinagmulan, kaya ang Ἰουδαῖος dito ay tumutukoy sa kanyang pagkakakilanlang etniko at panrelihiyon, hindi sa pinagmulan niyang heograpiko.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, magalang, at angkop sa pampublikong pagbasa. Pinanatili ang bahagyang pormal na himig ng pakikipag-usap sa opisyal at ang litotes na “hindi hamak,” nang walang makalumang balangkas.
