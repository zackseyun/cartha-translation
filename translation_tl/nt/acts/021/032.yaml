lexical_decisions:
- source_word: ἐξαυτῆς
  choice: Agad
  rationale: Likas at malinaw na nagpapahayag ng agarang pagkilos sa makabagong Tagalog.
- source_word: παραλαβὼν
  choice: nagsama
  rationale: Ipinahihiwatig na isinama ng opisyal ang mga kawal at senturyon sa kanyang pagpunta, hindi lamang na kinuha niya sila.
- source_word: στρατιώτας
  choice: mga kawal
  rationale: Karaniwan, marangal, at angkop na katawagan sa mga indibidwal na sundalo.
- source_word: ἑκατοντάρχας
  choice: mga senturyon
  rationale: Pinananatili ang kinikilalang makasaysayang ranggo sa hukbong Romano.
- source_word: κατέδραμεν ἐπ’ αὐτούς
  choice: tumakbo pababa patungo sa kanila
  rationale: Pinananatili kapwa ang mabilis na pagkilos at ang pababang direksiyong ipinahihiwatig ng tagpuan, nang hindi nagdaragdag ng di-tiyak na poot.
- source_word: χιλίαρχον
  choice: kumander
  rationale: Madaling maunawaan ng karaniwang mambabasa at angkop sa opisyal na namumuno sa isang yunit ng hukbong Romano; inilalahad sa talababa ang mas teknikal na mga katumbas.
- source_word: ἐπαύσαντο
  choice: tumigil sila
  rationale: Natural na makabagong Tagalog para sa pagtigil sa kasalukuyang ginagawa.
- source_word: τύπτοντες
  choice: sa paghagupit
  rationale: Ipinahihiwatig ang paulit-ulit at marahas na pananakit, gaya ng aspektong nagpapatuloy ng participle.
