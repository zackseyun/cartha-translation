  source_fidelity: Tumpak sa kabuuan ang agarang pagkilos, pagsama sa mga kawal at senturyon, pagtakbo pababa tungo sa pangkat, at pagtigil ng pananakit kay Pablo. Ngunit ang “paghagupit” ay karaniwang tumutukoy sa paghampas gamit ang latigo o hagupit, samantalang ang τύπτοντες ay mas malawak na ‘binubugbog’ o paulit-ulit na sinasaktan at hindi nagsasaad ng latigo.
  naturalness: Malinaw at natural ang pangungusap sa makabagong Tagalog. Ang “tumakbo pababa patungo” ay bahagyang mas mahaba kaysa kailangan ngunit katanggap-tanggap at naipapahayag ang direksiyon at pagkadalian.
  terminology: Ang “mga kawal,” “mga senturyon,” at “kumander” ay angkop. Ang talababa ay sapat na nagpapaliwanag ng mas teknikal na katumbas ng χιλίαρχος. Pinalitan lamang ang pandiwang may maling tiyak na paraan ng pananakit.
