translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kumander” sa pangunahing teksto para sa madaling pagkaunawa, habang pinanatili sa talababa ang makasaysayang teknikal na katawagan. Ang “mga tao” ay tahasang tumutukoy sa pangkat na ipinahihiwatig ng panghalip na οἱ δὲ upang maging natural sa Tagalog.
