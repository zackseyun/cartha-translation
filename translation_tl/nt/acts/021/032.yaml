  text: He immediately took soldiers and centurions and ran down to them[a], and when they saw the tribune and the soldiers, they stopped beating Paul.
translation:
  language: tl
  text: Agad siyang nagsama ng mga kawal at mga senturyon at tumakbo pababa patungo sa kanila. Nang makita ng mga tao ang kumander[a] at ang mga kawal, tumigil sila sa pambubugbog kay Pablo.
