  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ζητούντων ⸀τε αὐτὸν ἀποκτεῖναι ἀνέβη φάσις τῷ χιλιάρχῳ τῆς σπείρης ὅτι ὅλη ⸀συγχύννεται Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/031.yaml
  text: And as they were seeking to kill him[b][a], a report went up to the commander of the cohort that all Jerusalem was in an uproar.
translation:
  language: tl
  text: Habang sinisikap nilang patayin siya, nakarating sa kumandante ng kohorte[b] ang balitang nagkakagulo[a] ang buong Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nalilito” o “nasa matinding kaguluhan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kumandante ng kohorte” ay isang mataas na opisyal-militar na Romano (isang tribune) na namumuno sa kohorteng nakatalaga roon.
    reason: cultural_note
lexical_decisions:
- source_word: ζητούντων τε αὐτὸν ἀποκτεῖναι
  choice: Habang sinisikap nilang patayin siya
  rationale: Ipinahahayag ng genitive absolute na may present participle ang nagpapatuloy na pagtatangka kasabay ng pangunahing pangyayari. Tuwiran at natural sa modernong Filipino ang “sinisikap nilang patayin siya.”
- source_word: ἀνέβη φάσις
  choice: nakarating ... ang balita
  rationale: Ang literal na larawan ay “umakyat ang ulat,” marahil patungo sa kuta, ngunit mas natural sa Filipino ang “nakarating ... ang balita” at malinaw nitong naihahatid ang diwa nang hindi nagdaragdag ng detalye.
- source_word: τῷ χιλιάρχῳ
  choice: sa kumandante
  rationale: Ang χιλίαρχος ay isang mataas na opisyal-militar na Romano, humigit-kumulang katumbas ng tribune. Malinaw at madaling maunawaan ang “kumandante,” samantalang ipinapaliwanag sa talababa ang tiyak na tungkulin.
- source_word: τῆς σπείρης
  choice: ng kohorte
  rationale: Ang σπεῖρα ay kohorte, isang yunit ng hukbong Romano. Pinananatili ng “kohorte” ang historikal na katiyakan; nililinaw sa talababa ang kahulugan nito.
- source_word: ὅτι ὅλη Ἰερουσαλήμ
  choice: na ... ang buong Jerusalem
  rationale: Pinananatili nito ang metonimiya ng Griyego, kung saan ang pangalan ng lungsod ay tumutukoy sa lungsod at mga mamamayan nito.
- source_word: συγχύννεται
  choice: nagkakagulo
  rationale: Ipinahahayag ng anyong present passive ang kasalukuyang kalagayan ng kaguluhan o pagkalito. Ang “nagkakagulo” ay natural at angkop sa konteksto ng pampublikong kaguluhan, habang inilalahad sa talababa ang iba pang posibleng diwa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, tuwiran, at marangal. Ginamit ang historikal na terminong “kohorte” na may paliwanag sa talababa. Inilagay ang marker [b] kasunod ng buong pariralang teknikal at ang [a] kasunod ng salitang may alternatibong leksikal.
