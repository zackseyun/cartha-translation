  source_fidelity: 'Tumpak sa pangkalahatan ang diwa ng talata: nalalapit na pagpasok ni Pablo sa kuwartel, ang kaniyang magalang na paghingi ng pahintulot na magsalita, at ang tanong ng opisyal tungkol sa Griyego. Gayunman, ang "Nang ipapasok na" ay mas malinaw na naipapahayag ang nalalapit na kilos na balintiyak at ang direksiyong papasok ng εἰσάγεσθαι.'
