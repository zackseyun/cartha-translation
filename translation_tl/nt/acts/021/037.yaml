base_translation:
  language: en
  yaml_path: translation/nt/acts/021/037.yaml
  text: As Paul was about to be brought into the barracks[a], he said to the tribune, “Is it permitted for me to say something to you?” And he said[c][b], “Do you know Greek?”
translation:
  language: tl
  text: Nang ipapasok na si Pablo sa kuwartel[a], sinabi niya sa kumandante[b], “Maaari ba akong magsabi sa iyo ng isang bagay?[c]” Sumagot ito, “Marunong ka ba ng Griyego?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kuwartel” ay ang himpilan ng hukbong Romano, malamang na nasa loob ng kuta.
    reason: cultural_note
  - marker: b
    text: Ang salitang Griyego ay tumutukoy sa isang mataas na opisyal ng hukbong Romano; tradisyonal itong isinasaling “tribuno.”
    reason: cultural_note
  - marker: c
    text: 'Mas literal: “Pinahihintulutan ba akong magsabi sa iyo ng isang bagay?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μέλλων τε εἰσάγεσθαι
  choice: Nang dadalhin na
  rationale: Ipinahahayag ng μέλλω ang nalalapit na pangyayari, at pinananatili ng “dadalhin” ang tinig na balintiyak ng εἰσάγεσθαι. Likas sa Tagalog ang temporal na anyong “Nang … na.”
- source_word: παρεμβολή
  choice: kuwartel
  rationale: Sa konteksto ng hukbong Romano sa Jerusalem, tumutukoy ito sa tirahan o himpilan ng mga kawal, hindi lamang sa isang pangkalahatang kampo.
- source_word: χιλίαρχος
  choice: kumandante
  rationale: Tumutukoy ito sa mataas na opisyal na Romano na namumuno sa isang malaking pangkat ng mga kawal. Mas madaling maunawaan sa modernong Tagalog ang “kumandante” kaysa sa teknikal na “tribuno.”
- source_word: Εἰ ἔξεστίν μοι εἰπεῖν τι πρὸς σέ
  choice: Maaari ba akong magsabi sa iyo ng isang bagay?
  rationale: Ipinahahayag ng ἔξεστιν ang pahintulot. Inililipat ng salin ang magalang na tanong sa natural na anyong Tagalog nang pinananatili ang diwa at ang τι bilang “isang bagay.”
- source_word: Ἑλληνιστὶ γινώσκεις
  choice: Marunong ka ba ng Griyego?
  rationale: Ang Ἑλληνιστί ay tumutukoy sa wikang Griyego, at sa ganitong konteksto ang γινώσκεις ay likas na isinasalin bilang pagiging marunong sa isang wika.
