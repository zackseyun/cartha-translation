base_translation:
  language: en
  yaml_path: translation/nt/acts/021/018.yaml
  text: On the next day[a], Paul went in with us to James[b], and all the elders were present.
translation:
  language: tl
  text: Kinabukasan[a], pumasok si Pablo, kasama namin, kay Santiago, at naroon ang lahat ng mga nakatatanda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa sumunod na araw.”
    reason: lexical_alternative
  - marker: b
    text: O “at dumating ang lahat ng mga nakatatanda.” Maaaring idiin ng pandiwang Griyego ang pagdating o ang pagiging naroroon.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπιούσῃ
  choice: Kinabukasan
  rationale: Likas at maikli itong salin ng idyomang tumutukoy sa sumunod na araw; ipinahihiwatig ng konteksto ang banayad na pang-ugnay na δέ.
- source_word: εἰσῄει
  choice: pumasok
  rationale: Pinananatili nito ang diwang pagpasok o pagkilos papasok ng εἴσειμι nang hindi nagdaragdag ng tiyak na lugar na hindi binanggit.
- source_word: σὺν ἡμῖν
  choice: kasama namin
  rationale: Tuwirang ipinapahayag nito ang pagsama na tinutukoy ng σύν na may datibo.
- source_word: πρὸς Ἰάκωβον
  choice: upang makipagkita kay Santiago
  rationale: Sa kontekstong ito, likas na ipinapahayag sa Filipino ang pagkilos patungo sa isang tao bilang pagpunta upang makipagkita sa kaniya; hindi nito dinaragdagan ng titulo o pagkakakilanlan si Santiago.
- source_word: πάντες τε
  choice: at ... ang lahat
  rationale: Ang payak na “at” ay sapat para sa banayad na pang-ugnay na puwersa ng τέ.
- source_word: παρεγένοντο
  choice: naroon
  rationale: Ang παραγίνομαι ay maaaring tumukoy sa pagdating o sa pagiging naroroon. Ang “naroon” ay natural sa Filipino at nagpapanatili sa pagbasa na nakatuon sa presensiya.
- source_word: οἱ πρεσβύτεροι
  choice: ang lahat ng matatandang namumuno
  rationale: Ipinahihiwatig ng πρεσβύτεροι rito ang mga kinikilalang lider ng iglesya. Ang pariralang ito ay malinaw sa karaniwang mambabasa at umiiwas sa katawagang nakatali sa isang denominasyon.
theological_decisions:
- issue: Pagkakakilanlan at papel ni Ἰάκωβον
  choice: Isinalin lamang bilang “Santiago,” nang walang idinagdag na titulo o kaugnayan.
  alternative: “Santiago na kapatid ng Panginoon” o “Santiago na pinuno ng iglesya sa Jerusalem”
  rationale: Walang karagdagang pagkakakilanlan sa talata. Bagaman ipinahihiwatig ng konteksto kung sino siya, ang pagdaragdag nito sa teksto ay lalampas sa mismong sinabi ng Griyego.
- issue: Pang-iglesyang diwa ng οἱ πρεσβύτεροι
  choice: “matatandang namumuno,” bilang mga kinikilalang lider ngunit walang denominasyonal na espesipikasyon
  alternative: “mga presbitero” o “mga elder”
  rationale: Pinananatili nito ang tungkuling pamumuno sa konteksto ng iglesya habang umiiwas sa pag-angkat ng mas huling sistemang pansimbahan.
- issue: Saklaw ng παρεγένοντο
  choice: “naroon” sa pangunahing teksto, na may talababa para sa diwa ng pagdating
  alternative: “dumating” o “nagdatingan”
  rationale: Tunay na maaaring idiin ng pandiwa ang pagdating o ang presensiya. Hindi dapat ikubli ang leksikal na pag-igting na ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Santiago,” ang nakaugaliang anyo ng pangalan sa Bibliyang Tagalog. Ang “matatandang namumuno” ay nilalayong maging malinaw na katawagan sa mga lider ng iglesya nang hindi gumagamit ng terminong nakatali sa isang partikular na denominasyon. Ang lahat ng panandang talababa [a] at [b] ay nasa pangunahing teksto.
