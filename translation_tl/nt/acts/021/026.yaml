id: ACT.21.26
reference: Acts 21:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος παραλαβὼν τοὺς ἄνδρας τῇ ἐχομένῃ ἡμέρᾳ σὺν αὐτοῖς ἁγνισθεὶς εἰσῄει εἰς τὸ ἱερόν, διαγγέλλων τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ ἕως οὗ προσηνέχθη ὑπὲρ ἑνὸς ἑκάστου αὐτῶν ἡ προσφορά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/026.yaml
  text: Then Paul took the men[a], and on the next day, having purified himself with them, he entered the temple, giving notice of the completion of the days of purification[b], until the offering was presented for each one of them.
translation:
  language: tl
  text: Pagkatapos nito, isinama ni Pablo ang mga lalaki. Kinabukasan, matapos siyang sumailalim sa paglilinis kasama nila, pumasok siya sa templo[a], na ipinapaalam ang pagtatapos ng mga araw ng paglilinis hanggang sa maihandog[b] ang handog para sa bawat isa sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay tumutukoy sa buong lugar o bakuran ng templo, hindi lamang sa panloob na santuwaryo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “maiharap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν τοὺς ἄνδρας
  choice: isinama ni Pablo ang mga lalaki
  rationale: Ipinahahayag ng παραλαμβάνω na dinala o isinama ni Pablo ang mga lalaki; natural at malinaw sa makabagong Tagalog ang “isinama.”
- source_word: τῇ ἐχομένῃ ἡμέρᾳ
  choice: Kinabukasan
  rationale: Ito ang pinakanatural na katumbas sa Tagalog para sa araw na kasunod agad.
- source_word: σὺν αὐτοῖς ἁγνισθεὶς
  choice: sumailalim siya sa paglilinis kasama nila
  rationale: Pinananatili nito ang diwang ritwal ng ἁγνίζω at hindi ipinapalagay na karaniwang paghuhugas lamang; ang “sumailalim” ay angkop sa anyong pasibo/intransitibo ng pandiwari.
- source_word: εἰσῄει εἰς τὸ ἱερόν
  choice: pumasok sa templo
  rationale: Natural sa Tagalog ang payak na nagdaang anyo. Ang imperfect ay maaaring magpahiwatig ng nagpapatuloy o paulit-ulit na pagpasok, ngunit hindi ito kailangang gawing mabigat sa salin. Ang ἱερόν ay tumutukoy sa kabuuang lugar ng templo.
- source_word: διαγγέλλων
  choice: Ipinaalam niya
  rationale: Ang pandiwa ay nagpapahiwatig ng pormal na pag-uulat o pagbibigay-alam, na angkop sa kontekstong pangtemplo.
- source_word: τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ
  choice: ang pagtatapos ng mga araw ng paglilinis
  rationale: Tuwirang pinananatili ang pormal na pagtukoy sa pagkumpleto ng takdang panahon ng paglilinis nang hindi dinaragdagan ang detalye.
- source_word: ἕως οὗ
  choice: hanggang sa
  rationale: Natural na pananda ng hangganan ng panahon at pinananatili ang ugnayang bahagyang masalimuot sa Griyego.
- source_word: προσηνέχθη ... ἡ προσφορά
  choice: maihandog ang handog
  rationale: Sa kontekstong pangsakripisyo, malinaw na katumbas ng προσφέρω ang “ihandog,” samantalang pinananatili ng “handog” ang pangkalahatang saklaw ng προσφορά.
- source_word: ὑπὲρ ἑνὸς ἑκάστου αὐτῶν
  choice: para sa bawat isa sa kanila
  rationale: Malinaw at natural na ipinahahayag ang kapakinabangan o pagkatawan kaugnay ng handog.
theological_decisions:
- issue: Ang pakikibahagi ni Pablo sa paglilinis sa templo
  choice: Isinalaysay nang tuwiran ang pakikibahagi niya sa pamamaraan ng paglilinis.
  alternative: Ipahiwatig na sinang-ayunan o tinanggihan niya ang patuloy na bisa ng mga ritwal sa templo para sa mga Cristiano.
  rationale: Isinasalaysay lamang ng talata ang pangyayari at hindi nito nilulutas ang mas malawak na usaping teolohikal tungkol sa Kautusan o tipan.
- issue: Aspekto ng εἰσῄει
  choice: pumasok
  alternative: pumapasok noon / patuloy na pumapasok
  rationale: Maaaring magpahiwatig ng nagpapatuloy o paulit-ulit na kilos ang imperfect, ngunit mas natural sa salaysay na Tagalog ang “pumasok”; hindi tiyak sa konteksto kung dapat idiin ang tagal o pag-uulit.
- issue: Ugnayan ng pahayag tungkol sa pagtatapos at ng paghahandog
  choice: Pinanatili ang “hanggang sa” nang hindi nilulutas nang higit sa sinabi ng Griyego ang masalimuot na sintaks.
  alternative: Ipaliwanag na inihayag ni Pablo ang tiyak na petsa o na araw-araw siyang pumapasok hanggang maihandog ang handog.
  rationale: Hindi ganap na tahasan sa pangungusap kung paano nakakabit ang ἕως οὗ sa naunang mga sugnay; hindi dapat magdagdag ng isang tiyak na paliwanag sa mismong teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa maiikling pangungusap upang maging madaling basahin, ngunit pinanatili ang pagkakasunod-sunod ng mga kilos at ang masalimuot na ugnayan ng huling sugnay. Ang mga panandang talababa ay inilagay sa mismong salitang tinutukoy ng bawat paliwanag.
