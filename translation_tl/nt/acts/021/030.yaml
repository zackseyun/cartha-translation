id: ACT.21.30
reference: Acts 21:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐκινήθη τε ἡ πόλις ὅλη καὶ ἐγένετο συνδρομὴ τοῦ λαοῦ, καὶ ἐπιλαβόμενοι τοῦ Παύλου εἷλκον αὐτὸν ἔξω τοῦ ἱεροῦ, καὶ εὐθέως ἐκλείσθησαν αἱ θύραι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/030.yaml
  text: And the whole city was stirred up[a], and a crowd of the people formed; and after seizing Paul, they dragged him outside the temple[c][b], and immediately the doors were shut.
translation:
  language: tl
  text: Nabulabog ang buong lungsod, at dumagsa ang mga tao. Sinunggaban nila si Pablo at kinaladkad palabas ng templo[a], at agad na isinara ang mga pintuan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na ἱερόν ay tumutukoy sa buong kompleks o bakuran ng templo, hindi lamang sa panloob na santuwaryo.
    reason: cultural_note
  - marker: b
    text: Maaari ring “mga pintuang-daan,” yamang sa kontekstong ito ang salita ay maaaring tumukoy sa mga pasukan ng templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκινήθη
  choice: Nabulabog
  rationale: Ipinahihiwatig ng pasibong pandiwa rito ang malawakang pagkabalisa o kaguluhan sa lungsod, hindi lamang literal na pagkilos.
- source_word: ἡ πόλις ὅλη
  choice: ang buong lungsod
  rationale: 'Tuwirang pinananatili ang saklaw ng parirala: ang buong lungsod ang nabulabog.'
- source_word: ἐγένετο συνδρομὴ τοῦ λαοῦ
  choice: dumagsa ang mga tao
  rationale: Ang συνδρομή ay tumutukoy sa biglaan at sama-samang paglapit o pagtitipon. Likas sa makabagong Tagalog ang “dumagsa” at malinaw nitong ipinahihiwatig ang mabilis na pagdami ng nagtipon.
- source_word: ἐπιλαβόμενοι
  choice: Sinunggaban nila
  rationale: Ipinakikita ng pandiwari ang marahas na pagdakma kay Pablo bago siya kinaladkad.
- source_word: εἷλκον
  choice: kinaladkad
  rationale: Tumpak nitong inilalarawan ang sapilitang paghila kay Pablo. Bagaman imperfect ang anyong Griyego at itinatanghal ang kilos bilang nagpapatuloy, natural na naihahatid ito sa Tagalog ng “kinaladkad” sa kontekstong ito.
- source_word: ἔξω τοῦ ἱεροῦ
  choice: palabas ng templo
  rationale: Ang “palabas” ay nagpapahayag ng paggalaw mula sa loob patungo sa labas. Ginamit ang pamilyar na “templo,” habang nililinaw sa talababa na ang ἱερόν ay ang kabuuang bakuran o kompleks.
- source_word: εὐθέως
  choice: agad
  rationale: Maikli, natural, at tumpak na katumbas ng adverbiyong nagpapahayag ng kagyat na kilos.
- source_word: ἐκλείσθησαν αἱ θύραι
  choice: isinara ang mga pintuan
  rationale: Natural na pasibong diwa sa Tagalog na hindi tinutukoy ang gumawa. Maaaring tumukoy ang θύραι sa mga pintuang-daan sa konteksto ng templo, kaya inilakip ang alternatibo sa talababa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nabulabog” para sa malawakang pagkagulo at “dumagsa” para sa biglaang sama-samang paglapit ng mga tao. Iniwasan ang teknikal o makalumang pananalita sa pangunahing teksto, habang inilagay sa mga talababa ang mahahalagang detalye tungkol sa kompleks ng templo at sa posibleng kahulugan ng mga pintuan bilang mga pintuang-daan.
