  yaml_path: translation/nt/acts/021/036.yaml
  text: For the crowd of the people was following[a], shouting, “Take him away!”
translation:
  language: tl
  text: Sapagkat ang pulutong ng mga tao ay sumusunod at sumisigaw, “Alisin siya!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ipalayo siya!”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: sumusunod
  rationale: Ipinahahayag ng imperpektong pandiwa ang nagpapatuloy na pagkilos sa nakaraan; sa daloy ng salaysay, likas sa Tagalog ang aspektong imperpektibo na “sumusunod.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan ng talata sa naunang pangyayari.
- source_word: τὸ πλῆθος τοῦ λαοῦ
  choice: ang napakaraming tao
  rationale: Natural itong katumbas ng isang malaking pulutong mula sa bayan, nang hindi ginagamit ang mapanirang katawagang “manggugulong.”
- source_word: κράζοντες
  choice: sumisigaw
  rationale: Malinaw at karaniwang salitang Filipino ito para sa malakas at sabay-sabay na paghiyaw ng pulutong.
- source_word: Αἶρε αὐτόν
  choice: Alisin siya!
  rationale: Sa kontekstong ito, ang pautos na αἶρε ay isang marahas na panawagang alisin o pawiin si Pablo, hindi simpleng buhatin siya. Pinananatili ng “Alisin siya!” ang tindi at ang posibleng saklaw ng kahulugan nang hindi tahasang ipinapasok sa pangunahing teksto ang “Patayin siya!”
theological_decisions:
- issue: Kung ang sigaw ay tahasang utos na patayin si Pablo
  choice: Alisin siya!
  alternative: Patayin siya!
  rationale: Maaaring ipahiwatig ng idyoma at konteksto ang pagpatay, ngunit hindi tahasang ginagamit ng Griyego ang karaniwang pandiwa para sa “patayin.” Kaya pinanatili sa teksto ang mas malawak na utos na alisin siya, at inilagay sa talababa ang mas matinding posibleng pahiwatig.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “napakaraming tao” sa halip na mas pampanitikang “karamihan ng bayan” o mapanirang “manggugulong,” at pinanatili ang maigsi at marahas na anyo ng sigaw.
