translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang unang panauhang maramihan ng konteksto at ang diwa ng karagdagang pananatili sa “ilang araw pa,” habang iniwasan ang labis na literal na “bumaba” na maaaring maging di-likas sa ordinaryong mambabasa.
