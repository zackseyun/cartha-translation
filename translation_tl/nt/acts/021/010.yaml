  text: While we were staying there for several days, a prophet named Agabus came down from Judea.
translation:
  language: tl
  text: Habang nananatili kami roon nang ilang araw pa, may isang propetang nagngangalang Agabo na bumaba mula sa Judea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμενόντων
  choice: Habang nananatili kami roon
  rationale: Ang pangkasalukuyang partisipyong nasa genitive plural ay bahagi ng genitive absolute na may temporal na diwa. Bagaman hindi tahasang nakasaad ang simuno, ipinahihiwatig ng konteksto ng salaysay na ito ay si Pablo at ang kaniyang mga kasama, kaya ang “kami” ay natural at tumpak.
- source_word: δὲ
  choice: Habang
  rationale: Ang banayad na paglipat na ipinahihiwatig ng δέ ay likas na naisama sa temporal na panandang “habang,” kasama ng puwersang temporal ng genitive absolute.
- source_word: ἡμέρας πλείους
  choice: nang ilang araw pa
  rationale: Ang parirala ay accusative of extent of time. Ang πλείους ay literal na “higit pa,” kaya pinananatili ng “ilang araw pa” kapwa ang diwa ng karagdagang mga araw at ang natural na gamit sa Filipino.
- source_word: κατῆλθέν
  choice: dumating
  rationale: Ang κατέρχομαι ay maaaring mangahulugang “bumaba” o “dumating.” Sa modernong Filipino, “dumating mula sa Judea” ang mas natural; ang literal na direksiyong “bumaba” ay hindi mahalaga sa puntong ito at maaaring tumunog na di-likas nang walang paliwanag sa heograpiya.
- source_word: τις
  choice: ang isang
  rationale: Ipinakikilala ng indefinite pronoun ang isang bagong tauhan. Natural itong ipinahahayag sa Filipino bilang “isang propeta.”
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: mula sa Judea
  rationale: Tuwirang ipinahahayag ang pinagmulan ng propeta gamit ang karaniwang makabagong anyo ng pangalang heograpiko.
- source_word: προφήτης
  choice: propetang
  rationale: Ang “propeta” ang pamantayan at malinaw na salin ng kinikilalang tungkuling tinutukoy ng προφήτης.
- source_word: ὀνόματι Ἅγαβος
  choice: nagngangalang Agabo
  rationale: Ang dative na ὀνόματι ay idyomang nangangahulugang “ang pangalan ay” o “tinatawag na.” Ang “nagngangalang Agabo” ay natural at marangal na Filipino; “Agabo” ang nakaugaliang Tagalog na anyo ng pangalan.
