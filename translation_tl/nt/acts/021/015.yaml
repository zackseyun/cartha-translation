base_translation:
  language: en
  yaml_path: translation/nt/acts/021/015.yaml
  text: After these days[a], having packed up, we went up to Jerusalem.
translation:
  language: tl
  text: Pagkalipas ng mga araw na iyon, naghanda kami[a] at umakyat patungong Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nag-impake kami” o “naghanda kami para sa paglalakbay.” Maaaring tumukoy ang salitang Griyego sa pangkalahatang paghahanda, hindi lamang sa pag-iimpake ng bagahe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: Pagkalipas ng mga araw na iyon
  rationale: Ipinahahayag ng μετά na may akusatibo ang pagkakasunod sa panahon. Likas sa makabagong Tagalog ang pariralang ito at malinaw na tumutukoy sa panahong kababanggit lamang.
- source_word: ἐπισκευασάμενοι
  choice: naghanda kami
  rationale: Maaaring tumukoy ang participle sa pangkalahatang paghahanda para sa paglalakbay, kabilang ang pag-iimpake. Pinananatili ng 'naghanda kami' ang lawak ng kahulugan nang hindi nililimitahan ito sa bagahe.
- source_word: ἀνεβαίνομεν
  choice: umakyat
  rationale: Pinananatili nito ang direksiyon ng paglalakbay patungong Jerusalem at ang karaniwang heograpiko at salaysay na diwa ng pag-akyat, habang natural sa Tagalog ang anyong pangnagdaan sa kontekstong ito.
- source_word: εἰς Ἱεροσόλυμα
  choice: patungong Jerusalem
  rationale: Ipinakikita ng εἰς ang paggalaw tungo sa lungsod. Ang 'patungong Jerusalem' ay malinaw at likas sa salaysay ng paglalakbay.
