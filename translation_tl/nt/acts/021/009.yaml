  text: He had four unmarried daughters who were prophesying.
translation:
  language: tl
  text: May apat siyang anak na dalaga[a] na nagpapahayag ng mga propesiya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “apat na birheng anak na babae.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: siyang
  rationale: Ang panghalip ay tumutukoy kay Felipe sa naunang konteksto; isinama ito sa likas na Tagalog na konstruksiyong “May ... siya.”
- source_word: δὲ
  choice: —
  rationale: Mahinang pang-ugnay lamang ito; sapat nang maipakita sa tuloy-tuloy na daloy ng pangungusap sa Tagalog.
- source_word: ἦσαν
  choice: May ... siya
  rationale: Ang eksistensiyal na konstruksiyong Griyego na literal na “sa kaniya ay may” ay likas na ipinapahayag sa Tagalog bilang “May ... siya.”
- source_word: θυγατέρες
  choice: anak
  rationale: Sa Tagalog, maaaring tukuyin ng “anak” ang anak na babae; nililinaw ng “dalaga” na babae ang tinutukoy, kaya hindi na kailangan ang mas mabigat na “mga anak na babae.”
- source_word: τέσσαρες
  choice: apat
  rationale: Tuwirang katumbas ng bilang na binabago ang “anak.”
- source_word: παρθένοι
  choice: dalaga
  rationale: Likas itong tumutukoy sa mga babaeng hindi pa nag-aasawa at hindi kasing-klinikal ng “birhen.” Dahil maaari ring idiin ng salitang Griyego ang pagiging birhen, inilagay ang mas literal na kahulugan sa talababa.
- source_word: προφητεύουσαι
  choice: na nagpapahayag ng propesiya
  rationale: Ang kasalukuyang aktibong participle ay naglalarawan sa mga anak at nagpapahiwatig ng kanilang patuloy o kinagawiang gawain; naipapahayag ito ng “nagpapahayag” nang hindi ginagawang isang minsanang pangyayari.
theological_decisions:
- issue: Kahulugan ng παρθένοι kaugnay ng mga babaeng nagpapahayag ng propesiya
  choice: dalaga
  alternative: birhen
  rationale: Sabay na binabanggit ng talata ang kanilang kalagayang hindi pa nag-aasawa at ang kanilang gawaing propetiko, ngunit hindi nito ipinapaliwanag na may teolohikal na ugnayan ang dalawa. Pinananatili ng “dalaga” ang likas na panlipunang kahulugan, habang itinatala sa talababa ang mas tahasang kahulugang “birhen.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang likas na konstruksiyong “May apat siyang anak” at iniwasang ipahiwatig na ang pagiging dalaga nila ang dahilan ng kanilang pagpapahayag ng propesiya.
