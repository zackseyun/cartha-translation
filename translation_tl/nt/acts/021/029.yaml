id: ACT.21.29
reference: Acts 21:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦσαν γὰρ ⸀προεωρακότες Τρόφιμον τὸν Ἐφέσιον ἐν τῇ πόλει σὺν αὐτῷ, ὃν ἐνόμιζον ὅτι εἰς τὸ ἱερὸν εἰσήγαγεν ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/029.yaml
  text: For they had previously seen Trophimus the Ephesian in the city with him[a], and they supposed that Paul had brought him into the temple.
translation:
  language: tl
  text: Sapagkat nakita na nila noon sa lungsod si Trofimo na taga-Efeso na kasama ni Pablo, at inakala nilang ipinasok siya ni Pablo sa templo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego rito para sa “templo” ay maaaring tumukoy sa buong kompleks o mga bakuran ng templo, hindi lamang sa panloob na santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν ... προεωρακότες
  choice: nakita na nila noon
  rationale: Ipinahahayag ng periprastikong anyo ang pagkakitang nangyari bago ang kasalukuyang pangyayari; natural sa Filipino ang “nakita na nila noon.”
- source_word: Τρόφιμον τὸν Ἐφέσιον
  choice: si Trofimo na taga-Efeso
  rationale: Malinaw at likas na ipinahahayag ang pagkakakilanlan niya ayon sa pinagmulan.
- source_word: ἐν τῇ πόλει
  choice: sa lungsod
  rationale: Tumutukoy ito sa Jerusalem bilang lungsod, na kaiba sa bakuran ng templo.
- source_word: σὺν αὐτῷ
  choice: na kasama ni Pablo
  rationale: Ginawang tahasan ang tinutukoy ng panghalip upang maiwasan ang di-likas at malabong “kasama niya” sa Filipino.
- source_word: ἐνόμιζον
  choice: inakala nilang
  rationale: Ipinakikita ng “inakala” na hinuha lamang nila ito at hindi tiyak na kaalaman.
- source_word: εἰς τὸ ἱερὸν
  choice: sa templo
  rationale: Ang ἱερόν ay maaaring tumukoy sa buong kompleks o mga bakuran ng templo; pinanatili ang karaniwang “templo” sa teksto at ipinaliwanag ang saklaw sa talababa.
- source_word: εἰσήγαγεν
  choice: ipinasok siya
  rationale: Natural na salin ng pagdadala o pagpapapasok sa loob, habang malinaw na si Trofimo ang layon.
theological_decisions:
- issue: Saklaw ng ἱερόν sa paratang laban kay Pablo
  choice: templo sa pangunahing teksto, na may talababa tungkol sa kompleks o mga bakuran nito
  alternative: mga bakuran ng templo
  rationale: Pinananatili nito ang natural na pananalita habang nililinaw ang makasaysayang mahalagang kaibahan ng ἱερόν sa mas tiyak na katawagan para sa panloob na santuwaryo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginawang tahasan ang “ni Pablo” sa unang sugnay upang maging malinaw ang reperensiya ng panghalip, nang hindi binabago ang diwa ng Griyego.
