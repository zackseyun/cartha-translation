id: ACT.21.21
reference: Acts 21:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: κατηχήθησαν δὲ περὶ σοῦ ὅτι ἀποστασίαν διδάσκεις ἀπὸ Μωϋσέως τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους, λέγων μὴ περιτέμνειν αὐτοὺς τὰ τέκνα μηδὲ τοῖς ἔθεσιν περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/021.yaml
  text: But they have been informed about you that you are teaching all the Jews among the Gentiles to forsake Moses[c][b][a], telling them not to circumcise their children nor to walk according to the customs.
translation:
  language: tl
  text: Ngunit ibinalita sa kanila tungkol sa iyo na tinuturuan mo ang lahat ng Judiong naninirahan sa gitna ng mga Hentil na talikuran si Moises[a][b], at sinasabihan mo silang huwag tuliin ang kanilang mga anak at huwag mamuhay ayon sa mga kaugalian.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagtuturo ka ng pagtalikod kay Moises.” Ang salitang Griyego na ἀποστασία ay tumutukoy sa paghiwalay, pagtalikod, o pag-abandona.
    reason: lexical_alternative
  - marker: b
    text: Ang “Moises” dito ay kumakatawan sa Kautusang Mosaiko at sa minanang mga kaugaliang Judio.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin na “huwag sundin ang mga kaugalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηχήθησαν
  choice: ibinalita sa kanila
  rationale: Sa kontekstong ito, ang pasibong anyo ay tumutukoy sa impormasyong ipinarating sa kanila tungkol kay Pablo; natural nitong ipinahahayag ang isang ulat na natanggap nila.
- source_word: ἀποστασίαν ... ἀπὸ Μωϋσέως
  choice: talikuran si Moises
  rationale: Ipinahahayag nito ang diwa ng pagtalikod o pag-iwan nang hindi ginagawang teknikal na terminong teolohikal ang ἀποστασία. Pinananatili rin ang metonimikong pagtukoy kay Moises.
- source_word: τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους
  choice: ang lahat ng Judiong naninirahan sa gitna ng mga Hentil
  rationale: Nililinaw nitong ang tinutukoy ay mga Judiong nakakalat at namumuhay sa mga bansang di-Judio.
- source_word: λέγων
  choice: at sinasabihan mo sila
  rationale: Ipinakikita ng participle ang nilalaman o paraan ng ibinibintang na pagtuturo at natural itong ikinakabit sa mga Judiong nabanggit.
- source_word: μὴ περιτέμνειν αὐτοὺς τὰ τέκνα
  choice: huwag tuliin ang kanilang mga anak
  rationale: Pinananatili ang pangkalahatang salitang τέκνα, “mga anak,” at ipinahahayag sa natural na Tagalog ang possessive na diwa ng αὐτούς.
- source_word: μηδὲ τοῖς ἔθεσιν περιπατεῖν
  choice: huwag mamuhay ayon sa mga kaugalian
  rationale: Ang περιπατεῖν ay metapora para sa paraan ng pamumuhay. Mas natural sa modernong Tagalog ang “mamuhay” kaysa literal na “lumakad,” habang nananatili ang kahulugan.
theological_decisions:
- issue: Ang katangian ng paratang kay Pablo tungkol kay Moises at sa Kautusang Mosaiko
  choice: Inilahad bilang paratang na tinuturuan niyang “talikuran si Moises,” nang hindi pinatutunayang tama ang ulat.
  alternative: “nagtuturo ka ng pagtalikod kay Moises” o “talikuran ang Kautusan ni Moises”
  rationale: Iniuulat ng talata ang sinabi sa iba tungkol kay Pablo, hindi isang tuwirang teolohikal na hatol ng tagapagsalaysay. Ang “Moises” ay pinanatili upang hindi palawakin nang tahasan ang teksto tungo sa “Kautusan ni Moises.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga Hentil” bilang pamilyar na katawagang biblikal, at “mamuhay ayon sa” upang natural na maipahayag ang idyomatikong περιπατεῖν.
