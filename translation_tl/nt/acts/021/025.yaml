  source_fidelity: 'Tumpak ang pangunahing diwa: ang mga mananampalatayang Hentil ay pinagpadalhan ng pasabi tungkol sa pasiyang umiwas sa apat na nakalistang bagay. Gayunman, ang «matapos ipasiya» ay di-ganap na nagpapakita na ang «kami» ang nagpasiya (κρίναντες), at ang «anumang binigti» ay hindi natural at maaaring tumukoy sa anumang bagay, samantalang ang πνικτόν ay tumutukoy sa hayop/karne mula sa hayop na pinatay sa pagbibigti.'
  naturalness: Malinaw sa pangkalahatan, ngunit mas natural ang «matapos naming ipasiya» at «ang hayop na binigti.» Ang alternatibong nasa talababa b na «ingatan ang kanilang sarili mula sa» ay hindi likas na modernong Filipino; «mag-ingat laban sa» ang mas maayos na katumbas.
  terminology: Ang «mga Hentil,» «mga diyos-diyosan,» at «seksuwal na imoralidad» ay angkop at pinananatili. Ang «pasabi» ay katanggap-tanggap para sa di-tahasang layon ng ἀπεστείλαμεν, nang hindi ipinipilit na «sulat.»
  issues:
  - severity: medium
    issue: Hindi malinaw ang tagaganap ng pagpapasiya sa «matapos ipasiya.»
    rationale: Ang κρίναντες ay participle na ang paksa ay «kami»; «matapos naming ipasiya» ay tahasang nagpapanatili ng ugnayang ito.
  - severity: medium
    issue: Hindi natural at kulang sa sanggunian ang «ang anumang binigti.»
    rationale: Ang πνικτόν ay substantibong gamit ng pang-uring «binigti» at sa kontekstong pangpagkain ay hayop/karne ng hayop na napatay sa pagbibigti. Ang «ang hayop na binigti» ay natural at hindi nagpapasok ng bagong doktrinal na paliwanag.
  - severity: low
    issue: Hindi likas ang alternatibong salin sa talababa b.
    rationale: Ang «ingatan ang kanilang sarili mula sa» ay literalistiko ngunit hindi karaniwang Filipino. «Mag-ingat laban sa mga ito» ay mas natural habang pinananatili ang reflexive/guarding nuance ng φυλάσσεσθαι.
