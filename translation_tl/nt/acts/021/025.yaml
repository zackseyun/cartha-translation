lexical_decisions:
- source_word: περὶ δὲ
  choice: Ngunit tungkol sa
  rationale: Ipinakikilala ng περὶ ang paksang tinatalakay, samantalang ang δέ ay nagpapahiwatig ng banayad na paglipat o paghahambing sa naunang usapan tungkol sa mga mananampalatayang Judio.
- source_word: τῶν πεπιστευκότων ἐθνῶν
  choice: mga Hentil na sumampalataya
  rationale: Ang perpektong pandiwaring πεπιστευκότων ay tumutukoy sa mga taong sumampalataya at nananatili sa kalagayang iyon; sa konteksto, ang ἐθνῶν ay mga Hentil, hindi basta mga bansa.
- source_word: ἡμεῖς
  choice: kami
  rationale: Pinananatili ang tahasang panghalip na nagbibigay-diin sa pangkat na gumawa na ng pasiya at nagpadala ng pasabi.
- source_word: ἀπεστείλαμεν
  choice: nagpadala na kami ng pasabi
  rationale: Hindi tahasang binanggit sa Griyego ang layon ng pandiwa. Natural sa Filipino ang “nagpadala ng pasabi,” habang nililinaw sa talababa na maaaring tumukoy ang konteksto sa sulat o pasiya sa Gawa 15.
- source_word: κρίναντες
  choice: matapos ipasiya
  rationale: Ipinakikita ng aorist participle na nauna ang pormal na pagpapasiya sa pagpapadala; malinaw at natural ito sa modernong Filipino.
- source_word: φυλάσσεσθαι αὐτοὺς
  choice: dapat nilang iwasan
  rationale: Ipinahahayag nito ang pag-iingat ng sarili laban sa mga nakalistang bagay. Mas natural ang “iwasan” sa Filipino, at inilalagay sa talababa ang mas pormal at reflexive na alternatibo.
- source_word: τό τε εἰδωλόθυτον
  choice: ang anumang inihandog sa mga diyos-diyosan
  rationale: Malapit ito sa anyo ng Griyego at hindi labis na nililimitahan sa karne lamang; ipinapaliwanag sa talababa na pagkain ang tinutukoy sa konteksto.
- source_word: αἷμα
  choice: ang dugo
  rationale: Tuwirang salin ito ng maikling katawagan sa Griyego, nang hindi nagdaragdag sa pangunahing teksto ng paliwanag na hindi tahasang naroon.
- source_word: πνικτόν
  choice: ang anumang binigti
  rationale: Pinananatili ang maikli at malawak na anyo ng Griyego; nililinaw sa talababa na hayop na pinatay nang hindi pinatulo ang dugo ang tinutukoy.
- source_word: πορνείαν
  choice: ang seksuwal na imoralidad
  rationale: Saklaw ng πορνεία ang bawal o imoral na asal na seksuwal sa pangkalahatan; mas malawak at mas malinaw ito kaysa sa makitid o makalumang mga katumbas.
theological_decisions:
- issue: Kalikasán at tagal ng mga pagbabawal sa apostolikong pasiya
  choice: Tuwirang ilahad ang apat na pagbabawal nang hindi tinutukoy kung pansamantala o permanente ang mga ito.
  alternative: Ipaliwanag ang mga tuntunin sa pagkain bilang pansamantalang pag-aangkop para sa pakikisalo, o bilang permanenteng batas na umiiral sa lahat.
  rationale: Iniuulat ng talata ang nilalaman ng naunang pasiya ngunit hindi nito ipinapaliwanag dito ang buong teolohikal na batayan o tagal ng bawat pagbabawal. Kaya pinananatili ng salin ang tensiyon at hindi pumapanig sa isang denominasyonal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Hentil,” “mga diyos-diyosan,” at “seksuwal na imoralidad” bilang mga salitang madaling maunawaan ngunit angkop sa tekstong biblikal. Iniwasan ang sobrang literal na pariralang hindi natural sa Filipino, habang pinanatili sa mga talababa ang mahahalagang alternatibo at pahiwatig ng konteksto.
