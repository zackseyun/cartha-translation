  text: περὶ δὲ τῶν πεπιστευκότων ἐθνῶν ἡμεῖς ⸀ἀπεστείλαμεν ⸀κρίναντες φυλάσσεσθαι αὐτοὺς τό τε εἰδωλόθυτον ⸀καὶ αἷμα καὶ πνικτὸν καὶ πορνείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/025.yaml
  text: But concerning the Gentiles who have believed[a], we sent word, having decided that they should keep themselves from what is sacrificed to idols, and from blood, and from what is strangled[c][b], and from sexual immorality.
translation:
  language: tl
  text: 'Ngunit tungkol sa mga Hentil na sumampalataya, nagpadala kami ng pasabi[a], matapos naming ipasiya na dapat nilang iwasan[b] ang anumang inihandog sa mga diyos-diyosan,[c] ang dugo, ang hayop na binigti,[d] at ang seksuwal na imoralidad.


    [a] Sa Griyego, hindi tahasang binanggit kung ano ang ipinadala; ipinahihiwatig ng konteksto ang sulat o pasiya na ipinadala sa Gawa 15.


    [b] Maaari ring isalin na “mag-ingat laban sa mga ito.”


    [c] Tumutukoy ito sa pagkaing kaugnay ng paghahandog sa mga diyos-diyosan.


    [d] Tumutukoy ito sa hayop na pinatay nang hindi pinatulo ang dugo nito, gaya ng hayop na binigti.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, hindi tahasang binanggit kung ano ang ipinadala; ipinahihiwatig ng konteksto ang sulat o pasiya na ipinadala sa Gawa 15.
