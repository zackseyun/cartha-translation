  text: καὶ ἀσπασάμενος αὐτοὺς ἐξηγεῖτο καθ’ ἓν ἕκαστον ὧν ἐποίησεν ὁ θεὸς ἐν τοῖς ἔθνεσιν διὰ τῆς διακονίας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/019.yaml
  text: And after greeting them[b][a], he began to relate one by one the things that God had done among the Gentiles through his ministry.
translation:
  language: tl
  text: Pagkatapos niya silang batiin, isa-isa niyang isinalaysay[b] ang mga ginawa ng Diyos sa gitna ng mga Hentil[a] sa pamamagitan ng kanyang paglilingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga bansa.” Sa kontekstong ito, tumutukoy ang parirala sa mga Hentil, samakatuwid, sa mga taong hindi Judio.
    reason: lexical_alternative
  - marker: b
    text: O “iniulat niya nang detalyado” o “ipinaliwanag niya.” Ipinahihiwatig ng pandiwang Griego ang isang detalyado at isa-isang pag-uulat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασάμενος
  choice: Pagkatapos niya silang batiin
  rationale: Ipinahihiwatig ng aorist participle na naunang nangyari ang pagbati bago ang pagsasalaysay. Natural sa modernong Tagalog ang ganitong pagkakasunod.
- source_word: ἐξηγεῖτο
  choice: isinalaysay
  rationale: Maaaring mangahulugang magsalaysay, mag-ulat, o magpaliwanag nang detalyado ang pandiwa. Kasama ng kasunod na pariralang distributibo, malinaw na tumutukoy ito sa masusing pagsasalaysay.
- source_word: καθ’ ἓν ἕκαστον
  choice: isa-isa
  rationale: Pinananatili nito ang distributibong diwa ng pag-uulat sa bawat pangyayari o bagay nang sunod-sunod.
- source_word: ὧν ἐποίησεν ὁ θεὸς
  choice: ang mga ginawa ng Diyos
  rationale: Malinaw na pinananatili ang Diyos bilang gumagawa at ang tiyak na mga gawa bilang laman ng ulat.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: sa mga Hentil
  rationale: Sa kontekstong ito, ang ἔθνη ay tumutukoy sa mga taong hindi Judio, hindi lamang sa mga bansang pampolitika.
- source_word: διὰ τῆς διακονίας αὐτοῦ
  choice: sa pamamagitan ng kanyang paglilingkod
  rationale: Ipinakikita ng διά na ang paglilingkod ni Pablo ang naging kasangkapan. Ang “paglilingkod” ay natural at hindi labis na teknikal na katumbas ng διακονία.
theological_decisions:
- issue: Ang pagkilos ng Diyos at ang papel ni Pablo sa gawaing misyonero
  choice: Ang Diyos ang tahasang gumagawa, at ang paglilingkod ni Pablo ang paraang ginamit.
  alternative: Si Pablo ang pangunahing gumawa ng mga bagay na iniulat niya.
  rationale: Ang ἐποίησεν ὁ θεὸς ay tahasang nagtatalaga sa Diyos bilang gumagawa, samantalang ang διὰ τῆς διακονίας αὐτοῦ ay naglalarawan sa paglilingkod ni Pablo bilang kasangkapan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Hentil” bilang karaniwang terminong biblikal, na nilinaw sa talababa; pinili ang “paglilingkod” sa halip na mas teknikal na “ministeryo.”
