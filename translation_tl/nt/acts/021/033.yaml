  text: ⸂τότε ἐγγίσας⸃ ὁ χιλίαρχος ἐπελάβετο αὐτοῦ καὶ ἐκέλευσε δεθῆναι ἁλύσεσι δυσί, καὶ ἐπυνθάνετο ⸀τίς εἴη καὶ τί ἐστιν πεποιηκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/033.yaml
  text: Then the commander came up[a], seized him, and ordered him to be bound with two chains[b], and was asking who he was and what he had done.
translation:
  language: tl
  text: Noon, lumapit ang kumander[a], dinakip niya si Pablo, at ipinagapos siya sa dalawang tanikala.[b] Patuloy niyang tinatanong kung sino siya at kung ano ang ginawa niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego na χιλίαρχος ay tumutukoy sa isang Romanong opisyal ng hukbo, literal na “kumander ng isang libo”; tinatawag din itong tribuno.
    reason: lexical_alternative
  - marker: b
    text: Ang “dalawang tanikala” ay maaaring alingawngaw ng hula sa Mga Gawa 21:11 na igagapos si Pablo sa Jerusalem.
    reason: cross_reference
lexical_decisions:
- source_word: τότε ἐγγίσας
  choice: Paglapit
  rationale: Ipinapahayag nang likas sa salaysay ang naunang kilos ng paglapit bago ang pagdakip; hindi na kailangang isalin nang hiwalay ang τότε upang maiwasan ang mabigat na daloy.
- source_word: χιλίαρχος
  choice: kumander
  rationale: Tumutukoy sa Romanong opisyal na namumuno sa malaking yunit ng hukbo. Malinaw at kasalukuyang Filipino ang “kumander,” samantalang masyadong teknikal ang “tribuno” at maaaring malabo sa karaniwang mambabasa.
- source_word: ἐπελάβετο αὐτοῦ
  choice: dinakip niya si Pablo
  rationale: Sa konteksto ng pag-aresto, ang pandiwa ay nagpapahiwatig ng sapilitang paghawak. Ginamit ang pangalang “Pablo” upang maging malinaw ang tinutukoy sa natural na Filipino.
- source_word: ἐκέλευσε δεθῆναι
  choice: iniutos na gapusin ito
  rationale: 'Pinananatili ang awtoritatibong utos at ang pasibong diwa: ipinagawa ng kumander sa iba ang paggapos kay Pablo.'
- source_word: ἁλύσεσι δυσί
  choice: dalawang tanikala
  rationale: Tuwirang katumbas ng dalawang chain na gamit sa pagkustodiya. Ang “tanikala” ay dignificado, malinaw, at angkop sa konteksto.
- source_word: ἐπυνθάνετο
  choice: Patuloy niyang itinatanong
  rationale: Inihahatid ng “patuloy” ang aspektong di-ganap ng imperfect, na naglalarawan ng nagpapatuloy o paulit-ulit na pagtatanong sa gitna ng kaguluhan.
- source_word: τίς εἴη
  choice: kung sino ito
  rationale: Natural na di-tuwirang tanong sa Filipino; hindi kailangang ipilit ang anyong optative na walang hiwalay na likas na katumbas dito.
- source_word: τί ἐστιν πεποιηκώς
  choice: kung ano ang ginawa nito
  rationale: Ipinapahayag ang kilos na naganap na at siyang dahilan ng kasalukuyang pagsisiyasat, habang nananatiling natural sa Filipino.
theological_decisions:
- issue: Posibleng ugnayan ng “dalawang tanikala” sa hula sa Mga Gawa 21:11
  choice: Panatilihin sa pangunahing teksto ang literal na “dalawang tanikala” at banggitin lamang sa talababa ang posibleng alingawngaw.
  alternative: Ipaliwanag sa pangunahing teksto na katuparan ito ng hula.
  rationale: Hindi tahasang sinasabi ng talata na ito ang katuparan o sinadyang pagbanggit sa hula; pinananatili ng talababa ang posibleng pampanitikang ugnayan nang hindi ito ginagawang tiyak.
translation_notes:
  register: Makabago at dignifikadong Filipino na madaling maunawaan. Ginamit ang “kumander” bilang pamilyar na katawagang militar at ang “tanikala” upang mapanatili ang konkretong larawan ng tekstong Griego. Ang mga panghalip na “ito” ay umiiwas sa kalituhan sa pagitan ng kumander at ni Pablo.
