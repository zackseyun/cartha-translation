  text: ⸀ἀναφάναντες δὲ τὴν Κύπρον καὶ καταλιπόντες αὐτὴν εὐώνυμον ἐπλέομεν εἰς Συρίαν, καὶ ⸀κατήλθομεν εἰς Τύρον, ἐκεῖσε γὰρ ⸂τὸ πλοῖον ἦν⸃ ἀποφορτιζόμενον τὸν γόμον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/003.yaml
  text: After sighting Cyprus and leaving it on our left[a], we sailed on to Syria and came down to Tyre[d][c][b], for there the ship was unloading its cargo.
translation:
  language: tl
  text: Nang matanaw namin ang Ciprus[a], dinaanan namin ito sa aming kaliwa[b] at naglayag kami patungong Siria. Nakarating kami sa Tiro[c], sapagkat doon nagbababa ng kargamento ang barko.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang lumitaw sa aming paningin ang Ciprus.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, nanatili ang Ciprus sa kaliwang panig ng barko habang naglalayag sila.
    reason: cultural_note
  - marker: c
    text: 'Mas literal: “bumaba kami patungong Tiro.” Maaari ring “dumating kami sa Tiro.”'
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “doon ibinababa ang kargamento ng barko” o “doon inilalabas ng barko ang kargamento nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναφάναντες
  choice: Nang matanaw namin
  rationale: Ipinahihiwatig ng aorist participle ang kilos na nauna sa paglalayag. Likas sa Filipino ang “nang matanaw” at angkop ito sa isang pook na lumilitaw sa paningin habang naglalakbay sa dagat.
- source_word: καταλιπόντες αὐτὴν εὐώνυμον
  choice: iniwan namin ito sa gawing kaliwa
  rationale: Tuwirang pinananatili ang direksiyong εὐώνυμον (“kaliwa”) nang hindi gumagamit ng teknikal na terminong pandagat. Ang diwa ay nanatili ang Ciprus sa kaliwang panig ng mga manlalakbay habang nagpapatuloy sila.
- source_word: ἐπλέομεν εἰς Συρίαν
  choice: naglayag patungong Siria
  rationale: Malinaw at likas na inilalarawan ang patuloy na paglalakbay sa dagat. Hindi kailangang tahasang dagdagan ng “nagpatuloy,” sapagkat naipakikita na iyon ng daloy ng pangungusap.
- source_word: κατήλθομεν εἰς Τύρον
  choice: Nakarating kami sa Tiro
  rationale: Karaniwang maaaring mangahulugan ang κατέρχομαι ng pagpunta o pagdating, lalo na sa salaysay ng paglalakbay. Mas natural sa modernong Filipino ang “nakarating,” habang inilalagay sa talababa ang mas literal na direksiyonal na anyo.
- source_word: ἀποφορτιζόμενον
  choice: ibinababa
  rationale: Ipinahihiwatig ng periphrastic imperfect ang nagaganap na pagbababa ng kargamento. Ang “ibinababa” ay natural na terminong Filipino para sa pag-aalis ng kargamento mula sa barko at hindi labis na nagtatakda kung ang barko o mga tauhan nito ang aktuwal na gumagawa.
- source_word: τὸν γόμον
  choice: ang kargamento nito
  rationale: Ang γόμος ay kargamento o lulan ng barko. Nililinaw ng “nito” ang kaugnayan sa barko nang hindi nagdaragdag ng bagong impormasyon.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang mga salitang “gawing kaliwa,” “nakarating,” at “ibinababa” sa halip na teknikal o di-likas na mga katawagang pandagat. Pinanatili sa mga talababa ang tunay na mga alternatibong pagbasa at ang mas literal na direksiyonal na pananalita.
