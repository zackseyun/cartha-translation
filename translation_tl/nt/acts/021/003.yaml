    issue: Ang “iniwan namin ito sa gawing kaliwa” ay hindi sapat na malinaw bilang paglalarawan ng pagdaan sa tabi ng Ciprus.
    rationale: Ang καταλιπόντες αὐτὴν εὐώνυμον ay nagsasaad na iniwan o dinaanan nila ang Ciprus na nasa kaliwang panig nila habang naglalayag, hindi na iniwan nila ito sa karaniwang diwa ng pagtalikod o pag-abandona.
  - severity: medium
    issue: 'Di-likas at semantikong baligtad ang ikalawang alternatibo sa talababa d: “inaalisan ng kargamento ang barko.”'
    rationale: Ang pangungusap ay maaaring mangahulugang ang kargamento ang umaalis sa barko. Ang ἀποφορτιζόμενον ay tumutukoy sa barkong naglalabas/nagpapababa ng kargamento, o sa barkong binabaan ng kargamento.
