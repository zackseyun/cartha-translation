id: ACT.21.4
reference: Acts 21:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂ἀνευρόντες δὲ τοὺς⸃ μαθητὰς ἐπεμείναμεν αὐτοῦ ἡμέρας ἑπτά, οἵτινες τῷ Παύλῳ ἔλεγον διὰ τοῦ πνεύματος μὴ ⸀ἐπιβαίνειν εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/004.yaml
  text: After finding the disciples[a], we stayed there seven days. They kept telling Paul through the Spirit not to go up to Jerusalem.
translation:
  language: tl
  text: Matapos naming matagpuan ang mga alagad, nanatili kami roon sa loob ng pitong araw. Sa pamamagitan ng Espiritu ay paulit-ulit nilang sinabihan si Pablo na huwag pumunta sa Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring ipinahayag ng Espiritu ang daranasin ni Pablo, at mula rito ay napagpasyahan ng mga alagad na hindi siya dapat magpatuloy sa Jerusalem.
    reason: Pinananatili ang posibleng pagkakaiba sa pagitan ng pahayag ng Espiritu tungkol sa pagdurusa at ng konklusyon ng mga alagad na huwag nang tumuloy si Pablo.
lexical_decisions:
- source_word: ἀνευρόντες
  choice: Nang matagpuan namin
  rationale: Ipinahahayag ng aorist participle ang kilos na nauna sa pananatili; natural sa makabagong Tagalog ang ganitong ayos.
- source_word: τοὺς μαθητάς
  choice: ang mga alagad
  rationale: Karaniwang salin ng μαθητής sa Mga Gawa at pinananatili ang tiyak na katawagan sa mga tagasunod ni Jesus.
- source_word: ἐπεμείναμεν αὐτοῦ
  choice: nanatili kami roon
  rationale: 'Ang ἐπιμένω ay nangangahulugang manatili, at ang αὐτοῦ ay pang-abay na tumutukoy sa lugar: “roon.”'
- source_word: ἡμέρας ἑπτά
  choice: nang pitong araw
  rationale: Isinasalin ang accusative of extent of time bilang tagal sa natural na Tagalog.
- source_word: οἵτινες
  choice: nila
  rationale: Malinaw na ibinabalik ang pagtukoy sa mga alagad nang hindi kinakailangang ulitin ang pangngalan.
- source_word: ἔλεγον
  choice: paulit-ulit nilang sinabihan
  rationale: Ipinahahayag ng imperfect ang nagpapatuloy o inuulit na pagsasabi.
- source_word: διὰ τοῦ πνεύματος
  choice: Sa pamamagitan ng Espiritu
  rationale: Pinananatili ang diwa ng paraan o ahensiya at hindi idinaragdag ang “Banal,” na hindi tahasang nasa parirala.
- source_word: μὴ ἐπιβαίνειν εἰς Ἱεροσόλυμα
  choice: na huwag pumunta sa Jerusalem
  rationale: Sa konteksto ng paglalakbay, tumutukoy ang ἐπιβαίνειν sa pagpapatuloy patungo sa isang destinasyon. Mas natural sa kasalukuyang Tagalog ang “pumunta” kaysa sa literal na “umakyat,” habang hindi binabago ang destinasyon.
theological_decisions:
- issue: Kaugnayan ng διὰ τοῦ πνεύματος sa pagbabawal kay Pablo
  choice: Sa pamamagitan ng Espiritu, paulit-ulit nilang sinabihan si Pablo na huwag pumunta
  alternative: Ipinahayag ng Espiritu ang daranasin ni Pablo, at mula rito ay sila mismo ang nagpasyang pagbawalan siya
  rationale: Tahasan sa gramatika na sa pamamagitan ng Espiritu naganap ang kanilang pagsasabi, ngunit hindi nilulutas ng salin kung ang mismong pagbabawal ay direktang utos ng Espiritu o konklusyon ng mga alagad mula sa pahayag ng Espiritu. Pinananatili ng pangunahing teksto at talababa ang tensiyon sa mas malawak na salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga alagad,” “Espiritu,” at “Jerusalem” bilang pamilyar na katawagang biblikal; iniwasan ang labis na literal ngunit di-natural na “umakyat” sa kontekstong ito.
