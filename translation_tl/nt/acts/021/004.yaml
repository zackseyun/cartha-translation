revisions:
- from: Nang matagpuan namin ang mga alagad, nanatili kami roon nang pitong araw. Sa pamamagitan ng Espiritu, paulit-ulit nilang sinabihan si Pablo na huwag pumunta sa Jerusalem.[a]
  to: Matapos naming matagpuan ang mga alagad, nanatili kami roon sa loob ng pitong araw. Sa pamamagitan ng Espiritu ay paulit-ulit nilang sinabihan si Pablo na huwag pumunta sa Jerusalem.[a]
  rationale: Inayos ang mga parirala para sa mas natural na modernong Tagalog habang pinananatili ang pagkakasunod ng mga kilos, ang duratibong diwa ng imperfect na «paulit-ulit nilang sinabihan,» at ang hindi nilulutas na kaugnayan ng Espiritu sa kanilang babala. Nananatili ang talababa upang ipakita ang lehitimong interpretatibong posibilidad nang hindi ito ipinapataw sa pangunahing teksto.
