  - severity: low
    issue: Pagkakabit ng «Sa pamamagitan ng Espiritu»
    rationale: 'Mas malinaw sa Tagalog ang paggamit ng «ay» pagkatapos ng paunang pariralang pang-abay: «Sa pamamagitan ng Espiritu ay…» Hindi nito binabago ang saklaw o nilulutas ang teolohikal na ambiguwidad.'
