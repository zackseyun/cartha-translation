  text: μὴ πειθομένου δὲ αὐτοῦ ἡσυχάσαμεν εἰπόντες· ⸂Τοῦ κυρίου τὸ θέλημα⸃ ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/014.yaml
  text: And since he would not be persuaded[a], we became quiet, saying, “The Lord’s will be done.”
translation:
  language: tl
  text: At dahil hindi siya mapapayag[a], tumahimik kami at sinabi, “Mangyari nawa ang kalooban ng Panginoon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi siya makumbinsi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πειθομένου δὲ αὐτοῦ
  choice: At dahil ayaw niyang magpapigil
  rationale: Ang genitive absolute na may μή at present participle ng πείθω ay naglalarawan sa patuloy na hindi pagpapaawat ni Pablo sa kanilang pakiusap. Likas sa konteksto ang “ayaw niyang magpapigil” at hindi nito ginagawang simpleng hindi pakikinig ang diwa.
- source_word: ἡσυχάσαμεν
  choice: tumahimik na kami
  rationale: Ipinapahayag ng aorist ng ἡσυχάζω na tumigil na silang manghikayat at hindi na ipinagpatuloy ang pagtutol. Ang “na” ay likas na naghahatid ng pagbabagong ito sa Tagalog.
- source_word: εἰπόντες
  choice: at sinabi
  rationale: Ginawang koordinadong sugnay ang participle upang maging natural sa modernong Tagalog habang malinaw na ang sinabi ay kasabay ng kanilang pagtigil sa panghihikayat.
- source_word: Τοῦ κυρίου
  choice: ng Panginoon
  rationale: Pinananatili ng “Panginoon” ang karaniwang salin ng κύριος at hindi ginagawang tahasan ang tinutukoy nang higit sa ipinahahayag ng Griyego.
- source_word: τὸ θέλημα
  choice: kalooban
  rationale: Ang “kalooban” ang natural at nakaugaliang Tagalog para sa θέλημα bilang nais o layunin ng isang persona.
- source_word: γινέσθω
  choice: Mangyari nawa
  rationale: Ang imperative ay nagpapahayag ng mapagpakumbabang pagsang-ayon na matupad o maganap ang kalooban ng Panginoon. Pinananatili ng “nawa” ang panalangin o paghahangad na tono nang hindi ipinapahiwatig na sila ang gagawa nito.
theological_decisions:
- issue: Pagpapatunay sa tinutukoy ng κύριος
  choice: Panginoon
  alternative: Guro o Tahasang “Panginoong Jesus”
  rationale: Ang Griyego ay κύριος lamang. Ang “Panginoon” ay tapat sa titulo at iniiwang hindi tahasang tinukoy ang referent, gaya ng orihinal, bagaman sa konteksto ay malamang na tumutukoy kay Jesus.
- issue: Diwa ng γινέσθω
  choice: Mangyari nawa ang kalooban
  alternative: Gawin ang kalooban
  rationale: Ang γίνομαι ay nakatuon sa pag-iral o pagganap ng kalooban, hindi sa isang utos sa mga alagad na sila mismo ang gumawa nito. Kaya pinananatili ang diwa ng pagpapasakop sa mangyayari.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at madaling maunawaan. Ang “magpapigil” ay angkop sa kontekstong pinipigilan nila si Pablo na pumunta sa Jerusalem; hindi nito tahasang sinasabing matigas ang ulo niya. Ang “Mangyari nawa” ay dignificado at pamilyar sa biblikal na pananalita nang hindi labis na makaluma.
