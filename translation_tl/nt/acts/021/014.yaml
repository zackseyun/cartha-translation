  naturalness: Likas at malinaw sa modernong Filipino Tagalog ang “dahil hindi siya mapapayag, tumahimik kami.” Ang pananalitang “Mangyari nawa ang kalooban ng Panginoon” ay angkop sa magalang at biblikal na rehistro.
  terminology: Wasto ang “Panginoon” para sa κύριος at “kalooban” para sa θέλημα. Pinananatili ng “Mangyari nawa” ang mapagpasakop na puwersa ng γινέσθω nang hindi idinadagdag ang tagaganap.
