  text: συνῆλθον δὲ καὶ τῶν μαθητῶν ἀπὸ Καισαρείας σὺν ἡμῖν, ἄγοντες παρ’ ᾧ ξενισθῶμεν Μνάσωνί τινι Κυπρίῳ, ἀρχαίῳ μαθητῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/016.yaml
  text: And some of the disciples from Caesarea also went with us, bringing us to Mnason, a certain Cypriot, an early disciple, with whom we were to stay.
translation:
  language: tl
  text: May ilan ding alagad mula sa Cesarea na sumama sa amin. Dinala nila kami kay Mnason, isang taga-Ciprus at matagal nang alagad,[a] na siyang tutuluyan namin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isa sa mga unang alagad.” Maaaring mangahulugan ang parirala na matagal na siyang alagad, marahil mula pa sa mga unang panahon ng kilusan.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “Inakay nila kami kay Mnason … upang makituloy sa kanya,” o “Dinala nila kami sa bahay ni Mnason.” Bahagyang nag-iiba ang posibleng pag-unawa sa Griyegong pandiwari at sa pandiwang tumutukoy sa panunuluyan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆλθον δὲ καὶ τῶν μαθητῶν
  choice: May ilan ding alagad … na sumama
  rationale: Ipinapahayag ang partitive na diwa ng τῶν μαθητῶν bilang “ilan … sa/mula sa” at ang συνῆλθον σὺν ἡμῖν bilang pagsama sa paglalakbay.
- source_word: ἀπὸ Καισαρείας
  choice: mula sa Cesarea
  rationale: Tuwirang nagsasaad ng pinanggalingan ng mga alagad; ginamit ang karaniwang anyong Filipino ng pangalang Cesarea.
- source_word: ἄγοντες
  choice: Dinala nila kami kay
  rationale: Sa konteksto, inakay o dinala ng mga alagad ang pangkat patungo sa taong magpapatuloy sa kanila. Ginawang hiwalay na pangungusap para sa likas at malinaw na Filipino.
- source_word: Μνάσωνί τινι Κυπρίῳ
  choice: kay Mnason, isang taga-Ciprus
  rationale: Ipinakikilala si Mnason bilang isang di-pa-nabanggit na tao at tinutukoy ang kanyang pinagmulan. Hindi kailangang isalin nang literal ang τινι bilang “isang nagngangalang” dahil sapat na ang likas na pagpapakilala sa Filipino.
- source_word: ἀρχαίῳ μαθητῇ
  choice: matagal nang alagad
  rationale: Pinananatili ang temporal na diwa ng ἀρχαῖος nang hindi tiyak na ipinapahayag na kabilang siya sa pinakaunang pangkat ng mga alagad.
- source_word: παρ’ ᾧ ξενισθῶμεν
  choice: na siyang tutuluyan namin
  rationale: Likas na Filipino para sa nilalayong panunuluyan sa bahay o pangangalaga ni Mnason, habang iniiwasang dagdagan ang teksto ng tahasang “bahay” sa pangunahing salin.
theological_decisions:
- issue: Saklaw ng ἀρχαίῳ μαθητῇ
  choice: matagal nang alagad
  alternative: isa sa mga unang alagad
  rationale: Maaaring tumukoy ang parirala sa isang alagad mula pa noong unang panahon ng kilusan o sa isang matagal nang alagad. Pinili ang hindi gaanong tiyak na pagbasa at inilagay sa talababa ang alternatibo upang hindi mag-angkin ng higit sa sinasabi ng Griyego.
- issue: Ugnayan ng ἄγοντες at παρ’ ᾧ ξενισθῶμεν
  choice: Dinala nila kami kay Mnason … na siyang tutuluyan namin
  alternative: Isinama nila kami sa bahay ni Mnason upang doon tumuloy
  rationale: Pinananatili ang taong tinutukoy ng relative clause bilang si Mnason at hindi ipinapalagay sa pangunahing teksto ang salitang “bahay,” na hindi tahasang naroon sa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “alagad,” “taga-Ciprus,” at “tutuluyan” bilang mga salitang karaniwan at madaling maunawaan. Hinati sa dalawang pangungusap ang mahabang estrukturang Griyego upang maging natural sa Filipino nang hindi nawawala ang mga ugnayang gramatikal.
