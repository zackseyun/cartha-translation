base_translation:
  language: en
  yaml_path: translation/nt/acts/021/017.yaml
  text: When we arrived in Jerusalem[a], the brothers welcomed us gladly.
translation:
  language: tl
  text: Nang makarating kami sa Jerusalem, malugod kaming tinanggap ng mga kapatid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “mga kapatid na lalaki”; maaari rin itong tumukoy nang mas malawak sa mga kapwa mananampalataya, kabilang ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένων δὲ ἡμῶν
  choice: Nang makarating kami
  rationale: Ang genitive absolute ay nagsasaad dito ng panahon o kalagayan ng pagdating. Likas sa modernong Tagalog ang “Nang makarating kami” at malinaw nitong naipapahayag ang diwang temporal.
- source_word: εἰς Ἱεροσόλυμα
  choice: sa Jerusalem
  rationale: Ipinapakita ng εἰς ang patutunguhan. Kasunod ng “makarating,” ang “sa Jerusalem” ang natural na anyo sa Tagalog.
- source_word: ἀσμένως
  choice: malugod
  rationale: Ipinahihiwatig ng pang-abay ang masaya at kusang pagtanggap. Ang “malugod” ay maikli, marangal, at malapit sa kahulugan nang hindi dinaragdagan ang teksto.
- source_word: ἀπεδέξαντο
  choice: tinanggap
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa magiliw na pagtanggap sa mga taong dumating. Sapat na naihahatid ng “tinanggap,” kasama ng “malugod,” ang diwa ng welcoming reception.
- source_word: οἱ ἀδελφοί
  choice: mga kapatid
  rationale: Ang karaniwang salin sa Tagalog na “mga kapatid” ay natural na katawagan sa mga kapwa mananampalataya. Hindi ito minamarkahan sa kasarian, kaya nililinaw sa talababa na panlalaking maramihan ang anyong Griyego ngunit maaari itong tumukoy nang mas malawak sa pamayanang sumasampalataya.
theological_decisions:
- issue: Saklaw ng οἱ ἀδελφοί sa pamayanang Kristiyano sa Jerusalem
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga mananampalataya
  rationale: Panlalaking maramihan ang anyong Griyego, ngunit sa sinaunang Kristiyanong gamit maaari itong maging katawagan sa mga kapwa mananampalataya nang mas malawak. Pinananatili ng “mga kapatid” ang relasyong pampamilya at ang likas na kalabuan sa Tagalog; inilalahad sa talababa ang anyo at posibleng saklaw ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “malugod” upang mapanatili ang positibong damdamin ng ἀσμένως nang hindi nagiging labis na pormal; ang “mga kapatid” ay karaniwang katawagan sa loob ng pamayanang Kristiyano.
