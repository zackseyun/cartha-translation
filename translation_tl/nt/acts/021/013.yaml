  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂τότε ἀπεκρίθη⸃ ὁ Παῦλος· Τί ποιεῖτε κλαίοντες καὶ συνθρύπτοντές μου τὴν καρδίαν; ἐγὼ γὰρ οὐ μόνον δεθῆναι ἀλλὰ καὶ ἀποθανεῖν εἰς Ἰερουσαλὴμ ἑτοίμως ἔχω ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/013.yaml
  text: Then Paul answered[a], “What are you doing[b], weeping and breaking my heart? For I am ready not only to be bound but even to die in Jerusalem for the name of the Lord Jesus.”
translation:
  language: tl
  text: Pagkatapos, sumagot si Pablo, “Ano ba itong ginagawa ninyo—umiiyak kayo at dinudurog ang puso ko[a]? Sapagkat handa ako hindi lamang na gapusin kundi pati na ring mamatay sa Jerusalem alang-alang sa pangalan ng Panginoong Jesus[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “winawasak ang kalooban ko.” Matindi ang pandiwang Griyego at inilalarawan nito ang pagdurog o pagwasak sa damdamin ng isang tao.
    reason: lexical_alternative
  - marker: b
    text: Ang “pangalan” ay biblikal na paraan ng pagtukoy kay Jesus mismo, sa kaniyang awtoridad, at sa layuning kaugnay niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε ἀπεκρίθη ὁ Παῦλος
  choice: Pagkatapos, sumagot si Pablo
  rationale: Isinasalin ang τότε bilang maikling panandang pasalaysay at ang ἀπεκρίθη bilang karaniwang pandiwa ng pagtugon.
- source_word: Τί ποιεῖτε κλαίοντες
  choice: Bakit kayo umiiyak
  rationale: Sa kontekstong ito, ang literal na tanong na “Ano ang ginagawa ninyo na umiiyak” ay isang emosyonal na pagtutol; ang “Bakit kayo umiiyak” ang likas na katumbas nito sa modernong Tagalog nang hindi dinaragdagan ang diwa.
- source_word: συνθρύπτοντές μου τὴν καρδίαν
  choice: dinudurog ang puso ko
  rationale: Pinananatili ang matinding metapora ng pandiwang tumutukoy sa pagdurog o pagwasak at gumagamit ng likas na idyomang Tagalog.
- source_word: δεθῆναι
  choice: na gapusin
  rationale: Tuwirang pinananatili ang pasibong kahulugan ng δέω; hindi ito pinalawak agad tungo sa “ibilanggo.”
- source_word: ἀποθανεῖν
  choice: mamatay
  rationale: Tuwiran at likas na katumbas ng infinitibong Griyego.
- source_word: εἰς Ἰερουσαλὴμ
  choice: sa Jerusalem
  rationale: Sa Tagalog, ang “sa Jerusalem” ay likas na nagsasaad ng lugar kung saan handang gapusin at mamatay si Pablo, habang hindi ipinipilit ang karaniwang direksiyonal na diwa ng εἰς.
- source_word: ἑτοίμως ἔχω
  choice: Handa ako
  rationale: Likas at maikli itong salin ng idyomang nangangahulugang nasa kalagayang handa.
- source_word: ὑπὲρ τοῦ ὀνόματος
  choice: alang-alang sa pangalan
  rationale: Ang “alang-alang sa” ay malinaw na naghahayag ng layuning sakripisyal, samantalang pinananatili ang biblikal at teolohikal na idyomang “pangalan.”
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ng Panginoong Jesus
  rationale: Isinasalin ang κύριος bilang titulong “Panginoon” at ginagamit ang likas na anyong Tagalog na “Panginoong Jesus.”
theological_decisions:
- issue: Ang titulong κύριος para kay Jesus
  choice: Panginoong Jesus
  alternative: Gurong Jesus
  rationale: Ang κύριος dito ay kristolohikal na titulo at hindi dapat pahinain o gawing paliwanag lamang.
- issue: Pagpapanatili sa idyomang “ang pangalan”
  choice: alang-alang sa pangalan ng Panginoong Jesus
  alternative: alang-alang sa Panginoong Jesus
  rationale: Pinananatili ng salin ang teolohikal na bigat at lawak ng “pangalan,” na maaaring tumukoy kay Jesus mismo, sa kaniyang awtoridad, at sa layuning kaugnay niya, sa halip na tahimik itong paliitin sa isang paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang likas na emosyonal na tanong na “Bakit kayo umiiyak” sa halip na ang alanganing literal na ayos, habang pinananatili ang matinding metapora ng pusong dinudurog, ang konkretong “gapusin,” at ang teolohikal na idyoma ng “pangalan.”
