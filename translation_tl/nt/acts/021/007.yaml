id: ACT.21.7
reference: Acts 21:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ τὸν πλοῦν διανύσαντες ἀπὸ Τύρου κατηντήσαμεν εἰς Πτολεμαΐδα, καὶ ἀσπασάμενοι τοὺς ἀδελφοὺς ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/007.yaml
  text: We[a], having finished the voyage from Tyre, arrived at Ptolemais, and after greeting the brothers, we stayed with them one day.
translation:
  language: tl
  text: Nang matapos namin ang paglalayag mula sa Tiro, dumating kami sa Tolemaida. Binati namin ang mga kapatid[a] at nanatili kaming kasama nila nang isang araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego ay literal na “mga kapatid na lalaki,” ngunit maaari itong tumukoy nang mas malawak sa mga kapwa mananampalataya, kabilang ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: namin … kami
  rationale: Ang hayag na panghalip ay nagpapatuloy sa salaysay ng pangkat na nagsasalita. Hindi na isinalin nang hiwalay ang δέ dahil likas na naipahihiwatig sa daloy ng Filipino ang pagpapatuloy.
- source_word: τὸν πλοῦν διανύσαντες
  choice: Nang matapos namin ang paglalayag
  rationale: Ipinapahayag ng διανύω ang pagtatapos ng isang paglalakbay, at ang πλοῦς ay paglalakbay sa dagat. Pinananatili ng sugnay na may “nang” ang pagkakasunod ng kilos sa participle.
- source_word: ἀπὸ Τύρου
  choice: mula sa Tiro
  rationale: Tuwirang ipinapakita ng ἀπό ang pinanggalingan; “Tiro” ang nakasanayang anyong Filipino ng pangalan.
- source_word: κατηντήσαμεν εἰς Πτολεμαΐδα
  choice: dumating kami sa Tolemaida
  rationale: Sa konteksto ng paglalakbay, ang καταντάω ay pagdating sa destinasyon. Natural sa Filipino ang “dumating sa,” at “Tolemaida” ang anyong angkop sa ortograpiyang Filipino.
- source_word: ἀσπασάμενοι
  choice: Binati namin
  rationale: Ang ἀσπάζομαι ay nangangahulugang bumati. Ginawang hiwalay na pangungusap upang maging malinaw at natural ang sunod-sunod na kilos nang hindi binabago ang relasyon ng mga ito.
- source_word: τοὺς ἀδελφοὺς
  choice: ang mga kapatid
  rationale: Sa Filipino, ang “kapatid” ay hindi minamarkahan ayon sa kasarian at karaniwang tawag sa mga kapwa mananampalataya. Pinananatili nito ang literal na larawang pampamilya at ang posibilidad na mas malawak ang tinutukoy kaysa mga lalaking kapatid lamang.
- source_word: ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς
  choice: nanatili kaming kasama nila nang isang araw
  rationale: Ang μένω ay “manatili,” ang accusative na ἡμέραν μίαν ay tagal na isang araw, at ang παρά na may dative ay pakikisama o pananatili sa piling nila.
theological_decisions:
- issue: Saklaw ng τοὺς ἀδελφοὺς sa pamayanang Cristiano
  choice: ang mga kapatid
  alternative: ang mga kapatid na lalaki; ang mga kapwa mananampalataya
  rationale: Masculine plural ang anyong Griego ngunit maaari itong tumukoy nang mas malawak sa mga miyembro ng pamayanan. Dahil likas na walang kasariang gramatikal ang “mga kapatid” sa Filipino, hindi nito sapilitang nililimitahan sa mga lalaki ang tinutukoy at hindi rin inaalis ang larawang pampamilya ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “paglalayag” para sa tiyak na paglalakbay sa dagat at ang mga pangalang “Tiro” at “Tolemaida” sa anyong madaling basahin sa Filipino.
