id: ACT.21.20
reference: Acts 21:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐδόξαζον τὸν ⸀θεόν, ⸂εἶπόν τε⸃ αὐτῷ· Θεωρεῖς, ἀδελφέ, πόσαι μυριάδες εἰσὶν ⸂ἐν τοῖς Ἰουδαίοις⸃ τῶν πεπιστευκότων, καὶ πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/020.yaml
  text: When they heard this[a], they glorified God, and they said to him, “You see, brother, how many myriads there are among the Jews who have believed[b], and they are all zealous for the law.”
translation:
  language: tl
  text: Nang marinig nila ito, niluwalhati nila ang Diyos. Pagkatapos, sinabi nila kay Pablo, “Nakikita mo, kapatid, kung ilang libo-libo[a] sa mga Judio[b] ang sumampalataya, at silang lahat ay masigasig sa Kautusan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung ilang sampu-sampung libo.” Ang salitang Griyego na μυριάδες ay maaaring tumukoy sa mga yunit ng sampung libo o, sa mas pangkalahatan, sa napakaraming bilang.
    reason: lexical_alternative
  - marker: b
    text: O “sa mga taga-Judea,” kung heograpiko sa halip na etniko o panrelihiyon ang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Nang marinig nila ito
  rationale: Ipinahahayag ang temporal na diwa ng aorist participle; likas na idinagdag ang “ito” bilang tumutukoy sa naunang ulat.
- source_word: ἐδόξαζον
  choice: niluwalhati nila
  rationale: Pinananatili ang diwa ng pagbibigay-luwalhati sa Diyos at ang imperfect na kilos na kasunod ng kanilang pagkarinig.
- source_word: εἶπόν τε αὐτῷ
  choice: Pagkatapos, sinabi nila kay Pablo
  rationale: Likas na isinasalin ang connective τέ sa daloy ng salaysay. Nilinaw ang reperente ng panghalip na αὐτῷ bilang Pablo nang hindi binabago ang kahulugan.
- source_word: Θεωρεῖς
  choice: Nakikita mo
  rationale: Ang present indicative ay retorikal na tumatawag ng pansin sa isang malinaw na kalagayan.
- source_word: ἀδελφέ
  choice: kapatid
  rationale: Tuwirang bokatibong tawag kay Pablo; natural at tapat sa kasarian at ugnayang ipinahahayag ng Griyego.
- source_word: πόσαι μυριάδες
  choice: kung ilang libo-libo
  rationale: Ang μυριάδες ay maaaring eksaktong mga yunit ng sampung libo o mas pangkalahatang napakaraming bilang. Ang “libo-libo” ay likas sa Tagalog at hindi labis na nagpapatiyak sa bilang; nasa talababa ang mas tiyak na alternatibo.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: sa mga Judio
  rationale: Tumutukoy rito sa mga Judio bilang pangkat-etniko at panrelihiyon; pinananatili sa talababa ang posibleng heograpikong diwang “mga taga-Judea.”
- source_word: τῶν πεπιστευκότων
  choice: ang sumampalataya
  rationale: 'Pinananatili ang pandiwang diwa ng perfect participle: mga taong sumampalataya at nananatili sa kalagayang iyon.'
- source_word: ζηλωταὶ τοῦ νόμου
  choice: masigasig para sa Kautusan
  rationale: Ipinahahayag ang matinding debosyon o sigasig, at ang malaking titik sa “Kautusan” ay nililinaw na ang tinutukoy ay ang Kautusan ni Moises.
- source_word: ὑπάρχουσιν
  choice: ay
  rationale: Gumaganap itong copular verb at natural na naihahayag sa Tagalog sa panandang “ay.”
theological_decisions:
- issue: Saklaw ng ἐν τοῖς Ἰουδαίοις
  choice: sa mga Judio
  alternative: sa mga taga-Judea
  rationale: Ang konteksto ay nagbibigay-diin sa pagkakakilanlang Judio at sa sigasig para sa Kautusan, hindi lamang sa paninirahan sa Judea. Gayunman, pinananatili sa talababa ang tunay na posibleng heograpikong pagbasa.
- issue: Lakas at eksaktong bilang ng μυριάδες
  choice: ilang libo-libo
  alternative: ilang sampu-sampung libo
  rationale: Maaaring tumukoy ang salita sa mga yunit ng sampung libo o sa napakalaking bilang sa pangkalahatan. Iniiwasan ng pangunahing salin ang di-makatwirang pagtiyak, habang inilalahad sa talababa ang mas literal na numerikal na diwa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “libo-libo” bilang natural na malaking-bilang na pahayag, “Judio” para sa Ἰουδαῖος, at “Kautusan” para tukuyin ang Kautusan ni Moises. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto.
