id: ACT.21.11
reference: Acts 21:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν πρὸς ἡμᾶς καὶ ἄρας τὴν ζώνην τοῦ Παύλου δήσας ⸀ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας εἶπεν· Τάδε λέγει τὸ πνεῦμα τὸ ἅγιον Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη, οὕτως δήσουσιν ἐν Ἰερουσαλὴμ οἱ Ἰουδαῖοι καὶ παραδώσουσιν εἰς χεῖρας ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/011.yaml
  text: 'And coming to us[a], and taking Paul’s belt, he bound his own feet and hands and said[b], “Thus says the Holy Spirit: ‘In this way the Jews in Jerusalem will bind the man to whom this belt belongs and will hand him over into the hands of the Gentiles.’”'
translation:
  language: tl
  text: 'Lumapit siya sa amin at kinuha ang sinturon ni Pablo. Itinali niya ang sarili niyang mga paa at mga kamay at sinabi, “Ganito ang sinasabi ng Banal na Espiritu: ‘Sa ganitong paraan gagapusin ng mga Judio sa Jerusalem ang lalaking may-ari ng sinturong ito[a], at ibibigay nila siya sa kamay ng mga Hentil.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ang lalaking sa kaniya ang sinturong ito.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “Ganito ang sinasabi ng Banal na Espiritu” ay maaari ring isaling “Ito ang sinasabi ng Banal na Espiritu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ζώνην
  choice: sinturon
  rationale: Karaniwang makabagong salitang Tagalog para sa pamigkis na isinusuot sa baywang; malinaw at hindi lipas.
- source_word: δήσας ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας
  choice: Itinali niya ang sarili niyang mga paa at mga kamay
  rationale: Ipinakikita ng reflexive na ἑαυτοῦ na ang sariling mga paa at kamay ni Agabo ang itinali niya. Ang “itinali” ay natural sa Tagalog at pinananatili ang ugnayan sa susunod na “gagapusin.”
- source_word: Τάδε λέγει
  choice: Ganito ang sinasabi
  rationale: Pinananatili nito ang maringal na pormulang propetiko habang natural pa rin sa makabagong Tagalog.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: ang Banal na Espiritu
  rationale: Pamantayan at malinaw na katawagan sa makabagong Tagalog.
- source_word: Τὸν ἄνδρα
  choice: ang lalaking
  rationale: Tiyak na tumutukoy sa isang lalaking nasa hustong gulang, si Pablo, nang hindi idinaragdag ang kaniyang pangalan sa mismong pahayag.
- source_word: οὗ ἐστιν ἡ ζώνη αὕτη
  choice: may-ari ng sinturong ito
  rationale: Natural na pagpapahayag ng kaugnayang pagmamay-ari sa Tagalog; ang mas literal na anyo ay inilagay sa talababa.
- source_word: οὕτως
  choice: Sa ganitong paraan
  rationale: Malinaw na iniuugnay ang isinagawang tanda sa ipinahahayag na mangyayari kay Pablo.
- source_word: οἱ Ἰουδαῖοι
  choice: ang mga Judio
  rationale: Hindi dinaragdagan ng “mga pinuno” ang tekstong Griyego at pinananatili ang pangkat na tahasang pinangalanan.
- source_word: παραδώσουσιν
  choice: ibibigay nila siya
  rationale: Natural na Tagalog para sa paghaharap o pagsasalin ng isang tao sa kapangyarihan ng iba; hindi ipinapasok ang mas tiyak na ideya ng pagkakanulo.
- source_word: εἰς χεῖρας ἐθνῶν
  choice: sa kamay ng mga Hentil
  rationale: Pinananatili ang biblikal na idyoma ng pagkakalagay sa kapangyarihan ng iba; sa kontekstong ito, ang ἔθνη ay mga hindi Judio.
theological_decisions:
- issue: Pormulang propetiko bilang tuwirang pahayag ng Espiritu
  choice: Ganito ang sinasabi ng Banal na Espiritu
  alternative: Ito ang sinasabi ng Banal na Espiritu
  rationale: Malapit ito sa pormulang propetiko ng Griyego at pinananatili ang maringal na tono at pag-aangkin ng awtoridad nang walang idinaragdag na paliwanag.
- issue: Tinutukoy ng ἑαυτοῦ
  choice: Itinali ni Agabo ang sarili niyang mga paa at mga kamay
  alternative: Itinali ni Agabo ang mga paa at mga kamay ni Pablo
  rationale: Ang reflexive na panghalip ay likas na tumutukoy sa simuno ng participle, kaya si Agabo ang gumapos sa sarili bilang makasagisag na kilos.
- issue: Pagkakakilanlan ng οἱ Ἰουδαῖοι
  choice: mga Judio
  alternative: mga pinunong Judio
  rationale: Walang salitang “mga pinuno” sa Griyego. Pinananatili ang malawak na katawagan ng teksto nang hindi ito ginagawang mas tiyak.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sinturon,” “itinali,” at “gagapusin” bilang madaling maunawaang mga salita, habang pinanatili ang propetikong tono ng pahayag at ang idyomang “sa kamay ng mga Hentil.”
