  source_fidelity: 'Tumpak na naipapahayag ang pagkilos ni Agabo: lumapit siya, kinuha ang sinturon ni Pablo, itinali ang sarili niyang mga paa at kamay, at nagsalita sa pormulang propetiko. Napananatili ang reflexive na ἑαυτοῦ at ang ugnayan ng makasagisag na pagkakatali sa hulang gagawin ng mga Judio sa Jerusalem. Ang “ibibigay nila siya sa kamay ng mga Hentil” ay angkop na Filipino na katumbas ng idyomang “hand over into the hands of the Gentiles.”'
  naturalness: Natural at malinaw ang modernong Filipino. Ang “Ganito ang sinasabi ng Banal na Espiritu” ay marangal ngunit hindi lipas, at ang “sinturon,” “gagapusin,” at “mga Hentil” ay angkop sa rehistro ng salaysay-biblikal.
  terminology: 'Wasto at magkakatugma ang mga pangunahing katawagan: “Banal na Espiritu” para sa τὸ πνεῦμα τὸ ἅγιον, “mga Judio” para sa οἱ Ἰουδαῖοι, at “mga Hentil” para sa ἐθνῶν. Hindi idinagdag ang “mga pinuno” sa “mga Judio,” at hindi binago ang “Hentil” tungo sa mas malabong “mga bansa.”'
