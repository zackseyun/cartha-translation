  yaml_path: translation/nt/acts/021/022.yaml
  text: What then is to be done? They will certainly hear that you have come[a].
translation:
  language: tl
  text: Kung gayon, ano ang dapat gawin?[a] Tiyak na mababalitaan nilang dumating ka na.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “Kung gayon, ano ito?” Sa Griyego, idyomatikong itinatanong dito kung ano ang dapat gawin dahil sa sitwasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: Kung gayon, ano ang dapat gawin?
  rationale: Sa literal, ang parirala ay nagtatanong, “Kung gayon, ano ito?” ngunit sa konteksto, isa itong idyomatikong tanong tungkol sa nararapat na hakbang. Likas at malinaw sa modernong Tagalog ang “ano ang dapat gawin?”
- source_word: πάντως
  choice: Tiyak
  rationale: Pinatitibay ng pang-abay ang katiyakan na mangyayari ang kasunod na pahayag; tuwirang ipinahahayag ito ng “tiyak.”
- source_word: ἀκούσονται
  choice: mababalitaan nila
  rationale: Bagaman literal na “maririnig nila,” ang pandiwa rito ay tumutukoy sa pagkatanggap ng balita. Ang “mababalitaan” ay natural sa Tagalog at pinananatili ang diwa ng di-tahasang maramihang simuno.
- source_word: ὅτι
  choice: na
  rationale: Ipinapakilala nito ang nilalaman ng balitang matatanggap, hindi ang dahilan.
- source_word: ἐλήλυθας
  choice: dumating ka na
  rationale: Ang perpektong anyo ay tumutukoy sa natapos na pagdating na may kasalukuyang resulta. Naipahihiwatig ito sa natural na Tagalog ng “dumating ka na.”
theological_decisions: []
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Tagalog. Pinili ang “mababalitaan” sa halip na ang mas literal na “maririnig” upang maging malinaw na ang tinutukoy ay pagkalat at pagkatanggap ng balita.
