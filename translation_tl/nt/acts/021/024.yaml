reference: Acts 21:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τούτους παραλαβὼν ἁγνίσθητι σὺν αὐτοῖς καὶ δαπάνησον ἐπ’ αὐτοῖς ἵνα ⸀ξυρήσονται τὴν κεφαλήν, καὶ ⸀γνώσονται πάντες ὅτι ὧν κατήχηνται περὶ σοῦ οὐδέν ἐστιν, ἀλλὰ στοιχεῖς καὶ αὐτὸς ⸂φυλάσσων τὸν νόμον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/024.yaml
  text: Take these men[a], purify yourself along with them, and pay their expenses so that they may shave their heads. Then everyone will know that there is nothing to the things they have been told about you[b], but that you yourself also are living in observance of the law.
translation:
  language: tl
  text: Isama mo ang mga lalaking ito, sumailalim ka sa paglilinis kasama nila, at sagutin mo ang kanilang mga gastos upang mag-ahit sila ng kanilang mga ulo. Sa gayon, malalaman ng lahat na walang katotohanan ang mga ibinalita sa kanila tungkol sa iyo[a], kundi ikaw mismo ay namumuhay rin nang naaayon sa kautusan at sumusunod dito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga itinuro sa kanila tungkol sa iyo.” Ang pandiwang Griyego ay maaaring mangahulugang “turuan” o, sa mas pangkalahatan, “ipaalam.” Sa kontekstong ito, tumutukoy ito sa mga ulat na kumakalat tungkol kay Pablo.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “lumalakad nang nakahanay, na sumusunod sa kautusan,” ibig sabihin, namumuhay nang naaayon sa kautusan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους παραλαβὼν
  choice: Isama mo ang mga lalaking ito
  rationale: Ang παραλαμβάνω ay nangangahulugang isama o dalhin kasama. Idinagdag ang “mga lalaking” mula sa malinaw na konteksto ng apat na lalaki sa naunang talata.
- source_word: ἁγνίσθητι σὺν αὐτοῖς
  choice: maglinis ka ng iyong sarili kasama nila
  rationale: Tumutukoy ang ἁγνίζω sa rituwal na paglilinis. Pinananatili ng salin ang reflexive na diwa at ang pakikisama sa kanila nang hindi nilalagyan ng paliwanag na wala sa teksto.
- source_word: δαπάνησον ἐπ’ αὐτοῖς
  choice: sagutin mo ang kanilang mga gastos
  rationale: Ang δαπανάω na may ἐπί rito ay tumutukoy sa pagbabayad ng mga gastusin para sa kanila, malamang kaugnay ng kanilang panata.
- source_word: ἵνα ξυρήσονται τὴν κεφαλήν
  choice: upang makapag-ahit sila ng kanilang mga ulo
  rationale: Ipinahahayag ng ἵνα at ng pandiwang nasa future middle ang layunin o inaasahang bunga. Distributibo ang isahang “ulo” sa Griyego, kaya likas sa Filipino ang maramihang “kanilang mga ulo.”
- source_word: γνώσονται πάντες
  choice: Sa gayon, malalaman ng lahat
  rationale: Malinaw na hinaharap ang γνώσονται, at ipinakikita ng “Sa gayon” ang bunga ng naunang mga tagubilin.
- source_word: ὧν κατήχηνται περὶ σοῦ
  choice: ang mga ibinalita sa kanila tungkol sa iyo
  rationale: Maaaring mangahulugan ang κατηχέω ng turuan o ipaalam. Sa konteksto ng kumakalat na mga paratang, ang “ibinalita sa kanila” ay natural ngunit hindi ipinapalagay na pormal na pagtuturo ang tinutukoy.
- source_word: οὐδέν ἐστιν
  choice: walang katotohanan
  rationale: Ipinahahayag ng parirala na walang batayan o hindi totoo ang mga iniulat. Ang “walang katotohanan” ay malinaw at likas sa Filipino.
- source_word: ἀλλὰ στοιχεῖς
  choice: kundi ... namumuhay ... nang naaayon
  rationale: Ang στοιχέω ay literal na lumakad nang nakahanay at sa talinghagang gamit ay mamuhay o kumilos nang naaayon sa isang pamantayan.
- source_word: καὶ αὐτὸς
  choice: ikaw mismo ay ... rin
  rationale: Pinananatili ng “ikaw mismo” ang diin sa αὐτός at ng “rin” ang pandagdag na diwa ng καί.
- source_word: φυλάσσων τὸν νόμον
  choice: sa kautusan at sinusunod ito
  rationale: Ang φυλάσσω kasama ng νόμος ay nangangahulugang ingatan o sundin ang kautusan. Ang tahasang “sinusunod ito” ay nagpapanatili sa participle sa halip na lunukin ito sa salin ng στοιχεῖς.
- source_word: νόμον
  choice: ang kautusan
  rationale: Sa konteksto, tumutukoy ito sa kautusang Judio. Pinananatili ng “ang kautusan” ang kawalan ng karagdagang pantukoy na “ni Moises” sa mismong Griyego.
theological_decisions:
- issue: Ang kaugnayan ni Pablo sa kautusan sa salaysay na ito
  choice: “ikaw mismo ay namumuhay rin nang naaayon sa kautusan at sinusunod ito”
  alternative: “ikaw mismo ay tumutupad din sa kautusan”
  rationale: Inilalahad ng talata ang magiging pagkilala ng iba batay sa nakikitang kilos ni Pablo. Hindi nilulutas ng salin ang mas malawak na teolohikal na usapin tungkol sa kaugnayan ni Pablo sa kautusan at pinananatili ang agarang pahayag ng salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kautusan” para sa νόμος at pinanatili ang rituwal na diwa ng paglilinis. Ang parehong marker na [a] at [b] ay nasa pangunahing teksto.
