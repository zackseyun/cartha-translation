translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang kongkretong 'mga araw na iyon' at ang sunod-sunod na pagkilos. Ang mga marker na [a] at [b] ay kapwa nasa pangunahing teksto.
