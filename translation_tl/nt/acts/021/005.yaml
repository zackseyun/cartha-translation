  text: ὅτε δὲ ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας, ἐξελθόντες ἐπορευόμεθα προπεμπόντων ἡμᾶς πάντων σὺν γυναιξὶ καὶ τέκνοις ἕως ἔξω τῆς πόλεως, καὶ θέντες τὰ γόνατα ἐπὶ τὸν αἰγιαλὸν ⸀προσευξάμενοι
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/005.yaml
  text: When it came time for us to complete those days[a], we departed and went on our way, while they all, with wives and children, were accompanying us as far as outside the city. And after kneeling down on the beach[b], we prayed.
translation:
  language: tl
  text: Nang dumating ang panahon upang tapusin namin ang mga araw na iyon, umalis kami at nagpatuloy sa aming paglalakbay. Sumama sa amin ang lahat, kasama ang kanilang mga asawa at mga anak, hanggang sa labas ng lungsod.[a] Lumuhod kami sa dalampasigan[b] at nanalangin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sabay-sabay nila kaming inihatid sa aming pag-alis.” Ang pandiwang Griyego ay maaaring tumukoy sa pagsama sa isang umaalis bilang pamamaalam.
    reason: lexical_alternative
  - marker: b
    text: O “sa baybayin” o “sa tabing-dagat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας
  choice: dumating ang panahon para matapos namin ang mga araw na iyon
  rationale: Pinananatili nito ang pagdating ng takdang sandali na ipinahihiwatig ng ἐγένετο na may pawatas, pati ang ideya ng pagkumpleto sa itinakdang mga araw.
- source_word: ἐξελθόντες ἐπορευόμεθα
  choice: umalis kami at nagpatuloy sa aming paglalakbay
  rationale: Ipinapakita kapwa ang pag-alis at ang kasunod na nagpapatuloy na paglalakbay na taglay ng pandiwaring aorist at pandiwang imperfect.
- source_word: προπεμπόντων ἡμᾶς πάντων
  choice: Sinamahan kaming lahat ng mga mananampalataya
  rationale: Ang προπέμπω ay tumutukoy sa pagsama sa isang umaalis bilang pamamaalam. Idinagdag ang 'mga mananampalataya' bilang malinaw na kontekstuwal na pantukoy sa 'lahat,' nang hindi ipinahihiwatig na lahat ng mamamayan ang sumama.
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: kasama ang kanilang mga asawa at mga anak
  rationale: Sa konteksto ng maramihang panlalaking πάντων at ng mga sambahayang namamaalam, ang γυναιξίν ay likas na tumutukoy sa kanilang mga asawa.
- source_word: ἕως ἔξω τῆς πόλεως
  choice: hanggang sa labas ng lungsod
  rationale: Likas sa Tagalog at pinananatili ang diwa ng pagsama hanggang sa isang lugar sa labas ng hangganan ng lungsod.
- source_word: θέντες τὰ γόνατα
  choice: lumuhod kami
  rationale: Ito ang natural na salin ng idyomang literal na 'inilagay ang mga tuhod.'
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: sa dalampasigan
  rationale: Ang αἰγιαλός ay maaaring tumukoy sa dalampasigan, baybayin, o tabing-dagat; ang 'dalampasigan' ay malinaw at marangal sa modernong Tagalog.
- source_word: προσευξάμενοι
  choice: nanalangin
  rationale: Isinasalin nang natural bilang sunod na kilos sa salaysay. Sa gramatika, ang paksa ay ang pangkat na kinabibilangan ng tagapagsalaysay.
