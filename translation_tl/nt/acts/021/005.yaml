revisions:
- from: Nang dumating ang panahon para matapos namin ang mga araw na iyon, umalis kami at nagpatuloy sa aming paglalakbay. Sinamahan kaming lahat ng mga mananampalataya, kasama ang kanilang mga asawa at mga anak, hanggang sa labas ng lungsod.[a] Pagkatapos, lumuhod kami sa dalampasigan[b] at nanalangin.
  to: Nang dumating ang panahon upang tapusin namin ang mga araw na iyon, umalis kami at nagpatuloy sa aming paglalakbay. Sumama sa amin ang lahat, kasama ang kanilang mga asawa at mga anak, hanggang sa labas ng lungsod.[a] Lumuhod kami sa dalampasigan[b] at nanalangin.
  rationale: Inalis ang kontekstuwal ngunit hindi tahasang salitang “mga mananampalataya” upang hindi lumampas ang salin sa ipinahihiwatig ng πάντων. Inayos ang sugnay tungkol sa pagsama upang malinaw na ang “lahat” ang siyang sumama sa pangkat ng tagapagsalaysay. Pinanatili ang lahat ng iba pang kahulugan, ang sunod-sunod na kilos, at ang mga footnote anchor.
