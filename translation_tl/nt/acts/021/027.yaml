  source_fidelity: Kailangang linawin ang pagkakaugnay ng mga sugnay. Sa Griyego, ang mga Judiong mula sa Asia ang nakakita kay Pablo sa templo at pagkatapos ay ginulo ang karamihan at sapilitang hinawakan siya. Ang kasalukuyang unang pangungusap ay maaaring maunawaan, ngunit ang ayos na “sa templo ng mga Judiong” ay di-likas at maaaring magpahiwatig na ang templo ay pag-aari ng mga Judio mula sa Asia. Ang “dinakip” ay posible ngunit mas tiyak na pag-aresto kaysa sa malawak na idyomang Griyego; “sinunggaban” ay mas malapit sa sapilitang paghawak nang hindi nagdaragdag ng legal na kahulugan.
  naturalness: 'Mas natural at malinaw sa modernong Tagalog ang aktibong ayos: “nang makita ... si Pablo sa templo.” Ang “nagdulot ng kaguluhan sa buong karamihan” ay idiomatiko at pinananatili ang resultang diwa ng συνέχεον.'
