  text: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι, οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ συνέχεον πάντα τὸν ὄχλον καὶ ἐπέβαλον ⸂ἐπ’ αὐτὸν τὰς χεῖρας⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/027.yaml
  text: As the seven days were about to be completed[a], the Jews from Asia, seeing him in the temple, stirred up the whole crowd and laid hands on him[c][b],
translation:
  language: tl
  text: Nang malapit nang matapos ang pitong araw, nakita ng mga Judiong mula sa Asia si Pablo sa templo[c]. Nagdulot sila ng kaguluhan sa buong karamihan[a] at sinunggaban siya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inudyukan nila ang buong karamihan.” Maaaring idiin ng pandiwang Griego ang pag-uudyok sa karamihan o ang kaguluhang idinulot nito.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “inilapat nila sa kaniya ang kanilang mga kamay,” isang idyoma para sa sapilitang paghawak o pagsunggab sa isang tao.
    reason: lexical_alternative
  - marker: c
    text: Ang “templo” rito ay salin ng salitang Griego para sa buong kompleks o mga presinto ng templo, hindi lamang sa panloob na santuwaryo. Ang “Asia” ay tumutukoy sa Romanong lalawigan ng Asia.
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι
  choice: Nang malapit nang matapos ang pitong araw
  rationale: Likas na ipinapahayag sa Tagalog ang nalalapit na pagkumpleto ng takdang pitong araw nang hindi dinaragdagan ang konteksto.
- source_word: οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: mga Judiong mula sa Asia
  rationale: Ipinapakita ang pinagmulan nila at iniiwasang ipakahulugan ang Asia bilang buong makabagong kontinente; sa konteksto, ito ang Romanong lalawigan.
- source_word: θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ
  choice: nakita si Pablo sa templo
  rationale: Ginawang lantad ang tinutukoy ng panghalip upang maging malinaw at natural sa Tagalog. Ang ἱερόν ay tumutukoy sa buong kompleks ng templo.
- source_word: συνέχεον πάντα τὸν ὄχλον
  choice: Ginulo nila ang buong karamihan
  rationale: Maaaring tumukoy ang συγχέω sa paglikha ng kaguluhan o sa pag-uudyok; pinananatili ng “ginulo” ang diin sa pagkalito at kaguluhan ng karamihan.
- source_word: ἐπέβαλον ἐπ’ αὐτὸν τὰς χεῖρας
  choice: dinakip siya
  rationale: Ang literal na idyomang 'ipinatong ang mga kamay sa kaniya' ay nangangahulugang sapilitang paghawak o pagsunggab. Ang “dinakip” ay malinaw at natural sa modernong Tagalog.
