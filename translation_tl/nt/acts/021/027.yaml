translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Hinati sa dalawang pangungusap upang maiwasan ang mabigat na sunod-sunod na sugnay. Ginamit ang “Judiong” at “Asia” bilang pamilyar na anyo; nililinaw ng tala na ang templo ay ang buong kompleks.
