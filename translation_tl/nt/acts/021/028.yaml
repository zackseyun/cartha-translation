  naturalness: Natural at angkop sa modernong Filipino Tagalog ang pangunahing daloy. Ang “Mga lalaking Israelita” ay malinaw na pinananatili ang panlalaking bokatibo at katanggap-tanggap sa mariing pampublikong panawagan. Ang “nilapastangan” ay mas malinaw na naghahatid ng kultikong paglapastangan kaysa “dinungisan.”
  terminology: Ang “Kautusan” ay angkop para sa νόμος sa kontekstong ito. “Mga Griego” ay wastong tiyak na salin ng Ἕλληνας. Ang “templo” ay katanggap-tanggap para sa ἱερόν kung may talababa na nagsasaad na ang buong kompleks o mga looban, hindi lamang ang panloob na santuwaryo, ang saklaw.
