id: ACT.21.28
reference: Acts 21:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: κράζοντες· Ἄνδρες Ἰσραηλῖται, βοηθεῖτε· οὗτός ἐστιν ὁ ἄνθρωπος ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου πάντας ⸀πανταχῇ διδάσκων, ἔτι τε καὶ Ἕλληνας εἰσήγαγεν εἰς τὸ ἱερὸν καὶ κεκοίνωκεν τὸν ἅγιον τόπον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/028.yaml
  text: shouting[a], “Men of Israel, help! This is the man who teaches everyone everywhere against the people and the law and this place. And besides that, he has even brought Greeks into the temple and has defiled this holy place.”
translation:
  language: tl
  text: na sumisigaw, “Mga lalaking Israelita, tumulong kayo! Ito ang taong nagtuturo sa lahat ng tao sa lahat ng dako laban sa bayan, sa Kautusan, at sa lugar na ito. Bukod pa roon, nagpasok pa siya ng mga Griego sa templo[a] at nilapastangan ang banal na lugar na ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego na ἱερόν ay tumutukoy sa buong kompleks o mga looban ng templo, hindi lamang sa panloob na santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράζοντες
  choice: na sumisigaw
  rationale: Ang kasalukuyang participle ay nagsasaad kung paano nila ibinulalas ang paratang; natural at malinaw sa modernong Tagalog ang “na sumisigaw.”
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Mga lalaking Israelita
  rationale: Pinananatili nito ang tahasang panlalaking anyo ng bokatibo habang nananatiling malinaw sa Tagalog.
- source_word: βοηθεῖτε
  choice: tumulong kayo!
  rationale: Tuwirang pautos na sigaw para sa saklolo; hindi idinagdag ang di-tahasang “sa amin.”
- source_word: οὗτός ἐστιν ὁ ἄνθρωπος
  choice: Ito ang taong
  rationale: Natural na pagkakakilanlang pahayag sa Tagalog at pinananatili ang mariing paratang.
- source_word: ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου
  choice: laban sa ating bayan, sa Kautusan, at sa lugar na ito
  rationale: Ang κατά na may genitive ay nagpapahiwatig ng pagsalungat. Ang “ating bayan” ay likas na tumutukoy sa bayang Israel sa sigaw ng mga Israelita; ang “Kautusan” ay tumutukoy sa Kautusan ni Moises.
- source_word: πάντας πανταχῇ διδάσκων
  choice: nagtuturo sa lahat ng tao sa lahat ng dako
  rationale: Pinananatili ang dalawang malawak na saklaw—πάντας at πανταχῇ—sa malinaw at natural na Tagalog.
- source_word: ἔτι τε καὶ
  choice: Bukod pa roon ... pa
  rationale: Ipinahahayag ang tumitinding, karagdagang paratang; ang ikalawang “pa” ay likas na diin sa Tagalog.
- source_word: Ἕλληνας
  choice: mga Griego
  rationale: Tiyak na “mga Griego” ang leksikal na kahulugan, hindi ang mas malawak na “mga Hentil.”
- source_word: εἰσήγαγεν εἰς τὸ ἱερὸν
  choice: nagpasok ... sa templo
  rationale: Natural sa Tagalog ang “nagpasok”; ang ἱερόν ay isinaling “templo” sa teksto, na may talababa upang linawin na buong kompleks o mga looban ang tinutukoy.
- source_word: κεκοίνωκεν
  choice: dinungisan niya
  rationale: Sa kontekstong ritwal, ang κοινόω ay nangangahulugang gawing marumi o lapastangan; malinaw at dignificado ang “dinungisan.”
- source_word: τὸν ἅγιον τόπον τοῦτον
  choice: ang banal na lugar na ito
  rationale: Tuwirang pinananatili ang kabanalan at demonstratibong diin ng parirala.
theological_decisions:
- issue: Tinutukoy ng τοῦ νόμου
  choice: “Kautusan,” na may malaking titik, bilang Kautusan ni Moises
  alternative: “kautusan” o “batas” bilang mas pangkalahatang sanggunian
  rationale: Sa konteksto ng Jerusalem at ng templo, ang paratang ay tungkol sa Kautusang Judio; nililinaw ng malaking titik ang reperensiya nang hindi nagdaragdag ng doktrina.
- issue: Saklaw ng ἱερόν
  choice: “templo” sa pangunahing teksto, na may talababa tungkol sa kompleks o mga looban ng templo
  alternative: “mga looban ng templo” sa pangunahing teksto
  rationale: Mas natural ang “templo” sa daloy ng Tagalog, ngunit mahalagang panatilihin sa talababa ang pagkakaiba nito sa salitang tumutukoy nang mas tiyak sa panloob na santuwaryo.
- issue: Pagdaragdag ng “ating” sa “bayan”
  choice: “ating bayan”
  alternative: “bayan” o “mga tao”
  rationale: Ang τοῦ λαοῦ ay tumutukoy sa bayang Israel sa tuwirang panawagang “Mga lalaking Israelita”; ginagawang likas at malinaw ng “ating” ang kontekstuwal na reperensiya nang hindi binabago ang saklaw ng paratang.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Pinanatili ang mariing, pampublikong tono ng paratang, ang panlalaking bokatibo, at ang tatluhang ayos na “bayan—Kautusan—lugar.”
