  yaml_path: translation/nt/acts/021/006.yaml
  text: After we had said farewell to one another[a], we boarded the ship[b], and they returned to their own homes.
translation:
  language: tl
  text: Pagkatapos naming magpaalam sa isa’t isa[a], sumakay kami sa barko, at bumalik sila sa kani-kanilang tahanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagpaalaman kami.” Maaari ring tumukoy ang pananalitang Griyego sa pagbati, ngunit pinapaboran ng konteksto ng pag-alis ang diwa ng pamamaalam.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa mga sariling bagay/lugar nila,” isang idyomang maaaring mangahulugang “sa kani-kanilang tahanan” o “sa sarili nilang lugar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπησπασάμεθα ἀλλήλους
  choice: magpaalam sa isa’t isa
  rationale: Maaaring tumukoy ang pandiwang Griyego sa pagbati o pamamaalam, ngunit malinaw na pamamaalam ang ipinahihiwatig ng konteksto ng kanilang pag-alis. Likas at magkatumbas ang “sa isa’t isa” para sa reciprocal na ἀλλήλους.
- source_word: ἐνέβημεν
  choice: sumakay kami
  rationale: Sa konteksto ng paglalayag, nangangahulugan itong pumasok o sumakay sa isang sasakyang-dagat. Karaniwan at malinaw sa modernong Filipino ang “sumakay.”
- source_word: πλοῖον
  choice: barko
  rationale: Maaaring tumukoy ang salita sa bangka o barko; ang “barko” ay angkop sa salaysay ng paglalakbay sa dagat at likas na katambal ng “sumakay.”
- source_word: ὑπέστρεψαν
  choice: umuwi naman sila
  rationale: Pangunahing diwa nito ang pagbabalik. Dahil ang patutunguhan ay ang kani-kanilang tahanan, natural na ipinahahayag sa Filipino ang kilos bilang “umuwi”; ipinakikita ng “naman” ang paghahambing ng kanilang direksiyon sa pagsakay ng mga tagapagsalaysay.
- source_word: εἰς τὰ ἴδια
  choice: sa kani-kanilang tahanan
  rationale: Idyoma ito para sa sariling lugar, tahanan, o mga pag-aari. Ang “kani-kanilang tahanan” ay malinaw at natural habang kinikilala sa talababa ang mas literal at mas malawak na kahulugan.
