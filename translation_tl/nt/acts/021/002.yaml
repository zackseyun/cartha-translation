  yaml_path: translation/nt/acts/021/002.yaml
  text: And after finding a ship crossing over to Phoenicia[a], we went aboard and set sail.
translation:
  language: tl
  text: Nang makahanap kami ng isang barkong tatawid patungong Fenicia[a], sumakay kami rito at naglayag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “barkong patungo sa Fenicia.” Literal na inilalarawan ng Griego ang isang barkong “tumatawid patungong Fenicia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρόντες
  choice: nang makakita kami
  rationale: Ipinahahayag ng aorist participle ang kilos na nauna sa pagsakay at paglayag; natural sa Tagalog ang temporal na sugnay na “nang makakita kami.”
- source_word: πλοῖον
  choice: barko
  rationale: Karaniwang salitang Tagalog para sa sasakyang-dagat na angkop sa paglalakbay sa Mediteraneo.
- source_word: διαπερῶν
  choice: tatawid
  rationale: Pinananatili ang pandiwang diwa ng pagtawid sa dagat at likas na inilalarawan ang nakatakdang biyahe ng barko.
- source_word: εἰς Φοινίκην
  choice: patungong Fenicia
  rationale: Malinaw na ipinahahayag ang destinasyong tinutukoy ng εἰς, sa natural na modernong Tagalog.
- source_word: ἐπιβάντες
  choice: sumakay kami
  rationale: Sa kontekstong pandagat, tumutukoy ito sa pagsakay sa barko; ang tahasang pandiwa ay malinaw at natural sa Tagalog.
- source_word: ἀνήχθημεν
  choice: naglayag
  rationale: Ang pandagat na gamit ng ἀνάγω ay pagputok o pag-alis patungong dagat; maikli at likas ang “naglayag” sa salaysay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “barko” at “naglayag” bilang mga karaniwang terminong pandagat, at pinanatili sa talababa ang bahagyang pagkakaiba ng literal na “tumatawid” at idyomatikong “patungo.”
