  text: ὅτε δὲ ἐγένετο ἐπὶ τοὺς ἀναβαθμούς, συνέβη βαστάζεσθαι αὐτὸν ὑπὸ τῶν στρατιωτῶν διὰ τὴν βίαν τοῦ ὄχλου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/035.yaml
  text: When he came to the steps[a], it happened that he was being carried by the soldiers because of the violence of the crowd[b],
translation:
  language: tl
  text: Nang makarating siya sa mga baitang[a], kinailangang buhatin siya ng mga kawal dahil sa karahasan ng karamihan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga baitang” ay malamang na hagdanang paakyat sa kuwartel ng mga Romano (tingnan ang Mga Gawa 21:34, 37).
    reason: cross_reference
  - marker: b
    text: Maaari ring isalin, “binubuhat siya ng mga kawal.” Maaaring idiin ng pananalitang Griyego ang pangyayaring siya ay binubuhat, samantalang ang pangangailangan ay ipinahihiwatig ng karahasan ng karamihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Nang
  rationale: Ipinakikilala nito ang sugnay na temporal. Mahina lamang ang pag-uugnay ng δέ, kaya likas na hindi na ito kailangang ilantad sa Filipino.
- source_word: ἐγένετο ἐπὶ τοὺς ἀναβαθμούς
  choice: makarating siya sa mga baitang
  rationale: Ang γίνομαι na may ἐπί at akusatibo ay idyomatikong tumutukoy sa pagdating o pag-abot sa isang lugar. Ang ayos na ito ay malinaw at natural sa Filipino.
- source_word: ἀναβαθμούς
  choice: mga baitang
  rationale: Tumutukoy ang salita sa mga baytang o hagdan paakyat. Pinananatili ng “mga baitang” ang kongkretong larawan ng teksto nang hindi dinaragdagan ang lokasyon sa pangunahing salin.
- source_word: συνέβη βαστάζεσθαι
  choice: binubuhat siya
  rationale: Pinananatili ng aspektong nagaganap at ng tinig na balintiyak ang larawan na kasalukuyan siyang dinadala ng mga kawal. Hindi na isinalin nang hiwalay ang συνέβη sapagkat magiging mabigat at di-likas ang “nangyaring binubuhat” sa modernong Filipino; ang resulta ay malinaw na sa daloy ng pangungusap.
- source_word: ὑπὸ τῶν στρατιωτῶν
  choice: ng mga kawal
  rationale: Tuwirang ipinapahayag nito ang gumaganap sa kilos na balintiyak. Ang “kawal” ay dignified at karaniwang salin ng στρατιώτης.
- source_word: διὰ τὴν βίαν τοῦ ὄχλου
  choice: dahil sa karahasan ng mga tao
  rationale: Ang διά na may akusatibo ay nagpapahayag ng sanhi, at ang βία ay tumutukoy sa marahas na puwersa. Ang “mga tao” ay natural na tumutukoy sa nagkakatipong karamihan sa konteksto nang idagdag ang mas mapanghusgang “mandurumog.”
