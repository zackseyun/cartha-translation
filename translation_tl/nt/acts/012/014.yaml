  text: καὶ ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου ἀπὸ τῆς χαρᾶς οὐκ ἤνοιξεν τὸν πυλῶνα, εἰσδραμοῦσα δὲ ἀπήγγειλεν ἑστάναι τὸν Πέτρον πρὸ τοῦ πυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/014.yaml
  text: And when she recognized Peter’s voice[a], because of her joy she did not open the gate[b], but ran in and reported that Peter was standing at the gate.
translation:
  language: tl
  text: Nang makilala niya ang boses ni Pedro, dahil sa tuwa ay hindi niya binuksan ang pintuang-daan[a]. Sa halip, tumakbo siya papasok at ibinalitang nakatayo si Pedro sa harap ng pintuang-daan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tarangkahan,” “pasukan,” o “panlabas na pinto.” Ang salitang Griego na πυλών ay tumutukoy sa pasukan mula sa lansangan papasok sa bakuran o bahay.
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “ibinalitang si Pedro ay nakatayo sa harap ng pintuang-daan.”'
    reason: literal_rendering
lexical_decisions:
- source_word: ἐπιγνοῦσα
  choice: Nang makilala niya
  rationale: Ipinahahayag ng aorist participle ang pagkilala niya sa tinig nang marinig niya ito; natural sa Filipino ang sugnay na “Nang makilala niya.”
- source_word: τὴν φωνὴν τοῦ Πέτρου
  choice: ang boses ni Pedro
  rationale: Sa konteksto ng pagkilala sa nagsasalita sa labas, “boses” ang pinakanatural at tiyak na katumbas ng φωνή sa modernong Filipino.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: sa tindi ng tuwa
  rationale: Ang parirala ay nagsasaad ng sanhi. Ipinakikita ng “sa tindi ng tuwa” na ang labis na galak ang dahilan kaya hindi agad niya nabuksan ang pasukan.
- source_word: οὐκ ἤνοιξεν
  choice: hindi niya binuksan
  rationale: Tuwirang katumbas ito ng ἀνοίγω at hindi nagdaragdag ng di-tiyak na ideya gaya ng pag-aalis ng kandado.
- source_word: τὸν πυλῶνα / τοῦ πυλῶνος
  choice: pintuang-daan
  rationale: Ang πυλών ay panlabas na pasukan mula sa lansangan patungo sa bakuran o bahay. Mas malinaw sa karaniwang mambabasa ang “pintuang-daan” kaysa sa simpleng “pinto,” at hindi nito ipinapalagay na rehas na tarangkahan iyon.
- source_word: εἰσδραμοῦσα
  choice: tumakbo siya papasok
  rationale: Pinananatili nito ang mabilis na pagkilos papaloob at ang masiglang takbo ng salaysay.
- source_word: ἀπήγγειλεν
  choice: ibinalita
  rationale: Ang ἀπαγγέλλω ay nangangahulugang mag-ulat o magpahayag. Ang “ibinalita” ay natural sa eksenang masayang ipinahayag niya sa mga nasa loob ang pagdating ni Pedro.
- source_word: ἑστάναι
  choice: nakatayo
  rationale: 'Ang perfect infinitive ay may statibong diwa: naroon si Pedro at nananatiling nakatayo sa labas.'
- source_word: πρὸ τοῦ πυλῶνος
  choice: sa harap ng pintuang-daan
  rationale: Tuwirang pinananatili nito ang lokasyong ipinahahayag ng πρό na may genitive, sa halip na gawing mas malabong “nasa pintuan.”
theological_decisions: []
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang “boses” bilang karaniwang salita sa modernong Tagalog at “pintuang-daan” upang linawin ang uri ng panlabas na pasukan. Pinanatili ang bahagyang nakatatawang pagmamadali sa salaysay: dahil sa labis na tuwa, iniwan muna niyang nakatayo si Pedro sa labas.'
