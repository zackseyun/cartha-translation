id: ACT.12.3
reference: Acts 12:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂ἰδὼν δὲ⸃ ὅτι ἀρεστόν ἐστιν τοῖς Ἰουδαίοις προσέθετο συλλαβεῖν καὶ Πέτρον (ἦσαν ⸀δὲ ἡμέραι τῶν ἀζύμων),
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/003.yaml
  text: And when he saw that it was pleasing to the Jews[a], he proceeded to arrest Peter also[b]. (Now these were the days of Unleavened Bread.)
translation:
  language: tl
  text: Nang makita niyang ikinalulugod iyon ng mga Judio[a], ipinadakip din niya si Pedro. (Nang panahong iyon ay mga araw ng Tinapay na Walang Pampaalsa.[b])
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Judeano,” o, kung lilimitahan ayon sa konteksto, “mga pinunong Judio.” Maaaring taglayin ng salitang Griyego ang mga kahulugang ito sa ilang konteksto, ngunit “mga Judio” lamang ang tahasang sinasabi rito.
    reason: lexical_alternative
  - marker: b
    text: Ito ang panahon ng kapistahan kasunod ng Paskuwa, kung kailan kumakain ng tinapay na walang pampaalsa.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Nang makita niya
  rationale: Itinuturing ang aorist participle bilang temporal na pangyayari bago ang sumunod na kilos ni Herodes; natural at malinaw ito sa modernong Tagalog.
- source_word: ἀρεστόν ἐστιν
  choice: ikinalulugod iyon
  rationale: Ipinahahayag nito na ang naunang ginawa ni Herodes ay kasiya-siya o kalugod-lugod sa tinutukoy na pangkat, nang hindi dinaragdagan ang dahilan ng kanilang pagsang-ayon.
- source_word: τοῖς Ἰουδαίοις
  choice: ng mga Judio
  rationale: Pinananatili ang tahasang malawak na katawagan ng Griyego. Hindi ito kusang nililimitahan sa mga pinuno o sa mga taga-Judea lamang.
- source_word: προσέθετο συλλαβεῖν
  choice: ipinadakip din niya
  rationale: Ang προστίθημι na may infinitive ay idyomang nagsasaad ng pagdaragdag o pagpapatuloy sa isa pang kilos. Likas na naihahayag sa Tagalog ng pandiwang ipinadakip kasama ng additive na “din.”
- source_word: καὶ Πέτρον
  choice: din niya si Pedro
  rationale: Ang “din” ay nagpapanatili sa diwang si Pedro ay idinagdag bilang isa pang pinuntirya matapos si Santiago.
- source_word: ἦσαν δὲ ἡμέραι τῶν ἀζύμων
  choice: Nang panahong iyon ay mga araw ng Tinapay na Walang Pampaalsa
  rationale: Pinananatili ang temporal na paliwanag at ang tiyak na katawagan sa kapistahan sa halip na palitan ito ng Paskuwa.
theological_decisions:
- issue: Saklaw ng Ἰουδαίοις sa salaysay ng Mga Gawa
  choice: mga Judio
  alternative: mga Judeano; mga pinunong Judio
  rationale: Hindi tahasang nililimitahan ng talata ang tinutukoy sa heograpikong pangkat o sa mga pinuno. Pinananatili ng salin ang leksikal na lawak at inilalagay sa talababa ang mga posibleng pagbasa ayon sa konteksto.
- issue: Pagpapangalan sa τῶν ἀζύμων
  choice: mga araw ng Tinapay na Walang Pampaalsa
  alternative: Paskuwa; Kapistahan ng Tinapay na Walang Pampaalsa
  rationale: Tinukoy ng Griyego ang mga araw ng Tinapay na Walang Pampaalsa, hindi lamang ang Paskuwa. Pinananatili ang pagkakaiba ng magkaugnay na mga pagdiriwang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal ang ginamit. Pinili ang “ipinadakip” bilang natural na paglalarawan sa kilos ng isang pinunong nagpapakilos sa kanyang mga tauhan. Nananatili ang panaklong ng tekstong Griyego bilang paliwanag sa panahon, at inilagay ang talababa [b] sa mismong katawagang ipinaliliwanag nito.
