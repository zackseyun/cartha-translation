    issue: “Pinto ng pasukan” para sa θύραν τοῦ πυλῶνος
    rationale: Ang πυλών ay hindi lamang pangkalahatang pasukan kundi isang tarangkahan/gateway o panlabas na entrada. Mas napapanatili ng “pinto ng tarangkahan” ang dalawang pangngalan ng Griyego.
  - severity: low
    issue: “Alilang babae”
    rationale: Bagaman maiintindihan, hindi ito ang karaniwang natural na anyo sa modernong Filipino para sa isang babaeng nasa katayuang alipin. Mas idiomatiko ang “aliping babae.”
  - severity: low
    issue: Ayos ng pangungusap
    rationale: Ang paglalagay ng paksa bago ng pariralang layon ay nagpapalinaw kung sino ang lumapit at tumugon.
