  yaml_path: translation/nt/acts/012/013.yaml
  text: When he knocked at the door of the gateway[a], a servant girl named Rhoda came to answer.
translation:
  language: tl
  text: Nang kumatok siya sa pinto ng tarangkahan, lumapit ang isang aliping babae[a] na nagngangalang Roda upang tumugon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “babaeng lingkod.” Ang salitang Griego na παιδίσκη ay maaaring tumukoy sa isang batang babaeng lingkod o alipin.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρούσαντος δὲ αὐτοῦ
  choice: Nang kumatok siya
  rationale: Ipinahahayag ng aorist participle kasama ng δέ ang kasunod na pangyayari. Likas sa salaysay na Tagalog ang “Nang kumatok siya” at napapanatili nito ang temporal na ugnayan.
- source_word: θύραν τοῦ πυλῶνος
  choice: pinto ng pasukan
  rationale: Pinananatili ng “pinto” ang θύρα, samantalang ang “pasukan” ay natural na katumbas ng πυλών bilang panlabas na entrada o bahaging pasukan ng bahay.
- source_word: προσῆλθε
  choice: lumapit
  rationale: Ang προσέρχομαι ay nangangahulugang lumapit o pumaroon. Ang “lumapit” ay malinaw at akma sa pagkilos patungo sa pinto.
- source_word: παιδίσκη
  choice: alilang babae
  rationale: Maaaring tumukoy ang παιδίσκη sa isang batang babaeng lingkod o alipin. Ang “alilang babae” ay maikli, dignificado, at hindi nagpapasya nang higit sa ipinahihintulot ng konteksto tungkol sa eksaktong legal na katayuan niya.
- source_word: ὑπακοῦσαι
  choice: upang sumagot
  rationale: Bagaman maaari itong mangahulugang makinig o tumalima, sa konteksto ng pagkatok sa pinto ay idyomatiko itong tumutukoy sa pagtugon sa kumakatok.
- source_word: ὀνόματι Ῥόδη
  choice: na nagngangalang Roda
  rationale: Natural na Filipino ang “na nagngangalang” sa pagpapakilala ng pangalan. Isinalin sa karaniwang baybay-Filipino ang personal na pangalang Ῥόδη bilang “Roda.”
