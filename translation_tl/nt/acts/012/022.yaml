  text: ὁ δὲ δῆμος ἐπεφώνει· ⸂Θεοῦ φωνὴ⸃ καὶ οὐκ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/022.yaml
  text: And the crowd kept shouting[a], “The voice of a god, and not of a man!”
translation:
  language: tl
  text: Ngunit ang madla ay paulit-ulit na sumigaw, “Tinig ng isang diyos[a], hindi ng tao!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Tinig ng Diyos, hindi ng tao!” Posible ang saling ito batay sa Griyego, ngunit sa konteksto, mas malamang na “ng isang diyos” ang diwa, bilang paganong pagbubunyi kay Herodes.
    reason: alternative_reading
lexical_decisions:
- source_word: δῆμος
  choice: ang madla
  rationale: Tumutukoy ito sa nagkakatipong publiko sa tagpo, hindi sa isang pormal na lupon. Ang “madla” ay maikli, natural, at angkop sa pampublikong pagbubunyi.
- source_word: ἐπεφώνει
  choice: patuloy na sumisigaw
  rationale: Ipinahihiwatig ng imperpektong anyo ang nagpapatuloy o paulit-ulit na pagsigaw, hindi lamang isang minsanang sigaw.
- source_word: Θεοῦ
  choice: ng isang diyos
  rationale: Sa konteksto ng paganong pagbubunyi kay Herodes, malamang na pangkalahatang pagturing sa isang diyos ang diwa. Pinananatili rin nito ang pangngalang anyo at ang tuwirang paghahambing sa tao.
- source_word: φωνὴ
  choice: Tinig ito
  rationale: Pinananatili ng “tinig” ang tuwirang kahulugan ng φωνή. Idinagdag ang “ito” upang maging natural sa Tagalog ang walang pandiwang bulalas sa Griyego.
- source_word: ἀνθρώπου
  choice: ng tao
  rationale: Pinananatili nito ang tuwirang pagsalungat sa “ng isang diyos.” Sa Tagalog, mas likas ang pangkalahatang “ng tao” kaysa “ng isang tao” sa ganitong bulalas.
theological_decisions:
- issue: Kung ang Θεοῦ ay isasaling “ng Diyos” o “ng isang diyos”
  choice: ng isang diyos
  alternative: ng Diyos
  rationale: Ang mga nagsasalita ay isang paganong madlang nagbibigay kay Herodes ng karangalang ukol sa diyos, at walang pantukoy ang θεοῦ. Ang “ng isang diyos” ang mas malinaw na kumakatawan sa makasaysayan at panrelihiyong konteksto nang hindi ipinapalagay na tinutukoy nila ang Diyos ng Israel. Gayunman, tunay na posible sa anyong Griyego ang “ng Diyos,” kaya inilagay ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “madla” para sa pampublikong pagtitipon at “patuloy na sumisigaw” upang maipakita ang aspektong imperpektibo. Pinanatili ang mas malamang na paganong diwa habang itinala sa talababa ang tunay na alternatibong pagbasa.
