  terminology: Ang “anghel” ay angkop para sa ἄγγελος sa kontekstong ito. Ang “anghel niya” ay dapat manatiling hindi pinalalawak sa pangunahing teksto. Ang talababa ay angkop na naglalahad ng mga posibleng pakahulugan nang hindi itinatanghal ang alinman bilang tiyak.
