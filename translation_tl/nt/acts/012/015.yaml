base_translation:
  language: en
  yaml_path: translation/nt/acts/012/015.yaml
  text: But they said to her[a], “You are out of your mind.” But she kept insisting that it was so. And they kept saying, “It is his angel.”
translation:
  language: tl
  text: Ngunit sinabi nila sa kanya, “Nababaliw ka!” Ngunit patuloy niyang iginiit na ganoon nga. Ngunit paulit-ulit nilang sinasabi, “Ang anghel niya iyon.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Posible ring unawain bilang “anghel na tagapagbantay niya,” “anghel na kinatawan niya,” o, ayon sa ilang tagapagpaliwanag, “espiritu o multo niya.” Ang literal na sinasabi ng Griyego ay “anghel niya.”
    reason: alternative_reading
lexical_decisions:
- source_word: Μαίνῃ
  choice: Nababaliw ka
  rationale: Likas at tuwirang modernong Tagalog para sa idyomatikong paratang na wala siya sa tamang pag-iisip; pinananatili ang tindi nang hindi gumagamit ng klinikal na pananalita.
- source_word: διϊσχυρίζετο
  choice: patuloy niyang iginiit
  rationale: Ipinahahayag ng imperfect ang nagpapatuloy na mariing paggigiit.
- source_word: οὕτως ἔχειν
  choice: na totoo iyon
  rationale: Natural na Tagalog para sa idyomang nangangahulugang gayon nga ang kalagayan o tama ang kanyang sinabi.
- source_word: ἔλεγον
  choice: paulit-ulit nilang sinabi
  rationale: Ipinakikita ang nagpapatuloy o inuulit na pagsasalita na ipinahihiwatig ng imperfect.
- source_word: ἄγγελός
  choice: anghel
  rationale: Sa konteksto, malamang na isang makalangit na nilalang ang tinutukoy; ito rin ang karaniwan at tuwirang katumbas nang hindi dinaragdagan ang kahulugan.
- source_word: αὐτοῦ
  choice: niya
  rationale: Natural na Tagalog na anyong paari sa pariralang 'anghel niya.'
theological_decisions:
- issue: Kahulugan ng “anghel niya”
  choice: Isinalin nang tuwiran bilang “anghel niya.”
  alternative: Anghel na tagapagbantay niya; anghel na kinatawan niya; espiritu o multo niya.
  rationale: Ang Griyego ay nagsasabi lamang ng 'anghel niya' at hindi nililinaw ang paniniwalang nasa likod ng pahayag. Pinananatili ng tuwirang salin ang teolohikal na tensiyon at iniiwasang ipasok ang isang tiyak na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang 'patuloy' at 'paulit-ulit' upang maipakita ang duratibo o iteratibong puwersa ng mga imperfect na pandiwa. Inilagay ang talababa pagkatapos mismo ng malabong pariralang tinatalakay nito.
