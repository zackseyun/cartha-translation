  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἡρῴδης δὲ ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν ἀνακρίνας τοὺς φύλακας ἐκέλευσεν ἀπαχθῆναι, καὶ κατελθὼν ἀπὸ τῆς Ἰουδαίας ⸀εἰς Καισάρειαν διέτριβεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/019.yaml
  text: But Herod[a], after searching for him and not finding him, examined the guards and ordered them to be led away to execution. Then he went down from Judea to Caesarea and stayed there.
translation:
  language: tl
  text: Ngunit hinanap siya ni Herodes, ngunit hindi niya siya natagpuan. Matapos niyang siyasatin ang mga bantay, iniutos niyang dalhin sila upang patayin.[a] Pagkatapos, bumaba siya mula sa Judea patungong Cesarea at nanatili roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “iniutos niyang dalhin sila.” Sa kontekstong ito, malamang na dinala sila upang patayin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιζητήσας
  choice: hinanap siya
  rationale: Ipinahihiwatig ng aorist participle ang naunang masusing paghahanap kay Pedro; natural at malinaw sa Tagalog ang “hinanap siya” nang hindi dinaragdagan ang tindi.
- source_word: μὴ εὑρὼν
  choice: hindi siya natagpuan
  rationale: Pinananatili nito ang negatibong resulta ng paghahanap at ang pagkakasunod-sunod ng mga pangyayari.
- source_word: ἀνακρίνας
  choice: matapos siyasatin
  rationale: Ang ἀνακρίνω ay maaaring tumukoy sa pormal na pagsusuri o pagtatanong. Saklaw ng “siyasatin” ang opisyal na pag-usisa nang hindi labis na nililimitahan sa berbal na interogasyon.
- source_word: τοὺς φύλακας
  choice: ang mga bantay
  rationale: Karaniwan at malinaw na tawag sa mga inatasang magbantay kay Pedro.
- source_word: ἐκέλευσεν ἀπαχθῆναι
  choice: iniutos niyang dalhin sila upang patayin
  rationale: Literal na nangangahulugan ang ἀπαχθῆναι na dalhin o ilayo, ngunit sa kontekstong legal at pampamahalaan ay malamang na pagdadala sa mga bantay upang bitayin o patayin. Nililinaw ng salin ang ipinahihiwatig na kahihinatnan habang inilalagay sa talababa ang literal na anyo.
- source_word: κατελθὼν
  choice: bumaba siya
  rationale: Pinananatili ang heograpikong pananalita tungkol sa paglalakbay mula sa Judea patungo sa baybaying Cesarea.
- source_word: ἀπὸ τῆς Ἰουδαίας εἰς Καισάρειαν
  choice: mula sa Judea patungong Cesarea
  rationale: Direkta at likas na paglalarawan ng pinagmulan at destinasyon; ginagamit ang nakaugaliang modernong anyong Filipino ng mga pangalang pook.
- source_word: διέτριβεν
  choice: nanatili roon
  rationale: Ipinakikita ng imperfect ang nagpapatuloy na pananatili; natural itong ipinahahayag ng “nanatili roon.”
theological_decisions:
- issue: Kung literal lamang bang isasalin ang ἀπαχθῆναι bilang “dalhin” o lilinawin ang ipinahihiwatig na pagpatay
  choice: iniutos niyang dalhin sila upang patayin
  alternative: iniutos niyang dalhin sila
  rationale: Hindi tahasang gumamit ang Griyego ng pandiwang “patayin,” kaya may tunay na antas ng pagpapahiwatig. Gayunman, sa konteksto ng kaparusahan sa mga bantay na nawalan ng bilanggo, malamang na tumutukoy ito sa pagdadala upang patayin. Pinagsasama ng pangunahing salin at talababa ang malinaw na diwa at ang literal na pagkakabuo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “siyasatin” para sa pormal na pag-usisa, at “Cesarea” bilang karaniwang anyong Filipino ng Caesarea. Maikli ang mga pangungusap upang maging madaling sundan ang sunod-sunod na kilos.
