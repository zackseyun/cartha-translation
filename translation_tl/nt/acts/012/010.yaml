id: ACT.12.10
reference: Acts 12:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διελθόντες δὲ πρώτην φυλακὴν καὶ δευτέραν ἦλθαν ἐπὶ τὴν πύλην τὴν σιδηρᾶν τὴν φέρουσαν εἰς τὴν πόλιν, ἥτις αὐτομάτη ἠνοίγη αὐτοῖς, καὶ ἐξελθόντες προῆλθον ῥύμην μίαν, καὶ εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/010.yaml
  text: After they had passed the first guard and the second[a], they came to the iron gate leading into the city, which opened to them by itself; and after they went out, they went along one street[b], and immediately the angel departed from him.
translation:
  language: tl
  text: Pagkalampas nila sa una at ikalawang himpilan ng mga bantay, nakarating sila sa pintuang bakal na papasok sa lungsod. Kusang bumukas iyon para sa kanila[a]. Pagkalabas nila, nagpatuloy sila sa isang lansangan[b], at agad na umalis sa kaniya ang anghel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bumukas iyon nang kusa para sa kanila.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring ang ibig sabihin ay nagpatuloy sila nang layong katumbas ng isang lansangan bago umalis ang anghel.
    reason: cultural_note
lexical_decisions:
- source_word: διελθόντες
  choice: Pagkalampas nila
  rationale: Ipinahihiwatig ng aorist participle na natapos muna ang pagdaan bago sila nakarating sa pintuan; natural na naipapakita ito ng “Pagkalampas nila.”
- source_word: φυλακὴν
  choice: himpilan ng mga bantay
  rationale: Sa konteksto, tumutukoy ito sa sunod-sunod na lugar o pangkat ng pagbabantay na nilampasan nila, hindi sa magkahiwalay na bilangguan.
- source_word: πύλην τὴν σιδηρᾶν
  choice: pintuang bakal
  rationale: Tuwirang pinananatili ang diin sa materyal ng pintuan sa natural na ayos ng Filipino.
- source_word: τὴν φέρουσαν εἰς τὴν πόλιν
  choice: na patungo sa lungsod
  rationale: Ipinapahayag ng participle ang daanang ibinibigay ng pintuan papasok sa lungsod.
- source_word: αὐτομάτη
  choice: Kusang
  rationale: Natural itong nagpapahayag na bumukas ang pintuan nang walang taong nagbukas, nang hindi nagdadala ng makabagong mekanikal na pahiwatig ng “awtomatiko.”
- source_word: ἐξελθόντες
  choice: Pagkalabas nila
  rationale: Malinaw na inilalahad ang kasunod na natapos na kilos sa pagkakasunod-sunod ng salaysay.
- source_word: προῆλθον ῥύμην μίαν
  choice: nagpatuloy sila sa isang lansangan
  rationale: Pinananatili ang payak at bahagyang malabong pahayag ng Griyego kung ito ba ay tumutukoy sa isang partikular na lansangan o sa layong katumbas ng isang lansangan.
- source_word: εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ
  choice: agad na umalis sa kaniya ang anghel
  rationale: Tumpak na ipinapakita ang biglang paghihiwalay ng anghel kay Pedro nang hindi dinaragdagan kung paano ito nangyari.
theological_decisions:
- issue: Paraan ng pagbukas ng pintuan
  choice: Kusang bumukas iyon para sa kanila
  alternative: Awtomatikong bumukas iyon para sa kanila
  rationale: Inilalahad ng teksto ang pambihirang pangyayari ngunit hindi ipinaliliwanag ang mekanismo nito. Iniiwasan ng “kusang” ang makabagong pahiwatig ng pintuang may awtomatikong aparato.
- issue: Kahulugan ng φυλακή
  choice: una at ikalawang himpilan ng mga bantay
  alternative: una at ikalawang pangkat ng mga bantay
  rationale: Ang konteksto ay pagtakas ni Pedro sa sunod-sunod na antas ng seguridad. Ang “himpilan” ay malinaw ngunit hindi nagpapahiwatig ng dalawa pang bilangguan.
- issue: Saklaw ng ῥύμην μίαν
  choice: sa isang lansangan
  alternative: nang layo ng isang lansangan
  rationale: May posibilidad na accusative of extent ang parirala. Pinananatiling maikli at hindi labis na tiyak ang pangunahing teksto, habang inilalahad sa talababa ang posibleng kahulugang pandistansiya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; iniwasan ang arkaikong pananalita at ang teknikal na tunog ng “awtomatiko.” Ginamit ang “lungsod” at “lansangan” para sa neutral at pampublikong rehistro.
