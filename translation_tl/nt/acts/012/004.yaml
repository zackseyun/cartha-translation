id: ACT.12.4
reference: Acts 12:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃν καὶ πιάσας ἔθετο εἰς φυλακήν, παραδοὺς τέσσαρσιν τετραδίοις στρατιωτῶν φυλάσσειν αὐτόν, βουλόμενος μετὰ τὸ πάσχα ἀναγαγεῖν αὐτὸν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/004.yaml
  text: After arresting him[a], he put him in prison, handing him over to four squads of soldiers to guard him[b], intending to bring him out to the people after the Passover.
translation:
  language: tl
  text: Nang madakip niya si Pedro, ipinabilanggo niya ito at ibinigay sa apat na pangkat na tig-aapat na kawal upang bantayan siya. Balak ni Herodes na iharap siya sa mga tao pagkatapos ng Paskuwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na πάσχα ay nangangahulugang “Paskuwa.” “Easter” ang salin dito ng ilang lumang bersiyong Ingles.
    reason: alternative_reading
lexical_decisions:
- source_word: πιάσας
  choice: Pagkadakip sa kanya
  rationale: Ipinahahayag ng aorist participle ang kilos na nauna sa pagpapabilanggo. Ang pariralang ito ay natural sa modernong Tagalog at pinananatili ang diwa ng pagdakip.
- source_word: ἔθετο εἰς φυλακήν
  choice: ipinabilanggo siya
  rationale: Likas at malinaw na katumbas ito ng idyomang Griyego na literal na nagsasabing inilagay siya sa bilangguan.
- source_word: παραδοὺς
  choice: ibinigay
  rationale: Ipinahihiwatig nito ang paglilipat sa kustodiya ng mga kawal; nililinaw ng kasunod na layuning “upang bantayan” ang kahulugan.
- source_word: τέσσαρσιν τετραδίοις στρατιωτῶν
  choice: sa apat na pangkat ng tig-aapat na kawal
  rationale: Tuwirang ipinapakita nito na may apat na pangkat at apat na kawal sa bawat pangkat, nang hindi gumagamit ng di-pamilyar na teknikal na katawagan.
- source_word: φυλάσσειν αὐτόν
  choice: upang bantayan
  rationale: Pinananatili ang infinitive of purpose at malinaw na isinasaad ang tungkulin ng mga kawal.
- source_word: βουλόμενος
  choice: Balak ni Herodes
  rationale: Ipinapahayag ang sinadyang layunin o plano. Ginamit ang pangalang Herodes mula sa agarang konteksto upang maging malinaw ang simuno sa natural na Tagalog.
- source_word: μετὰ τὸ πάσχα
  choice: pagkatapos ng Paskuwa
  rationale: Ang πάσχα ay tumutukoy sa Paskuwa ng mga Judio; ito ang tuwiran at nakaugaliang salin sa Tagalog.
- source_word: ἀναγαγεῖν αὐτὸν τῷ λαῷ
  choice: ilabas siya sa harap ng mga tao
  rationale: Pinananatili ng “ilabas” ang pagdadala sa bilanggo mula sa piitan, samantalang ang “sa harap ng mga tao” ay naghahayag ng pampublikong pagharap nang hindi ipinapalagay na tahasang paglilitis ang tinutukoy.
- source_word: λαῷ
  choice: mga tao
  rationale: Karaniwan at malawak na katumbas ito ng λαός sa konteksto ng isang publikong kalipunan.
theological_decisions:
- issue: Kahulugan ng πάσχα
  choice: Paskuwa
  alternative: Easter
  rationale: Ang salitang Griyego na πάσχα ay tumutukoy sa Paskuwa. Ang “Easter” sa ilang lumang saling Ingles ay tradisyon ng pagsasalin at hindi ang payak na leksikal na kahulugan ng salitang Griyego rito.
- issue: Uri ng planong pampublikong paglalabas kay Pedro
  choice: ilabas siya sa harap ng mga tao
  alternative: iharap siya sa paglilitis ng mga tao
  rationale: Hindi tahasang sinasabi ng Griyego na isang pormal na paglilitis ang gagawin. Pinananatili ng salin ang pampublikong pagharap at hindi dinaragdagan ang teksto ng tiyak na prosesong hudisyal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “kawal” sa halip na mas kolokyal na “sundalo,” at pinanatili ang “Paskuwa” bilang kinikilalang katawagang biblikal. Ang pangalang Herodes ay nilinaw mula sa agarang konteksto upang maiwasan ang malabong sunod-sunod na panghalip.
