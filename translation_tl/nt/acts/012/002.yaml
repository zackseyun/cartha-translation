  yaml_path: translation/nt/acts/012/002.yaml
  text: And he killed James[a], the brother of John, with the sword.
translation:
  language: tl
  text: At pinatay niya sa pamamagitan ng tabak si Santiago[a], na kapatid ni Juan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipinapatay.” Payak na sinasabi ng Griyego na naging sanhi siya ng pagkamatay ni Santiago; maaaring ipinahihiwatig ng mas malawak na konteksto na isa itong opisyal na pagpatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῖλεν
  choice: pinatay
  rationale: Ang ἀναιρέω rito ay nangangahulugang naging sanhi siya ng pagkamatay ni Santiago. Ang “pinatay” ang pinakatuwiran at natural na salin; hindi nito ipinapasok sa pangunahing teksto ang mas tiyak na legal na diwa ng “ipinapatay” o “binitay bilang parusa.”
- source_word: δὲ
  choice: At
  rationale: Ang δέ ay payak na nag-uugnay at nagpapatuloy sa salaysay; ang “At” ay natural at hindi nagpapahiwatig ng mas matinding pagsalungat.
- source_word: Ἰάκωβον
  choice: Santiago
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa modernong Tagalog.
- source_word: τὸν ἀδελφὸν Ἰωάννου
  choice: na kapatid ni Juan
  rationale: Malinaw nitong kinikilala kung sinong Santiago ang tinutukoy at natural ang appositional na ayos sa Tagalog.
- source_word: μαχαίρῃ
  choice: sa tabak
  rationale: Ang μάχαιρα ay tabak o maikling tabak, at instrumental ang gamit ng dative. Pinananatili ng “sa tabak” ang kongkretong paraan ng pagpatay.
theological_decisions:
- issue: Kalikasan ng ginawa ni Herodes
  choice: Isinalin bilang tuwirang pagpatay nang hindi tinutukoy sa pangunahing teksto na isa itong pormal na pagbitay.
  alternative: “ipinapatay” o “ipinabitay” upang idiin ang malamang na opisyal na pagpaslang ng pamahalaan
  rationale: Sinasabi ng ἀνεῖλεν na pinatay si Santiago, at tinutukoy ng μαχαίρῃ ang ginamit na paraan. Bagaman nagpapahiwatig ang mas malawak na konteksto ng opisyal na pag-uusig, hindi tahasang itinatalaga ng talata ang legal na proseso.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “Santiago” at “Juan” bilang mga nakaugaliang pangalang biblikal. Pinili ang maikli at tuwirang pangungusap na sumusunod sa daloy ng Griyego.
