id: ACT.12.24
reference: Acts 12:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὁ δὲ λόγος τοῦ ⸀θεοῦ ηὔξανεν καὶ ἐπληθύνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/024.yaml
  text: But the word of God continued to grow and multiply[a].
translation:
  language: tl
  text: Ngunit patuloy na lumago at lumaganap ang salita ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patuloy na lumago at lumaganap ang mensahe ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: salita
  rationale: Pinanatili ang karaniwang pariralang ginagamit ni Lucas na “salita ng Diyos.” Saklaw nito rito ang mensaheng ipinapahayag mula sa Diyos; nililinaw sa talababa ang mas dinamikong salin.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Likas at tuwirang pagpapahayag ng genitibo, na tumutukoy sa salitang nagmumula sa Diyos o nauukol sa kanya.
- source_word: ηὔξανεν
  choice: patuloy na lumago
  rationale: Ipinahahayag ng imperfect ang nagpapatuloy na kilos. Ang “patuloy na lumago” ay natural na Tagalog at pinananatili ang larawan ng paglago.
- source_word: ἐπληθύνετο
  choice: lumaganap
  rationale: Sa konteksto, tumutukoy ito sa patuloy na paglawak at pagdami ng naaabot ng salita. Mas natural sa Tagalog ang “lumaganap” kaysa literal na “dumami” kapag salita o mensahe ang simuno, habang pinananatili ang pagkakaiba nito sa “lumago.”
- source_word: δὲ
  choice: Ngunit
  rationale: 'Ipinakikita ang kaibahan sa sinapit ni Herodes sa naunang salaysay: namatay ang makapangyarihang hari, ngunit patuloy ang pagsulong ng salita ng Diyos.'
theological_decisions:
- issue: Kung isasalin nang mas dinamiko ang “salita ng Diyos” bilang “mensahe ng Diyos”
  choice: salita ng Diyos
  alternative: mensahe ng Diyos
  rationale: Pinananatili nito ang paulit-ulit na pormulasyon ni Lucas at ang malawak na diwa ng λόγος, nang hindi nililimitahan iyon sa nilalaman lamang ng mensahe. Ibinibigay sa talababa ang malinaw na alternatibo.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Pinanatili ang pamilyar na biblikal na pariralang “salita ng Diyos,” habang ginamit ang “lumaganap” upang malinaw na ipahiwatig ang paglawak ng abot nito.
