source:
  edition: SBLGNT
  text: Ἦν ⸀δὲ θυμομαχῶν Τυρίοις καὶ Σιδωνίοις· ὁμοθυμαδὸν δὲ παρῆσαν πρὸς αὐτόν, καὶ πείσαντες Βλάστον τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως ᾐτοῦντο εἰρήνην διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν ἀπὸ τῆς βασιλικῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/020.yaml
  text: He was very angry with the Tyrians and Sidonians[a]. But they came to him with one accord, and after persuading Blastus, the king’s chamberlain, they were asking for peace[d][c][b], because their country was fed from the king’s domain.
translation:
  language: tl
  text: Galít na galít si Herodes sa mga taga-Tiro at taga-Sidon.[a] Ngunit nagkaisang lumapit sila sa kaniya. Matapos nilang mahikayat si Blasto, ang katiwala sa silid-tulugan ng hari,[b] humiling sila ng kapayapaan, sapagkat ang kanilang lupain ay umaasa sa teritoryo ng hari para sa pagkain.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “May matinding alitan si Herodes sa mga taga-Tiro at taga-Sidon.” Ang salitang Griyego ay maaaring magpahiwatig ng matinding galit o mapanlabang pakikitungo.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang namamahala sa silid-tulugan ng hari”—malamang ay isang opisyal ng palasyo na may daan sa pribadong silid ng hari.
    reason: cultural_note
  - marker: c
    text: O “sapagkat ang kanilang lupain ay tumatanggap ng panustos na pagkain mula sa teritoryo ng hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμομαχῶν
  choice: galít na galít
  rationale: Ipinahahayag ng salita ang matinding galit o mapanlabang saloobin. Ang “galít na galít” ay natural sa makabagong Tagalog at pinananatili ang tindi nang hindi nagpapasok ng tahasang pakikipagdigma.
- source_word: Τυρίοις καὶ Σιδωνίοις
  choice: mga taga-Tiro at taga-Sidon
  rationale: Mga katawagang etniko ito para sa mga naninirahan sa Tiro at Sidon; ang anyong “mga taga-” ang pinakanatural sa Tagalog.
- source_word: ὁμοθυμαδόν
  choice: sama-sama
  rationale: Ipinahihiwatig nito ang nagkakaisang layunin. Sa konteksto, malinaw at likas ang “sama-sama,” nang hindi labis na itinatakda na ganap na nagkakaisa ang bawat isa.
- source_word: παρῆσαν πρὸς αὐτόν
  choice: pumunta sa kaniya
  rationale: Natural na paglalarawan ito ng pagharap o paglapit nila kay Herodes.
- source_word: πείσαντες
  choice: matapos nilang mahikayat
  rationale: Pinananatili ng “matapos” ang nauunang kilos ng aorist participle bago ang kanilang paghingi ng kapayapaan. Hindi tiyak sa teksto kung paano nila siya nahikayat.
- source_word: Βλάστον
  choice: Blasto
  rationale: Isina-Tagalog ang personal na pangalang Blastus bilang “Blasto,” ayon sa karaniwang anyo ng mga pangalang Griyego sa Filipino.
- source_word: τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως
  choice: ang katiwala sa silid-tulugan ng hari
  rationale: Pinananatili nito ang larawan ng literal na katungkulan kaugnay ng pribadong silid ng hari, habang ipinakikitang opisyal o katiwala si Blasto.
- source_word: ᾐτοῦντο εἰρήνην
  choice: humingi sila ng kapayapaan
  rationale: Malinaw nitong ipinahahayag ang diplomatikong kahilingan. Hindi likas sa Tagalog na piliting markahan ang imperfect sa pamamagitan ng mabigat na parirala.
- source_word: διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν
  choice: sapagkat ang kanilang lupain ay umaasa ... para sa pagkain
  rationale: Ipinahahayag ng articular infinitive ang dahilan, at ang pasibong τρέφεσθαι ay tumutukoy sa pagtanggap ng panustos na pagkain. Ang “umaasa ... para sa pagkain” ay malinaw at natural sa Tagalog.
- source_word: ἀπὸ τῆς βασιλικῆς
  choice: sa nasasakupan ng hari
  rationale: Ang substantivized adjective ay tumutukoy sa teritoryo o lupaing pag-aari o pinamamahalaan ng hari. Ang “nasasakupan” ay malinaw nang hindi inuulit ang “lupain.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinangalanan si Herodes sa halip na gumamit ng malabong “siya,” yamang siya ang malinaw na paksa mula sa konteksto. Inayos ang mahaba at masalimuot na pangungusap ng Griyego sa natural na daloy ng Tagalog, habang pinananatili ang pagkakasunod-sunod at ugnayang sanhi.
