revisions:
- from: Galít na galít si Herodes sa mga taga-Tiro at taga-Sidon.[a] Ngunit sama-sama silang pumunta sa kaniya. Matapos nilang mahikayat si Blasto, ang katiwala sa silid-tulugan ng hari,[b] humingi sila ng kapayapaan, sapagkat ang kanilang lupain ay umaasa sa nasasakupan ng hari para sa pagkain.[c]
  to: Galít na galít si Herodes sa mga taga-Tiro at taga-Sidon.[a] Ngunit nagkaisang lumapit sila sa kaniya. Matapos nilang mahikayat si Blasto, ang katiwala sa silid-tulugan ng hari,[b] humiling sila ng kapayapaan, sapagkat ang kanilang lupain ay umaasa sa teritoryo ng hari para sa pagkain.[c]
  rationale: Pinalitan ang “sama-sama silang pumunta” ng “nagkaisang lumapit sila” upang maipakita ang nagkakaisang layunin na ipinahihiwatig ng ὁμοθυμαδόν. Pinalitan din ang “nasasakupan ng hari” ng “teritoryo ng hari” upang tiyak na tumukoy sa royal domain na pinagmumulan ng pagkain. Pinanatili ang mga umiiral na talababa at ang kanilang mga angkla.
