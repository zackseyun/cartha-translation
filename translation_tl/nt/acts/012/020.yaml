  - severity: low
    issue: Ang “nasasakupan ng hari” ay maaaring tumukoy sa mga taong sakop niya, hindi sa royal territory/domain.
    rationale: Ang substantivized na βασιλική ay tumutukoy sa pag-aaring teritoryo o lupaing maharlika/hari, na pinagmumulan ng kanilang panustos.
