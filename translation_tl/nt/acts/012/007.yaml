  to: At narito, biglang lumitaw sa tabi niya ang isang anghel ng Panginoon.[a] Isang liwanag ang suminag sa silid.[b] Hinampas ng anghel ang tagiliran ni Pedro at ginising siya. Sinabi nito, “Bumangon ka agad!” At nalaglag mula sa mga kamay ni Pedro ang kanyang mga tanikala.
