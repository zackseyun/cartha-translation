  text: καὶ ἰδοὺ ἄγγελος κυρίου ἐπέστη, καὶ φῶς ἔλαμψεν ἐν τῷ οἰκήματι· πατάξας δὲ τὴν πλευρὰν τοῦ Πέτρου ἤγειρεν αὐτὸν λέγων· Ἀνάστα ἐν τάχει· καὶ ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/007.yaml
  text: And behold[a], an angel of the Lord stood near, and a light shone in the cell. Striking Peter on the side, he woke him, saying[b], “Get up quickly.” And his chains fell off from his hands.
translation:
  language: tl
  text: At narito, biglang lumitaw sa tabi niya ang isang anghel ng Panginoon.[a] Isang liwanag ang suminag sa silid.[b] Hinampas ng anghel ang tagiliran ni Pedro at ginising siya. Sinabi nito, “Bumangon ka agad!” At nalaglag mula sa mga kamay ni Pedro ang kanyang mga tanikala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tumayo sa tabi niya” o “biglang nagpakita sa tabi niya.” Maaaring idiin ng pandiwang Griyego ang biglaang pagdating o paglitaw, gayundin ang pagtayo sa malapit.
    reason: lexical_alternative
  - marker: b
    text: O “kuwarto” o, ayon sa konteksto, “selda.” Mas pangkalahatan ang salitang Griyego para sa isang silid o tirahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: masdan
  rationale: Pinananatili ang masigla at pantawag-pansing puwersa ng panandang diskurso, sa dignificado ngunit nauunawaang modernong Tagalog.
- source_word: ἄγγελος κυρίου
  choice: isang anghel ng Panginoon
  rationale: Likas na salin ng di-tiyak na parirala at pinananatili ang kaugnayan ng anghel sa Panginoon nang hindi dinaragdagan ang kahulugan.
- source_word: ἐπέστη
  choice: biglang tumayo sa tabi niya
  rationale: Sinasaklaw ang kapuwa biglaang pagdating o paglitaw at ang pisikal na pagtayo sa malapit; ang 'niya' ay tumutukoy kay Pedro ayon sa konteksto.
- source_word: φῶς ἔλαμψεν
  choice: may liwanag na suminag
  rationale: Natural na Tagalog na malinaw na nagpapahayag ng paglitaw at pagsinag ng liwanag.
- source_word: ἐν τῷ οἰκήματι
  choice: sa silid
  rationale: Ang οἴκημα ay pangkalahatang 'silid' o 'kuwarto'; hindi ito tahasang nangangahulugang selda, bagaman iyon ang konteksto.
- source_word: πατάξας ... τὴν πλευρὰν
  choice: Hinampas ... ang tagiliran
  rationale: Pinananatili ang mas malakas na pisikal na puwersa ng πατάσσω at ang tiyak na bahagi ng katawan, sa halip na pahinain bilang simpleng pagkalabit.
- source_word: ἤγειρεν αὐτόν
  choice: ginising siya
  rationale: Sa konteksto, ang kahulugan ay paggising kay Pedro mula sa pagkakatulog, hindi lamang pagtayo sa kanya.
- source_word: Ἀνάστα ἐν τάχει
  choice: Bumangon ka agad
  rationale: Kasalukuyan at natural na utos sa Tagalog na naghahatid ng kagyat na pagkilos.
- source_word: ἐξέπεσαν ... αἱ ἁλύσεις ἐκ τῶν χειρῶν
  choice: nalaglag mula sa mga kamay ... ang kanyang mga tanikala
  rationale: Malapit sa anyo ng Griyego at pinananatili ang 'mga kamay' sa halip na ipakahulugang 'mga pulsuhan.'
theological_decisions:
- issue: Pag-render sa κύριος sa ἄγγελος κυρίου
  choice: Panginoon
  alternative: Amo
  rationale: Ang 'Panginoon' ang karaniwan at angkop na salin sa gamit ng Bagong Tipan at hindi nagdaragdag ng partikular na denominasyonal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang 'masdan' upang mapanatili ang buhay na estilo ni Lucas; bahagya itong mataas ngunit pamilyar sa wikang biblikal. Nilinaw ang mga panghalip sa pagsasalaysay upang maiwasan ang kalituhan, nang hindi nagdaragdag ng bagong tauhan o teolohikal na paliwanag.
