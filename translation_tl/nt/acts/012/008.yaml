base_translation:
  language: en
  yaml_path: translation/nt/acts/012/008.yaml
  text: And the angel said to him[a], “Tie on your belt and put on your sandals.” And he did so. And he says to him[c][b], “Put on your cloak and follow me.”
translation:
  language: tl
  text: Sinabi sa kanya ng anghel, “Magbigkis ka ng sinturon[a] at isuot mo ang mga sandalyas mo.” Ginawa nga niya iyon. At sinabi nito sa kanya[b], “Isuot mo ang balabal mo[c] at sumunod ka sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bigkisan mo ang iyong sarili.” Ang utos sa Griyego ay tumutukoy sa pagkakabit ng sinturon bilang paghahanda sa pagkilos.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “sinasabi nito,” isang pangkasalukuyang anyo na ginagamit upang gawing mas buhay ang pagsasalaysay.
    reason: lexical_alternative
  - marker: c
    text: O “Ibalabal mo sa iyong katawan ang balabal mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: anghel
  rationale: Sa konteksto ng pagliligtas kay Pedro sa bilangguan, isang makalangit na nilalang ang tinutukoy, kaya mas angkop ang “anghel” kaysa sa pangkalahatang “mensahero.”
- source_word: Ζῶσαι
  choice: Magbigkis ka ng sinturon
  rationale: Ipinahihiwatig ng panggitnang pautos ang pagbibigkis o pagkakabit ng sinturon bilang paghahanda sa pagkilos. Malinaw ito sa modernong Filipino nang hindi gumagamit ng lipas na pananalita.
- source_word: ὑπόδησαι τὰ σανδάλιά σου
  choice: isuot mo ang mga sandalyas mo
  rationale: Likas at tuwirang Filipino ito para sa paglalagay ng sandalyas sa mga paa.
- source_word: ἐποίησεν δὲ οὕτως
  choice: Ginawa nga niya iyon
  rationale: Maikli at natural nitong ipinahahayag na sinunod ni Pedro ang mga naunang utos; ipinapakita ng “nga” ang pagpapatuloy at pagtupad.
- source_word: λέγει
  choice: Sinabi pa nito
  rationale: Ginawang natural ang salaysay sa Filipino habang ipinahihiwatig ng “pa” ang kasunod na utos. Ipinaliliwanag sa talababa ang makasaysayang pangkasalukuyan ng Griyego.
- source_word: Περιβαλοῦ τὸ ἱμάτιόν σου
  choice: Isuot mo ang balabal mo
  rationale: Ang ἱμάτιον ay panlabas na kasuotan o balabal, at ang “isuot” ang pinakanatural na utos sa Filipino. Nasa talababa ang mas literal na kilos ng paglalagay nito sa palibot ng katawan.
- source_word: ἀκολούθει μοι
  choice: sumunod ka sa akin
  rationale: Pinananatili nito ang karaniwang kahulugan ng ἀκολουθέω at ang tuwirang utos na pisikal na sundan ang anghel.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal ang ginamit. Ang “nito” ay malinaw na tumutukoy sa anghel at umiiwas sa paulit-ulit na pangngalan. Pinanatili sa mga talababa ang konkretong larawan ng pagbibigkis, ang makasaysayang pangkasalukuyan, at ang kilos ng paglalagay ng balabal sa palibot ng katawan.
