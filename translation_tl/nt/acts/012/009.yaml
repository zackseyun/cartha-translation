id: ACT.12.9
reference: Acts 12:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν ⸀ἠκολούθει, καὶ οὐκ ᾔδει ὅτι ἀληθές ἐστιν τὸ γινόμενον διὰ τοῦ ἀγγέλου, ἐδόκει δὲ ὅραμα βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/009.yaml
  text: And he went out and followed[a], and he did not know that what was happening through the angel was real, but thought he was seeing a vision.
translation:
  language: tl
  text: Lumabas siya at sumunod. Hindi niya alam na totoo ang nangyayari sa pamamagitan ng anghel[a]; ang akala niya’y isang pangitain ang nakikita niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ng anghel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Lumabas siya
  rationale: Ang aorist participle ay likas na isinalin bilang pandiwang may buong diwa sa salaysay; malinaw nitong pinananatili ang kilos ng paglabas.
- source_word: ἠκολούθει
  choice: at sumunod
  rationale: Ipinahihiwatig ng imperfect ang nagpapatuloy na pagsunod, ngunit natural sa salaysay na Tagalog ang payak na “sumunod.” Hindi tahasang pinangalanan sa pariralang Griyego ang sinusundan, kaya hindi ito idinagdag sa salin.
- source_word: οὐκ ᾔδει
  choice: Hindi niya alam
  rationale: Tuwirang ipinapahayag ang kawalan ng kaalaman o kamalayan ni Pedro.
- source_word: ἀληθές
  choice: totoo
  rationale: Sa pagsalungat nito sa isang pangitain, ang “totoo” ay tumutukoy sa aktuwal na nangyayari, hindi lamang sa katumpakan ng isang pahayag.
- source_word: τὸ γινόμενον
  choice: ang nangyayari
  rationale: Pinananatili nito ang tuloy-tuloy na aspekto ng articular present participle at natural itong pakinggan sa makabagong Tagalog.
- source_word: διὰ τοῦ ἀγγέλου
  choice: sa pamamagitan ng anghel
  rationale: Pinananatili nito ang diwa ng namamagitang ahensiya o kasangkapan na maaaring ipahayag ng διά na may genitive, nang hindi labis na itinatampok ang nagsasariling pagkilos ng anghel.
- source_word: ἐδόκει
  choice: ang akala niya’y
  rationale: Natural na ipinapahayag nito ang palagay o pagkaunawa ni Pedro sa nararanasan niya.
- source_word: ὅραμα
  choice: isang pangitain
  rationale: Ang “pangitain” ang karaniwang salitang Tagalog para sa isang tanawing nakikita sa paraang higit sa ordinaryong paningin, nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: βλέπειν
  choice: ang nakikita niya
  rationale: Sa konstruksiyon kasama ng ἐδόκει, malinaw at natural nitong inilalarawan ang inaakala ni Pedro na kasalukuyan niyang nakikita.
theological_decisions:
- issue: Kalikasan ng pagkilos ng anghel
  choice: sa pamamagitan ng anghel
  alternative: ng anghel
  rationale: Pinananatili ng napiling parirala ang posibleng diwa ng namamagitang ahensiya sa διά na may genitive, nang hindi nagpapasya nang higit sa sinasabi ng teksto tungkol sa kapangyarihan o papel ng anghel.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatiling payak ang daloy ng salaysay at ang kaibahan sa pagitan ng aktuwal na pangyayari at ng inaakalang pangitain.
