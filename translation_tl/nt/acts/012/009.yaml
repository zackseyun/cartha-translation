  source_fidelity: 'Tumpak ang salin sa daloy at kahulugan ng Griyego: naipahayag ang paglabas at pagsunod ni Pedro, ang hindi niya pagkabatid na ang nangyayari ay tunay, ang ugnayan nito sa anghel sa pamamagitan ng διά, at ang akala niyang pangitain ang kanyang nakikita. Hindi nito dinaragdagan ang diwa ng teksto.'
