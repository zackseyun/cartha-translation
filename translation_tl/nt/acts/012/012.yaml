id: ACT.12.12
reference: Acts 12:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Συνιδών τε ἦλθεν ἐπὶ τὴν οἰκίαν ⸀τῆς Μαρίας τῆς μητρὸς Ἰωάννου τοῦ ἐπικαλουμένου Μάρκου, οὗ ἦσαν ἱκανοὶ συνηθροισμένοι καὶ προσευχόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/012.yaml
  text: And when he realized this[a], he went to the house of Mary, the mother of John who was called Mark, where many had gathered together and were praying.
translation:
  language: tl
  text: Nang maunawaan niya ang nangyari, pumunta siya sa bahay ni Maria, na ina ni Juan na tinatawag na Marcos, kung saan maraming nagtipon na at nananalangin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνιδών
  choice: Nang maunawaan niya ang nangyari
  rationale: Ipinahihiwatig ng aorist participle na lubos nang naunawaan ni Pedro ang kanyang kalagayan matapos umalis ang anghel; ang “ang nangyari” ay likas na paglalantad sa ipinahihiwatig ng konteksto.
- source_word: τε
  choice: '[hindi isinalin nang hiwalay]'
  rationale: Mahinang pang-ugnay ito; sapat na sa natural na salaysay sa Filipino ang pagkakasunod ng mga sugnay, kaya hindi kailangang idagdag ang “at” o “pagkatapos.”
- source_word: ἦλθεν ἐπὶ τὴν οἰκίαν
  choice: pumunta siya sa bahay
  rationale: Malinaw na ipinapahayag ang pagkilos patungo sa isang lugar at ang pananaw ng salaysay.
- source_word: τῆς Μαρίας τῆς μητρὸς Ἰωάννου
  choice: ni Maria, na ina ni Juan
  rationale: Tuwirang pinananatili ang pagkakakilanlan kay Maria sa pamamagitan ng kanyang kaugnayan kay Juan.
- source_word: τοῦ ἐπικαλουμένου Μάρκου
  choice: na tinatawag na Marcos
  rationale: Ipinakikilala si Juan sa isa pang pangalang ginagamit sa kanya nang hindi idinaragdag ang “din,” na hindi tahasang hinihingi ng Griyego.
- source_word: οὗ
  choice: kung saan
  rationale: Tumutukoy nang likas at maikli sa bahay ni Maria bilang lugar.
- source_word: ἱκανοὶ
  choice: marami
  rationale: Ipinapahayag ang malaking bilang sa malinaw at karaniwang Filipino.
- source_word: ἦσαν ... συνηθροισμένοι καὶ προσευχόμενοι
  choice: maraming nagkakatipon at nananalangin
  rationale: Ang progresibong anyo ay natural na naghahatid sa kalagayan ng kanilang sama-samang pagtitipon at nagpapatuloy na pananalangin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “Marcos,” ang nakaugaliang anyo ng pangalang Mark sa Bibliyang Filipino.
