  to: Nang matauhan si Pedro[a], sinabi niya, “Ngayon ay tiyak ko nang alam na isinugo ng Panginoon ang kanyang anghel at iniligtas ako mula sa kamay ni Herodes[b] at mula sa lahat ng inaasahan ng mga Judio.[c]”
