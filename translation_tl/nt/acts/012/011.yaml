id: ACT.12.11
reference: Acts 12:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ⸂ἐν ἑαυτῷ γενόμενος⸃ εἶπεν· Νῦν οἶδα ἀληθῶς ὅτι ἐξαπέστειλεν ⸀ὁ κύριος τὸν ἄγγελον αὐτοῦ καὶ ἐξείλατό με ἐκ χειρὸς Ἡρῴδου καὶ πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/011.yaml
  text: And Peter[a], coming to himself, said[c][b], “Now I truly know that the Lord sent his angel and rescued me from Herod’s hand and from all the expectation of the people of the Jews.”
translation:
  language: tl
  text: Nang matauhan si Pedro[a], sinabi niya, “Ngayon ay tiyak ko nang alam na isinugo ng Panginoon ang kanyang anghel at iniligtas ako mula sa kamay ni Herodes[b] at mula sa lahat ng inaasahan ng mga Judio.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang magbalik siya sa ganap na kamalayan” o “nang magbalik siya sa kanyang sarili.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kamay ni Herodes” ay nangangahulugang kapangyarihan o kontrol ni Herodes.
    reason: cultural_note
  - marker: c
    text: O “at mula sa lahat ng inaasahan ng mga Judio na mangyayari sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑαυτῷ γενόμενος
  choice: Nang matauhan
  rationale: Likas na idyomang Filipino para sa pagbabalik ni Pedro sa ganap na kamalayan matapos ang karanasang wari’y pangitain; hindi nito ipinahihiwatig na dati siyang wala sa katinuan.
- source_word: ἀληθῶς
  choice: tiyak
  rationale: Ipinahahayag ang mariing pagkilala ni Pedro na ngayon ay alam na niya nang walang pag-aalinlangan ang nangyari.
- source_word: ἐξαπέστειλεν
  choice: isinugo
  rationale: Ang “isinugo” ay likas at marangal na salin para sa pagpapadala ng Panginoon sa kanyang anghel.
- source_word: κύριος
  choice: Panginoon
  rationale: Pinananatili ang hindi tinukoy na reperente ng κύριος sa Griyego sa halip na tahasang gawing Diyos o si Jesus.
- source_word: ἄγγελον
  choice: anghel
  rationale: Malinaw sa salaysay na isang makalangit na nilalang ang tinutukoy, hindi lamang isang taong mensahero.
- source_word: ἐξείλατό με
  choice: iniligtas ako
  rationale: Malinaw na ipinahahayag ang pagliligtas mula sa panganib at kapangyarihan ni Herodes.
- source_word: ἐκ χειρὸς Ἡρῴδου
  choice: mula sa kamay ni Herodes
  rationale: Pinananatili ang larawang “kamay,” na tumutukoy sa kapangyarihan o kontrol, at natural pa rin sa Filipino.
- source_word: πάσης τῆς προσδοκίας
  choice: sa lahat ng inaasahan
  rationale: Pinananatili ang saklaw ng πάσης at ang diwa ng προσδοκία bilang inaasahang kahihinatnan, nang hindi tinutukoy kung ano mismo ang balak mangyari.
- source_word: τοῦ λαοῦ τῶν Ἰουδαίων
  choice: ng mga Judio
  rationale: Natural at malinaw sa modernong Filipino; sama-samang tinutukoy ang mga taong Judio sa salaysay nang hindi gumagamit ng artipisyal na pariralang “bayan ng mga Judio.”
theological_decisions:
- issue: Reperente ng κύριος
  choice: Panginoon
  alternative: Diyos; ang muling nabuhay na si Jesus
  rationale: Hindi tahasang nililinaw ng Griyego kung sino ang tinutukoy. Pinananatili ng “Panginoon” ang katawagan at ang teolohikal na puwang ng teksto.
- issue: Nilalaman ng inaasahan ng mga Judio
  choice: lahat ng inaasahan ng mga Judio para sa akin
  alternative: lahat ng balak gawin sa akin ng mga Judio
  rationale: Ang “inaasahan” ay hindi ginagawang “balak,” sapagkat προσδοκία ay tumutukoy sa inaasahang mangyayari, hindi kinakailangang sa sariling gawa o plano nila.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang likas na “matauhan” sa idyoma, ngunit inilakip ang mas literal na mga alternatibo sa talababa. Ang “kamay ni Herodes” at “Panginoon” ay nagpapanatili sa mahalagang larawan at di-tiyak na reperente ng pinagmulang teksto.
