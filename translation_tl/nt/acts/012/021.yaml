id: ACT.12.21
reference: Acts 12:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τακτῇ δὲ ἡμέρᾳ ὁ Ἡρῴδης ἐνδυσάμενος ἐσθῆτα βασιλικὴν ⸀καὶ καθίσας ἐπὶ τοῦ βήματος ἐδημηγόρει πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/021.yaml
  text: On an appointed day[a], Herod, having put on royal clothing and having sat down on the tribunal[b], was delivering a public address to them.
translation:
  language: tl
  text: Sa takdang araw, nagsuot si Herodes ng kasuotang maharlika, umupo sa luklukan[a], at nagtalumpati sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mataas na plataporma” o “sa upuan ng hukom.” Ang salitang Griyego ay maaaring tumukoy sa isang opisyal na upuan o mataas na entablado.
    reason: lexical_alternative
lexical_decisions:
- source_word: τακτῇ ... ἡμέρᾳ
  choice: Sa takdang araw
  rationale: Likas at malinaw na tumutukoy sa isang araw na itinakda nang maaga, nang hindi dinaragdagan ng pahiwatig na wala sa Griyego.
- source_word: ἐνδυσάμενος
  choice: nagsuot
  rationale: Maikli at natural na Filipino para sa aorist middle participle; naihahayag ang naunang kilos nang hindi pilit na ginagaya ang anyong pandiwari.
- source_word: ἐσθῆτα βασιλικὴν
  choice: kasuotang maharlika
  rationale: Pinananatili ang malawak na kahulugan ng ἐσθής bilang kasuotan o maringal na damit at hindi ipinapalagay na tiyak na balabal ang suot.
- source_word: καθίσας
  choice: umupo
  rationale: Natural na pagsasalaysay sa Filipino ng sumunod na kilos sa pagkakasunod-sunod.
- source_word: ἐπὶ τοῦ βήματος
  choice: sa luklukan
  rationale: Ipinahihiwatig ang opisyal at mataas na upuan ng isang pinuno; inilalahad sa talababa ang posibleng diwa ng entablado o hukuman.
- source_word: ἐδημηγόρει
  choice: nagtalumpati
  rationale: Ipinapahayag ang pampublikong pagsasalita sa isang kapulungan; sa konteksto, sapat ang natural na pandiwang Filipino upang katawanin ang nagpapatuloy na kilos ng imperfect.
- source_word: πρὸς αὐτούς
  choice: sa kanila
  rationale: Tuwirang tumutukoy sa mga taong kinakausap ni Herodes.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginawang magkakasunod na pandiwa ang mga participle upang maging natural sa Tagalog habang pinananatili ang ayos ng mga kilos. Inilipat ang talababa sa βῆμα, sapagkat iyon ang tunay na leksikal na hindi tiyak sa talata.
