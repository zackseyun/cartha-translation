source:
  edition: SBLGNT
  text: ὁ μὲν οὖν Πέτρος ἐτηρεῖτο ἐν τῇ φυλακῇ· προσευχὴ δὲ ἦν ⸀ἐκτενῶς γινομένη ὑπὸ τῆς ἐκκλησίας πρὸς τὸν θεὸν ⸀περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/005.yaml
  text: So Peter was being kept in the prison[a], but earnest prayer was being made to God by the church for him.
translation:
  language: tl
  text: Kaya patuloy na binabantayan si Pedro sa bilangguan, ngunit taimtim na nananalangin sa Diyos ang iglesya para sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “masigasig” o “walang tigil”; maaaring idiin ng salitang Griyego ang tindi o ang pagpupursigi sa panalangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτηρεῖτο
  choice: patuloy na binantayan
  rationale: Ipinahahayag ng imperfect passive ang nagpapatuloy na pagbabantay kay Pedro. Likas sa Filipino ang pariralang ito at pinananatili nito ang diwang pasibo at duratibo.
- source_word: φυλακῇ
  choice: sa bilangguan
  rationale: Tumutukoy ito sa lugar ng pagkakakulong; ang “bilangguan” ay malinaw, dignificado, at angkop sa salaysay.
- source_word: προσευχὴ ... ἦν ... γινομένη
  choice: ay ... nananalangin
  rationale: Isinalin ang periphrastic na konstruksyon bilang nagpapatuloy na kilos sa natural na Filipino. Ang “nananalangin” ay higit na idiomatiko kaysa sa literal na “ginagawa ang panalangin.”
- source_word: ἐκτενῶς
  choice: taimtim na
  rationale: Ipinahahayag nito ang masidhing pagtuon at kasigasigan sa panalangin, habang nananatiling natural sa modernong Tagalog. Maaari rin itong magpahiwatig ng pagpupursigi, kaya nilinaw ang saklaw sa talababa.
- source_word: ὑπὸ τῆς ἐκκλησίας
  choice: ang iglesya
  rationale: Dahil ginawang aktibo ang pangungusap para sa likas na Filipino, ang gumagawa ng panalangin ay tahasang “ang iglesya,” na tumutukoy sa pamayanang Kristiyano at hindi kinakailangang sa isang institusyon o gusali.
- source_word: πρὸς τὸν θεὸν
  choice: sa Diyos
  rationale: Ito ang natural na Filipino para sa direksiyon o pinatutungkulan ng panalangin.
- source_word: περὶ αὐτοῦ
  choice: para sa kanya
  rationale: Sa konteksto ng panalanging namamagitan, likas na ipinahahayag nito na si Pedro ang ipinapanalangin.
- source_word: μὲν οὖν ... δὲ
  choice: Kaya ... ngunit ...
  rationale: Pinananatili nito ang pagsulong ng salaysay at ang malinaw na paghahambing sa pagkakabilanggo ni Pedro at sa patuloy na panalangin ng iglesya.
theological_decisions:
- issue: Pagpapakahulugan sa ἐκκλησία
  choice: iglesya
  alternative: kapulungan / kongregasyon
  rationale: Dito ay tumutukoy ang salita sa pamayanang Kristiyano na nananalangin para kay Pedro. Ang “iglesya” ay karaniwang salin sa biblikal na Filipino, ngunit sa kontekstong ito ay hindi nito ipinapalagay ang isang partikular na denominasyon o institusyon.
- issue: Saklaw ng ἐκτενῶς
  choice: taimtim na
  alternative: masigasig na / walang tigil na
  rationale: Maaaring idiin ng salitang Griyego ang tindi o ang pagpupursigi. Pinili ang “taimtim na” bilang natural na pangunahing salin, habang pinananatili sa talababa ang lehitimong alternatibong diin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at dignificado. Ginamit ang aktibong ayos upang maging natural sa Filipino habang pinananatili ang patuloy na aspekto ng dalawang kilos. Ang marker na [a] ay inilagay agad pagkatapos ng sugnay tungkol sa panalangin.
