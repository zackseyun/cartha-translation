id: ACT.12.6
reference: Acts 12:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὅτε δὲ ἤμελλεν ⸂προαγαγεῖν αὐτὸν⸃ ὁ Ἡρῴδης, τῇ νυκτὶ ἐκείνῃ ἦν ὁ Πέτρος κοιμώμενος μεταξὺ δύο στρατιωτῶν δεδεμένος ἁλύσεσιν δυσίν, φύλακές τε πρὸ τῆς θύρας ἐτήρουν τὴν φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/006.yaml
  text: When Herod was about to bring him out[a], on that very night Peter was sleeping between two soldiers, bound with two chains[b], and guards before the door were keeping watch over the prison.
translation:
  language: tl
  text: Nang malapit na siyang ilabas[a] ni Herodes, noong gabi ring iyon ay natutulog si Pedro sa pagitan ng dalawang kawal, nakagapos ng dalawang kadena, at binabantayan ng mga bantay sa harap ng pinto ang bilangguan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iharap.” Ang pandiwang Griyego ay maaaring tumukoy sa paglalabas sa isang tao upang iharap sa madla o litisin.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “at nagbabantay sa bilangguan ang mga bantay sa harap ng pinto.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμελλεν
  choice: malapit na
  rationale: Ipinahahayag ng μέλλω ang isang kilos na nalalapit nang mangyari; likas sa Tagalog ang “malapit na” sa ganitong konteksto.
- source_word: προαγαγεῖν αὐτόν
  choice: ilabas siya
  rationale: Tumutukoy ito sa paglalabas kay Pedro mula sa pagkakapiit, malamang upang iharap sa madla o sa paglilitis. Pinananatili ng “ilabas” ang kilos nang hindi tahasang tinutukoy ang layunin.
- source_word: τῇ νυκτὶ ἐκείνῃ
  choice: noong gabi ring iyon
  rationale: Ipinakikita ng demonstratibong ἐκείνῃ ang tiyak at mariing pagtukoy sa mismong gabing iyon; likas itong naipahahayag ng “gabi ring iyon.”
- source_word: κοιμώμενος
  choice: natutulog
  rationale: Ipinakikita ng kasalukuyang participle ang nagpapatuloy na pagkakatulog ni Pedro.
- source_word: μεταξὺ δύο στρατιωτῶν
  choice: sa pagitan ng dalawang kawal
  rationale: Tuwirang inilalarawan ang kinalalagyan ni Pedro sa gitna ng dalawang sundalo; ang “kawal” ay malinaw at marangal na katawagan.
- source_word: δεδεμένος ἁλύσεσιν δυσίν
  choice: nakagapos ng dalawang kadena
  rationale: Ipinahahayag ng perfect passive participle ang umiiral na kalagayan ni Pedro bilang nakagapos, at tinutukoy ng kasunod na parirala ang dalawang kadenang ginamit.
- source_word: φύλακες
  choice: mga bantay
  rationale: Ang “mga bantay” ay karaniwan at malinaw na tawag sa mga nagbabantay sa bilangguan.
- source_word: πρὸ τῆς θύρας
  choice: sa harap ng pinto
  rationale: Tumpak at likas na katumbas ito ng lokasyong ipinahahayag ng πρό na may genitive.
- source_word: ἐτήρουν τὴν φυλακήν
  choice: binabantayan … ang bilangguan
  rationale: Sa kontekstong ito, ang τηρέω ay nangangahulugang magbantay, at ang φυλακή ay tumutukoy sa bilangguan. Ginamit ang ayos na ito upang maging natural ang pangungusap sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal ang ginamit. Pinanatili ang nalalapit na kilos, ang diin sa mismong gabing iyon, at ang hindi tahasang tinukoy na layunin ng paglalabas kay Pedro.
