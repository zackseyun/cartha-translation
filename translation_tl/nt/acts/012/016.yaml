id: ACT.12.16
reference: Acts 12:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἐπέμενεν κρούων· ἀνοίξαντες δὲ εἶδαν αὐτὸν καὶ ἐξέστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/016.yaml
  text: But Peter kept on knocking[a], and when they opened the door[b], they saw him and were astonished.
translation:
  language: tl
  text: Ngunit patuloy na kumakatok si Pedro[a]. Nang buksan nila[b], nakita nila siya at labis silang namangha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpatuloy sa pagkatok” o “mapilit na kumakatok.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “Pagkabukas nila, nakita nila siya at namangha sila.” Ang binuksan ay nauunawaan mula sa konteksto ngunit hindi tahasang binanggit sa Griyego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμενεν κρούων
  choice: patuloy na kumakatok
  rationale: Likas na ipinahahayag sa Filipino ang nagpapatuloy o paulit-ulit na kilos ng imperfect na ἐπέμενεν kasama ng kasabay na participle na κρούων.
- source_word: ἀνοίξαντες
  choice: Nang buksan nila
  rationale: Isinalin ang aorist participle bilang temporal na sugnay upang malinaw at natural ang pagkakasunod ng mga pangyayari. Hindi idinagdag sa pangunahing teksto ang tiyak na layon dahil wala ito sa Griyego at nauunawaan na sa konteksto.
- source_word: εἶδαν αὐτὸν
  choice: nakita nila siya
  rationale: Tuwirang salin ng karaniwang pandiwang ginagamit sa salaysay, nang walang dagdag na pagpapakahulugan.
- source_word: ἐξέστησαν
  choice: labis silang namangha
  rationale: Ipinapakita ng ἐξίστημι rito ang matinding pagkagulat o pagkamangha; pinananatili ng 'labis na namangha' ang tindi sa natural na modernong Filipino.
- source_word: δὲ
  choice: Ngunit / hindi hiwalay na isinalin
  rationale: Ang unang δέ ay nagpapakita ng pagsalungat sa naunang pangyayari kaya 'Ngunit' ang ginamit. Ang ikalawa ay likas na isinama sa daloy ng kasunod na pangungusap.
- source_word: Πέτρος
  choice: Pedro
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
theological_decisions: []
