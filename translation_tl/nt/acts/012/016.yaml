  register: Modernong Filipino na malinaw, natural, at marangal. Pinanatili ang diin sa patuloy na pagkatok at sa matinding pagkamangha, habang iniwasang idagdag sa pangunahing teksto ang salitang 'pinto' na wala sa orihinal.
