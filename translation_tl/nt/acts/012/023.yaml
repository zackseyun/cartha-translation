base_translation:
  language: en
  yaml_path: translation/nt/acts/012/023.yaml
  text: Immediately an angel of the Lord struck him[a], because he did not give the glory to God, and becoming worm-eaten[c][b], he died.
translation:
  language: tl
  text: Kaagad siyang sinaktan ng isang anghel ng Panginoon, sapagkat hindi niya ibinigay sa Diyos ang kaluwalhatian.[a] At siya'y inuod at namatay siya.[c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi niya niluwalhati ang Diyos.”
    reason: lexical_alternative
  - marker: b
    text: O, “kinain siya ng mga uod.”
    reason: lexical_alternative
  - marker: c
    text: O, “nalagutan siya ng hininga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: Kaagad
  rationale: Ipinahahayag nito na nangyari ang paghatol nang walang pagkaantala at natural itong pakinggan sa makabagong Tagalog.
- source_word: ἐπάταξεν
  choice: sinaktan
  rationale: Pinananatili nito ang diwa ng pagpalo o pananakit nang hindi paunang ipinapasok ang kamatayan, na tahasang binabanggit sa hulihan ng talata.
- source_word: ἄγγελος κυρίου
  choice: isang anghel ng Panginoon
  rationale: Walang pantukoy ang ἄγγελος sa Griyego, kaya ang ‘isang anghel’ ay mas angkop kaysa sa tiyak na ‘ang anghel.’
- source_word: ἀνθ’ ὧν
  choice: sapagkat
  rationale: Malinaw at likas nitong ipinapahayag ang dahilan ng paghatol.
- source_word: ἔδωκεν τὴν δόξαν τῷ θεῷ
  choice: ibinigay sa Diyos ang kaluwalhatian
  rationale: Pinananatili ang larawan ng pag-uukol sa Diyos ng kaluwalhatiang nararapat sa kanya, pati ang tiyak na pantukoy ng τὴν δόξαν.
- source_word: γενόμενος σκωληκόβρωτος
  choice: Kinain siya ng mga uod
  rationale: Natural at malinaw sa Tagalog ang tahasang pariralang ito para sa literal at matinding larawan ng pagiging ‘worm-eaten,’ nang hindi nagdaragdag ng medikal na paliwanag.
- source_word: ἐξέψυξεν
  choice: namatay siya
  rationale: Ito ang pinakanatural na makabagong salin ng pandiwang nangangahulugang mawalan ng buhay o malagutan ng hininga.
theological_decisions:
- issue: Kalikasan at pagkakasunod-sunod ng paghatol
  choice: Inilalarawan ang kamatayan ni Herodes bilang paghatol na isinagawa sa pamamagitan ng isang anghel ng Panginoon, kasunod ng hindi niya pagbibigay ng kaluwalhatian sa Diyos.
  alternative: Ituring itong likas lamang na kamatayan na inilarawan sa panrelihiyong pananalita, o ipalagay na namatay siya sa mismong sandali ng pagsakit ng anghel.
  rationale: Tahasang inuugnay ng teksto ang pananakit sa anghel at ibinibigay ang dahilan nito. Gayunman, hindi nito nililinaw ang eksaktong prosesong medikal o haba ng panahong namagitan, kaya hindi iyon idinagdag sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na ayos ng pangungusap, habang pinanatili ang biglaan at matinding larawan ng paghatol sa Griyego.
