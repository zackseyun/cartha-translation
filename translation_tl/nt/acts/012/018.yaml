  text: Γενομένης δὲ ἡμέρας ἦν τάραχος οὐκ ὀλίγος ἐν τοῖς στρατιώταις, τί ἄρα ὁ Πέτρος ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/018.yaml
  text: When day came[a], there was no small disturbance among the soldiers over what had become of Peter.
translation:
  language: tl
  text: Pagsapit ng umaga, nagkaroon ng hindi maliit na kaguluhan[a] sa mga kawal tungkol sa kung ano ang nangyari kay Pedro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “matinding kaguluhan.”'
    reason: Ipinakikita ang mas idyomatikong pagpapahayag ng litotes na “hindi maliit,” nang hindi binabago ang diwa.
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Pagsapit ng umaga
  rationale: Likas na salin ng genitive absolute na nagsasaad ng panahon. Ipinahihiwatig ng ayos ng pangungusap ang paglipat ng salaysay na dala ng δέ nang hindi nagdaragdag ng tahasang panandang wala sa Griyego.
- source_word: τάραχος οὐκ ὀλίγος
  choice: hindi maliit na kaguluhan
  rationale: Pinananatili ang litotes na οὐκ ὀλίγος at ang retorikal na diin nito, sa halip na pakinisin bilang simpleng “matinding kaguluhan.”
- source_word: ἐν τοῖς στρατιώταις
  choice: sa hanay ng mga kawal
  rationale: Tumpak na ipinapakita na sa loob ng pangkat ng mga στρατιῶται nangyari ang kaguluhan. Ang “kawal” ay dignidad at karaniwang katumbas ng “soldier,” samantalang ang “bantay” ay mas interpretatibo.
- source_word: τί ἄρα
  choice: tungkol sa kung ano na
  rationale: Ipinapahayag ang di-tuwirang tanong at ang himig ng pag-iisip o pagtataka na dala ng ἄρα; ang “na” ay likas na panandang Filipino sa tanong kung ano ang sinapit ni Pedro.
- source_word: ὁ Πέτρος
  choice: Pedro
  rationale: Ginamit ang nakaugaliang anyo ng pangalang Peter sa Filipino.
- source_word: ἐγένετο
  choice: ang nangyari kay
  rationale: Sa idyomang τί ... ἐγένετο na tumutukoy sa isang tao, ang diwa ay “kung ano ang nangyari sa” o “kung ano ang sinapit.” Natural sa Filipino ang “nangyari kay Pedro.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Pinanatili sa pangunahing teksto ang litotes na “hindi maliit na kaguluhan” upang hindi mawala ang retorikal na anyo ng Griyego. Inilagay ang pananda ng talababa [a] sa hulihan ng talata, kaugnay ng alternatibong mas idyomatikong pagpapahayag.
