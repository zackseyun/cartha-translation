  text: Κατ’ ἐκεῖνον δὲ τὸν καιρὸν ἐπέβαλεν Ἡρῴδης ὁ βασιλεὺς τὰς χεῖρας κακῶσαί τινας τῶν ἀπὸ τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/001.yaml
  text: About that time Herod the king laid hands on some from the church to mistreat them[a][b][c].
translation:
  language: tl
  text: Bandang panahong iyon[a], kumilos si Haring Herodes laban sa ilan sa mga kabilang sa iglesya[b] upang pagmalupitan sila[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Noong panahong iyon” o “Nang mga panahong iyon.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ipinatong ang mga kamay sa.” Dito, ang parirala ay tumutukoy sa mapanlabang pagkilos laban sa ilan sa iglesya.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “upang saktan sila” o “upang gawan sila ng masama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατ’ ἐκεῖνον δὲ τὸν καιρόν
  choice: Bandang panahong iyon
  rationale: Likas sa makabagong Tagalog ang “bandang” para sa κατά na tumutukoy sa panahong humigit-kumulang; hindi na ginamitan ng hiwalay na panandang pandiskurso ang δέ sapagkat sapat ang daloy ng salaysay.
- source_word: ἐπέβαλεν ... τὰς χεῖρας
  choice: kumilos ... laban sa
  rationale: Ipinahahayag nito ang mapanlabang pagkilos nang hindi nililimitahan ang kahulugan sa pagdakip lamang. Ang literal na larawan ng pagpapatong ng mga kamay ay hindi likas sa Tagalog sa ganitong diwa.
- source_word: Ἡρῴδης ὁ βασιλεύς
  choice: Haring Herodes
  rationale: Ito ang likas at marangal na ayos ng titulo at pangalan sa Tagalog.
- source_word: κακῶσαί
  choice: upang pagmalupitan sila
  rationale: Saklaw nito ang pananakit o masamang pagtrato at hindi nito ipinapasok ang mas teknikal na diwa ng “usigin.”
- source_word: τινας τῶν ἀπὸ τῆς ἐκκλησίας
  choice: ilan sa mga kabilang sa iglesya
  rationale: Malinaw nitong ipinakikitang ang tinutukoy ay ilang taong kaugnay at kabilang sa pamayanang Kristiyano.
theological_decisions:
- issue: Pagkakasalin sa ἐκκλησία
  choice: iglesya
  alternative: kapulungan; kongregasyon
  rationale: Sa konteksto ng Mga Gawa, tumutukoy ito sa pamayanang Kristiyano. Karaniwan at madaling maunawaan ang “iglesya,” samantalang maaaring maging labis na pangkalahatan ang “kapulungan.”
- issue: Lawak ng mapanlabang pagkilos ni Herodes
  choice: kumilos ... laban sa ... upang pagmalupitan
  alternative: ipinadakip; inusig
  rationale: Pinananatili ng salin ang malawak na diwa ng mapanlabang pagkilos at layuning manakit. Hindi ito nililimitahan sa pagdakip at hindi rin agad binibigyan ng teknikal na kahulugan ng relihiyosong pag-uusig.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang teknikal o denominasyonal na pananalita; pinanatili ang malawak na diwa ng pagkilos at layuning manakit sa tekstong Griyego.
