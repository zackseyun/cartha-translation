  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: κατασείσας δὲ αὐτοῖς τῇ χειρὶ σιγᾶν διηγήσατο αὐτοῖς πῶς ὁ κύριος αὐτὸν ἐξήγαγεν ἐκ τῆς φυλακῆς, εἶπέν ⸀τε· Ἀπαγγείλατε Ἰακώβῳ καὶ τοῖς ἀδελφοῖς ταῦτα. καὶ ἐξελθὼν ἐπορεύθη εἰς ἕτερον τόπον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/017.yaml
  text: But motioning to them with his hand to be silent[a], he explained to them how the Lord had brought him out of the prison. And he said, “Report these things to James and to the brothers.” Then he departed and went to another place.
translation:
  language: tl
  text: Ngunit sinenyasan niya sila sa pamamagitan ng kamay na tumahimik. Pagkatapos, isinalaysay niya sa kanila kung paano siya inilabas ng Panginoon mula sa bilangguan. Sinabi niya, “Ibalita ninyo ang mga bagay na ito kay Santiago at sa mga kapatid.[a]” Pagkatapos ay umalis siya at pumunta sa ibang lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay maaaring tumukoy sa mas malawak na komunidad ng mga mananampalataya.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασείσας ... τῇ χειρὶ σιγᾶν
  choice: sinenyasan niya sila sa pamamagitan ng kamay na tumahimik
  rationale: Likas sa modernong Filipino ang “sinenyasan” at malinaw nitong ipinapakita na isang kilos ng kamay ang ginamit upang patahimikin ang pangkat, nang hindi tinutukoy nang labis ang eksaktong galaw.
- source_word: διηγήσατο
  choice: isinalaysay niya
  rationale: Ipinahihiwatig ng pandiwa ang maayos o detalyadong pagkukuwento sa nangyari; ang “isinalaysay” ay marangal at angkop sa naratibo.
- source_word: πῶς
  choice: kung paano
  rationale: Pinananatili nito ang paraan bilang nilalaman ng salaysay ni Pedro, sa halip na gawing payak na “na.”
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Pinananatili ang karaniwang salin ng κύριος at hindi nilulutas kung ang tiyak na tinutukoy ay ang Panginoong Jesus o ang Diyos sa mas malawak na diwa.
- source_word: ἐξήγαγεν ... ἐκ τῆς φυλακῆς
  choice: inilabas ... mula sa bilangguan
  rationale: Tumpak na ipinahahayag ang pagliligtas palabas sa lugar ng pagkakakulong; mas angkop sa dignidad ng salaysay ang “bilangguan.”
- source_word: Ἀπαγγείλατε
  choice: Ibalita ninyo
  rationale: Ipinakikita ng pautos na anyo ang pagpapasa ng mahalagang ulat o mensahe at natural itong pakinggan sa Filipino.
- source_word: Ἰακώβῳ
  choice: kay Santiago
  rationale: “Santiago” ang nakagawiang anyo ng pangalan sa mga saling Tagalog ng Bagong Tipan at madaling makilala ng mga mambabasa.
- source_word: τοῖς ἀδελφοῖς
  choice: sa mga kapatid
  rationale: Ang “mga kapatid” ay natural na salin ng ἀδελφοί sa Filipino at maaaring tumukoy sa kapatirang mananampalataya nang hindi sapilitang nililimitahan sa kasarian.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: umalis siya at pumunta
  rationale: Pinananatili nito ang dalawang kilos—pag-alis sa kinaroroonan at pagpunta sa iba—nang hindi nagiging paulit-ulit o pilit.
- source_word: εἰς ἕτερον τόπον
  choice: sa ibang lugar
  rationale: Pinananatili ang sadyang di-tiyak na lokasyon ng Griyego.
theological_decisions:
- issue: Tiyak na tinutukoy ng ὁ κύριος
  choice: ang Panginoon
  alternative: ang Panginoong Jesus; o ang Diyos
  rationale: Hindi tahasang nililinaw ng talata ang referent. Pinananatili ng salin ang titulo at ang teolohikal na puwang ng orihinal.
- issue: Saklaw ng τοῖς ἀδελφοῖς
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga kapwa mananampalataya
  rationale: Maaaring tumukoy ang panlalaking pangmaramihang Griyego sa mga lalaking kasamahan o sa mas malawak na komunidad. Ang “mga kapatid” sa Filipino ay tapat sa metapora ng pagkakamag-anak at likas na hindi tiyak sa kasarian.
translation_notes:
  register: Modernong Filipino na may dignidad ng salaysay. Ginamit ang malinaw at karaniwang mga pandiwa, habang pinanatili ang bahagyang pormal na himig na angkop sa Kasulatan. Ang panipi at pagkakahati ng mga pangungusap ay tumutulong sa madaling pagbasa.
