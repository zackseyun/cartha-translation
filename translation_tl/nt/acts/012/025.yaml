  text: Βαρναβᾶς δὲ καὶ Σαῦλος ὑπέστρεψαν, ⸀εἰς Ἰερουσαλὴμ πληρώσαντες τὴν διακονίαν, ⸀συμπαραλαβόντες Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/025.yaml
  text: But Barnabas and Saul returned to Jerusalem after completing the ministry, taking along John, who was called Mark.
translation:
  language: tl
  text: Ngunit bumalik sa Jerusalem[a] sina Bernabe at Saulo matapos nilang tapusin ang paglilingkod, at isinama nila si Juan na tinatawag na Marcos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “mula sa Jerusalem” sa halip na “sa Jerusalem.”
    reason: textual_variant
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: bumalik
  rationale: Karaniwang kahulugan ng aorist na ὑποστρέφω ang pagbabalik; maikli at likas sa modernong Tagalog ang “bumalik.”
- source_word: εἰς Ἰερουσαλήμ
  choice: sa Jerusalem
  rationale: Karaniwang nagpapahiwatig ang εἰς ng patutunguhan. Kasama ng “bumalik,” malinaw na nangangahulugan ang “bumalik sa Jerusalem” ng return to Jerusalem, ayon sa ibinigay na tekstong SBLGNT.
- source_word: πληρώσαντες τὴν διακονίαν
  choice: matapos nilang tapusin ang paglilingkod
  rationale: Ipinapahayag ng πληρόω ang pagtapos o pagtupad, samantalang mas malawak ang διακονία kaysa sa isang tiyak na gawaing pantulong. Likas sa Tagalog ang sugnay na ito at pinananatili nito ang pagkakasunod ng mga pangyayari.
- source_word: διακονίαν
  choice: paglilingkod
  rationale: Saklaw ng διακονία ang serbisyo o ministeryo. Ang “paglilingkod” ay malinaw, dignified, at hindi labis na nililimitahan ang kahulugan sa pamamahagi ng tulong, bagaman iyon ang konteksto.
- source_word: συμπαραλαβόντες
  choice: isinama nila
  rationale: Ipinahihiwatig ng participle ang pagsama nila kay Juan sa kanilang paglalakbay. Natural at tuwiran sa Tagalog ang “isinama nila.”
- source_word: Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον
  choice: si Juan na tinatawag na Marcos
  rationale: Tuwirang inililipat nito ang passive na ἐπικληθέντα bilang katawagang ibinigay kay Juan, nang hindi idinaragdag ang salitang “kilala rin” na wala namang tahasang katumbas sa Griyego.
theological_decisions:
- issue: Tekstuwal na baryante tungkol sa pinanggalingan o patutunguhan
  choice: bumalik sa Jerusalem
  alternative: bumalik mula sa Jerusalem
  rationale: Ang ibinigay na SBLGNT ay may εἰς Ἰερουσαλήμ, na karaniwang nangangahulugang “sa/patungo sa Jerusalem.” Hindi tahimik na pinalitan ng salaysay-konteksto ang nakatalang critical text; ang makabuluhang baryanteng ἐξ Ἰερουσαλήμ ay iniingatan sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “paglilingkod” sa halip na mas teknikal na “ministeryo” upang maging madaling maunawaan at mapanatili ang lawak ng διακονία. Ang marker na [a] ay inilagay kaagad matapos ang pariralang kaugnay ng paglalakbay upang ituro ang makabuluhang baryante nang hindi nakaaabala sa daloy.
