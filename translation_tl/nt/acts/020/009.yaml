revisions:
- from: May isang binatang nagngangalang Eutico na nakaupo sa bukas na bintana. Habang nagsasalita nang matagal si Pablo, unti-unti siyang nakatulog nang mahimbing. Nang tuluyan siyang madaig ng antok, nahulog siya mula sa ikatlong palapag, at nang buhatin siya ay patay na siya.[a]
  to: May isang binatang nagngangalang Eutico na nakaupo sa bintana. Habang patuloy na nagsasalita si Pablo nang matagal, unti-unti siyang dinaig ng mahimbing na antok. Nang lubusan siyang dinaig ng antok, nahulog siya mula sa ikatlong palapag, at nang buhatin siya, patay na siya.[a]
  rationale: Inalis ang idinagdag na “bukas” upang hindi magdagdag ng detalyeng wala sa pinagmulan. Binago ang paglalarawan ng antok upang maipakita ang progresibong pagkadaig ng mahimbing na antok at ang kasunod na ganap na pagkadaig nito. Hindi binago ang tuwirang “patay na siya,” sapagkat ito ang tahasang sinasabi ng νεκρός.
