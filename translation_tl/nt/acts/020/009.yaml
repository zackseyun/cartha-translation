  text: ⸀καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος ἐπὶ τῆς θυρίδος, καταφερόμενος ὕπνῳ βαθεῖ διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον, κατενεχθεὶς ἀπὸ τοῦ ὕπνου ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω καὶ ἤρθη νεκρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/009.yaml
  text: And a certain young man named Eutychus[a], sitting in the window, was sinking into a deep sleep while Paul was speaking at length; and being overcome by sleep, he fell down from the third story and was picked up dead.
translation:
  language: tl
  text: May isang binatang nagngangalang Eutico na nakaupo sa bintana. Habang patuloy na nagsasalita si Pablo nang matagal, unti-unti siyang dinaig ng mahimbing na antok. Nang lubusan siyang dinaig ng antok, nahulog siya mula sa ikatlong palapag, at nang buhatin siya, patay na siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “at kinuha siyang patay.” Ang pandiwang Griyego ay maaaring mangahulugang “buhatin” o “kunin/dalhin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεζόμενος δέ τις νεανίας
  choice: May isang binata ... na nakaupo
  rationale: Ipinakikilala ng τις ang isang di-pa-kilalang tauhan, at ang νεανίας ay likas na isinasaling “binata.” Pinananatili ng “nakaupo” ang nagpapatuloy na kalagayan ng participle.
- source_word: ὀνόματι Εὔτυχος
  choice: nagngangalang Eutico
  rationale: Likas na salin sa modernong Filipino ng pariralang nagpapakilala ng pangalan; ginamit ang karaniwang anyong Filipino ng pangalan.
- source_word: ἐπὶ τῆς θυρίδος
  choice: sa bukas na bintana
  rationale: Ang θυρίς ay bintana o siwang na bukas. Nililinaw ng “bukas na bintana” ang puwestong pinagmulan ng pagkahulog nang hindi nagdaragdag ng tiyak na pasimano na hindi tahasang binanggit.
- source_word: καταφερόμενος ὕπνῳ βαθεῖ
  choice: unti-unti siyang nakatulog nang mahimbing
  rationale: Ipinahihiwatig ng participle ang unti-unting pagdaig ng mahimbing na pagtulog. Natural sa Filipino ang ganitong paglalarawan ng proseso.
- source_word: διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον
  choice: Habang nagsasalita nang matagal si Pablo
  rationale: Ang genitive absolute ay ginawang sugnay na pangyayari. Sa kontekstong ito, ang διαλέγομαι ay tumutukoy sa patuloy na pagsasalita o pagpapaliwanag, at ang ἐπὶ πλεῖον ay “nang matagal.”
- source_word: κατενεχθεὶς ἀπὸ τοῦ ὕπνου
  choice: Nang tuluyan siyang madaig ng antok
  rationale: Inilalarawan ng aorist passive participle ang tiyak na sandaling lubusan siyang nadaig ng pagtulog, kasunod ng naunang unti-unting pagkaidlip.
- source_word: ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω
  choice: nahulog siya mula sa ikatlong palapag
  rationale: Tuwirang inilalarawan ng τρίστεγον ang ikatlong palapag; sapat nang ipinahihiwatig ng “nahulog” ang pababang kilos ng κάτω.
- source_word: ἤρθη νεκρός
  choice: nang buhatin siya ay patay na siya
  rationale: Ang passive na ἤρθη ay maaaring tumukoy sa pagbuhat o pagkuha sa kanya matapos mahulog. Ang “patay na siya” ay nagpapanatili sa tuwirang pahayag ng νεκρός at hindi ito pinahihinang gawing tila o mukhang patay lamang.
theological_decisions:
- issue: Kung ang νεκρός ay dapat palambutin bilang “tila patay” o “akala nilang patay”
  choice: patay na siya
  alternative: tila patay / akala nilang patay
  rationale: Tuwirang sinasabi ng Griyego na νεκρός, nang walang salitang nagpapahiwatig ng pag-aalinlangan. Pinananatili ng salin ang malinaw na pahayag at ang tensiyong teolohikal ng salaysay.
- issue: Kung ang ἤρθη ay dapat gawing tiyak na “dinala” sa halip na “binuhat”
  choice: nang buhatin siya
  alternative: nang kunin siya / dinala siyang patay
  rationale: Malawak ang saklaw ng αἴρω at maaaring mangahulugang buhatin, kunin, o dalhin. Ang “buhatin” ang pinakaangkop sa agarang pangyayari matapos ang pagkahulog, habang inilalahad sa talababa ang leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino na natural at marangal ang ginamit. Hinati sa maiikling pangungusap ang mahabang Griyegong pangungusap upang maging malinaw sa karaniwang mambabasa, habang pinananatili ang pagkakasunod-sunod ng mga pangyayari at ang tuwirang pahayag na patay ang binata.
