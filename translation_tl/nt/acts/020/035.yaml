id: ACT.20.35
reference: Acts 20:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι αὐτὸς εἶπεν Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/035.yaml
  text: In everything I showed you that by laboring in this way it is necessary to help the weak[a], and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’
translation:
  language: tl
  text: Sa lahat ng bagay ay ipinakita ko sa inyo na sa ganitong pagpapagal ay dapat tulungan ang mahihina[a] at alalahanin ang mga salita ng Panginoong Jesus, na siya mismo ay nagsabi, “Higit na pinagpala ang magbigay kaysa tumanggap.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “alalayan ang mahihina.” Maaaring magpahiwatig ang pandiwang Griego ng patuloy na pagtulong, hindi lamang ng panandaliang saklolo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: Sa lahat ng bagay
  rationale: Ginamit na pang-abay kaugnay ng ὑπέδειξα, na tumutukoy sa kabuuan ng halimbawang ipinakita ni Pablo.
- source_word: ὑπέδειξα
  choice: ipinakita ko
  rationale: Likas at tuwirang salin na maaari ring magpahiwatig ng pagpapakita sa pamamagitan ng halimbawa.
- source_word: οὕτως κοπιῶντας
  choice: sa ganitong pagpapagal
  rationale: Pinananatili ang pagtukoy sa paraan ng masikap at nakapapagod na paggawa ni Pablo.
- source_word: δεῖ
  choice: dapat
  rationale: Malinaw na naghahayag ng pangangailangan o pananagutan nang hindi nagdaragdag ng tahasang simuno.
- source_word: ἀντιλαμβάνεσθαι
  choice: tulungan
  rationale: Karaniwan at malinaw sa modernong Tagalog; maaaring saklawin ng pandiwa ang patuloy na pag-alalay, kaya inilakip ang alternatibo sa talababa.
- source_word: τῶν ἀσθενούντων
  choice: ang mahihina
  rationale: Pinananatili ang malawak na kahulugan ng mga taong mahina o nangangailangan nang hindi nililimitahan sa karamdaman, kahirapan, o espirituwal na kahinaan.
- source_word: μνημονεύειν τε
  choice: at alalahanin
  rationale: Pinananatili ang pagkakaugnay nito sa naunang infinitive at ang diwa ng patuloy na pagsasaisip.
- source_word: τῶν λόγων τοῦ κυρίου Ἰησοῦ
  choice: ang mga salita ng Panginoong Jesus
  rationale: Tuwirang isinasalin ang λόγων at pinananatili ang titulong κύριος bilang Panginoon.
- source_word: αὐτὸς εἶπεν
  choice: siya mismo ang nagsabi
  rationale: Pinananatili ang diin ng emphatic pronoun na αὐτός.
- source_word: Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν
  choice: Higit na pinagpala ang magbigay kaysa tumanggap
  rationale: Natural at marangal na pahayag sa Tagalog na pinananatili ang paghahambing at ang diwa ng μακάριον.
theological_decisions:
- issue: Saklaw ng “mahihina”
  choice: mahihina
  alternative: mahihirap; maysakit; mahihina sa pananampalataya
  rationale: Malawak ang kahulugan ng ἀσθενούντων. Hindi tinutukoy ng talata kung pisikal, materyal, panlipunan, o espirituwal ang kahinaan, kaya hindi ito nilimitahan.
- issue: Lakas ng μακάριον
  choice: pinagpala
  alternative: maligaya; higit na nagbibigay ng kaligayahan
  rationale: Ang “pinagpala” ay nagpapanatili sa teolohikal at evaluative na bigat ng salita nang hindi ito ginagawang damdamin lamang.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “pagpapagal” upang mapanatili ang bigat ng masikap na paggawa, at iniwasang tukuyin nang labis kung anong uri ng kahinaan ang tinutukoy.
