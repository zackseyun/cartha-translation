id: ACT.20.16
reference: Acts 20:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀κεκρίκει γὰρ ὁ Παῦλος παραπλεῦσαι τὴν Ἔφεσον, ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι ἐν τῇ Ἀσίᾳ, ἔσπευδεν γὰρ εἰ δυνατὸν ⸀εἴη αὐτῷ τὴν ἡμέραν τῆς πεντηκοστῆς γενέσθαι εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/016.yaml
  text: For Paul had decided to sail past Ephesus[a], so that he might not have to spend time in Asia; for he was hurrying to be in Jerusalem, if possible[b], on the day of Pentecost.
translation:
  language: tl
  text: Sapagkat ipinasiya na ni Pablo na lampasan ang Efeso sa paglalayag, upang hindi siya magtagal sa Asia[a]. Nagmamadali kasi siyang makarating sa Jerusalem sa araw ng Pentecostes, kung maaari[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Asia” rito ay ang lalawigang Romano ng Asia sa kanlurang bahagi ng Asia Minor, hindi ang makabagong kontinente ng Asia.
    reason: cultural_note
  - marker: b
    text: O “mapunta sa Jerusalem pagsapit ng araw ng Pentecostes.” Maaaring idiin ng Griyegong pananalita ang pagdating niya roon sa araw na iyon o ang pagiging naroon niya pagsapit ng araw na iyon.
    reason: alternative_reading
lexical_decisions:
- source_word: κεκρίκει
  choice: ipinasiya na
  rationale: Ipinahihiwatig ng anyong pluperfect na buo na ang pasiya ni Pablo bago ang paglalakbay na isinasalaysay.
- source_word: παραπλεῦσαι τὴν Ἔφεσον
  choice: lampasan ang Efeso sa paglalayag
  rationale: Pinananatili nito ang tiyak na diwang pandagat ng pandiwa at malinaw na hindi sila hihinto sa Efeso.
- source_word: ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι
  choice: upang hindi siya magtagal
  rationale: Natural na Tagalog ito para sa idyomatikong Griyegong parirala tungkol sa pag-iwas sa paggugol o pagkaantala ng panahon.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: sa Asia
  rationale: Pinananatili sa pangunahing teksto ang pangalang heograpiko; nililinaw sa talababa na lalawigang Romano ang tinutukoy.
- source_word: ἔσπευδεν
  choice: Nagmamadali kasi siya
  rationale: Inilalarawan ng imperfect ang nagpapatuloy na pagmamadali sa konteksto ng paglalakbay.
- source_word: εἰ δυνατὸν εἴη αὐτῷ
  choice: kung maaari
  rationale: Maikli at natural na pagpapahayag ng kondisyon o posibilidad, nang hindi ginagawang tiyak ang plano.
- source_word: τὴν ἡμέραν τῆς πεντηκοστῆς γενέσθαι εἰς Ἱεροσόλυμα
  choice: makarating sa Jerusalem sa araw ng Pentecostes
  rationale: Ang γενέσθαι εἰς ay likas na maaaring tumukoy sa pagdating; pinananatili sa talababa ang posibleng diin sa pagiging naroon sa araw na iyon.
- source_word: πεντηκοστῆς
  choice: Pentecostes
  rationale: Ito ang kinikilalang modernong Tagalog na pangalan ng kapistahan.
theological_decisions:
- issue: Kung ang layunin ni Pablo ay makarating mismo sa araw ng Pentecostes o naroon na pagsapit nito
  choice: makarating sa Jerusalem sa araw ng Pentecostes
  alternative: mapunta sa Jerusalem pagsapit ng araw ng Pentecostes
  rationale: Maaaring idiin ng Griyegong pahayag ang pagdating doon sa araw na iyon o ang pagiging naroon na sa takdang araw; hindi sapat ang konteksto upang tuluyang alisin ang alinman, kaya binanggit ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lampasan … sa paglalayag” upang mapanatili ang pandagat na kahulugan, at hinati sa dalawang pangungusap para sa likas na daloy nang hindi binabago ang ugnayang sanhi.
