  text: ἐγὼ ⸀οἶδα ὅτι εἰσελεύσονται μετὰ τὴν ἄφιξίν μου λύκοι βαρεῖς εἰς ὑμᾶς μὴ φειδόμενοι τοῦ ποιμνίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/029.yaml
  text: I know that after my departure fierce wolves will come in among you[b][a], not sparing the flock.
translation:
  language: tl
  text: Alam kong pagkatapos ng pag-alis ko[a], papasok sa gitna ninyo ang mababangis na lobo[b] na hindi magpapakita ng awa sa kawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “pagkatapos ng pagdating ko.” Sa konteksto, ang diwa ay “pagkatapos ng pag-alis ko.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “malulupit na lobo.” Ang pang-uri sa Griyego ay maaaring magpahiwatig ng matindi, mapaniil, o marahas na kalupitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Alam ko
  rationale: Tuwirang ipinahahayag nito ang tiyak na kaalaman ni Pablo, hindi lamang ang kaniyang palagay.
- source_word: εἰσελεύσονται
  choice: papasok
  rationale: Pinananatili nito ang larawan ng mga lobong papasok sa komunidad at natural ang anyong panghinaharap sa Tagalog.
- source_word: μετὰ τὴν ἄφιξίν μου
  choice: pag-alis ko
  rationale: Bagaman karaniwang tumutukoy ang ἄφιξις sa pagdating, ipinakikita ng konteksto na nagbababala si Pablo tungkol sa mangyayari kapag wala na siya sa piling nila. Nililinaw sa talababa ang literal na anyo upang mapanatili ang tunay na tensiyong leksikal.
- source_word: λύκοι βαρεῖς
  choice: mababangis na lobo
  rationale: Ang βαρεῖς ay literal na may diwang 'mabigat' ngunit dito ay nagpapahiwatig ng malupit, mapaniil, o marahas na panganib. Ang 'mababangis' ay natural sa larawan ng mga lobo at malinaw sa modernong Tagalog.
- source_word: εἰς ὑμᾶς
  choice: sa gitna ninyo
  rationale: Ipinahihiwatig ng εἰς ang pagpasok ng mga lobo sa mismong komunidad; malinaw itong naihahayag ng 'sa gitna ninyo.'
- source_word: μὴ φειδόμενοι
  choice: hindi nila kaaawaan
  rationale: Natural nitong ipinahahayag sa Tagalog na hindi nila ililigtas o pakikitunguhan nang may awa ang kawan, habang iniiwasang idagdag kung paano nila ito sasaktan.
- source_word: τοῦ ποιμνίου
  choice: ang kawan
  rationale: Pinananatili nito ang pastoral na metapora at tumutugma sa larawan ng mga lobo.
theological_decisions:
- issue: Metaporikal na kahulugan ng 'mga lobo'
  choice: Pinanatili ang metaporang 'mababangis na lobo.'
  alternative: mga bulaang guro; mga mapanirang tao; mga mang-aapi
  rationale: Hindi tahasang tinutukoy ng talata kung sino ang kinakatawan ng mga lobo. Ang pagpapanatili sa metapora ay nag-iingat sa puwersa at saklaw ng pahayag nang hindi ito nililimitahan sa isang interpretasyon.
- issue: Kahulugan ng ἄφιξις sa konteksto
  choice: Isinalin bilang 'pag-alis ko,' na may talababa tungkol sa literal na 'pagdating ko.'
  alternative: pagdating ko; pagparito ko
  rationale: Ang takbo ng pahayag ay babala tungkol sa mangyayari kapag wala na si Pablo sa kanila. Gayunman, dahil karaniwang nangangahulugang 'pagdating' ang pangngalan, hayagang pinanatili sa talababa ang leksikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pastoral na larawan ng mga lobo at ng kawan; ginamit ang 'sa gitna ninyo' upang likas na maipahayag ang pagpasok sa komunidad. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto.
