id: ACT.20.18
reference: Acts 20:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς δὲ παρεγένοντο πρὸς αὐτὸν εἶπεν αὐτοῖς· Ὑμεῖς ἐπίστασθε ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην εἰς τὴν Ἀσίαν πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/018.yaml
  text: When they came to him[a], he said to them[b], “You yourselves know how I lived among you the whole time from the first day that I set foot in Asia,”
translation:
  language: tl
  text: Nang dumating sila sa kinaroroonan niya, sinabi niya sa kanila, “Kayo mismo ang nakaaalam kung paano ako namuhay kasama ninyo sa buong panahong iyon, mula sa unang araw na tumuntong ako sa Asia[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Asia” rito ay ang lalawigang Romano ng Asia sa kanlurang bahagi ng Asia Minor, hindi ang makabagong kontinente ng Asia.
    reason: cultural_note
lexical_decisions:
- source_word: παρεγένοντο πρὸς αὐτόν
  choice: dumating sila sa kinaroroonan niya
  rationale: Ipinahahayag nito kapwa ang pagdating ng mga matanda at ang paglapit nila sa lugar na kinaroroonan ni Pablo; mas natural ito sa Tagalog kaysa sa literal na “dumating sila sa kanya.”
- source_word: Ὑμεῖς ἐπίστασθε
  choice: Kayo mismo ang nakaaalam
  rationale: Pinananatili ng “kayo mismo” ang diin ng hayag na panghalip na Ὑμεῖς, at ang “nakaaalam” ay nagpapahiwatig ng kaalamang mula sa personal na karanasan.
- source_word: ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην
  choice: mula sa unang araw na tumuntong ako
  rationale: Pinananatili ng “tumuntong” ang matingkad na larawan ng ἐπιβαίνω, habang malinaw na itinatakda ng “mula sa unang araw” ang simula ng panahong tinutukoy.
- source_word: εἰς τὴν Ἀσίαν
  choice: sa Asia
  rationale: Ang teksto ay payak na nagsasabing Ἀσία. Pinanatili ang pangalang “Asia” sa pangunahing teksto at ipinaliwanag sa talababa na lalawigang Romano ang tinutukoy.
- source_word: πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην
  choice: kung paano ako namuhay kasama ninyo sa buong panahong iyon
  rationale: Natural na ipinahahayag ng “kung paano ako namuhay” ang paraan ng pamumuhay o pakikitungo ni Pablo, ngunit ang alternatibong diin sa patuloy niyang presensiya ay nananatiling tunay na posibilidad at itinatala sa talababa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakaaalam” at “namuhay” bilang karaniwang anyong nauunawaan ng pangkalahatang mambabasa. Gayunman, kailangang mailagay sa pangunahing teksto ang marker na [b] upang tumugma sa talababa.
