  text: Ἡμεῖς δὲ ⸀προελθόντες ⸀ἐπὶ τὸ πλοῖον ἀνήχθημεν ἐπὶ τὴν Ἆσσον, ἐκεῖθεν μέλλοντες ἀναλαμβάνειν τὸν Παῦλον, οὕτως γὰρ ⸂διατεταγμένος ἦν⸃ μέλλων αὐτὸς πεζεύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/013.yaml
  text: But we[a], having gone ahead to the ship, set sail for Assos, intending to take Paul on board from there, for so he had arranged[b], since he himself intended to go by land.
translation:
  language: tl
  text: Ngunit nauna kaming pumunta sa barko at naglayag patungong Assos. Balak naming isakay doon si Pablo, sapagkat gayon ang isinaayos niya,[a] dahil siya mismo ay may balak maglakbay sa lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sapagkat gayon ang naisaayos.” Pormal na pasibo ang anyong Griego, bagaman sa konteksto ay malamang na tumutukoy ito sa sariling pagsasaayos o tagubilin ni Pablo.
    reason: alternative_reading
  - marker: b
    text: O “dahil siya mismo ay may balak maglakad.” Ang pandiwang Griego ay tumutukoy sa paglalakbay sa lupa, at maaari itong partikular na mangahulugang paglalakad, bilang kaibahan sa paglalayag ng pangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθόντες
  choice: nauna
  rationale: Ipinahihiwatig ng aorist participle na naunang ginawa ng pangkat ng tagapagsalaysay ang kilos bago sila naglayag; natural at malinaw ang “nauna” sa modernong Tagalog.
- source_word: ἐπὶ τὸ πλοῖον
  choice: sa barko
  rationale: Ipinakikita ng ἐπί na patungo o sakay sa barko; sapat ang “sa barko” dahil nililinaw ng kasunod na “naglayag” na sumakay sila rito.
- source_word: ἀνήχθημεν
  choice: naglayag
  rationale: Sa kontekstong pandagat, ang ἀνάγω ay nangangahulugang pumalaot o magsimulang maglayag. Ang “naglayag” ay likas at madaling maunawaan.
- source_word: ἐπὶ τὴν Ἆσσον
  choice: patungong Assos
  rationale: Ipinahahayag nito ang destinasyon ng paglalayag. Pinananatili ang karaniwang transliterasyong “Assos.”
- source_word: μέλλοντες ἀναλαμβάνειν
  choice: Balak naming isakay
  rationale: Ang μέλλω ay nagsasaad dito ng balak, at ang ἀναλαμβάνω sa kontekstong ito ay ang pagsakay o pagtanggap kay Pablo sa barko.
- source_word: ἐκεῖθεν
  choice: doon
  rationale: Tumutukoy ito sa Assos bilang lugar kung saan nila isasakay si Pablo. Mas natural sa Tagalog ang “doon” kaysa sa literal na “mula roon” sa pangungusap na ito.
- source_word: διατεταγμένος ἦν
  choice: gayon ang isinaayos niya
  rationale: Ang anyo ay periphrastic pluperfect passive, ngunit sa konteksto ay malamang na tumutukoy sa naunang pagsasaayos o tagubilin ni Pablo. Pinananatili ng “gayon ang isinaayos niya” ang ideya ng naunang plano habang inilalagay sa talababa ang pormal na pasibong posibilidad.
- source_word: μέλλων αὐτὸς πεζεύειν
  choice: yamang siya mismo ay nagbalak na maglakbay sa lupa
  rationale: Binibigyang-diin ng αὐτός si Pablo. Ang πεζεύω ay paglalakbay sa lupa, karaniwang naglalakad, na tahasang ikinokontra sa paglalayag ng pangkat.
- source_word: δὲ
  choice: Ngunit
  rationale: Minamarkahan ng δέ ang banayad na pagkakaiba sa pagitan ng ginawa ng pangkat at ng ginawa ni Pablo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “barko,” “naglayag,” at “Balak” bilang karaniwang pananalita sa salaysay ng paglalakbay. Pinanatili sa mga talababa ang tunay na kalabuan ng pasibong διατεταγμένος ἦν at ang saklaw ng πεζεύειν sa pagitan ng paglalakbay sa lupa at partikular na paglalakad.
