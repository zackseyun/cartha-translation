base_translation:
  language: en
  yaml_path: translation/nt/acts/020/007.yaml
  text: On the first day of the week[a], when we had gathered to break bread, Paul was speaking to them, intending to depart the next day[b], and he prolonged the message until midnight.
translation:
  language: tl
  text: Sa unang araw ng linggo, nang nagkatipon kami upang maghati-hati ng tinapay[a], nakikipag-usap si Pablo sa kanila; dahil nakatakda siyang umalis kinabukasan[b], pinalawig niya ang kanyang pagsasalita hanggang hatinggabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “para sa paghahati-hati ng tinapay.” Maaaring tumukoy ang parirala sa sama-samang pagkain at maaari ring magpahiwatig ng Hapunan ng Panginoon.
    reason: lexical_alternative
  - marker: b
    text: O, “Nakikipag-usap si Pablo sa kanila, yamang malapit na siyang umalis kinabukasan, at pinalawig niya ang kanyang pagsasalita hanggang hatinggabi.”
    reason: syntactic_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων
  choice: Noong unang araw ng linggo
  rationale: Ang parirala ay karaniwang idyoma sa Koine para sa unang araw ng linggo. Hindi isinalin nang literal na “isa sa mga Sabbath,” na makapagliligaw sa makabagong mambabasa. Hindi na rin ginawang tahasang salita ang banayad na pang-ugnay na δέ, sapagkat likas na naipahihiwatig ng daloy sa Tagalog.
- source_word: συνηγμένων ἡμῶν
  choice: nang nagkatipon kami
  rationale: Inilalahad ng genitive absolute ang kalagayan o pangyayaring kasabay ng pangunahing kilos, at pinananatili ang unang panauhang maramihan ng salaysay.
- source_word: κλάσαι ἄρτον
  choice: upang magputol-putol ng tinapay
  rationale: Pinananatili ang kongkretong idyoma at ang layuning ipinahahayag ng infinitive, nang hindi ito nililimitahan sa karaniwang salu-salo lamang o tahasang tinutukoy bilang Hapunan ng Panginoon.
- source_word: διελέγετο αὐτοῖς
  choice: nakikipag-usap si Pablo sa kanila
  rationale: Ang imperfect ay nagsasaad ng nagpapatuloy na kilos, at ang “nakikipag-usap” ay nagpapanatili sa posibleng interaktibong diwa ng διαλέγομαι sa halip na gawing purong monologo o pangangaral.
- source_word: μέλλων ἐξιέναι τῇ ἐπαύριον
  choice: Dahil aalis siya kinabukasan
  rationale: Ipinahahayag nito ang nalalapit na pag-alis ni Pablo sa susunod na araw. Ang “dahil” ay natural na naghahatid ng ugnayang pangyayari na ipinahihiwatig ng konteksto, habang nililinaw sa talababa ang mas di-tiyak na alternatibong pagkakaugnay.
- source_word: παρέτεινέν τε τὸν λόγον
  choice: ipinagpatuloy niya ang kanyang pagsasalita
  rationale: Ang παρατείνω ay tumutukoy sa pagpapahaba o pagpapatuloy, at ang λόγος dito ay ang binibigkas na pahayag o talakayan ni Pablo. Natural sa Tagalog ang “ipinagpatuloy ... ang pagsasalita” at hindi nito ipinapalagay na sermon lamang iyon.
- source_word: μέχρι μεσονυκτίου
  choice: hanggang hatinggabi
  rationale: Tuwirang ipinahahayag ang hangganang temporal ng pagsasalita ni Pablo.
theological_decisions:
- issue: Kahulugan ng “magputol-putol ng tinapay” sa pagtitipon ng mga unang Cristiano
  choice: Pinanatili ang idyomang “magputol-putol ng tinapay.”
  alternative: “magsalo-salo sa pagkain” o “ipagdiwang ang Hapunan ng Panginoon”
  rationale: Maaaring tumukoy ang parirala sa sama-samang pagkain at maaari ring magkaroon ng kaugnayan sa Hapunan ng Panginoon. Hindi nilulutas ng salin ang teolohikal na pagkakaibang hindi tahasang nilulutas ng teksto.
- issue: Kaugnayan ng nalalapit na pag-alis ni Pablo sa kanyang mahabang pagsasalita
  choice: 'Isinalin sa pangunahing teksto bilang dahilan: “Dahil aalis siya kinabukasan.”'
  alternative: “Si Pablo, na nakatakdang umalis kinabukasan, ay nakikipag-usap sa kanila...”
  rationale: Ang participle na μέλλων ay malinaw na nagsasaad ng nalalapit na pag-alis ngunit hindi tahasang minamarkahan ang ugnayang sanhi. Natural sa konteksto ang pagbasa bilang dahilan, habang pinananatili sa talababa ang mas pormal at di-tiyak na pagkakaugnay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang salaysay sa unang panauhang maramihan at iniwasan ang mga salitang nagtatakda ng isang denominasyonal na pagbasa. Ang “magputol-putol ng tinapay” ay sadyang bahagyang kongkreto upang mapanatili ang idyoma ng Griyego, samantalang ipinaliliwanag ng talababa ang saklaw ng kahulugan nito.
