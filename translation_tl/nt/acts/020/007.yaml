  to: Sa unang araw ng linggo, nang nagkatipon kami upang maghati-hati ng tinapay[a], nakikipag-usap si Pablo sa kanila; dahil nakatakda siyang umalis kinabukasan[b], pinalawig niya ang kanyang pagsasalita hanggang hatinggabi.
