  yaml_path: translation/nt/acts/020/017.yaml
  text: From Miletus he sent to Ephesus and called for the elders of the church[a].
translation:
  language: tl
  text: Mula sa Mileto, nagpadala siya sa Efeso at ipinatawag ang mga matatanda ng iglesya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Nagpadala siya sa Efeso upang tawagin ang mga matatanda ng iglesya.” Pinagsasama ng Griyego ang “nagpadala sa Efeso” at “ipinatawag,” na nagpapahiwatig na nagpadala siya ng mensahe o mga sugo upang papuntahin sila sa kanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς Μιλήτου
  choice: Mula sa Mileto
  rationale: Ang ἀπό na may genitive ay nagsasaad ng pinanggalingang lugar. Banayad lamang ang δέ at hindi kailangang tumbasan ng tahasang panandang temporal o matinding pagsalungat sa Filipino.
- source_word: πέμψας εἰς Ἔφεσον
  choice: nagpadala siya sa Efeso
  rationale: Ang aorist participle na πέμψας ay inilalahad bilang naunang kilos na kaugnay ng pangunahing pandiwa. Hindi tahasang sinasabi ng Griyego kung mensahe o mga sugo ang ipinadala, kaya hindi iyon idinagdag sa pangunahing teksto.
- source_word: μετεκαλέσατο
  choice: ipinatawag
  rationale: Ipinahihiwatig ng middle verb ang pagpapasundo o pagpapapunta sa mga tao sa kinaroroonan niya. Natural sa Filipino ang “ipinatawag” at hindi nito binibigyan ng labis na mapilit na tono ang paanyaya.
- source_word: τοὺς πρεσβυτέρους
  choice: ang mga matatanda
  rationale: Sa kontekstong ito, tumutukoy ang πρεσβύτεροι sa kinikilalang mga pinuno ng pamayanang Cristiano. Pinananatili ng “mga matatanda” ang tradisyonal at leksikal na diwa nang hindi nag-aangkat ng katawagang nakatali sa isang denominasyon.
- source_word: τῆς ἐκκλησίας
  choice: ng iglesya
  rationale: Ang ἐκκλησία sa Lucas–Mga Gawa ay karaniwang tumutukoy sa pamayanang Cristiano. Ang “iglesya” ay natural at malawak na nauunawaang katawagan sa modernong Filipino.
theological_decisions:
- issue: Kahulugan ng πρεσβυτέρους sa konteksto ng iglesya
  choice: mga kinikilalang pinuno na tinawag na “mga matatanda”
  alternative: mga lalaking matanda lamang; o teknikal na “mga presbitero”
  rationale: Ipinakikita ng salaysay na ang mga tinutukoy ay mga kinatawan o pinuno ng iglesya sa Efeso. Gayunman, hindi nililinaw ng talata ang isang tiyak na sistema ng pamamahala, kaya iniwasan ang katawagang maaaring magpahiwatig ng mas huling estrukturang denominasyonal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Mileto” at “Efeso,” na mga karaniwang anyong Filipino ng mga pangalan ng lugar. Pinanatili ang bahagyang pagiging di-tiyak ng paraan ng pagpapadala sa pangunahing teksto at ipinaliwanag ito sa talababa.
