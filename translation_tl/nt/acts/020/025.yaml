  text: Καὶ νῦν ἰδοὺ ἐγὼ οἶδα ὅτι οὐκέτι ὄψεσθε τὸ πρόσωπόν μου ὑμεῖς πάντες ἐν οἷς διῆλθον κηρύσσων τὴν ⸀βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/025.yaml
  text: And now, look, I know that none of you among whom I went about proclaiming the kingdom will see my face again.
translation:
  language: tl
  text: 'At ngayon, tandaan ninyo: alam kong wala na sa inyong lahat na pinuntahan ko sa aking paglalakbay habang ipinangangaral ko ang kaharian ang muling makakakita ng mukha ko.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ νῦν ἰδοὺ
  choice: At ngayon
  rationale: Ang ἰδού ay panandang pantawag-pansin sa diskurso; sa natural na modernong Tagalog, sapat nang ihatid ang paglipat at pagdiriin sa “At ngayon” kaysa sa literal ngunit di-likas na “tingnan ninyo.”
- source_word: οὐκέτι ὄψεσθε τὸ πρόσωπόν μου
  choice: hindi na muling makikita ... ang mukha ko
  rationale: Pinananatili ang konkretong idyomang Griyego na “makikita ang mukha ko” at malinaw na ipinahahayag ng “hindi na muling” ang kahulugang hindi na sila magkikita.
- source_word: ἐν οἷς διῆλθον
  choice: kayong mga dinalaw ko
  rationale: Ipinahahayag ang paglalakbay ni Pablo sa gitna nila sa natural na Tagalog, nang hindi ipinapalagay na bawat indibidwal ay personal niyang pinuntahan.
- source_word: κηρύσσων τὴν βασιλείαν
  choice: habang ipinangangaral ko ang kaharian
  rationale: Ang “ipinangangaral” ay angkop sa pampublikong pagpapahayag ng κηρύσσω; pinananatili ang payak na “kaharian” dahil gayon din ang maikling anyo sa Griyego.
theological_decisions:
- issue: Ang tinutukoy ng “kaharian”
  choice: ang kaharian
  alternative: ang kaharian ng Diyos
  rationale: Hindi idinaragdag ang “ng Diyos,” bagaman iyon ang malinaw na konteksto, sapagkat wala ang parirala sa napiling tekstong SBLGNT at mahalagang panatilihin ang anyo ng pinagmulan.
- issue: Saklaw ng pahayag na hindi na makikita ang mukha ni Pablo
  choice: hindi na muling makikita ng sinuman sa inyong lahat
  alternative: kayong lahat ... ay hindi na makikita ang mukha ko
  rationale: Inihahatid ang οὐκέτι at πάντες bilang mariing pahayag ni Pablo ayon sa kaniyang nalalaman, nang hindi nilulutas ang mga tanong tungkol sa mga susunod na pangyayari.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Iniwasan ang sobrang literal na “narito” o “tingnan ninyo” para sa ἰδού, ngunit pinanatili ang biblikal na larawang “makikita ... ang mukha ko.”
