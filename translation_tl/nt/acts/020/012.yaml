  text: ἤγαγον δὲ τὸν παῖδα ζῶντα, καὶ παρεκλήθησαν οὐ μετρίως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/012.yaml
  text: And they took the boy away alive[a], and were not a little comforted.
translation:
  language: tl
  text: Dinala nila palayo ang binata na buhay, at labis silang naaliw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hindi katamtaman,” isang idyomang nangangahulugang labis silang naaliw.
    reason: Ipinaliliwanag ang litotes na οὐ μετρίως at ang idiomatikong diwa nito.
lexical_decisions:
- source_word: ἤγαγον
  choice: Dinala nila
  rationale: Ang ἄγω ay maaaring mangahulugang dalhin o akayin. Ang “dinala nila” ay natural sa Filipino at hindi ipinapalagay kung saan nila dinala ang binata.
- source_word: παῖδα
  choice: binata
  rationale: Maaaring tumukoy ang παῖς sa isang bata, batang lalaki, o lingkod. Dito, si Eutico ang tinutukoy, na tinawag nang νεανίας (‘binata/batang lalaki’) sa talata 9; ang “binata” ay natural at hindi nagpapahiwatig na lingkod siya.
- source_word: ζῶντα
  choice: buhay
  rationale: Inilalarawan ng participle ang kalagayan ng binata nang dalhin nila siya. Tuwiran at natural dito ang “buhay.”
- source_word: παρεκλήθησαν
  choice: naaliw
  rationale: Saklaw ng παρακαλέω ang pag-aliw, pagpapalakas ng loob, at pagpapasigla. Dahil inakala nilang namatay si Eutico at nakita nila siyang buhay, ang “naaliw” angkop sa ginhawa at kaaliwang naranasan nila.
- source_word: οὐ μετρίως
  choice: labis-labis
  rationale: Ang literal na ‘hindi katamtaman’ ay isang litotes na nangangahulugang napakalaki o labis. Inihahayag ng “labis-labis” ang diin sa natural na modernong Filipino.
