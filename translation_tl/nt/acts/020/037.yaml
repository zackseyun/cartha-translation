lexical_decisions:
- source_word: ἱκανὸς δὲ κλαυθμὸς ἐγένετο πάντων
  choice: Labis silang lahat na umiyak
  rationale: Likas na ipinahahayag sa modernong Tagalog ang matinding pag-iyak ng lahat, sa halip na sundan ang masalimuot na anyong nominal ng Griyego.
- source_word: ἐπιπεσόντες ἐπὶ τὸν τράχηλον τοῦ Παύλου
  choice: niyakap nila si Pablo sa leeg
  rationale: Ipinapahayag nito ang idyomatikong mahigpit na pagyakap habang pinananatili ang tahasang larawan ng leeg sa pinagmulang teksto.
- source_word: κατεφίλουν αὐτόν
  choice: paulit-ulit siyang hinalikan
  rationale: Ang imperpektong pandiwa ay nagpapahiwatig ng nagpapatuloy o inuulit na paghalik; malinaw itong naihahatid ng “paulit-ulit.”
