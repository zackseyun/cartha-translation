  verdict: revise
  source_fidelity: The draft correctly conveys Paul's refusal to withhold beneficial instruction, the paired actions of declaring and teaching, and the public and house-to-house settings. However, “hindi ako umurong sa pagpapahayag” is a somewhat literal and less idiomatic Tagalog representation of ὑπεστειλάμην with its infinitives. “Hindi ako nag-atubiling” directly and naturally expresses the intended sense here without adding meaning.
  naturalness: “Kung paanong hindi ako nag-atubiling ipahayag ... at turuan kayo ...” is fluent modern Filipino Tagalog. “Sa publiko at sa bawat tahanan” clearly distinguishes public ministry from distributive ministry in homes.
  terminology: “Anumang makabubuti” appropriately renders τῶν συμφερόντων without narrowing it to financial or explicitly spiritual benefit. “Ipahayag” and “turuan” preserve the distinct verbal actions of ἀναγγεῖλαι and διδάξαι.
  issues:
  - severity: medium
    issue: The main rendering “hindi ako umurong sa pagpapahayag” is awkward in contemporary Tagalog.
    rationale: Although “umurong” can reflect “draw back,” Tagalog normally uses “hindi nag-atubili” or “hindi nagpigil” with an infinitival action in this context. The revision preserves the source sense more naturally.
  - severity: low
    issue: “Sa hayag” is understandable but less current and less precise than “sa publiko.”
    rationale: “Sa publiko” is standard modern Tagalog for δημοσίᾳ, while “sa bawat tahanan” explicitly retains the distributive force of κατ’ οἴκους.
  revised_text: kung paanong hindi ako nag-atubiling ipahayag sa inyo ang anumang makabubuti at turuan kayo sa publiko at sa bawat tahanan.[a]
