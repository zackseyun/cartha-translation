  text: ὡς οὐδὲν ὑπεστειλάμην τῶν συμφερόντων τοῦ μὴ ἀναγγεῖλαι ὑμῖν καὶ διδάξαι ὑμᾶς δημοσίᾳ καὶ κατ’ οἴκους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/020.yaml
  text: how I did not shrink back from declaring to you anything that was profitable and teaching you publicly and from house to house,[a]
translation:
  language: tl
  text: kung paanong hindi ako nag-atubiling ipahayag sa inyo ang anumang makabubuti at turuan kayo sa publiko at sa bawat tahanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung paanong hindi ako umurong sa pagpapahayag sa inyo ng anumang makabubuti at sa pagtuturo sa inyo sa publiko at sa bawat tahanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: kung paanong
  rationale: Ipinakikilala nito ang nilalaman ng pagpapaalala ni Pablo at likas na nag-uugnay sa naunang konteksto.
- source_word: οὐδὲν ὑπεστειλάμην
  choice: hindi ako umurong
  rationale: Pinananatili nito ang idyomatikong diwa ng hindi pag-atras o hindi pagpigil sa sarili sa harap ng tungkuling dapat gawin.
- source_word: τῶν συμφερόντων
  choice: anumang makabubuti
  rationale: Saklaw nito ang anumang kapaki-pakinabang o makatutulong sa mga tagapakinig nang hindi nililimitahan ang diwa sa pakinabang na pinansiyal.
- source_word: τοῦ μὴ ἀναγγεῖλαι ὑμῖν
  choice: sa pagpapahayag sa inyo
  rationale: Natural nitong ipinahahayag sa Tagalog ang gawaing hindi iniurong ni Pablo, nang hindi mekanikal na inuulit ang negatibong anyo ng Griyego.
- source_word: διδάξαι ὑμᾶς
  choice: sa pagtuturo sa inyo
  rationale: Tuwirang katumbas ng pandiwang magturo at maayos na ikinakabit bilang ikalawang gawaing saklaw ng 'hindi ako umurong.'
- source_word: δημοσίᾳ
  choice: sa hayag
  rationale: Dignified at malinaw na tumutukoy sa pagtuturo sa pampublikong kalagayan.
- source_word: κατ’ οἴκους
  choice: sa bahay-bahay
  rationale: Pinananatili ang distributibong diwa ng paglilingkod sa bawat bahay o sa sunud-sunod na mga tahanan.
theological_decisions:
- issue: Saklaw ng τῶν συμφερόντων
  choice: anumang makabubuti
  alternative: anumang kapaki-pakinabang sa espirituwal
  rationale: Bagaman pangunahing pastoral at espirituwal ang konteksto, hindi idinaragdag sa pangunahing teksto ang tahasang pan限定 na wala sa salitang Griyego.
- issue: Ugnayan ng pagpapahayag at pagtuturo
  choice: kapuwa saklaw ng 'hindi ako umurong'
  alternative: ituring ang pagtuturo bilang hiwalay na sugnay
  rationale: Ang dalawang pawatas ay magkatuwang na naglalarawan sa mga gawaing hindi iniwasan ni Pablo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “umurong” upang mapanatili ang masiglang idyoma ng ὑποστέλλω, samantalang inilagay sa talababa ang mas likas na alternatibong “nag-atubili.”
