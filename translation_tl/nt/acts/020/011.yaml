base_translation:
  language: en
  yaml_path: translation/nt/acts/020/011.yaml
  text: Then he went upstairs[a], broke the bread, and ate; and after talking for a long time, until dawn[b], he departed.
translation:
  language: tl
  text: Umakyat siya, pinagputol-putol niya ang tinapay[a], at kumain siya.[b] Matapos siyang makipag-usap nang matagal hanggang magbukang-liwayway, saka siya umalis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naghati siya ng tinapay.” Ang pananalitang Griyego ay maaaring tumukoy lamang sa pagsasalo sa pagkain, bagaman inuunawa ito ng ilan dito bilang kabilang ang Hapunan ng Panginoon.
    reason: alternative_reading
  - marker: b
    text: O “tumikim” o “nakibahagi sa pagkain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβὰς
  choice: Pagkaakyat niya
  rationale: Likas na isinasalin nito ang aorist participle at ang pag-akyat ni Pablo pabalik sa silid sa itaas, nang hindi inuulit ang impormasyong malinaw na sa konteksto.
- source_word: κλάσας τὸν ἄρτον
  choice: pinagputol-putol niya ang tinapay
  rationale: Pinananatili ang kongkretong kilos ng pagputol-putol sa tinapay at hindi ipinapasiya kung karaniwang salu-salo o Hapunan ng Panginoon ang tinutukoy.
- source_word: γευσάμενος
  choice: kumain
  rationale: Bagaman maaari itong literal na mangahulugang “tumikim,” sa konteksto ng pagkain ay natural itong tumutukoy sa pagkain o pakikibahagi sa pagkain.
- source_word: ἐφ’ ἱκανόν
  choice: nang matagal
  rationale: Malinaw at natural na katumbas ng idyomang tumutukoy sa mahabang tagal.
- source_word: ὁμιλήσας
  choice: matapos siyang makipag-usap
  rationale: Ipinahihiwatig ng pandiwa ang matagal na pakikipag-usap o pakikipagtalastasan, hindi lamang pormal na pangangaral.
- source_word: ἄχρι αὐγῆς
  choice: hanggang sa magbukang-liwayway
  rationale: Natural at dignified na salin ng hangganang panahong “hanggang bukang-liwayway.”
- source_word: οὕτως ἐξῆλθεν
  choice: saka siya umalis
  rationale: Iniuugnay ng “saka” ang pag-alis sa naunang sunod-sunod na pangyayari, habang natural na ipinapahayag ng “umalis” ang ἐξῆλθεν.
theological_decisions:
- issue: Kung ang κλάσας τὸν ἄρτον ay tahasang tumutukoy sa Hapunan ng Panginoon
  choice: Isinalin nang neutral bilang “pinagputol-putol niya ang tinapay.”
  alternative: Maaaring unawain bilang karaniwang pagsasalo sa pagkain o bilang pagsasalo na kinabibilangan ng Hapunan ng Panginoon.
  rationale: Maaaring may kaugnayang eukaristiko ang parirala sa Mga Gawa, ngunit hindi tiyak na hinihingi ng talatang ito ang sakramental na pakahulugan. Pinananatili ng salin ang pagiging bukás ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magbukang-liwayway” bilang natural na salin ng dawn, at iniwasang gawing tahasang sakramental ang hindi tiyak na parirala tungkol sa tinapay. Inilipat ang mga pananda ng talababa sa mga salitang aktuwal na tinatalakay ng bawat talababa.
