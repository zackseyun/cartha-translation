id: ACT.20.14
reference: Acts 20:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς δὲ ⸀συνέβαλλεν ἡμῖν εἰς τὴν Ἆσσον, ἀναλαβόντες αὐτὸν ἤλθομεν εἰς Μιτυλήνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/014.yaml
  text: And when he met us at Assos[a], we took him on board and came to Mitylene.
translation:
  language: tl
  text: Nang makipagtagpo siya sa amin sa Assos[a], isinakay namin siya at nagpunta kami sa Mitilene.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sumama siya sa amin sa Assos” o “nakipagkita siya sa amin sa Assos.” Ang pandiwang Griyego ay maaaring tumukoy sa pagkikita o pagsasama-sama; dito, ang diwa ay muling sumama si Pablo sa pangkat doon.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλεν
  choice: makipagtagpo
  rationale: Sa konteksto ng paglalakbay, ipinahihiwatig ng pandiwa na nakipagkita at muling sumama si Pablo sa pangkat sa Assos. Likas sa modernong Tagalog ang “makipagtagpo” at hindi nito ipinapalagay na ang tinutukoy ay ang naunang pagsasaayos ng pagkikita.
- source_word: ἡμῖν
  choice: sa amin
  rationale: Tuwirang ipinahihiwatig ng panghalip na datibo ang pangkat na naglalakbay sakay ng barko.
- source_word: εἰς τὴν Ἆσσον
  choice: sa Assos
  rationale: Bagaman karaniwang direksiyon ang εἰς, lokasyon ng pagtatagpo ang likas na diwa rito sa Tagalog.
- source_word: ἀναλαβόντες
  choice: isinakay namin siya
  rationale: Sa kontekstong pandagat, tumutukoy ito sa pagtanggap o pagsama kay Pablo sakay ng barko. Nililinaw ng “isinakay” ang ipinahihiwatig ng salaysay nang hindi nagdaragdag ng di-kinakailangang detalye.
- source_word: αὐτόν
  choice: siya
  rationale: Tumutukoy kay Pablo mula sa naunang konteksto.
- source_word: ἤλθομεν
  choice: nagpunta kami
  rationale: Likas na paglalarawan ito sa Tagalog ng paglalakbay patungo sa kasunod na pook; pinananatili nito ang payak na aspektong pangyayari ng aorist.
- source_word: εἰς Μιτυλήνην
  choice: sa Mitilene
  rationale: Karaniwang direksiyonal na gamit ng “sa” sa Tagalog para sa patutunguhang lungsod.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at likas sa karaniwang mambabasa. Ginamit ang “Mitilene” bilang anyong Filipino ng Mitylene at pinanatili ang “Assos” bilang pangalan ng lugar.
