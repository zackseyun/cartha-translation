  text: ἡμεῖς δὲ ἐξεπλεύσαμεν μετὰ τὰς ἡμέρας τῶν ἀζύμων ἀπὸ Φιλίππων, καὶ ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα ἄχρι ἡμερῶν πέντε, ⸀οὗ διετρίψαμεν ἡμέρας ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/006.yaml
  text: But we sailed away from Philippi after the days of Unleavened Bread[a], and came to them at Troas within five days, where we stayed seven days.
translation:
  language: tl
  text: Ngunit pagkatapos ng mga araw ng Tinapay na Walang Pampaalsa, naglayag kami mula sa Filipos. Dumating kami sa kanila sa Troas sa loob ng limang araw,[a] at nanatili kami roon nang pitong araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa limang araw.” Ipinapakita ng pananalitang Griyego ang tagal ng paglalakbay hanggang sa kanilang pagdating.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλεύσαμεν
  choice: naglayag kami mula
  rationale: Ipinahihiwatig ng ἐκπλέω ang pag-alis sakay ng barko; natural sa Filipino ang “naglayag kami mula sa Filipos.”
- source_word: μετὰ τὰς ἡμέρας τῶν ἀζύμων
  choice: pagkatapos ng mga araw ng Tinapay na Walang Pampaalsa
  rationale: Pinananatili nito ang tahasang χρονological na anyong “mga araw” at ang kinikilalang katawagan sa kapistahang Judio, nang hindi idinaragdag sa pangunahing teksto ang salitang “Kapistahan.”
- source_word: ἀπὸ Φιλίππων
  choice: mula sa Filipos
  rationale: Ang “mula sa” ang karaniwang katumbas ng ἀπό sa kontekstong paglalakbay; “Filipos” ang natural na anyong Filipino ng pangalan ng lungsod.
- source_word: ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα
  choice: Dumating kami sa kanila sa Troas
  rationale: Ang “dumating” ay natural para sa natapos na pagpunta sa kinaroroonan nila; pinananatili ng “sa kanila” ang tahasang panghalip nang hindi idinaragdag ang interpretasyong “nakipagtipon.”
- source_word: ἄχρι ἡμερῶν πέντε
  choice: sa loob ng limang araw
  rationale: Ipinahihiwatig ng parirala ang saklaw ng tagal hanggang sa pagdating. Ang “sa loob ng limang araw” ay natural ngunit maaari ring maunawaang “within,” kaya nililinaw sa talababa ang alternatibong “pagkalipas ng limang araw.”
- source_word: οὗ διετρίψαμεν ἡμέρας ἑπτά
  choice: at nanatili kami roon nang pitong araw
  rationale: Ang οὗ ay tumutukoy sa Troas, at ang διατρίβω sa konteksto ng paglalakbay ay nangangahulugang manatili o magpalipas ng panahon sa isang lugar.
