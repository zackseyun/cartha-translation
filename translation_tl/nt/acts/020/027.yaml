id: ACT.20.27
reference: Acts 20:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑπεστειλάμην τοῦ μὴ ἀναγγεῖλαι ⸂πᾶσαν τὴν βουλὴν τοῦ θεοῦ ὑμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/027.yaml
  text: For I did not shrink back from declaring to you the whole counsel of God[a].
translation:
  language: tl
  text: Sapagkat hindi ako umurong sa pagpapahayag sa inyo ng buong layunin ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “buong panukala ng Diyos,” “buong pasiya ng Diyos,” o “buong kalooban ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinapakita nito na ang pahayag ay nagbibigay-katwiran sa naunang sinabi, at likas itong pang-ugnay sa makabagong Tagalog.
- source_word: οὐ ὑπεστειλάμην
  choice: hindi ako umurong
  rationale: Pinananatili nito ang larawan ng pag-atras o pag-urong sa isang tungkulin, at kaayon ito ng gamit ng parehong pandiwa sa konteksto ng Mga Gawa 20:20.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: sa pagpapahayag
  rationale: 'Likas na inilalahad sa Tagalog ang articular infinitive bilang saklaw ng hindi pag-urong: hindi siya umurong sa gawaing magpahayag.'
- source_word: πᾶσαν
  choice: buong
  rationale: Binibigyang-diin nito ang kabuuan o pagiging ganap ng ipinahayag.
- source_word: τὴν βουλὴν τοῦ θεοῦ
  choice: layunin ng Diyos
  rationale: Ang βουλή ay maaaring tumukoy sa layunin, panukala, pasiya, o kalooban. Ang “layunin” ay malinaw at natural sa kasalukuyang Tagalog habang hindi ito labis na nililimitahan sa utos lamang o sa isang tiyak na doktrina ng banal na pasiya.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Pinananatili nito ang tuwirang patutunguhan ng pagpapahayag sa mga kausap ni Pablo.
theological_decisions:
- issue: Saklaw ng βουλή τοῦ θεοῦ
  choice: buong layunin ng Diyos
  alternative: buong panukala ng Diyos; buong pasiya ng Diyos; buong kalooban ng Diyos
  rationale: Malawak ang semantikong saklaw ng βουλή at maaari nitong idiin ang plano, layunin, pasiya, o kalooban ng Diyos. Ginamit sa teksto ang natural na “layunin,” ngunit inilagay sa talababa ang mga lehitimong alternatibo upang mapanatili ang tunay na kalabuan at hindi ikulong ang parirala sa isang denominasyonal na pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang metapora ng pag-urong at iniwasan ang mas teknikal o makalumang “buong payo ng Diyos,” na maaaring mapagkamalang simpleng pagbibigay ng payo sa kasalukuyang gamit.
