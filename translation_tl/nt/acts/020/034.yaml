  yaml_path: translation/nt/acts/020/034.yaml
  text: You yourselves know that these hands served my needs and the needs of those who were with me[a].
translation:
  language: tl
  text: Kayo mismo ang nakaaalam na ang mga kamay na ito ang tumustos sa mga pangangailangan ko at sa mga pangangailangan ng mga kasama ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga kamay na ito ang naglingkod upang tugunan ang mga pangangailangan ko at ng mga kasama ko.” Maaaring idiin ng pandiwang Griyego ang praktikal na paglilingkod na naglalaan ng materyal na suporta.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: ninyo mismo
  rationale: 'Pinananatili nito ang diin ng hayag na panghalip kasabay ng pandiwa: ang mga kausap mismo ang tuwirang nakaaalam.'
- source_word: γινώσκετε
  choice: Alam
  rationale: Likas at kasalukuyang pahayag ito sa modernong Tagalog para sa tuwirang kaalaman ng mga tagapakinig.
- source_word: ταῖς χρείαις μου
  choice: para sa mga pangangailangan ko
  rationale: Ang χρεία ay tumutukoy sa praktikal o materyal na mga kailangan; malinaw at natural ang pariralang ito.
- source_word: τοῖς οὖσι μετ’ ἐμοῦ
  choice: ng mga kasama ko
  rationale: Natural nitong ipinahahayag ang mga taong kasama ni Pablo nang hindi tinutukoy nang higit sa teksto ang uri ng kanilang kaugnayan.
- source_word: ὑπηρέτησαν
  choice: naglingkod para sa
  rationale: Pinananatili ng “naglingkod” ang pangunahing diwa ng praktikal na paglilingkod, samantalang nililinaw ng kasunod na parirala ang kinalabasan nitong materyal na suporta.
- source_word: αἱ χεῖρες αὗται
  choice: ang mga kamay na ito
  rationale: Tuwiran nitong pinananatili ang demonstratibo at ang matingkad na larawan ng sariling paggawa ni Pablo.
