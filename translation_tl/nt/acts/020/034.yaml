    issue: Hindi lubos na likas at bahagyang malabo ang “ang mga kamay na ito ang naglingkod para sa mga pangangailangan ko at ng mga kasama ko.”
    rationale: Sa Filipino, ang mga kamay ay mas natural na “tumustos” o “naglaan” para sa mga pangangailangan. Ang pag-uulit ng “mga pangangailangan” ay nag-aalis ng anumang posibilidad na maunawaang ang mga kamay ay naglingkod din “sa mga kasama” mismo, sa halip na sa kanilang mga pangangailangan.
