  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang larawan ng “mga kamay na ito” at ang diin ng “ninyo mismo,” habang ang talababa ay nagtatala sa mas tiyak na materyal na pakahulugan ng pandiwa.
