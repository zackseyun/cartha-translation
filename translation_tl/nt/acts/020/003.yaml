  text: ποιήσας τε μῆνας τρεῖς· γενομένης ⸂ἐπιβουλῆς αὐτῷ⸃ ὑπὸ τῶν Ἰουδαίων μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν ἐγένετο ⸀γνώμης τοῦ ὑποστρέφειν διὰ Μακεδονίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/003.yaml
  text: After spending three months there[a], when a plot was made against him by the Jews as he was about to sail for Syria[d][c][b], he decided to return through Macedonia.
translation:
  language: tl
  text: Matapos siyang manatili roon nang tatlong buwan, may pakana laban sa kanya ang mga Judio[a][b] habang malapit na siyang maglayag patungong Siria[c]. Kaya nagpasiya siyang bumalik sa pamamagitan ng Macedonia[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Mga Gawa, ang katawagang “mga Judio” sa ganitong salaysay ay madalas tumukoy sa partikular na pangkat na kumakalaban kay Pablo sa konteksto, hindi sa lahat ng Judio nang walang pagtatangi.
    reason: cultural_note
  - marker: b
    text: O, “nang may mabuo na pakana laban sa kanya.”
    reason: lexical_alternative
  - marker: c
    text: O, “habang malapit na siyang maglayag patungong Siria.”
    reason: lexical_alternative
  - marker: d
    text: O, “nagpasiya siyang bumalik sa pamamagitan ng Macedonia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας τε μῆνας τρεῖς
  choice: Matapos siyang manatili roon nang tatlong buwan
  rationale: Ang ποιέω na may panahong tinutukoy ay nangangahulugang gugulin o manatili sa loob ng panahong iyon. Likas sa Tagalog ang “manatili roon,” at ang “roon” ay malinaw na hango sa lugar na binanggit sa naunang talata.
- source_word: γενομένης ἐπιβουλῆς αὐτῷ
  choice: may binalak laban sa kanya
  rationale: Ang ἐπιβουλή ay isang masamang balak o pakana laban sa isang tao. Pinananatili ng maikling pariralang ito ang diwang mapanlaban nang hindi nagdaragdag ng paraang hindi sinabi ng teksto.
- source_word: ὑπὸ τῶν Ἰουδαίων
  choice: ang mga Judio
  rationale: Tuwirang pinananatili ang katawagan sa Griyego. Nililinaw sa talababa na sa kontekstong ito ay isang partikular na pangkat ang tinutukoy, hindi ang lahat ng Judio.
- source_word: μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν
  choice: habang papaalis na sana siya sakay ng barko patungong Siria
  rationale: Ipinahihiwatig ng μέλλω ang nalalapit na gagawin, samantalang ang ἀνάγεσθαι sa ganitong konteksto ay paglalayag o pag-alis sa dagat. Ang “sana” ay natural na naghuhudyat na hindi natuloy ang balak na pag-alis.
- source_word: ἐγένετο γνώμης τοῦ ὑποστρέφειν
  choice: nagpasiya siyang bumalik
  rationale: Ang idyomang ἐγένετο γνώμης ay tumutukoy sa pagbuo ng pasiya; malinaw at natural ang “nagpasiya.”
- source_word: διὰ Μακεδονίας
  choice: na daraan sa Macedonia
  rationale: Ang διά na may genitive ay nagsasaad ng rutang dinaanan. Ang “daraan sa” ang natural na katumbas nito sa makabagong Tagalog.
theological_decisions:
- issue: Ang saklaw ng katawagang “ang mga Judio” sa salaysay ng tunggalian
  choice: Panatilihin sa pangunahing teksto ang “ang mga Judio,” na may paglilinaw sa talababa tungkol sa saklaw nito sa konteksto.
  alternative: “ilang Judio” o “mga Judiong kalaban ni Pablo”
  rationale: Tahasan ang τῶν Ἰουδαίων sa Griyego, kaya hindi dinagdagan sa pangunahing teksto ng “ilang” o “mga kalaban.” Gayunman, iniiwasan ng talababa ang maling pagpapalagay na lahat ng Judio, nang walang pagtatangi, ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sakay ng barko” upang malinaw sa karaniwang mambabasa ang pandiwang pandagat, at pinanatili ang mga pangalang “Siria” at “Macedonia” sa karaniwang anyong Filipino.
