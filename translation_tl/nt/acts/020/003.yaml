  naturalness: Malinaw at makabago ang Tagalog, ngunit mas maayos ang ugnayan ng mga pangyayari kung ang nalalapit na paglalayag ay ihahayag bilang “habang malapit na siyang maglayag.” Ang “pakana” ay mas tiyak at likas na katumbas ng ἐπιβουλή kaysa sa payak na “may binalak.”
  terminology: Ang “mga Judio,” “Siria,” at “Macedonia” ay angkop. Pinananatili ang “mga Judio” ayon sa Griyego at ang paglilinaw sa talababa upang hindi ito maunawang tumutukoy sa lahat ng Judiong tao.
