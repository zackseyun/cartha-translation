  text: ὀδυνώμενοι μάλιστα ἐπὶ τῷ λόγῳ ᾧ εἰρήκει ὅτι οὐκέτι μέλλουσιν τὸ πρόσωπον αὐτοῦ θεωρεῖν. προέπεμπον δὲ αὐτὸν εἰς τὸ πλοῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/038.yaml
  text: grieving especially over the word that he had spoken[a], that they would no longer see his face[d][c][b]. And they were accompanying him to the ship.
translation:
  language: tl
  text: Labis silang nalulungkot, lalo na dahil sa sinabi niya[a] na hindi na nila makikita ang kanyang mukha[b]. At sinamahan nila siya hanggang sa barko[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “dahil sa salitang sinabi niya.”
    reason: lexical_alternative
  - marker: b
    text: Ang “hindi na nila makikita ang kanyang mukha” ay isang personal na paraan ng pagsasabing hindi na nila siya makikita.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “inihatid nila siya” o “sinamahan nila siya bilang pamamaalam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀδυνώμενοι
  choice: Labis silang nalulungkot
  rationale: Ipinahahayag ng pandiwaring Griyego ang matinding sakit ng damdamin; natural sa makabagong Tagalog ang pariralang ito sa konteksto ng pamamaalam.
- source_word: μάλιστα
  choice: lalo na
  rationale: Tinutukoy nito ang pangunahing dahilan ng kanilang kalungkutan at likas ang pagkakasabi sa Tagalog.
- source_word: ἐπὶ τῷ λόγῳ ᾧ εἰρήκει
  choice: dahil sa sinabi niya
  rationale: Malinaw at natural nitong ipinahahayag ang sanhi ng kanilang kalungkutan; ang mas literal na anyo ay inilagay sa talababa.
- source_word: οὐκέτι μέλλουσιν
  choice: hindi na nila
  rationale: Sa kontekstong ito, ang μέλλω kasama ng pawatas ay tumutukoy sa inaasahang mangyayari mula sa pananaw ng nakaraan. Sapat na naipahahayag ito ng likas na Tagalog na 'hindi na nila makikita' nang hindi pinatitindi bilang 'kailanman.'
- source_word: τὸ πρόσωπον αὐτοῦ θεωρεῖν
  choice: makikita ang kanyang mukha
  rationale: Pinananatili ang tahasang larawan ng Griyegong 'kanyang mukha,' na isang personal at madamdaming paraan ng pagsasabing hindi na nila siya makikita.
- source_word: προέπεμπον
  choice: sinamahan nila siya
  rationale: Ipinahahayag nito ang pagsama sa isang taong papaalis bilang pamamaalam; ang aspektong nagpapatuloy ng imperpekto ay natural na naipahihiwatig ng salaysay.
- source_word: εἰς τὸ πλοῖον
  choice: hanggang sa barko
  rationale: Sa pandiwa ng pagsama o paghahatid, natural sa Tagalog ang 'hanggang sa barko' at malinaw na itinatakda ang hantungan.
