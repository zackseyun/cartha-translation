base_translation:
  language: en
  yaml_path: translation/nt/acts/020/031.yaml
  text: Therefore stay alert[a], remembering that for three years, night and day, I did not stop admonishing each one with tears.
translation:
  language: tl
  text: Kaya patuloy kayong magbantay. Alalahanin ninyo na sa loob ng tatlong taon, gabi at araw, hindi ako tumigil sa pagbibigay-babala[a] sa bawat isa nang may luha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagtutuwid” o “pagpapayo.” Ang pandiwang Griyego ay tumutukoy sa paggabay na maaaring may kasamang babala, pagsaway, at pagtuturo.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kaya
  rationale: Ipinahahayag ang kongklusyon mula sa naunang babala sa natural at malinaw na Filipino.
- source_word: γρηγορεῖτε
  choice: patuloy kayong magbantay
  rationale: Ang pangkasalukuyang pautos ay nagpapahiwatig ng tuloy-tuloy na pagbabantay; nililinaw ito ng “patuloy.”
- source_word: μνημονεύοντες
  choice: Alalahanin ninyo
  rationale: Ginawang hiwalay na pautos para sa natural na daloy sa Filipino habang nananatiling kaugnay ng panawagang magbantay.
- source_word: τριετίαν
  choice: sa loob ng tatlong taon
  rationale: Malinaw na ipinapahayag ang saklaw ng panahon.
- source_word: νύκτα καὶ ἡμέραν
  choice: gabi at araw
  rationale: Pinananatili ang ayos at diwa ng tuloy-tuloy na gawain sa Griyego.
- source_word: οὐκ ἐπαυσάμην
  choice: hindi ako tumigil
  rationale: Natural na makabagong Filipino para sa hindi paghinto sa isang gawain.
- source_word: μετὰ δακρύων
  choice: nang may luha
  rationale: Pinananatili ang emosyonal na bigat at ang kahulugan ng kasabay na pagluha.
- source_word: νουθετῶν
  choice: pagpapaalala
  rationale: Sa Filipino, maaari itong tumukoy sa taimtim na paggabay at pagtutuwid, bagaman hindi nito lubos na naipapakita nang walang paliwanag ang puwersa ng babala o pagsaway.
- source_word: ἕνα ἕκαστον
  choice: sa bawat isa
  rationale: Pinananatili ang distributibong diin sa personal na paglingap sa bawat indibidwal.
theological_decisions:
- issue: Pastoral at mapagtuwid na puwersa ng νουθετῶν
  choice: pagpapaalala
  alternative: pagbibigay-babala; pagsaway at pagtuturo
  rationale: Ang “pagpapaalala” ay natural at marangal sa Filipino at maaaring maglaman ng paggabay na naglalayong ituwid ang isip at asal. Inilalahad sa talababa ang mas matinding puwersa ng babala o pagtutuwid upang hindi mapawi ang saklaw ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patuloy” upang ihayag ang tuloy-tuloy na puwersa ng pautos, at hinati sa dalawang pangungusap para sa natural na daloy nang hindi pinuputol ang lohikal na ugnayan.
