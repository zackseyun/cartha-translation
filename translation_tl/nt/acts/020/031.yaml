  terminology: Ang “pagbibigay-babala” ay angkop na pangunahing salin ng νουθετῶν dito dahil pinananatili nito ang corrective warning na nasa salita. Dapat ipaliwanag sa talababa na hindi lamang ito pagbabanta o pag-iingat, kundi maaari ring tumukoy sa pagtutuwid at paggabay.
