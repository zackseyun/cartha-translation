  text: καὶ νῦν ἰδοὺ ⸂δεδεμένος ἐγὼ⸃ τῷ πνεύματι πορεύομαι εἰς Ἰερουσαλήμ, τὰ ἐν αὐτῇ συναντήσοντά ⸀μοι μὴ εἰδώς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/022.yaml
  text: And now, behold, bound in the Spirit, I am going to Jerusalem, not knowing what will happen to me there,
translation:
  language: tl
  text: At ngayon, tingnan ninyo, nakagapos ako sa Espiritu[a] at papunta ako sa Jerusalem, nang hindi ko alam kung ano ang mangyayari sa akin doon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakagapos sa espiritu,” na tumutukoy sa sariling espiritu ni Pablo. Maaaring tumukoy ang pariralang Griyego sa sariling espiritu ni Pablo o sa Banal na Espiritu. Maaari rin itong unawaing “inuudyukan ng Espiritu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: tingnan ninyo
  rationale: Pinananatili ang puwersa nito bilang panandang diskurso na nagbibigay-diin sa taimtim na paglipat ng sinabi ni Pablo, sa likas at nauunawaang modernong Tagalog.
- source_word: δεδεμένος
  choice: nakagapos
  rationale: Pinananatili ang metapora ng perpektong pasibong pandiwa at hindi agad nililimitahan ang kahulugan sa simpleng 'napipilitan' o 'inuutusan.'
- source_word: τῷ πνεύματι
  choice: sa Espiritu
  rationale: Malapit sa Griyego at hinahayaang manatili ang ilang kalabuan kung ang tinutukoy ay ang Banal na Espiritu, ang sariling espiritu ni Pablo, o ang pagkilos ng Espiritu bilang sanhi ng pagkapig̱il sa kaniya.
- source_word: πορεύομαι
  choice: habang papunta
  rationale: Likas na ipinahahayag sa Tagalog ang kasalukuyan at nagpapatuloy na paglalakbay patungong Jerusalem.
- source_word: τὰ ἐν αὐτῇ συναντήσοντά μοι
  choice: kung ano ang mangyayari sa akin doon
  rationale: Idyomatikong inililipat ang literal na 'mga bagay na sasalubong sa akin doon' nang hindi binabago ang diwa ng mga pangyayaring naghihintay kay Pablo.
- source_word: μὴ εἰδώς
  choice: hindi ko alam
  rationale: Direkta at natural na salin ng sugnay-partisipyo sa modernong Tagalog.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lugar sa modernong Bibliyang Tagalog.
theological_decisions:
- issue: Tinutukoy ng τῷ πνεύματι
  choice: Espiritu, na malamang ay ang Banal na Espiritu, ngunit isinaling 'sa Espiritu'
  alternative: sariling espiritu ni Pablo; maaari ring unawaing 'ginagapos o inuudyukan ng Espiritu'
  rationale: Madalas tumukoy ang πνεῦμα sa Banal na Espiritu sa Mga Gawa, at sinusuportahan ito ng kasunod na konteksto. Gayunman, hindi tiyak na nilulutas ng datibo ang referent o eksaktong ugnayan nito sa 'nakagapos,' kaya pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang 'tingnan ninyo' sa halip na arkaikong 'narito' o 'masdan,' at pinanatili ang metaporang 'nakagapos' upang hindi labis na ipaliwanag ang teksto.
