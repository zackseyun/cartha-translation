  text: solemnly testifying to both Jews and Greeks about repentance toward God and faith in our Lord Jesus[a].
translation:
  language: tl
  text: na taimtim na nagpapatotoo kapwa sa mga Judio at mga Griego tungkol sa pagsisisi at pagbabalik-loob sa Diyos at pananampalataya sa ating Panginoong Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagtitiwala sa ating Panginoong Jesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτυρόμενος
  choice: na taimtim na nagpapatotoo
  rationale: Pinananatili nito ang anyong pandiwaring nag-uugnay sa naunang pangungusap at ang diwa ng mariin at taimtim na pagpapatotoo.
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: kapwa sa mga Judio at mga Griego
  rationale: Tuwirang pinananatili ang pares na binanggit ni Lucas at hindi pinalalawak ang Ἕλληνες tungo sa mas pangkalahatang 'mga Hentil.'
- source_word: μετάνοιαν
  choice: pagsisisi
  rationale: Ang 'pagsisisi' ang natural at karaniwang salin sa Filipino para sa moral at espirituwal na pagbabalik-loob na ipinahihiwatig ng μετάνοια, hindi lamang pagbabago ng isip.
- source_word: εἰς θεόν
  choice: tungo sa Diyos
  rationale: Ipinapakita ng 'tungo sa' ang direksiyon o pagharap sa Diyos na taglay ng εἰς kasama ng μετάνοιαν.
- source_word: πίστιν
  choice: pananampalataya
  rationale: Ito ang karaniwang dignified na salin ng πίστις; malinaw sa parirala na si Jesus ang pinagtutuunan nito. Ang posibleng diwang 'pagtitiwala' ay inilalagay sa talababa.
- source_word: εἰς τὸν κύριον ἡμῶν Ἰησοῦν
  choice: sa ating Panginoong Jesus
  rationale: Natural sa Filipino ang 'pananampalataya sa' para sa pananalig na nakatuon sa isang persona; pinananatili rin ang pamagat na κύριος bilang 'Panginoon.'
theological_decisions:
- issue: Pagpapakahulugan sa πίστις na may tahasang layon
  choice: pananampalataya sa ating Panginoong Jesus
  alternative: pagtitiwala sa ating Panginoong Jesus
  rationale: Hindi ito usapin ng pistis-Christou genitive sapagkat tahasang layon si Jesus. Ang 'pananampalataya' ang angkop na pangunahing salin, habang tunay na leksikal na alternatibo ang 'pagtitiwala.'
- issue: Ugnayan ng pagsisisi at Diyos
  choice: pagsisisi tungo sa Diyos
  alternative: pagsisisi sa Diyos
  rationale: Pinananatili ng 'tungo sa Diyos' ang direksiyonal na lakas ng εἰς at iniiwasan ang posibleng maling pagkaunawa sa Filipino na ang Diyos ang pinagsisisihan.
translation_notes:
  register: Modernong Filipino na may dignified na biblikal na rehistro. Ginamit ang 'Judio' at 'Griego' bilang malinaw at kasalukuyang anyo; pinanatili ang participial na simula dahil bahagi ang talata ng mas mahabang pangungusap sa konteksto.
