    issue: Hindi natural ang “pagsisisi tungo sa Diyos.”
    rationale: Bagaman sinusubukan nitong literal na katawanin ang εἰς, ang “tungo sa” sa Filipino ay karaniwang para sa direksiyong pisikal o layunin. Ang “pagsisisi at pagbabalik-loob sa Diyos” ay mas natural at mas malinaw na naghahatid ng pagbaling ng loob sa Diyos na saklaw ng μετάνοια.
  revised_text: na taimtim na nagpapatotoo kapwa sa mga Judio at mga Griego tungkol sa pagsisisi at pagbabalik-loob sa Diyos at pananampalataya sa ating Panginoong Jesus.[a]
