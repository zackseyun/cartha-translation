  source_fidelity: Tumpak ang saklaw na “kapwa sa mga Judio at mga Griego,” ang dalawang magkaugnay na layon—μετάνοια at πίστις—at ang titulong “Panginoon.” Gayunman, ang “pagsisisi tungo sa Diyos” ay hindi idiomatiko sa modernong Filipino at maaaring magmukhang pisikal na paggalaw. Mas malinaw at natural ang “pagsisisi at pagbabalik-loob sa Diyos,” na ipinahahayag ang Godward orientation ng μετάνοια εἰς θεόν nang hindi nagdaragdag ng doktrina.
  naturalness: Natural ang “taimtim na nagpapatotoo,” “kapwa,” at “pananampalataya sa ating Panginoong Jesus.” Kailangan lamang ayusin ang pagkakabit ng “tungo sa Diyos” upang maging natural na Filipino.
  terminology: Ang “Judio,” “Griego,” “Diyos,” “pananampalataya,” at “Panginoong Jesus” ay angkop sa modernong Filipino na may marangal na biblikal na rehistro. Ang talababa para sa “pagtitiwala” ay wastong leksikal na alternatibo.
  issues:
