base_translation:
  language: en
  yaml_path: translation/nt/acts/020/005.yaml
  text: These men went on ahead and were waiting for us in Troas[a].
translation:
  language: tl
  text: Nauna ang mga lalaking ito at naghihintay sila sa amin sa Troas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na salin, “Ang mga ito, na nauna, ay naghihintay sa amin sa Troas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: ang mga lalaking ito
  rationale: Ang panghalip na pamatlig ay panlalaking maramihan at tumutukoy sa mga kasamang binanggit sa naunang talata. Nililinaw ng salin ang tinutukoy sa natural na Tagalog.
- source_word: δὲ
  choice: —
  rationale: Mahinang pang-ugnay ito; hindi na ito tahasang isinalin upang maging natural ang daloy ng pangungusap sa Tagalog.
- source_word: προσελθόντες
  choice: Nauna
  rationale: Sa konteksto ng salaysay sa paglalakbay, ipinahihiwatig ng pandiwaring ito na naunang pumunta ang mga kasamahan kaysa sa pangkat ng tagapagsalaysay.
- source_word: ἔμενον
  choice: hinintay nila
  rationale: Bagaman pangunahing nangangahulugang manatili ang μένω, kasama ang layong ἡμᾶς sa kontekstong ito ay natural itong nangangahulugang naghintay sa pagdating namin. Ang anyo ng pandiwa ay nagsasaad ng nagpapatuloy na paghihintay.
- source_word: ἡμᾶς
  choice: kami
  rationale: Unang panauhang panghalip na maramihan bilang layon; sa Tagalog, ang anyong layon ay natural na ipinapahayag sa pariralang “hinintay nila kami.”
- source_word: ἐν Τρῳάδι
  choice: sa Troas
  rationale: Karaniwang lokatibong salin ng ἐν kasama ang pangalan ng lugar; “sa Troas” ang natural na anyo sa Tagalog.
