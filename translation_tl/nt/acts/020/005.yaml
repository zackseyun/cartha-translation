translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga lalaking ito” upang maging malinaw ang panlalaking maramihang tinutukoy, at “Nauna” bilang maikli at natural na paglalahad ng kilos bago ang paghihintay.
