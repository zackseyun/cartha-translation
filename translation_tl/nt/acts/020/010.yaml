base_translation:
  language: en
  yaml_path: translation/nt/acts/020/010.yaml
  text: But Paul went down and fell upon him[a], and embracing him said, “Do not be alarmed[b], for his life is in him.”
translation:
  language: tl
  text: Ngunit bumaba si Pablo, dumapa sa kanya, at niyakap siya. Sinabi niya, “Huwag kayong mataranta, sapagkat nasa kanya ang kanyang buhay.[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nasa kanya ang kanyang kaluluwa.” Ang salitang Griyego na ψυχή ay maaaring mangahulugang “buhay,” “sarili,” o “kaluluwa”; sa kontekstong ito, “buhay” ang pinakaangkop dahil ang usapin ay kung patay o buhay ang binata.
    reason: lexical_alternative
  - marker: b
    text: Maaaring unawain ang sinabi ni Pablo na hindi pala namatay ang binata, o na naibalik na ang kanyang buhay. Hindi tahasang nilulutas ng pananalitang Griyego ang tanong na ito.
    reason: alternative_reading
lexical_decisions:
- source_word: καταβὰς
  choice: bumaba
  rationale: Pinananatili ang direksiyong ipinahihiwatig ng participle at likas sa konteksto ng pagbaba ni Pablo mula sa silid sa itaas.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang banayad na pagtugon o pag-iiba kasunod ng ulat tungkol sa pagkahulog at kamatayan ng binata.
- source_word: ἐπέπεσεν αὐτῷ
  choice: dumapa sa kanya
  rationale: Ipinahahayag ang pisikal na pagdapa ni Pablo sa binata habang pinananatili ang posibleng alusyon sa mga salaysay ng pagpapanumbalik ng buhay sa Lumang Tipan.
- source_word: συμπεριλαβὼν
  choice: niyakap siya
  rationale: Natural at malinaw na Filipino para sa pagyakap o pagbalot ng mga bisig sa isang tao.
- source_word: Μὴ θορυβεῖσθε
  choice: Huwag kayong mataranta
  rationale: Sinasaklaw ang pagkabalisa at pagkakagulo ng mga taong nakasaksi sa pangyayari.
- source_word: ἡ γὰρ ψυχὴ αὐτοῦ
  choice: sapagkat nasa kanya ang kanyang buhay
  rationale: Sa konteksto ng tanong kung patay o buhay ang binata, ang “buhay” ang pinakaangkop na diwa ng ψυχή at hindi nagdaragdag ng teknikal na doktrina tungkol sa kaluluwa.
- source_word: ἐν αὐτῷ ἐστιν
  choice: nasa kanya
  rationale: Malapit sa anyo ng Griyego at hindi ipinapasiya kung nanatili ang buhay o naibalik ito.
theological_decisions:
- issue: Kahulugan ng ψυχή sa konteksto ng buhay at kamatayan
  choice: Isinalin bilang “buhay.”
  alternative: “kaluluwa”
  rationale: Ang agarang usapin ay ang pisikal na kalagayan ng binata. Ang “buhay” ay angkop sa gamit ng ψυχή rito at umiiwas sa pagpasok ng doktrinal na kahulugang hindi pangunahing sinasabi ng talata.
- issue: Kung hindi talaga namatay ang binata o naibalik ang kanyang buhay
  choice: 'Pinanatiling bukas ang pahayag: “nasa kanya ang kanyang buhay.”'
  alternative: “buhay siya” o “nagbalik na sa kanya ang kanyang buhay”
  rationale: Hindi tahasang nililinaw ng Griyego kung nanatili ang buhay o naibalik ito. Kaya hindi dapat lutasin ng salin ang ambiguwidad.
translation_notes:
  register: Makabagong Filipino na natural, malinaw, at marangal. Ginamit ang “dumapa sa kanya” upang ilarawan ang pisikal na kilos nang hindi maging mekanikal ang salin, at pinanatili ang ambiguwidad ng huling sugnay.
