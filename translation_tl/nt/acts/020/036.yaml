  text: And after saying these things, he knelt down with them all and prayed.
translation:
  language: tl
  text: Pagkasabi niya ng mga ito, lumuhod siya kasama ang lahat ng mga ito at nanalangin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Pagka-
  rationale: Sa daloy ng salaysay, ang pang-ugnay na Καὶ kasama ng naunang aorist participle ay likas na naipapahayag sa Tagalog sa pamamagitan ng temporal na konstruksyong “Pagkasabi,” nang hindi nagdaragdag ng di-kailangang detalye.
- source_word: ταῦτα εἰπὼν
  choice: Pagkasabi nito
  rationale: Ipinahihiwatig ng aorist participle na nauna ang pagsasalita sa pangunahing kilos. Ang “Pagkasabi nito” ay natural at malinaw sa modernong Tagalog; ang “nito” ay tumutukoy sa mga bagay na kasasabi lamang.
- source_word: θεὶς τὰ γόνατα αὐτοῦ
  choice: lumuhod si Pablo
  rationale: Ang literal na “inilagay ang kanyang mga tuhod” ay isang idyoma para sa pagluhod. Isinalin itong “lumuhod”; ginamit ang pangalang “Pablo” upang maging malinaw ang paksa sa Tagalog, batay sa konteksto, yamang hindi likas ang sunod-sunod na kilos na walang hayag na paksa.
- source_word: σὺν πᾶσιν αὐτοῖς
  choice: kasama nilang lahat
  rationale: Ipinapahayag ng σύν ang pakikisama at pinananatili ng “lahat” ang diin na naroon ang buong pangkat.
- source_word: προσηύξατο
  choice: nanalangin
  rationale: Ito ang tuwiran, natural, at marangal na salin ng karaniwang pandiwa para sa pananalangin.
