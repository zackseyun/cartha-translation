id: ACT.20.24
reference: Acts 20:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδενὸς ⸀λόγου ⸀ποιοῦμαι τὴν ⸀ψυχὴν τιμίαν ἐμαυτῷ ὡς ⸀τελειῶσαι τὸν δρόμον ⸀μου καὶ τὴν διακονίαν ἣν ἔλαβον παρὰ τοῦ κυρίου Ἰησοῦ, διαμαρτύρασθαι τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/024.yaml
  text: 'But I do not count my life as of any value to myself[c][b][a], if only I may finish my course and the ministry that I received from the Lord Jesus: to testify to the gospel of the grace of God.'
translation:
  language: tl
  text: 'Ngunit hindi ko itinuturing na mahalaga sa akin ang aking buhay[a], kung matatapos ko lamang ang aking takbuhin[b] at ang paglilingkod na tinanggap ko mula sa Panginoong Jesus: ang magpatotoo[c] tungkol sa mabuting balita ng biyaya ng Diyos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang aking kaluluwa bilang mahalaga sa akin.” Mas angkop dito ang “buhay” dahil handa si Pablo na humarap sa kamatayan upang matapos ang kanyang atas.
    reason: lexical_alternative
  - marker: b
    text: O “ang aking landasin.” Ang salitang Griyego ay maaaring tumukoy sa takbuhin o landasing tinatapos.
    reason: lexical_alternative
  - marker: c
    text: O “taimtim na magpatotoo” o “magbigay ng taimtim na patotoo.” Maaaring magpahiwatig ang pandiwang Griyego ng masidhi o taimtim na pagpapatotoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδενὸς λόγου ποιοῦμαι ... τιμίαν ἐμαυτῷ
  choice: hindi ko itinuturing na mahalaga sa akin
  rationale: Likas sa modernong Tagalog ang pariralang ito at pinananatili nito ang diwa ng personal na pagtataya sa halaga, nang hindi ginagawang sobrang literal ang idyomang Griyego.
- source_word: ψυχήν
  choice: sarili kong buhay
  rationale: Sa konteksto, nakahanda si Pablo na harapin ang pagdurusa at kamatayan upang matapos ang kanyang gawain. Ang “buhay” ang tumutukoy rito, hindi partikular na ang di-materyal na kaluluwa.
- source_word: ὡς τελειῶσαι
  choice: basta matapos ko lamang
  rationale: Ipinahahayag ng siksik na konstruksyong Griyego ang nangingibabaw na hangarin ni Pablo. Natural sa Tagalog ang “basta ... lamang” at naihahatid nito ang diwang “if only” nang hindi ito ginagawang payak na sugnay ng layunin.
- source_word: τὸν δρόμον μου
  choice: ang aking takbuhin
  rationale: Pinananatili ng “takbuhin” ang metaporang maaaring tumukoy sa landasin o takbuhing kailangang tapusin, at hindi nagdaragdag ng ideyang wala sa teksto.
- source_word: τὴν διακονίαν
  choice: ang paglilingkod
  rationale: Ang “paglilingkod” ay malinaw at malawak na katumbas ng gawaing ipinagkatiwala kay Pablo, nang hindi nililimitahan ito sa makabagong institusyonal na kahulugan ng ministeryo.
- source_word: παρὰ τοῦ κυρίου Ἰησοῦ
  choice: mula sa Panginoong Jesus
  rationale: Malinaw na ipinapakita ng “mula sa” ang pinagmulan ng atas at pinananatili ang titulong “Panginoon.”
- source_word: διαμαρτύρασθαι
  choice: ang magpatotoo
  rationale: Tumpak at natural ang “magpatotoo” para sa pagbibigay ng taimtim o mariing patotoo; ang masidhing himig ay ipinapaliwanag sa talababa bilang leksikal na posibilidad.
- source_word: τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ
  choice: ang mabuting balita ng biyaya ng Diyos
  rationale: Pinananatili nito ang ugnayang henitibo sa Griyego, kaya hindi sapilitang pinagpapasiyahan kung ang mabuting balita ay tungkol sa biyaya ng Diyos o pangunahing inilalarawan nito.
theological_decisions:
- issue: Kahulugan ng ψυχή sa paglalarawan ni Pablo sa sarili
  choice: buhay
  alternative: kaluluwa
  rationale: Ang agarang konteksto ay ang kahandaan ni Pablo na humarap sa panganib at kamatayan upang matapos ang kanyang atas. Iniiwasan ng “buhay” ang pagpasok ng paghahating katawan-kaluluwa na hindi binibigyang-diin dito.
- issue: Puwersa ng ὡς τελειῶσαι
  choice: basta matapos ko lamang
  alternative: upang matapos ko / nang sa gayon ay matapos ko
  rationale: Ipinakikita ng napiling salin ang nangingibabaw at nag-iisang hangarin ni Pablo, habang pinananatili ang bahagyang siksik na ugnayan nito sa unang sugnay sa halip na tukuyin ito bilang isang payak na sugnay ng layunin lamang.
- issue: Ugnayan sa pariralang τῆς χάριτος τοῦ θεοῦ
  choice: mabuting balita ng biyaya ng Diyos
  alternative: mabuting balita tungkol sa biyaya ng Diyos
  rationale: 'Ang pormal na ugnayang “ng” ay nagpapanatili sa tunay na lawak ng henitibo: maaaring tumukoy ito sa nilalaman ng mabuting balita o sa biyayang nagpapakilala rito.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “paglilingkod” sa halip na mas institusyonal na “ministeryo,” at pinanatili ang metapora ng takbuhin at ang bukas na ugnayan sa “biyaya ng Diyos.”
