  text: Therefore I testify to you on this day that I am innocent of the blood of all[a][b].
translation:
  language: tl
  text: Kaya nga, nagpapatotoo ako sa inyo sa araw na ito na wala akong kasalanan sa dugo ng sinuman[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malinis ako sa dugo ng lahat”; ang idyomang Griego ay tumutukoy sa pagiging malaya sa pagkakasala o pananagutan tungkol sa iba.
    reason: lexical_alternative
  - marker: b
    text: Malamang na ipinapaalaala ng pananalitang ito ang larawan ng bantay sa Ezekiel at ang pananagutan sa dugo (hal., Ezek. 3:18–19; 33:6–9).
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: Kaya nga
  rationale: Ipinahihiwatig nito ang kongklusyong hinango ni Pablo mula sa naunang pahayag at natural itong pakinggan sa makabagong Tagalog.
- source_word: μαρτύρομαι
  choice: pinatototohanan ko
  rationale: Pinananatili ang mariin at taimtim na diwa ng personal na pagpapatotoo nang hindi labis na nilalagyan ng teknikal na legal na kulay.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Tuwirang katumbas ng datibo at hindi nagdaragdag ng di-kinakailangang pampublikong o panghukuman na kahulugan.
- source_word: ἐν τῇ σήμερον ἡμέρᾳ
  choice: sa araw na ito
  rationale: Pinananatili ang taimtim at bahagyang Semitikong himig ng parirala, sa halip na patagin lamang bilang “ngayon.”
- source_word: ὅτι
  choice: na
  rationale: Likas na panandang nagpapakilala sa nilalaman ng pagpapatotoo sa Tagalog.
- source_word: καθαρός
  choice: wala akong pananagutan
  rationale: Sa idyomang may kasunod na “dugo,” ang salita ay tumutukoy sa pagiging malaya sa pagkakasala o pananagutan; mas malinaw at natural ito kaysa literal na “malinis ako.”
- source_word: ἀπὸ τοῦ αἵματος
  choice: sa dugo
  rationale: Pinananatili ang larawang biblikal ng dugo at ang kaugnayan nito sa pananagutan, habang bumubuo ng natural na pariralang Tagalog kasama ng “wala akong pananagutan.”
- source_word: πάντων
  choice: ninuman
  rationale: Natural at maikli itong tumutukoy sa lahat ng tao nang hindi nililimitahan ang saklaw.
theological_decisions:
- issue: Kahulugan ng pagiging malaya sa dugo ng lahat
  choice: Isinalin bilang kawalan ng pananagutan sa dugo ninuman, na tumutukoy sa pagiging malaya sa pagkakasala o pananagutan matapos tapat na gampanan ni Pablo ang tungkuling magbabala at magturo.
  alternative: Unawain lamang bilang pagtanggi sa literal na pakikibahagi sa pisikal na pagkamatay ng sinuman.
  rationale: Ang konteksto ng Mga Gawa 20 at ang malamang na alingawngaw ng larawan ng bantay sa Ezekiel ay tumutukoy sa pananagutang kaugnay ng pagbababala. Pinanatili ang salitang “dugo” upang hindi mawala ang biblikal na larawan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang taimtim na “sa araw na ito” at ang biblikal na larawang “dugo,” ngunit isinalin ang καθαρός ayon sa idyomatikong diwa nito upang madaling maunawaan.
