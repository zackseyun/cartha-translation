  naturalness: Mas natural ang “nagpapatotoo ako sa inyo” kaysa “pinatototohanan ko sa inyo” para sa solemne ngunit karaniwang Tagalog. Ang “sa araw na ito” ay angkop at marangal. Ang “sa dugo ng sinuman” ay idiomatikong nauunawaan sa kontekstong biblikal bilang pagkakasala o pananagutan sa pagkamatay ng iba.
  terminology: Pinananatili ang “dugo,” kaya hindi pinapantay sa isang tahasang paraphrase na “pagkamatay.” Ang “kasalanan” ay angkop na katumbas sa kontekstong ito ng καθαρός ἀπὸ τοῦ αἵματος, at nililinaw ng talababa ang kahulugang pananagutan. Ang “Ezekiel” at mga reperensiya ay wasto.
