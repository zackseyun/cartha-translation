base_translation:
  language: en
  yaml_path: translation/nt/acts/020/015.yaml
  text: And from there[a], after setting sail, on the next day we came opposite Chios; on the following day we touched at Samos[b]; and on the day after that we came to Miletus.
translation:
  language: tl
  text: At mula roon, matapos kaming maglayag, kinabukasan ay nakarating kami sa tapat ng Quio[a]. Nang sumunod na araw, dumaong kami sa Samos[b], at sa sumunod pang araw ay nakarating kami sa Mileto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa may tapat ng Quio” o “sa laot sa tapat ng Quio.” Ipinahihiwatig ng Griyego na nasa tapat sila ng isla at hindi nito kinakailangang ipahiwatig na dumaong sila roon.
    reason: lexical_alternative
  - marker: b
    text: O “humimpil kami sa Samos.” Ang pandiwa ay terminong pandagat para sa paglapit ng barko sa pampang o paghinto sa isang daungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: At mula roon
  rationale: Pinananatili ang kapuwa pang-ugnay na καί at ang diwa ng pinanggalingan sa ἐκεῖθεν.
- source_word: ἀποπλεύσαντες
  choice: matapos kaming maglayag
  rationale: Likas na temporal na pagsasalin ng aorist participle, habang pinananatili ang kontekstong pandagat.
- source_word: τῇ ἐπιούσῃ
  choice: kinabukasan
  rationale: Natural at malinaw na modernong Tagalog para sa temporal na pahayag na “sa susunod na araw.”
- source_word: κατηντήσαμεν ἄντικρυς Χίου
  choice: nakarating kami sa tapat ng Quio
  rationale: Ipinahahayag ang pagdating sa posisyong kaharap o katapat ng isla, nang hindi ipinahihiwatig na lumapag sila roon.
- source_word: τῇ δὲ ἑτέρᾳ
  choice: Nang sumunod na araw
  rationale: Pinananatili ang sunod-sunod na takbo ng mga araw sa salaysay.
- source_word: παρεβάλομεν εἰς Σάμον
  choice: dumaong kami sa Samos
  rationale: Ang pandiwa ay terminong pandagat para sa paglapit o paghimpil ng barko; natural itong naipapahayag ng “dumaong.”
- source_word: τῇ δὲ ἐχομένῃ
  choice: nang kasunod pang araw
  rationale: Nililinaw na isa pa itong kasunod na araw sa sunod-sunod na itineraryo.
- source_word: ἤλθομεν εἰς Μίλητον
  choice: nakarating kami sa Mileto
  rationale: Direkta at natural na paglalarawan ng pagdating sa destinasyon.
- source_word: Χίου / Σάμον / Μίλητον
  choice: Quio / Samos / Mileto
  rationale: Ginamit ang mga anyong pamilyar sa tradisyong Filipino para sa Quio at Mileto, at ang tuwirang transliterasyong Samos.
