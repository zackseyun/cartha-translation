base_translation:
  language: en
  yaml_path: translation/nt/acts/020/033.yaml
  text: I coveted no one's silver or gold or clothing[a].
translation:
  language: tl
  text: Hindi ko inimbot ang pilak, ginto, o damit ng sinuman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi ko hinangad ang pilak, ginto, o damit ng sinuman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργυρίου
  choice: pilak
  rationale: Pinananatili ang kongkretong kahulugang “pilak” at ang pagkakapantay nito sa ginto at damit bilang mahahalagang pag-aari.
- source_word: χρυσίου
  choice: ginto
  rationale: Tuwirang katumbas ng salitang Griyego at natural sa talaan ng mahahalagang pag-aari.
- source_word: ἱματισμοῦ
  choice: damit
  rationale: Karaniwan at makabagong salitang Filipino para sa kasuotan, nang hindi nagiging makaluma o labis na pormal.
- source_word: οὐδενὸς
  choice: ng sinuman
  rationale: 'Ipinahahayag ang pagmamay-ari: ang pilak, ginto, o damit ay pag-aari ng ibang tao.'
- source_word: ἐπεθύμησα
  choice: inimbot
  rationale: Sa konteksto ng pagtatanggol ni Pablo sa kaniyang integridad, ipinahihiwatig nito ang maling pagnanasa sa pag-aari ng iba, hindi lamang neutral na paghahangad.
- source_word: ἢ ... ἢ ... ἢ
  choice: o ... o ... o
  rationale: Pinananatili ang paulit-ulit na paghihiwalay ng tatlong bagay sa Griyego sa paraang natural sa Filipino.
theological_decisions:
- issue: Moral na diwa ng ἐπιθυμέω kaugnay ng mga pag-aari
  choice: “inimbot” bilang salitang may negatibong moral na diwa
  alternative: “hinangad” bilang mas neutral na salin
  rationale: Ang konteksto ay ang pahayag ni Pablo na hindi siya sakim sa pag-aari ng iba. Ang “inimbot” ay malinaw na naghahatid ng malamang na etikal na diwa nang walang idinaragdag na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino na maikli, natural, at marangal. Ginamit ang “inimbot” upang maipakita ang moral na bigat ng pandiwa, habang inilalahad sa talababa ang mas neutral na “hinangad.”
