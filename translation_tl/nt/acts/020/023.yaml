  text: except that the Holy Spirit testifies to me in city after city[c][b][a], saying that chains and afflictions await me.
translation:
  language: tl
  text: maliban na ang Banal na Espiritu ay nagpapatotoo sa akin sa bawat lungsod[a], na nagsasabing naghihintay sa akin ang mga tanikala[b] at mga paghihirap.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa sunod-sunod na lungsod” o “sa bawat lungsod.” Ang idyomang Griyego ay nagpapahiwatig ng paulit-ulit na patotoo sa magkakasunod na lungsod.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga gapos.” Pinananatili ng “mga tanikala” ang kongkretong larawan ng salitang Griyego.
    reason: lexical_alternative
  - marker: c
    text: 'Bahagyang nagkakaiba ang ilang manuskrito sa pagkakalagay o pag-iral ng “sa akin” kaugnay ng “mga paghihirap,” ngunit hindi nagbabago ang pangunahing diwa: mga tanikala at paghihirap ang naghihintay kay Pablo.'
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν ὅτι
  choice: maliban lamang sa
  rationale: Ipinahahayag nito ang tanging eksepsiyon o pasubali sa sinabi sa naunang talata, at likas ang parirala sa modernong Tagalog.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: ang Banal na Espiritu
  rationale: Ito ang karaniwan at malinaw na salin ng tiyak na pariralang tumutukoy sa banal na Espiritu.
- source_word: κατὰ πόλιν
  choice: sa bawat lungsod
  rationale: Inihahatid nito ang distributibong diwa ng patotoong paulit-ulit na ibinibigay sa magkakasunod na lungsod, nang hindi ipinahihiwatig na sa lahat ng lungsod nang walang eksepsiyon.
- source_word: διαμαρτύρεταί μοι
  choice: patuloy na pagpapatotoo sa akin
  rationale: Pinananatili ng “pagpapatotoo” ang diwa ng mariing pagsaksi sa halip na gawing mas interpretatibong “nagbababala”; ang “patuloy” ay nagpapakita sa kasalukuyan at paulit-ulit na kilos sa konteksto.
- source_word: λέγον
  choice: na nagsasabing
  rationale: Tuwirang ipinakikilala nito ang nilalaman ng patotoo ng Espiritu.
- source_word: δεσμὰ
  choice: mga tanikala
  rationale: Pinananatili nito ang kongkretong larawan ng pagkagapos sa halip na agad itong gawing abstraktong “pagkabilanggo.”
- source_word: θλίψεις
  choice: mga paghihirap
  rationale: Likas at kasalukuyang Tagalog ito para sa matitinding kapighatian o pagdurusang daranasin, nang hindi gumagamit ng salitang may labis na espesyalisadong himig.
- source_word: με
  choice: sa akin
  rationale: Malinaw na si Pablo ang daranas ng kapwa mga tanikala at mga paghihirap, alinsunod sa nakalimbag na teksto.
- source_word: μένουσιν
  choice: naghihintay sa akin
  rationale: Sa konteksto, ang pandiwa ay nangangahulugang ang mga ito ay nakalaan o nasa hinaharap para kay Pablo; natural sa Tagalog ang “naghihintay sa akin.”
theological_decisions:
- issue: Ang pagkakakilanlan at pagkilos ng “Banal na Espiritu”
  choice: Ang Banal na Espiritu ay inilalarawang personal na kumikilos at nagpapatotoo kay Pablo.
  alternative: Isang di-personal na espirituwal na impluwensiya.
  rationale: Ang pandiwang “nagpapatotoo” at ang participleng “nagsasabi” ay nagpapakita ng personal na pagkilos, ngunit hindi na dinaragdagan ng salin ang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lungsod,” “pagpapatotoo,” “tanikala,” at “paghihirap” upang mapanatili ang bigat at kongkretong larawan ng Griyego nang hindi nagiging lipas o labis na teknikal.
