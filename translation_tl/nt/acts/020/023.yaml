  to: maliban na ang Banal na Espiritu ay nagpapatotoo sa akin sa bawat lungsod[a], na nagsasabing naghihintay sa akin ang mga tanikala[b] at mga paghihirap.[c]
  rationale: Ginawang tuwirang pandiwang may paksa ang pagsaksi ng Banal na Espiritu upang mas malapit sa διαμαρτύρεταί μοι at mas natural sa modernong Filipino. Inalis ang “patuloy,” dahil ang pag-uulit ayon sa mga lungsod ay sapat nang ipinahihiwatig ng “sa bawat lungsod.” Inayos din ang talababa a upang mapanatili ang kahulugan ng κατὰ πόλιν nang walang idinagdag na ideya ng mga bayang dinaraanan.
