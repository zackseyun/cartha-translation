  text: καὶ ἐξ ὑμῶν αὐτῶν ἀναστήσονται ἄνδρες λαλοῦντες διεστραμμένα τοῦ ἀποσπᾶν τοὺς μαθητὰς ὀπίσω ⸀ἑαυτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/030.yaml
  text: and from among your own selves men will arise[a], speaking twisted things, to draw away the disciples after themselves.
translation:
  language: tl
  text: At mula mismo sa hanay ninyo ay may lilitaw na mga lalaking magsasalita ng mga bagay na lihis[a], upang ilayo ang mga alagad at akaying sumunod sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga baluktot na bagay” o “mga pilipit na bagay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: mula mismo sa hanay ninyo
  rationale: Pinananatili ng “mismo” at “sa hanay ninyo” ang diin na sa loob ng kanilang sariling pamayanan magmumula ang panganib.
- source_word: ἀναστήσονται
  choice: may lilitaw
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa paglitaw o pagbangon ng mga taong ito; natural sa makabagong Tagalog ang “may lilitaw” at pinananatili nito ang panghinaharap na diwa.
- source_word: ἄνδρες
  choice: mga lalaki
  rationale: Tiyak na panlalaki ang salitang Griyego, kaya hindi ito ginawang neutral na “mga tao.”
- source_word: λαλοῦντες
  choice: magsasalita
  rationale: Tuwirang inilalarawan ang kanilang pagsasalita bilang paraan ng panghihikayat sa mga alagad.
- source_word: διεστραμμένα
  choice: mga baluktot na bagay
  rationale: Pinananatili ang metapora ng paglihis mula sa matuwid o totoo at hindi nililimitahan ang tinutukoy sa isang tiyak na maling aral o uri ng kasamaan.
- source_word: τοῦ ἀποσπᾶν
  choice: upang ilayo
  rationale: Ipinahahayag ng parirala ang layunin at ang larawan ng paghila o paglalayo sa mga alagad mula sa kanilang dating katapatan.
- source_word: τοὺς μαθητὰς
  choice: ang mga alagad
  rationale: Ito ang nakagawiang terminong biblikal para sa μαθηταί at malinaw na tumutukoy sa mga tagasunod ni Jesus.
- source_word: ὀπίσω ἑαυτῶν
  choice: pasunurin sa kanilang sarili
  rationale: Likas na ipinahahayag sa Tagalog ang idyomang tumutukoy sa paghahangad nilang magkaroon ng mga tagasunod na nakatuon sa kanila.
theological_decisions:
- issue: Saklaw ng διεστραμμένα
  choice: mga baluktot na bagay
  alternative: mga pilipit na bagay; mga bagay na lumihis sa katotohanan
  rationale: Hindi tinutukoy ng talata ang isang partikular na erehiya o kung doktrinal lamang o moral ang paglihis. Pinananatili ng salin ang malawak at matalinghagang babala.
- issue: Kasarian ng ἄνδρες
  choice: mga lalaki
  alternative: mga tao; ilang tao
  rationale: Tiyak na panlalaki ang ἄνδρες sa Griyego, kaya pinanatili ang kasarian nang hindi ito ginagawang neutral.
- issue: Layunin ng mga lilitaw na lalaki
  choice: upang ilayo ang mga alagad at pasunurin sa kanilang sarili
  alternative: upang hilahin palayo ang mga alagad na sumunod sa kanila
  rationale: Malinaw nitong pinananatili ang layuning humiwalay ang mga alagad at magbigay ng katapatan sa mga taong ito, nang hindi nagdaragdag ng isang partikular na doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mula mismo sa hanay ninyo” upang idiin ang panloob na pinagmulan ng panganib, at “pasunurin sa kanilang sarili” upang natural na maipahayag ang idyoma ng pagkuha ng sariling mga tagasunod.
