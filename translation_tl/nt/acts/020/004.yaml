id: ACT.20.4
reference: Acts 20:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: συνείπετο δὲ ⸀αὐτῷ Σώπατρος ⸀Πύρρου Βεροιαῖος, Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος, καὶ Γάϊος Δερβαῖος καὶ Τιμόθεος, Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/004.yaml
  text: And Sopater son of Pyrrhus[a], a Berean, accompanied him; and Aristarchus and Secundus from Thessalonica; and Gaius of Derbe, and Timothy[b]; and Tychicus and Trophimus from Asia.
translation:
  language: tl
  text: Kasama niya sa paglalakbay si Sopatro na anak ni Pirro, isang taga-Berea; sina Aristarco at Segundo, na mga taga-Tesalonica[a]; sina Gayo na taga-Derbe at Timoteo; at sina Tiquico at Trofimo, na mga taga-Asia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “mula sa mga taga-Tesalonica.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “Asia” rito ay ang lalawigang Romano ng Asia, hindi ang makabagong kontinente.
    reason: cultural_note
lexical_decisions:
- source_word: συνείπετο ... αὐτῷ
  choice: Kasama niya sa paglalakbay
  rationale: Ipinahahayag nito ang patuloy na pagsama sa paglalakbay na ipinahihiwatig ng imperfect na συνείπετο, habang natural ang ayos sa modernong Tagalog.
- source_word: Σώπατρος Πύρρου Βεροιαῖος
  choice: Sopatro na anak ni Pirro, isang taga-Berea
  rationale: Ang Πύρρου ay genitive na pinakamalamang na patronymic, at ang Βεροιαῖος ay tumutukoy sa pinagmulan niyang Berea.
- source_word: Θεσσαλονικέων ... Ἀρίσταρχος καὶ Σεκοῦνδος
  choice: sina Aristarco at Segundo, na mga taga-Tesalonica
  rationale: Ang genitive plural ay nag-uugnay sa dalawang lalaki sa mga taga-Tesalonica; likas sa Tagalog ang heograpikong paglalarawang ito.
- source_word: Γάϊος Δερβαῖος καὶ Τιμόθεος
  choice: sina Gayo na taga-Derbe at Timoteo
  rationale: Ang Δερβαῖος ay tuwirang naglalarawan kay Gayo bilang mula sa Derbe; hindi pinalawak ang paglalarawan kay Timoteo.
- source_word: Ἀσιανοὶ ... Τυχικὸς καὶ Τρόφιμος
  choice: sina Tiquico at Trofimo, na mga taga-Asia
  rationale: Tumutukoy ang Ἀσιανοί sa kanilang pinagmulan sa Asia; nililinaw sa talababa na lalawigang Romano ito.
- source_word: δέ ... δέ ... δέ
  choice: sunod-sunod na mga pariralang pinaghihiwalay ng tuldok-kuwit at “at”
  rationale: Pinananatili nito ang sunod-sunod na pagdaragdag ng mga pangalan nang hindi pinabibigat ang Tagalog sa paulit-ulit na pantukoy.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang karaniwang anyong Filipino ng mga pangalang biblikal at malinaw na tuldok-kuwit upang madaling masundan ang mahabang talaan. Inilagay ang mga pananda ng talababa sa mismong mga pariralang tinutukoy ng mga ito.
