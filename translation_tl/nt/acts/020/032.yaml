  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παρατίθεμαι ⸀ὑμᾶς τῷ ⸀θεῷ καὶ τῷ λόγῳ τῆς χάριτος αὐτοῦ, τῷ δυναμένῳ ⸀οἰκοδομῆσαι καὶ δοῦναι ⸀τὴν κληρονομίαν ἐν τοῖς ἡγιασμένοις πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/032.yaml
  text: And now I entrust you to God and to the word of his grace[a], which is able to build up and to give the inheritance among all those who have been sanctified.
translation:
  language: tl
  text: At ngayon, ipinagkakatiwala ko kayo sa Diyos at sa salita ng kanyang biyaya[a], na may kakayahang magpatibay at ipagkaloob ang mana kasama ng lahat ng pinabanal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa salita ng kanyang biyaya, siya na may kakayahang,” kung ang parirala ay pangunahing tumutukoy sa Diyos sa halip na sa “salita ng kanyang biyaya.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρατίθεμαι
  choice: ipinagkakatiwala ko
  rationale: Likas na modernong Tagalog para sa paglalagay sa pangangalaga ng iba; pinananatili ang diwa ng middle voice.
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Tuwirang ipinakikita ang pinagkakatiwalaan sa kanila.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: sa salita ng kanyang biyaya
  rationale: Pinananatili ang genitibong ayos at bigat ng λόγος, na maaaring tumukoy sa ipinahahayag na salita o mensahe.
- source_word: τῷ δυναμένῳ
  choice: na may kakayahang
  rationale: Ang walang-kasariang Tagalog na panghalip na “na” ay natural na maiuugnay sa pinakamalapit na “salita,” ngunit hindi lubusang isinasara ang posibilidad na Diyos ang pangunahing tinutukoy.
- source_word: οἰκοδομῆσαι
  choice: magpatibay
  rationale: Natural na paglalarawan sa espirituwal na pagpapatatag; hindi na inuulit ang “kayo,” na nauunawaan na mula sa konteksto.
- source_word: δοῦναι τὴν κληρονομίαν
  choice: magbigay ng mana
  rationale: Tuwirang ipinapahayag ang pagbibigay ng κληρονομία nang hindi nagdaragdag ng tahasang di-tuwirang layon.
- source_word: κληρονομίαν
  choice: mana
  rationale: Karaniwan at malinaw na terminong Tagalog na nagpapanatili sa biblikal na diwa ng bahaging ipinagkakaloob ng Diyos.
- source_word: ἐν τοῖς ἡγιασμένοις πᾶσιν
  choice: sa gitna ng lahat ng mga pinabanal
  rationale: Pinananatili ang pandiwang anyo ng perfect passive participle at ang diwa ng ἐν bilang pakikibahagi sa loob ng buong pangkat.
theological_decisions:
- issue: Ang tinutukoy ng τῷ δυναμένῳ (“ang may kakayahan”)
  choice: Sa pangunahing teksto, pinakamalapit itong tumutukoy sa “salita ng kanyang biyaya.”
  alternative: 'Maaari itong pangunahing tumukoy sa Diyos: “siya na may kakayahang.”'
  rationale: Kapwa posible sa sintaks. Ang “salita” ang pinakamalapit na tinutukoy, ngunit ang Diyos din ang personal na tagapagbigay ng mana. Pinananatili ng talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “ipinagkakatiwala,” “biyaya,” “mana,” at “pinabanal” upang mapanatili ang pormal at teolohikal na bigat nang hindi maging lipas o labis na teknikal.
