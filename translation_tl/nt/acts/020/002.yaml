- from: Matapos niyang libutin ang mga lupaing iyon at palakasin ang loob ng mga naroon sa pamamagitan ng maraming pangangaral,[a] pumunta siya sa Gresya.
  to: Matapos niyang dumaan sa mga rehiyong iyon at palakasin ang loob nila sa pamamagitan ng maraming salita,[a] dumating siya sa Gresya.
  rationale: Pinalitan ang interpretibong «maraming pangangaral» ng «maraming salita» upang mapanatili ang leksikal at semantikong lawak ng λόγῳ πολλῷ. Ginawang «mga rehiyong iyon» ang τὰ μέρη ἐκεῖνα at «nila» ang αὐτούς para sa mas tuwirang pagtutumbas, habang pinananatili ang natural na Tagalog at ang temporal na ayos ng aorist participle.
