  text: After passing through those regions and encouraging them with many words[a], he came into Greece.
translation:
  language: tl
  text: Matapos niyang dumaan sa mga rehiyong iyon at palakasin ang loob nila sa pamamagitan ng maraming salita,[a] dumating siya sa Gresya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sa pamamagitan ng mahabang pagpapalakas-loob.” Literal sa Griego: “sa pamamagitan ng maraming salita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθὼν
  choice: Matapos niyang libutin
  rationale: Ipinahihiwatig ng aorist participle ang kilos na nauna sa pangunahing pandiwang ἦλθεν. Likas sa Tagalog ang “matapos niyang libutin,” at ipinakikita rin nitong naglakbay siya sa iba't ibang lugar sa mga lupaing tinutukoy.
- source_word: τὰ μέρη ἐκεῖνα
  choice: ang mga lupaing iyon
  rationale: Ang μέρη ay tumutukoy sa mga bahagi o rehiyon. Ang “mga lupaing iyon” ay malinaw at likas na heograpikong pahayag sa modernong Tagalog.
- source_word: παρακαλέσας
  choice: palakasin ang loob
  rationale: Maaaring mangahulugan ang παρακαλέω ng paghikayat, pagpapalakas-loob, o pag-aliw. Sa konteksto ng pagdalaw ni Pablo sa mga mananampalataya, pinananatili ng “palakasin ang loob” ang malawak na pastoral na diwa nang hindi ito nililimitahan sa pagsaway.
- source_word: αὐτοὺς
  choice: ng mga naroon
  rationale: Ang panghalip ay tumutukoy sa mga mananampalataya sa nabanggit na mga lupain. Ginamit ang “mga naroon” upang maging malinaw at natural sa Tagalog nang hindi nagdaragdag ng tiyak na katawagang wala sa talata.
- source_word: λόγῳ πολλῷ
  choice: sa pamamagitan ng maraming pangangaral
  rationale: Literal na tumutukoy ang parirala sa “maraming salita/pagsasalita.” Sa kontekstong ito, ang “maraming pangangaral” ay likas na Tagalog para sa masinsin o mahabang pagpapahayag na ginamit upang palakasin ang loob; inilalahad sa talababa ang literal at iba pang posibleng diwa.
- source_word: ἦλθεν εἰς τὴν Ἑλλάδα
  choice: pumunta siya sa Gresya
  rationale: Maaaring isalin ang ἔρχομαι bilang “pumunta” o “dumating” ayon sa pananaw ng salaysay. Ang “pumunta siya sa Gresya” ay natural sa Tagalog at malinaw na nagpapahayag ng paglalakbay patungo roon.
- source_word: δὲ
  choice: Matapos
  rationale: Ang δέ ay banayad na pang-ugnay. Sa Tagalog, likas na naisasama ang transisyon nito sa temporal na panimulang “Matapos,” kaya hindi kailangan ang hiwalay na “at” o “ngayon.”
