id: ACT.20.28
reference: Acts 20:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ ⸀θεοῦ, ἣν περιεποιήσατο διὰ τοῦ ⸂αἵματος τοῦ ἰδίου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/028.yaml
  text: Pay careful attention to yourselves and to all the flock[a], in which the Holy Spirit has appointed you overseers, to shepherd the church of God[c][b], which he obtained through the blood of his own.
translation:
  language: tl
  text: Ingatan ninyong mabuti ang inyong sarili at ang buong kawan, na sa gitna nito ay inilagay kayo ng Banal na Espiritu bilang mga tagapangasiwa, upang pangalagaan ang iglesya ng Diyos[a], na inangkin niya sa pamamagitan ng dugo ng sarili niyang Anak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “iglesya ng Panginoon.”'
    reason: textual_variant
  - marker: b
    text: 'Sa literal: “sa pamamagitan ng dugo ng sarili niyang [Isa].” Maaari ring isalin: “sa pamamagitan ng sarili niyang dugo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχετε
  choice: Ingatan ninyong mabuti
  rationale: Ipinahihiwatig ng pangkasalukuyang pautos ang patuloy na pagbabantay at maingat na pagtuon; natural ito sa makabagong Tagalog at angkop kapwa sa sarili at sa kawan.
- source_word: ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ
  choice: ang inyong sarili at ang buong kawan
  rationale: Pinananatili ang pastoral na talinghaga ng ποίμνιον, habang malinaw na isinasama ng παντί ang kabuuan ng kawan.
- source_word: ἐν ᾧ
  choice: na sa gitna nito
  rationale: Ipinakikitang ang mga tagapangasiwa ay inilagay sa loob ng mismong kawan, hindi bilang mga taong hiwalay rito.
- source_word: ἔθετο
  choice: inilagay
  rationale: Malapit ito sa pangunahing diwa ng τίθημι at ipinahihiwatig sa konteksto ang pagtatalaga sa isang tungkulin nang hindi dinaragdagan ang pormalidad ng salita.
- source_word: ἐπισκόπους
  choice: mga tagapangasiwa
  rationale: Isinasalin ang tungkuling mangasiwa nang hindi ipinapasok ang mga posibleng mas huling konotasyon ng titulong 'obispo.'
- source_word: ποιμαίνειν
  choice: upang pangalagaan
  rationale: Natural sa Tagalog para sa gawain ng pastol at malinaw na nagpapahayag ng pag-aaruga at paggabay; ang kawan sa naunang sugnay ay nagpapanatili sa pastoral na larawan.
- source_word: ἐκκλησίαν
  choice: iglesya
  rationale: Karaniwan, malinaw, at kinikilalang katawagan sa makabagong Filipino para sa sambayanang Kristiyano na tinutukoy rito.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Sinusunod ang SBLGNT na θεοῦ; inilalagay sa talababa ang mahalagang variant na κυρίου, 'ng Panginoon.'
- source_word: περιεποιήσατο
  choice: inangkin niya
  rationale: Naipapahayag ang pagkuha o pagtatamo para sa sarili na nasa middle voice, nang hindi labis na ipinipilit ang komersiyal na larawan ng 'binili.'
- source_word: διὰ τοῦ αἵματος
  choice: sa pamamagitan ng dugo
  rationale: Malinaw na ipinahahayag ang instrumento o paraan, habang pinananatili ang sakripisyal at mapagtubos na bigat ng 'dugo.'
- source_word: τοῦ ἰδίου
  choice: ng sarili niyang Anak
  rationale: Ang substantival na ἰδίου ay maaaring mangahulugang 'sarili niyang [Isa],' na karaniwang inuunawa bilang Anak. Idinagdag ang 'Anak' para sa natural at malinaw na Tagalog, habang itinatala sa talababa ang mas literal at tradisyonal na mga pagbasa.
theological_decisions:
- issue: Referente at puwersa ng τοῦ αἵματος τοῦ ἰδίου
  choice: sa pamamagitan ng dugo ng sarili niyang Anak
  alternative: sa pamamagitan ng dugo ng sarili niyang [Isa]; sa pamamagitan ng sarili niyang dugo
  rationale: Hindi likas at bitin sa Tagalog ang literal na 'dugo ng sarili niya' at maaari itong mapagkamalang awtomatikong tumutukoy sa dugo ng Diyos. Ang substantival na ἰδίου ay makatuwirang tumutukoy sa sariling Anak ng Diyos. Nililinaw ito sa pangunahing teksto ngunit pinananatili sa talababa ang pagiging maikli ng Griyego at ang tradisyonal na alternatibo.
- issue: Variant na τοῦ θεοῦ / τοῦ κυρίου
  choice: iglesya ng Diyos
  alternative: iglesya ng Panginoon
  rationale: Sinusunod ng pangunahing teksto ang ibinigay na SBLGNT na θεοῦ, habang hindi ikinukubli ang mahalagang variant ng mga manuskrito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang talinghaga ng kawan at iniwasan ang mga katawagang maaaring magpasok ng mas huling estrukturang denominasyonal. Ang 'sarili niyang Anak' ay ginagamit upang maging natural ang substantival na parirala sa Tagalog, at ang tunay na tekstuwal at interpretatibong mga alternatibo ay nasa mga talababa.
