  text: δουλεύων τῷ κυρίῳ μετὰ πάσης ταπεινοφροσύνης ⸀καὶ δακρύων καὶ πειρασμῶν τῶν συμβάντων μοι ἐν ταῖς ἐπιβουλαῖς τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/019.yaml
  text: serving the Lord with all humility and with tears and trials that happened to me through the plots of the Jews[a][b].
translation:
  language: tl
  text: na naglilingkod sa Panginoon nang buong kababaang-loob, na may mga luha at mga pagsubok[a] na sinapit ko dahil sa mga pakana ng mga Judio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pagtukso” o “mga pagsubok sa katatagan”; dito, ang diwa ay mga panlabas na pagsubok na bunga ng pagsalungat.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang partikular na mga Judiong kalaban na nagpakana laban kay Pablo, hindi ang lahat ng Judio.
    reason: cultural_note
lexical_decisions:
- source_word: δουλεύων
  choice: naglilingkod
  rationale: Ang kasalukuyang participle ay naglalarawan sa patuloy na paraan ng paglilingkod ni Pablo. Ang “naglilingkod” ay likas sa modernong Tagalog at nagpapahayag ng tapat na paglilingkod nang hindi labis na itinatampok ang katayuan ng isang alipin.
- source_word: τῷ κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang titulong κύριος bilang “Panginoon,” nang hindi tahasang dinaragdagan ang pangalang Jesus na wala sa mismong parirala.
- source_word: μετὰ πάσης ταπεινοφροσύνης
  choice: nang buong kababaang-loob
  rationale: Ipinahahayag nito ang paraan ng paglilingkod at pinananatili ang nagpapalakas na bisa ng πάσης sa natural na Tagalog.
- source_word: δακρύων
  choice: may mga luha
  rationale: Pinananatili ang kongkreto at madamdaming larawan ng pangmaramihang pangngalang “mga luha,” habang natural na iniuugnay ito sa paraan at kalagayan ng paglilingkod.
- source_word: πειρασμῶν
  choice: mga pagsubok
  rationale: Sa konteksto, tumutukoy ito sa panlabas na paghihirap na dulot ng pagsalungat, hindi pangunahing sa tukso na gumawa ng kasalanan.
- source_word: τῶν συμβάντων μοι
  choice: na sinapit ko
  rationale: Maikli at natural itong nagpapahayag na ang tinutukoy na mga pagsubok ay ang mga naranasan ni Pablo.
- source_word: ἐν ταῖς ἐπιβουλαῖς
  choice: dahil sa mga pakana
  rationale: Sa kontekstong ito, ipinahihiwatig ng ἐν ang kalagayan o paraang naging sanhi ng mga pagsubok. Ang “dahil sa” ay malinaw sa Tagalog, samantalang ang “mga pakana” ay angkop sa lihim at masamang balak.
- source_word: τῶν Ἰουδαίων
  choice: ng mga Judio
  rationale: Tuwirang pinananatili ang leksikal na pagtukoy sa mga Judio. Hindi nililimitahan ng mismong salita ang grupo sa mga pinuno lamang; nililinaw ng talababa na mga partikular na kalaban ni Pablo ang tinutukoy.
theological_decisions:
- issue: Posibleng mapagkamalang pangkalahatang paratang laban sa lahat ng Judio
  choice: Panatilihin ang “mga Judio” sa pangunahing teksto at ipaliwanag sa talababa na partikular na mga kalaban ni Pablo ang tinutukoy.
  alternative: “mga pinunong Judio” o “mga Judeano”
  rationale: Hayagang ginagamit ng Griyego ang Ἰουδαίων at hindi nito tahasang sinasabing mga pinuno lamang. Gayunman, nililimitahan ng konteksto ang parirala sa grupong nagsabwatan laban kay Pablo, kaya ang talababa ay pumipigil sa di-makatarungang paglalahat nang hindi binabago ang teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “kababaang-loob,” “mga luha,” at “mga pakana” upang mapanatili ang bigat at larawan ng Griyego. Ang anyong “na naglilingkod” ay sadyang nagpapanatili sa pagkakaugnay ng talata sa naunang pangungusap.
