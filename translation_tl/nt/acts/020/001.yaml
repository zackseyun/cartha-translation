  text: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον ⸀μεταπεμψάμενος ὁ Παῦλος τοὺς μαθητὰς καὶ ⸀παρακαλέσας, ἀσπασάμενος ἐξῆλθεν ⸀πορεύεσθαι ⸀εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/001.yaml
  text: After the uproar had ceased[a], Paul sent for the disciples, and after encouraging them and saying farewell, he departed to go to Macedonia.
translation:
  language: tl
  text: Matapos humupa ang kaguluhan, ipinatawag ni Pablo ang mga alagad. Matapos palakasin ni Pablo ang kanilang loob at magpaalam sa kanila[a], umalis siya patungong Macedonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bumati sa kanila”; ang salitang Griyego ay maaaring tumukoy sa pagbati o, sa konteksto ng pag-alis, sa pamamaalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον
  choice: Nang matapos ang kaguluhan
  rationale: Ang μετά na may articular infinitive ay nagpapahayag ng panahong kasunod ng paghupa ng naunang pangyayari. Natural sa Filipino ang “Nang matapos,” at ang “kaguluhan” ay angkop sa pampublikong ingay at gulong tinutukoy ng θόρυβος sa konteksto.
- source_word: μεταπεμψάμενος
  choice: ipinatawag
  rationale: Ipinahihiwatig ng middle participle na nagpasugo si Pablo upang papuntahin sa kaniya ang mga alagad. Maikli at likas sa modernong Filipino ang “ipinatawag.”
- source_word: τοὺς μαθητὰς
  choice: ang mga alagad
  rationale: Pinananatili ng “mga alagad” ang karaniwang katawagan ni Lucas sa mga tagasunod ni Jesus, sa halip na palawakin ito bilang “mga mananampalataya.”
- source_word: παρακαλέσας
  choice: Matapos niya silang palakasin ang loob
  rationale: Maaaring mangahulugan ang παρακαλέω ng pagpapayo, paghimok, o pag-aliw. Sa konteksto ng pag-alis matapos ang kaguluhan, pinananatili ng “palakasin ang loob” ang malawak at mapagkalingang diwa nang hindi ito nililimitahan sa pagsaway o pag-aliw lamang.
- source_word: ἀσπασάμενος
  choice: magpaalam
  rationale: Karaniwang nangangahulugang bumati ang ἀσπάζομαι, ngunit sa konteksto ng pag-alis maaari itong tumukoy sa pamamaalam. Ang “magpaalam” ang natural na pagbasa rito, habang inilalahad sa talababa ang tunay na leksikal na alternatibo.
- source_word: ἐξῆλθεν πορεύεσθαι εἰς Μακεδονίαν
  choice: umalis siya patungong Macedonia
  rationale: Sa salaysay ng paglalakbay, ang ἐξῆλθεν ay nagsasaad ng pag-alis, at ipinakikita ng infinitive at εἰς ang nilalayong destinasyon. Likas at malinaw sa Filipino ang “umalis siya patungong Macedonia.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Hinati sa dalawang pangungusap upang maiwasan ang mabigat na hanay ng mga participle sa Griyego, habang pinananatili ang pagkakasunod-sunod ng mga kilos. Ginamit ang “palakasin ang loob” upang mapanatili ang lawak ng παρακαλέω.
