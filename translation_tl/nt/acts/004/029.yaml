    rationale: Ang pandiwang “sabihin” ay madaling unawaing pagbigkas o pagsipi ng isang partikular na pananalita. Ang Griyego ay humihiling ng walang-takot na pagsasalita ng salita ng Diyos; mas malinaw itong naihahatid ng “magsalita ng iyong salita.”
  - severity: low
    issue: Hindi likas ang “mga aliping-lingkod” bilang alternatibo sa talababa.
    rationale: Hindi ito karaniwang modernong Filipino at maaaring magmukhang teknikal na likhang-katawagan. Sapat na ang “mga alipin,” kasama ang paliwanag na ang δούλος ay maaaring tumukoy sa taong pag-aari ng isang panginoon.
