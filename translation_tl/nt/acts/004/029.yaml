  text: καὶ τὰ νῦν, κύριε, ἔπιδε ἐπὶ τὰς ἀπειλὰς αὐτῶν καὶ δὸς τοῖς δούλοις σου μετὰ παρρησίας πάσης λαλεῖν τὸν λόγον σου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/029.yaml
  text: And now[a], Lord, look upon their threats and grant your servants to speak your word with all boldness,
translation:
  language: tl
  text: At ngayon, Panginoon, tingnan mo ang kanilang mga banta, at ipagkaloob mo sa iyong mga lingkod[a] na magsalita ng iyong salita nang buong tapang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga alipin.” Ang salitang Griyego na doulos ay maaaring tumukoy sa isang taong pag-aari ng isang panginoon. Ginamit dito ang “mga lingkod” dahil binibigyang-diin ng panalangin ang mapagpakumbabang paglilingkod sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τὰ νῦν
  choice: At ngayon
  rationale: Likas na panandang diskurso sa panalangin na inililipat ang pansin mula sa naunang pagsipi at paglalahad tungo sa kasalukuyang kahilingan.
- source_word: κύριε
  choice: Panginoon
  rationale: Tuwirang pagtawag sa Diyos sa panalangin; ito ang malinaw at nakaugaliang salin ng κύριος sa ganitong konteksto.
- source_word: ἔπιδε ἐπὶ
  choice: tingnan mo
  rationale: Pinananatili ang kongkretong larawan ng pagtingin habang likas sa makabagong Filipino; sa konteksto, nangangahulugan din itong bigyang-pansin ng Diyos ang mga banta.
- source_word: τὰς ἀπειλὰς αὐτῶν
  choice: ang kanilang mga banta
  rationale: Tuwiran at malinaw na salin ng pangmaramihang ἀπειλάς at ng panghalip na αὐτῶν.
- source_word: δὸς
  choice: ipagkaloob mo
  rationale: Bagaman literal na 'ibigay mo,' ang 'ipagkaloob mo' ay natural at marangal na pananalita sa panalangin para sa hinihinging kakayahan o pahintulot.
- source_word: τοῖς δούλοις σου
  choice: sa iyong mga lingkod[a]
  rationale: Ipinapahayag ng 'mga lingkod' ang mapagpakumbabang paglilingkod at pagpapasakop sa Diyos sa konteksto ng panalangin, habang ipinapaliwanag sa talababa ang mas matinding diwa ng pag-aari sa isang panginoon.
- source_word: μετὰ παρρησίας πάσης
  choice: nang buong katapangan
  rationale: Ipinapakita ang hayag at walang-takot na pagsasalita at pinananatili ang diin ng πάσης, 'buo/lahat.'
- source_word: λαλεῖν τὸν λόγον σου
  choice: na sabihin ang iyong salita
  rationale: Pinananatili ang payak na diwa ng λαλεῖν na 'magsalita/sabihin' at ang biblikal na pananalitang 'iyong salita' para sa mensahe ng Diyos, nang hindi pinalalakas agad bilang 'ipahayag.'
theological_decisions:
- issue: Pagsasalin ng δοῦλος kaugnay ng Diyos
  choice: mga lingkod
  alternative: mga alipin; mga aliping-lingkod
  rationale: Sa panalanging ito, nangingibabaw ang mapagpakumbabang paglilingkod at pagpapasakop sa Diyos. Gayunman, hindi dapat mawala ang posibilidad na ipinahihiwatig ng δοῦλος ang isang taong pag-aari ng panginoon, kaya inilalahad ang mga alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino para sa panalangin. Iniwasan ang arkaikong pananalita at pinanatili ang payak ngunit taimtim na tono. Inilagay ang talababa sa 'mga lingkod,' ang salitang aktuwal nitong ipinaliliwanag.
