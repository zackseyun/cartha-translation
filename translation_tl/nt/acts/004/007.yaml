  text: καὶ στήσαντες αὐτοὺς ἐν ⸀τῷ μέσῳ ἐπυνθάνοντο· Ἐν ποίᾳ δυνάμει ἢ ἐν ποίῳ ὀνόματι ἐποιήσατε τοῦτο ὑμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/007.yaml
  text: And after setting them in the midst[a], they began asking, “By what power or in what name did you do this?”
translation:
  language: tl
  text: At matapos silang patayuin sa gitna, sinimulan silang tanungin[a], “Sa anong kapangyarihan o sa anong pangalan ninyo ginawa ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patuloy silang tinatanong” o “nagtanong sila.” Maaaring idiin ng imperfect sa Griyego ang nagpapatuloy na pagtatanong sa halip na ang pagsisimula nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσαντες
  choice: matapos silang patayuin
  rationale: Ipinahahayag ng aorist participle ang kilos na nauna sa pagtatanong. Likas sa modernong Tagalog ang “matapos silang patayuin” at pinananatili nito ang malinaw na pagkakasunod ng mga kilos.
- source_word: ἐν τῷ μέσῳ
  choice: sa gitna
  rationale: Tuwirang katumbas ito ng parirala at pinananatili ang larawan ng mga apostol na nakatayo sa gitna ng kapulungan, nang hindi dinaragdagan ng interpretasyong “sa harap nila.”
- source_word: ἐπυνθάνοντο
  choice: tinanong
  rationale: Likas at malinaw itong salin sa konteksto ng pormal na pagsisiyasat. Maaaring ipahiwatig ng Greek imperfect ang nagpapatuloy o nagsisimulang pagtatanong; pinananatili sa talababa ang aspektuwal na posibilidad na hindi likas ipilit sa pangunahing teksto.
- source_word: Ἐν ποίᾳ δυνάμει
  choice: Sa anong kapangyarihan
  rationale: Pinananatili ng “kapangyarihan” ang karaniwang kahulugan ng δύναμις at hindi ito ipinagpapalit sa “awtoridad,” lalo na't ang kasunod na “pangalan” ay maaari nang magpahiwatig ng kinatawang awtoridad.
- source_word: ἢ ἐν ποίῳ ὀνόματι
  choice: o sa kaninong pangalan
  rationale: Sa natural na Tagalog, ang pagtatanong tungkol sa pangalang pinagmumulan ng pagkilos ay “sa kaninong pangalan.” Pinananatili nito ang biblikal na idyoma ng pagkilos sa pangalan ng isang tao at ang pahiwatig ng kinatawang awtoridad.
- source_word: ἐποιήσατε τοῦτο
  choice: ninyo ginawa ito
  rationale: Ang payak na nagdaang anyo ay angkop sa aorist at sapat na malawak upang tukuyin ang pagpapagaling o tandang pinag-uusapan nang walang idinagdag na paliwanag.
- source_word: ὑμεῖς
  choice: ninyo
  rationale: Ang tahasang panghalip na Greek ay naihahayag sa Tagalog sa “ninyo.” Bagaman hindi lubos na natutumbasan ang diin ng hiwalay na ὑμεῖς, mas natural ito kaysa sa mabigat na “kayo mismo.”
theological_decisions:
- issue: Kung ang δύναμις ay isasaling “kapangyarihan” o bibigyang-kahulugang “awtoridad”
  choice: kapangyarihan
  alternative: awtoridad
  rationale: δύναμις ang ginamit ng Greek, na karaniwang tumutukoy sa kapangyarihan o kakayahang makagawa. Ang katambal na pariralang “sa kaninong pangalan” ay nagdadala na ng ideya ng kinatawang awtoridad, kaya pinananatili ng “kapangyarihan” ang pagkakaiba ng dalawang bahagi ng tanong.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sa gitna” upang mapanatili ang kongkretong tagpo, at “sa kaninong pangalan” bilang mas likas na Tagalog kaysa sa literal ngunit alanganing “sa anong pangalan.”
