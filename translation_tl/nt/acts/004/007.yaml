  naturalness: Natural at marangal sa modernong Filipino Tagalog ang “Matapos silang patayuin sa gitna, sinimulan silang tanungin.” Mas malinaw rin nitong naihahayag ang posibleng inceptive na puwersa ng imperfect kaysa sa payak na “tinanong.”
  terminology: Ang “kapangyarihan” ay wastong katumbas ng δύναμις. Ang “sa anong pangalan” ay nagpapanatili ng idyomang Griyego at ng sinadyang pagkakaiba nito sa “sa anong kapangyarihan.”
