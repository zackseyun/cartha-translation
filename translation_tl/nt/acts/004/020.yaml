base_translation:
  language: en
  yaml_path: translation/nt/acts/004/020.yaml
  text: For we are not able not to speak about what we have seen and heard[a].
translation:
  language: tl
  text: Sapagkat hindi namin kayang hindi magsalita tungkol sa mga nakita at narinig namin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas idyomatikong pananalita, “Sapagkat hindi namin mapigilang magsalita tungkol sa mga nakita at narinig namin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δυνάμεθα
  choice: hindi namin kayang
  rationale: Tuwirang ipinapahayag nito ang kawalan ng kakayahang tumigil, hindi lamang ang pagtangging gawin iyon.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan kaugnay ng naunang pahayag.
- source_word: ἡμεῖς
  choice: namin
  rationale: Ang tahasang panghalip ay kinakatawan sa anyong pangmaramihang unang panauhan; sapat na ang likas na diin ng pangungusap sa Filipino.
- source_word: ἃ
  choice: mga
  rationale: Kasama ng “nakita at narinig,” likas nitong tinutukoy sa Filipino ang mga bagay o pangyayaring kanilang nasaksihan, nang hindi na kailangang idagdag ang mabigat na “mga bagay na.”
- source_word: εἴδαμεν
  choice: nakita namin
  rationale: Pinananatili ang puwersa ng personal na pagsaksi sa naganap na mga pangyayari.
- source_word: ἠκούσαμεν
  choice: narinig namin
  rationale: Inilalahad ang personal na pagkarinig bilang kapantay na bahagi ng kanilang patotoo.
- source_word: μὴ λαλεῖν
  choice: hindi magsalita
  rationale: Pinananatili ang negatibong pawatas kasunod ng pahayag ng kawalan ng kakayahan, kaya nananatiling lantad ang tensiyong “hindi kayang hindi magsalita.”
- source_word: λαλεῖν
  choice: magsalita tungkol sa
  rationale: Ang “tungkol sa” ay malinaw at likas na nag-uugnay sa pagsasalita sa kanilang nakita at narinig.
theological_decisions:
- issue: Ang puwersang nagtutulak sa mga apostol ay inilalarawan bilang kawalan ng kakayahang manahimik, hindi lamang bilang matibay na pasiya.
  choice: “hindi namin kayang hindi magsalita”
  alternative: “hindi kami titigil sa pagsasalita” o “hindi namin mapigilang magsalita”
  rationale: Ang Griyegong οὐ δυνάμεθα ... μὴ λαλεῖν ay tuwirang nagsasaad na hindi nila kayang hindi magsalita. Pinananatili ng salin ang anyo at teolohikal na tensiyon nito nang hindi ito pinahihina tungo sa simpleng pagtanggi o dinaragdagan ng ideya ng di-mapigilang emosyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Sadyang pinanatili sa pangunahing teksto ang bahagyang di-karaniwang dobleng pagtanggi upang maipakita ang estruktura at diin ng Griyego; ibinigay sa talababa ang mas idyomatikong anyo.
