  naturalness: Kailangan lamang ng bahagyang ayos sa sugnay na “sumagot ... at sinabi sa kanila.” Mas malinaw at mas natural sa modernong Filipino ang paglalagay ng panghalip na “nila” sa ikalawang pandiwa. Ang “sa halip na” ay nauunawaan, ngunit “nang higit kaysa” ang mas tuwirang katumbas ng μᾶλλον ἢ sa paghahambing na ito.
  terminology: Ang “Pedro,” “Juan,” “Diyos,” “makinig,” at “humatol” ay angkop sa marangal ngunit makabagong rehistro. Hindi dapat palitan ang “makinig” ng “sumunod” sa pangunahing teksto, sapagkat interpretibong pagpapalinaw iyon na nararapat manatili sa talababa.
