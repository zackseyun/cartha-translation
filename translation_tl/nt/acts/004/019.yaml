  text: ὁ δὲ Πέτρος καὶ Ἰωάννης ἀποκριθέντες ⸂εἶπον πρὸς αὐτούς⸃· Εἰ δίκαιόν ἐστιν ἐνώπιον τοῦ θεοῦ ὑμῶν ἀκούειν μᾶλλον ἢ τοῦ θεοῦ, κρίνατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/019.yaml
  text: But Peter and John answered and said to them[a], “If it is right in the sight of God to listen to you rather than to God, judge for yourselves.”
translation:
  language: tl
  text: Ngunit sumagot sina Pedro at Juan at sinabi nila sa kanila, “Kung tama sa harap ng Diyos na makinig[a] kami sa inyo nang higit kaysa sa Diyos, kayo ang humatol.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, ayon sa diwa, “sumunod kami sa inyo nang higit kaysa sa Diyos.” Literal na “makinig” ang pandiwang Griyego, ngunit sa kontekstong ito ay may diwa itong pagtalima sa awtoridad.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες ... εἶπον
  choice: sumagot ... at sinabi
  rationale: Pinananatili ang dalawang sangkap ng karaniwang ekspresyong Griyego habang nananatiling malinaw at natural sa Tagalog.
- source_word: δίκαιόν
  choice: tama
  rationale: Sa konteksto, tumutukoy ito sa kung ano ang nararapat at maipagtatanggol sa harap ng Diyos; ang “tama” ang pinakanatural na katumbas sa tuwirang pananalita.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: sa harap ng Diyos
  rationale: Pinananatili nito ang diwa ng isang kilos na sinusuri sa presensiya at paghatol ng Diyos.
- source_word: ἀκούειν
  choice: makinig
  rationale: Literal itong tumutukoy sa pakikinig, ngunit ipinahihiwatig ng konteksto ang pagsunod o pagtalima sa awtoridad. Pinananatili ng “makinig” ang mismong larawan at ang ipinahihiwatig na diwa.
- source_word: μᾶλλον ἢ
  choice: sa halip na
  rationale: Ito ang natural na paghahambing sa Tagalog kapag pinagpipilian kung sino ang pakikinggan o tatalimahin.
- source_word: κρίνατε
  choice: kayo ang humatol
  rationale: Inihahayag ng pautos ang tuwirang hamon sa mga kausap na sila mismo ang gumawa ng pasiya o paghatol.
- source_word: ὁ δὲ Πέτρος καὶ Ἰωάννης
  choice: Ngunit ... sina Pedro at Juan
  rationale: Ipinapakita ng “Ngunit” ang banayad na pagsalungat sa naunang utos ng mga pinuno.
- source_word: πρὸς αὐτούς
  choice: sa kanila
  rationale: Tuwirang pronominal na salin; malinaw sa konteksto kung sino ang tinutukoy.
theological_decisions:
- issue: Kung ang ἀκούειν ay isasaling tahasan bilang “sumunod” dahil sa paghahambing ng awtoridad ng tao at ng Diyos
  choice: Panatilihin sa pangunahing teksto ang “makinig ... sa inyo sa halip na sa Diyos.”
  alternative: “sumunod sa inyo sa halip na sa Diyos”
  rationale: Bagaman malinaw na may diwa ng pagsunod ang konteksto, ἀκούω ang ginamit at hindi isang mas tahasang pandiwa para sa pagsunod. Kaya pinananatili sa teksto ang leksikal na larawan at inilalagay sa talababa ang mas interpretibong katumbas.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang retorikal na hamon at ang bahagyang pag-uulit ng “sumagot ... at sinabi” nang hindi dinaragdagan ang teolohikal na tiyak na kahulugan ng pandiwang “makinig.”
