  text: And it happened that on the next day their rulers and elders and scribes were gathered together in Jerusalem,[a]
translation:
  language: tl
  text: Nang sumunod na araw, nagtipon sa Jerusalem ang kanilang mga pinuno, mga nakatatanda, at mga eskriba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “nagkatipon” o “nagpulong.” Pasibo ang anyo ng pandiwang Griyego: “tinipon” o “pinagtipon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Kinabukasan
  rationale: Ang pormulang pasalaysay ay likas na naipahihiwatig sa Filipino sa paglipat sa susunod na pangyayari; hindi kailangang gawing mabigat na “At nangyari.”
- source_word: ἐπὶ τὴν αὔριον
  choice: Kinabukasan
  rationale: Natural at eksaktong katumbas ng idyomang tumutukoy sa sumunod na araw.
- source_word: συναχθῆναι
  choice: nagkatipon
  rationale: Natural na Filipino para sa sama-samang pagtitipon; pinananatili sa talababa na pasibo ang anyo ng pandiwang Griyego.
- source_word: αὐτῶν
  choice: kanilang
  rationale: Pinananatili ang kaugnayang ipinahahayag ng panghalip nang hindi nililinaw nang labis kung sino ang tiyak na tinutukoy nito.
- source_word: τοὺς ἄρχοντας
  choice: mga pinuno
  rationale: Malinaw at kasalukuyang tawag sa mga may kapangyarihang mamahala sa kontekstong ito.
- source_word: τοὺς πρεσβυτέρους
  choice: mga nakatatanda
  rationale: Tumutukoy sa kinikilalang mga pinuno ng pamayanan, hindi lamang sa matatandang lalaki.
- source_word: τοὺς γραμματεῖς
  choice: mga tagapagturo ng Kautusan
  rationale: Ipinahahayag sa ordinaryong modernong Filipino ang kinikilalang tungkuling panrelihiyon at legal ng mga γραμματεῖς; mas malinaw ito kaysa sa hiram na “mga eskriba.”
- source_word: ἐν Ἰερουσαλήμ
  choice: sa Jerusalem
  rationale: Natural na locative na pahayag sa Filipino.
theological_decisions:
- issue: Tinutukoy ng αὐτῶν sa paglalarawan sa mga nagtipong pinuno
  choice: Isinalin bilang “kanilang” upang mapanatili ang panghalip ng Griyego nang hindi tinutukoy nang mas makitid ang antecedent.
  alternative: Alisin ang panghalip, o ipakahulugang “mga pinuno ng mga Judio.”
  rationale: May tahasang αὐτῶν sa teksto, ngunit konteksto lamang ang nagbibigay ng antecedent; kaya hindi dapat magdagdag ng mas tiyak na pagkakakilanlan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Iniwasan ang arkaikong “At nangyari” at ang teknikal na “mga eskriba,” habang pinanatili ang institusyonal na diwa ng mga katawagan.
