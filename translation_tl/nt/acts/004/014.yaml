translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga apostol” sa halip na “kanila” upang maging malinaw ang tinutukoy, at pinanatili sa talababa ang saklaw ng kahulugan ng ἀντειπεῖν.
