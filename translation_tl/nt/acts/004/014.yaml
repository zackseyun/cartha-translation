  yaml_path: translation/nt/acts/004/014.yaml
  text: And seeing the man who had been healed standing with them[a], they had nothing to say in reply.
translation:
  language: tl
  text: At nang makita nilang nakatayong kasama nina Pedro at Juan ang lalaking pinagaling, wala silang maitutol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “wala silang maisagot” o “wala silang masabi upang sumalungat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τε
  choice: At
  rationale: Iniuugnay ng partikula ang pangungusap sa naunang pangyayari; likas at sapat sa Tagalog ang “At.”
- source_word: ἄνθρωπον
  choice: ang lalaki
  rationale: Tumutukoy ito sa tiyak na lalaking pinagaling sa naunang konteksto.
- source_word: βλέποντες
  choice: nang makita nila
  rationale: Ipinapahayag ang kasabay na pangyayari sa natural na salaysay sa Tagalog habang pinananatili ang ugnayang temporal ng participle sa pangunahing pandiwa.
- source_word: σὺν αὐτοῖς
  choice: kasama ng mga apostol
  rationale: Ang σύν ay nagsasaad ng pagsama. Nilinaw ang reperente ng αὐτοῖς bilang mga apostol upang maiwasan ang malabong panghalip sa Tagalog.
- source_word: ἑστῶτα
  choice: nakatayong
  rationale: Ipinapahayag ang nagpapatuloy na kalagayan ng lalaki bilang nakatayo, ayon sa stative force ng perfect participle.
- source_word: τεθεραπευμένον
  choice: pinagaling
  rationale: Pinananatili ang pasibong diwa at ang natapos na pagpapagaling na may nananatiling resulta.
- source_word: οὐδὲν
  choice: wala
  rationale: Ipinahahayag ang ganap na kawalan ng anumang maitutugon.
- source_word: εἶχον ἀντειπεῖν
  choice: wala silang masabi laban dito
  rationale: Natural na Tagalog ito na pinananatili ang diwang pasalungat ng ἀντειπεῖν, hindi lamang isang pangkalahatang tugon.
