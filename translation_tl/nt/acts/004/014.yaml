  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing diwa: nakita ng mga pinuno ang lalaking pinagaling na nakatayo kasama ng mga apostol, kaya wala silang maitutol. Gayunman, ang “laban dito” ay nagdaragdag ng isang tuwirang “ito” na wala sa Griyego at maaaring magmukhang tumutukoy sa isang partikular na pahayag. Mas mabuting iwang walang tahasang layon ang katumbas ng ἀντειπεῖν.'
  naturalness: Natural ang salaysay, ngunit mas matatas at mas tuwiran sa modernong Filipino ang “wala silang maitutol” kaysa “wala silang masabi laban dito.” Ang pagtukoy kina Pedro at Juan ay nag-aalis ng posibleng kalabuan ng panghalip nang hindi binabago ang tinutukoy sa konteksto.
  terminology: Ang “lalaking pinagaling” at “nakatayo” ay wasto at angkop. Ang “mga apostol” ay hindi mali, ngunit ang “nina Pedro at Juan” ay mas tumpak sa agarang konteksto ng talata.
