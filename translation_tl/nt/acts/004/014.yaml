    issue: Ang “dito” sa “wala silang masabi laban dito” ay hindi tahasang nasa Griyego.
    rationale: Ang ἀντειπεῖν ay nangangahulugang tumutol o sumalungat, ngunit walang ipinahayag na layon sa talata. Ang pag-aalis ng “dito” ay mas malapit sa saklaw ng pinagmulan at pinananatili ang bahagyang hindi pagtukoy ng layon.
  - severity: low
    issue: Maaaring malabo ang “mga apostol” bilang reperente ng αὐτοῖς.
    rationale: Sa agarang konteksto, ang lalaki ay nakatayo kasama nina Pedro at Juan. Ang pagbibigay ng kanilang mga pangalan ay isang ligtas na paglilinaw na umiiwas ding ipagkamali silang ang kapulungan na siyang paksa ng “nakita nila.”
