  yaml_path: translation/nt/acts/004/034.yaml
  text: For there was not even any needy person among them[a], for as many as were owners of fields or houses were selling them and bringing the proceeds of what was sold.
translation:
  language: tl
  text: 'Sapagkat walang ni isa mang nangangailangan sa kanila: ang lahat ng may-ari ng mga bukid o bahay ay nagbebenta ng mga ito at dinadala ang salaping nalikom mula sa pagbebenta[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga halaga ng mga ibinibenta.” Mas literal na “mga halaga” ang salitang Griyego, ngunit ang “salaping nalikom mula sa pagbebenta” ay mas natural na nagpapahayag ng salaping natanggap mula sa pagbebenta.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Sapagkat wala ni isang
  rationale: Ipinahihiwatig ng “sapagkat” ang paliwanag na kaugnay ng naunang pahayag, samantalang pinananatili ng “ni isang” ang diin ng οὐδέ.
- source_word: ἐνδεής
  choice: nangangailangan
  rationale: Natural ito sa makabagong Tagalog at hindi nito nililimitahan ang kakulangan sa pagiging maralita lamang.
- source_word: τις ἦν ἐν αὐτοῖς
  choice: wala ni isang ... sa kanila
  rationale: Ito ang natural na eksistensiyal na pahayag sa Tagalog habang pinananatili ang saklaw na nasa loob ng pamayanan.
- source_word: ὅσοι
  choice: lahat ng
  rationale: Tumutukoy ito sa buong pangkat ng mga taong tumutugon sa paglalarawan, nang hindi pinalalawak ang saklaw lampas sa grupong binabanggit.
- source_word: κτήτορες
  choice: may-ari
  rationale: Malinaw at karaniwang katumbas ng mga taong nagmamay-ari ng ari-arian.
- source_word: χωρίων
  choice: mga bukid
  rationale: Sa konteksto, tumutukoy ito sa mga parsela o lupain; ang “mga bukid” ay maikli at natural.
- source_word: οἰκιῶν
  choice: bahay
  rationale: Tuwirang salin ng kongkretong pangngalan, nang walang dagdag na damdaming maaaring ipahiwatig ng “tahanan.”
- source_word: πωλοῦντες ἔφερον
  choice: ay nagbebenta ... at dinadala
  rationale: Pinananatili ng aspektong di-ganap ang paulit-ulit o nagpapatuloy na gawain sa salaysay at maayos na inilalahad sa Tagalog ang ugnayan ng pandiwari at pangunahing pandiwa.
- source_word: τὰς τιμὰς
  choice: ang napagbentahan
  rationale: Bagaman literal na “mga halaga/presyo,” sa konteksto ay tumutukoy ito sa salaping natanggap mula sa pagbebenta; “napagbentahan” ang natural na katumbas.
- source_word: τῶν πιπρασκομένων
  choice: ng mga ipinagbili
  rationale: Pinananatili nito ang substantibong diwa ng pandiwari nang hindi nililimitahan ang mga bagay sa isang uri lamang ng ari-arian.
