  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “wala ni isang nangangailangan” upang mapanatili ang diin, at ang mga pandiwang “nagbebenta” at “dinadala” upang ipakita ang nagpapatuloy o paulit-ulit na kilos.
