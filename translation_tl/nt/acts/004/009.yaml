  yaml_path: translation/nt/acts/004/009.yaml
  text: If we are being examined today concerning a good deed done to a sick man[b][a], by what means this man has been healed—
translation:
  language: tl
  text: Kung sinisiyasat kami ngayon tungkol sa isang mabuting gawa para sa isang taong may karamdaman, kung sa anong paraan siya napagaling[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “naligtas” o “napagaling.” Ang pandiwang Griyego ay maaaring tumukoy sa pagsagip, pagliligtas, o pagpapagaling; sa kontekstong ito, pisikal na paggaling ang pangunahing diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακρινόμεθα
  choice: sinisiyasat
  rationale: Ipinahihiwatig ng pandiwa ang legal o opisyal na pagtatanong. Likas sa makabagong Filipino ang “sinisiyasat” at hindi nito labis na ipinapalagay na pormal nang nililitis o marahas na iniimbestigahan ang mga apostol.
- source_word: ἐπὶ εὐεργεσίᾳ
  choice: dahil sa kabutihang ginawa
  rationale: Ipinapakita ng ἐπί na ang mabuting gawa ang dahilan o okasyon ng pagsisiyasat. Pinananatili ng salin ang kabalintunaang sinisiyasat sila dahil sa isang kapaki-pakinabang na gawa.
- source_word: ἀνθρώπου ἀσθενοῦς
  choice: sa isang taong may karamdaman
  rationale: Ang parirala ay tumutukoy sa tumanggap ng kabutihang ginawa. Sa konteksto, pisikal na kahinaan ang tinutukoy; ang “may karamdaman” ay malinaw at hindi labis na nagtatakda ng uri ng kapansanan.
- source_word: ἐν τίνι
  choice: sa anong paraan
  rationale: Maaaring ipahiwatig ng parirala ang paraan, kasangkapan, o ahensiya. Pinananatili ng “sa anong paraan” ang lawak ng Griyego at hinahayaang tukuyin ng kasunod na talata na si Jesus ang pinagmulan ng kagalingan.
- source_word: σέσωσται
  choice: gumaling
  rationale: Ang perpektong anyo ng σῴζω ay maaaring mangahulugang nailigtas o napagaling. Dahil ang agarang konteksto ay pisikal na paggaling ng lalaking dating lumpo, “gumaling” ang pinakanatural dito, habang inilalahad sa talababa ang mas malawak na kahulugan.
theological_decisions:
- issue: Kahulugan ng σέσωσται sa konteksto ng pagpapagaling
  choice: gumaling
  alternative: naligtas; naging maayos
  rationale: Pangunahing tinutukoy ng konteksto ang pisikal na paggaling, ngunit hindi dapat burahin ang ugnayang leksikal ng σῴζω sa pagliligtas. Kaya nasa pangunahing teksto ang natural na kahulugang pangkonteksto at nasa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “taong may karamdaman” sa halip na mas makitid na katawagang medikal, at pinanatili ang bitin na pangungusap sa hulihan dahil nagpapatuloy ang pananalita sa susunod na talata.
