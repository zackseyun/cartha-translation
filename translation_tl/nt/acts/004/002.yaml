    rationale: Ang kayariang ito ay maaaring basahing parang simpleng pahayag na “may” isang muling pagkabuhay kay Jesus, sa halip na ang ἐν τῷ Ἰησοῦ ay modifier ng ipinapahayag na muling pagkabuhay. Kailangan ng mas malinaw ngunit di-mapagpasiyang pananalita.
  - severity: low
    issue: Ang “nababagabag” ay hindi ang pinakatumpak na emosyonal na kulay ng διαπονούμενοι.
    rationale: Mas nangingibabaw sa pandiwa ang matinding pagkainis o pagkayamot kaysa pagkabahala. Ang “lubhang nainis” ay mas tapat at likas sa Tagalog.
