  text: διαπονούμενοι διὰ τὸ διδάσκειν αὐτοὺς τὸν λαὸν καὶ καταγγέλλειν ἐν τῷ Ἰησοῦ τὴν ἀνάστασιν ⸂τὴν ἐκ⸃ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/002.yaml
  text: being greatly disturbed because they were teaching the people and proclaiming in Jesus the resurrection from the dead,[a]
translation:
  language: tl
  text: lubhang nainis dahil tinuturuan nila ang mga tao at ipinapahayag, kaugnay ni Jesus, ang muling pagkabuhay mula sa mga patay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ipinapahayag, sa kaso ni Jesus, ang muling pagkabuhay mula sa mga patay.” Maaaring partikular na tumukoy ang pariralang Griyego na “kay Jesus” sa muling pagkabuhay na nahayag sa sarili niyang pagkabuhay.
    reason: alternative_reading
lexical_decisions:
- source_word: διαπονούμενοι
  choice: lubhang nababagabag
  rationale: Ipinahihiwatig ng pandiwari ang matinding pagkayamot o pagkabalisa ng mga pinuno. Pinananatili ng “lubhang nababagabag” ang tindi nang hindi nagiging masyadong kolokyal o labis ang emosyon.
- source_word: διὰ τὸ διδάσκειν
  choice: dahil nagtuturo sila
  rationale: Ang διά na sinusundan ng articular infinitive ay nagsasaad ng dahilan. Natural sa modernong Tagalog ang sugnay na may “dahil.”
- source_word: αὐτοὺς
  choice: sila
  rationale: Tumutukoy ang panghalip sa mga tagapagsalitang binanggit sa naunang konteksto; hindi pinangalanan sa salin upang hindi magdagdag sa mismong talata.
- source_word: τὸν λαὸν
  choice: sa mga tao
  rationale: Tumutukoy ang λαός sa sambayanan o mga tao bilang pangkat, hindi lamang sa isang di-tiyak na pulutong.
- source_word: καταγγέλλειν
  choice: ipinapahayag
  rationale: Ipinapakita ng pandiwa ang hayagan at pampublikong pagpapahayag; malinaw at marangal sa Tagalog ang “ipinapahayag.”
- source_word: ἐν τῷ Ἰησοῦ
  choice: na kay Jesus ay may
  rationale: Ang kayariang ito ay nagpapanatili sa ugnayan ng muling pagkabuhay kay Jesus nang hindi tiyakang nagpapasya kung ang diin ay sa sarili niyang pagkabuhay, sa muling pagkabuhay na nahayag sa kanya, o sa muling pagkabuhay sa pamamagitan niya.
- source_word: ἀνάστασιν
  choice: muling pagkabuhay
  rationale: Ito ang malinaw at kinagawiang salin ng ἀνάστασις sa modernong Tagalog at pinananatili ang teolohikal na bigat ng termino.
- source_word: τὴν ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Tapat itong naghahatid ng diwang pagbangon mula sa kalipunan ng mga patay, sa natural na Tagalog.
theological_decisions:
- issue: Kahulugan ng ἐν τῷ Ἰησοῦ kaugnay ng ipinapahayag na muling pagkabuhay
  choice: Isinalin bilang “na kay Jesus ay may muling pagkabuhay,” na pinananatiling nakasentro kay Jesus ang pahayag nang hindi lubusang nilulutas ang gamit ng ἐν.
  alternative: “ipinapahayag, sa nangyari kay Jesus, ang muling pagkabuhay mula sa mga patay” o “ipinapahayag sa pamamagitan ni Jesus ang muling pagkabuhay mula sa mga patay”
  rationale: Maaaring tumukoy ang parirala sa muling pagkabuhay na nahayag sa kaso ni Jesus, nakasentro sa kanya, o sa pamamagitan niya. Pinananatili ng pangunahing teksto ang pagiging bukas ng Griyego, at inilalahad ng talababa ang pinakamalapit na alternatibong pagbasa.
- issue: Saklaw ng “muling pagkabuhay mula sa mga patay”
  choice: Hinahayaan ng salin na tumukoy kapwa sa pagkabuhay ni Jesus at sa mas malawak na pag-asa ng muling pagkabuhay na nahayag sa kanya.
  alternative: Mahigpit na pagtukoy lamang sa sariling pagkabuhay ni Jesus, o tanging sa pangkalahatang muling pagkabuhay sa hinaharap
  rationale: Hindi tahasang nililimitahan ng pananalita ni Lucas ang saklaw sa isa lamang sa magkaugnay na diwang ito, kaya hindi rin iyon pinakikitid ng salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Nananatiling maliit ang unang titik sapagkat ang talata ay nagpapatuloy sa pangungusap mula sa naunang talata. Iniwasan ang mas teknikal na “pagkabuhay na mag-uli” upang maging mas natural, habang pinananatili ang tradisyonal at malinaw na konsepto sa “muling pagkabuhay.”
