  verdict: revise
  source_fidelity: Tama ang sanhi, ang pagtuturo sa mga tao, at ang hayagang pagpapahayag ng muling pagkabuhay mula sa mga patay. Gayunman, ang “na kay Jesus ay may” ay hindi natural na paraan upang ilahad ang ἐν τῷ Ἰησοῦ at maaari ring magmukhang isang hiwalay na sugnay na eksistensiyal. Ang “kaugnay ni Jesus” ay mas malinaw na naipapakita ang ugnayan kay Jesus nang hindi ipinagpapalagay na tiyak na instrumental (“sa pamamagitan ni Jesus”) o tanging ang sariling pagkabuhay niya ang tinutukoy.
  naturalness: Ang “lubhang nababagabag” ay katanggap-tanggap at marangal, bagaman maaari itong magpahiwatig ng pag-aalala kaysa pagkayamot. Sa kontekstong ito, ang “lubhang nainis” ay mas tuwirang tumutugma sa διαπονούμενοι at natural pa rin sa modernong Filipino. Ang binagong ayos ng huling parirala ay mas madaling basahin nang malakas.
  terminology: Ang “muling pagkabuhay” at “mula sa mga patay” ay wasto at malinaw. Pinanatili ang “ipinapahayag” para sa pampublikong χαρακτήρα ng καταγγέλλειν. Ginamit ang “kaugnay ni Jesus” upang huwag labis na lutasin ang pinagtatalunang saklaw ng ἐν τῷ Ἰησοῦ.
