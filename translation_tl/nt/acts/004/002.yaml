- from: lubhang nababagabag dahil nagtuturo sila sa mga tao at ipinapahayag na kay Jesus ay may muling pagkabuhay mula sa mga patay.[a]
  to: lubhang nainis dahil tinuturuan nila ang mga tao at ipinapahayag, kaugnay ni Jesus, ang muling pagkabuhay mula sa mga patay.[a]
  rationale: Binago ang salin upang gawing natural ang Tagalog at upang mas maayos na mapanatili ang bukas na ugnayang ipinahihiwatig ng ἐν τῷ Ἰησοῦ. Hindi pinili ang “sa pamamagitan ni Jesus,” sapagkat mas tiyak itong instrumental kaysa sa kinakailangan ng Griyego; hindi rin ginawang tahasan sa pangunahing teksto na sarili lamang ni Jesus ang tinutukoy. Inayos din ang salin ng διαπονούμενοι upang mas maipakita ang pagkainis ng mga sumasalungat.
