  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃ διὰ ⸂πνεύματος ἁγίου⸃ στόματος Δαυὶδ παιδός σου εἰπών· Ἱνατί ἐφρύαξαν ἔθνη καὶ λαοὶ ἐμελέτησαν κενά;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/025.yaml
  text: 'who[a], through the Holy Spirit, by the mouth of David your servant, said: ‘Why did the nations rage[b], and the peoples devise vain things?’'
translation:
  language: tl
  text: 'na siyang nagsabi[a] sa pamamagitan ng Espiritu Santo, sa pamamagitan ng bibig ni David na iyong lingkod:


    “Bakit nagngalit ang mga bansa,


    at ang mga bayan ay nagbalak[b] ng mga bagay na walang kabuluhan?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito ay mababasa ang “aming amang si David, na iyong lingkod,” kaya maaaring unawain ang panimula: “na sa pamamagitan ng Espiritu Santo, sa pamamagitan ng bibig ng aming amang si David, na iyong lingkod, ay nagsabi.”'
    reason: textual_variant
  - marker: b
    text: O “nagbulay-bulay tungkol sa mga bagay na walang kabuluhan.” Ang pandiwang Griego ay maaaring mangahulugang “magbulay-bulay,” ngunit sa kontekstong ito ay maaari ring mangahulugang “magbalak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃
  choice: na siyang nagsabi
  rationale: Ikinakabit ng “na siyang” ang pahayag sa Diyos na tinutukoy sa naunang talata. Hindi isinama sa pangunahing teksto ang tekstuwal na αμφιβολία tungkol sa “aming ama,” ngunit itinala ito sa talababa.
- source_word: διὰ πνεύματος ἁγίου
  choice: sa pamamagitan ng Espiritu Santo
  rationale: Pinananatili nito ang diwa ng paraan o ahensiya na ipinahihiwatig ng διά na may genitive.
- source_word: στόματος Δαυὶδ
  choice: sa bibig ... ni David
  rationale: Pinananatili ang biblikal na idyoma ng propetikong pagsasalita sa halip na paikliin lamang bilang “sa pamamagitan ni David.”
- source_word: παιδός σου
  choice: iyong lingkod
  rationale: Bagaman maaaring mangahulugan ang παῖς na anak o lingkod, ang pagtukoy kay David bilang lingkod ng Diyos ang angkop sa konteksto.
- source_word: Ἱνατί
  choice: Bakit
  rationale: Ito ang tuwiran at likas na katumbas ng tanong.
- source_word: ἐφρύαξαν
  choice: nagngalit
  rationale: Ipinahahayag nito ang marahas at mapanghimagsik na pagkilos ng mga bansa.
- source_word: ἔθνη
  choice: mga bansa
  rationale: Malawak ang tinutukoy sa sipi ng Awit, kaya hindi ito isinalin bilang “mga Hentil.”
- source_word: λαοὶ
  choice: mga bayan
  rationale: Pinananatili ang maramihang anyo at ang paralelismo sa “mga bansa.”
- source_word: ἐμελέτησαν
  choice: nagbalak
  rationale: Sa konteksto ng pagsalungat, ang pandiwa ay tumutukoy sa pagbabalak o pagbuo ng plano; ang literal na diwang “nagbulay-bulay” ay inilagay sa talababa.
- source_word: κενά
  choice: ng walang kabuluhan
  rationale: Likas sa modernong Filipino at ipinahahayag kapwa ang kahungkagan at pagkawalang-bisa ng kanilang balak.
theological_decisions:
- issue: Tekstuwal na anyo ng panimula sa sipi
  choice: Hindi isinama sa pangunahing teksto ang “aming ama,” at iniugnay ang nagsasalita sa Diyos sa naunang talata.
  alternative: “na sa pamamagitan ng Espiritu Santo, sa bibig ng aming amang si David na iyong lingkod, ay nagsabi”
  rationale: Hindi tiyak at sintaktikong mahirap ang pariralang τοῦ πατρὸς ἡμῶν sa tradisyong tekstuwal. Pinananatiling malinaw ang pangunahing teksto habang hayagang itinatala sa talababa ang ibang pagbasa.
- issue: Kahulugan ng ἐμελέτησαν sa sipi ng Awit
  choice: nagbalak
  alternative: nagbulay-bulay
  rationale: Ang konteksto ay sama-samang pagsalungat sa Diyos at sa kanyang Hinirang, kaya ang “nagbalak” ang likas na kontekstuwal na kahulugan, habang pinananatili sa talababa ang mas literal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang anyong patula ng sipi at ang biblikal na idyomang “sa bibig,” nang hindi nagiging lipas o labis na literal.
