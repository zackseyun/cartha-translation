  yaml_path: translation/nt/acts/004/018.yaml
  text: And after calling them in[a], they ordered them not to speak at all nor teach in the name of Jesus.
translation:
  language: tl
  text: At ipinatawag nila ang dalawa at inutusan silang huwag man lang magsalita ni magturo sa pangalan ni Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “inutusan silang huwag magsabi ng anuman ni magturo sa pangalan ni Jesus.”
    reason: Ipinapakita ang mas ekspresibong salin ng mariing τὸ καθόλου μὴ φθέγγεσθαι, nang hindi nililimitahan ang saklaw ng pagbabawal.
lexical_decisions:
- source_word: καλέσαντες αὐτοὺς
  choice: tinawag nila ang dalawa
  rationale: Ang aorist participle ay nauunang kilos sa pangunahing pandiwa. Ang “tinawag” ay natural sa konteksto ng pagdinig; nilinaw ng “ang dalawa” ang pangmaramihang panghalip ayon sa agarang konteksto nang hindi dinaragdagan ang pagkakakilanlan nila.
- source_word: παρήγγειλαν
  choice: mahigpit na inutusan
  rationale: Nagpapahayag ang pandiwa ng makapangyarihang utos. Ipinahihiwatig ng “mahigpit” ang lakas nito sa natural na modernong Tagalog.
- source_word: τὸ καθόλου μὴ φθέγγεσθαι
  choice: huwag magsalita ... man lang
  rationale: Ang καθόλου ay nagbibigay-diin sa lubos na pagbabawal. Natural na ipinahahayag ito sa Tagalog ng “man lang,” bagaman maaaring saklawin ng ayos ng Griyego ang buong pinagsamang pagbabawal.
- source_word: μηδὲ διδάσκειν
  choice: o magturo
  rationale: Ikinakabit ng μηδέ ang ikalawang ipinagbabawal na gawain sa una. Ang “o” pagkatapos ng “huwag” ang natural na koordinasyon sa kasalukuyang Tagalog.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: sa pangalan ni Jesus
  rationale: Pinananatili ng karaniwang pariralang ito ang kaugnayan sa pangalan at posibleng awtoridad ni Jesus nang hindi nililimitahan ang kahulugan sa isa lamang sa mga iyon.
theological_decisions:
- issue: Lawak ng pagbabawal tungkol kay Jesus
  choice: Isang mariing pagbabawal sa pagsasalita at pagtuturo sa pangalan ni Jesus
  alternative: Pagbabawal lamang sa pampublikong pagpapahayag
  rationale: Pinagsasama ng τὸ καθόλου, μὴ φθέγγεσθαι, at μηδὲ διδάσκειν ang diin at dalawang uri ng gawaing pasalita. Hindi nililimitahan ng salin ang utos sa pampublikong pangangaral lamang.
- issue: Kahulugan ng ἐπὶ τῷ ὀνόματι
  choice: sa pangalan ni Jesus
  alternative: tungkol sa pangalan ni Jesus; batay sa awtoridad ng pangalan ni Jesus
  rationale: May saklaw ang parirala na kaugnayan, batayan, o awtoridad. Pinananatili ng tradisyonal ngunit natural na “sa pangalan” ang tunay na lawak nito sa halip na pumili ng iisang paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ang dalawa” sa halip na malabong “sila” dahil dalawang lalaking sina Pedro at Juan ang tuwirang tinutukoy sa konteksto. Inilagay ang marker [a] sa pangunahing teksto ayon sa footnote.
