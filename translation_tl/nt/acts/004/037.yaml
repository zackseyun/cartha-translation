  text: ὑπάρχοντος αὐτῷ ἀγροῦ πωλήσας ἤνεγκεν τὸ χρῆμα καὶ ἔθηκεν ⸀παρὰ τοὺς πόδας τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/037.yaml
  text: Since he owned a field[b][a], he sold it and brought the money and laid it at the apostles’ feet.
translation:
  language: tl
  text: Mayroon siyang bukid.[a] Ipinagbili niya ito, dinala ang salapi,[b] at inilagay ito sa paanan ng mga apostol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Yamang may bukid siya” o “Dahil may bukid siya.” Ginagamit ng Griyego ang genitive absolute upang magbigay ng kalagayang nasa background.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang pinagbentahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπάρχοντος αὐτῷ ἀγροῦ
  choice: May bukid siyang pag-aari
  rationale: Ipinahahayag ng genitive absolute ang kalagayang nagsisilbing background. Likas sa modernong Tagalog ang pariralang ito at malinaw nitong ipinakikitang ang bukid ay pag-aari niya nang hindi ginagawang tahasang dahilan ang maaaring circumstantial lamang na ugnayan.
- source_word: ἀγροῦ
  choice: bukid
  rationale: Ang ἀγρός ay karaniwang tumutukoy sa bukid o lupang sakahan. Pinananatili ng “bukid” ang tuwirang larawan ng Griyego.
- source_word: πωλήσας
  choice: Ipinagbili niya iyon
  rationale: Nauna sa mga pangunahing pandiwa ang kilos ng aorist participle. Malinaw na ipinahahayag ng hiwalay na sugnay ang pagkakasunod-sunod; ang “iyon” ay likas na tumutukoy sa bukid.
- source_word: ἤνεγκεν
  choice: dinala
  rationale: Sa kontekstong ito, ang φέρω ay nangangahulugang dalhin ang salapi sa mga apostol.
- source_word: τὸ χρῆμα
  choice: ang salapi
  rationale: Tumutukoy ang χρῆμα sa perang natanggap mula sa pagbebenta. Ang “salapi” ay tuwiran, dignificado, at hindi higit na interpretatibo kaysa “pinagbentahan.”
- source_word: ἔθηκεν
  choice: inilagay
  rationale: Ang τίθημι ay nangangahulugang ilagay o ipatong. Natural ang “inilagay” kasama ng pariralang “sa paanan.”
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: sa paanan ng mga apostol
  rationale: Pinananatili nito ang konkretong larawan ng paglalagay ng salapi sa harap ng mga apostol at ang pahiwatig na ipinagkakatiwala ito sa kanilang pangangasiwa.
theological_decisions:
- issue: Kung pananatilihin ang pisikal na idyoma ng paghaharap ng salapi sa awtoridad ng mga apostol
  choice: Pinanatili ang “inilagay sa paanan ng mga apostol.”
  alternative: “ibinigay sa mga apostol”
  rationale: Inilalarawan ng talata ang aktuwal na kilos ng paghaharap at maaari ring magpahiwatig ng pagpapaubaya sa pangangasiwa ng mga apostol. Pinananatili ng konkretong larawan ang dalawang aspektong ito nang hindi nagdaragdag ng doktrinang eklesiyolohikal.
- issue: Kung gagawing sanhi ang pambungad na genitive absolute
  choice: 'Isinalin bilang background circumstance: “May bukid siyang pag-aari.”'
  alternative: “Dahil may bukid siyang pag-aari”
  rationale: Maaaring circumstantial lamang ang konstruksyon at hindi kinakailangang tahasang causal. Iniiwasan ng napiling salin ang paglutas sa tunay na saklaw ng ugnayan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “salapi” sa halip na mas kolokyal na “pera,” at pinanatili ang konkretong “sa paanan ng mga apostol.”
