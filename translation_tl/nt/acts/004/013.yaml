review_pass:
  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: ang pagmamasid sa hayag na tapang nina Pedro at Juan, ang pagkaunawa sa kakulangan nila ng pormal na pagsasanay at katayuang propesyonal, ang pagkamangha, at ang pagkilalang nakasama nila si Jesus. Gayunman, ang “Nakilala rin nilang” ay maaaring basahing parang personal na pagkakilala sa isang tao kaysa pagkilala sa kanilang dating kaugnayan kay Jesus.'
  naturalness: Makabago at madaling maunawaan ang salin. Mas magiging malinaw at mas maayos ang daloy kung ang dalawang participle ay kapwa isasalin bilang “nang … nila,” at kung gagamitin ang “nakilala nila na” para sa pagkilala sa dating pakikisama nila kay Jesus.
  terminology: 'Ang “lakas ng loob” ay angkop para sa παρρησίαν. Ang “walang pormal na pinag-aralan” ay maingat at hindi maling nagsasabing hindi sila literate. Ang “mga karaniwang tao” ay mas natural at kumpletong katumbas ng ἰδιῶται kaysa “karaniwan lamang.” Kailangang ayusin ang talababa: ang “mga iskolar” ay hindi ang tinutukoy ng Griyego; ang punto ay kawalan ng pormal na pagsasanay at opisyal o propesyonal na katayuan.'
  issues:
  - severity: medium
    issue: Hindi sapat ang linaw ng “Nakilala rin nilang nakasama sila ni Jesus.”
    rationale: Ang “nakilala” ay maaaring mangahulugang naging pamilyar o personal na nakilala. Sa kontekstong ito, ἐπεγίνωσκον ay pagkilala/identipikasyon sa katotohanang sina Pedro at Juan ay dating nakasama ni Jesus. Ang “nakilala nila na” ay mas malinaw.
  - severity: low
    issue: Hindi ganap na paralel ang “Nang makita nila … at maunawaang sila’y ….”
    rationale: Ang dalawang participle sa Griyego ay kapwa tumutukoy sa pagkaunawa ng mga pinuno. Ang “nang makita nila … at nang mapagtanto nila …” ay mas malinaw at likas sa modernong Filipino.
  - severity: medium
    issue: Hindi tumpak ang paglalarawan sa talababa na “walang pormal na pagsasanay bilang mga iskolar.”
    rationale: Hindi sinasabi ng teksto na ang usapin ay pagiging iskolar; tumutukoy ito sa kawalan ng pormal na edukasyon/pagsasanay at sa pagiging di-opisyal o di-propesyonal na mga tao. Dapat ding maging mas natural ang alternatibong salin.
  revised_text: Nang makita nila ang lakas ng loob nina Pedro at Juan, at nang mapagtanto nilang sila’y mga taong walang pormal na pinag-aralan at mga karaniwang tao[a], namangha sila. Nakilala nila na nakasama sila ni Jesus.
