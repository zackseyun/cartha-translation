  to: Nang makita nila ang lakas ng loob nina Pedro at Juan, at nang mapagtanto nilang sila’y mga taong walang pormal na pinag-aralan at mga karaniwang tao[a], namangha sila. Nakilala nila na nakasama sila ni Jesus.
  rationale: Inayos ang magkakatulad na sugnay upang malinaw na kapwa pagmamasid at pagkaunawa ang ginawa ng mga pinuno. Pinalitan ang “karaniwan lamang” ng “mga karaniwang tao” upang maging kumpletong at natural na paglalarawan ng ἰδιῶται. Nilinaw ang huling sugnay bilang pagkilala sa dating pakikisama nina Pedro at Juan kay Jesus, at itinama ang paliwanag sa talababa upang hindi ipakahulugang ang Griyego ay tuwirang tumutukoy sa pagiging “iskolar.”
