source:
  edition: SBLGNT
  text: Θεωροῦντες δὲ τὴν τοῦ Πέτρου παρρησίαν καὶ Ἰωάννου καὶ καταλαβόμενοι ὅτι ἄνθρωποι ἀγράμματοί εἰσιν καὶ ἰδιῶται, ἐθαύμαζον, ἐπεγίνωσκόν τε αὐτοὺς ὅτι σὺν τῷ Ἰησοῦ ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/013.yaml
  text: As they observed the boldness of Peter and John[a], and realized that they were uneducated and ordinary men, they were astonished, and they recognized that they had been with Jesus.
translation:
  language: tl
  text: Nang makita nila ang lakas ng loob nina Pedro at Juan, at nang mapagtanto nilang sila’y mga taong walang pormal na pinag-aralan at mga karaniwang tao[a], namangha sila. Nakilala nila na nakasama sila ni Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga walang pormal na pagsasanay at mga karaniwang mamamayan.” Inilalarawan ng Griyego ang mga lalaking walang pormal na pagsasanay sa pag-aaral at walang opisyal o propesyonal na katayuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωροῦντες
  choice: Nang makita nila
  rationale: Ipinahihiwatig ng participle ang mapanuring pagmamasid ng mga pinuno na humantong sa kanilang reaksiyon; likas sa Filipino ang “nang makita” sa ganitong salaysay.
- source_word: παρρησίαν
  choice: lakas ng loob
  rationale: Tumutukoy ito sa matapang at hayagang pagsasalita. Ang “lakas ng loob” ay natural na Filipino at hindi nililimitahan ang diwa sa lakas o tindi lamang ng pananalita.
- source_word: καταλαβόμενοι
  choice: maunawaang
  rationale: Ipinapakita ng salita na napagtanto o naunawaan nila ang kalagayan nina Pedro at Juan.
- source_word: ἄνθρωποι ἀγράμματοί
  choice: mga taong walang pormal na pinag-aralan
  rationale: Hindi nito kinakailangang sabihing hindi sila marunong bumasa o sumulat; sa konteksto, wala silang pormal na pagsasanay ng mga eskriba o guro ng kautusan.
- source_word: ἰδιῶται
  choice: karaniwan lamang
  rationale: Ipinakikita ang kanilang katayuan bilang mga taong hindi kabilang sa mga sinanay o opisyal na dalubhasa, nang hindi sila tinatawag na mangmang.
- source_word: ἐθαύμαζον
  choice: namangha sila
  rationale: Malinaw at natural nitong ipinahahayag ang patuloy na pagtataka ng mga pinuno.
- source_word: ἐπεγίνωσκόν
  choice: Nakilala rin nila
  rationale: Ang pandiwa ay nagsasaad ng pagkilala o pagkabatid, at ang τε ay natural na naipahahayag ng “rin.”
- source_word: σὺν τῷ Ἰησοῦ ἦσαν
  choice: nakasama sila ni Jesus
  rationale: Ipinahihiwatig ng konteksto ang dati nilang pakikisama kay Jesus; ang “nakasama” ay maikli at likas sa Filipino.
theological_decisions:
- issue: Paglalarawan sa katayuang panlipunan at edukasyon nina Pedro at Juan
  choice: “mga taong walang pormal na pinag-aralan at karaniwan lamang”
  alternative: “mga hindi nakapag-aral at mga karaniwang mamamayan” o “mga hindi aral at layko”
  rationale: Iniiwasan ng salin ang maling pahiwatig na sila ay mangmang o tiyak na hindi marunong bumasa at sumulat. Pinananatili nito ang kaibhan nila sa mga pormal na sinanay at opisyal na dalubhasa nang hindi nag-aangkat ng makabagong denominasyonal na kahulugan ng “layko.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “lakas ng loob” para sa matapang na hayagang pagsasalita, at nilinaw ang kawalan ng pormal na pagsasanay nang hindi ipinapalagay na hindi marunong bumasa o sumulat sina Pedro at Juan.
