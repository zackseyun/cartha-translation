id: ACT.4.10
reference: Acts 4:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: γνωστὸν ἔστω πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραὴλ ὅτι ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου, ὃν ὑμεῖς ἐσταυρώσατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, ἐν τούτῳ οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/010.yaml
  text: let it be known to all of you and to all the people of Israel that in the name of Jesus the Messiah the Nazarene[a], whom you crucified[c][b], whom God raised from the dead—by this name this man stands before you healthy.
translation:
  language: tl
  text: Ipaalam sa inyong lahat at sa buong sambayanang Israel na sa pangalan ni Jesus na Mesiyas na taga-Nazaret[a]—na ipinako ninyo sa krus at muling binuhay ng Diyos mula sa mga patay—sa pamamagitan ng pangalang ito[b] ay nakatayo sa harap ninyo ang lalaking ito na gumaling na[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Jesus Cristo na taga-Nazaret.” Ang titulong Griyego na Χριστός ay maaaring isaling “Mesiyas” o, kapag ginagamit na higit na tulad ng pangalan, “Cristo.”
    reason: alternative_reading
  - marker: b
    text: O “sa pamamagitan niya.” Maaaring tumukoy ang ἐν τούτῳ kay Jesus mismo o, mas tiyak, sa pangalang kababanggit lamang.
    reason: lexical_alternative
  - marker: c
    text: O “malusog” o “lubos na magaling.” Ang Griyegong ὑγιής ay tumutukoy sa mabuti o naibalik na kalusugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: Ipaalam
  rationale: Likas at mariing pormula sa makabagong Tagalog para sa pampublikong pagpapahayag; pinananatili ang puwersa ng pautos na konstruksyon.
- source_word: πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραήλ
  choice: sa inyong lahat at sa buong sambayanang Israel
  rationale: Pinananatili ang pagkakaiba ng mga kausap na naroon at ng mas malawak na sambayanang Israel.
- source_word: ἐν τῷ ὀνόματι
  choice: sa pangalan ni
  rationale: Pinananatili ang idyomang Griyego at ang diwang ang pangalan, kapangyarihan, o awtoridad ni Jesus ang mabisang saligan ng pagpapagaling.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong 'Mesiyas' sa halip na ituring na apelyido; natural sa Tagalog ang pang-ugnay na 'na'.
- source_word: τοῦ Ναζωραίου
  choice: ang Nazareno
  rationale: Direktang katumbas ng pantukoy na titulo sa Griyego at malinaw na tumutukoy kay Jesus na mula sa Nazaret.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: na ipinako ninyo sa krus
  rationale: Tuwirang pinananatili ang paratang at ang hayag na paksa na 'ninyo'.
- source_word: ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν
  choice: muling binuhay ng Diyos mula sa mga patay
  rationale: Karaniwang Tagalog para sa pananalita tungkol sa muling pagkabuhay; pinananatili ang Diyos bilang gumaganap at ang pinagmulan na 'mula sa mga patay.'
- source_word: ἐν τούτῳ
  choice: sa pamamagitan niya
  rationale: Ang demonstratibo ay pinakamalamang na tumutukoy kay Jesus at gumaganap na instrumental; nananatili sa talababa ang posibilidad na mas tiyak itong tumutukoy sa pangalang nabanggit.
- source_word: οὗτος
  choice: ang lalaking ito
  rationale: Nililinaw sa natural na Tagalog na ang demonstratibo ay tumutukoy sa lalaking pinagaling na naroon.
- source_word: παρέστηκεν ἐνώπιον ὑμῶν
  choice: ay nakatayo sa harap ninyo
  rationale: Ipinahahayag ang kasalukuyang kalagayang bunga ng naunang pangyayari, gaya ng aspektong perpekto sa Griyego.
- source_word: ὑγιής
  choice: magaling na
  rationale: Natural na paglalarawan sa Tagalog ng taong naibalik sa maayos na kalusugan; hindi nito ipinapasok ang mas malawak na teolohikal na diwa ng 'ganap.'
theological_decisions:
- issue: Kung titulo o pangalang anyo ang Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa pagpapahayag sa mga pinuno at sambayanang Israel, nananatiling buhay ang titular na kahulugan ng Χριστός; kaya isinasalin ito bilang 'Mesiyas' nang hindi nagdaragdag ng denominasyonal na paliwanag.
- issue: Saklaw ng ἐν τούτῳ
  choice: sa pamamagitan niya
  alternative: sa pamamagitan ng pangalang ito
  rationale: Maaaring tumukoy ang demonstratibo kay Jesus mismo o sa kaniyang pangalang kasasabi lamang. Pinili sa teksto ang personal na reperente ngunit pinanatili sa talababa ang tunay na alternatibo.
- issue: Pananalita tungkol sa muling pagkabuhay
  choice: muling binuhay ng Diyos mula sa mga patay
  alternative: ibinangon ng Diyos mula sa mga patay
  rationale: Pinananatili ang tahasang pagkilos ng Diyos at ang pahayag ng muling pagkabuhay, nang walang dagdag na sistematikong paliwanag.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino Tagalog. Ginamit ang 'sambayanang Israel' upang maging natural ngunit mapanatili ang kolektibong λαός, at ang 'Nazareno' bilang pormal na katawagan. Ang mga panaklong na gitling ay tumutulong na luminaw ang mahahabang sugnay nang hindi binabago ang ugnayang sintaktiko.
