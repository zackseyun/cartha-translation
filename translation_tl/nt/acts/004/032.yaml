  to: Iisa ang puso at kaluluwa[a] ng buong kapulungan ng mga sumampalataya. Wala ni isa sa kanila ang nagsabing sarili niya ang alinman sa kanyang mga ari-arian,[b] kundi ang lahat ng bagay ay pinagsasaluhan nilang lahat.
