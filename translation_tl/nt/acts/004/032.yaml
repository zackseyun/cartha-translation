id: ACT.4.32
reference: Acts 4:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τοῦ δὲ πλήθους τῶν πιστευσάντων ἦν ⸀καρδία καὶ ⸀ψυχὴ μία, καὶ οὐδὲ εἷς τι τῶν ὑπαρχόντων ⸀αὐτῷ ἔλεγεν ἴδιον εἶναι, ἀλλ’ ἦν αὐτοῖς ⸀πάντα κοινά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/032.yaml
  text: The multitude of those who had believed were of one heart and soul[a], and not even one of them said that anything belonging to him was his own[b], but all things were held in common among them.
translation:
  language: tl
  text: Iisa ang puso at kaluluwa[a] ng buong kapulungan ng mga sumampalataya. Wala ni isa sa kanila ang nagsabing sarili niya ang alinman sa kanyang mga ari-arian,[b] kundi ang lahat ng bagay ay pinagsasaluhan nilang lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas malayang pananalita: “Lubos silang nagkakaisa.”'
    reason: lexical_alternative
  - marker: b
    text: Nasa isahan sa Griyego ang “kanyang,” sapagkat isa-isang tinutukoy ang bawat tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθους
  choice: buong kapulungan
  rationale: Ipinahihiwatig ng πλῆθος ang malaking bilang o kabuuang pangkat. Natural sa modernong Tagalog ang “buong kapulungan” at hindi nito ipinapasok ang mas teknikal na diwa ng isang pormal na institusyon.
- source_word: τῶν πιστευσάντων
  choice: ng mga sumampalataya
  rationale: 'Pinananatili nitong pandiwa ang aorist participle: mga taong sumampalataya, sa halip na ang mas nominal na “mga mananampalataya.”'
- source_word: καρδία καὶ ψυχὴ μία
  choice: nagkakaisa sa puso at kaluluwa
  rationale: Pinananatili ang dalawang larawang “puso” at “kaluluwa” habang likas na ipinahahayag sa Tagalog ang kanilang malalim na pagkakaisa.
- source_word: οὐδὲ εἷς
  choice: wala ni isa sa kanila
  rationale: Malinaw na naihahatid ang mariing puwersa ng οὐδὲ εἷς.
- source_word: τι τῶν ὑπαρχόντων αὐτῷ
  choice: ang alinman sa kanyang mga ari-arian
  rationale: Ang τὰ ὑπάρχοντα ay tumutukoy sa mga pag-aari o ari-arian. Pinananatili ng “kanyang” ang distributibong isahan ng αὐτῷ.
- source_word: ἔλεγεν ἴδιον εἶναι
  choice: nagsabing sarili niya
  rationale: Malapit ito sa payak na pahayag ng Griyego at hindi pinatitindi tungo sa “inangkin,” na maaaring magdagdag ng mapanuring tono.
- source_word: πάντα κοινά
  choice: para sa kanilang lahat ang lahat ng bagay
  rationale: Ipinapahayag nito ang predikatibong diwa ng κοινά bilang magkakasalo o panlahat, nang hindi awtomatikong ipinakahulugang legal na sama-samang pagmamay-ari.
theological_decisions:
- issue: Paglalarawan sa mga ari-ariang pinagsasaluhan ng iglesya sa Jerusalem
  choice: Inilalarawan ang hindi pag-angkin ng eksklusibong karapatan at ang pagiging para sa lahat ng mga bagay.
  alternative: “Sama-sama nilang pag-aari ang lahat” o, sa kabilang dako, isang saling nagpapahina sa aktuwal na pagsasalo.
  rationale: Sinasabi ng Griyego na walang sinumang tumuring sa kanyang pag-aari bilang para lamang sa sarili at na πάντα κοινά. Pinananatili ng salin ang tensiyong ito nang hindi ipinapasok ang isang mas huling sistemang pampolitika, pang-ekonomiya, o pangdenominasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapulungan” para sa malaking pangkat at “mga ari-arian” para sa mga pag-aari. Iniwasan ang teknikal na bokabularyong pampolitika o pang-ekonomiya.
