id: ACT.4.11
reference: Acts 4:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ λίθος ὁ ἐξουθενηθεὶς ὑφ’ ὑμῶν τῶν ⸀οἰκοδόμων, ὁ γενόμενος εἰς κεφαλὴν γωνίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/011.yaml
  text: This is the stone that was rejected by you[a], the builders, which has become the cornerstone.
translation:
  language: tl
  text: Siya ang batong itinakwil ninyo—kayong mga tagapagtayo—na naging batong panulok.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “batong pangtuktok”; mas literal, “ulo ng sulok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: Siya
  rationale: Tumutukoy nang mariin kay Jesus sa naunang konteksto. Likas sa modernong Tagalog ang “Siya” para sa isang taong tahasang kinikilala.
- source_word: λίθος
  choice: bato
  rationale: Karaniwang kahulugan ng salita at pinananatili ang larawan at alusyon sa Awit 118:22.
- source_word: ἐξουθενηθεὶς
  choice: itinakwil
  rationale: Ipinahihiwatig ng pandiwa ang paghamak o pagtrato bilang walang halaga. Sa talinghaga ng pagtatayo, malinaw na naihahayag ng “itinakwil” ang pagtanggi sa bato.
- source_word: ὑφ’ ὑμῶν
  choice: ninyo
  rationale: Pinananatili ang tuwirang paratang at ang maramihang ikalawang panauhan.
- source_word: οἰκοδόμων
  choice: mga tagapagtayo
  rationale: Pinananatili ang metapora ng mga gumagawa ng gusali at hindi tahasang pinapalitan ng interpretasyong “mga pinuno.”
- source_word: γενόμενος
  choice: naging
  rationale: Likas at tuwirang katumbas sa Tagalog para sa pagbabagong naganap sa katayuan ng bato.
- source_word: κεφαλὴν γωνίας
  choice: batong-panulok
  rationale: Malinaw at kinikilalang katawagang Tagalog para sa mahalagang bato sa sulok ng gusali. Dahil maaaring pagtalunan ang eksaktong bahaging arkitektural, inilalahad sa talababa ang ibang posibilidad at ang mas literal na anyo.
theological_decisions:
- issue: Larawang arkitektural sa sipi mula sa Awit 118:22
  choice: batong-panulok
  alternative: batong pang-ibabaw; ulo ng panulok
  rationale: Pinananatili ng “batong-panulok” ang larawan ng batong itinakwil ngunit itinaas sa mahalagang katayuan, nang hindi nagdaragdag ng partikular na doktrinal na paliwanag. Inilalagay sa talababa ang tunay na leksikal at arkitektural na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang mga gitling upang luminaw na ang “kayong mga tagapagtayo” ay paglilinaw sa “ninyo,” habang pinananatili ang tuwirang paratang at ang metapora.
