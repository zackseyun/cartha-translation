  text: καὶ ἐτίθουν παρὰ τοὺς πόδας τῶν ἀποστόλων· διεδίδετο δὲ ἑκάστῳ καθότι ἄν τις χρείαν εἶχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/035.yaml
  text: and they were laying them at the apostles’ feet[b][a], and it was being distributed to each one according as anyone had need.
translation:
  language: tl
  text: at patuloy nilang inilalagay ang mga iyon[b] sa paanan ng mga apostol[a]; at ipinapamahagi naman iyon sa bawat isa ayon sa pangangailangan ng sinuman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa harap ng mga apostol.” Literal na sinasabi ng Griyego, “sa paanan ng mga apostol,” na naglalarawan ng paglalagay ng napagbentahan sa ilalim ng kanilang pangangasiwa.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga iyon” at “iyon” ay tumutukoy sa napagbentahan ng mga ari-ariang binanggit sa naunang talata.
    reason: cross_reference
lexical_decisions:
- source_word: ἐτίθουν
  choice: patuloy nilang inilalagay
  rationale: Ipinahahayag ng imperpektong aspekto ang paulit-ulit o nagpapatuloy na gawain sa salaysay.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: sa paanan ng mga apostol
  rationale: Pinananatili ang kongkretong larawan ng Griyego at likas din itong nagpapahiwatig na ipinagkakatiwala ang mga iyon sa pangangasiwa ng mga apostol.
- source_word: διεδίδετο
  choice: ipinamahagi iyon
  rationale: Pinananatili ng anyong balintiyak ang hindi pagtukoy sa tagapamahagi; ang imperpektong diwa ay nauunawaan sa konteksto bilang nakaugaliang pamamahagi.
- source_word: ἑκάστῳ
  choice: sa bawat isa
  rationale: Tumpak na ipinakikita ang indibiduwal na saklaw ng pamamahagi.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: ayon sa pangangailangan ng sinuman
  rationale: Likas na Filipino ito at pinananatili ang diwa ng pamamahaging katumbas ng pangangailangan, nang hindi tinutukoy ang kasarian.
- source_word: χρείαν
  choice: pangangailangan
  rationale: Malinaw at karaniwang salin ng χρεία sa kontekstong ito.
theological_decisions:
- issue: Kung tahasang tutukuyin ang bagay na inilalagay at ipinamahagi
  choice: Gamitin ang mga panghalip na “mga iyon” at “iyon,” habang ipinauubaya sa naunang talata ang pagkilalang ang tinutukoy ay ang napagbentahan.
  alternative: Tahasang idagdag ang “salapi” o “napagbentahan” sa dalawang sugnay.
  rationale: Hindi tahasang binabanggit ng Griyego ang layon. Pinananatili ng mga panghalip ang daloy at hindi nagdaragdag ng espesipikong katawagang wala sa talata.
- issue: Kung tutukuyin kung sino ang namamahagi
  choice: Panatilihin ang balintiyak na “ipinamahagi iyon.”
  alternative: Sabihing “ipinamamahagi ng mga apostol.”
  rationale: Balintiyak ang διεδίδετο at hindi tahasang pinapangalanan ng talata ang tagapamahagi; ang pagtukoy sa mga apostol ay posibleng hinuha ngunit hindi dapat ipasok sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang kongkretong larawang “sa paanan,” ang nagpapatuloy na diwa ng unang pandiwa, at ang balintiyak na anyo ng pamamahagi.
