id: ACT.4.30
reference: Acts 4:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν τῷ τὴν χεῖρά ⸀σου ἐκτείνειν σε εἰς ἴασιν καὶ σημεῖα καὶ τέρατα γίνεσθαι διὰ τοῦ ὀνόματος τοῦ ἁγίου παιδός σου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/030.yaml
  text: while you stretch out your hand for healing[a], and signs and wonders are done through the name of your holy servant Jesus.
translation:
  language: tl
  text: habang iniuunat mo ang iyong kamay upang magpagaling, at nagaganap ang mga tanda at mga kababalaghan sa pamamagitan ng pangalan ng iyong banal na lingkod[a] na si Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “banal na anak.” Ang salitang Griyego na pais ay maaaring mangahulugang “anak” o “lingkod”; mas pinili rito ang “lingkod” dahil umaalingawngaw sa Mga Gawa ang paglalarawan sa Lingkod sa Isaias.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ ... ἐκτείνειν
  choice: habang iniuunat mo
  rationale: Ipinahahayag ng ἐν τῷ kasama ang pawatas ang kasabay na pangyayari; natural sa modernong Tagalog ang “habang iniuunat mo.”
- source_word: τὴν χεῖρά σου
  choice: ang iyong kamay
  rationale: Pinananatili nito ang biblikal na larawan ng kamay ng Diyos bilang kasangkapan ng kanyang pagkilos at kapangyarihan nang hindi ito labis na ipinapaliwanag.
- source_word: εἰς ἴασιν
  choice: upang magpagaling
  rationale: Malinaw at likas itong pagpapahayag ng layunin ng εἰς at ng kahulugang ‘pagpapagaling’ ng ἴασις.
- source_word: σημεῖα καὶ τέρατα
  choice: mga tanda at mga kababalaghan
  rationale: Tumpak at pamilyar itong katumbas ng tambalang pahayag sa Mga Gawa, nang hindi nagdaragdag ng salitang ‘mahiwaga’ o ‘milagroso.’
- source_word: γίνεσθαι
  choice: nagaganap
  rationale: Ipinahahayag nito na ang mga tanda at kababalaghan ay nangyayari o nagkakaroon, habang iniiwasan ang di-kinakailangang tahasang tagaganap na wala sa pandiwang Griyego.
- source_word: διὰ τοῦ ὀνόματος
  choice: sa pamamagitan ng pangalan
  rationale: Pinananatili ang pangunahing instrumental na diwa ng διά na may genitive at ang biblikal na konsepto ng pangalan bilang kaugnay ng kapangyarihan at awtoridad, nang hindi iyon idinadagdag sa teksto.
- source_word: τοῦ ἁγίου παιδός σου Ἰησοῦ
  choice: ng iyong banal na lingkod na si Jesus
  rationale: Maaaring mangahulugan ang παῖς ng ‘lingkod’ o ‘anak/bata.’ Mas malamang dito ang ‘lingkod’ dahil sa alusyon ng Mga Gawa sa Lingkod ng Panginoon sa Isaias; pinananatili sa talababa ang tunay na alternatibo.
theological_decisions:
- issue: Pagpapakahulugan sa παῖς bilang pantukoy kay Jesus
  choice: lingkod
  alternative: anak
  rationale: Pinapaboran ng konteksto ng Mga Gawa 3–4 at ng alusyon sa Lingkod sa Isaias ang ‘lingkod.’ Gayunman, tunay na saklaw ng salita ang ‘anak/bata,’ kaya hindi ito ikinukubli at inilalahad bilang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “iniuunat,” “magpagaling,” at “nagaganap” para sa malinaw na daloy ng panalangin; pinanatili ang mga biblikal na pariralang “kamay,” “mga tanda at mga kababalaghan,” at “sa pamamagitan ng pangalan.”
