  source_fidelity: Ang pangunahing diwa at ang mga pangalan ay wasto, at tama ang pagpapanatili sa titulong ibinibigay ng Griyego kay Anas nang walang pagdaragdag na “dating.” Gayunman, ang “Kataas-taasang Pari” ay mas malakas at mas absolutong pakinggan kaysa sa karaniwang katumbas ng ἀρχιερεύς; mas tumpak ang “pinakapunong pari.”
  naturalness: Natural ang ayos ng talaan sa Filipino. Ang “Naroon” ay katanggap-tanggap bilang pag-uugnay sa naunang konteksto, ngunit ang paglalagay ng titulo bilang apposition—“Anas, ang pinakapunong pari”—ay mas malinaw at mas malapit sa Griyego.
  terminology: Gamitin ang “pinakapunong pari” para sa ἀρχιερεύς at “angkan ng pinakapunong pari” para sa ἐκ γένους ἀρχιερατικοῦ. Napananatili nito ang ugnayang pampamilya o pangkan, hindi lamang pagiging mayhawak ng tungkulin.
