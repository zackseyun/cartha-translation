  text: (καὶ ⸂Ἅννας ὁ ἀρχιερεὺς καὶ Καϊάφας καὶ Ἰωάννης καὶ Ἀλέξανδρος⸃ καὶ ὅσοι ἦσαν ἐκ γένους ἀρχιερατικοῦ),
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/006.yaml
  text: and Annas the high priest[a], and Caiaphas, and John, and Alexander, and all who were of the high-priestly family,
translation:
  language: tl
  text: Naroon si Anas, ang pinakapunong pari, gayundin sina Caifas, Juan, Alejandro, at ang lahat ng mula sa angkan ng pinakapunong pari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng kabilang sa lipi ng pinakapunong pari” o “lahat ng may lahing pinakapunong-pari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἅννας
  choice: Anas
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang ito sa Bibliya.
- source_word: ὁ ἀρχιερεὺς
  choice: na Kataas-taasang Pari
  rationale: Tuwirang pinanatili ang titulong ibinibigay ng Griyego kay Anas, nang hindi ito ginagawang 'dating' kataas-taasang pari.
- source_word: Καϊάφας
  choice: Caifas
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan.
- source_word: Ἰωάννης
  choice: Juan
  rationale: Ginamit ang tradisyonal at madaling makilalang anyong Filipino ng pangalan.
- source_word: Ἀλέξανδρος
  choice: Alejandro
  rationale: Ginamit ang natural at nakaugaliang anyong Filipino ng pangalan.
- source_word: ὅσοι ἦσαν
  choice: ang lahat ng kabilang
  rationale: Natural na Filipino para sa panlahatang pariralang tumutukoy sa lahat ng kabilang sa tinukoy na pangkat.
- source_word: ἐκ γένους ἀρχιερατικοῦ
  choice: sa angkan ng kataas-taasang pari
  rationale: Ang γένος ay tumutukoy sa angkan, lahi, o pangkat ng magkakamag-anak; malinaw na ipinahahayag ng salin ang ugnayang pampamilya sa sambahayan o lipi ng kataas-taasang pari.
theological_decisions:
- issue: Ang pagtawag kay Anas na Kataas-taasang Pari kahit si Caifas ang nanunungkulan noong panahong iyon
  choice: 'Pinanatili ang tahasang titulo ng teksto: ''Anas na Kataas-taasang Pari.'''
  alternative: Anas, ang dating Kataas-taasang Pari
  rationale: Tahasang inilalapat ng Griyego ang ὁ ἀρχιερεύς kay Anas. Hindi dapat idagdag ng salin ang 'dating' upang ayusin ang makasaysayang tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Naroon' upang natural na iugnay ang talata sa naunang pangungusap, sapagkat ang Griyego ay bahagi ng isang nagpapatuloy na talaan. Pinanatili ang pormal na titulong 'Kataas-taasang Pari.'
