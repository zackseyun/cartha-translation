  text: ἀλλ’ ἵνα μὴ ἐπὶ πλεῖον διανεμηθῇ εἰς τὸν λαόν, ⸀ἀπειλησώμεθα αὐτοῖς μηκέτι λαλεῖν ἐπὶ τῷ ὀνόματι τούτῳ μηδενὶ ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/017.yaml
  text: But so that it may not spread any further among the people, let us warn them not to speak any longer to anyone in this name.
translation:
  language: tl
  text: Ngunit upang hindi na ito higit pang lumaganap sa bayan, pagbantaan natin sila[a] na huwag nang magsalita kaninuman sa pangalang ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mahigpit natin silang balaan.” Ang salitang Griyego ay pangunahing nangangahulugang “pagbantaan” at nagpapahiwatig ng pananakot o pamimilit ng mga may awtoridad.
    reason: lexical_alternative
lexical_decisions:
- source_word: διανεμηθῇ
  choice: lumaganap
  rationale: Sa konteksto, tumutukoy ito sa patuloy na pagkalat sa publiko ng balita at mensaheng kaugnay ng ginawa at itinuro ng mga apostol. Natural sa modernong Tagalog ang “lumaganap” at pinananatili nito ang ideya ng pagkalat.
- source_word: ἐπὶ πλεῖον
  choice: lalo pa
  rationale: Ipinahahayag ng parirala ang paglawak lampas sa kasalukuyang antas; malinaw at natural itong naihahatid ng “lalo pa.”
- source_word: λαός
  choice: bayan
  rationale: Dito ay tumutukoy ito sa malawak na sambayanan o publiko, lalo na sa bayang Judio. Ang “bayan” ay maikli, marangal, at angkop sa konteksto.
- source_word: ἀπειλησώμεθα
  choice: pagbantaan natin sila
  rationale: Ang pandiwa ay tahasang nangangahulugang magbanta at nagpapakita ng pamimilit ng mga pinuno. Natural din sa Tagalog ang konstruksiyong “pagbantaan ... na huwag.”
- source_word: μηκέτι λαλεῖν
  choice: na huwag nang magsalita
  rationale: 'Pinananatili ng “huwag nang” ang temporal na diwa ng μηκέτι: itigil mula ngayon ang dating ginagawa.'
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: sa pangalang ito
  rationale: Pinananatili nito ang sadyang di-tuwirang pagtukoy ng konseho at ang biblikal na konsepto ng pagsasalita kaugnay ng pangalan, kapangyarihan, o awtoridad nito nang hindi nilulutas ang buong saklaw sa pangunahing teksto.
- source_word: μηδενὶ ἀνθρώπων
  choice: kaninuman
  rationale: Idyomatiko at walang pagtatangi sa kasarian ang “kaninuman,” at malinaw nitong ipinakikitang walang sinumang dapat kausapin nila tungkol sa pangalang ito.
theological_decisions:
- issue: Lakas ng ἀπειλησώμεθα sa tugon ng konseho
  choice: pagbantaan natin sila
  alternative: mahigpit natin silang balaan
  rationale: Juridikal at mapamilit ang tagpo, at ang salitang Griyego ay mas malakas kaysa karaniwang babala. Ang “pagbantaan” ay tumpak at natural sa Tagalog; inilalagay sa talababa ang maaaring mas mahinang salin upang kilalanin ang pagkakaiba ng himig.
- issue: Saklaw ng pariralang ἐπὶ τῷ ὀνόματι τούτῳ
  choice: sa pangalang ito
  alternative: tungkol sa pangalang ito; sa awtoridad ng pangalang ito
  rationale: Maaaring magpahiwatig ang parirala ng paksa, kaugnayan, o awtoridad. Ang literal at natural na “sa pangalang ito” ay nagpapanatili sa sadyang lawak at teolohikal na tensiyon ng pananalita.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “bayan” para sa malawak na publiko at “kaninuman” para sa likas at inklusibong pananalita. Iniwasan ang sobrang pagpapaliwanag sa “sa pangalang ito” upang mapanatili ang ambiguity ng Griyego.
