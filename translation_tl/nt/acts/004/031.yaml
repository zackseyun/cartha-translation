  source_fidelity: Tumpak na naihahatid ng salin ang temporal na genitive absolute ("Matapos silang manalangin"), ang pisikal na pagyanig ng lugar, ang sama-samang pagkapuspos ng Banal na Espiritu, at ang nagpapatuloy na pagsasalita nang may παρρησία. Ang "patuloy nilang ipinahayag" ay isang natural na Tagalog na paraan upang maipahiwatig ang imperfect na ἐλάλουν, nang hindi ipinipilit ang isang inceptive na kahulugan.
