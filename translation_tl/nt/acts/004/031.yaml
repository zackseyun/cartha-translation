id: ACT.4.31
reference: Acts 4:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ δεηθέντων αὐτῶν ἐσαλεύθη ὁ τόπος ἐν ᾧ ἦσαν συνηγμένοι, καὶ ἐπλήσθησαν ἅπαντες ⸂τοῦ ἁγίου πνεύματος⸃, καὶ ἐλάλουν τὸν λόγον τοῦ θεοῦ μετὰ παρρησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/031.yaml
  text: And when they had prayed[a], the place in which they were gathered was shaken[b], and they were all filled with the Holy Spirit and were speaking the word of God with boldness.
translation:
  language: tl
  text: Matapos silang manalangin, nayanig ang lugar kung saan sila nakatipon. Napuspos silang lahat ng Banal na Espiritu, at patuloy nilang ipinahayag ang salita ng Diyos nang buong tapang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang buong tiwala” o “nang hayagan at walang takot.” Ang salitang Griyego ay tumutukoy sa malaya, lantad, at matapang na pagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεηθέντων αὐτῶν
  choice: Matapos silang manalangin
  rationale: Ang aorist participle sa genitive absolute ay nagbibigay ng naunang pangyayaring temporal. Likas sa modernong Tagalog ang “matapos silang manalangin” at hindi nito dinaragdagan ang diwa ng panalangin.
- source_word: ἐσαλεύθη
  choice: nayanig
  rationale: Ipinahihiwatig ng passive aorist na ang lugar ay aktuwal na inuga o niyanig. Mas natural at malinaw dito ang “nayanig” kaysa “naigalaw.”
- source_word: ἐν ᾧ ἦσαν συνηγμένοι
  choice: kung saan sila nakatipon
  rationale: Ipinapakita ng periphrastic construction ang kalagayan nilang sama-samang natipon sa lugar na iyon. Pinananatili ng “nakatipon” ang stative na diwa nang natural sa Tagalog.
- source_word: ἐπλήσθησαν ἅπαντες
  choice: Napuspos silang lahat
  rationale: Pinananatili ng “napuspos” ang passive na anyo at ang karaniwang biblikal na pananalita tungkol sa pagpuno ng Espiritu; malinaw namang saklaw ng “silang lahat” ang buong pangkat.
- source_word: τοῦ ἁγίου πνεύματος
  choice: ng Banal na Espiritu
  rationale: Ang genitive pagkatapos ng ἐπλήσθησαν ay likas na naihahayag sa Tagalog sa pamamagitan ng “napuspos ng.” Ang malaking titik ay tumutukoy sa personal at banal na referent sa konteksto.
- source_word: ἐλάλουν
  choice: patuloy nilang ipinahayag
  rationale: Ang imperfect ay naglalarawan ng nagpapatuloy na pagsasalita. Ipinakikita ng “patuloy” ang durative aspect, samantalang ang “ipinahayag” ay akma sa pampublikong pagpapahayag ng mensahe sa konteksto ng Mga Gawa.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Pinananatili nito ang karaniwang pariralang Lucano at ang bigat ng λόγος bilang mensaheng ipinahahayag mula sa Diyos.
- source_word: μετὰ παρρησίας
  choice: nang buong tapang
  rationale: Sa konteksto, ang παρρησία ay hayag at walang-takot na pagsasalita. Natural sa Tagalog ang “nang buong tapang,” habang inilalahad sa talababa ang iba pang lehitimong himig ng salita.
theological_decisions:
- issue: Pananalita tungkol sa pagpuspos ng Espiritu
  choice: Napuspos silang lahat ng Banal na Espiritu
  alternative: Pinuspos silang lahat ng Banal na Espiritu
  rationale: Mas tuwirang pinananatili ng “napuspos … ng” ang idiomang ang Banal na Espiritu ang pumupuspos sa kanila, nang hindi nagpapasya kung paano ito dapat iugnay sa anumang partikular na doktrina tungkol sa karanasan ng Espiritu.
- issue: Aspekto ng ἐλάλουν
  choice: patuloy nilang ipinahayag
  alternative: ipinahayag nila
  rationale: Pinananatili ng saling may “patuloy” ang nagpapatuloy na pagkilos na ipinahihiwatig ng imperfect, sa halip na ilarawan lamang ito bilang minsanang pangyayari.
- issue: Saklaw ng παρρησία
  choice: nang buong tapang
  alternative: nang buong laya at tiwala
  rationale: Ang “tapang” ang pinakanababagay sa konteksto ng walang-takot na pagpapatotoo, ngunit hindi nito inaalis ang kaugnay na diwa ng pagiging bukas, malaya, at may pagtitiwala, na nakatala sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nayanig,” “nakatipon,” at “napuspos” bilang mga salitang pamilyar sa wikang biblikal ngunit nananatiling natural. Ang “patuloy nilang ipinahayag” ay sadyang nagpapanatili sa nagpapatuloy na aspekto ng Griyego.
