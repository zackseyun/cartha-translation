  source_fidelity: Ang “dinakip” ay wastong pagsasalin sa idyomang ἐπέβαλον ... τὰς χεῖρας sa kontekstong ito. Gayunman, ang “ikinulong” ay mas tiyak kaysa sa εἰς τήρησιν, na nagsasaad ng kustodiya o pagbabantay nang hindi tinutukoy ang uri ng pasilidad. Ang “gabi na noon” ay tapat sa ἦν γὰρ ἑσπέρα ἤδη.
  naturalness: Natural at marangal sa modernong Filipino Tagalog ang “Dinakip nila sina Pedro at Juan at inilagay sa kustodiya hanggang kinabukasan.” Mas malinaw at mas eksakto ang “kustodiya” kaysa “ikinulong” sa legal na kontekstong ito.
  terminology: Ang “kustodiya” ay angkop na legal na katawagan para sa τήρησις at pinananatili nitong bukás kung sila man ay inilagay sa piitan o basta binantayan. Ang “dinakip” ay angkop para sa pag-aresto o pagdakip na ipinahihiwatig ng Griyegong idyoma.
