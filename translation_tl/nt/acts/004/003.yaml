base_translation:
  language: en
  yaml_path: translation/nt/acts/004/003.yaml
  text: And they laid hands on them and put them in custody until the next day[b][a], for it was already evening.
translation:
  language: tl
  text: Dinakip nila sina Pedro at Juan at inilagay sa kustodiya[a] hanggang kinabukasan, sapagkat gabi na noon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ikinulong” o “ipinailalim sa pagbabantay.” Ang salitang Griyego ay tumutukoy sa pagpapanatili sa kustodiya nang hindi tinutukoy ang eksaktong uri ng piitan o pasilidad.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον αὐτοῖς τὰς χεῖρας
  choice: dinakip nila ang dalawa
  rationale: Ang idyomang Griyego ay literal na “ipinatong nila sa kanila ang mga kamay,” ngunit sa kontekstong ito ay nangangahulugang marahas o opisyal na pagdakip. Ang “dinakip” ay natural at malinaw sa modernong Tagalog; ang “ang dalawa” ay nililinaw na sina Pedro at Juan ang tinutukoy ng panghalip na maramihan.
- source_word: ἔθεντο εἰς τήρησιν
  choice: ikinulong
  rationale: Ang τήρησις ay tumutukoy sa pagbabantay o kustodiya. Natural sa Tagalog ang “ikinulong,” ngunit maaari itong magpahiwatig ng kulungan kaya pinananatili sa talababa ang mas di-tiyak na alternatibong “ipinabantay.”
- source_word: εἰς τὴν αὔριον
  choice: hanggang kinabukasan
  rationale: Tuwirang ipinahahayag nito ang temporal na hangganan at natural ito sa salaysay sa Tagalog.
- source_word: ἦν γὰρ ἑσπέρα ἤδη
  choice: sapagkat gabi na noon
  rationale: Malinaw nitong pinananatili ang paliwanag ng γάρ at ang diwa na sumapit na ang gabi, nang hindi dinaragdagan ang teksto ng ideyang “gabi na nang husto.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Isinalin ang literal na idyoma ng pagpatong ng mga kamay ayon sa kahulugan nitong pagdakip sa konteksto, at iniwasang tukuyin nang labis ang eksaktong uri ng lugar ng detensiyon.
