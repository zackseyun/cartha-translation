id: ACT.4.23
reference: Acts 4:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀπολυθέντες δὲ ἦλθον πρὸς τοὺς ἰδίους καὶ ἀπήγγειλαν ὅσα πρὸς αὐτοὺς οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/023.yaml
  text: After they were released[a], they went to their own people and reported all that the chief priests and the elders had said to them.
translation:
  language: tl
  text: Nang mapalaya na sila,[a] pumunta sila sa kanilang mga kasamahan at ibinalita ang lahat ng sinabi sa kanila ng mga punong pari at ng matatandang pinuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nang palayain sila.”
    reason: Ipinapakita ng alternatibo ang mas payak na temporal na pagbasa ng aorist participle; ang “na” sa pangunahing teksto ay natural na Tagalog ngunit hindi hiwalay na salita sa Griyego.
lexical_decisions:
- source_word: Ἀπολυθέντες
  choice: Nang mapalaya na sila
  rationale: Ang aorist passive participle ay nagsasaad ng pagkilos na nauna sa pangunahing pandiwa. Likas sa modernong Tagalog ang hulma na “Nang ... na” at pinananatili nito ang legal o custodial na diwa ng pagpapalaya.
- source_word: δὲ
  choice: ipinahihiwatig sa daloy ng “Nang mapalaya na sila”
  rationale: Mahinang pang-ugnay ang δέ. Hindi na kailangan ng hiwalay na “at” o “ngayon” sapagkat malinaw na naihahatid ng pambungad na sugnay ang paglipat ng salaysay.
- source_word: ἦλθον
  choice: pumunta sila
  rationale: Maaaring mangahulugang “pumarito” o “pumunta” ang ἔρχομαι ayon sa pananaw. Hindi nakapuwesto ang tagapagsalaysay sa kanilang destinasyon, kaya natural ang “pumunta.”
- source_word: πρὸς τοὺς ἰδίους
  choice: sa kanilang mga kasamahan
  rationale: Literal itong “sa mga sariling kanila” at tumutukoy sa sariling pangkat o mga kasama nina Pedro at Juan. Ang “mga kasamahan” ay malinaw at hindi labis na tumutukoy kung pamilya, buong kapulungan, o ibang tiyak na pangkat.
- source_word: ἀπήγγειλαν
  choice: ibinalita
  rationale: Ang ἀπαγγέλλω ay pag-uulat o paghahatid ng nalaman. Ang “ibinalita” ay natural na Tagalog para sa pagsasalaysay nila ng sinabi ng mga pinuno.
- source_word: ὅσα
  choice: ang lahat ng
  rationale: 'Pinananatili nito ang malawak at sumasaklaw na diwa ng ὅσα: walang inaalis sa iniulat na sinabi.'
- source_word: πρὸς αὐτοὺς
  choice: sa kanila
  rationale: Kasama ng pandiwang “sinabi,” karaniwang tumutukoy ang πρός + accusative sa mga kinausap. Hindi kailangang dagdagan sa teksto ang mga pangalang Pedro at Juan.
- source_word: οἱ ἀρχιερεῖς
  choice: mga punong pari
  rationale: Ito ang karaniwang tumpak na tawag sa mga pangunahing awtoridad na saserdote, hindi sa maraming sabay-sabay na may katungkulan bilang kataas-taasang pari.
- source_word: οἱ πρεσβύτεροι
  choice: mga matatandang pinuno
  rationale: Sa kontekstong institusyonal, tumutukoy ito sa kinikilalang matatandang lider ng bayan, hindi lamang sa matatandang lalaki. Nililinaw ng “pinuno” ang tungkulin nila.
- source_word: εἶπαν
  choice: sinabi
  rationale: Malinaw na sa pagkakasunod ng mga sugnay na nauna ang kanilang pagsasalita sa pag-uulat, kaya hindi kailangan ng mas mabigat na anyo upang ipakita ang naunang pangyayari.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga kasamahan” para sa idiomatikong τοὺς ἰδίους at ang “matatandang pinuno” upang maging malinaw ang institusyonal na kahulugan ng πρεσβύτεροι. Ang marker na [a] ay inilagay agad pagkatapos ng pariralang tinutukoy nito.
