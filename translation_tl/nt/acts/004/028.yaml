  text: to do whatever your hand and your purpose had predestined to happen[a].
translation:
  language: tl
  text: upang gawin ang anumang nauna nang itinakda ng iyong kamay at ng iyong layunin na mangyari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “naipasiya na noon” o “paunang itinakda.” Ipinahihiwatig ng pandiwang Griyego ang naunang pagtatakda o pagpapasiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι
  choice: upang gawin
  rationale: Ang aorist infinitive ay likas na maisasalin bilang layunin sa daloy ng naunang pangungusap; tuwiran at hindi labis ang pagpapakahulugan ng “upang gawin.”
- source_word: ὅσα
  choice: ang anumang
  rationale: Ipinahahayag nito ang malawak at sumasaklaw na diwa ng panghalip na neuter plural.
- source_word: χείρ
  choice: kamay
  rationale: Pinananatili ang kongkretong biblikal na tayutay para sa kapangyarihan o pagkilos ng Diyos sa halip na tahasang palitan ito ng interpretasyong “kapangyarihan.”
- source_word: βουλή
  choice: layunin
  rationale: Ipinapakita ng “layunin” ang sinadya at pinagpasiyahang hangarin, at natural ito sa modernong Tagalog.
- source_word: προώρισεν
  choice: itinakda na noon
  rationale: Malinaw nitong ipinahahayag ang naunang pagtatakda na tinutukoy ng pandiwa, nang hindi gumagamit ng terminong maaaring maging masyadong teknikal o denominasyonal.
- source_word: γενέσθαι
  choice: na mangyari
  rationale: Natural nitong ipinapahayag ang eventive na diwa ng γίνομαι sa kontekstong ito.
theological_decisions:
- issue: Ang naunang pagtatakda ng Diyos at ang pananagutan ng mga taong kumilos laban kay Jesus
  choice: itinakda na noon
  alternative: ipinasya na noon; paunang itinakda
  rationale: Pinananatili ng salin ang matibay na diwa ng naunang pagpapasiya ng Diyos, ngunit hindi nito nilulutas o ipinapaloob sa isang partikular na sistemang teolohikal ang tensiyon sa pananagutan ng tao na makikita sa mas malawak na konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang idyomang “iyong kamay” at ginamit ang “layunin” para sa βουλή. Ang “na noon” ay bahagyang idiomatiko ngunit sadyang inilapit sa pandiwang “itinakda” upang malinaw ang temporal na prioridad.
