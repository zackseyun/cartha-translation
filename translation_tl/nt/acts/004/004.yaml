  source_fidelity: 'Tumpak ang salin sa pangunahing mga elemento ng Griyego: ang πολλά ay “marami,” ang aorist na ἀκουσάντων ay natural na “nakarinig,” ang ἐπίστευσαν ay “sumampalataya” nang walang idinagdag na layon, at ang ὡς ay naipahahayag ng “humigit-kumulang.” Napananatili rin ang panlalaking pagtukoy ng τῶν ἀνδρῶν sa “mga lalaki.” Ang “ay umabot” ay isang natural na Tagalog na paglalarawan ng resultang bilang para sa ἐγενήθη ὁ ἀριθμός.'
