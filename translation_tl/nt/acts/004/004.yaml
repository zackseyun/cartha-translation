id: ACT.4.4
reference: Acts 4:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πολλοὶ δὲ τῶν ἀκουσάντων τὸν λόγον ἐπίστευσαν, καὶ ἐγενήθη ⸀ὁ ἀριθμὸς τῶν ἀνδρῶν ⸀ὡς χιλιάδες πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/004.yaml
  text: But many of those who had heard the message believed[b][a], and the number of the men became about five thousand.
translation:
  language: tl
  text: Ngunit marami sa mga nakarinig sa mensahe[a] ang sumampalataya, at ang bilang ng mga lalaki[b] ay umabot sa humigit-kumulang limang libo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “salita.” Dito, ang λόγος ay tumutukoy sa ipinahayag na mensahe ng mga apostol.
    reason: lexical_alternative
  - marker: b
    text: Ang Griyego ay “ang bilang ng mga lalaki,” na malamang na tumutukoy sa bilang ng mga lalaking nasa hustong gulang, hindi sa kabuuan ng lahat ng naroon.
    reason: cultural_note
lexical_decisions:
- source_word: πολλοὶ
  choice: marami
  rationale: Pinananatili ang di-tiyak na dami nang hindi nagdaragdag ng pangngalang wala sa Griyego.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang pagsalungat sa pagtutol at pagdakip na nasa naunang konteksto.
- source_word: ἀκουσάντων τὸν λόγον
  choice: mga nakarinig sa mensahe
  rationale: Ang aorist participle ay natural na naipahahayag sa Tagalog sa anyong “nakarinig.” Sa konteksto, ang λόγος ay ang ipinahayag na mensahe ng mga apostol; inilalahad sa talababa ang mas literal na “salita.”
- source_word: ἐπίστευσαν
  choice: sumampalataya
  rationale: Natural at tuwirang katumbas ng πιστεύω sa kontekstong tumutukoy sa pagtugon sa ipinahayag na mensahe, nang hindi tahasang nagdaragdag ng layon.
- source_word: ἐγενήθη ὁ ἀριθμὸς
  choice: ang bilang … ay umabot
  rationale: Idyomatikong inilalarawan sa Tagalog ang kinalabasang bilang; mas natural ito kaysa sa literal na “naging ang bilang.”
- source_word: τῶν ἀνδρῶν
  choice: ng mga lalaki
  rationale: Pinananatili ang tiyak na panlalaking kahulugan ng ἀνήρ sa halip na gawing pangkalahatang “mga tao.”
- source_word: ὡς χιλιάδες πέντε
  choice: humigit-kumulang limang libo
  rationale: Ipinahahayag ang pagtatantiya na dala ng ὡς bago ang bilang.
theological_decisions:
- issue: Tiyak na panlalaking bilang sa τῶν ἀνδρῶν
  choice: mga lalaki
  alternative: mga tao; mga mananampalataya
  rationale: Karaniwang tumutukoy ang ἀνδρῶν sa mga lalaki, kaya hindi ito ginawang neutral. Hindi nito nilulutas kung kasama o hindi sa buong kapulungan ang mga babae; inilalarawan lamang nito ang bilang ayon sa pagkakasabi ng talata.
- issue: Layon o nilalaman ng ἐπίστευσαν
  choice: sumampalataya nang walang idinagdag na tahasang layon
  alternative: naniwala sa mensahe; sumampalataya kay Jesus
  rationale: Walang tahasang layon ang pandiwa sa Griyego. Pinananatili ng salin ang pagiging bukás ng pahayag at iniiwasang idagdag kung ang diin ay nasa mensahe o kay Jesus bilang pinatutungkulan ng pananampalataya.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “mensahe” para sa kontekstuwal na kahulugan ng λόγος, “sumampalataya” bilang likas na biblikal ngunit karaniwang salita, at “umabot” upang maging natural ang pahayag tungkol sa kinalabasang bilang.
