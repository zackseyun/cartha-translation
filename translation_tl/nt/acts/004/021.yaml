revisions:
- from: Kaya matapos nila itong dagdagan ng mga pagbabanta[a], pinalaya nila ang mga apostol. Wala silang makitang paraan upang parusahan ang mga ito dahil sa mga tao, sapagkat niluluwalhati ng lahat ang Diyos dahil sa nangyari.
  to: Matapos pa nila silang bantaan[a], pinalaya nila ang mga ito. Wala silang makitang paraan kung paano nila mapaparusahan ang mga ito dahil sa mamamayan, sapagkat niluluwalhati ng lahat ang Diyos dahil sa nangyari.
  rationale: Inayos ang unang sugnay upang malinaw at likas na maipahayag ang karagdagang pagbabanta. Pinalitan ang “mga apostol” ng “mga ito” upang hindi magdagdag ng katawagang wala sa mismong bersikulo. Nilinaw rin ang saklaw ng “mamamayan” at pinanatili ang paraan/posibilidad na nakapaloob sa τὸ πῶς κολάσωνται.
