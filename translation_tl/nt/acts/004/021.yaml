  text: οἱ δὲ προσαπειλησάμενοι ἀπέλυσαν αὐτούς, μηδὲν εὑρίσκοντες τὸ πῶς ⸀κολάσωνται αὐτούς, διὰ τὸν λαόν, ὅτι πάντες ἐδόξαζον τὸν θεὸν ἐπὶ τῷ γεγονότι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/021.yaml
  text: So after further threatening them[a], they released them, finding no way to punish them because of the people, since everyone was glorifying God for what had happened.
translation:
  language: tl
  text: Matapos pa nila silang bantaan[a], pinalaya nila ang mga ito. Wala silang makitang paraan kung paano nila mapaparusahan ang mga ito dahil sa mamamayan, sapagkat niluluwalhati ng lahat ang Diyos dahil sa nangyari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matapos nilang muling bantaan ang mga ito” o “matapos silang magdagdag pa ng mga pagbabanta.” Ipinahihiwatig ng salitang Griyego ang karagdagan o pagpapatindi ng mga pagbabanta, bukod sa nauna nang mga pagbabanta.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαπειλησάμενοι
  choice: matapos nila itong dagdagan ng mga pagbabanta
  rationale: Ipinahahayag nito ang karagdagan o pagpapatindi ng nauna nang mga pagbabanta, ayon sa diwa ng unlaping προσ-.
- source_word: ἀπέλυσαν
  choice: pinalaya nila
  rationale: Tumutukoy ito sa pagpapalaya sa mga apostol mula sa pagkakapiit o pagpigil ng mga awtoridad.
- source_word: μηδὲν εὑρίσκοντες τὸ πῶς κολάσωνται αὐτούς
  choice: Wala silang makitang paraan upang parusahan ang mga ito
  rationale: Likas na ipinapahayag sa Tagalog ang literal na ideyang 'walang matagpuan kung paano' bilang kawalan ng makitang paraan upang magparusa.
- source_word: διὰ τὸν λαόν
  choice: dahil sa mga tao
  rationale: Ang διά na may accusative ay nagsasaad ng dahilan; ang λαός dito ay tumutukoy sa mamamayan sa pangkalahatan, hindi lamang sa isang pulutong.
- source_word: πάντες ἐδόξαζον τὸν θεόν
  choice: niluluwalhati ng lahat ang Diyos
  rationale: Pinananatili ng 'niluluwalhati' ang wikang nagbibigay-luwalhati sa Diyos; ang aspektong nagaganap ng imperfect ay likas na naipahahayag ng pandiwang Filipino sa konteksto.
- source_word: ἐπὶ τῷ γεγονότι
  choice: dahil sa nangyari
  rationale: Malinaw at likas itong nagsasaad na ang naganap na pangyayari ang dahilan ng kanilang pagluwalhati sa Diyos.
