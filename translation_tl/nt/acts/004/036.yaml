  text: ⸀Ἰωσὴφ δὲ ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων, ὅ ἐστιν μεθερμηνευόμενον υἱὸς παρακλήσεως, Λευίτης, Κύπριος τῷ γένει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/036.yaml
  text: Joseph[a], who was called Barnabas by the apostles—which translated means son of encouragement—a Levite, a native of Cyprus,
translation:
  language: tl
  text: Si Jose naman, na tinawag ng mga apostol na Bernabe—na kung isasalin ay “anak ng pagpapalakas-loob”[a]—ay isang Levitang tubong Cyprus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “anak ng panghihikayat,” “anak ng kaaliwan,” o “anak ng kaginhawaan.” Maaaring saklawin ng salitang Griyego ang pagpapalakas-loob, paghikayat, at pag-aliw.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωσὴφ
  choice: Jose
  rationale: Karaniwang anyong Filipino ng pangalang Joseph.
- source_word: δὲ
  choice: naman
  rationale: Ipinahihiwatig ang banayad na paglipat sa isang bagong halimbawa nang hindi nagpapahiwatig ng matinding pagsalungat o tahasang panahong “ngayon.”
- source_word: ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων
  choice: tinawag ng mga apostol na Bernabe
  rationale: Natural na Filipino para sa katawagang ibinigay o ginamit ng mga apostol; hindi idinagdag ang di-tahasang “kilala rin bilang.”
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: na kung isasalin ay
  rationale: Malinaw at natural na ipinakikilala ang paliwanag ni Lucas sa kahulugan ng pangalan.
- source_word: υἱὸς παρακλήσεως
  choice: anak ng pagpapalakas-loob
  rationale: Pinananatili ang Semitikong pariralang “anak ng” at ginagamit ang malawak at madaling maunawaang diwa ng παράκλησις, habang inilalagay sa talababa ang iba pang posibleng nuances.
- source_word: Λευίτης
  choice: isang Levita
  rationale: Karaniwang tawag sa Filipino para sa kasapi ng lipi ni Levi.
- source_word: Κύπριος τῷ γένει
  choice: tubong Cyprus
  rationale: Likas na pahayag sa modernong Filipino para sa pinagmulan o lugar ng kapanganakan, nang hindi tiyak na nililimitahan ito sa lahing ninuno lamang.
theological_decisions:
- issue: Lawak ng kahulugan ng παρακλήσεως sa paliwanag sa pangalang Bernabe
  choice: pagpapalakas-loob
  alternative: pagpapayo, pang-aaliw, o pagbibigay-ginhawa
  rationale: Maaaring tumukoy ang salita sa paghikayat o masidhing pagpapayo, gayundin sa pag-aliw. Hindi pinipili ng talata ang iisang makitid na diwa, kaya malawak ang salin sa pangunahing teksto at binabanggit sa talababa ang mahahalagang alternatibo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “naman” bilang banayad na panandang pandiskurso at ang “tubong Cyprus” bilang natural na paglalarawan ng pinagmulan. Inilipat ang pananda ng talababa sa mismong pariralang may leksikal na alternatibo.
