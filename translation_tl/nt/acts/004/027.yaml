id: ACT.4.27
reference: Acts 4:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: συνήχθησαν γὰρ ἐπ’ ἀληθείας ⸂ἐν τῇ πόλει ταύτῃ⸃ ἐπὶ τὸν ἅγιον παῖδά σου Ἰησοῦν, ὃν ἔχρισας, Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος σὺν ἔθνεσιν καὶ λαοῖς Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/027.yaml
  text: For truly in this city Herod and Pontius Pilate[a], together with the Gentiles and the peoples of Israel, were gathered against your holy servant Jesus, whom you anointed[b],
translation:
  language: tl
  text: Sapagkat totoong nagkatipon sa lungsod na ito laban sa iyong banal na lingkod[a] na si Jesus, na iyong pinahiran, sina Herodes at Poncio Pilato, kasama ang mga Hentil at ang mga sambayanan ng Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “anak.” Ang salitang Griyego na παῖς ay maaaring mangahulugang “lingkod” o “anak”; pinili rito ang “lingkod” dahil malamang na umaalingawngaw ito sa paglalarawan sa Lingkod sa Isaias.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga bansa at ang mga sambayanan ng Israel.” Ang Griyego ay gumagamit ng salitang maaaring mangahulugang “mga Hentil” o “mga bansa,” at pangmaramihan ang “mga sambayanan” ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: nagkatipon
  rationale: Likas sa modernong Tagalog at ipinahihiwatig ang sama-samang pagtipon nang hindi tahasang nagdaragdag kung sino ang kumilos bilang tagapagtipon.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ikinakabit ang pahayag sa naunang sipi at paliwanag sa panalangin.
- source_word: ἐπ’ ἀληθείας
  choice: totoong
  rationale: Natural na pang-abay sa Tagalog na nagpapanatili sa diin ng ‘tunay’ o ‘sa katotohanan.’
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: sa lungsod na ito
  rationale: Tuwirang lokatibong salin; hinahayaang matukoy sa konteksto na ang tinutukoy ay Jerusalem.
- source_word: ἐπὶ τὸν
  choice: laban sa
  rationale: Sa konteksto ng mapanlabang pagtitipon, malinaw na nagpapahayag ito ng pagsalungat kay Jesus.
- source_word: ἅγιον παῖδά σου
  choice: iyong banal na lingkod
  rationale: Ang ‘lingkod’ ang pinakamalamang na diwa dahil sa alusyon sa Lingkod ng Panginoon sa Isaias, habang ang ‘banal’ ay nagpapanatili sa pagiging itinalaga at natatanging pag-aari ng Diyos.
- source_word: ὃν ἔχρισας
  choice: na iyong pinahiran
  rationale: Pinananatili ang literal na larawan ng pagpapahid at ang mesiyanikong diwa nang hindi ipinapalit ang pangngalang ‘Mesiyas.’
- source_word: Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος
  choice: sina Herodes at Poncio Pilato
  rationale: Ginagamit ang karaniwang anyong Filipino ng mga pangalan at ang pantukoy na ‘sina’ para sa dalawang tao.
- source_word: σὺν ἔθνεσιν
  choice: kasama ang mga Hentil
  rationale: Sa pagtutumbas sa Israel, ang ‘mga Hentil’ ay malinaw na naghahayag ng mga taong hindi kabilang sa Israel.
- source_word: λαοῖς Ἰσραήλ
  choice: mga sambayanan ng Israel
  rationale: Pinananatili ang di-karaniwang pangmaramihang anyo ng λαοῖς sa halip na tahimik itong gawing isahan.
theological_decisions:
- issue: Kahulugan ng παῖς bilang tawag kay Jesus
  choice: lingkod
  alternative: anak
  rationale: Ang konteksto ng panalangin at ang paggamit sa Mga Gawa 3:13, 3:26, 4:27, at 4:30 ay malamang na umaalingawngaw sa Lingkod sa Isaias. Hindi nito itinatanggi ang pagiging Anak ni Jesus; hindi lamang iyon ang pangunahing diin ng salitang ito rito.
- issue: Kahulugan ng ἔθνεσιν na katapat ng Israel
  choice: mga Hentil
  alternative: mga bansa
  rationale: Dahil itinapat ang pangkat na ito sa mga sambayanan ng Israel, mas malinaw na ipinahahayag ng ‘mga Hentil’ ang etniko at panrelihiyong pagkakaiba, habang nananatiling tunay na posibleng salin ang ‘mga bansa.’
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang ayos na inuuna ang pagtutol kay Jesus bago pangalanan ang magkakasamang kumilos, at pinanatili rin ang tunay na leksikal na kalabuan sa mga talababa.
