  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία, ⸀οὐδὲ γὰρ ὄνομά ἐστιν ἕτερον ⸂ὑπὸ τὸν οὐρανὸν⸃ τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/012.yaml
  text: And there is salvation in no one else[a], for there is no other name under heaven given among men by which we must be saved.
translation:
  language: tl
  text: At walang kaligtasan sa iba, sapagkat walang ibang pangalan sa silong ng langit na ibinigay sa sangkatauhan[a] na sa pamamagitan nito ay dapat tayong maligtas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa gitna ng mga tao.” Ang Griyego ay tumutukoy dito sa sangkatauhan sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: σωτηρία
  choice: kaligtasan
  rationale: Karaniwang katumbas ito ng pagliligtas o kaligtasan; dito, ang pangngalang “kaligtasan” ay angkop sa pahayag tungkol sa natatanging nagliligtas na papel ni Jesus.
- source_word: ἐν ἄλλῳ οὐδενί
  choice: sa iba
  rationale: Maikli at likas sa Filipino, at pinananatili ang tahasang pagbubukod ng lahat ng iba pa nang hindi dinaragdagan ang teksto ng pangalang “Jesus,” na malinaw na sa konteksto.
- source_word: ὄνομα
  choice: pangalan
  rationale: Pinananatili ang larawan ng orihinal; maaaring saklawin ng “pangalan” ang pagkakakilanlan, kapangyarihan, at awtoridad nang hindi ito ipinapaliwanag sa mismong salin.
- source_word: ὑπὸ τὸν οὐρανόν
  choice: sa silong ng langit
  rationale: Pinananatili ang biblikal na idyoma at ang pandaigdig na saklaw nito sa marangal at pamilyar na Filipino.
- source_word: δεδομένον ἐν ἀνθρώποις
  choice: ibinigay sa sangkatauhan
  rationale: Ipinakikita ang pangkalahatang pagtukoy ng ἀνθρώποις sa lahat ng tao. Inilalahad sa talababa ang mas literal na posibilidad na “sa gitna ng mga tao.”
- source_word: ἐν ᾧ
  choice: na siyang ... ikaligtas
  rationale: Ang “siyang ikaligtas” ay likas na paraang Filipino upang ipahayag ang pangalan bilang paraan ng pagliligtas, habang pinananatili ang reperensiya ng panghalip sa “pangalan.”
- source_word: δεῖ σωθῆναι ἡμᾶς
  choice: dapat nating ikaligtas
  rationale: Pinananatili ng “dapat” ang diwa ng pangangailangan sa δεῖ, at ipinahahayag ng anyong “ikaligtas” ang pasibong kaisipang maligtas sa pamamagitan ng nabanggit na pangalan.
theological_decisions:
- issue: Ang pagiging natatangi ng kaligtasan kaugnay ni Jesus
  choice: “walang kaligtasan sa iba”
  alternative: “walang ibang daan tungo sa kaligtasan”
  rationale: Tuwirang sinasabi ng Griyego na ang kaligtasan ay wala sa iba. Hindi ito pinalalambot bilang isa lamang usapin ng “daan,” at wala ring idinagdag na paliwanag na lampas sa talata.
- issue: Ang “pangalan” bilang paraan ng pagliligtas
  choice: Pinanatili ang “pangalan” at ang pahayag na “siyang dapat nating ikaligtas.”
  alternative: Palitan ang “pangalan” ng “tao,” “kapangyarihan,” o tahasang “Jesus.”
  rationale: Sadyang mayaman ang gamit ng ὄνομα at maaari nitong ipahiwatig ang persona, pagkakakilanlan, at awtoridad. Pinananatili ng salin ang teolohikal na lawak nito nang hindi nilulutas sa isang paliwanag lamang.
- issue: Saklaw ng ἀνθρώποις
  choice: “sangkatauhan”
  alternative: “mga lalaki” o “sa gitna ng mga tao”
  rationale: Generic ang ἀνθρώποις at tumutukoy sa sangkatauhan, hindi lamang sa kalalakihan. Ang “sangkatauhan” ay malinaw at likas sa modernong Filipino; nasa talababa ang mas literal na alternatibo para sa preposisyon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang biblikal na idyomang “sa silong ng langit” at ang salitang “pangalan,” habang iniwasan ang sobrang literal ngunit alanganing pagkakasunod ng mga salita.
