  text: οἱ δὲ ἀκούσαντες ὁμοθυμαδὸν ἦραν φωνὴν πρὸς τὸν θεὸν καὶ εἶπαν· Δέσποτα, ⸀σὺ ὁ ποιήσας τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/024.yaml
  text: When they heard this[a], they lifted their voices together to God and said, “Master, you are the one who made heaven and earth and sea[b], and everything in them,”
translation:
  language: tl
  text: 'Nang marinig nila ito, sama-sama nilang itinaas ang kanilang tinig sa Diyos at sinabi: “Amo[a], ikaw ang gumawa ng langit, lupa, dagat, at lahat ng nasa mga ito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griyego: Δέσποτα (Despota), isang titulo para sa may ganap na awtoridad. Maaari ring isalin na “Soberano,” ngunit naiiba ito sa κύριος, na karaniwang isinasaling “Panginoon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Nang marinig nila ito
  rationale: Ang aorist participle ay may temporal na diwa. Idinagdag ang “ito” mula sa malinaw na konteksto upang maging natural sa Tagalog.
- source_word: ὁμοθυμαδόν
  choice: sama-sama
  rationale: Ipinahahayag nito ang nagkakaisang pagkilos ng buong pangkat nang hindi ipinahihiwatig na bumoto o pormal silang nagkasundo.
- source_word: ἦραν φωνήν
  choice: itinaas ang kanilang tinig
  rationale: Pinananatili ang isahang “tinig” ng Griyego upang idiin ang kanilang nagkakaisang panalangin, habang ang “kanilang” ay likas sa Tagalog para sa pangkat.
- source_word: πρὸς τὸν θεόν
  choice: sa Diyos
  rationale: Sa konteksto ng panalangin, ang πρός ay tumutukoy sa Diyos bilang pinatutungkulan ng kanilang sinabi.
- source_word: Δέσποτα
  choice: Makapangyarihang Panginoon
  rationale: Ipinahahayag ang lubos na awtoridad na taglay ng δεσπότης. Mas marangal at natural itong pantawag sa Diyos sa makabagong Tagalog kaysa “Amo,” bagaman ipinaliliwanag sa talababa ang natatanging diwa ng salitang Griyego.
- source_word: σὺ ὁ ποιήσας
  choice: ikaw ang gumawa
  rationale: Pinananatili ang mariing pagkilala sa Diyos bilang mismong gumawa, sa natural na ayos ng Tagalog.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν
  choice: langit, lupa, dagat
  rationale: Ito ang natural at pamilyar na pormula ng paglikha sa Tagalog; ang sunod-sunod na mga pangngalan ay nagpapanatili sa saklaw ng Griyego.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: lahat ng naroon
  rationale: Maikli at natural na tumutukoy sa lahat ng nasa langit, lupa, at dagat.
theological_decisions:
- issue: Ang banal na titulong Δέσποτα
  choice: Makapangyarihang Panginoon
  alternative: Amo; Kataas-taasang Pinuno; Panginoon
  rationale: Ang Δέσποτα ay nagbibigay-diin sa lubos na kapangyarihan at awtoridad at naiiba sa karaniwang κύριος. Ang saling pinili ay natural at marangal sa panalangin; ang talababa ang nagpapanatili sa leksikal na pagkakaibang hindi lubos na naipakikita ng iisang karaniwang titulong Tagalog.
- issue: Pagkakaisa sa ὁμοθυμαδόν at isahang φωνήν
  choice: sama-sama nilang itinaas ang kanilang tinig
  alternative: nagkaisa silang nanalangin nang malakas
  rationale: Hindi ginagawang tahasang “panalangin” ang pandiwang hindi iyon mismo ang sinasabi, at pinananatili ang larawan ng iisang tinig ng nagkakaisang pangkat.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sama-sama” sa halip na mas lumang “nang may pagkakaisa,” at pinanatili ang isahang “tinig” upang maipakita ang kolektibong pagkakaisa ng nagsasalita.
