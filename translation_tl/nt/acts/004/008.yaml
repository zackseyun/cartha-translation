base_translation:
  language: en
  yaml_path: translation/nt/acts/004/008.yaml
  text: Then Peter, filled with the Holy Spirit, said to them, “Rulers of the people and elders,”
translation:
  language: tl
  text: At si Pedro, na puspos ng Banal na Espiritu, ay nagsabi sa kanila, “Mga pinuno ng bayan at matatanda,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: At
  rationale: Nagsisilbi itong panandang pasalaysay para sa kasunod na pangyayari. Sa natural na salaysay sa Tagalog, ang “At” ay maayos na nag-uugnay sa tugon ni Pedro sa naunang tanong; ang mas literal na “Pagkatapos” ay maaaring magpahiwatig ng mas mahabang pagitan.
- source_word: Πέτρος
  choice: Pedro
  rationale: Ito ang kinagawiang anyo ng pangalang Peter sa Bibliyang Tagalog.
- source_word: πλησθεὶς
  choice: na puspos
  rationale: Ang aorist passive participle ay tumutukoy sa kalagayan ni Pedro bunga ng pagpupuspos sa kanya. Likas at marangal sa Tagalog ang “na puspos,” at hindi nito ginagawang tahasang gumagawa si Pedro ng kilos.
- source_word: πνεύματος ἁγίου
  choice: ng Banal na Espiritu
  rationale: Pagkatapos ng “puspos,” natural sa Tagalog ang genitibong “ng.” Ang parirala ay tumutukoy sa Banal na Espiritu bilang nagbibigay ng kapangyarihan kay Pedro upang magsalita.
- source_word: εἶπεν πρὸς αὐτούς
  choice: ay nagsabi sa kanila
  rationale: Direkta at natural na katumbas ng karaniwang pormula sa pagsasalaysay ng pananalita.
- source_word: Ἄρχοντες
  choice: Mga pinuno
  rationale: Tumutukoy sa mga taong may opisyal na kapangyarihang mamahala. Mas natural sa kasalukuyang Tagalog ang “mga pinuno” kaysa “mga tagapamahala” o “mga pinuno-pamahalaan.”
- source_word: τοῦ λαοῦ
  choice: ng bayan
  rationale: Sa kontekstong sibiko at panrelihiyon, ang λαός ay tumutukoy sa sambayanan ng Israel. Ang “bayan” ay maikli, natural, at angkop sa pormal na pagtawag.
- source_word: πρεσβύτεροι
  choice: mga matatandang tagapamahala
  rationale: Hindi lamang katandaan ang tinutukoy kundi ang kinikilalang tungkulin sa pamamahala. Nililinaw ng “tagapamahala” ang institusyonal na diwa habang pinananatili ng “matatanda” ang tradisyonal na konsepto ng elder.
theological_decisions:
- issue: Pagpapakahulugan sa πνεύματος ἁγίου
  choice: Banal na Espiritu
  alternative: banal na espiritu
  rationale: Sa konteksto ng Mga Gawa, tumutukoy ito sa personal at banal na Espiritung nagbibigay-kapangyarihan sa patotoo ni Pedro. Ang malaking titik ay kumikilala sa referent na ito nang hindi nagdaragdag ng paliwanag sa teksto.
- issue: Ahensiya sa πλησθεὶς πνεύματος ἁγίου
  choice: na puspos ng Banal na Espiritu
  alternative: na pinuspos ng Banal na Espiritu
  rationale: Pinananatili ng “puspos ng” ang idiomatikong ugnayan ng participle at genitive, pati ang di-tahasang passive force, nang hindi tiyakang ginagawang ahente ang Espiritu sa paraang maaaring lumampas sa anyo ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang karaniwang biblikal na “puspos” at “Banal na Espiritu,” habang ang pormal na pantawag na “Mga pinuno ng bayan at mga matatandang tagapamahala” ay angkop sa pagharap ni Pedro sa konseho.
