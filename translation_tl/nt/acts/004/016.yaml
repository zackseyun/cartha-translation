source:
  edition: SBLGNT
  text: λέγοντες· Τί ⸀ποιήσωμεν τοῖς ἀνθρώποις τούτοις; ὅτι μὲν γὰρ γνωστὸν σημεῖον γέγονεν δι’ αὐτῶν πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν, καὶ οὐ δυνάμεθα ⸀ἀρνεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/016.yaml
  text: saying[a], “What should we do with these men? For indeed, a notable sign has happened through them, evident to all who live in Jerusalem, and we cannot deny it.”
translation:
  language: tl
  text: na sinasabi, “Ano ang gagawin natin sa mga taong ito? Sapagkat malinaw sa lahat ng naninirahan sa Jerusalem na isang kilalang tanda[a] ang naganap sa pamamagitan nila, at hindi natin ito maikakaila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tandang kilala ng marami” o “tandang hayagang kinikilala.” Ang salitang Griyego ay maaaring mangahulugang “kilala” o “malaganap na kilala”; sa kontekstong ito, ang tanda ay hayag sa mga naninirahan sa Jerusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: na sinasabi
  rationale: Ang kasalukuyang participle ay nag-uugnay sa pananalita ng konseho sa naunang salaysay; natural sa Filipino ang “na sinasabi” bilang pambungad sa tuwirang sipi.
- source_word: Τί ποιήσωμεν
  choice: Ano ang gagawin natin
  rationale: Ang aorist subjunctive ay isang deliberative na tanong. Likas sa modernong Filipino ang anyong ito at naipahahayag nito ang pag-uusap tungkol sa dapat nilang gawin.
- source_word: τοῖς ἀνθρώποις τούτοις
  choice: sa mga taong ito
  rationale: Ang dative kasunod ng ποιέω ay bahagi ng idyomang tumutukoy sa gagawin nila sa kina Pedro at Juan. Sapat ang “mga taong ito” sa konteksto at hindi kailangang dagdagan ng salitang wala sa Griyego.
- source_word: ὅτι μὲν γὰρ
  choice: Sapagkat
  rationale: Ipinahahayag nito ang dahilan ng kanilang tanong. Ang diin ng mga partikula ay naipakikita ng kabuuang ayos ng pangungusap nang hindi pinabibigat ang Filipino.
- source_word: γνωστὸν σημεῖον
  choice: isang kilalang tanda
  rationale: Ang γνωστός ay maaaring mangahulugang kilala o hayagang kinikilala, at ang σημεῖον ay “tanda,” hindi lamang pangkalahatang “himala.” Pinananatili ng salin ang pampublikong pagkakilala sa pangyayari at ang teolohikal na bigat ng “tanda.”
- source_word: γέγονεν
  choice: ang naganap
  rationale: Ang perfect form ay tumutukoy sa pangyayaring naganap na at may nananatiling bunga. Ang “naganap” ay marangal at natural sa salaysay.
- source_word: δι’ αὐτῶν
  choice: sa pamamagitan nila
  rationale: Ang διά na may genitive ay nagpapahayag ng tagapamagitan o kasangkapan. Hindi nito ipinapalagay na sila ang nagsariling pinagmulan ng kapangyarihan.
- source_word: πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν
  choice: malinaw sa lahat ng naninirahan sa Jerusalem
  rationale: Pinananatili nito ang lawak ng πᾶσιν at ang hayag, hindi maitatagong katangian ng φανερόν sa natural na ayos ng Filipino.
- source_word: οὐ δυνάμεθα ἀρνεῖσθαι
  choice: hindi natin ito maikakaila
  rationale: Ang “ito” ay likas na tahasang layon sa Filipino at tumutukoy sa naganap na tanda, na siyang ipinahihiwatig ngunit hindi inuulit sa Griyego.
theological_decisions:
- issue: Kahulugan ng σημεῖον sa konteksto ng hayag na pagpapagaling
  choice: tanda
  alternative: himala
  rationale: Madalas gamitin sa Mga Gawa ang σημεῖον para sa isang makapangyarihang gawa na tumuturo sa higit pa sa pangyayari mismo. Pinananatili ng “tanda” ang ganitong teolohikal na pahiwatig nang hindi ikinakaila ang mahimalang katangian nito.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “naganap” at “maikakaila” para sa dignidad ng salaysay, ngunit iniwasan ang lipas o labis na pormal na pananalita. Inilagay ang panandang talababa pagkatapos mismo ng “kilalang tanda,” na siyang pariralang nililinaw nito.
