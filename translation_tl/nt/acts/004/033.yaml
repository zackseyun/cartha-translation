  text: καὶ ⸂δυνάμει μεγάλῃ⸃ ἀπεδίδουν τὸ μαρτύριον οἱ ἀπόστολοι ⸂τῆς ἀναστάσεως τοῦ κυρίου Ἰησοῦ⸃, χάρις τε μεγάλη ἦν ἐπὶ πάντας αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/033.yaml
  text: And with great power the apostles were giving their testimony about the resurrection of the Lord Jesus[a], and great favor was upon them all.
translation:
  language: tl
  text: Sa pamamagitan ng dakilang kapangyarihan, patuloy na nagpapatotoo ang mga apostol tungkol sa muling pagkabuhay ng Panginoong Jesus, at malaki ang lingap na nasa kanilang lahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at dakilang biyaya ang nasa kanilang lahat.” Ang salitang Griyego na χάρις ay maaaring mangahulugang “biyaya,” “lingap,” o “kagandahang-loob.” Maaaring saklaw ng pananalita kapwa ang mapagbiyayang presensiya ng Diyos at ang mabuting pagtingin sa mga mananampalataya.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμει μεγάλῃ
  choice: taglay ang dakilang kapangyarihan
  rationale: Ipinahihiwatig ng instrumental na datibo ang paraan o bisa ng pagpapatotoo. Likas sa Lucas–Mga Gawa ang “kapangyarihan,” at hindi nito nililimitahan ang diwa sa mga himala lamang.
- source_word: ἀπεδίδουν
  choice: patuloy na nagpapatotoo
  rationale: Ipinapakita ng imperpektong pandiwa ang nagpapatuloy o paulit-ulit na pagkilos. Sa pariralang kasama ang μαρτύριον, natural sa Tagalog ang “nagpapatotoo.”
- source_word: τὸ μαρτύριον
  choice: nagpapatotoo
  rationale: Isinama ang pangngalang “patotoo” sa natural na pandiwang Tagalog. Ang mga apostol ang tahasang simuno, kaya malinaw na sa kanila nagmumula ang patotoo.
- source_word: τῆς ἀναστάσεως
  choice: tungkol sa muling pagkabuhay
  rationale: Ang henitibo ay pinakamalamang na nagsasaad ng nilalaman ng patotoo; malinaw at natural itong ipinahahayag ng “tungkol sa.”
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ng Panginoong Jesus
  rationale: Pinananatili ang titulong κύριος bilang “Panginoon” at ang kaugnayan ng muling pagkabuhay kay Jesus.
- source_word: χάρις μεγάλη
  choice: dakilang kagandahang-loob
  rationale: Ang χάρις ay maaaring tumukoy sa biyaya o mabuting pagtingin. Ang “kagandahang-loob” ay nagpapanatili ng malawak na diwa nang hindi ito agad nililimitahan sa teknikal na teolohikal na kahulugan.
- source_word: ἐπὶ πάντας αὐτούς
  choice: nasa kanilang lahat
  rationale: Ipinahahayag nito na ang χάρις ay sumasaklaw sa buong kapulungan. Natural ito sa modernong Tagalog habang pinananatili ang diin sa lahat.
theological_decisions:
- issue: Kahulugan at pinagmulan ng χάρις
  choice: kagandahang-loob na sumasaklaw sa buong kapulungan, nang hindi tinutukoy ang pinagmulan
  alternative: biyaya ng Diyos; o mabuting pagtingin ng mga tao
  rationale: Hindi tahasang tinutukoy ng Griyego kung ang χάρις ay mula sa Diyos, sa mga tao, o sinasaklaw ang dalawang diwa. Pinananatili ng salin at talababa ang ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “patuloy na nagpapatotoo” upang natural na maipakita ang aspektong imperpekto, at “kagandahang-loob” upang mapanatili ang hindi tiyak na saklaw ng χάρις.
