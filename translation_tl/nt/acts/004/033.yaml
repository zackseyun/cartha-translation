  naturalness: Mas natural at malinaw sa modernong Tagalog ang “Sa pamamagitan ng dakilang kapangyarihan.” Ang “malaki ang lingap na nasa kanilang lahat” ay pinananatili ang saklaw na “upon them all” nang hindi tinutukoy kung sino ang pinagmumulan ng lingap.
  terminology: Ang “Panginoong Jesus,” “muling pagkabuhay,” at “nagpapatotoo” ay angkop. Pinalitan ang “kagandahang-loob” ng “lingap” sa pangunahing teksto upang hindi magmukhang kabutihang ipinakikita mismo ng mga mananampalataya ang tinutukoy na χάρις; ang “biyaya” at “kagandahang-loob” ay nananatiling mga posibilidad sa talababa.
