  text: Λαλούντων δὲ αὐτῶν πρὸς τὸν λαὸν ἐπέστησαν αὐτοῖς οἱ ⸀ἱερεῖς καὶ ὁ στρατηγὸς τοῦ ἱεροῦ καὶ οἱ Σαδδουκαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/001.yaml
  text: While they were speaking to the people[a], the priests and the captain of the temple and the Sadducees came upon them[b],
translation:
  language: tl
  text: Habang nagsasalita sila sa mga tao, lumapit sa kanila[a] ang mga pari, ang pinuno ng mga bantay sa templo[b], at ang mga Saduseo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dumating sa kinaroroonan nila” o “lumapit sa kanila.” Maaaring tumukoy ang pandiwang Griyego sa paglapit o biglaang pagdating; sa konteksto, ipinahihiwatig nito ang pagdating ng mga opisyal upang gambalain sila.
    reason: lexical_alternative
  - marker: b
    text: Ang “pinuno ng mga bantay sa templo” ay isang opisyal na namamahala sa kaayusan at seguridad sa nasasakupan ng templo.
    reason: cultural_note
lexical_decisions:
- source_word: Λαλούντων δὲ αὐτῶν
  choice: Habang nagsasalita sila
  rationale: Isinasalin ang genitive absolute bilang likas na sugnay na panahunan sa Filipino. Hindi na ginamitan ng hiwalay na panandang katumbas ng δέ dahil sapat na sa daloy ng salaysay ang “Habang.”
- source_word: πρὸς τὸν λαὸν
  choice: sa mga tao
  rationale: Ang λαός dito ay tumutukoy sa mga taong nagkakatipon sa templo. Mas tuwiran ito kaysa “sa karamihan,” na maaaring magdagdag ng di-tiyak na larawan ng isang siksik na pulutong.
- source_word: ἐπέστησαν αὐτοῖς
  choice: lumapit sa kanila
  rationale: Maaaring tumukoy ang ἐφίστημι sa paglapit o pagdating sa kinaroroonan ng iba, na kung minsan ay biglaan. Pinananatili ng “lumapit sa kanila” ang kilos nang hindi pa tuwirang ipinapalagay na komprontasyon.
- source_word: οἱ ἱερεῖς
  choice: ang mga pari
  rationale: Karaniwang “mga pari” ang ἱερεῖς; hindi ito ἀρχιερεῖς, kaya hindi idinagdag ang ranggong “mga punong pari.”
- source_word: ὁ στρατηγὸς τοῦ ἱεροῦ
  choice: ang pinuno ng templo
  rationale: Ang στρατηγός ay opisyal na namumuno. Sa kontekstong ito, ang “pinuno ng templo” ay maikli at natural; ipinapaliwanag sa talababa ang tungkulin niya sa kaayusan at seguridad.
- source_word: οἱ Σαδδουκαῖοι
  choice: ang mga Saduseo
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan ng pangkat na ito.
theological_decisions:
- issue: Antas ng pagkapalaban sa pagdating ng mga opisyal
  choice: “lumapit sa kanila” bilang neutral na paglalarawan
  alternative: “hinarap sila” o “bigla silang nilapitan”
  rationale: Ipinakikita ng kasunod na konteksto ang pagsalungat, ngunit ang pandiwa rito lamang ay hindi kailangang mangahulugang tahasang komprontasyon. Pinananatili ng salin ang tensiyon nang hindi ito inuunahan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inayos ang pagkakasunod ng pangungusap upang maging natural sa Tagalog habang pinananatili ang mga kalahok at ang neutral na puwersa ng pandiwa. Inilagay ang bawat talababa sa salitang talagang ipinapaliwanag nito.
