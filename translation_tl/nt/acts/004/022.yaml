  text: ἐτῶν γὰρ ἦν πλειόνων τεσσεράκοντα ὁ ἄνθρωπος ἐφ’ ὃν ⸀γεγόνει τὸ σημεῖον τοῦτο τῆς ἰάσεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/022.yaml
  text: For the man on whom this sign of healing had happened was more than forty years old[a].
translation:
  language: tl
  text: Sapagkat mahigit apatnapung taong gulang na ang lalaking nakaranas ng tandang ito ng pagpapagaling.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tandang pagpapagaling na ito” o “himalang ito ng pagpapagaling.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτῶν ... πλειόνων τεσσεράκοντα
  choice: mahigit apatnapung taong gulang
  rationale: Likas at malinaw na pagpapahayag sa modernong Tagalog ng idyomang Griyego para sa edad na higit sa apatnapung taon.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag na ugnayan ng talata sa naunang pahayag.
- source_word: ὁ ἄνθρωπος
  choice: ang lalaki
  rationale: Tumutukoy ito sa tiyak na lalaking kilala na sa konteksto.
- source_word: ἐφ’ ὃν
  choice: ginawan
  rationale: Sa sugnay na Tagalog, natural nitong ipinahahayag na ang lalaki ang taong tumanggap o nakaranas ng tanda, bagaman bahagyang mas tahasang ipinahihiwatig ang pagkilos kaysa sa literal na 'sa kanya nangyari.'
- source_word: γεγόνει
  choice: ginawan
  rationale: Isinasama sa natural na konstruksiyong Tagalog ang naunang naganap at natapos na pangyayari; malinaw sa konteksto na ang tanda ay ginawa para sa lalaki.
- source_word: τὸ σημεῖον τοῦτο
  choice: tandang ito
  rationale: Pinananatili ng 'tanda' ang patunay at kapahayagang diwa ng σημεῖον, sa halip na agad itong gawing 'himala.'
- source_word: τῆς ἰάσεως
  choice: ng pagpapagaling
  rationale: Tuwirang inililipat ang ideya ng paggaling o pagpapagaling at natural na ikinakabit sa 'tanda.'
theological_decisions:
- issue: Paglilipat ng σημεῖον sa konteksto ng himala
  choice: tanda
  alternative: himala
  rationale: Pinananatili ng 'tanda' ang diwa ng pangyayari bilang patunay na may kahulugan, nang hindi binubura ang natatanging salita ni Lucas.
- issue: Pagpapahiwatig ng gumaganap sa γεγόνει
  choice: ginawan
  alternative: nangyari sa kanya
  rationale: Mas natural sa Tagalog ang 'ginawan ng tanda,' ngunit hindi nito pinapangalanan kung sino ang gumaganap. Ang alternatibo ay mas malapit sa tahasang event-focused na anyo ng Griyego ngunit hindi gaanong likas sa pangungusap.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang 'tanda' bilang mahalagang terminong teolohikal ni Lucas; inilagay ang marker na [a] sa mismong teksto.
