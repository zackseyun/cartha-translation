translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapulungan” sa pangunahing teksto sa halip na transliterasyong “Sanhedrin,” ngunit pinanatili ang katawagan sa talababa. Nilinaw ang antecedent bilang Pedro at Juan para sa natural na daloy.
