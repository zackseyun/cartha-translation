  text: But after ordering them to go outside the council[a], they began conferring with one another[b],
translation:
  language: tl
  text: Ngunit matapos nilang utusan sina Pedro at Juan na lumabas ng kapulungan[a], nag-usap-usap sila[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sanhedrin.” Ang salitang Griyego ay maaaring tumukoy sa konsehong namamahala sa mga Judio o sa pagpupulong nito.
    reason: lexical_alternative
  - marker: b
    text: O “nagtalakayan sila” o “nagsanggunian sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κελεύσαντες
  choice: matapos nilang utusan
  rationale: Ipinapakita ng aorist participle na nauna ang pag-uutos sa pangunahing kilos; natural itong ipinahahayag sa Tagalog bilang “matapos nilang utusan.”
- source_word: δὲ
  choice: Ngunit
  rationale: Naghuhudyat ito ng banayad na pagkontra o paglipat sa bagong yugto ng salaysay, mula sa hayagang pag-uusap tungo sa saradong pagsasanggunian.
- source_word: αὐτοὺς
  choice: sina Pedro at Juan
  rationale: Bagaman panghalip lamang ang Griyego, nilinaw sa Tagalog ang tinutukoy upang maiwasan ang kalituhan sa sunod-sunod na maramihang panghalip.
- source_word: ἔξω τοῦ συνεδρίου
  choice: lumabas muna sa kapulungan
  rationale: Ang συνέδριον ay maaaring tumukoy sa konsehong Judio o sa pagpupulong nito. Ang “kapulungan” ay likas at nauunawaan sa modernong Tagalog; ipinahihiwatig ng “muna” na pansamantala silang pinalabas habang nag-uusap ang mga pinuno.
- source_word: ἀπελθεῖν
  choice: lumabas
  rationale: Kasama ng ἔξω, ang “lumabas” ang natural at maikling paraan ng pagsasabi na pinapunta sila sa labas.
- source_word: συνέβαλλον
  choice: nag-usap-usap
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa patuloy na pagsasanggunian o pagtalakay. Ang anyong inuulit ay natural na nagpapahayag ng palitan ng kuro-kuro sa Tagalog, habang ang imperfect ay sinasalo ng daloy ng salaysay.
- source_word: πρὸς ἀλλήλους
  choice: sila
  rationale: Ang resiprokal na diwa ng “sa isa’t isa” ay likas nang taglay ng “nag-usap-usap”; sapat ang “sila” at iniiwasan nito ang mabigat na pag-uulit.
