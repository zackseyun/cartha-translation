  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: παρέστησαν οἱ βασιλεῖς τῆς γῆς καὶ οἱ ἄρχοντες συνήχθησαν ἐπὶ τὸ αὐτὸ κατὰ τοῦ κυρίου καὶ κατὰ τοῦ χριστοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/026.yaml
  text: The kings of the earth took their stand[a], and the rulers were gathered together against the Lord and against his Messiah.
translation:
  language: tl
  text: Tumindig ang mga hari ng lupa, at sama-samang nagtipon ang mga pinuno laban sa Panginoon at laban sa kanyang Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo”; sa Griyego, Christos, ibig sabihin, “ang kanyang Pinahiran.”
    reason: Ipinapakita ang alternatibong salin at ang literal na kahulugan ng titulong Χριστός.
lexical_decisions:
- source_word: παρέστησαν
  choice: Tumindig
  rationale: Pinananatili nito ang larawan mula sa Awit 2:2 ng sadyang pagtindig upang sumalungat, nang hindi nagdaragdag ng pandiwang wala sa Griyego.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: ang mga hari ng lupa
  rationale: Tiyak na “mga hari” ang βασιλεῖς, at malawak ang saklaw ng γῆ sa siping ito, kaya “lupa” sa halip na isang tiyak na lupain.
- source_word: οἱ ἄρχοντες
  choice: ang mga pinuno
  rationale: Natural at kasalukuyang salin ng ἄρχοντες na naiiba pa rin sa mas tiyak na titulong “mga hari.”
- source_word: συνήχθησαν ἐπὶ τὸ αὐτό
  choice: sama-samang nagtipon
  rationale: Malinaw na ipinapahayag ang pagtitipon sa iisang layunin o lugar; natural ito sa Filipino bagaman hindi tahasang minamarkahan ang anyong pasibo ng Griyego.
- source_word: κατὰ τοῦ κυρίου καὶ κατὰ τοῦ χριστοῦ αὐτοῦ
  choice: laban sa Panginoon at laban sa kanyang Mesiyas
  rationale: Inuulit ang “laban sa” gaya ng inuulit ang κατά, at pinananatili ang ugnayan ng Panginoon at ng kanyang hinirang na Mesiyas.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός sa sipi mula sa Awit 2
  choice: Mesiyas
  alternative: Cristo; ang Pinahiran
  rationale: Gumaganap dito ang χριστός bilang titulo ng hinirang ng Panginoon sa konteksto ng Awit 2. Pinananatili sa talababa ang pamilyar na “Cristo” at ang literal na kahulugang “Pinahiran.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “Tumindig” ay nagpapanatili sa matalinghagang pagtindig sa pagsalungat; ang “sama-samang nagtipon” ay likas na Filipino para sa pinagsamang pariralang συνήχθησαν ἐπὶ τὸ αὐτό.
