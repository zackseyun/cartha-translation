base_translation:
  language: en
  yaml_path: translation/nt/acts/013/043.yaml
  text: After the synagogue had been dismissed[a], many of the Jews and devout proselytes followed Paul and Barnabas, who, speaking with them[c][b], were urging them to continue in the grace of God.
translation:
  language: tl
  text: Pagkatapos magwakas ang pagtitipon sa sinagoga,[a] maraming Judio at mga debotong proselita ang sumunod kina Pablo at Bernabe. Habang kausap nila ang mga ito, hinihikayat nila silang magpatuloy sa biyaya ng Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pagkatapos maghiwa-hiwalay ang kapulungan sa sinagoga.” Ang Griyego ay tumutukoy sa pagtatapos o pagpapauwi sa nagkatipong kapulungan, hindi sa gusali mismo.
    reason: lexical_alternative
  - marker: b
    text: O “hinihikayat nila silang manatili sa biyaya ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λυθείσης ... τῆς συναγωγῆς
  choice: Nang matapos ang pagtitipon sa sinagoga
  rationale: Ang genitive absolute ay nagsasaad ng naunang pangyayari. Sa konteksto, ang συναγωγή ay tumutukoy sa nagkatipong kapulungan o pagpupulong na nagwakas, hindi sa gusaling literal na pinauwi; natural itong ipinahahayag sa Tagalog bilang pagtatapos ng pagtitipon.
- source_word: ἠκολούθησαν
  choice: sumunod
  rationale: Direkta at natural na katumbas; inilalarawan dito ang pagsunod ng mga tao kina Pablo at Bernabe matapos ang pagtitipon.
- source_word: πολλοὶ τῶν Ἰουδαίων
  choice: maraming Judio
  rationale: Natural na Tagalog para sa partitive construction na nangangahulugang marami mula sa mga Judio.
- source_word: τῶν σεβομένων προσηλύτων
  choice: mga debotong proselita
  rationale: Ang προσήλυτος ay taong pormal na yumakap sa Judaismo, hindi lamang isang nakikiramay o sumasamba sa Diyos; pinananatili ng 'debotong' ang diwa ng σεβομένων.
- source_word: οἵτινες
  choice: ng dalawa
  rationale: Tumutukoy kina Pablo at Bernabe. Ang tahasang 'ng dalawa' ay nag-aalis ng kalituhan sa panghalip at natural sa Tagalog nang hindi nagdaragdag ng kahulugan.
- source_word: προσλαλοῦντες αὐτοῖς
  choice: Kinausap sila
  rationale: Ipinahahayag ang kasabay at patuloy na pakikipag-usap sa idiomatikong modernong Tagalog.
- source_word: ἔπειθον
  choice: hinimok
  rationale: Sa konteksto, ang imperfect verb ay naglalarawan ng patuloy na paghikayat. Ang 'hinimok' ay angkop sa exhortational na lakas ng πείθω nang hindi ito ginagawang sapilitang pagkumbinsi.
- source_word: αὐτοὺς προσμένειν
  choice: na manatili
  rationale: Ang προσμένω ay maaaring mangahulugang manatili, magpatuloy, o magtiyaga. Ang 'manatili' ay tuwiran at nababagay sa kasunod na pariralang 'sa biyaya.'
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: sa biyaya ng Diyos
  rationale: Pinananatili ang malawak na teolohikal na saklaw ng χάρις bilang mapagbiyayang pagkilos at kaloob ng Diyos, pati ang kalagayang hinuhubog nito, nang hindi ito nililimitahan sa isang paliwanag.
theological_decisions:
- issue: Kahulugan ng pananatili sa biyaya ng Diyos
  choice: manatili sa biyaya ng Diyos
  alternative: magpatuloy sa mensahe tungkol sa biyaya ng Diyos; manatili sa mapagbiyayang pagtanggap ng Diyos
  rationale: Maaaring saklawin ng Griyego kapuwa ang mapagbiyayang pagkilos ng Diyos at ang pamumuhay sa ilalim ng biyayang iyon. Pinananatili ng salin ang tunay na lawak at tensiyong teolohikal sa halip na pumili ng isang makitid na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'sinagoga,' 'proselita,' at 'biyaya' bilang pamilyar at tumpak na mga terminong biblikal; nilinaw sa konteksto ang 'proselita' nang hindi ito pinaparaprasang basta tagasunod lamang.
