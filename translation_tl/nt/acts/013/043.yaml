revisions:
- from: Nang matapos ang pagtitipon sa sinagoga,[a] maraming Judio at mga debotong proselita ang sumunod kina Pablo at Bernabe. Kinausap sila ng dalawa at hinimok na manatili sa biyaya ng Diyos.[b]
  to: Pagkatapos magwakas ang pagtitipon sa sinagoga,[a] maraming Judio at mga debotong proselita ang sumunod kina Pablo at Bernabe. Habang kausap nila ang mga ito, hinihikayat nila silang magpatuloy sa biyaya ng Diyos.[b]
  rationale: Inayos ang ikalawang pangungusap upang malinaw na sina Pablo at Bernabe ang mga nagsasalita at nanghihikayat, samantalang ang mga Judio at proselita ang hinihikayat. Ang “habang kausap nila ang mga ito” ay likas na naghahayag ng kasabay na participle na προσλαλοῦντες, at ang “hinihikayat nila” ay nagbibigay ng angkop na patuloy na diwa ng imperfect na ἔπειθον. Pinananatili ng “magpatuloy sa biyaya ng Diyos” ang sinadyang lawak ng τῇ χάριτι τοῦ θεοῦ.
