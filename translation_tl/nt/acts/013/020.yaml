  naturalness: May bahagyang di-likas na tunog ang “pagkatapos ng mga bagay na ito” at “Samuel na propeta.” Mas natural sa makabagong Filipino ang “pagkatapos ng mga ito” at “ang propetang si Samuel,” nang hindi binabago ang saklaw o ugnayan ng Griyego.
  terminology: Ang “mga hukom” ay angkop na nakaugat na katawagang biblikal at pangkasaysayan. Ang “propetang si Samuel” ay malinaw at marangal na paglalarawan sa pangalan at tungkulin ni Samuel.
