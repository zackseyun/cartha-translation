  text: ⸂ὡς ἔτεσι τετρακοσίοις καὶ πεντήκοντα. καὶ μετὰ ταῦτα⸃ ἔδωκεν κριτὰς ἕως Σαμουὴλ ⸀τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/020.yaml
  text: For about four hundred and fifty years[a]. And after these things he gave judges until Samuel the prophet.
translation:
  language: tl
  text: Humigit-kumulang apat na raan at limampung taon.[a] At pagkatapos ng mga ito, binigyan niya sila ng mga hukom hanggang sa propetang si Samuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa ilang salin, naiiba ang pagkakaugnay ng pagtukoy sa panahon: “Binigyan niya sila ng mga hukom sa loob ng humigit-kumulang apat na raan at limampung taon, hanggang sa propetang si Samuel.” Pinagtatalunan ang pagkakabuo at pagbabantas ng Griyego rito.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: humigit-kumulang
  rationale: Kasama ng bilang, ipinahihiwatig ng ὡς na tantiyang haba ng panahon ito, hindi eksaktong bilang.
- source_word: ἔτεσι τετρακοσίοις καὶ πεντήκοντα
  choice: sa loob ng ... apat na raan at limampung taon
  rationale: Ipinahahayag ng pariralang datibo ang saklaw o tagal ng panahon; natural itong ipinapahayag sa Tagalog sa pamamagitan ng “sa loob ng.”
- source_word: καὶ μετὰ ταῦτα
  choice: At pagkatapos ng mga bagay na ito
  rationale: Pinananatili nito ang pagkakasunod-sunod at ang pangmaramihang demonstratibo ng Griyego.
- source_word: ἔδωκεν
  choice: binigyan niya sila
  rationale: 'Pinananatili ang pangunahing diwa ng δίδωμι na “nagbigay,” habang idinaragdag ang likas na layon sa Tagalog na malinaw mula sa konteksto: ang bayang Israel.'
- source_word: κριτὰς
  choice: mga hukom
  rationale: Ito ang kinikilalang katawagang pangkasaysayan para sa mga pinunong ibinigay sa Israel bago ang panahon ng mga hari.
- source_word: ἕως
  choice: hanggang kay
  rationale: Tuwirang minamarkahan ang hangganan ng panahon hanggang sa pagdating ni Samuel.
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: Samuel na propeta
  rationale: Natural na Tagalog na pagkakakilanlan ito at pinananatili ang tungkulin ni Samuel bilang propeta.
theological_decisions:
- issue: Pagkakaugnay ng pariralang “humigit-kumulang apat na raan at limampung taon” sa isang talatang mahirap sa teksto at sintaks
  choice: Ituring ang parirala bilang hiwalay na pahayag tungkol sa tagal, at pagkatapos ay isalin ang “At pagkatapos ng mga bagay na ito, binigyan niya sila ng mga hukom hanggang kay Samuel na propeta,” ayon sa ibinigay na SBLGNT.
  alternative: 'Iugnay ang apat na raan at limampung taon nang tuwiran sa panahon ng mga hukom: “Binigyan niya sila ng mga hukom sa loob ng humigit-kumulang apat na raan at limampung taon, hanggang kay Samuel na propeta.”'
  rationale: Nauuna sa ibinigay na tekstong Griyego ang parirala tungkol sa 450 taon bago ang “at pagkatapos ng mga bagay na ito.” Hindi nilulutas nang tahimik ang pinagtatalunang pagkakaugnay nito; inilalahad sa talababa ang mahalagang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang biblikal at pangkasaysayang katawagang “mga hukom,” gayundin ang tunay na kalabuan ng pariralang tumutukoy sa 450 taon.
