  rationale: Inayos lamang ang dalawang parirala para sa likas na modernong Filipino. Pinanatili ang hiwalay na pahayag na “Humigit-kumulang apat na raan at limampung taon” ayon sa ibinigay na SBLGNT at ang talababa ay patuloy na malinaw na nagsasaad ng pinagtatalunang alternatibong pagkakaugnay.
