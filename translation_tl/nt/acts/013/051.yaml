  terminology: Ang “alikabok,” “mga paa,” at “Iconio” ay angkop. Ang talababa ay pinasimple upang maging natural ang Filipino at upang ipaliwanag ang sagisag na kilos nang hindi ito gawing karagdagang pahayag ng talata.
