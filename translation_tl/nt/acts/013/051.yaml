  yaml_path: translation/nt/acts/013/051.yaml
  text: But they shook off the dust from their feet against them and went to Iconium[a].
translation:
  language: tl
  text: Ngunit ipinagpag nila ang alikabok mula sa kanilang mga paa laban sa kanila at pumunta sa Iconio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pagpag ng alikabok mula sa mga paa ay isang sagisag na kilos ng pagputol ng ugnayan at pagsaksi laban sa mga tumanggi sa mensahe.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ngunit … nila
  rationale: Ang δέ ay nagpapahiwatig ng banayad na pagsalungat o paglipat sa salaysay. Ang artikulo at participle ay tumutukoy kina Pablo at Bernabe, kaya likas sa Filipino ang panghalip na “nila.”
- source_word: ἐκτιναξάμενοι
  choice: ipinagpag
  rationale: Ang aorist middle participle ng ἐκτινάσσω ay tumutukoy sa mariing pagpag upang maalis ang isang bagay. Ginawang pandiwang may hangganan ang participle upang maging natural ang daloy sa Filipino.
- source_word: τὸν κονιορτὸν
  choice: ang alikabok
  rationale: Ang κονιορτός ay pinong alikabok o lupang madaling umangat mula sa daan; “alikabok” ang pinakatumpak at karaniwang salita sa kontekstong ito.
- source_word: τῶν ποδῶν
  choice: mula sa kanilang mga paa
  rationale: Ipinahahayag ng genitive ang pinagmulan ng alikabok. Nililinaw ng “mula sa” ang ugnayang ito sa natural na Filipino.
- source_word: ἐπ’ αὐτοὺς
  choice: laban sa mga iyon
  rationale: Ang ἐπί na may accusative ay may diwang nakatuon laban sa mga taong tumanggi. Pinananatili ng “laban sa mga iyon” ang puwersa ng parirala nang hindi idinaragdag sa pangunahing teksto ang interpretasyong “bilang patotoo” o “bilang paghatol.”
- source_word: ἦλθον
  choice: pumunta
  rationale: Sa salaysay ng paglalakbay patungo sa isang tiyak na destinasyon, natural sa Filipino ang “pumunta.”
- source_word: εἰς Ἰκόνιον
  choice: sa Iconio
  rationale: Ang εἰς ay nagpapahayag ng pagpunta sa lungsod. “Iconio” ang angkop na anyong Filipino ng pangalan ng lugar.
theological_decisions:
- issue: Ang sagisag na pagpag ng alikabok mula sa mga paa
  choice: Isinalin nang tuwiran ang kilos bilang ginawa “laban sa mga iyon,” at ipinaliwanag ang kahulugang pangkultura sa talababa.
  alternative: “bilang patotoo laban sa kanila” o “bilang tanda ng paghatol sa kanila” sa pangunahing teksto
  rationale: Hindi tahasang sinasabi ng Griyegong teksto ang “patotoo” o “paghatol.” Pinananatili ng salin ang kilos at direksiyon nito habang iniiwasang gawing bahagi ng teksto ang isang pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang di-pangkaraniwang ayos na “ipinagpag nila laban sa mga iyon” upang maipahayag ang puwersa ng ἐπ’ αὐτούς nang hindi nagpapahiwatig na literal nilang ipinagpag ang alikabok sa ibabaw ng mga tao.
