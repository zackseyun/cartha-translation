base_translation:
  language: en
  yaml_path: translation/nt/acts/013/032.yaml
  text: And we ourselves proclaim to you the good news of the promise made to the fathers,[a]
translation:
  language: tl
  text: At kami ay nagpapahayag sa inyo ng magandang balita tungkol sa pangakong ibinigay sa mga ninuno,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga ama”; tumutukoy ito sa mga ninuno ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Karaniwang pang-ugnay na nagpapatuloy sa naunang pangangatwiran nang walang idinadagdag na interpretasyon.
- source_word: ἡμεῖς
  choice: namin
  rationale: Ipinahihiwatig ng tahasang panghalip na Griyego ang diin o paghahambing; sa natural na Tagalog, sapat na naipapahayag ito ng aktor-pokus na pandiwa kasama ang “namin,” nang hindi gumagamit ng mabigat na “kami mismo.”
- source_word: ὑμᾶς
  choice: sa inyo
  rationale: Sa pandiwang εὐαγγελιζόμεθα, ang mga kinakausap ay likas na ipinahahayag sa Tagalog bilang “sa inyo.”
- source_word: εὐαγγελιζόμεθα
  choice: ipinapahayag ... ang magandang balita
  rationale: Pinananatili nito ang kahulugang pagpapahayag ng mabuting balita at iniiwasan ang mas teknikal o pansimbahang katawagang “ipinangangaral ang ebanghelyo.”
- source_word: τὴν ... ἐπαγγελίαν
  choice: ang ... pangako
  rationale: Tumutukoy ito sa tiyak na pangako ng Diyos, hindi lamang sa isang pangkalahatang pahayag.
- source_word: πρὸς τοὺς πατέρας
  choice: sa mga ninuno
  rationale: Sa modernong Tagalog, “mga ninuno” ang natural at malinaw na covenant-historical na tawag sa mga προπάτορες ng Israel; ang literal na “mga ama” ay maaaring mapagkamalang agarang mga magulang.
- source_word: γενομένην
  choice: ibinigay
  rationale: Natural na kolokasyon sa Tagalog ang “pangakong ibinigay.” Hindi ito isinasaling “tinupad,” sapagkat ang katuparan ay ipinahahayag pa sa kasunod na talata.
theological_decisions:
- issue: Pagpapakahulugan sa πατέρες
  choice: mga ninuno
  alternative: mga ama
  rationale: Bagaman literal na “mga ama” ang πατέρες, sa kontekstong pangkasaysayan ng tipan ay tumutukoy ito sa mga ninuno ng Israel. Ang “mga ninuno” ay mas malinaw sa ordinaryong modernong Tagalog at hindi nagdaragdag ng pag-aari na wala sa Griyego.
- issue: Diin ng tahasang ἡμεῖς
  choice: namin
  alternative: kami mismo
  rationale: May diin ang tahasang panghalip, ngunit ang “kami mismo” ay labis na mabigat at maaaring magpahiwatig ng eksklusibong pagkilos. Pinananatili ng natural na ayos sa Tagalog ang pagkakakilanlan ng mga tagapagsalita nang hindi pinalalabis ang diin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magandang balita” sa halip na teknikal na “ebanghelyo,” at “mga ninuno” upang maging malinaw ang sangguniang pangkasaysayan ng tipan.
