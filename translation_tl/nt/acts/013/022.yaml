  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ μεταστήσας αὐτὸν ἤγειρεν ⸂τὸν Δαυὶδ αὐτοῖς⸃ εἰς βασιλέα, ᾧ καὶ εἶπεν μαρτυρήσας· Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί, ἄνδρα κατὰ τὴν καρδίαν μου, ὃς ποιήσει πάντα τὰ θελήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/022.yaml
  text: And after removing him[a], he raised up David for them as king, to whom he also bore witness and said, ‘I have found David the son of Jesse, a man according to my heart[b], who will do all my will.’
translation:
  language: tl
  text: At matapos niyang alisin si Saul[a], itinalaga niya si David bilang hari para sa kanila. Nagpatotoo rin siya tungkol kay David at sinabi, “Natagpuan ko si David na anak ni Jesse, isang lalaking ayon sa aking puso[b], na gagawa ng lahat ng aking mga nais.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “siya”; si Saul ang tinutukoy ayon sa naunang talata.
    reason: referent_clarification
  - marker: b
    text: Mas literal, “ayon sa aking puso.” Tradisyonal ding isinasalin na “isang lalaking ayon sa sariling puso ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστήσας αὐτόν
  choice: matapos niyang alisin si Saul
  rationale: Ang μεθίστημι ay tumutukoy rito sa pag-aalis kay Saul sa pagiging hari. Nilinaw ang tinutukoy ng panghalip bilang “Saul” upang maging natural at madaling maunawaan sa Tagalog.
- source_word: ἤγειρεν
  choice: itinalaga niya
  rationale: Sa konteksto, ang ἐγείρω ay nangangahulugang nagbangon o nagharap ng isang pinuno. Mas malinaw sa karaniwang Tagalog ang “itinalaga” at iniiwasan nito ang maling pagkaunawang muling pagkabuhay ang tinutukoy.
- source_word: αὐτοῖς εἰς βασιλέα
  choice: bilang hari para sa kanila
  rationale: Pinananatili ng “para sa kanila” ang datibong diwa ng kapakinabangan, habang natural na ipinapahayag ng “bilang hari” ang tungkuling ibinigay kay David.
- source_word: ᾧ καὶ εἶπεν μαρτυρήσας
  choice: Nagpatotoo rin siya tungkol kay David at sinabi
  rationale: Bagaman datibo ang panghalip na ᾧ, ang patotoo ay semantikong tungkol kay David. Ang tahasang pangalan ay mas malinaw at natural kaysa sa isang malabong panghalip.
- source_word: Εὗρον
  choice: Natagpuan ko
  rationale: Ang payak na aspektong naganap sa Tagalog ay natural na naghahatid ng aorist na θεϊκή pahayag nang hindi dinaragdagan ang kahulugan.
- source_word: τὸν τοῦ Ἰεσσαί
  choice: na anak ni Jesse
  rationale: Ito ang likas na Tagalog para sa eliptikong pariralang Griyego na nangangahulugang “ang anak ni Jesse.”
- source_word: ἄνδρα κατὰ τὴν καρδίαν μου
  choice: isang lalaking naaayon sa aking puso
  rationale: Ang “naaayon sa aking puso” ay malapit sa κατά + accusative at hindi agad nililimitahan ang diwa sa emosyonal na pagkagiliw lamang.
- source_word: ὃς ποιήσει πάντα τὰ θελήματά μου
  choice: na gagawa ng lahat ng aking mga kalooban
  rationale: Pinananatili ang hinaharap na ποιήσει at ang tunay na maramihang θελήματα, na tumutukoy sa iba't ibang layunin o ninanais ng Diyos.
theological_decisions:
- issue: Paglalarawan kay David bilang κατὰ τὴν καρδίαν μου
  choice: naaayon sa aking puso
  alternative: kalugud-lugod sa aking puso / ayon sa nais ng aking puso
  rationale: Pinananatili ng napiling anyo ang metaporang “puso” at ang pagiging bukás nito sa diwa ng pagkakatugma sa layunin ng Diyos, sa halip na ipakahulugan lamang bilang damdamin o ganap na moral na pagkakatulad.
- issue: Kahulugan ng ἤγειρεν sa konteksto ng paghahari
  choice: itinalaga niya si David bilang hari
  alternative: ibinangon niya si David bilang hari
  rationale: Ipinakikita ng konteksto na ang pagbangon ay paglalagay o paghaharap kay David bilang hari, hindi muling pagkabuhay. Ang “itinalaga” ang pinakamalinaw na kasalukuyang Tagalog.
- issue: Maramihang θελήματά
  choice: lahat ng aking mga kalooban
  alternative: buong kalooban ko
  rationale: Ang pangngalan sa Griyego ay maramihan. Pinananatili ng salin ang iba't ibang layunin o ipinagagawa ng Diyos sa halip na pakinisin ito bilang isang kolektibong isahan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang malinaw na “itinalaga” para sa kontekstuwal na kahulugan ng ἤγειρεν, habang pinanatili sa pangunahing teksto ang metapora ng puso at ang maramihang anyo ng “mga kalooban.”
