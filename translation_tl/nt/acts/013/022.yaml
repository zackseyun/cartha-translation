revisions:
- from: At matapos niyang alisin si Saul[a], itinalaga niya si David bilang hari para sa kanila. Nagpatotoo rin siya tungkol kay David at sinabi, “Natagpuan ko si David na anak ni Jesse, isang lalaking naaayon sa aking puso[b], na gagawa ng lahat ng aking mga kalooban.”
  to: At matapos niyang alisin si Saul[a], itinalaga niya si David bilang hari para sa kanila. Nagpatotoo rin siya tungkol kay David at sinabi, “Natagpuan ko si David na anak ni Jesse, isang lalaking ayon sa aking puso[b], na gagawa ng lahat ng aking mga nais.”
  rationale: Ginawang mas likas ang dalawang parirala nang hindi binabago ang kahulugan. Ang “mga nais” ay tapat sa maramihang θελήματα, at ang “ayon sa aking puso” ay mas idiomatikong salin ng κατὰ τὴν καρδίαν μου. Iningatan ang paliwanag sa panghalip na tumutukoy kay Saul at inayos ang talang-paanan upang tumugma sa angkla nito.
