  text: ⸀Αὐτοὶ μὲν οὖν ἐκπεμφθέντες ὑπὸ τοῦ ⸂ἁγίου πνεύματος⸃ κατῆλθον ⸀εἰς Σελεύκειαν, ἐκεῖθέν ⸀τε ἀπέπλευσαν ⸁εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/004.yaml
  text: So they[a], having been sent out by the Holy Spirit, went down to Seleucia, and from there sailed away to Cyprus.
translation:
  language: tl
  text: Kaya sila, na isinugo ng Banal na Espiritu[a], ay bumaba sa Seleucia, at mula roon ay naglayag patungong Cyprus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “banal na Espiritu.” Sa Griyego, walang pantukoy ang parirala; ngunit sa Mga Gawa, tumutukoy ito sa personal na banal na ahente na karaniwang tinatawag na “Banal na Espiritu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: sila
  rationale: Tahasang panghalip ito na may bahagyang diin; sapat na naipapahayag ng “sila” sa natural na salaysay sa Tagalog.
- source_word: μὲν οὖν
  choice: Kaya
  rationale: Ipinahihiwatig ng parirala ang pagpapatuloy ng salaysay at bunga ng naunang pagsusugo; natural itong naihahatid ng “Kaya.”
- source_word: ἐκπεμφθέντες
  choice: na isinugo
  rationale: Pinananatili nito ang balintiyak na tinig at ipinakikitang nauna ang pagsusugo sa paglalakbay, nang hindi nagiging mabigat ang pangungusap.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: ng Banal na Espiritu
  rationale: Ang ὑπό na may genitive ay nagpapahayag ng gumaganap; sa balintiyak na Tagalog, natural ang “isinugo ng.” Ang parirala sa Mga Gawa ay tumutukoy sa personal at banal na tagapagpasugo.
- source_word: κατῆλθον
  choice: bumaba
  rationale: Pinananatili ang kongkretong diwa ng pagbaba, malamang patungo sa baybaying daungan.
- source_word: εἰς Σελεύκειαν
  choice: sa Seleucia
  rationale: Karaniwang Tagalog ang “sa” para sa patutunguhang lungsod; pinanatili ang kinikilalang anyo ng pangalan.
- source_word: ἐκεῖθεν
  choice: mula roon
  rationale: Tuwirang at natural na katumbas para sa pinanggalingang lugar.
- source_word: τε
  choice: at
  rationale: Maayos na nag-uugnay sa kasunod na kilos sa nauna.
- source_word: ἀπέπλευσαν
  choice: naglayag
  rationale: Malinaw nang ipinakikita ng “mula roon” ang pag-alis, kaya natural at hindi paulit-ulit ang “naglayag.”
- source_word: εἰς Κύπρον
  choice: patungong Cyprus
  rationale: Malinaw na ipinapahayag ang destinasyon; ginagamit ang karaniwang modernong anyo ng pangalan sa Filipino.
theological_decisions:
- issue: Pagkakasalin ng ἁγίου πνεύματος
  choice: Banal na Espiritu
  alternative: banal na espiritu
  rationale: Sa konteksto ng Mga Gawa, ang Espiritu ang personal na banal na tagapagpasugo. Pinananatili ng malaking titik ang kinikilalang pantanging katawagan nang hindi nagdaragdag ng paliwanag sa mismong talata.
translation_notes:
  register: Makabagong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang bahagyang diin ng tahasang “sila,” ang balintiyak na pagsusugo, at ang kongkretong kilos na “bumaba.”
