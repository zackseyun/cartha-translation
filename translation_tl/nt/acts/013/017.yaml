  text: ὁ θεὸς τοῦ λαοῦ τούτου ⸀Ἰσραὴλ ἐξελέξατο τοὺς πατέρας ἡμῶν, καὶ τὸν λαὸν ὕψωσεν ἐν τῇ παροικίᾳ ἐν γῇ ⸀Αἰγύπτου, καὶ μετὰ βραχίονος ὑψηλοῦ ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/017.yaml
  text: The God of this people Israel chose our fathers[a], and made the people great during their sojourn in the land of Egypt[d][c][b], and with an uplifted arm he led them out from it.
translation:
  language: tl
  text: Ang Diyos ng bayang ito, ang Israel, ay pumili sa ating mga ninuno[a]. Pinalago[b] niya ang bayan habang naninirahan sila bilang mga dayuhan sa lupain ng Ehipto, at inilabas niya sila mula roon sa pamamagitan ng nakataas na bisig[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ating mga ama.”
    reason: lexical_alternative
  - marker: b
    text: Ang “pinalago” ay maaari ring isaling “itinaas” o “pinarami.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “may mataas na bisig”; isang paglalarawan mula sa salaysay ng Exodo tungkol sa makapangyarihang pagliligtas ng Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ θεὸς τοῦ λαοῦ τούτου Ἰσραήλ
  choice: ang Diyos ng bayang ito, ang Israel
  rationale: Pinananatili ang appositional na pagkakaugnay ng ‘bayang ito’ at ‘Israel’ habang nagiging natural ang ayos sa Filipino.
- source_word: ἐξελέξατο
  choice: pinili
  rationale: Tuwirang katumbas na natural sa Filipino; hindi kailangang tahasang ipahayag ang middle voice.
- source_word: τοὺς πατέρας ἡμῶν
  choice: ang ating mga ninuno
  rationale: Sa kontekstong pangkasaysayan, malinaw at likas na tumutukoy sa mga naunang salinlahi ng Israel; itinatala sa talababa ang literal na ‘mga ama.’
- source_word: ὕψωσεν
  choice: pinalago
  rationale: Pinananatili ang posibleng diwa ng pagdami at pag-unlad nang hindi ito nililimitahan sa bilang lamang o sa pagtaas ng katayuan lamang.
- source_word: ἐν τῇ παροικίᾳ ἐν γῇ Αἰγύπτου
  choice: habang naninirahan sila bilang mga dayuhan sa lupain ng Ehipto
  rationale: Hayagang ipinapakita ang diwa ng paninirahan sa ibang lupain na taglay ng παροικία at pinananatili ang ‘lupain ng Ehipto.’
- source_word: μετὰ βραχίονος ὑψηλοῦ
  choice: sa pamamagitan ng nakataas na bisig
  rationale: Pinananatili ang metapora at alusyon sa Exodo sa halip na palitan agad ng interpretatibong ‘makapangyarihang kamay.’
- source_word: ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς
  choice: inilabas niya sila mula roon
  rationale: Natural na Filipino para sa kilos ng paglalabas mula sa Ehipto; ang ‘roon’ ay malinaw na bumabalik sa Ehipto.
theological_decisions:
- issue: Paglalarawan sa mga προγονong Israelita sa τοὺς πατέρας ἡμῶν
  choice: ating mga ninuno
  alternative: ating mga ama
  rationale: Ang ‘mga ninuno’ ay natural sa modernong Filipino para sa pangkasaysayang kolektibong tinutukoy, habang pinananatili sa talababa ang literal na anyo ng Griyego.
- issue: Saklaw ng kahulugan ng ὕψωσεν
  choice: pinalago
  alternative: itinaas / pinarami
  rationale: Maaaring tumukoy ang pandiwa sa pagpaparangal, pagpapalakas, o pagpaparami. Ang ‘pinalago’ ay sadyang malawak at hindi tahimik na nagpapasya sa iisang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘bayan’ para sa λαός, ‘Ehipto’ bilang karaniwang biblikal na anyo, at pinanatili ang metapora ng bisig upang mapangalagaan ang ugnay sa Exodo.
