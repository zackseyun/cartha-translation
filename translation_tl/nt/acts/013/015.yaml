  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μετὰ δὲ τὴν ἀνάγνωσιν τοῦ νόμου καὶ τῶν προφητῶν ἀπέστειλαν οἱ ἀρχισυνάγωγοι πρὸς αὐτοὺς λέγοντες· Ἄνδρες ἀδελφοί, εἴ ⸀τίς ἐστιν ⸂ἐν ὑμῖν λόγος⸃ παρακλήσεως πρὸς τὸν λαόν, λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/015.yaml
  text: After the reading of the Law and the Prophets[a], the synagogue rulers sent word to them, saying, “Brothers, if there is among you any word of encouragement for the people[b], speak.”
translation:
  language: tl
  text: 'Pagkatapos ng pagbasa ng Kautusan at ng mga Propeta, nagpadala ng mensahe sa kanila ang mga tagapamahala ng sinagoga: “Mga kapatid,[a] kung may sinuman sa inyo na may mensaheng pampalakas-loob[b] para sa mga tao, magsalita kayo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “Mga lalaking kapatid,” isang magalang at pampamilyang paraan ng pagtawag.
    reason: lexical_alternative
  - marker: b
    text: O “mensaheng nagpapayo” o “mensaheng humihimok.” Maaaring saklawin ng pariralang Griyego ang pagpapalakas-loob at ang pagpapayo o paghimok.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγνωσιν
  choice: basahin
  rationale: Tumutukoy sa pagbasa ng Kasulatan sa pagtitipon sa sinagoga; likas sa Filipino ang pandiwang pariralang “pagkatapos basahin.”
- source_word: τοῦ νόμου καὶ τῶν προφητῶν
  choice: ang Kautusan at ang mga Propeta
  rationale: Pinananatili ang dalawang kinikilalang bahagi ng Kasulatan sa konteksto ng sinagoga.
- source_word: ἀπέστειλαν
  choice: nagpasabi
  rationale: Ipinahihiwatig ng kasunod na tuwirang pananalita na nagpadala sila ng mensahe, hindi na sila mismo ang pisikal na ipinadala.
- source_word: οἱ ἀρχισυνάγωγοι
  choice: ang mga tagapamahala ng sinagoga
  rationale: Malinaw na tumutukoy sa mga namamahala sa gawain ng sinagoga at hindi sa mga pinunong sibil.
- source_word: Ἄνδρες ἀδελφοί
  choice: Mga kapatid
  rationale: Likas at magalang na tawag sa Filipino; inilalahad sa talababa ang tahasang panlalaking anyo ng Griyego.
- source_word: εἴ τίς ἐστιν ἐν ὑμῖν
  choice: kung mayroon kayong
  rationale: Natural na Filipino para sa medyo impersonal na Griyegong “kung mayroong nasa gitna ninyo,” nang hindi binabago ang diwa.
- source_word: λόγος παρακλήσεως
  choice: mensaheng pampalakas-loob
  rationale: Ang παράκλησις ay maaaring tumukoy sa pagpapalakas-loob o pagpapayo/paghimok; natural ang pangunahing salin at pinananatili sa talababa ang saklaw ng kahulugan.
- source_word: πρὸς τὸν λαόν
  choice: para sa mga tao
  rationale: Ipinakikita ang mga tao bilang nilalayong tagapakinig ng mensahe.
- source_word: λέγετε
  choice: magsalita kayo
  rationale: Tuwirang paanyaya sa mga kasama ni Pablo na magsalita sa kapulungan; ang maramihang “kayo” ay tumutugma sa anyong Griyego.
theological_decisions:
- issue: Panlalaking tawag sa konteksto ng sinagoga
  choice: Mga kapatid[a]
  alternative: Mga kapatid na lalaki
  rationale: Ang Ἄνδρες ἀδελφοί ay tahasang panlalaki at tumutukoy sa mga lalaking panauhing inaanyayahang magsalita. Ginamit sa teksto ang likas na Filipino na “Mga kapatid,” habang nililinaw sa talababa ang panlalaking anyo upang hindi ito gawing tahasang pangkalahatan.
- issue: Saklaw ng kahulugan ng παράκλησις
  choice: mensaheng pampalakas-loob[b]
  alternative: mensaheng nagpapayo o humihimok
  rationale: Maaaring magpahiwatig ang salita kapuwa ng pagpapalakas-loob at mas mariing pagpapayo o paghimok. Hindi nilutas nang tahimik ang ambiguwidad; inilagay ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sinagoga” bilang karaniwang terminong biblikal at ang “tagapamahala” upang maiwasan ang maling pahiwatig ng kapangyarihang sibil. Inilagay ang mga talababa sa mismong mga pariralang nililinaw ng mga ito.
