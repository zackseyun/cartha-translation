revisions:
- from: 'Pagkatapos basahin ang Kautusan at ang mga Propeta, nagpasabi sa kanila ang mga tagapamahala ng sinagoga: “Mga kapatid,[a] kung mayroon kayong mensaheng pampalakas-loob[b] para sa mga tao, magsalita kayo.”'
  to: 'Pagkatapos ng pagbasa ng Kautusan at ng mga Propeta, nagpadala ng mensahe sa kanila ang mga tagapamahala ng sinagoga: “Mga kapatid,[a] kung may sinuman sa inyo na may mensaheng pampalakas-loob[b] para sa mga tao, magsalita kayo.”'
  rationale: 'Inayos ang dalawang parirala upang maging mas malinaw at mas malapit sa Griyego: ginawang pangngalan ang “pagbasa” para sa ἀνάγνωσιν, at ginawang “kung may sinuman sa inyo na may” upang mapanatili ang bukas at indefinitong paanyaya. Pinalitan din ang “nagpasabi” ng mas tuwirang “nagpadala ng mensahe.” Pinanatili ang lahat ng pangunahing termino, antas ng wika, ambiguwidad ng παράκλησις sa talababa, at wastong mga anchor ng talababa.'
