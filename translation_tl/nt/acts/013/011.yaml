  to: At ngayon, narito, ang kamay ng Panginoon ay nakaatang sa iyo. Mabubulag ka, na hindi makakakita ng araw sa loob ng ilang panahon. Agad na dumapo sa kanya ang isang manipis na ulap-singaw at kadiliman, at nagpalakad-lakad siya habang naghahanap ng mga taong aakay sa kanya sa pamamagitan ng kamay.
  rationale: Inayos ang ilang parirala upang masundan ang Griyego nang mas malapit habang nananatiling likas ang modernong Filipino Tagalog. Hindi pinalitan ang biblikal na talinghaga ng kamay ng Panginoon ng isang doktrinal o tahasang paliwanag ng paghatol. Nananatiling hindi tiyak ang tagal ng pagkabulag, at hindi idinagdag ang “nangangapa” sa περιάγων.
