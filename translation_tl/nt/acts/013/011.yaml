  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ χεὶρ κυρίου ἐπὶ σέ, καὶ ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον ἄχρι καιροῦ. παραχρῆμα ⸀δὲ ⸀ἔπεσεν ἐπ’ αὐτὸν ἀχλὺς καὶ σκότος, καὶ περιάγων ἐζήτει χειραγωγούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/011.yaml
  text: And now[a], behold, the hand of the Lord is upon you, and you will be blind, not seeing the sun for a time. Immediately a mist and darkness fell upon him, and going about[c][b], he was seeking people to lead him by the hand.
translation:
  language: tl
  text: At ngayon, narito, ang kamay ng Panginoon ay nakaatang sa iyo. Mabubulag ka, na hindi makakakita ng araw sa loob ng ilang panahon. Agad na dumapo sa kanya ang isang manipis na ulap-singaw at kadiliman, at nagpalakad-lakad siya habang naghahanap ng mga taong aakay sa kanya sa pamamagitan ng kamay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: narito
  rationale: Isang likas ngunit marangal na panawag-pansin sa modernong Tagalog; pinananatili ang deiktikong diin nang hindi gumagamit ng lipas na pananalita.
- source_word: χεὶρ κυρίου ἐπὶ σέ
  choice: ang kamay ng Panginoon ay laban sa iyo
  rationale: Pinananatili ang biblikal na talinghagang 'kamay ng Panginoon'; ang 'laban sa iyo' ay naghahayag ng mapanghatol na puwersa ng ἐπὶ σέ sa konteksto nang hindi pinapalis ang talinghaga.
- source_word: ἔσῃ τυφλὸς
  choice: Mabubulag ka
  rationale: Likas na Tagalog para sa pagpasok ng kalagayang pagkabulag na ipinahihiwatig ng konteksto.
- source_word: μὴ βλέπων τὸν ἥλιον
  choice: hindi mo makikita ang araw
  rationale: Pinananatili ang tahasang pagbanggit sa araw at ang diwa ng participial na paglalarawan.
- source_word: ἄχρι καιροῦ
  choice: sa loob ng ilang panahon
  rationale: Naghahayag ng pansamantala ngunit hindi tiyak na haba ng panahon; hindi nito ipinapalagay ang isang takdang petsa.
- source_word: παραχρῆμα
  choice: Agad
  rationale: Malinaw at likas na naghahatid ng biglaang pangyayari.
- source_word: ἀχλὺς καὶ σκότος
  choice: malabong ulap at kadiliman
  rationale: Ang 'malabong ulap' ay naghahatid ng panlalabo o tila ulap sa paningin, samantalang pinananatili ng 'kadiliman' ang kongkreto at mabigat na lakas ng σκότος.
- source_word: ἔπεσεν ἐπ’ αὐτὸν
  choice: siyang binalot ng
  rationale: Likas na Tagalog para sa pagdating sa kanya ng panlalabo at kadiliman; inilalarawan ang epekto nang hindi tinutukoy ang pisikal na pagbagsak.
- source_word: περιάγων
  choice: nagpalakad-lakad siya
  rationale: Pinananatili ang ideya ng pag-ikot o pagpaparoo't parito; iniiwasang idagdag ang mas interpretatibong 'nangangapa.'
- source_word: ἐζήτει χειραγωγούς
  choice: naghahanap ng mga taong aakay sa kanya sa kamay
  rationale: Pinananatili ang tiyak at kongkretong diwa ng χειραγωγός bilang mga taong umaakay sa isang tao sa pamamagitan ng kamay.
theological_decisions:
- issue: Diwa ng 'kamay ng Panginoon'
  choice: Pinanatili ang talinghagang 'kamay ng Panginoon' at isinaling 'laban sa iyo' ang ugnayan nito sa taong hinahatulan.
  alternative: Ang Panginoon ay magpaparusa sa iyo / sasaktan ka ng Panginoon
  rationale: Malinaw sa konteksto ang banal na paghatol, ngunit hindi dapat palitan ng salin ang biblikal na larawan ng isang tuwirang paliwanag.
- issue: Pansamantalang tagal ng pagkabulag
  choice: sa loob ng ilang panahon
  alternative: hanggang sa takdang panahon
  rationale: Maaaring ipakahulugan ang ἄχρι καιροῦ bilang hanggang sa isang panahon o sa loob ng isang panahon. Ang pinili ay likas sa Tagalog at pinananatiling hindi tiyak ang tagal nang hindi ipinapalagay na may hayag na takdang petsa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang biblikal na idyomang 'kamay ng Panginoon,' iniwasan ang denominasyonal na pagpapaliwanag, at hindi ginawang 'nangangapa' ang περιάγων upang huwag dagdagan ang tahasang sinasabi ng Griyego.
