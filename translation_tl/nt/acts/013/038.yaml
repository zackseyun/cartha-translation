  text: γνωστὸν οὖν ἔστω ὑμῖν, ἄνδρες ἀδελφοί, ὅτι διὰ τούτου ὑμῖν ἄφεσις ἁμαρτιῶν καταγγέλλεται, καὶ ἀπὸ πάντων ὧν οὐκ ἠδυνήθητε ⸀ἐν νόμῳ Μωϋσέως δικαιωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/038.yaml
  text: Therefore let it be known to you[a], brothers, that through this one forgiveness of sins is proclaimed to you, and from all the things from which you could not be justified by the law of Moses[c][b], everyone who believes is justified.
translation:
  language: tl
  text: Kaya dapat ninyong malaman, mga kapatid[a], na sa pamamagitan niya[b] ay ipinahahayag sa inyo ang kapatawaran ng mga kasalanan, at mula sa lahat ng bagay na hindi kayo maaaring ariing matuwid[c] sa pamamagitan ng Kautusan ni Moises—[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Panlalaki ang anyo ng tawag sa Griyego; maaaring saklawin ng likas na tawag na “mga kapatid” ang buong kapulungang kinakausap.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, sa pamamagitan ni Jesus, na kababanggit lamang.
    reason: cross_reference
  - marker: c
    text: O “mapawalang-sala” o “ipahayag na matuwid.”
    reason: lexical_alternative
  - marker: d
    text: Nagpapatuloy sa talata 39 ang pangungusap na nagsisimula rito.
    reason: textual_structure
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: Kaya dapat ninyong malaman
  rationale: Likas na modernong Tagalog para sa pautos na pahayag; pinananatili ng “Kaya” ang pangangatwirang ipinahihiwatig ng οὖν.
- source_word: ἄνδρες ἀδελφοί
  choice: mga kapatid
  rationale: Ito ang likas at marangal na tawag sa Tagalog. Hindi minamarkahan ng salitang “kapatid” ang kasarian, kaya inilalagay sa talababa ang panlalaking anyo ng Griyego.
- source_word: διὰ τούτου
  choice: sa pamamagitan niya
  rationale: Ang panlalaking panghalip na pamatlig ay tumutukoy kay Jesus na kababanggit lamang. Iniiwasan nitong idagdag ang salitang “tao,” na wala sa Griyego.
- source_word: ἄφεσις ἁμαρτιῶν
  choice: kapatawaran ng mga kasalanan
  rationale: Malinaw, karaniwan, at tumpak na katumbas sa kontekstong ito.
- source_word: καταγγέλλεται
  choice: ipinahahayag
  rationale: Ipinakikita ang kasalukuyang pasibong kilos at ang hayagang pagpapahayag ng mensahe.
- source_word: ἀπὸ πάντων ὧν
  choice: mula sa lahat ng bagay na
  rationale: Pinananatili ang kaugnayan ng ἀπό sa kasunod na sugnay at ang pagpapatuloy nito sa susunod na talata.
- source_word: οὐκ ἠδυνήθητε
  choice: hindi kayo maaaring
  rationale: Direkta at likas na pagpapahayag ng kawalan ng kakayahan sa konteksto.
- source_word: ἐν νόμῳ Μωϋσέως
  choice: sa pamamagitan ng Kautusan ni Moises
  rationale: Ipinahahayag ang instrumental na diwa ng ἐν kaugnay ng δικαιωθῆναι, habang pinananatili ang malinaw na pagtukoy sa Kautusan ni Moises.
- source_word: δικαιωθῆναι
  choice: ariing matuwid
  rationale: Pinananatili ang legal at teolohikal na bigat ng pandiwa nang hindi ito ginagawang moral na pagbabago lamang.
theological_decisions:
- issue: Kahulugan ng δικαιωθῆναι kaugnay ng Kautusan ni Moises
  choice: ariing matuwid
  alternative: mapawalang-sala; ipahayag na matuwid
  rationale: Ang “ariing matuwid” ay nagpapanatili sa forensiko at teolohikal na lawak ng termino. Ang “mapawalang-sala” ay mas makitid, samantalang ang “ipahayag na matuwid” ay mas lantad ngunit hindi gaanong likas sa pangungusap.
- issue: Kasarian sa tawag na ἄνδρες ἀδελφοί
  choice: mga kapatid
  alternative: mga kapatid na lalaki
  rationale: Ang “mga kapatid” ang likas na tawag sa Tagalog at hindi likas na tahasang minamarkahan ang kasarian. Itinatala sa talababa na panlalaki ang anyo sa Griyego upang hindi maitago ang anyong pinagmulan.
- issue: Hangganan ng talata at pagpapatuloy ng pangungusap
  choice: Panatilihin ang bitin na sugnay at gumamit ng gatlang
  alternative: Idagdag ang “ang bawat sumasampalataya ay inaaring matuwid” mula sa talata 39
  rationale: Nagtatapos ang ibinigay na tekstong Griyego sa infinitive na δικαιωθῆναι at nagpapatuloy ang pangungusap sa talata 39. Hindi idinaragdag sa talata 38 ang mga salitang wala sa ibinigay na source, ngunit ipinakikita ng gatlang ang tunay na sintaktikong pagpapatuloy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Kautusan” bilang nakaugaliang katawagan sa Torah/Mosaic law at ang “ariing matuwid” upang mapanatili ang legal-teolohikal na diwa. Hindi isinama sa talata 38 ang sugnay mula sa talata 39 na idinagdag sa English consultation layer.
