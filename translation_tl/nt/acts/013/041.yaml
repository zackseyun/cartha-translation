    issue: Ang "kahit may maglahad nito sa inyo" ay nagiging konsesibo.
    rationale: 'Ang ἐάν τις ἐκδιηγῆται ὑμῖν ay kondisyunal: "kung may magsasalaysay/maglalahad nito sa inyo." Hindi dapat palitan ng "kahit" ang ugnayang ito.'
  - severity: low
    issue: Hindi likas ang "may ginagawa akong isang gawa."
    rationale: Bagaman nauunawaan, mabigat ang konstruksiyon sa makabagong Filipino. Ang "ako ay gumagawa ng isang gawa" ay nagpapanatili ng tahasang ἐγώ at ng kasalukuyang aspekto nang mas malinaw.
  - severity: low
    issue: Ang "sa panahon ninyo" ay mas maluwag kaysa sa temporal na larawan ng teksto.
    rationale: Ang "sa mga araw ninyo" ay likas pa rin sa Filipino at mas malapit sa ἐν ταῖς ἡμέραις ὑμῶν.
