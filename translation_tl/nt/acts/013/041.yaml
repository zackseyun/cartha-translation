revisions:
- from: “Tingnan ninyo, kayong mga humahamak, mamangha kayo at mapahamak,[a] sapagkat may ginagawa akong isang gawa sa panahon ninyo—isang gawa na hinding-hindi ninyo paniniwalaan kahit may maglahad nito sa inyo.”[b]
  to: “Tingnan ninyo, kayong mga humahamak, mamangha kayo at mapahamak,[a] sapagkat ako ay gumagawa ng isang gawa sa mga araw ninyo—isang gawa na hinding-hindi ninyo paniniwalaan kung may magsasalaysay nito sa inyo.”[b]
  rationale: Inayos ang kondisyunal na sugnay upang tumbasan ang ἐάν, pinalitan ang di-likas na "may ginagawa akong isang gawa" ng mas tuwirang Filipino na may pinanatiling diin sa "ako," at ginawang "sa mga araw ninyo" ang temporal na parirala. Hindi binago ang tindi o saklaw ng babala, at pinanatili ang mga angkop na talababa sa ἀφανίσθητε at ἐκδιηγῆται.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:29:41Z'
