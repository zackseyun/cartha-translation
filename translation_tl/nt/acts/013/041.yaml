  naturalness: May kabigatan at pag-uulit ang "may ginagawa akong isang gawa." Mas natural at malinaw ang "ako ay gumagawa ng isang gawa." Ang "kung may magsasalaysay" ay mas tumpak at natural kaysa "kahit may maglahad."
  terminology: Ang "humahamak," "mamangha," at "mapahamak" ay angkop sa matinding tono ng sipi. Pinananatili ang "gawa" para sa ἔργον at hindi idinaragdag ang "Diyos" sa hayag na "ako."
  issues:
