source:
  edition: SBLGNT
  text: Ἴδετε, οἱ καταφρονηταί, καὶ θαυμάσατε καὶ ἀφανίσθητε, ὅτι ἔργον ⸂ἐργάζομαι ἐγὼ⸃ ἐν ταῖς ἡμέραις ὑμῶν, ⸀ἔργον ὃ οὐ μὴ πιστεύσητε ἐάν τις ἐκδιηγῆται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/041.yaml
  text: Look[a], you scoffers, and marvel, and perish; for I am doing a work in your days[c][b], a work that you will certainly not believe if someone tells it to you.
translation:
  language: tl
  text: “Tingnan ninyo, kayong mga humahamak, mamangha kayo at mapahamak,[a] sapagkat ako ay gumagawa ng isang gawa sa mga araw ninyo—isang gawa na hinding-hindi ninyo paniniwalaan kung may magsasalaysay nito sa inyo.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maglaho” o “malipol.” Ang salita sa siping ito mula sa Habakuk 1:5 sa Griyego ay may matinding babala ng pagkawasak o kapahamakan.
    reason: lexical_alternative
  - marker: b
    text: Ang “magsasalaysay” ay maaari ring mangahulugang “maglahad nang buo” o “magkuwento nang detalyado.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴδετε
  choice: Tingnan ninyo
  rationale: Tuwirang pautos na tumatawag ng pansin; natural sa makabagong Filipino at pinananatili ang lakas ng panawagan.
- source_word: οἱ καταφρονηταί
  choice: kayong mga humahamak
  rationale: Ipinahahayag ang mapanghamak na pagtanggi nang hindi nililimitahan ang salita sa pasalitang panunuya lamang.
- source_word: θαυμάσατε
  choice: mamangha kayo
  rationale: Pinananatili ang pautos at ang matinding pagkabigla sa siping propetiko.
- source_word: ἀφανίσθητε
  choice: mapahamak
  rationale: Natural na Filipino para sa pagdating sa kapahamakan, habang pinananatili ang mariing babala ng konteksto.
- source_word: ἔργον
  choice: gawa
  rationale: Malawak at tuwirang katumbas na tumutukoy sa makabuluhang pagkilos ng Diyos.
- source_word: ἐργάζομαι ἐγώ
  choice: may ginagawa akong
  rationale: Pinananatili ang kasalukuyang pagkilos at ang diin ng hayag na panghalip na ἐγώ.
- source_word: ἐν ταῖς ἡμέραις ὑμῶν
  choice: sa panahon ninyo
  rationale: Likas na Filipino na nagpapanatili sa temporal na lapit ng pahayag sa mga tagapakinig.
- source_word: οὐ μὴ πιστεύσητε
  choice: hinding-hindi ninyo paniniwalaan
  rationale: Ipinahahayag ang mariing pagtanggi na dala ng dobleng negasyong οὐ μή.
- source_word: ἐάν τις ἐκδιηγῆται ὑμῖν
  choice: kahit may maglahad nito sa inyo
  rationale: Ang 'maglahad' ay masaklaw sa pagsasalaysay o pagpapaliwanag nang buo; ang 'nito' ay tumutukoy sa gawa.
theological_decisions:
- issue: Tindi ng propetikong babala sa sipi mula sa Habakuk
  choice: mapahamak
  alternative: maglaho / malipol
  rationale: Pinananatili ng 'mapahamak' ang pahiwatig ng paghatol at pagkawasak nang hindi tinutukoy nang higit sa saklaw ng salitang Griyego ang eksaktong anyo ng kahihinatnan.
- issue: Pagkakakilanlan ng gumagawa sa ἐργάζομαι ἐγώ
  choice: Panatilihin ang unang panauhan nang hindi idinaragdag ang pangalang 'Diyos' sa pangunahing teksto
  alternative: sapagkat ang Diyos ay gumagawa
  rationale: Malinaw sa propetikong sipi na Diyos ang nagsasalita, ngunit ang orihinal na teksto ay gumagamit ng mariing 'ako'; ang salin ay hindi dapat magdagdag ng tahasang pangngalan.
translation_notes:
  register: Makabago, marangal, at tuwirang Filipino. Pinanatili ang anyong propetiko at ang seryosong tono ng babala; iniwasan ang arkaikong 'masdan' at ang sobrang paliwanag sa pangunahing teksto.
