  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ Ἰουδαῖοι παρώτρυναν τὰς σεβομένας ⸀γυναῖκας τὰς εὐσχήμονας καὶ τοὺς πρώτους τῆς πόλεως καὶ ἐπήγειραν διωγμὸν ἐπὶ τὸν Παῦλον ⸀καὶ Βαρναβᾶν, καὶ ἐξέβαλον αὐτοὺς ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/050.yaml
  text: But the Jews stirred up the devout women of high standing and the leading men of the city[b][a], and stirred up persecution against Paul and Barnabas and drove them out of their district.
translation:
  language: tl
  text: Ngunit inudyukan ng mga Judio ang mga debotong babaeng may mataas na katayuan[a] at ang mga nangungunang lalaki sa lungsod. Nagpasiklab sila ng pag-uusig laban kina Pablo at Bernabe at pinalayas ang dalawa mula sa kanilang nasasakupan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga babaeng may takot sa Diyos.” Maaaring tumukoy ang anyong Griyego sa mga babaeng sumasamba sa Diyos ng Israel, posibleng mga Hentil na nauugnay sa sinagoga.
    reason: lexical_alternative
  - marker: b
    text: O “mula sa kanilang rehiyon” o “mula sa kanilang mga hangganan.” Ang salitang Griyego ay maaaring tumukoy sa mga hangganan o sa teritoryong saklaw ng mga iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρώτρυναν
  choice: inudyukan
  rationale: Ipinapakita ang aktibong pag-uudyok sa mga babae at sa mga nangungunang lalaki, nang hindi ginagawang labis na kolokyal ang tono.
- source_word: σεβομένας γυναῖκας
  choice: mga debotong babae
  rationale: Pinananatili ang diwa ng taimtim na pagsamba nang hindi tiyak na ipinapasok sa pangunahing teksto ang teknikal na pagkakakilanlang ‘may takot sa Diyos.’
- source_word: εὐσχήμονας
  choice: may mataas na katayuan
  rationale: Sinasaklaw ang panlipunang katanyagan at kagalang-galang na kalagayan ng mga babae.
- source_word: τοὺς πρώτους τῆς πόλεως
  choice: mga nangungunang lalaki sa lungsod
  rationale: Likas na ipinahahayag ang mataas nilang ranggo sa lungsod at pinananatili ang tahasang panlalaking reperensiya ng Griyego.
- source_word: ἐπήγειραν διωγμὸν
  choice: nagpasiklab sila ng pag-uusig
  rationale: Malinaw na ipinahahayag na sila ang naging sanhi ng pagsiklab ng pag-uusig; natural din ito sa modernong Filipino.
- source_word: ἐπὶ τὸν Παῦλον καὶ Βαρναβᾶν
  choice: laban kina Pablo at Bernabe
  rationale: Ipinakikita ang tuwirang pagkapoot at ang mga taong pinuntirya ng pag-uusig.
- source_word: ἐξέβαλον αὐτοὺς
  choice: pinalayas ang dalawa
  rationale: Pinananatili ang sapilitang diwa ng pandiwa at nililinaw sa natural na Filipino na sina Pablo at Bernabe ang pinalayas.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: mula sa kanilang nasasakupan
  rationale: Ang ‘nasasakupan’ ay angkop sa kontekstong panlungsod at maaaring tumukoy sa teritoryong nasa loob ng mga hangganan, habang inilalahad sa talababa ang ibang posibleng pagbasa.
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Ngunit ... ang mga Judio
  rationale: Ipinahahayag ng ‘Ngunit’ ang salungat na pagbabago sa takbo ng salaysay mula sa naunang talata.
theological_decisions:
- issue: Paglalarawan sa σεβομένας γυναῖκας
  choice: mga debotong babae
  alternative: mga babaeng may takot sa Diyos
  rationale: Maaaring tumukoy ang parirala sa mga Hentil na nauugnay sa sinagoga at sumasamba sa Diyos ng Israel, ngunit hindi ito dapat gawing tiyak sa pangunahing teksto; pinananatili sa talababa ang posibleng teknikal na kahulugan.
- issue: Panlalaking katawagan sa τοὺς πρώτους τῆς πόλεως
  choice: mga nangungunang lalaki sa lungsod
  alternative: mga pinuno ng lungsod
  rationale: Tahasang panlalaki ang pariralang Griyego, kaya pinananatili iyon sa salin sa halip na gawing walang kasarian.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang ‘debotong’ at ‘may mataas na katayuan’ upang maging madaling maunawaan nang hindi binubura ang panrelihiyon at panlipunang mga pahiwatig. Inilagay ang bawat tanda ng talababa kaagad pagkatapos ng pariralang tinutukoy nito.
