  text: Ἀναχθέντες δὲ ἀπὸ τῆς Πάφου οἱ ⸀περὶ Παῦλον ἦλθον εἰς Πέργην τῆς Παμφυλίας· Ἰωάννης δὲ ἀποχωρήσας ἀπ’ αὐτῶν ὑπέστρεψεν εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/013.yaml
  text: After setting sail from Paphos[a], those with Paul came to Perga in Pamphylia; but John, departing from them[b], returned to Jerusalem.
translation:
  language: tl
  text: Naglayag[a] mula sa Pafos si Pablo at ang kaniyang mga kasama[b], at dumating sila sa Perga sa Panfilia. Ngunit umalis sa kanila si Juan at bumalik sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pumalaot.” Ang pandiwang Griyego ay tumutukoy sa pagsisimula ng paglalakbay-dagat.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang mga nasa paligid ni Pablo”; isang idyomang tumutukoy kay Pablo at sa kaniyang mga kasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: Naglayag
  rationale: Sa konteksto ng paglalakbay-dagat, ang ἀνάγω ay nangangahulugang pumalaot o magsimulang maglayag. Likas at malinaw sa Tagalog ang “naglayag.”
- source_word: οἱ περὶ Παῦλον
  choice: ang mga kasama ni Pablo
  rationale: Ang idyomang οἱ περὶ kasama ang akusatibo ay tumutukoy sa pangkat na nakaugnay sa isang pangunahing tao. Malinaw at natural ang “mga kasama ni Pablo” nang hindi dinaragdagan ang diwa.
- source_word: ἦλθον
  choice: dumating
  rationale: Bagaman maaaring “pumunta” o “dumating” ang ἔρχομαι ayon sa pananaw, ang “dumating” ang pinakanatural sa pagsasalaysay ng destinasyon.
- source_word: Πέργην τῆς Παμφυλίας
  choice: Perga sa Panfilia
  rationale: Tinutukoy ng henitibo ang rehiyong kinaroroonan ng Perga; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “sa.”
- source_word: ἀποχωρήσας ἀπ’ αὐτῶν
  choice: umalis sa kanila
  rationale: Ipinahahayag nito ang pag-alis ni Juan mula sa pangkat nang hindi nagpapahiwatig ng motibo o tahasang paghatol sa ginawa niya.
- source_word: ὑπέστρεψεν
  choice: bumalik
  rationale: Karaniwang kahulugan ng ὑποστρέφω ang pagbabalik; tuwiran at natural ang “bumalik.”
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Ito ang nakasanayang modernong anyo ng pangalan ng lungsod sa Filipino.
theological_decisions:
- issue: Posibleng negatibong pahiwatig ng pag-alis ni Juan
  choice: “umalis sa kanila” bilang neutral na paglalarawan
  alternative: “iniwan sila” o “tumalikod sa kanila”
  rationale: Iniulat lamang ng talata na umalis si Juan at bumalik sa Jerusalem. Hindi nito tahasang sinasabi ang kaniyang motibo o nagbibigay ng moral na hatol, kaya hindi iyon idinagdag sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang malinaw na daloy ng salaysay at ang neutral na paglalarawan sa pag-alis ni Juan. Inilagay ang mga talababa sa mga salitang aktuwal na tinutukoy ng bawat paliwanag.
