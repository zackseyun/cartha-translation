  source_fidelity: Tumpak na naipapahayag ng salin ang pang-ugnay na τε, ang “mga alagad,” at ang nilalaman ng imperfect passive na ἐπληροῦντο. Ang “patuloy na napupuspos” ay isang natural na paraan upang ipakita ang nagpapatuloy o paulit-ulit na pagpupuspos, kahit ang aspektong nakaraan ay pangunahing naibibigay ng konteksto ng salaysay.
  naturalness: Natural at marangal ang modernong Tagalog. Ang “At ang mga alagad” ay katanggap-tanggap na pagpapatuloy ng salaysay, at malinaw ang pares na “ng kagalakan at ng Banal na Espiritu.”
  terminology: Ang “mga alagad,” “kagalakan,” at “Banal na Espiritu” ay matatag, malinaw, at angkop na mga katumbas sa konteksto ng Mga Gawa. Ang kapitalisasyon ng “Banal na Espiritu” ay wastong kumakatawan sa karaniwang personal na pagtukoy ng parirala sa aklat na ito. Ang talababa ay maayos na nagsasaad ng mas literal na posibilidad at ng aspektong imperpekto nang hindi binabago ang pangunahing salin.
