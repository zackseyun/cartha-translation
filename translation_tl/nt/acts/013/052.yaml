  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἵ ⸀τε μαθηταὶ ἐπληροῦντο χαρᾶς καὶ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/052.yaml
  text: And the disciples were filled with joy and the Holy Spirit[a].
translation:
  language: tl
  text: At ang mga alagad ay patuloy na napupuspos ng kagalakan at ng Banal na Espiritu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “napupuspos ng kagalakan at banal na espiritu.” Maaari ring gawing mas payak ang pandiwang Griyego bilang “napuspos,” ngunit ipinahihiwatig ng anyo nito ang nagpapatuloy o paulit-ulit na pagpupuspos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε
  choice: At ang
  rationale: Iniuugnay ng τε ang pangungusap sa naunang salaysay; likas na naipapahayag ito sa Tagalog sa pamamagitan ng panimulang “At ang.”
- source_word: μαθηταὶ
  choice: mga alagad
  rationale: Ang “mga alagad” ang karaniwan at tumpak na katawagan sa mga tagasunod o disipulo ni Jesus sa Bagong Tipan.
- source_word: ἐπληροῦντο
  choice: patuloy na napupuspos
  rationale: Pinananatili nito ang tinig na balintiyak at ipinahihiwatig ang nagpapatuloy o paulit-ulit na kilos ng imperpektong pandiwa, habang nananatiling natural sa modernong Tagalog.
- source_word: χαρᾶς
  choice: ng kagalakan
  rationale: Pagkatapos ng “napupuspos,” likas sa Tagalog ang “ng” upang tukuyin ang nilalaman ng pagpupuspos; ang “kagalakan” ay tuwiran at marangal na katumbas ng χαρά.
- source_word: πνεύματος ἁγίου
  choice: ng Banal na Espiritu
  rationale: Sa konteksto ng Mga Gawa, tumutukoy ito sa banal at personal na Espiritu; ang malaking titik at anyong “Banal na Espiritu” ay malinaw at karaniwan sa Tagalog.
theological_decisions:
- issue: Kung ang πνεύματος ἁγίου ay tumutukoy sa personal na Banal na Espiritu o sa isang di-personal na banal na espiritu/kalagayan
  choice: Banal na Espiritu
  alternative: banal na espiritu
  rationale: Sa Mga Gawa, ang pariralang ito ay karaniwang tumutukoy sa Banal na Espiritung kumikilos sa misyon ng iglesya. Gayunman, ipinakikita sa talababa na walang tiyak na pantukoy sa pariralang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “patuloy na napupuspos” upang malinaw ngunit hindi labis na mabigat na katawanin ang imperpektong aspektong Griyego; iniwasan ang mas kolokyal na “punô” at ang arkahikong pananalita.
