  text: κἀκεῖθεν ᾐτήσαντο βασιλέα, καὶ ἔδωκεν αὐτοῖς ὁ θεὸς τὸν Σαοὺλ υἱὸν Κίς, ἄνδρα ἐκ φυλῆς Βενιαμίν, ἔτη τεσσεράκοντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/021.yaml
  text: And from there they asked for a king[a], and God gave them Saul son of Kish, a man from the tribe of Benjamin[b], for forty years.
translation:
  language: tl
  text: Pagkatapos nito, humiling sila ng isang hari[a], at ibinigay sa kanila ng Diyos si Saul na anak ni Cis, isang lalaki mula sa lipi ni Benjamin, sa loob ng apatnapung taon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mula roon ay humiling sila ng isang hari.” Ang pambungad na salita ay maaari ring magpahiwatig ng paglipat sa kasunod na bahagi ng salaysay.
    reason: lexical_alternative
  - marker: b
    text: May ilang nakapapansin ng tanong sa kronolohiya kaugnay ng “apatnapung taon” kapag inihambing ito sa datos ng Lumang Tipan; pinananatili rito ang pagkakasabi ni Lucas.
    reason: cross_reference
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Pagkatapos nito
  rationale: Sa konteksto ng sunod-sunod na pagsasalaysay ng kasaysayan, natural itong gumaganap bilang panandang temporal. Pinananatili nito ang ugnayan sa naunang pangyayari nang hindi ipinipilit ang literal na ideya ng paggalaw mula sa isang lugar.
- source_word: ᾐτήσαντο βασιλέα
  choice: humiling sila ng isang hari
  rationale: Ipinahahayag ng middle form na humiling ang bayan para sa kanilang sarili. Ang “humiling” ay natural at hindi nagpapalakas sa tono tungo sa “nagpilit” o “humingi nang may pag-angkin.”
- source_word: ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: ibinigay sa kanila ng Diyos
  rationale: Pinananatili ang karaniwang kahulugan ng ἔδωκεν at ang Diyos bilang tahasang gumaganap, nang hindi ito pinakikitid sa “itinalaga.”
- source_word: τὸν Σαοὺλ υἱὸν Κίς
  choice: si Saul na anak ni Cis
  rationale: Ginamit ang karaniwang anyong Filipino ng patronimiko at ang nakaugaliang baybay na “Cis” sa tradisyong biblikal na Tagalog.
- source_word: ἄνδρα ἐκ φυλῆς Βενιαμίν
  choice: isang lalaking mula sa lipi ni Benjamin
  rationale: Tumpak na tinutukoy ng ἀνήρ ang isang lalaking tao, at malinaw na ipinahahayag ng “mula sa lipi” ang pinagmulan na nasa ἐκ.
- source_word: ἔτη τεσσεράκοντα
  choice: sa loob ng apatnapung taon
  rationale: Ipinakikita nang natural sa Filipino ang tagal at pinakamalapit na iniuugnay sa pagbibigay ng Diyos kay Saul bilang hari.
theological_decisions:
- issue: Pagkakaugnay ng ἔτη τεσσεράκοντα
  choice: Iniugnay ang “sa loob ng apatnapung taon” sa pagbibigay ng Diyos kay Saul, na nagpapahiwatig ng panahon ng kanyang paghahari.
  alternative: Maaaring unawain nang mas maluwag ang parirala bilang bahagi ng buod ng kasaysayan, lalo na dahil may napapansing tanong sa kronolohiya kung ihahambing sa datos ng Lumang Tipan.
  rationale: Sa daloy ng Griyego, ang parirala ng tagal ay pinakanatural na nakakabit sa naunang sugnay. Pinananatili ng salin ang pahayag ni Lucas at hindi tinatangkang lutasin o pagtugmain ang anumang kronolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pagkatapos nito” bilang natural na panandang salaysay; iniwasan ang sobrang literal ngunit di-likas na “At mula roon.”
