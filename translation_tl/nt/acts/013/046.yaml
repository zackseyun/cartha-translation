- from: Kaya buong tapang na sinabi nina Pablo at Bernabe, “Kinailangang sa inyo muna ipahayag ang salita ng Diyos. Ngunit dahil itinatakwil ninyo ito at hinahatulan ninyo ang inyong sarili na hindi karapat-dapat sa buhay na walang hanggan, narito, babaling kami sa mga Hentil.[a]”
  to: Kaya buong tapang na sinabi nina Pablo at Bernabe, “Kinailangang sa inyo muna ipahayag ang salita ng Diyos. Dahil itinatakwil ninyo ito at itinuturing ninyong hindi karapat-dapat ang inyong sarili sa buhay na walang hanggan, narito, bumabaling kami sa mga Hentil.[a]”
