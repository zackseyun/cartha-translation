source:
  edition: SBLGNT
  text: παρρησιασάμενοί ⸀τε ὁ Παῦλος καὶ ὁ Βαρναβᾶς εἶπαν· Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι τὸν λόγον τοῦ θεοῦ· ⸀ἐπειδὴ ἀπωθεῖσθε αὐτὸν καὶ οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς, ἰδοὺ στρεφόμεθα εἰς τὰ ἔθνη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/046.yaml
  text: So Paul and Barnabas spoke boldly and said[a], “It was necessary that the word of God be spoken first to you. Since you are rejecting it and judging yourselves unworthy of eternal life, look, we are turning to the Gentiles.”
translation:
  language: tl
  text: Kaya buong tapang na sinabi nina Pablo at Bernabe, “Kinailangang sa inyo muna ipahayag ang salita ng Diyos. Dahil itinatakwil ninyo ito at itinuturing ninyong hindi karapat-dapat ang inyong sarili sa buhay na walang hanggan, narito, bumabaling kami sa mga Hentil.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bansa.” Dito, tumutukoy ang parirala sa mga di-Judio bilang kaiba sa mga tagapakinig sa sinagoga, kaya “mga Hentil” ang ginamit sa pangunahing teksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησιασάμενοί
  choice: buong tapang na sinabi
  rationale: Ipinahahayag ng participle ang matapang at hayagang paraan ng pagsasalita; natural itong iniugnay sa pangunahing pandiwang εἶπαν sa Filipino.
- source_word: Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι
  choice: Kinailangang sa inyo muna ipahayag
  rationale: Pinananatili ang necessity, ang unang tagapakinig, at ang pagkakasunod na ipinahihiwatig ng πρῶτον, habang gumagamit ng likas na ayos sa Filipino.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Karaniwan at dignidad na biblikal na parirala na maaari ring tumukoy sa mensahe ng Diyos nang hindi nililimitahan ang saklaw nito.
- source_word: ἐπειδὴ ἀπωθεῖσθε αὐτὸν
  choice: Ngunit dahil itinatakwil ninyo ito
  rationale: Ang ἀπωθεῖσθε ay nagpapahiwatig ng aktibong pagtanggi o pagtataboy. Ang “ito” ay malinaw na tumutukoy sa salita ng Diyos.
- source_word: οὐκ ἀξίους κρίνετε ἑαυτοὺς
  choice: hinahatulan ninyo ang inyong sarili na hindi karapat-dapat
  rationale: Pinananatili ang mapanghatol na diwa ng κρίνετε at ang mahalagang reflexive force ng ἑαυτούς.
- source_word: τῆς αἰωνίου ζωῆς
  choice: sa buhay na walang hanggan
  rationale: Ang “karapat-dapat sa” ang likas na katumbas sa Filipino ng genitive construction pagkatapos ng ἀξίους.
- source_word: ἰδοὺ στρεφόμεθα
  choice: narito, babaling kami
  rationale: Pinananatili ng “narito” ang pansin-tawag ng ἰδού; ang “babaling kami” ay natural na naghahayag ng pagbabago ng direksiyon sa ministeryo.
- source_word: εἰς τὰ ἔθνη
  choice: sa mga Hentil
  rationale: Sa konteksto, ikinokontra ang mga di-Judio sa mga tagapakinig sa sinagoga; mas tiyak dito ang “mga Hentil” kaysa sa pangheograpiyang “mga bansa.”
theological_decisions:
- issue: Kahulugan ng τὰ ἔθνη sa kontekstong pangkaligtasang-kasaysayan
  choice: mga Hentil
  alternative: mga bansa
  rationale: Ang agarang kaibahan ay sa pagitan ng mga kausap sa sinagoga at ng mga di-Judio. Pinananatili nito ang etnikong kaibahan sa salaysay nang hindi ito ginagawang heograpikal lamang.
- issue: Puwersa ng οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς
  choice: hinahatulan ninyo ang inyong sarili na hindi karapat-dapat sa buhay na walang hanggan
  alternative: hinahatulan silang hindi karapat-dapat sa buhay na walang hanggan
  rationale: Tahasan sa Griyego na ang mga tagapakinig ang humahatol sa kanilang sarili. Hindi iniuukol ng salin kay Pablo ang paghatol na inilalagay ng teksto sa kanila.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buong tapang,” “itinatakwil,” at “babaling” upang maging natural sa karaniwang mambabasa habang pinananatili ang diin at pag-igting ng Griyego. Inilagay ang marker na [a] kaagad pagkatapos ng “mga Hentil.”
