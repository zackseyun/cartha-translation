  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων εἶπεν τὸ πνεῦμα τὸ ἅγιον· Ἀφορίσατε δή μοι τὸν Βαρναβᾶν ⸀καὶ Σαῦλον εἰς τὸ ἔργον ὃ προσκέκλημαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/002.yaml
  text: While they were ministering to the Lord and fasting[a], the Holy Spirit said, “Set apart for me Barnabas and Saul for the work to which I have called them.”
translation:
  language: tl
  text: Habang naglilingkod sila sa Panginoon[a] at nag-aayuno, sinabi ng Banal na Espiritu, “Ibukod ninyo para sa akin sina Bernabe at Saulo para sa gawaing tinawag ko sila upang gawin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumasamba sa Panginoon.” Ang pandiwang Griyego ay maaaring tumukoy sa paglilingkod na may kaugnayan sa pagsamba o liturhiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργούντων
  choice: naglilingkod
  rationale: Saklaw ng pandiwa ang paglilingkod na may kontekstong debosyonal o pagsamba. Natural sa makabagong Tagalog ang “naglilingkod,” habang nililinaw sa talababa ang posibleng diin sa pagsamba.
- source_word: τῷ κυρίῳ
  choice: sa Panginoon
  rationale: Ipinahihiwatig ng datibo kung kanino nakatuon ang paglilingkod. Ang “sa Panginoon” ay tuwiran at likas sa Tagalog.
- source_word: νηστευόντων
  choice: nag-aayuno
  rationale: Karaniwang salin ng pandiwaring tumutukoy sa kasabay na pag-aayuno.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: ang Banal na Espiritu
  rationale: Pamantayan, malinaw, at natural na katawagan sa makabagong Tagalog; pinananatili nitong ang Espiritu ang personal na nagsasalitang simuno.
- source_word: Ἀφορίσατε
  choice: Ibukod ninyo
  rationale: Ipinapahayag nito ang paghihiwalay o pagtatalaga para sa isang natatanging layunin nang hindi ipinapasok ang teknikal na ideya ng ordinasyon o paghirang sa isang tungkulin.
- source_word: δή
  choice: ipinahiwatig sa tuwirang utos
  rationale: Nagdaragdag ito ng diin o agarang pagkilos. Hindi ito binigyan ng hiwalay na salita upang maiwasan ang pilit na Tagalog, ngunit nadarama ang lakas nito sa pautos na “Ibukod ninyo.”
- source_word: μοι
  choice: para sa akin
  rationale: Malinaw nitong ipinapahayag na ang pagbubukod ay para sa layunin ng nagsasalitang Banal na Espiritu.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: sina Bernabe at Saulo
  rationale: Ginamit ang nakaugaliang anyo ng mga pangalang biblikal sa Tagalog at ang pantukoy na “sina” para sa dalawang tao.
- source_word: εἰς τὸ ἔργον
  choice: para sa gawain
  rationale: Pinananatili ng “gawain” ang malawak na kahulugan ng ἔργον at hindi ito pinakikitid sa isang teknikal na ministeryo o katungkulan.
- source_word: ὃ προσκέκλημαι αὐτούς
  choice: itinawag ko sa kanila
  rationale: Ipinapahayag ng anyong perpekto ang naunang pagtawag na nananatiling may bisa. Likas sa Tagalog ang “itinawag ko sa kanila” at pinananatili ang diwa ng banal na pagtawag.
theological_decisions:
- issue: Kahulugan ng λειτουργούντων sa konteksto ng sama-samang debosyon at pagsusugo
  choice: naglilingkod sila sa Panginoon
  alternative: sumasamba sila sa Panginoon
  rationale: Maaaring may liturhikal o mapagsambang himig ang salita, ngunit hindi nito kailangang tukuyin lamang ang pormal na pagsamba. Pinananatili ng “naglilingkod” ang lawak ng kahulugan, at inihaharap sa talababa ang lehitimong alternatibo.
- issue: Ang Banal na Espiritu bilang nagsasalitang simuno
  choice: sinabi ng Banal na Espiritu
  alternative: —
  rationale: Tuwirang itinatanghal ng Griyego ang Banal na Espiritu bilang nagsasalita; hindi ito ginawang di-personal na impluwensiya.
- issue: Lakas ng ἀφορίσατε ... εἰς τὸ ἔργον
  choice: Ibukod ninyo ... para sa gawain
  alternative: Hirangin ninyo ... sa ministeryo
  rationale: Ipinapahayag ng teksto ang pagbubukod para sa tiyak na gawain, ngunit hindi nito tahasang tinutukoy ang ordinasyon o isang teknikal na katungkulan sa iglesya.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “naglilingkod” bilang natural na pangunahing salin at ang talababa upang mapanatili ang mapagsamba o liturhikal na posibilidad. Iniwasan ang mga terminong maaaring magpasok ng teknikal na doktrina tungkol sa ordinasyon.
