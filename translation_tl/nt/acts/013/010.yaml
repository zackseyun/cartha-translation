id: ACT.13.10
reference: Acts 13:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπεν· Ὦ πλήρης παντὸς δόλου καὶ πάσης ῥᾳδιουργίας, υἱὲ διαβόλου, ἐχθρὲ πάσης δικαιοσύνης, οὐ παύσῃ διαστρέφων τὰς ⸀ὁδοὺς κυρίου τὰς εὐθείας;
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/010.yaml
  text: And he said[a], “You who are full of every kind of deceit and every kind of villainy, son of the devil, enemy of all righteousness, will you not stop twisting the straight ways of the Lord?”
translation:
  language: tl
  text: Sinabi niya, “Ikaw na punô ng lahat ng uri ng panlilinlang at ng lahat ng kabuktutan, anak ng diyablo, kaaway ng lahat ng katuwiran[a], hindi ka ba titigil sa pagbaluktot ng mga matutuwid na daan ng Panginoon?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaaway ng lahat ng katarungan.” Ang salitang Griego ay maaaring mangahulugang katuwiran o katarungan, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης παντὸς δόλου
  choice: punô ng lahat ng uri ng panlilinlang
  rationale: Ang πλήρης na may genitive ay nagsasaad ng pagiging punô o lubos na kakikitaan ng isang katangian. Ang δόλος ay panlilinlang, daya, o tusong pandaraya; inilalahad ng “lahat ng uri” ang malawak na saklaw ng παντός sa natural na Tagalog.
- source_word: πάσης ῥᾳδιουργίας
  choice: ng lahat ng kabuktutan
  rationale: Ang ῥᾳδιουργία ay tumutukoy sa walang-prinsipyong kasamaan o mapanlinlang na asal. Pinananatili ng “kabuktutan” ang matinding paratang at hindi nito lubusang inuulit ang kahulugan ng “panlilinlang.”
- source_word: υἱὲ διαβόλου
  choice: anak ng diyablo
  rationale: Tuwirang katumbas ito ng υἱέ at pinananatili ang biblikal na idyoma ng moral na pagkakahawig o pagpanig.
- source_word: ἐχθρὲ πάσης δικαιοσύνης
  choice: kaaway ng lahat ng katuwiran
  rationale: Ang δικαιοσύνη rito ay pangunahing tumutukoy sa pagiging matuwid at sa anumang naaayon sa tama; “katuwiran” ang likas at malawak na katumbas sa Tagalog.
- source_word: οὐ παύσῃ
  choice: hindi ka ba titigil
  rationale: Ang future middle indicative ay ginagamit bilang matinding retorikal na pagsaway. Natural itong ipinahahayag sa Tagalog bilang tanong na “hindi ka ba titigil?” nang hindi dinaragdagan ng diwa ng “kailanman.”
- source_word: διαστρέφων
  choice: pagbaluktot
  rationale: Ang pandiwa ay nangangahulugang pilipitin, baluktutin, o ilihis mula sa tama. Ang “pagbaluktot” ay malinaw na kaugnay ng kasunod na larawan ng matutuwid na daan.
- source_word: τὰς ὁδοὺς κυρίου τὰς εὐθείας
  choice: sa matutuwid na daan ng Panginoon
  rationale: Pinananatili ng “daan” ang literal at metaporikal na saklaw ng ὁδός, samantalang ang “matutuwid” ay tumutugma sa plural na εὐθείας at nagpapakita ng tuwid at wastong landas.
- source_word: Ὦ
  choice: Ikaw na
  rationale: Ang Ὦ ay tanda ng mariin at tuwirang pagtawag. Ang “Ikaw na” ay natural sa makabagong Tagalog at maayos na nagpapakilala sa magkakasunod na paratang.
theological_decisions:
- issue: Pagpapakahulugan sa δικαιοσύνη
  choice: katuwiran
  alternative: katarungan
  rationale: Sa kontekstong ito, ang salita ay tumutukoy nang malawak sa moral na pagkamatuwid at sa lahat ng tama, kaya “katuwiran” ang nasa pangunahing teksto. Gayunman, maaari ring bigyang-diin ng salita ang “katarungan,” kaya pinananatili ang posibilidad na iyon sa talababa.
translation_notes:
  register: Makabago, tuwiran, at marangal na Tagalog. Pinananatili ang tindi ng pagsaway, ang magkakasunod na pantawag, at ang metapora ng pagbaluktot sa mga daang matuwid, nang hindi ginagawang arkaiko ang pananalita.
