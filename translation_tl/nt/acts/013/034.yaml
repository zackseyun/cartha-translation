id: ACT.13.34
reference: Acts 13:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι δὲ ἀνέστησεν αὐτὸν ἐκ νεκρῶν μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν, οὕτως εἴρηκεν ὅτι Δώσω ὑμῖν τὰ ὅσια Δαυὶδ τὰ πιστά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/034.yaml
  text: 'And that he raised him from the dead, no longer about to return to decay, he has spoken in this way: ‘I will give you the holy and sure blessings of David.’'
translation:
  language: tl
  text: 'Tungkol naman sa muling pagbuhay niya sa kanya mula sa mga patay—na hindi na siya muling babalik sa pagkabulok—ganito ang sinabi niya: “Ibibigay ko sa inyo ang mga banal at tiyak na pagpapalang kaugnay ni David.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa tradisyonal na salin, “ang mga tiyak na habag ni David.” Ang pariralang Griyego ay alingawngaw ng Isaias 55:3 at tumutukoy sa banal at maaasahang mga pangakong tipan na kaugnay ni David.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέστησεν αὐτὸν ἐκ νεκρῶν
  choice: muling pagbuhay niya sa kanya mula sa mga patay
  rationale: Malinaw sa konteksto na tumutukoy ito sa pagkabuhay na muli. Pinananatili ng parirala ang Diyos bilang gumagawa at ang karaniwang biblikal na pananalitang “mula sa mga patay.”
- source_word: μηκέτι μέλλοντα ὑποστρέφειν
  choice: hindi na siya muling babalik
  rationale: Natural itong Filipino at malinaw na nagpapahayag na hindi na mangyayari ang pagbabalik, nang hindi nagdaragdag ng ideya ng tadhana.
- source_word: διαφθοράν
  choice: pagkabulok
  rationale: Sa konteksto ng muling pagkabuhay, pisikal na pagkabulok ng katawan ang tinutukoy; mas malinaw ito kaysa “katiwalian,” na karaniwang may moral na kahulugan sa modernong Filipino.
- source_word: οὕτως εἴρηκεν
  choice: ganito ang sinabi niya
  rationale: Natural na pambungad ito sa sipi at sapat na ipinahihiwatig ang nananatiling bisa ng nakasulat na pahayag.
- source_word: Δώσω ὑμῖν
  choice: Ibibigay ko sa inyo
  rationale: Tuwirang isinasalin ang pangako sa hinaharap at ang maramihang tagatanggap.
- source_word: τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: ang mga banal at tiyak na pagpapalang kaugnay ni David
  rationale: Ang mahirap at eliptikong parirala ay tumutukoy sa mga banal at mapanghahawakang kaloob o pangakong Davidiko. Ang “kaugnay ni David” ay nagpapanatili sa malawak na ugnayang ipinahahayag ng genitibo nang hindi nagpapasyang ang mga ito ay pag-aari lamang ni David o para lamang sa kanya.
theological_decisions:
- issue: Kahulugan ng τὰ ὅσια Δαυὶδ τὰ πιστά sa sipi mula sa Isaias 55:3
  choice: ang mga banal at tiyak na pagpapalang kaugnay ni David
  alternative: ang mga tiyak na habag kay David
  rationale: Ginagamit ang sipi kaugnay ng muling pagkabuhay ni Jesus at ng matibay na mga pangakong Davidiko. Pinananatili ng salin ang tipanang diwa at ang tunay na kaluwagan ng pariralang Griyego, samantalang inilalagay sa talababa ang tradisyonal na pagbasa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang gitling na pahaba upang luminaw na ang hindi na muling babalik sa pagkabulok ay ang muling binuhay, hindi ang Diyos na bumuhay sa kanya.
