  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Δαυὶδ μὲν γὰρ ἰδίᾳ γενεᾷ ὑπηρετήσας τῇ τοῦ θεοῦ βουλῇ ἐκοιμήθη καὶ προσετέθη πρὸς τοὺς πατέρας αὐτοῦ καὶ εἶδεν διαφθοράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/036.yaml
  text: For David[a], after serving God's purpose in his own generation[d][c][b], fell asleep and was gathered to his fathers and saw decay.
translation:
  language: tl
  text: Sapagkat si David, matapos maglingkod sa layunin ng Diyos sa sarili niyang salinlahi[a], ay natulog[b], napabilang sa kanyang mga ninuno[c], at dumanas ng pagkabulok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “matapos niyang paglingkuran ang sarili niyang salinlahi ayon sa layunin ng Diyos.”'
    reason: syntactic_alternative
  - marker: b
    text: Ang “natulog” ay biblikal na talinghaga para sa pagkamatay.
    reason: cultural_note
  - marker: c
    text: Sa literal, “idinagdag sa kanyang mga ama”—isang idyomang nangangahulugang nakasama niya sa kamatayan ang kanyang mga ninuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδίᾳ γενεᾷ
  choice: ang sarili niyang salinlahi
  rationale: Pinananatili nitong tuwirang kaugnay sa ὑπηρετήσας ang datibo bilang mga taong pinaglingkuran ni David. Ang ‘salinlahi’ ay natural at malinaw sa makabagong Filipino.
- source_word: ὑπηρετήσας
  choice: matapos niyang paglingkuran
  rationale: Ipinahahayag ng aorist participle ang gawaing nauna sa pagkamatay ni David. Ang ‘paglingkuran’ ay karaniwan at hindi makitid na terminong pansimbahan.
- source_word: τῇ τοῦ θεοῦ βουλῇ
  choice: ayon sa layunin ng Diyos
  rationale: Maaaring tumukoy ang βουλή sa pasiya, kalooban, panukala, o layunin. Ang ‘ayon sa layunin’ ay nagpapakita na ang paglilingkod ni David ay nakaayon sa banal na layunin nang hindi ipinipilit ang isang partikular na sistemang teolohikal.
- source_word: ἐκοιμήθη
  choice: natulog sa kamatayan
  rationale: Pinananatili ang metapora ng pagtulog habang nililinaw sa ordinaryong mambabasa na kamatayan ang tinutukoy.
- source_word: προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: napabilang sa kanyang mga ninuno
  rationale: Natural na Filipino ito para sa Semitikong idyoma ng pakikiisa sa mga ninuno sa kamatayan. Ang literal na ‘idinagdag sa kanyang mga ama’ ay magiging malabo at matigas.
- source_word: εἶδεν διαφθοράν
  choice: dumanas ng pagkabulok
  rationale: Ipinahahayag nito ang kahulugang nabulok ang katawan ni David. Mas malinaw ito kaysa sa literal ngunit di-natural na ‘nakakita ng pagkabulok,’ habang pinananatili ang mahalagang kaibahan sa kasunod na talata.
theological_decisions:
- issue: Ugnayan ng dalawang datibo sa paglilingkod ni David
  choice: pinaglingkuran ni David ang sarili niyang salinlahi ayon sa layunin ng Diyos
  alternative: naglingkod si David sa layunin ng Diyos sa sarili niyang salinlahi
  rationale: Pinakamadaling basahin ang ἰδίᾳ γενεᾷ bilang layon ng ὑπηρετήσας at ang τῇ τοῦ θεοῦ βουλῇ bilang pamantayan o batayan. Gayunman, tunay na posible sa sintaks ang alternatibong pagkakaugnay, kaya inilalahad ito sa talababa.
- issue: Metapora ng kamatayan
  choice: natulog sa kamatayan
  alternative: namatay
  rationale: Sadyang gumagamit ang Griyego ng κοιμάομαι. Pinananatili ng salin ang metapora nang hindi humuhugot ng karagdagang doktrina tungkol sa kalagayan ng patay.
- issue: Pagkabulok ng katawan ni David
  choice: dumanas ng pagkabulok
  alternative: nakakita ng pagkabulok
  rationale: Ang konteksto ay tumutukoy sa pagkabulok ng katawan at sa kaibahan kay Jesus sa kasunod na talata. Nililinaw ito nang hindi dinaragdagan ang sinasabi ng teksto.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang ‘salinlahi,’ ‘layunin,’ at ‘mga ninuno’ bilang malinaw na karaniwang bokabularyo. Pinanatili ang metapora ng pagtulog ngunit nilinaw ang kahulugan nito; iniwasan ang masyadong literal at di-natural na mga parirala.
