base_translation:
  language: en
  yaml_path: translation/nt/acts/013/048.yaml
  text: When the Gentiles heard this[a], they began rejoicing and glorifying the word of the Lord, and all who had been appointed for eternal life believed.
translation:
  language: tl
  text: Nang marinig ito ng mga Hentil, nagsimula silang magalak at luwalhatiin ang salita ng Panginoon. At sumampalataya ang lahat ng itinalaga[a] para sa buhay na walang hanggan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakahilig tungo sa buhay na walang hanggan.” Maaaring unawain sa iba’t ibang paraan ang anyong pandiwari sa Griyego, ngunit ang balintiyak na kahulugang “itinalaga” ang pinakatuwirang salin dito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούοντα
  choice: Nang marinig ito
  rationale: Ginawang sugnay na pangyayari ang kasalukuyang pandiwaring Griyego; idinagdag ang “ito” mula sa malinaw na konteksto upang maging likas sa Tagalog.
- source_word: τὰ ἔθνη
  choice: mga Hentil
  rationale: Sa konteksto ng Mga Gawa, tumutukoy ito sa mga hindi Judio, kaya mas tiyak ang “mga Hentil” kaysa “mga bansa.”
- source_word: ἔχαιρον καὶ ἐδόξαζον
  choice: nagsimula silang magalak at luwalhatiin
  rationale: Ipinahihiwatig ng mga pandiwang imperpekto ang nagpapatuloy o nagsisimulang tugon; likas na naiuugnay sa Tagalog ang dalawang kilos sa ilalim ng “nagsimula.”
- source_word: τὸν λόγον τοῦ κυρίου
  choice: ang salita ng Panginoon
  rationale: Pinananatili ng “salita” ang biblikal na idyoma, bagaman ang tinutukoy sa konteksto ay ang ipinahayag na mensahe.
- source_word: ἐπίστευσαν
  choice: sumampalataya
  rationale: Tuwirang ipinapahayag ang ganap na kilos ng aorist nang walang dagdag na paliwanag.
- source_word: ὅσοι
  choice: ang lahat ng
  rationale: Likas na katumbas sa Tagalog ng dami at saklaw na ipinahihiwatig ng ὅσοι.
- source_word: τεταγμένοι
  choice: itinalaga
  rationale: Pinananatili ang pinakatuwirang balintiyak na diwa ng perfect passive participle ng τάσσω, nang hindi pinalalawak ito bilang ganap na pahayag tungkol sa predestinasyon.
- source_word: εἰς ζωὴν αἰώνιον
  choice: para sa buhay na walang hanggan
  rationale: Likas sa modernong Tagalog at pinananatili ang tunguhin o layuning ipinahihiwatig ng εἰς.
theological_decisions:
- issue: Kahulugan ng τεταγμένοι kaugnay ng pagtatalaga at pagtugon ng tao
  choice: itinalaga para sa buhay na walang hanggan
  alternative: nakahilig tungo sa buhay na walang hanggan
  rationale: Ang balintiyak na anyo ay pinakatuwirang nagpapahiwatig ng pagkakatalaga o pagkakahirang. Hindi tinutukoy ng salin kung paano ito nauugnay sa mas malawak na doktrina; inilalahad sa talababa ang ibang pagbasa upang mapanatili ang tunay na usaping pang-interpretasyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang nakasanayang biblikal na mga katawagang “Hentil,” “salita ng Panginoon,” at “buhay na walang hanggan,” habang iniwasan ang pagpapasok ng natatanging paninindigang denominasyonal.
