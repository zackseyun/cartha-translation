  source_fidelity: 'Malapit na sinusunod ng salin ang Griyego: napananatili ang perpektong diwa ng ἐκπεπλήρωκεν, ang pagtukoy sa “ating mga anak,” at ang siniping Awit 2:7. Gayunman, ang “itindig niya si Jesus” ay hindi likas na kolokasyon sa makabagong Filipino at maaaring magpahiwatig lamang ng pisikal na pagpapatayo. Ang “ibinangon niya si Jesus” ay mas natural at nananatiling sapat na maluwag upang hindi tahasang ipasya ang pinagtatalunang saklaw ng ἀναστήσας.'
  naturalness: Ang “nasusulat sa ikalawang Awit” at “Ikaw ang aking Anak” ay malinaw at angkop sa marangal na rehistro. Pinalitan ang “ipinanganak kita,” na sa karaniwang Filipino ay madaling marinig bilang panganganak ng ina, ng “naging ama mo ako,” na mas malinaw na tumutugon sa γεννάω sa tinig ng isang ama habang hindi nagdaragdag ng pagpapakahulugang doktrinal.
  terminology: Pinanatili ang “Diyos,” “Jesus,” “Awit,” at “Anak.” Ang “naging ama mo ako” ay isang likas na Filipino na katumbas ng “I have begotten you,” hindi isang pagpapaliwanag tungkol sa pagluklok, pag-ampon, o muling pagkabuhay.
