id: ACT.13.33
reference: Acts 13:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι ταύτην ὁ θεὸς ἐκπεπλήρωκεν τοῖς τέκνοις ⸀ἡμῶν ἀναστήσας Ἰησοῦν, ὡς καὶ ἐν τῷ ⸂ψαλμῷ γέγραπται τῷ δευτέρῳ⸃· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/033.yaml
  text: 'that God has fulfilled this for our children by raising up Jesus[a], as it is also written in the second Psalm: ‘You are my Son[b]; today I have begotten you.’'
translation:
  language: tl
  text: 'na tinupad ng Diyos para sa ating mga anak[a] nang ibinangon niya si Jesus.[b] Gaya rin ng nasusulat sa ikalawang Awit:


    “Ikaw ang aking Anak;

    ngayon ay naging ama mo ako.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa atin, na kanilang mga anak.” May mga manuskritong sumusuporta sa “para sa ating mga anak,” at may iba namang sumusuporta sa “sa atin, na kanilang mga anak.”
    reason: textual_variant
  - marker: b
    text: O, “nang muling buhayin niya si Jesus.” Ang salitang Griyego ay maaari ring mangahulugang “ibinangon” sa diwang inilabas o itinalaga.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπεπλήρωκεν
  choice: tinupad
  rationale: Likas at malinaw na katumbas ito ng ganap na pagtupad sa ipinangako; naipahihiwatig ng konteksto ang nananatiling bisa ng natupad na kilos.
- source_word: ταύτην
  choice: na
  rationale: Sa Filipino, natural na idugtong ang sugnay na ito sa naunang binanggit na pangako sa pamamagitan ng “na”; hindi na inuulit ang pangngalang wala sa mismong talata.
- source_word: τοῖς τέκνοις ἡμῶν
  choice: para sa ating mga anak
  rationale: Tuwirang sinusunod ang tekstong SBLGNT na may ἡμῶν. Maaaring tumukoy ang “mga anak” sa mga inapo; inilalagay sa talababa ang mahalagang baryanteng teksto.
- source_word: ἀναστήσας Ἰησοῦν
  choice: nang itindig niya si Jesus
  rationale: Ang “itindig” ay hindi kasintiyak ng “buhayin mula sa kamatayan” at kaya'y nagpapanatili sa posibilidad na ang tinutukoy ay ang pagbangon mula sa kamatayan o ang pagtindig/pagharap kay Jesus bilang ipinangakong tagapagligtas.
- source_word: γέγραπται
  choice: nasusulat
  rationale: Karaniwang marangal na pormula sa Filipino sa pagpapakilala ng sipi mula sa Kasulatan at nagpapahiwatig ng patuloy na bisa ng nakasulat.
- source_word: ψαλμῷ ... τῷ δευτέρῳ
  choice: ikalawang Awit
  rationale: Malapit sa anyo ng Griyego at natural bilang pagtukoy sa Awit 2.
- source_word: Υἱός μου εἶ σύ
  choice: Ikaw ang aking Anak
  rationale: Natural na ayos sa Filipino na malinaw na pinananatili ang tuwirang pagkakakilanlan at diin ng pahayag.
- source_word: σήμερον γεγέννηκά σε
  choice: ngayon ay ipinanganak kita
  rationale: Tuwirang pinananatili ang matimbang na wika ng Awit 2:7 nang hindi ito pinapalitan ng paliwanag tungkol sa pagluklok, paghirang, o pagkabuhay na muli.
theological_decisions:
- issue: Kahulugan ng ἀναστήσας Ἰησοῦν
  choice: “itindig niya si Jesus,” na pinananatiling bukas ang higit sa isang posibleng diwa
  alternative: “muling binuhay niya si Jesus” o “itinalaga/iharap niya si Jesus”
  rationale: May malinaw na pananalita tungkol sa pagkabuhay na muli sa kasunod na konteksto, ngunit nagagamit din ang ἀνίστημι sa pagtindig ng Diyos ng isang pinuno o tagapagligtas. Hindi dapat tahimik na pasiyahan ng salin ang usapin.
- issue: Diwang Cristolohikal ng “ngayon ay ipinanganak kita”
  choice: panatilihin ang tuwirang sipi nang walang paliwanag sa pangunahing teksto
  alternative: ipakahulugan bilang pagluklok/pag-ampon o bilang pagpapatunay sa pamamagitan ng pagkabuhay na muli
  rationale: Ang sipi mula sa Awit 2:7 ay sadyang pinananatili sa anyong pampanitikan at teolohikal nito; hindi dinaragdagan ang salin upang lutasin ang mga susunod na debateng doktrinal.
translation_notes:
  register: Makabago at marangal na Filipino, na angkop sa pampublikong pagbasa. Ginamit ang “Awit” sa halip na “Salmo” para sa malawak na pagkaunawa. Inilagay ang mga talababa sa mismong pariralang tinutukoy ng bawat isa upang maiwasan ang kalituhan sa tekstuwal at interpretibong mga usapin.
