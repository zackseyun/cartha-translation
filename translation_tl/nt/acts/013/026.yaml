  text: Ἄνδρες ἀδελφοί, υἱοὶ γένους Ἀβραὰμ καὶ οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν, ⸀ἡμῖν ὁ λόγος τῆς σωτηρίας ταύτης ⸀ἐξαπεστάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/026.yaml
  text: Brothers[a], sons of the family of Abraham, and those among you who fear God[c][b], to us the message of this salvation has been sent.
translation:
  language: tl
  text: Mga kapatid,[a] mga anak ng angkan ni Abraham, at kayong mga kabilang sa inyo na may takot sa Diyos,[b] ipinadala sa atin ang mensahe ng kaligtasang ito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “Mga lalaking kapatid.” Panlalaki ang anyo sa Griyego, ngunit maaaring saklaw ng pagtawag ang mas malawak na kapulungang naroon.
    reason: lexical_alternative
  - marker: b
    text: Maaaring tumukoy ang pariralang ito sa mga “may takot sa Diyos”—mga Hentil na sumasamba sa Diyos ng Israel at nakikilahok sa buhay ng sinagoga.
    reason: cultural_note
  - marker: c
    text: O “salita ng kaligtasang ito.” Maaari ring isalin ang “sa atin” bilang “sa amin,” sapagkat hindi ipinakikita ng Griyego kung inklusibo o eksklusibo ang panghalip.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Mga kapatid
  rationale: Natural itong pantawag sa modernong Filipino at pinananatili ang diwa ng ἀδελφοί; hindi isinama sa pangunahing teksto ang literal ngunit matigas na “Mga lalaking kapatid.”
- source_word: υἱοὶ γένους Ἀβραὰμ
  choice: mga anak ng angkan ni Abraham
  rationale: Ipinahahayag ng “angkan” ang γένος bilang lahi o linya ng pamilya, habang ang “mga anak” ay natural sa Filipino at hindi ipinagpapalagay na mga agarang anak lamang.
- source_word: οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν
  choice: kayong mga kasama nila na may takot sa Diyos
  rationale: Pinananatiling paglalarawan ang participle na φοβούμενοι sa halip na gawing tiyak na katawagang teknikal; nililinaw rin ang ikalawang pangkat sa mga nakikinig.
- source_word: ἡμῖν
  choice: sa atin
  rationale: Ang inklusibong “atin” ay angkop dahil tuwirang kinakausap ni Pablo ang kapulungang kabilang sa mga pinadalhan ng mensahe; pinananatili nito ang direksiyon ng pagpapadala.
- source_word: ὁ λόγος
  choice: ang mensahe
  rationale: Sa konteksto ng pagpapahayag, natural na ipinapakahulugan ng “mensahe” ang λόγος nang hindi nililimitahan ito sa isang salita lamang.
- source_word: τῆς σωτηρίας ταύτης
  choice: ng kaligtasang ito
  rationale: Pinananatili ang ugnayang henitibo at ang karaniwang kahulugan ng σωτηρία sa Lucas–Mga Gawa.
- source_word: ἐξαπεστάλη
  choice: ipinadala
  rationale: Ang simpleng aspektong naganap ay natural na katumbas ng aorist passive at hindi dinaragdagan ng tahasang tagapagpadala na wala sa sugnay.
theological_decisions:
- issue: Paglalarawan sa φοβούμενοι τὸν θεόν
  choice: “mga kasama nila na may takot sa Diyos” bilang deskriptibong parirala
  alternative: “mga may takot sa Diyos” bilang katawagang maaaring teknikal para sa mga Hentil na kaugnay ng sinagoga
  rationale: Hindi tiyak sa mismong parirala kung teknikal na katawagan ito o karaniwang paglalarawan. Pinananatili ng pangunahing teksto ang pagiging bukás na iyon, at inilalagay sa talababa ang posibleng kontekstong pangkasaysayan.
- issue: Kasarian at saklaw ng Ἄνδρες ἀδελφοί
  choice: “Mga kapatid”
  alternative: “Mga lalaking kapatid” o “Mga kapatid na lalaki at babae”
  rationale: Mas natural ang “Mga kapatid” bilang pampublikong pantawag sa Filipino. Hindi nito tahasang dinaragdagan ang “mga babae,” ngunit maaari nitong saklawin ang buong kapulungang kinakausap, gaya ng maaaring gamit ng panlalaking anyo sa Griyego.
- issue: Saklaw ng panghalip na ἡμῖν
  choice: “sa atin”
  alternative: “sa amin”
  rationale: Ang pananalita ay nakatuon sa mga kinakausap bilang mga pinadalhan ng mensahe, kaya malamang na inklusibo ang “atin.” Gayunman, hindi minamarkahan ng Griyego ang pagkakaibang inklusibo at eksklusibo; kaya itinatala ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “angkan” para sa linya ni Abraham at ang deskriptibong “may takot sa Diyos” upang maiwasang ipilit ang teknikal na kahulugan. Inayos ang pangungusap upang maging natural sa Filipino habang pinananatili ang dalawang pangkat ng tagapakinig at ang diin sa mga pinadalhan ng mensahe.
