id: ACT.13.37
reference: Acts 13:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃν δὲ ὁ θεὸς ἤγειρεν οὐκ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/037.yaml
  text: But the one whom God raised up did not see decay[a].
translation:
  language: tl
  text: Ngunit ang muling binuhay ng Diyos ay hindi dumanas ng pagkabulok[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pagkasira.” Maaari ring tumukoy ang salitang Griyego sa pagkasira o pagkabulok ng katawan; inuulit nito ang pananalita ng Awit 16:10 sa saling Griyego ng Kasulatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: ang …
  rationale: Ginagawang pangngalang parirala ang panghalip na tumutukoy kay Jesus; natural ito sa Filipino at hindi na kailangang idagdag ang pangalan niya.
- source_word: δὲ
  choice: Ngunit
  rationale: Malinaw na ipinapakita ang pagsalungat sa naunang sinabi tungkol kay David, na nakaranas ng pagkabulok.
- source_word: ὁ θεὸς
  choice: Diyos
  rationale: Ito ang natural at marangal na katumbas sa Filipino kapag ang tinutukoy ay ang Diyos.
- source_word: ἤγειρεν
  choice: muling binuhay
  rationale: Sa agarang konteksto, ang pandiwa ay tumutukoy sa pagbuhay kay Jesus mula sa kamatayan. Mas malinaw ito sa karaniwang mambabasa kaysa sa literal ngunit maaaring malabong “ibinangon.”
- source_word: οὐκ εἶδεν
  choice: hindi dumanas
  rationale: Ang literal na “hindi nakakita” ay maaaring mapagkamalang simpleng pagmamasid sa Filipino. Ipinahahayag ng “hindi dumanas” ang idyomatikong diwa ng Griyego sa kontekstong ito.
- source_word: διαφθοράν
  choice: pagkabulok
  rationale: Malinaw na tumutukoy sa pagkabulok ng katawan matapos mamatay at angkop sa paghahambing kay David sa kalapit na mga talata.
theological_decisions:
- issue: Kahulugan ng ἤγειρεν
  choice: muling binuhay ng Diyos mula sa kamatayan
  alternative: itinaas, hinirang, o inilantad sa madla
  rationale: Ikinukumpara rito si Jesus kay David, na namatay at nakaranas ng pagkabulok. Dahil sinundan ito ng pahayag na hindi siya dumanas ng pagkabulok, ang muling pagkabuhay ang hinihingi ng konteksto.
- issue: Idyomang οὐκ εἶδεν διαφθοράν
  choice: hindi dumanas ng pagkabulok
  alternative: hindi nakakita ng pagkabulok
  rationale: Pinananatili ang kahulugan ng idyoma nang hindi lumilikha ng maling impresyon na ang usapin ay kung literal na nakakita siya ng isang bagay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “muling binuhay” upang maging tiyak ang konteksto ng muling pagkabuhay, at “dumanas ng pagkabulok” upang natural na maipahayag ang idyomang Griyego.
