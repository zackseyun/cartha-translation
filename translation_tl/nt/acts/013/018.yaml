  text: καί, ὡς τεσσερακονταετῆ χρόνον ἐτροποφόρησεν αὐτοὺς ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/018.yaml
  text: And for about forty years he put up with them in the wilderness[a].
translation:
  language: tl
  text: At sa loob ng halos apatnapung taon, pinagtiisan niya sila sa ilang[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “inalagaan niya sila,” sa halip na “pinagtiisan niya sila.”'
    reason: textual_variant
lexical_decisions:
- source_word: καί
  choice: At
  rationale: Likas na pang-ugnay sa Filipino na nagpapatuloy sa salaysay.
- source_word: ὡς
  choice: halos
  rationale: Ipinahihiwatig nito na tinatayang apatnapung taon ang panahong tinutukoy, hindi kinakailangang eksaktong bilang.
- source_word: τεσσερακονταετῆ χρόνον
  choice: sa loob ng ... apatnapung taon
  rationale: Natural na pagpapahayag sa Filipino para sa isang saklaw ng panahon.
- source_word: ἐτροποφόρησεν
  choice: pinagtiisan
  rationale: Ang anyong nakalimbag sa SBLGNT ay pinakamalamang na nangangahulugang nagtiis o nagpasensiya sa kanila; pinananatili nito ang pahiwatig ng paulit-ulit nilang pagsuway.
- source_word: αὐτοὺς
  choice: sila
  rationale: Tumutukoy sa bayang Israel bilang layon ng kilos; hinihingi ng anyong pandiwang Filipino ang panghalip na 'sila.'
- source_word: ἐν τῇ ἐρήμῳ
  choice: sa ilang
  rationale: '''Ilang'' ang maikli, dignified, at nakaugaliang terminong biblikal para sa ilang na dinaanan ng Israel.'
theological_decisions:
- issue: Ang kilos ng Diyos sa Israel habang nasa ilang
  choice: pinagtiisan niya sila
  alternative: inalagaan niya sila
  rationale: Sinusunod ng pangunahing teksto ang ἐτροποφόρησεν ng SBLGNT, na sumusuporta sa diwang 'pinagtiisan.' Hindi ito pinapalambot tungo sa pangangalaga lamang, ngunit itinatala sa talababa ang mahalagang ibang pagbasa ng mga manuskrito.
translation_notes:
  register: Modernong Filipino na malinaw at dignified. Ginamit ang 'pinagtiisan' bilang natural na katumbas ng diwang 'bore with,' at 'sa ilang' upang mapanatili ang biblikal at heograpikong dating.
