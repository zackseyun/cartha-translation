base_translation:
  language: en
  yaml_path: translation/nt/acts/013/016.yaml
  text: So Paul stood up[a], and motioning with his hand said, “Men of Israel and you who fear God, listen.”
translation:
  language: tl
  text: Kaya tumayo si Pablo, kumumpas gamit ang kanyang kamay, at sinabi, “Mga lalaking Israelita at kayong mga may takot sa Diyos[a], makinig kayo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga may takot sa Diyos.” Malamang na tumutukoy ang parirala sa mga Hentil na sumasamba sa Diyos at nakikiugnay sa sinagoga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: tumayo
  rationale: Tumutukoy ito sa konkretong pagkilos ni Pablo bago siya magsalita; natural at tuwiran ang “tumayo” sa makabagong Tagalog.
- source_word: δὲ
  choice: Kaya
  rationale: Nag-uugnay ito sa pagpapatuloy ng salaysay at sa pagkakataong ibinigay kay Pablo na magsalita, hindi sa isang mariing pagsalungat.
- source_word: κατασείσας τῇ χειρὶ
  choice: kumumpas ng kamay
  rationale: Inilalarawan nito ang kilos ng kamay upang tawagin ang pansin ng mga nakikinig. Natural ang “kumumpas” at hindi nito ipinahihiwatig ang magulong pagkaway.
- source_word: εἶπεν
  choice: sinabi
  rationale: Karaniwang pandiwa ito sa pagsisimula ng tuwirang pananalita.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Mga lalaking Israelita
  rationale: Pinananatili nito kapwa ang panlalaking tawag na ἄνδρες at ang pagkakakilanlang Israelita.
- source_word: οἱ φοβούμενοι τὸν θεόν
  choice: kayong mga may takot sa Diyos
  rationale: Pinananatili nito ang pandiwang diwa ng paglalarawan at madaling maunawaan, sa halip na gumamit ng teknikal na bansag.
- source_word: ἀκούσατε
  choice: makinig kayo
  rationale: Tuwiran at natural na pautos ito na humihiling ng masusing pakikinig.
theological_decisions:
- issue: 'Ang pagtukoy sa dalawang pangkat sa sinagoga: mga Israelita at mga may takot sa Diyos'
  choice: “Mga lalaking Israelita at kayong mga may takot sa Diyos”
  alternative: “Mga lalaking Israelita at kayong mga sumasamba sa Diyos”
  rationale: Ibinubukod ng Griyego ang mga Israelita mula sa ikalawang pangkat na inilalarawang natatakot sa Diyos, na malamang ay mga Hentil na kaugnay ng sinagoga. Pinananatili ng salin ang pagkakaibang iyon nang hindi ginagawang tiyak ang higit sa tahasang sinasabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Mga lalaking Israelita” upang mapanatili ang tahasang panlalaking anyo ng tawag, at “mga may takot sa Diyos” upang mapanatili ang maaaring deskriptibo o pangkatang gamit ng parirala.
