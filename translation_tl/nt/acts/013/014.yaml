  text: αὐτοὶ δὲ διελθόντες ἀπὸ τῆς Πέργης παρεγένοντο εἰς Ἀντιόχειαν ⸂τὴν Πισιδίαν⸃, καὶ ⸀εἰσελθόντες εἰς τὴν συναγωγὴν τῇ ἡμέρᾳ τῶν σαββάτων ἐκάθισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/014.yaml
  text: But they went on from Perga and came to Antioch in Pisidia[a], and on the Sabbath day they entered the synagogue and sat down.
translation:
  language: tl
  text: Ngunit nagpatuloy sila mula sa Perga at dumating sa Antioquia sa Pisidia[a]. Sa araw ng Sabbath, pumasok sila sa sinagoga at naupo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Antioquia ng Pisidia.” Sa Griyego, “Antioquia sa Pisidia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: Ngunit … sila
  rationale: Ipinahihiwatig ng δέ ang pagpapatuloy na may bahagyang pagsalungat; likas sa Tagalog na ilagay ang “sila” bilang paksa nang hindi pilit na idinidiin ang αὐτοί.
- source_word: διελθόντες ἀπὸ τῆς Πέργης
  choice: nagpatuloy sila mula sa Perga
  rationale: Sa salaysay ng paglalakbay, ipinapahayag ng participle na διέρχομαι ang pagpapatuloy ng paglalakbay mula sa isang lugar; malinaw at likas ang “nagpatuloy … mula.”
- source_word: παρεγένοντο
  choice: dumating
  rationale: Karaniwang nangangahulugan ang παραγίνομαι sa konteksto ng paglalakbay na makarating o dumating sa isang lugar.
- source_word: Ἀντιόχειαν τὴν Πισιδίαν
  choice: Antioquia sa Pisidia
  rationale: Tinutukoy nito kung aling Antioquia ang tinutukoy sa pamamagitan ng rehiyon; malapit ito sa anyo ng Griyego at malinaw sa makabagong Tagalog.
- source_word: εἰσελθόντες εἰς τὴν συναγωγήν
  choice: pumasok sila sa sinagoga
  rationale: Ginawang sugnay na may pandiwang tahasan ang participle upang maging natural sa Tagalog habang tumpak na naipapahayag ang pagpasok.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: Nang araw ng Sabbath
  rationale: Idyoma itong tumutukoy sa araw ng pamamahingang Judio. Bagaman maramihan ang anyong σαββάτων, isahan ang likas na pagpapahayag sa Tagalog.
- source_word: ἐκάθισαν
  choice: naupo
  rationale: Tuwirang ipinapahayag ang payak na kilos ng pag-upo; natural sa Tagalog ang “naupo” sa kontekstong pumasok sila at saka umupo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; pinanatili ang pangalang “Sabbath” bilang pamilyar na terminong biblikal at ang “sinagoga” bilang karaniwang katawagan sa lugar ng pagtitipon ng mga Judio.
