  source_fidelity: Tumpak na naihahayag ng draft ang legal na diwa ng μηδεμίαν αἰτίαν θανάτου at ang kahilingang ipinasa kay Pilato na ipapatay si Jesus. Ang concessive na pagbasa ng participle ay makatwiran sa konteksto at sinusuportahan ng English audit trail.
  naturalness: Malinaw ang draft, ngunit mas likas at mas marangal sa modernong Filipino ang “Bagaman wala silang nakitang batayan” kaysa “kahit wala silang natagpuang anumang batayan.” Iniiwasan din nito ang bahagyang mabigat na pagtutugma ng “wala” at “anumang.”
  terminology: Ang “batayan para sa hatol na kamatayan” ay angkop sa kontekstong panghukuman. Ang “ipapatay siya” ay wastong naghahayag ng kahilingang si Pilato ang magpapatupad o magpapapatupad ng pagpatay. Inayos ang unang alternatibong talababa upang malinaw na mapanatili ang negatibong saklaw ng Griyego.
