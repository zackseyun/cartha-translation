  text: And though they found no basis for a death sentence[b][a], they asked Pilate to have him executed.
translation:
  language: tl
  text: Bagaman wala silang nakitang batayan para sa hatol na kamatayan[a], hiniling nila kay Pilato na ipapatay siya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “walang paratang na nararapat sa kamatayan” o “walang legal na batayan para sa kamatayan.”
    reason: lexical_alternative
  - marker: b
    text: O, “na patayin siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Nagpapatuloy ito sa daloy ng salaysay nang hindi nagdaragdag ng sanhi o bunga.
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: anumang batayan para sa hatol na kamatayan
  rationale: Sa kontekstong panghukuman, ang αἰτία ay tumutukoy sa batayan o paratang na makapagbibigay-katwiran sa parusang kamatayan, hindi sa sanhi ng pagkamatay.
- source_word: εὑρόντες
  choice: kahit wala silang natagpuang
  rationale: 'Ang aorist participle ay tumutukoy sa naunang pangyayari, at ipinahihiwatig ng konteksto ang pagsalungat: humiling pa rin sila ng pagpatay bagaman walang natagpuang sapat na batayan.'
- source_word: ᾐτήσαντο
  choice: hiniling nila
  rationale: Ang pormal na kahilingan kay Pilato ay likas at malinaw na naihahayag ng “hiniling nila.”
- source_word: Πιλᾶτον
  choice: Pilato
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: ἀναιρεθῆναι αὐτόν
  choice: na ipapatay siya
  rationale: Sa kontekstong panghukuman, ang ἀναιρέω ay nangangahulugang patayin o ipapatay. Napananatili ng “ipapatay” ang diwang humiling sila kay Pilato na ipatupad ang pagpatay sa kanya.
theological_decisions:
- issue: Kung gagawing tahasan ang diwang pagsalungat ng participial clause
  choice: At kahit wala silang natagpuang anumang batayan …
  alternative: At nang wala silang matagpuang anumang batayan …
  rationale: 'Hindi tahasang concessive ang anyo ng Greek participle, ngunit malinaw sa konteksto ang tensiyon: humiling sila ng pagpatay sa kabila ng kawalan ng batayan. Ipinapahayag ito ng “kahit” nang hindi dinaragdagan o nilulutas ang teolohikal at moral na tensiyon ng salaysay.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kontekstong panghukuman sa “batayan para sa hatol na kamatayan,” samantalang ang “ipapatay” ay natural na nagpapahayag ng kahilingang ipatupad ni Pilato ang pagpatay.
