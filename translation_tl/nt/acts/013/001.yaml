id: ACT.13.1
reference: Acts 13:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἦσαν ⸀δὲ ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν προφῆται καὶ διδάσκαλοι ὅ τε Βαρναβᾶς καὶ Συμεὼν ὁ καλούμενος Νίγερ, καὶ Λούκιος ὁ Κυρηναῖος, Μαναήν τε Ἡρῴδου τοῦ τετραάρχου σύντροφος καὶ Σαῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/001.yaml
  text: 'In Antioch[a], in the church there, there were prophets and teachers: Barnabas, Simeon who was called Niger, Lucius the Cyrenian, Manaen, a close companion of Herod the tetrarch[c][b], and Saul.'
translation:
  language: tl
  text: 'Sa iglesya sa Antioquia ay may mga propeta at mga guro: sina Bernabe, Simeon na tinatawag na Niger[a], Lucio na taga-Cirene[b], Manaen na malapit na kasamahan ni Herodes na tetrarka[c], at Saulo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Niger” ay pangalang Latin na nangangahulugang “itim.” Pinanatili rito bilang pantanging pangalan sa halip na isalin.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, si Lucio ay mula sa Cirene sa Hilagang Aprika.
    reason: cultural_note
  - marker: c
    text: Maaari ring “kapatid na inarugang kasama ni Herodes na tetrarka” o “kasamang lumaki ni Herodes na tetrarka.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: ay may
  rationale: Ipinahahayag nito nang likas sa Tagalog ang pag-iral ng mga propeta at guro. Hindi na ginawan ng hiwalay na katumbas ang mahinang pang-ugnay na δέ sapagkat malinaw ang pagpapatuloy sa konteksto.
- source_word: ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν
  choice: Sa iglesya sa Antioquia
  rationale: Pinagsama nang natural ang dalawang pariralang panlunan habang pinananatiling malinaw na ang tinutukoy ay ang lokal na kongregasyon sa Antioquia.
- source_word: ἐκκλησίαν
  choice: iglesya
  rationale: Karaniwan at malinaw itong tawag sa kongregasyong Kristiyano sa modernong Filipino.
- source_word: προφῆται καὶ διδάσκαλοι
  choice: mga propeta at mga guro
  rationale: Tuwirang salin ng dalawang pangkat o tungkuling binanggit sa teksto, nang hindi nagdaragdag ng kalaunang estrukturang pang-institusyon.
- source_word: Συμεὼν ὁ καλούμενος Νίγερ
  choice: Simeon na tinatawag na Niger
  rationale: Pinanatili ang anyong Simeon at ang Niger bilang pantanging pangalan; ipinaliwanag sa talababa ang kahulugan ng Latin na pangalan.
- source_word: Λούκιος ὁ Κυρηναῖος
  choice: Lucio na taga-Cirene
  rationale: Likas sa Filipino ang 'taga-Cirene' upang ipahayag na siya ay mula sa lunsod ng Cirene.
- source_word: Μαναήν
  choice: Manaen
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan.
- source_word: Ἡρῴδου τοῦ τετραάρχου
  choice: ni Herodes na tetrarka
  rationale: Pinanatili ang titulong nasa Griyego nang hindi idinaragdag ang pangalang Antipas, na wala sa talata.
- source_word: σύντροφος
  choice: matalik na kasamahan
  rationale: Ipinahahayag nito ang malapit na ugnayan nang hindi ipinipilit na tiyak na magkapatid sa pag-aaruga sila; inilalahad sa talababa ang posibleng mas espesipikong diwa.
- source_word: Σαῦλος
  choice: Saulo
  rationale: Karaniwang anyong Filipino ng personal na pangalan.
theological_decisions:
- issue: Kalikasan ng mga katawagang propeta at guro sa Antioquia
  choice: Isinalin bilang 'mga propeta at mga guro' na mga kinikilalang gawain o tungkulin sa lokal na iglesya.
  alternative: Ituring ang mga ito bilang pormal na katungkulan ayon sa isang kalaunang sistemang pansimbahan.
  rationale: Binabanggit ng talata ang dalawang kategorya ngunit hindi nito inilalarawan ang isang buong herarkiya o kalaunang kaayusang pansimbahan.
- issue: Kahulugan ng σύντροφος kaugnay ni Herodes
  choice: matalik na kasamahan
  alternative: kapatid sa pag-aaruga; kasamang lumaki
  rationale: Maaaring tumukoy ang salita sa taong pinalaking kasama ng isa pa, ngunit hindi ganap na tiyak ang eksaktong panlipunang ugnayan. Pinananatiling malawak ang pangunahing teksto at inilalagay sa talababa ang mas espesipikong mga posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga nakagawiang anyong Filipino ng mga pangalang biblikal at ang 'tetrarka' upang mapanatili ang historikal na titulo. Inayos ang mga pananda ng talababa upang tuwirang tumugma sa Niger, Cirene, at sa malabong kahulugan ng σύντροφος.
