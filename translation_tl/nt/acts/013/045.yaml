  text: ἰδόντες δὲ οἱ Ἰουδαῖοι τοὺς ὄχλους ἐπλήσθησαν ζήλου καὶ ἀντέλεγον τοῖς ⸀ὑπὸ Παύλου ⸀λαλουμένοις ⸀βλασφημοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/045.yaml
  text: But when the Jews saw the crowds[a], they were filled with jealousy and began contradicting what was spoken by Paul[c][b], blaspheming.
translation:
  language: tl
  text: Ngunit nang makita ng mga Judio[a] ang mga pulutong, napuno sila ng inggit[b] at sinalungat nila ang mga sinasabi ni Pablo[c] habang nanglalait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tinutukoy ay ang lokal na grupo ng mga Judio na sumasalungat kay Pablo sa tagpong ito, hindi ang buong lahing Judio.
    reason: cultural_note
  - marker: b
    text: Maaari ring “sigasig”; sa kontekstong ito, mas angkop ang negatibong diwang “inggit.”
    reason: lexical_alternative
  - marker: c
    text: O, “ang mga bagay na sinasalita ni Pablo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες δὲ
  choice: Ngunit nang makita
  rationale: Ginawang temporal ang aorist participle upang maging natural sa Tagalog, habang ipinahihiwatig ng “Ngunit” ang pagliko mula sa positibong tugon sa naunang talata.
- source_word: οἱ Ἰουδαῖοι
  choice: mga Judio
  rationale: Pinanatili ang tahasang katawagan ng Griyego nang hindi ito pinakikitid sa “mga pinunong Judio”; nililinaw ng talababa na lokal na grupong sumasalungat ang tinutukoy.
- source_word: τοὺς ὄχλους
  choice: ang napakaraming tao
  rationale: Ang pangmaramihang ὄχλους ay tumutukoy sa malalaking pulutong; mas likas sa modernong Tagalog ang “napakaraming tao” kaysa sa literal na “mga pulutong.”
- source_word: ἐπλήσθησαν ζήλου
  choice: napuno sila ng inggit
  rationale: Maaaring mangahulugan ang ζῆλος ng sigasig o inggit, ngunit ang pagsalungat at paglapastangan sa konteksto ay pumapabor sa negatibong diwa.
- source_word: ἀντέλεγον
  choice: Sinalungat nila
  rationale: Ipinahahayag nito ang aktibong pagsasalita laban sa mensahe. Hindi idinagdag ang “nagsimula” sapagkat hindi kailangang ipakahulugang inceptive ang imperfect.
- source_word: τοῖς ὑπὸ Παύλου λαλουμένοις
  choice: ang mga sinasabi ni Pablo
  rationale: Natural na salin ng articular passive participle sa Tagalog; pinananatili ang pagtuon sa nilalaman ng sinasabi ni Pablo.
- source_word: βλασφημοῦντες
  choice: nagsalita sila nang lapastangan
  rationale: Pinananatili ang bigat ng βλασφημέω ngunit hindi tinutukoy kung sino ang tuwirang nilalapastangan, sapagkat hindi ito tahasang sinasabi ng Griyego.
theological_decisions:
- issue: Posibleng pagbasa sa οἱ Ἰουδαῖοι bilang paghatol sa lahat ng Judio
  choice: mga Judio[a]
  alternative: mga pinunong Judio; mga taga-Judea
  rationale: Ang teksto ay nagsasabing “mga Judio” at hindi espesipikong “mga pinuno.” Gayunman, sa tagpong ito, isang lokal na grupong kumokontra kay Pablo ang tinutukoy, hindi ang buong lahing Judio.
- issue: Hindi tahasang layon ng βλασφημοῦντες
  choice: nagsalita sila nang lapastangan
  alternative: nilapastangan nila ang Diyos; nilait nila si Pablo
  rationale: Walang tahasang layon ang participle sa Griyego, kaya hindi tinukoy ng salin kung ang Diyos, ang mensahe, o si Pablo ang tuwirang pinatutungkulan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Gumamit ng “Judio,” “inggit,” “sinalungat,” at “lapastangan” bilang pormal ngunit karaniwang bokabularyo. Hinati sa dalawang pangungusap upang maging malinaw at natural nang hindi binabago ang ugnayan ng mga kilos.
