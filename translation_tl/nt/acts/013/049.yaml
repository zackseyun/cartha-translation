  yaml_path: translation/nt/acts/013/049.yaml
  text: And the word of the Lord was being spread throughout the whole region[a].
translation:
  language: tl
  text: At patuloy na lumaganap sa buong rehiyon ang salita ng Panginoon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mensahe ng Panginoon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφέρετο
  choice: patuloy na lumaganap
  rationale: Ipinahahayag ng imperpektong anyo ang nagpapatuloy na pangyayari sa nakaraan. Bagaman pasibo ang anyong Griyego, likas sa modernong Tagalog ang aktibong di-palipat na “lumaganap,” na hindi naman tumutukoy sa isang tiyak na tagapagpalaganap.
- source_word: δὲ
  choice: At
  rationale: Banayad na pang-ugnay ito na nagpapatuloy sa salaysay; natural at hindi labis na nagpapahiwatig ng pagsalungat ang “At.”
- source_word: ὁ λόγος
  choice: ang salita
  rationale: Pinananatili ng “salita” ang paulit-ulit na pananalita ni Lucas, habang ipinahihiwatig ng konteksto na tumutukoy ito sa ipinahahayag na mensahe.
- source_word: τοῦ κυρίου
  choice: ng Panginoon
  rationale: Pinananatili nito ang karaniwang biblikal at teolohikal na bigat ng κύριος nang hindi nililimitahan ang kahulugan sa karaniwang “amo.”
- source_word: δι’ ὅλης
  choice: sa buong
  rationale: Likas na ipinapahayag sa Tagalog ng “sa buong” ang paglaganap na umabot sa kabuuan ng isang lugar.
- source_word: τῆς χώρας
  choice: lalawigan
  rationale: Sa kontekstong ito, tumutukoy ang χώρα sa nakapaligid na heograpikong pook. Ang “lalawigan” ay malinaw at natural, bagaman hindi ito kinakailangang tumukoy sa isang modernong administratibong lalawigan.
theological_decisions:
- issue: Pagsalin sa κύριος
  choice: Panginoon
  alternative: Amo
  rationale: Ang “Panginoon” ang nakaugaliang saling nagpapanatili sa Kristolohikal at biblikal na taginting ng katawagan sa Mga Gawa, nang hindi ito pinapaliit tungo sa karaniwang ugnayan ng amo at lingkod.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “patuloy na lumaganap” upang ipakita ang nagpapatuloy na kilos ng imperpekto nang hindi lumilikha ng pilit na pasibong pangungusap.
