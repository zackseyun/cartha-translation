  yaml_path: translation/nt/acts/013/040.yaml
  text: 'Therefore watch out[a], lest what has been spoken in the prophets come upon you:'
translation:
  language: tl
  text: Kaya mag-ingat kayo, baka mangyari sa inyo ang sinabi sa mga aklat ng mga propeta:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “sa mga propeta.” Maaari ring unawain na “sa pamamagitan ng mga propeta.” Malamang na tumutukoy ito sa mga aklat ng mga propeta, kung saan matatagpuan ang babalang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: mag-ingat kayo
  rationale: Ang pangkasalukuyang pautos na nasa ikalawang panauhang maramihan ay isang tuwirang babala. Natural at malinaw sa makabagong Tagalog ang “mag-ingat kayo.”
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita nito ang konklusyon o babalang bunga ng naunang pahayag; mas natural sa daloy ng Tagalog ang “Kaya” kaysa sa mas pormal na “Samakatuwid.”
- source_word: μὴ ἐπέλθῃ
  choice: baka mangyari sa inyo
  rationale: Ang μή na may aorist subjunctive kasunod ng pautos ay nagpapahayag ng babala sa isang maaaring sumapit. Ang “baka” ay likas na katumbas nito sa Tagalog, at ang “mangyari sa inyo” ay malinaw na naghahatid ng diwa ng pagdating o pagsapit ng babala.
- source_word: τὸ εἰρημένον
  choice: ang sinabi
  rationale: Ang substantival perfect passive participle ay tumutukoy sa bagay na naipahayag. Ang “ang sinabi” ay maikli, natural, at hindi nagdaragdag ng hindi tahasang nasa teksto.
- source_word: ἐν τοῖς προφήταις
  choice: sa mga propeta
  rationale: 'Pinananatili ng “sa” ang kalabuan ng ἐν: maaari itong tumukoy sa bahaging nasa koleksiyon ng mga sulat ng mga propeta, habang hindi lubusang isinasara ang posibilidad na mga propeta bilang tagapagsalita ang tinutukoy.'
theological_decisions:
- issue: Tinutukoy ng “mga propeta”
  choice: Ang mga propeta bilang bahagi o koleksiyon ng Kasulatan kung saan matatagpuan ang babala
  alternative: Ang mga taong propeta bilang mga nagsabi ng babala
  rationale: Kasunod nito ay sisipi si Pablo mula sa Habakuk, kaya malamang na ang tinutukoy ay ang nasa mga aklat ng mga propeta. Gayunman, pinananatili ng saling “sa mga propeta” ang tunay na kalabuan ng parirala.
translation_notes:
  register: Makabago, tuwiran, at marangal na Tagalog. Ginamit ang “mag-ingat kayo” para sa agarang babala at “baka mangyari sa inyo” bilang natural na pagpapahayag ng nagbabantang pagsapit.
