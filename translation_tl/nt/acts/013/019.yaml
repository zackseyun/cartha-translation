  text: And after destroying seven nations in the land of Canaan[a], he gave them their land as an inheritance.
translation:
  language: tl
  text: At matapos niyang lupigin ang pitong bansa sa lupain ng Canaan, ibinigay niya sa kanila bilang mana ang lupain ng mga bansang iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ipinamahagi niya sa kanila ang lupain ng mga bansang iyon” o “itinalaga niya sa kanila ang lupain ng mga bansang iyon bilang mana.” Maaaring idiin ng pandiwang Griyego ang pamamahagi o pagtatalaga ng lupain bilang mana.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: matapos niyang pabagsakin
  rationale: Ang aorist participle ng καθαιρέω ay tumutukoy sa paggapi ng Diyos sa mga bansang Cananeo. Likas sa Filipino ang “pabagsakin” at pinananatili nito ang puwersa ng salita nang hindi kinakailangang ipahiwatig na nilipol ang bawat tao.
- source_word: ἔθνη ἑπτὰ
  choice: pitong bansa
  rationale: Sa konteksto ng pagsakop sa Canaan, malinaw at karaniwan ang “pitong bansa” para sa ἔθνη ἑπτὰ.
- source_word: ἐν γῇ Χανάαν
  choice: sa lupain ng Canaan
  rationale: Pinananatili ang tahasang γῇ (“lupain”) sa halip na paikliin bilang “sa Canaan.”
- source_word: κατεκληρονόμησεν
  choice: ibinigay niya sa kanila bilang mana
  rationale: Ipinahahayag nito ang pagbibigay o paghahati ng lupain bilang minana. Nililinaw ng “sa kanila” ang ipinahiwatig na tatanggap—ang Israel—sa natural na Filipino.
- source_word: τὴν γῆν αὐτῶν
  choice: ang lupain ng mga bansang iyon
  rationale: Ang αὐτῶν ay tumutukoy sa pitong bansang kababanggit. Iniiwasan ng tahasang parirala ang posibleng kalituhan ng “kanilang lupain” kasunod ng “sa kanila,” na tumutukoy naman sa Israel.
theological_decisions:
- issue: Simuno at ipinahiwatig na tumanggap ng mana
  choice: Ang Diyos ang simuno ng parehong kilos, at ang Israel ang ipinahiwatig na tumanggap ng lupain bilang mana.
  alternative: Isalin lamang na “ipinamahagi niya ang lupain ng mga iyon,” nang hindi tahasang binabanggit ang tumanggap.
  rationale: Sa agarang konteksto, inilalahad ang mga ginawa ng Diyos sa kasaysayan ng Israel. Hindi tahasang nasa Griyego ang di-tuwirang layon, ngunit malinaw ito sa konteksto; kaya ang “sa kanila” ay isang idyomatikong paglilinaw, hindi dagdag na doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pabagsakin” sa halip na “lipulin” upang mapanatili ang saklaw ng καθαιρέω, at inulit nang tahasan ang “mga bansang iyon” upang malinaw ang magkaibang tinutukoy ng tatanggap at dating nagmamay-ari ng lupain.
