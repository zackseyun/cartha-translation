id: ACT.13.44
reference: Acts 13:44
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τῷ ⸀δὲ ἐρχομένῳ σαββάτῳ σχεδὸν πᾶσα ἡ πόλις συνήχθη ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/044.yaml
  text: On the coming Sabbath[b][a], nearly the whole city gathered together to hear the word of the Lord.
translation:
  language: tl
  text: Sa sumunod na Sabbath[a], halos buong lungsod ang nagtipon upang pakinggan ang salita ng Panginoon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sa darating na Sabbath” o “Sa kasunod na Sabbath.”
    reason: lexical_alternative
  - marker: b
    text: Ang “salita ng Panginoon” ay maaari ring maunawaan bilang “mensahe ng Panginoon” o, ayon sa konteksto, “mensahe tungkol sa Panginoon.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τῷ δὲ ἐρχομένῳ σαββάτῳ
  choice: Sa sumunod na Sabbath
  rationale: Ang pariralang datibo ay nagsasaad ng panahon. Ang “sumunod na Sabbath” ay natural sa modernong Filipino at saklaw ang diwang “darating” o “kasunod” nang hindi pinipilit ang mas tiyak na pagitan ng panahon.
- source_word: σχεδὸν
  choice: halos
  rationale: Tuwirang katumbas ng σχεδόν at natural na kaakibat ng “buong lungsod.”
- source_word: πᾶσα ἡ πόλις
  choice: buong lungsod
  rationale: Pinananatili nito ang malawak at retorikal na pahayag tungkol sa populasyon ng lungsod, nang hindi ipinapalagay na bawat isang tao ay naroon.
- source_word: συνήχθη
  choice: nagtipon
  rationale: Bagaman anyong pasibo ang pandiwa sa Griyego, dito ay likas ang diwang nagkatipon o nagsama-sama ang mga tao. Maikli at natural ang “nagtipon.”
- source_word: ἀκοῦσαι
  choice: upang pakinggan
  rationale: Ipinakikita ng pawatas ang layunin ng pagtitipon. Mas natural sa Filipino ang “pakinggan” kapag sinasadyang makinig sa ipinahahayag na mensahe.
- source_word: τὸν λόγον
  choice: ang salita
  rationale: Pinananatili ng “salita” ang paulit-ulit na terminolohiya ni Lucas para sa ipinahahayag na mensahe, sa halip na agad itong paliitin sa isang interpretatibong pagpapakahulugan.
- source_word: τοῦ κυρίου
  choice: ng Panginoon
  rationale: Ang “Panginoon” ang karaniwang marangal na salin ng κύριος. Pinananatili ng pariralang genitibo ang kaugnayan ng salita sa Panginoon nang hindi tiyakang nagpapasya kung ito ay mula sa kanya, pag-aari niya, o tungkol sa kanya.
theological_decisions:
- issue: Paglilipat ng κύριος
  choice: Panginoon
  alternative: Ginoo o Amo
  rationale: Ang “Panginoon” ang natural at kinikilalang salin sa konteksto ng pagpapahayag sa Mga Gawa, ngunit hindi nito tinutukoy nang higit sa sinasabi ng talata kung sino ang tinutukoy rito.
- issue: Kahulugan ng “τὸν λόγον τοῦ κυρίου”
  choice: ang salita ng Panginoon
  alternative: ang mensahe ng Panginoon; ang mensahe tungkol sa Panginoon
  rationale: Pinananatili ng tradisyonal ngunit natural na parirala ang posibleng magkakapatong na diwa ng genitibo at iniiwasang lutasin ang tunay na kalabuan ng teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang terminong “Sabbath” dahil tiyak itong katawagang pangkultura at panrelihiyon sa konteksto. Ang ayos na “halos buong lungsod ang nagtipon” ay natural na Filipino at nananatiling malapit sa retorikal na lakas ng Griyego.
