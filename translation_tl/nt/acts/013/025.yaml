  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς δὲ ἐπλήρου ⸀Ἰωάννης τὸν δρόμον, ἔλεγεν· ⸂Τί ἐμὲ⸃ ὑπονοεῖτε εἶναι; οὐκ εἰμὶ ἐγώ· ἀλλ’ ἰδοὺ ἔρχεται μετ’ ἐμὲ οὗ οὐκ εἰμὶ ἄξιος τὸ ὑπόδημα τῶν ποδῶν λῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/025.yaml
  text: And as John was completing his course[a], he kept saying, ‘What do you suppose me to be? I am not he. But look, one is coming after me[b], the sandals of whose feet I am not worthy to untie.’
translation:
  language: tl
  text: Habang tinatapos ni Juan ang kanyang takbuhin, lagi niyang sinasabi, “Ano sa palagay ninyo ako? Hindi ako iyon.[a] Ngunit masdan ninyo, may dumarating pagkatapos ko, at hindi ako karapat-dapat na kalagin ang sandalyas[b] sa kanyang mga paa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tahasan, “Hindi ako ang Mesiyas.” Hindi binabanggit sa Griyego kung sino ang itinatanggi ni Juan na siya, bagaman ipinahihiwatig ng konteksto na ang tinutukoy ay ang Mesiyas.
    reason: alternative_reading
  - marker: b
    text: Sa ilang manuskrito at salin, mas tiyak itong “kalagin ang tali ng kanyang mga sandalyas.” Ngunit sa tekstong Griyego na sinusunod dito ay “sandalyas” lamang ang mababasa, hindi “tali.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήρου ... τὸν δρόμον
  choice: tinatapos ... ang kanyang takbuhin
  rationale: Ipinahahayag ng “tinatapos” ang nagpapatuloy na pag-abot sa wakas, at pinananatili ng “takbuhin” ang metapora para sa itinakdang gawain o ministeryo ni Juan.
- source_word: ἔλεγεν
  choice: lagi niyang sinasabi
  rationale: Ipinahihiwatig ng imperpektong anyo ang paulit-ulit o patuloy na patotoo ni Juan, hindi lamang isang minsanang pahayag.
- source_word: Τί ἐμὲ ὑπονοεῖτε εἶναι;
  choice: Ano ang akala ninyo sa akin?
  rationale: Likas ito sa makabagong Filipino at naipahahayag ang tanong tungkol sa ipinapalagay nilang pagkakakilanlan ni Juan, habang pinananatili ang diwa ng τί at ὑπονοεῖτε.
- source_word: οὐκ εἰμὶ ἐγώ
  choice: Hindi ako iyon
  rationale: Pinananatili nito ang maikli at di-tahasang pagtanggi ng Griyego; hindi nito ipinapasok sa pangunahing teksto ang “Mesiyas,” bagaman iyon ang malamang na tinutukoy sa konteksto.
- source_word: ἀλλ’ ἰδοὺ
  choice: Ngunit masdan ninyo
  rationale: Ang “masdan ninyo” ay isang marangal ngunit nauunawaang panawag-pansin na katumbas ng puwersa ng ἰδού.
- source_word: ἔρχεται μετ’ ἐμὲ
  choice: may dumarating na kasunod ko
  rationale: Naipahahayag nito ang buhay at nalalapit na diwa ng pangkasalukuyang pandiwa at ang kaugnayan ng dumarating kay Juan.
- source_word: οὗ ... τὸ ὑπόδημα τῶν ποδῶν λῦσαι
  choice: kalagin ang sandalyas ... sa kanyang mga paa
  rationale: Ang “sandalyas” ay likas na pangkalahatang salin ng isahang ὑπόδημα sa kontekstong tumutukoy sa kasuotang nasa mga paa; ang “kalagin” ay tuwirang katumbas ng λύω rito. Hindi idinagdag ang “tali” sa pangunahing teksto sapagkat wala itong hiwalay na pangngalan sa nakalimbag na Griyego.
- source_word: ἄξιος
  choice: karapat-dapat
  rationale: Malinaw at karaniwang katumbas ito ng ἄξιος bilang pahayag ng pagiging marapat o angkop.
theological_decisions:
- issue: Ang pagkakakilanlang itinatanggi ni Juan sa οὐκ εἰμὶ ἐγώ
  choice: Hindi ako iyon
  alternative: Hindi ako ang Mesiyas
  rationale: Malakas na ipinahihiwatig ng konteksto na itinatanggi ni Juan na siya ang Mesiyas, ngunit hindi tahasang binabanggit ng Griyego ang titulong iyon. Pinananatili ng pangunahing teksto ang elipsis at nililinaw ng talababa ang malamang na tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “takbuhin” upang mapanatili ang metapora ng δρόμος, at “lagi niyang sinasabi” upang maipakita ang nagpapatuloy o paulit-ulit na kilos. Inilagay ang mga panandang [a] at [b] sa mismong mga pariralang nililinaw ng kani-kanilang talababa.
