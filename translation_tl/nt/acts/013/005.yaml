  text: καὶ γενόμενοι ἐν Σαλαμῖνι κατήγγελλον τὸν λόγον τοῦ θεοῦ ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων· εἶχον δὲ καὶ Ἰωάννην ὑπηρέτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/005.yaml
  text: And when they arrived at Salamis[a], they proclaimed the word of God in the synagogues of the Jews[b]; and they also had John as an assistant.
translation:
  language: tl
  text: Pagdating nila sa Salamis[a], ipinahayag nila ang salita ng Diyos sa mga sinagoga ng mga Judio. Kasama rin nila si Juan bilang katulong.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nang makarating sila sa Salamis.”
    reason: lexical_alternative
  - marker: b
    text: O “bilang katuwang” o “bilang alalay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενοι ἐν Σαλαμῖνι
  choice: Pagdating nila sa Salamis
  rationale: Ang aorist participle na γενόμενοι kasama ng pariralang panlunan ay likas na nagpapahiwatig ng pagdating. Pinananatili ng “Pagdating nila” ang temporal na ugnayan at natural ito sa modernong Tagalog.
- source_word: κατήγγελλον
  choice: ipinahayag nila
  rationale: Ang καταγγέλλω ay tumutukoy sa hayagan o pampublikong pagpapahayag. Ang “ipinahayag” ay malinaw at hindi nililimitahan ang gawain sa pormal na pangangaral lamang.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Tuwirang pinananatili nito ang genitibong kayarian at ang posibleng diwa ng mensahe o kapahayagan mula sa Diyos nang hindi labis na nagpapakahulugan.
- source_word: ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων
  choice: sa mga sinagoga ng mga Judio
  rationale: Ang “sinagoga” ang tiyak at kinikilalang katawagan sa mga lugar o kapulungan ng pagsamba ng mga Judio; sa kontekstong ito, etniko-relihiyoso ang Ἰουδαίων, hindi panrehiyon.
- source_word: εἶχον δὲ καὶ Ἰωάννην
  choice: Kasama rin nila si Juan
  rationale: Likas na ipinahahayag sa Tagalog ang pagkakaroon nila kay Juan sa kanilang pangkat sa pamamagitan ng “kasama nila,” habang pinananatili ng “rin” ang dagdag na diin ng καί at ng δέ bilang banayad na paglipat.
- source_word: ὑπηρέτην
  choice: bilang katuwang
  rationale: Ang ὑπηρέτης ay maaaring katulong, tagapaglingkod, o alalay. Ang “katuwang” ay angkop sa konteksto ng gawaing misyon at umiiwas sa di-kinakailangang pahiwatig ng pagkaalipin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Judio,” “sinagoga,” at “salita ng Diyos” bilang mga pamilyar na terminong biblikal, habang ang “katuwang” ay madaling maunawaan at hindi labis na teknikal.
