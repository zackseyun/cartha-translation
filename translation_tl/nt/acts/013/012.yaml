  text: τότε ἰδὼν ὁ ἀνθύπατος τὸ γεγονὸς ἐπίστευσεν ἐκπλησσόμενος ἐπὶ τῇ διδαχῇ τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/012.yaml
  text: Then[a], when the proconsul saw what had happened, he believed[b], being astonished at the teaching of the Lord.
translation:
  language: tl
  text: Nang makita ng proconsul ang nangyari, sumampalataya siya, na namangha sa turo ng Panginoon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “turo ng Panginoon,” “turo mula sa Panginoon,” o “turo tungkol sa Panginoon.” Maaaring maunawaan sa higit sa isang paraan ang anyong Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Nang
  rationale: Sa Filipino, likas na naipahihiwatig ng sugnay na “Nang makita” ang kasunod na pangyayari; hindi na kailangan ang tahasang “Pagkatapos” o “Noon,” na magiging mabigat kapag isinama rito.
- source_word: ἰδὼν
  choice: Nang makita
  rationale: Ginawang temporal na sugnay ang aorist participle upang maging natural sa Filipino habang pinananatili ang ugnayang temporal sa pangunahing pandiwa.
- source_word: ὁ ἀνθύπατος
  choice: ang proconsul
  rationale: Pinananatili ang tiyak na titulong Romano sa halip na gawing pangkalahatang “gobernador.”
- source_word: τὸ γεγονός
  choice: ang nangyari
  rationale: Natural at malinaw itong katumbas ng substantival perfect participle na tumutukoy sa naganap at nasaksihan na pangyayari.
- source_word: ἐπίστευσεν
  choice: sumampalataya siya
  rationale: Ipinapahayag nito ang pananampalataya sa kontekstong panrelihiyon nang hindi nagdaragdag ng tahasang layon na wala sa Griyego.
- source_word: ἐκπλησσόμενος
  choice: sapagkat namangha siya
  rationale: Ipinapakita ng participle ang kalagayang kasabay at maaaring may ugnayang dahilan sa pagsampalataya; likas sa Filipino ang sugnay na ito, bagaman hindi nito ipinipilit na ang pagkamangha lamang ang sanhi.
- source_word: ἐπὶ τῇ διδαχῇ
  choice: sa turo
  rationale: Ang “sa” ay natural na pananda ng bagay o batayan ng pagkamangha sa Filipino.
- source_word: τοῦ κυρίου
  choice: ng Panginoon
  rationale: Pinananatili ng hulaping “ng Panginoon” ang lawak ng Griyegong genitive at hindi agad nagpapasiya kung ang turo ay mula sa Panginoon o tungkol sa Panginoon.
theological_decisions:
- issue: Kahulugan ng πιστεύω na walang tahasang layon
  choice: “sumampalataya siya,” na walang idinagdag na layon
  alternative: “sumampalataya siya sa Panginoon” o “naniwala siya sa mensahe”
  rationale: Ipinahihiwatig ng konteksto ang pananampalatayang Kristiyano, ngunit walang tahasang layon ang pandiwa sa Griyego; kaya hindi ito dinagdagan.
- issue: Saklaw ng “turo ng Panginoon”
  choice: Pinanatili ang “turo ng Panginoon” at nilagyan ng talababa
  alternative: “turo mula sa Panginoon” o “turo tungkol sa Panginoon”
  rationale: Maaaring maunawaan ang genitive bilang pinagmulan, pag-aari, o paksa. Hindi dapat tahimik na piliin ang isa lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “proconsul” para sa katumpakang pangkasaysayan at “sumampalataya” para sa kontekstong panrelihiyon. Ang talababa ay inilagay kaagad sa pariralang tinutukoy nito.
