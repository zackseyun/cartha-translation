  - marker: a
    text: Maaari ring “turo ng Panginoon,” “turo mula sa Panginoon,” o “turo tungkol sa Panginoon.” Maaaring maunawaan sa higit sa isang paraan ang anyong Griyego.
    reason: alternative_reading
  revision_rationale: Pinalitan ang pang-ugnay na “sapagkat” ng “na namangha” upang hindi gawing tiyak na sanhi ng pagsampalataya ang pagkamangha. Inayos din ang talababa upang malinaw na maitala ang iba’t ibang posibleng pag-unawa sa genitive ng “Panginoon.”
