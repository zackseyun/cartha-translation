  source_fidelity: Tumpak na naihahatid ng salin ang temporal na ugnayan ng ὡς δέ, ang pagkaganap ng lahat ng nakasulat tungkol sa kanya, ang magkakasunod na pagbaba at paglilibing, at ang μνημεῖον bilang libingan. Ang “kahoy” para sa ξύλον ay leksikal na mapagtatanggol at hindi ipinapalit nang walang batayan ang “krus” sa pangunahing teksto.
  naturalness: Malinaw, makabago, at marangal ang daloy ng Tagalog. Ang pag-uugnay ng dalawang kilos sa “ibinaba nila siya ... at inilagay sa isang libingan” ay natural; malinaw sa konteksto na siya rin ang inilagay.
