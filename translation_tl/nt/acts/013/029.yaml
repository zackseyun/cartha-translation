id: ACT.13.29
reference: Acts 13:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς δὲ ἐτέλεσαν πάντα τὰ περὶ αὐτοῦ γεγραμμένα, καθελόντες ἀπὸ τοῦ ξύλου ἔθηκαν εἰς μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/029.yaml
  text: And when they had carried out all that had been written concerning him[a], they took him down from the tree and laid him in a tomb.
translation:
  language: tl
  text: At nang maisagawa nila ang lahat ng nakasulat tungkol sa kanya, ibinaba nila siya mula sa kahoy[a] at inilagay sa isang libingan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “krus.” Ang salitang Griyego na ξύλον ay literal na “kahoy” o “punongkahoy,” ngunit maaari rin itong tumukoy sa kagamitang kahoy na ginagamit sa pagbitay. Posibleng ipinahihiwatig din nito ang Deuteronomio 21:23.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: At nang
  rationale: Likas na nag-uugnay sa naunang salaysay at nagpapahayag ng panahong sinundan ng susunod na pangyayari.
- source_word: ἐτέλεσαν
  choice: maisagawa nila
  rationale: Ipinapakita nitong dinala nila sa kaganapan sa pamamagitan ng kanilang mga ginawa ang mga bagay na nakasulat, nang hindi ipinapalagay na sinadya nilang tuparin ang mga iyon.
- source_word: πάντα τὰ περὶ αὐτοῦ γεγραμμένα
  choice: ang lahat ng nakasulat tungkol sa kanya
  rationale: Pinananatili ang malawak na saklaw ng πάντα at ang diwa ng isang nauna nang umiiral na nakasulat na patotoo tungkol kay Jesus.
- source_word: καθελόντες
  choice: ibinaba nila siya
  rationale: Isinasalin ang aorist participle bilang kasunod na kilos sa natural na salaysay sa Tagalog.
- source_word: ἀπὸ τοῦ ξύλου
  choice: mula sa kahoy
  rationale: Ang ξύλον ay maaaring tumukoy sa kahoy, puno, o kagamitang kahoy sa pagbitay. Ang “kahoy” ay nagpapanatili sa salitang pinili ng Griyego at sa posibleng alusyon sa Deuteronomio 21:23, habang nililinaw sa talababa ang kontekstuwal na “krus.”
- source_word: ἔθηκαν
  choice: inilagay
  rationale: Natural at marangal na pandiwa para sa paglalagak ng katawan sa libingan.
- source_word: εἰς μνημεῖον
  choice: sa isang libingan
  rationale: Sa kontekstong ito, ang μνημεῖον ay isang lugar na pinaglibingan; malinaw at karaniwan sa modernong Tagalog ang “libingan.”
theological_decisions:
- issue: Pagpapakahulugan sa ξύλον sa salaysay ng pagpapako
  choice: kahoy
  alternative: krus; punongkahoy
  rationale: Hindi σταυρός kundi ξύλον ang nasa Griyego. Pinananatili ng “kahoy” ang tunay na lawak ng salita at ang posibleng ugnayan sa sumpa sa nakabitin sa kahoy, nang hindi tahimik na pinapalitan ito ng mas tiyak na katawagang “krus.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na daloy ng salaysay at ang leksikal na tensiyon ng ξύλον nang hindi gumagamit ng labis na teknikal o denominasyonal na pananalita.
