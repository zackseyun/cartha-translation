id: ACT.13.27
reference: Acts 13:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ γὰρ κατοικοῦντες ἐν Ἰερουσαλὴμ καὶ οἱ ἄρχοντες αὐτῶν τοῦτον ἀγνοήσαντες καὶ τὰς φωνὰς τῶν προφητῶν τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας κρίναντες ἐπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/027.yaml
  text: For those who live in Jerusalem and their rulers[a], because they did not recognize this one and by condemning him fulfilled the voices of the prophets that are read every Sabbath[b],
translation:
  language: tl
  text: Sapagkat ang mga naninirahan sa Jerusalem at ang kanilang mga pinuno, dahil hindi nila kinilala ang taong ito[a] ni ang mga pahayag ng mga propeta[b] na binabasa tuwing Sabbath, ay tinupad ang mga iyon sa paghatol nila sa kanya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “ang isang ito,” na maaaring magbigay-diin sa pagtukoy kay Jesus.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang mga tinig ng mga propeta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: ang mga naninirahan sa Jerusalem
  rationale: Likas at malinaw na panumbas sa substantival participle na tumutukoy sa mga taong nakatira sa Jerusalem.
- source_word: οἱ ἄρχοντες αὐτῶν
  choice: ang kanilang mga pinuno
  rationale: Saklaw ng “mga pinuno” ang pampamahalaan at panghukumang awtoridad ng ἄρχοντες nang hindi nagpapasok ng mas tiyak na titulong wala sa teksto.
- source_word: τοῦτον
  choice: ang taong ito
  rationale: Pinananatili ang demonstratibong diin ng τοῦτον at natural na tumutukoy kay Jesus sa Filipino; ipinapaliwanag sa talababa ang mas literal na anyo.
- source_word: ἀγνοήσαντες
  choice: dahil hindi nila nakilala … ni naunawaan
  rationale: Iisang Griyegong participle ang kaugnay ng dalawang layon. Ang “nakilala” ay angkop sa pagtukoy kay Jesus, samantalang ang “naunawaan” ay likas para sa pahayag ng mga propeta; pinananatili ng “dahil” ang sanhi o paliwanag na puwersa ng participle sa konteksto.
- source_word: τὰς φωνὰς τῶν προφητῶν
  choice: ang mga pahayag ng mga propeta
  rationale: Ang “mga pahayag” ay natural sa makabagong Filipino para sa naririnig o binabasang mensahe ng mga propeta; ang literal na “mga tinig” ay inilalagay sa talababa.
- source_word: τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας
  choice: na binabasa tuwing Sabbath
  rationale: Direkta at natural na inilalarawan ang regular na pampublikong pagbasa sa bawat Sabbath.
- source_word: κρίναντες
  choice: sa paghatol nila sa kanya
  rationale: Ipinahahayag ang panghukumang paghatol kay Jesus at pinananatili ang instrumental na ugnayan nito sa pagtupad sa mga pahayag.
- source_word: ἐπλήρωσαν
  choice: tinupad ang mga iyon
  rationale: Ang “tinupad” ang malinaw na panumbas sa katuparan ng propetikong Kasulatan; ang “mga iyon” ay hayagang tumutukoy pabalik sa mga pahayag.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag o sanhi na ugnayan ng talata sa naunang pahayag.
theological_decisions:
- issue: Uri ng hindi pagkilala kay Jesus at sa propetikong patotoo
  choice: hindi nila nakilala ang taong ito ni naunawaan ang mga pahayag
  alternative: hindi nila alam kung sino siya at hindi nila alam ang mga pahayag
  rationale: Hindi ipinapalagay na wala silang anumang kaalaman tungkol kay Jesus o sa mga tekstong binabasa. Sa halip, pinananatili ang tensiyon na nabigo silang kilalanin siya at maunawaan ang kabuluhan ng propetikong patotoo.
- issue: Ugnayan ng paghatol kay Jesus at katuparan ng propesiya
  choice: tinupad ang mga iyon sa paghatol nila sa kanya
  alternative: nang hatulan nila siya, tinupad nila ang mga iyon
  rationale: 'Ang “sa paghatol” ay nagpapanatili sa posibleng instrumental na diwa: ang mismong paghatol nila ang naging paraan ng katuparan, nang hindi ipinahihiwatig na sinadya nilang tuparin ang propesiya.'
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Sabbath” bilang pamilyar na terminong biblikal. Pinanatili ang pangungusap na bukas sa dulo sa pamamagitan ng kuwit sapagkat nagpapatuloy ang balangkas ng Griyegong pangungusap sa susunod na talata.
