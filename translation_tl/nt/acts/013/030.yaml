  text: But God raised him from the dead.
translation:
  language: tl
  text: Ngunit binuhay siya ng Diyos mula sa mga patay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapakita rito ang δέ ng malinaw na pagsalungat sa naunang ginawa ng mga tao; natural na naipahahayag ito ng “Ngunit.”
- source_word: θεὸς
  choice: ang Diyos
  rationale: Ang θεός ang simuno at tuwirang tumutukoy sa Diyos.
- source_word: ἤγειρεν
  choice: binuhay
  rationale: Sa konteksto ng muling pagkabuhay, ang ἐγείρω ay nangangahulugang ibangon o buhayin mula sa kamatayan. Ang “binuhay” ay malinaw at natural sa modernong Tagalog, at hindi nangangailangan ng dagdag na paliwanag.
- source_word: αὐτὸν
  choice: siya
  rationale: Ang panghalip ay tumutukoy kay Jesus sa agarang konteksto.
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Pinananatili nito ang anyong maramihan ng νεκρῶν at ang diwang paglabas mula sa kalipunan o kalagayan ng mga patay, habang nananatiling likas sa Tagalog.
theological_decisions:
- issue: Pananalita tungkol sa muling pagkabuhay
  choice: Ngunit binuhay siya ng Diyos mula sa mga patay.
  alternative: Ngunit ibinangon siya ng Diyos mula sa mga patay.
  rationale: Malinaw na iniuukol ng talata sa Diyos ang pagkilos na nagbalik kay Jesus mula sa kamatayan. Ang “binuhay” ay tuwirang naghahatid ng kahulugang muling pagkabuhay; posible rin ang “ibinangon,” ngunit maaari itong maunawaan bilang karaniwang pagpapatayo kung walang konteksto.
translation_notes:
  register: Maikli, dignified, at natural na modernong Filipino. Ginamit ang “Ngunit” upang mapanatili ang pagsalungat sa naunang pangyayari at ang “mula sa mga patay” upang tapat na katawanin ang ἐκ νεκρῶν.
