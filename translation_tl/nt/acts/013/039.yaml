  yaml_path: translation/nt/acts/013/039.yaml
  text: In him everyone who believes is justified[a].
translation:
  language: tl
  text: Sa kanya, ang bawat sumasampalataya ay itinuturing na matuwid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Sa pamamagitan niya, ang bawat sumasampalataya ay itinuturing na matuwid.” Mas literal, ang pariralang Griyego na ἐν τούτῳ ay “sa/sa pamamagitan ng isang ito”; tumutukoy ito kay Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Sa kanya
  rationale: Ang demonstratibong τούτῳ ay tumutukoy kay Jesus sa naunang konteksto. Pinananatili ng “Sa kanya” ang personal at anaporikong pagtukoy, pati ang kaluwagan ng ἐν, nang hindi agad nililimitahan ito sa paraang instrumental.
- source_word: πᾶς ὁ πιστεύων
  choice: ang bawat sumasampalataya
  rationale: Ang articular present participle ay substantibo at pangkalahatan. Likas sa makabagong Tagalog ang “bawat sumasampalataya” at naihahatid nito ang saklaw na walang itinatangi.
- source_word: δικαιοῦται
  choice: ay itinuturing na matuwid
  rationale: Ipinahahayag nito ang pasibo at panghukuman o deklaratibong diwa ng δικαιόω, habang iniiwasan ang masyadong makitid na “pinawawalang-sala” at ang mas lumang terminong “inaaring-ganap.”
theological_decisions:
- issue: Ang tinutukoy ng ἐν τούτῳ
  choice: 'Personal na pagtukoy kay Jesus: “Sa kanya”'
  alternative: 'Instrumental na pagbasa: “Sa pamamagitan ng isang ito” o “sa pamamagitan niya”'
  rationale: Si Jesus ang malinaw na tinutukoy sa kalapit na konteksto. Gayunman, dahil maaaring magpahiwatig ang parirala ng lokasyon o paraan, inilalahad sa talababa ang mas literal at instrumental na posibilidad.
- issue: Ang diwa ng δικαιοῦται
  choice: 'Deklaratibo o panghukuman: “itinuturing na matuwid”'
  alternative: “pinawawalang-sala” o “ginagawang matuwid”
  rationale: Pinananatili ng salin ang panghukuman at deklaratibong lakas ng pandiwa nang hindi ito ginagawang simpleng pagpapawalang-sala lamang o tahasang moral na pagbabago.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sumasampalataya” bilang pamilyar ngunit buhay na terminong biblikal, at “itinuturing na matuwid” upang maging nauunawaan sa karaniwang mambabasa nang hindi isinasara ang teolohikal na diwa sa isang denominasyonal na pormula.
