base_translation:
  language: en
  yaml_path: translation/nt/acts/013/008.yaml
  text: But Elymas the magician opposed them—for that is how his name is translated—seeking to turn the proconsul away from the faith[a][b].
translation:
  language: tl
  text: Ngunit patuloy silang sinalungat ni Elimas na salamangkero—sapagkat ganoon binibigyang-kahulugan ang kaniyang pangalan[b]—habang sinisikap niyang ilayo ang prokonsul mula sa pananampalataya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “mula sa paniniwala.” Ang pariralang Griyego ay maaaring tumukoy sa paglalayo sa pananampalatayang Kristiyano mismo o, sa mas pangkalahatang diwa, sa pagtugon nang may paniniwala.'
    reason: alternative_reading
  - marker: b
    text: Ipinaliliwanag dito ang “Elimas” bilang isang pangalang isinasalin o binibigyang-kahulugan; hindi tiyak ang eksaktong pinagmulan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθίστατο
  choice: sinalungat
  rationale: Ipinapahayag ang patuloy na pagsalungat sa konteksto, nang natural at hindi makaluma sa Filipino.
- source_word: δὲ
  choice: Ngunit
  rationale: Malinaw na ipinakikita ang pagsalungat sa positibong tugon ng prokonsul sa naunang konteksto.
- source_word: αὐτοῖς
  choice: sila
  rationale: Pinananatili ang panghalip ng Griyego nang hindi tahasang dinaragdagan ang mga pangalan nina Bernabe at Saulo.
- source_word: Ἐλύμας
  choice: Elimas
  rationale: Karaniwang transliterasyon sa modernong Filipino ng personal na pangalan.
- source_word: ὁ μάγος
  choice: na salamangkero
  rationale: Ang μάγος ay maaaring tumukoy sa mago, salamangkero, o taong nagsasagawa ng mahika; ang “salamangkero” ay malinaw sa karaniwang mambabasa at angkop sa konteksto.
- source_word: οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ
  choice: sapagkat ganiyan isinasalin ang kaniyang pangalan
  rationale: Pinananatili ang paliwanag na parentetikal at ang diwa ng pagsasalin o pagpapakahulugan sa pangalan nang hindi nag-aangkin ng tiyak na etimolohiya.
- source_word: ζητῶν
  choice: sinikap niyang
  rationale: Natural na ipinapahayag sa Filipino ang kasabay na layunin o pagtatangka ng kaniyang pagsalungat.
- source_word: διαστρέψαι
  choice: ilayo
  rationale: Sa konstruksiyong may taong layon at ἀπό, ang kahulugan ay ilihis o ilayo ang isang tao mula sa isang bagay.
- source_word: τὸν ἀνθύπατον
  choice: ang prokonsul
  rationale: Pinananatili ang tiyak na titulong administratibo ng Roma sa halip na gawing pangkalahatang “gobernador.”
- source_word: ἀπὸ τῆς πίστεως
  choice: sa pananampalataya
  rationale: Sa pariralang “ilayo ... sa,” likas na Filipino ito at maaaring tumukoy sa pananampalatayang Cristiano, habang kinikilala sa talababa ang posibleng mas pangkalahatang diwa ng paniniwala.
theological_decisions:
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: paniniwala
  rationale: Ang may-tiyak na artikulong τῆς πίστεως at ang konteksto ay umaayon sa pananampalatayang Cristiano bilang bagay na nais hadlangan ni Elimas. Gayunman, hindi ganap na inaalis ng Griyego ang mas pangkalahatang diwa ng pagtugon nang may paniniwala, kaya pinananatili iyon sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “prokonsul” para sa katumpakang pangkasaysayan at “salamangkero” bilang malinaw na salin ng μάγος. Inilagay ang paliwanag sa pangalan sa gitling bilang parentetikal na pahayag; kapuwa nasa pangunahing teksto ang mga panandang [a] at [b].
