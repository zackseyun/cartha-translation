  text: διελθόντες δὲ ⸀ὅλην τὴν νῆσον ἄχρι Πάφου εὗρον ⸀ἄνδρα τινὰ μάγον ψευδοπροφήτην Ἰουδαῖον ᾧ ὄνομα ⸀Βαριησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/006.yaml
  text: And after they had gone through the whole island as far as Paphos[a], they found a certain man, a magician, a false prophet, a Jew, whose name was Bar-Jesus.
translation:
  language: tl
  text: Nang malakbay nila ang buong pulo hanggang sa Pafos, natagpuan nila ang isang lalaking Judio na salamangkero at huwad na propeta, na ang pangalan ay Bar-Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ding isulat na “Barjesus.” Maaaring anyong patronimiko sa Semitiko ang pangalang ito na nangangahulugang “anak ni Jesus” o “anak ni Josue.”
    reason: Ibinibigay ang alternatibong baybay at posibleng kahulugan ng pangalan nang hindi isinasalin ang pangalang pantangi sa pangunahing teksto.
lexical_decisions:
- source_word: διελθόντες
  choice: Matapos nilang lakbayin
  rationale: Ipinahahayag ng aorist participle ang kilos na nauna sa pangunahing pandiwang εὗρον. Likas sa modernong Tagalog ang “matapos nilang lakbayin” at pinananatili nito ang diwa ng pagtawid o paglalakbay sa isang lugar nang hindi dinaragdagan ang paraan ng paglalakbay.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang pang-ugnay ito na nagpapatuloy lamang sa salaysay. Sapat nang ipinahihiwatig ng ayos ng pangungusap sa Tagalog ang pagpapatuloy; ang pagdaragdag ng “at” o “ngayon” ay magiging mabigat o maaaring magpahiwatig ng di-umiiral na diin.
- source_word: ὅλην τὴν νῆσον
  choice: ang buong pulo
  rationale: Tuwirang ipinahahayag nito ang kabuuang lawak ng pulong kanilang nilakbay. Karaniwan at marangal sa Tagalog ang “buong pulo.”
- source_word: ἄχρι Πάφου
  choice: hanggang sa Pafos
  rationale: Itinatakda ng ἄχρι ang Pafos bilang hangganan o dulo ng paglalakbay. Ang “hanggang sa” ang likas na heograpikong pahayag sa Tagalog.
- source_word: εὗρον
  choice: natagpuan nila
  rationale: Pinananatili nito ang payak na diwa ng pagkakatagpo o pagkadiskubre sa salaysay nang hindi ipinapalagay na sadya nila siyang hinahanap.
- source_word: ἄνδρα τινὰ
  choice: isang lalaki
  rationale: Naipahahayag na ng “isang” ang di-tiyak ngunit partikular na pagtukoy ng τινά. Ang “isang partikular na lalaki” ay hindi kailangang mabigat sa kontekstong ito.
- source_word: μάγον
  choice: salamangkero
  rationale: Sa kontekstong ito, tumutukoy ang μάγος sa isang nagsasagawa ng mahika o okultong gawain. Madaling maunawaan ang “salamangkero” at hindi kasing-labo ng teknikal na “mago.”
- source_word: ψευδοπροφήτην
  choice: huwad na propeta
  rationale: Tuwiran nitong pinananatili kapuwa ang pag-aangkin niyang propeta at ang paghatol ng teksto na huwad siya.
- source_word: Ἰουδαῖον
  choice: Judio
  rationale: Ginagamit ang salita bilang pantukoy sa pagkakakilanlan ng lalaki. Walang malinaw na dahilan sa konteksto upang paliitin ito sa heograpikong kahulugang “taga-Judea.”
- source_word: ᾧ ὄνομα Βαριησοῦ
  choice: Ang pangalan niya ay Bar-Jesus
  rationale: Likas na Tagalog ito para sa idyomang Griyego. Isinalin ang pangungusap bilang hiwalay na sugnay para sa linaw, samantalang tinutumbasan ang pangalang pantangi sa pamamagitan ng transliterasyon sa halip na pagsasalin ng mga sangkap nito.
theological_decisions:
- issue: Paglalahad sa pangalang Βαριησοῦ
  choice: Bar-Jesus
  alternative: Barjesus; Anak ni Jesus; Anak ni Josue
  rationale: Pangalan itong pantangi, kaya tinumbasan sa pamamagitan ng transliterasyon. Nakakatulong ang gitling upang makita ang anyong patronimiko, ngunit hindi isinalin sa pangunahing teksto bilang “Anak ni Jesus/Josue,” sapagkat maaaring magmukhang paliwanag o teolohikal na pag-uugnay na hindi tahasang ginagawa ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinili ang “pulo” at “salamangkero” bilang mga karaniwang salitang hindi teknikal. Hinati sa dalawang pangungusap ang mahabang kayariang Griyego upang maging likas sa Tagalog habang pinananatili ang lahat ng pangunahing ugnayan at paglalarawan.
