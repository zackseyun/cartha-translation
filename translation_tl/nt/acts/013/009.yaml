  yaml_path: translation/nt/acts/013/009.yaml
  text: But Saul[a], who was also called Paul, filled with the Holy Spirit, looked intently at him
translation:
  language: tl
  text: Ngunit si Saulo, na tinatawag ding Pablo, ay napuspos ng Espiritu Santo at matamang tumitig sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαῦλος
  choice: Saulo
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa makabagong saling Tagalog.
- source_word: δέ
  choice: Ngunit
  rationale: Ipinahihiwatig ang banayad na pagsalungat o pagliko ng salaysay patungo sa tugon ni Saulo.
- source_word: ὁ καὶ Παῦλος
  choice: na siya ring si Pablo
  rationale: Ipinakikilala si Pablo bilang isa pang pangalan ng taong tinatawag na Saulo, nang hindi ipinapalagay na dito naganap ang pagpapalit ng pangalan.
- source_word: πλησθεὶς
  choice: napuspos
  rationale: Pinananatili ang diwang pasibo ng aorist participle at natural itong nag-uugnay sa sumunod na kilos.
- source_word: πνεύματος ἁγίου
  choice: ng Espiritu Santo
  rationale: Sa konteksto at gamit ng Mga Gawa, tumutukoy ito sa banal na Espiritu; ang pariralang Tagalog ay likas at malinaw.
- source_word: ἀτενίσας
  choice: tinitigang mabuti
  rationale: Ipinapahayag ang mataman at matatag na pagtingin nang hindi kasingnegatibo ng simpleng 'tinitigan.'
- source_word: εἰς αὐτόν
  choice: siya
  rationale: Bilang layon ng 'tinitigang mabuti,' malinaw na tumutukoy ito kay Elimas mula sa naunang konteksto.
theological_decisions:
- issue: Pagpapakahulugan sa πνεύματος ἁγίου
  choice: Espiritu Santo
  alternative: isang banal na espiritu
  rationale: Mahigpit na sinusuportahan ng konteksto ng pagbibigay-kapangyarihan at ng karaniwang gamit ni Lucas sa Mga Gawa ang pagtukoy sa banal na Espiritu.
- issue: Ugnayan ng mga pangalang Saulo at Pablo
  choice: na siya ring si Pablo
  alternative: na tinatawag ding Pablo
  rationale: Hindi tahasang taglay ng Griyego ang pandiwang 'tinatawag'; pinananatili ng napiling anyo ang payak na pagkakakilanlan sa dalawang pangalan at hindi ito inilalarawan bilang pagbabago ng pangalan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinili ang 'na siya ring si Pablo' upang manatiling malapit sa eliptikal na Griyego, at ang 'napuspos' bilang natural na wikang biblikal na nauunawaan pa rin ng karaniwang mambabasa.
