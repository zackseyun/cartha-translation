  source_fidelity: 'Wasto ang mga pangunahing katumbas: Σαῦλος = Saulo, Παῦλος = Pablo, πλησθεὶς πνεύματος ἁγίου = napuspos ng Espiritu Santo, at ἀτενίσας εἰς αὐτόν = matamang tumitig sa kanya. Gayunman, ang “tinitigang mabuti siya” ay hindi wastong anyong Filipino at hindi maayos na naihahayag ang kilos ng matamang pagtitig.'
  naturalness: Hindi natural at mali ang “tinitigang mabuti siya.” Ang “matamang tumitig sa kanya” ay malinaw, makabago, at marangal. Ang “na tinatawag ding Pablo” ay mas likas na Filipino para sa eliptikal na pagkakakilanlan ng dalawang pangalan, nang hindi ipinahihiwatig ang pagpapalit ng pangalan.
  terminology: Ang “Saulo,” “Pablo,” at “Espiritu Santo” ay mga nakaugaliang anyo sa Filipino at angkop sa kontekstong ito. Pinananatili ng “napuspos” ang pasibong diwa ng πλησθεὶς.
