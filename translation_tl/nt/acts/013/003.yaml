  yaml_path: translation/nt/acts/013/003.yaml
  text: Then[a], after fasting and praying and laying their hands on them, they sent them off.
translation:
  language: tl
  text: Pagkatapos nito, matapos silang mag-ayuno at manalangin, ipinatong nila ang kanilang mga kamay kina Bernabe at Saulo at hinayaan silang umalis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinaalis nila sila” o “pinakawalan nila sila.” Sa konteksto, hinayaan sina Bernabe at Saulo na umalis para sa gawaing iniatas sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Kaya
  rationale: Nag-uugnay ito sa utos ng Espiritu Santo sa naunang talata at ipinahihiwatig ang sumunod na tugon ng kapulungan.
- source_word: νηστεύσαντες καὶ προσευξάμενοι
  choice: matapos silang mag-ayuno at manalangin
  rationale: Ipinapakita ng mga aorist participle na nauna ang pag-aayuno at pananalangin sa pangunahing kilos.
- source_word: ἐπιθέντες τὰς χεῖρας αὐτοῖς
  choice: ipinatong nila ang kanilang mga kamay sa dalawa
  rationale: Pinananatili ang kongkretong kilos nang hindi ito binibigyan ng tiyak na sakramental o denominasyonal na kahulugan. Nililinaw ng “sa dalawa” na sina Bernabe at Saulo ang tinutukoy.
- source_word: ἀπέλυσαν
  choice: pinahayo ang mga ito
  rationale: Sa konteksto, pinahintulutan at pinalakad nila sina Bernabe at Saulo para sa gawain; natural sa Filipino ang “pinahayo” at nananatili rito ang diwa ng pagpapalis o pagpapaalis.
theological_decisions:
- issue: Kahulugan ng pagpapatong ng mga kamay
  choice: Ilarawan lamang ang kilos nang hindi ito tahasang tawaging ordinasyon, pagbabasbas, o isang sakramento.
  alternative: Isalin o ipaliwanag ito bilang ordinasyon, pagbabasbas, o pormal na pagtatalaga.
  rationale: Iniulat ng talata ang kilos ngunit hindi nito tiyak na binibigyang-kahulugan ang eklesyal o sakramental na katangian nito.
- issue: Diwa ng ἀπέλυσαν
  choice: “pinahayo ang mga ito,” na sa konteksto ay pagpapahintulot sa kanilang umalis para sa misyon
  alternative: “pinaalis sila” o “pinakawalan sila”
  rationale: Pinananatili nito ang kontekstuwal na diwa nang hindi ipinahihiwatig na ang kapulungan, sa ganang sarili nito, ang pinagmulan ng banal na pagsusugo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sa dalawa” at “ang mga ito” upang maiwasan ang malabong reperensiya ng panghalip habang hindi inuulit ang mga pangalan mula sa naunang talata.
