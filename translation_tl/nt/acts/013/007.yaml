id: ACT.13.7
reference: Acts 13:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃς ἦν σὺν τῷ ἀνθυπάτῳ Σεργίῳ Παύλῳ, ἀνδρὶ συνετῷ. οὗτος προσκαλεσάμενος Βαρναβᾶν καὶ Σαῦλον ἐπεζήτησεν ἀκοῦσαι τὸν λόγον τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/007.yaml
  text: who was with the proconsul Sergius Paulus[a], an intelligent man[b]. This man summoned Barnabas and Saul and sought to hear the word of God.
translation:
  language: tl
  text: na kasama ng prokonsul na si Sergio Paulo, isang matalinong lalaki.[a] Ipinatawag ng taong ito sina Bernabe at Saulo at hinangad niyang marinig ang salita ng Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang lalaking may unawa” o “isang lalaking maingat magpasya.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang mensahe ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθυπάτῳ
  choice: prokonsul
  rationale: Tiyak na titulong Romano ang salita, kaya pinanatili ang ranggo sa halip na gamitin ang mas pangkalahatang “gobernador.”
- source_word: σὺν
  choice: kasama ng
  rationale: Likas at tuwirang ipinahahayag nito ang ugnayan o pakikisama sa prokonsul.
- source_word: ἀνδρὶ συνετῷ
  choice: isang matalinong lalaki
  rationale: Ipinahahayag ng συνετός ang talino, pagkaunawa, o maingat na paghatol; malinaw at natural sa modernong Tagalog ang “matalino.”
- source_word: οὗτος
  choice: ang taong ito
  rationale: Pinananatili ang bahagyang pagdiriin at muling pagtukoy ng demonstratibo kay Sergio Paulo, sa halip na gawing karaniwang panghalip lamang.
- source_word: προσκαλεσάμενος
  choice: ipinatawag
  rationale: Ipinakikita nito na pinapunta niya sa kaniyang harapan sina Bernabe at Saulo, at angkop ito sa pagkukusa ng isang opisyal nang hindi kinakailangang magpahiwatig ng pamimilit.
- source_word: ἐπεζήτησεν
  choice: hinangad
  rationale: Naipahahayag nito ang masidhing pagnanais o aktibong paghahangad na marinig ang mensahe.
- source_word: ἀκοῦσαι
  choice: marinig
  rationale: Tuwiran at likas na salin ng infinitive sa konteksto ng pagtanggap sa ipinahahayag na mensahe.
- source_word: λόγον τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Pinananatili nito ang pamilyar at pormal na anyo ng pariralang Griyego habang maaari ring unawain bilang mensaheng mula sa Diyos.
- source_word: Σεργίῳ Παύλῳ
  choice: Sergio Paulo
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Romano.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: Bernabe at Saulo
  rationale: Ginamit ang mga nakaugaliang anyong Filipino ng mga pangalan.
theological_decisions:
- issue: Kahulugan ng λόγον τοῦ θεοῦ
  choice: ang salita ng Diyos
  alternative: ang mensahe ng Diyos
  rationale: Mas malinaw na pinananatili ng pangunahing salin ang anyo ng Griyego at ang pamilyar na ekspresyong biblikal, samantalang itinatala sa talababa ang dinamikong kahulugan nito bilang mensahe.
- issue: Nuansa ng συνετῷ sa paglalarawan kay Sergio Paulo
  choice: isang matalinong lalaki
  alternative: isang lalaking may unawa; isang maingat magpasya na lalaki
  rationale: Positibong inilalarawan ng salita ang kaniyang talino o pagkaunawa, ngunit hindi nito kinakailangang igiit ang isang moral o teolohikal na katangian.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado ngunit madaling maunawaan. Pinanatili ang teknikal na titulong “prokonsul,” ang demonstratibong pagdiriin sa “ang taong ito,” at ang tradisyonal na pariralang “salita ng Diyos.” Ang pambungad na “na kasama” ay sadyang nagpapatuloy sa sugnay ng naunang talata, gaya ng estruktura ng tekstong Griyego.
