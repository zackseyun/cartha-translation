base_translation:
  language: en
  yaml_path: translation/nt/acts/013/042.yaml
  text: As they were going out[b][a], they were urging that these words be spoken to them on the next Sabbath.
translation:
  language: tl
  text: Habang lumalabas sila[a][b], taimtim silang nakikiusap na sabihin sa kanila ang mga salitang ito sa susunod na Sabbath.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas tahasang mababasa sa ilang manuskrito: “Habang lumalabas sina Pablo at Bernabe, taimtim na nakikiusap ang mga tao na sabihin sa kanila ang mga salitang ito sa susunod na Sabbath.”'
    reason: textual_variant
  - marker: b
    text: O “Habang paalis sila, hinihiling nilang sabihin sa kanila ang mga bagay na ito sa darating na Sabbath.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξιόντων δὲ αὐτῶν
  choice: Habang papalabas sila
  rationale: Ang genitive absolute na may present participle ay likas na isinasalin bilang kasabay na pangyayaring panahunan. Pinananatili ng “papalabas” ang diwa ng kilos na nagpapatuloy, at hindi tinutukoy kung sino ang tinutukoy ng panghalip.
- source_word: παρεκάλουν
  choice: taimtim silang nakikiusap
  rationale: Ipinahihiwatig ng imperfect ang nagpapatuloy o paulit-ulit na pakiusap. Sa kontekstong ito, ang παρακαλέω ay mas matindi kaysa simpleng pagtatanong ngunit hindi kailangang mangahulugang pagmamakaawa.
- source_word: εἰς τὸ μεταξὺ σάββατον
  choice: sa susunod na Sabbath
  rationale: Ang idyoma ay tumutukoy sa darating o kasunod na Sabbath. Natural ito sa modernong Tagalog nang hindi literal na ginagawang “Sabbath sa pagitan.”
- source_word: λαληθῆναι αὐτοῖς
  choice: na sabihin sa kanila
  rationale: Natural na ipinapahayag sa Tagalog ang aorist passive infinitive sa ganitong di-personal na anyo, habang pinananatili ang diwa ng pagsasalita at ang tumatanggap ng mensahe.
- source_word: τὰ ῥήματα ταῦτα
  choice: ang mga salitang ito
  rationale: Pormal na malapit ito sa ῥήματα at malinaw na tumutukoy sa mga salitang ipinahayag sa sinagoga; hindi ito pinalalawak agad bilang “mensahe.”
theological_decisions:
- issue: Ang tinutukoy ng mga panghalip sa talata
  choice: Pinanatili sa pangunahing teksto ang mga panghalip na “sila” at “kanila” nang hindi tahasang pinapangalanan ang mga pangkat.
  alternative: Tukuying ang mga lumalabas bilang sina Pablo at Bernabe at ang mga nakikiusap bilang mga tao, o ipakahulugang iisang pangkat ang tinutukoy ng dalawang “sila.”
  rationale: Hindi tahasang pinapangalanan ng teksto ng SBLGNT ang mga tinutukoy, at may kaugnay na suliraning tekstuwal at interpretatibo. Hindi dapat lutasin ng salin ang tunay na kalabuan nang lampas sa ebidensiya ng pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Sabbath” bilang pamilyar na terminong biblikal; ang “taimtim na nakikiusap” ay naghahatid ng lakas ng patuloy na pakiusap nang hindi nagiging labis ang himig.
