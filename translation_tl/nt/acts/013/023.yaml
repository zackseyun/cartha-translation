id: ACT.13.23
reference: Acts 13:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τούτου ὁ θεὸς ἀπὸ τοῦ σπέρματος κατ’ ἐπαγγελίαν ἤγαγεν τῷ Ἰσραὴλ ⸂σωτῆρα Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/023.yaml
  text: From this man's offspring[a], God has brought to Israel a Savior, Jesus[b], according to promise.
translation:
  language: tl
  text: Mula sa mga inapo ng taong ito[b], ayon sa pangako[a], dinala ng Diyos sa Israel ang isang Tagapagligtas—si Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “alinsunod sa pangako” o “gaya ng ipinangako.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mula sa binhi ng taong ito”; ang “mga inapo” rito ay tumutukoy sa pagiging inapo ni David.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου
  choice: ng taong ito
  rationale: Ang panghalip na pamatlig sa genitibo ay tumutukoy kay David sa naunang talata. Nililinaw ng “taong ito” ang tinutukoy nang hindi inuulit ang pangalan.
- source_word: ἀπὸ τοῦ σπέρματος
  choice: mula sa lahi
  rationale: Ang σπέρμα ay literal na “binhi” ngunit dito ay tumutukoy sa angkan o salinlahi ni David. Ang “lahi” ay natural sa makabagong Tagalog at malinaw na naghahayag ng pinagmulang angkan.
- source_word: κατ’ ἐπαγγελίαν
  choice: ayon sa pangako
  rationale: Pinananatili nito ang diwa ng pagkakatugma sa isang naunang pangako nang hindi tahasang dinaragdagan kung kanino o alin mismong pangako iyon.
- source_word: ἤγαγεν
  choice: nagdala
  rationale: Direktang katumbas ito ng karaniwang kahulugan ng ἄγω na “dalhin.” Iniiwasan ng saling ito ang “ibinangon,” na maaaring mapagkamalang pagtukoy sa muling pagkabuhay.
- source_word: τῷ Ἰσραήλ
  choice: sa Israel
  rationale: Likas na isinasalin ng “sa Israel” ang datibo at pinananatili rin ang posibleng diwang para sa kapakinabangan ng Israel.
- source_word: σωτῆρα
  choice: isang Tagapagligtas
  rationale: Ang “Tagapagligtas” ang malinaw at nakaugaliang katumbas ng σωτήρ sa kontekstong tumutukoy kay Jesus.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Ginamit ang karaniwang anyo ng personal na pangalan sa Filipino.
theological_decisions:
- issue: Ugnayan ni Jesus sa pangako at sa angkan ni David
  choice: Inilalahad na dinala ng Diyos si Jesus mula sa lahi ni David ayon sa pangako, nang hindi pinalalawak ang sinabi ng teksto.
  alternative: 'Maaaring gawing mas tahasan: “bilang katuparan ng pangako niya kay David.”'
  rationale: Magkaugnay sa Griyego ang pinagmulan ni Jesus sa angkan ni David at ang pangako ng Diyos, ngunit hindi tahasang sinasabi sa talata ang “katuparan” o “kay David.” Pinananatili ng salin ang ugnayan nang hindi nagdaragdag ng interpretasyon.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “lahi” sa halip na literal na “binhi” para sa likas na pagpapahayag ng angkan, at pinanatili ang “ayon sa pangako” upang hindi labis na tukuyin ang pangako sa pangunahing teksto.
