id: ACT.13.31
reference: Acts 13:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃς ὤφθη ἐπὶ ἡμέρας πλείους τοῖς συναναβᾶσιν αὐτῷ ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ, οἵτινες ⸀νῦν εἰσὶ μάρτυρες αὐτοῦ πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/031.yaml
  text: He appeared for many days to those who had gone up with him from Galilee to Jerusalem[b][a], who are now his witnesses to the people.
translation:
  language: tl
  text: Nagpakita[a] siya sa loob ng maraming araw sa mga sumama sa kanya sa pag-akyat mula sa Galilea patungong Jerusalem, at sila ngayon ang mga saksi niya sa bayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Nakita siya sa loob ng maraming araw.” Ang pandiwang Griyego ay maaaring isalin nang mas pormal sa ganitong paraan, lalo na sa mga salaysay ng pagpapakita matapos ang muling pagkabuhay.'
    reason: lexical_alternative
  - marker: b
    text: Ang “bayan” dito ay malamang na tumutukoy sa bayang Israel, o sa mga Judio, ayon sa konteksto.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: siya
  rationale: Tumutukoy ang panghalip kay Jesus sa naunang talata. Natural sa modernong Tagalog ang pagsisimula ng bagong pangungusap sa “siya.”
- source_word: ὤφθη
  choice: nagpakita
  rationale: Sa konteksto ng mga pagpapakita matapos ang muling pagkabuhay, natural na katumbas ito ng diwang “appeared,” habang ang mas pormal na “nakita” ay inilalagay bilang alternatibo sa talababa.
- source_word: ἐπὶ ἡμέρας πλείους
  choice: sa loob ng maraming araw
  rationale: Malinaw at likas na ipinapahayag nito ang tagal ng panahon.
- source_word: τοῖς συναναβᾶσιν αὐτῷ
  choice: sa mga kasama niyang umakyat
  rationale: Ipinahahayag ng σύν ang pagsama kay Jesus, at pinananatili ng “umakyat” ang karaniwang paglalarawan sa paglalakbay patungong Jerusalem.
- source_word: ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ
  choice: mula sa Galilea patungong Jerusalem
  rationale: Tuwirang inilalarawan ang pinagmulan at patutunguhan ng paglalakbay.
- source_word: οἵτινες νῦν εἰσὶ μάρτυρες αὐτοῦ
  choice: at sila ngayon ang mga saksi niya
  rationale: Natural sa Tagalog ang pagpapatuloy na “at sila,” at pinananatili nito ang pagkakakilanlan ng grupong iyon bilang kasalukuyang mga saksi tungkol kay Jesus.
- source_word: πρὸς τὸν λαόν
  choice: sa bayan
  rationale: Ang “sa bayan” ay likas na tumutukoy sa mga taong pinatutungkulan ng kanilang patotoo, nang hindi tahasang dinaragdagan ang Griyego ng “Israel.”
theological_decisions:
- issue: Kalikasan ng wika tungkol sa pagpapakita matapos ang muling pagkabuhay
  choice: Nagpakita siya
  alternative: Nakita siya
  rationale: Karaniwang ipinahahayag ng ὤφθη sa ganitong konteksto na nagpakita si Jesus sa mga saksi. Hindi nito nilulutas nang higit sa teksto ang kalikasan ng pagpapakita; pinananatili sa talababa ang mas pormal na alternatibo.
- issue: Saklaw ng τὸν λαόν
  choice: sa bayan
  alternative: sa bayan ng Israel
  rationale: Malamang na ang bayang Israel o mga Judio ang tinutukoy sa konteksto, ngunit τὸν λαόν lamang ang nasa Griyego. Kaya hindi idinaragdag ang “Israel” sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “nagpakita” bilang likas na salin, “umakyat” upang mapanatili ang wika ng paglalakbay patungong Jerusalem, at “bayan” upang hindi labis na tukuyin sa pangunahing teksto ang saklaw ng λαός.
