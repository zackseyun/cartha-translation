  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὕτως γὰρ ἐντέταλται ἡμῖν ὁ κύριος· Τέθεικά σε εἰς φῶς ἐθνῶν τοῦ εἶναί σε εἰς σωτηρίαν ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/047.yaml
  text: 'For so the Lord has commanded us: ‘I have set you as a light for the nations[b][a], so that you may be for salvation to the end of the earth.’'
translation:
  language: tl
  text: 'Sapagkat ganito ang iniutos sa atin ng Panginoon: “Itinalaga kitang maging ilaw para sa mga bansa[a], upang maging kaligtasan ka hanggang sa kadulu-duluhan ng lupa[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ilaw para sa mga Hentil.” Ang salitang Griyego na ἐθνῶν ay maaaring tumukoy sa “mga bansa” o, sa maraming konteksto, sa “mga Hentil.”
    reason: lexical_alternative
  - marker: b
    text: O “hanggang sa mga dulo ng daigdig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: ganito
  rationale: Likas na ipinakikilala nito sa Filipino ang paraan o batayan ng kasunod na sipi, habang pinananatili ang ugnayang lohikal sa naunang pahayag.
- source_word: ἐντέταλται
  choice: iniutos
  rationale: Ipinahihiwatig ng perpektong anyo ang isang utos na ibinigay na at nananatiling may bisa. Ang “iniutos” ay malinaw at may wastong bigat ng awtoridad sa Filipino.
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Pinananatili ng “Panginoon” ang karaniwang banal at teolohikal na diwa ng κύριος sa konteksto ng isang sipi sa Kasulatan.
- source_word: Τέθεικά σε
  choice: Itinalaga kita
  rationale: Sa konteksto ng pagkasugo, ipinahahayag ng τέθεικα ang isang naitatag nang pagtatalaga. Mas likas sa Filipino ang “itinalaga” kaysa literal na “inilagay,” nang hindi tinutukoy nang higit sa teksto ang pagkakakilanlan ng kinakausap.
- source_word: εἰς φῶς ἐθνῶν
  choice: maging ilaw para sa mga bansa
  rationale: Ipinahahayag ng εἰς ang tungkulin o layunin, at nananatili ang metaporang “ilaw.” Malawak ang “mga bansa” at hindi nito agad nililimitahan ang ἐθνῶν sa mga Hentil lamang.
- source_word: τοῦ εἶναί σε εἰς σωτηρίαν
  choice: upang maghatid ka ng kaligtasan
  rationale: Malinaw at likas na ipinahahayag ng “upang” ang layunin ng articular infinitive. Ang “maghatid ng kaligtasan” ay naiiwasan ang di-likas na “maging para sa kaligtasan,” ngunit hindi dinaragdagan kung paano naisasakatuparan ang kaligtasan.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: hanggang sa kadulu-duluhan ng lupa
  rationale: Ipinahahayag nito ang pinakamalayong dako ng lupa at pinananatili ang pang-isahang anyo ng Griyego, habang natural at marangal ang dating sa modernong Filipino.
theological_decisions:
- issue: Ang tinutukoy ng pang-isahang “ikaw” sa sipi mula kay Isaias at ang paglalapat nito nina Pablo at Bernabe
  choice: Panatilihin ang tuwirang sipi sa pang-isahang anyo nang hindi tahasang ipinapaliwanag kung paano inilalapat sa gawaing apostoliko ang teksto tungkol sa lingkod.
  alternative: Gawing maramihan ang panghalip o tahasang tukuyin sa salin na ang sipi ay tungkol kina Pablo at Bernabe.
  rationale: Pang-isahan ang σε sa Griyego, at hindi tahasang nilulutas ng teksto ang kaugnayan ng lingkod sa sipi at ng misyon ng mga apostol. Pinananatili ng salin ang teolohikal na tensiyong ito.
- issue: Ang puwersa ng εἰς σωτηρίαν
  choice: Isalin bilang “maghatid ka ng kaligtasan,” na nagpapahayag ng layunin nang hindi tinutukoy ang mekanismo nito.
  alternative: Isalin bilang “maging kaligtasan ka” o “maging daan ka ng kaligtasan.”
  rationale: Ang una ay maaaring magtunog na ang kinakausap mismo ang abstraktong kaligtasan, samantalang ang ikalawa ay tahasang nagpapasok ng konsepto ng pagiging “daan.” Ang napiling anyo ay likas sa Filipino at maingat na hindi nagpapataw ng mas tiyak na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “Sapagkat” upang mapanatili ang paliwanag na ugnayan sa konteksto, at “kadulu-duluhan” upang natural na maipahayag ang pinakamalayong hangganan nang hindi maging lipas o labis na teknikal.
