  source_fidelity: Tumpak na naihahatid ang inferensiyang διότι, ang dagdag na καί, ang kasalukuyang panahunan ng λέγει, at ang idyomatikong diwa ng Οὐ δώσεις ... ἰδεῖν. Ang ‘pagkabulok’ ay wastong salin ng διαφθορά sa kontekstong ito.
  naturalness: Nauunawaan ang draft, ngunit mas likas at mas malinaw ang ayos na ‘hahayaan mong makakita ... ang iyong Banal’ kaysa ‘hahayaan mong makita ng iyong Banal ...,’ na maaaring pansamantalang magmukhang ang Banal ang tumatanggap ng pandiwang ‘makita.’ Ang malaking titik sa ‘Awit’ ay nagpapalinaw na tumutukoy ito sa isang salmo, hindi lamang sa karaniwang awit.
  terminology: Ang ‘iyong Banal’ ay angkop sa kontekstuwal na pagtukoy ng Acts sa sinipi mula sa Awit. Ang talababa na ‘katiwalian’ ay hindi mainam na alternatibo dahil sa makabagong Filipino karaniwan itong tumutukoy sa moral o pampublikong korupsiyon; ‘pagkasira’ ang mas ligtas na alternatibong saklaw para sa διαφθορά.
