  yaml_path: translation/nt/acts/013/035.yaml
  text: Therefore he also says in another psalm[c][b][a], ‘You will not let your Holy One see decay.’
translation:
  language: tl
  text: Kaya sinasabi rin niya sa isa pang Awit:[a] “Hindi mo hahayaang makakita ng pagkabulok ang iyong Banal.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa ibang bahagi” o “sa ibang sipi”; ang Griyego ay nagsasabi lamang na “sa isa pa.”
    reason: lexical_alternative
  - marker: c
    text: O “pagkasira.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Kaya
  rationale: Sa konteksto, naghahayag ito ng kongklusyon o patunay mula sa naunang pangangatwiran, hindi lamang ng sanhi.
- source_word: καὶ
  choice: rin
  rationale: Ipinakikita nito na nagdaragdag si Pablo ng isa pang patotoo mula sa Kasulatan.
- source_word: ἐν ἑτέρῳ
  choice: sa isa pang awit
  rationale: Ang Griyego ay literal na ‘sa isa pa,’ na may ipinahihiwatig na pangngalan. Ang sipi ay mula sa isang Awit, kaya nilinaw ito sa salin habang itinatala sa talababa ang mas literal na mga alternatibo.
- source_word: λέγει
  choice: sinasabi niya
  rationale: Pinananatili ang kasalukuyang panahunan at ang di-tahasang panlalaking simuno ng pormula sa pagsipi ng Kasulatan.
- source_word: Οὐ δώσεις
  choice: Hindi mo hahayaang
  rationale: Sa pagkakagamit na ito kasama ng pawatas, ang δίδωμι ay nangangahulugang magpahintulot o magbigay-daan, hindi literal na ‘magbigay.’
- source_word: τὸν ὅσιόν σου
  choice: iyong Banal
  rationale: Maaaring tumukoy ang ὅσιος sa banal, tapat, o maka-Diyos na tao. Ang ‘Banal’ ay akma sa tahasang paglalapat ni Pablo ng sipi kay Jesus, habang pinananatili sa talababa ang ‘tapat.’
- source_word: ἰδεῖν
  choice: makita
  rationale: Pinananatili nito ang payak at matalinghagang pandiwang ‘makakita’ ng Griyego sa halip na gawing mas interpretatibong ‘maranasan.’
- source_word: διαφθοράν
  choice: pagkabulok
  rationale: Sa pangangatwiran tungkol sa muling pagkabuhay, malinaw itong tumutukoy sa pagkabulok ng katawan; natural at tiyak ang salitang Filipino.
theological_decisions:
- issue: Ang mesiyaniko o kristolohikal na tinutukoy ng sipi mula sa Awit
  choice: ‘iyong Banal,’ na may malaking titik
  alternative: ‘iyong banal’ o ‘iyong tapat’
  rationale: Tahasang inilalapat ni Pablo ang Awit 16 kay Jesus at sa kanyang muling pagkabuhay. Ipinahihiwatig ng malaking titik ang tinutukoy sa konteksto nang hindi binabago ang saklaw ng kahulugan ng ὅσιος.
- issue: Ang ipinahihiwatig na pangngalan pagkatapos ng ἐν ἑτέρῳ
  choice: ‘sa isa pang awit’
  alternative: ‘sa ibang bahagi’ o ‘sa ibang sipi’
  rationale: Walang hayag na pangngalan ang Griyego, ngunit mula sa isang Awit ang kasunod na sipi. Nililinaw ng pangunahing teksto ang sanggunian, habang pinananatili ng talababa ang tunay na elipsis at iba pang posibleng salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Kaya’ para sa natural na daloy ng pangangatwiran at ang ‘pagkabulok’ para sa malinaw na konteksto ng kamatayan at muling pagkabuhay. Pinanatili ang anyong tuwirang sipi at iniwasan ang anumang dagdag na paliwanag na denominasyonal.
