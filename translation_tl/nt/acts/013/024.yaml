id: ACT.13.24
reference: Acts 13:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: προκηρύξαντος Ἰωάννου πρὸ προσώπου τῆς εἰσόδου αὐτοῦ βάπτισμα μετανοίας ⸂παντὶ τῷ λαῷ⸃ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/024.yaml
  text: before his coming[b][a], John had proclaimed to all the people of Israel a baptism of repentance.
translation:
  language: tl
  text: Bago siya dumating[a], ipinahayag na ni Juan sa buong sambayanang Israel ang bautismo ng pagsisisi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bago ang kaniyang pagdating.” Literal sa Griyego, “sa harap ng kaniyang pagpasok,” isang idyoma para sa pag-una sa pagdating ng isang tao.
    reason: lexical_alternative
  - marker: b
    text: O “bautismo para sa pagsisisi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προκηρύξαντος
  choice: ipinahayag na
  rationale: Ipinahihiwatig ng aorist participle ang naunang pampublikong pagpapahayag ni Juan. Likas sa Tagalog ang “ipinahayag na,” at hindi na kailangang idagdag ang “nang una” dahil malinaw na ang pagkauna sa kasunod na parirala.
- source_word: πρὸ προσώπου τῆς εἰσόδου αὐτοῦ
  choice: bago siya dumating
  rationale: Ang literal na “sa harap ng kaniyang pagpasok” ay isang idyomang tumutukoy sa pangyayaring nauuna sa pagdating ng isang tao. Malinaw at likas sa modernong Tagalog ang “bago siya dumating.”
- source_word: εἰσόδου
  choice: dumating
  rationale: Bagaman maaaring literal na mangahulugang “pagpasok,” tumutukoy ito rito sa pagdating o paglitaw ng tinutukoy na persona.
- source_word: βάπτισμα μετανοίας
  choice: bautismo ng pagsisisi
  rationale: Pinananatili ng “ng pagsisisi” ang genitive na ugnayan at ang tunay na kaluwagan nito, sa halip na tahasang tukuyin kung ang pagsisisi ang layunin o katangian ng bautismo.
- source_word: παντὶ τῷ λαῷ Ἰσραήλ
  choice: sa buong sambayanang Israel
  rationale: Ang “buong” ay kumakatawan sa παντί, at ang “sambayanang Israel” ay natural at marangal na katumbas ng λαῷ Ἰσραήλ bilang Israel na isang bayan.
- source_word: Ἰωάννου
  choice: Juan
  rationale: Ito ang nakaugaliang anyo sa Tagalog ng pangalang Ἰωάννης.
theological_decisions:
- issue: Ang tinutukoy ng panghalip sa “bago siya dumating”
  choice: Pinanatili ang panghalip na “siya,” na sa konteksto ay tumutukoy kay Jesus, ang Tagapagligtas na mula sa angkan ni David.
  alternative: Tahasang sabihing “bago dumating si Jesus.”
  rationale: Sapat na tinutukoy ng konteksto ng Mga Gawa 13:23–25 ang antecedent. Hindi idinagdag ang pangalang wala sa mismong talata.
- issue: Ugnayan ng bautismo at pagsisisi
  choice: bautismo ng pagsisisi
  alternative: bautismo para sa pagsisisi
  rationale: Hindi ganap na tinutukoy ng genitive na μετανοίας kung ito ay layunin, kaugnayan, o katangian; pinananatili ng salin ang ganitong kaluwagan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “sambayanan” upang maipahayag ang Israel bilang isang bayan, at pinanatili ang “bautismo” at “pagsisisi” bilang pamilyar na bokabularyong biblikal.
