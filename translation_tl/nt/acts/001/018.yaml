  to: Kaya, nagkaroon ang taong ito ng isang bukid sa pamamagitan ng kabayarang bunga ng kasamaan[a]; at nang bumagsak siya nang patiwarik[b], pumutok ang katawan niya sa gitna, at bumuhos palabas ang lahat ng kanyang lamang-loob.
