  text: Οὗτος μὲν οὖν ἐκτήσατο χωρίον ἐκ μισθοῦ τῆς ἀδικίας, καὶ πρηνὴς γενόμενος ἐλάκησεν μέσος, καὶ ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/018.yaml
  text: So this man acquired a field with the wages of unrighteousness[a], and falling headlong he burst open in the middle[c][b], and all his intestines spilled out.
translation:
  language: tl
  text: Kaya, nagkaroon ang taong ito ng isang bukid sa pamamagitan ng kabayarang bunga ng kasamaan[a]; at nang bumagsak siya nang patiwarik[b], pumutok ang katawan niya sa gitna, at bumuhos palabas ang lahat ng kanyang lamang-loob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa kabayaran ng kalikuan.” Maaari ring unawain ang parirala bilang gantimpala o bayad na nakuha sa paggawa ng mali.
    reason: lexical_alternative
  - marker: b
    text: O “nang mapadapa siya” / “nang bumagsak siyang una ang ulo.” Inilalarawan ng pariralang Griyego ang pagiging nakadapa o ang pagbagsak nang patiwarik.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος μὲν οὖν
  choice: Kaya ang taong ito
  rationale: Tumutukoy ang Οὗτος kay Judas, at natural na ipinahihiwatig ng “Kaya” ang pagpapatuloy at paghinuha ng μέν οὖν.
- source_word: ἐκτήσατο
  choice: nagkaroon
  rationale: Saklaw nito ang pagkamit o pagkakaroon ng pag-aari nang hindi ipinipilit na si Judas mismo ang tuwirang bumili nito.
- source_word: χωρίον
  choice: isang bukid
  rationale: Karaniwang tumutukoy ang χωρίον sa bukid o isang takdang bahagi ng lupain; malinaw at natural dito ang “bukid.”
- source_word: ἐκ μισθοῦ τῆς ἀδικίας
  choice: mula sa kabayaran sa kasamaan
  rationale: Pinananatili ng “mula sa” ang puwersa ng ἐκ, habang malinaw na inilalarawan ng “kabayaran sa kasamaan” ang μισθός at ἀδικία sa modernong Tagalog.
- source_word: πρηνὴς γενόμενος
  choice: nang bumagsak siyang patiwarik
  rationale: Ipinahihiwatig ng πρηνής ang posisyong nakadapa o unang tumama ang harapan/ulo; natural na inilalarawan ito ng “bumagsak ... patiwarik” nang hindi lubhang tinutukoy ang eksaktong mekanismo.
- source_word: ἐλάκησεν μέσος
  choice: pumutok ang gitna ng kanyang katawan
  rationale: Ang λακάω ay pumutok o mabiyak, at ang μέσος ay tumutukoy sa gitna. Idinagdag ang “katawan” bilang likas na ipinahihiwatig na paksa sa Tagalog.
- source_word: ἐξεχύθη
  choice: lumabas
  rationale: Sa kontekstong ito, natural at malinaw na ipinahahayag ng “lumabas” ang pagbuhos o pagkalabas ng laman ng katawan.
- source_word: πάντα τὰ σπλάγχνα αὐτοῦ
  choice: lahat ng kanyang mga bituka
  rationale: Konkretong tumutukoy rito ang σπλάγχνα sa mga lamang-loob; ang “mga bituka” ay malinaw sa karaniwang modernong Tagalog.
theological_decisions:
- issue: Kaugnayan ni Judas sa pagkakaroon ng bukid
  choice: Isinalin ang ἐκτήσατο bilang “nagkaroon” upang sabihin ang pagkamit o pagkakaroon ng bukid nang hindi tinutukoy ang eksaktong paraan.
  alternative: “binili” niya mismo ang bukid; o nakuha ang bukid sa kanyang pangalan o sa pamamagitan ng perang kaugnay sa kanya
  rationale: Mas malawak kaysa “binili” ang pandiwang Griyego. Pinananatili ng salin ang tensiyon sa Mateo 27:5–8 sa halip na lutasin ito sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at tuwiran. Pinanatili ang matinding pisikal na paglalarawan ng Griyego at iniwasan ang mas makitid na “binili.”
