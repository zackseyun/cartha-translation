  text: εἶπεν ⸀δὲ πρὸς αὐτούς· Οὐχ ὑμῶν ἐστιν γνῶναι χρόνους ἢ καιροὺς οὓς ὁ πατὴρ ἔθετο ἐν τῇ ἰδίᾳ ἐξουσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/007.yaml
  text: But he said to them[b][a], “It is not for you to know times or seasons that the Father has set by his own authority.”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanila, “Hindi para sa inyo ang malaman ang mga panahon o mga takdang pagkakataon[a] na itinakda ng Ama sa sarili niyang awtoridad.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “mga panahon o mga kapanahunan.” Dalawang magkaugnay na salita ang ginagamit sa Griyego: ang isa ay maaaring tumukoy sa mga yugto ng panahon, at ang isa naman sa mga angkop o itinakdang pagkakataon.'
    reason: lexical_alternative
  - marker: b
    text: O “sa pamamagitan ng sarili niyang awtoridad.” Literal na “sa sarili niyang awtoridad”; ipinahihiwatig nito na ang Ama ang may sariling karapatang magtakda ng mga bagay na ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ng banayad na pagsalungat at paglipat mula sa tanong ng mga alagad tungo sa pagtutuwid ni Jesus.
- source_word: Οὐχ ὑμῶν ἐστιν γνῶναι
  choice: Hindi para sa inyo na malaman
  rationale: Likas na idyomang Filipino na nagpapahayag na ang kaalamang ito ay hindi saklaw ng kanilang karapatan o tungkulin, nang hindi dinaragdagan ang diwa.
- source_word: χρόνους ἢ καιροὺς
  choice: mga panahon o mga takdang pagkakataon
  rationale: 'Pinananatili ang pagkakaiba ng dalawang magkaugnay na katawagan: ang χρόνοι ay mga yugto o haba ng panahon, samantalang ang καιροί ay maaaring tumukoy sa angkop o itinakdang mga pagkakataon.'
- source_word: ὁ πατὴρ
  choice: ang Ama
  rationale: Tuwirang pinananatili ang titulong nasa Griyego, nang hindi dinaragdagan ng panghalip na wala sa teksto.
- source_word: ἔθετο
  choice: itinakda
  rationale: Ipinapahayag ang pagtatatag o pagtatalaga ng Ama sa mga panahon at pagkakataong tinutukoy.
- source_word: ἐν τῇ ἰδίᾳ ἐξουσίᾳ
  choice: sa sarili niyang kapamahalaan
  rationale: Malapit sa literal na 'sa sarili niyang awtoridad' at ipinakikitang ang mga bagay na ito ay nasa sariling karapatan at saklaw ng pamamahala ng Ama.
theological_decisions:
- issue: Pagpapakahulugan sa pares na χρόνοι / καιροί
  choice: mga panahon o mga takdang pagkakataon
  alternative: mga panahon o mga kapanahunan
  rationale: Pinananatili ang tunay na leksikal na pagkakaiba ngunit hindi ginagawang mahigpit na teknikal ang dalawang salita o ginagawang batayan ng isang haka-hakang sistema ng mga panahon.
- issue: Kahulugan ng ἐξουσία kaugnay ng Ama
  choice: sa sarili niyang kapamahalaan
  alternative: sa sarili niyang awtoridad
  rationale: Inilalarawan ang sariling karapatan at pasiya ng Ama nang hindi nagdaragdag ng mas malawak na pormulang teolohikal na hindi tahasang sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “takdang pagkakataon” upang maipakita ang posibleng diwa ng καιρός habang pinananatiling madaling maunawaan. Ang “kapamahalaan” ay mas likas at hindi gaanong teknikal kaysa “awtoridad,” na inilagay bilang alternatibo sa talababa.
