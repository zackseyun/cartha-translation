id: ACT.1.21
reference: Acts 1:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: δεῖ οὖν τῶν συνελθόντων ἡμῖν ἀνδρῶν ἐν παντὶ χρόνῳ ⸀ᾧ εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς ὁ κύριος Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/021.yaml
  text: Therefore[a], it is necessary that one of the men who accompanied us during all the time in which the Lord Jesus went in and out among us[b],
translation:
  language: tl
  text: Kaya, kinakailangang ang isa sa mga lalaking nakasama natin[a] sa buong panahong ang Panginoong Jesus ay pumapasok at lumalabas sa gitna natin[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lalaking kasama natin”; mas literal, “mga lalaking nagtipon kasama natin.”
    reason: lexical_alternative
  - marker: b
    text: Ang “pumapasok at lumalabas sa gitna natin” ay idyoma para sa patuloy na pamumuhay at pagkilos ni Jesus kasama ng mga alagad.
    reason: cultural_note
lexical_decisions:
- source_word: δεῖ
  choice: kinakailangang
  rationale: Pinananatili ang di-personal na pagpapahayag ng pangangailangan at ang di-pa-tapos na pangungusap na nagpapatuloy sa susunod na talata.
- source_word: οὖν
  choice: Kaya
  rationale: Likas na makabagong Tagalog na malinaw na nagpapahiwatig ng konklusyong hinango ni Pedro mula sa naunang sinabi.
- source_word: συνελθόντων ἡμῖν ἀνδρῶν
  choice: mga lalaking nakasama natin
  rationale: Ipinahahayag ang patuloy na pakikisama ng mga lalaking ito sa pangkat, habang pinananatili ng “lalaki” ang tiyak na kasariang ipinahihiwatig ng ἀνήρ.
- source_word: ἐν παντὶ χρόνῳ
  choice: sa buong panahong
  rationale: Tumutukoy sa kabuuang saklaw ng panahong kasama nila si Jesus, hindi sa bawat hiwa-hiwalay na pagkakataon.
- source_word: εἰσῆλθεν καὶ ἐξῆλθεν
  choice: pumapasok at lumalabas
  rationale: Pinananatili ang larawan ng idyomang Semitiko tungkol sa palagiang pamumuhay at pagkilos ni Jesus kasama ng mga alagad.
- source_word: ἐφ’ ἡμᾶς
  choice: sa gitna natin
  rationale: Likas na naihahatid ang pagkilos ni Jesus kaugnay ng buong pangkat.
- source_word: ὁ κύριος Ἰησοῦς
  choice: ang Panginoong Jesus
  rationale: Ang “Panginoon” ang karaniwan at may teolohikal na bigat na katumbas ng κύριος bilang titulo ni Jesus.
theological_decisions:
- issue: Ang κύριος bilang kristolohikal na titulo
  choice: ang Panginoong Jesus
  alternative: ang Gurong Jesus
  rationale: Pinananatili ng “Panginoon” ang kapuwa paggalang at teolohikal na bigat ng titulo sa Mga Gawa; magiging mas makitid ang kahulugan ng “Guro.”
- issue: Ang panlalaking kahulugan ng ἀνδρῶν
  choice: mga lalaki
  alternative: mga tao
  rationale: Ang ἀνήρ ay tahasang tumutukoy sa mga lalaki sa kontekstong ito, kaya hindi ito ginawang walang-tiyak na kasarian.
- issue: Ang ekspresyong εἰσῆλθεν καὶ ἐξῆλθεν
  choice: pumapasok at lumalabas
  alternative: namuhay at kumilos kasama natin
  rationale: Pinananatili ang tunay na larawan at bahagyang idyomatikong tensiyon ng teksto sa halip na lubusang ipaliwanag ito sa mismong salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong nagpapatuloy sa talata 22 sa pamamagitan ng kuwit sa hulihan, gayundin ang idyomatikong larawan ng pagpasok at paglabas.
