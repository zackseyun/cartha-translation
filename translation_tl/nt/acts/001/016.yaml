id: ACT.1.16
reference: Acts 1:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἔδει πληρωθῆναι τὴν ⸀γραφὴν ἣν προεῖπε τὸ πνεῦμα τὸ ἅγιον διὰ στόματος Δαυὶδ περὶ Ἰούδα τοῦ γενομένου ὁδηγοῦ τοῖς συλλαβοῦσιν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/016.yaml
  text: Men[a], brothers, it was necessary for the Scripture to be fulfilled, which the Holy Spirit spoke beforehand through the mouth of David concerning Judas, who became a guide to those who arrested Jesus[c][b],
translation:
  language: tl
  text: “Mga kapatid na lalaki, kinailangang matupad ang Kasulatang ipinahayag nang una[a] ng Banal na Espiritu sa pamamagitan ng bibig ni David[b] tungkol kay Judas, na naging gabay ng mga dumakip[c] kay Jesus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sinabi nang una” o “ipinahayag na noon.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa pamamagitan ng bibig ni David,” isang idyoma para sa pananalitang ipinahayag sa pamamagitan ni David bilang taong tagapagsalita.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin na “sumunggab kay Jesus” o “humuli kay Jesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Mga kapatid na lalaki
  rationale: Pinananatili nito ang tahasang panlalaking anyo ng dalawang bokatibong pangngalan habang gumagamit ng malinaw at likas na tawag sa makabagong Filipino.
- source_word: ἔδει
  choice: kinailangang
  rationale: Ipinahahayag nito ang kinakailangang mangyari nang hindi ipinapaliwanag nang higit sa teksto ang pinagmulan o mekanismo ng pangangailangang iyon.
- source_word: πληρωθῆναι
  choice: matupad
  rationale: Ito ang karaniwang natural na pananalita sa Filipino para sa katuparan ng Kasulatan at pinananatili ang pasibong diwa.
- source_word: τὴν γραφὴν
  choice: ang Kasulatan
  rationale: Sa kontekstong ito, tumutukoy ang γραφή sa sagradong Kasulatan, hindi lamang sa isang karaniwang sulat.
- source_word: προεῖπε
  choice: paunang sinabi
  rationale: Malapit ito sa literal na diwang ‘sinabi nang una’ at hindi agad nililimitahan ang salita sa mas teknikal na kahulugang ‘ipin προpesiya.’
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: ang Banal na Espiritu
  rationale: Ito ang malinaw at kinikilalang makabagong katawagan sa Filipino para sa banal na persona na siyang nagsasalita sa sugnay.
- source_word: διὰ στόματος Δαυὶδ
  choice: sa pamamagitan ng bibig ni David
  rationale: Pinananatili nito ang matingkad na idyoma ng Griyego at ang paglalarawan kay David bilang taong ginamit sa pagsasalita.
- source_word: περὶ Ἰούδα
  choice: tungkol kay Judas
  rationale: Natural nitong ipinakikilala sa Filipino ang paksa ng sinabi ng Kasulatan.
- source_word: τοῦ γενομένου ὁδηγοῦ
  choice: na naging gabay
  rationale: Tumpak nitong inilalarawan ang pagbabago o papel na ipinahahayag ng γενομένου at hindi nito ginagawang tiyak na ‘ang gabay’ ang walang artikulong ὁδηγοῦ.
- source_word: τοῖς συλλαβοῦσιν Ἰησοῦν
  choice: ng mga dumakip kay Jesus
  rationale: Sa konteksto, ang συλλαμβάνω ay tumutukoy sa pagdakip kay Jesus; malinaw at natural ang ‘dumakip’ sa Filipino.
theological_decisions:
- issue: Ang uri ng pangangailangang matupad ang Kasulatan
  choice: kinailangang matupad
  alternative: itinadhana ng Diyos na mangyari; nararapat lamang na mangyari
  rationale: Ipinakikita ng talata ang pangangailangan ngunit hindi nito lubos na ipinapaliwanag ang kaugnayan ng banal na layunin, paunang kaalaman, at pananagutan ng tao. Hindi nilulutas ng salin ang tensiyong iyon.
- issue: Ang banal at makataong ahensiya sa Kasulatan
  choice: sinabi ng Banal na Espiritu sa pamamagitan ng bibig ni David
  alternative: sinabi ni David sa pamamagitan ng Banal na Espiritu; ipinasulat ng Espiritu kay David
  rationale: Ang Banal na Espiritu ang tahasang paksa ng pandiwang ‘sinabi,’ samantalang si David ang tagapamagitan; pinananatili ng salin ang dalawang antas ng ahensiya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pormal na pananalita ni Pedro, ang tahasang panlalaking tawag, at ang idyomang tumutukoy sa bibig ni David. Ginamit ang “dumakip” bilang pinakanatural na salita sa konteksto ng pag-aresto.
