translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “naninirahan” sa halip na mas lumang “nananahan,” at pinanatili ang maikli ngunit malinaw na daloy ng pangungusap. Ang bawat talababa ay may katumbas na marker sa pangunahing teksto.
