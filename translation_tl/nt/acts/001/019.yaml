base_translation:
  language: en
  yaml_path: translation/nt/acts/001/019.yaml
  text: And it became known to all those living in Jerusalem[a], so that in their own language that field was called Akeldamach, that is[b], Field of Blood.
translation:
  language: tl
  text: Nalaman ito ng lahat ng naninirahan sa Jerusalem, kaya ang bukid na iyon ay tinawag na Akeldamakh[a] sa sarili nilang wika[b], ibig sabihin, “Bukid ng Dugo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas karaniwang isinusulat na “Akeldama” sa maraming salin; ang anyong Griyego rito ay Ἁκελδαμάχ (Akeldamakh).
    reason: alternative_reading
  - marker: b
    text: Ang “sa sarili nilang wika” ay maaari ring isaling “sa sarili nilang diyalekto.” Ang Griyegong διάλεκτος ay maaaring tumukoy sa isang panrehiyong paraan ng pagsasalita o, sa mas malawak na diwa, sa isang wika.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἐγένετο
  choice: Nalaman ito
  rationale: Natural na ipinahahayag sa modernong Tagalog na naging alam ng mga tao ang pangyayari, nang hindi dinaragdagan ang antas ng pagkalantad nito.
- source_word: πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: ng lahat ng naninirahan sa Jerusalem
  rationale: Tuwirang pinananatili ang pangkalahatang saklaw at ang diwa ng permanenteng o karaniwang paninirahan.
- source_word: ὥστε
  choice: kaya
  rationale: Ipinahahayag ang resultang ugnayan sa natural na Tagalog, hindi lamang isang abstraktong lohikal na paghihinuha.
- source_word: κληθῆναι
  choice: ay tinawag
  rationale: Pinananatili ang pasibong anyo at ang diwang ito ang naging tawag sa lupain.
- source_word: τὸ χωρίον ἐκεῖνο
  choice: ang bukid na iyon
  rationale: Ang χωρίον ay maaaring tumukoy sa isang lupain o bukid; pinili ang “bukid” upang manatiling magkakatugma sa paliwanag na “Bukid ng Dugo.”
- source_word: τῇ ἰδίᾳ διαλέκτῳ αὐτῶν
  choice: sa sarili nilang wika
  rationale: Natural sa Tagalog at pinananatili ang posibilidad na ang διάλεκτος ay tumutukoy sa wika sa pangkalahatan; ang alternatibong “diyalekto” ay nasa talababa.
- source_word: Ἁκελδαμάχ
  choice: Akeldamakh
  rationale: Transliterasyon na malapit sa anyong Griyego, kung saan ang pangwakas na χ ay kinakatawan ng “kh”; binabanggit sa talababa ang nakagawiang anyong Akeldama.
- source_word: τοῦτ’ ἔστιν
  choice: ibig sabihin
  rationale: Karaniwan at malinaw na pormula sa Tagalog para sa pagpapaliwanag ng kahulugan.
- source_word: Χωρίον Αἵματος
  choice: Bukid ng Dugo
  rationale: Tuwirang isinasalin ang paliwanag sa pangalan at pinananatiling pantanging katawagan sa pamamagitan ng malalaking titik.
