  source_fidelity: Tumpak na naihahatid ng draft ang saklaw mula sa pagbibinyag ni Juan hanggang sa pag-akyat ni Jesus, ang pasibong pandiwang “iniakyat,” ang kinakailangang diwa ng δεῖ mula sa naunang talata, at ang pagiging saksi ng napili sa muling pagkabuhay ni Jesus. Gayunman, ang paghahati sa dalawang pangungusap ay ginagawang putol ang unang sugnay at hindi angkop na isinasara ang isang temporal na pariralang direktang kaugnay ng pangunahing sugnay.
  naturalness: Ang “maging kasama naming saksi” ay maiintindihan, ngunit bahagyang maaaring basahin bilang isang nakapirming katawagan o bilang pagdaragdag ng diin sa pagiging kasapi. Mas malinaw at likas ang “maging saksi kasama namin,” na tahasang pinananatili ang σὺν ἡμῖν bilang pakikiisa ng bagong saksi sa umiiral na pangkat.
  terminology: Ang “pagbibinyag ni Juan,” “iniakyat siya,” at “muling pagkabuhay” ay angkop sa modernong Filipino Tagalog at tapat sa mga pangunahing terminong Griyego. Walang kailangang idagdag na “sa langit,” at hindi dapat idagdag ang “lalaki” sa “isa sa mga ito.”
