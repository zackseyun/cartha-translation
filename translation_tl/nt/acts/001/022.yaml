  text: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου ἕως τῆς ἡμέρας ἧς ἀνελήμφθη ἀφ’ ἡμῶν, μάρτυρα τῆς ἀναστάσεως αὐτοῦ ⸂σὺν ἡμῖν γενέσθαι⸃ ἕνα τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/022.yaml
  text: beginning from the baptism of John until the day when he was taken up from us[b][a], one of these must become a witness with us of his resurrection.
translation:
  language: tl
  text: Mula sa pagbibinyag ni Juan hanggang sa araw na iniakyat siya mula sa amin, kailangang isa sa mga ito ang maging saksi kasama namin sa kanyang muling pagkabuhay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τοῦ βαπτίσματος Ἰωάννου
  choice: mula sa pagbibinyag ni Juan
  rationale: Likas sa modernong Tagalog at pinananatili ang maaaring tumukoy sa pagbibinyag na isinagawa ni Juan, nang hindi nililinaw nang higit sa Griyego.
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: hanggang sa araw na
  rationale: Natural na panandang pangwakas ng saklaw ng panahon sa Tagalog.
- source_word: ἀνελήμφθη ἀφ’ ἡμῶν
  choice: iniakyat siya mula sa amin
  rationale: Pinananatili ang pasibong anyo at ang pahiwatig ng pag-akyat nang hindi idinaragdag ang hindi tahasang sinabi rito, gaya ng 'sa langit.'
- source_word: μάρτυρα τῆς ἀναστάσεως αὐτοῦ
  choice: saksi sa kanyang muling pagkabuhay
  rationale: Ang 'saksi sa' ang likas na gamit sa Tagalog para sa genitibong ugnayan ng patotoo at ng pangyayaring pinatutunayan.
- source_word: σὺν ἡμῖν γενέσθαι
  choice: maging kasama naming saksi
  rationale: Malinaw na ipinahahayag na sasama ang taong pipiliin sa umiiral na pangkat ng mga saksi.
- source_word: ἕνα τούτων
  choice: isa sa mga ito
  rationale: Hindi idinagdag ang 'lalaki' o 'tao' dahil wala iyon sa mismong parirala at malinaw ito mula sa naunang talata.
theological_decisions:
- issue: Pagdadala sa talata 22 ng kinakailangang diwa mula sa δεῖ sa talata 21
  choice: Kailangang isa sa mga ito ang maging
  alternative: isa sa mga ito ang maging
  rationale: Nakadepende ang sintaks ng talata sa δεῖ ng naunang talata; kailangan ang 'Kailangang' upang mabuo at maging tapat ang diwa sa Tagalog.
- issue: Paglalarawan sa pag-akyat ni Jesus
  choice: iniakyat siya
  alternative: umakyat siya sa langit
  rationale: Pinananatili ang pasibong anyo ng ἀνελήμφθη at hindi idinaragdag ang 'sa langit,' na hindi tahasang nasa talatang ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Dahil bahagi ito ng pangungusap na nagsimula sa talata 21, nagsisimula ang teksto sa maliit na titik at naglalagay ng tuldok bago ang pangunahing sugnay para maging natural ang pagbasa.
