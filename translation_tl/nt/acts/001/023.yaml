  yaml_path: translation/nt/acts/001/023.yaml
  text: 'And they put forward two: Joseph called Barsabbas[a], who was also called Justus, and Matthias.'
translation:
  language: tl
  text: 'At iniharap nila ang dalawa: si Jose na tinatawag na Barsabas[a], na tinatawag din na Justo, at si Matias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagtalaga sila ng dalawa” o “iniharap nila ang dalawa.” Ang pandiwang Griyego ay maaaring mangahulugang ilagay ang mga tao sa harap ng isang pangkat; dito, malamang na tumutukoy ito sa paghaharap sa kanila bilang mga kandidato.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  choice: nagharap
  rationale: Sa konteksto ng pagpili, ipinahihiwatig ng pandiwa ang paglalagay o paghaharap ng mga tao sa harap ng pangkat bilang mga kandidato, hindi lamang ang literal na pagpapatayo sa kanila.
- source_word: δύο
  choice: dalawa
  rationale: Tuwirang tumutukoy sa dalawang lalaking iniharap.
- source_word: καλούμενον
  choice: tinatawag na
  rationale: Likas at malinaw na nagpapakilala sa isa pang pangalan ni Jose.
- source_word: Βαρσαββᾶν
  choice: Barsabas
  rationale: Isinalin sa karaniwang anyong Tagalog ang personal na pangalan.
- source_word: ἐπεκλήθη
  choice: tinatawag din na
  rationale: Ipinakikilala nito ang isa pang pangalan ni Jose; likas sa Tagalog ang 'din' at hindi ito nagdaragdag ng impormasyong wala sa konteksto.
- source_word: Ἰοῦστος
  choice: Justo
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng personal na pangalan.
- source_word: Μαθθίαν
  choice: Matias
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng personal na pangalan.
- source_word: καὶ ... καὶ
  choice: At ... at
  rationale: Pinananatili ang payak na pagpapatuloy ng salaysay at ang pag-uugnay sa dalawang kandidato.
