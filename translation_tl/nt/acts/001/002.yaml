id: ACT.1.2
reference: Acts 1:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἄχρι ἧς ἡμέρας ἐντειλάμενος τοῖς ἀποστόλοις διὰ πνεύματος ἁγίου οὓς ἐξελέξατο ἀνελήμφθη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/002.yaml
  text: until the day when[a], after giving commands through the Holy Spirit to the apostles whom he had chosen, he was taken up.
translation:
  language: tl
  text: hanggang sa araw na siya ay iniakyat, matapos niyang magbigay ng mga utos sa pamamagitan ng Banal na Espiritu[a] sa mga apostol na kanyang pinili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa bisa ng Banal na Espiritu.” Ang pariralang Griyego ay maaaring tumukoy sa paraan o tagapamagitan ng pagbibigay niya ng mga utos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι ἧς ἡμέρας
  choice: hanggang sa araw na
  rationale: Likas sa modernong Tagalog at malinaw na itinatakda ang panghuling araw ng salaysay na binanggit sa naunang talata.
- source_word: ἐντειλάμενος
  choice: matapos niyang magbigay ng mga utos
  rationale: Ipinahahayag ang pagkakauna ng pandiwaring aoristo sa pangunahing pandiwa, habang pinananatili ang lakas ng kahulugang ‘mag-utos’ sa halip na palambutin bilang simpleng tagubilin.
- source_word: τοῖς ἀποστόλοις
  choice: sa mga apostol
  rationale: Ang ‘apostol’ ang kinikilalang katawagan sa Tagalog para sa tiyak na pangkat na hinirang ni Jesus sa Lucas–Mga Gawa.
- source_word: διὰ πνεύματος ἁγίου
  choice: sa pamamagitan ng Banal na Espiritu
  rationale: Pinananatili nito ang maaaring diwa ng paraan o tagapamagitan ng διά na may genitive nang hindi nagdaragdag ng ‘kapangyarihan,’ na wala sa teksto.
- source_word: οὓς ἐξελέξατο
  choice: na kanyang pinili
  rationale: Malinaw na tinutukoy ang mga apostol bilang mga pinili na niya bago ang pag-akyat; sapat na naihahatid ng konteksto ang naunang kilos nang hindi gumagamit ng mabigat na anyo.
- source_word: ἀνελήμφθη
  choice: siya ay iniakyat
  rationale: Tuwirang pinananatili ang balintiyak na anyo at hindi idinaragdag ang ‘sa langit,’ na hindi tahasang nasa talatang ito.
theological_decisions:
- issue: Ugnayan ng mga utos ni Jesus at ng Banal na Espiritu
  choice: Nagbigay si Jesus ng mga utos sa pamamagitan ng Banal na Espiritu bago siya iniakyat.
  alternative: Nagbigay si Jesus ng mga utos sa bisa o pagkilos ng Banal na Espiritu.
  rationale: Pinakamalikas na inuugnay ng sintaks ang διὰ πνεύματος ἁγίου sa ἐντειλάμενος. Ang ‘sa pamamagitan ng’ ay nagpapanatili sa puwang ng kahulugan sa pagitan ng paraan at tagapamagitan nang hindi ito nilulutas sa isang mas tiyak na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang karaniwang terminong ‘apostol’ at ang balintiyak na ‘iniakyat’; iniwasang idagdag ang ‘sa langit’ dahil wala iyon sa mismong talata.
