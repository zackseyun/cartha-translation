  naturalness: Makabago at angkop ang rehistro sa kabuuan. Mas malinaw at mas natural ang “nakita ninyo siyang tumungo sa langit” kaysa “nakita ninyong pagpunta niya sa langit.” Ang “sa paraang nakita ninyo siyang tumungo” ay sapat nang naghahayag ng paghahambing; hindi kailangan ang medyo mabigat na “katulad ng.”
  terminology: Ang “Mga lalaking taga-Galilea,” “langit,” “iniakyat,” at “darating” ay angkop at pare-pareho sa piniling terminolohiya. Sa talababa, mas tumpak na tradisyonal na pagpapalawak ang “Ang Jesus ding ito,” dahil ang idinagdag na “ding” ang nagsasaad ng pagkakakilanlan na wala bilang hiwalay na salita sa Griyego.
