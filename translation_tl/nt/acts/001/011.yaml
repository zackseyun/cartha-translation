  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἳ καὶ εἶπαν· Ἄνδρες Γαλιλαῖοι, τί ἑστήκατε ⸀βλέποντες εἰς τὸν οὐρανόν; οὗτος ὁ Ἰησοῦς ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν εἰς τὸν οὐρανὸν οὕτως ἐλεύσεται ὃν τρόπον ἐθεάσασθε αὐτὸν πορευόμενον εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/011.yaml
  text: They also said[a], “Men of Galilee, why do you stand looking into heaven? This Jesus, who was taken up from you into heaven, will come in the same way that you saw him going into heaven.”
translation:
  language: tl
  text: Sinabi rin nila, “Mga lalaking taga-Galilea, bakit kayo nakatayo at nakatingin sa langit? Itong si Jesus[a], na iniakyat mula sa piling ninyo tungo sa langit, ay darating sa paraang nakita ninyo siyang tumungo sa langit.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, sa tradisyonal na pagpapadiin, “Ang Jesus ding ito.” Tahasang sinasabi ng Griyego na “itong si Jesus”; ang “ding” ay interpretibong dagdag upang idiin na siya rin ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Γαλιλαῖοι
  choice: Mga lalaking taga-Galilea
  rationale: Pinananatili ang panlalaking anyo ng ἄνδρες at ang tuwirang pagtawag sa mga lalaking nagmula sa Galilea, habang gumagamit ng likas na modernong Tagalog.
- source_word: τί ἑστήκατε βλέποντες
  choice: bakit kayo nakatayo at nakatingin
  rationale: Ipinahahayag ng perpektong ἑστήκατε ang kasalukuyang kalagayan ng pagtayo, at ng participle na βλέποντες ang kasabay na pagtingin. Hindi pinalalakas sa “nakatitig,” na maaaring lumampas sa karaniwang diwa ng βλέπω.
- source_word: εἰς τὸν οὐρανόν
  choice: sa langit / tungo sa langit
  rationale: Sa konteksto ng pag-akyat ni Jesus, ang οὐρανός ay angkop na isaling “langit.” Ang “tungo sa” sa paglalarawan ng pagkakaakyat ay malinaw na naghahatid ng direksiyong ipinahihiwatig ng εἰς.
- source_word: οὗτος ὁ Ἰησοῦς
  choice: Itong si Jesus
  rationale: Direktang pinananatili ang demonstratibong οὗτος nang hindi idinaragdag sa pangunahing teksto ang salitang “mismo” o “siya ring,” na hindi tahasang nasa Griyego.
- source_word: ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν
  choice: na iniakyat mula sa piling ninyo
  rationale: Ang pasibong “iniakyat” ay tumutugma sa ἀναλημφθείς at pinananatili ang pataas na kilos. Ang “mula sa piling ninyo” ay natural na Tagalog para sa paghihiwalay sa kinaroroonan ng mga alagad.
- source_word: οὕτως ἐλεύσεται ὃν τρόπον
  choice: ay darating sa paraang katulad ng
  rationale: Ipinakikita ang paghahambing tungkol sa paraan ng pagdating nang hindi ginagawang “babalik” ang payak na ἐλεύσεται, bagaman malinaw sa konteksto na muling pagdating ang tinutukoy.
- source_word: ἐθεάσασθε αὐτὸν πορευόμενον
  choice: nakita ninyong pagpunta niya
  rationale: Ang “nakita” ay malinaw at hindi makaluma para sa ἐθεάσασθε; ang “pagpunta” ay payak na katumbas ng πορευόμενον at hindi nagdaragdag ng detalye sa kilos.
theological_decisions:
- issue: Kahulugan ng οὐρανός sa konteksto ng pag-akyat at pagdating
  choice: langit
  alternative: kalangitan / himpapawid
  rationale: Maaaring tumukoy ang οὐρανός sa nakikitang kalangitan, ngunit sa salaysay ng pag-akyat ni Jesus at sa pangako ng kanyang pagdating, higit na angkop ang “langit” nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- issue: Kung dapat bang palawakin ang οὗτος ὁ Ἰησοῦς upang idiin ang pagkakakilanlan
  choice: Itong si Jesus
  alternative: Ang mismong Jesus na ito
  rationale: Tahasan sa Griyego ang demonstratibong “ito” ngunit walang hiwalay na salitang nangangahulugang “mismo” o “siya ring.” Pinananatili sa pangunahing teksto ang mas mahigpit na salin at inilalagay sa talababa ang tradisyonal na pagpapadiin.
- issue: Kung isasalin ang ἐλεύσεται bilang “darating” o “babalik”
  choice: darating
  alternative: babalik
  rationale: Ang ἐλεύσεται ay tahasang “darating.” Bagaman ipinahihiwatig ng konteksto ang muling pagdating ni Jesus, iniiwasan ng pangunahing teksto ang pagdaragdag ng aspektong hindi leksikal na nakasaad sa pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Mga lalaking taga-Galilea” upang mapanatili ang panlalaking tuwirang tawag; “mula sa piling ninyo” upang maging likas ang ideya ng paghihiwalay; at “darating” upang manatiling malapit sa anyo ng Griyego.
