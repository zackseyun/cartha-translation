id: ACT.1.24
reference: Acts 1:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ προσευξάμενοι εἶπαν Σὺ κύριε καρδιογνῶστα πάντων, ἀνάδειξον ὃν ἐξελέξω, ἐκ τούτων τῶν δύο ἕνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/024.yaml
  text: And after praying[a], they said, “You, Lord, knower of the hearts of all[b], show which one of these two you have chosen,”
translation:
  language: tl
  text: At pagkatapos manalangin, sinabi nila, “Ikaw, Panginoon[a], na nakaaalam ng mga puso ng lahat, ipakita mo[b] kung sino sa dalawang ito ang pinili mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring ang tawag na “Panginoon” ay patungkol sa Diyos sa pangkalahatan o partikular kay Jesus; hindi tahasang tinutukoy ng Griyego kung sino rito.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “italaga” o “ituro”; ang pandiwa ay maaaring mangahulugang ihayag o hayagang italaga ang isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσευξάμενοι
  choice: pagkatapos manalangin
  rationale: Ipinahihiwatig ng aorist participle na nauna ang pananalangin sa pagsasalita; natural at malinaw sa modernong Tagalog ang ganitong pagkakasunod.
- source_word: Σὺ κύριε
  choice: Ikaw, Panginoon
  rationale: Pinananatili ng tahasang “Ikaw” ang diin ng panghalip at ng “Panginoon” ang tuwirang pagtawag.
- source_word: καρδιογνῶστα πάντων
  choice: na nakaaalam ng puso ng lahat
  rationale: Likas itong pakinggan sa Tagalog habang malinaw na ipinahahayag ang natatanging kaalaman sa panloob na pagkatao ng bawat isa.
- source_word: ἀνάδειξον
  choice: ipakita mo
  rationale: Akma ito sa kahilingang ihayag kung sino ang napili, nang hindi ipinapalagay na ang pandiwa mismo ay tumutukoy sa pormal na pagtatalaga.
- source_word: ὃν ἐξελέξω
  choice: kung sino ... ang pinili mo
  rationale: Ipinahahayag nito ang pagpiling naganap na at ngayo’y hinihiling na ipakilala.
- source_word: ἐκ τούτων τῶν δύο ἕνα
  choice: kung sino sa dalawang ito
  rationale: Natural na Tagalog ito para sa pagpili ng isa mula sa dalawang kandidato at hindi nagdaragdag ng salitang wala sa Griyego.
theological_decisions:
- issue: Kung sino ang tinutukoy na “Panginoon” sa panalangin
  choice: Hindi tinukoy kung ang tawag ay sa Diyos sa pangkalahatan o partikular kay Jesus.
  alternative: Unawain ang “Panginoon” bilang Diyos Ama, o partikular bilang muling nabuhay na si Jesus.
  rationale: “Panginoon” lamang ang tahasang sinasabi ng Griyego; pinananatili ng salin ang tunay na kalabuan sa halip na lutasin ito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nakaaalam” bilang pamantayang anyo at iniwasan ang sobrang literal ngunit alanganing tambalang katawagan para sa καρδιογνώστης.
