id: ACT.1.8
reference: Acts 1:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς, καὶ ἔσεσθέ ⸀μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/008.yaml
  text: But you will receive power when the Holy Spirit has come upon you[a], and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the end of the earth.
translation:
  language: tl
  text: Ngunit tatanggap kayo ng kapangyarihan kapag dumating sa inyo ang Banal na Espiritu, at magiging mga saksi ko kayo sa Jerusalem, sa buong Judea at sa Samaria, at hanggang sa dulo ng daigdig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego, isahan ang parirala: “hanggang sa dulo ng daigdig.” Idyoma ito para sa pinakamalayong saklaw ng daigdig; maaari rin itong isalin na “hanggang sa mga dulo ng daigdig.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Likas at marangal na panandang pasalungat sa naunang pahayag sa talata 7.
- source_word: λήμψεσθε δύναμιν
  choice: tatanggap kayo ng kapangyarihan
  rationale: Ipinapakita ng λήμψεσθε na tinatanggap ang ipinagkakaloob, at pinananatili ng “kapangyarihan” ang malawak na diwa ng δύναμις bilang kakayahang ibinibigay ng Espiritu.
- source_word: ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς
  choice: kapag dumating sa inyo ang Banal na Espiritu
  rationale: Ginagawang likas na sugnay na panahunan sa Tagalog ang genitive absolute at pinananatili ang kilos ng pagdating ng Espiritu sa kanila nang hindi nagdaragdag ng paliwanag.
- source_word: ἔσεσθέ μου μάρτυρες
  choice: magiging mga saksi ko kayo
  rationale: Tuwirang ipinahahayag ang magiging katayuan nila bilang mga saksing nauugnay kay Jesus; hindi inilalagay rito ang mas huling kahulugan ng “martir.”
- source_word: ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ
  choice: sa buong Judea at sa Samaria
  rationale: Nililinaw ng pag-uulit ng “sa” ang dalawang rehiyon, habang ang “buong” ay wastong iniuugnay sa Judea gaya ng pagkakabuo ng Griyego.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: hanggang sa dulo ng daigdig
  rationale: Pinananatili ang anyong isahan ng Griyego at ang idyomatikong diwa ng pinakamalayong maaabot sa daigdig.
theological_decisions:
- issue: Pagkakakilanlan ng τοῦ ἁγίου πνεύματος
  choice: ang Banal na Espiritu
  alternative: ang banal na espiritu
  rationale: Sa konteksto, tumutukoy ang parirala sa personal at banal na Espiritu; ginagamit ang karaniwang makabagong anyo sa Filipino nang hindi nagpapasok ng dagdag na doktrinal na paliwanag.
- issue: Ugnayan ng Espiritu, kapangyarihan, at pagsaksi
  choice: Tatanggap sila ng kapangyarihan sa pagdating ng Espiritu at magiging mga saksi ni Jesus
  alternative: Ang kapangyarihan ay ipakahulugan lamang bilang likas na husay o pampolitikang kapangyarihan
  rationale: Pinananatili ng salin ang tahasang pagkakasunod at ugnayan sa teksto ngunit hindi nililimitahan ang uri ng kapangyarihang tinutukoy nang higit sa sinasabi ng talata.
- issue: Saklaw ng atas na sumaksi
  choice: Konkretong paglawak mula Jerusalem hanggang sa dulo ng daigdig
  alternative: Pawang sagisag lamang ang mga lugar
  rationale: Pinananatili ang tunay na mga pangalang heograpiko at ang pandaigdigang abot ng pahayag nang hindi nagdaragdag ng isang partikular na sistemang eklesyolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “Ngunit” sa halip na mas kolokyal na “Pero,” at “daigdig” upang tumugma sa dignidad ng talata. Iningatan ang literal na heograpiya, ang anyong isahan ng huling parirala, at ang hindi nilimitahang diwa ng “kapangyarihan.”
