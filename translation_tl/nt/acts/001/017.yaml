  text: ὅτι κατηριθμημένος ἦν ⸀ἐν ἡμῖν καὶ ἔλαχεν τὸν κλῆρον τῆς διακονίας ταύτης.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/017.yaml
  text: For he was numbered among us and received a share in this ministry[a].
translation:
  language: tl
  text: Sapagkat ibinilang siyang isa sa amin at tumanggap siya ng bahagi sa paglilingkod na ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tumanggap siya ng itinakdang bahagi sa paglilingkod na ito.” Ang salitang Griyego na κλῆρος ay maaaring mangahulugang “lot” (na maaaring italaga sa pamamagitan ng palabunutan) o “bahagi/bahaging itinakda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Sa konteksto, ipinakikilala nito ang dahilan ng sinabi ni Pedro tungkol kay Judas. Likas sa modernong Tagalog ang “sapagkat” at malinaw ang paliwanag na ugnayan.
- source_word: κατηριθμημένος ἦν
  choice: ibinilang
  rationale: Pinananatili nito ang pasibong diwa na si Judas ay kinilalang kabilang sa pangkat, hindi lamang basta nakisama rito.
- source_word: ἐν ἡμῖν
  choice: isa sa amin
  rationale: Malinaw nitong ipinahahayag ang tunay na pagkabilang ni Judas sa pangkat ng mga apostol at mas natural ito kaysa sa literal na “sa amin.”
- source_word: ἔλαχεν
  choice: tumanggap siya
  rationale: Maaaring tumukoy ang pandiwa sa pagtatamo o pagtanggap ng isang bagay na itinakda o ibinahagi. Natural ang “tumanggap” habang ang diwa ng pagkakatalaga ay naipapahiwatig ng “bahagi” at nililinaw sa talababa.
- source_word: τὸν κλῆρον
  choice: ng bahagi
  rationale: Ang κλῆρος ay maaaring mangahulugang “palabunot” o, sa pinalawak na diwa, isang itinakdang bahagi. Ang “bahagi” ang malinaw at natural sa konteksto, habang pinananatili sa talababa ang leksikal na lawak.
- source_word: τῆς διακονίας ταύτης
  choice: sa paglilingkod na ito
  rationale: Ang διακονία rito ay ang tungkulin o paglilingkod ng mga apostol. Ang “paglilingkod” ay dignified, madaling maunawaan, at hindi labis na pinapakitid ang kahulugan sa isang teknikal na katungkulan.
theological_decisions:
- issue: Ang kaugnayan ni Judas sa pangkat at paglilingkod ng mga apostol
  choice: Tahasang sinasabi na ibinilang si Judas na isa sa kanila at tumanggap ng bahagi sa kanilang paglilingkod.
  alternative: Maaaring pahinain ito bilang pakikisama lamang ni Judas sa pangkat, o palawakin bilang pahayag tungkol sa kaniyang pangwakas na kalagayang espirituwal.
  rationale: Pinatutunayan ng Griyego ang tunay na pagkabilang at pakikibahagi ni Judas, ngunit hindi nito sa talatang ito nilulutas ang mas malawak na usaping teolohikal tungkol sa pagsang-ayon sa kaniya o pananatili niya sa pananampalataya.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “ibinilang siyang isa sa amin” upang mapanatili ang pasibong diwa at tunay na pagkabilang sa pangkat; iniwasan ang sobrang teknikal na pananalita.
