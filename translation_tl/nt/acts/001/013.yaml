reference: Acts 1:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὅτε εἰσῆλθον, ⸂εἰς τὸ ὑπερῷον ἀνέβησαν⸃ οὗ ἦσαν καταμένοντες, ὅ τε Πέτρος καὶ ⸂Ἰωάννης καὶ Ἰάκωβος⸃ καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος, Ἰάκωβος Ἁλφαίου καὶ Σίμων ὁ ζηλωτὴς καὶ Ἰούδας Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/013.yaml
  text: 'And when they had entered[a], they went up to the upstairs room where they were staying: Peter, John, James, and Andrew; Philip and Thomas; Bartholomew and Matthew; James the son of Alphaeus, and Simon the Zealot, and Judas the son of James.'
translation:
  language: tl
  text: At nang makapasok na sila, umakyat sila sa silid sa itaas na tinutuluyan nila. Naroon sina Pedro, Juan, Santiago, at Andres; Felipe at Tomas; Bartolome at Mateo; Santiago na anak ni Alfeo; Simon na Zelote; at Judas na anak ni Santiago.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Judas na kapatid ni Santiago.” Ang literal sa Griyego ay “Judas ni Santiago,” kaya hindi tahasang tinutukoy ang eksaktong ugnayan nila.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσῆλθον
  choice: makapasok na sila
  rationale: Ipinahihiwatig ng temporal na sugnay ang pagkilos na nauna sa pag-akyat; natural itong ipinapahayag sa Tagalog sa pamamagitan ng “makapasok na.”
- source_word: εἰς τὸ ὑπερῷον ἀνέβησαν
  choice: umakyat sila sa silid sa itaas
  rationale: Pinananatili ang paitaas na kilos ng ἀνέβησαν at ang karaniwang arkitektural na kahulugan ng ὑπερῷον nang hindi gumagamit ng pariralang maaaring magkaroon ng di-kinakailangang tradisyonal na bigat.
- source_word: οὗ ἦσαν καταμένοντες
  choice: na tinutuluyan nila
  rationale: Likas na Tagalog ito para sa patuloy nilang pananatili o pagtuloy sa lugar.
- source_word: ὅ τε Πέτρος καὶ Ἰωάννης καὶ Ἰάκωβος καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος
  choice: Naroon sina Pedro, Juan, Santiago, at Andres; Felipe at Tomas; Bartolome at Mateo
  rationale: Nililinaw ng “Naroon sina” na ang sumusunod ay talaan ng mga nananatili roon. Pinananatili ng mga tuldok-kuwit ang mga pangkat sa listahan nang hindi pilit na inuulit ang bawat pangatnig ng Griyego.
- source_word: Ἰάκωβος Ἁλφαίου
  choice: Santiago na anak ni Alfeo
  rationale: Sa ganitong talaan ng mga pangalan, ang genitibo ay likas na patronimiko; ginagawang malinaw at natural sa Tagalog ang ipinahihiwatig na ugnayan.
- source_word: Σίμων ὁ ζηλωτὴς
  choice: Simon na Makabayan
  rationale: Ang ζηλωτής ay bansag na nagpapakilala kay Simon; ang “Makabayan” ay malinaw na karaniwang salin sa modernong Filipino at iniiwasang gawing malabong salitang hiram ang titulo.
- source_word: Ἰούδας Ἰακώβου
  choice: Judas na anak ni Santiago
  rationale: Pinakamalamang na patronimiko ang genitibo sa konteksto ng talaan, ngunit hindi tahasang sinasabi ng Griyego ang eksaktong ugnayan kaya pinananatili sa talababa ang ibang posibilidad.
theological_decisions:
- issue: Ang ugnayang ipinahihiwatig ng Ἰούδας Ἰακώβου
  choice: Judas na anak ni Santiago
  alternative: Judas na kapatid ni Santiago; o mas literal, Judas na kay Santiago
  rationale: Sa talaan ng mga lalaking kinikilala sa pamamagitan ng kanilang ama, “anak ni Santiago” ang mas malamang at mas natural na pagbasa. Gayunman, genitibo lamang ang nasa Griyego at hindi nito tahasang sinasabing “anak” o “kapatid,” kaya hindi inaalis ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado ngunit madaling maunawaan. Ginamit ang karaniwang anyong Filipino ng mga pangalan. Inayos ang mahaba at siksik na pangungusap sa dalawang pangungusap para sa natural na daloy, habang pinananatili ang pagkakasunod-sunod at pagpapangkat ng listahan.
