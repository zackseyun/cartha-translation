  text: Καὶ ἐν ταῖς ἡμέραις ταύταις ἀναστὰς Πέτρος ἐν μέσῳ τῶν ⸀ἀδελφῶν εἶπεν (ἦν τε ὄχλος ὀνομάτων ἐπὶ τὸ αὐτὸ ⸀ὡς ἑκατὸν εἴκοσι)·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/015.yaml
  text: And in those days Peter stood up in the midst of the brothers and said (the number of names together was about one hundred twenty),[a]
translation:
  language: tl
  text: 'Noong mga araw na iyon, tumayo si Pedro sa gitna ng mga kapatid[a] at sinabi (ang bilang ng mga taong magkakasama ay humigit-kumulang isang daan at dalawampu):'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa anyong panlalaki at literal na tumutukoy sa “mga kapatid na lalaki,” ngunit dito ay maaaring kabilang ang lahat ng kapwa mananampalataya, pati ang mga babae.
    reason: Pinananatili ang posibleng inklusibong saklaw ng ἀδελφῶν nang hindi ikinukubli ang anyo ng salitang Griyego.
lexical_decisions:
- source_word: ἀναστὰς
  choice: tumayo
  rationale: Ipinakikita ng aorist participle ang kongkretong pagkilos ni Pedro bago siya magsalita; natural ito sa ganitong tagpo.
- source_word: ἐν μέσῳ
  choice: sa gitna ng
  rationale: Pinananatili nito ang larawang nakapuwesto si Pedro sa loob ng nagkakatipong pangkat.
- source_word: ἀδελφῶν
  choice: mga kapatid
  rationale: Ito ang natural na salin sa Tagalog. Hindi tinutukoy ng salitang Tagalog ang kasarian, kaya maaari nitong katawanin ang anyong panlalaki ng Griyego at ang posibleng inklusibong pagtukoy sa buong komunidad.
- source_word: ὄχλος ὀνομάτων
  choice: bilang ng mga tao
  rationale: Literal itong ‘karamihan ng mga pangalan,’ ngunit isang idyoma ito para sa isang nabilang na pangkat ng mga tao. Ang literal na ‘mga pangalan’ ay hindi natural at maaaring makalito sa modernong Tagalog.
- source_word: ἐπὶ τὸ αὐτό
  choice: nagkakatipon
  rationale: Ipinahahayag nito na sama-sama o nagkakatipon ang pangkat nang hindi labis na tinutukoy na nasa iisang eksaktong lugar.
- source_word: ὡς ἑκατὸν εἴκοσι
  choice: humigit-kumulang sa isang daan at dalawampu
  rationale: Ipinananatili ng ‘humigit-kumulang’ ang pagtatantiya na ipinahihiwatig ng ὡς.
- source_word: τε
  choice: at
  rationale: Isinama ang pang-ugnay sa loob ng panaklong upang katawanin ang pandugtong na τε sa Griyego.
theological_decisions:
- issue: Kasarian at saklaw ng ἀδελφῶν sa nagkakatipong komunidad
  choice: ‘mga kapatid’ sa pangunahing teksto, na may talababa tungkol sa posibleng pagsaklaw sa mga lalaki at babae
  alternative: ‘mga kapatid na lalaki’ o ‘mga mananampalataya’
  rationale: Ang ‘mga kapatid’ ang eksaktong natural na katumbas sa Tagalog at hindi nito sapilitang nilulutas kung ang anyong panlalaki sa Griyego ay tumutukoy lamang sa mga lalaki o sa lahat ng kapwa mananampalataya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang ‘mga kapatid’ at ang idyomatikong ‘bilang ng mga tao’ upang maiwasan ang di-likas na literalismong ‘bilang ng mga pangalan.’ Ang tutuldok ay nagpapakitang nagpapatuloy sa susunod na talata ang sinabi ni Pedro.
