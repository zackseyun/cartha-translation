  text: Οἱ μὲν οὖν συνελθόντες ⸀ἠρώτων αὐτὸν λέγοντες· Κύριε, εἰ ἐν τῷ χρόνῳ τούτῳ ἀποκαθιστάνεις τὴν βασιλείαν τῷ Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/006.yaml
  text: So when they had come together[a], they asked him, saying, “Lord, is it at this time that you are restoring the kingdom to Israel?”
translation:
  language: tl
  text: Kaya nang magkatipon sila, tinanong nila siya, “Panginoon, sa panahong ito mo ba ibinabalik ang kaharian sa Israel[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para sa Israel.” Ang datibo sa Griyego ay maaaring tumukoy sa kapakinabangan (“para sa Israel”) o, nang mas tuwiran, sa pagbabalik ng kaharian “sa Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν συνελθόντες
  choice: Kaya nang magkatipon sila
  rationale: Ginamit ang “Kaya” bilang likas na pang-ugnay sa daloy ng salaysay, habang ang “nang magkatipon sila” ay nagpapahayag ng temporal na gamit ng participle συνελθόντες.
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: tinanong nila siya
  rationale: Ang payak na anyong pasalaysay ay natural sa modernong Tagalog. Hindi na isinalin nang hiwalay ang λέγοντες dahil malinaw nang ipinakikilala ng pandiwa at bantas ang mismong tanong.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang magalang na pagtawag at ang teolohikal na bigat ng τίτulong κύριος nang hindi ito nililimitahan sa kahulugang “Guro” o “Amo.”
- source_word: ἐν τῷ χρόνῳ τούτῳ
  choice: sa panahong ito
  rationale: Ang χρόνος ay maaaring tumukoy sa isang panahon o takdang pagkakataon, hindi lamang sa isang saglit; malinaw at likas dito ang “sa panahong ito.”
- source_word: ἀποκαθιστάνεις
  choice: ibinabalik
  rationale: Ipinahihiwatig ng ἀποκαθίστημι ang pagpapanumbalik sa dating kalagayan. Ang kasalukuyang aspektong “ibinabalik” ay angkop sa tanong kung ito na ang ginagawa o gagawin sa panahong iyon.
- source_word: τὴν βασιλείαν
  choice: ang kaharian
  rationale: Bagaman maaari ring mangahulugang paghahari ang βασιλεία, ang “kaharian” ay mas tuwirang nagpapanatili sa inaasahang pagpapanumbalik na tinutukoy ng mga alagad nang hindi ipinapaliwanag kung ito ay politikal o espirituwal.
- source_word: τῷ Ἰσραήλ
  choice: sa Israel
  rationale: Tuwirang pinananatili ng “sa Israel” ang posibleng diwa ng pagbabalik ng kaharian sa Israel. Dahil maaari ring unawain ang datibo bilang kapakinabangan, inilagay sa talababa ang “para sa Israel.”
theological_decisions:
- issue: Ang uri ng inaasahan ng mga alagad tungkol sa kaharian at Israel
  choice: Ipinahayag ang tanong bilang pagbabalik ng kaharian sa Israel nang hindi nililinaw kung politikal, pambansa, o espirituwal ang kaharian.
  alternative: “ibinabalik ang kaharian para sa Israel” o “ibinabalik ang kaharian ng Israel”
  rationale: Iniuulat ng talata ang tanong ng mga alagad; hindi nito mismo pinagtitibay o itinatama ang lahat ng palagay na nasa likod ng tanong. Pinananatili ng salin ang tunay na teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural sa karaniwang mambabasa. Iniwasan ang sobrang literal na “na nagsasabi” sapagkat hindi ito likas sa Tagalog, ngunit pinanatili ang nilalaman at anyo ng tuwirang tanong.
