    rationale: Ang Griyego ay tahasang naghahambing kay Juan at sa mga kausap bago idagdag ang “hindi matapos ang maraming araw na ito.” Ang paglipat ng “kayo ay babautismuhan” kaagad matapos ng “ngunit” ay mas malapit sa ayos at diin ng pinagmulan.
  - severity: low
    issue: Ang “ilang araw na lamang” ay mas tiyak kaysa sa pinagmulang pahayag.
    rationale: Maaaring unawain ito bilang eksaktong iilang araw, samantalang ang Griyego ay nagsasabing hindi na maraming araw ang lilipas. Ang “pagkalipas ng hindi na maraming araw” ay pinananatili ang antas ng katiyakan ng source.
  revised_text: Sapagkat nagbautismo si Juan sa tubig, ngunit kayo ay babautismuhan sa Espiritu Santo pagkalipas ng hindi na maraming araw mula ngayon.[a]
