  text: ὅτι Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ ⸂ἐν πνεύματι βαπτισθήσεσθε⸃ ἁγίῳ οὐ μετὰ πολλὰς ταύτας ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/005.yaml
  text: For John baptized with water[a], but you will be baptized in the Holy Spirit not many days from now.
translation:
  language: tl
  text: Sapagkat nagbautismo si Juan sa tubig, ngunit kayo ay babautismuhan sa Espiritu Santo pagkalipas ng hindi na maraming araw mula ngayon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa pamamagitan ng Espiritu Santo.” Ang salitang Griyego ay maaaring mangahulugang “sa” o “sa pamamagitan ng.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag o batayan ng naunang sinabi ni Jesus. Likas sa Filipino ang “Sapagkat” at pinananatili nito ang ugnayang nagpapaliwanag.
- source_word: ἐβάπτισεν
  choice: nagbautismo
  rationale: Pinananatili ng kinikilalang terminong “bautismo” ang relihiyosong kahulugan nang hindi ipinipilit ang isang tiyak na paraan gaya ng paglulubog.
- source_word: ὕδατι
  choice: sa tubig
  rationale: Natural itong parirala sa Filipino at maaari nitong katawanin ang gamit o kaugnayan sa tubig nang hindi labis na tinutukoy ang paraan.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: sa Espiritu Santo
  rationale: Ang “sa” ay natural at sapat na malapit sa ἐν upang mapanatili ang maaaring diwa ng saklaw o kaparaanan. Ginamit ang “Espiritu Santo” bilang tiyak na banal na persona ayon sa konteksto.
- source_word: βαπτισθήσεσθε
  choice: babautismuhan kayo
  rationale: Tuwirang pinananatili nito ang panghinaharap at balintiyak na anyo, pati ang pagkakaugnay nito sa bautismo ni Juan, habang hindi tahasang pinapangalanan ang gumagawa.
- source_word: οὐ μετὰ πολλὰς ταύτας ἡμέρας
  choice: ilang araw na lamang mula ngayon
  rationale: Likas na salin ito sa modernong Filipino ng kahulugang hindi na lilipas ang maraming araw, at malinaw na naipahahayag ang panandang-panahong tumutukoy sa kasalukuyang sandali.
theological_decisions:
- issue: Pagpapakahulugan sa ἐν πνεύματι ἁγίῳ sa pormulang may kinalaman sa bautismo
  choice: sa Espiritu Santo
  alternative: sa pamamagitan ng Espiritu Santo
  rationale: Maaaring tumukoy ang ἐν sa kinaroroonan o saklaw, o sa paraan/kasangkapan. Hindi nilulutas ng “sa Espiritu Santo” ang tensiyong ito, samantalang inilalahad sa talababa ang mas tahasang instrumental na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyong Kristiyano nang hindi nagpapasok ng denominasyonal na pagpapakahulugan.
