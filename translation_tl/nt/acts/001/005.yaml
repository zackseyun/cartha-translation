- from: Sapagkat nagbautismo si Juan sa tubig, ngunit ilang araw na lamang mula ngayon ay babautismuhan kayo sa Espiritu Santo.[a]
  to: Sapagkat nagbautismo si Juan sa tubig, ngunit kayo ay babautismuhan sa Espiritu Santo pagkalipas ng hindi na maraming araw mula ngayon.[a]
  rationale: Inayos ang pagkakasunod-sunod upang manatiling malinaw ang pagtutol sa pagitan ng bautismo ni Juan at ng darating na bautismo ng mga kausap. Pinalitan ang panahong parirala ng mas maingat na katumbas na hindi nagdaragdag ng tiyak na bilang ng araw. Pinanatili ang terminolohiyang bautismo at ang sinadyang di-pagpapasya sa saklaw laban sa instrumental na diwa ng ἐν πνεύματι ἁγίῳ.
