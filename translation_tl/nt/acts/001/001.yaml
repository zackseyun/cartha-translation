id: ACT.1.1
reference: Acts 1:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τὸν μὲν πρῶτον λόγον ἐποιησάμην περὶ πάντων, ὦ Θεόφιλε, ὧν ἤρξατο ⸀ὁ Ἰησοῦς ποιεῖν τε καὶ διδάσκειν
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/001.yaml
  text: In the first account[a], O Theophilus, I wrote about all that Jesus began both to do and to teach,
translation:
  language: tl
  text: Sa una kong salaysay[a], O Teofilo, isinulat ko ang tungkol sa lahat ng sinimulang gawin at ituro ni Jesus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nauna kong salaysay” o “una kong aklat.”
    reason: Ipinapakita ng λόγος at πρῶτον ang isang naunang nakasulat na akda; maaaring ilarawan iyon bilang salaysay o aklat.
lexical_decisions:
- source_word: Τὸν μὲν πρῶτον λόγον
  choice: sa una kong salaysay
  rationale: Sa kontekstong ito, ang λόγος ay tumutukoy sa isang nakasulat na salaysay, hindi sa isang indibidwal na “salita.” Ipinahihiwatig ng πρῶτον at μέν na ito ang unang akda bago ang kasalukuyang pagpapatuloy. Ginawang tahas ang “kong” sapagkat ang sumulat ang gumawa ng salaysay.
- source_word: ἐποιησάμην
  choice: isinulat ko
  rationale: Bagaman literal na maaaring mangahulugang “ginawa ko,” kasama ng λόγος ay tumutukoy ito sa pagbuo o pagsulat ng isang akda. “Isinulat ko” ang malinaw at likas na katumbas sa Filipino.
- source_word: περὶ πάντων
  choice: ang tungkol sa lahat
  rationale: Ipinapakita ng περί na ang kasunod ay paksa ng salaysay. Pinananatili ng “lahat” ang malawak na saklaw ng πάντων nang hindi ipinapaliwanag kung gaano ito kaubos o kakumpleto.
- source_word: ὦ Θεόφιλε
  choice: O Teofilo
  rationale: Ang ὦ ay tanda ng tuwirang pagtawag. Pinananatili ng “O” ang pormal na bokatibong himig nang hindi nagdaragdag ng diwa gaya ng “mahal kong.” Isinalin ang pangalan ayon sa karaniwang anyong Filipino na “Teofilo.”
- source_word: ὧν
  choice: ng
  rationale: Sa pariralang “lahat ng,” likas na naiuugnay ng “ng” ang πάντων sa kasunod na sugnay na naglalarawan sa lahat ng tinutukoy.
- source_word: ἤρξατο
  choice: sinimulang
  rationale: Tahas sa Griyego ang diwa ng pagsisimula. Mahalaga itong panatilihin at huwag gawing simpleng “ginawa,” sapagkat maaaring magpahiwatig ito ng pagpapatuloy ngunit hindi iyon tuwirang ipinaliliwanag ng talata.
- source_word: ὁ Ἰησοῦς
  choice: ni Jesus
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan. Ang “ni” ang likas na pananda sa gumagawa ng mga kilos sa kayariang Filipino ng pangungusap.
- source_word: ποιεῖν τε καὶ διδάσκειν
  choice: gawin at ituro
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na gawain ni Jesus—ang kanyang mga ginawa at itinuro. Sapat na ipinapakita ng “at” sa Filipino ang ugnayang τε καί nang hindi nagiging mabigat ang pangungusap.
theological_decisions:
- issue: Pahiwatig ng ἤρξατο (“nagsimula”) tungkol sa pagpapatuloy ng gawain ni Jesus sa Mga Gawa
  choice: Panatilihin ang “sinimulang” sa pangunahing teksto nang hindi ipinapaliwanag ang pagpapatuloy.
  alternative: Isaling “lahat ng ginawa at itinuro ni Jesus,” o tahasang idagdag na ipinagpatuloy niya ang gawain sa pamamagitan ng mga apostol.
  rationale: Tahas na nasa Griyego ang “nagsimula.” Maaaring ipahiwatig nito na nagpapatuloy sa Mga Gawa ang gawain ni Jesus, ngunit hindi dapat lutasin ng salin ang pahiwatig sa pamamagitan ng pagpapaliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino na may marangal na himig. Pinanatili ang pormal na “O Teofilo” bilang tuwirang pagtawag at ginamit ang “salaysay” bilang malinaw ngunit hindi teknikal na tawag sa naunang akda. Ang kuwit sa hulihan ay angkop dahil nagpapatuloy ang pangungusap sa susunod na talata.
