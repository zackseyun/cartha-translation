  text: οἷς καὶ παρέστησεν ἑαυτὸν ζῶντα μετὰ τὸ παθεῖν αὐτὸν ἐν πολλοῖς τεκμηρίοις, δι’ ἡμερῶν τεσσεράκοντα ὀπτανόμενος αὐτοῖς καὶ λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/003.yaml
  text: To them he also presented himself alive after he had suffered[a], by many proofs[b], appearing to them over forty days and speaking about the kingdom of God.
translation:
  language: tl
  text: Sa kanila rin ay ipinakita niya ang kanyang sarili na buháy matapos siyang magdusa, sa pamamagitan ng maraming patunay[a]. Nagpakita siya sa kanila sa loob ng apatnapung araw[b] at nagsalita tungkol sa kaharian ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pamamagitan ng maraming katibayan.” Ang salitang Griyego ay tumutukoy sa katibayang nagtatatag ng katiyakan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa kabuuan ng apatnapung araw.” Ipinahihiwatig ng parirala na nagpakita siya sa iba’t ibang pagkakataon sa panahong iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: sa kanila
  rationale: Ang panghalip ay tumutukoy sa mga apostol sa naunang talata; hindi na idinagdag ang salitang 'mga lalaki' dahil wala itong tahasang katumbas sa Griyego.
- source_word: παρέστησεν ἑαυτὸν ζῶντα
  choice: ipinakita niya ang kanyang sarili na buháy
  rationale: Pinananatili nito ang reflexive na anyo at ang malinaw na pahayag na siya ay buhay matapos magdusa.
- source_word: μετὰ τὸ παθεῖν αὐτὸν
  choice: matapos siyang magdusa
  rationale: Ang μετά kasama ng articular infinitive ay nagpapahayag ng panahong kasunod ng natapos na pagdurusa.
- source_word: ἐν πολλοῖς τεκμηρίοις
  choice: sa pamamagitan ng maraming tiyak na katibayan
  rationale: Ang τεκμήριον ay higit sa pangkalahatang ebidensiya at tumutukoy sa katibayang nagtatatag ng katiyakan; ang 'tiyak na katibayan' ay natural at hindi kasing-absoluto ng 'di-mapapasubaliang patunay.'
- source_word: δι’ ἡμερῶν τεσσεράκοντα
  choice: sa loob ng apatnapung araw
  rationale: Ipinahihiwatig ng διά na ang mga pagpapakita ay naganap sa kahabaan ng panahong ito, hindi kinakailangang walang patid.
- source_word: ὀπτανόμενος αὐτοῖς
  choice: nagpakita siya sa kanila
  rationale: Natural na modernong Tagalog para sa participle na tumutukoy sa paulit-ulit na pagpapakita sa mga alagad.
- source_word: λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: nagsalita tungkol sa kaharian ng Diyos
  rationale: Natural na katumbas ng idyomang τὰ περὶ, habang pinananatili ang tradisyonal at malawak na kahulugan ng βασιλεία bilang kaharian o paghahari.
theological_decisions:
- issue: Muling pagkabuhay at bigat ng katibayan
  choice: Malinaw na sinasabing ipinakita ni Jesus ang kanyang sarili na buhay matapos magdusa, kalakip ang maraming tiyak na katibayan.
  alternative: Ipinakita niya ang kanyang sarili na buhay sa pamamagitan ng maraming di-mapapasubaliang patunay.
  rationale: Tahasang pinagtitibay ng Griyego ang kanyang pagiging buhay pagkatapos ng pagdurusa at ang matibay na evidensiyang kaugnay nito, ngunit iniiwasan ang higit na absolutong pananalitang maaaring lumampas sa saklaw ng τεκμήριον.
- issue: Kahulugan ng βασιλεία τοῦ θεοῦ
  choice: kaharian ng Diyos
  alternative: paghahari ng Diyos
  rationale: Maaaring tukuyin ng βασιλεία kapwa ang paghahari at ang kaharian. Pinananatili ng karaniwang pariralang 'kaharian ng Diyos' ang lawak at likas na tensiyong ito sa halip na paliitin iyon sa isang aspekto lamang.
- issue: Kasarian ng tinutukoy ng οἷς
  choice: sa kanila
  alternative: sa mga lalaking ito
  rationale: Mga apostol ang tinutukoy sa konteksto, ngunit walang tahasang salitang 'mga lalaki' sa mismong Griyego; kaya mas malapit at sapat na malinaw ang 'sa kanila.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginawang dalawang pangungusap upang maging natural at madaling maunawaan nang hindi binabago ang ugnayan ng mga kaisipan. Ginamit ang tuldik sa “buháy” upang maiwasang mabasa bilang “búhay.”
