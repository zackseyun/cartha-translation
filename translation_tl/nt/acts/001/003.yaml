  source_fidelity: 'Tumpak ang pangunahing diwa: ipinakita ni Jesus ang kanyang sarili na buháy pagkatapos magdusa, na may maraming τεκμήρια, habang nagpapakita sa loob ng apatnapung araw at nagsasalita tungkol sa kaharian ng Diyos. Gayunman, ang “tiyak na katibayan” ay hindi ang pinakanatural na katumbas ng πολλά τεκμήρια at maaaring ipahiwatig ang ‘partikular na’ katibayan kaysa mga patunay na nagtatatag ng katiyakan.'
  naturalness: Malinaw at marangal ang Tagalog, at katanggap-tanggap ang paghahati sa dalawang pangungusap. Mas tuwiran at natural ang “maraming patunay.” Ang talababa b sa kasalukuyan ay inuulit nang eksakto ang pangunahing salin (“sa loob ng apatnapung araw”), kaya hindi ito tunay na alternatibong salin.
  terminology: Ang “buháy,” “magdusa,” “kaharian ng Diyos,” at “nagpakita” ay angkop sa modernong Filipino Tagalog at nananatiling tapat sa mga pangunahing terminong Griyego. Ang “patunay” ay angkop para sa τεκμήριον nang hindi idinadagdag ang absolutong “di-mapapasubalian.”
