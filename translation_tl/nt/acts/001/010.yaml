lexical_decisions:
- source_word: ἀτενίζοντες
  choice: nakatingin nang buong titig
  rationale: Ipinahihiwatig ng pandiwaring Griyego ang matagal at masusing pagtitig, hindi isang saglit na pagtingin.
- source_word: οὐρανόν
  choice: langit
  rationale: Maaaring tumukoy ang salita sa langit o himpapawid; sa konteksto ng pag-akyat ni Jesus, likas ang “langit” habang nananatili ang alternatibo sa talababa.
- source_word: πορευομένου αὐτοῦ
  choice: samantalang paakyat siya
  rationale: Ipinahihiwatig ng genitive absolute ang kasabay na pagkilos. Ang “paakyat” ay natural sa agarang konteksto ng pag-akyat at hindi tinutukoy ang huling hantungan.
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili nito ang pantawag-pansing lakas ng salaysay nang may marangal ngunit nauunawaang modernong himig.
- source_word: ἄνδρες δύο
  choice: dalawang lalaki
  rationale: Tahasang “mga lalaki” ang nasa Griyego; hindi ito isinaling “mga anghel” upang hindi idagdag ang pagkakakilanlang ipinahihiwatig lamang ng konteksto.
- source_word: παρειστήκεισαν
  choice: nakatayo sa tabi nila
  rationale: Natural nitong ipinahahayag ang presensiya ng dalawa sa tabi ng mga alagad, nang hindi idinaragdag na bigla silang nagpakita.
- source_word: ἐσθήσεσι λευκαῖς
  choice: nakasuot ng puting damit
  rationale: Malawak ang kahulugan ng ἐσθής na kasuotan o damit; hindi nito kinakailangang tukuyin ang partikular na anyong “balabal.”
theological_decisions:
- issue: Kahulugan ng οὐρανός sa konteksto ng pag-akyat
  choice: langit
  alternative: himpapawid
  rationale: Ang “langit” ay lehitimong kahulugan at angkop sa teolohikal na konteksto ng pag-akyat, ngunit kinikilala sa talababa ang tunay na leksikal na alternatibo.
- issue: Pagkakakilanlan ng dalawang lalaki
  choice: dalawang lalaki
  alternative: dalawang anghel
  rationale: “Dalawang lalaki” ang tahasang sinasabi ng talata. Hinahayaan ng salin na ang mas malawak na konteksto ang magpahiwatig ng kanilang pagkakakilanlan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Pinanatili ang pantawag-pansing “narito,” ang tahasang kasariang “dalawang lalaki,” at ang mga leksikal na alternatibo sa mga talababa.
