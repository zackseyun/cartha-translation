id: ACT.1.4
reference: Acts 1:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ συναλιζόμενος παρήγγειλεν αὐτοῖς ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/004.yaml
  text: And while staying with them[a], he ordered them not to depart from Jerusalem, but to wait for the promise of the Father, which you heard from me.
translation:
  language: tl
  text: Habang magkakasama sila[a], iniutos niya sa kanila, “Huwag kayong umalis sa Jerusalem, kundi hintayin ninyo ang pangako ng Ama, na narinig ninyo mula sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Habang nagtitipon siya kasama nila”; inuunawa naman ito ng ilan bilang, “Habang kumakain siya kasama nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναλιζόμενος
  choice: Habang kasama niya sila
  rationale: Tiyak sa konteksto na kasama ni Jesus ang mga apostol, ngunit mahirap at pinagtatalunan ang tiyak na diwa ng pandiwari. Ang saling ito ay natural sa modernong Tagalog at hindi labis na nagpapasya kung ang ibig sabihin ay nagtitipon, nananatiling kasama, o kumakain kasama nila.
- source_word: παρήγγειλεν
  choice: iniutos
  rationale: Ipinahahayag nito ang isang tagubiling may awtoridad; mas angkop ang “iniutos” kaysa sa mas mahinang “tinagubilinan.”
- source_word: ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι
  choice: huwag umalis sa Jerusalem
  rationale: Natural at malinaw nitong ipinahahayag ang utos na huwag lumisan sa lungsod, sa halip na ang literal ngunit alanganing “huwag humiwalay mula sa Jerusalem.”
- source_word: περιμένειν
  choice: hintayin
  rationale: Karaniwang salitang Tagalog ito para sa mapanabik na paghihintay sa isang bagay na darating o matutupad.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρὸς
  choice: ang pangako ng Ama
  rationale: Pinananatili nito ang payak na anyo ng genitive at hindi tahasang dinaragdagan ng “kaloob,” bagaman nililinaw ng kasunod na konteksto kung ano ang ipinangako.
- source_word: ἣν ἠκούσατέ μου
  choice: na narinig ninyo mula sa akin
  rationale: Tapat at maikli itong katumbas ng konstruksiyon, nang hindi dinaragdagan kung ano mismo ang narinig nilang sinabi.
theological_decisions:
- issue: Kahulugan ng συναλιζόμενος kaugnay ng ginawa ni Jesus matapos siyang muling mabuhay
  choice: Pangkalahatang isinalin bilang “Habang kasama niya sila.”
  alternative: “Habang nagtitipon siya kasama nila” o “Habang kumakain siyang kasama nila.”
  rationale: Hindi tiyak sa anyong Griyego kung partikular na pagtitipon o pagkain ang tinutukoy. Pinananatili ng pangunahing salin ang tiyak na punto—kasama ni Jesus ang mga apostol—nang hindi nilulutas ang pinagtatalunang leksikal na detalye; inilalagay sa talababa ang mga posibleng pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “kasama niya sila” upang maging natural habang pinananatili sa talababa ang tunay na leksikal na kalabuan.
