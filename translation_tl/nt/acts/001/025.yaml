  source_fidelity: Ang draft ay wastong nagpapahayag sa pangkalahatan ng paghalili sa apostolikong paglilingkod at pinananatili ang sinadyang kalabuan ng «sarili niyang lugar.» Gayunman, ang kasalukuyang pagkakaayos na «na tinalikuran ni Judas, at pumunta» ay maaaring magmukhang ang taong hahalili ang siyang pumunta sa sariling lugar. Dapat gawing malinaw na si Judas ang kapwa tumiwalag at pumunta roon.
  naturalness: Natural ang karamihan ng bokabularyo, ngunit mas maayos at walang kalabuan ang pangungusap kung ang «upang pumunta» ay tuwirang ikakabit kay Judas. Ang «gawaing paglilingkod» ay naiintindihan ngunit medyo paulit-ulit; ang «paglilingkod» ay sapat sa kontekstong ito.
  terminology: Katanggap-tanggap ang «pagka-apostol» bilang katumbas ng ἀποστολή sa diwa ng apostolikong katungkulan. Pinananatili ang «sarili niyang lugar» at ang maingat na talababa upang huwag ipasok sa pangunahing teksto ang isang partikular na interpretasyon ng kahihinatnan ni Judas.
  issues:
  - severity: medium
    issue: Malabong ugnayang sintaktiko sa «na tinalikuran ni Judas, at pumunta sa sarili niyang lugar.»
    rationale: Sa Griyego, si Judas ang paksa ng parehong παρέβη at πορευθῆναι. Dahil sa kuwit at «at,» maaaring basahin sa Filipino na ang papalit ang pumunta sa sariling lugar. Ang infinitive ng layon/resulta ay dapat iugnay nang walang putol kay Judas.
  - severity: low
    issue: Ang «gawaing paglilingkod» ay bahagyang tautolohikal.
    rationale: Naisasalin nito ang διακονία, ngunit mas tuwiran at likas ang «paglilingkod»; hindi nito binabago ang diwa ng ipinagkatiwalang ministeryo.
