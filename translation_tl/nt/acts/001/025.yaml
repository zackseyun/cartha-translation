  text: λαβεῖν τὸν ⸀τόπον τῆς διακονίας ταύτης καὶ ἀποστολῆς, ⸀ἀφ’ ἧς παρέβη Ἰούδας πορευθῆναι εἰς τὸν τόπον τὸν ἴδιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/025.yaml
  text: to take the place of this ministry and apostleship[b][a], from which Judas turned aside to go to his own place.
translation:
  language: tl
  text: upang humalili sa paglilingkod at pagka-apostol na ito, na tinalikuran ni Judas upang pumunta sa sarili niyang lugar.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nilihisan,” “iniwan,” o “inalisan.” Maaaring tumukoy ang pandiwang Griyego sa paglihis o pag-alis mula sa paglilingkod at pagka-apostol.
    reason: lexical_alternative
  - marker: b
    text: Ang “sarili niyang lugar” ay maaaring tumukoy lamang sa lugar na nauukol kay Judas, o, nang mas mariin, sa lugar ng paghuhukom na angkop sa kanya.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβεῖν τὸν τόπον
  choice: humalili
  rationale: Sa konteksto, ang parirala ay tumutukoy sa pagkuha sa nabakanteng tungkulin. Likas sa modernong Filipino ang “humalili,” bagaman hindi nito inuulit nang tahasan ang larawan ng “lugar.”
- source_word: τῆς διακονίας ταύτης
  choice: sa gawaing paglilingkod na ito
  rationale: Ipinahahayag ng διακονία ang ipinagkatiwalang paglilingkod; ang “gawaing paglilingkod” ay malinaw at hindi limitado sa makabagong teknikal na gamit ng “ministeryo.”
- source_word: καὶ ἀποστολῆς
  choice: at pagka-apostol
  rationale: Tumutukoy ang ἀποστολή rito sa katungkulan o atas bilang apostol. Pinananatili ng “pagka-apostol” ang pormal na papel nang hindi ito ginagawang pangkalahatang misyon lamang.
- source_word: παρέβη
  choice: tinalikuran
  rationale: Sa konteksto, inilalarawan nito ang paglihis o pag-alis ni Judas mula sa paglilingkod at pagka-apostol. Natural ang “tinalikuran,” ngunit inilalahad sa talababa ang iba pang posibleng diwa.
- source_word: πορευθῆναι
  choice: pumunta
  rationale: Simple at tuwirang katumbas ito ng karaniwang diwa ng πορεύομαι sa parirala.
- source_word: εἰς τὸν τόπον τὸν ἴδιον
  choice: sa sarili niyang lugar
  rationale: Pinananatili nito ang maikli at sadyang hindi tiyak na pahayag ng Griyego, nang hindi agad ipinapakahulugang libingan, impiyerno, o tiyak na hatol.
theological_decisions:
- issue: Ang kahulugan ng “sarili niyang lugar” kaugnay ng kahihinatnan ni Judas
  choice: Panatilihin sa pangunahing teksto ang malabong pahayag na “sarili niyang lugar.”
  alternative: Tahasang tukuyin ito bilang kamatayan/libingan, lugar ng paghuhukom, o impiyerno.
  rationale: Hindi tahasang tinutukoy ng Griyego ang destinasyon. Pinananatili ng salin ang tunay na teolohikal na tensiyon sa halip na magpasok ng mas tiyak na doktrinal na paliwanag.
- issue: Ang uri ng pag-alis ni Judas mula sa paglilingkod at pagka-apostol
  choice: Gamitin ang “tinalikuran,” na nagpapahiwatig ng kusang paglihis o pag-abandona.
  alternative: “lumihis mula sa,” “umalis sa,” o “nahulog mula sa.”
  rationale: Malawak ang saklaw ng παρέβη at maaaring magpahiwatig ng paglihis o pag-alis. Ang talababa ang nagpapanatili sa mga leksikal na alternatibo nang hindi ginagawang teknikal na doktrina ang pandiwa.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang “humalili” para sa natural na pagpapahayag ng pagkuha sa nabakanteng papel, at pinanatili ang “sarili niyang lugar” upang huwag lutasin ang sadyang kalabuan ng orihinal.
