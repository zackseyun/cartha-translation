  yaml_path: translation/nt/acts/001/012.yaml
  text: Then they returned to Jerusalem from the mount called Olivet[a], which is near Jerusalem[b], a Sabbath day’s journey away.
translation:
  language: tl
  text: Pagkatapos, bumalik sila sa Jerusalem mula sa bundok na tinatawag na Bundok ng mga Olibo[a], na malapit sa Jerusalem—isang lakbayin sa Sabbath ang layo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Griyegong pangalan ay katumbas ng “Olivet”; mas tradisyonal ang “Bundok ng mga Olibo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “isang lakbayin sa Sabbath” ay nakaugaliang panukat ng distansiyang maaaring lakbayin ng isang Judio sa Sabbath.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Likas na panandang temporal sa salaysay na nagpapakita ng kasunod na pangyayari.
- source_word: ὑπέστρεψαν εἰς Ἰερουσαλὴμ
  choice: bumalik sila sa Jerusalem
  rationale: Tuwirang ipinapahayag ang kilos na pagbabalik patungo sa lungsod sa natural na Tagalog.
- source_word: ἀπὸ ὄρους
  choice: mula sa bundok
  rationale: Ang ἀπό ay pinagmulan, at ang ὄρος ay bundok; malinaw at karaniwan ang salin.
- source_word: τοῦ καλουμένου Ἐλαιῶνος
  choice: na tinatawag na Bundok ng mga Olibo
  rationale: Ginagamit ang pamilyar at malinaw na pangalang-pook sa Tagalog habang pinananatili ang diwa ng Griyegong Ἐλαιῶνος.
- source_word: ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ
  choice: Malapit ito sa Jerusalem
  rationale: Natural na Tagalog na nagpapanatili sa pahayag tungkol sa lapit ng lugar.
- source_word: σαββάτου ἔχον ὁδόν
  choice: isang lakbayin lamang sa araw ng Sabbath ang layo
  rationale: Pinananatili ang natatanging Judio na panukat ng distansiya at ipinapahayag ito sa malinaw na modernong Tagalog.
theological_decisions:
- issue: Idiomang Judio na σαββάτου ἔχον ὁδόν
  choice: isang lakbayin lamang sa araw ng Sabbath ang layo
  alternative: kasinlayo ng pinahihintulutang lakbayin sa Sabbath
  rationale: Hindi tahasang sinasabi ng Griyego ang salitang “pinahihintulutan,” kaya iniiwasang idagdag iyon sa pangunahing teksto; ipinapaliwanag na lamang sa talababa ang kaugaliang pinagmulan ng panukat.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang pamilyar na “Bundok ng mga Olibo,” at pinanatili ang kulturang Judio sa idyoma sa halip na palitan ito ng makabagong sukat.
