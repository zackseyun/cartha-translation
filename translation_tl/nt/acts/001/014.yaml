review_pass:
  verdict: revise
  source_fidelity: 'Kailangang panatilihin nang mas malinaw ang dalawang magkaugnay ngunit magkaibang elemento: ang matiyagang/patuloy na pag-uukol ng sarili sa panalangin (ἦσαν προσκαρτεροῦντες τῇ προσευχῇ) at ang pagkakaisang layunin (ὁμοθυμαδόν). Ang draft na “patuloy na nagkakaisang nananalangin” ay malapit, ngunit bahagyang pinagsasama ang durative devotion at unity sa paraang maaaring magmukhang ang nagkakaisa ang aspekto ng pananalangin kaysa ng buong pagtitipon. Ang “ang mga kapatid niyang lalaki” ay nawawala rin ang tahasang σύν (‘kasama’), samantalang malinaw itong inuulit sa Griyego bago ang huling pangkat.'
  naturalness: Natural ang “Silang lahat,” “mga babae,” at “si Maria na ina ni Jesus.” Mas malinaw at mas marangal sa modernong Filipino ang “Sila’y pawang matiyagang nag-uukol ng sarili sa panalangin nang may iisang layunin” o katumbas nito. Iniiwasan nito ang bahagyang mabigat na pagkakasunod ng “patuloy na nagkakaisang nananalangin” at pinananatili ang diin ng bawat Griyegong bahagi.
  terminology: Ang “Maria,” “Jesus,” at “mga kapatid niyang lalaki” ay angkop. Hindi dapat palitan ang huli ng neutral na “mga kapatid” o “mga kamag-anak,” dahil panlalaking maramihan ang ἀδελφοῖς at hindi tinutukoy ng talata ang eksaktong uri ng pagkakamag-anak. Ang talababa ay dapat manatiling hindi nagpapasya sa usaping ito. Ang footnote b ay dapat magsabi ng “kasama ang mga babae” bilang alternatibo kung ang pangunahing salin ay walang artikulong “ang,” at hindi “ilang babae,” na nagpapasok ng daming wala sa teksto.
  issues:
  - severity: medium
    issue: Hindi tahasang naipapakita ang huling σύν sa pangunahing salin.
    rationale: Ang “at ang mga kapatid niyang lalaki” ay maaari pa ring basahing bahagi ng listahan, ngunit ang σὺν ay inuulit sa Griyego. Ang “at kasama ang mga kapatid niyang lalaki” ay mas tapat at malinaw.
  - severity: medium
    issue: Ang footnote b na “ilang babae” ay nagpapasok ng ideyang bilang o hindi-tiyak na dami.
    rationale: Ang γυναιξίν ay simpleng ‘mga babae/women’; ang kawalan ng artikulo ay hindi batayan upang isaling “ilang.” Dapat itong maging “kasama ang mga babae” o “kasama ng mga babae.”
  - severity: low
    issue: Bahagyang natatabunan ng “nagkakaisang nananalangin” ang natatanging diwa ng προσκαρτερέω.
    rationale: Ang προσκαρτερέω ay hindi lamang nagpapatuloy na kilos kundi matiyaga at matatag na pag-uukol ng sarili. Maaaring ipahayag ito nang mas malinaw sa Filipino nang hindi nagiging literalista.
  revised_text: Sila’y pawang matiyagang nag-uukol ng sarili sa panalangin nang may iisang layunin, kasama ang mga babae, si Maria na ina ni Jesus, at kasama ang mga kapatid niyang lalaki.
  revised_footnotes:
  - marker: a
    text: Maaari ring “nang nagkakaisa” o “nang may iisang kalooban.” Binibigyang-diin ng Griyego ang pagkakaisa ng layunin, hindi lamang ang pagtitipon sa isang lugar.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kasama ng mga babae.” Walang artikulo ang pariralang Griyego, ngunit malamang na tumutukoy ito sa isang kilalang pangkat ng mga babaeng kasama ng mga alagad.
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Griyegong adelphoi ay karaniwang nangangahulugang “mga kapatid na lalaki.” Nauunawaan ito ng ilan sa mas malawak na diwang “malalapit na kamag-anak”; hindi na nililinaw rito ng teksto ang eksaktong kaugnayan nila kay Jesus.
    reason: alternative_reading
  revision_rationale: Binago ang pangungusap upang mas malinaw na maipakita ang patuloy at matiyagang pag-uukol ng sarili sa panalangin, ang pagkakaisa ng layunin, at ang inuulit na ‘kasama’ bago ang mga kapatid ni Jesus. Inayos din ang footnote b upang hindi magdagdag ng daming (‘ilang’) na wala sa Griyego. Idinagdag ang mga anchor sa binagong kumpletong teksto upang tumugma ang bawat talababa sa kaugnay na parirala.
