- from: Silang lahat ay patuloy na nagkakaisang nananalangin[a], kasama ang mga babae[b], si Maria na ina ni Jesus, at ang mga kapatid niyang lalaki[c].
  to: Sila’y pawang matiyagang nag-uukol ng sarili sa panalangin nang may iisang layunin, kasama ang mga babae, si Maria na ina ni Jesus, at kasama ang mga kapatid niyang lalaki.
  rationale: Binago ang pangungusap upang mas malinaw na maipakita ang patuloy at matiyagang pag-uukol ng sarili sa panalangin, ang pagkakaisa ng layunin, at ang inuulit na ‘kasama’ bago ang mga kapatid ni Jesus. Inayos din ang footnote b upang hindi magdagdag ng daming (‘ilang’) na wala sa Griyego. Idinagdag ang mga anchor sa binagong kumpletong teksto upang tumugma ang bawat talababa sa kaugnay na parirala.
