base_translation:
  language: en
  yaml_path: translation/nt/acts/001/014.yaml
  text: All of these were continually devoting themselves with one accord to prayer[a], together with the women, and Mary the mother of Jesus[c][b], and with his brothers.
translation:
  language: tl
  text: Sila’y pawang matiyagang nag-uukol ng sarili sa panalangin nang may iisang layunin, kasama ang mga babae, si Maria na ina ni Jesus, at kasama ang mga kapatid niyang lalaki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτοι πάντες
  choice: Silang lahat
  rationale: Natural na Filipino na pinananatili ang pagtukoy ng οὗτοι at ang kabuuang saklaw ng πάντες.
- source_word: ἦσαν προσκαρτεροῦντες
  choice: ay patuloy na ... nananalangin
  rationale: Ipinahihiwatig ng periphrastic imperfect ang nagpapatuloy at matiyagang gawain. Ang “patuloy na” ay malinaw na naghahatid ng durative aspect, habang ang pananalangin ang likas na tuon ng pandiwa sa konstruksyong ito.
- source_word: ὁμοθυμαδόν
  choice: nagkakaisang
  rationale: Ipinahahayag nito hindi lamang ang pisikal na pagsasama kundi ang pagkakaisa ng layunin at kalooban, sa natural at kasalukuyang Filipino.
- source_word: τῇ προσευχῇ
  choice: nananalangin
  rationale: Ang pandiwang anyo ay mas natural sa Filipino kaysa sa literal na “sa panalangin,” at sa konteksto ay malinaw na ito ang gawaing patuloy nilang pinag-uukulan ng sarili.
- source_word: σὺν γυναιξίν
  choice: kasama ang mga babae
  rationale: Likas sa Filipino ang paggamit ng “ang” para sa grupong kilala sa konteksto, bagaman walang artikulo ang Griyego; pinananatili ng “kasama” ang diwa ng σύν.
- source_word: Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ
  choice: si Maria na ina ni Jesus
  rationale: Ginagamit ang karaniwang anyong Filipino na “Maria,” at tuwirang pinananatili ang appositional na pagkakakilanlan niya bilang ina ni Jesus.
- source_word: σὺν τοῖς ἀδελφοῖς αὐτοῦ
  choice: at ang mga kapatid niyang lalaki
  rationale: Ang ἀδελφοί ay panlalaking maramihan at sa kontekstong ito ay likas na tumutukoy sa mga lalaking kapatid o kamag-anak ni Jesus. Nililinaw ng “lalaki” ang gramatikal na kasarian nang hindi nagpapasya sa eksaktong uri ng kanilang pagkakamag-anak.
theological_decisions:
- issue: Eksaktong kaugnayan kay Jesus ng mga tinawag na ἀδελφοί
  choice: mga kapatid niyang lalaki
  alternative: mga malapit niyang kamag-anak na lalaki
  rationale: Karaniwang nangangahulugang “mga kapatid na lalaki” ang ἀδελφοί, ngunit hindi tinutukoy rito ng teksto kung sila ay mga kapatid sa laman, mga kapatid sa ibang magulang, o mas malalapit na kamag-anak. Pinananatili ng salin ang karaniwang leksikal na kahulugan at inilalagay sa talababa ang tunay na saklaw ng maaaring kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang likas na pandiwang “nananalangin” kaysa sa mas mekanikal na “nag-uukol ng sarili sa panalangin,” habang pinananatili ng “patuloy” ang nagpapatuloy na aspekto at ng “nagkakaisa” ang sama-samang layunin ng pangkat.
