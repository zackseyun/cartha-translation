  text: γέγραπται γὰρ ἐν βίβλῳ ψαλμῶν· Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος καὶ μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ, καί· Τὴν ἐπισκοπὴν αὐτοῦ ⸀λαβέτω ἕτερος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/020.yaml
  text: For it is written in the book of Psalms[a], ‘Let his dwelling place become desolate, and let there be no one dwelling in it,’ and[c][b], ‘Let another take his office.’
translation:
  language: tl
  text: 'Sapagkat nasusulat sa aklat ng Mga Awit[a]: “Maging tiwangwang ang kanyang tirahan, at huwag magkaroon ng naninirahan doon,” at, “Kunin ng iba ang kanyang katungkulan.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tirahan” ay maaari ring isaling “tahanan” o “pook na tinitirhan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “katungkulan” ay salin ng ἐπισκοπή; maaari ring “tungkulin ng pangangasiwa.” Hindi kinakailangang tumukoy rito ang salita sa mas huling teknikal na katungkulan sa simbahan.
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: nasusulat
  rationale: Karaniwang pormula ito sa Bagong Tipan sa pagsipi sa Kasulatan; likas sa Filipino at pinananatili ang nananatiling bisa ng perfect passive.
- source_word: βίβλῳ ψαλμῶν
  choice: sa aklat ng Mga Awit
  rationale: Malinaw at karaniwang tawag sa aklat na pinagmulan ng sipi.
- source_word: Γενηθήτω
  choice: Maging
  rationale: Pinananatili ang jussive na lakas ng aorist imperative at ang marangal na himig ng sipi.
- source_word: ἔπαυλις
  choice: tirahan
  rationale: Malawak at natural na katumbas para sa isang lugar na tinitirhan, nang hindi labis na tinutukoy ang uri nito.
- source_word: ἔρημος
  choice: tiwangwang
  rationale: Ipinahihiwatig ang isang lugar na iniwan at walang naninirahan, habang pinananatili ang taimtim na tono.
- source_word: μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ
  choice: huwag magkaroon ng naninirahan doon
  rationale: Malapit sa umiiral na konstruksyon ng Griyego at natural sa modernong Filipino.
- source_word: ἐπισκοπή
  choice: katungkulan
  rationale: Ipinahahayag ang tungkulin o pananagutang hawak ni Judas nang hindi ipinapasok ang isang mas huling teknikal na katungkulan sa iglesya.
- source_word: λαβέτω ἕτερος
  choice: Iba ang kumuha
  rationale: Pinananatili ang imperative na diwa at ang ideya ng paghalili.
theological_decisions:
- issue: Pagpapakahulugan sa ἐπισκοπή sa konteksto ng papel na nabakante ni Judas
  choice: katungkulan
  alternative: pamamahala; tungkulin ng pangangasiwa; obispado
  rationale: Ang “katungkulan” ay naghahatid ng kinikilalang papel na pupunan ngunit hindi ipinagpapalagay na tumutukoy na ito sa isang mas huling, teknikal na estruktura ng simbahan. Inilalagay sa talababa ang mas literal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “nasusulat” bilang kinagawiang pormula sa pagsipi sa Kasulatan, at “tiwangwang” upang mapanatili ang taimtim na himig. Ang mga marker na [a] at [b] ay kapwa lumilitaw sa pangunahing teksto.
