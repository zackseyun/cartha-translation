  text: καὶ ἔδωκαν κλήρους ⸀αὐτοῖς, καὶ ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν, καὶ συγκατεψηφίσθη μετὰ τῶν ἕνδεκα ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/026.yaml
  text: And they cast lots for them[a], and the lot fell to Matthias[b], and he was counted with the eleven apostles.
translation:
  language: tl
  text: At nagpalabunutan sila para sa kanila[a], at si Matias ang nabunot, at ibinilang siya kasama ng labing-isang apostol.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ibinigay nila sa kanila ang mga palabunot.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “itinuring siyang kabilang sa labing-isang apostol” o “idinagdag siya sa labing-isang apostol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν κλήρους αὐτοῖς
  choice: nagpalabunutan sila para sa dalawa
  rationale: Ang parirala ay literal na tumutukoy sa pagbibigay ng mga palabunot sa kanila, ngunit sa konteksto ay isang paraang ginagamit upang pumili sa dalawang kandidato. Ang “nagpalabunutan” ay likas at malinaw sa modernong Tagalog; ang “para sa dalawa” ay nagpapalinaw sa tinutukoy ng αὐτοῖς ayon sa naunang talata.
- source_word: κλήρους / ὁ κλῆρος
  choice: palabunutan / ang nabunot
  rationale: Dito ang κλῆρος ay bagay o paraang ginagamit sa pagpili, hindi bahagi ng mana. Sa Tagalog, mas natural ilahad ang proseso bilang “palabunutan” at ang kinalabasan bilang “ang nabunot,” habang pinananatili ang konkretong diwa ng pagpili sa pamamagitan ng lot.
- source_word: ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν
  choice: si Matias ang nabunot
  rationale: Ito ang natural na katumbas sa Tagalog ng idyomang “nahulog ang palabunot kay Matias.” Malinaw nitong ipinahahayag ang resulta nang hindi nagdaragdag ng paliwanag kung paano isinagawa ang palabunutan.
- source_word: Μαθθίαν
  choice: Matias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa mga saling Tagalog.
- source_word: συγκατεψηφίσθη
  choice: ibinilang siya kasama
  rationale: Ipinahihiwatig ng pandiwa na kinilala o itinuring siyang kabilang sa isang pangkat. Ang “ibinilang siya kasama” ay malapit sa Griyego at hindi nagpapahiwatig ng higit pa sa tahasang sinasabi ng teksto.
- source_word: μετὰ τῶν ἕνδεκα ἀποστόλων
  choice: kasama ng labing-isang apostol
  rationale: 'Tuwirang ipinapahayag nito ang kahulugan ng μετά na may genitive: si Matias ay ibinilang na kasama ng umiiral na pangkat ng labing-isang apostol.'
theological_decisions:
- issue: Kung ang συγκατεψηφίσθη ay dapat isaling para magpahiwatig ng banal o sakramental na pagtatalaga lampas sa salaysay
  choice: ibinilang siya kasama ng labing-isang apostol
  alternative: idinagdag siya sa labing-isang apostol
  rationale: Iniuulat ng talata ang pagkabilang ni Matias sa pangkat matapos siyang mabunot. Pinananatili ng “ibinilang” ang saklaw ng Griyego at hindi nagpapasok ng mas matibay na doktrinal na pahayag tungkol sa paraan o kalikasan ng kanyang pagtatalaga.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagpalabunutan” at “nabunot” bilang natural na salaysay sa Tagalog, samantalang pinanatili ng talababa ang mas literal na larawan ng Griyego. Ang “Kaya” ay nagpapakita ng likas na ugnayan ng resulta at pagkabilang nang hindi nagpapalakas ng teolohikal na implikasyon.
