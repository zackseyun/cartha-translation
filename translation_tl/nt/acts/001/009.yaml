  text: καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν ἐπήρθη καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/009.yaml
  text: And after he said these things[a], as they were watching, he was lifted up[c][b], and a cloud took him out of their sight.
translation:
  language: tl
  text: At matapos niyang sabihin ang mga ito, habang nakatingin sila, iniangat siya[a], at kinuha siya ng isang ulap[c], kaya nawala siya sa kanilang paningin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dinala siya paitaas.”
    reason: lexical_alternative
  - marker: b
    text: O, “tinanggap siya ng isang ulap, kaya nawala siya sa kanilang paningin.”
    reason: lexical_alternative
  - marker: c
    text: Maaaring ipaalala ng ulap ang mga tagpo sa Kasulatan kung saan nagpapahiwatig ito ng presensiya ng Diyos, ngunit hindi ito tahasang sinasabi ng talata.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ταῦτα εἰπὼν
  choice: At matapos niyang sabihin ang mga bagay na ito
  rationale: Ipinapanatili ng “At” ang payak na ugnayang pasalaysay, at malinaw na ipinahahayag ng “matapos” na nauna ang pagsasalita sa pangunahing pangyayari.
- source_word: βλεπόντων αὐτῶν
  choice: habang nakatingin sila
  rationale: Likas na Filipino para sa genitive absolute na nagsasaad na nasaksihan nila ang pangyayari habang nagaganap ito.
- source_word: ἐπήρθη
  choice: iniangat siya
  rationale: Malapit sa pasibong kahulugang “was lifted up” at hindi tahasang pinapangalanan kung sino ang kumilos, gaya rin ng Griyego.
- source_word: νεφέλη
  choice: isang ulap
  rationale: Tuwirang salin ng pangngalang walang pantukoy; hindi nilalagyan sa pangunahing teksto ng simbolismong hindi tahasang sinabi.
- source_word: ὑπέλαβεν αὐτόν
  choice: kinuha siya
  rationale: Ipinapakita ang aktibong papel ng ulap sa pag-aalis sa kanya sa kanilang paningin, habang pinananatili sa talababa ang posibleng kahulugang “tinanggap.”
- source_word: ἀπὸ τῶν ὀφθαλμῶν αὐτῶν
  choice: mula sa kanilang paningin
  rationale: Natural at marangal na idyomang Filipino para sa pagkawala niya sa abot ng kanilang paningin.
theological_decisions:
- issue: Kung gagamit ng hayagang teolohikal o tradisyonal na pormula para sa ἐπήρθη
  choice: iniangat siya
  alternative: dinala siya paitaas
  rationale: Pinananatili nito ang nakikitang pag-angat at ang pasibong anyo nang hindi tinutukoy ang kumikilos o nagdaragdag ng doktrinal na paliwanag.
- issue: Kung tahasang ipakikilala ang ulap bilang tanda ng presensiya ng Diyos
  choice: isang ulap
  alternative: ang ulap ng presensiya ng Diyos
  rationale: Maaaring may gayong alusyon sa Kasulatan, ngunit hindi ito tahasang sinasabi ng talata; kaya nasa talababa lamang ang posibilidad.
- issue: Saklaw ng kahulugan ng ὑπέλαβεν
  choice: kinuha siya
  alternative: tinanggap siya
  rationale: Parehong posible ang “kinuha” at “tinanggap.” Mas natural sa konteksto ang “kinuha,” ngunit hindi dapat mawala ang tunay na leksikal na alternatibo.
translation_notes:
  register: Makabago at malinaw na Filipino na may marangal na himig. Pinanatili ang isang tuloy-tuloy na pangungusap at ang pasibong anyo ng pag-angat; iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
