  rationale: Pinagaan ang unang parirala para sa likas na modernong Filipino, at ginawang resulta ang pagkawala niya sa kanilang paningin upang maipahayag nang idiomatiko ang ἀπὸ τῶν ὀφθαλμῶν αὐτῶν. Hindi binago ang pagkakasunod, ang pasibong pag-angat, o ang hindi tahasang simbolikong paglalarawan sa ulap. Inilipat lamang ang talababa ng alusyon upang tumama ang angkla nito sa “ulap.”
