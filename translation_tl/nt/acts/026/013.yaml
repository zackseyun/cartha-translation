  naturalness: Nauunawaan ang draft, ngunit mas natural ang “mas maliwanag pa kaysa sa araw” kaysa “higit pa sa ningning ng araw.” Mas maayos ding panatilihin ang liwanag at ang pagkilos nitong magliwanag sa isang pangungusap.
  terminology: Ang “langit,” “liwanag,” at “mga kasabay kong naglalakbay” ay angkop na makabagong Filipino. Ang “O Hari” ay pinananatili bilang tuwirang pormal na pagtawag, nang hindi idinadagdag ang pangalang wala sa mismong bersikulo.
