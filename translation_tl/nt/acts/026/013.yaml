  text: ἡμέρας μέσης κατὰ τὴν ὁδὸν εἶδον, βασιλεῦ, οὐρανόθεν ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου περιλάμψαν με φῶς καὶ τοὺς σὺν ἐμοὶ πορευομένους·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/013.yaml
  text: At midday[a], along the road, I saw, O king, a light from heaven, brighter than the sun, shining around me and those traveling with me.
translation:
  language: tl
  text: Noong katanghaliang-tapat, habang nasa daan, nakita ko, O Hari, ang isang liwanag mula sa langit, na mas maliwanag pa kaysa sa araw[a], at nagliwanag ito sa paligid ko at ng mga kasabay kong naglalakbay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “na higit pa sa ningning ng araw.” Idinidiin ng Griego na nalalampasan ng liwanag ang ningning ng araw.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας μέσης
  choice: Nang katanghaliang-tapat
  rationale: Ang idyomatikong genitive ay tumutukoy sa kalagitnaan ng araw; natural at tiyak ang “katanghaliang-tapat” sa makabagong Tagalog.
- source_word: κατὰ τὴν ὁδὸν
  choice: habang nasa daan
  rationale: Ipinahihiwatig ng parirala ang kinaroroonan habang naglalakbay; malinaw at likas ito sa salaysay.
- source_word: εἶδον
  choice: nakita ko
  rationale: Tuwirang salin ng aorist na pandiwa ng pagkakita.
- source_word: βασιλεῦ
  choice: Haring Agripa
  rationale: Pinananatili ang tuwirang pormal na pagtawag sa hari; ang pangalang Agripa ay malinaw mula sa agarang konteksto at mas natural kaysa “O hari” sa modernong Tagalog.
- source_word: οὐρανόθεν
  choice: mula sa langit
  rationale: Pinananatili ang makalangit na pinagmulan at ang puwersang teolohikal ng salita sa salaysay ng Mga Gawa.
- source_word: ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου
  choice: higit pa sa ningning ng araw
  rationale: Tahasang pinananatili ang λαμπρότης (“ningning”) at ang diwang lumalampas o nakahihigit na ipinahahayag ng ὑπέρ.
- source_word: φῶς
  choice: isang liwanag
  rationale: Ipinakikilala bilang isang nakitang penomenon; natural sa Tagalog ang “isang liwanag.”
- source_word: περιλάμψαν με
  choice: Nagliwanag ito sa paligid ko
  rationale: Ipinahahayag ang liwanag na pumalibot kay Pablo, habang ginagawang malinaw at natural ang participial na kayarian sa Tagalog.
- source_word: τοὺς σὺν ἐμοὶ πορευομένους
  choice: mga kasama kong naglalakbay
  rationale: Tumpak na inilalarawan ang mga taong kasabay ni Pablo sa paglalakbay nang walang idinagdag na detalye.
theological_decisions:
- issue: Kahulugan ng οὐρανόθεν sa konteksto ng pangitain
  choice: mula sa langit
  alternative: mula sa himpapawid
  rationale: Sa konteksto ng mapaghayag na pagtatagpo at sa gamit ng Mga Gawa, mas tumpak ang “mula sa langit,” nang hindi higit na binibigyang-kahulugan ang pangyayari.
- issue: Paghahambing ng liwanag sa araw
  choice: higit pa sa ningning ng araw
  alternative: mas maliwanag kaysa sa araw
  rationale: Pinananatili ng napiling salin ang tahasang pangngalang λαμπρότης at ang puwersang “lumalampas” ng ὑπέρ, samantalang inilalahad sa talababa ang mas idyomatikong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maiikling sugnay upang maiwasan ang mabigat na tambak ng mga panuring, habang pinananatili ang pormal na pagharap kay Agripa at ang diin ng Griego sa ningning na lumalampas sa araw.
