review_pass:
  verdict: revise
  source_fidelity: Ang pangunahing suliranin ay ang "nakita mo sa akin," na sa Tagalog ay karaniwang nangangahulugang may nakita kang bagay sa loob/kaugnay ng nagsasalita, hindi na "nakita mo ako." Ang "ihahayag ko pa sa iyo" ay nagpapalit din sa hinaharap na wikang pagpapakita (ὀφθήσομαί σοι) tungo sa generic na paghahayag, at ang "muli" ay walang katumbas sa Griyego. Ang rebisyon ay nagpapanatili sa dalawang pagpapakita at sa siksik na kaugnayan ng mga parirala.
  naturalness: Mas natural at malinaw sa modernong Filipino ang "sa mga pagkakataong nakita mo ako" at "sa mga pagkakataong magpapakita ako sa iyo" kaysa sa mekanikal na "sa mga bagay na nakita mo ako." Pinananatili pa rin nito ang saklaw ng Griyegong konstruksiyon nang walang dagdag na paliwanag sa pangunahing teksto.
  terminology: Ang "bumangon," "tumayo sa iyong mga paa," "italaga," "lingkod," at "saksi" ay angkop sa marangal ngunit tuwirang rehistro. Ang "magpapakita ako" ay wastong katumbas ng revelatory appearance language at hindi nagtatakda ng paraan ng pagpapakita.
  issues:
  - severity: high
    issue: Ang "nakita mo sa akin" ay hindi wastong tumutukoy kay Jesus bilang tuwirang layon ng "nakita mo."
    rationale: May με sa Griyego ("nakita mo ako"). Ang kasalukuyang Tagalog ay maaaring unawaing "mga bagay na nakita mo sa akin," kaya nag-iiba ang ugnayan.
  - severity: high
    issue: Pinalitan ng "ihahayag ko pa sa iyo" ang hinaharap na "magpapakita ako sa iyo," at idinagdag ang "muli."
    rationale: Ang ὀφθήσομαί σοι ay appearance language. Walang "muli" sa teksto; ang dagdag na ito ay hindi kinakailangan at maaaring magpahiwatig ng higit kaysa sinasabi ng talata.
  - severity: medium
    issue: Hindi tumpak at hindi natural ang pormal na alternatibo sa talababa, lalo na ang "pagpapakitaan ko sa iyo."
    rationale: Kailangang ipakita ng talababa ang siksik na anyo nang hindi gumagamit ng di-karaniwang pandiwa o binabago ang personal na pagpapakita.
  revised_text: 'Ngunit bumangon ka at tumayo sa iyong mga paa, sapagkat nagpakita ako sa iyo para sa layuning ito: upang italaga kita bilang lingkod at saksi sa mga pagkakataong nakita mo ako at sa mga pagkakataong magpapakita ako sa iyo.[a]'
