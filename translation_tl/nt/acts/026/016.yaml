  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου· εἰς τοῦτο γὰρ ὤφθην σοι, προχειρίσασθαί σε ὑπηρέτην καὶ μάρτυρα ὧν τε εἶδές ⸀με ὧν τε ὀφθήσομαί σοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/016.yaml
  text: 'But rise and stand on your feet[a], for I have appeared to you for this purpose: to appoint you as a servant and witness both of the things in which you have seen me and of the things in which I will appear to you,'
translation:
  language: tl
  text: 'Ngunit bumangon ka at tumayo sa iyong mga paa, sapagkat nagpakita ako sa iyo para sa layuning ito: upang italaga kita bilang lingkod at saksi sa mga pagkakataong nakita mo ako at sa mga pagkakataong magpapakita ako sa iyo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas pormal: “sa mga bagay na nakita mo ako at sa mga bagay na magpapakita ako sa iyo.” Siksik ang pagkakabuo ng pariralang Griyego; isinalin itong “mga pagkakataon” sa pangunahing teksto upang luminaw ang ugnayan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου
  choice: bumangon ka at tumayo sa iyong mga paa
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na utos at ang matingkad na idyomang pisikal ng Griyego.
- source_word: εἰς τοῦτο γὰρ ὤφθην σοι
  choice: sapagkat nagpakita ako sa iyo para sa layuning ito
  rationale: Ang «para sa layuning ito» ay malinaw na naghuhudyat ng layon, at ang «nagpakita ako» ay nagpapanatili sa wikang tumutukoy sa personal na pagpapakita.
- source_word: προχειρίσασθαί σε
  choice: italaga ka
  rationale: Ipinahihiwatig ng pandiwa ang pormal na pagpili at paghirang para sa isang tungkulin, hindi lamang simpleng pagpili.
- source_word: ὑπηρέτην
  choice: lingkod
  rationale: Likas at madaling maunawaang katawagan ito para sa isang tagapaglingkod o nakabababang kinatawan, nang hindi nagdaragdag ng espesipikong titulong pansimbahan.
- source_word: μάρτυρα
  choice: saksi
  rationale: Ito ang karaniwan at tiyak na salin para sa taong nagpapatotoo tungkol sa kanyang nakita at natanggap na kapahayagan.
- source_word: ὧν τε εἶδές με ὧν τε ὀφθήσομαί σοι
  choice: tungkol sa nakita mo sa akin at sa mga bagay na ihahayag ko pa sa iyo kapag nagpakita akong muli sa iyo
  rationale: Ang Griyegong parirala ay siksik at hindi likas kung ililipat nang mekanikal sa Tagalog. Nililinaw ng salin ang kaugnayan ng magiging patotoo ni Pablo sa nakaraan at hinaharap na pagpapakita, habang pinananatili ang «magpakita» para sa ὀφθήσομαι.
theological_decisions:
- issue: Kalikasan ng wikang paghahayag sa ὤφθην at ὀφθήσομαι
  choice: 'Isinalin ang dalawang anyo bilang personal na pagpapakita: «nagpakita ako» at «nagpakita akong muli.»'
  alternative: «Nakita mo ako / makikita mo ako» o «inihayag ko ang aking sarili / ihahayag ko ang aking sarili.»
  rationale: Pinananatili nito ang personal at obhetibong lakas ng pagpapakita ng muling nabuhay na si Jesus nang hindi tinutukoy kung paano naganap o magaganap ang pagpapakita.
- issue: Siksik na kaugnayan ng mga sugnay na ὧν ... ὧν
  choice: Ginawang malinaw sa pangunahing teksto ang patotoo tungkol sa nakita na at sa ihahayag sa mga darating na pagpapakita, na may pormal na anyo sa talababa.
  alternative: Mekanikal na «sa mga bagay na nakita mo ako at sa mga bagay na pagpapakitaan ko sa iyo.»
  rationale: Hindi malinaw at hindi likas sa modernong Tagalog ang mekanikal na anyo. Ang napiling salin ay nababasa nang maayos ngunit hindi itinatago ang siksik at maaaring ambiguwong konstruksiyon ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit tuwiran. Ginamit ang «sapagkat» at «italaga» upang mapanatili ang solemneng himig ng pagtawag, habang iniwasan ang lipas o lubhang pansimbahang pananalita.
