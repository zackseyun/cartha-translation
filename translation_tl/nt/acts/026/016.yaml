revisions:
- from: 'Ngunit bumangon ka at tumayo sa iyong mga paa, sapagkat nagpakita ako sa iyo para sa layuning ito: italaga ka bilang lingkod at saksi tungkol sa nakita mo sa akin at sa mga bagay na ihahayag ko pa sa iyo kapag nagpakita akong muli sa iyo.[a]'
  to: 'Ngunit bumangon ka at tumayo sa iyong mga paa, sapagkat nagpakita ako sa iyo para sa layuning ito: upang italaga kita bilang lingkod at saksi sa mga pagkakataong nakita mo ako at sa mga pagkakataong magpapakita ako sa iyo.[a]'
  rationale: Inayos ang tuwirang layon ng "nakita mo" upang tumukoy kay Jesus, ibinalik ang hinaharap na wikang personal na pagpapakita, at inalis ang walang katumbas na "muli." Ginamit ang "mga pagkakataon" upang maging natural ang Tagalog na katumbas ng siksik na Griyegong pariralang tumutukoy sa mga kontekstong/pangyayaring nakita o pagpapakitaan si Pablo.
