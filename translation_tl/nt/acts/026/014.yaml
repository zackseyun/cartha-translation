- from: Nang kaming lahat ay bumagsak sa lupa, narinig ko ang isang tinig na nagsabi sa akin sa wikang Hebreo[a], “Saulo, Saulo, bakit mo ako inuusig? Mahirap para sa iyo na sumipa sa mga panundot.”[b]
  to: Nang bumagsak kaming lahat sa lupa, narinig ko ang isang tinig na nagsabi sa akin sa wikang Hebreo[a], “Saulo, Saulo, bakit mo ako inuusig? Mahirap para sa iyo ang sumipa laban sa mga panundot.”[b]
  rationale: Inayos ang ayos ng unang sugnay para sa mas likas na Filipino, ginawang “laban sa” ang relasyon sa mga panundot upang mas tumpak na katawanin ang πρὸς, at nilinaw ang talababa. Hindi binago ang kahulugan, ang pagpapanatili ng “Hebreo” sa pangunahing teksto, o ang metaporang salawikain.
