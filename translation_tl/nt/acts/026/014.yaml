base_translation:
  language: en
  yaml_path: translation/nt/acts/026/014.yaml
  text: And when we had all fallen to the ground[a], I heard a voice saying to me in the Hebrew language, ‘Saul, Saul[b], why are you persecuting me? It is hard for you to kick against the goads.’
translation:
  language: tl
  text: Nang bumagsak kaming lahat sa lupa, narinig ko ang isang tinig na nagsabi sa akin sa wikang Hebreo[a], “Saulo, Saulo, bakit mo ako inuusig? Mahirap para sa iyo ang sumipa laban sa mga panundot.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa wikang Aramaico”; literal na sinasabi ng Griyego, “sa wikang/diyalektong Hebreo.”
    reason: alternative_reading
  - marker: b
    text: 'Isang salawikain: ang hayop na sumisipa laban sa matulis na panundot na ginagamit upang pakilusin ito ay sarili lamang ang sinasaktan. Ipinahihiwatig nito na ang paglaban sa nagsasalita ay magdudulot lamang ng pinsala sa lumalaban.'
    reason: cultural_note
lexical_decisions:
- source_word: πάντων τε καταπεσόντων ἡμῶν εἰς τὴν γῆν
  choice: Nang kaming lahat ay bumagsak sa lupa
  rationale: Ginawang likas na sugnay na temporal sa Tagalog ang genitive absolute. Napanatili ang πάντων ἡμῶν bilang “kaming lahat,” at ang εἰς τὴν γῆν bilang karaniwang “sa lupa.”
- source_word: ἤκουσα φωνὴν λέγουσαν πρός με
  choice: narinig ko ang isang tinig na nagsabi sa akin
  rationale: Ang φωνή ay “tinig” dahil malinaw na may binibigkas na mga salita; ang participial phrase ay isinalin bilang likas na sugnay na “na nagsabi sa akin.”
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: sa wikang Hebreo
  rationale: Tuwirang pinananatili ang katawagan ng Griyego. Hindi ipinalit sa pangunahing teksto ang “Aramaico,” bagaman maaaring iyon ang tinutukoy sa kontekstong pangkasaysayan.
- source_word: Σαοὺλ Σαούλ
  choice: Saulo, Saulo
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalan at pinanatili ang pag-uulit para sa diin.
- source_word: τί με διώκεις;
  choice: bakit mo ako inuusig?
  rationale: Ang “inuusig” ay likas at tumpak na nagpapahayag ng patuloy na mapanlabang paghabol o pag-uusig.
- source_word: σκληρόν σοι
  choice: Mahirap para sa iyo
  rationale: Pinananatili ang di-personal na pahayag at ang dative of reference nang hindi nililimitahan ang σκληρόν sa “masakit” lamang.
- source_word: πρὸς κέντρα λακτίζειν
  choice: na sumipa sa mga panundot
  rationale: Pinananatili ang konkretong larawan ng salawikain. Ang “panundot” ay tumutukoy sa matulis na gamit na ipinantutulak sa hayop, habang ang paliwanag sa pahiwatig nito ay inilagay sa talababa.
theological_decisions:
- issue: Kahulugan ng τῇ Ἑβραΐδι διαλέκτῳ
  choice: sa wikang Hebreo
  alternative: sa wikang Aramaico
  rationale: Ang pangunahing teksto ay sumusunod sa tahasang katawagan ng Griyego at hindi tahimik na nagpapasya sa usaping pangwika. Nasa talababa ang posibleng pagtukoy nito sa Aramaico.
- issue: Pahiwatig ng salawikaing πρὸς κέντρα λακτίζειν
  choice: pinanatili ang metaporang “sumipa sa mga panundot”
  alternative: tahasang paraphrase na “sinasaktan mo lamang ang iyong sarili sa paglaban”
  rationale: Pinananatili ang larawan at tensiyon ng orihinal; ipinapaliwanag sa talababa ang praktikal na diwa nito nang hindi ipinapalit ang paliwanag sa mismong teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Saulo” bilang nakaugaliang anyong Tagalog at “panundot” upang mapanatili ang konkretong larawang agrikultural nang hindi gumagamit ng sobrang teknikal o lumang salita.
