source:
  edition: SBLGNT
  text: ἀλλὰ τοῖς ἐν Δαμασκῷ πρῶτόν ⸀τε καὶ Ἱεροσολύμοις, ⸀πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας, καὶ τοῖς ἔθνεσιν ⸀ἀπήγγελλον μετανοεῖν καὶ ἐπιστρέφειν ἐπὶ τὸν θεόν, ἄξια τῆς μετανοίας ἔργα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/020.yaml
  text: but first to those in Damascus[a], then also in Jerusalem, and throughout all the region of Judea, and to the Gentiles, I proclaimed that they should repent and turn to God[b], doing works worthy of repentance.
translation:
  language: tl
  text: Sa halip, ipinahayag ko muna sa mga nasa Damasco, pagkatapos ay sa Jerusalem, sa buong lupain ng Judea, at sa mga Hentil[a] na dapat silang magsisi, bumaling sa Diyos, at gumawa ng mga gawang naaayon sa pagsisisi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga bansa.” Dito, tumutukoy ang salita sa mga taong hindi Judio, kaya “mga Hentil” ang ginamit sa pangunahing teksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mga gawang karapat-dapat sa pagsisisi” o “mga gawang angkop sa pagsisisi.” Tinutukoy ng parirala ang mga kilos na naaayon sa pagsisisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sa halip
  rationale: Tumutukoy sa pagsalungat sa naunang pahayag ni Pablo na hindi niya sinuway ang pangitain; natural sa Filipino ang “Sa halip” sa ugnayang ito.
- source_word: τοῖς ἐν Δαμασκῷ
  choice: sa mga nasa Damasco
  rationale: Pinananatili ang pagtukoy sa mga taong naroon, hindi lamang sa lugar.
- source_word: πρῶτόν τε καὶ Ἱεροσολύμοις
  choice: muna sa mga nasa Damasco, pagkatapos ay sa Jerusalem
  rationale: Ipinahihiwatig ng ayos ng parirala ang pagkakasunod at pagdaragdag; nililinaw ito sa natural na Filipino nang hindi ginagawang sabay ang dalawang lugar.
- source_word: πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας
  choice: sa buong lupain ng Judea
  rationale: Ang χώρα ay malawak na heograpikong saklaw; ang “lupain” ay malinaw at hindi nililimitahan sa kanayunan.
- source_word: τοῖς ἔθνεσιν
  choice: sa mga Hentil
  rationale: Sa konteksto, tumutukoy ito sa mga taong hindi Judio; mas tiyak dito ang “mga Hentil” kaysa “mga bansa.”
- source_word: ἀπήγγελλον
  choice: ipinahayag ko
  rationale: Ang pandiwa ay tumutukoy sa hayagang pagpapahayag ng mensahe sa kontekstong misyonero.
- source_word: μετανοεῖν
  choice: magsisi
  rationale: Sa kontekstong ito, ang μετανοέω ay hindi lamang pagbabago ng isip kundi pagsisisi sa harap ng Diyos; “magsisi” ang likas at kinikilalang katumbas sa Filipino.
- source_word: ἐπιστρέφειν ἐπὶ τὸν θεόν
  choice: manumbalik sa Diyos
  rationale: Ipinapahayag ang pagtalikod patungo sa Diyos. Bagaman maaaring magpahiwatig ang “manumbalik” ng pagbabalik, natural itong espirituwal na idyoma sa Filipino at ang saklaw ng mga Hentil sa talata ay pinananatili.
- source_word: ἄξια τῆς μετανοίας ἔργα
  choice: mga gawa na karapat-dapat sa pagsisisi
  rationale: Malapit na pinananatili ang relasyon ng ἄξια, ἔργα, at μετάνοια, nang hindi ipinapakahulugang ang mga gawa ang kapalit ng pagsisisi.
- source_word: πράσσοντας
  choice: na gumagawa
  rationale: Ipinapakita ng kasalukuyang participle ang kilos na kaakibat ng pagsisisi at pagbaling sa Diyos.
theological_decisions:
- issue: Ugnayan ng pagsisisi, pagbaling sa Diyos, at mga gawa
  choice: Inilalahad ang mga gawa bilang kaakibat at naaayon sa pagsisisi, nang hindi tahasang tinutukoy kung ang mga ito ay bunga, nilalaman, o batayan nito.
  alternative: Maaaring gawing tahasang “bilang patunay ng pagsisisi” o “mga gawang bunga ng pagsisisi.”
  rationale: Ang sintaks ay nag-uutos ng pagsisisi at pagbaling sa Diyos, habang inilalarawan ng participle ang paggawa ng mga gawang karapat-dapat sa pagsisisi. Ang salin ay hindi nagdaragdag ng paliwanag tungkol sa merito o ebidensiya na hindi tahasang sinasabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang biblikal na “magsisi,” “manumbalik sa Diyos,” at “mga Hentil,” habang iniwasan ang sobrang teknikal o denominasyonal na pananalita.
