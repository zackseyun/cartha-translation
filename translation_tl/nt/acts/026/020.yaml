- from: Sa halip, ipinahayag ko muna sa mga nasa Damasco, pagkatapos ay sa Jerusalem, sa buong lupain ng Judea, at sa mga Hentil[a] na dapat silang magsisi at manumbalik sa Diyos, na gumagawa ng mga gawa na karapat-dapat sa pagsisisi.[b]
  to: Sa halip, ipinahayag ko muna sa mga nasa Damasco, pagkatapos ay sa Jerusalem, sa buong lupain ng Judea, at sa mga Hentil[a] na dapat silang magsisi, bumaling sa Diyos, at gumawa ng mga gawang naaayon sa pagsisisi.[b]
