  source_fidelity: 'Tapat ang salin sa retorikal na tanong ng Griyego: naipapahayag nito ang paghatol ng kausap na grupo (κρίνεται παρ’ ὑμῖν), ang ‘hindi kapani-paniwala’ (ἄπιστον), at ang kondisyunal na εἰ sa ‘kung.’ Ang ‘bumubuhay ang Diyos ng mga patay’ ay angkop na pagsasalin ng νεκροὺς ἐγείρει.'
