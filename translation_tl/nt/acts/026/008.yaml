  text: τί ἄπιστον κρίνεται παρ’ ὑμῖν εἰ ὁ θεὸς νεκροὺς ἐγείρει;
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/008.yaml
  text: Why is it judged unbelievable by you if God raises the dead?
translation:
  language: tl
  text: Bakit ninyo itinuturing na hindi kapani-paniwala kung bumubuhay ang Diyos ng mga patay?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ... κρίνεται
  choice: Bakit ninyo itinuturing
  rationale: Natural Filipino active construction that preserves the force of the Greek passive question and explicitly retains παρ’ ὑμῖν, ‘by/among you.’
- source_word: ἄπιστον
  choice: hindi kapani-paniwala
  rationale: Directly conveys ‘unbelievable’ or ‘incredible’ in clear, current Filipino.
- source_word: εἰ
  choice: kung
  rationale: Preserves the conditional form ‘if,’ rather than silently converting it into the content marker ‘that.’
- source_word: νεκροὺς ἐγείρει
  choice: bumubuhay ... ng mga patay
  rationale: Idiomatic Filipino for God raising the dead, while retaining the Greek present-tense formulation.
theological_decisions:
- issue: Force of εἰ in the question
  choice: kung bumubuhay ang Diyos ng mga patay
  alternative: na bumubuhay ang Diyos ng mga patay
  rationale: The main text retains the source text’s conditional wording and its rhetorical tension; the alternative is smoother but interprets εἰ as introducing the proposition being deemed unbelievable.
- issue: Agency of the audience in κρίνεται παρ’ ὑμῖν
  choice: ninyo itinuturing
  alternative: itinuturing na hindi kapani-paniwala sa inyo
  rationale: The active Filipino construction clearly communicates that the hearers make the judgment without changing the substance of the Greek passive expression.
translation_notes:
  register: Modern, dignified Filipino with a direct rhetorical question. The wording is accessible to ordinary readers while closely preserving the source syntax and theological claim.
