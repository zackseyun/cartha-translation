  text: Περὶ πάντων ὧν ἐγκαλοῦμαι ὑπὸ Ἰουδαίων, βασιλεῦ Ἀγρίππα, ἥγημαι ἐμαυτὸν μακάριον ἐπὶ σοῦ μέλλων ⸂σήμερον ἀπολογεῖσθαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/002.yaml
  text: Concerning all the things of which I am accused by the Jews[a], King Agrippa, I consider myself fortunate that I am about to make my defense before you today,
translation:
  language: tl
  text: Sa lahat ng paratang ng mga Judio laban sa akin, Haring Agripa, itinuturing kong mapalad[a] ang aking sarili dahil ngayon ay malapit ko nang ipagtanggol ang aking sarili sa harap mo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinagpala”; sa kontekstong ito, malamang na ang diwa ay “mapalad” o “nabigyan ng natatanging pagkakataon” na maipagtanggol ang sarili sa harap ni Agripa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ πάντων ὧν
  choice: Sa lahat ng paratang … laban sa akin
  rationale: Ipinapahayag ng περί ang paksang tatalakayin. Pinagsama ito sa kasunod na pandiwa upang maging natural sa Tagalog habang pinananatili ang saklaw na “lahat.”
- source_word: ἐγκαλοῦμαι
  choice: mga paratang … laban sa akin
  rationale: Ang pandiwa ay tumutukoy sa pormal na pag-aakusa sa kontekstong legal. Ang pariralang ito ay malinaw at likas sa makabagong Tagalog.
- source_word: ὑπὸ Ἰουδαίων
  choice: ng mga Judio
  rationale: Ipinakikita ng ὑπό kung sino ang gumagawa ng pag-aakusa. Sa konteksto, tumutukoy ito sa mga Judiong nag-aakusa kay Pablo, hindi sa lahat ng Judio.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Haring Agripa
  rationale: Pinananatili ang tuwirang pagtawag at ang titulong maharlika sa natural na anyong Tagalog.
- source_word: ἥγημαι ἐμαυτὸν
  choice: itinuturing kong … ang sarili ko
  rationale: Pinananatili nito ang kahulugan ng paghatol o pagturing at ang reflexive na anyo ng Griyego.
- source_word: μακάριον
  choice: mapalad
  rationale: Sa pagdinig na ito, ipinahihiwatig ng salita ang pagiging nasa mabuting kalagayan o pagkakaroon ng natatanging pagkakataon. Ang “mapalad” ay nagpapanatili rin ng posibleng mas malawak na diwa ng μακάριος.
- source_word: ἐπὶ σοῦ
  choice: sa harap mo
  rationale: Natural itong pagpapahayag ng pagharap sa isang taong nakikinig sa isang legal na depensa, nang hindi idinaragdag na si Agripa ang pormal na hukom.
- source_word: μέλλων
  choice: sapagkat … ngayon
  rationale: Naipahahayag ng sugnay ang nalalapit na gagawin ni Pablo; ang “sapagkat” ay natural na nag-uugnay sa dahilan kung bakit niya itinuturing na mapalad ang sarili niya.
- source_word: σήμερον
  choice: ngayon
  rationale: Direkta at natural na katumbas ng σήμερον sa kontekstong ito.
- source_word: ἀπολογεῖσθαι
  choice: maipagtatanggol ko ang aking sarili
  rationale: Ipinapahayag nito ang legal na diwa ng pagsasalita ni Pablo bilang pagtatanggol laban sa mga paratang.
theological_decisions:
- issue: Diwa ng μακάριον
  choice: mapalad
  alternative: pinagpala
  rationale: Hindi nililimitahan ng salin ang salita sa tahasang espirituwal na pagpapala; sa legal na tagpo, malamang na binibigyang-diin ni Pablo ang mabuting pagkakataong makapagsalita sa harap ni Agripa, habang ang talababa ay nagpapanatili sa alternatibong diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang legal na pananalitang madaling maunawaan ng karaniwang mambabasa. Pinanatili ang kuwit sa dulo dahil nagpapatuloy ang pangungusap sa kasunod na talata.
