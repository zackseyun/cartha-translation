  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: προγινώσκοντές με ἄνωθεν, ἐὰν θέλωσι μαρτυρεῖν, ὅτι κατὰ τὴν ἀκριβεστάτην αἵρεσιν τῆς ἡμετέρας θρησκείας ἔζησα Φαρισαῖος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/005.yaml
  text: They have known me from the beginning[a], if they are willing to testify[b], that I lived as a Pharisee according to the strictest sect of our religion.
translation:
  language: tl
  text: Kilala na nila ako mula pa noong una[a]. Kung handa silang magpatotoo, mapatutunayan nila na namuhay ako bilang Pariseo ayon sa pinakamahigpit na pangkat[b] ng ating relihiyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula pa sa simula” o “matagal na.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego ay tumutukoy rito sa isang pangkat o partido, hindi sa “erehiya” sa mas huling teknikal na kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: προγινώσκοντές
  choice: Kilala na nila ako
  rationale: Ipinahihiwatig ng participle ang pagkakilala kay Pablo na nagsimula sa nakaraan at nagpapatuloy; likas ito sa modernong Tagalog at hindi ipinipilit ang literal na diwa ng “bago pa man.”
- source_word: ἄνωθεν
  choice: mula pa noong una
  rationale: Sa kontekstong ito, tumutukoy ito sa pinakamaagang panahon ng pagkakilala nila kay Pablo, hindi sa “mula sa itaas.”
- source_word: ἐὰν θέλωσι μαρτυρεῖν
  choice: Kung handa silang magpatotoo
  rationale: Pinananatili ng “handa” ang diwa ng kusang-loob na pagpayag sa θέλωσι, at ang “magpatotoo” ay angkop sa legal na tagpo.
- source_word: ἀκριβεστάτην
  choice: pinakamahigpit
  rationale: Ang superlatibo ay tumutukoy sa pambihirang higpit ng pamumuhay at pagsunod ng grupong ito.
- source_word: αἵρεσιν
  choice: pangkat
  rationale: Dito ay isang kinikilalang grupo o partido sa loob ng Judaismo ang tinutukoy, hindi “erehiya” sa mas huling teknikal na kahulugan.
- source_word: θρησκείας
  choice: relihiyon
  rationale: Tumutukoy ito sa kabuuang relihiyosong tradisyon at pamumuhay na ibinabahagi ni Pablo at ng mga Judio.
- source_word: ἔζησα Φαρισαῖος
  choice: namuhay ako bilang Pariseo
  rationale: Natural na ipinahahayag sa Tagalog ang dating paraan ng pamumuhay at pagkakakilanlan ni Pablo bilang kabilang sa mga Pariseo.
theological_decisions:
- issue: Kahulugan ng αἵρεσις sa kontekstong Judio
  choice: pangkat
  alternative: sekta; erehiya
  rationale: Ang “pangkat” ay malinaw na tumutukoy sa mga Pariseo bilang isang kinikilalang grupo sa loob ng Judaismo. Iniiwasan nito ang makabagong negatibong dating ng “sekta” at ang anakronistikong teknikal na kahulugan ng “erehiya.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Hinati sa dalawang pangungusap upang maging natural ang masalimuot na Griyegong ayos habang pinananatili ang legal na diwa ng pagpapatotoo at ang ugnayan ng pagkakilala nila kay Pablo sa dati niyang pamumuhay.
