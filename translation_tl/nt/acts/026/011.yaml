  text: καὶ κατὰ πάσας τὰς συναγωγὰς πολλάκις τιμωρῶν αὐτοὺς ἠνάγκαζον βλασφημεῖν, περισσῶς τε ἐμμαινόμενος αὐτοῖς ἐδίωκον ἕως καὶ εἰς τὰς ἔξω πόλεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/011.yaml
  text: And in all the synagogues[a], punishing them many times, I tried to force them to blaspheme; and being exceedingly enraged against them, I kept persecuting them even to the foreign cities.
translation:
  language: tl
  text: Sa bawat sinagoga, madalas ko silang pinarurusahan at sinisikap na piliting lumapastangan. At sa tindi ng pagngangalit ko laban sa kanila, patuloy ko silang inusig maging hanggang sa mga lungsod sa labas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “maging hanggang sa mga lungsod sa labas.” Malamang na tumutukoy ito sa mga lungsod sa labas ng Judea.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάσας τὰς συναγωγάς
  choice: Sa lahat ng sinagoga
  rationale: 'Ipinahahayag nito ang distributibong diwa ng κατά: paulit-ulit na naganap ang kilos sa iba''t ibang sinagoga.'
- source_word: πολλάκις τιμωρῶν αὐτούς
  choice: madalas ko silang pinarurusahan
  rationale: Pinananatili ng “madalas” ang paulit-ulit na kilos, at ang aspektong di-ganap ng “pinarurusahan” ay angkop sa kasabay at nagpapatuloy na kalagayang ipinahahayag ng participle.
- source_word: ἠνάγκαζον
  choice: pinipilit
  rationale: Ang imperpektong anyo ay maaaring magpahiwatig ng paulit-ulit o patuloy na pamimilit nang hindi kinakailangang sabihing nagtagumpay ito sa bawat pagkakataon.
- source_word: βλασφημεῖν
  choice: lumapastangan
  rationale: Karaniwang salin ito para sa pagsasalitang mapamusong o lapastangan; hindi tinukoy ang layon sapagkat wala rin itong tahasang layon sa Griyego.
- source_word: περισσῶς τε ἐμμαινόμενος αὐτοῖς
  choice: dahil sa sukdulang galit ko sa kanila
  rationale: Ipinakikita ng “sukdulan” ang matinding antas ng περισσῶς, samantalang ang “galit” ay natural na nagpapahayag ng nagngangalit na poot nang hindi nagmumungkahi ng sakit sa isip.
- source_word: ἐδίωκον
  choice: patuloy ko silang inusig
  rationale: Pinananatili ng “patuloy” ang imperpektibong diwa ng nagpapatuloy at paulit-ulit na pag-uusig.
- source_word: ἕως καὶ εἰς τὰς ἔξω πόλεις
  choice: maging sa mga lungsod sa labas ng lupain
  rationale: Mas malapit ito sa literal na “mga lungsod sa labas” kaysa “mga banyagang lungsod,” habang nililinaw sa natural na Tagalog ang malamang na heograpikong diwa ng paglabas sa sariling lupain.
theological_decisions:
- issue: Saklaw o layon ng βλασφημεῖν
  choice: Isinaling “lumapastangan” nang walang tinukoy na layon.
  alternative: “lapastanganin si Jesus” o “magsalita laban sa pananampalatayang Cristiano”
  rationale: Bagaman malamang na si Jesus o ang pahayag ng mga Cristiano ang tinutukoy sa konteksto, walang tahasang layon ang pandiwa sa Griyego; pinananatili ng salin ang pagkukulang na ito.
- issue: Bunga ng pamimilit
  choice: “pinipilit” sa aspektong nagpapatuloy, nang hindi tahasang sinasabing nagtagumpay ang pamimilit.
  alternative: “pinilit kong” o “napilitan ko silang”
  rationale: Ang imperpektong ἠνάγκαζον ay naglalarawan ng paulit-ulit o nagpapatuloy na pamimilit; hindi dapat ipilit ng salin na talagang lumapastangan ang lahat ng pinahirapan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “sinagoga,” “lumapastangan,” at “inusig” bilang pamilyar at angkop na bokabularyong biblikal; iniwasan ang sobrang arkaiko o denominasyonal na pananalita.
