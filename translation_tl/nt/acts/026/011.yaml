revisions:
- from: Sa lahat ng sinagoga, madalas ko silang pinarurusahan at pinipilit na lumapastangan. At dahil sa sukdulang galit ko sa kanila, patuloy ko silang inusig maging sa mga lungsod sa labas ng lupain.[a]
  to: Sa bawat sinagoga, madalas ko silang pinarurusahan at sinisikap na piliting lumapastangan. At sa tindi ng pagngangalit ko laban sa kanila, patuloy ko silang inusig maging hanggang sa mga lungsod sa labas.[a]
  rationale: Inalis ang hindi tahasang “lupain” mula sa pangunahing teksto upang mapanatili ang heograpikong bukas na pahayag ng ἔξω πόλεις. Isinaayos ang mga pandiwa upang maipakita ang paulit-ulit na pagpaparusa, ang pagtatangkang mamilit, at ang nagpapatuloy na pag-uusig; pinanatili rin ang di-tinukoy na layon ng “lumapastangan.”
