  text: καὶ ἀναχωρήσαντες ἐλάλουν πρὸς ἀλλήλους λέγοντες ὅτι Οὐδὲν θανάτου ⸂ἢ δεσμῶν ἄξιον⸃ ⸀τι πράσσει ὁ ἄνθρωπος οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/031.yaml
  text: And after they withdrew[a], they were speaking to one another, saying, “This man is doing nothing worthy of death or imprisonment.”
translation:
  language: tl
  text: Pagkaalis nila, nag-usap-usap sila at sinabi, “Walang ginagawa ang taong ito na karapat-dapat sa parusang kamatayan o pagkabilanggo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “parusang kamatayan o mga tanikala.” Literal na “mga gapos” o “mga tanikala” ang salitang Griyego na δεσμῶν, ngunit malamang na tumutukoy ito rito sa pagkabilanggo o kustodiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναχωρήσαντες
  choice: Pagkaalis nila
  rationale: Ipinahihiwatig ng aorist participle na umalis muna sila sa kinaroroonan bago naganap ang pag-uusap; natural at malinaw ito sa modernong Tagalog.
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: nag-usap-usap sila
  rationale: Ipinapakita ng anyong imperfect ang nagpapatuloy at kapwa-kapwang pag-uusap, hindi lamang isang minsanang pagsasalita.
- source_word: λέγοντες
  choice: at sinabi
  rationale: Likas na paraan ito sa Tagalog upang ipakilala ang nilalaman ng kanilang pag-uusap nang hindi mabigat ang pangungusap.
- source_word: Οὐδὲν ... ἄξιον
  choice: Walang ginagawang anuman ... na nararapat
  rationale: Pinananatili nito ang ganap na pagtanggi at ang diwa ng pagiging karapat-dapat sa nasabing mga parusa.
- source_word: θανάτου ἢ δεσμῶν
  choice: sa kamatayan o pagkabilanggo
  rationale: Ang “kamatayan” ay tumutukoy sa parusang kamatayan sa kontekstong panghukuman, at ang δεσμῶν, bagaman literal na “mga tanikala,” ay natural na tumutukoy rito sa pagkabilanggo o kustodiya.
- source_word: τι πράσσει
  choice: ginagawang anuman
  rationale: Malawak ang kahulugan ng πράσσει at hindi nito tahasang tinatawag na krimen ang kilos; iniiwasan ng salin ang labis na pagpapakahulugang “ginagawang kasalanan.”
- source_word: ὁ ἄνθρωπος οὗτος
  choice: ang taong ito
  rationale: Tuwiran, natural, at angkop na pagtukoy kay Pablo.
