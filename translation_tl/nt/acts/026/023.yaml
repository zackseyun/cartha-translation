  text: εἰ παθητὸς ὁ χριστός, εἰ πρῶτος ἐξ ἀναστάσεως νεκρῶν φῶς μέλλει καταγγέλλειν τῷ ⸀τε λαῷ καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/023.yaml
  text: that the Messiah would suffer[a], and that, as the first to rise from the dead[d][c][b], he would proclaim light both to the people and to the Gentiles.
translation:
  language: tl
  text: na ang Mesiyas ay magdurusa[a], at bilang unang bumangon mula sa mga patay, ipahahayag niya ang liwanag kapuwa sa bayan[b] at sa mga Hentil[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Cristo.” Ginamit dito ang “Mesiyas” sapagkat ang Χριστός ay isang titulo sa kontekstong propetiko.
    reason: alternative_reading
  - marker: b
    text: Ang “bayan” dito ay malamang na tumutukoy sa bayang Judio, bilang kaiba sa “mga Hentil.”
    reason: lexical_alternative
  - marker: c
    text: O “sa mga bansa.” Sa kontekstong ito, karaniwang tumutukoy ang parirala sa mga Hentil.
    reason: lexical_alternative
lexical_decisions:
- source_word: παθητὸς
  choice: magdurusa
  rationale: Sa buod na ito ng pahayag ng mga propeta, likas na ipinahahayag sa Filipino ang pang-uri bilang mangyayari sa Mesiyas; iniiwasan din nito ang pilosopikal at di-likas na anyong gaya ng “maaaring magdusa.”
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Pamagat ito ng pinahirang tagapagligtas sa kontekstong propetiko, kaya “Mesiyas” ang malinaw at likas na katumbas.
- source_word: πρῶτος ἐξ ἀναστάσεως νεκρῶν
  choice: bilang unang bumangon mula sa mga patay
  rationale: Pinananatili ang hayag na pag-una ng Mesiyas at ang diwa ng pagkabuhay mula sa mga patay, nang hindi nagdaragdag ng paliwanag tungkol sa naunang pansamantalang pagbabalik sa buhay.
- source_word: φῶς
  choice: ang liwanag
  rationale: Pinananatili ang malawak na biblikal na talinghaga ng liwanag sa halip na paliitin ito sa isang interpretasyong gaya ng “kaalaman” o “kaliwanagan.”
- source_word: μέλλει καταγγέλλειν
  choice: ipahahayag niya
  rationale: Ang μέλλω na may pawatas ay nagpapahiwatig dito ng hinaharap o itinakdang pagkilos; ang “ipahahayag niya” ay natural sa Filipino at hindi nagpapahiwatig ng agarang pagkakasunod lamang.
- source_word: τῷ τε λαῷ
  choice: sa bayan
  rationale: Pinananatili ang karaniwang kahulugan ng λαός at ang pahiwatig na Israel o ang bayang Judio ang tinutukoy dahil sa pagkakaiba nito sa mga Hentil.
- source_word: τοῖς ἔθνεσιν
  choice: sa mga Hentil
  rationale: Sa tahasang paghahambing sa bayan, “mga Hentil” ang pinakamalinaw na katumbas ng ἔθνη; ang “mga bansa” ay maaaring magpalabo sa etniko at panrelihiyong pagkakaiba.
- source_word: τε ... καὶ
  choice: kapuwa ... at
  rationale: Likas na inilalarawan ng “kapuwa ... at” ang pares ng mga tatanggap na nasa Griyego.
theological_decisions:
- issue: Pag-una ng Mesiyas sa pagkabuhay mula sa mga patay
  choice: Pinananatili ang “unang bumangon mula sa mga patay” nang walang dagdag na paliwanag sa pangunahing teksto.
  alternative: “unang nabuhay na muli upang hindi na mamatay” o “unang bunga ng muling pagkabuhay”
  rationale: Pag-una ang tahasang sinasabi ng Griyego, ngunit hindi nito mismo nililinaw sa pariralang ito ang kaugnayan sa mga naunang pansamantalang pagbabalik sa buhay; hindi dapat ipasok sa salin ang isang mas buong paliwanag na teolohikal.
- issue: Saklaw ng “bayan”
  choice: “sa bayan,” na ang bayang Judio o Israel ang ipinahihiwatig ng kaibahan sa mga Hentil
  alternative: “sa bayang Judio” o “sa Israel”
  rationale: Ang λαός ay nananatiling di-tiyak sa anyo bagaman malamang na Israel ang tinutukoy sa konteksto. Pinananatili ng pangunahing teksto ang salitang pinagmulan, at nililinaw ito sa talababa.
- issue: Ugnayan ng pagbangon at pagpapahayag
  choice: “bilang unang bumangon mula sa mga patay, ipahahayag niya”
  alternative: “at siya ang unang mabubuhay mula sa mga patay at magpapahayag”
  rationale: Pinananatili nito ang masiksik na ugnayan ng πρῶτος ἐξ ἀναστάσεως νεκρῶν sa pagpapahayag ng liwanag, habang nananatiling natural sa Filipino at hindi ginagawang hiwalay na pangatlong pahayag ang pagbangon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinili ang “bumangon mula sa mga patay” kaysa sa mas teknikal na “muling pagkabuhay” upang tumbasan ang masiksik na pariralang Griyego sa natural na anyo. Ang “bayan” ay sadyang hindi pinalawak bilang “bayang Judio” sa pangunahing teksto upang mapanatili ang leksikal na anyo at tunay na pahiwatig ng pinagmulan.
