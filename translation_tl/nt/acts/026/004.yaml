  yaml_path: translation/nt/acts/026/004.yaml
  text: So then[a], all the Jews know my manner of life from my youth, which from the beginning took place among my own nation and also in Jerusalem,
translation:
  language: tl
  text: Kaya nga, alam ng lahat ng Judio ang paraan ng pamumuhay ko[a] mula pa sa aking kabataan—isang pamumuhay na mula pa sa simula ay naganap sa sarili kong bayan at sa Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “takbo ng buhay ko” o “pamumuhay ko.” Tumutukoy ang salitang Griego sa paraan ng pamumuhay ni Pablo, hindi lamang sa kaniyang pag-iral.
    reason: lexical_alternative
lexical_decisions:
- source_word: βίωσίν
  choice: paraan ng pamumuhay
  rationale: Ipinahahayag nito ang paraan o takbo ng pamumuhay ni Pablo, hindi lamang ang kaniyang pag-iral; malinaw at likas ito sa makabagong Filipino.
- source_word: ἐκ νεότητος
  choice: mula pa sa aking kabataan
  rationale: Pinananatili ang panahong pinagmulan ng tinutukoy na pamumuhay at ang personal na pagtukoy na ipinahihiwatig ng konteksto.
- source_word: ἀπ’ ἀρχῆς
  choice: sa simula pa lamang
  rationale: Likas na Filipino na nagpapanatili sa pagbibigay-diin sa maagang pasimula.
- source_word: γενομένην
  choice: naganap
  rationale: Inilalarawan ang pamumuhay bilang naganap sa isang tiyak na kapaligiran, nang hindi dinaragdagan ang diwa ng pandiwa.
- source_word: ἐν τῷ ἔθνει μου
  choice: sa piling ng sarili kong bayan
  rationale: Ang ἔθνος dito ay tumutukoy sa sariling bayang etniko o sambayanan ni Pablo, hindi sa makabagong estadong pampolitika.
- source_word: ἔν τε Ἱεροσολύμοις
  choice: at sa Jerusalem
  rationale: Direktang ipinapakita ang koordinasyong idinaragdag ng τε nang hindi labis na binibigyang-diin.
- source_word: ἴσασι
  choice: alam
  rationale: Ang anyong perpekto ng οἶδα ay may pangkasalukuyang estadibong kahulugan, kaya ang payak na “alam” ang pinakalikas.
- source_word: πάντες Ἰουδαῖοι
  choice: lahat ng Judio
  rationale: Tuwirang pinananatili ang pangkalahatang pahayag at ang katawagang etniko sa konteksto.
- source_word: μὲν οὖν
  choice: Kaya nga
  rationale: Ipinakikita ang paglipat at pagpapatuloy ng pangangatwiran sa depensa ni Pablo.
