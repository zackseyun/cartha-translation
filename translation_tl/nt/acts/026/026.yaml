  text: ἐπίσταται γὰρ περὶ τούτων ὁ βασιλεύς, πρὸς ὃν ⸀καὶ παρρησιαζόμενος λαλῶ· λανθάνειν γὰρ ⸀αὐτὸν τούτων οὐ πείθομαι ⸀οὐθέν, οὐ γάρ ⸀ἐστιν ἐν γωνίᾳ πεπραγμένον τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/026.yaml
  text: For the king knows about these things[a], and I speak boldly to him. For I am persuaded that none of these things has escaped his notice[c][b], because this has not been done in a corner.
translation:
  language: tl
  text: Sapagkat alam ng hari ang mga bagay na ito, at hayagan at buong tapang akong nagsasalita sa kanya.[a] Kumbinsido akong walang anuman sa mga ito ang nakalampas sa kanyang pansin,[b] sapagkat hindi ito ginawa sa isang sulok.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malaya akong nagsasalita sa kanya.” Ang salitang Griyego ay tumutukoy sa hayag, malaya, at may-kumpiyansang pananalita.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “walang anuman sa mga ito ang lingid sa kanya” o “walang anuman sa mga ito ang hindi niya nalalaman.”
    reason: lexical_alternative
  - marker: c
    text: 'Ang “hindi ginawa sa isang sulok” ay isang idyoma: hindi ito ginawa nang palihim o sa paraang hindi napapansin ng publiko.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐπίσταται
  choice: alam
  rationale: Tuwirang ipinahahayag ng pandiwa ang kaalaman o pagkakilala ng hari sa mga pangyayaring tinutukoy.
- source_word: περὶ τούτων
  choice: ang tungkol sa mga bagay na ito
  rationale: Pinananatili nito ang malawak at hindi tiyak na saklaw ng τούτων nang hindi nililimitahan ang tinutukoy.
- source_word: παρρησιαζόμενος
  choice: malaya at buong tapang akong nagsasalita
  rationale: Ipinapakita ng parirala ang lantad, walang-takot, at may-kumpiyansang pananalita; hindi sapat ang simpleng “matapang” lamang upang maipakita ang diwa ng malayang pagsasalita.
- source_word: πρὸς ὃν ... λαλῶ
  choice: nagsasalita sa kanya
  rationale: Natural na ayos sa modernong Tagalog para sa taong tuwirang kinakausap ni Pablo.
- source_word: λανθάνειν ... αὐτὸν
  choice: ang hindi niya nalalaman
  rationale: Natural na ipinahahayag sa Tagalog na walang pangyayaring nakalampas sa kaalaman o pansin ng hari.
- source_word: οὐ πείθομαι οὐθέν
  choice: Kumbinsido akong walang anuman
  rationale: Isinasalin ang magkakaugnay na mga negatibo bilang malinaw na positibong pahayag ng matatag na paniniwala ni Pablo.
- source_word: πεπραγμένον
  choice: nangyari
  rationale: Sa konteksto, natural na tumutukoy ito sa mga pangyayaring naganap; pinananatili ng footnote ang pampublikong katangian ng mga ito.
- source_word: ἐν γωνίᾳ
  choice: sa isang sulok
  rationale: Pinananatili ang matingkad na idyomatikong larawan ng Griyego at ipinaliliwanag ang kahulugan sa talababa.
- source_word: τοῦτο
  choice: ito
  rationale: Hindi nililinaw nang higit sa teksto kung eksaktong aling pangyayari o kabuuan ng mga pangyayari ang tinutukoy.
theological_decisions:
- issue: Saklaw ng τοῦτο (“ito”) at ang pampublikong katangian ng mga pangyayari
  choice: Panatilihin ang malawak at neutral na “ito.”
  alternative: Tukuyin ito nang makitid bilang kamatayan at muling pagkabuhay ni Jesus, o nang malawak bilang buong kilusang Kristiyano at kaso ni Pablo.
  rationale: Hindi tiyak na itinatakda ng talata ang saklaw ng panghalip. Ang neutral na salin ay nagpapanatili sa tunay na kalabuan ng teksto at hindi nagdaragdag ng isang partikular na paliwanag na teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “hari” ayon sa konteksto at pinanatili ang idyomang “sa isang sulok,” kalakip ang paliwanag. Ang “malaya at buong tapang” ay naghahatid sa saklaw ng παρρησιαζόμενος nang natural sa Tagalog.
