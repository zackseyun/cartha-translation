  terminology: Ang “hari,” “mga bagay na ito,” at “sa isang sulok” ay angkop. Pinananatili ng “ito” ang sinadyang malawak na saklaw ng τοῦτο. Ang idyoma ay dapat panatilihin ngunit ipaliwanag sa talababa.
