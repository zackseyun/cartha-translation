  text: Ἐν ⸀οἷς πορευόμενος εἰς τὴν Δαμασκὸν μετ’ ἐξουσίας καὶ ἐπιτροπῆς ⸀τῆς τῶν ἀρχιερέων
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/012.yaml
  text: In this connection[a], as I was traveling to Damascus with authority and a commission from the chief priests,
translation:
  language: tl
  text: Kaugnay ng mga iyon,[a] habang naglalakbay ako patungong Damasco taglay ang awtoridad at isang atas mula sa mga punong pari,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Sa mga iyon,” na tumutukoy sa naunang binanggit na mga ginagawa at layak ni Pablo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: Habang ginagawa ko ang mga iyon
  rationale: Pinananatili nito ang pabalik na pagtukoy sa naunang binanggit na mga gawain ni Pablo at binibigyang-likas sa Tagalog ang literal na ‘sa mga iyon,’ nang hindi nagdaragdag ng di-tahasang ‘misyon.’
- source_word: πορευόμενος εἰς τὴν Δαμασκὸν
  choice: naglalakbay ako patungong Damasco
  rationale: Ang participle ay nagsasaad ng kasabay na pangyayari; natural itong ipinahahayag sa Tagalog bilang nagpapatuloy na paglalakbay patungo sa lungsod.
- source_word: μετ’ ἐξουσίας
  choice: taglay ang awtoridad
  rationale: Ang ἐξουσία rito ay opisyal at ipinagkaloob na karapatan, hindi basta lakas o kapangyarihan.
- source_word: ἐπιτροπῆς
  choice: atas
  rationale: Ipinahahayag ng ‘atas’ ang pormal na gawaing ipinagkatiwala o ipinag-utos, at natural itong katambal ng ‘awtoridad.’
- source_word: τῆς τῶν ἀρχιερέων
  choice: mula sa mga punong pari
  rationale: Ipinakikita ng ‘mula sa’ na ang awtoridad at atas ay nagmula sa pangkat ng mga pinunong saserdote.
theological_decisions: []
translation_notes:
  register: Makabago at marangal na Filipino; ginamit ang ‘punong pari’ para sa ἀρχιερεῖς bilang katawagan sa mataas na pamunuang saserdotal, at ‘Damasco’ bilang karaniwang anyong Filipino ng pangalan ng lungsod.
