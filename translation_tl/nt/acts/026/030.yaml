base_translation:
  language: en
  yaml_path: translation/nt/acts/026/030.yaml
  text: Then the king rose[a], and the governor and Bernice and those seated with them,
translation:
  language: tl
  text: Pagkatapos, tumayo ang hari, ang gobernador, si Bernice[a], at ang mga nakaupong kasama nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bernice: maaari ring “Berenice.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέστη
  choice: tumayo
  rationale: Tumutukoy rito ang aorist ng ἀνίστημι sa pisikal na pagtayo mula sa pagkakaupo; natural at marangal ang “tumayo” sa tagpong ito.
- source_word: τε
  choice: Pagkatapos
  rationale: Iniuugnay ng unang τε ang kilos sa naunang pangyayari; malinaw na ipinahahayag ng “Pagkatapos” ang pagsulong ng salaysay. Isinama na sa koordinasyon ang ikalawang τε.
- source_word: ὁ βασιλεὺς
  choice: ang hari
  rationale: Tuwirang katumbas ito ng βασιλεύς at pinananatili ang titulong ginamit ng Griyego sa halip na idagdag ang pangalang Agripa.
- source_word: ὁ ἡγεμὼν
  choice: ang gobernador
  rationale: Sa konteksto ng Mga Gawa, ang ἡγεμών ay tumutukoy sa Romanong gobernador ng lalawigan; “gobernador” ang tiyak at likas na katumbas.
- source_word: Βερνίκη
  choice: Bernice
  rationale: Ginagamit ang anyong “Bernice,” na pamilyar sa tradisyong biblikal sa Filipino; inilalagay sa talababa ang alternatibong transliterasyong “Berenice.”
- source_word: οἱ συγκαθήμενοι αὐτοῖς
  choice: ang mga nakaupong kasama nila
  rationale: Pinananatili nito ang larawan ng mga taong magkakasamang nakaupo nang hindi ipinapalagay ang kanilang katayuang panlipunan o tungkulin.
- source_word: καὶ
  choice: kasama ang … si … at
  rationale: Likas na isinasaad sa Filipino ang sunod-sunod na koordinasyon sa pamamagitan ng “kasama ang” at “at,” habang pinananatili ang lahat ng taong nakalista.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “kasama ang” upang maiwasan ang alanganing sunod-sunod na “at” sa Filipino, nang hindi binabago ang ugnayan ng mga tauhan sa Griyego.
