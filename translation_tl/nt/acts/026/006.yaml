  text: καὶ νῦν ἐπ’ ἐλπίδι τῆς ⸀εἰς τοὺς πατέρας ⸀ἡμῶν ἐπαγγελίας γενομένης ὑπὸ τοῦ θεοῦ ἕστηκα κρινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/006.yaml
  text: And now I stand on trial because of the hope of the promise made by God to our fathers,[a]
translation:
  language: tl
  text: At ngayon, nililitis ako dahil sa pag-asa sa pangakong ginawa ng Diyos sa ating mga ninuno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ating mga ama,” na tumutukoy sa mga ninuno ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: At ngayon
  rationale: Natural na panandang nag-uugnay sa kasalukuyang paglilitis ni Pablo sa naunang bahagi ng kanyang pagtatanggol.
- source_word: ἐπ’ ἐλπίδι
  choice: dahil sa pag-asa
  rationale: Ang ἐπί na may datibo ay nagpapahayag dito ng batayan o sanhi; malinaw na ipinahihiwatig ng parirala kung bakit nililitis si Pablo.
- source_word: ἐπαγγελίας
  choice: pangako
  rationale: Karaniwan at malinaw na katumbas; ang pag-asa ay nakaugnay sa pangako ng Diyos.
- source_word: τῆς εἰς τοὺς πατέρας ἡμῶν ἐπαγγελίας
  choice: sa pangakong ... sa ating mga ninuno
  rationale: Ipinakikita ng εἰς τοὺς πατέρας ἡμῶν kung kanino iniukol o ibinigay ang pangako. Ang 'pag-asa sa pangako' ay likas sa Tagalog habang pinananatili ang ugnayan ng dalawang pangngalan.
- source_word: γενομένης ὑπὸ τοῦ θεοῦ
  choice: ginawa ng Diyos
  rationale: Pinananatili ang tahasang pagkilos ng Diyos bilang pinagmulan at gumawa ng pangako.
- source_word: πατέρας ἡμῶν
  choice: ating mga ninuno
  rationale: Sa kontekstong Judio, tumutukoy ito sa mga ninunong lalaki o mga ama ng Israel. Mas natural sa modernong Tagalog ang 'mga ninuno'; inilalahad sa talababa ang literal na anyo.
- source_word: ἕστηκα κρινόμενος
  choice: nililitis ako
  rationale: Pinagsasama sa natural na legal na pananalita sa Tagalog ang kasalukuyang kalagayan ng ἕστηκα at ang hudisyal na diwa ng κρινόμενος.
theological_decisions:
- issue: Pagkakakilanlan ng πατέρας ἡμῶν
  choice: mga ninuno ng Israel na tumanggap ng pangako ng Diyos
  alternative: ating mga ama
  rationale: Sa talumpati ni Pablo kay Agripa, inuugnay ng parirala ang paglilitis sa minanang pag-asa at mga pangako ng Israel. Hindi pinalalawak ng pangunahing teksto kung aling partikular na mga ninuno ang tinutukoy.
- issue: Ugnayan ng pag-asa at pangako
  choice: pag-asa sa pangako
  alternative: pag-asa ng pangako
  rationale: Ang genitibong ἐπαγγελίας ay sadyang maikli at maaaring ilarawan ang pag-asang nakabatay o nakasentro sa pangako. Ang 'pag-asa sa pangako' ang natural na Tagalog nang hindi tinutukoy sa talata ang mismong katuparan nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at likas sa karaniwang mambabasa. Ginamit ang legal na salitang “nililitis” at iniwasan ang mas mabigat na literalismong “nakatayo akong hinahatulan.”
