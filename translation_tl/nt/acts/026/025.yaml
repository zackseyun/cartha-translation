id: ACT.26.25
reference: Acts 26:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Οὐ μαίνομαι, φησίν, κράτιστε Φῆστε, ἀλλὰ ἀληθείας καὶ σωφροσύνης ῥήματα ἀποφθέγγομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/025.yaml
  text: But Paul said[a], “I am not out of my mind, most excellent Festus[c][b], but I am speaking words of truth and sound judgment.”
translation:
  language: tl
  text: Ngunit sinabi ni Pablo, “Hindi ako nasisiraan ng bait[a], kagalang-galang na Festo[b]. Sa halip, nagsasalita ako ng mga salitang totoo at matino[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi ako baliw.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kagalang-galang” ay isang pormal na pantawag sa isang mataas na opisyal.
    reason: cultural_note
  - marker: c
    text: O “mga salita ng katotohanan at katinuan” o “mga salitang totoo at nagmumula sa matinong pag-iisip.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig nito ang tuwirang pagsalungat ni Pablo sa paratang ni Festo sa naunang talata.
- source_word: μαίνομαι
  choice: nasisiraan ng bait
  rationale: Likas at makabagong pahayag ito para sa pagiging baliw o wala sa matinong pag-iisip, nang hindi gumagamit ng mapanlait o teknikal na katawagan.
- source_word: φησίν
  choice: sinabi
  rationale: Bagaman nasa kasalukuyang panahunan sa Griyego bilang historical present, mas natural sa salaysay na Tagalog ang pangnagdaan.
- source_word: κράτιστε
  choice: kagalang-galang
  rationale: Pinananatili nito ang magalang at pormal na pagtawag sa isang mataas na opisyal nang hindi nagdaragdag ng titulong wala sa teksto.
- source_word: ἀληθείας
  choice: totoo
  rationale: Natural nitong ipinahahayag sa Tagalog na ang mga salita ni Pablo ay may katangian ng katotohanan.
- source_word: σωφροσύνης
  choice: matino
  rationale: Sinasaklaw nito ang katinuan, mahinahong pag-iisip, at pagpipigil sa sarili na ipinahihiwatig ng pangngalang Griyego, lalo na bilang sagot sa paratang na siya ay baliw.
- source_word: ῥήματα
  choice: mga salita
  rationale: Tuwirang pinananatili ang kongkretong pangmaramihang pangngalan ng Griyego.
- source_word: ἀποφθέγγομαι
  choice: nagsasalita ako
  rationale: Malinaw at natural ito sa konteksto ng tuwirang tugon, habang iniiwasang labis na idiin ang pormal o maringal na paraan ng pagsasalita.
theological_decisions:
- issue: Ugnayan ng ἀληθείας at σωφροσύνης sa mga salita ni Pablo
  choice: mga salitang totoo at matino
  alternative: mga salita ng katotohanan at katinuan
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na katangian—katotohanan at katinuan—nang hindi ipinapakahulugang isa lamang ang tinutukoy o nilulutas nang higit sa teksto ang saklaw ng σωφροσύνη.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang magalang na pantawag na “kagalang-galang” at ang karaniwang idyomang “nasisiraan ng bait,” habang iniwasan ang arkayko, teknikal, o denominasyonal na pananalita.
