revisions:
- from: Kaya, yamang tumanggap ako ng tulong mula sa Diyos, nananatili ako hanggang sa araw na ito at nagpapatotoo sa hamak at sa dakila[a]. Wala akong sinasabing iba sa sinabi ng mga propeta at ni Moises na mangyayari[b].
  to: Kaya, yamang tumanggap ako ng tulong mula sa Diyos, nakatayo ako hanggang sa araw na ito, na nagpapatotoo sa mga hamak at mga dakila[a]. Wala akong sinasabing lampas sa sinabi ng mga propeta at ni Moises na mangyayari[b].
  rationale: Pinalitan ang “nananatili ako” ng “nakatayo ako” upang mas malapit na maipakita ang ἕστηκα at ang patuloy na kalagayang ipinahahayag ng perpekto. Pinalitan ang “iba sa” ng “lampas sa” upang malinaw na maipahayag ang ἐκτός bilang hangganan ng nilalaman ng patotoo ni Pablo, hindi lamang pagkakaiba nito. Inayos din ang mga pantukoy sa “mga hamak at mga dakila” upang tahasang tumukoy sa mga tao.
