  - severity: medium
    issue: Ang “Wala akong sinasabing iba sa” ay kulang sa lakas ng οὐδὲν ἐκτός.
    rationale: 'Maaaring mangahulugan ang “iba sa” na hindi magkapareho, samantalang ang Griyego ay naglilimita sa nilalaman: wala siyang sinasabing lampas sa o maliban sa mga bagay na inihula.'
