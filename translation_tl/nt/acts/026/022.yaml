  text: ἐπικουρίας οὖν τυχὼν τῆς ⸀ἀπὸ τοῦ θεοῦ ἄχρι τῆς ἡμέρας ταύτης ἕστηκα μαρτυρόμενος μικρῷ τε καὶ μεγάλῳ, οὐδὲν ἐκτὸς λέγων ὧν τε οἱ προφῆται ἐλάλησαν μελλόντων γίνεσθαι καὶ Μωϋσῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/022.yaml
  text: Therefore[a], having received the help that is from God, I stand to this day, testifying to both small and great, saying nothing except what both the prophets and Moses said was going to happen[c][b],
translation:
  language: tl
  text: Kaya, yamang tumanggap ako ng tulong mula sa Diyos, nakatayo ako hanggang sa araw na ito, na nagpapatotoo sa mga hamak at mga dakila[a]. Wala akong sinasabing lampas sa sinabi ng mga propeta at ni Moises na mangyayari[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga hamak at mga dakila” ay tumutukoy sa mga tao anuman ang kanilang katayuan sa lipunan.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “Wala akong sinasabing maliban sa sinabi ng mga propeta at ni Moises na mangyayari.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικουρίας ... τυχὼν τῆς ἀπὸ τοῦ θεοῦ
  choice: yamang tumanggap ako ng tulong mula sa Diyos
  rationale: Ang ἐπικουρία ay tulong o saklolo, at ang τυγχάνω rito ay nangangahulugang tumanggap o nagtamo. Natural sa makabagong Tagalog ang pariralang ito at malinaw na pinananatili ang Diyos bilang pinagmulan ng tulong.
- source_word: ἄχρι τῆς ἡμέρας ταύτης ἕστηκα
  choice: nananatili ako hanggang sa araw na ito
  rationale: Ang perpektong ἕστηκα ay nagpapahayag ng kasalukuyang kalagayang bunga ng naunang pagkakatayo. Sa konteksto, ang “nananatili ako” ay natural at hindi kailangang ipakahulugang literal na pisikal na pagtayo.
- source_word: μαρτυρόμενος
  choice: nagpapatotoo
  rationale: Pinananatili nito ang diwa ng patuloy na pagbibigay-saksi at ang posibleng legal na kulay ng salita sa konteksto ng pagtatanggol ni Pablo.
- source_word: μικρῷ τε καὶ μεγάλῳ
  choice: sa hamak at sa dakila
  rationale: Pinananatili ang balanseng idyoma ng Griyego habang ipinahihiwatig ang mga taong mababa at mataas ang katayuan, sa halip na laki o edad.
- source_word: οὐδὲν ἐκτὸς λέγων ὧν
  choice: Wala akong sinasabing iba sa
  rationale: Natural itong katumbas ng pagsasabing walang nilalampasan o idinaragdag sa nilalaman ng naunang pahayag. Ang alternatibong “walang sinasabi maliban sa” ay posible rin.
- source_word: οἱ προφῆται ἐλάλησαν ... καὶ Μωϋσῆς
  choice: sinabi ng mga propeta at ni Moises
  rationale: Sinusunod ang ayos ng Griyego at malinaw na kapuwa ang mga propeta at si Moises ang pinagmumulan ng pahayag.
- source_word: μελλόντων γίνεσθαι
  choice: na mangyayari
  rationale: Ipinapahayag nito ang hinaharap na pangyayari mula sa pananaw ng mga nagsalita nang hindi ipinipilit ang agarang pagdating o isang partikular na uri ng pagtupad.
theological_decisions:
- issue: Saklaw ng pahayag ni Pablo tungkol sa pagpapatuloy ng kanyang patotoo sa Kasulatan ng Israel
  choice: Ipinapahayag ni Pablo na wala siyang sinasabing iba sa sinabi ng mga propeta at ni Moises na mangyayari.
  alternative: Maaaring unawain bilang pagsasabing hindi siya lumalampas sa sinabi ng mga propeta at ni Moises.
  rationale: Pinananatili ng salin ang matibay na pag-aangkin ng pagpapatuloy sa naunang kapahayagan, ngunit hindi nito tinutukoy nang higit sa teksto kung gaano kadetalye ang kaugnayan ng bawat pangyayari sa mga propesiya.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “hamak at dakila” upang mapanatili ang retorikal na pares ngunit maiwasan ang maling pagbasa na tumutukoy ito sa pisikal na laki o edad. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
