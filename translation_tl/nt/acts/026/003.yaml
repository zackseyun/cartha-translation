base_translation:
  language: en
  yaml_path: translation/nt/acts/026/003.yaml
  text: especially because you are knowledgeable about all the customs and disputes among the Jews[b][a]. Therefore I beg you to listen to me patiently.
translation:
  language: tl
  text: lalo na dahil lubos kayong nakaaalam sa lahat ng kaugalian at mga usaping pinagtatalunan sa mga Judio.[a] Kaya nakikiusap ako sa inyo[b] na matiyaga ninyo akong pakinggan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng kaugalian at mga usaping pinagtatalunan ng mga Judio.”
    reason: lexical_alternative
  - marker: b
    text: O “hinihiling ko sa inyo”; ang pandiwang Griyego ay nagpapahayag ng taimtim na pakiusap.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάλιστα
  choice: lalo na dahil
  rationale: Pinaiigting nito ang dahilan ng pagtitiwala ni Pablo sa pagharap kay Agripa; likas sa Tagalog ang tahasang pagpapahayag ng ugnayang sanhi.
- source_word: γνώστην ὄντα σε
  choice: lubos kayong nakaaalam
  rationale: Ipinakikitang pamilyar at may malalim na kaalaman si Agripa sa mga bagay na ito, nang hindi siya tinatawag na teknikal na eksperto.
- source_word: πάντων τῶν κατὰ Ἰουδαίους ἐθῶν
  choice: lahat ng kaugalian ... sa mga Judio
  rationale: Pinananatili ang saklaw na ipinahihiwatig ng κατὰ Ἰουδαίους at iniiwasang gawing mas tiyak kaysa sa Griyego.
- source_word: ζητημάτων
  choice: mga usaping pinagtatalunan
  rationale: Sa kontekstong legal, tumutukoy ito sa mga tanong o usaping pinagtatalunan, hindi lamang sa neutral na mga paksa.
- source_word: διὸ
  choice: Kaya
  rationale: Malinaw at natural na naghahayag ng konklusyon o bunga sa modernong Tagalog.
- source_word: δέομαι
  choice: nakikiusap ako sa inyo
  rationale: Nagpapahayag ng taimtim na pakiusap nang hindi gumagamit ng labis na matindi o makalumang pananalita.
- source_word: μακροθύμως
  choice: matiyaga
  rationale: Hinihiling ni Pablo ang isang mapagpasensiyang pakikinig; tuwiran at natural ito sa Tagalog.
- source_word: ἀκοῦσαί μου
  choice: ninyo akong pakinggan
  rationale: Tumpak na ipinahahayag ang aktibong pakikinig sa nagsasalita nang hindi idinaragdag ang di-tahasang diwang ‘hanggang matapos.’
