translation:
  language: tl
  text: Inililigtas kita mula sa bayan[a] at sa mga Hentil; sa kanila kita isinusugo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bayang Judio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαιρούμενός
  choice: habang inililigtas
  rationale: Ipinahahayag ng pangkasalukuyang middle participle ang pagkilos ni Jesus na iligtas o sagipin si Pablo. Likas sa modernong Tagalog ang “habang inililigtas” at pinananatili nito ang ugnayan sa pangunahing pandiwa sa konteksto.
- source_word: τοῦ λαοῦ
  choice: sa bayan
  rationale: Sa paghahambing sa “mga Hentil,” tumutukoy ito sa bayang Judio o Israel. Pinananatili ng “bayan” ang payak na salita ng Griyego nang hindi inilalagay sa pangunahing teksto ang ipinahiwatig na pagkakakilanlan nito.
- source_word: τῶν ἐθνῶν
  choice: sa mga Hentil
  rationale: Sa kontekstong Judio at di-Judio sa Mga Gawa, karaniwang tumutukoy ang ἔθνη sa mga hindi Judio; malinaw at natural itong ipinahahayag ng “mga Hentil.”
- source_word: εἰς οὓς
  choice: na pagsusuguan ko sa iyo
  rationale: Pagkatapos ng pandiwa ng pagsusugo, ang εἰς οὓς ay natural na tumutukoy sa mga taong patutunguhan ng isinugo. Ginagamit ang pang-ugnay na “na” upang maging malinaw at maayos ang Tagalog.
- source_word: ἀποστέλλω
  choice: pagsusuguan ko
  rationale: Ipinahahayag ng anyong ito ang kasalukuyang pagkakaloob ng atas at ang mga Hentil bilang patutunguhan ng pagsusugo. Ang “susuguin kita sa kanila” ay posible rin, ngunit ang “pagsusuguan ko sa iyo” ay mas malapit sa ayos ng sugnay nang hindi nagiging di-natural.
theological_decisions:
- issue: Ang tinutukoy ng “bayan” na inihahambing sa “mga Hentil”
  choice: Pinanatili sa pangunahing teksto ang “bayan,” na sa konteksto ay tumutukoy sa bayang Judio.
  alternative: “bayang Judio” o “Israel”
  rationale: Malakas na ipinahihiwatig ng paghahambing na mga Judio ang tinutukoy, ngunit λαός lamang ang nasa Griyego. Pinananatili ng salin ang anyo at bahagyang pahiwatig ng orihinal, habang nililinaw sa talababa ang kontekstuwal na kahulugan.
- issue: Saklaw ng pagliligtas kay Pablo
  choice: Ipinakikitang ililigtas siya kapuwa mula sa bayan at mula sa mga Hentil.
  alternative: Unawain ang ἐξαιρούμενος bilang “pinipili o kinukuha mula sa” mga pangkat na ito.
  rationale: Sa konteksto ng mga panganib na haharapin ni Pablo, mas angkop ang kahulugang “ililigtas,” ngunit hindi nito inaalis ang kaugnay na diwa ng pagkuha sa kaniya mula sa kanilang kapangyarihan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Hentil” bilang karaniwang terminong biblikal para sa mga hindi Judio, at pinanatili ang “bayan” upang huwag labis na linawin ang λαός sa pangunahing teksto.
