id: ACT.26.18
reference: Acts 26:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν, τοῦ ⸀ἐπιστρέψαι ἀπὸ σκότους εἰς φῶς καὶ τῆς ἐξουσίας τοῦ Σατανᾶ ἐπὶ τὸν θεόν, τοῦ λαβεῖν αὐτοὺς ἄφεσιν ἁμαρτιῶν καὶ κλῆρον ἐν τοῖς ἡγιασμένοις πίστει τῇ εἰς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/018.yaml
  text: to open their eyes[a], so that they may turn from darkness to light and from the authority of Satan to God[b], that they may receive forgiveness of sins and an inheritance among those who have been sanctified by faith in me.
translation:
  language: tl
  text: upang buksan ang kanilang mga mata, upang sila’y bumaling mula sa kadiliman tungo sa liwanag at mula sa kapangyarihan ni Satanas[a] tungo sa Diyos, upang matanggap nila ang kapatawaran ng mga kasalanan at ang mana sa piling ng mga pinabanal[b] sa pamamagitan ng pananampalataya sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “awtoridad ni Satanas” o “paghahari ni Satanas.” Ang salitang Griyego ay maaaring tumukoy sa awtoridad, kapangyarihang mamahala, o sakop ng paghahari.
    reason: lexical_alternative
  - marker: b
    text: O “mga ginawang banal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν
  choice: upang buksan ang kanilang mga mata
  rationale: Pinananatili ang kongkretong larawan ng pagbubukas ng mga mata, na ginagamit dito bilang talinghaga ng espirituwal na pagkakita.
- source_word: τοῦ ἐπιστρέψαι
  choice: upang sila’y bumaling
  rationale: Ipinahahayag ang layunin ng infinitive at pinananatili ang aktibong larawan ng pagbabago ng direksiyon nang hindi ito pinalalakas bilang teknikal na terminong panrelihiyon.
- source_word: ἀπὸ σκότους εἰς φῶς
  choice: mula sa kadiliman tungo sa liwanag
  rationale: Likas at malinaw sa Tagalog habang tapat na pinananatili ang mahalagang paghahambing sa orihinal.
- source_word: τῆς ἐξουσίας τοῦ Σατανᾶ
  choice: mula sa kapangyarihan ni Satanas
  rationale: Maaaring tumukoy ang ἐξουσία sa kapangyarihan, awtoridad, o sakop ng pamamahala. Ang “kapangyarihan” ang pinakanatural sa kasalukuyang Tagalog, habang inilalahad sa talababa ang ibang himig ng salita.
- source_word: ἐπὶ τὸν θεόν
  choice: tungo sa Diyos
  rationale: Ipinakikita ang paglipat ng direksiyon at katapatan patungo sa Diyos, kasabay ng naunang pariralang “mula sa.”
- source_word: τοῦ λαβεῖν αὐτοὺς
  choice: upang matanggap nila
  rationale: Ipinahahayag ang kasunod na layunin at ang pagtanggap sa mga biyayang ipinagkakaloob.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: kapatawaran ng mga kasalanan
  rationale: Ito ang malinaw, karaniwan, at tumpak na katumbas sa modernong Tagalog.
- source_word: κλῆρον
  choice: ang mana
  rationale: Sa kontekstong ito, tumutukoy ang κλῆρος sa bahaging inilaan sa bayan ng Diyos; mahusay na naihahatid ng “mana” ang tipan at panghinaharap na diwa nito.
- source_word: ἐν τοῖς ἡγιασμένοις
  choice: sa piling ng mga pinabanal
  rationale: Ang “sa piling” ay natural na nagpapahayag ng pagiging kabilang sa kanila, at pinananatili ng “mga pinabanal” ang perpektong pasibong diwa ng isang naganap na pagkilos na may nagpapatuloy na kalagayan.
- source_word: πίστει τῇ εἰς ἐμέ
  choice: sa pamamagitan ng pananampalataya sa akin
  rationale: Ipinahahayag ng “sa pamamagitan ng” ang instrumental na gamit ng dative, at malinaw na si Jesus ang pinagtutuunan ng pananampalataya.
theological_decisions:
- issue: Kahulugan ng ἐπιστρέψαι sa atas
  choice: upang sila’y bumaling
  alternative: upang ibaling sila
  rationale: Maaaring unawain ang infinitive kaugnay ng gawain ng isinugo o ng pagtugon ng mga tao. Pinipili ng salin ang natural na aktibong pagtugon ng “sila” nang hindi itinatanggi na ang pagbaling ay bunga ng atas at pagbubukas ng kanilang mga mata.
- issue: Paglalarawan sa impluwensiya ni Satanas
  choice: kapangyarihan ni Satanas
  alternative: awtoridad ni Satanas; paghahari ni Satanas
  rationale: Hindi nilulutas ng salin kung ang ἐξουσία ay pangunahing tumutukoy sa karapatang mamahala, aktuwal na kapangyarihang mamuno, o sakop ng paghahari; inilalahad ang mga posibleng himig sa talababa.
- issue: πίστις sa πίστει τῇ εἰς ἐμέ
  choice: pananampalataya sa akin
  alternative: pagtitiwala sa akin
  rationale: Tuwirang tinutukoy ng εἰς ἐμέ si Jesus bilang layon ng pananampalataya. Ang “pananampalataya” ay tumpak at kinikilalang terminong biblikal nang hindi nagdaragdag ng denominasyonal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang magkakatugmang larawang “mula… tungo…” at iniwasan ang labis na teknikal o denominasyonal na pananalita. Itinama ang pagkakalagay ng mga marker upang tumapat ang bawat talababa sa salitang ipinaliliwanag nito.
