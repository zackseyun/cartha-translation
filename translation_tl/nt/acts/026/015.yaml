  text: ἐγὼ δὲ εἶπα· Τίς εἶ, κύριε; ὁ δὲ ⸀κύριος εἶπεν· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/015.yaml
  text: And I said[a], ‘Who are you, Lord?’ And the Lord said, ‘I am Jesus, whom you are persecuting.’
translation:
  language: tl
  text: At sinabi ko, “Sino po kayo, Panginoon?”[a] At sinabi ng Panginoon, “Ako si Jesus na iyong inuusig.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Sino po kayo, ginoo?” Ang Griegong κύριε ay maaaring gamitin bilang magalang na pantawag, ngunit “Panginoon” ang ginamit dito sapagkat agad na nagpakilala ang nagsasalita bilang si Jesus sa makalangit na pagpapakitang ito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ εἶπα
  choice: At sinabi ko
  rationale: Ang δέ ay banayad na pang-ugnay sa daloy ng salaysay; natural itong isinalin na “At.” Hindi kailangang dagdagan ang diin sa ἐγώ sapagkat malinaw na ang “ko.”
- source_word: Τίς εἶ, κύριε;
  choice: Sino po kayo, Panginoon?
  rationale: Tuwirang katumbas ng τίς εἶ ang “Sino ... kayo?” Ipinahihiwatig ng “po” at “kayo” ang magalang na pagtawag, habang pinananatili ng “Panginoon” ang κύριε at ang bigat ng makalangit na pagpapakita.
- source_word: ὁ δὲ κύριος εἶπεν
  choice: At sinabi ng Panginoon
  rationale: Ang κύριος ay “Panginoon,” at ang artikulo ay tumutukoy sa nakilala nang nagsasalita. Ang δέ ay muling ginawang payak na “At” para sa likas na daloy.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: Ako si Jesus
  rationale: Ito ang natural at tuwirang paraan sa Tagalog ng pagpapakilala sa sarili. Sapat na naipapahayag ng “Ako” ang ἐγώ nang hindi nagdaragdag ng hindi tiyak na diin.
- source_word: ὃν σὺ διώκεις
  choice: na iyong inuusig
  rationale: Ang διώκεις ay kasalukuyang pag-uusig na nagpapatuloy. Natural na ipinapahayag ito ng “inuusig,” at pinananatili ng “iyong” ang tahasang σὺ nang hindi labis na binibigyang-diin.
theological_decisions:
- issue: Pagpapakahulugan sa κύριε sa tanong ni Pablo at sa κύριος bilang pagkilala sa nagsasalita
  choice: Panginoon
  alternative: ginoo
  rationale: Maaaring maging magalang na pantawag lamang ang κύριε, ngunit sa konteksto ng makalangit na pagpapakita at agarang pagpapakilala ng nagsasalita bilang si Jesus, ang “Panginoon” ang higit na angkop sa pangunahing teksto. Gayunman, pinananatili sa talababa ang tunay na leksikal na posibilidad na “ginoo.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “po/kayo” upang natural na maipakita ang paggalang sa pantawag na κύριε, nang hindi inaalis ang posibleng kahulugang “ginoo” na nakatala sa talababa.
