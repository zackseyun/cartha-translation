  source_fidelity: Kailangang alisin ang “ilang,” sapagkat walang katumbas nito sa ὑπὸ Ἰουδαίων; sapat na ang talababa upang ipaliwanag ang tiyak na legal na konteksto. Mas malapit din sa περὶ ἧς ἐλπίδος ang “Tungkol sa pag-asang ito” kaysa “Dahil sa pag-asang ito,” na pinananatili ang saklaw na ambiguity ng περί.
  naturalness: Ang binagong ayos na “na inaasahan ng ating bayan ... na makamit” ay mas malinaw sa modernong Tagalog kaysa sa maaaring malabong “na inaasahang makamit ng ...”. Ang “O Hari” ay tuwirang, marangal na bokatibo at hindi nagdaragdag ng konotasyong “mahal/dear.”
  terminology: Pinananatili ang “bayang binubuo ng labindalawang lipi” para sa kolektibong pang-isahan na τὸ δωδεκάφυλον, “paglilingkod sa Diyos” para sa λατρεύω, at “Judio” para sa Ἰουδαῖοι. Ang talababa tungkol sa mga Judio ay kontekstuwal na paglilinaw, hindi batayan upang magdagdag ng “ilang” sa pangunahing teksto.
  issues:
  - severity: medium
    issue: Idinagdag ang “ilang” sa “ng ilang Judio.”
    rationale: Anarthrous ang Ἰουδαίων ngunit hindi nito ipinahihiwatig ang “ilang.” Ang legal na konteksto ay maaaring ipaliwanag sa talababa nang hindi nililimitahan ang pangunahing teksto sa salitang wala sa pinagmulan.
  - severity: medium
    issue: Ang “Dahil sa pag-asang ito” ay pinipili ang sanhi bilang tanging kahulugan ng περὶ ἧς ἐλπίδος.
    rationale: Ang περί na may henitibo ay pangunahing “tungkol sa/concerning”; maaaring umabot sa sanhi sa konteksto, ngunit ang “Tungkol sa” ay mas malapit at mas maingat sa ambiguity ng Griyego.
  - severity: low
