  text: εἰς ἣν τὸ δωδεκάφυλον ἡμῶν ἐν ἐκτενείᾳ νύκτα καὶ ἡμέραν λατρεῦον ἐλπίζει καταντῆσαι· περὶ ἧς ἐλπίδος ἐγκαλοῦμαι ⸂ὑπὸ Ἰουδαίων, βασιλεῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/007.yaml
  text: to which our twelve tribes hope to attain[a], as they earnestly serve God night and day. It is concerning this hope that I am accused by the Jews[c][b], O king.
translation:
  language: tl
  text: na inaasahan ng ating bayang binubuo ng labindalawang lipi[a] na makamit, sa taimtim nilang paglilingkod sa Diyos gabi at araw. Tungkol sa pag-asang ito, ako ay inaakusahan ng mga Judio[c], O Hari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ng ating labindalawang lipi.” Kolektibong pang-isahan ang salitang Griyego at tumutukoy sa Israel bilang bayang binubuo ng labindalawang lipi.
    reason: lexical_alternative
  - marker: b
    text: Literal na “O hari.”
    reason: lexical_alternative
  - marker: c
    text: Literal na “ng mga Judio.” Sa legal na konteksto, tumutukoy ito sa mga Judiong nag-aakusa kay Pablo, hindi sa lahat ng Judio.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν
  choice: na ... makamit
  rationale: Iniuugnay ang panghalip sa pangako sa naunang talata at pinananatili ang diwa ng layuning inaasahang marating o makamit.
- source_word: τὸ δωδεκάφυλον ἡμῶν
  choice: ating bayang binubuo ng labindalawang lipi
  rationale: Ang salitang Griyego ay kolektibong pang-isahan para sa Israel bilang bayang may labindalawang lipi; natural itong ipinahahayag sa modernong Tagalog bilang isang bayan, hindi lamang bilang labindalawang magkakahiwalay na pangkat.
- source_word: ἐν ἐκτενείᾳ
  choice: taimtim
  rationale: Ipinahahayag ang masidhi at matiyagang debosyon sa maikli at likas na paraang Tagalog.
- source_word: νύκτα καὶ ἡμέραν
  choice: gabi at araw
  rationale: Pinananatili ang ayos ng Griyego at ang idyomatikong diwa ng patuloy na paglilingkod.
- source_word: λατρεῦον
  choice: naglilingkod sa Diyos
  rationale: Ang pandiwa ay tumutukoy sa relihiyosong paglilingkod o pagsamba. Nilinaw ang ipinahihiwatig na layon na Diyos, gaya ng hinihingi ng konteksto.
- source_word: ἐλπίζει καταντῆσαι
  choice: inaasahang makamit
  rationale: Ipinahahayag ang pag-asang makarating sa katuparan ng pangako; natural ang 'makamit' sa kaugnayan nito.
- source_word: περὶ ἧς ἐλπίδος
  choice: Dahil sa pag-asang ito
  rationale: Sa legal na konteksto, maaaring ipahayag ng περί ang paksa o batayan ng paratang. Ang 'dahil sa' ay malinaw at natural habang nananatiling nakaugnay sa pag-asang nabanggit.
- source_word: ἐγκαλοῦμαι
  choice: ako ay inaakusahan
  rationale: Pinananatili ang pasibong legal na diwa ng pandiwa sa malinaw na modernong Tagalog.
- source_word: ὑπὸ Ἰουδαίων
  choice: ng ilang Judio
  rationale: Bagaman literal na 'ng mga Judio,' ang parirala sa kontekstong legal ay tumutukoy sa mga Judiong nag-aakusa kay Pablo, hindi sa lahat ng Judio. Ang 'ilang' ay kontekstuwal na paglilinaw, at inilalahad sa talababa ang mas literal na anyo.
- source_word: βασιλεῦ
  choice: Mahal na Hari
  rationale: Isang natural at magalang na tuwirang pantawag sa hari sa modernong Tagalog, na pinananatili ang retorikal na puwersa ng bokatibo.
theological_decisions:
- issue: Ipinahihiwatig na layon ng λατρεῦον
  choice: naglilingkod sa Diyos
  alternative: sumasamba; naglilingkod
  rationale: Hindi tahasang nakasulat ang 'Diyos' sa sugnay na Griyego, ngunit sa konteksto ng patuloy na banal na paglilingkod ng Israel, siya ang likas na layon. Nililinaw ito nang hindi nagdaragdag ng bagong teolohikong pahayag.
- issue: Tinutukoy ng pag-asa
  choice: Iniugnay sa pangako sa naunang talata nang hindi tahasang pinangalanan dito ang pagkabuhay na muli
  alternative: Tahasan itong tawaging pag-asa sa pagkabuhay na muli
  rationale: Hindi inuulit ng talatang ito ang nilalaman ng pangako. Kaya pinananatili ang ugnayan at teolohikong tensiyon ng konteksto nang hindi dinaragdagan ang mismong talata.
- issue: Saklaw ng Ἰουδαίων
  choice: ng ilang Judio
  alternative: ng mga Judio
  rationale: Ang legal na konteksto ay tumutukoy sa mga aktuwal na nag-aakusa, hindi sa lahat ng Judio. Iniiwasan ng salin ang di-sinasadyang pangkalahatang paratang habang pinananatili sa talababa ang mas literal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'bayang binubuo ng labindalawang lipi' upang mapanatili ang kolektibong pang-isahan; 'taimtim' para sa masidhing debosyon; at 'Mahal na Hari' bilang likas na magalang na pantawag.
