base_translation:
  language: en
  yaml_path: translation/nt/acts/026/024.yaml
  text: As he was saying these things in his defense[a], Festus said with a loud voice, “You are out of your mind, Paul! Your great learning is driving you into madness.”
translation:
  language: tl
  text: Habang sinasabi ni Pablo ang mga ito sa kanyang pagtatanggol, malakas na sinabi ni Festo, “Wala ka sa katinuan, Pablo! Ang malawak mong kaalaman ay itinutulak ka tungo sa kabaliwan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: bilang pagtatanggol sa sarili
  rationale: Ipinahihiwatig ng genitive absolute ang kasabay na kilos, at pinananatili ng parirala ang legal at pasalitang diwa ng pagbibigay ni Pablo ng depensa.
- source_word: μεγάλῃ τῇ φωνῇ
  choice: malakas na sinabi
  rationale: Likas itong pagpapahayag sa modernong Tagalog ng paraan ng pagsasalita at malinaw na ipinakikitang malakas ang pagsabad ni Festo.
- source_word: φησιν
  choice: sinabi
  rationale: Bagaman historical present ang Griyego, mas natural sa salaysay na Tagalog ang pangnagdaan.
- source_word: Μαίνῃ
  choice: Nababaliw ka na
  rationale: Malinaw at kasalukuyang Tagalog ito para sa paratang na nawawala sa katinuan si Pablo; ang “na” ay natural na nagpapahiwatig ng inaakalang pag-abot sa ganitong kalagayan.
- source_word: τὰ πολλά ... γράμματα
  choice: ang napakalawak mong pinag-aralan
  rationale: Sa konteksto, ang γράμματα ay tumutukoy sa malawak na pag-aaral o kaalaman, hindi lamang sa mga literal na titik o kasulatan.
- source_word: εἰς μανίαν περιτρέπει
  choice: nagtutulak sa iyo sa kabaliwan
  rationale: Pinananatili nito ang sanhi at direksiyon tungo sa isang kalagayan na ipinahihiwatig ng περιτρέπει at εἰς.
