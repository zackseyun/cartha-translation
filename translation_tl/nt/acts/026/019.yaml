  yaml_path: translation/nt/acts/026/019.yaml
  text: Therefore[a], King Agrippa, I was not disobedient to the heavenly vision,
translation:
  language: tl
  text: Kaya, Haring Agripa, hindi ko sinuway ang makalangit na pangitain,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pangitaing mula sa langit.”
    reason: Ipinapakita ang alternatibong pagbasa sa οὐρανίῳ bilang tahasang pagtukoy sa pinagmulan ng pangitain.
lexical_decisions:
- source_word: Ὅθεν
  choice: Kaya
  rationale: Nagpapahayag ito ng kongklusyon o tugon batay sa naunang salaysay tungkol sa pagpapakita at utos kay Pablo. Likas at malinaw sa makabagong Tagalog ang “Kaya.”
- source_word: βασιλεῦ Ἀγρίππα
  choice: Haring Agripa
  rationale: Tuwirang pagtawag ito kay Agripa gamit ang kaniyang titulo. Ang “Haring Agripa” ang natural at marangal na anyo sa Tagalog.
- source_word: οὐκ ἐγενόμην ἀπειθὴς
  choice: hindi ko sinuway
  rationale: Ang parirala ay idiomatikong nagsasaad na hindi tumanggi si Pablo na sumunod. Mas natural sa Tagalog ang pandiwang “hindi ko sinuway” kaysa sa literal ngunit mabigat na “hindi ako naging masuwayin,” habang pinananatili ang kusang pagsunod na ipinahihiwatig ng ἀπειθής.
- source_word: τῇ οὐρανίῳ ὀπτασίᾳ
  choice: ang makalangit na pangitain
  rationale: Ang ὀπτασία ay isang di-pangkaraniwang nakitang pagpapakita o pangitain, at maaaring tukuyin ng οὐρανίῳ ang pinagmulan o katangian nito. Pinananatili ng “makalangit na pangitain” ang dalawang posibilidad.
theological_decisions:
- issue: Kalikasan ng naranasan ni Pablo sa daan patungong Damasco
  choice: pangitain
  alternative: pagpapakita; pahayag mula sa langit
  rationale: Pinakamalapit na tumutukoy ang ὀπτασία sa isang pangitain o pagpapakita. Hindi ipinapaliwanag nang higit sa sinasabi ng talata ang tiyak na paraan ng karanasang ito.
- issue: Kahulugan ng οὐρανίῳ
  choice: makalangit
  alternative: mula sa langit
  rationale: Maaaring tumukoy ang pang-uri sa pinagmulan ng pangitain o sa makalangit nitong katangian. Pinananatili ng pangunahing salin ang saklaw na ito, at inilalagay sa talababa ang mas tiyak na pagbasa tungkol sa pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sinuway” upang maging likas sa karaniwang mambabasa nang hindi pinahihina ang diwa ng pagsunod sa banal na atas.
