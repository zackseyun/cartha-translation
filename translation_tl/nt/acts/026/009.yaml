  text: Ἐγὼ μὲν οὖν ἔδοξα ἐμαυτῷ πρὸς τὸ ὄνομα Ἰησοῦ τοῦ Ναζωραίου δεῖν πολλὰ ἐναντία πρᾶξαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/009.yaml
  text: So I myself indeed thought that I ought to do many things in opposition to the name of Jesus the Nazarene[a].
translation:
  language: tl
  text: Kaya ako mismo ay nag-akala na dapat akong gumawa ng maraming bagay na laban sa pangalan ni Jesus na Nazareno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “laban sa pangalan ni Jesus na taga-Nazaret.”
    reason: Pinananatili ng alternatibo ang posibleng pag-unawa sa Ναζωραῖος bilang katawagang batay sa pinagmulan ni Jesus sa Nazaret.
lexical_decisions:
- source_word: Ἐγὼ
  choice: ako mismo
  rationale: Hayag at madiin ang panghalip sa Griyego; pinananatili ng “ako mismo” ang personal na diin sa pag-amin ni Pablo.
- source_word: μὲν οὖν
  choice: Kaya
  rationale: Ipinagpapatuloy nito ang pangangatwiran at iniuugnay ang pahayag sa naunang sinabi. Hindi likas sa Tagalog na tumbasan nang hiwalay ang dalawang partikulo; naihahatid ng “Kaya” ang pangunahing ugnayan nang hindi mabigat.
- source_word: ἔδοξα ἐμαυτῷ
  choice: nag-akala noon
  rationale: Ipinapahayag ng idyoma ang sariling dating pasya o paniniwala ni Pablo. Ang “nag-akala” ay natural at nagpapahiwatig na kinikilala na niyang mali ang dating palagay; idinagdag ang “noon” upang malinaw ang dating pananaw na likas sa konteksto at panahunan.
- source_word: πρὸς τὸ ὄνομα
  choice: laban sa pangalan
  rationale: Kasama ng ἐναντία at πρᾶξαι, adversatibo ang πρός. Natural sa Tagalog ang “laban sa,” habang pinananatili ang idyomang “pangalan.”
- source_word: ὄνομα
  choice: pangalan
  rationale: Pinananatili ang biblikal na idyoma at ang lawak ng kahulugan nito—ang taong tinutukoy, kanyang pagkakakilanlan, dangal, o awtoridad—nang hindi ito nililimitahan sa iisang paliwanag.
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: Jesus na Nazareno
  rationale: Ang “Nazareno” ay maikli, kinikilalang katawagan sa modernong Filipino, at pinananatili ang anyong pantukoy o titulo ng Griyego.
- source_word: δεῖν
  choice: dapat akong
  rationale: Ipinahahayag nito ang obligasyong inakala ni Pablo na nararapat niyang tuparin, hindi kinakailangang isang panlabas na pamimilit.
- source_word: πολλὰ ἐναντία πρᾶξαι
  choice: gumawa ng maraming bagay laban
  rationale: Pinananatili nito kapwa ang dami ng mga ginawa at ang salungat o mapanlabang direksiyon ng mga iyon, nang hindi nagdaragdag ng espesipikong mga gawa na wala sa talata.
theological_decisions:
- issue: Kahulugan ng “pangalan” kaugnay ni Jesus
  choice: Panatilihin ang idyomang “pangalan.”
  alternative: “awtoridad ni Jesus” o “adhikain ni Jesus”
  rationale: Hindi nililimitahan ng teksto ang “pangalan” sa awtoridad o adhikain lamang. Ang literal ngunit natural na salin ay nagpapanatili sa biblikal at teolohikal na lawak ng pahayag.
- issue: Katangian ng nadamang pangangailangan ni Pablo
  choice: “dapat akong” bilang sarili niyang dating paghuhusga
  alternative: “kinailangan kong” bilang mas malakas o panlabas na pamimilit
  rationale: 'Ang δεῖν ay nakapaloob sa ἔδοξα ἐμαυτῷ: ito ang inakala ni Pablo na nararapat niyang gawin. Hindi sinasabi ng teksto na talagang iniutos o ipinataw ng Diyos ang pangangailangang iyon.'
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “Nazareno” bilang pamilyar na katawagan, habang inilagay sa talababa ang mas hayag na heograpikong alternatibo. Ang “noon” ay natural na paglilinaw sa dating pananaw ni Pablo at hindi nagbabago sa diwa ng aorist na ἔδοξα.
