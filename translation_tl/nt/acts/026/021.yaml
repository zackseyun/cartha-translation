  naturalness: 'Natural at marangal sa modernong Filipino Tagalog ang: “Dahil sa mga bagay na ito, dinakip ako ng mga Judio sa templo at tinangka nilang patayin ako.” Maayos ang aspekto ng “tinangka,” bagaman hindi nito ganap na minamarkahan ang imperpektong “were trying”; sapat ito sa idiomatikong Tagalog sa kontekstong ito.'
