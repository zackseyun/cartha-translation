base_translation:
  language: en
  yaml_path: translation/nt/acts/026/021.yaml
  text: Because of these things the Jews seized me in the temple and were trying to kill me[a][b].
translation:
  language: tl
  text: Dahil sa mga bagay na ito, dinakip ako ng mga Judio sa templo[a] at tinangka nilang patayin ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego rito ay tumutukoy sa buong bakuran o kompleks ng templo, hindi lamang sa panloob na santuwaryo.
    reason: cultural_note
lexical_decisions:
- source_word: ἕνεκα τούτων
  choice: Dahil dito
  rationale: Ipinahahayag ng ἕνεκα na may dahilan o sanhi at itinuturo ng τούτων ang mga naunang sinabi ni Pablo. Likas sa modernong Tagalog ang “Dahil dito” at hindi nito nililimitahan kung isang dahilan o magkakaugnay na bagay ang tinutukoy.
- source_word: με
  choice: ako
  rationale: Tuwirang layon ito ng participleng συλλαβόμενοι; hinihingi ng natural na balangkas sa Tagalog ang panghalip na “ako” pagkatapos ng “dinakip.”
- source_word: Ἰουδαῖοι
  choice: ng ilang Judio
  rationale: Ang artikulong οἱ sa tekstong Griyego ay tumutukoy sa mga Judiong sangkot sa pangyayari, hindi sa lahat ng Judio. Idinagdag ang “ilang” upang maiwasan ang di-sinasadyang paglalahat sa Tagalog habang pinananatili ang historikal na pagkakakilanlan ng grupo.
- source_word: συλλαβόμενοι
  choice: dinakip
  rationale: Nangangahulugan itong sunggaban o dakpin. Ang “dinakip” ay malinaw at angkop sa marahas na konteksto, bagaman hindi nito kailangang ipahiwatig na legal o opisyal ang pagdakip.
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Ang ἱερόν ay tumutukoy sa buong bakuran o kompleks ng templo, hindi lamang sa panloob na santuwaryo. Ang “sa templo” ang natural na pangunahing salin, na nililinaw sa talababa.
- source_word: ἐπειρῶντο
  choice: tinangka nilang
  rationale: Ang imperpektong anyo ay naglalarawan ng pagtatangkang hindi natupad. Natural sa Tagalog ang “tinangka nilang”; naipahihiwatig ng konteksto at ng pandiwa ang pagsisikap na gawin ito.
- source_word: διαχειρίσασθαι
  choice: patayin
  rationale: Sa kontekstong ito, nangangahulugan ang pandiwa na kitlin ang buhay o marahas na lipulin. Ang “patayin” ay tuwiran at hindi nagdaragdag ng legal na hatol na maaaring ipahiwatig ng “paslangin.”
theological_decisions:
- issue: Ang saklaw ng “Ἰουδαῖοι” sa sensitibong kontekstong polemikal
  choice: “ilang Judio,” bilang pagtukoy sa mga partikular na Judiong dumakip kay Pablo
  alternative: “ang mga Judio”
  rationale: Pinangangalagaan nito ang historikal na tinutukoy nang hindi ipinapalagay na lahat ng Judio ay kasama. Bagaman walang katumbas na salita ang “ilang” sa Griyego, lehitimo itong paglilinaw sa Tagalog upang maipahayag ang kontekstuwal na saklaw at maiwasan ang etnikong paglalahat.
translation_notes:
  register: 'Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “Judio” sa halip na mas kolokyal o mas malawak na katawagan, at “dinakip”/“patayin” para sa malinaw na salaysay. Isang talababa lamang ang kailangan: natural nang nasasaklaw ng “Dahil dito” ang mga leksikal na alternatibo ng ἕνεκα τούτων.'
