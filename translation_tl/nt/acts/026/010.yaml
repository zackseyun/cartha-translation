revisions:
- from: At iyan nga ang ginawa ko sa Jerusalem. Ikinulong ko ang marami sa mga banal[a] sa mga bilangguan, matapos akong tumanggap ng kapangyarihan mula sa mga punong pari. At nang sila'y ipinapapatay, ibinibigay ko ang aking boto laban sa kanila.[b]
  to: 'At ito rin ang ginawa ko sa Jerusalem: hindi lamang ikinulong ko sa mga bilangguan ang marami sa mga banal[a], matapos akong tumanggap ng awtoridad mula sa mga punong pari, kundi nang sila’y pinapatay, inihulog ko rin ang boto ko laban sa kanila.[b]'
  rationale: Pinalitan ang di-ganap na “ibinibigay ko” ng naganap na “inihulog ko” upang maipakita ang aorist na κατήνεγκα. Pinanatili ang “nang sila’y pinapatay” upang ihayag ang kasabay na pagpatay na nasa present passive participle. Ginawang “awtoridad” ang ἐξουσία, at inayos ang ugnayan ng dalawang sugnay upang maipakita ang τε ... τε nang likas sa Filipino. Iningatan ng talababa ang hindi pa tiyak na historikal na anyo ng pagboto.
