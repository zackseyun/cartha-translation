id: ACT.26.10
reference: Acts 26:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃ καὶ ἐποίησα ἐν Ἱεροσολύμοις, καὶ πολλούς ⸀τε τῶν ἁγίων ἐγὼ ⸀ἐν φυλακαῖς κατέκλεισα τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών, ἀναιρουμένων τε αὐτῶν κατήνεγκα ψῆφον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/010.yaml
  text: 'And this is what I did in Jerusalem: I not only locked up many of the saints in prisons[a], having received authority from the chief priests, but also, when they were being put to death[b], I cast my vote against them.'
translation:
  language: tl
  text: 'At ito rin ang ginawa ko sa Jerusalem: hindi lamang ikinulong ko sa mga bilangguan ang marami sa mga banal[a], matapos akong tumanggap ng awtoridad mula sa mga punong pari, kundi nang sila’y pinapatay, inihulog ko rin ang boto ko laban sa kanila.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga banal” ay tumutukoy rito sa mga taong ibinukod para sa Diyos—ang mga mananampalataya kay Jesus—hindi lamang sa isang natatanging pangkat ng mga kinilalang santo.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, literal na “nagdala ako ng boto.” Maaaring tumukoy ito sa pormal na pagboto laban sa kanila; hindi tinutukoy ng teksto ang eksaktong lupon o kaparaanan.
    reason: lexical_and_historical_ambiguity
lexical_decisions:
- source_word: ὃ καὶ ἐποίησα
  choice: At iyan nga ang ginawa ko
  rationale: Ang ὃ ay tumutukoy pabalik sa balak na usigin ang mga mananampalataya sa naunang talata; natural na ipinahahayag ito sa Tagalog bilang isang panimulang pagbubuod. Ipinakikita ng “nga” ang diin ng καί nang hindi nagiging pilit.
- source_word: ἐν Ἱεροσολύμοις
  choice: sa Jerusalem
  rationale: Karaniwang makabagong anyo ng pangalan ng lugar sa Filipino.
- source_word: πολλούς τε τῶν ἁγίων
  choice: ang marami sa mga banal
  rationale: Ang ἅγιοι ay tawag sa mga taong ibinukod para sa Diyos, dito ay mga mananampalataya kay Jesus. Pinananatili ng “mga banal” ang pangunahing leksikal at teolohikal na kahulugan nang hindi ipinapalagay ang mas huling konsepto ng kanonisadong santo.
- source_word: ἐν φυλακαῖς κατέκλεισα
  choice: Ikinulong ko ... sa mga bilangguan
  rationale: Tuwirang ipinahahayag ng “ikinulong” ang pagkulong o pagsasara, habang pinananatili ng “mga bilangguan” ang tahasang maramihang φυλακαῖς.
- source_word: τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών
  choice: matapos akong tumanggap ng kapangyarihan mula sa mga punong pari
  rationale: Inilalahad ng pariralang pandiwari ang pinagmulan at batayan ng pagkilos ni Pablo. Ang “kapangyarihan” ay malawak at tuwirang katumbas ng ἐξουσία, na maaaring sumaklaw sa awtoridad o pahintulot.
- source_word: ἀναιρουμένων τε αὐτῶν
  choice: nang sila'y ipinapapatay
  rationale: Ipinahahayag ng ἀναιρέω sa kontekstong ito ang pagkitil sa buhay. Pinananatili ng “ipinapapatay” ang aspektong nagaganap at ang pasibong diwa nang hindi nagdaragdag ng tiyak na legal na pamamaraan.
- source_word: κατήνεγκα ψῆφον
  choice: ibinibigay ko ang aking boto laban sa kanila
  rationale: Ang ψῆφος ay literal na batong ginagamit sa pagboto at sa pagpapalawak ay “boto.” Likas sa Tagalog ang “ibinibigay ang boto”; ang “laban sa kanila” ay ipinahihiwatig ng konteksto at nililinaw ang direksiyon ng boto. Ang aspektong imperpektibo ay angkop sa paulit-ulit na pagkilos na inilalarawan.
theological_decisions:
- issue: Kahulugan ng ἅγιοι
  choice: “mga banal,” na tumutukoy sa mga mananampalataya kay Jesus bilang bayang ibinukod para sa Diyos
  alternative: “mga mananampalataya” o “mga taong banal ng Diyos”
  rationale: Pinananatili ng “mga banal” ang susing bokabularyo ng orihinal at hindi nililimitahan ang katawagan sa isang natatanging uring kinanonisa.
- issue: Lakas ng κατήνεγκα ψῆφον
  choice: Aktuwal na pagbibigay ng boto laban sa kanila
  alternative: Pagpayag o pagsang-ayon lamang sa kanilang kamatayan
  rationale: Pinakamalapit sa larawan at karaniwang kahulugan ng ψῆφος ang “boto.” Hindi tinutukoy ng salin kung anong lupon o pormal na katungkulan ang kinasangkutan ni Pablo, kaya pinananatili ang historikal na tensiyon.
- issue: Aspekto ng mga pandiwa sa salaysay
  choice: “Ikinulong ko” para sa kabuuang gawa at “ibinibigay ko” para sa pagboto habang nagaganap ang mga pagpatay
  alternative: 'Parehong nasa payak na naganap: “ikinulong ko” at “ibinigay ko”'
  rationale: Sinasalamin nito ang aorist κατέκλεισα/κατήνεγκα sa loob ng salaysay ngunit ginagamit ang likas na aspektong Filipino upang ihayag ang maaaring paulit-ulit na paglahok sa mga pagkakataong ipinapapatay ang mga mananampalataya, nang hindi nagpapasya kung isang boto lamang o maraming pagkakataon ang tinutukoy.
translation_notes:
  register: Makabagong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “mga banal” bilang mahalagang terminong biblikal, na nilinaw sa talababa. Hinati sa tatlong pangungusap upang maging natural ang mahabang pangungusap na Griyego nang mapanatili ang pagkakasunod ng mga sugnay at ang ugnayang τε...τε.
