id: ACT.26.27
reference: Acts 26:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πιστεύεις, βασιλεῦ Ἀγρίππα, τοῖς προφήταις; οἶδα ὅτι πιστεύεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/027.yaml
  text: King Agrippa, do you believe the prophets? I know that you do believe.
translation:
  language: tl
  text: Haring Agripa, naniniwala ka ba sa mga propeta?[a] Alam kong naniniwala ka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinatanggap mo ba ang mga propeta” o “nagtitiwala ka ba sa mga propeta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: naniniwala ka ba
  rationale: Ang kasalukuyang aktibong anyong pangalawang panauhan ay likas na isinasalin bilang tuwirang tanong. Sa kontekstong ito, ang “naniniwala” ay tumutukoy sa pagtanggap bilang totoo sa patotoo o mensahe ng mga propeta.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Haring Agripa
  rationale: Ang βασιλεῦ ay anyong pantawag; ang “Haring Agripa” ang natural at marangal na modernong Filipino na pantawag, at ang pangalan ay isinalin ayon sa nakaugaliang baybay sa Filipino.
- source_word: τοῖς προφήταις
  choice: sa mga propeta
  rationale: Ang datibo kasunod ng πιστεύω ay nagpapahayag ng mga taong pinaniniwalaan o ng kanilang patotoo. Pinananatili ng tuwirang salin ang sanggunian sa kinikilalang mga propetikong saksi.
- source_word: οἶδα
  choice: Alam ko
  rationale: Bagaman perpektong anyo sa Griyego, mayroon itong kasalukuyang diwa rito; ang “Alam ko” ay tuwiran at hindi nagpapalabnaw sa katiyakan ng pahayag ni Pablo.
- source_word: ὅτι πιστεύεις
  choice: na naniniwala ka
  rationale: Ipinakikilala ng ὅτι ang nilalaman ng nalalaman ni Pablo. Inuulit ang “naniniwala” upang mapanatili ang pag-uulit ng pandiwa sa Griyego; hindi na kailangan ng dagdag na katagang pampadiin sa natural na Filipino.
theological_decisions:
- issue: Saklaw ng paniniwala “sa mga propeta”
  choice: Paniniwala o pagtanggap bilang totoo sa mga propeta at sa kanilang patotoo
  alternative: Pagtitiwala sa mga propeta; pagtanggap sa mensahe o mga kasulatan ng mga propeta
  rationale: Ang πιστεύω na may datibo ay maaaring tumukoy sa paniniwala sa tao at sa kanyang patotoo. Pinananatili ng salin ang payak na pananalita ni Pablo nang hindi ito pinalalawak tungo sa pagsunod, pangkalahatang pagiging relihiyoso, o isang mas ganap na doktrinal na pag-aangkin.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, natural, at marangal. Ginamit ang “Haring Agripa” bilang likas na pantawag at pinanatili ang retorikal na tanong at tiyak na kasunod na pahayag.
