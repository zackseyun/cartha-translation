  source_fidelity: Tapat ang salin sa SBLGNT. Naipapahayag nito ang pahintulot ni Agripa na magsalita si Pablo para sa sarili niyang panig, ang pag-unat ng kamay, at ang kasunod na pormal na pagtatanggol ni Pablo. Ang “ipinagtanggol ang kanyang sarili” ay angkop na idiomatikong salin ng ἀπελογεῖτο sa kontekstong pagdinig at hindi nagdaragdag ng partikular na interpretasyon sa kilos ng kamay.
  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang pormal ngunit hindi sobrang teknikal na rehistro ay angkop sa isang pampublikong pagdinig. Ang “Pagkatapos” ay katanggap-tanggap na pagsasalin ng τότε bilang panandang pagsulong ng salaysay.
