  text: Ἀγρίππας δὲ πρὸς τὸν Παῦλον ἔφη· Ἐπιτρέπεταί σοι ⸀ὑπὲρ σεαυτοῦ λέγειν. τότε ὁ Παῦλος ⸂ἐκτείνας τὴν χεῖρα ἀπελογεῖτο⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/001.yaml
  text: 'Then Agrippa said to Paul[b][a], “You are permitted to speak on your own behalf.” Then Paul stretched out his hand and made his defense:'
translation:
  language: tl
  text: 'Sinabi ni Agripa kay Pablo, “Pinahihintulutan kang magsalita para sa iyong sarili.” Pagkatapos, iniunat ni Pablo ang kanyang kamay at ipinagtanggol ang kanyang sarili:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγρίππας
  choice: Agripa
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan.
- source_word: δὲ
  choice: Sinabi ni Agripa
  rationale: Ang δέ ay panandang nagpapatuloy sa salaysay; hindi na ito isinalin nang hiwalay dahil natural nang ipinahihiwatig ng ayos ng pangungusap sa Filipino.
- source_word: πρὸς τὸν Παῦλον ἔφη
  choice: Sinabi ni Agripa kay Pablo
  rationale: Natural na salin ng pariralang ginagamit sa tuwirang pakikipag-usap.
- source_word: Ἐπιτρέπεταί σοι
  choice: Pinahihintulutan ka
  rationale: Pinananatili ang pasibong diwa ng ipinagkaloob na pahintulot at ang pormal na himig ng pagdinig.
- source_word: ὑπὲρ σεαυτοῦ λέγειν
  choice: magsalita para sa iyong sarili
  rationale: Pinananatili ang maaaring diwa ng pagsasalita alang-alang sa sarili nang hindi labis na nililimitahan sa teknikal na depensang legal.
- source_word: τότε
  choice: Pagkatapos
  rationale: Malinaw at natural na ipinapakita ang kasunod na pangyayari.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: iniunat ni Pablo ang kanyang kamay
  rationale: Tuwirang inilalarawan ang kilos nang hindi ipinapalagay ang tiyak na uri o kahulugan ng kumpas.
- source_word: ἀπελογεῖτο
  choice: ipinagtanggol ang kanyang sarili
  rationale: Ipinahahayag ang pormal na pagbibigay-depensa; ang anyong nagdaan ay natural sa salaysay sa Filipino at hindi nagdaragdag ng di-tiyak na inceptive na diwang ‘nagsimulang.’
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at natural. Pinanatili ang pormal na konteksto ng pagdinig, ngunit iniwasan ang sobrang teknikal na wikang legal.
