base_translation:
  language: en
  yaml_path: translation/nt/acts/026/032.yaml
  text: Then Agrippa said to Festus[a], “This man could have been released if he had not appealed to Caesar.”
translation:
  language: tl
  text: Sinabi naman ni Agripa kay Festo, “Maaari sanang napalaya ang taong ito kung hindi siya umapela kay Cesar.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Pagkatapos
  rationale: Minamarkahan nito ang pagsulong ng salaysay at ang paglipat sa pangwakas na sinabi ni Agripa; natural itong pakinggan sa makabagong Tagalog.
- source_word: ἔφη
  choice: sinabi
  rationale: Bagaman imperpekto ang anyo, karaniwan itong payak na panimula sa tuwirang pananalita sa salaysay; hindi kailangang idiin ang nagpapatuloy na aspekto.
- source_word: Ἀπολελύσθαι
  choice: Napalaya
  rationale: Ipinapahayag ng perpektong pawatas ng ἀπολύω ang pagpapalaya o pagpapakawala. Ang “napalaya” ay angkop sa legal na konteksto nang hindi ipinahihiwatig ang mas tiyak na pormal na pagpapawalang-sala.
- source_word: ἐδύνατο
  choice: sana
  rationale: Kasama ng kondisyong εἰ μὴ, ipinahihiwatig nito ang isang posibilidad na hindi natupad. Likas na ipinapahayag ito sa Tagalog ng hulma na “Napalaya sana ... kung hindi ...”
- source_word: ὁ ἄνθρωπος οὗτος
  choice: ang taong ito
  rationale: Pinananatili nito ang tahasang demonstratibo at tumutukoy kay Pablo nang natural at marangal.
- source_word: εἰ μὴ
  choice: kung hindi
  rationale: Malinaw at natural nitong ipinapahayag ang kondisyong salungat sa aktuwal na nangyari.
- source_word: ἐπεκέκλητο
  choice: umapela
  rationale: Sa kontekstong legal ng Roma, tumutukoy ito sa paghiling na dinggin ng emperador ang kaso; “umapela” ang tiyak at madaling maunawaang katumbas.
- source_word: Καίσαρα
  choice: Cesar
  rationale: Pinananatili ang makasaysayan at legal na titulong Καῖσαρ sa karaniwang baybay sa Tagalog sa halip na palitan ng interpretibong “emperador.”
