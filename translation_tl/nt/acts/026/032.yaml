translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang likas na hulma na “Napalaya sana ... kung hindi ...” upang mapanatili ang di-natupad na posibilidad nang hindi labis na ginagawang teknikal ang wikang legal.
