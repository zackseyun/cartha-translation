  - severity: low
    issue: Ang “Pagkatapos” ay mas tiyak na panandang pang-oras kaysa sa δέ.
    rationale: Ang δέ ay pangunahing pang-ugnay/transisyon dito; ang “naman” ay mas malapit at likas sa Tagalog.
