base_translation:
  language: en
  yaml_path: translation/nt/acts/026/028.yaml
  text: Then Agrippa said to Paul[a], “In a short time you are persuading me to become a Christian.”
translation:
  language: tl
  text: Sinabi naman ni Agripa kay Pablo[a], “Sa maikling panahon ay hinihikayat mo akong maging Kristiyano.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Halos mahikayat mo akong maging Kristiyano,” o marahil, “Sa gayong kaikling panahon, inaakala mo bang mahihikayat mo akong maging Kristiyano?” Ang ekspresyong Griyego ay maaaring tumukoy sa maikling panahon o sa kaunting antas, at maaaring taos-puso o ironiko ang tono ni Agripa.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ Ἀγρίππας
  choice: Sinabi naman ni Agripa
  rationale: Ang δέ ay banayad na pang-ugnay; natural na ipinahahayag ng “naman” ang pagpapatuloy o bahagyang pagtugon nang hindi nagpapahiwatig ng matinding pagsalungat. Idinagdag ang pandiwang “sinabi” ayon sa diwa ng pormulang pansalita sa kasunod na parirala.
- source_word: πρὸς τὸν Παῦλον
  choice: kay Pablo
  rationale: Sa konteksto ng tuwirang pananalita, ang πρός ay likas na isinasaling “kay,” bilang tumatanggap ng sinabi.
- source_word: Ἐν ὀλίγῳ
  choice: Sa maikling panahon
  rationale: Pinananatili nito ang tuwirang temporal na diwa ng parirala. Gayunman, maaari rin itong tumukoy sa maliit na antas o magpahiwatig ng “halos,” kaya inilalahad sa talababa ang tunay na kalabuan.
- source_word: με πείθεις
  choice: hinihikayat mo ako
  rationale: Ang pangkasalukuyang πείθεις ay nagpapahiwatig ng nagaganap na panghihikayat o pagkumbinsi. Mas natural sa Filipino ang “hinihikayat,” nang hindi idinaragdag na nagtagumpay na ang panghihikayat.
- source_word: Χριστιανὸν
  choice: Kristiyano
  rationale: Ito ang karaniwan at tumpak na katawagan sa modernong Filipino para sa Χριστιανός.
- source_word: ποιῆσαι
  choice: maging
  rationale: Bagaman literal na may diwang “gawin,” sa konstruksiyong ito ay tumutukoy ito sa pagdadala sa isang tao sa katayuang Kristiyano; natural itong ipinahahayag sa Filipino bilang “maging Kristiyano.”
theological_decisions:
- issue: Tono at puwersa ng tugon ni Agripa
  choice: Isang pahayag na sa maikling panahon ay hinihikayat siyang maging Kristiyano
  alternative: 'Maaaring ironiko o mapang-iwas na tanong: “Sa gayong kaikling panahon, inaakala mo bang magagawa mo akong Kristiyano?”; maaari rin itong unawaing “Halos mahikayat mo akong maging Kristiyano.”'
  rationale: Hindi tiyak sa Griyego kung taos-puso, umiiwas, o ironiko ang tono ni Agripa. Pinananatili ng pangunahing salin ang payak na anyo ng pahayag, habang inilalagay sa talababa ang ibang posibleng pagbasa upang hindi tahimik na lutasin ang tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Agripa” at “Pablo,” na mga nakaugaliang anyo ng pangalang biblikal sa Tagalog. Ang pangungusap ay nananatiling deklaratibo gaya ng Griyego, samantalang ang mga posibleng ironiko at tradisyonal na pagbasa ay nasa talababa.
