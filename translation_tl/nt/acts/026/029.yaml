  text: ὁ δὲ ⸀Παῦλος· Εὐξαίμην ἂν τῷ θεῷ καὶ ἐν ὀλίγῳ καὶ ἐν ⸀μεγάλῳ οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι παρεκτὸς τῶν δεσμῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/029.yaml
  text: But Paul said[a], “I would pray to God that whether in a short time or in a long time, not only you but also all who hear me today might become such as I am—except for these chains.”
translation:
  language: tl
  text: Ngunit sinabi ni Pablo, “Idinadalangin ko sa Diyos na sa maikling panahon man o sa mahabang panahon,[a] hindi lamang ikaw kundi pati ang lahat ng nakikinig sa akin ngayon ay maging katulad ko—maliban sa mga tanikalang ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “halos man o lubusan.” Mahirap tiyakin ang diwa ng Griyegong parirala; maaaring tumukoy ito sa antas, pagsisikap, o haba ng panahon.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐξαίμην ἂν τῷ θεῷ
  choice: Idinadalangin ko sa Diyos
  rationale: Ang potensiyal na optative na may ἄν ay nagpapahayag ng taimtim na hangarin o panalangin. Dahil tahasang kasunod ang τῷ θεῷ, likas at tuwiran sa modernong Tagalog ang “Idinadalangin ko sa Diyos.”
- source_word: ἐν ὀλίγῳ καὶ ἐν μεγάλῳ
  choice: sa maikli man o mahabang panahon
  rationale: Mahirap at pinagtatalunan ang tambalang parirala. Ang pag-unawang tumutukoy sa haba ng panahon ay angkop sa konteksto at naihahayag sa natural na Tagalog, habang inilalahad sa talababa ang iba pang posibleng diwa.
- source_word: οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον
  choice: hindi lamang ikaw kundi pati ang lahat ng nakikinig sa akin ngayon
  rationale: Pinananatili nito ang mariing paghahambing at ang kasalukuyang kilos ng participle—ang mga taong nakikinig kay Pablo sa sandaling iyon.
- source_word: γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι
  choice: ay maging katulad ko
  rationale: Natural at malinaw sa kasalukuyang Tagalog ang “maging katulad ko,” at tumpak nitong ipinahahayag ang ninanais na kalagayan nang hindi nagdaragdag kung sa anong tiyak na aspekto sila magiging katulad niya.
- source_word: παρεκτὸς τῶν δεσμῶν τούτων
  choice: maliban sa mga tanikalang ito
  rationale: Ang παρεκτός ay nagsasaad ng pagbubukod, at ang “mga tanikala” ay kongkreto, marangal, at angkop sa pagkakabilanggo ni Pablo.
theological_decisions:
- issue: Kahulugan ng ἐν ὀλίγῳ καὶ ἐν μεγάλῳ kaugnay ng naunang sinabi ni Agripa
  choice: sa maikli man o mahabang panahon
  alternative: halos man o lubusan; sa kaunti man o malaking pagsisikap
  rationale: Tunay na malabo at pinagtatalunan ang Griyegong parirala. Pinili sa pangunahing teksto ang makatwirang temporal na diwa, ngunit pinanatili sa talababa ang mga pangunahing alternatibo upang hindi ikubli o sapilitang lutasin ang kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “tanikalang” sa halip na mas kolokyal na “kadena” upang umangkop sa dignidad ng salaysay, nang hindi nagiging lipas o mahirap unawain.
