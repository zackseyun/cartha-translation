  text: because of the truth that remains in us and will be with us forever[a].
translation:
  language: tl
  text: dahil sa katotohanang nananatili sa atin at makakasama natin magpakailanman[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nananahan sa atin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ
  choice: dahil sa
  rationale: Kasama ng akusatibo, nagpapahayag ito rito ng dahilan o batayan ng pag-ibig na binanggit sa naunang talata.
- source_word: ἀλήθειαν
  choice: katotohanan
  rationale: Tuwirang katumbas ito ng salitang Griyego at pinananatili ang malawak na teolohikal na diwa nito nang hindi nililimitahan sa isang tiyak na paliwanag.
- source_word: τὴν μένουσαν
  choice: na nananatili
  rationale: Ipinahihiwatig ng pangkasalukuyang partisipo ang nagpapatuloy na presensya; natural at malinaw sa modernong Tagalog ang “nananatili.”
- source_word: ἐν ἡμῖν
  choice: sa atin
  rationale: Likas na salin ito sa Tagalog para sa presensya ng katotohanan sa loob ng mga mananampalataya bilang isang sambayanan; hindi ito pinakitid sa “kabilang natin.”
- source_word: καὶ μεθ’ ἡμῶν ἔσται
  choice: at makakasama natin
  rationale: Ang μετά ay “kasama” at ang ἔσται ay panghinaharap. Ang “makakasama natin” ay natural na Tagalog at hindi nagdaragdag ng isa pang pandiwang “mananatili.”
- source_word: εἰς τὸν αἰῶνα
  choice: magpakailanman
  rationale: Karaniwan at marangal na katumbas ng idyomang tumutukoy sa walang-hanggang pagpapatuloy.
theological_decisions:
- issue: Teolohikal na diwa ng “katotohanan” sa mga sulat ni Juan
  choice: Panatilihin ang payak na “katotohanan” nang hindi tinutukoy kung ito ang mensahe ng ebanghelyo, si Cristo, o ang realidad ng paghahayag ng Diyos.
  alternative: “katotohanan ng ebanghelyo” o “tunay na aral”
  rationale: Hindi tahasang nililimitahan ng Griyegong pangngalan ang tinutukoy nito. Pinananatili ng mas malawak na salita ang tunay na ambiguwidad at lalim ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “atin/natin” upang panatilihin ang inklusibong unang panauhang maramihan ng Griyego.
