  text: ἔσται μεθ’ ἡμῶν χάρις ἔλεος εἰρήνη παρὰ θεοῦ πατρός, καὶ ⸀παρὰ Ἰησοῦ Χριστοῦ τοῦ υἱοῦ τοῦ πατρός, ἐν ἀληθείᾳ καὶ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/003.yaml
  text: Grace[a], mercy, and peace will be with us from God the Father and from Jesus the Messiah, the Father's Son[b], in truth and love.
translation:
  language: tl
  text: Sasaatin ang biyaya, awa, at kapayapaan mula sa Diyos Ama at mula kay Jesus na Mesiyas[a], ang Anak ng Ama, sa katotohanan at pag-ibig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Jesus Cristo.” Ang Griyegong titulong Χριστός ay isinalin dito bilang “Mesiyas” upang maipakita ang kahulugan nito bilang titulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται μεθ’ ἡμῶν
  choice: Sumaatin
  rationale: Ang panghinaharap na ἔσται kasama ng μεθ’ ἡμῶν ay nagsasaad na ang mga pagpapalang ito ay sasaatin. Ang “sumaatin” ay natural at marangal na pormula ng pagpapala sa Filipino, bagaman hindi nito tahasang ipinakikita ang panghinaharap na anyo gaya ng “sasaatin.”
- source_word: χάρις ἔλεος εἰρήνη
  choice: biyaya, awa, at kapayapaan
  rationale: Pinananatili ang tatlong magkakasunod na paksa ng pandiwa at ang karaniwang kahulugan ng mga ito sa konteksto ng pagbati at pagpapala.
- source_word: παρὰ θεοῦ πατρός
  choice: mula sa Diyos Ama
  rationale: Ang παρά na may genitive ay nagpapahayag ng pinagmulan. Walang salitang katumbas ng “ating” sa Griyego, kaya hindi ito idinagdag.
- source_word: παρὰ Ἰησοῦ Χριστοῦ
  choice: mula kay Jesu-Cristo
  rationale: Muling ipinahahayag ng παρά ang pinagmulan. Ang “Cristo” ang natural at kinikilalang anyo sa modernong Filipino para sa titulong Χριστός; ipinaliliwanag sa talababa ang kahulugang “Mesiyas.”
- source_word: τοῦ υἱοῦ τοῦ πατρός
  choice: ang Anak ng Ama
  rationale: Pinananatili ang tiyak na ugnayang genitive at ang appositional na pagkakakilanlan kay Jesu-Cristo.
- source_word: ἐν ἀληθείᾳ καὶ ἀγάπῃ
  choice: sa katotohanan at pag-ibig
  rationale: Direktang inilalarawan ng “sa” ang ἐν, at pinananatiling walang pantukoy ang dalawang abstraktong pangngalan gaya ng kwalitatibong gamit sa Griyego.
theological_decisions:
- issue: Paglilipat ng Χριστοῦ
  choice: Cristo sa pangunahing teksto, na may talababa na “Mesiyas” ang kahulugan ng titulo
  alternative: Mesiyas
  rationale: Sa Filipino, ang “Jesu-Cristo” ay natural at malinaw na pormal na anyo, habang pinangangalagaan ng talababa ang tunay na diwa ng Χριστός bilang titulo at hindi apelyido.
- issue: Ugnayan ng “ang Anak ng Ama” kay Jesu-Cristo
  choice: Appositional na pagkakakilanlan kay Jesu-Cristo bilang Anak ng Ama
  alternative: Mas maluwag na pariralang naglalarawan kay Jesu-Cristo
  rationale: Pinakanatural na tumutukoy ang pariralang genitive sa naunang Jesu-Cristo at tahasang kinikilala siya bilang Anak ng Ama, nang walang idinaragdag na paliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang tradisyonal ngunit buhay pa ring pormulang “Sumaatin” para sa epistolaryong pagpapala; iniwasan ang pagdaragdag ng “ating” sa “Diyos Ama” dahil wala ito sa Griyego.
