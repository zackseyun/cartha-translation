reference: 2 John 1:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὁ πρεσβύτερος ἐκλεκτῇ κυρίᾳ καὶ τοῖς τέκνοις αὐτῆς, οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ, καὶ οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες οἱ ἐγνωκότες τὴν ἀλήθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/001.yaml
  text: The elder[a], to the chosen lady and her children, whom I love in truth—and not I alone[b], but also all who have come to know the truth—
translation:
  language: tl
  text: Mula sa nakatatanda, para sa hinirang na ginang[a] at sa kanyang mga anak, na iniibig ko sa katotohanan[b]—at hindi lamang ako, kundi pati ang lahat ng nakakilala sa katotohanan—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain bilang “piniling ginang.” Maaaring tumukoy ito sa isang babae at sa kanyang mga anak; itinuturing naman ito ng ilan na matalinghagang tawag sa isang lokal na iglesya, at inuunawa ng iba ang Kyria bilang pangalan ng babae.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “nang tunay”; maaari ring taglayin ng parirala ang maka-Juang na diwang “sa katotohanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: Mula sa matanda
  rationale: Sa pambungad ng liham, ang πρεσβύτερος ay pantukoy sa sumulat at maaaring magpahiwatig ng edad, katayuan, o kinikilalang pamumuno. Ang “matanda” ay likas sa modernong Tagalog at hindi kasing teknikal o denominasyonal ng “presbitero.”
- source_word: ἐκλεκτῇ
  choice: hinirang na
  rationale: Ang “hinirang” ay dignificado at malinaw na katumbas ng ἐκλεκτός. Maaari nitong ilarawan ang isang babae o, sa matalinghagang pagbasa, ang isang lokal na iglesya.
- source_word: κυρίᾳ
  choice: ginang
  rationale: Ang κυρία ay karaniwang nangangahulugang isang ginang o babaeng may paggalang na tinutukoy. Pinananatili ng “ginang” ang literal na anyo ng pagbati nang hindi ipinipilit kung babae, iglesya, o pangalang pantangi ang tinutukoy.
- source_word: τοῖς τέκνοις αὐτῆς
  choice: sa kanyang mga anak
  rationale: Ang τέκνα ay pangkalahatang “mga anak,” hindi lamang mga anak na lalaki. Ang “kanyang” ay umaayon sa lantad na gramatika at maaari ring gumana kung matalinghagang iglesya ang ginang.
- source_word: οὓς
  choice: na
  rationale: Ang panghalip na panumbalik ay nasa panlalaking maramihan at malamang na tumutukoy sa mga anak o sa buong pangkat bilang mga tao. Ang natural na Tagalog na “na” ay hindi artipisyal na nagtatakda ng tiyak na tinutukoy.
- source_word: ἀγαπῶ
  choice: aking iniibig
  rationale: Ang “iniibig” ay tuwirang katumbas ng ἀγαπῶ at angkop sa marangal na himig ng liham, nang walang idinagdag na antas ng tindi.
- source_word: ἐν ἀληθείᾳ
  choice: sa katotohanan
  rationale: Pinananatili nito ang posibleng kahulugang tapat o tunay ang pag-ibig, gayundin ang natatanging tema ni Juan tungkol sa pamumuhay sa saklaw ng katotohanan.
- source_word: οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες
  choice: at hindi lamang ako, kundi pati ang lahat
  rationale: Likas na inilalahad sa Tagalog ang diin at pagsalungat sa pagitan ng sumulat at ng mas malawak na pangkat.
- source_word: οἱ ἐγνωκότες
  choice: ang lahat ng nakakilala
  rationale: Ang ganap na pandiwaring ἐγνωκότες ay nagpapahiwatig ng kasalukuyang kalagayang bunga ng pagkakilala. Sa kontekstong ito, naipahihiwatig ng “nakakilala” ang matatag na pagkakilalang iyon nang hindi mabigat pakinggan.
- source_word: τὴν ἀλήθειαν
  choice: sa katotohanan
  rationale: Pinananatili ang pag-uulit ng “katotohanan” at ang karaniwan at teolohikal na bisa nito sa mga sulat ni Juan.
theological_decisions:
- issue: Pagkakakilanlan ng ἐκλεκτῇ κυρίᾳ
  choice: Isinalin bilang “hinirang na ginang,” isang pagbating waring para sa isang babae ngunit bukas pa rin sa matalinghagang pagtukoy sa isang lokal na iglesya.
  alternative: Maaaring tumukoy sa isang partikular na Kristiyanang babae at kanyang mga anak, sa isang kongregasyon at mga kaanib nito, o sa babaeng nagngangalang Kyria.
  rationale: Pinahihintulutan ng Griyego ang mga pagbasa na ito. Hindi dapat lutasin ng salin ang tunay na kalabuan; kaya karaniwang pangngalan ang ginamit sa teksto at inilagay sa talababa ang ibang mga posibilidad.
- issue: Kahulugan ng ἐν ἀληθείᾳ
  choice: Isinalin bilang “sa katotohanan.”
  alternative: “nang tunay” o “sa loob ng katotohanan”
  rationale: Maaaring ipahayag ng parirala ang katapatan ng pag-ibig o ang maka-Juang diwa ng pakikibahagi sa katotohanan. Pinananatili ng “sa katotohanan” ang dalawang antas nang hindi labis na nagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “matanda” sa halip na teknikal na “presbitero,” at “ginang” upang mapanatili ang magalang na tawag at ang kalabuan ng tinutukoy. Ang hulíng gitling ay pinanatili sapagkat nagpapatuloy ang pangungusap sa susunod na talata.
