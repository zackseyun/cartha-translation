base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/011.yaml
  text: For the one who says to him[a], “Greetings,” shares in his evil works.
translation:
  language: tl
  text: Sapagkat ang bumabati sa kanya ay nakikibahagi sa masasama niyang gawa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ λέγων
  choice: ang nagsasabi
  rationale: 'Ang artikulo at kasalukuyang participle ay substantibo at pangkalahatan: tumutukoy ito sa sinumang gumagawa nito. Likas sa Tagalog ang “ang nagsasabi” at malapit ito sa kayarian ng Griyego.'
- source_word: γάρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng dahilan para sa pagbabawal sa naunang talata. Pinananatili ng “Sapagkat” ang paliwanag na ugnayan.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Ang panghalip ay tumutukoy sa taong binanggit sa naunang talata. Hindi pinalalawak ang tinutukoy nito sa mismong salin.
- source_word: χαίρειν
  choice: “Mabuhay ka”
  rationale: Dito ang infinitive ay ginagamit bilang nakaugaliang pormula ng pagbati. Ang “Mabuhay ka” ay nagpapanatili ng literal na diwa ng kagalakan o kagalingan habang gumaganap bilang isang pagbati; nililinaw ng talababa ang kontekstuwal na puwersa nito.
- source_word: κοινωνεῖ
  choice: nakikibahagi
  rationale: Ipinahihiwatig ng pandiwa, kasama ang datibo, ang pakikibahagi o pakikisangkot sa isang bagay. Malinaw ang “nakikibahagi” at hindi nito ipinapasok ang mas makitid na teknikal o pansimbahang kahulugan.
- source_word: τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς
  choice: sa masasama niyang gawa
  rationale: Pinananatili ng “gawa” ang leksikal na diwa ng ἔργα, at inilalarawan ng “masasama” ang moral na katangian ng mga iyon. Natural sa Tagalog ang ayos na “masasama niyang gawa.”
theological_decisions:
- issue: Kung ang pagbati ay simpleng paggalang lamang o pagpapahayag ng pagtanggap na nagdudulot ng pakikisangkot
  choice: Pinananatili sa pangunahing teksto ang karaniwang pormula ng pagbati, samantalang ipinahihiwatig ng konteksto ng talata 10 at ng “nakikibahagi” na ang tinutukoy ay isang pagbating kaugnay ng pagtanggap o pagsuporta sa huwad na guro.
  alternative: Unawain ito bilang lubos na pagbabawal sa anumang magalang na pagbati sa lahat ng pagkakataon.
  rationale: Ang χαίρειν ay tunay na pormula ng pagbati, ngunit ang agarang konteksto—ang pagtanggap sa bahay—at ang κοινωνεῖ ay tumutukoy sa pakikisangkot sa gawain ng taong iyon. Hindi tahasang nilulutas ng salin ang lahat ng saklaw nito; inilalagay sa talababa ang kinakailangang kontekstuwal na paglilinaw.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Mabuhay ka” bilang kinikilalang pormula ng pagbati na mas malapit sa anyo at diwa ng χαίρειν kaysa sa payak na “Kumusta,” habang ang talababa ay naglalaan ng natural na alternatibo at kontekstuwal na paliwanag.
