revisions:
- from: Ang sinumang nagpapauna[a] at hindi nananatili sa turo ng Mesiyas[b] ay wala sa kanya ang Diyos. Ang nananatili sa turo, siya ang may kapuwa Ama at Anak.
  to: Ang sinumang nagpapatuloy nang lampas[a] at hindi nananatili sa turo ng Mesiyas[b] ay wala sa kanya ang Diyos. Ang nananatili sa turo ay taglay kapuwa ang Ama at ang Anak.
  rationale: Pinalitan ang «nagpapauna» ng intransitibo at mas natural na «nagpapatuloy nang lampas,» na naghahatid ng metapora ng προάγων sa kontekstong ito nang hindi ipinapasok sa pangunahing teksto ang tekstuwal na variant na «lumalabag.» Inayos ang pangwakas na sugnay upang maging malinaw ang correlative na καὶ...καὶ (“kapuwa ang Ama at ang Anak”). Pinanatili ang lahat ng sinadyang kalabuan at ang mga anchor ng talababa.
