  text: πᾶς ὁ ⸀προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει· ὁ μένων ἐν τῇ ⸀διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/009.yaml
  text: Everyone who goes on ahead and does not remain in the teaching of Messiah does not have God[a]. The one who remains in the teaching[b], this one has both the Father and the Son.
translation:
  language: tl
  text: Ang sinumang nagpapatuloy nang lampas[a] at hindi nananatili sa turo ng Mesiyas[b] ay wala sa kanya ang Diyos. Ang nananatili sa turo ay taglay kapuwa ang Ama at ang Anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpapatuloy sa unahan” o “lumalampas sa hangganan.” “Lumalabag” ang mababasa sa ilang manuskrito sa halip na “nagpapatuloy nang lampas.”
    reason: textual_variant
  - marker: b
    text: Ang “turo ng Mesiyas” ay maaaring mangahulugang turo mula sa Mesiyas o turo tungkol sa Mesiyas.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ προάγων
  choice: Ang sinumang nagpapauna
  rationale: Ipinahahayag ng πᾶς kasama ng participle na may artikulo ang pangkalahatang diwang “ang sinumang…”. Pinananatili ng “nagpapauna” ang larawan ng pag-una o paglagpas sa wastong kinalalagyan nang hindi agad nilulutas ito bilang tahasang “lumalabag.”
- source_word: μὴ μένων
  choice: hindi nananatili
  rationale: Ang “nananatili” ay likas at makabagong salin ng mahalagang pandiwang Johannine na μένω, at pinananatili nito ang diwa ng pananatili sa isang kalagayan o ugnayan.
- source_word: ἐν τῇ διδαχῇ
  choice: sa turo
  rationale: Ang “turo” ay malinaw at karaniwang salita sa modernong Filipino, hindi kasing-teknikal ng “doktrina,” at angkop sa inuulit na διδαχή.
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Ginamit ang “Mesiyas” para sa Χριστός bilang titulo. Ang kayariang “turo ng Mesiyas” ay hindi nagpapasya kung ito ay turo mula sa Mesiyas o turo tungkol sa Mesiyas.
- source_word: θεὸν οὐκ ἔχει
  choice: wala sa kanya ang Diyos
  rationale: Likas itong paraan sa Filipino upang maipahayag ang tahasang “hindi taglay ang Diyos,” nang hindi ito pinalalawak bilang pakikisama o pakikipag-ugnayan sa Diyos.
- source_word: ὁ μένων ἐν τῇ διδαχῇ
  choice: Ang nananatili sa turo
  rationale: Pinananatili ang paralelismo sa unang sugnay at ang substantibong diwa ng participle.
- source_word: οὗτος
  choice: siya ang
  rationale: Ang kayariang “siya ang” ay natural sa Filipino at pinananatili ang pagbibigay-diin ng οὗτος.
- source_word: καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει
  choice: may kapuwa Ama at Anak
  rationale: Ang “kapuwa…at…” ang natural na katumbas ng magkaugnay na καὶ…καὶ, habang pinananatili ang mga titulong Ama at Anak.
theological_decisions:
- issue: Diwa ng προάγων sa tekstong ito
  choice: nagpapauna
  alternative: lumalampas; nagpapatuloy sa unahan; lumalabag
  rationale: Προάγων, hindi παραβαίνων, ang nasa SBLGNT. Pinananatili ng salin ang talinghaga ng pag-una o paglagpas nang hindi inilalagay sa pangunahing teksto ang mas tahasang interpretasyong “lumalabag.”
- issue: Kahulugan ng “turo ng Mesiyas”
  choice: Pinanatiling siksik at hindi nilutas ang genitive bilang “turo mula sa Mesiyas” o “turo tungkol sa Mesiyas.”
  alternative: turo ng Mesiyas mismo; turo tungkol sa Mesiyas
  rationale: Maaaring taglayin ng Griyegong genitive ang alinmang diwa, at hindi kailangang alisin ng salin ang tunay na kalabuan.
- issue: Titulong Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay gumaganap ang Χριστός bilang titulo; kaya “Mesiyas” ang pinili alinsunod sa patakaran ng proyekto at sa pinagmulan nitong kahulugan.
- issue: Diwa ng “may Diyos”
  choice: wala sa kanya ang Diyos
  alternative: walang pakikisama sa Diyos
  rationale: Pinananatili ang matindi at tuwirang pahayag ng teksto at hindi idinaragdag ang paliwanag na “pakikisama,” bagaman maaaring kaugnay iyon sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “turo” sa halip na mas teknikal na “doktrina,” at ang “siya ang” upang natural na mapanatili ang diin ng Griyego.
