  text: καὶ νῦν ἐρωτῶ σε, κυρία, οὐχ ὡς ἐντολὴν ⸂καινὴν γράφων σοι⸃ ἀλλὰ ἣν εἴχομεν ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/005.yaml
  text: 'And now I ask you[a], lady, not as though I were writing to you a new commandment, but the one we have had from the beginning: that we love one another.'
translation:
  language: tl
  text: At ngayon, hinihiling ko sa iyo, ginang[a]—hindi bilang nagsusulat ako sa iyo ng isang bagong utos, kundi bilang nagsusulat ng utos na taglay na natin mula pa sa simula—na magmahalan tayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy ang “ginang” sa isang iglesia kung ginagamit ito bilang talinghaga; maaari rin namang unawain ang Kyria bilang pangalang pantangi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: hinihiling ko
  rationale: Sa kontekstong liham, ang ἐρωτῶ ay isang magalang na pakiusap. Likas sa modernong Tagalog ang “hinihiling ko” at hindi nito pinalalakas ang diwa tungo sa mas mariing “hinihimok ko.”
- source_word: κυρία
  choice: ginang
  rationale: Ang κυρία ay pambabaeng bokatibo na nangangahulugang “ginang” o “babaing panginoon.” Pinananatili ng “ginang” ang tuwirang pakahulugan nang hindi nagpapasya kung isang babae, isang iglesia, o pangalang pantangi ang tinutukoy.
- source_word: ἐντολὴν καινὴν
  choice: isang bagong utos
  rationale: Tuwirang inililipat nito ang parirala at pinananatili ang ugnayang pampanitikan sa iba pang gamit ni Juan ng “bagong utos.”
- source_word: γράφων σοι
  choice: sumusulat ako sa iyo
  rationale: Ginawang likas sa Tagalog ang pandiwaring Griyego sa loob ng paghahambing na οὐχ ὡς, kaya “para bang sumusulat ako sa iyo.”
- source_word: ἣν εἴχομεν
  choice: ng utos na taglay na natin
  rationale: Bagaman imperfect ang εἴχομεν, ipinahihiwatig ng ἀπ’ ἀρχῆς ang patuloy na pag-aangkin mula noon hanggang ngayon. Ang “taglay na natin” ay malinaw at natural sa Tagalog.
- source_word: ἀπ’ ἀρχῆς
  choice: mula pa sa simula
  rationale: Pinananatili nito ang karaniwang ekspresyong Juanino at ipinakikita ng “pa” ang pagpapatuloy mula sa simula.
- source_word: ἵνα ἀγαπῶμεν ἀλλήλους
  choice: na magmahalan tayo
  rationale: Maaaring magpahayag ang ἵνα ng nilalaman o layunin ng pakiusap. Ang “na magmahalan tayo” ay natural, kapwa-tumbasan, at pinananatili ang hortatoryong diwa.
theological_decisions:
- issue: Ang tinutukoy ng κυρία
  choice: Isinalin nang literal bilang “ginang” nang hindi tiyakang kinikilala ang kausap.
  alternative: Maaaring sagisag ito para sa isang lokal na iglesia; maaari rin namang pangalang pantangi na “Kyria.”
  rationale: Pinahihintulutan ng Griyego ang mga pagpapakahulugang ito. Pinananatili sa pangunahing teksto ang tunay na kalabuan sa halip na lutasin ito ayon sa isang partikular na interpretasyon.
- issue: Ugnayan ng ἵνα-clause sa pakiusap at utos
  choice: Ang “na magmahalan tayo” ay inilagay bilang nilalaman ng pakiusap at, kasabay nito, bilang nilalaman ng utos na tinutukoy.
  alternative: Maaaring ayusin ang pangungusap upang mas tahasang ikabit lamang ang sugnay sa “utos.”
  rationale: Sa Griyego, ang huling sugnay ay likas na nagpapaliwanag sa matagal nang utos habang kinukumpleto rin ang pakiusap ng may-akda. Hindi dapat paliitin ng salin ang dobleng ugnayang ito.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinili ang “ginang” sa halip na mas lipas o mas mapang-uring katawagan. Ang mga gitling ay tumutulong na maipakita ang pagsingit na “hindi… kundi…” nang hindi pinuputol ang pangunahing pakiusap.
