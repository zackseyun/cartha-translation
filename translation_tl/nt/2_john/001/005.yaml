  to: At ngayon, hinihiling ko sa iyo, ginang[a]—hindi bilang nagsusulat ako sa iyo ng isang bagong utos, kundi bilang nagsusulat ng utos na taglay na natin mula pa sa simula—na magmahalan tayo.
  rationale: Inalis ang hindi suportadong “na” at inayos ang paghahambing upang maging malinaw at likas ang “hindi ... kundi ...” na estruktura. Pinanatili ang kalabuan ng κυρία, ang patuloy na diwa ng ἣν εἴχομεν ἀπ’ ἀρχῆς, at ang hortatoryong nilalaman ng ἵνα ἀγαπῶμεν ἀλλήλους.
