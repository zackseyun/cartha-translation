base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/010.yaml
  text: If anyone comes to you and does not bring this teaching, do not receive him into your house, and do not say a greeting to him.
translation:
  language: tl
  text: Kung may dumarating sa inyo na hindi dala ang turong ito, huwag ninyo siyang tanggapin sa inyong bahay at huwag ninyo siyang batiin.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “huwag kayong magsabi sa kaniya ng pagbati.”'
    reason: lexical_alternative
  - marker: b
    text: Sa konteksto, ang babala ay tungkol sa taong dumarating nang hindi dala “ang turong ito”—malamang ay isang naglalakbay na guro na ang mensahe ay lumilihis sa pagpapahayag tungkol kay Cristo sa mga nakapaligid na talata.
    reason: cross_reference
lexical_decisions:
- source_word: εἴ τις
  choice: Kung may
  rationale: Likas na modernong Tagalog para sa pangkalahatan at di-tiyak na kondisyong “if anyone,” nang hindi nililimitahan ang tinutukoy.
- source_word: ἔρχεται πρὸς ὑμᾶς
  choice: pumunta sa inyo
  rationale: Tuwirang nagpapahayag ng paglapit o pagdating sa mga kausap; hindi idinaragdag sa teksto kung pagdalaw ito sa isang indibidwal o sa kapulungan.
- source_word: ταύτην τὴν διδαχήν
  choice: ang turong ito
  rationale: Ang “turo” ay malinaw, kasalukuyan, at hindi labis na teknikal; pinananatili ng “ito” ang demonstratibong puwersa ng Greek.
- source_word: οὐ φέρει
  choice: hindi dala
  rationale: Natural sa Tagalog ang pagdadala ng isang turo o mensahe at napapanatili nito ang larawang nasa φέρει.
- source_word: μὴ λαμβάνετε αὐτὸν
  choice: huwag ninyo siyang tanggapin
  rationale: Ang “tanggapin” ay maaaring tumukoy sa pagtanggap o pagpapatuloy sa isang tao; nililinaw ng kasunod na pariralang tungkol sa bahay ang praktikal na konteksto nang hindi labis na binibigyang-kahulugan.
- source_word: εἰς οἰκίαν
  choice: sa inyong bahay
  rationale: Likas na Tagalog para sa pagpasok o pagtanggap sa bahay. Ang maramihang “inyong” ay umaayon sa ὑμᾶς at sa maramihang pautos.
- source_word: χαίρειν αὐτῷ μὴ λέγετε
  choice: huwag ninyo siyang batiin
  rationale: Ang literal na anyo ay “huwag sabihin sa kaniya ang pagbati,” ngunit ang “huwag siyang batiin” ang natural at tumpak na katumbas sa modernong Tagalog.
theological_decisions:
- issue: Saklaw ng pagbabawal tungkol sa taong hindi dala ang turong ito
  choice: Pinananatili ang kongkretong pagbabawal na tanggapin siya sa bahay at batiin siya, habang ipinapahiwatig sa talababa ang konteksto ng naglalakbay na guro at posibleng pagtataguyod sa kaniyang gawain.
  alternative: Unawain ito bilang lubos na pagbabawal sa anumang pakikisalamuha, o bilang pagbabawal lamang sa opisyal na pagtanggap sa kaniya bilang guro ng kapulungan.
  rationale: Hindi tiyak na nilulutas ng mismong talata ang buong saklaw ng aplikasyon. Kaya hindi pinalalawak o pinakikitid ng pangunahing teksto ang mga kongkretong salita ng Greek.
- issue: Kasarian at bilang ng αὐτόν
  choice: siya
  alternative: lalaking iyon / sila
  rationale: Ang Tagalog na “siya” ay pang-isahan at tapat sa bilang ng Greek ngunit likas na walang markang kasarian; ang tahasang pagdaragdag ng “lalaki” ay magpapasok ng impormasyong hindi kinakailangang iginigiit ng generic na pangungusap.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “turo,” “tanggapin,” at “batiin” bilang karaniwan at malinaw na mga salita. Ang maramihang “ninyo/inyong” ay nagpapanatili sa bilang ng mga kausap sa Greek; ang “siya” ay nagpapanatili sa pang-isahang tinutukoy nang hindi pilit na nagmamarka ng kasarian.
