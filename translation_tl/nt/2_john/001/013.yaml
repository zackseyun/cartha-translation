  text: Ἀσπάζεταί σε τὰ τέκνα τῆς ἀδελφῆς σου τῆς ⸀ἐκλεκτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/013.yaml
  text: The children of your chosen sister greet you.
translation:
  language: tl
  text: Binabati ka ng mga anak ng kapatid mong babaeng pinili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: Binabati
  rationale: Likas at kasalukuyang salin ng pandiwang nangangahulugang magpaabot ng pagbati; ang isahang anyo ng Griyego ay umaayon sa neuter plural na simuno.
- source_word: τὰ τέκνα
  choice: ang mga anak
  rationale: Tuwirang isinasalin ang pangmaramihang τέκνα nang hindi tinutukoy kung literal o matalinghaga ang mga anak.
- source_word: τῆς ἀδελφῆς σου
  choice: ng kapatid mong babae
  rationale: Nililinaw ang kasariang pambabae na tahasang nasa Griyegong ἀδελφῆς; natural pa rin sa modernong Filipino.
- source_word: τῆς ἐκλεκτῆς
  choice: pinili
  rationale: Karaniwang Filipino para sa 'chosen/elect' at pinananatili ang sadyang kaugnayan nito sa 'piniling ginang' sa talata 1.
theological_decisions:
- issue: Kung literal na babae at mga anak o matalinghagang iglesya at mga miyembro ang tinutukoy
  choice: Pinanatili ang anyong 'kapatid mong babaeng pinili' at 'mga anak' nang walang paliwanag sa pangunahing teksto.
  alternative: Tahasan itong isalin bilang kapatid na iglesya at mga kaanib nito.
  rationale: Maaaring tumukoy ang pananalita sa isang aktuwal na babae at pamilya o, sa matalinghagang paraan, sa isang iglesya at mga kaanib nito. Hindi nilulutas ng salin ang tunay na kalabuan ng teksto.
translation_notes:
  register: Maikli, dignified, at natural na modernong Filipino. Ginamit ang 'kapatid mong babae' upang maipakita ang pambabaeng anyo ng Griyego at maiwasan ang maaaring pagbasang lalaking kapatid.
