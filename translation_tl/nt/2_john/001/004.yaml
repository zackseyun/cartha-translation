base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/004.yaml
  text: I rejoiced greatly that I have found some of your children walking in the truth[b][a], just as we received a commandment from the Father.
translation:
  language: tl
  text: Labis akong nagalak dahil natagpuan kong namumuhay ayon sa katotohanan[b] ang ilan sa iyong mga anak[a], gaya ng utos na tinanggap natin mula sa Ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa iyong mga anak.” Ipinahihiwatig ng pananalitang Griyego na ilan sa kanila ang tinutukoy, hindi kinakailangang lahat.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “lumalakad sa katotohanan.” Tumutukoy ito sa pamumuhay na kaayon ng katotohanan, hindi lamang sa pagiging tapat o taos-puso.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην λίαν
  choice: Labis akong nagalak
  rationale: Pinananatili nito ang natapos na tugon ng kagalakan at ang pagpapalakas na hatid ng λίαν, sa natural at marangal na Tagalog.
- source_word: εὕρηκα
  choice: natagpuan ko
  rationale: Bagaman perpekto ang anyong Griyego, higit na natural sa Tagalog ang pangnagdaang “natagpuan ko”; nauunawaan pa rin sa konteksto na mahalaga sa kasalukuyan ang natuklasan.
- source_word: ἐκ τῶν τέκνων σου
  choice: ang ilan sa iyong mga anak
  rationale: Ipinahahayag ng ἐκ na bahagi lamang ng kabuuan ang tinutukoy, kaya hindi ipinahihiwatig na lahat ng mga anak ay nakita niyang namumuhay nang ganito.
- source_word: περιπατοῦντας ἐν ἀληθείᾳ
  choice: namumuhay ayon sa katotohanan
  rationale: Ang περιπατέω ay metapora para sa paraan ng pamumuhay. Ang “ayon sa katotohanan” ay malinaw at likas sa modernong Tagalog habang pinananatili ang etikal na diwa ng parirala.
- source_word: καθὼς ἐντολὴν ἐλάβομεν
  choice: gaya ng iniutos sa atin
  rationale: Isinasalin nito nang natural ang pagkakatulad na ipinakikilala ng καθὼς at ang kolektibong unang panauhan ng ἐλάβομεν. Ang pandiwang “iniutos” ay naghahatid ng bigat ng ἐντολή nang hindi pilit ang nominal na anyo.
- source_word: παρὰ τοῦ πατρός
  choice: ng Ama
  rationale: Pinananatili ang mismong titulong “Ama” at hindi idinaragdag ang “Diyos,” na wala sa tekstong Griyego.
theological_decisions:
- issue: Saklaw ng “iyong mga anak”
  choice: “ang ilan sa iyong mga anak”
  alternative: “ang iyong mga anak” o “mula sa iyong mga anak”
  rationale: 'Partitibo ang ἐκ + genitive: may mga kabilang sa pangkat na natagpuang namumuhay ayon sa katotohanan, ngunit hindi tahasang sinasabing lahat sila.'
- issue: Kahulugan ng ἐν ἀληθείᾳ
  choice: “ayon sa katotohanan”
  alternative: “sa katotohanan” o “nang tapat”
  rationale: Malamang na tumutukoy ito sa pamumuhay na kaayon ng nahayag na katotohanan, hindi lamang sa pagiging taos-puso. Gayunman, kinikilala sa talababa ang mas literal na anyo.
- issue: Referente ng “Ama”
  choice: Panatilihin ang “Ama” nang walang pagpapalawak
  alternative: “Diyos na Ama”
  rationale: “Ang Ama” lamang ang nasa Griyego. Malinaw ang reperente sa kontekstong Juaniko, kaya hindi kailangang magdagdag ng salitang wala sa teksto.
- issue: Ugnayan ng utos at pamumuhay sa katotohanan
  choice: “gaya ng iniutos sa atin ng Ama”
  alternative: “gaya ng utos na tinanggap natin mula sa Ama”
  rationale: Ang mas pandiwang anyo ay natural sa Tagalog at hindi nagpapasya kung isang partikular na utos o ang kabuuang pamantayang ibinigay ng Ama ang nasa isip; pinananatili ang pangunahing ugnayan ng pagsunod at pamumuhay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “namumuhay” sa halip na literal na “lumalakad” sa pangunahing teksto upang maging likas ang etikal na metapora sa Tagalog; pinanatili sa talababa ang literal na larawan. Ang “Labis akong nagalak” ay bahagyang mataas ang rehistro ngunit karaniwan at angkop sa liham na apostoliko.
