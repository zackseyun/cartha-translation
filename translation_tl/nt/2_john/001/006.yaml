  text: καὶ αὕτη ἐστὶν ἡ ἀγάπη, ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ· αὕτη ⸂ἡ ἐντολή ἐστιν⸃, καθὼς ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἐν αὐτῇ περιπατῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/006.yaml
  text: 'And this is love: that we walk according to his commandments. This is the commandment[a], just as you heard from the beginning, that you should walk in it.'
translation:
  language: tl
  text: 'At ito ang pag-ibig: mamuhay tayo ayon sa kanyang mga utos. Ito ang utos[a], gaya ng narinig ninyo mula pa sa simula: mamuhay kayo rito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “mamuhay kayo sa pag-ibig”; maaaring ang “rito” ay tumukoy sa “pag-ibig” sa halip na sa “utos.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: pag-ibig
  rationale: Karaniwang makabagong katumbas ito ng ἀγάπη at pinananatili ang mahalagang ugnayang leksikal sa iba pang gamit ni Juan.
- source_word: ἵνα περιπατῶμεν
  choice: mamuhay tayo
  rationale: Ipinakikilala ng ἵνα rito kung paano naisasagawa ang pag-ibig. Ang hortatoryong “mamuhay tayo” ay natural sa Tagalog at angkop sa unang panauhang maramihan.
- source_word: περιπατέω
  choice: mamuhay
  rationale: Metaporikal ang “paglakad” sa Griyego at tumutukoy sa paraan ng pamumuhay. Mas malinaw at natural sa ordinaryong makabagong Tagalog ang “mamuhay,” at inuulit ito sa dalawang sugnay upang mapanatili ang pagkakaugnay ng mga ito.
- source_word: κατὰ τὰς ἐντολὰς αὐτοῦ
  choice: ayon sa kanyang mga utos
  rationale: Ipinahihiwatig ng κατά na ang pamumuhay ay kaayon o alinsunod sa mga utos. Pinananatili rin ang pangmaramihang anyo ng ἐντολάς.
- source_word: ἐντολάς / ἐντολή
  choice: mga utos / utos
  rationale: Pinananatili ang makabuluhang paglipat mula sa pangmaramihang “mga utos” tungo sa pang-isahang “utos.”
- source_word: αὕτη ἡ ἐντολή ἐστιν
  choice: Ito ang utos
  rationale: Walang tahasang panghalip na paari sa Griyego, kaya hindi idinagdag ang “kanyang.”
- source_word: καθὼς ἠκούσατε ἀπ’ ἀρχῆς
  choice: gaya ng narinig ninyo mula pa sa simula
  rationale: Likas na ipinapahayag nito ang aorist na ἠκούσατε at pinananatili ang Juaninong pariralang “mula pa sa simula.”
- source_word: ἵνα ἐν αὐτῇ περιπατῆτε
  choice: mamuhay kayo ayon dito
  rationale: Natural sa Tagalog ang “mamuhay ayon dito” para sa etikal na diwa ng paglakad sa isang utos. Ang “dito” ay nagpapanatili sa panghalip nang hindi inuulit o tahasang pinapangalanan ang antecedent.
theological_decisions:
- issue: Tinutukoy ng αὐτῇ sa huling sugnay
  choice: Ang pang-isahang “utos” na kaagad na nauuna
  alternative: Ang “pag-ibig” sa unang sugnay
  rationale: Kapuwa pambabaeng pang-isahan sa Griyego ang ἐντολή at ἀγάπη. Mas malapit na antecedent ang ἐντολή, ngunit posible rin sa balarila at kaisipan ang ἀγάπη; kaya pinanatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mamuhay” sa halip na literal na “lumakad” sapagkat mas natural nitong naihahatid sa Tagalog ang etikal na metapora, habang pinananatili ang pag-uulit sa dalawang sugnay. Ang “kanyang” ay hindi tahasang nilinaw kung kanino tumutukoy upang huwag higitan ang ebidensiya ng teksto.
