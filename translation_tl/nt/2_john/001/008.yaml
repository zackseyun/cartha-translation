id: 2JN.1.8
reference: 2 John 1:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: βλέπετε ἑαυτούς, ἵνα μὴ ⸀ἀπολέσητε ἃ ⸀εἰργασάμεθα, ἀλλὰ μισθὸν πλήρη ⸀ἀπολάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/008.yaml
  text: Watch yourselves[a], so that you may not lose what we have worked for, but may receive a full reward.
translation:
  language: tl
  text: Mag-ingat kayo, upang hindi ninyo maiwala ang pinaghirapan namin,[a] kundi matanggap ninyo ang buong gantimpala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “ang pinaghirapan ninyo” sa halip na “ang pinaghirapan namin.”'
    reason: textual_variant
lexical_decisions:
- source_word: βλέπετε ἑαυτούς
  choice: Mag-ingat kayo
  rationale: Ang pangkasalukuyang pautos na maramihan ay nananawagan ng patuloy na pagbabantay sa sarili. Likas at malinaw sa modernong Tagalog ang “Mag-ingat kayo” nang hindi dinaragdagan ang diwa.
- source_word: ἵνα μὴ ἀπολέσητε
  choice: upang hindi ninyo maiwala
  rationale: Ipinahahayag ng ἵνα kasama ng pasakaling pandiwa ang layunin o resultang dapat maiwasan. Ang “maiwala” ay angkop sa pagkawala ng bunga ng pagpapagal, hindi sa pagsira rito.
- source_word: ἃ εἰργασάμεθα
  choice: ang pinaghirapan namin
  rationale: Pinananatili nito ang unang panauhang maramihan ng SBLGNT at likas na ipinahahayag sa Tagalog ang bagay o bungang pinagsikapan, na may nananatiling resulta.
- source_word: μισθὸν πλήρη
  choice: ang buong gantimpala
  rationale: Sa kontekstong ito, mas angkop ang “gantimpala” kaysa “sahod,” at ipinahahayag ng “buong” ang ganap na sukat ng πλήρη.
- source_word: ἀπολάβητε
  choice: matanggap ninyo
  rationale: Malinaw at natural itong katumbas ng aorist subjunctive. Hindi ipinipilit ang posibleng diwang “matanggap muli,” sapagkat hindi iyon tiyak sa konteksto.
theological_decisions:
- issue: Panauhan ng εἰργασάμεθα
  choice: pinaghirapan namin
  alternative: pinaghirapan ninyo
  rationale: Unang panauhang maramihan ang nasa ibinigay na SBLGNT, kaya ito ang nasa pangunahing teksto. Ang kilalang baryanteng ikalawang panauhan ay inilalahad sa talababa upang mapanatili ang tunay na pagkakaiba ng mga manuskrito.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “Mag-ingat kayo” bilang natural na babala sa maramihang kausap, at iniwasan ang labis na pormal o denominasyonal na pananalita.
