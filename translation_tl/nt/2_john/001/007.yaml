  naturalness: Mas natural sa modernong Filipino ang “nagkalat sa sanlibutan” kaysa “lumabas sa sanlibutan.” Ang “dumarating sa laman” ay sinadyang mas malapit sa pormang Griyego at pinananatili ang masalimuot na anyo nito; ang paliwanag ay nasa talababa.
  terminology: Pinananatili ang “Mesiyas” bilang titulo at “antikristo” bilang nakatatag na terminong Filipino. Ang “sa laman” ay pinanatili sa pangunahing teksto upang katumbas ng ἐν σαρκί at upang hindi ipasok ang isang pagpapaliwanag sa halip ng mismong pahayag.
