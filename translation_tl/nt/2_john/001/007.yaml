id: 2JN.1.7
reference: 2 John 1:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι πολλοὶ πλάνοι ⸀ἐξῆλθον εἰς τὸν κόσμον, οἱ μὴ ὁμολογοῦντες Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί· οὗτός ἐστιν ὁ πλάνος καὶ ὁ ἀντίχριστος.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/007.yaml
  text: For many deceivers have gone out into the world[a], those who do not confess Jesus the Messiah coming in the flesh[b]. This is the deceiver and the antichrist.
translation:
  language: tl
  text: Sapagkat maraming manlilinlang ang nagkalat sa sanlibutan—mga hindi nagpapahayag na si Jesus, ang Mesiyas, ay dumarating sa laman.[a] Ang gayong tao ang manlilinlang at ang antikristo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “na dumarating sa laman.” Maaari ring isalin, “na dumating sa laman” o “na dumating bilang tao.” Pinananatili ng pangunahing teksto ang anyong “dumarating” ng Griyego at ang pananalitang “sa laman,” na tumutukoy rito sa tunay na katawang-tao ni Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan para sa naunang pangaral.
- source_word: πολλοὶ πλάνοι
  choice: maraming manlilinlang
  rationale: Tumutukoy sa mga taong nanlilinlang sa iba, hindi lamang sa mga taong naliligaw.
- source_word: ἐξῆλθον εἰς τὸν κόσμον
  choice: lumabas sa sanlibutan
  rationale: Pinananatili ang diwa ng paglabas tungo sa malawak at hayag na gawain nang hindi labis na binibigyang-kahulugan ang κόσμος.
- source_word: οἱ μὴ ὁμολογοῦντες
  choice: mga hindi nagpapahayag
  rationale: Ang ὁμολογέω ay may diwa ng hayag na pagkilala o pagpapahayag; mas natural dito ang 'nagpapahayag' kaysa sa literal ngunit di-karaniwang 'nagkukumpisal.'
- source_word: Ἰησοῦν Χριστόν
  choice: si Jesus ang Mesiyas
  rationale: Ginagamit ang 'Mesiyas' bilang titulo ni Jesus, gaya ng mariing ipinahihiwatig ng nilalaman ng pagpapahayag.
- source_word: ἐρχόμενον ἐν σαρκί
  choice: na dumarating bilang tao
  rationale: Pinananatili ng 'dumarating' ang present participle, samantalang malinaw na ipinahahayag ng 'bilang tao' ang tunay na katawang-tao nang hindi ipinahihiwatig ang makasalanang kalikasan.
- source_word: οὗτός ἐστιν ὁ πλάνος
  choice: Ang gayong tao ang manlilinlang
  rationale: Ipinapakita ng parirala ang pag-iisa sa uri ng taong kababanggit lamang at pinananatili ang ugnayan sa naunang πληάνοι.
- source_word: ὁ ἀντίχριστος
  choice: ang anticristo
  rationale: Ito ang kinikilalang salin at terminong ginagamit sa panitikang Juanino.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Malakas dito ang gamit nito bilang titulo sa nilalaman ng pagpapahayag tungkol kay Jesus.
- issue: Puwersa ng ἐρχόμενον ἐν σαρκί
  choice: na dumarating bilang tao
  alternative: na dumating bilang tao
  rationale: Present participle ang nasa Griyego, kaya pinananatili ang anyong 'dumarating' sa pangunahing teksto sa halip na tahimik na gawin itong ganap na naganap sa nakaraan.
- issue: Kahulugan ng σάρξ
  choice: bilang tao
  alternative: sa laman
  rationale: Sa kontekstong ito, tumutukoy ito sa tunay na pisikal na pagkatao ni Jesus, hindi sa makasalanang kalikasan. Ang natural na Tagalog na 'bilang tao' ay malinaw na naghahatid nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'sanlibutan' upang panatilihin ang tradisyonal ngunit nauunawaang biblikal na register, at 'anticristo' bilang nakatatag nang terminong Tagalog. Ang gitling na em ay nililinaw na ang kasunod na parirala ay naglalarawan sa 'maraming manlilinlang.'
