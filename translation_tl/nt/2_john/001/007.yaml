    rationale: Bagaman tama ang inilalahad nitong tunay na pagkatao, mas mabuting panatilihin sa pangunahing teksto ang mahalagang Juaninong pananalitang “sa laman”; maaaring ipaliwanag ang kahulugan nito sa talababa.
