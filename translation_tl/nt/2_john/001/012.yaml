  to: Marami akong nais isulat sa inyo, ngunit hindi ko ninais na isulat ang mga ito gamit ang papel at tinta. Sa halip, umaasa akong makarating sa inyo at makipag-usap sa inyo nang harap-harapan, upang malubos ang inyong kagalakan.[a]
