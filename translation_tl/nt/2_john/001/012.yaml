  text: Πολλὰ ἔχων ὑμῖν γράφειν οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος, ἀλλὰ ἐλπίζω ⸀γενέσθαι πρὸς ὑμᾶς καὶ στόμα πρὸς στόμα λαλῆσαι, ἵνα ἡ χαρὰ ⸀ὑμῶν ⸂πεπληρωμένη ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/012.yaml
  text: Though I have many things to write to you[a], I did not want to do so with paper and ink. Instead, I hope to come to you and speak face to face, so that your joy may be made complete.
translation:
  language: tl
  text: Marami akong nais isulat sa inyo, ngunit hindi ko ninais na isulat ang mga ito gamit ang papel at tinta. Sa halip, umaasa akong makarating sa inyo at makipag-usap sa inyo nang harap-harapan, upang malubos ang inyong kagalakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “ating kagalakan” sa halip na “inyong kagalakan.”'
    reason: textual_variant
lexical_decisions:
- source_word: Πολλὰ ἔχων ὑμῖν γράφειν
  choice: Marami pa sana akong gustong isulat sa inyo
  rationale: Likas na ipinahahayag sa modernong Tagalog ang diwang konsesibo ng participial construction, habang pinananatili ng “marami” ang pangmaramihang Πολλά at ng “sa inyo” ang tumatanggap ng pagsulat.
- source_word: οὐκ ἐβουλήθην
  choice: ngunit ayaw kong gawin iyon
  rationale: Ang βούλομαι ay nagpapahayag ng pasiya o pagnanais; malinaw at likas sa kasalukuyang Tagalog ang “ayaw kong,” at ang “gawin iyon” ay tumutukoy sa pagsulat ng maraming bagay.
- source_word: διὰ χάρτου καὶ μέλανος
  choice: gamit ang papel at tinta
  rationale: Ipinahahayag ng διά na may genitive ang kasangkapan o paraan. Ang “gamit ang” ay likas na Tagalog at hindi nangangailangan ng teknikal na “papirus.”
- source_word: ἀλλὰ ἐλπίζω γενέσθαι πρὸς ὑμᾶς
  choice: Sa halip, umaasa akong makapunta sa inyo
  rationale: Ang parirala ay idyomatikong tumutukoy sa pagpunta at personal na pagharap sa mga kausap; pinananatili ng “makapunta sa inyo” ang direksiyonal na diwa ng πρός.
- source_word: στόμα πρὸς στόμα λαλῆσαι
  choice: makausap kayo nang harapan
  rationale: Ang literal na “bibig sa bibig” ay mapanlinlang sa modernong Tagalog. Ang “nang harapan” ay tumpak na naghahatid ng tuwirang personal na pag-uusap.
- source_word: ἵνα ἡ χαρὰ ὑμῶν πεπληρωμένη ᾖ
  choice: upang malubos ang inyong kagalakan
  rationale: Pinananatili ng “upang” ang layuning ipinahahayag ng ἵνα. Ang “malubos” ay maikli at likas na paglalarawan sa kagalakang umabot sa ganap na kapuspusan o kaganapan.
theological_decisions:
- issue: Pagkakaiba ng mga manuskrito tungkol sa kung kaninong kagalakan ang tinutukoy
  choice: inyong kagalakan
  alternative: ating kagalakan
  rationale: Sinusunod ng pangunahing teksto ang SBLGNT na ὑμῶν (“inyong”), ngunit inilalagay sa talababa ang makabuluhang variant na ἡμῶν (“ating”) upang hindi ikubli ang tekstuwal at interpretatibong pagkakaiba.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, magalang, at angkop sa liham. Ginamit ang “kagalakan” para sa dignidad ng biblikal na rehistro, ngunit iniwasan ang lipas o sobrang teknikal na pananalita. Inilagay ang talababa kaagad pagkatapos ng pariralang saklaw ng variant.
