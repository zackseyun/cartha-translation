  text: ἡ δὲ ἄνω Ἰερουσαλὴμ ἐλευθέρα ἐστίν, ἥτις ἐστὶν ⸀μήτηρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/026.yaml
  text: But the Jerusalem above is free[a], and she is our mother.
translation:
  language: tl
  text: Ngunit ang Jerusalem sa itaas ay malaya; siya ang ating ina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na siyang ating ina.”
    reason: Ipinakikita ang mas pormal na pagsasalin ng Griyegong panghalip na nag-uugnay sa Jerusalem sa paglalarawan dito bilang ina.
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang malinaw na pagsalungat sa kasalukuyang Jerusalem na binanggit sa naunang talata.
- source_word: ἄνω
  choice: sa itaas
  rationale: Pinananatili ang larawang panlunan at ang kaibahan sa makalupang Jerusalem nang hindi agad binibigyang-kahulugang ‘makalangit.’
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa modernong Filipino.
- source_word: ἐλευθέρα
  choice: malaya
  rationale: Tuwirang inilalarawan ang kalagayan nito at pinananatili ang ugnayan sa paghahambing ng alipin at malaya sa konteksto.
- source_word: ἥτις
  choice: siya
  rationale: Natural sa Filipino ang panghalip na ito para sa personipikadong Jerusalem; hindi nito ipinapasok ang kasariang pambalarila na wala sa mga panghalip sa Filipino.
- source_word: μήτηρ
  choice: ina
  rationale: Pinananatili ang mahalagang talinghaga ng pagiging ina sa pangangatwiran ni Pablo.
- source_word: ἡμῶν
  choice: ating
  rationale: Ang inklusibong anyo ang pinakanatural na pagbasa sa pahayag na tumutukoy sa nagsasalita at sa mga mambabasa bilang magkakasamang anak.
theological_decisions:
- issue: Ang personipikasyon ng ‘Jerusalem sa itaas’
  choice: Isinalin bilang ‘siya ang ating ina.’
  alternative: ‘na siyang ating ina’
  rationale: Malinaw sa alegorya na inilalarawan ang Jerusalem bilang isang ina. Pinananatili ng ‘siya’ ang personipikasyon nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- issue: Ang saklaw ng ‘ating’ (ἡμῶν)
  choice: Ginamit ang inklusibong ‘ating.’
  alternative: ‘aming’
  rationale: Sa konteksto, isinasama ni Pablo ang kanyang sarili at ang kanyang mga mambabasa sa mga anak ng malayang babae; gayunman, hindi dinaragdagan ng salin ang pagkakakilanlan ng pangkat lampas sa sinabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuldok-kuwit upang mapanatili ang malapit na ugnayan ng dalawang pahayag habang natural na naipapakita ang personipikasyon.
