base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/021.yaml
  text: Tell me[a], you who want to be under the law, do you not listen to the law?
translation:
  language: tl
  text: 'Sabihin ninyo sa akin, kayong mga nagnanais mapasailalim sa kautusan: hindi ba ninyo pinakikinggan ang kautusan?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “hindi ba ninyo naririnig ang kautusan?” Ang pandiwang Griyego ay maaaring mangahulugang “marinig” o “pakinggan.” Malamang na ang “kautusan” ay tumutukoy sa Kautusan ni Moises, lalo na sa salaysay ng Kasulatan na susunod na babanggitin ni Pablo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγετέ μοι
  choice: Sabihin ninyo sa akin
  rationale: Likas na modernong Tagalog ito para sa maramihang pautos na naghahamon sa mga kausap na sumagot o mag-isip.
- source_word: οἱ ὑπὸ νόμον θέλοντες εἶναι
  choice: kayong mga nagnanais mapasailalim sa kautusan
  rationale: Pinananatili ng “mapasailalim sa kautusan” ang legal at tipanang larawan ng ὑπὸ νόμον, habang malinaw na inilalarawan ng “kayong mga nagnanais” ang pangkat na tuwirang kinakausap.
- source_word: νόμον / τὸν νόμον
  choice: kautusan / ang kautusan
  rationale: Iisang salitang “kautusan” ang ginamit sa dalawang paglitaw upang mapanatili ang paglalaro ni Pablo sa pagiging nasa ilalim ng kautusan at sa pakikinig sa mismong kautusan. Hindi ito tinukoy pa nang higit sa teksto, bagaman sa konteksto ay tumutukoy sa Kautusan ni Moises at sa salaysay na kasunod niyang sisipiin.
- source_word: οὐκ ἀκούετε
  choice: hindi ba ninyo pinakikinggan
  rationale: Maaaring mangahulugan ang ἀκούω ng simpleng pagdinig o ng maingat na pakikinig/pagbibigay-pansin. Ang “pinakikinggan” ay angkop sa hamon ni Pablo na pansinin ang sinasabi ng Kasulatan, habang inilalahad sa talababa ang leksikal na alternatibo.
theological_decisions:
- issue: Saklaw ng “kautusan”
  choice: Ginamit ang “kautusan” nang hindi dinaragdagan ng “ni Moises,” upang mapanatili ang ugnayan at tensiyon sa pagitan ng legal-tipanang kalagayan at ng tekstong banal na kasulatan.
  alternative: “Kautusan ni Moises” o tahasang “Torah”
  rationale: Sa konteksto, malamang na tumutukoy ito sa Kautusan ni Moises, lalo na sa salaysay na susunod na babanggitin ni Pablo. Gayunman, ang pagdaragdag ng pantukoy na wala sa Griyego ay magpapakitid sa retorikal na paglalaro ng νόμος.
- issue: Diwa ng ἀκούετε
  choice: “pinakikinggan,” na nagpapahiwatig ng pagbibigay-pansin
  alternative: “naririnig”
  rationale: Pinahihintulutan ng pandiwang Griyego ang dalawang diwa. Mas angkop sa argumento ang mas aktibong pakikinig, ngunit pinanatili sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kautusan” bilang pamilyar na katawagang biblikal at ang “mapasailalim” upang panatilihin ang metaporang legal ni Pablo. Ang tutuldok ay natural na naghahanda sa retorikal na tanong.
