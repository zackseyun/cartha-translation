  yaml_path: translation/nt/galatians/004/005.yaml
  text: so that he might redeem those under the law[a], so that we might receive adoption as sons.
translation:
  language: tl
  text: upang tubusin niya ang mga nasa ilalim ng Kautusan, upang matanggap natin ang pag-aampon bilang mga anak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pag-aampon bilang mga anak na lalaki.” Ipinahihiwatig ng terminong Griyego ang ganap na katayuan bilang anak at karapatan sa mana; saklaw nito ang lahat ng sumasampalataya, babae man o lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at natural na ipinapahayag ang layunin sa dalawang sugnay, gaya ng paulit-ulit na ἵνα sa Griyego.
- source_word: τοὺς ὑπὸ νόμον
  choice: ang mga nasa ilalim ng Kautusan
  rationale: Pinananatili ang larawan ng pagiging nasa ilalim ng kapamahalaan ng νόμος; ang malaking titik sa “Kautusan” ay nagpapahiwatig ng Kautusan ni Moises ayon sa konteksto.
- source_word: ἐξαγοράσῃ
  choice: tubusin niya
  rationale: Ang “tubusin” ay natural na terminong Filipino na taglay kapwa ang diwa ng pagpapalaya at ang larawang panghalagang nasa pandiwa.
- source_word: τὴν υἱοθεσίαν
  choice: ang pag-aampon bilang mga anak
  rationale: Pinananatili ang legal at pampamilyang diwa ng υἱοθεσία at ang katayuang may ganap na karapatan sa mana, nang hindi ipinahihiwatig na lalaki lamang ang tinutukoy.
- source_word: ἀπολάβωμεν
  choice: matanggap natin
  rationale: Direkta at likas na katumbas ng pagtanggap; hindi ipinipilit ang posibleng ngunit hindi nangingibabaw na diwang “matanggap muli.”
theological_decisions:
- issue: Ang may kasariang diwa ng υἱοθεσία
  choice: pag-aampon bilang mga anak
  alternative: pag-aampon; pagiging mga anak na lalaki
  rationale: Iniiwasan ng “pagiging mga anak na lalaki” ang maling impresyong lalaki lamang ang kabilang, ngunit pinananatili ng talababa ang makasaysayang diwa ng ganap na katayuan at karapatan sa mana na kaugnay ng terminong Griyego.
- issue: Ang tinutukoy ng τοὺς ὑπὸ νόμον
  choice: ang mga nasa ilalim ng Kautusan
  alternative: ang mga nasa ilalim ng batas
  rationale: Sa agarang konteksto ng Galacia 4:4–5, malamang na ang Kautusan ni Moises ang pangunahing tinutukoy, bagaman hindi pinalalawak sa mismong salin ang paliwanag hinggil sa saklaw nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kautusan” para sa Torah/Mosaic Law at “pag-aampon” para mapanatili ang legal na larawang nasa orihinal.
