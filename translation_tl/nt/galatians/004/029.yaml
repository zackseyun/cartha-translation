  source_fidelity: 'Tumpak na naipapahayag ng salin ang Griyegong balangkas: ang pasalungat na ἀλλ’, ang paghahambing na ὥσπερ τότε ... οὕτως καὶ νῦν, ang dalawang magkahanay na paglalarawan ng ipinanganak, at ang pandiwang ἐδίωκε bilang ‘inusig.’ Ang pag-uulit ng ‘ipinanganak’ sa ikalawang bahagi ay wastong paglilinaw ng elipsis sa Griyego at hindi nagdaragdag ng ibang kahulugan.'
  naturalness: 'Natural at malinaw ang modernong Filipino: “kung paanong noon ... gayon din ngayon” ay angkop na magkatugmang paghahambing. Ang ‘ayon sa laman’ at ‘ayon sa Espiritu’ ay may sinadyang biblikal na rehistro ngunit nananatiling nauunawaan, lalo na dahil sa talababa.'
