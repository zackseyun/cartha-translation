id: GAL.4.29
reference: Galatians 4:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ τότε ὁ κατὰ σάρκα γεννηθεὶς ἐδίωκε τὸν κατὰ πνεῦμα, οὕτως καὶ νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/029.yaml
  text: But just as then the one born according to the flesh persecuted the one born according to the Spirit[b][a], so also it is now.
translation:
  language: tl
  text: Ngunit kung paanong noon ay inusig ng ipinanganak ayon sa laman[a] ang ipinanganak ayon sa Espiritu[b], gayon din ngayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa karaniwang paraan ng tao”; literal, “ayon sa laman.”
    reason: lexical_alternative
  - marker: b
    text: O “ang ayon sa Espiritu.” Ang salitang “ipinanganak” ay ipinahiwatig mula sa unang sugnay at idinagdag dito upang luminaw ang paralelismo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ngunit
  rationale: Malinaw at marangal na panandang pasalungat na nag-uugnay sa naunang paliwanag.
- source_word: ὥσπερ τότε ... οὕτως καὶ νῦν
  choice: kung paanong noon ... gayon din ngayon
  rationale: Pinananatili ang magkatugmang paghahambing at ang kaibahan ng noon at ngayon sa likas na Tagalog.
- source_word: ὁ ... γεννηθεὶς
  choice: ang ipinanganak
  rationale: Natural na nominal na salin ng substantival passive participle; inuulit sa ikalawang sugnay upang luminaw ang paralelismo.
- source_word: κατὰ σάρκα
  choice: ayon sa laman
  rationale: Pinananatili ang sadyang bokabularyo at paghahambing ni Pablo nang hindi ito agad ipinapakahulugang ‘makasalanang kalikasan.’
- source_word: ἐδίωκε
  choice: inusig
  rationale: Tumpak na nagpapahayag ng mapanlabang pagtrato; sapat ang karaniwang aspektong Tagalog upang ilahad ang pangyayari noong panahong iyon.
- source_word: τὸν κατὰ πνεῦμα
  choice: ang ipinanganak ayon sa Espiritu
  rationale: Ang ‘ipinanganak’ ay ipinahiwatig mula sa unang sugnay at inuulit para sa malinaw na paralelismo; ang ‘ayon sa’ ay hindi nagpapakitid sa κατά bilang instrumento lamang.
- source_word: πνεῦμα
  choice: Espiritu
  rationale: Sa konteksto ng Galacia 4, tumutukoy ito sa banal na Espiritung kaugnay ng pangako, kaya ginamit ang malaking titik.
- source_word: νῦν
  choice: ngayon
  rationale: Payak at natural na salin ng temporal na pang-abay.
theological_decisions:
- issue: Kahulugan ng κατὰ σάρκα sa paghahambing kina Ismael at Isaac
  choice: Ang ‘ayon sa laman’ ay tumutukoy sa kapanganakan sa karaniwang paraan ng tao, hindi tuwirang sa makasalanang kalikasan.
  alternative: Ipinanganak ayon sa makasalanang kalikasan; ipinanganak sa makamundong paraan.
  rationale: Sa agarang konteksto ng Galacia 4:23, 29, inihahambing ang karaniwang kapanganakan ni Ismael at ang kapanganakan ni Isaac na kaugnay ng pangako at Espiritu. Pinananatili ng pangunahing teksto ang salitang ‘laman,’ at nililinaw ng talababa ang kahulugan dito.
- issue: Tinutukoy ng πνεῦμα
  choice: Ang Espiritu Santo
  alternative: Espiritu ng tao; espirituwal na larangan o prinsipyo.
  rationale: Ang paghahambing sa laman, pangako, at kasalukuyang pagkakakilanlan ng mga mananampalataya sa Galacia ay higit na tumuturo sa banal na Espiritu, ngunit nananatiling malapit sa anyo ng Griyego ang salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga pariralang ‘ayon sa laman’ at ‘ayon sa Espiritu’ upang maingatan ang teolohikal na tensiyon at paralelismo ng Griyego, habang ipinaliliwanag sa mga talababa ang maaaring maging malabong kahulugan.
