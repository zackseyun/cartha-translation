id: GAL.4.14
reference: Galatians 4:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὸν πειρασμὸν ⸀ὑμῶν ἐν τῇ σαρκί μου οὐκ ἐξουθενήσατε οὐδὲ ἐξεπτύσατε, ἀλλὰ ὡς ἄγγελον θεοῦ ἐδέξασθέ με, ὡς Χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/014.yaml
  text: And though my bodily condition was a trial to you[a], you did not treat me with contempt or disgust; rather, you welcomed me as an angel of God[c][b], as Messiah Jesus.
translation:
  language: tl
  text: At bagaman naging pagsubok sa inyo ang kalagayan ng aking katawan[a], hindi ninyo ako hinamak o kinasuklaman[b]. Sa halip, tinanggap ninyo ako gaya ng isang anghel ng Diyos, gaya ng Mesiyas na si Jesus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang inyong pagsubok sa aking laman.” Mahirap ang tekstuwal at sintaktikong anyo ng pariralang Griyego.
    reason: alternative_reading
  - marker: b
    text: Literal na “hindi ninyo dinuraan”—isang larawan ng matinding pagkasuklam o pagtanggi.
    reason: lexical_alternative
  - marker: c
    text: 'Griyego: “Cristo Jesus.” Isinalin ditong “Mesiyas na si Jesus” sapagkat ginagamit bilang titulo ang Χριστός.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμόν
  choice: pagsubok
  rationale: Sa konteksto, tumutukoy ito sa mabigat na pagsubok na idinulot sa mga taga-Galacia ng pisikal na kalagayan ni Pablo, hindi sa tukso na gumawa ng kasalanan.
- source_word: ὑμῶν ἐν τῇ σαρκί μου
  choice: sa inyo ang kalagayan ng aking katawan
  rationale: Ipinahihiwatig ng mahirap na parirala na ang nasa katawan ni Pablo ang naging pagsubok sa mga taga-Galacia. Natural ito sa Tagalog habang pinananatili sa talababa ang mas literal at sintaktikong posibleng pagbasa.
- source_word: ἐξουθενήσατε
  choice: hinamak
  rationale: Tumpak at natural na ipinahahayag ng “hinamak” ang pagtingin sa isang tao bilang walang halaga o karapat-dapat tanggihan.
- source_word: ἐξεπτύσατε
  choice: kinasuklaman
  rationale: Literal na may larawan ito ng pagdura bilang tanda ng matinding pagkasuklam o pagtanggi. Inihahatid ng “kinasuklaman” ang idiomatikong puwersa, samantalang nasa talababa ang literal na larawan.
- source_word: ἐδέξασθέ
  choice: tinanggap
  rationale: Ipinahahayag nito ang personal at magiliw na pagtanggap kay Pablo; malinaw at dignificado ang “tinanggap” sa modernong Tagalog.
- source_word: ἄγγελον θεοῦ
  choice: isang anghel ng Diyos
  rationale: Bagaman maaari ring mangahulugang “sugo” ang ἄγγελος, ang mataas na paghahambing at ang kasunod na “Mesiyas na si Jesus” ay pumapabor sa karaniwang kahulugang “anghel.”
- source_word: Χριστὸν Ἰησοῦν
  choice: Mesiyas na si Jesus
  rationale: Dito ay gumaganap na titulo ang Χριστός. Ang “Mesiyas na si Jesus” ay natural sa Tagalog at malinaw na pinananatili ang titularyong kahulugan nito.
theological_decisions:
- issue: Kahulugan ng paghahambing na “gaya ng isang anghel ng Diyos, gaya ng Mesiyas na si Jesus”
  choice: Inilalarawan nito ang pambihirang paggalang at pagtanggap ng mga taga-Galacia kay Pablo.
  alternative: Maaaring unawain ang ikalawang paghahambing bilang retorikal na pagpapatindi sa una.
  rationale: Ang dalawang pariralang may ὡς ay nagsasaad kung paano nila tinanggap si Pablo; hindi nito ipinapantay ang pagkakakilanlan o kalikasan ni Pablo kay Jesus.
- issue: Kahulugan ng σάρξ
  choice: Pisikal na katawan o kalagayan ng katawan
  alternative: Makasalanang kalikasan
  rationale: Ang agarang konteksto ay tungkol sa pisikal na kahinaan o karamdaman ni Pablo. Ang moral na kahulugan ay hindi hinihingi ng talata.
- issue: Ugnayan ng “pagsubok,” “sa inyo,” at “sa aking katawan”
  choice: Ang pisikal na kalagayan ni Pablo ang naging pagsubok sa mga taga-Galacia.
  alternative: 'Mas literal: “ang inyong pagsubok sa aking laman,” na maaaring magpanatili ng ibang sintaktikong ugnayan.'
  rationale: Mahirap ang tekstuwal at sintaktikong anyo ng parirala. Pinili sa pangunahing teksto ang pinakanatural na pagbasa sa konteksto, ngunit hindi itinago ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “kalagayan ng aking katawan” upang maiwasan ang di-natural o posibleng mapanlinlang na “sa aking laman,” habang pinanatili sa talababa ang literal na anyo at ang sintaktikong kalabuan. Ang “kinasuklaman” ay idiomatikong salin; nasa talababa ang kongkretong larawan ng pagdura.
