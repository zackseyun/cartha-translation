id: GAL.4.1
reference: Galatians 4:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Λέγω δέ, ἐφ’ ὅσον χρόνον ὁ κληρονόμος νήπιός ἐστιν, οὐδὲν διαφέρει δούλου κύριος πάντων ὤν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/001.yaml
  text: I say that as long as the heir is a child[a], he differs in nothing from a servant, though he is lord of all[b],
translation:
  language: tl
  text: 'Ang ibig kong sabihin: habang bata pa ang tagapagmana[a], wala siyang ipinagkaiba sa isang alipin, kahit siya ang may-ari ng lahat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “menor de edad.” Ang salitang Griyego na νήπιος ay maaaring tumukoy sa isang batang hindi pa nasa hustong gulang.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δέ
  choice: Ang ibig kong sabihin
  rationale: Likas na panandang diskurso sa modernong Tagalog na nagpapakilala ng paliwanag, habang hindi labis na pinatitingkad ang banayad na pang-ugnay na δέ.
- source_word: ἐφ’ ὅσον χρόνον
  choice: habang ... pa
  rationale: Malinaw at natural na ipinahahayag ang tagal na umaabot hanggang sa isang hangganan.
- source_word: ὁ κληρονόμος
  choice: ang tagapagmana
  rationale: Karaniwang salitang Tagalog para sa taong tatanggap ng mana.
- source_word: νήπιός
  choice: bata pa
  rationale: Sa paghahambing tungkol sa mana, tumutukoy ito sa isang anak na hindi pa nasa hustong gulang; pinananatili ng 'bata pa' ang karaniwang wika nang hindi nililimitahan sa sanggol.
- source_word: οὐδὲν διαφέρει
  choice: wala siyang ipinagkaiba
  rationale: Natural na Tagalog na tapat sa ganap na kawalan ng praktikal na pagkakaiba.
- source_word: δούλου
  choice: isang alipin
  rationale: Ipinakikita ng δοῦλος ang katayuang nakagapos at nasa kapangyarihan ng iba, na mahalaga sa lakas ng paghahambing ni Pablo.
- source_word: κύριος πάντων ὤν
  choice: kahit siya ang may-ari ng lahat
  rationale: Dito ang κύριος ay tumutukoy sa pagmamay-ari o kapamahalaan, hindi sa titulong banal; natural na ipinahahayag ng 'kahit' ang diwang pasalungat ng participial construction.
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλος sa paghahambing ni Pablo
  choice: alipin
  alternative: lingkod
  rationale: Mas tumpak na naipakikita ng 'alipin' ang kawalan ng kalayaan at ang pagkasailalim sa kapangyarihan ng iba na siyang mahalagang punto ng paghahambing.
- issue: Kahulugan ng κύριος sa pariralang κύριος πάντων ὤν
  choice: may-ari ng lahat
  alternative: panginoon ng lahat
  rationale: Sa legal na paghahambing tungkol sa tagapagmana, ang tinutukoy ay karapatan sa ari-arian o pamamahala, hindi isang banal na titulo. Iniiwasan din nito ang di-sinasadyang pagpapahiwatig na si Cristo ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang karaniwang 'tagapagmana' at 'alipin'; iniwasan ang sobrang teknikal na 'menor de edad' sa pangunahing teksto. Ang tuldok-kuwit na diwa ng Griyego ay inilahad sa isang malinaw at tuluy-tuloy na pangungusap.
