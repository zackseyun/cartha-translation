translation:
  language: tl
  text: Maingat ninyong sinusunod ang mga araw, mga buwan, mga takdang panahon, at mga taon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Mahigpit ninyong sinusunod ang mga araw, mga buwan, mga kapanahunan, at mga taon.” Tumutukoy ang talaan sa mga pagtalimang nakabatay sa kalendaryo; maaari ring isalin ang “mga takdang panahon” (καιρούς) bilang “mga kapanahunan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας
  choice: mga araw
  rationale: Tuwirang salin ng pangmaramihang ἡμέρα; hindi dinagdagan ng “natatangi” o “banal” sapagkat wala ang mga iyon sa Griyego.
- source_word: παρατηρεῖσθε
  choice: maingat ninyong ipinangingilin
  rationale: Ipinahahayag ng pandiwa ang patuloy at masusing pagtupad o pagtalima sa mga araw ng kalendaryo. Ang “ipinangingilin” ay likas sa Filipino para sa ganitong relihiyoso o ritwal na pagtalima, samantalang pinananatili ng “maingat” ang diwa ng masusing pagmamasid o pagtupad.
- source_word: μῆνας
  choice: mga buwan
  rationale: Tuwirang salin at bahagi ng sunod-sunod na mga yunit ng kalendaryo.
- source_word: καιρούς
  choice: mga takdang panahon
  rationale: Maaaring tumukoy ang καιρός sa mga panahon o oras na itinakda. Sa kontekstong pangkalendaryo, malinaw at likas ang “mga takdang panahon” nang hindi ito tiyak na ginagawang mga kapistahan.
- source_word: ἐνιαυτούς
  choice: mga taon
  rationale: Tuwirang salin na kumukumpleto sa talaan ng mga yunit ng panahon.
- source_word: καὶ
  choice: at
  rationale: Pinananatili ang pang-ugnay at ang naiipong ritmo ng talaan, bagaman ginamit ang natural na pagbabantas sa Filipino.
theological_decisions:
- issue: Kung tahasang tatawaging Judio, banal, o panrelihiyon ang mga pangingilin
  choice: Hindi idinagdag sa pangunahing teksto ang “Judio,” “banal,” o “panrelihiyon.”
  alternative: Maingat ninyong ipinangingilin ang mga banal na araw, mga buwan, mga kapistahan, at mga taon.
  rationale: Mga yunit ng panahon lamang ang tahasang nakatala sa Griyego. Ipinahihiwatig ng konteksto ang kalendaryong pangingilin, ngunit hindi dapat dagdagan ng salin ang partikular na pagkakakilanlan o uri ng mga ito.
- issue: Pagpapakahulugan sa καιρούς
  choice: mga takdang panahon
  alternative: mga kapanahunan
  rationale: Pinananatili ng “mga takdang panahon” ang posibilidad na ang tinutukoy ay mga panahong itinakda para sa pagtalima, ngunit hindi nito nililimitahan ang salita sa “mga kapistahan.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ipinangingilin” dahil mas natural ito kaysa “inoobserbahan” para sa pagtupad sa mga araw at panahong panrelihiyon, nang hindi tahasang dinaragdagan ang Griyego ng “banal” o “Judio.”
