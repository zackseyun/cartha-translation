id: GAL.4.7
reference: Galatians 4:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἶ δοῦλος ἀλλὰ υἱός· εἰ δὲ υἱός, καὶ κληρονόμος ⸂διὰ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/007.yaml
  text: So you are no longer a servant but a son[a]; and if a son[b], then also an heir through God.
translation:
  language: tl
  text: Kaya hindi ka na alipin kundi anak[a]; at kung anak ka, tagapagmana ka rin sa pamamagitan ng Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “anak na lalaki.” Pinananatili ng katawagang ito ang lohika ng pag-aampon at karapatang magmana sa talata, bagaman ang katayuang ito ay para sa lahat ng sumasampalataya.
    reason: lexical_alternative
  - marker: b
    text: 'Sa ilang manuskrito: “tagapagmana ng Diyos sa pamamagitan ni Cristo” (o “ng Mesiyas”), sa halip na “tagapagmana sa pamamagitan ng Diyos.”'
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: Kaya
  rationale: Likas na panandang Filipino para sa kongklusyong ibinubunga ng naunang pangangatwiran.
- source_word: οὐκέτι εἶ
  choice: hindi ka na
  rationale: Tuwirang ipinapahayag ang pagbabago ng kalagayan at pinananatili ang ikalawang panauhang isahan.
- source_word: δοῦλος
  choice: alipin
  rationale: Mas malinaw kaysa “lingkod” sa kontekstong ang pagkaalipin ay itinatapat sa pagiging anak at tagapagmana.
- source_word: υἱός
  choice: anak
  rationale: Ito ang natural at marangal na salin sa modernong Tagalog. Ipinaliliwanag sa talababa na literal na “anak na lalaki” ang Griyego at mahalaga ito sa sinaunang lohika ng pag-aampon at pagmamana.
- source_word: κληρονόμος
  choice: tagapagmana
  rationale: Karaniwang katawagan sa taong may karapatang tumanggap ng mana at angkop sa tema ng talata.
- source_word: διὰ θεοῦ
  choice: sa pamamagitan ng Diyos
  rationale: Pinananatili ang instrumental na diwa ng διά at tapat na sinusunod ang SBLGNT na διὰ θεοῦ.
theological_decisions:
- issue: May kasariang pananalita sa υἱός
  choice: anak, na may paliwanag sa talababa
  alternative: anak na lalaki
  rationale: Ang “anak” ang natural na Filipino at hindi naglilimita sa aplikasyon sa mga lalaki lamang; gayunman, hindi ikinukubli ang literal na anyo at ang legal na lohika ng pagiging anak na tagapagmana, na nililinaw sa talababa.
- issue: Pagbasa sa hulihan ng talata
  choice: sa pamamagitan ng Diyos
  alternative: tagapagmana ng Diyos sa pamamagitan ni Cristo/Mesiyas
  rationale: Sinusunod ng pangunahing teksto ang ibinigay na SBLGNT na διὰ θεοῦ, habang inilalahad sa talababa ang mahalagang tekstuwal na baryante nang hindi ito isinasama sa pangunahing salin.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “alipin” upang mapanatili ang matinding pagtutol sa pagitan ng pagkaalipin at pagiging anak; pinanatili rin ang isahang “ka” ng Griyego. Ang ayos ng pangungusap ay natural sa Tagalog habang nananatiling malinaw ang lohikal na pag-usad mula anak tungo sa tagapagmana.
