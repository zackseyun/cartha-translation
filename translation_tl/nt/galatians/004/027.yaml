  source_fidelity: Tumpak na naisasalin ang pormulang γέγραπται, ang magkapares na pautos na magalak at malakas na magbulalas, ang larawan ng baog na hindi nanganganak at hindi dumaranas ng sakit sa panganganak, at ang paghahambing ng mga anak. Ang “babaeng pinabayaan” ay isang katanggap-tanggap na matalinghagang salin ng τῆς ἐρήμου sa siping ito; hindi nito ipinipilit ang isang partikular na alegorikong pagkakakilanlan.
