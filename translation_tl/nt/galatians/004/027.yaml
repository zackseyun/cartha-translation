id: GAL.4.27
reference: Galatians 4:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Εὐφράνθητι, στεῖρα ἡ οὐ τίκτουσα, ῥῆξον καὶ βόησον, ἡ οὐκ ὠδίνουσα· ὅτι πολλὰ τὰ τέκνα τῆς ἐρήμου μᾶλλον ἢ τῆς ἐχούσης τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/027.yaml
  text: 'For it is written: “Rejoice[a], barren woman who is not bearing children; break forth and cry out, you who are not in labor[c][b]; because the children of the desolate woman are more numerous than those of the woman who has a husband.”'
translation:
  language: tl
  text: 'Sapagkat nasusulat: “Magalak ka[a], babaeng baog na hindi nanganganak; humiyaw ka at sumigaw, ikaw na hindi nakararanas ng sakit sa panganganak; sapagkat mas marami ang mga anak ng babaeng pinabayaan[b] kaysa sa mga anak ng babaeng may asawa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sipi mula sa Isaias 54:1.
    reason: cross_reference
  - marker: b
    text: Ang “pinabayaan” ay maaari ring isaling “iniwan” o “nangungulila” sa matalinghagang kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: nasusulat
  rationale: Karaniwang pormula sa pagsipi sa Kasulatan; naipahihiwatig din nito na nananatiling may bisa ang naisulat.
- source_word: Εὐφράνθητι
  choice: Magalak ka
  rationale: Likas at marangal na pautos na nagpapahayag ng matinding tuwa at angkop sa himig ng siping propetiko.
- source_word: στεῖρα
  choice: babaeng baog
  rationale: Ginagamit ang pang-uri bilang pantawag sa isang babae; malinaw at tuwiran sa modernong Tagalog.
- source_word: ἡ οὐ τίκτουσα
  choice: na hindi nanganganak
  rationale: Pinananatili ang patuloy na kalagayan ng hindi panganganak nang hindi nagpapasok ng paliwanag na wala sa teksto.
- source_word: ῥῆξον καὶ βόησον
  choice: humiyaw ka at sumigaw
  rationale: Ipinahahayag ang bigla at malakas na pagbubulalas; natural sa Tagalog habang pinananatili ang dalawang magkaugnay na pautos.
- source_word: ἡ οὐκ ὠδίνουσα
  choice: ikaw na hindi nakararanas ng sakit sa panganganak
  rationale: Malinaw na inilalarawan ang ὠδίνω bilang pagdanas ng mga sakit ng panganganak.
- source_word: πολλὰ τὰ τέκνα ... μᾶλλον ἢ
  choice: mas marami ang mga anak ... kaysa sa mga anak
  rationale: Natural na paghahambing sa Tagalog at tahasang pinananatili ang ideya ng higit na dami.
- source_word: τῆς ἐρήμου
  choice: ng babaeng pinabayaan
  rationale: Sa matalinghagang konteksto, ang ἔρημος ay maaaring tumukoy sa isang babaeng iniwan, pinabayaan, o nasa kalagayang mapanglaw; ang 'pinabayaan' ay malinaw at hindi naglilimita sa pisikal na ilang.
- source_word: τῆς ἐχούσης τὸν ἄνδρα
  choice: ng babaeng may asawa
  rationale: Tuwirang pinananatili ang kaibahan sa babaeng pinabayaan at ang kahulugan ng ἀνήρ bilang asawa sa kontekstong ito.
theological_decisions:
- issue: Sipi mula sa Lumang Tipan sa alegorikong konteksto ng Galacia 4
  choice: Isinalin nang tuwiran ang larawan sa Isaias 54:1 nang hindi tahasang ipinakikilala sa talata ang pagkakaugnay nito kay Sara o sa Jerusalem sa itaas.
  alternative: Isalin ang sipi sa paraang tahasang nagpapahiwatig sa pagkakakilanlang ibinibigay ng nakapaligid na alegorya.
  rationale: Ang talata ay isang hayagang sipi sa Kasulatan. Dapat manatili ang sariling propetikong larawan nito, habang ang konteksto ng argumento ni Pablo ang nagbibigay ng aplikasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang propetikong indayog at ang maternal na talinghaga, habang iniwasan ang lipas o labis na teknikal na pananalita.
