  to: Ngunit ngayong nakilala na ninyo ang Diyos—o sa halip, nakilala na kayo ng Diyos—paano kayo muling bumabalik sa mahihina at dukhang mga batayang simulain[a], na nais ninyong muling magpaalipin sa mga ito mula sa simula?
