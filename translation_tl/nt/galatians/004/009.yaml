reference: Galatians 4:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: νῦν δὲ γνόντες θεόν, μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ, πῶς ἐπιστρέφετε πάλιν ἐπὶ τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα, οἷς πάλιν ἄνωθεν ⸀δουλεύειν θέλετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/009.yaml
  text: But now[a], having come to know God—or rather, having been known by God—how can you turn back again to the weak and poor elemental principles, to which you want to be enslaved all over again?
translation:
  language: tl
  text: Ngunit ngayong nakilala na ninyo ang Diyos—o sa halip, nakilala na kayo ng Diyos—paano kayo muling bumabalik sa mahihina at dukhang mga batayang simulain[a], na nais ninyong muling magpaalipin sa mga ito mula sa simula?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na στοιχεῖα ay maaari ring mangahulugang “mga sangkap na elemental,” “mga espiritung elemental,” o “mga panimulang bagay.”
    reason: Pinananatili ang pinagtatalunang leksikal na saklaw ng στοιχεῖα nang hindi ipinipilit sa pangunahing teksto ang isang pagbasa lamang.
lexical_decisions:
- source_word: γνόντες θεόν
  choice: nakilala na ninyo ang Diyos
  rationale: Ipinahahayag ang aorist participle sa natural na modernong Tagalog bilang pagpasok nila sa pagkakilala sa Diyos, habang pinananatili ang kaugnayan nito sa pangunahing tanong.
- source_word: μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ
  choice: o mas tamang sabihin, nakilala na kayo ng Diyos
  rationale: 'Pinananatili ang pagwawasto at pagpapalalim ng μᾶλλον δέ at ang tahasang pasibong diwa: ang Diyos ang kumilala sa kanila.'
- source_word: πῶς ἐπιστρέφετε πάλιν
  choice: paano kayo muling bumabalik
  rationale: Ang “paano” ay nagpapanatili sa retorikal at nagtatakang puwersa ng πῶς; ang progresibong pagbabalik ay likas na naipahahayag ng “bumabalik.”
- source_word: ἀσθενῆ καὶ πτωχὰ
  choice: mahihina at dukha
  rationale: Tuwirang isinasalin ang kawalan ng lakas at kayamanan/kakayahan, nang hindi gumagamit ng lipas o sobrang interpretatibong pananalita.
- source_word: στοιχεῖα
  choice: mga στοιχεῖα
  rationale: Dahil walang iisang maikling salitang Tagalog na nagpapanatili sa buong leksikal na saklaw nito, pinanatili ang terminong Griyego sa teksto at ipinaliwanag ang mga posibleng kahulugan sa talababa.
- source_word: οἷς πάλιν ἄνωθεν δουλεύειν θέλετε
  choice: Bakit nais ninyong muling magpaalipin sa mga iyon gaya ng dati?
  rationale: Ang “magpaalipin” ay nagpapanatili sa matinding larawan ng δουλεύειν; ang “muling … gaya ng dati” ay naghahatid sa pinatinding pag-uulit ng πάλιν ἄνωθεν. Hinati sa ikalawang retorikal na tanong para sa malinaw at natural na Tagalog.
theological_decisions:
- issue: Kahulugan ng στοιχεῖα sa Galacia 4:9
  choice: Panatilihin ang στοιχεῖα sa teksto at ilahad sa talababa ang saklaw na “mga pangunahing sangkap o simulain,” na maaari ring tumukoy sa “mga espiritung namamahala sa sanlibutan.”
  alternative: Piliin lamang ang “mga pangunahing simulain” o “mga espiritung στοιχεῖα.”
  rationale: Pinagtatalunan kung ang salita ay tumutukoy sa mga batayang simulain, elementong bumubuo sa sanlibutan, o mga kapangyarihang espirituwal. Ang transliterasyon at talababa ay hindi tahimik na nagpapasya sa tunay na kalabuan ng teksto.
- issue: Puwersa ng “nakilala ng Diyos”
  choice: Panatilihin itong tahasang pasibo bilang pagwawasto sa “nakilala ninyo ang Diyos.”
  alternative: Ipaliwanag bilang “pinili” o “inangkin” sila ng Diyos.
  rationale: Binibigyang-diin ng teksto ang pagkilala ng Diyos bilang mas pangunahing paglalarawan, ngunit hindi nito tahasang ginagamit ang mas tiyak na mga salitang “pinili” o “inangkin.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ninyo/kayo” para sa pangmaramihang kausap. Pinanatili ang matalas na retorikal na pagsaway ni Pablo at iniwasang itali ang στοιχεῖα sa iisang denominasyonal na pagbasa.
