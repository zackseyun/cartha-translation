  naturalness: Mas natural sa modernong Filipino ang isalin ang στοιχεῖα sa teksto kaysa iwan ang salitang Griyego na walang salin. Ang “mga batayang simulain” ay malinaw at marangal; pinananatili ng talababa ang pinagtatalunang saklaw ng termino.
  terminology: Ang “Diyos,” “nakilala,” at “magpaalipin” ay angkop. Ang “mga batayang simulain” ay isang maingat na pangunahing salin para sa στοιχεῖα, nang hindi itinatakda na ito ay mga espiritu o mga materyal na elemento.
