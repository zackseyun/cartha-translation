id: GAL.4.6
reference: Galatians 4:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι δέ ἐστε υἱοί, ἐξαπέστειλεν ὁ θεὸς τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ εἰς τὰς καρδίας ⸀ἡμῶν, κρᾶζον· Αββα ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/006.yaml
  text: And because you are sons[a], God sent the Spirit of his Son into our hearts, crying, “Abba[c][b], Father.”
translation:
  language: tl
  text: At dahil kayo ay mga anak na lalaki[b], isinugo ng Diyos sa ating mga puso[a] ang Espiritu ng kanyang Anak, na sumisigaw, “Abba[c], Ama!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito ay “inyong mga puso” sa halip na “ating mga puso.”
    reason: textual_variant
  - marker: b
    text: Pinananatili ng “mga anak na lalaki” ang pananalita ni Pablo tungkol sa pag-aampon at karapatan sa mana; kabilang dito ang lahat ng mananampalataya, hindi lamang mga lalaki.
    reason: cultural_note
  - marker: c
    text: Ang Abba ay isang Aramaikong pantawag na nangangahulugang “Ama.” Pinanatili ito rito gaya ng nasa orihinal na tekstong Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι δέ
  choice: At dahil
  rationale: Pinananatili nito kapwa ang banayad na pag-uugnay ng δέ at ang pagbibigay-dahilan ng ὅτι, sa natural na Filipino.
- source_word: ἐστε υἱοί
  choice: kayo ay mga anak na lalaki
  rationale: Tahasang panlalaki ang υἱοί at mahalaga sa argumento ni Pablo tungkol sa kalagayan ng anak at sa karapatan sa mana. Nililinaw sa talababa na saklaw nito ang lahat ng mananampalataya, hindi lamang mga lalaki.
- source_word: ἐξαπέστειλεν ὁ θεὸς
  choice: isinugo ng Diyos
  rationale: Ang “isinugo” ay likas at marangal na katumbas ng natapos na pagkilos ng Diyos; pinananatili rin nito ang ugnayan sa pagsusugo sa Anak sa naunang talata.
- source_word: τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ
  choice: ang Espiritu ng kanyang Anak
  rationale: Pinananatili ang ugnayang genitibo at ang teolohikal na bigat ng parirala nang hindi ito labis na ipinapaliwanag.
- source_word: εἰς τὰς καρδίας ἡμῶν
  choice: sa ating mga puso
  rationale: Tapat ito sa SBLGNT na ἡμῶν (“ating”) at pinananatili ang biblikal na larawang “mga puso.” Hindi kailangang gawing “loob” sapagkat malinaw at natural sa Filipino ang napiling anyo.
- source_word: κρᾶζον
  choice: na sumisigaw
  rationale: Ang pang-isahang pandiwaring ito ay tumutukoy sa Espiritu at nagpapahayag ng malakas at hayag na pagtawag. Ang sugnay na “na sumisigaw” ay ginagawang malinaw ang gramatikal na kaugnayan nito sa Espiritu.
- source_word: Αββα ὁ πατήρ
  choice: “Abba, Ama!”
  rationale: Pinananatili ang Aramaikong “Abba” na nasa tekstong Griyego, samantalang ang “Ama” ay natural na anyong pantawag sa Filipino. Ipinahihiwatig ng tandang padamdam ang lakas ng κρᾶζον.
theological_decisions:
- issue: Paglalarawan sa υἱοί sa konteksto ng pag-aampon at mana
  choice: mga anak na lalaki
  alternative: mga anak
  rationale: Ang argumento sa Galacia 3–4 ay nakasalalay sa kalagayan ng “anak na lalaki” na tagapagmana sa sinaunang kontekstong legal. Pinananatili ang anyong ito upang hindi mawala ang talinghaga, habang nililinaw sa talababa na kabilang ang lahat ng mananampalataya.
- issue: Baryanteng teksto sa panghalip na kasama ng “mga puso”
  choice: ating mga puso
  alternative: inyong mga puso
  rationale: Ang ibinigay na SBLGNT ay may ἡμῶν (“ating”), kaya ito ang sinusunod sa pangunahing teksto. Itinatala sa talababa ang kilalang baryanteng “inyong.”
- issue: Kung sino ang sumisigaw
  choice: ang Espiritu ang tahasang sumisigaw
  alternative: ang mga mananampalataya ang sumisigaw sa pamamagitan ng Espiritu
  rationale: Sa gramatika, ang κρᾶζον ay kaayon ng τὸ πνεῦμα, kaya ang Espiritu ang tahasang gumagawa ng pagsigaw sa sugnay. Hindi nito itinatanggi ang pakikibahagi ng mga mananampalataya sa pagtawag sa Diyos bilang Ama.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang “isinugo” at “Espiritu” bilang pamilyar na wikang biblikal, ngunit iniwasan ang lipas o labis na pormal na ayos. Inayos ang mga pananda ng talababa ayon sa mismong salitang tinutukoy: [b] sa “mga anak na lalaki,” [a] sa “ating mga puso,” at [c] sa “Abba.”'
