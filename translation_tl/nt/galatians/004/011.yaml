  terminology: Ang «nangangamba» at «pagpapagal» ay angkop sa pastoral at seryosong rehistro. Ang «para sa inyo» ay sapat para sa pagtuon ng malasakit at ng pagpapagal ni Pablo; hindi kailangang ipilit ang isang di-natural na katumbas ng εἰς.
