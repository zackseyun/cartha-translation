  text: I fear for you[a], that somehow I have labored over you in vain.
translation:
  language: tl
  text: Nangangamba ako para sa inyo[a], na baka nauwi sa wala ang pagpapagal ko para sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Natatakot ako tungkol sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβοῦμαι
  choice: Nangangamba ako
  rationale: Ang pangkasalukuyang pandiwa ay nagpapahayag ng kasalukuyang pangamba ni Pablo; natural at marangal ito sa modernong Tagalog.
- source_word: ὑμᾶς
  choice: para sa inyo
  rationale: Sa ugnayan nito sa φοβοῦμαι, tumutukoy ito sa mga taga-Galacia bilang pinagmamalasakitan, hindi bilang kinatatakutan.
- source_word: μή πως
  choice: na baka
  rationale: Ipinahahayag nito ang nilalaman ng pangamba at pinananatili ang di-tiyak na posibilidad.
- source_word: εἰκῇ
  choice: nawalan ng kabuluhan
  rationale: Ipinahahayag ang ideya ng pagsisikap na maaaring hindi nagbunga o nauwi sa wala.
- source_word: κεκοπίακα
  choice: ang pagpapagal ko
  rationale: Pinananatili ng 'pagpapagal' ang diwa ng matinding gawaing naisagawa na at may kasalukuyang kaugnayan, gaya ng Griyegong perfect.
- source_word: εἰς ὑμᾶς
  choice: para sa inyo
  rationale: Ipinakikita na ang pagpapagal ni Pablo ay iniukol at itin向 sa kanila; ito ang pinakanatural na Tagalog sa konteksto.
theological_decisions:
- issue: Kalikasan ng pangamba ni Pablo
  choice: Pastoral na pangamba na baka hindi nagbunga ang pagpapagal niya sa mga taga-Galacia
  alternative: Pangkalahatan o pansariling pagkabalisa lamang ni Pablo
  rationale: Ang pagkakasunod ng φοβοῦμαι, μή πως, at εἰκῇ κεκοπίακα ay tumutukoy sa pangambang maaaring mawalan ng bunga ang kanyang gawa sa kanila, nang hindi ipinapahayag na tiyak nang nabigo ito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nangangamba” upang maiwasan ang maling pahiwatig na takot si Pablo sa kanila, at ang “na baka” upang mapanatili ang di-tiyak at mapangambang himig ng μή πως.
