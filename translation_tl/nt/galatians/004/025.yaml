  rationale: Inalis ang di-tiyak na demonstratibong “na ito,” inayos ang talababa upang hindi maling isalin ang δέ bilang “sapagkat,” at ginawang “nasa pagkaalipin” ang δουλεύει. Pinanatili ang tuwirang alegorikong pagkakakilanlan, ang temporal na “sa kasalukuyan,” at ang sinadyang hindi paglilinaw kung alin ang ganap na tinutukoy ng “siya” sa huling sugnay.
