base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/025.yaml
  text: Hagar is Mount Sinai in Arabia[a], and she corresponds to the present Jerusalem, for she is enslaved with her children.
translation:
  language: tl
  text: Si Hagar ay ang Bundok Sinai sa Arabia[a], at katumbas siya ng Jerusalem sa kasalukuyan, sapagkat siya ay nasa pagkaalipin kasama ng kanyang mga anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ang Hagar ay ang Bundok Sinai sa Arabia.” May artikulo ang Griyego bago ang “Hagar,” kaya mahirap ang eksaktong kayarian ng sugnay; may ilang salin na ipinakikita ito nang mas tahasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ Ἁγὰρ
  choice: Ang Hagar na ito
  rationale: Ipinahihiwatig ang mahirap na artikulong τὸ bago ang pangalang Hagar nang hindi pinabibigat ang pangungusap; hindi isinalin ang δέ bilang temporal na “ngayon.”
- source_word: Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ
  choice: ay ang Bundok Sinai sa Arabia
  rationale: Pinananatili ang tuwirang pag-uugnay ni Pablo at ang heograpikong pagtukoy, nang hindi ginagawang interpretatibong “kumakatawan sa.”
- source_word: συστοιχεῖ
  choice: katumbas
  rationale: Ipinapahayag ang pagkatapat o pagkabilang sa magkaugnay na hanay sa alegorikong paghahambing ni Pablo.
- source_word: τῇ νῦν Ἰερουσαλήμ
  choice: ng Jerusalem sa kasalukuyan
  rationale: Malinaw na pinananatili ang temporal na νῦν at ang kaibahan nito sa Jerusalem sa itaas sa kasunod na talata.
- source_word: δουλεύει
  choice: siya ay alipin
  rationale: Tuwirang pinananatili ang bokabularyo ng pagkaalipin at ang kaibahan ng pagkaalipin at kalayaan sa konteksto.
- source_word: μετὰ τῶν τέκνων αὐτῆς
  choice: kasama ng kanyang mga anak
  rationale: Pinananatili ang ugnayang pampamilya sa alegorya at ang ideyang kapwa sila nasa kalagayan ng pagkaalipin.
theological_decisions:
- issue: Ang alegorikong pag-uugnay kay Hagar, Sinai, at Jerusalem
  choice: 'Tuwirang isinalin: “Ang Hagar na ito ay ang Bundok Sinai ... at katumbas siya ng Jerusalem...”'
  alternative: “Si Hagar ay kumakatawan sa Bundok Sinai...”
  rationale: Gumagamit ang Griyego ng tuwirang equational na pananalita at saka ng pandiwang nagsasaad ng pagkakatapat; hindi ito pinalambot o pinalawak sa salin.
- issue: Ang kalagayan ng Jerusalem at ng kanyang mga anak
  choice: “siya ay alipin kasama ng kanyang mga anak”
  alternative: “siya at ang kanyang mga anak ay nasa pagkaalipin”
  rationale: Pinananatili ang Jerusalem bilang simuno ng δουλεύει at ang tahasang larawan ng pagiging alipin, nang hindi nilulutas ang retorikal na personipikasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Bundok Sinai,” “katumbas,” at “alipin” upang maging natural sa karaniwang mambabasa habang pinananatili ang tuwirang alegorikong pananalita at teolohikal na tensiyon ng teksto.
