  naturalness: Natural ang “Bundok Sinai,” “katumbas,” at “Jerusalem sa kasalukuyan.” Mas natural at mas tiyak para sa δουλεύει ang “nasa pagkaalipin” kaysa “siya ay alipin,” na maaaring magtunog na literal na katayuang panlipunan sa halip na ang personipikadong kalagayan sa alegorya.
