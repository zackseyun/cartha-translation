id: GAL.4.28
reference: Galatians 4:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂ὑμεῖς δέ, ἀδελφοί, κατὰ Ἰσαὰκ ἐπαγγελίας τέκνα ἐστέ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/028.yaml
  text: You[a], brothers, like Isaac, are children of promise.
translation:
  language: tl
  text: Ngunit kayo, mga kapatid,[a] ay mga anak ng pangako, tulad ni Isaac.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay katawagan sa buong kongregasyon at kabilang dito ang mga lalaki at babae.
    reason: Nililinaw ang inklusibong saklaw ng ἀδελφοί sa konteksto.
lexical_decisions:
- source_word: ὑμεῖς
  choice: kayo
  rationale: Tahasang pinanatili ang panghalip na pangalawang panauhang maramihan; natural din nitong naihahatid ang diin sa mga kausap.
- source_word: δέ
  choice: ngunit
  rationale: Ipinahahayag ang banayad na pagsalungat sa naunang binanggit na mga anak ng aliping babae; mas angkop dito ang “ngunit” kaysa isang panandang temporal.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Likas at marangal na katawagan sa kongregasyon sa modernong Tagalog; maaari itong tumukoy sa mga lalaki at babae nang hindi kinakailangang gawing panlalaki ang anyo.
- source_word: κατὰ Ἰσαὰκ
  choice: tulad ni Isaac
  rationale: Ipinakikita ang paghahambing kay Isaac bilang huwaran ng pagiging anak dahil sa pangako, sa natural na anyong Tagalog.
- source_word: ἐπαγγελίας
  choice: ng pangako
  rationale: Pinananatili ang masinsing pariralang Paulino na “mga anak ng pangako” at ang kaugnayan ng kanilang katayuan sa pangako.
- source_word: τέκνα
  choice: mga anak
  rationale: Natural at walang pagtukoy sa kasarian; malinaw na naghahayag ng katayuang pampamilya.
- source_word: ἐστέ
  choice: ay
  rationale: Ang panandang panaguri na “ay” ang natural at malinaw na katumbas ng copula sa pormal ngunit makabagong Tagalog.
theological_decisions:
- issue: Pagkakaugnay ng mga mananampalataya kay Isaac sa argumento ni Pablo
  choice: “mga anak ng pangako, tulad ni Isaac”
  alternative: “mga ipinangakong anak na tulad ni Isaac”
  rationale: Pinananatili nito si Isaac bilang pinaghahambingang huwaran at ang “mga anak ng pangako” bilang panaguri, nang hindi ipinapalagay na ang mismong mga mambabasa ang tuwirang ipinangako sa parehong paraan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang banayad na pagsalungat ng δέ sa pamamagitan ng “Ngunit,” gayundin ang maikli at teolohikal na pariralang “mga anak ng pangako.”
