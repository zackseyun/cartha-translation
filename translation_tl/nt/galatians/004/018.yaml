  text: But it is good to be sought eagerly for a good purpose at all times[b][a], and not only when I am present with you.
translation:
  language: tl
  text: Ngunit mabuti na lagi kayong masigasig na hangarin nang may mabuting layunin[a][b], at hindi lamang kapag kasama ninyo ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa isang mabuting bagay/usapin.” Maaari rin itong tumukoy sa mabuting paraan o motibo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang Griyegong pawatas na “maging masigasig” o “magpakita ng sigasig.” Gayunman, ang pasibong diwa ay angkop sa paghahangad sa mga taga-Galacia na binanggit sa naunang talata.
    reason: alternative_reading
lexical_decisions:
- source_word: καλὸν
  choice: mabuti
  rationale: Pang-uri itong nagsisilbing panaguri sa pawatas; natural sa Filipino ang konstruksiyong “mabuting …”.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang pagsalungat sa masamang layunin ng mga taong masigasig na humahanap sa mga taga-Galacia sa naunang talata.
- source_word: ζηλοῦσθαι
  choice: masigasig na hangarin
  rationale: Pinananatili ang pasibong diwa ng Griyegong pawatas at ang kahulugan ng matinding pagsisikap o sigasig, ayon sa agarang konteksto ng talata 17.
- source_word: ἐν καλῷ
  choice: para sa mabuting layunin
  rationale: Natural na ipinahahayag sa Filipino ang moral na kalidad o mabuting motibo ng masigasig na paghahangad; ang mas literal na anyo ay inilagay sa talababa.
- source_word: πάντοτε
  choice: lagi
  rationale: Malinaw at natural na katumbas na kaagapay ng kasunod na “hindi lamang.”
- source_word: καὶ μὴ μόνον
  choice: at hindi lamang
  rationale: Tuwirang pinananatili ang koordinasyon at limitasyon ng Griyego.
- source_word: ἐν τῷ παρεῖναί με πρὸς ὑμᾶς
  choice: kapag kasama ninyo ako
  rationale: Ang articular infinitive na may ἐν ay temporal; natural itong nagpapahayag ng panahon ng personal na presensiya ni Pablo.
theological_decisions:
- issue: Tinig at ipinahihiwatig na simuno ng ζηλοῦσθαι
  choice: 'Pasibo: ang mga taga-Galacia ang masigasig na hinahangad'
  alternative: 'Gitna o aktibong diwa: maging masigasig o magpakita ng sigasig'
  rationale: Sa talata 17, ang kaparehong pandiwa ay tumutukoy sa masigasig na paghahangad ng iba sa mga taga-Galacia. Kaya ang pasibong pagbasa rito ang pinakamalinaw na positibong katapat, ngunit tunay na posible ang ibang pag-unawa at nakatala iyon sa talababa.
translation_notes:
  register: Makabago at marangal na Filipino, na may payak na sintaks. Ginamit ang “masigasig na hangarin” upang mapanatili ang lakas ng ζηλόω nang hindi gumamit ng makaluma o labis na romantikong pananalita.
