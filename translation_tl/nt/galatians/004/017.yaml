base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/017.yaml
  text: They are zealous for you[a], but not in a good way. Rather, they want to shut you out[b], so that you may be zealous for them.
translation:
  language: tl
  text: Masidhi ang interes nila sa inyo[a], ngunit hindi sa mabuting paraan. Sa halip, nais nila kayong ibukod[b] upang maging masidhi ang interes ninyo sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Masidhi ang paghahangad nila sa inyo.” Ang pandiwang Griyego ay maaari ring tumukoy sa masugid na paghahangad o pagsisikap na makuha ang loob ng iba.
    reason: lexical_alternative
  - marker: b
    text: O “isara sa labas.” Malamang na nais nila kayong ilayo kay Pablo at sa mga kasama niya upang sa kanila naman kayo magpakita ng masidhing interes, ngunit hindi tahasang sinasabi rito kung kanino o saan kayo ibubukod.
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλοῦσιν / ζηλοῦτε (ζηλόω)
  choice: masigasig sila sa inyo / maging masigasig kayo sa kanila
  rationale: 'Pinananatili ang pag-uulit at baligtarang ugnayan sa Griyego: nagpapakita sila ng masidhing interes sa mga taga-Galacia upang ang mga taga-Galacia naman ay magpakita ng gayong interes sa kanila. Hindi nito nililimitahan ang diwa sa romantikong panliligaw.'
- source_word: οὐ καλῶς
  choice: hindi sa mabuting paraan
  rationale: Likas at malinaw na pahayag sa modernong Filipino na maaaring tumukoy kapuwa sa maling paraan at masamang layunin nang hindi nagpapasya kung alin lamang ang ibig sabihin.
- source_word: ἀλλὰ
  choice: Sa halip
  rationale: Malinaw na naghuhudyat ng pagtutuwid at inilalantad ang layunin ng naunang binanggit na kasigasigan.
- source_word: ἐκκλεῖσαι ὑμᾶς
  choice: nais nila kayong ibukod
  rationale: Ang “ibukod” ay tuwirang naghahatid ng diwang isara sa labas o ihiwalay, habang hindi dinaragdagan sa pangunahing teksto kung kanino o saan sila ibubukod.
- source_word: ἵνα
  choice: upang
  rationale: Natural at tiyak na panandang nagpapahayag ng layunin.
theological_decisions:
- issue: Kung saan o kanino nais ibukod ng mga kalaban ang mga taga-Galacia
  choice: Hindi tinukoy sa pangunahing teksto ang pinagmumulan o pangkat na paglalayuan sa kanila.
  alternative: Tahasang sabihing nais silang ihiwalay kay Pablo at sa mga kasama niya.
  rationale: Hindi binabanggit ng Griyegong pangungusap ang layon ng pagbubukod. Malamang na ang tinutukoy sa konteksto ay si Pablo at ang kaniyang mga kasama, ngunit pinananatili ng salin ang hindi pagkakahayag nito at inilalagay lamang sa talababa ang malamang na paliwanag.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang magkatugmang gamit ng ζηλόω sa simula at wakas sa pamamagitan ng “masigasig,” at iniwasang gawing romantiko ang diwa. Ang “ibukod” ay sadyang hindi nilagyan ng tahasang pinagmumulan upang mapanatili ang pagka-di-tiyak ng orihinal.
