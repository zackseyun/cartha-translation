  yaml_path: translation/nt/galatians/004/031.yaml
  text: Therefore[a], brothers, we are not children of the servant woman[b], but of the free woman.
translation:
  language: tl
  text: Kaya nga, mga kapatid[a], hindi tayo mga anak ng aliping babae[b], kundi ng malayang babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “mga kapatid na lalaki”; maaari itong gamitin bilang katawagan sa isang grupong kinabibilangan din ng mga babae.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “babaeng alipin.” Ang salitang Griyego ay tumutukoy sa isang babaeng alipin o lingkod; dito, si Hagar ang inihahambing kay Sara (Galacia 4:21–31).
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Kaya nga
  rationale: Ipinahihiwatig nito ang kongklusyong hinango ni Pablo mula sa naunang paghahambing; natural sa Filipino at malinaw ang puwersang lohikal.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Karaniwang katawagan sa Filipino para sa mga kapananampalataya at likas na maaaring tumukoy kapwa sa mga lalaki at babae; ipinapaliwanag sa talababa ang anyong panlalaki ng salitang Griyego.
- source_word: οὐκ ἐσμὲν
  choice: hindi tayo
  rationale: Tuwirang isinasalin ang pangkasalukuyang pandiwa at pagtanggi nang hindi nagdaragdag ng diwa na ‘hindi na,’ na wala sa Griyego.
- source_word: παιδίσκης
  choice: ng aliping babae
  rationale: Itinatampok ang kalagayan ni Hagar bilang alipin, na mahalaga sa kaibahan ng pagkaalipin at kalayaan sa argumento.
- source_word: τέκνα
  choice: mga anak
  rationale: Ang salita ay para sa mga anak o supling anuman ang kasarian; ‘mga anak’ ang pinakanatural na katumbas.
- source_word: ἀλλὰ
  choice: kundi
  rationale: Pagkatapos ng negatibong sugnay, natural na ipinakikita ng ‘kundi’ ang tahasang pagsalungat ng dalawang pagkakakilanlan.
- source_word: τῆς ἐλευθέρας
  choice: ng babaeng malaya
  rationale: Ang pang-uring pambabae ay ginagamit bilang pangngalan at tumutukoy kay Sara; nililinaw ng salin ang babaeng tinutukoy at pinananatili ang kaibahan sa alipin.
theological_decisions:
- issue: Gaano kalinaw na ihahayag ang paghahambing ni Pablo kina Hagar at Sara
  choice: aliping babae … babaeng malaya
  alternative: babaeng lingkod … babaeng malaya
  rationale: Nakasalalay ang argumento sa tahasang kaibahan ng pagkaalipin at kalayaan. Pinananatili ito nang hindi nagdaragdag ng doktrinang wala sa talata.
- issue: Pagtukoy ng ἀδελφοί sa isang grupong maaaring binubuo ng mga lalaki at babae
  choice: mga kapatid, na may talababa tungkol sa anyong Griyego
  alternative: mga kapatid na lalaki at babae
  rationale: Ang ‘mga kapatid’ ay natural at inklusibo sa Filipino, samantalang ipinababatid ng talababa na panlalaki ang anyo sa Griyego at maaari itong kumatawan sa buong grupo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Kaya nga’ para sa kongklusyon, ‘mga kapatid’ bilang natural na katawagan sa komunidad, at magkatapat na ‘aliping babae’ at ‘babaeng malaya’ upang mapanatili ang sentrong kaibahan ng Griyego.
