  text: but he is under guardians and stewards until the time set by his father[a][b].
translation:
  language: tl
  text: Ngunit, nasa ilalim siya ng mga tagapangalaga at katiwala[a] hanggang sa panahong itinakda ng kanyang ama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tagapamahala”; ang salitang Griyego ay tumutukoy sa mga namamahala sa isang sambahayan o ari-arian.
    reason: lexical_alternative
  - marker: b
    text: O “hanggang sa takdang panahon ng ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sa halip
  rationale: 'Ipinakikita ang matinding pagsalungat sa naunang pahayag: bagaman tagapagmana ang bata, sa praktika ay nasa ilalim pa rin siya ng iba.'
- source_word: ὑπὸ
  choice: nasa ilalim
  rationale: Pinananatili ang larawan ng pagpapasakop sa awtoridad o pangangasiwa.
- source_word: ἐπιτρόπους
  choice: mga tagapangalaga
  rationale: Tumutukoy sa mga taong pinagkatiwalaang mangalaga at mangasiwa sa isang menor de edad.
- source_word: οἰκονόμους
  choice: mga katiwala
  rationale: Tumutukoy sa mga namamahala sa sambahayan o ari-arian; naiiba ito sa personal na pangangalaga ng mga tagapangalaga.
- source_word: ἄχρι τῆς προθεσμίας
  choice: hanggang sa panahong itinakda
  rationale: Malinaw na ipinahahayag ang takdang hangganan ng panahon at ang diwa ng isang petsa o panahong naunang itinakda.
- source_word: τοῦ πατρός
  choice: ng kanyang ama
  rationale: Likas sa Tagalog at pinananatili ang kaugnayan ng ama sa tagapagmanang binanggit sa konteksto; nauunawaan ang ama bilang nagtakda ng panahon.
theological_decisions:
- issue: Kahulugan ng genitive sa τοῦ πατρός
  choice: “itinakda ng kanyang ama,” na nauunawaan ang ama bilang nagtakda ng panahon
  alternative: Mas pormal na “takdang panahon ng ama,” na maaaring magpanatili ng bahagyang mas malawak na ugnayang genitive
  rationale: Sa paghahambing ni Pablo tungkol sa menor de edad na tagapagmana, pinakamalamang na ang ama ang nagtatakda kung kailan matatapos ang pangangasiwa. Kontekstuwal at panggramatikang pasiya ito, hindi pagdaragdag ng doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapangalaga” para sa personal na pangangasiwa sa bata at “katiwala” para sa pamamahala ng sambahayan o ari-arian. Ang “Sa halip” ay natural na nag-uugnay sa matinding paghahambing sa naunang talata.
