lexical_decisions:
- source_word: τέκνα μου
  choice: Mga anak ko
  rationale: Tuwirang ipinapahayag ang mapagmahal na pagtawag ni Pablo nang hindi idinaragdag ang di-tiyak na diwang ‘maliliit.’
- source_word: οὓς πάλιν ὠδίνω
  choice: muli akong dumaranas ng sakit ng panganganak para sa inyo
  rationale: Pinananatili ang matingkad na metapora ng muling pagdanas ng mga sakit sa panganganak at likas na ipinapahayag sa Tagalog ang kaugnayan nito sa mga taga-Galacia.
- source_word: μέχρις οὗ
  choice: hanggang sa
  rationale: Likas at tuwirang katumbas ng pariralang nagsasaad ng hangganan o layuning temporal.
- source_word: μορφωθῇ
  choice: mah[ubog]
  rationale: Ang ‘mah[ubog]’ ay nagpapanatili sa pasibong diwa ng pagkakaroon ng anyo o pagkakahugis nang hindi ginagawang teknikal na pormulang doktrinal ang metapora.
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Isinasalin ang titulong Χριστός bilang ‘Mesiyas,’ na malinaw at pamilyar sa makabagong Filipino; inilalagay sa talababa ang ‘Kristo’ bilang pamilyar na alternatibo.
- source_word: ἐν ὑμῖν
  choice: sa inyo
  rationale: 'Pinananatili ang sadyang maluwag na saklaw ng pariralang Filipino: maaari itong tumukoy sa pagkahubog sa mga mananampalataya, habang hindi lubusang isinasara ang kolektibong diwa.'
theological_decisions:
- issue: Ang kahulugan ng pagkahubog ng Mesiyas ‘sa inyo’
  choice: Pinananatili ang metapora ng Mesiyas na nahuhubog sa maramihang kausap, nang hindi tinutukoy ang isang tiyak na mekanismong doktrinal.
  alternative: 'Maaaring idiin ang kolektibong kahulugan: ang Mesiyas ay nahuhubog ‘sa gitna ninyo’ bilang isang pamayanan.'
  rationale: Maaaring magtaglay ang Griyegong ἐν ὑμῖν ng panloob at kolektibong pahiwatig. Ang pangunahing salin at talababa ay kapuwa nagpapanatili sa tensiyong ito.
- issue: Pagpapahayag sa Χριστός
  choice: Mesiyas
  alternative: Kristo
  rationale: Ang ‘Mesiyas’ ay nagpapahayag sa tungkuling pamagat, samantalang kinikilala sa talababa ang ‘Kristo’ bilang tradisyonal at pamilyar na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinananatili ang mapagmahal na pagtawag, ang matinding metapora ng panganganak, at ang posibleng panloob o kolektibong diwa ng ἐν ὑμῖν.
