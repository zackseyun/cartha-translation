  text: My children[a], for whom I am again suffering birth pains until Messiah is formed in you[c][b],
translation:
  language: tl
  text: Mga anak ko, muli akong dumaranas ng mga sakit sa panganganak para sa inyo[a] hanggang sa mahubog sa inyo ang Mesiyas[b][c].
  philosophy: optimal-equivalence
  footnotes:
