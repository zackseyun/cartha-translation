id: GAL.4.23
reference: Galatians 4:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ μὲν ἐκ τῆς παιδίσκης κατὰ σάρκα γεγέννηται, ὁ δὲ ἐκ τῆς ἐλευθέρας ⸀δι’ ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/023.yaml
  text: But the son by the servant woman was born according to the flesh[b][a], while the son by the free woman was born through promise.
translation:
  language: tl
  text: Ngunit ang anak ng babaeng alipin ay ipinanganak ayon sa laman[a], samantalang ang anak ng babaeng malaya ay ipinanganak sa pamamagitan ng pangako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sa karaniwang paraan ng tao” o “sa pamamagitan ng likas na kakayahan ng tao.” Sa Griyego: “ayon sa laman.”'
    reason: lexical_alternative
  - marker: b
    text: O “dahil sa pangako.” Tumutukoy ito sa kapanganakang naganap bilang bunga ng pangako ng Diyos, hindi lamang sa karaniwang pag-aanak ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίσκη
  choice: babaeng alipin
  rationale: Pinananatili nito ang kalagayang alipin ni Hagar, na mahalaga sa paghahambing ni Pablo, nang hindi gumagamit ng makaluma o pinalambot na katawagan.
- source_word: κατὰ σάρκα
  choice: ayon sa laman
  rationale: Pinananatili ang susing terminong Pauline na σάρξ at ang tunay na tensiyon nito sa “sa pamamagitan ng pangako.” Ipinaliliwanag sa talababa na sa kontekstong ito ay tumutukoy ito sa karaniwang paraan ng pag-aanak ng tao, hindi sa pagiging makasalanan ng pisikal na kapanganakan.
- source_word: γεγέννηται
  choice: ipinanganak
  rationale: Ito ang likas at malinaw na katumbas sa modernong Tagalog; sapat nitong naihahayag ang pasibong diwa ng pandiwa sa kontekstong ito.
- source_word: ἐλευθέρα
  choice: babaeng malaya
  rationale: Malinaw nitong pinananatili ang panlipunang pagsalungat sa “babaeng alipin,” na sentral sa argumento ng talata.
- source_word: δι’ ἐπαγγελίας
  choice: sa pamamagitan ng pangako
  rationale: Pinananatili nito ang instrumental na diwa ng διά at iniuugnay ang kapanganakan sa pangako ng Diyos nang hindi nagdaragdag ng pantukoy na wala sa pariralang Griyego.
- source_word: ὁ μὲν ... ὁ δὲ
  choice: ang anak ... samantalang ang anak
  rationale: Ginagawang hayag ang ipinahihiwatig na “anak” sa dalawang sugnay at likas na ipinapakita ang paghahambing sa Tagalog.
theological_decisions:
- issue: Ang paghahambing ng κατὰ σάρκα at δι’ ἐπαγγελίας
  choice: Pinanatili ang “ayon sa laman” laban sa “sa pamamagitan ng pangako.”
  alternative: “sa karaniwang paraan ng tao” laban sa “bilang katuparan ng pangako ng Diyos”
  rationale: Ang konteksto ay naghahambing sa karaniwang kapanganakan ng tao at sa kapanganakang naganap dahil sa pangako ng Diyos; hindi nito ipinahihiwatig na makasalanan ang pisikal na kapanganakan. Pinananatili ng pangunahing salin ang terminolohiya at teolohikal na tensiyon ni Pablo, habang nililinaw ng talababa ang kahulugan sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang pariralang “ayon sa laman” dahil mahalaga ito sa bokabularyo ni Pablo, ngunit nilagyan ng talababa upang maiwasang ipakahulugang likas na makasalanan ang pisikal na kapanganakan.
