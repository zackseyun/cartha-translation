base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/012.yaml
  text: Become as I am[a], because I also am as you are, brothers; I beg you[c][b], you did me no wrong.
translation:
  language: tl
  text: 'Mga kapatid, nakikiusap ako sa inyo: maging katulad ko kayo[a], sapagkat ako rin ay katulad ninyo[b]. Wala kayong ginawang masama sa akin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Maging gaya ko kayo.”
    reason: lexical_alternative
  - marker: b
    text: O “ako rin ay naging katulad ninyo.” Walang hayag na pandiwa sa bahaging ito ng Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: Γίνεσθε ὡς ἐγώ
  choice: Maging katulad ninyo ako
  rationale: Pinananatili ng pautos na “maging” ang panawagang pumasok o mamuhay sa isang kalagayan, at natural na ipinapahayag ng “katulad ninyo ako” ang paghahambing sa Tagalog.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pakiusap, hindi ang nilalaman nito.
- source_word: κἀγὼ ὡς ὑμεῖς
  choice: ako rin ay naging katulad ninyo
  rationale: Eliptikal ang Griyego at walang inuulit na pandiwa. Ang “naging” ay makatwirang hinango sa Γίνεσθε at akma sa kontekstong tumutukoy sa pakikibagay ni Pablo sa mga taga-Galacia, habang inilalahad sa talababa ang mas tuwirang alternatibo.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay natural at marangal na tawag sa buong komunidad ng mga mananampalataya sa Tagalog, nang hindi kailangang tukuyin ang kasarian.
- source_word: δέομαι ὑμῶν
  choice: Nakikiusap ako sa inyo
  rationale: Ipinahahayag nito ang taimtim na pakiusap nang natural at hindi lipas ang himig.
- source_word: οὐδέν με ἠδικήσατε
  choice: Wala kayong ginawang masama sa akin
  rationale: Natural na Tagalog ito para sa aorist na pahayag at pinananatili ang tuwirang kaugnayan kay Pablo bilang tumanggap ng posibleng pagkakamali.
theological_decisions:
- issue: Ang saklaw ng ἀδελφοί bilang tawag sa mga iglesia sa Galacia
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Bagaman panlalaking pangmaramihan ang anyong Griyego, malamang na ang buong komunidad—mga lalaki at babae—ang tinutukoy. Sa Tagalog, likas na napapaloob ang dalawang kasarian sa “mga kapatid,” kaya hindi kailangang magdagdag ng salitang wala sa teksto.
- issue: Ang elipsis sa κἀγὼ ὡς ὑμεῖς
  choice: ako rin ay naging katulad ninyo
  alternative: ako rin ay katulad ninyo
  rationale: Maaaring ipahiwatig ng elipsis ang dating pagkilos ni Pablo na makibagay sa kanila o ang kasalukuyang kalagayan niya. Ginamit sa pangunahing teksto ang “naging” dahil sa malapit na pandiwang Γίνεσθε at sa konteksto, ngunit hindi ikinubli ang tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap ang taimtim na pakiusap upang maging natural ang daloy, habang pinananatili ang lahat ng elemento at ang elipsis ng pinagmulan sa pamamagitan ng talababa.
