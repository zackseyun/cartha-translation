  text: γέγραπται γὰρ ὅτι Ἀβραὰμ δύο υἱοὺς ἔσχεν, ἕνα ἐκ τῆς παιδίσκης καὶ ἕνα ἐκ τῆς ἐλευθέρας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/022.yaml
  text: For it is written that Abraham had two sons[a], one by the servant woman and one by the free woman.
translation:
  language: tl
  text: 'Sapagkat nasusulat na nagkaroon si Abraham ng dalawang anak na lalaki: ang isa ay mula sa aliping babae, at ang isa ay mula sa babaeng malaya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: nasusulat
  rationale: Karaniwang pormulang Filipino sa pagpapakilala ng sipi o pahayag mula sa Kasulatan; naipahihiwatig ng anyong ito na ang nasulat ay nananatiling may bisa.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang pangangatwiran ni Pablo.
- source_word: ὅτι
  choice: na
  rationale: Likas na pananda sa Filipino upang ipakilala ang nilalaman ng nasusulat.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Nakaugaliang anyo ng pangalang biblikal sa modernong Filipino.
- source_word: δύο υἱοὺς
  choice: dalawang anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng υἱούς; malinaw at natural ito sa Filipino.
- source_word: ἔσχεν
  choice: nagkaroon
  rationale: Natural na pagpapahayag ng pag-aanak o pagkakaroon ng mga anak nang hindi dinaragdagan ang tiyak na paraan ng pagiging ama.
- source_word: ἕνα ... καὶ ἕνα
  choice: isa ... at isa
  rationale: Pinananatili ang timbang at paralel na kayarian ng Griyego.
- source_word: ἐκ
  choice: mula sa
  rationale: Malapit sa pinagmulan o maternal descent na ipinahahayag ng Griyego at natural sa pariralang Filipino sa kontekstong ito.
- source_word: παιδίσκης
  choice: aliping babae
  rationale: Ipinakikita ang katayuang hindi malaya na mahalaga sa kasunod na paghahambing ni Pablo, habang ang 'babae' ay tumutugma sa paralel na parirala.
- source_word: ἐλευθέρας
  choice: babaeng malaya
  rationale: Substantibong pang-uri na tumutukoy sa isang babaeng may malayang katayuan; malinaw na katapat ng 'aliping babae.'
theological_decisions:
- issue: Pagkakaiba ng katayuang alipin at malaya na sentral sa pangangatwiran ni Pablo
  choice: aliping babae / babaeng malaya
  alternative: babaeng lingkod / babaeng malaya
  rationale: Ang konteksto ay nakasalalay sa pagsalungat ng pagkaalipin at kalayaan. Ang 'aliping babae' ay tahasang nagpapanatili ng kaibhang ito nang hindi nagdaragdag ng doktrinang wala sa teksto.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang 'nasusulat' bilang pamilyar ngunit hindi lipas na pormulang pangkasulatan. Inayos ang huling dalawang parirala nang paralel upang luminaw ang sinadyang paghahambing ng katayuan.
