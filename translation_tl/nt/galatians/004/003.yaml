  yaml_path: translation/nt/galatians/004/003.yaml
  text: So also we[a], when we were children, were enslaved under the elemental principles of the world.
translation:
  language: tl
  text: Gayundin, noong tayo ay mga bata pa, nasa ilalim tayo ng pagkaalipin sa mga panimulang prinsipyo ng sanlibutan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga espirituwal na kapangyarihan ng sanlibutan.” Ang salitang Griyego ay maaaring tumukoy sa mga pangunahing sangkap o elemento, o sa mga kosmikong espirituwal na kapangyarihan.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Gayundin
  rationale: Likas at maikli itong naghahayag ng paghahambing sa naunang paglalarawan tungkol sa tagapagmana.
- source_word: ἡμεῖς
  choice: tayo
  rationale: Pinananatili ang tahasang unang panauhang maramihan at ang diin nito sa Griyego.
- source_word: ὅτε ἦμεν νήπιοι
  choice: noong tayo ay mga bata pa
  rationale: Ipinahihiwatig ng νήπιοι sa konteksto ang pagiging wala pa sa hustong gulang sa paghahambing tungkol sa tagapagmana, hindi lamang literal na sanggol.
- source_word: ὑπὸ
  choice: sa ilalim ng
  rationale: Pinananatili ang larawan ng pagpapasakop at ang paulit-ulit na pananalitang 'sa ilalim' sa konteksto.
- source_word: τὰ στοιχεῖα τοῦ κόσμου
  choice: mga pangunahing sangkap ng sanlibutan
  rationale: Ang 'sangkap' ay nakapagpapanatili sa posibleng kahulugan ng mga batayang elemento o prinsipyo nang hindi tiyak na ginagawang mga espiritung persona ang salita; inilalahad sa talababa ang mahalagang alternatibo.
- source_word: ἤμεθα δεδουλωμένοι
  choice: inalipin tayo
  rationale: Malinaw at matindi nitong pinananatili ang pasibong diwa ng pagkakaalipin, sa natural na ayos ng modernong Tagalog.
theological_decisions:
- issue: Kahulugan ng τὰ στοιχεῖα τοῦ κόσμου
  choice: mga pangunahing sangkap ng sanlibutan
  alternative: mga espiritung kapangyarihan ng sanlibutan; mga pangunahing prinsipyo ng sanlibutan
  rationale: Maaaring tumukoy ang pinagtatalunang parirala sa mga batayang sangkap o prinsipyo, ngunit maaari rin itong tumukoy sa mga kosmikong kapangyarihang espirituwal. Hindi nilulutas nang palihim ng pangunahing salin ang tensiyong ito, at itinatala sa talababa ang alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang 'sanlibutan' upang maipahayag ang κόσμος sa biblikal na konteksto, at pinanatili ang matinding wika ng pagkaalipin.
