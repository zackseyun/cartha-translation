base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/015.yaml
  text: Where then is your blessedness? For I testify to you that[a], if possible[b], you would have torn out your eyes and given them to me.
translation:
  language: tl
  text: Ano na ngayon ang nangyari sa pagpapalang nadama ninyo?[a] Sapagkat nagpapatotoo ako sa inyo na, kung maaari, dinukit sana ninyo ang inyong mga mata[b] at ibinigay ang mga ito sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang inyong pagiging mapalad” o “ang pagpapalang iniuugnay sa inyo.” Ang Griyegong μακαρισμός ay maaaring tumukoy sa kalagayan ng pagiging pinagpala o sa pagpapahayag na pinagpala ang isang tao.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “pagkatapos dukitin ang inyong mga mata.” Malamang na matinding paglalarawan ito ng dati nilang debosyon, bagaman itinuturing ito ng ilan na posibleng pahiwatig sa pisikal na kalagayan ni Pablo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ οὖν
  choice: Ano na ngayon ang nangyari sa
  rationale: Ginawang likas na retorikal na tanong sa Filipino ang literal na “nasaan kung gayon,” na sa konteksto ay nagtatanong kung ano na ang nangyari sa dati nilang saloobin.
- source_word: μακαρισμὸς ὑμῶν
  choice: pagkadama ninyong pinagpala kayo
  rationale: Pinananatili ang diwa ng μακαρισμός bilang kalagayan o pagkilalang pinagpala, at iniuugnay ito sa dati nilang pagtanggap kay Pablo nang hindi ito nililimitahan sa simpleng galak.
- source_word: μαρτυρῶ γὰρ ὑμῖν
  choice: Sapagkat pinatototohanan ko sa inyo
  rationale: Pinananatili ang mariin at halos legal na himig ng μαρτυρέω habang nananatiling malinaw sa makabagong Filipino.
- source_word: εἰ δυνατὸν
  choice: kung maaari lamang
  rationale: Ipinahihiwatig ng “lamang” ang kundisyong hindi naisakatuparan nang hindi pinahahaba o ginagawang higit na tiyak kaysa sa maikling Griyego.
- source_word: τοὺς ὀφθαλμοὺς ὑμῶν ἐξορύξαντες
  choice: dinukit sana ninyo ang inyong mga mata
  rationale: Ang “dinukit” ay nagpapanatili sa matindi at kongkretong larawan ng ἐξορύσσω; ang “sana” ay natural na naghahayag ng di-naganap na kundisyon sa Filipino.
- source_word: ἐδώκατέ μοι
  choice: at ibinigay ang mga iyon sa akin
  rationale: Tuwirang isinasalin ang pangunahing pandiwa at nililinaw ng “mga iyon” na ang tinutukoy ay ang kanilang mga mata.
theological_decisions:
- issue: Kung ang pagbanggit sa mga mata ay dapat unawain bilang literal na detalye, eksaherasyon ng debosyon, o pahiwatig sa karamdaman ni Pablo
  choice: Panatilihin sa pangunahing teksto ang kongkretong larawan ng pagdukot at pagbibigay ng mga mata.
  alternative: Palabnawin ito bilang “ibibigay sana ninyo sa akin ang anumang bagay.”
  rationale: Malinaw na binabanggit ng Griyego ang mga mata at gumagamit ng marahas na pandiwa. Maaaring eksaherasyon ito at maaari ring ipakahulugang pahiwatig sa kalagayan ni Pablo, ngunit hindi dapat pagpasyahan ng salin ang nananatiling bukas sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagkadama ninyong pinagpala kayo” upang maging nauunawaan ang abstraktong μακαρισμός, at pinanatili ang marahas na larawan ng pagdukot ng mga mata sa halip na palambutin ito.
