base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/008.yaml
  text: But at that time[a], when you did not know God, you were enslaved to those that by nature are not gods.
translation:
  language: tl
  text: Ngunit noon[a], nang hindi pa ninyo nakikilala ang Diyos, naglingkod kayo bilang mga alipin sa mga hindi naman talaga diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ngunit dati, hindi ninyo nakikilala ang Diyos at naglingkod kayo bilang mga alipin sa mga hindi diyos ayon sa kanilang likas na kalagayan.”
    reason: Ipinakikita ang alternatibong paglalagay ng dating panahon at ang mas pormal na pagpapahayag ng φύσει, nang hindi ginagawang tahasang sanhi ang participial phrase.
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Ngunit
  rationale: Malinaw na naghuhudyat ng pagsalungat sa naunang argumento at angkop sa marangal ngunit likas na modernong Tagalog.
- source_word: τότε μὲν
  choice: noon
  rationale: Tumutukoy sa dating kalagayan ng mga taga-Galacia at ipinahihiwatig ang paghahambing sa susunod na talata; likas at maikli ito sa Tagalog.
- source_word: οὐκ εἰδότες θεὸν
  choice: nang hindi pa ninyo nakikilala ang Diyos
  rationale: Ipinapahayag ng “nang” ang malamang na temporal na gamit ng participle. Ang “nakikilala” ay mas angkop kaysa simpleng kaalamang tungkol sa Diyos at ang “pa” ay nagpapakita ng dati nilang kalagayan nang hindi dinaragdagan ang diwa.
- source_word: ἐδουλεύσατε
  choice: naglingkod kayo bilang mga alipin
  rationale: Pinananatili nito ang aktibong anyo ng pandiwa at ang mahalagang diwa ng pagkaalipin sa argumento ng Galacia, sa halip na pahinain ito bilang karaniwang paglilingkod lamang.
- source_word: τοῖς ... οὖσι θεοῖς
  choice: sa mga ... diyos
  rationale: Hindi tinutukoy kung ang mga tinutukoy ay mga diyus-diyosan, espiritu, o ibang kapangyarihan, sapagkat hindi iyon tahasang nililinaw ng talata.
- source_word: φύσει μὴ
  choice: hindi naman talaga
  rationale: Sa natural na Tagalog, ipinahahayag nito na ang mga iyon ay hindi diyos sa kung ano talaga ang mga iyon. Iniiwasan nito ang matigas at di-likas na “likas na hindi,” habang pinananatili ang ontolohikal na pagtanggi.
- source_word: θεοῖς
  choice: mga ... diyos
  rationale: Ang maliit na titik at anyong maramihan ay nagpapanatili sa kaibahan ng mga ito sa nag-iisang tunay na Diyos.
theological_decisions:
- issue: Ang likas na pagkakakilanlan ng mga dating pinaglilingkuran
  choice: mga hindi naman talaga diyos
  alternative: mga hindi diyos ayon sa kanilang likas na kalagayan
  rationale: Itinatanggi ng parirala ang pagiging diyos ng mga iyon sa realidad, ngunit hindi nito nilulutas kung ang tinutukoy ay mga diyus-diyosan, mga demonyo, o ibang bagay. Pinananatili ng salin ang ganitong pag-igting nang hindi nagdaragdag ng tiyak na interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “naglingkod ... bilang mga alipin” upang mapanatili kapuwa ang aktibong pandiwa at ang temang pagkaalipin; ginamit ang “hindi naman talaga diyos” bilang natural na katumbas ng ontolohikal na diwa ng φύσει μὴ οὖσι θεοῖς.
