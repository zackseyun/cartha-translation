id: GAL.4.24
reference: Galatians 4:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἅτινά ἐστιν ἀλληγορούμενα· αὗται γάρ εἰσιν δύο διαθῆκαι, μία μὲν ἀπὸ ὄρους Σινᾶ, εἰς δουλείαν γεννῶσα, ἥτις ἐστὶν Ἁγάρ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/024.yaml
  text: 'These things are being interpreted allegorically[a], for these women are two covenants: one from Mount Sinai, bearing children for slavery[b]; she is Hagar.'
translation:
  language: tl
  text: 'Ang mga bagay na ito ay binibigyang-kahulugan sa paraang alegorikal[a], sapagkat ang mga babaeng ito ay dalawang tipan: ang isa ay mula sa Bundok Sinai at nagsisilang ng mga anak tungo sa pagkaalipin[b]; siya ay si Hagar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “na binibigyan ng alegorikal na kahulugan” o “na isang alegorya.” Ipinahihiwatig ng salitang Griyego na ginagamit ni Pablo ang naunang salaysay sa paraang alegorikal.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “para sa pagkaalipin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: Ang mga bagay na ito
  rationale: Tumutukoy pabalik sa naunang salaysay tungkol kina Hagar at Sara at natural na naghahatid ng anaporikong diwa sa Tagalog.
- source_word: ἀλληγορούμενα
  choice: ay binibigyang-kahulugan sa paraang alegorikal
  rationale: Ipinahihiwatig ng periphrastic na anyong pasibo na ginagamit o inuunawa ni Pablo ang naunang salaysay sa paraang alegorikal, nang hindi sinasabing hindi ito makasaysayan.
- source_word: αὗται
  choice: ang mga babaeng ito
  rationale: Ang pambabaeng pangmaramihang demonstratibo ay tumutukoy sa dalawang babaeng kababanggit pa lamang; nilinaw ang tinutukoy para sa likas na Tagalog.
- source_word: διαθῆκαι
  choice: mga tipan
  rationale: Ang 'tipan' ang nakaugaliang salin sa kontekstong biblikal at angkop sa pagtukoy sa Sinai.
- source_word: μία μὲν
  choice: ang isa
  rationale: Sinisimulan nito ang unang bahagi ng paghahambing na ipinagpapatuloy sa kasunod na talata; sapat at natural ang 'ang isa' sa Tagalog.
- source_word: ἀπὸ ὄρους Σινᾶ
  choice: mula sa Bundok Sinai
  rationale: Malinaw na ipinapahayag ang pinagmulan ng tipan at ginagamit ang karaniwang anyo ng pangalan.
- source_word: γεννῶσα
  choice: nagsisilang ng mga anak
  rationale: Pinananatili ang pambabae at maternal na larawan na mahalaga sa alegorikal na paghahambing.
- source_word: εἰς δουλείαν
  choice: tungo sa pagkaalipin
  rationale: Pinananatili ng 'tungo sa' ang diwa ng direksiyon o kinalabasan ng εἰς, habang malinaw na inilalahad ng 'pagkaalipin' ang kalagayang tinutukoy.
- source_word: ἥτις ἐστὶν Ἁγάρ
  choice: siya ay si Hagar
  rationale: Pinananatili ang tuwirang alegorikal na pagkakakilanlan at ang pambabaeng tinutukoy sa natural na Tagalog.
theological_decisions:
- issue: Ang kalikasan ng alegorikal na paggamit ni Pablo sa salaysay nina Sara at Hagar
  choice: Inilalarawan ang salaysay bilang binibigyang-kahulugan sa paraang alegorikal.
  alternative: Sabihing ang mga bagay na ito mismo ay isa lamang alegorya, o ipahiwatig na itinatanggi ang pagiging makasaysayan ng salaysay.
  rationale: Pinananatili ng salin ang interpretatibo at retorikal na gamit ng ἀλληγορούμενα nang hindi nilulutas ang tanong tungkol sa historisidad na hindi tahasang tinatalakay ng talata.
- issue: Lakas at direksiyon ng εἰς δουλείαν
  choice: tungo sa pagkaalipin
  alternative: para sa pagkaalipin; sa pagkakagapos
  rationale: Inihahatid nito ang direksiyon o resultang ipinahihiwatig ng εἰς at ang matinding kalagayan ng δουλεία nang hindi pinahihina bilang karaniwang paglilingkod.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'alegorikal' dahil ito ang tiyak na terminong kailangan sa konteksto, ngunit nilinaw sa pariralang 'sa paraang alegorikal.' Ang lahat ng panandang talababa ay nasa pangunahing teksto.
