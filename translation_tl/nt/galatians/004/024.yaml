  source_fidelity: Tapat ang salin sa Griyego. Ang “Ang mga bagay na ito” ay maayos na tumutukoy sa naunang salaysay; ang “ay binibigyang-kahulugan sa paraang alegorikal” ay naghahatid ng kasalukuyan at pasibong gamit ng ἀλληγορούμενα nang hindi sinasabing ang salaysay ay walang makasaysayang sanggunian. Wasto ang “mga babaeng ito,” “dalawang tipan,” “mula sa Bundok Sinai,” at ang tuwirang pagkakakilanlang “siya ay si Hagar.” Ang “tungo sa pagkaalipin” ay sapat na naghahatid ng direksiyon/resulta ng εἰς δουλείαν.
  naturalness: Makabago, malinaw, at angkop ang antas ng wika para sa saling Kasulatan. Bagaman teknikal ang “alegorikal,” ito ay wastong termino at nililinaw ng pariralang “sa paraang alegorikal.” Natural din ang sintaks ng pangungusap sa Tagalog.
  terminology: Ang “tipan” ay angkop at matatag na salin ng διαθῆκαι sa kontekstong Sinai. Ang “pagkaalipin” ay sapat na malakas na salin ng δουλεία at hindi pinahihina bilang karaniwang paglilingkod. Wasto ang mga pangalang Hagar at Bundok Sinai.
