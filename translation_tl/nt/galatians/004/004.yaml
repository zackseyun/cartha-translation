  text: ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ, γενόμενον ἐκ γυναικός, γενόμενον ὑπὸ νόμον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/004.yaml
  text: But when the fullness of time had come[a], God sent out his Son, born of a woman, born under the law[d][c][b],
translation:
  language: tl
  text: Ngunit nang sumapit ang kaganapan ng panahon[a], isinugo[b] ng Diyos ang kanyang Anak, na ipinanganak ng isang babae[c] at ipinanganak sa ilalim ng kautusan[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang dumating ang ganap na panahon” o “nang makumpleto ang panahon.”
    reason: lexical_alternative
  - marker: b
    text: O “ipinadala.” Ang pandiwang Griyego ay isang pinatinding anyo ng pandiwang nangangahulugang “ipinadala.”
    reason: lexical_alternative
  - marker: c
    text: Mas literal, “mula sa isang babae.” Idiniriin ng parirala ang tunay na kapanganakang pantao ng Anak.
    reason: lexical_alternative
  - marker: d
    text: Ibig sabihin, nasa ilalim ng nasasakupan ng Kautusan ni Moises.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ngunit nang
  rationale: Pinagsasama nito ang banayad na paglipat o pagsalungat ng δέ at ang panandang panahunan ng ὅτε nang hindi pinalalakas nang labis ang kaibahan.
- source_word: ἦλθεν τὸ πλήρωμα τοῦ χρόνου
  choice: dumating ang ganap na panahon
  rationale: Natural itong pahayag sa makabagong Tagalog para sa pagsapit ng panahong umabot na sa kabuuan o katuparan nito; pinananatili ng talababa ang ibang posibleng anyo ng idyoma.
- source_word: ἐξαπέστειλεν
  choice: isinugo
  rationale: Ipinapahayag ng “isinugo” ang sadyang pagpapadala para sa isang misyon at ang lakas ng tambalang pandiwang ἐξαποστέλλω, nang hindi nagiging pilit ang literal na “ipinadala palabas.”
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Tuwirang salin ng simuno, na may likas na pantukoy sa Tagalog.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: ang kanyang Anak
  rationale: Natural na anyo ng layon at panghalip na paari; ang malaking titik sa “Anak” ay tumutukoy sa natatanging referentong malinaw sa konteksto.
- source_word: γενόμενον ἐκ γυναικός
  choice: ipinanganak ng isang babae
  rationale: Sa pariralang ito, ang γενόμενον ay tumutukoy sa tunay na kapanganakang pantao, at malinaw at natural itong naipahahayag ng “ipinanganak.”
- source_word: γενόμενον ὑπὸ νόμον
  choice: ipinanganak sa ilalim ng kautusan
  rationale: Inuulit ang “ipinanganak” upang mapanatili ang magkatulad na estruktura ng dalawang participial phrase at maipahayag na mula sa kanyang kapanganakan ay nasa nasasakupan siya ng kautusan.
- source_word: νόμον
  choice: kautusan
  rationale: Sa konteksto ng Galacia, malakas ang pagtukoy nito sa Kautusan ni Moises. Pinananatiling maikli ng pangunahing teksto ang pahayag ni Pablo, habang nililinaw ng talababa ang saklaw.
theological_decisions:
- issue: Ang tunay na pagkatao ng Anak sa γενόμενον ἐκ γυναικός
  choice: “ipinanganak ng isang babae,” na malinaw na nagsasaad ng tunay na kapanganakang pantao
  alternative: “nagmula sa isang babae” o ang mas literal ngunit malabong “naging mula sa isang babae”
  rationale: Pinananatili ng “ipinanganak” ang tunay na pagkatao ng Anak nang hindi itinatanggi ang ipinahihiwatig na dati na niyang pag-iral sa pananalitang “isinugo ng Diyos ang kanyang Anak.”
- issue: Ang tinutukoy ng νόμος sa ὑπὸ νόμον
  choice: “sa ilalim ng kautusan,” na sa konteksto ay tumutukoy sa nasasakupan ng Kautusan ni Moises
  alternative: “sa ilalim ng batas” sa pangkalahatang diwa
  rationale: Sa argumento ng Galacia, pangunahing tinutukoy ni Pablo ang tipanang Kautusan ni Moises. Hindi ito pinalalawak sa mismong teksto, kaya nananatili ang maigsi at may tensiyong pananalita ni Pablo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “isinugo” sa halip na ang mas mekanikal na “ipinadala palabas,” at “ganap na panahon” upang maging natural habang pinananatili sa talababa ang mas pormal na “kaganapan ng panahon.”
