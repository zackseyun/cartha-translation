  text: ὥστε ἐχθρὸς ὑμῶν γέγονα ἀληθεύων ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/016.yaml
  text: So then[a], have I become your enemy by telling you the truth?
translation:
  language: tl
  text: Kaya, naging kaaway na ba ninyo ako dahil sinasabi ko sa inyo ang totoo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil nagsasalita ako sa inyo nang tapat.” Ang salitang Griyego na ἀληθεύων ay maaaring mangahulugang “nagsasalita nang tapat” o “nagsasabi ng totoo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kaya
  rationale: Naghihinuha ito mula sa naunang sinabi at likas na naghahatid sa retorikal na tanong sa modernong Tagalog.
- source_word: ἐχθρὸς ὑμῶν
  choice: kaaway ninyo
  rationale: Malinaw at karaniwang katumbas ito ng isang taong itinuturing nilang salungat o kaaway.
- source_word: γέγονα
  choice: naging ... na ba ako
  rationale: Ipinahihiwatig ng perpektong anyo ang pagbabagong naganap at ang kalagayang umiiral pa; naipapahayag ito ng “naging ... na” sa Tagalog.
- source_word: ἀληθεύων ὑμῖν
  choice: dahil sinasabi ko sa inyo ang totoo
  rationale: Natural nitong ipinahahayag ang patuloy na pagsasabi ng totoo sa kanila at pinananatili ang posibleng ugnayang sanhi o dahilan ng participle sa retorikal na tanong.
theological_decisions:
- issue: Diwa ng ἀληθεύων sa retorika ni Pablo
  choice: Itinatanong ni Pablo kung naging kaaway nila siya dahil sinasabi niya sa kanila ang totoo.
  alternative: Itinatanong ni Pablo kung naging kaaway nila siya dahil nagsasalita siya sa kanila nang tapat.
  rationale: Ang konteksto ay tungkol sa tuwirang pagsaway at pakikiusap ni Pablo. Ang pangunahing salin ay malinaw sa karaniwang mambabasa, habang inilalahad sa talababa ang tunay na leksikal na lawak nang hindi nagpapasok ng dagdag na doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na natural, tuwiran, at marangal. Pinanatili ang retorikal na tanong at ang diin ng perpektong pandiwa sa pamamagitan ng “naging ... na ba.”
