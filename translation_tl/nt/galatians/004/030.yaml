id: GAL.4.30
reference: Galatians 4:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει ἡ γραφή; Ἔκβαλε τὴν παιδίσκην καὶ τὸν υἱὸν αὐτῆς, οὐ γὰρ μὴ ⸀κληρονομήσει ὁ υἱὸς τῆς παιδίσκης μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/030.yaml
  text: But what does the Scripture say? “Cast out the servant woman and her son[c][b][a], for the son of the servant woman will certainly not inherit with the son of the free woman.”
translation:
  language: tl
  text: Ngunit ano ang sinasabi ng Kasulatan? “Palayasin mo ang aliping babae at ang kanyang anak,[a][b] sapagkat tiyak na hindi magmamana ang anak ng aliping babae kasama ng anak ng babaeng malaya.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay tumutukoy sa isang babaeng alipin o lingkod na hindi malaya; ginamit dito ang “aliping babae” dahil mahalaga sa talata ang pagsalungat ng pagkaalipin at kalayaan.
    reason: lexical_alternative
  - marker: b
    text: Ang sipi ay umaalingawngaw sa Genesis 21:10.
    reason: cross_reference
  - marker: c
    text: 'Mariin ang pagtanggi sa Griyego: “tiyak na hindi magmamana”; maaari ring isaling “hinding-hindi magmamana.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Likas at marangal na panandang pasalungat na nag-uugnay sa naunang pangangatwiran.
- source_word: τί λέγει ἡ γραφή
  choice: ano ang sinasabi ng Kasulatan
  rationale: Pinananatili ang pangkasalukuyang aspekto at ang Kasulatan bilang nagsasalitang awtoridad.
- source_word: Ἔκβαλε
  choice: Palayasin mo
  rationale: Malakas na pautos ito na nagpapahayag ng tahasang pagpapaalis; mas matindi kaysa sa simpleng “paalisin.”
- source_word: παιδίσκην
  choice: aliping babae
  rationale: Malinaw na ipinapahayag ang kalagayang alipin, na mahalaga sa paghahambing ng pagkaalipin at kalayaan sa konteksto.
- source_word: υἱὸν αὐτῆς
  choice: ang kanyang anak
  rationale: Natural na salin ng pariralang paari; hindi kailangang tukuyin muli ang kasarian sapagkat malinaw ito sa konteksto.
- source_word: οὐ γὰρ μὴ κληρονομήσει
  choice: sapagkat tiyak na hindi magmamana
  rationale: Ipinahahayag ng “tiyak na hindi” ang mariing pagtanggi ng οὐ μή na may pandiwang panghinaharap.
- source_word: κληρονομήσει
  choice: magmamana
  rationale: Karaniwan at malinaw na salitang Filipino para sa pagtanggap bilang tagapagmana.
- source_word: μετὰ τοῦ υἱοῦ
  choice: kasama ng anak
  rationale: Ipinapakita ang pakikibahagi o pagsasama sa mana nang hindi nagdaragdag ng paliwanag.
- source_word: τῆς ἐλευθέρας
  choice: ng babaeng malaya
  rationale: Ginagawang hayag ang ipinahihiwatig na pangngalang “babae” at pinananatili ang tuwirang pagsalungat sa aliping babae.
theological_decisions:
- issue: Paglilipat ng παιδίσκη sa alegorya tungkol kina Sara at Hagar
  choice: aliping babae
  alternative: babaeng lingkod; utusang babae
  rationale: Nakasalalay ang pangangatwiran sa nakapaligid na talata sa pagsalungat ng pagkaalipin at kalayaan. Hindi pinalalambot ng salin ang tunay na katayuang panlipunan ng babae.
- issue: Lakas ng pagbubukod sa οὐ γὰρ μὴ κληρονομήσει
  choice: tiyak na hindi magmamana
  alternative: hinding-hindi magmamana; kailanma'y hindi magmamana
  rationale: Pinananatili nito ang kategoryal at mariing pagtanggi ng Griyego nang hindi nagpapasok ng dagdag na paliwanag na teolohikal.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “Kasulatan” bilang nakikilalang banal na teksto, “palayasin” upang mapanatili ang tindi ng pautos, at “aliping babae/babaeng malaya” upang maging malinaw ang sentral na paghahambing.
