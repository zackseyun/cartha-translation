base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/020.yaml
  text: But I wish I could be with you right now and change my tone[a], because I am perplexed about you.
translation:
  language: tl
  text: Ngunit nais ko sanang makapiling kayo ngayon mismo at baguhin ko ang tono ng pagsasalita ko[a], sapagkat naguguluhan ako tungkol sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “baguhin ang aking tinig.” Literal na “tinig” ang salitang Griyego, ngunit malamang na tumutukoy ito rito sa tono o paraan ng pagsasalita ni Pablo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  choice: nais ko sana
  rationale: Ang imperpektong anyo ay nagpapahayag dito ng kasalukuyang hangaring hindi natutupad; natural itong naipahahayag sa Filipino sa pamamagitan ng “nais ko sana.”
- source_word: δὲ
  choice: ngunit
  rationale: Nagbibigay ito ng banayad na pagsalungat o paglipat mula sa naunang panawagan ni Pablo.
- source_word: παρεῖναι πρὸς ὑμᾶς
  choice: makapiling kayo
  rationale: Ipinahahayag nito ang personal na presensiya ni Pablo sa piling ng mga taga-Galacia sa natural na makabagong Filipino.
- source_word: ἄρτι
  choice: ngayon mismo
  rationale: Pinananatili nito ang diin sa kagyat na panahon.
- source_word: ἀλλάξαι τὴν φωνήν μου
  choice: mabago ang tono ng pagsasalita ko
  rationale: Literal na “baguhin ang aking tinig,” ngunit sa konteksto ay malamang na tumutukoy sa paraan o himig ng pakikipag-usap. Ang talababa ay nagpapanatili sa literal na posibilidad.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan ng hangarin ni Pablo sa isang marangal ngunit madaling maunawaang rehistro.
- source_word: ἀποροῦμαι
  choice: naguguluhan ako
  rationale: Ipinahahayag nito ang pagiging palaisip, di-makatiyak, o walang malaman na hakbang, nang hindi nagdaragdag ng tiyak na aksiyong wala sa Griyego.
- source_word: ἐν ὑμῖν
  choice: tungkol sa inyo
  rationale: Dito, ang ἐν ay nagpapahiwatig ng saklaw o kaugnayan ng pagkalito ni Pablo; mas natural ang “tungkol sa inyo” kaysa literal na “sa loob ninyo.”
theological_decisions:
- issue: Kahulugan ng φωνή sa konteksto
  choice: Tono o paraan ng pagsasalita ni Pablo
  alternative: Ang literal na tunog ng kanyang tinig
  rationale: Ang konteksto ng pagsaway at malasakit ay nagpapahiwatig na nais niyang iangkop ang paraan ng pakikipag-usap kung kaharap niya sila, ngunit kinikilala sa talababa ang literal na kahulugan.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “nais ko sana” upang ipakita ang hangaring hindi matupad sa kasalukuyan, at “naguguluhan ako tungkol sa inyo” upang mapanatili ang kawalang-katiyakan ng orihinal nang hindi ito nilulutas bilang isang tiyak na pasiya o kilos.
