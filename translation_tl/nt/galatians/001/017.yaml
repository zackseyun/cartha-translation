  text: οὐδὲ ἀνῆλθον εἰς Ἱεροσόλυμα πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους, ἀλλὰ ἀπῆλθον εἰς Ἀραβίαν, καὶ πάλιν ὑπέστρεψα εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/017.yaml
  text: Nor did I go up to Jerusalem to those who were apostles before me, but I went away to Arabia, and returned again to Damascus.
translation:
  language: tl
  text: Hindi rin ako umakyat sa Jerusalem upang pumunta sa mga apostol na naging apostol bago ako. Sa halip, umalis ako patungong Arabia, at muli akong bumalik sa Damasco.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: Hindi rin
  rationale: Likas na ipinagpapatuloy nito sa Tagalog ang pagtanggi mula sa naunang konteksto at mahigpit na iniuugnay ang pangungusap dito.
- source_word: ἀνῆλθον
  choice: umakyat
  rationale: Pinananatili ang karaniwang pananalita tungkol sa paglalakbay patungong Jerusalem at ang heograpiko o nakaugaliang diwa ng pandiwa.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lungsod sa modernong Filipino.
- source_word: πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους
  choice: upang puntahan ang mga naunang naging apostol kaysa sa akin
  rationale: Malinaw na ipinahahayag ang pagpunta sa kanila at ang temporal na pagkauna ng kanilang pagiging apostol, nang hindi nagpapahiwatig ng higit na ranggo.
- source_word: ἀλλὰ
  choice: Sa halip
  rationale: Natural na naghahayag ng mariing pagsalungat sa hindi pagpunta sa Jerusalem at sa aktuwal na pagpunta sa Arabia.
- source_word: ἀπῆλθον
  choice: pumunta ako
  rationale: Natural sa Filipino para sa paglalakbay; sapat na naihahatid ng kasalungat na sugnay ang diwa ng pag-alis nang hindi gumagamit ng mabigat na pananalita.
- source_word: Ἀραβίαν
  choice: Arabia
  rationale: Karaniwang anyo ng pangalan ng rehiyon; hindi nililimitahan ang di-tiyak na saklaw nito noong panahong iyon.
- source_word: πάλιν
  choice: pagkatapos ay
  rationale: Sa konteksto, ipinahihiwatig ng πάλιν ang kasunod na pagbabalik sa Damasco; ang pagkakasunod na ito ay natural sa Filipino, habang ang 'bumalik' mismo ang naghahatid ng diwang 'back/again.'
- source_word: ὑπέστρεψα
  choice: bumalik ako
  rationale: Pinakamaikli at natural na katumbas sa konteksto ng paglalakbay.
- source_word: Δαμασκόν
  choice: Damasco
  rationale: Nakaugaliang anyong Filipino ng pangalan ng lungsod.
theological_decisions:
- issue: Kahulugan ng “bago/nauna sa akin” tungkol sa mga apostol
  choice: 'Temporal na pagkauna: naging mga apostol sila bago naging apostol si Pablo'
  alternative: Mas mataas sila sa ranggo kaysa kay Pablo
  rationale: Ang πρὸ ἐμοῦ ay pinakanatural na tumutukoy sa pagkauna sa panahon. Ang saling “mga naunang naging apostol kaysa sa akin” ay hindi nag-aangkat ng pahayag tungkol sa ranggo o awtoridad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “umakyat sa Jerusalem” upang mapanatili ang tradisyonal at heograpikong pananalita, at “Damasco” bilang nakaugaliang anyong Filipino.
