base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/004.yaml
  text: who gave himself for our sins so that he might rescue us from the present evil age[a], according to the will of our God and Father,
translation:
  language: tl
  text: na nagbigay ng kanyang sarili para sa ating mga kasalanan, upang iligtas tayo mula sa kasalukuyang masamang kapanahunan[a], ayon sa kalooban ng ating Diyos at Ama,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iligtas tayo mula sa kasalukuyang masamang mundo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δόντος ἑαυτόν
  choice: nagbigay ng kanyang sarili
  rationale: Pinananatili nito ang payak na diwa ng δίδωμι at ang kusang-loob na pagbibigay ng sarili, nang hindi idinaragdag ang mas tiyak na ideya ng ‘ipinaubaya’ o ‘ibinigay bilang handog.’
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: para sa ating mga kasalanan
  rationale: Ang ‘para sa’ ay likas sa modernong Tagalog at pinananatili ang malawak na sakripisyal at mapagtubos na diwa ng ὑπέρ nang hindi nililimitahan ito sa isang partikular na paliwanag ng pagtubos.
- source_word: ἐξέληται
  choice: iligtas
  rationale: Ipinahihiwatig ng ἐξαιρέω ang pagkuha o pagsagip mula sa panganib o mapang-aliping kalagayan. Malinaw at natural sa Tagalog ang ‘iligtas.’
- source_word: αἰῶνος
  choice: kapanahunan
  rationale: Pangunahing tumutukoy ang αἰών sa isang panahon o kaayusang umiiral sa isang panahon, hindi lamang sa pisikal na daigdig. Mas tiyak dito ang ‘kapanahunan’ kaysa ‘mundo.’
- source_word: ἐνεστῶτος
  choice: kasalukuyang
  rationale: Ginagamit ang participle bilang pang-uri para sa umiiral ngayon; tuwirang naihahatid ito ng ‘kasalukuyang.’
- source_word: πονηροῦ
  choice: masamang
  rationale: Inilalarawan nito ang moral na katangian ng kapanahunan. Ang ‘masama’ ang pinakapayak at malinaw na katumbas.
- source_word: κατὰ τὸ θέλημα
  choice: ayon sa kalooban
  rationale: Malinaw nitong ipinapahayag ang pagkakatugma sa layunin o pasiya ng Diyos at likas itong pakinggan sa marangal na modernong Tagalog.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: ng ating Diyos at Ama
  rationale: Pinananatili nito ang ayos ng Griyego at malinaw na iisang persona ang tinutukoy bilang ating Diyos at Ama.
theological_decisions:
- issue: Kung dapat gawing mas tiyak ang diwa ng ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν ayon sa isang partikular na teorya ng pagtubos
  choice: para sa ating mga kasalanan
  alternative: dahil sa ating mga kasalanan; bilang kabayaran sa ating mga kasalanan
  rationale: May sakripisyal at mapagtubos na bigat ang parirala, ngunit hindi tinutukoy ng talata ang buong mekanismo ng pagtubos. Pinananatili ng salin ang bigat at tunay na lawak ng Griyego.
- issue: Kung ang αἰών ay isasaling ‘kapanahunan’ o ‘mundo’
  choice: kasalukuyang masamang kapanahunan
  alternative: masamang mundong ito
  rationale: Temporal at kosmiko ang pananaw ni Pablo rito. Mas tuwirang sinasalamin ng ‘kapanahunan’ ang αἰών, samantalang inilalagay sa talababa ang tradisyonal ngunit mas malawak na ‘mundo.’
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang anyong di-ganap na pangungusap sapagkat nagpapatuloy ang talata mula sa naunang reperensiya kay Jesu-Cristo. Ginamit ang ‘kapanahunan’ upang ihatid ang temporal-kosmikong diwa ng αἰών, habang inilagay sa talababa ang mas tradisyonal na ‘mundo.’
