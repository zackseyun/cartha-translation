base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/019.yaml
  text: But I saw none of the other apostles except James[a], the Lord’s brother.
translation:
  language: tl
  text: Ngunit wala akong nakitang ibang apostol maliban kay Santiago[a], na kapatid ng Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Wala akong nakitang ibang apostol—si Santiago lamang, na kapatid ng Panginoon.” Nauunawaan ng ilan ang pananalitang ito na hindi ibinibilang si Santiago sa mga apostol.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕτερον
  choice: iba
  rationale: Sa partitive na pariralang τῶν ἀποστόλων, tumutukoy ito sa isa pang kabilang sa pangkat; natural sa Tagalog ang “iba sa mga apostol.”
- source_word: δέ
  choice: Ngunit
  rationale: Nagpapakita ito ng banayad na pagsalungat sa naunang pahayag, kaya ang “Ngunit” ay angkop at malinaw.
- source_word: ἀποστόλων
  choice: mga apostol
  rationale: Ito ang kinikilalang terminong Tagalog para sa apostolic circle sa kontekstong Paulino.
- source_word: οὐκ εἶδον
  choice: wala akong nakitang
  rationale: Likas na Tagalog ito para sa tahasang pagtanggi sa nakaraang panahunan at maayos na inuugnay sa partitive na parirala.
- source_word: εἰ μὴ
  choice: maliban kay
  rationale: Dito ay nagsasaad ito ng eksepsiyon, hindi kondisyon; ang “maliban kay” ang natural na anyo bago ang pangalan ng tao.
- source_word: Ἰάκωβον
  choice: Santiago
  rationale: Ito ang nakaugaliang anyo ng pangalang Ἰάκωβος sa mga saling Bibliya sa Tagalog.
- source_word: ἀδελφὸν
  choice: kapatid
  rationale: Pinananatili nito ang karaniwan at tuwirang kahulugan ng salitang Griyego nang hindi ito nilalabnaw bilang kamag-anak lamang.
- source_word: τοῦ κυρίου
  choice: ng Panginoon
  rationale: Ang “Panginoon” ang malinaw at nakaugaliang salin ng titulong κύριος; natural sa Tagalog ang pariralang “kapatid ng Panginoon.”
theological_decisions:
- issue: Kung ibinibilang si Santiago sa “mga apostol” sa kayariang ito
  choice: 'Pinananatili ng pangunahing teksto ang pinakanatural na sintaks: walang ibang apostol na nakita si Pablo maliban kay Santiago, kaya ipinahihiwatig na kabilang si Santiago sa eksepsiyon.'
  alternative: Maaaring unawain na walang ibang apostol na nakita si Pablo bukod kay Pedro, at nakita rin niya si Santiago nang hindi kinakailangang ibilang si Santiago sa mga apostol.
  rationale: Pinakanatural na ipinapasok ng εἰ μή ang isang eksepsiyon sa “wala akong nakitang iba sa mga apostol.” Gayunman, tunay na umiiral ang alternatibong pag-unawa, kaya inilagay ito sa talababa sa halip na lutasin nang tahimik.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Santiago” at “apostol” bilang mga nakaugaliang katawagang biblikal, habang iniwasan ang sobrang teknikal o makalumang ayos.
