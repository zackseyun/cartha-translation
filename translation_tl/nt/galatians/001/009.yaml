  text: ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, εἴ τις ὑμᾶς εὐαγγελίζεται παρ’ ὃ παρελάβετε, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/009.yaml
  text: 'As we have said before[a], so now I say again: if anyone is preaching a gospel to you contrary to what you received[b], let him be accursed.'
translation:
  language: tl
  text: 'Gaya ng sinabi na namin noon, sinasabi ko ngayong muli: Kung may nangangaral sa inyo ng ebanghelyong salungat[a] sa tinanggap ninyo, mapasailalim siya sa sumpa.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “higit sa tinanggap ninyo”; maaaring tumukoy ang parirala sa paglihis mula sa mensaheng tinanggap.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “maging isinumpa siya.” Sa Griyego: anathema estō.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς προειρήκαμεν
  choice: Gaya ng sinabi na namin noon
  rationale: Ipinahihiwatig ng προειρήκαμεν ang nauna nang sinabi na nananatiling mahalaga; likas sa modernong Tagalog ang pananalitang ito.
- source_word: ἄρτι πάλιν λέγω
  choice: sinasabi ko ngayon muli
  rationale: Pinananatili ng “ngayon” ang ἄρτι at ng “muli” ang pag-uulit na ipinahahayag ng πάλιν.
- source_word: εἴ τις ὑμᾶς εὐαγγελίζεται
  choice: Kung may nangangaral sa inyo ng ebanghelyo
  rationale: Ipinapakita ng “nangangaral” ang patuloy o kasalukuyang pagpapahayag, habang ang “ebanghelyo” ay ang mensaheng pinagtatalunan sa konteksto.
- source_word: παρ’ ὃ
  choice: salungat sa
  rationale: Sa konteksto, ang παρά ay nagpapahiwatig ng paglihis o pagsalungat sa mensaheng tinanggap, hindi lamang simpleng karagdagan.
- source_word: παρελάβετε
  choice: tinanggap ninyo
  rationale: Tumpak at natural na inilalarawan nito ang pagtanggap sa ipinasa o ipinangaral na mensahe.
- source_word: ἀνάθεμα ἔστω
  choice: sumpain siya
  rationale: Pinananatili nito ang matindi at pormal na bisa ng utos o hatol nang hindi nagdaragdag kung sino ang nagpapataw ng sumpa.
theological_decisions:
- issue: Bisa ng ἀνάθεμα ἔστω
  choice: sumpain siya
  alternative: mapasailalim siya sa sumpa
  rationale: Tahasang pinananatili ang bigat ng paghatol ni Pablo ngunit hindi idinaragdag ang “ng Diyos,” na hindi hayagang nasa pariralang Griyego.
- issue: Kahulugan ng παρ’ ὃ
  choice: salungat sa tinanggap ninyo
  alternative: higit sa tinanggap ninyo
  rationale: Mas angkop sa polemikong konteksto ang pagsalungat o paglihis, ngunit inilalagay sa talababa ang posibleng literal na saklaw na “higit sa.”
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “ebanghelyo” bilang pamilyar na terminong biblikal, at iniwasan ang labis na teknikal o denominasyonal na pananalita.
