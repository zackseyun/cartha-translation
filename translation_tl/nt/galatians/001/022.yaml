  text: ἤμην δὲ ἀγνοούμενος τῷ προσώπῳ ταῖς ἐκκλησίαις τῆς Ἰουδαίας ταῖς ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/022.yaml
  text: But I was personally unknown by face to the churches of Judea that are in Messiah[b][a],
translation:
  language: tl
  text: Ngunit hindi ako personal na kilala[a] ng mga iglesya sa Judea na nakay Mesiyas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi nila ako kilala sa mukha” o “hindi nila ako personal na kilala.”
    reason: lexical_alternative
  - marker: b
    text: O “nakay Cristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na paglipat o pagsalungat sa naunang pahayag; likas itong naihahatid ng “Ngunit.”
- source_word: ἤμην ἀγνοούμενος
  choice: hindi ako kilala
  rationale: Ang periphrastic na anyo ay nagsasaad na hindi siya personal na nakikilala ng mga tinutukoy na iglesya; malinaw at natural ito sa makabagong Tagalog.
- source_word: τῷ προσώπῳ
  choice: nang personal
  rationale: Idyomatiko rito ang literal na “sa mukha” at tumutukoy sa pagkakilala sa pamamagitan ng personal na pakikipagkita, hindi sa ganap na kawalan ng kaalaman tungkol sa kaniya.
- source_word: ἐκκλησίαις
  choice: mga iglesya
  rationale: Tumutukoy ito sa mga kongregasyong Cristiano; ang “mga iglesya” ang karaniwan at madaling maunawaang salin.
- source_word: Ἰουδαίας
  choice: Judea
  rationale: Ginamit ang nakasanayang anyo ng pangalang heograpiko sa Filipino.
- source_word: ἐν Χριστῷ
  choice: nakay Mesiyas
  rationale: Pinananatili ng “Mesiyas” ang lakas ng Χριστός bilang titulo, samantalang ang “nakay” ay maikli at likas na paraan upang ihatid ang relasyong ipinapahayag ng ἐν nang hindi ito labis na ipinapaliwanag.
theological_decisions:
- issue: Pagpapakahulugan sa ἐν Χριστῷ
  choice: nakay Mesiyas
  alternative: nakay Cristo
  rationale: Ang Χριστός ay may malinaw na puwersa bilang titulo sa pariralang ito. Pinananatili ng “Mesiyas” ang kahulugang “Pinahiran,” habang hindi nililimitahan ng “nakay” kung ang diin ay pagkakaugnay, pag-aari, o pakikiisa sa kaniya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang literal ngunit asiwa na “hindi kilala sa mukha” sa pangunahing teksto, ngunit pinanatili iyon sa talababa bilang posibleng mas pormal na pagtutumbas. Hindi idinagdag ang “pa,” sapagkat wala itong tahasang katumbas sa Griyego.
