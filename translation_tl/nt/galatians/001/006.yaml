id: GAL.1.6
reference: Galatians 1:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Θαυμάζω ὅτι οὕτως ταχέως μετατίθεσθε ἀπὸ τοῦ καλέσαντος ὑμᾶς ἐν χάριτι Χριστοῦ εἰς ἕτερον εὐαγγέλιον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/006.yaml
  text: I am astonished that you are so quickly deserting the one who called you in the grace of Messiah for a different gospel[c][b][a],
translation:
  language: tl
  text: Labis akong nagtataka na ganito kabilis kayong tumatalikod sa tumawag sa inyo sa biyaya ng Mesiyas[a][b] at bumabaling sa ibang ebanghelyo[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa pamamagitan ng biyaya ng Mesiyas.” Maaaring ipahiwatig ng pang-ukol ang kalagayan o ang paraan.
    reason: alternative_reading
  - marker: b
    text: 'Griyego: “Cristo”; ginamit dito ang “Mesiyas” sapagkat ginagamit ang salita bilang titulo.'
    reason: lexical_alternative
  - marker: c
    text: O, “sa isa pang ebanghelyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαυμάζω
  choice: Labis akong nagtataka
  rationale: Ipinahahayag nito sa likas na makabagong Tagalog ang matinding pagkagulat at hindi pagsang-ayon ni Pablo, nang hindi nagbibigay ng positibong himig na maaaring taglayin ng “namamangha.”
- source_word: οὕτως ταχέως
  choice: napakabilis
  rationale: Pinananatili nito ang diin sa nakakagulat na bilis ng kanilang pagtalikod.
- source_word: μετατίθεσθε ἀπὸ ... εἰς
  choice: tumatalikod sa ... at bumabaling sa
  rationale: Likas sa Tagalog ang tambalang ito at malinaw na inilalarawan ang paglayo mula sa isang persona at pagharap sa ibang mensahe; pinananatili rin nito ang kasalukuyang nagaganap na kilos.
- source_word: τοῦ καλέσαντος ὑμᾶς
  choice: sa tumawag sa inyo
  rationale: Pinananatiling hindi tahasang pinapangalanan ang tumawag, gaya ng Griyego, at ipinakikita ang naunang pagtawag.
- source_word: ἐν χάριτι Χριστοῦ
  choice: sa biyaya ng Mesiyas
  rationale: Ang “sa” ay sadyang maluwag upang hindi ipasiya kung ang ἐν ay tumutukoy sa saklaw o paraan; pinananatili rin ang ugnayang ipinahahayag ng genitive.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Isinasalin ang kahulugan ng Χριστός bilang titulo sa halip na ituring lamang itong nakapirming pangalan.
- source_word: ἕτερον εὐαγγέλιον
  choice: ibang ebanghelyo
  rationale: Ang “ibang” ay natural at naipahihiwatig ang pagkakaiba ng mensaheng nililipatan nila, na lilinawin pa ng kasunod na talata.
theological_decisions:
- issue: Pagkakakilanlan ng “tumawag sa inyo”
  choice: Hindi tahasang pinangalanan ang tumawag.
  alternative: “Diyos na tumawag sa inyo” o “Mesiyas na tumawag sa inyo”
  rationale: Hindi binabanggit ng mismong sugnay sa Griyego ang simuno; pinananatili ng salin ang pagpipigil at posibleng tensiyong ito.
- issue: Gamit ng ἐν sa “ἐν χάριτι Χριστοῦ”
  choice: “sa biyaya ng Mesiyas”
  alternative: “sa pamamagitan ng biyaya ng Mesiyas”
  rationale: Hindi tiyak kung saklaw o paraan ang ipinahahayag ng pang-ukol, kaya hindi ito nilutas nang tahasan sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ebanghelyo” bilang pamilyar na terminong biblikal. Ang “Labis akong nagtataka” ay naghahatid ng pagkagulat na may pagsaway, samantalang ang “tumatalikod ... at bumabaling” ay likas na naglalarawan ng paglayo at paglipat nang hindi dinaragdagan ang pagkakakilanlan ng tumawag.
