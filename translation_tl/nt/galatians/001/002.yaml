lexical_decisions:
- source_word: καὶ
  choice: at
  rationale: Pinananatili ang pang-ugnay sa pagpapatuloy ng pambungad na pangungusap mula sa talata 1.
- source_word: οἱ σὺν ἐμοὶ πάντες ἀδελφοί
  choice: ang lahat ng mga kapatid na kasama ko
  rationale: Ang “mga kapatid” ay likas at marangal na salin ng ἀδελφοί sa Filipino; maaari itong tumukoy sa mga kapananampalatayang lalaki at babae, kaya hindi na kailangan ng hiwalay na panandang pangkasarian.
- source_word: ἐκκλησίαις
  choice: mga iglesya
  rationale: Ang “iglesya” ang karaniwan at madaling maunawaang katawagan sa mga lokal na pamayanang Kristiyano sa ganitong pormula ng liham.
- source_word: τῆς Γαλατίας
  choice: sa Galacia
  rationale: Bagaman genitive ang anyong Griyego, ang “sa Galacia” ang mas likas na Filipino para sa mga iglesyang matatagpuan sa rehiyong iyon, nang hindi binabago ang kahulugan.
