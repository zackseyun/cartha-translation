id: GAL.1.13
reference: Galatians 1:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἠκούσατε γὰρ τὴν ἐμὴν ἀναστροφήν ποτε ἐν τῷ Ἰουδαϊσμῷ, ὅτι καθ’ ὑπερβολὴν ἐδίωκον τὴν ἐκκλησίαν τοῦ θεοῦ καὶ ἐπόρθουν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/013.yaml
  text: For you have heard of my former way of life in Judaism[d][c][b][a], that I was persecuting the church of God beyond measure and was ravaging it.
translation:
  language: tl
  text: Sapagkat narinig ninyo ang tungkol sa dati kong pamumuhay[a] sa Judaismo:[b] lubha[c] kong inuusig ang iglesya ng Diyos at winawasak ko ito.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dati kong asal” o “dati kong paraan ng pamumuhay.”
    reason: lexical_alternative
  - marker: b
    text: O “relihiyong Judio.”
    reason: lexical_alternative
  - marker: c
    text: O “labis-labis” o “sa pambihirang tindi.”
    reason: lexical_alternative
  - marker: d
    text: O “sinisikap kong wasakin ito” o “nililipol ko ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστροφήν
  choice: pamumuhay
  rationale: Malawak itong tumutukoy sa paraan o asal ng pamumuhay, hindi lamang sa iisang kilos. Likas at malinaw sa modernong Filipino ang “pamumuhay.”
- source_word: ποτε
  choice: dati kong
  rationale: Ipinahihiwatig ng pang-abay ang dating yugto ng buhay ni Pablo. Natural na naipapahayag ang temporal na paghahambing sa pariralang “dati kong pamumuhay.”
- source_word: Ἰουδαϊσμῷ
  choice: Judaismo
  rationale: Tuwirang katumbas ito ng terminong Griyego para sa relihiyon at kinikilalang paraan ng pamumuhay ng mga Judio sa kontekstong ito.
- source_word: καθ’ ὑπερβολὴν
  choice: sukdulan
  rationale: 'Pinananatili nito ang matinding diin ng parirala: ang pag-uusig ay higit sa karaniwan o lubhang matindi.'
- source_word: ἐδίωκον
  choice: ang pag-uusig ko
  rationale: Sa konteksto ng dating pamumuhay, ipinapakita ng nominal na parirala ang nagpapatuloy o nakagawiang pagkilos na ipinahihiwatig ng imperfect verb.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: ang iglesya ng Diyos
  rationale: Ang “iglesya” ang natural at kinikilalang tawag sa pamayanan ng mga sumasampalataya na tinutukoy rito.
- source_word: ἐπόρθουν
  choice: winawasak ko ito
  rationale: Ipinahahayag nito ang marahas at nagpapatuloy na pamiminsala ng pandiwa, habang inilalahad sa talababa ang posibleng conative na diwa.
theological_decisions:
- issue: Kung “iglesya” o “kapulungan” ang ἐκκλησία
  choice: ang iglesya ng Diyos
  alternative: ang kapulungan ng Diyos
  rationale: Tinutukoy rito ang nakikilalang pamayanan ng mga tagasunod ng Mesiyas. Pinakamalinaw at natural sa karaniwang modernong Filipino ang “iglesya,” nang walang idinaragdag na natatanging doktrina.
- issue: Kung aktuwal na winawasak o tinatangkang wasakin ang ipinahihiwatig ng ἐπόρθουν
  choice: winawasak ko ito
  alternative: sinisikap kong wasakin ito
  rationale: Pangunahing ipinahahayag ng pandiwa ang matinding pamiminsala o pagwasak. Gayunman, maaaring maunawaan ang imperfect bilang pagtatangkang isagawa iyon, kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “Judaismo” bilang tiyak na terminong panrelihiyon, “iglesya” bilang karaniwang katawagan sa pamayanan, at “sukdulan” upang mapanatili ang retorikal na tindi ng Griyego.
