  text: What I am writing to you—behold[a], before God[b], I am not lying.
translation:
  language: tl
  text: Ang isinusulat ko sa inyo—narito,[a] sa harap ng Diyos,[b] hindi ako nagsisinungaling.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “narito” ay nagsasalin sa mariing partikulang Griyego na ἰδού, na maaari ring isalin bilang “masdan” o “tingnan.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “sa presensiya ng Diyos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δὲ γράφω ὑμῖν
  choice: Tungkol sa mga isinusulat ko sa inyo
  rationale: Likas sa modernong Filipino ang pariralang ito at pinananatili ang maramihang diwa ng ἃ, ang banayad na paglipat ng δέ, at ang kasalukuyang gawaing ipinahihiwatig ng γράφω.
- source_word: ἰδοὺ
  choice: masdan ninyo
  rationale: Ipinahahayag ang solemne at mapagtuong diin ng partikula nang hindi gumagamit ng masyadong kolokyal na “tingnan ninyo.”
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: sa harap ng Diyos
  rationale: Maikli at likas na pormula sa Filipino na nagpapanatili sa diwa ng pananagutan sa presensiya ng Diyos.
- source_word: ὅτι
  choice: hindi hiwalay na isinalin
  rationale: Ang nilalaman ng mariing pahayag ay likas na ipinakikilala sa Filipino sa pamamagitan ng bantas at ayos ng pangungusap.
- source_word: οὐ ψεύδομαι
  choice: hindi ako nagsisinungaling
  rationale: Direkta at natural na salin ng kasalukuyang pagtanggi ni Pablo.
theological_decisions:
- issue: Lakas ng pag-apela ni Pablo sa Diyos
  choice: 'Isinalin bilang solemne at may pananagutang pahayag: “sa harap ng Diyos, hindi ako nagsisinungaling.”'
  alternative: Ituring lamang bilang pangkalahatang pagdidiin na walang pahiwatig ng pag-apela sa Diyos.
  rationale: Ang ἐνώπιον τοῦ θεοῦ ay nagpapahiwatig na nagsasalita si Pablo na may pananagutan sa Diyos, ngunit hindi ito pinalakas tungo sa isang tahasang pormal na panunumpa na wala naman sa Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang solemne at halos panunumpang tono nang hindi ginagawang tahasang panunumpa ang pahayag.
