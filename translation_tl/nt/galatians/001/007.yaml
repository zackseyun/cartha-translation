  text: which is not another gospel[b][a]; except that there are some who are troubling you and wanting to distort the gospel of Messiah.
translation:
  language: tl
  text: na hindi naman ibang ebanghelyo. Maliban na, may ilang taong gumugulo sa inyo at naglalayong baluktutin ang ebanghelyo ng Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ni Cristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: ibang ebanghelyo
  rationale: Bagaman walang tahasang ουσιαστικό pagkatapos ng ἄλλο, malinaw mula sa naunang talata na “ebanghelyo” ang tinutukoy. Ang paglalagay nito ay nagbibigay-linaw nang hindi nagdaragdag ng bagong diwa.
- source_word: εἰ μή
  choice: Kaya lamang
  rationale: Ipinakikilala rito ng εἰ μή ang paglilinaw o pagbubukod, hindi isang payak na kondisyon. Likas sa makabagong Tagalog ang “Kaya lamang” at napapanatili nito ang biglang pagtutuwid ni Pablo.
- source_word: ταράσσοντες
  choice: nanggugulo
  rationale: Ipinahahayag nito ang patuloy na pagligalig at paglikha ng kalituhan sa mga taga-Galacia, sa payak ngunit mabigat na pananalita.
- source_word: θέλοντες
  choice: gustong
  rationale: Tuwirang ipinahahayag ang hangarin o layunin ng mga nanggugulo nang hindi pinalalabis ang lakas ng pandiwa.
- source_word: μεταστρέψαι
  choice: baluktutin
  rationale: Ipinahihiwatig ng pandiwa ang pagbago sa isang bagay hanggang maging salungat o tiwali. Ang “baluktutin” ay malinaw at matimbang sa kasalukuyang Tagalog.
- source_word: εὐαγγέλιον
  choice: ebanghelyo
  rationale: Ito ang nakagawiang salitang teolohikal sa Tagalog at angkop sa espesipikong gamit ni Pablo rito.
- source_word: Χριστοῦ
  choice: ng Mesiyas
  rationale: Pinananatili ng “Mesiyas” ang titulong ipinahahayag ng Χριστός at ng pariralang genitibo ang posibilidad na ang ebanghelyo ay tungkol sa, mula sa, o nauukol sa Mesiyas.
theological_decisions:
- issue: Kung isasalin ang Χριστοῦ bilang titulo o bilang anyong tila pantanging pangalan
  choice: ng Mesiyas
  alternative: ni Cristo
  rationale: Aktibo rito ang mesiyanikong titulo, kaya “Mesiyas” ang nasa pangunahing teksto. Inilalagay sa talababa ang nakagawiang alternatibong “Cristo” nang hindi nilulutas nang sapilitan ang usaping leksikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang ugnayan sa naunang pangungusap sa pamamagitan ng panimulang “na,” at ang “Kaya lamang” ay likas na naghahatid ng pagwawasto o paglilinaw ni Pablo.
