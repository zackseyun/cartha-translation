  text: Then I went into the regions of Syria and Cilicia[a][b].
translation:
  language: tl
  text: Pagkatapos nito, pumunta ako sa mga rehiyon ng Siria at Cilicia.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patungo sa mga rehiyon ng Siria at Cilicia.”
    reason: lexical_alternative
  - marker: b
    text: O “mga distrito” sa halip na “mga rehiyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Pagkatapos
  rationale: Malinaw na ipinagpapatuloy nito ang sunod-sunod na salaysay ni Pablo at natural sa makabagong Filipino.
- source_word: ἦλθον
  choice: pumunta ako
  rationale: Bagaman maaaring literal na ‘dumating ako,’ ang pandiwa rito ay nagsasaad ng paglalakbay mula sa naunang kinaroroonan; ‘pumunta ako’ ang natural na salaysay sa Filipino.
- source_word: εἰς
  choice: sa
  rationale: Sa Filipino, ang ‘sa’ ang natural na pananda ng patutunguhan at maaaring tumukoy sa pagpasok o pagpunta sa isang rehiyon ayon sa konteksto.
- source_word: κλίματα
  choice: mga rehiyon
  rationale: Tumutukoy ito sa mga heograpikong lugar o distrito, hindi sa iisang lungsod; malinaw at dignified ang ‘mga rehiyon.’
- source_word: Συρίας
  choice: Siria
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar.
- source_word: Κιλικίας
  choice: Cilicia
  rationale: Karaniwang transliterasyon sa Filipino ng pangalan ng lugar.
