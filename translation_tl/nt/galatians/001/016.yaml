id: GAL.1.16
reference: Galatians 1:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοὶ ἵνα εὐαγγελίζωμαι αὐτὸν ἐν τοῖς ἔθνεσιν, εὐθέως οὐ προσανεθέμην σαρκὶ καὶ αἵματι,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/016.yaml
  text: to reveal his Son in me[a], so that I might proclaim him among the Gentiles, I did not immediately consult with flesh and blood[b],
translation:
  language: tl
  text: na ihayag ang kanyang Anak sa akin[a] upang ipahayag ko siya sa mga Hentil, hindi ako agad sumangguni sa sinumang tao[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa loob ko” o “sa pamamagitan ko.”
    reason: alternative_reading
  - marker: b
    text: Sa literal, “sa laman at dugo,” isang idyoma na tumutukoy sa tao o sa mga tao.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκαλύψαι
  choice: ihayag
  rationale: Likas at malinaw na katumbas ito ng banal na pagbubunyag, at ang pawatas ay nagpapatuloy sa kaisipan mula sa naunang talata.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: ang kanyang Anak
  rationale: Pinananatili nito nang natural sa Tagalog ang titulong may puwersang kristolohikal.
- source_word: ἐν ἐμοὶ
  choice: sa akin
  rationale: Sa modernong Tagalog, ang “sa akin” ay maaaring tumukoy sa paghahayag kay Pablo o sa loob ng kanyang karanasan; inilalagay sa talababa ang literal na “sa loob ko” at ang posibleng instrumental na “sa pamamagitan ko” upang hindi ikubli ang tunay na kalabuan.
- source_word: ἵνα εὐαγγελίζωμαι αὐτὸν
  choice: upang ipahayag ko siya
  rationale: Pinananatili nitong tuwirang layon ang Anak mismo, sa halip na palawakin bilang mensahe lamang tungkol sa kanya.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: sa mga Hentil
  rationale: Sa kontekstong Paulino, karaniwang tumutukoy ito sa mga taong hindi Judio.
- source_word: εὐθέως
  choice: agad
  rationale: Maikli, natural, at tumpak na katumbas sa modernong Tagalog.
- source_word: οὐ προσανεθέμην
  choice: hindi ako agad sumangguni
  rationale: Ipinapahayag nito ang diwa ng pagkonsulta o pakikipagsanggunian sa iba.
- source_word: σαρκὶ καὶ αἵματι
  choice: sa sinumang tao
  rationale: Ito ang likas na kahulugan ng idyomang Griyego sa modernong Tagalog; itinatala sa talababa ang literal na larawan upang mapanatili ang ugnayan sa anyong pinagmulan.
theological_decisions:
- issue: Kahulugan ng ἐν ἐμοὶ kaugnay ng paghahayag sa Anak
  choice: “sa akin” sa pangunahing teksto, na may mga alternatibo sa talababa
  alternative: “sa loob ko” o “sa pamamagitan ko”
  rationale: Hindi tiyak kung ang diin ay paghahayag kay Pablo, panloob na paghahayag, o paghahayag sa pamamagitan niya. Ang “sa akin” ay natural ngunit sapat na bukas, habang malinaw na itinatala ng talababa ang ibang posibleng pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Hentil” bilang pamilyar na terminong biblikal. Isinalin sa likas na diwa ang idyomang “laman at dugo,” ngunit pinanatili ang literal na anyo sa talababa. Parehong marker na [a] at [b] ay nasa pangunahing teksto.
