- from: Ngunit kahit kami o isang anghel mula sa langit ang magpahayag sa inyo ng mabuting balita[a] na salungat sa ipinahayag namin sa inyo,[b] sumpain siya.[c]
  to: Ngunit kahit kami o isang anghel mula sa langit ang magpahayag sa inyo ng mabuting balita[a] na salungat sa ipinahayag namin sa inyo,[b] nawa’y mapasailalim siya sa sumpa.[c]
  rationale: Pinalitan lamang ang pangwakas na pormula upang maipakita ang ikatlong-panauhang, taimtim na hatol ng ἀνάθεμα ἔστω at maiwasan ang posibleng pagbasa rito bilang utos sa mga tagapakinig. Pinanatili ang iba pang mga salita at ang mga talababa dahil tapat at natural ang mga ito.
