base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/008.yaml
  text: But even if we or an angel from heaven should proclaim good news to you contrary to what we proclaimed to you[c][b][a], let him be accursed.
translation:
  language: tl
  text: Ngunit kahit kami o isang anghel mula sa langit ang magpahayag sa inyo ng mabuting balita[a] na salungat sa ipinahayag namin sa inyo,[b] nawa’y mapasailalim siya sa sumpa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mangaral sa inyo ng ebanghelyo.” Pandiwa ang ginamit sa Griyego: “magpahayag ng mabuting balita.”'
    reason: lexical_alternative
  - marker: b
    text: O “na iba sa ipinahayag namin sa inyo” o “na lampas sa ipinahayag namin sa inyo.”
    reason: lexical_alternative
  - marker: c
    text: O “sumpain siya” o “maging anatema siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ ἐὰν
  choice: Ngunit kahit
  rationale: Likas na ipinapahayag sa modernong Tagalog ang matinding pagsalungat ng ἀλλά, ang pagdidiin ng καί, at ang pasubaling ἐάν.
- source_word: ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ
  choice: kami o isang anghel mula sa langit
  rationale: Pinananatili ang tahasang pagsama ni Pablo sa sarili niyang pangkat at ang matinding paghahambing sa isang makalangit na mensahero.
- source_word: εὐαγγελίζηται
  choice: magpahayag ... ng mabuting balita
  rationale: Tuwirang isinasalin ang pandiwang Griyego at malinaw itong nauunawaan sa karaniwang modernong Tagalog.
- source_word: παρ’ ὃ
  choice: na salungat sa
  rationale: Sa kontekstong polemikal, ipinahihiwatig ng παρά ang paglihis mula sa naunang ipinahayag na mensahe; pinananatili ng 'salungat sa' ang lakas nito nang hindi itinatago ang ibang posibleng diwa.
- source_word: εὐηγγελισάμεθα
  choice: ipinahayag namin
  rationale: Natural sa Tagalog at iniiwasan ang mabigat na pag-uulit, habang malinaw pa ring tumutukoy sa mabuting balitang dati nang ipinahayag.
- source_word: ἀνάθεμα ἔστω
  choice: sumpain siya
  rationale: Maikli, taimtim, at malakas na katumbas ng ikatlong-panauhang pautos; hindi nito ipinapasok ang mas huling teknikal na gamit ng 'anatema.'
theological_decisions:
- issue: Diwa ng pormula ng sumpa ni Pablo
  choice: 'Isang tunay at taimtim na hatol ng sumpa sa sinumang nagpapahayag ng mensaheng salungat sa naunang ipinahayag na mabuting balita: ''sumpain siya.'''
  alternative: Maaaring idiin bilang 'maging anatema siya' o 'mapasailalim siya sa sumpa.'
  rationale: Pinananatili ng salin ang bigat at hukom na tono ng teksto, ngunit hindi ito nililimitahan sa teknikal na kahulugan ng pagtitiwalag sa iglesya.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw sa karaniwang mambabasa ngunit taimtim at marangal ang tono. Ang 'mabuting balita' ay transparent sa pandiwang Griyego, samantalang inilalagay sa talababa ang mas pamilyar na 'ebanghelyo.'
