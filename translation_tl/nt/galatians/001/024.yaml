  source_fidelity: Tumpak na naisasalin ang καὶ bilang “At,” ang ἐδόξαζον bilang “patuloy nilang niluwalhati,” at ang τὸν θεόν bilang “ang Diyos.” Ang “dahil sa akin” ay isang natural at kontekstuwal na salin ng ἐν ἐμοὶ, habang iniingatan ng talababa ang mas literal na “sa akin.” Ang aspektong imperfect ng ἐδόξαζον ay angkop na naipahihiwatig ng “patuloy.”
  naturalness: Natural at malinaw ang pangungusap sa modernong Filipino Tagalog. Marangal ngunit hindi lipas ang “niluwalhati,” at ang ayos na “At patuloy nilang niluwalhati ang Diyos dahil sa akin” ay maayos at madaling unawain.
  terminology: Ang “Diyos” at “niluwalhati” ay angkop, matatag, at tumutugma sa rehistrong biblikal. Ang footnote marker ay wastong nakaangkla sa “akin,” kung saan naroon ang leksikal na alternatibo.
