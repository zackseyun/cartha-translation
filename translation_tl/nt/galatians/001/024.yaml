  yaml_path: translation/nt/galatians/001/024.yaml
  text: And they glorified God because of me[a].
translation:
  language: tl
  text: At patuloy nilang niluwalhati ang Diyos dahil sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Karaniwang pang-ugnay na nagpapatuloy sa salaysay ni Pablo.
- source_word: ἐδόξαζον
  choice: patuloy nilang niluwalhati
  rationale: Ang δοξάζω ay pagbibigay ng kaluwalhatian o karangalan. Ipinahihiwatig ng imperfect na anyo ang nagpapatuloy o paulit-ulit na pagkilos, kaya malinaw itong ipinahayag sa Tagalog.
- source_word: ἐν ἐμοὶ
  choice: dahil sa akin
  rationale: 'Sa konteksto, ang parirala ay likas unawain bilang sanhi o kaugnayan: niluwalhati nila ang Diyos dahil sa nangyari kay Pablo. Pinananatili sa talababa ang mas literal na pagbasa.'
- source_word: τὸν θεόν
  choice: ang Diyos
  rationale: Tuwirang layon ng pandiwang ἐδόξαζον; ang karaniwang salin ay eksakto sa konteksto.
theological_decisions:
- issue: Kahulugan ng ἐν ἐμοὶ
  choice: 'Sanhi o kaugnayan: “dahil sa akin”'
  alternative: 'Mas literal o posibleng lokatibo: “sa akin”'
  rationale: Ipinakikita ng agarang konteksto ang tugon ng mga iglesya sa balita tungkol sa pagbabagong-buhay at ministeryo ni Pablo. Ang “dahil sa akin” ay natural sa modernong Tagalog, samantalang pinananatili ng talababa ang tunay na anyo at posibleng diin ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “niluwalhati” upang panatilihin ang teolohikal at leksikal na lakas ng δοξάζω, at ang “patuloy” upang maipakita ang aspektong imperfect.
