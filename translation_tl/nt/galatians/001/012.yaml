  text: οὐδὲ γὰρ ἐγὼ παρὰ ἀνθρώπου παρέλαβον αὐτό, ⸀οὔτε ἐδιδάχθην, ἀλλὰ δι’ ἀποκαλύψεως Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/012.yaml
  text: For I neither received it from a human source[a], nor was I taught it, but through a revelation of Jesus the Messiah.
translation:
  language: tl
  text: Sapagkat hindi ko ito tinanggap mula sa tao, ni itinuro man ito sa akin, kundi sa pamamagitan ng paghahayag ni Jesu-Cristo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “paghahayag ni Jesu-Cristo” ay maaari ring mangahulugang “paghahayag mula kay Jesu-Cristo” o “paghahayag tungkol kay Jesu-Cristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: mula sa tao
  rationale: Ang singular na ἀνθρώπου ay pangkalahatan at tumutukoy sa pinagmulan o tagapamagitan na tao, hindi sa isang tiyak na indibidwal. Likas sa Tagalog ang “mula sa tao” at malinaw ang kaibahan nito sa banal na paghahayag.
- source_word: παρέλαβον
  choice: tinanggap
  rationale: Ito ang karaniwang diwa sa konteksto ng pagtanggap ng mensahe o tradisyong ipinasa, at angkop sa pagtanggi ni Pablo na ang ebanghelyo ay nagmula sa pagpapasa ng tao.
- source_word: ἐδιδάχθην
  choice: itinuro ... sa akin
  rationale: Malinaw nitong pinananatili ang balintiyak na diwa ng pandiwa at ang kaibahan ng pagtuturo ng tao sa paghahayag.
- source_word: δι’ ἀποκαλύψεως
  choice: sa pamamagitan ng paghahayag
  rationale: Ipinahahayag nito ang paraan o kasangkapan, gaya ng διά, at natural na tinutukoy ang isang aktuwal na pagbubunyag nang hindi labis na nililimitahan ang anyo nito.
- source_word: Ἰησοῦ Χριστοῦ
  choice: ni Jesu-Cristo
  rationale: 'Pinananatili ng Tagalog na genitibong “ni” ang likas na kalabuan ng Griyego: maaaring si Jesu-Cristo ang pinagmulan o tagapagbigay ng paghahayag, o siya ang paksa nito. Ang “Cristo” ay nakaugaliang anyong Tagalog ng titulong Mesiyas.'
theological_decisions:
- issue: Lakas ng genitibo sa ἀποκαλύψεως Ἰησοῦ Χριστοῦ
  choice: “paghahayag ni Jesu-Cristo,” na sadyang hindi tinutukoy kung mula sa kaniya o tungkol sa kaniya
  alternative: “paghahayag mula kay Jesu-Cristo” o “paghahayag tungkol kay Jesu-Cristo”
  rationale: Tunay na maaaring subjective/source genitive o objective genitive ang parirala. Ang “ni Jesu-Cristo” ay pinakamalapit sa pormal na ugnayan ng Griyego at pinananatili ang teolohikal na tensiyon; nililinaw sa talababa ang dalawang posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inulit ang “tinanggap ko ito” sa huling sugnay upang maging natural at buo ang pangungusap sa Tagalog, habang nananatili ang paraan ng pagtanggap bilang pangunahing diwa. Ginamit ang nakaugaliang pangalang “Jesu-Cristo” para sa Ἰησοῦ Χριστοῦ.
