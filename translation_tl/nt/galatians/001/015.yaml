base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/015.yaml
  text: But when the one who set me apart from my mother’s womb and called me through his grace was pleased[a]
translation:
  language: tl
  text: Ngunit nang minabuti ng nagbukod sa akin mula pa sa sinapupunan ng aking ina[a] at tumawag sa akin sa pamamagitan ng kanyang biyaya—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula nang ipanganak ako”; ihambing ang pananalita ng pagtawag sa Jeremias 1:5 at Isaias 49:1.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ngunit nang
  rationale: Pinananatili ang temporal na diwa ng ὅτε at ang banayad na pagsalungat o pagpapatuloy ng δέ; natural din itong nag-uugnay sa naunang pangungusap.
- source_word: εὐδόκησεν
  choice: minabuti
  rationale: Ipinahahayag nito ang kusang mabuting kalooban o pagkalugod, nang hindi pinapaliit ang salita tungo lamang sa ‘nagpasya.’
- source_word: ὁ ἀφορίσας με
  choice: ng nagbukod sa akin
  rationale: Pinananatili ang substantibong participle at ang diwa ng pagtatalaga o pagbubukod, nang hindi nagdaragdag ng mas tiyak na doktrina gaya ng ‘humirang.’
- source_word: ἐκ κοιλίας μητρός μου
  choice: mula pa sa sinapupunan ng aking ina
  rationale: Pinananatili ang kongkretong larawan at wikang kaugnay ng pagtawag sa mga propeta; ang ‘pa’ ay natural na nagpapahayag ng panimulang punto sa Filipino.
- source_word: καλέσας
  choice: tumawag sa akin
  rationale: Ang ‘tumawag’ ay malinaw at karaniwang katumbas sa konteksto ng banal na pagtawag, nang hindi nililimitahan kung bokasyonal o panligtas ang diin.
- source_word: διὰ τῆς χάριτος αὐτοῦ
  choice: sa pamamagitan ng kanyang biyaya
  rationale: Malinaw na ipinapakita ang biyaya bilang paraan o kasangkapan ng pagtawag, alinsunod sa διά na may genitive.
theological_decisions:
- issue: Kung ang ἀφορίσας ay dapat isaling may tiyak na doktrina ng paghirang o predestinasyon
  choice: nagbukod sa akin
  alternative: humirang sa akin; nagtalaga sa akin
  rationale: Ang Griyego ay nagpapahiwatig ng banal na pagbubukod, marahil sa hulma ng pagtawag sa isang propeta, ngunit hindi nito hinihingi ang mas sistematikong salitang ‘humirang.’
- issue: Kung tahasang idaragdag ang ‘Diyos’ bilang simuno
  choice: Hindi tahasang idinagdag; ginamit ang ‘ng nagbukod… at tumawag…’
  alternative: nang minabuti ng Diyos, na nagbukod…
  rationale: Maliwanag sa konteksto na Diyos ang tinutukoy, ngunit walang tahasang ὁ θεός sa talata. Pinananatili ng salin ang anyo at bahagyang pagiging di-tahas ng orihinal.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang anyong hindi pa kumpleto ng pangungusap dahil nagpapatuloy sa kasunod na talata ang kaisipan at pandiwang ‘minabuti’; ginamit ang em dash upang ipahiwatig ang pagpapatuloy nang hindi artipisyal na kinukumpleto ang pangungusap.
