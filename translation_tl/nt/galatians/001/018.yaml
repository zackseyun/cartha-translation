  text: Ἔπειτα μετὰ ⸂ἔτη τρία⸃ ἀνῆλθον εἰς Ἱεροσόλυμα ἱστορῆσαι ⸀Κηφᾶν, καὶ ἐπέμεινα πρὸς αὐτὸν ἡμέρας δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/018.yaml
  text: Then after three years I went up to Jerusalem to visit Cephas[b][a], and I stayed with him fifteen days.
translation:
  language: tl
  text: Pagkaraan ng tatlong taon, umakyat ako sa Jerusalem upang personal na makilala si Cefas[a], at nanatili akong kasama niya nang labinlimang araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Cefas ang Aramaikong pangalan ni Pedro. Maaari ring isalin ang parirala na “upang dalawin si Cefas”; ang pandiwang Griyego ay maaaring tumukoy sa pakikipagkita upang makilala nang personal.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔπειτα μετὰ ἔτη τρία
  choice: Pagkaraan ng tatlong taon
  rationale: Likas na pahayag ng pagkakasunod-sunod at pagitan ng panahon sa modernong Tagalog.
- source_word: ἀνῆλθον
  choice: umakyat ako
  rationale: Pinananatili ang diwa ng pag-akyat patungong Jerusalem at natural din ito sa salaysay.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lungsod sa Filipino.
- source_word: ἱστορῆσαι
  choice: upang personal na makilala
  rationale: Ipinahihiwatig ng bihirang pandiwa ang pakikipagkita upang makilala nang personal, hindi lamang isang karaniwang pagdalaw; hindi nito ipinapalagay na dati silang ganap na hindi magkakilala.
- source_word: Κηφᾶν
  choice: Cefas
  rationale: Pinananatili ang pangalang ginamit mismo ni Pablo sa halip na palitan ito ng Pedro; ang C ay umaayon sa nakaugaliang anyong Filipino ng pangalan.
- source_word: ἐπέμεινα πρὸς αὐτὸν
  choice: nanatili akong kasama niya
  rationale: Natural na ipinapahayag ang patuloy na pananatili sa piling ni Cefas nang takdang panahon.
- source_word: ἡμέρας δεκαπέντε
  choice: nang labinlimang araw
  rationale: Malinaw na ipinapahayag ang tagal na nakasaad sa accusative of duration.
theological_decisions:
- issue: Pagkakakilanlan ni Cefas
  choice: Cefas sa teksto, na may paliwanag sa talababa
  alternative: Pedro sa pangunahing teksto
  rationale: Hindi hinaharmonisa ang espesipikong pangalang Κηφᾶς na ginamit sa Griyego, habang tinutulungan ang mambabasa na makilala kung sino siya.
- issue: Layunin ng pagpunta ni Pablo
  choice: personal na makilala
  alternative: dalawin o usisain
  rationale: Pinananatili ang leksikal na lawak ng ἱστορῆσαι nang hindi ipinahihiwatig na humingi si Pablo ng awtorisasyon o doktrinal na pagtuturo kay Cefas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagkaraan” at “nanatili” bilang likas ngunit hindi kolokyal na pananalita; iniwasan ang mas teknikal na “makipagkilala” at ang posibleng sobrang payak na “bumisita.”
