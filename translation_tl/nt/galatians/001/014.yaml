  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ προέκοπτον ἐν τῷ Ἰουδαϊσμῷ ὑπὲρ πολλοὺς συνηλικιώτας ἐν τῷ γένει μου, περισσοτέρως ζηλωτὴς ὑπάρχων τῶν πατρικῶν μου παραδόσεων.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/014.yaml
  text: And I was advancing in Judaism beyond many of my contemporaries among my people[b][a], being far more zealous for the traditions of my fathers.
translation:
  language: tl
  text: At patuloy akong sumusulong sa Judaismo nang higit kaysa sa marami sa mga kapwa ko kaedad sa sarili kong bayan[a], at di-hamak na mas masigasig ako para sa mga tradisyong minana ko sa aking mga ninuno.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa sarili kong lahi” o “sa sarili kong sambayanan.”
    reason: Pinananatili ang saklaw ng γένος, na maaaring tumukoy sa angkan, pangkat ng mga tao, o bayan.
  - marker: b
    text: O, mas literal, “na masigasig para sa mga tradisyon ng aking mga ama.”
    reason: Ibinibigay ang mas pormal na katumbas ng τῶν πατρικῶν μου παραδόσεων at pinananatili ang larawang “mga ama.”
lexical_decisions:
- source_word: προέκοπτον
  choice: ang pagsulong ko
  rationale: Ipinahihiwatig ng imperpektong anyo ang patuloy na pagsulong noong nakaraan; sa pariralang “higit ang pagsulong ko,” malinaw ring napapanatili ang paghahambing.
- source_word: Ἰουδαϊσμῷ
  choice: Judaismo
  rationale: Maikli at kinikilalang tawag ito sa relihiyon at paraan ng pamumuhay na Judio, habang hindi nililimitahan ang saklaw ng salitang Griyego.
- source_word: ὑπὲρ πολλοὺς συνηλικιώτας
  choice: kaysa sa marami kong kaedad
  rationale: Ang ὑπέρ ay naghahayag dito ng paghahambing, at ang συνηλικιώτας ay tumutukoy sa mga taong kapareho niya ng edad.
- source_word: ἐν τῷ γένει μου
  choice: sa sarili kong bayan
  rationale: Maaaring tumukoy ang γένος sa sariling pangkat, lahi, o bayan. Natural sa Filipino ang “sarili kong bayan” at hindi nito ipinapasok ang makabagong konsepto ng rasang biyolohikal.
- source_word: περισσοτέρως ζηλωτὴς ὑπάρχων
  choice: di-hamak na mas masigasig ako
  rationale: Pinananatili nito ang matinding paghahambing ng περισσοτέρως at ang sigasig o matinding debosyon ng ζηλωτής, nang hindi ipinahihiwatig ang teknikal o politikal na kahulugan ng “Zelote.”
- source_word: τῶν πατρικῶν μου παραδόσεων
  choice: para sa mga tradisyong minana ko sa aking mga ninuno
  rationale: Ipinahahayag nito kapwa ang mga tradisyon at ang pagkamana ng mga iyon mula sa mga ama o ninuno; mas malinaw at natural ito sa kasalukuyang Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Judaismo” bilang maikli at pamilyar na terminong panrelihiyon. Inilagay ang mga alternatibong saklaw ng γένος at ang mas literal na anyo ng πατρικῶν sa mga talababa upang mapanatili ang tunay na leksikal na kalabuan.
