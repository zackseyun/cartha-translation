revisions:
- from: At higit ang pagsulong ko sa Judaismo kaysa sa marami kong kaedad sa sarili kong bayan[a]; di-hamak na mas masigasig ako para sa mga tradisyong minana ko sa aking mga ninuno.[b]
  to: At patuloy akong sumusulong sa Judaismo nang higit kaysa sa marami sa mga kapwa ko kaedad sa sarili kong bayan[a], at di-hamak na mas masigasig ako para sa mga tradisyong minana ko sa aking mga ninuno.[b]
  rationale: Pinalitan ang hindi likas na “higit ang pagsulong ko” ng pandiwang anyong malinaw na nagpapakita ng patuloy na pagsulong noon. Pinanatili ang lahat ng paghahambing, ang saklaw ng γένος sa talababa, at ang minanang katangian ng mga tradisyon; inayos lamang ang talababa b upang ang literal na alternatibo ay maging mas malinaw sa Filipino.
