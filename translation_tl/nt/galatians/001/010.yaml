    rationale: Mas natural na modernong Filipino ang “palugdan / pinapalugdan,” nang walang pagbabago sa kahulugan o rehistro.
  - severity: low
    issue: 'Ang talababa b ay sabay na nagpapalit ng dalawang termino: “alipin” at “Mesiyas.”'
    rationale: Mas malinaw na ang alternatibo ay para sa δοῦλος lamang kung “lingkod ng Mesiyas” ang gagamitin.
