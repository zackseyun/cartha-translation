id: GAL.1.10
reference: Galatians 1:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἄρτι γὰρ ἀνθρώπους πείθω ἢ τὸν θεόν; ἢ ζητῶ ἀνθρώποις ἀρέσκειν; ⸀εἰ ἔτι ἀνθρώποις ἤρεσκον, Χριστοῦ δοῦλος οὐκ ἂν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/010.yaml
  text: For am I now persuading people[a], or God? Or am I seeking to please people? If I were still pleasing people[b], I would not be Messiah’s servant.
translation:
  language: tl
  text: Sapagkat sinisikap ko ba ngayong hikayatin ang mga tao, o ang Diyos?[a] O sinisikap ko bang palugdan ang mga tao? Kung pinapalugdan ko pa rin ang mga tao, hindi sana ako alipin ng Mesiyas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinisikap ko ba ngayong makuha ang pagsang-ayon ng mga tao, o ng Diyos?”
    reason: lexical_alternative
  - marker: b
    text: O “lingkod ng Mesiyas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρτι
  choice: ngayon
  rationale: Tumutukoy sa kasalukuyang kalagayan at pangangatwiran ni Pablo, na may pahiwatig ng paghahambing sa dati niyang pamumuhay.
- source_word: πείθω
  choice: sinisikap ... hikayatin
  rationale: Pinananatili ang pangunahing diwa ng pandiwa na manghikayat o mangumbinsi, pati ang kapansin-pansing retorikal na tanong tungkol sa Diyos; inilalahad sa talababa ang posibleng diwang paghingi ng pagsang-ayon.
- source_word: ἀνθρώπους
  choice: mga tao
  rationale: Tumutukoy sa mga tao sa pangkalahatan at hindi lamang sa mga lalaki.
- source_word: τὸν θεόν
  choice: ang Diyos
  rationale: Tuwiran at karaniwang katumbas ng salitang Griyego sa retorikal na paghahambing.
- source_word: ζητῶ
  choice: sinisikap ko
  rationale: Natural na Filipino para sa patuloy na pagsisikap na ipinahihiwatig ng pangkasalukuyang anyo.
- source_word: ἀρέσκειν / ἤρεσκον
  choice: bigyang-lugod / binibigyang-lugod
  rationale: Tuwirang ipinapahayag ang pagpapalugod sa iba at pinananatili ang pag-uulit ng salitang-ugat sa dalawang sugnay.
- source_word: εἰ ἔτι
  choice: Kung ... pa rin
  rationale: Pinananatili ang kondisyon at ang pahiwatig na maaaring ito ay dating gawi ni Pablo.
- source_word: Χριστοῦ
  choice: ng Mesiyas
  rationale: Ginagamit ang pamagat na Mesiyas dahil kapansin-pansin dito ang katapatan at pag-aari sa hinirang na Hari, hindi lamang ang isang nakapirming personal na pangalan.
- source_word: δοῦλος
  choice: alipin
  rationale: Pinananatili ang matinding diwa ng pag-aari at lubos na katapatan na mahalaga sa kaibahan sa pagpapalugod sa mga tao.
theological_decisions:
- issue: Ang kahulugan ng πείθω sa tanong tungkol sa mga tao at sa Diyos
  choice: sinisikap ... hikayatin
  alternative: sinisikap ... makuha ang pagsang-ayon
  rationale: Ang literal na diwa ng panghihikayat ay pinanatili sa teksto upang hindi patahimikin ang tunay na leksikal na tensiyon; ang kahulugang nauugnay sa paghingi ng pagsang-ayon ay inilagay sa talababa.
- issue: Paglalarawan sa kaugnayan ni Pablo sa Χριστός
  choice: alipin ng Mesiyas
  alternative: lingkod ni Cristo
  rationale: Binibigyang-diin ng δοῦλος ang lubos na pag-aari at katapatan, habang ang Mesiyas ay nagpapanatili sa aktibong diwa ng titulo sa kontekstong ito.
translation_notes:
  register: Makabago at marangal na Filipino, na gumagamit ng malinaw na retorikal na mga tanong. Pinanatili ang bahagyang pagkailang ng unang tanong upang maipakita ang tunay na lawak ng πείθω, habang nililinaw sa talababa ang alternatibong diwa.
