  to: Sapagkat sinisikap ko ba ngayong hikayatin ang mga tao, o ang Diyos?[a] O sinisikap ko bang palugdan ang mga tao? Kung pinapalugdan ko pa rin ang mga tao, hindi sana ako alipin ng Mesiyas.[b]
  rationale: Pinalitan ang mas mabigat na “bigyang-lugod” ng mas likas na “palugdan,” habang pinanatili ang retorikal na anyo, ang kondisyonal na pahiwatig, at ang mariing “alipin.” Inihanay ang talababa b sa pangunahing terminolohiya upang isang leksikal na alternatibo lamang ang inilalahad.
