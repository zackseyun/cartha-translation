id: GAL.1.11
reference: Galatians 1:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Γνωρίζω ⸀γὰρ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ ὅτι οὐκ ἔστιν κατὰ ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/011.yaml
  text: For I make known to you[a], brothers[b], that the gospel proclaimed by me is not according to man.
translation:
  language: tl
  text: Sapagkat nais kong malaman ninyo, mga kapatid,[a] na ang ebanghelyong ipinangaral ko ay hindi nagmula sa tao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay tumutukoy rito sa mga kapatid sa pananampalataya, kapwa lalaki at babae.
    reason: lexical_clarification
  - marker: b
    text: Sa literal, “hindi ayon sa tao”; maaari ring mangahulugang hindi ito ayon sa pamantayan ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω γὰρ ὑμῖν
  choice: Sapagkat nais kong malaman ninyo
  rationale: Ang Γνωρίζω ὑμῖν ay pormulang nagpapakilala ng mahalagang paglilinaw; natural sa makabagong Tagalog ang “nais kong malaman ninyo.” Pinananatili ng “Sapagkat” ang paliwanag na ugnayan ng γὰρ sa naunang talata.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay natural at marangal na tawag sa buong pamayanang sumasampalataya sa Tagalog; hindi nito kailangang tukuyin ang kasarian kahit panlalaking maramihan ang anyong Griyego.
- source_word: εὐαγγέλιον
  choice: ebanghelyo
  rationale: Ito ang kinikilalang terminong Tagalog para sa teknikal na gamit ni Pablo sa mabuting balita tungkol kay Cristo.
- source_word: τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ
  choice: ipinangaral ko
  rationale: Malinaw at natural nitong ipinahahayag ang pampublikong pagpapahayag ni Pablo, habang pinananatili ang tahasang ahensiya ng unang panauhan.
- source_word: οὐκ ἔστιν κατὰ ἄνθρωπον
  choice: ay hindi nagmula sa tao
  rationale: 'Sa konteksto ng talata 12, pangunahing tinutukoy ng parirala ang pinagmulan: hindi ito tinanggap ni Pablo mula sa tao. Inilalagay sa talababa ang posibleng diwang pamantayang pantao upang mapanatili ang tunay na lawak ng idyoma.'
theological_decisions:
- issue: Kung ang κατὰ ἄνθρωπον ay tumutukoy sa pinagmulan o sa pamantayan
  choice: hindi nagmula sa tao
  alternative: hindi ayon sa tao / hindi ayon sa pamantayan ng tao
  rationale: Sinusuportahan ng kasunod na talata ang pagbasa tungkol sa pinagmulan, sapagkat itinatanggi ni Pablo na tinanggap o natutuhan niya ang ebanghelyo mula sa tao. Gayunman, maaaring saklawin ng idyomang Griyego ang diwang hindi ito ayon sa pamantayang pantao, kaya pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang bokabularyong biblikal na “ebanghelyo” at ang likas na inklusibong tawag na “mga kapatid.”
