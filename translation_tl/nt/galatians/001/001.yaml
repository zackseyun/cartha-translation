id: GAL.1.1
reference: Galatians 1:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος, οὐκ ἀπ’ ἀνθρώπων οὐδὲ δι’ ἀνθρώπου ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/001.yaml
  text: Paul[a], an apostle—not from men nor through a man, but through Jesus the Messiah and God the Father, who raised him from the dead,
translation:
  language: tl
  text: Si Pablo, isang apostol—hindi mula sa mga tao ni sa pamamagitan ng isang tao, kundi sa pamamagitan ni Jesus na Mesiyas[a] at ng Diyos Ama, na muling bumuhay sa kanya mula sa mga patay—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Jesus na Cristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Pablo
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Paulos, na malinaw at natural sa modernong Tagalog.
- source_word: ἀπόστολος
  choice: apostol
  rationale: Pinananatili ng kinikilalang katawagang “apostol” ang diwa ng isang taong isinugo at binigyan ng awtoridad, sa halip na paliitin ito sa pangkalahatang “mensahero.”
- source_word: ἀπ’ ἀνθρώπων
  choice: mula sa mga tao
  rationale: Tumpak na ipinahahayag ng “mula sa” ang pinagmulan at pinananatili ng “mga tao” ang pangmaramihang anyo na ikinokontra sa kasunod na pang-isahan.
- source_word: δι’ ἀνθρώπου
  choice: sa pamamagitan ng isang tao
  rationale: Ipinahahayag nito ang ahensiya o pamamagitan at pinananatili ang mahalagang pang-isahang anyo ng ἀνθρώπου.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: sa pamamagitan ni Jesus na Mesiyas
  rationale: Inuulit ang “sa pamamagitan” upang mapanatili ang retorikal na pagtutulad sa naunang parirala; isinasalin ang Χριστοῦ bilang titulong “Mesiyas” sa natural na kayariang Filipino.
- source_word: θεοῦ πατρὸς
  choice: Diyos Ama
  rationale: Ito ang natural at marangal na katawagang Filipino na nagpapanatili sa magkaugnay na pagtukoy sa Diyos bilang Ama.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: na muling bumuhay sa kanya mula sa mga patay
  rationale: Malinaw na ang Diyos Ama ang gumaganap ng pagbuhay, at pinananatili ng “mula sa mga patay” ang larawan ng Griyegong ἐκ νεκρῶν.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ sa Ἰησοῦ Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: May malinaw na bisa pa rito ang Χριστός bilang titulo; kaya “Mesiyas” ang pangunahing salin, habang inilalagay sa talababa ang tradisyonal na alternatibong “Cristo.”
- issue: Pinagmulan at pamamagitan ng pagkaapostol ni Pablo
  choice: hindi mula sa mga tao ni sa pamamagitan ng isang tao
  alternative: hindi hinirang ng mga tao ni isinugo ng isang tao
  rationale: Hindi idinagdag ang “hinirang” o “isinugo,” sapagkat hindi tahasang naroon ang mga pandiwang iyon sa Griyego. Sa gayon, nananatili ang maigsi at mariing kaibahan sa pagitan ng tao at ng banal na pamamagitan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang anyong pambungad na hindi pa ganap na pangungusap at ang mariing retorikal na kaibahan ng pangmaramihang “mga tao” at pang-isahang “isang tao.”
