  yaml_path: translation/nt/galatians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah,[a]
translation:
  language: tl
  text: Sumainyo nawa ang biyaya at kapayapaang mula sa Diyos na Ama at sa ating Panginoon[b] na si Jesus na Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Jesu-Cristo.”'
    reason: Ibinibigay ang tradisyonal na anyo ng Ἰησοῦ Χριστοῦ bilang leksikal na alternatibo.
  - marker: b
    text: Sa Griyego, ang pariralang “at sa ating Panginoon” ay nasa mga panandang nagpapahiwatig ng kawalang-katiyakan sa teksto.
    reason: Ipinahihiwatig ang tekstuwal na kawalang-katiyakan na minarkahan ng ⸂καὶ κυρίου ἡμῶν⸃ sa source.
lexical_decisions:
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Sumainyo nawa ang biyaya at kapayapaan
  rationale: Ginamit ang likas na pormula ng pagpapala sa Filipino. Ipinahihiwatig ng “nawa” ang diwang nakapaloob sa eliptikong pagbati sa Griyego nang hindi nagdaragdag ng tahasang pandiwa.
- source_word: ἀπό
  choice: mula sa
  rationale: Malinaw nitong ipinapahayag ang pinagmumulan ng biyaya at kapayapaan.
- source_word: θεοῦ πατρός
  choice: Diyos na Ama
  rationale: Pinananatili nito ang pagkakaugnay ng “Diyos” at “Ama” sa tekstong Griyego at hindi inililipat ang ἡμῶν mula sa pinakamalapit nitong kaugnay na κύριος.
- source_word: κυρίου ἡμῶν
  choice: ating Panginoon
  rationale: Ang ἡμῶν ay kasunod mismo ng κυρίου sa ibinigay na SBLGNT text, kaya natural at pormal itong isinaling “ating Panginoon.”
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Isinalin ang Χριστός bilang titulong “Mesiyas,” habang ginamit ang “na” upang maging natural sa Filipino at malinaw na titulo ito, hindi apelyido.
theological_decisions:
- issue: Kung isasalin ang Χριστοῦ bilang titulo o pananatilihin sa tradisyonal na anyong “Cristo”
  choice: Jesus na Mesiyas
  alternative: Jesu-Cristo
  rationale: Ang Χριστός ay nananatiling makabuluhang titulong mesiyaniko sa pagbating ito. Inilagay sa talababa ang pamilyar na tradisyonal na anyo upang mapanatili ang leksikal na alternatibo.
- issue: Kung iuugnay ang ἡμῶν sa “Ama” o sa “Panginoon”
  choice: ating Panginoon
  alternative: ating Ama
  rationale: Sa ibinigay na SBLGNT text, ang ayos na κυρίου ἡμῶν ay pinakanatural na tumutukoy sa “ating Panginoon.” Hindi tahimik na inilipat ang panghalip ayon sa ibang ayos ng teksto o sa English consultation layer.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ang “Sumainyo nawa” ay karaniwang pormula ng pagpapala, at ang pinaikling “kapayapaang mula” ay nagpapanatili ng maayos at likas na daloy.
