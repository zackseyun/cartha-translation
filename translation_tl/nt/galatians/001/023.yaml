  text: μόνον δὲ ἀκούοντες ἦσαν ὅτι Ὁ διώκων ἡμᾶς ποτε νῦν εὐαγγελίζεται τὴν πίστιν ἥν ποτε ἐπόρθει,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/023.yaml
  text: They were only hearing[a], “The one who formerly persecuted us now proclaims the faith he once tried to destroy.”
translation:
  language: tl
  text: Noon, ang tanging naririnig nila ay, “Ang dating umuusig sa amin ay ipinangangaral na ngayon ang pananampalatayang dati niyang winawasak.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang ebanghelyo.” Ang “pananampalataya” rito ay malamang na tumutukoy sa mensaheng Kristiyano o sa pananampalatayang ipinahahayag ng mga Kristiyano, na dati niyang winawasak.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνον δὲ ἀκούοντες ἦσαν
  choice: Ang naririnig lamang nila ay
  rationale: Ipinahihiwatig ng periphrastic imperfect ang nagpapatuloy o paulit-ulit na pagkarinig sa ulat, habang pinananatili ng “lamang” ang limitasyong ipinahahayag ng μόνον.
- source_word: ὁ διώκων ἡμᾶς ποτε
  choice: Ang dating umuusig sa atin
  rationale: Likas na isinasalin ang substantival participle bilang paglalarawan kay Pablo ayon sa dati niyang gawain; malinaw at kasalukuyang Tagalog ang “dating umuusig.”
- source_word: νῦν εὐαγγελίζεται
  choice: ay ipinangangaral na ngayon
  rationale: Ang εὐαγγελίζεται ay tumutukoy sa hayagang pagpapahayag ng mabuting balita; ang “ipinangangaral” ay natural sa konteksto at umaangkop sa tuwirang layon na “pananampalataya.”
- source_word: τὴν πίστιν
  choice: ang pananampalataya
  rationale: Pinananatili nito ang pangunahing kahulugan ng πίστις at ang artikulong tumutukoy rito bilang pananampalatayang Kristiyano—ang mensahe o kapahayagang pinaniniwalaan—nang hindi ito tahasang pinapalitan ng “ebanghelyo.”
- source_word: ἣν ποτε ἐπόρθει
  choice: na dati niyang sinisikap wasakin
  rationale: 'Malakas ang diwa ng πορθέω: wasakin o pinsalain nang matindi. Ang “sinisikap wasakin” ay malinaw na naghahatid ng mapanirang kampanya ni Pablo nang hindi nagpapahiwatig na talagang napuksa niya ito.'
theological_decisions:
- issue: Kahulugan ng τὴν πίστιν
  choice: “ang pananampalataya” bilang mensahe o kapahayagang Kristiyano na ipinangangaral ngayon ni Pablo
  alternative: “ang ebanghelyo,” o pananampalataya bilang pansariling gawa ng paniniwala
  rationale: 'Ipinakikita ng konteksto at ng artikulo na obhetibo ang diwa rito: ang pananampalatayang dating inuusig at ngayo''y ipinahahayag. Pinananatili ng salin ang tunay na terminong “pananampalataya,” habang nililinaw sa talababa ang kontekstuwal na kahulugan.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinangangaral” dahil natural ito para sa pagpapahayag ng mensaheng panrelihiyon, at pinanatili ang “pananampalataya” upang hindi alisin ang leksikal at teolohikal na tensiyon ng Griyegong πίστις.
