  yaml_path: translation/nt/galatians/001/005.yaml
  text: to whom be the glory forever and ever. Amen.
translation:
  language: tl
  text: Sa kanya ang kaluwalhatian magpakailanman. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: Sa kanya
  rationale: Ang panghalip na datibo ay tumutukoy sa naunang binanggit na “ating Diyos at Ama.” Likas sa makabagong Tagalog ang “Sa kanya” bilang panimula ng doxolohiya.
- source_word: ἡ δόξα
  choice: ang kaluwalhatian
  rationale: Ang “kaluwalhatian” ang pamilyar at angkop na salin sa kontekstong doxolohikal, at pinananatili nito ang saklaw ng δόξα nang hindi nililimitahan sa papuri o karangalan lamang.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: magpakailanman
  rationale: Idyoma ito para sa walang-hanggang panahon. Ang “magpakailanman” ay malinaw, natural, at marangal sa modernong Tagalog.
- source_word: ἀμήν
  choice: Amen
  rationale: Pinananatili ang nakagawiang transliterasyon bilang taimtim na pagpapatibay sa wakas ng doxolohiya.
theological_decisions:
- issue: Di-hayag na pandiwa sa doxolohiya
  choice: Sa kanya ang kaluwalhatian
  alternative: Sumakanya nawa ang kaluwalhatian
  rationale: Walang tahasang pandiwa sa Griyego. Ang payak na pariralang nominal ay nagpapanatili sa kawalan nito at maaaring magpahiwatig kapuwa ng pagkilala at doxolohikal na paghahangad, sa halip na sapilitang piliin ang “nawa” o “ay.”
translation_notes:
  register: Maikli, marangal, at natural na doxolohiya sa modernong Filipino Tagalog. Walang footnote dahil walang kailangang variant o kalabuan na hindi kayang panatilihin ng pangunahing teksto.
