  text: ἄρα οὖν ὡς καιρὸν ⸀ἔχομεν, ἐργαζώμεθα τὸ ἀγαθὸν πρὸς πάντας, μάλιστα δὲ πρὸς τοὺς οἰκείους τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/010.yaml
  text: So then[a], as we have opportunity, let us do what is good toward everyone[c][b], and especially toward those who are of the household of faith.
translation:
  language: tl
  text: Kaya nga, habang may pagkakataon tayo,[a] gumawa tayo ng mabuti sa lahat ng tao, at lalo na sa mga kabilang sa sambahayan ng pananampalataya.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “habang may panahon tayo.” Ang Griyegong καιρός ay tumutukoy sa angkop o napapanahong pagkakataon, hindi lamang sa panahon sa pangkalahatan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pamilya ng pananampalataya” o “mga kasapi ng sambahayan ng pananampalataya.” Gumagamit ang Griyego ng larawan ng isang sambahayan para sa mga kabilang sa komunidad ng mga sumasampalataya.
    reason: lexical_alternative
  - marker: c
    text: Ang “pananampalataya” ay maaari ring unawain bilang “ang pananampalataya,” ibig sabihin, ang nakabahaging paniniwala o pagpapahayag ng pananampalataya ng komunidad.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Kaya nga
  rationale: Likas sa modernong Tagalog at pinananatili ang pangwakas na lohikal na ugnayan sa naunang pangangatwiran.
- source_word: ὡς καιρὸν ἔχομεν
  choice: habang may pagkakataon tayo
  rationale: Ipinahahayag ng καιρός ang angkop o napapanahong pagkakataon, hindi lamang ang paglipas ng oras; pinananatili rin ng 'habang' ang temporal na posibilidad ng parirala.
- source_word: ἐργαζώμεθα τὸ ἀγαθὸν
  choice: gumawa tayo ng mabuti
  rationale: Ang hortatory subjunctive ay likas na isinasalin bilang sama-samang panawagan; ang parirala ay malinaw at karaniwan sa Tagalog.
- source_word: πρὸς πάντας
  choice: sa lahat
  rationale: Maikli at natural na nagpapakita na ang mabuting gawa ay nakatuon sa lahat ng tao.
- source_word: μάλιστα δὲ
  choice: at lalo na
  rationale: Nagbibigay ito ng natatanging prayoridad sa loob ng pangkalahatang utos, nang hindi ibinubukod ang iba.
- source_word: τοὺς οἰκείους τῆς πίστεως
  choice: mga kabilang sa sambahayan ng pananampalataya
  rationale: Pinananatili ang talinghagang sambahayan ng οἰκεῖοι at hindi nililimitahan ang parirala sa pormal na institusyonal na kasapian.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Ito ang karaniwan at tekstuwal na salin ng πίστις dito, habang nananatiling bukas kung tumutukoy sa pagtitiwala o sa sama-samang pananampalatayang kinikilala ng komunidad.
theological_decisions:
- issue: Saklaw at prayoridad ng paggawa ng mabuti
  choice: Gumawa ng mabuti sa lahat, na may natatanging prayoridad sa mga kapwa kabilang sa komunidad ng pananampalataya.
  alternative: Gumawa lamang ng mabuti sa mga mananampalataya, o huwag kilalanin ang anumang natatanging pananagutan sa kanila.
  rationale: Malinaw na pinagsasama ng Griyego ang pangkalahatang saklaw na πρὸς πάντας at ang natatanging diin na μάλιστα sa mga οἰκείους τῆς πίστεως.
- issue: Kahulugan ng τῆς πίστεως
  choice: Pinanatili ang 'pananampalataya' bilang katangiang nagbubuklod sa sambahayan.
  alternative: '''Ang pananampalataya'' bilang nakabahaging kapahayagan o kalipunan ng paniniwala.'
  rationale: Hindi hinihingi ng teksto na paliitin ito sa isang institusyonal o pormal na kredal na kahulugan; inilalahad sa talababa ang tunay na posibleng pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'sambahayan' upang mapanatili ang orihinal na larawang pampamilya; ang 'gumawa tayo' ay likas na sama-samang panawagan. Inilagay ang mga marker sa mismong tekstong pangunahing salin.
