  terminology: Pinanatili ang “magpatuli,” “krus,” at “Mesiyas.” Ang “sa panlabas” sa pangunahing teksto ay angkop sa kontekstuwal na diwa ng ἐν σαρκί; ibinabalik ng talababa ang mas literal at Paulinong “sa laman,” upang hindi maalis ang saklaw ng orihinal na salita.
