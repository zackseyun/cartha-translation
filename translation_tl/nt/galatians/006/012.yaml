base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/012.yaml
  text: As many as want to make a good showing in the flesh[a], these are forcing you to be circumcised[c][b], only so that they may not be persecuted for the cross of the Messiah.
translation:
  language: tl
  text: Ang lahat ng nagnanais na magbigay ng magandang impresyon sa panlabas[a] ay sila ang namimilit sa inyo na magpatuli, upang lamang hindi sila usigin dahil sa krus ng Mesiyas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpakitang mabuti sa laman.”
    reason: lexical_alternative
  - marker: b
    text: 'Nakaugaliang salin: “krus ni Cristo.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: ὅσοι θέλουσιν
  choice: Ang mga nagnanais
  rationale: Likas sa modernong Tagalog at pinananatili ang pagtukoy sa buong uri ng mga taong may ganitong hangarin.
- source_word: εὐπροσωπῆσαι
  choice: magpakitang-gilas
  rationale: Ipinahihiwatig ang pagsisikap na magmukhang kahanga-hanga o katanggap-tanggap sa panlabas, kasama ang mapanuring tono ni Pablo.
- source_word: ἐν σαρκί
  choice: sa laman
  rationale: Pinananatili ang teolohikal at retorikal na bigat ng σάρξ, sa halip na agad itong ipaliwanag bilang panlabas lamang; nililinaw sa talababa ang posibleng diwa.
- source_word: οὗτοι ἀναγκάζουσιν
  choice: ang siyang namimilit
  rationale: Ang 'siyang' ay nagpapanatili sa diin ng demonstratibong οὗτοι, at ang 'namimilit' ay nagpapakita ng nagpapatuloy na panggigipit.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: sa inyo na magpatuli
  rationale: Natural na Tagalog para sa pagpapasailalim sa pagtutuli at angkop sa konkretong usapin ng talata.
- source_word: μόνον ἵνα
  choice: para lamang
  rationale: Malinaw na ipinapahayag ang nag-iisang layuning ibinibintang ni Pablo sa kanila.
- source_word: τῷ σταυρῷ
  choice: dahil sa krus
  rationale: Likas na ipinahahayag sa Tagalog ang sanhi o batayan ng pag-uusig, habang kinikilala na maaari rin itong unawain bilang 'alang-alang sa krus.'
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Dito ay gumaganap ang Χριστός bilang titulo, kaya isinasalin ang kahulugan sa halip na gamitin lamang ang tradisyonal na transliterasyong 'Cristo.'
- source_word: μὴ διώκωνται
  choice: hindi sila usigin
  rationale: Pinananatili ang pasibong diwa at ang layuning makaiwas sa pag-uusig.
theological_decisions:
- issue: Diwa ng ἐν σαρκί
  choice: sa laman
  alternative: sa panlabas na anyo; sa mga bagay na panlabas
  rationale: Ang 'laman' ay nagpapanatili sa sadyang masaklaw at teolohikal na bokabularyo ni Pablo, samantalang ipinakikita ng talababa ang partikular na panlabas at katawang diwa sa kontekstong ito.
- issue: Pagpapakahulugan sa Χριστοῦ
  choice: ng Mesiyas
  alternative: ni Cristo
  rationale: Ang pariralang 'krus ng Mesiyas' ay nagpapanatili sa titular na kahulugan ng Χριστός; ibinibigay sa talababa ang nakaugaliang anyo.
- issue: Ugnayan ng datibong τῷ σταυρῷ sa διώκωνται
  choice: dahil sa krus
  alternative: alang-alang sa krus
  rationale: Malamang na sanhi o batayan ng pag-uusig ang tinutukoy, ngunit nananatiling posible ang mas compact na ugnayang 'alang-alang sa'; hindi kailangang gawing hiwalay na talababa dahil natural at tapat ang pangunahing salin.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang masiglang 'magpakitang-gilas' upang maipakita ang negatibong retorikal na diin ng εὐπροσωπῆσαι; pinanatili naman ang 'laman' upang hindi mawala ang tunay na ambiguwidad at teolohikal na tensiyon ng salita.
