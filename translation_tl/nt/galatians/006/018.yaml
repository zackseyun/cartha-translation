  source_fidelity: 'Tumpak na naipapahayag ang pangwakas na pagpapala: ang “biyaya,” ang “ating Panginoon,” si Jesus bilang “ang Mesiyas,” ang pakikiisa nito sa “inyong espiritu,” ang bokatibong “mga kapatid,” at ang “Amen.” Ang “Nawa’y sumainyong espiritu ang biyaya” ay isang katanggap-tanggap na marangal na ayos ng pangungusap para sa benediksiyong Griyego na walang tahasang pandiwa.'
  naturalness: Likas at angkop ang makabagong Filipino, habang nananatiling marangal ang rehistro. Ang “sumainyong espiritu” ay bahagyang pampanitikan ngunit malinaw at angkop sa pangwakas na pagpapala.
  terminology: Maayos ang “biyaya,” “Panginoon,” “Mesiyas,” “espiritu,” at “mga kapatid.” Ang “mga kapatid” ay natural na Filipino at maaaring tumukoy sa buong pamayanan nang hindi binubura ang panlalaking anyo ng Griyego. Ang “Mesiyas” ay wastong pagsasalin ng Χριστός bilang titulo.
