  text: Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ὑμῶν, ἀδελφοί· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/018.yaml
  text: The grace of our Lord Jesus Christ be with your spirit[a], brothers[b]. Amen.
translation:
  language: tl
  text: Nawa’y sumainyong espiritu[a] ang biyaya ng ating Panginoong Jesus, ang Mesiyas, mga kapatid[b]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tahasang “inyong espiritu” sa Griyego; isahan ang “espiritu” bagaman buong pamayanan ang kinakausap.
    reason: lexical_clarification
  - marker: b
    text: Ang “mga kapatid” ay tumutukoy rito sa pamayanan ng mga mananampalataya at maaaring kabilang ang mga lalaki at babae.
    reason: scope_clarification
lexical_decisions:
- source_word: χάρις
  choice: biyaya
  rationale: Karaniwang salin sa makabagong Filipino para sa χάρις; pinananatili nito ang teolohikal na bigat at likas na tunog ng pangwakas na pagpapala ni Pablo.
- source_word: κυρίου
  choice: Panginoon
  rationale: Likas at kinikilalang katumbas ng κύριος sa kontekstong Kristiyano.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, ang Mesiyas
  rationale: Isinalin ang Χριστός bilang titulong “Mesiyas” sa halip na ituring lamang na bahagi ng pangalan; nililinaw ng hulaping parirala ang kaugnayan nito kay Jesus.
- source_word: μετὰ
  choice: sumainyo
  rationale: Walang tahasang pandiwa ang Griyegong pormula ng pagpapala; ang “sumainyo” ay maikli at angkop na Filipino para sa diwang “makasama ninyo.”
- source_word: πνεύματος ὑμῶν
  choice: inyong espiritu
  rationale: Pinananatili ang tahasang πνεῦμα at ang isahang “espiritu” na ipinares sa pangmaramihang “inyong,” gaya ng kolektibong pagtukoy sa pamayanan sa Griyego.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Sa Filipino, ang “mga kapatid” ay likas na di-tiyak sa kasarian at tumpak na tumutukoy sa buong pamayanang mananampalataya na kinakausap ng panlalaking pangmaramihang Griyego.
- source_word: ἀμήν
  choice: Amen
  rationale: Pinananatili ang nakaugaliang transliterasyon ng pangwakas na pormulang liturhikal.
theological_decisions:
- issue: Pagpapahayag sa Χριστός sa pangwakas na pagpapala ni Pablo
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay may puwersa ng isang titulo rito. Ipinahahayag ng “Mesiyas” ang kahulugan nito, samantalang maaaring basahin ang “Cristo” bilang nakasanayang ikalawang pangalan lamang.
- issue: Saklaw ng ἀδελφοί
  choice: mga kapatid
  alternative: mga kapatid na lalaki
  rationale: Bagaman panlalaking pangmaramihan ang anyong Griyego, karaniwan nitong kinakausap ang buong kongregasyon. Ang “mga kapatid” sa Filipino ay tumpak na katawagang pampamilya at likas na maaaring sumaklaw sa mga lalaki at babae.
- issue: Kolektibong isahang πνεῦμα sa πνεύματος ὑμῶν
  choice: inyong espiritu
  alternative: kayo
  rationale: Pinananatili ang kakaibang isahang “espiritu” at hindi ito pinapantay sa pangkalahatang “kayo,” upang hindi mawala ang posibleng diin ni Pablo sa panloob o sama-samang espirituwal na buhay ng pamayanan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang maikling pormulang pagpapalang “Nawa’y sumainyo” at iniwasan ang mas mabigat o mas lumang “mapasainyo.” Ang “Jesus, ang Mesiyas” ay malinaw na nagpapakitang titulo ang Mesiyas.
