  yaml_path: translation/nt/galatians/006/007.yaml
  text: 'Do not be deceived: God is not mocked[a], for whatever a man sows, this he will also reap.'
translation:
  language: tl
  text: 'Huwag kayong magpadaya: Hindi nalilibak ang Diyos. Sapagkat anuman ang ihasik ng tao, iyon din ang aanihin niya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Huwag kayong magpadaya
  rationale: Pinananatili nito ang pasibong diwa ng pangkasalukuyang pautos at ang tuwirang tono ng babala sa maramihang kausap.
- source_word: θεὸς οὐ μυκτηρίζεται
  choice: hindi maaaring hamakin ang Diyos
  rationale: Ang μυκτηρίζω ay tumutukoy sa paghamak o panunuya. Likas sa Filipino ang pariralang ito at ipinahihiwatig nitong hindi maaaring tratuhin ang Diyos nang may paghamak na para bang matatakasan ang bunga nito.
- source_word: ὃ γὰρ ἐὰν
  choice: Sapagkat anuman
  rationale: Malinaw nitong ipinapahayag ang pangkalahatang kondisyong ipinakikilala ng di-tiyak na panghalip.
- source_word: σπείρῃ
  choice: ihasik
  rationale: Pinananatili ang literal na larawang pang-agrikultura at ang kaugnayan nito sa pag-aani.
- source_word: ἄνθρωπος
  choice: tao
  rationale: Sa Filipino, ang “tao” ay likas na pangkalahatan at tumpak na tumutukoy sa sinumang tao, kaya hindi kailangang magdagdag ng kasarian na hindi mahalaga sa diwa rito.
- source_word: τοῦτο καὶ θερίσει
  choice: iyon din ang aanihin niya
  rationale: Pinananatili ng “iyon din” ang madiing pagtutugma ng mismong inihasik at aanihin; ang “niya” ay natural na tumutukoy sa pangkalahatang “tao.”
theological_decisions:
- issue: Saklaw ng ἄνθρωπος bilang pangkalahatang katawagan
  choice: tao
  alternative: isang lalaki
  rationale: Bagaman maaaring panlalaki ang anyong Griyego, pangkalahatan ang gamit nito rito. Ang “tao” ang natural at tumpak na katumbas sa Filipino nang hindi nililimitahan ang prinsipyo sa mga lalaki.
- issue: Diwa ng θεὸς οὐ μυκτηρίζεται
  choice: hindi maaaring hamakin ang Diyos
  alternative: hindi kinukutya ang Diyos
  rationale: Ang pahayag ay hindi simpleng nagkakaila na may kumukutya sa Diyos; mariin nitong sinasabing hindi Siya malilibak o mahahamak nang walang kabuluhan. Ang napiling anyo ay nagpapanatili sa babala nang hindi nagpapasok ng partikular na doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling babala at ang talinghaga ng paghahasik at pag-aani; iniwasan ang salitang sobrang teknikal o makaluma.
