  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι ὁ σπείρων εἰς τὴν σάρκα ἑαυτοῦ ἐκ τῆς σαρκὸς θερίσει φθοράν, ὁ δὲ σπείρων εἰς τὸ πνεῦμα ἐκ τοῦ πνεύματος θερίσει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/008.yaml
  text: For the one who sows to his own flesh will reap corruption from the flesh[c][b][a], but the one who sows to the Spirit will reap eternal life from the Spirit.
translation:
  language: tl
  text: Sapagkat ang naghahasik para sa sarili niyang laman[a] ay mag-aani ng pagkabulok[b] mula sa laman, ngunit ang naghahasik para sa Espiritu[c] ay mag-aani ng buhay na walang hanggan mula sa Espiritu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa sarili niyang makasalanang pagkatao.” Ang salitang Griyego na sarx ay maaaring tumukoy sa literal na laman o, sa mga etikal na paghahambing ni Pablo, sa makasalanang oryentasyon ng tao na salungat sa Espiritu.
    reason: lexical_alternative
  - marker: b
    text: O “pagkasira” o “kapahamakan.” Maaaring tumukoy ang salitang Griyego sa kabulukan, pagkasira, o pagkapahamak.
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, ang Banal na Espiritu. Maaari ring isulat na “espiritu,” ngunit sa sulat sa mga taga-Galacia, ang paghahambing na ito ay karaniwang tumutukoy sa Espiritu ng Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Nagbibigay ito ng batayan o paliwanag sa naunang pangaral at natural na naghahatid ng gayong diwa sa Tagalog.
- source_word: ὁ σπείρων
  choice: ang naghahasik
  rationale: Pinananatili nito ang pangkalahatan at patuloy na diwa ng substantival present participle, pati ang larawang pang-agrikultura.
- source_word: εἰς τὴν σάρκα ἑαυτοῦ
  choice: para sa sarili niyang laman
  rationale: Ang “para sa” ay natural na katumbas ng εἰς sa idyomang paghahasik na nakatuon sa isang layunin. Pinananatili ng “laman” ang terminolohiya at tensiyong teolohikal ni Pablo, at ng “sarili niyang” ang diin ng ἑαυτοῦ.
- source_word: ἐκ τῆς σαρκὸς
  choice: mula sa laman
  rationale: Malinaw na ipinahahayag ng “mula sa” ang pinagmulan at pinananatili ang pagkakapantay ng dalawang sugnay.
- source_word: θερίσει
  choice: mag-aani
  rationale: Natural itong kapareha ng “naghahasik” at pinananatili ang metaporang pang-agrikultura.
- source_word: φθοράν
  choice: pagkabulok
  rationale: Saklaw nito ang diwa ng pagkasira, kabulukan, at kapahamakan nang hindi nililimitahan ang salita sa pisikal na pagkabulok lamang o sa ganap na pagkalipol.
- source_word: ὁ δὲ σπείρων
  choice: ngunit ang naghahasik
  rationale: Malinaw na minamarkahan ng “ngunit” ang salungatan, habang inuulit ang anyo ng unang sugnay.
- source_word: εἰς τὸ πνεῦμα
  choice: para sa Espiritu
  rationale: Ang “para sa” ay natural sa Tagalog sa metapora ng paghahasik; ang malaking titik ay nagpapahiwatig sa malamang na pagtukoy sa Espiritu ng Diyos sa konteksto ng Galacia.
- source_word: ἐκ τοῦ πνεύματος
  choice: mula sa Espiritu
  rationale: Ipinahahayag nito ang pinagmulan at pinananatili ang mahigpit na paralelismo sa “mula sa laman.”
- source_word: ζωὴν αἰώνιον
  choice: buhay na walang hanggan
  rationale: Ito ang natural, malinaw, at nakagawiang Tagalog para sa buhay na tumatagal magpakailanman at kaugnay ng darating na kapanahunan.
theological_decisions:
- issue: Kahulugan ng σάρξ sa etikal na paghahambing ni Pablo
  choice: laman
  alternative: makasalanang pagkatao
  rationale: Bagaman etikal ang gamit at maaaring ipaliwanag bilang makasalanang oryentasyon ng tao, pinananatili ng “laman” ang natatanging bokabularyo ni Pablo at ang tunay na lawak at tensiyon ng salita.
- issue: Tinutukoy ng πνεῦμα
  choice: Espiritu
  alternative: espiritu
  rationale: Sa konteksto ng Galacia at ng paulit-ulit na pagsasalungat ng laman at Espiritu, malamang na ang tinutukoy ay ang Espiritu ng Diyos. Gayunman, itinatala sa talababa ang posibleng maliit-na-titik na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang balanseng paralelismo ng paghahasik at pag-aani, gayundin ang terminong “laman,” sa halip na gawing mas tiyak ang interpretasyon sa pangunahing teksto.
