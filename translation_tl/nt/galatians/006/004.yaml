  yaml_path: translation/nt/galatians/006/004.yaml
  text: But let each one test his own work[a], and then he will have his reason for boasting in himself alone and not in the other person[b],
translation:
  language: tl
  text: Ngunit suriin ng bawat isa ang sarili niyang gawa. Sa gayon, magkakaroon siya ng dahilan para magmalaki[a] tungkol lamang sa sarili niya at hindi tungkol sa iba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magkakaroon siya ng maipagmamalaki” o “magkakaroon siya ng pagmamalaki.” Ang salitang Griyego ay maaaring tumukoy sa mismong pagmamalaki o sa batayan nito.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “sa iba,” na tumutukoy sa ibang tao na kaiba sa sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἔργον ἑαυτοῦ
  choice: ang sarili niyang gawa
  rationale: Pinananatili ng “gawa” ang malawak na diwa ng ἔργον—ang sariling ginagawa o asal—nang hindi ito nililimitahan sa iisang kilos. Malinaw na ipinahihiwatig ng “sarili niyang” ang reflexive na ἑαυτοῦ.
- source_word: δοκιμαζέτω
  choice: suriin
  rationale: Ang “suriin” ay likas na pautos sa Filipino at nagpapahayag ng maingat na pagsusuri upang malaman ang kalidad, nang hindi ipinapalagay na magiging positibo ang resulta.
- source_word: ἕκαστος
  choice: bawat isa
  rationale: 'Pinananatili nito ang distributibong diwa: personal na dapat suriin ng bawat tao ang sarili niyang gawa.'
- source_word: καὶ τότε
  choice: Sa gayon
  rationale: Ipinahahayag nito ang kasunod na resulta ng pagsusuri. Ginawang hiwalay na pangungusap para sa malinaw at natural na daloy sa Filipino.
- source_word: τὸ καύχημα ἕξει
  choice: magkakaroon siya ng dahilan para magmalaki
  rationale: Naipapakita nito na ang καύχημα ay maaaring tumukoy sa batayan o dahilan ng pagmamalaki, hindi lamang sa mismong pagkilos ng pagmamalaki.
- source_word: εἰς ἑαυτὸν μόνον
  choice: tungkol lamang sa sarili niya
  rationale: Pinananatili nito ang reflexive na pokus at ang paglilimita ng μόνον, nang hindi idinaragdag na ang sarili ang ganap na pinagmumulan ng moral na halaga.
- source_word: τὸν ἕτερον
  choice: iba
  rationale: Sa konteksto, tumutukoy ito sa ibang tao na ikinokontra sa sarili. Likas sa Filipino ang “iba,” habang ipinapaliwanag ng talababa ang tinutukoy.
- source_word: δέ
  choice: Ngunit
  rationale: Ipinahihiwatig nito ang banayad na pagsalungat o paglipat mula sa naunang pahayag tungo sa pagsusuri ng sariling gawa.
theological_decisions:
- issue: Diwa ng καύχημα sa kontekstong Paulino
  choice: dahilan para magmalaki
  alternative: maipagmamalaki; pagmamalaki
  rationale: Pinananatili ng salin ang posibilidad na ang salita ay tumutukoy sa batayan ng pagmamalaki, habang hindi nagpapasiya kung ang pagmamalaking ito ay kapuri-puri, ironiko, o simpleng lehitimong pagtitiwala.
- issue: Ugnayan ng sarili at ng “iba”
  choice: tungkol lamang sa sarili niya at hindi tungkol sa iba
  alternative: hindi dahil sa paghahambing sa iba
  rationale: Hindi tahasang idinagdag ang ideya ng paghahambing kahit malakas itong ipinahihiwatig ng konteksto; sa gayon ay napapanatili ang anyo at bahagyang kalabuan ng Griyego.
- issue: Kasariang gramatikal ng generic na paksa
  choice: bawat isa … sarili niyang … siya
  alternative: bawat tao … sariling … niya
  rationale: Walang kailangang ipataw na kasariang panlalaki sa Filipino. Ang isahang generic na paksa at mga panghalip ay tumpak na pinananatili nang walang pagbabago sa saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “suriin” at “gawa” bilang karaniwang salitang madaling maunawaan, samantalang pinanatili ng “dahilan para magmalaki” ang teolohikal at leksikal na tensiyon ng καύχημα. Ang paghahati sa dalawang pangungusap ay para sa likas na daloy nang hindi binabago ang lohika ng talata.
