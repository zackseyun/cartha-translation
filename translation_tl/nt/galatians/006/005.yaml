  text: ἕκαστος γὰρ τὸ ἴδιον φορτίον βαστάσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/005.yaml
  text: For each one will carry his own load[a].
translation:
  language: tl
  text: Sapagkat papasanin ng bawat isa ang sarili niyang pasan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dadalhin ng bawat isa ang sarili niyang dalahin.” Ang salitang Griego rito na φορτίον (“pasan” o “dalahin”) ay iba sa βάρη (“mga pasanin”) sa talata 2.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: bawat isa
  rationale: 'Pinananatili nito ang distributibong diwa ng pang-isahang anyo: bawat indibidwal ay tinutukoy.'
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinapakita nito ang paliwanag na kaugnayan ng pangungusap sa naunang konteksto nang hindi dinaragdagan ang kahulugan.
- source_word: τὸ ἴδιον
  choice: sarili niyang
  rationale: Malinaw nitong ipinahahayag na ang pasan ay nauukol sa mismong taong tinutukoy. Likas na walang kasariang ipinapataw ang panghalip sa Tagalog.
- source_word: φορτίον
  choice: pasan
  rationale: Ang “pasan” ay isang dalahin o bigat na kailangang buhatin. Pinili ito upang maipahiwatig ang kongkretong larawan at mapanatili, hangga't likas sa Tagalog, ang pagkakaiba nito sa βάρη sa talata 2.
- source_word: βαστάσει
  choice: papasanin
  rationale: Ang anyong panghinaharap ay pinananatili, at ang “papasanin” ay natural na katumbas ng pagdadala o pagbuhat ng isang pasan.
theological_decisions:
- issue: Kaugnayan ng Galacia 6:5 sa 6:2
  choice: Pinanatili ang larawan ng sariling “pasan” nang hindi ipinapaliwanag sa mismong salin kung paano ito iuugnay sa pagtutulungan sa pagdadala ng “mga pasanin” sa talata 2.
  alternative: Gamitin ang “pasanin” sa dalawang talata, o tukuyin dito nang tahasan ang pananagutan sa huling paghuhukom.
  rationale: Magkaibang pangngalan ang ginamit ni Pablo sa dalawang talata. Hindi dapat alisin ng salin ang tensiyon sa pagitan ng pagtutulungan sa talata 2 at ng personal na pananagutan sa talata 5, ni limitahan ang talata sa isang partikular na doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “papasanin” at “pasan” ay sadyang nagpapanatili sa larawan ng pagbubuhat, samantalang ang “bawat isa” ay tumutugma sa pang-isahang distributibong diin ng Griego.
