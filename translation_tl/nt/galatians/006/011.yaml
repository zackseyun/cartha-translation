  text: See with what large letters I have written to you with my own hand[a].
translation:
  language: tl
  text: Tingnan ninyo kung gaano kalalaki ang mga titik na sinulat ko sa inyo gamit ang sarili kong kamay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Tingnan ninyo kung gaano kahaba ang liham na sinulat ko sa inyo gamit ang sarili kong kamay.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδετε
  choice: Tingnan ninyo
  rationale: Ang maramihang pautos ay tuwirang nagtatawag ng pansin. Likas at malinaw sa modernong Tagalog ang “Tingnan ninyo.”
- source_word: πηλίκοις
  choice: kung gaano kalalaki
  rationale: Ipinahahayag ng salita ang laki o sukat. Ang anyong “kung gaano kalalaki” ay natural na tumutukoy sa kapansin-pansing laki ng mga titik.
- source_word: γράμμασιν
  choice: mga titik
  rationale: Sa kontekstong ito, pinakamalamang na tumutukoy ito sa mga nakasulat na karakter o titik, hindi sa isang liham bilang kabuuan.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Pinananatili nito ang datibong tumutukoy sa mga sinulatan ni Pablo.
- source_word: ἔγραψα
  choice: isinulat ko
  rationale: Ang payak na aspektong naganap ay natural na naihahayag sa Tagalog sa “isinulat ko,” at tumutukoy sa nakasulat na nasa harap ng mga mambabasa.
- source_word: τῇ ἐμῇ χειρί
  choice: sa sarili kong kamay
  rationale: Ipinakikita ng parirala ang personal na pagsulat ni Pablo at pinananatili ang diin ng ἐμῇ sa pamamagitan ng “sarili kong.”
theological_decisions:
- issue: Kahulugan ng πηλίκοις γράμμασιν
  choice: pisikal na laki ng mga titik
  alternative: haba ng liham na isinulat ni Pablo
  rationale: Karaniwang tumutukoy ang γράμματα sa mga titik o karakter, at sinusuportahan ito ng kasunod na pagbanggit sa sariling kamay ni Pablo. Gayunman, maaaring tumukoy ang πηλίκοις sa lawak o haba, kaya pinananatili sa talababa ang makasaysayang alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “mga titik” upang malinaw na tumukoy sa laki ng sulat-kamay, habang inilagay sa talababa ang tunay na alternatibong pagbasa tungkol sa haba ng liham.
