  text: τὸ δὲ καλὸν ποιοῦντες μὴ ⸀ἐγκακῶμεν, καιρῷ γὰρ ἰδίῳ θερίσομεν μὴ ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/009.yaml
  text: And let us not grow weary in doing good[a], for in due time we will reap[c][b], if we do not give up.
translation:
  language: tl
  text: Huwag tayong panghinaan ng loob sa paggawa ng mabuti,[a] sapagkat sa takdang panahon[b] ay aani tayo, kung hindi tayo manlulupaypay.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “sa paggawa ng kung ano ang mabuti.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring, “sa angkop na panahon” o “sa sarili nitong panahon.”
    reason: lexical_alternative
  - marker: c
    text: Literal na, “nang hindi nanlulupaypay” o “nang hindi napapagod nang lubos.” Maaari ring, “kung hindi tayo susuko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ καλὸν ποιοῦντες
  choice: sa paggawa ng mabuti
  rationale: Likas na pariralang Filipino para sa idyomang nangangahulugang gawin ang mabuti o marangal; pinananatili rin nito ang nagpapatuloy na diwa ng participle.
- source_word: μὴ ἐγκακῶμεν
  choice: Huwag tayong magsawa
  rationale: Ipinahahayag nito ang paghina ng sigasig o loob habang patuloy na gumagawa ng mabuti, nang hindi paunang inuulit ang huling pahayag tungkol sa panghihina.
- source_word: καιρῷ ... ἰδίῳ
  choice: sa takdang panahon
  rationale: Ipinahahayag ang angkop o itinakdang panahon at natural itong pakinggan sa modernong Filipino.
- source_word: θερίσομεν
  choice: aani tayo
  rationale: Pinananatili ang malinaw na metaporang agrikultural ng konteksto.
- source_word: μὴ ἐκλυόμενοι
  choice: kung hindi tayo panghihinaan
  rationale: Inilalahad ang kondisyunal na puwersa ng participle at ang diwa ng hindi pagkapagod, panlulupaypay, o pagsuko, habang naiiba pa rin sa unang pandiwa.
theological_decisions:
- issue: Ugnayan ng dalawang pahayag tungkol sa pagtitiyaga (ἐγκακῶμεν / ἐκλυόμενοι)
  choice: 'Gawing magkaugnay ngunit magkaiba: “magsawa” at “panghihinaan.”'
  alternative: “panghinaan ng loob” at “sumuko,” o “mapagod” at “manlupaypay.”
  rationale: Dalawang magkaugnay ngunit hindi magkaparehong salita ang ginamit ni Pablo. Pinananatili ng salin ang retorikal na pagkakaiba nang hindi dinaragdagan o nilulutas ang anumang doktrinal na implikasyon.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ang “aani” ay nagpapanatili sa metaporang agrikultural, samantalang ang mga talababa ay nagpapakita ng tunay na lawak ng kahulugan ng mga salitang Griyego.
