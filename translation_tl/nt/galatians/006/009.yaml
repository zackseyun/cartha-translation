- from: Huwag tayong magsawa sa paggawa ng mabuti,[a] sapagkat sa takdang panahon[b] ay aani tayo, kung hindi tayo panghihinaan.[c]
  to: Huwag tayong panghinaan ng loob sa paggawa ng mabuti,[a] sapagkat sa takdang panahon[b] ay aani tayo, kung hindi tayo manlulupaypay.[c]
  rationale: Pinalitan ang “magsawa” ng “panghinaan ng loob” upang mas tumpak na maihatid ang ἐγκακῶμεν, at ang di-natural na “kung hindi tayo panghihinaan” ng “kung hindi tayo manlulupaypay” para sa ἐκλυόμενοι. Ang pares na ito ay nagpapanatili ng sadyang pagkakaiba ng dalawang malapit na pahayag sa Griyego. Hindi binago ang metapora ng pag-aani o ang diwa ng angkop na panahon.
