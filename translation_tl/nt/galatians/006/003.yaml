id: GAL.6.3
reference: Galatians 6:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ γὰρ δοκεῖ τις εἶναί τι μηδὲν ὤν, ⸂φρεναπατᾷ ἑαυτόν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/003.yaml
  text: For if anyone thinks he is something when he is nothing[a], he deceives himself.
translation:
  language: tl
  text: Sapagkat kung iniisip ng sinuman na siya ay mahalaga gayong wala naman siyang halaga, nililinlang[a] niya ang kanyang sarili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dinadaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Sapagkat kung
  rationale: Pinananatili nito ang paliwanag na puwersa ng γάρ at ang pasubaling diwa ng εἰ, at natural itong nag-uugnay sa naunang pangaral.
- source_word: δοκεῖ
  choice: iniisip
  rationale: Tumutukoy rito ang pandiwa sa sariling pagtataya ng isang tao, hindi sa kung paano siya nakikita ng iba.
- source_word: τις
  choice: sinuman
  rationale: Pangkalahatan at di-tiyak ang τις; natural na ipinahahayag ng “sinuman” ang saklaw nito nang hindi nililimitahan sa isang kasarian.
- source_word: εἶναί τι
  choice: na siya ay mahalaga
  rationale: Ang idyomang εἶναί τι ay tumutukoy sa pag-aakalang may kabuluhan o mataas na katayuan ang sarili. Mas natural ito sa modernong Tagalog kaysa sa literal na “siya ay isang bagay.”
- source_word: μηδὲν ὤν
  choice: gayong wala naman siyang halaga
  rationale: Inilalahad nito ang matalim na pagsalungat sa εἶναί τι. Ipinahihiwatig ng “gayong” ang kasabay na salungat na kalagayan nang malinaw at natural.
- source_word: φρεναπατᾷ
  choice: nililinlang
  rationale: Ipinahahayag nito ang panlilinlang o pagligaw sa sariling pag-iisip; ang “nililinlang” ay malinaw at angkop sa marangal na modernong Tagalog.
- source_word: ἑαυτόν
  choice: ang kanyang sarili
  rationale: 'Pinananatili nito ang tahasang reflexive na diwa: ang taong nagkakamali sa pagtaya sa sarili ang siya ring nalilinlang.'
theological_decisions:
- issue: Pangkalahatang pagtukoy sa tao
  choice: sinuman … siya … niya … kanyang sarili
  alternative: ang isang tao … siya … sarili niya
  rationale: Bagaman panlalaking isahan ang anyong gramatikal sa Griyego, kinatawan nito ang sinumang tao. Ang mga panghalip sa Tagalog ay likas na walang kasarian, kaya napapanatili ang isahan at pangkalahatang saklaw nang hindi nagdaragdag ng kasariang wala sa kahulugan.
- issue: Kahulugan ng pagiging “something” at “nothing”
  choice: mahalaga … wala naman siyang halaga
  alternative: may kabuluhan … walang kabuluhan
  rationale: Ang konteksto ay sariling pagpapahalaga at pagmamataas. Pinananatili ng salin ang tuwirang pagsalungat ngunit hindi ito pinalalawak tungo sa doktrinal na pahayag tungkol sa lubos na kawalang-halaga ng tao.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “siya ay” sa halip na pinaikling anyo upang mapanatili ang maayos na publikasyong rehistro; ang “mahalaga … halaga” ay natural na naghahatid ng maikli at matalim na paghahambing ng Griyego.
