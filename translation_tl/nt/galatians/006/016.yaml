source:
  edition: SBLGNT
  text: καὶ ὅσοι τῷ κανόνι τούτῳ στοιχήσουσιν, εἰρήνη ἐπ’ αὐτοὺς καὶ ἔλεος, καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/016.yaml
  text: And as many as will walk by this rule—peace be upon them and mercy[c][b][a], and upon the Israel of God.
translation:
  language: tl
  text: At sa lahat ng mamumuhay ayon sa pamantayang ito[a]—sumakanila nawa ang kapayapaan at awa, at[c] sa Israel ng Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa lahat ng lalakad ayon sa pamantayang ito” o “sa lahat ng susunod sa tuntuning ito.” Ang pandiwa ay may diwa ng paglakad nang nakahanay o pagsabay sa isang pamantayan.
    reason: lexical_alternative
  - marker: b
    text: Pinagtatalunan ang kahulugan ng “Israel ng Diyos.” Maaaring tumukoy ito sa mga Judiong sumasampalataya, sa buong iglesya, o sa bayan ng Diyos sa mas malawak na diwa. Pinananatili ng salin ang pananalita ng Griyego nang hindi nilulutas ang usapin.
    reason: alternative_reading
  - marker: c
    text: Ang huling “at” ay maaaring unawaing nagdaragdag ng isa pang pangkat (“at sa Israel ng Diyos”) o muling tumutukoy sa naunang pangkat (“maging sa Israel ng Diyos”).
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: sa lahat ng
  rationale: 'Likas na Filipino para sa saklaw na distributibo ng panghalip: tumutukoy sa lahat ng kabilang sa inilalarawang pangkat nang hindi nililimitahan kung sino sila.'
- source_word: κανόνι
  choice: pamantayan
  rationale: Ang κανών dito ay isang batayan o norma na sinusunod sa pamumuhay. Mas malinaw sa karaniwang mambabasa ang “pamantayan” kaysa sa “tuntunin,” na maaaring magpahiwatig ng isang partikular na utos.
- source_word: στοιχήσουσιν
  choice: mamumuhay ayon sa
  rationale: Ipinahahayag nito ang etikal na diwa ng paglakad nang nakahanay o nakaayon sa isang pamantayan. Ang literal na “lalakad” ay posible ngunit maaaring mapagkamalang pisikal na paglalakad sa Filipino.
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Karaniwang katumbas ng εἰρήνη at angkop sa pormula ng pagpapala.
- source_word: ἔλεος
  choice: awa
  rationale: Direkta at likas na katumbas ng ἔλεος sa Filipino, lalo na sa konteksto ng habag ng Diyos.
- source_word: ἐπ’ αὐτοὺς ... καὶ ἐπὶ
  choice: sumakanila ... at sa
  rationale: Pinananatili ng “sumakanila” ang diwa ng pagpapalang mapasa kanila; ang ikalawang ἐπί ay ipinahihiwatig sa “at sa” nang hindi ginagawang mabigat o di-likas ang pangungusap.
- source_word: Ἰσραὴλ τοῦ θεοῦ
  choice: Israel ng Diyos
  rationale: Malinaw at pormal na salin ng pariralang genitibo na hindi nagpapasiya kung sino ang tiyak na tinutukoy nito.
theological_decisions:
- issue: Tinutukoy ng “Israel ng Diyos”
  choice: Pinanatili ang literal na “Israel ng Diyos” nang walang paliwanag sa pangunahing teksto.
  alternative: Tukuyin ito bilang mga Judiong mananampalataya, ang buong iglesya, o ang lahat ng bayan ng Diyos.
  rationale: Hindi sapilitang nilulutas ng Griyego kung alin sa mga pagbasa ang tama. Pinananatili ng literal na anyo ang tunay na teolohikal na tensiyon.
- issue: Gamit ng huling καί bago ang “Israel ng Diyos”
  choice: Isinalin bilang “at,” na maaaring magdagdag ng ibang pangkat o muling tumukoy sa naunang pangkat.
  alternative: Isalin bilang “maging” o “samakatuwid ay,” na gagawing tahasang pagpapaliwanag o apposisyon ang kasunod na parirala.
  rationale: Maaaring additive o epexegetical/appositional ang καί sa konteksto. Ang payak na “at” ang hindi nagpapasya sa pinagtatalunang sintaktiko at teolohikal na usapin.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sumakanila nawa” upang mapanatili ang himig ng pagpapala nang hindi nagiging lipas o labis na literal; pinanatili naman ang “Israel ng Diyos” at ang payak na “at” upang hindi isara ang mga tunay na ambiguwidad ng teksto.
