  yaml_path: translation/nt/galatians/006/002.yaml
  text: Carry one another’s burdens[a], and in this way you will fulfill the law of Messiah.
translation:
  language: tl
  text: Dalhin ninyo ang mga pasanin ng isa’t isa, at sa ganitong paraan ay tutuparin ninyo ang kautusan ng Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “kautusan ni Cristo.”'
    reason: Alternatibong salin ng titulong Χριστός.
lexical_decisions:
- source_word: ἀλλήλων
  choice: ng isa’t isa
  rationale: 'Pinananatili nito ang katumbasang diwa ng panghalip: ang bawat isa sa pamayanan ay kapuwa nagbibigay at tumatanggap ng tulong.'
- source_word: τὰ βάρη
  choice: ang mga pasanin
  rationale: Ang βάρη ay literal na mabibigat na dinadala at dito ay tumutukoy nang patalinghaga sa mabibigat na suliranin o paghihirap.
- source_word: βαστάζετε
  choice: Pasanin ninyo
  rationale: Tuwirang utos ito sa maramihan at nagpapahiwatig ng patuloy na pagkilos. Ang “pasanin” ay likas na katambal ng “mga pasanin” at hindi nagdaragdag ng ideyang wala sa Griyego.
- source_word: οὕτως
  choice: sa ganitong paraan
  rationale: Malinaw nitong iniuugnay ang pagsunod sa utos sa katuparang kasunod nito.
- source_word: ἀναπληρώσετε
  choice: tutuparin ninyo
  rationale: Pinananatili ang anyong panghinaharap at ang karaniwang ugnayan ng pandiwang “tuparin” sa “kautusan.”
- source_word: τὸν νόμον
  choice: ang kautusan
  rationale: Ang “kautusan” ang angkop na salin ng νόμος sa kontekstong etikal at pinananatili nito ang alingawngaw ng pananagutang nakapaloob sa batas.
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulo; ang “Mesiyas” ay nagpapanatili sa kahulugan at kontekstong Judio ng titulo.
theological_decisions:
- issue: Pagpapakahulugan sa genitibong τοῦ Χριστοῦ
  choice: kautusan ng Mesiyas
  alternative: kautusan ni Cristo
  rationale: Hindi nililinaw nang higit sa Griyego kung ito ay kautusang nagmumula sa, nauukol sa, o kinakatawan ng Mesiyas. Ang payak na “ng” ay nagpapanatili sa saklaw ng ugnayang ito; inilalahad sa talababa ang tradisyonal na anyong “Cristo.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling anyong pautos at ang teolohikal na tensiyon ng “kautusan ng Mesiyas” nang hindi ipinapaliwanag kung ano mismo ang saklaw ng kautusang iyon.
