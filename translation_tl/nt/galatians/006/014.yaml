id: GAL.6.14
reference: Galatians 6:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐμοὶ δὲ μὴ γένοιτο καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ ἐμοὶ κόσμος ἐσταύρωται ⸀κἀγὼ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/014.yaml
  text: But far be it from me to boast except in the cross of our Lord Jesus the Messiah[a], through which the world has been crucified to me[b], and I to the world.
translation:
  language: tl
  text: Ngunit huwag nawang mangyari sa akin ang magmalaki, maliban sa krus ng ating Panginoong Jesus na Mesiyas, na sa pamamagitan nito[a] ay ipinako na sa krus ang sanlibutan para sa akin, at ako naman para sa sanlibutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pamamagitan niya,” kung ang Griyegong panghalip ay tumutukoy sa Panginoong Jesus na Mesiyas sa halip na sa krus.
    reason: Pinananatili ang posibleng antecedent ng δι’ οὗ.
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: huwag nawang mangyari
  rationale: Isang mariing pagtanggi sa anyong optative. Pinananatili nito ang tindi at personal na himig ng pahayag nang natural sa makabagong Tagalog.
- source_word: καυχᾶσθαι
  choice: ipagmalaki
  rationale: Malinaw at karaniwang katumbas sa Tagalog para sa pagyayabang o pagmamalaki; ang anyong ito ay akma dahil ang ipinagmamalaki ay tahasang binanggit.
- source_word: εἰ μὴ
  choice: maliban sa
  rationale: Ipinahahayag nito na ang krus lamang ang tanging katanggap-tanggap na saligan ng pagmamalaki.
- source_word: σταυρῷ
  choice: krus
  rationale: Karaniwan at angkop na salin sa konteksto ng pagkakapako kay Jesus at ng teolohiya ni Pablo.
- source_word: κυρίου
  choice: Panginoon
  rationale: Likas at kinikilalang katumbas ng κύριος sa Bagong Tipan.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu-Cristo
  rationale: Ang Χριστός ay titulong nangangahulugang Mesiyas, ngunit ang tradisyonal at natural na anyong Tagalog na “Jesu-Cristo” ay malinaw sa ordinaryong mambabasa; nililinaw sa tala ang kahulugan ng titulo.
- source_word: δι’ οὗ
  choice: sa pamamagitan nito
  rationale: Ang pinakamalapit na gramatikal na antecedent ay σταυρῷ, kaya tumutukoy muna ito sa krus bilang kasangkapan o paraan. Pinananatili sa talababa ang posibleng pagtukoy kay Jesu-Cristo.
- source_word: κόσμος
  choice: sanlibutan
  rationale: Dignified at pamilyar na salitang biblikal na sapat ang lawak upang katawanin ang κόσμος nang hindi nililimitahan ito sa isang ipinasok na interpretasyon.
- source_word: ἐσταύρωται
  choice: ipinako na sa krus
  rationale: Pinananatili ang metapora at ipinahihiwatig ng “na” ang naganap nang kilos na may nananatiling bunga, ayon sa Griyegong perfect passive.
- source_word: κἀγὼ κόσμῳ
  choice: at ako naman para sa sanlibutan
  rationale: Pinananatili ang siksik na paralelismo at ang elipsis ng pandiwa sa Griyego; madaling maunawaang inuulit sa diwa ang “ipinako na sa krus.”
theological_decisions:
- issue: Paglilipat sa titulong Χριστός
  choice: Jesu-Cristo, na may talababa na ang Cristo ay nangangahulugang Mesiyas
  alternative: Jesus na Mesiyas
  rationale: Ang “Jesu-Cristo” ang pinakanatural at dignified na anyo sa modernong Tagalog, habang pinananatili ng talababa ang semantikong halaga ng titulong Χριστός at iniiwasang ituring lamang itong apelyido.
- issue: Antecedent at kahulugan ng δι’ οὗ
  choice: 'ang krus ang pangunahing antecedent: “sa pamamagitan nito”'
  alternative: 'si Jesu-Cristo ang antecedent: “sa pamamagitan niya”'
  rationale: Ang pinakamalapit at gramatikal na kaayon na antecedent ay σταυρῷ. Gayunman, tunay na posible ang personal na pagtukoy kay Cristo, kaya hindi ito tahimik na inaalis at inilalahad sa talababa.
- issue: Metaporikong kaugnayan sa sanlibutan
  choice: “ipinako na sa krus ang sanlibutan para sa akin, at ako naman para sa sanlibutan”
  alternative: “patay na sa akin ang sanlibutan, at patay na rin ako rito”
  rationale: Pinananatili ng napiling salin ang matinding larawan ng pagpapako sa krus at ang simetrikong teolohikal na tensiyon sa halip na ipaliwanag ito bilang simpleng pagkamatay o paglayo.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “sanlibutan” dahil pamilyar at siksik ito sa biblikal na rehistro; iniwasan ang mas paliwanag na “kasalukuyang kaayusan ng mundo.” Ang “huwag nawang mangyari” ay mariin ngunit hindi kolokyal. Lahat ng marker ng talababa ay nasa pangunahing teksto.
