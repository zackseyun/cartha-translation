id: GAL.6.1
reference: Galatians 6:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἐὰν καὶ προλημφθῇ ἄνθρωπος ἔν τινι παραπτώματι, ὑμεῖς οἱ πνευματικοὶ καταρτίζετε τὸν τοιοῦτον ἐν πνεύματι πραΰτητος, σκοπῶν σεαυτόν, μὴ καὶ σὺ πειρασθῇς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/001.yaml
  text: Brothers[a], even if a man is caught in some trespass, you who are spiritual should restore such a one in a spirit of gentleness, watching yourself[c][b], lest you also be tempted.
translation:
  language: tl
  text: Mga kapatid,[a] kahit ang isang tao[b] ay maabutan sa isang pagkakasala,[c] kayong mga espirituwal ay ibalik sa ayos ang taong iyon sa espiritu ng kahinahunan,[d] habang binabantayan ng bawat isa sa inyo ang sarili niya, baka siya rin ay matukso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay maaaring tumukoy sa mga kapatid sa pananampalataya, kapwa lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: Ang “isang tao” ay pangkalahatang katawagan para sa sinumang tao.
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring isalin: “madaig,” “mahuli,” o “mabigla at maabutan” sa isang pagkakasala.'
    reason: alternative_reading
  - marker: d
    text: Ang “espiritu” rito ay maaaring tumukoy sa mahinahong disposisyon ng tao, na may posibleng pahiwatig sa bungang nililikha ng Espiritu.
    reason: ambiguity
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Mga kapatid
  rationale: Natural na tawag sa Filipino para sa mga kapatid sa pananampalataya; bagaman walang kasariang gramatikal ang salitang Filipino, maaari nitong tukuyin ang buong kongregasyon gaya ng saklaw ng Griyegong panawagan.
- source_word: ἐὰν καὶ
  choice: kahit
  rationale: 'Ipinahahayag ang kondisyong may bahid ng pagpapalagay o pagbibigay-daan: kahit mangyari ang ganitong kalagayan.'
- source_word: προλημφθῇ
  choice: maabutan
  rationale: Pinananatili ang posibilidad na ang tao ay naabutan o nadaig ng pagkakasala, hindi lamang nahuling gumagawa nito.
- source_word: ἄνθρωπος
  choice: ang isang tao
  rationale: Ang ἄνθρωπος ay pangkalahatang katawagan sa isang tao rito; ang likas na Filipino ay tumpak nang hindi nagdaragdag ng kasarian na hindi tiyak sa konteksto.
- source_word: ἔν τινι παραπτώματι
  choice: sa anumang pagkakasala
  rationale: Ang τινι ay maaaring tumukoy sa isang di-tiyak na pagkakasala; ang 'anumang' ay natural sa kondisyong ito, at ang 'pagkakasala' ay malinaw na naghahatid ng moral na paglihis ng παράπτωμα.
- source_word: οἱ πνευματικοὶ
  choice: kayong mga espirituwal
  rationale: Pinananatili ang malawak na pahayag ni Pablo tungkol sa mga taong inilalarawang espirituwal, nang hindi ito tahasang nililimitahan sa espirituwal na gulang o pinangungunahan ng Espiritu.
- source_word: καταρτίζετε
  choice: ibalik sa ayos
  rationale: Inihahatid ang diwa ng pagkukumpuni o pagpapanumbalik sa wastong kalagayan at pinananatili ang lakas ng pautos.
- source_word: τὸν τοιοῦτον
  choice: ang taong iyon
  rationale: Natural na Filipino na malinaw na tumutukoy sa taong nabanggit sa kondisyong nauna.
- source_word: ἐν πνεύματι πραΰτητος
  choice: sa espiritu ng kahinahunan
  rationale: Pinananatili ang ambiguity kung ang πνεῦμα ay disposisyon ng tao o may pahiwatig sa gawa ng Espiritu; ang 'kahinahunan' ay marangal at madaling maunawaan.
- source_word: σκοπῶν σεαυτόν
  choice: Ngunit bantayan mo ang iyong sarili
  rationale: Ang isahang anyo ay pinananatili upang idiin ang personal na pananagutan ng bawat nagpapanumbalik; ang 'ngunit' ay likas na nag-uugnay sa babala bagaman implicit lamang ang kontrast sa Griyego.
- source_word: μὴ καὶ σὺ πειρασθῇς
  choice: baka ikaw rin ay matukso
  rationale: Ang 'matukso' ang pinakamalamang na kahulugan sa moral na konteksto, habang ang 'rin' ay pinananatili ang babala na pareho silang mahina sa tukso.
theological_decisions:
- issue: Saklaw ng Ἀδελφοί at kasarian ng ἄνθρωπος
  choice: Gamitin ang 'Mga kapatid' at 'isang tao,' na likas at hindi tinutukoy ang kasarian sa Filipino.
  alternative: Mga kapatid na lalaki; isang lalaki
  rationale: Hindi minamarkahan ng 'kapatid' ang kasarian sa Filipino, at ang ἄνθρωπος ay generic sa kontekstong ito. Ang artipisyal na pagdaragdag ng 'lalaki' ay maaaring magpaliit sa sanggunian ng orihinal.
- issue: Kahulugan ng προλημφθῇ
  choice: maabutan
  alternative: mahuli; madaig; mabigla at maabutan
  rationale: Maaaring tumukoy ang pandiwa sa pagkakahuli sa gawa o sa pagkakaunahan/pagkakadaig ng pagkakasala. Pinananatili ng salin at talababa ang saklaw nang hindi nagpapasya nang labis.
- issue: Kahulugan ng πνεύματι sa ἐν πνεύματι πραΰτητος
  choice: sa espiritu ng kahinahunan
  alternative: nang may kahinahunan; sa kahinahunan ng Espiritu
  rationale: Hindi nilulutas ng Griyego kung simpleng disposisyon ng tao o disposisyong hinubog ng Banal na Espiritu ang pangunahing diin.
- issue: πειρασθῇς bilang tukso o pagsubok
  choice: matukso
  alternative: masubok
  rationale: Ang agarang konteksto ng pagkakasala at pagbabantay sa sarili ay pumapabor sa moral na tukso, bagaman mas malawak ang posibleng saklaw ng pandiwa.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Ginamit ang 'ibalik sa ayos' sa halip na mas teknikal na 'panumbalikin,' at pinanatili ang paglipat mula maramihang 'kayo' tungo sa isahang 'mo' upang tumbasan ang Griyegong diin sa personal na pagbabantay.
