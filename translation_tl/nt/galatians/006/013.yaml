  source_fidelity: 'Kailangang ilahad nang mas malinaw ang mariing diwa ng οὐδὲ at αὐτοί: hindi lamang na “hindi rin” sila tumutupad, kundi “maging sila mismo” ay hindi tumutupad. Ang “mga tinuli” ay mas natural na Tagalog na pantukoy sa mga taong tuli at ligtas na naghahatid ng substantival participle nang hindi ipinapalagay na ang tinutukoy ay mga tagapagtaguyod lamang ng pagtutuli. Napananatili ng “ang inyong laman” ang literal na pisikal na saklaw ng σάρξ sa kontekstong ito.'
  naturalness: Natural at marangal sa modernong Filipino ang “maging ang mga tinuli mismo ay hindi tumutupad.” Mas tuwiran at mas malinaw ito kaysa “kahit ang mga tinutuli ay hindi rin,” na maaaring hindi sapat na maipakita ang diin ng Griyego.
  terminology: Ang “Kautusan,” “magpatuli,” at “laman” ay angkop. Ang “laman” ay hindi dapat palitan ng “makasalanang pagkatao,” sapagkat tumutukoy ito sa pisikal na katawan bilang nakikitang batayan ng kanilang pagmamalaki.
