  to: Sapagkat maging ang mga tinuli mismo ay hindi tumutupad sa Kautusan, ngunit nais nilang magpatuli kayo upang maipagmalaki nila ang inyong laman.
  rationale: Binago ang pambungad upang malinaw na maihatid ang mariing pagkakaila at ang diin sa paksa (“maging ... mismo”). Pinalitan ang “mga tinutuli” ng mas natural na “mga tinuli” sa pangunahing teksto, habang iningatan sa talababa ang mas malapit na aspektuwal na alternatibo. Hindi binago ang kahulugan ng Kautusan, pagtutuli, o literal na “laman.”
