  text: οὐδὲ γὰρ οἱ ⸀περιτεμνόμενοι αὐτοὶ νόμον φυλάσσουσιν, ἀλλὰ θέλουσιν ὑμᾶς περιτέμνεσθαι ἵνα ἐν τῇ ὑμετέρᾳ σαρκὶ καυχήσωνται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/013.yaml
  text: For not even those who are circumcised themselves keep the law[a], but they want you to be circumcised so that they may boast in your flesh.
translation:
  language: tl
  text: Sapagkat maging ang mga tinuli mismo ay hindi tumutupad sa Kautusan, ngunit nais nilang magpatuli kayo upang maipagmalaki nila ang inyong laman.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Sapagkat kahit ... ay hindi rin
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan sa naunang talata, at likas na ipinahahayag ng “kahit ... hindi rin” ang mariing pagkakaila ng οὐδέ.
- source_word: οἱ περιτεμνόμενοι
  choice: ang mga tinutuli
  rationale: Ang may artikulong pangkasalukuyang participle ay ginagamit bilang pangngalan at tumutukoy sa pangkat ayon sa pagtutuli, nang hindi ito pinalalawak tungo sa interpretasyong “mga nagtataguyod ng pagtutuli.”
- source_word: αὐτοὶ
  choice: ay ... rin
  rationale: Sa Filipino, likas na naihahatid ng balangkas na “kahit ... ay hindi rin” ang diin na maging sila mismo ay hindi tumutupad; ang tahasang “sila mismo” ay maaaring maging mabigat at paulit-ulit dito.
- source_word: νόμον φυλάσσουσιν
  choice: tumutupad sa Kautusan
  rationale: Ang “tumutupad sa Kautusan” ay natural at malinaw na Filipino para sa pagsunod sa hinihingi ng Torah. Ginawang malaking titik ang Kautusan dahil tumutukoy ito sa Kautusan ni Moises sa konteksto.
- source_word: ἀλλὰ θέλουσιν
  choice: ngunit nais nilang
  rationale: Direkta at marangal na ipinapahayag nito ang pagsalungat at ang kanilang layunin.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: magpatuli kayo
  rationale: Ang “magpatuli” ang natural na Filipino para sa pagpapasailalim sa pagtutuli at angkop na naghahatid sa diwang middle/passive ng infinitive.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw nitong ipinahahayag ang layunin.
- source_word: ἐν τῇ ὑμετέρᾳ σαρκὶ
  choice: ang inyong laman
  rationale: Pinananatili ang kongkretong salitang “laman,” na sa kontekstong ito ay tumutukoy sa katawan bilang kinaroroonan ng pisikal na tanda ng pagtutuli, hindi sa makasalanang pagkatao.
- source_word: καυχήσωνται
  choice: maipagmalaki nila
  rationale: Natural na Filipino ito para sa negatibong diwa ng pagyayabang o paghahanap ng maipagmamalaki, habang pinananatili ang layuning ipinahahayag ng subjunctive.
theological_decisions:
- issue: Kahulugan ng σάρξ sa kontekstong ito
  choice: literal na “laman,” na tumutukoy sa pisikal na katawan at tanda ng pagtutuli
  alternative: metaporikal na “makasalanang pagkatao”
  rationale: Ang agarang konteksto ay pagtutuli, kaya ang tinutukoy ay ang pisikal na katawan ng mga taga-Galacia bilang nakikitang batayan ng pagmamalaki. Ang “makasalanang pagkatao” ay magpapasok ng diwang hindi hinihingi rito.
- issue: Puwersa ng participle na περιτεμνόμενοι
  choice: mapaglarawang tawag na “ang mga tinutuli”
  alternative: “ang mga nagtataguyod ng pagtutuli” o “ang mga nagpapatuli”
  rationale: Tinutukoy ng anyong Griyego ang pangkat kaugnay ng pagtutuli ngunit hindi nito tahasang pinapalitan ang katawagan ng kanilang adbokasiya. Pinananatili ng salin ang saklaw at bahagyang kalabuan ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “magpatuli” sa halip na mas teknikal na “sumailalim sa pagtutuli,” at pinanatili ang “laman” dahil mahalaga rito ang literal na pisikal na diwa.
