id: GAL.6.17
reference: Galatians 6:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τοῦ λοιποῦ κόπους μοι μηδεὶς παρεχέτω, ἐγὼ γὰρ τὰ στίγματα ⸀τοῦ Ἰησοῦ ἐν τῷ σώματί μου βαστάζω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/017.yaml
  text: From now on let no one cause me trouble[a], for I bear the marks of Jesus on my body.
translation:
  language: tl
  text: Mula ngayon, huwag na akong guluhin ng sinuman, sapagkat taglay ko sa aking katawan ang mga tanda ni Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga tatak”; ang salita ay maaaring tumukoy sa mga marka sa katawan na nagpapakilala kung kanino kabilang o kanino tapat ang isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: Mula ngayon
  rationale: Likas at malinaw na panandang panahunan sa modernong Tagalog para sa diwang ‘mula sa puntong ito pasulong.’
- source_word: κόπους μοι μηδεὶς παρεχέτω
  choice: huwag na akong guluhin ng sinuman
  rationale: Ang idyomang κόπους παρέχειν ay tumutukoy sa pagdudulot ng abala o problema, hindi lamang sa literal na paggawa. Napananatili ng anyong ito ang mariing pagbabawal at natural ito sa Tagalog.
- source_word: στίγματα
  choice: mga tanda
  rationale: Malawak at hindi labis na tiyak ang ‘mga tanda’; maaari nitong tukuyin ang mga bakas o markang nasa katawan at ang ipinahihiwatig na pagkakakilanlan o pag-aari. Iniiwasan nitong ipakahulugan agad ang mga ito bilang mga pilat lamang.
- source_word: τοῦ Ἰησοῦ
  choice: ni Jesus
  rationale: 'Pinananatili ang payak at sadyang malabong ugnayang henitibo: maaaring mga tandang kaugnay ni Jesus o nagpapakilalang ang may taglay ay kay Jesus.'
- source_word: ἐν τῷ σώματί μου
  choice: sa aking katawan
  rationale: Natural sa Tagalog ang ‘sa aking katawan’ para sa mga pisikal na tandang taglay roon, nang hindi kailangang pumili sa ‘nasa ibabaw’ o ‘nasa loob.’
- source_word: βαστάζω
  choice: taglay ko
  rationale: Ipinapahayag nito ang patuloy na pagdadala o pagkakaroon ng mga tanda sa katawan at nananatiling marangal at natural sa modernong Tagalog.
theological_decisions:
- issue: Ang kalikasan ng στίγματα ni Pablo
  choice: Isinalin nang hindi tiyak bilang ‘mga tanda ni Jesus.’
  alternative: ‘mga pilat ni Jesus’ o ‘mga tatak na nagpapakitang ako ay kay Jesus’
  rationale: Maaaring tumukoy ang salita sa aktuwal na mga bakas ng pag-uusig na kasabay na nagsasaad ng katapatan o pag-aari, ngunit hindi tahasang nililinaw ng talata ang eksaktong likas o ugnayan ng mga tanda. Pinananatili ng salin ang interpretatibong tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang ‘huwag na akong guluhin’ bilang natural na idyoma, habang ang ‘taglay ko’ at ‘mga tanda’ ay nagpapanatili ng taimtim na himig at ng tunay na kalabuan ng Griyego.
