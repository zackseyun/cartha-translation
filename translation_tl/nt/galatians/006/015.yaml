base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/015.yaml
  text: For neither circumcision counts for anything[a], nor uncircumcision[b], but a new creation.
translation:
  language: tl
  text: Sapagkat walang halaga ang pagtutuli ni ang di-pagtutuli, kundi ang bagong paglikha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bagong nilalang.” Ang salitang Griyego ay maaari ring tumukoy sa isang nilalang, ngunit maaari rin itong tumukoy sa bagong paglikha o bagong kaayusang nilikha.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: Sapagkat hindi … ni
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang pangangatwiran, samantalang likas na ipinahahayag sa Filipino ng “hindi … ni” ang tambalang οὔτε … οὔτε.
- source_word: περιτομή
  choice: pagtutuli
  rationale: Karaniwang katumbas ito ng pisikal na ritwal at naiiwan ding bukas ang kaugnayan nito sa pagkakakilanlang tipan sa argumento ni Pablo.
- source_word: τί ἐστιν
  choice: mahalaga
  rationale: Sa idyomang ito, ipinahahayag ng τί ἐστιν kung may kabuluhan o mapagpasyang halaga ang isang bagay. Ang “hindi mahalaga” ay malinaw at likas sa kasalukuyang Filipino nang hindi dinaragdagan ang saklaw ng pahayag.
- source_word: οὔτε ἀκροβυστία
  choice: ni ang di-pagtutuli
  rationale: Tinutukoy nito ang kalagayang hindi tuli bilang katapat ng pagtutuli, hindi lamang ang pisikal na balat ng maselang bahagi.
- source_word: ἀλλὰ
  choice: kundi
  rationale: Ang “kundi” ang likas na panalungat matapos ang negatibong sugnay at malinaw na itinatampok ang tunay na mahalaga.
- source_word: καινὴ κτίσις
  choice: isang bagong nilikha
  rationale: Ang “bagong nilikha” ay maikli at marangal, at maaari itong tumukoy sa bagong gawang realidad o sa nilalang na ginawang bago. Hindi nito tahasang nililimitahan ang parirala sa isang indibidwal lamang.
theological_decisions:
- issue: Ang paghahambing ng pagtutuli, di-pagtutuli, at bagong nilikha
  choice: Kapuwa itinanggi ang mapagpasyang halaga ng pagtutuli at di-pagtutuli, at itinampok ang bagong nilikha.
  alternative: Maaaring unawain ang pahayag bilang tungkol lamang sa mga panlipunang tanda ng pagkakakilanlan, o bilang pagpapantay sa dalawang kalagayan bilang magkahiwalay na landas.
  rationale: Tahasang sinasabi ng Griyego na walang halaga ang alinmang kalagayan at kapuwa inihahambing ang mga ito sa καινὴ κτίσις. Hindi pinalalawak ng salin ang pahayag tungo sa isang partikular na sistemang doktrinal.
- issue: Saklaw ng καινὴ κτίσις
  choice: Pinanatili sa pangunahing teksto ang bahagyang kalabuan sa pagitan ng bagong nilalang at mas malawak na bagong paglikha.
  alternative: “Bagong paglikha” o “bagong sangnilikha.”
  rationale: Maaaring mangahulugan ang κτίσις ng nilalang o paglikha. Bagaman malamang na mas malawak sa konteksto ang “new creation,” ang “bagong nilikha” ay mas likas sa Filipino at hindi lubusang nagsasara sa mas malawak na diwa; itinatala sa talababa ang tuwirang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “di-pagtutuli” bilang maikli at simetrikong katapat ng “pagtutuli,” at iniwasan ang teknikal o denominasyonal na pagpapalawak.
