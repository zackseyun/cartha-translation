  naturalness: Likas at marangal sa modernong Filipino ang “Sapagkat walang halaga ang pagtutuli ni ang di-pagtutuli, kundi ang bagong paglikha.” Mas malinaw ang “walang halaga” para sa idiomang τί ἐστιν sa kontekstong ito kaysa “hindi mahalaga,” at natural ang “ni … ni” bilang katapat ng neither/nor.
