  yaml_path: translation/nt/galatians/006/006.yaml
  text: Let the one who is taught the word share in all good things with the one who teaches.
translation:
  language: tl
  text: Ang tinuturuan ng salita ay dapat magbahagi ng lahat ng mabubuting bagay sa nagtuturo sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “makibahagi sa lahat ng mabubuting bagay kasama ng nagtuturo.” Malamang na kabilang dito ang materyal na suporta.
    reason: Pinananatili ang posibleng mas magkaugnay na diwa ng κοινωνέω at ang lawak ng pariralang “lahat ng mabubuting bagay.”
lexical_decisions:
- source_word: Κοινωνείτω
  choice: dapat magbahagi
  rationale: Ang pangkasalukuyang pautos ay nagpapahayag ng patuloy na tungkulin. Likas sa modernong Tagalog ang “dapat magbahagi” at naipahihiwatig nito ang praktikal na pagbabahagi nang hindi ito nililimitahan sa salapi lamang.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay o paglipat lamang ang δέ rito. Ang pag-aalis nito ay mas natural sa Tagalog at hindi nagdaragdag ng diwa ng panahon o matinding pagsalungat.
- source_word: ὁ κατηχούμενος
  choice: ang tinuturuan
  rationale: Tuwirang ipinapahayag nito ang taong patuloy na tumatanggap ng pagtuturo, nang hindi ginagamit ang teknikal at mas huling katawagang “katekumen.”
- source_word: τὸν λόγον
  choice: ng salita
  rationale: Pinananatili ng “salita” ang malawak at pamilyar na katawagan para sa mensahe o aral na Kristiyano, sa halip na paliitin ito sa isang tiyak na anyo ng pagtuturo.
- source_word: τῷ κατηχοῦντι
  choice: sa nagtuturo sa kanya
  rationale: Malinaw na tinutukoy nito ang taong nagbibigay ng pagtuturo at ipinapakita ng “sa” ang tumatanggap ng ibinabahagi.
- source_word: ἐν πᾶσιν ἀγαθοῖς
  choice: ng lahat ng mabubuting bagay
  rationale: Natural itong Tagalog para sa malawak na saklaw ng mga bagay na maaaring ibahagi. Maaaring kabilang dito ang materyal na tulong, ngunit hindi iyon lamang ang tahasang sinasabi ng parirala.
theological_decisions:
- issue: Likas na katangian ng ipinag-uutos na pagbabahagi
  choice: Praktikal na ibahagi ng tinuturuan ang mabubuting bagay sa nagtuturo sa kanya, malamang na kabilang ang materyal na suporta.
  alternative: Makibahagi lamang sa pangkalahatang espirituwal na pakikisama kasama ng nagtuturo.
  rationale: Ang κοινωνέω na may datibong taong kaugnay at ang pariralang ἐν πᾶσιν ἀγαθοῖς ay malakas na nagpapahiwatig ng praktikal na pagbabahagi. Gayunman, hindi nililimitahan ng salin ang “mabubuting bagay” sa pera o materyal na tulong lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang payak na “tinuturuan” at “nagtuturo” upang mapanatili ang pagtutugma ng dalawang participle sa Griyego.
