id: GAL.3.1
reference: Galatians 3:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὦ ἀνόητοι Γαλάται, τίς ὑμᾶς ⸀ἐβάσκανεν, οἷς κατ’ ὀφθαλμοὺς Ἰησοῦς Χριστὸς ⸀προεγράφη ἐσταυρωμένος;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/001.yaml
  text: You foolish Galatians[a], who has bewitched you[c][b], before whose eyes Jesus the Messiah was publicly portrayed as crucified?
translation:
  language: tl
  text: Kayong mga walang-unawang taga-Galacia! Sino ang gumayuma[a] sa inyo, gayong sa harap mismo ng inyong mga mata ay hayagang inilarawan[b] si Jesus na Mesiyas[c] bilang ipinako sa krus?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “nanlinlang.” Ang pandiwa ay literal na pumupukaw sa larawan ng panggagayuma o pangkukulam.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “malinaw na ipinakita” o “hayagang ipinaskil.”'
    reason: lexical_alternative
  - marker: c
    text: 'Griyego: “Jesus Christ”; ang Christ (Χριστός) ay titulong nangangahulugang “Mesiyas” o “Pinahiran.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόητοι
  choice: walang-unawa
  rationale: Ipinahahayag ang matinding pagsaway sa kanilang kabiguang umunawa nang hindi dinaragdagan ng mas mabigat na hatol sa kanilang moralidad.
- source_word: Γαλάται
  choice: mga taga-Galacia
  rationale: Likas na tawag sa Filipino para sa mga taong mula sa rehiyon ng Galacia.
- source_word: ἐβάσκανεν
  choice: gumayuma
  rationale: Pinananatili ang matingkad na larawan ng mapaminsalang panggagaway o pagkontrol; inilalahad sa talababa ang mas malawak na diwang ‘nanlinlang.’
- source_word: οἷς κατ’ ὀφθαλμοὺς
  choice: sa harap mismo ng inyong mga mata
  rationale: Natural na idyomang Filipino na nagpapanatili sa diin ng tuwiran at malinaw na pagkakaharap sa ipinahayag.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός bilang makabuluhang titulo at hindi bilang apelyido, habang pinananatiling pangalan ang Jesus.
- source_word: προεγράφη
  choice: hayagang inilarawan
  rationale: Sinasaklaw ang diwa ng maliwanag at pampublikong paglalantad o paglalarawan, nang hindi nililimitahan ang salita sa literal na paskil.
- source_word: ἐσταυρωμένος
  choice: bilang ipinako sa krus
  rationale: 'Ipinakikita ang predikatibong gamit ng participle: inilarawan si Jesus sa kalagayang ipinako sa krus.'
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός sa Ἰησοῦς Χριστός
  choice: Jesus na Mesiyas
  alternative: Jesu-Cristo
  rationale: Pinananatili nitong maririnig ang kahulugan ng Χριστός bilang titulo ng pinahiran, nang hindi itinuturing na karaniwang bahagi lamang ng pangalan.
- issue: Ugnayan ng pampublikong paglalarawan at ng pagpapako sa krus
  choice: inilarawan ... bilang ipinako sa krus
  alternative: malinaw na ipinahayag na ipinako sa krus
  rationale: Hindi tinutukoy ng talata kung biswal na larawan o matingkad na pangangaral ang tinutukoy; ang ‘inilarawan’ ay nagpapanatili sa saklaw at retorikal na puwersa ng προεγράφη.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang matalim na retorika ni Pablo sa “walang-unawa” at “gumayuma,” habang ginawang natural ang mahabang tanong sa Filipino sa pamamagitan ng “gayong.”
