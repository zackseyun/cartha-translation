  text: Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ⸂ὅτι γέγραπται⸃· Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/013.yaml
  text: 'The Messiah redeemed us from the curse of the law by becoming a curse for us[d][c][b][a], because it is written: “Cursed is everyone who hangs on a tree.”'
translation:
  language: tl
  text: 'Tinubos tayo ng Mesiyas mula sa sumpa ng kautusan sa pamamagitan ng pagiging isang sumpa para sa atin[a], sapagkat nasusulat: “Isinumpa ang bawat nakabitin sa punongkahoy.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “para sa atin” ay maaari ring isaling “alang-alang sa atin”; sa konteksto, maaari rin itong magpahiwatig ng “kapalit natin.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego na ξύλον ay maaaring mangahulugang “kahoy” o “punongkahoy.” Ginamit dito ang “punongkahoy” upang mapanatili ang pananalita ng sipi sa Kasulatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: Mesiyas
  rationale: Isinalin bilang titulong “Mesiyas” upang maipakita ang titular na diwa ng Χριστός; mas malinaw ito sa karaniwang mambabasang Filipino kaysa sa transliterasyong “Cristo,” na inilalahad bilang alternatibo sa talababa.
- source_word: ἐξηγόρασεν
  choice: tinubos
  rationale: Likas at matatag na katumbas sa Filipino na nagtataglay ng diwa ng pagpapalaya sa pamamagitan ng halagang ibinayad, nang hindi dinaragdagan ang sinabi ng teksto.
- source_word: κατάρας
  choice: sumpa
  rationale: Pinananatili ang tuwiran, legal, at tipanang bigat ng pangngalan.
- source_word: νόμου
  choice: kautusan
  rationale: Ang “kautusan” ay dignidad at natural na salin ng νόμος sa kontekstong biblikal; hindi ito ginawang pantanging pangngalan sapagkat walang gayong pagtatangi sa Griyego.
- source_word: γενόμενος
  choice: sa pamamagitan ng pagiging
  rationale: Ipinahahayag ang malamang na instrumental na kaugnayan ng participle sa pagtubos, habang pinananatili ang matinding pahayag na siya ay naging isang sumpa.
- source_word: ὑπὲρ ἡμῶν
  choice: para sa atin
  rationale: Pinananatili ang malawak na saklaw ng ὑπέρ—kapakinabangan o pagkilos alang-alang sa iba—nang hindi ipinapasok sa pangunahing teksto ang mas makitid na paliwanag na “kapalit natin.”
- source_word: κατάρα
  choice: isang sumpa
  rationale: Pinananatili ang pangngalang panaguri at ang matindi at nakakagulat na anyo ng pahayag ni Pablo, sa halip na palambutin bilang “sinumpa.”
- source_word: ὅτι γέγραπται
  choice: sapagkat nasusulat
  rationale: Natural na pormulang Filipino sa pagsipi ng Kasulatan at ipinakikita ang nagpapaliwanag o nagbibigay-dahilang puwersa ng ὅτι.
- source_word: Ἐπικατάρατος
  choice: Sumpain
  rationale: Karaniwan at mariing katumbas sa Filipino na angkop sa pormula ng sipi.
- source_word: κρεμάμενος
  choice: nakabitin
  rationale: Tumutugma sa participial na kalagayan ng taong nakabitin, at natural sa Filipino.
- source_word: ξύλου
  choice: punongkahoy
  rationale: Pinananatili ang ugnayan sa sipi mula sa Deuteronomio at ang kahulugang “tree,” habang iniiwasan ang pagbibigay-kahulugang “krus” na hindi mismong salita ng teksto rito.
theological_decisions:
- issue: Saklaw ng ὑπὲρ ἡμῶν sa wika ng pagtubos
  choice: para sa atin
  alternative: alang-alang sa atin; kapalit natin
  rationale: Malinaw ang kapakinabangan at pagkilos ni Cristo para sa atin, ngunit hindi sapilitang tinutukoy ng ὑπέρ lamang ang isang partikular na modelo ng pagbabayad-sala. Pinananatili ng “para sa atin” ang lawak at teolohikal na tensiyon ng orihinal.
- issue: Pagiging κατάρα ng Mesiyas
  choice: pagiging isang sumpa
  alternative: pagiging sinumpa
  rationale: Pangngalan ang κατάρα, hindi pang-uri. Ang tuwirang anyo ay nagpapanatili sa mapangahas at matinding pahayag ni Pablo nang hindi ito pinadadali o ipinapaliwanag nang lampas sa teksto.
- issue: Kaugnayan ng γενόμενος sa ἐξηγόρασεν
  choice: sa pamamagitan ng pagiging
  alternative: nang siya ay maging
  rationale: Malamang na ipinakikita ng participle ang paraan ng pagtubos, ngunit hindi inilalahad ng salin ang mas detalyadong mekanismo kaysa sa sinasabi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Mesiyas,” “tinubos,” at “kautusan” bilang malinaw na bokabularyong biblikal. Iniwasan ang sobrang paliwanag sa pangunahing teksto, lalo na sa ὑπέρ, at pinanatili ang matinding pangngalang pahayag na “isang sumpa.”
