  yaml_path: translation/nt/galatians/003/025.yaml
  text: But now that faith has come[b][a], we are no longer under a guardian.
translation:
  language: tl
  text: Ngunit ngayong dumating na ang pananampalataya[a], wala na tayo sa ilalim ng isang tagapangalaga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain ang “pananampalataya” dito bilang may kontekstuwal na pagtukoy sa pananampalataya na nagpapakilala sa bagong yugto sa kasaysayan ng pagliligtas.
    reason: alternative_reading
  - marker: b
    text: Ang salitang Griyego ay tumutukoy sa tagapangalaga o tagapangasiwa ng isang batang wala pa sa hustong gulang, hindi pangunahin sa isang guro sa silid-aralan.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθούσης
  choice: ngayong dumating na
  rationale: Ang aorist participle sa genitive absolute ay likas na naipapahayag sa Tagalog bilang sugnay na panahunan. Ipinahihiwatig ng “dumating na” ang naganap nang pagdating na may bisa sa kasalukuyan.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapakita ang δέ ng banayad na pagsalungat sa naunang kalagayan sa ilalim ng kautusan.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Pinananatili nito ang karaniwang kahulugan ng πίστις at ang posibleng pagtukoy sa pagdating ng kapanahunan ng pananampalataya, nang hindi nilulutas nang labis ang kontekstuwal na kabuluhan nito.
- source_word: οὐκέτι
  choice: wala na
  rationale: Natural itong Tagalog para sa pagtigil ng dating kalagayan.
- source_word: ὑπὸ
  choice: sa ilalim ng
  rationale: Pinananatili nito ang metapora ni Pablo tungkol sa pagpapasakop sa pangangasiwa.
- source_word: παιδαγωγόν
  choice: tagapangalaga
  rationale: Ang παιδαγωγός ay tagapangasiwa o bantay ng isang menor de edad sa sambahayan, hindi pangunahin na guro sa silid-aralan. Malinaw at natural sa modernong Tagalog ang “tagapangalaga.”
- source_word: ἐσμεν
  choice: tayo
  rationale: Sa sugnay na “wala na tayo,” likas na naipapahayag sa Tagalog ang kasalukuyang anyo ng εἰμί nang walang hiwalay na pandiwang katumbas.
theological_decisions:
- issue: Kahulugan ng pagdating ng pananampalataya
  choice: “dumating na ang pananampalataya”
  alternative: “dumating na ang pananampalatayang ito” o “dumating na ang panahon ng pananampalataya”
  rationale: Pinananatili ng salin ang mismong larawan ni Pablo at ang kalabuan kung pananampalataya mismo o ang kapanahunang inilalarawan nito ang pangunahing diin. Hindi idinaragdag sa pangunahing teksto ang paliwanag na “panahon,” na wala nang tahasan sa Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “wala na tayo sa ilalim” upang mapanatili ang metapora, at “tagapangalaga” upang maiwasan ang maling impresyon ng “guro” o “tutor.”
