    issue: Hindi sapat ang ikalawang alternatibo sa talababa
    rationale: Ang “si Abraham na mananampalataya” ay maaaring mangahulugang si Abraham ay sasampalataya pa lamang. Ang πιστός ay pang-uri at, sa kontekstong ito, ang alternatibo ay “believing” o “a believer,” hindi isang panghinaharap na kilos. Kailangang palitan ito ng di-mapanlinlang na Tagalog.
  revised_text: Kaya nga, ang mga may pananampalataya ay pinagpapala kasama ng tapat na si Abraham.[a]
