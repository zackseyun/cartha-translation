  yaml_path: translation/nt/galatians/003/009.yaml
  text: So then[a], those who are of faith are blessed along with Abraham, the faithful one.
translation:
  language: tl
  text: Kaya nga, ang mga may pananampalataya ay pinagpapala kasama ng tapat na si Abraham.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “si Abraham na may pananampalataya” o “si Abraham na sumampalataya.”
    reason: Pinananatili ang posibleng kahulugan ng πιστός bilang “nananampalataya” o “sumampalataya,” hindi lamang “tapat.”
lexical_decisions:
- source_word: ὥστε
  choice: Kaya nga
  rationale: Ipinahihiwatig ang kongklusyong hinango ni Pablo mula sa naunang pangangatwiran, sa natural na paraan sa modernong Tagalog.
- source_word: οἱ ἐκ πίστεως
  choice: ang mga may pananampalataya
  rationale: Malinaw at likas na tumutukoy sa mga taong kinikilala sa pamamagitan ng pananampalataya, nang hindi ginagawang mabigat o di-karaniwan ang parirala.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Sa kontekstong ito, ang πίστις ay tumutukoy sa pananalig na inilalarawan kay Abraham at sa mga kasama niyang tumatanggap ng pagpapala.
- source_word: εὐλογοῦνται
  choice: ay pinagpapala
  rationale: 'Pinananatili ang anyong balintiyak at ang kasalukuyang diwa: ang pagpapala ay tinatanggap, hindi nakakamit sa sariling gawa.'
- source_word: σὺν
  choice: kasama ng
  rationale: Likas na ipinapahayag ang pakikibahagi ng mga may pananampalataya kay Abraham sa iisang pagpapala.
- source_word: τῷ πιστῷ Ἀβραάμ
  choice: tapat na si Abraham
  rationale: Dignified at natural na salin ng adjectival phrase, habang kinikilala sa talababa na ang πιστός sa kontekstong ito ay maaari ring mangahulugang nananampalataya.
theological_decisions:
- issue: Ang kahulugan ng πιστός bilang paglalarawan kay Abraham sa kontekstong nakasentro sa pananampalataya
  choice: tapat na si Abraham
  alternative: si Abraham na sumampalataya; si Abraham na mananampalataya
  rationale: Maaaring tukuyin ng πιστός ang pagiging tapat o ang pagsampalataya. Pinananatili ng pangunahing salin ang karaniwang adjectival na diwa, samantalang inilalahad sa talababa ang kontekstuwal na posibilidad na tumutukoy ito kay Abraham bilang sumampalataya.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, maikli, at marangal. Iniwasan ang sobrang literal ngunit di-likas na “mga mula sa pananampalataya,” habang pinanatili ang balintiyak na anyo at ang tunay na ambiguity ng πιστός.
