lexical_decisions:
- source_word: καθὼς
  choice: Kung paanong
  rationale: Likas na panandang Filipino para sa paghahambing na nagsisilbing batayan ng argumento ni Pablo.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Karaniwang anyo ng pangalang ito sa modernong saling Filipino.
- source_word: ἐπίστευσεν τῷ θεῷ
  choice: sumampalataya si Abraham sa Diyos
  rationale: Tuwirang ipinahahayag ang pagtitiwala at paniniwala ni Abraham sa Diyos; iniiwasang dagdagan ang teksto ng isang tahasang bagay na pinaniwalaan.
- source_word: ἐλογίσθη
  choice: ibinilang
  rationale: Pinananatili ang diwang pagtataya o pagkilala sa isang bagay sa kapakinabangan ng isang tao.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Tumutukoy kay Abraham bilang taong pinatungkulan ng pagbibilang.
- source_word: εἰς δικαιοσύνην
  choice: bilang katuwiran
  rationale: Ang “katuwiran” ang malinaw at nakaugaliang salin sa kontekstong Paulino; ang “bilang” ay nagpapanatili sa diwa ng kinilalang kalagayan o katayuan.
theological_decisions:
- issue: Kahulugan ng δικαιοσύνη sa siping Paulino
  choice: katuwiran
  alternative: katarungan
  rationale: Mas angkop ang “katuwiran” sa konteksto ng bagay na ibinilang kay Abraham, ngunit tunay ding maaaring tumukoy ang salita sa “katarungan,” kaya inilalagay ang alternatibo sa talababa.
- issue: Hindi hayag na simuno ng ἐλογίσθη
  choice: iyon
  alternative: ang kanyang pananampalataya
  rationale: Hindi tahasang pinangalanan sa Griyego ang bagay na ibinilang. Pinananatili ng “iyon” ang pagkaimpisit nito sa halip na idagdag nang tuwiran ang “pananampalataya.”
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na talata.
