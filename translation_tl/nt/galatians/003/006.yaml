  source_fidelity: Ang “sumampalataya ... sa Diyos” ay maaaring unawain bilang “nagkaroon ng pananampalataya sa Diyos,” samantalang ang πιστεύω na may datibong τῷ θεῷ ay mas tuwirang “pinaniwalaan ang Diyos” / “naniwala sa Diyos” sa diwang tinanggap ni Abraham ang sinabi ng Diyos. Ang “pinaniwalaan ni Abraham ang Diyos” ay mas malinaw na pinananatili ang gamit na ito nang hindi nagdaragdag ng isang tahasang nilalaman ng pinaniwalaan. Wasto ang pasibong “ibinilang,” ang di-tiyak na “iyon,” at ang pangwakas na kuwit na nagpapakitang nagpapatuloy ang sintaksis.
  naturalness: Marangal at malinaw ang rehistro. Ang binagong ayos na “pinaniwalaan ni Abraham ang Diyos” ay natural na modernong Filipino at mas tiyak kaysa “sumampalataya ... sa Diyos” para sa puntong ito. Ang “bilang katuwiran” ay idiomatiko at akma sa argumentong Paulino.
  terminology: Ang “katuwiran” ay angkop na pangunahing salin ng δικαιοσύνη sa kontekstong ito. Nananatili ang talababa para sa leksikal na alternatibong “katarungan.” Ang pangalang “Abraham” at “Diyos” ay wasto.
