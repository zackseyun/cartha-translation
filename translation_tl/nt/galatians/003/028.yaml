id: GAL.3.28
reference: Galatians 3:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐκ ἔνι Ἰουδαῖος οὐδὲ Ἕλλην, οὐκ ἔνι δοῦλος οὐδὲ ἐλεύθερος, οὐκ ἔνι ἄρσεν καὶ θῆλυ· ⸀πάντες γὰρ ὑμεῖς εἷς ἐστε ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/028.yaml
  text: There is no Jew or Greek[a], there is no servant or free, there is no male and female[b]; for you are all one in Messiah Jesus.
translation:
  language: tl
  text: Walang Judio o Griyego, walang alipin o malaya, walang lalaki at babae[a]; sapagkat kayong lahat ay iisa kay Mesiyas na si Jesus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “walang lalaki ni babae.” Literal na “lalaki at babae” ang Griyego, malamang na umaalingawngaw sa Genesis 1:27.
    reason: alternative_reading
  - marker: b
    text: 'Griyego: “kay Cristo Jesus”; isinaling “kay Mesiyas na si Jesus” sapagkat titulo rito ang Χριστός.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔνι
  choice: walang
  rationale: Likas at maikli itong katumbas sa Filipino ng inuulit na eksistensiyal na pagtanggi. Pinananatili ng tatlong ulit na “walang” ang diin at hulma ng Griyego nang hindi nagdaragdag ng tahasang ideya ng panahon gaya ng maaaring ipahiwatig ng “wala nang.”
- source_word: Ἰουδαῖος
  choice: Judio
  rationale: Sa pagtambal dito sa Ἕλλην, pangunahing tinutukoy ang pagkakakilanlang etniko at panrelihiyon; “Judio” ang malinaw at kinikilalang katawagan sa Filipino.
- source_word: Ἕλλην
  choice: Griyego
  rationale: “Griyego” mismo ang nasa teksto, hindi ang mas malawak na “Hentil,” kaya pinananatili ang tiyak na pares ni Pablo.
- source_word: δοῦλος
  choice: alipin
  rationale: Itinatampok ng pagtambal sa “malaya” ang kalagayang hindi malaya; “alipin” ang tuwiran at natural na katumbas sa Filipino.
- source_word: ἐλεύθερος
  choice: malaya
  rationale: Ito ang malinaw at likas na katapat ng “alipin” sa pagkakaiba ng katayuang panlipunan.
- source_word: ἄρσεν
  choice: lalaki
  rationale: Sa pares na ἄρσεν καὶ θῆλυ, tumutukoy ito sa kasarian at umaalingawngaw sa karaniwang pananalita ng Genesis 1:27; natural sa Filipino ang “lalaki.”
- source_word: θῆλυ
  choice: babae
  rationale: Bilang kaparis ng ἄρσεν, ang “babae” ang natural na salin at nagpapanatili sa posibleng alusyon sa Genesis 1:27.
- source_word: καὶ
  choice: at
  rationale: Hindi οὐδὲ kundi καὶ ang ginamit sa ikatlong pares. Ang “at” ay sadyang nagpapanatili sa pagbabagong ito at sa malamang na alusyon sa “lalaki at babae” ng Genesis 1:27.
- source_word: πάντες γὰρ ὑμεῖς
  choice: sapagkat kayong lahat
  rationale: Pinananatili ang panandang sanhi, ang tuwirang ikalawang panauhan, at ang pagbibigay-diin sa kabuuan ng mga kausap.
- source_word: εἷς ἐστε
  choice: ay iisa
  rationale: Pinananatili ng “iisa” ang maikli ngunit matibay na pahayag ng sama-samang pagkakaisa nang hindi ito pinalalawak bilang “iisang tao” o ipinapaliwanag lamang bilang “nagkakaisa.”
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  rationale: Ipinahahayag ang Χριστός bilang titulong “Mesiyas,” at ang “sa Mesiyas na si Jesus” ay natural na Filipino para sa pakikipag-ugnay o pagkapaloob na ipinahihiwatig ng ἐν.
theological_decisions:
- issue: Kung gagawing mas idyomatiko ang ἄρσεν καὶ θῆλυ sa pamamagitan ng paggamit ng panumbas sa “ni”
  choice: lalaki at babae
  alternative: lalaki ni babae
  rationale: Nagpalit ang Griyego mula οὐδὲ sa unang dalawang pares tungo sa καὶ sa ikatlo, malamang bilang alusyon sa Genesis 1:27. Pinananatili ng “at” ang pormal na kaibhan at ang tensiyon ng pahayag, kahit hindi ito ang pinakakaraniwang hulma pagkatapos ng “walang.”
- issue: Kung palalawakin ang εἷς ἐστε upang ipaliwanag ang uri ng pagkakaisa
  choice: kayong lahat ay iisa
  alternative: kayong lahat ay nagkakaisa / kayong lahat ay iisang tao
  rationale: Tinitiyak ng teksto ang pagkakaisa sa Mesiyas na si Jesus ngunit hindi nito rito ipinaliliwanag na nabubura ang lahat ng pagkakaiba. Ang “iisa” ay hindi nagdaragdag ng claim na wala sa talata.
- issue: Kung isasalin ang Χριστός bilang pangalang nakasanayan o bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: May aktibong puwersa bilang titulo ang Χριστός sa parirala; ipinakikita ng “Mesiyas” ang tungkulin at pagkakakilanlan ni Jesus nang hindi ito tinatratong isa lamang personal na pangalan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Inulit ang “walang” upang mapanatili ang retorikal na ritmo ni Pablo. Iniwasan ang “wala nang” dahil maaari itong magdagdag ng di-tiyak na temporal na diwa, at iniwasan ang “wala nang pagkakaiba” dahil ang salitang “pagkakaiba” ay paliwanag na wala mismo sa Griyego.
