id: GAL.3.22
reference: Galatians 3:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ συνέκλεισεν ἡ γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν ἵνα ἡ ἐπαγγελία ἐκ πίστεως Ἰησοῦ Χριστοῦ δοθῇ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/022.yaml
  text: But the Scripture imprisoned everything under sin[b][a], so that the promise by faith in Jesus the Messiah might be given to those who believe.
translation:
  language: tl
  text: Ngunit ikinulong ng Kasulatan ang lahat ng bagay sa ilalim ng kasalanan,[a] upang ang pangako, sa pamamagitan ng pananampalataya kay Jesus na Mesiyas,[b] ay maibigay sa mga sumasampalataya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang lahat.”
    reason: Pinananatili ng alternatibo ang mas maikli at mas bukas na saklaw ng τὰ πάντα, na maaaring unawain nang mas malawak kaysa “lahat ng bagay” lamang.
  - marker: b
    text: O, “sa pamamagitan ng katapatan ni Jesus na Mesiyas.”
    reason: Posibleng subjective genitive ang πίστεως Ἰησοῦ Χριστοῦ; maaaring tumukoy ito sa katapatan ni Jesus sa halip na sa pananampalataya sa kanya.
lexical_decisions:
- source_word: συνέκλεισεν
  choice: ikinulong
  rationale: Ipinahahayag nito ang larawan ng pagsasara o pagpigil na taglay ng pandiwang Griyego, at malinaw ito sa makabagong Tagalog.
- source_word: ἡ γραφή
  choice: ang Kasulatan
  rationale: Pinananatili ang isahang anyo at ang pagsasatao sa Kasulatan bilang kumikilos na saksi.
- source_word: τὰ πάντα
  choice: ang lahat ng bagay
  rationale: Pinananatili ang malawak at masaklaw na diwa ng neuter plural nang hindi nililimitahan sa mga tao lamang.
- source_word: ὑπὸ ἁμαρτίαν
  choice: sa ilalim ng kasalanan
  rationale: Pinananatili ang metapora ng pagpapasakop nang hindi idinaragdag sa pangunahing teksto ang mga salitang gaya ng “kapangyarihan” o “paghahari.”
- source_word: ἡ ἐπαγγελία
  choice: ang pangako
  rationale: Tuwirang katumbas ito ng pangngalan at hindi nito ipinapalit ang mas interpretatibong “ang ipinangako.”
- source_word: ἐκ πίστεως Ἰησοῦ Χριστοῦ
  choice: sa pamamagitan ng pananampalataya kay Jesus na Mesiyas
  rationale: Ginagamit sa pangunahing teksto ang karaniwang objective-genitive na pagbasa, samantalang inilalagay sa talababa ang tunay na posibleng pagbasa na tumutukoy sa katapatan ni Jesus.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Itinuturing dito ang Χριστός bilang titulo ni Jesus; ang “Mesiyas” ay malinaw at likas sa makabagong Tagalog.
- source_word: δοθῇ
  choice: ay maibigay
  rationale: Ang anyong balintiyak ay pinananatili, at ipinapakita ng sugnay na “upang” ang layuning ipinahahayag ng ἵνα.
- source_word: τοῖς πιστεύουσιν
  choice: sa mga sumasampalataya
  rationale: Pinananatili nito ang aktibong diwa ng participle sa halip na gawin lamang itong katawagang “mga mananampalataya.”
theological_decisions:
- issue: Ang genitive na πίστεως Ἰησοῦ Χριστοῦ
  choice: pananampalataya kay Jesus na Mesiyas
  alternative: katapatan ni Jesus na Mesiyas
  rationale: Maaaring unawain ang parirala bilang pananampalataya na nakatuon kay Jesus o bilang katapatan ni Jesus. Pinili sa pangunahing teksto ang karaniwang objective-genitive na pagbasa, ngunit pinanatili sa talababa ang alternatibo upang hindi burahin ang tunay na ambiguwidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang metapora ng pagkakulong, ang isahang “Kasulatan,” at ang teolohikal na tensiyon ng πίστεως Ἰησοῦ Χριστοῦ nang hindi nagpasok ng denominasyonal na pagpapakahulugan.
source_grounding:
  english_pob_role: consult_only
