  to: Ngunit bago pa dumating ang pananampalataya[a], kami ay binabantayan sa ilalim ng Kautusan[b] at ikinukulong hanggang sa maihayag ang pananampalatayang darating.
  rationale: Pinalitan ang aktibong “ihayag” ng pasibong “maihayag,” pinalinaw ang magkatuwang na diwa ng “binabantayan” at “ikinukulong,” at ginawang “kami” ang unang panauhang pangmaramihan upang iwasan ang hindi kinakailangang pagpapalawak ng saklaw. Hindi binago ng mga ito ang temporal at pangkasaysayang pag-igting ng talata.
