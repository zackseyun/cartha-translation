id: GAL.3.23
reference: Galatians 3:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πρὸ τοῦ δὲ ἐλθεῖν τὴν πίστιν ὑπὸ νόμον ἐφρουρούμεθα ⸀συγκλειόμενοι εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/023.yaml
  text: But before faith came[a], we were being guarded under the law[d][c][b], confined until the faith that was about to be revealed.
translation:
  language: tl
  text: Ngunit bago pa dumating ang pananampalataya[a], kami ay binabantayan sa ilalim ng Kautusan[b] at ikinukulong hanggang sa maihayag ang pananampalatayang darating.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bago dumating ang pananampalataya.” Ang Griyego ay may artikulo at maaaring tumukoy sa yugtong pinasimulan sa pagdating ni Cristo.
    reason: alternative_reading
  - marker: b
    text: Ang “binabantayan” ay maaari ring isaling “ikinukustodiya” o “iniingatan”; ang “ikinukulong” ay maaari ring “ipinipiit” o “ikinukulong nang mahigpit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ τοῦ δὲ ἐλθεῖν
  choice: Ngunit bago dumating
  rationale: Likas na temporal na parirala sa Tagalog; ipinapakita ng “Ngunit” ang banayad na pagsalungat ng δέ sa naunang argumento.
- source_word: τὴν πίστιν
  choice: ang pananampalataya
  rationale: Pinananatili ang karaniwang kahulugan ng πίστις at ang artikulo, na maaaring tumukoy sa pananampalataya bilang realidad ng bagong yugto ng kasaysayan ng pagliligtas.
- source_word: ὑπὸ νόμον
  choice: sa ilalim ng Kautusan
  rationale: Malinaw na ipinahihiwatig ang pamumuhay sa ilalim ng kapangyarihan o pamamahala ng Kautusang Mosaiko.
- source_word: ἐφρουρούμεθα
  choice: binabantayan tayo
  rationale: Ipinapakita ang nagpapatuloy na kilos sa nakaraan ng imperfect passive, at pinananatili ang maaaring proteksiyon o kustodiyal na diwa ng pandiwa.
- source_word: συγκλειόμενοι
  choice: na nakakulong
  rationale: Inihahayag ang pagkapigil o pagkakasara nang hindi binubura ang mas mahigpit na diwa ng participle.
- source_word: εἰς
  choice: hanggang sa
  rationale: Sa kontekstong ito, natural na ipinapahayag ang temporal at pasulong na pagtanaw tungo sa paghahayag ng pananampalataya.
- source_word: τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι
  choice: ihayag ang pananampalatayang darating
  rationale: Pinananatili ang hinaharap na diwa ng μέλλουσαν at ang revelatoryong bokabularyo ng ἀποκαλυφθῆναι sa natural na Tagalog.
theological_decisions:
- issue: Kung ang πίστις ay pansariling pananampalataya lamang o isang realidad/yugto ng kasaysayan ng pagliligtas na kaugnay ng pagdating ni Cristo
  choice: “ang pananampalataya,” na hindi nililimitahan sa pansariling pagsampalataya
  alternative: “ang kaayusan ng pananampalataya” o “katapatan”
  rationale: Ang konteksto ng Galacia 3 ay naghahambing sa panahon sa ilalim ng Kautusan at sa panahong nahayag ang pananampalataya. Pinananatili ng salin ang pag-igting na ito nang hindi nagdaragdag ng interpretatibong paliwanag sa pangunahing teksto.
- issue: Kung ang Kautusan ay inilalarawan bilang tagapagtanggol o bilang bantay na kumukustodiya
  choice: “binabantayan ... na nakakulong”
  alternative: “iniingatan” o “ikinukustodiya”
  rationale: Pinananatili ang parehong posibleng proteksiyon/kustodiyal na diwa ng ἐφρουρούμεθα at ang malinaw na restriktibong diwa ng συγκλειόμενοι.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Kautusan” na may malaking titik upang malinaw na tumukoy sa Kautusang Mosaiko, hindi sa batas sa pangkalahatan. Ang ayos ng pangungusap ay pinanatiling malapit sa Griyego habang nananatiling natural sa Tagalog.
