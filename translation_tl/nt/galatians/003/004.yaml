  - severity: low
    issue: Ang talababa ay nagdaragdag ng “mga paghihirap.”
    rationale: Bagaman posible ang diwang pagdurusa para sa ἐπάθετε, hindi nililimitahan ng τοσαῦτα ang tinutukoy sa “mga paghihirap.” Mas mainam na ang alternatibo ay magpanatili ng malawak na “napakaraming bagay.”
