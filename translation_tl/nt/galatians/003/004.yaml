  text: Did you suffer so many things in vain?—if indeed it really was in vain[a].
translation:
  language: tl
  text: Dumanas ba kayo ng napakaraming bagay nang walang kabuluhan?—kung talagang walang kabuluhan nga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Nagdusa ba kayo ng napakaraming bagay nang walang kabuluhan?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα
  choice: napakaraming bagay
  rationale: Pinananatili nito ang malawak at maramihang diwa ng neuter plural at natural itong pakinggan sa makabagong Tagalog.
- source_word: ἐπάθετε
  choice: dumanas
  rationale: Maaaring tumukoy ang πάσχω sa pagdurusa o, sa mas malawak na diwa, sa pagdanas. Pinananatili ng “dumanas” ang tunay na leksikal na kalabuan nang hindi agad ipinapalagay na pawang paghihirap ang tinutukoy.
- source_word: εἰκῇ
  choice: nang walang kabuluhan / nawalan ng kabuluhan
  rationale: Ipinahahayag nito ang diwa ng pagiging walang saysay o walang bunga. Bahagyang iniangkop ang ikalawang paglitaw para sa natural na Tagalog habang pinananatili ang retorikal na pag-uulit.
- source_word: εἴ γε
  choice: kung talagang
  rationale: Pinananatili nito ang maingat at bahagyang umaasang pasubali ni Pablo.
- source_word: καὶ
  choice: nga
  rationale: Gumaganap itong pampadiin sa pasubaling parirala; natural na naihahatid ng “nga” ang diin sa Tagalog.
theological_decisions:
- issue: Kung ipinahihiwatig ba ng talata na tiyak nang nawalan ng kabuluhan ang kanilang karanasan
  choice: 'Panatilihin itong isang maingat na pasubali: “kung talagang nawalan nga iyon ng kabuluhan.”'
  alternative: Sabihing tiyak na nawalan ng kabuluhan ang lahat ng kanilang dinanas.
  rationale: Hindi tahasang pinagtitibay ng εἴ γε καὶ εἰκῇ ang kawalang-kabuluhan; nagpapahayag ito ng retorikal na pag-aalinlangan at maaaring mag-iwan ng pag-asa na hindi nga iyon nawalan ng saysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kayo” ayon sa maramihang anyo ng Griyego. Ang footnote ay nagtatala sa mas tiyak na diwang “nagtiis/nagdusa,” samantalang pinananatili ng pangunahing teksto ang mas malawak na kahulugan ng ἐπάθετε.
