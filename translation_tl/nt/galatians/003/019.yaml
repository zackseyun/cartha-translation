base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/019.yaml
  text: Why then the law? It was added because of transgressions until the seed should come to whom the promise had been made[c][b][a], having been ordained through angels by the hand of a mediator.
translation:
  language: tl
  text: Kung gayon, bakit ibinigay ang Kautusan? Idinagdag ito dahil sa mga paglabag[b], hanggang sa dumating ang Binhi[a] na siyang pinangakuan. Itinakda[c] ang Kautusan sa pamamagitan ng mga anghel, sa pamamagitan ng isang tagapamagitan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Supling” o “Inapo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “dahil sa mga paglabag” ay maaaring mangahulugang upang tugunan, ilantad, o pigilan ang mga paglabag; hindi ito tinutukoy nang mas makitid ng Griyego.
    reason: alternative_reading
  - marker: c
    text: O “isinaayos” o “itinalaga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ὁ νόμος;
  choice: Kung gayon, bakit ibinigay ang Kautusan?
  rationale: Ang eliptikong tanong ay likas na nauunawaan bilang pagtatanong sa layunin ng Kautusan sa daloy ng argumento. Idinagdag ang “ibinigay” upang maging malinaw at natural sa Tagalog nang hindi tinutukoy nang higit sa Griyego ang layunin nito.
- source_word: νόμος
  choice: ang Kautusan
  rationale: Tumutukoy rito sa Kautusan ni Moises bilang isang kilalang kabuuan; ang malaking titik ay tumutulong upang maiba ito sa batas sa pangkalahatan.
- source_word: τῶν παραβάσεων χάριν
  choice: dahil sa mga paglabag
  rationale: Pinananatili nito ang malawak na ugnayang sanhi o layunin ng χάριν nang hindi nagpapasiya kung ang Kautusan ay pumipigil, naglalantad, o tumutugon sa mga paglabag.
- source_word: προσετέθη
  choice: Idinagdag ito
  rationale: Tuwirang ipinapahayag ang pasibong diwa at ang suplementaryong papel ng Kautusan sa argumento.
- source_word: ἄχρις οὗ ἔλθῃ
  choice: hanggang sa dumating
  rationale: Natural na Tagalog para sa hangganang pansamantalang nagtatapos sa pagdating ng inaasahang Binhi.
- source_word: τὸ σπέρμα
  choice: ang Binhi
  rationale: Pinananatili ang susing talinghaga at leksikal na ugnayan sa pangako kay Abraham at sa argumento tungkol sa isahan sa kalapit na konteksto.
- source_word: ᾧ ἐπήγγελται
  choice: na siyang pinangakuan
  rationale: Ang anyong ito ay nagpapanatili sa Binhi bilang tumatanggap ng pangako at nagpapahiwatig na nananatiling may bisa ang naunang pangako.
- source_word: διαταγεὶς
  choice: isinaayos
  rationale: Ipinahihiwatig ang pormal na pagtakda o pagsasaayos ng Kautusan nang hindi labis na nagpapasok ng teknikal o denominasyonal na kahulugan.
- source_word: δι’ ἀγγέλων
  choice: sa pamamagitan ng mga anghel
  rationale: Tumpak na ipinapakita ang mediated agency ng διά na may genitive.
- source_word: ἐν χειρὶ μεσίτου
  choice: ipinaabot sa kamay ng isang tagapamagitan
  rationale: Pinananatili ang konkretong idyomang “sa kamay” at malinaw na ipinahahayag ang papel ng tagapamagitan sa paghahatid ng Kautusan.
theological_decisions:
- issue: Kahulugan ng “dahil sa mga paglabag”
  choice: Malawak na isinalin bilang “dahil sa mga paglabag.”
  alternative: upang pigilan ang mga paglabag; upang ilantad ang mga paglabag; may kaugnayan sa mga paglabag
  rationale: Maikli at maaaring mangahulugan ng sanhi o layunin ang pariralang Griyego; hindi nito tahasang tinutukoy kung pagpigil, paglalantad, pagdami, o iba pang pagtugon sa mga paglabag ang ibig sabihin.
- issue: Pagpapakahulugan sa σπέρμα sa argumento ni Pablo
  choice: Ginamit ang “Binhi” sa pangunahing teksto.
  alternative: supling; inapo
  rationale: Bagaman mas karaniwan ang “inapo,” mas mahusay na pinananatili ng “Binhi” ang salita at talinghagang inuugnay ni Pablo sa pangako kay Abraham.
- issue: Kaugnayan ng participle na διαταγεὶς
  choice: 'Iniugnay sa Kautusan: “Ang Kautusan ay isinaayos.”'
  alternative: isinalin nang mas literal bilang “na isinaayos” sa dulo ng naunang pangungusap
  rationale: Ang panlalaking participle ay tumutukoy sa νόμος; ang paghahati sa bagong pangungusap ay nagpapalinaw sa Tagalog nang hindi binabago ang ugnayang gramatikal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Kautusan,” “Binhi,” at “tagapamagitan” upang mapanatili ang mahahalagang terminong teolohikal at ang daloy ng argumento, habang iniwasan ang lipas o labis na teknikal na pananalita.
