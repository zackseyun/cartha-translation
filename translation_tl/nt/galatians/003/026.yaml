  text: For you are all sons of God through faith in Messiah Jesus[a][b].
translation:
  language: tl
  text: Sapagkat kayong lahat ay mga anak na lalaki ng Diyos[a] sa pamamagitan ng pananampalataya sa Mesiyas na si Jesus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anak ng Diyos.” Sa Griyego, “mga anak na lalaki”; ipinahihiwatig nito ang katayuan at karapatan sa mana, at saklaw nito ang lahat ng kinakausap ni Pablo.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring iugnay ang “sa Mesiyas na si Jesus” sa “mga anak na lalaki ng Diyos”: “... ay mga anak na lalaki ng Diyos sa Mesiyas na si Jesus, sa pamamagitan ng pananampalataya.” Ang tradisyonal na anyo ng titulong “Mesiyas” ay “Cristo.”'
    reason: grammatical_and_lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: kayong lahat
  rationale: Kasama ng pandiwang nasa ikalawang panauhang maramihan, tahasang binibigyang-diin nito ang buong pangkat na kinakausap.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita nito na ang pangungusap ay nagbibigay ng batayan o dahilan para sa naunang pahayag.
- source_word: υἱοὶ θεοῦ
  choice: mga anak na lalaki ng Diyos
  rationale: Pinananatili ang tiyak na salitang Griyego para sa “mga anak na lalaki” at ang kaugnay nitong diwa ng katayuan at mana, bagaman saklaw ng pahayag ang lahat ng mananampalatayang kinakausap.
- source_word: διὰ τῆς πίστεως
  choice: sa pamamagitan ng pananampalataya
  rationale: Likas at malinaw na ipinahahayag sa Filipino ang pananampalataya bilang paraan o kasangkapan.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  rationale: Isinalin ang Χριστός bilang titulong “Mesiyas,” samantalang pinanatili ang pang-ukol na maaaring magpahiwatig ng pananampalataya kay Jesus o ng pagiging nasa pakikipag-isa sa kanya.
theological_decisions:
- issue: Kasariang nakapaloob sa υἱοὶ
  choice: mga anak na lalaki ng Diyos
  alternative: mga anak ng Diyos
  rationale: Masusing sinusunod ng pangunahing teksto ang anyong panlalaki at ang pahiwatig ng karapatan sa mana; nililinaw ng talababa na hindi lamang mga lalaki ang saklaw.
- issue: Kaugnayan ng ἐν Χριστῷ Ἰησοῦ
  choice: pananampalataya sa Mesiyas na si Jesus
  alternative: sa pamamagitan ng pananampalataya, bilang mga nakipag-isa sa Mesiyas na si Jesus
  rationale: Pinakamadaling basahin sa Filipino ang pagkakabit nito sa “pananampalataya,” ngunit maaari ring iugnay ng balarila ang parirala sa pagiging mga anak ng Diyos “sa” Mesiyas; hindi nilulutas nang tahimik ang pag-aalinlangang ito.
- issue: Pagsasalin sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay titulong nangangahulugang “Pinahiran” o “Mesiyas,” kaya isinalin ang kahulugan nito sa halip na gamitin lamang ang tradisyonal na anyong “Cristo.”
translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang pangangatwirang “Sapagkat,” ang wikang ukol sa pagiging anak na lalaki at mana, at ang titulong “Mesiyas,” habang ipinaliliwanag sa mga talababa ang saklaw at tunay na pag-aalinlangan sa pagkakaugnay ng pariralang ἐν Χριστῷ Ἰησοῦ.
