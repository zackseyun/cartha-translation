  text: Know, then, that those of faith—these are Abraham’s sons.
translation:
  language: tl
  text: Alamin ninyo, kung gayon, na ang mga may pananampalataya—sila ang mga anak ni Abraham.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκετε
  choice: dapat ninyong malaman
  rationale: Maaaring anyong pautos o pasalaysay ang pandiwa; sa konteksto, ipinahahayag nito ang kongklusyong dapat kilalanin ng mga mambabasa. Likas sa modernong Tagalog ang ganitong anyo.
- source_word: ἄρα
  choice: Kaya
  rationale: Ipinakikita ang lohikal na kongklusyon mula sa naunang argumento tungkol sa pananampalataya ni Abraham.
- source_word: οἱ ἐκ πίστεως
  choice: ang mga nananalig
  rationale: Ipinahahayag nang natural ang mga taong nakikilala sa pananampalataya, nang hindi dinaragdagan ang teksto ng tahasang layon ng pananampalataya.
- source_word: οὗτοι
  choice: sila
  rationale: Pinananatili ang mariing pagtukoy ng Griyego sa mismong pangkat na nabanggit.
- source_word: υἱοί
  choice: mga anak
  rationale: Sa kontekstong tumutukoy sa pagiging kabilang sa angkan ni Abraham, inklusibo at natural ang 'mga anak' habang pinananatili ang ugnayang pampamilya.
theological_decisions:
- issue: Batayan ng pagiging anak ni Abraham
  choice: ang mga nananalig—sila ang mga anak ni Abraham
  alternative: ang mga mula sa pananampalataya ay mga anak ni Abraham
  rationale: Pinananatili ang diin ng οὗτοι na ang mga tinukoy na nananalig mismo ang mga anak ni Abraham, nang hindi ipinaliliwanag pa ang eksaktong teolohikal na mekanismo ng ugnayang ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang gitling na em dash upang madala ang mariing resumptive na οὗτοι nang hindi nagiging mabigat ang pangungusap.
