id: GAL.3.8
reference: Galatians 3:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: προϊδοῦσα δὲ ἡ γραφὴ ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς προευηγγελίσατο τῷ Ἀβραὰμ ὅτι Ἐνευλογηθήσονται ἐν σοὶ πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/008.yaml
  text: 'And the Scripture[a], foreseeing that God justifies the nations by faith[b], proclaimed the good news beforehand to Abraham: “In you all the nations will be blessed.”'
translation:
  language: tl
  text: 'At nakita na noon pa ng Kasulatan na pinapawalang-sala ng Diyos ang mga bansa[a] sa pamamagitan ng pananampalataya, kaya ipinahayag na nito noon pa kay Abraham ang magandang balita[b]: “Sa iyo ay pagpapalain ang lahat ng bansa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Hentil.” Ang salitang Griyego na ἔθνη ay maaaring mangahulugang “mga bansa” o “mga Hentil.”
    reason: lexical_alternative
  - marker: b
    text: O “ipinangaral nang una pa kay Abraham ang ebanghelyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδοῦσα
  choice: dahil nakita na ... nang una pa
  rationale: Ipinapahayag nito ang naunang pagkakita ng personipikadong Kasulatan habang nananatiling natural sa modernong Tagalog.
- source_word: ἡ γραφή
  choice: ang Kasulatan
  rationale: Ito ang karaniwang pagtukoy ni Pablo sa banal na Kasulatan at pinananatili ang personipikasyon sa pangungusap.
- source_word: ἐκ πίστεως
  choice: sa pamamagitan ng pananampalataya
  rationale: Malinaw nitong ipinahahayag ang pananampalataya bilang paraan o batayan nang hindi nilulutas nang higit sa sinasabi ng Griyego.
- source_word: δικαιοῖ
  choice: ituturing ... na matuwid
  rationale: Natural at madaling maunawaang paglalarawan ng hudisyal na diwa ng δικαιόω, nang hindi gumagamit ng masyadong teknikal o makalumang terminolohiya.
- source_word: τὰ ἔθνη ... πάντα τὰ ἔθνη
  choice: ang mga bansa ... ang lahat ng bansa
  rationale: Pinananatili ang pag-uulit sa Griyego at ang hayag na ugnayan ng pahayag ni Pablo sa pangako kay Abraham.
- source_word: προευηγγελίσατο
  choice: ipinahayag na ... nang una pa ... ang magandang balita
  rationale: Pinananatili kapwa ang ideya ng mabuting balita at ang paunang pagpapahayag nito.
- source_word: τῷ Ἀβραὰμ
  choice: kay Abraham
  rationale: Karaniwang Tagalog para sa di-tuwirang layon at sa pangalan.
- source_word: Ἐνευλογηθήσονται
  choice: pagpapalain
  rationale: Tuwirang pinananatili ang hinaharap na balintiyak na anyo ng pangako.
- source_word: ἐν σοὶ
  choice: Sa iyo
  rationale: Malapit sa anyo ng Griyego at iniiwasang ipakahulugan agad bilang “sa pamamagitan mo” o “kaisa mo.”
theological_decisions:
- issue: Kung isasalin ang ἔθνη bilang “mga bansa” o “mga Hentil”
  choice: “mga bansa” sa dalawang paglitaw
  alternative: “mga Hentil” sa unang paglitaw at “mga bansa” sa sipi
  rationale: Pinananatili nito ang leksikal na pag-uulit at ang ugnayan sa pangako kay Abraham, habang kinikilala sa talababa ang posibleng kahulugang “mga Hentil.”
- issue: Kung gagawing tahasang instrumental ang ἐν σοὶ
  choice: “Sa iyo”
  alternative: “Sa pamamagitan mo”
  rationale: Pinananatili ang tunay na lawak at tensiyon ng parirala sa halip na agad tukuyin ang eksaktong uri ng kaugnayan ni Abraham sa pagpapala.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Kasulatan,” “pananampalataya,” at “magandang balita” bilang pamilyar ngunit hindi labis na teknikal na mga salita. Ang ayos na “Sa iyo ay pagpapalain” ay bahagyang pormal upang mapanatili ang sadyang di-tiyak na ἐν σοὶ.
