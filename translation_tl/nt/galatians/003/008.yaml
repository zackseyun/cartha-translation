revisions:
- from: 'At dahil nakita na ng Kasulatan na ituturing ng Diyos na matuwid ang mga bansa[a] sa pamamagitan ng pananampalataya, ipinahayag na nito nang una pa kay Abraham ang magandang balita[b]: “Sa iyo ay pagpapalain ang lahat ng bansa.”'
  to: 'At nakita na noon pa ng Kasulatan na pinapawalang-sala ng Diyos ang mga bansa[a] sa pamamagitan ng pananampalataya, kaya ipinahayag na nito noon pa kay Abraham ang magandang balita[b]: “Sa iyo ay pagpapalain ang lahat ng bansa.”'
  rationale: Inayos ang aspekto ng δικαιοῖ mula hinaharap tungo sa pangkasalukuyan at inalis ang “dahil” upang hindi gawing tahasang sanhi ang participial na “foreseeing.” Ang “kaya” ay nagsasaad ng natural na daloy mula sa paunang pagkakita tungo sa paunang pagpapahayag, habang ang pangunahing kahulugan ng talata ay hindi nagbabago. Pinanatili ang lahat ng lexical na ugnayan at mga anchor ng talababa.
