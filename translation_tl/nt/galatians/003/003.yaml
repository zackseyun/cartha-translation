  text: οὕτως ἀνόητοί ἐστε; ἐναρξάμενοι πνεύματι νῦν σαρκὶ ἐπιτελεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/003.yaml
  text: Are you so foolish? Having begun by the Spirit[c][b][a], are you now being perfected by the flesh?
translation:
  language: tl
  text: Gayon na lamang ba kayo kahangal? Nagsimula kayo sa Espiritu[a]; ngayo'y sa pamamagitan ng laman[c] ba kayo ginagawang ganap[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa Espiritu.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kinukumpleto kayo.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa pamamagitan ng pagsisikap ng tao”; posible rin ang “sa pamamagitan ng makasalanang kalikasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: ganyan
  rationale: Likas na ipinahahayag sa tanong ang tindi ng pagsaway—“ganyan ... kahangal”—habang pinananatili ang demonstratibong puwersa ng salita.
- source_word: ἀνόητοί
  choice: mga hangal / kahangal
  rationale: Ang “hangal” ay tuwiran ngunit marangal na katumbas ng kawalan ng pag-unawa o wastong pagkilala; sa pangungusap, mas natural ang anyong “kayo kahangal.”
- source_word: ἐναρξάμενοι
  choice: matapos kayong magsimula
  rationale: Ipinakikita nito na nauna ang pagsisimula bago ang kasalukuyang kilos na tinatanong ni Pablo.
- source_word: πνεύματι
  choice: sa pamamagitan ng Espiritu
  rationale: Malamang na instrumental ang datibo at tumutukoy sa Banal na Espiritu ayon sa agarang konteksto ng Galacia 3. Pinananatili ng “sa pamamagitan ng” ang kaibahan nito sa laman.
- source_word: νῦν
  choice: ngayo'y
  rationale: Maikli at natural itong nagpapatingkad sa temporal na paghahambing sa kanilang naunang pagsisimula.
- source_word: σαρκὶ
  choice: sa pamamagitan ng laman
  rationale: Pinananatili ang sadyang malawak at teolohikal na gamit ni Pablo sa “laman,” sa halip na paliitin agad ito sa pagsisikap ng tao o makasalanang kalikasan.
- source_word: ἐπιτελεῖσθε
  choice: ginagawa ba kayong ganap
  rationale: Isinasalin nito ang anyong pangkasalukuyang middle/passive bilang prosesong patungo sa kaganapan, kasabay ng pagpapanatili sa retorikal na tanong.
theological_decisions:
- issue: Tinutukoy ng πνεύματι
  choice: ang Banal na Espiritu
  alternative: espiritu ng tao o isang espirituwal na prinsipyo
  rationale: Ang agarang konteksto ay tungkol sa pagtanggap sa Espiritu sa pamamagitan ng pananampalataya at sa pagkilos ng Diyos sa kanila, kaya ang Banal na Espiritu ang pinakamalamang na tinutukoy.
- issue: Kahulugan ng σάρξ bilang kabaligtaran ng Espiritu
  choice: laman
  alternative: pagsisikap ng tao; makasalanang kalikasan
  rationale: May magkakapatong na kahulugan ang σάρξ sa mga sulat ni Pablo. Ang literal na “laman” ay nagpapanatili sa teolohikal na tensiyon at hindi agad nagpapasya sa iisang paliwanag.
- issue: Tinig ng ἐπιτελεῖσθε
  choice: 'passive-like: ginagawa kayong ganap'
  alternative: 'middle: sinisikap ninyong maging ganap o tinatapos ninyo'
  rationale: Maaaring middle o passive ang anyong Griyego. Ang passive-like na salin ay angkop sa kaibahan ng mga paraan o kapangyarihang sinasandigan, ngunit hindi lubusang inaalis ng konteksto ang middle na pagbasa.
translation_notes:
  register: Makabago at madaling maunawaang Filipino, ngunit pinananatili ang marangal at matalas na himig ng pagsaway ni Pablo. Ginamit ang “laman” upang mapanatili ang tunay na kalabuan at teolohikal na lalim ng terminong Paulino.
