base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/024.yaml
  text: So then[a], the law has become our guardian until Messiah[b], so that we might be justified by faith.
translation:
  language: tl
  text: Kaya ang Kautusan ay naging tagapangalaga natin[a] hanggang sa pagdating ng Mesiyas[b], upang maituring tayong matuwid sa pamamagitan ng pananampalataya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagapagbantay”; ayon sa kaugalian, “guro.” Ang Griyegong παιδαγωγός ay tumutukoy sa tagapangalaga o tagapangasiwa ng isang bata sa sambahayan, hindi pangunahin sa gurong nagtuturo sa silid-aralan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “patungo sa Mesiyas.” Maaari ring unawain ang parirala bilang “inaakay tayo patungo sa Mesiyas.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Kaya
  rationale: Naghahayag ito ng konklusyon mula sa naunang pangangatwiran, hindi ng layunin.
- source_word: ὁ νόμος
  choice: ang Kautusan
  rationale: Tumutukoy sa Kautusan ni Moises bilang isang tiyak at kilalang kategorya sa Galacia.
- source_word: παιδαγωγὸς
  choice: tagapangalaga
  rationale: Ang παιδαγωγός ay tagapagbantay at tagapangasiwa ng isang batang nasa sambahayan, hindi pangunahin na guro sa silid-aralan. Likas at malinaw sa makabagong Filipino ang “tagapangalaga.”
- source_word: ἡμῶν
  choice: natin
  rationale: Ipinapahayag ng panghalip na genitive ang kaugnayan ng παιδαγωγός sa nagsasalita at sa mga kausap.
- source_word: γέγονεν
  choice: ay naging
  rationale: Pinananatili nito ang pagbabagong naganap at ang resultang kalagayan na ipinahihiwatig ng perfect tense.
- source_word: εἰς Χριστόν
  choice: hanggang sa Mesiyas
  rationale: Sa konteksto, ipinakikita nito ang Mesiyas bilang hantungan o hangganan ng pansamantalang tungkulin ng Kautusan; inilalahad sa talababa ang tunay na saklaw ng posibleng kahulugan.
- source_word: Χριστόν
  choice: Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” sa halip na gawing pangalang “Cristo.”
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at likas nitong ipinahahayag ang layunin.
- source_word: ἐκ πίστεως
  choice: sa pamamagitan ng pananampalataya
  rationale: Ipinahahayag nito ang pananampalataya bilang paraan o batayan nang hindi dinaragdagan ang bagay ng pananampalataya na hindi tahasang binanggit sa parirala.
- source_word: δικαιωθῶμεν
  choice: maituring tayong matuwid
  rationale: Pinananatili ang passive at ang legal na diwa ng pandiwa sa malinaw na Filipino, nang hindi ito nililimitahan lamang sa ideya ng pagpapawalang-sala.
theological_decisions:
- issue: Ang kaugnayan ng εἰς Χριστόν sa tungkulin ng Kautusan
  choice: hanggang sa Mesiyas
  alternative: patungo sa Mesiyas; hanggang sa pagdating ng Mesiyas
  rationale: Binibigyang-diin ng konteksto ang pansamantalang tungkulin ng Kautusan, ngunit maaaring magpahiwatig ang εἰς ng direksiyon o hantungan. Pinananatili sa talababa ang ambiguwidad sa halip na ganap na lutasin ito.
- issue: Ang diwa ng δικαιωθῶμεν
  choice: maituring tayong matuwid
  alternative: maipahayag tayong matuwid; mapawalang-sala tayo
  rationale: Ang napiling anyo ay nagpapanatili sa legal na diwa at passive na pagkilos ng Diyos nang hindi nagpapasok ng mas makitid na paliwanag kaysa sa mismong Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Kautusan” bilang kinikilalang katawagan sa Kautusan ni Moises, “Mesiyas” bilang titulo, at “tagapangalaga” upang maiwasan ang maling impresyon na ang παιδαγωγός ay pangunahing guro.
