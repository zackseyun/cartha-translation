  text: τοῦτο μόνον θέλω μαθεῖν ἀφ’ ὑμῶν, ἐξ ἔργων νόμου τὸ πνεῦμα ἐλάβετε ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/002.yaml
  text: 'This only I want to learn from you: did you receive the Spirit by works of the law[b][a], or by hearing with faith?'
translation:
  language: tl
  text: 'Ito lamang ang nais kong malaman mula sa inyo: Tinanggap ba ninyo ang Espiritu sa pamamagitan ng mga gawa ng Kautusan, o sa pamamagitan ng pakikinig nang may pananampalataya[a][b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa pakikinig ng pananampalataya”; maaari ring tumukoy ang parirala sa pakikinig sa mensahe nang may pananampalataya.
    reason: alternative_reading
  - marker: b
    text: Hindi gaanong malamang dito ang “katapatan” bilang kahulugan ng “pananampalataya,” ngunit isinasaalang-alang ito kung minsan dahil pinaikli ang pagkakabuo ng pariralang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο μόνον
  choice: Ito lamang
  rationale: Pinananatili ang mariing paglalagay sa unahan at ang tuwirang himig ng tanong ni Pablo.
- source_word: θέλω μαθεῖν
  choice: nais kong malaman
  rationale: Likas sa modernong Tagalog at tapat sa diwa ng paghingi ni Pablo ng sagot mula sa kanila.
- source_word: ἀφ’ ὑμῶν
  choice: mula sa inyo
  rationale: Tuwirang inilalarawan ang pinagmumulan ng sagot at likas na ipinahihiwatig ng “inyo” ang maramihan.
- source_word: ἐξ ἔργων νόμου
  choice: sa pamamagitan ng mga gawa ng Kautusan
  rationale: Pinananatili ang siksik na pariralang Paulino at ang paghahambing tungkol sa batayan o paraan ng pagtanggap. Ginamit ang malaking titik sa “Kautusan” upang tukuyin ang Kautusang tinatalakay sa konteksto.
- source_word: τὸ πνεῦμα
  choice: ang Espiritu
  rationale: Ang konteksto ay tumutukoy sa Espiritu ng Diyos na tinanggap ng mga mananampalataya. Hindi idinagdag ang “Banal” sapagkat wala ito sa tekstong Griyego.
- source_word: ἐλάβετε
  choice: Tinanggap ba ninyo
  rationale: Ang payak na nagdaang kilos ay angkop sa aorist at sa retorikal na tanong tungkol sa kanilang unang karanasan.
- source_word: ἐξ ἀκοῆς πίστεως
  choice: sa pamamagitan ng pakikinig nang may pananampalataya
  rationale: 'Likas na ipinahahayag sa Tagalog ang malamang na diwa: ang pakikinig na sinamahan ng pananampalataya. Pinananatili sa mga talababa ang tunay na kalabuan ng pinaikling konstruksyong Griyego.'
- source_word: πίστεως
  choice: pananampalataya
  rationale: Ito ang karaniwan at pinakamalamang na kahulugan ng πίστις dito; itinatala sa talababa ang mas di-malamang na kahulugang “katapatan.”
theological_decisions:
- issue: Tinutukoy ng “Espiritu”
  choice: Ang Espiritu ng Diyos na ibinigay sa mga mananampalataya
  alternative: Isang pangkalahatang espirituwal na karanasan o kapangyarihan
  rationale: Sa agarang konteksto ng Galacia 3, tinatalakay ni Pablo ang pagtanggap nila sa Espiritu ng Diyos; kaya ito ang pinakamalamang na personal at banal na tinutukoy.
- issue: Ugnayan ng ἀκοῆς at πίστεως
  choice: pakikinig nang may pananampalataya
  alternative: pakikinig na nagmumula sa pananampalataya, o pakikinig sa mensahe nang may pananampalataya
  rationale: Pinaikli at maaaring unawain sa higit sa isang paraan ang genitive construction. Pinili ang pinakamalinaw na likas na salin nang hindi itinatago sa talababa ang ibang posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang retorikal na tanong at ang magkatapat na “mga gawa ng Kautusan” at “pakikinig nang may pananampalataya,” habang inilagay sa mga talababa ang leksikal at sintaktikong kalabuan.
