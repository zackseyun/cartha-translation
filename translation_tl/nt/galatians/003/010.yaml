  to: Sapagkat ang lahat ng nakabatay sa mga gawa ng Kautusan[a] ay nasa ilalim ng sumpa, sapagkat nasusulat, “Isinumpa ang bawat taong hindi nananatiling tapat sa lahat ng nakasulat sa aklat ng Kautusan[b] upang gawin ang mga ito.”
