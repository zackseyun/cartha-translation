base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/010.yaml
  text: For all who are of works of the law are under a curse[a], for it is written, “Cursed is everyone who does not remain in all the things written in the book of the law[b], to do them.”
translation:
  language: tl
  text: Sapagkat ang lahat ng nakabatay sa mga gawa ng Kautusan[a] ay nasa ilalim ng sumpa, sapagkat nasusulat, “Isinumpa ang bawat taong hindi nananatiling tapat sa lahat ng nakasulat sa aklat ng Kautusan[b] upang gawin ang mga ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umaasa sa mga gawa ng Kautusan.”
    reason: alternative_reading
  - marker: b
    text: Sa literal, “bawat taong hindi nananatili sa lahat ng nakasulat sa aklat ng Kautusan upang gawin ang mga ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅσοι γὰρ
  choice: Sapagkat ang lahat ng
  rationale: Pinananatili ang paliwanag na puwersa ng γάρ at ang pangkalahatang saklaw ng ὅσοι.
- source_word: ἐξ ἔργων νόμου
  choice: nakabatay sa mga gawa ng Kautusan
  rationale: Likas ito sa makabagong Tagalog at ipinahihiwatig na ang kalagayan ng tinutukoy na pangkat ay inuugnay sa mga gawa ng Kautusan, nang hindi lubusang nilulutas ang teolohikal na saklaw ng parirala.
- source_word: νόμου
  choice: Kautusan
  rationale: Ang malaking titik ay tumutukoy sa Kautusan sa kontekstong Judio at tipanan, hindi lamang sa isang pangkalahatang batas.
- source_word: ὑπὸ κατάραν
  choice: nasa ilalim ng sumpa
  rationale: Tuwirang inilalarawan ang pagpapasailalim sa sumpa at hindi ipinapalagay na may tiyak na artikulo sa Griyego.
- source_word: γέγραπται
  choice: nasusulat
  rationale: Karaniwang marangal na pormula sa Tagalog para sa pagsipi sa Kasulatan at pinananatili ang diwang may nananatiling bisa ang nakasulat.
- source_word: Ἐπικατάρατος πᾶς ὃς
  choice: Sumpain ang bawat
  rationale: Malinaw at marangal na pagpapahayag ng sumpa, kalakip ang pangkalahatang saklaw ng πᾶς ὃς.
- source_word: ἐμμένει
  choice: nananatiling tapat
  rationale: Ipinahahayag ang patuloy na pananatili at pagsunod; mas natural ito kaysa sa literal ngunit malabong “nananatili sa” sa Tagalog.
- source_word: πᾶσιν τοῖς γεγραμμένοις
  choice: sa lahat ng nakasulat
  rationale: Pinananatili ang ganap na saklaw ng πᾶσιν at ang pagtukoy sa mga bagay na nakasulat.
- source_word: ἐν τῷ βιβλίῳ τοῦ νόμου
  choice: sa aklat ng Kautusan
  rationale: Natural na salin ng βιβλίον sa kontekstong ito at karaniwang katawagan sa koleksiyon ng Kautusan.
- source_word: τοῦ ποιῆσαι αὐτά
  choice: upang gawin ang mga iyon
  rationale: Malapit na pinananatili ang infinitibong parirala at ang kongkretong hinihinging pagsasagawa.
theological_decisions:
- issue: Kahulugan ng ἐξ ἔργων νόμου
  choice: nakabatay sa mga gawa ng Kautusan
  alternative: umaasa sa mga gawa ng Kautusan
  rationale: Ang pangunahing salin ay hindi kasing-tiyak ng “umaasa” tungkol sa panloob na saloobin, kaya pinananatili ang tensiyon kung ang parirala ay tumutukoy sa pinagmumulan, pagkakakilanlan, o batayan ng kalagayan. Inilalagay sa talababa ang karaniwang interpretibong pagbasa.
- issue: Ugnayan ng ἐμμένει at τοῦ ποιῆσαι αὐτά
  choice: nananatiling tapat ... upang gawin ang mga iyon
  alternative: patuloy na tumutupad sa lahat ng nakasulat
  rationale: Pinananatiling magkahiwalay ang ideya ng patuloy na pananatili at ang aktuwal na paggawa, gaya ng anyo ng sipi sa Griyego, sa halip na pagsamahin ang dalawa sa isang pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Kautusan” bilang kinikilalang katawagan sa Torah sa kontekstong ito. Ang bahagyang pormal na ayos ng sipi ay sadyang pinanatili upang maipakita ang estruktura at diin ng pinagmulang Griyego.
