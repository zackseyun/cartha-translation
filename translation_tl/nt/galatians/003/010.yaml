  terminology: Ang “Kautusan,” “mga gawa ng Kautusan,” at “nasa ilalim ng sumpa” ay angkop at pare-pareho. Ang “nananatiling tapat” ay isang katanggap-tanggap na idiomatikong pagsasalin ng ἐμμένει nang hindi binubura ang diin sa patuloy na pagkapit/pagsunod.
