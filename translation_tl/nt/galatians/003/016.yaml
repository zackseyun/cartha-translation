source:
  edition: SBLGNT
  text: τῷ δὲ Ἀβραὰμ ἐρρέθησαν αἱ ἐπαγγελίαι καὶ τῷ σπέρματι αὐτοῦ· οὐ λέγει· Καὶ τοῖς σπέρμασιν, ὡς ἐπὶ πολλῶν, ἀλλ’ ὡς ἐφ’ ἑνός· Καὶ τῷ σπέρματί σου, ὅς ἐστιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/016.yaml
  text: The promises were spoken to Abraham and to his offspring[a]. It does not say, “And to offsprings,” as referring to many, but as referring to one[c][b], “And to your offspring,” who is Messiah.
translation:
  language: tl
  text: Ang mga pangako ay sinabi kay Abraham at sa kanyang binhi.[a] Hindi sinasabi, “At sa mga binhi,”[b] na tumutukoy sa marami, kundi, na tumutukoy sa isa, “At sa iyong binhi,” na siyang Mesiyas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “supling” o “salinlahi” sa buong talata. Iisang kolektibong pangngalan ang ginamit sa Griyego, at mahalaga ang anyong isahan nito sa pangangatwiran ni Pablo.
    reason: lexical_alternative
  - marker: b
    text: 'Griyego: “At sa mga binhi.” Binibigyang-diin ni Pablo ang maramihang anyo ng salita.'
    reason: lexical_alternative
  - marker: c
    text: O “Cristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρρέθησαν
  choice: ay sinabi
  rationale: Likas at tuwirang salin ng passive na pandiwa; pinananatili nitong pasalita ang pagkakaloob ng mga pangako.
- source_word: ἐπαγγελίαι
  choice: mga pangako
  rationale: Karaniwan, malinaw, at angkop na katumbas sa kontekstong Paulino.
- source_word: σπέρμα / σπέρματι
  choice: binhi
  rationale: Pinananatili ang iisang salitang maaaring gamitin bilang kolektibong pangngalan at mahalaga sa pangangatwiran ni Pablo tungkol sa anyong isahan.
- source_word: τοῖς σπέρμασιν
  choice: mga binhi
  rationale: Ginagawang hayag ang anyong maramihan na sadyang ipinantatapat ni Pablo sa isahang “binhi.”
- source_word: ὡς ἐπὶ πολλῶν
  choice: na para bang tumutukoy sa marami
  rationale: Natural na Filipino na malinaw na nagpapahayag ng paliwanag ni Pablo.
- source_word: ἀλλ’ ὡς ἐφ’ ἑνός
  choice: kundi sa isa
  rationale: Maikli at malinaw na pinananatili ang diin sa iisa bilang katapat ng marami.
- source_word: Χριστός
  choice: Mesiyas
  rationale: Dito ay gumaganap bilang titulong kumikilala sa ipinangakong binhi bilang ang Pinahiran.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός sa pormulang pagkakakilanlan
  choice: Mesiyas
  alternative: Cristo
  rationale: Aktibo rito ang kahulugan bilang titulo; ang “Mesiyas” ay nagpapanatili sa diwa ng ipinangakong Pinahiran nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Ang argumento mula sa isahang σπέρμα
  choice: Panatilihin ang “binhi” at ang tahasang salungatan ng “mga binhi” at “binhi”
  alternative: salinlahi / mga supling
  rationale: Ang γραμματικό na tensiyon sa teksto—isang kolektibong pangngalan na binabasa ni Pablo ayon sa anyong isahan—ay dapat manatiling nakikita at hindi ipaliwanag palayo.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinili ang tradisyonal ngunit malinaw na “binhi” upang mapanatili ang paglalaro sa isahan at maramihan; iniwasan ang di-likas na “mga supling” dahil hindi nito gaanong naipakikita ang eksaktong anyong pinagtutuunan ng argumento.
