  text: ὅτι δὲ ἐν νόμῳ οὐδεὶς δικαιοῦται παρὰ τῷ θεῷ δῆλον, ὅτι Ὁ δίκαιος ἐκ πίστεως ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/011.yaml
  text: It is evident that no one is justified before God by the law[b][a], because "The righteous will live by faith."
translation:
  language: tl
  text: Malinaw na walang sinumang pinawawalang-sala sa harap ng Diyos sa pamamagitan ng Kautusan, sapagkat, “Ang matuwid ay mabubuhay sa pamamagitan ng pananampalataya.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dito ay sinisipi ni Pablo ang Habakuk 2:4.
    reason: cross_reference
  - marker: b
    text: 'Maaari ring isalin: “Ang matuwid ay mabubuhay sa pamamagitan ng katapatan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι δὲ
  choice: Malinaw na
  rationale: Ang δὲ ay banayad na pang-ugnay sa argumento at hindi kailangang tumbasan ng tahasang panandang temporal. Isinama ang unang ὅτι sa likas na sugnay na nagpapakilala sa maliwanag na konklusyon.
- source_word: ἐν νόμῳ
  choice: sa pamamagitan ng Kautusan
  rationale: Sa kontekstong legal ng argumento, ang ἐν ay nagpapahayag ng paraan o batayan. Nililinaw ng pariralang ito na ang Kautusan ang sinasabing paraan ng pag-aaring matuwid.
- source_word: οὐδεὶς
  choice: walang sinuman
  rationale: Pinananatili nito ang ganap at pangkalahatang pagtanggi.
- source_word: δικαιοῦται
  choice: itinuturing na matuwid
  rationale: Ipinahahayag nito ang pasibo at legal na diwa ng δικαιόω bilang pagkilalang o paghatol na matuwid, nang hindi ipinapalagay na tumutukoy ito sa likas na pagbabago ng pagkatao.
- source_word: παρὰ τῷ θεῷ
  choice: sa harap ng Diyos
  rationale: Natural sa Tagalog at pinananatili ang diwa ng katayuan sa paghatol ng Diyos.
- source_word: δῆλον
  choice: Malinaw
  rationale: Maikli, natural, at angkop sa tono ng pangangatwiran ni Pablo.
- source_word: Ὁ δίκαιος
  choice: Ang matuwid
  rationale: Pinananatili ang substantibong pang-uri at ang posibleng pangkalahatang pagtukoy sa taong matuwid.
- source_word: ἐκ πίστεως
  choice: sa pamamagitan ng pananampalataya
  rationale: Ang πίστις ay pangunahing isinaling “pananampalataya”; ang “katapatan” ay tunay na alternatibong leksikal at inilagay sa talababa.
- source_word: ζήσεται
  choice: ay mabubuhay
  rationale: Tuwirang ipinapahayag ang anyong panghinaharap sa natural na modernong Tagalog.
theological_decisions:
- issue: Pagbasa sa siping Ὁ δίκαιος ἐκ πίστεως ζήσεται
  choice: Ang matuwid ay mabubuhay sa pamamagitan ng pananampalataya
  alternative: Ang matuwid ay mabubuhay sa pamamagitan ng katapatan; Ang taong itinuring na matuwid sa pamamagitan ng pananampalataya ay mabubuhay
  rationale: Pinananatili ng pangunahing teksto ang pinakanatural na ugnayan ng ἐκ πίστεως sa “mabubuhay” at ang karaniwang kahulugan nitong “pananampalataya.” Hindi tahasang nilulutas ng salin ang lahat ng maaaring sintaktiko at teolohikal na pagbasa; ang leksikal na “katapatan” ay iniingatan sa talababa.
- issue: Legal na diwa ng δικαιοῦται
  choice: itinuturing na matuwid
  alternative: ginagawang matuwid; pinawawalang-sala
  rationale: Ang napiling parirala ay malinaw sa ordinaryong mambabasa at pinananatili ang diwa ng hatol o pagkilala sa harap ng Diyos, nang hindi nag-aangkat ng partikular na sistemang denominasyonal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Kautusan” bilang pantanging tawag sa Kautusan sa konteksto ng argumento ni Pablo. Inilagay ang panandang [a] pagkatapos ng “Kautusan” para sa sanggunian sa Habakuk, at ang [b] pagkatapos ng sipi para sa alternatibong kahulugan ng πίστις.
