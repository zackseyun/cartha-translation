id: GAL.3.21
reference: Galatians 3:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ θεοῦ; μὴ γένοιτο· εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι, ὄντως ⸂ἐκ νόμου ἂν⸃ ἦν ἡ δικαιοσύνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/021.yaml
  text: Is the law then against the promises of God? May it never be! For if a law had been given that was able to give life[a], then righteousness really would have been from the law.
translation:
  language: tl
  text: Kung gayon, salungat ba ang kautusan sa mga pangako ng Diyos? Hinding-hindi! Sapagkat kung may ibinigay na kautusang kayang magbigay-buhay, talagang sa kautusan sana nagmula ang katuwiran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.”
    reason: Lehitimong alternatibong kahulugan ng δικαιοσύνη sa kontekstong Paulino.
lexical_decisions:
- source_word: νόμος
  choice: kautusan
  rationale: Pinananatili ang pangkalahatang diwa ng batas o kautusan sa argumento ni Pablo, habang kasama pa rin sa saklaw ang Kautusan ni Moises. Ang maliit na titik ay umiiwas sa labis na pagpapakitid ng kahulugan.
- source_word: κατὰ
  choice: salungat sa
  rationale: Sa kasamang genitive, nagpapahayag ito ng pagsalungat. Natural sa Filipino ang tanong na “salungat ba … sa” at malinaw nitong naihahatid ang retorikal na pagtutol.
- source_word: ἐπαγγελιῶν
  choice: mga pangako
  rationale: Pinananatili ang tahasang maramihang anyo ng Griyego at ang kaugnayan nito sa mga pangako ng Diyos na tinalakay sa konteksto.
- source_word: μὴ γένοιτο
  choice: Hinding-hindi!
  rationale: Isang natural at mariing pagtanggi sa modernong Filipino na naghahatid ng lakas ng pormulang ginagamit ni Pablo.
- source_word: ἐδόθη
  choice: may ibinigay
  rationale: Ang aorist passive ay isinalin sa paraang natural sa kondisyonal na pangungusap sa Filipino, nang hindi tinutukoy kung sino ang tahasang tagaganap.
- source_word: δυνάμενος
  choice: kayang
  rationale: Malinaw na ipinahahayag ang kakayahan ng hipotetikal na kautusan at natural na nag-uugnay rito sa infinitive na kasunod.
- source_word: ζῳοποιῆσαι
  choice: magbigay-buhay
  rationale: Pinananatili ang diwa ng pagbibigay o paglikha ng buhay sa isang maikli at madaling maunawaang anyong Filipino.
- source_word: ὄντως
  choice: talagang
  rationale: Ipinahahayag ang mariing pagpapatibay sa konklusyon sa natural na modernong Filipino.
- source_word: ἐκ νόμου
  choice: sa kautusan … nagmula
  rationale: Ang balangkas na ito ay malinaw na nagpapanatili sa pinagmulang diwa ng ἐκ, sa halip na ipakahulugang instrumento lamang ang kautusan.
- source_word: δικαιοσύνη
  choice: katuwiran
  rationale: Ang “katuwiran” ang karaniwang dignified na salin sa argumentong Paulino tungkol sa pagiging matuwid, habang pinananatili sa talababa ang lehitimong kahulugang “katarungan.”
theological_decisions:
- issue: Kahulugan ng δικαιοσύνη sa argumentong Paulino
  choice: katuwiran
  alternative: katarungan
  rationale: Ang konteksto ay tungkol sa kaugnayan ng kautusan, pangako, at katuwiran. Pinipili ang “katuwiran” nang hindi isinasara ang mas malawak na dimensiyon ng katarungan, na inilalagay sa talababa.
- issue: Saklaw ng νόμος
  choice: kautusan bilang kategorya, na may pahiwatig sa Kautusan ni Moises
  alternative: ang Kautusan bilang tanging tiyak na pagtukoy sa Kautusan ni Moises
  rationale: Ang kondisyonal na “kung may ibinigay na kautusan” ay nagsasalita tungkol sa kautusan bilang kategorya, bagaman malinaw sa mas malawak na konteksto na nasa tanaw rin ang Kautusan ni Moises. Hindi nilulutas nang labis ang tensiyong ito.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling basahin. Ginamit ang “Hinding-hindi!” upang natural na maihatid ang mariing pagtanggi, at ang “sana” upang mapanatili ang diwang hindi natupad na kondisyon sa Griyego.
