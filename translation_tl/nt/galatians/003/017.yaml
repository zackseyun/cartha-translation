  source_fidelity: 'Ang pangunahing diwa ay tumpak: ang Kautusan ay dumating pagkalipas ng 430 taon at hindi nito pinawawalang-bisa ang naunang tipang pinagtibay ng Diyos. Gayunman, ang “at sa gayon ay hindi nito pinawawalang-saysay” ay hindi maayos na kumakatawan sa εἰς τὸ καταργῆσαι, na nagsasaad ng layon/resultang kaugnay ng pagpapawalang-bisa ng tipan. Dapat itong ihayag bilang lohikal na bunga nang hindi binabago ang ugnayan ng mga sugnay.'
