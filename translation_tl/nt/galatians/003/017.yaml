id: GAL.3.17
reference: Galatians 3:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω· διαθήκην προκεκυρωμένην ὑπὸ τοῦ ⸀θεοῦ ὁ μετὰ ⸂τετρακόσια καὶ τριάκοντα ἔτη⸃ γεγονὼς νόμος οὐκ ἀκυροῖ, εἰς τὸ καταργῆσαι τὴν ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/017.yaml
  text: 'This is what I mean: the law[a], which came four hundred and thirty years later, does not invalidate a covenant previously ratified by God[b], so as to abolish the promise.'
translation:
  language: tl
  text: 'Ito ang ibig kong sabihin: ang Kautusan, na dumating pagkaraan ng apat na raan at tatlumpung taon, ay hindi nagpapawalang-bisa sa tipang dati nang pinagtibay ng Diyos; at dahil dito, hindi rin nito napawawalang-saysay[a] ang pangako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “napawawalang-saysay” ay maaari ring isaling “ginagawang walang bisa” o “isinasaisantabi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ λέγω
  choice: Ito ang ibig kong sabihin
  rationale: Likas na panimulang paliwanag sa modernong Tagalog; naipahihiwatig ang pang-ugnay na δέ nang hindi nagdaragdag ng tahasang panandang temporal.
- source_word: διαθήκην
  choice: tipan
  rationale: Sa konteksto, tumutukoy ito sa tipang kaugnay ng pangako ng Diyos kay Abraham; mas angkop kaysa “testamento” o karaniwang “kasunduan.”
- source_word: προκεκυρωμένην
  choice: pinagtibay na
  rationale: Ipinahahayag ang nauna at nananatiling legal na pagpapatibay na taglay ng perfect participle.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: ng Diyos
  rationale: Tuwirang ipinakikita ang Diyos bilang gumawa ng pagpapatibay, nang walang idinagdag na diin.
- source_word: ὁ ... γεγονὼς νόμος
  choice: ang Kautusan, na dumating
  rationale: Natural na inilalarawan ang pagdating ng Kautusan sa kasaysayan at pinananatili ang tiyak na pagtukoy rito.
- source_word: μετὰ τετρακόσια καὶ τριάκοντα ἔτη
  choice: pagkaraan ng apat na raan at tatlumpung taon
  rationale: Malinaw at natural na inilalahad ang agwat ng panahon.
- source_word: οὐκ ἀκυροῖ
  choice: hindi nagpapawalang-bisa
  rationale: Napananatili ang legal na diwa ng hindi pagpapawalang-saysay o pagpapawalang-lakas sa tipan.
- source_word: εἰς τὸ καταργῆσαι
  choice: at sa gayon ay hindi nito pinawawalang-saysay
  rationale: Naipahahayag ang layon o bunga ng parirala habang iniiwasan ang di-natural na literalismo sa Tagalog.
- source_word: τὴν ἐπαγγελίαν
  choice: ang pangako
  rationale: Karaniwan, malinaw, at tumpak sa argumento ni Pablo tungkol sa pangako kay Abraham.
theological_decisions:
- issue: Kahulugan ng διαθήκη sa argumento ni Pablo
  choice: tipan
  alternative: testamento; legal na habilin; kasunduan
  rationale: Nakasentro ang konteksto sa naunang pangako ng Diyos kay Abraham, kaya pinananatili ng “tipan” ang saligang historikal at teolohikal na ugnayan nang hindi nilulutas nang lampas sa teksto ang lahat ng legal na pahiwatig.
- issue: Layon o bunga ng εἰς τὸ καταργῆσαι
  choice: at sa gayon ay hindi nito pinawawalang-saysay
  alternative: upang pawalang-saysay; na ang resulta ay mapawalang-saysay
  rationale: Maaaring magpahiwatig ang konstruksyon ng layon o bunga; ang salin ay nagpapanatili ng ugnayang lohikal nang hindi mahigpit na pumipili sa isa lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kautusan” bilang tiyak na tawag sa Kautusan ni Moises sa konteksto. Iniwasan ang sobrang teknikal na pananalitang legal, ngunit pinanatili ang legal na lakas ng “pinagtibay” at “nagpapawalang-bisa.”
