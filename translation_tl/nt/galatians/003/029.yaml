  text: εἰ δὲ ὑμεῖς Χριστοῦ, ἄρα τοῦ Ἀβραὰμ σπέρμα ἐστέ, ⸀κατ’ ἐπαγγελίαν κληρονόμοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/029.yaml
  text: And if you are Messiah’s[a], then you are Abraham’s seed[b], heirs according to promise.
translation:
  language: tl
  text: At kung kayo ay kabilang sa Mesiyas[a], kung gayon, kayo ay binhi ni Abraham[b] at mga tagapagmana ayon sa pangako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kayo ay kay Cristo.” Ipinahihiwatig ng Griyego na sila ay pag-aari o kabilang sa Mesiyas.
    reason: lexical_alternative
  - marker: b
    text: O “mga inapo ni Abraham.” Isahan sa Griyego ang “binhi” at inuulit nito ang mahalagang salitang ginamit ni Pablo nang mas maaga sa kabanatang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστοῦ
  choice: kabilang sa Mesiyas
  rationale: Ang genitibong Griyego ay nagpapahayag ng kaugnayan o pag-aari. Likas sa makabagong Tagalog ang “kabilang sa Mesiyas,” at pinananatili ng “Mesiyas” ang gamit ng Χριστός bilang titulo.
- source_word: σπέρμα
  choice: binhi
  rationale: Pinananatili ng “binhi” ang isahang kolektibong larawan at ang tuwirang ugnay sa naunang pangangatwiran ni Pablo tungkol sa binhi ni Abraham sa kabanata 3.
- source_word: κληρονόμοι
  choice: mga tagapagmana
  rationale: Ito ang natural at matatag na katumbas sa Tagalog sa kontekstong pampamilya at pangtipan.
- source_word: κατ’ ἐπαγγελίαν
  choice: ayon sa pangako
  rationale: Pinananatili nito ang saklaw ng parirala nang hindi tiyak na nilulutas kung ang pangako ang batayan, pamantayan, o paraang tinutukoy.
- source_word: εἰ δὲ ὑμεῖς ... ἄρα
  choice: At kung kayo ... kayo nga
  rationale: Ipinakikita nito ang magaan na pang-ugnay na δέ at ang lohikal na bunga na ipinahihiwatig ng ἄρα, sa natural na ayos ng Tagalog.
theological_decisions:
- issue: Kung gagamit ng mas malinaw na kolektibong tawag para sa σπέρμα o pananatilihin ang isahang larawang “binhi.”
  choice: binhi
  alternative: mga inapo
  rationale: Mahalagang mapanatili ang leksikal at teolohikal na ugnay sa naunang pagtalakay ni Pablo sa iisang “binhi” sa Galacia 3, habang ipinapaliwanag sa talababa ang kolektibong kahulugan.
- issue: Kung isasalin ang Χριστός bilang “Cristo” o bilang titulong “Mesiyas.”
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa kontekstong ito, gumaganap ang Χριστός bilang titulo; ang “Mesiyas” ay malinaw na naghahatid ng kahulugang iyon nang hindi ginagawang pangalang pantangi lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kabilang sa” upang natural na maipahayag ang genitibong nagsasaad ng pag-aari, habang pinanatili ang “binhi” upang huwag mawala ang sadyang pag-uugnay ng mga salita sa buong Galacia 3.
