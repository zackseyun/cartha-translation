  text: A mediator is not of one[b][a], but God is one.
translation:
  language: tl
  text: Ang tagapamagitan ay hindi para sa isang panig lamang,[a] ngunit iisa ang Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “ang tagapamagitan ay hindi ng isa.” Maaari rin itong mangahulugang “hindi kumikilos para sa isa lamang” o “hindi para sa isang panig lamang.”
    reason: alternative_reading
  - marker: b
    text: Ang “iisa ang Diyos” ay malamang na umaalingawngaw sa pagpapahayag ng Israel tungkol sa iisang Diyos. Ihambing ang Deuteronomio 6:4.
    reason: cross_reference
lexical_decisions:
- source_word: μεσίτης
  choice: tagapamagitan
  rationale: Karaniwan at tumpak na salitang Filipino para sa isang nasa pagitan ng mga panig; pinananatili nito ang legal at tipanang diwa nang hindi nagdaragdag ng tiyak na pagkakakilanlan.
- source_word: ἑνὸς
  choice: isang panig lamang
  rationale: Ang literal na “ng isa” ay maigsi at malabo sa Griyego. Sa kaugnayan nito sa “tagapamagitan,” ipinapahayag ng “isang panig lamang” ang pinakamaliit na paglilinaw na kailangan sa natural na Filipino, habang kinikilala sa talababa ang literal at iba pang posibleng pakahulugan.
- source_word: οὐκ ἔστιν
  choice: ay hindi para sa
  rationale: Ang pandiwang “ay hindi” ay tuwirang pinanatili, samantalang ang “para sa” ay nagbibigay ng likas na ugnayan sa Filipino sa pariralang “isang panig lamang.”
- source_word: ὁ δὲ θεὸς εἷς ἐστιν
  choice: ngunit iisa ang Diyos
  rationale: Tuwirang pinananatili ang pagsalungat at ang mariing pahayag tungkol sa pagiging isa ng Diyos; natural sa Filipino ang ayos na “iisa ang Diyos.”
- source_word: δὲ
  choice: ngunit
  rationale: Ang ikalawang δέ ay malinaw na nagpapakita ng pagsalungat. Hindi ginawang hiwalay na panimulang salita ang unang δέ upang maiwasan ang mabigat at di-kinakailangang panandang diskurso sa Filipino.
theological_decisions:
- issue: Ang siksik at bantog na mahirap na unang sugnay
  choice: “hindi para sa isang panig lamang”
  alternative: “hindi ng isa” / “hindi kumikilos para sa isa lamang”
  rationale: Nililinaw lamang nito ang relasyonal na diwang likas sa pagiging tagapamagitan, ngunit hindi tinutukoy kung sinu-sino ang mga panig o kung paano nito nilulutas ang mas malawak na argumento ni Pablo.
- issue: Ang pahayag na “iisa ang Diyos”
  choice: Pinanatili bilang maikli at ganap na pahayag
  alternative: “ang Diyos ay isang Diyos” o pagpapaliwanag sa kaugnayan nito sa tipan
  rationale: Pinananatili nito ang posibleng alingawngaw ng pagpapahayag ng Israel tungkol sa iisang Diyos at hindi ipinapasok sa teksto ang isang partikular na paliwanag sa argumento.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapamagitan” bilang pamilyar at tumpak na termino. Pinanatiling maikli ang pangungusap at hindi nilutas sa salin ang sinasadyang siksik at malabong pangangatwiran ng Griyego.
