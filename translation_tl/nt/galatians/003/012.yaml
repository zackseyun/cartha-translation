  text: ὁ δὲ νόμος οὐκ ἔστιν ἐκ πίστεως, ἀλλ’· Ὁ ποιήσας ⸀αὐτὰ ζήσεται ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/012.yaml
  text: But the law is not from faith[a]; rather[b], “The one who does them will live by them.”
translation:
  language: tl
  text: Ngunit ang kautusan ay hindi mula sa pananampalataya; sa halip, “Ang gumagawa ng mga ito ay mabubuhay sa pamamagitan ng mga ito.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mabubuhay sa mga ito.”
    reason: lexical_alternative
  - marker: b
    text: Sipi mula sa Levitico 18:5.
    reason: cross_reference
lexical_decisions:
- source_word: νόμος
  choice: kautusan
  rationale: Pinananatili ang malawak na katawagan ni Pablo, habang hinahayaang ipakita ng konteksto na nasa isip din ang Kautusan ni Moises.
- source_word: ἐκ πίστεως
  choice: mula sa pananampalataya
  rationale: Malapit ito sa anyo ng Griyego at pinananatili ang kaibahan ng pinagmulan o prinsipyong ipinahihiwatig ng ἐκ, nang hindi ito ginagawang mas interpretibong “nakabatay sa.”
- source_word: ἀλλὰ
  choice: sa halip
  rationale: Malinaw at likas nitong ipinakikilala sa Filipino ang mariing pagsalungat at ang kasunod na sipi.
- source_word: ὁ ποιήσας
  choice: ang gumagawa
  rationale: Pinananatili nito ang pangkalahatang isahang diwa ng substantibong participle at ang payak na kahulugan ng ποιέω.
- source_word: αὐτά
  choice: mga ito
  rationale: Pinananatili ang panghalip na tumutukoy sa mga utos o hinihingi ng kautusan, nang hindi nagdaragdag ng tahasang pangngalang wala sa Griyego.
- source_word: ζήσεται
  choice: mabubuhay
  rationale: Tuwirang inilalarawan ang hinaharap na anyo sa natural at makabagong Filipino.
- source_word: ἐν αὐτοῖς
  choice: sa pamamagitan ng mga ito
  rationale: Ipinapahayag nito ang posibleng instrumental na diwa ng ἐν sa sipi—ang pamumuhay ay kaugnay ng paggawa sa mga iniutos—habang inilalagay sa talababa ang mas pormal na literal na alternatibo.
theological_decisions:
- issue: Ang pagsalungat ni Pablo sa kautusan at pananampalataya
  choice: “ang kautusan ay hindi mula sa pananampalataya”
  alternative: “ang kautusan ay hindi nakabatay sa pananampalataya” o “ang kautusan ay hindi kumikilos ayon sa prinsipyo ng pananampalataya”
  rationale: Pinananatili ng salin ang mariing tensiyon sa Griyego nang hindi ipinapaliwanag nang labis kung paano nauugnay ang kautusan at pananampalataya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikli at mariing balangkas ng Griyego; iniwasan ang denominasyonal na pagpapaliwanag.
