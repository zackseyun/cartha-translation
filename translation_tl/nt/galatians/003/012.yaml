  source_fidelity: 'Tumpak ang salin sa pangunahing ugnayan ng Griyego: ang νόμος ay hindi ἐκ πίστεως, at ang kasunod na sipi ay pinananatiling nakatuon sa paggawa at sa pangakong mabubuhay. Ang “sa pamamagitan ng mga ito” ay isang wastong instrumental na pagbibigay ng ἐν αὐτοῖς, at ang literal na alternatibo ay maayos na nasa talababa.'
