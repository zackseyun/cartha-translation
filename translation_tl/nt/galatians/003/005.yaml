id: GAL.3.5
reference: Galatians 3:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ οὖν ἐπιχορηγῶν ὑμῖν τὸ πνεῦμα καὶ ἐνεργῶν δυνάμεις ἐν ὑμῖν ἐξ ἔργων νόμου ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/005.yaml
  text: So then[a], does the one who supplies the Spirit to you and works miracles among you do so by works of the law[b], or by hearing with faith?
translation:
  language: tl
  text: Kaya nga, ang nagbibigay sa inyo ng Espiritu at gumagawa ng mga himala sa gitna ninyo[a]—ginagawa ba niya ito sa pamamagitan ng mga gawa ng Kautusan, o sa pamamagitan ng pakikinig na may pananampalataya?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa inyo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pagkarinig ng mensahe ng pananampalataya,” o “mensaheng pinakinggan nang may pananampalataya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: nagbibigay
  rationale: Ipinahihiwatig ng anyong pangkasalukuyan ang patuloy na pagbibigay. Natural sa modernong Tagalog ang “nagbibigay” at hindi nito dinaragdagan ang diwa ng Griyego.
- source_word: τὸ πνεῦμα
  choice: ang Espiritu
  rationale: Tiyak ang tinutukoy sa kontekstong Paulino. Hindi idinagdag ang “Banal” sapagkat wala itong tahasang katumbas sa parirala.
- source_word: ἐνεργῶν δυνάμεις
  choice: gumagawa ng mga himala
  rationale: Malinaw at likas itong salin ng idyomang tumutukoy sa makapangyarihang mga gawang mula sa Diyos; ang literal na “gumagawa ng mga kapangyarihan” ay hindi natural sa Tagalog.
- source_word: ἐν ὑμῖν
  choice: sa gitna ninyo
  rationale: Ang konteksto ay ang mga makapangyarihang gawang nagaganap sa komunidad. Posible rin ang “sa loob ninyo,” kaya pinanatili iyon sa talababa.
- source_word: ἐξ ἔργων νόμου
  choice: sa pamamagitan ng mga gawa ng Kautusan
  rationale: Pinananatili nito ang kilalang pariralang Paulino at malinaw na ipinapakita ang batayan o paraan na ikinukumpara sa pakikinig na may pananampalataya.
- source_word: νόμου
  choice: Kautusan
  rationale: Sa argumento ni Pablo, tumutukoy ito sa Kautusang Mosaiko. Ang malaking titik ay tumutulong upang maipakita ang tiyak na reperensiya nang hindi nagdaragdag ng paliwanag sa teksto.
- source_word: ἀκοῆς πίστεως
  choice: pakikinig na may pananampalataya
  rationale: Natural itong Tagalog para sa pakikinig na sinasamahan ng pananampalataya, habang pinananatili sa talababa ang iba pang posibleng ugnayan ng dalawang pangngalan.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Ito ang pinakalikas at pinakanaaangkop na salin sa paghahambing ni Pablo sa mga gawa ng Kautusan.
theological_decisions:
- issue: Ang masinsing pariralang ἀκοῆς πίστεως ay maaaring unawain sa ilang magkakalapit na paraan.
  choice: pakikinig na may pananampalataya
  alternative: pakikinig tungkol sa pananampalataya; mensaheng pinakinggan nang may pananampalataya
  rationale: Pinakamalinaw nitong naipapakita ang paghahambing sa mga gawa ng Kautusan nang hindi itinatago ang sintaktikong kalabuan; ang ibang posibleng pagbasa ay inilagay sa talababa.
- issue: Ang ὁ ἐπιχορηγῶν ay hindi tahasang nagpapangalan sa Diyos bagaman malinaw siyang ipinahihiwatig ng konteksto.
  choice: siya na nagbibigay
  alternative: ang Diyos na nagbibigay
  rationale: Pinanatili ng salin ang di-tahasang anyo ng orihinal at iniwasang idagdag sa pangunahing teksto ang pangalang wala sa Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Kautusan” bilang pamilyar na katawagan sa Kautusang Mosaiko. Pinanatili ang retorikal na tanong at ang kalabuan ng ἀκοῆς πίστεως sa pamamagitan ng talababa.
