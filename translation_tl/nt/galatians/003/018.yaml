id: GAL.3.18
reference: Galatians 3:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐκ νόμου ἡ κληρονομία, οὐκέτι ἐξ ἐπαγγελίας· τῷ δὲ Ἀβραὰμ δι’ ἐπαγγελίας κεχάρισται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/018.yaml
  text: For if the inheritance is from the law[a], it is no longer from a promise; but God has graciously given it to Abraham through a promise.
translation:
  language: tl
  text: Sapagkat kung ang mana ay mula sa Kautusan, hindi na ito mula sa pangako. Ngunit ang mana ay buong kagandahang-loob na ipinagkaloob ng Diyos kay Abraham sa pamamagitan ng pangako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομία
  choice: mana
  rationale: Ang “mana” ang natural at karaniwang salin sa Filipino para sa tinatanggap ng isang tagapagmana at angkop sa argumento ni Pablo.
- source_word: ἐκ νόμου
  choice: mula sa Kautusan
  rationale: Pinananatili ng “mula sa” ang ugnayang pinagmulan o batayan na ipinahihiwatig ng ἐκ at ang tuwirang pagtutulad nito sa ἐξ ἐπαγγελίας. Ginamit ang malaking titik sa “Kautusan” upang tukuyin ang Kautusan ni Moises sa konteksto.
- source_word: ἐξ ἐπαγγελίας
  choice: mula sa pangako
  rationale: 'Pinananatili nito ang magkatapat na anyo ng dalawang parirala: “mula sa Kautusan” at “mula sa pangako.”'
- source_word: οὐκέτι
  choice: hindi na
  rationale: Natural at malinaw na ipinahahayag nito ang lohikal na pagbubukod sa argumento.
- source_word: δι’ ἐπαγγελίας
  choice: dahil sa isang pangako
  rationale: Likas sa Filipino ang “dahil sa” bilang pagpapahayag ng paraang o batayang ipinahihiwatig ng διά, at pinananatili ng “isang pangako” ang di-tiyak na anyo ng pangngalan sa Griyego.
- source_word: κεχάρισται
  choice: buong kagandahang-loob itong ipinagkaloob
  rationale: Ang “ipinagkaloob” ay angkop sa pagbibigay ng Diyos, samantalang ang “buong kagandahang-loob” ay nagpapanatili sa diwang mapagbiyaya ng χαρίζομαι. Ang aspektong perpekto ay naipahihiwatig ng natapos ngunit nananatiling makabuluhang pagkakaloob.
- source_word: τῷ Ἀβραὰμ
  choice: kay Abraham
  rationale: Natural na minamarkahan ng “kay” ang personal na tumanggap ng ipinagkaloob ng Diyos.
theological_decisions:
- issue: Kung tahasang ipahahayag ang mapagbiyayang diwa ng χαρίζομαι
  choice: “buong kagandahang-loob itong ipinagkaloob”
  alternative: “ipinagkaloob” o “ibinigay” lamang
  rationale: Pinananatili nito ang leksikal na diwa ng malayang pagkakaloob nang hindi nagdaragdag ng isang tiyak na sistemang teolohikal.
- issue: Kung gagawing tiyak ang νόμος bilang Kautusan ni Moises
  choice: “Kautusan”
  alternative: “kautusan” o “isang batas”
  rationale: Sa konteksto ng Galacia 3, ang tinutukoy ay ang Kautusang ibinigay pagkaraan ng pangako kay Abraham; ang malaking titik ay naglilinaw ng reperensiya nang hindi binabago ang lohika ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang lohikal na pagtutulad ng “mula sa Kautusan” at “mula sa pangako,” habang inayos ang huling sugnay sa natural na ayos ng Filipino.
