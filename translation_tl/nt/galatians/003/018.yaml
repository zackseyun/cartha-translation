- from: Sapagkat kung ang mana ay mula sa Kautusan, hindi na ito mula sa pangako. Ngunit dahil sa isang pangako ay buong kagandahang-loob itong ipinagkaloob ng Diyos kay Abraham.
  to: Sapagkat kung ang mana ay mula sa Kautusan, hindi na ito mula sa pangako. Ngunit ang mana ay buong kagandahang-loob na ipinagkaloob ng Diyos kay Abraham sa pamamagitan ng pangako.
  rationale: Pinalitan ang saling sanhi na “dahil sa” ng instrumental na “sa pamamagitan ng,” upang maipakita ang δι’ ἐπαγγελίας. Inulit ang “mana” at inayos ang pangungusap para sa malinaw, marangal, at makabagong Filipino, habang pinananatili ang perpektong mapagbiyayang pagkakaloob ng κεχάρισται.
