id: GAL.3.14
reference: Galatians 3:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἵνα εἰς τὰ ἔθνη ἡ εὐλογία τοῦ Ἀβραὰμ γένηται ἐν ⸂Χριστῷ Ἰησοῦ⸃, ἵνα τὴν ἐπαγγελίαν τοῦ πνεύματος λάβωμεν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/014.yaml
  text: so that the blessing of Abraham might come to the Gentiles in Messiah Jesus[c][b][a], so that we might receive the promise of the Spirit through faith.
translation:
  language: tl
  text: upang ang pagpapalang nauugnay kay Abraham ay dumating sa mga Hentil[a] sa Mesiyas na si Jesus[b], upang sa pamamagitan ng pananampalataya ay matanggap natin ang pangako ng Espiritu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga bansa.”
    reason: lexical_alternative
  - marker: b
    text: 'Tradisyonal: “kay Cristo Jesus.”'
    reason: lexical_alternative
  - marker: c
    text: O “ang ipinangakong Espiritu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili ang layuning ipinahahayag ng dalawang magkatulad na sugnay na ἵνα, sa natural at marangal na Tagalog.
- source_word: εἰς τὰ ἔθνη
  choice: sa mga Hentil
  rationale: Sa konteksto ng argumento ni Pablo, tumutukoy ito lalo na sa mga hindi Judio; inilalagay sa talababa ang literal na alternatibong 'mga bansa.'
- source_word: ἡ εὐλογία τοῦ Ἀβραὰμ
  choice: ang pagpapala kay Abraham
  rationale: Natural sa Tagalog ang 'pagpapala kay Abraham' para sa pagpapalang nauugnay at ipinangako kay Abraham, nang hindi labis na nililinaw ang ugnayan ng genitibo.
- source_word: γένηται
  choice: ay dumating
  rationale: Sa konstruksiyong ito, malinaw at likas na ipinahahayag ng 'dumating' ang pag-abot ng pagpapala sa mga Hentil.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: sa pamamagitan ng Mesiyas na si Jesus
  rationale: Ipinakikita ng 'Mesiyas' ang titularyong diwa ng Χριστός. Ang 'sa pamamagitan ng' ay natural na Tagalog para sa instrumental o mediating sense ng ἐν dito, habang ang mas pormal na 'sa Mesiyas na si Jesus' ay nasa talababa.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος
  choice: ang pangako ng Espiritu
  rationale: Pinananatili ang anyong genitibo at ang tunay na kalabuan nito; hindi tahasang pinipili sa pangunahing teksto kung ang Espiritu ang ipinangako.
- source_word: λάβωμεν
  choice: matanggap natin
  rationale: Natural na Tagalog na nagpapahayag ng aorist subjunctive sa ilalim ng ἵνα.
- source_word: διὰ τῆς πίστεως
  choice: sa pamamagitan ng pananampalataya
  rationale: Tuwirang ipinahahayag ang paraang tinutukoy ng διά at pinananatili ang karaniwang teolohikal na kahulugan ng πίστις bilang pananampalataya.
theological_decisions:
- issue: Pagturing sa Χριστός bilang titulo o pangalang nakasanayan
  choice: Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: Sa argumento tungkol sa pangako at pagpapala kay Abraham, nananatiling buhay ang titularyong diwa ng Χριστός; kaya isinalin ito bilang 'Mesiyas' sa halip na basta itransliterang 'Cristo.'
- issue: Kahulugan ng τοῦ πνεύματος
  choice: ang pangako ng Espiritu
  alternative: ang ipinangakong Espiritu
  rationale: Pinananatili ng pangunahing teksto ang genitibong anyo at hindi tahimik na nilulutas ang posibleng kahulugan. Ang malamang ngunit mas interpretibong pagbasa ay ibinibigay sa talababa.
- issue: Kahulugan ng ἐν Χριστῷ Ἰησοῦ
  choice: sa pamamagitan ng Mesiyas na si Jesus
  alternative: sa Mesiyas na si Jesus
  rationale: Ang pangunahing salin ay natural sa modernong Tagalog at ipinahahayag ang pamamagitan ni Jesus; inilalagay sa talababa ang mas pormal na anyo upang makita ang lapit nito sa Griyegong ἐν.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang dalawang sugnay na layunin sa pamamagitan ng dalawang 'upang.' Ginamit ang 'Hentil' dahil mas malinaw ito sa kontekstong Judio–di-Judio, at ang 'Mesiyas' upang maipakita ang titulo nang hindi nag-aangkat ng denominasyonal na paliwanag.
