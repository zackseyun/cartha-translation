  to: upang ang pagpapalang nauugnay kay Abraham ay dumating sa mga Hentil[a] sa Mesiyas na si Jesus[b], upang sa pamamagitan ng pananampalataya ay matanggap natin ang pangako ng Espiritu.[c]
  rationale: Inayos ang pagpapahayag ng genitibo sa “pagpapalang nauugnay kay Abraham” upang hindi ito magmukhang pagpapalang ibinigay lamang kay Abraham. Pinalitan ang instrumental na “sa pamamagitan ng” ng “sa Mesiyas na si Jesus” upang mapanatili ang saklaw ng ἐν at maiwasan ang interpretibong pagdaragdag. Pinanatili ang dalawang sugnay na layunin, ang pagkakaibang Judio–Hentil, ang titularyong “Mesiyas,” at ang di-pa-nilulutas na kahulugan ng “pangako ng Espiritu.”
