id: GAL.3.15
reference: Galatians 3:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀδελφοί, κατὰ ἄνθρωπον λέγω· ὅμως ἀνθρώπου κεκυρωμένην διαθήκην οὐδεὶς ἀθετεῖ ἢ ἐπιδιατάσσεται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/015.yaml
  text: 'Brothers[a], I am speaking in human terms: even a covenant ratified by a man[b], no one sets aside or adds to it.'
translation:
  language: tl
  text: 'Mga kapatid[a], gumagamit ako ng halimbawa mula sa karaniwang buhay: kahit ang isang tipan[b] na pinagtibay na ng isang tao, walang sinumang nagpapawalang-bisa rito o nagdaragdag dito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay salin ng panlalaking pangmaramihang adelphoi sa Griego. Tinatawag ni Pablo ang mga kapwa mananampalataya, malamang na kasama ang mga babae.
    reason: cultural_note
  - marker: b
    text: Maaari ring “testamento” o “huling habilin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Mga kapatid
  rationale: Ang karaniwang maramihang tawag na “mga kapatid” ay natural at marangal sa Filipino. Bagaman panlalaki ang anyong Griego, maaari nitong tukuyin ang magkakahalong pangkat ng mga mananampalataya; nililinaw ito sa talababa.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: gumagamit ako ng halimbawa mula sa karaniwang buhay
  rationale: Idyoma itong nagpapakilala ng pangkaraniwang halimbawang pantao. Iniiwasan ng salin ang di-likas at posibleng malabong “nagsasalita ako ayon sa tao” habang pinananatili ang tungkulin nito sa pangangatwiran.
- source_word: ὅμως
  choice: kahit
  rationale: Ipinakikilala nito nang may diin ang prinsipyong totoo maging sa isang karaniwang kasunduang pantao.
- source_word: ἀνθρώπου
  choice: ng isang tao
  rationale: Pinananatili ang kongkretong isahan ng Griego sa halip na gawing abstraktong “pantao.”
- source_word: κεκυρωμένην
  choice: pinagtibay na
  rationale: Ipinahihiwatig ng perpektong balintiyak na ang tipan ay pormal nang pinagtibay at nananatiling may bisa.
- source_word: διαθήκην
  choice: tipan
  rationale: Ang “tipan” ang pinakaangkop sa argumento tungkol sa pangako ng Diyos kay Abraham, habang kinikilala sa talababa ang posibleng legal na kahulugang “testamento” o “huling habilin.”
- source_word: ἀθετεῖ
  choice: nagpapawalang-bisa
  rationale: Malinaw nitong ipinahahayag ang legal na diwang pagkansela o pagpapawalang-saysay.
- source_word: ἐπιδιατάσσεται
  choice: nagdaragdag dito
  rationale: Natural at maikli itong salin ng pagdaragdag ng mga karagdagang takda o probisyon sa pinagtibay nang tipan.
theological_decisions:
- issue: Kung ang διαθήκη ay isasaling “tipan” o “testamento/huling habilin”
  choice: tipan
  alternative: testamento o huling habilin
  rationale: Sa konteksto ng Galacia 3, tinatalakay ni Pablo ang tipan at pangako kay Abraham. Gayunman, tunay na taglay ng salita ang legal na kahulugang “testamento” o “huling habilin,” kaya hindi ito ikinukubli at inilalagay sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginawang natural na pangungusap ang idyomang κατὰ ἄνθρωπον λέγω, ngunit pinanatili ang legal na himig ng “pinagtibay,” “nagpapawalang-bisa,” at “nagdaragdag.”
