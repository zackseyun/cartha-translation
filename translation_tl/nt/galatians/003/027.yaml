  source_fidelity: Ang “tungo kay Cristo” ay hindi likas na katuwang ng “binautismuhan” sa Filipino at maaaring magmukhang direksiyong pisikal. Mas tapat at idiomatiko ang “binautismuhan kay Cristo,” na pinananatili ang εἰς nang hindi nagdaragdag ng paliwanag na doktrinal. Ang “isinuot na si Cristo” ay kulang sa malinaw na tagaganap; ang aorist middle ἐνεδύσασθε ay mas wastong naihahayag sa “isinuot ninyo si Cristo.”
  naturalness: 'May ilang hindi likas na parirala sa draft: “kayong lahat na” ay mas maayos bilang “lahat kayo na” sa tuwirang pangungusap, at “binautismuhan tungo kay Cristo” ay hindi karaniwang modernong Filipino. Ang rebisyon ay malinaw, marangal, at nananatili ang metapora ng pananamit.'
  terminology: Ang “Cristo” at “binautismuhan” ay angkop at malawak na nauunawaan sa modernong Filipino Tagalog. Hindi kailangan ng talababa para lamang ipaliwanag ang literal na reflexive nuance, sapagkat malinaw na itong naipapahayag ng “isinuot ninyo.”
  issues:
  - severity: medium
    issue: Hindi idiomatiko ang “binautismuhan tungo kay Cristo.”
    rationale: Bagaman sinusubukan nitong isalin ang εἰς, ang “tungo kay” ay hindi natural na kolokasyon sa Filipino para sa bautismo. “Binautismuhan kay Cristo” ang mas karaniwang anyo at hindi nagpapasya sa mga usaping sakramental o paraan ng bautismo.
  - severity: medium
    issue: Hindi malinaw ang tagaganap sa “ay isinuot na si Cristo.”
    rationale: Ang ἐνεδύσασθε ay ikalawang panauhang maramihan at may middle nuance. Ang “ay isinuot ninyo si Cristo” ay malinaw na nagsasaad na ang mga kausap ang nagsuot kay Cristo sa metapora.
  - severity: low
    issue: Ang talababa ay hindi likas at hindi kailangan.
    rationale: Ang “ibinihis na ninyo sa inyong sarili” ay mabigat at hindi natural na Filipino. Ang pangunahing teksto ay maaari nang magpahayag ng metapora nang walang talababa.
