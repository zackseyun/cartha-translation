  text: Sapagkat lahat kayo na binautismuhan kay Cristo ay isinuot ninyo si Cristo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅσοι
  choice: kayong lahat na
  rationale: Likas na Filipino na pinananatili ang saklaw ng ὅσοι at ang tuwirang pagtukoy sa mga mambabasa.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan nito sa naunang argumento.
- source_word: εἰς
  choice: tungo kay
  rationale: Pinananatili ang diwa ng pagpasok o pagkakaugnay kay Cristo nang hindi nagpapasya para sa isang partikular na doktrina tungkol sa bautismo.
- source_word: Χριστόν
  choice: Cristo
  rationale: Ang “Cristo” ang kinagisnan at malinaw na anyo ng titulong Χριστός sa modernong saling Filipino.
- source_word: ἐβαπτίσθητε
  choice: binautismuhan
  rationale: Karaniwan at neutral na salin na pinananatili ang balintiyak na anyo at hindi nagtatakda ng paraan ng bautismo.
- source_word: ἐνεδύσασθε
  choice: isinuot na
  rationale: Direktang pinananatili ang metapora ng pananamit; sa Filipino, ang paglalagay kay Cristo bilang layon ay malinaw kahit hindi tahasang inuulit ang reflexive na diwa ng Griyego.
theological_decisions:
- issue: Kung ang pananalita tungkol sa bautismo ay dapat magpahiwatig ng isang tiyak na teolohiyang sakramental o paraan ng bautismo.
  choice: binautismuhan tungo kay Cristo
  alternative: inilubog kay Cristo; binautismuhan kaugnay ni Cristo
  rationale: Ipinahahayag ng Griyego ang pagkilos εἰς Χριστόν ngunit hindi nito nilulutas ang mga sumunod na pagtatalo tungkol sa bisa o paraan ng bautismo; pinananatili ng salin ang tensiyong iyon.
- issue: Kung ipaliliwanag o pananatilihin ang metapora ng pananamit.
  choice: isinuot na si Cristo
  alternative: nabihisan na kay Cristo
  rationale: Pinananatili ang matapang na metapora ng orihinal at hindi ito ginagawang paliwanag tungkol sa eksaktong kalikasan ng pakikiisa kay Cristo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Cristo” bilang pamilyar na titulong Filipino, at pinanatili ang metapora ng pagsusuot sa halip na palitan ito ng paliwanag.
