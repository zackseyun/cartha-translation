  yaml_path: translation/nt/galatians/005/025.yaml
  text: If we live by the Spirit[a], let us also walk by the Spirit.
translation:
  language: tl
  text: Kung nabubuhay tayo sa pamamagitan ng Espiritu, mamuhay rin tayo ayon sa Espiritu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Kung nabubuhay tayo sa Espiritu, mamuhay rin tayo ayon sa Espiritu,” o “sumunod rin tayo sa patnubay ng Espiritu.”'
    reason: 'Pinananatili ang posibleng lokatibo o asosiyatibong diwa ng unang πνεύματι at ipinahihiwatig ang mas tiyak na diwa ng στοιχῶμεν: mamuhay nang nakaayon o nakahanay sa Espiritu.'
lexical_decisions:
- source_word: εἰ
  choice: Kung
  rationale: Pinananatili ng “Kung” ang tahasang kondisyong anyo ng Griyego; bagaman maaaring ipahiwatig ng konteksto ang “Yamang,” hindi iyon kailangang ipasok sa pangunahing teksto.
- source_word: ζῶμεν
  choice: nabubuhay tayo
  rationale: Likas na katumbas ito ng pangkasalukuyang ζῶμεν at, sa konteksto, tumutukoy sa buhay na nagmumula sa Espiritu.
- source_word: πνεύματι
  choice: sa pamamagitan ng Espiritu
  rationale: 'Ipinapahayag nito ang instrumental na diwa ng datibo: ang Espiritu ang pinagmumulan o kapangyarihan ng buhay. Sa Galacia 5, malinaw na ang Banal na Espiritu ang tinutukoy.'
- source_word: καὶ
  choice: rin
  rationale: Ipinakikita nito na ang pamumuhay na kaayon ng Espiritu ang nararapat na katugon ng pagkakaroon ng buhay sa pamamagitan ng Espiritu.
- source_word: στοιχῶμεν
  choice: mamuhay tayong kaayon
  rationale: Ang hortatory subjunctive ay likas na naihahayag sa “mamuhay tayo.” Ang “kaayon” ay nagpapanatili sa mas tiyak na diwa ng στοιχέω—lumakad nang nakahanay, sumunod sa tuntunin, o makisabay—nang hindi nagiging artipisyal sa modernong Tagalog.
theological_decisions:
- issue: Tinutukoy ng πνεύματι
  choice: ang Banal na Espiritu
  alternative: espiritu ng tao
  rationale: Ang tuloy-tuloy na paghahambing ng laman at Espiritu sa Galacia 5 ay matibay na tumutukoy sa Banal na Espiritu. Ang malaking titik sa “Espiritu” ay naghahayag ng pasyang ito nang walang idinaragdag na denominasyonal na paliwanag.
- issue: Ugnayan ng dalawang datibong πνεύματι
  choice: instrumental sa unang sugnay at pamantayan o patnubay sa ikalawa
  alternative: parehong “sa Espiritu” o parehong “sa pamamagitan ng Espiritu”
  rationale: Maaaring magkakalapit ang gamit ng dalawang datibo, ngunit ang una ay natural na tumutukoy sa pinagmumulan ng buhay at ang ikalawa sa paglakad na nakahanay sa Espiritu. Pinananatili ng salin ang retorikal na pag-uulit ng “Espiritu” habang malinaw na ipinahahayag ang ugnayan sa natural na Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Iniwasan ang salitang “lumakad” bilang pangunahing katumbas dahil maaari itong mabasa bilang literal na paglalakad; ginamit ang “mamuhay tayong kaayon” upang ihatid ang etikal na kilos at ang diwa ng pagkakahanay sa Espiritu. Inilagay ang talababa pagkatapos ng buong pangungusap sapagkat saklaw nito ang mga alternatibo sa dalawang paglitaw ng πνεύματι at sa στοιχῶμεν.
