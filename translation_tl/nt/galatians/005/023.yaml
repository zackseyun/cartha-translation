  text: gentleness[a], self-control[b]; against such things there is no law.
translation:
  language: tl
  text: kahinahunan, pagpipigil sa sarili; laban sa mga ganitong bagay ay walang batas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “laban sa mga taong ganito ay walang batas.” Gayunman, malamang na ang tinutukoy rito ay ang mga katangiang nakalista, hindi ang mga taong nagpapakita ng mga iyon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πραΰτης
  choice: kahinahunan
  rationale: Ipinapahayag nito ang maamo, mapagpakumbaba, at hindi marahas na disposisyon. Ang “kahinahunan” ay likas at marangal sa makabagong Tagalog at hindi nagpapahiwatig ng kahinaan.
- source_word: ἐγκράτεια
  choice: pagpipigil sa sarili
  rationale: Tumutukoy ito sa pagkontrol sa sariling mga pagnanasa at udyok. Malinaw at karaniwan sa kasalukuyang Tagalog ang “pagpipigil sa sarili.”
- source_word: κατὰ τῶν τοιούτων
  choice: laban sa mga ganitong bagay
  rationale: Maaaring tumukoy ang anyong Griyego sa mga bagay o mga tao, ngunit sa konteksto ay malamang na tinutukoy nito ang mga katangiang nakalista bilang bunga ng Espiritu.
- source_word: νόμος
  choice: batas
  rationale: Walang pantukoy ang νόμος sa Griyego. Pinananatili ng “batas” ang malawak at kasabihang puwersa ng pahayag nang hindi ito tahasang nililimitahan sa Kautusan ni Moises.
theological_decisions:
- issue: Saklaw ng νόμος sa pahayag ni Pablo
  choice: Isinaling “batas,” hindi partikular na “ang Kautusan.”
  alternative: “ang Kautusan,” bilang tiyak na pagtukoy sa Kautusan ni Moises
  rationale: 'Mahalaga sa Galacia ang Kautusan ni Moises, ngunit walang pantukoy ang salita rito at maaaring mas malawak ang kasabihang pahayag: walang batas na sumasalungat sa gayong mga katangian. Hindi nito isinasantabi ang kaugnayan sa Kautusan ni Moises.'
- issue: Pinatutungkulan ng τῶν τοιούτων
  choice: Ang mga katangiang kababanggit lamang
  alternative: Ang mga taong nagpapakita ng mga katangiang iyon
  rationale: Malabo sa gramatika kung mga bagay o mga tao ang tinutukoy. Mas malamang sa daloy ng talaan na tumutukoy ito sa mga katangian, ngunit pinananatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “kahinahunan” sa halip na mas lumang “kaamuan,” at pinanatiling walang pantukoy ang “batas” upang hindi paliitin ang saklaw ng Griyego.
