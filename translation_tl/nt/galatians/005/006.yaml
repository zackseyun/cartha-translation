base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/006.yaml
  text: For in Messiah Jesus neither circumcision nor uncircumcision counts for anything[c][b][a], but faith working through love.
translation:
  language: tl
  text: Sapagkat kay Jesus na Mesiyas, walang kabuluhan ang pagiging tuli o di-tuli, kundi ang pananampalatayang kumikilos sa pamamagitan ng pag-ibig.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo Jesus.” Ang salitang Griyego na Χριστός ay isang titulong nangangahulugang “Mesiyas.”
    reason: alternative_reading
  - marker: b
    text: Ang “pananampalataya” ay maaari ring magtaglay ng diwang “pagtitiwala” o “katapatan.”
    reason: lexical_alternative
  - marker: c
    text: O “pananampalatayang nagiging aktibo sa pamamagitan ng pag-ibig,” “pananampalatayang ipinahahayag ang sarili sa pamamagitan ng pag-ibig,” o “pananampalatayang nagiging mabisa sa pamamagitan ng pag-ibig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ Χριστῷ Ἰησοῦ
  choice: Sapagkat kay Mesiyas Jesus
  rationale: Ang γάρ ay nagbibigay ng paliwanag sa naunang pahayag, kaya angkop ang “Sapagkat.” Ang ἐν ay isinalin na “kay,” ang likas na paraang Filipino upang mapanatili ang diwa ng pagiging nakaugnay kay Mesiyas Jesus nang hindi ito ginagawang simpleng lokasyon. Ang Χριστός ay pinanatiling titulo bilang “Mesiyas.”
- source_word: οὔτε περιτομή ... οὔτε ἀκροβυστία
  choice: ang pagiging tuli o di-tuli
  rationale: Pinananatili nito ang magkatapat at magkahanay na mga katayuang tinutukoy ng mga pangngalang Griyego, sa natural na modernong Filipino.
- source_word: τι ἰσχύει
  choice: walang kabuluhan
  rationale: Sa konteksto, ang ἰσχύει ay tumutukoy sa bisa, halaga, o kabuluhan, hindi lamang sa pisikal na lakas. Ang “walang kabuluhan” ay maikli at natural, at ipinahihiwatig na alinman sa dalawang katayuan ay walang mapagpasyang bisa kay Mesiyas.
- source_word: πίστις
  choice: pananampalataya
  rationale: Ito ang karaniwang salin ng πίστις at hindi nito isinasara ang kaugnay na mga diwang pagtitiwala at katapatan, na binanggit sa talababa.
- source_word: δι’ ἀγάπης
  choice: sa pamamagitan ng pag-ibig
  rationale: Malinaw nitong ipinapahayag ang gamit o paraang ipinakikita ng διά na may genitive, nang hindi labis na tinutukoy ang sanhi.
- source_word: ἐνεργουμένη
  choice: kumikilos
  rationale: Pinananatili nito ang kasalukuyan at aktibong diwa ng participle habang hindi sapilitang nagpapasya kung ito ay dapat unawaing middle o passive.
theological_decisions:
- issue: Pagsasalin ng Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay isang titulo at ang “Mesiyas” ay tuwirang naghahatid ng kahulugan nito; ang nakaugaliang “Cristo” ay inilagay bilang alternatibo.
- issue: Pagsasalin ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala o katapatan
  rationale: Ang “pananampalataya” ang pangunahing katumbas, ngunit pinananatili sa talababa ang leksikal at teolohikal na lawak ng πίστις.
- issue: Diwa ng ἐνεργουμένη
  choice: kumikilos
  alternative: nagiging mabisa; ipinahahayag ang sarili
  rationale: Hindi malinaw sa anyong Griyego kung bibigyang-diin ang sariling pagkilos ng pananampalataya o ang pagiging aktibo/mabisa nito. Ang pangunahing salin ay sadyang hindi mahigpit sa alinman.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pagiging tuli o di-tuli” sa halip na mga abstraktong anyong hindi natural sa Tagalog. Pinanatili ang matinding paghahambing ng talata at ang sinadyang kaluwagan ng ἐνεργουμένη.
