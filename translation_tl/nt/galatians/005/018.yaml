  text: But if you are led by the Spirit[b][a], you are not under the law.
translation:
  language: tl
  text: Ngunit kung pinapatnubayan kayo ng Espiritu[a], hindi kayo nasa ilalim ng Kautusan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Kung kayo ay pinapatnubayan ng Espiritu.”
    reason: Ipinakikita ng kasalukuyang pasibong anyo ng ἄγεσθε ang “kayo ay pinapatnubayan”; hindi kailangang gawing tahasang progresibo ang aspekto sa Filipino.
  - marker: b
    text: Ang “nasa ilalim ng Kautusan” ay nangangahulugang nasa ilalim ng kapangyarihan o saklaw nito; ihambing sa Galacia 5:23.
    reason: Nililinaw ang idyomatikong diwa at ibinibigay ang kaugnay na talata nang hindi isinasama ang paliwanag sa mismong teksto.
lexical_decisions:
- source_word: εἰ
  choice: kung
  rationale: Tuwirang ipinakikita ang kondisyon nang hindi nagpapahiwatig kung tiyak o di-tiyak ang katuparan nito.
- source_word: δὲ
  choice: ngunit
  rationale: Ipinahahayag ang banayad na pagsalungat sa naunang usapan tungkol sa laman at sa Espiritu.
- source_word: πνεύματι
  choice: ng Espiritu
  rationale: Sa konteksto ng Galacia 5:16–25, tumutukoy ito sa Espiritu ng Diyos; natural sa Tagalog ang malaking titik upang ipakita ang referent na ito.
- source_word: ἄγεσθε
  choice: pinapatnubayan kayo
  rationale: Pinananatili ang pasibong diwa ng kasalukuyang pandiwa at likas na ipinahahayag sa Tagalog ang patuloy na paggabay, nang hindi ginagawang sapilitan ang pagkilos.
- source_word: οὐκ ἐστὲ
  choice: wala kayo
  rationale: Natural na Tagalog na katumbas ng negatibong pananalitang tumutukoy sa kalagayan.
- source_word: ὑπὸ νόμον
  choice: sa ilalim ng Kautusan
  rationale: Pinananatili ang larawang nagpapahiwatig ng pagpapasakop sa kapangyarihan o saklaw ng Kautusan; ang malaking titik ay nililinaw ang kontekstuwal na pagtukoy sa Kautusan ni Moises.
theological_decisions:
- issue: Tinutukoy ng πνεύματι
  choice: ang Espiritu ng Diyos
  alternative: espiritu ng tao
  rationale: Ang agarang konteksto ay paulit-ulit na naghahambing sa laman at sa Espiritu bilang banal na kumikilos, ngunit hindi dinaragdagan ang talata ng tahasang salitang “Banal” na wala sa Griyego.
- issue: Diwa ng ὑπὸ νόμον
  choice: wala sa ilalim ng kapangyarihan o saklaw ng Kautusan
  alternative: wala sa ilalim ng anumang batas sa pangkalahatan
  rationale: Sa Galacia, ang parirala ay tumutukoy sa Kautusan bilang namamahalang kaayusan, lalo na sa Kautusan ni Moises. Pinananatili ng salin ang maigsi at teolohikal na tensiyon ng orihinal nang hindi ito pinalalawak.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinapatnubayan” upang mapanatili ang pasibong larawan ng ἄγω at maging natural sa karaniwang mambabasa; ginamit ang “Kautusan” bilang kontekstuwal na pagtukoy sa Torah.
