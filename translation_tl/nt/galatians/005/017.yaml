source:
  edition: SBLGNT
  text: ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος, τὸ δὲ πνεῦμα κατὰ τῆς σαρκός, ταῦτα ⸀γὰρ ⸂ἀλλήλοις ἀντίκειται⸃, ἵνα μὴ ἃ ⸀ἐὰν θέλητε ταῦτα ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/017.yaml
  text: For the flesh desires what is against the Spirit[a], and the Spirit what is against the flesh; for these oppose each other[b], so that you do not do the things you want.
translation:
  language: tl
  text: Sapagkat ang laman ay nagnanasa laban sa Espiritu[a], at ang Espiritu naman ay nagnanasa laban sa laman. Ang dalawang ito ay magkalaban, kaya hindi ninyo nagagawa ang mga nais ninyong gawin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “laman” ay hindi lamang tumutukoy sa pisikal na katawan; sa kontekstong ito, ginagamit ito ni Pablo para sa makasalanang hilig ng tao. Maaari rin itong isalin na “makasalanang kalikasan.” Ang “Espiritu” ay malamang na ang Banal na Espiritu; maaari rin itong unawain na “espiritu” ng tao.
    reason: lexical_and_alternative_reading
  - marker: b
    text: O “upang hindi ninyo gawin ang anumang nais ninyo.” Maaaring ipahayag ng pariralang Griego ang layunin o ang resulta ng salungatang ito.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: σὰρξ
  choice: ang laman
  rationale: Pinananatili ang metapora at mahalagang bokabularyo ni Pablo. Sa konteksto, higit ito sa pisikal na katawan at tumutukoy sa makasalanang hilig ng tao, ngunit hindi isinisingit sa pangunahing teksto ang paliwanag na iyon.
- source_word: ἐπιθυμεῖ
  choice: nagnanasa
  rationale: Likas na salin ng masidhing pagnanais; ang pariralang “laban sa” ang naghahayag ng salungat na direksiyon nito nang hindi nililimitahan ang salita sa seksuwal na pagnanasa.
- source_word: κατὰ τοῦ πνεύματος / κατὰ τῆς σαρκός
  choice: laban sa Espiritu / laban sa laman
  rationale: Tuwirang pinananatili ang adversatibong diwa ng κατά na may genitive at natural itong mababasa sa Filipino.
- source_word: πνεῦμα
  choice: Espiritu
  rationale: Pinapaboran ng kalapit na konteksto ng Galacia 5 ang Banal na Espiritu bilang tinutukoy, bagaman nananatiling posibleng basahin ang anyong Griego bilang espiritu ng tao.
- source_word: ἀλλήλοις ἀντίκειται
  choice: ang dalawang ito ay magkalaban
  rationale: Malinaw at likas na Filipino para sa kapwa pagsalungat ng laman at Espiritu.
- source_word: ἵνα μὴ
  choice: kaya hindi
  rationale: Ipinahahayag ang praktikal na bunga ng salungatan. Iniiwasan nitong gawing tahasang layunin ang maaaring unawaing layunin o resulta sa Griego.
- source_word: ἃ ἐὰν θέλητε ταῦτα ποιῆτε
  choice: hindi ninyo nagagawa ang mga nais ninyong gawin
  rationale: Pinananatili ang maramihang diwa at ang pangkalahatang pahayag ng indefinite relative construction sa natural na Filipino.
theological_decisions:
- issue: Kahulugan ng σάρξ sa etikong gamit ni Pablo
  choice: Panatilihin ang “laman” sa pangunahing teksto.
  alternative: makasalanang kalikasan
  rationale: Ang “laman” ay nagpapanatili sa metapora at teolohikal na tensiyon ni Pablo; ipinapaliwanag sa talababa na hindi lamang pisikal na katawan ang ibig sabihin dito.
- issue: Tinutukoy ng πνεῦμα
  choice: Espiritu, na inuunawang Banal na Espiritu
  alternative: espiritu ng tao
  rationale: Ang paulit-ulit na paghahambing sa Galacia 5 sa pagitan ng laman at pamumuhay sa Espiritu ay pumapabor sa Banal na Espiritu, ngunit itinatala ang lehitimong alternatibo.
- issue: Puwersang lohikal ng ἵνα μὴ
  choice: 'Isalin bilang bunga: “kaya hindi.”'
  alternative: 'layunin: “upang hindi”'
  rationale: Maaaring magpahiwatig ang ἵνα ng layunin o resulta. Sa pangungusap na ito, malinaw at natural ang pagbasa bilang praktikal na bunga, habang itinatala ang alternatibo upang huwag ikubli ang tunay na ambiguwidad.
translation_notes:
  register: Modernong Filipino na dignidad ang tono. Pinili ang “nagnanasa” at “magkalaban” bilang malinaw at karaniwang mga salita. Iningatan ang metaporang “laman” sa halip na palitan ito ng isang paliwanag, at inilagay sa mga talababa ang mahahalagang alternatibong pagbasa.
