  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡ πεισμονὴ οὐκ ἐκ τοῦ καλοῦντος ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/008.yaml
  text: This persuasion is not from the one who calls you[a].
translation:
  language: tl
  text: Ang panghihikayat na ito ay hindi nagmumula sa tumatawag sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang impluwensiyang ito ay hindi nagmumula sa tumatawag sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισμονὴ
  choice: panghihikayat
  rationale: Ang bihirang pangngalan ay tumutukoy sa panghihikayat o sa bisa ng pagkumbinsi. Ang “panghihikayat” ay natural sa modernong Tagalog at hindi labis na nililinaw kung ang diin ay nasa impluwensiya, paraan ng pagkumbinsi, o kalagayan ng pagiging nahikayat.
- source_word: ἐκ
  choice: nagmumula sa
  rationale: Tinutukoy ng ἐκ ang pinagmulan. Mas natural sa Tagalog ang “nagmumula sa” kaysa sa payak na “mula sa” sa ganitong buong pangungusap.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: tumatawag sa inyo
  rationale: Pinananatili nito ang substantival at kasalukuyang puwersa ng participle nang hindi tahasang idinaragdag ang “Diyos,” na wala sa mismong pariralang Griyego.
- source_word: οὐκ
  choice: hindi
  rationale: Tuwirang pinananatili ang mariing pagtanggi ng pangungusap.
theological_decisions:
- issue: Pagkakakilanlan ng “tumatawag sa inyo”
  choice: Hindi tahasang pinangalanan bilang Diyos sa pangunahing teksto.
  alternative: “Diyos na tumatawag sa inyo”
  rationale: Bagaman malakas na ipinahihiwatig ng konteksto sa Galacia na Diyos ang tinutukoy, participial na parirala ang ginamit sa Griyego at hindi ang tahasang pangngalang “Diyos.” Pinananatili ng salin ang anyo at puwang para sa kontekstuwal na pagkilala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “panghihikayat” bilang pinakamalapit na likas na katumbas ng abstraktong πεισμονή; inilagay sa talababa ang “impluwensiya” upang ipakita ang leksikal na saklaw nang hindi nilulutas ang tunay na kalabuan.
