id: GAL.5.5
reference: Galatians 5:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡμεῖς γὰρ πνεύματι ἐκ πίστεως ἐλπίδα δικαιοσύνης ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/005.yaml
  text: For through the Spirit[a], by faith[d][c][b], we eagerly await the hope of righteousness.
translation:
  language: tl
  text: Sapagkat sa pamamagitan ng Espiritu[a], mula sa pananampalataya[b], sabik nating hinihintay ang pag-asa ng katuwiran[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa Espiritu.” Maaaring ipahiwatig ng datibong Griyego ang paraan (“sa pamamagitan ng Espiritu”) o ang kalagayan o larangan (“sa Espiritu”).
    reason: lexical_alternative
  - marker: b
    text: Literal na “mula sa pananampalataya.” Sa ilang konteksto, ang salitang Griyego para sa “pananampalataya” ay maaari ring mangahulugang “katapatan” o “pagtitiwala.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin ang “katuwiran” bilang “katarungan.” Ang pariralang Griyego ay literal na “pag-asa ng katuwiran” at hindi tahasang nililinaw ang eksaktong ugnayan ng “pag-asa” at “katuwiran.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: natin
  rationale: Ang tahasang panghalip ay may bahagyang diin. Ang inklusibong anyong “natin” ay natural sa Filipino, bagaman hindi tinutukoy ng Griyego kung inklusibo o eksklusibo ang “kami/tayo.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag o suporta sa naunang pahayag at pinananatili ang lohikal na daloy ng argumento.
- source_word: πνεύματι
  choice: sa pamamagitan ng Espiritu
  rationale: Maaaring instrumental o panlarangan ang datibo. Sa konteksto ng Galacia 5, malamang na ang Banal na Espiritu ang tinutukoy; ang pangunahing salin ay nagpapahayag ng paraan o pagkilos.
- source_word: ἐκ πίστεως
  choice: batay sa pananampalataya
  rationale: Ipinahihiwatig ng ἐκ ang pinagmulan o batayan. Mas natural ito sa Filipino kaysa sa literal na “mula sa pananampalataya” habang pinananatili ang puwersa ng parirala.
- source_word: ἐλπίδα δικαιοσύνης
  choice: ang katuparan ng pag-asang maging matuwid
  rationale: Sa Filipino, ang simpleng “pag-asa ng katuwiran” ay maaaring maging malabo o di-likas. Ipinahahayag ng salin ang inaasahang kaganapan na kaugnay ng δικαιοσύνη, habang inilalagay sa talababa ang mas pormal na anyo.
- source_word: ἀπεκδεχόμεθα
  choice: sabik nating hinihintay
  rationale: Ipinahahayag ng pandiwa ang matiyaga at masidhing paghihintay sa isang inaasahang bagay.
theological_decisions:
- issue: Referent ng πνεύματι
  choice: Banal na Espiritu
  alternative: espiritu ng tao
  rationale: Mariing itinuturo ng konteksto ng Galacia 5, lalo na ang paghahambing sa laman at kautusan, ang Banal na Espiritu; kaya ginamit ang malaking titik sa “Espiritu.”
- issue: Gamit ng datibong πνεύματι
  choice: 'instrumental: “sa pamamagitan ng Espiritu”'
  alternative: 'sphere: “sa Espiritu”'
  rationale: Kapuwa posible sa gramatika. Pinili sa pangunahing teksto ang instrumental na diwa, ngunit pinanatili sa talababa ang panlarangang pagbasa.
- issue: Diwa ng ἐλπίδα δικαιοσύνης
  choice: ang inaasahang katuparan ng pagiging matuwid
  alternative: “ang pag-asa ng katuwiran” o pag-asang ibinubunga ng katuwiran
  rationale: Malamang na tumutukoy ito sa panghinaharap na katuparang kaugnay ng katuwiran/pag-aaring-matuwid. Hindi tinukoy nang higit pa kung ito ay katayuan, hatol, o ganap na katuparan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Iniwasan ang di-likas na literalismong “pag-asa ng katuwiran,” ngunit pinanatili iyon sa talababa. Ang “natin” ay piniling natural na anyo, bagaman hindi minamarkahan ng Griyego ang inklusibo/eksklusibong pagkakaiba.
