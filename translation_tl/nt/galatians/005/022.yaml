id: GAL.5.22
reference: Galatians 5:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὁ δὲ καρπὸς τοῦ πνεύματός ἐστιν ἀγάπη, χαρά, εἰρήνη, μακροθυμία, χρηστότης, ἀγαθωσύνη, πίστις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/022.yaml
  text: But the fruit of the Spirit is love[a], joy, peace, patience, kindness, goodness, faithfulness,
translation:
  language: tl
  text: Ngunit ang bunga ng Espiritu ay pag-ibig, kagalakan, kapayapaan, pagtitiis, kabaitan, kabutihan, at pananampalataya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katapatan.” Ang salitang Griego na pistis ay maaaring mangahulugang pananampalataya, pagtitiwala, o katapatan.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang pagsalungat sa naunang talaan ng “mga gawa ng laman” sa Galacia 5:19–21.
- source_word: καρπὸς
  choice: bunga
  rationale: Pinananatili ang metapora at ang anyong isahan, na naglalahad sa mga katangiang ito bilang nagkakaisang bunga.
- source_word: τοῦ πνεύματός
  choice: ng Espiritu
  rationale: Sa konteksto, tumutukoy ito sa Espiritu Santo na ipinantatapat ni Pablo sa laman; sapat at likas sa Tagalog ang malaking titik upang ipahiwatig ang banal na referent.
- source_word: ἀγάπη
  choice: pag-ibig
  rationale: Karaniwan, malinaw, at marangal na katumbas sa modernong Tagalog.
- source_word: χαρά
  choice: kagalakan
  rationale: Likas na pangngalang tumutukoy sa malalim na galak at angkop sa talaan ng mga katangian.
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Pinananatili ang malawak na diwa ng kapayapaan nang hindi nililimitahan sa panloob o pakikipagkapuwa lamang.
- source_word: μακροθυμία
  choice: pagtitiis
  rationale: Malinaw at natural na modernong salin para sa matiyagang pagpapahinuhod o mahabang pagtitiis.
- source_word: χρηστότης
  choice: kabaitan
  rationale: Direkta at natural na katumbas para sa mapagmagandang pakikitungo sa iba.
- source_word: ἀγαθωσύνη
  choice: kabutihan
  rationale: Sinasaklaw ang pangkalahatang katangiang moral na ipinahihiwatig ng salita.
- source_word: πίστις
  choice: pananampalataya
  rationale: Pangunahing leksikal na katumbas ng πίστις; pinananatili sa talababa ang posibleng diwang “katapatan” na angkop din sa talaan ng mga katangian.
theological_decisions:
- issue: Tinutukoy ng πνεῦμα
  choice: Espiritu Santo
  alternative: espiritu ng tao
  rationale: Ang agarang paghahambing sa laman at ang mas malawak na argumento ni Pablo sa Galacia 5 ay tumutukoy sa gawain ng Espiritu Santo.
- issue: Diwa ng πίστις sa talaan ng mga katangian
  choice: pananampalataya
  alternative: katapatan
  rationale: Maaaring mangahulugan ang πίστις ng pananampalataya, pagtitiwala, o katapatan. Hindi lubusang nilulutas ng konteksto ang pagpili, kaya nasa pangunahing teksto ang karaniwang salin at pinananatili sa talababa ang makatwirang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang isahang “bunga,” ginamit ang “Espiritu” para sa Espiritu Santo, at inilagay ang pananda ng talababa pagkatapos ng “pananampalataya,” ang salitang tunay na saklaw ng tala.
