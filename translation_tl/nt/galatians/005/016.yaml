  source_fidelity: Tumpak ang salin sa mga pangunahing elemento ng Griyego. Ang “Ngunit sinasabi ko” ay angkop sa retorikal na paglipat ng Λέγω δέ; ang “Mamuhay kayo ayon sa Espiritu” ay natural na paglalahad ng περιπατεῖτε πνεύματι; at ang “tiyak na hindi ninyo isasagawa” ay maayos na naghahatid ng mariing οὐ μὴ τελέσητε.
