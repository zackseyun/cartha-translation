  text: Λέγω δέ, πνεύματι περιπατεῖτε καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/016.yaml
  text: But I say[a], walk by the Spirit, and you will certainly not carry out the desire of the flesh.
translation:
  language: tl
  text: 'Ngunit sinasabi ko: Mamuhay kayo ayon sa Espiritu, at tiyak na hindi ninyo isasagawa ang pagnanasa ng laman.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “makasalanang kalikasan.” Ang salitang Griyego ay “laman,” na maaaring tumukoy sa makasalanang pagkatao na sumasalungat sa Espiritu.
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω δέ
  choice: Ngunit sinasabi ko
  rationale: Ipinahahayag ang bahagyang pagsalungat o retorikal na paglipat ng δέ nang hindi pinalalabis ang kontrast.
- source_word: πνεύματι
  choice: ayon sa Espiritu
  rationale: Maaaring ipahiwatig ng datibo ang kasangkapan o saklaw. Likas sa Tagalog ang “ayon sa Espiritu” para sa pamumuhay na pinapatnubayan at binibigyang-kakayahan ng Espiritu, at malinaw sa konteksto na ang tinutukoy ay ang Banal na Espiritu.
- source_word: περιπατεῖτε
  choice: Mamuhay kayo
  rationale: Bagaman literal na “lumakad,” idiomatiko itong tumutukoy sa paraan ng pamumuhay. Mas malinaw at natural sa makabagong Tagalog ang “mamuhay” kaysa sa literal na “lumakad” sa kontekstong ito.
- source_word: ἐπιθυμίαν
  choice: ang pagnanasa
  rationale: Pinananatili ang malawak na diwa ng ἐπιθυμία bilang matinding pagnanais; nagiging negatibo ang kahulugan dahil inuugnay ito sa laman.
- source_word: σαρκὸς
  choice: ng laman
  rationale: Pinananatili ang katawagan at teolohikal na tensiyon ni Pablo sa halip na agad itong ipakahulugang “makasalanang kalikasan.”
- source_word: οὐ μὴ τελέσητε
  choice: tiyak na hindi ninyo isasagawa
  rationale: Ang οὐ μή kasama ng aorist subjunctive ay mariing pagtanggi. Ipinahahayag ng “tiyak na hindi” ang diin, at ng “isasagawa” ang pagdadala ng pagnanasa tungo sa gawa.
theological_decisions:
- issue: Tinutukoy ng πνεύματι
  choice: ang Banal na Espiritu
  alternative: espiritu ng tao o isang pangkalahatang espirituwal na prinsipyo
  rationale: Sa agarang konteksto ng Galacia 5, ang Espiritu ay inilalaban sa laman at inilalarawang kumikilos sa buhay ng mga mananampalataya. Ang malaking titik sa “Espiritu” ay naghahayag ng kontekstuwal na pasyang ito.
- issue: Pagpapakahulugan sa σάρξ
  choice: laman
  alternative: makasalanang kalikasan
  rationale: Bagaman moral at antropolohikal ang diwa rito, pinananatili ng “laman” ang sariling kategorya ni Pablo at hindi ikinukulong ang salita sa iisang paliwanag. Inilalahad sa talababa ang posibleng pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mamuhay” bilang natural na katumbas ng idyomang “lumakad,” habang pinanatili ang “laman” upang hindi mawala ang terminolohiya at tensiyong teolohikal ng teksto.
