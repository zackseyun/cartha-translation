  verdict: revise
  source_fidelity: Ang kondisyon at bahagyang pagsalungat ng εἰ δέ ay naipapahayag ng “Ngunit kung.” Napananatili rin ang babalang gantihan at ang bunga ng kapwa pagkawasak. Gayunman, ang “naglalamunan” ay hindi sapat na tuwirang katumbas ng κατεσθίετε at maaaring unawaing pagsasakalan o pagsakal, sa halip na paglalamon/pag-ubos sa metaporang mandaragit.
  naturalness: Natural at malinaw sa makabagong Filipino ang “nagkakagatan,” “nilalamon ang isa’t isa,” at “mag-ingat kayo.” Mas idiomatiko at tiyak ang tahasang layon na “ang isa’t isa” kaysa umasa sa “naglalamunan kayo.”
  terminology: Ang “nilalamon” ay pinananatili ang masidhing larawan ng κατεσθίετε. Ang “maubos kayo ng isa’t isa” ay natural na naghahatid ng pasibong ἀναλωθῆτε at ng ahensiyang ὑπ’ ἀλλήλων, nang hindi ipinipilit ang isang partikular na teolohikal na pagbasa.
