    rationale: Maaaring tumukoy ang “maglalamunan” sa marahas na pag-aaway o pagsasakal at hindi nito malinaw na ipinahahayag ang “devour.” Ang “nilalamon ang isa’t isa” ay mas malapit sa Griyego at pinananatili ang magkakaugnay na metapora ng pagkagat, paglalamon, at pagkaubos.
  revised_text: Ngunit kung nagkakagatan at nilalamon ninyo ang isa’t isa, mag-ingat kayo, baka maubos kayo ng isa’t isa.
