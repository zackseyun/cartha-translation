  text: εἰ δὲ ἀλλήλους δάκνετε καὶ κατεσθίετε, βλέπετε μὴ ὑπ’ ἀλλήλων ἀναλωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/015.yaml
  text: But if you bite and devour one another[a], watch out that you are not consumed by one another.
translation:
  language: tl
  text: Ngunit kung nagkakagatan at nilalamon ninyo ang isa’t isa, mag-ingat kayo, baka maubos kayo ng isa’t isa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ngunit kung
  rationale: Pinananatili ng “kung” ang kondisyon at ng “ngunit” ang banayad na pagsalungat o paglipat mula sa naunang tagubilin.
- source_word: ἀλλήλους
  choice: kayo / sa isa’t isa
  rationale: Ipinahihiwatig ng anyong pandiwang may “-an” at ng “sa isa’t isa” ang gantihang pagkilos sa loob ng komunidad nang natural sa Tagalog.
- source_word: δάκνετε
  choice: nagkakagatan
  rationale: Pinananatili nito ang literal at marahas na larawang hayop ng “pagkagat,” at natural na ipinapakita ang gantihang pagkilos.
- source_word: κατεσθίετε
  choice: naglalamunan
  rationale: Ang “lamon” ay mas matindi kaysa karaniwang pagkain at malinaw na nagpapatuloy sa larawan ng mabangis na pagsalakay.
- source_word: βλέπετε
  choice: mag-ingat kayo
  rationale: Bilang pautos, nagpapahayag ito ng agarang pagbabantay; karaniwan, malinaw, at marangal ang “mag-ingat kayo” sa makabagong Tagalog.
- source_word: μὴ
  choice: baka
  rationale: Natural na ipinapahayag ng “baka” ang negatibong babala tungkol sa posibleng kahihinatnan nang hindi sinasabing tiyak itong mangyayari.
- source_word: ὑπ’ ἀλλήλων
  choice: sa isa’t isa
  rationale: 'Sa natural na Tagalog, ipinapahayag nito ang gantihang ahensiya sa pasibong ideya: ang bawat isa ang nagiging sanhi ng pagkaubos ng kapwa.'
- source_word: ἀναλωθῆτε
  choice: tuluyan kayong maubos
  rationale: Pinananatili ng “maubos” ang larawang kaugnay ng paglamon at ang diwa ng lubos na kapahamakan; nililinaw ng “tuluyan” ang ganap na lakas ng pandiwa nang hindi ginagawang tahasang “mapuksa.”
theological_decisions:
- issue: Matalinghagang karahasan sa loob ng pamayanang Kristiyano
  choice: Panatilihin ang larawang hayop sa “nagkakagatan,” “naglalamunan,” at “maubos.”
  alternative: Kung patuloy kayong nananakit at nagsisira sa isa’t isa...
  rationale: Sadyang matingkad at apurahan ang retorika ni Pablo. Ang paglambot nito tungo sa pangkalahatang pananalita tungkol sa alitan ay magbabawas sa lakas ng babala tungkol sa kapwa-kapahamakan.
translation_notes:
  register: Makabago at madaling maunawaang Filipino, ngunit may dignidad. Ginamit ang mga gantihang anyong “nagkakagatan” at “naglalamunan” upang maging natural ang ἀλλήλους at mapanatili ang marahas na talinghaga. Walang talababa dahil walang kinakailangang tekstuwal o leksikal na alternatibong hindi kayang katawanin ng pangunahing salin.
