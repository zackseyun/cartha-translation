  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐγὼ πέποιθα εἰς ὑμᾶς ἐν κυρίῳ ὅτι οὐδὲν ἄλλο φρονήσετε· ὁ δὲ ταράσσων ὑμᾶς βαστάσει τὸ κρίμα, ὅστις ⸀ἐὰν ᾖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/010.yaml
  text: I am confident in the Lord about you[a], that you will think nothing else; but the one who is troubling you will bear the judgment[b], whoever he may be.
translation:
  language: tl
  text: May tiwala ako sa Panginoon tungkol sa inyo na wala nang iba ang magiging pananaw ninyo[a]. Ngunit ang nanggugulo sa inyo ay magpapasan ng hatol, sinuman siya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi kayo magkakaroon ng ibang pananaw.” Ang pandiwang Griyego ay maaaring tumukoy hindi lamang sa karaniwang pag-iisip kundi sa pagkakaroon ng isang partikular na pananaw o saloobin.
    reason: lexical_alternative
  - marker: b
    text: O “kahit sino pa siya.”
    reason: alternative_reading
lexical_decisions:
- source_word: πέποιθα
  choice: May tiwala ako
  rationale: Ipinahahayag ng perpektong anyo ang matatag at nagpapatuloy na pagtitiwala; natural ito sa modernong Tagalog.
- source_word: εἰς ὑμᾶς
  choice: tungkol sa inyo
  rationale: Ipinakikita nitong ang pagtitiwala ni Pablo ay may kinalaman sa magiging tugon ng mga taga-Galacia, nang hindi ipinapahiwatig na sa kanila mismo nakasalig ang tiwala.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang karaniwang pahayag ni Pablo tungkol sa saklaw o saligan ng kanyang pagtitiwala.
- source_word: οὐδὲν ἄλλο φρονήσετε
  choice: hindi kayo mag-iisip nang iba
  rationale: Direktang pinananatili ang malawak na diwa ng φρονέω bilang pag-iisip, pananaw, o saloobin; hindi nililimitahan sa isang mas tiyak na interpretasyon.
- source_word: ὁ δὲ ταράσσων ὑμᾶς
  choice: Ngunit ang nanggugulo sa inyo
  rationale: Ang pangkasalukuyang participle ay tumutukoy sa taong patuloy na lumilikha ng kaguluhan o pagkabalisa sa kanila.
- source_word: βαστάσει
  choice: magpapasan
  rationale: Pinananatili ang metapora ng pagdadala o pagpasan sa magiging bunga ng hatol.
- source_word: τὸ κρίμα
  choice: ang hatol
  rationale: Sapat na malawak ang “hatol” upang saklawin ang pasya at kaakibat nitong kaparusahan, nang hindi agad tinutukoy bilang walang-hanggang kapahamakan.
- source_word: ὅστις ἐὰν ᾖ
  choice: sinuman siya
  rationale: 'Natural na Filipino para sa di-tiyak at mapagwalang-bahalang puwersa ng parirala: hindi mahalaga kung sino ang taong iyon.'
theological_decisions:
- issue: Ang kalikasan ng pagtitiwala ni Pablo tungkol sa mga taga-Galacia
  choice: Ang kanyang pagtitiwala tungkol sa magiging pananaw nila ay nakasalig sa Panginoon.
  alternative: Ganap at walang-pasubaling katiyakang magpapatuloy ang bawat taga-Galacia, o personal na optimismo lamang ni Pablo.
  rationale: Magkasamang pinananatili ng salin ang personal na pagtitiwala ni Pablo, ang saligan nitong “sa Panginoon,” at ang inaasahan niyang tugon sa hinaharap, nang hindi nilulutas nang lampas sa sinasabi ng teksto ang teolohikal na tensiyon.
- issue: Saklaw ng τὸ κρίμα
  choice: Isang mabigat ngunit hindi espesipikong hatol na papasanin ng nanggugulo.
  alternative: Tiyak na walang-hanggang kapahamakan, o panlipunang bunga o disiplinang pang-iglesia lamang.
  rationale: Hindi tinutukoy ng talata ang eksaktong anyo ng hatol; kaya pinananatili ang bigat at lawak ng κρίμα nang walang idinadagdag na doktrinal na detalye.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado ngunit madaling maunawaan. Ginamit ang “May tiwala ako” sa halip na mas pormal na “Nagtitiwala ako,” at “nanggugulo” upang malinaw na ipahayag ang kasalukuyang pagkilos. Ang mga panandang talababa [a] at [b] ay kapwa nasa pangunahing teksto.
