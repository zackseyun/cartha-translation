  source_fidelity: Tumpak sa kabuuan ang salin ng πέποιθα, ἐν κυρίῳ, ταράσσων, βαστάσει, τὸ κρίμα, at ng di-tiyak na ὅστις ἐὰν ᾖ. Gayunman, ang “hindi kayo mag-iisip nang iba” ay mas madaling unawain bilang ‘hindi kayo mag-iisip sa ibang paraan,’ samantalang ang οὐδὲν ἄλλο φρονήσετε ay tumatanggi sa anumang ibang pananaw o posisyon. Ang maliit na pagbabago ay mas malinaw na sumasalamin sa saklaw ng Griyego nang hindi tinutukoy kung ano ang eksaktong pananaw na tinutukoy.
