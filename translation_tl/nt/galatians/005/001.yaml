id: GAL.5.1
reference: Galatians 5:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τῇ ἐλευθερίᾳ ⸂ἡμᾶς Χριστὸς ἠλευθέρωσεν· στήκετε οὖν⸃ καὶ μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/001.yaml
  text: For freedom Messiah set us free[a]; therefore stand firm[b], and do not again be held by a yoke of slavery.
translation:
  language: tl
  text: Para sa kalayaan ay pinalaya tayo ng Mesiyas[a]. Kaya nga, manatili kayong matatag[b] at huwag kayong muling magpasailalim sa pamatok ng pagkaalipin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Sa kalayaan ay pinalaya tayo ng Mesiyas.” Siksik ang pambungad na parirala sa Griyego at maaari itong maunawaan sa mahigit sa isang magkalapit na paraan.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin, “manindigan kayo.” Ang pandiwang Griyego ay nananawagan ng patuloy na katatagan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐλευθερίᾳ
  choice: Para sa kalayaan
  rationale: Pinananatili nito ang mariing pambungad at ang malamang na diwa ng layunin o bunga, nang hindi inaalis ang siksik na pagkakabuo ng Griyego.
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Isinasalin ang kahulugan ng titulong Χριστός at pinananatili ang kontekstong mesiyaniko nito.
- source_word: ἠλευθέρωσεν
  choice: pinalaya tayo
  rationale: Direkta at likas na salin ng pandiwa; pinananatili rin ang pag-uugnay ng ἐλευθερίᾳ at ἠλευθέρωσεν sa pamamagitan ng ‘kalayaan’ at ‘pinalaya.’
- source_word: στήκετε
  choice: manindigan kayo
  rationale: Likas na makabagong Filipino para sa patuloy at matatag na pananatili; malinaw rin ang maramihang utos.
- source_word: οὖν
  choice: Kaya
  rationale: Malinaw na ipinapakita ang kongklusyong ibinubunga ng naunang pahayag nang hindi nagiging mabigat ang himig.
- source_word: ζυγῷ δουλείας
  choice: sa pamatok ng pagkaalipin
  rationale: Pinananatili ang konkretong talinghaga ng pamatok at ang matinding diwa ng δουλεία bilang pagkaalipin.
- source_word: ἐνέχεσθε
  choice: magpasailalim
  rationale: Ang parirala ay likas na kaakibat ng larawan ng pamatok at nagpapahayag ng muling pagpapasakop o pagkakagapos dito.
- source_word: πάλιν
  choice: muling
  rationale: Tuwirang ipinapahayag ang pagbabalik sa dating kalagayan.
theological_decisions:
- issue: Kung isasalin ang Χριστός bilang titulo o gagamiting anyong nakasanayan sa simbahan
  choice: ang Mesiyas
  alternative: Cristo
  rationale: Dito ay pinananatili ang kahulugan ng Χριστός bilang titulo, nang hindi ito tinatratong basta pangalang pantangi.
- issue: Lakas ng kahulugan ng δουλεία
  choice: pagkaalipin
  alternative: pagkagapos
  rationale: Mas malinaw na ipinakikita ng ‘pagkaalipin’ ang tuwirang kabaligtaran ng kalayaan at ang bigat ng pagiging nasa ilalim ng kapangyarihan ng iba.
- issue: Ugnayan ng pambungad na datibo sa pagpapalaya
  choice: Para sa kalayaan
  alternative: Sa kalayaan
  rationale: Pinipili ang malamang na diwa ng layunin o bunga, ngunit inilalahad sa talababa ang malapit na alternatibo upang hindi patahimikin ang tunay na sintaktikong kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang retorikal na pag-uulit ng ‘kalayaan/pinalaya’ at ang talinghaga ng ‘pamatok,’ habang iniwasan ang makaluma o labis na pansimbahang pananalita.
