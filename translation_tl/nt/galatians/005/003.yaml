  text: μαρτύρομαι δὲ πάλιν παντὶ ἀνθρώπῳ περιτεμνομένῳ ὅτι ὀφειλέτης ἐστὶν ὅλον τὸν νόμον ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/003.yaml
  text: And I testify again to every man who receives circumcision that he is obligated to keep the whole law[a][b][c].
translation:
  language: tl
  text: At muli kong pinatutunayan sa bawat taong nagpapatuli[a] na obligado[b] siyang tuparin ang buong Kautusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tinutuli” o “nagpapahintulot na tuliin siya.” Ang anyo ng salitang Griyego ay maaaring ipahayag sa mga paraang ito; sa konteksto, tinutukoy nito ang isang nagpapasakop sa pagtutuli.
    reason: alternative_reading
  - marker: b
    text: Sa literal, “may utang”; ibig sabihin, nasa ilalim siya ng obligasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτύρομαι
  choice: pinatutunayan
  rationale: Ipinahahayag nito ang taimtim at personal na pagpapatotoo ni Pablo nang hindi ito ginagawang tahasang babala, bagaman may puwersa ng babala ang konteksto.
- source_word: δὲ πάλιν
  choice: At muli
  rationale: Ang “at” ay nagpapanatili ng banayad na pag-uugnay sa naunang pahayag, at ang “muli” ay nagpapakita ng pag-uulit o panibagong pagdiriin.
- source_word: παντὶ ἀνθρώπῳ
  choice: sa bawat taong
  rationale: Ang ἄνθρωπος ay tumutukoy rito sa bawat indibidwal sa pangkalahatan. Likas sa modernong Filipino ang “bawat tao” at hindi nito nililimitahan ang leksikal na kahulugan sa salitang “lalaki,” samantalang malinaw sa gawaing pagtutuli ang aktuwal na tinutukoy sa konteksto.
- source_word: περιτεμνομένῳ
  choice: nagpapatuli
  rationale: Ipinakikita ng anyong ito na ang tao ay sumasailalim sa pagtutuli. Ang “nagpapatuli” ay likas sa Filipino at angkop sa konteksto ng mga taong nagpapasyang tanggapin ang pagtutuli bilang kahingian.
- source_word: ὀφειλέτης ἐστὶν
  choice: obligado
  rationale: Ang literal na larawan ay pagiging “may utang,” ngunit ang diwa rito ay pagiging nasa ilalim ng pananagutang tuparin ang hinihingi. Malinaw at natural itong naihahayag ng “obligado.”
- source_word: ὅλον τὸν νόμον
  choice: ang buong Kautusan
  rationale: Pinananatili ng “buong” ang diin sa kabuuan. Ginamit ang malaking titik sa “Kautusan” sapagkat tumutukoy ito sa Kautusan sa partikular na kontekstong biblikal.
- source_word: ποιῆσαι
  choice: tuparin
  rationale: Bagaman literal na “gawin,” ang “tuparin” ang likas na Filipino para sa pagsasagawa at pagsunod sa hinihingi ng Kautusan.
theological_decisions:
- issue: Saklaw ng pahayag tungkol sa pagtutuli at obligasyon sa Kautusan
  choice: Ang pahayag ay nakatuon sa sinumang nagpapasakop sa pagtutuli sa usaping kinakaharap ng mga taga-Galacia, na dahil dito ay nagiging obligadong tuparin ang buong Kautusan.
  alternative: Maaaring unawain ang parirala bilang pangkalahatang pagtukoy sa sinumang tuli, kabilang ang mga tinuli noong sanggol pa.
  rationale: Kasunod ito ng Galacia 5:2 at ang kasalukuyang pandiwaring περιτεμνομένῳ ay angkop sa mga sumasailalim sa pagtutuli sa kasalukuyang usapin. Gayunman, hindi idinagdag sa pangunahing teksto ang motibo o layuning hindi tahasang binanggit sa Griyego.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinili ang “tao” bilang likas na pangkalahatang tawag sa Filipino, ang “nagpapatuli” para sa kontekstuwal na diwa ng kusang pagsailalim sa pagtutuli, at ang “obligado” upang maiwasan ang maling pagkaunawa na pananalaping utang ang tinutukoy.
