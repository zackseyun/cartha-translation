base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/024.yaml
  text: Those who belong to Messiah have crucified the flesh along with its passions and desires[a][b].
translation:
  language: tl
  text: Ngunit ipinako na sa krus ng mga kabilang sa Mesiyas[a] ang laman, kasama ang mga silakbo at pagnanasa nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Cristo.”
    reason: alternative_reading
  - marker: b
    text: Ang “laman” dito ay tumutukoy sa makasalanang kalikasan ng tao na sumasalungat sa Espiritu; isinasalin ito ng ilan bilang “makasalanang kalikasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... τοῦ Χριστοῦ
  choice: mga kabilang sa Mesiyas
  rationale: Likas na ipinahahayag sa Filipino ang genitibong tumutukoy sa mga taong nakaugnay at nabibilang sa Mesiyas, nang hindi labis na idinidiin ang pagmamay-ari.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang banayad na pagsalungat sa naunang paglalarawan, bagaman hindi ito kasingdiin ng isang matinding adversatibo.
- source_word: σάρκα
  choice: laman
  rationale: Pinananatili ang metaporikal at teolohikal na bokabularyo ni Pablo sa halip na agad itong ipakahulugang “makasalanang kalikasan.”
- source_word: ἐσταύρωσαν
  choice: ipinako na sa krus
  rationale: Tuwirang pinananatili ang larawan ng pagpapako sa krus. Ipinahihiwatig ng “na” ang tiyak na naganap na kilos na may kabuluhan sa kasalukuyan.
- source_word: σὺν
  choice: kasama
  rationale: Malinaw at likas na ipinapahayag ang pagsama ng mga silakbo at pagnanasa sa laman.
- source_word: παθήμασιν
  choice: mga silakbo
  rationale: Sa kontekstong etikal, tumutukoy ito sa malalakas na udyok o damdaming kaugnay ng laman, hindi sa mga pagdurusa.
- source_word: ἐπιθυμίαις
  choice: mga pagnanasa
  rationale: Malawak at natural na katumbas ito ng matitinding pagnanais at hindi ito nililimitahan sa seksuwal na pita.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Ipinakikita ng katawagan ang mesiyanikong katungkulan ni Jesus; inilalagay sa talababa ang tradisyonal at maaari ring pangalang anyong “Cristo.”
- issue: Pagpapakahulugan sa σάρξ sa etikal na pagsalungat sa Espiritu
  choice: laman
  alternative: makasalanang kalikasan
  rationale: Pinananatili ng “laman” ang sadyang matalinghaga at teolohikal na tensiyon ng salita ni Pablo; ang mas interpretibong kahulugan ay ipinaliliwanag sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matinding larawan ng pagpapako sa krus at ang terminong “laman,” habang iniwasan ang makitid o denominasyonal na pagpapakahulugan.
