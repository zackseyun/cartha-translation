  text: Let us not become conceited[a], provoking one another, envying one another.
translation:
  language: tl
  text: Huwag tayong maging mapagmataas[a], na nag-uudyukan sa isa’t isa at naiinggit sa isa’t isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mapaghangad ng hungkag na karangalan.” Ang salitang Griyego ay tumutukoy sa pagiging udyok ng hungkag o walang-batayang pagpapahalaga at karangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γινώμεθα
  choice: Huwag tayong maging
  rationale: Ang μή kasama ng unang panauhang maramihang pangkasalukuyang pasakali ay isang sama-samang pagbabawal o panawagan. Pinananatili ng “Huwag tayong maging” ang diwang exhortatibo at ang pahiwatig ng pagpasok sa gayong kalagayan.
- source_word: κενόδοξοι
  choice: mapagmataas[a]
  rationale: 'Likas at malinaw ito sa modernong Filipino para sa labis na pagpapahalaga sa sarili. Nililinaw ng talababa ang mas literal na diwa ng salitang Griyego: paghahangad ng hungkag o walang-batayang karangalan.'
- source_word: ἀλλήλους προκαλούμενοι
  choice: naghahamunan
  rationale: Ipinahahayag ng anyong gantihan ang “isa't isa,” habang pinananatili ng “hamon” ang diwa ng pagpukaw o pag-anyaya sa tunggalian, hindi lamang simpleng pang-iinis.
- source_word: ἀλλήλοις φθονοῦντες
  choice: nag-iinggitan
  rationale: Ang anyong gantihan ay likas na nagpapahayag ng pagkainggit sa isa't isa at nagpapanatili ng pagkakapantay ng dalawang pariralang pandiwari.
theological_decisions:
- issue: Ugnayan ng mga pandiwari sa pangunahing panawagan
  choice: 'Isinalin ang mga pandiwari bilang magkakaugnay na paglalarawan ng mga kilos na kasama o bunga ng pagmamataas: “na naghahamunan at nag-iinggitan.”'
  alternative: Maaaring unawain ang mga ito bilang halos magkakahiwalay na utos, o bilang paraan kung paano nagiging mapagmataas ang mga tao.
  rationale: Pangunahing panaguri ang κενόδοξοι kasunod ng γινώμεθα, at inilalarawan ng mga pandiwari ang kaugnay na asal. Hindi tahasang nililimitahan ng salin kung ang mga iyon ay bunga, paraan, o kasabay na pagpapakita ng pagmamataas.
translation_notes:
  register: Modernong Filipino na maikli, marangal, at madaling maunawaan. Ginamit ang mga anyong gantihang “naghahamunan” at “nag-iinggitan” upang maging natural sa Tagalog habang pinananatili ang dalawang ulit na ἀλλήλων sa diwa.
