  - severity: low
    issue: Ang paliwanag sa talababa ay bahagyang masyadong nakatuon sa pagtinging mataas sa sarili.
    rationale: Ang κενόδοξος ay tumutukoy sa pagiging udyok ng hungkag na kaluwalhatian o walang-batayang pagpapahalaga. Mas mabuting ilarawan ito bilang paghahangad ng hungkag na karangalan kaysa gawing pangunahing depinisyon ang pagtinging mataas sa sarili.
