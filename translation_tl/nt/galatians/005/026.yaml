  verdict: revise
  source_fidelity: Tumpak ang pangunahing panawagang “Huwag tayong maging” para sa μὴ γινώμεθα, at ang “mapagmataas” ay katanggap-tanggap na pangunahing salin ng κενόδοξοι kapag sinamahan ng talababa. Gayunman, hindi sapat na malinaw na naipapahayag ng mga anyong gantihan ang parehong tahasang reciprocal pronoun (ἀλλήλους / ἀλλήλοις), lalo na sa ikalawang pandiwari.
  naturalness: Natural at marangal ang “Huwag tayong maging mapagmataas.” Mas malinaw at likas sa modernong Filipino ang tahasang “sa isa’t isa” sa dalawang magkaparis na pandiwari. Ang “nag-uudyukan sa isa’t isa” ay angkop sa malawak na diwa ng προκαλούμενοι na pagpukaw o paghamon, nang hindi ito nililimitahan sa simpleng pang-iinis.
  terminology: 'Pinananatili ang “mapagmataas” bilang madaling unawaing salin, habang ang talababa ay nagbibigay ng mas malapit na leksikal na alternatibo: paghahangad ng hungkag na karangalan. Hindi dapat ipakahulugan ang salita na basta mataas na pagtingin sa sarili lamang, sapagkat ang κενόδοξος ay partikular na may kaugnayan sa hungkag na kaluwalhatian o pagkilala.'
