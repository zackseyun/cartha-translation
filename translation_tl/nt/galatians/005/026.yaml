revisions:
- from: 'Huwag tayong maging mapagmataas[a], na naghahamunan at nag-iinggitan.


    [a] Maaari ring “mapaghangad ng walang-kabuluhang karangalan.” Ang salitang Griyego ay tumutukoy sa pagtinging mataas sa sarili batay sa hungkag o walang-saysay na karangalan.'
  to: Huwag tayong maging mapagmataas[a], na nag-uudyukan sa isa’t isa at naiinggit sa isa’t isa.
  rationale: Iningatan ng rebisyon ang anyong panawagan at ang posibleng kaugnayan ng mga pandiwari sa pagiging mapagmataas sa pamamagitan ng “na.” Ginawang tahasan ang “sa isa’t isa” sa parehong parirala upang matumbasan ang dalawang reciprocal pronoun sa Griyego. Inayos din ang talababa upang mas malapit na mailarawan ang leksikal na diwa ng κενόδοξος nang hindi nawawala ang natural na pangunahing salin.
