  text: You who are seeking to be justified by law have been severed from the Messiah; you have fallen away from grace.
translation:
  language: tl
  text: Kayong naghahangad na ariing matuwid[b] sa pamamagitan ng kautusan ay nahiwalay na[a] kay Mesiyas[c]; nahulog na kayo mula sa biyaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nawalay kay Mesiyas” o “naputol ang kaugnayan kay Mesiyas.”
    reason: lexical_alternative
  - marker: b
    text: 'Mas pormal: “Kayong inaaring matuwid sa pamamagitan ng kautusan.” Ang pandiwang Griyego ay nasa kasalukuyang panahunang balintiyak; ang pangunahing salin ay sumasalamin sa argumento ni Pablo tungkol sa paghahangad na ariing matuwid batay sa kautusan.'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “Cristo.” Ang Griyegong Christos ay maaaring isaling “Cristo” o, kapag malinaw na ginagamit bilang titulo, “Mesiyas.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατηργήθητε
  choice: nahiwalay na
  rationale: Sa pagkakaugnay nito sa ἀπὸ Χριστοῦ, ipinahihiwatig ng pandiwa ang pagkakahiwalay o pagkaputol ng kaugnayan sa Mesiyas. Ang “nahiwalay na” ay natural sa modernong Tagalog at pinananatili ang matinding puwersang panrelasyon nang hindi nagpapasiya kung ano ang pangwakas na doktrinal na bunga nito.
- source_word: ἀπὸ Χριστοῦ
  choice: sa Mesiyas
  rationale: Ang ἀπό ay nagpapahayag ng pagkakahiwalay. Isinalin ang Χριστός bilang “Mesiyas” sapagkat gumaganap ito rito bilang titulo ng pinahirang tagapagligtas; inilalahad sa talababa ang “Cristo” bilang lehitimong katumbas.
- source_word: οἵτινες
  choice: Kayong
  rationale: Tinutukoy ng panghalip ang mga kabilang sa kausap ni Pablo na naghahangad ng pag-aaring matuwid sa pamamagitan ng kautusan. Pinananatili ng “Kayong” ang tuwirang ikalawang panauhan.
- source_word: ἐν νόμῳ
  choice: sa pamamagitan ng kautusan
  rationale: Ipinakikita ng parirala ang batayan o paraang inaasahan para sa pag-aaring matuwid. Mas malinaw at natural sa Tagalog ang “sa pamamagitan ng kautusan” kaysa sa literal na “sa kautusan,” at hindi nito ipinapasok ang tiyak na pantukoy na wala sa Griyego.
- source_word: δικαιοῦσθε
  choice: naghahangad na ariing matuwid
  rationale: Ang anyo ay kasalukuyang balintiyak at maaaring isalin nang mas pormal bilang “inaaring matuwid.” Gayunman, sa argumento ni Pablo, tinutukoy nito ang mga naghahangad o umaasang ariing matuwid batay sa kautusan. Ang salin ay nagpapalinaw sa konteksto habang inilalahad sa talababa ang mas pormal na posibilidad.
- source_word: τῆς χάριτος
  choice: mula sa biyaya
  rationale: Kasama ng ἐκπίπτω, tumutukoy ang genitibo sa bagay o kalagayang pinanggalingan ng pagkahulog. Ang “biyaya” ay karaniwan, marangal, at teolohikong hindi labis na nagpapakahulugan.
- source_word: ἐξεπέσατε
  choice: nahulog na kayo
  rationale: Pinananatili nito ang malinaw na talinghaga ng Griyego at ang tiyak at matinding babala ni Pablo. Ang “na” ay likas na naghahatid sa Tagalog ng naganap nang kalagayan, nang hindi nagpapasiya sa mas malawak na debate tungkol sa kaligtasan.
theological_decisions:
- issue: Kung dapat bang ipasiya ng salin ang debate tungkol sa pagkawala ng kaligtasan o pagtalikod lamang sa biyaya bilang saligan
  choice: 'Panatilihin ang tuwirang babala: “nahiwalay na sa Mesiyas … nahulog na … mula sa biyaya.”'
  alternative: Palambutin bilang “nalayo sa Mesiyas” o ipaliwanag bilang “tinalikuran ang pamamaraan ng biyaya.”
  rationale: Matindi at panrelasyon ang pananalita ng Griyego, ngunit hindi nito sa talatang ito lamang nilulutas ang lahat ng sistematikong tanong tungkol sa kaligtasan. Pinananatili ng salin ang tensiyong iyon nang walang idinadagdag na konklusyong denominasyonal.
- issue: Kung ang δικαιοῦσθε ay dapat unawaing aktuwal na pag-aaring matuwid o paghahangad nito
  choice: Gamitin sa pangunahing teksto ang kontekstuwal na “naghahangad na ariing matuwid,” na may pormal na alternatibo sa talababa.
  alternative: “inaaring matuwid” o “inaaring matuwid”
  rationale: Balintiyak ang anyong Griyego, ngunit ang argumento ni Pablo ay hindi nagpapatunay na tunay silang inaaring matuwid sa pamamagitan ng kautusan. Ang pangunahing salin ay naghahatid ng pragmatikong diwa, samantalang pinananatili ng talababa ang tunay na gramatikal na ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “ariing matuwid” upang panatilihin ang hudisyal o deklaratibong diwa ng δικαιόω, “kautusan” para sa νόμος, at “biyaya” para sa χάρις. Iniwasan ang masyadong kolokyal na pananalita at ang mga paliwanag na nagpapasiya sa pinagtatalunang doktrinal na implikasyon.
