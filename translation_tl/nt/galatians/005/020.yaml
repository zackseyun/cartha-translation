base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/020.yaml
  text: idolatry[a], sorcery, hostilities, strife, jealousy, outbursts of anger, selfish ambition, divisions, factions[b],
translation:
  language: tl
  text: pagsamba sa mga diyus-diyosan, pangkukulam, pagkapoot, pag-aaway, pagseselos, silakbo ng galit, makasariling ambisyon, pagkakabaha-bahagi, pagkakampi-kampi[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagbuo ng mga paksyon” o “mga sekta”; sa mas huling gamit sa iglesya, “mga erehiya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδωλολατρία
  choice: pagsamba sa mga diyus-diyosan
  rationale: Tuwirang inilalarawan ang pagsamba o paglilingkod sa mga idolo at mas madaling maunawaan kaysa sa teknikal na “idolatriya.”
- source_word: φαρμακεία
  choice: pangkukulam
  rationale: Sa talaang ito ng masasamang gawa, tumutukoy ito sa mahika o okultong gawain, hindi sa panggagamot sa pangkalahatan.
- source_word: ἔχθραι
  choice: pagkapoot
  rationale: Ipinahahayag ang mapanlabang saloobin at ugnayan; ang maramihang anyo ay hindi kailangang tumbasan ng di-likas na maramihan sa Tagalog.
- source_word: ἔρις
  choice: pag-aaway
  rationale: Natural at malinaw na katumbas ng alitan o mapagtunggaling hidwaan sa pagitan ng mga tao.
- source_word: ζῆλος
  choice: pagseselos
  rationale: Sa negatibong konteksto, tumutukoy ito sa selos at mapagkompetensiyang pagkainggit, hindi sa mabuting sigasig.
- source_word: θυμοί
  choice: silakbo ng galit
  rationale: Napananatili ang diwa ng paulit-ulit o biglaang pagputok ng matinding galit.
- source_word: ἐριθεῖαι
  choice: makasariling ambisyon
  rationale: Sinasaklaw ang pansariling paghahangad at pakikipagpaligsahan para sa sariling kapakinabangan.
- source_word: διχοστασίαι
  choice: pagkakabaha-bahagi
  rationale: Malinaw na inilalarawan ang pagkakawatak at pagtayo sa magkakasalungat na panig.
- source_word: αἱρέσεις
  choice: pagkakampi-kampi
  rationale: Inilalarawan ang pagbuo ng mapaghating mga pangkat o paksyon nang hindi ipinapasok ang mas huling teknikal na kahulugan na “maling aral.”
theological_decisions:
- issue: Pagpapakahulugan sa αἱρέσεις
  choice: pagkakampi-kampi
  alternative: mga sekta; mga maling aral
  rationale: Sa konteksto ng magkakaugnay na kasalanang sumisira sa pamayanan, nangingibabaw ang kahulugan ng mapaghating pagpapangkat. Ang “mga maling aral” ay maaaring magpasok ng mas huling teknikal na gamit na hindi hinihingi ng talata.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang anyong talaan at gumamit ng magkakatulad na pangngalang nagpapahayag ng mga gawain o kalagayan. Ang kuwit sa hulihan ay pinanatili dahil nagpapatuloy ang pangungusap sa susunod na talata.
