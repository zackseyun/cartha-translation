  text: I wish those who are upsetting you would even mutilate themselves[a][b].
translation:
  language: tl
  text: Sana’y kapunin na lamang ng mga nanggugulo sa inyo ang kanilang sarili.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “putulin ang kanilang sarili.” Sa konteksto ng pagtatalo tungkol sa pagtutuli, malamang na mapanuyang tinutukoy ni Pablo ang paglagpas sa pagtutuli tungo sa pagkapon o mas matinding pagpinsala sa katawan.
    reason: lexical_alternative
  - marker: b
    text: O “mga nanggagambala sa inyo.” Maaari ring ipahiwatig ng salita ang paglikha ng kalituhan o kaguluhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφελον
  choice: Sana'y
  rationale: Likas at kasalukuyang paraan sa Filipino upang ipahayag ang isang matindi ngunit hindi tiyak na matutupad na hangarin.
- source_word: καὶ
  choice: tuluyan nang
  rationale: 'Sa konteksto, pinatitingkad ng καί ang pahayag: hindi lamang pagtutuli kundi pagputol nang higit pa. Ipinahahayag ng “tuluyan nang” ang pag-igting ng retorika nang hindi ito ginagawang simpleng “at.”'
- source_word: ἀποκόψονται
  choice: putulin ... ang sarili nila
  rationale: Pinananatili nito ang larawang pagputol at ang mapanuyang laro sa salita kaugnay ng pagtutuli. Hindi nito lubusang isinasara ang posibleng literal na diwang “ihiwalay ang sarili,” bagaman sa konteksto ay malamang na tumutukoy ito sa mas matinding pagputol o pagkapon.
- source_word: οἱ ἀναστατοῦντες
  choice: mga nanggugulo
  rationale: Natural na Filipino para sa mga taong lumilikha ng kaguluhan at gumagambala sa mga mananampalataya.
- source_word: ὑμᾶς
  choice: sa inyo
  rationale: Tumutukoy sa maramihang kausap, ang mga mananampalataya sa Galacia.
theological_decisions:
- issue: Ang ibig sabihin ng matalim na hangarin ni Pablo kaugnay ng pagtutuli
  choice: Pinanatili ang matinding larawang pagputol sa sarili, na sa konteksto ay malamang na mapanuyang pagtukoy sa paglagpas sa pagtutuli tungo sa pagpapakapón o matinding pagpinsala sa katawan.
  alternative: Maaaring unawain na hinihiling lamang ni Pablo na ihiwalay ng mga nanggugulo ang kanilang sarili sa kapulungan.
  rationale: Ang agarang konteksto ay ang pagtatalo tungkol sa pagtutuli, kaya pinakamalamang na may sinasadyang laro sa salitang “pagputol.” Gayunman, hindi tahasang binabanggit ng Griyego ang bahagi ng katawan, kaya pinanatili sa pangunahing teksto ang bahagyang kalabuan at ipinaliwanag ito sa talababa.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Ang “Sana'y” ay pamilyar ngunit may angkop na bigat; ang “mga nanggugulo” ay malinaw sa karaniwang mambabasa. Sadyang matalim ang “putulin ... ang sarili nila” upang huwag palambutin ang retorika ni Pablo, habang ang mga talababa ang nagpapaliwanag sa posibleng pagkapon at sa natitirang leksikal na kalabuan.
