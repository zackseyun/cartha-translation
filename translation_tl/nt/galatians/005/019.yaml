  text: 'Malinaw naman ang mga gawa ng laman[a]: imoralidad na seksuwal, karumihan, at kahalayan,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makasalanang kalikasan.” Ang salitang Griyego ay “laman” (σάρξ), na ginagamit dito ni Pablo bilang metapora para sa makasalanang mga pagnanasa at pagkiling ng tao.
    reason: alternative_reading
lexical_decisions:
- source_word: φανερὰ
  choice: Malinaw
  rationale: Ipinahihiwatig ng salita na ang mga gawang ito ay hayag at madaling makilala. Likas at madaling maunawaan sa modernong Tagalog ang “malinaw.”
- source_word: δέ
  choice: naman
  rationale: Mahinang panandang panlipat o paghahambing ang δέ. Ipinahahayag ng “naman” ang paglipat mula sa naunang talakayan nang hindi ginagawang labis na matindi ang pagsalungat.
- source_word: τὰ ἔργα
  choice: ang mga gawa
  rationale: Pinananatili ng “mga gawa” ang karaniwang kahulugan ng ἔργα at ang paghahambing ni Pablo sa “bunga ng Espiritu” sa kasunod na konteksto.
- source_word: τῆς σαρκός
  choice: ng laman
  rationale: Pinananatili ng “laman” ang metapora at sadyang tensiyong teolohikal sa paghahambing ng laman at Espiritu, sa halip na agad itong ipakahulugan bilang “makasalanang pagkatao.”
- source_word: ἅτινά ἐστιν
  choice: ':'
  rationale: Natural na ipinakikilala ng tutuldok ang kasunod na talaan at naihahatid nito ang tungkulin ng pariralang Griyego nang hindi paulit-ulit.
- source_word: πορνεία
  choice: imoralidad na seksuwal
  rationale: Malawak ang saklaw ng πορνεία para sa ipinagbabawal o imoral na gawaing seksuwal. Malinaw at hindi lipas ang saling ito.
- source_word: ἀκαθαρσία
  choice: karumihan
  rationale: Tumutukoy rito ang salita sa moral na karumihan. Maikli at pamilyar ang “karumihan” habang pinananatili ang etikal na diwa.
- source_word: ἀσέλγεια
  choice: kahalayan
  rationale: Ipinahihiwatig ng salita ang walang-pigil at walang-kahihiyang asal, lalo na sa usaping seksuwal. Ang “kahalayan” ay natural, malinaw, at sapat na malawak sa kontekstong ito.
theological_decisions:
- issue: Pagpapakahulugan sa σάρξ sa kontekstong etikal ni Pablo
  choice: laman
  alternative: makasalanang pagkatao
  rationale: Matalinghaga rito ang σάρξ, ngunit pinananatili ng “laman” ang mismong larawan ni Pablo at ang mahalagang paghahambing nito sa Espiritu. Inilalagay sa talababa ang mas interpretatibong alternatibo upang hindi mawala ang posibleng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “naman” bilang banayad na panandang panlipat. Pinanatili ang kuwit sa hulihan sapagkat nagpapatuloy ang talaan sa kasunod na talata.
