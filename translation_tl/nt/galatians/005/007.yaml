  text: You were running well[a]. Who hindered you from obeying the truth?
translation:
  language: tl
  text: Mahusay ang takbo ninyo noon. Sino ang humadlang sa inyong sumunod sa katotohanan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sino ang humadlang upang hindi kayo mahimok ng katotohanan?” Ang pandiwang Griyego ay maaaring mangahulugang “sumunod” o “mahimok.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐτρέχετε
  choice: ang takbo ninyo
  rationale: Ipinahihiwatig ng anyong imperfect ang nagpapatuloy na kalagayan noong nakaraan. Pinananatili ng “takbo” ang larawang pangkarera nang hindi idinaragdag ang salitang “karera,” na wala sa Griyego.
- source_word: καλῶς
  choice: Maayos
  rationale: Likas na inilalarawan nito sa modernong Tagalog ang mahusay o wastong pagtakbo at pagsulong.
- source_word: τίς
  choice: Sino
  rationale: Personal na pananong ito tungkol sa taong naging sanhi ng paghadlang.
- source_word: ἐνέκοψεν
  choice: humadlang
  rationale: Malinaw at likas na katumbas ito ng pagpigil o pagharang; nananatili ang posibleng larawang pangkarera dahil sa naunang “takbo.”
- source_word: τῇ ἀληθείᾳ
  choice: sa katotohanan
  rationale: Ang parirala ay kaugnay ng πείθεσθαι at tumutukoy sa katotohanang dapat tugunan, malamang ang katotohanan ng ebanghelyo sa konteksto.
- source_word: μὴ πείθεσθαι
  choice: sumunod
  rationale: Maaaring mangahulugan ang πείθομαι ng pagsunod, lalo na kapag ang tugon sa katotohanan ang tinutukoy. Inilalagay sa talababa ang tunay na alternatibong diwang “magpaniwala.”
theological_decisions:
- issue: Kahulugan ng πείθεσθαι kasama ng τῇ ἀληθείᾳ
  choice: sumunod sa katotohanan
  alternative: magpaniwala sa katotohanan
  rationale: Binibigyang-diin ng konteksto ang aktuwal na pagtugon ng mga taga-Galacia sa katotohanan ng ebanghelyo. Gayunman, hindi inaalis ang kahulugang may kinalaman sa pagkumbinsi o paniniwala; pinananatili ito sa talababa upang hindi tahimik na lutasin ang leksikal at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ang “Maayos ang takbo ninyo” ay natural na nagpapanatili sa metaporang pangkarera, at ang tanong ay tuwiran nang hindi nagdaragdag ng paliwanag na wala sa teksto.
