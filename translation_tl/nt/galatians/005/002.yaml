  text: 'Look: I[a], Paul, say to you that if you receive circumcision[b], Messiah will benefit you nothing.'
translation:
  language: tl
  text: 'Tingnan ninyo: Ako, si Pablo, ay nagsasabi sa inyo na kung magpapatuli kayo,[a] walang maitutulong sa inyo ang Mesiyas.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kung kayo ay tutuliin” o “kung hahayaan ninyong tuliin kayo.”
    reason: lexical_alternative
  - marker: b
    text: 'Griyego: Χριστός; maaari ring isaling “Cristo.” Ginamit dito ang “Mesiyas” sapagkat ginagamit ito bilang pamagat.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδε
  choice: 'Pakinggan ninyo:'
  rationale: Pantawag-pansin ito na nagpapatingkad sa mariing babala ni Pablo. Mas natural sa makabagong Tagalog kaysa sa literal na “Tingnan ninyo” sa kontekstong pasalita.
- source_word: ἐγὼ Παῦλος
  choice: Akong si Pablo
  rationale: Pinananatili ang hayag at mariing panghalip kasama ng pangalan, gayundin ang sariling pagkakakilanlan ni Pablo.
- source_word: λέγω ὑμῖν
  choice: ang nagsasabi sa inyo
  rationale: Tuwiran at natural na salin ng pahayag ni Pablo sa kanyang mga kausap.
- source_word: ἐὰν περιτέμνησθε
  choice: kung magpapatuli kayo
  rationale: Natural na Tagalog para sa pagpayag o pagpapasailalim sa pagtutuli; hindi nito ipinahihiwatig na sila mismo ang magsasagawa ng rito.
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Dito ay tumutukoy ang Χριστός sa katungkulan ni Jesus bilang pinahiran, kaya pinananatili ang diwang pamagat.
- source_word: οὐδὲν ὠφελήσει
  choice: hindi kayo pakikinabangan
  rationale: Malinaw na ipinahahayag ang ganap na kawalan ng pakinabang, habang pinananatili ang ugnayan ng Mesiyas bilang simuno at ng mga mambabasa bilang layon.
theological_decisions:
- issue: Paglalarawan sa Χριστός
  choice: ang Mesiyas
  alternative: si Cristo
  rationale: May makabuluhang puwersa bilang pamagat ang Χριστός sa babalang ito, kaya isinalin ang kahulugan sa halip na gamitin lamang ang nakasanayang transliterasyon.
- issue: Saklaw ng babala tungkol sa pagtutuli
  choice: 'Pinanatiling payak ang kondisyon: “kung magpapatuli kayo,” nang hindi idinaragdag sa pangunahing teksto ang layuning teolohikal ng gawain.'
  alternative: kung magpapatuli kayo upang ariing matuwid sa pamamagitan ng Kautusan
  rationale: Ipinakikita ng konteksto ang usapin ng pagtutuli bilang obligasyong kaugnay ng Kautusan, ngunit wala sa mismong talata ang pinalawak na parirala. Hindi dapat ipasok sa teksto ang paliwanag o palawakin ito bilang paghatol sa lahat ng medikal o etnikong pagtutuli.
translation_notes:
  register: Makabago, marangal, at tuwirang Filipino. Ginamit ang “Pakinggan ninyo” bilang likas na pantawag-pansin at ang “magpapatuli” bilang karaniwang paraan ng pagsasaad na sasailalim ang isang tao sa pagtutuli.
