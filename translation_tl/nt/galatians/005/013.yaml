id: GAL.5.13
reference: Galatians 5:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὑμεῖς γὰρ ἐπ’ ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί· μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί, ἀλλὰ διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/013.yaml
  text: For you were called to freedom[a], brothers; only do not use your freedom as an opportunity for the flesh[d][c][b], but through love serve one another.
translation:
  language: tl
  text: Sapagkat tinawag kayo sa kalayaan, mga kapatid[a]. Ngunit huwag ninyong gamitin ang inyong kalayaan bilang pagkakataon[b] para sa laman[c]; sa halip, sa pamamagitan ng pag-ibig ay maglingkod[d] kayo sa isa’t isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa anyong panlalaking maramihan, ngunit bilang tawag sa liham na ito ay saklaw nito ang buong komunidad ng mga mananampalataya, kabilang ang mga babae.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “bilang tuntungan” o “bilang panimulang punto.” Ang diwa ay huwag gawing daan ang kalayaan para sa makasariling pagnanasa.
    reason: lexical_alternative
  - marker: c
    text: Ang “laman” dito ay hindi lamang ang pisikal na katawan kundi ang mga makasalanang hilig ng tao. Isinasalin ito ng ilan bilang “makasalanang kalikasan.”
    reason: alternative_reading
  - marker: d
    text: Ang pandiwang isinaling “maglingkod” ay kaugnay ng salitang Griyego para sa “alipin” at nagpapahiwatig ng pagbibigay ng sarili sa paglilingkod sa kapwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: kayo
  rationale: Tahasang panghalip na maramihan ito at may bahagyang diin. Likas na naipapahayag sa Tagalog ang diin sa ayos na “tinawag kayo” nang hindi na kailangang dagdagan ng “kayo mismo.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag o batayan para sa naunang pangangatwiran. Pinananatili ng “Sapagkat” ang malinaw na lohikal na ugnayan.
- source_word: ἐπ’ ἐλευθερίᾳ
  choice: sa kalayaan
  rationale: Ipinahihiwatig ng parirala ang kalayaan bilang kalagayan o layuning kinatawag sa kanila. Ang “sa kalayaan” ay natural at hindi labis na nagpapasya sa pagitan ng layunin at kalagayan.
- source_word: ἐκλήθητε
  choice: tinawag kayo
  rationale: Tapat at karaniwang salin ng pasibong anyo ng καλέω. Hindi nito tahasang pinapangalanan ang Diyos bilang gumagawa, gaya rin ng Griyegong pasibo.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Sa Tagalog, ang “mga kapatid” ay likas na tawag sa buong kapulungan at hindi kinakailangang tukuyin ang kasarian, samantalang nananatili ang larawang pampamilya ng salitang Griyego.
- source_word: μόνον
  choice: lamang
  rationale: Ipinakikita nito ang mahalagang paglilimita sa naunang pahayag tungkol sa kalayaan.
- source_word: μὴ...εἰς ἀφορμὴν
  choice: Huwag ... gamitin ... bilang pagkakataon
  rationale: Ang ἀφορμή ay maaaring mangahulugang pagkakataon, dahilan, o panimulang himpilan. Ang pariralang ito ay malinaw at natural na babala laban sa paggamit ng kalayaan bilang daan sa masamang pagnanasa.
- source_word: σάρξ
  choice: laman
  rationale: Pinananatili ang sadyang malawak at teolohikal na mabigat na katawagan ni Pablo sa halip na agad itong ipakahulugan bilang “makasalanang kalikasan.” Nililinaw sa talababa ang diwang higit sa pisikal na katawan.
- source_word: διὰ τῆς ἀγάπης
  choice: sa pamamagitan ng pag-ibig
  rationale: 'Pinananatili nito ang instrumental na diwa ng διά na may genitive: ang pag-ibig ang paraan o daluyan ng paglilingkod.'
- source_word: δουλεύετε
  choice: maglingkod kayo
  rationale: Natural ito sa makabagong Tagalog para sa utos na may kapwa bilang tinutukoy. Nililinaw sa talababa ang mas matinding larawan ng paglilingkod bilang alipin na taglay ng pandiwang Griyego.
- source_word: ἀλλήλοις
  choice: sa isa’t isa
  rationale: Karaniwan at malinaw na salin ng panghalip na nagsasaad ng gantihang ugnayan.
theological_decisions:
- issue: Saklaw ng ἀδελφοί bilang tawag sa kapulungan
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, ginagamit ito rito bilang tawag sa buong komunidad ng mga mananampalataya. Ang “mga kapatid” sa Tagalog ay parehong tapat sa larawang pampamilya at likas na maaaring tumukoy sa mga babae at lalaki.
- issue: Kahulugan ng σάρξ sa kontekstong etikal ni Pablo
  choice: laman
  alternative: makasalanang kalikasan
  rationale: Hindi lamang pisikal na katawan ang tinutukoy, ngunit ang pagpapalit nito sa “makasalanang kalikasan” ay magsasara sa mas malawak at sadyang tensiyonadong gamit ni Pablo. Kaya pinanatili ang “laman” at ipinaliwanag ang diwa sa talababa.
- issue: Lakas ng larawang alipin sa δουλεύετε
  choice: maglingkod kayo sa isa’t isa
  alternative: magpaalipin kayo sa isa’t isa
  rationale: Taglay ng pandiwa ang larawan ng paglilingkod bilang alipin, ngunit ang “magpaalipin” ay maaaring magpahiwatig sa Tagalog ng di-boluntaryong pang-aapi o maling uri ng pagsuko. Ang pangunahing teksto ay gumagamit ng likas na “maglingkod,” habang pinananatili ng talababa ang retorikal na lakas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang “sa halip” upang maging likas ang matinding pagsalungat ng ἀλλά, at hinati sa dalawang pangungusap para sa madaling pagbasa nang hindi binabago ang daloy ng argumento. Pinanatili ang “laman” bilang mahalagang katawagan ni Pablo at inilagay sa talababa ang kinakailangang paglilinaw.
