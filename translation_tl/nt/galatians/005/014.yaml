  text: ὁ γὰρ πᾶς νόμος ἐν ἑνὶ λόγῳ ⸀πεπλήρωται, ἐν τῷ· Ἀγαπήσεις τὸν πλησίον σου ὡς ⸀σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/014.yaml
  text: 'For the whole law is fulfilled in one statement: “You shall love your neighbor as yourself.”[a][b]'
translation:
  language: tl
  text: 'Sapagkat ang buong Kautusan ay natutupad[a] sa iisang pahayag[b]: “Ibigin mo ang iyong kapwa gaya ng iyong sarili.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “natutupad” ay maaari ring isaling “natupad na.” Sa kontekstong ito, maaari rin itong maunawaang “nabubuod,” ngunit mas literal na ipinahahayag ng pandiwang Griyego na nararating ng Kautusan ang katuparan nito sa utos na ito.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “sa iisang salita” o “sa iisang kasabihan.” Ang Griyego ay literal na “sa isang salita/pahayag,” na rito ay tumutukoy sa iisang utos na sinipi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag o batayan para sa naunang panghihikayat; natural at marangal sa Filipino ang “Sapagkat.”
- source_word: πᾶς νόμος
  choice: ang buong Kautusan
  rationale: Tinutukoy ng parirala ang Kautusan bilang isang kabuuan. Ginamit ang malaking titik upang malinaw na tumukoy sa Kautusan sa Kasulatan, hindi lamang sa batas sa pangkalahatan.
- source_word: ἐν ἑνὶ λόγῳ
  choice: sa iisang pahayag
  rationale: Maaaring mangahulugan ang λόγος ng salita, pahayag, o kasabihan. Dahil isang buong utos ang kasunod, mas malinaw ang “pahayag” kaysa literal na “salita.”
- source_word: πεπλήρωται
  choice: ay natutupad
  rationale: Pinananatili nito ang diwang pasibo ng πληρόω at ang ideyang nararating ng buong Kautusan ang katuparan nito sa utos na ito, nang hindi ito pinapahina tungo sa simpleng pagbubuod lamang.
- source_word: Ἀγαπήσεις
  choice: Ibigin mo
  rationale: Ang anyong panghinaharap sa sipi mula sa Levitico 19:18 ay gumaganap bilang utos. Ang “Ibigin mo” ay natural, tuwiran, at may dignidad sa makabagong Filipino.
- source_word: τὸν πλησίον σου
  choice: ang iyong kapwa
  rationale: Sa kontekstong etikal, ang πλησίον ay tumutukoy sa kapwa o neighbor. Ang “kapwa” ang pinakanatural at malawak na salin sa Filipino.
- source_word: ὡς σεαυτόν
  choice: gaya ng iyong sarili
  rationale: Tumpak nitong pinananatili ang paghahambing na ipinahahayag ng ὡς.
theological_decisions:
- issue: Ang kaugnayan ng buong Kautusan sa utos ng pag-ibig
  choice: Sinasabi ni Pablo na natutupad ang buong Kautusan sa utos na ibigin ang kapwa.
  alternative: Maaaring unawain na ang buong Kautusan ay nabubuod lamang sa utos na ito.
  rationale: Mas tuwirang ipinapahayag ng πληρόω ang katuparan kaysa simpleng pagbubuod. Gayunman, hindi pinalalawak ng salin ang pahayag upang magpasya tungkol sa pag-aalis ng Kautusan, at hindi rin nililimitahan ang “Kautusan” sa mga bahaging etikal lamang sapagkat walang gayong tahasang paglilimita sa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kautusan” bilang pamilyar na katawagan sa Torah at ang “kapwa” bilang natural na katumbas ng πλησίον. Ang mga talababa ay nakapuwesto kaagad sa bahaging nililinaw ng bawat isa.
