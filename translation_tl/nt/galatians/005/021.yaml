  text: ⸀φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν ⸀καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες βασιλείαν θεοῦ οὐ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/021.yaml
  text: envy[a], drunkenness, carousing, and things like these, about which I warn you, just as I warned before, that those who practice such things will not inherit the kingdom of God.
translation:
  language: tl
  text: 'inggit, paglalasing, magulong pagsasaya, at mga katulad nito. Binabalaan ko kayo tungkol sa mga ito, gaya ng ibinabala ko noon: ang mga gumagawa ng gayong mga bagay ay hindi magmamana ng kaharian ng Diyos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνοι
  choice: mga inggit
  rationale: Ipinapanatili ang anyong maramihan at tumutukoy sa sama ng loob o paghahangad laban sa kabutihang tinatamasa ng iba.
- source_word: μέθαι
  choice: paglalasing
  rationale: Likas at malinaw na katawagan sa labis na pag-inom na humahantong sa pagkalasing; ang anyong may pag-uulit ay angkop sa mga pagkakataon o gawi ng paglalasing.
- source_word: κῶμοι
  choice: magulong pagsasaya
  rationale: Inihahayag ang maingay, walang-pigil, at labis na kasayahang madalas kaugnay ng pag-inom, nang hindi nililimitahan ang salita sa seksuwal na kahulugan.
- source_word: τὰ ὅμοια τούτοις
  choice: iba pang tulad ng mga ito
  rationale: 'Pinananatili ang bukas na saklaw ng talaan: hindi lamang ang tahasang binanggit ang tinutukoy.'
- source_word: ἃ προλέγω ὑμῖν
  choice: Binabalaan ko kayo tungkol sa mga ito
  rationale: Sa kontekstong mapagpaalaala, ang προλέγω ay may puwersang magbabala, hindi lamang magsabi nang maaga.
- source_word: καθὼς προεῖπον
  choice: gaya ng ibinabala ko na noon
  rationale: Ipinakikita ang nauna nang babala at pinananatili ang pag-uugnay sa kaparehong pandiwa.
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: ang mga namumuhay sa paggawa ng gayong mga bagay
  rationale: Ipinahahayag ang katangi-tangi o patuloy na pamumuhay na ipinahihiwatig ng pangkasalukuyang participle, nang hindi ito gawing tahasang doktrinal na paliwanag.
- source_word: βασιλείαν θεοῦ
  choice: kaharian ng Diyos
  rationale: Karaniwan, malinaw, at teolohikal na tapat na salin ng parirala.
- source_word: οὐ κληρονομήσουσιν
  choice: ay hindi magmamana
  rationale: Tuwirang pinananatili ang hinaharap at ang larawan ng pagtanggap ng mana.
theological_decisions:
- issue: Kung ang babala ay tumutukoy sa minsanang pagkakasala o sa kinagawiang paraan ng pamumuhay
  choice: ang mga namumuhay sa paggawa ng gayong mga bagay
  alternative: ang mga gumagawa ng gayong mga bagay
  rationale: Ang present participle πράσσοντες sa ganitong talaan ng mga bisyo ay likas na tumutukoy sa katangi-tangi o patuloy na gawain. Pinananatili nito ang bigat ng babala nang hindi humahatol tungkol sa bawat hiwalay na pagkadapa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “magulong pagsasaya” bilang madaling maunawaang salin ng κῶμοι na naghahatid ng labis at walang-pigil na pagdiriwang nang hindi nagpapahiwatig na kinakailangang seksuwal ang gawain. Walang talababa dahil sapat na naihahayag sa teksto ang saklaw ng salita.
