id: GAL.5.11
reference: Galatians 5:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, τί ἔτι διώκομαι; ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/011.yaml
  text: But I[a], brothers, if I am still preaching circumcision[b], why am I still being persecuted? Then the offense of the cross has been removed.
translation:
  language: tl
  text: Ngunit ako naman, mga kapatid[a], kung ipinangangaral ko pa rin ang pagtutuli, bakit inuusig pa rin ako? Kung gayon, naalis na ang katitisuran ng krus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na isinaling “mga kapatid” ay nasa anyong panlalaki ngunit maaari itong tumukoy sa magkakahalong pangkat ng mga lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: O “ang ikinagagalit dahil sa krus.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Likas at marangal na tawag sa Tagalog para sa pangmaramihang ἀδελφοί. Maaari itong tumukoy sa mga lalaki at babae, gaya ng gamit ng salita sa kongregasyon.
- source_word: περιτομήν
  choice: pagtutuli
  rationale: Direkta at karaniwang katumbas ng περιτομή; pinananatili nito ang pagtukoy sa gawaing panrelihiyon nang hindi dinaragdagan ang paliwanag sa mismong talata.
- source_word: ἔτι
  choice: pa rin
  rationale: Inulit upang mapanatili ang temporal at lohikal na diin ng dalawang paglitaw ng ἔτι.
- source_word: κηρύσσω
  choice: ipinangangaral ko
  rationale: Ipinahahayag ang patuloy at hayagang pagpapahayag na taglay ng kasalukuyang panahunan ng κηρύσσω.
- source_word: διώκομαι
  choice: inuusig ... ako
  rationale: Malinaw na ipinapakita ang pasibong pag-uusig at ang mapanlabang konteksto.
- source_word: ἄρα
  choice: Kung gayon
  rationale: Natural na panandang panghinuha sa Filipino na malinaw na nag-uugnay sa konklusyon sa naunang kondisyon.
- source_word: κατήργηται
  choice: naalis na
  rationale: 'Ipinahahayag ang perpektong pasibo at ang resultang kalagayan: ang katitisuran ay hindi na umiiral o gumagana bilang gayon.'
- source_word: σκάνδαλον
  choice: katitisuran
  rationale: Pinananatili ang konkretong larawan ng isang sanhi ng pagkatisod at ang mas malawak na diwa ng bagay na nagdudulot ng pagtanggi o pagkagalit.
- source_word: σταυροῦ
  choice: krus
  rationale: Karaniwan at tuwirang katumbas ng σταυρός sa kontekstong Paulino.
theological_decisions:
- issue: Saklaw ng ἀδελφοί sa pagtawag sa kongregasyon
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae
  rationale: Ang “mga kapatid” ay natural na panlahatang tawag sa modernong Filipino at hindi kinakailangang limitahan sa mga lalaki; nililinaw ng talababa ang anyong Griyego at posibleng saklaw nito.
- issue: Diwa ng σκάνδαλον τοῦ σταυροῦ
  choice: ang katitisuran ng krus
  alternative: ang ikinagagalit o ikinasasama ng loob dahil sa krus
  rationale: 'Ang “katitisuran” ay nagpapanatili sa talinghaga at sa teolohikal na tensiyon: ang krus ay nagiging sanhi ng pagkatisod, pagtanggi, o pagkagalit. Hindi nito nililimitahan ang salita sa isa lamang sa mga magkakaugnay na diwa.'
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang retorikal na tanong, ang dalawang “pa rin,” at ang panghinuha ng huling pangungusap. Inilagay ang mga talababa sa mismong mga pariralang nililinaw ng mga ito.
