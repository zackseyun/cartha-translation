  text: A little leaven leavens the whole batch of dough[a].
translation:
  language: tl
  text: Ang kaunting lebadura ay nagpapaalsa sa buong masa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang kaunting pampaalsa ay nagpapaalsa sa buong masa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μικρὰ
  choice: kaunting
  rationale: Ipinahihiwatig dito ang maliit na dami, hindi lamang ang maliit na sukat; natural din ito sa maikling kasabihan sa Filipino.
- source_word: ζύμη
  choice: pampaalsa
  rationale: Tumutukoy ito sa sangkap na nagpapaalsa o nagpapaasim sa masa. Mas malinaw sa karaniwang mambabasa ang “pampaalsa” kaysa sa teknikal o makitid na “lebadura,” habang nananatili ang konkretong larawan.
- source_word: ὅλον
  choice: buong
  rationale: Tuwirang ipinapahayag ang ganap na lawak ng epekto sa iisang masa.
- source_word: φύραμα
  choice: masa ng minasa
  rationale: Tumutukoy sa nahalong o namasang harina. Pinananatili ng parirala ang larawan ng paggawa ng tinapay at iniiwasan ang malabong literal na “bukol.”
- source_word: ζυμοῖ
  choice: nagpapaalsa
  rationale: Tuwirang inilalarawan ang ginagawa ng pampaalsa sa masa at pinananatili ang maikli at matalinghagang anyo ng kasabihan.
theological_decisions:
- issue: Matalinghagang bisa ng kasabihan
  choice: Panatilihin ang konkretong larawan ng pampaalsa at masa nang hindi tahasang tinutukoy ang aplikasyon nito.
  alternative: Ang kaunting maling turo ay kumakalat sa buong pamayanan.
  rationale: Kasabihan mismo ang nakasaad sa talata. Bagaman ipinahihiwatig ng konteksto ang mapaminsalang impluwensiya, ang paglalahad nito nang tahasan ay magdaragdag ng interpretasyon sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na maikli, marangal, at madaling maunawaan. Pinanatili ang anyong kasabihan at ang pag-uulit na pampaalsa/nagpapaalsa, na tumutugma sa ugnayang ζύμη/ζυμοῖ sa Griyego.
