revisions:
- from: Ang kaunting pampaalsa ay nagpapaalsa sa buong masa ng minasa.[a]
  to: Ang kaunting lebadura ay nagpapaalsa sa buong masa.[a]
  rationale: Pinalitan ang hindi likas na “masa ng minasa” ng “masa,” at ginawang “lebadura” ang pangunahing katumbas ng ζύμη upang maging mas tiyak sa fermenting agent. Napanatili ang maigsi at matalinghagang anyo ng Griyegong kasabihan, kabilang ang ugnayan ng lebadura at pagpapaalsa, nang hindi ipinapaliwanag ang ipinahihiwatig nitong aplikasyon.
