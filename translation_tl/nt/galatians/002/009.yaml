id: GAL.2.9
reference: Galatians 2:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ γνόντες τὴν χάριν τὴν δοθεῖσάν μοι, Ἰάκωβος καὶ Κηφᾶς καὶ Ἰωάννης, οἱ δοκοῦντες στῦλοι εἶναι, δεξιὰς ἔδωκαν ἐμοὶ καὶ Βαρναβᾷ κοινωνίας, ἵνα ⸀ἡμεῖς εἰς τὰ ἔθνη, αὐτοὶ δὲ εἰς τὴν περιτομήν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/009.yaml
  text: and recognizing the grace that had been given to me[a], James and Cephas and John, who were regarded as pillars, gave to Barnabas and me the right hands of fellowship[c][b], so that we would go to the Gentiles and they to the circumcised.
translation:
  language: tl
  text: At nang makilala nila ang biyayang ibinigay sa akin, sina Santiago, Cefas[a], at Juan—na kinikilalang mga haligi—ay nag-abot kina Bernabe at sa akin ng kanilang mga kanang kamay bilang tanda ng pakikiisa. Ginawa nila ito upang kami ay pumunta sa mga Hentil[b], at sila naman sa mga tuli.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Cefas ay isa pang pangalan ni Pedro.
    reason: name_clarification
  - marker: b
    text: O “mga bansa”; dito, tumutukoy ito sa mga hindi Judio.
    reason: lexical_alternative
  - marker: c
    text: Literal na “sa pagtutuli,” isang katawagan dito para sa mga Judio.
    reason: lexical_clarification
lexical_decisions:
- source_word: γνόντες
  choice: nang makilala nila
  rationale: Ipinahahayag ng aorist participle ang pagkilala na naging batayan ng sumunod na pagkilos; natural sa Tagalog ang “nang makilala nila” at saklaw nito ang pagkaunawa at pagkilala.
- source_word: χάριν
  choice: biyaya
  rationale: Pinananatili ang malawak at mahalagang kahulugan ng banal na biyaya sa pagkatawag at paglilingkod ni Pablo, sa halip na paliitin ito bilang atas lamang.
- source_word: δοθεῖσάν μοι
  choice: ibinigay sa akin
  rationale: Malinaw na ipinahahayag ng pasibong anyo na tinanggap ni Pablo ang biyaya bago ang pagkilalang inilalarawan sa talata.
- source_word: Κηφᾶς
  choice: Cefas
  rationale: Tinutumbasan ang mismong pangalang nasa tekstong Griyego sa halip na palitan ito ng mas pamilyar na pangalang Pedro.
- source_word: οἱ δοκοῦντες στῦλοι εἶναι
  choice: na kinikilalang mga haligi
  rationale: Ipinapakita nito ang kanilang kinikilalang katayuan nang hindi ipinahihiwatig na minamaliit ni Pablo ang katayuang iyon.
- source_word: δεξιὰς ... κοινωνίας
  choice: iniabot ... ang kani-kanilang kanang kamay bilang tanda ng pakikiisa
  rationale: Pinananatili ang maramihang “mga kanang kamay” sa natural na anyong Tagalog at ipinakikita na ang kilos ay tanda ng pagkilala, kasunduan, at pakikibahagi sa iisang gawain.
- source_word: ἔθνη
  choice: mga Hentil
  rationale: Sa konteksto ng Galacia, tumutukoy ito sa mga taong hindi Judio, hindi pangunahin sa mga bansang pampolitika.
- source_word: περιτομήν
  choice: mga tuli
  rationale: Pinananatili ang metonimikong pagtukoy ng teksto sa mga Judio habang nananatiling malinaw at maikli sa Tagalog.
theological_decisions:
- issue: Kung ang κοινωνίας ay isasalin bilang pangkalahatang pakikisama o bilang pakikipagtulungan sa misyon
  choice: pakikiisa
  alternative: pakikipagtulungan
  rationale: Ang “pakikiisa” ay sapat na malawak upang saklawin ang pagkakaugnay, pagkilala, at magkatuwang na misyon nang hindi nililimitahan ang κοινωνία sa isang administratibong kasunduan lamang.
- issue: Kung tahasang idaragdag ang pandiwang hindi inuulit sa pariralang αὐτοὶ δὲ εἰς τὴν περιτομήν
  choice: at sila naman sa mga tuli
  alternative: at sila naman ay pumunta sa mga tuli
  rationale: Ang pandiwang “pumunta” mula sa unang sugnay ay likas na nauunawaan sa ikalawa; pinananatili ng maikling anyo ang paralelismo at elipsis ng Griyego nang hindi nagiging malabo sa Tagalog.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang “sa amin ni Bernabe” ay natural na ayos sa Tagalog para kina Pablo at Bernabe. Ang gitling na pahaba ay naghihiwalay sa paliwanag tungkol sa kinikilalang katayuan nina Santiago, Cefas, at Juan. Hinati sa dalawang pangungusap ang mahabang Griyegong pangungusap upang maging malinaw sa karaniwang mambabasa nang hindi binabago ang lohikal na ugnayan.
