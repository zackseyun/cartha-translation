translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “dukha” bilang malinaw at marangal na tawag, at pinanatili ang unang panauhang maramihan sa kahilingan ngunit isahan sa personal na pagsisikap ni Pablo.
