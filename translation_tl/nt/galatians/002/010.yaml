translation:
  language: tl
  text: Ang tanging hiling nila ay alalahanin namin ang mga dukha—at iyon mismo ang pinagsikapan kong gawin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: Ang tanging hiling nila ay
  rationale: Ipinakikita ng μόνον na ito ang nag-iisang kahilingang kalakip ng napagkasunduan. Idinagdag ang “hiling nila” upang likas na maipahayag sa Filipino ang eliptikong Griyego nang hindi binabago ang diwa.
- source_word: τῶν πτωχῶν
  choice: ang mga dukha
  rationale: Karaniwang tumutukoy ang πτωχός sa mga taong salat sa materyal na pangangailangan; ang “mga dukha” ay malinaw, marangal, at angkop sa konteksto ng praktikal na pagkalinga.
- source_word: ἵνα μνημονεύωμεν
  choice: alalahanin namin
  rationale: Ang ἵνα ay nagpapahayag ng nilalaman ng kahilingan, at ang μνημονεύωμεν ay unang panauhang maramihan. Pinananatili ng “alalahanin namin” ang pahiwatig ng patuloy at aktibong malasakit nang hindi ito labis na ipinapaliwanag.
- source_word: ὃ καί
  choice: na siya ring
  rationale: Ang panghalip na ὃ ay tumutukoy sa buong naunang kahilingan, habang ang καί ay nag-uugnay at nagbibigay-diin na iyon din ang hangarin ni Pablo.
- source_word: ἐσπούδασα
  choice: talagang pinagsikapan kong
  rationale: Ipinahihiwatig ng σπουδάζω ang masigasig na hangarin na may kasamang pagsisikap. Sinasaklaw ng “pinagsikapan” ang praktikal na pagkilos, at ng “talagang” ang diin ng pahayag.
- source_word: αὐτὸ τοῦτο ποιῆσαι
  choice: gawin
  rationale: Ang αὐτὸ τοῦτο ay masidhing tumutukoy sa mismong bagay na nabanggit. Sa Filipino, ang diin nito ay likas na naihahatid ng “siya ring talagang,” kaya sapat at hindi mabigat ang pangwakas na “gawin.”
