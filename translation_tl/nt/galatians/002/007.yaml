  text: ἀλλὰ τοὐναντίον ἰδόντες ὅτι πεπίστευμαι τὸ εὐαγγέλιον τῆς ἀκροβυστίας καθὼς Πέτρος τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/007.yaml
  text: But on the contrary[a], when they saw that I had been entrusted with the gospel for the uncircumcised, just as Peter had been for the circumcised,
translation:
  language: tl
  text: Ngunit sa kabaligtaran, nang makita nilang ipinagkatiwala sa akin ang ebanghelyo para sa mga hindi tuli, kung paanong ipinagkatiwala naman kay Pedro ang ebanghelyo para sa mga tuli,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang ebanghelyo ng di-pagtutuli … ng pagtutuli,” ibig sabihin, ang ebanghelyong ipinagkatiwala para sa mga pangkat na iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ τοὐναντίον
  choice: Sa halip
  rationale: Natural na Filipino itong nagpapahayag ng mariing pagsalungat sa naunang ideya; iniiwasan ang mabigat at di-likas na dobleng panandang “Ngunit sa kabaligtaran.”
- source_word: ἰδόντες
  choice: nang makita nila
  rationale: Isinasalin ang aorist participle bilang sugnay na pangyayari, malinaw at natural sa Filipino.
- source_word: πεπίστευμαι
  choice: ipinagkatiwala sa akin
  rationale: Ipinahahayag ng perfect passive ang pagkakatiwala ng isang tungkulin o pananagutan kay Pablo, na may nananatiling bisa.
- source_word: τὸ εὐαγγέλιον
  choice: ang ebanghelyo
  rationale: Karaniwan at may dignidad na terminong Filipino para sa εὐαγγέλιον sa kontekstong Paulino.
- source_word: τῆς ἀκροβυστίας
  choice: para sa mga hindi tuli
  rationale: Ginagawang malinaw ang tinutukoy na pangkat habang pinananatili ang mismong panandang ginamit ng Griyego, sa halip na agad itong ipakahulugang “mga Hentil.”
- source_word: καθὼς
  choice: kung paanong
  rationale: Malinaw na ipinakikita ang paghahambing ng pagkakatiwalang ibinigay kina Pablo at Pedro.
- source_word: Πέτρος
  choice: Pedro
  rationale: Ginagamit ang nakaugaliang anyo ng pangalan sa Bibliyang Filipino.
- source_word: τῆς περιτομῆς
  choice: para sa mga tuli
  rationale: Tumutugma sa “mga hindi tuli” at pinananatili ang panandang tipan-etniko ng orihinal sa halip na gawing “mga Judio.”
- source_word: ellipsis after Πέτρος τῆς περιτομῆς
  choice: ang para sa
  rationale: Natural na pinupunan sa Filipino ang ipinahiwatig na pag-uulit ng ebanghelyong ipinagkatiwala, nang hindi nagdaragdag ng bagong konsepto.
theological_decisions:
- issue: Kung isasalin ang ἀκροβυστία / περιτομή bilang mga katawagang etniko o bilang mga panandang mismong ginamit sa Griyego
  choice: mga hindi tuli / mga tuli
  alternative: mga Hentil / mga Judio; di-pagtutuli / pagtutuli
  rationale: Pinananatili nito ang balangkas ni Pablo na nakabatay sa kalagayan kaugnay ng pagtutuli, nang hindi tahimik na pinapantay ang mga termino sa mas malawak na katawagang etniko.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “ebanghelyo” bilang pamilyar na terminong teolohikal, at pinanatili ang “mga hindi tuli / mga tuli” upang hindi mawala ang tiyak na pananalita at tensiyong pangtipan ng Griyego.
