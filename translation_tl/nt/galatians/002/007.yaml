    rationale: Bagaman pinupunan nito ang ellipsis, hindi nito tahasang sinasabi kung ano ang ‘para sa’ mga tuli. Ang pag-uulit ng ‘ipinagkatiwala ... ang ebanghelyo’ ay likas sa Filipino at hindi nagdaragdag ng konsepto.
