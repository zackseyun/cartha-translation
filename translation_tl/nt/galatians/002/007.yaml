  naturalness: Natural at marangal sa modernong Filipino ang “Ngunit sa kabaligtaran.” Mas malinaw at mas buo ang ikalawang bahagi kapag inuulit ang pandiwang “ipinagkatiwala,” sa halip na “kay Pedro naman ang para sa mga tuli.”
  terminology: Ang “ebanghelyo,” “mga hindi tuli,” at “mga tuli” ay angkop at tapat sa terminolohiyang Griyego. Pinananatili ng mga ito ang panandang ginamit sa teksto nang hindi ito ginagawang interpretibong “mga Hentil” at “mga Judio.”
