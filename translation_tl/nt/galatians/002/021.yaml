id: GAL.2.21
reference: Galatians 2:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ· εἰ γὰρ διὰ νόμου δικαιοσύνη, ἄρα Χριστὸς δωρεὰν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/021.yaml
  text: I do not nullify the grace of God[a], for if righteousness comes through the law[c][b], then Messiah died for nothing.
translation:
  language: tl
  text: Hindi ko pinawawalang-bisa ang biyaya ng Diyos. Sapagkat kung ang katuwiran[a] ay sa pamamagitan ng Kautusan, namatay ang Mesiyas[b] nang walang kabuluhan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagiging matuwid”; maaari ring mangahulugang “katarungan” ang salitang Griego sa ibang konteksto.
    reason: lexical_alternative
  - marker: b
    text: 'Griego: Christos, isang titulong nangangahulugang “Mesiyas.”'
    reason: lexical_alternative
  - marker: c
    text: O “nang walang dahilan” o “nang walang saysay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶ
  choice: pinawawalang-bisa
  rationale: Ipinahahayag nito ang pagpapawalang-saysay o pagpapawalang-bisa sa isang bagay, na angkop sa argumento ni Pablo.
- source_word: χάριν
  choice: biyaya
  rationale: Ito ang natural at kinikilalang salin para sa mapagkaloob na pabor ng Diyos sa kontekstong ito.
- source_word: διὰ νόμου
  choice: sa pamamagitan ng Kautusan
  rationale: Pinananatili nito ang instrumental na diwa ng διά at ang pagtukoy sa Kautusan sa argumento ng Galacia.
- source_word: δικαιοσύνη
  choice: katuwiran
  rationale: Pinananatili ng “katuwiran” ang malawak na diwang Paulino ng pagiging matuwid o wastong katayuan nang hindi pinalalawak ang ipinahihiwatig na pandiwa sa Griego.
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulo; malinaw na ipinahahayag ng “Mesiyas” ang kahulugan nito sa makabagong Filipino.
- source_word: δωρεὰν
  choice: nang walang kabuluhan
  rationale: Sa kondisyunal na argumento, ipinahahayag nito na magiging walang saysay o walang pakinabang ang kamatayan ng Mesiyas.
theological_decisions:
- issue: Ang kaugnayan ng δικαιοσύνη sa Kautusan
  choice: Kung ang katuwiran ay sa pamamagitan ng Kautusan, walang kabuluhan ang kamatayan ng Mesiyas.
  alternative: Maaaring unawain ang δικαιοσύνη bilang “pagiging matuwid” o, sa ibang konteksto, “katarungan.”
  rationale: Pinananatili ng salin ang maikli at kondisyunal na pangangatwiran ni Pablo at hindi nito idinaragdag kung eksaktong paano matatamo ang katuwiran o kung anong saklaw ng Kautusan ang tinutukoy.
- issue: Diwa ng δωρεὰν
  choice: nang walang kabuluhan
  alternative: nang walang dahilan
  rationale: Mas angkop sa konteksto ang diwa ng pagiging walang saysay, ngunit nananatiling posible sa salita ang diwa ng “walang dahilan,” kaya inilagay ito sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Kautusan” bilang pantanging katawagan sa kontekstong Paulino, at pinanatili ang nominal na anyo ng kondisyunal na sugnay upang hindi dagdagan ang elipsis ng Griego.
