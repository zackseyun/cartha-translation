  text: ὁ γὰρ ἐνεργήσας Πέτρῳ εἰς ἀποστολὴν τῆς περιτομῆς ἐνήργησεν καὶ ἐμοὶ εἰς τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/008.yaml
  text: For the one who worked through Peter for apostleship to the circumcised also worked through me for the Gentiles[b][a],
translation:
  language: tl
  text: Sapagkat ang kumilos sa pamamagitan ni Pedro para sa pagkaapostol sa mga tuli[a] ay kumilos din sa pamamagitan ko para sa mga Hentil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “para sa pagkaapostol ng pagtutuli.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “para sa mga bansa,” na sa kontekstong ito ay tumutukoy sa mga hindi Judio.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεργήσας / ἐνήργησεν
  choice: kumilos / ay kumilos
  rationale: Pinananatili ang pag-uulit ng magkaugnay na anyo ng iisang pandiwa at hindi ipinapakahulugan nang labis ang paraan ng pagkilos ng Diyos.
- source_word: Πέτρῳ / ἐμοὶ
  choice: sa pamamagitan ni Pedro / sa pamamagitan ko
  rationale: 'Itinuturing na instrumental ang mga datibo: kumilos ang ipinahihiwatig na banal na tagaganap sa pamamagitan nina Pedro at Pablo sa kanilang paglilingkod.'
- source_word: εἰς ἀποστολὴν
  choice: para sa pagiging apostol
  rationale: Natural sa modernong Tagalog at pinananatili ang diwa ng apostolikong katungkulan o gawain nang hindi dinaragdagan ng salitang wala sa Griyego.
- source_word: τῆς περιτομῆς
  choice: sa mga tuli
  rationale: Metonimikong tumutukoy sa mga Judio bilang bayan ng pagtutuli at malinaw na itinatapat sa mga Hentil.
- source_word: τὰ ἔθνη
  choice: mga Hentil
  rationale: Sa konteksto ni Pablo, tumutukoy ito sa mga taong hindi Judio; pinananatili rin ang malinaw na kaibahan sa mga tuli.
theological_decisions:
- issue: Kung tahasang papangalanang Diyos ang paksa
  choice: ang kumilos
  alternative: ang Diyos na kumilos
  rationale: Ang Griyego ay may articular participle, ὁ ἐνεργήσας, na literal na “ang kumilos.” Hindi tahasang idinaragdag ang “Diyos,” kaya napapanatili ang anyo at ipinahihiwatig na banal na paksa ng orihinal.
- issue: Kung ang datibo ay “sa loob ni” o “sa pamamagitan ni”
  choice: sa pamamagitan ni Pedro / sa pamamagitan ko
  alternative: kay Pedro / sa akin
  rationale: Sa konteksto ng magkatapat na apostolikong gawain, pinakamalinaw ang instrumental na diwa, ngunit hindi nito tinutukoy nang higit sa teksto kung paano naganap ang banal na pagkilos.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “pagiging apostol” upang mapanatili ang pangngalang ἀποστολή, at “mga tuli”/“mga Hentil” upang malinaw ang paralelismo. Ang mga marker na [a] at [b] ay nasa pangunahing teksto.
