id: GAL.2.20
reference: Galatians 2:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός· ὃ δὲ νῦν ζῶ ἐν σαρκί, ἐν πίστει ζῶ τῇ τοῦ ⸂υἱοῦ τοῦ θεοῦ⸃ τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/020.yaml
  text: And it is no longer I who live[a], but Messiah lives in me. And the life that I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself for me.
translation:
  language: tl
  text: At hindi na ako ang nabubuhay, kundi ang Mesiyas ang nabubuhay sa akin. At ang buhay na ikinabubuhay ko ngayon sa laman ay ikinabubuhay ko sa pamamagitan ng pananampalataya sa Anak ng Diyos[a], na umibig sa akin at nagbigay ng kanyang sarili para sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa pamamagitan ng katapatan ng Anak ng Diyos.”
    reason: Pinananatili ang alternatibong subjective-genitive na pagbasa ng πίστει τῇ τοῦ υἱοῦ τοῦ θεοῦ.
lexical_decisions:
- source_word: Χριστός
  choice: ang Mesiyas
  rationale: Isinalin ang titulong Χριστός bilang “Mesiyas” upang maipahayag ang kahulugan nito bilang titulong mesiyaniko, sa halip na basta hiraming “Cristo.”
- source_word: ὃ δὲ νῦν ζῶ
  choice: ang buhay na ikinabubuhay ko ngayon
  rationale: Elliptical ang konstruksiyon sa Griyego; likas sa Tagalog na ilantad ang ipinahihiwatig na “buhay” nang hindi nagdaragdag ng bagong interpretasyon.
- source_word: ἐν σαρκί
  choice: sa laman
  rationale: Pinananatili ang mahalagang terminong Paulino at ang diwa ng kasalukuyang buhay na nasa pisikal at makalupang kalagayan; hindi ito isinaling “makasalanang kalikasan,” na magiging sobrang interpretatibo rito.
- source_word: πίστει
  choice: pananampalataya
  rationale: Ang “pananampalataya” ang tuwirang at karaniwang salin; pinananatili sa talababa ang posibleng kahulugang “katapatan” dahil sa hindi tiyak na ugnayan ng kasunod na genitive.
- source_word: τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: sa Anak ng Diyos
  rationale: Sa pangunahing teksto, binasa ang genitive bilang layon ng pananampalataya—“pananampalataya sa Anak ng Diyos”—na malinaw at likas sa Tagalog, habang inilalahad sa talababa ang tunay na alternatibong pagbasa.
- source_word: παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ
  choice: nagbigay ng kanyang sarili para sa akin
  rationale: Likas at marangal itong pagpapahayag sa Tagalog ng kusang pagsasakripisyo at pagbibigay ng sarili; iniiwasan ang mas mekanikal na “ibinigay ang sarili sa kamay ng iba.”
theological_decisions:
- issue: Kahulugan ng πίστις kasama ng genitive sa τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: sa pamamagitan ng pananampalataya sa Anak ng Diyos
  alternative: sa pamamagitan ng katapatan ng Anak ng Diyos
  rationale: Maaaring unawain ang genitive bilang objective (“pananampalataya sa Anak”) o subjective (“katapatan ng Anak”). Ginamit sa pangunahing teksto ang mas madaling maunawaang objective reading, ngunit pinanatili sa talababa ang subjective reading upang hindi burahin ang tunay na sintaktiko at teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “laman” bilang terminong Paulino, at ginamit ang “Mesiyas” bilang salin ng titulo. Ang bahagyang pag-uulit ng “ikinabubuhay” ay sumasalamin sa diin ng ζῶ sa Griyego habang nananatiling mauunawaan sa Tagalog.
