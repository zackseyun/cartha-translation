  text: καὶ συνυπεκρίθησαν αὐτῷ ⸀καὶ οἱ λοιποὶ Ἰουδαῖοι, ὥστε καὶ Βαρναβᾶς συναπήχθη αὐτῶν τῇ ὑποκρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/013.yaml
  text: And the rest of the Jews also joined him in hypocrisy[b][a], so that even Barnabas was carried away by their hypocrisy.
translation:
  language: tl
  text: Nakiisa rin sa kanya sa pagkukunwari ang iba pang mga Judio, kaya maging si Bernabe ay natangay ng kanilang pagkukunwari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνυπεκρίθησαν
  choice: nakiisa ... sa pagkukunwari
  rationale: Ipinahihiwatig ng pandiwang may σύν- ang sama-samang pakikibahagi sa mapagkunwaring asal; malinaw at natural itong naipapahayag ng “nakiisa ... sa pagkukunwari.”
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Ang datibo ay nagpapakita ng pakikiugnay sa kilos ni Pedro; pinananatili ng “sa kanya” ang kaugnayang iyon nang hindi inuulit ang pangalan mula sa konteksto.
- source_word: οἱ λοιποὶ Ἰουδαῖοι
  choice: ang iba pang mga Judio
  rationale: Tumutukoy ang λοιποί sa natitirang mga kabilang sa pangkat na tinatalakay. Ang “iba pang” ay likas sa modernong Filipino at hindi nagpapahiwatig na mga taga-Judea lamang sila.
- source_word: συναπήχθη
  choice: natangay
  rationale: Pinananatili ng “natangay” ang diwang pasibo ng pagiging nahila ng impluwensiya at panggigipit ng pangkat.
- source_word: ὑποκρίσει
  choice: pagkukunwari
  rationale: Tuwirang inilalarawan nito ang hindi pagtutugma ng ipinakikitang asal at tunay na paninindigan. Ang pag-uulit sa Filipino ay nagpapanatili sa diin ni Pablo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang “Judio,” ang karaniwang katawagang etniko-relihiyoso sa kontekstong ito, at pinanatili ang dalawang pagbanggit sa “pagkukunwari” upang masalamin ang retorikal na diin ng Griyego.
