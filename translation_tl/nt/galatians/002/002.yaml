id: GAL.2.2
reference: Galatians 2:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀνέβην δὲ κατὰ ἀποκάλυψιν· καὶ ἀνεθέμην αὐτοῖς τὸ εὐαγγέλιον ὃ κηρύσσω ἐν τοῖς ἔθνεσιν, κατ’ ἰδίαν δὲ τοῖς δοκοῦσιν, μή πως εἰς κενὸν τρέχω ἢ ἔδραμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/002.yaml
  text: But I went up in response to a revelation[a], and I laid before them the gospel that I proclaim among the Gentiles—but privately before those of repute—lest somehow I should be running, or had run[c][b], in vain.
translation:
  language: tl
  text: Ngunit umakyat ako dahil sa isang paghahayag[a], at inilahad ko sa kanila ang ebanghelyong ipinapangaral ko sa mga Hentil—ngunit nang sarilinan sa mga kinikilalang mahalaga[b]—baka sakaling walang kabuluhan ang aking pagtakbo ngayon o ang aking pagtakbo noon[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ayon sa isang paghahayag” o “bilang tugon sa isang paghahayag.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa mga itinuturing na mahalaga”; maaari ring “sa mga tila maimpluwensiya.”
    reason: lexical_alternative
  - marker: c
    text: O, “baka sakaling tumatakbo ako o tumakbo ako nang walang kabuluhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβην
  choice: umakyat ako
  rationale: Pinananatili ang payak na diwa ng pag-akyat; hindi idinaragdag ang Jerusalem, sapagkat pahiwatig lamang iyon ng konteksto at hindi tahasang binanggit sa talata.
- source_word: κατὰ ἀποκάλυψιν
  choice: dahil sa isang pahayag
  rationale: Likas sa modernong Tagalog at malinaw na ipinahahayag na ang pahayag ang dahilan o nag-udyok sa pagpunta, habang ang alternatibong posibilidad ay itinatala sa talababa.
- source_word: ἀνεθέμην
  choice: Inilahad ko sa kanila
  rationale: Ipinahihiwatig ang paghaharap ng mensahe para sa kanilang pagsasaalang-alang nang hindi ipinapalagay na nagpasakop si Pablo upang humingi ng pormal na pahintulot.
- source_word: τὸ εὐαγγέλιον
  choice: ang ebanghelyo
  rationale: Karaniwan, maikli, at angkop na salin sa kontekstong Paulino.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: sa mga Hentil
  rationale: Sa kontekstong ito, tumutukoy sa mga hindi Judio, hindi sa mga bansang pampolitika.
- source_word: κατ’ ἰδίαν
  choice: nang sarilinan
  rationale: Malinaw na naghihiwalay sa pribadong paglalahad mula sa mas malawak na pakikipag-usap.
- source_word: τοῖς δοκοῦσιν
  choice: sa mga kinikilalang pinuno
  rationale: Likas sa Tagalog at ipinakikitang sila ay itinuturing na mahahalagang tao, nang hindi lubusang inaalis ang bahagyang distansiya ng δοκοῦσιν; ang mas literal na alternatibo ay nasa talababa.
- source_word: μή πως εἰς κενὸν τρέχω ἢ ἔδραμον
  choice: upang hindi mawalan ng kabuluhan ang aking kasalukuyan o nakaraang pagpapagal
  rationale: Inililipat nang natural sa Tagalog ang metapora ng pagtakbo bilang ministeryal na pagpapagal at pinananatili ang pagkakaiba ng kasalukuyan at nakaraang gawain; ang mas literal na anyo ay nasa talababa.
theological_decisions:
- issue: Kung ang pribadong paglalahad ni Pablo ay nangangahulugang isinusumite niya ang kanyang ebanghelyo upang maitama o mapahintulutan ng mga apostol
  choice: 'Neutral ang pananalita: “Inilahad ko sa kanila” ang ebanghelyo.'
  alternative: “Isinumite ko sa kanila” ang ebanghelyo upang aprubahan nila, o ipinaalam lamang niya ito nang walang anumang pagsasaalang-alang.
  rationale: Ang ἀνεθέμην ay nagpapahiwatig ng paglalahad para sa pagsasaalang-alang ngunit hindi kinakailangang mangahulugan ng pormal na pagpapasakop o paghingi ng awtorisasyon.
- issue: Kung ipinahihiwatig ng μή πως na nag-aalinlangan si Pablo sa katotohanan ng kanyang ebanghelyo
  choice: Ipinahahayag ang pag-iingat na huwag mawalan ng kabuluhan ang kanyang gawain, nang hindi sinasabing nag-aalinlangan siya sa mensahe mismo.
  alternative: Nangangamba si Pablo na maaaring mali ang kanyang ebanghelyo.
  rationale: Ang teksto ay nagsasaad ng pag-aalala tungkol sa maaaring pagiging walang kabuluhan ng kanyang pagtakbo o pagpapagal, ngunit hindi nito tahasang tinutukoy kung doktrinal na katumpakan, praktikal na bunga, o pagkakaisa ang nakataya.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ebanghelyo” at “Hentil” bilang pamilyar na bokabularyong biblikal. Ang idyomang Griyego tungkol sa pagtakbo ay ginawang “pagpapagal” sa pangunahing teksto para sa likas na Tagalog, habang pinanatili ang literal na metapora sa talababa.
