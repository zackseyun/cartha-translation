  to: Ngunit umakyat ako dahil sa isang paghahayag[a], at inilahad ko sa kanila ang ebanghelyong ipinapangaral ko sa mga Hentil—ngunit nang sarilinan sa mga kinikilalang mahalaga[b]—baka sakaling walang kabuluhan ang aking pagtakbo ngayon o ang aking pagtakbo noon[c].
  rationale: Ginawang “paghahayag” ang ἀποκάλυψις, inalis ang dagdag na ideya ng pormal na pamumuno sa τοῖς δοκοῦσιν, at ginawang “baka sakaling” ang μή πως. Pinanatili rin ang metapora ng pagtakbo at ang kaibhan ng kasalukuyan at nakaraang gawain, nang hindi ipinapakahulugan kung ang alalahanin ni Pablo ay tungkol sa katotohanang doktrinal, praktikal na bunga, o pagkakaisa.
