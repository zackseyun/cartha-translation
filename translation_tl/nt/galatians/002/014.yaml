source:
  edition: SBLGNT
  text: ἀλλ’ ὅτε εἶδον ὅτι οὐκ ὀρθοποδοῦσιν πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου, εἶπον τῷ ⸀Κηφᾷ ἔμπροσθεν πάντων· Εἰ σὺ Ἰουδαῖος ὑπάρχων ἐθνικῶς ⸂καὶ ⸀οὐκ Ἰουδαϊκῶς ζῇς⸃, ⸀πῶς τὰ ἔθνη ἀναγκάζεις Ἰουδαΐζειν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/014.yaml
  text: But when I saw that they were not walking in step with the truth of the gospel[a], I said to Cephas before them all, “If you, though a Jew, live like a Gentile and not like a Jew[b], how do you compel the Gentiles to live like Jews?”
translation:
  language: tl
  text: Ngunit nang makita kong hindi sila namumuhay nang naaayon sa katotohanan ng ebanghelyo[a], sinabi ko kay Cefas sa harap nilang lahat, “Kung ikaw na isang Judio ay namumuhay na gaya ng isang Hentil at hindi gaya ng isang Judio, paano mo pinipilit ang mga Hentil na mamuhay gaya ng mga Judio?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “hindi sila lumalakad nang tuwid ayon sa katotohanan ng ebanghelyo.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin ang huling parirala: “na sundin ang mga kaugaliang Judio?” Tradisyonal: “na magpaka-Judio?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρθοποδοῦσιν
  choice: hindi matuwid ang kanilang paglakad
  rationale: Pinananatili nito ang talinghaga ng literal na ‘paglakad nang tuwid’ habang malinaw na tumutukoy sa asal o pamumuhay.
- source_word: πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου
  choice: ayon sa katotohanan ng ebanghelyo
  rationale: Sa kaugnayan nito sa ὀρθοποδοῦσιν, ang πρός ay nagpapahayag ng pagkakaayon sa pamantayan, hindi lamang ng direksiyon.
- source_word: Κηφᾷ
  choice: Cefas
  rationale: Pinananatili ang pangalang ginamit ni Pablo sa tekstong Griyego sa halip na palitan ito ng Pedro.
- source_word: ἐθνικῶς
  choice: gaya ng isang Hentil
  rationale: Likas na ipinapahayag sa Tagalog ang paraan ng pamumuhay at pinananatili ang etniko at panlipunang paghahambing.
- source_word: Ἰουδαϊκῶς
  choice: gaya ng isang Judio
  rationale: Pinananatili ang tuwirang pagkakatulad ng pahayag sa katapat nitong ἐθνικῶς.
- source_word: ἀναγκάζεις
  choice: pinipilit
  rationale: Malinaw nitong ipinahihiwatig ang pamimilit o presyur nang hindi lumalabis sa kahulugan ng pandiwa.
- source_word: Ἰουδαΐζειν
  choice: mamuhay gaya ng mga Judio
  rationale: Naipapahayag nito sa karaniwang wika ang pag-angkin o pagsunod sa paraang Judio nang hindi nag-aangkat ng mas huling teknikal na polemika.
- source_word: πῶς
  choice: paano
  rationale: Tuwirang isinasalin ang tanong tungkol sa paraan o di-pagkakatugma, sa halip na gawing tanong tungkol sa kakayahan.
theological_decisions:
- issue: Kung paano isasalin ang Ἰουδαΐζειν nang hindi nag-aangkat ng mas huling doktrinal na polemika
  choice: mamuhay gaya ng mga Judio
  alternative: maging maka-Judio / sundin ang mga kaugaliang Judio
  rationale: Ang agarang konteksto ay tungkol sa pakikisalo at mga hangganang etniko at panrelihiyon. Pinananatili ng salin ang saklaw ng orihinal nang hindi ito ginagawang katawagang teknikal.
- issue: Ang kaugnayan ng asal sa ‘katotohanan ng ebanghelyo’
  choice: ayon sa katotohanan ng ebanghelyo
  alternative: patungo sa katotohanan ng ebanghelyo
  rationale: Ipinapakita ng parirala ang pagkakaayon ng pamumuhay sa katotohanan bilang pamantayan, ngunit hindi nililinaw nang higit sa sinasabi ng teksto ang lahat ng implikasyong teolohikal nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘Judio’ at ‘Hentil’ bilang karaniwang katawagang biblikal; pinanatili ang Cefas ayon sa pangalang nasa Griyego. Ang metapora ng paglakad ay pinanatili ngunit inayos sa likas na balangkas ng Tagalog.
