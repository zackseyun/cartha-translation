  to: Ngunit nang makita kong hindi sila namumuhay nang naaayon sa katotohanan ng ebanghelyo[a], sinabi ko kay Cefas sa harap nilang lahat, “Kung ikaw na isang Judio ay namumuhay na gaya ng isang Hentil at hindi gaya ng isang Judio, paano mo pinipilit ang mga Hentil na mamuhay gaya ng mga Judio?”[b]
  rationale: Ginawang mas likas ang pangunahing pangungusap sa makabagong Filipino nang hindi binabago ang kahulugang ang kanilang pamumuhay ay hindi umaayon sa katotohanan ng ebanghelyo. Iningatan sa talababa ang literal na larawan ng paglakad nang tuwid. Pinalitan din ang di-gaanong likas na “maging maka-Judio” ng mas tradisyonal na “magpaka-Judio.”
