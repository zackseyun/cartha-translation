base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/011.yaml
  text: But when Cephas came to Antioch[a], I opposed him to his face[b], because he stood condemned.
translation:
  language: tl
  text: Ngunit nang dumating si Cefas sa Antioquia[a], sinalungat ko siya nang harapan, sapagkat nahatulan na siya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Cefas ay Aramaikong pangalan ni Pedro.
    reason: cross_reference
  - marker: b
    text: O, “sapagkat maliwanag na siya ang may mali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: Ngunit nang
  rationale: Likas na ipinapahayag ang panahong ugnayan at banayad na pagsalungat ng δέ.
- source_word: Κηφᾶς
  choice: Cefas
  rationale: Pinananatili ang pangalang nasa tekstong Griyego sa halip na palitan ito ng mas pamilyar na Pedro.
- source_word: ἦλθεν εἰς Ἀντιόχειαν
  choice: dumating ... sa Antioquia
  rationale: Natural na Filipino para sa pagdating sa isang lungsod, nang hindi ginagawang labis na literal ang εἰς.
- source_word: κατὰ πρόσωπον αὐτῷ ἀντέστην
  choice: hinarap ko siya at sinalungat
  rationale: Ipinananatili ang hayagang at personal na katangian ng paghaharap, habang malinaw at natural sa modernong Filipino.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng pagsalungat ni Pablo.
- source_word: κατεγνωσμένος ἦν
  choice: nahatulan na siya
  rationale: Pinananatili ang pasibong diwa at ang kalagayang bunga ng periprastikong anyo; ang “na” ay nagpapahiwatig na nasa kalagayan na siya ng pagkakahatol.
theological_decisions:
- issue: Pagkakakilanlan at anyo ng pangalang Κηφᾶς
  choice: Panatilihin ang “Cefas” sa pangunahing teksto
  alternative: Gamitin ang “Pedro” para sa mas madaling pagkilala
  rationale: Pangalan ang Κηφᾶς, kaya tinutumbasan ito ayon sa anyong nasa Griyego; ipinapaliwanag sa talababa ang kaugnayan nito kay Pedro.
- issue: Saklaw ng κατεγνωσμένος ἦν
  choice: “nahatulan na siya”
  alternative: “maliwanag na siya ang may mali”
  rationale: Hindi tahasang tinutukoy ng Griyego kung sino ang humatol o kung pormal ang hatol. Pinananatili ng pangunahing salin ang pasibo at ang teolohikal na tensiyon; ibinibigay sa talababa ang posibleng kontekstuwal na diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hinarap ... at sinalungat” upang maipahayag ang idyomatikong κατὰ πρόσωπον at ang pandiwang ἀντέστην nang hindi tunog-salita-sa-salita; ang alternatibong pagbasa ay pinanatili sa talababa.
