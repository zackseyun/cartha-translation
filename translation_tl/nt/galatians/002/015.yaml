translation:
  language: tl
  text: Tayo ay likas na mga Judio at hindi mga makasalanang nagmula sa mga Hentil[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “likas na” ay salin ng pariralang literal na nangangahulugang “ayon sa kalikasan”; dito, tumutukoy ito sa likas na pinagmulang etniko.
    reason: cultural_note
  - marker: b
    text: 'O: “at hindi mga makasalanang Hentil.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς
  choice: Tayo
  rationale: Pinananatili ang tahasang panghalip at ang bahagyang pagdidiin nito; ang inklusibong “tayo” ay natural sapagkat kinakausap ni Pablo si Pedro bilang kapuwa Judio.
- source_word: φύσει
  choice: sa kapanganakan
  rationale: Sa konteksto, tumutukoy ito sa likas na pinagmulang etniko, hindi sa panloob na katangiang moral. Malinaw at natural itong ipinahahayag ng “sa kapanganakan.”
- source_word: Ἰουδαῖοι
  choice: mga Judio
  rationale: Direkta at karaniwang katawagan ito sa etnikong pagkakakilanlang ipinantatapat sa mga Hentil.
- source_word: ἐξ ἐθνῶν
  choice: mula sa mga Hentil
  rationale: Pinananatili ang diwa ng pang-ukol na ἐξ at ang etnikong pagtutol sa “mga Judio.” Sa kontekstong Paulino, ang ἔθνη ay mga Hentil.
- source_word: ἁμαρτωλοί
  choice: mga makasalanan
  rationale: Pinananatili ang tuwiran at nakaugaliang katawagang Paulino, nang hindi ito pinapalambot o dinaragdagan ng paliwanag sa mismong talata.
theological_decisions:
- issue: Kung dapat bang magmukhang itinataguyod ni Pablo ang likas na moral na kahigitan ng mga Judio sa mga Hentil
  choice: Pinananatili ang maikli at tuwirang etnikong paghahambing ng Griyego, nang hindi ito pinalalawak bilang pahayag na likas na matuwid ang mga Judio.
  alternative: “hindi itinuturing na mga makasalanan gaya ng mga Hentil”
  rationale: Nililinaw ng mas malawak na konteksto ang tensiyon, ngunit hindi dapat ipasok sa talatang ito ang paliwanag na wala sa mismong Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pagkakasunod ng paghahambing at ang bahagyang matalim na katawagang “mga makasalanan,” habang ang mga talababa ay nagpapakita ng literal na idyoma at posibleng alternatibong pagkakaugnay ng mga salita.
