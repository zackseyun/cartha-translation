base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/019.yaml
  text: For through the law I died to the law, so that I might live to God. I have been crucified with Messiah.
translation:
  language: tl
  text: Sapagkat sa pamamagitan ng Kautusan, namatay ako sa Kautusan upang mabuhay ako para sa Diyos. Kasama ng Mesiyas, ipinako na ako sa krus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag na nag-uugnay sa pangungusap sa naunang argumento.
- source_word: διὰ νόμου
  choice: sa pamamagitan ng Kautusan
  rationale: Pinananatili ang instrumental na diwa ng διά na may genitive; ang malaking titik ay tumutukoy sa Kautusan sa kontekstong Paulino.
- source_word: νόμῳ
  choice: sa Kautusan
  rationale: Ang pariralang “namatay ... sa Kautusan” ay maikli ngunit nauunawaan bilang pagkaputol ng dating kaugnayan o saklaw nito, nang hindi dinaragdagan ng paliwanag ang teksto.
- source_word: ἀπέθανον
  choice: namatay ako
  rationale: Ang aorist ay inihahayag bilang tiyak na pangyayaring naganap.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at likas na naghahayag ng layunin sa Tagalog.
- source_word: θεῷ ζήσω
  choice: mabuhay ako para sa Diyos
  rationale: Ang “para sa Diyos” ang likas na Tagalog na naghahatid ng direksiyon at pag-uukol ng buhay sa Diyos.
- source_word: Χριστῷ
  choice: kasama ng Mesiyas
  rationale: Pinananatili ang titulong Mesiyas at ang ugnayang ipinahihiwatig ng dative sa tambalang pandiwa.
- source_word: συνεσταύρωμαι
  choice: ipinako ako sa krus
  rationale: Kasama ng “Kasama ng Mesiyas,” ipinahahayag nito ang pakikipagpako sa krus; ang ayos ay natural sa Tagalog, at ang perpektong anyo ay nagpapahiwatig ng naganap na pangyayaring may nananatiling bunga.
theological_decisions:
- issue: Kung palalawakin ang kahulugan ng “sa pamamagitan ng Kautusan, namatay ako sa Kautusan”
  choice: Panatilihin ang maikli at siksik na pahayag.
  alternative: “Sa hatol ng Kautusan, nakalaya ako sa kapangyarihan ng Kautusan.”
  rationale: Hindi tahasang nililinaw ng Griyego kung sa anong tiyak na paraan naganap ito. Ang pagpapalawak ay magpapasok ng isang interpretasyong hindi hayag sa talata.
- issue: Kung isasalin ang Χριστός bilang “Cristo” o “Mesiyas”
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay pinananatili ang titulong kahulugan ng Χριστός nang hindi ito tinatratong isang pangalang pantangi lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Kautusan” para sa νόμος sa kontekstong tumutukoy sa Kautusan, at pinanatili ang siksik na teolohikal na tensiyon ng orihinal.
