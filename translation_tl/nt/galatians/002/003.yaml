base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/003.yaml
  text: But not even Titus[a], who was with me, though he was a Greek[b], was compelled to be circumcised.
translation:
  language: tl
  text: Ngunit kahit si Tito, na kasama ko, bagaman siya ay Griego,[a] ay hindi pinilit na magpatuli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bilang isang Griego.” Sa kontekstong ito, ipinahihiwatig ng “Griego” na si Tito ay hindi tuli, ngunit “Griego” mismo ang tiyak na tawag sa teksto, hindi lamang “Hentil.”
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: ἀλλ’
  choice: Ngunit
  rationale: Likas at marangal na panandang pasalungat ito na nag-uugnay sa talata sa naunang konteksto.
- source_word: οὐδὲ
  choice: maging ... ay hindi
  rationale: Pinananatili nito ang mariing pagtanggi na nakatuon kay Tito at natural itong pakinggan sa modernong Tagalog.
- source_word: Τίτος
  choice: Tito
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa mga saling Tagalog ng Bibliya.
- source_word: ὁ σὺν ἐμοί
  choice: na kasama ko
  rationale: Tuwirang inilalarawan ang kaugnayan ni Tito kay Pablo nang walang idinadagdag na diwa gaya ng pagiging katulong o kamanggagawa.
- source_word: Ἕλλην ὤν
  choice: bagaman siya ay Griego
  rationale: Natural na ipinapahayag ang malamang na diwang pasakali o konsesibo ng pariralang participial, habang kinikilala sa talababa ang mas pormal na pagbasa.
- source_word: Ἕλλην
  choice: Griego
  rationale: Pinananatili ang tiyak na katawagang etniko-kultural ng Griyego sa halip na palawakin ito bilang 'Hentil.'
- source_word: ἠναγκάσθη
  choice: pinilit
  rationale: Malinaw nitong ipinahahayag ang panlabas na pamimilit na tinutukoy ng pandiwang pasibo at karaniwan ito sa modernong Tagalog.
- source_word: περιτμηθῆναι
  choice: na magpatuli
  rationale: Ito ang natural at malinaw na paraan sa Tagalog upang ipahayag na sumailalim ang isang lalaki sa pagtutuli.
theological_decisions:
- issue: Kung isasalin ang Ἕλλην bilang tiyak na katawagang etniko o bilang panrelihiyong kategoriyang interpretatibo
  choice: Griego
  alternative: Hentil
  rationale: Tahasang 'Griego' ang sinasabi ng teksto. Bagaman ipinahihiwatig nito sa konteksto na si Tito ay isang di-tuling Hentil, hindi dapat palitan ng salin ang mas tiyak na katawagan ng pinagmulan.
- issue: Ang ugnayan ng Ἕλλην ὤν sa pangunahing sugnay
  choice: bagaman siya ay Griego
  alternative: bilang isang Griego
  rationale: 'Sinusuportahan ng konteksto ang diwang konsesibo: sa kabila ng pagiging Griego ni Tito, hindi siya pinilit magpatuli. Gayunman, hindi tahasang minamarkahan ng anyong participial ang ugnayang ito, kaya inilalahad sa talababa ang mas pormal na alternatibo.'
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, dignified, at madaling maunawaan. Pinili ang 'Griego' upang mapanatili ang tiyak na salita ng pinagmulan, at 'magpatuli' bilang natural na katumbas sa Tagalog.
