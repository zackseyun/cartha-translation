  naturalness: Kailangan ng maliit na rebisyon. Ang “muli akong umahon sa Jerusalem” ay hindi idiomatiko sa modernong Filipino Tagalog; ang “muli akong pumunta sa Jerusalem” ay malinaw at natural. Maayos ang natitirang ayos ng pangungusap.
