id: GAL.2.1
reference: Galatians 2:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἔπειτα διὰ δεκατεσσάρων ἐτῶν πάλιν ἀνέβην εἰς Ἱεροσόλυμα μετὰ Βαρναβᾶ συμπαραλαβὼν καὶ Τίτον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/001.yaml
  text: Then after fourteen years I went up again to Jerusalem with Barnabas, also taking Titus along.
translation:
  language: tl
  text: Pagkaraan ng labing-apat na taon, muli akong pumunta sa Jerusalem kasama si Bernabe, at isinama ko rin si Tito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπειτα
  choice: Pagkatapos
  rationale: Likas na panandang nagsusunod sa salaysay ni Pablo at pinananatili ang temporal na ugnayan sa naunang pangyayari.
- source_word: διὰ δεκατεσσάρων ἐτῶν
  choice: makalipas ang labing-apat na taon
  rationale: Ipinahahayag nang natural sa Tagalog ang lumipas na panahon bago ang sumunod na pangyayari, nang hindi tinutukoy kung saan eksaktong binibilang ang labing-apat na taon.
- source_word: πάλιν
  choice: muli
  rationale: Malinaw at maikling ipinakikita na naulit ang pagpunta ni Pablo sa Jerusalem.
- source_word: ἀνέβην
  choice: umahon ako
  rationale: Pinananatili ang direksiyong 'pataas' na nakapaloob sa pandiwang Griyego at ang kinaugaliang paglalarawan sa paglalakbay patungong Jerusalem.
- source_word: εἰς Ἱεροσόλυμα
  choice: sa Jerusalem
  rationale: Natural na Tagalog para sa destinasyon; malinaw ang patutunguhan dahil sa pandiwang 'umahon.'
- source_word: μετὰ Βαρναβᾶ
  choice: kasama si Bernabe
  rationale: Tuwirang ipinahahayag ang pagsama ni Bernabe gamit ang karaniwang anyo ng pangalan sa modernong saling Tagalog.
- source_word: συμπαραλαβὼν καὶ Τίτον
  choice: at isinama ko rin si Tito
  rationale: Ginagawang likas na sugnay sa Tagalog ang kasabay na kilos ng participle at pinananatili sa 'rin' ang additive na puwersa ng καί.
theological_decisions:
- issue: Batayan ng bilang na labing-apat na taon
  choice: Hindi tinukoy kung mula sa aling naunang pangyayari binibilang ang panahon.
  alternative: Ipaliwanag na binilang ito mula sa unang pagdalaw o mula sa pagbabalik ni Pablo sa Siria at Cilicia.
  rationale: Hindi tahasang nilulutas ng talata ang kronolohikal na batayan, kaya pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'umahon' sa halip na payak na 'pumunta' upang mapanatili ang direksiyong nasa ἀνέβην, ngunit inayos ang participle bilang hiwalay na sugnay para sa likas na daloy.
