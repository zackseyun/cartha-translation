id: GAL.2.12
reference: Galatians 2:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πρὸ τοῦ γὰρ ἐλθεῖν τινας ἀπὸ Ἰακώβου μετὰ τῶν ἐθνῶν συνήσθιεν· ὅτε δὲ ⸀ἦλθον, ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν, φοβούμενος τοὺς ἐκ περιτομῆς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/012.yaml
  text: For before certain men came from James[a], he used to eat with the Gentiles; but when they came, he began to draw back and separate himself[c][b], fearing those of the circumcision.
translation:
  language: tl
  text: Sapagkat bago dumating ang ilang tao mula kay Santiago[a], dati siyang nakikisalo sa mga Hentil. Ngunit nang dumating sila, nagsimula siyang umurong at humiwalay, dahil natatakot siya sa mga kabilang sa pagtutuli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy ang “mula kay Santiago” sa mga taong kaugnay niya; hindi tahasang sinasabi ng Griyego na pormal niya silang isinugo.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin na “mga kabilang sa pangkat ng pagtutuli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ γὰρ ἐλθεῖν τινας
  choice: Sapagkat bago dumating ang ilang tao
  rationale: Likas na ipinapahayag sa Tagalog ang panahong kahulugan ng πρὸ τοῦ ἐλθεῖν, habang pinananatili ng “ilang tao” ang di-tiyak na τινας.
- source_word: ἀπὸ Ἰακώβου
  choice: mula kay Santiago
  rationale: Ito ang tuwirang salin ng ἀπό na may personal na pangalan at hindi tahasang nagsasabing isinugo o inatasan sila ni Santiago.
- source_word: μετὰ τῶν ἐθνῶν συνήσθιεν
  choice: dati siyang nakikisalo sa mga Hentil
  rationale: Ipinakikita ng “dati” ang nakagawiang kilos ng imperpektong συνήσθιεν; natural na ipinahihiwatig ng “nakikisalo” ang pagkain na kasama ng iba.
- source_word: ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν
  choice: nagsimula siyang umurong at humiwalay
  rationale: Ipinahahayag nito ang pag-atras at panlipunang paghiwalay, at ang “nagsimula” ay angkop sa umuunlad na kilos na ipinakikita ng mga pandiwang imperpekto.
- source_word: φοβούμενος
  choice: dahil natatakot siya
  rationale: Ginagawang malinaw sa natural na Tagalog ang malamang na sanhi na ipinahihiwatig ng participle.
- source_word: τοὺς ἐκ περιτομῆς
  choice: mga kabilang sa mga tuli
  rationale: Tinutukoy nito ang mga tao ayon sa pagtutuli nang hindi tahasang tinatawag silang isang pormal na partido o paksyon.
theological_decisions:
- issue: Kung ipinahihiwatig ng ἀπὸ Ἰακώβου na pormal na isinugo o sinang-ayunan ni Santiago ang mga tao
  choice: mula kay Santiago
  alternative: mula sa pangkat ni Santiago; isinugo ni Santiago
  rationale: Maaaring tumukoy ang Griyego sa pinagmulan o kaugnayan, ngunit hindi nito tahasang sinasabi na sila ay inatasan ni Santiago. Pinananatili ng salin at talababa ang ganitong kalabuan.
- issue: Kung dapat tukuyin ang τοὺς ἐκ περιτομῆς bilang isang organisadong partido
  choice: mga kabilang sa mga tuli
  alternative: pangkat ng mga tuli; partido ng pagtutuli
  rationale: Iniuugnay sila ng teksto sa pagtutuli, ngunit hindi nito tahasang pinapangalanan ang isang pormal na paksyon.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “nakikisalo” ay mas natural kaysa sa literal na “kumakain na kasama,” at ang “umurong at humiwalay” ay malinaw na nagpapahayag ng unti-unting paglayo sa pakikisalo nang hindi nagdaragdag ng motibong wala sa teksto.
