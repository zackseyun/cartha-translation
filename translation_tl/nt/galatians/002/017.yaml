id: GAL.2.17
reference: Galatians 2:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ δὲ ζητοῦντες δικαιωθῆναι ἐν Χριστῷ εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί, ἆρα Χριστὸς ἁμαρτίας διάκονος; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/017.yaml
  text: But if[a], while seeking to be justified in Messiah, we ourselves also were found to be sinners, is Messiah then a servant of sin? May it never be!
translation:
  language: tl
  text: Ngunit kung, habang hinahangad nating tayo'y ariing-matuwid sa Mesiyas[a], tayo rin mismo ay natagpuang mga makasalanan, ang Mesiyas ba kung gayon ay lingkod ng kasalanan? Hinding-hindi!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Mesiyas” ay tradisyonal ding isinasaling “Cristo” rito at sa kasunod na pagbanggit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: habang sinisikap
  rationale: Ipinapakita ang kasabay na kilos ng participle at ang sadyang paghahangad, sa natural na Tagalog.
- source_word: δικαιωθῆναι
  choice: ariing matuwid
  rationale: 'Pinananatili ang pasibong at hudisyal na diwa: ang isang tao ay itinuturing o ipinahahayag na matuwid, hindi basta ginagawang mabuti ang asal.'
- source_word: ἐν Χριστῷ
  choice: sa Mesiyas
  rationale: Ginamit ang 'sa' bilang natural na Tagalog para sa relasyonal na ἐν sa pariralang ito, nang hindi nililinaw nang labis ang eksaktong paraan ng pakikipag-ugnayan sa Mesiyas.
- source_word: εὑρέθημεν
  choice: natagpuang
  rationale: Pinananatili ang pasibong anyo at retorikal na diin ng 'nasumpungan/natuklasang gayon' nang hindi dinaragdagan kung sino ang nakakita.
- source_word: καὶ αὐτοὶ ἁμαρτωλοί
  choice: tayo mismo ay natagpuang mga makasalanan
  rationale: Ang 'tayo mismo' ang naghahatid ng diin ng καὶ αὐτοί; malinaw at tuwiran ang 'mga makasalanan.'
- source_word: ἁμαρτίας διάκονος
  choice: lingkod ng kasalanan
  rationale: Natural na katumbas ng διάκονος at pinananatili ang matalim na paratang sa retorikal na tanong nang hindi ito ginagawang pormal na katungkulan.
- source_word: μὴ γένοιτο
  choice: Hinding-hindi!
  rationale: Isang mariin at likas na pagtanggi sa modernong Tagalog na naghahatid ng lakas ng pormulang Griyego.
theological_decisions:
- issue: Kung ipinahihiwatig ba ng tanong na ang Mesiyas ang sanhi o tagapagtaguyod ng kasalanan.
  choice: nangangahulugan bang ang Mesiyas ay lingkod ng kasalanan?
  alternative: ang Mesiyas ba kung gayon ay lingkod ng kasalanan?
  rationale: Inilalahad ito bilang implikasyong agad na itinatanggi, hindi bilang pahayag na ang Mesiyas ay lumilikha ng kasalanan. Hindi rin nilulutas sa salin kung sa anong eksaktong diwa sila 'natagpuang mga makasalanan.'
- issue: Kahulugan ng ἐν Χριστῷ.
  choice: sa Mesiyas
  alternative: kay Cristo / kaisa ng Mesiyas
  rationale: Ang 'sa Mesiyas' ay nagpapanatili ng siksik at posibleng maraming-saping relasyonal na diwa ng Griyego; ang 'kaisa ng Mesiyas' ay maaaring maging labis na pagpapakahulugan sa pangunahing teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinili ang 'ariing matuwid' upang maipahayag ang pasibo at hudisyal na diwa nang hindi gumagamit ng mas teknikal na 'bigyang-katuwiran.'
