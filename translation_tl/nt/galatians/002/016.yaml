id: GAL.2.16
reference: Galatians 2:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰδότες ⸀δὲ ὅτι οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων νόμου ἐὰν μὴ διὰ πίστεως ⸂Ἰησοῦ Χριστοῦ⸃, καὶ ἡμεῖς εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν, ἵνα δικαιωθῶμεν ἐκ πίστεως Χριστοῦ καὶ οὐκ ἐξ ἔργων νόμου, ⸂ὅτι ἐξ ἔργων νόμου οὐ δικαιωθήσεται⸃ πᾶσα σάρξ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/016.yaml
  text: Yet knowing that a person is not justified by works of the law except through faith in Jesus the Messiah[a], even we have believed in Messiah Jesus, so that we might be justified by faith in Messiah and not by works of the law[c][b], because by works of the law no flesh will be justified.
translation:
  language: tl
  text: Gayunman, alam nating ang isang tao ay hindi itinuturing na matuwid dahil sa mga gawa ng Kautusan, kundi sa pamamagitan ng pananampalataya kay Jesus na Mesiyas.[a] At maging tayo rin ay sumampalataya kay Jesus na Mesiyas, upang maituring tayong matuwid dahil sa pananampalataya sa Mesiyas[b] at hindi dahil sa mga gawa ng Kautusan, sapagkat walang sinumang tao[c] ang ituturing na matuwid dahil sa mga gawa ng Kautusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sa pamamagitan ng katapatan ni Jesus na Mesiyas.”'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin: “dahil sa katapatan ng Mesiyas.”'
    reason: alternative_reading
  - marker: c
    text: 'Sa literal: “walang anumang laman.” Ang ibig sabihin ay walang sinumang tao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦται / δικαιωθῶμεν / δικαιωθήσεται
  choice: itinuturing na matuwid / maituring na matuwid / ituturing na matuwid
  rationale: Pinananatili ang hudisyal at deklaratibong diwa ng pandiwa sa buong talata, habang gumagamit ng likas at malinaw na Filipino.
- source_word: ἄνθρωπος
  choice: isang tao
  rationale: Likas na generic singular sa modernong Filipino at tumutukoy sa sinumang tao nang hindi nililimitahan sa kasarian.
- source_word: ἐξ ἔργων νόμου
  choice: dahil sa mga gawa ng Kautusan
  rationale: Pinananatili ang natatanging pariralang Paulino at iniiwasang palawakin ito bilang pangkalahatang 'mabubuting gawa.'
- source_word: διὰ πίστεως Ἰησοῦ Χριστοῦ
  choice: sa pamamagitan ng pananampalataya kay Jesus na Mesiyas
  rationale: Ang pangunahing teksto ay gumagamit ng objective-genitive na pagbasa; ang tunay na posibleng pagbasa na tumutukoy sa katapatan ni Jesus na Mesiyas ay inilagay sa talababa.
- source_word: εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν
  choice: sumampalataya rin tayo kay Cristo Jesus
  rationale: Ang 'sumampalataya kay' ang likas na Filipino para sa πιστεύω εἰς; pinananatili ng aspektong perpektibo ang naganap na pagtugon.
- source_word: ἐκ πίστεως Χριστοῦ
  choice: dahil sa pananampalataya kay Cristo
  rationale: Kaayon ng unang πίστις Χριστοῦ construction, habang itinatala sa talababa ang subjective-genitive na alternatibo.
- source_word: Χριστοῦ / Χριστόν
  choice: Mesiyas / Cristo
  rationale: Isinalin ang unang buong pangalan bilang 'Jesus na Mesiyas' upang luminaw ang titulong Χριστός; pinanatili ang nakaugaliang natural na anyong 'Cristo Jesus' at 'Cristo' sa kasunod na mga banggit.
- source_word: πᾶσα σάρξ
  choice: walang sinumang tao
  rationale: Inihahatid ang idiomatikong kahulugan ng Hebraism sa malinaw na modernong Filipino; ang literal na 'walang laman' ay inilalagay sa talababa.
- source_word: εἰδότες δὲ
  choice: Gayunman, alam nating
  rationale: Ipinahahayag ang banayad na pagsalungat ng δέ at ang participial connection sa konteksto sa natural na Filipino.
- source_word: ἐὰν μὴ
  choice: kundi sa pamamagitan ng
  rationale: Sa kontekstong ito, likas nitong ipinakikita ang contrast sa pagitan ng mga gawa ng Kautusan at pananampalataya nang hindi binubura ang eksklusibong puwersa ng Griyego.
theological_decisions:
- issue: Kahulugan ng πίστις Χριστοῦ / πίστεως Ἰησοῦ Χριστοῦ
  choice: 'objective genitive: ''pananampalataya kay Jesus na Mesiyas'' / ''pananampalataya kay Cristo'''
  alternative: 'subjective genitive: ''katapatan ni Jesus na Mesiyas'' / ''katapatan ni Cristo'''
  rationale: Tunay na hindi tiyak sa gramatika kung ang genitive ay tumutukoy sa pananampalatayang nakatuon kay Cristo o sa katapatan ni Cristo. Sinusunod ng pangunahing teksto ang karaniwang objective-genitive na pagbasa, ngunit hindi inaalis ang alternatibo.
- issue: Forensic force ng δικαιόω
  choice: itinuturing na matuwid
  alternative: ipinahahayag na matuwid; ginagawang matuwid
  rationale: Ang 'itinuturing na matuwid' ay nagpapahayag ng deklaratibo at hudisyal na puwersa nang hindi nagpapasok ng mas makitid na sistematikong paliwanag.
- issue: Saklaw ng πᾶσα σάρξ
  choice: walang sinumang tao
  alternative: 'literal: ''walang laman'''
  rationale: Ang parirala ay isang Semitikong idyoma para sa buong sangkatauhan; ang malinaw na kahulugan ang nasa teksto at ang literal na anyo ay pinanatili sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'Kautusan' bilang pamagat para sa νόμος sa pariralang Paulino, at iniwasan ang mas teknikal na salitang 'inaaring-ganap' upang maging malinaw sa karaniwang mambabasa. Ang mga marker na [a], [b], at [c] ay nasa mismong pangunahing teksto.
