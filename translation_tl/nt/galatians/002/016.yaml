revisions:
- from: Gayunman, alam nating ang isang tao ay hindi itinuturing na matuwid dahil sa mga gawa ng Kautusan, kundi sa pamamagitan ng pananampalataya kay Jesus na Mesiyas.[a] Kaya sumampalataya rin tayo kay Cristo Jesus, upang maituring tayong matuwid dahil sa pananampalataya kay Cristo[b] at hindi dahil sa mga gawa ng Kautusan, sapagkat walang sinumang tao[c] ang ituturing na matuwid dahil sa mga gawa ng Kautusan.
  to: Gayunman, alam nating ang isang tao ay hindi itinuturing na matuwid dahil sa mga gawa ng Kautusan, kundi sa pamamagitan ng pananampalataya kay Jesus na Mesiyas.[a] At maging tayo rin ay sumampalataya kay Jesus na Mesiyas, upang maituring tayong matuwid dahil sa pananampalataya sa Mesiyas[b] at hindi dahil sa mga gawa ng Kautusan, sapagkat walang sinumang tao[c] ang ituturing na matuwid dahil sa mga gawa ng Kautusan.
  rationale: Pinag-isa ang pagsasalin ng Χριστός bilang “Mesiyas,” itinuwid ang literal na anyo ng πᾶσα σάρξ sa talababa, at pinalitan ang inferensiyang “Kaya” ng mas malapit na “At maging tayo rin.” Hindi binago ang pangunahing pagbasa ng πίστις Χριστοῦ; nananatili ang alternatibong subjective-genitive na pagbasa sa mga talababa.
