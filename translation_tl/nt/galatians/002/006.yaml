  text: ἀπὸ δὲ τῶν δοκούντων εἶναί τι— ὁποῖοί ποτε ἦσαν οὐδέν μοι διαφέρει· πρόσωπον ⸀θεὸς ἀνθρώπου οὐ λαμβάνει— ἐμοὶ γὰρ οἱ δοκοῦντες οὐδὲν προσανέθεντο,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/006.yaml
  text: But from those who were reputed to be something—whatever they once were makes no difference to me[a]; God shows no partiality—to me, indeed[c][b], those of reputation added nothing.
translation:
  language: tl
  text: Ngunit ang mga itinuturing na mahalaga—anuman ang katayuan nila noon ay walang pagkakaiba sa akin; hindi nagtatangi ang Diyos[a]—ay walang idinagdag sa akin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Hindi tinatanggap ng Diyos ang mukha ng tao,” isang idyomang nangangahulugang hindi nagpapakita ang Diyos ng paboritismo.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin, “wala silang ipinataw na anumang karagdagan sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δοκούντων εἶναί τι / οἱ δοκοῦντες
  choice: mga itinuturing na mahalaga / mga kinikilalang iyon
  rationale: Ipinahihiwatig ng δοκέω ang kinikilalang katayuan o reputasyon. Pinananatili ng mga pariralang ito ang bahagyang paglayo ng tono ni Pablo nang hindi hinahamak o itinatanggi ang kanilang pamumuno.
- source_word: ὁποῖοί ποτε ἦσαν
  choice: anuman ang katayuan nila noon
  rationale: Likas itong nagpapahayag na hindi mahalaga sa argumento ni Pablo ang dati nilang katayuan; sinasalamin ng “noon” ang ποτε nang hindi nagpapalabis ng temporal na kaibahan.
- source_word: οὐδέν μοι διαφέρει
  choice: walang pagkakaiba sa akin
  rationale: Malinaw at natural na katumbas ito ng idyomang Griyego na nagsasabing hindi nakaaapekto sa pagtataya ni Pablo ang kanilang katayuan.
- source_word: πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει
  choice: hindi nagtatangi ang Diyos
  rationale: Isinasalin nito ang kahulugan ng idyoma—hindi nagpapakita ang Diyos ng paboritismo—sa natural na modernong Tagalog.
- source_word: οὐδὲν προσανέθεντο
  choice: walang idinagdag sa akin
  rationale: 'Pinananatili nito ang malawak na kahulugan ng προσανατίθημι: hindi sila nagdagdag o nag-atas ng anumang karagdagan kay Pablo. Ang posibleng diwang “ipinataw” ay inilagay sa talababa.'
theological_decisions:
- issue: Kung ang sinabi ni Pablo ay paghamak sa mga pinuno sa Jerusalem o paggigiit lamang na hindi nakasalalay sa kanilang katayuan ang kanyang awtoridad at ebanghelyo
  choice: Pinanatili ang may-paglayong pananalitang “mga itinuturing na mahalaga” at “mga kinikilalang iyon,” nang hindi ginagawang tuwirang pag-atake sa kanila.
  alternative: Maaaring isaling “mga waring mahalaga,” na mas matalim at mas mapanghamak ang dating, o “mga kinikilalang pinuno,” na maaaring magpahina sa retorikal na tensiyon.
  rationale: Ang diin ni Pablo ay walang epekto sa katotohanan ng kanyang ebanghelyo ang kanilang kinikilalang katayuan; hindi niya kinakailangang itinatanggi na sila ay mga pinuno.
- issue: Kung ang οὐδὲν προσανέθεντο ay nangangahulugang walang iniambag o walang karagdagang ipinataw kay Pablo
  choice: Ginamit sa teksto ang mas malawak na “walang idinagdag sa akin.”
  alternative: “Wala silang ipinataw na anumang karagdagan sa akin.”
  rationale: May saklaw ang pandiwa para sa pagdaragdag o paghaharap ng karagdagan. Pinananatili ng pangunahing salin ang tunay na kalabuan, habang itinatala sa talababa ang posibleng diwa ng pagpapataw.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang mga gitling upang mapanatili ang parentetikong daloy at retorikal na tensiyon ng Griyego; iniwasan ang sobrang kolokyal at denominasyonal na pananalita.
