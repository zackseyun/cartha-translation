  to: Sapagkat kung muli kong itinatayo ang mga bagay na giniba ko, ipinakikita kong ako mismo ay isang tagalabag.[a]
  rationale: Pinalitan ang di-likas na ‘isang lumalabag’ ng ‘isang tagalabag’ upang maipahayag nang natural ang pangngalang παραβάτην. Ginamit ang ‘ipinakikita’ bilang pangunahing salin ng συνιστάνω sa diwang ‘ipinapakita,’ habang inilagay ang ‘pinatutunayan’ bilang leksikal na kahalili. Idinagdag ang ‘mismo’ upang maipakita ang reflexive na ἐμαυτόν nang hindi binabago ang kahulugan.
