base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/018.yaml
  text: For if I rebuild the things I tore down[b][a], I prove myself to be a transgressor.
translation:
  language: tl
  text: Sapagkat kung muli kong itinatayo ang mga bagay na giniba ko, ipinakikita kong ako mismo ay isang tagalabag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinatutunayan kong ako mismo ay isang tagalabag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Sapagkat kung
  rationale: Pinananatili nito kapwa ang paliwanag na ugnayan ng γάρ sa naunang argumento at ang kondisyunal na lakas ng εἰ.
- source_word: ἃ ... ταῦτα
  choice: ang mga bagay na
  rationale: Likas ito sa makabagong Tagalog at pinananatili ang maramihang tinutukoy ng Griyegong kaugnayang ἃ ... ταῦτα.
- source_word: κατέλυσα
  choice: giniba ko
  rationale: Malinaw nitong pinananatili ang talinghaga ng pagtatayo, lalo na bilang katapat ng οἰκοδομῶ, nang hindi agad binibigyang-kahulugang 'pinawalang-bisa.'
- source_word: πάλιν οἰκοδομῶ
  choice: muli kong itinatayo
  rationale: Tapat ito sa πάλιν at sa pangkasalukuyang anyo ng οἰκοδομῶ, habang natural pa rin sa Tagalog.
- source_word: παραβάτην
  choice: isang lumalabag
  rationale: Pinananatili nito ang moral at legal na diwa ng παραβάτης nang hindi ito labis na nililimitahan sa isang tiyak na kautusan.
- source_word: ἐμαυτὸν συνιστάνω
  choice: pinatutunayan kong ako ay
  rationale: Ipinahahayag nito ang diwa ng pagpapakita o pagpapatunay sa sarili bilang gayon at pinananatili ang pansariling pananagutan ng reflexive na ἐμαυτόν.
theological_decisions:
- issue: Ang tinutukoy ng 'mga bagay na giniba'
  choice: Panatilihing pangkalahatan at matalinghaga
  alternative: Tukuyin nang tahasan bilang Kautusan o sistema ng Kautusan
  rationale: Hindi tahasang pinapangalanan ng talata ang bagay na giniba; ang paglilinaw nito sa salin ay magpapasok ng interpretasyong higit sa mismong teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang magkatapat na larawang “giniba” at “muling itinatayo,” gayundin ang kondisyunal at pansariling diin ng pangungusap.
