  source_fidelity: Tumpak na naipapahayag ng draft ang kondisyunal at paliwanag na ugnayan ng εἰ γὰρ, ang maramihang ugnayang ἃ ... ταῦτα, at ang magkatapat na larawang ‘giniba’ at ‘muling itinatayo.’ Napapanatili rin nito ang pansariling pananagutan sa ἐμαυτὸν συνιστάνω. Gayunman, ang ‘isang lumalabag’ ay hindi likas na pangngalan para sa παραβάτην sa pangungusap na ito.
  naturalness: Ang ‘Sapagkat kung’ at ang larawan ng paggiba/pagtatayo ay malinaw at angkop sa makabagong Tagalog. Mas idiomatiko at malinaw ang ‘isang tagalabag’ kaysa ‘isang lumalabag.’
  terminology: Ang ‘tagalabag’ ay angkop na pangkalahatang katumbas ng παραβάτης. Hindi nito tinutukoy nang lampas sa teksto kung anong kautusan o pamantayan ang nilabag.
