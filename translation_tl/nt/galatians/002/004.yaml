id: GAL.2.4
reference: Galatians 2:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὰ δὲ τοὺς παρεισάκτους ψευδαδέλφους, οἵτινες παρεισῆλθον κατασκοπῆσαι τὴν ἐλευθερίαν ἡμῶν ἣν ἔχομεν ἐν Χριστῷ Ἰησοῦ, ἵνα ἡμᾶς ⸀καταδουλώσουσιν—
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/004.yaml
  text: But because of the false brothers secretly brought in[a], who slipped in to spy out our freedom that we have in Messiah Jesus[b], so that they might enslave us—
translation:
  language: tl
  text: Ngunit dahil sa mga huwad na kapatid[a] na palihim na ipinasok, na nakapuslit upang tiktikan ang kalayaang taglay natin sa Mesiyas na si Jesus[b], para alipinin tayo—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga huwad na kapatid” ay nagpapanatili sa katawagang pampamilya ni Pablo; tumutukoy ito sa mga taong nagpapakilalang kapwa mananampalataya.
    reason: cultural_note
  - marker: b
    text: O “Cristo Jesus.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρεισάκτους
  choice: palihim na ipinasok
  rationale: Ipinahahayag nito na may mga taong lihim na ipinasok mula sa labas, habang nananatiling naiiba sa kasunod na pandiwang παρεισῆλθον.
- source_word: ψευδαδέλφους
  choice: mga huwad na kapatid
  rationale: Pinananatili ang matindi at pampamilyang katawagan ni Pablo; ang tinutukoy ay mga taong nagpapakilalang kapwa mananampalataya.
- source_word: παρεισῆλθον
  choice: nakapuslit
  rationale: Likas na ipinahihiwatig sa modernong Tagalog ang palihim at mapanlinlang na pagpasok, nang hindi inuulit lamang ang “palihim na ipinasok.”
- source_word: κατασκοπῆσαι
  choice: upang tiktikan
  rationale: Malinaw na ipinapakita ang lihim at masamang layunin ng kanilang pagmamasid.
- source_word: ἐλευθερίαν
  choice: kalayaan
  rationale: Ito ang karaniwan at tuwirang katumbas na nagpapanatili sa panlipunan at teolohikal na bigat ng salita.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  rationale: Ipinakikita ang Χριστός bilang titulo, at natural sa Tagalog ang hulma na “Mesiyas na si Jesus.”
- source_word: καταδουλώσουσιν
  choice: alipinin
  rationale: Tuwirang pinananatili ang marahas na larawan ng pagpapailalim sa pagkaalipin.
- source_word: ἵνα ... καταδουλώσουσιν
  choice: para alipinin tayo
  rationale: Natural na ipinahahayag ang layunin ng kilos. Pinananatili ang di-pormal na pagkakatapos ng pangungusap dahil nagpapatuloy ang estruktura sa susunod na talata.
theological_decisions:
- issue: Kung isasalin ang Χριστῷ bilang titulo o gagamiting anyong tila pangalan
  choice: Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: May malinaw pa ring puwersa bilang titulo ang Χριστός sa parirala, kaya isinalin ito sa halip na ituring lamang na bahagi ng pangalang pantangi.
- issue: Pagpapanatili sa katawagang pampamilya na ψευδαδέλφους
  choice: mga huwad na kapatid
  alternative: mga huwad na mananampalataya
  rationale: Hindi nilulutas ng salin kung ano ang tunay nilang espirituwal na kalagayan; pinananatili nito ang polemikal na katawagan at larawang pampamilya ni Pablo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang gitling sa hulihan sapagkat ang talata ay isang di-kumpletong sugnay na nagpapatuloy sa kasunod na talata. Ginamit ang “mga taong” upang maging malinaw ang reperensiya ng panghalip na Griyego nang hindi binabago ang kahulugan.
