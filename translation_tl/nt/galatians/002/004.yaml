  source_fidelity: 'Tumpak ang mahahalagang kahulugan: ang mga huwad na kapatid ay palihim na ipinasok, nakapasok upang maniktik sa kalayaang nasa Mesiyas na si Jesus, na may layuning alipinin ang mga mananampalataya. Gayunman, ang gitling sa gitna ng pangungusap at ang kasunod na “mga taong” ay lumilikha ng hindi kailangang putol at bahagyang malabong ugnayan sa pagitan ng dalawang magkaibang Griyegong anyo.'
