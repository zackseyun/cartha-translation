revisions:
- from: Ngunit dahil sa mga huwad na kapatid[a] na palihim na ipinasok—mga taong nakapuslit upang tiktikan ang kalayaang taglay natin sa Mesiyas na si Jesus[b], para alipinin tayo—
  to: Ngunit dahil sa mga huwad na kapatid[a] na palihim na ipinasok, na nakapuslit upang tiktikan ang kalayaang taglay natin sa Mesiyas na si Jesus[b], para alipinin tayo—
  rationale: Inalis ang gitling sa gitna at ang hindi kailangang apposition na “mga taong” upang maging malinaw ang sintaks, habang pinananatiling magkaiba ang “palihim na ipinasok” at “nakapuslit,” na kumakatawan sa magkaibang Griyegong salita. Pinanatili ang pangwakas na gitling sapagkat hindi pa tapos ang pangungusap sa talata 4.
