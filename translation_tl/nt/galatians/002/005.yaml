id: GAL.2.5
reference: Galatians 2:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἷς οὐδὲ πρὸς ὥραν εἴξαμεν τῇ ὑποταγῇ, ἵνα ἡ ἀλήθεια τοῦ εὐαγγελίου διαμείνῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/005.yaml
  text: To them we did not yield in submission even for a moment[b][a], so that the truth of the gospel might remain for you.
translation:
  language: tl
  text: Hindi kami nagpasakop sa kanila kahit saglit[a], upang manatili para sa inyo[b] ang katotohanan ng ebanghelyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kahit isang oras,” isang idyomang nangangahulugang “kahit saglit.”
    reason: lexical_alternative
  - marker: b
    text: O “sa piling ninyo.”
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: sa kanila
  rationale: Tumutukoy ang panghalip sa mga lalaking binanggit sa naunang talata; natural sa Tagalog ang “sa kanila.”
- source_word: οὐδὲ πρὸς ὥραν
  choice: hindi ... kahit saglit
  rationale: Idyoma itong nangangahulugang hindi man lamang sa maikling panahon; malinaw at natural ang “kahit saglit,” habang inilalagay sa talababa ang literal na larawan.
- source_word: εἴξαμεν τῇ ὑποταγῇ
  choice: Hindi kami nagpasakop
  rationale: Ipinahahayag nito ang mariing pagtangging magbigay-daan sa mapagpasakop na pagsunod. Bagaman pinagsasama sa natural na Tagalog ang pandiwa at kasunod na pangngalan, hindi nito nililimitahan ang pagtanggi sa personal o institusyonal na saklaw lamang.
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili ang layuning ipinahahayag ng ἵνα sa maikli at marangal na Tagalog.
- source_word: ἡ ἀλήθεια τοῦ εὐαγγελίου
  choice: ang katotohanan ng ebanghelyo
  rationale: Pinananatili ang mahalagang pariralang Paulino at ang karaniwang nauunawaang terminong “ebanghelyo.”
- source_word: διαμείνῃ
  choice: manatili
  rationale: Tuwirang ipinahahayag ang pagpapatuloy o pag-iingat sa katotohanan ng ebanghelyo.
- source_word: πρὸς ὑμᾶς
  choice: para sa inyo
  rationale: Maaaring ipahiwatig ng πρός ang kapakinabangan o pagtukoy sa mga taga-Galacia; natural ang “para sa inyo,” ngunit tunay ding posible ang “sa piling ninyo.”
theological_decisions:
- issue: Saklaw ng pagtanggi ni Pablo na magpasakop
  choice: Hindi sila nagbigay-daan sa mga kalaban kahit sandali, upang maingatan ang katotohanan ng ebanghelyo para sa mga taga-Galacia.
  alternative: Maaaring partikular itong tumukoy sa personal na pagpapasakop o sa isang institusyonal na konsesyon.
  rationale: Malawak ang pahayag na Griyego at hindi nito hinihinging limitahan ang pagtanggi sa personal o institusyonal na antas lamang.
- issue: Ugnayan ng katotohanan ng ebanghelyo sa mga mambabasa
  choice: para sa inyo
  alternative: sa piling ninyo
  rationale: Maaaring ipahiwatig ng πρὸς ὑμᾶς ang kapakinabangan para sa kanila o ang pananatili nito sa kanila; pinanatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa publikong pagbasa. Ginamit ang “nagpasakop” upang natural na maipahayag ang pinagsamang diwa ng εἴξαμεν at τῇ ὑποταγῇ, at pinanatili sa mga talababa ang literal na idyoma at ang kalabuan ng πρὸς ὑμᾶς.
