source:
  edition: SBLGNT
  text: Ἀγαπητέ, μὴ μιμοῦ τὸ κακὸν ἀλλὰ τὸ ἀγαθόν. ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν· ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/011.yaml
  text: Beloved[a], do not imitate what is evil, but what is good. The one who does good is from God; the one who does evil has not seen God.
translation:
  language: tl
  text: Minamahal, huwag mong tularan ang masama kundi ang mabuti. Ang gumagawa ng mabuti[a] ay mula sa Diyos; ang gumagawa ng masama ay hindi pa nakakita sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang patuloy na gumagawa ng mabuti … ang patuloy na gumagawa ng masama”; maaaring idiin ng mga participle sa Griyego ang nagpapatuloy o kinaugaliang asal.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Minamahal
  rationale: Isahang pantawag na nagpapahayag ng pagmamahal. Pinananatili ng “Minamahal” ang magiliw at marangal na himig na karaniwan sa mga sulat ni Juan.
- source_word: μὴ μιμοῦ
  choice: huwag mong tularan
  rationale: Ang kasalukuyang pautos na may μή ay pagbabawal. Likas sa modernong Tagalog ang “tularan” at pinananatili nito ang diwa ng paggaya sa isang asal o halimbawa.
- source_word: τὸ κακὸν
  choice: ang masama
  rationale: Ang pang-uring neuter na may artikulo ay ginagamit bilang pangngalan at tumutukoy sa pangkalahatang uri ng masamang asal, hindi lamang sa isang partikular na gawa.
- source_word: τὸ ἀγαθόν
  choice: ang mabuti
  rationale: Kaagapay ito ng τὸ κακόν at pinananatili ang tuwirang moral na paghahambing ng mabuti at masama.
- source_word: ὁ ἀγαθοποιῶν
  choice: Ang gumagawa ng mabuti
  rationale: Ang kasalukuyang aktibong participle na ginagamit bilang pangngalan ay maaaring tumukoy sa nagpapatuloy o kinaugaliang asal. Ang parirala ay natural sa Tagalog at hindi nililimitahan sa iisang gawa.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: ay mula sa Diyos
  rationale: Pinananatili ng “mula sa Diyos” ang diwa ng pinagmulan o kaugnayan sa Diyos na taglay ng ἐκ, nang hindi ito pinapalitan ng mas sistematikong paliwanag.
- source_word: ὁ κακοποιῶν
  choice: ang gumagawa ng masama
  rationale: Tuwirang kaagapay ng ὁ ἀγαθοποιῶν. Pinananatili nito ang pandiwang diwa at ang posibilidad ng nagpapatuloy o kinaugaliang paggawa.
- source_word: οὐχ ἑώρακεν τὸν θεόν
  choice: ay hindi nakakita sa Diyos
  rationale: Pinananatili ang tahasang talinghagang Johannine ng “pagkakita” at ang resultang diwa ng perfect tense, sa halip na ipakahulugan agad bilang “hindi nakakilala sa Diyos.”
theological_decisions:
- issue: Ugnayan ng moral na pamumuhay at kaugnayan sa Diyos sa pananalita ni Juan
  choice: Panatilihin ang mga pahayag na “mula sa Diyos” at “hindi nakakita sa Diyos.”
  alternative: Ipaliwanag ang mga ito bilang tiyak na doktrina ng muling kapanganakan, kawalan ng anumang dating kaugnayan sa Diyos, o moral na kasakdalan.
  rationale: Ang Griyego ay nagbibigay ng matinding pagsusuring moral at espirituwal sa sariling pananalita ni Juan. Hindi dapat pahinain ang babala o dagdagan ito ng isang denominasyonal na sistemang hindi tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Minamahal” upang mapanatili ang init ng pantawag, at ang magkatimbang na “gumagawa ng mabuti/gumagawa ng masama” upang ilantad ang estruktura at diin ng orihinal.
