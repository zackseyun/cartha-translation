  terminology: Ang “Diyos,” “mabuti,” “masama,” at “mula sa Diyos” ay angkop at pare-pareho sa modernong Filipino Tagalog. Hindi nagdaragdag ang salin ng doktrinal na paliwanag sa mga pahayag ni Juan.
