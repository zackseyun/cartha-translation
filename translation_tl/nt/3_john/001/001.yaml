    issue: Hindi likas ang “para kay minamahal na Gayo.”
    rationale: Sa Filipino, kailangan ang mas malinaw na ayos gaya ng “para kay Gayo, ang minamahal” upang maipahayag ang τῷ ἀγαπητῷ nang hindi nagmumukhang mali o bitin ang parirala.
  - severity: medium
