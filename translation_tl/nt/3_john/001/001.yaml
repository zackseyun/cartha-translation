  text: The elder to beloved Gaius[a], whom I love in truth.
translation:
  language: tl
  text: Mula sa Nakatatanda, para kay Gayo, ang minamahal, na minamahal ko sa katotohanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang tapat”; o “sa Katotohanan.” Maaaring ipahayag ng pariralang Griyego ang tapat na pag-ibig, pag-ibig na nakaugat sa katotohanan ng ebanghelyo, o kapuwa.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: Mula sa matanda
  rationale: Ginagamit ang pang-uri bilang pantukoy sa nagpadala. Ang “matanda” ay likas na katawagan sa Tagalog at pinananatili ang posibleng pahiwatig ng katayuan o tungkulin nang hindi gumagamit ng mas teknikal na “presbitero.”
- source_word: Γαΐῳ
  choice: para kay Gayo
  rationale: Ang datibong pangalan ay tumutukoy sa tatanggap ng liham. “Gayo” ang nakaugaliang anyong Filipino ng pangalang Γάϊος.
- source_word: τῷ ἀγαπητῷ
  choice: minamahal
  rationale: Ipinahahayag nito ang magiliw na pagtukoy sa tatanggap at pinananatili ang ugnayang leksikal nito sa kasunod na ἀγαπῶ.
- source_word: ὃν ἐγὼ ἀγαπῶ
  choice: na minamahal ko
  rationale: Ang panghalip na ὃν ang layon ng pandiwang ἀγαπῶ. Likas sa Tagalog ang sugnay na “na minamahal ko”; hindi kailangang gawing hayag ang banayad na diin ng ἐγώ.
- source_word: ἐν ἀληθείᾳ
  choice: sa katotohanan
  rationale: Pinananatili ng parirala ang tunay na kalabuan sa pagitan ng tapat na pag-ibig at pag-ibig na nakaugat o umiiral sa katotohanan, kasama ang teolohikal na alingawngaw nito sa mga sulat ni Juan.
theological_decisions:
- issue: Diwa ng ἐν ἀληθείᾳ sa pananalita ni Juan
  choice: sa katotohanan
  alternative: nang tapat; sa Katotohanan
  rationale: Maaaring tumukoy ang parirala sa katapatan ng pag-ibig, sa pag-ibig na nakaugat sa katotohanan ng ebanghelyo, o sa kapuwa. Hindi nilulutas ng salin ang sadyang lawak ng kahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang pormulang “Mula sa … para kay …” upang maging likas ang pambungad ng liham habang malinaw na ipinakikita ang nagpadala at tatanggap. Pinanatili ang “sa katotohanan” upang huwag paliitin ang ambiguwidad ng Griyego.
