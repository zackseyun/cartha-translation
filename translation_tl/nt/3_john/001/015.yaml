  text: Εἰρήνη σοι. ἀσπάζονταί σε οἱ φίλοι. ἀσπάζου τοὺς φίλους κατ’ ὄνομα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/015.yaml
  text: Peace to you[a]. The friends greet you[b]. Greet the friends by name.
translation:
  language: tl
  text: Sumaiyo ang kapayapaan.[a] Binabati ka ng mga kaibigan. Batiin mo ang mga kaibigan, bawat isa ayon sa pangalan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kapayapaan sa iyo.” Literal sa Griyego ang maikling pagpapalang “Kapayapaan sa iyo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Batiin mo nang isa-isa ang mga kaibigan.” Ang literal na Griyego ay “ayon sa pangalan,” na nagbibigay-diin sa personal na pagbati sa bawat isa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνη σοι
  choice: Sumaiyo ang kapayapaan
  rationale: Likas at marangal na pormula ng pagpapala sa Filipino na malinaw na nagpapahayag ng maikling Griyegong pagbati, ‘Kapayapaan sa iyo.’
- source_word: ἀσπάζονταί σε
  choice: Binabati ka
  rationale: Ang ἀσπάζομαι ay karaniwang pandiwa sa mga liham para sa pagbati; pinananatili ng salin ang tuwirang layon na ‘ka.’
- source_word: οἱ φίλοι / τοὺς φίλους
  choice: ang mga kaibigan
  rationale: Pinananatili ang natatanging φίλοι bilang ‘mga kaibigan’ at hindi ito pinapalitan ng ‘mga kapatid’ o dinaragdagan ng panghalip na wala sa Griyego.
- source_word: κατ’ ὄνομα
  choice: bawat isa ayon sa pangalan
  rationale: Ipinapakita ang literal na sangkap na ‘ayon sa pangalan’ at ang idyomatikong diwang personal o isa-isang pagbati.
