id: 3JN.1.12
reference: 3 John 1:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Δημητρίῳ μεμαρτύρηται ὑπὸ πάντων καὶ ὑπὸ αὐτῆς τῆς ἀληθείας· καὶ ἡμεῖς δὲ μαρτυροῦμεν, καὶ ⸀οἶδας ὅτι ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/012.yaml
  text: Demetrius has received testimony from everyone[a], and from the truth itself. We also testify[b], and you know that our testimony is true.
translation:
  language: tl
  text: Si Demetrio ay pinatotohanan ng lahat[a], at maging ng katotohanan mismo.[b] Nagpapatotoo rin kami, at alam mong totoo ang aming patotoo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “May patotoo tungkol kay Demetrio mula sa lahat.” Ang pandiwang Griyego ay nasa perpektong pasibo at nagpapahiwatig ng patotoong naitatag na tungkol sa kanya.
    reason: lexical_alternative
  - marker: b
    text: Ang “katotohanan mismo” ay maaaring mangahulugang ang buhay ni Demetrio ay kaayon ng katotohanan, o, sa mas malawak na diwa, na ang katotohanan o ebanghelyo mismo ay nagpapatotoo para sa kanya.
    reason: alternative_reading
lexical_decisions:
- source_word: Δημητρίῳ
  choice: Demetrio
  rationale: Ginamit ang nakaugaliang anyo sa Filipino ng personal na pangalang Griyego.
- source_word: μεμαρτύρηται
  choice: ay pinatotohanan
  rationale: Pinananatili ng perpektong pasibo ang diwang may naitatag nang patotoo tungkol kay Demetrio, nang hindi nagdaragdag ng tahasang salitang 'mabuti' na wala sa Griyego.
- source_word: ὑπὸ πάντων
  choice: ng lahat
  rationale: Likas at tuwirang ipinahahayag ang gumaganap sa pasibong pandiwa at pinananatili ang malawak na saklaw ng πάντων.
- source_word: ὑπὸ αὐτῆς τῆς ἀληθείας
  choice: ng katotohanan mismo
  rationale: Pinananatili ang pagbibigay-diin ng αὐτῆς at ang masaganang kahulugan ng Johannine na 'katotohanan' nang hindi ito nililimitahan sa ebanghelyo o sa asal ni Demetrio.
- source_word: καὶ ἡμεῖς δὲ μαρτυροῦμεν
  choice: Nagpapatotoo rin kami
  rationale: Ang 'rin' ay naghahatid ng pandagdag na puwersa, at inuugnay ng 'nagpapatotoo' ang pandiwa sa pangngalang 'patotoo' sa hulihan.
- source_word: οἶδας
  choice: alam mo
  rationale: Bagaman perpekto ang anyo, gumaganap ang οἶδα bilang pandiwang pangkasalukuyang kalagayan.
- source_word: ἡ μαρτυρία ἡμῶν
  choice: aming patotoo
  rationale: Natural sa Filipino at pinananatili ang leksikal na ugnayan sa 'nagpapatotoo.'
- source_word: ἀληθής ἐστιν
  choice: totoo
  rationale: Tuwirang salin na pinananatili rin ang ugnayang semantiko sa 'katotohanan' sa naunang parirala.
theological_decisions:
- issue: Kahulugan ng “katotohanan mismo” sa pananalitang Johannine
  choice: Panatilihin ang “katotohanan mismo.”
  alternative: “ang ebanghelyo mismo” o “ang pamumuhay niya ayon sa katotohanan”
  rationale: Hindi nililinaw ng Griyego kung ang tinutukoy ay ang ebanghelyo, ang buhay ni Demetrio na kaayon ng katotohanan, o isang mas malawak na personipikasyon ng katotohanan; kaya pinananatili ang tunay na kalabuan.
- issue: Kung tahasang positibo ang patotoo tungkol kay Demetrio
  choice: Huwag idagdag sa pangunahing teksto ang salitang “mabuti.”
  alternative: “may mabuting patotoo” o “mabuti ang sinasabi”
  rationale: Malinaw na papuri ang konteksto, ngunit walang tahasang katumbas ng “mabuti” sa Griyego. Ang mas pormal na anyo ay umiiwas sa di-kinakailangang pagdaragdag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinili ang bahagyang pormal na “pinatotohanan” upang mapanatili ang pasibong anyo at ang magkakaugnay na bokabularyo ng patotoo sa talata.
