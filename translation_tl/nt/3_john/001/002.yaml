  text: Ἀγαπητέ, περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν, καθὼς εὐοδοῦταί σου ἡ ψυχή.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/002.yaml
  text: Beloved[a], I pray that in all respects you may prosper and be healthy[d][c][b], just as your soul prospers.
translation:
  language: tl
  text: Minamahal, idinadalangin kong maging maayos ang iyong kalagayan sa lahat ng bagay[a] at maging malusog ka,[b] kung paanong maayos ang kalagayan ng iyong kaluluwa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “maging maayos ang lahat para sa iyo.” Ang Griyego ay tumutukoy sa saklaw (“sa lahat ng bagay”), hindi sa prayoridad (“higit sa lahat”).'
    reason: alternative_reading
  - marker: b
    text: O “nasa mabuting kalusugan ka.”
    reason: lexical_alternative
  - marker: c
    text: O “mabuti ang kalagayan ng iyong panloob na sarili”; maaari ring unawain na “maayos ang lahat sa iyong kaluluwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Minamahal
  rationale: Pinananatili ang magiliw na pantawag at ang malinaw na kaugnayan nito sa pag-ibig, nang hindi nagdaragdag ng salitang ‘kaibigan’ na wala sa Griyego.
- source_word: περὶ πάντων
  choice: sa lahat ng bagay
  rationale: Ipinahahayag ang saklaw ng panalangin—ukol sa lahat ng aspeto ng kalagayan ng kinakausap—sa halip na ang di-gaanong malamang na kahulugang ‘higit sa lahat.’
- source_word: εὔχομαί
  choice: idinadalangin ko
  rationale: Ang εὔχομαι sa konteksto ng liham ay maaaring magpahayag ng panalangin o taimtim na hangarin; ang ‘idinadalangin ko’ ay natural at angkop sa relihiyosong konteksto.
- source_word: σε εὐοδοῦσθαι
  choice: maging mabuti ang kalagayan mo
  rationale: Likas na Filipino itong pagpapahayag ng pagbuti o maayos na takbo ng kalagayan ng isang tao, at hindi nito nililimitahan ang diwa sa kayamanang materyal.
- source_word: ὑγιαίνειν
  choice: maging malusog ka
  rationale: Tuwirang tumutukoy sa mabuting pisikal na kalusugan at natural sa modernong Filipino.
- source_word: καθὼς
  choice: kung paanong
  rationale: Malinaw na naghahayag ng paghahambing sa panlabas o pisikal na kalagayan at sa kalagayan ng ψυχή.
- source_word: εὐοδοῦταί σου ἡ ψυχή
  choice: mabuti ang kalagayan ng iyong kaluluwa
  rationale: Inuulit ang pariralang ‘mabuti ang kalagayan’ upang mapanatili ang leksikal na alingawngaw ng dalawang anyo ng εὐοδόομαι sa Griyego.
- source_word: ψυχή
  choice: kaluluwa
  rationale: Pinananatili ang karaniwang salitang biblikal na maaaring tumukoy sa panloob na sarili, nang hindi tahasang itinatakda ang isang teknikal na antropolohiya.
theological_decisions:
- issue: Kahulugan ng περὶ πάντων sa pambungad na panalangin
  choice: sa lahat ng bagay, bilang pahayag ng saklaw
  alternative: higit sa lahat, bilang pahayag ng prayoridad
  rationale: Mas likas sa Griyego ang pagtukoy sa lahat ng larangan o aspeto ng kalagayan ng kinakausap kaysa ang pagsasabing ito ang pinakamataas na prayoridad.
- issue: Saklaw ng εὐοδοῦσθαι
  choice: maging mabuti ang kalagayan mo
  alternative: umunlad ka / yumaman ka
  rationale: Ang pandiwa ay tumutukoy sa maayos na takbo o mabuting kalagayan sa malawak na diwa. Iniiwasan ng salin ang pagpapakahulugang materyal o pinansiyal lamang.
- issue: Diwa ng ψυχή
  choice: kaluluwa
  alternative: panloob na sarili / buhay
  rationale: Pinananatili ng ‘kaluluwa’ ang pagkakaiba nito sa pisikal na kalusugan, ngunit ipinakikita sa talababa na hindi kailangang ipakahulugan ito bilang isang detalyadong doktrina tungkol sa mga bahagi ng tao.
translation_notes:
  register: Modernong Filipino na magalang at marangal ngunit madaling maunawaan. Ginamit ang ‘Minamahal’ bilang maikli at mapagmahal na pantawag. Ang ‘maging mabuti ang kalagayan’ ay piniling mas malawak kaysa ‘umunlad’ upang hindi magpahiwatig na kayamanang materyal lamang ang tinutukoy. Ang pag-uulit ng parirala sa dalawang sugnay ay sadyang nagpapanatili sa pag-uulit ng εὐοδόομαι sa Griyego.
