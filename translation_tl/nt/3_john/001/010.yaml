id: 3JN.1.10
reference: 3 John 1:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὰ τοῦτο, ἐὰν ἔλθω, ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ, λόγοις πονηροῖς φλυαρῶν ἡμᾶς, καὶ μὴ ἀρκούμενος ἐπὶ τούτοις οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφοὺς καὶ τοὺς βουλομένους κωλύει καὶ ἐκ τῆς ἐκκλησίας ἐκβάλλει.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/010.yaml
  text: For this reason[a], if I come, I will call attention to the works he is doing, maliciously babbling against us with evil words; and not content with these things, he himself does not receive the brothers[c][b], and he hinders those who want to do so and throws them out of the church.
translation:
  language: tl
  text: 'Dahil dito, kung pupunta ako, ipaaalaala ko ang mga ginagawa niya: naninira siya sa amin sa pamamagitan ng masasama at walang-saysay na salita. At hindi pa siya nasisiyahan sa mga ito; siya mismo ay hindi tumatanggap[a] sa mga kapatid[b], hinahadlangan niya ang mga gustong tumanggap sa kanila, at itinataboy niya sila palabas ng iglesya.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi malugod na pinatutuloy.” Ang pandiwang Griyego ay maaaring tumukoy sa pagtanggap o pagpapatuloy sa isang panauhin.
    reason: lexical_alternative
  - marker: b
    text: Malamang na ang “mga kapatid” ay mga naglalakbay na manggagawang Kristiyano o misyonero.
    reason: referent_clarification
  - marker: c
    text: O, “itinitiwalag niya sila sa iglesya.” Ang “iglesya” rito ay maaari ring isaling “kapulungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dahil dito
  rationale: Pinananatili ang malinaw na ugnayang sanhi o bunga sa naunang sinabi, sa natural na modernong Tagalog.
- source_word: ἐὰν ἔλθω
  choice: kung pupunta ako
  rationale: Natural sa pananaw ng sumulat ng liham at pinananatili ang kondisyonal na anyo.
- source_word: ὑπομνήσω
  choice: ipaaalaala ko
  rationale: Malapit sa pangunahing diwa ng pagpapaalaala o pagbibigay-pansin sa isang bagay, nang hindi tiyakang dinaragdagan na ito ay isang pormal o pampublikong paglalantad.
- source_word: αὐτοῦ τὰ ἔργα ἃ ποιεῖ
  choice: ang mga ginagawa niya
  rationale: Natural na katumbas ng konkretong maramihang ‘mga gawa’ at ipinakikitang nagpapatuloy ang kilos.
- source_word: λόγοις πονηροῖς φλυαρῶν ἡμᾶς
  choice: nagkakalat siya ng masasama at walang-kabuluhang salita laban sa amin
  rationale: Ipinahahayag ng ‘masasama’ ang πονηροῖς at ng ‘walang-kabuluhang’ ang diwa ng φλυαρέω na walang saysay o hangal na pagsasalita; pinananatili ng ‘laban sa amin’ ang mapanirang tuon.
- source_word: μὴ ἀρκούμενος ἐπὶ τούτοις
  choice: hindi pa siya nasisiyahan sa mga ito
  rationale: Natural na Tagalog para sa ideyang hindi siya nakontento at nagpatuloy pa sa ibang masamang gawain.
- source_word: οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφούς
  choice: siya mismo ay hindi tumatanggap sa mga kapatid
  rationale: Pinananatili ang pagbibigay-diin ng αὐτός at ang malawak na diwa ng pagtanggap o malugod na pagpapatuloy.
- source_word: τοὺς ἀδελφούς
  choice: mga kapatid
  rationale: Karaniwang katawagang pampamilya sa kapwa Cristiano sa Tagalog; hindi nito ipinipilit kung ang tinutukoy ay eksklusibong mga lalaki, bagaman malamang na mga naglalakbay na manggagawang Cristiano ang konteksto.
- source_word: τοὺς βουλομένους κωλύει
  choice: hinahadlangan niya ang mga gustong tumanggap sa kanila
  rationale: Nililinaw ang ipinahihiwatig na layon mula sa naunang sugnay, habang pinananatili ang kusang hangarin at malawak na diwa ng paghadlang.
- source_word: ἐκ τῆς ἐκκλησίας ἐκβάλλει
  choice: itinataboy niya sila palabas ng iglesya
  rationale: Pinananatili ang malakas at patuloy na kilos ng ἐκβάλλει nang hindi agad nililimitahan sa isang teknikal na proseso ng pagtitiwalag.
theological_decisions:
- issue: Saklaw ng τοὺς ἀδελφούς sa konteksto ng pagtanggap at pagpapatuloy
  choice: mga kapatid
  alternative: mga lalaking kapatid; mga kapwa mananampalataya
  rationale: Ang gramatikal na anyo ay panlalaking maramihan at malamang na tumutukoy sa mga naglalakbay na manggagawang Cristiano. Gayunman, likas na ginagamit sa Tagalog ang ‘mga kapatid’ para sa katawagang Cristiano at hindi nito sapilitang nilulutas ang posibleng saklaw ng reperensiya.
- issue: Uri ng pagpapaalis mula sa ἐκκλησία
  choice: itinataboy niya sila palabas ng iglesya
  alternative: itinitiwalag niya sila sa iglesya
  rationale: Malakas ang pandiwang ἐκβάλλει at malinaw na may pagbubukod sa lokal na kapulungan, ngunit hindi tahasang inilalarawan ng teksto ang isang pormal na prosesong pansimbahan; kaya inilagay ang mas teknikal na pagbasa sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “iglesya” bilang pamilyar na katawagan sa lokal na kapulungang Cristiano. Iniwasan ang sobrang teknikal na wikang pansimbahan sa pangunahing teksto, at inilagay sa mga talababa ang mahahalagang alternatibong leksikal.
