  source_fidelity: 'Ang pangunahing diwa ay tumpak na naipapahayag: kondisyonal ang pagdating ng sumulat, ilalantad niya ang mga ginagawa ng tao, naninira ito sa kanila sa masasamang pananalita, tumatangging tumanggap ng mga kapatid, hinahadlangan ang iba, at pinalalabas sila sa kapulungan. Gayunman, mas angkop na ilarawan ang φλυαρῶν bilang walang-saysay na mapanirang pagsasalita kaysa "nagkakalat," na maaaring magpahiwatig ng pagpapalaganap na hindi tahasang nasa pandiwa.'
  naturalness: Natural at malinaw ang register. Pinakinis ang unang bahagi upang ang mapanirang pananalita ay manatiling kaugnay ng "mga ginagawa niya," tulad ng participial na ayos sa Griyego.
  terminology: Ang "mga kapatid" at "iglesya" ay angkop. Inayos ang talababa tungkol sa ἐπιδέχεται upang nakatali ang panandang a sa pandiwang "tumatanggap," hindi sa layong "mga kapatid." Ginamit ang modernong baybay na "Kristiyano."
