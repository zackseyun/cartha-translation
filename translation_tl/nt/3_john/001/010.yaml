  - severity: low
    issue: Ang "nagkakalat" ay bahagyang mas tiyak kaysa φλυαρῶν
    rationale: Ang φλυαρέω ay tumutukoy sa walang-saysay o hangal na mapanirang pagsasalita. Maaaring magpahiwatig ang "nagkakalat" ng aktibong pagpapalaganap; ang "naninira ... sa pamamagitan ng masasama at walang-saysay na salita" ay mas tuwirang sumasaklaw sa dalawang salitang Griyego.
