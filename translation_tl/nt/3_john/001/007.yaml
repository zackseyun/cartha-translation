  yaml_path: translation/nt/3_john/001/007.yaml
  text: For they went out for the sake of the Name[a], taking nothing from the Gentiles.
translation:
  language: tl
  text: Sapagkat alang-alang sa Pangalan ay humayo sila, na walang tinatanggap mula sa mga Hentil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pagano” o “mga hindi mananampalataya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: alang-alang sa
  rationale: Sa pariralang ito na may genitive na “Pangalan,” ipinapahayag ng ὑπέρ ang dahilan o layunin, hindi ang pagpapalit. Likas at malinaw sa Tagalog ang “alang-alang sa.”
- source_word: τοῦ ὀνόματος
  choice: sa Pangalan
  rationale: Literal itong “ang Pangalan,” isang mapitagang katawagan na tumutukoy kay Jesus o sa Panginoon nang hindi tahasang inuulit ang tinutukoy. Pinananatili ng malaking titik ang natatanging gamit nito nang hindi nagdaragdag ng pangngalang wala sa Griyego.
- source_word: ἐξῆλθον
  choice: humayo sila
  rationale: Ang aorist active indicative ay tumutukoy sa kanilang pag-alis o paghayo, malamang para sa gawaing pagmimisyon. Dignified at natural sa salaysay ang “humayo sila.”
- source_word: μηδὲν λαμβάνοντες
  choice: wala silang tinanggap na anuman
  rationale: Ipinakikita ng participial phrase ang kalagayan o paraan ng kanilang paghayo. Malinaw na ipinahihiwatig ng “tinanggap” ang hindi pagtanggap ng materyal o pinansiyal na tulong.
- source_word: ἀπὸ τῶν ἐθνικῶν
  choice: mula sa mga Hentil
  rationale: Ang ἐθνικοί ay tumutukoy rito sa mga hindi kabilang sa pamayanang Cristiano, na may etniko at panrelihiyong kulay. Pinananatili ng “mga Hentil” ang makasaysayang pananaw at ugnayang leksikal ng termino.
theological_decisions:
- issue: Ang tinutukoy ng “Pangalan”
  choice: Pinanatili bilang mapitagang “Pangalan,” na nagpapahiwatig kay Jesus o sa Panginoon.
  alternative: “pangalan ni Cristo,” “kanyang pangalan,” o “pangalan ng Panginoon”
  rationale: Hindi tahasang binabanggit ng teksto kung kaninong pangalan iyon. Ang pagpapanatili sa “Pangalan” ay nag-iingat sa teolohikal na bigat at pahiwatig ng orihinal nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- issue: Kahulugan ng ἐθνικῶν
  choice: “mga Hentil” sa pangunahing teksto
  alternative: “mga pagano” o “mga hindi mananampalataya”
  rationale: Maaaring gumana ang salita bilang katawagan sa mga tagalabas sa pananampalataya, ngunit higit na pinananatili ng “mga Hentil” ang anyong leksikal at makasaysayang balangkas ng sinaunang pamayanang Judio-Cristiano. Inilalahad sa talababa ang mga kontekstuwal na alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “humayo” upang ipahiwatig ang sadyang pag-alis para sa misyon nang hindi nagiging lipas o labis na teknikal. Inilagay ang talababa pagkatapos ng “mga Hentil,” ang salitang tinutukoy nito.
