  text: Beloved[a], you are acting faithfully in whatever you do for the brothers[b], and especially when they are strangers.
translation:
  language: tl
  text: Minamahal, tapat kang kumikilos sa anumang ginagawa mo para sa mga kapatid[a], lalo na’t mga estranghero sila sa iyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay tumutukoy rito sa mga kapwa mananampalataya. Panlalaking maramihan ang anyo ng salitang Griyego, ngunit maaaring kabilang sa tinutukoy na pangkat ang mga babae.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “at ito ay sa mga estranghero,” o “at ito—mga estranghero.” Ang maikling pariralang Griyego ay malamang na naglalarawan sa mga kapatid bilang hindi personal na kilala ng sinulatan; hindi ito kinakailangang tumukoy sa mga dayuhan.'
    reason: translation_ambiguity
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Minamahal
  rationale: Isahang pantawag na nagpapahayag ng mainit na pagmamahal. Mas malapit ito sa ἀγαπητέ kaysa sa mas interpretibong “Mahal kong kaibigan.”
- source_word: πιστὸν ποιεῖς
  choice: kumikilos ka nang tapat
  rationale: Idyomatikong ipinahahayag ang literal na “gumagawa ka ng isang tapat na bagay,” habang pinananatili ang papuri sa katapatan at pagiging maaasahan ni Gayo.
- source_word: ὃ ἐὰν ἐργάσῃ
  choice: sa anumang ginagawa mo
  rationale: Ang panghalip na may ἐάν at pasakaling panagano ay may di-tiyak na diwang “anuman.” Ang “ginagawa” ay likas sa Tagalog at sapat ang lawak para sa praktikal na pagtulong na tinutukoy.
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: para sa mga kapatid
  rationale: Likas na ipinahahayag ng “para sa” ang kapakinabangang diwa ng εἰς sa konteksto. Ang “mga kapatid” ay karaniwang tawag sa mga kapwa mananampalataya at hindi artipisyal na nagtatakda ng kasarian sa Tagalog.
- source_word: καὶ τοῦτο ξένους
  choice: lalo na kapag hindi mo sila kilala
  rationale: Ipinahahayag nito ang mariing papuri na tumutukoy sa mga kapatid na estranghero kay Gayo. Ang “hindi mo sila kilala” ay mas natural at mas tiyak sa konteksto ng pagpapatuloy kaysa sa “mga dayuhan,” na maaaring maling magpahiwatig ng ibang lahi o bansa.
theological_decisions:
- issue: Pagkakaugnay ng ξένους sa τοὺς ἀδελφούς
  choice: Ang mga hindi kilala ay mga kapatid ding tinutulungan ni Gayo.
  alternative: 'Maaaring basahin ang parirala bilang hiwalay na pagtukoy: “at ginagawa mo rin ito sa mga estranghero.”'
  rationale: Magkatugma sa accusative plural ang ξένους at τοὺς ἀδελφούς, kaya pinakamalamang na inilalarawan ng ξένους ang mga kapatid. Gayunman, pinananatili sa talababa ang mas literal na anyo dahil maigsi at sintaktikong masinsin ang Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Minamahal” upang mapanatili ang mainit na himig ng liham, at ang “hindi mo sila kilala” upang maiwasan ang maling pambansang o etnikong pahiwatig ng “dayuhan.”
