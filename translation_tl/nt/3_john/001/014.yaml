  text: ἐλπίζω δὲ εὐθέως ⸂σε ἰδεῖν⸃, καὶ στόμα πρὸς στόμα λαλήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/014.yaml
  text: But I hope to see you soon[a], and we will speak face to face.
translation:
  language: tl
  text: Ngunit umaasa akong makita ka sa lalong madaling panahon, at mag-uusap tayo nang harap-harapan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “bibig sa bibig,” isang idyoma para sa tuwirang pag-uusap nang personal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: umaasa ako
  rationale: Likas na ipinahahayag ng pangkasalukuyang pandiwa ang pag-asa ng sumulat; malinaw at karaniwan ang “umaasa ako” sa makabagong Tagalog.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ng δέ ang banayad na pagsalungat o paglipat mula sa naunang sinabi tungkol sa pagsusulat.
- source_word: εὐθέως
  choice: sa lalong madaling panahon
  rationale: Sa konteksto ng inaasahang pagdalaw, tumutukoy ito sa nalalapit na panahon, hindi sa agarang pagkilos sa mismong sandali.
- source_word: σε ἰδεῖν
  choice: makita ka
  rationale: Tuwirang katumbas ito ng infinitive at hindi dinaragdagan ng mas tiyak na diwang “dalawin ka.”
- source_word: στόμα πρὸς στόμα
  choice: nang harapan
  rationale: Literal itong “bibig sa bibig,” ngunit isang idyoma para sa tuwirang pag-uusap na personal; natural at hindi nakalilinlang ang “nang harapan” sa Tagalog.
- source_word: λαλήσομεν
  choice: mag-uusap tayo
  rationale: Ang panghinaharap na anyo ay tumutukoy sa inaasahang pag-uusap; mas natural sa Tagalog ang inklusibong konstruksiyong “mag-uusap tayo” kaysa sa literal na “magsasalita tayo.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang banayad na paglipat ng δέ at isinalin nang idyomatiko ang στόμα πρὸς στόμα, habang ipinaliliwanag sa talababa ang literal na anyo.
