  naturalness: Natural at marangal ang pangunahing daloy kapag ginamit ang "May isinulat ako sa iglesya, ngunit hindi kami tinatanggap ni Diotrefes." Ang "na gustong maging una sa kanila" ay malinaw at hindi nagpapalagay ng pormal na katungkulan.
  terminology: Ang "iglesya," "Diotrefes," at "tanggapin" ay angkop sa modernong Filipino Tagalog. Pinananatili ng "tanggapin" ang malawak na kahulugan ng ἐπιδέχεται at hindi ito ikinakahon sa pagpapatuloy o pagkilala sa awtoridad.
