id: 3JN.1.9
reference: 3 John 1:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἔγραψά ⸀τι τῇ ἐκκλησίᾳ· ἀλλ’ ὁ φιλοπρωτεύων αὐτῶν Διοτρέφης οὐκ ἐπιδέχεται ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/009.yaml
  text: I wrote something to the church[a], but Diotrephes, who loves to be first among them[b], does not receive us.
translation:
  language: tl
  text: May isinulat ako sa iglesya[a], ngunit hindi kami tinatanggap[b] ni Diotrefes, na gustong maging una sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sumulat ako ng isang bagay sa iglesya.” Di-tiyak ang pananalita sa Griyego, at pinalawak ang pagkakasabi sa ilang manuskrito.
    reason: textual_variant
  - marker: b
    text: Ang “tinatanggap” ay maaari ring mangahulugang “pinatutuluyan” o “kinikilala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψά
  choice: May isinulat ako
  rationale: Likas na paraan sa modernong Tagalog upang ipahayag ang payak na nakaraang kilos habang naiuugnay sa kasunod na di-tiyak na panghalip.
- source_word: τι
  choice: may isinulat
  rationale: Pinananatili ang di-tiyak na diwa ng τι nang hindi dinaragdagan ng tahasang bagay gaya ng “maikling liham,” na wala sa SBLGNT.
- source_word: τῇ ἐκκλησίᾳ
  choice: sa iglesya
  rationale: Karaniwan at madaling maunawaang katawagan para sa lokal na kapulungan ng mga Cristiano.
- source_word: ἀλλ’
  choice: ngunit
  rationale: Malinaw at marangal na panandang pasalungat sa kilos ng sumulat at tugon ni Diotrefes.
- source_word: ὁ φιλοπρωτεύων
  choice: na gustong maging una
  rationale: Natural na Filipino na naghahatid ng pagnanais niyang manguna nang hindi ipinapalagay ang isang pormal na katungkulan.
- source_word: αὐτῶν
  choice: sa kanila
  rationale: Ipinahihiwatig ang pangkat na kinaroroonan niya; hindi nito ipinapasya kung ang tinutukoy ay pagiging una “sa gitna” nila o pamumuno “sa ibabaw” nila.
- source_word: Διοτρέφης
  choice: Diotrefes
  rationale: Isinalin sa anyong transliterasyong madaling bigkasin sa Filipino.
- source_word: οὐκ ἐπιδέχεται ἡμᾶς
  choice: ayaw tayong tanggapin
  rationale: 'Ang “tanggapin” ay nananatiling malawak: maaaring tumukoy sa pagtanggap bilang panauhin, pagkilala, o pagtanggap sa kanilang mensahe at papel. Inihahatid ng “ayaw” ang sadyang pagtanggi ng pangkasalukuyang pandiwa na may negasyon.'
theological_decisions:
- issue: Saklaw ng pagtutol ni Diotrefes
  choice: ayaw tayong tanggapin
  alternative: hindi niya tayo tinatanggap; ayaw niya tayong patuluyin; ayaw niya tayong kilalanin
  rationale: Hindi nililimitahan ng salin ang ἐπιδέχεται sa pagpapatuloy lamang o sa pagkilala sa awtoridad lamang. Pinananatili nito ang posibleng pagsasanib ng personal na pagtanggap, pakikitungo, at pagkilala sa mga kinatawan ng sumulat.
- issue: Uri ng pagiging una ni Diotrefes
  choice: gustong maging una sa kanila
  alternative: gustong mamuno sa kanila; gustong maging pinuno nila
  rationale: Hindi tahasang nagsasaad ang φιλοπρωτεύων ng opisyal na katungkulan. Ang salin ay nagpapanatili sa moral na puna sa hangarin niyang manguna nang hindi nagdaragdag ng tiyak na estrukturang pansimbahan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “iglesya” bilang pamilyar na katawagan sa lokal na kapulungan. Iniwasan ang mas makitid na “patuluyin” o “kilalanin” sa pangunahing teksto upang mapanatili ang lawak ng Griyego. Ang ayos ng pangungusap ay ginawang natural sa Tagalog habang pinananatili ang malinaw na pagsalungat.
