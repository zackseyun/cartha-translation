base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/004.yaml
  text: 'I have no greater joy than this: to hear that my children are walking in the truth[a][b].'
translation:
  language: tl
  text: 'Wala akong higit na kagalakan kaysa rito: ang marinig na ang aking mga anak ay namumuhay sa katotohanan.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “Wala akong kagalakang higit kaysa sa mga bagay na ito.”
    reason: lexical_alternative
  - marker: b
    text: Ang “aking mga anak” ay malamang na tumutukoy sa mga espirituwal na anak ng may-akda—mga mananampalatayang nasa ilalim ng kanyang pangangalaga.
    reason: cultural_note
lexical_decisions:
- source_word: μειζοτέραν ... χαράν
  choice: higit na kagalakan
  rationale: Likas na Filipino para sa paghahambing na ‘greater joy,’ habang pinananatili ang diin ng Griyego.
- source_word: τούτων
  choice: kaysa rito
  rationale: Bagaman pangmaramihan ang anyong Griyego (‘kaysa sa mga bagay na ito’), tumutukoy ito sa kasunod na nilalaman; mas natural sa Filipino ang isahang ‘rito.’
- source_word: ἵνα ἀκούω
  choice: ang marinig na
  rationale: Ipinakikilala rito ng ἵνα ang nilalaman ng kagalakan, hindi isang layunin; natural itong naipahahayag sa ‘ang marinig na.’
- source_word: τὰ ἐμὰ τέκνα
  choice: ang aking mga anak
  rationale: Pinananatili ang literal at mapagmahal na talinghagang pampamilya nang hindi tahasang nililimitahan sa espirituwal na mga anak.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: sa katotohanan
  rationale: 'Pinananatili ang lawak ng gamit ni Juan: maaaring saklaw nito kapuwa ang tunay na aral at pamumuhay na naaayon dito.'
- source_word: περιπατοῦντα
  choice: namumuhay
  rationale: Ang ‘lumalakad’ ay literal ngunit maaaring maging di-likas o malabo sa karaniwang modernong Filipino; ipinahahayag ng ‘namumuhay’ ang idyomatikong diwa ng asal o paraan ng buhay.
theological_decisions:
- issue: Kung ang τέκνα ay literal na mga anak o espirituwal na mga anak
  choice: Panatilihin sa pangunahing teksto ang ‘aking mga anak.’
  alternative: ‘aking mga anak sa pananampalataya’ o ‘mga taong nadala ko sa pananampalataya’
  rationale: Malakas na ipinahihiwatig ng konteksto na mga mananampalatayang nasa malasakit ni Juan ang tinutukoy, ngunit ang Griyego ay gumagamit lamang ng salitang pampamilya. Iniiwasan ng salin na gawing tahasan ang ipinahihiwatig lamang.
- issue: Saklaw ng ἐν τῇ ἀληθείᾳ
  choice: ‘sa katotohanan’
  alternative: ‘nang tapat’ o ‘ayon sa tunay na aral’
  rationale: Sa mga sulat ni Juan, ang ‘katotohanan’ ay maaaring tumukoy kapuwa sa katotohanang pinaniniwalaan at sa buhay na naaayon dito. Hindi nilulutas ng salin ang sadyang malawak na diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘namumuhay’ sa halip na literal na ‘lumalakad’ upang natural na maipahayag ang talinghaga ng Griyego tungkol sa paraan ng pamumuhay; pinanatili naman ang ‘sa katotohanan’ upang huwag paliitin ang teolohikal at etikal na saklaw nito.
