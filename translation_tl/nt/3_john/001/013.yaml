  text: Πολλὰ εἶχον ⸂γράψαι σοι⸃, ἀλλ’ οὐ θέλω διὰ μέλανος καὶ καλάμου σοι ⸀γράφειν·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/013.yaml
  text: I had many things to write to you[a], but I do not want to write to you with ink and pen;
translation:
  language: tl
  text: Marami sana akong isusulat sa iyo, ngunit ayaw kong sumulat sa iyo gamit ang tinta at panulat na tambo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gamit ang tinta at panulat”; ang salitang Griyego ay literal na tumutukoy sa tambo na ginagamit na panulat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ
  choice: Marami
  rationale: Pangngalang gamit ng pangmaramihang neutral na pang-uri; sa Filipino, likas na ipinahihiwatig ng “marami” ang “maraming bagay” nang hindi kailangang idagdag ang “bagay.”
- source_word: εἶχον γράψαι σοι
  choice: sana akong isusulat sa iyo
  rationale: Ang imperfect na εἶχον kasama ng aorist infinitive ay tumutukoy sa maraming nilalamang balak sanang isulat. Ang “sana akong isusulat” ay natural sa modernong Filipino at pinananatili ang di-natupad na intensiyon.
- source_word: ἀλλ’ οὐ θέλω
  choice: ngunit ayaw kong
  rationale: Malinaw at kasalukuyang Filipino para sa pagtanggi ng kalooban o pagnanais, habang ang “ngunit” ay angkop sa marangal na liham.
- source_word: διὰ μέλανος καὶ καλάμου
  choice: gamit ang tinta at panulat na tambo
  rationale: Ang διά na may genitive ay nagsasaad ng kasangkapan. Ang μέλαν ay tinta at ang κάλαμος ay literal na tambo na ginamit bilang panulat; pinananatili rito ang kongkretong larawan ng orihinal.
- source_word: γράφειν
  choice: sumulat
  rationale: Ang payak na pawatas ay natural na katumbas; hindi labis na tinutukoy ang aspektong maaaring magpahiwatig ng nagpapatuloy na proseso.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “panulat na tambo” upang mapanatili ang kongkretong kahulugan ng κάλαμος, at inilagay sa talababa ang mas karaniwang “panulat.”
