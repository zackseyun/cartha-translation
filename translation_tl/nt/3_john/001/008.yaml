base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/008.yaml
  text: Therefore[a], we ought to receive such people[b], so that we may become fellow workers for the truth.
translation:
  language: tl
  text: Kaya dapat nating tanggapin[b] ang mga taong gaya nila, upang maging kamanggagawa tayo para sa katotohanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kasama ng katotohanan” o “sa katotohanan.” Maaaring unawain sa higit sa isang paraan ang Griyegong datibo; ang pangunahing salin ay nagpapahiwatig ng pakikibahagi sa gawaing naglilingkod sa katotohanan.
    reason: alternative_reading
  - marker: b
    text: Ang pandiwang isinaling “tanggapin” ay maaari ring magpahiwatig ng malugod na pagtanggap, pagbibigay ng panunuluyan, at praktikal o materyal na pagsuporta sa gayong naglalakbay na mga manggagawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: nating / tayo
  rationale: Pinananatili ang tahasang panghalip at ang pagbibigay-diin sa sama-samang pananagutan ng manunulat at mga mambabasa.
- source_word: οὖν
  choice: Kaya
  rationale: Likas sa makabagong Tagalog at malinaw na nagpapahayag ng kongklusyon mula sa naunang talata.
- source_word: ὀφείλομεν
  choice: dapat nating
  rationale: Ipinahahayag ang moral na pananagutan nang hindi lumalampas sa lakas ng Griyego.
- source_word: ὑπολαμβάνειν
  choice: tanggapin
  rationale: Sa konteksto, tumutukoy ito sa malugod na pagtanggap sa naglalakbay na mga lingkod at maaaring saklawin ang praktikal o materyal na pagsuporta; ipinaliliwanag ang lawak nito sa talababa.
- source_word: τοὺς τοιούτους
  choice: ang mga taong tulad nila
  rationale: Tumutukoy sa mga taong gaya ng mga naglalakbay na manggagawang nabanggit, nang hindi ginagawang di-kinakailangang tiyak sa kasarian ang uri ng mga tinutukoy.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at marangal na panandang nagpapahayag ng layunin o bunga.
- source_word: συνεργοὶ
  choice: mga kamanggagawa
  rationale: Pinananatili ang diwa ng aktibong pakikibahagi sa gawain, hindi lamang pasibong pagsang-ayon.
- source_word: γινώμεθα
  choice: maging ... tayo
  rationale: Pinananatili ang diwa ng pagdating sa kalagayang ito dahil sa pagtanggap at pagsuporta sa kanila.
- source_word: τῇ ἀληθείᾳ
  choice: para sa katotohanan
  rationale: Ipinahahayag na ang pakikipagtulungan ay para sa kapakanan o pagsusulong ng katotohanan, habang pinananatili sa talababa ang iba pang posibleng pagkaunawa sa datibo.
theological_decisions:
- issue: Kaugnayan at kahulugan ng τῇ ἀληθείᾳ sa συνεργοὶ
  choice: “para sa katotohanan,” na nagpapahiwatig ng pakikibahagi sa gawaing naglilingkod sa katotohanan
  alternative: “kasama ng katotohanan” o “sa katotohanan”
  rationale: Ang konteksto ay tungkol sa pagsuporta sa mga naglalakbay alang-alang sa Pangalan. Ang pangunahing salin ay natural na nagpapahayag ng pakikibahagi sa kanilang gawain, ngunit hindi tuluyang nilulutas ang maaaring ibang gamit ng Griyegong datibo; nakatala ang mga alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Kaya” sa halip na mas mabigat na “Samakatuwid,” at ang “mga kamanggagawa” upang mapanatili ang wikang sama-samang paglilingkod. Inilagay ang mga pananda ng talababa sa mismong pariralang tinatalakay ng bawat tala.
