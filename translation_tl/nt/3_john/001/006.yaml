  text: οἳ ἐμαρτύρησάν σου τῇ ἀγάπῃ ἐνώπιον ἐκκλησίας, οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/006.yaml
  text: They testified before the church about your love[a], and you will do well to send them on their way in a manner worthy of God.
translation:
  language: tl
  text: Nagpatotoo sila sa harap ng iglesya tungkol sa iyong pag-ibig, at mabuti ang gagawin mo kung papayaunin mo sila sa kanilang paglalakbay[a] sa paraang karapat-dapat sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tutulungan mo silang maipagpatuloy ang kanilang paglalakbay”; ang pandiwang Griego ay maaaring mangahulugan ng pagpapayaon sa mga manlalakbay na may kasamang praktikal na tulong o panustos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησάν
  choice: Nagpatotoo sila
  rationale: Ang aorist indicative ay tumutukoy sa isang naganap na pagpapatotoo. Likas at tuwiran sa Tagalog ang payak na aspektong naganap na “nagpatotoo,” at napapanatili nito ang diwa ng pag-uulat o pagsaksi.
- source_word: σου τῇ ἀγάπῃ
  choice: tungkol sa iyong pag-ibig
  rationale: Maaaring tukuyin ng datibo ang nilalaman o paksa ng kanilang patotoo. Ang “tungkol sa iyong pag-ibig” ay malinaw at natural, habang pinananatili ng “pag-ibig” ang karaniwang salin ng ἀγάπη.
- source_word: ἐνώπιον ἐκκλησίας
  choice: sa harap ng iglesya
  rationale: Ipinahihiwatig ng ἐνώπιον ang hayagang pagsasalita sa presensiya ng kapulungan. Sa konteksto ng liham, ang ἐκκλησία ay ang nagkakatipong pamayanang Cristiano, kaya ang “iglesya” ay angkop.
- source_word: καλῶς ποιήσεις
  choice: mabuti ang gagawin mo
  rationale: Pinananatili nito ang anyong panghinaharap at ang magalang na lakas ng isang paghikayat, sa halip na gawing tahasang utos.
- source_word: προπέμψας
  choice: kung tutulungan mo silang maipagpatuloy ang kanilang paglalakbay
  rationale: Sa ganitong konteksto, ang προπέμπω ay hindi lamang pagpapaalis o paghatid kundi maaaring magsangkot ng praktikal na tulong upang makapagpatuloy ang mga manlalakbay. Natural na naipapahayag ito sa Tagalog sa napiling parirala nang hindi nililimitahan ang uri ng tulong.
- source_word: ἀξίως τοῦ θεοῦ
  choice: sa paraang karapat-dapat sa Diyos
  rationale: Ipinapahayag ng ἀξίως ang paraan o pamantayan ng pagkilos. Pinananatili ng salin ang bigat ng panawagang kumilos ayon sa karangalan ng Diyos.
theological_decisions:
- issue: Saklaw ng προπέμπω sa Cristianong pagtanggap at pagtulong sa mga naglalakbay
  choice: “tutulungan mo silang maipagpatuloy ang kanilang paglalakbay” sa pangunahing teksto, na may talababa tungkol sa mas literal na diwa ng pagpapayaon
  alternative: “ihahatid mo sila sa kanilang paglalakbay” o “payaunin mo sila”
  rationale: Maaaring saklawin ng pandiwa ang paghahatid at pagbibigay ng kailangan sa patuloy na paglalakbay. Ipinakikita ng pangunahing salin ang praktikal na pagtulong ngunit hindi nito tinutukoy kung salapi, panustos, kasama, o iba pang tulong ang ibinigay.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “iglesya” para sa nagkakatipong pamayanang Cristiano at “pag-ibig” para sa ἀγάπη. Pinanatili ang iisang pangungusap upang masundan ang ugnayan ng dalawang sugnay sa Griego.
