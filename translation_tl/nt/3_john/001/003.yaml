  text: For I rejoiced greatly when brothers came and testified to your truth[c][b][a], just as you are walking in truth.
translation:
  language: tl
  text: Sapagkat lubha akong nagalak nang dumating ang mga kapatid[a] at nagpatotoo tungkol sa iyong katotohanan[b], kung paanong lumalakad ka sa katotohanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kapatid na lalaki at babae,” na tumutukoy sa mga kapuwa mananampalataya; ang salitang Griyego ay nasa panlalaking anyong maramihan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagpatotoo tungkol sa iyong katapatan sa katotohanan” o “tungkol sa katotohanang nasa iyo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐχάρην γὰρ λίαν
  choice: Sapagkat lubha akong nagalak
  rationale: Pinananatili ng “Sapagkat” ang paliwanag na ugnayan sa naunang talata, at malinaw na ipinahahayag ng “lubha akong nagalak” ang matinding kagalakan ng aorist na ἐχάρην at ng pang-abay na λίαν.
- source_word: ἐρχομένων ἀδελφῶν
  choice: nang dumating ang mga kapatid
  rationale: Likas na ipinahahayag sa Filipino ng “nang dumating” ang temporal na gamit ng participle. Pinananatili ng “mga kapatid” ang literal na pananalitang pampamilya ng unang mga Cristiano.
- source_word: μαρτυρούντων
  choice: nagpatotoo
  rationale: Pinananatili nito ang diwa ng pagbibigay-saksi sa μαρτυρέω at mas malakas kaysa sa simpleng “nagbalita” o “nag-ulat.”
- source_word: σου τῇ ἀληθείᾳ
  choice: tungkol sa iyong katotohanan
  rationale: Ang “tungkol sa” ay likas na Filipino para sa paksa o nilalaman ng patotoo. Pinananatili ng “iyong katotohanan” ang possessive na σου at ang tunay na kalabuan kung tumutukoy ito sa katotohanang taglay at isinasabuhay ni Gayo o sa kaniyang katapatan sa katotohanan.
- source_word: καθὼς
  choice: kung paanong
  rationale: Malinaw nitong ipinakikita ang pagtutugma ng patotoo ng mga kapatid at ng aktuwal na pamumuhay ng kinakausap.
- source_word: ἐν ἀληθείᾳ περιπατεῖς
  choice: lumalakad ka sa katotohanan
  rationale: Pinananatili ang karaniwang metaporang etikal ng περιπατέω at ang pag-uulit ng ἀλήθεια, sa halip na paliitin ang kahulugan nito sa doktrina o asal lamang.
theological_decisions:
- issue: Kahulugan ng ἀλήθεια sa kontekstong etikal ni Juan
  choice: katotohanan sa dalawang paglitaw
  alternative: katapatan; katotohanang nasa iyo
  rationale: Ang pare-parehong saling “katotohanan” ay nagpapanatili sa sabayang teolohikal at etikal na bigat ng salita—kabilang ang pinaniniwalaan, kinikilala, at isinasabuhay—nang hindi nilulutas nang labis ang ugnayan ng mga ito.
- issue: Kahulugan ng σου τῇ ἀληθείᾳ
  choice: tungkol sa iyong katotohanan
  alternative: tungkol sa iyong katapatan sa katotohanan; tungkol sa katotohanang nasa iyo
  rationale: Pinananatili ng pangunahing teksto ang possessive na kayarian ng Griyego at ang kalabuan nito. Inilalagay sa talababa ang mas malinaw ngunit mas mapagpasyang mga pagpapakahulugan.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang likas na “tungkol sa” sa pandiwang “nagpatotoo,” ngunit pinanatili ang bahagyang di-karaniwang “iyong katotohanan” upang huwag ikubli ang kalabuan ng Griyego. Pinanatili rin ang metaporang “lumalakad sa katotohanan,” na malinaw sa kontekstong biblikal at mahalaga sa estilo ni Juan.
