revisions:
- from: At lalo pang lumalim ang pagmamahal niya sa inyo kapag naaalaala niya ang pagsunod ninyong lahat at kung paano ninyo siya tinanggap nang may takot at panginginig.[a]
  to: At lalong umaapaw ang pagmamahal niya sa inyo habang naaalaala niya ang pagsunod ninyong lahat—kung paano ninyo siya tinanggap nang may takot at panginginig.[a]
  rationale: Binago ang pagpapahayag ng pag-iibayo ng damdamin upang mas tumpak na maihatid ang περισσοτέρως, at pinalitan ang temporal na pangatnig upang masalamin ang participial na ugnayan sa Griyego. Pinanatili ang lahat ng pangunahing semantikong elemento at ang umiiral na talababa.
