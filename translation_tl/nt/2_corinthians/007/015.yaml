    reason: lexical_alternative
  revision_rationale: Binago ang pagpapahayag ng pag-iibayo ng damdamin upang mas tumpak na maihatid ang περισσοτέρως, at pinalitan ang temporal na pangatnig upang masalamin ang participial na ugnayan sa Griyego. Pinanatili ang lahat ng pangunahing semantikong elemento at ang umiiral na talababa.
