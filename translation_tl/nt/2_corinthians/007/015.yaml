  text: καὶ τὰ σπλάγχνα αὐτοῦ περισσοτέρως εἰς ὑμᾶς ἐστιν ἀναμιμνῃσκομένου τὴν πάντων ὑμῶν ὑπακοήν, ὡς μετὰ φόβου καὶ τρόμου ἐδέξασθε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/015.yaml
  text: And his affection for you is even greater as he remembers the obedience of all of you[a], how you received him with fear and trembling.
translation:
  language: tl
  text: At lalong umaapaw ang pagmamahal niya sa inyo habang naaalaala niya ang pagsunod ninyong lahat—kung paano ninyo siya tinanggap nang may takot at panginginig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang may paggalang at panginginig.” Ang “takot at panginginig” ay pariralang ginagamit ni Pablo para sa taimtim at mapagpakumbabang pagtugon.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: pagmamahal
  rationale: Tumutukoy ito nang idyomatiko sa malalim at magiliw na damdamin. Likas at marangal sa modernong Tagalog ang “pagmamahal,” at hindi nito ipinapasok sa teksto ang literal ngunit αwkward na larawan ng mga laman-loob.
- source_word: περισσοτέρως
  choice: lalo pang lumalim
  rationale: Ipinahahayag ng pang-abay ang pag-igting o pagdagdag ng damdamin. Ang pariralang ito ay natural sa Tagalog at nagpapanatili sa diwang komparatibo.
- source_word: εἰς ὑμᾶς
  choice: sa inyo
  rationale: Ipinakikita ng εἰς ang direksiyon ng pagmamahal ni Tito tungo sa mga taga-Corinto. Ang “sa inyo” ang pinakanatural na katumbas.
- source_word: ἀναμιμνῃσκομένου
  choice: kapag naaalaala niya
  rationale: Inilalarawan ng participle ang kalagayang kaugnay ng lalo pang paglalim ng pagmamahal. Pinananatili ng “naaalaala” ang diwa ng muling paggunita.
- source_word: ὑπακοήν
  choice: pagsunod
  rationale: Ito ang tuwiran at malinaw na katumbas ng ὑπακοή, na dito ay tumutukoy sa masunuring pagtugon ng kapulungan.
- source_word: πάντων ὑμῶν
  choice: ninyong lahat
  rationale: Pinananatili nito ang diin na ang buong kapulungan ang tinutukoy.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: nang may takot at panginginig
  rationale: Pinananatili ang kapansin-pansing idyomang Paulino at ang tunay na tensiyon nito, sa halip na agad itong paliitin sa “paggalang” lamang.
- source_word: ἐδέξασθε
  choice: tinanggap
  rationale: Malawak at natural itong katumbas na maaaring sumaklaw sa pagtanggap at malugod na pagsalubong nang hindi labis na nagpapakahulugan.
- source_word: αὐτόν
  choice: siya
  rationale: Pinananatili ang panghalip ng Griyego; malinaw sa konteksto na si Tito ang tinutukoy.
theological_decisions:
- issue: Kahulugan ng “takot at panginginig” sa pagtanggap kay Tito
  choice: Panatilihin sa pangunahing teksto ang literal na idyomang “takot at panginginig,” na sa konteksto ay maaaring magpahiwatig ng taimtim, mapagpakumbaba, at magalang na pagtugon.
  alternative: Isalin bilang “matinding paggalang at panginginig” o unawain bilang literal na pagkatakot.
  rationale: Ang parirala ay isang idyomang ginagamit ni Pablo, ngunit hindi dapat lubusang alisin sa salin ang lakas at tensiyon ng mga salitang φόβος at τρόμος. Nililinaw ng talababa ang posibleng diwa nang hindi ito ipinipilit sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “pagmamahal” para sa malalim na damdamin ni Tito at pinanatili ang tradisyonal ngunit buhay na idyomang “takot at panginginig,” na may paliwanag sa talababa.
