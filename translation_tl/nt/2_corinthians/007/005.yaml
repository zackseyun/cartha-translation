  text: Καὶ γὰρ ἐλθόντων ἡμῶν εἰς Μακεδονίαν οὐδεμίαν ⸀ἔσχηκεν ἄνεσιν ἡ σὰρξ ἡμῶν, ἀλλ’ ἐν παντὶ θλιβόμενοι— ἔξωθεν μάχαι, ἔσωθεν φόβοι—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/005.yaml
  text: For even when we came into Macedonia[a], our flesh had no rest, but we were afflicted in every way—conflicts on the outside, fears on the inside—
translation:
  language: tl
  text: Sapagkat kahit nang makarating kami sa Macedonia, hindi nagkaroon ng anumang ginhawa ang aming laman[a], ngunit napipighati kami sa lahat ng paraan—mga tunggalian sa labas, mga takot sa loob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kami mismo ay hindi nagkaroon ng anumang ginhawa.” Sa Griyego, “ang aming laman,” isang literal na pahayag na tumutukoy sa kahinaan at paghihirap ng tao bilang nilalang na may katawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Sapagkat kahit
  rationale: Ipinahahayag nito kapwa ang paliwanag na kaugnayan sa naunang konteksto at ang bahagyang pagdidiin ng parirala.
- source_word: ἐλθόντων ἡμῶν εἰς Μακεδονίαν
  choice: nang makarating kami sa Macedonia
  rationale: Ginawang temporal ang genitive absolute; natural sa Tagalog ang “makarating sa” para sa pagdating sa isang lugar.
- source_word: οὐδεμίαν ἔσχηκεν ἄνεσιν
  choice: hindi nagkaroon ng anumang ginhawa
  rationale: Ang ἄνεσις ay tumutukoy sa ginhawa o pahinga mula sa matinding hirap; ang “ginhawa” ay malinaw at angkop sa pisikal at emosyonal na kagipitan.
- source_word: ἡ σὰρξ ἡμῶν
  choice: ang aming laman
  rationale: Pinananatili nito ang kongkretong larawan ng Griyego at ang pagtukoy sa marupok at katawang kalagayan ng tao, nang hindi ito ginagawang “makasalanang kalikasan.”
- source_word: ἀλλ’ ἐν παντὶ θλιβόμενοι
  choice: Sa halip, nagigipit kami sa lahat ng paraan
  rationale: Ipinahahayag ng “nagigipit” ang patuloy na pagkakaipit o pagdurusa, habang natural na tinutumbasan ng “sa lahat ng paraan” ang malawak na saklaw ng ἐν παντί.
- source_word: ἔξωθεν μάχαι
  choice: mga tunggalian sa labas
  rationale: Sapat ang lawak ng “tunggalian” upang masaklaw ang panlabas na pagsalungat at hidwaan nang hindi ipinapalagay na literal na labanan lamang.
- source_word: ἔσωθεν φόβοι
  choice: mga takot sa loob
  rationale: Pinananatili nito ang tuwirang paghahambing ng panlabas na tunggalian at panloob na takot.
theological_decisions:
- issue: Kahulugan ng σάρξ
  choice: ang aming laman
  alternative: kami mismo; ang aming katawan
  rationale: Sa kontekstong ito, ang σάρξ ay hindi teknikal na tawag sa moral na kasamaan o “makasalanang kalikasan,” kundi sa katawang-tao sa kahinaan at paghihirap nito. Pinananatili sa pangunahing teksto ang literal na larawan, at inilalagay sa talababa ang mas idyomatikong pagbasa.
translation_notes:
  register: Makabago at marangal na Filipino, na may tuwirang magkatugmang pariralang “sa labas” at “sa loob.” Pinanatili ang “aming laman” bilang sadyang kongkretong pahayag ng orihinal, ngunit nilinaw sa talababa ang natural na kahulugan nito.
