  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ταύτας οὖν ἔχοντες τὰς ἐπαγγελίας, ἀγαπητοί, καθαρίσωμεν ἑαυτοὺς ἀπὸ παντὸς μολυσμοῦ σαρκὸς καὶ πνεύματος, ἐπιτελοῦντες ἁγιωσύνην ἐν φόβῳ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/001.yaml
  text: Therefore[a], since we have these promises, beloved, let us cleanse ourselves from every defilement of flesh and spirit[c][b], bringing holiness to completion in the fear of God.
translation:
  language: tl
  text: Kaya nga, mga minamahal, yamang taglay natin ang mga pangakong ito, linisin natin ang ating mga sarili mula sa bawat karumihan ng laman at espiritu, habang pinasasakdal natin ang kabanalan nang may takot sa Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “takot sa Diyos” ay tumutukoy sa mapitagang pagkamangha at taimtim na pagkilala sa Diyos, hindi lamang sa pagkasindak.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτας ... τὰς ἐπαγγελίας
  choice: ang mga pangakong ito
  rationale: Likas at tiyak na salin ng parirala; tumutukoy ang demonstratibo sa mga katiyakang binanggit sa naunang talata.
- source_word: οὖν
  choice: Kaya nga
  rationale: Malinaw na minamarkahan ang kongklusyon o paghihinuha mula sa naunang pangangatwiran.
- source_word: ἀγαπητοί
  choice: mga minamahal
  rationale: Pinananatili ang mainit ngunit marangal na tawag ni Pablo sa mga mambabasa.
- source_word: καθαρίσωμεν ἑαυτοὺς
  choice: linisin natin ang ating sarili
  rationale: Tuwirang inilalarawan ang inklusibong panghihikayat ng unang panauhang maramihang hortatory subjunctive.
- source_word: ἀπὸ παντὸς μολυσμοῦ
  choice: mula sa bawat karumihan
  rationale: Ang “karumihan” ay natural sa Filipino at nagpapanatili ng moral at panrelihiyong diwa ng pagkadungis.
- source_word: σαρκὸς καὶ πνεύματος
  choice: ng laman at espiritu
  rationale: Pinananatili ang leksikal na tambalan at ang saklaw nito sa panlabas o pisikal at panloob na dimensiyon ng tao, nang hindi ginagawang “makasalanang kalikasan” ang σάρξ.
- source_word: ἐπιτελοῦντες ἁγιωσύνην
  choice: habang dinadala natin sa kaganapan ang kabanalan
  rationale: Ipinahihiwatig ang nagpapatuloy na kilos na kaakibat ng paglilinis at ang pagdadala ng kabanalan sa ganap nitong layunin.
- source_word: ἐν φόβῳ θεοῦ
  choice: nang may takot sa Diyos
  rationale: Pinananatili ang matimbang na biblikal na idyoma; nililinaw sa talababa na kabilang dito ang mapitagang pagkamangha at hindi lamang sindak.
theological_decisions:
- issue: Kahulugan ng σάρξ sa “karumihan ng laman at espiritu”
  choice: Isinaling “laman,” hindi “makasalanang kalikasan.”
  alternative: katawan; makasalanang kalikasan
  rationale: Ang pagtambal nito sa “espiritu” ay tumutukoy sa kabuuang tao sa pisikal at panloob na mga dimensiyon; hindi malinaw na ginagamit rito ang espesyalisadong diwa ng makasalanang oryentasyon.
- issue: Lakas ng καθαρίσωμεν
  choice: 'Inklusibong panghihikayat: “linisin natin.”'
  alternative: dapat nating linisin
  rationale: Mas tuwirang pinananatili nito ang hortatory subjunctive at isinasama si Pablo sa panawagan.
- issue: Diwa ng φόβος kaugnay ng Diyos
  choice: Pinanatili ang “takot sa Diyos.”
  alternative: paggalang sa Diyos; pagpipitagan sa Diyos
  rationale: Hindi dapat paliitin sa simpleng paggalang ang matimbang na biblikal na pananalita, ngunit nililinaw na hindi lamang pagkasindak ang kahulugan nito.
- issue: Ugnayan ng ἐπιτελοῦντες sa pangunahing panghihikayat
  choice: Isinaling “habang dinadala natin,” bilang kilos na kaakibat ng paglilinis.
  alternative: sa gayon ay ginagawang ganap; ganapin natin
  rationale: Pinananatili ang anyong participle at hindi labis na tinutukoy kung ito ay paraan, kasabay na kilos, o resulta.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang biblikal na bigat ng “laman,” “espiritu,” “kabanalan,” at “takot sa Diyos,” habang iniwasan ang labis na teknikal o denominasyonal na pananalita.
