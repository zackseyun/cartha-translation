    issue: Ang “ating sarili” ay isahang anyo para sa pangmaramihang reflexive na ἑαυτούς.
    rationale: Bagaman maaari itong tanggapin bilang kolektibong gamit, ang “ating mga sarili” ay mas malinaw na tumutugma sa inklusibong pangmaramihang panawagan.
  - severity: low
    issue: Medyo di-likas ang “dinadala natin sa kaganapan ang kabanalan.”
    rationale: Nauunawaan ito, ngunit ang “pinasasakdal natin ang kabanalan” ay mas likas na Filipino at mas tuwirang nagpapahayag ng pagdadala sa kabanalan sa ganap na layunin nito.
