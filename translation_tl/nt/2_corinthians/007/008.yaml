  naturalness: Malinaw, makabago, at marangal ang Tagalog. Ang “pinalungkot” at “sandali lamang” ay likas sa kontekstong ito. Ang bahagyang pag-aayos ng unang parirala ay magiging mas tumpak nang hindi sinasakripisyo ang daloy.
