  to: Sapagkat kahit pinalungkot ko kayo sa pamamagitan ng sulat, hindi ko ito pinagsisisihan—bagaman pinagsisihan ko rin ito noon,[a] sapagkat nakikita kong pinalungkot kayo ng sulat na iyon, kahit sandali lamang.[b]
