id: 2CO.7.4
reference: 2 Corinthians 7:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πολλή μοι παρρησία πρὸς ὑμᾶς, πολλή μοι καύχησις ὑπὲρ ὑμῶν· πεπλήρωμαι τῇ παρακλήσει, ὑπερπερισσεύομαι τῇ χαρᾷ ἐπὶ πάσῃ τῇ θλίψει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/004.yaml
  text: I have great boldness toward you[a], and great boasting on your behalf. I am filled with encouragement[c][b]; I overflow with joy in all our affliction.
translation:
  language: tl
  text: Malaya at hayagan akong magsalita sa inyo[a], at malaki ang ipinagmamalaki ko kayo. Puspos ako ng kaaliwan[b]; nag-uumapaw ako sa kagalakan sa gitna ng lahat ng aming paghihirap.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Malaki ang aking katapangang magsalita sa inyo.” Ang salitang Griyego ay maaari ring mangahulugang pagtitiwala o lantad na pagsasalita.
    reason: lexical_alternative
  - marker: b
    text: O “Puspos ako ng pagpapatibay.” Saklaw ng salitang Griyego ang kapwa pagpapatibay at pag-aliw.
    reason: lexical_alternative
  - marker: c
    text: O “sa kabila ng lahat ng aming paghihirap.” Maaari ring unawain ang Griyego bilang kagalakang umaapaw habang nagpapatuloy ang kagipitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: tiwala
  rationale: Sa ugnayang ipinahihiwatig ng πρὸς ὑμᾶς, likas sa Filipino ang “malaki ang tiwala ko sa inyo.” Saklaw nito ang matapang at bukas na pakikitungo ni Pablo, habang inilalahad sa talababa ang ibang leksikal na diin.
- source_word: καύχησις
  choice: ipinagmamalaki
  rationale: Pinananatili nito ang positibong wika ni Pablo tungkol sa pagmamalaki, nang hindi ito pinapahina tungo sa simpleng kasiyahan o pagtitiwala.
- source_word: ὑπὲρ ὑμῶν
  choice: tungkol sa inyo
  rationale: Sa konteksto, tumutukoy ito sa pagmamalaki ni Pablo hinggil sa mga taga-Corinto; natural at hindi labis na tiyak ang “tungkol sa inyo.”
- source_word: πεπλήρωμαι τῇ παρακλήσει
  choice: Puspos ako ng lakas ng loob
  rationale: Ipinahahayag ng perfect passive ang kasalukuyang kalagayang bunga ng natanggap na παράκλησις. Ang “lakas ng loob” ay angkop sa konteksto ng pagpapatibay, bagaman maaari ring mangahulugang kaaliwan.
- source_word: ὑπερπερισσεύομαι τῇ χαρᾷ
  choice: nag-uumapaw ako sa kagalakan
  rationale: Napananatili ng “nag-uumapaw” ang masidhing larawan ng labis-labis na kasaganaan sa ὑπερπερισσεύομαι.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: sa gitna ng lahat ng aming paghihirap
  rationale: Malinaw nitong pinananatiling magkasabay ang kagalakan at patuloy na paghihirap, sa halip na gawing payak na pagsalungat ang parirala.
theological_decisions:
- issue: Positibong gamit ni Pablo sa καύχησις
  choice: ipinagmamalaki
  alternative: ikinagagalak; ipinagmamalaki alang-alang sa inyo
  rationale: Pinananatili ang retorika ng pagmamalaki bilang positibong pahayag tungkol sa mga taga-Corinto, nang hindi ipinapalagay na makasalanang pagmamataas iyon.
- issue: Ugnayan ng kagalakan at paghihirap
  choice: sa gitna ng lahat ng aming paghihirap
  alternative: sa kabila ng lahat ng aming paghihirap
  rationale: 'Mas tapat ang piniling salin sa tensiyon ng Griyego: umaapaw ang kagalakan habang nararanasan ang paghihirap, hindi lamang bilang kabaligtaran nito.'
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “puspos” at “nag-uumapaw” upang mapanatili ang magkatuwang na larawan ng kapuspusan at kasaganaan sa Griyego; hindi naman ginawang labis na teknikal ang pangungusap.
