revisions:
- from: Malaki ang tiwala ko sa inyo[a], at malaki ang ipinagmamalaki ko tungkol sa inyo. Puspos ako ng lakas ng loob[b]; nag-uumapaw ako sa kagalakan sa gitna ng lahat ng aming paghihirap.[c]
  to: Malaya at hayagan akong magsalita sa inyo[a], at malaki ang ipinagmamalaki ko kayo. Puspos ako ng kaaliwan[b]; nag-uumapaw ako sa kagalakan sa gitna ng lahat ng aming paghihirap.[c]
  rationale: Pinalitan ang “tiwala ko sa inyo” ng pananalitang tumutukoy sa malaya at hayagang pagsasalita ni Pablo, na mas malapit sa saklaw ng παρρησία sa pariralang πρὸς ὑμᾶς. Pinalitan din ang “lakas ng loob” ng “kaaliwan” upang mas tumpak na maipakita ang παράκλησις sa agarang konteksto, habang pinanatili ang “pagpapatibay” bilang leksikal na alternatibo. Ginawang “ipinagmamalaki ko kayo” ang katutubong ayos para sa καύχησις ὑπὲρ ὑμῶν.
