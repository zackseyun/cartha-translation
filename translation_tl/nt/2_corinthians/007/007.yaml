id: 2CO.7.7
reference: 2 Corinthians 7:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἐν τῇ παρουσίᾳ αὐτοῦ, ἀλλὰ καὶ ἐν τῇ παρακλήσει ᾗ παρεκλήθη ἐφ’ ὑμῖν, ἀναγγέλλων ἡμῖν τὴν ὑμῶν ἐπιπόθησιν, τὸν ὑμῶν ὀδυρμόν, τὸν ὑμῶν ζῆλον ὑπὲρ ἐμοῦ, ὥστε με μᾶλλον χαρῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/007.yaml
  text: and not only by his coming, but also by the comfort with which he was comforted because of you, as he reported to us your longing, your mourning, and your zeal for me, so that I rejoiced even more.
translation:
  language: tl
  text: At hindi lamang dahil sa pagdating niya,[a] kundi dahil din sa kaaliwang tinanggap niya dahil sa inyo. Ibinalita niya sa amin ang matinding pananabik ninyo, ang pagdadalamhati ninyo,[b] at ang maalab ninyong pagmamalasakit sa akin. Kaya lalo pa akong nagalak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “presensiya niya.”
    reason: lexical_alternative
  - marker: b
    text: O “panaghoy ninyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρουσίᾳ
  choice: pagdating
  rationale: Sa konteksto ng paglalakbay ni Tito, tumutukoy ito sa kaniyang pagdating, bagaman maaari rin itong mangahulugang presensiya.
- source_word: παρακλήσει / παρεκλήθη
  choice: kaaliwan / tinanggap niya
  rationale: Ang kaaliwan ang angkop sa damdamin ng konteksto. Iniwasan ang mabigat na literal na pag-uulit na “kaaliwang inaliw sa kaniya,” ngunit pinanatili ang diwang pasibo sa “tinanggap niya.”
- source_word: ἐφ’ ὑμῖν
  choice: dahil sa inyo
  rationale: Ipinahihiwatig ng parirala na ang tugon ng mga taga-Corinto ang naging dahilan o batayan ng kaaliwan ni Tito.
- source_word: ἀναγγέλλων
  choice: Ibinalita niya
  rationale: Malinaw at natural na ipinapahayag na ipinaalam ni Tito kay Pablo ang tugon ng mga taga-Corinto.
- source_word: ἐπιπόθησιν
  choice: matinding pananabik
  rationale: Ipinakikita nito ang lakas ng paghahangad na taglay ng pambihirang pangngalang Griyego.
- source_word: ὀδυρμόν
  choice: pagdadalamhati
  rationale: Saklaw nito ang matinding lungkot at hayag na pag-iyak o panaghoy.
- source_word: ζῆλον ὑπὲρ ἐμοῦ
  choice: maalab ninyong pagmamalasakit sa akin
  rationale: Sa kontekstong ito, ang ζῆλος ay mas natural na tumutukoy sa masigasig at taimtim nilang malasakit kay Pablo kaysa sa karaniwang modernong kahulugan ng “sigasig” lamang.
- source_word: ὥστε με μᾶλλον χαρῆναι
  choice: Kaya lalo pa akong nagalak
  rationale: Pinananatili ang resultang ipinahihiwatig ng ὥστε at ang paghahambing sa μᾶλλον.
