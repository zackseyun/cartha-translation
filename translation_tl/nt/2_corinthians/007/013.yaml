  text: διὰ τοῦτο παρακεκλήμεθα. Ἐπὶ δὲ τῇ παρακλήσει ⸀ἡμῶν περισσοτέρως μᾶλλον ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου, ὅτι ἀναπέπαυται τὸ πνεῦμα αὐτοῦ ἀπὸ πάντων ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/013.yaml
  text: For this reason we have been comforted[a]. And in addition to our comfort, we rejoiced even more abundantly at Titus’s joy[b], because his spirit has been refreshed by all of you.
translation:
  language: tl
  text: Dahil dito, naaliw kami.[a] At bukod sa aming kaaliwan, lalo pa kaming nagalak dahil sa kagalakan ni Tito, sapagkat ang kanyang espiritu ay napasigla ninyong lahat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “napalakas ang aming loob.” Ang salitang Griyego ay maaaring mangahulugang aliwin o palakasin ang loob.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nakapagpahinga ang kanyang espiritu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dahil dito
  rationale: Likas na panandang sanhi sa Tagalog na pinananatili ang tahasang ugnayan sa naunang sinabi.
- source_word: παρακεκλήμεθα
  choice: naaliw kami
  rationale: Ipinahahayag ng perpektong balintiyak ang kasalukuyang kalagayang bunga ng naunang pag-aliw; ang “naaliw” ay angkop sa emosyonal at ugnayang konteksto.
- source_word: Ἐπὶ δὲ τῇ παρακλήσει ἡμῶν
  choice: At bukod sa kaaliwang iyon
  rationale: Ipinakikita na may dagdag na dahilan ng kagalakan bukod sa kaaliwang natanggap nila, nang hindi ginagawang labis na teknikal ang parirala.
- source_word: περισσοτέρως μᾶλλον
  choice: lalo pa
  rationale: Natural at mariing Tagalog para sa pinag-ibayong paghahambing ng dalawang salitang Griyego.
- source_word: ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου
  choice: kam­ing nagalak dahil sa kagalakan ni Tito
  rationale: Pinananatili ang pag-uulit ng ugat na χαίρω/χαρά sa pamamagitan ng “nagalak/kagalakan,” habang likas na ipinahahayag ang batayan ng kanilang tuwa.
- source_word: ἀναπέπαυται
  choice: naginhawahan
  rationale: Ipinahahayag ang kaluwagan at panibagong sigla bilang kalagayang bunga ng ginawa ng mga taga-Corinto; nililinaw sa talababa ang mas literal na larawan ng pamamahinga.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: ang kanyang espiritu
  rationale: Tuwirang pinananatili ang antropolohikal na wika ng Griyego at tumutukoy sa panloob na kalagayan ni Tito.
- source_word: ἀπὸ πάντων ὑμῶν
  choice: dahil sa inyong lahat
  rationale: Natural na Tagalog na naghahayag na ang buong kapulungan ang pinagmulan o dahilan ng kaginhawahan ni Tito.
theological_decisions:
- issue: Kahulugan ng πνεῦμα sa pagtukoy kay Tito
  choice: sariling espiritu o panloob na kalagayan ni Tito
  alternative: ang Banal na Espiritu
  rationale: Ang panghalip na “kanyang” at ang konteksto ng emosyonal na tugon ni Tito ay tumutukoy sa kanyang sariling espiritu, hindi sa Banal na Espiritu.
- issue: Saklaw ng παρακαλέω/παράκλησις
  choice: aliw/kaaliwan
  alternative: lakas ng loob/pagpapalakas ng loob
  rationale: Saklaw ng mga salitang Griyego ang kapuwa pag-aliw at pagpapalakas ng loob. Mas angkop dito ang “aliw,” ngunit pinananatili sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “naaliw/kaaliwan” nang pare-pareho para sa magkaugnay na salitang Griyego, at iniwasan ang labis na pormal na “konsolasyon.” Parehong marker na [a] at [b] ay nasa pangunahing teksto.
