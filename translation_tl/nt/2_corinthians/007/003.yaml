id: 2CO.7.3
reference: 2 Corinthians 7:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂πρὸς κατάκρισιν οὐ⸃ λέγω, προείρηκα γὰρ ὅτι ἐν ταῖς καρδίαις ἡμῶν ἐστε εἰς τὸ συναποθανεῖν καὶ συζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/003.yaml
  text: I do not say this to condemn you[a], for I have said before that you are in our hearts[b], to die together and to live together.
translation:
  language: tl
  text: Hindi ko ito sinasabi upang hatulan kayo[a], sapagkat sinabi ko na noon na nasa aming mga puso kayo—upang magkasama tayong mamatay at mabuhay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para sa paghatol” o “na may layuning hatulan kayo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “para sa sama-samang pagkamatay at pamumuhay.” Binibigyang-diin ng Griyego ang magkasamang pakikiisa kapwa sa kamatayan at sa buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς κατάκρισιν
  choice: upang hatulan kayo
  rationale: Ipinahahayag ng πρός kasama ng accusative ang layon o tunguhin. Likas sa makabagong Tagalog ang pariralang ito at nililinaw ng konteksto na ang mga taga-Corinto ang maaaring hatulan, nang hindi inaalis ang alternatibong mas nominal na pagbasa.
- source_word: λέγω
  choice: sinasabi ko ito
  rationale: Ang pangkasalukuyang λέγω ay likas na isinaling “sinasabi ko”; idinagdag ang “ito” bilang malinaw na pantukoy sa naunang sinabi ni Pablo.
- source_word: προείρηκα
  choice: nasabi ko na noon
  rationale: Pinananatili nito ang naunang pagsasalita at ang patuloy na kabuluhan nito na ipinahihiwatig ng Greek perfect.
- source_word: ἐν ταῖς καρδίαις ἡμῶν ἐστε
  choice: nasa aming mga puso kayo
  rationale: Sinusunod ang plural na καρδίαις at ipinahahayag ang malalim na pagmamahal at panloob na pagkakaugnay ni Pablo at ng kanyang mga kasama sa mga taga-Corinto.
- source_word: εἰς τὸ συναποθανεῖν καὶ συζῆν
  choice: upang sama-sama tayong mamatay at sama-sama ring mabuhay
  rationale: Ang “upang” ay kumakatawan sa εἰς τό na maaaring magpahiwatig ng layon o kinalabasan. Ang “sama-sama tayong” ay natural na Tagalog at pinananatili ang mutuwal na pakikiisa ng mga pandiwang may συν-; ang “ring” ay nagpapatibay sa balanseng paralelismo.
- source_word: συναποθανεῖν
  choice: sama-sama tayong mamatay
  rationale: Pinananatili ang diin ng συν- sa pagbabahagi ng kamatayan at isinasama ang dalawang panig sa likas na inklusibong “tayo.”
- source_word: συζῆν
  choice: sama-sama ring mabuhay
  rationale: Pinananatili ang parehong diin ng συν- sa pagbabahagi ng buhay at ang retorikal na balanse nito sa kamatayan.
theological_decisions:
- issue: Kung ang “sama-sama tayong mamatay at sama-sama ring mabuhay” ay dapat tahasang ipakahulugan bilang tipan, pag-aasawa, o pakikiisa kay Cristo
  choice: Panatilihin itong pahayag ng malalim na pagmamahal at ganap na pakikiisa nang hindi nilalagyan ng mas makitid na teolohikal na katawagan.
  alternative: Ipaliwanag ito bilang katapatan sa tipan o bilang alusyon sa pakikibahagi kay Cristo.
  rationale: Malinaw sa teksto ang matinding relational na pakikiisa, ngunit hindi nito tahasang tinutukoy ang isang teknikal na teolohikal na kategorya.
- issue: Ugnayan ng εἰς τὸ συναποθανεῖν καὶ συζῆν sa naunang pahayag
  choice: Gamitin ang “upang” sa pangunahing teksto ngunit itala sa talababa ang posibleng diwa ng kalagayan o kahandaang magbahagi ng kamatayan at buhay.
  alternative: Isalin lamang bilang “na handa kaming mamatay at mabuhay na kasama ninyo.”
  rationale: May puwang ang konstruksyong εἰς τό para sa layon o kinalabasan, samantalang ang konteksto ay maaari ring maunawaan bilang matibay na pakikiisa; hindi dapat lubusang isara ang alinman.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “aming mga puso” upang panatilihin ang plural ng Griyego, at ang inklusibong “tayong” upang likas na ipahayag ang mutuwal na pakikiisa ni Pablo at ng mga taga-Corinto.
