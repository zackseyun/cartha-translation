id: 2CO.7.6
reference: 2 Corinthians 7:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ παρακαλῶν τοὺς ταπεινοὺς παρεκάλεσεν ἡμᾶς ὁ θεὸς ἐν τῇ παρουσίᾳ Τίτου·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/006.yaml
  text: But God[a], who comforts the humble[b], comforted us by the coming of Titus.
translation:
  language: tl
  text: Ngunit ang Diyos, na umaaliw sa mga nasa abang kalagayan[a], ay inaliw kami sa pagdating ni Tito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga mapagpakumbaba,” “sa mga aba,” o “sa mga nanlulumo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa presensiya ni Tito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ngunit
  rationale: Nagpapahayag ito ng malinaw na pagsalungat sa naunang paglalarawan ni Pablo ng kanilang paghihirap.
- source_word: ὁ παρακαλῶν
  choice: na umaaliw
  rationale: Ang pangkasalukuyang participle ay naglalarawan sa karaniwang ginagawa ng Diyos. Ang “umaaliw” ay angkop sa konteksto ng paghihirap at pinananatili ang ugnayang leksikal sa παρεκάλεσεν.
- source_word: τοὺς ταπεινοὺς
  choice: sa mga nasa abang kalagayan
  rationale: Maaaring tumukoy ang ταπεινός sa mga mababa, ibinaba, o pinanghinaan dahil sa kanilang kalagayan. Iniiwasan ng saling ito na limitahan ang diwa sa kusang pagpapakumbaba o sa damdaming panlulumo lamang.
- source_word: παρεκάλεσεν
  choice: inaliw
  rationale: Pinananatili nito ang pag-uulit ng salitang-ugat na kaugnay ng παρακαλῶν at malinaw na ipinahahayag ang ginhawang tinanggap nila.
- source_word: ἐν τῇ παρουσίᾳ
  choice: sa pagdating
  rationale: Sa konteksto, ang παρουσία ay tumutukoy sa pagdating ni Tito, bagaman maaari rin nitong idiin ang kaniyang presensiya.
- source_word: Τίτου
  choice: ni Tito
  rationale: Ito ang karaniwang anyo ng pangalang Titus sa modernong saling Tagalog at likas sa pariralang “pagdating ni Tito.”
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Pinananatili ang Diyos bilang tahasang simuno at bilang siyang kumikilos upang magbigay-aliw.
theological_decisions:
- issue: Diwa ng τοὺς ταπεινοὺς sa konteksto
  choice: mga nasa abang kalagayan
  alternative: mga mapagpakumbaba; mga nanlulumo; mga aba
  rationale: Saklaw ng parirala ang mga ibinaba o nasa mababang kalagayan at, sa konteksto, maaaring kabilang ang mga pinanghinaan dahil sa paghihirap. Hindi ito dapat tahimik na paliitin sa moral na pagpapakumbaba lamang o sa isang tiyak na damdamin.
- issue: Diwa ng παρουσία ni Tito
  choice: pagdating ni Tito
  alternative: presensiya ni Tito
  rationale: Ang daloy ng salaysay ay tumutukoy sa pagdating ni Tito bilang paraan ng pag-aliw ng Diyos, ngunit tunay ding maaaring tumukoy ang salita sa kaniyang presensiya; kaya inilagay ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inulit ang “umaaliw/inaliw” upang maipakita ang leksikal na pagkakaugnay ng dalawang anyo ng παρακαλέω. Inilagay ang mga panandang [a] at [b] sa mismong mga pariralang tinutukoy ng kani-kanilang talababa.
