  text: ἡ γὰρ κατὰ θεὸν λύπη μετάνοιαν εἰς σωτηρίαν ἀμεταμέλητον ⸀ἐργάζεται· ἡ δὲ τοῦ κόσμου λύπη θάνατον κατεργάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/010.yaml
  text: For godly sorrow produces repentance leading to salvation without regret[b][a], but worldly sorrow produces death.
translation:
  language: tl
  text: Sapagkat ang kalungkutang naaayon sa Diyos[a] ay nagbubunga ng pagsisising humahantong sa kaligtasan at hindi dapat panghinayangan[b], ngunit ang makamundong kalungkutan ay nagbubunga ng kamatayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na ayos: “kalungkutang ayon sa Diyos.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring unawain: “nagbubunga ng pagsisising hindi dapat panghinayangan at humahantong sa kaligtasan.” Maaaring mas tuwirang inilalarawan ng salitang Griyego ang “pagsisisi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ θεὸν
  choice: naaayon sa Diyos
  rationale: Mas tuwirang pinananatili nito ang diwa ng ‘ayon sa Diyos’ kaysa sa posibleng ‘makadiyos,’ at malinaw na inilalarawan ang uri o pamantayan ng kalungkutan.
- source_word: λύπη
  choice: kalungkutan
  rationale: Natural at malawak itong katumbas sa modernong Tagalog para sa emosyonal at moral na dalamhating tinutukoy sa dalawang sugnay.
- source_word: μετάνοιαν
  choice: pagsisisi
  rationale: Sa kontekstong ito, hindi lamang ito pagbabago ng isip kundi pagtalikod na may moral at espirituwal na bigat; ‘pagsisisi’ ang malinaw at nakasanayang katumbas sa Tagalog.
- source_word: εἰς σωτηρίαν
  choice: humahantong sa kaligtasan
  rationale: Ipinapahayag nito ang direksiyon o bunga ng εἰς nang hindi ginagawang mekanikal o labis na tiyak ang ugnayang sanhi.
- source_word: ἀμεταμέλητον
  choice: hindi dapat panghinayangan
  rationale: Pinananatili ang kahulugang ‘not to be regretted’ at natural na iniuugnay sa pagsisising humahantong sa kaligtasan.
- source_word: ἐργάζεται / κατεργάζεται
  choice: nagbubunga
  rationale: Natural sa Tagalog at pinananatili ang retorikal na pagkakatulad ng dalawang magkatapat na sugnay.
- source_word: τοῦ κόσμου
  choice: mula sa sanlibutan
  rationale: Ipinapakita ang kabaligtaran ng kalungkutang naaayon sa Diyos nang hindi nililimitahan ito sa karaniwang kahulugan ng ‘makamundo’ bilang materyalismo lamang.
- source_word: θάνατον
  choice: kamatayan
  rationale: Tuwirang salin na nagpapanatili sa lawak ng kahulugan; hindi tinutukoy ng talata kung pisikal, espirituwal, o pangwakas na kamatayan ang pangunahing diin.
theological_decisions:
- issue: Pagkakaiba ng dalawang uri ng kalungkutan
  choice: ‘kalungkutang naaayon sa Diyos’ laban sa ‘kalungkutang mula sa sanlibutan’
  alternative: ‘makadiyos na kalungkutan’ laban sa ‘makamundong kalungkutan’
  rationale: Mas malapit ang pinili sa anyo at ugnayan ng mga pariralang Griyego at hindi nito ipinapakahulugan nang lampas sa teksto ang eksaktong katangian ng bawat kalungkutan.
- issue: Ugnayan ng pagsisisi at kaligtasan
  choice: ‘pagsisising humahantong sa kaligtasan’
  alternative: ‘pagsisisi para sa kaligtasan’ o ‘pagsisising nagdudulot ng kaligtasan’
  rationale: Pinananatili nito ang layon o resultang ipinahihiwatig ng εἰς, ngunit hindi nagdaragdag ng partikular na denominasyonal na paliwanag tungkol sa paraan ng kaligtasan.
- issue: Saklaw ng ἀμεταμέλητον
  choice: Iniuugnay sa ‘pagsisising humahantong sa kaligtasan’ bilang isang buong parirala
  alternative: Tahasang iugnay lamang sa pagsisisi o lamang sa kaligtasan
  rationale: Maaaring magkalapit ang pagkakaugnay nito sa pagsisisi o sa kinalabasang kaligtasan; ang ayos ng salin ay nagpapanatili ng likas na kaluwagan sa halip na sapilitang lutasin ito.
- issue: Kahulugan ng ‘kamatayan’
  choice: Panatilihin lamang bilang ‘kamatayan’
  alternative: ‘espirituwal na kamatayan’
  rationale: Hindi nililinaw ng talata ang tiyak na uri ng kamatayan, kaya hindi dapat paliitin ng salin ang saklaw nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘sanlibutan’ upang mapanatili ang moral-teolohikal na kaibahan ng κόσμος, at iniwasan ang mas teknikal o denominasyonal na pagpapaliwanag.
