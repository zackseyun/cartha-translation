  naturalness: Natural at marangal sa modernong Tagalog ang “Nagagalak ako na sa lahat ng bagay ay may tiwala ako sa inyo.” Bagaman medyo pormal ang “sa lahat ng bagay,” malinaw nitong pinananatili ang komprehensibong saklaw ng teksto.
  terminology: Walang problemang pangteolohikal o sa mga pangalan. Ang “may tiwala ako sa inyo” ay angkop na salin ng θαρρῶ ἐν ὑμῖν at hindi nagpapataw ng interpretasyong higit sa teksto.
