lexical_decisions:
- source_word: χαίρω
  choice: Nagagalak ako
  rationale: Pinananatili ang pangkasalukuyang pandiwa at ang marangal ngunit likas na tono ng pahayag ni Pablo.
- source_word: ὅτι
  choice: na
  rationale: Pinakamalamang na ipinakikilala nito ang nilalaman ng ikinagagalak ni Pablo, bagaman maaari rin itong unawaing sanhi.
- source_word: ἐν παντί
  choice: lubos
  rationale: Ang pariralang Griyego ay ginagamit na pang-abay at nagpapahayag ng ganap o malawak na saklaw; natural itong naihahatid ng “lubos” sa modernong Tagalog.
- source_word: θαρρῶ
  choice: ang tiwala ko
  rationale: Sa kontekstong ito, ipinahahayag ng pandiwa ang matatag na pagtitiwala ni Pablo, hindi lamang ang pagkakaroon niya ng lakas ng loob.
- source_word: ἐν ὑμῖν
  choice: sa inyo
  rationale: Pinananatili ang relasyonal na diwa ng ἐν at likas sa Tagalog ang pariralang “tiwala ... sa inyo.”
