translation:
  language: tl
  text: Nagagalak ako na sa lahat ng bagay ay may tiwala ako sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nagagalak ako sapagkat sa lahat ng bagay ay may tiwala ako sa inyo.”
