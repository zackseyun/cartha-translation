  to: Kaya kahit sumulat ako sa inyo, hindi iyon dahil sa taong gumawa ng mali, ni dahil sa taong ginawan ng mali, kundi upang mahayag sa gitna ninyo, sa harap ng Diyos, ang inyong taimtim na malasakit sa amin.[a]
  rationale: Pinalitan lamang ang dalawang bahagyang di-likas na substantival na parirala ng mas natural na Tagalog na may “taong.” Hindi binago ang kahulugan, ang antas ng katiyakan, ang sintaktikong tensiyon ng pangunahing teksto, o ang talababa para sa tekstuwal na baryante.
