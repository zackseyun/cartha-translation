reference: 2 Corinthians 7:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἄρα εἰ καὶ ἔγραψα ὑμῖν, οὐχ ⸀ἕνεκεν τοῦ ἀδικήσαντος, ⸀οὐδὲ ⸁ἕνεκεν τοῦ ἀδικηθέντος, ἀλλ’ ⸀1ἕνεκεν τοῦ φανερωθῆναι τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/012.yaml
  text: So even if I wrote to you[a], it was not because of the one who did wrong, nor because of the one who was wronged[b], but so that your earnestness for us might be made known among you before God.
translation:
  language: tl
  text: Kaya kahit sumulat ako sa inyo, hindi iyon dahil sa taong gumawa ng mali, ni dahil sa taong ginawan ng mali, kundi upang mahayag sa gitna ninyo, sa harap ng Diyos, ang inyong taimtim na malasakit sa amin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayon sa ilang manuskrito, “ang aming taimtim na malasakit sa inyo ay mahayag sa gitna ninyo sa harap ng Diyos.”
    reason: textual_variant
lexical_decisions:
- source_word: ἄρα εἰ καὶ
  choice: Kaya kahit
  rationale: Ipinahahayag ng “Kaya” ang paghinuha ng ἄρα, at pinananatili ng “kahit” ang concessive na diwa ng εἰ καὶ sa natural na Tagalog.
- source_word: ἔγραψα ὑμῖν
  choice: sumulat ako sa inyo
  rationale: Tuwirang inililipat ang aorist bilang naganap na pagsulat ni Pablo sa mga taga-Corinto.
- source_word: οὐχ ἕνεκεν τοῦ ἀδικήσαντος
  choice: hindi iyon dahil sa gumawa ng mali
  rationale: Ang “dahil sa” ay natural na katumbas ng ἕνεκεν dito, samantalang pinananatili ng “gumawa ng mali” ang pandiwang diwa ng substantival participle.
- source_word: οὐδὲ ἕνεκεν τοῦ ἀδικηθέντος
  choice: ni dahil sa ginawan ng mali
  rationale: Pinananatili nito ang paralelismo at ang pasibong diwa ng ἀδικηθέντος nang hindi tinutukoy nang higit sa teksto ang uri ng pagkakasala.
- source_word: ἀλλ’ ἕνεκεν τοῦ φανερωθῆναι
  choice: kundi upang mahayag
  rationale: Ipinakikita ng “upang” ang layunin ng articular infinitive, at iniingatan ng “mahayag” ang pasibong diwa.
- source_word: τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν
  choice: ang inyong taimtim na malasakit sa amin
  rationale: Sinasaklaw ng “taimtim na malasakit” ang kasigasigan, kaseryosohan, at mapagmalasakit na diwa ng σπουδή; ang “sa amin” ay natural na pagpapahayag ng ὑπὲρ ἡμῶν.
- source_word: πρὸς ὑμᾶς
  choice: sa gitna ninyo
  rationale: Sa mahirap na konstruksiyong ito, ang “sa gitna ninyo” ay nagbibigay ng natural na lokatibong pagbasa nang hindi binabago ang nakalimbag na mga panghalip.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: sa harap ng Diyos
  rationale: Karaniwan, marangal, at tuwirang katumbas ito na nagpapanatili sa diwa ng presensiya at pagsaksi ng Diyos.
theological_decisions:
- issue: Ang referent at ugnayan ng “inyong taimtim na malasakit sa amin ... sa gitna ninyo” sa isang sintaktikong mahirap at may tekstuwal na baryanteng sugnay
  choice: 'Sinunod sa pangunahing teksto ang SBLGNT: ang malasakit ay “inyo,” nakatuon “sa amin,” at nahayag “sa gitna ninyo” sa harap ng Diyos.'
  alternative: 'Ayon sa ilang manuskrito: “ang aming taimtim na malasakit sa inyo ay mahayag sa gitna ninyo sa harap ng Diyos.”'
  rationale: Pinananatili ng salin ang mga panghalip ng nakalimbag na tekstong Griyego at hindi tahimik na nilulutas ang tensiyon. Inilalagay sa talababa ang mahalagang tekstuwal na baryante.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “taimtim na malasakit” upang maging malinaw sa karaniwang mambabasa habang mapanatili ang lawak ng σπουδή. Inilagay ang marker [a] pagkaraan ng buong sugnay na apektado ng tekstuwal na baryante.
