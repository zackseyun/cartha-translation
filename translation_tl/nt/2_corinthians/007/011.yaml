id: 2CO.7.11
reference: 2 Corinthians 7:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ αὐτὸ τοῦτο τὸ κατὰ θεὸν ⸀λυπηθῆναι πόσην κατειργάσατο ὑμῖν σπουδήν, ἀλλὰ ἀπολογίαν, ἀλλὰ ἀγανάκτησιν, ἀλλὰ φόβον, ἀλλὰ ἐπιπόθησιν, ἀλλὰ ζῆλον, ἀλλὰ ἐκδίκησιν· ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς ⸀εἶναι τῷ πράγματι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/011.yaml
  text: 'For see what earnestness this very grief according to God has produced in you: but also a defense[a], but also indignation, but also fear, but also longing, but also zeal, but also vindication[c][b]. In every way you proved yourselves to be pure in the matter.'
translation:
  language: tl
  text: Sapagkat tingnan ninyo kung gaanong kasigasigan ang ibinunga sa inyo ng mismong pagkalungkot na ito ayon sa Diyos[a]—at hindi lamang iyon, kundi pagtatanggol din sa inyong sarili[b], matinding galit, takot, pananabik, maalab na sigasig, at pagpaparusa[c]! Sa lahat ng paraan, pinatunayan ninyong malinis kayo sa usaping ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makadiyos na pagkalungkot.”
    reason: lexical_alternative
  - marker: b
    text: O “paglilinis ng inyong pangalan.”
    reason: lexical_alternative
  - marker: c
    text: O “pagbibigay-katarungan” o “pagganti sa mali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Sapagkat tingnan ninyo
  rationale: Pinananatili ng “sapagkat” ang paliwanag na puwersa ng γάρ at ng “tingnan ninyo” ang mariing pagtawag-pansin ng ἰδού.
- source_word: τὸ κατὰ θεὸν λυπηθῆναι
  choice: ang mismong pagkalungkot na ito ayon sa Diyos
  rationale: Ginagawang pangngalan ang articular infinitive at pinananatili ang bukas na diwa ng κατὰ θεόν bilang pagkalungkot na naaayon sa Diyos, sa halip na agad itong ipakahulugang “makadiyos.”
- source_word: πόσην κατειργάσατο ὑμῖν σπουδήν
  choice: kung gaanong kasigasigan ang ibinunga sa inyo
  rationale: Ipinahahayag ng κατεργάζομαι ang paglikha ng isang bunga o resulta, samantalang ang σπουδή ay taimtim at aktibong kasigasigan.
- source_word: ἀλλὰ
  choice: at hindi lamang iyon, kundi … din
  rationale: Ang paulit-ulit na ἀλλά ay nagpapalakas at nagdaragdag sa talaan, hindi pangunahing nagpapahayag ng pagsalungat. Isinasalin ang retorikal na pag-igting sa likas na paraang Filipino nang hindi inuulit ang mabigat na parirala sa bawat salita.
- source_word: ἀπολογίαν
  choice: pagtatanggol … sa inyong sarili
  rationale: Tumutukoy ito sa tugon ng mga taga-Corinto upang ipaliwanag o linisin ang kanilang sarili hinggil sa pagkakasangkot sa kasalanan.
- source_word: ἀγανάκτησιν
  choice: pagkagalit
  rationale: Nagpapahayag ng matinding moral na pagkayamot o galit, ngunit hindi tinutukoy ng Griyego kung kanino o saan nakatuon iyon.
- source_word: φόβον
  choice: takot
  rationale: Pinananatili ang payak na kahulugan at hindi tinutukoy kung ito ay takot sa Diyos, kay Pablo, o sa maaaring mangyari.
- source_word: ἐπιπόθησιν
  choice: pananabik
  rationale: Nagpapahayag ng matinding pagnanais nang hindi ipinapasok sa teksto ang di-tiyak na layon nito.
- source_word: ζῆλον
  choice: maalab na pagmamalasakit
  rationale: Ipinahahayag ang masidhi at aktibong malasakit ng ζῆλος at iniiwasang ulitin lamang ang “kasigasigan” na ginamit para sa σπουδή.
- source_word: ἐκδίκησιν
  choice: paglalapat ng katarungan
  rationale: Sinasaklaw nito ang mapagpasiyang pagkilos upang ituwid ang mali, kabilang ang posibleng pagdidisiplina, nang hindi ito ginagawang personal na paghihiganti.
- source_word: ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς εἶναι τῷ πράγματι
  choice: Sa lahat ng paraan, pinatunayan ninyong malinis kayo sa usaping ito
  rationale: Ang συνίστημι ay may diwang magpakita o magpatunay; ang ἁγνούς ay pinanatiling “malinis,” at ang τῷ πράγματι ay likas na isinaling “sa usaping ito.”
theological_decisions:
- issue: Kahulugan ng κατὰ θεόν
  choice: ayon sa Diyos
  alternative: makadiyos
  rationale: Maaaring tumukoy ang parirala sa pagkalungkot na naaayon sa kalooban o pamantayan ng Diyos. Pinananatili ng pangunahing salin ang anyo at saklaw ng Griyego, habang inilalagay sa talababa ang karaniwang mas maikling pagpapakahulugan.
- issue: Diwa ng ἐκδίκησις sa konteksto ng pagsisisi
  choice: paglalapat ng katarungan
  alternative: pagpaparusa; pagganti; pagpapatunay ng katuwiran
  rationale: Maaaring tumukoy ang salita sa pagpaparusa o sa mapagpasiyang pagtutuwid sa mali. Ang piniling salin ay hindi nagtataguyod ng personal na paghihiganti at hindi rin inaalis ang posibilidad ng makatarungang pagdidisiplina.
- issue: Pagiging “malinis” ng mga taga-Corinto sa usapin
  choice: malinis kayo sa usaping ito
  alternative: wala kayong sala sa usaping ito
  rationale: Pinananatili ng “malinis” ang ἁγνούς at iniiwasang gawing absolutong legal na deklarasyon ang pahayag; nakatuon ito sa napatunayan nilang tugon at kalagayan kaugnay ng partikular na usapin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang “ninyo/kayo” dahil maramihan ang mga panghalip sa Griyego. Pinanatili ang masiglang pag-iipon ng mga bunga ng pagsisisi sa pamamagitan ng sunud-sunod na mga pangngalan at tandang padamdam.
