id: 2CO.7.9
reference: 2 Corinthians 7:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: νῦν χαίρω, οὐχ ὅτι ἐλυπήθητε, ἀλλ’ ὅτι ἐλυπήθητε εἰς μετάνοιαν, ἐλυπήθητε γὰρ κατὰ θεόν, ἵνα ἐν μηδενὶ ζημιωθῆτε ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/009.yaml
  text: Now I rejoice[a], not because you were grieved, but because you were grieved into a change of mind; for you were grieved according to God[c][b], so that you might suffer no loss from us.
translation:
  language: tl
  text: Ngayon ay nagagalak ako, hindi dahil nalungkot kayo, kundi dahil ang inyong kalungkutan ay humantong sa pagsisisi; sapagkat nalungkot kayo ayon sa Diyos[a], upang hindi kayo dumanas ng anumang kawalan dahil sa amin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa paraang makadiyos” o “ayon sa kalooban ng Diyos.”
    reason: lexical_alternative
  - marker: b
    text: O “upang hindi kayo mapinsala dahil sa amin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν χαίρω
  choice: Ngayon ay nagagalak ako
  rationale: Pinananatili ang kasalukuyang pananaw ni Pablo at ang bahagyang marangal na himig ng χαίρω.
- source_word: ἐλυπήθητε
  choice: nalungkot kayo / ang inyong kalungkutan
  rationale: Ang “nalungkot kayo” ay natural na Filipino para sa pasibong anyo; sa ikalawang paglitaw, ginawang pangngalan ang parirala upang maging malinaw at likas ang daloy nang hindi binabago ang diwa.
- source_word: εἰς μετάνοιαν
  choice: humantong sa pagsisisi
  rationale: Ipinahahayag ng εἰς ang kinalabasan o direksiyon ng kalungkutan, at ang “pagsisisi” ay angkop sa moral at espirituwal na lakas ng μετάνοια sa konteksto.
- source_word: κατὰ θεόν
  choice: ayon sa Diyos
  rationale: Malapit ito sa anyong Griyego at pinananatiling bukas kung ang tinutukoy ay ayon sa pamantayan, kalooban, o layunin ng Diyos.
- source_word: ἵνα ἐν μηδενὶ ζημιωθῆτε
  choice: upang hindi kayo dumanas ng anumang kawalan
  rationale: Pinananatili ang layunin o inaasahang bunga ng ἵνα at ang malawak na diwa ng ζημιόω nang hindi ito nililimitahan sa pisikal na pinsala.
- source_word: ἐξ ἡμῶν
  choice: dahil sa amin
  rationale: Sa Filipino, mas malinaw nitong ipinahahayag ang pinagmumulan o sanhi na taglay ng ἐξ sa konteksto; ang literal na “mula sa amin” ay maaaring maging alanganin.
theological_decisions:
- issue: Kahulugan ng μετάνοια
  choice: pagsisisi
  alternative: pagbabago ng isip
  rationale: Bagaman kasama sa salita ang pagbabago ng pag-iisip, sa kontekstong ito ay may malinaw na moral at espirituwal na puwersa; ang “pagsisisi” ang natural at sapat na malawak na salin sa Filipino.
- issue: Uri ng kalungkutan sa κατὰ θεόν
  choice: ayon sa Diyos
  alternative: kalungkutang makadiyos / gaya ng kalooban ng Diyos
  rationale: Hindi nilulutas ng pangunahing teksto kung ito ay kalungkutang naaayon sa pamantayan, kalooban, o pagkilos ng Diyos; inilalahad sa talababa ang mga likas na pagpapakahulugan.
- issue: Ugnayan ng ἐξ ἡμῶν sa ζημιωθῆτε
  choice: dahil sa amin
  alternative: mula sa amin / sa pamamagitan namin
  rationale: Ipinakikita ang sanhi o pinagmumulan nang hindi ipinapalagay ang tiyak na uri ng kawalan o pinsala.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Iniwasan ang di-likas na “nalungkot tungo sa pagsisisi,” kaya ginamit ang “ang inyong kalungkutan ay humantong sa pagsisisi.” Ang mga marker [a] at [b] ay kapuwa nasa pangunahing teksto.
