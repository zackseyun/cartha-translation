  source_fidelity: 'Tapat ang salin sa daloy at mga pangunahing kahulugan ng Griyego: ang kasalukuyang kagalakan, ang pagdadalamhating humantong sa μετάνοια, ang κατὰ θεόν na hindi labis na binibigyang-kahulugan, at ang layuning walang maranasang kawalan dahil sa mga apostol. Ang ''dahil sa amin'' ay isang likas na pagsasalin ng ἐξ ἡμῶν sa kontekstong sanhi/pinagmulan.'
