id: 2CO.7.14
reference: 2 Corinthians 7:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι εἴ τι αὐτῷ ὑπὲρ ὑμῶν κεκαύχημαι, οὐ κατῃσχύνθην, ἀλλ’ ὡς πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν, οὕτως καὶ ἡ καύχησις ἡμῶν ⸀ἡ ἐπὶ Τίτου ἀλήθεια ἐγενήθη.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/014.yaml
  text: For if I have boasted to him at all about you[a], I was not put to shame; rather, just as we spoke everything to you in truth[b], so also our boasting to Titus proved true.
translation:
  language: tl
  text: Sapagkat kung ipinagmalaki ko man kayo sa kanya, hindi ako napahiya. Sa halip, kung paanong sinabi namin sa inyo ang lahat nang buong katapatan, gayundin ay napatunayang totoo ang ipinagmalaki namin tungkol sa inyo kay Tito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ang pagmamalaki namin sa harap ni Tito.” Ipinakikita ng konteksto na tinutukoy ni Pablo ang ipinagmalaki niya kay Tito tungkol sa mga taga-Corinto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κεκαύχημαι
  choice: ipinagmalaki ko
  rationale: Pinananatili nito ang retorikal na lakas ng pandiwang καυχάομαι at likas ito sa modernong Tagalog para sa positibong pagmamalaki tungkol sa ibang tao.
- source_word: οὐ κατῃσχύνθην
  choice: hindi ako napahiya
  rationale: 'Ipinahahayag ng ''napahiya'' ang pasibong diwa: hindi napatunayang mali ang sinabi ni Pablo kaya hindi siya inilagay sa kahihiyan.'
- source_word: πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν
  choice: sinabi namin sa inyo ang lahat nang buong katapatan
  rationale: Saklaw ng 'ang lahat' ang πάντα, samantalang inilalarawan ng 'nang buong katapatan' ang paraan ng pagsasalita at hindi lamang ang intensiyon.
- source_word: ἡ καύχησις ἡμῶν
  choice: ang ipinagmalaki namin
  rationale: Ginamit ang kaparehong salitang-ugat ng naunang pandiwa upang mapanatili ang leksikal at retorikal na ugnayan ng καυχάομαι at καύχησις; mas natural dito ang pasalitang anyo kaysa sa abstraktong 'aming pagmamalaki.'
- source_word: ἡ ἐπὶ Τίτου
  choice: tungkol sa inyo kay Tito
  rationale: Bagaman hindi inuulit ng pariralang Griyego ang 'tungkol sa inyo,' malinaw itong ipinahihiwatig ng unang sugnay. Nilinaw ito sa Tagalog upang hindi mapagkamalang si Tito ang ipinagmalaki.
- source_word: ἀλήθεια ἐγενήθη
  choice: napatunayang totoo
  rationale: Natural nitong ipinahahayag na ang ipinagmalaki ni Pablo ay napatunayang tumutugma sa realidad.
- source_word: ὅτι
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag na kaugnay ng naunang talata.
theological_decisions:
- issue: Kalikasan ng 'pagmamalaki' ni Pablo
  choice: Isinalin bilang positibong pagmamalaki o pagpuri sa mga taga-Corinto, hindi bilang makasalanang pagmamataas.
  alternative: Isalin bilang 'pagtitiwala' upang alisin ang posibleng negatibong dating.
  rationale: Maaaring tumukoy ang καυχάομαι/καύχησις sa may-katwirang pagpuri o pagmamalaki sa gamit ni Pablo. Pinananatili ng salin ang mas tuwirang leksikal na diwa at hinahayaang linawin ng konteksto na makatwiran ang pagmamalaking ito.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang 'napahiya' at 'napatunayang totoo' para sa malinaw at karaniwang pananalita, at iniwasan ang labis na literal ngunit alanganing ayos ng pariralang Griyego.
