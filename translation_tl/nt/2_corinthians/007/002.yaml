base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/002.yaml
  text: Make room for us[a]. We have wronged no one, corrupted no one[b], taken advantage of no one.
translation:
  language: tl
  text: Bigyan ninyo kami ng puwang.[a] Wala kaming ginawan ng masama kaninuman, wala kaming ipinahamak kaninuman,[b] at wala kaming pinagsamantalahan kaninuman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tanggapin ninyo kami” o “Buksan ninyo ang inyong kalooban para sa amin.” Literal na sinasabi ng Griyego, “Bigyan ninyo kami ng puwang,” na malamang ay nagpapatuloy sa larawan ng ugnayan at kalooban sa 6:11–13.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “wala kaming sinira” o “wala kaming pinasama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χωρήσατε ἡμᾶς
  choice: Bigyan ninyo kami ng puwang sa inyong kalooban
  rationale: Ang προστακτικό na χωρήσατε ay literal na humihiling na bigyan sila ng puwang. Dahil ang konteksto sa 6:11–13 ay tungkol sa kalooban at pagmamahal, idinagdag ang “sa inyong kalooban” upang maging natural at malinaw sa Tagalog habang pinananatili ang larawang may puwang para kina Pablo.
- source_word: οὐδένα
  choice: wala kaming ... sinuman / wala kaming pinagsamantalahan
  rationale: Tatlong ulit itong ginamit bilang mariing pagtanggi. Sa natural na Tagalog, naipapakita ang pag-uulit sa magkakatulad na sugnay na nagsisimula sa “Wala kaming,” bagaman ang unang dalawa ay gumagamit ng idyomatikong “ginawan ng masama” at “sinira.”
- source_word: ἠδικήσαμεν
  choice: ginawan ng masama
  rationale: 'Malawak ang ἀδικέω: gumawa ng kawalang-katarungan o manakit sa kapuwa. Ang “ginawan ng masama” ay malinaw, natural, at hindi nililimitahan ang uri ng pinsala.'
- source_word: ἐφθείραμεν
  choice: sinira
  rationale: Maaaring mangahulugan ang φθείρω ng sirain, ipahamak, o pasamain. Pinananatili ng “sinira” ang lawak at tindi ng salita nang hindi ipinapalagay kung moral, espirituwal, o ibang uri ng kapahamakan ang tinutukoy.
- source_word: ἐπλεονεκτήσαμεν
  choice: pinagsamantalahan
  rationale: Ang πλεονεκτέω ay tumutukoy sa pagsasamantala o pagkakamit ng pakinabang laban sa iba. Ang “pinagsamantalahan” ay natural at sapat na malawak upang masaklaw ang pinansiyal o personal na pagsasamantala.
theological_decisions:
- issue: Kalikasan ng panawagang Χωρήσατε ἡμᾶς
  choice: Isang panawagan na bigyan sina Pablo ng puwang sa kalooban at ugnayan ng mga taga-Corinto
  alternative: Isang pangkalahatang panawagan na tanggapin o malugod na salubungin sila
  rationale: Ang 6:11–13 ay nagsasalita tungkol sa maluwag na kalooban at hinihiling na palawakin din ng mga taga-Corinto ang kanilang kalooban. Kaya relational ang pangunahing diwa, ngunit iniiwasang gawing tiyak ang higit pa sa ipinahihiwatig ng konteksto.
- issue: Saklaw ng ἐφθείραμεν
  choice: Panatilihin ang malawak na diwang “sinira”
  alternative: Tukuyin ito bilang moral na pagpapasama, panlilinlang, o pagsasamantala
  rationale: Hindi tinutukoy ng pandiwa rito ang eksaktong uri ng pagkasira. Ang mas malawak na salin ay nagpapanatili sa tunay na leksikal na kalabuan at hindi nag-aangkat ng isang tiyak na paratang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kalooban” sa halip na mas kolokyal na “puso” upang ilarawan ang panloob at relational na pagtanggap, at pinanatili ang tatlong mariing pagtanggi sa maindayog na magkakatulad na mga sugnay.
