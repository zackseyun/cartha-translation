id: 2CO.5.19
reference: 2 Corinthians 5:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς ὅτι θεὸς ἦν ἐν Χριστῷ κόσμον καταλλάσσων ἑαυτῷ, μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν, καὶ θέμενος ἐν ἡμῖν τὸν λόγον τῆς καταλλαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/019.yaml
  text: namely[a], that God was in Messiah reconciling the world to himself, not counting their trespasses against them[d][c][b], and entrusting to us the message of reconciliation.
translation:
  language: tl
  text: Ibig sabihin,[a] ang Diyos ay nasa Mesiyas at ipinagkakasundo niya sa kanyang sarili ang sanlibutan,[b] hindi ibinibilang sa kanila ang kanilang mga paglabag, at ipinagkatiwala niya sa amin[c] ang mensahe ng pakikipagkasundo.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “na ang Diyos ay nasa Mesiyas…”'
    reason: Ipinakikita ang mas tuwirang pag-uugnay ng ὡς ὅτι sa naunang pahayag.
  - marker: b
    text: 'O: “Sa Mesiyas, ipinagkakasundo ng Diyos ang sanlibutan sa kanyang sarili.” Hindi tahasang sinasabi ng Griyego na “sa pamamagitan ng Mesiyas.”'
    reason: Pinananatili ang maaaring magkaibang pag-unawa sa ugnayan ng ἐν Χριστῷ at ng pandiwang καταλλάσσων.
  - marker: c
    text: 'Mas literal: “inilagay niya sa loob natin ang mensahe”; maaari ring unawain na “sa gitna natin” o, sa idyomatikong Tagalog, “sa amin.”'
    reason: Itinatala ang kongkretong pananalita ng θέμενος ἐν ἡμῖν at ang saklaw ng kahulugan ng ἐν nang hindi ipinipilit ang isang pagpapakahulugan.
  - marker: d
    text: 'Mas literal: “ang salita ng pakikipagkasundo.”'
    reason: Pinananatili ang leksikal na alternatibo para sa λόγος.
lexical_decisions:
- source_word: ὡς ὅτι
  choice: Ibig sabihin
  rationale: Ipinahahayag nito sa natural na Tagalog ang paliwanag na ipinapasok ng parirala, nang hindi ginagamit ang alanganing literal na anyo na “bilang na.”
- source_word: θεὸς ἦν ἐν Χριστῷ
  choice: ang Diyos ay nasa Mesiyas
  rationale: Pinananatili ang tuwirang diwa ng ἐν (“nasa”) at ang teolohikal na tensiyon ng pahayag, sa halip na gawin itong tahasang instrumental na “sa pamamagitan ng Mesiyas.”
- source_word: Χριστῷ
  choice: Mesiyas
  rationale: Ang Χριστός ay titulong nangangahulugang “Mesiyas,” kaya isinalin ang kahulugan ng titulo sa halip na gamitin lamang bilang pangalang “Cristo.”
- source_word: κόσμον
  choice: ang sanlibutan
  rationale: Malawak ang saklaw ng κόσμος dito at tumutukoy sa sangkatauhan sa pagkahiwalay nito sa Diyos; ang “sanlibutan” ay likas at marangal sa kontekstong biblikal.
- source_word: καταλλάσσων
  choice: ipinagkakasundo
  rationale: Ipinahahayag ng anyong pandiwari ang nagpapatuloy na pagkilos ng Diyos at pinananatili ang ugnayang leksikal nito sa καταλλαγή sa hulihan ng talata.
- source_word: ἑαυτῷ
  choice: sa kanyang sarili
  rationale: Tumpak na ipinapakita ang direksiyon ng pakikipagkasundo tungo sa Diyos mismo.
- source_word: μὴ λογιζόμενος
  choice: hindi ibinibilang
  rationale: Pinananatili ang metaporang pangkuwenta ng λογίζομαι sa malinaw at kasalukuyang Tagalog.
- source_word: παραπτώματα
  choice: mga pagsuway
  rationale: Ipinahahayag ang mga maling gawa o paglabag na tinutukoy ng παράπτωμα nang hindi ito pinalalawak agad sa mas pangkalahatang “mga kasalanan.”
- source_word: καὶ θέμενος ἐν ἡμῖν
  choice: at ipinagkatiwala niya sa amin
  rationale: Sa idyomang ito, ang literal na paglalagay ng mensahe “sa amin” ay likas na nangangahulugang pagbibigay nito sa aming pangangalaga at pananagutan; itinatala sa talababa ang mas literal na anyo.
- source_word: τὸν λόγον τῆς καταλλαγῆς
  choice: ang mensahe ng pakikipagkasundo
  rationale: Ang λόγος ay tumutukoy rito sa nilalamang ipinahahayag, kaya mas malinaw ang “mensahe” sa modernong Tagalog; pinananatili sa talababa ang literal na “salita.”
theological_decisions:
- issue: Pagpapakahulugan sa θεὸς ἦν ἐν Χριστῷ
  choice: ang Diyos ay nasa Mesiyas
  alternative: sa Mesiyas, ipinagkakasundo ng Diyos ang sanlibutan sa kanyang sarili; o sa pamamagitan ng Mesiyas
  rationale: Ang pangunahing teksto ay pinakamalapit sa ayos at pang-ukol ng Griyego at hindi tahasang nagpapasiya kung ang ἐν ay lokatibo, saklaw ng pagkilos, o instrumental.
- issue: Pagpapakahulugan sa Χριστῷ bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Isinasalin ang semantikong nilalaman ng titulong Χριστός habang pinananatiling malinaw na tumutukoy ito sa hinirang at pinahiran ng Diyos.
- issue: Pagpapakahulugan sa θέμενος ἐν ἡμῖν
  choice: ipinagkatiwala niya sa amin
  alternative: inilagay niya sa amin / sa kalooban namin
  rationale: Ang pangunahing salin ay natural na nagpapahayag ng ministeryal na atas, ngunit kinikilala ng talababa ang konkretong anyo ng Griyego at ang maaaring diin nito sa “nasa amin.”
- issue: Ugnayan ng καταλλάσσων at καταλλαγῆς
  choice: ipinagkakasundo / pakikipagkasundo
  alternative: ibinabalik sa mabuting ugnayan / pagkakasundo
  rationale: Pinananatili ang pag-uulit ng magkaugnay na salitang Griyego at ang teolohikal na diin na ang Diyos ang kumikilos upang mapanumbalik ang ugnayan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa publikong pagbasa. Ginamit ang “Mesiyas” bilang salin ng titulo, “sanlibutan” para sa malawak na saklaw ng κόσμος, at mga pandiwang madaling maunawaan nang hindi inaalis ang teolohikal na tensiyon ng Griyego.
