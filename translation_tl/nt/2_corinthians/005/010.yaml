source:
  edition: SBLGNT
  text: τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν, εἴτε ἀγαθὸν εἴτε ⸀φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/010.yaml
  text: For we all must be revealed before the judgment seat of Messiah[a], so that each one may receive what is due for what he has done in the body[d][c][b], whether good or bad.
translation:
  language: tl
  text: Sapagkat tayong lahat ay kailangang mahayag sa harap ng hukuman ng Mesiyas[a][b], upang tanggapin ng bawat isa ang nararapat ayon sa ginawa niya sa pamamagitan ng katawan[c], mabuti man o masama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “humarap sa hukuman ng Mesiyas.” Maaaring tumukoy ang pandiwang Griyego sa simpleng pagharap o sa hayagang pagkakalantad; pinananatili sa pangunahing teksto ang mas malakas na diwa ng pagiging hayag.
    reason: lexical_alternative
  - marker: b
    text: Griyego “Cristo”; isinalin ditong “Mesiyas” sapagkat ginagamit ang Χριστός bilang titulo.
    reason: alternative_reading
  - marker: c
    text: O “ayon sa mga ginawa niya habang nasa katawan.” Ang pariralang Griyego ay maaari ring unawain bilang mga gawang isinagawa sa buong buhay na may katawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθῆναι
  choice: mahayag
  rationale: Ang pasibong pawatas ay maaaring tumukoy hindi lamang sa pagharap kundi sa hayagang pagkakakilala o pagkakalantad. Pinananatili ng “mahayag” ang mas matinding diwang ito sa konteksto ng pagsusuri.
- source_word: βήματος
  choice: hukuman
  rationale: Sa kontekstong ito, ang βῆμα ay upuang o platapormang pinaghahatulan. Ang “hukuman” ang pinakanatural na makabagong Tagalog na nagpapahayag sa hudisyal na tagpo.
- source_word: Χριστοῦ
  choice: ng Mesiyas
  rationale: Ang Χριστός ay gumaganap dito bilang titulo. Ang “Mesiyas” ay malinaw na salin ng pinahirang hari, samantalang itinatala sa talababa ang nakaugaliang anyong “Cristo.”
- source_word: κομίσηται
  choice: tanggapin ... ang nararapat
  rationale: Ipinahihiwatig ng pandiwang nasa middle voice ang pagtanggap pabalik ng naaayon sa ginawa. Nililinaw ng “ang nararapat” ang ganting diwa nang hindi tinutukoy kung gantimpala o parusa lamang.
- source_word: ἕκαστος
  choice: bawat isa
  rationale: Pinananatili nito ang distributibong isahan at ang pansariling pananagutan ng bawat tao.
- source_word: τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν
  choice: ang nararapat ayon sa ginawa niya sa pamamagitan ng katawan
  rationale: Ang siksik na pariralang Griyego ay nag-uugnay ng tatanggapin sa ginawa ng bawat isa; ang διά na may genitive ay likas na may diwang instrumental na “sa pamamagitan ng.” Ang salin ay natural sa Tagalog ngunit pinananatili ang ugnayan ng kabayaran, gawa, at buhay na may katawan.
- source_word: ἀγαθὸν ... φαῦλον
  choice: mabuti ... masama
  rationale: Direkta at malawak ang paghahambing. Hindi pinalalakas ang φαῦλον tungo sa mas makitid na “napakasama” o “walang halaga.”
theological_decisions:
- issue: Saklaw at kalikasan ng paghatol sa harap ng Mesiyas
  choice: Pinanatili ang pangkalahatang “tayong lahat,” ang hudisyal na tagpo, at ang pagtanggap ng bawat isa ayon sa kanyang ginawa.
  alternative: Tukuyin ito bilang pagsusuri lamang sa gantimpala ng mga mananampalataya, o bilang pangwakas na paghatol sa buong sangkatauhan.
  rationale: Malinaw sa talata ang panlahatang pagharap, indibidwal na pananagutan, at pagtanggap ayon sa gawa, ngunit hindi nito tahasang nilulutas ang sistematikong tanong tungkol sa eksaktong saklaw o kahihinatnan ng paghatol.
- issue: Lakas ng φανερωθῆναι
  choice: “mahayag” upang panatilihin ang posibilidad ng pagkakalantad sa pagsusuri
  alternative: “humarap” o “magpakita” bilang simpleng pagdating sa hukuman
  rationale: Maaaring saklawin ng pandiwa ang pagharap, ngunit ang pasibong anyo at konteksto ay nagpapahintulot sa mas malakas na diwa ng pagiging hayag. Hindi dapat burahin ang ambiguwidad, kaya ibinigay ang alternatibo sa talababa.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “hukuman” sa halip na teknikal na “tribunal,” at “Mesiyas” bilang malinaw na titulong katumbas ng Χριστός. Pinanatili ang pormal na bigat ng talata nang hindi ginagawang arkaiko ang pangungusap.
