id: 2CO.5.4
reference: 2 Corinthians 5:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ γὰρ οἱ ὄντες ἐν τῷ σκήνει στενάζομεν βαρούμενοι ἐφ’ ᾧ οὐ θέλομεν ἐκδύσασθαι ἀλλ’ ἐπενδύσασθαι, ἵνα καταποθῇ τὸ θνητὸν ὑπὸ τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/004.yaml
  text: For indeed[a], while we are in this tent, we groan, being burdened, because we do not want to be unclothed but to be further clothed[b], so that what is mortal may be swallowed up by life.
translation:
  language: tl
  text: Sapagkat tunay nga, habang tayo ay nasa toldang ito, dumaraing tayo, na nabibigatan, sapagkat hindi natin nais na mahubaran kundi madagdagan pa ng kasuotan[a], upang ang may kamatayan[b] ay lamunin ng buhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mabihisan sa ibabaw.” Ipinahihiwatig ng pandiwang Griyego ang pagsusuot ng panlabas na kasuotan sa ibabaw ng nakasuot na.
    reason: lexical_alternative
  - marker: b
    text: O “yaong mortal” o “ang pagiging mortal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sapagkat tunay nga
  rationale: Pinananatili nito kapwa ang paliwanag na ugnayan sa naunang talata at ang pagbibigay-diin ng parirala.
- source_word: σκήνει
  choice: tolda
  rationale: Pinananatili ng “tolda” ang talinghaga ni Pablo para sa kasalukuyang pag-iral sa katawan at ang kaugnayan nito sa nakapaligid na konteksto.
- source_word: στενάζομεν
  choice: dumaraing tayo
  rationale: Mas malinaw na ipinahihiwatig ng “dumaraing” ang bigat at matinding pananabik kaysa sa mas mahinang “bumubuntong-hininga.”
- source_word: βαρούμενοι
  choice: dahil nabibigatan tayo
  rationale: Ipinapahayag nito ang pasibong diwa at ang sanhi o kalagayang kaakibat ng pagdaing sa natural na Tagalog.
- source_word: ἐφ’ ᾧ
  choice: sapagkat
  rationale: Sa kontekstong ito, pinakamalamang na ipinakikilala ng parirala ang dahilan ng pagdaing; malinaw at natural itong naipahahayag ng “sapagkat.”
- source_word: ἐκδύσασθαι
  choice: mahubaran
  rationale: Pinananatili nito ang talinghaga ng pananamit nang hindi tinutukoy nang tahasan ang isang partikular na doktrina tungkol sa kalagayan pagkamatay.
- source_word: ἐπενδύσασθαι
  choice: mabihisan sa ibabaw
  rationale: Ipinahihiwatig ng tambalang pandiwa ang pagsusuot ng isa pang kasuotan sa ibabaw ng suot na; pinananatili ng salin ang natatanging larawang ito.
- source_word: καταποθῇ
  choice: ay lamunin
  rationale: Pinananatili ng “lamunin” ang matingkad na talinghaga ng ganap na pagdaig o paglupig.
- source_word: τὸ θνητόν
  choice: ang mortal
  rationale: Ang pang-uring neuter ay ginamit bilang pangngalan. Pinananatili ng “ang mortal” ang malawak at bahagyang di-tiyak na saklaw nito sa halip na limitahan ito sa abstraktong “pagiging mortal.”
- source_word: ζωῆς
  choice: buhay
  rationale: Natural itong katapat ng mortalidad at hindi nagdaragdag ng kahulugang wala sa Griyego.
theological_decisions:
- issue: Ang talinghaga ng pananamit at ang kalagayan sa pagitan ng kamatayan at muling pagkabuhay
  choice: Panatilihin ang mga larawang “mahubaran” at “mabihisan sa ibabaw” nang hindi ipinapaliwanag ang mga ito ayon sa isang tiyak na sistemang doktrinal.
  alternative: Tahasang ipakahulugan ang “mahubaran” bilang pag-iral na walang katawan, o ang “mabihisan sa ibabaw” bilang tumutukoy lamang sa katawan sa muling pagkabuhay.
  rationale: Talinghaga ang ginamit ng talata tungkol sa kasalukuyang mortal na pag-iral at sa pagbabagong dulot ng buhay. Ang pagpapanatili sa larawan ay hindi tahimik na lumulutas sa pinagtatalunang teolohikal na tanong.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang magkakaugnay na talinghaga ng tolda, paghuhubad, pagbibihis sa ibabaw, at paglamon. Inilagay ang mga panandang [a] at [b] sa mismong mga salitang tinutukoy ng mga talababa; itinutuwid nito ang maliwanag na pagkakalipat ng mga pananda sa ibinigay na English consultation text.
