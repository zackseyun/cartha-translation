revisions:
- from: Sapagkat tunay nga, habang tayo ay nasa toldang ito, dumaraing tayo dahil nabibigatan tayo, sapagkat ayaw nating mahubaran kundi mabihisan sa ibabaw[a], upang ang mortal[b] ay lamunin ng buhay.
  to: Sapagkat tunay nga, habang tayo ay nasa toldang ito, dumaraing tayo, na nabibigatan, sapagkat hindi natin nais na mahubaran kundi madagdagan pa ng kasuotan[a], upang ang may kamatayan[b] ay lamunin ng buhay.
  rationale: 'Inayos ang mga katagang hindi likas sa modernong Filipino at nilinaw ang ugnayan ng participial na ''na nabibigatan'' at ng dahilang ''sapagkat.'' Napanatili ang ambiguidad ng metapora: hindi tinutukoy ng salin kung ang paghuhubad o karagdagang pananamit ay dapat ipaliwanag ayon sa anumang natatanging sistemang doktrinal. Nananatili rin ang wastong pagkakaangkla ng [a] sa ἐπενδύσασθαι at [b] sa τὸ θνητόν.'
