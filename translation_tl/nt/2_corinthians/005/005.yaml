base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/005.yaml
  text: The one who prepared us for this very thing is God[b][a], who gave us the down payment of the Spirit.
translation:
  language: tl
  text: Ang naghanda sa atin para sa mismong bagay na ito ay ang Diyos, na nagbigay sa atin ng paunang bayad ng Espiritu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “panagot,” “deposito,” o “unang hulog.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring ang Espiritu mismo ang paunang bayad, o ang “paunang bayad ng Espiritu” ay unawaing isang paunang bayad na nauugnay sa Espiritu.
    reason: alternative_reading
lexical_decisions:
- source_word: κατεργασάμενος
  choice: naghanda
  rationale: Sa konteksto ng hinaharap na kalagayang may katawan (tal. 1–4), ipinahihiwatig ng pandiwa ang may-layuning paghahanda ng Diyos sa mga mananampalataya.
- source_word: εἰς αὐτὸ τοῦτο
  choice: para sa mismong layuning ito
  rationale: Pinananatili nito ang mariing pagtukoy sa tiyak na bagay na katatalakay lamang, habang natural sa modernong Tagalog.
- source_word: θεός
  choice: Ang Diyos ang siyang
  rationale: Malinaw na ipinakikilala ang Diyos bilang gumagawa ng paghahanda, at tinutumbasan ng 'siyang' ang mariing pagkakakilanlan sa sugnay.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay o pagpapatuloy lamang ito rito; sapat nang ipinapakita ng pagkakasunod ng mga pangungusap ang ugnayan, kaya iniwasan ang di-likas na panimulang 'Ngayon' o ang labis na salungatang 'Ngunit.'
- source_word: δοὺς
  choice: Siya rin ang nagbigay
  rationale: Ginawang hiwalay na kaugnay na pangungusap ang participle upang maging malinaw at natural sa Tagalog, habang ipinapakita ang kaugnayan nito sa naunang gawa ng Diyos.
- source_word: ἀρραβῶνα
  choice: paunang bayad
  rationale: 'Pinananatili ang konkretong larawang pangkalakalan: isang unang bahagi ng bayad na tumitiyak na darating ang kabuuan.'
- source_word: τοῦ πνεύματος
  choice: ng Espiritu bilang paunang bayad
  rationale: Natural sa Tagalog ang ayos na ito at ipinapakita ang malamang na appositional na diwa na ang Espiritu mismo ang kaloob, habang inilalahad sa talababa ang tunay na gramatikal na posibilidad.
theological_decisions:
- issue: Kahulugan ng ἀρραβῶνα τοῦ πνεύματος
  choice: Ang Espiritu mismo ang paunang bayad na ibinigay ng Diyos at tumitiyak sa darating na kaganapan.
  alternative: Maaaring unawain na ang Diyos ay nagbigay ng paunang bayad o katiyakang kaugnay ng kung ano ang isasakatuparan ng Espiritu.
  rationale: Sa ibang gamit ni Pablo (2 Cor 1:22; Efe 1:13–14), malakas ang pahiwatig na ang Espiritu ang mismong kaloob at garantiya. Gayunman, hindi ganap na nilulutas ng genitibong Griyego ang relasyon, kaya pinananatili sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “paunang bayad” upang mapanatili ang konkretong metapora at ang ideya ng kasalukuyang unang bahagi na gumagarantiya sa ganap na katuparan. Parehong nasa pangunahing teksto ang mga panandang [a] at [b].
