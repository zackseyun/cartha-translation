  rationale: Ang rebisyon ay nililinaw ang pangunahing salin ng eliptikong καινὴ κτίσις bilang “bagong paglalang,” na mas natural na katumbas ng “new creation” sa Filipino at hindi paunang ipinapasiya na ang tao mismo lamang ang tinutukoy. Inayos din ang pangwakas na sugnay upang higit na masalamin ang perpektong γέγονεν nang walang idinagdag na saklaw gaya ng “lahat.”
