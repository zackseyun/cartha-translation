  text: ὥστε εἴ τις ἐν Χριστῷ, καινὴ κτίσις· τὰ ἀρχαῖα παρῆλθεν, ἰδοὺ γέγονεν ⸀καινά·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/017.yaml
  text: So then[a], if anyone is in Messiah, there is a new creation; the old things have passed away; behold[b], new things have come.
translation:
  language: tl
  text: Kaya nga, kung ang sinuman ay nasa Mesiyas, may bagong paglalang[a]; lumipas na ang mga dating bagay; masdan[b], nagkaroon na ng mga bagong bagay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “siya ay bagong nilalang.” Eliptiko ang Griyego; sa literal, “kung ang sinuman ay nasa Mesiyas—bagong paglalang.”
    reason: alternative_reading
  - marker: b
    text: Maraming salin ang may, “naging bago na ang lahat.” Ngunit ang tekstong SBLGNT dito ay nagsasaad lamang ng “mga bagong bagay,” at walang tahasang salita para sa “lahat.”
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: Kaya
  rationale: Nagpapahiwatig ito ng konklusyong hinango mula sa naunang pangangatwiran at natural sa makabagong Tagalog.
- source_word: εἴ τις
  choice: kung ang sinuman
  rationale: Pinananatili ang pangkalahatan at walang-tanging diwa ng kondisyong Griyego nang hindi nagdaragdag ng kasariang panlalaki.
- source_word: ἐν Χριστῷ
  choice: nasa Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” at pinananatili ang mahalagang wika ni Pablo tungkol sa pagiging nakaugnay sa kanya.
- source_word: καινὴ κτίσις
  choice: may bagong nilalang
  rationale: Walang pandiwa ang maikli at malabong pariralang Griyego. Ang “may” ay hindi tahasang ginagawang panaguri lamang tungkol sa tao, kaya naiiwang bukas ang mas malawak na diwa ng bagong paglalang; nasa talababa ang indibiduwal na pagbasa.
- source_word: τὰ ἀρχαῖα
  choice: ang mga dating bagay
  rationale: Tumutugma sa pangmaramihang pang-uring ginamit bilang pangngalan at iniiwang malawak ang saklaw.
- source_word: παρῆλθεν
  choice: lumipas na
  rationale: Natural na Tagalog na nagpapahayag ng pangyayaring naganap na at may bisa pa sa kasalukuyan.
- source_word: ἰδοὺ
  choice: masdan
  rationale: Pinananatili ang panawag-pansing lakas ng kataga sa marangal ngunit nauunawaang makabagong Tagalog.
- source_word: γέγονεν καινά
  choice: dumating na ang mga bagong bagay
  rationale: Sinasalamin ang pangmaramihang καινά at ang kasalukuyang kalagayang bunga ng naganap na pagbabago, nang hindi idinaragdag ang “lahat” na wala sa SBLGNT na tekstong ito.
theological_decisions:
- issue: Kung isasalin bilang titulo o parang pangalan ang Χριστῷ
  choice: nasa Mesiyas
  alternative: na kay Cristo
  rationale: Ang Χριστός ay titulong tumutukoy sa Mesiyas; pinananatili ng salin ang kahulugang ito sa pormulang Paulino.
- issue: Kung paano ihahayag ang eliptikong καινὴ κτίσις
  choice: may bagong nilalang
  alternative: siya ay bagong nilalang
  rationale: Walang tahasang pandiwa o paksa ang Griyego. Hindi nililimitahan ng pangunahing salin ang pahayag sa indibiduwal lamang, habang pinananatili sa talababa ang lehitimong pagbasa tungkol sa tao.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Mesiyas” bilang salin ng titulo at ang “masdan” upang mapanatili ang retorikal na diin nang hindi gumagamit ng lubhang lipas na pananalita.
