id: 2CO.5.18
reference: 2 Corinthians 5:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὰ δὲ πάντα ἐκ τοῦ θεοῦ τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ ⸀διὰ Χριστοῦ καὶ δόντος ἡμῖν τὴν διακονίαν τῆς καταλλαγῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/018.yaml
  text: All these things are from God[a], who reconciled us to himself through Messiah and gave us the ministry of reconciliation[c][b],
translation:
  language: tl
  text: Ang lahat ng ito[a] ay mula sa Diyos, na ipinagkasundo tayo sa kanya sa pamamagitan ng Mesiyas[b] at nagbigay sa atin[c] ng ministeryo ng pakikipagkasundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang lahat ng bagay.” Maaaring tumukoy ang parirala sa lahat ng kabilang sa bagong kalagayang ito, o mas tiyak sa mga bagay na kababanggit lamang.
    reason: lexical_alternative
  - marker: b
    text: 'Griyego: “sa pamamagitan ni Cristo.” Isinaling “Mesiyas” dahil ginagamit dito ang Χριστός bilang titulo.'
    reason: alternative_reading
  - marker: c
    text: Maaaring malawak na tumukoy ang “tayo” at “atin” sa mga mananampalataya; gayunman, sa kalapit na konteksto ay partikular na binibigyang-diin ni Pablo ang misyong ipinagkatiwala sa kanya at sa kanyang mga kamanggagawa.
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ δὲ πάντα
  choice: Ang lahat ng ito
  rationale: Ang may artikulong neuter plural ay likas na tumutukoy sa mga bagay na kababanggit lamang, lalo na sa bagong nilalang at nabagong kalagayan. Hindi ginawang tahasang pang-abay ang δέ; sapat na sa natural na Tagalog ang paglipat ng pangungusap sa konteksto.
- source_word: ἐκ τοῦ θεοῦ
  choice: ay mula sa Diyos
  rationale: Ipinapahayag ng ἐκ ang pinagmulan; malinaw at natural sa Tagalog ang “mula sa Diyos.”
- source_word: τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ
  choice: na ipinagkasundo tayo sa kanya
  rationale: Ginawang sugnay na panuring ang aorist participle. Pinananatili ng “ipinagkasundo” ang Diyos bilang kumikilos upang maibalik ang relasyon, at natural na tinutumbasan ng “sa kanya” ang reflexive dative.
- source_word: διὰ Χριστοῦ
  choice: sa pamamagitan ng Mesiyas
  rationale: Ang διά na may genitive ay nagpapahayag ng paraan o tagapamagitan. Ginamit ang “Mesiyas” dahil gumaganap dito ang Χριστός bilang titulo.
- source_word: καὶ δόντος ἡμῖν
  choice: at nagbigay sa atin
  rationale: Ang ikalawang aorist participle ay kaugnay ng una at natural na isinalin bilang pandiwang may Diyos pa rin bilang simuno.
- source_word: τὴν διακονίαν τῆς καταλλαγῆς
  choice: ang ministeryo ng pakikipagkasundo
  rationale: Ang διακονία ay isang ipinagkatiwalang paglilingkod o ministeryo. Pinananatili ng pariralang “ng pakikipagkasundo” ang maikli at bukas na ugnayang genitive sa orihinal.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa talatang ito, binibigyang-diin ang tungkulin o titulo ng Χριστός bilang tagapamagitan ng pakikipagkasundo, kaya “Mesiyas” ang ginamit.
- issue: Saklaw ng ἡμᾶς at ἡμῖν
  choice: tayo / atin
  alternative: tayong mga mananampalataya sa pangkalahatan, o si Pablo at ang kanyang mga kamanggagawa sa partikular
  rationale: Hindi tahasang nililinaw ng Griyego ang buong saklaw. Pinananatili ng salin ang panghalip, habang ipinapaliwanag sa talababa ang posibleng diin ng konteksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang terminong “ministeryo” dahil ipinahihiwatig ng konteksto ang isang ipinagkatiwalang paglilingkod, ngunit iniwasang paliitin sa pangunahing teksto ang saklaw nito sa isang natatanging pangkat lamang.
