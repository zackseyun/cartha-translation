base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/014.yaml
  text: 'For the love of Messiah compels us[a], because we have concluded this: that one died on behalf of all; therefore all died.'
translation:
  language: tl
  text: 'Sapagkat ang pag-ibig ng Mesiyas ang nag-uudyok sa amin[a], yamang ito ang aming naipasiya: na iisa ang namatay alang-alang sa lahat; kaya ang lahat ay namatay.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari itong mangahulugang “ang pag-ibig ng Mesiyas sa atin” o “ang pag-ibig natin para sa Mesiyas”; maaaring maunawaan sa alinmang paraan ang anyong Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: pag-ibig
  rationale: Natural at karaniwang katumbas sa makabagong Tagalog, nang walang makalumang himig.
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas”; pinananatili ng pariralang may “ng” ang lawak ng genitive sa halip na tahasang tukuyin kung pag-ibig ng Mesiyas o pag-ibig para sa kanya.
- source_word: συνέχει
  choice: nag-uudyok
  rationale: Ipinahahayag ang malakas na puwersang gumagabay at nagpapakilos sa konteksto; mas natural ito kaysa “pumipigil” o “sumisupil,” na maaaring magbigay ng maling diwa.
- source_word: κρίναντας
  choice: yamang ito ang aming naipasiya
  rationale: Ipinakikita ang lohikal na batayan ng pahayag at ang diwa ng isang pinag-isipang pasiya o kongklusyon.
- source_word: εἷς
  choice: ang isa
  rationale: Pinananatili ang maigsi at retorikal na anyo ng Griyego nang hindi idinaragdag sa teksto ang tahasang tinutukoy.
- source_word: ὑπὲρ πάντων
  choice: alang-alang sa lahat
  rationale: Natural na Tagalog para sa pagkilos para sa kapakanan o kapakanan-bilang-kinatawan ng lahat, nang hindi nililimitahan ito sa “kapalit ng lahat.”
- source_word: ἄρα
  choice: kaya
  rationale: Malinaw at natural na naghuhudyat ng kongklusyon o bunga.
- source_word: οἱ πάντες ἀπέθανον
  choice: ang lahat ay namatay
  rationale: Pinananatili ang siksik at tuwirang pahayag, nang walang idinaragdag na paliwanag tungkol sa representasyon o pakikibahagi.
theological_decisions:
- issue: Lakas ng genitive sa ἡ ἀγάπη τοῦ Χριστοῦ
  choice: “ang pag-ibig ng Mesiyas” sa pangunahing teksto, na may talababa tungkol sa dalawang posibleng ugnayan
  alternative: “ang pag-ibig ng Mesiyas sa atin” o “ang pag-ibig natin sa Mesiyas”
  rationale: Maaaring subjective o objective genitive ang Griyego. Hindi dapat tahimik na lutasin ng salin ang tunay na kalabuan.
- issue: Kahulugan ng “ang lahat ay namatay”
  choice: Literal at maigsi itong pinanatili
  alternative: “ang lahat ay namatay bilang kinatawan sa Mesiyas” o “ang lahat ng mananampalataya ay namatay na kasama niya”
  rationale: Maaaring ipinahihiwatig ng pangangatwiran ni Pablo ang kinatawang pakikibahagi, ngunit hindi iyon tahasang pinalalawak ng mismong talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Mesiyas” bilang salin ng titulong Χριστός. Inilagay ang talababa sa mismong pariralang may tunay na kalabuan.
