  text: if indeed[a], when we have been clothed, we will not be found naked.
translation:
  language: tl
  text: Kung tunay nga na nakapagbihis na tayo, hindi tayo masusumpungang hubad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴ γε
  choice: kung tunay nga
  rationale: Pinananatili nito ang kondisyon ng εἴ at ang mapagdiing diwa ng γε nang hindi ginagawang tiyak ang pahayag.
- source_word: καὶ ἐνδυσάμενοι
  choice: na kapag nabihisan na tayo
  rationale: Ipinahahayag nang natural sa Tagalog ang ugnayang kondisyonal at temporal ng participle sa pangunahing pandiwa. Ang “nabihisan” ay umaayon sa talinghaga ng pananamit sa konteksto, bagaman maaaring unawain ang middle form bilang aktibong “naisuot natin.”
- source_word: οὐ
  choice: hindi
  rationale: Tuwirang katumbas ng karaniwang pagtanggi sa pandiwang nasa hinaharap.
- source_word: γυμνοὶ
  choice: hubad
  rationale: Pinananatili ang tuwirang talinghaga ng γυμνός at hindi ipinapaliwanag kung ano ang tiyak na tinutukoy ng kahubaran.
- source_word: εὑρεθησόμεθα
  choice: masusumpungang
  rationale: Natural na Tagalog para sa future passive na “matatagpuang” o “mapatutunayang nasa isang kalagayan,” habang pinananatili ang passive na diwa.
theological_decisions:
- issue: Kahulugan ng talinghaga ng pagkabihis at pagiging hubad
  choice: Pinanatili ang talinghaga nang hindi tinutukoy kung ang “hubad” ay kalagayang walang katawan, kawalan ng makalangit na katawan o tahanan, o kahihiyan at pagkakalantad sa harap ng Diyos.
  alternative: Ipaliwanag ang “hubad” bilang isang tiyak na kalagayan sa pagitan ng kamatayan at muling pagkabuhay, bilang kawalan ng katawang muling binuhay, o bilang eskatolohikal na kahihiyan.
  rationale: Hindi tahasang nililinaw ng talata ang buong teolohikal na kahulugan ng larawan; kaya pinananatili ng salin ang tunay na kalabuan at tensiyon nito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nabihisan” at “hubad” upang manatiling malinaw sa karaniwang mambabasa ang talinghaga ng pananamit; ang anyong “kung tunay nga” ay sadyang nagpapanatili sa kondisyonal at mapagdiing himig ng Griyego.
