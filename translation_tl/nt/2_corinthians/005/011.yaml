  naturalness: Malinaw at marangal ang pangunahing teksto. Gayunman, ang “pagkatakot” ay hindi kasing-likas ng payak at matatag na biblikal na pariralang “takot sa Panginoon.”
  terminology: Ang “Panginoon,” “mga tao,” at “mga budhi” ay angkop sa modernong Filipino Tagalog. Dapat palitan sa talababa ang “mapitagang paghanga,” dahil ang paghanga ay maaaring mangahulugang admiration at hindi wastong katumbas ng reverent awe; “mapitagang paggalang” ang mas tumpak.
