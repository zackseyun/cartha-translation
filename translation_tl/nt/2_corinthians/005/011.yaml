base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/011.yaml
  text: Therefore[a], knowing the fear of the Lord, we persuade people; but we have been made known to God[b], and I hope that we also have been made known in your consciences.
translation:
  language: tl
  text: Kaya, yamang batid namin ang takot sa Panginoon[a], hinihikayat namin ang mga tao. Ngunit hayag kami sa Diyos[b], at umaasa akong hayag din kami sa inyong mga budhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “takot sa Panginoon” ay maaari ring maunawaan bilang mapitagang paggalang sa Panginoon, lalo na dahil binanggit sa naunang talata ang pagharap sa hukuman ni Cristo.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “ngunit lubos kaming nakikilala ng Diyos.” Ganito rin ang diwa ng “hayag din kami” sa huling bahagi ng talata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰδότες οὖν
  choice: Kaya, yamang batid namin
  rationale: Pinananatili ng “kaya” ang paghinuha mula sa naunang talata, samantalang ipinahahayag ng “yamang batid namin” ang kasalukuyang bisa ng perfect participle nang hindi ginagawang hiwalay na pangungusap.
- source_word: τὸν φόβον τοῦ κυρίου
  choice: ang pagkatakot sa Panginoon
  rationale: Pinananatili ang matibay na salitang “pagkatakot,” na maaaring sumaklaw sa pagpipitagan at pananagutan sa harap ng Panginoon, lalo na sa konteksto ng hukuman sa talata 10.
- source_word: ἀνθρώπους πείθομεν
  choice: hinihikayat namin ang mga tao
  rationale: Ang “hinihikayat” ay likas sa makabagong Filipino para sa pagsisikap na makahimok sa iba, habang ang “mga tao” ay wastong pangkalahatang pantukoy at hindi limitado sa kalalakihan.
- source_word: θεῷ δὲ πεφανερώμεθα
  choice: Ngunit hayag kami sa Diyos
  rationale: 'Ipinahahayag ng “hayag kami” ang kinalabasang kalagayan ng perfect passive: lubos na nakalantad at nakikilala sila ng Diyos. Iniiwasan nito ang di-likas na “naipahayag kami.”'
- source_word: ἐλπίζω
  choice: umaasa ako
  rationale: Tuwirang ipinapahayag ang personal at maingat na pag-asa ni Pablo.
- source_word: ἐν ταῖς συνειδήσεσιν ὑμῶν
  choice: sa inyong mga budhi
  rationale: Pinananatili ang maramihang anyo ng Griyego at tinutukoy ang panloob na kamalayang moral ng bawat mambabasa.
- source_word: πεφανερῶσθαι
  choice: hayag din kami
  rationale: Ang likas na pariralang Filipino ay nagpapanatili sa resultang diwa ng perfect passive at inuulit ang ugnayan sa naunang “hayag kami sa Diyos.”
theological_decisions:
- issue: Kahulugan ng “pagkatakot sa Panginoon”
  choice: Panatilihin ang “pagkatakot” sa pangunahing teksto.
  alternative: “pagpipitagan sa Panginoon”
  rationale: Maaaring kabilang ang mapitagang paghanga, ngunit dahil binanggit sa naunang talata ang paghatol ni Cristo, ang “pagpipitagan” lamang ay maaaring magpahina sa bigat ng pananagutan sa teksto.
- issue: Diwa ng φανερόω kaugnay ng Diyos at ng mga taga-Corinto
  choice: “hayag kami”
  alternative: “ipinakilala kami” o “nahayag kami”
  rationale: Ipinahihiwatig nito na ang tunay na pagkatao at paglilingkod ng mga apostol ay lantad sa Diyos at, ayon sa pag-asa ni Pablo, kinikilala rin ng mga budhi ng mga taga-Corinto, nang walang idinaragdag na doktrinal na paliwanag.
translation_notes:
  register: Makabago at madaling maunawaang Filipino na may marangal na himig. Ginamit ang “batid” at “budhi” bilang pamilyar na salitang pampanitikan at panrelihiyon, ngunit iniwasan ang lipas o labis na teknikal na pananalita. Hinati sa dalawang pangungusap upang maging malinaw nang hindi nawawala ang lohikal na ugnayan.
