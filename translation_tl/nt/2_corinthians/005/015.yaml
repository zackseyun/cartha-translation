  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὑπὲρ πάντων ἀπέθανεν ἵνα οἱ ζῶντες μηκέτι ἑαυτοῖς ζῶσιν ἀλλὰ τῷ ὑπὲρ αὐτῶν ἀποθανόντι καὶ ἐγερθέντι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/015.yaml
  text: And he died for all[a], so that those who live might no longer live for themselves[b], but for the one who died and was raised for them.
translation:
  language: tl
  text: At namatay siya para sa lahat[a], upang ang mga nabubuhay ay hindi na mabuhay para sa kanilang sarili, kundi para sa kanya na namatay at ibinangon para sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “alang-alang sa lahat.” Ang ὑπέρ ay maaaring magpahiwatig ng pagkilos para sa kapakinabangan o bilang kinatawan ng iba.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, pasibo ang “ibinangon”; maaari ring isaling “muling nabuhay,” ngunit hindi gaanong lantad doon ang pasibong anyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ πάντων
  choice: para sa lahat
  rationale: Ang ὑπέρ na may genitive ay nagpapahayag ng kapakinabangan o pagkilos alang-alang sa iba. Likas sa modernong Tagalog ang “para sa lahat” at hindi nito labis na tinutukoy ang isang partikular na teorya ng pagtubos.
- source_word: ἀπέθανεν
  choice: namatay siya
  rationale: Ang aorist indicative ay tumutukoy sa naganap na pagkamatay; ang “siya” ay likas na pagsasabi sa Tagalog ng paksang nakapaloob sa pandiwang Griyego at konteksto.
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili ng “upang” ang layunin o nilalayong bunga ng pagkamatay ni Cristo sa isang dignificado ngunit karaniwang gamit.
- source_word: οἱ ζῶντες
  choice: ang mga nabubuhay
  rationale: Ang substantival present participle ay tumutukoy sa mga taong nabubuhay; pinananatili ng parirala ang ugnayang salita sa kasunod na ζῶσιν nang hindi nilulutas kung pisikal o espirituwal ang diin.
- source_word: μηκέτι
  choice: hindi na
  rationale: Karaniwang katumbas ito ng paghinto sa dating kalagayan o gawi.
- source_word: ἑαυτοῖς ζῶσιν
  choice: mabuhay para sa kanilang sarili
  rationale: Ipinahahayag nito ang buhay na nakatuon sa sariling kapakanan. Mas natural ito kaysa sa literal na “mabuhay sa kanilang sarili.”
- source_word: ἀλλὰ τῷ ... ἀποθανόντι καὶ ἐγερθέντι
  choice: kundi para sa kanya na namatay at muling binuhay
  rationale: 'Ipinagpapatuloy ng dative ang kaibahan: hindi para sa sarili kundi para sa isa pa. Pinananatili rin ang dalawang participle at ang pasibong tinig ng ἐγερθέντι.'
- source_word: ἐγερθέντι
  choice: muling binuhay
  rationale: 'Malinaw nitong pinananatili ang aorist passive: siya ay ibinangon o binuhay ng kumikilos na hindi tahasang pinangalanan sa talata.'
- source_word: ὑπὲρ αὐτῶν
  choice: para sa kanila
  rationale: Inuulit nito nang natural ang parehong salin ng ὑπέρ at pinananatili ang ugnayan sa “lahat” nang hindi nililimitahan ang saklaw.
theological_decisions:
- issue: Saklaw ng πάντων / αὐτῶν
  choice: Isinalin nang tuwiran bilang “lahat” at “kanila,” nang hindi nililimitahan ang tinutukoy.
  alternative: Maaaring ipakahulugan ang “lahat” bilang lahat ng tao nang walang pagtatangi o bilang lahat ng kinakatawan ni Cristo sa konteksto.
  rationale: Hindi tahasang nilulutas ng mismong talata ang mga sumunod na pagtatalong teolohikal tungkol sa lawak ng pagtubos; pinananatili ng salin ang malawak na pananalita ng teksto.
- issue: Pasibong anyo ng ἐγερθέντι
  choice: “muling binuhay”
  alternative: “muling nabuhay” o “bumangon”
  rationale: Pinananatili ng “muling binuhay” ang gramatikal na pasibo at ang pahiwatig na may kumilos upang buhayin siya, nang hindi nagdaragdag ng tahasang paksa na wala sa talata.
- issue: Diwa ng ὑπέρ
  choice: “para sa”
  alternative: “alang-alang sa” o “bilang kinatawan ng”
  rationale: Saklaw ng “para sa” ang kapakinabangan at pagkilos alang-alang sa iba, ngunit hindi nito ipinipilit ang isang mas tiyak na paliwanag tungkol sa paraan ng pagtubos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa publikong pagbasa. Ginamit ang “kanya” sa halip na mas pormal na “kaniya,” at pinanatili ang pag-uulit ng “para sa” upang maipakita ang pagkakatulad ng dalawang gamit ng ὑπέρ. Ang hulíng tandang talababa [b] ay inilagay pagkatapos ng buong sugnay na kinabibilangan ng pasibong “muling binuhay.”
