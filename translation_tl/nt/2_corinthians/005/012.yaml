    issue: Bahagyang hindi likas ang “pagkakataong maipagmalaki kami.”
    rationale: Mas malinaw na ang mga kausap ang gagawa ng pandiwa kapag isinalin bilang “pagkakataong ipagmalaki ninyo kami,” nang hindi binabago ang saklaw ng καυχήματος ὑπὲρ ἡμῶν.
