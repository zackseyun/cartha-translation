id: 2CO.5.12
reference: 2 Corinthians 5:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀οὐ πάλιν ἑαυτοὺς συνιστάνομεν ὑμῖν, ἀλλὰ ἀφορμὴν διδόντες ὑμῖν καυχήματος ὑπὲρ ἡμῶν, ἵνα ἔχητε πρὸς τοὺς ἐν προσώπῳ καυχωμένους καὶ ⸂μὴ ἐν⸃ καρδίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/012.yaml
  text: We are not commending ourselves to you again[a], but giving you an opportunity to boast about us[b], so that you may have an answer for those who boast in outward appearance and not in heart.
translation:
  language: tl
  text: Hindi namin muling inirerekomenda ang sarili namin sa inyo; sa halip, binibigyan namin kayo ng pagkakataon[a] na ipagmalaki ninyo kami, upang may maisagot kayo sa mga nagmamalaki sa panlabas na anyo at hindi sa puso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “batayan para ipagmalaki ninyo kami” o “dahilan upang magmalaki para sa amin.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa mukha at hindi sa puso,” na tumutukoy sa panlabas na pagpapakita na salungat sa panloob na pagkatao.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνομεν
  choice: inirerekomenda
  rationale: Ipinahahayag nito ang diwa ng paghaharap o pagpapatunay sa sarili bilang karapat-dapat, at pinananatili ang kaugnayan sa usapin ng rekomendasyon sa konteksto ng 2 Corinto.
- source_word: ἀφορμὴν
  choice: pagkakataon
  rationale: Natural sa makabagong Tagalog at saklaw ang diwa ng ibinibigay na pagkakataon o batayan para makapagsalita ang mga taga-Corinto.
- source_word: καυχήματος
  choice: maipagmalaki
  rationale: Pinananatili ang semantikong ugnayan sa καυχωμένους habang natural na ipinapahayag ang bagay na maipagmamalaki.
- source_word: ὑπὲρ ἡμῶν
  choice: kami
  rationale: Sa pariralang 'maipagmalaki kami,' natural na ipinahahayag na sina Pablo at ang mga kasama niya ang paksa o batayan ng pagmamalaki; maaari rin itong magpahiwatig ng pagsasalita para sa kanilang kapakanan.
- source_word: ἵνα ἔχητε πρὸς
  choice: upang may maisagot kayo sa
  rationale: Ipinapahayag nang malinaw at natural ang ipinahihiwatig na tugon sa mga kalaban, nang hindi dinaragdagan ang nilalaman ng sagot.
- source_word: ἐν προσώπῳ
  choice: sa panlabas na anyo
  rationale: Ang literal na 'sa mukha' ay hindi natural sa Tagalog sa ganitong gamit; ipinakikita ng salin ang kaibahan ng panlabas na pagpapakita at ng puso.
- source_word: καυχωμένους
  choice: mga nagmamalaki
  rationale: Pinananatili ang pandiwang ugnayan sa naunang καύχημα at ang mapanuring himig ng pahayag.
- source_word: καρδίᾳ
  choice: puso
  rationale: Ito ang tuwiran at tradisyonal na katumbas na nagpapanatili sa kaibahan ng panlabas na anyo at panloob na pagkatao.
- source_word: πάλιν
  choice: muling
  rationale: Tumpak na ipinahahayag ang pag-uulit na itinatanggi ni Pablo.
theological_decisions:
- issue: Kahulugan ng kaibahan sa ἐν προσώπῳ ... καὶ μὴ ἐν καρδίᾳ
  choice: Kaibahan ng panlabas na anyo at puso
  alternative: Kaibahan ng pampublikong reputasyon at panloob na katapatan
  rationale: Pinananatili ng 'panlabas na anyo ... puso' ang moral at retorikal na tensiyon ng Griyego nang hindi nililimitahan ang 'puso' sa isang partikular na katangiang gaya lamang ng katapatan.
- issue: Saklaw ng ὑπὲρ ἡμῶν
  choice: Maipagmalaki kami
  alternative: Makapagsalita para sa amin
  rationale: Maaaring tumukoy ang parirala sa pagmamalaki tungkol sa kanila o para sa kanilang kapakanan. Pinili ang natural na pangunahing salin at itinabi sa talababa ang kinatawang diwa upang hindi alisin ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'inirerekomenda' upang maiba ang pagkilala o pagpapatunay sa sarili mula sa 'pagmamalaki,' at ang 'panlabas na anyo' upang maging likas sa Tagalog ang idyomatikong ἐν προσώπῳ.
