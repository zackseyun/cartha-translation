  text: For if we are out of our minds[a], it is for God; if we are of sound mind[b], it is for you.
translation:
  language: tl
  text: Sapagkat kung wala kami sa aming katinuan[a], iyon ay para sa Diyos; kung matino ang aming pag-iisip[b], iyon ay para sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “wala kami sa aming sarili.”
    reason: lexical_alternative
  - marker: b
    text: O, “nasa wastong pag-iisip kami” o “may malinaw kaming paghatol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: kung ... kung
  rationale: Pinananatili ng inuulit na “kung” ang siksik na retorikal na paghahambing at ang diwang alinman sa dalawang kalagayan, habang natural sa modernong Tagalog.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita nitong ang talata ay nagbibigay ng paliwanag o dahilan kaugnay ng naunang pahayag.
- source_word: ἐξέστημεν
  choice: wala kami sa aming katinuan
  rationale: Malinaw at likas itong katumbas ng pagiging waring wala sa sarili o wala sa tamang pag-iisip, nang hindi ipinapasyang literal na kabaliwan ang tinutukoy.
- source_word: θεῷ
  choice: para sa Diyos
  rationale: Ipinahahayag ng eliptikong datibo na ang kilos ay nakaukol sa Diyos o sa kapakanan niya; pinananatili ng “para sa Diyos” ang kaiklian at likas na daloy.
- source_word: σωφρονοῦμεν
  choice: matino ang aming pag-iisip
  rationale: Ipinakikita nito ang matinong paghatol at pagpipigil sa sarili, at malinaw na itinatambal sa “wala kami sa aming katinuan.”
- source_word: ὑμῖν
  choice: para sa inyo
  rationale: Ipinahahayag ng eliptikong datibo na ang matinong pagkilos ni Pablo at ng kanyang mga kasama ay para sa kapakinabangan ng mga taga-Corinto.
theological_decisions:
- issue: Ang magkasalungat na paglalarawan ni Pablo sa kanilang sarili
  choice: Pinanatili ang pagkakaiba ng kilos na maaaring ipalagay na wala sa katinuan at ng malinaw na matinong pag-iisip, nang hindi sinasabing literal na baliw sila.
  alternative: Maaari itong tumukoy sa aktuwal na ekstasis na panrelihiyon, o maaaring purong pagmamalabis bilang tugon sa paratang ng iba.
  rationale: Retorikal at eliptiko ang Griyego. Pinananatili ng salin ang tensiyon at hindi nagdaragdag ng tiyak na doktrina tungkol sa ekstasis o ng paliwanag na paratang lamang ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “katinuan” at “matino ang pag-iisip” upang mapanatili ang tuwirang pagsasalungatan sa Griyego; ang mga alternatibong likas ngunit bahagyang naiibang pagpapahayag ay inilagay sa talababa.
