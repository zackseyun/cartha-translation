base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/021.yaml
  text: He made the one who did not know sin to be sin for us[b][a], so that in him we might become the righteousness of God.
translation:
  language: tl
  text: Ginawa ng Diyos na kasalanan alang-alang sa atin ang hindi nakakilala ng kasalanan,[a] upang sa kanya tayo ay maging katuwiran ng Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa kasalanan.” “Kasalanan” ang ginamit sa Griyego sa dalawang pagkakataon; inuunawa ng ilan ang ikalawang paglitaw sa sakripisyal na diwa.
    reason: alternative_reading
  - marker: b
    text: O “katarungan ng Diyos” o “katuwirang mula sa Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντα
  choice: nakakilala
  rationale: Pinananatili nito ang karaniwang kahulugang “makilala/malaman” at ang matinding idyoma ni Pablo, sa halip na palawakin agad bilang “hindi nagkasala.”
- source_word: ἁμαρτίαν (unang paglitaw)
  choice: kasalanan
  rationale: Tuwirang layon ito ng γνόντα at pinananatili ang abstraktong pangngalan ng Griyego.
- source_word: ὑπὲρ ἡμῶν
  choice: alang-alang sa atin
  rationale: Likas sa modernong Tagalog at pinananatili ang malawak na puwersang kapakinabangan at pagkatawan ng ὑπέρ nang hindi ito ikinukulong sa isang partikular na paliwanag ng pagtubos.
- source_word: ἁμαρτίαν (ikalawang paglitaw)
  choice: kasalanan
  rationale: Inuulit ang parehong salita gaya ng Griyego at pinananatili ang mariing pahayag ni Pablo; inilalagay sa talababa ang posibleng sakripisyal na diwang “handog para sa kasalanan.”
- source_word: ἐποίησεν
  choice: ginawa
  rationale: Malawak at tuwirang katumbas ng ποιέω na nagpapahayag ng pagkilos ng Diyos nang hindi nagdaragdag ng metapisikal na pagpapakahulugan.
- source_word: γενώμεθα
  choice: maging
  rationale: Ang anyong pasakali sa sugnay na may ἵνα ay natural na naipahahayag ng “upang ... maging,” at pinananatili ang diwa ng pagdating sa isang kalagayan.
- source_word: δικαιοσύνη
  choice: katuwiran
  rationale: Ito ang dignified at karaniwang salin sa kontekstong Paulino; hindi nito awtomatikong nilulutas ang salitang may saklaw ding katarungan at matuwid na katayuan.
- source_word: θεοῦ
  choice: ng Diyos
  rationale: Pinananatiling bukas ang genitibong Griyego sa posibleng diwang pag-aari, pinagmulan, o kaugnayan.
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Maikli at likas na katumbas na nagpapanatili sa mahalagang pormulang Paulino nang hindi ito pinalalawak bilang “sa pakikipag-isa sa kanya.”
theological_decisions:
- issue: Kahulugan ng “ginawa niyang kasalanan”
  choice: Pinanatili sa pangunahing teksto ang mariing pananalita ni Pablo nang hindi ipinahihiwatig na naging makasalanan ang walang kasalanan.
  alternative: “Ginawa niyang handog para sa kasalanan.”
  rationale: Malinaw sa unang sugnay na hindi nakakilala ng kasalanan ang tinutukoy. Posible ang sakripisyal na pagbasa, ngunit ang Griyego ay literal na inuulit ang “kasalanan,” kaya nararapat itong manatili sa teksto at ilagay ang alternatibo sa talababa.
- issue: Saklaw ng δικαιοσύνη θεοῦ
  choice: “katuwiran ... ng Diyos,” na hindi nagpapasya kung ito ay sariling katuwiran ng Diyos, katuwirang mula sa Diyos, o matuwid na katayuang kaugnay sa Diyos.
  alternative: “katarungan ng Diyos” o “katuwirang mula sa Diyos.”
  rationale: Siksik at pinagtatalunang parirala ito. Ang pormal na “ng Diyos” ang pinakamahusay na nagpapanatili sa tunay na kalabuan ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “katuwiran” para sa teolohikal na bigat ng δικαιοσύνη at “alang-alang sa atin” para sa likas ngunit malawak na saklaw ng ὑπὲρ ἡμῶν. Inilagay ang mga marker kaagad pagkatapos ng pariralang tinutukoy ng bawat talababa.
