  text: For we walk by faith[a], not by sight—
translation:
  language: tl
  text: Sapagkat lumalakad tayo sa pananampalataya, hindi ayon sa nakikita[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi ayon sa anyo” o “hindi ayon sa hitsura.” Ang salitang Griyego ay maaaring tumukoy sa nakikitang anyo, hitsura, o sa anumang nakikita; pinili ang “nakikita” upang mapanatili ang pagsalungat nito sa “pananampalataya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: sa pananampalataya
  rationale: Ang διά na may genitive ay nagpapahayag dito ng paraan o batayan. Pinananatili ng “sa pananampalataya” ang maikli at tuwirang pagsalungat sa “sa paningin.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag o batayan para sa naunang pahayag; malinaw itong naihahatid ng “Sapagkat.”
- source_word: περιπατοῦμεν
  choice: lumalakad tayo
  rationale: Bagaman maaari itong mangahulugang “namumuhay,” pinananatili ng “lumalakad tayo” ang talinghaga ng Griyego at nauunawaan pa rin sa makabagong Filipino bilang paraan ng pamumuhay.
- source_word: οὐ διὰ εἴδους
  choice: hindi sa paningin
  rationale: Maaaring tumukoy ang εἶδος sa nakikitang anyo, hitsura, o bagay na nakikita. Ang “paningin” ang pinakamaikli at pinakanatural na katapat sa pagsalungat nito sa pananampalataya, habang inilalahad sa talababa ang tunay na lawak ng salita.
theological_decisions:
- issue: Kahulugan ng πίστις sa maikling pagsalungat kay εἶδος
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Sa kontekstong ito, ang πίστις ay pinakamalinaw na tumutukoy sa pananampalataya o pagtitiwala na kabaligtaran ng pamumuhay batay sa nakikita. Hindi hinihingi ng pangungusap ang mas tiyak na kahulugang “katapatan.”
- issue: Talinghaga ng περιπατέω
  choice: lumalakad tayo
  alternative: namumuhay tayo
  rationale: Pinananatili ang larawan ng paglakad nang hindi itinatanggi ang metaporikal na diwang tumutukoy sa paraan ng pamumuhay.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang maikli at matalim na ayos ng Griyego, pati ang talinghaga ng paglakad at ang gitling na nagpapakitang nagpapatuloy ang kaisipan.
