base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/008.yaml
  text: So we are confident and would rather be away from the body and at home with the Lord[a].
translation:
  language: tl
  text: Kaya panatag ang aming loob, at mas nanaisin naming mawalay sa katawan at manahan sa piling ng Panginoon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lumayo sa katawan at manahan sa piling ng Panginoon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θαρροῦμεν
  choice: panatag ang aming loob
  rationale: Ipinahahayag ng pangkasalukuyang pandiwa ang nagpapatuloy at matatag na lakas ng loob o pagtitiwala; natural at marangal sa modernong Tagalog ang pariralang ito.
- source_word: δὲ
  choice: Kaya
  rationale: Nagpapatuloy ito sa pangangatwiran mula sa mga naunang talata at may bahagyang inferensiyal na diwa, hindi matinding pagsalungat.
- source_word: καὶ εὐδοκοῦμεν μᾶλλον
  choice: at mas nanaisin naming
  rationale: Pinagsasama nito ang pang-ugnay at ang paghahambing na nagpapahayag ng kusang kagustuhan o pagpili.
- source_word: ἐκδημῆσαι ἐκ τοῦ σώματος
  choice: lumayo sa katawan
  rationale: Pinananatili ang larawan ng pagiging malayo sa sariling tahanan o kinaroroonan nang hindi tahasang dinaragdagan ng salitang “mamatay.”
- source_word: ἐνδημῆσαι πρὸς τὸν κύριον
  choice: manahan sa piling ng Panginoon
  rationale: Ang “manahan” ay nagpapanatili sa larawang kaugnay ng tahanan, samantalang ang “sa piling ng Panginoon” ay natural na naghahayag ng personal na presensiya at pakikisama.
theological_decisions:
- issue: Kung tahasang ipaliliwanag ang talata bilang kamatayan at pagpunta sa langit
  choice: Panatilihin ang larawan ng paglayo sa katawan at pananahan sa piling ng Panginoon.
  alternative: “Mamatay at pumunta sa langit upang makapiling ang Panginoon.”
  rationale: Malakas ang pahiwatig ng kalagayan pagkamatay, ngunit wala sa Griyego ang tahasang mga salitang “mamatay” at “langit”; pinananatili ng salin ang tunay na pahiwatig at teolohikal na tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ang “panatag ang aming loob” ay karaniwang maunawaan ngunit hindi kolokyal; pinananatili ng “lumayo” at “manahan” ang magkatambal na larawang pangtahanan sa Griyego.
