revisions:
- from: Kaya naman, nasa tahanan man kami o nasa malayo,[a] buong sigasig naming hinahangad na maging kalugod-lugod sa kanya.
  to: Kaya naman, ginagawa naming layunin na maging kalugod-lugod sa kanya, nasa tahanan man kami o malayo rito.[a]
  rationale: Inayos ang pares na metapora upang maging natural sa modernong Filipino (“nasa tahanan ... o malayo rito”) habang pinananatiling hindi tahasan sa pangunahing teksto ang kaugnayan nito sa katawan. Inayos din ang talababa upang malinaw at idiomatikong maipahayag ang kontekstuwal na pagpapaliwanag. Ang “ginagawa naming layunin” ay isang tuwiran at likas na katumbas ng φιλοτιμούμεθα.
