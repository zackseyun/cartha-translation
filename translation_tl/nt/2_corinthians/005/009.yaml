base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/009.yaml
  text: Therefore we also make it our ambition[a], whether at home or away, to be pleasing to him.
translation:
  language: tl
  text: Kaya naman, ginagawa naming layunin na maging kalugod-lugod sa kanya, nasa tahanan man kami o malayo rito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tahasan ayon sa konteksto, “nasa katawan man kami o wala sa katawan.”
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Kaya naman
  rationale: Nagpapahiwatig ito ng kongklusyon o bunga mula sa naunang pagtalakay tungkol sa kasalukuyang buhay sa katawan at sa pagharap sa Panginoon.
- source_word: καὶ
  choice: naman
  rationale: Likas na ipinahahayag ng “naman” ang pagpapatuloy at bahagyang pagdiriin ng καὶ sa pangungusap, nang hindi ito labis na binibigyang-kahulugan.
- source_word: φιλοτιμούμεθα
  choice: buong sigasig naming hinahangad
  rationale: Ipinapakita ng pandiwa ang masigasig at sinasadyang paghahangad na maabot ang isang layunin; mas matindi ito kaysa sa payak na “layunin namin.”
- source_word: εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες
  choice: nasa tahanan man kami o nasa malayo
  rationale: Pinananatili nito ang maikli at magkatambal na larawang “nasa tahanan” at “nasa malayo” sa Griyego, samantalang hinahayaan ang konteksto ng mga talata 6–8 na tukuyin ang kaugnayan nito sa katawan.
- source_word: εὐάρεστοι
  choice: kalugod-lugod
  rationale: Malinaw at marangal na katumbas ito ng pagiging kasiya-siya o katanggap-tanggap sa Diyos, at pinananatili ang ugnayang diwa ng salita.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Panghalip ang ginamit sa Griyego at tumutukoy sa Panginoong binanggit sa konteksto, kaya hindi na ginawang tahasan ang pangngalan sa pangunahing teksto.
- source_word: εἶναι
  choice: na maging
  rationale: 'Kinukumpleto nito ang layon ng masigasig na paghahangad: ang maging kalugod-lugod sa kanya.'
theological_decisions:
- issue: Kung gagawing tahasan ang ipinahihiwatig na kaugnayan ng “nasa tahanan” at “nasa malayo” sa katawan
  choice: Panatilihin sa pangunahing teksto ang maikling “nasa tahanan man kami o nasa malayo.”
  alternative: “nasa tahanan man sa katawan o malayo sa katawan”
  rationale: Malinaw sa agarang konteksto ang kaugnayan sa pananatili sa katawan at paglayo rito, ngunit hindi binabanggit sa talatang ito ang mga pandagdag na iyon. Pinananatili ng salin ang kaiklian at tunay na pahiwatig ng Griyego, habang nililinaw sa talababa ang kontekstuwal na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buong sigasig naming hinahangad” upang maipakita ang masidhing intensiyon ng φιλοτιμούμεθα, at pinanatili ang matalinghagang pares na “nasa tahanan” at “nasa malayo” sa halip na tahasang lutasin sa pangunahing teksto ang ipinahihiwatig ng konteksto.
