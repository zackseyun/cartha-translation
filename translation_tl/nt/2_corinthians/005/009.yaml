  - severity: medium
    issue: Hindi malinaw at hindi idiomatiko ang pahayag sa talababa na “nasa tahanan man sa katawan o malayo sa katawan.”
    rationale: Mas malinaw na ipaliwanag ang kontekstuwal na kahulugan bilang pananatili sa katawan o pagiging wala/hiwalay sa katawan, nang hindi ipinapasok ang mahirap na konstruksyong “nasa tahanan sa katawan.”
  revised_text: Kaya naman, ginagawa naming layunin na maging kalugod-lugod sa kanya, nasa tahanan man kami o malayo rito.[a]
