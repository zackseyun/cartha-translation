  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing diwa: ang διὸ καὶ ay naipapahayag ng “Kaya naman,” ang φιλοτιμούμεθα ay masigasig na layunin/paghahangad, at ang layon ay maging εὐάρεστοι sa kanya. Gayunman, ang “nasa malayo” ay hindi sapat na kaagapay ng “nasa tahanan” sa Filipino, sapagkat hindi malinaw kung malayo saan; ang Griyego ay sadyang pinaiikli ngunit malinaw na magkatambal ang pagiging nasa tahanan at pagiging malayo rito.'
  naturalness: 'Marangal at madaling unawain ang rehistro, ngunit mas natural at magkakaugnay ang “nasa tahanan man kami o malayo rito.” Ang kasalukuyang talababa ay hindi rin likas na Filipino: ang “nasa tahanan ... sa katawan” ay hindi malinaw na paraan upang ipahayag ang pananatili sa katawan.'
  terminology: Ang “kalugod-lugod sa kanya” ay angkop para sa εὐάρεστοι αὐτῷ. Ang “buong sigasig naming hinahangad” ay katanggap-tanggap, ngunit ang “ginagawa naming layunin” ay mas tuwirang naglalahad ng sinasadyang ambisyon nang hindi nagiging labis ang diin.
