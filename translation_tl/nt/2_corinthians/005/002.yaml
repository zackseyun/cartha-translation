  text: For indeed in this we groan[a], longing to put on our dwelling from heaven[b],
translation:
  language: tl
  text: Sapagkat sa kalagayang ito ay dumaraing tayo, na nananabik na isuot[a] ang ating tahanang mula sa langit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Griyego ay maaari ring mangahulugang “isuot sa ibabaw,” gaya ng pagsusuot ng isang damit sa ibabaw ng isa pa.
    reason: lexical_alternative
  - marker: b
    text: O “ang ating makalangit na tahanan.” Mas literal sa Griyego ang “ating tahanang mula sa langit,” na nagbibigay-diin sa pinagmulan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sapagkat
  rationale: Likas na ipinahahayag ang paliwanag na ugnayan sa naunang talata; sapat ang “Sapagkat” upang dalhin ang puwersang nag-uugnay at nagpapatibay nang hindi mabigat pakinggan.
- source_word: ἐν τούτῳ
  choice: sa kalagayang ito
  rationale: Pinananatili ang bahagyang kalabuan ng demonstratibo habang malinaw na itinuturo ang kasalukuyang kalagayang binanggit sa konteksto, nang hindi tahasang inuulit ang “tolda.”
- source_word: στενάζομεν
  choice: dumaraing tayo
  rationale: Ipinahahayag ang bigat sa kalooban at pananabik na taglay ng pandiwa; mas matindi ito kaysa simpleng “nagbubuntong-hininga” ngunit hindi labis na mapagpaliwanag.
- source_word: τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ
  choice: ang ating tahanang mula sa langit
  rationale: Pinananatili ang kongkretong larawan ng tirahan at ang pinagmulan na ipinahahayag ng ἐξ οὐρανοῦ, sa halip na gawing “makalangit na tahanan,” na maaaring tumukoy sa katangian.
- source_word: ἐπενδύσασθαι
  choice: maisuot
  rationale: Natural sa Filipino at pinananatili ang metapora ng pananamit. Ang mas tiyak na diwang pagsusuot sa ibabaw ng kasalukuyang suot ay inilalagay sa talababa.
- source_word: ἐπιποθοῦντες
  choice: na nananabik
  rationale: Ipinahahayag ang matindi at patuloy na paghahangad na kasabay ng pagdaing.
theological_decisions:
- issue: Kalikasan ng tahanang mula sa langit at ng metapora ng pananamit
  choice: Panatilihin ang magkasalikop na larawan ng tahanan at pagsusuot nang hindi tahasang ipinapakahulugan bilang katawang muling binuhay, kalagayan sa pagitan ng kamatayan at muling pagkabuhay, o isang makalangit na tahanan sa mas makitid na diwa.
  alternative: Isalin nang tahasan bilang “katawang muling bubuhayin mula sa langit” o “makalangit na tahanan.”
  rationale: Hindi nilulutas ng mismong talata ang buong eskatolohikal na kahulugan ng mga larawan. Ang salin ay nagpapanatili sa tunay na teolohikal na tensiyon at hindi nagpapasok ng denominasyonal na paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kalagayang ito” upang maging natural ngunit hindi labis na tukuyin ang malabong ἐν τούτῳ. Pinanatili ang pinaghalong metapora ng tahanan at pananamit.
