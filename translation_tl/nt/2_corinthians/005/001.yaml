  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ἐὰν ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους καταλυθῇ, οἰκοδομὴν ἐκ θεοῦ ἔχομεν οἰκίαν ἀχειροποίητον αἰώνιον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/001.yaml
  text: For we know that if our earthly tent-house is torn down[a], we have a building from God, a house not made with hands[d][c][b], eternal in the heavens.
translation:
  language: tl
  text: Sapagkat alam natin na kung gibain ang ating makalupang tahanan na isang tolda,[a][b] mayroon tayong gusaling mula sa Diyos—isang tahanang hindi ginawa ng mga kamay ng tao,[d] na walang hanggan sa mga langit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring isalin na “ang ating makalupang bahay na tolda.” Magkasamang pinananatili ng Griyego ang larawan ng bahay at tolda para sa kasalukuyang mortal na tahanan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “buwagin” o “wasakin.” Maaaring ipahiwatig ng pandiwa ang pagtatanggal o pagbabaklas ng isang istruktura, na angkop sa larawan ng tolda.
    reason: lexical_alternative
  - marker: c
    text: Ang Griyego ay nagsasabing “mayroon tayo,” hindi “magkakaroon tayo,” kaya nananatili ang tensiyon sa pagitan ng kasalukuyang pag-aari at katuparan sa hinaharap.
    reason: alternative_reading
  - marker: d
    text: Sa literal, “hindi ginawa ng mga kamay.” Tinutukoy nito ang nagmula sa Diyos, hindi ang paggawa ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: alam natin
  rationale: Likas at tuwirang salin ng matatag na kaalamang ipinahahayag ng οἴδαμεν.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang pangangatwiran.
- source_word: ἐὰν ... καταλυθῇ
  choice: kung gibain
  rationale: Ipinahahayag ang kundisyong maaaring mangyari sa hinaharap; ang 'gibain' ay angkop kapwa sa gusali at sa pagtatanggal ng tolda.
- source_word: ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους
  choice: ang ating makalupang tahanang tolda
  rationale: Pinananatili ang pinagsamang larawan ng οἰκία ('tahanan/bahay') at σκῆνος ('tolda') nang hindi tahasang pinapalitan ng 'katawan.'
- source_word: οἰκοδομὴν ἐκ θεοῦ
  choice: gusaling mula sa Diyos
  rationale: Konkretong istruktura ang diwa ng οἰκοδομή rito, at tuwirang pinananatili ng 'mula sa Diyos' ang ἐκ θεοῦ.
- source_word: ἔχομεν
  choice: mayroon tayong
  rationale: Pinananatili ang pangkasalukuyang anyo ng Griyego sa halip na gawin itong panghinaharap.
- source_word: οἰκίαν ἀχειροποίητον
  choice: tahanan ... na hindi ginawa ng mga kamay ng tao
  rationale: Natural sa modernong Filipino at pinananatili ang biblikal na kaibahan ng gawang mula sa Diyos at gawang-tao.
- source_word: αἰώνιον
  choice: walang-hanggang
  rationale: Malinaw na ipinakikita ang kaibahan sa pansamantalang makalupang tahanan.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: sa kalangitan
  rationale: Natural na Filipino na kayang kumatawan sa maramihang οὐρανοῖς nang hindi pilit ang literal na 'mga langit.'
theological_decisions:
- issue: Tinutukoy ng larawan ng tahanan at tolda
  choice: Panatilihin sa pangunahing teksto ang mga larawang tahanan, tolda, gusali, at tahanang hindi gawa ng tao.
  alternative: Tahasan itong isalin bilang 'katawan.'
  rationale: Hindi tuwirang sinasabi ng Griyego ang 'katawan'; ang pagpapalit dito ay magpapasya sa interpretasyon at magpapawi sa magkakapatong na larawan ni Pablo.
- issue: Panahunan ng ἔχομεν
  choice: mayroon tayong
  alternative: magkakaroon tayo
  rationale: Pangkasalukuyan ang pandiwa sa Griyego. Pinananatili nito ang tensiyon sa pagitan ng kasalukuyang pag-aari at katuparan sa hinaharap.
- issue: Pinagmulan ng tahanang ἀχειροποίητον
  choice: hindi ginawa ng mga kamay ng tao
  alternative: hindi gawa ng tao
  rationale: Pinananatili ang biblikal na pormula at ang diin sa banal, hindi pantaong, pinagmulan nang hindi nagdaragdag ng denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'tahanang tolda' upang mapanatili ang sadyang pinaghalong larawang bahay at tolda; iniwasan ang mas interpretibong 'katawan.' Inayos ang hulíng parirala ayon sa natural na daloy ng Filipino habang pinananatili ang lahat ng sangkap ng Griyego.
