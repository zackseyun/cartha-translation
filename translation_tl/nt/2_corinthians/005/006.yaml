  source_fidelity: Tumpak ang pangunahing diwa at ang lohikal na ugnay ng οὖν sa “Kaya.” Gayunman, ang “habang nasa katawan kami na para bang nasa tahanan” ay hindi likas ang pagkakabuo at ang “para bang” ay nagdaragdag ng pagkakuwalipika na wala sa Griyego. Ang ἐνδημοῦντες ay tuwirang talinghaga ng paninirahan/pagiging nasa tahanan, na ikinokontra sa ἐκδημοῦμεν, pagiging malayo o wala sa tahanan.
  naturalness: Ang “matatag ang loob namin” at “malayo kami sa Panginoon” ay natural at angkop sa marangal na makabagong Filipino. Mas natural ang “habang nananahan kami sa katawan” kaysa sa kasalukuyang pariralang may “na para bang nasa tahanan.”
  terminology: Ang “Panginoon” ay wastong salin ng κύριος. Ang “katawan” ay sapat para sa ἐν τῷ σώματι. Pinananatili ng “nananahan” at “malayo” ang kaugnay na larawang metaporikal nang hindi ipinapasok ang pagpapaliwanag mula sa talata 8.
  issues:
