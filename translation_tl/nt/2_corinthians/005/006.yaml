  text: Θαρροῦντες οὖν πάντοτε καὶ εἰδότες ὅτι ἐνδημοῦντες ἐν τῷ σώματι ἐκδημοῦμεν ἀπὸ τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/006.yaml
  text: Therefore[a], we are always confident and know that while we are at home in the body, we are away from the Lord,
translation:
  language: tl
  text: Kaya lagi kaming matatag ang loob at alam namin na habang nananahan kami sa katawan, malayo kami sa Panginoon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “wala kami sa piling ng Panginoon.” Ang pandiwang Griyego ay katambal na kasalungat ng pandiwa para sa “nananahan” at maaaring isaling “malayo” o “wala sa piling.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαρροῦντες
  choice: matatag ang loob namin
  rationale: Ipinahahayag ng kasalukuyang pandiwaring Griyego ang patuloy na tapang o tibay ng loob. Ginawang likas na sugnay sa Filipino nang hindi inaalis ang patuloy na diwa.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang hinuha mula sa naunang pangangatwiran. Ang “Kaya” ay malinaw at natural na pang-ugnay sa modernong Filipino.
- source_word: πάντοτε
  choice: lagi
  rationale: Tuwirang ipinahahayag ang patuloy o palagiang kalagayan.
- source_word: εἰδότες
  choice: alam namin
  rationale: Ang ganap na pandiwari ng οἶδα ay may pangkasalukuyang diwa ng matatag na kaalaman; natural itong ipinahayag bilang sugnay sa Filipino.
- source_word: ἐνδημοῦντες
  choice: habang nasa katawan kami na para bang nasa tahanan
  rationale: Pinananatili ang talinghaga ng pagiging nasa sariling tahanan, ngunit nililinaw sa natural na Filipino na ito ay matalinghagang paglalarawan sa kasalukuyang buhay sa katawan.
- source_word: ἐν τῷ σώματι
  choice: nasa katawan
  rationale: Tumutukoy sa kasalukuyang buhay na may katawan nang hindi idinaragdag ang “katawang ito,” na hindi tahasang hinihingi ng Griyego.
- source_word: ἐκδημοῦμεν
  choice: malayo kami
  rationale: Katambal at kasalungat ito ng ἐνδημοῦντες. Ang “malayo” ay natural sa Filipino at pinananatili ang larawang heograpiko ng pagiging wala sa sariling tahanan.
- source_word: ἀπὸ τοῦ κυρίου
  choice: sa Panginoon
  rationale: Kasama ng “malayo,” natural na ipinahahayag ng “sa Panginoon” ang paghihiwalay na minamarkahan ng ἀπό. Isinalin ang κύριος bilang “Panginoon.”
theological_decisions:
- issue: Pagtatambis ng buhay sa katawan at pagiging kasama ng Panginoon
  choice: Inilalarawan ang kasalukuyang buhay sa katawan bilang pagiging nasa tahanan dito at, kasabay nito, pagiging malayo sa Panginoon.
  alternative: Sabihing lubos na hiwalay ang mga mananampalataya kay Cristo habang nasa katawan, o ipasok dito ang pananalita ng kasunod na talata tungkol sa pagiging wala sa katawan at nasa piling ng Panginoon.
  rationale: 'Pinananatili ng salin ang tensiyon ng talata: may kaugnayan ang mga mananampalataya sa Panginoon ngayon, ngunit hindi pa nila nararanasan ang ganap na pagiging kasama niya. Hindi nito pinalalabis ang paghihiwalay at hindi rin ipinapasok ang detalye ng talata 8.'
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “para bang nasa tahanan” upang mapanatili ang talinghaga nang hindi maging pilit ang pariralang Filipino; ginamit naman ang “matatag ang loob” upang maipahayag ang patuloy na tapang at pagtitiwala.
