    rationale: Hindi sinasabi ng ἐνδημοῦντες na ang mga mambabasa ay “parang” nasa tahanan; ginagamit nito ang mismong metapora ng paninirahan o pagiging nasa tahanan habang nasa katawan. Ang “para bang” ay maaaring magpahina o magbago sa paglalarawan.
  - severity: low
