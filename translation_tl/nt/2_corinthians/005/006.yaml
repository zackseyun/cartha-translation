- from: Kaya laging matatag ang loob namin, at alam namin na habang nasa katawan kami na para bang nasa tahanan, malayo kami sa Panginoon.[a]
  to: Kaya lagi kaming matatag ang loob at alam namin na habang nananahan kami sa katawan, malayo kami sa Panginoon.[a]
  rationale: Pinalitan ang di-likas na “nasa katawan kami na para bang nasa tahanan” ng “nananahan kami sa katawan.” Pinananatili nito ang metapora ng Griyego, ang patuloy na aspekto ng mga pandiwari, at ang pagtatambis ng paninirahan sa katawan at pagiging malayo sa Panginoon, nang walang dagdag na pagpapakahulugang doktrinal.
