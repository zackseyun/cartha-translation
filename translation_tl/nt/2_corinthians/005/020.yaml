id: 2CO.5.20
reference: 2 Corinthians 5:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑπὲρ Χριστοῦ οὖν πρεσβεύομεν ὡς τοῦ θεοῦ παρακαλοῦντος δι’ ἡμῶν· δεόμεθα ὑπὲρ Χριστοῦ, καταλλάγητε τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/020.yaml
  text: 'Therefore[a], we are ambassadors for the Messiah, as though God were appealing through us[b]. We beg you on behalf of the Messiah: be reconciled to God.'
translation:
  language: tl
  text: 'Kaya nga, kami ay mga sugo para sa Mesiyas[a], na para bang ang Diyos ay nakikiusap sa pamamagitan namin. Nagsusumamo kami sa inyo alang-alang sa Mesiyas: makipagkasundo kayo sa Diyos.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kristo” sa bawat paglitaw sa talatang ito. Ang salitang Griyego na Χριστός ay isang titulo, na isinalin dito bilang “Mesiyas.”
    reason: alternative_reading
  - marker: b
    text: Ang pandiwang Griyego ay nasa tinig na balintiyak. Maaari ring unawain ang parirala bilang “makipagkasundo kayo kasama ng Diyos.”
    reason: grammatical_and_lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ Χριστοῦ
  choice: bilang kinatawan ng Mesiyas / alang-alang sa Mesiyas
  rationale: Ang ὑπέρ na may genitive ay nagpapahayag ng pagkilos para sa kapakanan o bilang kinatawan ng iba. Sa unang paglitaw, nilinaw ng “bilang kinatawan” ang tungkuling pansugo; sa ikalawa, pinananatili ng “alang-alang sa” ang taimtim na pakiusap para sa Mesiyas nang hindi ginagawang pangalan lamang ang titulo.
- source_word: οὖν
  choice: Kaya nga
  rationale: Malinaw at likas na ipinahihiwatig nito na ang pahayag ay kongklusyon mula sa naunang paliwanag tungkol sa pakikipagkasundo.
- source_word: πρεσβεύομεν
  choice: mga sugo kami
  rationale: Ipinahihiwatig ng πρεσβεύω ang paglilingkod bilang opisyal na sugo o embahador. Ang “mga sugo” ay natural, marangal, at madaling maunawaan sa Filipino; nililinaw ng kasunod na “bilang kinatawan” ang tungkulin.
- source_word: ὡς
  choice: na para bang
  rationale: 'Pinananatili nito ang paghahambing: ang ministeryo ng mga sugo ay dapat unawain na para bang ang Diyos mismo ang nakikiusap sa pamamagitan nila, nang hindi ginagawang tahasang sanhi ang parirala.'
- source_word: παρακαλοῦντος
  choice: nakikiusap
  rationale: Sa konteksto ng pakikipagkasundo, ipinapahayag nito ang mapilit ngunit mapag-anyayang diwa ng παρακαλέω.
- source_word: δι’ ἡμῶν
  choice: sa pamamagitan namin
  rationale: Tumpak na ipinapahayag nito ang ahensiya o instrumentong tinutukoy ng διά na may genitive.
- source_word: δεόμεθα
  choice: Nagsusumamo kami sa inyo
  rationale: Ipinakikita ng “nagsusumamo” ang tindi at pagkaapurahan ng δέομαι. Ang “sa inyo” ay likas na nililinaw sa Filipino ang pinatutungkulan ng kasunod na pautos.
- source_word: καταλλάγητε
  choice: makipagkasundo kayo
  rationale: Ito ang natural na utos sa modernong Filipino para sa pagpapanumbalik ng ugnayan. Dahil balintiyak ang anyong Griyego at maaaring matabunan iyon ng anyong Filipino, tahasang itinatala sa talababa ang pormal na anyo.
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Ang dative kasunod ng καταλλάσσω ay maaaring tumukoy sa Diyos bilang kinaroroonan o kabilang panig ng pakikipagkasundo. Likas sa Filipino ang “sa Diyos” at hindi nito labis na nilulutas ang relasyonal na diwa.
theological_decisions:
- issue: Pagbibigay-kahulugan sa Χριστοῦ
  choice: Mesiyas
  alternative: Kristo
  rationale: Dito ay gumaganap ang Χριστός bilang titulo. Isinasalin itong “Mesiyas” upang maipakita ang kahulugan ng titulo, habang inilalagay sa talababa ang tradisyonal na “Kristo.”
- issue: Tinig at ahensiya sa καταλλάγητε
  choice: makipagkasundo kayo sa Diyos, na may talababa tungkol sa balintiyak na anyong Griyego
  alternative: ipagkasundo kayo sa Diyos
  rationale: 'Mas natural at malinaw sa ordinaryong Filipino ang pangunahing salin, ngunit hindi dapat mawala ang tensiyon sa teksto: ang Diyos ang nakikiusap sa pamamagitan ng mga sugo, samantalang inuutusan ang mga tagapakinig na tumugon, at balintiyak ang pandiwang Griyego. Pinananatili ng talababa ang mahalagang anyong iyon nang hindi nagpapasok ng tiyak na paliwanag tungkol sa mekanismo ng banal at makataong pagkilos.'
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinili ang “mga sugo” sa halip na mas teknikal na “mga embahador,” at “nagsusumamo” upang mapanatili ang taimtim na tono. Ang “makipagkasundo” ang pinakanatural na Filipino, habang inilalahad sa talababa ang balintiyak na anyo ng pinagmulang Griyego.
