id: 2CO.5.16
reference: 2 Corinthians 5:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὥστε ἡμεῖς ἀπὸ τοῦ νῦν οὐδένα οἴδαμεν κατὰ σάρκα· ⸀εἰ καὶ ἐγνώκαμεν κατὰ σάρκα Χριστόν, ἀλλὰ νῦν οὐκέτι γινώσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/016.yaml
  text: So from now on we regard no one according to the flesh[a]. Even if we have known Messiah according to the flesh[b], yet now we no longer know him that way.
translation:
  language: tl
  text: Kaya mula ngayon, hindi namin itinuturing ang sinuman ayon sa laman.[a] Kahit nakilala namin ang Mesiyas[b] ayon sa laman, ngayon ay hindi na namin siya nakikilala sa ganoong paraan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa pananaw ng tao” o “ayon sa makasanlibutang pamantayan” para sa “ayon sa laman.”
    reason: lexical_alternative
  - marker: b
    text: Griyego “Christon”; tradisyonal na “Cristo.” Isinalin ditong “Mesiyas” upang maipahayag ang kahulugan nito bilang titulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Kaya
  rationale: Ipinakikita ang kongklusyong hinango ni Pablo mula sa naunang pangangatwiran, sa natural na modernong Tagalog.
- source_word: ἀπὸ τοῦ νῦν
  choice: mula ngayon
  rationale: Tuwirang ipinahahayag ang pagbabagong nagsisimula sa kasalukuyan at nagpapatuloy.
- source_word: οὐδένα οἴδαμεν
  choice: hindi na namin itinuturing ang sinuman
  rationale: Sa kontekstong may κατὰ σάρκα, ang οἴδαμεν ay tumutukoy hindi lamang sa pagkakaroon ng kaalaman kundi sa paraan ng pagkilala o pagtingin sa isang tao. Ang “itinuturing” ay malinaw at natural sa Tagalog.
- source_word: κατὰ σάρκα
  choice: ayon sa laman
  rationale: Pinananatili ang mahalagang terminong Pauline na “laman” at ang sadyang tensiyon ng parirala; nililinaw sa talababa ang mga posibleng kahulugan nito.
- source_word: εἰ καὶ
  choice: Kahit
  rationale: Pinananatili ang concessive na puwersa nang hindi sapilitang nagpapasiya sa pagitan ng “even if” at “even though,” na parehong maaaring katawanin ng natural na “kahit” sa Tagalog.
- source_word: ἐγνώκαμεν
  choice: nakilala namin
  rationale: Ang anyong Tagalog ay natural na tumutukoy sa nakaraang pagkilala, habang hinahayaan ang konteksto na ipakita ang kaugnayan nito sa kasalukuyang pagbabago.
- source_word: Χριστόν
  choice: ang Mesiyas
  rationale: Isinasalin ang kahulugan ng titulong Χριστός sa karaniwang anyong Filipino na “Mesiyas,” sa halip na ituring lamang itong pangalang pantangi.
- source_word: ἀλλὰ νῦν οὐκέτι γινώσκομεν
  choice: ngayon ay hindi na namin siya nakikilala sa ganoong paraan
  rationale: Ginagawang malinaw sa Tagalog na ang nagbago ay ang paraan ng pagkilala sa Mesiyas, hindi ang katotohanang kilala siya.
theological_decisions:
- issue: Kahulugan ng κατὰ σάρκα tungkol sa mga tao at sa Mesiyas
  choice: ayon sa laman
  alternative: mula sa pananaw ng tao; ayon sa makasanlibutang pamantayan
  rationale: Pinananatili ng pangunahing teksto ang terminolohiya at tensiyon ni Pablo. Hindi nito itinatanggi ang tunay na pagkatao ng Mesiyas; tinatanggihan nito ang pagkilala o pagtataya batay lamang sa panlabas, makalupa, o karaniwang pamantayan ng tao.
- issue: Pagbibigay-kahulugan sa Χριστός
  choice: ang Mesiyas
  alternative: Cristo
  rationale: Dito ay malinaw na tumutukoy ang Χριστός sa mesiyanikong titulo ni Jesus. Ang “Mesiyas” ay naghahayag ng kahulugan ng titulo nang hindi nagdaragdag ng denominasyonal na interpretasyon.
- issue: Concessive force ng εἰ καὶ
  choice: Kahit
  alternative: Kahit na talagang; Bagaman
  rationale: Ang “Kahit” ay likas sa Tagalog at nagpapanatili ng posibleng saklaw sa pagitan ng kondisyunal at faktuwal na concessive, sa halip na lutasin nang tahasan ang tunay na ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “namin” sapagkat ang apostolikong “kami” ang nagsasalita sa kausap; iniwasan ang labis na teknikal o makalumang pananalita. Ang pag-uulit ng “ayon sa laman” ay sinadyang panatilihin upang maipakita ang parallelismo ng Griyego.
