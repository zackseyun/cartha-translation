base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/006.yaml
  text: 'This: the one who sows sparingly will also reap sparingly[a], and the one who sows with blessings will also reap with blessings.'
translation:
  language: tl
  text: 'Ito ang sinasabi ko: ang naghahasik nang kakaunti ay mag-aani rin nang kakaunti, at ang naghahasik nang sagana[a] ay mag-aani rin nang sagana.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nang bukas-palad.” Lit., “may/mula sa mga pagpapala”; ginagamit dito ang pangngalang Griyego na “mga pagpapala” bilang idyoma para sa sagana o bukas-palad na sukat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δέ
  choice: 'Ito ang sinasabi ko:'
  rationale: Ang parirala ay nagpapakilala ng isang mariing buod o simulain. Likas sa Tagalog ang paglalantad sa ipinahihiwatig na pandiwa ng pagsasalita, nang hindi ito binibigyan ng temporal na kahulugang wala sa Griyego.
- source_word: ὁ σπείρων
  choice: ang naghahasik
  rationale: Pinananatili nito ang pangkalahatan at kasabihang diwa ng substantival participle, at malinaw itong tumutukoy sa sinumang gumagawa ng paghahasik.
- source_word: φειδομένως
  choice: nang kakaunti
  rationale: Sa larawan ng paghahasik at sa konteksto ng pagbibigay, tumutukoy ito sa kaunti o matipid na sukat. Hindi ginamit ang “nang maramot” sapagkat magdaragdag iyon ng mas matinding paghatol sa motibo.
- source_word: καὶ θερίσει
  choice: ay mag-aani rin
  rationale: Ipinahahayag ng “rin” ang katumbas na bunga at pinananatili ang paralelismo ng paghahasik at pag-aani.
- source_word: ἐπ’ εὐλογίαις
  choice: nang may pagpapala
  rationale: Pinananatili nito ang leksikal at teolohikal na ugnayan sa “pagpapala,” habang ang pariralang may “nang” ay gumaganap bilang paglalarawan sa paraan ng paghahasik at pag-aani. Maaaring idiomatikong mangahulugan ang Griyego ng sagana o bukas-palad, kaya inilagay ang alternatibo sa talababa.
theological_decisions:
- issue: Kahulugan ng εὐλογίαις sa kasabihan tungkol sa paghahasik at pag-aani
  choice: Pinanatili ang salitang “pagpapala” sa parehong paghahasik at pag-aani.
  alternative: “nang sagana” o “nang bukas-palad”
  rationale: Ang konteksto ay tungkol sa bukas-palad na pagbibigay, ngunit ang pangngalang Griyego ay may tunay na diwa ng pagpapala. Ang pagpapanatili nito ay nag-iingat sa paglalaro ng salita at sa teolohikal na ugnayan ng pagbibigay at pagpapala, nang hindi ginagawang garantiya ng materyal na pagyaman ang talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maikli at kasabihang paralelismo ng orihinal. Ginamit ang isahang “pagpapala” bilang likas na kolektibong anyo sa Tagalog, bagaman maramihan ang anyong Griyego.
