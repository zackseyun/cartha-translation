  source_fidelity: 'Tapat ang salin sa pangunahing daloy ng Griyego: ang paglilingkod ay nagsisilbing katibayan, ang mga tumatanggap ay lumuluwalhati sa Diyos, at ang dahilan ay ang pagsunod na kaugnay ng hayag na pagpapahayag sa ebanghelyo at ang bukas-palad na pagbabahagi. Ang “pagsunod na kaakibat ng pagpapahayag” ay isang maingat at natural na paraan upang katawanin ang masiksik at medyo di-tiyak na genitive na ὑποταγῇ τῆς ὁμολογίας, nang hindi ipinipilit na ang abstraktong “pagpapahayag” mismo ang nagpapasakop. Ang “tungkol sa Mesiyas” ay isang posibleng natural na pagbasa ng εὐαγγέλιον τοῦ Χριστοῦ; ang alternatibong “ng Mesiyas” ay maayos na naitala sa talababa.'
