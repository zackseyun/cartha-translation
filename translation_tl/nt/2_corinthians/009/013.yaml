  terminology: Ang “paglilingkod” para sa διακονία, “katibayan” para sa δοκιμή, “Magandang Balita” para sa εὐαγγέλιον, “Mesiyas” para sa Χριστός bilang titulo, at “pagbabahagi” para sa κοινωνία ay magkakatugma at angkop sa konteksto ng koleksiyon. Nililinaw ng talababa ang materyal na dimensiyon ng κοινωνία nang hindi nililimitahan ang salin sa isang teknikal na termino.
