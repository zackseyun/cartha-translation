  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὰ τῆς δοκιμῆς τῆς διακονίας ταύτης δοξάζοντες τὸν θεὸν ἐπὶ τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ ἁπλότητι τῆς κοινωνίας εἰς αὐτοὺς καὶ εἰς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/013.yaml
  text: Because of the proof provided by this ministry[a], they glorify God for the obedience of your confession to the gospel of the Messiah and for the generosity of your sharing with them and with everyone[d][c][b],
translation:
  language: tl
  text: Dahil sa katibayang ibinibigay ng paglilingkod na ito, niluluwalhati nila ang Diyos dahil sa inyong pagsunod na kaakibat ng pagpapahayag ninyo ng pananampalataya sa Magandang Balita tungkol sa Mesiyas[a], at dahil sa bukas-palad ninyong pagbabahagi sa kanila at sa lahat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Magandang Balita ng Cristo” o “Magandang Balita ng Mesiyas.” Ang salitang Griego na Χριστός ay isang titulong nangangahulugang “Mesiyas” o “ang Pinahiran.”
    reason: alternative_reading
  - marker: b
    text: Ang “pagbabahagi” dito ay malamang na tumutukoy lalo na sa bukas-palad na materyal na ambag para sa nangangailangan, hindi lamang sa pakikisama o pakikipagkapwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκιμῆς
  choice: katibayan
  rationale: Sa konteksto, ang paglilingkod sa pamamagitan ng abuloy ang nahayag na katibayan ng tunay na pananampalataya at pag-ibig; mas natural ito kaysa sa salitang nakatuon sa proseso ng pagsubok.
- source_word: διακονίας
  choice: paglilingkod
  rationale: Tumutukoy ito sa praktikal na gawaing pagtulong at pangangasiwa ng abuloy, habang pinananatili ang diwang espirituwal ng serbisyo.
- source_word: δοξάζοντες τὸν θεὸν
  choice: niluluwalhati nila ang Diyos
  rationale: Ginawang tahasang pandiwa ang participle upang maging malinaw at natural sa Tagalog; malapit ang “niluluwalhati” sa δοξάζω.
- source_word: ὑποταγῇ τῆς ὁμολογίας ὑμῶν
  choice: inyong pagsunod na kaakibat ng pagpapahayag ninyo ng pananampalataya
  rationale: Ipinahahayag nito ang malapit ngunit hindi lubos na tiyak na ugnayan ng pagsunod at pagpapahayag. Ang “kaakibat” ay natural sa Tagalog at hindi nagsasabing ang pagpapahayag mismo ang sumusunod.
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: sa Magandang Balita tungkol sa Mesiyas
  rationale: Ang εἰς ay nagpapakita ng kaugnayan o pagtutuon sa ebanghelyo. Ang genitive ay natural na naipahahayag bilang “tungkol sa,” ngunit nananatiling posible ang “ng Mesiyas”; isinalin ang Χριστός bilang titulong “Mesiyas.”
- source_word: ἁπλότητι
  choice: bukas-palad
  rationale: Sa konteksto ng abuloy, tumutukoy ito sa tapat at masaganang pagkakaloob, hindi lamang sa kasimplehan.
- source_word: κοινωνίας
  choice: pagbabahagi
  rationale: Saklaw nito ang pakikibahagi, lalo na ang materyal na ambag sa kontekstong ito, nang hindi nililimitahan ang salita sa teknikal na “abuloy.”
- source_word: εἰς αὐτοὺς καὶ εἰς πάντας
  choice: sa kanila at sa lahat
  rationale: Pinananatili ang direksiyon at lawak ng kanilang bukas-palad na pagbabahagi sa natural na Tagalog.
theological_decisions:
- issue: Kahulugan ng Χριστοῦ sa εὐαγγέλιον τοῦ Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay titulong nangangahulugang ang Pinahiran; pinananatili ng “Mesiyas” ang puwersa nito bilang titulo nang walang idinadagdag na denominasyonal na paliwanag.
- issue: Ugnayan ng ὑποταγή at ὁμολογία
  choice: pagsunod na kaakibat ng pagpapahayag ninyo ng pananampalataya
  alternative: pagpapasakop ng inyong pagpapahayag
  rationale: Ang genitive construction ay maaaring unawain sa higit sa isang paraan. Pinili ang natural na pahayag na nag-uugnay sa pagsunod at pagpapahayag nang hindi ipinapalagay na ang abstraktong “pagpapahayag” mismo ang sumusunod.
- issue: Genitive sa εὐαγγέλιον τοῦ Χριστοῦ
  choice: Magandang Balita tungkol sa Mesiyas
  alternative: Magandang Balita ng Mesiyas
  rationale: Maaaring tumukoy ang genitive sa nilalaman o kaugnayan, at posible ring sa pinagmulan/pagmamay-ari. Ginamit sa teksto ang mas natural na pagbasa sa konteksto at inilagay sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Magandang Balita” at “Mesiyas” bilang malinaw na katumbas ng mga terminong Griego. Iniwasan ang sobrang literal at alanganing “pagsunod ng inyong pagpapahayag,” ngunit pinanatili sa talababa ang tunay na saklaw ng mahahalagang parirala.
