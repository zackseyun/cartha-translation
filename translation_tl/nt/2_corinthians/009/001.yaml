base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/001.yaml
  text: For concerning the ministry to the saints[a], it is superfluous for me to write to you,
translation:
  language: tl
  text: Sapagkat, tungkol naman sa paglilingkod para sa mga banal[a], hindi na kinakailangan para sa akin na sumulat sa inyo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga banal.” Sa kontekstong ito, maaaring ipahiwatig ng salitang Griyego ang direksiyon o kung sino ang makikinabang.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ μὲν γὰρ
  choice: Tungkol naman sa
  rationale: Ipinakikilala ng Περὶ ang paksa, samantalang ang μὲν γὰρ ay nag-uugnay sa naunang konteksto at naghuhudyat ng paglipat. Likas sa modernong Tagalog ang “Tungkol naman sa” nang hindi pinipilit na isa-isang tumbasan ang mga kataga.
- source_word: διακονίας
  choice: paglilingkod
  rationale: Ang διακονία ay maaaring tumukoy sa paglilingkod, ministeryo, o praktikal na tulong. Sa kontekstong ito, ang “paglilingkod” ay malinaw at marangal na katawagan sa gawaing pagtulong at paglikom.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: para sa mga banal
  rationale: Maaaring ipahiwatig ng εἰς ang direksiyon o ang makikinabang. Mas natural sa Tagalog ang “para sa” sa kontekstong ito, habang pinananatili sa talababa ang posibleng “sa.”
- source_word: ἁγίους
  choice: mga banal
  rationale: Karaniwang tawag ito ni Pablo sa mga mananampalatayang ibinukod para sa Diyos. Ang “mga banal” ay maikli, tradisyonal, at hindi nagpapasok ng paliwanag sa mismong teksto.
- source_word: περισσόν
  choice: hindi na kailangang
  rationale: Dito, ang περισσόν ay nangangahulugang kalabisan o hindi kinakailangan. Ang “hindi na kailangang” ay likas at malinaw sa modernong Tagalog at pinananatili ang retorikal na diwa.
- source_word: μοί ἐστιν τὸ γράφειν ὑμῖν
  choice: hindi ko na kailangang sumulat sa inyo
  rationale: Natural na isinasalin sa Tagalog ang articular infinitive bilang personal na sugnay, habang malinaw na pinananatili ang tagapagsulat at mga kinakausap.
theological_decisions:
- issue: Kahulugan ng εἰς sa paglilingkod na nauukol sa mga banal
  choice: para sa mga banal
  alternative: sa mga banal
  rationale: Sa konteksto ng tulong para sa mga mananampalatayang nangangailangan, natural na ipinahahayag ang benepisyaryo sa “para sa,” ngunit tunay ding posible ang diwang direksiyon ng “sa,” kaya itinatala ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “paglilingkod” sa halip na teknikal na “ministeryo,” at ang “hindi ko na kailangang” sa halip na mas pormal na “kalabisan para sa akin,” upang maging natural nang hindi binabago ang diwa.
