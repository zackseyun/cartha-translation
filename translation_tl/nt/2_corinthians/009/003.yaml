translation:
  language: tl
  text: Ngunit ipinadala ko ang mga kapatid upang ang ipinagmamalaki namin tungkol sa inyo ay hindi mawalan ng saysay[a] sa bagay na ito[b], at upang maging handa kayo, gaya ng lagi kong sinasabi.
