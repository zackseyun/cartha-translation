  - marker: a
    text: Maaari ring “mapatunayang walang laman” o “mapawalang-bisa.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa bahaging ito” o “sa ganitong usapin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεμψα
  choice: ipinadala ko
  rationale: Ang aorist indicative ay natural na ipinahahayag bilang payak na nagdaang kilos; ang “ipinadala” ay karaniwang makabagong Tagalog para sa pagpapadala ng mga kinatawan.
- source_word: τοὺς ἀδελφούς
  choice: ang mga kapatid
  rationale: Tumutukoy ito sa mga tiyak na lalaking kapwa mananampalataya at kinatawan sa konteksto. Natural sa Tagalog ang “mga kapatid” nang hindi na kailangang idagdag ang “na lalaki.”
- source_word: τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν
  choice: ang ipinagmamalaki namin tungkol sa inyo
  rationale: Pinananatili nito ang diwa ng καύχημα bilang ipinagmamalaki o batayan ng pagmamalaki, sa halip na pahinain ito tungo lamang sa “tiwala.”
- source_word: κενωθῇ
  choice: mawalan ng saysay
  rationale: Ipinahahayag nito nang natural ang pasibong ideya na ang pagmamalaki ay mawalan ng laman, mapatunayang walang kabuluhan, o mapawalang-bisa.
- source_word: ἐν τῷ μέρει τούτῳ
  choice: sa bagay na ito
  rationale: Idyomatiko rito ang μέρος at tumutukoy sa partikular na usaping pinag-uusapan, hindi sa isang pisikal na bahagi.
- source_word: καθὼς ἔλεγον
  choice: gaya ng sinasabi ko
  rationale: Ang imperfect na ἔλεγον ay maaaring magpahiwatig ng patuloy o paulit-ulit na pagsasabi; naipapanatili ito ng “sinasabi ko” sa kontekstong tumutukoy sa nauna niyang pahayag.
- source_word: παρεσκευασμένοι ἦτε
  choice: maging handa kayo
  rationale: Natural nitong ipinahahayag ang nilalayong kalagayan ng kahandaan sa loob ng ikalawang sugnay na may ἵνα.
