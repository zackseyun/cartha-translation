reference: 2 Corinthians 9:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀δυνατεῖ δὲ ὁ θεὸς πᾶσαν χάριν περισσεῦσαι εἰς ὑμᾶς, ἵνα ἐν παντὶ πάντοτε πᾶσαν αὐτάρκειαν ἔχοντες περισσεύητε εἰς πᾶν ἔργον ἀγαθόν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/008.yaml
  text: And God is able to make all grace abound to you[a], so that in everything, at all times, having all sufficiency, you may abound in every good work.
translation:
  language: tl
  text: At kayang ibuhos ng Diyos nang sagana sa inyo ang lahat ng biyaya, upang sa lahat ng bagay at sa lahat ng panahon, taglay ninyo ang lahat ng kailangan ninyo[a], managana kayo sa bawat mabuting gawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “may ganap na kasapatan.” Ang salitang Griyego ay maaaring mangahulugang kasapatan, sapat na paglalaan, o pagiging kuntento. Dito, tumutukoy ito sa sapat na paglalaan ng Diyos para sa kanila, hindi sa kasapatang nagmumula lamang sa sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατεῖ
  choice: kayang
  rationale: Ipinahahayag ng pangkasalukuyang pandiwa ang kakayahan at kapangyarihan ng Diyos. Likas sa modernong Tagalog ang “kayang” at hindi nito pinalalabis ang diwa.
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito rito, hindi mariing pagsalungat; maayos na ipinagpapatuloy ng “At” ang naunang pahayag tungkol sa paglalaan ng Diyos.
- source_word: πᾶσαν χάριν
  choice: ang lahat ng biyaya
  rationale: Pinananatili ng “biyaya” ang malawak na diwa ng mapagpalang pagkilos at paglalaan ng Diyos, habang inihahayag ng “lahat” ang mariing saklaw ng πᾶσαν.
- source_word: περισσεῦσαι
  choice: pasaganahin
  rationale: 'Ang anyong pawatas ay may diwang sanhi: magagawa ng Diyos na sumagana ang biyaya sa kanila. Pinananatili rin nito ang temang kasaganaan na inuulit sa περισσεύητε.'
- source_word: εἰς ὑμᾶς
  choice: sa inyo
  rationale: Ipinahahayag nito ang direksiyon ng biyaya patungo sa mga taga-Corinto; natural sa Tagalog ang “sa inyo.”
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinakikilala ng “upang” ang layunin o bunga ng masaganang biyaya ng Diyos.
- source_word: ἐν παντὶ πάντοτε
  choice: sa lahat ng bagay at sa lahat ng panahon
  rationale: Tahasan nitong pinananatili ang paulit-ulit at mariing pananalitang παν- ni Pablo tungkol sa kabuuang saklaw.
- source_word: πᾶσαν αὐτάρκειαν
  choice: ang lahat ng kailangan ninyo
  rationale: Sa konteksto ng pagbibigay, tumutukoy ito sa sapat na paglalaan ng Diyos, hindi sa nagsasariling kasapatan. Ang salin ay malinaw at likas sa karaniwang Tagalog; inilalahad sa talababa ang mas pormal na alternatibo.
- source_word: ἔχοντες
  choice: taglay
  rationale: 'Pinananatili nito ang diwa ng kasabay na kalagayan: habang nasa kanila ang kailangan nila, maaari silang managana sa mabuting gawa.'
- source_word: περισσεύητε
  choice: managana kayo
  rationale: Inuulit nito ang larawan ng kasaganaan mula sa περισσεῦσαι at ipinahahayag na ang layunin ng paglalaan ay kasaganaan sa mabubuting gawa.
- source_word: εἰς πᾶν ἔργον ἀγαθόν
  choice: sa bawat mabuting gawa
  rationale: Natural itong kasunod ng “managana” at pinananatili ang saklaw ng πᾶν at ang aktibong diwa ng ἔργον.
theological_decisions:
- issue: Diwa ng χάρις sa konteksto ng pagkabukas-palad
  choice: biyaya bilang malawak na mapagpalang paglalaan ng Diyos, kabilang ang kakayahang maging bukas-palad
  alternative: pabor lamang o materyal na kaloob lamang
  rationale: May tuwirang kaugnayan ang konteksto sa pagbibigay, ngunit mas malawak ang χάρις kaysa salapi o materyal na tulong. Pinananatili ng “biyaya” ang lawak na ito.
- issue: Diwa ng αὐτάρκεια
  choice: pagkakaroon ng lahat ng kailangan dahil sa paglalaan ng Diyos
  alternative: kasiyahan o nagsasariling kasapatan
  rationale: Ang Diyos ang pinagmumulan ng kasapatan sa talata. Kaya iniiwasan ng salin ang diwang awtonomo o hiwalay sa paglalaan ng Diyos, nang hindi itinatanggi na maaari ring magpahiwatig ang salita ng kasiyahan o kasapatan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang paulit-ulit na diin sa “lahat” at ang magkaugnay na larawan ng pagpapasagana at pananagana, habang iniwasan ang tunog na labis na teknikal o makaluma.
