  - severity: low
    issue: Ang «taglay ang lahat ng kailangan ninyo» ay maaaring magmukhang maluwag ang pagkakaugnay sa paksa.
    rationale: Ang pagdaragdag ng «ninyo» pagkatapos ng «taglay» ay tahasang inilalapat ang participle ἔχοντες sa mga tumatanggap at pinananatili ang sabayang kalagayan.
