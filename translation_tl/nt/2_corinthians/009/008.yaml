revisions:
- from: At kayang pasaganahin ng Diyos sa inyo ang lahat ng biyaya, upang sa lahat ng bagay at sa lahat ng panahon, taglay ang lahat ng kailangan ninyo[a], managana kayo sa bawat mabuting gawa.
  to: At kayang ibuhos ng Diyos nang sagana sa inyo ang lahat ng biyaya, upang sa lahat ng bagay at sa lahat ng panahon, taglay ninyo ang lahat ng kailangan ninyo[a], managana kayo sa bawat mabuting gawa.
  rationale: Pinalitan ang hindi gaanong idiomatikong «pasaganahin ... ang lahat ng biyaya» ng «ibuhos ... nang sagana,» na natural na Tagalog at pinananatili ang sanhi at kasaganaan ng Griyego. Nilinaw rin ang ugnayan ng participle sa pamamagitan ng «taglay ninyo.» Hindi binago ang saklaw ng paulit-ulit na «lahat,» ang malawak na kahulugan ng «biyaya,» o ang kontekstuwal na kahulugan ng αὐτάρκεια.
