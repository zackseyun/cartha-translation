id: 2CO.9.2
reference: 2 Corinthians 9:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἶδα γὰρ τὴν προθυμίαν ὑμῶν ἣν ὑπὲρ ὑμῶν καυχῶμαι Μακεδόσιν ὅτι Ἀχαΐα παρεσκεύασται ἀπὸ πέρυσι, καὶ ⸀τὸ ὑμῶν ζῆλος ἠρέθισε τοὺς πλείονας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/002.yaml
  text: 'For I know your eagerness[a], which I boast about to the Macedonians on your behalf: that Achaia has been ready since last year[c][b], and your zeal has stirred up most of them.'
translation:
  language: tl
  text: 'Sapagkat alam ko ang inyong kahandaang-loob[a], na siyang ipinagmamalaki ko sa mga taga-Macedonia tungkol sa inyo: handa na ang Acaya[b] mula pa noong nakaraang taon, at ang inyong sigasig ay nag-udyok sa karamihan sa kanila.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pananabik” o “kusang-loob na kahandaan.”
    reason: lexical_alternative
  - marker: b
    text: Ang Acaya ay lalawigang Romano na kinabibilangan ng Corinto; ginamit dito ang pangalan ng lugar upang tukuyin ang mga mananampalataya roon.
    reason: cultural_note
  - marker: c
    text: O, “ang nakararami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμίαν
  choice: kahandaang-loob
  rationale: Ipinahahayag nito kapuwa ang kusang pagnanais at ang pagiging handang kumilos, nang hindi ito nililimitahan sa praktikal na paghahanda lamang.
- source_word: καυχῶμαι
  choice: ipinagmamalaki ko
  rationale: Pinananatili nito ang tahasan at malakas na retorika ni Pablo sa halip na palambutin bilang simpleng pagpuri.
- source_word: ὑπὲρ ὑμῶν
  choice: tungkol sa inyo
  rationale: Sa kaugnayan nito sa καυχῶμαι, likas nitong ipinahahayag na ang ipinagmamalaki ni Pablo sa mga taga-Macedonia ay ang kahandaang-loob ng mga taga-Acaya.
- source_word: Μακεδόσιν
  choice: sa mga taga-Macedonia
  rationale: Tuwirang tumutukoy ito sa mga taong mula sa Macedonia, nang hindi idinaragdag sa pangunahing teksto ang kontekstuwal na paglilinaw na sila ay mga mananampalataya.
- source_word: Ἀχαΐα
  choice: Acaya
  rationale: Pinananatili ang pangalang heograpiko at ang metonimiya ng Griyego, kung saan ang lalawigan ay kumakatawan sa mga mananampalataya roon.
- source_word: παρεσκεύασται
  choice: handa na
  rationale: 'Inihahatid nito ang resultang kalagayan ng perpektong anyo: nakapaghanda na sila at nananatiling handa.'
- source_word: ἀπὸ πέρυσι
  choice: mula pa noong nakaraang taon
  rationale: Ito ang likas na Tagalog para sa kalagayang nagsimula noong nakaraang taon at nagpapatuloy hanggang sa kasalukuyan.
- source_word: τὸ ὑμῶν ζῆλος
  choice: ang inyong sigasig
  rationale: Pinananatili ng “sigasig” ang lakas at positibong alab ng ζῆλος sa kontekstong ito.
- source_word: ἠρέθισε
  choice: nag-udyok
  rationale: Sa positibong konteksto, malinaw nitong ipinahahayag na ang sigasig nila ang humikayat sa iba na kumilos, nang walang negatibong dating ng “ginalit” o “pinukaw.”
- source_word: τοὺς πλείονας
  choice: sa karamihan sa kanila
  rationale: Likas na ipinahahayag nito ang nakararaming bahagi ng mga taga-Macedonia na kababanggit lamang.
theological_decisions:
- issue: Ang tinutukoy ng “Acaya”
  choice: Pinanatili ang “Acaya” bilang pangalang heograpiko na kumakatawan sa mga mananampalataya roon.
  alternative: “Kayo ay handa na” o “handa na ang mga mananampalataya sa Acaya.”
  rationale: Tahasan sa Griyego ang Ἀχαΐα. Ang pagpapanatili rito ay hindi nagpapakitid sa mas malawak na saklaw ng pahayag ni Pablo sa Corinto lamang.
- issue: Lakas ng pagmamalaki ni Pablo
  choice: “ipinagmamalaki ko”
  alternative: “ipinagmamalaki ko nang may kasiyahan” o “pinupuri ko”
  rationale: Ang καυχῶμαι ay sadyang malakas na salitang retorikal. Walang dahilan sa teksto upang palambutin o ipaliwanag palayo ang pahayag.
- issue: Saklaw ng τοὺς πλείονας
  choice: “karamihan sa kanila,” na tumutukoy sa mga taga-Macedonia
  alternative: “ang nakararami” nang hindi tahasang ipinahahayag ang reperente
  rationale: Ipinahihiwatig ng konteksto na mga taga-Macedonia ang tinutukoy; nililinaw lamang ng panghalip ang natural na ugnayan nang hindi dinaragdagan ang diwa.
translation_notes:
  register: Modernong Filipino na may dignidad at madaling maunawaan. Ginamit ang “kahandaang-loob” upang maipakita ang kusang loob at aktibong kahandaan; pinanatili ang “Acaya” at ang tahasang “ipinagmamalaki” upang sundan ang anyo at retorika ng Griyego. Inilagay ang tandang [c] sa “karamihan sa kanila,” na siyang tinutukoy ng leksikal na alternatibo.
