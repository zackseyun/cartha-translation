  naturalness: Malinaw at moderno ang salin. Ang “maunang pumunta sa inyo kaysa sa amin” at “isaayos nang maaga” ay mas tuwiran at likas na nagpapahayag ng pagkakasunod ng paglalakbay at paunang paghahanda.
  terminology: Ang “mga kapatid,” “masaganang kaloob,” at mga talababa para sa εὐλογία at πλεονεξία ay angkop. Iniaayos ang pangwakas na parirala upang mas malinaw na maipahiwatig ang contextual na ‘exaction’ nang hindi itinatanggi ang karaniwang kahulugang ‘kasakiman/pag-iimbot.’
  issues:
