id: 2CO.9.5
reference: 2 Corinthians 9:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀναγκαῖον οὖν ἡγησάμην παρακαλέσαι τοὺς ἀδελφοὺς ἵνα προέλθωσιν ⸀εἰς ὑμᾶς καὶ προκαταρτίσωσι τὴν ⸀προεπηγγελμένην εὐλογίαν ὑμῶν, ταύτην ἑτοίμην εἶναι οὕτως ὡς εὐλογίαν καὶ μὴ ὡς πλεονεξίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/005.yaml
  text: Therefore I considered it necessary to urge the brothers[a] to go to you ahead of us and arrange in advance the generous gift[b] you had promised, so that it would be ready as a generous gift and not as something extorted[c].
translation:
  language: tl
  text: Kaya itinuring kong kailangang himukin ang mga kapatid[a] na maunang pumunta sa inyo kaysa sa amin at isaayos nang maaga ang masaganang kaloob[b] na ipinangako ninyo. Sa gayon, magiging handa ito bilang isang masaganang kaloob at hindi bilang isang bagay na sapilitang kinuha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Panlalaking maramihan ang salitang Griyego. Ang “mga kapatid” ay maaaring tumukoy sa mga kapatid sa pananampalataya nang hindi tinutukoy ang kasarian.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “pagpapala.” Dito, tumutukoy ito sa ipinangakong ambag bilang isang masaganang kaloob.
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Griyego ay karaniwang nangangahulugang “kasakiman” o “pag-iimbot.” Dito, inilalarawan nito ang ambag bilang isang bagay na sapilitang kinuha sa halip na kusang-loob na ibinigay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖον οὖν ἡγησάμην
  choice: Kaya itinuring kong kailangang
  rationale: Ipinapahayag nito ang maingat na pasiya ni Pablo at ang praktikal na pangangailangan, nang hindi pinalalabis bilang sapilitang kautusan.
- source_word: παρακαλέσαι
  choice: himukin
  rationale: Ang “himukin” ay natural at may sapat na diin para sa pakiusap ni Pablo na kumilos agad ang delegasyon.
- source_word: τοὺς ἀδελφοὺς
  choice: mga kapatid[a]
  rationale: Ang “mga kapatid” ang likas na katawagan sa Filipino para sa kapwa mananampalataya at hindi nito ipinapalagay na magkakapatid sila sa laman; ipinaliliwanag sa talababa ang panlalaking anyo ng Griyego.
- source_word: προέλθωσιν εἰς ὑμᾶς
  choice: mauna sa amin sa pagpunta sa inyo
  rationale: Nililinaw nito na mauunang dumating ang delegasyon kaysa kay Pablo at sa kanyang mga kasama.
- source_word: προκαταρτίσωσι
  choice: isaayos na
  rationale: Tumutukoy ito sa paunang pag-oorganisa at paghahanda ng nakolektang ambag; natural ang “isaayos na” at hindi nito inuulit ang “magiging handa.”
- source_word: προεπηγγελμένην
  choice: na ipinangako ninyo
  rationale: Malinaw na ang kaloob ang naunang ipinangako ng mga taga-Corinto.
- source_word: εὐλογίαν
  choice: masaganang kaloob[b]
  rationale: Sa konteksto ng koleksiyon, ang literal na “pagpapala” ay tumutukoy sa bukal-palad na ambag. Pinananatili ang pag-uulit ng salita sa dalawang bahagi ng talata.
- source_word: ἑτοίμην εἶναι οὕτως
  choice: Sa gayon, magiging handa ito
  rationale: Likas sa Filipino ang paghihiwalay nito bilang ikalawang pangungusap, habang naipapakita ng “Sa gayon” ang οὕτως at ang nilalayong resulta.
- source_word: πλεονεξίαν
  choice: ambag na sapilitang hiningi[c]
  rationale: Karaniwang nangangahulugang kasakiman o pag-iimbot ang pangngalan, ngunit sa paghahambing dito ay inilalarawan nito ang ambag bilang isang bagay na pinilit makuha sa mga nagbibigay.
theological_decisions:
- issue: Kasarian at saklaw ng τοὺς ἀδελφοὺς
  choice: mga kapatid
  alternative: mga kapatid na lalaki
  rationale: Panlalaking maramihan ang anyong Griyego, ngunit walang likas na kasarian ang “mga kapatid” sa Filipino. Hindi ito ginawang tahasang inklusibo o eksklusibo; inilalahad sa talababa ang tunay na anyo at posibleng saklaw.
- issue: Kahulugan ng εὐλογία sa koleksiyon
  choice: masaganang kaloob
  alternative: pagpapala
  rationale: Ang tinutukoy rito ay ang ipinangakong ambag. Ginagawang malinaw ng “masaganang kaloob” ang gamit sa konteksto, habang pinananatili sa talababa ang literal na larawan ng “pagpapala.”
- issue: Diin ng πλεονεξία sa pangwakas na paghahambing
  choice: ambag na sapilitang hiningi
  alternative: kasakiman o pag-iimbot
  rationale: Hindi makabuluhan sa Filipino na tawaging mismong “kasakiman” ang nakahandang koleksiyon. Ipinakikita ng salin ang paghahambing sa pagitan ng kusang kagandahang-loob at mapang-angking pagpilit, at itinatala sa talababa ang karaniwang leksikal na kahulugan.
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Ginamit ang “isaayos,” “masaganang kaloob,” at “sapilitang hiningi” upang maging malinaw ang konteksto ng koleksiyon, habang pinananatili sa mga talababa ang mahahalagang literal na larawan at leksikal na tensiyon ng Griyego.
