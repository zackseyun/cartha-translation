translation:
  language: tl
  text: Salamat sa Diyos dahil sa kanyang kaloob na hindi lubos na mailarawan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: Salamat
  rationale: Sa padamdam na konstruksyong χάρις τῷ θεῷ, ang χάρις ay nagpapahayag ng pasasalamat o papuri, hindi ng 'biyaya' bilang bagay na tinutukoy.
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Ang datibo ang tumutukoy sa tumatanggap ng pasasalamat; natural itong ipinapahayag sa Filipino bilang 'Salamat sa Diyos.'
- source_word: ἐπὶ
  choice: dahil sa
  rationale: Kasama ng datibo, ipinapahayag dito ng ἐπί ang batayan o dahilan ng pasasalamat. Ang 'dahil sa' ay malinaw at likas sa modernong Filipino.
- source_word: ἀνεκδιηγήτῳ
  choice: hindi kayang lubos na ilarawan
  rationale: Ipinahihiwatig ng salita na ang kaloob ay hindi ganap na maisasalaysay o maipapahayag. Pinananatili ng parirala ang diwa ng higit sa ganap na paglalarawan nang hindi gumagamit ng malabo o makalumang salita.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Ang panghalip ay likas na tumutukoy pabalik sa Diyos at pinananatili bilang panghalip sa salin.
- source_word: δωρεᾷ
  choice: kaloob
  rationale: Ang δωρεά ay isang kusang ibinigay na regalo o kaloob. Dignified at natural ang 'kaloob,' at hindi na kailangang dagdagan ng 'walang bayad.'
theological_decisions:
- issue: Ang tinutukoy ng 'kanyang kaloob na hindi kayang lubos na ilarawan'
  choice: Iniwan itong pangkalahatang tumutukoy sa kaloob ng Diyos, gaya ng nasa Griyego.
  alternative: Tahasang tukuyin ito bilang si Cristo, ang kaligtasan kay Cristo, o ang biyaya ng Diyos na nahahayag sa pagkabukas-palad.
  rationale: Hindi tahasang pinapangalanan ng talata ang kaloob. Bagaman maaaring sentral na tinutukoy si Cristo at ang kaligtasan, kaugnay rin ng konteksto ang biyaya ng Diyos na nagbubunga ng pagkabukas-palad. Hindi dapat lutasin ng salin ang sadyang nananatiling bukas sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang 'kaloob' sa halip na mas kolokyal na 'regalo,' at pinanatili ang padamdam na lakas ng maikling doksolohiya.
