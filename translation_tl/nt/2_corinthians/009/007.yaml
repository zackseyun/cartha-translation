id: 2CO.9.7
reference: 2 Corinthians 9:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ⸀προῄρηται τῇ καρδίᾳ, μὴ ἐκ λύπης ἢ ἐξ ἀνάγκης· ἱλαρὸν γὰρ δότην ἀγαπᾷ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/007.yaml
  text: Each one should give as he has decided in his heart[a], not out of grief or compulsion[b], for God loves a cheerful giver.
translation:
  language: tl
  text: Ang bawat isa ay magbigay ayon sa ipinasiya niya sa kanyang puso, hindi dahil sa kalungkutan[a] o sa pamimilit, sapagkat iniibig ng Diyos ang nagbibigay nang may galak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nang mabigat sa loob.” Literal na tumutukoy ang salitang Griyego sa “kalungkutan” o “dalamhati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: ang bawat isa
  rationale: Pinananatili ang distributibong isahan at likas itong tumutukoy sa bawat tao nang hindi nililimitahan sa lalaki.
- source_word: καθὼς
  choice: ayon sa
  rationale: Malinaw na ipinahahayag ang pamantayan o batayan ng pagbibigay.
- source_word: προῄρηται
  choice: ipinasiya niya
  rationale: Ipinahihiwatig ng pandiwa ang sinadya at naunang personal na pagpapasiya.
- source_word: τῇ καρδίᾳ
  choice: sa kanyang puso
  rationale: Pinananatili ang biblikal na larawan ng puso bilang kaloob-loobang pinagmumulan ng pasiya.
- source_word: μὴ ἐκ λύπης
  choice: hindi dahil sa kalungkutan
  rationale: Pinananatili ang pangunahing leksikal na diwa ng λύπη bilang kalungkutan o dalamhati, habang inilalagay sa talababa ang mas kontekstuwal na pahayag.
- source_word: ἢ ἐξ ἀνάγκης
  choice: o sa pamimilit
  rationale: Sa konteksto ng pagbibigay, malinaw nitong ipinahahayag ang panlabas na puwersa o pagpilit.
- source_word: ἱλαρὸν
  choice: may galak
  rationale: Likas sa modernong Tagalog at malinaw na tumutukoy sa masaya at kusang saloobin ng nagbibigay.
- source_word: δότην
  choice: ang nagbibigay
  rationale: Mas natural sa Tagalog kaysa sa isang tahasang pangngalang tulad ng 'tagapagbigay'.
- source_word: ἀγαπᾷ
  choice: iniibig
  rationale: Tuwirang pinananatili ang karaniwang kahulugan ng ἀγαπάω at ang teolohikal na diin ng pahayag.
- source_word: ὁ θεός
  choice: ang Diyos
  rationale: Karaniwan at tuwirang salin ng tahasang simuno.
theological_decisions:
- issue: Kinatawang isahan at kasarian
  choice: Ang bawat isa ay magbigay ayon sa ipinasiya niya sa kanyang puso
  alternative: Ang bawat tao ay magbigay ayon sa kanilang ipinasiya
  rationale: Napananatili ng 'bawat isa' at ng isahang panghalip ang indibiduwal na pokus ng Griyego. Sa Tagalog, ang 'niya/kanyang' ay hindi tumutukoy sa isang tiyak na kasarian, kaya hindi kailangang magdagdag ng paliwanag tungkol sa generic masculine.
- issue: Kahulugan ng λύπη sa konteksto ng pagbibigay
  choice: hindi dahil sa kalungkutan
  alternative: hindi nang mabigat sa loob
  rationale: Pinananatili sa pangunahing teksto ang leksikal na diwa na 'kalungkutan' nang hindi lubusang nilulutas ang ugnayan nito sa pag-aatubili; ibinibigay sa talababa ang natural na kontekstuwal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang 'magbigay' upang maipahayag ang hinihinging kilos sa konteksto; iniwasan ang makaluma o teknikal na pananalita. Ang panghalip na 'niya/kanyang' ay likas na walang kasarian sa Tagalog.
