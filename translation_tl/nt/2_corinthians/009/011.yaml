  text: ἐν παντὶ πλουτιζόμενοι εἰς πᾶσαν ἁπλότητα, ἥτις κατεργάζεται δι’ ἡμῶν εὐχαριστίαν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/011.yaml
  text: being enriched in every way for all generosity[a], which through us produces thanksgiving to God—
translation:
  language: tl
  text: Pinayayaman kayo sa lahat ng paraan upang maging lubos na mapagbigay[a], at ang pagiging mapagbigay na ito, sa pamamagitan namin, ay nagbubunga ng pasasalamat sa Diyos—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa ganap na pagiging bukas-palad.” Sa ibang konteksto, ang salitang Griyego ay maaari ring mangahulugang “pagiging tapat” o “pagiging simple,” ngunit dito ay pumapabor ang konteksto ng pagbibigay sa “pagiging mapagbigay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντὶ
  choice: sa lahat ng paraan
  rationale: Likas na ipinahahayag nito ang malawak at komprehensibong diwa ng parirala, hindi lamang isang makitid na lokatibong kahulugan.
- source_word: πλουτιζόμενοι
  choice: pinayayaman
  rationale: Pinananatili ng anyong pasibo ang Diyos bilang ipinahihiwatig na gumagawa, at iniiwasang magpahiwatig ng walang-takdang pangakong materyal na kayamanan.
- source_word: εἰς πᾶσαν ἁπλότητα
  choice: upang maging bukas-palad sa lahat ng pagkakataon
  rationale: Sa konteksto ng pagkakaloob, ang ἁπλότης ay tumutukoy sa mapagbigay at bukas-palad na pagbibigay. Ipinahahayag ng “upang” ang layunin o bunga ng εἰς.
- source_word: ἥτις
  choice: ang pagiging bukas-palad na ito
  rationale: Malinaw na ibinabalik nito ang tinutukoy sa naunang ἁπλότης habang natural ang daloy sa Tagalog.
- source_word: κατεργάζεται
  choice: nagbubunga
  rationale: Ipinahahayag nito ang paglikha o pagdudulot ng resulta sa natural na modernong Tagalog.
- source_word: δι’ ἡμῶν
  choice: sa pamamagitan namin
  rationale: Tuwirang pinananatili ang instrumental na kahulugan ng διά at hindi idinaragdag nang tahasan ang salitang “ministeryo.”
- source_word: εὐχαριστίαν τῷ θεῷ
  choice: pasasalamat sa Diyos
  rationale: Pinananatili ang pangngalang diwa ng εὐχαριστία at ang Diyos bilang tumatanggap ng pasasalamat.
theological_decisions:
- issue: Kahulugan ng ἁπλότης sa konteksto ng ambagan
  choice: pagiging bukas-palad sa pagbibigay
  alternative: pagiging simple, tapat, o dalisay ang layunin
  rationale: Bagaman maaaring tumukoy ang ἁπλότης sa pagiging simple o tapat sa ibang konteksto, ang agarang usapan tungkol sa pagkakaloob at sa pasasalamat na ibinubunga nito ay pumapabor sa konkretong pagiging bukas-palad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pinayayaman” upang mapanatili ang pasibong kilos at ang “bukas-palad” bilang karaniwang, konkretong pananalita para sa mapagbigay na pagkakaloob. Pinanatili ang pangwakas na gitling sapagkat nagpapatuloy ang pangungusap sa kasunod na talata.
