base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/010.yaml
  text: The one who supplies seed to the sower and bread for food will supply and multiply your seed and increase the harvest of your righteousness[a][b].
translation:
  language: tl
  text: Ang nagbibigay ng binhi sa naghahasik at tinapay bilang pagkain ay magbibigay at magpaparami ng inyong binhi, at pasasaganain ang ani ng inyong katuwiran[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “palalaguin ang mga bunga ng inyong katuwiran.”
    reason: lexical_alternative
  - marker: b
    text: O “ang ani ng inyong katarungan.” Ang salitang Griego na δικαιοσύνη ay maaaring mangahulugang “katuwiran” o, sa ilang konteksto, “katarungan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: ang nagbibigay
  rationale: Isinalin ang artikulong may pandiwaring pantukoy bilang “ang nagbibigay.” Malinaw nitong ipinahihiwatig ang patuloy at sapat na paglalaan nang hindi nagdaragdag ng pangalang wala sa mismong parirala.
- source_word: σπόρον
  choice: binhi
  rationale: Pinananatili ng “binhi” ang literal na larawang pansakahan at ang kaugnayan nito sa paghahasik.
- source_word: τῷ σπείροντι
  choice: sa manghahasik
  rationale: Maikli at likas na salin ng pandiwaring tumutukoy sa taong naghahasik.
- source_word: ἄρτον εἰς βρῶσιν
  choice: tinapay na makakain
  rationale: Likas sa modernong Filipino at malinaw na itinatangi ang pagkaing kakainin sa binhing ihahasik.
- source_word: χορηγήσει
  choice: magbibigay
  rationale: Hinaharap na pandiwa na nagpapanatili ng ugnayang leksikal sa naunang “nagbibigay.”
- source_word: πληθυνεῖ
  choice: magpaparami
  rationale: Tumpak na ipinahahayag ang pagpaparami o pagpapasagana ng binhi at pinananatili ang larawang pansakahan.
- source_word: τὸν σπόρον ὑμῶν
  choice: inyong binhi
  rationale: Pinanatiling tuwiran upang manatiling bukas ang pagtukoy kapuwa sa materyal na kakayahang magbigay at sa metaporikong bunga nito.
- source_word: αὐξήσει
  choice: pasasaganain
  rationale: Likas na Filipino para sa pagpapalago o pagdaragdag ng ani, nang hindi ipinahihiwatig ang isang tiyak na uri lamang ng pakinabang.
- source_word: τὰ γενήματα
  choice: ang ani
  rationale: Ang pangngalan ay tumutukoy sa bunga, ani, o inaning produkto. Ang “ani” ang malinaw na kolektibong katawagan at nagpapatuloy sa larawang pansakahan.
- source_word: δικαιοσύνης
  choice: katuwiran
  rationale: Ang “katuwiran” ang karaniwang salin sa ganitong kontekstong teolohikal, habang inilalagay sa talababa ang posibleng kahulugang “katarungan.”
theological_decisions:
- issue: Kahulugan ng “ani ng inyong katuwiran”
  choice: Metapora para sa mga bunga o resultang nagmumula sa matuwid nilang pagkabukas-palad, nang hindi nililimitahan sa materyal na pakinabang o sa isang teknikal na katayuang teolohikal.
  alternative: Maaaring tumukoy sa materyal na pagpapala, sa bunga ng katapatan o katarungan, o sa nakikitang katibayan ng matuwid na pamumuhay.
  rationale: Ang konteksto ay tungkol sa bukas-palad na pagbibigay at gumagamit ng larawang pansakahan. Pinananatili ng salin ang lawak at tensiyong teolohikal sa halip na ipakahulugan ito bilang pangakong materyal lamang o bilang isang natatanging doktrina ng katuwiran.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang larawang binhi–paghahasik–ani at iniwasang tukuyin nang tahasan ang Diyos sa simula dahil ang tekstong Griego ay nagsasabing “ang nagbibigay,” bagaman malinaw sa konteksto kung sino ang tinutukoy. Ang mga pananda ng talababa [a] at [b] ay kapuwa nasa pangunahing teksto.
