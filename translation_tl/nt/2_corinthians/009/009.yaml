  source_fidelity: Tapat ang salin sa Griyegong sipi. Ang “Gaya ng nasusulat” ay wastong pormula ng pagsipi; ang “Namudmod siya at nagbigay sa mga dukha” ay pinananatili ang dalawang magkahanay na pandiwang aorist at ang larawan ng malawak na pamamahagi; at ang “nananatili magpakailanman” ay tumpak na naghahayag ng μένει εἰς τὸν αἰῶνα.
