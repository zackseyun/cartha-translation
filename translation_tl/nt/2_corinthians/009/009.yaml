  text: (καθὼς γέγραπται· Ἐσκόρπισεν, ἔδωκεν τοῖς πένησιν, ἡ δικαιοσύνη αὐτοῦ μένει εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/009.yaml
  text: 'as it is written: “He scattered abroad[a], he gave to the poor; his righteousness remains forever.”'
translation:
  language: tl
  text: 'Gaya ng nasusulat:


    “Namudmod siya at nagbigay sa mga dukha;

    ang kanyang katuwiran[a] ay nananatili magpakailanman.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katarungan.” Ang salitang Griyego ay maaaring tumukoy kapwa sa katuwiran at sa katarungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: Gaya ng nasusulat
  rationale: Likas at pormal na panimulang pormula sa pagsipi ng Kasulatan; tapat sa kahulugan ng Griyego.
- source_word: Ἐσκόρπισεν
  choice: Namudmod siya
  rationale: Ipinahahayag ang malawakang pamamahagi na nasa larawan ng pandiwang Griyego, nang hindi ginagamit ang di-likas o maaaring negatibong tunog ng literal na “nagkalat.”
- source_word: ἔδωκεν
  choice: nagbigay
  rationale: Payak at natural na anyong naganap, na angkop sa aorist at sa parallelism ng sipi.
- source_word: τοῖς πένησιν
  choice: sa mga dukha
  rationale: Tuwirang tumutukoy sa mga taong kapos sa kabuhayan; ang “dukha” ay malinaw, dignipikado, at angkop sa rehistrong pangkasulatan.
- source_word: ἡ δικαιοσύνη αὐτοῦ
  choice: ang kanyang katuwiran
  rationale: Pinananatili ang malawak na saklaw ng δικαιοσύνη—pagiging matuwid o matuwid na gawa—at ang leksikal na pagkakaugnay nito sa ibang gamit sa mga sulat ni Pablo.
- source_word: μένει
  choice: nananatili
  rationale: Tumpak at likas na katumbas na nagpapahayag ng patuloy na pag-iral o bisa.
- source_word: εἰς τὸν αἰῶνα
  choice: magpakailanman
  rationale: Karaniwan at malinaw na salin ng idyomang tumutukoy sa walang-hanggang pananatili.
theological_decisions:
- issue: Saklaw ng kahulugan ng δικαιοσύνη sa siping ito
  choice: katuwiran
  alternative: katarungan
  rationale: Ang “katuwiran” ay nagpapanatili sa posibilidad na tumukoy ang salita sa matuwid na katangian o matuwid na gawa ng mapagbigay na tao. Inilalagay sa talababa ang “katarungan” upang hindi mawala ang lehitimong etikal at pangkatarungang diwa ng salitang Griyego.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang anyong patula ng sipi sa pamamagitan ng paghahati sa mga linya at parallel na mga pandiwa. Ginamit ang “namudmod” bilang natural na pagpapahayag ng malawak na pamamahagi.
