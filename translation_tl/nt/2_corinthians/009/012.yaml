reference: 2 Corinthians 9:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι ἡ διακονία τῆς λειτουργίας ταύτης οὐ μόνον ἐστὶν προσαναπληροῦσα τὰ ὑστερήματα τῶν ἁγίων, ἀλλὰ καὶ περισσεύουσα διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/012.yaml
  text: For the ministry of this service is not only supplying the needs of the saints[b][a], but is also overflowing in many thanksgivings to God—
translation:
  language: tl
  text: Sapagkat ang ministeryong ito ng paglilingkod ay hindi lamang tumutustos sa mga kakulangan ng mga banal[a], kundi nag-uumapaw rin sa maraming pasasalamat sa Diyos[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pinupunan ang mga kakulangan ng mga banal.”
    reason: lexical_alternative
  - marker: b
    text: O, “nagbubunga rin ng maraming pasasalamat sa Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Naghahatid ito ng paliwanag sa naunang pahayag at likas na katumbas ng paliwanag na gamit ng ὅτι.
- source_word: ἡ διακονία τῆς λειτουργίας ταύτης
  choice: ang ministeryo ng paglilingkod na ito
  rationale: 'Pinananatili ang pagkakaiba ng dalawang magkaugnay na salita: ang διακονία bilang ministeryo at ang λειτουργία bilang tiyak na gawaing paglilingkod.'
- source_word: προσαναπληροῦσα
  choice: pumupuno
  rationale: Ipinahahayag ang pagpuno sa kung ano ang kulang, nang hindi dinaragdagan ang diwa ng ganap o lubos na pagtustos.
- source_word: τὰ ὑστερήματα
  choice: sa kakulangan
  rationale: Malapit ito sa literal na diwa ng mga kakulangan o bagay na wala; pinananatili ng footnote ang mas kontekstuwal na salitang “pangangailangan.”
- source_word: τῶν ἁγίων
  choice: ng mga banal
  rationale: Pinananatili ang karaniwang katawagan ni Pablo sa mga mananampalataya at hindi ito pinapalitan ng mas interpretibong “bayan ng Diyos.”
- source_word: περισσεύουσα
  choice: nag-uumapaw
  rationale: Inihahatid ang larawan ng kasaganaang lampas sa sapat na ipinahihiwatig ng pandiwa.
- source_word: διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ
  choice: sa maraming pasasalamat sa Diyos
  rationale: Likas sa Tagalog at pinananatiling bukas ang ugnayan ng kasaganaan at ng maraming pagpapasalamat na nakatuon sa Diyos.
theological_decisions:
- issue: Katawagan ni Pablo na ἅγιοι
  choice: mga banal
  alternative: bayan ng Diyos / mga taong itinalaga sa Diyos
  rationale: Ang “mga banal” ang tuwirang katumbas at karaniwang katawagang Paulino; hindi nito ipinahihiwatig na ang tinutukoy ay isang natatanging uring kinanonisa.
- issue: Ugnayan ng paglilingkod at mga pasasalamat sa διὰ πολλῶν εὐχαριστιῶν
  choice: nag-uumapaw ... sa maraming pasasalamat
  alternative: nagbubunga ... ng maraming pasasalamat
  rationale: Pinananatili sa pangunahing teksto ang larawan at bahagyang kalabuan ng Griyego; inilalagay sa footnote ang malinaw na resultang pagbasa.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “ministeryo” upang maiba ang διακονία sa λειτουργία na isinaling “paglilingkod,” habang nananatiling malinaw sa karaniwang mambabasa. Pinanatili ang em dash dahil nagpapatuloy ang pangungusap sa kasunod na talata.
