revisions:
- from: Sapagkat ang ministeryo ng paglilingkod na ito ay hindi lamang pumupuno sa kakulangan ng mga banal[a], kundi nag-uumapaw rin sa maraming pasasalamat sa Diyos[b]—
  to: Sapagkat ang ministeryong ito ng paglilingkod ay hindi lamang tumutustos sa mga kakulangan ng mga banal[a], kundi nag-uumapaw rin sa maraming pasasalamat sa Diyos[b]—
  rationale: Inayos ang ayos ng parirala upang maging mas natural sa makabagong Filipino habang pinananatili ang sadyang pagkakaiba ng διακονία at λειτουργία. Pinalitan ang "pumupuno sa kakulangan" ng "tumutustos sa mga kakulangan" upang maipahayag nang mas idiomatiko ang προσαναπληροῦσα τὰ ὑστερήματα. Pinanatili ang "nag-uumapaw ... sa maraming pasasalamat sa Diyos," na naglilipat ng larawan ng περισσεύουσα at hindi pinipilit ang pinagtatalunang tiyak na ugnayan ng διά.
