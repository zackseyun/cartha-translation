  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μή πως ἐὰν ἔλθωσιν σὺν ἐμοὶ Μακεδόνες καὶ εὕρωσιν ὑμᾶς ἀπαρασκευάστους καταισχυνθῶμεν ἡμεῖς, ἵνα μὴ ⸀λέγωμεν ὑμεῖς, ἐν τῇ ὑποστάσει ⸀ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/004.yaml
  text: lest if any Macedonians come with me and find you unprepared[b][a], we—not to say you—would be put to shame in this matter of confidence.
translation:
  language: tl
  text: Baka may mga taga-Macedonia na sumama sa akin at madatnan kayong hindi handa, at mapahiya kami—huwag nang sabihing pati kayo[b]—dahil sa pagtitiwalang ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sa paninindigang ito.” Maaari ring tumukoy ang salitang Griyego sa isang gawain o kalagayan, ngunit dito ay malamang na tumutukoy ito sa pagtitiwala ni Pablo sa kanila.
    reason: lexical_alternative
  - marker: b
    text: O “huwag nang banggitin pa kayo.” Ipinahihiwatig ni Pablo na mapapahiya rin ang mga taga-Corinto kung madatnan silang hindi handa.
    reason: alternative_reading
lexical_decisions:
- source_word: μή πως ἐὰν
  choice: Baka kasi
  rationale: Ipinahahayag nito ang pangamba ni Pablo tungkol sa isang posibleng mangyari sa hinaharap. Likas ito sa modernong Tagalog at napananatili ang diwang pang-iwas ng μή πως kasama ng kondisyonal na ἐάν.
- source_word: ἔλθωσιν σὺν ἐμοὶ Μακεδόνες
  choice: may mga taga-Macedonia na sumama sa akin
  rationale: Ang walang artikulong Μακεδόνες ay hindi tumutukoy nang tiyak sa isang kilalang pangkat; ipinahihiwatig ng “may mga” na maaaring ilan sa kanila ang sumama kay Pablo.
- source_word: εὕρωσιν ὑμᾶς ἀπαρασκευάστους
  choice: madatnan kayong hindi handa
  rationale: Ang ἀπαρασκευάστους ay nangangahulugang hindi nakapaghanda o hindi handa. Ang “madatnan” ay natural para sa pagkakita sa kanilang kalagayan pagdating ng mga bisita.
- source_word: καταισχυνθῶμεν
  choice: mapahiya kami
  rationale: 'Napananatili ng “mapahiya” ang balintiyak at panlipunang diwa ng pandiwa: malalagay sila sa kahihiyan sa harap ng iba, hindi lamang makararamdam ng hiya sa loob.'
- source_word: ἡμεῖς
  choice: kami
  rationale: Mariin ang tahasang panghalip sa Griyego. Naipakikita ang diin sa Tagalog sa pagkakalagay nito bago ang parentetikong “huwag nang sabihing pati kayo.”
- source_word: ἵνα μὴ λέγωμεν ὑμεῖς
  choice: huwag nang sabihing pati kayo
  rationale: Pinapalambot ng parentetikong pahayag ang sinabi ni Pablo habang ipinahihiwatig na mapapahiya rin ang mga taga-Corinto.
- source_word: ἐν τῇ ὑποστάσει ταύτῃ
  choice: dahil sa pagtitiwalang ito
  rationale: Sa konteksto, ang ὑπόστασις ay pinakamalamang na tumutukoy sa matatag na pagtitiwala ni Pablo sa kanilang kahandaan. Ang “dahil sa” ay malinaw na nag-uugnay sa kahihiyan at sa pagtitiwalang mapatutunayang walang batayan kung hindi sila handa.
theological_decisions:
- issue: Kahulugan ng ὑπόστασις sa di-teknikal na kontekstong ito
  choice: pagtitiwala
  alternative: paninindigan, gawaing ito, o kalagayang ito
  rationale: Ang agarang konteksto ay ang pagtitiwala ni Pablo na nakahanda ang mga taga-Corinto. Hindi ginamit ang “substansiya,” na maaaring magpasok ng kalaunang pilosopikal o teolohikal na kahulugang wala rito; gayunman, kinikilala sa talababa ang tunay na lawak ng salitang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “taga-Macedonia” sa halip na mas pormal na “Macedonio,” at “huwag nang sabihing pati kayo” upang mapanatili ang mahinahong parentetikong diin ng Griyego.
