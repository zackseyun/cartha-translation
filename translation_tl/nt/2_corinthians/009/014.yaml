source:
  edition: SBLGNT
  text: καὶ αὐτῶν δεήσει ὑπὲρ ὑμῶν ἐπιποθούντων ὑμᾶς διὰ τὴν ὑπερβάλλουσαν χάριν τοῦ θεοῦ ἐφ’ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/014.yaml
  text: and in their prayer for you[a], they long for you because of the surpassing grace of God upon you.
translation:
  language: tl
  text: at sa kanilang panalangin para sa inyo[a], nananabik sila sa inyo dahil sa di-masukat na biyaya ng Diyos sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanilang pagsusumamo para sa inyo, habang nananabik sila sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: at
  rationale: Likas na pang-ugnay sa naunang daloy ng pangungusap at katumbas ng simpleng connective na καί.
- source_word: αὐτῶν δεήσει ὑπὲρ ὑμῶν
  choice: sa kanilang panalangin para sa inyo
  rationale: Pinananatili nito ang possessive na αὐτῶν, ang panalanging/intercesoryong diwa ng δέησις, at ang karaniwang kahulugan ng ὑπέρ na ‘para sa.’ Ang ‘panalangin’ ay mas natural sa modernong Tagalog kaysa ‘pagsusumamo,’ bagaman posible ang huli.
- source_word: ἐπιποθούντων ὑμᾶς
  choice: nananabik sila sa inyo
  rationale: Ginawang sugnay ang genitive participle upang maging malinaw at natural sa Tagalog, habang pinananatili ang patuloy at masidhing pagnanais na ipinahihiwatig ng ἐπιποθέω.
- source_word: διὰ
  choice: dahil sa
  rationale: Kasama ng accusative, ipinahahayag dito ng διά ang sanhi o dahilan ng kanilang pananabik.
- source_word: τὴν ὑπερβάλλουσαν χάριν
  choice: di-masukat na biyaya
  rationale: Ang ‘di-masukat’ ay natural at marangal na paglalarawan sa biyayang lubhang nakahihigit o pambihira; pinananatili ng ‘biyaya’ ang teolohikal na bigat ng χάρις.
- source_word: τοῦ θεοῦ ἐφ’ ὑμῖν
  choice: ng Diyos sa inyo
  rationale: Ang ‘sa inyo’ ay natural na Tagalog at hindi ipinipilit kung ang ἐπί ay tumutukoy sa biyayang nasa kanila, sumasaklaw sa kanila, o kumikilos sa kanilang kalagayan.
theological_decisions:
- issue: Ugnayan ng panalangin at pananabik sa siksik na sintaks ng Griyego
  choice: Inilalarawan ang mga tumanggap ng kaloob na nananalangin para sa mga taga-Corinto at nananabik sa kanila.
  alternative: Maaaring idiin na ang kanilang pananabik ay ipinahahayag sa pamamagitan mismo ng kanilang pagsusumamo para sa mga taga-Corinto.
  rationale: Ang genitive participle na ἐπιποθούντων ay kaugnay ng αὐτῶν, ngunit hindi tahasang nililinaw ng Griyego kung ang panalangin ang kalagayan o paraan ng pagpapahayag ng pananabik. Pinananatili ng salin ang dalawang kilos nang hindi nagdaragdag ng tiyak na teolohikal na ugnayang wala sa teksto.
- issue: Saklaw ng ἐφ’ ὑμῖν
  choice: ‘sa inyo,’ na sadyang maluwag ang saklaw
  alternative: ‘sumasainyo’ o ‘nasa inyo,’ na higit na naglalarawan sa biyayang nakalukob o nananatili sa kanila
  rationale: Maaaring mangahulugan ang ἐπί na ‘sa,’ ‘nasa ibabaw ng,’ o mas malawak na ‘tungkol sa kalagayan ninyo.’ Ang payak na ‘sa inyo’ ang higit na nagpapanatili sa tunay na kaluwagan nito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang ‘nananabik’ para sa mainit at patuloy na pagnanais, at ‘di-masukat na biyaya’ upang ihatid ang pambihirang tindi ng ὑπερβάλλουσαν nang hindi maging teknikal.
