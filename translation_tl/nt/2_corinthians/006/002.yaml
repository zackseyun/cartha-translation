id: 2CO.6.2
reference: 2 Corinthians 6:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγει γάρ· Καιρῷ δεκτῷ ἐπήκουσά σου καὶ ἐν ἡμέρᾳ σωτηρίας ἐβοήθησά σοι· ἰδοὺ νῦν καιρὸς εὐπρόσδεκτος, ἰδοὺ νῦν ἡμέρα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/002.yaml
  text: For he says[a], “At an acceptable time I listened to you, and in a day of salvation I helped you.” Behold, now is the acceptable time; behold[b], now is the day of salvation.
translation:
  language: tl
  text: Sapagkat sinasabi niya, “Sa panahong kalugod-lugod, dininig kita[a], at sa araw ng kaligtasan, tinulungan kita.” Narito, ngayon ang panahong lubos na kalugod-lugod;[b] narito, ngayon ang araw ng kaligtasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinakinggan kita nang may pagsang-ayon.” Ang pandiwa ay maaaring tumukoy sa pagdinig na may pagtanggap o pagtugon.
    reason: lexical_alternative
  - marker: b
    text: Walang artikulo sa Griyego sa “panahong lubos na kalugod-lugod” at “araw ng kaligtasan.” Maaari ring isalin na “ngayon ay isang panahong lubos na kalugod-lugod … ngayon ay isang araw ng kaligtasan,” ngunit mas natural at mariin sa Tagalog ang anyo sa pangunahing teksto.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει γάρ
  choice: Sapagkat sinasabi niya
  rationale: Ang γάρ ay nagbibigay ng paliwanag at nag-uugnay sa naunang panawagan ni Pablo. Pinananatili ng “sinasabi niya” ang personal na nagsasalita na ipinahihiwatig ng sipi, sa halip na gawing impersonal na “sinasabi ng Kasulatan.”
- source_word: Καιρῷ δεκτῷ
  choice: Sa panahong kalugod-lugod
  rationale: Ang καιρός ay ang angkop o itinakdang pagkakataon, hindi lamang oras ayon sa orasan. Ang δεκτός ay maaaring mangahulugang katanggap-tanggap o pinapaboran; ipinahahayag ito ng “kalugod-lugod” sa dignified at likas na Tagalog.
- source_word: ἐπήκουσά σου
  choice: dininig kita
  rationale: Ang ἐπακούω ay pakikinig na may pagtanggap o pagtugon. Ang “dininig” ay maikli at angkop sa anyong sipi, habang hindi pa ipinapalagay ang mas tiyak na “sinagot.”
- source_word: ἐν ἡμέρᾳ σωτηρίας
  choice: sa araw ng kaligtasan
  rationale: Pinananatili ang tuwirang ugnayan ng ἡμέρα at σωτηρία. Hindi natural sa Tagalog ang paulit-ulit na paglalagay ng “isang” dito, at hindi rin kailangan ng parirala na magtakda kung natatangi o di-natatangi ang araw.
- source_word: ἐβοήθησά σοι
  choice: tinulungan kita
  rationale: Tuwirang ipinapahayag nito ang kahulugan ng βοηθέω na tumulong o sumaklolo, nang hindi dinaragdagan ang uri ng tulong.
- source_word: ἰδοὺ
  choice: Narito
  rationale: Ang “narito” ay isang marangal at malinaw na pantawag-pansin na nagpapanatili sa diin at agarang tono ng ἰδού.
- source_word: νῦν
  choice: ngayon
  rationale: Tuwirang pinananatili nito ang temporal at retorikal na diin ng νῦν.
- source_word: καιρὸς εὐπρόσδεκτος
  choice: ang panahong lubos na kalugod-lugod
  rationale: Mas malakas ang εὐπρόσδεκτος kaysa δεκτός; ipinakikita ng “lubos” ang pinatinding diwa habang pinananatili ng “kalugod-lugod” ang leksikal na kaugnayan ng dalawang parirala.
- source_word: ἡμέρα σωτηρίας
  choice: ang araw ng kaligtasan
  rationale: Ito ang pinakanatural at mariing anyo sa Tagalog sa pahayag na “ngayon ang…”. Hindi awtomatikong tumutumbas ang artikulong Tagalog na “ang” sa pagkakaroon ng artikulo sa Griyego, kaya hindi nito kailangang lutasin ang lahat ng usapin tungkol sa pagiging tiyak ng parirala.
theological_decisions:
- issue: Kung ang mga pariralang tungkol sa panahon at araw ng kaligtasan ay dapat ipahayag bilang tiyak o di-tiyak
  choice: Gamitin ang natural na Tagalog na “ngayon ang panahong…” at “ngayon ang araw…” sa aplikasyon ni Pablo, ngunit banggitin sa talababa na walang artikulo ang mga pariralang Griyego.
  alternative: “ngayon ay isang panahong… ngayon ay isang araw ng kaligtasan”
  rationale: Walang artikulo ang Griyego, ngunit hindi nito sapilitang ginagawang di-tiyak ang mga panaguring pangngalan. Ang “ang” ang natural na balangkas sa Tagalog para sa mariing pagkakakilanlan sa kasalukuyang sandali; pinananatili ng talababa ang tunay na gramatikal na puwang nang hindi nagpapasok ng isang tiyak na sistemang eskatolohikal.
- issue: Kung ang λέγει ay tumutukoy nang personal sa Diyos o impersonal sa Kasulatan
  choice: “sinasabi niya”
  alternative: “sinasabi nito” o “sinasabi ng Kasulatan”
  rationale: Ipinahihiwatig ng mismong sipi ang isang personal at banal na nagsasalita. Pinananatili ng panghalip ang teolohikal na himig nang hindi nagdaragdag ng pangalang wala sa talata.
- issue: Kung ang ἐπήκουσά σου ay dapat unawain bilang simpleng pagdinig o tahasang pagsagot
  choice: “dininig kita”
  alternative: “pinakinggan kita nang may pagsang-ayon” o “sinagot kita”
  rationale: Maaaring taglay ng pandiwa ang pakikinig na may pagtanggap at pagtugon. Ang pangunahing teksto ay hindi nagpapakitid nito sa isang tahasang sagot; nililinaw ng talababa ang saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “narito” upang mapanatili ang solemneng diin ng ἰδού, “dininig” para sa maikli at biblikal ngunit nauunawaang anyo, at “lubos na kalugod-lugod” upang maipakita ang pagkakaiba ng δεκτός at εὐπρόσδεκτος nang hindi nagiging teknikal.
