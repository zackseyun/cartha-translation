base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/011.yaml
  text: Our mouth has been opened to you[a], Corinthians[b]; our heart has been widened.
translation:
  language: tl
  text: Hayagan kaming nagsalita sa inyo, mga taga-Corinto; maluwang ang aming puso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lit. “Ang aming bibig ay nabuksan para sa inyo ... ang aming puso ay pinaluwang.” Maaari ring: “Bukas na bukas sa inyo ang aming puso.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: στόμα
  choice: bibig
  rationale: Pinananatili ng “bibig” ang tahasang talinghaga at ang pagkakatugma nito sa “puso”; ipinahihiwatig ng parirala na hayagan silang kinausap ni Pablo.
- source_word: ἀνέῳγεν
  choice: bukas
  rationale: Likas sa modernong Tagalog ang “bukas ang aming bibig” at naipapahayag nito ang kasalukuyang kalagayang bunga ng pagbubukas, gaya ng perpektong anyo sa Griyego.
- source_word: πρὸς ὑμᾶς
  choice: sa inyo
  rationale: Ang “sa inyo” ang likas na panumbas para sa pagsasalitang tuwirang nakatuon sa mga taga-Corinto.
- source_word: Κορίνθιοι
  choice: mga taga-Corinto
  rationale: Malinaw at natural itong tuwirang pagtawag sa mga taong mula sa Corinto.
- source_word: καρδία
  choice: puso
  rationale: Pinananatili nito ang larawan ng sentro ng pagmamahal at panloob na saloobin, kasama ng katambal na “bibig.”
- source_word: πεπλάτυνται
  choice: pinaluwang
  rationale: Tuwirang inilalarawan nito ang pagpapaluwang o pagpapalapad at pinananatili ang perpektong aspektong nagpapahiwatig ng naganap na kilos na may nananatiling bunga.
theological_decisions:
- issue: Talinghaga ng pagiging bukas sa pananalita at pagmamahal
  choice: Panatilihin sa pangunahing teksto ang mga larawang “bukas ang aming bibig” at “pinaluwang ang aming puso.”
  alternative: “Hayagan kaming nagsalita sa inyo, mga taga-Corinto; bukas na bukas sa inyo ang aming puso.”
  rationale: Pinananatili ng salin ang retorikal na tambalan ng bibig at puso nang hindi tahimik na pinapalitan ang mga larawan ng interpretasyon. Ibinibigay sa talababa ang mas idyomatikong diwa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Sadyang pinanatili ang mga konkretong talinghaga ng Griyego, habang nililinaw sa mga talababa ang kanilang idyomatikong diwa.
