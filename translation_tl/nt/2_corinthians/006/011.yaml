  terminology: Ang “mga taga-Corinto” ay angkop na tuwirang tawag para sa Κορίνθιοι. Ang “puso” ay nararapat na katumbas ng καρδία at hindi dapat palitan ng mas makitid na interpretasyong teolohikal.
