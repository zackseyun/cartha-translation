    rationale: Ang ὡς τέκνοις λέγω ay “nagsasalita ako na para sa/sa mga anak.” Ang binagong ayos ay pinananatili ang hindi tahasang possessive ngunit nililinaw ang kaugnayan ng pananalita sa mga tinutukoy na anak.
  - severity: medium
    issue: Ang “kagantihan” ay hindi angkop na alternatibo sa talababa.
    rationale: Sa makabagong Filipino, karaniwan itong tumutukoy sa retaliation o paghihiganti. Ang ἀντιμισθίαν dito ay tugon, kabayaran, o katumbas na pagbabalik, hindi paghihiganti.
