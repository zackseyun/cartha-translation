  text: In the same return—I speak as to children—be open wide[b][a], you also.
translation:
  language: tl
  text: Bilang katumbas na tugon[a]—sinasabi ko ito sa inyo gaya ng sa mga anak—buksan din ninyo nang maluwang ang inyong kalooban.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bilang kapalit,” “bilang kabayaran,” o “sa pantay na pagtugon.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “magpaluwang din kayo” o “maging maluwang din kayo”; ayon sa konteksto, ang diwa ay maging bukas sa pagmamahal at pagtanggap. Walang tahasang salitang “kalooban” sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν δὲ αὐτὴν ἀντιμισθίαν
  choice: Bilang katumbas na tugon
  rationale: Ipinahahayag ang hinihinging katumbas at tugunang pagtugon, nang hindi ito ginagawang salaping kabayaran. Hindi isinalin nang hiwalay ang δέ sapagkat sapat na ipinakikita ng daloy ng pangungusap ang banayad na paglipat.
- source_word: ὡς τέκνοις λέγω
  choice: nagsasalita ako sa inyo na parang sa mga anak
  rationale: Pinananatili ang paghahambing at ang payak na ‘mga anak’ nang hindi idinaragdag ang hindi tahasang nakasaad na ‘aking.’ Idinagdag ang ‘sa inyo’ bilang likas na Filipino na paglalahad ng di-tuwirang layon.
- source_word: πλατύνθητε
  choice: buksan ... nang maluwang ang inyong kalooban
  rationale: Ang literal na larawan ay ‘palawakin’ o ‘maging maluwang.’ Batay sa agarang konteksto ng talata 11–12, tumutukoy ito sa pagiging bukas sa pagmamahal at pagtanggap; ang ‘kalooban’ ay likas na Filipino at pinananatili ng talababa ang literal na larawan.
- source_word: καὶ ὑμεῖς
  choice: din ninyo
  rationale: 'Pinananatili ang diin sa pagganti ng kaparehong bukas na pagtugon: kung paanong naging bukas si Pablo at ang mga kasama niya, gayon din sana ang mga taga-Corinto.'
theological_decisions:
- issue: Kung gagawing tahasang pag-aari ni Pablo ang katawagang pampamilya
  choice: mga anak
  alternative: mga anak ko
  rationale: Bagaman malinaw ang himig na tulad ng sa isang ama, walang tahasang panghalip na ‘ko’ sa Griyego; kaya hindi ito idinagdag.
- issue: Kung tahasang babanggitin ang panloob na damdamin bilang layon ng πλατύνθητε
  choice: ang inyong kalooban
  alternative: magpakaluwag din kayo / maging maluwang din kayo
  rationale: Ipinahihiwatig ng konteksto ang bukas na pagmamahal at pagtanggap. Ang ‘kalooban’ ay nagpapalinaw sa Filipino nang hindi nililimitahan ito sa emosyon lamang; gayunman, itinatala sa talababa na walang tahasang layon sa Griyego.
translation_notes:
  register: Makabago at marangal na Filipino, na may magiliw na himig ng isang magulang. Ginamit ang ‘kalooban’ sa halip na mas literal ngunit alanganing ‘mapaluwang’ upang maging malinaw sa karaniwang mambabasa habang pinananatili sa talababa ang anyo at kalabuan ng Griyego.
