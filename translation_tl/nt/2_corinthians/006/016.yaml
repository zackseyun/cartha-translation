id: 2CO.6.16
reference: 2 Corinthians 6:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τίς δὲ συγκατάθεσις ναῷ θεοῦ μετὰ εἰδώλων; ⸂ἡμεῖς γὰρ ναὸς θεοῦ ἐσμεν⸃ ζῶντος· καθὼς εἶπεν ὁ θεὸς ὅτι Ἐνοικήσω ἐν αὐτοῖς καὶ ἐμπεριπατήσω, καὶ ἔσομαι αὐτῶν θεός, καὶ αὐτοὶ ἔσονταί ⸀μου λαός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/016.yaml
  text: 'And what agreement has the temple of God with idols? For we are the temple of the living God[a], just as God said: “I will dwell among them and walk among them, and I will be their God[b], and they will be my people.”'
translation:
  language: tl
  text: 'At ano naman ang pagkakasundo[a] ng templo ng Diyos at ng mga diyus-diyosan? Sapagkat tayo ang templo ng Diyos na buhay, gaya ng sinabi ng Diyos:


    “Mananahan ako sa kanila[b] at lalakad sa gitna nila;

    ako ang magiging Diyos nila,

    at sila ang magiging bayan ko.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagkakaayon” o “pakikiisa.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa loob nila.” Ang Griyegong pang-ukol ay maaaring mangahulugang “sa loob” o “sa gitna”; dito, ang konteksto ng tipan sa buong sambayanan ay pumapabor sa “sa kanila.”
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατάθεσις
  choice: pagkakasundo
  rationale: Malinaw at likas na katumbas ito ng kasunduan o pag-ayon, at angkop sa retorikal na tanong tungkol sa dalawang panig na hindi maaaring magkaisa.
- source_word: ναῷ / ναὸς
  choice: templo
  rationale: Tumutukoy ang ναός sa templo o santuwaryo mismo. Pinananatili ng “templo” ang larawang panrelihiyon at madaling maunawaan sa modernong Filipino.
- source_word: εἰδώλων
  choice: mga diyus-diyosan
  rationale: Sa konteksto, tumutukoy ito sa mga bagay na sinasamba bilang mga diyos, hindi lamang sa mga larawang walang relihiyosong kabuluhan.
- source_word: ζῶντος
  choice: na buhay
  rationale: Binabago nito ang “Diyos” sa pariralang “Diyos na buhay,” na nagbibigay-diin sa kaibahan niya sa mga diyus-diyosang walang buhay.
- source_word: καθὼς εἶπεν ὁ θεὸς
  choice: gaya ng sinabi ng Diyos
  rationale: Pinananatili nito ang paghahambing ng καθώς at ang payak na aspektong nakaraan ng εἶπεν.
- source_word: Ἐνοικήσω ἐν αὐτοῖς
  choice: Mananahan ako sa kanila
  rationale: Likas sa Filipino ang “sa kanila” para sa presensiya ng Diyos sa piling ng sambayanan, habang hindi nito lubusang isinasara ang posibilidad ng diwang “sa loob nila.”
- source_word: ἐμπεριπατήσω
  choice: lalakad sa gitna nila
  rationale: Pinananatili nito ang malinaw na larawang antropomorpiko ng pagkilos at presensiya ng Diyos sa gitna ng kanyang bayan.
- source_word: ἔσομαι αὐτῶν θεός
  choice: ako ang magiging Diyos nila
  rationale: Likas na Filipino ito para sa pormulang tipan na nagsasaad ng ugnayan ng Diyos at ng kanyang bayan.
- source_word: λαός
  choice: bayan
  rationale: Sa pormulang tipan, mas malinaw na ipinahihiwatig ng “bayan” ang isang sama-samang sambayanan kaysa sa pangkalahatang “mga tao.”
theological_decisions:
- issue: Sama-samang larawan ng templo
  choice: tayo ang templo ng Diyos na buhay
  alternative: tayo ay isang templo ng Diyos na buhay
  rationale: Ang panaguring ναὸς ay kwalitatibo at tiyak ang diwa sa konteksto. Ipinakikilala nito ang sama-samang sambayanan bilang templo ng Diyos, hindi bilang isa lamang sa maraming templo.
- issue: Pananalita tungkol sa pananahan ng Diyos
  choice: Mananahan ako sa kanila
  alternative: Mananahan ako sa loob nila
  rationale: Ang pangmaramihang αὐτοῖς at ang kasunod na “lalakad sa gitna nila” ay pumapabor sa sama-samang presensiya ng Diyos sa kanyang bayan. Gayunman, pinananatili sa talababa ang posibleng mas panloob na pagbasa ng ἐν.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “diyus-diyosan” at “bayan” upang mapanatili ang panrelihiyon at pangkomunidad na diwa. Inilipat ang mga panandang talababa sa mga pariralang talagang tinutukoy ng mga tala.
