  text: You are not restricted by us[a], but you are restricted in your own affections.
translation:
  language: tl
  text: Hindi kami ang naglilimita sa inyo[a]; ngunit ang sarili ninyong damdamin ang naglilimita sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi kayo nasisikipan dahil sa amin, kundi nasisikipan kayo sa sarili ninyong kalooban.”
    reason: Ipinapakita ang mas literal na talinghaga ng makitid na espasyo, ang alternatibong saklaw ng ἐν, at ang mas malawak na salin ng σπλάγχνα bilang “kalooban.”
lexical_decisions:
- source_word: στενοχωρεῖσθε
  choice: naglilimita sa inyo
  rationale: Ang pandiwa ay naglalarawan, sa literal na diwa, ng pagkakasikip sa isang makitid na lugar at, sa matalinghagang diwa, ng pagkakapigil o pagkakalimitahan. Pinananatili sa dalawang sugnay ang salitang “naglilimita” upang maipakita ang retorikal na pag-uulit at malinaw na paghahambing ni Pablo.
- source_word: ἐν ἡμῖν
  choice: kami ang
  rationale: Bagaman literal na “sa amin,” ipinahihiwatig dito na hindi si Pablo at ang mga kasama niya ang pinagmumulan ng limitasyon. Ang aktibong ayos na “Hindi kami ang naglilimita sa inyo” ay natural sa modernong Tagalog at malinaw na naghahatid ng ugnayang ito.
- source_word: δὲ
  choice: ngunit ipinahiwatig sa pamamagitan ng tuldok-kuwit at magkatapat na mga sugnay
  rationale: Ang δέ ay naghahayag ng pagsalungat. Sa maikling pangungusap na ito, sapat at natural sa Tagalog ang tuldok-kuwit at ang magkatapat na kayarian upang ihayag ang “ngunit,” nang hindi pinabibigat ang daloy.
- source_word: ἐν τοῖς σπλάγχνοις ὑμῶν
  choice: ang sarili ninyong damdamin
  rationale: Ang σπλάγχνα ay literal na mga lamang-loob ngunit matalinghagang tumutukoy sa malalim na damdamin at pagmamahal. Ang “sarili ninyong damdamin” ay likas sa Tagalog, pinananatili ang emosyonal na diwa, at itinatampok na nasa kanila mismo ang limitasyon.
- source_word: οὐ
  choice: Hindi
  rationale: Tuwirang itinatanggi nito ang unang sugnay.
theological_decisions:
- issue: Matalinghagang kahulugan ng σπλάγχνα
  choice: malalim na damdamin o kakayahang tumugon nang may pagmamahal
  alternative: literal na “mga lamang-loob” o mas malawak na “kalooban”
  rationale: 'Relasyonal ang konteksto: inihahambing ni Pablo ang pagiging bukas niya sa napipigil na pagtugon ng mga taga-Corinto. Inihahatid ng “damdamin” ang matalinghagang kahulugan nang hindi ito ginagawang usapin lamang ng isip o paniniwala.'
- issue: Pinagmumulan ng pagkakalimitahan
  choice: Hindi sina Pablo ang naglilimita; nagmumula ito sa sariling damdamin ng mga taga-Corinto.
  alternative: 'Mas literal at malabong lokatibong pagbasa: “Hindi kayo nasisikipan sa amin.”'
  rationale: Maaaring maging lokatibo ang ἐν, ngunit sa konteksto ang punto ay kung saan o kanino nagmumula ang relasyonal na pagkakapigil. Pinananatili ng salin ang pagsalungat nang hindi nagdaragdag ng isang tiyak na doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkatulad na pariralang “naglilimita sa inyo” sa dalawang bahagi upang mapanatili ang pag-uulit ng Griyego, habang ang aktibong ayos ay umiiwas sa di-likas na pasibong Tagalog.
