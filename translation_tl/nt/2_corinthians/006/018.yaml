  yaml_path: translation/nt/2_corinthians/006/018.yaml
  text: And I will be a Father to you[a], and you will be sons and daughters to me, says the Lord Almighty.
translation:
  language: tl
  text: “At ako'y magiging Ama ninyo,[a] at kayo'y magiging mga anak na lalaki at babae sa akin,” sabi ng Panginoong Makapangyarihan sa Lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas malapit sa ayos ng Griyego: “Ako ay magiging para sa inyo bilang Ama, at kayo ay magiging para sa akin bilang mga anak na lalaki at babae.” Ipinahahayag ng idyomang Griyego ang ugnayang tipan, na mas natural sabihin sa Tagalog na “magiging Ama ninyo” at “magiging mga anak na lalaki at babae sa akin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσομαι ὑμῖν εἰς πατέρα
  choice: ako ay magiging Ama ninyo
  rationale: Likas sa modernong Tagalog ang hulma na “magiging Ama ninyo” para sa Griyegong idyoma ng ugnayang tipan; pinananatili nito ang hinaharap at ang relasyong ipinahahayag ng dative at εἰς + accusative.
- source_word: ὑμεῖς ἔσεσθέ μοι
  choice: kayo ay magiging ... ko
  rationale: Pinananatili ang tahasang “kayo” at ang katumbasang ugnayan sa unang sugnay. Ang hulaping “ko” ay natural na Tagalog na pagpapahayag ng μοι sa kontekstong ito.
- source_word: υἱοὺς καὶ θυγατέρας
  choice: mga anak kong lalaki at babae
  rationale: Tahasang binabanggit ng Griyego ang mga anak na lalaki at mga anak na babae; hindi ito pinaiikli sa “mga anak” lamang upang mapanatili ang kapansin-pansing pagsasama sa dalawa.
- source_word: λέγει
  choice: sabi
  rationale: Ang “sabi” ay natural na pormula ng pagsipi sa kasalukuyang Tagalog at angkop sa present-tense citation formula ng Griyego.
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang katumbas sa Bibliyang Tagalog ng banal na titulong κύριος.
- source_word: παντοκράτωρ
  choice: Makapangyarihan sa Lahat
  rationale: Malinaw at dignified na katumbas ng παντοκράτωρ, na naghahayag ng ganap at pansaklaw na kapangyarihan ng Diyos nang hindi inaangkat ang ibang titulong gaya ng “Panginoon ng mga Hukbo.”
theological_decisions:
- issue: Pagpapahayag sa ugnayang pampamilya nang tumpak at kabilang ang parehong kasarian
  choice: mga anak kong lalaki at babae
  alternative: mga anak ko
  rationale: Pinananatili ng pinili ang parehong υἱούς at θυγατέρας at hindi ikinukubli ang tahasang pagbanggit sa mga babae.
- issue: Pagbibigay-kahulugan sa κύριος παντοκράτωρ bilang banal na titulo
  choice: Panginoong Makapangyarihan sa Lahat
  alternative: Panginoon, ang Makapangyarihan sa Lahat
  rationale: Natural bilang pinagsamang titulo sa Tagalog at nananatiling malapit sa Griyego; hindi nito ipinapalit ang ibang titulong mula sa Lumang Tipan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “Ama” bilang banal na titulong panrelasyon at ang “Panginoong Makapangyarihan sa Lahat” bilang malinaw na katumbas ng κύριος παντοκράτωρ.
