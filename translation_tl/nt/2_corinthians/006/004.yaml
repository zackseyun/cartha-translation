  text: ἀλλ’ ἐν παντὶ ⸀συνιστάνοντες ἑαυτοὺς ὡς θεοῦ διάκονοι· ἐν ὑπομονῇ πολλῇ, ἐν θλίψεσιν, ἐν ἀνάγκαις, ἐν στενοχωρίαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/004.yaml
  text: 'but in everything commending ourselves as God''s servants: in great endurance[a], in afflictions, in hardships, in distresses[c][b],'
translation:
  language: tl
  text: 'Ngunit sa lahat ng bagay[a] ay ipinakikita naming kami ay mga lingkod ng Diyos[b]: sa matinding pagtitiis, sa mga paghihirap, sa mga kagipitan, at sa mga gipit na kalagayan,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa bawat paraan.” Malawak ang pariralang Griyego at maaaring tumukoy sa bawat kalagayan o sa bawat paraan ng kanilang pagpapakita kung sino sila.
    reason: lexical_alternative
  - marker: b
    text: O “mga tagapaglingkod ng Diyos.” Binibigyang-diin ng salitang Griyego ang paglilingkod, hindi kinakailangang isang pormal na katungkulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ngunit
  rationale: Ipinakikita nito ang pagsalungat sa naunang negatibong pahayag at ang paglipat sa positibong paglalarawan ng kanilang paglilingkod.
- source_word: ἐν παντί
  choice: sa lahat ng bagay
  rationale: Pinananatili nito ang malawak na saklaw ng parirala, na maaaring tumukoy sa bawat kalagayan o sa bawat paraan ng kanilang pagpapakilala bilang mga lingkod ng Diyos.
- source_word: συνιστάνοντες ἑαυτούς
  choice: ipinakikita naming kami ay
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa pagpapakita o pagpapatunay sa pamamagitan ng asal at pagtitiis. Natural ito sa modernong Filipino at hindi nagpapahiwatig ng pagyayabang.
- source_word: ὡς θεοῦ διάκονοι
  choice: mga lingkod ng Diyos
  rationale: Binibigyang-diin ng διάκονοι ang paglilingkod. Ang “mga lingkod” ay malinaw at hindi nag-aangkat ng di-kinakailangang kahulugan ng pormal na katungkulan sa simbahan.
- source_word: ἐν ὑπομονῇ πολλῇ
  choice: sa matinding pagtitiis
  rationale: Ang ὑπομονή ay matatag na pananatili sa gitna ng pagsubok, hindi lamang payak na paghihintay. Inilalarawan ng “matinding” ang πολλῇ sa natural na Filipino.
- source_word: θλίψεσιν
  choice: sa mga paghihirap
  rationale: Ipinahahayag nito ang mga pagdurusa at mabibigat na panggigipit sa paraang madaling maunawaan.
- source_word: ἀνάγκαις
  choice: sa mga kagipitan
  rationale: Tumutukoy ito sa mapipilit at mahihirap na kalagayan, kaya ang “mga kagipitan” ay angkop at maikli.
- source_word: στενοχωρίαις
  choice: sa mga kalagayang tila wala nang malusutan
  rationale: Inihahatid nito ang larawan ng pagiging nasukol o walang mapuntahan, habang naihihiwalay ang salita sa naunang “mga kagipitan.”
theological_decisions:
- issue: Kahulugan ng διάκονοι sa konteksto ng ministeryo
  choice: mga lingkod ng Diyos
  alternative: mga tagapaglingkod ng Diyos; mga ministro ng Diyos
  rationale: Tinutukoy ng salita ang paglilingkod nila sa Diyos, hindi kinakailangang isang pormal na katungkulan. Ang “mga lingkod” ay likas, malinaw, at walang idinadagdag na institusyonal na kahulugan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang paulit-ulit na “sa” ng talaan sa Griyego, at ginawang malinaw ang natatanging larawan ng στενοχωρίαις nang hindi pinapantay sa naunang “mga kagipitan.”
