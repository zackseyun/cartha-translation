  - severity: low
    issue: Ang “pagtitiis” ay maaaring masaklaw ang endurance kaysa μακροθυμία.
    rationale: Ang μακροθυμία ay katangiang maging matiisin o mapagpahinuhod. Ang “pagiging matiisin” ay mas malinaw na tumutukoy sa disposisyong ito.
