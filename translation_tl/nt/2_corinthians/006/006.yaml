  naturalness: Natural at marangal ang binagong listahan sa modernong Filipino Tagalog. Ang “kadalisayan,” “pagiging matiisin,” at “kabaitan” ay malinaw, karaniwan, at magkakatugma bilang mga katangiang inililista.
  terminology: Ang “Banal na Espiritu” ay ang malamang na pangunahing pagbasa at ang talababa ay angkop na nag-iingat ng alternatibong pagpapakahulugan. Ang “kabaitan” ay mas tuwirang katumbas ng χρηστότης kaysa “kabutihang-loob,” na maaari ring magpahiwatig lalo na ng pagkabukas-palad. Pinananatili ang “pag-ibig na walang pagkukunwari” para sa ἀγάπῃ ἀνυποκρίτῳ.
