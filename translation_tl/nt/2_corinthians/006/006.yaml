source:
  edition: SBLGNT
  text: ἐν ἁγνότητι, ἐν γνώσει, ἐν μακροθυμίᾳ, ἐν χρηστότητι, ἐν πνεύματι ἁγίῳ, ἐν ἀγάπῃ ἀνυποκρίτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/006.yaml
  text: in purity[a], in knowledge, in patience, in kindness, in the Holy Spirit, in sincere love,
translation:
  language: tl
  text: sa kadalisayan, sa kaalaman, sa pagiging matiisin, sa kabaitan, sa Banal na Espiritu[a], at sa pag-ibig na walang pagkukunwari,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa banal na espiritu,” kung tumutukoy ito sa isang banal na disposisyon sa halip na sa Banal na Espiritu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγνότητι
  choice: kalinisan ng pamumuhay
  rationale: Ipinahihiwatig ng ἁγνότης ang malawak na moral na kadalisayan. Ang pariralang ito ay natural sa modernong Tagalog at hindi nililimitahan ang diwa sa kalinisang seksuwal lamang.
- source_word: γνώσει
  choice: kaalaman
  rationale: Malawak at tuwirang katumbas ito ng γνῶσις, na maaaring tumukoy rito sa praktikal at espirituwal na pagkaunawa sa paglilingkod.
- source_word: μακροθυμίᾳ
  choice: pagtitiis
  rationale: Ipinahihiwatig ng μακροθυμία ang matiyagang pagbabata sa pakikitungo sa mga tao o sa gitna ng mga pagsubok; malinaw at karaniwan ang 'pagtitiis' sa Tagalog.
- source_word: χρηστότητι
  choice: kabutihang-loob
  rationale: Ipinapahayag ng χρηστότης ang mabait, mapagbigay, at mapagmagandang pakikitungo. Mas tiyak na naihahatid ng 'kabutihang-loob' ang relasyonal na diwa kaysa sa pangkalahatang 'kabutihan.'
- source_word: πνεύματι ἁγίῳ
  choice: Banal na Espiritu
  rationale: Sa gamit ni Pablo, malamang na tumutukoy ang parirala sa banal na Espiritu ng Diyos. Pinananatili sa talababa ang tunay na posibilidad na tumukoy ito sa banal na disposisyon ng tao.
- source_word: ἀγάπῃ ἀνυποκρίτῳ
  choice: pag-ibig na walang pagkukunwari
  rationale: Tuwirang ipinapahayag nito na ang pag-ibig ay hindi pakitang-tao o mapagkunwari, habang nananatiling natural at marangal sa Tagalog.
- source_word: ἐν
  choice: sa
  rationale: Ang paulit-ulit na 'sa' ay nagpapanatili sa retorikal na ritmo ng Griyego at maaari pa ring magpahiwatig ng paraan, kalagayan, o saklaw nang hindi pinipilit ang iisang kahulugan.
theological_decisions:
- issue: Ang tinutukoy ng πνεύματι ἁγίῳ
  choice: ang banal na Espiritu ng Diyos
  alternative: isang banal na espiritu o banal na disposisyon ng tao
  rationale: Mas malamang na ang Banal na Espiritu ang tinutukoy batay sa karaniwang gamit ni Pablo, ngunit hindi lubusang inaalis ng anyong Griyego at ng listahan ng mga katangian ang pagbasa na tumutukoy sa disposisyon ng tao. Kaya inilagay ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang magkakatulad na ayos ng listahan sa pamamagitan ng paulit-ulit na 'sa.' Ginamit ang 'kalinisan ng pamumuhay' upang linawin ang malawak na moral na saklaw ng ἁγνότης nang hindi ito pinaliliit sa seksuwal na kalinisan.
