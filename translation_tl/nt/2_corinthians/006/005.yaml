  text: ἐν πληγαῖς, ἐν φυλακαῖς, ἐν ἀκαταστασίαις, ἐν κόποις, ἐν ἀγρυπνίαις, ἐν νηστείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/005.yaml
  text: in beatings, in imprisonments, in riots, in labors, in sleepless nights, in fastings,
translation:
  language: tl
  text: sa mga pambubugbog, sa mga pagkabilanggo, sa mga kaguluhan, sa mga pagpapagal, sa mga gabing walang tulog, sa mga pag-aayuno,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληγαῖς
  choice: mga pambubugbog
  rationale: Tumutukoy sa mga pisikal na paghampas o pananakit na dinanas; natural at malinaw ito sa modernong Filipino.
- source_word: φυλακαῖς
  choice: mga pagkabilanggo
  rationale: Ipinahahayag ang kalagayan o mga pagkakataong nabilanggo, hindi lamang ang mga gusali ng bilangguan.
- source_word: ἀκαταστασίαις
  choice: mga kaguluhan
  rationale: Malawak ang saklaw ng salita—maaaring tumukoy sa mga gulo, ligalig, o kaguluhang panlipunan—kaya hindi ito nilimitahan sa tahasang mga riot.
- source_word: κόποις
  choice: mga pagpapagal
  rationale: Pinananatili ang diwa ng mabigat at nakapapagod na paggawa.
- source_word: ἀγρυπνίαις
  choice: mga gabing walang tulog
  rationale: Natural na Filipino para sa mga panahon ng pagpupuyat o kawalan ng tulog.
- source_word: νηστείαις
  choice: mga pag-aayuno
  rationale: Direktang katumbas na nagpapanatili sa posibleng kahulugang kusang pag-aayuno, bagaman maaari ring tumukoy sa kawalan ng pagkain ayon sa konteksto.
theological_decisions:
- issue: Kahulugan ng νηστείαις
  choice: mga pag-aayuno
  alternative: mga panahong walang pagkain
  rationale: Pinili ang karaniwang kahulugan ng salita nang hindi ipinapaliwanag kung kusang gawaing panrelihiyon o sapilitang pagkagutom; nananatili ang posibleng tensiyon sa konteksto.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Pinanatili ang sunod-sunod na pariralang “sa mga” upang maipakita ang retorikal na ayos ng Griyego at ang ugnayan nito sa naunang talata.
