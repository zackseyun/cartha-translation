review_pass:
  verdict: revise
  source_fidelity: 'Ang diwa at lahat ng pangunahing elemento ng Griyego ay nasa draft: inferensiyang «Kaya,» ang utos na lumabas mula sa pangkat, ang panawagang maging hiwalay, ang pormulang «sabi ng Panginoon,» ang pagbabawal na humipo ng marumi, at ang pangakong tatanggapin sila. Gayunman, ang «humiwalay kayo» ay mas aktibo kaysa sa anyong passive/state na ἀφορίσθητε. Ang «maging hiwalay kayo» ay mas tapat nang hindi nagiging di-natural.'
  naturalness: Marangal at malinaw ang register. Mas natural ang «mula sa kanilang gitna» kaysa «mula sa gitna nila» sa ganitong propetikong pahayag. Ang «anumang maruming bagay» ay nagbibigay sa Tagalog ng likas na substantibong layon para sa ἀκαθάρτου, nang hindi itinuturing na isang tiyak na bagay ang tinutukoy.
  terminology: Ang «Panginoon,» «marumi,» at «tatanggapin ko kayo» ay angkop at tapat sa κύριος, ἀκάθαρτος, at εἰσδέξομαι. Pinananatili ang neutral na saklaw ng utos at hindi ipinapasok ang sektaryano o denominasyonal na aplikasyon.
  issues:
  - severity: medium
    issue: Ang «humiwalay kayo» ay aktibong pandiwa para sa ἀφορίσθητε.
    rationale: Ang Griyego ay passive imperative at higit na tumutukoy sa pagiging/kalagayang hiwalay o ibinukod. Ang «maging hiwalay kayo» ay mas malapit sa gramatikal at semantikong puwersa nito.
  - severity: low
    issue: Ang «mula sa gitna nila» ay medyo hindi gaanong natural kaysa «mula sa kanilang gitna.»
    rationale: Pareho itong nauunawaan, ngunit ang rebisyon ay mas idiomatiko sa modernong Filipino habang pinananatili ang ἐκ μέσου αὐτῶν.
  - severity: low
    issue: Ang «anumang marumi» ay maaaring tumunog na kulang bilang layon ng «hipuin.»
    rationale: Bagaman substantibo ang gamit sa Griyego, mas malinaw sa Tagalog ang «anumang maruming bagay.» Hindi ito nagdaragdag ng espesipikong referent; ipinahahayag lamang nito ang implicit na neuter substantive.
  revised_text: Kaya, lumabas kayo mula sa kanilang gitna at maging hiwalay kayo, sabi ng Panginoon. Huwag ninyong hipuin ang anumang maruming bagay[b][c], at tatanggapin ko kayo.
