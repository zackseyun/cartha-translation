- from: Kaya lumabas kayo mula sa gitna nila at humiwalay kayo[a], sabi ng Panginoon. Huwag ninyong hipuin ang anumang marumi[b][c], at tatanggapin ko kayo.
  to: Kaya, lumabas kayo mula sa kanilang gitna at maging hiwalay kayo, sabi ng Panginoon. Huwag ninyong hipuin ang anumang maruming bagay[b][c], at tatanggapin ko kayo.
  rationale: Iniaayos ng rebisyon ang pangunahing pagkakaiba sa voice/aspekto ng ἀφορίσθητε sa pamamagitan ng «maging hiwalay kayo.» Pinabuti rin nito ang idiomatikong Tagalog ng pariralang «mula sa kanilang gitna» at nilinaw ang substantibong «maruming bagay.» Inilipat ang marker a sa aktuwal na salitang «maging hiwalay kayo» upang tumugma ang footnote anchor sa lexical alternative nito. Walang binagong kahulugan o idinagdag na interpretasyong teolohikal.
