  text: διὸ ἐξέλθατε ἐκ μέσου αὐτῶν, καὶ ἀφορίσθητε, λέγει κύριος, καὶ ἀκαθάρτου μὴ ἅπτεσθε· κἀγὼ εἰσδέξομαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/017.yaml
  text: Therefore[a], come out from among them and be separate, says the Lord, and do not touch what is unclean[c][b]; and I will receive you.
translation:
  language: tl
  text: Kaya, lumabas kayo mula sa kanilang gitna at maging hiwalay kayo, sabi ng Panginoon. Huwag ninyong hipuin ang anumang maruming bagay[b][c], at tatanggapin ko kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Maaari ring “huwag ninyong hipuin ang anumang marumi.”
    reason: lexical_alternative
  - marker: c
    text: Umuugnay rito ang wikang propetiko ng Lumang Tipan, lalo na ang Isaias 52:11.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: Kaya
  rationale: Ipinahahayag nito ang kongklusyon mula sa naunang pangangatwiran at likas itong pakinggan sa modernong Tagalog.
- source_word: ἐξέλθατε ἐκ μέσου αὐτῶν
  choice: lumabas kayo mula sa gitna nila
  rationale: Pinananatili ang mariing pautos at ang larawan ng pag-alis mula sa kinapapalooban ng isang pangkat.
- source_word: ἀφορίσθητε
  choice: humiwalay kayo
  rationale: Natural na pautos sa Tagalog na naghahayag ng hinihinging pagkakahiwalay; hindi nito nililimitahan ang diwa sa isang partikular na sektaryanong aplikasyon.
- source_word: λέγει κύριος
  choice: sabi ng Panginoon
  rationale: Likas na pormulang propetiko sa Tagalog at tapat sa κύριος nang hindi ipinapalit ang anyong PANGINOON.
- source_word: ἀκαθάρτου μὴ ἅπτεσθε
  choice: Huwag ninyong hipuin ang anumang marumi
  rationale: Pinananatili ang larawang kaugnay ng kalinisan at paghihiwalay; ipinahihiwatig ng 'anumang marumi' ang substantibong gamit ng neuter adjective nang hindi tumutukoy sa isang tiyak na bagay.
- source_word: κἀγὼ εἰσδέξομαι ὑμᾶς
  choice: at tatanggapin ko kayo
  rationale: Pinananatili ang panghinaharap na mabuting pagtanggap ng nagsasalita at ang tuwirang ugnayan ng pangako sa mga pautos.
theological_decisions:
- issue: Pagbibigay-kahulugan sa κύριος sa siping may kontekstong Lumang Tipan
  choice: Panginoon
  alternative: Yahweh / PANGINOON
  rationale: Ang tekstong Griyego ng Bagong Tipan ay may κύριος. Ang 'Panginoon' ay tapat dito at hindi nag-aangkat ng ibang anyong wala sa mismong teksto.
- issue: Saklaw ng utos na ἀφορίσθητε
  choice: humiwalay kayo
  alternative: italaga kayo / ibukod ninyo ang inyong sarili
  rationale: Pinananatili nito ang utos na maging hiwalay nang hindi dinaragdagan ang talata ng ganap na paglayo sa lahat ng tagalabas o ng isang partikular na doktrinang sektaryano.
- issue: Bagay na tinutukoy ng ἀκαθάρτου
  choice: anumang marumi
  alternative: ang maruming bagay
  rationale: Hindi tinutukoy ng Griyego ang isang espesipikong bagay. Pinananatili ng salin ang pangkalahatang kategorya at ang kaugnayan nito sa wikang propetiko tungkol sa karumihan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang pangmaramihang 'kayo/ninyo' upang malinaw ang mga pautos. Ang bahagyang pormal na 'hipuin' at 'tatanggapin' ay angkop sa propetikong sipi at nananatiling malinaw sa karaniwang mambabasa.
