base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/015.yaml
  text: And what harmony is there between Messiah and Beliar? Or what share does a believer have with an unbeliever?[a]
translation:
  language: tl
  text: At anong pagkakasundo mayroon sa pagitan ng Mesiyas at ni Beliar? O anong bahagi ang mayroon ang isang sumasampalataya kasama ng isang hindi sumasampalataya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Beliar: Griyego Βελιάρ; ginagamit sa maraming salin ang alternatibong anyong “Belial.”'
    reason: alternative_reading
lexical_decisions:
- source_word: συμφώνησις
  choice: pagkakasundo
  rationale: Tumutukoy ito sa pagkakatugma o pagiging magkaayon. Likas at marangal sa Filipino ang “pagkakasundo” sa retorikal na paghahambing.
- source_word: Χριστοῦ
  choice: ang Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulo sa tuwirang pagtutunggali kay Beliar, kaya “ang Mesiyas” ang nagpapanatili sa titular na diwa.
- source_word: Βελιάρ
  choice: si Beliar
  rationale: Pangalan itong isinalin sa baybay ayon sa anyong Griyego na Βελιάρ; nilagyan ng “si” ayon sa natural na balarilang Filipino.
- source_word: μερίς
  choice: bahaging magk مشترong taglay
  rationale: Ang μερίς ay bahagi o kaparte na maaaring taglayin nang magk مشترong; inilalahad ng parirala ang diwa ng pakikibahagi nang hindi ipinapalagay na literal na pagmamay-ari lamang.
- source_word: πιστῷ
  choice: isang sumasampalataya
  rationale: Pang-uri itong ginamit bilang pangngalan para sa taong nananampalataya; malinaw at karaniwan ang “isang sumasampalataya.”
- source_word: ἀπίστου
  choice: isang hindi sumasampalataya
  rationale: Sa tuwirang kaibahan sa πιστός, tumutukoy ito sa taong hindi nananampalataya; iniiwasan ng saling ito ang posibleng ibang diwa ng “taksil” o “di-tapat.”
- source_word: πρὸς
  choice: at
  rationale: Sa konstruksiyong may συμφώνησις, natural sa Filipino ang pag-uugnay ng dalawang panig sa pamamagitan ng “at.”
- source_word: μετὰ
  choice: at
  rationale: Ipinahahayag ang ugnayan ng dalawang panig sa idyomatikong tanong na “anong bahaging magk مشترong taglay ng X at ng Y?”
- source_word: δὲ
  choice: At
  rationale: Ipinagpapatuloy nito ang sunod-sunod na retorikal na mga tanong nang hindi nagpapalabis ng pagsalungat.
theological_decisions:
- issue: Pagkasalin sa Χριστός
  choice: ang Mesiyas
  alternative: si Cristo
  rationale: Titular ang gamit sa antitesis kay Beliar. Pinananatili ng “Mesiyas” ang kahulugan ng titulo sa halip na tratuhin lamang itong pangalang pantangi.
- issue: Pagkakakilanlan kay Βελιάρ
  choice: Beliar bilang pangalang pantangi
  alternative: Belial
  rationale: Direktang sinusundan ang anyong Griyego nang hindi nagdaragdag sa pangunahing teksto ng paliwanag tungkol sa pagkakakilanlan nito. Itinatala sa talababa ang mas kilalang alternatibong anyo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang magkatugmang anyo ng dalawang retorikal na tanong at iniwasan ang pagdaragdag ng denominasyonal na paliwanag.
