  text: ὡς λυπούμενοι ἀεὶ δὲ χαίροντες, ὡς πτωχοὶ πολλοὺς δὲ πλουτίζοντες, ὡς μηδὲν ἔχοντες καὶ πάντα κατέχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/010.yaml
  text: as sorrowful[a], yet always rejoicing; as poor, yet making many rich; as having nothing[b], and yet possessing everything.
translation:
  language: tl
  text: na parang nalulungkot, ngunit laging nagagalak; na parang dukha, ngunit nagpapayaman sa marami[a]; na parang walang anuman, gayunma’y taglay ang lahat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ginagawang mayaman ang marami.” Hindi tahasang sinasabi ng Griyego kung materyal o espirituwal ang yaman.
    reason: lexical_alternative
  - marker: b
    text: Ang “taglay” ay maaari ring isaling “may hawak” o “may pag-aari.” Hindi nililinaw ng Griyego sa talatang ito kung sa anong paraan taglay nila ang lahat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: na parang
  rationale: 'Pinananatili ang tatlong ulit na paghahambing ni Pablo: ganito ang anyo o tingin sa kanila, ngunit may kasunod na kabalintunaang katotohanan.'
- source_word: λυπούμενοι
  choice: nalulungkot
  rationale: Natural na salin ng patuloy na kalagayan ng pagdadalamhati nang hindi tinutukoy kung sino o ano ang sanhi nito.
- source_word: ἀεὶ δὲ χαίροντες
  choice: ngunit laging nagagalak
  rationale: Ipinahahayag ng “ngunit” ang mariing pagsalungat, samantalang pinananatili ng “laging nagagalak” ang patuloy at aktibong diwa ng Griyego.
- source_word: πτωχοὶ
  choice: dukha
  rationale: Tuwirang tumutukoy sa kahirapan at angkop sa marangal ngunit madaling maunawaang rehistro; hindi nito pinalalabis ang diwa tungo sa ganap na kasalatan.
- source_word: πολλοὺς δὲ πλουτίζοντες
  choice: ngunit nagpapayaman sa marami
  rationale: Pinananatili ang sanhiang diwa ng pandiwa—ginagawang mayaman ang marami—nang hindi ipinapasya sa pangunahing teksto kung materyal o espirituwal ang yaman.
- source_word: μηδὲν ἔχοντες
  choice: walang anuman
  rationale: Maikli at likas na Filipino para sa panlabas na kawalan, at mahusay na katapat ng kasunod na pag-angking taglay nila ang lahat.
- source_word: καὶ πάντα κατέχοντες
  choice: gayunma’y taglay ang lahat
  rationale: Ang “gayunma’y” ay inilalantad ang kabalintunaan ng simpleng καί sa konteksto; ang “taglay” ay nagpapahayag ng tunay na pag-aangkin o pagmamay-ari nang hindi nagiging mekanikal ang salin.
theological_decisions:
- issue: Ang uri ng yaman at pag-aari sa mga kabalintunaan ni Pablo
  choice: Hindi tahasang tinukoy sa pangunahing teksto kung espirituwal o materyal ang yaman at pag-aari.
  alternative: Isaling “nagpapayaman sa marami sa espirituwal na paraan” at “taglay ang lahat kay Cristo.”
  rationale: Bagaman malakas na ipinahihiwatig ng konteksto ang espirituwal na pagpapayaman at ang mas malalim na pag-aari kay Cristo, walang tahasang panuring na ganito sa Griyego. Pinananatili ng salin ang saklaw at teolohikal na tensiyon ng orihinal.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang tatlong magkakatulad na pariralang “na parang” at ang matitingkad na pagsalungat upang marinig ang maikli at maindayog na talaan ng mga kabalintunaan sa Griyego.
