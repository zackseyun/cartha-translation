lexical_decisions:
- source_word: λόγῳ ἀληθείας
  choice: salita ng katotohanan
  rationale: 'Pinananatili nito ang anyo at lawak ng parirala sa Griyego: maaari itong tumukoy sa tapat na pananalita o sa mensahe ng katotohanan.'
- source_word: δυνάμει θεοῦ
  choice: kapangyarihan ng Diyos
  rationale: Tuwirang salin ng pariralang henitibo at kaagapay ng naunang pariralang may ἐν.
- source_word: διὰ
  choice: sa pamamagitan ng
  rationale: Ang διά na may henitibo ay nagpapahayag ng paraan o kasangkapan; malinaw itong naihahatid ng “sa pamamagitan ng.”
- source_word: ὅπλων
  choice: mga sandata
  rationale: Saklaw ng ὅπλα ang mga kagamitang pandigma, panlaban man o pananggalang; mas malawak at malinaw ang “mga sandata” kaysa “baluti.”
- source_word: δικαιοσύνης
  choice: katuwiran
  rationale: Ang “katuwiran” ang natural at malawak na katumbas sa kontekstong Paulino, nang hindi nililimitahan ang diwa sa legal o panlipunang katarungan lamang.
- source_word: τῶν δεξιῶν καὶ ἀριστερῶν
  choice: sa kanan at sa kaliwang kamay
  rationale: Substantibo ang gamit ng mga pang-uri sa Griyego at ipinahihiwatig ang kanan at kaliwang kamay. Nililinaw ng salin ang larawang pandigma habang inilalagay sa talababa ang mas literal na posibilidad na “sa kanan at sa kaliwa.”
theological_decisions:
- issue: Kahulugan ng δικαιοσύνη sa pariralang Paulino
  choice: katuwiran
  alternative: katarungan
  rationale: Pinananatili ng “katuwiran” ang malawak na moral at teolohikal na saklaw ng salita; inilalahad ang “katarungan” bilang tunay na leksikal na alternatibo nang hindi ipinipilit ang mas makitid na pagbasa.
- issue: Larawan ng mga sandata sa kanan at kaliwa
  choice: sa kanan at sa kaliwang kamay
  alternative: sa kanan at sa kaliwa
  rationale: Malamang na mga sandatang ginagamit ng dalawang kamay ang larawan, marahil para sa ganap na kahandaan sa pagsalakay at pagtatanggol. Gayunman, hindi tahasang binabanggit sa Griyego ang “kamay,” kaya pinananatili sa talababa ang mas literal na anyo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang magkahanay na mga parirala at ang larawang pandigma, habang nilinaw lamang ang ipinahihiwatig na “kamay.”
