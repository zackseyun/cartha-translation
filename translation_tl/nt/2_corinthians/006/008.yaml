translation:
  language: tl
  text: sa gitna ng karangalan at kawalang-dangal[a], sa gitna ng paninirang-puri at papuri[b]; itinuturing na mga mandaraya, gayunma’y matatapat[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaluwalhatian at kawalang-dangal.” Ang salitang Griyego para sa “karangalan” ay maaari ring mangahulugang “kaluwalhatian,” ngunit dito ay malamang na tumutukoy sa pampublikong pagkilala.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “masamang ulat at mabuting ulat.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “gaya ng mga mandaraya at matatapat.” Ikinokontra ng pananalita ang pagtingin ng iba kina Pablo at sa kaniyang mga kamanggagawa sa kung ano talaga sila.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ
  choice: sa gitna ng
  rationale: Sa magkatambal na mga pangngalang tumutukoy sa kalagayang dinaranas sa paglilingkod, ipinahihiwatig ng διά ang mga sitwasyong pinagdaraanan. Likas sa Filipino ang “sa gitna ng,” at napananatili rin ang pag-uulit ng parirala.
- source_word: δόξης
  choice: karangalan
  rationale: Kabaligtaran ito ng ἀτιμία at tumutukoy rito sa pampublikong pagtingin o pagkilala, hindi pangunahing sa teolohikal na diwa ng kaluwalhatian.
- source_word: ἀτιμίας
  choice: kawalang-dangal
  rationale: Direkta at balanseng katapat ng “karangalan,” at pinananatili ang panlipunan at pampublikong diwa ng salita.
- source_word: δυσφημίας
  choice: paninirang-puri
  rationale: Malinaw nitong ipinahahayag ang mapanirang pagsasalita o masamang reputasyong ipinapataw sa mga lingkod, habang nananatiling matalim ang kaibahan sa εὐφημία.
- source_word: εὐφημίας
  choice: papuri
  rationale: Natural at maikli itong katapat ng “paninirang-puri,” bagaman maaari ring tumukoy ang Griyego sa mabuting ulat o mabuting reputasyon.
- source_word: ὡς
  choice: itinuturing na
  rationale: Ginagawang malinaw na ang pagiging “mga mandaraya” ay pagtingin o paratang ng iba, hindi pag-amin ni Pablo tungkol sa tunay nilang pagkatao.
- source_word: πλάνοι
  choice: mga mandaraya
  rationale: Sa konteksto, tumutukoy ito sa paratang na inililigaw o nililinlang nila ang iba, hindi lamang sa literal na paglalagalag.
- source_word: ἀληθεῖς
  choice: matatapat
  rationale: Natural itong ilapat sa mga tao at malinaw na ikinokontra sa “mga mandaraya.” Nananatili rito ang diwa ng pagiging totoo, mapagkakatiwalaan, o tunay.
theological_decisions:
- issue: Kung dapat bang gawing hayag na ang huling pares ay naghahambing sa tingin ng iba at sa tunay na kalagayan nina Pablo
  choice: “itinuturing na mga mandaraya, gayunma’y matatapat”
  alternative: “gaya ng mga mandaraya ngunit mga totoo”
  rationale: Ipinahihiwatig ng ὡς at ng retorikal na pagkakasunod-sunod na paratang lamang ang “mga mandaraya,” samantalang ang “matatapat” ang ipinapahayag na realidad. Nililinaw ito nang hindi inaalis ang tensiyon ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang magkatimbang na mga pares at ang retorikal na pag-uulit, habang iniwasan ang labis na teknikal o makadenominasyong pananalita.
