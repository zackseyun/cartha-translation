base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/001.yaml
  text: Working together with him[a], we also urge you not to receive the grace of God in vain.
translation:
  language: tl
  text: Bilang mga nakikipagtulungan sa Diyos[a], hinihimok din namin kayo na huwag ninyong tanggapin nang walang kabuluhan ang biyaya ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bilang mga kamanggagawa, hinihimok din namin kayo.” Maaaring isalin ang pandiwaring Griyego nang hindi tahasang sinasabi kung sino ang kanilang katuwang, bagaman mariing ipinahihiwatig ng konteksto na ito ay ang Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: Συνεργοῦντες
  choice: Bilang mga nakikipagtulungan sa Diyos
  rationale: Pinananatili nito ang kilos ng pandiwaring Griyego. Walang tahasang layon sa parirala, ngunit ipinahihiwatig ng konteksto sa 5:18–20 na ang Diyos ang katuwang; nilinaw ito sa teksto at itinabi sa talababa ang tunay na ambiguwidad.
- source_word: δὲ
  choice: —
  rationale: Mahinang pang-ugnay o pananda ng pagpapatuloy ito rito, kaya likas na isinama sa daloy ng pangungusap sa halip na tumbasan ng tahasang “ngunit” o “at.”
- source_word: καὶ
  choice: din
  rationale: Ipinahahayag nito ang pagdaragdag ng paghihimok sa pakikipagtulungan.
- source_word: παρακαλοῦμεν
  choice: hinihimok namin
  rationale: Ipinapakita ng “hinihimok” ang taimtim at mariing pakiusap nang hindi nagiging lipas o labis na teknikal.
- source_word: μὴ
  choice: huwag
  rationale: Karaniwang negatibong anyo ito para sa infinitibong nakasalalay sa pandiwa ng paghihimok.
- source_word: εἰς κενὸν
  choice: nang walang kabuluhan
  rationale: Ipinahahayag ng idyoma ang pagtanggap na hindi nagbubunga o nauuwi sa wala, habang pinananatili ang retorikal na diin.
- source_word: χάριν
  choice: biyaya
  rationale: Ang “biyaya” ang natural at teolohikal na matimbang na salin ng χάρις sa kontekstong Paulino.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Direktang pinananatili ang anyong henitibo bilang “biyaya ng Diyos.”
- source_word: δέξασθαι
  choice: tanggapin
  rationale: Likas at tuwirang katumbas ito ng pagtanggap o pagtanggap nang bukal sa ipinagkakaloob.
- source_word: ὑμᾶς
  choice: kayo / ninyong
  rationale: Ang pangmaramihang ikalawang panauhan ang layon ng paghihimok at lohikal na gumaganap sa nakasalalay na sugnay; kaya natural sa Filipino ang “kayo na huwag ninyong tanggapin.”
theological_decisions:
- issue: Hindi tahasang binanggit na katuwang ng mga apostol
  choice: Ginawang tahasan sa pangunahing teksto na Diyos ang kanilang katuwang.
  alternative: “Bilang mga kamanggagawa” o “Sa pakikipagtulungan,” na hindi tinutukoy kung sino ang katuwang.
  rationale: Ang naunang konteksto ay nakatuon sa gawa ng Diyos sa pakikipagkasundo at sa tungkulin ng mga apostol bilang mga sugo niya. Gayunman, dahil walang tahasang layon ang συνεργοῦντες, pinananatili sa talababa ang alternatibong saling hindi nagpapangalan sa katuwang.
- issue: Pagtanggap sa biyaya “nang walang kabuluhan”
  choice: Pinanatili ang tensiyong ipinahihiwatig na maaaring hindi magbunga ang pagtanggap sa biyaya.
  alternative: Ipaliwanag ito bilang pagtanggi, pagkawala ng kaligtasan, o kawalan ng pagbabago sa buhay.
  rationale: Hindi nililinaw ng talata mismo ang eksaktong teolohikal na mekanismo. Kaya hindi idinagdag sa salin ang isang partikular na doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hinihimok” at “biyaya” upang mapanatili ang bigat ng panawagan at teolohikal na bokabularyo, habang nananatiling madaling maunawaan. Ang “nang walang kabuluhan” ay natural na idyomatikong salin na hindi labis na nagpapaliwanag.
