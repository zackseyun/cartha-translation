id: 2CO.6.14
reference: 2 Corinthians 6:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μὴ γίνεσθε ἑτεροζυγοῦντες ἀπίστοις· τίς γὰρ μετοχὴ δικαιοσύνῃ καὶ ἀνομίᾳ, ⸂ἢ τίς⸃ κοινωνία φωτὶ πρὸς σκότος;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/014.yaml
  text: Do not become unequally yoked with unbelievers[b][a]. For what partnership has righteousness with lawlessness? Or what fellowship has light with darkness?
translation:
  language: tl
  text: Huwag kayong makipamatok nang hindi magkatugma sa mga hindi sumasampalataya. Sapagkat ano nga ba ang pakikibahagi ng katuwiran[a] sa paglabag sa kautusan? O ano ang pakikisama ng liwanag sa kadiliman?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katarungan” ang katuwiran (δικαιοσύνη).
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: Huwag kayong
  rationale: Likas na ipinahahayag sa Filipino ang nagbabawal na προστακτική gamit ang “Huwag kayong.” Hindi na hiwalay na isinalin ang aspektong “maging” ng γίνεσθε sapagkat magiging pilit ang parirala kapag isinama sa talinghaga ng pamatok.
- source_word: ἑτεροζυγοῦντες
  choice: makipamatok
  rationale: Pinananatili nito ang larawang agrikultural ng dalawang nilalang na pinagsasama sa isang pamatok. Ipinaliliwanag sa talababa ang di-pagkakatugma na likas sa ἑτεροζυγέω.
- source_word: ἀπίστοις
  choice: sa mga hindi sumasampalataya
  rationale: Malinaw at karaniwang modernong Filipino para sa mga taong walang pananampalataya o hindi naniniwala sa kontekstong ito.
- source_word: μετοχὴ
  choice: pakikibahagi
  rationale: Ipinahahayag ang pagkakaroon ng bahagi o pakikilahok na magkasama, habang nananatiling naiiba sa κοινωνία sa kasunod na tanong.
- source_word: δικαιοσύνῃ
  choice: katuwiran
  rationale: Ang “katuwiran” ang pinakamalapit na malawak na katumbas sa kontekstong moral at panrelihiyon; pinananatili sa talababa ang posibleng “katarungan.”
- source_word: ἀνομίᾳ
  choice: pagsuway sa kautusan
  rationale: Mas malinaw sa ordinaryong mambabasa kaysa literal ngunit madaling mapagkamalang pampolitikang “kawalan ng batas,” at pinananatili ang diwa ng paglabag o di-pagkilala sa kautusan.
- source_word: κοινωνία
  choice: pakikisama
  rationale: Natural na Filipino para sa ugnayan at pakikibahaging magkasama; ang konteksto ang nagbibigay rito ng mas malalim na relasyonal na diwa.
- source_word: φωτὶ πρὸς σκότος
  choice: ng liwanag sa kadiliman
  rationale: Pinananatili ang malinaw na metaporikal na pagsalungat ng liwanag at kadiliman, at natural na ipinahahayag ang ugnayan gamit ang “sa.”
theological_decisions:
- issue: Saklaw ng δικαιοσύνη sa salungat na pares nito sa ἀνομία
  choice: katuwiran
  alternative: katarungan
  rationale: Sa moral at panrelihiyong paghahambing dito, mas malawak at angkop ang “katuwiran.” Gayunman, maaaring tumukoy rin ang salita sa “katarungan,” kaya hindi inaalis ang kahulugang iyon at inilalagay ito sa talababa.
- issue: Lawak ng ipinagbabawal na pakikipamatok
  choice: Hindi tinukoy sa salin ang isang natatanging uri ng relasyon
  alternative: Tukuyin ito bilang pag-aasawa o isang partikular na pakikipagsosyo
  rationale: Hindi tahasang pinangalanan ng Griyegong talata ang pag-aasawa, negosyo, o ibang tiyak na kaayusan. Pinananatili ng salin ang talinghaga at ang lawak ng orihinal sa halip na magpasok ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago at madaling maunawaang Filipino, ngunit pinananatili ang marangal na himig at ang magkakaparis na retorikal na tanong. Ang “makipamatok” ay sadyang pinanatili bilang talinghaga at nilinaw sa talababa; iniwasan ang makitid na aplikasyon na wala mismo sa talata.
