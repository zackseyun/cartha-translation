    reason: cross_reference
  revision_rationale: Idinagdag ang “nang hindi magkatugma” upang isalin sa pangunahing teksto ang di-pagkakatugmang ipinahihiwatig ng ἑτεροζυγοῦντες, habang pinananatili ang bukas na saklaw ng metapora. Pinalitan ang “pagsuway sa kautusan” ng “paglabag sa kautusan” para sa mas tuwiran at natural na nominal na katapat ng ἀνομία. Iningatan ang ambiguity ng talata at hindi ito ikinulong sa pag-aasawa, negosyo, o iba pang tiyak na relasyon.
