translation:
  language: tl
  text: Sa anumang bagay, hindi kami nagbibigay ni anumang dahilan para sa pagkatisod[a], upang hindi mapintasan ang ministeryo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi kami nagiging sanhi ng pagkatisod sa anumang paraan.”
    reason: lexical_alternative
  - marker: b
    text: O “upang hindi masiraan ng dangal ang ministeryo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεμίαν ἐν μηδενὶ
  choice: anumang ... ang sinuman
  rationale: Pinagsasama ng salin ang dalawang negatibong parirala sa isang likas na pangungusap sa Tagalog, habang pinananatili ang saklaw na walang anumang pagkakataon o kalagayan na dapat maging sanhi ng pagkatisod.
- source_word: διδόντες
  choice: nagbibigay
  rationale: Tuwirang tinutumbasan ang participle at natural na kaugnay ng pariralang “dahilan para matisod.” Ipinahihiwatig ng “kami” ang paksa mula sa konteksto.
- source_word: προσκοπήν
  choice: dahilan para matisod
  rationale: Pinananatili nito ang metapora ng pagkatisod at ipinakikitang ang tinutukoy ay isang sanhi o pagkakataong humahadlang, hindi lamang ang damdaming nasaktan.
- source_word: ἵνα μὴ
  choice: upang hindi
  rationale: Malinaw at likas na ipinahahayag ang layunin o inaasahang bunga ng sugnay.
- source_word: μωμηθῇ
  choice: mapintasan
  rationale: Ang passive na “mapintasan” ay natural na Tagalog para sa mapulaan o mahanapan ng mali, at hindi nito labis na nililimitahan ang kahulugan sa simpleng pagsisi.
- source_word: ἡ διακονία
  choice: ang ministeryo
  rationale: Sa konteksto, tumutukoy ito sa paglilingkod na ipinagkatiwala kina Pablo at sa kaniyang mga kamanggagawa. Karaniwan at nauunawaan ang “ministeryo” nang hindi kinakailangang tumukoy sa isang kalaunang opisyal na katungkulan.
theological_decisions:
- issue: Saklaw ng διακονία sa paglalarawan ni Pablo sa kanilang gawain
  choice: “ang ministeryo,” na tumutukoy sa apostolikong paglilingkod nina Pablo at ng kaniyang mga kamanggagawa
  alternative: “ang paglilingkod,” sa mas malawak at di-teknikal na diwa
  rationale: Ang konteksto ay tungkol sa asal nila bilang mga lingkod ng Diyos sa pagtupad ng ipinagkatiwalang gawain. Pinananatili ng “ministeryo” ang kontekstuwal na diwa nang hindi nag-aangkat ng tiyak na estruktura ng katungkulan sa simbahan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “matisod” upang mapanatili ang metapora ng προσκοπή, at “mapintasan” bilang likas na passive na katumbas ng μωμηθῇ.
