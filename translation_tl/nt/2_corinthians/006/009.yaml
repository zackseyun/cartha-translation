language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς ἀγνοούμενοι καὶ ἐπιγινωσκόμενοι, ὡς ἀποθνῄσκοντες καὶ ἰδοὺ ζῶμεν, ὡς παιδευόμενοι καὶ μὴ θανατούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/009.yaml
  text: as unknown and yet well known[a], as dying and behold, we live, as disciplined and not put to death[b],
translation:
  language: tl
  text: na parang hindi kilala, ngunit lubos na kinikilala[a]; na parang namamatay, ngunit narito, nabubuhay kami; na parang dinidisiplina[b], ngunit hindi pinapatay;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kinikilala.” Maaaring idiin ng Griyego ang lubos na pagkilala sa kanila, hindi lamang ang pagiging bantog.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “itinutuwid” o “sinasanay.” Ang salitang Griyego ay maaaring tumukoy sa pagdidisiplinang naglalayong magtuwid o sa paghubog sa pamamagitan ng pagsasanay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: na parang
  rationale: Pinananatili ang paulit-ulit na balangkas ng mga kabalintunaan at natural itong pakinggan sa makabagong Tagalog.
- source_word: ἀγνοούμενοι
  choice: mga di-kilala
  rationale: Ipinahahayag ang kalagayang hindi kilala o hindi kinikilala ng iba, at maikli itong katapat ng kasunod na parirala.
- source_word: ἐπιγινωσκόμενοι
  choice: kinikilalang lubos
  rationale: Pinananatili ang diwa ng pagkilala o ganap na pagkilala, sa halip na limitahan ito sa pagiging tanyag lamang.
- source_word: ἀποθνῄσκοντες
  choice: namamatay
  rationale: Inilalarawan ang patuloy na anyo o kalagayan ng pagiging nasa bingit ng kamatayan at pinananatili ang matalim na pagsalungat sa ‘nabubuhay kami.’
- source_word: ἰδοὺ
  choice: narito
  rationale: Nagbibigay ng biglaang pantawag-pansin na marangal ngunit nauunawaan sa kasalukuyang Tagalog.
- source_word: ζῶμεν
  choice: nabubuhay kami
  rationale: Tuwirang ipinahahayag ang kasalukuyang buhay at pinananatili ang unang panauhang maramihan ng Griyego.
- source_word: παιδευόμενοι
  choice: dinidisiplina
  rationale: Maaaring tumukoy sa pagtutuwid o paghubog; hindi nito ipinipilit kung ang diin ay parusa o pagsasanay.
- source_word: μὴ θανατούμενοι
  choice: hindi pinapatay
  rationale: Pinananatili ang balintiyak na anyo at ang pagkakaiba nito sa naunang ‘namamatay.’
theological_decisions:
- issue: Kahulugan ng παιδευόμενοι kaugnay ng pagdurusa
  choice: dinidisiplina
  alternative: pinarurusahan; sinasanay; itinutuwid
  rationale: Pinananatili nito ang posibilidad ng mapagtuwid o mapaghubog na pagdidisiplina nang hindi ipinapasiyang tiyak na kaparusahan mula sa Diyos ang pagdurusa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang tatlong magkakatulad na pariralang ‘na parang’ at ang maigsi, sunod-sunod na mga kabalintunaan ng Griyego.
