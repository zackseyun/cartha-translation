  text: Sapat na sa taong iyon ang parusang ito na ipinataw ng nakararami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sapat na sa taong iyon ang kaparusahang ito na ipinataw ng karamihan.”
    reason: Pinananatili ang leksikal na alternatibo para sa ἐπιτιμία (“kaparusahan”) at τῶν πλειόνων (“karamihan”), habang malinaw na ipinahahayag ang ahensiyang nasa ὑπό.
lexical_decisions:
- source_word: ἱκανὸν
  choice: Sapat na
  rationale: Likas at malinaw sa modernong Tagalog bilang panaguring nagsasaad na umabot na sa wastong sukat ang ginawang pagdidisiplina.
- source_word: τῷ τοιούτῳ
  choice: sa taong iyon
  rationale: Tumutukoy ito sa isang tiyak na nagkasala sa konteksto. Iniiwasan ng parirala ang di-likas na literal na 'sa gayong isa' habang pinananatili ang isahang personal na pagtukoy.
- source_word: ἡ ἐπιτιμία αὕτη
  choice: ang parusang ito
  rationale: Ang ἐπιτιμία ay isang kongkretong kaparusahang pandisiplina, hindi lamang berbal na pagsaway; malinaw itong naipahahayag ng 'parusa.'
- source_word: ἡ ὑπὸ τῶν πλειόνων
  choice: na ipinataw ng nakararami
  rationale: Ipinakikita ng 'ipinataw' ang ahensiya sa pasibong pariralang Griyego, at ang 'nakararami' ay likas na katumbas ng mas malaking bahagi o mayorya ng pangkat.
