  text: οἷς μὲν ὀσμὴ ⸀ἐκ θανάτου εἰς θάνατον, οἷς δὲ ὀσμὴ ⸁ἐκ ζωῆς εἰς ζωήν. καὶ πρὸς ταῦτα τίς ἱκανός;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/016.yaml
  text: To the one[a], a fragrance from death to death; to the other, a fragrance from life to life[c][b]. And who is sufficient for these things?
translation:
  language: tl
  text: Sa ilan, amoy ito[a] mula sa kamatayan tungo sa kamatayan; sa iba naman, amoy mula sa buhay tungo sa buhay.[b] At sino ang sapat para sa mga bagay na ito?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “samyo” o “halimuyak” sa dalawang paglitaw ng salitang ὀσμή.
    reason: lexical_alternative
  - marker: b
    text: Ang “mula sa kamatayan tungo sa kamatayan” at “mula sa buhay tungo sa buhay” ay maaaring magpahiwatig ng pinagmulan at hantungan—“nagmumula sa kamatayan at humahantong sa kamatayan” / “nagmumula sa buhay at humahantong sa buhay”—o maging isang mariing paglalarawan.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “may kakayahan” o “angkop” para sa “sapat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσμή
  choice: samyo
  rationale: Pinananatili ng “samyo” ang pandamang talinghaga at ang marangal na tono ng konteksto. Bagaman karaniwang kaaya-aya ang dating nito, ang epekto ng samyo ay tahasang nag-iiba ayon sa mga tumatanggap; inilalagay sa talababa ang mas neutral na “amoy.”
- source_word: ἐκ θανάτου εἰς θάνατον
  choice: mula sa kamatayan tungo sa kamatayan
  rationale: Pinananatili nito ang siksik na paralelismo ng Griyego at hindi ipinapasiya kung ang parirala ay tumutukoy sa pinagmulan at bunga o sa mariing paglalarawan.
- source_word: ἐκ ζωῆς εἰς ζωήν
  choice: mula sa buhay tungo sa buhay
  rationale: Tinutumbasan nito ang anyo ng naunang parirala upang mapanatili ang sinadyang simetriya at tunay na kalabuan ng teksto.
- source_word: πρὸς ταῦτα
  choice: para sa mga bagay na ito
  rationale: Ipinakikita nito ang pangmaramihang ταῦτα at inuugnay ang tanong sa mabibigat na bagay na kasasabi lamang ni Pablo.
- source_word: ἱκανός
  choice: may sapat na kakayahan
  rationale: Natural ito sa makabagong Tagalog at ipinahahayag ang pagiging sapat o karapat-dapat sa hinihinging gawain nang hindi ito nililimitahan sa teknikal na kasanayan lamang.
theological_decisions:
- issue: Diwa ng magkatambal na “mula sa kamatayan tungo sa kamatayan” at “mula sa buhay tungo sa buhay”
  choice: Panatilihin sa pangunahing teksto ang siksik at magkatimbang na anyo ng Griyego.
  alternative: “nagmumula sa kamatayan at humahantong sa kamatayan” / “nagmumula sa buhay at humahantong sa buhay,” o “samyo ng kamatayan” / “samyo ng buhay”
  rationale: Hindi tiyak na ipinapasiya ng talata kung pinagmulan at bunga, tumitinding paglalarawan, o epekto sa mga nakikinig ang pangunahing diin. Ang literal na paralelismo ang pinakamahusay na nagpapanatili sa teolohikal na tensiyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sa ilan … sa iba” bilang natural na katumbas ng magkatambal na οἷς μὲν … οἷς δὲ, habang pinanatili ang retorikal na paralelismo at pangwakas na tanong.
