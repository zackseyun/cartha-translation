  source_fidelity: Ang magkatambal na ἐκ ... εἰς ... ay naipapahayag nang tapat sa “mula sa ... tungo sa ...,” at napananatili ang sinadyang kalabuan ng mga parirala. Gayunman, ang “samyo” ay karaniwang nagsasaad ng kaaya-ayang amoy sa modernong Filipino, samantalang ang ὀσμή ay mas malawak at sa unang kalahati ay may nakamamatay na kaugnayan. Ang “amoy” ang mas neutral na katumbas. Ang ἱκανός ay mas tuwirang naipapahayag ng “sapat” sa retorikal na tanong kaysa sa mas pinalawak na “may sapat na kakayahan.”
  naturalness: Natural, malinaw, at marangal ang rebisyon. Ang “sa ilan ... sa iba naman” ay angkop na modernong katumbas ng οἷς μὲν ... οἷς δέ. Ang “sino ang sapat para sa mga bagay na ito?” ay matatas at pinananatili ang maigting na retorikal na tanong.
  terminology: Pinalitan ang “samyo” ng neutral na “amoy” upang huwag ipataw ang positibong konotasyon. Inalis ang “karapat-dapat” bilang alternatibo para sa ἱκανός, dahil ang salitang iyon ay maaaring maglipat ng diin sa pagiging worthy kaysa pagiging sapat o may kakayahan.
