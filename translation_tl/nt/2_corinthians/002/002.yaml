translation:
  language: tl
  text: Sapagkat kung pinalulungkot ko kayo, sino pa ang magpapagalak sa akin kundi ang taong pinalulungkot ko?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin, “kundi ang taong nalulungkot dahil sa akin.” Ang ἐξ ἐμοῦ ay maaaring magpahayag ng pinagmulan o sanhi: “ko” o “dahil sa akin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπῶ
  choice: pinalulungkot ko
  rationale: Ipinahahayag ng pandiwa ang pagdudulot ng lungkot; natural ito sa makabagong Tagalog at pinananatili ang tahasang sanhi.
- source_word: εὐφραίνων
  choice: magpapagalak sa akin
  rationale: Malinaw nitong ipinahahayag ang taong nagdudulot ng galak kay Pablo at pinananatili ang paghahambing sa ‘pinalulungkot.’
- source_word: τίς ὁ εὐφραίνων με
  choice: sino pa ang magpapagalak sa akin
  rationale: Natural na retorikal na tanong sa Tagalog; ang ‘pa’ ay nagpapakita ng diwang wala nang iba sa kontekstong ‘kundi.’
- source_word: ὁ λυπούμενος
  choice: ang taong pinalulungkot
  rationale: Pinananatili ang pasibong anyo ng kasalukuyang participle sa halip na tahimik na gawing aktibo o tapos na kilos.
- source_word: ἐξ ἐμοῦ
  choice: ko
  rationale: Ipinakikita ang pinagmulan o sanhi ng kalungkutan—si Pablo—sa natural na kayariang pasibo sa Tagalog.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinahahayag ang paliwanag o batayan na kaugnay ng naunang pangungusap.
