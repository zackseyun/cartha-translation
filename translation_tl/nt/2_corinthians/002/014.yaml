id: 2CO.2.14
reference: 2 Corinthians 2:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τῷ δὲ θεῷ χάρις τῷ πάντοτε θριαμβεύοντι ἡμᾶς ἐν τῷ Χριστῷ καὶ τὴν ὀσμὴν τῆς γνώσεως αὐτοῦ φανεροῦντι δι’ ἡμῶν ἐν παντὶ τόπῳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/014.yaml
  text: But thanks be to God[b][a], who always leads us in triumphal procession in the Messiah and makes the fragrance of the knowledge of him known through us in every place.
translation:
  language: tl
  text: Ngunit salamat sa Diyos, na lagi kaming pinangungunahan sa prusisyon ng tagumpay sa Mesiyas[a] at sa pamamagitan namin ay ipinakikilala sa bawat lugar ang halimuyak[b] ng pagkakilala sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na laging nagtatagumpay laban sa amin sa Mesiyas.”
    reason: alternative_reading
  - marker: b
    text: O, “samyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: salamat
  rationale: Sa pariralang Τῷ δὲ θεῷ χάρις, ang “salamat sa Diyos” ang likas na makabagong Tagalog na nagpapahayag ng pasasalamat at papuri.
- source_word: θριαμβεύοντι
  choice: pinangungunahan ... sa prusisyon ng tagumpay
  rationale: Pinananatili nito ang kongkretong larawan ng isang prusisyon ng tagumpay, sa halip na gawing pangkalahatang ideya lamang ng pagtatagumpay. Nananatiling tuwirang layon ang “kami,” habang inilalagay sa talababa ang posibleng diwang nagtatagumpay ang Diyos laban sa kanila.
- source_word: ἐν τῷ Χριστῷ
  choice: sa Mesiyas
  rationale: Ginamit ang “Mesiyas” sapagkat τίτulo ang Χριστός dito; ang “sa” ay natural na Tagalog para sa saklaw o kaugnayan ng pagkakaisa sa Mesiyas nang hindi labis na nililinaw ang ugnayan.
- source_word: ὀσμὴν
  choice: halimuyak
  rationale: Ang “halimuyak” ay malinaw at marangal na positibong salita para sa mabangong amoy at angkop sa metapora ng talata.
- source_word: γνώσεως
  choice: pagkakilala
  rationale: Mas angkop ang “pagkakilala” kaysa abstraktong “kaalaman” para sa kaalamang may kaugnayan sa isang persona, habang hindi ipinapalagay ang higit sa sinasabi ng teksto.
- source_word: φανεροῦντι
  choice: ipinakikilala
  rationale: Ipinahahayag nito sa natural na Tagalog ang causative na diwa ng paggawa sa isang bagay na hayag o kilala, at maayos na inuugnay ang metaporikong halimuyak sa pagkakilala sa Diyos.
- source_word: δι’ ἡμῶν
  choice: sa pamamagitan namin
  rationale: Malinaw nitong ipinapahayag ang instrumental o agency na gamit ng διά na may genitive.
- source_word: ἐν παντὶ τόπῳ
  choice: sa bawat lugar
  rationale: Malapit ito sa anyo at diin ng Griyego at natural pa rin sa makabagong Tagalog.
theological_decisions:
- issue: Kahulugan ng θριαμβεύω kapag ang ἡμᾶς ang tuwirang layon
  choice: Inilalarawan ang Diyos na nangunguna sa mga apostol sa prusisyon ng tagumpay sa Mesiyas.
  alternative: Inilalarawan ang Diyos na nagtatagumpay laban sa amin sa Mesiyas.
  rationale: Pinananatili ng pangunahing salin ang matingkad na larawan ng prusisyon at ang kaugnayan nito sa kasunod na metapora ng halimuyak. Dahil maaaring tumukoy ang pandiwa sa pagtatagumpay laban sa mga bihag na kasama sa prusisyon, inilagay sa talababa ang alternatibo upang hindi burahin ang tunay na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang larawan ng Romanong prusisyon ng tagumpay at ang kaugnay na metapora ng mabangong amoy, nang hindi ipinapasok ang isang denominasyonal na paliwanag.
