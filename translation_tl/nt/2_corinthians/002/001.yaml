  yaml_path: translation/nt/2_corinthians/002/001.yaml
  text: 'For I decided this for myself: not to come to you again in sorrow[a].'
translation:
  language: tl
  text: 'Sapagkat ipinasiya ko para sa aking sarili ang ganito: hindi ako muling pupunta sa inyo nang may kalungkutan[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kalungkutan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα
  choice: ipinasiya ko
  rationale: Ipinapahayag ng aorist na anyo ng κρίνω ang isang tiyak at personal na pasiya; natural at marangal sa modernong Tagalog ang “ipinasiya ko.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag na kaugnay ng naunang konteksto; malinaw na pinananatili ng “Sapagkat” ang ugnayang iyon.
- source_word: ἐμαυτῷ
  choice: para sa aking sarili
  rationale: Ipinakikita ng reflexive dative na personal at kusang binuo ni Pablo ang pasiya.
- source_word: τοῦτο
  choice: ang ganito
  rationale: Tumuturo ito pasulong sa nilalaman ng pasiya na kasunod ng tutuldok, habang nananatiling natural sa Tagalog.
- source_word: τὸ μὴ ... ἐλθεῖν
  choice: hindi ako ... pupunta
  rationale: Ang articular infinitive ang nagsasaad ng nilalaman ng pasiya. Ang sugnay na may tahasang paksa ay mas natural sa Tagalog kaysa sa literal na anyong pawatas.
- source_word: πάλιν
  choice: muling
  rationale: Malinaw at maikli nitong ipinahahayag ang pag-uulit.
- source_word: ἐν λύπῃ
  choice: nang may kalungkutan
  rationale: Pinananatili nito ang malawak na diwa ng λύπη bilang lungkot, dalamhati, o pighati at hindi tiyak kung pangunahing inilalarawan ang kalagayan ng pagpunta o ang dulot nito.
- source_word: πρὸς ὑμᾶς
  choice: sa inyo
  rationale: Sa pandiwa ng pagpunta, natural na ipinapahayag sa Tagalog ang paglapit sa mga tao sa pamamagitan ng “pumunta sa inyo.”
theological_decisions:
- issue: Ang saklaw ng ἐν λύπῃ
  choice: nang may kalungkutan
  alternative: na magdudulot ng kalungkutan
  rationale: Hindi tahasang nililinaw ng Griyego kung si Pablo ay pupunta na malungkot o kung ang pagdalaw ay magdudulot ng kalungkutan sa mga taga-Corinto. Pinananatili ng salin at talababa ang tunay na kalabuan sa halip na pumili ng isang interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang paliwanag na pang-ugnay sa “Sapagkat,” ang personal na diin ng pasiya, at ang kalabuan ng pariralang ἐν λύπῃ.
