base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/017.yaml
  text: For we are not like the many[a], peddling the word of God, but as from sincerity, but as from God[f][e][d][c][b], before God we speak in Messiah.
translation:
  language: tl
  text: Sapagkat hindi kami gaya ng marami[a] na naglalako ng salita ng Diyos[b]. Sa halip, bilang mga mula sa katapatan[c], bilang mga mula sa Diyos, nagsasalita kami sa harap ng Diyos[d] bilang mga nasa Mesiyas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang karamihan” o “napakaraming iba.”
    reason: lexical_alternative
  - marker: b
    text: Ang “naglalako” ay maaari ring magpahiwatig ng pangangalakal para kumita o ng paghahalo at pagbaluktot sa mensahe.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nang may katapatan” o “mula sa dalisay na hangarin.”
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “sa paningin ng Diyos” o “sa presensiya ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πολλοί
  choice: ang marami
  rationale: Pinananatili nito ang articular na pariralang Griyego at ang matalim na paghahambing ni Pablo, nang hindi ipinapalagay na estadistikal na 'karamihan' ang tinutukoy.
- source_word: καπηλεύοντες
  choice: naglalako
  rationale: Pinananatili ng 'naglalako' ang larawan ng isang nagtitinda o komersiyanteng gumagamit ng mensahe para sa sariling pakinabang; maaari rin itong magpahiwatig ng paghahalo o pagbaluktot ng paninda.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Tuwiran at marangal na salin ito ng genitibong parirala at pamilyar sa karaniwang gamit sa Bibliya.
- source_word: ἐξ εἰλικρινείας
  choice: mula sa katapatan
  rationale: Pinananatili ng 'mula sa' ang diwa ng pinagmumulan at ang pagkakatulad nito sa kasunod na 'mula sa Diyos'; ang 'katapatan' ay likas na Filipino para sa εἰλικρίνεια sa kontekstong ito.
- source_word: ἐκ θεοῦ
  choice: mula sa Diyos
  rationale: Payak nitong inilalahad ang Diyos bilang pinagmumulan ng kanilang pagsasalita nang hindi idinaragdag ang interpretasyong 'sinugo.'
- source_word: κατέναντι θεοῦ
  choice: sa harap ng Diyos
  rationale: Ipinahahayag nito ang pagsasalita sa presensiya at ilalim ng pagsusuri ng Diyos nang maikli at tapat sa Griyego.
- source_word: ἐν Χριστῷ
  choice: sa Mesiyas
  rationale: Isinasalin ang aktibong titulong Χριστός bilang 'Mesiyas' at pinananatili ang malawak na ugnayang ipinapahiwatig ng ἐν.
- source_word: λαλοῦμεν
  choice: nagsasalita kami
  rationale: Tuwirang salin ng pangkasalukuyang pandiwa; iniiwasang gawing mas tiyak na 'ipinangangaral' ang payak na λαλεῖν.
theological_decisions:
- issue: Kahulugan ng ἐν Χριστῷ
  choice: sa Mesiyas
  alternative: kay Cristo / nakaugnay sa Mesiyas
  rationale: Pinananatili ng 'sa Mesiyas' ang maikli at teolohikal na malawak na pormula ni Pablo, nang hindi nililimitahan kung ito ay tumutukoy sa pakikipag-isa, saklaw, o awtoridad.
- issue: Ugnayan ng ἐξ εἰλικρινείας at ἐκ θεοῦ
  choice: mula sa katapatan at mula sa Diyos
  alternative: nang may katapatan, bilang mga mula sa Diyos
  rationale: Pinananatili ang dalawang pahayag ng pinagmumulan at hindi ginagawang tiyak kung ang 'mula sa Diyos' ay tumutukoy sa mga tagapagsalita, sa kanilang mensahe, o sa kanilang pagsasalita.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang 'naglalako' upang mapanatili ang komersiyal at mapanuring larawan ng Griyego. Inayos nang bahagya ang pagkakasunod ng mga parirala para maging malinaw at natural sa Tagalog, habang pinananatili ang magkatambal na 'mula sa katapatan' at 'mula sa Diyos.'
