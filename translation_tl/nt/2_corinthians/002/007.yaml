    rationale: 'Ang μᾶλλον ay comparative/adverbial na diin na kasama ng τοὐναντίον: sa kabaligtaran, ang nararapat ay lalo pang magpatawad at umaliw. Ang “dapat” ay nagdaragdag ng normatibong himig ngunit hindi malinaw na pinananatili ang comparative emphasis.'
  - severity: low
    issue: Ang “kusang pagpapatawad” sa talababa ay mas tiyak kaysa sa leksikal na saklaw ng χαρίσασθαι.
    rationale: Mas ligtas na ilarawan ang kaugnayan ng pandiwa sa biyaya o kagandahang-loob nang hindi ipinapasok ang ideya ng kusang-loob bilang kinakailangang kahulugan.
  revised_text: Kaya, sa halip, lalo pa nga, patawarin ninyo siya at aliwin, upang hindi malamon ng labis na kalungkutan ang gayong tao.
