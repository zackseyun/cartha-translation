  source_fidelity: Kailangang maipakita nang mas malinaw ang μᾶλλον (“lalo pa nga/sa halip ay”), na hindi ganap na naihahatid ng “dapat” lamang. Tumpak ang “patawarin,” “aliwin,” at ang metaporang “malamon.”
  naturalness: Marangal at natural ang daloy kapag isinaayos bilang “sa halip, lalo pa nga, patawarin ninyo siya at aliwin.” Mas malinaw rin ang tahasang “siya” bago ang pasibong “malamon.”
  terminology: Ang “patawarin” at “aliwin” ay angkop sa konteksto ng pagpapanumbalik. Ang talababa sa χαρίσασθαι ay dapat umiwas sa “kusang,” dahil ang pandiwa ay nagpapahiwatig ng pagkakaloob na may biyaya/kagandahang-loob ngunit hindi kinakailangang boluntaryo bilang natatanging semantikong diin.
