  text: so that[a], on the contrary, you should rather forgive and comfort him[b], so that such a person may not be overwhelmed by excessive sorrow.
translation:
  language: tl
  text: Kaya, sa halip, lalo pa nga, patawarin ninyo siya at aliwin, upang hindi malamon ng labis na kalungkutan ang gayong tao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὐναντίον
  choice: sa halip
  rationale: Malinaw at likas na ipinahahayag ang pagbaligtad sa naunang hakbang ng pagdidisiplina.
- source_word: μᾶλλον
  choice: dapat
  rationale: Sa pagsasama nito sa τοὐναντίον at sa infinitive construction, natural na naihahatid sa Filipino ang diwang ang nararapat nang gawin ay ang kabaligtaran; hindi na inuulit ang hiwalay na ‘bagkus’ upang maiwasan ang mabigat na parirala.
- source_word: χαρίσασθαι
  choice: patawarin
  rationale: Sa konteksto ng pagpapanumbalik matapos ang pagdidisiplina, ‘patawarin’ ang pinakamalinaw na kahulugan, habang inilalagay sa talababa ang kaugnayan nito sa biyaya at kusang pagpapatawad.
- source_word: παρακαλέσαι
  choice: aliwin
  rationale: Ang tinutukoy ay pagtugon sa matinding kalungkutan ng tao; ‘aliwin’ ang natural na salitang Filipino, bagaman maaari ring saklawin ng Griyego ang pagpapalakas ng loob.
- source_word: καταποθῇ
  choice: malamon
  rationale: Pinananatili ang matingkad na metapora ng Griyego sa isang likas at madaling maunawaang ekspresyong Filipino.
- source_word: ὁ τοιοῦτος
  choice: ang gayong tao
  rationale: Hindi nito labis na tinutukoy ang kasarian o pagkakakilanlan, at pinananatili ang referensiyal na diwa ng Griyego.
- source_word: περισσοτέρᾳ λύπῃ
  choice: labis na kalungkutan
  rationale: Natural na ipinahahayag ang kalungkutang maaaring maging sobra at makapangibabaw sa tao.
