  to: Ngunit kung may nakapagdulot ng kalungkutan, hindi ako ang pinalungkot niya kundi kayong lahat, sa isang antas lamang—upang hindi ko kayong lahat mabigatan.[a]
  rationale: Inilapit ang huling sugnay sa pangunahing kahulugan ng ἐπιβαρῶ (“pabigatan”) at ibinalik ang πάντας ὑμᾶς bilang malinaw na layon nito. Pinanatili ng “sa isang antas lamang” ang maingat na kwalipikasyon ng ἀπὸ μέρους nang hindi nagpapasya kung ito ay tumutukoy sa antas ng kalungkutan o sa saklaw nito.
