review_pass:
  verdict: revise
  source_fidelity: Kailangang itama ang huling sugnay. Ang ἐπιβαρῶ ay may pangunahing diwang “pabigatan/pagpasanin,” at ang πάντας ὑμᾶς ay likas na layon nito. Ang “upang hindi ko ito sabihin nang labis” ay nagpapasok ng pandiwang “sabihin” at ng malabong “ito” na wala sa Griyego. Ang ἀπὸ μέρους ay nananatiling kwalipikasyon ng lawak o antas ng kalungkutang naranasan ng buong kapulungan.
  naturalness: Natural at marangal ang “nakapagdulot ng kalungkutan” at “hindi ako ang pinalungkot niya.” Mas malinaw at mas natural ang “kundi kayong lahat, sa isang antas lamang” kaysa sa pagkakahiwalay ng “kundi, sa isang antas, kayong lahat.”
  terminology: Ang “kalungkutan/pinalungkot” ay nagpapanatili ng leksikal na ugnayan ng λυπέω. Ang “mabigatan” ay idiomatikong Tagalog para sa larawan ng ἐπιβαρέω nang hindi ipinipilit ang isang doktrinal o interpretatibong pagpapaliwanag.
  issues:
  - severity: medium
    issue: Ang pangunahing teksto ay nagsasalin ng ἐπιβαρῶ bilang “sabihin nang labis.”
    rationale: Hindi ito direktang ipinahihiwatig ng pandiwang Griyego, na nangangahulugang magpabigat o magpasanin. Nawawala rin ang hayag na “kayong lahat” bilang layon ng pandiwa.
  - severity: low
    issue: Hindi gaanong malinaw ang ayos na “kundi, sa isang antas, kayong lahat.”
    rationale: Mas madaling basahin sa modernong Tagalog kapag ang “kayong lahat” ay kasunod agad ng “kundi,” at ang kwalipikasyon ay inilalagay pagkatapos nito.
  revised_text: Ngunit kung may nakapagdulot ng kalungkutan, hindi ako ang pinalungkot niya kundi kayong lahat, sa isang antas lamang—upang hindi ko kayong lahat mabigatan.[a]
