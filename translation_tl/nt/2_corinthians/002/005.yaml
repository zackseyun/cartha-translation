  text: Εἰ δέ τις λελύπηκεν, οὐκ ἐμὲ λελύπηκεν, ἀλλὰ ἀπὸ μέρους ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/005.yaml
  text: But if anyone has caused grief[a], he has grieved not me, but in part all of you—to some extent[b], so that I may not overstate it.
translation:
  language: tl
  text: Ngunit kung may nakapagdulot ng kalungkutan, hindi ako ang pinalungkot niya kundi kayong lahat, sa isang antas lamang—upang hindi ko kayong lahat mabigatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang hindi ko ito idiin nang husto sa inyong lahat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λελύπηκεν
  choice: nakapagdulot ng kalungkutan / pinalungkot
  rationale: Pinananatili ang ugnayang leksikal ng dalawang gamit ng λυπέω. Ang anyong perpekto ay ipinahihiwatig ng “nakapagdulot,” na tumutukoy sa nagawang may nananatiling epekto.
- source_word: οὐκ ἐμὲ
  choice: hindi ako
  rationale: Tuwirang pinananatili ang paghahambing ni Pablo nang hindi nagdaragdag ng diin na wala sa Griyego.
- source_word: ἀπὸ μέρους
  choice: sa isang antas
  rationale: Ipinapahayag ang kwalipikasyon ni Pablo nang natural sa modernong Tagalog, habang hindi itinatakda kung ang ibig sabihin ay bahagyang naapektuhan ang lahat o bahagi lamang ng kapulungan.
- source_word: ἵνα μὴ ἐπιβαρῶ
  choice: upang hindi ko ito sabihin nang labis
  rationale: 'Sa konteksto, maaaring retorikal ang literal na larawan ng pagpapabigat: ayaw ni Pablo na idiin o palabisín ang pananagutan ng buong kapulungan. Inilalagay sa talababa ang mas literal na posibilidad.'
- source_word: πάντας ὑμᾶς
  choice: kayong lahat
  rationale: Pinananatili ang tahasang kabuuang saklaw ng πάντας at ang pangmaramihang kausap.
theological_decisions:
- issue: Saklaw ng ἀπὸ μέρους at ugnayan nito sa πάντας ὑμᾶς
  choice: sa isang antas, kayong lahat
  alternative: bahagi lamang sa inyo / sa isang bahagi
  rationale: Malabo ang pagkakaugnay ng parirala sa Griyego. Pinapanatili ng salin ang kwalipikasyon nang hindi tiyak na nilulutas kung ang “bahagi” ay antas ng kalungkutan o bahagi ng mga taong naapektuhan.
- issue: Diwa ng ἐπιβαρῶ
  choice: hindi ko ito sabihin nang labis
  alternative: hindi ko kayong lahat pabigatan / hindi ko ito idiin nang husto sa inyong lahat
  rationale: Maaaring tumukoy ang pandiwa sa literal na retorika ng “pagpapabigat” sa buong kapulungan o sa paglalabis ng pahayag. Pinili sa teksto ang idiomatikong pagbasa, ngunit pinanatili sa talababa ang leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan ang sobrang pormal na “namighati” at pinanatili ang maingat at mapaghinahong tono ni Pablo.
