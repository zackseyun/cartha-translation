  source_fidelity: 'Kailangang baguhin ang pangunahing salin. Ang τὴν δοκιμὴν ὑμῶν ay isang pariralang pangngalan (“ang patunay/pagsubok tungkol sa inyo”), samantalang ang “kung napatunayan ninyo ang inyong sarili” ay ginawang isang ganap na proposisyon at nagdagdag ng diwang refleksibo na wala sa Griyego. Ang kasunod na εἰ-sugnay ang siyang nagsasaad kung ano ang nais malaman ni Pablo: kung sila ay masunurin sa lahat ng bagay.'
  naturalness: Ang “ang patunay tungkol sa inyo” ay malinaw at katanggap-tanggap sa makabagong Filipino sa kontekstong ito. Ang “kung kayo ay masunurin” ay natural na di-tuwirang tanong pagkatapos ng “malaman ko.”
  terminology: Ang “patunay” ay maingat na katumbas ng δοκιμή at hindi nito ipinipilit na ang salita ay tumutukoy lamang sa pagsubok o lamang sa napatunayang katangian. Inilalahad sa talababa ang mga pangunahing leksikal na posibilidad.
