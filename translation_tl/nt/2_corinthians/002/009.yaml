base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/009.yaml
  text: 'For this is why I also wrote: so that I might know the proof of you[a], whether you are obedient in everything.'
translation:
  language: tl
  text: 'Sapagkat ito rin ang dahilan kung bakit ako sumulat: upang malaman ko ang patunay tungkol sa inyo[a], kung kayo ay masunurin sa lahat ng bagay.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pagsubok sa inyo” o “ang napatunayang katangian ninyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ καὶ ἔγραψα
  choice: Sapagkat ito rin ang dahilan kung bakit ako sumulat
  rationale: Natural na Filipino na pinananatili ang paliwanag na γάρ, ang layunin ng εἰς τοῦτο, at ang dagdag na diin ng καί.
- source_word: ἵνα γνῶ
  choice: upang malaman ko
  rationale: Pinananatili ang tahasang sugnay ng layunin at ang diwa ng pagtiyak o pagkabatid.
- source_word: τὴν δοκιμὴν ὑμῶν
  choice: kung napatunayan ninyo ang inyong sarili
  rationale: Ipinahahayag nang natural ang δοκιμή bilang katangiang nahahayag sa pagsubok, habang hindi lubusang nilulutas kung pagsubok o patunay ang pangunahing diin.
- source_word: εἰ εἰς πάντα ὑπήκοοί ἐστε
  choice: kung masunurin kayo sa lahat ng bagay
  rationale: Ang εἰ ay angkop na 'kung' sa di-tuwirang tanong pagkatapos ng 'malaman,' at ang εἰς πάντα ay pinananatiling malawak at komprehensibo.
theological_decisions:
- issue: Kung ang δοκιμή ay tumutukoy sa pagsubok mismo o sa napatunayang katangian ng mga taga-Corinto
  choice: nakatutok ang pangunahing teksto sa ipinakitang katapatan sa pagsubok
  alternative: ang pagsubok sa inyo / ang patunay tungkol sa inyo
  rationale: Sa konteksto ng pag-alam kung sila ay masunurin, mas natural ang resulta ng pagsubok, ngunit nararapat panatilihin sa talababa ang tunay na leksikal na saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; iniwasan ang sobrang literal na “ang patunay ninyo,” na maaaring maging malabo o di-natural, habang pinanatili sa talababa ang saklaw ng δοκιμή.
