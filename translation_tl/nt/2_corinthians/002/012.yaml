id: 2CO.2.12
reference: 2 Corinthians 2:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ εἰς τὴν Τρῳάδα εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ θύρας μοι ἀνεῳγμένης ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/012.yaml
  text: When I came to Troas for the gospel of Messiah[a], and a door had been opened for me in the Lord[b],
translation:
  language: tl
  text: Nang dumating ako sa Troas para sa ebanghelyo ng Mesiyas[a], at nabuksan para sa akin ang isang pinto sa Panginoon[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “ebanghelyo ni Cristo.”'
    reason: lexical_alternative
  - marker: b
    text: 'O: “at isang pinto ang nanatiling bukas para sa akin sa Panginoon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: Nang dumating ako
  rationale: Ang aorist participle ay temporal dito, at ang δέ ay banayad na panandang transisyon. Likas sa Tagalog ang “Nang dumating ako” at hindi na kailangang lagyan ng hiwalay na panimulang pang-ugnay.
- source_word: εἰς τὴν Τρῳάδα
  choice: sa Troas
  rationale: Karaniwang Tagalog na pagpapahayag ng patungong lugar; malinaw sa pandiwang “dumating” ang direksiyon.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: para sa ebanghelyo
  rationale: Ipinapahayag ng εἰς ang layunin. Hindi idinagdag ang “ipangaral” sapagkat hindi ito tahasang nasa Griyego.
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Nananatili ang anyong genitive at ang titulong kahulugan ng Χριστός nang hindi nililimitahan kung ang ebanghelyo ay pag-aari o tungkol sa Mesiyas.
- source_word: θύρας
  choice: isang pinto
  rationale: Pinananatili ang kongkretong metapora ni Pablo sa halip na tahasang gawing “pagkakataon.”
- source_word: ἀνεῳγμένης
  choice: binuksan
  rationale: Ipinahihiwatig ng perfect passive participle na ang pinto ay nabuksan at nananatiling bukas sa sitwasyong inilalarawan. Ang payak na pasibong Tagalog ay natural sa loob ng nakabiting pangungusap.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang sadyang malawak na ugnayang ipinapahayag ng ἐν at hindi ito sapilitang ginagawang instrumental na “ng Panginoon.”
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ
  choice: ng Mesiyas
  alternative: ni Cristo
  rationale: 'Aktibo rito ang titular na diwa ng Χριστός bilang ang Pinahiran. Pinananatili rin ng “ng” ang posibleng saklaw ng genitive: ang ebanghelyong nauukol, tungkol, o pag-aari ng Mesiyas.'
- issue: Ugnayan ng ἐν κυρίῳ sa pagbubukas ng pinto
  choice: sa Panginoon
  alternative: ng Panginoon
  rationale: Hindi tiyak na purong tagaganap o instrumento ang ἐν. Ang “sa Panginoon” ay nagpapanatili sa teolohikal at sintaktikong kaluwagan ng parirala.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang metaporang “pinto,” ang nakabiting estruktura patungo sa kasunod na talata, at ang kuwit sa hulihan upang ipakitang hindi pa tapos ang pangungusap.
