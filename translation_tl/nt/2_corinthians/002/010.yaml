id: 2CO.2.10
reference: 2 Corinthians 2:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ᾧ δέ τι χαρίζεσθε, κἀγώ· καὶ γὰρ ἐγὼ ⸂ὃ κεχάρισμαι, εἴ τι⸃ κεχάρισμαι, δι’ ὑμᾶς ἐν προσώπῳ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/010.yaml
  text: To anyone whom you forgive anything[a], I do too. For what I have forgiven—if I have forgiven anything—I have forgiven for your sake in the presence of Messiah,
translation:
  language: tl
  text: Sinumang pinatatawad ninyo sa anumang bagay ay pinatatawad ko rin. Sapagkat ang pinatawad ko—kung mayroon man akong pinatawad—ay pinatawad ko alang-alang sa inyo, sa harapan ng Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa katauhan ng Mesiyas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ ... χαρίζεσθε / κεχάρισμαι
  choice: sinumang pinatatawad ninyo / pinatawad ko
  rationale: Sa konteksto ng pagdidisiplina at pagpapanumbalik, ang χαρίζομαι ay tumutukoy sa pagpapatawad o pagpapalaya mula sa pagkakasala. Pinananatili ng “sinuman” ang di-tiyak na saklaw ng panghalip na ᾧ kasama ng τι.
- source_word: τι
  choice: sa anumang bagay
  rationale: Ipinahahayag nito ang bukás at di-tiyak na saklaw ng bagay na pinatatawad nang natural sa Tagalog.
- source_word: κἀγώ
  choice: pinatatawad ko rin
  rationale: Malinaw at likas na ipinahahayag ang maikling Griyegong kahulugang “ako rin,” habang inuulit ang pandiwa para sa linaw sa Tagalog.
- source_word: ὃ κεχάρισμαι, εἴ τι κεχάρισμαι
  choice: ang pinatawad ko—kung mayroon man akong pinatawad—
  rationale: Pinananatili ang bahagyang nag-aatubili o mapagpakumbabang kondisyunal na pananalita ni Pablo at ang parentetikong anyo ng εἴ τι.
- source_word: δι’ ὑμᾶς
  choice: alang-alang sa inyo
  rationale: Ipinakikita ang kapakinabangan at malasakit na nakatuon sa mga taga-Corinto, hindi lamang ang sanhi ng pagkilos.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: sa harapan ng Mesiyas
  rationale: Ang πρόσωπον ay maaaring tumukoy sa mukha, presensiya, o katauhan. Ang “sa harapan” ay natural na naghahatid ng pagkilos sa presensiya at ilalim ng pagsisiyasat ng Mesiyas, habang inilalagay sa talababa ang tunay na alternatibong pagbasa.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” sa halip na ituring lamang itong pangalang pantangi.
theological_decisions:
- issue: Kung ang Χριστοῦ ay isasalin bilang titulo o pananatilihin sa tradisyonal na anyong “Cristo.”
  choice: Mesiyas
  alternative: Cristo
  rationale: Aktibo rito ang titulong mesiyaniko, at walang hinihingi ang konteksto na ituring ang Χριστός bilang pangalang gaya ng karaniwang “Cristo.”
- issue: Kung ang ἐν προσώπῳ Χριστοῦ ay nangangahulugang nasa presensiya ng Mesiyas o nasa kanyang katauhan.
  choice: sa harapan ng Mesiyas
  alternative: sa katauhan ng Mesiyas
  rationale: Mas natural sa konteksto ang pagkilos sa harapan o presensiya ng Mesiyas, ngunit leksikal na posible ang “sa katauhan,” kaya pinananatili ito sa talababa sa halip na tuluyang lutasin ang ambiguwidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kondisyunal at parentetikong himig ng Griyego, at iniwasang gawing labis na teknikal ang pananalita.
