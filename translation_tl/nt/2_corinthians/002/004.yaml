  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐκ γὰρ πολλῆς θλίψεως καὶ συνοχῆς καρδίας ἔγραψα ὑμῖν διὰ πολλῶν δακρύων, οὐχ ἵνα λυπηθῆτε, ἀλλὰ τὴν ἀγάπην ἵνα γνῶτε ἣν ἔχω περισσοτέρως εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/004.yaml
  text: For out of much affliction and anguish of heart I wrote to you through many tears[a], not so that you might be grieved[b], but so that you might know the love that I have especially for you.
translation:
  language: tl
  text: Sapagkat sumulat ako sa inyo mula sa matinding paghihirap at dalamhati ng puso, sa gitna ng maraming luha—hindi upang malungkot kayo, kundi upang malaman ninyo kung gaano kalaki ang pag-ibig ko sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “ang higit kong pag-ibig sa inyo” o “ang pag-ibig na taglay ko lalo na para sa inyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ πολλῆς θλίψεως
  choice: mula sa matinding paghihirap
  rationale: 'Ipinananatili ng “mula sa” ang diwa ng pinagmulan: ang pagsulat ni Pablo ay nag-ugat sa matindi niyang paghihirap. Hindi nito nililimitahan ang θλῖψις sa panlabas na pag-uusig lamang.'
- source_word: συνοχῆς καρδίας
  choice: dalamhati ng puso
  rationale: Likas at marangal sa Tagalog, at ipinahahayag ang matinding panloob na pagkabalisa o pagkakipit ng damdamin.
- source_word: ἔγραψα ὑμῖν
  choice: isinulat ko sa inyo ang liham na iyon
  rationale: Ginawang hayag ang likas na ipinahihiwatig na layon ng “sumulat” sa Tagalog. Ang “iyon” ay tumutukoy sa naunang liham ayon sa konteksto, nang hindi dinaragdagan ang pandiwang Griego ng ideya ng panahon.
- source_word: διὰ πολλῶν δακρύων
  choice: may maraming luha
  rationale: Natural na Tagalog para sa kasabay na matinding pagluha habang sumusulat, habang pinananatili ang matingkad na larawan ng orihinal.
- source_word: λυπηθῆτε
  choice: palungkutin kayo
  rationale: 'Ipinahahayag ang causative-passive na diwa sa natural na Tagalog: hindi layunin ni Pablo na makaranas sila ng kalungkutan dahil sa kanyang liham.'
- source_word: γνῶτε
  choice: malaman ninyo
  rationale: Tuwirang pinananatili ang sugnay na nagsasaad ng layunin, nang hindi nagpapasya kung ito ay unang pagkilala o higit na pagkaunawa.
- source_word: ἀγάπην
  choice: pag-ibig
  rationale: Karaniwan, malinaw, at angkop na salin ng ἀγάπη sa kontekstong ito.
- source_word: περισσοτέρως εἰς ὑμᾶς
  choice: kung gaano kasidhi ang pag-ibig ko sa inyo
  rationale: Ang “kasidhi” ay natural na nagpapahayag ng natatanging tindi o kasaganaan ng pag-ibig. Nilalagyan ng talababa upang mapanatili ang posibleng comparative na puwersa ng περισσοτέρως.
theological_decisions:
- issue: Kung ang περισσοτέρως ay comparative (“higit”) o intensive/elative (“lubhang,” “lalo na”)
  choice: kung gaano kasidhi ang pag-ibig ko sa inyo
  alternative: ang higit kong pag-ibig sa inyo / ang pag-ibig na taglay ko lalo na para sa inyo
  rationale: Hindi malinaw ang pinaghahambingan sa talata. Ang pangunahing salin ay natural at hindi nag-aangking mas mahal ni Pablo ang mga taga-Corinto kaysa sa tiyak na ibang pangkat; ipinakikita ng talababa ang tunay na lawak ng posibleng kahulugan.
translation_notes:
  register: 'Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “dalamhati ng puso” upang mapanatili ang emosyonal na bigat, at ang gitling-pahaba upang luminaw ang pagtutuwid ng layunin: hindi pagpapalungkot kundi pagpapakilala ng pag-ibig.'
