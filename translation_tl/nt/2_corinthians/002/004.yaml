  terminology: Ang “paghihirap,” “dalamhati ng puso,” at “pag-ibig” ay angkop sa modernong Filipino Tagalog at pinananatili ang bigat ng θλίψις, συνοχὴ καρδίας, at ἀγάπη. Ang “kung gaano kalaki ang pag-ibig ko” ay hindi nagtatakda ng isang tahasang pinaghahambingan para sa περισσοτέρως; pinananatili ng talababa ang alternatibong comparative na pagbasa.
