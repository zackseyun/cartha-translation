    rationale: Bagaman maaaring magkaugnay ang mga pangyayari, ang ἀλλά ay pangunahing pangatnig na panlaban/paglipat. Ang “ngunit” ay hindi nagpapataw ng mas matibay na ugnayang sanhi-bunga kaysa sa pinahihintulutan ng teksto.
  - severity: low
