    rationale: 'Mas karaniwan at malinaw sa Filipino na ang taong nagsasalita ang paksa: “Hindi ako nagkaroon ng kapanatagan sa aking espiritu.” Napapanatili nito ang literal na saklaw ng πνεῦμα nang hindi ginagawang “damdamin” o “kalooban.”}],'
