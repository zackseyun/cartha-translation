revisions:
- from: Hindi mapalagay ang aking espiritu dahil hindi ko natagpuan si Tito na aking kapatid.[a] Kaya nagpaalam ako sa kanila[b] at pumunta sa Macedonia.
  to: Hindi ako nagkaroon ng kapanatagan sa aking espiritu dahil hindi ko natagpuan si Tito, na aking kapatid.[a] Ngunit matapos akong magpaalam sa kanila,[b] pumunta ako sa Macedonia.
  rationale: Pinalitan ang idyomang hindi gaanong likas upang maging malinaw at natural ang Tagalog habang pinananatili ang “aking espiritu.” Pinalitan ang “Kaya” ng “Ngunit” upang mas tapat na maipakita ang ἀλλά nang hindi nagdaragdag ng relasyong sanhi-bunga. Inayos din ang ayos at bantas ng participial na “matapos akong magpaalam sa kanila” at ang talababa nito.
