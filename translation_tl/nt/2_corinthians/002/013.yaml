  text: οὐκ ἔσχηκα ἄνεσιν τῷ πνεύματί μου τῷ μὴ εὑρεῖν με Τίτον τὸν ἀδελφόν μου, ἀλλὰ ἀποταξάμενος αὐτοῖς ἐξῆλθον εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/013.yaml
  text: I had no rest in my spirit because I did not find Titus my brother[a], but after taking leave of them[c][b], I went on to Macedonia.
translation:
  language: tl
  text: Hindi ako nagkaroon ng kapanatagan sa aking espiritu dahil hindi ko natagpuan si Tito, na aking kapatid.[a] Ngunit matapos akong magpaalam sa kanila,[b] pumunta ako sa Macedonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “aking kapatid” ay tumutukoy kay Tito bilang kapwa mananampalataya at kamanggagawa ni Pablo.
    reason: cultural_note
  - marker: b
    text: O “pagkatapos kong magpaalam sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔσχηκα ἄνεσιν
  choice: Hindi mapalagay
  rationale: Ipinahahayag nito sa likas na modernong Tagalog ang kawalan ng panloob na kapanatagan sa kontekstong pasalaysay. Hindi nito dinaragdagan ang teksto ng ideya ng pisikal na pahinga.
- source_word: τῷ πνεύματί μου
  choice: ang aking espiritu
  rationale: Pinananatili ang personal at panloob na dimensiyon ng πνεῦμα nang hindi ito tahasang ginagawang damdamin, isip, o Espiritu Santo.
- source_word: τῷ μὴ εὑρεῖν με Τίτον
  choice: dahil hindi ko natagpuan si Tito
  rationale: Malinaw na ipinapakita ang sanhi na ipinahihiwatig ng articular infinitive at μή, nang hindi idinaragdag ang diwa ng kawalan ng kakayahan.
- source_word: τὸν ἀδελφόν μου
  choice: na aking kapatid
  rationale: Pinananatili ang metaporang pampamilya at ang init ng ugnayan ni Pablo kay Tito.
- source_word: ἀλλὰ
  choice: Kaya
  rationale: Sa daloy ng pangyayari, ang kasunod na pag-alis ang naging tugon sa hindi pagkakita kay Tito. Ang natural na Tagalog na “Kaya” ay naghahatid ng kontekstuwal na resulta, bagaman literal na salungat ang karaniwang halaga ng ἀλλά.
- source_word: ἀποταξάμενος αὐτοῖς
  choice: nagpaalam ako sa kanila
  rationale: Natural at malinaw na salin ng paghingi ng pahintulot o pamamaalam bago umalis; ang aorist participle ay maayos na naihahatid bilang naunang kilos.
- source_word: ἐξῆλθον εἰς Μακεδονίαν
  choice: pumunta sa Macedonia
  rationale: Likas na Tagalog para sa pag-alis patungo sa Macedonia, nang hindi pilit na tinutumbasan ang prefixed verb bilang “lumabas.”
theological_decisions:
- issue: Kahulugan ng “aking kapatid” para kay Tito
  choice: Pinanatili sa pangunahing teksto ang “aking kapatid.”
  alternative: “aking kapatid sa pananampalataya at kamanggagawa”
  rationale: Ang mas pinalawak na anyo ay magpapaliwanag ngunit magdaragdag ng mga salitang wala sa talata. Mas mainam na panatilihin ang metaporang Pauline at ipaliwanag ito sa talababa.
- issue: Saklaw ng πνεῦμα sa “aking espiritu”
  choice: Hindi tinukoy kung ito ay kalooban, damdamin, o ibang tiyak na antropolohikal na kategorya.
  alternative: “aking kalooban” o “aking damdamin”
  rationale: May tunay na lawak ang πνεῦμα rito; ang “espiritu” ang pinakamalapit na saling hindi tahimik na lumulutas sa ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Hindi mapalagay” bilang natural na idyoma para sa panloob na kawalan ng kapanatagan, habang pinanatili ang “espiritu” at “kapatid” upang hindi mawala ang anyo at teolohikal na puwang ng Griyego. Lahat ng marker ng talababa ay nasa pangunahing teksto.
