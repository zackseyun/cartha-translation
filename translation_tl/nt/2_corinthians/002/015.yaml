id: 2CO.2.15
reference: 2 Corinthians 2:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι Χριστοῦ εὐωδία ἐσμὲν τῷ θεῷ ἐν τοῖς σῳζομένοις καὶ ἐν τοῖς ἀπολλυμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/015.yaml
  text: For we are the aroma of Messiah to God among those who are being saved and among those who are perishing[b][a],
translation:
  language: tl
  text: Sapagkat kami ang mabangong samyo ng Mesiyas para sa Diyos, sa gitna ng mga inililigtas at sa gitna ng mga napapahamak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag o dahilan kaugnay ng naunang pahayag at natural na pinananatili ang ugnayang iyon sa Tagalog.
- source_word: Χριστοῦ
  choice: ng Mesiyas
  rationale: Genitibo ito na nagpapahayag na ang samyo ay sa Mesiyas o nagmumula sa kaugnayan sa kanya; pinananatili ng “Mesiyas” ang titulong kahulugan ng Χριστός.
- source_word: εὐωδία
  choice: mabangong samyo
  rationale: Ang εὐωδία ay tumutukoy sa kaaya-ayang halimuyak; ang pariralang ito ay natural, marangal, at malinaw na nagpapanatili sa pandamang metapora.
- source_word: τῷ θεῷ
  choice: para sa Diyos
  rationale: Ipinahahayag nito ang kaugnayan o direksiyon ng samyo patungo sa Diyos nang natural sa Tagalog, nang hindi ginagawang tahasang paghatol o lokasyon ang datibo.
- source_word: ἐν τοῖς σῳζομένοις
  choice: sa gitna ng mga inililigtas
  rationale: Ang kasalukuyang participle ay pinananatiling prosesuwal sa “mga inililigtas,” at ang ἐν ay natural na ipinahayag bilang “sa gitna ng.”
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: sa gitna ng mga napapahamak
  rationale: Pinananatili ng “napapahamak” ang nagpapatuloy na proseso o kalagayan at iniiwasang tukuyin nang higit sa Griyego ang paraan ng pagkapuksa.
theological_decisions:
- issue: Prosesuwal na aspekto ng σῳζομένοις at ἀπολλυμένοις
  choice: “mga inililigtas” at “mga napapahamak”
  alternative: “mga ligtas” at “mga mapapahamak”
  rationale: Ang mga present participle ay naglalarawan ng nagpapatuloy na proseso o kalagayan. Hindi ito pinapantay sa mga nakumpletong etiketa, kaya nananatili ang teolohikal na tensiyon ng teksto.
- issue: Kahulugan ng genitibong Χριστοῦ sa metapora
  choice: “mabangong samyo ng Mesiyas”
  alternative: “mabangong samyo tungkol sa Mesiyas” o “mula sa Mesiyas”
  rationale: Hindi tahasang nilulutas ng genitibo kung ito ay pagmamay-ari, pinagmulan, o katangiang inuugnay sa Mesiyas; ang payak na “ng Mesiyas” ang pinakamahusay na nagpapanatili sa lawak ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Inulit ang “sa gitna ng” upang maipakita ang paralelismo ng dalawang ἐν-parirala. Ginamit ang “Mesiyas” bilang malinaw na titulo, at “mabangong samyo” bilang madaling maunawaang sakripisyal na metapora nang hindi nagdaragdag ng paliwanag sa mismong talata.
