revisions:
- from: At isinulat ko nga ang mismong bagay na ito upang, pagdating ko, hindi ako malungkot dahil sa mga taong dapat sana’y magbigay sa akin ng kagalakan[a]. May tiwala ako sa inyong lahat na ang aking kagalakan ay kagalakan ninyong lahat.
  to: At isinulat ko ang mismong bagay na ito upang, pagdating ko, hindi ako makaranas ng kalungkutan mula sa mga taong dapat sana’y magbigay sa akin ng kagalakan[a], habang taglay ko ang tiwala sa inyong lahat na ang aking kagalakan ay kagalakan ninyong lahat.
  rationale: Pinalitan ang pananalitang tumutukoy lamang sa kalagayan ng mas tumpak na pagpapahayag ng pagdanas ng kalungkutan. Isinama ang participial na πεποιθὼς sa pangunahing pangungusap sa paraang hindi ginagawang tahasang sanhi ang pagtitiwala. Inayos din ang talababa upang maging natural at maunawaan sa Tagalog habang pinananatili ang mas literal na direksiyon ng Griyego.
