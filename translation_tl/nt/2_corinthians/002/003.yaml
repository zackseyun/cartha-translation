  naturalness: Natural ang pangkalahatang rehistro, ngunit mas maayos sa modernong Tagalog ang isang tuloy-tuloy na pangungusap na gumagamit ng “habang taglay ko ang tiwala.” Naiiwasan din nito ang di-natural na pananalita sa talababa.
  terminology: Ang “mismong bagay na ito,” “kalungkutan,” at “kagalakan” ay angkop at pare-pareho. Ang “dapat sana’y magbigay sa akin ng kagalakan” ay isang malinaw na pagsasalin ng mga taong dapat sana’y pinagmumulan ng kagalakan ni Pablo.
