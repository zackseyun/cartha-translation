source:
  edition: SBLGNT
  text: καὶ ⸀ἔγραψα τοῦτο αὐτὸ ἵνα μὴ ἐλθὼν λύπην ⸀σχῶ ἀφ’ ὧν ἔδει με χαίρειν, πεποιθὼς ἐπὶ πάντας ὑμᾶς ὅτι ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/003.yaml
  text: And I wrote this very thing so that, when I came, I might not have grief from those who ought to make me rejoice, because I was confident about all of you that my joy is the joy of you all.
translation:
  language: tl
  text: At isinulat ko ang mismong bagay na ito upang, pagdating ko, hindi ako makaranas ng kalungkutan mula sa mga taong dapat sana’y magbigay sa akin ng kagalakan[a], habang taglay ko ang tiwala sa inyong lahat na ang aking kagalakan ay kagalakan ninyong lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “mula sa mga taong dapat sana’y ikinagagalak ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: isinulat ko
  rationale: Ang aorist indicative ay natural na isinalin bilang payak na nagdaang kilos at tumutukoy sa nauna nang pagsulat ni Pablo.
- source_word: τοῦτο αὐτὸ
  choice: ang mismong bagay na ito
  rationale: Pinananatili nito ang diin ng parirala sa natural at malinaw na Tagalog.
- source_word: ἵνα μὴ ἐλθὼν λύπην σχῶ
  choice: upang, pagdating ko, hindi ako malungkot
  rationale: Ipinahahayag ng ἵνα ang layunin, samantalang ang λύπην σχῶ ay natural na naihahatid bilang pagdanas ng kalungkutan.
- source_word: ἀφ’ ὧν ἔδει με χαίρειν
  choice: dahil sa mga taong dapat sana’y magbigay sa akin ng kagalakan
  rationale: 'Ipinakikita nito ang ugnayang diwa: ang mga taong iyon ang dapat maging pinagmumulan ng kagalakan ni Pablo, hindi ng kalungkutan. Nasa talababa ang mas literal na anyo.'
- source_word: πεποιθὼς ἐπὶ πάντας ὑμᾶς
  choice: May tiwala ako sa inyong lahat
  rationale: Inihahatid ng perfect participle ang matatag at nagpapatuloy na pagtitiwala. Ang hiwalay na pangungusap ay umiiwas sa labis na pagtukoy kung ang participle ay sanhi o kalakip na kalagayan lamang.
- source_word: ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν
  choice: ang aking kagalakan ay kagalakan ninyong lahat
  rationale: Pinananatili ang malapit na estruktura ng Griyego at ang diwa ng kagalakang magkakaugnay kay Pablo at sa buong kongregasyon nang hindi tahasang nilulutas kung ito ay pag-aari o pagbabahagi.
theological_decisions:
- issue: Ugnayan ng πεποιθὼς sa pangunahing pangungusap
  choice: 'Ginawang hiwalay na pahayag: “May tiwala ako...”'
  alternative: “sapagkat may tiwala ako...” o “na may tiwala...”
  rationale: Maaaring unawain ang participle bilang sanhi o kasabay na kalagayan. Ang hiwalay na pahayag ay nagpapanatili ng kaugnayan ngunit hindi pinatitibay nang labis ang isang interpretasyon.
- issue: Kahulugan ng magkakaugnay na kagalakan
  choice: “ang aking kagalakan ay kagalakan ninyong lahat”
  alternative: “ang aking kagalakan ay ibinabahagi ninyong lahat”
  rationale: Hindi tahasang sinasabi ng Griyego kung pagbabahagi, pag-aari, o pagkakaisa ng kagalakan ang eksaktong diin; pinananatili ng salin ang gayong pagkaluwag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “dapat sana’y” upang ipahiwatig ang inaasahang ngunit hindi natupad na pinagmumulan ng kagalakan, at iniwasan ang labis na pormal o makalumang pananalita.
