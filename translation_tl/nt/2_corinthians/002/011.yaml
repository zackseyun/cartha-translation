  text: ἵνα μὴ πλεονεκτηθῶμεν ὑπὸ τοῦ Σατανᾶ, οὐ γὰρ αὐτοῦ τὰ νοήματα ἀγνοοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/011.yaml
  text: so that we would not be outwitted by Satan[b][a], for we are not ignorant of his schemes.
translation:
  language: tl
  text: upang hindi tayo malamangan[a] ni Satanas, sapagkat hindi lingid sa atin ang kanyang mga pakana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mapagsamantalahan” o “madaig sa panlilinlang.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga balak,” “mga hangarin,” o “mga kaisipan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: upang hindi
  rationale: Ipinahahayag ang layuning maiwasan ang isang masamang resulta at likas itong pakinggan sa makabagong Tagalog.
- source_word: πλεονεκτηθῶμεν
  choice: malamangan
  rationale: Saklaw nito ang diwa ng pagdaig o pagsasamantala nang hindi nililimitahan ang pandiwa sa panlilinlang lamang; inilalahad sa talababa ang iba pang posibleng salin.
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: ni Satanas
  rationale: Tuwirang isinasaad ang gumagawa ng kilos sa balintiyak na pandiwa; ginagamit ang nakaugaliang anyong Tagalog ng pangalan.
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinakikilala nito ang paliwanag o batayan ng naunang sugnay sa isang marangal ngunit karaniwang anyo.
- source_word: νοήματα
  choice: mga pakana
  rationale: Sa konteksto, tumutukoy ito sa mapaminsalang mga balak o estratehiya ni Satanas, hindi lamang sa neutral na mga kaisipan.
- source_word: οὐ … ἀγνοοῦμεν
  choice: hindi lingid sa atin
  rationale: Natural na idyomang Tagalog na nagpapanatili sa negatibong pahayag na hindi sila walang-alam.
theological_decisions:
- issue: Kung ang πλεονεκτηθῶμεν ay pangunahing tumutukoy sa panlilinlang o sa pagsasamantala
  choice: malamangan
  alternative: mapagsamantalahan / madaig sa panlilinlang
  rationale: Pinananatili ng mas malawak na salin ang saklaw ng Griyego at ang tensiyon sa konteksto nang hindi ipinapalagay na intelektuwal na panlilinlang lamang ang tinutukoy.
- issue: Saklaw ng νοήματα
  choice: mga pakana
  alternative: mga balak / mga kaisipan
  rationale: Ipinakikita ng konteksto ang masamang estratehikong diwa, ngunit inilalagay sa talababa ang mas literal na mga posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ang “hindi lingid sa atin” ay karaniwang idyoma, samantalang pinananatili ng “malamangan” ang lawak ng pandiwang Griyego. Inayos ang mga pananda ng talababa upang ang [a] ay sumunod sa katumbas ng πλεονεκτηθῶμεν at ang [b] sa katumbas ng νοήματα.
