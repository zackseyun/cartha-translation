id: 2CO.12.10
reference: 2 Corinthians 12:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὸ εὐδοκῶ ἐν ἀσθενείαις, ἐν ὕβρεσιν, ἐν ἀνάγκαις, ἐν διωγμοῖς ⸀καὶ στενοχωρίαις, ὑπὲρ Χριστοῦ· ὅταν γὰρ ἀσθενῶ, τότε δυνατός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/010.yaml
  text: Therefore I delight in weaknesses[a], in insults, in hardships, in persecutions and distresses, for the sake of Messiah; for when I am weak, then I am strong.
translation:
  language: tl
  text: Kaya nalulugod ako sa mga kahinaan, mga paghamak, mga paghihirap, mga pag-uusig, at mga kagipitan alang-alang sa Mesiyas[a]. Sapagkat kapag mahina ako, saka ako malakas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.”
    reason: Alternatibong tradisyonal na salin ng Χριστός sa kontekstong ito.
lexical_decisions:
- source_word: διὸ
  choice: Kaya
  rationale: Ipinakikita ang konklusyong ibinubunga ng naunang pangangatwiran at natural ang daloy sa makabagong Tagalog.
- source_word: εὐδοκῶ
  choice: nalulugod ako
  rationale: Ipinahahayag ang kusang pagsang-ayon o pagkakaroon ng kasiyahan, hindi lamang pagtitiis o pagiging kontento.
- source_word: ἐν ἀσθενείαις
  choice: sa mga kahinaan
  rationale: Pinananatili ang maramihan at ang malawak na diwa ng kahinaan o pagkamarupok, nang hindi nililimitahan sa karamdaman.
- source_word: ἐν ὕβρεσιν
  choice: mga paghamak
  rationale: Saklaw nito ang mapang-abusong pagtrato at pagpapahiya; mas natural at marangal ito kaysa isang makitid na pagtukoy lamang sa pasalitang insulto.
- source_word: ἐν ἀνάγκαις
  choice: mga paghihirap
  rationale: Sa konteksto, tumutukoy ito sa mga mapilit at mabibigat na kalagayan; malinaw sa karaniwang mambabasa ang 'mga paghihirap.'
- source_word: ἐν διωγμοῖς
  choice: mga pag-uusig
  rationale: Tuwirang ipinahahayag ang pag-uusig na dinaranas dahil sa katapatan sa Mesiyas.
- source_word: καὶ στενοχωρίαις
  choice: at mga kagipitan
  rationale: Ipinahahayag ang larawan ng matinding pagkakasukol o pressure at naihihiwalay sa mas pangkalahatang 'mga paghihirap.'
- source_word: ὑπὲρ Χριστοῦ
  choice: alang-alang sa Mesiyas
  rationale: Ipinahahayag ng ὑπέρ ang dahilan o kapakanan, samantalang pinananatili ng 'Mesiyas' ang titular na diwa ng Χριστός.
- source_word: ὅταν γὰρ ἀσθενῶ
  choice: Sapagkat kapag mahina ako
  rationale: Pinananatili ang pangkalahatang temporal na diwa ng ὅταν at ang paliwanag na ipinakikilala ng γάρ.
- source_word: τότε δυνατός εἰμι
  choice: saka ako malakas
  rationale: Ang 'malakas' ang natural na kasalungat ng 'mahina,' at malinaw na pinananatili ng 'saka' ang kabalintunaan ng pangungusap.
theological_decisions:
- issue: Pagkakasalin ng Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay maaaring marinig ang Χριστός bilang titulo; pinananatili ng 'Mesiyas' ang mesiyanikong diwa, habang inilalagay sa talababa ang tradisyonal at pangalan-tulad na saling 'Cristo.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Inulit lamang nang tahasan ang pang-ukol sa unang item upang maiwasan ang mabigat na sunod-sunod na 'sa'; ang lahat ng kasunod na pangngalan ay malinaw pa ring saklaw ng 'nalulugod ako sa.'
