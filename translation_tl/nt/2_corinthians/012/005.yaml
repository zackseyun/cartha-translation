id: 2CO.12.5
reference: 2 Corinthians 12:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑπὲρ τοῦ τοιούτου καυχήσομαι, ὑπὲρ δὲ ἐμαυτοῦ οὐ καυχήσομαι εἰ μὴ ἐν ταῖς ⸀ἀσθενείαις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/005.yaml
  text: On behalf of such a one I will boast[a], but on behalf of myself I will not boast[b], except in my weaknesses.
translation:
  language: tl
  text: Ipagmamalaki ko ang gayong tao[a], ngunit hindi ko ipagmamalaki ang aking sarili, maliban sa aking mga kahinaan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tungkol sa gayong tao ay magmamalaki ako.” Ang Griyego ay maaaring tumukoy sa taong siyang paksa o batayan ng pagmamalaki; pinananatili rito ang retorikal na paglalayo ni Pablo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa mga kahinaan.” Ang “kahinaan” ay maaaring tumukoy sa karupukan ng tao, pagdurusa, o mga kalagayang nagpapakita ng kapangyarihan ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ τοῦ τοιούτου
  choice: ang gayong tao
  rationale: Sa pariralang “ipagmamalaki ko ang gayong tao,” likas na naihahayag sa modernong Tagalog ang taong tinutukoy ng ὑπέρ kasabay ng sadyang di-tuwirang pagtukoy ng τοῦ τοιούτου. Pinananatili nito ang retorikal na paglalayo ni Pablo nang hindi ipinapasiyang ibang tao nga siya.
- source_word: καυχήσομαι
  choice: ipagmamalaki ko
  rationale: Malinaw at natural itong katumbas ng pandiwang καυχάομαι sa kontekstong tumutukoy sa bagay o taong ipinagmamalaki. Iniiwasan nito ang mas lumang gamit na hindi gaanong malinaw sa karaniwang mambabasa.
- source_word: ἐμαυτοῦ
  choice: ang aking sarili
  rationale: Pinananatili ng anyong pabalik ang mariing pagsalungat sa “gayong tao.”
- source_word: εἰ μὴ
  choice: maliban sa
  rationale: Dito, ang εἰ μὴ ay nagpapakilala ng eksepsiyon, hindi ng kondisyon.
- source_word: ἐν ταῖς ἀσθενείαις
  choice: sa aking mga kahinaan
  rationale: Ang “mga kahinaan” ay malawak at natural na salin ng ἀσθένειαις, na maaaring tumukoy sa pagkukulang ng lakas, karupukan, o pagdurusa. Idinagdag ang “aking” dahil malinaw sa pagsalungat na sariling mga kahinaan ni Pablo ang tinutukoy.
theological_decisions:
- issue: Ang uri ng ipinahihintulot na pagmamalaki ni Pablo
  choice: Pinagsasalungat ni Pablo ang pagmamalaki sa “gayong tao” at ang pagmamalaki sa kanyang sarili; tungkol sa sarili, ang tanging eksepsiyon ay ang kanyang mga kahinaan.
  alternative: Maaaring literal na ibang tao ang “gayong tao,” o maaari namang ito ay retorikal na paglayo ni Pablo sa sarili niyang karanasan.
  rationale: Hindi nilulutas ng salin ang sadyang tensiyon sa pagkakakilanlan ng “gayong tao.” Pinananatili rin nitong personal at maramihan ang mga kahinaan, alinsunod sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “ipagmamalaki” upang maging natural ang konstruksyon sa Tagalog, at “gayong tao” upang mapanatili ang di-tuwiran at retorikal na pagtukoy ng Griyego.
