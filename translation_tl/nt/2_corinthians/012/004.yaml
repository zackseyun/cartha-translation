  text: ὅτι ἡρπάγη εἰς τὸν παράδεισον καὶ ἤκουσεν ἄρρητα ῥήματα ἃ οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/004.yaml
  text: that he was caught up into paradise and heard inexpressible words, which a man is not permitted to speak.
translation:
  language: tl
  text: na inagaw siya paitaas patungo sa paraiso at nakarinig ng mga salitang hindi kayang ipahayag, na hindi pinahihintulutang sabihin ng tao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρπάγη
  choice: inagaw siya paitaas
  rationale: Ipinananatili ang puwersa at pasibong diwa ng pandiwa, pati ang pataas na direksiyong malinaw sa konteksto, nang hindi tinutukoy kung sino ang kumilos.
- source_word: παράδεισον
  choice: paraiso
  rationale: Karaniwan at makikilalang katumbas sa modernong Tagalog na nagpapanatili sa terminong teolohikal nang hindi ipinapaliwanag nang lampas sa teksto.
- source_word: ἄρρητα ῥήματα
  choice: mga salitang hindi kayang ipahayag
  rationale: Sinasalamin ang ideya ng mga salitang hindi maipapahayag o maisasaysay; hindi ito pinagsasama sa kasunod na hiwalay na ideya ng pagbabawal.
- source_word: οὐκ ἐξὸν
  choice: hindi ipinahihintulot
  rationale: Ipinapahayag ang kawalan ng pahintulot o pagiging hindi nararapat ayon sa teksto, sa halip na simpleng kawalan ng kakayahan.
- source_word: ἀνθρώπῳ
  choice: sa tao
  rationale: Dito ay pangkalahatan ang sanggunian sa isang taong nilalang; ang inklusibong ‘tao’ ay natural at tapat sa Griyego.
- source_word: λαλῆσαι
  choice: na sabihin
  rationale: Payak at natural na katumbas ng pagsasalita o pagbigkas sa kontekstong ito.
theological_decisions:
- issue: Ang ugnayan ng ‘hindi kayang ipahayag’ at ‘hindi ipinahihintulot’
  choice: 'Pinanatiling dalawang magkaugnay ngunit magkaibang pahayag: hindi kayang ipahayag ang mga salita, at hindi ipinahihintulot sa tao na sabihin ang mga iyon.'
  alternative: Isalin ang una bilang ‘mga lihim na salita’ o pagsamahin ang dalawa bilang iisang pagbabawal.
  rationale: May tunay na tensiyon sa pagitan ng ἄρρητα at οὐκ ἐξὸν; hindi dapat tahimik na ipalagay na pareho lamang silang tumutukoy sa pagbabawal o sa kawalan ng kakayahan.
- issue: Hindi pinangalanang tagakilos sa pasibong ἡρπάγη
  choice: Hindi tinukoy kung Diyos, Espiritu, o ibang tagakilos ang umagaw sa kanya paitaas.
  alternative: ‘Inagaw siya ng Diyos paitaas.’
  rationale: Pasibo ang orihinal at walang hayagang tagakilos; ang pagdaragdag ng pangalan ay lalampas sa mismong talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinili ang ‘inagaw siya paitaas’ upang mapanatili ang biglaan at malakas na kilos ng ἁρπάζω; pinili ang pangkalahatang ‘tao’ sa halip na panlalaking ‘lalaki.’
