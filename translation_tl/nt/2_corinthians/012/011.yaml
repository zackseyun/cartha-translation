id: 2CO.12.11
reference: 2 Corinthians 12:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Γέγονα ⸀ἄφρων· ὑμεῖς με ἠναγκάσατε· ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι. οὐδὲν γὰρ ὑστέρησα τῶν ὑπερλίαν ἀποστόλων, εἰ καὶ οὐδέν εἰμι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/011.yaml
  text: I have become a fool; you forced me to it. For I ought to have been commended by you[a], for I fell short in nothing compared with those super-apostles, even if I am nothing.
translation:
  language: tl
  text: Naging hangal ako—kayo ang pumilit sa akin na gawin ito. Sapagkat dapat sana’y kayo ang pumuri sa akin, sapagkat hindi ako nagkulang nang anuman kung ihahambing sa mga ubod-dakilang apostol[a], kahit wala akong kabuluhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinakadakilang mga apostol.” Napakatindi ng pananalitang Griyego at maaaring ironiko sa kontekstong ito.
    reason: alternative_reading
lexical_decisions:
- source_word: Γέγονα ἄφρων
  choice: Naging hangal ako
  rationale: Pinananatili ng “naging” ang nagresultang kalagayan ng perpektong aspekto, at likas sa Tagalog ang “hangal” bilang mapait at ironikong paglalarawan sa sarili.
- source_word: ὑμεῖς με ἠναγκάσατε
  choice: kayo ang nagtulak sa akin na gawin ito
  rationale: Binibigyang-diin ng “kayo ang” ang ὑμεῖς; tinutukoy ng “ito” ang kontekstuwal na hangal na pagyayabang nang hindi iyon labis na ipinapaliwanag.
- source_word: ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι
  choice: Sapagkat dapat sana’y kayo ang nagpatunay na karapat-dapat ako
  rationale: Ipinahahayag ng “dapat sana” ang hindi natupad na nararapat gawin. Sa kontekstong ito, ang pasibong συνίστασθαι ay tumutukoy sa pagsasalita nila pabor kay Pablo o pagpapatunay sa kaniyang pagiging karapat-dapat.
- source_word: οὐδὲν γὰρ ὑστέρησα
  choice: Hindi naman ako nahuli sa anumang bagay
  rationale: 'Pinananatili ang paghahambing na diwa ng ὑστερέω: hindi siya nasa likuran o mas mababa sa anumang bagay.'
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: sa mga “ubod-dakilang apostol”
  rationale: Ang “ubod-dakila” ay matinding pagpapahayag na maaaring basahing tuwiran o ironiko; ang panipi ay nagpapahiwatig ng kontekstuwal na retorika nang hindi idinaragdag ang “tinaguriang.”
- source_word: εἰ καὶ οὐδέν εἰμι
  choice: kahit wala akong kabuluhan
  rationale: Likas na Tagalog para sa literal na “kahit ako ay wala,” at pinananatili ang matinding pagpapakumbaba o pagpapawalang-halaga ni Pablo sa sarili.
theological_decisions:
- issue: Diwa ng τῶν ὑπερλίαν ἀποστόλων
  choice: “ubod-dakilang apostol,” na may paniping nagpapahiwatig ng posibleng ironikong gamit
  alternative: “pinakadakilang mga apostol,” bilang maaaring tuwirang pagtukoy sa mga apostol na lubhang iginagalang
  rationale: Matindi ang anyong Griyego at malamang na polemikal sa konteksto, ngunit hindi nito tahasang sinasabing “di-umano” o “tinaguriang.” Pinananatili ng salin at talababa ang dalawang maaaring pagbasa.
- issue: Pagpapahayag ng οὐδέν sa sariling paglalarawan ni Pablo
  choice: “wala akong kabuluhan”
  alternative: “ako ay wala”
  rationale: Iniiwasang gawing tiyak na doktrinal na pahayag ang retorikal na pagpapakumbaba, habang pinananatili ang bigat ng sinabi.
translation_notes:
  register: Makabago at dignified na Filipino, na may malinaw na retorikal na diin. Ginamit ang “nagpatunay na karapat-dapat” sa halip na mas teknikal o di-likas na “nagkomenda,” at pinanatili sa talababa ang tunay na kalabuan ng matinding katawagang ὑπερλίαν.
