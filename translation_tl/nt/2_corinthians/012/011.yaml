- from: Naging hangal ako—kayo ang nagtulak sa akin na gawin ito. Sapagkat dapat sana’y kayo ang nagpatunay na karapat-dapat ako. Hindi naman ako nahuli sa anumang bagay sa mga “ubod-dakilang apostol”[a], kahit wala akong kabuluhan.
  to: Naging hangal ako—kayo ang pumilit sa akin na gawin ito. Sapagkat dapat sana’y kayo ang pumuri sa akin, sapagkat hindi ako nagkulang nang anuman kung ihahambing sa mga ubod-dakilang apostol[a], kahit wala akong kabuluhan.
  rationale: Pinalakas ang salin ng ἠναγκάσατε sa “pumilit,” isinalin ang συνίστασθαι bilang “pumuri sa akin” upang ipakita ang inaasahang pampublikong pagkilala ng mga taga-Corinto nang hindi nagdaragdag ng pamantayan ng pagiging “karapat-dapat,” at ginawang tahasan ang paghahambing sa οὐδὲν ... ὑστέρησα. Inalis ang panipi sa matinding katawagan para sa mga apostol, habang pinanatili ng talababa ang posibilidad ng ironya at ang alternatibong di-ironikong pagbasa.
