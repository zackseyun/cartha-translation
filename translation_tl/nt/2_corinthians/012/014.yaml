reference: 2 Corinthians 12:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἰδοὺ τρίτον ⸀τοῦτο ἑτοίμως ἔχω ἐλθεῖν πρὸς ὑμᾶς, καὶ οὐ ⸀καταναρκήσω· οὐ γὰρ ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς, οὐ γὰρ ὀφείλει τὰ τέκνα τοῖς γονεῦσιν θησαυρίζειν, ἀλλὰ οἱ γονεῖς τοῖς τέκνοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/014.yaml
  text: Look, this is the third time I am ready to come to you, and I will not be a burden to you. For I do not seek what is yours, but you. For children are not obligated to store up for their parents, but parents for their children.
translation:
  language: tl
  text: 'Tingnan ninyo: ito na ang ikatlong pagkakataon na handa akong pumunta sa inyo,[a] at hindi ako magiging pabigat sa inyo.[b] Sapagkat hindi ang mga pag-aari ninyo ang hinahanap ko, kundi kayo. Hindi tungkulin ng mga anak na mag-ipon para sa kanilang mga magulang, kundi ng mga magulang na mag-ipon para sa kanilang mga anak.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Sa ikatlong pagkakataong ito, handa akong pumunta sa inyo.”'
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang isinaling “magiging pabigat” ay maaaring tumukoy sa pagpapataw ng gastusin o pinansiyal na pasanin sa iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Tingnan ninyo
  rationale: Isang natural na panawag-pansin sa modernong Filipino; pinananatili nito ang puwersa ng salitang Griyego nang hindi gumagamit ng lipas o labis na pormal na pananalita.
- source_word: τρίτον τοῦτο ἑτοίμως ἔχω ἐλθεῖν
  choice: ito ang ikatlong pagkakataong handa akong pumunta
  rationale: Natural sa Filipino at nakatuon sa ikatlong pagkakataon ng pagiging handa ni Pablo; hindi nito tiyak na iginigiit kung ilang pagdalaw ang aktuwal nang naganap.
- source_word: πρὸς ὑμᾶς
  choice: sa inyo
  rationale: Karaniwang ekspresyon sa Filipino para sa pagpunta o pagdalaw sa mga kausap.
- source_word: καταναρκήσω
  choice: magiging pabigat sa inyo
  rationale: Malinaw at natural na katumbas na maaaring tumukoy sa materyal o pinansiyal na pagpapabigat; ipinapaliwanag sa talababa ang mas tiyak na pahiwatig nito.
- source_word: ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς
  choice: hindi ang mga pag-aari ninyo ang hinahanap ko, kundi kayo
  rationale: Pinananatili ang mariing paghahambing sa pagitan ng ari-arian ng mga taga-Corinto at ng mga tao mismo; ginagawang malinaw ang materyal na diwa ng τὰ ὑμῶν.
- source_word: ὀφείλει
  choice: tungkulin
  rationale: Ipinahahayag ang moral o nakaugaliang pananagutan sa isang payak at natural na paraan.
- source_word: θησαυρίζειν
  choice: mag-impok
  rationale: Natural na Filipino para sa pag-iipon o pagtatabi ng yaman, at angkop sa konteksto ng paglalaan ng mga magulang para sa mga anak.
- source_word: γονεῦσιν / γονεῖς
  choice: mga magulang
  rationale: Saklaw ang kapwa ama at ina, gaya ng pangkalahatang kahulugan ng salitang Griyego.
- source_word: τέκνα / τέκνοις
  choice: mga anak
  rationale: Pangkalahatang tawag sa mga anak at hindi nililimitahan sa kasarian o edad.
theological_decisions:
- issue: Kahulugan ng pahayag tungkol sa “ikatlong pagkakataon”
  choice: Iniuugnay ang “ikatlo” sa kasalukuyang pagiging handa ni Pablo na pumunta.
  alternative: Isalin bilang tiyak na ikatlong aktuwal na pagdalaw ni Pablo.
  rationale: Ang pagkakabuo ng Griyego ay maaaring unawain kaugnay ng ikatlong pagkakataon ng paghahanda o balak na pumunta. Pinananatili ng salin ang puwang para sa ganitong pagbasa at hindi nilulutas ang rekonstruksiyon ng kasaysayan ng kanyang mga paglalakbay.
- issue: Larawan ng magulang at mga anak
  choice: Pinananatili bilang pangkalahatang pahayag tungkol sa tungkulin ng mga magulang na mag-impok para sa mga anak.
  alternative: Palawakin ito bilang tahasang doktrina tungkol sa obligasyong pinansiyal ng lahat ng magulang sa lahat ng kalagayan.
  rationale: Ginagamit ni Pablo ang karaniwang ugnayan ng magulang at anak bilang paghahambing upang ipaliwanag ang kanyang pag-iwas na maging pabigat; hindi dapat dagdagan ng salin ang saklaw ng pahayag.
translation_notes:
  register: Modernong Filipino na magalang at marangal ngunit madaling maunawaan. Ginamit ang “Tingnan ninyo” bilang panawag-pansin, “pabigat” para sa idiomatikong linaw, at “mag-impok” upang mapanatili ang diwa ng pag-iipon nang hindi tunog lipas.
