base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/003.yaml
  text: And I know such a man—whether in the body or apart from the body I do not know[a]; God knows—
translation:
  language: tl
  text: At alam ko ang gayong lalaki—kung nasa katawan man o hiwalay sa katawan, hindi ko alam[a]; ang Diyos ang nakaaalam—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “wala sa katawan” sa halip na “hiwalay sa katawan.” Hindi sinasabi ni Pablo kung ang karanasan ay naganap sa katawan o hiwalay sa katawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: alam / nakaaalam
  rationale: Karaniwang katumbas ito ng kaalamang nasa isip. Ginamit ang natural na anyong “kilala ko” kapag tao ang tuwirang layon, at “alam/nakaaalam” sa kasunod na mga sugnay, habang pinananatili ang pag-uulit ng diwa.
- source_word: τὸν τοιοῦτον ἄνθρωπον
  choice: ang gayong lalaki
  rationale: Tumutukoy ito sa tiyak na lalaking inilarawan sa naunang konteksto at pinananatili ang panlalaking isahan at ang di-tuwirang pagtukoy ni Pablo sa sarili.
- source_word: εἴτε ... εἴτε
  choice: kung ... man o
  rationale: Natural na Filipino para sa dalawang posibilidad na inihaharap nang hindi nagpapasiya sa alinman.
- source_word: ἐν σώματι
  choice: nasa katawan
  rationale: Likas at maikli sa Filipino, at malinaw na katapat ng “hiwalay sa katawan.”
- source_word: χωρὶς τοῦ σώματος
  choice: hiwalay sa katawan
  rationale: Ipinahihiwatig ng χωρίς ang pagkakahiwalay. Hindi nito ipinapalagay na tiyak na isang karanasang paglabas sa katawan ang nangyari.
- source_word: οὐκ οἶδα, ὁ θεὸς οἶδεν
  choice: hindi ko alam; ang Diyos ang nakaaalam
  rationale: Pinananatili ang mariing paghahambing sa hindi pagkaalam ni Pablo at pagkaalam ng Diyos.
- source_word: θεὸς
  choice: Diyos
  rationale: Karaniwan at malinaw na salin sa modernong Filipino.
theological_decisions:
- issue: Ang di-tuwirang pagtukoy ni Pablo sa sarili at ang uri ng karanasan
  choice: Pinanatili ang ikatlong-panauhang “gayong lalaki” at hindi tiniyak kung ang karanasan ay nasa katawan o hiwalay dito.
  alternative: Tukuyin nang tahasan si Pablo, gumamit ng “gayong tao,” o isaling para bang tiyak na paglabas sa katawan ang nangyari.
  rationale: Pinananatili ng Griyego ang retorikal na distansiya at sadyang hindi nilulutas kung pisikal o hiwalay sa katawan ang karanasan.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ang “kilala ko” ay mas natural kaysa “alam ko ang gayong lalaki,” samantalang pinananatili ng “alam/nakaaalam” ang kognitibong diwa sa natitirang sugnay. Ginamit ang “nakaaalam” sa pormal na baybay.
