id: 2CO.12.20
reference: 2 Corinthians 12:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: φοβοῦμαι γὰρ μή πως ἐλθὼν οὐχ οἵους θέλω εὕρω ὑμᾶς, κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε, μή πως ⸀ἔρις, ⸀ζῆλος, θυμοί, ἐριθεῖαι, καταλαλιαί, ψιθυρισμοί, φυσιώσεις, ἀκαταστασίαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/020.yaml
  text: For I fear that perhaps when I come I may find you not as I wish[a], and I may be found by you to be as you do not wish—that perhaps there may be strife, jealousy, outbursts of anger, selfish ambition, slanders, whisperings, conceit, and disorder.
translation:
  language: tl
  text: Sapagkat nangangamba ako na baka pagdating ko ay matagpuan ko kayong hindi ayon sa nais ko, at matagpuan ninyo akong hindi ayon sa nais ninyo—baka may mga pag-aaway, inggitan, pagsiklab ng galit, makasariling ambisyon, paninirang-puri, mga bulung-bulungan[a], pagmamataas, at kaguluhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tsismisan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβοῦμαι
  choice: nangangamba ako
  rationale: Ipinahahayag ng pangkasalukuyang pandiwa ang patuloy na pangamba ni Pablo; natural at marangal sa modernong Tagalog ang “nangangamba.”
- source_word: μή πως
  choice: baka
  rationale: Ang dalawang paglitaw nito ay nagpapakilala ng kinatatakutang posibilidad; malinaw at likas sa Tagalog ang “baka.”
- source_word: ἐλθὼν
  choice: pagdating ko
  rationale: Temporal ang gamit ng aorist participle sa konteksto, kaya ang “pagdating ko” ay tuwiran at natural.
- source_word: οὐχ οἵους θέλω εὕρω ὑμᾶς
  choice: matagpuan ko kayong hindi ayon sa nais ko
  rationale: Pinananatili nito ang diwa ng kalagayan o asal na hindi tumutugma sa inaasahan ni Pablo, pati ang pandiwang “matagpuan.”
- source_word: κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε
  choice: at matagpuan ninyo akong hindi ayon sa nais ninyo
  rationale: 'Ginawang aktibo sa natural na Tagalog ngunit pinanatili ang tugunang estruktura: matatagpuan niya sila, at matatagpuan nila siya, kapwa hindi ayon sa nais.'
- source_word: ἔρις
  choice: mga pag-aaway
  rationale: Tumutukoy sa alitan o pagtatalo sa komunidad; ang maramihang anyo ay umaayon sa buong listahan ng mga bisyo.
- source_word: ζῆλος
  choice: inggitan
  rationale: Sa negatibong listahang ito, tumutukoy ito sa selos o inggit sa ugnayan, hindi sa mabuting sigasig.
- source_word: θυμοί
  choice: pagsiklab ng galit
  rationale: Ipinahihiwatig ng maramihang ουσιαστικό ang paulit-ulit o biglaang pagputok ng galit, hindi lamang isang panloob na disposisyon.
- source_word: ἐριθεῖαι
  choice: makasariling ambisyon
  rationale: Naglalarawan ito ng pansariling pagsusulong at pakikipag-agawan ng puwesto o impluwensiya.
- source_word: καταλαλιαί
  choice: paninirang-puri
  rationale: Tumutukoy sa mapanirang pagsasalita laban sa iba; kontemporaryo at malinaw ang salin.
- source_word: ψιθυρισμοί
  choice: mga bulung-bulungan
  rationale: Tumutukoy sa pabulong o lihim na mapanirang usapan; pinananatili sa talababa ang malapit na alternatibong “tsismisan.”
- source_word: φυσιώσεις
  choice: pagmamataas
  rationale: Ang literal na larawan ng pagiging “namamaga” ay idyoma para sa kapalaluan o pagmamataas.
- source_word: ἀκαταστασίαι
  choice: kaguluhan
  rationale: Malawak ang salita para sa kawalan ng kaayusan o kaguluhan; hindi ito nilimitahan sa isang partikular na uri ng gulo.
theological_decisions:
- issue: Himig ng kinatatakutang pagharap ni Pablo
  choice: Kapwa maaaring hindi masiyahan si Pablo at ang mga taga-Corinto sa isa’t isa, at maaaring makita niya sa kanila ang mga bisyong nakalista.
  alternative: Pangunahing nangangamba si Pablo na kailangan niyang gumamit ng apostolikong higpit, o na matutuklasan niya ang impluwensiya ng mga bulaang guro.
  rationale: Ang talata mismo ay nagsasaad ng magkatugong di-pagkagusto at ng mga kasalanang panlipunan, ngunit hindi nito tahasang tinutukoy ang isang doktrinal na sanhi o ang eksaktong anyo ng magiging tugon ni Pablo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang magkatugong “matagpuan” upang mapanatili ang retorikal na balanse ng Griyego, habang ginawang natural sa Tagalog ang ikalawang sugnay. Ang listahan ay isinalin sa karaniwang bokabularyo nang hindi pinapaliit ang saklaw ng mga salita.
