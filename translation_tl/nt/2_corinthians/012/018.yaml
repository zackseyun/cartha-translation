id: 2CO.12.18
reference: 2 Corinthians 12:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: παρεκάλεσα Τίτον καὶ συναπέστειλα τὸν ἀδελφόν· μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος; οὐ τῷ αὐτῷ πνεύματι περιεπατήσαμεν; οὐ τοῖς αὐτοῖς ἴχνεσιν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/018.yaml
  text: I urged Titus to go and sent the brother with him. Titus did not take advantage of you[a], did he? Did we not walk in the same spirit? Did we not walk in the same footsteps?
translation:
  language: tl
  text: Hinimok ko si Tito na pumunta, at ipinadala ko ring kasama niya ang kapatid. Hindi naman kayo sinamantala ni Tito, hindi ba? Hindi ba kami lumakad sa iisang espiritu[a]? Hindi ba kami lumakad sa iisang mga yapak?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng iisang Espiritu,” na maaaring tumukoy sa Espiritu Santo sa halip na sa magkatulad na saloobin o paraan ng pagkilos.
    reason: alternative_reading
lexical_decisions:
- source_word: παρεκάλεσα Τίτον
  choice: Hinimok ko si Tito na pumunta
  rationale: Sa konteksto ng isang praktikal na misyon, ang παρακαλέω ay isang taimtim na pakiusap o paghimok. Likas sa Tagalog ang pagdaragdag ng “na pumunta,” na ipinahihiwatig ng konteksto.
- source_word: συναπέστειλα
  choice: isinugo ko kasama niya
  rationale: Ipinahihiwatig ng tambalang pandiwa ang pagpapadala sa kapatid na kasabay ni Tito. Malinaw at natural itong naipapahayag sa Tagalog sa “isinugo ko kasama niya.”
- source_word: τὸν ἀδελφόν
  choice: ang kapatid
  rationale: May tiyak na pantukoy ang Griyego ngunit walang panghalip na paari. Pinananatili ng “ang kapatid” ang anyo ng teksto at malamang na tumutukoy sa isang kapatid sa pananampalataya na kilala ng mga mambabasa.
- source_word: μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος
  choice: Hindi naman kayo sinamantala ni Tito, hindi ba?
  rationale: Ang μήτι ay nagpapakilala ng tanong na umaasang negatibo ang sagot. Ang “hindi naman ... hindi ba?” ay natural na Tagalog at naipapakita ang inaasahang sagot. Sapat na malawak ang “sinamantala” para sa pagkuha ng pakinabang sa kapinsalaan ng iba, kabilang ang posibleng pinansiyal na pagsasamantala.
- source_word: τῷ αὐτῷ πνεύματι
  choice: sa iisang espiritu
  rationale: Maaaring tumukoy ang parirala sa magkatulad na saloobin o paraan ng pagkilos, ngunit maaari ring marinig bilang pagtukoy sa Espiritu Santo. Pinananatili ng maliit na titik at ng talababa ang tunay na kalabuan.
- source_word: περιεπατήσαμεν
  choice: lumakad kami
  rationale: Pinananatili ng “lumakad” ang karaniwang metapora ni Pablo para sa pamumuhay o pagkilos, at nauunawaan pa rin ito sa modernong Tagalog.
- source_word: τοῖς αὐτοῖς ἴχνεσιν
  choice: sumunod sa iisang mga yapak
  rationale: Ang ἴχνος ay literal na bakas o yapak at metaporikong huwaran ng pagkilos. Natural sa Tagalog ang “sumunod sa ... mga yapak” at pinananatili nito ang larawang-metapora.
theological_decisions:
- issue: Kahulugan ng “iisang espiritu”
  choice: Magkatulad na saloobin o paraan ng pagkilos, na isinulat bilang “espiritu”
  alternative: “sa pamamagitan ng iisang Espiritu,” na tumutukoy sa Espiritu Santo
  rationale: Ang agarang konteksto ay ang pagkakapareho ng integridad at kilos nina Pablo at Tito. Gayunman, hindi lubusang inaalis ng Griyego ang pagtukoy sa Espiritu Santo, kaya pinananatili sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang mga metaporang “lumakad” at “mga yapak,” at iniwasan ang pagdaragdag ng denominasyonal na pagpapakahulugan.
