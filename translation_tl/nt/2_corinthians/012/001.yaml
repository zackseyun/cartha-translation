  naturalness: Mas natural sa modernong Filipino ang dalawang pangungusap na may "Hindi man..." kaysa ang "bagaman...; ngunit..." na magkakasunod. Ang "magpapatuloy ako sa" ay mas idiomatiko para sa paglipat ni Pablo sa susunod na paksa kaysa "tutungo ako sa."
  terminology: Pinanatili ang "magmalaki," "mga pangitain," at "Panginoon." Pinalitan ang "mga pahayag" ng "mga paghahayag" upang maihatid ang kahulugang revelatory disclosure at hindi isang ordinaryong pahayag. Pinananatili ng "ng Panginoon" ang hindi tiyak na ugnayan ng genitive.
