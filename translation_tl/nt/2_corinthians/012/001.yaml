  text: Καυχᾶσθαι ⸀δεῖ· οὐ ⸂συμφέρον μέν⸃, ἐλεύσομαι ⸀δὲ εἰς ὀπτασίας καὶ ἀποκαλύψεις κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/001.yaml
  text: Boasting is necessary[a], though it is not beneficial[b]; but I will go on to visions and revelations of the Lord.
translation:
  language: tl
  text: Kailangan kong magmalaki. Hindi man ito kapaki-pakinabang, magpapatuloy ako sa mga pangitain at mga paghahayag ng Panginoon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “mula sa Panginoon.” Maaaring ipahiwatig ng genitive sa Griyego ang pinagmulan, ngunit mas pinananatili ng “ng Panginoon” ang pananalita at kalabuan ng Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχᾶσθαι
  choice: magmalaki
  rationale: Ang kasalukuyang infinitive ay tumutukoy sa gawaing pagmamalaki. Ang “magmalaki” ay tuwiran at likas sa modernong Filipino at pinananatili ang di-komportableng tema ng sariling pagpuri ni Pablo.
- source_word: δεῖ
  choice: Kailangan kong
  rationale: Ipinahahayag ng δεῖ ang pangangailangan. Ipinakikita ng “kong” ang di-tahasang gumagawa batay sa unang panauhan ng kasunod na pandiwa, nang hindi binabago ang diwa.
- source_word: οὐ συμφέρον μέν
  choice: bagaman hindi ito kapaki-pakinabang
  rationale: Ang συμφέρον ay tumutukoy sa bagay na kapaki-pakinabang o nakabubuti. Ginagamit ang “bagaman” upang natural na maipahayag ang concessive na puwersa ng μέν sa kaugnayan nito sa kasunod na δέ.
- source_word: ἐλεύσομαι δὲ
  choice: ngunit tutungo ako
  rationale: Sa kontekstong ito, ang ἔρχομαι εἰς ay paglipat sa susunod na paksa. Ang “tutungo ako” ay nagpapanatili sa larawang paglapit sa isang paksa, at ang “ngunit” ay kumakatawan sa δέ.
- source_word: εἰς ὀπτασίας
  choice: sa mga pangitain
  rationale: Ang ὀπτασία ay isang pangitain o sobrenatural na tanawin. Ang “mga pangitain” ay malinaw, karaniwan, at tumutugma sa maramihan.
- source_word: καὶ ἀποκαλύψεις
  choice: at mga pahayag
  rationale: Ang ἀποκάλυψις ay pagbubunyag o paghahayag ng dating natatago. Sa pariralang ito, ang “mga pahayag” ay natural at nauunawaan, habang nananatili ang diwa ng ipinabatid na kapahayagan.
- source_word: κυρίου
  choice: ng Panginoon
  rationale: Ang pariralang “ng Panginoon” ay malapit sa anyong genitive ng Griyego at hindi tahasang nagpapasiya kung pinagmulan, pag-aari, o kaugnayan ang ibig sabihin.
theological_decisions:
- issue: Kaugnayan ng κυρίου sa “mga pangitain at mga pahayag”
  choice: ng Panginoon
  alternative: mula sa Panginoon
  rationale: Maaaring ipahiwatig ng genitive ang pinagmulan, ngunit hindi ito tahasang nililinaw ng Griyego. Pinananatili ng “ng Panginoon” ang tunay na kalabuan at teolohikal na pagpipigil ng teksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang karaniwang “magmalaki,” “mga pangitain,” at “Panginoon.” Pinanatili ang bahagyang pormal na “tutungo” upang maipakita ang paglipat ni Pablo sa susunod na paksa nang hindi labis na nagpapaliwanag.
