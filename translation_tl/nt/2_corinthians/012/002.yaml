id: 2CO.12.2
reference: 2 Corinthians 12:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἶδα ἄνθρωπον ἐν Χριστῷ πρὸ ἐτῶν δεκατεσσάρων— εἴτε ἐν σώματι οὐκ οἶδα, εἴτε ἐκτὸς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν— ἁρπαγέντα τὸν τοιοῦτον ἕως τρίτου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/002.yaml
  text: I know a man in Messiah who[a], fourteen years ago—whether in the body I do not know, or outside the body I do not know[c][b], God knows—was caught up to the third heaven.
translation:
  language: tl
  text: May kilala akong lalaking nakay Mesiyas[a] na, labing-apat na taon na ang nakalipas—kung nasa katawan siya ay hindi ko alam, o kung nasa labas ng katawan siya ay hindi ko alam, ang Diyos ang nakaaalam[b]—ay inagaw paitaas hanggang sa ikatlong langit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa nakaugaliang salin, “nakay Cristo.” Ang Griyego ay ἐν Χριστῷ; ginamit dito ang “Mesiyas” upang maipakita ang kahulugan nito bilang titulo.
    reason: alternative_reading
  - marker: b
    text: Hindi nililinaw ni Pablo kung nangyari ito habang nasa katawan o nasa labas ng katawan. Sadyang nananatiling hindi tiyak sa teksto ang paraan ng karanasang ito.
    reason: lexical_alternative
  - marker: c
    text: Ang “ikatlong langit” ay sinaunang pananalitang Judio tungkol sa makalangit na dako, na iniuugnay sa kasunod na talata sa paraiso. Pinananatili rito ang mismong ekspresyon sa halip na palitan ito ng isang interpretasyon.
    reason: cultural_note
lexical_decisions:
- source_word: οἶδα
  choice: May kilala ako
  rationale: Ang perfect-form na οἶδα ay may pangkasalukuyang diwa sa Koine. Likas sa Tagalog ang “May kilala ako” kapag ipinakikilala ang isang taong kilala ng nagsasalita.
- source_word: ἄνθρωπον
  choice: isang lalaki
  rationale: Tumutukoy ito rito sa isang tiyak na lalaking indibidwal; pinananatili ng salin ang kasariang ipinahihiwatig ng konteksto.
- source_word: ἐν Χριστῷ
  choice: nakay Mesiyas
  rationale: Pinananatili ang kahulugan ng Χριστός bilang titulo at ang pormulang Paulino ng pagiging “nasa” Mesiyas. Ang “nakay” ang natural at maikli ngunit hindi nito lubos na ipinaliliwanag ang ugnayang tinutukoy.
- source_word: πρὸ ἐτῶν δεκατεσσάρων
  choice: labing-apat na taon na ang nakalipas
  rationale: Natural na katumbas sa Tagalog ng pariralang χρονolohikal na may πρό at genitive.
- source_word: εἴτε ἐν σώματι
  choice: kung nasa katawan
  rationale: Tuwirang pinananatili ang kaibahan ng “nasa katawan” at “nasa labas ng katawan,” gayundin ang kawalang-katiyakan ni Pablo.
- source_word: ἐκτὸς τοῦ σώματος
  choice: nasa labas ng katawan
  rationale: Malinaw at tuwirang katumbas ng ἐκτός na may genitive, at kapantay sa anyo ng “nasa katawan.”
- source_word: ὁ θεὸς οἶδεν
  choice: ang Diyos ang nakaaalam
  rationale: Tapat sa sugnay nang hindi idinaragdag ang “tanging,” na hindi tahasang nasa Griyego.
- source_word: ἁρπαγέντα
  choice: inagaw paitaas
  rationale: Ipinahahayag ang malakas at biglaang puwersa ng aorist passive na ἁρπάζω at ang paitaas na direksiyong malinaw sa konteksto.
- source_word: τὸν τοιοῦτον
  choice: ang lalaking iyon (ipinahihiwatig sa balangkas ng pangungusap)
  rationale: Sa natural na Tagalog, hindi na kailangang ulitin ang demonstratibong parirala; ang panaguring “ay inagaw” ay malinaw na bumabalik sa lalaking unang binanggit.
- source_word: ἕως τρίτου οὐρανοῦ
  choice: hanggang sa ikatlong langit
  rationale: Tuwirang pinananatili ang ἕως at ang sinaunang ekspresyong “ikatlong langit” nang hindi ito binibigyang-kahulugang lampas sa teksto.
theological_decisions:
- issue: Pagsasalin sa Χριστῷ sa pariralang ἐν Χριστῷ
  choice: nakay Mesiyas
  alternative: nakay Cristo
  rationale: Isinasalin ang titulo bilang “Mesiyas” at pinananatili ang relasyonal na pormulang ἐν Χριστῷ sa natural na Tagalog.
- issue: Paraan ng karanasan ni Pablo
  choice: Pinananatiling hindi tiyak kung nangyari ito habang nasa katawan o nasa labas ng katawan.
  alternative: Tiyak na pag-akyat ng katawan, o tiyak na pangitain/karanasang hiwalay sa katawan
  rationale: Dalawang ulit na sinasabi ng Griyego na hindi niya alam, at sa Diyos lamang iniuukol ang kaalaman; hindi dapat lutasin ng salin ang sadyang hindi nilutas ng teksto.
- issue: Kahulugan ng “ikatlong langit”
  choice: Pinanatili ang mismong ekspresyon.
  alternative: Pinakamataas na langit o paraiso
  rationale: Ang pagpapalit nito ng isang interpretasyon ay magpapaliit sa saklaw ng sinaunang kosmolohikal na pananalita; ang talata mismo ay nagsasabing “ikatlong langit.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “May kilala akong isang lalaki” bilang likas na pambungad, ngunit pinanatili ang mahahabang pagsingit at pag-uulit ng kawalang-katiyakan upang maingatan ang retorika at tensiyon ng Griyego. Lahat ng talababa ay may katugmang marker sa pangunahing teksto.
