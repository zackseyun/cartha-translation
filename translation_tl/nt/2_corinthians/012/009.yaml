id: 2CO.12.9
reference: 2 Corinthians 12:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἴρηκέν μοι· Ἀρκεῖ σοι ἡ χάρις μου· ἡ γὰρ ⸀δύναμις ἐν ἀσθενείᾳ ⸀τελεῖται. ἥδιστα οὖν μᾶλλον καυχήσομαι ἐν ταῖς ἀσθενείαις ⸀μου, ἵνα ἐπισκηνώσῃ ἐπ’ ἐμὲ ἡ δύναμις τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/009.yaml
  text: And he has said to me[a], “My grace is sufficient for you, for my power is made perfect in weakness.” Therefore I will boast all the more gladly in my weaknesses[d][c][b], so that the power of Messiah may dwell upon me.
translation:
  language: tl
  text: At sinabi niya sa akin, “Sapat sa iyo ang biyaya ko, sapagkat ang kapangyarihan ay nagiging ganap sa kahinaan.” Kaya buong galak kong lalo pang ipagmamalaki ang aking mga kahinaan, upang lumukob sa akin ang kapangyarihan ng Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “lumukob sa akin” ay maaari ring isaling “manahan sa akin” o “sumalalay sa akin”; mas literal, “magtayo ng tolda sa ibabaw ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκέν
  choice: sinabi niya
  rationale: Ang perpektong aspekto ay nagpapahiwatig ng sinabi noon na nananatiling mahalaga; sa natural na modernong Tagalog, sapat na naipahihiwatig ito ng konteksto sa “sinabi niya.”
- source_word: Ἀρκεῖ
  choice: Sapat
  rationale: Direkta, natural, at malinaw na nagpapahayag ng kasapatan.
- source_word: χάρις
  choice: biyaya
  rationale: Karaniwang salin sa gamit ni Pablo at pinananatili ang masaklaw na teolohikal na diwa ng mapagpalang kaloob ng Diyos.
- source_word: δύναμις
  choice: kapangyarihan
  rationale: Pinananatili ang pag-uulit ng parehong pangngalan at ang kaibahan nito sa kahinaan.
- source_word: ἀσθενείᾳ / ἀσθενείαις
  choice: kahinaan / mga kahinaan
  rationale: Pinananatili ang paglipat mula sa pangkalahatang isahan tungo sa mga tiyak na kahinaan ni Pablo sa maramihan.
- source_word: τελεῖται
  choice: nagiging ganap
  rationale: Natural sa Tagalog at naipapahayag ang pagdating sa ganap na pagpapakita o katuparan nang hindi kailangang ipahiwatig na may moral na kapintasan ang kapangyarihan.
- source_word: ἥδιστα … μᾶλλον
  choice: buong galak kong lalo pang
  rationale: Pinananatili ang masidhing galak at ang paghahambing na diin sa isang natural na ayos sa Tagalog.
- source_word: καυχήσομαι
  choice: ipagmamalaki
  rationale: Pinananatili ang retorikal na kabalintunaan ng pagmamalaki sa mga kahinaan.
- source_word: ἐπισκηνώσῃ ἐπ’ ἐμέ
  choice: manahan sa akin
  rationale: Nababasa nang natural at pinananatili ang larawan ng pananahan; ang mas literal na larawan ng pagtatayo ng tolda sa ibabaw ay inilagay sa talababa.
- source_word: Χριστοῦ
  choice: ng Mesiyas
  rationale: Dito ay angkop ang titulong “Mesiyas,” hindi lamang ang anyong parang personal na pangalan.
theological_decisions:
- issue: Kung may “ko” bago ang δύναμις
  choice: ang kapangyarihan ko
  alternative: ang kapangyarihan
  rationale: May mahalagang tekstuwal na pagkakaiba sa puntong ito; ang pangunahing teksto ay sumusunod sa pagbasa na may unang panauhang panghalip, habang tahasang itinatala sa talababa ang pagbasa na wala nito.
- issue: Kahulugan ng τελεῖται kaugnay ng kapangyarihan ng Diyos
  choice: nagiging ganap
  alternative: dinadala sa kaganapan; nagiging lubos
  rationale: Pinananatili nito ang tensiyon ng pahayag na lubos na nahahayag o umaabot sa layon ang kapangyarihan sa gitna ng kahinaan, nang hindi ito labis na ipinapaliwanag.
- issue: Paglalarawan sa Χριστοῦ
  choice: ng Mesiyas
  alternative: ni Cristo
  rationale: Pinananatili ang titularyong kahulugan ng Χριστός sa kontekstong ito nang hindi nagdaragdag ng denominasyonal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na dignipikado ngunit madaling maunawaan. Ginamit ang “buong galak kong lalo pang ipagmamalaki” upang natural na pagsamahin ang diin ng ἥδιστα at μᾶλλον. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
