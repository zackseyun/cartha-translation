    rationale: Ang pandiwa ay may larawang paglalatag ng tolda o paglukob sa ibabaw/sa isang tao. Ang “lumukob sa akin,” na may talababa para sa mas literal na larawan, ay mas malapit sa saklaw ng parirala.
