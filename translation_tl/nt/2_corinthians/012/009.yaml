  source_fidelity: Kailangang alisin ang “ko” sa ikalawang paglitaw ng “kapangyarihan.” Sa SBLGNT na ibinigay, walang panghalip na μου sa pariralang ἡ γὰρ δύναμις ἐν ἀσθενείᾳ τελεῖται. Hindi ito dapat ilarawan bilang isang alternatibong pagbasa ng sinaunang mga manuskrito sa talababa. Ang “lumukob sa akin” ay mas tumpak na naipahihiwatig ang ἐπισκηνώσῃ ἐπ’ ἐμέ kaysa sa simpleng “manahan sa akin,” habang nananatiling natural sa Tagalog.
  naturalness: Malinaw at dignipikado ang salin. Natural ang “buong galak kong lalo pang ipagmamalaki,” at napapanatili nito ang diin ng ἥδιστα at μᾶλλον.
  terminology: Ang “biyaya,” “kapangyarihan,” “kahinaan,” at “Mesiyas” ay angkop at magkakatugma. Pinananatili ng “Mesiyas” ang titularyong diwa ng Χριστοῦ.
