  terminology: Pinanatili ang “aking Diyos,” “magluksa,” “karumihan,” “seksuwal na imoralidad,” at “kahalayan.” Ang mga ito ay angkop sa modernong Filipino Tagalog at hindi pinakikitid ang saklaw ng ἀκαθαρσία, πορνεία, o ἀσέλγεια.
