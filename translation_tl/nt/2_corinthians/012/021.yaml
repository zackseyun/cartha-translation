  to: Natatakot ako na kapag muli akong dumating, baka pakumbabain ako ng aking Diyos sa inyong harapan,[a] at magluksa ako dahil sa marami sa mga dati nang nagkasala at hindi nagsisi sa karumihan, seksuwal na imoralidad, at kahalayan[b] na kanilang ginawa.
