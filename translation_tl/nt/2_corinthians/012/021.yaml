id: 2CO.12.21
reference: 2 Corinthians 12:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μὴ πάλιν ⸂ἐλθόντος μου⸃ ⸀ταπεινώσῃ ⸀με ὁ θεός μου πρὸς ὑμᾶς, καὶ πενθήσω πολλοὺς τῶν προημαρτηκότων καὶ μὴ μετανοησάντων ἐπὶ τῇ ἀκαθαρσίᾳ καὶ πορνείᾳ καὶ ἀσελγείᾳ ᾗ ἔπραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/021.yaml
  text: I fear that when I come again[a], my God may humble me before you[d][c][b], and I will mourn over many who have sinned before and have not repented of the impurity and sexual immorality and sensuality that they practiced.
translation:
  language: tl
  text: Natatakot ako na kapag muli akong dumating, baka pakumbabain ako ng aking Diyos sa inyong harapan,[a] at magluksa ako dahil sa marami sa mga dati nang nagkasala at hindi nagsisi sa karumihan, seksuwal na imoralidad, at kahalayan[b] na kanilang ginawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ibaba ang kalagayan ko” o “ipahiya ako.” Ang pandiwang Griyego ay maaaring mangahulugang pakumbabain, ibaba, o ipahiya, ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Ang “kahalayan” ay maaari ring isaling “walang-pigil at walang-hiyang imoral na asal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάλιν ἐλθόντος μου
  choice: sa muli kong pagdating
  rationale: Ipinagpapatuloy ng μή ang ipinahihiwatig na pahayag ng pangamba mula sa naunang talata; natural na ipinahayag ito sa Tagalog bilang kalagayang inaasahan sa susunod na pagdalaw ni Pablo.
- source_word: ταπεινώσῃ με
  choice: baka ibaba ako
  rationale: Maaaring mangahulugan ang ταπεινόω na magpakumbaba, magpababa, o humamak. Ang “ibaba ako” ay nagpapanatili sa diwang dadalhin si Pablo sa mababang kalagayan nang hindi ipinapalagay na tiyak na hayagang ipapahiya siya.
- source_word: ὁ θεός μου
  choice: ang Diyos ko
  rationale: Tuwirang pinananatili ang personal na kaugnayang ipinahahayag ng possessive na Griyego.
- source_word: πρὸς ὑμᾶς
  choice: sa harap ninyo
  rationale: Ipinahihiwatig ng parirala na mangyayari ang pagpapababa kay Pablo sa kanilang presensya; posible rin ang mas malawak na “sa gitna ninyo.”
- source_word: πενθήσω
  choice: magluksa ako
  rationale: Ang πενθέω ay matinding pagdadalamhati o panaghoy; mas napapanatili ng “magluksa” ang bigat kaysa sa karaniwang “malungkot.”
- source_word: πολλοὺς τῶν προημαρτηκότων
  choice: marami sa mga nagkasala noon
  rationale: Pinananatili ng “marami sa mga” ang partitive na anyo, samantalang ang “nagkasala noon” ay nagpapahayag ng naunang pagkakasala na nananatiling mahalaga sa kasalukuyang kalagayan.
- source_word: μὴ μετανοησάντων
  choice: hindi nagsisi
  rationale: Malinaw at natural itong nagpapahayag na hindi sila tumalikod nang may pagsisisi sa mga kasalanang binanggit.
- source_word: ἀκαθαρσίᾳ
  choice: karumihan
  rationale: Malawak ang saklaw ng salita sa moral na karumihan at hindi ito nililimitahan sa isang uri lamang ng pagkakasala.
- source_word: πορνείᾳ
  choice: seksuwal na imoralidad
  rationale: Makabagong malinaw na katumbas ito ng πορνεία at hindi ito pinakikitid sa isang partikular na seksuwal na kasalanan.
- source_word: ἀσελγείᾳ
  choice: kahalayan
  rationale: Tumutukoy ito sa walang-pigil at walang-hiyang asal, madalas na seksuwal; likas at dignified na katumbas sa modernong Tagalog ang “kahalayan.”
- source_word: ᾗ ἔπραξαν
  choice: na kanilang ginawa
  rationale: Ang relative pronoun ay tumutukoy nang sama-sama sa tatlong bisyong nabanggit. Natural ang “ginawa,” bagaman maaari ring ipahiwatig ng πράσσω ang paulit-ulit na pagsasagawa.
theological_decisions:
- issue: Lakas ng pahayag na may μή at ng ipinahihiwatig na pandiwa ng pagkatakot mula sa talata 20
  choice: Ginawang tahasang “Natatakot ako na ... baka”
  alternative: “Baka sa muli kong pagdating ay ibaba ako...”
  rationale: Nakadepende ang sugnay sa pahayag ng pangamba sa naunang talata. Ang pag-uulit ng “Natatakot ako” ay kailangan para maging malinaw at likas sa Tagalog, nang hindi ginagawang tiyak na mangyayari ang kinatatakutan.
- issue: Kahulugan ng pagpapababa ng Diyos kay Pablo
  choice: “ibaba ako ng Diyos ko sa harap ninyo”
  alternative: “ipahiya ako ng Diyos ko sa gitna ninyo”
  rationale: Pinananatili ng pangunahing teksto ang mas malawak na kahulugan ng ταπεινόω at hindi ipinapalagay na pampublikong kahihiyan lamang ang tinutukoy.
- issue: Pagkakaiba ng tatlong terminong moral
  choice: “karumihan, seksuwal na imoralidad, at kahalayan”
  alternative: “karumihan, pakikiapid, at kalaswaan”
  rationale: Pinananatiling magkakahiwalay ngunit magkakaugnay ang tatlong termino, at iniiwasang paliitin ang πορνεία sa isang tiyak na anyo ng seksuwal na kasalanan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “seksuwal na imoralidad” bilang madaling maunawaang malawak na katawagan; pinanatili ang “magluksa” upang maipahayag ang tindi ng damdamin ni Pablo. Ang mga pang-ugnay at ayos ng sugnay ay ginawang natural sa Tagalog habang pinananatili ang pagkakasunod at tensiyon ng Griyego.
