id: 2CO.12.19
reference: 2 Corinthians 12:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Πάλαι δοκεῖτε ὅτι ὑμῖν ἀπολογούμεθα; ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν. τὰ δὲ πάντα, ἀγαπητοί, ὑπὲρ τῆς ὑμῶν οἰκοδομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/019.yaml
  text: Have you been thinking all along that we are defending ourselves to you? Before God[a], in Messiah, we are speaking. And everything, beloved[b], is for your building up.
translation:
  language: tl
  text: Matagal na ba ninyong iniisip na ipinagtatanggol namin ang aming sarili sa inyo? Sa harap ng Diyos, sa Mesiyas, kami ay nagsasalita. At lahat ng ito, mga minamahal, ay para sa inyong ikatitibay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kay Cristo.” Ang “Cristo” ay tradisyonal na anyo ng titulong isinaling “Mesiyas”; ang pariralang “sa Mesiyas” ay maaaring tumukoy sa saklaw ng kaugnayan sa kanya.
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλαι
  choice: sa buong panahong ito
  rationale: Ipinahihiwatig dito ang palagay na nagpapatuloy hanggang sa kasalukuyan, hindi lamang ang isang pangyayari noong unang panahon.
- source_word: δοκεῖτε
  choice: Iniisip ba ninyo
  rationale: Likas itong retorikal na tanong sa modernong Tagalog at malinaw na tumutukoy sa palagay ng mga mambabasa.
- source_word: ἀπολογούμεθα
  choice: ipinagtatanggol namin ang aming sarili
  rationale: Pinananatili nito ang diwang pansariling pagtatanggol nang hindi gumagamit ng teknikal na wikang legal.
- source_word: κατέναντι θεοῦ
  choice: sa harap ng Diyos
  rationale: Ipinahahayag nito kapwa ang presensiya ng Diyos at ang pananagutan ng nagsasalita sa kanya.
- source_word: ἐν Χριστῷ
  choice: sa pakikipag-isa sa Mesiyas
  rationale: Ipinakikita nito ang relasyonal na saklaw ng ἐν Χριστῷ at pinananatiling titulo ang Χριστός; hindi nito basta ginagawang personal na pangalan ang salita.
- source_word: λαλοῦμεν
  choice: Nagsasalita kami
  rationale: Direkta, kasalukuyan, at natural sa Tagalog.
- source_word: τὰ δὲ πάντα
  choice: At ang lahat ng ito
  rationale: Ang 'ito' ay likas na tumutukoy sa kabuuan ng sinasabi at ginagawa ni Pablo sa konteksto, habang ang 'at' ay angkop sa mahinang dugtong na δέ.
- source_word: ἀγαπητοί
  choice: mga minamahal
  rationale: Pinananatili ang magiliw na panawagan at ang ugnayang leksikal nito sa pag-ibig.
- source_word: ὑπὲρ τῆς ὑμῶν οἰκοδομῆς
  choice: para sa inyong ikatitibay
  rationale: Malinaw sa karaniwang mambabasa ang layuning palakasin sila sa pananampalataya, nang hindi gumagamit ng di-gaanong pangkaraniwang 'edipikasyon.'
theological_decisions:
- issue: Pagkasalin sa Χριστῷ
  choice: Mesiyas
  alternative: Cristo
  rationale: Gumaganap dito bilang titulo ang Χριστός. Isinalin ang pariralang ἐν Χριστῷ bilang 'sa pakikipag-isa sa Mesiyas' upang ihayag ang kaugnayan o pakikiisa nang hindi lubusang nilulutas ang lawak ng metapora.
- issue: Kahulugan ng οἰκοδομή
  choice: ikatitibay
  alternative: ikauunlad; ikatatatag; pagtatayo sa inyo
  rationale: Metaporikal ang salita para sa espirituwal na pagpapatatag. Ang 'ikatitibay' ay natural at hindi nag-aangkin ng mas tiyak na doktrinal na kahulugan kaysa sa pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang 'mga minamahal' bilang magiliw ngunit hindi kolokyal na panawagan. Iniwasan ang teknikal na 'edipikasyon' at pinili ang likas na 'ikatitibay.'
