source:
  edition: SBLGNT
  text: καὶ τῇ ὑπερβολῇ τῶν ἀποκαλύψεων. ⸀διὸ ἵνα μὴ ὑπεραίρωμαι, ἐδόθη μοι σκόλοψ τῇ σαρκί, ἄγγελος ⸀Σατανᾶ, ἵνα με κολαφίζῃ, ⸂ἵνα μὴ ὑπεραίρωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/007.yaml
  text: And because of the surpassing greatness of the revelations—so that I might not exalt myself—a thorn in the flesh was given to me[a], a messenger of Satan, so that it might torment me[e][d][c][b], so that I might not exalt myself.
translation:
  language: tl
  text: At dahil sa lubhang dakilang mga paghahayag—upang hindi ako magmataas—ibinigay sa akin ang isang tinik sa laman[a], isang sugo ni Satanas[b], upang paulit-ulit akong suntukin[c], upang hindi ako magmataas[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang tulos sa laman.” Ang salitang Griyego na σκόλοψ ay maaaring tumukoy sa matulis na tulos, tinik, o maliit na matulis na tipak; hindi tiyak ang eksaktong larawan.
    reason: lexical_alternative
  - marker: b
    text: O “isang anghel ni Satanas.” Ang salitang Griyego na ἄγγελος ay maaaring mangahulugang “sugo” o “anghel.”
    reason: alternative_reading
  - marker: c
    text: O “upang pahirapan ako” o “upang hampasin ako.” Ang pandiwang Griyego na κολαφίζῃ ay literal na tumutukoy sa pananakit sa pamamagitan ng suntok o paghampas.
    reason: lexical_alternative
  - marker: d
    text: Dalawang ulit lumilitaw sa tekstong Griyego ang pariralang “upang hindi ako magmataas,” kaya pinanatili rito ang pag-uulit.
    reason: textual_transparency
lexical_decisions:
- source_word: ὑπερβολῇ τῶν ἀποκαλύψεων
  choice: di-pangkaraniwang kadakilaan ng mga pahayag
  rationale: Ipinahahayag ang pambihirang laki o tindi ng mga banal na pagsisiwalat nang hindi ginagawang teknikal ang pananalita.
- source_word: ὑπεραίρωμαι
  choice: itaas ang aking sarili
  rationale: Pinananatili ang larawan ng labis na pagtataas sa sarili at ang pag-uulit ng parirala sa Griyego.
- source_word: ἐδόθη μοι
  choice: binigyan ako
  rationale: Pinananatili ang balintiyak na diwa nang hindi tahasang tinutukoy kung sino ang nagbigay.
- source_word: σκόλοψ τῇ σαρκί
  choice: isang tinik sa laman
  rationale: Pinananatili ang matalim ngunit hindi tiyak na metapora at iniiwasang tukuyin kung anong uri ng paghihirap ito.
- source_word: ἄγγελος Σατανᾶ
  choice: isang sugo ni Satanas
  rationale: Ang “sugo” ay sapat na malawak upang hindi pagpasyahan kung ang tinutukoy ay anghel, espiritung nilalang, o ibang ahente.
- source_word: κολαφίζῃ
  choice: paulit-ulit akong hampasin
  rationale: Ipinahahayag ang literal na larawan ng paulit-ulit na pananakit o pagsuntok, na mas malapit sa pandiwang Griyego kaysa sa mas pangkalahatang “pahirapan.”
theological_decisions:
- issue: Ang likas na katangian ng “tinik sa laman”
  choice: Pinanatili ang metapora nang hindi tinutukoy ang eksaktong paghihirap.
  alternative: Sakit sa katawan, pag-uusig, o pagsalakay ng demonyo.
  rationale: Hindi nililinaw ng teksto kung ano mismo ang tinik.
- issue: Ang kumilos sa “binigyan ako”
  choice: Hindi pinangalanan ang nagbigay.
  alternative: “Binigyan ako ng Diyos” o “ipinahintulot ito.”
  rationale: Balintiyak ang Griyego; maaaring ipinahihiwatig ang pahintulot ng Diyos, ngunit hindi ito tahasang sinasabi.
- issue: Ang pagkakakilanlan ng ἄγγελος Σατανᾶ
  choice: “isang sugo ni Satanas”
  alternative: “isang anghel ni Satanas”
  rationale: Pinananatili ng “sugo” ang saklaw at kalabuan ng ἄγγελος.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang metaporang “tinik sa laman,” ang balintiyak na pagkakabuo, at ang sinadyang pag-uulit ng huling layuning parirala.
