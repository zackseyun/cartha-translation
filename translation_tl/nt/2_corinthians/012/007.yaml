  to: At dahil sa lubhang dakilang mga paghahayag—upang hindi ako magmataas—ibinigay sa akin ang isang tinik sa laman[a], isang sugo ni Satanas[b], upang paulit-ulit akong suntukin[c], upang hindi ako magmataas[d].
  rationale: Pinalitan ang “mga pahayag” ng “mga paghahayag” upang maipakita ang kahulugan ng ἀποκαλύψεις. Pinakinis ang paglalarawan ng pambihirang laki ng mga paghahayag at ginawang mas likas ang ὑπεραίρωμαι bilang “magmataas.” Ang “ibinigay sa akin” ay nagpapanatili ng di-pinangalanang ahensiya ng balintiyak na Griyego. Ang “suntukin” at ang tala nito ay mas tapat sa κολαφίζῃ, ngunit hindi nagsasaad kung literal o metaporikal ang paghihirap. Iningatan din ang kawalang-katiyakan ng σκόλοψ at ἄγγελος.
