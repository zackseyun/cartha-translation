revisions:
- from: Ngunit buong galak akong gugugol at lubusang magpapagugol para sa inyo.[a] Kung lalo ko kayong minamahal, lalo ba ninyo akong hindi minamahal?
  to: Ngunit buong galak kong gugugulin ang lahat, at ako man ay lubusang mauubos para sa inyo.[a] Kung lalo ko kayong minamahal, mas kaunti ba ang pagmamahal ninyo sa akin?
  rationale: Pinalitan ang causative na “magpapagugol” ng “ako man ay lubusang mauubos” upang tumpak na maipahayag ang pinaigting na passive na ἐκδαπανηθήσομαι at mapanatili ang pag-unlad mula sa paggugol ng taglay tungo sa pagkaubos ng sarili. Inayos ang pangwakas na retorikal na tanong upang malinaw na maipakita ang paghahambing na ‘minamahal nang mas kaunti,’ hindi ang ganap na kawalan ng pagmamahal.
