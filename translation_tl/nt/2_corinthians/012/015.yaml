  text: ἐγὼ δὲ ἥδιστα δαπανήσω καὶ ἐκδαπανηθήσομαι ὑπὲρ τῶν ψυχῶν ὑμῶν. ⸀εἰ περισσοτέρως ὑμᾶς ⸀ἀγαπῶν, ἧσσον ἀγαπῶμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/015.yaml
  text: But I will most gladly spend and be spent for your souls. If I love you more abundantly[a], am I loved less?
translation:
  language: tl
  text: Ngunit buong galak kong gugugulin ang lahat, at ako man ay lubusang mauubos para sa inyo.[a] Kung lalo ko kayong minamahal, mas kaunti ba ang pagmamahal ninyo sa akin?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa inyong mga buhay” o “para sa inyong mga kaluluwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδιστα
  choice: buong galak
  rationale: Ipinahahayag ang napakataas na antas ng kusang-loob at masayang kahandaan ni Pablo, sa natural na modernong Tagalog.
- source_word: δαπανήσω
  choice: akong gugugol
  rationale: Pinananatili ang talinghaga ng paggastos o pag-uubos ng sariling yaman para sa kapakanan ng iba.
- source_word: ἐκδαπανηθήσομαι
  choice: lubusang magpapagugol
  rationale: Ipinakikita ng pinaigting na pandiwa na hindi lamang ang taglay ni Pablo ang gugugulin niya kundi maging ang sarili niya; pinananatili rin ang ugnayan nito sa naunang 'gugugol.'
- source_word: ὑπὲρ
  choice: para sa
  rationale: Natural at tuwirang nagpapahayag ng kapakinabangan o kapakanan ng mga taga-Corinto.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: sa inyo
  rationale: Sa kontekstong ito, ang ψυχαί ay tumutukoy sa kanilang buong pagkatao o buhay, hindi kinakailangang sa isang hiwalay na sangkap na tinatawag na kaluluwa. Ang 'sa inyo' ang pinakanatural na katumbas sa Tagalog, habang inilalahad sa talababa ang mas literal na mga posibilidad.
- source_word: εἰ
  choice: Kung
  rationale: Pinananatili ang anyong kondisyonal at ang retorikal na puwersa nang hindi ito ginagawang tahasang sanhi sa pamamagitan ng 'yamang.'
- source_word: περισσοτέρως
  choice: lalo
  rationale: Natural na pahambing sa Tagalog na naghahatid ng mas mataas na antas ng pagmamahal.
- source_word: ἀγαπῶν
  choice: ko kayong minamahal
  rationale: Isinalin ang participle bilang pandiwang may tahasang simuno upang maging natural ang retorikal na tanong sa Tagalog.
- source_word: ἧσσον
  choice: lalo ... hindi
  rationale: Ang idyomang Tagalog na 'lalo ba ... hindi' ay natural na naghahatid ng paghahambing na 'minamahal nang mas kaunti,' at malinaw na itinatapat sa naunang 'lalo.'
- source_word: ἀγαπῶμαι
  choice: ninyo akong hindi minamahal
  rationale: Isinaayos mula passive tungong aktibo dahil mas natural ito sa Tagalog, habang pinananatili ang tumatanggap ng kilos at ang patuloy na kalagayang ipinahihiwatig ng present tense.
theological_decisions:
- issue: Kahulugan ng ψυχαί sa pastoral na konteksto
  choice: sa inyo
  alternative: para sa inyong mga kaluluwa; para sa inyong mga buhay
  rationale: Maaaring tumukoy ang ψυχή sa kaluluwa, buhay, o mismong tao. Iniiwasan ng pangunahing salin ang hindi kinakailangang teknikal na paghahati ng pagkatao, ngunit pinananatili sa talababa ang tunay na lawak ng salitang Griyego.
- issue: Puwersa ng huling retorikal na tanong
  choice: Kung lalo ko kayong minamahal, lalo ba ninyo akong hindi minamahal?
  alternative: Kung higit ko kayong minamahal, mas kaunti ba ang pagmamahal ninyo sa akin?
  rationale: Pinananatili ang kondisyonal na anyo at masakit na kabalintunaan ng tanong. Ang napiling ayos ay natural sa Tagalog at hindi ginagawang tahasang pahayag ang ipinahihiwatig lamang ng tanong.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang magkaugnay na talinghaga ng 'gugugol' at 'magpapagugol,' at gumamit ng natural na aktibong ayos sa huling sugnay.
