  text: Did I exploit you through any of those whom I sent to you?[a]
translation:
  language: tl
  text: May sinuman ba sa mga isinugo ko sa inyo na ginamit ko para samantalahin kayo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “samantalahin kayo” o “dayain kayo.” Ang pandiwang Griyego ay tumutukoy sa pagkakamit ng pakinabang sa kapinsalaan ng iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή
  choice: May ... ba
  rationale: Binubuo nito ang isang retorikal na tanong na umaasang ‘wala’ ang sagot; natural itong ipinahahayag sa Tagalog sa pamamagitan ng tanong na may ‘ba.’
- source_word: τινα ὧν ἀπέσταλκα πρὸς ὑμᾶς
  choice: sinuman sa mga isinugo ko sa inyo
  rationale: Pinananatili nito ang partitive na diwa—sinumang kabilang sa pangkat ng mga taong isinugo ni Pablo—sa natural na makabagong Tagalog.
- source_word: δι’ αὐτοῦ
  choice: na ginamit ko upang
  rationale: Ang literal na ‘sa pamamagitan niya’ ay may isahang reperensiya sa bawat posibleng sugo. Ang ‘na ginamit ko upang’ ay natural na naghahayag sa Tagalog na ang sugo ang sinasabing naging kasangkapan ng pagsasamantala, nang hindi binabago ang diwa.
- source_word: ἐπλεονέκτησα
  choice: pagsamantalahan
  rationale: Ipinahihiwatig ng pandiwa ang pagkakamit ng pakinabang sa kapinsalaan ng iba. Ang ‘pagsamantalahan’ ay malinaw, kasalukuyan, at hindi labis na nililimitahan ang kahulugan sa teknikal na pandaraya.
- source_word: ὑμᾶς
  choice: kayo
  rationale: Tumutukoy ito nang maramihan sa mga mananampalataya sa Corinto.
