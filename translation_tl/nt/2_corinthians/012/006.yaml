  to: Sapagkat kung nanaisin kong magmalaki, hindi ako magiging hangal, dahil katotohanan ang sasabihin ko. Ngunit nagpipigil ako upang huwag akong ituring ninuman nang higit kaysa sa nakikita niya sa akin o sa anumang naririnig niya mula sa akin.
