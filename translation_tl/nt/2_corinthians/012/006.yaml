source:
  edition: SBLGNT
  text: ἐὰν γὰρ θελήσω καυχήσασθαι, οὐκ ἔσομαι ἄφρων, ἀλήθειαν γὰρ ἐρῶ· φείδομαι δέ, μή τις εἰς ἐμὲ λογίσηται ὑπὲρ ὃ βλέπει με ἢ ἀκούει ⸀τι ἐξ ἐμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/006.yaml
  text: For if I should want to boast[a], I would not be foolish, for I would be speaking the truth. But I refrain, so that no one may reckon me above what he sees in me or hears from me.
translation:
  language: tl
  text: Sapagkat kung nanaisin kong magmalaki, hindi ako magiging hangal, dahil katotohanan ang sasabihin ko. Ngunit nagpipigil ako upang huwag akong ituring ninuman nang higit kaysa sa nakikita niya sa akin o sa anumang naririnig niya mula sa akin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θελήσω
  choice: nanaisin
  rationale: Ang aorist subjunctive na kasama ng ἐὰν ay nagpapahayag ng isang posibleng kalagayan; likas na naihahatid ng “kung nanaisin” ang hipotetikal na diwa.
- source_word: καυχήσασθαι
  choice: magmalaki
  rationale: Ito ang malinaw at karaniwang katumbas sa makabagong Filipino, at napananatili nito ang diwa ng pagyayabang o sariling pagpuri sa konteksto.
- source_word: ἄφρων
  choice: hangal
  rationale: Tuwirang inilalarawan nito ang pagiging walang-katwiran at nananatili ang ugnayan sa ironikong pananalita ni Pablo tungkol sa kahangalan.
- source_word: ἀλήθειαν ... ἐρῶ
  choice: katotohanan ang sasabihin ko
  rationale: Pinananatili nito ang hinaharap na anyo ng ἐρῶ sa loob ng kondisyong pangungusap at ang diin sa katotohanan ng maaaring sabihin ni Pablo.
- source_word: φείδομαι
  choice: nagpipigil ako
  rationale: Sa konteksto, kusang hindi ipinagpapatuloy ni Pablo ang pagmamalaki; natural na ipinahahayag ito ng “nagpipigil ako.”
- source_word: λογίσηται
  choice: mag-isip tungkol sa akin
  rationale: Ipinahihiwatig ng λογίζομαι ang pagtataya o pagtingin sa isang tao. Ang payak na pariralang ito ay madaling maunawaan nang hindi inaalis ang evaluative na diwa.
- source_word: ὑπὲρ ὃ
  choice: nang higit sa
  rationale: Ipinapakita nito ang paglampas sa pamantayang batay sa nakikita at naririnig.
- source_word: βλέπει με
  choice: nakikita niya sa akin
  rationale: Likas itong tumutukoy sa kung ano ang aktuwal na naoobserbahan ng iba kay Pablo, nang hindi dinaragdagan kung anong partikular na gawa ang nakita.
- source_word: ἀκούει τι ἐξ ἐμοῦ
  choice: anumang naririnig niya mula sa akin
  rationale: Hayagang pinananatili ng “anumang” ang di-tiyak na τι, habang ang “mula sa akin” ay tumutugma sa ἐξ ἐμοῦ at natural sa Filipino.
theological_decisions:
- issue: Ang pagmamalaki ni Pablo at ang kusang pagpipigil niya
  choice: Inilalahad ang pagmamalaki bilang isang hipotetikal na pagsasabi ng katotohanan na hindi magiging kahangalan, ngunit kusang iniiwasan ni Pablo upang hindi siya labis na pahalagahan.
  alternative: Sabihing matuwid o kapuri-puri ang pagmamalaki ni Pablo, o sabihing likas na mali at kasinungalingan ang lahat ng pagmamalaki rito.
  rationale: 'Magkasamang pinananatili ng Griyego ang dalawang punto: magiging totoo ang sasabihin ni Pablo, ngunit pinipili pa rin niyang magpigil. Hindi pinalulubha o nilulutas ng salin ang tensiyong ito bilang isang pangkalahatang doktrina tungkol sa pagmamalaki.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” at “Ngunit” upang mapanatili ang lohikal na daloy, habang iniwasan ang sobrang pormal o lipas na pananalita. Hindi kailangan ang talababa para sa τι dahil likas at hayagan itong naisalín bilang “anumang.”
