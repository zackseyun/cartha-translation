base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/016.yaml
  text: 'But let it be so: I did not burden you[a]. Yet, being crafty[c][b], I took you by deceit.'
translation:
  language: tl
  text: 'Ipagpalagay nang gayon nga[a]: hindi ako naging pabigat sa inyo. Ngunit, bilang tuso, nahuli ko kayo sa daya.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sige, gayon na nga” o “Sabihin nang gayon nga.” Lumilitaw na pansamantalang ipinagpapalagay ni Pablo ang puntong ito alang-alang sa argumento.
    reason: lexical_alternative
  - marker: b
    text: Malamang na ang “bilang tuso, nahuli ko kayo sa daya” ay ironikong pag-uulit ni Pablo ng isang paratang laban sa kanya, hindi tunay na pag-amin.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “sinilo ko kayo sa pamamagitan ng pandaraya” o “sinamantala ko kayo sa daya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστω δέ
  choice: Ipagpalagay nang gayon nga
  rationale: Isang likas na pahayag ng pansamantalang pagsang-ayon alang-alang sa argumento; pinananatili nito ang retorikal na puwersa nang hindi labis na nagpapaliwanag.
- source_word: κατεβάρησα
  choice: nagpabigat
  rationale: Pinananatili ang talinghaga ng pagpapabigat at natural ding tumutukoy, ayon sa konteksto, sa hindi paghingi ni Pablo ng materyal o pinansiyal na suporta.
- source_word: ὑπάρχων
  choice: sa pagiging
  rationale: Hindi tahasang itinatakda kung sanhi, pagsalungat, o simpleng kalagayan ang diwa ng participle; iniiwasan ng saling ito ang paglalagay ng mas tiyak na ugnayan kaysa nasa Griyego.
- source_word: πανοῦργος
  choice: tuso
  rationale: Karaniwan at malinaw na salitang Filipino para sa negatibong diwa ng mapanlinlang na katalinuhan na nasa paratang.
- source_word: δόλῳ
  choice: sa daya
  rationale: Maikli at natural na instrumental na parirala na nagpapahayag ng pandaraya o panlilinlang.
- source_word: ἔλαβον
  choice: nahuli ko
  rationale: Sa kontekstong may daya, ang λαμβάνω ay maaaring mangahulugang hulihin o masilo ang isang tao; malinaw ito sa Filipino habang pinananatili ang matalim na anyo ng paratang.
theological_decisions:
- issue: Kung ang huling sugnay ay tunay na pag-amin ni Pablo o ironikong pag-uulit ng paratang laban sa kanya
  choice: Tuwirang isinalin ang sugnay—“sa pagiging tuso ko, nahuli ko kayo sa daya”—at ipinaliwanag ang malamang na ironikong gamit sa talababa.
  alternative: “Ngunit tuso ako kaya dinaya ko kayo” o “Ngunit bilang tuso, sinamantala ko kayo sa pamamagitan ng pandaraya.”
  rationale: Ipinakikita ng mas malawak na konteksto na itinatanggi ni Pablo ang pagsasamantala, ngunit ang mismong pangungusap ay nasa anyo ng matinding paratang. Pinananatili ng tuwirang salin ang retorikal at teolohikal na tensiyon sa halip na lutasin ito sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “nagpabigat” ay natural sa konteksto ng suporta, samantalang ang “nahuli ko kayo sa daya” ay sadyang nagpapanatili sa matalim at maaaring ironikong pananalita ng orihinal.
