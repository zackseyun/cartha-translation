  terminology: Ang “iglesya,” “pabigat,” at “Patawarin ninyo ako” ay angkop na modernong Filipino Tagalog at wasto sa kontekstong pinansiyal at mapanuyang tono. Walang kailangang doctrinal na paglilinaw sa pangunahing teksto.
