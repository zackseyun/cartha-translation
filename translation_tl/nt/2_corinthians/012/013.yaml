  to: Sapagkat sa anong paraan kayo itinuring na mas mababa kaysa sa iba pang mga iglesya[a], maliban sa hindi ako mismo naging pabigat sa inyo[b]? Patawarin ninyo ako sa pagkakamaling ito.[c]
  rationale: Inayos ang talababa b upang maging wasto ang direksiyon ng kahulugan at malinaw na ang tinutukoy ay ang hindi pagtanggap ni Pablo ng suportang magpapabigat sa mga taga-Corinto. Bahagyang pinakinis ang dalawang parirala sa pangunahing teksto para sa likas na modernong Filipino, nang hindi binabago ang retorikal na tanong, paghahambing, diin, o kabalintunaan ng pinagmulan.
