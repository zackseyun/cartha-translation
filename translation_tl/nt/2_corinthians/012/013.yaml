  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τί γάρ ἐστιν ὃ ⸀ἡσσώθητε ὑπὲρ τὰς λοιπὰς ἐκκλησίας, εἰ μὴ ὅτι αὐτὸς ἐγὼ οὐ κατενάρκησα ὑμῶν; χαρίσασθέ μοι τὴν ἀδικίαν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/013.yaml
  text: For in what were you treated as inferior to the rest of the churches[c][b][a], except that I myself did not become a burden to you? Forgive me this wrong.
translation:
  language: tl
  text: Sapagkat sa anong paraan kayo itinuring na mas mababa kaysa sa iba pang mga iglesya[a], maliban sa hindi ako mismo naging pabigat sa inyo[b]? Patawarin ninyo ako sa pagkakamaling ito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ginawang mas mababa kaysa sa iba pang mga iglesya.” Ang pandiwang Griyego ay maaaring tumukoy sa paglalagay sa isang tao sa dehado o mas mababang kalagayan.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, hindi naging pinansiyal na pabigat si Pablo sa kanila sa pamamagitan ng pagtanggap ng suporta mula sa kanila.
    reason: cultural_note
  - marker: c
    text: 'Nagsasalita rito si Pablo nang may kabalintunaan: ang diumano’y “pagkakamali” niya ay ang pagtangging maging pabigat sa kanila.'
    reason: cross_reference
lexical_decisions:
- source_word: ἡσσώθητε
  choice: itinuring na mas mababa
  rationale: Ipinahahayag nito ang pasibong diwa at ang paghahambing nang hindi ipinahihiwatig na likas na mababa ang mga taga-Corinto.
- source_word: ὑπὲρ τὰς λοιπὰς ἐκκλησίας
  choice: kaysa sa iba pang mga iglesya
  rationale: Sa kontekstong pahambing, ang ὑπέρ ay likas na isinasalin bilang “kaysa,” at ang λοιπάς ay tumutukoy sa iba pang mga kongregasyon.
- source_word: αὐτὸς ἐγὼ
  choice: ako mismo
  rationale: Pinananatili ang mariing pagbanggit ni Pablo sa sarili niya.
- source_word: οὐ κατενάρκησα ὑμῶν
  choice: hindi ako mismo naging pabigat sa inyo
  rationale: Ipinahahayag ang materyal o pinansiyal na pasaning tinanggihan ni Pablo na ipataw sa kanila, nang hindi ito labis na ipinapaliwanag sa pangunahing teksto.
- source_word: χαρίσασθέ μοι
  choice: Patawarin ninyo ako
  rationale: Sa mapanuyang pangwakas na utos, ang pandiwa ay may diwang “patawarin,” hindi simpleng “ipagkaloob.”
- source_word: τὴν ἀδικίαν ταύτην
  choice: sa kamaliang ito
  rationale: Ang “kamalian” ay natural at dignified na salin ng ἀδικία rito at nagpapanatili sa kabalintunaan ng diumano’y pagkakasala ni Pablo.
- source_word: τί γάρ ἐστιν ὃ
  choice: Sapagkat sa anong bagay
  rationale: Pinananatili ang ugnayang pangangatwiran ng γάρ at ang retorikal na tanong kung sa anong punto sila napag-iwanan.
theological_decisions:
- issue: Ang mapanuyang pagtatanggol ni Pablo tungkol sa pinansiyal na suporta
  choice: Panatilihing tuwiran ang tanong at ang “Patawarin ninyo ako sa kamaliang ito,” upang ang kabalintunaan ay lumitaw mula sa mismong pananalita.
  alternative: Gawing tahasan ang panunuya sa pangunahing teksto, gaya ng “Patawarin ninyo ako sa napakalaking kasalanang ito.”
  rationale: Hindi tahasang nilalagyan ng Griyego ng etiketa ang panunuya; nahahayag ito sa konteksto at sa pagtawag niyang “kamalian” sa hindi niya pagiging pabigat. Kaya hindi dapat dagdagan ng salin ang tindi o interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iglesya” para sa ἐκκλησία at ang magalang na maramihang “ninyo.” Inilagay ang mga talababa sa mga bahaging tuwirang nililinaw ng mga ito, at pinanatili sa pangunahing teksto ang mapanuyang tensiyon nang walang labis na pagpapaliwanag.
