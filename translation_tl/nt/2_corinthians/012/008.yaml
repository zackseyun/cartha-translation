  yaml_path: translation/nt/2_corinthians/012/008.yaml
  text: Concerning this[d][c][b][a], three times I pleaded with the Lord that it might depart from me.
translation:
  language: tl
  text: Tungkol dito[a], tatlong beses akong nakiusap[b] sa Panginoon[c] na lumayo ito sa akin.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Hinggil dito.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagmakaawa” o “dumulog.”
    reason: lexical_alternative
  - marker: c
    text: “Panginoon” lamang ang nasa Griyego; hindi tahasang binanggit dito ni Pablo ang pangalang Jesus.
    reason: alternative_reading
  - marker: d
    text: Hindi tahasang binabanggit sa Griyego ang simuno ng “lumayo.” Tinutukoy nito ang naunang paghihirap at maaaring tumukoy sa tinik o sa mensahero.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ τούτου
  choice: Tungkol dito
  rationale: Ipinakikilala ng ὑπέρ na may genitibo ang bagay na tinutukoy ng pakiusap. Malinaw nitong iniuugnay ang pangungusap sa paghihirap na binanggit sa naunang talata nang hindi ito ginagawang tiyak na sanhi.
- source_word: τρὶς
  choice: tatlong beses
  rationale: Tumutukoy ito sa tatlong pagkakataon. Karaniwan at malinaw ito sa modernong Filipino.
- source_word: τὸν κύριον
  choice: sa Panginoon
  rationale: Tuwirang katumbas ito ng κύριον at hindi idinaragdag ang pangalang Jesus, na hindi tahasang nasa tekstong Griyego.
- source_word: παρεκάλεσα
  choice: akong nakiusap
  rationale: Sa konteksto ng panalangin, ipinapahayag ng παρακαλέω ang taimtim na paghiling. Ang “nakiusap” ay natural at hindi nagpapasidhi nang higit sa sinasabi ng Griyego.
- source_word: ἵνα ἀποστῇ ἀπ’ ἐμοῦ
  choice: na lumayo ito sa akin
  rationale: 'Ipinapahayag nito ang nilalaman ng pakiusap: ang hindi tahasang pinangalanang simuno ay lumayo kay Pablo. Pinananatili ng “ito” ang pagtukoy sa naunang paghihirap nang hindi nagpapasya kung ang tinutukoy ay ang tinik o ang mensahero.'
theological_decisions:
- issue: Ang tinutukoy ng “Panginoon”
  choice: Pinanatili ang “Panginoon” nang hindi pinalawak bilang “Panginoong Jesus.”
  alternative: Panginoong Jesus
  rationale: Malamang na si Jesus ang tinutukoy sa konteksto, ngunit κύριον lamang ang tahasang sinasabi ng Griyego. Pinananatili ng salin ang antas ng katiyakan ng orihinal.
- issue: Ang di-tahasang simuno ng ἀποστῇ
  choice: Ginamit ang “ito.”
  alternative: siya; ang mensahero; ang tinik
  rationale: Maaaring balikan ng pandiwa ang “tinik sa laman” o ang “mensahero ni Satanas” sa naunang talata. Hindi nilulutas ng “ito” ang sadyang di-tahasang pagtukoy.
translation_notes:
  register: Modernong Filipino na simple, marangal, at madaling maunawaan. Pinanatili ang maikling anyo at ang mga di-tiyak na pagtukoy ng Griyego.
