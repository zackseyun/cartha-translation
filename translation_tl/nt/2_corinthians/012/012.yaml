  text: τὰ μὲν σημεῖα τοῦ ἀποστόλου κατειργάσθη ἐν ὑμῖν ἐν πάσῃ ⸀ὑπομονῇ, σημείοις ⸀τε καὶ τέρασιν καὶ δυνάμεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/012.yaml
  text: Indeed[a], the signs of an apostle were performed among you with all perseverance[b], with signs and wonders and powers.
translation:
  language: tl
  text: Tunay ngang isinagawa sa gitna ninyo ang mga tanda ng isang apostol[a] nang buong pagtitiis—sa pamamagitan ng mga tanda, mga kababalaghan, at mga makapangyarihang gawa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga tanda ng apostol,” kung partikular na tinutukoy ni Pablo ang sarili niya sa halip na ang mga palatandaan ng isang apostol sa pangkalahatan.
    reason: alternative_reading
  - marker: b
    text: Ang “mga makapangyarihang gawa” ay maaari ding isaling “mga himala”; binibigyang-diin ng salitang Griyego ang mga gawang nagpapakita ng kapangyarihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ μὲν σημεῖα
  choice: Tunay ngang … ang mga tanda
  rationale: Ipinahahayag ng μέν ang mariing pagpapatibay kahit walang kasunod na δέ; likas na naihahatid ito ng “tunay nga,” habang pinananatiling “mga tanda” ang σημεῖα.
- source_word: τοῦ ἀποστόλου
  choice: ng isang apostol
  rationale: Ipinahihiwatig ng genitibo ang mga tandang kumikilala o nagpapatunay sa isang apostol sa pangkalahatan. Hindi nito isinasara ang posibilidad na partikular na tinutukoy ni Pablo ang sarili niya, kaya nilagyan ng talababa ang alternatibo.
- source_word: κατειργάσθη
  choice: isinagawa
  rationale: Pinananatili nito ang pasibong diwa ng aoristo—ang mga tanda ay naisakatuparan o naisagawa—nang hindi tahasang tinutukoy kung sino ang gumawa.
- source_word: ἐν ὑμῖν
  choice: sa gitna ninyo
  rationale: Tumutukoy ito sa naganap sa loob ng pamayanan at sa kanilang harapan, hindi sa panloob na karanasan ng bawat isa.
- source_word: ἐν πάσῃ ὑπομονῇ
  choice: nang buong pagtitiis
  rationale: Ang ὑπομονή ay matatag na pagtitiis sa gitna ng hirap. Ang “nang buong pagtitiis” ay natural sa Filipino at pinananatili ang pangyayaring kasama ng apostolikong gawain.
- source_word: σημείοις τε καὶ τέρασιν καὶ δυνάμεσιν
  choice: sa pamamagitan ng mga tanda, mga kababalaghan, at mga makapangyarihang gawa
  rationale: 'Pinananatili ang tatlong magkakaibang termino: σημεῖα bilang “mga tanda,” τέρατα bilang “mga kababalaghan,” at δυνάμεις bilang “mga makapangyarihang gawa.” Ang “sa pamamagitan ng” ay malinaw na naghahatid sa instrumental o nagpapaliwanag na ugnayan ng parirala sa pangunahing pahayag.'
theological_decisions:
- issue: Kahulugan ng “mga tanda ng isang apostol”
  choice: Mga katibayan o palatandaang nagpapatunay sa ministeryo ng isang apostol, na makikita rito kapuwa sa matatag na pagtitiis at sa mga pambihirang gawa.
  alternative: Ang parirala ay maaaring unawain nang mas makitid bilang pagtukoy lamang sa mga himala na tanda ng pagkaapostol.
  rationale: Inilalahad muna ng pangungusap ang “mga tanda ng isang apostol,” saka binabanggit ang buong pagtitiis at ang tatluhang parirala ng mga tanda, kababalaghan, at makapangyarihang gawa. Pinananatili ng salin ang saklaw at tensiyong ito nang hindi nagtatakda ng kumpletong listahan ng mga katangian ng isang apostol.
- issue: Kung pangkalahatan o partikular ang τοῦ ἀποστόλου
  choice: Isinalin sa pangunahing teksto bilang “ng isang apostol,” na nagpapahiwatig ng katangiang apostoliko.
  alternative: “Ng apostol,” kung partikular na tinutukoy ni Pablo ang sarili niya bilang apostol na naglingkod sa Corinto.
  rationale: Maaaring dalhin ng genitibo ang pangkalahatan o kwalitatibong diwa, ngunit may kontekstuwal ding posibilidad na partikular itong tumukoy kay Pablo. Nasa talababa ang alternatibo upang hindi mapawi ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “mga tanda” dahil nasa Griyego ito at mahalaga sa lohika ng pangungusap. Ginamit ang gatlang upang malinaw na ipakilala ang nagpapaliwanag na tatluhang parirala nang hindi binabago ang ugnayang sintaktiko.
