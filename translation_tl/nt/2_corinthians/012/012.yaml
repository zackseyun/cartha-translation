  source_fidelity: Tumpak na naihahatid ng salin ang diin ng μέν sa “Tunay ngang,” ang pasibong diwa ng κατειργάσθη sa “isinagawa,” ang pangkomunidad na ἐν ὑμῖν sa “sa gitna ninyo,” at ang saklaw ng ἐν πάσῃ ὑπομονῇ sa “nang buong pagtitiis.” Napananatili rin ang tatluhang σημεῖα, τέρατα, at δυνάμεις nang hindi pinagsasama ang mga ito sa iisang salitang “himala.” Ang “sa pamamagitan ng” ay isang katanggap-tanggap na pagpapahayag ng instrumental/pagpapaliwanag na ugnayan ng huling parirala.
