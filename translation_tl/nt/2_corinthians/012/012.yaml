  terminology: Ang “apostol,” “mga tanda,” “mga kababalaghan,” at “mga makapangyarihang gawa” ay pare-pareho at angkop. Hindi pinipilit ng “ng isang apostol” ang partikular na pagbasa kay Pablo, habang maayos na inilalaan ng talababa ang posibilidad na iyon.
