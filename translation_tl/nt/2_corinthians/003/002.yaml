  text: ἡ ἐπιστολὴ ἡμῶν ὑμεῖς ἐστε, ἐγγεγραμμένη ἐν ταῖς καρδίαις ἡμῶν, γινωσκομένη καὶ ἀναγινωσκομένη ὑπὸ πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/002.yaml
  text: You are our letter[a], written in our hearts, known and read by all people.
translation:
  language: tl
  text: Kayo ang aming liham, na nakasulat sa aming mga puso, kilala[a] at binabasa ng lahat ng tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakikilala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἐπιστολὴ ἡμῶν
  choice: aming liham
  rationale: Ang “liham” ang malinaw at karaniwang katumbas ng ἐπιστολή sa makabagong Tagalog; pinananatili ng “aming” ang pagmamay-aring ipinahihiwatig ng genitive na ἡμῶν.
- source_word: ὑμεῖς ἐστε
  choice: Kayo ang
  rationale: Natural na panaguring ayos ito sa Tagalog at sapat na naipapahayag ang diin sa ὑμεῖς nang hindi nagdaragdag ng “mismo,” na maaaring maging mas mariin kaysa sa kailangan.
- source_word: ἐγγεγραμμένη
  choice: nakasulat
  rationale: Ipinahihiwatig ng perfect passive participle ang isang bagay na naisulat at nananatiling nakasulat; natural itong naihahatid ng “nakasulat.”
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: sa aming mga puso
  rationale: Ang “sa” ang natural na Tagalog para sa lokasyong ipinahihiwatig ng ἐν; ang “mga puso” ay tumutugma sa pangmaramihang καρδίαις at pinananatili ang talinghaga.
- source_word: γινωσκομένη
  choice: kilala
  rationale: Saklaw ng salita ang pagiging kilala o nakikilala. Ang “kilala” ay maikli at natural sa pares na “kilala at binabasa,” habang pinananatili sa talababa ang posibleng diwang “nakikilala.”
- source_word: ἀναγινωσκομένη
  choice: binabasa
  rationale: Direktang pinananatili nito ang talinghaga ng liham at ang nagpapatuloy na kilos ng present passive participle.
- source_word: ὑπὸ πάντων ἀνθρώπων
  choice: ng lahat ng tao
  rationale: Ang ἀνθρώπων ay tumutukoy sa mga tao sa pangkalahatan, hindi lamang sa mga lalaki; natural na ipinapahayag ng “lahat ng tao” ang lawak ng pahayag.
