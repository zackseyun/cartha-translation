base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/009.yaml
  text: For if the ministry of condemnation came with glory[a], much more does the ministry of righteousness abound in glory.
translation:
  language: tl
  text: Sapagkat kung may kaluwalhatian ang paglilingkod na nagdudulot ng kahatulan, lalo pang nag-uumapaw sa kaluwalhatian ang paglilingkod na nagdudulot ng pagiging matuwid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονία
  choice: paglilingkod
  rationale: Likas at malawak na salitang Tagalog para sa ministeryo o gawaing paglilingkod; nababagay sa magkatapat na dalawang paglilingkod sa konteksto.
- source_word: κατάκρισις
  choice: hatol
  rationale: Ipinahahayag ang forensikong diwa ng kahatulan; sa pariralang 'nagdudulot ng hatol,' malinaw ang kaugnayan nito sa paglilingkod.
- source_word: δόξα
  choice: kaluwalhatian
  rationale: Karaniwang salin na nagpapanatili sa teolohikal na ugnayan ng argumento ni Pablo.
- source_word: πολλῷ μᾶλλον
  choice: lalo pang
  rationale: Natural na paghahambing sa Tagalog na malinaw na nagpapalakas sa ikalawang bahagi.
- source_word: περισσεύει
  choice: nag-uumapaw
  rationale: Pinananatili ang diwa ng kasaganaan o labis na pag-iral, hindi lamang simpleng paghihigit.
- source_word: δικαιοσύνη
  choice: pagiging matuwid
  rationale: Pinananatili ang karaniwang Paulinong diwa ng righteousness habang natural na naipapahayag sa makabagong Tagalog.
- source_word: εἰ γὰρ τῇ διακονίᾳ ... δόξα
  choice: Sapagkat kung ... ay dumating na may kaluwalhatian
  rationale: Walang tahasang pandiwa ang unang sugnay sa Griyego. Ang 'dumating na may' ay natural na panustos at hindi nito ginagawang kasinlakas ng 'nag-uumapaw' ang unang pahayag.
theological_decisions:
- issue: Kahulugan ng δικαιοσύνη sa paghahambing ng dalawang paglilingkod
  choice: pagiging matuwid
  alternative: katarungan
  rationale: Ang 'pagiging matuwid' ang karaniwang angkop sa gamit ni Pablo rito, ngunit tunay na bahagi ng saklaw ng salita ang 'katarungan,' kaya inilagay ito sa talababa nang hindi nilulutas nang tahimik ang posibilidad.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'paglilingkod' sa halip na hiram na 'ministeryo,' at pinanatili ang magkatapat na anyo ng dalawang sugnay.
