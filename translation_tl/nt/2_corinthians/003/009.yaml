- from: Sapagkat kung ang paglilingkod na nagdudulot ng hatol ay dumating na may kaluwalhatian, lalo pang nag-uumapaw sa kaluwalhatian ang paglilingkod na nagdudulot ng pagiging matuwid.[a]
  to: Sapagkat kung may kaluwalhatian ang paglilingkod na nagdudulot ng kahatulan, lalo pang nag-uumapaw sa kaluwalhatian ang paglilingkod na nagdudulot ng pagiging matuwid.[a]
  rationale: Inayos ang salin ng κατάκρισις bilang “kahatulan” upang maipahayag ang condemnation, at ginawang “kung may kaluwalhatian” ang unang sugnay upang tapat na maitawid ang verbless na Griyego nang walang idinagdag na ideya ng pagdating. Hindi binago ang maingat na pagtutumbas ng δικαιοσύνη bilang “pagiging matuwid,” at pinanatili ang leksikal na alternatibo sa talababa.
