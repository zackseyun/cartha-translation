  naturalness: Ang “tuwing binabasa si Moises” ay hindi likas sa maingat at marangal na modernong Filipino. Mas malinaw at natural ang “tuwing binabasa ang mga kasulatan ni Moises.” Mas idiomatiko rin ang “kanilang mga puso” kaysa sa kolektibong isahang “kanilang puso,” habang naitatala ang anyong isahan ng Griyego sa talababa.
  terminology: Ang “talukbong” ay angkop para sa κάλυμμα sa konteksto ng 2 Corinto 3. Ang “mga kasulatan ni Moises” ay tumpak na paglilinaw ng metonimikong Μωϋσῆς, nang hindi ipinipilit na ito ay tanging ang Kautusan.
