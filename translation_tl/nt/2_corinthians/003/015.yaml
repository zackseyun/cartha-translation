source:
  edition: SBLGNT
  text: ἀλλ’ ἕως σήμερον ἡνίκα ⸂ἂν ἀναγινώσκηται⸃ Μωϋσῆς κάλυμμα ἐπὶ τὴν καρδίαν αὐτῶν κεῖται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/015.yaml
  text: But to this day[a], whenever Moses is read[b], a veil lies over their heart.
translation:
  language: tl
  text: Ngunit hanggang ngayon, tuwing binabasa ang mga kasulatan ni Moises,[a] may talukbong na nakapatong sa kanilang mga puso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “si Moises.” Metonimikong tumutukoy ito sa mga kasulatang iniuugnay kay Moises, lalo na sa Kautusan.
    reason: cultural_note
  - marker: b
    text: Sa Griyego, “puso” ay nasa isahan, malamang na kolektibong pagtukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ngunit
  rationale: Malinaw at marangal na pangatnig na nagpapakita ng pagsalungat sa naunang pahayag.
- source_word: ἕως σήμερον
  choice: hanggang ngayon
  rationale: Likas na modernong Tagalog para sa kalagayang nagpapatuloy hanggang sa kasalukuyan.
- source_word: ἡνίκα ἂν ἀναγινώσκηται
  choice: tuwing binabasa
  rationale: Ipinahahayag ng ἡνίκα kasama ng ἄν at present subjunctive ang isang pangyayaring paulit-ulit sa di-tiyak na pagkakataon; ang “tuwing” angkop dito.
- source_word: Μωϋσῆς
  choice: si Moises
  rationale: Pinananatili ang metonimiya ng Griyego, kung saan ang pangalan ni Moises ay tumutukoy sa mga kasulatang kaugnay niya, sa halip na tahasang ipakahulugan ito sa pangunahing teksto.
- source_word: κάλυμμα
  choice: talukbong
  rationale: Ang “talukbong” ay angkop sa larawan ng takip sa mukha na nagpapatuloy sa buong konteksto ng kabanata.
- source_word: ἐπὶ τὴν καρδίαν αὐτῶν
  choice: sa kanilang puso
  rationale: Pinananatili ang isahang “puso” ng Griyego bilang kolektibong isahan, kahit mas karaniwan sa Tagalog ang maramihang “mga puso.”
- source_word: κεῖται
  choice: nakapatong
  rationale: Ipinahahayag nito ang isang bagay na nakalagay at nananatili sa ibabaw, ayon sa larawan ng talukbong.
theological_decisions:
- issue: Kung tahasang ipaliliwanag sa pangunahing teksto na ang “Moises” ay ang Kautusan o mga isinulat ni Moises
  choice: Panatilihin ang “si Moises” bilang metonimiya
  alternative: Isalin bilang “ang Kautusan ni Moises” o “ang mga isinulat ni Moises”
  rationale: Pangalan mismo ni Moises ang ginamit ng tekstong Griyego. Ang pagpapanatili rito ay umiiwas sa labis na pagpapakahulugan, habang nililinaw sa talababa ang malamang na tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang metonimiyang “si Moises” at ang kolektibong isahang “kanilang puso,” na kapwa nilinaw sa mga talababa. Inilagay ang mga pananda ng talababa sa mismong pariralang ipinapaliwanag ng bawat tala.
