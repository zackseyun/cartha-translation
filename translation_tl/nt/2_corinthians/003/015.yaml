  rationale: Inayos ang metonimikong “Moises” upang maging malinaw at likas sa Filipino na ang tinutukoy ay ang mga kasulatan, hindi ang mismong taong si Moises o isang salaysay tungkol sa kanya. Inilipat sa maramihan ang “mga puso” para sa natural na Tagalog, at pinanatili sa talababa ang isahang anyo ng Griyego. Walang pagbabago sa kahulugan o sa imahen ng talukbong.
