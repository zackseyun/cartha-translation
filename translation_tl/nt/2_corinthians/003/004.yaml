  text: Such confidence we have through Messiah toward God[a][b].
translation:
  language: tl
  text: May ganito kaming pagtitiwala sa pamamagitan ng Mesiyas tungo sa Diyos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: Πεποίθησιν
  choice: pagtitiwala
  rationale: Ipinahahayag nito ang matatag na kumpiyansa o katiyakang makikita sa konteksto, sa natural at dignified na Tagalog.
- source_word: δὲ τοιαύτην
  choice: ganito
  rationale: Iniuugnay nito ang pahayag sa naunang sinabi at pinananatili ang kwalitatibong diwa ng τοιαύτην nang hindi nagpapabigat sa pangungusap.
- source_word: ἔχομεν
  choice: may ... kami
  rationale: Ito ang tuwiran at likas na katumbas ng payak na pandiwang ‘mayroon kami.’
- source_word: διὰ τοῦ Χριστοῦ
  choice: sa pamamagitan ng Mesiyas
  rationale: Ang διά na may genitive ay nagpapahiwatig ng pamamagitan o ahensiya; ang Χριστός ay ginamit dito bilang titulo.
- source_word: πρὸς τὸν θεόν
  choice: sa Diyos
  rationale: Sa Filipino, ang ‘pagtitiwala sa Diyos’ ay natural na nagpapahayag ng Godward na kaugnayang tinutukoy ng πρός; ang mas literal na ‘tungo sa Diyos’ ay magiging alanganin at maaaring magpahiwatig ng pisikal na direksiyon.
theological_decisions:
- issue: Pag-render sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Pinananatili ng ‘Mesiyas’ ang gamit nito bilang titulo; inilalagay sa talababa ang tradisyonal na anyong ‘Cristo’ bilang lehitimong alternatibo.
- issue: Ugnayan ng pagtitiwala at ng Diyos sa πρὸς τὸν θεόν
  choice: pagtitiwala sa Diyos
  alternative: pagtitiwala ... sa harap ng Diyos / tungo sa Diyos
  rationale: Natural itong mabasa sa Tagalog at pinananatili ang pagkakatuon sa Diyos, ngunit hindi dinaragdagan ang talata ng doktrinal na paliwanag tungkol sa tiyak na uri ng ugnayan.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, natural, at marangal. Inayos ang ayos ng parirala upang maging idiomatiko sa Tagalog habang pinananatili ang diin na ang pagtitiwala ay sa Diyos at sa pamamagitan ng Mesiyas.
