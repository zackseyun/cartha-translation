  yaml_path: translation/nt/2_corinthians/003/010.yaml
  text: For indeed[a], what had been glorified has not been glorified in this respect, because of the glory that surpasses it.
translation:
  language: tl
  text: Sapagkat ang niluwalhati ay hindi maituturing na maluwalhati sa bagay na ito dahil sa nakahihigit na kaluwalhatian[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dahil sa kaluwalhatiang higit na dakila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sapagkat
  rationale: Ipinahahayag nito ang paliwanag na ugnayan ng γάρ; ang bahagyang pagdidiin ng καί ay likas na naipahihiwatig ng buong pangungusap nang hindi gumagamit ng mabigat o di-likas na parirala.
- source_word: τὸ δεδοξασμένον
  choice: ang dating niluwalhati
  rationale: Pinananatili ang substantibong diwa ng perfect passive participle at ipinahihiwatig ng “dating” na ang tinutukoy ay ang naunang kaluwalhatian, nang hindi nagdaragdag ng tahasang pangngalang wala sa Griyego.
- source_word: οὐ δεδόξασται
  choice: hindi na maituturing na maluwalhati
  rationale: Natural nitong naihahayag sa Tagalog ang retorikal at pahambing na pagkakait ng kaluwalhatian. Iniiwasan nitong magmukhang ganap na pagtanggi na nagkaroon iyon ng kaluwalhatian, habang pinananatili ang kabalintunaang niluwalhati ngunit, sa paghahambing, hindi maluwalhati.
- source_word: ἐν τούτῳ τῷ μέρει
  choice: sa bagay na ito
  rationale: 'Nililimitahan nito ang saklaw ng pagkakait, gaya ng idyomang Griyego: hindi lubusang itinatanggi ang naunang kaluwalhatian kundi inihahambing ito sa higit na dakila.'
- source_word: εἵνεκεν
  choice: dahil sa
  rationale: Malinaw at natural na ipinapahayag ang sanhi o batayan ng paghahambing.
- source_word: τῆς ὑπερβαλλούσης δόξης
  choice: kaluwalhatiang nakahihigit dito
  rationale: Ginagawang lantad ang pahambing na lakas ng participle. Ang “dito” ay ipinuno mula sa konteksto upang malinaw na ang kasalukuyang kaluwalhatian ang nakahihigit sa naunang niluwalhati.
- source_word: δόξα / δεδοξασμένον wordplay
  choice: niluwalhati ... maluwalhati ... kaluwalhatian
  rationale: Pinananatili hangga't maaari ang magkakaugnay na salitang mula sa iisang konsepto ng δόξα, habang nananatiling natural at malinaw sa modernong Tagalog.
theological_decisions:
- issue: Kung lubusang itinatanggi ni Pablo ang kaluwalhatian ng naunang ministeryo o nagsasalita siya nang pahambing.
  choice: 'Pahambing ang pagkakait at nililimitahan ng “sa bagay na ito”: ang dating kaluwalhatian ay tila hindi na kaluwalhatian kapag inihambing sa nakahihigit na kaluwalhatian.'
  alternative: Ganap na walang tunay na kaluwalhatian ang naunang ministeryo.
  rationale: Nililimitahan ng ἐν τούτῳ τῷ μέρει ang negatibong pahayag, at kinikilala sa nakapaligid na konteksto na may kaluwalhatian ang naunang ministeryo, bagaman natatabunan ito ng higit na kaluwalhatian.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “maituturing na maluwalhati” upang maging natural ang sinadyang kabalintunaan ng Griyego at upang malinaw na pahambing, hindi lubusan, ang pagkakait ng kaluwalhatian.
