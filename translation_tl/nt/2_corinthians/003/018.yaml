  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ πάντες ἀνακεκαλυμμένῳ προσώπῳ τὴν δόξαν κυρίου κατοπτριζόμενοι τὴν αὐτὴν εἰκόνα μεταμορφούμεθα ἀπὸ δόξης εἰς δόξαν, καθάπερ ἀπὸ κυρίου πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/018.yaml
  text: And we all[a], with unveiled face, beholding the glory of the Lord as in a mirror, are being transformed into the same image from glory to glory, just as from the Lord[b], the Spirit.
translation:
  language: tl
  text: At tayong lahat, na walang talukbong ang mukha, ay minamasdan ang kaluwalhatian ng Panginoon na para bang sa salamin[a], at patuloy na binabago tungo sa parehong larawan, mula sa kaluwalhatian tungo sa kaluwalhatian—gaya ng nagmumula sa Panginoon, ang Espiritu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “habang sinasalamin ang kaluwalhatian ng Panginoon tulad ng salamin.”
    reason: alternative_reading
  - marker: b
    text: O “mula sa Panginoon na siyang Espiritu”; maaari ring “mula sa Espiritu ng Panginoon.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνακεκαλυμμένῳ προσώπῳ
  choice: na walang talukbong ang mukha
  rationale: Ipinahahayag nito ang kasalukuyang kalagayang bunga ng pag-aalis ng talukbong, at pinananatili ang kolektibong isahan na ‘mukha.’
- source_word: δόξαν κυρίου
  choice: ang kaluwalhatian ng Panginoon
  rationale: Tuwirang isinasalin ang genitive at ginagamit ang karaniwang katawagang ‘Panginoon’ para sa κύριος.
- source_word: κατοπτριζόμενοι
  choice: habang minamasdan na parang sa salamin
  rationale: Pinipili ang diwang pagtingin sa pamamagitan ng salamin, na angkop sa pag-usad mula sa pagmamasid tungo sa pagbabago; inilalagay sa talababa ang tunay na posibleng diwang ‘sinasalamin.’
- source_word: τὴν αὐτὴν εἰκόνα
  choice: sa larawan ding iyon
  rationale: Pinananatili ang ugnayan sa larawan ng kaluwalhatiang kababanggit lamang, sa natural na ayos ng Filipino.
- source_word: μεταμορφούμεθα
  choice: ay patuloy na binabago
  rationale: Ipinakikita ng kasalukuyang balintiyak ang nagaganap at nagpapatuloy na pagbabago.
- source_word: ἀπὸ δόξης εἰς δόξαν
  choice: mula sa kaluwalhatian tungo sa kaluwalhatian
  rationale: Pinananatili ang siksik at bukas na pananalita ng Griyego sa halip na dagdagan ito ng ‘antas.’
- source_word: καθάπερ ἀπὸ κυρίου πνεύματος
  choice: Ito ay mula sa Panginoon, ang Espiritu
  rationale: Natural na ipinahahayag ang pinagmulan habang pinananatili ang posibleng appositional na ugnayan ng ‘Panginoon’ at ‘Espiritu,’ nang hindi lubusang nilulutas ang masinsing sintaks.
theological_decisions:
- issue: Ang kahulugan ng κατοπτριζόμενοι
  choice: minamasdan na parang sa salamin
  alternative: sinasalamin na parang isang salamin
  rationale: Sinusuportahan ng konteksto ang pagmamasid sa kaluwalhatian na humahantong sa pagbabago, ngunit tunay na posible rin sa pandiwa ang diwang pagsasalamin kaya pinananatili iyon sa talababa.
- issue: Ang ugnayan ng κυρίου at πνεύματος sa hulíng parirala
  choice: mula sa Panginoon, ang Espiritu
  alternative: mula sa Panginoon na siyang Espiritu; o, mula sa Espiritu ng Panginoon
  rationale: Masinsin at maaaring unawain sa higit sa isang paraan ang pariralang Griyego. Pinananatili ng pangunahing salin ang appositional na posibilidad, samantalang inilalahad sa talababa ang ibang lehitimong pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘talukbong’ upang mapanatili ang malinaw na kaugnayan sa naunang konteksto ni Moises. Ang ‘patuloy na binabago’ ay natural na naghahatid ng nagpapatuloy na balintiyak.
