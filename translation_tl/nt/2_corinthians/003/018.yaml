revisions:
- from: At tayong lahat, na walang talukbong ang mukha, habang minamasdan na parang sa salamin ang kaluwalhatian ng Panginoon[a], ay patuloy na binabago tungo sa larawan ding iyon, mula sa kaluwalhatian tungo sa kaluwalhatian. Ito ay mula sa Panginoon, ang Espiritu.[b]
  to: At tayong lahat, na walang talukbong ang mukha, ay minamasdan ang kaluwalhatian ng Panginoon na para bang sa salamin[a], at patuloy na binabago tungo sa parehong larawan, mula sa kaluwalhatian tungo sa kaluwalhatian—gaya ng nagmumula sa Panginoon, ang Espiritu.[b]
  rationale: Pinanatili ang patuloy na balintiyak na diwa ng μεταμορφούμεθα sa “patuloy na binabago,” ang siksik na “mula sa kaluwalhatian tungo sa kaluwalhatian,” at ang hindi pa lubusang nilulutas na appositional na pagbasa sa “Panginoon, ang Espiritu.” Ginawang mas natural ang daloy at inayos ang mga footnote anchor at ang pananalita ng alternatibong pagbasa.
