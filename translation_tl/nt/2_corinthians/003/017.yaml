  text: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν· οὗ δὲ τὸ πνεῦμα ⸀κυρίου, ἐλευθερία.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/017.yaml
  text: The Lord is the Spirit[a], and where the Spirit of the Lord is, there is freedom.
translation:
  language: tl
  text: Ang Panginoon ay ang Espiritu[a], at kung saan naroon ang Espiritu ng Panginoon, doon ay may kalayaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ang “Ang Panginoon ay ang Espiritu” ay maaaring unawain bilang isang malapit na pagkakakilanlan ayon sa konteksto, nang hindi itinatakda kung paano dapat ilarawan sa teolohiya ang kanilang ugnayan.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang salin ng κύριος na angkop sa malinaw na teolohikal na gamit nito sa konteksto.
- source_word: πνεῦμα
  choice: Espiritu
  rationale: Ginamit ang malaking titik sapagkat sa dalawang paglitaw ay tumutukoy ito sa Espiritu ng Diyos, hindi sa espiritu ng tao o sa isang impersonal na puwersa.
- source_word: δὲ
  choice: ay / at
  rationale: Ang unang δέ ay likas na naipahihiwatig ng ayos ng pangungusap sa Filipino nang hindi dinaragdagan ng tahasang temporal na “ngayon”; ang ikalawa ay maayos na ipinahayag sa ugnayang “at.”
- source_word: οὗ
  choice: kung saan
  rationale: Pinananatili ang pangkalahatang lokatibong diwa sa natural na modernong Filipino.
- source_word: ἐλευθερία
  choice: kalayaan
  rationale: Ito ang natural at dignified na katumbas sa kasalukuyang Filipino at pinananatili ang bigat ng pahayag.
- source_word: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν
  choice: Ang Panginoon ay ang Espiritu
  rationale: Pinananatili ang tuwirang pangungusap na nagpapakilala nang hindi nilalambutan o ipinapaliwanag sa loob ng pangunahing teksto.
- source_word: τὸ πνεῦμα κυρίου
  choice: ang Espiritu ng Panginoon
  rationale: Pinananatili ang hayag na konstruksiyong genitibo at ang pagkakatulad nito sa biblikal na pananalita.
theological_decisions:
- issue: Pinagtatalunan sa teolohiya ang pahayag na “ang Panginoon ay ang Espiritu.”
  choice: Ang Panginoon ay ang Espiritu
  alternative: Unawain ito bilang malapit na pagkakakilanlang kaugnay ng gawain o ng tipan, sa halip na bilang ganap na pagpapantay ng persona.
  rationale: Tuwirang naghahayag ng pagkakakilanlan ang Griyego. Pinananatili ng salin ang tensiyong ito at hindi itinatakda kung paano dapat ilarawan sa teolohiya ang ugnayan.
- issue: Maaaring pagtalunan kung sino ang tinutukoy ng “Panginoon.”
  choice: Hindi tinukoy nang higit sa mismong salitang “Panginoon.”
  alternative: Tahasang tukuyin bilang Cristo o bilang mas malawak na pagtukoy sa Diyos.
  rationale: Hindi nilulutas ng salin ang interpretatibong tanong na higit sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang hindi kailangang “Ngayon” sa simula dahil walang tahasang salitang temporal sa Griyego; ang ugnayang pandiskurso ng δέ ay naipahihiwatig ng daloy at balangkas ng pangungusap.
