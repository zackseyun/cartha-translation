translation:
  language: tl
  text: Paanong hindi magiging higit na maluwalhati ang paglilingkod ng Espiritu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magiging higit na may kaluwalhatian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὐχὶ
  choice: Paanong hindi
  rationale: Pinananatili ang anyo ng retorikal na tanong na umaasang sang-ayunan ng mambabasa ang positibong sagot.
- source_word: μᾶλλον
  choice: higit na
  rationale: Malinaw na ipinahahayag ang paghahambing at pag-igting mula sa paglilingkod na binanggit sa naunang talata.
- source_word: ἡ διακονία
  choice: ang paglilingkod
  rationale: Ang “paglilingkod” ay natural na salin ng διακονία at angkop sa ipinagkatiwalang gawain sa kontekstong ito, nang hindi nililimitahan ito sa makabagong institusyonal na kahulugan ng “ministeryo.”
- source_word: τοῦ πνεύματος
  choice: ng Espiritu
  rationale: Sa agarang konteksto, tumutukoy ito sa Banal na Espiritu; sapat ang malaking titik upang ipakita ang referent nang walang idinaragdag na paliwanag sa teksto.
- source_word: ἔσται
  choice: magiging
  rationale: Pinananatili ang payak na hinaharap ng pandiwang εἰμί sa natural na Tagalog.
- source_word: ἐν δόξῃ
  choice: maluwalhati
  rationale: Natural na Tagalog ito para sa predikatibong diwa ng parirala sa paghahambing. Ang mas pormal na “nasa kaluwalhatian” ay posible ngunit mas alanganin sa pangungusap.
theological_decisions:
- issue: Referent ng πνεύματος
  choice: Espiritu, na tumutukoy sa Banal na Espiritu
  alternative: espiritu sa mas abstrakto o di-personal na diwa
  rationale: Ang kaibahan sa pagitan ng titik at ng Espiritung nagbibigay-buhay sa 2 Corinto 3:6 ang pinakamalapit na batayan para sa referent.
- issue: Diwa ng ἐν δόξῃ
  choice: maluwalhati
  alternative: nasa kaluwalhatian / may kaluwalhatian
  rationale: Hindi nilulutas ng salin ang pinagmulan o eksaktong paraan ng kaluwalhatian; inilalahad lamang nito ang predikatibong paghahambing sa natural na Tagalog.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Paanong hindi” upang mapanatili ang retorikal na puwersa ng Griyego, at “paglilingkod” upang maiwasan ang mas makitid na institusyonal na dating ng “ministeryo.”
