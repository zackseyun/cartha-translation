base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/011.yaml
  text: For if what was being brought to an end came with glory[c][b][a], much more what remains is in glory.
translation:
  language: tl
  text: Sapagkat kung ang winawakasan ay dumating na taglay ang kaluwalhatian,[a][b] lalo nang nasa kaluwalhatian ang nananatili.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang inaalis sa bisa,” “ang isinasaisantabi,” o “ang pinapawi.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa pamamagitan ng kaluwalhatian.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “ang namamalagi” o “ang nagpapatuloy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταργούμενον
  choice: ang winawakasan
  rationale: Ipinahahayag nito ang kasalukuyang pasibong participle bilang isang bagay na inaalis sa bisa o dinadala sa wakas, nang hindi ipinakahulugang simpleng unti-unting pagkupas.
- source_word: διὰ δόξης
  choice: dumating na may kaluwalhatian
  rationale: Bagaman literal na ‘sa pamamagitan ng kaluwalhatian,’ likas sa Tagalog ang ‘dumating na may kaluwalhatian’ at malinaw na ipinapakitang ang pansamantalang bagay ay sinamahan ng kaluwalhatian.
- source_word: μένον
  choice: ang nananatili
  rationale: Pinananatili nito ang anyong substantibal at ang tuwirang pagsalungat sa bagay na winawakasan.
- source_word: ἐν δόξῃ
  choice: nasa kaluwalhatian
  rationale: Tuwirang pinananatili ang pariralang may ἐν at ang diin sa kaluwalhatian bilang kalagayan o saklaw.
- source_word: πολλῷ μᾶλλον
  choice: lalo nang
  rationale: Likas at malinaw na Tagalog na nagpapahayag ng mas matinding paghahambing.
theological_decisions:
- issue: Ang kalikasan ng paghahambing sa pansamantala at nananatili
  choice: Hindi tahasang pinangalanan sa talata ang dalawang tipan o mga ministeryo; pinanatili ang mga substantibal na paglalarawan ng Griyego.
  alternative: Maaaring tahasang tukuyin ang lumang tipan at bagong tipan batay sa konteksto.
  rationale: Ang mismong talata ay gumagamit ng mga neuter participle at hinahayaang ang nakapaligid na konteksto ang magbigay ng tiyak na tinutukoy. Iniiwasan nitong magdagdag ng paliwanag sa pangunahing teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang maikling retorikal na paghahambing at ang tunay na kalabuan ng mga bagay na tinutukoy nang hindi nagdaragdag ng katawagang teolohikal sa teksto.
