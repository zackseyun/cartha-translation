lexical_decisions:
- source_word: Ἔχοντες
  choice: yamang mayroon tayo
  rationale: Ipinahahayag ang sanhi ng pangunahing sugnay sa natural na Tagalog habang pinananatili ang ugnayang lohikal ng participle.
- source_word: οὖν
  choice: kaya
  rationale: Tuwirang ipinakikita ang paghihinuha mula sa naunang argumento.
- source_word: τοιαύτην
  choice: ganitong
  rationale: Likas at maikling salin ng kwalitatibong demonstratibo, na tumutukoy sa uri ng pag-asang kababanggit lamang.
- source_word: ἐλπίδα
  choice: pag-asa
  rationale: Karaniwang salin na angkop sa tiwala ni Pablo sa katuparang darating.
- source_word: πολλῇ
  choice: malaking
  rationale: Pinatitindi nito ang katangiang ipinahahayag ng παρρησίᾳ.
- source_word: παρρησίᾳ
  choice: katapangan
  rationale: Sinasaklaw ang diwa ng buong-loob na pagkilos sa konteksto, habang inilalagay sa talababa ang lehitimong mga diwa ng pagiging hayag at prangka.
- source_word: χρώμεθα
  choice: kumikilos tayo nang may
  rationale: Natural na Tagalog para sa paggamit o pagsasagawa ng isang katangian; hindi nito ipinapalagay na pananalita lamang ang tinutukoy.
