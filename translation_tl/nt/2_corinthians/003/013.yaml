source:
  edition: SBLGNT
  text: καὶ οὐ καθάπερ Μωϋσῆς ἐτίθει κάλυμμα ἐπὶ τὸ πρόσωπον ⸀αὐτοῦ, πρὸς τὸ μὴ ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ τέλος τοῦ καταργουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/013.yaml
  text: and not like Moses[b][a], who used to put a veil over his face so that the sons of Israel would not gaze at the end of what was fading away.
translation:
  language: tl
  text: At hindi gaya ni Moises, na karaniwan nang naglalagay ng belo sa kanyang mukha upang hindi matitigan ng mga anak ni Israel[b] ang katapusan ng bagay na naglalaho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang layunin o kahihinatnan ng bagay na winawakasan.”'
    reason: alternative_reading
  - marker: b
    text: Sa Griyego, “mga anak ni Israel”; sa karaniwang pananalita, “mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: gaya
  rationale: Likas at malinaw na ipinahahayag ang paghahambing sa naunang pahayag, habang pinananatili ang ugnay na καί sa pamamagitan ng “At.”
- source_word: ἐτίθει
  choice: nakaugalian niyang maglagay
  rationale: Ipinahihiwatig ng imperfect ang paulit-ulit o kinaugaliang kilos, hindi lamang isang minsanang paglalagay.
- source_word: κάλυμμα
  choice: belo
  rationale: Ito ang karaniwan at tiyak na katawagan sa pantakip sa mukha sa salaysay tungkol kay Moises at sa talinghaga ni Pablo.
- source_word: πρόσωπον αὐτοῦ
  choice: kanyang mukha
  rationale: Tuwiran, natural, at eksaktong katumbas sa modernong Tagalog.
- source_word: πρὸς τὸ μὴ ἀτενίσαι
  choice: upang hindi matitigan
  rationale: Pinananatili ng “upang” ang layuning ipinahahayag ng parirala, at ng “matitigan” ang masidhing pagtutok ng tingin sa ἀτενίζω.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: mga anak ni Israel
  rationale: Pinananatili ang tahasang biblikal na idyoma ng Griyego; nililinaw sa talababa ang natural na katumbas na “mga Israelita.”
- source_word: εἰς τὸ τέλος
  choice: ang katapusan
  rationale: Ang “katapusan” ang pinakamalinaw na pagbasa sa konteksto ng lumilipas laban sa nananatili, ngunit hindi ikinukubli ang posibleng diwang “layunin” o “kahihinatnan.”
- source_word: τοῦ καταργουμένου
  choice: ng bagay na naglalaho
  rationale: Natural nitong ipinahahayag ang isang bagay na nawawala o lumilipas sa konteksto ng kaluwalhatiang kumukupas, nang hindi pinatitindi sa “inaalis” o “pinawawalang-bisa.”
theological_decisions:
- issue: Kahulugan ng τέλος τοῦ καταργουμένου
  choice: katapusan ng bagay na naglalaho
  alternative: layunin o kahihinatnan ng bagay na winawakasan
  rationale: Binibigyang-priyoridad ng konteksto ang pagwawakas ng pansamantalang kaluwalhatian, ngunit pinananatili sa talababa ang tunay na saklaw ng τέλος at ang mas tahasang pasibong diwa ng καταργουμένου.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang biblikal na idyomang “mga anak ni Israel,” ang kinaugaliang aspekto ng kilos ni Moises, at ang kahuluganang maaaring “katapusan,” “layunin,” o “kahihinatnan” sa pamamagitan ng talababa.
