- from: Muli ba kaming nagsisimulang purihin ang aming sarili? O kailangan ba namin, gaya ng ilan, ng mga liham ng rekomendasyon para sa inyo o mula sa inyo?
  to: Muli ba naming sinisimulang irekomenda ang aming sarili? O kailangan ba namin, gaya ng ilan, ng mga liham ng rekomendasyon sa inyo o mula sa inyo?
  rationale: Pinalitan ang «purihin» ng «irekomenda» upang masaklaw ang kahulugan ng συνιστάνειν at mapanatili ang leksikal na ugnayan sa «mga liham ng rekomendasyon.» Pinalitan din ang «para sa inyo» ng «sa inyo» para sa πρὸς ὑμᾶς. Walang kinakailangang talababa; ang alternatibong «mga liham ng pagpapatunay» ay hindi kailangan sa pangunahing teksto.
