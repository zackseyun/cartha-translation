base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/001.yaml
  text: Are we beginning again to commend ourselves? Or do we need[a], like some, letters of recommendation to you or from you?
translation:
  language: tl
  text: Muli ba naming sinisimulang irekomenda ang aming sarili? O kailangan ba namin, gaya ng ilan, ng mga liham ng rekomendasyon sa inyo o mula sa inyo?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀρχόμεθα
  choice: nagsisimula ba kami
  rationale: Pinananatili ng pangkasalukuyang anyo at tanong na retorikal ang diwang pasimula o nagpapatuloy, at natural ito sa modernong Tagalog.
- source_word: πάλιν
  choice: muli
  rationale: Malinaw at marangal na ipinahahayag ang pag-uulit.
- source_word: ἑαυτοὺς
  choice: ang aming sarili
  rationale: Tuwirang inililipat ang panghalip na pabalik sa simuno.
- source_word: συνιστάνειν
  choice: purihin
  rationale: Sa konteksto, tumutukoy ito sa pagpapakilala o paglalahad sa sarili bilang karapat-dapat; ang 'purihin ang aming sarili' ay natural at malinaw sa tanong na retorikal.
- source_word: μὴ χρῄζομεν
  choice: kailangan ba namin
  rationale: Natural na Tagalog para sa tanong na umaasang negatibo ang sagot, nang hindi artipisyal na isinasalin nang hiwalay ang μή.
- source_word: ὥς τινες
  choice: gaya ng ilan
  rationale: Pinananatili ang di-tiyak na pagtukoy sa ibang mga tao.
- source_word: συστατικῶν ἐπιστολῶν
  choice: mga liham ng rekomendasyon
  rationale: Malinaw na modernong parirala para sa mga liham na nagpapakilala at nagpapatunay sa isang tao.
- source_word: πρὸς ὑμᾶς
  choice: para sa inyo
  rationale: Sa konteksto ng liham ng rekomendasyon, natural itong tumutukoy sa liham na ihaharap sa mga taga-Corinto.
- source_word: ἢ ἐξ ὑμῶν
  choice: o mula sa inyo
  rationale: Pinananatili ang kahulugan ng ἐξ bilang pinagmulan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, tuwiran, at marangal. Ginamit ang 'kami/namin' bilang eksklusibong unang panauhang maramihan sapagkat si Pablo at ang kaniyang mga kasama ang tinutukoy, hindi kasama ang mga mambabasa.
