- from: Hindi sa may sapat kaming kakayahan sa aming sarili upang ituring na mula sa amin ang anuman, kundi ang aming kakayahan ay mula sa Diyos.[a]
  to: Hindi sa kami ay may sapat na kakayahan sa aming sarili upang ituring ang anumang bagay na para bang mula sa amin, kundi ang aming kakayahan ay mula sa Diyos.[a]
  rationale: Inayos ang pambungad upang maging buong likas na sugnay sa modernong Filipino. Ginawang “anumang bagay” ang saklaw ng τι at “para bang mula sa amin” ang ὡς ἐξ αὑτῶν, nang hindi ipinagpapalagay na ang bagay ay aktuwal na nagmumula sa mga nagsasalita. Iningatan ang leksikal na ugnayan ng “sapat na kakayahan” at “kakayahan,” at pinalitan ang maling alternatibong “pagiging karapat-dapat” sa talababa.
