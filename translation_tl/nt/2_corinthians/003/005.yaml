  yaml_path: translation/nt/2_corinthians/003/005.yaml
  text: Not that we are sufficient in ourselves to consider anything as coming from ourselves[a], but our sufficiency is from God[b],
translation:
  language: tl
  text: Hindi sa kami ay may sapat na kakayahan sa aming sarili upang ituring ang anumang bagay na para bang mula sa amin, kundi ang aming kakayahan ay mula sa Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kakayahan” ay maaari ring isaling “kasapatan” o “pagiging sapat”; gayundin sa unang paggamit nito sa talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: Hindi sa
  rationale: Likas na panimulang paglilinaw ito sa Filipino at pinananatili ang retorikal na pagwawasto ni Pablo, hindi isang pahayag ng dahilan.
- source_word: ἀφ’ ἑαυτῶν ἱκανοί ἐσμεν
  choice: may sapat kaming kakayahan sa aming sarili
  rationale: Ipinahahayag nito ang kakayahang hindi likas o nagmumula sa sarili, habang natural ang ayos sa makabagong Filipino.
- source_word: λογίσασθαί τι
  choice: upang ituring ... ang anuman
  rationale: Ang 'ituring' ay naghahatid ng diwa ng mental na pagtaya o pagkilala; ang 'anuman' ay angkop sa malawak na saklaw ng τι sa negatibong pahayag.
- source_word: ὡς ἐξ αὑτῶν
  choice: na mula sa amin
  rationale: Pinananatili nito ang diwa ng pinagmulan nang hindi nagdaragdag ng paliwanag na wala sa Griyego.
- source_word: ἡ ἱκανότης ἡμῶν
  choice: ang aming kakayahan
  rationale: Inuulit ang 'kakayahan' upang mapanatili ang ugnayang leksikal sa ἱκανοί; sa Filipino, mas natural ito kaysa 'kasapatan' kapag tinutukoy ang kakayahang gumawa o magsaalang-alang.
- source_word: ἐκ τοῦ θεοῦ
  choice: ay mula sa Diyos
  rationale: Tuwirang itinatanghal ang Diyos bilang pinagmumulan, gaya ng Griyego.
theological_decisions:
- issue: Saklaw ng pahayag tungkol sa kakayahan ng tao
  choice: Pinanatiling malawak ang pahayag tungkol sa kakayahang nagmumula sa sarili.
  alternative: Tahasang limitahan ito sa kakayahan para sa apostolikong ministeryo.
  rationale: Bagaman ministeryo ang agarang konteksto, mas malawak ang mismong pananalita ng talata at hindi ito dapat paliitin nang walang tahasang batayan sa teksto.
- issue: Ugnayan ng pagsasaalang-alang at pinagmulan
  choice: Pinanatili ang posibilidad na ang pahayag ay tumutukoy sa pagturing sa anumang bagay bilang nagmumula sa mga apostol mismo.
  alternative: Ipaliwanag itong kawalan ng kakayahang mag-isip ng kahit anong kaisipan.
  rationale: Ang ὡς ἐξ αὑτῶν ay mahalagang bahagi ng pahayag at pinipigilan ang salin na gawing ganap na pagtanggi sa lahat ng kakayahang mag-isip.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng salitang 'kakayahan' upang katawanin ang ugnayan ng ἱκανοί at ἱκανότης. Inilagay ang pananda ng talababa sa dulo ng talata at isinama ito sa pangunahing teksto.
