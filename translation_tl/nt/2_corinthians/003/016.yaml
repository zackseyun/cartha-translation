translation:
  language: tl
  text: Ngunit tuwing may bumabaling sa Panginoon, inaalis ang lambong.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡνίκα δὲ ἐὰν
  choice: Ngunit tuwing
  rationale: Pinananatili ng “ngunit” ang pag-uugnay ng δέ, at ipinahihiwatig ng “tuwing” ang di-tiyak o paulit-ulit na temporal na diwa ng ἡνίκα kasama ng ἐὰν at pandiwang pasakali.
- source_word: ἐπιστρέψῃ
  choice: may bumabaling
  rationale: Ang “bumabaling” ay nagpapanatili sa larawan ng pagharap o paglingon tungo sa isang tao, nang hindi ito nililimitahan sa teknikal na kahulugan ng pagbabalik-loob. Ang “may” ay likas na paraan sa Tagalog upang ipahayag ang di-tiyak na simuno na hindi tahasang binanggit sa Griyego.
- source_word: πρὸς κύριον
  choice: sa Panginoon
  rationale: Likas sa Tagalog ang “bumaling sa” para sa direksiyong ipinahahayag ng πρός. Pinananatili ang titulong “Panginoon” nang hindi tinutukoy sa mismong salin kung ito ay si Cristo o ang Espiritu.
- source_word: περιαιρεῖται
  choice: inaalis
  rationale: 'Pinananatili ang pangkasalukuyang tinig na balintiyak: may nag-aalis sa talukbong, ngunit hindi tahasang pinapangalanan ang gumagawa.'
- source_word: τὸ κάλυμμα
  choice: ang talukbong
  rationale: Ang “talukbong” ay malinaw na pantukoy sa takip sa mukha at angkop sa alusyon kay Moises, samantalang masyadong malawak ang karaniwang “takip.”
theological_decisions:
- issue: Ang di-binanggit na simuno ng ἐπιστρέψῃ
  choice: Ihayag bilang di-tiyak na “may bumabaling,” nang walang espesipikong pangngalan.
  alternative: “Kapag bumabaling siya” o “tuwing bumabaling ang isang tao.”
  rationale: Walang tahasang simuno ang sugnay sa Griyego. Ang “may bumabaling” ay natural sa modernong Tagalog at hindi nagpapasya kung ang tinutukoy ay isang partikular na tao, sinumang indibidwal, o isang pangkat na inilalarawan bilang isa.
- issue: Ang pagkakakilanlan ng “Panginoon”
  choice: Panatilihin lamang ang “Panginoon.”
  alternative: “Panginoong Cristo” o “Panginoon, samakatuwid ay ang Espiritu.”
  rationale: κύριον lamang ang sinasabi ng talata. Hindi dapat lutasin sa salin ang masalimuot na kaugnayan ng Panginoon at ng Espiritu sa kalapit na konteksto.
- issue: Ang gumagawa ng pag-aalis sa talukbong
  choice: Panatilihing hindi pinangalanan sa balintiyak na “inaalis.”
  alternative: “inaalis ng Panginoon” o “nawawala.”
  rationale: Balintiyak ang περιαιρεῖται at walang tahasang gumagawa. Ang pagdaragdag ng “ng Panginoon” ay higit sa teksto, samantalang ang “nawawala” ay maaaring magpahiwatig na kusang naglalaho ang talukbong.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “talukbong” upang mapanatili ang kongkretong larawan mula sa salaysay ni Moises, at iniwasan ang teknikal o denominasyonal na bokabularyo.
