id: 2CO.3.6
reference: 2 Corinthians 3:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃς καὶ ἱκάνωσεν ἡμᾶς διακόνους καινῆς διαθήκης, οὐ γράμματος ἀλλὰ πνεύματος, τὸ γὰρ γράμμα ἀποκτέννει, τὸ δὲ πνεῦμα ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/006.yaml
  text: who also made us competent as servants of a new covenant[a], not of the letter but of the Spirit; for the letter kills[c][b], but the Spirit gives life.
translation:
  language: tl
  text: Siya rin ang nagbigay sa amin ng kakayahang maging mga lingkod[a] ng isang bagong tipan, hindi ng titik[b] kundi ng Espiritu[c]; sapagkat pumapatay ang titik, ngunit nagbibigay-buhay ang Espiritu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ministro.”
    reason: lexical_alternative
  - marker: b
    text: Ang “titik” ay maaari ring unawain bilang “nakasulat na alituntunin.”
    reason: lexical_alternative
  - marker: c
    text: O “espiritu” sa dalawang paglitaw nito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἱκάνωσεν
  choice: nagbigay sa amin ng kakayahan
  rationale: Likas at malinaw na Filipino para sa pagkilos na ginawang may sapat na kakayahan ang mga tinutukoy, nang hindi nagpapahiwatig ng pormal na sertipikasyon o likas na kasapatan.
- source_word: διακόνους
  choice: mga lingkod
  rationale: Pinananatili ang diwa ng paglilingkod at iniiwasang ipasok ang mas huling teknikal o eklesiastikal na kahulugan ng “ministro.”
- source_word: καινῆς διαθήκης
  choice: ng isang bagong tipan
  rationale: Tuwirang inililipat ang pariralang walang pantukoy sa Griyego at pinananatili ang kategorya ng tipan sa pangangatwiran ni Pablo.
- source_word: γράμματος / γράμμα
  choice: titik
  rationale: Pinananatili ang maikli at matinding metapora ni Pablo at ang tahasang pagsalungat nito sa πνεῦμα; ang “nakasulat na alituntunin” ay inilagay bilang paliwanag na alternatibo.
- source_word: πνεύματος / πνεῦμα
  choice: Espiritu
  rationale: Sa konteksto ng bagong tipan at pagbibigay-buhay, malamang na ang Banal na Espiritu ang tinutukoy. Gayunman, pinananatili sa talababa ang “espiritu” dahil walang pagkakaiba ng malaking at maliit na titik sa mga manuskritong Griyego.
- source_word: ἀποκτέννει
  choice: pumapatay
  rationale: Tuwiran at mariing katumbas na nagpapanatili sa buhay na aspektong pangkasalukuyan ng pandiwa.
- source_word: ζῳοποιεῖ
  choice: nagbibigay-buhay
  rationale: Natural na modernong Filipino na malinaw na nagpapahayag ng pagkilos na nagbibigay ng buhay.
theological_decisions:
- issue: Kung ang πνεῦμα ay dapat isaling “Espiritu” o “espiritu”
  choice: Espiritu
  alternative: espiritu
  rationale: Sa pagsalungat na kaugnay ng bagong tipan, ang nagbibigay-buhay ay pinakamalamang na ang Banal na Espiritu. Hindi lubusang nilulutas ang ortograpikong kalabuan ng Griyego, kaya ibinibigay ang alternatibo sa talababa.
- issue: Kung ang γράμμα ay simpleng “titik” o tumutukoy nang mas tiyak sa nakasulat na alituntunin
  choice: titik
  alternative: nakasulat na alituntunin
  rationale: Ang “titik” ang mas pormal at bukas na salin ng metapora; ang mas tiyak na interpretasyon ay hindi isinisingit sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tipan,” “lingkod,” at “titik” upang mapanatili ang mahahalagang termino at metapora ng teksto nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
