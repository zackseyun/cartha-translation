  source_fidelity: 'Tumpak na naihahatid ang lahat ng pangunahing elemento ng Griyego: ang pagpapaging-karapat-dapat o may kakayahan (ἱκάνωσεν), paglilingkod (διακόνους), isang bagong tipan, at ang magkapares na pagsalungat ng titik at Espiritu. Napananatili rin ang pangkasalukuyang puwersa ng «pumapatay» at «nagbibigay-buhay».'
