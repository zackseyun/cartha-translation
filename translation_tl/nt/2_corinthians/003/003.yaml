source:
  edition: SBLGNT
  text: φανερούμενοι ὅτι ἐστὲ ἐπιστολὴ Χριστοῦ διακονηθεῖσα ὑφ’ ἡμῶν, ἐγγεγραμμένη οὐ μέλανι ἀλλὰ πνεύματι θεοῦ ζῶντος, οὐκ ἐν πλαξὶν λιθίναις ἀλλ’ ἐν πλαξὶν καρδίαις σαρκίναις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/003.yaml
  text: showing that you are a letter from the Messiah[a], ministered by us, written not with ink but with the Spirit of the living God[d][c][b], not on stone tablets but on tablets of hearts of flesh.
translation:
  language: tl
  text: Ipinakikita na kayo ay isang liham mula sa Mesiyas[a], na pinangasiwaan sa pamamagitan ng aming paglilingkod, na isinulat hindi sa tinta kundi sa pamamagitan ng Espiritu ng Diyos na buhay, hindi sa mga tapyas na bato kundi sa mga pusong laman bilang mga tapyas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang liham ng Mesiyas.” Maaaring isalin nang mas literal sa ganitong paraan ang Griyegong genitive; ipinahihiwatig ng pangunahing salin na ang Mesiyas ang pinagmulan o may-akda ng liham.
    reason: alternative_reading
  - marker: b
    text: Ang “mga pusong laman” ay umaalingawngaw sa larawan ng bagong tipan sa Lumang Tipan, lalo na sa Ezekiel 11:19 at 36:26.
    reason: cross_reference
lexical_decisions:
- source_word: φανερούμενοι
  choice: Malinaw na
  rationale: Ipinahahayag ng participle na hayag o maliwanag sa mga nakakakita ang katotohanang sumusunod; natural ito sa modernong Tagalog sa loob ng nagpapatuloy na pangungusap.
- source_word: ἐπιστολὴ
  choice: liham
  rationale: Karaniwan at dignified na katumbas ng sulat o liham; pinananatili ang metapora.
- source_word: Χριστοῦ
  choice: mula sa Mesiyas
  rationale: Ang genitive ay malamang na tumutukoy sa pinagmulan o may-akda ng liham. Isinasalin ang Χριστός bilang titulong “Mesiyas,” habang itinatala sa talababa ang mas literal na “liham ng Mesiyas.”
- source_word: διακονηθεῖσα
  choice: pinaglingkuran namin
  rationale: Pinananatili ang diwa ng διακονέω na paglilingkod o pangangasiwa, sa halip na paliitin ito sa simpleng paghahatid lamang; ipinakikitang sina Pablo ang mga tagapaglingkod na ginamit sa pagbuo o paghahayag ng liham.
- source_word: ἐγγεγραμμένη
  choice: isinulat
  rationale: Natural na katumbas na nababagay sa paghahambing ng tinta at Espiritu.
- source_word: μέλανι
  choice: tinta
  rationale: Tuwirang modernong katumbas sa metapora ng pagsusulat.
- source_word: πνεύματι θεοῦ ζῶντος
  choice: sa pamamagitan ng Espiritu ng Diyos na buhay
  rationale: Malinaw na tinutukoy ng konteksto ang Espiritu ng Diyos bilang banal na gumagawa, hindi lamang hininga o disposisyon; ang “Diyos na buhay” ay natural na pariralang Tagalog.
- source_word: πλαξὶν λιθίναις
  choice: mga tapyas na bato
  rationale: Pinananatili ang kongkretong larawan at ang alusyon sa mga tapyas ng kautusan sa Sinai.
- source_word: πλαξὶν καρδίαις σαρκίναις
  choice: mga tapyas—mga pusong laman
  rationale: Ang gitling ay nagpapakitang ang mga puso mismo ang mga tapyas, hindi na ang mga tapyas ay may-ari lamang ng mga puso. Pinananatili rin ang sadyang kongkretong “pusong laman” at ang alusyon sa bagong tipan.
theological_decisions:
- issue: Kahulugan ng genitive na Χριστοῦ
  choice: liham mula sa Mesiyas
  alternative: liham ng Mesiyas
  rationale: 'Malamang na pinagmulan o may-akda ang ugnayan: ang kongregasyon ay liham na nagmumula sa Mesiyas, samantalang sina Pablo ang naglingkod kaugnay nito. Gayunman, hindi lubusang nilulutas ng Griyego ang genitive kaya ibinigay ang mas literal na anyo sa talababa.'
- issue: Pagkilala sa πνεύματι
  choice: Espiritu ng Diyos na buhay
  alternative: espiritu ng Diyos na buhay
  rationale: Ang paghahambing sa tinta at ang konteksto ng gawain ng Diyos sa bagong tipan ay mariing tumutukoy sa Espiritu ng Diyos bilang gumagawang persona.
- issue: Larawan ng καρδίαις σαρκίναις
  choice: mga tapyas—mga pusong laman
  alternative: mga tapyas ng mga pusong laman
  rationale: 'Pinananatili ng pangunahing salin ang posibleng appositional na ugnayan: ang mga puso ang mga tapyas. Hindi nito pinapawi ang alusyon sa pusong laman sa Ezekiel.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Mesiyas” bilang makahulugang titulo, “liham” para sa natural na metapora, at “mga tapyas—mga pusong laman” upang mapanatili ang estruktura at alusyong biblikal nang hindi nagiging alanganin ang sunod-sunod na pariralang may “ng.”
