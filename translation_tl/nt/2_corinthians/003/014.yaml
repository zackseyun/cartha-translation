  terminology: Ang 'lumang tipan,' 'tabing,' at 'Mesiyas' ay angkop. Pinananatili ng talababa ang sintaktikong posibilidad na ang lumang tipan, sa halip na ang tabing, ang ipinahihiwatig na simuno ng καταργεῖται, nang hindi ito ipinapasya ayon sa doktrina.
