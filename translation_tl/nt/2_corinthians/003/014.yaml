revisions:
- from: Ngunit naging manhid ang kanilang pag-iisip. Sapagkat hanggang sa araw na ito, kapag binabasa ang lumang tipan[a], nananatili ang tabing na iyon at hindi naiaangat, sapagkat sa Mesiyas ito inaalis.[b]
  to: Ngunit naging manhid ang kanilang pag-iisip. Sapagkat hanggang sa araw na ito, sa pagbasa ng lumang tipan[a], nananatili ang parehong tabing, na hindi naiaangat, sapagkat sa Mesiyas ito ay inaalis[b].
  rationale: Pinalitan ang 'tabing na iyon' ng 'parehong tabing' upang tuwirang maipahayag ang τὸ αὐτὸ κάλυμμα. Inayos ang parirala bilang 'sa pagbasa ng lumang tipan' upang higit na sundan ang ἐπὶ τῇ ἀναγνώσει, at inilapit ang marker [b] sa 'inaalis,' na siyang paksa ng talababa. Hindi binago ang kahulugan o ang maingat na pagpreserba sa kalabuan ng implicit na simuno ng καταργεῖται.
