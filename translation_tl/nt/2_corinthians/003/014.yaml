source:
  edition: SBLGNT
  text: ἀλλὰ ἐπωρώθη τὰ νοήματα αὐτῶν. ἄχρι γὰρ τῆς σήμερον ⸀ἡμέρας τὸ αὐτὸ κάλυμμα ἐπὶ τῇ ἀναγνώσει τῆς παλαιᾶς διαθήκης μένει μὴ ἀνακαλυπτόμενον, ⸀ὅτι ἐν Χριστῷ καταργεῖται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/014.yaml
  text: But their minds were hardened[a]. For until this very day, at the reading of the old covenant, the same veil remains, not being lifted[b], because in Messiah it is removed.
translation:
  language: tl
  text: Ngunit naging manhid ang kanilang pag-iisip. Sapagkat hanggang sa araw na ito, sa pagbasa ng lumang tipan[a], nananatili ang parehong tabing, na hindi naiaangat, sapagkat sa Mesiyas ito ay inaalis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lumang testamento.” Sa Griyego, “lumang tipan.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring unawain: “sapagkat sa Mesiyas ito ay pinawawalang-bisa” o “inaalis,” kung ang tinutukoy ay ang lumang tipan sa halip na ang tabing.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπωρώθη
  choice: naging manhid
  rationale: Ipinahahayag ang pasibong kalagayan ng pagkawala ng espirituwal na pagkamadama o pagtanggap nang hindi ipinapalagay na sadyang nagmatigas ang mga tinutukoy.
- source_word: τὰ νοήματα αὐτῶν
  choice: ang kanilang pag-iisip
  rationale: Tumutukoy sa kakayahan nilang umunawa at makakita; likas at malinaw ito sa makabagong Filipino.
- source_word: ἄχρι γὰρ τῆς σήμερον ἡμέρας
  choice: Sapagkat hanggang sa araw na ito
  rationale: Pinananatili ang temporal na diin ng pariralang Griyego.
- source_word: τὸ αὐτὸ κάλυμμα
  choice: ang tabing na iyon
  rationale: Pinananatili ang larawang kaugnay ng tabing ni Moises sa nakapaligid na konteksto.
- source_word: ἐπὶ τῇ ἀναγνώσει
  choice: kapag binabasa
  rationale: Natural na Filipino para sa pangyayaring nagaganap sa pagbasa, nang hindi binabago ang di-tiyak na tagabasa.
- source_word: τῆς παλαιᾶς διαθήκης
  choice: ang lumang tipan
  rationale: Ang διαθήκη ay ‘tipan’; hindi inuuna ang nakaugaliang katawagang ‘Lumang Tipan/Testamento’ bilang pangalan ng koleksiyon ng mga aklat.
- source_word: μένει μὴ ἀνακαλυπτόμενον
  choice: nananatili ... at hindi naiaangat
  rationale: Pinananatili ang nagpapatuloy na kalagayan at ang larawan ng tabing na hindi naiaangat.
- source_word: ἐν Χριστῷ
  choice: sa Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong ‘Mesiyas’ at pinananatili ang malawak na ugnayang ipinahahayag ng ἐν.
- source_word: καταργεῖται
  choice: inaalis
  rationale: Ang tabing ang pinakamalapit na posibleng tinutukoy; ang ‘inaalis’ ay angkop sa larawan ng tabing at pinananatili ang pasibong diwa.
theological_decisions:
- issue: Ang tinutukoy na simuno ng καταργεῖται
  choice: 'Ang tabing ang tinutukoy: ‘sa Mesiyas ito inaalis.’'
  alternative: 'Maaaring ang lumang tipan ang tinutukoy: ‘sa Mesiyas ito pinawawalang-bisa/itinatabi.’'
  rationale: Ang ‘tabing’ ang pinakamalapit na antecedent at umaayon sa kasunod na larawan, ngunit walang hayag na simuno ang pandiwa sa Griyego. Kaya inilalahad sa talababa ang makabuluhang alternatibo sa halip na ikubli ang sintaktikong kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “tabing” upang mapanatili ang kaugnayan kay Moises, at “Mesiyas” bilang salin ng titulong Χριστός. Ang marker [a] ay inilagay sa mismong “lumang tipan,” na siyang tinatalakay ng talababa.
