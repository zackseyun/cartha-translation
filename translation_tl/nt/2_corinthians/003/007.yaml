id: 2CO.3.7
reference: 2 Corinthians 3:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ διακονία τοῦ θανάτου ἐν ⸀γράμμασιν ⸀ἐντετυπωμένη λίθοις ἐγενήθη ἐν δόξῃ, ὥστε μὴ δύνασθαι ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ πρόσωπον Μωϋσέως διὰ τὴν δόξαν τοῦ προσώπου αὐτοῦ τὴν καταργουμένην,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/007.yaml
  text: But if the ministry of death[a], engraved in letters on stones, came with glory, so that the sons of Israel were not able to gaze at Moses’ face because of the glory of his face, which was fading away[b],
translation:
  language: tl
  text: Ngunit kung ang paglilingkod ng kamatayan, na nakaukit sa mga bato sa anyo ng mga titik, ay dumating nang may kaluwalhatian—kaya hindi makatitig ang mga anak ng Israel sa mukha ni Moises dahil sa kaluwalhatian ng kanyang mukha, na naglalaho[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “na winawakasan” o “na lumilipas.”
    reason: alternative_reading
lexical_decisions:
- source_word: διακονία
  choice: paglilingkod
  rationale: Likas at malawak ang “paglilingkod” sa Filipino at napapanatili nito ang diwa ng isang gawaing ipinagkatiwala nang hindi nililimitahan sa makabagong gamit ng “ministeryo.”
- source_word: τοῦ θανάτου
  choice: ng kamatayan
  rationale: Pinananatili ang maikli at matinding anyong henitibo ni Pablo, sa halip na ipaliwanag agad kung ito ay nagdudulot o humahantong sa kamatayan.
- source_word: ἐν γράμμασιν ἐντετυπωμένη λίθοις
  choice: nakaukit sa mga bato sa anyo ng mga titik
  rationale: Ipinahahayag nito ang permanenteng pagkakaukit at ang tahasang maramihang “mga bato,” nang hindi idinaragdag sa pangunahing teksto ang salitang “mga tapyas.”
- source_word: ἐγενήθη ἐν δόξῃ
  choice: dumating nang may kaluwalhatian
  rationale: Napapanatili ang pangyayaring ipinahihiwatig ng ἐγενήθη at ang kaluwalhatiang kaakibat nito.
- source_word: ὥστε μὴ δύνασθαι ἀτενίσαι
  choice: kaya hindi makatitig
  rationale: Ang “kaya” ay malinaw na naghahayag ng bunga, at ang “makatitig” ay tumutukoy sa matamang o tuloy-tuloy na pagtingin.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: ang mga anak ng Israel
  rationale: Malapit ito sa tradisyonal at kongkretong ekspresyong Griyego. Sa Filipino, ang “anak” ay hindi likas na nagtatakda ng kasarian; ang “mga anak na lalaki” ay maaaring magbigay ng maling impresyong mga mismong anak na lalaki ni Jacob lamang ang tinutukoy.
- source_word: εἰς τὸ πρόσωπον Μωϋσέως
  choice: sa mukha ni Moises
  rationale: Ito ang natural na pariralang Filipino kasunod ng “makatitig” at pinananatili ang kongkretong pagtukoy sa mukha.
- source_word: καταργουμένην
  choice: na naglalaho
  rationale: Sa agarang konteksto ng nakikitang kaluwalhatian sa mukha ni Moises, natural nitong ipinahahayag ang unti-unting pagkawala, habang inilalagay sa talababa ang mas malawak na saklaw ng salita.
theological_decisions:
- issue: Kung ang καταργουμένην ay tumutukoy sa nakikitang paglalaho ng kaluwalhatian o sa pagwawakas/pag-aalis nito.
  choice: na naglalaho
  alternative: na winawakasan; na lumilipas
  rationale: Ang pinakamalapit na tinutukoy ay ang kaluwalhatian ng mukha ni Moises, kaya ang “naglalaho” ang pinakamalinaw sa konteksto. Gayunman, hindi nito inuubos ang maaaring diwa ng pagwawakas, kaya pinananatili ang mga alternatibo sa talababa.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang mahaba at tuloy-tuloy na estruktura ng pangungusap dahil nagpapatuloy ang kaisipan sa susunod na talata; kaya em dash at pangwakas na kuwit ang ginamit. Iniwasan ang mas teknikal na “ministeryo” at ang interpretibong “mga tapyas na bato.”
