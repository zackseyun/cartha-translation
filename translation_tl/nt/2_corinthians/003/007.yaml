  source_fidelity: 'Tapat ang salin sa pangunahing estruktura at diwa ng Griyego: ang διακονία τοῦ θανάτου ay isinaling “paglilingkod ng kamatayan,” ang pagkakaukit sa mga bato at mga titik ay kapwa napanatili, at malinaw ang resultang hindi makatitig ang mga anak ng Israel sa mukha ni Moises. Ang “na naglalaho” ay angkop sa καταργουμένην sa agarang konteksto ng nakikitang kaluwalhatian, nang hindi inaalis ang mas malawak na posibleng diwa sa talababa.'
  naturalness: Natural at marangal ang modernong Filipino. Ang “nakaukit sa mga bato sa anyo ng mga titik” ay nauunawaan at maayos na paraan upang ipahayag ang magkakaugnay na “mga titik” at “mga bato” nang hindi nagdaragdag ng “mga tapyas.” Ang mahabang pangungusap at mga gitling ay angkop sapagkat nagpapatuloy ang sintaksis sa kasunod na talata.
  terminology: Ang “paglilingkod,” “kaluwalhatian,” “mga anak ng Israel,” at “mukha ni Moises” ay pare-pareho ang rehistro at sapat na malapit sa Griyego. Hindi kinakailangang ipilit ang “mga anak na lalaki,” dahil hindi likas iyon sa Filipino at maaari pang magpahiwatig ng di-sinasadyang pagpapaliit ng tinutukoy.
