  naturalness: Likas at malinaw ang modernong Filipino Tagalog. Ang “mabigat at makapangyarihan,” “pisikal na presensya,” at “hinahamak ang kanyang pananalita” ay nauunawaan at angkop sa marangal na rehistro ng liham.
  terminology: Ang “mga sulat” ay angkop para sa ἐπιστολαί; “pisikal na presensya” ay wastong naghahayag ng παρουσία τοῦ σώματος; at “pananalita” ay angkop sa λόγος sa kontekstong ito. Ang “hinahamak” ay pinananatiling pagtatasa ng mga kritiko, gaya ng ἐξουθενημένος.
