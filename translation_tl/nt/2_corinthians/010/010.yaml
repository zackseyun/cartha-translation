id: 2CO.10.10
reference: 2 Corinthians 10:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι Αἱ ⸂ἐπιστολαὶ μέν⸃, φησίν, βαρεῖαι καὶ ἰσχυραί, ἡ δὲ παρουσία τοῦ σώματος ἀσθενὴς καὶ ὁ λόγος ἐξουθενημένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/010.yaml
  text: For they say[a], “His letters are weighty and strong, but his bodily presence is weak[b], and his speech is despised.”
translation:
  language: tl
  text: Sapagkat sinasabi nila[a], “Mabigat at makapangyarihan ang kanyang mga sulat, ngunit mahina ang kanyang pisikal na presensya, at hinahamak ang kanyang pananalita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sapagkat sinasabi niya, ‘Mabigat at makapangyarihan ang mga sulat…’” Pang-isahan ang salitang Griyego na φησίν (“sinasabi niya”), ngunit maaari itong gamitin bilang parentetikong pormula ng pagsipi; sa konteksto, iniulat dito ang opinyon ng mga kritiko ni Pablo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikilala nito rito ang dahilan o nilalaman ng naunang pahayag; natural sa Tagalog ang “Sapagkat sinasabi nila.”
- source_word: ἐπιστολαὶ
  choice: mga sulat
  rationale: Karaniwang nakasulat na pakikipag-ugnayan ang tinutukoy; malinaw at likas sa modernong Tagalog ang “mga sulat.”
- source_word: μέν ... δὲ
  choice: '... ngunit ...'
  rationale: Minamarkahan ng pares ang paghahambing na magkasalungat, na natural na naihahayag sa Tagalog sa pamamagitan ng “ngunit.”
- source_word: φησίν
  choice: sinasabi nila
  rationale: Bagaman pang-isahan sa anyong Griyego, maaari itong maging parentetikong pormula ng pagsipi na kumakatawan sa iniulat na puna ng mga kritiko ni Pablo.
- source_word: βαρεῖαι
  choice: mabigat
  rationale: Pinananatili ang metapora ng bigat at ipinahihiwatig ang seryoso at matinding dating ng mga sulat nang hindi labis na nagpapakahulugan.
- source_word: ἰσχυραί
  choice: makapangyarihan
  rationale: Naghahatid ng lakas at bisa ng mga sulat sa natural na Tagalog; mas angkop dito kaysa sa literal ngunit maaaring alanganing “malakas.”
- source_word: παρουσία τοῦ σώματος
  choice: pisikal na presensya
  rationale: Tumutukoy sa personal at nakikitang pagharap ni Pablo, bilang kabaligtaran ng dating ng kanyang mga sulat.
- source_word: ἀσθενὴς
  choice: mahina
  rationale: Tuwirang katumbas na hindi tinutukoy kung ang sinasabing kahinaan ay anyo, tindig, o pangkalahatang dating.
- source_word: λόγος
  choice: pananalita
  rationale: Sa paghahambing sa mga sulat at pisikal na presensya, tumutukoy ito sa paraan o gawa ng pagsasalita ni Pablo.
- source_word: ἐξουθενημένος
  choice: hinahamak
  rationale: Ipinakikita nitong ang pananalita ay itinuturing na walang halaga o minamaliit ng iba, sa halip na sabihing likas itong kasuklam-suklam.
theological_decisions:
- issue: Ang iniulat na puna laban kay Pablo ay hindi dapat magmukhang pagsang-ayon ng tagapagsalaysay
  choice: 'Iniharap ito bilang sinabi ng mga kritiko: “sinasabi nila.”'
  alternative: “sinasabi niya” o “sinasabi”
  rationale: 'Pinananatili nito ang retorikal na konteksto: iniulat ni Pablo ang paghatol ng kanyang mga kritiko, hindi niya pinatutunayang tama ang kanilang pagtatasa.'
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang metapora sa “mabigat,” ang di-tiyak na uri ng kahinaan sa “mahina,” at ang panlabas na pagtatasa sa “hinahamak.”
