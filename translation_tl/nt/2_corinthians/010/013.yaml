id: 2CO.10.13
reference: 2 Corinthians 10:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ⸀οὐκ εἰς τὰ ἄμετρα καυχησόμεθα, ἀλλὰ κατὰ τὸ μέτρον τοῦ κανόνος οὗ ἐμέρισεν ἡμῖν ὁ θεὸς μέτρου, ἐφικέσθαι ἄχρι καὶ ὑμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/013.yaml
  text: But we will not boast beyond measure[a], but according to the measure of the sphere that God assigned to us—a measure that reaches even to you—
translation:
  language: tl
  text: Ngunit hindi kami magmamalaki nang lampas sa hangganan. Sa halip, magmamalaki kami ayon sa sukat ng saklaw[a] na itinakda sa amin ng Diyos—isang sukat na umaabot maging sa inyo—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hangganan,” “tuntunin,” o “pamantayan.” Ang salitang Griyego ay maaaring tumukoy sa panukat, pamantayan, o saklaw na itinakda.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμετρα
  choice: nang lampas sa hangganan
  rationale: Ipinahahayag ng parirala ang paglampas sa wastong limitasyon at pinananatili ang larawan ng hangganan o sukat.
- source_word: καυχησόμεθα
  choice: magmamalaki kami
  rationale: Tuwirang ipinapakita nito ang pagyayabang o pag-angkin ng karangalan sa kontekstong polemikal.
- source_word: κατὰ τὸ μέτρον
  choice: ayon sa sukat
  rationale: Pinananatili nito ang metapora at ang pag-uulit ng μέτρον.
- source_word: κανόνος
  choice: saklaw
  rationale: Sa konteksto, tumutukoy ito sa nasukat at itinakdang larangan o hangganan ng gawain, hindi lamang sa isang tuntuning moral.
- source_word: οὗ ἐμέρισεν ἡμῖν ὁ θεὸς
  choice: na itinakda sa amin ng Diyos
  rationale: Natural na ipinahahayag ang banal na paglalaan o pagtatalaga ng isang saklaw.
- source_word: μέτρου
  choice: isang sukat
  rationale: Pinananatili ang ikalawang paglitaw ng μέτρον bilang paglilinaw sa saklaw.
- source_word: ἐφικέσθαι
  choice: na umaabot
  rationale: Malinaw na ipinahahayag ang lawak ng itinakdang sukat.
- source_word: ἄχρι καὶ ὑμῶν
  choice: maging sa inyo
  rationale: Pinananatili ang diin na kabilang ang mga taga-Corinto sa saklaw na iyon.
theological_decisions:
- issue: Kahulugan ng κανών sa pag-angkin ni Pablo tungkol sa kaniyang gawain
  choice: Isang saklaw ng gawain na itinakda ng Diyos at kabilang dito ang mga taga-Corinto
  alternative: Isang tuntunin o pamantayan na batayan ng pagmamalaki ni Pablo
  rationale: Nangingibabaw sa konteksto ang mga larawan ng sukat, hangganan, paglalaan, at pag-abot; gayunman, inilalahad sa talababa ang iba pang leksikal na posibilidad.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “saklaw” upang maging natural at upang ipakita ang larangan ng gawaing itinakda ng Diyos; pinanatili ang “sukat” sa dalawang paglitaw nito at ang nakabiting bantas sa dulo dahil nagpapatuloy ang pangungusap sa kasunod na talata.
