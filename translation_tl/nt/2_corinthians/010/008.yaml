  terminology: Ang “awtoridad,” “Panginoon,” at “mapapahiya” ay angkop. Pinananatili ng “patatagin/gibain” ang metaporang pagtatayo at paggiba nang hindi pinalalakas ang kahulugan tungo sa pisikal na pagkawasak.
