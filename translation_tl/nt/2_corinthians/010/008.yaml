  text: ἐάν ⸀τε ⸀γὰρ περισσότερόν τι καυχήσωμαι περὶ τῆς ἐξουσίας ἡμῶν, ἧς ἔδωκεν ὁ ⸀κύριος εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν ὑμῶν, οὐκ αἰσχυνθήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/008.yaml
  text: For even if I should boast somewhat more about our authority[a], which the Lord gave for building you up and not for tearing you down[b], I will not be put to shame.
translation:
  language: tl
  text: Sapagkat kahit magmalaki pa ako nang kaunti tungkol sa aming awtoridad na ibinigay ng Panginoon upang patatagin kayo at hindi upang gibain kayo[a], hindi ako mapapahiya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “at hindi para sa inyong pagkawasak.” Pinagtatapat ng Griyego ang pagpapatatag at paggiba o pagkawasak.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “hindi ako mahihiya.” Ang anyong Griyego ay pasibo, kaya mas tuwirang ipinahahayag ng “mapapahiya” ang anyo nito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: Sapagkat kahit
  rationale: Pinananatili ng “sapagkat” ang paliwanag na diwa ng γάρ, at natural na ipinapahayag ng “kahit” ang kondisyong may diin ng ἐάν τε.
- source_word: περισσότερόν τι καυχήσωμαι
  choice: magmalaki pa ako nang kaunti
  rationale: Ang “pa” ay nagpapahayag ng paghahambing, samantalang ang “nang kaunti” ay nagpapanatili sa nagpapahinang diwa ng τι.
- source_word: περὶ τῆς ἐξουσίας ἡμῶν
  choice: tungkol sa awtoridad na ibinigay sa amin
  rationale: Ang ἐξουσία ay tumutukoy sa ipinagkaloob na karapatan o awtoridad, hindi lamang sa kakayahan o kapangyarihan.
- source_word: ἧς ἔδωκεν ὁ κύριος
  choice: na ibinigay sa amin ng Panginoon
  rationale: Malinaw na iniuugnay ang panghalip sa awtoridad at ipinakikitang ang Panginoon ang pinagmulan nito.
- source_word: εἰς οἰκοδομὴν
  choice: upang patatagin kayo
  rationale: Natural itong Filipino para sa metaporikal na diwa ng pagpapatibay o pagpapalago sa kapulungan.
- source_word: καὶ οὐκ εἰς καθαίρεσιν ὑμῶν
  choice: at hindi upang ibagsak
  rationale: Pinananatili ng “ibagsak” ang matinding pagsalungat sa pagpapatatag at maaari pa ring marinig bilang metapora ng paggiba.
- source_word: οὐκ αἰσχυνθήσομαι
  choice: hindi ako mapapahiya
  rationale: Ipinakikita ng “mapapahiya” ang pasibong anyo at ang ideyang hindi mapatutunayang walang saysay o walang batayan ang pagmamalaki ni Pablo.
theological_decisions:
- issue: Kalikasan at layunin ng awtoridad ng apostol
  choice: Ang awtoridad ay ipinagkaloob ng Panginoon upang patatagin ang mga taga-Corinto, hindi upang ibagsak sila.
  alternative: Unawain ang awtoridad bilang pangunahing ibinigay para sa mapanirang pagdidisiplina.
  rationale: Tahasang pinagtatapat ng teksto ang οἰκοδομή at καθαίρεσις. Pinananatili ng salin ang mapagpatibay na layunin ng awtoridad nang hindi inaalis ang posibilidad ng mahigpit na paggamit nito.
translation_notes:
  register: Gumamit ng makabago ngunit marangal na Filipino. Ang “awtoridad” ay karaniwang nauunawaan at mas tiyak kaysa “kapangyarihan” sa kontekstong ito. Ang pares na “patatagin/ibagsak” ay natural sa Filipino at nagpapanatili sa salungatang larawan ng pagtatayo at paggiba.
