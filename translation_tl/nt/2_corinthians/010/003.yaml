  text: For though we walk in the flesh[a], we do not wage war according to the flesh—
translation:
  language: tl
  text: Sapagkat bagaman namumuhay kami sa laman[a], hindi kami nakikipagdigma ayon sa laman—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bagaman nabubuhay kami bilang mga tao, hindi kami nakikipagdigma ayon sa pamantayan ng tao.”
    reason: Ipinakikita ang natural na alternatibong pagbasa sa ἐν σαρκὶ at κατὰ σάρκα habang pinananatili sa pangunahing teksto ang pag-uulit ng salitang “laman.”
lexical_decisions:
- source_word: ἐν σαρκὶ
  choice: sa laman
  rationale: Pinananatili nito ang sadyang pag-uulit ng σάρξ at ang kaibhan sa pagitan ng karaniwang buhay bilang tao at ng mga paraang pinamamahalaan ng laman, nang hindi agad nililimitahan ang kahulugan sa “katawan” o “makasalanang kalikasan.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ng γάρ na ang pangungusap ay nagbibigay-paliwanag sa naunang sinabi; natural at marangal na pang-ugnay sa Filipino ang “Sapagkat.”
- source_word: περιπατοῦντες
  choice: kahit namumuhay kami
  rationale: Ang περιπατέω ay literal na “lumalakad” ngunit karaniwang tumutukoy sa pamumuhay. Ang “kahit” ay nagpapahayag ng konsesibong ugnayan sa kasunod na pagtanggi.
- source_word: οὐ κατὰ σάρκα
  choice: hindi ... ayon sa laman
  rationale: Pinananatili ng “ayon sa laman” ang di-tiyak na saklaw ng κατὰ σάρκα bilang pamantayan o paraan—maaaring pawang pantao, makalaman, o makamundo—at iniiwasang ipako ito sa iisang pagpapakahulugan.
- source_word: στρατευόμεθα
  choice: nakikipagdigma
  rationale: Malinaw nitong naihahatid ang aktibong larawang militar na ginagamit ni Pablo para sa tunggalian sa konteksto.
theological_decisions:
- issue: Pagbibigay-kahulugan sa dalawang gamit ng σάρξ
  choice: Gamitin ang “laman” sa dalawang parirala sa pangunahing teksto.
  alternative: “nabubuhay kami bilang mga tao ... hindi kami nakikipagdigma ayon lamang sa pamantayan ng tao” o “nasa katawan ... hindi sa makalamang paraan”
  rationale: Ang unang gamit ay tumutukoy sa karaniwang buhay ng tao sa katawan, samantalang ang ikalawa ay tumutukoy sa pamantayan o paraan ng pakikipaglaban. Ang pag-uulit ng “laman” ay nagpapanatili sa retorikal na ugnayan at teolohikal na tensiyon ng Griyego nang hindi ipinapasok ang mas makitid na “makasalanang kalikasan.”
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “namumuhay” sa halip na literal na “lumalakad” upang maging natural, ngunit pinanatili ang “laman” sa dalawang lugar upang huwag mawala ang sadyang pag-uulit at ambiguity ng orihinal. Ang em dash ay nagpapanatili sa pagpapatuloy ng argumento sa susunod na talata.
