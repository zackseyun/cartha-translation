  source_fidelity: 'Tapat ang salin sa Griyego: ang pautos na λογιζέσθω ay maayos na naipahayag sa “Isaalang-alang,” ang isahang ὁ τοιοῦτος sa “gayong tao,” at ang magkatapat na “sa salita … sa gawa” ay pinananatili. Naipapahayag din ng “sa pamamagitan ng mga liham habang wala kami” ang instrumental na δι’ ἐπιστολῶν at ang kalagayan ng pagliban, habang ang “kapag naroon kami” ay sapat na katapat ng παρόντες sa kontekstong ito.'
