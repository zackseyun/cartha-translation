reference: 2 Corinthians 10:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τοῦτο λογιζέσθω ὁ τοιοῦτος, ὅτι οἷοί ἐσμεν τῷ λόγῳ δι’ ἐπιστολῶν ἀπόντες, τοιοῦτοι καὶ παρόντες τῷ ἔργῳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/011.yaml
  text: 'Let such a person consider this: what we are in word by letters when absent[b][a], we are also in deed when present.'
translation:
  language: tl
  text: 'Isaalang-alang ito ng gayong tao: kung ano kami sa salita sa pamamagitan ng mga liham habang wala kami, gayon din kami sa gawa kapag naroon kami.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring isalin ang “sa salita … sa gawa” bilang “sa sinasabi namin … sa ginagawa namin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζέσθω
  choice: isaalang-alang
  rationale: Ang pangatlong panauhang pautos ay nananawagang pag-isipang mabuti at kilalanin bilang totoo ang sumusunod na pahayag. Likas at malinaw sa modernong Tagalog ang “isaalang-alang.”
- source_word: ὁ τοιοῦτος
  choice: gayong tao
  rationale: Tumutukoy ito sa taong may katangiang gaya ng kritikong binanggit sa naunang talata. Pinananatili ng “gayong tao” ang isahang pagtukoy nang hindi nagiging lipas o mapanlait.
- source_word: οἷοί ἐσμεν … τοιοῦτοι
  choice: kung ano kami … gayon din kami
  rationale: Pinananatili ng magkatugmang pariralang Tagalog ang paghahambing tungkol sa uri o katangian nina Pablo at ng kanyang mga kasama.
- source_word: τῷ λόγῳ
  choice: sa salita
  rationale: Dative ito ng saklaw o aspekto. Ang “sa salita” ay maikli at nagpapanatili sa sinadyang pagtut contrast nito sa “sa gawa,” habang saklaw ang mga salitang ipinahahayag sa mga liham.
- source_word: δι’ ἐπιστολῶν
  choice: sa pamamagitan ng mga liham
  rationale: Ipinahihiwatig ng διά na ang mga liham ang paraang ginagamit upang maipahayag ang kanilang salita habang wala sila.
- source_word: ἀπόντες
  choice: habang wala kami
  rationale: Ang participle ay pangyayari o kalagayang kasabay ng pagsulat. Malinaw itong itinatapat sa kanilang pagkanaroon.
- source_word: τῷ ἔργῳ
  choice: sa gawa
  rationale: Dative ito ng saklaw o aspekto at tuwirang katapat ng τῷ λόγῳ. Pinananatili ng “sa salita … sa gawa” ang maikli at mariing antitesis ng Griyego.
- source_word: παρόντες
  choice: kapag naroon kami
  rationale: Ipinapahayag nito ang personal na presensiya nila sa mga taga-Corinto at likas na itinatapat sa “habang wala kami.”
theological_decisions:
- issue: Ang kaugnayan ng mariing pananalita sa mga liham at ng pagkilos ni Pablo kapag personal siyang naroon
  choice: Isinalin bilang tuwirang pahayag na ang magiging gawa nila kapag naroon ay tutugma sa kung ano sila sa salita habang wala.
  alternative: Isalin nang mas malaya bilang tahasang banta tungkol sa isang tiyak na parusang gagawin nila.
  rationale: Naghahambing ang Griyego ng “sa salita” habang wala at “sa gawa” kapag naroon. May himig itong babala, ngunit hindi nito tahasang tinutukoy ang isang partikular na parusa, kaya hindi iyon idinagdag.
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at malinaw sa karaniwang mambabasa. Pinanatili ang maikli at balanseng antitesis na “sa salita … sa gawa,” gayundin ang inklusibong pagtukoy ni Pablo sa sarili at mga kasama sa pamamagitan ng “kami.”
