  text: so that I may not seem as though I were trying to frighten you by my letters[a].
translation:
  language: tl
  text: upang hindi ako magmukhang para bang nananakot sa inyo sa pamamagitan ng mga liham ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang hindi ako magmukhang nananakot sa inyo sa pamamagitan ng mga liham ko.”
    reason: Ipinapakita ang mas maikling Tagalog na ayos na hindi gaanong tahasang minamarkahan ang pahambing na ὡς ἂν.
lexical_decisions:
- source_word: ἵνα μὴ
  choice: upang hindi
  rationale: Pinananatili ang puwersa ng sugnay na nagsasaad ng layunin o kinalabasan, kasama ang pagtanggi.
- source_word: δόξω
  choice: magmukhang
  rationale: Ang δοκέω rito ay nangangahulugang ‘magmukha’ o ‘lumitaw,’ hindi ‘mag-isip.’ Natural sa modernong Tagalog ang ‘magmukhang’ sa ganitong konstruksyon.
- source_word: ὡς ἂν
  choice: —
  rationale: Ang diwa nitong paghahambing at pagpapalagay ay likas nang naipapahayag ng konstruksyong ‘magmukhang tinatakot ko’; ang hiwalay na ‘na para bang’ ay magiging mabigat at paulit-ulit.
- source_word: ἐκφοβεῖν
  choice: tinatakot
  rationale: Tuwirang ipinapahayag ang malakas na diwa ng pananakot nang hindi pinalalabis bilang ‘sinisindak’ o ‘kinikilabutan.’ Ang kasalukuyang anyo ay natural bilang nilalaman ng ipinapalagay na anyo o impresyon.
- source_word: ὑμᾶς
  choice: kayo
  rationale: Maramihang tuwirang layon ng ἐκφοβεῖν.
- source_word: διὰ τῶν ἐπιστολῶν
  choice: sa pamamagitan ng mga liham ko
  rationale: Ang διά na may genitive ay nagsasaad ng kasangkapan o paraan. Bagaman ‘ang mga liham’ ang tahasang anyo sa Griyego, malinaw sa konteksto na mga liham ni Pablo ang tinutukoy, kaya natural ang ‘mga liham ko.’
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang ‘liham’ sa halip na ‘sulat’ upang malinaw na tumukoy sa mga ipinadalang liham, at iniwasan ang labis na pormal o makalumang ayos.
