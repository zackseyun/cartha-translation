  naturalness: Marangal at madaling basahin ang draft, ngunit mas tumpak at natural sa modernong Tagalog ang magkatambal na «nagrerekomenda sa sarili» at «inirerekomenda ng Panginoon.» Ang pagdaragdag ng «taong» sa magkabilang bahagi ay nagpapalinaw sa tinutukoy na indibidwal nang hindi nagdaragdag ng kahulugan.
  terminology: Pinananatili ang «Panginoon» para sa κύριος nang walang pagtukoy na wala sa teksto. Isinasalin ang δόκιμος bilang «kinikilalang karapat-dapat,» na maayos na naghahayag ng pagiging tanggap o aprobado matapos masuri, nang hindi ipinipilit ang partikular na paraan ng pagpapatunay.
