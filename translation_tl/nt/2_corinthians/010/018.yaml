    rationale: Ang δόκιμος ay ‘kinikilala/itinuturing na karapat-dapat’ o ‘katanggap-tanggap’; hindi tahasang tinutukoy ng talata ang proseso ng pagpapatunay.
  revised_text: Sapagkat hindi ang taong nagrerekomenda sa sarili ang kinikilalang karapat-dapat,[a] kundi ang taong inirerekomenda ng Panginoon.
