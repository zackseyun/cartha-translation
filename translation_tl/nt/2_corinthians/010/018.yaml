  yaml_path: translation/nt/2_corinthians/010/018.yaml
  text: For it is not the one who commends himself who is approved[a], but the one whom the Lord commends.
translation:
  language: tl
  text: Sapagkat hindi ang taong nagrerekomenda sa sarili ang kinikilalang karapat-dapat,[a] kundi ang taong inirerekomenda ng Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “nagpapakilala sa sarili bilang karapat-dapat” … “na kinikilala ng Panginoon.” Iisang pandiwang Griego ang ginamit sa dalawang bahagi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνων / συνίστησιν
  choice: nagpupuri / pinupuri
  rationale: Sa konteksto ng pagyayabang at pagsusuri, tumutukoy ang pandiwa sa pagpuri o pagrerekomenda sa isang tao upang kilalanin. Inulit ang iisang salitang-ugat sa dalawang bahagi upang mapanatili ang retorikal na paghahambing.
- source_word: δόκιμος
  choice: napatunayang karapat-dapat
  rationale: Ipinahihiwatig ng δόκιμος ang pagiging katanggap-tanggap matapos masuri. Mas malinaw sa karaniwang Tagalog ang pariralang ito kaysa sa payak na 'aprubado,' habang pinananatili ang diwa ng pagsusuri.
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang salin ito ng κύριος bilang titulo at hindi nito higit na tinutukoy sa pangunahing teksto kung si Jesus o ang Diyos ang tinutukoy.
- source_word: ἑαυτὸν
  choice: sa sarili
  rationale: Natural na katumbas sa Tagalog sa konstruksiyong 'nagpupuri sa sarili' at sapat na kumakatawan sa panlalaking isahang anyo nang hindi nagiging asiwa.
- source_word: ὃν
  choice: ang pinupuri
  rationale: Ginagawang natural sa Tagalog ang substantibong diwa na 'ang taong pinupuri' nang hindi kinakailangang ulitin ang 'tao.'
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang pahayag.
theological_decisions:
- issue: Tinutukoy ng ὁ κύριος
  choice: Panginoon lamang ang ginamit, nang walang karagdagang pagtukoy.
  alternative: Panginoong Jesus; Diyos
  rationale: Bagaman madalas tumukoy kay Jesus ang 'Panginoon' sa mga sulat ni Pablo, κύριος lamang ang nasa talata. Pinananatili ng salin ang posibleng tensiyon at hindi nagdaragdag ng tiyak na pagkakakilanlan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang magkatugmang pandiwa sa magkabilang bahagi at iniwasan ang hiram na 'aprubado' upang maging madaling maunawaan ng karaniwang mambabasa.
