id: 2CO.10.16
reference: 2 Corinthians 10:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰς τὰ ὑπερέκεινα ὑμῶν εὐαγγελίσασθαι, οὐκ ἐν ἀλλοτρίῳ κανόνι εἰς τὰ ἕτοιμα καυχήσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/016.yaml
  text: to proclaim the good news in the regions beyond you[c][b][a], not to boast in another's sphere about things already prepared.
translation:
  language: tl
  text: upang ipahayag ang mabuting balita sa mga dakong lampas sa inyo[a], at hindi magmalaki sa saklaw ng iba[b] tungkol sa mga bagay na nakahanda na.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “upang ipangaral ang ebanghelyo sa mga lupaing nasa ibayo ninyo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “saklaw” ay salin ng Griyegong κανών, na rito ay tumutukoy sa isang larangan o hangganan ng paglilingkod, hindi sa tuntuning moral o sa kalaunang kahulugan ng “kanon.”
    reason: cultural_note
  - marker: c
    text: O, “tungkol sa gawaing natapos o naihanda na.” Sa konteksto, maaaring tumukoy ito sa gawaing nagawa na ng iba.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερέκεινα ὑμῶν
  choice: mga dakong lampas sa inyo
  rationale: Ipinahahayag nito ang mga lugar na nasa ibayo ng kinaroroonan o nasasakupan ng mga taga-Corinto, habang pinananatili ang tuwirang ugnayang ‘lampas sa inyo’ nang hindi nagdaragdag ng salitang wala sa Griyego.
- source_word: εὐαγγελίσασθαι
  choice: ipahayag ang mabuting balita
  rationale: Malinaw at likas ito sa makabagong Filipino at pinananatili ang pandiwang diwa ng pagpapahayag ng mabuting balita.
- source_word: ἀλλοτρίῳ
  choice: ng iba
  rationale: Tumpak nitong ipinahahayag na ang tinutukoy na saklaw ay nauukol sa ibang tao, nang hindi kinakailangang tukuyin ang kasarian.
- source_word: κανόνι
  choice: saklaw
  rationale: Sa konteksto, tumutukoy ito sa hangganan o larangan ng paglilingkod, hindi sa tuntuning moral o sa kalaunang kahulugan ng ‘kanon.’
- source_word: ἕτοιμα
  choice: mga bagay na nakahanda na
  rationale: Pinananatili nito ang substantibong anyo at ang ideya ng mga bagay na handa o naihanda na, nang hindi tahasang ipinapalit ang mas interpretatibong ‘gawa.’
- source_word: καυχήσασθαι
  choice: magmalaki
  rationale: Karaniwang salitang Filipino ito na angkop sa paulit-ulit na tema ni Pablo ng pagmamalaki sa bahaging ito.
theological_decisions:
- issue: Kahulugan ng κανών sa konteksto ng paglilingkod ni Pablo
  choice: saklaw o larangan ng paglilingkod
  alternative: tuntunin, pamantayan, o kanon
  rationale: Ang 2 Corinto 10:13–15 ay tumatalakay sa mga hangganan at larangang itinakda para sa paggawa. Hindi dapat ipasok dito ang kalaunang teknikal na kahulugan ng ‘kanon.’
- issue: Tinutukoy ng τὰ ἕτοιμα
  choice: mga bagay na nakahanda na
  alternative: gawaing natapos o naihanda na ng iba
  rationale: Malamang na tumutukoy ito sa bunga o gawaing pangmisyon na naihanda na ng iba, ngunit maluwag ang mismong pariralang Griyego. Kaya pinananatili sa teksto ang mas literal na ‘mga bagay,’ at inilalagay sa talababa ang kontekstuwal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong pandiwa na kaugnay ng naunang pangungusap at ang bahagyang pagkakasiksik at kalabuan ng hulíng pariralang Griyego.
