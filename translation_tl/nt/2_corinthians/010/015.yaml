translation:
  language: tl
  text: Hindi kami nagmamalaki nang lampas sa hangganan dahil sa mga pagpapagal ng iba. Sa halip, umaasa kami na, habang lumalago ang inyong pananampalataya, lalo pa kaming mapalawak[b] sa inyo ayon sa aming takdang saklaw,[a] hanggang sa higit pang lawak.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ayon sa aming takdang sukat” o “ayon sa aming tuntunin.” Ang salitang Griyego ay tumutukoy rito sa nasukat o nakatalagang larangan ng paglilingkod.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mapadakila” o “maitaas.” Sa konteksto, malamang na tumutukoy ito sa paglawak ng gawaing apostoliko ni Pablo, hindi lamang sa personal na papuri.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “nang sagana” o “para sa higit pang paglawak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ εἰς τὰ ἄμετρα καυχώμενοι
  choice: Hindi kami nagmamalaki nang lampas sa hangganan
  rationale: Pinananatili ang larawan ng sukat o hangganan at ang kaugnayan ng καυχάομαι sa pagmamalaki sa buong konteksto.
- source_word: ἐν ἀλλοτρίοις κόποις
  choice: tungkol sa mga pagpapagal ng iba
  rationale: Ipinahihiwatig na hindi inaangkin ni Pablo ang papuri para sa mabigat na gawaing ginawa ng ibang tao.
- source_word: ἐλπίδα δὲ ἔχοντες
  choice: Sa halip, umaasa kami
  rationale: Natural na Filipino para sa pagkakaroon ng pag-asa, habang malinaw ang pagsalungat sa naunang sugnay.
- source_word: αὐξανομένης τῆς πίστεως ὑμῶν
  choice: habang lumalago ang inyong pananampalataya
  rationale: Likas na ipinapahayag ang genitive absolute at pinananatili ang karaniwang kahulugan ng πίστις bilang pananampalataya.
- source_word: ἐν ὑμῖν μεγαλυνθῆναι
  choice: lalo pang lalawak sa gitna ninyo ang aming gawain
  rationale: Ikinakabit ang ἐν ὑμῖν sa paglaki o paglawak at nililinaw na ang tinutukoy sa konteksto ay ang gawaing apostoliko, hindi personal na pagpaparangal.
- source_word: κατὰ τὸν κανόνα ἡμῶν
  choice: ayon sa saklaw na itinakda sa amin
  rationale: Ang κανών sa vv. 13–16 ay tumutukoy sa nasukat o nakatalagang larangan ng gawain, hindi sa kanon ng Kasulatan o simpleng tuntunin.
- source_word: εἰς περισσείαν
  choice: hanggang sa higit pang lawak
  rationale: Pinananatili ang direksiyonal na puwersa ng εἰς at ang diwa ng higit na paglawak sa konteksto.
theological_decisions:
- issue: Kahulugan ng μεγαλυνθῆναι kaugnay ng awtoridad apostoliko
  choice: Paglawak ng gawaing apostoliko ni Pablo sa gitna ng mga taga-Corinto at higit pa
  alternative: Mas mataas na paggalang o pagpaparangal kay Pablo ng mga taga-Corinto
  rationale: Ang konteksto ay tungkol sa takdang saklaw ng paglilingkod at sa hindi pag-angkin sa pagpapagal ng iba; kaya ministeryal na paglawak ang pangunahing diwa, bagaman may literal na posibilidad na 'dakilain.'
- issue: Diwa ng κανών
  choice: saklaw na itinakda sa amin
  alternative: tuntunin, pamantayan, o takdang sukat
  rationale: Sa kontekstong ito, inilalarawan nito ang nakatalagang larangan ng apostolikong gawain at iniiwasan ang anakronistikong pagkaunawa sa 'kanon.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagpapagal” upang mapanatili ang bigat ng κόπος, at bahagyang nilinaw ang “aming gawain” dahil sa kontekstong apostoliko. Inilagay ang ἐν ὑμῖν sa sugnay ng paglawak, alinsunod sa ayos ng Griyego, habang pinananatili sa pangunahing teksto ang teolohikal na tensiyon sa pagitan ng pagdakila at paglawak sa pamamagitan ng talababa at paliwanag.
