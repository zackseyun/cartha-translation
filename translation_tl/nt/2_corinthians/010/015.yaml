revisions:
- from: Hindi kami nagmamalaki nang lampas sa hangganan tungkol sa mga pagpapagal ng iba. Sa halip, umaasa kami na habang lumalago ang inyong pananampalataya, lalo pang lalawak sa gitna ninyo ang aming gawain, ayon sa saklaw na itinakda sa amin,[a] hanggang sa higit pang lawak.[b]
  to: Hindi kami nagmamalaki nang lampas sa hangganan dahil sa mga pagpapagal ng iba. Sa halip, umaasa kami na, habang lumalago ang inyong pananampalataya, lalo pa kaming mapalawak[b] sa inyo ayon sa aming takdang saklaw,[a] hanggang sa higit pang lawak.[c]
  rationale: Pinalitan ang tahasang “ang aming gawain” ng “kami” upang sundin ang gramatikal na paksa ng Griyego at mapanatili ang saklaw ng μεγαλυνθῆναι. Ang kontekstuwal na diwa ng paglawak ng ministeryo ay inilagay sa talababa sa halip na ipataw sa pangunahing teksto. Inayos din ang pariralang tumutukoy sa pagpapagal ng iba at idinagdag ang kinakailangang talababa para sa pandiwang “mapalawak.”
  reviewer_model: gpt-5.6-terra
