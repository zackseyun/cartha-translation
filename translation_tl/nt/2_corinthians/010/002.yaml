  to: Ngunit nakikiusap ako na, pagdating ko riyan, huwag nawa akong mapilitang maging matapang, taglay ang pagtitiwalang balak kong taglayin sa matapang na pagkilos laban sa ilang tao na nag-aakalang namumuhay kami ayon sa laman[a].
  rationale: Inayos ang pariralang tumutukoy sa πεποίθησις, λογίζομαι, τολμῆσαι, at ἐπί τινας upang maipakita na ang pagtitiwala ay kaugnay ng matapang na pagkilos na maaaring gawin ni Pablo laban sa ilang tao. Pinanatili ang lahat ng pangunahing kahulugan, ang dignified na rehistro, at ang sadyang kalabuan ng "ayon sa laman."
