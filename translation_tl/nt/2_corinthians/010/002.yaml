  text: δέομαι δὲ τὸ μὴ παρὼν θαρρῆσαι τῇ πεποιθήσει ᾗ λογίζομαι τολμῆσαι ἐπί τινας τοὺς λογιζομένους ἡμᾶς ὡς κατὰ σάρκα περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/002.yaml
  text: But I beg that when I am present I may not have to be bold with the confidence by which I consider daring to confront some who regard us as walking according to the flesh[a].
translation:
  language: tl
  text: Ngunit nakikiusap ako na, pagdating ko riyan, huwag nawa akong mapilitang maging matapang, taglay ang pagtitiwalang balak kong taglayin sa matapang na pagkilos laban sa ilang tao na nag-aakalang namumuhay kami ayon sa laman[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa mga pamantayan ng tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δέομαι
  choice: nakikiusap ako
  rationale: Ipinahahayag nito ang taimtim na pakiusap ni Pablo, na mas mariin kaysa sa karaniwang “humihiling ako,” ngunit natural sa modernong Tagalog.
- source_word: τὸ μὴ παρὼν θαρρῆσαι
  choice: na, pagdating ko riyan, huwag nawa akong mapilitang magpakita ng tapang
  rationale: Inilalahad ng articular infinitive na may μή ang nilalaman ng pakiusap. Ipinakikita ng “mapilitang” ang di-kanais-nais na pangangailangang ipinahihiwatig ng konteksto.
- source_word: παρὼν
  choice: pagdating ko riyan
  rationale: Natural itong naghahatid ng ideya ng personal na pagharap ni Pablo sa mga taga-Corinto, kaiba sa pagiging malayo niya.
- source_word: θαρρῆσαι
  choice: magpakita ng tapang
  rationale: Tumutukoy ito sa matatag at tahasang pagkilos ni Pablo, hindi lamang sa panloob na pagkakaroon ng lakas ng loob.
- source_word: τῇ πεποιθήσει
  choice: taglay ang pagtitiwala
  rationale: 'Pinananatili nito ang instrumental o kasamang diwa ng dative: ang pagtitiwalang taglay niya sa pagkilos.'
- source_word: ᾗ λογίζομαι
  choice: na iniisip kong gamitin
  rationale: Ang λογίζομαι ay nagpapahiwatig ng pinag-isipang pasiya o balak. Ang “gamitin” ay likas na inuugnay ang pagtitiwala sa nakaplanong matapang na pagkilos.
- source_word: τολμῆσαι ἐπί τινας
  choice: gamitin laban sa ilang tao
  rationale: Pinananatili ng “laban sa” ang adversatibong puwersa ng ἐπί sa mga tao nang hindi labis na tinutukoy kung anong anyo ng pagharap ang gagawin.
- source_word: τοὺς λογιζομένους
  choice: mga taong nag-aakalang
  rationale: Ipinahahayag nito ang kanilang mapanuring palagay tungkol kay Pablo at sa mga kasama niya.
- source_word: κατὰ σάρκα
  choice: ayon sa laman
  rationale: Pinananatili ang mahalagang terminong Paulino at ang sadyang malawak na diwa nito, sa halip na paliitin agad sa “makasalanang kalikasan” o sa pamantayang pantao lamang.
- source_word: περιπατοῦντας
  choice: namumuhay
  rationale: Sa Tagalog, ang literal na “lumalakad” bilang metapora ng asal ay maaaring tunog-salin; malinaw at natural na naihahatid ng “namumuhay” ang metaporikal na kahulugan.
theological_decisions:
- issue: Kahulugan ng σάρξ sa κατὰ σάρκα
  choice: ayon sa laman
  alternative: ayon sa mga pamantayan ng tao
  rationale: Maaaring tumukoy ang paratang sa pagkilos ayon sa makatao o makamundong pamantayan, ngunit mas malawak ang teolohikal na saklaw ng σάρξ. Pinananatili sa pangunahing teksto ang “laman,” at inilalagay sa talababa ang mas interpretibong kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “riyan” upang natural na ipakita ang inaasahang pagdating ni Pablo sa mga mambabasa. Iniwasan ang sobrang literal na “lumalakad ayon sa laman,” ngunit pinanatili ang “laman” dahil sa tunay na leksikal at teolohikal na kalabuan.
