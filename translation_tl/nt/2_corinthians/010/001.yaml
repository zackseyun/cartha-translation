  text: Αὐτὸς δὲ ἐγὼ Παῦλος παρακαλῶ ὑμᾶς διὰ τῆς πραΰτητος καὶ ἐπιεικείας τοῦ Χριστοῦ, ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν, ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/001.yaml
  text: I myself[a], Paul, appeal to you by the meekness and gentleness of Messiah—I who am humble face to face among you[c][b], but bold toward you when absent.
translation:
  language: tl
  text: Ako mismo, si Pablo, ay nakikiusap sa inyo sa pamamagitan ng kaamuan at kahinahunan ng Mesiyas[a]—ako na mapagpakumbaba kapag kaharap ninyo,[b] ngunit matapang sa inyo kapag wala ako riyan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang Griyegong Χριστός ay isang titulong nangangahulugang “Mesiyas.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ayon sa mukha”; ibig sabihin, kapag personal na naroon o kaharap kayo. Ang “mapagpakumbaba” ay maaaring may himig ng ironya at maaaring tumukoy sa sinasabi ng ilan tungkol kay Pablo; maaari rin itong isaling “mababa” o, nang mas interpretatibo, “mahiyain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς δὲ ἐγὼ Παῦλος
  choice: Ako mismo, si Pablo
  rationale: Pinananatili ng “ako mismo” ang mariing pagbanggit ni Pablo sa sarili. Hindi ginawang “ngayon” ang δέ; sapat sa Filipino ang ayos ng pangungusap upang ipahiwatig ang paglipat ng paksa nang hindi nagdaragdag ng panahong wala sa Griyego.
- source_word: παρακαλῶ ὑμᾶς
  choice: nakikiusap sa inyo
  rationale: Ipinapahayag nito ang taimtim at personal na pakiusap, sa halip na isang tuwirang utos.
- source_word: διὰ τῆς πραΰτητος καὶ ἐπιεικείας
  choice: sa pamamagitan ng kaamuan at kahinahunan
  rationale: 'Pinananatili ang διά bilang batayan o paraang kaugnay ng pakiusap. Ang “kaamuan” at “kahinahunan” ay magkalapit ngunit hindi ganap na magkapareho: ang una ay maamong lakas, at ang ikalawa ay mapagbigay at mahinahong pakikitungo.'
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Ang Χριστός ay gumaganap dito bilang titulo; isinasalin itong “Mesiyas” upang ihayag ang kahulugan ng titulo.
- source_word: ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν
  choice: ako raw na mapagpakumbaba kapag kaharap ninyo
  rationale: Ang “kapag kaharap ninyo” ay natural na katumbas ng idyomang κατὰ πρόσωπον sa kontekstong salungat sa pagiging wala. Ang “raw” ay nagpapahiwatig na maaaring inuulit ni Pablo ang paglalarawan ng iba, ngunit hindi ito ginagawang tahasang sipi.
- source_word: ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς
  choice: ngunit matapang sa inyo kapag wala ako riyan
  rationale: Pinananatili ang retorikal na salungatan ng “mapagpakumbaba” at “matapang.” Ang “sa inyo” ay hindi pinalalakas bilang “laban sa inyo,” sapagkat hindi tiyak na palaban ang εἰς.
theological_decisions:
- issue: Paglalarawan kay Jesus sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay titulo ang Χριστός, kaya isinasalin ang kahulugan nito sa halip na transliterahin lamang.
- issue: Kung sariling paglalarawan ni Pablo o paratang ng iba ang ταπεινός/θαρρῶ
  choice: Pinanatili ang posibleng ironya sa “ako raw,” habang nananatiling malapit sa mismong mga salita
  alternative: Alisin ang “raw” at gawing tuwirang sariling paglalarawan ni Pablo; o isalin ang ταπεινός bilang “mahiyain”
  rationale: Malamang na inuulit ni Pablo ang puna tungkol sa kanya, ngunit hindi tahasang minarkahan ng Griyego bilang sipi. Hindi isinalin bilang “mahiyain” upang hindi labis na ipakahulugan ang ταπεινός.
translation_notes:
  register: Makabago at marangal na Filipino, na may payak na bokabularyong madaling maunawaan. Ginamit ang “riyan” sapagkat ang tinutukoy ay ang kinaroroonan ng mga kausap, samantalang wala roon si Pablo. Pinanatili ang mariin at bahagyang ironikong tono ng talata.
