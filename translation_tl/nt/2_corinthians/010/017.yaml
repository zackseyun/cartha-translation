translation:
  language: tl
  text: Ngunit ang sinumang nagmamalaki ay magmalaki sa Panginoon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na ipinapaalingawngaw ni Pablo ang Jeremias 9:24 (9:23 sa LXX).
    reason: cross_reference
lexical_decisions:
- source_word: Ὁ ... καυχώμενος
  choice: ang nagmamalaki
  rationale: Ang artikulo at pangkasalukuyang participle ay tumutukoy sa sinumang taong nagmamalaki; likas at pangkalahatan sa modernong Tagalog ang “ang nagmamalaki.”
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ito ng banayad na pagsalungat sa naunang argumento, kaya ang “Ngunit” ay angkop sa konteksto.
- source_word: καυχώμενος / καυχάσθω
  choice: nagmamalaki / magmalaki
  rationale: Pinananatili ng magkaugnay na anyo ng “magmalaki” ang pag-uulit at retorikal na diin ng Griyego. Ang pautos na “magmalaki” ay tuwirang naghahatid sa ikatlong panauhang imperative.
- source_word: ἐν
  choice: sa
  rationale: Sa pariralang ito, natural na ipinahahayag ng “sa Panginoon” ang saklaw o batayan ng pagmamalaki nang hindi labis na nililinaw ang ugnayan.
- source_word: κυρίῳ
  choice: Panginoon
  rationale: Pinananatili nito ang payak na katawagang nasa Griyego at hindi tinutukoy nang higit sa teksto kung ang tinutukoy ay ang Panginoong Jesus o ang Diyos sa alusyon sa Kasulatan.
theological_decisions:
- issue: Ang tinutukoy ng “Panginoon” sa konteksto ng sipi o alusyon
  choice: Panginoon
  alternative: Panginoong Jesus; Diyos
  rationale: Dahil κυρίῳ lamang ang nasa Griyego at umaalingawngaw ang Jeremias 9:24, pinananatili ang “Panginoon” upang huwag lutasin sa salin ang tunay na teolohikal na tensiyon.
- issue: Lakas ng ikatlong panauhang imperative καυχάσθω
  choice: ay sa Panginoon magmalaki
  alternative: dapat magmalaki sa Panginoon
  rationale: Ang anyong ito ay natural na pautos sa marangal na Tagalog at mas malapit sa pormal na “let ... boast,” nang hindi ginagawang tahasang obligasyon ang modal na “dapat.”
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Pinanatili ang retorikal na pag-uulit ng ugat na “magmalaki” at ang hindi tiyak na referent ng “Panginoon.”
