  text: Τὰ κατὰ πρόσωπον βλέπετε. εἴ τις πέποιθεν ἑαυτῷ Χριστοῦ εἶναι, τοῦτο λογιζέσθω πάλιν ⸀ἐφ’ ἑαυτοῦ ὅτι καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ⸀ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/007.yaml
  text: 'You are looking at outward appearances[a]. If anyone is confident in himself that he belongs to Messiah, let him consider this again within himself: that just as he belongs to Messiah[b], so also do we.'
translation:
  language: tl
  text: 'Tinitingnan ninyo ang mga panlabas na anyo.[a] Kung may taong nakatitiyak sa sarili niyang kabilang siya sa Mesiyas, muli niyang isaalang-alang ito sa sarili niya: kung paanong kabilang siya sa Mesiyas, gayundin kami.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Tinitingnan ninyo ang mga bagay ayon sa anyo.” Maaari ring unawain bilang pautos: “Tingnan ninyo ang nasa harapan ninyo.”'
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, ang pananalita ay may anyong “ay ng Mesiyas,” na maaaring magpahiwatig ng pagkabilang o pag-aari; isinalin itong “kabilang sa Mesiyas.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τὰ κατὰ πρόσωπον
  choice: ang panlabas na anyo
  rationale: Ipinahahayag nito sa likas na modernong Tagalog ang malamang na idyomatikong diwa ng paghatol batay sa nakikita sa labas, habang inilalagay sa talababa ang mas literal at posibleng alternatibong pagbasa.
- source_word: βλέπετε
  choice: Tinitingnan ninyo
  rationale: 'Maaaring anyong pasalaysay o pautos ang Griyego, ngunit mas angkop sa konteksto ng pagsaway ang pasalaysay: inilalarawan ni Pablo ang ginagawa nila.'
- source_word: πέποιθεν ἑαυτῷ
  choice: nakatitiyak sa sarili
  rationale: Ang perpektong pandiwa ay nagpapahiwatig ng matatag o namamalaging katiyakan; natural sa Tagalog ang pariralang ito at napapanatili ang bahid ng tiwala sa sariling pagtatasa.
- source_word: Χριστοῦ εἶναι
  choice: kabilang sa Mesiyas
  rationale: Ipinahahayag ng henitibo kasama ng εἶναι ang pag-aari o kaugnayan. Ginamit ang “Mesiyas” bilang titulo at ang “kabilang sa” upang maging malinaw at natural ang diwa.
- source_word: λογιζέσθω πάλιν
  choice: muli niyang pag-isipan
  rationale: Pinananatili nito ang puwersa ng pautos na humihiling ng panibagong maingat na pagsasaalang-alang.
- source_word: ἐφ’ ἑαυτοῦ
  choice: sa kanyang sarili
  rationale: Ipinahahayag nito ang panloob at pansariling pagninilay nang hindi ipinapalagay na ang kahulugan ay “nang walang tulong ng iba.”
- source_word: καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ἡμεῖς
  choice: kung paanong siya ay kabilang sa Mesiyas, gayundin naman kami
  rationale: Pinananatili ang paghahambing at ang mariing pag-angkin ni Pablo na kabilang din sila sa Mesiyas; natural na ipinahihiwatig sa hulihan ang pandiwang “kabilang.”
theological_decisions:
- issue: Paglalahad sa Χριστοῦ
  choice: sa Mesiyas
  alternative: kay Cristo
  rationale: Ang Χριστός ay gumaganap bilang titulo rito. Ang “Mesiyas” ay malinaw na nagsasaad ng titulong “Pinahiran,” nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Saklaw ng pag-angkin na kabilang sa Mesiyas
  choice: Hindi hinatulan ang katapatan ng unang nag-aangkin; iginiit lamang na kabilang din sina Pablo
  alternative: Ipahiwatig na huwad ang pag-angkin ng kausap
  rationale: Ang teksto ay naghahambing—“kung paanong siya… gayundin naman kami”—at hindi tahasang nagpapawalang-bisa sa unang pag-angkin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ninyo” at “kanyang” para sa natural na daloy; iniwasan ang masyadong teknikal o makalumang pananalita. Pinanatili sa talababa ang tunay na kalabuan kung pasalaysay o pautos ang βλέπετε at kung ano ang eksaktong saklaw ng κατὰ πρόσωπον.
