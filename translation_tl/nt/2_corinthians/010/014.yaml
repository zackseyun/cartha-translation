base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/014.yaml
  text: For we are not overextending ourselves[a], as though we had not reached you[c][b], for we came even as far as you with the gospel of Messiah—
translation:
  language: tl
  text: Sapagkat hindi kami lumalampas sa aming saklaw, na para bang hindi kami umabot sa inyo, sapagkat nakarating nga kami hanggang sa inyo dala ang magandang balita ng Mesiyas—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερεκτείνομεν ἑαυτούς
  choice: lumalampas sa aming saklaw
  rationale: Ipinahahayag nito ang larawan ng pag-abot nang lampas sa wastong hangganan, ngunit sa natural na modernong Tagalog; nananatili rin ang kasalukuyang aspekto ng pandiwa.
- source_word: ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς
  choice: na para bang hindi kami umabot sa inyo
  rationale: Pinananatili ang di-tunay na palagay na magiging batayan sana ng paratang na lumalampas si Pablo at ang kaniyang mga kasama sa kanilang saklaw.
- source_word: ἄχρι ... καὶ ὑμῶν
  choice: maging hanggang sa inyo
  rationale: Ang “maging” ay nagpapanatili sa diin ng καί, samantalang malinaw na ipinahahayag ng “hanggang sa inyo” ang lawak ng kanilang gawain.
- source_word: ἐφθάσαμεν
  choice: nakarating kami
  rationale: Ipinakikita ng anyong pangnagdaan ang natapos na pagdating ng mga tagapangaral sa Corinto at natural itong kaakibat ng “hanggang sa inyo.”
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: dala ang magandang balita
  rationale: Natural na ipinahahayag sa Tagalog na nakarating sila bilang mga tagapagdala ng magandang balita, habang pinananatili ang instrumental o kasamang diwa ng ἐν.
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Dito, ang Χριστός ay nananatiling titulong mesiyaniko sa pariralang tumutukoy sa magandang balita; ang “ng” ay hindi labis na nagpapasiya kung ito ay balitang tungkol sa kaniya o nagmumula at nauukol sa kaniya.
theological_decisions:
- issue: Paglilipat ng Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa kontekstong “magandang balita ng Χριστός,” malinaw pa rin ang tungkulin nito bilang titulo. Kaya pinili ang “Mesiyas” nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- issue: Ugnayan ng genitibong τοῦ Χριστοῦ sa εὐαγγελίῳ
  choice: magandang balita ng Mesiyas
  alternative: magandang balita tungkol sa Mesiyas
  rationale: Ang payak na “ng” ay nagpapanatili sa posibleng lawak ng genitibo—ang balita ay maaaring tungkol sa Mesiyas at/o nauukol sa kaniya—sa halip na tahasang itakda lamang bilang layon ng balita.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “saklaw” upang maging natural ang metapora ng paglampas sa hangganan, at ang “maging hanggang sa inyo” upang mapanatili ang diin ng καί. Pinanatili ang pangwakas na gitling sapagkat nagpapatuloy ang pangungusap sa kasunod na talata.
