  source_fidelity: 'Tumpak ang pangunahing mga katumbas: “mga sandata,” “pakikidigma,” “ayon sa laman,” “mga kuta,” at “mga pangangatwiran.” Ang “sa harap ng Diyos” ay isang maingat at posibleng pagbasa ng siksik na datibong τῷ θεῷ, at ang mga alternatibo sa talababa ay angkop na nagpapakita ng iba pang posibleng pag-unawa.'
  naturalness: May bahagyang suliraning sintaktiko sa “upang gibain ang mga kuta—ginigiba namin ang mga pangangatwiran.” Ang “upang gibain” ay pariralang layunin, samantalang ang kasunod ay tila isang bagong malayang sugnay. Ang pag-uugnay sa dalawang kilos ay nagbibigay ng likas na modernong Tagalog nang hindi binabago ang saklaw ng metapora.
  terminology: Ang “laman” ay mahusay na pinananatili nang hindi ipinapakahulugang makasalanan lamang. Ang “mga pangangatwiran” ay angkop para sa λογισμούς sa kontekstong ito. Ang “mga kuta” ay malinaw at nagpapanatili ng larawang militar.
