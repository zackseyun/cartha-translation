  text: τὰ γὰρ ὅπλα τῆς στρατείας ἡμῶν οὐ σαρκικὰ ἀλλὰ δυνατὰ τῷ θεῷ πρὸς καθαίρεσιν ὀχυρωμάτων— λογισμοὺς καθαιροῦντες
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/004.yaml
  text: For the weapons of our warfare are not fleshly[c][b][a], but powerful before God for the tearing down of strongholds—tearing down arguments
translation:
  language: tl
  text: Sapagkat ang mga sandata ng aming pakikidigma ay hindi ayon sa laman[a], kundi makapangyarihan sa harap ng Diyos[b] upang gibain ang mga kuta—at ginigiba namin ang mga pangangatwiran.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi makalaman” o “hindi mula sa laman.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “makapangyarihan sa pamamagitan ng Diyos,” “may kapangyarihang mula sa Diyos,” o “lubhang makapangyarihan.”
    reason: alternative_reading
  - marker: c
    text: Maaari ring “mga argumento,” “mga kaisipan,” o “mga haka-haka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλα
  choice: mga sandata
  rationale: Pinananatili ang kongkretong larawang militar at likas itong pakinggan sa modernong Tagalog.
- source_word: στρατείας
  choice: pakikidigma
  rationale: Ipinahahayag ang patuloy na tunggaliang militar, hindi lamang isang tiyak na kampanya o paglilingkod bilang kawal.
- source_word: σαρκικὰ
  choice: ayon sa laman
  rationale: Pinananatili ang ugnayan sa salitang σάρξ at ang tensiyong Paulino nang hindi ito agad nililimitahan sa pagiging makasalanan, makamundo, o pisikal lamang.
- source_word: δυνατὰ τῷ θεῷ
  choice: makapangyarihan sa harap ng Diyos
  rationale: Tuwirang kinikilala ang kompresong datibong τῷ θεῷ nang hindi ipinipilit sa pangunahing teksto na ito ay tiyak na instrumento o pinagmulan.
- source_word: καθαίρεσιν
  choice: upang gibain
  rationale: Natural sa Tagalog at pinananatili ang masiglang larawan ng pagpapabagsak sa mga tanggulan.
- source_word: ὀχυρωμάτων
  choice: mga kuta
  rationale: Karaniwang katumbas ng mga pinatibay na tanggulan at angkop kapuwa sa larawang literal at sa metaporikal na gamit.
- source_word: λογισμοὺς
  choice: mga pangangatwiran
  rationale: Saklaw nito ang mga proseso o balangkas ng pag-iisip; hindi nito agad pinaliliit ang kahulugan sa pormal na argumento lamang.
- source_word: καθαιροῦντες
  choice: ginigiba namin
  rationale: Inuulit ang pandiwang 'gibain' upang mapanatili ang leksikal at retorikal na kaugnayan nito sa καθαίρεσιν; ginawang tahasan ang likas na paksa sa Tagalog.
theological_decisions:
- issue: Kahulugan ng σαρκικὰ sa paghahambing ng paraang pantao at kapangyarihang may kaugnayan sa Diyos
  choice: hindi ayon sa laman
  alternative: hindi makalaman; hindi makamundo; hindi mula sa laman
  rationale: Pinananatili nito ang teolohikal na lawak ng 'laman' at iniiwasang ipakahulugan agad bilang kahalayan, materyalismo, o kasalanan lamang.
- issue: Lakas ng datibong τῷ θεῷ sa δυνατὰ τῷ θεῷ
  choice: makapangyarihan sa harap ng Diyos
  alternative: makapangyarihan sa pamamagitan ng Diyos; may kapangyarihang mula sa Diyos; lubhang makapangyarihan
  rationale: Hindi ganap na tiyak kung ang datibo ay nagpapahiwatig ng pagsusuri sa harap ng Diyos, pinagmulan o instrumento, o isang idyomatikong diin. Pinananatili ng teksto at talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang larawang militar sa “mga sandata,” “pakikidigma,” “mga kuta,” at “ginigiba,” habang iniwasan ang masyadong teknikal o denominasyonal na pananalita.
