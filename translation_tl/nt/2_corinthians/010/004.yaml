  to: Sapagkat ang mga sandata ng aming pakikidigma ay hindi ayon sa laman[a], kundi makapangyarihan sa harap ng Diyos[b] upang gibain ang mga kuta—at ginigiba namin ang mga pangangatwiran.[c]
