  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὐ γὰρ τολμῶμεν ἐγκρῖναι ἢ συγκρῖναι ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων· ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες καὶ συγκρίνοντες ἑαυτοὺς ἑαυτοῖς οὐ συνιᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/012.yaml
  text: For we do not dare to classify or compare ourselves with some of those who commend themselves[a]. But when they measure themselves by themselves and compare themselves with themselves[b], they do not understand.
translation:
  language: tl
  text: Sapagkat hindi kami nangangahas na ibilang o ihambing ang aming mga sarili sa ilan sa mga pumupuri sa kanilang sarili.[a] Ngunit sila mismo, sa pagsukat ng kanilang sarili ayon sa kanilang sarili at sa paghahambing ng kanilang sarili sa kanilang sarili,[b] ay hindi nakauunawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isama ang aming mga sarili sa” o “ihanay ang aming mga sarili sa”; ang pandiwang Griyego ay may diwa ng paglalagay ng sarili sa kaparehong pangkat o antas ng iba.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sinusukat ang kanilang sarili sa kanilang sarili at inihahambing ang kanilang sarili sa kanilang sarili.” Ang paulit-ulit na pananalita ay nagpapakitang sila rin ang ginagamit nilang pamantayan; maaari rin itong magpahiwatig ng paghahambingan sa loob ng sarili nilang pangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: τολμῶμεν
  choice: hindi kami nangangahas
  rationale: Pinananatili nito ang diwa ng pag-aatubili o pagtangging maglakas-loob, pati ang bahagyang mapanuyang tono ni Pablo.
- source_word: ἐγκρῖναι
  choice: ibilang
  rationale: Sa konteksto, tumutukoy ito sa paglalagay ng sarili sa isang pangkat o antas, hindi lamang sa paghatol; natural sa Filipino ang “ibilang ang sarili sa.”
- source_word: συγκρῖναι / συγκρίνοντες
  choice: ihambing / paghahambing
  rationale: Pinananatili ang karaniwang kahulugan at ang retorikal na pag-uulit ng salitang Griyego.
- source_word: ἑαυτοὺς συνιστανόντων
  choice: mga pumupuri sa kanilang sarili
  rationale: Ipinahahayag ang sariling pagrekomenda o pagpuri sa sarili, isang mahalagang tema sa bahaging ito.
- source_word: ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες
  choice: sa pagsukat nila sa kanilang sarili gamit ang sarili nila
  rationale: Pinananatili ang talinghaga ng pagsukat at ipinakikitang ang sarili rin nila ang pamantayan, habang nililinaw sa talababa ang literal na ayos.
- source_word: ἑαυτοὺς ἑαυτοῖς
  choice: sa kanilang sarili sa isa’t isa
  rationale: Iniiwasang lubusang alisin ang posibleng diwa na nagkukumparahan sila sa loob ng sarili nilang pangkat; ang Griyego ay sadyang punô ng inuulit na panghalip na panao.
- source_word: οὐ συνιᾶσιν
  choice: hindi nakauunawa
  rationale: Direkta at marangal na salin ng kawalan nila ng pagkaunawa sa kamalian ng ganitong pagsusukat.
theological_decisions:
- issue: Saklaw ng sarili bilang pamantayan sa ἐν ἑαυτοῖς ... ἑαυτοῖς
  choice: Ipinahihiwatig sa teksto na sarili nila ang kanilang pamantayan, habang pinananatili ang posibilidad ng paghahambingan sa isa’t isa sa loob ng pangkat.
  alternative: Unawain lamang bilang bawat isa na inihahambing ang sarili niya sa sarili niya.
  rationale: Maaaring tumukoy ang magkakaibang anyo ng ἑαυτοῖς sa sarili bilang pamantayan o sa kapuwa kabilang sa pangkat. Hindi dapat gawing mas tiyak ang salin kaysa sa Griyego.
translation_notes:
  register: Makabagong, dignificado, at madaling maunawaang Filipino. Pinanatili ang matinding pag-uulit ng “sarili” sapagkat mahalaga ito sa pangungutya at pangangatwiran ni Pablo, ngunit inayos ang sintaks upang maging natural basahin.
