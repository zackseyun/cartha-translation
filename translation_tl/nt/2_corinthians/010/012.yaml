  terminology: Ang “nangangahas,” “ibilang,” “ihambing,” “pumupuri sa kanilang sarili,” at “hindi nakauunawa” ay angkop sa modernong Filipino Tagalog at mahusay na tumutugon sa mga pangunahing salitang Griyego.
