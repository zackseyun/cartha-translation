  to: Sapagkat hindi kami nangangahas na ibilang o ihambing ang aming mga sarili sa ilan sa mga pumupuri sa kanilang sarili.[a] Ngunit sila mismo, sa pagsukat ng kanilang sarili ayon sa kanilang sarili at sa paghahambing ng kanilang sarili sa kanilang sarili,[b] ay hindi nakauunawa.
  rationale: Pinalitan ang “sa isa’t isa” upang hindi ipataw sa pangunahing teksto ang isang pinagtatalunang pagpapakahulugan sa mga paulit-ulit na reflexive ng Griyego. Inayos din ang unang reflexive sa pangmaramihang anyo. Pinanatili ang talinghaga ng pagsukat, ang diin sa “sila mismo,” at ang mapanuyang pag-uulit na mahalaga sa pangangatwiran ni Pablo.
