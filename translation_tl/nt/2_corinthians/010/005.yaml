  text: καὶ πᾶν ὕψωμα ἐπαιρόμενον κατὰ τῆς γνώσεως τοῦ θεοῦ, καὶ αἰχμαλωτίζοντες πᾶν νόημα εἰς τὴν ὑπακοὴν τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/005.yaml
  text: and every lofty thing raised up against the knowledge of God[a], and taking every thought captive into obedience to Messiah[b],
translation:
  language: tl
  text: at bawat mataas na bagay na itinataas laban sa pagkakilala sa Diyos[a], at binibihag namin ang bawat kaisipan upang mapasunod sa Mesiyas[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaalaman tungkol sa Diyos.” Ang “mataas na bagay” ay maaari ring isaling “matayog na bagay” o “mapagmataas na pag-aangkin.”
    reason: lexical_alternative
  - marker: b
    text: 'Griyego: “ang Mesiyas”; tradisyonal na “Cristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν ὕψωμα
  choice: bawat mataas na bagay
  rationale: Pinananatili nito ang larawan ng isang bagay na nakataas o matayog, nang hindi nililimitahan ang kahulugan sa pagmamataas o mapagkunwaring pahayag lamang. Ipinahahayag ng “bawat” ang distributibong diwa ng πᾶν.
- source_word: ἐπαιρόμενον
  choice: na itinataas
  rationale: Pinananatili ng anyong ito ang pasibo o resultang diwa ng participle at ang larawan ng isang nakataas na hadlang; hindi nito ipinapalagay na ang bagay ay kusang “nagmamataas.”
- source_word: κατὰ τῆς γνώσεως τοῦ θεοῦ
  choice: laban sa pagkakilala sa Diyos
  rationale: Ang “pagkakilala” ay likas sa Filipino at maaaring tumukoy kapwa sa tunay na kaalaman tungkol sa Diyos at sa relasyonal na pagkilala sa kanya, kaya hindi labis na pinakikitid ang genitive construction.
- source_word: αἰχμαλωτίζοντες
  choice: binibihag namin
  rationale: Pinananatili nito ang matingkad na metapora ng pagkuha ng bihag sa digmaan. Ginawang hayag ang unang panauhang maramihan na ipinahihiwatig ng nominative plural participle at ng konteksto.
- source_word: πᾶν νόημα
  choice: bawat kaisipan
  rationale: Ang “kaisipan” ang pinakanatural na katumbas sa kontekstong ito at naipapakita ng “bawat” ang distributibong puwersa ng πᾶν, nang hindi ipinapalagay na masasamang pakana lamang ang tinutukoy.
- source_word: εἰς τὴν ὑπακοὴν
  choice: upang sumunod
  rationale: Natural itong Filipino para sa kilos na nakatuon sa resultang pagsunod. Isinasalin nito ang direksiyon at layunin ng εἰς nang hindi gumagamit ng pilit na literal na parirala.
- source_word: τοῦ Χριστοῦ
  choice: sa Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” sa halip na tratuhing pangalan lamang; ang “sa” ay nagpapahayag na sa Mesiyas nakatuon ang pagsunod.
theological_decisions:
- issue: Saklaw ng πᾶν ὕψωμα ἐπαιρόμενον
  choice: isang pangkalahatang mataas na bagay na itinataas laban sa pagkakilala sa Diyos
  alternative: bawat pag-aangking mapagmataas na lumalaban sa pagkakilala sa Diyos
  rationale: Malawak ang metapora sa Griyego. Pinananatili ng salin ang larawan ng anumang nakataas na hadlang at hindi ito nililimitahan sa intelektuwal na pag-aangkin o sikolohikal na pagmamataas.
- issue: Kahulugan ng γνώσεως τοῦ θεοῦ
  choice: pagkakilala sa Diyos
  alternative: kaalaman tungkol sa Diyos
  rationale: Maaaring saklawin ng Griyego ang kaalaman tungkol sa Diyos at ang relasyonal na pagkilala sa kanya. Pinananatili ng pangunahing salin ang lawak na ito, habang inilalahad sa talababa ang mas proposisyonal na alternatibo.
- issue: Pagbibigay ng Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Gumaganap dito ang Χριστός bilang titulo ng hinirang na Mesiyas. Isinasalin ang titulo upang mapanatili ang kahulugan nito, habang kinikilala sa talababa ang tradisyonal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang metapora ng mga nakataas na hadlang at pagbihag sa digmaan. Ang “binibihag namin” ay ginamit upang maipahayag nang natural sa Filipino ang unang panauhang maramihan na nakapaloob sa Griyegong participle. Pinanatili rin ang anyong fragmento at pangwakas na kuwit dahil bahagi ito ng mas mahabang pangungusap sa konteksto.
