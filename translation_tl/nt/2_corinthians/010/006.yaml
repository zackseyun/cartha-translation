id: 2CO.10.6
reference: 2 Corinthians 10:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐν ἑτοίμῳ ἔχοντες ἐκδικῆσαι πᾶσαν παρακοήν, ὅταν πληρωθῇ ὑμῶν ἡ ὑπακοή.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/006.yaml
  text: and being ready to punish every act of disobedience[b][a], when your obedience is complete.
translation:
  language: tl
  text: at nakahandang parusahan ang bawat pagsuway[a] kapag naging ganap na ang inyong pagsunod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipaghiganti ang bawat pagsuway” o “maglapat ng katarungan laban sa bawat pagsuway.” Maaaring taglayin ng pandiwang Griego ang mga kahulugang ito, ngunit sa kontekstong ito ay malamang na tumutukoy sa pandisiplinang pagpaparusa.
    reason: lexical_alternative
  - marker: b
    text: O “kapag natupad na” o “kapag nalubos na ang inyong pagsunod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑτοίμῳ ἔχοντες
  choice: nakahandang
  rationale: Likas at maikli itong salin ng idyomang nangangahulugang nasa kalagayang handa, habang pinananatili ang kaugnayan nito sa naunang pangungusap.
- source_word: ἐκδικῆσαι
  choice: parusahan
  rationale: Sa konteksto ng awtoridad at pagtutuwid, malinaw nitong ipinahihiwatig ang paglalapat ng parusa nang hindi ito agad ipinakahulugang personal na paghihiganti.
- source_word: πᾶσαν παρακοήν
  choice: ang bawat pagsuway
  rationale: Pinananatili ng “bawat” ang distributibong puwersa ng πᾶσαν, at ang “pagsuway” ay tuwirang katumbas ng παρακοή.
- source_word: ὅταν
  choice: kapag
  rationale: Ipinahahayag ng “kapag” ang panghinaharap na kalagayang kailangang maganap bago ang binanggit na pagkilos.
- source_word: πληρωθῇ
  choice: naging ganap na
  rationale: Ipinakikita nito na ang pagsunod ay umabot sa kabuuan o ganap na kalagayan, at likas itong pakinggan sa modernong Tagalog.
- source_word: ὑμῶν ἡ ὑπακοή
  choice: ang inyong pagsunod
  rationale: Tuwiran at marangal na salin ito ng pariralang tumutukoy sa pagsunod ng mga taga-Corinto.
theological_decisions:
- issue: Likas ng gagawing tugon ni Pablo sa pagsuway
  choice: pagpaparusa o pandisiplinang pagkilos laban sa pagsuway
  alternative: paghihiganti sa bawat pagsuway; paglalapat ng katarungan laban sa bawat pagsuway
  rationale: Ang malapit na konteksto ay tungkol sa apostolikong awtoridad at pagtutuwid sa mga sumasalungat. Gayunman, pinananatili sa talababa ang mas malawak na saklaw ng pandiwang Griego at hindi lubusang isinasara ang leksikal na tensiyon.
- issue: Kaganapan ng pagsunod ng mga taga-Corinto
  choice: kapag naging ganap na ang inyong pagsunod
  alternative: kapag natupad o nalubos na ang inyong pagsunod
  rationale: Ipinahihiwatig ng balarila ang isang panghinaharap at nakasalalay na kalagayan kung saan aabot sa kabuuan ang kanilang pagsunod, nang hindi tinutukoy nang lampas sa teksto kung anong tiyak na kilos ang bubuo rito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “inyong” upang mapanatili ang maramihang ikalawang panauhan at ang angkop na rehistro. Nagsisimula sa “at” upang panatilihin ang sintaktikong ugnayan sa naunang talata.
