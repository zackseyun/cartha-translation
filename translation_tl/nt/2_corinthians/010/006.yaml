  source_fidelity: Tapat ang salin sa Griyego. Ang “nakahandang” ay wastong katumbas ng ἐν ἑτοίμῳ ἔχοντες; ang “parusahan ang bawat pagsuway” ay naipapahayag ang ἐκδικῆσαι πᾶσαν παρακοήν nang hindi ipinipilit ang personal na paghihiganti; at ang “kapag naging ganap na ang inyong pagsunod” ay sapat na naghahatid ng panghinaharap at nakasalalay na pagkapuno/pagkaganap ng ὅταν πληρωθῇ ὑμῶν ἡ ὑπακοή.
