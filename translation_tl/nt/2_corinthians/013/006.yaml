translation:
  language: tl
  text: Ngunit umaasa akong malalaman ninyo na hindi kami bumagsak sa pagsubok.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi kami napatunayang di-karapat-dapat.” Ang pang-uring Griyego ay tumutukoy sa hindi pagtanggap bilang aprobado pagkatapos subukin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: umaasa ako
  rationale: Likas na salin ng pangkasalukuyang pandiwang nasa unang panauhan; pinananatili nito ang inaasahan ni Pablo tungkol sa pagkilalang mangyayari.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ng banayad na pagsalungat sa naunang pangamba na baka siya at ang mga kasama niya ang lumabas na bumagsak sa pagsubok.
- source_word: γνώσεσθε
  choice: malalaman ninyo
  rationale: Tuwirang ipinahahayag ang hinaharap na pagkaalam ng mga taga-Corinto nang hindi dinaragdagan ng diwang proseso na maaaring ipahiwatig ng ibang salin.
- source_word: ὅτι
  choice: na
  rationale: Natural na Tagalog na pantukoy sa nilalaman ng pandiwang “malalaman.”
- source_word: ἡμεῖς
  choice: kami
  rationale: Tumutukoy kay Pablo at sa kaniyang mga kamanggagawa; ang tahasang panghalip sa Griyego ay sapat na naipahahayag sa karaniwang ayos ng Tagalog.
- source_word: οὐκ ἐσμὲν
  choice: hindi kami
  rationale: Pinananatili ang payak na pagtanggi at hindi ito pinalalakas nang higit sa nasa Griyego.
- source_word: ἀδόκιμοι
  choice: bumagsak sa pagsubok
  rationale: Sa konteksto ng pagsusuri at pagpapatunay, inilalarawan ng salita ang hindi paglabas na aprobado matapos subukin. Malinaw at natural ito sa modernong Tagalog at hindi nag-aangkat ng doktrinal na kahulugan ng mga salitang gaya ng “itinakwil.”
theological_decisions:
- issue: Kahulugan ng ἀδόκιμοι sa konteksto ng pagsubok at pagiging tunay ng paglilingkod ng mga apostol
  choice: hindi kami bumagsak sa pagsubok
  alternative: hindi kami napatunayang karapat-dapat; hindi kami pasado; hindi kami itinakwil
  rationale: Pinananatili ng salin ang metapora ng pagsusuri sa kalapit na mga talata at ang evaluative na puwersa ng salita. Iniiwasan nito ang “itinakwil,” na maaaring magpasok ng mas tiyak na doktrinal na kahulugang wala naman sa mismong pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “bumagsak sa pagsubok” upang mapanatili ang pagsusuring larawan ng konteksto sa isang paraang madaling maunawaan ng karaniwang mambabasa.
