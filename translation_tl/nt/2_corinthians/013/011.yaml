id: 2CO.13.11
reference: 2 Corinthians 13:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Λοιπόν, ἀδελφοί, χαίρετε, καταρτίζεσθε, παρακαλεῖσθε, τὸ αὐτὸ φρονεῖτε, εἰρηνεύετε, καὶ ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/011.yaml
  text: Finally[a], brothers, rejoice, be restored, be encouraged, think the same thing, live in peace[e][d][c][b], and the God of love and peace will be with you.
translation:
  language: tl
  text: Sa wakas[a], mga kapatid[b], magalak kayo, magpaayos kayo[c], tanggapin ninyo ang pagpapalakas-loob[d], magkaisa kayo sa pag-iisip[e], mamuhay nang mapayapa, at ang Diyos ng pag-ibig at kapayapaan ay makakasama ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bilang pangwakas” o “paalam.” Ang salitang Griyego ay maaaring maging bati ng pamamaalam, ngunit dito ay malamang na nagpapatuloy ito sa sunod-sunod na mga panawagan.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego ay literal na panlalaking maramihan, ngunit sa pagtawag sa kongregasyon ay malamang na kabilang ang mga lalaki at babae.
    reason: cultural_note
  - marker: c
    text: Maaari ring “maibalik kayo sa ayos,” “maging handa kayo,” o “maging ganap kayo.”
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “magpalakas-loob kayo,” “tumanggap kayo ng pangaral,” o “tumanggap kayo ng panghihikayat.”
    reason: lexical_alternative
  - marker: e
    text: Literal na “isipin ninyo ang iisang bagay”; ibig sabihin, magkaisa sa pag-iisip.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπόν
  choice: Sa wakas
  rationale: Likas na panandang pangwakas sa modernong Tagalog at angkop sa pagtatapos ng liham.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Tumpak na katumbas sa Tagalog; sa pagtawag sa isang kongregasyon, likas itong nauunawaang kabilang ang mga lalaki at babae.
- source_word: χαίρετε
  choice: magalak kayo
  rationale: Bagaman maaari rin itong maging bati ng pamamaalam, mas malamang na isa itong utos dahil kabilang ito sa sunod-sunod na mga panawagan.
- source_word: καταρτίζεσθε
  choice: magpaayos kayo
  rationale: Ipinahihiwatig ng pandiwa ang pagpapanumbalik o pagdadala sa wastong kalagayan. Pinananatili ng anyong ito ang gitna/pasibong diwa nang hindi ipinahihiwatig ang walang-kasalanang kasakdalan.
- source_word: παρακαλεῖσθε
  choice: magpalakas kayo ng loob
  rationale: Natural itong panawagan sa Tagalog na sumasaklaw sa pagtanggap ng lakas ng loob, bagaman maaari ring tumukoy ang Griyego sa pagtanggap ng pangaral o paalaala.
- source_word: τὸ αὐτὸ φρονεῖτε
  choice: magkaisa kayo ng isip
  rationale: Natural na Tagalog para sa literal na 'isipin ang iisang bagay' at pinananatili ang diin sa pagkakaisa ng pag-iisip.
- source_word: εἰρηνεύετε
  choice: mamuhay nang mapayapa
  rationale: Ipinahahayag nito ang patuloy na mapayapang asal sa loob ng pamayanan, gaya ng hinihingi ng pangkasalukuyang pautos.
- source_word: ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης
  choice: ang Diyos ng pag-ibig at kapayapaan
  rationale: Tuwirang pinananatili ang dalawang pariralang genitibo at ang teolohikal na paglalarawan sa Diyos.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: ay makakasama ninyo
  rationale: Malinaw at natural na pagpapahayag sa modernong Tagalog ng panghinaharap na pangakong 'will be with you.'
theological_decisions:
- issue: Saklaw ng ἀδελφοί sa pagtawag sa kongregasyon
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae
  rationale: Ang Griyego ay panlalaking maramihan sa anyo ngunit karaniwang tumutukoy sa buong kongregasyon. Ang 'mga kapatid' ay tumpak at likas na inklusibo sa Tagalog nang hindi nagdaragdag ng mga salitang wala sa teksto.
- issue: Diwa ng καταρτίζεσθε
  choice: magpaayos kayo
  alternative: maging ganap kayo / maibalik kayo sa ayos
  rationale: Hindi nito nilulutas ang pandiwa bilang ganap na moral na kasakdalan; pinananatili nito ang diwa ng pagpapanumbalik, paghahanda, o pagdadala sa wastong kalagayan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang magkakapantay na pautos upang mapanatili ang ritmo ng Griyego. Iniwasan ang labis na sinaunang mga anyo gaya ng “sasainyo,” ngunit pinanatili ang maikli at taimtim na himig.
