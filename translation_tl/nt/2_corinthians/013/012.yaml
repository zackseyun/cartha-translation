id: 2CO.13.12
reference: 2 Corinthians 13:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀσπάσασθε ἀλλήλους ἐν ἁγίῳ φιλήματι. ἀσπάζονται ὑμᾶς οἱ ἅγιοι πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/012.yaml
  text: Greet one another with a holy kiss[b][a]. All the saints greet you.
translation:
  language: tl
  text: Batiin ninyo ang isa’t isa ng banal na halik.[a] Binabati kayo ng lahat ng mga banal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sagradong halik.” Isa itong kinikilalang paraan ng pagbati noon na nagpapahayag ng banal na pakikisama ng mga mananampalataya.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga banal” dito ay ang mga mananampalataya—ang bayang ibinukod para sa Diyos—at hindi lamang isang natatanging uri ng mga taong kinilalang santo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Batiin ninyo
  rationale: Tuwirang pautos sa maramihan; natural at malinaw na katumbas sa modernong Tagalog.
- source_word: ἀλλήλους
  choice: ang isa’t isa
  rationale: Pinananatili ang kapwa at gantihang pagkilos sa loob ng pamayanan.
- source_word: ἐν ἁγίῳ φιλήματι
  choice: ng banal na halik
  rationale: Idyomatikong paraan sa Tagalog upang ipahayag ang paraan ng pagbati; tahasang pinananatili ang ‘banal’ at ‘halik.’
- source_word: ἀσπάζονται ὑμᾶς
  choice: Binabati kayo
  rationale: Natural na epistolaryong pahayag ng pagpapahatid ng pagbati; ang ‘kayo’ ay angkop sa maramihang ὑμᾶς.
- source_word: οἱ ἅγιοι πάντες
  choice: lahat ng mga banal
  rationale: Pinananatili ang literal at teolohikal na katawagang ‘mga banal’ para sa mga mananampalataya at ang kabuuang saklaw ng πάντες.
theological_decisions:
- issue: Kahulugan ng οἱ ἅγιοι bilang katawagang Paulino sa pamayanan
  choice: mga banal
  alternative: mga taong banal ng Diyos / lahat ng mga mananampalataya
  rationale: Ang ‘mga banal’ ay nagpapanatili sa mahalagang salitang teolohikal at tumutukoy dito sa mga mananampalataya bilang bayang ibinukod ng Diyos, hindi lamang sa isang natatanging uri ng mga kinanonisa.
- issue: Kalikasan ng ἁγίῳ φιλήματι
  choice: banal na halik
  alternative: sagradong halik
  rationale: Pinananatili ang konkretong kilos at ang pagkakatalaga nito sa banal na pakikisama nang hindi ito ginagawang utos tungkol sa isang tiyak na modernong kaugalian.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘isa’t isa’ at ‘binabati kayo’ para sa likas na daloy, habang pinanatili ang mga pangunahing larawang ‘banal na halik’ at ‘mga banal.’
