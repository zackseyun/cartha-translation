  to: Idinadalangin naman namin sa Diyos na huwag kayong gumawa ng anumang masama—hindi upang magmukha kaming karapat-dapat[a], kundi upang gawin ninyo ang mabuti, kahit magmukha kaming hindi karapat-dapat.[b]
  rationale: Pinalitan ang «kahit ituring kaming» ng «kahit magmukha kaming» upang mas direktang maipakita ang retorikal na diin sa paglitaw o pagtingin sa mga apostol at upang itugma ang φανῶμεν sa unang bahagi ng pangungusap. Napananatili ang modernong Tagalog, ang etikal na diwa ng τὸ καλόν, at ang magkakontrast na terminolohiya ng δόκιμος at ἀδόκιμος.
