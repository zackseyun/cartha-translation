  text: ⸀εὐχόμεθα δὲ πρὸς τὸν θεὸν μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν, οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν, ἀλλ’ ἵνα ὑμεῖς τὸ καλὸν ποιῆτε, ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/007.yaml
  text: We pray to God that you may do nothing wrong—not so that we may appear approved[a], but so that you may do what is right[c][b], even if we may seem disqualified.
translation:
  language: tl
  text: Idinadalangin naman namin sa Diyos na huwag kayong gumawa ng anumang masama—hindi upang magmukha kaming karapat-dapat[a], kundi upang gawin ninyo ang mabuti, kahit magmukha kaming hindi karapat-dapat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego ay maaari ring isaling “subok at napatunayang katanggap-tanggap.”
    reason: lexical_alternative
  - marker: b
    text: O “kahit para kaming hindi pumasa sa pagsubok.” Magkasalungat ngunit magkaugnay ang mga salitang Griego na isinaling “karapat-dapat” at “hindi karapat-dapat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχόμεθα
  choice: Idinadalangin namin
  rationale: Ang εὔχομαι na nakatuon sa Diyos ay malinaw na tumutukoy sa pananalangin. Ang “idinadalangin namin” ay natural at tuwirang nagpapahayag ng nilalaman ng panalangin.
- source_word: δὲ
  choice: naman
  rationale: Mahinang pang-ugnay ito na nag-uugnay sa naunang pahayag. Ang “naman” ay likas sa modernong Tagalog at hindi nagpapataw ng mas matinding pagsalungat kaysa sa hinihingi ng konteksto.
- source_word: πρὸς τὸν θεὸν
  choice: sa Diyos
  rationale: Kasama ng εὐχόμεθα, ipinahihiwatig ng πρός + accusative ang pinatutunguhan ng panalangin. Karaniwan at malinaw sa Tagalog ang “sa Diyos.”
- source_word: μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν
  choice: na huwag kayong gumawa ng anumang masama
  rationale: Ipinahahayag ng infinitive phrase ang nilalaman ng panalangin. Napananatili ng “anumang masama” ang mariing negatibong diwa ng κακὸν μηδέν nang natural sa Tagalog.
- source_word: οὐχ ἵνα
  choice: hindi upang
  rationale: Ipinakikilala nito ang layuning itinatanggi ni Pablo. Tumpak at malinaw na layunin ang ipinahahayag ng “hindi upang.”
- source_word: δόκιμοι φανῶμεν
  choice: magmukha kaming karapat-dapat
  rationale: Ang φανῶμεν ay tumutukoy sa paglitaw o pagiging nakikita sa isang paraan, samantalang ang δόκιμοι ay nangangahulugang subok at kinilalang katanggap-tanggap. Pinananatili ng salin ang diin sa kung paano sila nakikita, hindi lamang sa kanilang aktuwal na kalagayan.
- source_word: τὸ καλὸν ποιῆτε
  choice: gawin ninyo ang mabuti
  rationale: Sa kontekstong etikal, ang τὸ καλόν ay yaong mabuti o tama. Ang “gawin ninyo ang mabuti” ay simple, dignified, at natural sa modernong Tagalog.
- source_word: ὡς ἀδόκιμοι ὦμεν
  choice: kahit ituring kaming hindi karapat-dapat
  rationale: Ang ἀδόκιμοι ay kabaligtaran ng δόκιμοι at maaaring tumukoy sa hindi pumasa sa pagsusuri o hindi kinilalang karapat-dapat. Ang “ituring” ay nagpapanatili sa kontekstuwal na diin sa pagtingin ng iba, habang ang talababa ay nagtatala ng mas literal na posibilidad.
theological_decisions:
- issue: Ang kahulugan ng ὡς ἀδόκιμοι sa paglalarawan ni Pablo sa kanilang sarili
  choice: Ipinahihiwatig na maaari silang ituring na hindi karapat-dapat o hindi pumasa sa pagsubok sa paningin ng iba.
  alternative: 'Maaari rin itong unawain nang mas tuwiran: “kahit para kaming hindi pumasa sa pagsubok” o “kahit kami ay hindi mapatunayan.”'
  rationale: Ang agarang konteksto ay gumagamit ng magkaugnay at magkasalungat na salitang δόκιμοι at ἀδόκιμοι kaugnay ng pagsubok at pagkilala. Hindi dapat ipakahulugan dito ang pangwakas na kapahamakan o anumang tiyak na doktrina na hindi tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “naman” bilang banayad na pang-ugnay para sa δέ. Iniwasan ang masyadong kolokyal na “pasado/bagsak,” ngunit ipinaliwanag sa talababa ang larawang may kinalaman sa pagsubok. Lumitaw sa pangunahing teksto ang lahat ng marker na [a] at [b].
