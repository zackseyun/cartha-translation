- from: 'Sinabi ko na noon, at ngayo''y sinasabi ko nang patiuna habang wala ako—gaya ng sinabi ko noong ikalawang pagdalaw ko—sa mga nagkasala na noon at sa lahat ng iba pa: kung muli akong darating[a], hindi ko sila palalampasin.'
  to: 'Noon pa’y sinabi ko na, at ngayo’y sinasabi ko nang patiuna, bagaman wala ako—gaya noong naroon ako sa ikalawang pagkakataon—sa mga nagkasala na noon at sa lahat ng iba pa: kung muli akong darating[a], hindi ko sila palalampasin.'
  rationale: Inalis ang idinagdag na “gaya ng sinabi ko” upang maipakita nang mas tapat ang pagtukoy ng Griyego sa pagiging naroon ni Pablo sa ikalawang pagkakataon. Inayos din ang ayos ng “bagaman wala ako” upang malinaw na ang kasalukuyang kalagayan niya ay wala siya, samantalang ang paghahambing ay sa dati niyang presensiya. Pinanatili ang sinadyang kalabuan ng “muli akong darating” sa pangunahing teksto at ang interpretatibong “ikatlong pagkakataon” sa talababa.
