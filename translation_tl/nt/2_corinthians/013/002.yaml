source:
  edition: SBLGNT
  text: προείρηκα καὶ προλέγω ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν ⸀νῦν, τοῖς προημαρτηκόσιν καὶ τοῖς λοιποῖς πᾶσιν, ὅτι ἐὰν ἔλθω εἰς τὸ πάλιν οὐ φείσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/002.yaml
  text: I have said before[a], and I say beforehand now while absent, as when present the second time, to those who sinned previously and to all the rest, that if I come again, I will not spare them.
translation:
  language: tl
  text: 'Noon pa’y sinabi ko na, at ngayo’y sinasabi ko nang patiuna, bagaman wala ako—gaya noong naroon ako sa ikalawang pagkakataon—sa mga nagkasala na noon at sa lahat ng iba pa: kung muli akong darating[a], hindi ko sila palalampasin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tahasang, “kung darating ako sa ikatlong pagkakataon.” Literal na sinasabi ng Griyego, “kung muli akong darating,” ngunit ipinahihiwatig ng konteksto ng mga pagdalaw ni Pablo na isa itong panibagong pagdalaw matapos ang ikalawa.
    reason: alternative_reading
lexical_decisions:
- source_word: προείρηκα
  choice: Sinabi ko na noon
  rationale: Ipinahahayag ang naunang sinabi na nananatiling may bisa, nang hindi idinaragdag sa pandiwa ang diwang 'nagbabala.'
- source_word: προλέγω
  choice: sinasabi ko nang patiuna
  rationale: Pinananatili ang literal na diwa ng pagsasabi nang maaga at ang ugnayang leksikal nito sa προείρηκα; nagmumula sa konteksto ang tono ng babala.
- source_word: ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν νῦν
  choice: ngayo'y ... habang wala ako—gaya ng sinabi ko noong ikalawang pagdalaw ko
  rationale: Nililinaw sa natural na Tagalog ang siksik na paghahambing ng kasalukuyang pagkawala ni Pablo at ng dati niyang ikalawang pagdalaw. Ang 'gaya ng sinabi ko' ay ipinahihiwatig ng pangunahing pandiwa at tumutulong upang hindi magmistulang siya ay kasalukuyang naroon sa ikalawang pagkakataon.
- source_word: τοῖς προημαρτηκόσιν
  choice: sa mga nagkasala na noon
  rationale: Isinasalamin ang naunang pagkakasala nang hindi nagpapasiya kung nagsisi na sila o hindi.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: sa lahat ng iba pa
  rationale: Pinananatili ang malawak na saklaw at ang pagkakaiba sa grupong naunang nagkasala.
- source_word: ἐὰν ἔλθω εἰς τὸ πάλιν
  choice: kung muli akong darating
  rationale: Natural na katumbas ng idyomang Griyego tungkol sa isa pang pagdalaw; hindi tahasang ginagawang 'ikatlong pagdalaw' sa pangunahing teksto.
- source_word: οὐ φείσομαι
  choice: hindi ko sila palalampasin
  rationale: Ipinahahayag ang hindi pagpipigil sa mahigpit na pagharap sa kanila. Ang 'sila' ay likas na ipinahihiwatig ng mga naunang pinatutungkulan, ngunit hindi tinutukoy ang eksaktong uri ng pagdidisiplina.
theological_decisions:
- issue: Saklaw ng banta ng mahigpit na pagkilos ni Pablo
  choice: Ang babala ay inihaharap kapuwa sa mga nagkasala na noon at sa lahat ng iba pa, nang hindi tinutukoy ang isang partikular na paraan ng pagdidisiplina.
  alternative: Limitahan ang banta sa mga nagkasala na noon lamang, o tukuyin itong isang tiyak na uri ng pormal na disiplinang pang-iglesia.
  rationale: Kapuwa pinatutungkulan ng sintaks ang dalawang grupo, samantalang hindi espesipikong inilalarawan ng οὐ φείσομαι ang gagawing hakbang. Kaya pinananatili ang lawak at tensiyon ng pahayag.
- issue: Bilang ng susunod na pagdalaw
  choice: Panatilihin sa teksto ang 'muli akong darating' at ilagay sa talababa ang posibleng mas tahasang 'darating ako sa ikatlong pagkakataon.'
  alternative: Isalin mismo sa pangunahing teksto bilang 'kung darating ako sa ikatlong pagkakataon.'
  rationale: Literal na tumutukoy ang pariralang Griyego sa muling pagdating, bagaman ipinahihiwatig ng konteksto na ito ang ikatlong pagdalaw. Hindi dapat tahimik na alisin ang puwang na ito sa pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'pagdalaw' upang luminaw ang pisikal na presensiya ni Pablo, at ang 'palalampasin' upang maipahayag ang mahigpit na babala nang hindi nag-aangkat ng tiyak na balangkas ng disiplinang pang-iglesia.
