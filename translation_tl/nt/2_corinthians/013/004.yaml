  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀γὰρ ἐσταυρώθη ἐξ ἀσθενείας, ἀλλὰ ζῇ ἐκ δυνάμεως θεοῦ. καὶ γὰρ ἡμεῖς ἀσθενοῦμεν ἐν αὐτῷ, ἀλλὰ ⸀ζήσομεν σὺν αὐτῷ ἐκ δυνάμεως θεοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/004.yaml
  text: For indeed he was crucified in weakness[a], but he lives by the power of God. For indeed we are weak in him[d][c][b], but we will live with him by the power of God toward you.
translation:
  language: tl
  text: Sapagkat tunay nga, ipinako siya sa krus sa kahinaan[a], ngunit nabubuhay siya sa kapangyarihan ng Diyos. Sapagkat mahina rin kami sa kanya[b], ngunit mabubuhay kaming kasama niya[c] sa kapangyarihan ng Diyos sa pakikitungo namin sa inyo[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mula sa kahinaan.” Ang Griyegong ἐξ ay karaniwang nagpapahayag ng pinagmulan o batayan; dito, ang “sa kahinaan” ay mas natural sa Tagalog at maaaring tumukoy sa kalagayan o paraang kaugnay ng kanyang pagpapako sa krus.
    reason: lexical_alternative
  - marker: b
    text: Ang “sa kanya” ay maaaring unawain bilang “sa pakikiisa sa kanya.” Pinananatili rito ang maikli at siksik na pananalita ng Griyego.
    reason: lexical_alternative
  - marker: c
    text: Ang “mabubuhay kaming kasama niya” ay maaaring tumukoy sa buhay at kapangyarihan ni Cristo na mahahayag sa darating na pakikitungo ni Pablo sa mga taga-Corinto; maaari rin itong umalingawngaw sa mas malawak na tema ng buhay na muling pagkabuhay.
    reason: alternative_reading
  - marker: d
    text: Ang “sa pakikitungo namin sa inyo” ay pagpapalinaw ng siksik na Griyegong εἰς ὑμᾶς. Maaari rin itong isalin na “patungo sa inyo,” “para sa inyo,” “sa gitna ninyo,” o “kaugnay ninyo,” sapagkat maaari itong magpahiwatig ng direksiyon, kaugnayan, o epekto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσταυρώθη
  choice: ipinako siya sa krus
  rationale: Tumpak at karaniwang salin ng aorist passive ng σταυρόω; pinananatili ang tahasang pagtukoy sa pagpapako sa krus.
- source_word: ἐξ ἀσθενείας
  choice: sa kahinaan
  rationale: Natural sa modernong Tagalog at kayang magpahiwatig ng kalagayan o batayan. Ipinaliliwanag sa talababa ang higit na literal na diwang pinagmulan ng ἐξ.
- source_word: ζῇ
  choice: nabubuhay siya
  rationale: Pinananatili ang pangkasalukuyan at nagpapatuloy na lakas ng pandiwang ζάω, sa halip na sabihing basta 'buhay siya.'
- source_word: ἐκ δυνάμεως θεοῦ
  choice: sa kapangyarihan ng Diyos
  rationale: Natural na Tagalog para sa kapangyarihang pinagmumulan o gumagawa ng buhay. Ang magkaparehong 'sa' ay nagpapanatili ng sinadyang paghahambing sa 'sa kahinaan.'
- source_word: ἀσθενοῦμεν
  choice: mahina kami
  rationale: Direktang inuugnay ang pandiwa sa naunang 'kahinaan' at hindi dinaragdagan ng ideyang kawalang-kakayahan o pagiging di-kahanga-hanga.
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang maikli at siksik na pananalita ni Pablo tungkol sa kaugnayan kay Cristo, nang hindi ito lubusang ipinapaliwanag sa mismong teksto.
- source_word: ζήσομεν
  choice: mabubuhay kami
  rationale: Pinananatili ang anyong panghinaharap at hindi nililimitahan kung tumutukoy ito sa darating na pagpapakita ng buhay sa ministeryo o sa mas malawak na buhay na muling pagkabuhay.
- source_word: σὺν αὐτῷ
  choice: kasama niya
  rationale: Natural na ipinapahayag ang pakikisama o pakikibahagi na taglay ng σύν.
- source_word: εἰς ὑμᾶς
  choice: para sa inyo
  rationale: Natural na salin sa konteksto ng kapangyarihang ihahayag sa pakikitungo sa mga taga-Corinto; inilalahad sa talababa ang iba pang posibleng ugnayang ipinahihiwatig ng εἰς.
theological_decisions:
- issue: Kahulugan ng kahinaan ni Cristo sa pagpapako sa krus
  choice: Iniwan ang 'sa kahinaan' bilang tunay ngunit hindi lubusang ipinaliwanag na kabalintunaan, katapat ng kapangyarihan ng Diyos.
  alternative: Sabihing 'sa kalagayang waring mahina siya' o tahasang iugnay lamang ito sa kanyang pagkatao.
  rationale: Hindi itinatanggi ng teksto ang pagka-Diyos o kawalang-kasalanan ni Cristo, ngunit hindi rin nito nilalagyan ng paliwanag ang 'kahinaan.' Pinananatili ng salin ang tensiyon ng pahayag ni Pablo nang walang idinadagdag na doktrinal na paglilinaw.
- issue: Saklaw ng 'mabubuhay kaming kasama niya'
  choice: Pinanatiling malawak ang panghinaharap na pahayag upang maaari itong tumukoy sa buhay at kapangyarihan ni Cristo na mahahayag sa paglilingkod ni Pablo sa mga taga-Corinto, habang umaalingawngaw rin ang tema ng buhay na muling pagkabuhay.
  alternative: Limitahan ito alinman sa pangwakas na muling pagkabuhay lamang o sa kasalukuyang apostolikong ministeryo lamang.
  rationale: Itinuturo ng agarang konteksto ang pakikitungo ni Pablo sa mga taga-Corinto, ngunit ang pananalitang 'kasama niya' ay may mas malawak na ugnayan sa pakikibahagi sa buhay ni Cristo. Hindi nilulutas ng salin ang posibleng dalawang antas ng kahulugan.
- issue: Kahulugan ng 'mahina kami sa kanya'
  choice: Pinanatili ang siksik na pananalitang 'sa kanya.'
  alternative: Palawakin bilang 'dahil sa pakikiisa namin sa kanya' o gawing 'kasama niya.'
  rationale: Ang ἐν αὐτῷ ay maaaring magpahiwatig ng pakikiisa o kaugnayan kay Cristo. Ang payak na salin ay umiiwas sa labis na pagpapakahulugan at pinananatili ang kaibhan nito sa kasunod na σὺν αὐτῷ, 'kasama niya.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tunay ngang” upang ilipat ang diin ng καὶ γὰρ, at pinanatili ang magkatapat na “sa kahinaan” at “sa kapangyarihan ng Diyos.” Iniwasan ang sobrang teknikal na “mula sa kapangyarihan,” sapagkat hindi ito natural sa Tagalog, habang pinananatili sa talababa ang usapin ng pinagmulan o batayan.
