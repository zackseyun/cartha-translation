  to: Sapagkat tunay nga, ipinako siya sa krus sa kahinaan[a], ngunit nabubuhay siya sa kapangyarihan ng Diyos. Sapagkat mahina rin kami sa kanya[b], ngunit mabubuhay kaming kasama niya[c] sa kapangyarihan ng Diyos sa pakikitungo namin sa inyo[d].
