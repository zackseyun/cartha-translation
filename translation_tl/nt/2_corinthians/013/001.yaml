id: 2CO.13.1
reference: 2 Corinthians 13:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τρίτον τοῦτο ἔρχομαι πρὸς ὑμᾶς· ἐπὶ στόματος δύο μαρτύρων καὶ τριῶν σταθήσεται πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/001.yaml
  text: 'This is the third time I am coming to you: “Every matter will be established by the testimony of two witnesses or three.”[a][b]'
translation:
  language: tl
  text: 'Ito ang ikatlong pagkakataong pupunta ako sa inyo: “Ang bawat usapin ay pagtitibayin sa patotoo ng dalawa o tatlong saksi.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang bawat salita ay pagtitibayin sa bibig ng dalawa o tatlong saksi.” Malapit na sinusunod ng Griyego ang pananalita sa Deuteronomio 19:15 at gumagamit ito ng isang legal na idyoma.
    reason: lexical_alternative
  - marker: b
    text: Pahiwatig sa Deuteronomio 19:15.
    reason: cross_reference
lexical_decisions:
- source_word: Τρίτον τοῦτο
  choice: Ito ang ikatlong pagkakataon
  rationale: Ang parirala ay ginagamit na pang-abay upang tukuyin ang ikatlong pagpunta ni Pablo; natural at malinaw ito sa modernong Tagalog.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: pupunta ako sa inyo
  rationale: Bagaman nasa pangkasalukuyang anyo ang pandiwa, tumutukoy ito sa nalalapit na pagpunta; ang panghinaharap ang likas na pagpapahayag nito sa Tagalog.
- source_word: ἐπὶ στόματος
  choice: sa patotoo ng
  rationale: Isa itong legal na idyomang literal na tumutukoy sa ‘bibig’ ngunit nangangahulugang batay sa patotoo; iniiwasan ng salin ang malabo at di-likas na literalismo.
- source_word: δύο μαρτύρων καὶ τριῶν
  choice: dalawa o tatlong saksi
  rationale: Ipinahahayag nito ang nakaugaliang pormulang legal na ‘dalawa o tatlo’; ang ‘o’ ang malinaw na distributibong diwa sa Tagalog.
- source_word: σταθήσεται
  choice: pagtitibayin
  rationale: Sa kontekstong legal, ang pandiwa ay nangangahulugang maitatatag o makukumpirma ang isang usapin.
- source_word: πᾶν ῥῆμα
  choice: ang bawat usapin
  rationale: Bagaman maaaring literal na ‘bawat salita,’ sa siping legal ay tumutukoy ito sa anumang usapin o bagay na kailangang patunayan.
theological_decisions:
- issue: Saklaw ng legal na sipi mula sa Deuteronomio sa konteksto ng pagdidisiplina ni Pablo
  choice: Panatilihin ang malawak na ‘bawat usapin’ nang hindi ito nililimitahan sa isang paratang o sa disiplina ng iglesya.
  alternative: ‘bawat salita’ o ‘bawat paratang’
  rationale: Ang Griyego ay nagpapanatili ng pangkalahatang legal na prinsipyo. Hindi dapat paliitin ng salin ang saklaw nito nang higit sa hayag na sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang legal na himig ng sipi, habang ipinaliwanag sa talababa ang mas literal na pananalita.
