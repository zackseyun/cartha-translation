  text: For we are not able to do anything against the truth[a], but for the truth.
translation:
  language: tl
  text: Sapagkat wala tayong magagawa laban sa katotohanan, kundi para sa katotohanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi natin kayang gumawa ng anuman laban sa katotohanan, kundi ang suportahan ang katotohanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Sapagkat ... wala
  rationale: Ang γάρ ay nagbibigay ng paliwanag o batayan sa naunang sinabi; natural itong ipinahahayag ng “Sapagkat.” Ang οὐ ay malinaw na pagtanggi.
- source_word: δυνάμεθά τι
  choice: wala tayong magagawa
  rationale: Sa sugnay na may pagtanggi, natural na ipinapahayag sa modernong Tagalog ang kakayahan at ang indefinite na τι sa pariralang “wala tayong magagawa,” na katumbas ng “hindi natin kayang gumawa ng anuman.”
- source_word: κατὰ τῆς ἀληθείας
  choice: laban sa katotohanan
  rationale: Ang κατά na may genitive ay may diwang pagsalungat; pinananatili ng “laban sa katotohanan” ang tiyak at malawak na saklaw ng τῆς ἀληθείας.
- source_word: ἀλλὰ
  choice: kundi
  rationale: Pagkatapos ng negatibong unang sugnay, likas sa Tagalog ang “kundi” upang ihayag ang matinding pagsalungat at pagtutuwid na dala ng ἀλλά.
- source_word: ὑπὲρ τῆς ἀληθείας
  choice: para sa katotohanan
  rationale: Ang ὑπέρ ay nagpapahayag ng pagkilos na pabor o bilang suporta. Ang “para sa katotohanan” ay maikli at pinananatili ang retorikal na pagtutumbas sa “laban sa katotohanan.”
theological_decisions:
- issue: Kahulugan ng “katotohanan” sa magkasalungat na mga parirala ni Pablo
  choice: Pinanatili ang “katotohanan” nang hindi nililimitahan sa isang tiyak na pormulang doktrinal.
  alternative: “katotohanan ng ebanghelyo” o “kung ano ang totoo”
  rationale: Mas malawak ang pananalita ni Pablo kaysa sa isang tiyak na pormulang doktrinal, bagaman kabilang sa konteksto ang katotohanan ng ebanghelyo. Pinananatili ng salin ang lawak at tensiyong teolohikal ng orihinal.
- issue: Saklaw ng ikalawang sugnay
  choice: Hindi idinagdag ang “lamang” sa pangunahing teksto.
  alternative: “kundi para lamang sa katotohanan”
  rationale: Walang tahasang katumbas ng “lamang” sa Griyego. Bagaman maaari itong ipahiwatig ng antitesis, hindi ito dapat idagdag nang walang paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Pinanatili ang balanseng antitesis na “laban sa ... para sa ...” habang iniwasan ang pagdaragdag ng “lamang” sa pangunahing teksto.
