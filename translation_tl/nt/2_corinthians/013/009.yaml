base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/009.yaml
  text: 'For we rejoice when we are weak and you are strong[a]. And this also is what we pray for: your restoration.'
translation:
  language: tl
  text: 'Sapagkat nagagalak kami kapag mahina kami ngunit malalakas kayo. Ito rin ang ipinapanalangin namin: ang inyong pagpapanumbalik.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang inyong pagkakaayos,” “ang inyong paghuhubog,” o “ang inyong pagiging ganap.” Ang salitang Griego ay maaaring tumukoy sa pagpapanumbalik sa wastong kalagayan, paghahanda o paghuhubog, o pagkukumpleto.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρομεν
  choice: nagagalak kami
  rationale: Pinananatili ang malakas at positibong diwa ng kasalukuyang pandiwa, at likas itong pakinggan sa marangal na modernong Tagalog.
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinakikita ang paliwanag na kaugnayan ng pangungusap sa naunang konteksto.
- source_word: ὅταν
  choice: kapag
  rationale: Ang kasamang subjunctive ay nagpapahayag ng pangkalahatang kalagayang temporal; ang “kapag” ang likas na katumbas sa Tagalog.
- source_word: ἀσθενῶμεν
  choice: mahina kami
  rationale: Pinananatili ang malawak na kahulugan ng kahinaan nang hindi nililimitahan kung ito ay pisikal, panlipunan, o retorikal.
- source_word: δυνατοὶ ἦτε
  choice: malalakas kayo
  rationale: Tuwirang pinananatili ang retorikal na pagsalungat sa “mahina kami.”
- source_word: τοῦτο καὶ εὐχόμεθα
  choice: Ito rin ang ipinapanalangin namin
  rationale: Pinananatili ang diin sa τοῦτο at isinasalin ang εὐχόμεθα bilang panalangin, ayon sa gamit nito sa konteksto.
- source_word: τὴν ὑμῶν κατάρτισιν
  choice: ang inyong pagpapanumbalik
  rationale: Ipinahihiwatig ang pag-aayos o pagbabalik sa wastong kalagayan, na angkop sa pastoral at pandisiplinang konteksto, habang kinikilala sa talababa ang iba pang posibleng diwa.
theological_decisions:
- issue: Diwa ng κατάρτισις kaugnay ng layuning pastoral ni Pablo
  choice: ang inyong pagpapanumbalik
  alternative: ang inyong pagkamaygulang; ang inyong pagiging ganap; ang inyong pagkakaayos
  rationale: Ang “pagpapanumbalik” ay angkop sa hangarin ni Pablo na maituwid at maibalik sila sa wastong kalagayan nang hindi nag-aangkat ng teknikal na doktrina ng pagiging perpekto. Gayunman, tunay na saklaw ng salita ang paghuhubog, pagkukumpleto, at pagsasaayos, kaya pinananatili ang mga ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “sapagkat” upang mapanatili ang paliwanag na ugnayan at ang magkatapat na “mahina” at “malalakas” upang maingatan ang retorika ng orihinal.
