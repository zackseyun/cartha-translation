id: 2CO.13.13
reference: 2 Corinthians 13:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ καὶ ἡ ἀγάπη τοῦ θεοῦ καὶ ἡ κοινωνία τοῦ ἁγίου πνεύματος μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/013.yaml
  text: The grace of the Lord Jesus Christ[a], and the love of God, and the fellowship of the Holy Spirit[b], be with all of you.
translation:
  language: tl
  text: Sumainyong lahat ang biyaya ng Panginoong Jesus na Mesiyas[a], ang pag-ibig ng Diyos, at ang pakikisama ng Banal na Espiritu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa tradisyonal na katawagan, “Panginoong Jesu-Cristo.”
    reason: alternative_reading
  - marker: b
    text: O “pakikipag-isa sa Banal na Espiritu” o “pakikibahagi sa Banal na Espiritu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: biyaya
  rationale: Karaniwan at may bigat na salin ng terminong ginagamit ni Pablo sa pagbabasbas; naipahihiwatig nito ang kagandahang-loob na ipinagkakaloob ng Diyos.
- source_word: κυρίου
  choice: Panginoon
  rationale: Likas na salin ng titulong κύριος para kay Jesus sa ganitong pormulang kristolohikal.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Ginawang lantad ang Χριστός bilang titulong “Mesiyas,” sa halip na ituring na apelyido; pinanatili sa talababa ang tradisyonal na anyo.
- source_word: ἀγάπη
  choice: pag-ibig
  rationale: Tuwiran at natural na katumbas na angkop sa marangal na pagbabasbas.
- source_word: θεοῦ
  choice: ng Diyos
  rationale: Pinananatili ang payak na anyong paari at hindi nililimitahan kung ito ay pag-ibig na nagmumula sa Diyos o iba pang ugnayang ipinahihiwatig ng parirala.
- source_word: κοινωνία
  choice: pakikisama
  rationale: Sinasaklaw nito ang ugnayan at pagbabahaging kasama sa κοινωνία nang hindi ganap na nililimitahan ang kahulugan sa isa lamang na pagbasa.
- source_word: ἁγίου πνεύματος
  choice: Banal na Espiritu
  rationale: Pamantayan at makabagong katawagan sa Filipino para sa banal na persona na tinutukoy.
- source_word: μετὰ πάντων ὑμῶν
  choice: Sumainyong lahat
  rationale: Likas na pormula ng pagbabasbas sa Filipino na malinaw na nagpapanatili sa πάντων, “lahat.”
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ bilang titulong kristolohikal
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay titulong nangangahulugang Mesiyas o Pinahiran. Inilalantad ito sa pangunahing teksto, habang pinananatili ang nakaugaliang “Cristo” sa talababa.
- issue: Kahulugan ng κοινωνία τοῦ ἁγίου πνεύματος
  choice: pakikisama ng Banal na Espiritu
  alternative: pakikipag-isa sa Banal na Espiritu; pakikibahagi sa Banal na Espiritu
  rationale: Maaaring tumukoy ang pariralang Griyego sa pakikisamang kaugnay o kaloob ng Espiritu, o sa pakikibahagi sa Espiritu. Hindi nilulutas ng pangunahing salin ang tunay na lawak ng genitibong parirala.
translation_notes:
  register: Makabago ngunit marangal na Filipino; ginamit ang nakaugaliang pormulang pambasbas na “Sumainyo” at iniwasan ang labis na teknikal o denominasyonal na pananalita.
