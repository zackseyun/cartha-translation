  text: since you are seeking proof that Messiah is speaking in me—he is not weak toward you[a], but is powerful in you[b],
translation:
  language: tl
  text: Yamang naghahanap kayo ng patunay na ang Mesiyas ay nagsasalita sa loob ko[a]—hindi siya mahina sa pakikitungo sa inyo, kundi makapangyarihan sa inyo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagsasalita sa pamamagitan ko.” Sa mas literal na anyo, “ang Mesiyas na nagsasalita sa loob ko.”
    reason: lexical_alternative
  - marker: b
    text: O, “makapangyarihan sa gitna ninyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Yamang
  rationale: Ipinananatili ang panandang sanhi na nakaugnay sa naunang pahayag ni Pablo at natural sa marangal na modernong Tagalog.
- source_word: δοκιμὴν ζητεῖτε
  choice: naghahanap kayo ng patunay
  rationale: Ang δοκιμή rito ay katibayang nagpapatunay, hindi lamang ang proseso ng pagsubok; ipinahihiwatig ng kasalukuyang anyo ng ζητεῖτε ang nagpapatuloy nilang paghahanap.
- source_word: τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ
  choice: na ang Mesiyas ay nagsasalita sa akin
  rationale: Ginawang natural na sugnay sa Tagalog ang konstruksiyong henitibo. Pinanatili ang tahasang ἐν bilang “sa akin,” habang inilalagay sa talababa ang posibleng instrumental na diwang “sa pamamagitan ko.”
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Gumaganap dito bilang titulong tumutukoy sa pinahirang hari, kaya “Mesiyas” ang malinaw at likas na salin.
- source_word: εἰς ὑμᾶς οὐκ ἀσθενεῖ
  choice: hindi siya mahina sa pakikitungo sa inyo
  rationale: Ipinahahayag nang natural sa Tagalog ang kaugnayang ipinakikita ng εἰς ὑμᾶς, habang pinananatili ang salitang “mahina” upang lumitaw ang sadyang pagtutunggali ng kahinaan at kapangyarihan.
- source_word: ἀλλὰ δυνατεῖ ἐν ὑμῖν
  choice: kundi makapangyarihan sa inyo
  rationale: Pinananatili ang tuwirang kaibahan sa “mahina.” Ang “sa inyo” ay maaaring maunawaan bilang pagkilos sa loob nila o sa kanilang kalipunan, kaya hindi nito labis na nilulutas ang saklaw ng ἐν ὑμῖν.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Mas malinaw na pinananatili ng “Mesiyas” ang titulong nasa Χριστός nang hindi ito itinuturing lamang na pangalang pantangi.
- issue: Diwa ng ἐν ἐμοὶ
  choice: nagsasalita sa akin
  alternative: nagsasalita sa pamamagitan ko
  rationale: Pinananatili sa pangunahing teksto ang literal na lokatibong anyo at sa talababa ang posibleng diwa ng ahensiya, upang hindi ipasiya kung ang diin ay nasa presensiya ng Mesiyas kay Pablo o sa pagsasalita niya sa pamamagitan ni Pablo.
- issue: Saklaw ng ἐν ὑμῖν
  choice: makapangyarihan sa inyo
  alternative: kumikilos nang may kapangyarihan sa gitna ninyo
  rationale: Ang “sa inyo” ay malapit sa Griyego at maaaring tumukoy kapuwa sa panloob na pagkilos sa mga mananampalataya at sa pagkilos sa kalipunan nila; pinananatili sa talababa ang malinaw na kolektibong posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang anyong nakaugnay sa konteksto sa pamamagitan ng “Yamang” at ng pangwakas na gitling, sapagkat nagpapatuloy ang pangungusap sa susunod na talata. Ginamit ang “Mesiyas” bilang malinaw na titulo at iniwasang gawing tiyak ang likas na ambiguwidad ng dalawang pariralang may ἐν.
