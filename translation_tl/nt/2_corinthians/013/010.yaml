    rationale: Sa Griyego, ang εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν ay naglalarawan sa layunin ng awtoridad na ibinigay ng Panginoon. Ang “para sa pagtatayo at hindi para sa paggiba” ay mas tuwirang nagpapanatili ng pagkakaugnay na ito.
  - severity: low
    issue: Nawawala sa pangunahing teksto ang metapora ng pagtatayo at paggiba.
    rationale: Ang “magpatibay” at “magwasak” ay nauunawaan, ngunit ang mga pangngalang “pagtatayo” at “paggiba” ay mas malapit sa οἰκοδομή at καθαίρεσις at mas malinaw na pinananatili ang sinadyang paghahambing.
