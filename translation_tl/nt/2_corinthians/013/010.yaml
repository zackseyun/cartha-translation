  text: διὰ τοῦτο ταῦτα ἀπὼν γράφω, ἵνα παρὼν μὴ ἀποτόμως χρήσωμαι κατὰ τὴν ἐξουσίαν ἣν ⸂ὁ κύριος ἔδωκέν μοι⸃, εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/010.yaml
  text: For this reason I write these things while absent[a], so that when present I may not have to act harshly[b], according to the authority that the Lord gave me for building up and not for tearing down.
translation:
  language: tl
  text: Dahil dito, isinusulat ko ang mga bagay na ito habang wala ako riyan, upang pagdating ko riyan ay hindi ko kailangang kumilos nang mabagsik[a] ayon sa awtoridad na ibinigay sa akin ng Panginoon para sa pagtatayo at hindi para sa paggiba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gumamit ng kahigpitan” o “makitungo nang matalim.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “para sa ikatitibay at hindi para sa pagkawasak.” Sa Griyego, magkatapat na talinghaga ito ng pagtatayo at paggiba.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dahil dito
  rationale: Likas na panandang sanhi at bunga sa modernong Tagalog at malinaw na nag-uugnay sa naunang konteksto.
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang maramihang anyo ng demonstratibo at ang pagtukoy nito sa nilalaman o mga babalang isinusulat ni Pablo.
- source_word: ἀπὼν γράφω
  choice: isinusulat ko ... habang wala ako riyan
  rationale: Ipinapahayag nang natural ang kasalukuyang pagsulat habang pisikal na wala si Pablo sa kinaroroonan ng mga taga-Corinto.
- source_word: παρὼν
  choice: pagdating ko riyan
  rationale: Idyomatikong ipinakikita ang kabaligtaran ng pagiging wala; ang diwa ay ang pagiging naroon niya sa hinaharap.
- source_word: μὴ ἀποτόμως χρήσωμαι
  choice: hindi ko kailangang kumilos nang mabagsik
  rationale: Ipinahahayag ang matalim o mahigpit na pakikitungo na nais niyang maiwasan, habang likas sa Tagalog ang ipinahihiwatig na hindi niya sana kailangang gawin iyon.
- source_word: κατὰ τὴν ἐξουσίαν
  choice: ayon sa awtoridad
  rationale: Ang “awtoridad” ay malinaw na tumutukoy sa ipinagkaloob na karapatang mamahala o kumilos; pinananatili ng “ayon sa” ang diwa ng κατά.
- source_word: ὁ κύριος ἔδωκέν μοι
  choice: ibinigay sa akin ng Panginoon
  rationale: Tuwirang pinananatili ang titulong κύριος at ang pagkakaloob ng awtoridad kay Pablo nang hindi higit na tinutukoy ang referent kaysa sa mismong talata.
- source_word: εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν
  choice: upang magpatibay at hindi upang magwasak
  rationale: Natural at malinaw sa modernong Tagalog ang layunin at matinding pagsalungat ng dalawang kilos; inilalahad sa talababa ang literal na talinghaga ng pagtatayo at paggiba.
theological_decisions:
- issue: Ang tinutukoy ng “Panginoon” na nagbigay ng awtoridad
  choice: Panginoon
  alternative: Tahasang tukuyin bilang Panginoong Jesus o bilang Diyos
  rationale: ὁ κύριος lamang ang sinasabi ng Griyego sa talatang ito. Pinananatili ang titulo nang hindi nagdaragdag ng pagkakakilanlang hindi tahasang binanggit dito.
- issue: Layunin ng awtoridad ni Pablo
  choice: upang magpatibay at hindi upang magwasak
  alternative: para sa ikatitibay at hindi sa ikapapahamak ng iglesya
  rationale: Pinananatili ang pahayag bilang layunin ng ipinagkaloob na awtoridad, ngunit hindi idinaragdag sa pangunahing teksto ang tahasang layon na “iglesya” o “kayo,” na ipinahihiwatig lamang ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “riyan” upang natural na ipahiwatig ang lugar ng mga kausap, at “awtoridad” upang tumpak na ihayag ang ipinagkaloob na karapatang kumilos. Ang mga salitang “magpatibay” at “magwasak” ay madaling maunawaan, samantalang pinananatili sa talababa ang literal na talinghaga ng gusali.
