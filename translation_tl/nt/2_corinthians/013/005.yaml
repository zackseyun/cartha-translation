source:
  edition: SBLGNT
  text: Ἑαυτοὺς πειράζετε εἰ ἐστὲ ἐν τῇ πίστει, ἑαυτοὺς δοκιμάζετε· ἢ οὐκ ἐπιγινώσκετε ἑαυτοὺς ὅτι ⸂Ἰησοῦς Χριστὸς⸃ ἐν ⸀ὑμῖν; εἰ μήτι ἀδόκιμοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/005.yaml
  text: Test yourselves to see whether you are in the faith[a]; examine yourselves[c][b]. Or do you not recognize that Jesus the Messiah is in you?—unless indeed you are disqualified.
translation:
  language: tl
  text: Suriin ninyo ang inyong sarili kung kayo ay nasa pananampalataya; subukin ninyo ang inyong sarili. O hindi ba ninyo kinikilala sa inyong sarili na si Jesus na Mesiyas ay nasa inyo?[a]—maliban na lamang kung hindi kayo nakapasa sa pagsubok.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nasa gitna ninyo.”
    reason: alternative_reading
  - marker: b
    text: Sa literal, “hindi napatunayang katanggap-tanggap”; maaari ring “bigong pumasa sa pagsubok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πειράζετε
  choice: Suriin
  rationale: Sa kontekstong ito, tumutukoy ito sa pagsusuri sa sarili upang malaman ang tunay na kalagayan, hindi sa pagtukso.
- source_word: ἐν τῇ πίστει
  choice: nasa pananampalataya
  rationale: Pinananatili ang tiyak ngunit may puwang na parirala ng Griyego; maaari itong tumukoy sa pananatili sa pananampalatayang Kristiyano o sa pagkakaroon ng tunay na pananampalataya.
- source_word: δοκιμάζετε
  choice: subukin
  rationale: Ibinubukod nang bahagya sa πειράζετε upang maipakita ang diwang pagsubok kung tunay at katanggap-tanggap.
- source_word: ἐπιγινώσκετε
  choice: nakikilala
  rationale: Ang pandiwa ay nagpapahiwatig ng pagkilala o ganap na pagkaunawa, at ang 'nakikilala' ay angkop sa retorikal na tanong.
- source_word: ἑαυτούς
  choice: ang inyong sarili / sa inyong sarili
  rationale: Pinananatili ang paulit-ulit na reflexive na diin ng Griyego sa natural na anyong Tagalog.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong 'Mesiyas' habang pinananatili ang pangalang Jesus.
- source_word: ἐν ὑμῖν
  choice: nasa inyo
  rationale: Ang maramihang 'inyo' ay maaaring tumukoy sa presensiya ni Jesus sa bawat isa o sa gitna ng buong pamayanan; pinananatili ng pangunahing salin ang karaniwang 'nasa inyo.'
- source_word: εἰ μήτι
  choice: maliban na lamang kung
  rationale: Natural itong naghahayag ng eksepsiyon at nagpapanatili ng bahagyang retorikal na pagpipigil ng parirala.
- source_word: ἀδόκιμοι
  choice: hindi kayo pumapasa sa pagsubok
  rationale: Tuwirang ipinapakita ang kabaligtaran ng pagiging napatunayang katanggap-tanggap, nang hindi nagdadala ng teolohikal na bigat ng 'itinakwil.'
theological_decisions:
- issue: Kahulugan ng ἐν τῇ πίστει
  choice: nasa pananampalataya
  alternative: may tunay na personal na pananampalataya
  rationale: Hindi nilulutas ng salin kung ang diin ay nasa pananatili sa pananampalatayang Kristiyano o sa pagiging tunay ng personal na pananampalataya.
- issue: Paglilipat sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay malinaw na maaaring marinig ang Χριστός bilang titulo; ang 'Mesiyas' ay naghahayag ng kahulugan nito.
- issue: Kahulugan ng ἐν ὑμῖν
  choice: nasa inyo
  alternative: nasa gitna ninyo
  rationale: Ang konteksto ng pagsusuri sa sarili ay pumapabor sa personal na presensiya, ngunit maaari ring magkaroon ng sama-samang kahulugan ang Griyego kaya inilalagay ang alternatibo sa talababa.
- issue: Kahulugan ng ἀδόκιμοι
  choice: hindi pumapasa sa pagsubok
  alternative: hindi katanggap-tanggap / hindi napatunayang karapat-dapat
  rationale: Pinananatili nito ang ugnayan sa mga pandiwa ng pagsusuri at pagsubok at iniiwasang ipasok ang mas huling doktrinal na konsepto ng pagiging itinakwil.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'suriin' at 'subukin' upang maipakita ang magkalapit ngunit hindi ganap na magkaparehong mga pandiwa. Pinanatili ang pag-uulit ng 'inyong sarili' at ang retorikal na tanong ng orihinal.
