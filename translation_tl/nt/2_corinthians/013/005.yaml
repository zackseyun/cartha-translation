revisions:
- from: Suriin ninyo ang inyong sarili kung kayo ay nasa pananampalataya; subukin ninyo ang inyong sarili. O hindi ba ninyo nakikilala sa inyong sarili na si Jesus na Mesiyas ay nasa inyo?[a]—maliban na lamang kung hindi kayo pumapasa sa pagsubok.[b]
  to: Suriin ninyo ang inyong sarili kung kayo ay nasa pananampalataya; subukin ninyo ang inyong sarili. O hindi ba ninyo kinikilala sa inyong sarili na si Jesus na Mesiyas ay nasa inyo?[a]—maliban na lamang kung hindi kayo nakapasa sa pagsubok.[b]
  rationale: Pinalitan ang pangwakas na parirala upang maging mas natural na modernong Tagalog at mas malapit sa resulta o kalagayang ipinahihiwatig ng ἀδόκιμοι. Pinanatili ang natitirang salin, kabilang ang maingat na pagkakaiba ng dalawang utos, ang bukas na saklaw ng “nasa pananampalataya,” ang Mesiyas bilang titulo, at ang talababa para sa posibleng sama-samang kahulugan ng ἐν ὑμῖν.
