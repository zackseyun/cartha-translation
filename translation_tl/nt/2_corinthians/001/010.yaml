  text: ὃς ἐκ τηλικούτου θανάτου ἐρρύσατο ἡμᾶς καὶ ⸀ῥύσεται, εἰς ὃν ἠλπίκαμεν ὅτι καὶ ἔτι ῥύσεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/010.yaml
  text: who rescued us from so great a death and will rescue us[a], in whom we have hoped that he will indeed rescue us again,
translation:
  language: tl
  text: Siya ang nagligtas sa amin mula sa napakatinding kamatayan at ililigtas niya kami. Sa kanya namin inilagak ang aming pag-asa na ililigtas pa rin niya kami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa napakatinding panganib na ikamamatay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τηλικούτου
  choice: gayon kalaking
  rationale: Pinananatili nito ang mariing pagtukoy sa tindi o laki ng panganib habang likas na nakakabit sa “kamatayan.”
- source_word: θανάτου
  choice: kamatayan
  rationale: Ito ang tuwirang kahulugan ng pangngalan. Hindi pinalitan sa pangunahing teksto ng interpretasyong “panganib na ikamamatay,” ngunit inilagay ang diwang iyon sa talababa.
- source_word: ἐρρύσατο
  choice: nagligtas
  rationale: Ipinapahayag nito ang pagliligtas mula sa matinding panganib sa malinaw at karaniwang modernong Tagalog.
- source_word: ῥύσεται
  choice: magliligtas
  rationale: Ginagamit ang iisang salitang-ugat para sa magkakaugnay na anyo ng pandiwang Griyego at pinananatili ang malinaw na aspektong hinaharap.
- source_word: εἰς ὃν
  choice: Sa kanya
  rationale: Sa konstruksiyong ito, ang parirala ay tumutukoy sa personal na pinagtutuunan ng pag-asa; natural ito sa Tagalog kasama ng “naglagak ng pag-asa.”
- source_word: ἠλπίκαμεν
  choice: kami naglagak ng pag-asa
  rationale: Ipinahihiwatig ng ganap na panahunan ang isang matatag na pagtitiwalang nagsimula na at nagpapatuloy.
- source_word: καὶ ἔτι
  choice: muli
  rationale: Malinaw nitong ipinahahayag ang inaasahang karagdagang pagliligtas; ang katiyakan ay ipinapakita rin ng tuwirang pahayag na “niya kaming ililigtas.”
theological_decisions:
- issue: Kung literal na “kamatayan” o idyomatikong “panganib na ikamamatay” ang gagamitin sa pangunahing teksto
  choice: Panatilihin ang “kamatayan” sa pangunahing teksto
  alternative: Isalin bilang “panganib na ikamamatay”
  rationale: Tahasan ang θανάτου na “kamatayan.” Pinananatili ng saling ito ang matinding larawan ni Pablo, samantalang kinikilala sa talababa ang posibleng idyomatikong diwa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang “naglagak ng pag-asa” upang natural na maipahayag ang matatag at nagpapatuloy na pagtitiwala; iniwasan ang labis na arkaiko o denominasyonal na pananalita.
