  source_fidelity: Tumpak na naipapahayag ng draft ang pagbating may dalawang kaloob—biyaya at kapayapaan—at ang pinagmumulan ng mga ito sa Diyos na ating Ama at sa Panginoong Jesus na Mesiyas. Gayunman, ang anyong “kapayapaang mula sa” ay panggramatikang pinakamalapit lamang sa “kapayapaan,” kaya maaari nitong palabuin kung ang “mula sa Diyos...” ay saklaw din ang “biyaya.”
  naturalness: Likas at marangal ang “Sumainyo nawa.” Mas malinaw at mas natural sa makabagong Tagalog ang magkatambal na mga pangngalang “biyaya at kapayapaan” na sinusundan ng isang panuring na malinaw na sumasaklaw sa kapuwa.
  terminology: Ang “biyaya,” “kapayapaan,” “Diyos na ating Ama,” “Panginoon,” at “Mesiyas” ay angkop. Ang talababa para sa tradisyonal na “Jesu-Cristo” ay dapat idiomatikong sabihin bilang “sa tradisyonal na salin,” hindi “ayon sa tradisyon.”
