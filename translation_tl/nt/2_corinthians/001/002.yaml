base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: tl
  text: Sumainyo nawa ang biyaya at kapayapaan mula sa Diyos na ating Ama at sa Panginoong Jesus na Mesiyas[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa tradisyonal na salin, “Jesu-Cristo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Panginoon” ay maaari ring isaling “Amo” sa ilang konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: biyaya
  rationale: Karaniwang katumbas sa makabagong Tagalog na nagpapanatili kapuwa sa anyo ng pagbati at sa mas malalim na diwang teolohikal ng salita.
- source_word: ὑμῖν
  choice: sumainyo nawa
  rationale: Likas na pormula ng pagbati at pagpapala sa Tagalog; ipinahahayag ng “sumainyo” ang datibong “sa inyo,” samantalang ang “nawa” ay nagbibigay ng natural na himig ng pagbati kahit walang tahasang pandiwa sa Griyego.
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Tuwirang katumbas na nagpapanatili sa malawak na biblikal na diwa ng kapayapaan at kagalingan.
- source_word: ἀπὸ
  choice: mula sa
  rationale: Malinaw na ipinakikita ang pinagmumulan ng biyaya at kapayapaan.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Diyos na ating Ama
  rationale: Natural at malinaw na anyong Tagalog para sa Diyos bilang Ama natin, nang hindi binabago ang ugnayan ng mga salita.
- source_word: κυρίου
  choice: Panginoon
  rationale: Ito ang kinagawiang marangal na katumbas sa gamit na kristolohikal; ang “Amo” ay maaaring maging katumbas sa ibang konteksto ngunit hindi kasing-angkop sa pormula ng pagpapalang ito.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Pinananatiling pangalan ang “Jesus” at inilalahad ang kahulugan ng Χριστός bilang titulong “Mesiyas,” habang kinikilala sa talababa ang tradisyonal na “Jesu-Cristo.”
theological_decisions:
- issue: Paglalarawan sa Χριστοῦ sa pagbating Paulino
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay may kahulugang titulo, kaya “Mesiyas” ang ginamit upang maging hayag ang kahulugan nito. Hindi nito ipinapasya nang lubos kung gaano na ito naging tulad ng pangalan sa pormulang Paulino; ibinigay ang tradisyonal na anyo sa talababa.
- issue: Kristolohikal na gamit ng κυρίου
  choice: Panginoon
  alternative: Amo
  rationale: Sa pormulang ito, si Jesus ay tinutukoy sa titulong κύριος at iniuugnay sa Diyos na Ama bilang pinagmumulan ng biyaya at kapayapaan. Ang “Panginoon” ang pinakaangkop na marangal at biblikal na salin nang walang idinaragdag na paliwanag sa teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang likas na pormulang “Sumainyo nawa” upang maipahayag ang eliptikal na pagbating Griyego, at inulit ang “sa” bago ang “Panginoon” upang luminaw na ang biyaya at kapayapaan ay mula sa Diyos na Ama at sa Panginoong Jesus na Mesiyas.
