  text: τοῦτο οὖν ⸀βουλόμενος μήτι ἄρα τῇ ἐλαφρίᾳ ἐχρησάμην; ἢ ἃ βουλεύομαι κατὰ σάρκα βουλεύομαι, ἵνα ᾖ παρ’ ἐμοὶ τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/017.yaml
  text: So when I intended this[a], was I acting lightly? Or do I plan what I plan according to the flesh, so that with me there should be both “Yes, yes” and “No[d][c][b], no”?
translation:
  language: tl
  text: Kaya, nang balakin ko ito, naging pabago-bago ba ako?[a] O ang mga binabalak ko ba ay binabalak ko ayon sa laman,[b] anupat sa akin ay may parehong “Oo, oo” at “Hindi, hindi”?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kumilos ba ako nang pabagu-bago?”
    reason: lexical_alternative
  - marker: b
    text: Ang “ayon sa laman” ay maaaring mangahulugang ayon lamang sa pamantayang pantao o makamundo.
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, na para bang sa kanyang pananalita ay kapuwa umiiral ang “Oo” at ang “Hindi.”
    reason: cultural_note
lexical_decisions:
- source_word: βουλόμενος
  choice: nang balakin ko
  rationale: Tumutukoy ito sa naunang balak ni Pablo na maglakbay. Ang “balakin” ay likas sa makabagong Tagalog at hindi labis na nagpapahiwatig ng isang pormal o tiyak nang plano.
- source_word: τῇ ἐλαφρίᾳ ἐχρησάμην
  choice: naging pabago-bago ba ako
  rationale: Sa konteksto, ang idyoma ay tumutukoy sa kawalang-katatagan o pagiging salawahan sa layunin, hindi lamang sa pagkilos nang walang kaseryosohan. Malinaw at natural na ipinahahayag ito ng “naging pabago-bago.”
- source_word: ἃ βουλεύομαι ... βουλεύομαι
  choice: ang mga binabalak ko ba ay binabalak ko
  rationale: Pinananatili ang retorikal na pag-uulit ng pandiwa sa Griyego, habang nananatiling mauunawaan sa Tagalog.
- source_word: κατὰ σάρκα
  choice: ayon sa laman
  rationale: Pinananatili ang mahalagang katawagang Paulino at ang posibleng lawak ng kahulugan nito sa halip na agad itong paliitin sa “makamundo” o “ayon lamang sa pamantayang pantao.”
- source_word: παρ’ ἐμοὶ
  choice: sa akin ay
  rationale: Ipinahahayag nito na ang magkasalungat na pagsang-ayon at pagtanggi ay matatagpuan o makikita sa sariling pananalita at asal ni Pablo.
- source_word: τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: kapuwa may “Oo, oo” at “Hindi, hindi”
  rationale: Pinananatili ang pag-uulit at ang pagkakatabi ng magkasalungat na tugon, na siyang diin ng retorikal na tanong.
theological_decisions:
- issue: Kahulugan ng σάρξ sa pariralang κατὰ σάρκα
  choice: ayon sa laman
  alternative: ayon lamang sa pamantayang pantao; sa makamundong paraan
  rationale: Ang “laman” ay sadyang pinanatili upang mapanatili ang wikang teolohikal ni Pablo at ang tunay na saklaw ng idyoma. Nililinaw sa talababa ang posibleng kahulugan sa kontekstong ito nang hindi ginagawang iyon lamang ang maaaring pagbasa.
- issue: Ugnayan ng “Oo, oo” at “Hindi, hindi”
  choice: kapuwa may “Oo, oo” at “Hindi, hindi”
  alternative: sabay akong nagsasabi ng “Oo” at “Hindi”
  rationale: Hindi tahasang sinasabi ng Griyego ang pandiwang “nagsasabi.” Ang mas pormal na anyo sa pangunahing teksto ay nagpapanatili sa retorikal na pagkakabuo at hindi labis na nagpapaliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang retorikal na dalawang tanong, ang pag-uulit ng mga pandiwa, at ang “Oo, oo”/“Hindi, hindi.” Ang “ayon sa laman” ay sadyang pormal upang mapanatili ang katawagang Paulino, ngunit nilinaw sa talababa.
