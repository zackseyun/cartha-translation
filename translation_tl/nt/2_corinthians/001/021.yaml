  source_fidelity: 'Tumpak ang pangunahing balangkas: ang Diyos ang nagpapatatag kina Pablo at sa mga taga-Corinto sa Mesiyas at siyang nagpahid sa kanila. Gayunman, ang “nagpahid sa amin” ay kulang sa likas na pantulong/layon sa Filipino at maaaring hindi malinaw bilang pagsasalin ng χρίσας.'
  naturalness: Ang “nagpapatatag sa amin kasama ninyo sa Mesiyas” ay mauunawaan, bagaman siksik. Ang pagdaragdag ng “ng langis” sa “nagpahid” ay gumagawa rito ng likas at malinaw na Filipino nang hindi binabago ang diwa ng pagpapahid/anointing.
  terminology: Ang “Mesiyas” ay angkop para sa Χριστόν bilang titulo. Pinanatili ang “Diyos” sa hulihan upang maipakita ang pagbibigay-diin sa Griyego. Ang talababa ay inayos upang ang alternatibong “kay Cristo” ay hindi maling mailarawan na eksaktong katumbas ng relasyonal na “sa Mesiyas.”
  issues:
