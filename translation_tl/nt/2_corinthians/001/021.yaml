  text: But the one who establishes us with you in Messiah[a], and who anointed us, is God.
translation:
  language: tl
  text: Ngunit ang nagpapatatag sa amin kasama ninyo sa Mesiyas at nagpahid ng langis sa amin ay ang Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βεβαιῶν
  choice: nagpapatatag
  rationale: Ipinahahayag nito ang patuloy na pagkilos ng paggawa sa isang tao na matatag o matibay, alinsunod sa kasalukuyang pandiwaring Griyego.
- source_word: σὺν ὑμῖν
  choice: kasama ninyo
  rationale: Malinaw nitong pinananatili ang magkasamang pakikibahagi nina Pablo at ng mga taga-Corinto.
- source_word: εἰς Χριστόν
  choice: sa Mesiyas
  rationale: Pinananatili ng “sa” ang malawak na relasyonal o inkorporatibong diwa ng parirala nang hindi ito nililimitahan sa isang paliwanag lamang; ang Χριστός ay ginawang titulong “Mesiyas.”
- source_word: χρίσας
  choice: nagpahid
  rationale: Pinananatili nito ang tuwirang ugnayang leksikal sa χρίω at ang larawan ng pagpapahid, nang hindi agad nililimitahan sa ritwal na pagtatalaga.
- source_word: θεός
  choice: ang Diyos
  rationale: Pinananatili sa hulihan ng pangungusap ang Diyos bilang mariing pagkakakilanlan ng gumagawa ng dalawang kilos.
theological_decisions:
- issue: Diwa ng εἰς sa εἰς Χριστόν
  choice: relasyonal o inkorporatibong “sa Mesiyas”
  alternative: mas tahasang “tungo sa Mesiyas” o interpretatibong “sa pakikipag-isa sa Mesiyas”
  rationale: Maaaring magpahiwatig ang εἰς ng pagtuon o pagpasok sa isang ugnayan. Ang “sa Mesiyas” ay sadyang hindi nagpapasya nang labis sa pagitan ng mga diwang ito.
- issue: Paglalarawan sa χρίσας
  choice: nagpahid
  alternative: nagtalaga
  rationale: Ang “nagpahid” ay nagpapanatili sa metaporang maaaring tumukoy sa pagtatalaga o pagbibigay-kakayahan, nang hindi ipinapasok sa salin ang isang mas makitid na doktrinal na paliwanag.
translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang bahagyang siksik na ayos ng Griyego upang manatiling nasa hulihan ang mariing “ang Diyos,” habang gumamit ng karaniwang bokabularyong madaling maunawaan.
