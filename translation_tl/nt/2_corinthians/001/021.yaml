    issue: Hindi likas at hindi sapat na malinaw ang “nagpahid sa amin.”
    rationale: Ang χρίσας ay ‘nagpahid/nagpahid ng langis’ o ‘nagpahid bilang pagpapahid.’ Sa Filipino, ang pandiwang “nagpahid” ay karaniwang nangangailangan ng ipinahid; ang “nagpahid sa amin” ay maaaring mabasa bilang pagpunas o paglalagay ng di-tiyak na bagay. Ang “nagpahid ng langis sa amin” ay natural at pinananatili ang larawang leksikal.
  - severity: low
    issue: Kailangang linawin ang pahayag ng talababa hinggil sa alternatibong “kay Cristo.”
    rationale: Ang “kay Cristo” ay isang tradisyonal at posibleng salin ng parirala, ngunit ang “sa Mesiyas” ang napiling salin para sa relasyonal na gamit ng εἰς. Ang talababa ay dapat maglahad nito bilang alternatibong pagsasalin, hindi bilang ganap na katumbas na anyo.
  revised_text: Ngunit ang nagpapatatag sa amin kasama ninyo sa Mesiyas at nagpahid ng langis sa amin ay ang Diyos.
