id: 2CO.1.16
reference: 2 Corinthians 1:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ δι’ ὑμῶν διελθεῖν εἰς Μακεδονίαν, καὶ πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι εἰς τὴν Ἰουδαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/016.yaml
  text: and through you to pass into Macedonia[a], and again from Macedonia to come to you and by you to be sent on to Judea.
translation:
  language: tl
  text: at daraan sa inyo patungong Macedonia, at mula sa Macedonia ay muli akong pupunta sa inyo, saka ninyo ako tutulungang magpatuloy sa paglalakbay patungong Judea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “saka ninyo ako ihatid patungong Judea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὑμῶν
  choice: daraan sa inyo
  rationale: Ipinahihiwatig ng διά na ang mga taga-Corinto ay dadaanan ni Pablo sa nakaplano niyang paglalakbay; likas sa Tagalog ang “daraan sa inyo.”
- source_word: διελθεῖν εἰς Μακεδονίαν
  choice: patungong Macedonia
  rationale: Ipinapahayag nito ang pagpapatuloy ng paglalakbay papasok sa Macedonia. Sapat at natural sa Tagalog ang “patungong Macedonia” nang hindi nawawala ang direksiyon ng kilos.
- source_word: πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς
  choice: mula sa Macedonia ay muli akong pupunta sa inyo
  rationale: Pinananatili ng “mula” ang pinanggalingan, ng “muli” ang pag-uulit, at ng “pupunta sa inyo” ang tahasang kilos patungo sa mga taga-Corinto nang hindi idinaragdag ang salitang “babalik,” na ipinahihiwatig lamang ng konteksto.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι
  choice: ninyo ako tutulungang magpatuloy sa paglalakbay
  rationale: Sa konteksto ng paglalakbay, ang προπέμπω ay karaniwang tumutukoy sa pagpapaalis o pagtulong sa isang manlalakbay upang makapagpatuloy, kabilang ang posibleng paghatid at paglalaan ng kailangan. Tahasang pinananatili ng “ninyo” ang mga taga-Corinto bilang gumagawa ng tulong.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: patungong Judea
  rationale: Natural na ipinapahayag ng “patungong” ang Judea bilang destinasyon ng paglalakbay.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyo ng pangungusap bilang pagpapatuloy ng naunang talata. Ang “saka” ay likas na nag-uugnay sa huling bahagi ng nakaplanong ruta, at ang talibaba ay nagpapanatili sa mas literal na posibilidad ng paghatid.
