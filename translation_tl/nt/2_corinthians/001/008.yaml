  to: Hindi namin nais, mga kapatid[a], na hindi ninyo malaman ang tungkol sa kapighatiang dinanas namin sa Asia[b], sapagkat lubha kaming nabigatan, higit sa aming lakas, hanggang sa tuluyan kaming mawalan ng pag-asang mabuhay pa[c].
