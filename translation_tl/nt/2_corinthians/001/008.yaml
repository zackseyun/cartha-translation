id: 2CO.1.8
reference: 2 Corinthians 1:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν, ἀδελφοί, ⸀ὑπὲρ τῆς θλίψεως ἡμῶν τῆς ⸀γενομένης ἐν τῇ Ἀσίᾳ, ὅτι καθ’ ὑπερβολὴν ⸂ὑπὲρ δύναμιν ἐβαρήθημεν⸃, ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/008.yaml
  text: For we do not want you to be unaware[a], brothers, about our affliction that happened in Asia, that we were burdened exceedingly, beyond our strength[c][b], so that we despaired even of life.
translation:
  language: tl
  text: Hindi namin nais, mga kapatid[a], na hindi ninyo malaman ang tungkol sa kapighatiang dinanas namin sa Asia[b], sapagkat lubha kaming nabigatan, higit sa aming lakas, hanggang sa tuluyan kaming mawalan ng pag-asang mabuhay pa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay panlalaking maramihan, ngunit sa kontekstong ito malamang na tumutukoy si Pablo sa buong pamayanan ng mga mananampalataya.
    reason: cultural_note
  - marker: b
    text: Ang “Asia” rito ay ang lalawigang Romano sa kanlurang Asia Minor, hindi ang makabagong kontinente ng Asia.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin, “hanggang sa tuluyan kaming mawalan ng pag-asa, maging sa patuloy na pamumuhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν
  choice: Sapagkat ayaw naming hindi ninyo malaman
  rationale: Likas na pahayag sa modernong Tagalog na pinananatili ang volitional na diwa ng θέλομεν at ang negatibong ἀγνοεῖν.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay karaniwang tawag sa Tagalog para sa magkakapatid o kapwa mananampalataya at hindi kailangang markahan ayon sa kasarian, bagaman panlalaking maramihan ang anyong Griyego.
- source_word: ὑπὲρ τῆς θλίψεως ἡμῶν τῆς γενομένης
  choice: ang tungkol sa kapighatiang dinanas namin
  rationale: Ang “kapighatian” ay nagpapanatili sa bigat ng θλῖψις; ang “dinanas namin” ay natural na ipinahihiwatig ang pangyayaring sumapit sa kanila.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: sa Asia
  rationale: Pinananatili ang pangalang heograpiko; nililinaw sa talababa na lalawigang Romano ang tinutukoy, hindi ang makabagong kontinente.
- source_word: καθ’ ὑπερβολὴν ὑπὲρ δύναμιν ἐβαρήθημεν
  choice: Labis-labis kaming nabigatan, higit sa aming lakas
  rationale: Pinananatili ng “nabigatan” ang larawan ng ἐβαρήθημεν, samantalang magkahiwalay na naipahahayag ang matinding antas at ang paglampas sa kanilang kakayahan.
- source_word: ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν
  choice: kaya nawalan kami ng pag-asang mabuhay pa
  rationale: Malinaw na ipinapahayag ang resultang ipinakikilala ng ὥστε at ang sukdulang kawalan ng pag-asa maging sa pagpapatuloy ng buhay.
theological_decisions:
- issue: Saklaw ng ἀδελφοί sa pagbati sa kapulungan
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, ang likas na Tagalog na “mga kapatid” ay maaaring tumukoy sa buong pamayanang mananampalataya nang hindi nagdaragdag o nag-aalis ng kasarian sa pahayag.
- issue: Diwa ng καὶ τοῦ ζῆν
  choice: mabuhay pa
  alternative: pati sa buhay; maging sa patuloy na pamumuhay
  rationale: Ipinahihiwatig ng konstruksyon ang kawalan ng pag-asa na magpatuloy pang mabuhay; inilalagay sa talababa ang mas malapit na alternatibo upang mapanatili ang saklaw ng diwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Sapagkat” para sa γάρ at ang karaniwang biblikal ngunit buhay pa ring “kapighatian”; iniwasan ang sobrang arkaiko o teknikal na pananalita.
