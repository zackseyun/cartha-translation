id: 2CO.1.5
reference: 2 Corinthians 1:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι καθὼς περισσεύει τὰ παθήματα τοῦ Χριστοῦ εἰς ἡμᾶς, οὕτως διὰ τοῦ Χριστοῦ περισσεύει καὶ ἡ παράκλησις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/005.yaml
  text: For just as the sufferings of Christ overflow to us[b][a], so also through Christ our comfort overflows.
translation:
  language: tl
  text: Sapagkat kung paanong umaapaw sa amin ang mga pagdurusa ni Cristo[a][b], gayundin, sa pamamagitan ni Cristo, umaapaw ang aming kaaliwan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga pagdurusa alang-alang kay Cristo.” Maaaring tumukoy ang Griyego sa mga pagdurusang nauukol kay Cristo o sa mga pagdurusang dinaranas dahil sa kanya.
    reason: alternative_reading
  - marker: b
    text: Ang “Cristo” ay maaari ding isaling “Mesiyas” kapag binibigyang-diin ang kahulugan nito bilang titulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag sa naunang pahayag at pinananatili ang ugnayang sanhi.
- source_word: καθὼς ... οὕτως
  choice: kung paanong ... gayundin
  rationale: Natural na Filipino na nagpapanatili sa magkatugmang paghahambing ng Griyego.
- source_word: περισσεύει
  choice: umaapaw
  rationale: Ipinahahayag ang kasaganaan at pinananatili ang larawang inuulit sa dalawang bahagi ng talata.
- source_word: τὰ παθήματα
  choice: ang mga pagdurusa
  rationale: Tuwiran, malinaw, at angkop sa konteksto ng mga paghihirap na dinaranas nina Pablo.
- source_word: τοῦ Χριστοῦ
  choice: ni Cristo
  rationale: Pinananatili ang maluwag na ugnayan ng genitive nang hindi ipinapasiyang tiyak kung ang mga ito ay pagdurusang nauukol kay Cristo o dinaranas alang-alang sa kanya.
- source_word: εἰς ἡμᾶς
  choice: sa amin
  rationale: Likas na Filipino para sa pagdating at pagdanas ng mga pagdurusa sa pangkat na tinutukoy ni Pablo.
- source_word: διὰ τοῦ Χριστοῦ
  choice: sa pamamagitan ni Cristo
  rationale: Malinaw na ipinahahayag ang namamagitang kaparaanan o ahensiya.
- source_word: παράκλησις
  choice: kaaliwan
  rationale: Pinakamalinaw na katapat sa kontekstong pastoral at sa paulit-ulit na paghahambing ng pagdurusa at pag-aliw.
- source_word: ἡ παράκλησις ἡμῶν
  choice: ang aming kaaliwan
  rationale: Tuwirang pinananatili ang anyong paari ng Griyego nang hindi nagpapasok ng paliwanag na wala sa teksto.
theological_decisions:
- issue: Kahulugan ng “mga pagdurusa ni Cristo”
  choice: Pinanatili sa pangunahing teksto ang bukas na pariralang “mga pagdurusa ni Cristo.”
  alternative: “mga pagdurusa alang-alang kay Cristo” o mga pagdurusang kaugnay ng pakikibahagi kay Cristo
  rationale: Maaaring magpahiwatig ang genitive ng mga pagdurusang nauukol o kaugnay kay Cristo, habang posible rin ang pagdurusa dahil sa kanya. Hindi dapat tahimik na lutasin ang tensiyong ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “umaapaw” sa dalawang sugnay upang mapanatili ang pag-uulit at larawan ng orihinal; pinanatili rin ang “aming kaaliwan” sa halip na palawakin bilang “kaaliwang tinatanggap namin.”
