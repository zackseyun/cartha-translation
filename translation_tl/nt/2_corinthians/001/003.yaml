base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], the Father of mercies and God of all comfort[d][c][b],
translation:
  language: tl
  text: Purihin ang Diyos at Ama ng ating Panginoong[b] Jesus na Mesiyas[a], ang Ama ng mga habag[c] at Diyos ng lahat ng kaaliwan[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Jesu-Cristo.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin ang “Panginoon” bilang “Guro” o “Amo,” ngunit “Panginoon” ang karaniwang kahulugan dito.
    reason: lexical_alternative
  - marker: c
    text: 'Sa Griyego, maramihan: “mga habag” o “mga pagkahabag.”'
    reason: source_form
  - marker: d
    text: Maaari ring “pagpapalakas-loob” o “pag-aliw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Purihin
  rationale: Ang salitang ito ay ginagamit sa pormulang pagpupuri sa Diyos. Likas at marangal sa makabagong Tagalog ang “Purihin,” at naipapahayag nito ang diwa ng doxolohiya.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: ang Diyos at Ama
  rationale: Ang iisang pantukoy sa Griyego ay sumasaklaw sa magkaugnay na katawagang “Diyos at Ama,” hindi sa dalawang magkahiwalay na tinutukoy.
- source_word: κυρίου
  choice: Panginoon
  rationale: Ito ang karaniwan at angkop na salin ng κύριος sa kristolohikal na gamit; inilapi ang pang-angkop upang maging natural ang pariralang Tagalog.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Pinananatiling malinaw ang kahulugan nito bilang titulo, sa halip na tratuhing apelyido lamang; idinagdag ang “na” ayon sa likas na balarila ng Tagalog.
- source_word: οἰκτιρμῶν
  choice: habag
  rationale: Natural sa Tagalog ang di-mabilang na pangngalang “habag” sa pariralang ito. Bagaman maramihan ang anyong Griyego, ang literal na “mga habag” ay alanganin sa kasalukuyang Tagalog; inilalahad sa talababa ang anyong maramihan.
- source_word: παρακλήσεως
  choice: kaaliwan
  rationale: Sa konteksto ng pagdurusa sa mga kasunod na talata, “kaaliwan” ang pinakamalinaw at pinakanatural, habang kinikilala sa talababa ang saklaw na “pagpapalakas-loob” at “pag-aliw.”
theological_decisions:
- issue: Pagkasalin sa kristolohikal na titulong Χριστός sa Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  alternative: Jesu-Cristo
  rationale: Ipinakikita ng “Mesiyas” ang kahulugan ng titulo. Ginagamit ang “Jesus na Mesiyas” upang maging natural sa Tagalog nang hindi ginagawang apelyido ang Χριστός.
- issue: Kaugnayan ng “Diyos” at “Ama”
  choice: ang Diyos at Ama
  alternative: Diyos at Ama
  rationale: Pinananatili ang mga ito bilang dalawang magkakaugnay na paglalarawan sa iisang tinutukoy, alinsunod sa balangkas ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang “Purihin” bilang likas na pormulang doxolohikal; iniwasan ang masyadong literal ngunit alanganing “mga habag” sa pangunahing teksto, habang pinanatili ang impormasyong iyon sa talababa.
