  yaml_path: translation/nt/2_corinthians/001/007.yaml
  text: And our hope for you is firm[a], because we know that just as you share in the sufferings, so also you share in the comfort.
translation:
  language: tl
  text: At matatag ang pag-asa namin para sa inyo, sapagkat alam namin na kung paanong nakikibahagi kayo sa mga pagdurusa, gayundin naman ay nakikibahagi kayo sa kaaliwan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagpapalakas-loob” para sa “kaaliwan” (παράκλησις).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίς
  choice: pag-asa
  rationale: Karaniwang katumbas ito na nagpapanatili sa diwa ng may-tiwalang paghihintay nang hindi ginagawang simpleng katiyakan lamang.
- source_word: βεβαία
  choice: matatag
  rationale: Ipinahahayag nito ang pagiging tiyak, matibay, at maaasahan ng pag-asa ni Pablo sa natural na modernong Tagalog.
- source_word: ὑπὲρ ὑμῶν
  choice: para sa inyo
  rationale: Likas at maikli itong pagpapahayag ng pagtukoy ng pag-asa ni Pablo sa mga taga-Corinto.
- source_word: εἰδότες
  choice: sapagkat alam namin
  rationale: Ginagawang malinaw ang sanhi o batayan ng naunang pahayag, gaya ng ipinahihiwatig ng participle sa konteksto.
- source_word: ὡς ... οὕτως καί
  choice: kung paanong ... gayundin naman
  rationale: Pinananatili nito ang magkatugmang estruktura at paghahambing ng Griyego sa natural na Tagalog.
- source_word: κοινωνοί
  choice: nakikibahagi
  rationale: Malinaw nitong ipinapahayag ang aktibong pakikibahagi o pagiging kasalo sa parehong pagdurusa at kaaliwan.
- source_word: παθημάτων
  choice: mga pagdurusa
  rationale: Malawak at tuwirang salin ito na angkop sa paulit-ulit na tema ng pagdurusa sa konteksto.
- source_word: παρακλήσεως
  choice: kaaliwan
  rationale: Pinananatili nito ang pangunahing diwa at ang tematikong pag-uulit ng παράκλησις sa 2 Corinto 1, habang kinikilala sa talababa ang posibleng diwang pagpapalakas-loob.
- source_word: '[elliptical second clause]'
  choice: nakikibahagi kayo sa
  rationale: Inuulit sa Tagalog ang pandiwang ipinahihiwatig lamang sa ikalawang sugnay ng Griyego upang maging malinaw at natural ang pangungusap.
