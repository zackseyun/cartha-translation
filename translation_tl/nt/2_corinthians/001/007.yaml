translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang paralelismong “kung paanong ... gayundin naman” at ang tematikong salitang “kaaliwan” sa konteksto ng kabanata.
