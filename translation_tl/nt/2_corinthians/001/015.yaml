  yaml_path: translation/nt/2_corinthians/001/015.yaml
  text: And with this confidence I intended to come to you first[a], so that you might have a second benefit[b],
translation:
  language: tl
  text: Sa pagtitiwalang ito, binalak kong pumunta muna sa inyo, upang magkaroon kayo ng ikalawang pakinabang[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ikalawang biyaya” o “ikalawang pabor.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθήσει
  choice: pagtitiwala
  rationale: Ang πεποίθησις ay tumutukoy sa matatag na pagtitiwala o katiyakan. Likas sa modernong Tagalog ang “pagtitiwala” at angkop ito sa tiwala ni Pablo na binanggit sa konteksto.
- source_word: ἐβουλόμην
  choice: binalak ko
  rationale: Ipinapahayag ng βούλομαι ang hangarin o layunin. Ang “binalak ko” ay malinaw na nagsasaad ng dating intensiyon nang hindi ipinahihiwatig na tiyak na tiyak na ang plano.
- source_word: πρότερον πρὸς ὑμᾶς ἐλθεῖν
  choice: pumunta muna sa inyo
  rationale: Dito, ang πρότερον ay pinakanatural unawain bilang una sa pagkakasunod-sunod ng paglalakbay. Ipinahahayag iyon ng “muna” sa natural na Tagalog.
- source_word: δευτέραν χάριν
  choice: ikalawang biyaya
  rationale: Maaaring mangahulugan ang χάρις ng biyaya, pabor, o kapakinabangang matatanggap dahil sa pagdalaw ni Pablo. Pinananatili ng “biyaya” ang positibong diwa at ang lawak ng salita, samantalang nililinaw sa talababa ang kontekstuwal na alternatibo.
- source_word: σχῆτε
  choice: tumanggap kayo
  rationale: Bagaman literal na “magkaroon,” maaaring idiomatikong mangahulugan dito ang ἔχω na tumanggap. Mas natural sa Tagalog ang “tumanggap kayo” kasama ng “biyaya.”
theological_decisions:
- issue: Ang kahulugan ng χάρις sa pariralang δευτέραν χάριν
  choice: ikalawang biyaya
  alternative: ikalawang pakinabang; ikalawang pabor
  rationale: Hindi tiyak kung ginagamit dito ang χάρις sa mas malawak na diwa ng biyaya/pabor o partikular na pakinabang mula sa pagdalaw. Hindi ito nilimitahan sa doktrina ng nagliligtas na biyaya; pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “muna” para sa ayos ng paglalakbay at ang “binalak” para sa dating intensiyon. Ang talababa ay nakapuwesto agad pagkatapos ng “biyaya,” ang salitang tinutukoy nito.
