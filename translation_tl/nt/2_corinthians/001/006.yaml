  text: εἴτε δὲ θλιβόμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως καὶ σωτηρίας· ⸂εἴτε παρακαλούμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως⸃ τῆς ἐνεργουμένης ἐν ὑπομονῇ τῶν αὐτῶν παθημάτων ὧν καὶ ἡμεῖς πάσχομεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/006.yaml
  text: But if we are afflicted[a], it is for your comfort and salvation; or if we are comforted, it is for your comfort[b], which is at work in enduring the same sufferings that we also suffer.
translation:
  language: tl
  text: Ngunit kung dumaranas kami ng paghihirap,[a] iyon ay para sa inyong kaaliwan at kaligtasan; at kung inaaliw kami, iyon ay para sa inyong kaaliwan,[b] na nagiging mabisa sa matiyaga ninyong pagtitiis sa mga iyon ding pagdurusang dinaranas namin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hindi kasama sa ilang manuskrito ang: “at kung inaaliw kami, iyon ay para sa inyong kaaliwan.”'
    reason: textual_variant
  - marker: b
    text: Maaari ring “pagpapalakas ng loob” sa halip na “kaaliwan” sa buong talatang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβόμεθα
  choice: dumaranas kami ng paghihirap
  rationale: Ipinahahayag ng pangkasalukuyang balintiyak ang patuloy na pagdanas ng matinding hirap o kagipitan; natural at malinaw ito sa modernong Tagalog.
- source_word: παρακλήσεως / παρακαλούμεθα
  choice: kaaliwan / inaaliw
  rationale: Pinananatili ang pag-uugnay ng magkakapamilyang salita sa konteksto at ang diwang kapuwa nagpapagaan ng loob at nagpapalakas.
- source_word: σωτηρίας
  choice: kaligtasan
  rationale: Ito ang tuwiran at malawak na katumbas ng σωτηρία, nang hindi nililimitahan ang kahulugan sa pansamantalang pagliligtas lamang.
- source_word: τῆς ἐνεργουμένης
  choice: na kumikilos
  rationale: Ipinakikita nito na ang kaaliwan ay aktibo at mabisa, hindi basta umiiral lamang.
- source_word: ἐν ὑπομονῇ
  choice: habang matiyaga ninyong tinitiis
  rationale: Likas sa Tagalog at ipinahahayag ang matatag na pagtitiis bilang kalagayan kung saan kumikilos ang kaaliwan.
- source_word: τῶν αὐτῶν παθημάτων
  choice: ang mga pagdurusang dinaranas din namin
  rationale: Malinaw na pinananatili ang diin sa magkatulad at magkabahaging pagdurusa ng mga taga-Corinto at ni Pablo at ng kanyang mga kasama.
- source_word: ὑπὲρ
  choice: para sa
  rationale: Natural na ipinahahayag ang kapakinabangang nakatuon sa mga taga-Corinto.
