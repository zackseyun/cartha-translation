- from: Ngunit kung dumaranas kami ng paghihirap,[a] iyon ay para sa inyong kaaliwan at kaligtasan; at kung inaaliw kami, iyon ay para sa inyong kaaliwan,[b] na kumikilos habang matiyaga ninyong tinitiis ang mga pagdurusang dinaranas din namin.
  to: Ngunit kung dumaranas kami ng paghihirap,[a] iyon ay para sa inyong kaaliwan at kaligtasan; at kung inaaliw kami, iyon ay para sa inyong kaaliwan,[b] na nagiging mabisa sa matiyaga ninyong pagtitiis sa mga iyon ding pagdurusang dinaranas namin.
  rationale: Pinalitan ang temporal na “habang” ng “sa” upang mas maipakita na ang kaaliwan ay mabisa sa konteksto ng matiyagang pagtitiis. Idinagdag ang “mga iyon ding” upang tahasang maisalin ang diin ng αὐτῶν sa magkatulad na pagdurusa. Walang binagong kahulugan ang mga talababa o ang tekstuwal na ambigwidad.
