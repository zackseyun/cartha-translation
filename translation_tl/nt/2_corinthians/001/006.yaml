  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kaaliwan” upang mapanatili ang pag-uulit ng παράκλησις, samantalang nililinaw sa talababa ang saklaw nitong “pagpapalakas ng loob.”
