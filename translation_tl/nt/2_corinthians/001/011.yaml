base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/011.yaml
  text: as you also join in helping us by prayer[c][b][a], so that thanks may be given by many on our behalf for the gracious gift given to us.
translation:
  language: tl
  text: Habang nakikiisa rin kayo sa pagtulong para sa amin sa pamamagitan ng taimtim na panalangin, upang maraming tao ang magpasalamat alang-alang sa amin dahil sa kaloob para sa amin.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang mas malapit sa ayos ng Griyego: “upang, mula sa maraming tao, ang kaloob para sa amin ay maipagpasalamat sa pamamagitan ng marami alang-alang sa amin.” Mahirap matiyak ang eksaktong kaugnayan ng “sa pamamagitan ng marami”; maaaring tumukoy ito sa mga nakikibahagi sa pagpapasalamat.'
    reason: alternative_reading
  - marker: b
    text: Sa literal, “mula sa maraming mukha”; idyoma ito para sa maraming tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνυπουργούντων
  choice: Tumutulong din kayo
  rationale: Ipinahahayag nito ang aktibong pakikiisa ng mga taga-Corinto sa pagtulong; likas sa Filipino ang payak na “tumutulong din kayo,” habang nananatili ang diwa ng συν- na sama-samang pagkilos.
- source_word: τῇ δεήσει
  choice: sa pamamagitan ng taimtim na panalangin
  rationale: Ang δέησις ay panalanging may mariing pakiusap. Nililinaw ng “sa pamamagitan ng” ang gamit nitong kasangkapan, at ng “taimtim” ang tindi ng pakiusap.
- source_word: ἐκ πολλῶν προσώπων
  choice: maraming tao
  rationale: Bagaman literal na “mula sa maraming mukha,” idyoma rito ang πρόσωπα para sa mga tao; natural at malinaw ang “maraming tao.”
- source_word: χάρισμα
  choice: kaloob na ipinagkaloob sa amin
  rationale: Pinananatili ng “kaloob” ang ideya ng regalong bunga ng biyaya. Ang pandiwang “ipinagkaloob” ay nagpapahiwatig ng pagkakaloob nang hindi isinasara kung ang tinutukoy ay pagliligtas, pagpapala, o ibang pagpapakita ng biyaya.
- source_word: διὰ πολλῶν
  choice: sa pamamagitan ng marami
  rationale: Pinananatili ang ikalawang πολλῶν at ang mahirap na pariralang διά upang hindi burahin ang tunay na kalabuan ng Griyego, kahit hindi tahasang tinutukoy kung ano ang namagitan—malamang ay ang mga panalangin ng marami.
- source_word: εὐχαριστηθῇ
  choice: magpasalamat
  rationale: Ang pasibong anyo ay isinalin sa natural na aktibong Filipino, na ang “maraming tao” ang gumaganap ng pagpapasalamat; hindi binabago nito ang pangunahing diwa ng pangungusap.
- source_word: ὑπὲρ ἡμῶν
  choice: alang-alang sa amin
  rationale: Ipinahahayag nito ang pagpapasalamat kaugnay ng at para sa kapakanan nina Pablo at ng mga kasama niya.
theological_decisions:
- issue: Ang kaugnayan ng “sa pamamagitan ng marami” sa kaloob o sa pagpapasalamat
  choice: 'Iniugnay sa pagkakaloob: “kaloob na ipinagkaloob sa amin sa pamamagitan ng marami,” habang nilalagyan ng talababa.'
  alternative: “upang sa pamamagitan ng marami ay maraming tao ang magpasalamat ... dahil sa kaloob sa amin”
  rationale: Hindi tiyak ang pagkakaugnay ng διὰ πολλῶν dahil sa ayos ng Griyego. Pinananatili ng pangunahing salin ang parirala at ang pag-uulit ng “marami,” samantalang ipinakikita ng talababa ang ibang posibleng pagkakaugnay nang hindi nagpapasya sa isang doktrinal na paliwanag.
- issue: Ang tiyak na tinutukoy ng χάρισμα
  choice: kaloob
  alternative: pagpapala; biyayang ipinakita sa amin; pagliligtas
  rationale: Hindi tahasang pinangalanan ng talata ang kaloob. Ang pangkalahatang “kaloob” ay nagpapanatili sa lawak ng salita at hindi ipinipilit na ang tinutukoy ay isang tiyak na uri ng himala o pagliligtas.
translation_notes:
  register: Makabago at marangal na Filipino, na mauunawaan sa karaniwang pagbasa. Ginamit ang “taimtim na panalangin” upang maipakita ang lakas ng δέησις, at pinanatili ang dalawang pagtukoy sa “marami” dahil kapansin-pansin ang pag-uulit sa Griyego. Iniwasan ang denominasyonal na pagpapakahulugan sa uri ng kaloob.
