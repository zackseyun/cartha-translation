    issue: Maling pagkakaugnay ng “sa pamamagitan ng marami” sa pagkakaloob ng kaloob sa pangunahing salin.
    rationale: Ang διὰ πολλῶν ay sumusunod sa τὸ ... χάρισμα at bago ang εὐχαριστηθῇ; ang pag-uugnay nito sa isang idinagdag na “ipinagkaloob” ay hindi ligtas at labis na nagpapasya sa mahirap na sintaks.
  - severity: medium
    issue: Ang “ipinagkaloob” ay nagdaragdag ng tahasang kilos ng pagkakaloob na wala sa Griyegong pariralang τὸ εἰς ἡμᾶς χάρισμα.
    rationale: Maaaring ipahiwatig ng χάρισμα ang kaloob na tinanggap, ngunit mas tapat at mas kaunti ang dagdag na interpretasyon ang “kaloob para sa amin.”
  - severity: low
    issue: Hindi lubos na naipapakita ng pangunahing salin ang ikalawang “marami.”
    rationale: Katulad ng English POB audit trail, maaaring unahin ng pangunahing linya ang kalinawan, kung ang nawawalang/mahirap na parirala ay malinaw na pinananatili sa talababa bilang alternatibong mas literal na salin.
