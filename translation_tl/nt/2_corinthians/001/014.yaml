  text: καθὼς καὶ ἐπέγνωτε ἡμᾶς ἀπὸ μέρους, ὅτι καύχημα ὑμῶν ἐσμεν καθάπερ καὶ ὑμεῖς ἡμῶν ἐν τῇ ἡμέρᾳ τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/014.yaml
  text: just as you also came to understand us in part[a], that we are your boast, just as you also are ours[b], in the day of our Lord Jesus.
translation:
  language: tl
  text: kung paanong bahagya ninyo kaming naunawaan[a], na kami ang maipagmamalaki ninyo, kung paanong kayo rin ang maipagmamalaki namin[b] sa araw ng ating Panginoong Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa isang antas lamang” o “hindi lubos.”
    reason: lexical_alternative
  - marker: b
    text: O “dahilan ng aming pagmamalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωτε
  choice: nakilala
  rationale: Ipinahihiwatig nito ang tunay na pagkilala o pagkaunawa na narating ng mga taga-Corinto, nang hindi ipinapalagay na lubos na ang kanilang pagkaunawa.
- source_word: ἀπὸ μέρους
  choice: nang bahagya
  rationale: Natural itong nagpapahayag na hindi ganap ang kanilang pagkilala, habang nananatiling bukas ang eksaktong antas nito.
- source_word: καύχημα
  choice: maipagmamalaki
  rationale: Pinananatili nito ang retorika ni Pablo tungkol sa kapwa nilang maipagmamalaki, ngunit mas natural kaysa sa pangngalang “pagmamalaki” sa pangungusap na Filipino.
- source_word: καθάπερ
  choice: kung paanong
  rationale: Malinaw nitong pinananatili ang tahasang paghahambing at pagtutumbasan sa pagitan ni Pablo at ng mga taga-Corinto.
- source_word: ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: sa araw ng ating Panginoong Jesus
  rationale: Pinananatili nito ang kinikilalang eskatolohikal na parirala at natural na anyo ng Tagalog.
- source_word: κύριος
  choice: Panginoon
  rationale: Angkop ito bilang karaniwang salin ng kristolohikal na titulong κύριος.
- source_word: καθὼς καὶ
  choice: kung paanong ... rin
  rationale: Iniuugnay nito ang talata sa naunang pahayag at pinananatili ang pandagdag na diin ng καί sa natural na ayos ng Tagalog.
theological_decisions:
- issue: Ang magkatumbas na paggamit ni Pablo ng καύχημα
  choice: kami ang maipagmamalaki ninyo, kung paanong kayo rin ang maipagmamalaki namin
  alternative: kami ang dahilan ng inyong pagmamalaki, kung paanong kayo naman ang dahilan ng aming pagmamalaki
  rationale: Pinananatili ng salin ang kapwa at eskatolohikal na pagmamalaki o pagdiriwang ng apostol at ng iglesya, nang hindi ito pinapakinis tungo sa isang mas mahinang pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ating” para sa inclusive na ἡμῶν sa pariralang tumutukoy sa Panginoon ng nagsasalita at ng mga mambabasa. Ang gitling ay tumutulong na ipakita na ang kasunod na sugnay ang nilalaman ng kanilang bahagyang pagkilala.
