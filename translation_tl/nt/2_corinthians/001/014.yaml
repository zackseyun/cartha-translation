  source_fidelity: 'Ang pangunahing diwa at lahat ng mahahalagang elemento ng Griyego ay nasa salin: bahagyang pagkaunawa, magkatumbas na καύχημα, at ang eskatolohikal na araw ng Panginoong Jesus. Gayunman, ang “nakilala rin ninyo kami nang bahagya” ay mas madaling mangahulugang limitado lamang ang antas ng pagkakilala nila kay Pablo at sa mga kasama niya, samantalang ang ἀπὸ μέρους ay tumutukoy sa hindi ganap na pagkaunawa. Mas tumpak ang “bahagya ninyo kaming naunawaan.”'
