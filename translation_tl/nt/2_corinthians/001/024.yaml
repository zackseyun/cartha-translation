id: 2CO.1.24
reference: 2 Corinthians 1:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐχ ὅτι κυριεύομεν ὑμῶν τῆς πίστεως, ἀλλὰ συνεργοί ἐσμεν τῆς χαρᾶς ὑμῶν, τῇ γὰρ πίστει ἑστήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/024.yaml
  text: Not that we lord it over your faith[a], but we are fellow workers for your joy[c][b], for you stand firm by faith.
translation:
  language: tl
  text: Hindi naman namin pinaghaharian ang inyong pananampalataya[a]. Sa halip, mga kamanggagawa kami para sa inyong kagalakan[b], sapagkat naninindigan kayong matatag sa pamamagitan ng pananampalataya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inyong pagtitiwala.”
    reason: lexical_alternative
  - marker: b
    text: O “mga katuwang para sa inyong kagalakan.”
    reason: lexical_alternative
  - marker: c
    text: O “sapagkat naninindigan kayong matatag sa pananampalataya.”
    reason: alternative_reading
lexical_decisions:
- source_word: κυριεύομεν
  choice: pinaghaharian
  rationale: Ipinahihiwatig ng pandiwa ang paggamit ng kapangyarihan o paghahari sa iba. Likas sa Filipino ang “pinaghaharian” at pinananatili nito ang negatibong diwa ng mapangibabaw na pamumuno.
- source_word: ὑμῶν τῆς πίστεως
  choice: ang inyong pananampalataya
  rationale: Ang konstruksiyong genitive ay likas na naipahahayag bilang “inyong pananampalataya.” Pinananatili ng “pananampalataya” ang karaniwang kahulugan ng πίστις dito, habang inilalagay sa talababa ang posibleng “pagtitiwala.”
- source_word: συνεργοί
  choice: mga kamanggagawa
  rationale: Ipinapahayag ng salita ang sama-samang paggawa, bilang pagsalungat sa paghahari sa mga taga-Corinto. Ang “mga kamanggagawa” ay malinaw, marangal, at malapit sa anyo ng Griyego.
- source_word: τῆς χαρᾶς ὑμῶν
  choice: para sa inyong kagalakan
  rationale: Bagaman genitive ang anyo, ipinahihiwatig sa konteksto na gumagawa sila tungo sa kagalakan ng mga taga-Corinto. Likas na naipapahayag sa Filipino ang layuning ito sa “para sa inyong kagalakan.”
- source_word: τῇ γὰρ πίστει
  choice: sa pamamagitan ng pananampalataya
  rationale: Binabasa ang dative bilang paraan o batayan ng kanilang matatag na kalagayan. Malinaw na ipinahahayag ng “sa pamamagitan ng” ang kahulugang ito nang hindi itinatanggi ang posibleng pagbasa na “sa pananampalataya.”
- source_word: ἑστήκατε
  choice: naninindigan kayong matatag
  rationale: Ang perfect form ay nagsasaad ng nakamit at nagpapatuloy na matatag na kalagayan. Likas na ipinahahayag ito ng “naninindigan kayong matatag” kaysa sa payak na “nakatayo.”
theological_decisions:
- issue: Kahulugan ng πίστις sa dalawang paglitaw nito
  choice: pananampalataya
  alternative: pagtitiwala
  rationale: Tumutukoy ang konteksto sa pananalig ng mga taga-Corinto, hindi sa katapatan ni Cristo o sa isang natatanging doktrinal na kahulugan. Gayunman, tunay na saklaw ng πίστις ang “pagtitiwala,” kaya pinananatili iyon sa talababa.
- issue: Gamit ng dative sa τῇ πίστει
  choice: sa pamamagitan ng pananampalataya
  alternative: sa pananampalataya
  rationale: Maaaring ipahiwatig ng dative ang paraan o batayan (“sa pamamagitan ng”), ngunit posible ring unawain bilang kalagayan o larangan (“sa”). Pinili sa pangunahing teksto ang una at pinanatili sa talababa ang ikalawa.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinili ang “pinaghaharian” upang maipakita ang mapangibabaw na awtoridad na itinatanggi ni Pablo; ang “kamanggagawa” at “kagalakan” naman ay malinaw sa karaniwang mambabasa nang hindi nagiging labis na impormal. Hinati sa dalawang pangungusap upang maging natural at madaling basahin habang pinananatili ang lohikal na pagsalungat ng Griyego.
