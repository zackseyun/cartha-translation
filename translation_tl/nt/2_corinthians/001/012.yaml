language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἡ γὰρ καύχησις ἡμῶν αὕτη ἐστίν, τὸ μαρτύριον τῆς συνειδήσεως ἡμῶν, ὅτι ἐν ⸀ἁγιότητι καὶ εἰλικρινείᾳ ⸀τοῦ θεοῦ, ⸀οὐκ ἐν σοφίᾳ σαρκικῇ ἀλλ’ ἐν χάριτι θεοῦ, ἀνεστράφημεν ἐν τῷ κόσμῳ, περισσοτέρως δὲ πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/012.yaml
  text: 'For this is our boast: the testimony of our conscience[a], that we conducted ourselves in the world in holiness and sincerity of God[c][b], not in fleshly wisdom but in the grace of God—and especially toward you.'
translation:
  language: tl
  text: 'Sapagkat ito ang aming ipinagmamalaki: pinatototohanan ng aming budhi na namuhay kami sa sanlibutan nang may kabanalan[a] at katapatang mula sa Diyos[b], hindi ayon sa karunungang makalaman[c] kundi ayon sa biyaya ng Diyos—at lalo na sa pakikitungo namin sa inyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang manuskrito na bumabasa ng “kapayakan” sa halip na “kabanalan.”
    reason: textual_variant
  - marker: b
    text: Maaari ring “katapatang maka-Diyos.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “karunungang pantao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καύχησις
  choice: ipinagmamalaki
  rationale: Natural na Filipino para sa positibong pagmamapuri ni Pablo, nang hindi ipinahihiwatig na hamak na kayabangan lamang.
- source_word: μαρτύριον τῆς συνειδήσεως ἡμῶν
  choice: pinatototohanan ng aming budhi
  rationale: Ginawang likas na pandiwang parirala sa Filipino habang pinananatili ang budhi bilang panloob na saksi.
- source_word: ἁγιότητι
  choice: kabanalan
  rationale: Tuwirang pinananatili ang moral at panrelihiyong lakas ng pagbasa sa SBLGNT.
- source_word: εἰλικρινείᾳ τοῦ θεοῦ
  choice: katapatang mula sa Diyos
  rationale: Ipinakikita ang Diyos bilang pinagmumulan ng εἰλικρίνεια habang inilalagay sa talababa ang posibleng pagbasa bilang katangiang maka-Diyos.
- source_word: σοφίᾳ σαρκικῇ
  choice: karunungang makalaman
  rationale: Pinananatili ang ugnayan sa salitang-ugat na σάρξ at ang kaibahan nito sa biyaya ng Diyos.
- source_word: χάριτι θεοῦ
  choice: biyaya ng Diyos
  rationale: Karaniwan, malinaw, at may angkop na teolohikal na bigat sa gamit ni Pablo.
- source_word: ἀνεστράφημεν ἐν τῷ κόσμῳ
  choice: namuhay kami sa sanlibutan
  rationale: Likas na Filipino para sa pagkilos o asal sa kabuuan ng pamumuhay.
- source_word: περισσοτέρως δὲ πρὸς ὑμᾶς
  choice: at lalo na sa pakikitungo namin sa inyo
  rationale: Nililinaw sa natural na Filipino ang paghahambing at relasyonal na diwa ng πρὸς ὑμᾶς.
theological_decisions:
- issue: Diwa ng τοῦ θεοῦ sa εἰλικρινείᾳ τοῦ θεοῦ
  choice: katapatang mula sa Diyos
  alternative: katapatang maka-Diyos; katapatan ng Diyos
  rationale: Maaaring tumukoy ang henitibo sa pinagmulan o katangian. Pinili sa teksto ang pinagmulan, ngunit pinananatili sa talababa ang tunay na alternatibong pagkaunawa bilang katangiang maka-Diyos.
- issue: Diwa ng σαρκικῇ
  choice: makalaman
  alternative: pantao
  rationale: Pinananatili ng “makalaman” ang mahalagang bokabularyo ni Pablo at hindi pinahihina ang pagsalungat sa biyaya ng Diyos; ibinibigay ang “pantao” bilang leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “budhi,” “sanlibutan,” “makalaman,” at “biyaya” bilang pamilyar na bokabularyong biblikal; iniwasan ang labis na literal na ayos na magiging malamya sa Filipino.
