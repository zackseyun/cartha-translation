    rationale: 'Ang Griyegong δύνασθαι ay nagpapahayag ng kakayahan, at ang παρακαλεῖν ay transitive dito: ang layunin ay magkaroon tayo ng kakayahang aliwin ang iba. Ang “maaliw natin” ay maaaring malabo o hindi likas sa kahulugang ito.'
  - severity: low
    issue: Hindi ganap na nasasaklaw ng talababa ang paulit-ulit na alternatibong pamilya ng salita.
    rationale: May ilang anyo ng παρακαλέω/παράκλησις sa talata; mas malinaw na ilahad ang “nagpapalakas ... palakasin ... pagpapalakas” upang makita ang ugnayan.
