  text: ὁ παρακαλῶν ἡμᾶς ἐπὶ πάσῃ τῇ θλίψει ἡμῶν, εἰς τὸ δύνασθαι ἡμᾶς παρακαλεῖν τοὺς ἐν πάσῃ θλίψει διὰ τῆς παρακλήσεως ἧς παρακαλούμεθα αὐτοὶ ὑπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/004.yaml
  text: who comforts us in all our affliction[a], so that we may be able to comfort those in any affliction through the comfort with which we ourselves are comforted by God.
translation:
  language: tl
  text: na umaaliw sa atin sa lahat ng ating paghihirap,[a] upang magawa rin nating aliwin ang mga dumaranas ng anumang paghihirap sa pamamagitan ng kaaliwang tinatanggap namin mismo mula sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpapalakas … palakasin … pagpapalakas”; iisang pamilya ng salita ang paulit-ulit na ginamit sa Griyego sa buong talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ παρακαλῶν
  choice: na umaaliw
  rationale: Sa konteksto ng θλῖψις, ipinahahayag ng “umaaliw” ang pagpapalakas at pagdamay sa gitna ng pagdurusa, hindi lamang pagpapagaan ng damdamin.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: sa lahat ng ating paghihirap
  rationale: Ang “paghihirap” ay natural sa modernong Tagalog at sapat ang bigat upang katawanin ang pagdurusa, kagipitan, o matinding pasaning saklaw ng θλῖψις.
- source_word: εἰς τὸ δύνασθαι ἡμᾶς
  choice: upang ... din natin
  rationale: Ang “upang” ay malinaw na naghahayag ng layunin o bunga; ipinahihiwatig na ng natural na parirala ang kakayahang ibinibigay ng pagtanggap ng kaaliwan.
- source_word: παρακαλεῖν
  choice: maaliw
  rationale: Ginamit ang parehong salitang-ugat na “aliw” upang mapanatili ang kapansin-pansing pag-uulit ng παρακαλέω/παράκλησις sa Griyego.
- source_word: τοὺς ἐν πάσῃ θλίψει
  choice: ang mga dumaranas ng anumang paghihirap
  rationale: 'Ipinakikita ng “anumang paghihirap” ang malawak at distributibong saklaw: sinumang nasa alinmang uri ng paghihirap.'
- source_word: διὰ τῆς παρακλήσεως
  choice: sa pamamagitan ng kaaliwan
  rationale: Pinananatili ng “kaaliwan” ang ugnayang leksikal sa “umaaliw” at “maaliw,” habang natural na inilalarawan ang paraang ginagamit sa pag-aliw sa iba.
- source_word: ἧς παρακαλούμεθα αὐτοὶ
  choice: tinatanggap natin mismo
  rationale: Ang aktibong natural na pahayag sa Tagalog ay nagpapanatili sa diwang pasibo ng pagtanggap at sa diin ng αὐτοὶ sa pamamagitan ng “mismo.”
- source_word: ὑπὸ τοῦ θεοῦ
  choice: mula sa Diyos
  rationale: Bagaman personal na tagaganap ang Diyos sa Griyegong balangkas na pasibo, ang “kaaliwang tinatanggap ... mula sa Diyos” ang mas likas na Tagalog at malinaw pa ring kinikilala ang Diyos bilang pinagmumulan at tagapagbigay.
theological_decisions:
- issue: Saklaw ng kahulugan ng παρακαλέω / παράκλησις
  choice: aliw / umaaliw / maaliw / kaaliwan
  alternative: palakas / nagpapalakas / mapalakas; o pag-encourage / encouragement
  rationale: Dahil nakapaloob ang talata sa paghihirap, pangunahing diwa ang mapagpalakas na kaaliwan. Pinananatili rin ng iisang salitang-ugat ang retorikal at teolohikal na ugnayan ng pagtanggap ng kaaliwan mula sa Diyos at pagbabahagi nito sa iba.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang paulit-ulit na salitang-ugat na “aliw” hangga't likas sa Tagalog, at iniwasan ang makaluma o labis na teknikal na pananalita.
