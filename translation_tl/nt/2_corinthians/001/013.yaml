  to: Sapagkat wala kaming ibang isinusulat sa inyo kundi ang binabasa ninyo at nauunawaan din ninyo; at umaasa akong lubos ninyo itong mauunawaan hanggang sa wakas,[a]
  rationale: Pinalitan ang «nababasa ninyo» ng «binabasa ninyo» upang malinaw na maipahayag ang kasalukuyang kilos ng ἀναγινώσκετε. Pinanatili ang «at nauunawaan din ninyo» para sa καὶ ἐπιγινώσκετε, at ang «hanggang sa wakas» kasama ng talababa upang hindi pagpasiyahan sa teksto ang pinagtatalunang saklaw ng ἕως τέλους. Ginamit ang tuldok-kuwit upang maging likas ang Tagalog habang pinananatiling bukas ang pangungusap para sa kasunod na talata.
