  text: οὐ γὰρ ἄλλα γράφομεν ὑμῖν ἀλλ’ ἢ ἃ ἀναγινώσκετε ἢ καὶ ἐπιγινώσκετε, ἐλπίζω δὲ ⸀ὅτι ἕως τέλους ἐπιγνώσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/013.yaml
  text: For we are not writing anything else to you except what you read and indeed understand[a], and I hope that you will understand fully to the end,
translation:
  language: tl
  text: Sapagkat wala kaming ibang isinusulat sa inyo kundi ang binabasa ninyo at nauunawaan din ninyo; at umaasa akong lubos ninyo itong mauunawaan hanggang sa wakas,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “At umaasa akong mauunawaan ninyo ito nang lubusan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: ibang
  rationale: Kasunod ng pagtanggi at ng pandiwang tumutukoy sa pagsusulat, likas sa Tagalog ang “wala kaming ibang isinusulat,” na pinananatili ang diwang walang ibang nakatagong mensahe.
- source_word: ἀναγινώσκετε
  choice: nababasa ninyo
  rationale: Ipinahahayag nito ang payak na gawain ng pagbasa sa liham sa natural na modernong Tagalog.
- source_word: ἐπιγινώσκετε
  choice: nauunawaan din
  rationale: Sa konteksto, umuusad ang diwa mula sa pagbasa tungo sa pag-unawa; ang “din” ay kumakatawan sa καί nang hindi labis na pinatitindi ito.
- source_word: ἐπιγνώσεσθε
  choice: lubos ninyo itong mauunawaan
  rationale: Pinananatili ng “mauunawaan” ang kaugnayan sa naunang ἐπιγινώσκετε, habang ipinahihiwatig ng “lubos” ang mas ganap na pagkaunawa.
- source_word: ἕως τέλους
  choice: hanggang sa wakas
  rationale: Tuwirang pinananatili ang temporal na anyo ng Griyego at ang maaaring sinasadyang tensiyon sa pagitan ng pagtitiyaga hanggang wakas at ganap na pagkaunawa.
- source_word: οὐ γὰρ ... ἀλλ’ ἢ
  choice: Sapagkat wala ... kundi
  rationale: Ang karaniwang Tagalog na “wala ... kundi” ay malinaw na naghahayag ng eksklusibong pagtanggi ng kayariang Griyego.
theological_decisions:
- issue: Kahulugan ng ἕως τέλους
  choice: hanggang sa wakas
  alternative: nang lubusan
  rationale: Hindi tiyak kung pangunahing temporal o tumutukoy sa ganap na antas ang parirala. Pinanatili sa teksto ang mas pormal na temporal na kahulugan, at ibinigay sa talababa ang posibleng idiomatikong kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kaming” dahil si Pablo ay nagsasalita sa unang panauhang maramihan at hindi kabilang ang mga taga-Corinto sa pangkat na sumusulat. Pinanatili ang bantas na kuwit sa dulo upang umayon sa pagpapatuloy ng pangungusap sa susunod na talata.
