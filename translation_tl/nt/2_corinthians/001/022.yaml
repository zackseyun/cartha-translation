  yaml_path: translation/nt/2_corinthians/001/022.yaml
  text: who also sealed us and gave the down payment of the Spirit in our hearts.
translation:
  language: tl
  text: na siya ring naglagay ng tatak sa atin at nagbigay ng paunang bayad[a] ng Espiritu sa ating mga puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “deposito” o “garantiya” ng Espiritu.
    reason: lexical_alternative
lexical_decisions:
- source_word: σφραγισάμενος
  choice: naglagay ng tatak sa atin
  rationale: Pinananatili nito ang larawan ng pagtatatak bilang tanda ng pag-aari, pagpapatunay, o katiyakan, habang mas natural sa modernong Tagalog kaysa sa payak na “nagtatak sa atin.”
- source_word: δοὺς
  choice: nagbigay
  rationale: Isinalin ang aorist participle bilang pandiwang kapantay ng naunang kilos upang maging natural ang pagkakaugnay ng “naglagay” at “nagbigay.”
- source_word: ἀρραβῶνα
  choice: paunang bayad
  rationale: Tumutukoy ang salita sa unang bahagi ng bayad na nagsisilbing katiyakan na ibibigay ang kabuuan. Pinananatili ng “paunang bayad” ang kongkretong larawang pangkalakalan.
- source_word: τοῦ πνεύματος
  choice: ng Espiritu
  rationale: Pinananatili ang maikli at posibleng maraming pakahulugang genitive ng Griyego, nang hindi tahasang nagpapasya kung ang Espiritu ang mismong paunang bayad o ang pinagmumulan nito.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: sa ating mga puso
  rationale: Natural na ipinahahayag nito ang panloob at personal na kinaroroonan ng kaloob, ayon sa ἐν na may dative.
- source_word: ὁ καὶ ... καὶ
  choice: na siya ring ... at
  rationale: Ikinakabit nito ang talata sa Diyos na tinutukoy sa naunang pangungusap at pinananatili ang magkahanay na dalawang kilos.
theological_decisions:
- issue: Kahulugan ng Espiritu bilang ἀρραβών
  choice: paunang bayad ng Espiritu
  alternative: deposito ng Espiritu; garantiyang ibinigay sa pamamagitan ng Espiritu
  rationale: Pinananatili ang metaporang pangkalakalan at ang siksik na pagkakaugnay ng ἀρραβών at τοῦ πνεύματος, sa halip na gawing tahasang paliwanag ang isang posibleng teolohikal na pagbasa.
- issue: Larawan ng pagtatak
  choice: naglagay ng tatak sa atin
  alternative: tinatakan tayo; naglagay ng kanyang tatak sa atin
  rationale: Pinananatili ang metapora nang hindi idinaragdag sa pangunahing teksto ang salitang “kanyang,” na nauunawaan sa konteksto ngunit hindi hayag sa parirala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “paunang bayad” dahil karaniwan at konkreto ito; iniwasan ang sobrang pagpapaliwanag sa pangunahing teksto. Ang pambungad na “na” ay sadyang nag-uugnay sa talatang nauna.
