    rationale: Ang Griyego ay πρὸς δόξαν δι’ ἡμῶν (“para/tungo sa kaluwalhatian sa pamamagitan namin”). Sa draft, ang “sa pamamagitan namin” ay nauuna at mas madaling ikabit sa “inihahayag.” Ang paglalagay nito pagkatapos ng “para sa kaluwalhatian” ay mas malapit sa saklaw at ayos ng pinagmulan.
