  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅσαι γὰρ ἐπαγγελίαι θεοῦ, ἐν αὐτῷ τὸ Ναί· ⸀διὸ καὶ ⸂δι’ αὐτοῦ⸃ τὸ Ἀμὴν τῷ θεῷ πρὸς δόξαν δι’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/020.yaml
  text: For however many promises of God there are[a], in him is the Yes[c][b]. Therefore also through him is the Amen to God for glory through us.
translation:
  language: tl
  text: Sapagkat gaano man karami ang mga pangako ng Diyos, nasa kanya ang “Oo.”[a] Kaya sa pamamagitan din niya, ang “Amen”[b] ay inihahayag sa Diyos para sa kaluwalhatian sa pamamagitan namin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas tahasan, “sa kanya nagkakaroon ng kanilang ‘Oo’ ang mga ito.”
    reason: alternative_reading
  - marker: b
    text: Ang “Amen” ay isang pahayag ng pagpapatibay na nangangahulugang “tunay nga” o “mangyari nawa.”
    reason: cultural_note
  - marker: c
    text: Maaari ring unawain, “para sa kaluwalhatian ng Diyos sa pamamagitan namin.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσαι
  choice: gaano man karami
  rationale: Ipinahahayag nito ang kabuuan ng lahat ng pangako ng Diyos nang hindi ginagawang tiyak ang bilang.
- source_word: ἐπαγγελίαι θεοῦ
  choice: mga pangako ng Diyos
  rationale: Likas at malinaw na Tagalog ito para sa mga pangakong nagmumula at nauukol sa Diyos.
- source_word: ἐν αὐτῷ
  choice: nasa kanya
  rationale: Pinananatili ang maikli at nakasentro kay Cristo na pananalita ni Pablo, sa halip na tahasang idagdag na ang mga pangako ay ‘natutupad’ sa kanya.
- source_word: τὸ Ναί
  choice: ang “Oo”
  rationale: Pinananatili ang mariin at pangngalang gamit ng tugon, na kahilera ng ‘Amen’ sa kasunod na sugnay.
- source_word: δι’ αὐτοῦ
  choice: sa pamamagitan din niya
  rationale: Ipinapakita ang pamamagitan ni Cristo at pinananatili ang diwa ng διά na may genitive.
- source_word: τὸ Ἀμὴν
  choice: ang “Amen”
  rationale: Ang ‘Amen’ ay nakaugaliang salitang panrelihiyon sa Filipino at pinananatili ang pagkakahilera nito sa ‘Oo.’
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Ipinakikita ang Diyos bilang pinatutungkulan ng ‘Amen.’
- source_word: πρὸς δόξαν
  choice: para sa kaluwalhatian
  rationale: Pinananatili ang maikling pahayag ng layunin nang hindi tahasang tinutukoy sa pangunahing teksto kung kaninong kaluwalhatian.
- source_word: δι’ ἡμῶν
  choice: sa pamamagitan namin
  rationale: Pinananatili ang malawak na diwa ng pakikibahagi nina Pablo nang hindi idinaragdag ang salitang ‘ministeryo.’
theological_decisions:
- issue: Kung tahasang sasabihing natutupad kay Cristo ang lahat ng pangako
  choice: Pinanatili ang siksik na pahayag na ‘nasa kanya ang “Oo,”’
  alternative: ‘sa kanya natutupad ang lahat ng pangako ng Diyos’ o ‘sa kanya nagkakaroon ng kanilang Oo ang mga ito’
  rationale: Ipinahihiwatig ng talata ang katuparan kay Cristo, ngunit hindi ito tahasang ipinapahayag ng anyong Griyego; pinananatili rito ang retorikal at teolohikal na tensiyon.
- issue: Kung kaninong kaluwalhatian ang tinutukoy ng πρὸς δόξαν
  choice: ‘para sa kaluwalhatian’ sa pangunahing teksto
  alternative: ‘para sa kaluwalhatian ng Diyos’
  rationale: Malakas ang kontekstuwal na ugnay sa kaluwalhatian ng Diyos, ngunit walang tahasang genitive na ‘ng Diyos’ sa parirala kaya hindi ito isinara sa pangunahing teksto.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang magkatapat na “Oo” at “Amen,” gayundin ang siksik na pahayag ng Griyego. Ginamit ang “inihahayag” bilang kaunting paglilinaw na kailangan upang maging ganap at natural ang ikalawang pangungusap sa Tagalog, nang hindi tinutukoy kung ito ay panalangin, liturhiya, o pangangaral.
