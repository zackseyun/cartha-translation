  to: Sapagkat gaano man karami ang mga pangako ng Diyos, nasa kanya ang “Oo.”[a] Kaya sa pamamagitan din niya, ang “Amen”[b] ay inihahayag sa Diyos para sa kaluwalhatian sa pamamagitan namin.[c]
  rationale: Inayos ang posisyon ng “sa pamamagitan namin” upang mas malinaw na sundin ang πρὸς δόξαν δι’ ἡμῶν at maiwasang magmukhang ang pariralang ito ay pangunahing naglalarawan lamang sa “inihahayag.” Walang idinagdag na tahasang pahayag tungkol sa katuparan ng mga pangako, at pinanatili ang hindi ganap na tinukoy na “kaluwalhatian” sa pangunahing teksto.
