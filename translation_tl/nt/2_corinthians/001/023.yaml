  naturalness: Likas at marangal ang pangunahing pahayag. Ang “upang hindi ko kayo mabigatan” ay mas natural na modernong Filipino at mas malapit sa sinadyang pagpapaumanhin na nasa konteksto.
  terminology: Ang “tinatawag kong saksi ang Diyos” ay angkop para sa μάρτυρα τὸν θεὸν ἐπικαλοῦμαι. Ang “buhay ko ang nakataya” ay isang malinaw na idiomatikong paraan upang ipahayag ang pananagutang nakapaloob sa ἐπὶ τὴν ἐμὴν ψυχήν; pinananatili ng talababa ang literal na anyo.
