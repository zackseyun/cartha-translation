base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/023.yaml
  text: But I call God as witness upon my own life[b][a], that to spare you I did not come again to Corinth.
translation:
  language: tl
  text: Ngunit tinatawag kong saksi ang Diyos—buhay ko ang nakataya[a]—na hindi ako muling pumunta[b] sa Corinto upang hindi ko kayo mabigatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “laban sa aking sarili”; sa mas literal na salin, “sa aking kaluluwa.”
    reason: lexical_alternative
  - marker: b
    text: O “hindi na ako pumunta sa Corinto.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng “Ngunit” ang banayad na pagsalungat ng δέ; ang diin ng tahasang ἐγώ ay likas nang naipapahayag sa unang panauhang pandiwa sa kasunod na parirala.
- source_word: μάρτυρα τὸν θεὸν ἐπικαλοῦμαι
  choice: tinatawag kong saksi ang Diyos
  rationale: Likas at marangal na salin ng pormal at taimtim na panawagan kay God bilang saksi sa katotohanan ng pahayag ni Pablo.
- source_word: ἐπὶ τὴν ἐμὴν ψυχήν
  choice: buhay ko ang nakataya[a]
  rationale: Inihahatid nito sa makabagong Tagalog ang diwa ng panunumpang si Pablo mismo ang mananagot kung hindi totoo ang sinasabi niya, habang inilalagay sa talababa ang mas literal at alternatibong anyo.
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala rito ng ὅτι ang nilalaman ng taimtim na panawagan, hindi isang hiwalay na sugnay na nagsasaad ng dahilan.
- source_word: φειδόμενος ὑμῶν
  choice: upang hindi ko kayo pahirapan
  rationale: Natural itong nagpapahayag sa Tagalog ng layuning ‘iligtas’ o ‘huwag munang dumanas’ ang mga taga-Corinto ng masakit na pakikitungo; hindi nito tinutukoy kung anong tiyak na kaparusahan o pagtutuwid ang sangkot.
- source_word: οὐκέτι ἦλθον
  choice: hindi ako muling pumunta[b]
  rationale: Sa konteksto ng ipinagpalibang pagdalaw, malinaw nitong ipinahahayag ang hindi pagtuloy sa panibagong pagpunta, habang kinikilala sa talababa ang posibleng diwang ‘hindi na.’
- source_word: εἰς Κόρινθον
  choice: sa Corinto
  rationale: Karaniwang paraan sa Tagalog ng pagpapahayag ng patungong kilos tungo sa isang lungsod.
theological_decisions:
- issue: Lakas at pananagutan ng panawagan sa Diyos bilang saksi
  choice: Pinanatili ang pormulang panunumpa at ang personal na pananagutan ni Pablo sa pariralang “buhay ko ang nakataya.”
  alternative: Gawing karaniwang pagbibigay-diin lamang, gaya ng “Alam ng Diyos na totoo ito.”
  rationale: Ang Griyego ay isang taimtim na panawagan sa Diyos bilang saksi at may pahiwatig na si Pablo ang mananagot; hindi dapat pahinain ang bigat nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang gitling-pahaba upang maipakita ang bigat ng paningit na pormula ng pananagutan nang hindi nagiging artipisyal o labis na literal.
