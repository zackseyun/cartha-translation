base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/018.yaml
  text: As surely as God is faithful[b][a], our message to you is not “Yes and No.”
translation:
  language: tl
  text: Ngunit, kung paanong tapat ang Diyos, gayon katiyak na ang mensahe namin sa inyo ay hindi “Oo at Hindi.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “Ngunit tapat ang Diyos: ang salita namin sa inyo ay hindi oo at hindi.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “mensahe” ay maaari ding isaling “salita” o “pananalita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: tapat
  rationale: Likas at marangal na salin para sa pagiging maaasahan ng Diyos; sa konteksto, ang katapatan ng Diyos ang batayan ng katiyakan ng pahayag ni Pablo.
- source_word: δὲ
  choice: kung paanong
  rationale: Sa pariralang πιστὸς δὲ ὁ θεὸς ὅτι, ang δέ ay bahagi ng mariing pagpapatunay sa halip na simpleng pagsalungat. Ang “kung paanong” ay naghahatid ng panunumpang diin sa natural na Tagalog.
- source_word: ὁ θεός
  choice: ang Diyos
  rationale: Tuwirang salin ng simuno.
- source_word: ὅτι
  choice: ipinahayag sa ugnayang “kung paanong …”
  rationale: Ikinakabit nito ang katapatan ng Diyos sa kasunod na pagtiyak. Hindi malinaw sa Tagalog ang literal na “tapat ang Diyos na,” kaya ipinahahayag ang buong konstruksiyon nang natural habang pinananatili ang ugnayan.
- source_word: λόγος
  choice: mensahe
  rationale: Dito ay tumutukoy sa ipinahayag ni Pablo at ng kaniyang mga kasama sa mga taga-Corinto. Mas malinaw sa kasalukuyang Tagalog kaysa sa literal na “salita,” ngunit itinatala ang alternatibo sa talababa.
- source_word: ἡμῶν
  choice: namin
  rationale: Eksklusibong anyo ang angkop sapagkat tumutukoy kay Pablo at sa kaniyang mga kasama, hindi kasama ang mga kausap na taga-Corinto.
- source_word: ὁ πρὸς ὑμᾶς
  choice: sa inyo
  rationale: Maikli at natural na pagtukoy sa mensaheng ipinarating sa mga taga-Corinto.
- source_word: οὐκ ἔστιν
  choice: ay hindi
  rationale: Pinananatili ang pangkasalukuyang anyo at ang patuloy na katangian ng pahayag.
- source_word: Ναὶ καὶ Οὔ
  choice: “Oo at Hindi”
  rationale: Pinananatili ang matalim at tila kasabihang pares na nagpapahiwatig ng salungatan o pabagu-bagong pananalita.
theological_decisions:
- issue: Pagpapahayag sa asseverative construction na πιστὸς δὲ ὁ θεὸς ὅτι
  choice: Kung paanong tapat ang Diyos, …
  alternative: 'Ngunit tapat ang Diyos: … / Tapat ang Diyos na …'
  rationale: Ipinahahayag nito ang taimtim na pagtiyak ni Pablo na nakasalig sa katapatan ng Diyos, nang hindi ginagawang sanhi ang kasunod na sugnay o gumagamit ng alanganing sintaks sa Tagalog. Isinasama sa talababa ang mas literal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “namin” upang malinaw na hindi kabilang ang mga kausap sa pangkat ni Pablo. Ang mga panipi at malaking unang titik sa “Oo at Hindi” ay nagpapakita sa pares bilang mariing pormulasyon. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
