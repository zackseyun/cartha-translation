source:
  edition: SBLGNT
  text: ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς τὸ ἀπόκριμα τοῦ θανάτου ἐσχήκαμεν, ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ τῷ ἐγείροντι τοὺς νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/009.yaml
  text: Indeed[a], we ourselves had the sentence of death within ourselves, so that we would not rely on ourselves but on God, who raises the dead.
translation:
  language: tl
  text: Ngunit kami mismo ay may hatol na kamatayan[a] sa aming kalooban, upang huwag kaming umasa sa aming sarili kundi sa Diyos na bumubuhay sa mga patay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hatol ng kamatayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Sa katunayan
  rationale: Nagbibigay ito ng mariing pagpapatibay at kasalungat na diin kaugnay ng naunang pahayag, nang natural sa modernong Tagalog.
- source_word: αὐτοὶ
  choice: kami mismo
  rationale: Pinananatili ang mariing gamit ng panghalip.
- source_word: ἐν ἑαυτοῖς
  choice: sa aming kalooban
  rationale: Ipinahahayag ang panloob at pansariling pagkabatid, hindi isang panlabas na opisyal na pasiya.
- source_word: τὸ ἀπόκριμα τοῦ θανάτου
  choice: ang hatol na kamatayan
  rationale: Ang ἀπόκριμα ay tumutukoy rito sa isang tiyak o hudisyal na pasiya; natural sa Tagalog ang 'hatol na kamatayan' at pinananatili nito ang bigat ng pahayag.
- source_word: ἐσχήκαμεν
  choice: ay nagkaroon
  rationale: Hindi idinaragdag ang ideyang 'tinanggap,' na hindi tahasang nasa pandiwa; ipinahihiwatig pa rin ang kalagayang nabuo mula sa nakaraang karanasan.
- source_word: ἵνα μὴ πεποιθότες ὦμεν
  choice: upang huwag kaming umasa
  rationale: Natural na inilalahad ang layunin at ang diwa ng matatag na pagtitiwala o pagsandig.
- source_word: ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ
  choice: sa aming sarili kundi sa Diyos
  rationale: Malinaw na pinananatili ang tuwirang paghahambing ng pag-asa sa sarili at pag-asa sa Diyos.
- source_word: τῷ ἐγείροντι τοὺς νεκρούς
  choice: na bumubuhay sa mga patay
  rationale: Ang 'bumubuhay sa mga patay' ay natural at malinaw na Tagalog para sa kapangyarihan ng Diyos na magbangon ng patay.
theological_decisions:
- issue: Kung ang τοὺς νεκρούς ay isasaling tradisyonal bilang 'mga patay' o mas tahasan bilang 'mga taong patay'
  choice: mga patay
  alternative: mga taong patay
  rationale: Tumpak at natural ang 'mga patay' at pinananatili nito ang malawak na pahiwatig ng kapangyarihan ng Diyos sa muling pagkabuhay nang walang dagdag na pagpapakahulugan.
- issue: Kung ang ἀπόκριμα τοῦ θανάτου ay isang pormal na sentensiya o panloob na katiyakan na mamamatay sila
  choice: hatol na kamatayan
  alternative: pasiyang kamatayan ang kahihinatnan
  rationale: Pinananatili ng 'hatol' ang malamang na mapagpasiyang o hudisyal na kulay ng ἀπόκριμα, habang ipinakikita ng 'sa aming kalooban' na ito ay kanilang sariling naranasang katiyakan, hindi kinakailangang hatol ng hukuman.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'kami' ayon sa eksklusibong konteksto ng apostolikong nagsasalita, at iniwasan ang labis na teknikal o denominasyonal na pananalita.
