  to: Ngunit kami mismo ay may hatol na kamatayan[a] sa aming kalooban, upang huwag kaming umasa sa aming sarili kundi sa Diyos na bumubuhay sa mga patay.
  rationale: Pinalitan ang pambungad upang maipakita ang panalungat na ἀλλά, inayos ang ayos ng mga salita para sa mas natural na modernong Tagalog, at ginawang tuwirang leksikal na alternatibo ang talababa. Pinananatili ng “sa aming kalooban” ang panloob na saklaw ng ἐν ἑαυτοῖς nang hindi ipinagpapalagay na ito ay pormal na pasiya ng hukuman.
