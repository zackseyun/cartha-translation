  source_fidelity: 'Ang pangunahing diwa ay tumpak: mariing tinutukoy ang mga nagsasalita, ang hatol ng kamatayan na nasa kanilang kalooban, ang layuning huwag umasa sa sarili, at ang Diyos na bumubuhay sa mga patay. Gayunman, ang ἀλλά ay malinaw na pangatnig na panalungat sa konteksto at mas dapat isalin bilang “Ngunit” kaysa “Sa katunayan.”'
  naturalness: Natural ang karamihan ng pangungusap, ngunit mas malinaw at mas maayos ang “may hatol na kamatayan sa aming kalooban” kaysa “nagkaroon sa aming kalooban ng hatol na kamatayan.”
  terminology: Ang “hatol na kamatayan,” “umasa,” “Diyos,” at “mga patay” ay angkop at hindi nagdaragdag ng denominasyonal na pagbasa. Ang kasalukuyang talababa ay hindi isang tuwirang leksikal na alternatibo at binabago ang parirala tungo sa isang buong pagpapaliwanag ng kahihinatnan.
