id: 2CO.1.19
reference: 2 Corinthians 1:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ θεοῦ γὰρ⸃ υἱὸς ⸂Ἰησοῦς Χριστὸς⸃ ὁ ἐν ὑμῖν δι’ ἡμῶν κηρυχθείς, δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου, οὐκ ἐγένετο Ναὶ καὶ Οὒ, ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/019.yaml
  text: For the Son of God[a], Jesus the Messiah, who was proclaimed among you through us—through me and Silvanus and Timothy—did not become Yes and No; rather[d][c][b], in him it has become Yes.
translation:
  language: tl
  text: Sapagkat ang Anak ng Diyos, si Jesu-Cristo[a], na ipinahayag[b] sa inyo sa pamamagitan namin—sa pamamagitan ko, ni Silvano, at ni Timoteo—ay hindi naging “Oo” at “Hindi”; sa halip, sa kanya ay naging “Oo”[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “si Jesus na Mesiyas.”
    reason: lexical_alternative
  - marker: b
    text: O “ipinangaral.”
    reason: lexical_alternative
  - marker: c
    text: O “ay hindi ‘Oo’ at ‘Hindi’ ... kundi sa kanya ay nanatiling ‘Oo.’”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ τοῦ θεοῦ υἱός
  choice: ang Anak ng Diyos
  rationale: Pinananatili ang buong titulong kristolohikal at ginagamit ang likas na ayos ng mga salita sa Filipino.
- source_word: Ἰησοῦς Χριστός
  choice: si Jesu-Cristo
  rationale: Sa pagkakagamit dito, ang magkatambal na pangalan ay gumaganap bilang nakaugaliang personal na katawagan; kaya natural sa modernong Filipino ang “Jesu-Cristo,” habang inilalagay sa talababa ang mas tahasang titulong “Jesus na Mesiyas.”
- source_word: κηρυχθείς
  choice: ipinahayag
  rationale: Ipinahihiwatig nito ang hayagang pagpapahayag ng isang mensahe nang hindi nililimitahan ang salita sa pormal na pangangaral.
- source_word: δι’ ἡμῶν
  choice: sa pamamagitan namin
  rationale: Pinananatili ang diwa ng ahensiya o kasangkapan sa διά at inihahanda ang kasunod na pagbanggit sa tatlong tagapagpahayag.
- source_word: δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου
  choice: sa pamamagitan ko, ni Silvano, at ni Timoteo
  rationale: Tapat na pinananatili ang sariling pagtukoy ni Pablo at ang mga pangalan ng mga kamanggagawa niya, habang natural ang anyo sa Filipino.
- source_word: οὐκ ἐγένετο Ναὶ καὶ Οὔ
  choice: ay hindi naging “Oo” at “Hindi”
  rationale: Direktang inililipat ang retorikal na pagsalungat at ang pandiwang ἐγένετο, sa halip na ipaliwanag agad bilang pabago-bago o hindi mapagkakatiwalaan.
- source_word: ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν
  choice: sa halip, sa kanya ay naging “Oo”
  rationale: Pinananatili ang “sa kanya” at ang sadyang maigsi at bahagyang palaisipang pahayag ni Pablo. Ang “naging” ay nagpapakita ng naganap na kalagayang may nananatiling bisa, ayon sa saklaw ng perfect na γέγονεν.
theological_decisions:
- issue: Paglilipat sa Χριστός sa tambalang Ἰησοῦς Χριστός
  choice: Jesu-Cristo
  alternative: Jesus na Mesiyas
  rationale: Ang tambalan ay gumaganap dito na parang nakaugaliang personal na pangalan, kaya “Jesu-Cristo” ang pinakanatural at marangal sa Filipino. Gayunman, kinikilala sa talababa ang literal na titulong “Mesiyas” upang hindi mawala ang kabuluhan ng Χριστός.
- issue: Kung ipaliliwanag o pananatilihin ang “Oo” at “Hindi”
  choice: hindi naging “Oo” at “Hindi”; sa halip, sa kanya ay naging “Oo”
  alternative: hindi naging pabago-bago, kundi lubos na mapagkakatiwalaan
  rationale: Pinananatili ng pangunahing teksto ang retorika at teolohikal na tensiyon ng Griyego sa halip na palitan ito ng interpretatibong paliwanag.
- issue: Tinutukoy na simuno ng γέγονεν sa huling sugnay
  choice: Hindi nagdagdag ng tahasang simunong gaya ng “ang sagot” o “ang pangako”
  alternative: sa kanya, ang sagot ay naging “Oo”
  rationale: Walang tahasang pangngalang simuno sa Griyego. Ang hindi pagdaragdag nito ay nag-iingat sa tunay na kalabuan ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” upang ipakita ang ugnayang nagbibigay-katwiran sa naunang pahayag. Ang gitling-pahaba ay naghihiwalay sa paglilinaw tungkol kina Pablo, Silvano, at Timoteo. Sadyang pinanatili ang matalim na pagtutunggali ng “Oo” at “Hindi” at hindi ito pinalitan ng paliwanag.
