    issue: Ang “ayon sa kalooban ng Diyos” ay hindi gaanong malinaw na nagsasaad ng ahensiya o batayan ng διά θελήματος θεοῦ.
    rationale: Sa kontekstong ito, ang kalooban ng Diyos ang pinagmumulan/batayan ng pagkaapostol ni Pablo, hindi lamang pamantayang sinusunod niya.
  - severity: low
