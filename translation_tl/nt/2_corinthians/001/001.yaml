id: 2CO.1.1
reference: 2 Corinthians 1:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς τῇ ἐκκλησίᾳ τοῦ θεοῦ τῇ οὔσῃ ἐν Κορίνθῳ, σὺν τοῖς ἁγίοις πᾶσιν τοῖς οὖσιν ἐν ὅλῃ τῇ Ἀχαΐᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother, to the church of God that is in Corinth[b], together with all the saints who are in all Achaia:'
translation:
  language: tl
  text: 'Si Pablo, apostol ni Mesiyas na si Jesus[a] sa pamamagitan ng kalooban ng Diyos, at si Timoteo, ang ating kapatid, sa iglesya ng Diyos na nasa Corinto, kasama ang lahat ng mga banal na nasa buong Acaya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, Cristo Jesus.
    reason: Napananatili ang nakasanayang alternatibong salin ng titulong Mesiyas (Χριστός); hindi ito ibang pagbasa ng tekstong Griyego.
lexical_decisions:
- source_word: ἀπόστολος
  choice: apostol
  rationale: Ang “apostol” ang kinikilalang terminong Filipino para sa natatanging sugo at inatasang kinatawan ni Jesus; mas tiyak ito rito kaysa sa pangkalahatang “sugo.”
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesiyas Jesus
  rationale: May malinaw na puwersa ng titulo ang Χριστός sa pormulang ito; pinananatili ng “Mesiyas” ang kahulugang ‘pinahiran’ at ang kaugnayan nito sa mga pangako ng Diyos.
- source_word: διὰ θελήματος θεοῦ
  choice: ayon sa kalooban ng Diyos
  rationale: Sa pormula ng pagtatalaga kay Pablo, likas sa Tagalog ang “ayon sa kalooban” at malinaw nitong ipinahahayag na ang kanyang pagiging apostol ay nakabatay sa kalooban ng Diyos.
- source_word: ὁ ἀδελφὸς
  choice: ating kapatid
  rationale: Bagaman literal na “ang kapatid,” likas na ipinahihiwatig ng konteksto ang ugnayan sa pamayanan; ang “ating kapatid” ay malinaw at natural sa makabagong Tagalog.
- source_word: ἐκκλησίᾳ
  choice: iglesya
  rationale: Ang “iglesya” ay maikli, karaniwan, at angkop na katawagan sa pamayanan ng mga mananampalataya sa pambungad ng liham ni Pablo.
- source_word: ἁγίοις
  choice: mga banal
  rationale: Ang “mga banal” ay tuwirang tumutukoy sa mga taong ibinukod para sa Diyos at hindi ipinahihiwatig na iilang natatanging tao lamang ang tinutukoy.
- source_word: σὺν
  choice: kasama
  rationale: Natural na ipinahahayag ng “kasama” ang inklusibong ugnayan ng mga banal sa buong Acaya sa pangunahing tatanggap na iglesya sa Corinto.
- source_word: ἐν ὅλῃ τῇ Ἀχαΐᾳ
  choice: nasa buong Acaya
  rationale: 'Malinaw at natural nitong pinananatili ang lawak na sakop ng orihinal: ang buong rehiyon ng Acaya.'
theological_decisions:
- issue: Paglilipat ng Χριστός sa pambungad na titulo ni Pablo
  choice: Mesiyas Jesus
  alternative: Cristo Jesus
  rationale: Pinananatili ng “Mesiyas” ang hayag na kahulugan ng titulo sa Χριστοῦ Ἰησοῦ at iniiwasang ituring lamang itong bahagi ng personal na pangalan; hindi nito binabago ang pagkakakilanlan ni Jesus.
- issue: Saklaw ng οἱ ἅγιοι
  choice: lahat ng mga banal
  alternative: lahat ng mga hinirang
  rationale: Ang “mga banal” ay nagpapanatili sa diwa ng pagiging ibinukod para sa Diyos nang hindi nagdaragdag ng isang partikular na doktrina tungkol sa pagkahirang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyo ng pambungad na liham at ang tutuldok sa hulihan dahil nagpapatuloy ang pagbati sa susunod na talata. Ginamit ang “Acaya,” ang nakasanayang anyong Filipino ng pangalang panrehiyon.
