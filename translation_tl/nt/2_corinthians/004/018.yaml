id: 2CO.4.18
reference: 2 Corinthians 4:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μὴ σκοπούντων ἡμῶν τὰ βλεπόμενα ἀλλὰ τὰ μὴ βλεπόμενα, τὰ γὰρ βλεπόμενα πρόσκαιρα, τὰ δὲ μὴ βλεπόμενα αἰώνια.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/018.yaml
  text: as we look not to the things that are seen but to the things that are not seen. For the things that are seen are temporary[a], but the things that are not seen are eternal.
translation:
  language: tl
  text: habang hindi namin itinutuon ang aming tingin sa mga bagay na nakikita[a], kundi sa mga bagay na hindi nakikita. Sapagkat ang mga bagay na nakikita ay pansamantala, ngunit ang mga bagay na hindi nakikita ay walang hanggan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang nakikita … ang hindi nakikita,” o “mga bagay na lantad sa paningin … mga bagay na di-lantad sa paningin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοπούντων
  choice: itinutuon ang aming tingin
  rationale: Ipinahahayag nito ang sinasadyang pagbaling ng pansin at pinananatili ang metapora ng pagtingin. Ang anyong “sapagkat hindi namin…” ay likas na ikinakabit ang participial clause sa naunang pahayag ng talata.
- source_word: μὴ
  choice: hindi
  rationale: Payak itong pagkakaila; walang batayan sa Griyego para idagdag ang diwang “hindi na.”
- source_word: τὰ βλεπόμενα
  choice: mga bagay na nakikita
  rationale: Pinananatili ang substantival at maramihang anyo, pati ang kongkretong paghahambing sa mga bagay na hindi nakikita.
- source_word: ἀλλὰ
  choice: kundi
  rationale: Pagkatapos ng negatibong sugnay, ang “kundi” ang likas at malinaw na panandang Tagalog ng matinding pagsalungat.
- source_word: τὰ μὴ βλεπόμενα
  choice: mga bagay na hindi nakikita
  rationale: Tuwirang pinananatili ang pagkakapantay ng kayarian sa “mga bagay na nakikita” at hindi ito ipinapakahulugang agad bilang “espirituwal.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang ugnayang nagpapaliwanag o nagbibigay-batayan sa naunang pahayag.
- source_word: πρόσκαιρα
  choice: pansamantala
  rationale: Malinaw na nagsasaad ng pag-iral sa limitadong panahon at likas na kasalungat ng “walang hanggan,” nang hindi pinatitindi sa “panandalian lamang.”
- source_word: δέ
  choice: ngunit
  rationale: Malinaw na minamarkahan ang ikalawang bahagi ng paghahambing.
- source_word: αἰώνια
  choice: walang hanggan
  rationale: Likas at dignified na salin sa kontekstong kasalungat ng πρόσκαιρα, na tumutukoy sa hindi natatapos na pag-iral.
- source_word: ἡμῶν
  choice: namin / aming
  rationale: 'Ginawang hayag ang tagaganap ng participle sa natural na sintaks ng Tagalog: “hindi namin itinutuon ang aming tingin.”'
theological_decisions:
- issue: Ang paghahambing ng nakikita at hindi nakikita
  choice: mga bagay na nakikita … mga bagay na hindi nakikita
  alternative: mga materyal na bagay … mga espirituwal na bagay
  rationale: Hindi tahasang ipinapantay ni Pablo ang nakikita sa lahat ng materyal at ang hindi nakikita sa lahat ng espirituwal. Pinananatili ng salin ang mismong paghahambing at ang teolohikal na puwang ng teksto.
translation_notes:
  register: Makabago at karaniwang Filipino na may marangal na himig. Ginamit ang “itinutuon ang aming tingin” upang panatilihin ang larawang biswal nang hindi maging matigas o labis na literal. Ang pambungad na “sapagkat” ay angkop dahil nakasalalay ang participial clause sa naunang pangungusap ng 2 Corinto 4:17.
