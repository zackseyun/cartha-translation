id: 2CO.4.6
reference: 2 Corinthians 4:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι ὁ θεὸς ὁ εἰπών· Ἐκ σκότους φῶς ⸀λάμψει, ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν πρὸς φωτισμὸν τῆς γνώσεως τῆς δόξης τοῦ θεοῦ ἐν προσώπῳ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/006.yaml
  text: For God[a], who said[c][b], “Light will shine out of darkness,” has shone in our hearts for the illumination of the knowledge of the glory of God in the face of Messiah.
translation:
  language: tl
  text: Sapagkat ang Diyos na nagsabi, “Sisikat ang liwanag mula sa kadiliman,”[c] ay siyang nagliwanag sa aming mga puso para sa kaliwanagan ng pagkakilala sa kaluwalhatian ng Diyos sa mukha ng Mesiyas.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “sa persona ng Mesiyas.” Mas konkretong pinananatili ng “sa mukha ng Mesiyas” ang larawan ng nakikitang kaluwalhatian ng Diyos.
    reason: alternative_reading
  - marker: b
    text: Ang salitang Griyego na Χριστοῦ ay tradisyonal na isinasaling “Cristo”; dito ay “Mesiyas” dahil ginagamit ito bilang titulo.
    reason: lexical_alternative
  - marker: c
    text: Umaalingawngaw ang siping ito sa Genesis 1:3 at ginagamit ang larawan ng liwanag sa paglikha para sa gawa ng Diyos na naghahayag sa mga mananampalataya.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikita nito na ang pangungusap ay nagbibigay ng dahilan para sa naunang pahayag, gaya ng gamit ng ὅτι sa konteksto.
- source_word: ὁ θεὸς ὁ εἰπών
  choice: ang Diyos na nagsabi
  rationale: Likas na isinasalin sa Filipino ang articular participle bilang sugnay na naglalarawan.
- source_word: Ἐκ σκότους φῶς λάμψει
  choice: Sisikat ang liwanag mula sa kadiliman
  rationale: Pinananatili ang panghinaharap na anyo ng λάμψει at ang larawang ang liwanag ay nagmumula sa kadiliman.
- source_word: ὃς ἔλαμψεν
  choice: ang siya ring nagliwanag
  rationale: Pinananatiling di-tuwiran at di-causative ang pandiwang ἔλαμψεν; ang Diyos mismo ang inilalarawang nagliwanag sa mga puso.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: sa aming mga puso
  rationale: Pinananatili ang karaniwang biblikal na talinghaga ng puso bilang kaloob-looban ng tao at ang unang panauhang maramihan.
- source_word: πρὸς φωτισμὸν τῆς γνώσεως
  choice: upang ibigay ang liwanag ng pagkakilala
  rationale: Ginagawang likas sa Filipino ang layuning ipinahahayag ng πρὸς habang pinananatili ang ugnayan ng φωτισμός at γνώσις nang hindi lubusang ipinapaliwanag kung ang kaalaman ang nililiwanagan o ang kaalaman mismo ang liwanag.
- source_word: τῆς δόξης τοῦ θεοῦ
  choice: sa kaluwalhatian ng Diyos
  rationale: Tapat at malinaw na pinananatili ang genitibong ugnayan ng pagkakilala, kaluwalhatian, at Diyos.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: sa mukha ng Mesiyas
  rationale: Ang mukha ang tuwirang kahulugan ng πρόσωπον at angkop sa konteksto ng liwanag at kaluwalhatian; isinalin ang Χριστοῦ bilang titulong Mesiyas.
theological_decisions:
- issue: Pagkasalin sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Gumaganap dito ang Χριστός bilang titulo sa konteksto ng paghahayag ng kaluwalhatian ng Diyos, kaya isinalin ang kahulugan ng titulo sa halip na ituring lamang itong pangalan.
- issue: Kahulugan ng ἐν προσώπῳ Χριστοῦ
  choice: sa mukha ng Mesiyas
  alternative: sa persona ni Cristo
  rationale: Pinananatili ng konkretong salin ang larawan ng liwanag at nakikitang kaluwalhatian. Inilalagay sa talababa ang mas abstraktong posibleng pagbasa upang hindi alisin ang tunay na saklaw ng parirala.
- issue: Ugnayan ng φωτισμός at γνώσις
  choice: ang liwanag ng pagkakilala
  alternative: ang pagbibigay-liwanag sa kaalaman
  rationale: Pinananatili ang siksik at bahagyang malabong genitibong pahayag ni Pablo sa halip na tiyaking ang kaalaman lamang ang bagay na nililiwanagan.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang magkakaugnay na larawang “kadiliman,” “liwanag,” “nagliwanag,” “kaluwalhatian,” at “mukha.” Ginamit ang “pagkakilala” sa halip na purong intelektuwal na “kaalaman” upang maipahiwatig ang relasyonal at mapanagutang diwa ng γνώσις nang hindi ito labis na ipinapaliwanag.
