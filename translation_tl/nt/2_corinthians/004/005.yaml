reference: 2 Corinthians 4:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐ γὰρ ἑαυτοὺς κηρύσσομεν ἀλλὰ ⸂Χριστὸν Ἰησοῦν⸃ κύριον, ἑαυτοὺς δὲ δούλους ὑμῶν διὰ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/005.yaml
  text: For we do not proclaim ourselves[a], but Messiah Jesus as Lord[c][b], and ourselves as your servants for Jesus' sake.
translation:
  language: tl
  text: Sapagkat hindi namin ipinapahayag ang aming sarili, kundi si Jesus na Mesiyas bilang Panginoon, at kami naman ay inyong mga alipin alang-alang kay Jesus.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Cristo Jesus.” Ang salitang Griego na Χριστός ay maaaring isaling “Cristo” kapag ginagamit na parang bahagi ng pangalan; dito ay isinaling “Mesiyas” bilang titulo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga lingkod.” Ang salitang Griego na δοῦλοι ay maaaring tumukoy sa mga lingkod o mga alipin; pinili rito ang “mga alipin” upang mapanatili ang matinding diwa ng pagpapasakop, na kaiba sa pagiging Panginoon ni Jesus.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “dahil kay Jesus.”
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσομεν
  choice: ipinahahayag namin
  rationale: Ipinahahayag conveys public proclamation without limiting the action to formal sermon preaching.
- source_word: ἑαυτοὺς
  choice: ang sarili namin
  rationale: The reflexive expression is retained in both halves to preserve Paul's deliberate contrast between the object of proclamation and the apostles' subordinate role.
- source_word: Χριστὸν Ἰησοῦν
  choice: si Jesus na Mesiyas
  rationale: Mesiyas preserves Χριστός as an active title, while placing the title after the personal name follows natural modern Filipino syntax.
- source_word: κύριον
  choice: bilang Panginoon
  rationale: 'Bilang Panginoon preserves the predicative force: Jesus is proclaimed as Lord, without adding an explicit finite verb.'
- source_word: δούλους
  choice: mga alipin
  rationale: Alipin preserves the strong sense of subordination in δοῦλος and the deliberate contrast with Jesus as Panginoon.
- source_word: ὑμῶν
  choice: ninyo
  rationale: The possessive genitive is naturally represented by ninyo, expressing the apostles' subordinate service in relation to the Corinthian believers.
- source_word: διὰ Ἰησοῦν
  choice: alang-alang kay Jesus
  rationale: With διά plus the accusative, the phrase most naturally states the reason or motive for their serving the Corinthians.
theological_decisions:
- issue: Whether Χριστός is rendered as a title or a name-like form
  choice: Mesiyas as a title
  alternative: Cristo in the name-like expression “Cristo Jesus”
  rationale: In this proclamation formula, the titular force remains perceptible; Mesiyas preserves it without importing additional interpretation.
- issue: Force of Χριστὸν Ἰησοῦν κύριον
  choice: si Jesus na Mesiyas bilang Panginoon
  alternative: ang Panginoong Cristo Jesus
  rationale: The chosen wording keeps κύριον predicative—Jesus is proclaimed as Lord—rather than making it merely another component of a fixed name or title.
- issue: Strength of δοῦλοι
  choice: mga alipin
  alternative: mga lingkod
  rationale: Alipin retains the marked relation of ownership and subordination and sharpens the textual contrast between the apostles and Jesus as Panginoon.
translation_notes:
  register: Modern, dignified Filipino understandable to ordinary readers. The repeated “ang sarili namin” intentionally mirrors the Greek contrast. “Alang-alang kay” is current and reverent rather than archaic, while the semicolon allows the second elliptical clause to retain the source structure.
