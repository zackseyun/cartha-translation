  text: Ἔχομεν δὲ τὸν θησαυρὸν τοῦτον ἐν ὀστρακίνοις σκεύεσιν, ἵνα ἡ ὑπερβολὴ τῆς δυνάμεως ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/007.yaml
  text: But we have this treasure in clay jars[b][a], so that the surpassing greatness of the power may be of God and not from us.
translation:
  language: tl
  text: Ngunit taglay namin ang kayamanang ito sa mga sisidlang luwad[a], upang ang kapangyarihang higit sa karaniwan[b] ay magmula sa Diyos at hindi sa amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga sisidlang yari sa luwad.”
    reason: lexical_alternative
  - marker: b
    text: O “ang pambihirang kapangyarihan” o “ang nangingibabaw na kapangyarihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχομεν
  choice: taglay namin
  rationale: Likas at dignified na Filipino para sa kasalukuyang pag-aangkin o pagkakaroon; mas angkop sa mahalagang 'kayamanan' kaysa sa payak na 'mayroon kami.'
- source_word: δὲ
  choice: Ngunit
  rationale: Pinananatili ang pagsalungat o paglipat mula sa naunang konteksto.
- source_word: τὸν θησαυρὸν τοῦτον
  choice: ang kayamanang ito
  rationale: Tuwirang pinananatili ang metapora at ang demonstratibong tumutukoy sa naunang binanggit na liwanag/mensahe.
- source_word: ἐν ὀστρακίνοις σκεύεσιν
  choice: sa mga sisidlang luwad
  rationale: Ang ὀστράκινος ay yari sa luwad o palayok, at ang σκεῦος ay sisidlan. Pinananatili ng parirala ang marupok at karaniwang larawan nang hindi ito ipinapaliwanag sa pangunahing teksto.
- source_word: ἵνα
  choice: upang
  rationale: Natural na panandang Filipino para sa layunin, habang maaari pa ring magpahiwatig ng kinalabasan ayon sa konteksto.
- source_word: ἡ ὑπερβολὴ τῆς δυνάμεως
  choice: ang pambihirang kapangyarihan
  rationale: Ipinahahayag ang di-pangkaraniwang o higit-sa-karaniwang antas ng δύναμις sa natural na Filipino; hindi kailangang ulitin bilang 'pambihirang kadakilaan ng kapangyarihan,' na mabigat at di-likas.
- source_word: ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν
  choice: maging malinaw na ... ay mula sa Diyos at hindi mula sa amin
  rationale: Sa Filipino, nililinaw ng 'maging malinaw na' ang predikatibong diwa sa layuning sugnay; ang 'mula sa' ay tumutugma sa tahasang pinagmulan sa ἐξ ἡμῶν at isang kontekstuwal na pagbasa sa genitibong τοῦ θεοῦ.
theological_decisions:
- issue: Ang kahulugan ng metapora ng kayamanan at mga sisidlang luwad
  choice: Panatilihin ang metapora nang hindi tukuyin sa pangunahing teksto kung ano ang kayamanan o kung sino/ano ang mga sisidlan.
  alternative: Palawakin bilang 'kayamanan ng ebanghelyo' at 'aming marurupok na katawan.'
  rationale: Ipinahihiwatig ng konteksto ang mga referent, ngunit hindi tahasang ipinapaliwanag ng mismong talata ang metapora.
- issue: Puwersa ng ἵνα
  choice: Isalin bilang layunin na may 'upang,' na maaari ring maglaman ng diwang kinalabasan.
  alternative: 'Isalin bilang purong kinalabasan: ''kaya malinaw na.'''
  rationale: Pinananatili ng 'upang' ang karaniwang purposive force ng ἵνα nang hindi itinatanggi ang resultative shade nito.
- issue: Ugnayan ng kapangyarihan sa Diyos sa pariralang τοῦ θεοῦ
  choice: 'Isalin ang ugnayan bilang pinagmulan: ''mula sa Diyos,'' kasalungat ng ''hindi mula sa amin.'''
  alternative: Mas pormal na 'ay sa Diyos' o 'ay pag-aari ng Diyos.'
  rationale: Bagaman genitibo ang τοῦ θεοῦ, ang kasunod na ἐξ ἡμῶν ay malinaw na nagpapakita ng kontrast sa pinagmulan; natural sa Filipino ang magkatimbang na 'mula sa Diyos ... hindi mula sa amin.'
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang 'sisidlang luwad' upang mapanatili ang sinaunang metapora nang hindi maging labis na kolokyal; ang alternatibong 'tapayang luwad' ay nasa talababa. Lahat ng marker na [a] at [b] ay nasa pangunahing teksto.
