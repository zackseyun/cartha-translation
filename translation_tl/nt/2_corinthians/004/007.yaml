  naturalness: Natural at marangal sa modernong Filipino ang “taglay namin,” “sisidlang luwad,” at ang binagong sugnay na “ay magmula sa Diyos at hindi sa amin.”
  terminology: Napananatili ang metapora ng “kayamanan” at “sisidlang luwad” nang walang interpretibong pagpapaliwanag. Ang “kapangyarihang higit sa karaniwan” ay mas malinaw na kumakatawan sa di-pangkaraniwang/sumasapaw na katangian ng kapangyarihan kaysa sa payak na “pambihirang kapangyarihan.”
