- from: Ngunit taglay namin ang kayamanang ito sa mga sisidlang luwad[a], upang maging malinaw na ang pambihirang kapangyarihan ay mula sa Diyos at hindi mula sa amin.[b]
  to: Ngunit taglay namin ang kayamanang ito sa mga sisidlang luwad[a], upang ang kapangyarihang higit sa karaniwan[b] ay magmula sa Diyos at hindi sa amin.
  rationale: Inalis ang interpretibong “maging malinaw na” upang hindi magdagdag ng diwang wala sa Griyego. Inayos ang sugnay upang tuwirang ipahayag ang kontrast na ang kapangyarihan ay mula sa Diyos at hindi sa amin. Inilipat ang marker [b] sa mismong pariralang may alternatibong leksikal na salin at pinalitan ang talababa ng mga tunay na alternatibo para rito.
