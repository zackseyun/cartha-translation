source:
  edition: SBLGNT
  text: πάντοτε τὴν νέκρωσιν ⸀τοῦ Ἰησοῦ ἐν τῷ σώματι περιφέροντες, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ ἐν τῷ σώματι ἡμῶν φανερωθῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/010.yaml
  text: always carrying in the body the death of Jesus[a], so that the life of Jesus may also be revealed in our body.
translation:
  language: tl
  text: Lagi naming dinadala sa katawan ang kamatayan ni Jesus[a], upang mahayag din sa aming katawan ang buhay ni Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang pagkamatay ni Jesus.” Maaaring idiin ng pangngalang Griyego ang kalagayan o karanasan ng kamatayang dinadala sa katawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: lagi
  rationale: Likas at maikli itong katumbas na nagpapanatili sa diwa ng patuloy na kalagayan.
- source_word: νέκρωσιν
  choice: kamatayan
  rationale: Tumutukoy ang pangngalan sa kalagayan o karanasan ng kamatayan. Pinananatili ng “kamatayan” ang pagtutumbas nito sa “buhay” sa ikalawang bahagi, habang ang maaaring diwang “pagkamatay” ay inilalagay sa talababa.
- source_word: τοῦ Ἰησοῦ
  choice: ni Jesus
  rationale: Pinananatili ang payak na ugnayang genitibo nang hindi nililimitahan kung ito ay kamatayang dinanas ni Jesus o pakikibahagi ng mga apostol sa kamatayang kaugnay niya.
- source_word: ἐν τῷ σώματι
  choice: sa katawan
  rationale: Walang tahasang panghalip na paari sa unang paglitaw; hindi idinagdag ang “aming” upang mapanatili ang anyo at bahagyang pagkakaiba sa ikalawang parirala.
- source_word: περιφέροντες
  choice: dinadala
  rationale: Ipinahahayag ng kasalukuyang pandiwaring ito ang patuloy na pagdadala. Natural sa Filipino ang “dinadala” at napapanatili nito ang metapora.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinakikita ang ugnayang layunin o kinalabasan sa kasunod na sugnay.
- source_word: καὶ
  choice: din
  rationale: Pinananatili ang magkatugmang ugnayan ng kamatayan ni Jesus at ng buhay ni Jesus.
- source_word: ζωὴ
  choice: buhay
  rationale: Tuwirang katumbas na sa konteksto ay tumutukoy sa buhay ng muling nabuhay na si Jesus.
- source_word: ἐν τῷ σώματι ἡμῶν
  choice: sa aming katawan
  rationale: Pinananatili ang isahang “katawan” na may maramihang nagmamay-ari, gaya ng Griyego, at ang kolektibong pananaw sa ministeryo ng mga apostol.
- source_word: φανερωθῇ
  choice: mahayag
  rationale: Natural at marangal na anyong balintiyak na nagpapanatili sa diwa ng pagiging lantad o nakikita ng buhay ni Jesus.
theological_decisions:
- issue: Kahulugan ng νέκρωσις kaugnay ni Jesus
  choice: “kamatayan ni Jesus”
  alternative: “pagkamatay ni Jesus” o “ang pagdanas ng kamatayan ni Jesus”
  rationale: Mas malinaw na katapat ng “buhay ni Jesus” ang “kamatayan ni Jesus” at hindi nito nililimitahan ang pahayag sa proseso lamang ng pagkamatay. Gayunman, kinikilala sa talababa ang posibleng diin sa kalagayan o karanasan ng kamatayan.
- issue: Bilang ng σώμα
  choice: Panatilihin ang isahang “katawan” sa dalawang parirala.
  alternative: 'Gawing maramihan ang ikalawa: “sa aming mga katawan.”'
  rationale: Isahan ang Griyego sa dalawang paglitaw. Pinananatili nito ang retorikang pagkakatugma at ang maaaring kolektibong diwa nang hindi ipinipilit ang isang doktrinal na pagbasa.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Pinanatili ang matinding metapora ng pagdadala sa katawan at ang isahang “katawan,” habang iniwasang ipaliwanag nang labis ang ugnayan ng kamatayan at buhay ni Jesus sa mga apostol.
