  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ ἀπειπάμεθα τὰ κρυπτὰ τῆς αἰσχύνης, μὴ περιπατοῦντες ἐν πανουργίᾳ μηδὲ δολοῦντες τὸν λόγον τοῦ θεοῦ, ἀλλὰ τῇ φανερώσει τῆς ἀληθείας ⸀συνιστάνοντες ἑαυτοὺς πρὸς πᾶσαν συνείδησιν ἀνθρώπων ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/002.yaml
  text: Instead[a], we have renounced the hidden things of shame, not walking in cunning nor falsifying the word of God[b], but by the open display of the truth commending ourselves to every human conscience before God.
translation:
  language: tl
  text: Ngunit tinalikuran na namin ang mga lihim na kahiya-hiyang gawain. Hindi kami namumuhay nang may katusuhan ni binabaluktot ang salita ng Diyos.[a] Sa halip, sa hayag na pagpapakita ng katotohanan,[b] ipinapakita namin ang aming sarili sa budhi ng bawat tao sa harap ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hinahaluan” ang salita ng Diyos. Maaaring ilarawan ng pandiwang Griyego ang mapanlinlang na pakikialam o pagsira sa isang bagay.
    reason: lexical_alternative
  - marker: b
    text: O “sa pagpapahayag ng katotohanan.” Binibigyang-diin ng Griyego ang paggawa sa katotohanan na lantad o hayag, hindi lamang ang pasalitang pagpapahayag nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειπάμεθα
  choice: tinalikuran na namin
  rationale: Ipinahahayag ang tiyak na pagtatakwil sa mga gawaing binanggit; natural at mabigat sa modernong Tagalog.
- source_word: τὰ κρυπτὰ τῆς αἰσχύνης
  choice: ang mga lihim na bagay na kahiya-hiya
  rationale: Pinananatili ang ideya ng mga bagay na ikinukubli dahil sa kanilang kahiya-hiyang katangian, sa malinaw na Tagalog.
- source_word: μὴ περιπατοῦντες ἐν πανουργίᾳ
  choice: Hindi kami namumuhay nang may katusuhan
  rationale: Ang μεταφορikal na 'paglakad' ay likas na ipinahahayag sa Tagalog bilang paraan ng pamumuhay; ang 'katusuhan' ay nagpapahiwatig ng tusong pandaraya.
- source_word: μηδὲ δολοῦντες
  choice: ni dinadaya
  rationale: Sinasaklaw ang mapanlinlang na pakikialam o pagsalaula sa mensahe nang hindi nililimitahan ang tiyak na paraan nito.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Karaniwan, marangal, at sapat ang lawak upang tumukoy sa mensaheng mula sa Diyos nang hindi labis na tinutukoy ang anyo nito.
- source_word: τῇ φανερώσει τῆς ἀληθείας
  choice: sa hayagang paghahayag ng katotohanan
  rationale: Ipinahahayag ang paggawa sa katotohanan na lantad at nakikita; hindi ito nililimitahan sa pasalitang pangangaral lamang.
- source_word: συνιστάνοντες ἑαυτοὺς
  choice: inihaharap namin ang aming sarili
  rationale: Natural na Tagalog para sa paghaharap ng sarili upang masuri at kilalanin, nang hindi awtomatikong nagpapahiwatig ng pagmamalaki.
- source_word: πρὸς πᾶσαν συνείδησιν ἀνθρώπων
  choice: sa budhi ng bawat tao
  rationale: Pinananatili ang distributibong diwa ng πᾶσαν at ang moral na kamalayan na tinutukoy ng συνείδησις.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: sa harap ng Diyos
  rationale: Tuwirang ipinahahayag na ang kanilang ministeryo ay isinasagawa sa presensiya at pagsusuri ng Diyos.
theological_decisions:
- issue: Saklaw ng pagtuligsa sa mapanlinlang na ministeryo
  choice: Inilalarawan ang tapat at hayag na asal sa ministeryo at ang hindi mapanlinlang na pakikitungo sa salita ng Diyos.
  alternative: Basahin ito bilang isang makitid na pagtuligsa lamang sa retorikal na manipulasyon, o bilang teknikal na pahayag tungkol sa lahat ng paggamit sa Kasulatan.
  rationale: Ang konteksto ay ang asal at pagpapahayag ng mga apostol. Pinananatili ng salin ang saklaw na iyon nang hindi nagdaragdag ng doktrinang hindi tahasang sinasabi rito.
- issue: Diwa ng φανέρωσις
  choice: hayagang paghahayag
  alternative: hayagang pangangaral; pagpapakita
  rationale: Ang salita ay tumutukoy sa paggawa sa isang bagay na lantad o hayag, kaya hindi ito dapat paliitin sa pasalitang pangangaral lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maiikling pangungusap upang maging malinaw ang dalawang magkasalungat na paraan ng ministeryo. Iniwasan ang labis na teknikal o denominasyonal na pananalita.
