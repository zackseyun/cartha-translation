  to: Ngunit tinalikuran na namin ang mga lihim na kahiya-hiyang gawain. Hindi kami namumuhay nang may katusuhan ni binabaluktot ang salita ng Diyos.[a] Sa halip, sa hayag na pagpapakita ng katotohanan,[b] ipinapakita namin ang aming sarili sa budhi ng bawat tao sa harap ng Diyos.
  rationale: Pinalinaw ang pandiwang δολοῦντες bilang “binabaluktot” upang maipahayag ang mapanlinlang na pagsira o pagmamaniobra sa salita ng Diyos. Pinakinis din ang dalawang parirala para sa mas likas na modernong Tagalog, habang pinanatili ang hayag na pagpapakita ng katotohanan at ang pananagutan sa harap ng Diyos.
