  yaml_path: translation/nt/2_corinthians/004/017.yaml
  text: For our momentary light affliction is producing for us an eternal weight of glory beyond all comparison,[a]
translation:
  language: tl
  text: Sapagkat ang panandalian at magaang paghihirap na dinaranas natin ay nagbubunga para sa atin ng walang hanggang bigat ng kaluwalhatiang walang kapantay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa sukdulang nakahihigit na antas.” Sa Griyego, literal na “ayon sa kalabisan tungo sa kalabisan,” isang idyomang nagpapahayag ng pambihirang sukat.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραυτίκα
  choice: panandalian
  rationale: Ipinahahayag nito na ang paghihirap ay para lamang sa kasalukuyang sandali at pansamantala, bilang tuwirang kaibahan ng “walang hanggan.”
- source_word: ἐλαφρὸν
  choice: magaan
  rationale: Pinananatili ng “magaan” ang sinadyang paghahambing sa “bigat” (βάρος), nang hindi ipinahihiwatig na madali o walang sakit ang paghihirap.
- source_word: θλίψεως
  choice: paghihirap
  rationale: Natural at malawak itong salitang Filipino para sa dinaranas na kagipitan, pagdurusa, at kapighatian, nang hindi nagdaragdag ng tiyak na eskatolohikal na kahulugan.
- source_word: ἡμῶν
  choice: nating
  rationale: 'Pinananatili ang unang panauhang maramihan at ang kaugnayang paari: ang paghihirap na dinaranas natin.'
- source_word: καθ’ ὑπερβολὴν εἰς ὑπερβολὴν
  choice: higit sa anumang maihahambing
  rationale: Likas na ipinapahayag sa Filipino ang matinding idyomatikong pag-uulit ng ὑπερβολή at ang di-mapapantayang antas ng kaluwalhatian.
- source_word: αἰώνιον
  choice: walang hanggan
  rationale: Malinaw nitong pinananatili ang kaibahan sa panandaliang paghihirap at ang panghinaharap na katangian ng kaluwalhatian.
- source_word: βάρος
  choice: bigat
  rationale: Pinananatili ang matapang na metapora at ang retorikal na kaibahan sa “magaan”; iniwasan ang “pasanin,” na maaaring magpahiwatig ng bagay na mapaniil.
- source_word: δόξης
  choice: ng kaluwalhatian
  rationale: Pinananatili ang anyong henitibo sa pariralang “bigat ng kaluwalhatian” sa halip na gawing pang-uri at pahinain ang metapora.
- source_word: κατεργάζεται
  choice: nagbubunga
  rationale: Ipinahahayag nito ang patuloy at mabisang pagdudulot ng isang resulta, sa natural na modernong Filipino.
- source_word: ἡμῖν
  choice: para sa atin
  rationale: 'Binabasa ang datibo bilang pakinabang: ang kaluwalhatian ay ibinubunga para sa mga mananampalataya, hindi kinakailangang bilang panloob na pagbabagong moral.'
theological_decisions:
- issue: Ang kaugnayan ng kasalukuyang paghihirap at ng kaluwalhatian
  choice: Inilalarawan ang kasalukuyang paghihirap bilang nagbubunga para sa atin ng panghinaharap at walang hanggang kaluwalhatian.
  alternative: Ang paghihirap ay nagkakamit ng kaligtasan bilang gantimpala sa sariling merito, o tumutukoy lamang sa kasalukuyang paghubog ng pagkatao.
  rationale: Pinananatili ng “nagbubunga para sa atin” ang malakas na ugnayang ipinahahayag ng pandiwa, ngunit hindi idinaragdag na ang tao ay nagkakamit ng kaligtasan sa pamamagitan ng merito. Ang pagtutunggali ng “panandalian” at “walang hanggan” ay tumuturo sa panghinaharap na kaluwalhatian.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal ang himig. Sadyang pinanatili ang metaporikal na pagtutunggali ng “magaan” at “bigat,” kahit hindi ito karaniwang kolokasyon, dahil mahalaga ito sa retorika ng talata.
