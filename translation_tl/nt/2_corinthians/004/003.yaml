  text: εἰ δὲ καὶ ἔστιν κεκαλυμμένον τὸ εὐαγγέλιον ἡμῶν, ἐν τοῖς ἀπολλυμένοις ἐστὶν κεκαλυμμένον,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/003.yaml
  text: And even if our gospel is veiled[a], it is veiled among those who are perishing,
translation:
  language: tl
  text: At kung natatakpan man ng tabing ang magandang balitang ipinapahayag namin, natatakpan ito sa mga taong napapahamak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kabilang sa mga taong napapahamak” o “para sa mga taong napapahamak.”
    reason: Pinananatili ang mga posibleng ugnayan ng ἐν τοῖς ἀπολλυμένοις nang hindi sapilitang nilulutas ang sintaktikong kaluwagan.
lexical_decisions:
- source_word: εἰ δὲ καὶ
  choice: At kahit
  rationale: Likas na ipinapahayag sa Tagalog ang kondisyunal at konsesibong diwa; pinananatili ng “At” ang pagpapatuloy ng argumento at ng “kahit” ang diin ng καί.
- source_word: κεκαλυμμένον
  choice: natatalukbungan
  rationale: Pinananatili ang talinghaga ng tabing mula sa 3:14–16 at inuulit dito bilang kalagayang umiiral, sa halip na gawing mas pangkalahatang “nakatago.”
- source_word: τὸ εὐαγγέλιον ἡμῶν
  choice: ang magandang balitang ipinapahayag namin
  rationale: Ang “magandang balita” ay malinaw na katumbas ng εὐαγγέλιον; nililinaw ng “ipinapahayag namin” ang kaugnayan ng possessive na ἡμῶν nang hindi nagpapahiwatig na pag-aari nila ang mensahe.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: sa mga taong napapahamak
  rationale: Pinananatili ng “napapahamak” ang kasalukuyan at nagpapatuloy na kalagayan o proseso ng participle; ang “sa” ay sadyang hindi nililimitahan sa lokatibong “kabilang sa” sapagkat maaaring tumukoy ang ἐν sa saklaw o sa mga taong para sa kanila ay natatalukbungan ang mensahe.
- source_word: ἐστὶν κεκαλυμμένον
  choice: natatalukbungan ito
  rationale: Pinananatili ang pag-uulit ng predicate sa Griyego para sa diin, at ang “ito” ay malinaw na tumutukoy sa magandang balita.
theological_decisions:
- issue: Diwa ng ἀπολλυμένοις sa kontekstong soteriolohikal ni Pablo
  choice: mga taong napapahamak
  alternative: mga taong napahamak / mga nawawala
  rationale: Ang anyong participle ay naglalarawan ng nagpapatuloy na kalagayan o proseso. Hindi ito ginagawang isang ganap at tahimik na napagpasyahang etiketa, kaya napapanatili ang tensiyong teolohikal ng teksto.
- issue: Ugnayan ng ἐν sa natatalukbungang ebanghelyo at sa mga napapahamak
  choice: sa mga taong napapahamak
  alternative: kabilang sa mga taong napapahamak / para sa mga taong napapahamak
  rationale: Ang payak na “sa” ay nagpapanatili ng tunay na kaluwagan ng ἐν, na maaaring magpahiwatig ng saklaw o reperensiya at, ayon sa konteksto, ng mga taong nakararanas na natatalukbungan ang mensahe.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “natatalukbungan” upang mapanatili ang mahalagang talinghaga ng tabing sa agarang konteksto; iniwasan ang mas teknikal na “ebanghelyo” sa pangunahing teksto para sa mas tuwirang pagkaunawa ng karaniwang mambabasa.
