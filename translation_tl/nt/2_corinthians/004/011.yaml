id: 2CO.4.11
reference: 2 Corinthians 4:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀεὶ γὰρ ἡμεῖς οἱ ζῶντες εἰς θάνατον παραδιδόμεθα διὰ Ἰησοῦν, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ φανερωθῇ ἐν τῇ θνητῇ σαρκὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/011.yaml
  text: For we who are living are always being handed over to death for Jesus’ sake[b][a], so that the life of Jesus also may be revealed in our mortal flesh.
translation:
  language: tl
  text: Sapagkat kami na nabubuhay ay laging ibinibigay sa kamatayan dahil kay Jesus[a], upang mahayag din ang buhay ni Jesus sa aming katawang mortal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “alang-alang kay Jesus” o “para kay Jesus.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griego na isinaling “katawan” ay literal na “laman.” Dito, tumutukoy ito sa pisikal na pag-iral na namamatay, hindi sa “makasalanang kalikasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀεί
  choice: lagi
  rationale: Ipinapahayag nito ang palagian o paulit-ulit na kalagayan; tuwiran at natural ang “lagi” sa modernong Tagalog.
- source_word: γάρ
  choice: sapagkat
  rationale: Pinananatili nito ang ugnayang nagpapaliwanag sa naunang pahayag.
- source_word: οἱ ζῶντες
  choice: kaming nabubuhay
  rationale: Pinananatili ang kasalukuyan at nagpapatuloy na diwa ng participle, pati ang tahasang kaibahan nito sa “kamatayan.”
- source_word: εἰς θάνατον
  choice: sa kamatayan
  rationale: Kasama ng παραδιδόμεθα, ipinahihiwatig nito ang hantungan o kinahihinatnan ng pagkakabigay.
- source_word: παραδιδόμεθα
  choice: ibinibigay
  rationale: Pinananatili ang balintiyak at nagpapatuloy na kilos ng pandiwang Griego nang hindi nagdaragdag ng gumagawa ng kilos.
- source_word: διὰ Ἰησοῦν
  choice: dahil kay Jesus
  rationale: Ang διά na may accusative ay karaniwang nagpapahayag ng dahilan o sanhi; malinaw itong naihahatid ng “dahil kay Jesus” habang iniiwan sa talababa ang mga posibleng alternatibo.
- source_word: ἵνα
  choice: upang
  rationale: Natural na ipinapahayag ang layunin o kinalabasan nang hindi pinipili nang lubusan sa pagitan ng dalawang aspektong iyon.
- source_word: καί
  choice: din
  rationale: Pinananatili ang pagkakatugma ng buhay ni Jesus sa naunang pahiwatig ng kamatayan dahil kay Jesus.
- source_word: ἡ ζωὴ τοῦ Ἰησοῦ
  choice: ang buhay ni Jesus
  rationale: Tuwirang pinananatili ang genitibong parirala at ang kaibahan ng buhay at kamatayan.
- source_word: φανερωθῇ
  choice: mahayag
  rationale: Pinananatili ang balintiyak na anyo at hindi tahasang nagdaragdag ng tagaganap.
- source_word: ἐν τῇ θνητῇ σαρκὶ ἡμῶν
  choice: sa aming katawang may kamatayan
  rationale: Sa konteksto, ang σάρξ ay tumutukoy sa marupok at namamatay na pisikal na pag-iral. Mas natural sa kasalukuyang Tagalog ang “katawan” kaysa literal na “laman,” habang nililinaw ng “may kamatayan” ang θνητός.
theological_decisions:
- issue: Kahulugan ng σάρξ sa kontekstong Paulino
  choice: katawan bilang pisikal na pag-iral na namamatay
  alternative: laman; makasalanang kalikasan
  rationale: Tinutukoy ng “mortal na σάρξ” ang pisikal at marupok na pag-iral ng mga apostol, hindi ang isang etikal na prinsipyo o “makasalanang kalikasan.” Iniiwasan ng salin ang maling teolohikal na pagbasa habang ipinapaliwanag sa talababa ang literal na salita.
- issue: Ugnayan ng διὰ Ἰησοῦν sa pagdurusa
  choice: dahil kay Jesus
  alternative: alang-alang kay Jesus; para kay Jesus
  rationale: Pinakamalinaw na ipinapakita ng pangunahing salin ang sanhi, ngunit kinikilala sa talababa na maaaring idiomatikong ipahayag ang katapatan o pagdurusa para kay Jesus.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang paliwanag na ugnayan ng “sapagkat,” ang balintiyak na pagkakabigay at paghahayag, at ang tensiyon ng buhay at kamatayan. Ginamit ang “katawang may kamatayan” sa halip na teknikal o di-likas na “mortal na laman,” kalakip ang talababa tungkol sa literal na σάρξ.
