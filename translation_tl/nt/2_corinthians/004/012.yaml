  source_fidelity: Ang unang sugnay ay tapat sa ὥστε, ὁ θάνατος, ἐν ἡμῖν, at ἐνεργεῖται. Ngunit sa ikalawang sugnay, ang “ang buhay ay sa inyo” ay maaaring natural na mabasa bilang pag-aari (“ang buhay ay para sa inyo”) sa halip na ang paralelong diwa ng ἐν ὑμῖν. Ligtas na gawing hayag ang pandiwang ipinagpapalagay mula sa unang sugnay.
  naturalness: Natural at marangal ang “Kaya nga” at “ang kamatayan ay kumikilos sa amin.” Ang pag-uulit ng “kumikilos” sa ikalawang sugnay ay mas malinaw at nananatiling maikli at natural sa modernong Filipino Tagalog.
  terminology: Ang “kamatayan” at “buhay” ay wastong literal na mga katawagan at pinananatili ang sadyang bukas na saklaw ng pagsalungat. Ang “kumikilos” ay angkop para sa nagpapatuloy at mabisang pagkilos ng ἐνεργεῖται.
