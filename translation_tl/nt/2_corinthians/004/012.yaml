  text: So then[a], death is at work in us, but life in you.
translation:
  language: tl
  text: Kaya nga, ang kamatayan ay kumikilos sa amin, ngunit ang buhay ay kumikilos sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Kaya nga, ang kamatayan ay kumikilos sa amin, ngunit ang buhay ay nasa inyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kaya nga
  rationale: Ipinahahayag nito ang bunga o kongklusyon mula sa naunang paglalarawan sa mga talata 8–11, sa natural na modernong Tagalog.
- source_word: ὁ θάνατος
  choice: ang kamatayan
  rationale: Pinananatili ang tahasang artikulo at ang literal na katawagan upang huwag paliitin ang saklaw sa pisikal o metaporikal na kamatayan lamang.
- source_word: ἐν ἡμῖν
  choice: sa amin
  rationale: Natural itong katumbas ng ἐν ἡμῖν sa ganitong pahayag at malinaw na tumutukoy kay Pablo at sa mga kasama niya sa ministeryo.
- source_word: ἐνεργεῖται
  choice: ay kumikilos
  rationale: Ipinapakita nito ang nagpapatuloy at mabisang pagkilos na ipinahihiwatig ng pandiwa, nang hindi gumagamit ng teknikal na pananalita.
- source_word: ἡ δὲ ζωὴ
  choice: ngunit ang buhay
  rationale: Ang “ngunit” ay malinaw na naghahayag ng pagsalungat ng kamatayan at buhay; pinananatili rin ang literal na “buhay” upang manatiling bukas ang teolohikal na saklaw.
- source_word: ἐν ὑμῖν
  choice: sa inyo
  rationale: Pinananatili nito ang maikli at tuwirang paralelismo sa “sa amin,” habang maaaring tumukoy kapuwa sa mga taga-Corinto bilang pamayanan at sa kanilang personal na karanasan.
theological_decisions:
- issue: Kahulugan ng pagsalungat ng kamatayan at buhay
  choice: 'Pinananatili ang literal at maigsi na pagsalungat: kumikilos ang kamatayan sa mga apostol, samantalang ang buhay ay nasa o naipararating sa mga taga-Corinto.'
  alternative: Tahasang tukuyin ito bilang pisikal na paghihirap ng mga apostol at espirituwal na buhay ng mga taga-Corinto.
  rationale: Iniuugnay ng konteksto ang kamatayan at buhay ni Jesus sa katawan ng mga apostol at sa ministeryong nagdudulot ng buhay sa iba. Hindi nilulutas ng salin ang tunay na lawak ng dalawang katawagan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, maikli, at marangal. Pinanatili ang matinding paralelismo ng Griyego at iniwasang ipaliwanag nang labis ang teolohikal na ugnayan ng kamatayan at buhay.
