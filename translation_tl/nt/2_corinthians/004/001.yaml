  yaml_path: translation/nt/2_corinthians/004/001.yaml
  text: Therefore, since we have this ministry, just as we have received mercy, we do not lose heart.
translation:
  language: tl
  text: Kaya, yamang taglay namin ang paglilingkod na ito, kung paanong kami'y kinahabagan, hindi kami pinanghihinaan ng loob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Kaya
  rationale: Likas na panandang konklusyon sa modernong Tagalog at malinaw na nag-uugnay sa naunang pahayag.
- source_word: ἔχοντες τὴν διακονίαν ταύτην
  choice: yamang taglay namin ang paglilingkod na ito
  rationale: Pinananatili ang participial na dahilan at ang diwa ng ipinagkatiwala at isinasagawang ministeryo nang hindi gumagamit ng salitang masyadong teknikal.
- source_word: καθὼς ἠλεήθημεν
  choice: ayon sa habag na tinanggap namin
  rationale: Ipinahahayag na ang pagkakaroon ng paglilingkod ay kaayon o bunga ng pagkahabag sa kanila; iniiwasan ang malamya at di-likas na literal na anyong 'kung paanong kinahabagan kami.'
- source_word: οὐκ ἐγκακοῦμεν
  choice: hindi kami pinanghihinaan ng loob
  rationale: Karaniwang idyomatikong katumbas na saklaw ang hindi pagsuko o panghihina sa paggawa.
theological_decisions:
- issue: Ugnayan ng habag at paglilingkod
  choice: ayon sa habag na tinanggap namin
  alternative: kung paanong kinahabagan kami
  rationale: Pinananatiling kaugnay ang paglilingkod at natanggap na habag nang hindi tahasang nilulutas kung ang καθὼς ay pangunahing naghahayag ng paraan, batayan, o pagkakatulad.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang 'paglilingkod' sa halip na teknikal na 'ministeryo,' at pinanatili ang pangmaramihang tinig ni Pablo.
