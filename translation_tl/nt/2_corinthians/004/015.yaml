  text: τὰ γὰρ πάντα δι’ ὑμᾶς, ἵνα ἡ χάρις πλεονάσασα διὰ τῶν πλειόνων τὴν εὐχαριστίαν περισσεύσῃ εἰς τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/015.yaml
  text: For all things are for your sake[a], so that as grace increases through more and more people, thanksgiving may overflow to the glory of God.
translation:
  language: tl
  text: Sapagkat ang lahat ng bagay ay para sa kapakanan ninyo, upang habang ang biyaya ay dumarami sa pamamagitan ng parami nang paraming tao[a], umapaw ang pasasalamat para sa kaluwalhatian ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng marami” o “sa pamamagitan ng mas nakararami.” Maaaring tumukoy ang Griyego sa maraming tao sa pangkalahatan o sa lumalaking bilang ng mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ γὰρ πάντα
  choice: Sapagkat ang lahat ng ito
  rationale: Ang “lahat ng ito” ay likas sa modernong Tagalog at inuugnay ang malawak na pahayag sa mga bagay na binanggit sa konteksto; pinananatili ng “sapagkat” ang paliwanag na puwersa ng γάρ.
- source_word: δι’ ὑμᾶς
  choice: para sa kapakanan ninyo
  rationale: Ipinahahayag nito ang pakinabang o kapakanan na tinutukoy ng διά na may akusatibo, nang hindi ito ginagawang sanhi.
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili nito ang layunin o ibinungang tunguhin ng sugnay sa maikli at marangal na Tagalog.
- source_word: ἡ χάρις
  choice: ang biyaya
  rationale: Ang “biyaya” ang karaniwang salin ng χάρις at sapat na malawak upang tumukoy sa mapagbiyayang pagkilos o kaloob ng Diyos nang hindi nililimitahan ang diwa.
- source_word: πλεονάσασα
  choice: habang ... ay dumarami
  rationale: Ginagawang natural sa Tagalog ang pang-abay na participle at pinananatili ang larawan ng pagdami o paglago.
- source_word: διὰ τῶν πλειόνων
  choice: sa pamamagitan ng parami nang paraming tao
  rationale: Ipinakikita ang malamang na lumalaking bilang ng mga tao, sa halip na ipakahulugang tiyak na “nakararami,” habang kinikilala na maaari ring maunawaan ang Griyego bilang “sa pamamagitan ng marami.”
- source_word: τὴν εὐχαριστίαν
  choice: ang pasasalamat
  rationale: Natural at malinaw itong tumutukoy sa pagpapasalamat na iniuukol sa Diyos.
- source_word: περισσεύσῃ
  choice: umapaw
  rationale: Pinananatili ang masiglang larawan ng kasaganaan o paglagpas sa karaniwang sukat.
- source_word: εἰς τὴν δόξαν τοῦ θεοῦ
  choice: sa ikaluluwalhati ng Diyos
  rationale: Likas na Tagalog ito para sa tunguhin o resultang nakalaan sa kaluwalhatian ng Diyos.
theological_decisions:
- issue: Saklaw at tinutukoy ng “biyaya” sa sugnay ng layunin
  choice: Pinanatili ang “biyaya” bilang mapagbiyayang pagkilos o kaloob ng Diyos na dumarami ang epekto.
  alternative: Tiyak na tukuyin ito bilang biyayang nagliligtas na dumarating sa mas maraming tumatanggap, o bilang pabor ng Diyos sa ministeryo ni Pablo.
  rationale: Hindi nilulutas ng talata kung alin sa mga mas makitid na pagbasa ang pangunahing tinutukoy; pinananatili ng salin ang lawak at teolohikal na tensiyon ng χάρις.
- issue: Ugnayan ng layunin at resulta sa ἵνα
  choice: Isinalin bilang “upang,” na maaaring magpahiwatig ng layunin at inaasahang resulta.
  alternative: Gawing tahasang resulta lamang, gaya ng “kaya naman.”
  rationale: Ang ἵνα ay may purposibong puwersa rito, ngunit ang layunin at resulta ay magkaugnay; hindi dapat alisin ang alinman sa pamamagitan ng sobrang tiyak na salin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “parami nang paraming tao” upang natural na katawanin ang komparatibong τῶν πλειόνων. Walang talababa dahil walang marker na kailangan sa pangunahing teksto; ang pangunahing salin mismo ang naghahayag ng malamang na lumalaking bilang.
