  source_fidelity: 'Ang pangunahing diwa ay naipapahayag nang tapat: hindi sila pinanghihinaan ng loob sa kabila ng patuloy na pagkasira ng panlabas at pagpapanibago ng panloob. Gayunman, mas malinaw na ipreserba ang dalawang adversative/concessive pananda ng Griyego (ἀλλ’ εἰ καὶ ... ἀλλ’) sa pamamagitan ng “Ngunit kahit ... naman.” Ang “pinapanibago” ay mas tiyak na katumbas ng ἀνακαινοῦται kaysa sa mas malawak na “binabago.”'
  naturalness: Natural at marangal sa modernong Filipino ang “Kaya hindi kami pinanghihinaan ng loob” at “araw-araw.” Ang binagong konstruksiyong “Ngunit kahit ..., ang ... naman ay ...” ay likas at pinananatili ang retorikal na pagtutuwid ng talata.
  terminology: Ang magkatambal na “panlabas na pagkatao” at “panloob na pagkatao” ay angkop at hindi nagpapataw ng katawan-kaluluwang dualismo. Ang “pinapanibago” ay nagpapanatili ng kahulugang renewal, hindi lamang pangkalahatang pagbabago.
