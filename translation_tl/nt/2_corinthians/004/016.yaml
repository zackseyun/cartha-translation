    issue: Hindi ganap na naipapakita ng “Bagaman” ang magkabilang adversative/concessive pag-uugnay ng ἀλλ’ εἰ καὶ ... ἀλλ’.
    rationale: May pagtutol at konsesyon ang Griyego bago ang unang sugnay, at isa pang malinaw na pagtutol bago ang ikalawa. Ang “Ngunit kahit ... naman” ay mas malapit dito nang hindi nagiging di-natural.
  - severity: medium
    issue: Masyadong malawak ang “binabago” para sa ἀνακαινοῦται.
    rationale: Ang pandiwa ay tumutukoy sa ginagawang bago o pinapanunumbalik na bago; ang “pinapanibago” ay mas malapit at pinananatili ang patuloy na balintiyak na diwa.
  - severity: low
