  text: Διὸ οὐκ ⸀ἐγκακοῦμεν, ἀλλ’ εἰ καὶ ὁ ἔξω ἡμῶν ἄνθρωπος διαφθείρεται, ἀλλ’ ὁ ⸂ἔσω ἡμῶν⸃ ἀνακαινοῦται ἡμέρᾳ καὶ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/016.yaml
  text: Therefore we do not lose heart. But even if our outer man is wasting away[a], yet our inner man is being renewed day by day.
translation:
  language: tl
  text: Kaya hindi kami pinanghihinaan ng loob. Ngunit kahit ang aming panlabas na pagkatao ay unti-unting nasisira[a], ang aming panloob na pagkatao naman ay pinapanibago araw-araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, literal na “ang aming panlabas na tao” at “ang aming panloob na tao.” Sa Griyego, ang “tao” ay ginagamit sa pangkalahatang kahulugan at sadyang pinagtatambal ang panlabas at panloob na buhay ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Kaya
  rationale: Likas na panandang pasaklaw sa Filipino na nag-uugnay sa talata sa naunang pangangatwiran.
- source_word: οὐκ ἐγκακοῦμεν
  choice: hindi kami pinanghihinaan ng loob
  rationale: Malinaw at karaniwang idyoma para sa hindi pagkawala ng tapang o pag-asa.
- source_word: ἀλλ’ εἰ καὶ
  choice: Bagaman
  rationale: Ipinahahayag ang konsesibong diwa ng parirala bilang isang kinikilalang tunay na kalagayan, nang hindi ito ginagawang di-tiyak.
- source_word: ὁ ἔξω ἡμῶν ἄνθρωπος
  choice: ang aming panlabas na pagkatao
  rationale: Pinananatili ang sadyang paghahambing ng panlabas at panloob na buhay ng tao, ngunit mas natural ito kaysa literal na “panlabas na tao” sa modernong Filipino.
- source_word: διαφθείρεται
  choice: unti-unting nasisira
  rationale: Ipinakikita ang patuloy na pagkasira o paghina, hindi ang biglaang pagkalipol.
- source_word: ἀλλ’
  choice: naman
  rationale: Natural na panandang pasalungat sa Filipino na nagpapatingkad sa kaibhan ng panlabas na pagkasira at panloob na pagpapanibago.
- source_word: ὁ ἔσω ἡμῶν
  choice: ang aming panloob na pagkatao
  rationale: Tumutugma sa “panlabas na pagkatao” at pinananatili ang eliptikal ngunit malinaw na antropolohikal na paghahambing.
- source_word: ἀνακαινοῦται
  choice: ay binabago
  rationale: Ang anyong balintiyak at pangkasalukuyan ay nagpapahiwatig ng patuloy na pagbabagong ginagawa sa panloob na pagkatao.
- source_word: ἡμέρᾳ καὶ ἡμέρᾳ
  choice: araw-araw
  rationale: Pinakanatural na katumbas sa Filipino ng paulit-ulit at tuloy-tuloy na pangyayari sa bawat araw.
theological_decisions:
- issue: Ang paghahambing ng ὁ ἔξω ἄνθρωπος at ὁ ἔσω
  choice: “panlabas na pagkatao” at “panloob na pagkatao,” nang hindi tahasang itinutumbas ang mga ito sa katawan at kaluluwa
  alternative: “panlabas na tao” at “panloob na tao,” o “katawan” at “kalooban”
  rationale: Pinananatili ng salin ang sadyang paghahambing ni Pablo habang iniiwasang magpasok ng ganap na dualismong katawan-kaluluwa na hindi tahasang binibigyang-kahulugan ng talata.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “pagkatao” upang mapanatili ang antropolohikal na paghahambing nang hindi maging alanganin ang literal na “panlabas na tao/panloob na tao.”
