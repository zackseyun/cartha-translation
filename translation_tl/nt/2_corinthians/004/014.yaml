review_pass:
  verdict: revise
  source_fidelity: Kailangang baguhin ang pokus ng pandiwang “magbangon.” Sa draft, ang “ang nagbangon kay Jesus” at “magbabangon ... sa atin” ay hindi malinaw na naghahayag na ang Diyos ang siyang bumuhay kay Jesus at siyang bubuhay sa mga mananampalataya. Ang “muling bumuhay ... bubuhay” ay tapat sa sanhi/ahenteng diwa ng ἐγείρας at ἐγερεῖ. Ang “namin/amin” ay pinananatili rin ang pagkakaiba ng ἡμᾶς (“kami”) at ὑμῖν (“kayo/ninyo”).
  naturalness: Mas natural at malinaw sa modernong Filipino Tagalog ang “ang muling bumuhay kay Jesus ay muli ring bubuhay sa amin” kaysa sa paggamit ng “magbangon” na may “kay/sa” na layon.
  terminology: Ang “muling bumuhay” ay angkop na biblikal at nauunawaang pananalita para sa pagkabuhay-muli, nang hindi nagdadagdag ng pangalan o titulong wala sa pangunahing tekstong SBLGNT. Pinananatili ang “Jesus”; ang baryanteng “Panginoong Jesus” ay nasa talababa.
  issues:
  - severity: high
    issue: Hindi angkop ang pokus at konstruksiyon ng “ang nagbangon kay Jesus ay magbabangon din sa atin.”
    rationale: Ang Griyegong ὁ ἐγείρας ... ἐγερεῖ ay tumutukoy sa isang gumagawa na bumuhay kay Jesus at bubuhay sa “amin.” Ang “magbangon” ay karaniwang di-ganap/aktor-pokus at, sa mga kasamang “kay Jesus” at “sa atin,” ay hindi malinaw na nagbibigay ng ganitong kahulugan.
  - severity: medium
    issue: Ang “alam nating” at “sa atin” ay maaaring gawing inklusibo ang panghalip.
    rationale: Tinutukoy ng ἡμᾶς ang nagsasalita at mga kasamahan niya, na ibinubukod mula sa ὑμῖν. Ang “alam namin” at “sa amin” ay mas tumpak na pinananatili ang paghahambing na “kami ... kasama ninyo.”
  revised_text: Sapagkat alam namin na ang muling bumuhay kay Jesus ay muli ring bubuhay sa amin kasama ni Jesus at ihaharap kami kasama ninyo.[a]
  revised_footnotes:
  - marker: a
    text: Sa ilang manuskrito, “ang Panginoong Jesus” sa halip na “Jesus.”
    reason: textual_variant
  revision_rationale: Inayos ang pandiwa upang malinaw na ang Diyos na bumuhay kay Jesus ang siyang bubuhay sa mga nagsasalita. Pinalitan din ang inklusibong anyo ng panghalip ng eksklusibong “namin/amin,” upang maipakita ang pagkakaiba ng “kami” at “ninyo” sa Griyego. Hindi binago ang saklaw ng “kasama ni Jesus” o “kasama ninyo,” at pinanatili ang talababa para sa tekstuwal na baryante.
