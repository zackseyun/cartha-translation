  text: εἰδότες ὅτι ὁ ἐγείρας ⸀τὸν Ἰησοῦν καὶ ἡμᾶς ⸀σὺν Ἰησοῦ ἐγερεῖ καὶ παραστήσει σὺν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/014.yaml
  text: because we know that the one who raised Jesus will also raise us with Jesus and will present us with you[a].
translation:
  language: tl
  text: Sapagkat alam namin na ang muling bumuhay kay Jesus ay muli ring bubuhay sa amin kasama ni Jesus at ihaharap kami kasama ninyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “ang Panginoong Jesus” sa halip na “Jesus.”
    reason: textual_variant
lexical_decisions:
- source_word: εἰδότες
  choice: Sapagkat alam natin
  rationale: Ang participle ay nagbibigay ng dahilan sa konteksto; natural na ipinahahayag ito sa Tagalog sa paraang pasanhi.
- source_word: ὁ ἐγείρας
  choice: ang nagbangon
  rationale: Pinananatili nito ang anyong participial at malinaw na tumutukoy sa Diyos nang hindi inuulit ang hindi tahasang pangalang nasa Griyego.
- source_word: τὸν Ἰησοῦν
  choice: kay Jesus
  rationale: Sinusunod ang pangunahing teksto ng SBLGNT, na may 'Jesus' at walang 'Panginoon.'
- source_word: καὶ ἡμᾶς ... ἐγερεῖ
  choice: ay magbabangon din sa atin
  rationale: Ipinakikita ng 'din' ang ugnayang pandagdag sa muling pagkabuhay ni Jesus at pinananatili ang hinaharap na aspekto.
- source_word: σὺν Ἰησοῦ
  choice: kasama ni Jesus
  rationale: Tuwirang ipinahahayag ang pakikisama o association na karaniwang diwa ng σύν, nang hindi ginagawang instrumental na 'sa pamamagitan ni Jesus.'
- source_word: παραστήσει
  choice: ihaharap tayo
  rationale: Natural sa Tagalog at pinananatili ang diwa ng pagdadala o paghaharap sa presensiya ng isang tao, nang hindi labis na tinutukoy ang eksaktong eskatolohikal na tagpo.
- source_word: σὺν ὑμῖν
  choice: kasama ninyo
  rationale: Pinananatili ang sama-samang pag-asa nina Pablo at ng mga taga-Corinto.
theological_decisions:
- issue: Tekstuwal na baryante sa pagtukoy kay Jesus
  choice: Jesus sa pangunahing teksto
  alternative: Panginoong Jesus
  rationale: Sinusunod ng pangunahing salin ang SBLGNT. Itinatala sa talababa ang mas mahabang pagbasa nang hindi ginagawang usaping doktrinal ang pagkakaiba.
- issue: Eskatolohikal na diwa ng παραστήσει
  choice: ihaharap tayo kasama ninyo
  alternative: dadalhin tayo kasama ninyo sa kanyang presensiya; ipatatayo tayo kasama ninyo sa harap niya
  rationale: Ipinahihiwatig ng konteksto ang panghinaharap na paghaharap pagkatapos ng muling pagkabuhay, ngunit hindi tinutukoy ng salin kung kaninong hukuman o presensiya upang mapanatili ang lawak ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang 'magbangon' para sa muling pagkabuhay ayon sa karaniwang biblikal na gamit, at iniwasan ang pagpapaliwanag na lampas sa teksto.
