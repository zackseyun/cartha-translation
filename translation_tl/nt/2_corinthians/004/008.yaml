  terminology: Ang “pinahihirapan,” “nalilito,” at “nawawalan ng pag-asa” ay angkop na modernong Filipino Tagalog. Pinalitan ang hindi malinaw na “nasisiraan” ng “nasasadlak sa kagipitan.” Inayos din ang talababa upang iwasan ang di-karaniwang “masusulingan.”
