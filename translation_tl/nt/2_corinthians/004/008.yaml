  text: We are afflicted in every way[a], but not crushed; perplexed[c][b], but not driven to despair.
translation:
  language: tl
  text: Pinahihirapan kami sa lahat ng paraan[a], ngunit hindi kami nasasadlak sa kagipitan; nalilito kami, ngunit hindi kami lubusang nawawalan ng pag-asa[b].
  philosophy: optimal-equivalence
