lexical_decisions:
- source_word: ἐν παντί
  choice: sa lahat ng paraan
  rationale: Ipinahahayag nito ang malawak na saklaw ng paghihirap, hindi kinakailangang literal na pagkubkob sa lahat ng panig.
- source_word: θλιβόμενοι
  choice: pinahihirapan
  rationale: Ipinapakita ng θλίβω ang pagdanas ng matinding panggigipit o kapighatian; natural at malinaw sa modernong Tagalog ang “pinahihirapan.”
- source_word: στενοχωρούμενοι
  choice: nasisisiraan
  rationale: Ang pandiwa ay naglalarawan ng pagkakulong o pagkakipit na para bang nasa makitid na lugar. Sa pagtutol sa unang sugnay, ipinahihiwatig ng “hindi nasisiraan” na hindi sila lubusang nagigiba sa ilalim ng panggigipit, habang pinananatili ang kaibahan sa kasunod na pagkawala ng pag-asa.
- source_word: ἀπορούμενοι
  choice: nalilito
  rationale: Ang salita ay tumutukoy sa pagkalito o kawalan ng katiyakan kung ano ang gagawin; payak at natural ang “nalilito.”
- source_word: ἐξαπορούμενοι
  choice: nawawalan ng pag-asa
  rationale: Pinalalakas ng tambalang pandiwa ang ἀπορέω at tumutukoy sa lubos na kawalan ng mapagkukunan o daan; sa konteksto, malinaw na naihahayag ng “hindi nawawalan ng pag-asa” ang sukdulang kalagayang itinatanggi ni Pablo.
- source_word: ἀλλ’ οὐ ... ἀλλ’ οὐκ
  choice: ngunit hindi ... ngunit hindi
  rationale: Pinananatili nito ang inuulit na pagsalungat at maindayog na pagkakapantay ng dalawang pares.
theological_decisions:
- issue: Antas ng pagpapalakas sa ikalawang pares ng mga pandiwa
  choice: “nalilito, ngunit hindi nawawalan ng pag-asa”
  alternative: “hindi lubusang nawawalan ng masusulingan”
  rationale: Pinananatili ng salin ang pag-igting mula sa pagkalito tungo sa sukdulang kawalan ng pag-asa, nang hindi ito ginagawang teknikal na pahayag tungkol sa pananampalataya o kalagayang sikolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang maikli at magkatugmang mga pagsalungat ng Griyego; iniwasan ang masyadong teknikal o makalumang pananalita.
