lexical_decisions:
- source_word: διωκόμενοι
  choice: inuusig
  rationale: Karaniwang ipinahihiwatig ng salita sa kontekstong Paulino ang pag-uusig o mapanlabang pagtugis. Ang “inuusig” ay malinaw, natural, at nagpapanatili sa anyong balintiyak.
- source_word: ἐγκαταλειπόμενοι
  choice: pinababayaan
  rationale: Ipinahihiwatig nito ang hindi pag-iwan sa kanila nang walang tulong. Mas natural ito sa modernong Tagalog kaysa “tinatalikuran,” habang hindi rin nilulutas kung sino ang hindi nagpapabaya sa kanila.
- source_word: καταβαλλόμενοι
  choice: pinababagsak
  rationale: Pinananatili nito ang larawan ng marahas na pagpapatumba o pagpapabagsak at ang kaibahan nito sa ganap na pagkalipol.
- source_word: ἀπολλύμενοι
  choice: nililipol
  rationale: Sa kaibahan sa “pinababagsak,” ang “nililipol” ay nagpapahayag ng ganap na pagkawasak, hindi lamang pansamantalang pagkatalo.
- source_word: ἀλλ’ οὐκ
  choice: ngunit hindi
  rationale: Pinananatili ng parirala ang maigsi at balanseng paghaharap ng dalawang kalagayan sa Griyego.
theological_decisions:
- issue: Kung dapat bang tukuyin na ang Diyos ang hindi nagpapabaya sa mga apostol
  choice: Hindi tahasang tinukoy ang gumagawa; ginamit ang balintiyak na “hindi pinababayaan.”
  alternative: “Ngunit hindi kami pinababayaan ng Diyos.”
  rationale: Hindi tahasang binabanggit ng talata ang gumagawa. Pinananatili ng salin ang anyong balintiyak at ang likas na teolohikal na pahiwatig nang hindi nagdaragdag sa teksto.
- issue: Kung ang ἀπολλύμενοι ay dapat ipakahulugang kasalukuyang pagkapahamak o ganap na pagkalipol
  choice: “nililipol”
  alternative: “napapahamak”
  rationale: Ang tuwirang kaibahan sa “pinababagsak” ay tumutukoy sa hindi pag-abot ng kanilang paghihirap sa ganap na pagkawasak; hindi nito ipinagkakaila ang tunay at patuloy na panganib.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Pinanatili ang magkatimbang na ritmo at mga anyong balintiyak ng Griyego. Inilagay ang mga talababa sa mismong salitang tinutukoy ng bawat alternatibo.
