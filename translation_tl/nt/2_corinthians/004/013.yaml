language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἔχοντες δὲ τὸ αὐτὸ πνεῦμα τῆς πίστεως, κατὰ τὸ γεγραμμένον· Ἐπίστευσα, διὸ ἐλάλησα, καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/013.yaml
  text: But having the same spirit of faith[a], according to what is written, “I believed; therefore I spoke,” we also believe; therefore we also speak[b],
translation:
  language: tl
  text: 'Ngunit taglay namin ang parehong espiritu ng pananampalataya[a], ayon sa nasusulat: “Sumampalataya ako, kaya nagsalita ako,” at kami rin ay sumasampalataya, kaya nagsasalita rin kami.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “parehong Espiritu ng pananampalataya,” kung ang πνεῦμα ay inuunawang tumutukoy sa Espiritu Santo sa halip na sa magkakatulad na disposisyong puspos ng pananampalataya.
    reason: alternative_reading
  - marker: b
    text: Sinipi ni Pablo ang Awit 116:10 (115:1 sa Septuagint), at iniugnay niya ang pananampalataya at pagsasalita ng kanyang pangkat sa patotoo ng mang-aawit.
    reason: cross_reference
lexical_decisions:
- source_word: Ἔχοντες
  choice: taglay natin
  rationale: Ipinahahayag ang kasalukuyang pagkakaroon habang nananatiling natural sa Filipino; nakaugnay ito sa pangunahing pahayag na “sumasampalataya” at “nagsasalita.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang banayad na pagsalungat o pagpapatuloy ng argumento mula sa naunang konteksto.
- source_word: τὸ αὐτὸ πνεῦμα τῆς πίστεως
  choice: ang gayunding espiritu ng pananampalataya
  rationale: 'Pinananatili ang anyo at likas na kalabuan ng Griyego: maaaring tumukoy sa magkatulad na disposisyong puspos ng pananampalataya o, ayon sa alternatibong pagbasa, sa Espiritu Santo.'
- source_word: κατὰ τὸ γεγραμμένον
  choice: ayon sa nasusulat
  rationale: Natural at marangal na pormula sa Filipino sa pagpapakilala ng sipi mula sa Kasulatan.
- source_word: Ἐπίστευσα
  choice: Sumampalataya ako
  rationale: Direktang ipinapahayag ang aorist na pandiwa at pinananatili ang ugnayan nito sa pangngalang “pananampalataya.”
- source_word: διὸ
  choice: kaya
  rationale: Malinaw at natural na naghahayag ng bunga o hinuha sa parehong paglitaw nito.
- source_word: ἐλάλησα
  choice: nagsalita ako
  rationale: Karaniwan at tuwirang salin ng λαλέω sa sipi.
- source_word: καὶ ἡμεῖς πιστεύομεν
  choice: Tayo rin ay sumasampalataya
  rationale: Ang “tayo rin” ay nagpapanatili sa diin at pagkakatulad ng mga apostol sa nagsasalita sa salmo.
- source_word: διὸ καὶ λαλοῦμεν
  choice: kaya nagsasalita rin tayo
  rationale: 'Pinananatili ang lohikal at retorikal na pagkakatulad: pananampalataya ang humahantong sa pagsasalita.'
theological_decisions:
- issue: Kung ang πνεῦμα ay tumutukoy sa Espiritu Santo o sa magkatulad na disposisyon/diwa ng pananampalataya
  choice: espiritu ng pananampalataya, na hindi ginawang pantanging pangalan
  alternative: Espiritu ng pananampalataya, bilang pagtukoy sa Espiritu Santo
  rationale: Iniuugnay ng konteksto ang pahayag ni Pablo sa “Sumampalataya ako, kaya nagsalita ako,” kaya malamang na disposisyong pinasisigla ng pananampalataya ang tinutukoy. Gayunman, hindi tahasang nilulutas ng Griyego ang tanong, kaya pinananatili sa talababa ang alternatibo.
- issue: Pagsasalin sa pangkat ng salitang πιστ-
  choice: pananampalataya / sumampalataya
  alternative: pananalig / nanalig
  rationale: Ang “pananampalataya” at “sumampalataya” ay natural, magkakaugnay, at angkop sa marangal na modernong Filipino, habang malinaw na pinananatili ang pag-uulit ng salitang-ugat sa Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “taglay natin” sa halip na mas mabigat na literal na participial construction, at ang “kaya” para sa natural ngunit tumpak na ugnayang lohikal. Pinanatili ang “espiritu” sa maliit na titik sa pangunahing teksto upang hindi sapilitang lutasin ang tunay na kalabuan ng πνεῦμα.
