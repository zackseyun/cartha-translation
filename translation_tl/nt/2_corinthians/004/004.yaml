id: 2CO.4.4
reference: 2 Corinthians 4:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν οἷς ὁ θεὸς τοῦ αἰῶνος τούτου ἐτύφλωσεν τὰ νοήματα τῶν ἀπίστων εἰς τὸ μὴ ⸀αὐγάσαι τὸν φωτισμὸν τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ, ὅς ἐστιν εἰκὼν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/004.yaml
  text: In their case[a], the god of this age has blinded the minds of the unbelieving, so that the light of the gospel of the glory of Messiah, who is the image of God[c][b], might not shine on them.
translation:
  language: tl
  text: Sa kalagayan nila, binulag ng diyos ng kapanahunang ito[b] ang mga isip ng mga hindi sumasampalataya, upang hindi sumikat sa kanila ang liwanag ng magandang balita tungkol sa kaluwalhatian ng Mesiyas[c], na siyang larawan ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “upang hindi nila makita ang liwanag ng magandang balita tungkol sa kaluwalhatian ng Mesiyas.” Maaaring idiin ng pambihirang pandiwa ang pagsikat ng liwanag o ang pagkakita nila rito.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “ang diyos ng sanlibutang ito.” Karaniwang nangangahulugan ang Griyegong aiōn ng “kapanahunan,” na nagbibigay-diin sa kasalukuyang masamang panahon.'
    reason: lexical_alternative
  - marker: c
    text: 'Griyego: Christos; isinaling “Mesiyas” dito sapagkat ginagamit ito bilang titulo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: Sa kalagayan nila
  rationale: Likas na Tagalog na tumutukoy sa mga napapahamak at hindi sumasampalataya sa naunang konteksto, nang hindi magpahiwatig ng literal na pananatili sa loob nila.
- source_word: ὁ θεὸς τοῦ αἰῶνος τούτου
  choice: ang diyos ng kapanahunang ito
  rationale: Pinananatili ng “kapanahunan” ang diwa ng αἰών bilang kasalukuyang panahon o era, hindi ang nilikhang sanlibutan; maliit na titik ang “diyos” upang hindi ito mapagkamalang ang tunay na Diyos.
- source_word: ἐτύφλωσεν τὰ νοήματα
  choice: binulag ... ang mga isip
  rationale: Tuwirang pinananatili ang metapora ng pagkabulag at ang νόημα bilang kakayahang umunawa.
- source_word: τῶν ἀπίστων
  choice: ng mga hindi sumasampalataya
  rationale: Malinaw at likas na paglalarawan sa mga hindi naniniwala, nang hindi idagdag ang mas malakas na moral na diwa ng pagiging taksil.
- source_word: εἰς τὸ μὴ αὐγάσαι
  choice: upang hindi sumikat sa kanila
  rationale: Ipinapahayag ang layunin o bunga at kinukuha ang pambihirang pandiwa bilang pagsikat ng liwanag sa kanila; inilalagay sa talababa ang posibleng diwang hindi nila nakikita ang liwanag.
- source_word: τὸν φωτισμὸν
  choice: ang liwanag
  rationale: Natural at malinaw sa Tagalog at angkop sa metapora, sa halip na mas teknikal na “pagliliwanag.”
- source_word: τοῦ εὐαγγελίου
  choice: ng magandang balita
  rationale: Tuwirang inilalahad sa modernong Tagalog ang pangunahing diwa ng εὐαγγέλιον.
- source_word: τῆς δόξης τοῦ Χριστοῦ
  choice: tungkol sa kaluwalhatian ng Mesiyas
  rationale: Ang “tungkol sa” ay natural na nag-uugnay sa magandang balita at sa kaluwalhatian ng Mesiyas nang patagin ito bilang simpleng “maluwalhating magandang balita.”
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Dito ay gumaganap ang Χριστός bilang titulo; malinaw na naihahayag ito ng “Mesiyas.”
- source_word: ὅς ἐστιν εἰκὼν τοῦ θεοῦ
  choice: na siyang larawan ng Diyos
  rationale: Pinananatili ang tuwirang pahayag na kristolohikal at ang matatag na metapora ng εἰκών nang walang dagdag na paliwanag.
theological_decisions:
- issue: Ang tinutukoy ng “diyos ng kapanahunang ito”
  choice: Pinanatili bilang “diyos ng kapanahunang ito,” na nagpapahiwatig ng isang huwad at mapang-angking kapangyarihan, ayon sa kaugalian ay nauunawaang si Satanas.
  alternative: Isang impersonal na sistema ng kasalukuyang sanlibutan, o ang tahasang pagsasaling “Satanas.”
  rationale: Hindi pinapangalanan ng Griyego ang tinutukoy. Ang mismong parirala ang pinananatili upang huwag magdagdag ng interpretasyong wala sa teksto.
- issue: Gamit ng αὐγάσαι kasama ng φωτισμός
  choice: Ang liwanag ng magandang balita ang hindi sumisikat sa mga hindi sumasampalataya.
  alternative: Hindi nakikita ng mga hindi sumasampalataya ang liwanag ng magandang balita.
  rationale: Pambihira ang pandiwa at maaaring tumukoy sa pagsikat o sa pagkakita ng liwanag. Ang pangunahing teksto ay gumagamit ng unang pagbasa, habang pinananatili sa talababa ang tunay na alternatibo.
- issue: Puwersa ng “larawan ng Diyos” tungkol sa Mesiyas
  choice: 'Pinanatili bilang tuwirang pagkakakilanlan: ang Mesiyas ang larawan ng Diyos.'
  alternative: Pagpapalawak gamit ang mga terminong doktrinal na wala sa talata.
  rationale: Malakas ang kabuluhang kristolohikal ng pahayag, ngunit hindi dapat dagdagan ng salin ang sinabi ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “magandang balita” para sa malinaw na katutubong pagpapahayag, “kapanahunan” upang mapanatili ang pagkakaiba ng αἰών sa kosmos, at “Mesiyas” dahil titulo ang Χριστός. Ang lahat ng marker [a], [b], at [c] ay nasa pangunahing teksto.
