  text: εἴτε ὑπὲρ Τίτου, κοινωνὸς ἐμὸς καὶ εἰς ὑμᾶς συνεργός· εἴτε ἀδελφοὶ ἡμῶν, ἀπόστολοι ἐκκλησιῶν, δόξα Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/023.yaml
  text: As for Titus[a], he is my partner and fellow worker for you; as for our brothers, they are messengers of the churches[b], the glory of Messiah.
translation:
  language: tl
  text: Kung tungkol kay Tito, siya ang aking katuwang at kamanggagawa para sa inyo; kung tungkol naman sa aming mga kapatid, sila ay mga sugo ng mga iglesya[a], ang kaluwalhatian ng Mesiyas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga apostol ng mga iglesya.” Ang salitang Griyego ay maaaring tumukoy sa mga isinugong mensahero o kinatawan, o sa “mga apostol” sa mas malawak na diwa; sa kontekstong ito, mas malamang na mga kinatawan ng mga iglesya ang tinutukoy.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “ang kaluwalhatian ni Cristo.” Ginamit sa teksto ang “Mesiyas” sapagkat titulo ang Χριστός dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ὑπὲρ Τίτου
  choice: Kung tungkol kay Tito
  rationale: Elliptical ang parirala at nagpapakilala ng una sa dalawang magkatulad na paksa. Likas sa modernong Tagalog ang “Kung tungkol kay Tito” at pinananatili nito ang pahiwatig ng εἴτε at ang kahulugang “hinggil kay” ng ὑπέρ.
- source_word: κοινωνὸς ἐμὸς
  choice: aking katuwang
  rationale: Ang κοινωνός ay tumutukoy sa isang taong nakikibahagi o kasama sa gawain. Ang “katuwang” ay natural at malinaw sa konteksto ng paglilingkod.
- source_word: εἰς ὑμᾶς συνεργός
  choice: kamanggagawa para sa inyo
  rationale: Tuwirang ipinapahayag ng “kamanggagawa” ang συνεργός, habang ang “para sa inyo” ay malapit sa direksiyon o kaugnayang ipinahihiwatig ng εἰς ὑμᾶς nang hindi idinaragdag ang interpretasyong “para sa ikabubuti ninyo.”
- source_word: ἀδελφοὶ ἡμῶν
  choice: ating mga kapatid
  rationale: Tumutukoy ang panlalaking maramihan sa mga lalaking kinatawan sa kontekstong ito. Ang “mga kapatid” ay karaniwang tawag sa kapwa mananampalataya at hindi nangangailangan ng di-tiyak na pagpapalawak.
- source_word: ἀπόστολοι ἐκκλησιῶν
  choice: mga sugo ng mga iglesya
  rationale: Maaaring mangahulugan ang ἀπόστολοι ng mga isinugo o kinatawan, bukod sa teknikal na “mga apostol.” Sa konteksto ng mga kinatawang inatasan ng mga kongregasyon, malinaw at angkop ang “mga sugo ng mga iglesya.”
- source_word: δόξα Χριστοῦ
  choice: ang kaluwalhatian ng Mesiyas
  rationale: Pinananatili ng salin ang maikli at walang-pandiwang paglalarawan sa Griyego. Isinalin ang Χριστός bilang titulong “Mesiyas,” hindi bilang pangalang “Cristo.”
theological_decisions:
- issue: Kahulugan ng ἀπόστολοι para sa mga di-pinangalanang kapatid
  choice: mga sugo ng mga iglesya
  alternative: mga apostol ng mga iglesya
  rationale: Ang genitibong “ng mga iglesya” at ang konteksto ng pangongolekta ay tumutukoy sa mga kinatawang isinugo ng mga kongregasyon. Hindi kailangang ipalagay na taglay nila ang teknikal o natatanging katungkulan ng apostol, ngunit pinananatili sa talababa ang leksikal na posibilidad.
- issue: Pagpapakahulugan sa δόξα Χριστοῦ
  choice: ang kaluwalhatian ng Mesiyas
  alternative: karangalan sa Mesiyas
  rationale: Pinananatili ng “kaluwalhatian ng Mesiyas” ang tuwirang genitibong parirala at ang tunay na posibilidad na inilalarawan ang mga kapatid bilang pagpapakita ng kanyang kaluwalhatian. Hindi ito ginawang “karangalan sa Mesiyas,” na magdaragdag ng direksiyonal na pagpapakahulugan.
- issue: Pag-render sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay gumaganap ang Χριστός bilang titulo. Ang “Mesiyas” ang tuwirang salin ng titulong iyon at iniiwasang ituring lamang itong pangalang pantangi.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “katuwang,” “kamanggagawa,” at “mga sugo” bilang natural at malinaw na mga salitang pangministeryo. Pinanatili ang parallel na “Kung tungkol…” at ang maigsi, appositional na “ang kaluwalhatian ng Mesiyas” upang hindi alisin ang retorikal na tensiyon ng orihinal.
