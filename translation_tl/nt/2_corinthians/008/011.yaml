  text: νυνὶ δὲ καὶ τὸ ποιῆσαι ἐπιτελέσατε, ὅπως καθάπερ ἡ προθυμία τοῦ θέλειν οὕτως καὶ τὸ ἐπιτελέσαι ἐκ τοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/011.yaml
  text: But now complete the doing of it also[a], so that just as there was the eagerness to will it[b], so also there may be the completion from what you have.
translation:
  language: tl
  text: Ngayon, tapusin din ninyo ang paggawa nito[a], upang kung paanong may kusa kayong gawin ito, gayundin ay matapos ninyo ito ayon sa kung ano ang mayroon kayo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tapusin ninyo ang pagtupad nito.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ayon sa kasalukuyan ninyong kakayahan o tinataglay.
    reason: lexical_clarification
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ngunit ngayon
  rationale: Pinananatili nito ang banayad na pagsalungat at ang paglipat mula sa naunang hangarin tungo sa kasalukuyang pagkilos.
- source_word: τὸ ποιῆσαι
  choice: ang pagsasagawa nito
  rationale: Ipinahahayag nito ang kongkretong gawaing napagpasiyahan na at iniuugnay iyon sa ambagang tinatalakay sa konteksto.
- source_word: ἐπιτελέσατε
  choice: tapusin
  rationale: Tumpak at natural nitong ipinahahayag ang pagdadala sa isang gawain hanggang sa kaganapan.
- source_word: ἡ προθυμία τοῦ θέλειν
  choice: masigasig ang inyong pagnanais
  rationale: Pinagsasama nito sa natural na Filipino ang kahandaan o sigasig (προθυμία) at ang kusang pagnanais (θέλειν), nang hindi ginagawang mismong pagkilos ang pagnanais.
- source_word: οὕτως καὶ τὸ ἐπιτελέσαι
  choice: gayundin ay lubos ninyo itong maisakatuparan
  rationale: Pinananatili nito ang paghahambing sa pagitan ng masigasig na pagnanais at ng ganap na pagtupad, pati ang pag-uulit ng diwa ng ἐπιτελέω.
- source_word: ἐκ τοῦ ἔχειν
  choice: mula sa kung ano ang mayroon kayo
  rationale: 'Pinananatili ang ideya ng pinagmumulan o sukat ng ambag: ang pagsasakatuparan ay nagmumula sa kasalukuyang taglay nila.'
theological_decisions:
- issue: Pagbibigay ayon sa kasalukuyang kakayahan
  choice: Ang ipinangakong ambag ay dapat tapusin mula sa kung ano ang mayroon sila ngayon.
  alternative: Isang pangkalahatang utos na tuparin ang anumang mabuting hangarin kahit lampas sa sariling kakayahan.
  rationale: Ang malapit na konteksto ay ang ambag ng mga taga-Corinto, at nililimitahan ng ἐκ τοῦ ἔχειν ang pagsasakatuparan sa kung ano ang aktuwal nilang taglay. Hindi nito hinihingi ang pagbibigay nang lampas sa kanilang kakayahan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “masigasig ang inyong pagnanais” upang maging natural ang articular-infinitive construction, samantalang pinanatili ang pagkakaiba ng pagnanais at aktuwal na pagtupad.
