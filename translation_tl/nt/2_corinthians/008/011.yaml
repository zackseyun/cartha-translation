revisions:
- from: Ngunit ngayon, tapusin din ninyo ang pagsasagawa nito[a], upang kung paanong masigasig ang inyong pagnanais, gayundin ay lubos ninyo itong maisakatuparan mula sa kung ano ang mayroon kayo.[b]
  to: Ngayon, tapusin din ninyo ang paggawa nito[a], upang kung paanong may kusa kayong gawin ito, gayundin ay matapos ninyo ito ayon sa kung ano ang mayroon kayo[b].
  rationale: Inayos ang mga pananalita upang maging mas natural sa modernong Filipino, habang pinananatili ang paghahambing ng naunang kusang kahandaan at ang kasalukuyang pagtatapos ng gawain. Ang “ayon sa kung ano ang mayroon kayo” ay naglilinaw sa saklaw ng ἐκ τοῦ ἔχειν nang hindi nagdaragdag ng kahulugang doktrinal o ginagawang tahasang “ambag” ang hindi pinangalanan sa mismong talata.
