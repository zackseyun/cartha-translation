source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἀλλὰ καὶ χειροτονηθεὶς ὑπὸ τῶν ἐκκλησιῶν συνέκδημος ἡμῶν ⸀σὺν τῇ χάριτι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν πρὸς τὴν ⸀αὐτοῦ τοῦ κυρίου δόξαν καὶ προθυμίαν ἡμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/019.yaml
  text: And not only that[d][c][b][a], but he was also appointed by the churches as our traveling companion with this gracious gift that is being administered by us for the glory of the Lord himself and our eagerness—
translation:
  language: tl
  text: At hindi lamang iyon, kundi pinili rin siya ng mga iglesya[a] upang maging kasama namin sa paglalakbay kaugnay ng kaloob na ito ng biyaya[b][d], na pinangangasiwaan namin para sa kaluwalhatian ng Panginoon mismo[c] at sa aming kasigasigan—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “itinalaga” o “inihalal” ng mga iglesya.
    reason: lexical_alternative
  - marker: b
    text: O “biyaya”; sa konteksto ng ambagan, ang “kaloob na ito ng biyaya” ay nagpapahayag sa χάρις bilang isang kaloob na bunga ng biyaya.
    reason: lexical_alternative
  - marker: c
    text: O “kaluwalhatian ng kanyang Panginoon”; maaari ring unawain ang pariralang Griyego bilang “kaluwalhatian ng Panginoon.”
    reason: alternative_reading
  - marker: d
    text: O “upang maging kasama namin sa paglalakbay kasama ng kaloob na ito ng biyaya.”
    reason: syntactic_alternative
lexical_decisions:
- source_word: χειροτονηθεὶς
  choice: pinili
  rationale: Ipinahihiwatig ng salita na itinalaga o pinili siya ng mga iglesya. Likas sa modernong Tagalog ang “pinili” at hindi nito ipinapalagay na gumamit sila ng isang makabagong pormal na paraan ng pagboto.
- source_word: ἐκκλησιῶν
  choice: mga iglesya
  rationale: Sa gamit ni Pablo, tumutukoy ito sa mga lokal na kapulungan ng mga Cristiano; malinaw at karaniwan sa Tagalog ang “mga iglesya.”
- source_word: συνέκδημος
  choice: kasama namin sa paglalakbay
  rationale: Tuwirang ipinapahayag nito ang kasama sa isang paglalakbay at natural itong pakinggan sa Tagalog.
- source_word: χάριτι
  choice: kaloob na ito ng biyaya
  rationale: Sa konteksto ng ambagan, ang χάρις ay tumutukoy sa kongkretong kaloob na bunga ng biyaya. Pinananatili ng parirala ang parehong diwa ng kaloob at biyaya.
- source_word: διακονουμένῃ
  choice: pinangangasiwaan
  rationale: Inilalarawan nito ang maingat na paghawak at pagsasagawa ng ambagan nina Pablo; ang “pinangangasiwaan” ay angkop sa praktikal at katiwalaang aspekto nito.
- source_word: πρὸς
  choice: para sa
  rationale: Dito ay ipinahihiwatig ng πρὸς ang layunin o tunguhin ng pangangasiwa.
- source_word: αὐτοῦ τοῦ κυρίου
  choice: Panginoon mismo
  rationale: Maaaring idiin ng αὐτοῦ ang τοῦ κυρίου. Likas sa Tagalog ang “Panginoon mismo,” habang itinatala sa talababa ang iba pang posibleng pag-unawa.
- source_word: δόξαν
  choice: kaluwalhatian
  rationale: Ito ang karaniwan at teolohikal na makabuluhang katumbas ng δόξα sa ganitong konteksto.
- source_word: προθυμίαν
  choice: kasigasigan
  rationale: Ipinahihiwatig nito ang kusang-loob na kahandaan at sigasig. Iniiwasan ng “kasigasigan” ang pagdaragdag ng tahasang layon na wala sa Griyego.
theological_decisions:
- issue: Ang puwersa at tinutukoy ng αὐτοῦ sa πρὸς τὴν αὐτοῦ τοῦ κυρίου δόξαν
  choice: “kaluwalhatian ng Panginoon mismo,” na inuunawa ang αὐτοῦ bilang pampadiin sa “Panginoon”
  alternative: “kaluwalhatian ng kanyang Panginoon” o “kaluwalhatian ng Panginoon”
  rationale: Siksik at may higit sa isang posibleng pagsusuri ang pariralang Griyego. Pinananatili ng pangunahing salin ang diin sa Panginoon, at inilalahad sa talababa ang tunay na alternatibong pagbasa.
- issue: Ang ugnayan ng προθυμίαν ἡμῶν sa layunin ng pangangasiwa
  choice: “bilang pagpapakita ng aming kasigasigan”
  alternative: Mas pormal ngunit alanganing “para sa … aming kasigasigan”
  rationale: Saklaw ng πρὸς ang “kaluwalhatian” at “kasigasigan.” Ginagawang malinaw at natural sa Tagalog ng “bilang pagpapakita” ang ugnayang ito nang hindi tinutukoy kung ano ang tahasang layon ng kanilang kasigasigan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “iglesya,” “biyaya,” “kaluwalhatian,” at “Panginoon” bilang pamilyar na bokabularyong biblikal. Ang pangungusap ay nagtatapos sa gitling sapagkat nagpapatuloy ang kaisipan sa kasunod na talata.
