  terminology: Ang “mga iglesya,” “kaloob na ito ng biyaya,” “pinangangasiwaan,” “kaluwalhatian,” at “Panginoon” ay angkop. Pinanatili ang “kasigasigan” para sa προθυμία nang hindi nagdaragdag ng tahasang layon.
