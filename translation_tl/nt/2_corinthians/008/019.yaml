  to: At hindi lamang iyon, kundi pinili rin siya ng mga iglesya[a] upang maging kasama namin sa paglalakbay kaugnay ng kaloob na ito ng biyaya[b][d], na pinangangasiwaan namin para sa kaluwalhatian ng Panginoon mismo[c] at sa aming kasigasigan—
