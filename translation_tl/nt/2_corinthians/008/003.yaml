  text: ὅτι κατὰ δύναμιν, μαρτυρῶ, καὶ ⸀παρὰ δύναμιν, αὐθαίρετοι
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/003.yaml
  text: For[a], I testify, they gave according to their ability, and beyond their ability, of their own accord[b],
translation:
  language: tl
  text: Sapagkat nagpapatotoo ako na nagbigay sila ayon sa kanilang kakayahan, at higit pa sa kanilang kakayahan, nang kusa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kusang-loob” o “ayon sa sarili nilang pasiya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag na sumusuporta sa naunang pahayag; likas sa Tagalog ang “Sapagkat” sa ganitong ugnayang pangdiskurso.
- source_word: κατὰ δύναμιν
  choice: ayon sa kanilang kakayahan
  rationale: Ipinahahayag ng κατά kasama ng δύναμις ang sukat o pamantayan; malinaw nitong tinutukoy ang abot ng kanilang kakayahang magbigay.
- source_word: μαρτυρῶ
  choice: nagpapatotoo ako
  rationale: Pinananatili nito ang mariin at personal na pagpapatunay ni Pablo sa kasalukuyang pahayag.
- source_word: καὶ παρὰ δύναμιν
  choice: at higit pa sa kanilang kakayahan
  rationale: Ipinakikita ng παρά na nalampasan nila ang karaniwang hangganan, habang pinananatili ang retorikal na pagtutugma sa naunang parirala.
- source_word: αὐθαίρετοι
  choice: nang kusa
  rationale: Likas at malinaw itong nagpapahayag na kumilos sila sa sarili nilang pasiya at hindi dahil sa pamimilit.
theological_decisions:
- issue: Ipinahihiwatig na pandiwa kasama ng αὐθαίρετοι
  choice: Idinagdag ang “nagbigay sila” mula sa konteksto upang mabuo nang natural ang pangungusap sa Tagalog.
  alternative: 'Mas literal ngunit putol na anyo: “mga kusang-loob.”'
  rationale: Elliptical ang Griyego, at malinaw mula sa nakapaligid na konteksto na pagbibigay ang kilos. Hindi nagdaragdag ng bagong ideya ang pagsasaad sa ipinahihiwatig na pandiwa.
translation_notes:
  register: Makabagong Filipino Tagalog na simple, marangal, at natural. Pinanatili ang personal na pagpapatotoo ni Pablo at ang paghahambing sa pagitan ng kaya nila at ng higit pa rito.
