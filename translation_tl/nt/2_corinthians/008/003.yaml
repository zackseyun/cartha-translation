  source_fidelity: 'Tumpak ang pagsasalin sa bawat pangunahing elemento ng Griyego: ang ὅτι bilang paliwanag na “Sapagkat,” ang κατὰ δύναμιν bilang “ayon sa kanilang kakayahan,” ang parentetikong μαρτυρῶ bilang “nagpapatotoo ako,” ang παρὰ δύναμιν bilang “higit pa sa kanilang kakayahan,” at ang αὐθαίρετοι bilang kusang pagkilos. Ang “nagbigay sila” ay wastong ipinahihiwatig mula sa agarang konteksto at hindi nagdaragdag ng kahulugan.'
