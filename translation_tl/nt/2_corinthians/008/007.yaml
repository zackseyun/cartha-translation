source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ ἐν παντὶ περισσεύετε, πίστει καὶ λόγῳ καὶ γνώσει καὶ πάσῃ σπουδῇ καὶ τῇ ἐξ ⸂ἡμῶν ἐν ὑμῖν⸃ ἀγάπῃ, ἵνα καὶ ἐν ταύτῃ τῇ χάριτι περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/007.yaml
  text: But just as you abound in everything—in faith and speech and knowledge and all diligence and in our love in you—see that you also abound in this grace[a][b].
translation:
  language: tl
  text: Ngunit kung paanong nananagana kayo sa lahat ng bagay—sa pananampalataya, sa pananalita, sa kaalaman, sa buong pagsisikap, at sa aming pag-ibig na nasa inyo[a]—gayundin ay managana kayo sa biyayang ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Posible rin: “inyong pag-ibig sa amin.” Mahirap ang pariralang Griyego, at mababasa sa ilang manuskrito ang “inyong pag-ibig na nasa amin.”'
    reason: alternative_reading
  - marker: b
    text: Ibig sabihin, ang mapagbiyayang gawaing ito ng pagbibigay.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσεύετε / περισσεύητε
  choice: nananagana / managana
  rationale: Pinananatili ng “managana” ang larawan ng kasaganaan sa dalawang paglitaw ng pandiwa at likas itong gamitin kapuwa sa mga katangiang taglay na nila at sa panawagang lumago sa pagbibigay.
- source_word: ἐν παντί
  choice: sa lahat ng bagay
  rationale: Pinananatili nito ang malawak na saklaw ng parirala at natural na ipinakikilala ang kasunod na talaan.
- source_word: πίστει
  choice: pananampalataya
  rationale: Ito ang karaniwang kahulugan sa ganitong talaan ng mga katangiang Cristiano; hindi malinaw na hinihingi ng konteksto ang “katapatan” bilang pangunahing salin.
- source_word: λόγῳ
  choice: pananalita
  rationale: Sa talaang ito, malamang na tumutukoy ito sa kakayahang magpahayag o magsalita; mas natural ito kaysa literal na “salita.”
- source_word: γνώσει
  choice: kaalaman
  rationale: Direkta at likas na katumbas na angkop sa talaan.
- source_word: πάσῃ σπουδῇ
  choice: buong pagsisikap
  rationale: Ipinahahayag nito ang kasigasigan at masikap na pagkilos na saklaw ng σπουδή sa natural na modernong Tagalog.
- source_word: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: sa aming pag-ibig na nasa inyo
  rationale: Sinusundan nito ang piniling tekstong Griyego at pinananatili ang mahirap na ugnayan ng ἐξ ἡμῶν at ἐν ὑμῖν nang hindi lubusang nilulutas ang kahulugan. Inilalahad sa talababa ang posibleng ibang pagkaunawa at baryanteng teksto.
- source_word: χάριτι
  choice: biyaya
  rationale: Pinananatili nito ang teolohikal na lalim ng χάρις, samantalang nililinaw ng talababa na sa kontekstong ito ay tumutukoy ito sa mapagbiyayang gawain ng pagbibigay.
theological_decisions:
- issue: Kahulugan ng χάρις sa konteksto ng abuloy para sa mga banal
  choice: “biyaya” sa pangunahing teksto
  alternative: “mapagbiyayang gawain,” “kaloob,” o “gawa ng biyaya”
  rationale: Ang gamit ni Pablo ay may teolohikal na lalim at hindi lamang terminong pananalapi. Pinananatili ng “biyaya” ang lalim na iyon, habang tinutukoy ng talababa ang kongkretong gawain ng pagbibigay.
- issue: Pagkaunawa sa τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: “aming pag-ibig na nasa inyo”
  alternative: “inyong pag-ibig sa amin”
  rationale: Mahirap ang sintaks at may mahalagang baryante sa mga manuskrito. Ang pangunahing salin ay malapit sa SBLGNT at hindi tahimik na nilulutas ang tunay na kalabuan; itinatala ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “managana” upang mapanatili ang larawan ng kasaganaan, at iniwasang gawing sobrang teknikal o denominasyonal ang mga salita. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto.
