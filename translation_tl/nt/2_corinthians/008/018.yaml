  text: συνεπέμψαμεν δὲ μετ’ αὐτοῦ τὸν ἀδελφὸν οὗ ὁ ἔπαινος ἐν τῷ εὐαγγελίῳ διὰ πασῶν τῶν ἐκκλησιῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/018.yaml
  text: And we sent with him the brother whose praise in the gospel is throughout all the churches—[a]
translation:
  language: tl
  text: At isinugo rin namin kasama niya ang kapatid na pinupuri kaugnay ng ebanghelyo sa lahat ng mga iglesya—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang kapatid na kinikilala kaugnay ng ebanghelyo sa lahat ng mga iglesya.”
    reason: Ipinakikita nito ang alternatibong diwa ng ἔπαινος bilang pagkilala o pagpuri, habang pinananatili ang malawak na kahulugan ng kaugnayan nito sa ebanghelyo.
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: isinugo naming kasama
  rationale: Ipinahahayag ng aorist ang naganap na pagpapadala, at ipinakikita ng σύν na isinugo ang kapatid bilang kasama ng naunang tinutukoy na tao.
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay, hindi matinding pagsalungat.
- source_word: μετ’ αὐτοῦ
  choice: kasama niya
  rationale: Tuwirang ipinahahayag ng μετά na may genitive ang pagsama sa taong tinutukoy.
- source_word: τὸν ἀδελφόν
  choice: ang kapatid
  rationale: Tumutukoy ito sa isang tiyak at kilalang lalaking kapwa mananampalataya; hindi idinagdag ang “aming,” na wala sa Griyego.
- source_word: οὗ ὁ ἔπαινος
  choice: na pinupuri
  rationale: Natural itong pagpapahayag sa Tagalog ng nominal na pariralang “na ang papuri sa kanya,” habang pinananatili ang diwa ng papuri nang hindi tinutukoy kung anong partikular na tungkulin ang dahilan nito.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: kaugnay ng ebanghelyo
  rationale: Pinananatili nitong malawak ang ugnayan ng kanyang papuri sa ebanghelyo at hindi ito nililimitahan sa pangangaral o sa isang pormal na ministeryo.
- source_word: διὰ πασῶν τῶν ἐκκλησιῶν
  choice: sa lahat ng iglesya
  rationale: Sa konteksto, ipinahahayag ng διά na laganap ang papuri sa kabuuan ng mga iglesya; ang maikling anyong Tagalog ay natural at malinaw.
- source_word: ἐκκλησιῶν
  choice: mga iglesya
  rationale: Karaniwan itong tumutukoy sa mga lokal na kapulungan ng mga Cristiano, at “iglesya” ang malinaw at kinikilalang katumbas sa modernong Tagalog.
theological_decisions:
- issue: Pagkakakilanlan at katayuan ng ἀδελφός
  choice: “ang kapatid,” bilang isang tiyak na lalaking Cristianong kamanggagawa na kilala ng mga taga-Corinto
  alternative: “isang kapwa mananampalataya”
  rationale: Ang masculine singular na may article, kasama ng konteksto ng paglalakbay, ay tumutukoy sa isang partikular na lalaki. Pinananatili nito ang personal na pagtukoy nang hindi nagdaragdag ng impormasyong wala sa teksto.
- issue: Saklaw ng ἐν τῷ εὐαγγελίῳ
  choice: “kaugnay ng ebanghelyo” nang hindi tinutukoy ang isang partikular na gawaing pangministeryo
  alternative: “sa pangangaral ng ebanghelyo” o “sa gawain para sa ebanghelyo”
  rationale: Hindi tahasang sinasabi ng Griyego na pangangaral o isang opisyal na ministeryo ang tinutukoy. Pinananatili ng salin ang mas malawak at tunay na hindi tiyak na ugnayan.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “isinugo naming kasama niya” upang maging malinaw ang kasamang pagpapadala, at “kaugnay ng ebanghelyo” upang maiwasang magpasok ng mas makitid na paliwanag gaya ng pangangaral o pormal na ministeryo. Pinanatili ang pahabang gitling dahil nagpapatuloy ang pangungusap sa kasunod na talata.
