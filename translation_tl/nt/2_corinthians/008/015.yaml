id: 2CO.8.15
reference: 2 Corinthians 8:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καθὼς γέγραπται· Ὁ τὸ πολὺ οὐκ ἐπλεόνασεν, καὶ ὁ τὸ ὀλίγον οὐκ ἠλαττόνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/015.yaml
  text: 'as it is written: The one who had much did not have too much[a], and the one who had little did not have too little.'
translation:
  language: tl
  text: 'gaya ng nasusulat: “Ang may marami ay hindi nagkaroon ng labis, at ang may kaunti ay hindi kinulang.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal ayon sa Exodo 16:18: “Ang nagtipon ng marami ay walang labis, at ang nagtipon ng kaunti ay hindi kinulang.”'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: gaya ng nasusulat
  rationale: Karaniwang pormula ito sa pagsipi sa Kasulatan. Ipinahihiwatig ng “nasusulat” ang nananatiling bisa ng nakasulat na patotoo.
- source_word: Ὁ τὸ πολὺ
  choice: Ang may marami
  rationale: 'Ang artikulo at pang-uring neuter ay ginagamit bilang pangngalan: “ang taong may marami.” Hindi idinagdag sa pangunahing teksto ang “nagtipon” sapagkat walang hayag na pandiwang ganoon sa sipi ni Pablo.'
- source_word: ἐπλεόνασεν
  choice: hindi nagkaroon ng labis
  rationale: Ipinapahayag nito na walang sobrang natira o naging higit sa kailangan. Likas ito sa Filipino at pinananatili ang diwa ng pantay na kinalabasan.
- source_word: ὁ τὸ ὀλίγον
  choice: ang may kaunti
  rationale: Pinananatili nito ang tuwirang pagkakatulad sa “ang may marami” nang hindi ipinapasok sa pangunahing teksto ang pandiwang “nagtipon” mula sa konteksto ng Exodo.
- source_word: ἠλαττόνησεν
  choice: hindi kinulang
  rationale: Ang pandiwa ay tumutukoy sa pagkakaroon ng kakulangan o hindi pagsapat. Ang “hindi kinulang” ay maikli, natural, at malinaw sa modernong Filipino.
theological_decisions:
- issue: Paggamit ni Pablo sa sipi mula sa Exodo 16:18 sa konteksto ng pagbabahagi at pagkakapantay-pantay
  choice: Isinalin ang talata ayon sa naging kalagayan ng pag-aari o panustos, nang hindi tahasang idinaragdag ang “nagtipon.”
  alternative: “Ang nagtipon ng marami ay walang labis, at ang nagtipon ng kaunti ay hindi kinulang.”
  rationale: Sa agarang konteksto, ginagamit ni Pablo ang Kasulatan upang suportahan ang sapat at makatarungang panustos sa lahat. Gayunman, ang ugnayan sa pagtitipon ng manna sa Exodo ay tunay at kaya inilagay sa talababa bilang mas literal na pagbasa ayon sa pinagkunang sipi.
translation_notes:
  register: Modernong Filipino na likas ngunit marangal. Ginamit ang “may marami/may kaunti” upang mapanatili ang maigsi at balanseng estruktura ng Griyego; iniwasan ang mas kolokyal na “sobra” sa pangunahing teksto pabor sa “labis.”
