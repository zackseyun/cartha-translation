  text: μετὰ πολλῆς παρακλήσεως δεόμενοι ἡμῶν, τὴν χάριν καὶ τὴν κοινωνίαν τῆς διακονίας τῆς εἰς τοὺς ἁγίους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/004.yaml
  text: begging us with much urging for the grace and the fellowship of this ministry to the saints—[a]
translation:
  language: tl
  text: mahigpit silang nakiusap sa amin para sa biyaya at pakikibahagi sa paglilingkod para sa mga banal—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa pribilehiyo at pakikilahok sa paglilingkod para sa mga banal.”
    reason: Pinananatili ang mga posibleng kontekstuwal na kahulugan ng χάρις bilang “pribilehiyo” at κοινωνία bilang “pakikilahok.”
lexical_decisions:
- source_word: μετὰ πολλῆς παρακλήσεως
  choice: buong taimtim
  rationale: Sa konteksto ng δεόμενοι, ang παράκλησις ay mas tumutukoy sa masidhi at taimtim na pakiusap kaysa sa kaaliwan o panghihikayat. Likas sa modernong Tagalog ang pariralang ito at naipahihiwatig nito ang tindi ng pakiusap.
- source_word: δεόμενοι ἡμῶν
  choice: nakiusap sa amin
  rationale: Ang δέομαι ay nangangahulugang humiling, makiusap, o magmakaawa. Ang “nakiusap sa amin” ay malinaw at marangal sa kasalukuyang Tagalog; kasama ng “buong taimtim,” naipapahayag nito ang lakas ng kahulugan nang hindi nagiging melodramatiko.
- source_word: τὴν χάριν
  choice: biyaya
  rationale: Malawak ang saklaw ng χάρις—biyaya, pabor, o pribilehiyo. Pinananatili ng “biyaya” ang mahalagang bokabularyo ni Pablo at ang likas na kalabuan ng salita, samantalang nililinaw ng talababa ang kontekstuwal na diwang “pribilehiyo.”
- source_word: τὴν κοινωνίαν
  choice: pakikibahagi
  rationale: Sa kontekstong ito ng pagtulong, ang κοινωνία ay aktuwal na pakikilahok at pagbabahagi, hindi lamang samahan. Natural at eksakto rito ang “pakikibahagi,” habang pinananatili ang ugnayang panlipunan ng gawain.
- source_word: τῆς διακονίας
  choice: sa paglilingkod
  rationale: Ang διακονία ay praktikal na paglilingkod o ministeryo para sa nangangailangan. Ang “paglilingkod” ay madaling maunawaan at hindi nagpapahiwatig na ito ay limitado sa isang pormal na katungkulan sa iglesya.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: para sa mga banal
  rationale: Ang εἰς ay nagpapakita ng tunguhin o kapakinabangan ng paglilingkod. Pinananatili ng “mga banal” ang karaniwang katawagan ni Pablo sa mga mananampalataya at hindi ito nililimitahan sa isang natatanging uri ng kinanonisang tao.
theological_decisions:
- issue: Kahulugan ng χάρις at kaugnayan nito sa κοινωνία
  choice: biyaya at pakikibahagi
  alternative: pribilehiyo at pakikilahok
  rationale: Pinananatili sa pangunahing teksto ang dalawang pangngalang Griyego at ang teolohikal na bigat ng χάρις, sa halip na tahimik na gawing iisang ideya ang parirala. Inilalahad sa talababa ang mas kontekstuwal na pagbasa.
- issue: Pagpapakahulugan sa ἅγιοι
  choice: mga banal
  alternative: banal na bayan ng Diyos
  rationale: Karaniwang tawag ito ni Pablo sa mga mananampalataya. Ang “mga banal” ay maikli at tapat sa salita nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Nananatili ang anyong dugtong ng talata sa pamamagitan ng gitling sa hulihan, gaya ng sintaks ng konteksto. Ginamit ang “mga banal” bilang katawagan sa lahat ng mananampalataya, hindi sa isang natatanging pangkat.
