  text: Χάρις δὲ τῷ θεῷ τῷ ⸀διδόντι τὴν αὐτὴν σπουδὴν ὑπὲρ ὑμῶν ἐν τῇ καρδίᾳ Τίτου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/016.yaml
  text: But thanks be to God[a], who puts the same earnestness for you into Titus's heart,
translation:
  language: tl
  text: Ngunit salamat sa Diyos na naglalagay sa puso ni Tito ng gayunding malasakit para sa inyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χάρις δὲ τῷ θεῷ
  choice: Ngunit salamat sa Diyos
  rationale: Ang χάρις na may datibong τῷ θεῷ ay pormula ng pasasalamat, hindi pagtukoy sa biyaya. Ipinahihiwatig ng δέ ang banayad na paglipat o pagsalungat, kaya natural ang “Ngunit.”
- source_word: τῷ διδόντι
  choice: na naglalagay
  rationale: Literal na “nagbibigay,” ngunit kasama ng pariralang “sa puso,” mas natural sa Tagalog ang “naglalagay” at napapanatili nito ang diwa ng Diyos bilang pinagmumulan ng saloobin ni Tito.
- source_word: τὴν αὐτὴν σπουδὴν
  choice: ng gayunding malasakit
  rationale: Sa konteksto, ang σπουδή ay taimtim at masigasig na pagmamalasakit, hindi lamang sipag. Ang “gayunding” ay nagpapanatili sa paghahambing na ipinahihiwatig ng αὐτήν.
- source_word: ὑπὲρ ὑμῶν
  choice: para sa inyo
  rationale: Ipinapahayag ng ὑπέρ ang malasakit na nakatuon sa mga taga-Corinto; malinaw at likas sa modernong Tagalog ang “para sa inyo.”
- source_word: ἐν τῇ καρδίᾳ Τίτου
  choice: sa puso ni Tito
  rationale: Pinananatili nito ang metapora ng puso bilang kalooban o panloob na saloobin. Dahil sa pandiwang “naglalagay,” natural na Tagalog ang “sa puso ni Tito.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “malasakit” upang ipahayag ang taimtim na concern/eagerness ng σπουδή nang hindi ito nililimitahan sa simpleng kasipagan.
