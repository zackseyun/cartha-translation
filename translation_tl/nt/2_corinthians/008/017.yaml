  text: For he accepted the appeal[a], but being more earnest[d][c][b], he went to you of his own accord.
translation:
  language: tl
  text: Sapagkat tinanggap niya ang pakiusap[a]. Ngunit dahil lalo pa siyang masigasig[b], kusa[c] siyang pumunta sa inyo[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “paghimok” o “kahilingan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lalo siyang sabik” o “lalo siyang masikap.”
    reason: lexical_alternative
  - marker: c
    text: O “sa sarili niyang pagkukusa.”
    reason: lexical_alternative
  - marker: d
    text: O “umalis siya papunta sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikita ang sanhi o paliwanag kaugnay ng pasasalamat sa naunang talata, nang hindi nilulutas nang labis kung ito ay tuwirang sanhi o paliwanag.
- source_word: παράκλησιν
  choice: pakiusap
  rationale: Sa konteksto, tumutukoy ito sa paghimok o kahilingan ni Pablo kay Tito na gampanan ang atas, hindi pangunahin sa pag-aliw.
- source_word: ἐδέξατο
  choice: tinanggap
  rationale: Likas na ipinahahayag sa Filipino ang positibong pagtugon ni Tito sa pakiusap.
- source_word: σπουδαιότερος
  choice: lalo siyang masigasig
  rationale: Pinananatili ang pahambing na diwa ng heightened zeal; ang “masigasig” ay natural at maaaring tumukoy sa pananabik at masikap na pagkilos.
- source_word: ὑπάρχων
  choice: dahil ... siyang
  rationale: Ginawang likas na sugnay sa Filipino ang participle habang pinananatili ang ugnayang nagpapaliwanag sa pagkilos ni Tito.
- source_word: αὐθαίρετος
  choice: kusa
  rationale: Maikli at malinaw na ipinahahayag na ginawa ito ni Tito nang bukal sa sarili at hindi dahil lamang sa utos.
- source_word: ἐξῆλθεν πρὸς ὑμᾶς
  choice: pumunta sa inyo
  rationale: Natural na Filipino para sa pagkilos mula sa kinaroroonan ni Pablo patungo sa mga taga-Corinto; inilalagay sa talababa ang mas literal na direksiyonal na pagbasa.
