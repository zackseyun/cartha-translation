  text: Γνωρίζομεν δὲ ὑμῖν, ἀδελφοί, τὴν χάριν τοῦ θεοῦ τὴν δεδομένην ἐν ταῖς ἐκκλησίαις τῆς Μακεδονίας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/001.yaml
  text: We make known to you[a], brothers, the grace of God that has been given among the churches of Macedonia[b],
translation:
  language: tl
  text: Ipinababatid namin sa inyo, mga kapatid[a], ang biyaya ng Diyos na ipinagkaloob sa mga iglesya sa Macedonia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” sa Tagalog ay maaaring tumukoy sa mga lalaki at babae sa buong kongregasyon. Ang salitang Griyego ay nasa anyong panlalaki ngunit madalas gamitin sa ganitong malawak na pagtawag.
    reason: lexical_alternative
  - marker: b
    text: Ang “biyaya ng Diyos” ay maaaring tumukoy kapuwa sa kagandahang-loob ng Diyos at sa mapagbigay na pagkilos na ibinunga ng biyayang iyon sa mga iglesya sa Macedonia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζομεν
  choice: Ipinababatid namin
  rationale: Tuwirang ipinapahayag ang diwang ‘ipaalam’ o ‘ipabatid,’ habang pinananatili ang pangkasalukuyang aspekto at marangal na himig ng liham.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang panandang transisyon ito rito. Sa natural na Tagalog, hindi kailangang lagyan ng ‘ngayon’ o ‘ngunit,’ na maaaring magdagdag ng temporal o kontrastibong diwa na wala sa konteksto.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Likas at tuwirang katumbas ng datibong di-tuwirang layon.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang ‘kapatid’ sa Tagalog ay hindi nakatali sa kasarian, kaya natural nitong naipahihiwatig ang buong kongregasyon nang hindi lumalayo sa pampamilyang tawag ni Pablo.
- source_word: χάριν τοῦ θεοῦ
  choice: ang biyaya ng Diyos
  rationale: Pinananatili ng ‘biyaya’ ang malawak na kahulugan ng χάρις—ang kagandahang-loob ng Diyos at ang bunga nitong mapagbigay na pagkilos—sa halip na paliitin ito sa ‘kaloob’ o ‘pagkamapagbigay.’
- source_word: τὴν δεδομένην
  choice: na ipinagkaloob
  rationale: Ang anyong balintiyak ay pinananatili at ang ‘ipinagkaloob’ ay angkop sa biyayang mula sa Diyos. Bagaman hindi tahasang naipakikita sa Tagalog ang perpektong aspekto, naihahayag nito ang biyayang naibigay at nananatiling mabisa.
- source_word: ἐν ταῖς ἐκκλησίαις
  choice: sa mga iglesya
  rationale: Ang ‘sa’ ay likas na Tagalog at maaaring tumukoy kapuwa sa kinaroroonan at sa saklaw kung saan kumikilos ang biyaya.
- source_word: τῆς Μακεδονίας
  choice: sa Macedonia
  rationale: Mas natural sa Tagalog para sa mga kongregasyong matatagpuan sa rehiyong iyon kaysa ‘ng Macedonia,’ habang pinananatili ang parehong reperensiya.
theological_decisions:
- issue: Kahulugan ng ‘biyaya ng Diyos’ sa konteksto
  choice: Biyaya ng Diyos na kumikilos sa mga iglesya sa Macedonia at namumunga sa kanilang mapagbigay na pagkilos
  alternative: Ang mismong abuloy o kaloob; o, mas pangkalahatan, ang pabor ng Diyos sa mga iglesyang iyon
  rationale: Hindi pinapalitan ang ‘biyaya’ ng ‘abuloy,’ ‘kaloob,’ o ‘pagkamapagbigay,’ upang manatiling bukás ang ugnayan ng pinagmulan—ang kagandahang-loob ng Diyos—at ng bunga nito sa mga taga-Macedonia.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘ipinababatid’ upang mapanatili ang pormal na himig ng liham, ‘mga kapatid’ bilang natural at inklusibong pampamilyang tawag, at ‘mga iglesya’ bilang karaniwang terminong Kristiyano.
