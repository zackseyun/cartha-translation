  text: Οὐ κατ’ ἐπιταγὴν λέγω ἀλλὰ διὰ τῆς ἑτέρων σπουδῆς καὶ τὸ τῆς ὑμετέρας ἀγάπης γνήσιον δοκιμάζων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/008.yaml
  text: I am not saying this as a command[b][a], but through the earnestness of others I am also testing the genuineness of your love.
translation:
  language: tl
  text: Hindi ko ito sinasabi bilang utos, kundi sa pamamagitan ng kasigasigan ng iba[a] ay sinusubok ko rin[b] kung tunay ang inyong pag-ibig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “taimtim na pananabik ng iba” o “pagsisikap ng iba”; ang σπουδή ay maaaring tumukoy sa kasigasigan, pananabik, o masikap na pagsisikap.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pinatutunayan ko rin” o “inilalagay ko rin sa pagsubok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιταγή
  choice: utos
  rationale: Likas at malinaw na katumbas ito ng isang may-awtoridad na utos, at pinananatili ang tahasang pagtanggi ni Pablo na nag-uutos siya rito.
- source_word: διὰ τῆς ἑτέρων σπουδῆς
  choice: sa pamamagitan ng kasigasigan ng iba
  rationale: Ipinapakita ng parirala ang paraan o kasangkapan; hindi rin nito labis na tinutukoy kung sino ang “iba.”
- source_word: σπουδή
  choice: kasigasigan
  rationale: Saklaw nito ang masikap at taimtim na pananabik na angkop sa konteksto ng bukal na pagbibigay.
- source_word: ἀγάπη
  choice: pag-ibig
  rationale: Karaniwan, malinaw, at kontekstuwal na katumbas; dito, nahahayag ang pag-ibig sa kusang pagbibigay.
- source_word: γνήσιον
  choice: kung tunay
  rationale: Natural sa modernong Tagalog ang sugnay na ito at tapat na ipinahahayag ang pagiging tunay o dalisay ng pag-ibig.
- source_word: δοκιμάζων
  choice: sinusubok ko
  rationale: Ipinahahayag ng kasalukuyang pandiwaring Griyego ang kasabay na ginagawa o layunin ni Pablo habang nagsasalita.
- source_word: καί
  choice: rin
  rationale: 'Pinananatili ang pandagdag na diwa: kasabay ng pagbanggit sa kasigasigan ng iba, sinusubok din ni Pablo ang pag-ibig ng mga taga-Corinto.'
- source_word: ὑμετέρας
  choice: inyong
  rationale: Ang magalang at maramihang anyo ay malinaw na tumutukoy sa pag-ibig ng buong pamayanang taga-Corinto.
theological_decisions:
- issue: Ang paninindigan ni Pablo tungkol sa pagbibigay
  choice: Tahasan niyang sinasabing hindi ito utos, kundi paraan upang masubok kung tunay ang kanilang pag-ibig.
  alternative: Maaaring ituring na pinalalambot lamang ni Pablo ang isang utos nang hindi inaalis ang puwersa nito.
  rationale: Ang Οὐ κατ’ ἐπιταγὴν λέγω ay tuwirang pagtanggi na nagsasalita siya bilang pag-uutos. Pinananatili ng salin ang tensiyon sa pagitan ng awtoridad na apostoliko at kusang pagsunod na nagmumula sa pag-ibig.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kasigasigan” upang likas na maipahayag ang masikap at taimtim na diwa ng σπουδή, at ang “kung tunay ang inyong pag-ibig” upang maiwasan ang mabigat na nominal na pariralang “pagiging tunay ng inyong pag-ibig.”
