translation:
  language: tl
  text: Nag-iingat kami upang walang sinumang makapintas sa amin tungkol sa masaganang kaloob na ito[a] na pinangangasiwaan namin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “masaganang ambag” o “kasaganaang ito.” Ang salitang Griyego ay maaaring tumukoy sa isang sagana o bukas-palad na kontribusyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: στελλόμενοι τοῦτο
  choice: Ginagawa namin ang pag-iingat na ito
  rationale: Ang panggitnang anyo ng στελλόμενοι ay nagpapahiwatig ng pagsasagawa ng hakbang upang maiwasan ang posibleng problema. Likas sa modernong Tagalog ang pariralang ito at malinaw na naihahanda nito ang kasunod na sugnay ng layunin.
- source_word: μή τις ἡμᾶς μωμήσηται
  choice: upang walang sinumang makapintas sa amin
  rationale: Ipinahahayag ng μή na may pasakaling pandiwa ang layuning maiwasan ang pamumuna. Sinasaklaw ng “makapintas” ang diwa ng paghahanap ng mali o pagsisi nang hindi labis na pinatitindi ito.
- source_word: ἐν τῇ ἁδρότητι ταύτῃ
  choice: tungkol sa masaganang kaloob na ito
  rationale: Ang ἐν ay tumutukoy rito sa bagay o usaping maaaring pintasan. Ang ἁδρότης ay maaaring mangahulugang kasaganaan o malaking bukas-palad na ambag; sa konteksto ng koleksiyon, malinaw ngunit hindi labis na mapagpasiya ang “masaganang kaloob.”
- source_word: τῇ διακονουμένῃ ὑφ’ ἡμῶν
  choice: na pinangangasiwaan namin
  rationale: Sa konteksto ng tulong-pinansiyal, ang διακονέω ay tumutukoy sa paglilingkod sa pamamagitan ng pangangasiwa o paghawak sa ambag. Ang “pinangangasiwaan” ay natural at pinananatili ang diwa ng pananagutan.
theological_decisions:
- issue: Layunin ng pag-iingat ni Pablo sa pangangasiwa sa koleksiyon
  choice: Ipakita ang praktikal na pananagutan at pag-iwas sa anumang mapipintas sa pangangasiwa ng kaloob.
  alternative: Unawain lamang ito bilang pag-aayos ng paglalakbay, na hindi binibigyang-diin ang pananagutan.
  rationale: Tahasang iniuugnay ng Griyego ang pag-iingat sa paghadlang na mapintasan sina Pablo hinggil sa masaganang ambag. Pinananatili ng salin ang etikal na diin nang walang idinaragdag na mas malawak na doktrinal na pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “kaloob” upang ipakita ang konteksto ng ambag, habang inilagay sa talababa ang mas literal na mga alternatibo para sa ἁδρότης.
