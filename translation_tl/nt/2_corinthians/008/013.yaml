  text: For I do not mean that there should be relief for others and hardship for you, but equality[a]—
translation:
  language: tl
  text: Sapagkat hindi ko ibig na ang iba ay guminhawa at kayo naman ay mahirapan, kundi na magkaroon ng pagkakapantay-pantay[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, pagiging patas; tumutukoy ang salitang Griyego sa makatarungang balanse, hindi kinakailangang sa eksaktong pagkakapareho ng mga ari-arian.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ ἵνα
  choice: Sapagkat hindi ko ibig na
  rationale: Pinananatili ng “Sapagkat” ang paliwanag na diwa ng γάρ. Ipinahihiwatig ng balangkas na οὐ ... ἵνα ang pagtanggi ni Pablo sa isang layunin; likas sa Tagalog ang paglalantad dito bilang “hindi ko ibig na.”
- source_word: ἄλλοις ἄνεσις
  choice: guminhawa ang iba
  rationale: Sa konteksto ng tulong na salapi, ang ἄνεσις ay pagluwag o ginhawa mula sa pasanin. Ang pandiwang “guminhawa” ay natural at malinaw sa modernong Tagalog.
- source_word: ὑμῖν θλῖψις
  choice: mahirapan naman kayo
  rationale: Ipinakikita ng θλῖψις ang bigat o kahirapang sasapitin ng mga taga-Corinto. Ipinahahayag ng “naman” ang matalim na pagtutulad at pagsalungat sa kalagayan ng iba.
- source_word: ἀλλ’ ἐξ ἰσότητος
  choice: kundi magkaroon ng pagkakapantay-pantay
  rationale: Tuwirang kinakatawan ng “pagkakapantay-pantay” ang ἰσότης, habang likas na isinasama sa pariralang Tagalog ang diwa ng ἐξ bilang batayan o kalagayang nilalayon.
theological_decisions:
- issue: Kahulugan ng ἰσότης sa usapin ng materyal na pagbabahagi
  choice: pagkakapantay-pantay
  alternative: pagiging patas
  rationale: Pinananatili sa pangunahing teksto ang tuwirang katumbas at retorikal na diin ni Pablo. Ipinaliliwanag sa talababa na maaari itong tumukoy sa makatarungang pagtutugma o balanse, hindi kinakailangang sa eksaktong pagkakapareho ng ari-arian.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “guminhawa” at “mahirapan” upang maging natural ang magkatapat na mga pangngalang Griyego nang hindi nawawala ang sosyo-ekonomikong diwa. Ang gitling sa hulihan ay nagpapatuloy sa kaisipan ng kasunod na talata.
