  to: At isinugo rin namin kasama nila ang aming kapatid[a], na maraming ulit naming nasubok sa maraming bagay at napatunayang masikap. Ngunit ngayon ay lalo pa siyang masikap dahil sa malaking tiwala niya sa inyo.
