  text: συνεπέμψαμεν δὲ αὐτοῖς τὸν ἀδελφὸν ἡμῶν ὃν ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις σπουδαῖον ὄντα, νυνὶ δὲ πολὺ σπουδαιότερον πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/022.yaml
  text: And we have sent with them our brother[a], whom we have often tested in many matters and found to be diligent, but who is now even more diligent because of his great confidence in you.
translation:
  language: tl
  text: At isinugo rin namin kasama nila ang aming kapatid[a], na maraming ulit naming nasubok sa maraming bagay at napatunayang masikap. Ngunit ngayon ay lalo pa siyang masikap dahil sa malaking tiwala niya sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin ang hulihan ng talata: “ngunit ngayon ay higit siyang masigasig dahil sa malaking tiwala niya sa inyo.” Sa Griyego, maaaring bahagyang iba ang pagkakaugnay ng pariralang “dahil sa malaking tiwala ... sa inyo,” ngunit nananatili ang diwa na ang kanyang sigasig ay lalo pang tumindi kaugnay ng mga taga-Corinto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: isinugo naming kasama nila
  rationale: Ipinahahayag ng aorist ang naganap na pagsusugo, at pinananatili ng “kasama nila” ang diwa ng unlaping σύν-.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: ang ating kapatid
  rationale: Pinananatili ang pampamilyang katawagan sa isang lalaking kapananampalataya at kamanggagawa nang hindi na dinaragdagan ang teksto.
- source_word: ὃν ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις
  choice: na maraming ulit na naming nasubok sa maraming bagay
  rationale: Pinananatili ang parehong pag-uulit ng pagsubok (πολλάκις) at lawak ng mga kalagayan o usapin (ἐν πολλοῖς).
- source_word: σπουδαῖον ὄντα
  choice: at napatunayang masikap
  rationale: Ang “napatunayang” ay nagpapahiwatig ng kinalabasan ng pagsubok, samantalang ang “masikap” ay natural na sumasaklaw sa sipag at taimtim na pagnanais na ipinahahayag ng σπουδαῖος.
- source_word: νυνὶ δὲ πολὺ σπουδαιότερον
  choice: Ngunit ngayon ay lalo pa siyang masikap
  rationale: Malinaw na pinananatili ang paghahambing at matinding antas na ipinahahayag ng πολὺ at ng comparative na σπουδαιότερον.
- source_word: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: dahil sa malaking tiwala niya sa inyo
  rationale: Natural na ipinapahayag ang dative bilang sanhi ng ibayong kasigasigan at ang εἰς ὑμᾶς bilang direksiyon ng tiwala patungo sa mga taga-Corinto.
theological_decisions:
- issue: Ang tinutukoy at diwa ng πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: Ang ibayong kasipagan ng kapatid ay bunga ng malaking tiwala niya sa mga taga-Corinto.
  alternative: Maaaring iugnay ang tiwala kay Pablo, o unawain bilang malaking lakas ng loob sa pakikitungo sa kanila.
  rationale: Sa pinakamalapit na sintaks, ang parirala ay likas na tumutukoy sa di-pinangalanang kapatid at nagpapaliwanag kung bakit lalo siyang masikap ngayon. Gayunman, inilalahad sa talababa ang maaaring bahagyang naiibang pagkakaugnay ng parirala nang hindi nag-aangkat ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kapatid” upang mapanatili ang sinaunang pampamilyang idyoma ng mga mananampalataya; “masikap” ang pangunahing salin sa σπουδαῖος, habang “masigasig” ang alternatibo sa talababa.
