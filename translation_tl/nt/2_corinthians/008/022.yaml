  naturalness: Mas natural sa modernong Filipino ang “isinugo rin namin kasama nila” kaysa “isinugo naming kasama nila.” Ang “aming kapatid” ay mas tuwirang tumutugma sa ἡμῶν sa tinig ni Pablo at ng kanyang mga kasama; hindi nito kusang isinasama ang mga tinutukoy na “inyo.”
  terminology: Ang “masikap” ay katanggap-tanggap para sa σπουδαῖος sa kontekstong paglilingkod, bagaman ang “masigasig” ay maaari ring gamitin. Ang “malaking tiwala niya sa inyo” ay maayos na salin ng πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς at hindi dapat palawakin bilang doktrinal na pahayag.
