  to: Sapagkat alam ninyo ang biyaya ng ating Panginoong Jesucristo, na bagaman mayaman siya, ay naging dukha alang-alang sa inyo, upang sa pamamagitan ng kanyang karukhaan ay maging mayaman kayo.
  rationale: Pinalitan ang tutuldok ng kuwit at idinagdag ang “na” upang maipakita ang ὅτι at ang kaugnayan ng kasunod na pahayag sa “biyaya.” Pinag-isa ang baybay na “Jesucristo.” Iningatan ng talababa ang pagiging bukas ng metapora at iniwasan ang mas tiyak na teolohikal o temporal na pagpapakahulugan kaysa ipinapahayag ng talata.
