source:
  edition: SBLGNT
  text: γινώσκετε γὰρ τὴν χάριν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι δι’ ὑμᾶς ἐπτώχευσεν πλούσιος ὤν, ἵνα ὑμεῖς τῇ ἐκείνου πτωχείᾳ πλουτήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/009.yaml
  text: For you know the grace of our Lord Jesus Christ[a], that though he was rich, yet for your sake he became poor[b], so that you by his poverty might become rich.
translation:
  language: tl
  text: Sapagkat alam ninyo ang biyaya ng ating Panginoong Jesucristo, na bagaman mayaman siya, ay naging dukha alang-alang sa inyo, upang sa pamamagitan ng kanyang karukhaan ay maging mayaman kayo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γινώσκετε
  choice: alam ninyo
  rationale: Likas na salin ng kasalukuyang pandiwang tumutukoy sa kaalamang taglay na ng mga taga-Corinto.
- source_word: χάριν
  choice: biyaya
  rationale: Pinananatili ang lawak ng χάρις bilang mapagbiyayang kilos ni Cristo at huwaran ng bukas-palad na pagbibigay sa konteksto.
- source_word: κυρίου
  choice: Panginoon
  rationale: Karaniwang titulong Tagalog na nagpapanatili sa diwa ng awtoridad at bigat na kristolohikal.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesucristo
  rationale: Ang nakaugaliang modernong anyong Tagalog ay malinaw at marangal; ipinapaliwanag sa talababa na ang Cristo ay titulong nangangahulugang Mesiyas.
- source_word: δι’ ὑμᾶς
  choice: alang-alang sa inyo
  rationale: Malinaw na ipinahahayag ang kapakinabangang nakatuon sa mga mambabasa.
- source_word: ἐπτώχευσεν
  choice: naging dukha
  rationale: Tuwirang ipinapakita ang pagbabago tungo sa karukhaan nang hindi tinutukoy kung paano ito naganap.
- source_word: πλούσιος ὤν
  choice: bagaman mayaman siya
  rationale: Ipinahahayag ang konsesibong ugnayan ng pariralang participyal at ang malinaw na pagsalungat ng mayaman at dukha.
- source_word: τῇ ἐκείνου πτωχείᾳ
  choice: sa pamamagitan ng kanyang karukhaan
  rationale: Inilalarawan ang datibo bilang paraan o kasangkapan at pinananatili ang pangngalang kaagapay ng 'dukha.'
- source_word: πλουτήσητε
  choice: maging mayaman kayo
  rationale: Pinananatili ang sinadyang pagkakatapat sa 'naging dukha' at ang layuning ipinahahayag ng ἵνα kasama ng subjunctive.
theological_decisions:
- issue: Kahulugan ng pagiging 'mayaman' ni Cristo at ng pagiging 'mayaman' ng mga mananampalataya
  choice: Panatilihin sa pangunahing teksto ang talinghagang pangkabuhayan nang hindi nililimitahan ang kahulugan nito.
  alternative: Tukuyin ito bilang dating kaluwalhatian ni Cristo, kanyang katayuang Mesiyas, materyal na yaman, o mga pagpapala ng kaligtasan lamang.
  rationale: Hindi tahasang ipinapaliwanag ng talata ang saklaw ng mga larawang 'mayaman,' 'dukha,' at 'karukhaan.' Pinananatili ng salin ang teolohikal na tensiyon at ang kaugnayan nito sa mapagbigay na pagbibigay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'dukha/karukhaan' upang mapanatili ang leksikal na ugnayan at solemnidad; ginamit ang tradisyonal at malawak na nauunawaang anyong 'Jesucristo.'
