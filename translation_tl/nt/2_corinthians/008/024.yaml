id: 2CO.8.24
reference: 2 Corinthians 8:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὴν οὖν ἔνδειξιν τῆς ἀγάπης ὑμῶν καὶ ἡμῶν καυχήσεως ὑπὲρ ὑμῶν εἰς αὐτοὺς ⸀ἐνδεικνύμενοι εἰς πρόσωπον τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/024.yaml
  text: Therefore[b][a], show them before the churches the proof of your love and of our boasting about you.
translation:
  language: tl
  text: Kaya ipakita ninyo sa kanila, sa harap ng mga iglesya, ang katibayan[a] ng inyong pag-ibig at ng aming pagmamalaki tungkol sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hayag na patunay” o “pagpapakita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahahayag ang kongklusyon mula sa naunang papuri at pakiusap; natural at malinaw ito sa makabagong Tagalog.
- source_word: ἔνδειξιν
  choice: katibayan
  rationale: Tumutukoy sa nakikitang patunay o pagpapakitang nagpapatunay sa pag-ibig; pinananatili ng “katibayan” ang bigat ng salitang Griyego nang natural sa Tagalog.
- source_word: ἀγάπης
  choice: pag-ibig
  rationale: Karaniwang katumbas ng ἀγάπη at dito ay tumutukoy sa pag-ibig na nahahayag sa gawa.
- source_word: καυχήσεως
  choice: pagmamalaki
  rationale: Pinananatili ang retorikal na lakas ng καύχησις bilang hayag na pagmamalaki o ipinagmamalaking batayan, sa halip na pahinain bilang tiwala lamang.
- source_word: ὑπὲρ ὑμῶν
  choice: tungkol sa inyo
  rationale: Kasama ng καύχησις, tumutukoy ito sa mga taga-Corinto bilang paksa ng pagmamalaki ni Pablo.
- source_word: εἰς αὐτοὺς
  choice: sa kanila
  rationale: Tumutukoy sa mga kapatid o kinatawan ng mga iglesya na binanggit sa konteksto.
- source_word: ἐνδεικνύμενοι
  choice: ipakita ninyo
  rationale: Ang participle ay gumaganap bilang paghimok o utos sa konteksto; malinaw na ipinapahayag ng saling ito ang paggawa nilang hayag sa katibayan.
- source_word: εἰς πρόσωπον τῶν ἐκκλησιῶν
  choice: sa harap ng mga iglesya
  rationale: 'Ipinahahayag ang pampubliko at kinatawang kalagayan: ang pagpapakita ay ginagawa sa presensiya ng mga iglesya, malamang sa pamamagitan ng kanilang mga kinatawan.'
- source_word: τῶν ἐκκλησιῶν
  choice: mga iglesya
  rationale: Karaniwang tumutukoy sa mga lokal na kapulungan ng mga mananampalataya; “mga iglesya” ang malinaw at nakagawiang salin.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang “pagmamalaki” upang hindi pahupain ang retorikal na lakas ng pananalita ni Pablo. Inilagay ang “sa harap ng mga iglesya” malapit sa pandiwa upang luminaw na pampubliko ang pagpapakita.
