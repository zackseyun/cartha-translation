base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/021.yaml
  text: For we take thought for what is good[a], not only before the Lord but also before people.
translation:
  language: tl
  text: Sapagkat maingat naming isinasaalang-alang ang mabuti[a], hindi lamang sa harap ng Panginoon kundi pati sa harap ng mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “ang marangal,” “ang tama,” o “ang kapuri-puri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προνοοῦμεν
  choice: pinagsisikapan naming gawin
  rationale: Ipinahihiwatig ng προνοέω ang maingat at sadyang pag-iisip nang patiuna upang matiyak ang wastong pagkilos. Sa konteksto ng pananagutan sa pananalapi, likas sa modernong Tagalog ang “pinagsisikapan naming gawin” at naipapakita nito ang sinadyang pag-iingat, bagaman hindi nito lantad na inuulit ang larawan ng pag-iisip nang patiuna.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag o dahilan kaugnay ng naunang pahayag; malinaw at marangal na pang-ugnay ang “Sapagkat.”
- source_word: καλὰ
  choice: ang mabuti
  rationale: Maaaring tumukoy ang neuter plural na καλὰ sa mga bagay o gawaing mabuti, marangal, o kapuri-puri. Pinananatili ng “ang mabuti” ang malawak na moral na diwa, habang inilalagay sa talababa ang mahalagang alternatibo sa kontekstong pampublikong pananagutan.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: hindi lamang ... kundi pati
  rationale: Natural na tumbas ito sa Tagalog na nagpapanatili sa balanseng diin ng dalawang saklaw.
- source_word: ἐνώπιον
  choice: sa harap ng
  rationale: Ang parirala ay nangangahulugang nasa harap o paningin ng isang nagmamasid. Ang “sa harap ng” ay maikli, likas, at maaaring magtaglay ng kahulugang pananagutan.
- source_word: κυρίου
  choice: Panginoon
  rationale: Karaniwang marangal na salin ng κύριος ang “Panginoon” sa ganitong pagtukoy.
- source_word: ἀνθρώπων
  choice: mga tao
  rationale: Pangkalahatan ang ἀνθρώπων at hindi tumutukoy lamang sa mga lalaki; eksakto at natural ang “mga tao.”
theological_decisions:
- issue: Etikal na diwa ng καλὰ sa konteksto ng pananagutan sa pananalapi
  choice: ang mabuti
  alternative: ang marangal; ang tama; ang kapuri-puri
  rationale: Saklaw ng Griyego ang likas na kabutihan at ang asal na kinikilalang marangal sa harap ng mga nagmamasid. Pinananatili ng pangunahing teksto ang malawak na diwa at hindi nililimitahan ang talata sa reputasyon lamang; ipinapakita naman ng talababa ang tunay na leksikal at kontekstuwal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “pinagsisikapan naming gawin” upang maging natural ang ideya ng sinadya at maingat na pagkilos; pinanatili ang pormal na “Sapagkat” at ang magkatimbang na “hindi lamang ... kundi pati.”
