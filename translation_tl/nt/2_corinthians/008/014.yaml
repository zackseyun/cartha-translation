id: 2CO.8.14
reference: 2 Corinthians 8:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν τῷ νῦν καιρῷ τὸ ὑμῶν περίσσευμα εἰς τὸ ἐκείνων ὑστέρημα, ἵνα καὶ τὸ ἐκείνων περίσσευμα γένηται εἰς τὸ ὑμῶν ὑστέρημα, ὅπως γένηται ἰσότης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/014.yaml
  text: At the present time[a], your abundance is for their need, so that their abundance may also be for your need, in order that there may be equality.
translation:
  language: tl
  text: Sa kasalukuyan, ang inyong kasaganaan ay para sa kanilang kakulangan, upang ang kanilang kasaganaan naman ay maging para sa inyong kakulangan, nang sa gayon ay magkaroon ng pagkakapantay-pantay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagiging patas” o “katarungan.” Dito, ang salitang Griyego ay tumutukoy sa balanseng pagtutulungan upang matugunan ang pangangailangan, hindi naman sa pagkakaroon ng eksaktong magkakaparehong ari-arian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ νῦν καιρῷ
  choice: Sa kasalukuyan
  rationale: Likas sa modernong Tagalog at pinananatili ang diwa ng isang kasalukuyang kalagayan o pagkakataon, hindi lamang ng kronolohikal na oras.
- source_word: τὸ ὑμῶν περίσσευμα
  choice: ang inyong kasaganaan
  rationale: Ipinahihiwatig ng περίσσευμα ang taglay na higit sa pangangailangan. Malawak ang “kasaganaan” at hindi nito nililimitahan sa salapi lamang ang tinutukoy.
- source_word: εἰς τὸ ἐκείνων ὑστέρημα
  choice: para sa kanilang kakulangan
  rationale: Malinaw na ipinapakita ng “para sa” ang layuning tugunan ang kulang sa kanila, habang pinananatili ng “kakulangan” ang materyal na diwa ng ὑστέρημα.
- source_word: ἵνα καὶ
  choice: upang ... naman
  rationale: Pinananatili ng “upang” ang layunin ng ἵνα, at natural na ipinahahayag ng “naman” ang gantihang diwa ng καί.
- source_word: τὸ ἐκείνων περίσσευμα
  choice: ang kanilang kasaganaan
  rationale: Inuulit ang parehong salin ng περίσσευμα upang manatiling malinaw ang simetriko at gantihang ayos ng pangungusap.
- source_word: γένηται εἰς τὸ ὑμῶν ὑστέρημα
  choice: ay maging para sa inyong kakulangan
  rationale: Ang “maging” ay tumutugma sa γένηται at hindi higit na tinutukoy kung paano magaganap ang pagtugon sa pangangailangan.
- source_word: ὅπως γένηται ἰσότης
  choice: nang sa gayon ay magkaroon ng pagkakapantay-pantay
  rationale: Direktang tinutumbasan ng “pagkakapantay-pantay” ang ἰσότης; nililinaw sa talababa na sa konteksto ay tumutukoy ito sa patas at magkatuwang na pagtugon sa pangangailangan, hindi sa eksaktong pagkakapareho ng pag-aari.
theological_decisions:
- issue: Kahulugan ng ἰσότης sa panawagan ni Pablo na magbigay
  choice: pagkakapantay-pantay sa magkatuwang na pagtugon sa pangangailangan
  alternative: pagiging patas; katarungan
  rationale: Ang konteksto ay ang gantihang pagtugon sa mga pangangailangan ng mga mananampalataya. Pinananatili ng pangunahing salin ang tuwirang kahulugan ng salitang Griyego nang hindi ito ginagawang isang hiwalay na teoryang panlipunan; nasa talababa ang kinakailangang paglilinaw.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang magkatapat na “inyong kasaganaan/kanilang kakulangan” at “kanilang kasaganaan/inyong kakulangan” upang marinig ang retorikal na balanse ng Griyego. Inilagay ang panandang [a] sa “pagkakapantay-pantay,” sapagkat iyon ang salitang ipinaliliwanag ng talababa.
