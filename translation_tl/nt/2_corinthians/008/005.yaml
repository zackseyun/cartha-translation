  text: καὶ οὐ καθὼς ἠλπίσαμεν ἀλλ’ ἑαυτοὺς ἔδωκαν πρῶτον τῷ κυρίῳ καὶ ἡμῖν διὰ θελήματος θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/005.yaml
  text: And not as we expected[a], but they gave themselves first to the Lord and to us through the will of God[b],
translation:
  language: tl
  text: At hindi gaya ng aming inaasahan[a], kundi ibinigay muna nila ang kanilang sarili sa Panginoon at sa amin sa pamamagitan ng kalooban ng Diyos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gaya ng aming inaasam.”
    reason: lexical_alternative
  - marker: b
    text: O “ayon sa kalooban ng Diyos” o “sa pamamagitan ng kalooban ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ἠλπίσαμεν
  choice: ayon sa aming inaasahan
  rationale: Sa konteksto, ipinakikita ng ἐλπίζω ang inaasahan nina Pablo tungkol sa gagawin ng mga taga-Macedonia. Likas sa modernong Tagalog ang “inaasahan,” habang pinananatili sa talababa ang posibleng “inaasam.”
- source_word: ἑαυτοὺς ἔδωκαν
  choice: ibinigay nila ang kanilang sarili
  rationale: Pinananatili nito ang diin ng Griyego sa kusang pagbibigay ng mismong sarili, hindi lamang ng salapi o mga pag-aari.
- source_word: πρῶτον
  choice: muna
  rationale: Ang “muna” ay natural na Tagalog para sa priyoridad na ipinahihiwatig ng πρῶτον, nang hindi nililimitahan kung temporal o lohikal ang diin.
- source_word: τῷ κυρίῳ
  choice: sa Panginoon
  rationale: Tuwirang katumbas ito ng dative na τῷ κυρίῳ at pinananatili ang karaniwang titulong tumutukoy kay Cristo sa konteksto ni Pablo.
- source_word: καὶ ἡμῖν
  choice: at sa amin
  rationale: Pinananatili ang magkatulad na dative construction, ngunit hindi dinaragdagan ang teksto ng pahiwatig na kapantay ng Panginoon sina Pablo at ang kanyang mga kasama.
- source_word: διὰ θελήματος θεοῦ
  choice: sa pamamagitan ng kalooban ng Diyos
  rationale: Pinananatili ng pariralang ito ang διά na may genitive at ang pagiging bukás nito sa diwang ahensiya, paraan, pahintulot, o pagsang-ayon.
theological_decisions:
- issue: Ugnayan ng pagbibigay ng kanilang sarili sa Panginoon at sa mga apostol
  choice: Inilalahad ang pagbibigay ng sarili na muna sa Panginoon at pagkatapos ay sa amin, nang hindi pinalalawak ang kahulugan.
  alternative: Maaaring unawain bilang dalawang magkaugnay na pagtatalaga na walang tahasang hirarkiya maliban sa ipinahihiwatig ng πρῶτον.
  rationale: Pinananatili ng “muna” at ng pagkakasunod ng mga parirala ang priyoridad ng Panginoon, ngunit hindi nagdaragdag ng sektaryan o eklesiyolohikal na paliwanag.
- issue: Lakas ng διὰ θελήματος θεοῦ
  choice: sa pamamagitan ng kalooban ng Diyos
  alternative: ayon sa kalooban ng Diyos; dahil sa kalooban ng Diyos
  rationale: Ang salin ay sadyang nagpapanatili ng kalabuan kung ang diin ay nasa banal na ahensiya, paraan, pahintulot, o pagkakaayon.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “muna” bilang likas na katumbas ng πρῶτον at pinanatili ang personal na diin ng “ibinigay nila ang kanilang sarili.”
