  source_fidelity: Ang “ibinigay muna nila ang kanilang sarili sa Panginoon at sa amin sa pamamagitan ng kalooban ng Diyos” ay tapat sa ἑαυτοὺς ἔδωκαν πρῶτον τῷ κυρίῳ καὶ ἡμῖν διὰ θελήματος θεοῦ at maingat na pinananatili ang lawak ng διά. Gayunman, ang “hindi lamang ayon sa aming inaasahan” ay nagdaragdag ng diwang “lamang/only,” na wala sa οὐ καθὼς ἠλπίσαμεν. Ang “hindi gaya ng aming inaasahan” ay mas tuwirang katumbas at pinananatili ang eliptikal na paghahambing ng Griyego.
  naturalness: Likas, malinaw, at angkop sa modernong Filipino Tagalog ang “hindi gaya ng aming inaasahan” at “ibinigay muna nila ang kanilang sarili.” Ang “sa pamamagitan ng kalooban ng Diyos” ay bahagyang pormal ngunit angkop sa dignified na rehistro at nakapag-iingat ng sinadyang kalabuan ng pinagmulan.
  terminology: Ang “Panginoon,” “Diyos,” at “kanilang sarili” ay wasto at pare-pareho sa karaniwang terminolohiyang Tagalog. Ang “muna” ay angkop na katumbas ng πρῶτον nang hindi ipinipilit ang temporal lamang na pagbasa.
