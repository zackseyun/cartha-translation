source:
  edition: SBLGNT
  text: καὶ γνώμην ἐν τούτῳ δίδωμι· τοῦτο γὰρ ὑμῖν συμφέρει, οἵτινες οὐ μόνον τὸ ποιῆσαι ἀλλὰ καὶ τὸ θέλειν προενήρξασθε ἀπὸ πέρυσι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/010.yaml
  text: 'And in this matter I give my judgment: for this is beneficial for you[b][a], who began last year not only to do it but also to will it.'
translation:
  language: tl
  text: At sa bagay na ito, ibinibigay ko ang aking pasya[a], sapagkat makabubuti ito sa inyo—kayong noong nakaraang taon pa ay nagsimulang hindi lamang gumawa nito kundi magnais[b] din na gawin ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “payo” o “palagay.” Nagbibigay si Pablo rito ng pinag-isipang rekomendasyon, hindi ng isang tuwirang utos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “maging handang gawin ito.” Ipinakikita ng Griyego ang pagkakaiba ng pagnanais o kahandaang-loob at ng aktuwal na paggawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώμην
  choice: pasya
  rationale: Ipinahihiwatig nito ang pinag-isipang hatol o rekomendasyon ni Pablo, ngunit sa konteksto ay hindi ito tuwirang utos; nililinaw ng talababa ang posibleng ‘payo’ o ‘palagay.’
- source_word: ἐν τούτῳ
  choice: sa bagay na ito
  rationale: Natural na tumutukoy sa partikular na usapin ng ambagan na tinatalakay.
- source_word: δίδωμι
  choice: ibinibigay ko
  rationale: Pinananatili ang tahasang present-tense na pagpapahayag ng Griyego.
- source_word: συμφέρει
  choice: makabubuti
  rationale: Karaniwang modernong Tagalog para sa isang bagay na kapaki-pakinabang o makabubuti sa kanila.
- source_word: οἵτινες
  choice: kayong
  rationale: Natural na inuugnay ang mga taga-Corinto sa paglalarawang kasunod nang hindi labis na ipinapaliwanag ang puwersa ng panghalip.
- source_word: τὸ ποιῆσαι
  choice: gumawa nito
  rationale: Tumutukoy sa aktuwal na pagsasagawa ng ambagan, na malinaw mula sa konteksto.
- source_word: τὸ θέλειν
  choice: magnais din na gawin ito
  rationale: Pinananatili ang pagkakaiba ng panloob na pagnanais o pagkukusa at ng aktuwal na paggawa, sa natural na Tagalog.
- source_word: προενήρξασθε
  choice: nagsimulang
  rationale: Ang ideya ng mas naunang pagsisimula ay naipahahayag na ng kasunod na χρονική pariralang ‘noong nakaraang taon pa.’
- source_word: ἀπὸ πέρυσι
  choice: noong nakaraang taon pa
  rationale: Natural na ipinakikita ang pagsisimula sa naunang taon nang hindi ipinipilit na tuluy-tuloy ang kilos hanggang kasalukuyan.
theological_decisions:
- issue: Lakas ng pahayag ni Pablo kaugnay ng kaniyang awtoridad bilang apostol
  choice: Isinalin ang γνώμην bilang ‘pasya,’ na may talababa na maaari ring ‘payo’ o ‘palagay,’ upang ipakitang nagbibigay siya ng pinag-isipang rekomendasyon at hindi nagbabalangkas ng tuwirang utos.
  alternative: Ituring ang pahayag bilang isang tahasang makapangyarihang utos.
  rationale: Sa malapit na konteksto, itinatangi ni Pablo ang utos sa kaniyang ibinibigay na γνώμη (8:8, 10). Pinananatili nito kapwa ang bigat ng kaniyang payo at ang hindi-pautos na anyo nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘pasya’ upang mapanatili ang bigat ng γνώμη, habang nililinaw sa talababa na hindi ito tuwirang utos. Ang ‘magnais din na gawin ito’ ay mas natural kaysa literal na ‘loobin ito’ at pinananatili ang kaibahan ng kalooban at pagkilos.
