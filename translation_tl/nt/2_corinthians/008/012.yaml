  text: εἰ γὰρ ἡ προθυμία πρόκειται, καθὸ ἐὰν ⸀ἔχῃ εὐπρόσδεκτος, οὐ καθὸ οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/012.yaml
  text: For if the readiness is present[a], it is acceptable according to what one has[b], not according to what one does not have.
translation:
  language: tl
  text: Sapagkat kung may kusang-loob[a], ito ay katanggap-tanggap ayon sa kung ano ang mayroon ang isang tao[b], hindi ayon sa kung ano ang wala sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kahandaan” o “pagiging handang-loob.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “ayon sa anumang mayroon ang isang tao … hindi ayon sa wala sa kanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμία
  choice: kahandaang-loob
  rationale: Ipinapahayag nito ang kusang-loob at handang disposisyon sa pagbibigay. Likas ito sa modernong Filipino at hindi lamang tumutukoy sa praktikal na paghahanda.
- source_word: πρόκειται
  choice: naroon
  rationale: Sa idyomang ito, nangangahulugan itong umiiral o taglay na ang kahandaang-loob, hindi literal na inilatag sa harap.
- source_word: καθὸ ἐὰν ἔχῃ
  choice: ayon sa kung ano ang mayroon ang isang tao
  rationale: Pinananatili nito ang pamantayang batay sa tunay na kakayahan o tinataglay, pati ang di-tiyak na puwersa ng ἐὰν, nang hindi nililimitahan ang tinutukoy sa lalaki.
- source_word: εὐπρόσδεκτος
  choice: katanggap-tanggap
  rationale: Tumpak nitong ipinahahayag ang pagiging karapat-dapat tanggapin o kalugdan nang hindi idinaragdag kung kanino ito katanggap-tanggap.
- source_word: οὐ καθὸ οὐκ ἔχει
  choice: hindi ayon sa kung ano ang wala sa kanya
  rationale: Pinananatili nito ang tuwirang pagtutulad at pagsalungat ng dalawang parirala sa Griyego.
- source_word: εἰ γὰρ
  choice: Sapagkat kung
  rationale: Kapwa pinananatili ang paliwanag na ugnayan ng γὰρ at ang kondisyong ipinahahayag ng εἰ.
theological_decisions:
- issue: Hindi tahasang tinukoy ang tumatanggap o humahatol sa pagiging katanggap-tanggap
  choice: Hindi tinukoy kung kanino katanggap-tanggap ang kahandaang-loob o handog.
  alternative: Idagdag ang “sa Diyos” o “sa kapulungan.”
  rationale: Walang tahasang tagatanggap ang εὐπρόσδεκτος sa talata. Ang mas malawak na pagkakasalin ay nagpapanatili sa tunay na kalabuan ng teksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “kahandaang-loob” upang ipahayag ang handa at kusang disposisyon, at ang “isang tao” upang malinaw na generic ang panghalip sa Griyego.
