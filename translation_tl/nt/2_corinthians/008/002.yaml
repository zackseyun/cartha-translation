base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/002.yaml
  text: that in a severe test of affliction[b][a], the abundance of their joy and their deep poverty overflowed into the wealth of their generosity.
translation:
  language: tl
  text: na sa matinding pagsubok sa gitna ng paghihirap, ang kasaganaan ng kanilang kagalakan at ang kanilang napakalalim na kahirapan[a] ay umapaw tungo sa kasaganaan ng kanilang pagiging bukas-palad.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kanilang kahirapang sagad sa lalim,” o “ang kanilang sukdulang kahirapan.”
    reason: lexical_alternative
  - marker: b
    text: O “kasaganaan ng kanilang bukas-palad na pagbibigay.” Ang salitang Griyego ay maaari ring mangahulugang “pagiging payak,” “katapatan,” o “taos-pusong layunin,” ngunit dito ay malamang na tumutukoy sa pagiging bukas-palad.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πολλῇ δοκιμῇ θλίψεως
  choice: sa gitna ng matinding pagsubok na dulot ng paghihirap
  rationale: Ipinahahayag nito ang isang matinding kalagayan ng pagsubok na kaugnay ng θλῖψις. Ginawang lantad ng “na dulot ng” ang genitibong ugnayan sa natural na Tagalog nang hindi tinutukoy nang higit sa ipinahihintulot ng Griyego ang tiyak na anyo ng paghihirap.
- source_word: ἡ περισσεία τῆς χαρᾶς αὐτῶν
  choice: ang nag-uumapaw nilang kagalakan
  rationale: Bagaman pangngalan ang περισσεία, natural na naihahatid ng “nag-uumapaw” ang kasaganaan at naipananatili ang larawang inuulit sa pandiwang ἐπερίσσευσεν.
- source_word: ἡ κατὰ βάθους πτωχεία αὐτῶν
  choice: ang kanilang napakalalim na kahirapan
  rationale: Pinananatili ng “napakalalim” ang metapora ng βάθος habang malinaw na ipinahahayag ang matinding antas ng kanilang kahirapan.
- source_word: ἐπερίσσευσεν
  choice: umapaw
  rationale: Nananatili rito ang masiglang larawan ng kasaganaan na humahantong sa resultang ipinakilala ng εἰς.
- source_word: εἰς τὸ πλοῦτος
  choice: tungo sa kasaganaan
  rationale: Ipinananatili ng “tungo sa” ang direksiyon o resultang puwersa ng εἰς. Mas natural sa Tagalog ang “kasaganaan” kaysa literal na “kayamanan” kapag inilalarawan ang antas ng pagbibigay.
- source_word: τῆς ἁπλότητος αὐτῶν
  choice: ng kanilang bukas-palad na pagbibigay
  rationale: Sa konteksto ng ambagan para sa mga banal, tumutukoy ang ἁπλότης sa bukal, hindi nag-aatubili, at mapagbigay na pagkakaloob. Nililinaw ng “pagbibigay” ang konteksto ngunit itinatala sa talababa ang mas literal na mga posibilidad.
theological_decisions:
- issue: Kahulugan ng ἁπλότης sa konteksto ng materyal na pagbibigay
  choice: bukas-palad na pagbibigay
  alternative: pagiging payak; katapatan; taos-pusong layunin
  rationale: Ang agarang konteksto ay ang ambagan para sa mga banal, kaya malamang na ang ἁπλότης ay tumutukoy sa mapagbigay at bukal-sa-loob na pagkakaloob. Gayunman, hindi lubos na inaalis ang batayang diwa ng pagiging payak o taos-puso, kaya iningatan iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang paulit-ulit na larawan ng pag-apaw at ang tensiyon sa pagitan ng matinding kahirapan at masaganang pagbibigay. Ang “bukas-palad na pagbibigay” ay natural sa kasalukuyang gamit at hindi nakatali sa anumang natatanging denominasyonal na pagbasa.
