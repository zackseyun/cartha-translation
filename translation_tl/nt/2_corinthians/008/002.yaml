  rationale: Inalis ang hindi kinakailangang pagbibigay ng sanhi sa ugnayan ng δοκιμή at θλίψις. Ibinalik ang nominal na puwersa ng περισσεία sa "kasaganaan ng kanilang kagalakan," at pinanatiling "umapaw" ang larawan ng ἐπερίσσευσεν. Pinalitan ang pangunahing "bukas-palad na pagbibigay" ng "pagiging bukas-palad" upang hindi magdagdag ng pangngalang wala sa Griyego, bagaman ang pagbibigay ay malakas na ipinahihiwatig ng konteksto at nasa talababa bilang alternatibo.
