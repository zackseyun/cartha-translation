  text: εἰς τὸ παρακαλέσαι ἡμᾶς Τίτον ἵνα καθὼς προενήρξατο οὕτως καὶ ἐπιτελέσῃ εἰς ὑμᾶς καὶ τὴν χάριν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/006.yaml
  text: So we urged Titus that[a], just as he had previously begun, he should also complete among you this act of grace.
translation:
  language: tl
  text: Kaya hinimok namin si Tito na, kung paanong sinimulan niya noon ang mabiyayang gawaing ito, ay gayon din niya ito tapusin sa gitna ninyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang gawaing ito ng biyaya”; mas literal, “ang biyayang ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: hinimok
  rationale: Sa konteksto, pinakilos nina Pablo si Tito na ipagpatuloy ang gawain. Likas sa modernong Filipino ang “hinimok” at sapat ang lakas nito nang hindi nagiging labis na pormal.
- source_word: Τίτον
  choice: Tito
  rationale: Ginamit ang nakaugaliang anyo ng pangalang Titus sa mga saling Filipino.
- source_word: καθὼς προενήρξατο
  choice: kung paanong sinimulan na niya ito noon
  rationale: Ipinapakita ng “noon” at “na” ang temporal na diwa ng προενήρξατο—nauna na niyang nasimulan ang gawaing tinutukoy.
- source_word: ἐπιτελέσῃ
  choice: tapusin din niya
  rationale: Malinaw at natural itong nagpapahayag ng layuning dalhin ni Tito sa kaganapan ang naunang sinimulan.
- source_word: εἰς ὑμᾶς
  choice: sa gitna ninyo
  rationale: Ipinahihiwatig nito na isasagawa at tatapusin ang gawain sa komunidad ng mga taga-Corinto, habang hindi nililimitahan ang parirala sa kahulugang “para sa inyo.”
- source_word: καὶ τὴν χάριν ταύτην
  choice: ang gawaing ito ng biyaya
  rationale: Pinananatili ang salitang “biyaya” ngunit nililinaw na isang kongkretong gawain—ang ambagan o paglilingkod—ang tinutukoy sa konteksto.
theological_decisions:
- issue: Kahulugan ng χάρις sa konteksto ng ambagan
  choice: gawaing ito ng biyaya
  alternative: biyaya; mabiyayang gawain; kaloob
  rationale: Ang kabanata ay tumutukoy sa kongkretong ambagan para sa mga banal, ngunit inilalarawan iyon ni Pablo bilang χάρις. Pinananatili ng salin ang teolohikal na wika ng biyaya nang hindi ginagawang purong abstrakto ang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ang ayos ng pangungusap ay ginawang natural sa Filipino, at ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang nililinaw nito.
