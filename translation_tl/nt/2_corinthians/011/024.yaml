  text: Five times I received from the Jews forty lashes less one[a][b].
translation:
  language: tl
  text: Limang ulit akong tumanggap mula sa mga Judio ng apatnapung hagupit na kulang ng isa[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “apatnapu na kulang ng isa”; samakatuwid, tatlumpu't siyam na hagupit.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “ng mga Judio.” Tinutukoy ng Griyego ang mga tagaganap o pinagmulan ng parusa, ngunit hindi nito sinasabing isang partikular na lupon ng mga pinuno ang nagpataw nito.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὸ Ἰουδαίων
  choice: mula sa mga Judio
  rationale: Ang ὑπό na may genitive ay tumutukoy sa personal na tagaganap o pinagmulan. Pinananatili ng “mula sa mga Judio” ang saklaw ng Griyego nang hindi ipinapalagay na isang partikular na lupon ng mga pinuno ang tinutukoy.
- source_word: πεντάκις
  choice: Limang ulit
  rationale: Tuwirang ipinahahayag ng pang-abay ang pag-uulit nang limang beses; natural at malinaw ito sa modernong Tagalog.
- source_word: τεσσεράκοντα παρὰ μίαν
  choice: apatnapung hagupit na kulang ng isa
  rationale: Pinananatili nito ang anyong “apatnapu kulang ng isa” ng Griyego. Idinagdag ang “hagupit” upang maipahayag ang uri ng parusang ipinahihiwatig ng pandiwa at konteksto.
- source_word: ἔλαβον
  choice: akong tumanggap
  rationale: Ang λαμβάνω rito ay tumutukoy sa pagtanggap o pagdanas ng parusa. Ang “tumanggap” ay malapit sa pandiwang Griyego at likas pakinggan sa pangungusap.
theological_decisions:
- issue: Kung ang Ἰουδαίων ay tumutukoy sa lahat ng Judio o sa isang partikular na awtoridad
  choice: mga Judio
  alternative: mga pinunong Judio
  rationale: Hindi tahasang tinutukoy ng Griyego ang isang opisyal na lupon. Kaya hindi idinagdag sa pangunahing teksto ang “mga pinuno,” upang maiwasan ang labis na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “hagupit” bilang karaniwang salitang angkop sa pisikal na parusa, at pinanatili ang literal na bilang sa pangunahing teksto habang ipinaliliwanag ang kabuuang tatlumpu't siyam sa talababa.
