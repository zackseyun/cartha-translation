  text: Why? Because I do not love you? God knows I do.
translation:
  language: tl
  text: Bakit? Dahil ba hindi ko kayo minamahal? Alam ng Diyos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, ayon sa ipinahihiwatig ng retorikal na tanong: “Alam ng Diyos na minamahal ko kayo.” Sa Griyego, “Alam ng Diyos” lamang ang tahasang sinabi.'
    reason: Paglilinaw sa ipinahiwatig na sagot habang pinananatili sa pangunahing teksto ang maigsi at hindi lubos na tahasang pahayag ng Griyego.
lexical_decisions:
- source_word: διὰ τί
  choice: Bakit?
  rationale: Likas at maikling tanong sa Tagalog na nagpapanatili sa retorikal na puwersa ng parirala.
- source_word: ὅτι
  choice: Dahil
  rationale: Ipinakikilala rito ang ipinalalagay na dahilan bilang kasunod na retorikal na tanong.
- source_word: οὐκ ἀγαπῶ ὑμᾶς
  choice: hindi ko kayo minamahal
  rationale: Tuwirang pinananatili ang negasyon, ang kilos ng pagmamahal, at ang maramihang kausap; natural ang aspektong imperpektibo sa pangkasalukuyang kalagayan.
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Karaniwang tiyak na pagtukoy sa Diyos sa makabagong Tagalog.
- source_word: οἶδεν
  choice: Alam ng Diyos
  rationale: Pinananatili ang tahasang sinabi ng Griyego at hindi isinasama sa pangunahing teksto ang ipinahiwatig ngunit hindi binigkas na sagot.
theological_decisions:
- issue: Kung dapat bang tahasang idagdag na alam ng Diyos na minamahal ni Pablo ang mga taga-Corinto
  choice: Alam ng Diyos.
  alternative: Alam ng Diyos na minamahal ko kayo.
  rationale: Ang Griyego ay nagtatapos lamang sa ‘alam ng Diyos.’ Malinaw sa retorikal na konteksto ang ipinahiwatig na positibong sagot, ngunit mas tapat sa tunay na pagkakabuo at bahagyang ellipsis ng pinagmulan na huwag itong tahasang idagdag sa pangunahing teksto.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “minamahal” sa halip na mas kolokyal na anyo, at pinanatili ang maiikling retorikal na tanong ng orihinal.
