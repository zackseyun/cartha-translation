id: 2CO.11.22
reference: 2 Corinthians 11:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἑβραῖοί εἰσιν; κἀγώ. Ἰσραηλῖταί εἰσιν; κἀγώ. σπέρμα Ἀβραάμ εἰσιν; κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/022.yaml
  text: Are they Hebrews? So am I[a]. Are they Israelites? So am I. Are they Abraham’s offspring? So am I.
translation:
  language: tl
  text: Mga Hebreo ba sila? Ako rin. Mga Israelita ba sila? Ako rin. Mga inapo ba sila ni Abraham?[a] Ako rin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “binhi ni Abraham,” isang anyong isahan na may sama-samang diwa.
    reason: Pinananatili ang literal na larawan at ang anyong isahan ng σπέρμα habang gumagamit ang pangunahing teksto ng mas natural na “mga inapo.”
lexical_decisions:
- source_word: Ἑβραῖοί
  choice: Mga Hebreo
  rationale: Pinananatili ang kinikilalang katawagang etniko at panrelihiyon, pati ang pagkakaiba nito sa “mga Israelita” at “mga inapo ni Abraham.”
- source_word: κἀγώ
  choice: Ako rin
  rationale: Maikli, natural, at mariing katumbas ng pinagsamang καί + ἐγώ; napapanatili rin nito ang paulit-ulit at matalas na ritmo ng pahayag ni Pablo.
- source_word: Ἰσραηλῖται
  choice: Mga Israelita
  rationale: Tumpak at likas na katawagan sa mga kabilang sa Israel; hindi nito ipinagpapalit ang magkakaugnay ngunit magkakaibang pagkakakilanlang binanggit sa talata.
- source_word: σπέρμα Ἀβραάμ
  choice: mga inapo ni Abraham
  rationale: Ito ang malinaw at natural na modernong Tagalog para sa sama-samang diwa ng σπέρμα. Ipinaliliwanag sa talababa ang literal na anyong isahan na “binhi.”
- source_word: εἰσιν
  choice: ba sila
  rationale: Isinama ang pandiwa sa natural na anyo ng mga retorikal na tanong sa Tagalog, sa halip na sundan nang mekanikal ang ayos ng Griyego.
theological_decisions:
- issue: Pagkakaiba ng tatlong katawagan sa pagkakakilanlang Judio
  choice: Panatilihin ang “Mga Hebreo,” “Mga Israelita,” at “mga inapo ni Abraham” bilang tatlong magkahiwalay na katawagan.
  alternative: Pag-isahin ang mga ito sa pangkalahatang katawagang gaya ng “mga Judio.”
  rationale: Nakasalalay ang diin ng retorika ni Pablo sa sunod-sunod na magkakaugnay ngunit hindi ganap na magkaparehong pag-angkin sa pagkakakilanlan at pinagmulan.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ang maiikling tanong at paulit-ulit na “Ako rin” ay sadyang nagpapanatili sa mabilis, madiin, at halos putol-putol na ritmo ng Griyego.
