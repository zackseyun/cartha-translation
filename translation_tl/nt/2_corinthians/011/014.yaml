  text: καὶ οὐ ⸀θαῦμα, αὐτὸς γὰρ ὁ Σατανᾶς μετασχηματίζεται εἰς ἄγγελον φωτός·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/014.yaml
  text: And no wonder[a], for Satan himself disguises himself as an angel of light.
translation:
  language: tl
  text: At hindi ito kataka-taka, sapagkat si Satanas mismo ay nagkukunwaring[a] isang anghel ng liwanag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nag-aanyong isang anghel ng liwanag.” Mas literal na tumutukoy ang pandiwang Griyego sa pagbabago ng anyo, ngunit sa kontekstong ito ay malamang na tumutukoy sa mapanlinlang na pagpapakita.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang ugnayan ng pangungusap sa naunang talata sa natural na paraang Filipino.
- source_word: οὐ θαῦμα
  choice: hindi ito kataka-taka
  rationale: Likas at malinaw na katumbas ng idyomang Griyego na nagsasaad na hindi dapat ikagulat ang binanggit.
- source_word: αὐτὸς ... ὁ Σατανᾶς
  choice: si Satanas mismo
  rationale: Ipinahahayag ng “mismo” ang mapagdiing gamit ng αὐτός; hindi kailangang tumbasan sa Filipino ang artikulong Griyego sa harap ng pangalang Satanas.
- source_word: γὰρ
  choice: sapagkat
  rationale: Malinaw na ipinakikita ang paliwanag kung bakit hindi kataka-taka ang naunang pahayag.
- source_word: μετασχηματίζεται
  choice: nagkukunwaring
  rationale: Sa konteksto ng panlilinlang, ipinahihiwatig nito ang mapanlinlang na pagpapakita sa ibang anyo, nang hindi iginigiit na tunay na nagbago ang likas na pagkatao.
- source_word: εἰς
  choice: bilang diwa ng hulaping -ng sa “nagkukunwaring”
  rationale: Natural na ipinahahayag sa Filipino ng kayariang “nagkukunwaring isang…” ang pag-aangkin ng anyo o papel.
- source_word: ἄγγελον
  choice: isang anghel
  rationale: Ang sobrenatural na konteksto ang nagtuturo sa kahulugang “anghel,” hindi lamang pangkalahatang “mensahero.”
- source_word: φωτός
  choice: ng liwanag
  rationale: Pinananatili ang genitibong larawan at ang mahalagang biblikal na sagisag ng liwanag nang walang dagdag na pagpapakahulugan.
theological_decisions:
- issue: Ang likas ng pagbabago ng anyo ni Satanas
  choice: Inilalarawan ang mapanlinlang na pagpapanggap o panlabas na anyo.
  alternative: Tunay na pagbabagong-anyo upang maging isang anghel ng liwanag.
  rationale: Sa konteksto, inihahambing ito sa mga huwad na apostol na mapanlinlang ang pagpapakita. Ang “nagkukunwari” ay nagpapakita ng diin sa panlilinlang ngunit hindi gumagawa ng karagdagang metapisikal na pahayag; inilalahad sa talababa ang mas literal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hindi ito kataka-taka” bilang natural na idyoma at ang “sapagkat” upang malinaw na maipakita ang paliwanag. Iniwasan ang labis na teknikal o denominasyonal na pananalita.
