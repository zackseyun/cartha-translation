  to: Sinasabi ko ito sa aming kahihiyan, na para bang naging mahina kami[a]. Ngunit sa anumang bagay na ipinangangahas ng sinuman[b]—nagsasalita ako nang may kahangalan[c]—mangangahas din ako.
  rationale: Pinalitan ang di-idiomatikong “sa aming ikahihiya” ng “sa aming kahihiyan.” Pinalitan ang “ng iba” ng “ng sinuman” upang tumpak na maipakita ang τις, at idinagdag ang “bagay” para maging natural at malinaw ang saklaw ng ἐν ᾧ nang hindi isinasama sa teksto ang ipinahihiwatig lamang na pagyayabang. Inihanay muli ang mga talababang marka sa mga salitang kanilang nililinaw.
