base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/021.yaml
  text: I say this to our shame[a], as though we had been weak[d][c][b]. Yet in whatever anyone dares to boast—I am speaking foolishly—I also dare.
translation:
  language: tl
  text: Sinasabi ko ito sa aming kahihiyan, na para bang naging mahina kami[a]. Ngunit sa anumang bagay na ipinangangahas ng sinuman[b]—nagsasalita ako nang may kahangalan[c]—mangangahas din ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na para bang mahina kami.” Ironiko ang pananalita ni Pablo sa konteksto ng kaniyang “hangal” na pagyayabang.
    reason: lexical_alternative
  - marker: b
    text: Literal, “sa anumang [bagay] na ipinangangahas ng sinuman.” Ipinahihiwatig ng konteksto na ang tinutukoy ay pangangahas na magyabang.
    reason: implicit_object
  - marker: c
    text: Maaari ring “nagsasalita ako na parang isang hangal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀτιμίαν
  choice: sa aming ikahihiya
  rationale: Ipinahahayag nito ang kahihiyan o kawalang-dangal na retorikal na iniuugnay ni Pablo sa kaniyang sarili at mga kasama, habang nananatiling natural sa makabagong Tagalog.
- source_word: ὡς ὅτι ἡμεῖς ἠσθενήκαμεν
  choice: na para bang naging mahina kami
  rationale: Pinananatili ng “para bang” ang anyong paghahambing at ironikong pagpapalagay; ang “naging mahina” ay hindi nililimitahan sa pisikal na karamdaman.
- source_word: ἐν ᾧ δ’ ἄν τις τολμᾷ
  choice: Ngunit sa anumang ipinangangahas ng iba
  rationale: Pinananatiling walang tahasang layon ang τολμᾷ, gaya ng Griyego. Mauunawaan sa konteksto na tumutukoy ito sa mapangahas na pagyayabang, ngunit hindi iyon idinaragdag sa pangunahing teksto.
- source_word: ἐν ἀφροσύνῃ λέγω
  choice: nagsasalita ako nang may kahangalan
  rationale: Malapit ito sa pormang Griyego at pinananatili ang pansariling retorikal na pasubali ni Pablo nang hindi siya tuwirang tinatawag na hangal.
- source_word: τολμῶ κἀγώ
  choice: nangangahas din ako
  rationale: Pinananatili ang pag-uulit ng pandiwang τολμάω at ang pagkakatulad nito sa naunang sugnay.
theological_decisions:
- issue: Ironikong pahayag tungkol sa kahinaan ni Pablo at ng kaniyang mga kasama
  choice: Gamitin ang “para bang naging mahina kami” bilang ironikong pagpapalagay
  alternative: Ituring itong tuwirang pag-amin na talagang mahina sila
  rationale: Ipinakikita ng mas malawak na konteksto ng “hangal” na pagyayabang ni Pablo na ironikong tinatanggap niya ang pagtingin ng iba, nang hindi nilulutas o inaalis ang retorikal na tensiyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “ikahihiya,” “ipinangangahas,” at “kahangalan” upang mapanatili ang matalas at pormal na himig ng retorika ni Pablo nang hindi nagiging lipas o labis na teknikal.
