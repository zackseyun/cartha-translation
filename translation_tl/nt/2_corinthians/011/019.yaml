  text: For you gladly put up with fools[b][a], being wise yourselves.
translation:
  language: tl
  text: Sapagkat malugod ninyong pinagtitiisan ang mga hangal[a]—matatalino naman kayo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinitiis ang mga hangal.”
    reason: lexical_alternative
  - marker: b
    text: 'Nagsasalita rito si Pablo nang may panunuya: itinuturing ng mga taga-Corinto na matatalino sila, ngunit pinagtitiisan nila ang mga hangal na pinuno.'
    reason: cultural_note
lexical_decisions:
- source_word: ἡδέως
  choice: malugod
  rationale: Ipinahahayag nito ang kusang-loob o nasisiyahang pagtanggap. Pinananatili ng “malugod” ang mapait na kabalintunaan ng pahayag ni Pablo.
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinakikilala nito ang paliwanag o dahilan kaugnay ng naunang pahayag.
- source_word: ἀνέχεσθε
  choice: pinagtitiisan
  rationale: Tumutukoy ito sa pagtitiis o patuloy na pagpaparaya sa isang tao. Likas sa Filipino ang “pinagtitiisan” at taglay nito ang bahagyang matalim na himig ng konteksto.
- source_word: τῶν ἀφρόνων
  choice: ang mga hangal
  rationale: Tuwirang tinutukoy ang mga taong walang wastong pag-iisip. Pinananatili ng “mga hangal” ang tahasang pagsalungat sa “matatalino.”
- source_word: φρόνιμοι
  choice: matatalino
  rationale: Pinananatili nito ang leksikal at retorikal na pagsalungat sa “mga hangal,” nang hindi ipinapaliwanag sa mismong talata ang kabalintunaan.
- source_word: ὄντες
  choice: —matatalino naman kayo
  rationale: Ginawang maikling kasunod na sugnay upang likas sa Filipino ngunit hindi tahasang pagpasyahan kung ang participle ay sanhi o pagsalungat. Ang “naman” ay tumutulong magpanatili ng retorikal na paghahambing.
theological_decisions:
- issue: Ang mapanuyang pananalita ni Pablo sa mga taga-Corinto
  choice: Pinanatiling tuwiran ang pahayag at ipinahiwatig ang kabalintunaan sa paghaharap ng “mga hangal” at “matatalino naman kayo.”
  alternative: Gawing hayag ang panunuya, gaya ng “dahil napakatalino ninyo” o ang pagsalungat, gaya ng “gayong matatalino kayo.”
  rationale: Ang Griyego mismo ang lumilikha ng kabalintunaan sa magkatabing “mga hangal” at “matatalino.” Hindi kailangang magdagdag ng salita na magpapasya kung sanhi o pagsalungat ang diwa ng participle.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang gitling na em dash upang maipakita ang matalim na retorikal na paghaharap nang hindi nagdaragdag ng tahasang panandang sanhi o pagsalungat.
