id: 2CO.11.10
reference: 2 Corinthians 11:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔστιν ἀλήθεια Χριστοῦ ἐν ἐμοὶ ὅτι ἡ καύχησις αὕτη οὐ φραγήσεται εἰς ἐμὲ ἐν τοῖς κλίμασι τῆς Ἀχαΐας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/010.yaml
  text: As the truth of Messiah is in me[c][b][a], this boasting of mine will not be silenced in the regions of Achaia.
translation:
  language: tl
  text: Nasa akin ang katotohanan ng Mesiyas:[a] hindi mapipigilan ang pagmamalaki kong ito[b] sa mga dako ng Acaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Nasa akin ang katotohanan ni Cristo.”'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin: “ang pagmamalaking ito ay hindi hahadlangan para sa akin” o “ang pagmamalaking ito tungkol sa akin ay hindi mapatatahimik.” Mahirap at idyomatiko ang pananalitang Griyego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια Χριστοῦ
  choice: katotohanan ng Mesiyas
  rationale: Pinananatili ang ugnayang genitibo nang hindi nilulutas kung ito ay katotohanang nauukol, nagmumula, o pag-aari ng Mesiyas. Ginamit ang “Mesiyas” sapagkat may puwersa pa rin dito ang titulo.
- source_word: ἐν ἐμοὶ
  choice: nasa akin
  rationale: Likas na katumbas sa Tagalog na nagpapanatili sa taimtim at halos panunumpang pahayag ni Pablo.
- source_word: ὅτι
  choice: ':'
  rationale: Ang tutuldok ay natural na naghaharap sa nilalaman at bunga ng taimtim na pormula nang hindi ito ginagawang tahasang sanhi o paghahambing.
- source_word: καύχησις
  choice: pagmamalaki
  rationale: Pinananatili ang diwa ng kilos o nilalaman ng pagmamapuri, gamit ang karaniwang salitang nauunawaan sa makabagong Tagalog.
- source_word: οὐ φραγήσεται
  choice: hindi mapipigilan
  rationale: Isinasalin ang hinaharap na balintiyak at ang metapora ng pagharang o pagpapatigil nang natural sa Tagalog.
- source_word: εἰς ἐμὲ
  choice: kong ito
  rationale: 'Isinama ang mahirap na pariralang tumutukoy kay Pablo bilang pagmamay-ari o kaugnayan: “ang pagmamalaki kong ito,” isang likas na pagpapahayag sa Tagalog.'
- source_word: ἐν τοῖς κλίμασι τῆς Ἀχαΐας
  choice: sa mga dako ng Acaya
  rationale: Ipinananatili ang maramihang κλίμασι at iniiwasan ang mas teknikal na “mga rehiyon,” habang malinaw pa rin ang heograpikong saklaw.
theological_decisions:
- issue: Paglalahad sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay may puwersa ng titulo; pinili ang “Mesiyas” habang inilalagay sa talababa ang tradisyonal na “Cristo” bilang lehitimong alternatibo.
- issue: Ugnayan ng ἀλήθεια Χριστοῦ
  choice: katotohanan ng Mesiyas
  alternative: katotohanan ni Cristo
  rationale: Hindi tinukoy nang higit sa Griyego kung ang genitibo ay pag-aari, kaugnayan, o pinagmulan, kaya pinanatili ang maluwag na pariralang “ng Mesiyas.”
- issue: Puwersa ng pambungad na pahayag
  choice: Taimtim na pahayag na sinusundan ng tutuldok
  alternative: Kung paanong nasa akin ang katotohanan ng Mesiyas
  rationale: Iniiwasan ang maling pahiwatig ng sanhi mula sa “yamang” at ang labis na paghahambing mula sa “kung paanong,” habang pinananatili ang bigat ng pormulang halos panunumpa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga dako” bilang karaniwang heograpikong pananalita at “mapipigilan” upang likas na maihatid ang balintiyak na metapora. Ang ayos na may tutuldok ay sadyang nagpapanatili sa taimtim na diin at sa ilang kalabuan ng Griyego.
