base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/031.yaml
  text: The God and Father of the Lord Jesus[a], he who is blessed forever, knows that I am not lying.
translation:
  language: tl
  text: Alam ng Diyos at Ama ng Panginoong Jesus—ang siyang pinagpala magpakailanman[a]—na hindi ako nagsisinungaling.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sa mga kapanahunan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: ang Diyos at Ama
  rationale: Pinananatili ang iisang pariralang tumutukoy sa Diyos bilang Diyos at Ama, pati ang maringal na anyo ng taimtim na pahayag ni Pablo.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ng Panginoong Jesus
  rationale: Likas sa modernong Tagalog ang pag-uugnay na “Panginoong Jesus”; hindi idinagdag ang “ating,” sapagkat wala ito sa Griyego.
- source_word: οἶδεν
  choice: Alam
  rationale: Tuwirang katumbas ito ng pandiwang nangangahulugang “nakaaalam”; hindi ito pinalawak bilang “saksi” kahit may himig-panunumpa ang pahayag.
- source_word: ὁ ὢν εὐλογητὸς
  choice: siya na pinupuri
  rationale: Sa doxolohikal na gamit, natural na ipinahahayag sa Tagalog ang εὐλογητός bilang karapat-dapat at patuloy na pinupuri, sa halip na ang malabong “pinagpala” kapag tumutukoy sa Diyos.
- source_word: εἰς τοὺς αἰῶνας
  choice: magpakailanman
  rationale: Natural at maringal na Tagalog para sa walang-hanggang doxolohikal na diwa; ang mas literal na “sa mga kapanahunan” ay inilagay sa talababa.
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng nalalaman ng Diyos, hindi ang dahilan.
- source_word: οὐ ψεύδομαι
  choice: hindi ako nagsisinungaling
  rationale: Natural na kasalukuyang pahayag sa modernong Tagalog at angkop sa taimtim na paggiit sa konteksto.
theological_decisions:
- issue: Ugnayan ng “Diyos at Ama” sa “Panginoong Jesus”
  choice: Isinalin nang tuwiran bilang “ang Diyos at Ama ng Panginoong Jesus.”
  alternative: Palabnawin o iparaprasang alisin ang malinaw na pagkakaiba ng mga tinutukoy.
  rationale: Pinananatili nito ang relasyonal na pagkakaibang hayag sa Griyego nang hindi nagdaragdag ng paliwanag o denominasyonal na pagbasa.
- issue: Pagkakabit ng doxolohikal na sugnay
  choice: Itinuring ang “siya na pinupuri magpakailanman” bilang paningit na paglalarawan sa Diyos at ibinukod sa pamamagitan ng mga gitling.
  alternative: Ikabit ito bilang mahigpit na pantukoy na sugnay nang walang paningit na bantas.
  rationale: Malinaw nitong ipinakikitang doxolohikal na paningit ang parirala sa loob ng taimtim na pahayag, habang nananatiling natural ang daloy sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pinupuri” sa doxolohiya upang maiwasan ang di-likas o posibleng malabong “pinagpala” kapag Diyos ang tinutukoy. Inuna ang “Alam” para sa mas natural na ayos ng pangungusap sa Tagalog, nang hindi binabago ang diin o nilalaman.
