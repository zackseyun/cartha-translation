id: 2CO.11.20
reference: 2 Corinthians 11:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀνέχεσθε γὰρ εἴ τις ὑμᾶς καταδουλοῖ, εἴ τις κατεσθίει, εἴ τις λαμβάνει, εἴ τις ἐπαίρεται, εἴ τις ⸂εἰς πρόσωπον ὑμᾶς⸃ δέρει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/020.yaml
  text: For you put up with it if someone enslaves you[a], if someone devours you, if someone takes from you, if someone exalts himself[b], if someone strikes you in the face.
translation:
  language: tl
  text: Sapagkat pinagtitiisan ninyo ito kung may umaalipin sa inyo, kung may lumalamon sa inyo, kung may kumukuha mula sa inyo[a], kung may nagmamataas, o kung may humahampas sa mukha ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagsasamantala sa inyo”; payak na “kumukuha” ang Griyego, malamang sa mapagsamantalang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέχεσθε
  choice: nagtitiis kayo
  rationale: Likas sa modernong Tagalog at malinaw na inilalarawan ang aktuwal na pagtitiis ng mga taga-Corinto sa mapang-abusong pakikitungo; napananatili rin ang mapanuyang tono.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan ng talata sa naunang sinabi ni Pablo.
- source_word: καταδουλοῖ
  choice: umaalipin sa inyo
  rationale: Tuwirang pinananatili ang matinding diwa ng pagpapasailalim bilang alipin at hindi ito pinalalambot.
- source_word: κατεσθίει
  choice: lumalamon sa inyo
  rationale: Pinananatili ang matingkad at mapanilang talinghaga ng ganap na pagsasamantala.
- source_word: λαμβάνει
  choice: kumukuha sa inyo
  rationale: Pinananatili ang malawak at walang tahasang layon na kahulugan ng pandiwa; ipinahihiwatig ng konteksto ang mapagsamantalang pagkuha nang hindi nililimitahan sa salapi o ari-arian.
- source_word: ἐπαίρεται
  choice: nagmamataas
  rationale: Natural na Tagalog para sa pag-aangat sa sarili o mapagmataas na pagkilos, nang hindi nagdaragdag ng tiyak na doktrinal na pakahulugan.
- source_word: εἰς πρόσωπον ὑμᾶς δέρει
  choice: sumasampal sa inyong mukha
  rationale: Natural at kongkretong paglalarawan ng mapang-insultong pananakit sa mukha; ang δέρει ay maaaring tumukoy sa paghampas o pananakit.
- source_word: εἴ τις
  choice: kapag may
  rationale: Sa konteksto, inilalarawan ng paulit-ulit na kondisyon ang mga pangyayaring talagang pinagtitiisan nila; ang paulit-ulit na anyo ay pinananatili para sa retorikal na diin.
theological_decisions:
- issue: Mapanuyang tono ng pahayag ni Pablo
  choice: Inilalarawan ang pagtitiis ng mga taga-Corinto sa mapang-abusong mga tao nang hindi tahasang pinapangalanan ang mga ito sa pangunahing teksto.
  alternative: Tahasang tukuyin ang mga gumagawa nito bilang mga huwad na apostol o guro.
  rationale: Sinusuportahan ng konteksto ang mapanuyang pagsaway at ang pagkakakilanlan ng mga mapang-abuso, ngunit sa talatang ito mismo ay mga kilos lamang ang nakalista. Kaya hindi idinaragdag sa salin ang katawagang wala sa Griyego.
- issue: Kahulugan ng λαμβάνει
  choice: kumukuha sa inyo
  alternative: nagsasamantala sa inyo
  rationale: May mapagsamantalang diwa ang konteksto, ngunit payak na “kumukuha” ang pandiwang Griyego. Pinananatili ng salin at talababa ang tunay na lawak ng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod na estruktura at tumitinding larawan ng pang-aabuso. Ginamit ang “o” bago ang huling sugnay upang maging natural ang mahabang talaan sa Tagalog nang hindi binabago ang diwa.
