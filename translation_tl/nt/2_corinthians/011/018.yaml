  text: Since many boast according to the flesh[a], I too will boast.
translation:
  language: tl
  text: Yamang marami ang nagmamalaki ayon sa laman[a], magmamalaki rin ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa pamantayan ng tao” o “sa paraang pantao lamang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Yamang
  rationale: Likas at marangal na panandang sanhi sa Filipino; ipinakikita nitong ang ginagawa ng marami ang batayan ng mapang-uyam na pasiya ni Pablo.
- source_word: πολλοὶ
  choice: marami
  rationale: Tuwirang katumbas na nagpapanatili sa di-tiyak ngunit malaking bilang.
- source_word: καυχῶνται
  choice: nagmamalaki
  rationale: Angkop sa polemikal at mapang-uyam na konteksto; ipinananatili rin ang pag-uulit ng kaparehong pandiwa sa hulihan.
- source_word: κατὰ σάρκα
  choice: ayon sa laman
  rationale: Pinananatili ang mahalaga at sadyang hindi lubos na nilulutas na larawan ng σάρξ, habang nililinaw sa talababa ang posibleng idyomatikong diwa.
- source_word: κἀγὼ
  choice: rin ako
  rationale: Ipinahahayag ang καί + ἐγώ at ang retorikal na pagtulad ni Pablo sa ginagawa ng iba.
- source_word: καυχήσομαι
  choice: magmamalaki
  rationale: Anyong panghinaharap na inuulit ang salitang ginamit sa unang sugnay at pinananatili ang retorikal na paralelismo.
theological_decisions:
- issue: Kahulugan ng σάρξ sa pariralang κατὰ σάρκα
  choice: ayon sa laman
  alternative: ayon sa pamantayan ng tao; sa paraang makatao lamang
  rationale: Hindi ito tahasang tinutukoy bilang pisikal na katawan o likas na makasalanan. Ang literal na anyo sa pangunahing teksto ay nagpapanatili sa teolohikal na lawak at tensiyon ng pananalita ni Pablo; inilalagay sa talababa ang mas idyomatikong mga pagbasa.
translation_notes:
  register: Modernong Filipino na maikli, dignified, at madaling maunawaan. Ginamit ang “nagmamalaki” sa dalawang sugnay upang marinig ang sinadyang pag-uulit ng Griyego; pinanatili ang “laman” upang hindi paliitin ang saklaw ng σάρξ.
