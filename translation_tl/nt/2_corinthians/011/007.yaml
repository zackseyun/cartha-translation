id: 2CO.11.7
reference: 2 Corinthians 11:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἢ ἁμαρτίαν ἐποίησα ἐμαυτὸν ταπεινῶν ἵνα ὑμεῖς ὑψωθῆτε, ὅτι δωρεὰν τὸ τοῦ θεοῦ εὐαγγέλιον εὐηγγελισάμην ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/007.yaml
  text: Or did I commit a sin by humbling myself so that you might be exalted[b][a], because I proclaimed the gospel of God to you free of charge?
translation:
  language: tl
  text: O nakagawa ba ako ng kasalanan[a] nang magpakumbaba ako upang maitaas kayo, dahil ipinahayag ko sa inyo ang ebanghelyo ng Diyos nang walang bayad[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagkasala ba ako.” Sa literal, ang idyomang Griyego ay “gumawa ba ako ng kasalanan.”
    reason: lexical_alternative
  - marker: b
    text: O, “nang hindi tumatanggap ng kabayaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: O
  rationale: Ipinananatili ang matalim na retorikal na alternatibo na nag-uugnay sa tanong sa naunang argumento.
- source_word: ἁμαρτίαν ἐποίησα
  choice: nakagawa ba ako ng kasalanan
  rationale: Natural sa Tagalog at malapit sa idyomang Griyego na literal na tumutukoy sa ‘paggawa’ ng kasalanan; pinananatili rin nito ang moral na bigat ng tanong.
- source_word: ἐμαυτὸν ταπεινῶν
  choice: nang magpakumbaba ako
  rationale: Malinaw at natural na ipinahahayag ang pansarili at pang-abay na diwa ng participle.
- source_word: ἵνα ὑμεῖς ὑψωθῆτε
  choice: upang maitaas kayo
  rationale: Pinananatili ang sugnay ng layunin, ang balintunang paghahambing sa pagpapakumbaba ni Pablo, at ang posibleng diwa ng pag-angat sa kalagayan o karangalan.
- source_word: ὅτι
  choice: dahil
  rationale: Malinaw na iniuugnay ang diumano’y kasalanan sa walang-bayad na pagpapahayag ng ebanghelyo.
- source_word: δωρεὰν
  choice: nang walang bayad
  rationale: Natural, dignificado, at tuwirang nagsasaad na hindi humingi o tumanggap si Pablo ng kabayaran.
- source_word: τὸ τοῦ θεοῦ εὐαγγέλιον
  choice: ang ebanghelyo ng Diyos
  rationale: Pinananatili ang genitibong kayarian at ang pamilyar ngunit marangal na katawagang Paulino.
- source_word: εὐηγγελισάμην ὑμῖν
  choice: ipinahayag ko sa inyo
  rationale: Ipinapakita ang hayagang pagpapabatid ng mabuting balita nang hindi nililimitahan ang pandiwa sa isang pormal na sermon.
theological_decisions:
- issue: Ang retorikal na tanong ni Pablo tungkol sa pagpapakumbaba at hindi pagtanggap ng bayad
  choice: Tuwirang panatilihin ang ironikong tanong nang hindi hinahatulan sa salin ang usapin ng kabayaran sa ministeryo.
  alternative: Palawakin ang salin upang sabihing tinalikuran ni Pablo ang isang karapatang apostoliko, o pahinain ang ironya at gawin itong karaniwang paghingi ng paumanhin.
  rationale: Itinatanong mismo ng Griyego kung kasalanan ang kanyang pagpapakumbaba at walang-bayad na pagpapahayag. Hindi dapat dagdagan ng salin ang isang doktrinal na pasya na hindi tahasang sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang matalim na retorikal na tanong at ang salungatan ng pagpapakumbaba ni Pablo at pagkataas ng mga taga-Corinto, nang hindi labis na ipinapaliwanag ang ironya.
