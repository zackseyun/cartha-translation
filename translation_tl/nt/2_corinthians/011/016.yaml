  text: Πάλιν λέγω, μή τίς με δόξῃ ἄφρονα εἶναι— εἰ δὲ μή γε, κἂν ὡς ἄφρονα δέξασθέ με, ἵνα κἀγὼ μικρόν τι καυχήσωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/016.yaml
  text: Again I say[a], let no one think me to be foolish—but if not, then receive me even as foolish, so that I too may boast a little.
translation:
  language: tl
  text: 'Muli kong sinasabi: huwag isipin ng sinuman na hangal ako. Ngunit kung hindi, tanggapin ninyo ako kahit bilang isang hangal, upang makapagmalaki rin ako nang kaunti.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na ἄφρων ay maaaring unawain bilang pang-uri (“hangal”) o bilang pangngalan (“isang hangal”).
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν λέγω
  choice: Muli kong sinasabi
  rationale: Likas na modernong Tagalog para sa pag-uulit ng pakiusap ni Pablo, habang pinananatili ang tuwirang pananalita.
- source_word: μή τίς με δόξῃ ἄφρονα εἶναι
  choice: huwag isipin ng sinuman na hangal ako
  rationale: Ipinapahayag ang negatibong pakiusap o pagbabawal ng μή na may subjunctive at pinananatili ang tahasang katawagang ἄφρων.
- source_word: εἰ δὲ μή γε
  choice: Ngunit kung iisipin ninyo iyon
  rationale: 'Ginagawang malinaw sa natural na Tagalog ang ipinahihiwatig na kondisyon: kung hindi nila pagbibigyan ang naunang pakiusap at ituturing pa rin siyang hangal.'
- source_word: κἂν ὡς ἄφρονα δέξασθέ με
  choice: tanggapin ninyo ako kahit bilang isang hangal
  rationale: Ang “kahit” ay nagpapanatili sa concessive force, at ang “tanggapin” ay angkop sa utos na δέξασθέ.
- source_word: ἵνα κἀγὼ μικρόν τι καυχήσωμαι
  choice: upang makapagmalaki rin ako nang kaunti
  rationale: Pinananatili ang layunin ng ἵνα, ang diin ng κἀγώ na “rin ako,” at ang retorikal na wikang “magmalaki” nang hindi ito pinapalambot.
theological_decisions:
- issue: Ang ironikong pagtukoy ni Pablo sa sarili bilang ἄφρων at ang kaniyang pagmamapuri
  choice: Panatilihin ang “hangal” at “makapagmalaki”
  alternative: Palambutin bilang “nagsasalita nang di-matalino” o “makapagsalita tungkol sa sarili”
  rationale: Mahalaga sa daloy ng argumento ang tensiyon ng waring kahangalan at nag-aatubiling pagmamalaki ni Pablo; hindi ito dapat ipaliwanag o palambutin sa salin.
- issue: Pang-uri o pangngalang gamit ng ἄφρων
  choice: “hangal ako” sa una at “bilang isang hangal” sa ikalawa
  alternative: “ako ay mangmang” / “bilang mangmang,” o parehong purong pang-uring anyo
  rationale: Parehong lehitimo sa Griyego ang adjectival at substantival na pagkaunawa. Ang napiling Tagalog ay natural at pinananatili ang pag-uulit; itinatala sa talababa ang posibleng alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kayo/ninyo” upang maipakita na ang utos na δέξασθε ay maramihan. Inilagay ang talababa matapos ang buong pangungusap, at lumilitaw ang marker na [a] sa pangunahing teksto.
