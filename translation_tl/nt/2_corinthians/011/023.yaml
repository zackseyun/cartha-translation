  source_fidelity: Napananatili ng draft ang paghahambing ni Pablo sa mga diumano’y lingkod ng Mesiyas at ang pangkalahatang talaan ng kanyang mga pagdurusa. Gayunman, ang “di-mabilang na mga pambubugbog” ay nagpapahiwatig ng daming hindi mabibilang, samantalang ang ὑπερβαλλόντως ay nagsasaad ng tinding “higit sa sukat.” Ang ayos na “higit sa mga pagpapagal” ay hindi rin natural na katumbas ng paulit-ulit na paghahambing sa Griyego.
  naturalness: May ilang hindi likas na parirala sa draft, lalo na ang “higit sa mga pagpapagal” at “higit sa mga pagkabilanggo.” Mas malinaw at mas natural ang paghahanay na “sa mga pagpapagal, higit; sa mga pagkabilanggo, higit,” na pinananatili ang maigsi at retorikal na estilo ng orihinal.
  terminology: Ang “mga lingkod,” “Mesiyas,” at “mga pagkabilanggo” ay angkop. Ang “Cristo” bilang alternatibong salin sa talababa ay wasto. Ang “bingit ng kamatayan” ay isang ligtas na pagpapaliwanag ng di-pangkaraniwang “sa mga kamatayan,” kung may talababa na nagsasaad ng literal na anyo.
