base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/023.yaml
  text: 'Are they servants of Messiah? I am speaking as if insane: I am more so—in labors more abundantly[a], in imprisonments more abundantly, in beatings beyond measure[b], in deaths often.'
translation:
  language: tl
  text: 'Mga lingkod ba sila ng Mesiyas?[a] Nagsasalita ako na tila nawawalan ng bait: mas higit ako—sa mga pagpapagal, higit; sa mga pagkabilanggo, higit; sa mga pambubugbog, nang higit sa sukat; madalas na malagay sa bingit ng kamatayan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya, “Cristo”: “Mga lingkod ba sila ni Cristo?”'
    reason: alternatibong salin ng titulo Χριστός
  - marker: b
    text: Sa literal, “madalas na nasa mga kamatayan,” na malamang ay tumutukoy sa paulit-ulit na pagkalagay sa bingit ng kamatayan o sa mga panganib na nakamamatay.
    reason: paglilinaw sa kapansin-pansing maramihang anyo ng θάνατος
lexical_decisions:
- source_word: διάκονοι
  choice: mga lingkod
  rationale: Tuwirang ipinapahayag ang paglilingkod nang hindi nagdaragdag ng makabagong titulong pansimbahan na maaaring ipahiwatig ng “mga ministro.”
- source_word: Χριστοῦ
  choice: ng Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulo; malinaw sa karaniwang mambabasa ang “Mesiyas” at pinananatili ang tungkulin nito bilang titulo.
- source_word: παραφρονῶν λαλῶ
  choice: Nagsasalita akong parang nasisiraan ng bait
  rationale: Pinananatili ang pagkukumpara at ang kusang pagkilala ni Pablo na ang ganitong pagyayabang ay tila kabaliwan.
- source_word: ὑπὲρ ἐγώ
  choice: lalo pa ako
  rationale: 'Natural na Filipino para sa maigsi at eliptikong paghahambing: inaangkin ni Pablo na higit siyang lingkod sa puntong pinag-uusapan.'
- source_word: ἐν κόποις περισσοτέρως
  choice: higit sa mga pagpapagal
  rationale: Ipinahihiwatig ng κόπος ang mabigat at nakapapagod na paggawa; pinananatili ng “higit” ang paghahambing.
- source_word: ἐν φυλακαῖς περισσοτέρως
  choice: higit sa mga pagkabilanggo
  rationale: Ang maramihang anyo ay tumutukoy sa paulit-ulit na mga karanasan ng pagkakakulong, hindi lamang sa mga lugar na bilangguan.
- source_word: ἐν πληγαῖς ὑπερβαλλόντως
  choice: di-mabilang na mga pambubugbog
  rationale: Natural na ipinapahayag sa Filipino ang labis na tindi o dami ng mga hampas nang hindi nililimitahan ang πληγαί sa isang partikular na legal na uri ng paghagupit.
- source_word: ἐν θανάτοις πολλάκις
  choice: madalas na nasa bingit ng kamatayan
  rationale: 'Ipinahahayag ang malamang na idyomatikong kahulugan ng kapansin-pansing maramihang “mga kamatayan”: paulit-ulit na pagharap sa napipintong kamatayan.'
theological_decisions:
- issue: Pagpapahayag sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Titulo ang gamit sa kontekstong ito, kaya isinasalin itong “Mesiyas”; inilalagay sa talababa ang tradisyonal na “Cristo” bilang lehitimong alternatibo.
- issue: Kahulugan ng ἐν θανάτοις πολλάκις
  choice: madalas na nasa bingit ng kamatayan
  alternative: madalas na nasa mga kamatayan
  rationale: Ang literal na maramihang anyo ay di-pangkaraniwan at malamang na tumutukoy sa paulit-ulit na matinding panganib sa buhay. Isinasama sa talababa ang literal na anyo upang mapanatili ang retorikal na tensiyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matalim at eliptikong retorika ni Pablo, habang ginawang natural ang talaan ng kanyang mga pagdurusa. Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto at tumutugma sa mga talababa.
