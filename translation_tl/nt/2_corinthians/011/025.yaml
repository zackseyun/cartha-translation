revisions:
- from: Tatlong ulit akong hinampas ng mga pamalo, minsan akong pinagbabato, at tatlong ulit akong nakaranas ng pagkawasak ng barko. Isang gabi at isang araw akong namalagi sa kalaliman ng dagat.[a]
  to: Tatlong ulit akong hinampas ng mga pamalo, minsan akong binato ng mga bato, at tatlong ulit akong dumanas ng pagkawasak ng barko. Nagpalipas ako ng isang gabi at isang araw sa kalaliman ng dagat.[a]
  rationale: Nilinaw ang marahas na pagbato sa pamamagitan ng “binato ng mga bato,” pinasimple ang salin ng ναυαγέω, at ginawang mas natural ang idiom para sa νυχθήμερον ... πεποίηκα. Hindi binago ang saklaw o pagkakasunod ng mga pangyayari, at pinanatili ang talababa para sa alternatibong pag-unawa sa βυθός.
