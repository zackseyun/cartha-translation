base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/025.yaml
  text: Three times I was beaten with rods[a], once I was stoned, three times I was shipwrecked; I have spent a night and a day in the deep.
translation:
  language: tl
  text: Tatlong ulit akong hinampas ng mga pamalo, minsan akong binato ng mga bato, at tatlong ulit akong dumanas ng pagkawasak ng barko. Nagpalipas ako ng isang gabi at isang araw sa kalaliman ng dagat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa laot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τρὶς
  choice: tatlong ulit
  rationale: Likas at malinaw na panandang pang-abay para sa tatlong magkahiwalay na pangyayari; pareho ang salin sa dalawang paglitaw nito.
- source_word: ἐραβδίσθην
  choice: hinampas ng mga pamalo
  rationale: Ipinapahayag ng pandiwa ang pambubugbog gamit ang mga pamalo; tahasang pinananatili ang kasangkapang ginamit.
- source_word: ἅπαξ
  choice: minsan
  rationale: Maikli at karaniwang salin para sa isang pangyayari.
- source_word: ἐλιθάσθην
  choice: pinagbabato
  rationale: Ipinahihiwatig ang marahas at paulit-ulit na paghagis ng mga bato sa tao, hindi lamang ang isang paghagis.
- source_word: ἐναυάγησα
  choice: nakaranas ng pagkawasak ng barko
  rationale: Natural at tiyak na paglalarawan sa pagdanas ng shipwreck nang hindi nagdaragdag ng detalye tungkol sa naging kalagayan ng barko o ni Pablo.
- source_word: νυχθήμερον
  choice: isang gabi at isang araw
  rationale: Pinananatili ang pagkakasunod na gabi at araw sa salitang Griyego at iniiwasan ang higit na eksaktong modernisasyong “dalawampu't apat na oras.”
- source_word: ἐν τῷ βυθῷ
  choice: sa kalaliman ng dagat
  rationale: Malapit sa literal na diwa ng βυθός bilang malalim na dagat o tubig, habang ang posibleng kahulugang “sa laot” ay inilalahad sa talababa.
- source_word: πεποίηκα
  choice: namalagi
  rationale: Sa ekspresyong tumutukoy sa haba ng panahon, ang ποιέω ay nangangahulugang magpalipas o mamalagi; natural sa Filipino ang “namalagi” sa kontekstong ito.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “ulit” sa halip na mas kolokyal na “beses,” at pinanatili sa talababa ang leksikal na posibilidad na ang βυθός ay tumutukoy sa laot.
