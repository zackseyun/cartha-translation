  text: τίς ἀσθενεῖ, καὶ οὐκ ἀσθενῶ; τίς σκανδαλίζεται καὶ οὐκ ἐγὼ πυροῦμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/029.yaml
  text: Who is weak[a], and I am not weak? Who is caused to stumble, and I do not burn with indignation?
translation:
  language: tl
  text: Sino ang nanghihina, at hindi rin ako nanghihina? Sino ang napapatisod, at hindi rin ako nag-aalab[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “nag-aalab” ay isang talinghaga sa Griyego at maaaring magpahayag ng matinding dalamhati, malasakit, sigasig, o galit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενεῖ / ἀσθενῶ
  choice: nanghihina / nanghihina
  rationale: Sinasaklaw ng “nanghihina” ang pisikal, panlipunan, o espirituwal na kahinaan at pinananatili ang pag-uulit na nagpapahayag ng pakikiisa ni Pablo.
- source_word: σκανδαλίζεται
  choice: napapatisod
  rationale: Pinananatili nito ang talinghaga ng pagkatisod at ang diwang pasibo, nang hindi tiyakang nililimitahan ang bunga sa pagkatisod ng damdamin, pagkakasala, o espirituwal na pagbagsak.
- source_word: πυροῦμαι
  choice: nag-aalab
  rationale: Pinananatili ng “nag-aalab” ang matingkad na talinghaga ng apoy at hindi ipinipilit kung ang matinding damdamin ay dalamhati, malasakit, sigasig, o galit.
- source_word: τίς
  choice: Sino
  rationale: Likas at tuwirang panimula ito sa dalawang retorikal na tanong tungkol sa mga tao.
- source_word: καὶ οὐκ ἐγὼ
  choice: at hindi rin ako
  rationale: Ipinahihiwatig ng “rin” ang mariing pakikiisa ni Pablo, habang nananatiling natural ang ayos sa makabagong Tagalog.
theological_decisions:
- issue: Eksaktong damdaming ipinahahayag ng πυροῦμαι
  choice: Panatilihin ang talinghagang “nag-aalab” sa pangunahing teksto.
  alternative: “nag-aalab sa galit,” “nag-aalab sa dalamhati,” o “matinding nababagabag”
  rationale: Hindi tinutukoy ng Griyegong talinghaga ang iisang damdamin lamang. Pinananatili ng salin ang masidhing pakikiisa ni Pablo at ang tunay na kalabuan ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang magkatugmang retorikal na mga tanong at ang talinghaga ng pagkatisod at pag-aalab.
