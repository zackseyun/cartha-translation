  text: Ὃ δὲ ποιῶ καὶ ποιήσω, ἵνα ἐκκόψω τὴν ἀφορμὴν τῶν θελόντων ἀφορμήν, ἵνα ἐν ᾧ καυχῶνται εὑρεθῶσιν καθὼς καὶ ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/012.yaml
  text: But what I am doing[a], I will continue to do, in order to cut off the opportunity from those who want an opportunity, so that in what they boast about they may be found to be just as we are.
translation:
  language: tl
  text: Ngunit ang ginagawa ko ay patuloy kong gagawin, upang putulin ang pagkakataon[a] ng mga nagnanais ng pagkakataon, upang sa bagay na ipinagmamalaki nila ay masumpungan silang katulad din namin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “okasyon,” “dahilan,” o “maidadahilan”; gayundin sa ikalawang paglitaw ng “pagkakataon” (Griyego ἀφορμή).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ δὲ ποιῶ καὶ ποιήσω
  choice: Ngunit ang ginagawa ko ngayon ay patuloy kong gagawin
  rationale: Ipinapahayag ng pangkasalukuyan at panghinaharap na anyo ng ποιέω ang kasalukuyang ginagawa ni Pablo at ang pasiya niyang ipagpatuloy iyon. Nililinaw ng “ngayon” at “patuloy” ang likas na diwa ng Griyego sa natural na Tagalog.
- source_word: ἐκκόψω
  choice: putulin
  rationale: Pinananatili ng “putulin” ang matingkad na metapora ng ἐκκόπτω, na sa kontekstong ito ay nangangahulugang alisin o ipagkait ang isang pagkakataon.
- source_word: ἀφορμή
  choice: pagkakataon
  rationale: Maaaring tumukoy ang ἀφορμή sa pagkakataon, okasyon, o dahilang magagamit. Ang “pagkakataon” ang pinakamalawak at hindi labis na mapanghusgang katumbas; inilagay sa talababa ang mas interpretibong “dahilan” o “maidadahilan.”
- source_word: τῶν θελόντων ἀφορμήν
  choice: ng mga naghahanap ng pagkakataon
  rationale: Natural sa Tagalog ang “naghahanap” para sa mga taong sadyang nagnanais makakuha ng isang pagbubukas o batayan. Pinananatili rin nito ang pag-uulit ng ἀφορμή.
- source_word: ἐν ᾧ καυχῶνται
  choice: sa bagay na ipinagmamalaki nila
  rationale: Pinananatili nito ang hindi tiyak na tinutukoy ng panghalip na ᾧ at inilalarawan ang larangan o bagay ng kanilang pagmamalaki nang hindi ito tinutukoy nang higit sa teksto.
- source_word: εὑρεθῶσιν καθὼς καὶ ἡμεῖς
  choice: makita silang tulad din namin
  rationale: Ang “makita” ay natural na katumbas ng pasibong εὑρεθῶσιν sa ganitong pahayag, samantalang malinaw na pinananatili ng “tulad din namin” ang paghahambing kay Pablo at sa kaniyang mga kamanggagawa.
theological_decisions:
- issue: Ang uri ng ἀφορμή na hinahanap ng mga kalaban ni Pablo
  choice: Isinalin sa pangunahing teksto bilang neutral na “pagkakataon.”
  alternative: “dahilan” o “maidadahilan”
  rationale: Bagaman negatibo at polemikal ang konteksto, hindi sapilitang nangangahulugan ang pangngalan ng mapanlinlang na pagdadahilan. Pinananatili ng neutral na salin ang lawak at tensiyon ng salita, habang inilalahad sa talababa ang posibleng mas negatibong diwa.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang pag-uulit ng “pagkakataon,” ang metaporang “putulin,” at ang bahagyang di-tiyak na “bagay na ipinagmamalaki nila” upang hindi paliitin ang kahulugan ng orihinal.
