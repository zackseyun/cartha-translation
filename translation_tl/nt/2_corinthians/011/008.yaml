lexical_decisions:
- source_word: ἄλλας ἐκκλησίας
  choice: ibang mga iglesya
  rationale: Sa gamit ni Pablo, ang ἐκκλησία ay karaniwang tumutukoy sa mga lokal na kongregasyong Kristiyano; natural at malinaw sa modernong Filipino ang “mga iglesya.”
- source_word: ἐσύλησα
  choice: ninakawan
  rationale: Malakas ang pandiwang συλάω, na nangangahulugang manamsam o magnakaw. Pinananatili ng “ninakawan” ang matalim at mapag-uyam na pagmamalabis ni Pablo sa halip na palambutin ito.
- source_word: λαβὼν
  choice: sa pagtanggap ko
  rationale: Ipinapakita ng aorist participle kung paano naganap ang sinasabi niyang “pagnanakaw”; malinaw at natural sa Filipino ang ugnayang ito.
- source_word: ὀψώνιον
  choice: tulong
  rationale: Bagaman literal na tumutukoy sa sahod o bayad, sa kontekstong ito ay pinansiyal o materyal na suporta ang diwa. Iniiwasan ng “tulong” ang labis na pahiwatig ng pormal na empleyo, habang inilalagay sa talababa ang mas literal na mga katumbas.
- source_word: πρὸς τὴν ὑμῶν διακονίαν
  choice: upang makapaglingkod sa inyo
  rationale: 'Ipinahihiwatig ng πρός at ng konteksto ang layunin ng tinanggap na tulong: ang paglilingkod ni Pablo sa mga taga-Corinto. Nililinaw ng salin kung sino ang naglilingkod nang hindi binabago ang kahulugan.'
theological_decisions:
- issue: Retorikal na puwersa ng pahayag ni Pablo tungkol sa pagtanggap ng salapi mula sa ibang mga iglesya
  choice: Panatilihin ang mapanulsol na metaporang “Ninakawan ko ang ibang mga iglesya” bilang ironiko o eksaheradong pananalita.
  alternative: Palambutin bilang “Kumuha ako ng tulong mula sa ibang mga iglesya” o “Pinagkaitan ko ang ibang mga iglesya.”
  rationale: Sadyang matindi ang salitang Griyego. Ang konteksto ay tungkol sa suportang pinansiyal, hindi literal na pagnanakaw; gayunman, kailangang mapanatili ang matalim na pagtatanggol ni Pablo sa kaniyang asal bilang apostol.
translation_notes:
  register: Modernong Filipino na natural, tuwiran, at marangal. Pinanatili ang matapang na retorika ng orihinal, habang ginawang malinaw ang layunin ng suportang tinanggap.
