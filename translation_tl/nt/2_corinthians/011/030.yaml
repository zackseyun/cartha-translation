translation:
  language: tl
  text: Kung kailangan kong magmalaki, ipagmamalaki ko ang mga bagay na may kinalaman sa aking kahinaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ipagmamalaki ko ang mga bagay ng aking kahinaan.” Maaari ring idiomatikong isalin: “ipagmamalaki ko ang aking mga kahinaan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: Kung
  rationale: Pinananatili ang anyong kondisyonal ng Griyego nang hindi ito ginagawang tahasang sanhi gaya ng “yamang.”
- source_word: καυχᾶσθαι / καυχήσομαι
  choice: magmalaki / ipagmamalaki ko
  rationale: Natural at malinaw na katumbas sa modernong Tagalog, at napapanatili ang pag-uulit at retorikal na ugnayan ng dalawang anyo ng iisang pandiwa.
- source_word: δεῖ
  choice: kailangan kong
  rationale: Ipinahahayag ang puwersa ng pangangailangan sa idiomatikong Tagalog.
- source_word: τὰ τῆς ἀσθενείας μου
  choice: ang mga bagay na nagpapakita ng aking kahinaan
  rationale: Ipinananatili ang maramihang “mga bagay” at nililinaw ang ugnayan ng mga ito sa kahinaan ni Pablo nang hindi ito pinapantay lamang sa “mga kahinaan ko.”
- source_word: ἀσθενείας
  choice: kahinaan
  rationale: Malinaw at karaniwang salitang sumasaklaw sa pagkukulang ng lakas at sa mga nakahihiyang kalagayang tinutukoy sa konteksto, nang hindi ito nililimitahan sa karamdamang pisikal.
theological_decisions:
- issue: Ang katangian ng pagmamalaki ni Pablo
  choice: Tuwirang ilahad ang paradoksal na pagmamalaki sa mga bagay na nagpapakita ng kanyang kahinaan.
  alternative: “Ipagmamalaki ko ang aking mga kahinaan.”
  rationale: Pinananatili nito ang tensiyon at ironya ng pahayag ni Pablo at ang kakaibang saklaw ng τὰ τῆς ἀσθενείας μου, nang hindi nagdaragdag ng paliwanag na doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “magmalaki” dahil mas karaniwan ito kaysa “magmapuri” sa pang-araw-araw na wika, habang nananatili ang retorikal na talas ng talata.
