  yaml_path: translation/nt/2_corinthians/011/028.yaml
  text: 'Apart from such external things[c][b][a], there is the daily pressure on me: concern for all the churches.'
translation:
  language: tl
  text: 'Bukod pa sa iba pang mga bagay[a], ang araw-araw na pasaning dumidiin sa akin[b]: ang pag-aalala ko[c] para sa lahat ng iglesya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bukod sa mga bagay na hindi ko na nabanggit,” o “Bukod sa mga panlabas na bagay.”
    reason: lexical_alternative
  - marker: b
    text: O “ang araw-araw na pagdiin sa akin,” o “ang araw-araw kong pasanin.”
    reason: lexical_alternative
  - marker: c
    text: O “malasakit” o “pagkabalisa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς τῶν παρεκτὸς
  choice: Bukod sa iba pang mga bagay na iyon
  rationale: Ipinahihiwatig ng parirala ang mga bagay na bukod sa naunang talaan, o ang mga hindi na nabanggit. Ang “mga bagay na iyon” ay natural na nag-uugnay sa mga paghihirap na katatapos ilista nang hindi nililimitahan ang kahulugan sa panlabas na mga pangyayari lamang.
- source_word: ἐπίστασίς μοι
  choice: dinidiinan ako
  rationale: Pinananatili nito ang larawan ng isang bagay na pumipisil o bumibigat kay Pablo. Ang μοι ay ipinahayag bilang “ako,” kaya nananatili ang diwang nararanasan niya mismo ang presyur.
- source_word: ἡ καθ’ ἡμέραν
  choice: araw-araw
  rationale: Likas at malinaw itong Filipino para sa paulit-ulit na pagdating ng pasanin sa bawat araw.
- source_word: ἡ μέριμνα
  choice: pag-aalala
  rationale: Saklaw ng salita ang mabigat na malasakit o pagkabalisa. Ang “pag-aalala” ay nagpapanatili sa emosyonal na bigat nito; nililinaw ng talababa na maaari rin itong unawain bilang “malasakit.”
- source_word: πασῶν τῶν ἐκκλησιῶν
  choice: para sa lahat ng mga iglesya
  rationale: Ang “mga iglesya” ang malinaw at nakasanayang tawag sa mga lokal na kongregasyong Kristiyano sa sulat ni Pablo; natural na ipinapahayag ng “para sa” ang ugnayan sa μέριμνα.
theological_decisions:
- issue: Diwa ng pastoral na pasanin ni Pablo sa μέριμνα
  choice: pag-aalala
  alternative: malasakit; pagkabalisa
  rationale: Hindi tahasang hinahatulan o pinupuri ng talata ang damdamin ni Pablo. Pinananatili ng “pag-aalala” ang tunay na bigat ng kanyang pananagutan, habang ipinakikita ng alternatibong “malasakit” na hindi kailangang unawain ito bilang makasalanang pag-aalala.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “dinidiinan ako” upang mapanatili ang kongkretong larawan ng ἐπίστασις, at “mga iglesya” para sa nakasanayang gamit ng ἐκκλησίαι.
