  naturalness: 'Natural at marangal sa modernong Filipino ang "ang araw-araw na pasaning dumidiin sa akin: ang pag-aalala ko para sa lahat ng iglesya." Iniiwasan nito ang medyo di-likas na "dinidiinan ako ng pag-aalala" at malinaw nitong inilalahad ang appositional na daloy ng pangungusap.'
  terminology: Ang "mga iglesya" ay katanggap-tanggap at nakasanayang salin ng ἐκκλησίαι. Ang "pag-aalala" ay mapapanatili para sa μέριμνα, sapagkat taglay nito ang bigat ng pagkabahala at pag-aaruga; ang "malasakit" at "pagkabalisa" ay dapat manatiling mga alternatibo, hindi mga interpretasyong ipinapataw.
