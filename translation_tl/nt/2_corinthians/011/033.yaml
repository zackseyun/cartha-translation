  text: and through a window in a basket I was lowered through the wall and escaped his hands[a].
translation:
  language: tl
  text: At sa pamamagitan ng isang bintana sa pader, ibinaba ako habang nasa isang basket, at nakatakas ako sa kanyang mga kamay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ibinaba ako habang nasa isang basket na yari sa hinabing lubid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θυρίδος
  choice: bintana
  rationale: Tumutukoy ang θυρίς sa isang bintana o maliit na bukasan; natural at tiyak sa kontekstong ito ang “bintana.”
- source_word: σαργάνῃ
  choice: basket
  rationale: Ang σαργάνη ay isang sisidlang hinabi o tinirintas, marahil mula sa lubid o yantok. Malinaw sa karaniwang mambabasa ang “basket,” habang inilalahad sa talababa ang mas tiyak na posibilidad.
- source_word: ἐχαλάσθην
  choice: ibinaba ako
  rationale: Ang pasibong anyo ng χαλάω ay nagsasaad na ibinaba si Pablo, malamang sa pamamagitan ng lubid; tuwiran at natural ang “ibinaba ako.”
- source_word: διὰ τοῦ τείχους
  choice: sa pader
  rationale: Kasama ng “sa isang bintana,” ipinahihiwatig ng parirala ang pagdaan sa bukasan ng pader. Ang ayos na “bintana sa pader” ay natural sa Tagalog at hindi nagdaragdag ng salitang “lungsod,” na hindi tahasang nasa Griyego.
- source_word: ἐξέφυγον τὰς χεῖρας αὐτοῦ
  choice: nakatakas ako sa kanyang mga kamay
  rationale: Pinananatili nito ang matingkad na idyomang Griyego tungkol sa pagtakas mula sa pagkakahawak o kapangyarihan ng isang tao, at nauunawaan din sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Inayos ang mga parirala upang maging natural sa Tagalog habang pinananatili ang pasibong “ibinaba,” ang larawan ng bintana sa pader, at ang idyomang “sa kanyang mga kamay.”
