source:
  edition: SBLGNT
  text: ὃ λαλῶ οὐ ⸂κατὰ κύριον λαλῶ⸃, ἀλλ’ ὡς ἐν ἀφροσύνῃ, ἐν ταύτῃ τῇ ὑποστάσει τῆς καυχήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/017.yaml
  text: What I am saying[a], I am not saying according to the Lord, but as in foolishness[c][b], in this confidence of boasting.
translation:
  language: tl
  text: Ang sinasabi ko ay hindi ko sinasabi ayon sa Panginoon[a], kundi na para bang nagsasalita ako bilang hangal[b], sa ganitong pagtitiwala sa pagmamapuri.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “hindi ko ito sinasabi na mula sa Panginoon,” o “ayon sa pamantayan ng Panginoon.”'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring: “kundi na para bang sa kahangalan,” o sa mas idyomatikong paraan, “kundi parang isang hangal.”'
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Griyego na isinaling “pagtitiwala” ay maaari ring mangahulugang “bagay,” “batayan,” o “gawain” sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ λαλῶ
  choice: Ang sinasabi ko
  rationale: Natural sa makabagong Tagalog at pinananatili ang kasalukuyang kilos ng pagsasalita.
- source_word: οὐ κατὰ κύριον λαλῶ
  choice: hindi ko sinasabi ayon sa Panginoon
  rationale: Pinananatili ang posibleng diwa ng κατά bilang pamantayan, paraan, o awtoridad nang hindi nilulutas ang likas na kalabuan.
- source_word: κύριον
  choice: Panginoon
  rationale: Karaniwang salin ng κύριος at likas na tumutukoy rito sa Panginoong Jesus nang hindi na kailangang palawakin sa pangunahing teksto.
- source_word: ἀλλ’ ὡς ἐν ἀφροσύνῃ
  choice: kundi parang nasa kahangalan
  rationale: Malapit sa anyo ng Griyego at hindi tahasang ginagawang pagkakakilanlan ni Pablo ang pagiging hangal.
- source_word: ἐν ταύτῃ τῇ ὑποστάσει
  choice: taglay ang ganitong pagtitiwala
  rationale: Ipinapahayag ang isang matatag o may-tiwalang tindig; ang pandiwang 'taglay' ay mas natural sa Tagalog kaysa sa literal na 'sa ganitong pagtitiwala.'
- source_word: τῆς καυχήσεως
  choice: sa pagmamapuri
  rationale: Pinananatili ang kilos na ipinahihiwatig ng καύχησις at natural na iniuugnay ito sa 'pagtitiwala' sa Tagalog.
theological_decisions:
- issue: Referent at puwersa ng κατὰ κύριον
  choice: Pinananatili ang 'ayon sa Panginoon,' na maaaring tumukoy sa pamantayan, paraan, o awtoridad ng Panginoon.
  alternative: Maaaring unawain bilang 'mula sa Panginoon' o 'ayon sa pamantayan ng Panginoon.'
  rationale: Hindi dapat ipasiya ng salin kung itinatanggi ni Pablo ang isang tuwirang utos mula sa Panginoon o inilalayo lamang niya ang paraan ng pagmamapuri sa halimbawa ng Panginoon.
- issue: Retorikal na pagkakaugnay ng kahangalan at pagmamapuri
  choice: Inilalarawan ni Pablo ang paraan ng kaniyang pagsasalita na parang nasa kahangalan, hindi niya tahasang tinatawag ang sarili na hangal.
  alternative: kundi parang isang hangal
  rationale: Pinananatili nito ang pag-iingat ng ὡς ἐν ἀφροσύνῃ at ang tensiyon sa retorika.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paulit-ulit na 'sinasabi' upang masalamin ang λαλῶ at ang retorikal na diin. Ang mga panandang talababa [a], [b], at [c] ay nasa pangunahing teksto.
