    rationale: Bagaman malapit sa anyo ng Griyego, hindi ito ang karaniwang paraan upang ilarawan ang paraan ng pagsasalita sa Filipino. Maaaring gawing mas natural nang hindi inaalis ang paghahambing ng ὡς.
