source:
  edition: SBLGNT
  text: ⸀κόπῳ καὶ μόχθῳ, ἐν ἀγρυπνίαις πολλάκις, ἐν λιμῷ καὶ δίψει, ἐν νηστείαις πολλάκις, ἐν ψύχει καὶ γυμνότητι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/027.yaml
  text: in labor and hardship[a], in many sleepless nights, in hunger and thirst, in frequent fastings[b], in cold and exposure.
translation:
  language: tl
  text: sa pagpapagal at paghihirap, sa madalas na pagpupuyat, sa gutom at uhaw, sa madalas na pag-aayuno[a], sa lamig at kakulangan sa damit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa madalas na mga pag-aayuno.” Hindi tinutukoy ng Griyego kung ang mga ito ay kusang-loob o dulot ng kalagayan.
    reason: lexical_alternative
  - marker: b
    text: O “kahubaran.” Maaaring tumukoy ito sa hindi sapat na damit at pagkakalantad sa lamig.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόπῳ
  choice: pagpapagal
  rationale: Tumutukoy ito sa mabigat at nakapapagod na paggawa; likas at marangal sa Filipino ang “pagpapagal” at napapanatili nito ang diin sa puspusang pagsisikap.
- source_word: μόχθῳ
  choice: paghihirap
  rationale: May pagkakatulad ito sa κόπος ngunit binibigyang-diin ang hirap o dalamhating kaakibat ng paggawa. Pinananatili ng “paghihirap” ang pinagsama-samang diin ng dalawang salita nang hindi inuulit ang iisang kahulugan.
- source_word: ἐν ἀγρυπνίαις πολλάκις
  choice: sa madalas na pagpupuyat
  rationale: Ang ἀγρυπνία ay kalagayan ng pananatiling gising o kawalan ng tulog. Ang “madalas na pagpupuyat” ay natural na Filipino at malinaw na nagpapahayag ng paulit-ulit na mga panahong hindi makatulog.
- source_word: ἐν λιμῷ καὶ δίψει
  choice: sa gutom at uhaw
  rationale: Tuwirang ipinapahayag ng pares ang mga kalagayan ng pagkakait na tiniis ni Pablo at napapanatili ang paulit-ulit na hulma ng ἐν.
- source_word: ἐν νηστείαις πολλάκις
  choice: sa madalas na pag-aayuno
  rationale: Ang νηστεία ay tumutukoy sa pag-aayuno. Pinananatili ng salin ang pagkakaiba nito sa naunang “gutom” at hindi tinutukoy kung kusang-loob o dulot ng kalagayan ang hindi pagkain.
- source_word: ἐν ψύχει
  choice: sa lamig
  rationale: Ang ψῦχος ay lamig bilang isang kalagayang tiniis; maikli at likas ang “sa lamig” sa talaan.
- source_word: γυμνότητι
  choice: kakulangan sa damit
  rationale: Bagaman maaari itong mangahulugang kahubaran, sa talaang ito ng mga paghihirap maaari itong tumukoy sa hindi sapat na kasuotan at pagkakalantad sa panahon. Malinaw ang “kakulangan sa damit” nang hindi ipinapalagay na ganap na hubad si Pablo.
theological_decisions:
- issue: Kahulugan ng νηστείαις sa talaan ng mga paghihirap ni Pablo
  choice: pag-aayuno
  alternative: kawalan ng pagkain o sapilitang pagkagutom
  rationale: Naiiba ang salitang Griyego sa λιμός (“gutom”), kaya pinanatili ang leksikal na pagkakaiba. Hindi nililinaw ng teksto kung ang mga pag-aayuno ay kusang-loob o ipinataw ng kalagayan; iniwang bukas ng salin at talababa ang usaping iyon.
- issue: Kahulugan ng γυμνότητι
  choice: kakulangan sa damit
  alternative: kahubaran
  rationale: Sa konteksto ng lamig at paghihirap, malamang na tumutukoy ito sa hindi sapat na kasuotan, ngunit tunay na posibilidad pa rin ang mas literal na “kahubaran,” kaya inilagay iyon sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod na pariralang may “sa” upang maipakita ang maindayog at pinagsama-samang talaan ng mga paghihirap sa Griyego. Ang “pagpapagal at paghihirap” ay nagpapanatili sa magkalapit ngunit hindi lubos na magkaparehong κόπος at μόχθος.
