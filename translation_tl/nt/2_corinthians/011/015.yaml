source:
  edition: SBLGNT
  text: οὐ μέγα οὖν εἰ καὶ οἱ διάκονοι αὐτοῦ μετασχηματίζονται ὡς διάκονοι δικαιοσύνης, ὧν τὸ τέλος ἔσται κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/015.yaml
  text: So it is no great thing if his servants also disguise themselves as servants of righteousness[a], whose end will be according to their works.
translation:
  language: tl
  text: Kaya hindi kataka-taka kung ang mga lingkod niya ay nagkukunwari ring mga lingkod ng katuwiran[a]. Ang magiging wakas nila ay naaayon sa kanilang mga gawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.” Maaaring tumukoy ang salitang Griyego sa katuwiran o sa katarungan; dito, tumutukoy ito sa pagpapakitang sila ay panig sa tama.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέγα
  choice: hindi kataka-taka
  rationale: Likas na idyomang Filipino para sa pahayag na ang isang bagay ay hindi kahanga-hanga o nakakagulat; malinaw ito sa ugnayan sa naunang talata.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang paghinuha mula sa naunang pahayag tungkol kay Satanas.
- source_word: διάκονοι
  choice: mga lingkod
  rationale: Tumutukoy sa mga taong naglilingkod bilang mga tauhan ni Satanas; mas malinaw at hindi kasing-eklesyastiko ng “mga ministro.”
- source_word: μετασχηματίζονται
  choice: nagkukunwari
  rationale: Ipinahihiwatig ang mapanlinlang na pagpapakita sa panlabas, hindi ang tunay na pagbabago ng pagkatao.
- source_word: ὡς
  choice: ring mga
  rationale: Sa pariralang “nagkukunwari ring mga lingkod,” natural na ipinahahayag sa Filipino ang papel o anyong kanilang inaangkin; ang “rin” ay kumakatawan din sa καί.
- source_word: δικαιοσύνης
  choice: katuwiran
  rationale: Karaniwang salin sa Filipino para sa moral na pagiging matuwid o pag-ayon sa tama; pinananatili sa talababa ang posibleng diwang “katarungan.”
- source_word: τὸ τέλος
  choice: ang magiging wakas nila
  rationale: Tumutukoy sa kahihinatnan o huling hantungan nila sa konteksto ng paghatol.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: naaayon sa kanilang mga gawa
  rationale: Pinananatili ang pormulang nagsasaad na ang kahihinatnan ay tutugma sa kanilang ginawa.
theological_decisions:
- issue: Kahulugan ng δικαιοσύνη sa pariralang Paulino
  choice: katuwiran
  alternative: katarungan
  rationale: Sa konteksto, nagpapanggap silang nakahanay sa moral na tama. Ang “katuwiran” ang mas angkop sa pangunahing teksto, habang kinikilala ng talababa ang lehitimong alternatibong “katarungan.”
- issue: Ugnayan ng wakas at mga gawa
  choice: Ang magiging wakas nila ay naaayon sa kanilang mga gawa
  alternative: Ang kahihinatnan nila ay magiging ayon sa kanilang mga ginawa
  rationale: Hindi nilulutas nang lampas sa teksto ang teolohikal na ugnayan; pinananatili lamang ang pahayag ng pagtutugma ng wakas at mga gawa.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “hindi kataka-taka” bilang malinaw na idyoma at ang “nagkukunwari” upang idiin ang panlabas at mapanlinlang na pagpapakita. Iniwasan ang “ministro” dahil maaari itong magpahiwatig ng opisyal na tungkuling pansimbahan.
