id: 2CO.11.13
reference: 2 Corinthians 11:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι ψευδαπόστολοι, ἐργάται δόλιοι, μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/013.yaml
  text: For such men are false apostles[a], deceitful workers, disguising themselves as apostles of Messiah.
translation:
  language: tl
  text: Sapagkat ang gayong mga tao ay mga huwad na apostol, mga mandarayang manggagawa na nag-aanyong mga apostol ng Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ni Cristo.” Ang salitang Griego na Χριστός ay maaaring isaling “Mesiyas” bilang titulo o “Cristo” kapag ginagamit na higit na tulad ng pangalan.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nag-uugnay ito sa naunang paliwanag o pangangatwiran at natural na naghahayag ng dahilan sa Filipino.
- source_word: οἱ τοιοῦτοι
  choice: ang gayong mga tao
  rationale: Tumutukoy sa uri ng mga taong inilalarawan sa konteksto; malinaw at likas ito sa modernong Filipino.
- source_word: ψευδαπόστολοι
  choice: mga huwad na apostol
  rationale: Tuwirang ipinapahayag na hindi tunay ang kanilang pag-aangking apostol sila.
- source_word: ἐργάται δόλιοι
  choice: mga mandarayang manggagawa
  rationale: Pinananatili ang diwa ng mga manggagawang gumagamit at kinikilala sa pandaraya.
- source_word: μετασχηματιζόμενοι
  choice: nag-aanyong
  rationale: Ipinahihiwatig ang mapanlinlang na pagbabago o pagpapakita ng panlabas na anyo, hindi ang panloob na pagbabago ng pagkatao.
- source_word: εἰς ἀποστόλους Χριστοῦ
  choice: mga apostol ng Mesiyas
  rationale: Sa kaugnayan ng pandiwari, ang εἰς ay nagpapahayag ng anyo o papel na kanilang inaangkin; pinananatili ng “Mesiyas” ang kahulugan ng titulong Χριστός.
theological_decisions:
- issue: Paglilipat ng Χριστοῦ
  choice: ng Mesiyas
  alternative: ni Cristo
  rationale: Maaaring gumana ang Χριστός bilang titulo o bilang katawagang halos naging pantanging pangalan. Dito, pinananatili ng “Mesiyas” ang titulong kahulugan, habang inilalahad sa talababa ang natural at tradisyonal na alternatibo nang hindi nilulutas nang palihim ang posibilidad ng dalawang pagbasa.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “nag-aanyong” upang idiin ang mapanlinlang na panlabas na pagpapanggap nang hindi magpahiwatig ng tunay na panloob na pagbabago.
source_grounding:
  english_pob_role: consult_only
