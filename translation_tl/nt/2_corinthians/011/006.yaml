- from: Kahit hindi ako bihasa sa pagsasalita[a], hindi naman ako kulang sa kaalaman. Sa halip, nilinaw namin ito sa inyo sa lahat ng paraan at sa lahat ng bagay.[b]
  to: Kahit hindi ako bihasa sa pagsasalita[a], hindi naman ako kulang sa kaalaman. Ngunit nilinaw namin ito sa inyo sa lahat ng paraan at sa lahat ng bagay.[b]
  rationale: Kailangan ang isang ligtas ngunit mahalagang pagbabago sa pang-ugnay na “Sa halip,” na nagpapahiwatig ng pagpapalit na wala sa Griyego. Pinalitan ito ng “Ngunit,” habang pinanatili ang bilang na “namin,” ang retorikal na diwa ng ἰδιώτης τῷ λόγῳ, at ang sinadyang malawak na salin ng dalawang pariralang ἐν παντί at ἐν πᾶσιν. Inayos din ang talababa upang mapanatili ang kalabuan ng konstruksiyon nang walang labis na pagpapakahulugan.
