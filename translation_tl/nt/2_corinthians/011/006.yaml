    issue: “Sa halip” ang salin ng ἀλλ’ sa huling sugnay.
    rationale: 'Ang “Sa halip” ay karaniwang nagpapahiwatig na pinapalitan o itinatakwil ang naunang pahayag. Dito, ang ἀλλ’ ay mas natural na nagbibigay ng mariing kontrast/pagpapatibay: bagaman hindi siya bihasa sa pagsasalita, ang kanilang kaalaman ay hayag na naipakita sa mga taga-Corinto. Ang “Ngunit” ang mas tapat at natural.'
