base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/006.yaml
  text: But even if I am unskilled in speech[a], I am not in knowledge; indeed[c][b], in every way we have made this plain among all to you.
translation:
  language: tl
  text: Kahit hindi ako bihasa sa pagsasalita[a], hindi naman ako kulang sa kaalaman. Ngunit nilinaw namin ito sa inyo sa lahat ng paraan at sa lahat ng bagay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “walang pagsasanay sa pinong pagtatalumpati”; ang tinutukoy ay kakulangan sa pormal o makinis na kasanayan sa retorika.
    reason: lexical_alternative
  - marker: b
    text: 'Siksik at maaaring unawain sa iba’t ibang magkalapit na paraan ang pariralang Griyego. Maaari rin itong ayusin bilang: “Sa lahat ng paraan at sa lahat ng bagay ay nilinaw namin ito sa inyo.” Maaaring tumukoy ang “sa lahat” sa lahat ng bagay o, ayon sa ibang pag-unawa, sa lahat ng tao.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδιώτης τῷ λόγῳ
  choice: hindi bihasa sa pagsasalita
  rationale: Tumutukoy ito sa kakulangan sa pormal o mahusay na retorikang pagsasalita, hindi sa pagiging mangmang sa pangkalahatan. Natural sa makabagong Tagalog ang “hindi bihasa sa pagsasalita” at malinaw ang kaibahan nito sa kaalaman.
- source_word: γνώσει
  choice: kaalaman
  rationale: Tuwirang pinananatili ang paghahambing ng kakayahang magsalita at ng taglay na kaalaman.
- source_word: φανερώσαντες
  choice: nilinaw namin ito
  rationale: Bagaman participle ang anyong Griyego, ang diwa rito ay hayagang naipakita o napalinaw na ng mga nagsasalita ang kanilang kaalaman sa mga taga-Corinto.
- source_word: ἐν παντί
  choice: sa lahat ng paraan
  rationale: Ipinahihiwatig ng parirala ang lawak o pagiging ganap ng pagpapalinaw.
- source_word: ἐν πᾶσιν
  choice: sa lahat ng bagay
  rationale: Pinananatili ang malawak at siksik na pananalita ng Griyego nang hindi tiyakang ipinapakahulugan kung mga tao, pangyayari, o usapin ang tinutukoy.
- source_word: εἰς ὑμᾶς
  choice: sa inyo
  rationale: Ang mga taga-Corinto ang pinatutungkulan at pinagpakitaan ng malinaw na patunay.
theological_decisions:
- issue: Ang saklaw ng pag-amin ni Pablo tungkol sa kanyang pagsasalita
  choice: Inaamin niyang maaaring hindi siya bihasa sa retorikang pagsasalita, ngunit hindi siya kulang sa kaalaman.
  alternative: Maaaring unawain na sinasabi niyang wala siyang pinag-aralan sa pangkalahatan, o na lubos na mapanuya lamang ang kanyang pahayag at wala siyang inaaming anumang kakulangan.
  rationale: Ang tahasang paghahambing sa γνώσει (“kaalaman”) at ang konteksto hinggil sa istilo ng mga karibal na guro ay tumutukoy sa husay o kinis ng pagsasalita, hindi sa kakulangan ng katotohanan, kaalaman, o awtoridad.
- issue: Ang kahulugan ng siksik na hulihang parirala ἐν παντὶ ... ἐν πᾶσιν εἰς ὑμᾶς
  choice: Isinalin bilang “sa lahat ng paraan at sa lahat ng bagay ... sa inyo,” na pinananatili ang dalawang panlahatang parirala.
  alternative: Maaaring unawain ang ἐν πᾶσιν bilang “sa harap ng lahat” o “sa gitna ng lahat ng tao,” at ang buong parirala bilang pagpapahayag na nahayag ito sa kanila sa bawat pagkakataon.
  rationale: Malabo at siksik ang konstruksiyon sa Griyego. Ang pangunahing salin ay hindi nagpapasya nang labis, habang inilalahad sa talababa ang mahalagang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “bihasa sa pagsasalita” upang maipahayag ang retorikal na diwa nang hindi nagmumukhang itinatanggi ni Pablo ang pangkalahatang edukasyon niya. Pinanatili sa pangunahing teksto ang pag-uulit ng dalawang panlahatang parirala at inilagay sa talababa ang tunay na kalabuan ng hulihang konstruksiyon.
