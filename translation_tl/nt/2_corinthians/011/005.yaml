  text: For I consider that I am not in the least inferior to those super-apostles[a].
translation:
  language: tl
  text: Sapagkat sa palagay ko, hindi ako nahuhuli kahit kaunti sa mga “napakadakilang apostol.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinakadakilang mga apostol.” Maaaring unawain ang ekspresyong Griyego bilang mapanuyang tawag (“napakadakilang mga apostol”) o bilang tuwirang pagtukoy sa lubhang iginagalang na mga apostol.
    reason: alternative_reading
lexical_decisions:
- source_word: λογίζομαι
  choice: itinuturing kong
  rationale: Ipinapahayag nito ang mapanuri at may-pagtatantiyang diwa ng pandiwa, at natural sa makabagong Tagalog.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita nito na ang pangungusap ay nagbibigay ng paliwanag o suporta sa naunang sinabi ni Pablo.
- source_word: μηδὲν
  choice: sa anumang paraan
  rationale: 'Ginagamit dito ang μηδέν bilang idiomatikong panindi: hindi siya nahuhuli o mababa sa anumang bagay o paraan.'
- source_word: ὑστερηκέναι
  choice: hindi ako mababa
  rationale: Sa paghahambing na ito, malinaw at likas na ipinapahayag ng 'mababa' ang pagiging kulang o nakahihigitan; hindi kinakailangang kopyahin sa Tagalog ang aspektong perpekto ng infinitive bilang hiwalay na panahunan.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: kaysa sa mga “ubod-galing na apostol”
  rationale: Pinananatili ng panipi at ng ekspresyong 'ubod-galing' ang malamang na mapanuya at pasobra na himig ng ὑπερλίαν, habang nananatiling mauunawaan ng karaniwang mambabasa.
theological_decisions:
- issue: Kung ang τῶν ὑπερλίαν ἀποστόλων ay mapanuyang tawag sa mga karibal ni Pablo o tuwirang pagtukoy sa mga lubhang iginagalang na apostol
  choice: “ubod-galing na apostol” bilang malamang na mapanuyang pahayag
  alternative: “pinakadakilang mga apostol” bilang tuwirang pagtukoy sa mga bantog na apostol
  rationale: Mas umaayon sa polemikong konteksto ng 2 Corinto 11 ang ironikong pagbasa, ngunit hindi ganap na inaalis ng Griyego ang tuwirang pagbasa; kaya inilalagay ang alternatibo sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang panipi upang ipahiwatig, ngunit hindi labis na ipaliwanag, ang malamang na ironikong himig.
