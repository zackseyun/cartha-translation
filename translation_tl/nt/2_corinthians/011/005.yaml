revisions:
- from: Sapagkat itinuturing kong hindi ako mababa sa anumang paraan kaysa sa mga “ubod-galing na apostol.”[a]
  to: Sapagkat sa palagay ko, hindi ako nahuhuli kahit kaunti sa mga “napakadakilang apostol.”[a]
  rationale: Pinalitan ang hindi idiomatikong paghahambing ng “hindi ako nahuhuli kahit kaunti sa,” na malinaw na ipinapahayag na hindi si Pablo nakabababa o nagkukulang kung ihahambing sa tinutukoy na mga apostol. Ang “napakadakilang” ay mas angkop sa marangal na rehistro kaysa “ubod-galing,” samantalang ang panipi at talababa ay nagpapahintulot sa ironiko at tuwirang pagbasa nang hindi pinipilit ang alinman.
