  naturalness: Kailangan ng rebisyon para sa mas natural at malinaw na modernong Tagalog. Ang “Sa palagay ko” at “hindi ako nahuhuli kahit kaunti sa” ay marangal, idiomatiko, at angkop sa retorikong daloy ni Pablo.
  terminology: Ang “napakadakilang mga apostol,” na nasa panipi, ay naghahatid ng labis na pagpapataas at maaaring basahin nang may ironya, ngunit hindi tahasang ipinagpapalagay na tiyak ang ironya. Pinananatili ng talababa ang posibleng tuwirang pagbasa.
