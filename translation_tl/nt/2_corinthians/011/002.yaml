revisions:
- from: Sapagkat naninibugho ako para sa inyo ng paninibugho ng Diyos[a], dahil ipinangako ko kayong pakakasal sa iisang lalaki, upang maiharap ko kayo sa Mesiyas[b] bilang isang dalisay na birhen.
  to: Sapagkat naninibugho ako para sa inyo, taglay ang paninibugho ng Diyos, dahil ipinagkasundo ko kayo sa isang lalaki, upang iharap ko kayo sa Mesiyas bilang isang dalisay na birhen.
  rationale: Inayos ang dalawang pariralang hindi likas sa Filipino at nilinaw ang pandiwang pangpagtitipan. Pinanatili ang saklaw ng kahulugan ng “paninibugho ng Diyos,” ang metaporang pangkasal, ang isahang “birhen” para sa kolektibong iglesia, at ang “Mesiyas” bilang salin ng Χριστός.
