  text: ζηλῶ γὰρ ὑμᾶς θεοῦ ζήλῳ, ἡρμοσάμην γὰρ ὑμᾶς ἑνὶ ἀνδρὶ παρθένον ἁγνὴν παραστῆσαι τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/002.yaml
  text: For I am jealous for you with God's jealousy[a], because I betrothed you to one husband[b], to present you as a pure virgin to Messiah.
translation:
  language: tl
  text: Sapagkat naninibugho ako para sa inyo, taglay ang paninibugho ng Diyos, dahil ipinagkasundo ko kayo sa isang lalaki, upang iharap ko kayo sa Mesiyas bilang isang dalisay na birhen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζηλῶ
  choice: naninibugho ako para sa inyo
  rationale: Pinananatili nito ang positibo at mapag-ingat na paninibugho sa konteksto ng tipan at pag-aasawa, sa halip na ipakahulugang inggit.
- source_word: θεοῦ ζήλῳ
  choice: ng paninibugho ng Diyos
  rationale: Tuwirang pinananatili ang genitibong Griyego at ang posibilidad na ito ay paninibughong pag-aari ng Diyos o paninibughong may katangiang maka-Diyos.
- source_word: ἡρμοσάμην
  choice: ipinangako ko kayong pakakasal
  rationale: Natural na Filipino ito para sa pormal na paglalaan o pangakong ipakasal, at pinananatili ang talinghaga ng pakikipagtipan.
- source_word: ἑνὶ ἀνδρὶ
  choice: sa iisang lalaki
  rationale: Ang ἀνήρ ay maaaring 'lalaki' o 'asawang lalaki'; ang 'iisang lalaki' ay malapit sa anyo ng Griyego habang malinaw sa konteksto ng kasal.
- source_word: παρθένον ἁγνήν
  choice: isang dalisay na birhen
  rationale: Pinananatili ang larawang pangkasal at ang diin sa kadalisayan nang malinaw at marangal sa modernong Filipino.
- source_word: παραστῆσαι
  choice: upang maiharap ko kayo
  rationale: Ginagawang malinaw sa natural na Filipino ang ipinahihiwatig na gumagawa ng paghaharap, nang hindi binabago ang layunin ng sugnay.
- source_word: τῷ Χριστῷ
  choice: sa Mesiyas
  rationale: Dito, ang Χριστός ay gumaganap bilang titulo ng itinalagang lalaking mapapangasawa sa talinghaga; kaya 'Mesiyas' ang pangunahing salin.
theological_decisions:
- issue: Uri ng paninibugho ni Pablo
  choice: Paninibughong kaugnay ng sariling paninibugho ng Diyos
  alternative: Maka-Diyos na paninibugho o masidhing malasakit lamang ni Pablo
  rationale: Hinahayaan ng pariralang θεοῦ ζήλῳ ang ugnayang pag-aari o paglalarawan. Pinananatili ng salin ang tensiyong ito at ang pahiwatig ng eksklusibong katapatan sa tipan.
- issue: Pagpapakahulugan sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa talinghagang pangkasal, tumutukoy ito sa tituladong pigura na siyang iisang mapapangasawa; gayunman, kinikilala sa talababa ang nakaugaliang transliterasyong 'Cristo.'
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang paulit-ulit na ugnayang sanhi ng dalawang γάρ sa pamamagitan ng “Sapagkat” at “dahil,” gayundin ang talinghaga ng pakikipagtipan, eksklusibong pag-aasawa, at dalisay na birhen.
