    issue: Hindi likas ang unang parirala tungkol sa paninibugho.
    rationale: Ang pagkakasunod na “naninibugho ako para sa inyo ng paninibugho” ay mabigat at hindi karaniwang Filipino. Ang “taglay ang paninibugho ng Diyos” ay malinaw na naghahatid ng instrumental na ζήλῳ nang hindi nilulutas ang genitibong θεοῦ.
  - severity: medium
    issue: May problemang pangkayarian at kulang sa diin ang “ipinangako ko kayong pakakasal.”
    rationale: Maaari itong basahin bilang pangako lamang na magpapakasal sila, sa halip na ginawa ni Pablo ang pagtatalaga/pagpapakasundo sa kasal. Ang “ipinagkasundo ko kayo” ay mas tumpak na katumbas ng ἡρμοσάμην sa kontekstong pangkasal.
