  text: ἐν Δαμασκῷ ὁ ἐθνάρχης Ἁρέτα τοῦ βασιλέως ἐφρούρει τὴν ⸂πόλιν Δαμασκηνῶν⸃ πιάσαι ⸀με,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/032.yaml
  text: In Damascus[a], the ethnarch of King Aretas was guarding the city of the Damascenes in order to seize me,
translation:
  language: tl
  text: Sa Damasco, binabantayan ng etnarka ni Haring Aretas ang lungsod ng mga taga-Damasco[a] upang hulihin ako,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang lungsod ng Damasco.” Mas literal sa Griyego ang “ang lungsod ng mga taga-Damasco.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Δαμασκῷ
  choice: Sa Damasco
  rationale: Likas na lokatibong salin ito ng ἐν na may datibo at karaniwang paraan sa modernong Tagalog upang tukuyin ang kinaroroonan.
- source_word: ἐθνάρχης
  choice: etnarka
  rationale: Pinananatili nito ang tiyak na makasaysayang titulo para sa pinunong namamahala sa isang pangkat ng mga tao o nasasakupan, sa halip na gawing mas pangkalahatang “gobernador” o “pinuno.”
- source_word: Ἁρέτα τοῦ βασιλέως
  choice: ni Haring Aretas
  rationale: Likas sa Tagalog ang ganitong anyo ng henitibo at pinananatili nitong kaugnay o naglilingkod ang etnarka kay Haring Aretas nang hindi dinaragdagan ang sinasabi ng Griyego.
- source_word: ἐφρούρει
  choice: binabantayan
  rationale: Ipinahihiwatig ng aspektong imperpekto ang nagpapatuloy na pagbabantay noon; malinaw itong naipapahayag ng “binabantayan.”
- source_word: τὴν πόλιν Δαμασκηνῶν
  choice: ang lungsod ng mga taga-Damasco
  rationale: Malapit ito sa literal na henitibong maramihan na “lungsod ng mga taga-Damasco” at pinananatili ang di-pangkaraniwang ayos ng pinagmulan; ibinigay sa talababa ang mas karaniwang alternatibo.
- source_word: πιάσαι με
  choice: upang hulihin ako
  rationale: Ipinapahayag ng “upang” ang layunin ng infinitibo, habang ang “hulihin” ay sapat na malawak para sa sapilitang pagdakip o pagsunggab nang hindi tiyak na ipinapalagay ang isang pormal na pag-aresto.
theological_decisions: []
translation_notes:
  register: Gumamit ng natural ngunit marangal na modernong Tagalog. Pinanatili ang makasaysayang titulong “etnarka” upang hindi mawala ang katiyakan ng katawagan sa Griyego, at pinili ang “hulihin” bilang malinaw ngunit hindi labis na interpretibong paglalarawan ng layunin.
