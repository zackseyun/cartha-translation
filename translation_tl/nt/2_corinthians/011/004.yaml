revisions:
- from: Sapagkat kung may dumating at mangaral ng ibang Jesus kaysa sa ipinangaral namin, o kung tumanggap kayo ng ibang espiritu kaysa sa tinanggap ninyo, o ng ibang magandang balita kaysa sa tinanggap ninyo, maluwag ninyo itong pinagtitiisan.[a]
  to: Sapagkat kung may dumating na nangangaral ng ibang Jesus na hindi namin ipinangaral, o tumatanggap kayo ng ibang espiritu na hindi ninyo tinanggap, o ng ibang magandang balita na hindi ninyo tinanggap, madali ninyo itong pinagtitiisan.[a]
  rationale: Inayos ang aspekto at sintaksis upang masundan ang kasalukuyang λαμβάνετε at ang magkakatulad na relative clause sa Griyego. Pinanatili ang neutral na “itong,” sapagkat walang hayag na layon ang ἀνέχεσθε at maaaring tumukoy sa taong dumarating o sa ipinahahayag nito. Ang talababa ay nagpapanatili sa ironikong tono bilang usaping pangkonteksto, hindi bilang dagdag na kahulugan sa pangunahing teksto.
