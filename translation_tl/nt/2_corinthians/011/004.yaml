id: 2CO.11.4
reference: 2 Corinthians 11:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ μὲν γὰρ ὁ ἐρχόμενος ἄλλον Ἰησοῦν κηρύσσει ὃν οὐκ ἐκηρύξαμεν, ἢ πνεῦμα ἕτερον λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ εὐαγγέλιον ἕτερον ὃ οὐκ ἐδέξασθε, καλῶς ⸀ἀνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/004.yaml
  text: For if someone comes and proclaims another Jesus[a], whom we did not proclaim, or if you receive a different spirit, which you did not receive, or a different gospel, which you did not accept[c][b], you put up with it well enough.
translation:
  language: tl
  text: Sapagkat kung may dumating na nangangaral ng ibang Jesus na hindi namin ipinangaral, o tumatanggap kayo ng ibang espiritu na hindi ninyo tinanggap, o ng ibang magandang balita na hindi ninyo tinanggap, madali ninyo itong pinagtitiisan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Malamang na ironiko ang “madali ninyo itong pinagtitiisan”: sinasaway ni Pablo ang kahandaan nilang magparaya sa gayong tao o sa kaniyang pangangaral. Maaari ring isalin: “mabuti ninyo itong pinagtitiisan.”'
    reason: tone_and_lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν γὰρ
  choice: Sapagkat kung
  rationale: Likas na ipinapakita nito sa Tagalog ang paliwanag at pasubaling daloy ng pangungusap nang hindi pilit na isinasalin ang bawat kataga.
- source_word: ὁ ἐρχόμενος
  choice: may dumating
  rationale: Ang substantival participle ay tumutukoy nang pangkalahatan sa sinumang dumarating sa kanila; natural at di-tiyak ang “may dumating.”
- source_word: ἄλλον Ἰησοῦν
  choice: ibang Jesus
  rationale: Pinananatili nito ang babala tungkol sa isang ipinangangaral na Jesus na naiiba sa ipinangaral ng mga apostol, nang hindi ipinapasok ang paliwanag sa mismong teksto.
- source_word: κηρύσσει / ἐκηρύξαμεν
  choice: mangaral / ipinangaral
  rationale: Ang “mangaral” ay malinaw at karaniwang salin para sa hayagang pagpapahayag ng mensahe sa kontekstong Paulino.
- source_word: πνεῦμα ἕτερον
  choice: ibang espiritu
  rationale: Ipinahihiwatig ng ἕτερος ang pagkakaiba ngunit hindi tinutukoy kung banal, masama, o ibang espirituwal na impluwensiya ang tinutukoy.
- source_word: λαμβάνετε / ἐλάβετε
  choice: tumanggap / tinanggap
  rationale: Direktang inilalarawan ang pagtanggap sa espiritu at pinananatili ang ugnayan ng kasalukuyang pasubali sa naunang karanasan.
- source_word: εὐαγγέλιον ἕτερον
  choice: ibang magandang balita
  rationale: Ang “magandang balita” ay malinaw na katumbas sa modernong Filipino ng εὐαγγέλιον, at ipinakikita ng “ibang” ang salungat na mensahe.
- source_word: ἐδέξασθε
  choice: tinanggap
  rationale: Bagaman maaaring “malugod na tinanggap,” mas natural dito ang “tinanggap”; nauunawaan ang kahulugang pagtanggap o pagsang-ayon mula sa konteksto.
- source_word: καλῶς ἀνέχεσθε
  choice: maluwag ninyo itong pinagtitiisan
  rationale: Ipinahahayag nito ang labis na kahandaang magparaya o magtiis, at maaari itong marinig bilang ironikong pagsaway ayon sa konteksto.
theological_decisions:
- issue: Tinutukoy ng “ibang espiritu”
  choice: Pinanatiling pangkalahatan bilang “ibang espiritu.”
  alternative: Tukuyin bilang maling paglalarawan sa Banal na Espiritu, masamang espiritu, o ibang espirituwal na karanasan.
  rationale: Hindi nililinaw ng Griyego ang eksaktong tinutukoy, kaya hindi ito dapat pasiyahan ng salin.
- issue: Tono ng καλῶς ἀνέχεσθε
  choice: 'Isinalin bilang ironikong pagsaway: “maluwag ninyo itong pinagtitiisan.”'
  alternative: Basahin bilang tuwirang papuri o neutral na obserbasyon.
  rationale: Sa konteksto, sinasaway ni Pablo ang madaling pagpaparaya ng mga taga-Corinto sa karibal na pangangaral, ngunit inilagay sa talababa ang paglilinaw upang mapanatili ang anyo ng pahayag.
- issue: Saklaw ng panghalip sa ἀνέχεσθε
  choice: “itong” tumutukoy sa gayong pangangaral o mensahe sa kabuuan.
  alternative: Gawing tahasang “siya” at ituon sa taong dumarating.
  rationale: Walang tahasang layon sa Griyego; ang neutral na “itong” ay hindi labis na nagpapasya kung ang tao o ang ipinangangaral ang pangunahing pinagtitiisan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “magandang balita” sa halip na hiram na “ebanghelyo,” at pinanatiling maikli ang magkakatulad na sugnay. Ang talababa ay may katugmang marker na [a] sa pangunahing teksto.
