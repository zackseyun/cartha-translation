  source_fidelity: 'Kailangang itama ang aspekto sa ikalawa at ikatlong magkakatulad na sugnay: λαμβάνετε ay kasalukuyang anyong nagpapahayag (“tumatanggap kayo”), hindi pasubaling “tumanggap kayo.” Mas malapit din sa mga relative clause ng Griyego ang “na hindi namin/ninyo ...” kaysa sa paghahambing na “kaysa sa ...”.'
  naturalness: Nauunawaan ang draft, ngunit mas natural at malinaw ang magkakatulad na hulma na “kung may dumating na nangangaral ... o tumatanggap kayo ... o ...”. Ang “madali ninyo itong pinagtitiisan” ay idiomatikong naghuhudyat ng ironikong pagsaway nang hindi tahasang ipinapaliwanag sa teksto.
  terminology: Ang “ibang Jesus,” “ibang espiritu,” at “magandang balita” ay angkop sa modernong Filipino Tagalog. Pinanatili ang malawak na kahulugan ng “ibang espiritu” at hindi ipinapasok ang anumang doktrinal na pagpapasya.
  issues:
