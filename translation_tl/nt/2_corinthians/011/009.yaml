  terminology: Ang “mga kapatid” ay karaniwang Tagalog para sa ἀδελφοί at ang talababa ay maingat na nagpapaliwanag ng masculine plural nang hindi pinipilit ang di-likas na anyo sa pangunahing teksto. Ang “Macedonia” ay pinanatili bilang pangalan ng lugar, alinsunod sa draft at audit trail.
