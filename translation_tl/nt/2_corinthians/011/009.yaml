reference: 2 Corinthians 11:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ παρὼν πρὸς ὑμᾶς καὶ ὑστερηθεὶς οὐ κατενάρκησα οὐθενός· τὸ γὰρ ὑστέρημά μου προσανεπλήρωσαν οἱ ἀδελφοὶ ἐλθόντες ἀπὸ Μακεδονίας· καὶ ἐν παντὶ ἀβαρῆ ⸂ἐμαυτὸν ὑμῖν⸃ ἐτήρησα καὶ τηρήσω.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/009.yaml
  text: And when I was present with you and was in need[a], I was not a burden to anyone; for the brothers who came from Macedonia supplied what I lacked. And in everything I kept myself from being a burden to you[b], and will keep doing so.
translation:
  language: tl
  text: At nang kasama ko kayo at kinapos ako, hindi ako naging pabigat sa kaninuman, sapagkat tinustusan ng mga kapatid[a] na dumating mula sa Macedonia ang aking kakulangan. Sa lahat ng bagay ay iningatan kong huwag akong maging pabigat sa inyo, at patuloy ko itong iingatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Masculine plural ang salitang Griyego para sa “mga kapatid.” Maaari itong gamitin ni Pablo nang mas malawak para sa mga kapwa mananampalataya, ngunit dito ay malamang na tumutukoy ito sa mga tiyak na kamanggagawang dumating mula sa Macedonia.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὼν πρὸς ὑμᾶς
  choice: nang kasama ninyo ako
  rationale: Ginawang temporal na parirala ang participle; natural ito sa modernong Tagalog at pinananatili ang diwa ng personal na presensya ni Pablo.
- source_word: ὑστερηθεὶς
  choice: kinapos
  rationale: Ipinahihiwatig ng pandiwa ang pagdanas ng kakulangan, lalo na ng materyal na pangangailangan sa konteksto. Maikli at likas sa Tagalog ang “kinapos.”
- source_word: οὐ κατενάρκησα οὐθενός
  choice: hindi ako naging pabigat sa kaninuman
  rationale: Ang καταναρκάω ay tumutukoy rito sa pagiging pasaning pinansyal o materyal sa iba; malinaw na naipahahayag iyon ng “naging pabigat.”
- source_word: τὸ ὑστέρημά μου
  choice: ang aking kakulangan
  rationale: Pinananatili ng “kakulangan” ang nominal na anyo at kaugnayan nito sa naunang “kinapos,” nang hindi nililimitahan nang higit sa sinasabi ng teksto ang uri ng pangangailangan.
- source_word: προσανεπλήρωσαν
  choice: pinunan
  rationale: Ipinahahayag ng pandiwa ang pagpuno o pagtustos sa isang kakulangan; tuwiran at natural ang “pinunan” kasama ng layon na “ang aking kakulangan.”
- source_word: οἱ ἀδελφοὶ
  choice: mga kapatid
  rationale: Ang “mga kapatid” ang karaniwang likas na salin sa Tagalog. Hindi nito minamarkahan ang kasarian gaya ng masculine plural sa Griyego, kaya nililinaw iyon sa talababa nang hindi ipinapasok sa pangunahing teksto ang hindi natural na “mga kapatid na lalaki.”
- source_word: ἐλθόντες ἀπὸ Μακεδονίας
  choice: na dumating mula sa Macedonia
  rationale: Ginawang sugnay na panuring ang aorist participle upang maging malinaw at maayos sa Tagalog habang pinananatili ang pinagmulan ng mga tumulong.
- source_word: ἐν παντί
  choice: sa lahat ng bagay
  rationale: Pinananatili nito ang malawak at komprehensibong saklaw ng pariralang Griyego nang hindi ito pinakikitid sa pananalapi lamang.
- source_word: ἀβαρῆ ἐμαυτὸν ὑμῖν
  choice: hindi ako maging pabigat sa inyo
  rationale: Pinalawak nang bahagya ang siksik na pariralang Griyego upang maging idiomatiko sa Tagalog at maipahayag ang kalagayang hindi nagpapasan ng gastos o obligasyon sa mga taga-Corinto.
- source_word: ἐτήρησα καὶ τηρήσω
  choice: tiniyak ko … at patuloy kong titiyakin iyon
  rationale: Dito ang τηρέω ay pagpapanatili ng kalagayang hindi pagiging pabigat. Ipinakikita ng “patuloy kong titiyakin” ang panghinaharap na pagpapatuloy nang natural sa Tagalog.
theological_decisions:
- issue: Saklaw at kasarian ng οἱ ἀδελφοὶ
  choice: mga kapatid, na may talababa tungkol sa masculine plural
  alternative: mga kapatid na lalaki
  rationale: Masculine plural ang anyong Griyego at maaaring tumukoy rito sa mga tiyak na lalaking kamanggagawa, ngunit ang “mga kapatid na lalaki” ay mabigat at maaaring magmukhang labis na pagtiyak sa Tagalog. Pinananatili sa talababa ang datos at ambiguwidad ng pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kinapos” at “pabigat” bilang pangkaraniwan at malinaw na mga salitang angkop sa materyal na konteksto. Iniwasan ang sobrang pormal na “naroon sa piling ninyo” at ang di-likas na “di-mabigat sa inyo.”
