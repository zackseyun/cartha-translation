revisions:
- from: At nang kasama ninyo ako at kinapos, hindi ako naging pabigat sa kaninuman, sapagkat pinunan ng mga kapatid[a] na dumating mula sa Macedonia ang aking kakulangan. Sa lahat ng bagay ay tiniyak kong hindi ako maging pabigat sa inyo, at patuloy kong titiyakin iyon.
  to: At nang kasama ko kayo at kinapos ako, hindi ako naging pabigat sa kaninuman, sapagkat tinustusan ng mga kapatid[a] na dumating mula sa Macedonia ang aking kakulangan. Sa lahat ng bagay ay iningatan kong huwag akong maging pabigat sa inyo, at patuloy ko itong iingatan.
