source:
  edition: SBLGNT
  text: φοβοῦμαι δὲ μή πως, ὡς ὁ ὄφις ⸂ἐξηπάτησεν Εὕαν⸃ ἐν τῇ πανουργίᾳ αὐτοῦ, ⸀φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ τῆς ἁπλότητος ⸂καὶ τῆς ἁγνότητος⸃ τῆς εἰς τὸν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/003.yaml
  text: But I fear that somehow[a], just as the serpent deceived Eve by his cunning[d][c][b], your minds may be corrupted from the sincerity and purity that are toward Messiah.
translation:
  language: tl
  text: Ngunit natatakot ako na baka, kung paanong dinaya ng ahas si Eva sa katusuhan nito, ay masira at mailayo ang inyong pag-iisip mula sa taos-pusong katapatan[a] at kadalisayan sa Mesiyas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “taos-pusong katapatan” ay maaari ring isaling “payak na katapatan” o “buong-pusong katapatan,” na tumutukoy sa hindi nahahating katapatan sa Mesiyas.
    reason: lexical_alternative
  - marker: b
    text: Sa ilang manuskrito, wala ang mga salitang “at kadalisayan.”
    reason: textual_variant
lexical_decisions:
- source_word: φοβοῦμαι δὲ μή πως
  choice: Ngunit natatakot ako na baka
  rationale: Ipinahahayag nito ang patuloy na pangamba ni Pablo at natural na ipinakikilala ng “baka” ang kinatatakutan niyang maaaring mangyari.
- source_word: ὡς ὁ ὄφις ἐξηπάτησεν Εὕαν
  choice: kung paanong dinaya ng ahas si Eva
  rationale: Pinananatili ang tahasang paghahambing at ang pahiwatig sa salaysay ng Genesis.
- source_word: ἐν τῇ πανουργίᾳ αὐτοῦ
  choice: sa katusuhan nito
  rationale: Ang πανουργία ay tusong panlilinlang; ang “sa katusuhan nito” ay likas sa Tagalog at maaaring magpahayag ng paraang ginamit ng ahas.
- source_word: φθαρῇ τὰ νοήματα ὑμῶν
  choice: masira ... ang inyong pag-iisip
  rationale: Pinananatili ng “masira” ang diwa ng mapaminsalang pagbabago o katiwalian, samantalang ang “pag-iisip” ay likas na kolektibong katumbas ng plural na νοήματα.
- source_word: ἀπὸ
  choice: mailayo ... mula sa
  rationale: Nililinaw nito ang paghihiwalay na ipinahahayag ng ἀπό; ipinares sa “masira” upang maging natural ang ugnayan sa Tagalog nang hindi nawawala ang diwa ng φθαρῇ.
- source_word: τῆς ἁπλότητος
  choice: taos-puso ... na debosyon
  rationale: Sa konteksto, ang ἁπλότης ay tumutukoy sa tapat, hindi nahahating pagtatalaga, hindi lamang sa pagiging simple. Inilalahad sa talababa ang makabuluhang alternatibo.
- source_word: καὶ τῆς ἁγνότητος
  choice: at dalisay na debosyon
  rationale: Ang “dalisay” ay nagpapanatili sa malawak na moral at espirituwal na diwa ng ἁγνότης at umaangkop sa larawan ng malinis na katapatan sa naunang talata.
- source_word: τῆς εἰς τὸν Χριστόν
  choice: na debosyon sa Mesiyas
  rationale: Ginagawang malinaw at natural sa Tagalog ang direksiyon ng katapatan kay Χριστός; ang “Mesiyas” ay nagsasalin sa aktibong titulo.
theological_decisions:
- issue: Kahulugan ng ἁπλότης sa kaugnayan sa Mesiyas
  choice: taos-pusong debosyon
  alternative: payak na katapatan; buong-pusong pagtatalaga
  rationale: Ipinakikita ng konteksto ang panganib ng paglayo mula sa hindi nahahating katapatan. Hindi nililimitahan ng salin ang salita sa intelektuwal na pagiging simple, at pinananatili sa talababa ang ibang posibleng himig.
- issue: Pagsasalin ng Χριστόν
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay makabuluhan ang titulong Χριστός bilang pagkakakilanlan ng pinagtutuunan ng debosyon; kaya isinalin ang titulo sa halip na tratuhing pangalan lamang.
- issue: Paglalakip ng καὶ τῆς ἁγνότητος
  choice: isinama ang “at dalisay” sa pangunahing teksto
  alternative: alisin ayon sa ilang manuskrito
  rationale: Kasama ang mga salita sa SBLGNT na ibinigay, ngunit ang pag-alis ng ilang manuskrito ay makabuluhang variant at kaya itinala sa talababa.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “debosyon” upang natural na pagsamahin ang mga katangiang ἁπλότης at ἁγνότης sa kanilang tuon sa Mesiyas, habang pinananatili sa talababa ang tunay na lawak ng ἁπλότης.
