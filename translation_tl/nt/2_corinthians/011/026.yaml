source:
  edition: SBLGNT
  text: ὁδοιπορίαις πολλάκις, κινδύνοις ποταμῶν, κινδύνοις λῃστῶν, κινδύνοις ἐκ γένους, κινδύνοις ἐξ ἐθνῶν, κινδύνοις ἐν πόλει, κινδύνοις ἐν ἐρημίᾳ, κινδύνοις ἐν θαλάσσῃ, κινδύνοις ἐν ψευδαδέλφοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/026.yaml
  text: often on journeys[a], in dangers from rivers, in dangers from robbers, in dangers from my own people, in dangers from Gentiles, in dangers in the city, in dangers in the wilderness, in dangers at sea, in dangers among false brothers[b],
translation:
  language: tl
  text: sa madalas na paglalakbay, sa mga panganib mula sa mga ilog, sa mga panganib mula sa mga tulisan, sa mga panganib mula sa sarili kong mga kababayan[a], sa mga panganib mula sa mga Hentil, sa mga panganib sa lungsod, sa mga panganib sa ilang, sa mga panganib sa dagat, sa mga panganib sa gitna ng mga huwad na kapatid[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mula sa sarili kong lahi” o “mula sa sarili kong bayan.” Literal sa Griyego: “mula sa [aking] lahi/bayan.”'
    reason: lexical_alternative
  - marker: b
    text: 'O “sa gitna ng mga huwad na mananampalataya.” Literal sa Griyego: “sa gitna ng mga huwad na kapatid.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοιπορίαις πολλάκις
  choice: sa madalas na paglalakbay
  rationale: Natural itong pariralang Filipino para sa paulit-ulit na paglalakbay at pinananatili ang anyong-listahan ng Griyego.
- source_word: κινδύνοις
  choice: sa mga panganib
  rationale: Inuulit ang parirala upang mapanatili ang madiing ritmo at naiipong bigat ng mga panganib sa orihinal.
- source_word: ποταμῶν
  choice: mula sa mga ilog
  rationale: Hindi tinutukoy ng Griyego kung baha, pagtawid, o ibang panganib ng ilog ang ibig sabihin, kaya pinananatiling bukas ang diwa.
- source_word: λῃστῶν
  choice: mula sa mga tulisan
  rationale: Ang “mga tulisan” ay malinaw at angkop sa mga armadong magnanakaw o bandido na panganib sa paglalakbay.
- source_word: ἐκ γένους
  choice: mula sa sarili kong mga kababayan
  rationale: Ipinahihiwatig ng γένος ang sariling pangkat-etniko o bayang kinabibilangan ni Pablo. Likas sa Filipino ang “mga kababayan” at hindi tahasang nagdaragdag ng pangngalang wala sa Griyego.
- source_word: ἐξ ἐθνῶν
  choice: mula sa mga Hentil
  rationale: Sa tuwirang pagsalungat sa sariling mga kababayan ni Pablo, tumutukoy ang ἔθνη sa mga hindi Judio; “mga Hentil” ang maikli at nakaugaliang salin.
- source_word: ἐν πόλει
  choice: sa lungsod
  rationale: Pinananatili ang pang-isahang anyong pangkalahatan ng Griyego at ang kaibahan nito sa ilang at dagat.
- source_word: ἐν ἐρημίᾳ
  choice: sa ilang
  rationale: Saklaw ng “ilang” ang ilang, tiwangwang, o disyertong pook nang hindi nililimitahan ang kahulugan sa mabuhanging disyerto.
- source_word: ἐν θαλάσσῃ
  choice: sa dagat
  rationale: Ito ang tuwiran at likas na katumbas sa Filipino para sa panganib na nararanasan sa karagatan.
- source_word: ἐν ψευδαδέλφοις
  choice: sa gitna ng mga huwad na kapatid
  rationale: Pinananatili ng “mga huwad na kapatid” ang tiyak at panlalaking anyo ng tambalang Griyego nang hindi ito pinalalawak sa paraang wala sa teksto.
theological_decisions:
- issue: Pagpapakahulugan sa ψευδαδέλφοις
  choice: sa gitna ng mga huwad na kapatid
  alternative: sa gitna ng mga huwad na mananampalataya
  rationale: Literal na “mga huwad na kapatid” ang Griyego at malamang na tumutukoy sa mga nag-aangking kapananampalataya. Hindi nilulutas ng salin kung sa anong eksaktong paraan sila huwad.
- issue: Pagpapakahulugan sa ἐξ ἐθνῶν kasalungat ng ἐκ γένους
  choice: mula sa mga Hentil
  alternative: mula sa mga hindi Judio
  rationale: Ang konteksto ay malinaw na naghahambing sa sariling bayang kinabibilangan ni Pablo at sa ibang mga bansa o mga hindi Judio. Ang “mga Hentil” ay tumpak at tradisyonal nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Sinasadyang inuulit ang “sa mga panganib” upang mapanatili ang retorikal na ritmo ng Griyego. Pinanatili rin ang pangwakas na kuwit dahil bahagi ang talata ng nagpapatuloy na talaan ng mga hirap ni Pablo.
