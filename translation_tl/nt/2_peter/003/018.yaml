  naturalness: Makabago, malinaw, at marangal ang Tagalog. Likas ang “Sa kanya ang kaluwalhatian,” at ang bahagyang literal na “araw ng walang hanggan” ay angkop sa doksolohikal na rehistro at sinusuportahan ng talababa.
  terminology: Ang “biyaya,” “pagkakilala,” “Panginoon,” “Tagapagligtas,” “Mesiyas,” at “kaluwalhatian” ay pare-parehong angkop at matatag na mga katawagan. Ang “Jesus, ang Mesiyas” ay malinaw na pangtitulong pagsasalin ng Ἰησοῦ Χριστοῦ, habang ang talababa ay nagbibigay ng nakaugaliang anyong “Jesucristo.”
