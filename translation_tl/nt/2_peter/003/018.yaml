id: 2PE.3.18
reference: 2 Peter 3:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος. ⸀ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/018.yaml
  text: But grow in the grace and knowledge of our Lord and Savior Jesus the Messiah[a]. To him be the glory both now and to the day of eternity[b]. Amen.
translation:
  language: tl
  text: Ngunit patuloy kayong lumago sa biyaya at pagkakilala sa ating Panginoon at Tagapagligtas na si Jesus, ang Mesiyas.[a] Sa kanya ang kaluwalhatian ngayon at hanggang sa araw ng walang hanggan.[b] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Jesucristo,” ayon sa nakaugaliang gamit sa Tagalog.
    reason: alternative_reading
  - marker: b
    text: O “ngayon at magpakailanman.” Mas literal sa Griyego ang “ngayon at hanggang sa araw ng walang hanggan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐξάνετε
  choice: patuloy kayong lumago
  rationale: Pangkasalukuyang pautos na maramihan; likas sa Tagalog ang tahasang ‘patuloy’ upang ihayag ang nagpapatuloy na paglago.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang banayad na pagsalungat sa naunang babala at panawagan.
- source_word: ἐν χάριτι καὶ γνώσει
  choice: sa biyaya at pagkakilala
  rationale: Ang ‘sa’ ay kapuwa sumasaklaw sa χάριτι at γνώσει. Ang ‘pagkakilala’ ay angkop sa kaalaman tungkol sa isang persona at hindi lamang sa impormasyong intelektuwal.
- source_word: χάριτι
  choice: biyaya
  rationale: Karaniwan, malinaw, at angkop na salin ng χάρις sa kontekstong ito.
- source_word: γνώσει
  choice: pagkakilala
  rationale: Ipinahahayag ang kaalaman tungkol kay Jesus nang hindi ito nililimitahan sa abstraktong pagkaunawa.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: sa ating Panginoon at Tagapagligtas na si Jesus, ang Mesiyas
  rationale: Ang iisang pantukoy sa Griyego ay nag-uugnay sa dalawang titulo sa iisang persona. Isinalin ang Χριστός bilang titulong ‘Mesiyas,’ samantalang pinanatiling natural ang pangungusap sa Tagalog.
- source_word: αὐτῷ ἡ δόξα
  choice: Sa kanya ang kaluwalhatian
  rationale: Natural at marangal na pormulang doksolohikal na sumasalamin sa ipinahihiwatig na pandiwa ng Griyego.
- source_word: καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος
  choice: ngayon at hanggang sa araw ng walang hanggan
  rationale: Pinananatili ang di-karaniwang larawan ng ‘araw’ sa ἡμέραν at ang pangwalang-hanggang diwa ng αἰῶνος, sa halip na patagin lamang bilang ‘magpakailanman.’
- source_word: ἀμήν
  choice: Amen
  rationale: Nakaugaliang transliterasyon sa makabagong Tagalog at sa kontekstong doksolohikal.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ sa Ἰησοῦ Χριστοῦ
  choice: Jesus, ang Mesiyas
  alternative: Jesucristo / Jesus Cristo
  rationale: May lakas pa rin bilang titulo ang Χριστός; ang ‘Mesiyas’ ay nagsasalin ng kahulugan sa halip na transliterasyon lamang.
- issue: Tinutukoy ng ‘ating Panginoon at Tagapagligtas’
  choice: Ang dalawang titulo ay kapuwa tumutukoy sa iisang persona, si Jesus na Mesiyas
  alternative: Isang saling hindi tahasang nagpapakita ng sintaktikong ugnayan
  rationale: Malakas na ipinahihiwatig ng iisang pantukoy na namamahala sa κύριος at σωτήρ na iisa ang tinutukoy.
- issue: Di-karaniwang pariralang εἰς ἡμέραν αἰῶνος
  choice: hanggang sa araw ng walang hanggan
  alternative: magpakailanman
  rationale: Pinananatili ng pangunahing teksto ang tunay na kakaibang larawan at tensiyon ng Griyego; ibinibigay sa talababa ang mas idiomatikong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘patuloy kayong lumago’ upang maging natural ang tuloy-tuloy na puwersa ng pautos; pinanatili naman ang di-karaniwang ‘araw ng walang hanggan’ dahil mahalaga ang mismong larawan ng Griyego.
