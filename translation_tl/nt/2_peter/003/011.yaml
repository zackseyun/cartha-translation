  naturalness: Likas at marangal sa modernong Filipino Tagalog ang “Yamang ang lahat ng ito ay nalulusaw sa ganitong paraan, anong uri ng mga tao ang nararapat ninyong maging sa banal na pamumuhay at debosyon sa Diyos,”. Pinananatili rin nito ang nakabiting kuwit, dahil nagpapatuloy ang pangungusap sa kasunod na talata.
  terminology: Ang “banal na pamumuhay” ay angkop para sa ἁγίαις ἀναστροφαῖς, at ang “debosyon sa Diyos” ay malinaw, di-denominasyonal, at angkop para sa εὐσεβείαις. Ang “nararapat” ay wastong katumbas ng δεῖ sa paraenetikong konteksto.
