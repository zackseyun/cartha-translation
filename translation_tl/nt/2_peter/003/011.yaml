id: 2PE.3.11
reference: 2 Peter 3:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τούτων ⸀οὕτως πάντων λυομένων ποταποὺς δεῖ ὑπάρχειν ὑμᾶς ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/011.yaml
  text: Since all these things are being dissolved in this way[a], what sort of people ought you to be in holy conduct and godliness[b],
translation:
  language: tl
  text: Yamang ang lahat ng ito ay nalulusaw sa ganitong paraan, anong uri ng mga tao ang nararapat ninyong maging sa banal na pamumuhay at debosyon sa Diyos,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτων ... πάντων
  choice: ang lahat ng ito
  rationale: Tumutukoy ito sa mga nilikhang bagay na binanggit sa naunang konteksto. Likas sa Tagalog ang pariralang “ang lahat ng ito” nang hindi na tahasang idinaragdag ang “mga bagay.”
- source_word: οὕτως
  choice: sa ganitong paraan
  rationale: Pinananatili nito ang diwa ng paraan o kung paano magaganap ang pagkalusaw.
- source_word: λυομένων
  choice: malulusaw
  rationale: Sa kontekstong eskatolohikal, ang kasalukuyang participle ay tumutukoy sa tiyak na pagkalas o pagkabuwag na darating. Ang “malulusaw” ay natural sa Tagalog at hindi kasing-interpretatibo ng “mawawasak.” Ipinaliliwanag sa talababa ang mas literal na anyo.
- source_word: ποταποὺς
  choice: anong uri ng mga tao
  rationale: Pinananatili nito ang retorikal na tanong tungkol sa katangian ng kanilang pagkatao at pamumuhay.
- source_word: δεῖ
  choice: nararapat
  rationale: Ipinahahayag nito ang moral na pangangailangan nang may dignidad, ngunit hindi pinatitindi sa absolutong utos na maaaring ipahiwatig ng “kailangang-kailangan.”
- source_word: ὑπάρχειν
  choice: maging
  rationale: Ito ang likas na katumbas sa Tagalog sa konstruksyong nagsasaad kung ano ang nararapat nilang maging.
- source_word: ἐν ἁγίαις ἀναστροφαῖς
  choice: namumuhay nang banal
  rationale: Ang ἀναστροφή ay paraan ng pamumuhay o asal. Mas natural sa modernong Tagalog ang pandiwang pariralang ito kaysa sa literal ngunit mabigat na “sa mga banal na asal.”
- source_word: εὐσεβείαις
  choice: may debosyon sa Diyos
  rationale: Ipinahahayag nito ang magalang at tapat na pagtalima sa Diyos na nakikita sa buhay. Naiiwasan din nito ang posibleng kalabuan ng “makadiyos,” na maaaring unawain lamang bilang mabuting asal.
theological_decisions:
- issue: Ang magiging kalagayan ng kasalukuyang kaayusan sa wakas
  choice: malulusaw
  alternative: mawawasak; mabubuwag; nilulusaw
  rationale: Ang λύω ay pangunahing naglalarawan ng pagkalag o pagkakalag, kaya hindi ito pinalakas tungo sa “mawawasak.” Ginamit ang anyong panghinaharap dahil iyon ang malinaw na temporal na punto ng konteksto, habang itinala sa talababa ang mas literal na anyong kasalukuyan ng participle.
- issue: Kaugnayan ng banal na pamumuhay at debosyon sa retorikal na tanong
  choice: Inilahad bilang paglalarawan sa uri ng mga taong nararapat nilang maging
  alternative: Ituring lamang na dalawang hiwalay na gawaing dapat nilang gawin
  rationale: Ang ἐν ay naglalarawan sa larangan o paraan ng kanilang pagiging gayong uri ng mga tao. Hindi pinaghiwalay ang pagkatao at pamumuhay na para bang walang ugnayan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “debosyon sa Diyos” upang maging madaling maunawaan ang εὐσέβεια nang hindi nag-aangkat ng natatanging terminolohiyang denominasyonal. Nagtatapos sa kuwit sapagkat nagpapatuloy ang pangungusap sa susunod na talata.
