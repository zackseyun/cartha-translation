  text: δι’ ὧν ὁ τότε κόσμος ὕδατι κατακλυσθεὶς ἀπώλετο·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/006.yaml
  text: through which the world of that time[a], having been flooded with water[b], perished.
translation:
  language: tl
  text: Sa pamamagitan ng mga iyon[a], ang sanlibutan noon ay nawasak nang bahain ito ng tubig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Dahil sa mga iyon.” Ang panghalip sa Griyego ay pangmaramihan at tumutukoy sa mga paraang binanggit sa naunang talata.
    reason: lexical_alternative
  - marker: b
    text: O, “napahamak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: Sa pamamagitan ng mga iyon
  rationale: Ipinapakita nito ang gamit o paraang ipinahihiwatig ng διά na may genitive, pinananatili ang pangmaramihang anyo ng panghalip, at hindi nililimitahan ang tinutukoy nito nang higit sa sinasabi ng konteksto.
- source_word: ὁ τότε κόσμος
  choice: ang sanlibutan noon
  rationale: Likas at maikli itong tumutukoy sa kaayusan ng daigdig at sangkatauhan noong panahong iyon, habang pinananatili ang paghahambing sa kasalukuyang sanlibutan sa kasunod na talata.
- source_word: ὕδατι
  choice: ng tubig
  rationale: Sa pariralang “bahain ito ng tubig,” natural na ipinapahayag sa Tagalog ang tubig bilang ginamit na elemento o paraan ng pagbaha.
- source_word: κατακλυσθεὶς
  choice: nang bahain ito
  rationale: Ipinapahayag nito ang pasibong diwa ng aorist participle at ang kaugnayan ng pagbaha sa pangunahing pandiwang “nawasak,” nang hindi nagdaragdag ng pangngalang wala sa Griyego.
- source_word: ἀπώλετο
  choice: nawasak
  rationale: Ang pandiwa ay maaaring mangahulugang napahamak o nawasak. Ang “nawasak” ay malinaw at natural sa konteksto ng mapangwasak na baha, ngunit hindi kinakailangang magpahiwatig ng ganap na pagkalipol ng materyal na daigdig.
theological_decisions:
- issue: Kalikasan ng hatol sa pamamagitan ng baha
  choice: nawasak
  alternative: napahamak
  rationale: Inilalarawan ng talata ang matinding paghatol sa sanlibutan noong panahon ni Noe. Hindi ipinipilit ng salin ang metafisikal na ganap na pagkalipol; ipinahahayag lamang nito ang pagkawasak ng sanlibutang umiiral noon.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “sanlibutan” para sa κόσμος at pinanatiling bukas ang tinutukoy ng pangmaramihang “mga iyon.”
