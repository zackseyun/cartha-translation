id: 2PE.3.10
reference: 2 Peter 3:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἥξει δὲ ⸀ἡμέρα κυρίου ὡς ⸀κλέπτης, ἐν ᾗ οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα ⸀λυθήσεται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα ⸀εὑρεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/010.yaml
  text: But the day of the Lord will come like a thief[a], in which the heavens will pass away with a roar, and the elements, being burned, will be dissolved[c][b], and the earth and the works in it will be found.
translation:
  language: tl
  text: Ngunit darating ang araw ng Panginoon na gaya ng isang magnanakaw. Sa araw na iyon, lilipas ang kalangitan na may ugong, at ang mga sangkap ng sansinukob[a] ay magkakalas habang nasusunog; at ang lupa at ang mga gawang nasa loob nito ay masusumpungan.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bagay sa kalangitan.” Ang στοιχεῖα ay maaari ring tumukoy nang mas tiyak sa mga bahagi o bagay na bumubuo sa kosmos.
    reason: lexical_alternative
  - marker: b
    text: Maaaring unawain ang “masusumpungan” bilang “malalantad” o “mahahayag.”
    reason: alternative_reading
  - marker: c
    text: Maraming manuskrito ang may “masusunog” sa halip na “masusumpungan.”
    reason: textual_variant
lexical_decisions:
- source_word: ἥξει
  choice: darating
  rationale: Likas na salin ng panghinaharap na ἥκω at angkop sa pagdating ng eskatolohikal na araw.
- source_word: ἡμέρα κυρίου
  choice: araw ng Panginoon
  rationale: Pinananatili ang nakaugaliang propetiko at eskatolohikal na katawagan; hindi ito ipinapakahulugang lingguhang araw ng pagsamba.
- source_word: ὡς κλέπτης
  choice: na gaya ng magnanakaw
  rationale: Ipinahihiwatig ng paghahambing ang di-inaasahang pagdating; natural at pamilyar itong idyoma sa Tagalog.
- source_word: ἐν ᾗ
  choice: Sa araw na iyon
  rationale: Malinaw at natural na inuugnay sa Tagalog ang kasunod na mga pangyayari sa araw na kababanggit, nang hindi binabago ang kahulugan.
- source_word: οἱ οὐρανοὶ
  choice: ang kalangitan
  rationale: Natural na kolektibong katawagan sa modernong Tagalog para sa kosmikong οὐρανοί.
- source_word: ῥοιζηδόν
  choice: na may dagundong
  rationale: Nagpapahayag ng malakas at rumaragasang ingay habang pinananatili ang bigat ng larawan.
- source_word: παρελεύσονται
  choice: lilipas
  rationale: Tumutugma sa eskatolohikal na diwa ng παρέρχομαι at nagpapanatili ng ugnay sa ibang tekstong nagsasabing lilipas ang langit at lupa.
- source_word: στοιχεῖα
  choice: mga sangkap ng sansinukob
  rationale: Mas nauunawaan kaysa sa payak na 'mga elemento' ngunit hindi nito nililimitahan ang salita sa mga bagay sa kalangitan lamang; inilalahad sa talababa ang mahalagang alternatibo.
- source_word: καυσούμενα λυθήσεται
  choice: ay matutunaw sa matinding init
  rationale: Natural na Tagalog na pinagsasama ang pagkasunog/pag-iinit at pagkakalansag o pagkatunaw, nang hindi tahasang nagtatalaga ng gumagawa nito.
- source_word: γῆ
  choice: ang lupa
  rationale: Ang kosmikong konteksto ay tumutukoy sa daigdig, hindi lamang sa isang lupain.
- source_word: τὰ ἐν αὐτῇ ἔργα
  choice: ang mga gawang naroon
  rationale: Malapit sa anyo ng Griyego at pinananatiling bukas kung tumutukoy sa mga gawa o mga bagay na ginawa sa lupa.
- source_word: εὑρεθήσεται
  choice: masusumpungan
  rationale: Pinananatili ang tuwirang at mahirap na pagbasa ng ibinigay na tekstong Griyego sa halip na palitan ito ng isang interpretatibong paglilinaw.
theological_decisions:
- issue: Kahulugan ng huling sugnay na καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα εὑρεθήσεται
  choice: Pinanatili sa pangunahing teksto ang 'ang lupa at ang mga gawang naroon ay masusumpungan.'
  alternative: Maaaring unawain bilang 'malalantad'; maraming manuskrito naman ang may diwang 'masusunog.'
  rationale: Ang εὑρεθήσεται sa ibinigay na SBLGNT ay pinakatuwirang nangangahulugang 'masusumpungan.' Dahil kapuwa pinagtatalunan ang teksto at interpretasyon, hindi tahimik na nilulutas ng salin ang tensiyon.
- issue: Tinutukoy ng στοιχεῖα
  choice: mga sangkap ng sansinukob
  alternative: mga bagay sa kalangitan
  rationale: Maaaring tumukoy ang salita sa mga pangunahing sangkap ng kosmos o, nang mas tiyak, sa mga bagay sa kalangitan. Pinananatiling mas malawak ang pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang 'Panginoon,' 'kalangitan,' at 'sansinukob' para sa marangal ngunit kasalukuyang rehistro. Inilagay ang lahat ng marker [a], [b], at [c] sa pangunahing teksto at inayos ang mga ito sa puntong tuwirang kaugnay ng bawat tala.
