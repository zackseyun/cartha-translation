  text: Ταύτην ἤδη, ἀγαπητοί, δευτέραν ὑμῖν γράφω ἐπιστολήν, ἐν αἷς διεγείρω ὑμῶν ἐν ὑπομνήσει τὴν εἰλικρινῆ διάνοιαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/001.yaml
  text: Beloved[a], this is now the second letter I am writing to you; in both of them I am stirring up your sincere mind by way of reminder[b],
translation:
  language: tl
  text: Mga minamahal, ito na ang ikalawang liham na isinusulat ko sa inyo. Sa dalawang liham na ito[a], pinupukaw ko sa pamamagitan ng pagpapaalala ang inyong dalisay na pag-iisip[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa mga ito”; ang maramihang anyo sa Griyego ay pinakanatural na tumutukoy sa dalawang liham.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “tapat na pag-iisip.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Mga minamahal
  rationale: Pinananatili nito ang magiliw at makahulugang pagtawag sa maramihang kausap, habang natural at marangal sa makabagong Filipino.
- source_word: Ταύτην ἤδη ... δευτέραν ... ἐπιστολήν
  choice: ito na ang ikalawang liham
  rationale: Likas na isinasaayos sa Filipino ang ayos ng mga salita habang pinananatili ang diin na ang kasalukuyang liham ang ikalawa.
- source_word: γράφω
  choice: isinusulat ko
  rationale: Ipinahahayag ng aspektong nagaganap ang kilos ng may-akda habang binubuo niya ang liham.
- source_word: ἐν αἷς
  choice: Sa dalawang liham na ito
  rationale: Ang panghalip na pambabae at maramihan sa Griyego ay pinakanatural na tumutukoy sa dalawang liham; nililinaw ito sa Filipino nang hindi pinalalawak ang kahulugan.
- source_word: διεγείρω
  choice: pinupukaw ko
  rationale: Naipapahayag nito ang metaporikal na paggising o pagpapasigla ng isip tungo sa panibagong pagtuon.
- source_word: ἐν ὑπομνήσει
  choice: sa pamamagitan ng pagpapaalala
  rationale: Malinaw nitong ipinahahayag ang paraan o kasangkapang ginagamit sa pagpukaw.
- source_word: εἰλικρινῆ διάνοιαν
  choice: tapat na pag-iisip
  rationale: Sinasaklaw ng 'pag-iisip' ang διάνοια bilang isip o paraan ng pag-unawa, at ng 'tapat' ang εἰλικρινής bilang taos, dalisay, o walang halong layunin.
- source_word: ὑμῶν
  choice: inyong
  rationale: Likas na anyong paari sa Filipino para sa panghalip na maramihan.
theological_decisions:
- issue: Tinutukoy ng maramihang ἐν αἷς
  choice: Tumutukoy ito sa dalawang liham na isinulat sa mga tatanggap.
  alternative: Tumutukoy lamang ito sa kasalukuyang liham sa pamamagitan ng maluwag na gamit ng maramihan.
  rationale: Ang tuwirang gramatikal na pagbasa ay ang pagtukoy ng maramihang panghalip sa dalawang liham na kababanggit lamang. Hindi ito nangangailangan ng dagdag na doktrinal o historikal na palagay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Mga minamahal” upang mapanatili ang init at bigat ng apostolikong pagtawag, at “pinupukaw” bilang natural na metapora para sa paggising ng isip sa pamamagitan ng pagpapaalala.
