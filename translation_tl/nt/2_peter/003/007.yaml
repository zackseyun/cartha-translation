  source_fidelity: Kailangang maipahayag nang hiwalay ang parehong τεθησαυρισμένοι εἰσὶν (“ay nakalaan/nakatabi”) at τηρούμενοι (“iniingatan”). Ang draft ay isinasalin lamang ang huli, kaya nawawala ang unang periphrastic-perfect na larawan. Ang “mga taong hindi kumikilala sa Diyos” ay mas makitid kaysa ἀσεβῶν, na tumutukoy sa kawalan ng kabanalan o paggalang sa Diyos.
  naturalness: Ang binagong pangungusap ay natural sa modernong Filipino Tagalog at pinananatili ang marangal na rehistro. Ang “kasalukuyang kalangitan at lupa” ay likas na kolektibong pagpapahayag.
  terminology: Ginamit ang “mga taong walang paggalang sa Diyos” para sa ἀσεβῶν ἀνθρώπων; ito ay mas malapit sa diwang “ungodly/irreverent” nang hindi nagdadagdag ng doktrinal na paliwanag. Pinanatili ang “paghuhukom,” “pagkapuksa,” at “apoy.”
