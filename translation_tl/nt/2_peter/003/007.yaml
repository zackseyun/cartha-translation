  text: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ τῷ ⸀αὐτῷ λόγῳ τεθησαυρισμένοι εἰσὶν πυρὶ τηρούμενοι εἰς ἡμέραν κρίσεως καὶ ἀπωλείας τῶν ἀσεβῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/007.yaml
  text: But the present heavens and the earth are stored up by the same word, being kept for fire until the day of judgment and destruction of ungodly men.
translation:
  language: tl
  text: Ngunit ang kasalukuyang kalangitan at lupa ay nakalaan sa pamamagitan ng salitang iyon din at iniingatan para sa apoy hanggang sa araw ng paghuhukom at pagkapuksa ng mga taong walang paggalang sa Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ
  choice: Ngunit ang kasalukuyang kalangitan at ang lupa
  rationale: Ipinakikita ng “Ngunit” ang kaibahan sa dating sanlibutan sa naunang konteksto. Pinananatili ng “kasalukuyang” ang temporal na diin ng νῦν, at ang “kalangitan” ay likas na kolektibong katumbas sa Tagalog ng pangmaramihang οὐρανοί.
- source_word: τῷ αὐτῷ λόγῳ
  choice: ng salita ring iyon
  rationale: Tumutukoy ito pabalik sa mabisa at makapangyarihang salita ng Diyos sa konteksto. Ipinahahayag ng hulaping “rin” ang diwa ng αὐτῷ na “iyon ding salita,” habang likas sa Tagalog ang gamit na instrumental.
- source_word: τεθησαυρισμένοι εἰσὶν ... τηρούμενοι
  choice: ay iniingatan
  rationale: Ang periphrastic perfect ay nagsasaad ng umiiral na kalagayang bunga ng naunang pagkilos, samantalang inuulit ng τηρούμενοι ang diwa ng patuloy na paglalaan o pag-iingat. Pinagsama ang magkalapit na larawan sa likas na Tagalog nang hindi nawawala ang diwa ng kasalukuyang pagkakalaan para sa hinaharap.
- source_word: πυρὶ
  choice: para sa apoy
  rationale: 'Ang datibo ay nagpapahayag dito ng layon o kahihinatnan: inilaan ang kasalukuyang kalangitan at lupa para sa apoy. Hindi nilagyan ng tiyak na pantukoy upang igalang ang anarthrous na Griyego.'
- source_word: εἰς ἡμέραν κρίσεως
  choice: hanggang sa araw ng paghuhukom
  rationale: Likas na ipinahahayag ng “hanggang sa” ang temporal na hantungan ng εἰς, at malinaw na isinasalin ng “paghuhukom” ang κρίσις sa eskatolohikal na konteksto.
- source_word: καὶ ἀπωλείας
  choice: at pagkapuksa
  rationale: Ang “pagkapuksa” ay malinaw at kasalukuyang katumbas ng ἀπώλεια bilang pagkawasak o kapahamakan, nang hindi ito ginagawang teknikal na katawagang teolohikal.
- source_word: τῶν ἀσεβῶν ἀνθρώπων
  choice: ng mga taong hindi kumikilala sa Diyos
  rationale: Ang ἀσεβής ay tumutukoy sa kawalan ng paggalang o pagkilala sa Diyos. Ang “mga tao” ay natural at tumpak na generic na salin ng ἀνθρώπων sa modernong Tagalog at hindi nililimitahan ang reperensiya sa kalalakihan.
theological_decisions:
- issue: Likas ng darating na wakas sa pamamagitan ng apoy
  choice: Sinasabi ng talata na ang kasalukuyang kalangitan at lupa ay iniingatan para sa apoy sa hinaharap, ngunit hindi nito ipinapasiya kung ganap na paglipol o pagbabagong naglilinis ang mangyayari sa sangnilikha.
  alternative: Ganap na paglipol sa kosmos; o paglilinis at pagbabago ng sangnilikha.
  rationale: Tahasan lamang na inuugnay ng sintaks ang “pagkapuksa” sa mga taong hindi kumikilala sa Diyos. Kaya hindi nilulutas ng salin ang mas malawak na usaping doktrinal tungkol sa magiging kalagayan ng kalangitan at lupa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kalangitan” bilang likas na kolektibo, “paghuhukom” bilang pamilyar na biblikal na salita, at “mga tao” para sa generic na ἀνθρώπων. Inilagay ang kinakailangang panandang [a] sa pangunahing teksto.
