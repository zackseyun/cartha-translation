  source_fidelity: Ang pangunahing sugnay at ang posibleng ahentibong pagbasa ng αὐτῷ ay maayos na naipapahayag ng “matagpuan niya kayong.” Ngunit ang “at namumuhay nang payapa” ay nagdaragdag ng pandiwang “namumuhay” at ginagawang hiwalay na magkakaugnay na sugnay ang ἐν εἰρήνῃ. Ang Griyego ay isang pariralang naglalarawan sa kalagayan kung saan sila matagpuan.
  naturalness: Likas at marangal ang “Kaya, mga minamahal” at “pagsikapan ninyong.” Mas tapat at mas tuwiran ang “sa kapayapaan” kaysa “at namumuhay nang payapa,” habang nananatiling natural sa modernong Filipino Tagalog.
  terminology: Ang “walang dungis at walang kapintasan” ay angkop na pares para sa ἄσπιλοι καὶ ἀμώμητοι. Pinananatili ng “sa kapayapaan” ang malawak na saklaw ng ἐν εἰρήνῃ nang hindi nagdaragdag ng tahasang pakikipagkasundo kaninuman.
  issues:
