    issue: Ang “at namumuhay nang payapa” para sa ἐν εἰρήνῃ ay may dagdag na pandiwa at koordinasyon.
    rationale: Ang ἐν εἰρήνῃ ay pariralang preposisyonal, hindi isang hiwalay na sugnay tungkol sa patuloy na pamumuhay. Ang dagdag na “namumuhay” ay sumisikip at bahagyang nagbabago sa aspekto ng pahayag.
  - severity: low
