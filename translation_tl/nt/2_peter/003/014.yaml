  text: Διό, ἀγαπητοί, ταῦτα προσδοκῶντες σπουδάσατε ἄσπιλοι καὶ ἀμώμητοι αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/014.yaml
  text: Therefore[a], beloved, since you are waiting for these things, make every effort to be found by him spotless and blameless in peace.
translation:
  language: tl
  text: Kaya, mga minamahal, habang hinihintay ninyo ang mga bagay na ito, pagsikapan ninyong matagpuan niya kayong walang dungis at walang kapintasan sa kapayapaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matagpuan kayong walang dungis at walang kapintasan sa harap niya, sa kapayapaan.” Maaaring mangahulugan ang datibong Griyego na siya ang makatagpo sa inyo o na matagpuan kayo sa harap niya.
    reason: alternative_reading
lexical_decisions:
- source_word: Διό
  choice: Kaya
  rationale: Likas na pang-ugnay sa modernong Tagalog na naghahayag ng konklusyon mula sa naunang talakayan tungkol sa araw ng Panginoon at sa bagong langit at bagong lupa.
- source_word: ἀγαπητοί
  choice: mga minamahal
  rationale: Pinananatili ang magiliw at marangal na pantawag nang hindi nililimitahan ang kausap sa kategoryang 'mga kaibigan.'
- source_word: ταῦτα προσδοκῶντες
  choice: habang hinihintay ninyo ang mga bagay na ito
  rationale: Ipinahahayag ang patuloy na paghihintay at pinananatiling di-tiyak ang saklaw ng demonstrative, na tumutukoy sa mga katatapos lamang ilarawang pangyayari at pangako.
- source_word: σπουδάσατε
  choice: pagsikapan ninyo
  rationale: Naghahatid ng masikap at sadyang pagkilos na hinihingi ng pautos, sa natural na modernong Tagalog.
- source_word: ἄσπιλοι
  choice: walang dungis
  rationale: Pinananatili ang metapora ng kalinisan o kawalan ng batik.
- source_word: ἀμώμητοι
  choice: walang kapintasan
  rationale: Likas na katumbas para sa kalagayang hindi mapupulaan; pinananatili rin ang bahagyang pagkakaiba nito sa 'walang dungis.'
- source_word: αὐτῷ εὑρεθῆναι
  choice: matagpuan niya kayong
  rationale: Ipinapakita ang maaaring instrumental o ahentibong gamit ng datibo at ang pasibong diwa ng infinitive, habang hindi pinapangalanan kung sino ang tinutukoy ng panghalip.
- source_word: ἐν εἰρήνῃ
  choice: at namumuhay nang payapa
  rationale: Natural na Tagalog para sa kalagayang 'nasa kapayapaan' kung saan dapat silang matagpuan, habang hindi dinaragdagan ng tahasang layon gaya ng 'sa Diyos.'
theological_decisions:
- issue: Gamit at tinutukoy ng αὐτῷ sa kontekstong eskatolohikal
  choice: matagpuan niya kayong
  alternative: matagpuan kayong walang dungis at walang kapintasan sa harap niya
  rationale: Maaaring unawain ang datibo bilang nagpapahiwatig ng gumagawa ng pagsusuri ('niya') o bilang kaugnayan/pagharap ('sa harap niya'). Pinanatiling implicit ang banal na tinutukoy at inilagay sa talababa ang tunay na alternatibo.
- issue: Saklaw ng ἐν εἰρήνῃ
  choice: namumuhay nang payapa
  alternative: nasa kapayapaan
  rationale: Hindi tinutukoy ng Griyego kung ito ay panloob, panlipunan, o pakikipagkasundo sa Diyos; kaya hindi idinagdag ang 'sa kanya' o ibang tiyak na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'mga minamahal' upang mapanatili ang init ng pantawag, at ang 'namumuhay nang payapa' upang maging likas ang pangungusap nang hindi nilulutas ang saklaw ng 'kapayapaan.'
