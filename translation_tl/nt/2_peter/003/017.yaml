  text: ὑμεῖς οὖν, ἀγαπητοί, προγινώσκοντες φυλάσσεσθε ἵνα μὴ τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες ἐκπέσητε τοῦ ἰδίου στηριγμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/017.yaml
  text: Therefore[a], you, beloved, knowing this beforehand, guard yourselves so that, being carried away by the error of the lawless[b], you may not fall from your own stability.
translation:
  language: tl
  text: Kaya nga, mga minamahal, dahil alam na ninyo ito noon pa, mag-ingat kayo upang hindi kayo matangay ng kamalian ng mga taong lumalabag sa batas at mahulog mula sa inyong sariling katatagan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “inyong sariling pagiging matatag” o “inyong sariling matatag na kalagayan.” Ang Griyegong στηριγμός ay maaaring tumukoy sa katatagan, pagiging matibay, o matatag na kalagayan.
    reason: lexical_alternative
  - marker: b
    text: Ang “mahulog mula sa” ay maaari ring isalin na “mahulong palayo sa,” ngunit hindi kinakailangang tumukoy ang Griyego sa isang mas tiyak na doktrinal na kahulugan.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς οὖν
  choice: Kaya nga
  rationale: Ipinahahayag ng οὖν ang kongklusyon o paghihinuha mula sa naunang babala. Hindi na hiwalay na isinalin ang emphatic ὑμεῖς dahil likas nang malinaw sa Tagalog ang tuwirang pagtukoy sa mga kausap sa kasunod na bokatibo at mga pandiwang pangmaramihan.
- source_word: ἀγαπητοί
  choice: mga minamahal
  rationale: Pinananatili nito ang mainit at marangal na bokatibong nagpapahayag ng pagmamahal sa mga mambabasa.
- source_word: προγινώσκοντες
  choice: yamang alam na ninyo ito nang patiuna
  rationale: Ipinakikita ng pariralang participial ang naunang kaalaman o paunang babala; idinagdag ang 'ito' ayon sa konteksto upang maging likas sa Tagalog.
- source_word: φυλάσσεσθε
  choice: mag-ingat kayo
  rationale: Likas na modernong Tagalog para sa patuloy na mapagbantay na pag-iingat sa sarili na hinihingi ng present middle imperative.
- source_word: ἵνα μὴ
  choice: upang hindi
  rationale: Malinaw na ipinahahayag ang layunin at kasabay na babala ng sugnay.
- source_word: τῇ τῶν ἀθέσμων πλάνῃ
  choice: ng kamalian ng mga taong lumalabag sa batas
  rationale: Ang πλάνη ay tumutukoy sa kamalian o pagkaligaw, samantalang ang ἄθεσμος ay sa mga hindi kumikilala o lumalabag sa wastong pamantayan; ang mas buong parirala ay mas malinaw at natural kaysa sa literal na 'mga walang batas.'
- source_word: συναπαχθέντες
  choice: matangay
  rationale: Pinananatili ang pasibong larawan ng pagdadala o pag-anod kasama ng mapanlinlang na kamalian, sa likas at masiglang Tagalog.
- source_word: ἐκπέσητε
  choice: mahulog mula sa
  rationale: Pinananatili ang metapora ng ἐκπίπτω at hindi nililimitahan ang babala sa isang tiyak na doktrina tungkol sa apostasya.
- source_word: τοῦ ἰδίου στηριγμοῦ
  choice: sarili ninyong katatagan
  rationale: Ang στηριγμός ay katatagan, pagiging matibay, o matatag na kalagayan; pinananatili ng 'sarili ninyo' ang diin ng ἰδίου.
theological_decisions:
- issue: Kung ang ἐκπέσητε ay tiyak na nangangahulugan ng pagkawala ng kaligtasan o apostasya
  choice: mahulog mula sa sarili ninyong katatagan
  alternative: mahulog palayo sa inyong matatag na kalagayan
  rationale: Malakas ang tunay na babala ng teksto, ngunit hindi nito tahasang tinutukoy ang eksaktong doktrinal na bunga. Kaya pinananatili ang metapora at tensiyong teolohikal nang hindi nagpapasya para sa alinmang denominasyonal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'mga minamahal' upang mapanatili ang pastoral na init, at iniwasan ang mas doktrinal na tiyak na 'tumalikod' sa pagsasalin ng ἐκπέσητε.
