id: 2PE.3.2
reference: 2 Peter 3:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μνησθῆναι τῶν προειρημένων ῥημάτων ὑπὸ τῶν ἁγίων προφητῶν καὶ τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/002.yaml
  text: to remember the words spoken beforehand by the holy prophets and the commandment of your apostles from the Lord and Savior[b][a],
translation:
  language: tl
  text: upang maalaala ninyo ang mga salitang naunang sinabi[b] ng mga banal na propeta, at ang utos ng Panginoon at Tagapagligtas na ipinarating sa pamamagitan ng inyong mga apostol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at ang utos ng inyong mga apostol mula sa Panginoon at Tagapagligtas.” Maaaring katawanin sa higit sa isang natural na paraan ang ugnayan ng magkakasunod na pariralang paari sa Griyego.
    reason: alternative_reading
  - marker: b
    text: O “mga salitang sinabi nang una.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μνησθῆναι
  choice: upang maalaala ninyo
  rationale: Ang infinitive ay nagpapahayag ng layunin kaugnay ng naunang talata. Likas sa modernong Tagalog ang aktibong “maalaala ninyo,” bagaman pasibo ang anyong Griyego.
- source_word: προειρημένων ῥημάτων
  choice: mga salitang sinabi nang una
  rationale: Pinananatili nito ang diwang temporal ng προειρημένων at hindi nililimitahan ang parirala sa tiyak na kahulugang “ipinanghulang mangyayari.”
- source_word: ὑπὸ τῶν ἁγίων προφητῶν
  choice: ng mga banal na propeta
  rationale: Natural na Tagalog ito para sa tagaganap ng pasibong “sinabi,” at tuwirang pinananatili ang paglalarawang “banal.”
- source_word: ἐντολῆς
  choice: utos
  rationale: Ang “utos” ay malinaw, makapangyarihan, at natural na katumbas ng isahang ἐντολή sa modernong Tagalog.
- source_word: τῶν ἀποστόλων ὑμῶν
  choice: sa pamamagitan ng inyong mga apostol
  rationale: Ipinapahayag nito ang mga apostol na tagapamagitan ng utos habang pinananatili ang ugnayan nila sa mga mambabasa na nasa ὑμῶν.
- source_word: τοῦ κυρίου καὶ σωτῆρος
  choice: ng Panginoon at Tagapagligtas
  rationale: Pinananatili ang dalawang titulo at iniuugnay ang genitive sa “utos,” nang hindi idinaragdag ang “ating,” na wala sa Griyego.
theological_decisions:
- issue: Ugnayan ng τοῦ κυρίου καὶ σωτῆρος sa ἐντολῆς at sa mga apostol
  choice: Ang utos ay sa Panginoon at Tagapagligtas at ipinarating sa pamamagitan ng mga apostol.
  alternative: Ang utos ng inyong mga apostol ay mula sa Panginoon at Tagapagligtas.
  rationale: Ang pangunahing salin ay natural na nagpapakita sa Panginoon at Tagapagligtas bilang pinagmulan o may-ari ng utos at sa mga apostol bilang mga tagapamagitan. Dahil maaaring katawanin sa higit sa isang paraan ang magkakasunod na genitive sa Griyego, inilalahad sa talababa ang ibang natural na pagbasa.
- issue: Ugnayan ng ὑμῶν sa ἀποστόλων
  choice: “inyong” ay tumutukoy sa “mga apostol.”
  alternative: Ang diwa ay maaaring ipaliwanag bilang mga apostol na naghatid ng utos sa mga mambabasa.
  rationale: Pinakamalapit sa ayos ng Griyego ang pag-uugnay ng ὑμῶν sa ἀποστόλων, ngunit hindi nito ipinahihiwatig na pag-aari ng mga mambabasa ang mga apostol.
translation_notes:
  register: 'Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “maalaala,” “utos,” at “Tagapagligtas” bilang mga karaniwan at malinaw na salitang biblikal. Ang kuwit ay naghihiwalay sa dalawang bagay na dapat maalaala: ang mga salita ng mga propeta at ang utos na ipinarating ng mga apostol.'
