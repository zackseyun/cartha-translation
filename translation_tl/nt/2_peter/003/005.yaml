  text: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας ὅτι οὐρανοὶ ἦσαν ἔκπαλαι καὶ γῆ ἐξ ὕδατος καὶ δι’ ὕδατος συνεστῶσα τῷ τοῦ θεοῦ λόγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/005.yaml
  text: 'For they deliberately overlook this: that the heavens existed long ago[a], and the earth was formed out of water and through water by the word of God[c][b],'
translation:
  language: tl
  text: 'Sapagkat sinasadya nilang ipagwalang-bahala ang katotohanang ito[a]: mula pa noong unang panahon ay may mga langit na, at ang lupa ay nabuo mula sa tubig at sa pamamagitan ng tubig sa bisa ng salita ng Diyos.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sapagkat sadyang hindi nila kinikilala ang katotohanang ito.” Pinagsasama ng pananalitang Griyego ang hindi pagpansin at ang sadyang kagustuhang huwag itong kilalanin.
    reason: lexical_alternative
  - marker: b
    text: Maaaring “sa pamamagitan ng salita ng Diyos” o “sa utos ng Diyos.” Mas literal ang “salita ng Diyos”; ipinahahayag ng parirala na ang salita ng Diyos ang mabisang dahilan ng pagkabuo.
    reason: lexical_alternative
lexical_decisions:
- source_word: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας
  choice: Sapagkat sinasadya nilang ipagwalang-bahala ang katotohanang ito
  rationale: Ipinahahayag ng parirala kapuwa ang hindi pagkilala at ang kusang disposisyong huwag pansinin. Likas sa makabagong Tagalog ang “sinasadyang ipagwalang-bahala” at hindi nito ginagawang simpleng di-sinasadyang kamangmangan ang diwa.
- source_word: ὅτι
  choice: 'ang katotohanang ito:'
  rationale: Ipinakikilala nito ang nilalaman ng sadyang hindi nila pinapansin. Ang tutuldok ay malinaw at natural sa Tagalog.
- source_word: οὐρανοὶ
  choice: mga langit
  rationale: Pinananatili ang maramihang anyo ng Griyego at ang biblikal na pananalitang kosmolohikal.
- source_word: ἔκπαλαι
  choice: mula pa noong unang panahon
  rationale: Malinaw at dignified na makabagong katumbas ng kahulugang matagal nang nakalipas.
- source_word: γῆ
  choice: ang lupa
  rationale: Bagaman walang artikulo sa Griyego, hindi natural sa Tagalog ang “isang lupa” sa ganitong pahayag tungkol sa sangnilikha. Tinutukoy ng konteksto ang nilikhang daigdig; hindi kailangang gayahin sa Tagalog ang kawalan ng artikulo.
- source_word: ἐξ ὕδατος καὶ δι’ ὕδατος
  choice: mula sa tubig at sa pamamagitan ng tubig
  rationale: Pinananatili ang pagkakaiba ng ἐκ, na nagsasaad ng pinagmulan, at διά, na maaaring magsaad ng pamamagitan, nang hindi pinapawi ang likas na hirap ng larawan.
- source_word: συνεστῶσα
  choice: nabuo
  rationale: Natural na inilalarawan ang pagkakatatag o pagkakabuo ng lupa sa konteksto ng paglikha, habang hindi ipinipilit ang mas tiyak na posibleng diwang “binubuo” o “nananatiling magkakasama.”
- source_word: τῷ τοῦ θεοῦ λόγῳ
  choice: ayon sa salita ng Diyos
  rationale: Ang instrumental na datibo ay maaaring ipahayag sa Tagalog bilang bisa o batayan ng malikhaing salita ng Diyos. Pinananatili ng “salita ng Diyos” ang λόγος nang hindi ito nililimitahan sa “utos” o tahasang ginagawang titulo ng personal na Logos.
theological_decisions:
- issue: Kung ang λόγῳ ay dapat isaling tila tumutukoy sa personal na Logos
  choice: ayon sa salita ng Diyos
  alternative: sa utos ng Diyos
  rationale: Sa konteksto, tumutukoy ito sa mabisa at binigkas na salita ng Diyos sa paglikha, ngunit hindi tahasang ginagamit bilang titulo para sa Anak. Pinananatili ng salin ang teolohikal na lawak ng parirala nang hindi nagdaragdag ng espesipikong kristolohikal na pakahulugan.
- issue: Kung ang δι’ ὕδατος ay dapat unawain lamang bilang kasangkapan
  choice: sa pamamagitan ng tubig
  alternative: sa gitna ng tubig
  rationale: Karaniwang nagsasaad ang διά na may henitibo ng pamamagitan, ngunit mahirap at pinagtatalunan ang eksaktong kosmolohikal na larawan. Ang literal at natural na salin ay nagpapanatili ng tensiyon sa halip na ipaliwanag ito sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maramihang “mga langit,” ang pagkakaiba ng “mula sa” at “sa pamamagitan ng,” at ang hindi ganap na nalulutas na saklaw ng “salita ng Diyos.”
