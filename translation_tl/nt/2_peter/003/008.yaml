  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς, ἀγαπητοί, ὅτι μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη καὶ χίλια ἔτη ὡς ἡμέρα μία.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/008.yaml
  text: 'But do not let this one thing escape your notice[a], beloved: with the Lord one day is like a thousand years[c][b], and a thousand years like one day.'
translation:
  language: tl
  text: 'Ngunit huwag ninyong kaligtaan ang isang bagay na ito, mga minamahal: para sa Panginoon, ang isang araw ay tulad ng isang libong taon, at ang isang libong taon ay tulad ng isang araw.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Umaalingawngaw ito sa Awit 90:4.
    reason: cross_reference
  - marker: b
    text: Ang “tulad ng” ay nagpapahayag ng paghahambing, hindi ng literal na pagkakapantay ng isang araw at isang libong taon.
    reason: cultural_note
lexical_decisions:
- source_word: Ἓν δὲ τοῦτο
  choice: Ngunit ... ang isang bagay na ito
  rationale: Pinananatili ng “isang bagay na ito” ang diin ng Ἓν at ang pantukoy na lakas ng τοῦτο; ipinahihiwatig naman ng “Ngunit” ang transisyong δέ.
- source_word: μὴ λανθανέτω ὑμᾶς
  choice: huwag ninyong kaligtaan
  rationale: Natural itong utos sa modernong Tagalog para sa isang bagay na hindi dapat makalampas sa pansin. Hindi nito ipinapalagay na talagang wala silang kaalaman.
- source_word: ἀγαπητοί
  choice: mga minamahal
  rationale: Pinananatili nito ang magiliw at marangal na pagtawag sa kapuwa mananampalataya nang hindi nagiging masyadong kaswal.
- source_word: παρὰ κυρίῳ
  choice: para sa Panginoon
  rationale: Ipinapahayag nito ang pananaw o pagtataya ng Panginoon na maaaring taglayin ng παρά na may datibo, sa natural na Tagalog.
- source_word: μία ἡμέρα ... ὡς χίλια ἔτη
  choice: ang isang araw ay tulad ng isang libong taon
  rationale: Malinaw na itinatanghal ng “tulad ng” ang paghahambing na ipinahihiwatig ng ὡς, hindi ang literal na pagkakapantay.
- source_word: καὶ χίλια ἔτη ὡς ἡμέρα μία
  choice: at ang isang libong taon ay tulad ng isang araw
  rationale: Inuulit ang pandiwa sa Tagalog para sa malinaw at balanseng paralelismo ng dalawang sugnay.
theological_decisions:
- issue: Kalikasan ng paghahambing sa panahon
  choice: Isinalin bilang paghahambing tungkol sa pananaw ng Panginoon sa panahon.
  alternative: Ituring ang isang araw bilang literal na katumbas ng isang libong taon o bilang pormula sa pagkalkula ng propesiya.
  rationale: Dalawang ulit na ginamit ang ὡς (“tulad ng”), kaya analogiya ang pahayag at hindi literal na ekwasyon. Hindi dapat magpasok ang salin ng isang sistemang pangkronolohiya.
- issue: Saklaw ng παρὰ κυρίῳ
  choice: “para sa Panginoon”
  alternative: “sa piling ng Panginoon” o “sa paningin ng Panginoon”
  rationale: Maaaring magpahiwatig ang parirala ng presensiya o pananaw. Ang “para sa Panginoon” ay natural at pinananatili ang perspektibong diwa nang hindi lubusang isinasara ang saklaw nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “mga minamahal” upang mapanatili ang magiliw na tono, at ang simetrikong pag-uulit upang luminaw ang retorikal na balanse ng Griyego.
