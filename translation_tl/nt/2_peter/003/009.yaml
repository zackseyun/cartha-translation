id: 2PE.3.9
reference: 2 Peter 3:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐ βραδύνει ⸀κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ⸀ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/009.yaml
  text: The Lord is not slow concerning the promise[a], as some consider slowness, but is patient toward you[c][b], not wanting any to perish but all to come to repentance.
translation:
  language: tl
  text: Hindi mabagal ang Panginoon tungkol sa pangako[a], gaya ng itinuturing ng ilan na kabagalan, kundi matiyaga siyang makitungo sa inyo[b]. Ayaw niyang may sinumang mapahamak, kundi ang lahat ay magsisi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hinggil sa pangako.”
    reason: lexical_alternative
  - marker: b
    text: O “matiyaga siya sa inyo.”
    reason: lexical_alternative
  - marker: c
    text: Hindi tahasang nililinaw ng Griyego ang saklaw ng “sinuman” at “lahat.” Iba-iba ang pagkaunawa kung ang tinutukoy ni Pedro ay lalo na ang kaniyang mga mambabasa o, sa mas malawak na diwa, ang sangkatauhan.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: ang Panginoon
  rationale: Likas at nakaugaliang salin sa Filipino para sa banal o kristolohikal na titulong κύριος.
- source_word: οὐ βραδύνει ... τῆς ἐπαγγελίας
  choice: Hindi mabagal ... tungkol sa pangako
  rationale: Pinananatili ang konsepto ng kabagalan at ang kaugnayan nito sa pangako nang hindi idinaragdag ang tahasang 'pagtupad,' na ipinahihiwatig lamang.
- source_word: ὥς τινες βραδύτητα ἡγοῦνται
  choice: gaya ng palagay ng ilan na ito ay kabagalan
  rationale: Inilalahad ang kahulugan ng ἡγέομαι bilang pag-aakala o pagturing at pinananatili ang pag-uulit ng ideya ng βραδύτης.
- source_word: μακροθυμεῖ
  choice: matiyaga siya
  rationale: Natural at malinaw na Filipino para sa matagal na pagtitimpi at pagtitiis.
- source_word: εἰς ὑμᾶς
  choice: sa inyo
  rationale: Natural na salin sa Filipino ng saloobin o pagkilos na nakatuon sa mga kausap; maaari ring unawaing 'matiyaga sa pakikitungo sa inyo.'
- source_word: μὴ βουλόμενός
  choice: Ayaw niyang
  rationale: Direkta at natural na nagpapahayag ng hangarin o kalooban nang hindi ipinapasok ang teknikal na teolohikal na pagkakategorya.
- source_word: τινας ἀπολέσθαι
  choice: may sinumang mapahamak
  rationale: Ang 'mapahamak' ay angkop at mabigat na katumbas ng intransitibong ἀπολέσθαι sa kontekstong ito.
- source_word: πάντας
  choice: ang lahat
  rationale: Pinananatili ang maikli at malawak na pananalita ng Griyego, kaagapay ng 'may sinuman.'
- source_word: εἰς μετάνοιαν χωρῆσαι
  choice: magsisi
  rationale: Natural na Filipino para sa pagdating o pagpasok sa pagsisisi; iniiwasan ang alanganing literal na spatial na pahayag.
theological_decisions:
- issue: Saklaw ng 'inyo,' 'sinuman,' at 'lahat' kaugnay ng pagtitiis ng Diyos at kaligtasan
  choice: 'Pinanatili ang mga reperente ayon sa pagkakasabi ng Griyego: ''sa inyo ... may sinuman ... ang lahat.'''
  alternative: Limitahan ang 'sinuman' at 'lahat' sa mga mananampalataya o mga hinirang; o tahasang palawakin ang mga ito sa buong sangkatauhan.
  rationale: Hindi tahasang nililinaw ng talata ang pinagtatalunang saklaw, kaya hindi ito nilimitahan o pinalawak ng salin.
- issue: Lakas ng βουλόμενός bilang pagpapahayag ng kalooban ng Diyos
  choice: Ayaw niyang
  alternative: Hindi niya itinatalaga; hindi niya nilalayong
  rationale: Ipinapahayag nito ang hangarin o kalooban nang hindi nag-aangkat ng mas teknikal na pagkakaiba sa mga uri ng banal na kalooban.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang retorikal na ugnayan ng 'mabagal' at 'kabagalan' at iniwasang lutasin sa salin ang teolohikal na ambiguwidad ng mga reperente.
