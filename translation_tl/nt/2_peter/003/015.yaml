base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/015.yaml
  text: And regard the patience of our Lord as salvation[a], just as our beloved brother Paul also wrote to you according to the wisdom given to him[b],
translation:
  language: tl
  text: At ituring ninyong kaligtasan ang pagpapahinuhod ng ating Panginoon[a], kung paanong sumulat din sa inyo ang minamahal nating kapatid na si Pablo ayon sa karunungang ibinigay sa kanya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagiging matiisin.” Ang diwa ay na ang pagpapaliban ng Panginoon ay para sa kaligtasan, hindi dahil sa kawalang-malasakit.
    reason: lexical_alternative
  - marker: b
    text: Malamang na ipinahihiwatig na ang karunungang ito ay ibinigay ng Diyos, bagaman hindi tahasang sinasabi sa Griyego kung sino ang nagbigay.
    reason: alternative_reading
lexical_decisions:
- source_word: μακροθυμίαν
  choice: pagtitiis
  rationale: Tumutukoy ito sa matiyagang pagpipigil at hindi agad na paghatol ng Panginoon. Natural sa modernong Tagalog ang “pagtitiis” at angkop ito sa konteksto ng tila pagkaantala ng kanyang pagdating.
- source_word: σωτηρίαν
  choice: kaligtasan
  rationale: Pinananatili nito ang tuwirang predikasyon ng Griyego at ang bigat ng pagliligtas ng Diyos sa kontekstong eskatolohikal.
- source_word: ἡγεῖσθε
  choice: ituring ... bilang
  rationale: Malinaw at likas nitong ipinapahayag ang utos na kilalanin o ipalagay ang isang bagay sa isang tiyak na paraan.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ng ating Panginoon
  rationale: Pinananatili ang titulong κύριος at ang kaugnayang ipinahahayag ng “ating.”
- source_word: ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος
  choice: ang minamahal nating kapatid na si Pablo
  rationale: Natural na ayos sa Tagalog na nagpapanatili sa init at pagmamahal ng paglalarawan kay Pablo.
- source_word: κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν
  choice: ayon sa karunungang ibinigay sa kanya
  rationale: Ang κατά ay nagsasaad ng pagsang-ayon o pag-ayon sa pamantayan. Pinananatili ng balintiyak na “ibinigay” na hindi tahasang binabanggit ng Griyego kung sino ang nagbigay.
- source_word: ἔγραψεν ὑμῖν
  choice: sumulat ... sa inyo
  rationale: Ang payak na nagdaang anyo ay malapit sa aorist at natural sa Tagalog.
- source_word: καθὼς καὶ
  choice: kung paanong ... din
  rationale: Pinananatili ang paghahambing at ang dagdag na diwa ng καί.
theological_decisions:
- issue: Ang pinagmulan ng karunungang ibinigay kay Pablo
  choice: Panatilihin ang balintiyak na “ibinigay sa kanya” nang hindi tahasang idinaragdag ang “ng Diyos.”
  alternative: ayon sa karunungang ibinigay sa kanya ng Diyos
  rationale: Malamang na Diyos ang ipinahihiwatig na nagbigay, ngunit hindi tahasang sinasabi ng Griyego ang gumaganap; pinananatili ng salin ang ganitong di-tahasang pahayag.
- issue: Ang kabuluhan ng tila pagkaantala ng Panginoon
  choice: “pagtitiis ... bilang kaligtasan”
  alternative: “pagpapahinuhod ... bilang pagkakataon para sa kaligtasan”
  rationale: Tuwirang iniuugnay ng teksto ang pagtitiis ng Panginoon sa kaligtasan. Hindi ito pinalalawak sa “pagkakataon para” upang hindi humigit sa sinabi ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “ituring ... bilang” para sa malinaw na predikasyon, “minamahal nating kapatid” para sa likas at magiliw na tono, at pinanatili ang kuwit sa hulihan dahil bahagi ang talata ng nagpapatuloy na pangungusap sa susunod na bersikulo.
