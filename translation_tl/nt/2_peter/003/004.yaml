  text: καὶ λέγοντες· Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ; ἀφ’ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν, πάντα οὕτως διαμένει ἀπ’ ἀρχῆς κτίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/004.yaml
  text: and saying[a], “Where is the promise of his coming? For ever since the fathers fell asleep[b], all things continue just as they have from the beginning of creation.”
translation:
  language: tl
  text: at nagsasabi, “Nasaan ang pangako ng kanyang pagparito[a]? Sapagkat mula nang mahimlay ang mga ninuno[b], nananatiling gayon ang lahat ng bagay mula pa sa pasimula ng paglikha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagdating” o “presensiya” para sa παρουσία. Sa kontekstong ito, tumutukoy ito sa inaasahang pagbabalik ni Cristo.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego ay gumagamit ng “pagtulog” bilang eupemismo para sa kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: at nagsasabi
  rationale: Pinananatili ang daloy ng kasalukuyang participle na kaugnay ng paglalarawan sa mga manunuya sa naunang talata.
- source_word: ἐπαγγελία
  choice: ipinangako
  rationale: Sa tanong na “Nasaan na ang ipinangakong pagparito niya?” likas sa modernong Tagalog ang anyong ito at malinaw na tumutukoy sa pangakong matutupad, nang hindi dinaragdagan ang diwa.
- source_word: παρουσίας
  choice: pagparito
  rationale: Sa kontekstong eskatolohikal, tumutukoy ito sa inaasahang pagdating ni Cristo; ang “pagparito” ay malinaw at marangal, samantalang pinananatili sa talababa ang mga leksikal na alternatibo.
- source_word: ἀφ’ ἧς
  choice: mula nang
  rationale: Likas na Tagalog para sa panahong lumipas mula sa isang pangyayari sa nakaraan.
- source_word: οἱ πατέρες
  choice: mga ninuno
  rationale: Walang panghalip na paari sa Griyego. Ang “mga ninuno” ay natural sa Tagalog at hindi nagdaragdag ng “ating.”
- source_word: ἐκοιμήθησαν
  choice: matulog sa kamatayan
  rationale: Pinananatili ang talinghaga ng pagtulog ngunit nililinaw sa natural na Tagalog na kamatayan ang tinutukoy.
- source_word: πάντα
  choice: ang lahat ng bagay
  rationale: Tapat sa malawak at pangkalahatang saklaw ng neuter plural.
- source_word: οὕτως διαμένει
  choice: nananatiling gayon
  rationale: Ipinahahayag ang pag-angkin ng mga manunuya na walang nagbabago at patuloy ang dating kalagayan.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: mula pa sa pasimula ng paglikha
  rationale: Malapit sa kayarian ng Griyego at malinaw na tumutukoy sa simula ng nilikhang kaayusan.
theological_decisions:
- issue: Kahulugan ng παρουσία sa eskatolohikal na konteksto
  choice: pagparito niya
  alternative: presensiya niya; pagdating niya
  rationale: Ang konteksto ay tungkol sa inaasahang pagbabalik ni Cristo. Malinaw ito sa “pagparito,” habang kinikilala sa talababa ang saklaw na “presensiya” o “pagdating.”
- issue: Paglalarawan ng kamatayan sa ἐκοιμήθησαν
  choice: matulog sa kamatayan
  alternative: mamatay; mahimlay
  rationale: Pinananatili nito ang talinghaga ng Griyego at kasabay na nililinaw ang kahulugan, nang hindi ginagawang tahasang pahayag tungkol sa kalagayan ng mga patay.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “Nasaan na” upang natural na maipahiwatig ang mapanuyang tanong tungkol sa tila pagkaantala, at pinanatili ang ugnayan ng talata sa naunang pangungusap sa pamamagitan ng “at nagsasabi.”
