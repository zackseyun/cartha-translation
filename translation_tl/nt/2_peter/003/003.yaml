base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/003.yaml
  text: 'knowing this first: that in the last days scoffers will come with scoffing[a], walking according to their own desires[b],'
translation:
  language: tl
  text: 'Una sa lahat, dapat ninyong malaman ito: sa mga huling araw ay darating ang mga manunuya na nanunuya[a] at namumuhay ayon sa sarili nilang mga pagnanasa.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “darating ang mga mangungutya na may panunuya.” Magkaugnay ang mga salitang Griyego para sa “mga manunuya” at “nanunuya,” kaya mariin ang pag-uulit.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga pagnanasa” ay maaari ding isaling “mga pita.” Ang salitang Griyego ay maaaring tumukoy sa matitinding pagnanasa sa mas malawak na diwa, hindi lamang sa pagnanasang seksuwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: Una sa lahat, dapat ninyong malaman ito
  rationale: Ginawang natural na tuwirang pahayag sa Tagalog ang pangmaramihang participle. Napananatili ng “una sa lahat” ang diin ng πρῶτον, at ng “dapat ninyong malaman” ang babalang nakatuon sa mga mambabasa nang hindi binabago ang diwa.
- source_word: ἐλεύσονται
  choice: darating
  rationale: Tuwiran at likas na katumbas ng panghinaharap na anyo ng ἔρχομαι.
- source_word: ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: sa mga huling araw
  rationale: Likas na salin ng karaniwang pahayag na tumutukoy sa panahong pangwakas, nang hindi ito ikinukulong sa isang partikular na sistemang eskatolohikal.
- source_word: ἐν ἐμπαιγμονῇ ἐμπαῖκται
  choice: mga manunuya na nanunuya
  rationale: Inuulit ang ugat na “tuya” upang maipakita ang mariing paggamit sa Griyego ng magkaugnay na mga salitang ἐμπαιγμονῇ at ἐμπαῖκται, habang nananatiling malinaw sa modernong Tagalog.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν
  choice: ayon sa sarili nilang mga pagnanasa
  rationale: Napananatili ang diin sa “sarili nilang” at ang malawak na saklaw ng ἐπιθυμίαι bilang matitinding pagnanasa, hindi lamang seksuwal na pita.
- source_word: πορευόμενοι
  choice: namumuhay
  rationale: Sa konteksto, ang participle ay tumutukoy sa paraan ng pamumuhay o asal. Mas malinaw sa karaniwang Tagalog ang “namumuhay” kaysa literal na “lumalakad.”
theological_decisions:
- issue: Saklaw ng pariralang ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: sa mga huling araw
  alternative: sa wakas ng mga araw
  rationale: Pinananatili ang karaniwang eskatolohikal na pahayag at ang babala ng talata nang hindi nagtatakda ng partikular na kronolohiya o denominasyonal na pananaw tungkol sa mga huling araw.
- issue: Moral na saklaw ng ἐπιθυμίαι
  choice: mga pagnanasa
  alternative: mga pita
  rationale: Ang salita ay may negatibong moral na puwersa sa konteksto ngunit maaaring tumukoy sa iba’t ibang makasariling pagnanasa, kaya hindi ito nilimitahan sa seksuwal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang mariing pag-uulit ng magkaugnay na salitang Griyego sa pamamagitan ng “mga manunuya na nanunuya,” at ginamit ang “namumuhay” upang likas na maipahayag ang metapora ng asal o paraan ng buhay.
