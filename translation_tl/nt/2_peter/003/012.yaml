  text: προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας, δι’ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/012.yaml
  text: as you wait for and hasten the coming of the day of God[a], because of which the heavens, being set on fire, will be dissolved, and the elements, burning[b], will melt.
translation:
  language: tl
  text: habang hinihintay ninyo at pinabibilis ang pagdating ng araw ng Diyos[a], dahil sa araw na iyon ay magliliyab at mawawasak ang kalangitan, at ang mga elemento[b], na naglalagablab, ay matutunaw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “habang sabik ninyong hinihintay ang pagdating ng araw ng Diyos.” Ang pandiwang Griyego ay maaaring mangahulugang “pabilisin” o “sabik na hintayin.”
    reason: alternative_reading
  - marker: b
    text: Ang “mga elemento” ay maaaring tumukoy sa mga pangunahing sangkap ng kosmos o, marahil, sa mga katawang makalangit.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδοκῶντας
  choice: hinihintay
  rationale: Likas na salin sa modernong Tagalog para sa patuloy at may-pananabik na paghihintay na ipinahihiwatig ng participle.
- source_word: σπεύδοντας
  choice: pinabibilis
  rationale: Pinananatili ang tuwirang diwang maaaring aktibong mapabilis ang pagdating; inilalahad sa talababa ang alternatibong kahulugang sabik na paghihintay.
- source_word: παρουσίαν
  choice: pagdating
  rationale: Sa kontekstong eskatolohikal, malinaw at natural ang “pagdating,” bagaman maaari ring tumukoy ang salita sa pagkanaririto.
- source_word: τῆς τοῦ θεοῦ ἡμέρας
  choice: araw ng Diyos
  rationale: Pinananatili ang di-karaniwang parirala at hindi ito ipinapalit sa mas karaniwang “araw ng Panginoon.”
- source_word: δι’ ἣν
  choice: Dahil sa araw na iyon
  rationale: Ang διά na may accusative ay nagpapahayag ng sanhi; inuulit ang “araw” upang maging malinaw at natural sa Tagalog.
- source_word: οὐρανοὶ
  choice: kalangitan
  rationale: Ang kolektibong “kalangitan” ay natural sa Tagalog at naaangkop sa kosmikong konteksto ng maramihang οὐρανοί.
- source_word: πυρούμενοι
  choice: magliliyab
  rationale: Ipinahahayag nang natural ang pagkapailalim ng kalangitan sa apoy, bagaman hindi tahasang napapanatili ang passive na anyo.
- source_word: λυθήσονται
  choice: mawawasak
  rationale: Ipinahihiwatig ang pagkakalas o pagkawatak-watak ng kaayusan, hindi kinakailangang ganap na pagkalipol; mas madaling maunawaan kaysa sa teknikal na “malulusaw” para sa kalangitan.
- source_word: στοιχεῖα
  choice: mga sangkap ng sanlibutan
  rationale: Pinananatili ang malawak na diwa ng mga pangunahing bahagi ng kosmos habang iniiwasang ipako ang kahulugan sa mga bagay sa langit; nililinaw sa talababa ang tunay na ambiguwidad.
- source_word: καυσούμενα
  choice: sa matinding init
  rationale: Natural na isinasaad sa Tagalog ang kalagayan o paraang nagdudulot ng pagkatunaw nang hindi inuulit nang alanganin ang “nasusunog.”
- source_word: τήκεται
  choice: matutunaw
  rationale: Tumpak na ipinahahayag ang pagkatunaw dahil sa init; ginagamit ang panghinaharap upang umayon sa malinaw na temporal na balangkas ng pangungusap.
theological_decisions:
- issue: Kahulugan ng σπεύδοντας τὴν παρουσίαν
  choice: pinabibilis ang pagdating
  alternative: sabik na hinihintay ang pagdating
  rationale: Maaaring mangahulugan ang pandiwa ng aktibong pagpapabilis o ng masigasig na paghihintay. Pinananatili sa pangunahing teksto ang tuwirang object-taking na pagbasa at inilalagay sa talababa ang alternatibo upang huwag alisin ang teolohikal na tensiyon.
- issue: Tinutukoy ng στοιχεῖα
  choice: mga sangkap ng sanlibutan
  alternative: mga bagay sa kalangitan
  rationale: Pinipili ang malawak at hindi labis na interpretatibong salin; hindi tiyak kung ang tinutukoy ay mga pangunahing sangkap ng daigdig o kosmos, o mga katawang makalangit.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “ninyo” bilang maramihang kausap at pinanatili ang kosmiko at apokaliptikong tono. Ang dalawang tunay na ambiguwidad sa Griyego ay minarkahan sa pangunahing teksto at ipinaliwanag sa mga talababa.
