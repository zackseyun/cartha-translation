  terminology: Ang “araw ng Diyos” at “pagdating” ay angkop at dapat panatilihin. Ginamit ang “mga elemento” para sa στοιχεῖα upang huwag magpasok ng hindi tahasang “sanlibutan”; ang mga posibleng referent ay nananatili sa talababa.
