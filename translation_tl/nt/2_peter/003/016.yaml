id: 2PE.3.16
reference: 2 Peter 3:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν πάσαις ⸀ταῖς ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν ⸀αἷς ἐστιν δυσνόητά τινα, ἃ οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/016.yaml
  text: as also in all his letters[a], speaking in them about these things. In them are some things hard to understand, which the ignorant and unstable twist, as they do the rest of the Scriptures[c][b], to their own destruction.
translation:
  language: tl
  text: Gayon din sa lahat ng kanyang mga liham, nagsasalita siya sa mga ito tungkol sa mga bagay na ito. May ilang bagay sa mga liham na iyon na mahirap unawain. Binabaluktot ng mga walang kaalaman at hindi matatag ang mga ito, gaya rin ng ginagawa nila sa iba pang mga Kasulatan, sa sarili nilang kapahamakan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστολαῖς
  choice: mga liham
  rationale: Karaniwan at likas na katawagan sa makabagong Filipino para sa nakasulat na pakikipagtalastasan; mas madaling maunawaan kaysa sa tradisyonal na “mga epistola.”
- source_word: λαλῶν
  choice: nagsasalita
  rationale: Pinananatili ang literal na diwa ng pandiwa, habang malinaw sa konteksto na sa pamamagitan ng kanyang mga liham nagsasalita si Pablo.
- source_word: περὶ τούτων
  choice: tungkol sa mga bagay na ito
  rationale: Tuwirang pinananatili ang pagtukoy sa mga paksang nabanggit sa naunang konteksto.
- source_word: δυσνόητά τινα
  choice: may ilang bagay ... na mahirap unawain
  rationale: Likas sa Filipino at pinananatili kapwa ang pagiging di-tiyak ng τινα at ang kahulugan ng δυσνόητα.
- source_word: ἀμαθεῖς
  choice: mga walang kaalaman
  rationale: Ipinahahayag ang kakulangan sa kaalaman o pagtuturo nang hindi ipinapalagay na hindi sila marunong bumasa o walang pormal na pinag-aralan.
- source_word: ἀστήρικτοι
  choice: hindi matatag
  rationale: Inilalarawan ang mga taong hindi matibay o hindi matatag sa pagkaunawa at paninindigan, alinsunod sa gamit ng salita sa konteksto.
- source_word: στρεβλοῦσιν
  choice: binabaluktot
  rationale: Matingkad at natural na salitang Filipino na nagpapanatili sa larawan ng pagpilipit o pagpapalihis sa tunay na anyo o kahulugan.
- source_word: τὰς λοιπὰς γραφὰς
  choice: iba pang mga Kasulatan
  rationale: Ang γραφαί ay tumutukoy sa mga sagradong Kasulatan, at ang λοιπάς ay maaaring mangahulugang “iba pa” o “natitira.” Pinananatili ng salin ang paghahambing sa ibang mga kasulatang kabilang sa kategoryang ito.
- source_word: ἀπώλειαν
  choice: kapahamakan
  rationale: Malinaw at mabigat na katumbas sa Filipino na hindi nagdaragdag ng mas teknikal na doktrinal na kahulugan kaysa sa nasa teksto.
theological_decisions:
- issue: Pahiwatig ng katayuan bilang Kasulatan sa τὰς λοιπὰς γραφὰς
  choice: iba pang mga Kasulatan
  alternative: iba pang mga sulatin
  rationale: Sa Bagong Tipan, ang pangmaramihang γραφαί ay karaniwang tumutukoy sa mga sagradong Kasulatan. Ang λοιπάς ay likas na naghahambing sa mga liham ni Pablo sa iba pang kabilang sa kategoryang iyon. Hindi ito pinapahina tungo sa pangkalahatang “mga sulatin,” ngunit wala ring idinaragdag na doktrinal na pahayag na lampas sa mismong Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga liham” sa halip na “mga epistola,” at “Kasulatan” para sa kinikilalang sagradong mga sulatin. Pinanatili ang bahagyang pahabang panimulang “Gaya rin,” sapagkat ang talata ay pagpapatuloy ng naunang pangungusap.
