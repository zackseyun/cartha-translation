  to: Gayon din sa lahat ng kanyang mga liham, nagsasalita siya sa mga ito tungkol sa mga bagay na ito. May ilang bagay sa mga liham na iyon na mahirap unawain. Binabaluktot ng mga walang kaalaman at hindi matatag ang mga ito, gaya rin ng ginagawa nila sa iba pang mga Kasulatan, sa sarili nilang kapahamakan.
  rationale: Inayos ang pagtukoy ng mga panghalip upang maging malinaw na ang δυσνόητά τινα ay mga bagay na nasa mga liham. Pinalitan ang sobrang interpretatibong alternatibo sa talababa c ng malapit na lexical na katumbas. Pinanatili ang “iba pang mga Kasulatan” upang hindi pasimplehin ang γραφαί bilang pangkaraniwang mga sulatin at upang hindi piliting pumili sa saklaw ng λοιπάς na “iba pa” o “natitira.”
