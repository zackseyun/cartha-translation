  source_fidelity: Tumpak na naipapahayag ang banayad na pagsalungat ng δέ, ang patuloy na pag-asang nasa προσδοκῶμεν, at ang kosmikong saklaw ng «mga bagong langit at isang bagong lupa.» Ang «ayon sa kanyang pangako» ay wasto para sa κατὰ τὸ ἐπάγγελμα αὐτοῦ. Ang «kung saan» ay likas na kolektibong pagtukoy sa bagong sangnilikha at hindi nagpapataw ng maling bilang sa Tagalog.
  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang «nananahan ang katuwiran» ay may angkop na marangal na rehistro at ipinahihiwatig ang matatag na paninirahan ng κατοικεῖ nang hindi nagiging lipas.
  terminology: Ang «katuwiran» ay angkop na pangunahing salin ng δικαιοσύνη sa talatang ito, sapagkat pinananatili nito ang mas malawak na biblikal na saklaw kaysa sa katarungang panlipunan lamang. Ang talababa na «O “katarungan.”» ay sapat na nag-iingat sa leksikal na alternatibo. Ang «mga bagong langit» at «bagong lupa» ay wasto at pinananatili ang alusyong kosmiko ng teksto.
