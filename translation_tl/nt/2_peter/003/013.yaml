id: 2PE.3.13
reference: 2 Peter 3:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν, ἐν οἷς δικαιοσύνη κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/013.yaml
  text: But according to his promise[a], we are waiting for new heavens and a new earth, in which righteousness dwells.
translation:
  language: tl
  text: Ngunit ayon sa kanyang pangako, hinihintay natin ang mga bagong langit at isang bagong lupa, kung saan nananahan ang katuwiran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καινοὺς ... οὐρανοὺς / γῆν καινὴν
  choice: mga bagong langit at isang bagong lupa
  rationale: Pinananatili nito ang malawak at kosmikong pananalita ng Kasulatan at ang alusyon sa Isaias 65:17; 66:22. Hindi ginamit ang “mga bagong kalangitan” dahil mas natural sa karaniwang modernong Filipino ang “mga bagong langit,” at hindi rin ginamit ang “binagong” sapagkat higit iyong nagpapakahulugan kaysa sa mismong καινός.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahahayag nito ang banayad na pagsalungat sa pagkawasak na binanggit sa naunang talata.
- source_word: κατὰ τὸ ἐπάγγελμα αὐτοῦ
  choice: ayon sa kanyang pangako
  rationale: Tumpak nitong ipinapahayag ang pagsang-ayon o pagkakaayon sa ipinangako ng Diyos, habang nananatiling likas sa Filipino.
- source_word: προσδοκῶμεν
  choice: hinihintay natin
  rationale: Ipinakikita ng aspektong pangkasalukuyan ang patuloy at may-pag-asang paghihintay.
- source_word: ἐν οἷς
  choice: kung saan
  rationale: Natural itong tumutukoy sa pinagsamang bagong sangnilikha—mga bagong langit at bagong lupa—nang hindi pinipilit ang di-likas na literal na anyo sa Filipino.
- source_word: δικαιοσύνη
  choice: katuwiran
  rationale: Pinananatili ng “katuwiran” ang malawak na biblikal na diwa ng pagiging matuwid at ng kaayusang naaayon sa Diyos; inilalagay sa talababa ang “katarungan” bilang tunay na alternatibong himig.
- source_word: κατοικεῖ
  choice: nananahan
  rationale: Ipinahahayag nito ang matatag at palagiang paninirahan, at angkop ang marangal ngunit nauunawaang rehistro.
theological_decisions:
- issue: Pagbibigay-kahulugan sa δικαιοσύνη sa kontekstong eskatolohikal
  choice: katuwiran
  alternative: katarungan
  rationale: Mas malawak ang “katuwiran” at nasasaklaw nito ang kalagayang tama sa harap ng Diyos at ang matuwid na kaayusan ng bagong sangnilikha. Gayunman, tunay na taglay ng salita ang diwa ng “katarungan,” kaya pinanatili iyon sa talababa sa halip na tahimik na alisin.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang biblikal-kosmikong pariralang “mga bagong langit at isang bagong lupa” at iniwasan ang labis na pagpapakahulugang “binagong” o “pinanibagong.”
