id: 2PE.2.16
reference: 2 Peter 2:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔλεγξιν δὲ ἔσχεν ἰδίας παρανομίας· ὑποζύγιον ἄφωνον ἐν ἀνθρώπου φωνῇ φθεγξάμενον ἐκώλυσεν τὴν τοῦ προφήτου παραφρονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/016.yaml
  text: 'But he received a rebuke for his own transgression: a mute beast of burden[a], speaking with a human voice[b], restrained the prophet’s madness.'
translation:
  language: tl
  text: 'Ngunit nakatanggap siya ng pagsaway dahil sa sarili niyang paglabag: isang hayop na pambuhat[a] na hindi nakapagsasalita, ngunit nagsalita sa tinig ng tao[b], ang pumigil sa kabaliwan ng propeta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hayop na pambuhat.” Ang tinutukoy ay ang asno ni Balaam (Bil. 22:28–30).
    reason: cross_reference
  - marker: b
    text: O “sa tinig ng isang tao.” Inihahambing ng Griyego ang tinig ng tao sa hayop na hindi nakapagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξιν
  choice: sinaway
  rationale: Ipinahahayag ng ἔλεγξις ang pagsaway o matinding pagtutuwid. Natural sa Tagalog ang pandiwang ayos na “sinaway siya” para sa ἔλεγξιν ... ἔσχεν.
- source_word: ἰδίας παρανομίας
  choice: sarili niyang paglabag
  rationale: Ang παρανομία ay paglabag o asal na salungat sa batas, at pinananatili ng “sarili niyang” ang diin ng ἰδίας sa personal niyang pananagutan.
- source_word: ὑποζύγιον
  choice: hayop na tagapasan
  rationale: Tumutukoy ito sa hayop na pinapasan o ipinapasok sa pamatok. Hindi ito tinukoy ng Griyego bilang asno, kaya pinanatili ang mas malawak na katawagan.
- source_word: ἄφωνον
  choice: hindi nakapagsasalita
  rationale: Ang ἄφωνος ay walang tinig o pananalita. Malinaw at natural ang pariralang ito at itinatampok ang kabalintunaan ng sumunod na pagsasalita ng hayop.
- source_word: ἐν ἀνθρώπου φωνῇ
  choice: sa tinig ng tao
  rationale: Ipinakikita ng parirala ang paraan ng pagsasalita at inihahambing ang tinig ng tao sa hayop; hindi kasarian ng nagsasalita ang punto.
- source_word: φθεγξάμενον
  choice: nagsalita
  rationale: Tumutukoy ang pandiwari sa maliwanag at makabuluhang pagbigkas, kaya higit na angkop ang “nagsalita” kaysa simpleng paglikha ng tunog.
- source_word: ἐκώλυσεν
  choice: pinigil
  rationale: Ang κωλύω ay humadlang o pumigil. Direktang ipinahahayag ng “pinigil” ang pagpapaawat sa di-makatwirang ginagawa ng propeta.
- source_word: παραφρονίαν
  choice: kabaliwan
  rationale: Malakas ang παραφρονία at tumutukoy sa pagkilos na wala sa katwiran; pinananatili ng “kabaliwan” ang lakas nito kaysa sa mas mahinang “kahangalan.”
- source_word: τοῦ προφήτου
  choice: ng propeta
  rationale: Pinananatili nito ang tahasang katawagan ng Griyego kay Balaam bilang propeta nang hindi ipinahihiwatig na sinasang-ayunan ang kanyang asal.
theological_decisions:
- issue: Kung dapat tukuyin ang ὑποζύγιον bilang “asno” batay sa salaysay tungkol kay Balaam
  choice: Panatilihin sa pangunahing teksto ang mas malawak na “hayop na tagapasan.”
  alternative: asno
  rationale: Malinaw na asno ni Balaam sa Bilang 22 ang tinutukoy, ngunit pangkalahatang katawagan ang ginamit mismo ng Griyegong teksto. Ang tiyak na pagkakakilanlan ay inilagay sa talababa.
- issue: Pagpapakahulugan sa ἀνθρώπου sa pariralang ἐν ἀνθρώπου φωνῇ
  choice: tao
  alternative: lalaki
  rationale: Ang paghahambing ay sa tinig ng tao at kawalan ng pananalita ng hayop, hindi sa tinig ng lalaki at babae.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang natural na pandiwang ayos habang pinananatili ang matinding kabalintunaan ng isang hayop na hindi nakapagsasalita ngunit nagsalita upang pigilin ang propeta.
