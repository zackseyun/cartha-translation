  language: en
  yaml_path: translation/nt/2_peter/002/013.yaml
  text: suffering the wages of unrighteousness[a], considering daytime indulgence a pleasure. They are stains and blemishes, reveling in their deceptions while feasting with you[b],
translation:
  language: tl
  text: Dinaranas nila ang kabayaran ng kalikuan[a]. Itinuturing nilang kasiyahan ang magpakasasa kahit araw. Mga dungis at kapintasan sila, na nagpapakasasa sa kanilang mga panlilinlang[b] habang nakikisalo sa inyo.
