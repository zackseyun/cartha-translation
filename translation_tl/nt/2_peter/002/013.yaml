  footnotes:
  - marker: a
    text: Maaari ring isalin na “gantimpala sa paggawa ng masama.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa ilang manuskrito, “mga salu-salo ng pag-ibig” sa halip na “mga panlilinlang”: “nagpapakasasa sa kanilang mga salu-salo ng pag-ibig habang nakikisalo sa inyo.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἀδικούμενοι
  choice: Dinaranas nila
  rationale: Ipinahahayag ng anyong balintiyak na sumasapit sa kanila ang masamang bunga ng kanilang gawain. Iniiwasan nitong ipakahulugang biktima lamang sila ng kawalang-katarungan.
- source_word: μισθὸν ἀδικίας
  choice: ang kabayaran ng kalikuan
  rationale: Pinananatili ng “kabayaran” ang diwa ng μισθός bilang suweldo o ganting natatanggap, at ng “kalikuan” ang moral na bigat ng ἀδικία nang hindi nililimitahan ito sa isang uri lamang ng maling gawa.
- source_word: ἡδονὴν ἡγούμενοι
  choice: Itinuturing nilang kasiyahan
  rationale: Likas sa modernong Tagalog ang pariralang ito at tumpak na inilalahad ang paghatol o pagpapalagay na nasa ἡγούμενοι at ang kasiyahang nasa ἡδονή.
- source_word: τὴν ἐν ἡμέρᾳ τρυφήν
  choice: ang magpakasasa sa araw
  rationale: Inilalarawan ng “magpakasasa” ang marangya at labis na pagpapalayaw sa sarili, habang pinananatili ng “sa araw” ang tahasang pagtukoy sa oras at ang pahiwatig ng kawalang-hiyaan.
- source_word: σπίλοι καὶ μῶμοι
  choice: Mga batik at dungis
  rationale: Pinananatili ng pares ang larawan ng karumihan at kapintasan sa moral sa paraang maikli at madaling maunawaan sa Tagalog.
- source_word: ἐντρυφῶντες
  choice: nagpapakasasa
  rationale: Ipinagpapatuloy nito ang tema ng labis at mapagpalayaw na kasiyahan at natural na naiuugnay sa bagay na kanilang pinagpapakasasaan.
- source_word: ἀπάταις αὐτῶν
  choice: sa kanilang mga panlilinlang
  rationale: Sinusunod nito ang ἀπάταις ng SBLGNT at malinaw na inilalarawan ang mapanlinlang na asal ng mga huwad na guro.
- source_word: συνευωχούμενοι ὑμῖν
  choice: habang nakikisalo sa inyo
  rationale: Ipinahahayag ng “nakikisalo” ang sama-samang pagkain o pagpipiging nang hindi nagpapalagay kung anong partikular na uri ng pagtitipon iyon; pinananatili ng “habang” ang magkasabay na kilos.
theological_decisions:
- issue: Pagkakaiba ng mga manuskrito sa ἀπάταις / ἀγάπαις
  choice: “kanilang mga panlilinlang” sa pangunahing teksto
  alternative: “kanilang mga salu-salo ng pag-ibig”
  rationale: ἀπάταις ang mababasa sa ibinigay na SBLGNT at umaangkop ito sa konteksto ng pandaraya. Gayunman, makabuluhan ang variant na ἀγάπαις at maaaring tumukoy sa mga salu-salo ng pag-ibig ng mga mananampalataya, kaya inilalahad ito sa talababa.
- issue: Diwa ng μισθὸν ἀδικίας
  choice: “kabayaran ng kalikuan”
  alternative: “gantimpala sa paggawa ng masama”
  rationale: Pinananatili ng pangunahing salin ang matalinghagang ugnayan ng maling gawa at ng kabayarang tinatanggap dahil dito, nang hindi tahasang nilulutas kung ang genitive ay naglalarawan ng uri ng kabayaran o ng dahilan nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “kalikuan” upang mapanatili ang moral at biblikal na bigat ng ἀδικία, ngunit iniwasan ang labis na teknikal na pananalita. Ang “nakikisalo” ay sadyang hindi nagtatakda kung ordinaryong handaan o isang natatanging pagtitipon ng iglesya ang tinutukoy.
