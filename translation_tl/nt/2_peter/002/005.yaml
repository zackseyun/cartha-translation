  text: καὶ ἀρχαίου κόσμου οὐκ ἐφείσατο, ἀλλὰ ὄγδοον Νῶε δικαιοσύνης κήρυκα ἐφύλαξεν, κατακλυσμὸν κόσμῳ ἀσεβῶν ἐπάξας,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/005.yaml
  text: and if he did not spare the ancient world[a], but preserved Noah, an eighth person, a herald of righteousness, when he brought a flood upon a world of the ungodly[c][b],
translation:
  language: tl
  text: at hindi rin niya pinatawad ang sinaunang sanlibutan, kundi iningatan niya si Noe, ang ikawalo[a], na tagapagpahayag[b] ng katuwiran[c], nang magpasapit siya ng baha sa sanlibutan ng mga di-makadiyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “si Noe, isa sa walo.” Siksik ang pananalitang Griyego at maaaring mangahulugang iningatan si Noe kasama ng pito pang iba.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tagapangaral”; ang pangngalan ay tumutukoy sa isang hayagang tagapagpahayag o tagapagbalita.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “katarungan,” bagaman “katuwiran” ang karaniwang salin dito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρχαίου κόσμου
  choice: sinaunang sanlibutan
  rationale: Tumutukoy ito sa sanlibutan noong unang panahon, lalo na bago ang baha. Ang “sinaunang sanlibutan” ay natural at malinaw sa makabagong Tagalog.
- source_word: οὐκ ἐφείσατο
  choice: hindi rin niya pinalampas
  rationale: Sa konteksto ng hatol, ang φείδομαι ay nangangahulugang hindi iligtas o hindi palampasin sa kaparusahan. Pinananatili ng “hindi niya pinalampas” ang puwersang panghukom nang hindi dinaragdagan ang teksto.
- source_word: ὄγδοον Νῶε
  choice: si Noe, ang ikawalo
  rationale: Pinananatili nito ang siksik at bahagyang malabong ordinal na anyo ng Griyego. Ipinaliliwanag sa talababa na maaaring ang diwa ay isa si Noe sa walong iniligtas.
- source_word: δικαιοσύνης κήρυκα
  choice: tagapagpahayag ng katuwiran
  rationale: Ang κῆρυξ ay isang hayagang tagapagpahayag o herald, hindi kinakailangang mangangaral sa makabagong institusyonal na kahulugan. Karaniwang katumbas ng δικαιοσύνη rito ang “katuwiran.”
- source_word: ἐφύλαξεν
  choice: iningatan
  rationale: Ipinahihiwatig ng φυλάσσω ang pag-iingat o pagpapanatiling ligtas. Ang “iningatan” ay natural sa Tagalog at angkop sa pagliligtas sa gitna ng hatol.
- source_word: κατακλυσμὸν
  choice: baha
  rationale: Ang κατακλυσμός ay malaking baha o delubyo. Sapat at natural ang “baha,” at malinaw ang kilalang pangyayari mula sa konteksto.
- source_word: κόσμῳ ἀσεβῶν
  choice: sa sanlibutan ng mga di-makadiyos
  rationale: 'Pinananatili nito ang ugnayang genitibo: isang sanlibutang binubuo o inilalarawan ng mga taong walang paggalang sa Diyos.'
- source_word: ἐπάξας
  choice: nang magpasapit siya
  rationale: Ipinahahayag ng aorist participle ang kalagayang kaugnay ng pag-iingat kay Noe habang ipinasasapit ang baha. Ang “nang” ay maayos na naghahatid ng ugnayang temporal sa Tagalog.
theological_decisions:
- issue: Paglalarawan kay Noe bilang δικαιοσύνης κήρυκα
  choice: tagapagpahayag ng katuwiran
  alternative: tagapangaral ng katuwiran; tagapagpahayag ng katarungan
  rationale: Mas tuwirang ipinapakita ng “tagapagpahayag” ang pampublikong pagpapahayag na saklaw ng κῆρυξ nang hindi ipinapalagay ang isang partikular na tungkuling pansimbahan. Pinili ang “katuwiran” bilang karaniwang salin ng δικαιοσύνη, habang pinananatili sa talababa ang posibleng “katarungan.”
- issue: Kahulugan ng ὄγδοον Νῶε
  choice: si Noe, ang ikawalo
  alternative: si Noe, isa sa walo
  rationale: Ang pangunahing teksto ay nagpapanatili sa ordinal at sa tunay na pagkaigsi ng Griyego; nililinaw ng talababa ang malamang na kolektibong diwa nang hindi ito sapilitang ipinapasok sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sanlibutan” para sa κόσμος at “di-makadiyos” para sa ἀσεβῶν. Ang “at hindi rin” ay nagpapanatili sa pagkakaugnay ng sugnay na ito sa naunang kondisyunal na pangungusap, yamang walang hiwalay na εἰ sa mismong talata.
