  naturalness: Marangal at malinaw sa kabuuan ang Tagalog. Mas natural at mas tumpak ang “hindi niya pinatawad” kaysa “hindi niya pinalampas.” Ang “magpasapit ... ng baha” ay katanggap-tanggap sa pormal na rehistro.
