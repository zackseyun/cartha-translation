  source_fidelity: 'Tumpak ang pangunahing diwa: ang nangyari sa kanila ay ang sinasabi ng tunay na kawikaan, na may larawan ng asong bumabalik sa sariling suka at ng nahugasang baboy na bumabalik sa putik. Gayunman, ang ὗς ay pambabaeng anyo (“sow”), kaya maaaring maipakita nang natural sa Tagalog bilang “inahin na baboy.” Ang idinagdag na “bumabalik” sa ikalawang kasabihan ay isang katanggap-tanggap na paglilinaw ng eliptikong anyo ng Griyego at nagpapanatili ng pagkakapantay sa unang linya.'
  naturalness: Malinaw, moderno, at angkop ang register. Natural ang “suka,” “putik,” at “paglulublob.” Mas malinaw ang “inahin na baboy” kaysa payak na “baboy” dahil napapanatili nito ang semantikong kasarian ng pinagmulan nang hindi nagiging artipisyal.
