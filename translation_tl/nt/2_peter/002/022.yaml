revisions:
- from: Nangyari sa kanila ang sinasabi ng tunay na kawikaan:[a] “Bumabalik ang aso sa sarili nitong suka,” at, “Ang baboy na nahugasan na ay bumabalik sa paglulublob sa putik.”[b]
  to: Nangyari sa kanila ang sinasabi ng tunay na kawikaan:[a] “Bumabalik ang aso sa sarili nitong suka,” at, “Ang inahin na baboy na nahugasan ay bumabalik sa paglulublob sa putik.”[b]
  rationale: Pinanatili ng rebisyon ang natural na modernong Tagalog at ang eliptikong lakas ng kasabihan, habang mas malinaw na isinasalamin ang pambabaeng anyo ng ὗς at inaayos ang mga talababa upang maging mas malapit sa Griyego. Walang idinagdag na doktrinal na pagpapakahulugan.
