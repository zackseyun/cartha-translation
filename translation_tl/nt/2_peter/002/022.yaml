base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/022.yaml
  text: 'What the true proverb says has happened to them: “A dog returns to its own vomit,” and[b][a], “A washed sow returns to wallowing in the mud.”'
translation:
  language: tl
  text: Nangyari sa kanila ang sinasabi ng tunay na kawikaan:[a] “Bumabalik ang aso sa sarili nitong suka,” at, “Ang inahin na baboy na nahugasan ay bumabalik sa paglulublob sa putik.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “Nangyari sa kanila ang salita ng tunay na kawikaan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “Isang aso, na bumalik sa sarili nitong suka … at isang inahin na baboy na nahugasan, sa paglulublob sa putik.” Ang unang kasabihan ay umaalingawngaw sa Kawikaan 26:11.'
    reason: cross_reference
lexical_decisions:
- source_word: συμβέβηκεν αὐτοῖς
  choice: Nangyari sa kanila
  rationale: Ipinahahayag ng perpektong panahunan ang kasalukuyang kalagayang bunga ng nangyari; natural sa Tagalog ang pariralang ito.
- source_word: τὸ τῆς ἀληθοῦς παροιμίας
  choice: ang sinasabi ng tunay na kawikaan
  rationale: 'Idiomatiko nitong ipinapahayag ang eliptikong konstruksiyon: nagkatotoo sa kanila ang nilalaman ng kawikaan.'
- source_word: Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα
  choice: Bumabalik ang aso sa sarili nitong suka
  rationale: Pinananatili nito ang pangkalahatang bisa ng kasabihan, ang pagbalik, at ang diin ng ἴδιον na ‘sarili nito.’
- source_word: Ὗς λουσαμένη
  choice: Ang baboy na nahugasan na
  rationale: Ang ὗς ay babaeng baboy, ngunit ang payak na ‘baboy’ ang mas natural sa modernong Tagalog; hindi rin tiyak sa anyo kung naghugas ito sa sarili o hinugasan, kaya pinanatili ang neutral na ‘nahugasan.’
- source_word: εἰς κυλισμὸν βορβόρου
  choice: sa paglulublob sa putik
  rationale: Malinaw at matingkad na inilalarawan ng ‘paglulublob’ ang paggulong o pagbabad sa βόρβορος, putik o lusak.
theological_decisions:
- issue: Ang bisa ng eliptikong pagsipi sa kawikaan
  choice: Ipinahahayag na ang sinasabi ng kawikaan ay nangyari sa kanila.
  alternative: 'Mas pormal: ‘Nangyari sa kanila ang nasa tunay na kawikaan.’'
  rationale: Pinananatili nito ang larawan ng pagbabalik sa dating karumihan nang hindi nagdaragdag ng doktrinal na paliwanag tungkol sa eksaktong espirituwal na kalagayan ng mga tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang ‘kawikaan,’ ‘suka,’ at ‘putik’ bilang tuwiran at karaniwang mga salita; iniwasan ang mas lumang ‘lusak’ bilang pangunahing salin. Inilagay ang bawat panandang talababa sa pangunahing teksto.
