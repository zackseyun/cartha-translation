  yaml_path: translation/nt/2_peter/002/011.yaml
  text: whereas angels[a], though greater in might and power[b], do not bring a slanderous judgment against them.
translation:
  language: tl
  text: Samantalang ang mga anghel, bagaman mas malakas at makapangyarihan sila, ay hindi naghaharap ng mapanlait na hatol laban sa kanila.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mapamusong na hatol” o “mapang-abusong hatol.” Ang pang-uring Griyego ay maaaring tumukoy sa mapang-abuso, mapanlait, o mapanirang pananalita.
    reason: lexical_alternative
  - marker: b
    text: Ang “kanila” ay malamang na tumutukoy sa “mga maluwalhating nilalang” sa naunang talata, ngunit hindi sila higit na tinutukoy ni Pedro rito.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: Samantalang
  rationale: Ginagamit dito bilang panandang paghahambing at pagsalungat sa naunang talata, hindi bilang literal na pook na “kung saan.”
- source_word: ἄγγελοι
  choice: ang mga anghel
  rationale: Mga makalangit na nilalang ang malinaw na tinutukoy sa konteksto, hindi mga taong mensahero.
- source_word: ἰσχύϊ καὶ δυνάμει
  choice: sa lakas at kapangyarihan
  rationale: Pinananatili ang magkaugnay ngunit magkahiwalay na mga salita at ang aspeto kung saan nakahihigit ang mga anghel.
- source_word: μείζονες ὄντες
  choice: kahit higit
  rationale: 'Ipinahahayag ang concessive na diwa ng participle: bagaman nakahihigit sila, hindi nila ginagawa ang inilalarawang gawain.'
- source_word: οὐ φέρουσιν
  choice: hindi humahatol
  rationale: Sa pagsama sa κρίσιν, tumutukoy ito sa pagharap o pagbigkas ng hatol; natural itong ipinahahayag sa Filipino sa pandiwang “humahatol.”
- source_word: κατ’ αὐτῶν
  choice: sa kanila
  rationale: Pinananatiling di-tiyak ang tinutukoy ng panghalip, gaya sa Griyego, sa halip na tukuyin ito nang higit sa sinasabi ng teksto.
- source_word: βλάσφημον
  choice: nang may panlalait
  rationale: Ipinahahayag ang mapang-abuso o mapanirang pananalita nang hindi nililimitahan ang kahulugan sa pamumusong laban sa Diyos.
- source_word: κρίσιν
  choice: humahatol
  rationale: Isinama ang pangngalang “hatol” sa natural na pandiwang Filipino; nananatili ang hudisyal na diwa ng paghatol.
theological_decisions:
- issue: Ang tinutukoy ng αὐτῶν kaugnay ng “mga maluwalhating nilalang” sa naunang talata
  choice: Iniwan bilang “sa kanila” sa pangunahing teksto.
  alternative: Mga nahulog na anghel, mga taong may mataas na katungkulan, o mga makalangit na nilalang sa pangkalahatan.
  rationale: Hindi tahasang kinikilala ng talata ang pinatutungkulan. Iniiwasan nitong magpasok ng tiyak na doktrinal na paliwanag na hindi tahasang ibinibigay ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Samantalang” upang natural na ihayag ang pagsalungat, at “nang may panlalait” upang maging malinaw sa karaniwang mambabasa ang uri ng hatol nang hindi labis na nilulutas ang saklaw ng βλάσφημον.
