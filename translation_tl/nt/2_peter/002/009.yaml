  text: οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/009.yaml
  text: then the Lord knows how to rescue the godly from trial[a], and to keep the unrighteous under punishment until the day of judgment[b],
translation:
  language: tl
  text: Kung gayon, alam ng Panginoon kung paano iligtas ang mga maka-Diyos mula sa pagsubok[a], at panatilihing pinarurusahan ang mga di-matuwid hanggang sa araw ng paghuhukom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa tukso.” Ang salitang Griyego ay maaaring mangahulugang tukso o pagsubok; sa kontekstong ito, mas angkop ang pagliligtas mula sa pagsubok.
    reason: lexical_alternative
  - marker: b
    text: O “ingatan ang mga di-matuwid upang parusahan sa araw ng paghuhukom.” Maaaring unawain ang kasalukuyang pandiwaring Griyego bilang tumutukoy sa nagpapatuloy na pagpaparusa o sa parusang kaugnay ng darating na paghuhukom.
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδεν
  choice: alam ... kung paano
  rationale: Kasama ng mga pawatas na ῥύεσθαι at τηρεῖν, ipinahihiwatig nito ang praktikal na kaalaman o kakayahan; natural itong ipinapahayag sa Tagalog bilang “alam ... kung paano.”
- source_word: κύριος
  choice: ang Panginoon
  rationale: Karaniwan at marangal na katumbas ng κύριος sa kontekstong biblikal.
- source_word: εὐσεβεῖς
  choice: ang mga namumuhay nang may debosyon sa Diyos
  rationale: Ang pang-uri ay ginamit bilang pangngalan para sa mga taong may εὐσέβεια—taimtim na paggalang at debosyon sa Diyos. Mas malinaw ito sa modernong Tagalog kaysa sa posibleng malabong “maka-Diyos.”
- source_word: ἐκ πειρασμοῦ
  choice: mula sa pagsubok
  rationale: Maaaring tumukoy ang πειρασμός sa tukso o pagsubok. Dahil sa mga halimbawa nina Noe at Lot sa konteksto, higit na angkop dito ang kapighatian o pagsubok, habang pinananatili sa talababa ang ibang posibilidad.
- source_word: ῥύεσθαι
  choice: iligtas
  rationale: Nangangahulugan itong sagipin o iligtas mula sa panganib; natural at dignified ang “iligtas” sa Tagalog.
- source_word: ἀδίκους
  choice: ang mga hindi matuwid
  rationale: Pinananatili nito ang moral at hudisyal na diwa ng ἄδικος nang hindi nililimitahan sa isang partikular na uri ng kasalanan.
- source_word: εἰς ἡμέραν κρίσεως
  choice: hanggang sa araw ng paghuhukom
  rationale: Sa pagkakaugnay nito sa τηρεῖν, ipinapahayag nito ang pagpapanatili na nakatuon at umaabot sa darating na araw ng paghuhukom.
- source_word: κολαζομένους
  choice: sa kaparusahan
  rationale: Ang kasalukuyang balintiyak na pandiwaring ito ay maaaring maglarawan sa kanila bilang nasa kalagayan ng pagpaparusa habang iniingatan; hindi nito kinakailangang alisin ang ugnayan sa parusang kaugnay ng huling paghuhukom.
- source_word: τηρεῖν
  choice: panatilihin
  rationale: Sinasaklaw nito ang diwang ingatan, panatilihin, o ilaan, at hinahayaan ang κολαζομένους na magbigay ng maparusang diwa.
theological_decisions:
- issue: Kahulugan ng πειρασμός sa konteksto
  choice: pagsubok
  alternative: tukso
  rationale: Ang naunang konteksto ay tungkol sa pagliligtas kina Noe at Lot mula sa mapanganib at mapanghatol na mga kalagayan. Kaya mas angkop ang “pagsubok,” ngunit hindi itinatanggi ang leksikal na posibilidad na “tukso.”
- issue: Lakas at ugnayan ng κολαζομένους
  choice: ang mga hindi matuwid ay pinananatili sa kaparusahan hanggang sa araw ng paghuhukom
  alternative: ang mga hindi matuwid ay iniingatan para parusahan sa araw ng paghuhukom
  rationale: Maaaring unawain ang kasalukuyang pandiwari bilang naglalarawan ng nagpapatuloy na kaparusahan, o bilang kaparusahang nakaugnay sa darating na paghuhukom. Pinananatili ng teksto at talababa ang tunay na sintaktikong at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “mga namumuhay nang may debosyon sa Diyos” upang malinaw na maipahayag ang substantibong εὐσεβεῖς, at iniwasang lutasin nang tahimik ang ambiguwidad ng πειρασμός at κολαζομένους.
