id: 2PE.2.12
reference: 2 Peter 2:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗτοι δέ, ὡς ἄλογα ζῷα ⸂γεγεννημένα φυσικὰ⸃ εἰς ἅλωσιν καὶ φθοράν, ἐν οἷς ἀγνοοῦσιν βλασφημοῦντες, ἐν τῇ φθορᾷ αὐτῶν ⸂καὶ φθαρήσονται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/012.yaml
  text: But these[a], like irrational animals—creatures of instinct, born for capture and destruction—blaspheming about things they do not understand, will also be destroyed in their destruction[d][c][b],
translation:
  language: tl
  text: Ngunit ang mga taong ito, gaya ng mga hayop na walang katwiran, na likas na isinilang upang mahuli at malipol, ay nagsasalita nang may paglapastangan tungkol sa mga bagay na hindi nila nauunawaan, at sila rin ay malilipol sa kanilang pagkapuksa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, inuulit ang magkaugnay na mga salita para sa “pagkapuksa” at “malilipol,” kaya napapanatili ang paglalaro ng salita sa pagitan ng pagkapuksa at pagkalipol.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογα ζῷα
  choice: mga hayop na walang katwiran
  rationale: Tuwirang ipinahahayag nito na ang mga hayop ay walang kakayahang mangatuwiran; natural at malinaw din ito sa modernong Tagalog.
- source_word: γεγεννημένα φυσικὰ
  choice: likas na nilalang na ipinanganak
  rationale: Pinananatili ang diwa ng φυσικά bilang likas o ayon sa kalikasan at ang larawan ng kapanganakan sa γεγεννημένα, nang hindi ipinapasok ang salitang 'instinto' bilang tanging pagpapakahulugan.
- source_word: εἰς ἅλωσιν καὶ φθοράν
  choice: upang hulihin at lipulin
  rationale: Ipinakikita ng εἰς ang layunin o kahihinatnan; ang mga pandiwang pawatas sa Filipino ay natural na naghahatid ng pagiging bihag at pagkapuksa.
- source_word: ἐν οἷς ἀγνοοῦσιν
  choice: sa mga bagay na hindi nila nauunawaan
  rationale: Ang neuter plural na οἷς ay pinakamalamang na tumutukoy sa mga bagay o usapin, at ang ἀγνοοῦσιν ay nagpapahiwatig ng kawalan ng pagkaalam o pagkaunawa.
- source_word: βλασφημοῦντες
  choice: lumalait
  rationale: Maaaring tumukoy ang βλασφημέω sa mapang-abusong pagsasalita, paninirang-puri, o paglapastangan. Ang 'lumalait' ay likas sa Tagalog at hindi paunang nagpapasiya na Diyos ang tuwirang layon.
- source_word: ἐν τῇ φθορᾷ αὐτῶν καὶ φθαρήσονται
  choice: sila rin ay malilipol sa kanilang pagkalipol
  rationale: Pinananatili ang pag-uulit ng magkaugnay na φθορά at φθείρω sa pamamagitan ng 'malilipol/pagkalipol,' pati ang καί bilang 'rin.'
theological_decisions:
- issue: Kahulugan ng βλασφημοῦντες
  choice: lumalait
  alternative: lumalapastangan; naninirang-puri
  rationale: Hindi tahasang tinutukoy ng talata ang layon ng pananalita. Pinananatili ng 'lumalait' ang matinding mapanirang pananalita nang hindi ipinapalagay na ang teknikal na relihiyosong diwa lamang ang kailangan.
- issue: Kahulugan ng φθορά / φθαρήσονται
  choice: pagkalipol / malilipol
  alternative: kabulukan / mabubulok; kapahamakan / mapapahamak
  rationale: Ang larawan ng mga hayop na hinuhuli at nililipol ay pumapabor sa pagkawasak o pagkapuksa, ngunit hindi tinutukoy nang higit pa ang eksaktong anyo ng hatol.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'mga taong ito' upang luminaw ang tinutukoy ng οὗτοι. Pinanatili ang matinding paghahambing at ang paglalaro sa magkaugnay na salita sa hulihan ng talata.
