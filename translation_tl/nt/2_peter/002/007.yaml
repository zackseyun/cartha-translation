  text: καὶ δίκαιον Λὼτ καταπονούμενον ὑπὸ τῆς τῶν ἀθέσμων ἐν ἀσελγείᾳ ἀναστροφῆς ἐρρύσατο—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/007.yaml
  text: and he rescued righteous Lot[c][b][a], who was being tormented by the sensual conduct of the lawless—
translation:
  language: tl
  text: at iniligtas niya ang matuwid na si Lot, na labis na pinahihirapan[a] ng mahalay[c] na pamumuhay[b] ng mga taong suwail sa batas—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “patuloy na ginigipit” o “labis na nababagabag.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “asal” o “pag-uugali.”
    reason: lexical_alternative
  - marker: c
    text: Ang “mahalay” ay maaari ring isalin na “walang pagpipigil” o “walang pakundangang imoral,” at tumutukoy sa lantad na moral na kalabisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: at
  rationale: Likas na pang-ugnay na nagpapatuloy sa pangungusap mula sa naunang talata.
- source_word: δίκαιον Λὼτ
  choice: ang matuwid na si Lot
  rationale: Pinananatili ang tahasang positibong pagtataya ng Griyego kay Lot at ginagamit ang likas na ayos ng pangalan sa Tagalog.
- source_word: καταπονούμενον
  choice: na labis na pinahihirapan
  rationale: Ipinahihiwatig ng kasalukuyang pasibong pandiwari ang patuloy at matinding pagdurusa; idinagdag ang 'labis' upang maipakita ang tindi ng καταπονέω nang hindi ipinapalagay na pisikal lamang ang pagpapahirap.
- source_word: ὑπὸ τῆς ... ἀναστροφῆς
  choice: ng ... pamumuhay
  rationale: Ipinakikita ng parirala ang sanhi ng paghihirap ni Lot. Saklaw ng 'pamumuhay' ang nakagawiang asal o paraan ng pamumuhay.
- source_word: τῶν ἀθέσμων
  choice: ng mga taong suwail sa batas
  rationale: Inilalahad ang moral-legal na diwa ng ἄθεσμος sa malinaw at natural na Tagalog, hindi lamang bilang pangkalahatang 'masama.'
- source_word: ἐν ἀσελγείᾳ
  choice: mahalay na
  rationale: Ang ἀσέλγεια ay tumutukoy sa walang-kahihiyang moral at seksuwal na kalabisan; 'mahalay' ay madaling maunawaan at angkop bilang panuring sa pamumuhay.
- source_word: ἐρρύσατο
  choice: iniligtas niya
  rationale: Malinaw at karaniwang katumbas ng pagliligtas mula sa panganib; ang 'niya' ay tumutukoy sa Diyos ayon sa nagpapatuloy na balangkas ng pangungusap.
theological_decisions:
- issue: Ang paglalarawan kay Lot bilang δίκαιος sa harap ng salaysay sa Genesis
  choice: Panatilihin ang tahasang paglalarawang “ang matuwid na si Lot.”
  alternative: Palabuin, pahinain, o alisin ang positibong pagtataya kay Lot dahil sa ilang kilos niya sa Genesis.
  rationale: Tahasang tinatawag ng tekstong Griyego na δίκαιος si Lot. Hindi dapat lutasin ng salin ang tensiyong nararamdaman ng mambabasa sa pamamagitan ng pagbabago sa pagtataya ng may-akda.
- issue: Saklaw ng ἀσελγείᾳ
  choice: “mahalay,” na nagpapahiwatig ng walang-kahihiyang moral at seksuwal na kalabisan.
  alternative: “imoral” o “masama,” na mas malawak ngunit hindi gaanong nagpapakita ng partikular na tindi at kawalang-kahihiyan ng salita.
  rationale: Pinananatili nito ang moral na bigat ng termino nang hindi nililimitahan sa isang tiyak na gawa o nagdaragdag ng denominasyonal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang em dash dahil bahagi ito ng mas mahabang pangungusap na nagpapatuloy mula at tungo sa kalapit na mga talata. Inayos ang mga pananda ng talababa ayon sa mismong salitang tinutukoy ng bawat paliwanag.
