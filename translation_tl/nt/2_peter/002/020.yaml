id: 2PE.2.20
reference: 2 Peter 2:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ γὰρ ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου ἐν ἐπιγνώσει τοῦ ⸀κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ τούτοις δὲ πάλιν ἐμπλακέντες ἡττῶνται, γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/020.yaml
  text: For if[a], after escaping the defilements of the world through the knowledge of the Lord and Savior Jesus the Messiah, they are again entangled in these things and overcome[b], the last state has become worse for them than the first.
translation:
  language: tl
  text: Sapagkat kung nakatakas na sila sa mga karumihan ng sanlibutan sa pamamagitan ng pagkakilala sa Panginoon at Tagapagligtas na si Jesus na Mesiyas, ngunit muli silang nasangkot sa mga iyon at nadaig, ang huli nilang kalagayan ay naging mas masahol kaysa sa una.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποφυγόντες
  choice: nakatakas na sila
  rationale: Ipinahihiwatig ng aorist participle ang pagtakas na nauna sa muling pagkakasangkot; natural itong ipinahahayag ng “nakatakas na.”
- source_word: τὰ μιάσματα τοῦ κόσμου
  choice: mga karumihan ng sanlibutan
  rationale: Ang μίασμα ay tumutukoy sa bagay na nagpaparumi, lalo na sa moral na diwa. Dignified at karaniwan sa biblikal na Filipino ang “sanlibutan” para sa κόσμος sa ganitong konteksto.
- source_word: ἐν ἐπιγνώσει
  choice: sa pamamagitan ng pagkakilala
  rationale: 'Instrumental ang ἐν dito: ang pagtakas ay naganap sa pamamagitan ng pagkakilala kay Jesus. Ang “pagkakilala” ay mas relasyonal kaysa payak na “kaalaman” ngunit hindi nito ipinapasya kung ito ay nagliligtas na pagkakilala.'
- source_word: τοῦ κυρίου καὶ σωτῆρος
  choice: sa Panginoon at Tagapagligtas
  rationale: Pinananatili ang magkatambal na titulo ni Jesus nang walang pagdaragdag ng “ating,” na wala sa tekstong Griyego.
- source_word: Ἰησοῦ Χριστοῦ
  choice: si Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas”; ang “na” ay natural na paraan sa Filipino upang malinaw na titulo ito ni Jesus.
- source_word: τούτοις δὲ πάλιν ἐμπλακέντες
  choice: ngunit muli silang nasangkot sa mga iyon
  rationale: Ang ἐμπλέκω ay larawan ng pagkakasilo o pagkakabuhol. Ang “nasangkot” ay natural at malinaw, at ang “mga iyon” ay tumutukoy pabalik sa mga karumihan.
- source_word: ἡττῶνται
  choice: nadaig
  rationale: Ipinahihiwatig ng pandiwa na sila ay natalo o napailalim sa kapangyarihan ng mga bagay na muling kinasangkutan nila.
- source_word: γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων
  choice: ang huli nilang kalagayan ay naging mas masahol kaysa sa una
  rationale: Ang perfect na γέγονεν ay nagpapahayag ng nagresultang kalagayan. Ang τὰ ἔσχατα at τῶν πρώτων ay idyomatikong paghahambing ng huli at unang kalagayan.
theological_decisions:
- issue: Likas ng ἐπίγνωσις kaugnay ng pagtalikod
  choice: “pagkakilala” nang hindi tinutukoy kung ito ay nagliligtas na muling kapanganakan
  alternative: “ganap na pagkakilala,” “panlabas lamang na pagkakilala,” o “nagliligtas na pagkakilala”
  rationale: Hindi nilulutas ng salitang Griyego mismo ang pinagtatalunang kalagayang espirituwal ng mga taong tinutukoy. Pinananatili ng salin ang tunay na teolohikal na tensiyon.
- issue: Pagpapakahulugan sa Χριστοῦ
  choice: “Mesiyas” bilang titulo
  alternative: “Cristo” bilang pangalang nakagawian
  rationale: Naririnig pa rito ang titularyong diwa ng Χριστός; ang “si Jesus na Mesiyas” ay malinaw at natural sa Filipino.
- issue: Referente ng τούτοις
  choice: “mga iyon,” na tumutukoy sa mga karumihan ng sanlibutan
  alternative: “mga bagay na ito” o tahasang “mga karumihang iyon”
  rationale: Pinananatili ang anaporikong pahiwatig ng Griyego nang hindi labis na inuulit o pinapalawak ang teksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “sanlibutan,” “Panginoon,” “Tagapagligtas,” at “Mesiyas” para sa pormal ngunit natural na rehistrong biblikal. Walang footnote marker dahil walang kinakailangang footnote sa draft na ito.
