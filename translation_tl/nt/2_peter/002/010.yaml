  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μάλιστα δὲ τοὺς ὀπίσω σαρκὸς ἐν ἐπιθυμίᾳ μιασμοῦ πορευομένους καὶ κυριότητος καταφρονοῦντας. Τολμηταί, αὐθάδεις, δόξας οὐ τρέμουσιν, βλασφημοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/010.yaml
  text: especially those who go after the flesh in the desire for defilement and despise authority[a]. Bold, self-willed, they do not tremble as they blaspheme glorious ones[d][c][b],
translation:
  language: tl
  text: lalo na ang mga sumusunod sa laman sa pagnanasa sa karumihan at humahamak sa kapamahalaan.[a] Pangahas at mapagmatigas sa sariling kagustuhan, hindi sila nanginginig habang nilalapastangan nila ang mga maluwalhati.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagkapanginoon” o “kapangyarihang mamahala.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga maluwalhati” ay malamang na tumutukoy sa maluwalhating mga nilalang sa langit, marahil sa mga anghel.
    reason: alternative_reading
lexical_decisions:
- source_word: μάλιστα
  choice: lalo na
  rationale: Likas na Filipino para sa natatanging pagdiriin sa pangkat na binabanggit.
- source_word: ὀπίσω σαρκὸς
  choice: sumusunod sa laman
  rationale: Pinananatili ang larawang 'sumunod sa' at ang susing salitang 'laman,' nang hindi ito agad ipinapakahulugang 'makasalanang kalikasan.'
- source_word: ἐν ἐπιθυμίᾳ μιασμοῦ
  choice: dahil sa pagnanasa sa karumihan
  rationale: Ipinahahayag ang masamang pagnanasa at moral na pagdungis; ang 'dahil sa' ay natural na nag-uugnay sa kanilang pagsunod sa laman.
- source_word: κυριότητος
  choice: kapamahalaan
  rationale: Saklaw nito ang lordship o dominion at hindi nito nililimitahan ang tinutukoy sa isang tiyak na maykapangyarihan.
- source_word: καταφρονοῦντας
  choice: humahamak
  rationale: Tumutukoy sa aktibong paghamak o pagtingin nang mababa.
- source_word: Τολμηταί
  choice: Pangahas
  rationale: Naghahatid ng negatibong tapang o kawalang-pakundangan sa konteksto.
- source_word: αὐθάδεις
  choice: mapagmatigas sa sariling kagustuhan
  rationale: Mas malinaw sa karaniwang mambabasa kaysa literal na 'mapagsarili' at pinananatili ang diwa ng matigas na paggigiit ng sariling nais.
- source_word: οὐ τρέμουσιν
  choice: hindi sila nanginginig
  rationale: Pinananatili ang matingkad na pisikal na larawan ng kawalan ng takot o pagpipitagan.
- source_word: δόξας
  choice: mga maluwalhati
  rationale: Pinananatiling hindi tiyak ang pagkakakilanlan ng mga tinutukoy, bagaman malamang na mga nilalang sa langit.
- source_word: βλασφημοῦντες
  choice: habang nilalapastangan nila
  rationale: Ang kasabay na pandiwaring Griyego ay likas na naihahayag sa 'habang'; ang 'nilalapastangan' ay angkop sa mapang-abusong pananalita laban sa mga dakilang nilalang.
theological_decisions:
- issue: Tinutukoy ng κυριότητος
  choice: kapamahalaan sa pangkalahatan
  alternative: pagkapanginoon ng Panginoon o isang makalangit na kapamahalaan
  rationale: Hindi tahasang tinutukoy ng talata kung kaninong kapamahalaan ito, kaya hindi ito nilimitahan sa kapamahalaan ni Cristo o ng mga anghel.
- issue: Tinutukoy ng δόξας
  choice: mga maluwalhating nilalang na hindi pinangalanan sa pangunahing teksto
  alternative: mga anghel, mga makalangit na nilalang, o mga karangalan
  rationale: Ipinahihiwatig ng kasunod na talata ang makalangit na sanggunian, ngunit ang δόξας mismo ay nananatiling mas malawak at malabo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang teolohikal na bigat ng 'laman,' 'kapamahalaan,' at 'mga maluwalhati' nang hindi labis na nililinaw ang mga sangguniang sadyang hindi tiyak sa Griyego.
