  source_fidelity: Kailangan ng pagwawasto sa ἐφείσατο at τηρουμένους. Ang “hindi pinatawad” ay mas tuwirang tumutukoy sa hindi pagpapatawad ng kasalanan, samantalang ang φείδομαι rito ay ‘hindi kinaawaan/hindi pinaligtas sa parusa.’ Ang “upang ingatan” ay walang hayag na tumatanggap at maaaring basahing aktibo; kailangang malinaw na ang mga anghel ang patuloy na iniingatan o nakalaan para sa paghuhukom.
  naturalness: Mas natural at malinaw sa modernong Filipino ang “hindi kinaawaan” at “upang sila’y ingatan.” Ang “ipinaubaya sa mga tanikala” ay naiiwasan ang medyo di-likas na “ibinigay sa mga tanikala,” habang pinananatili ang imahen at hindi ipinapasiya kung ang mga tanikala ay kasangkapan o kalagayan.
  terminology: Ang “Tartaro” ay wastong pagpapanatili ng natatanging imahen ng ταρταρόω. Ang “mga tanikala ng pusikit na dilim” ay katanggap-tanggap para sa σειραῖς ζόφου. Ang “paghuhukom” ay angkop para sa κρίσις.
  issues:
  - severity: medium
    issue: “hindi pinatawad” para sa οὐκ ἐφείσατο
    rationale: Maaaring magpahiwatig ito na ang usapin ay pagpapatawad ng kasalanan, hindi ang hindi pagpapakita ng awa o hindi pag-iwas sa kaparusahan na nasa φείδομαι sa kontekstong ito.
  - severity: medium
    issue: “upang ingatan” para sa τηρουμένους
    rationale: Hindi malinaw ang tumatanggap at hindi sapat na naipahahayag ang kasalukuyang pasibong kalagayan ng mga anghel na iniingatan hanggang sa paghuhukom.
  - severity: low
    issue: “ibinigay sa mga tanikala”
    rationale: Nauunawaan ito, ngunit hindi gaanong likas sa Filipino. Ang “ipinaubaya sa mga tanikala” ay mas maayos na naghahatid ng judicial custody nang hindi nagpapaliwanag nang lampas sa Griyego.
