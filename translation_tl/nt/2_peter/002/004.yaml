  text: Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ ⸀σειραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/004.yaml
  text: For if God did not spare angels when they sinned[a], but cast them into Tartarus and committed them to chains of gloom, to be kept for judgment[b],
translation:
  language: tl
  text: Sapagkat kung hindi kinaawaan ng Diyos ang mga anghel nang magkasala sila, kundi itinapon sila sa Tartaro[a] at ipinaubaya sa mga tanikala ng pusikit na dilim, upang sila’y ingatan para sa paghuhukom[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “itinapon sila sa impiyerno.” Ang pandiwang Griyego ay tiyak na nangangahulugang ipadala sa Tartaro, kaya pinanatili sa pangunahing teksto ang mas eksaktong katawagan.'
    reason: lexical_alternative
  - marker: b
    text: Sa ilang manuskrito ay “mga hukay ng pusikit na dilim” sa halip na “mga tanikala ng pusikit na dilim.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐφείσατο
  choice: hindi pinatawad
  rationale: Likas at malinaw na salin sa konteksto ng pagpaparusa; ipinahihiwatig na hindi sila iniligtas ng Diyos mula sa nararapat na hatol.
- source_word: ἀγγέλων ἁμαρτησάντων
  choice: ang mga anghel nang magkasala sila
  rationale: Ginagawang likas na sugnay na panahunan sa Tagalog ang aorist participle at pinananatili ang pangyayaring tinutukoy.
- source_word: ταρταρώσας
  choice: itinapon sila sa Tartaro
  rationale: Pinananatili ang tiyak at pambihirang larawang taglay ng pandiwang ταρταρόω sa halip na gawing pangkalahatang 'impiyerno.'
- source_word: σειραῖς ζόφου
  choice: sa mga tanikala ng pusikit na dilim
  rationale: Ang 'tanikala' ay tuwirang katumbas ng σειραί, samantalang ang 'pusikit na dilim' ay naghahatid ng mabigat at mapanglaw na diwa ng ζόφος.
- source_word: παρέδωκεν
  choice: ibinigay
  rationale: Pinananatili ang diwa ng paghahatid o pagbibigay sa kustodiya, kasunod ang pariralang nagsasaad ng pagkakagapos.
- source_word: εἰς κρίσιν
  choice: para sa paghuhukom
  rationale: Tumutukoy sa nakalaang paghuhukom nang hindi ipinapalagay agad ang mismong hatol o kaparusahan.
- source_word: τηρουμένους
  choice: upang ingatan
  rationale: Ipinapakita ang patuloy na pagkakakulong o pagbabantay sa kanila habang hinihintay ang paghuhukom.
theological_decisions:
- issue: Paglilipat ng ταρταρώσας nang hindi nagdaragdag ng doktrinang lampas sa salitang Griyego
  choice: itinapon sila sa Tartaro
  alternative: itinapon sila sa impiyerno
  rationale: Ang pambihirang pandiwang Griyego ay tahasang tumutukoy sa Tartaro. Ang pagpapanatili sa pangalang ito ay umiiwas sa paglalapat ng mas malawak at mas huling mga konsepto na maaaring kaakibat ng 'impiyerno.'
- issue: Ugnayan ng Tartaro, mga tanikala ng dilim, at τηρουμένους
  choice: itinapon sila sa Tartaro at ibinigay sa mga tanikala ng pusikit na dilim, upang ingatan para sa paghuhukom
  alternative: itinapon sila sa Tartaro na nakatanikala sa pusikit na dilim hanggang sa paghuhukom
  rationale: Pinananatili ng napiling ayos ang magkakasiksik na larawan at hindi tiyak na sintaktikong ugnayan ng Griyego nang hindi nagpapasiya kung ang mga tanikala ay kasangkapan, kalagayan, o paglalarawan ng lugar.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang 'Tartaro' bilang transliterasyon ng tiyak na terminong Griyego, at ginamit ang 'pusikit na dilim' upang maipahayag nang natural ang mabigat na diwa ng ζόφος.
