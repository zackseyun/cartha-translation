  yaml_path: translation/nt/2_peter/002/002.yaml
  text: And many will follow their sensuality[c][b][a], and because of them the way of the truth will be blasphemed.
translation:
  language: tl
  text: At marami ang susunod sa kanilang mga kahalayan[a], at dahil sa kanila ay lalapastanganin[c] ang daan ng katotohanan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mahalay at walang-pigil na pamumuhay.” Ang salitang Griyego ay tumutukoy sa walang-kahihiyan at walang-pigil na asal, na kadalasa’y may seksuwal na pahiwatig.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “daan ng katotohanan.” Malamang na tumutukoy ito sa tunay na pananampalataya at paraan ng pamumuhay ng mga Kristiyano.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “lalaitin,” “sisiraan,” o “pag-uusapan nang masama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: marami
  rationale: Likas at tuwirang katumbas sa modernong Tagalog na pinananatili ang diin sa malaking bilang.
- source_word: ἐξακολουθήσουσιν
  choice: susunod
  rationale: Pinananatili ang panghinaharap at ang diwang pagsunod sa landas o halimbawa ng mga huwad na guro.
- source_word: αὐτῶν
  choice: kanilang
  rationale: Malinaw na tumutukoy sa mga huwad na guro sa naunang konteksto.
- source_word: ταῖς ἀσελγείαις
  choice: mahahalay at walang-pigil na pamumuhay
  rationale: Sinasaklaw ang walang-kahihiyan at di-mapigil na asal, kasama ang madalas nitong seksuwal na pahiwatig, nang hindi ito nililimitahan sa iisang uri ng kasalanan.
- source_word: δι’ οὓς
  choice: dahil sa kanila
  rationale: Ipinapahayag nang natural sa Tagalog ang sanhi na dala ng διά na may accusative.
- source_word: ἡ ὁδὸς τῆς ἀληθείας
  choice: ang daan ng katotohanan
  rationale: Pinananatili ang metapora ng daan at ang genitive na ugnayan sa katotohanan, habang nananatiling likas sa Tagalog.
- source_word: βλασφημηθήσεται
  choice: lalapastanganin
  rationale: Ipinahahayag ang mabigat na diwa ng mapanirang at mapanghamak na pananalita laban sa banal o sa tunay na daan; ang object-focus na anyo ay angkop sa passive ng Griyego.
theological_decisions:
- issue: Saklaw ng ἀσέλγεια
  choice: mahahalay at walang-pigil na pamumuhay
  alternative: mga kahalayan; malaswang pamumuhay
  rationale: Pinananatili ang parehong malawak na kawalang-pagpipigil at ang karaniwang seksuwal na pahiwatig, nang hindi ginagawang seksuwal lamang ang termino.
- issue: Kahulugan ng “daan ng katotohanan”
  choice: Pinanatili bilang “ang daan ng katotohanan,” na maaaring tumukoy sa tunay na pananampalataya at paraan ng pamumuhay ng mga Cristiano.
  alternative: ang tunay na daan; ang daan tungo sa katotohanan
  rationale: Hindi nilulutas nang labis ang genitive o ginagawang mas makitid na pormulang doktrinal ang isang maagang Cristianong paglalarawan.
- issue: Lakas ng βλασφημηθήσεται
  choice: lalapastanganin
  alternative: lalaitin; sisiraan; pagsasalitaan nang masama
  rationale: Pinananatili ang bigat ng mapanghamak na pananalita, habang ipinapaliwanag sa talababa ang mas malawak na saklaw nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pamumuhay” upang maging likas ang maramihang abstraktong pangngalan sa Griyego, at pinanatili ang metaporang “daan ng katotohanan.”
