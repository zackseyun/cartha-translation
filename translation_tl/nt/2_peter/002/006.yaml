  source_fidelity: Kailangang baguhin ang pangwakas na sugnay. Ang “halimbawa ng mangyayari sa mga taong hindi kumikilala sa Diyos” ay ginagawang paksa ng halimbawa ang isang pangyayaring darating, samantalang ang ὑπόδειγμα ... τεθεικώς ay nagsasaad na ang Sodoma at Gomorra ay ginawang halimbawa para sa mga taong magiging/namumuhay nang di-maka-Diyos. Ang paghatol at pagtupok hanggang maging abo ay naipahahayag nang tapat sa rebisyon.
  naturalness: Mas natural at malinaw ang “hinatulan niya ... ng pagkawasak” at “ginawa niya silang halimbawa para sa mga magiging di-maka-Diyos.” Pinananatili ang “at kung” at ang pangwakas na kuwit, dahil nakadepende ang talata sa nagpapatuloy na kondisyunal na pangungusap.
  terminology: Ang “di-maka-Diyos” ay tuwirang katumbas ng ἀσεβής sa marangal na makabagong Tagalog. Ang “pagkawasak” ay natural na katumbas ng καταστροφή sa konteksto ng hatol. Pinanatili ang “Sodoma at Gomorra” at ang maramihang “mga lungsod.”
