  text: καὶ πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας ⸀καταστροφῇ κατέκρινεν, ὑπόδειγμα μελλόντων ⸀ἀσεβέσιν τεθεικώς,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/006.yaml
  text: and if by reducing the cities of Sodom and Gomorrah to ashes he condemned them to destruction[a], having made them an example for those who would be ungodly[b],
translation:
  language: tl
  text: at kung, sa pagtupok niya sa mga lungsod ng Sodoma at Gomorra hanggang maging abo, hinatulan niya ang mga iyon ng pagkawasak[a], at ginawa niya silang halimbawa para sa mga magiging di-maka-Diyos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “at ginawa niyang abo ang mga lungsod ng Sodoma at Gomorra at hinatulan niya ang mga iyon ng pagkawasak.”
    reason: lexical_alternative
  - marker: b
    text: O kaya, “para sa mga taong mamumuhay nang di-maka-Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεφρώσας
  choice: tinupok niya hanggang maging abo
  rationale: Ipinahahayag ng pandiwa hindi lamang ang pagsunog kundi ang resultang pagiging abo; natural din ang pagkakasabi sa makabagong Tagalog.
- source_word: καταστροφῇ κατέκρινεν
  choice: hinatulan ang mga iyon sa pagkapuksa
  rationale: Pinananatili nito ang hudisyal na diwa ng κατέκρινεν at ang resulta o nilalaman ng hatol na ipinahahayag ng καταστροφῇ.
- source_word: ὑπόδειγμα
  choice: halimbawa
  rationale: Tuwirang katumbas ito na nagpapahintulot sa konteksto ng paghatol na magpahiwatig na babala ang halimbawang tinutukoy.
- source_word: μελλόντων ἀσεβέσιν
  choice: ng mangyayari sa mga taong hindi kumikilala sa Diyos
  rationale: Batay sa anyong Griyego na ibinigay, ang μελλόντων ay tumutukoy sa mga bagay na darating o mangyayari, samantalang ang ἀσεβέσιν ay tumutukoy sa mga taong di-maka-Diyos na makararanas ng mga iyon.
- source_word: πόλεις Σοδόμων καὶ Γομόρρας
  choice: ang mga lungsod ng Sodoma at Gomorra
  rationale: Pinananatili ang maramihang 'mga lungsod' at ginagamit ang karaniwang anyong Tagalog ng mga pangalang pantangi.
theological_decisions:
- issue: Di-hayag na simuno mula sa konteksto
  choice: niya
  alternative: ng Diyos / ng Panginoon
  rationale: Hindi tahasang inuulit ng sugnay ang banal na titulo; pinananatili ng panghalip ang daloy ng Griyego nang hindi nagdaragdag ng katawagang wala sa mismong sugnay.
- issue: Ugnayan ng μελλόντων at ἀσεβέσιν
  choice: halimbawa ng mangyayari sa mga taong hindi kumikilala sa Diyos
  alternative: halimbawa para sa mga taong magiging di-maka-Diyos
  rationale: Ang tekstong Griyego na ibinigay ay may μελλόντων na henitibong maramihan at ἀσεβέσιν na datibong maramihan, kaya mas likas itong unawain bilang paparating na sasapitin ng mga di-maka-Diyos kaysa bilang mga taong magiging di-maka-Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “hindi kumikilala sa Diyos” bilang madaling maunawaang katumbas ng ἀσεβής, at pinanatili ang pambungad na “at kung” at pangwakas na kuwit dahil bahagi ang talata ng mas mahabang kondisyunal na pangungusap.
