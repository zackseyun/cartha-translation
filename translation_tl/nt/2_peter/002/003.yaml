  text: καὶ ἐν πλεονεξίᾳ πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ ⸀νυστάζει.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/003.yaml
  text: And in greed they will exploit you with fabricated words. Their judgment from long ago is not idle[a], and their destruction is not asleep.
translation:
  language: tl
  text: At dahil sa kasakiman, pagsasamantalahan nila kayo sa pamamagitan ng mga gawa-gawang salita.[a] Ang hatol sa kanila mula pa noong una ay hindi nananatiling walang-kilos, at ang kapahamakan nila ay hindi natutulog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “gagawin nila kayong paninda”—gumagamit ang Griyego ng larawang pangkalakalan para sa pagkita mula sa mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: Dahil sa kasakiman
  rationale: Ipinahahayag nito ang kasakiman bilang motibo ng mga huwad na guro; natural ito sa makabagong Tagalog at nananatili ang bigat na moral.
- source_word: πλαστοῖς λόγοις
  choice: sa pamamagitan ng mga kathang salita
  rationale: Ang πλαστός ay tumutukoy sa isang bagay na hinubog o inimbento; ipinakikita ng “kathang salita” na sadyang ginawa ang kanilang mga pahayag, hindi lamang na mali ang mga iyon.
- source_word: ἐμπορεύσονται
  choice: pagsasamantalahan nila kayo
  rationale: Malinaw nitong naihahatid ang matalinghagang komersiyal na diwa ng pagtrato sa mga tao bilang pagkakakitaan; pinananatili sa talababa ang mas literal na larawan.
- source_word: κρίμα
  choice: hatol
  rationale: Pinananatili ng “hatol” ang hudisyal na diwa nang hindi dinaragdagan ang teksto ng partikular na paliwanag tungkol sa paraan ng kaparusahan.
- source_word: ἔκπαλαι
  choice: na matagal nang itinakda
  rationale: Ipinahahayag nito na ang hatol ay matagal nang nakalaan; ang “itinakda” ay ginagawang natural sa Tagalog ang kaugnayan ng temporal na parirala sa hatol.
- source_word: οὐκ ἀργεῖ
  choice: ay hindi nagpapabaya
  rationale: Ipinakikita nitong ang hatol ay hindi walang-kilos o bigong kumilos, habang pinananatili ang personipikasyon at iniiwasang paliitin ang diwa sa simpleng pagkaantala lamang.
- source_word: ἀπώλεια
  choice: kapahamakan
  rationale: Ang “kapahamakan” ay isang malinaw at marangal na salin para sa pagkawasak o kapahamakang sasapit, nang hindi nagpapasya sa eksaktong mekanismo o tagal nito.
- source_word: οὐ νυστάζει
  choice: ay hindi natutulog
  rationale: 'Pinananatili nito ang matingkad na personipikasyon ng Griyego: ang kanilang kapahamakan ay hindi nakakatulog o nabibigong dumating.'
theological_decisions:
- issue: Kalikasan ng ipinahayag na kaparusahan
  choice: Tuwirang isalin bilang tiyak na hatol at kapahamakan na sasapit sa mga huwad na guro.
  alternative: Tukuyin ang “kapahamakan” bilang pagkalipol, o bilang pansamantalang pagkasira lamang.
  rationale: Tiyak na nagbababala ang talata tungkol sa hatol, ngunit hindi nito ipinaliliwanag dito ang mekanismo o tagal ng kaparusahan. Kaya pinananatili ang tensiyong teolohikal nang walang idinadagdag na sistemang doktrinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pagsasamantalahan” para sa agarang pagkaunawa, habang inilagay sa talababa ang komersiyal na metapora ng orihinal. Pinanatili ang magkatambal na personipikasyon ng hatol at kapahamakan.
