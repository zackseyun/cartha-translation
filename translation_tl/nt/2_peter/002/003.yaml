  to: At dahil sa kasakiman, pagsasamantalahan nila kayo sa pamamagitan ng mga gawa-gawang salita.[a] Ang hatol sa kanila mula pa noong una ay hindi nananatiling walang-kilos, at ang kapahamakan nila ay hindi natutulog.
  rationale: Idinagdag ang “At” para sa καί. Pinalitan ang “kathang salita” ng mas likas na “gawa-gawang salita.” Inalis ang dagdag na implikasyon ng “itinakda” at isinalin ang ἔκπαλαι bilang “mula pa noong una.” Pinalitan ang “hindi nagpapabaya” ng “hindi nananatiling walang-kilos” upang maipahayag ang οὐκ ἀργεῖ nang mas tumpak at mapanatili ang personipikasyon. Hindi binibigyang-kahulugan nang lampas sa teksto ang kalikasan ng kapahamakan.
