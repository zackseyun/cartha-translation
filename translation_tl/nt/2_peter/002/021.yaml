  text: κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι τὴν ὁδὸν τῆς δικαιοσύνης ἢ ἐπιγνοῦσιν ⸀ὑποστρέψαι ἐκ τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/021.yaml
  text: For it would have been better for them not to have known the way of righteousness than[a], after knowing it[c][b], to turn back from the holy commandment delivered to them.
translation:
  language: tl
  text: Sapagkat mas mabuti pa sana sa kanila na hindi nila nakilala ang daan ng katuwiran[a] kaysa, matapos nila itong makilala, ay bumalik mula sa banal na utos na ipinasa sa kanila.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “landas ng katuwiran.” Ang “katuwiran” ay maaari ring tumukoy sa “katarungan,” ngunit ang moral na pagiging matuwid ang higit na angkop dito.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ibinigay sa kanila” o “inihatid sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον γὰρ ἦν αὐτοῖς
  choice: Sapagkat mas mabuti pa sana sa kanila
  rationale: Pinananatili ng “Sapagkat” ang paliwanag na ugnayan sa naunang talata, at natural na ipinahahayag ng “mas mabuti pa sana” ang paghahambing na may di-naganap na diwa.
- source_word: ἐπεγνωκέναι / ἐπιγνοῦσιν
  choice: hindi nila nakilala / matapos nila itong makilala
  rationale: Inuulit ang iisang salitang-ugat gaya ng Griyego. Ang “nakilala” ay nagpapahiwatig ng tiyak na pagkakilala nang hindi pinalalabis bilang lubos o ganap na kaalaman.
- source_word: ὁδὸν τῆς δικαιοσύνης
  choice: ang daan ng katuwiran
  rationale: Ang “daan” ay natural na talinghaga para sa paraan ng pamumuhay, at ang “katuwiran” ay angkop sa moral na konteksto ng talata.
- source_word: ὑποστρέψαι ἐκ
  choice: tumalikod sa
  rationale: Natural sa Filipino ang “tumalikod sa” at malinaw nitong ipinahahayag ang pagtalikod mula sa dati nang nakilala, habang pinananatili ang diwa ng pagbabalik sa dating kalagayan.
- source_word: παραδοθείσης αὐτοῖς
  choice: ibinigay sa kanila
  rationale: Malinaw at natural itong salin ng pasibong pagkakaloob o paghahatid ng utos sa kanila, nang hindi nagdaragdag ng diwang pamamahala o pananagutan na wala sa salita.
- source_word: ἁγίας ἐντολῆς
  choice: banal na utos
  rationale: Pinananatili ang isahan at ang moral-relihiyosong bigat ng parirala sa natural na modernong Filipino.
theological_decisions:
- issue: Kung dapat bang ipasya ng salin ang usapin ng apostasya laban sa panlabas lamang na pagkakilala sa pananampalataya
  choice: Sabihin nang tuwiran na nakilala nila ang daan ng katuwiran at pagkatapos ay tumalikod sila sa banal na utos.
  alternative: Palakasin ang pananalita upang tahasang magpahiwatig ng pagkawala ng kaligtasan, o pahinain ito upang magpahiwatig lamang ng mababaw na pagkakalantad.
  rationale: Inilalarawan ng Griyego ang tunay na pagkakilala at kasunod na pagtalikod, ngunit hindi nito tahasang nilulutas ang mas malawak na doktrinal na pagtatalo. Kaya pinananatili ng salin ang tensiyong nasa teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang maikli at mabigat na paghahambing ng orihinal, gayundin ang pag-uulit ng “nakilala.”
