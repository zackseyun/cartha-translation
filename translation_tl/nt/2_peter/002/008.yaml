  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: βλέμματι γὰρ καὶ ἀκοῇ ⸀ὁ δίκαιος ἐγκατοικῶν ἐν αὐτοῖς ἡμέραν ἐξ ἡμέρας ψυχὴν δικαίαν ἀνόμοις ἔργοις ἐβασάνιζεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/008.yaml
  text: for by what he saw and heard[a], that righteous man, living among them[c][b], was tormenting his righteous soul day after day with their lawless deeds—
translation:
  language: tl
  text: sapagkat, sa kanyang nakikita at naririnig, ang matuwid na taong iyon, habang naninirahan sa gitna nila, ay araw-araw na pinapahirapan ang kanyang matuwid na kaluluwa sa pamamagitan ng kanilang mga gawang labag sa kautusan—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλέμματι καὶ ἀκοῇ
  choice: dahil sa kanyang nakikita at naririnig
  rationale: Ang dalawang datibo ay tumutukoy sa nakikita at naririnig ni Lot at kaugnay ng patuloy na paghihirap ng kanyang kalooban. Natural ito sa makabagong Tagalog habang pinananatili ang pagkakalagay ng parirala sa unahan.
- source_word: ὁ δίκαιος
  choice: ang matuwid na taong iyon
  rationale: Substantibong pang-uri ito na tumutukoy pabalik kay Lot; nililinaw ng “taong iyon” ang reperensiya at pinananatili ang panlalaking isahan.
- source_word: ἐγκατοικῶν ἐν αὐτοῖς
  choice: habang naninirahan sa gitna nila
  rationale: Ipinahihiwatig ng participle ang patuloy na paninirahan ni Lot sa piling ng mga taong tinutukoy.
- source_word: ἡμέραν ἐξ ἡμέρας
  choice: araw-araw
  rationale: Karaniwang idyomang Tagalog ito para sa paulit-ulit at nagpapatuloy na kilos, bagaman maaari ring isalin na “sa araw-araw.”
- source_word: ψυχὴν δικαίαν
  choice: kanyang matuwid na kaluluwa
  rationale: Pinananatili ang ψυχή bilang “kaluluwa” sa di-teknikal na diwa ng panloob na sarili o buhay ni Lot, at pinananatili rin ang pag-uulit ng “matuwid.”
- source_word: ἀνόμοις ἔργοις
  choice: kanilang masasamang gawang lumalabag sa kautusan
  rationale: Ipinapahayag nito ang moral at legal na lakas ng ἄνομος. Ang “kanilang” ay malinaw na ipinahihiwatig ng konteksto.
- source_word: ἐβασάνιζεν
  choice: ay ... na nagpapahirap
  rationale: Pinananatili ng anyong ito ang aktibong tinig at ang nagpapatuloy na kilos ng imperfect; mas matindi ito kaysa simpleng pagkalungkot o pagkabagabag.
theological_decisions:
- issue: Diwa ng ψυχή kaugnay ng pagkatao
  choice: kaluluwa bilang panloob na sarili o buhay ni Lot, nang walang teknikal na pagpapakahulugan
  alternative: sarili; kalooban
  rationale: Ang talata ay naglalarawan ng matinding panloob na paghihirap ni Lot, hindi nagtatakda ng masusing doktrina tungkol sa ugnayan ng katawan at kaluluwa.
- issue: Aktibong anyo ng ἐβασάνιζεν
  choice: pinanatiling “nagpapahirap sa kanyang ... kaluluwa”
  alternative: “nahihirapan ang kanyang kalooban” o “pinahihirapan ang kanyang kaluluwa”
  rationale: Aktibo ang pandiwang Griyego at si Lot ang simuno; hindi ito dapat tahimik na gawing balintiyak o purong di-palipat kahit medyo kakaiba ang literal na larawan.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang dalawang pagbanggit sa pagiging matuwid at ang aktibong, matinding larawan ng paghihirap. Pinanatili rin ang bahagyang tensiyon ng dalawang pariralang datibo sa halip na lubusang ayusin ang kanilang ugnayan.
