review_pass:
  verdict: revise
  source_fidelity: Tumpak na naihahatid ng draft ang pangunahing mga larawan at paghatol sa Griyego. Gayunman, ang “Sinanay nila ang kanilang puso” ay inililipat ang pokus mula sa “may pusong nasanay” (ἔχοντες καρδίαν γεγυμνασμένην) tungo sa isang malayang salaysay ng ginawa nila. Ang rebisyon ay nagpapanatili sa aspektong ito at sa magkakasunod na participial na paglalarawan.
  naturalness: Nauunawaan ang kasalukuyang Tagalog, ngunit mas maayos at mas natural ang magkakatulad na hulma na “May mga matang ...; umaakit ...; may pusong ...; mga anak ...” para sa sunod-sunod na paglalarawan. Nanatiling sadyang matindi at di-karaniwan ang “punô ng isang babaeng nangangalunya,” dahil ganoon din ang kongkreto at matalinghagang idyoma sa Griyego.
  terminology: Ang “babaeng nangangalunya,” “pagkakasala,” “kasakiman,” at “mga anak ng sumpa” ay angkop sa modernong Filipino Tagalog at pinananatili ang lakas ng mga salitang μοιχαλίς, ἁμαρτία, πλεονεξία, at κατάρας τέκνα. Ang talababa sa unang parirala ay kinakailangan upang ipakita ang literal ngunit di-pangkaraniwang idyoma; ang ikalawa ay sapat na nagbibigay ng lehitimong mga alternatibo.
  issues:
  - severity: medium
    issue: Ang “Sinanay nila ang kanilang puso sa kasakiman” ay hindi tuwirang tumutugma sa estruktura ng καρδίαν γεγυμνασμένην ... ἔχοντες.
    rationale: Inilalarawan ng Griyego ang mga taong ito bilang may pusong nasanay na sa kasakiman, hindi pangunahing bilang mga taong nagsanay ng sarili nilang puso. Maaaring sangkot ang sariling pagkilos sa kahulugan, ngunit hindi ito ang ipinapahayag na sintaks.
  - severity: low
