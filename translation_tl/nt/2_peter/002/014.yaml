- from: Ang mga mata nila ay punô ng isang babaeng mangangalunya[a] at hindi tumitigil sa pagkakasala.[b] Inaakit nila ang mga taong hindi matatag. Sinanay nila ang kanilang puso sa kasakiman. Mga anak sila ng sumpa.
  to: May mga matang punô ng isang babaeng nangangalunya[a] at walang tigil sa pagkakasala.[b] Umaakit sila ng mga taong hindi matatag. May pusong nasanay sa kasakiman. Mga anak sila ng sumpa.
  rationale: Binago ang pandiwang “Sinanay nila” tungo sa “May pusong nasanay” upang mapanatili ang participial na “may ... pusong sinanay” sa Griyego. Pinalitan din ang “mangangalunya” ng “nangangalunya” upang maiwasan ang di-sinasadyang panghinaharap na dating. Ang natitirang mga pagbabago ay pang-ugnay lamang para maging likas ang Tagalog nang hindi pinapahina ang matinding retorika o pinapakinis ang idyomang Griyego.
