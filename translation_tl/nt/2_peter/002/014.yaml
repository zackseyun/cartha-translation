  text: ὀφθαλμοὺς ἔχοντες μεστοὺς μοιχαλίδος καὶ ⸀ἀκαταπαύστους ἁμαρτίας, δελεάζοντες ψυχὰς ἀστηρίκτους, καρδίαν γεγυμνασμένην πλεονεξίας ἔχοντες, κατάρας τέκνα,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/014.yaml
  text: having eyes full of an adulteress and insatiable for sin, enticing unstable souls, having a heart trained in greed, children of a curse,
translation:
  language: tl
  text: May mga matang punô ng isang babaeng nangangalunya[a] at walang tigil sa pagkakasala.[b] Umaakit sila ng mga taong hindi matatag. May pusong nasanay sa kasakiman. Mga anak sila ng sumpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas interpretibong salin, “punô ng pangangalunya” o “punô ng pagnanasang mangalunya.” Sa Griyego, literal itong “punô ng isang babaeng nangangalunya,” isang matindi at kongkretong idyoma.
    reason: lexical_alternative
  - marker: b
    text: O “hindi makapagpigil sa pagkakasala” o “walang tigil sa kasalanan.” Maaari rin itong unawain nang mas interpretibo bilang “walang kasiyahan sa kasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεστοὺς μοιχαλίδος
  choice: punô ng isang babaeng mangangalunya
  rationale: Pinananatili ang kongkreto at matinding larawan ng Griyegong genitibong isahan, sa halip na agad itong gawing abstraktong “pangangalunya.”
- source_word: ἀκαταπαύστους ἁμαρτίας
  choice: hindi tumitigil sa pagkakasala
  rationale: Malapit ito sa diwang “hindi humihinto sa kasalanan” at natural sa makabagong Tagalog; iniiwasan nitong ipasok ang mas interpretibong ideya ng pagkauhaw o kawalang-kasiyahan.
- source_word: δελεάζοντες
  choice: inaakit
  rationale: Ipinahihiwatig nito ang mapanlinlang na pang-akit ng pandiwa, na maaari ring tumukoy sa pag-akit na gaya ng paggamit ng pain.
- source_word: ψυχὰς ἀστηρίκτους
  choice: mga taong hindi matatag
  rationale: Ang ψυχαί ay tumutukoy rito sa mga tao mismo; mas malinaw sa karaniwang mambabasa ang “mga tao” kaysa literal na “mga kaluluwa.”
- source_word: καρδίαν γεγυμνασμένην πλεονεξίας
  choice: sinanay nila ang kanilang puso sa kasakiman
  rationale: Pinananatili ng “sinanay” ang larawang mula sa ehersisyo o pagsasanay, samantalang malinaw at kasalukuyan ang “kasakiman.”
- source_word: κατάρας τέκνα
  choice: mga anak sila ng sumpa
  rationale: Pinananatili ang matinding idyomang “mga anak ng sumpa” nang hindi ito pinaplat bilang simpleng “isinumpa.”
- source_word: ἔχοντες ... ἔχοντες
  choice: ang mga mata nila ay ... sinanay nila ang kanilang puso
  rationale: Isinaayos ang mga participle bilang likas na mga sugnay sa Tagalog habang pinananatili ang sunod-sunod na paghatol ng talata.
theological_decisions:
- issue: Kung palalambutin ang seksuwal na larawan ng μοιχαλίδος
  choice: Panatilihin sa pangunahing teksto ang kongkretong “isang babaeng mangangalunya”
  alternative: “pangangalunya” o “pagnanasang mangalunya”
  rationale: Matalim at kongkreto ang Griyego. Ang tala ay nagbibigay ng mga interpretibong katumbas nang hindi inaalis ang tunay na anyo sa pangunahing teksto.
- issue: Kung ang ἀκαταπαύστους ἁμαρτίας ay tumutukoy sa kawalang-kasiyahan o sa hindi pagtigil
  choice: “hindi tumitigil sa pagkakasala”
  alternative: “walang kasiyahan sa kasalanan”
  rationale: Mas tuwirang sinasalamin ng napiling salin ang ideya ng hindi paghinto at pinananatili sa talababa ang posibleng mas interpretibong pagbasa.
- issue: Pagpili sa πλεονεξία
  choice: “kasakiman”
  alternative: “pag-iimbot”
  rationale: Malinaw sa modernong Tagalog ang “kasakiman” at taglay pa rin nito ang lakas ng bisyong tinutuligsa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa maiikling pangungusap upang maging natural at madaling maunawaan, ngunit pinanatili ang sunod-sunod at mabigat na pagtuligsa ng Griyego. Ginamit ang “punô” na may tuldik upang luminaw ang bigkas.
