base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/019.yaml
  text: promising them freedom while they themselves are servants of corruption[a]; for whatever a person is overcome by[b], by this he is also enslaved.
translation:
  language: tl
  text: Nangangako sila sa kanila ng kalayaan, samantalang sila mismo ay mga alipin ng kabulukan[a]; sapagkat ang sinumang nadaig ng anuman ay inalipin din nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, pagkasira.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλευθερίαν
  choice: kalayaan
  rationale: Ito ang likas at karaniwang salin sa modernong Filipino at malinaw na kabaligtaran ng pagiging alipin sa kasunod na sugnay.
- source_word: ἐπαγγελλόμενοι
  choice: Nangangako
  rationale: Pinananatili nito ang tahasang diwa ng pagbibigay ng pangako, hindi lamang pag-aalok o pagpapahayag.
- source_word: δοῦλοι
  choice: mga alipin
  rationale: Mahalaga rito ang ganap na pagkakasalungat ng ipinapangakong kalayaan at ng tunay nilang kalagayan sa ilalim ng kapangyarihan ng kabulukan; magiging napakahina ng “mga lingkod.”
- source_word: φθορᾶς
  choice: kabulukan
  rationale: Naipahihiwatig nito ang moral na katiwalian at mapanirang pagkabulok nang hindi nililimitahan ang salita sa isa lamang sa mga aspetong iyon.
- source_word: ᾧ γάρ τις ἥττηται
  choice: sapagkat anumang nakagapi sa isang tao
  rationale: Inihahayag ito bilang pangkalahatang simulain at pinananatili ang larawan ng pagkatalo o pagkadaig ng isang tao.
- source_word: τούτῳ καὶ δεδούλωται
  choice: ay siya ring umalipin sa kanya
  rationale: Ang likas na aktibong ayos sa Filipino ay malinaw na nag-uugnay sa gumapi at sa umalipin, habang pinananatili ang leksikal na ugnayan sa “mga alipin” at ang bunga ng ganap na pagkagapi.
theological_decisions:
- issue: Ang tindi ng δοῦλοι/δεδούλωται sa paghahambing ng huwad na kalayaan at tunay na pagkaalipin
  choice: Gamitin ang “mga alipin” at “umalipin,” hindi ang mas banayad na “mga lingkod” o “nagpasunod.”
  alternative: mga lingkod; nasa pagkaalipin; nagpasunod
  rationale: 'Nakasalalay ang diin ng talata sa matinding kabalintunaan: nangangako sila ng kalayaan ngunit sila mismo ay nasa kapangyarihan ng kabulukan. Pinakamalinaw itong naipapahayag ng magkakaugnay na “alipin/umalipin.”'
- issue: Saklaw ng kahulugan ng φθορά
  choice: Kabulukan, na may talab na moral na katiwalian at mapanirang pagkasira
  alternative: pagkasira; katiwalian
  rationale: Maaaring saklawin ng salitang Griyego ang pagkabulok, katiwalian, at kapahamakan. Hindi dapat paliitin ang kahulugan sa purong moral na kasamaan o purong pisikal na pagkasira.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sila mismo” upang mapanatili ang mariing αὐτοὶ, at ang magkaugnay na “mga alipin/umalipin” upang madama ang retorikal at teolohikal na puwersa ng Griyego.
