  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing pagsasalin: naipapahayag ang pangako ng kalayaan, ang mariing kabalintunaang sila mismo ay mga alipin ng φθορά, at ang pangkalahatang simulain sa huling sugnay. Gayunman, ang “ay siya ring umalipin sa kanya” ay aktibo at nakaraang pangyayari ang dating, samantalang ang δεδούλωται ay perpektong pawatas na nagsasaad na ang taong nadaig ay nasa bunga o kalagayan ng pagkaalipin. Ang “ay inalipin din nito” ay mas malapit sa tinig at resulta ng Griyego.'
  naturalness: Natural at angkop sa modernong Filipino ang “Nangangako sila sa kanila ng kalayaan” at “mga alipin ng kabulukan.” Mas malinaw at mas maayos ang hulíng pangungusap kung gagamit ng “ang sinumang nadaig ng anuman ay inalipin din nito,” dahil tuwirang natutukoy ang “anuman” bilang pinagmumulan ng pagkaalipin at naiiwasan ang bahagyang malabong “siya ring umalipin.”
  terminology: Ang “kalayaan,” “mga alipin,” at “kabulukan” ay angkop. Pinananatili ng “mga alipin/inalipin” ang sinadyang ugnayang leksikal ng δοῦλοι/δεδούλωται at ang matinding pagsalungat ng huwad na pangako ng kalayaan sa tunay na pagkaalipin. Ang talab ng “kabulukan” ay sapat na malawak para sa φθορά; ang talab na “pagkasira” ay wastong alternatibo sa talab-paa.
  issues:
  - severity: medium
    issue: Ang huling sugnay na “ay siya ring umalipin sa kanya” ay hindi sapat na naipahihiwatig ang perpektong pawatas na δεδούλωται.
    rationale: Ang Griyego ay nagsasaad na ang sinumang nadaig ng isang bagay ay inalipin na rin nito, na may bunga o nagpapatuloy na kalagayan ng pagkaalipin. Ang aktibong “umalipin” ay mas madaling mabasa bilang simpleng nakaraang pagkilos kaysa bilang resultang kalagayan.
  revised_text: Nangangako sila sa kanila ng kalayaan, samantalang sila mismo ay mga alipin ng kabulukan[a]; sapagkat ang sinumang nadaig ng anuman ay inalipin din nito.
