  text: ὑπέρογκα γὰρ ματαιότητος φθεγγόμενοι δελεάζουσιν ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις τοὺς ⸀ὀλίγως ⸀ἀποφεύγοντας τοὺς ἐν πλάνῃ ἀναστρεφομένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/018.yaml
  text: For[a], speaking inflated words of emptiness, they entice by fleshly desires and sensuality those who are barely escaping from those who live in error[d][c][b],
translation:
  language: tl
  text: Sapagkat bumibigkas sila ng magagarbong pananalitang hungkag, at inaakit nila sa pamamagitan ng mga pagnanasa ng laman at kahalayan ang mga halos nakatatakas mula sa mga namumuhay sa kamalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang ilang sinaunang manuskrito ay may “ang mga tunay na nakatatakas.” Maaari ring unawain ang pangunahing pagbasa bilang “ang mga kapapasimula pa lamang tumakas.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπέρογκα ματαιότητος
  choice: matatayog ngunit hungkag na mga salita
  rationale: Ang ὑπέρογκα ay tumutukoy sa mapagmalaki o labis na matatayog na pananalita, samantalang inilalarawan ng ματαιότητος ang kawalang-laman o kabuluhan nito. Ang pariralang ito ay natural sa modernong Tagalog at pinananatili ang pagtutunggali ng maringal na anyo at hungkag na diwa.
- source_word: φθεγγόμενοι
  choice: nagsasalita
  rationale: Likas at malinaw na katumbas ng participle na naglalarawan kung paano sila nang-aakit.
- source_word: δελεάζουσιν
  choice: inaakit nila
  rationale: Ipinahihiwatig ng pandiwa ang pang-akit na gaya ng paggamit ng pain; ang “inaakit” ay natural at may sapat na mapanlinlang na puwersa sa konteksto.
- source_word: ἐν ἐπιθυμίαις σαρκὸς
  choice: sa pamamagitan ng mga pagnanasa ng laman
  rationale: Ang ἐν ay ipinapakahulugang paraan o kasangkapan. Pinananatili ng “ng laman” ang metaporikal na wika ng σάρξ nang hindi ito pinalalawak bilang isang sistematikong doktrinal na termino.
- source_word: ἀσελγείαις
  choice: kahalayan
  rationale: Tumutukoy ito sa walang-pigil at mahalay na asal. Ang abstraktong “kahalayan” ay malinaw at dignidad ang rehistro.
- source_word: ὀλίγως ἀποφεύγοντας
  choice: mga halos nakatatakas pa lamang
  rationale: Ipinapakita ng “halos” ang kakapusan o pagiging alanganin ng pagtakas, habang ipinahihiwatig ng “pa lamang” na kasalukuyan o kasisimula pa lamang ang prosesong ito. Inilalagay sa talababa ang mahalagang tekstuwal na alternatibo.
- source_word: τοὺς ἐν πλάνῃ ἀναστρεφομένους
  choice: mga namumuhay sa kamalian
  rationale: Ang ἀναστρεφομένους ay tumutukoy sa paraan ng pamumuhay o asal, at ang πλάνη ay kamalian o pagkaligaw. Hindi nito ipinapalagay na kamalian lamang, sa halip na mga taong namumuhay rito, ang tuwirang pinagmumulan ng pagtakas.
theological_decisions:
- issue: Kahulugan ng σάρξ sa moral na konteksto
  choice: “mga pagnanasa ng laman”
  alternative: “makasalanang mga pagnanasa”
  rationale: Pinananatili ng salin ang metapora ng Griyego at hindi ipinapasok ang higit na interpretatibong konsepto ng “makasalanang kalikasan.”
- issue: Kalagayan ng mga inaakit
  choice: “mga halos nakatatakas pa lamang”
  alternative: “mga nakatakas na”
  rationale: Pinananatili ang nagpapatuloy at alanganing katangian ng pagtakas at hindi nagpapasiya kung ganap o pangkaligtasan ang kanilang pagtakas.
- issue: Pinagmumulan ng pagtakas
  choice: “mula sa mga namumuhay sa kamalian”
  alternative: “mula sa kamalian”
  rationale: Ang sintaks ay likas na nag-uugnay sa object ng pagtakas sa mga taong namumuhay sa kamalian, kaya pinananatili ang personal na referent.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignidad, at angkop sa pampublikong pagbasa. Ginamit ang “nakatatakas” sa halip na mas kolokyal na “nakakatakas,” at iniwasan ang labis na teknikal o denominasyonal na pananalita.
