revisions:
- from: Sapagkat nagsasalita sila ng matatayog ngunit hungkag na mga salita, at inaakit nila sa pamamagitan ng mga pagnanasa ng laman at kahalayan ang mga halos nakatatakas pa lamang mula sa mga namumuhay sa kamalian.[a]
  to: Sapagkat bumibigkas sila ng magagarbong pananalitang hungkag, at inaakit nila sa pamamagitan ng mga pagnanasa ng laman at kahalayan ang mga halos nakatatakas mula sa mga namumuhay sa kamalian.[a]
  rationale: Pinahusay ang idiomang Tagalog para sa mapagmalaki at hungkag na pananalita. Nilinaw rin ang talababa upang hindi mapaghalo ang alternatibong tekstuwal na pagbasa na “tunay na” at ang posibleng semantikong pag-unawa sa pangunahing pagbasa na ὀλίγως. Pinanatili ang marupok at nagpapatuloy na katangian ng pagtakas, ang personal na pinagmumulan nito, at ang metaporikal na “laman.”
