  source_fidelity: 'Ang pangunahing diwa ay mahusay na naipapasa: ang mga huwad na guro ay bumibigkas ng mayabang ngunit hungkag na pananalita at umaakit sa mga taong nasa marupok na yugto ng paglayo sa mga namumuhay sa kamalian. Gayunman, ang talababa ay kailangang linawin ang tekstuwal na alternatibo at ihiwalay ito sa semantikong posibilidad ng ὀλίγως.'
  naturalness: Natural ang pangungusap sa modernong Filipino, ngunit mas tuwiran at mas malinaw ang “magagarbong pananalitang hungkag” kaysa “matatayog ngunit hungkag na mga salita.” Ang “halos nakatatakas pa lamang” ay maaaring basahin bilang sabay na ‘halos’ at ‘kasisimula’; mas malinaw ang pangunahing pagbasa na “halos nakatatakas,” habang inilalagay sa talababa ang posibleng pagbasa na ‘kapapasimula pa lamang tumakas.’
  terminology: Ang “mga pagnanasa ng laman” ay angkop na pinananatili ang metapora ng σάρξ nang hindi nagdaragdag ng denominasyonal na kahulugan. Ang “kahalayan” ay sapat na katumbas ng ἀσελγείαις. Ang “kamalian” para sa πλάνη ay katanggap-tanggap sa kontekstong ito.
