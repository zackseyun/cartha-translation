id: 2PE.2.15
reference: 2 Peter 2:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀καταλιπόντες εὐθεῖαν ὁδὸν ἐπλανήθησαν, ἐξακολουθήσαντες τῇ ὁδῷ τοῦ Βαλαὰμ τοῦ ⸀Βοσὸρ ὃς μισθὸν ἀδικίας ἠγάπησεν
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/015.yaml
  text: Having abandoned the straight way[a], they went astray, having followed the way of Balaam son of Bosor[b], who loved the wages of unrighteousness.
translation:
  language: tl
  text: Iniwan nila ang tuwid na daan at naligaw sila nang sundan nila ang daan ni Balaam na anak ni Bosor,[a] na umibig sa kabayaran ng kalikuan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bosor ang anyong nasa tekstong Griyego; sa Lumang Tipan, karaniwang tinatawag si Balaam na anak ni Beor.
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin ang naunang bahagi: “naligaw sila sa pagsunod sa daan ni Balaam.”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: καταλιπόντες
  choice: Iniwan nila
  rationale: Ipinahahayag ang naunang kilos ng aorist participle sa natural na modernong Tagalog. Ang “iniwan” ay malinaw at hindi nagdaragdag ng antas ng intensiyon na maaaring ipahiwatig ng “tinalikuran.”
- source_word: εὐθεῖαν ὁδὸν
  choice: ang tuwid na daan
  rationale: Pinananatili ang literal at moral na larawan ng isang tuwid na landas sa halip na gawing interpretibong “tamang daan.”
- source_word: ἐπλανήθησαν
  choice: naligaw sila
  rationale: Natural na inilalarawan ang moral at espirituwal na paglihis nang hindi nagpapahiwatig ng panlabas na tagapagligaw na hindi tahasang binanggit.
- source_word: ἐξακολουθήσαντες
  choice: nang sundan nila
  rationale: Natural na Tagalog para sa participle at maaaring magpahiwatig ng kaugnay o sanhi/paraan na kilos nang hindi lubusang isinasara ang ugnayang sintaktiko.
- source_word: τῇ ὁδῷ
  choice: ang daan
  rationale: Pinananatili ang pag-uulit ng larawang-daan na nasa Griyego.
- source_word: τοῦ Βαλαὰμ τοῦ Βοσὸρ
  choice: ni Balaam na anak ni Bosor
  rationale: Ang magkasunod na genitive ay likas na nauunawaan bilang pangalan at filiación; “Bosor” ang anyong nasa tekstong Griyego.
- source_word: μισθὸν ἀδικίας
  choice: kabayaran ng kalikuan
  rationale: Ang “kabayaran” ay malinaw na payoff o bayad, samantalang ang “kalikuan” ay nagpapanatili ng moral at biblikal na bigat ng ἀδικία.
- source_word: ἠγάπησεν
  choice: umibig
  rationale: Tuwirang isinasalin ang ἀγαπάω at pinananatili ang mariing disposisyon ni Balaam sa masama niyang pakinabang.
theological_decisions:
- issue: Larawan ng moral na daan sa εὐθεῖαν ὁδὸν at τῇ ὁδῷ
  choice: Panatilihin ang “tuwid na daan” at “daan.”
  alternative: “tamang landas” o “tunay na daan”
  rationale: Ang kongkretong larawan ng paglakad at pagkaligaw ay bahagi ng pahayag; ang mga alternatibo ay higit na interpretibo.
- issue: Pagkakakilanlan ng Βοσόρ
  choice: Bosor sa pangunahing teksto, na may paliwanag tungkol sa Beor sa talababa.
  alternative: Beor sa pangunahing teksto
  rationale: Iginagalang ng pangunahing teksto ang anyong Βοσόρ sa SBLGNT, habang tinutulungan ng talababa ang mga mambabasang pamilyar sa pangalang Beor sa Lumang Tipan.
- issue: Ugnayan ng ἐξακολουθήσαντες sa ἐπλανήθησαν
  choice: “naligaw sila nang sundan nila”
  alternative: “naligaw sila sa pagsunod” o “naligaw sila at sumunod”
  rationale: Ang napiling anyo ay natural at pinananatiling medyo bukas kung ang participle ay paraan/sanhi o kasabay na kilos; inilalahad sa talababa ang mas tahasang alternatibo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang biblikal na larawang “tuwid na daan” at ang salitang “kalikuan” para sa moral na bigat ng talata; iniwasan ang denominasyonal o labis na interpretibong pananalita.
