id: 2PE.2.1
reference: 2 Peter 2:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες παρεισάξουσιν αἱρέσεις ἀπωλείας, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/001.yaml
  text: But false prophets also arose among the people[a], just as there will also be false teachers among you, who will secretly bring in destructive heresies, even denying the Master who bought them[b], bringing swift destruction on themselves.
translation:
  language: tl
  text: Ngunit nagkaroon din ng mga huwad na propeta sa gitna ng bayan, kung paanong magkakaroon din ng mga huwad na guro sa gitna ninyo. Palihim silang magpapasok ng mapanirang mga hidwang aral[a] at itatatwa pa nila ang Amo na bumili sa kanila[b]. Sa gayon, magdudulot sila ng mabilis na kapahamakan sa kanilang sarili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mapanirang mga pangkat” o “mga sektang humahantong sa kapahamakan.” Ang salitang Griyego ay maaaring tumukoy sa mga pangkat o sekta, ngunit dito ay malamang na tumutukoy sa mga aral o kilusang humahantong sa kapahamakan.
    reason: lexical_alternative
  - marker: b
    text: O “ang Panginoong tumubos sa kanila.” Literal na sinasabi ng Griyego, “ang Amo na bumili sa kanila,” kaya pinananatili rito ang larawan ng pagbili nang hindi nilulutas ang mas malawak na usaping teolohikal tungkol sa saklaw nito.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένοντο
  choice: nagkaroon
  rationale: Likas na salin sa Filipino para sa paglitaw o pagkakaroon noon ng mga huwad na propeta sa loob ng bayan.
- source_word: ψευδοπροφῆται
  choice: mga huwad na propeta
  rationale: Tuwiran at malinaw na katumbas ng tambalang pangngalan.
- source_word: ἐν τῷ λαῷ
  choice: sa gitna ng bayan
  rationale: Ipinahihiwatig ang bayang tipan sa konteksto nang hindi tahasang idinaragdag ang “Israel” sa pangunahing teksto.
- source_word: ὡς καὶ ἐν ὑμῖν ἔσονται
  choice: kung paanong magkakaroon din ... sa gitna ninyo
  rationale: Pinananatili ang paghahambing ng nagdaang mga huwad na propeta at ng darating na mga huwad na guro sa mga mambabasa.
- source_word: ψευδοδιδάσκαλοι
  choice: mga huwad na guro
  rationale: Tuwirang salin na nagpapanatili ng pagkakapantay sa “mga huwad na propeta.”
- source_word: παρεισάξουσιν
  choice: palihim silang magpapasok
  rationale: Ipinapakita ang palihim at mapanlinlang na pagpapakilala ng mga aral, pati ang aspektong panghinaharap.
- source_word: αἱρέσεις ἀπωλείας
  choice: mapanirang mga hidwang aral
  rationale: Ang “hidwang aral” ay nauunawaan sa modernong Filipino bilang aral na lumilihis sa katotohanan; ang “mapanira” ay nagpapahayag na humahantong ang mga ito sa kapahamakan.
- source_word: τὸν ... δεσπότην
  choice: ang Amo
  rationale: Pinananatili ang pagkakaiba ng δεσπότης sa κύριος at ang diwa ng may-ari o makapangyarihang panginoon. Mas tuwiran ang “Amo” kaysa “Panginoon” para sa natatanging salitang Griyego rito.
- source_word: ἀγοράσαντα αὐτούς
  choice: na bumili sa kanila
  rationale: Pinananatili ang metapora ng pagbili at hindi ito pinapaliit sa isang tiyak na doktrinal na paliwanag gaya ng “tumubos.”
- source_word: ἀρνούμενοι
  choice: itatatwa pa nila
  rationale: Tuwirang ipinapahayag ang pagtanggi o pagkakaila sa Amo; ipinakikita ng “pa” ang diin ng καί.
- source_word: ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν
  choice: magdudulot sila ng mabilis na kapahamakan sa kanilang sarili
  rationale: Pinananatili ang pansariling bunga ng kanilang ginawa at ang diwa ng mabilis o di-magtatagal na kapahamakan.
theological_decisions:
- issue: Kahulugan ng αἱρέσεις sa kontekstong ito
  choice: mga hidwang aral
  alternative: mga mapanirang pangkat o sekta
  rationale: Maaaring tumukoy ang αἵρεσις sa pangkat, partido, o sekta, ngunit ang palihim na pagpapasok at pagtatatwa sa Amo ay nagbibigay-diin dito sa mapanirang aral. Inilalagay sa talababa ang tunay na leksikal na alternatibo.
- issue: Diwa at saklaw ng τὸν ἀγοράσαντα αὐτοὺς δεσπότην
  choice: ang Amo na bumili sa kanila
  alternative: ang Panginoong tumubos sa kanila
  rationale: Pinananatili ang mismong metapora ng pagbili at ang teolohikal na tensiyon ng pahayag, nang hindi nagpapasya tungkol sa kalikasan o saklaw ng pagbiling ito.
- issue: Pagkilala sa δεσπότης bilang naiiba sa κύριος
  choice: Amo
  alternative: Panginoon o Makapangyarihang Pinuno
  rationale: Ipinakikita ng “Amo” ang awtoridad at pagmamay-ari na taglay ng δεσπότης at hindi nito pinapantay nang tahimik ang salita sa karaniwang salin ng κύριος.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bayan” para sa covenant people nang hindi labis na tinutukoy ang Israel sa pangunahing teksto, “hidwang aral” para sa malinaw ngunit hindi teknikal na paglilihis sa katotohanan, at “Amo” upang mapanatili ang leksikal na pagkakaiba ng δεσπότης sa κύριος.
