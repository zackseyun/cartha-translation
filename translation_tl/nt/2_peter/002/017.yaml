  text: Οὗτοί εἰσιν πηγαὶ ἄνυδροι ⸂καὶ ὁμίχλαι⸃ ὑπὸ λαίλαπος ἐλαυνόμεναι, οἷς ὁ ζόφος τοῦ ⸀σκότους τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/017.yaml
  text: These are waterless springs and mists driven by a storm[b][a], for whom the gloom of darkness has been kept.
translation:
  language: tl
  text: Ang mga taong ito ay mga bukal na walang tubig at mga manipis na ulap[a] na itinataboy ng malakas na bagyo. Para sa kanila ay nakalaan ang pusikit na kadiliman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga hamog-singaw.” Ang salitang Griyego ay mas tiyak na tumutukoy sa hamog o fog; isinasalin din ito ng ilan bilang “mga ulap.”
    reason: lexical_alternative
  - marker: b
    text: O “ang karimlan ng kadiliman ay naingatan para sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πηγαὶ ἄνυδροι
  choice: mga bukal na walang tubig
  rationale: Ang πηγή ay karaniwang bukal o pinagmumulan ng tubig, hindi balon na hinukay. Napananatili ng parirala ang kabalintunaan ng isang bukal na inaasahang may tubig ngunit wala.
- source_word: ὁμίχλαι
  choice: mga ulap
  rationale: Ang ὁμίχλη ay mas tiyak na manipis na ulap, ambon-singaw, o hamog. Ginamit sa teksto ang natural na 'mga ulap,' habang inilalagay sa talababa ang mas tiyak na kahulugang 'mga hamog' upang hindi mawala ang leksikal na detalye.
- source_word: ὑπὸ λαίλαπος ἐλαυνόμεναι
  choice: itinataboy ng malakas na bagyo
  rationale: Ang λαῖλαψ ay marahas na unos o bagyo, at ang ἐλαύνω ay magtaboy o magtulak. Nananatili ang pasibong larawan at ang lakas ng pangyayari.
- source_word: οἷς
  choice: para sa kanila
  rationale: Bagaman pambabaeng maramihan ang mga talinghagang pinakamalapit dito, ang panghalip ay tumutukoy sa mga taong inilalarawan ng Οὗτοι. Kaya personal na 'kanila' ang angkop.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: ang pusikit na kadiliman
  rationale: Ang ζόφος ay makapal at nakatatakot na dilim, at pinatitindi ito ng σκότος. Ang 'pusikit na kadiliman' ay natural at marangal sa modernong Tagalog, bagaman hindi nito ginagaya nang salita-sa-salita ang dalawang pangngalan.
- source_word: τετήρηται
  choice: inilalaan
  rationale: Ang perpektong pasibo ng τηρέω ay nagsasaad na ito ay inilaan o itinabi at nananatiling nakalaan. Ang 'inilalaan' ay malinaw sa konteksto ng paghuhukom; tinutukoy sa talababa ang alternatibong 'iniingatan.'
theological_decisions:
- issue: Ang huling sugnay bilang wika ng paghuhukom
  choice: 'Panatilihing pasibo ang pahayag at huwag pangalanan ang gumagawa: ''Para sa kanila ay inilalaan ang pusikit na kadiliman.'''
  alternative: Idagdag ang 'ng Diyos' bilang gumagawa ng paglalaan.
  rationale: Ipinahihiwatig ng Griyego ang banal na paghuhukom ngunit hindi nito tahasang pinapangalanan ang Diyos bilang gumagawa. Hindi dapat idagdag sa salin ang hindi tahasang sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinili ang 'ang mga taong ito' upang luminaw na mga tao ang tinutukoy ng Οὗτοι; pinanatili ang matitingkad na talinghaga at ang di-tahasang gumagawa sa pasibong huling sugnay.
