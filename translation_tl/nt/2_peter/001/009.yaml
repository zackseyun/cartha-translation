  terminology: Ang “mga bagay na ito” ay mas tuwirang katumbas ng ταῦτα kaysa “ganitong mga katangian,” bagaman wastong ipinaliwanag ng talababa na tumutukoy ito sa mga katangiang nasa naunang talata. Ang “paglilinis” ay angkop para sa καθαρισμός at hindi nagpapataw ng paliwanag tungkol sa gumawa o paraan ng paglilinis.
