  text: ᾧ γὰρ μὴ πάρεστιν ταῦτα, τυφλός ἐστιν μυωπάζων, λήθην λαβὼν τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ⸀ἁμαρτημάτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/009.yaml
  text: For whoever lacks these things is blind[a], being shortsighted[b], having forgotten the cleansing of his former sins.
translation:
  language: tl
  text: Sapagkat ang sinumang wala ng mga bagay na ito[a] ay bulag, at ang nakikita lamang niya ay ang malalapit na bagay[b]; nalimutan na niya ang paglilinis sa kanya mula sa kanyang mga dating kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga katangiang ito.” Tumutukoy ito sa mga katangiang binanggit sa naunang talata.
    reason: lexical_alternative
  - marker: b
    text: O “maikli ang paningin” o “malabo ang paningin sa malayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ γὰρ μὴ πάρεστιν ταῦτα
  choice: Sapagkat ang sinumang walang ganitong mga katangian
  rationale: Ginawang natural sa Tagalog ang idyomang nagsasabing hindi taglay ng isang tao ang mga bagay na ito. Ang “mga katangian” ay malinaw na tumutukoy sa mga katangiang binanggit sa naunang talata.
- source_word: τυφλός ἐστιν
  choice: ay bulag
  rationale: Tuwirang pinananatili ang matalinghagang paglalarawan ng Griyego.
- source_word: μυωπάζων
  choice: nakakakita lamang ng malapit
  rationale: Ipinahahayag ang diwa ng pagiging nearsighted/shortsighted sa karaniwan at madaling maunawaang Tagalog, habang hindi ipinapasyang lubusan kung nagpapaliwanag o nagpapatindi ito sa “bulag.”
- source_word: λήθην λαβὼν
  choice: nalimutan na niya
  rationale: Natural na salin ng idyomang literal na “tumanggap ng pagkalimot.”
- source_word: τοῦ καθαρισμοῦ
  choice: nilinis siya mula sa
  rationale: Ginawang pandiwa ang pangngalang Griyego upang maging likas sa Tagalog, habang pinananatili ang diwa ng paglilinis mula sa kasalanan.
- source_word: τῶν πάλαι αὐτοῦ ἁμαρτημάτων
  choice: dati niyang mga kasalanan
  rationale: Pinananatili ang isahang pagtukoy at ang temporal na diwa ng πάλαι bilang mga kasalanan noong nakaraan.
theological_decisions:
- issue: Ugnayan ng “bulag” at μυωπάζων
  choice: ay bulag at nakakakita lamang ng malapit
  alternative: ay bulag dahil maikli ang paningin
  rationale: Hindi ginawang tiyak na sanhi o paliwanag ang participle; pinananatili ang tensiyon ng magkatabing larawang “bulag” at “nakakakita lamang ng malapit.”
- issue: Diwa ng paglilinis sa mga dating kasalanan
  choice: nilinis siya mula sa dati niyang mga kasalanan
  alternative: ang paglilinis ng dati niyang mga kasalanan
  rationale: Ang verbal na anyo ay mas natural sa Tagalog at ipinapakitang ang tao ang tumanggap ng paglilinis, nang hindi dinaragdagan kung sino ang tahasang gumawa nito o sa anong paraan.
- issue: Kasarian ng αὐτοῦ
  choice: niyang
  alternative: kanilang
  rationale: Ang Griyego ay isahan at tumutukoy sa isang kinatawang indibidwal. Sa Tagalog, walang likas na kasarian ang “niya,” kaya napapanatili kapwa ang bilang at generic na pagtukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ang sinumang” para sa pangkalahatang isahang pagtukoy at ang walang-kasariang panghalip na “niya.”
