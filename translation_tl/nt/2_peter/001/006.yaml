  text: ἐν δὲ τῇ γνώσει τὴν ἐγκράτειαν, ἐν δὲ τῇ ἐγκρατείᾳ τὴν ὑπομονήν, ἐν δὲ τῇ ὑπομονῇ τὴν εὐσέβειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/006.yaml
  text: and in knowledge[a], self-control; and in self-control, steadfastness; and in steadfastness, godliness[b],
translation:
  language: tl
  text: at sa kaalaman, pagpipigil sa sarili; at sa pagpipigil sa sarili, pagtitiyaga[a]; at sa pagtitiyaga, pagiging maka-Diyos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matatag na pagtitiis,” “katatagan,” o “matiyagang pananatili” para sa ὑπομονή.
    reason: lexical_alternative
  - marker: b
    text: Pinaikli ang pangungusap sa Griyego. Ipinagpapatuloy nito mula sa naunang talata ang tanikala ng mga katangian, kung saan ang isang katangian ay dinaragdagan ng kasunod.
    reason: cross_reference
lexical_decisions:
- source_word: γνώσει
  choice: kaalaman
  rationale: Tuwirang katumbas ito ng γνῶσις at angkop sa magkakaugnay na talaan ng mga katangian.
- source_word: ἐγκράτειαν / ἐγκρατείᾳ
  choice: pagpipigil sa sarili
  rationale: Malinaw nitong ipinapahayag ang pagpipigil o pamamahala sa sariling mga pagnanasa at udyok.
- source_word: ὑπομονήν / ὑπομονῇ
  choice: pagtitiyaga
  rationale: Ipinahihiwatig ng ὑπομονή ang matatag na pananatili sa gitna ng hirap; natural at malawak ang saklaw ng “pagtitiyaga” sa modernong Tagalog.
- source_word: εὐσέβειαν
  choice: pagiging maka-Diyos
  rationale: Ipinapahayag nito ang debosyon at paggalang sa Diyos na nakikita sa paraan ng pamumuhay, nang hindi nililimitahan ang diwa sa ritwal na kabanalan.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: at sa ..., ...
  rationale: Pinananatili nito ang pinaikling ayos ng Griyego at ang pagpapatuloy ng tanikala ng mga katangian mula sa naunang talata.
- source_word: δέ
  choice: at
  rationale: Nag-uugnay ito rito ng magkakasunod na sangkap at hindi nagpapahiwatig ng matinding pagsalungat.
theological_decisions:
- issue: Pinaikling sintaksis ng tanikala ng mga katangian
  choice: Panatilihin ang siksik na ayos na “at sa ..., ...”
  alternative: Palawakin bilang “idagdag ninyo sa ... ang ...”
  rationale: Ang Griyego ay sadyang eliptikal at ipinagpapatuloy ang utos sa naunang talata. Ang pagpapanatili sa pinaikling anyo ay umiiwas sa di-kinakailangang pagpapaliwanag sa mismong teksto.
- issue: Saklaw ng εὐσέβεια
  choice: pagiging maka-Diyos
  alternative: kabanalan; debosyon sa Diyos
  rationale: Nananatiling bukas ang salin sa diwa ng mapitagang debosyon at pamumuhay sa harap ng Diyos, nang hindi ito ipinapantay lamang sa moral na kalinisan o sa panlabas na gawaing panrelihiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang paulit-ulit at eliptikal na anyo ng orihinal habang gumamit ng mga karaniwang salitang mauunawaan ng pangkalahatang mambabasa.
