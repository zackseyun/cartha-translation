  text: δίκαιον δὲ ἡγοῦμαι, ἐφ’ ὅσον εἰμὶ ἐν τούτῳ τῷ σκηνώματι, διεγείρειν ὑμᾶς ἐν ὑπομνήσει,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/013.yaml
  text: But I consider it right[a], as long as I am in this tent, to stir you up by way of reminder,
translation:
  language: tl
  text: Ngunit itinuturing kong nararapat, habang nasa toldang ito ako, na pukawin kayo sa pamamagitan ng pagpapaalala,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιον
  choice: nararapat
  rationale: Sa pariralang kasama ang ἡγοῦμαι, ipinahihiwatig nito ang itinuturing na tama o angkop gawin; natural at marangal sa modernong Tagalog ang “nararapat.”
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapakita ang δέ ng banayad na pagsalungat o paglipat mula sa naunang pahayag; ang “Ngunit” angkop sa ugnayan ng mga talata.
- source_word: ἡγοῦμαι
  choice: itinuturing ko
  rationale: Nagsasaad ito ng pinag-isipang paghahatol, hindi lamang ng panandaliang palagay.
- source_word: ἐφ’ ὅσον
  choice: habang ... pa
  rationale: 'Sa konstruksiyong ito, temporal ang diwa: sa buong panahong nananatili siya sa kasalukuyang kalagayan.'
- source_word: σκηνώματι
  choice: tolda
  rationale: Pinananatili nito ang tahasang talinghaga ng pansamantalang tirahan para sa mortal na buhay sa katawan at inihahanda ang larawan sa kasunod na talata.
- source_word: διεγείρειν
  choice: pukawin
  rationale: Ipinahihiwatig ng pandiwa ang paggising o pag-udyok sa kamalayan at pagkilos; malinaw at natural dito ang “pukawin.”
- source_word: ἐν ὑπομνήσει
  choice: sa pamamagitan ng pagpapaalala
  rationale: Ipinapahayag ng parirala ang paraan o kasangkapang ginagamit upang pukawin ang mga mambabasa.
theological_decisions:
- issue: Ang talinghagang tinutukoy ng “toldang ito”
  choice: Panatilihin sa pangunahing teksto ang “toldang ito.”
  alternative: Isalin nang tuwiran bilang “katawang ito” o “tirahang ito.”
  rationale: Tolda ang mismong larawang ginamit sa Griyego para sa kasalukuyang mortal na buhay sa katawan. Ang pagpapanatili nito ay hindi nagpapasya nang higit sa sinasabi ng teksto at pinananatili ang kaugnayan sa larawan ng paghuhubad o pag-aalis nito sa kasunod na talata.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang talinghagang “tolda,” samantalang ginamit ang natural na ayos na “habang ... pa ako” at ang malinaw na pandiwang “pukawin.”
