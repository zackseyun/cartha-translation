  text: 'knowing this first: that every prophecy of Scripture does not come about from one''s own interpretation.'
translation:
  language: tl
  text: 'Una sa lahat, alamin ninyo ito: ang bawat propesiya sa Kasulatan ay hindi nagmumula sa sariling pagpapakahulugan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: Una sa lahat, dapat ninyong malaman ito
  rationale: Natural na Filipino para sa panimulang diin ng participial phrase; pinananatili ang kahulugan ng πρῶτον bilang bagay na dapat unahing kilalanin.
- source_word: πᾶσα προφητεία γραφῆς
  choice: ang bawat propesiya sa Kasulatan
  rationale: Tuwirang pinananatili ang distributive na πᾶσα at ang ugnayan ng propesiya sa Kasulatan.
- source_word: ἰδίας ἐπιλύσεως
  choice: sariling pagpapakahulugan
  rationale: Ang ἐπίλυσις ay maaaring tumukoy sa pagpapakahulugan o pagpapaliwanag; ang 'pagpapakahulugan' ay malinaw at likas sa modernong Filipino, habang hindi tahasang tinutukoy kung kanino ang 'sarili.'
- source_word: οὐ γίνεται
  choice: ay hindi nagmumula
  rationale: Sa konteksto ng kasunod na talata tungkol sa pinagmulan ng propesiya, ipinahahayag ng γίνεται ang paglitaw o pinagmulan, hindi lamang ang simpleng pag-iral.
theological_decisions:
- issue: Saklaw ng pagtanggi sa πᾶσα ... οὐ
  choice: ang bawat propesiya ... ay hindi
  alternative: walang propesiya ... ang
  rationale: Pinananatili ang anyo at diin ng Griyegong 'bawat ... hindi' nang hindi binabago ang praktikal na diwa na walang propesiya sa Kasulatan ang nagmumula rito.
- issue: Hindi tahasang may-ari ng ἰδίας
  choice: sariling pagpapakahulugan
  alternative: sariling pagpapakahulugan ng propeta / ng mambabasa
  rationale: Hindi tahasang sinasabi ng Griyego kung ang tinutukoy ay ang propeta, ang tagapagpaliwanag, o isang tao sa pangkalahatan; hindi nilulutas ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Iniwasan ang labis na teknikal o denominasyonal na pananalita; pinanatili ang bahagyang kalabuan ng pariralang 'sariling pagpapakahulugan.'
