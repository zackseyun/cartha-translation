  text: Therefore I will always be ready to remind you about these things[a], even though you know them and have been established in the present truth.
translation:
  language: tl
  text: Kaya lagi akong magiging handang ipaalala sa inyo ang mga bagay na ito, kahit alam na ninyo ang mga ito at matatag na kayo sa katotohanang nasa inyo ngayon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa kasalukuyang katotohanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Kaya
  rationale: Ipinakikita nito ang bunga o kongklusyon mula sa naunang pangangatwiran sa natural na modernong Tagalog.
- source_word: μελλήσω
  choice: ipaaalala ko
  rationale: Ang anyong panghinaharap kasama ng pawatas ay nagpapahayag ng balak o matatag na layunin. Sa Tagalog, likas itong naipahahayag ng pandiwang panghinaharap; ang patuloy na kahulugan ay nililinaw ng ‘lagi.’
- source_word: ἀεὶ
  choice: lagi
  rationale: Tuwirang ipinahahayag ang paulit-ulit at nagpapatuloy na pagkilos.
- source_word: ὑπομιμνῄσκειν
  choice: ipaaalala
  rationale: Tumpak at karaniwang salin para sa pagpapagunita sa isang tao ng alam na niya.
- source_word: περὶ τούτων
  choice: ang mga bagay na ito
  rationale: Likas na Tagalog na nagpapahayag ng paksa ng pagpapaalala.
- source_word: καίπερ
  choice: kahit
  rationale: Malinaw na pinananatili ang diwang pagsalungat o concession ng Griyego.
- source_word: εἰδότας
  choice: alam na ninyo ang mga ito
  rationale: Ang ganap na aspekto ng οἶδα ay tumutukoy sa umiiral nang kaalaman; tahasang inuulit ang layon upang maging malinaw sa Tagalog.
- source_word: ἐστηριγμένους
  choice: matatag na kayo
  rationale: Ipinahahayag ang nananatiling kalagayan na bunga ng naunang pagpapatatag, nang hindi dinaragdagan kung sino ang gumawa nito.
- source_word: ἐν τῇ παρούσῃ ἀληθείᾳ
  choice: sa katotohanang nasa inyo ngayon
  rationale: Natural na ipinahahayag ang katotohanang kasalukuyang naroon o taglay ng mga mambabasa, habang kinikilala sa talababa ang mas pormal na alternatibo.
theological_decisions:
- issue: Kahulugan ng ‘ἐν τῇ παρούσῃ ἀληθείᾳ’
  choice: sa katotohanang nasa inyo ngayon
  alternative: sa kasalukuyang katotohanan
  rationale: Hindi ginagawang teknikal na katawagan para sa isang natatanging panahon o sistemang teolohikal ang parirala. Ipinahahayag ng pangunahing salin ang katotohanang kasalukuyang nasa mga mambabasa, samantalang pinananatili ng talababa ang mas literal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Iniwasan ang sobrang teknikal o denominasyonal na pananalita.
