  source_fidelity: Ang draft ay wastong naghahatid sa pangkalahatan ng masigasig na pagsisikap, ng metaporikong pagtukoy sa kamatayan ni Pedro, at ng pag-alaala sa mga naunang bagay. Gayunman, hindi sapat na naihahayag ng “maalaala ninyo” ang kayariang ἔχειν ὑμᾶς ... ποιεῖσθαι, na tumutukoy sa pagkakaroon nila ng kakayahan o paraan upang makapag-alaala. Ang ἑκάστοτε ay mas tumpak na “sa bawat pagkakataon” kaysa “anumang oras.”
  naturalness: Natural ang “pagsisikapan ko,” ngunit medyo lipas at hindi gaanong malinaw sa modernong Filipino ang “pagkahayo ko.” Ang “pagkatapos ng pag-alis ko” ay malinaw, natural, at pinananatili ang metapora ng ἔξοδος. Ang binagong pangungusap ay maayos ang daloy at ugnayan ng layunin.
  terminology: Ang “pag-alis” ay angkop na pangunahing salin para sa ἔξοδος; hindi nito tahasang isinasalin ang metapora bilang kamatayan. Ang talababa ay maaaring maglinaw na kamatayan ang tinutukoy. Ang “alalahanin ang mga bagay na ito” ay angkop para sa τὴν τούτων μνήμην ποιεῖσθαι.
