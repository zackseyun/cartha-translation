base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/015.yaml
  text: And I will make every effort so that[a], after my departure, you may be able at any time to recall these things.
translation:
  language: tl
  text: At pagsisikapan ko rin na, pagkatapos ng pag-alis ko[a], magagawa ninyong alalahanin ang mga bagay na ito sa bawat pagkakataon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tahasan, “pagkamatay ko.” Ang salitang Griyego ay “pag-alis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσω
  choice: pagsisikapan ko
  rationale: Ipinahahayag ng panghinaharap na pandiwa ang taimtim at masikap na pagsisikap; natural at malinaw ito sa modernong Tagalog.
- source_word: δὲ
  choice: At
  rationale: Nagpapatuloy ito sa naunang diwa sa halip na magpahayag ng matinding pagsalungat.
- source_word: καὶ
  choice: rin na
  rationale: Sa kayariang ito, ipinapakita ng καί ang karagdagang layunin ng pagsisikap ni Pedro; likas itong naipahahayag sa Tagalog sa pamamagitan ng “rin na.”
- source_word: ἑκάστοτε
  choice: anumang oras
  rationale: Tumutukoy ito sa bawat pagkakataon o kailanman kailangan; pinananatili ng “anumang oras” ang lawak ng kahulugan.
- source_word: ἔχειν ὑμᾶς
  choice: maalaala ninyo
  rationale: Ang infinitibong ἔχειν sa kayariang ito ay nagpapahiwatig ng kakayahan o pagkakataon. Sa Tagalog, likas nang naipapahiwatig ng “maalaala ninyo” ang kakayahang maibalik sa isip ang mga ito.
- source_word: μετὰ τὴν ἐμὴν ἔξοδον
  choice: pagkahayo ko
  rationale: Ang ἔξοδος ay literal na pag-alis o pagyao at dito'y isang magalang na pagtukoy sa nalalapit na kamatayan ni Pedro. Pinananatili ng “pagkahayo” ang talinghaga nang hindi ito tahasang nilulutas sa pangunahing teksto.
- source_word: τὴν τούτων μνήμην ποιεῖσθαι
  choice: maalaala ... ang mga bagay na ito
  rationale: Idyoma itong nangangahulugang alalahanin o muling dalhin sa isip; natural ang “maalaala” sa kasalukuyang Tagalog.
- source_word: τούτων
  choice: ang mga bagay na ito
  rationale: Tuwirang tumutukoy ito sa mga katotohanang binibigyang-diin sa kalapit na konteksto.
theological_decisions:
- issue: Kahulugan ng ἔξοδος bilang pagtukoy sa nalalapit na wakas ni Pedro
  choice: pagkahayo ko
  alternative: pagkamatay ko
  rationale: Pinananatili sa pangunahing teksto ang talinghagang “pag-alis/pagyao,” habang nililinaw sa talababa na kamatayan ang tinutukoy. Iniiwasan nitong dagdagan o alisin ang pahiwatig ng orihinal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “pagkahayo” upang mapanatili ang eupemistiko at matalinghagang ἔξοδος; ipinaliliwanag ng talababa ang tahasang kahulugan.
