id: 2PE.1.16
reference: 2 Peter 1:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλ’ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/016.yaml
  text: For we did not make known to you the power and coming of our Lord Jesus the Messiah by following cleverly devised myths[b][a], but by becoming eyewitnesses of his majesty.
translation:
  language: tl
  text: Sapagkat hindi namin ipinaalam sa inyo ang kapangyarihan at pagdating ng ating Panginoong Jesu-Cristo[a] sa pamamagitan ng pagsunod sa mga kuwentong kathang-isip na tusong inimbento, kundi dahil naging mga saksing nakakita mismo kami sa kanyang kadakilaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Cristo” ay isang titulo na nangangahulugang “Mesiyas” o “Pinahiran.” Ang salitang Griego na isinaling “pagdating” ay maaari ring mangahulugang “presensiya” o “pagparito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σεσοφισμένοις μύθοις
  choice: mga kuwentong kathang-isip na tusong binuo
  rationale: Ipinapahayag ng parirala na ang mga kuwento ay artipisyal at mahusay o tusong nilikha. Natural sa modernong Tagalog ang “kathang-isip na tusong binuo” at nananatili ang mapanuring tono.
- source_word: ἐξακολουθήσαντες
  choice: sumunod
  rationale: Tuwirang inilalarawan ang pagsunod o pagbatay sa mga kathang-isip; sa pangungusap, ipinakikita nitong hindi iyon ang paraan ng pagpapahayag ng mga apostol.
- source_word: ἐγνωρίσαμεν
  choice: ipaalam namin sa inyo
  rationale: Natural at tumpak na katumbas ng ‘ginawang malaman’ o ‘ipinabatid,’ habang pinananatili ang tagatanggap na “sa inyo.”
- source_word: δύναμιν
  choice: kapangyarihan
  rationale: Karaniwan at tuwirang katumbas ng δύναμις sa kontekstong ito.
- source_word: παρουσίαν
  choice: pagdating
  rationale: Malamang na tumutukoy sa pagdating ni Jesus, gaya ng madalas na gamit ng παρουσία sa Bagong Tipan, ngunit itinatala sa talababa ang leksikal na posibilidad na ‘presensiya’ o ‘pagharap.’
- source_word: κυρίου
  choice: Panginoon
  rationale: Angkop na pamagat para kay Jesus at karaniwang salin ng κύριος.
- source_word: Χριστοῦ
  choice: Cristo
  rationale: Sa natural na modernong Tagalog, ang tradisyonal at malinaw na anyong “Jesu-Cristo” ay nagpapahayag sa titulong Χριστός nang hindi nagiging alanganin ang parirala.
- source_word: ἐπόπται γενηθέντες
  choice: nakita namin mismo
  rationale: Ipinahahayag sa natural na Tagalog ang diwa ng pagiging mga saksing nakakita nang personal; mas malinaw sa karaniwang mambabasa kaysa sa literal na “naging mga nakasaksi.”
- source_word: μεγαλειότητος
  choice: kadakilaan
  rationale: Pinananatili ang mataas na diwa ng magnificence o majesty at natural sa marangal na Tagalog.
- source_word: ἐκείνου
  choice: kanyang
  rationale: Malinaw na tumutukoy pabalik kay Jesu-Cristo at mas natural kaysa sa literal na demonstratibo.
theological_decisions:
- issue: Kahulugan ng παρουσία sa kontekstong cristolohikal
  choice: pagdating
  alternative: presensiya o pagharap
  rationale: Sa mga konteksto tungkol kay Jesus, ang παρουσία ay madalas tumukoy sa kanyang eskatolohikal na pagdating. Gayunman, hindi inaalis ang mas malawak na leksikal na kahulugan kaya inilalagay ang mga alternatibo sa talababa.
- issue: Pagsasalin sa Χριστοῦ bilang titulo
  choice: Cristo
  alternative: Mesiyas
  rationale: Parehong maipahahayag ang titulong ‘Pinahiran.’ Pinili ang natural at kinikilalang anyong Filipino na “Jesu-Cristo,” habang itinatala na ang Χριστός ay isang titulo at maaaring isaling “Mesiyas.”
translation_notes:
  register: 'Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Inayos ang sugnay upang malinaw ang pagtutol: hindi batay sa tusong ginawang kathang-isip, kundi sa personal na pagkakita. Ginamit ang “nakita namin mismo” upang idiomatikong maipahayag ang evidensiyal na lakas ng ἐπόπται.'
