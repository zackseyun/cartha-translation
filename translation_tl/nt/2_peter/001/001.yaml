    rationale: Ang SBLGNT ay isang pambungad na pariralang walang hayag na pandiwang “sumulat.” Bagaman maiintindihan ito bilang kaugalian ng liham, ang pagdaragdag nito ay hindi kailangan at bahagyang lumalampas sa source text.
  - severity: medium
    issue: Ang “sa pamamagitan ng katuwiran” ay pumipili ng instrumental na pagbasa para sa ἐν δικαιοσύνῃ.
    rationale: Posible ang instrumental na diwa, ngunit ang “sa katuwiran” ay mas malapit sa Griyego at mas mahusay na pinananatili ang di-tiyak na ugnayang ipinahihintulot ng ἐν.
