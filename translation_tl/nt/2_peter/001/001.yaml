id: 2PE.1.1
reference: 2 Peter 1:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/001.yaml
  text: 'Simeon Peter[a], a servant and apostle of Jesus the Messiah[d][c][b], to those who have obtained a faith as precious as ours in the righteousness of our God and Savior Jesus the Messiah:'
translation:
  language: tl
  text: 'Si Simeon Pedro[a], isang alipin at apostol ni Jesus na Mesiyas, para sa mga tumanggap ng pananampalatayang kasinghalaga ng sa amin[b] sa katuwiran[c] ng ating Diyos at Tagapagligtas na si Jesus na Mesiyas[d]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang ilang tradisyon ng teksto at salin ay gumagamit ng “Simon,” ngunit “Simeon” ang anyo sa tekstong Griyego rito.
    reason: textual_or_name_form
  - marker: b
    text: Maaari ring “pananampalatayang kapantay ng sa amin sa katayuan” o “kapantay ng sa amin sa karangalan.” Maaaring idiin ng salita ang pantay na halaga, karangalan, o pribilehiyo.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa pamamagitan ng katuwiran” o “dahil sa katuwiran.” Ang pang-ukol ay maaaring tumukoy sa paraan o sa saklaw kung saan tinanggap ang pananampalataya.
    reason: lexical_alternative
  - marker: d
    text: 'Pinakamalamang na iisang persona ang tinutukoy ng Griyego: si Jesus na Mesiyas ang “ating Diyos at Tagapagligtas.” Ang mas di-malamang na pagbasa ay tumutukoy sa dalawa: “ating Diyos at ang Tagapagligtas na si Jesus na Mesiyas.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Συμεὼν Πέτρος
  choice: Simeon Pedro
  rationale: Pinananatili ng “Simeon” ang anyong Συμεών sa SBLGNT sa halip na gawing “Simon”; “Pedro” ang nakaugaliang anyong Tagalog ng Πέτρος.
- source_word: δοῦλος
  choice: alipin
  rationale: Ipinahahayag ng δοῦλος ang lubos na pag-aari at pagpapasakop sa isang panginoon; mas tiyak dito ang “alipin” kaysa sa mas malawak na “lingkod.”
- source_word: ἀπόστολος
  choice: apostol
  rationale: Ang “apostol” ang kinikilalang katawagan sa itinalagang sugo na may natatanging atas.
- source_word: Ἰησοῦ Χριστοῦ
  choice: ni Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” sa halip na ituring lamang na bahagi ng pangalan.
- source_word: τοῖς ... λαχοῦσιν
  choice: sa mga tumanggap
  rationale: Ipinakikita ng λαγχάνω na ipinagkaloob o napasakanila ang pananampalataya, hindi na nakamit nila ito sa sariling pagsisikap.
- source_word: ἰσότιμον ... πίστιν
  choice: pananampalatayang kasinghalaga ng sa amin
  rationale: Natural na ipinahahayag ng “kasinghalaga” ang pagkakapantay sa halaga o karangalan, habang inilalahad sa talababa ang iba pang posibleng diin.
- source_word: πίστιν
  choice: pananampalataya
  rationale: Sa konteksto, tumutukoy ito sa pananampalatayang kapwa taglay ng mga mananampalataya at ng mga apostol.
- source_word: ἐν δικαιοσύνῃ
  choice: sa pamamagitan ng katuwiran
  rationale: Binabasa ang ἐν bilang nagsasaad ng paraan o batayan, ngunit pinananatili sa talababa ang posibleng diwang saklaw o kalagayan.
- source_word: δικαιοσύνῃ
  choice: katuwiran
  rationale: Ang “katuwiran” ang angkop at nakaugaliang salin dito; hindi nito nililimitahan ang salita sa katarungang panlipunan lamang.
- source_word: τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: ng ating Diyos at Tagapagligtas na si Jesus na Mesiyas
  rationale: 'Ang iisang artikulo sa Griyego na namamahala sa dalawang pangngalang isahan ay pinakamalinaw na tumutukoy sa iisang persona: si Jesus ang tinatawag na Diyos at Tagapagligtas.'
theological_decisions:
- issue: Kung iisang persona o dalawang persona ang tinutukoy ng “ating Diyos at Tagapagligtas na si Jesus na Mesiyas”
  choice: 'Iisang persona: si Jesus ay tinatawag na ating Diyos at Tagapagligtas.'
  alternative: 'Dalawang persona: “ating Diyos” at “ang Tagapagligtas na si Jesus na Mesiyas.”'
  rationale: Ang konstruksiyong Griyego ay may iisang artikulo para sa dalawang pangngalang personal, isahan, at pinag-uugnay ng καί, kaya mariing pinapaboran nito ang iisang tinutukoy. Dahil mahalaga at pinagtatalunan ang parirala, inilalahad ang mas mahinang alternatibo sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ay sumusulat” upang maging likas sa Filipino ang pormula ng pagbati, bagaman ipinahihiwatig lamang sa Griyego ang pandiwa. Pinanatili ang “alipin” dahil mahalaga ang diwa ng lubos na pag-aari, at isinalin ang Χριστός bilang titulong “Mesiyas.”
