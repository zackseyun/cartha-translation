    issue: Malabo ang ugnayan sa “nang kasama namin siya.”
    rationale: Ang Griyegong σὺν αὐτῷ ὄντες ay “habang kami ay kasama niya/kapiling niya.” Maaaring maunawaan ang kasalukuyang Tagalog na siya ang kasama ng “namin,” kaya kailangan ang mas malinaw na ayos.
  - severity: low
    issue: Hindi pinakamalinaw ang “kami mismo ay narinig.”
    rationale: Bagaman mauunawaan bilang aktibo, ang “kami mismo ang nakarinig” ay mas idiomatiko at tahasang ipinapakita na ang “kami” ang nakarinig.
  revised_text: At kami mismo ang nakarinig sa tinig na ito na dinala mula sa langit nang kami ay kasama niya sa banal na bundok.[a]
