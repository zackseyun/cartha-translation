  text: καὶ ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν ἐξ οὐρανοῦ ἐνεχθεῖσαν σὺν αὐτῷ ὄντες ἐν τῷ ⸂ἁγίῳ ὄρει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/018.yaml
  text: And we ourselves heard this voice brought from heaven when we were with him on the holy mountain[a].
translation:
  language: tl
  text: At kami mismo ang nakarinig sa tinig na ito na dinala mula sa langit nang kami ay kasama niya sa banal na bundok.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipinarating mula sa langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην τὴν φωνὴν
  choice: ang tinig na ito
  rationale: Tumutukoy ang φωνή sa banal na pahayag sa naunang talata; mas tiyak ang “tinig” kaysa “tunog.”
- source_word: ἡμεῖς
  choice: kami mismo
  rationale: Hindi kailangan ang hayag na panghalip sa Griyego para matukoy ang gumagawa, kaya may diin ito; pinananatili ng “kami mismo” ang diin sa kanilang personal na pagsaksi.
- source_word: ἠκούσαμεν
  choice: narinig
  rationale: Inilalarawan ng aorist ang mismong pangyayari ng pagkarinig, hindi ang patuloy na pakikinig.
- source_word: ἐξ οὐρανοῦ
  choice: mula sa langit
  rationale: Natural na salin sa Tagalog na malinaw na nagpapanatili sa pinagmulan ng tinig.
- source_word: ἐνεχθεῖσαν
  choice: dinala
  rationale: 'Pinananatili nito ang pasibong diwa ng participle ng φέρω: ang tinig ay dinala o ipinarating mula sa langit.'
- source_word: σὺν αὐτῷ ὄντες
  choice: nang kasama namin siya
  rationale: Likas na ipinapahayag sa Tagalog bilang sugnay na panahunan ang participial construction; nananatiling panghalip ang αὐτῷ gaya ng teksto.
- source_word: ἐν τῷ ἁγίῳ ὄρει
  choice: sa banal na bundok
  rationale: Ang “sa” ang natural na Tagalog para sa lokasyon, at pinananatili ng “banal” ang kahulugan ng ἁγίῳ nang hindi tinutukoy kung aling bundok iyon.
theological_decisions:
- issue: Pagkakakilanlan ng “banal na bundok”
  choice: Mapaglarawang pagtukoy sa bundok ng pagbabagong-anyo ni Jesus, nang hindi ito pinapangalanan
  alternative: Tahasang tukuyin bilang Bundok Tabor o Bundok Hermon
  rationale: Tinatawag lamang itong “banal na bundok” ng tekstong Griyego at hindi nagbibigay ng pangalan; hindi dapat idagdag sa salin ang isang tradisyonal na pagkakakilanlan.
- issue: Paraan ng pagdating ng tinig mula sa langit
  choice: “dinala,” na pinananatili ang pasibong larawan ng ἐνεχθεῖσαν
  alternative: “nagmula” o “dumating,” na mas natural ngunit hindi gaanong nagpapakita ng pasibong anyo
  rationale: Pinananatili ng pangunahing teksto ang di-pangkaraniwang larawang nasa Griyego sa halip na ipaliwanag kung paano o sa pamamagitan kanino dinala ang tinig.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “kami mismo” upang idiin ang saksi, at pinanatili ang bahagyang di-pangkaraniwang “dinala” dahil mahalaga ang pasibong larawan ng orihinal.
