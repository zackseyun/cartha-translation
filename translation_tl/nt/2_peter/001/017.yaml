source:
  edition: SBLGNT
  text: λαβὼν γὰρ παρὰ θεοῦ πατρὸς τιμὴν καὶ δόξαν φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε ὑπὸ τῆς μεγαλοπρεποῦς δόξης· ⸂Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν⸃, εἰς ὃν ἐγὼ εὐδόκησα—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/017.yaml
  text: 'For when he received honor and glory from God the Father[a], such a voice was borne to him from the Majestic Glory: “This is my Son, my Beloved[c][b], in whom I am well pleased”—'
translation:
  language: tl
  text: 'Sapagkat tumanggap siya ng karangalan at kaluwalhatian mula sa Diyos Ama nang dumating sa kanya ang ganitong tinig mula sa Maringal na Kaluwalhatian[a]: “Ito ang aking Anak, ang aking Minamahal[b], na lubos kong kinalugdan[c]”—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pamamagitan ng Maringal na Kaluwalhatian.” Maaaring tukuyin ng Griyegong ὑπό ang tagaganap; binibigyang-diin naman ng “mula sa” ang pinagmulan ng tinig.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Ito ang minamahal kong Anak.” Mas literal sa Griyego ang “Ito ang aking Anak, ang aking Minamahal.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “na lubos kong kinalulugdan.” Literal na may anyong pangnagdaan ang pandiwang Griyego, at ang parirala ay umaalingawngaw sa mga salaysay ng bautismo at pagbabagong-anyo ni Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν γὰρ παρὰ θεοῦ πατρὸς
  choice: Sapagkat tumanggap siya ... mula sa Diyos Ama
  rationale: Pinananatili ng “sapagkat” ang paliwanag na bisa ng γάρ, at ipinahahayag ng “mula sa” ang pinagmulang tinutukoy ng παρά na may genitive. Ang aorist participle ay likas na isinaad sa Filipino bilang pandiwang may kasunod na sugnay na “nang.”
- source_word: τιμὴν καὶ δόξαν
  choice: karangalan at kaluwalhatian
  rationale: Magkaibang pinahahalagahang pangngalan ang τιμή at δόξα, kaya kapwa tahasang pinanatili.
- source_word: φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε
  choice: nang dumating sa kanya ang ganitong tinig
  rationale: Ang genitive absolute at pasibong anyo ng φέρω ay ginawang natural na sugnay sa Filipino. Ang “ganitong” ay tumuturo pasulong sa mismong sipi.
- source_word: ὑπὸ τῆς μεγαλοπρεποῦς δόξης
  choice: mula sa Maringal na Kaluwalhatian
  rationale: Bagaman maaaring magpahiwatig ng tagaganap ang ὑπό, natural na ipinahahayag ng “mula sa” ang pinagmulan ng tinig. Pinananatili ng “Maringal na Kaluwalhatian” ang mapitagang pagtukoy sa banal na presensiya.
- source_word: Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν
  choice: Ito ang aking Anak, ang aking Minamahal
  rationale: Pinananatili ang appositional na ayos at ang pag-uulit ng μου sa halip na pagsamahin lamang bilang “minamahal kong Anak.”
- source_word: εἰς ὃν ἐγὼ εὐδόκησα
  choice: na lubos kong kinalulugdan
  rationale: Natural at marangal sa Filipino ang “kinalulugdan,” at naipahahayag nito ang banal na pagsang-ayon at kasiyahan nang hindi pinipilit ang literal ngunit alanganing anyo ng εἰς.
theological_decisions:
- issue: Ang mapitagang pagtukoy na τῆς μεγαλοπρεποῦς δόξης
  choice: Maringal na Kaluwalhatian
  alternative: marilag na kaluwalhatian; banal na Kamahalan
  rationale: Ginawang malaking titik bilang tila-titulong pagtukoy sa Diyos o sa kanyang maluwalhating presensiya, ngunit hindi pinalawak sa isang tahasang pangalan na wala sa Griyego.
- issue: Ang ayos ng pahayag ng Ama tungkol sa Anak
  choice: Ito ang aking Anak, ang aking Minamahal
  alternative: Ito ang minamahal kong Anak
  rationale: Pinananatili ang diin at apposition ng Griyego, pati ang natatanging bigat ng “aking Anak” at “aking Minamahal,” nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Ang aspektong aorist ng εὐδόκησα
  choice: na lubos kong kinalulugdan
  alternative: na lubos kong kinalugdan
  rationale: Ang anyong pangkasalukuyang kahulugan sa Filipino ay angkop sa pahayag ng patuloy na pagsang-ayon, ngunit inilalagay sa talababa ang mas tahasang pangnagdaang posibilidad upang hindi ikubli ang aspektong Griyego.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Sapagkat” upang mapanatili ang ugnayang paliwanag sa naunang talata; “Maringal na Kaluwalhatian” para sa mataas at mapitagang rehistro; at “kinalulugdan” bilang natural na biblikal ngunit buhay pa ring salita. Lahat ng marker ng talababa ay nasa pangunahing teksto.
