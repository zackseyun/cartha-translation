revisions:
- from: At taglay natin ang higit na tiyak na salita ng propesiya[a]. Mabuti ang ginagawa ninyo sa pagbibigay-pansin dito, gaya ng sa isang ilawang nagniningning sa isang madilim na lugar, hanggang sa magbukang-liwayway at sumikat ang tala sa umaga sa inyong mga puso.[b]
  to: At mayroon tayong higit na tiyak na salita ng propesiya[a], na mabuti na binibigyan ninyo ng pansin gaya ng isang ilawang nagniningning sa isang madilim na lugar, hanggang sa magbukang-liwayway at sumikat ang tala sa umaga[b] sa inyong mga puso.
  rationale: Inilipat ang panandang [b] upang tuwirang iangkla ang talababa sa “tala sa umaga,” ang terminong tinatalakay nito. Pinalitan ang “taglay natin” ng mas likas na “mayroon tayong” at bahagyang inayos ang sugnay ukol sa pagbibigay-pansin para sa mas natural na daloy, habang pinananatili ang comparative na “higit na tiyak,” ang sintaksikong ugnayan sa propetikong salita, at ang hindi nilulutas na metapora ng tala sa umaga.
