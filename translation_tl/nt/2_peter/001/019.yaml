id: 2PE.1.19
reference: 2 Peter 1:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔχομεν βεβαιότερον τὸν προφητικὸν λόγον, ᾧ καλῶς ποιεῖτε προσέχοντες ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/019.yaml
  text: And we have the prophetic word more certain[a], to which you do well to pay attention as to a lamp shining in a dark place[b], until the day dawns and the morning star rises in your hearts.
translation:
  language: tl
  text: At mayroon tayong higit na tiyak na salita ng propesiya[a], na mabuti na binibigyan ninyo ng pansin gaya ng isang ilawang nagniningning sa isang madilim na lugar, hanggang sa magbukang-liwayway at sumikat ang tala sa umaga[b] sa inyong mga puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang lalong tiyak na salita ng propesiya.” Maaaring unawain ang Griyego na ang salita ng propesiya ay pinagtibay ng patotoo ng mga apostol, o na binibigyang-diin ang likas na katiyakan nito.
    reason: alternative_reading
  - marker: b
    text: Ang “tala sa umaga” ay maaaring umalingawngaw sa isang larawang tumutukoy sa Mesiyas; ihambing ang Pahayag 22:16.
    reason: cross_reference
lexical_decisions:
- source_word: βεβαιότερον
  choice: higit na tiyak
  rationale: Pinananatili ang paghahambing na nasa Griyego nang hindi idinaragdag na ang salita ay ‘ginawang’ higit na tiyak. Maaari itong tumukoy sa pagkumpirma ng salita ng propesiya o sa higit na katiyakan nito; inilalahad sa talababa ang kalabuan.
- source_word: προφητικὸν λόγον
  choice: salita ng propesiya
  rationale: Likas at marangal sa modernong Tagalog, at pinananatili ang parehong ideya ng λόγος at ng pagiging propetiko nito.
- source_word: ᾧ ... προσέχοντες
  choice: sa pagbibigay-pansin dito
  rationale: Malinaw na ipinapahayag ang maingat na pagtutuon ng pansin na hinihingi ng προσέχω.
- source_word: λύχνῳ φαίνοντι
  choice: isang ilawang nagniningning
  rationale: Pinananatili ang paghahambing at ang patuloy na pagbibigay-liwanag ng pandiwaring Griyego.
- source_word: αὐχμηρῷ τόπῳ
  choice: isang madilim na lugar
  rationale: Angkop sa larawan ng ilawan at madaling maunawaan; hindi ipinapasok ang posibleng ngunit di-gaanong angkop na diwang ‘marumi’ o ‘mapanglaw.’
- source_word: ἡμέρα διαυγάσῃ
  choice: magbukang-liwayway
  rationale: Natural na katumbas sa Tagalog ng pagsikat o pagbubukang-liwayway ng araw, habang pinananatili ang metapora.
- source_word: φωσφόρος
  choice: tala sa umaga
  rationale: Tumutukoy sa bituing lumilitaw sa madaling-araw. Pinananatili ang metapora nang hindi tahasang tinutukoy kung sino o ano ang kinakatawan nito.
- source_word: ἀνατείλῃ
  choice: sumikat
  rationale: Karaniwang pandiwa sa Tagalog para sa paglitaw o pagsikat ng isang tala at angkop sa larawang makalangit.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: sa inyong mga puso
  rationale: Tuwirang salin na pinananatili ang biblikal na diwa ng puso bilang kaloob-looban ng tao nang walang dagdag na pagpapakahulugan.
theological_decisions:
- issue: Kahulugan ng βεβαιότερον kaugnay ng patotoo ng mga apostol at ng propesiya
  choice: higit na tiyak
  alternative: ‘lalo pang pinagtibay’ o ‘ang lalong tiyak na salita ng propesiya’
  rationale: Hindi tahasang sinasabi ng Griyego na ‘ginawa’ itong higit na tiyak. Ang salin ay nagpapanatili sa paghahambing at sa posibilidad na ang salita ng propesiya ay nakumpirma ng patotoo ng mga apostol o na binibigyang-diin lamang ang katiyakan nito.
- issue: Tinutukoy ng φωσφόρος, ‘tala sa umaga’
  choice: Pinanatili bilang metapora nang walang tahasang pagkilala sa pangunahing teksto
  alternative: Tahasan itong tukuyin bilang Mesiyas o bilang pangwakas na kaliwanagan
  rationale: Maaaring umalingawngaw rito ang isang mesiyanikong larawan, ngunit hindi tahasang pinangalanan ng talata ang tinutukoy. Pinananatili ng salin ang teolohikal na pahiwatig nang hindi ito nilulutas.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘taglay natin’ upang natural na ipahayag ang ἔχομεν, ‘salita ng propesiya’ bilang pamilyar na biblikal na parirala, at ‘magbukang-liwayway’ upang mapanatili ang masining na larawan nang hindi nagiging makaluma. Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto at tumutugma sa mga talababa.
