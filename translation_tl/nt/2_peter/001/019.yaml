  terminology: Ang “salita ng propesiya,” “ilawan,” “madilim na lugar,” “tala sa umaga,” at “mga puso” ay angkop at pinananatili ang biblikal at metaporikong rehistro. Hindi dapat tahasang kilalanin sa pangunahing teksto ang tala sa umaga bilang Mesiyas, sapagkat hindi ito tahasang ginagawa ng talata.
