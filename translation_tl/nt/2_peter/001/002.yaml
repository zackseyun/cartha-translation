  text: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη ἐν ἐπιγνώσει τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/002.yaml
  text: Grace to you and peace be multiplied in the knowledge of God and of Jesus our Lord[a][b].
translation:
  language: tl
  text: Lalo nawang dumami sa inyo ang biyaya at kapayapaan sa pagkakilala sa Diyos at kay Jesus na ating Panginoon.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa pamamagitan ng pagkakilala sa Diyos at kay Jesus na ating Panginoon.” Maaaring tumukoy ang pang-ukol sa Griyego sa saklaw o kalagayan (“sa”) o sa paraan (“sa pamamagitan ng”).
    reason: alternative_reading
  - marker: b
    text: Maaari ring “lubos na pagkakilala.” Ang salitang Griyego ay maaaring magpahiwatig ng mas ganap o mas malalim na pagkakilala.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: biyaya
  rationale: Likas at kinikilalang salin ng terminong ginagamit sa pagbati at pagpapala; pinananatili nito ang diwa ng kagandahang-loob ng Diyos.
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Karaniwang salin na nagpapanatili sa mayamang biblikal na diwa ng kapayapaan at kabutihang kalagayan.
- source_word: πληθυνθείη
  choice: sumagana nawa
  rationale: Ipinahahayag ang optatibong panalangin o hangarin at ang diwa ng pagdami nang natural sa Filipino; hindi lamang simpleng pagbati kundi pagpapalang nawa'y lalo pang sumagana.
- source_word: ἐν
  choice: sa
  rationale: Ang 'sa' ay maaaring magpahiwatig ng saklaw o kalagayan, habang hindi lubusang isinasara ang posibleng instrumental na diwang 'sa pamamagitan ng,' na inilalahad sa talababa.
- source_word: ἐπιγνώσει
  choice: pagkakilala
  rationale: Mas natural kaysa abstraktong 'kaalaman' kapag mga persona ang layon, at naipahihiwatig ang personal at ganap na pagkilala nang hindi tahasang dinaragdagan ang lakas ng termino.
- source_word: θεοῦ
  choice: Diyos
  rationale: Tuwirang salin ng genitibong tumutukoy sa layon ng pagkakilala.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Karaniwang anyo ng personal na pangalan sa modernong Filipino.
- source_word: κυρίου
  choice: Panginoon
  rationale: Pamantayang salin na nagpapanatili sa bigat ng titulo at sa karaniwang gamit nito sa Bagong Tipan.
- source_word: τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν
  choice: sa Diyos at kay Jesus na ating Panginoon
  rationale: Ginagamit ang magkatugmang 'sa Diyos' at 'kay Jesus' upang malinaw na kapwa sila layon ng pagkakilala; natural sa Filipino ang 'na ating Panginoon' bilang paglalarawan kay Jesus.
theological_decisions:
- issue: Diwa ng ἐπίγνωσις sa kontekstong espirituwal
  choice: pagkakilala
  alternative: lubos na pagkakilala
  rationale: Maaaring magtaglay ang salita ng pinatinding diwa ng ganap o mas malalim na pagkilala, ngunit hindi ito tahasang ipinapasok sa pangunahing teksto; pinananatili sa talababa ang alternatibo.
- issue: Lakas ng ἐν kasama ng ἐπιγνώσει
  choice: sa pagkakilala
  alternative: sa pamamagitan ng pagkakilala
  rationale: Maaaring tumukoy ang Griyego sa saklaw o kalagayan ('sa') o sa paraan ('sa pamamagitan ng'). Pinipili ng pangunahing teksto ang mas tuwirang anyo habang iniiwan sa talababa ang instrumental na pagbasa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'sumagana nawa' bilang natural na pormula ng pagpapala, at 'pagkakilala' upang maging personal at idiomatiko ang ugnayan sa Diyos at kay Jesus nang hindi nilulutas ang mga tunay na ambiguwidad ng Griyego.
