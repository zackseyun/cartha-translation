  text: διὸ μᾶλλον, ἀδελφοί, σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι· ταῦτα γὰρ ποιοῦντες οὐ μὴ πταίσητέ ποτε·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/010.yaml
  text: Therefore[a], brothers, be all the more diligent to make your calling and election sure, for if you do these things, you will certainly never stumble.
translation:
  language: tl
  text: Kaya nga, mga kapatid[a], lalo pa ninyong pagsikapang patatagin ang inyong pagkatawag at pagkahirang; sapagkat kung ginagawa ninyo ang mga bagay na ito, hinding-hindi kayo matitisod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay “mga kapatid”; bagaman panlalaki ang anyo nito, maaari itong tumukoy sa buong pamayanan ng mga mananampalataya, kabilang ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kaya nga
  rationale: Malinaw na naghahayag ng kongklusyon o bunga mula sa naunang pangaral, habang pinananatili ang lohikal na ugnayan.
- source_word: μᾶλλον
  choice: lalo pa
  rationale: Likas na Filipino na nagpapatingkad sa utos na magsikap nang higit.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang salitang Filipino na “kapatid” ay hindi nakatali sa kasarian at likas na tumutukoy sa buong pamayanang mananampalataya; nililinaw sa talababa ang anyong panlalaki ng Griyego.
- source_word: σπουδάσατε
  choice: pagsikapan
  rationale: Ipinahahayag ang taimtim at masigasig na pagsisikap na hinihingi ng pautos na pandiwa.
- source_word: βεβαίαν ... ποιεῖσθαι
  choice: gawing tiyak
  rationale: Pinananatili ang ideya ng pagpapatibay o pagkumpirma nang hindi ipinapaliwanag sa mismong salin kung paano nagiging tiyak ang pagkatawag at pagkahirang.
- source_word: κλῆσιν
  choice: pagkatawag
  rationale: Karaniwan at malinaw na katumbas ng tawag ng Diyos, at angkop sa teolohikal na gamit ng talata.
- source_word: ἐκλογὴν
  choice: pagkahirang
  rationale: Tumpak na tumutukoy sa pagpili o paghirang ng Diyos nang hindi nag-aangkat ng isang partikular na sistemang doktrinal.
- source_word: ὑμῶν
  choice: sa inyo
  rationale: Ipinakikitang ang pagkatawag at pagkahirang ay nauukol sa mga mambabasa; iniiwasan din nitong ipahiwatig na sila ang pinagmulan ng mga ito.
- source_word: ταῦτα ... ποιοῦντες
  choice: kung ginagawa ninyo ang mga bagay na ito
  rationale: Likas na inilalahad sa Filipino ang kondisyunal na diwa ng participle at malinaw na tumutukoy pabalik sa mga katangiang binanggit sa naunang konteksto.
- source_word: οὐ μὴ ... ποτε
  choice: hinding-hindi
  rationale: Matindi at likas na pagtanggi sa Filipino na kumakatawan sa mariing Griyegong negasyon.
- source_word: πταίσητέ
  choice: matitisod
  rationale: Pinananatili ang metapora ng pagkatisod at hindi ito labis na nililinaw bilang anumang kasalanan o bilang tiyak na pangwakas na pagtalikod.
theological_decisions:
- issue: Kahulugan ng “gawing tiyak ang pagkatawag at pagkahirang sa inyo”
  choice: Pinanatili bilang panawagang pagtibayin o kumpirmahin ang pagkatawag at pagkahirang sa pamamagitan ng masigasig na pamumuhay.
  alternative: Ipaliwanag na nililikha o pinangyayari ng pagsisikap ng tao ang pagkatawag at pagkahirang ng Diyos.
  rationale: 'Ang “gawing tiyak” ay nananatiling malapit sa βεβαίαν ... ποιεῖσθαι at pinangangalagaan ang tensiyon ng teksto: inuutusan ang mga mambabasa na kumilos, ngunit hindi sinasabing sila ang pinagmulan ng pagtawag o paghirang.'
- issue: Saklaw ng pangakong “hinding-hindi kayo matitisod”
  choice: Pinanatili ang metapora ng pagkatisod nang walang karagdagang sistematikong paliwanag.
  alternative: Isalin bilang ganap na kawalan ng anumang kasalanan, o bilang tahasang garantiya laban lamang sa pangwakas na pagtalikod.
  rationale: Maaaring tumukoy ang πταίω sa pagkatisod o pagkabigo. Hindi sapat ang talata upang sapilitang itakda rito ang alinman sa dalawang mas makitid na doktrinal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga kapatid,” na likas na inklusibo sa Filipino, at pinanatili ang mariing pangako at teolohikal na tensiyon ng orihinal nang hindi nagdaragdag ng denominasyonal na paliwanag.
