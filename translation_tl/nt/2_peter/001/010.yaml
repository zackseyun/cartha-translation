  naturalness: Malinaw at marangal ang pangunahing salin. Ang bahagyang pag-aayos sa ‘pagsikapang gawing’ bilang ‘pagsikapang patatagin’ ay mas tuwiran at likas para sa βεβαίαν ... ποιεῖσθαι, na may diwang magpatibay o magkumpirma, hindi lamang magkamit ng pansariling katiyakan.
  terminology: Ang ‘pagkatawag’ at ‘pagkahirang’ ay angkop at nagpapanatili ng teolohikal na wika nang walang denominasyonal na pagpapakahulugan. Ang ‘mga kapatid’ ay likas na inklusibo sa modernong Filipino. Inayos ang talababa upang huwag tawaging literal na ‘mga kapatid na lalaki’ ang ἀδελφοί; mas tumpak na sabihing panlalaki ang gramatikal na anyo nito.
