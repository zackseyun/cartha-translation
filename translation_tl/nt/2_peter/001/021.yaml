  text: οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη ⸂προφητεία ποτέ⸃, ἀλλὰ ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ⸀ἀπὸ θεοῦ ἄνθρωποι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/021.yaml
  text: For prophecy was never brought forth by the will of man[c][b][a], but men spoke from God as they were carried along by the Holy Spirit.
translation:
  language: tl
  text: Sapagkat hindi kailanman nagmula ang propesiya sa pamamagitan ng kalooban ng tao[a]. Sa halip, nagsalita mula sa Diyos ang mga tao habang dinadala sila ng Banal na Espiritu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “hindi kailanman dinala ang propesiya sa pamamagitan ng kalooban ng tao.” Pasibo ang pandiwang Griyego at kaugnay ito ng salitang isinaling “dinadala” sa sumunod na pangungusap.'
    reason: lexical_alternative
  - marker: b
    text: O “habang inuudyukan sila ng Banal na Espiritu.” Mas literal na “dinadala,” na nagdiriin sa aktibong paggabay ng Espiritu.
    reason: lexical_alternative
lexical_decisions:
- source_word: θελήματι ἀνθρώπου
  choice: sa kagustuhan ng tao
  rationale: Ipinahihiwatig ng pariralang nasa datibo na hindi kagustuhan o pagpapasya ng tao ang pinagmulan o kasangkapan ng propesiya. Likas at neutral sa kasarian ang “tao” sa Filipino.
- source_word: ἠνέχθη
  choice: nagmula
  rationale: Bagaman pasibo ang pandiwang Griyego at kaugnay ng φερόμενοι, ang “nagmula” ang pinakanatural na paglalahad sa Filipino ng punto tungkol sa pinagmulan ng propesiya. Inilalagay sa talababa ang mas literal na larawan upang hindi mawala ang ugnayang leksikal.
- source_word: προφητεία
  choice: propesiya
  rationale: Karaniwang terminong biblikal ito at maaaring tumukoy sa mensahe o pahayag na nagmumula sa Diyos nang hindi nililimitahan ang kahulugan.
- source_word: οὐ ... ποτέ
  choice: hindi kailanman
  rationale: Malinaw at natural nitong pinananatili ang mariing pagtanggi ng Griyego.
- source_word: ὑπὸ πνεύματος ἁγίου
  choice: ng Banal na Espiritu
  rationale: Ang ὑπό na may henitibo ay nagpapahayag ng gumagawang ahente; malinaw sa konteksto na ang tinutukoy ay ang Banal na Espiritu.
- source_word: φερόμενοι
  choice: habang dinadala sila
  rationale: Pinananatili nito ang kongkretong larawan ng aktibong pag-akay o pag-uudyok ng Espiritu at ang leksikal na kaugnayan nito sa ἠνέχθη, sa halip na gawing malabong “kinikilos.”
- source_word: ἐλάλησαν
  choice: nagsalita
  rationale: Tuwiran at sapat na katumbas ito ng karaniwang pandiwang Griyego para sa pagsasalita.
- source_word: ἀπὸ θεοῦ
  choice: mula sa Diyos
  rationale: Pinananatili ng “mula sa” ang diwa ng bukal o pinagmulan at hindi ito ipinagkakamali sa ahensiyang ipinahahayag ng ὑπό para sa Espiritu.
- source_word: ἄνθρωποι
  choice: ang mga tao
  rationale: Tumpak at likas na pangkalahatang katawagan ito sa Filipino para sa mga taong nagsalita, nang hindi nagdaragdag ng paghihigpit batay sa kasarian.
theological_decisions:
- issue: Ugnayan ng pagkilos ng Diyos at ng tao sa propesiya
  choice: Ang mga tao ang tunay na nagsalita, ngunit mula sa Diyos ang kanilang sinabi at dinadala sila ng Banal na Espiritu; hindi kagustuhan ng tao ang pinagmulan ng propesiya.
  alternative: Ilarawan ito bilang mekanikal na pagdidikta lamang, o bilang propesiyang bahagyang nagmula sa sariling pagkukusa ng tao.
  rationale: Magkasabay na pinananatili ng Griyego ang tunay na pagsasalita ng tao at ang mapagpasiyang banal na pinagmulan at pagkilos. Hindi dapat lutasin ng salin ang tensiyong ito pabor sa alinman sa mekanikal na pagdidikta o nagsasariling pagkukusa ng tao.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “propesiya” bilang pamilyar na terminong biblikal; ang “tao/mga tao” ay likas na pangkalahatan at neutral sa kasarian sa Filipino. Hinati sa dalawang pangungusap para sa madaling pagbasa habang pinananatili ng “Sa halip” ang matibay na pagsalungat ng ἀλλά.
