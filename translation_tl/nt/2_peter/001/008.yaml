  text: ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/008.yaml
  text: For if these things are yours and are increasing[c][b][a], they keep you from being ineffective or unfruitful in the knowledge of our Lord Jesus the Messiah.
translation:
  language: tl
  text: Sapagkat kung taglay ninyo ang mga bagay na ito at patuloy na sumasagana[a], hindi kayo nito gagawing walang pakinabang o walang bunga sa pagkakilala[b] sa ating Panginoong Jesus na Mesiyas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patuloy na dumarami” o “nanagana.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lubos na pagkakilala.”
    reason: lexical_alternative
  - marker: c
    text: 'Griyego: “Jesus Christ”; isinalin dito ang Χριστός ayon sa kahulugan nitong titulong “Mesiyas.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Tumutukoy ito pabalik sa mga katangiang nakatala sa talata 5–7. Pinananatili ng payak na parirala ang ugnayang iyon nang hindi ipinapasok sa teksto ang interpretibong salitang “mga katangian.”
- source_word: ὑμῖν ὑπάρχοντα
  choice: taglay ninyo
  rationale: Magkasamang nagpapahayag ang datibo at participle na nasa mga mambabasa o pag-aari nila ang mga bagay na ito. Likas at malinaw sa makabagong Tagalog ang “taglay ninyo.”
- source_word: πλεονάζοντα
  choice: patuloy na sumasagana
  rationale: Saklaw ng pandiwa ang pagdami at kasaganaan. Ipinahihiwatig ng “patuloy” ang nagpapatuloy na paglago, samantalang pinananatili ng “sumasagana” ang posibilidad ng pag-uumapaw o kasaganaan.
- source_word: ἀργοὺς
  choice: walang pakinabang
  rationale: Sa pagtambal nito sa “walang bunga,” ang diwa ay kawalan ng mabisa o kapaki-pakinabang na gawain, hindi lamang katamaran.
- source_word: ἀκάρπους
  choice: walang bunga
  rationale: Pinananatili nito ang metapora ng καρπός at ang likas na kaagapay nito sa Tagalog na “walang pakinabang.”
- source_word: καθίστησιν
  choice: hindi kayo magiging
  rationale: 'Resultatibo ang pandiwa sa konstruksyong οὐκ … οὐδὲ: ang pagkakaroon at pagsagana ng mga bagay na ito ay humahantong sa hindi pagiging walang pakinabang o bunga. Natural sa Tagalog ang negatibong resultang ito.'
- source_word: εἰς τὴν … ἐπίγνωσιν
  choice: sa pagkakilala
  rationale: Ipinapahayag ng εἰς dito ang kaugnayan o larangan ng pagiging mabisa at mabunga. Mas personal at angkop sa pagkilala sa isang persona ang “pagkakilala” kaysa abstraktong “kaalaman.”
- source_word: κυρίου
  choice: Panginoon
  rationale: Karaniwan at marangal na salin ng kristolohikal na titulong κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Isinasalin ang kahulugan ng Χριστός bilang titulong “Mesiyas,” habang ang “na” ay nagbibigay ng likas na anyong Tagalog para sa “Jesus the Messiah.”
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ sa Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  alternative: Jesucristo / Jesus Cristo
  rationale: Pinananatili ng “Mesiyas” ang kahulugan ng titulong Χριστός sa halip na ituring lamang itong nakapirming bahagi ng pangalan. Hindi nito dinaragdagan o nilulutas ang anumang hiwalay na usaping doktrinal.
- issue: Lakas ng kahulugan ng ἐπίγνωσις
  choice: pagkakilala
  alternative: lubos na pagkakilala
  rationale: Maaaring magpahiwatig ang ἐπίγνωσις ng mas ganap na kaalaman, ngunit hindi ito kailangang idiin sa bawat gamit. Pinananatili sa talababa ang mas malakas na posibleng diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang “taglay ninyo” at “patuloy na sumasagana” upang maging natural ang dalawang participle, habang pinanatili ang metaporang “walang bunga” at ang titulong “Mesiyas.”
