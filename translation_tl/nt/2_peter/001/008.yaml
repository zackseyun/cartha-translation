  to: Sapagkat kung taglay ninyo ang mga bagay na ito at patuloy na sumasagana[a], hindi kayo nito gagawing walang pakinabang o walang bunga sa pagkakilala[b] sa ating Panginoong Jesus na Mesiyas[c].
  rationale: Pinalitan ang panghinaharap na “hindi kayo magiging” ng sanhi-resultang “hindi kayo nito gagawing” upang mas tumpak na maipahayag ang καθίστησιν at ang paksa nitong ταῦτα. Pinalitan din ang “ni” ng “o” para sa mas likas na modernong Tagalog. Walang binagong kahulugan sa mga pangalan, titulo, o sa antas ng kahulugan ng ἐπίγνωσις.
