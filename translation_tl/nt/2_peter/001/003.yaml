id: 2PE.1.3
reference: 2 Peter 1:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ⸂ἰδίᾳ δόξῃ καὶ ἀρετῇ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/003.yaml
  text: As his divine power has granted to us all things for life and godliness[a], through the knowledge of the one who called us by his own glory and excellence,
translation:
  language: tl
  text: Yamang ipinagkaloob sa atin ng kanyang banal na kapangyarihan ang lahat ng nauukol sa buhay at maka-Diyos na pamumuhay, sa pamamagitan ng pagkakilala sa tumawag sa atin sa pamamagitan ng sarili niyang kaluwalhatian at kahusayan[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “tungo sa sarili niyang kaluwalhatian at kahusayan.” Maaaring unawain sa magkaibang paraan ang pariralang datibo sa Griyego.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς
  choice: Yamang
  rationale: Ipinakikita nito na ang pahayag ang saligan ng kasunod na pangungusap. Likas ito sa Filipino at hindi nito ginagawang hiwalay na pangungusap ang sugnay.
- source_word: πάντα ... τὰ πρὸς ζωὴν καὶ εὐσέβειαν
  choice: ang lahat ng nauukol sa buhay at maka-Diyos na pamumuhay
  rationale: Pinananatili ng “lahat ng nauukol” ang saklaw ng πάντα at ang diwa ng τὰ πρὸς, nang hindi nagdaragdag ng salitang “kailangan” na wala mismo sa Griyego.
- source_word: θείας δυνάμεως αὐτοῦ
  choice: ng kanyang banal na kapangyarihan
  rationale: Natural na ayos sa Filipino para sa genitibong parirala; ang “banal” dito ay nagpapahayag ng pagiging mula o ukol sa Diyos.
- source_word: δεδωρημένης
  choice: ipinagkaloob
  rationale: Ipinahihiwatig ang mapagbigay na pagkakaloob at ang natapos na kilos na may nananatiling bunga.
- source_word: διὰ τῆς ἐπιγνώσεως
  choice: sa pamamagitan ng pagkakilala
  rationale: Ang “pagkakilala” ay mas personal kaysa payak na “kaalaman” at angkop dahil isang persona ang kasunod na layon, ngunit hindi nito labis na binibigyang-diin ang posibleng diwa ng ganap na kaalaman.
- source_word: τοῦ καλέσαντος ἡμᾶς
  choice: sa kanya na tumawag sa atin
  rationale: Pinananatili ang personal at pandiwang diwa ng substantival participle nang hindi tinutukoy kung sino ang tinutukoy nang higit sa sinasabi ng talata.
- source_word: ἰδίᾳ
  choice: sarili niyang
  rationale: Pinananatili ang diin sa pagmamay-ari na taglay ng ἴδιος.
- source_word: δόξῃ
  choice: kaluwalhatian
  rationale: Ito ang karaniwan at marangal na salin para sa banal na δόξα.
- source_word: ἀρετῇ
  choice: kahusayan
  rationale: Sinasaklaw nito ang diwa ng likas na kadakilaan o excellence at hindi nililimitahan ang salita sa moralidad lamang.
- source_word: ζωὴν
  choice: buhay
  rationale: Pinananatiling malawak ang kahulugan, kabilang ang kasalukuyan at panghinaharap na dimensiyon ng buhay.
- source_word: εὐσέβειαν
  choice: maka-Diyos na pamumuhay
  rationale: Mas malinaw at natural sa modernong Filipino kaysa “kabanalan” o “debosyon,” at ipinahahayag ang pamumuhay na nakatuon sa Diyos.
theological_decisions:
- issue: Gamit o layon ng pariralang ἰδίᾳ δόξῃ καὶ ἀρετῇ
  choice: sa pamamagitan ng sarili niyang kaluwalhatian at kahusayan
  alternative: tungo sa sarili niyang kaluwalhatian at kahusayan
  rationale: Sa tekstong SBLGNT, pinakamadaling unawain ang datibo bilang paraan o kasangkapan ng pagtawag. Gayunman, tunay na posible ang pag-unawa rito bilang layon, kaya pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang anyong sugnay at pangwakas na kuwit sapagkat nagpapatuloy ang pangungusap sa susunod na talata. Inilagay ang pananda ng talababa sa mismong pariralang may sintaktikong kalabuan.
