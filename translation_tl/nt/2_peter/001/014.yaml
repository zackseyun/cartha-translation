  naturalness: Mas natural at malinaw ang aktibong sugnay na “gaya rin ng ipinaalam sa akin ng …” kaysa sa “gaya rin ng nilinaw sa akin ng …,” na medyo pilit ang ayos. Ang apposition na “Jesus, ang Mesiyas” ay malinaw at marangal sa modernong Filipino.
  terminology: 'Ang “Panginoon” at “Mesiyas” ay angkop. Kailangang itama ang talababa: ang anyong “Jesus Christ” ay hindi ang mismong anyong Griyego, at ang paliwanag tungkol sa “Cristo” at “Mesiyas” ay dapat tumukoy nang tumpak sa Χριστός bilang titulong nangangahulugang “Pinahiran.”'
