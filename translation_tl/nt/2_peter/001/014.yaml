  text: εἰδὼς ὅτι ταχινή ἐστιν ἡ ἀπόθεσις τοῦ σκηνώματός μου, καθὼς καὶ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς ἐδήλωσέν μοι·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/014.yaml
  text: knowing that the putting off of my tent is near[c][b][a], just as our Lord Jesus the Messiah made clear to me.
translation:
  language: tl
  text: Alam kong malapit na ang pag-aalis ng aking tolda[a], gaya rin ng ipinaalam sa akin ng ating Panginoong Jesus, ang Mesiyas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pag-aalis ng aking tolda” ay talinghaga para sa nalalapit na kamatayan ni Pedro; inilalarawan niya ang katawan bilang pansamantalang tirahan.
    reason: metaphor_explanation
  - marker: b
    text: 'Griyego: “Ἰησοῦς Χριστός.” Ang Χριστός ay isang titulo na nangangahulugang “Pinahiran”; isinalin itong “Mesiyas.” Maaari ring isalin ang buong katawagan bilang “ating Panginoong Jesu-Cristo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: Alam kong
  rationale: Pinananatili ang diwa ng kasalukuyang participle at ang kaugnayan nito sa naunang pangungusap, nang hindi tahasang tinutukoy kung sanhi, panahon, o kalagayan ang ugnayan.
- source_word: ταχινή
  choice: malapit na
  rationale: Likas sa modernong Tagalog at kayang magpahiwatig na nalalapit na ang pangyayari; hindi nito pinalalakas ang kahulugan tungo sa mas tiyak na 'agad na agad.'
- source_word: ἀπόθεσις
  choice: pag-aalis
  rationale: Ipinapahayag ang pag-aalis o paglalagak nang hindi tuwirang pinapalitan ng salitang 'kamatayan,' kaya nananatili ang talinghaga.
- source_word: σκηνώματός μου
  choice: aking tolda
  rationale: Ang 'tolda' ay malinaw at karaniwang salita para sa pansamantalang tirahan at pinananatili ang larawan ng katawan bilang pansamantalang tahanan.
- source_word: καθὼς καὶ
  choice: gaya rin ng
  rationale: Natural na panandang Tagalog para sa paghahambing at pagpapatibay na ipinahihiwatig ng parirala.
- source_word: ὁ κύριος ἡμῶν
  choice: ating Panginoon
  rationale: Karaniwang marangal na salin ng titulong κύριος sa kontekstong tumutukoy kay Jesus.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus, ang Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong 'Mesiyas' sa halip na tratuhing apelyido; ang apposition ay malinaw at natural sa Tagalog.
- source_word: ἐδήλωσέν μοι
  choice: nilinaw sa akin
  rationale: Tumpak na naghahatid ng diwang ginawa o ipinaunawa nang malinaw, nang hindi ipinapalagay ang tiyak na paraan ng pagpapahayag.
theological_decisions:
- issue: Talinghaga para sa nalalapit na kamatayan ni Pedro
  choice: Pinanatili ang 'pag-aalis ko ng aking tolda.'
  alternative: Malapit na akong mamatay.
  rationale: Tahasang gumagamit ang Griyego ng larawan ng pag-aalis ng isang pansamantalang tirahan. Ang pagpapanatili rito ay hindi nag-aalis sa pahiwatig ng kamatayan at hindi rin pinapawi ang teolohikal na larawan ng katawan bilang pansamantalang tahanan.
- issue: Kahulugan ng Χριστός sa buong katawagan
  choice: Jesus, ang Mesiyas
  alternative: Jesu-Cristo
  rationale: Ipinakikita ng saling ito ang kahulugan ng Χριστός bilang titulo. Nananatiling posible sa talababa ang tradisyonal na anyong 'Jesu-Cristo' nang hindi itinatago ang leksikal na kahulugan.
- issue: Lakas ng ταχινή
  choice: malapit na
  alternative: sa lalong madaling panahon
  rationale: Ang 'malapit na' ay nagpapanatili sa maaaring kahulugang nalalapit ang pangyayari, samantalang ang alternatibo ay maaaring magbigay ng higit na diin sa bilis o kaiklian ng panahon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang talinghaga at ang bahagyang kalabuan ng participle at ng ταχινή; iniwasan ang sobrang teknikal na 'tabernakulo' at ang tahasang pagpapalit ng larawan ng salitang 'kamatayan.'
