id: 2PE.1.11
reference: 2 Peter 1:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/011.yaml
  text: For in this way entry into the eternal kingdom of our Lord and Savior Jesus the Messiah will be richly provided for you[a][b][c].
translation:
  language: tl
  text: Sapagkat sa ganitong paraan, saganang ipagkakaloob sa inyo ang pagpasok sa walang-hanggang kaharian ng ating Panginoon at Tagapagligtas na si Jesus, ang Mesiyas.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagpasok mismo” o “daan ng pagpasok.” Maaaring tumukoy ang Griyegong εἴσοδος sa akto ng pagpasok o sa pasukan/daan upang makapasok.
    reason: lexical_alternative
  - marker: b
    text: 'Tradisyonal na salin: “Jesucristo.” Ang Griyegong titulong Χριστός ay isinalin dito bilang “Mesiyas” upang mapanatili ang kahulugan nito.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: sa ganitong paraan
  rationale: Tumutukoy pabalik sa paraan ng pamumuhay na inilarawan sa naunang konteksto at pinananatili ang demonstratibong diin.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag na kaugnayan ng talata sa naunang pahayag.
- source_word: πλουσίως
  choice: saganang
  rationale: Ipinahahayag ang kasaganaan o pagiging bukas-palad ng pagkakaloob nang hindi lumalabis sa pagpapakahulugan.
- source_word: ἐπιχορηγηθήσεται
  choice: ipagkakaloob
  rationale: Pinananatili ang hinaharap at balintiyak na anyo; natural itong katambal ng “saganang” sa Filipino.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Tuwirang ipinapahayag ang datibong tumutukoy sa mga tatanggap ng pagkakaloob.
- source_word: ἡ εἴσοδος
  choice: ang pagpasok
  rationale: Maaaring tumukoy sa akto ng pagpasok o sa daan/pahintulot na makapasok; natural dito ang “pagpasok.”
- source_word: εἰς τὴν αἰώνιον βασιλείαν
  choice: sa walang-hanggang kaharian
  rationale: Malinaw at karaniwang salin ng pariralang tumutukoy sa kahariang hindi nagwawakas.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος
  choice: ng ating Panginoon at Tagapagligtas
  rationale: Pinananatili ang dalawang titulo at ang kanilang pagtukoy sa iisang persona ayon sa sintaks ng Griyego.
- source_word: Ἰησοῦ Χριστοῦ
  choice: si Jesus, ang Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” sa natural na anyong Filipino, sa halip na iwan lamang bilang transliterasyong “Cristo.”
theological_decisions:
- issue: Ang tinutukoy ng “ating Panginoon at Tagapagligtas”
  choice: Ang dalawang titulo ay kapwa tumutukoy kay Jesus, ang Mesiyas.
  alternative: Maaaring basahin nang mas maluwag na parang may magkahiwalay na tinutukoy, bagaman hindi ito ang malakas na ipinahihiwatig ng gramatika.
  rationale: Iisang pantukoy ang namamahala sa dalawang pangngalang pantukoy sa persona na pinag-ugnay ng καί, at sinusundan ang mga ito ng pangalang Ἰησοῦ Χριστοῦ; kaya matibay na iisang persona ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang balintiyak na ayos ng Griyego nang hindi nagiging pilit. Ginamit ang “walang-hanggang” bilang mas natural na katumbas ng αἰώνιος, at “si Jesus, ang Mesiyas” upang malinaw na titulo ang Mesiyas.
