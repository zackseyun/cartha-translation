  source_fidelity: Kailangang ayusin ang kaugnayan ng pangwakas na participle. Ang “yamang nakatakas na kayo” ay nagbibigay ng malinaw na sanhi, samantalang ang ἀποφυγόντες ay participle na mas maingat na maipapahayag bilang naunang/kasabay na pangyayari nang hindi ipinipilit ang ugnayang sanhi. Ang “kabulukan” ay maaari, ngunit ang “katiwalian” ay mas malinaw para sa φθορά sa ganitong kontekstong moral.
  naturalness: Maayos sa pangkalahatan ang antas ng wika, ngunit mas natural ang ayos na “mga pangakong mahalaga at napakadakila” at “maging kabahagi kayo.” Ang binagong pangwakas na sugnay ay mas malinaw at hindi nagdaragdag ng causative na diwa.
  terminology: Ang “banal na kalikasan” ay matatag at natural na katumbas ng θείας φύσεως; pinananatili nito ang bigat ng “divine nature” nang hindi ipinapakahulugang ang tao ay nagiging Diyos sa esensiya. Ang “makasalanang pagnanasa” ay angkop para sa negatibong gamit ng ἐπιθυμία rito.
