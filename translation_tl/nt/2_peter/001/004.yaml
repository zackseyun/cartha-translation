  to: Sa pamamagitan ng mga ito, ipinagkaloob niya sa atin ang mga pangakong mahalaga at napakadakila, upang sa pamamagitan ng mga ito ay maging kabahagi kayo ng banal na kalikasan[a], matapos ninyong matakasan ang katiwaliang nasa mundo dahil sa makasalanang pagnanasa.[b]
