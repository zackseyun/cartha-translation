  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: δι’ ὧν τὰ ⸂τίμια καὶ μέγιστα ἡμῖν⸃ ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, ἀποφυγόντες τῆς ἐν ⸀τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/004.yaml
  text: through which he has granted to us his precious and very great promises[a], so that through these you may become sharers in the divine nature[b], having escaped the corruption that is in the world because of sinful desire.
translation:
  language: tl
  text: Sa pamamagitan ng mga ito, ipinagkaloob niya sa atin ang mga pangakong mahalaga at napakadakila, upang sa pamamagitan ng mga ito ay maging kabahagi kayo ng banal na kalikasan[a], matapos ninyong matakasan ang katiwaliang nasa mundo dahil sa makasalanang pagnanasa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga nakikibahagi sa banal na kalikasan.” Tumutukoy ang parirala sa pakikibahagi sa nagmumula sa Diyos, hindi sa pagiging Diyos ayon sa likas na esensiya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dahil sa pagnanasa” o “sa pamamagitan ng mahalay na pagnanasa.” Maaaring tumukoy ang salitang Griyego sa pagnanasa sa pangkalahatan, ngunit negatibo ang moral na diwa nito rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: Sa pamamagitan ng mga ito
  rationale: Ipinapakita ang instrumental na diwa ng διά na may genitive at pinananatiling hindi tiyak ang tinutukoy ng panghalip, gaya ng Griyego.
- source_word: τίμια καὶ μέγιστα
  choice: mahahalaga at napakadakila
  rationale: Ang τίμια ay tumutukoy sa pagiging mahalaga o mahalaga sa pagpapahalaga, at ang superlatibong μέγιστα ay natural na naihahayag sa Tagalog bilang “napakadakila.”
- source_word: ἡμῖν
  choice: sa atin
  rationale: Likas na katumbas ng dative na tumutukoy sa mga tumanggap ng ipinagkaloob.
- source_word: ἐπαγγέλματα
  choice: mga pangako
  rationale: Malinaw at karaniwang katumbas ng mga ipinangakong kaloob o katiyakan.
- source_word: δεδώρηται
  choice: ipinagkaloob niya
  rationale: Ipinahahayag ng “ipinagkaloob” ang mapagbigay at biyayang pagbibigay; ang di-binanggit na simuno ay ipinahihiwatig ng konteksto.
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili ang diwa ng layunin o nilalayong bunga.
- source_word: διὰ τούτων
  choice: sa pamamagitan ng mga ito
  rationale: Tumutukoy sa mga pangakong kababanggit lamang at pinananatili ang instrumental na ugnayan.
- source_word: γένησθε
  choice: maging mga kabahagi kayo
  rationale: Ang “maging” ay nagpapanatili sa diwa ng pagdating sa isang kalagayan, hindi lamang simpleng pag-iral.
- source_word: θείας κοινωνοὶ φύσεως
  choice: mga kabahagi sa kalikasan ng Diyos
  rationale: Ang “kabahagi” ay natural na naghahatid ng tunay na pakikibahagi, habang pinananatili ng “kalikasan ng Diyos” ang lakas at teolohikal na tensiyon ng parirala.
- source_word: ἀποφυγόντες
  choice: yamang nakatakas na kayo
  rationale: Ipinakikita ang kilos na kaugnay at maaaring nauna sa pagiging kabahagi, habang natural ang daloy sa Tagalog.
- source_word: φθορᾶς
  choice: kabulukan
  rationale: Napananatili ang larawan ng pagkasira o korupsiyong moral nang hindi ito nililimitahan sa pisikal na pagkabulok.
- source_word: ἐν τῷ κόσμῳ
  choice: nasa mundo
  rationale: Tuwirang inilalarawan ang kabulukang umiiral sa mundo.
- source_word: ἐν ἐπιθυμίᾳ
  choice: dahil sa makasalanang pagnanasa
  rationale: Ang ἐπιθυμία ay maaaring mangahulugang pagnanasa sa pangkalahatan, ngunit negatibo ang moral na diwa rito dahil kaugnay ito ng kabulukan ng mundo.
theological_decisions:
- issue: θείας κοινωνοὶ φύσεως at pakikibahagi sa kalikasan ng Diyos
  choice: mga kabahagi sa kalikasan ng Diyos
  alternative: mga nakikibahagi sa banal na kalikasan
  rationale: Pinananatili ang matibay na wika ng teksto tungkol sa pakikibahagi nang hindi ipinapakahulugang nagiging Diyos sa likas na esensiya ang mga mananampalataya o ikinakabit ang parirala sa isang partikular na sistemang doktrinal.
- issue: Negatibong moral na diwa ng ἐπιθυμία
  choice: makasalanang pagnanasa
  alternative: pagnanasa; mahalay na pagnanasa
  rationale: Nililinaw ng konteksto na negatibo ang pagnanasa, ngunit iniiwasang paliitin ito sa seksuwal na pagnanasa lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mundo” sa halip na mas lumang “sanlibutan,” at pinanatili ang malakas ngunit hindi labis na ipinaliliwanag na pariralang “kalikasan ng Diyos.”
