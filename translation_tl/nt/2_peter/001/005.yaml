  text: καὶ αὐτὸ τοῦτο δὲ σπουδὴν πᾶσαν παρεισενέγκαντες ἐπιχορηγήσατε ἐν τῇ πίστει ὑμῶν τὴν ἀρετήν, ἐν δὲ τῇ ἀρετῇ τὴν γνῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/005.yaml
  text: And for this very reason[a], making every effort, supply in your faith virtue, and in virtue knowledge[d][c][b],
translation:
  language: tl
  text: At dahil dito mismo, gawin ninyo ang buong pagsisikap na idagdag[c] sa inyong pananampalataya[a] ang kabutihang-asal[b], at sa kabutihang-asal ang kaalaman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pananampalataya” (πίστις) ay maaari ring isaling “katapatan” o “pagtitiwala.”
    reason: lexical_alternative
  - marker: b
    text: O “kahusayan sa asal” o “kagalingang moral” para sa “kabutihang-asal” (ἀρετή).
    reason: lexical_alternative
  - marker: c
    text: Ang pandiwang isinaling “idagdag” ay maaari ring isaling “maglaan” o “ipagkaloob,” na may diwa ng saganang paglalaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸ τοῦτο δὲ
  choice: At dahil dito mismo
  rationale: 'Natural na ipinahahayag ang mariing pag-uugnay sa naunang pahayag: ang utos ay bunga ng binanggit na ginawa at mga pangako ng Diyos.'
- source_word: σπουδὴν πᾶσαν παρεισενέγκαντες
  choice: gawin ninyo ang lahat ng pagsisikap
  rationale: Pinagsama sa likas na Filipino ang participle at ang diwa ng buong sikap o masigasig na pagkilos, nang hindi pinapahina ang bigat ng panawagan.
- source_word: ἐπιχορηγήσατε
  choice: idagdag
  rationale: Sa konteksto ng sunod-sunod na mga katangiang dapat taglayin, malinaw at natural ang “idagdag”; maaari ring tumukoy ang pandiwa sa saganang paglalaan o pagtustos.
- source_word: ἐν τῇ πίστει ὑμῶν
  choice: sa inyong pananampalataya
  rationale: Pinananatili ang ugnayan ng unang katangian sa kasunod, habang ginagamit ang natural na pariralang Filipino sa konstruksyong “idagdag sa.”
- source_word: πίστει
  choice: pananampalataya
  rationale: Ito ang karaniwan at pinakatuwirang salin ng πίστις dito; inilalagay sa talababa ang posibleng mga diwang “katapatan” at “pagtitiwala.”
- source_word: ἀρετήν
  choice: kabutihang-asal
  rationale: Ipinahahayag nito sa malinaw na modernong Filipino ang kahusayan o kagalingang moral na tinutukoy ng ἀρετή, nang hindi maging teknikal ang pananalita.
- source_word: γνῶσιν
  choice: kaalaman
  rationale: Tuwirang pinananatili ang pangunahing leksikal na diwa ng γνῶσις at ang pagkakasunod ng mga katangian.
theological_decisions:
- issue: Kahulugan ng πίστις sa talaan ng mga katangian
  choice: pananampalataya
  alternative: katapatan o pagtitiwala
  rationale: Hindi lubusang nilulutas ng konteksto ang saklaw ng πίστις. Ginamit sa pangunahing teksto ang karaniwang “pananampalataya,” at pinanatili sa talababa ang lehitimong mga alternatibo.
- issue: Ugnayan ng mga katangian sa paulit-ulit na ἐν + dative
  choice: idagdag sa inyong pananampalataya … at sa kabutihang-asal
  alternative: itaguyod/taglayin sa loob ng bawat naunang katangian ang kasunod
  rationale: Ang “idagdag sa” ay natural sa Filipino at angkop sa retorikal na pagkakasunod, ngunit hindi ipinapalagay na magkakahiwalay lamang o mahigpit na sunod-sunod ang paglago ng mga katangian.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Iniiwasan ang literal ngunit alanganing “maglaan sa loob ng pananampalataya,” habang pinananatili ang malinaw na tanikala ng pananampalataya, kabutihang-asal, at kaalaman.
