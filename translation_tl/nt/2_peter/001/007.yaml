  text: ἐν δὲ τῇ εὐσεβείᾳ τὴν φιλαδελφίαν, ἐν δὲ τῇ φιλαδελφίᾳ τὴν ἀγάπην·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/007.yaml
  text: and in godliness[a], brotherly affection; and in brotherly affection, love.
translation:
  language: tl
  text: at sa maka-Diyos na pamumuhay, ang pagmamahal sa mga kapatid[a]; at sa pagmamahal sa mga kapatid, ang pag-ibig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” dito ay lalo nang tumutukoy sa mga kapwa mananampalataya; maaari ring isalin ang parirala na “pagmamahalang magkakapatid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβείᾳ
  choice: maka-Diyos na pamumuhay
  rationale: Ipinahahayag ng εὐσέβεια ang debosyon at paggalang sa Diyos na nakikita sa asal at pamumuhay. Mas natural at masaklaw ito sa modernong Tagalog kaysa sa “kabanalan,” na maaari ring tumumbas sa ibang konseptong Griyego.
- source_word: φιλαδελφίαν
  choice: pagmamahal sa mga kapatid
  rationale: Tumutukoy ang φιλαδελφία sa magiliw na pagmamahal na tulad ng sa magkakapatid, lalo na sa mga kapwa mananampalataya. Pinananatili ng pariralang ito ang saklaw ng salita at naihihiwalay ito sa kasunod na ἀγάπη.
- source_word: ἀγάπην
  choice: pag-ibig
  rationale: Ang payak na “pag-ibig” ay nagpapanatili sa malawak na kahulugan ng ἀγάπη at sa kasukdulang puwesto nito sa hanay nang hindi dinaragdagan ng isang partikular na teolohikal na paliwanag.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: at sa ..., ang ...
  rationale: Pinananatili nito ang inuulit na kayarian at ang ugnayan ng bawat katangian sa kasunod nito. Ang “ang” ay idinagdag para sa malinaw at natural na daloy sa Tagalog, samantalang ang pandiwang ipinag-uutos ay nauunawaan mula sa naunang talata.
- source_word: δέ
  choice: at
  rationale: Dugtong at hindi pagsalungat ang gamit ng δέ sa pinagsama-samang hanay ng mga katangian.
theological_decisions:
- issue: Pagkilala sa pagkakaiba ng φιλαδελφία at ἀγάπη sa hanay ng mga katangian
  choice: Isalin ang φιλαδελφία bilang “pagmamahal sa mga kapatid” at ang ἀγάπη bilang “pag-ibig.”
  alternative: Isalin ang φιλαδελφία bilang “pag-ibig sa mga kapatid” at ang ἀγάπη bilang “pag-ibig.”
  rationale: Magkaiba ngunit magkaugnay na mga salita ang sinadyang gamitin sa Griyego. Ang “pagmamahal sa mga kapatid” ay nagpapanatili ng pagkakaiba at ng pag-usad mula sa pagmamalasakit sa kapwa mananampalataya tungo sa mas malawak na pag-ibig.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang magkatulad na kayarian ng dalawang sugnay at ang pagkakaiba ng dalawang salitang Griyego para sa pagmamahal at pag-ibig.
