  to: അവൻതന്നെ അവരുടെ മുമ്പിൽ മുന്നോട്ടുപോയി; തന്റെ സഹോദരന്റെ അടുത്തെത്തുന്നതുവരെ ഏഴു പ്രാവശ്യം നിലംതൊട്ട് കുമ്പിട്ടു[a].
