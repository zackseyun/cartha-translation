id: GEN.33.3
reference: Genesis 33:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/ה֖וּא עָבַ֣ר לִ/פְנֵי/הֶ֑ם וַ/יִּשְׁתַּ֤חוּ אַ֨רְצָ/ה֙ שֶׁ֣בַע פְּעָמִ֔ים עַד גִּשְׁתּ֖/וֹ עַד אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/003.yaml
  text: And he himself went on ahead of them and bowed down to the ground seven times[a], until he came near to his brother.
translation:
  language: ml
  text: അവൻതന്നെ അവരുടെ മുമ്പിൽ മുന്നോട്ടുപോയി; തന്റെ സഹോദരന്റെ അടുത്തെത്തുന്നതുവരെ ഏഴു പ്രാവശ്യം നിലംതൊട്ട് കുമ്പിട്ടു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിലത്ത് സാഷ്ടാംഗം വീണു”; എബ്രായ ക്രിയയ്ക്ക് ശരീരം പൂർണമായി താഴ്ത്തിയുള്ള ആദരപ്രകടനത്തെ സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: അവൻതന്നെ
  rationale: സ്വതന്ത്ര സർവനാമം കർത്താവിന് ഊന്നൽ നൽകുന്നതിനാൽ, യാക്കോബ് നേരിട്ട് മുന്നോട്ടുപോയത് വ്യക്തമാക്കുന്നു.
- source_word: עָבַר לִפְנֵיהֶם
  choice: അവരുടെ മുമ്പിലായി നടന്നു
  rationale: കുടുംബത്തെ മറികടന്ന് ഏശാവിനെ നേരിടാൻ മുന്നിൽ പോകുന്ന സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּשְׁתַּחוּ ... אַרְצָה
  choice: നിലംവരെ കുനിഞ്ഞു വണങ്ങി
  rationale: ക്രിയ സൂചിപ്പിക്കുന്ന ആഴമുള്ള ആദരവിനെയും നിലത്തേക്കുള്ള ശാരീരിക ചലനത്തെയും നിലനിർത്തുന്നു; ആരാധനയെന്ന അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: שֶׁבַע פְּעָמִים
  choice: ഏഴു പ്രാവശ്യം
  rationale: സംഖ്യാവാചകത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: עַד גִּשְׁתּוֹ עַד אָחִיו
  choice: തന്റെ സഹോദരന്റെ അടുത്തെത്തുന്നതുവരെ
  rationale: ആവർത്തിച്ചുള്ള വണക്കം സഹോദരനെ സമീപിക്കുന്നതുവരെ തുടർന്നുവെന്ന പരിധി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; രണ്ടാമത്തെ עַד വേറൊരു ‘വരെ’ ആയി കൃത്രിമമായി ആവർത്തിക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കുനിഞ്ഞു വണങ്ങി’ എന്ന പ്രയോഗം ആദരപ്രകടനം വ്യക്തമാക്കുകയും ആരാധനയെന്ന പ്രത്യേക ദൈവശാസ്ത്രാർഥം നിർബന്ധമായി ചുമത്താതിരിക്കുകയും ചെയ്യുന്നു.
