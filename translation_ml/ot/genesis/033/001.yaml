id: GEN.33.1
reference: Genesis 33:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א יַעֲקֹ֜ב עֵינָ֗י/ו וַ/יַּרְא֙ וְ/הִנֵּ֣ה עֵשָׂ֣ו בָּ֔א וְ/עִמּ֕/וֹ אַרְבַּ֥ע מֵא֖וֹת אִ֑ישׁ וַ/יַּ֣חַץ אֶת הַ/יְלָדִ֗ים עַל לֵאָה֙ וְ/עַל רָחֵ֔ל וְ/עַ֖ל שְׁתֵּ֥י הַ/שְּׁפָחֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/001.yaml
  text: Then Jacob lifted up his eyes and looked[a], and behold, Esau was coming, and with him were four hundred men. So he divided the children among Leah, Rachel[c][b], and the two female servants.
translation:
  language: ml
  text: പിന്നെ യാക്കോബ് കണ്ണുയർത്തി നോക്കി[a]. അതാ[b], ഏശാവ് വരുന്നു; അവനോടൊപ്പം നാനൂറ് പുരുഷന്മാരുമുണ്ട്. അതുകൊണ്ട് അവൻ മക്കളെ ലേയായുടെയും റാഹേലിന്റെയും രണ്ടു ദാസിമാരുടെയും ഇടയിൽ വിഭജിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുകളിലേക്കു നോക്കി.’
    reason: lexical_alternative
  - marker: b
    text: ‘അതാ’ എന്നത് ഏശാവ് സമീപിക്കുന്നതിലേക്കു സജീവമായി ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ അവതരണസൂചകമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו וַיַּרְא
  choice: കണ്ണുയർത്തി നോക്കി
  rationale: എബ്രായത്തിലെ ‘കണ്ണുകൾ ഉയർത്തുക’ എന്ന പ്രയോഗവും തുടർന്നുള്ള ദർശനക്രിയയും സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; ‘മുകളിലേക്കു നോക്കി’ എന്നും പറയാം.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: ഏശാവിന്റെ സമീപനത്തിലേക്ക് വായനക്കാരന്റെ ശ്രദ്ധ സജീവമായി തിരിക്കുന്ന ദൃശ്യാവതരണസൂചകം.
- source_word: בָּא
  choice: വരുന്നു
  rationale: ഏശാവ് സമീപിച്ചുകൊണ്ടിരിക്കുന്നതായി പങ്കാളിപദത്തിന്റെ പുരോഗമനഭാവം പ്രകടമാക്കുന്നു.
- source_word: וְעִמּוֹ אַרְבַּע מֵאוֹת אִישׁ
  choice: അവനോടൊപ്പം നാനൂറു പുരുഷന്മാരുമുണ്ട്
  rationale: ഏശാവിനൊപ്പമുള്ള വലിയ സംഘത്തെ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיַּחַץ
  choice: വേർതിരിച്ചു
  rationale: മക്കളെ വിവിധ സ്ത്രീകളോടു ചേർന്ന കൂട്ടങ്ങളായി വിഭജിച്ച പ്രവൃത്തിയെ സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַיְלָדִים
  choice: മക്കളെ
  rationale: ഇവിടെ യാക്കോബിന്റെ കുടുംബത്തിലെ കുട്ടികളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ബന്ധസൂചനയോടെ ‘മക്കൾ’ സ്വാഭാവികമാണ്.
- source_word: עַל לֵאָה וְעַל רָחֵל וְעַל שְׁתֵּי הַשְּׁפָחוֹת
  choice: ലേയയോടും റാഹേലിനോടും രണ്ടു ദാസിമാരോടും ചേർത്ത്
  rationale: ആവർത്തിക്കുന്ന עַל മക്കളെ ഓരോ സ്ത്രീയോടും ചേർത്ത് കൂട്ടങ്ങളാക്കിയെന്ന അർഥത്തിൽ എടുത്തിരിക്കുന്നു; שְׁפָחוֹת എന്നതിന് സന്ദർഭോചിതമായി ‘ദാസിമാർ’ ഉപയോഗിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അതാ’ എന്ന ഉയർന്നെങ്കിലും പൊതുവേ ഗ്രഹിക്കാവുന്ന രൂപം മൂലപാഠത്തിലെ ദൃശ്യതയും ശ്രദ്ധാകർഷണവും നിലനിർത്തുന്നു.
