reference: Genesis 33:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשָּׂ֣א אֶת עֵינָ֗י/ו וַ/יַּ֤רְא אֶת הַ/נָּשִׁים֙ וְ/אֶת הַ/יְלָדִ֔ים וַ/יֹּ֖אמֶר מִי אֵ֣לֶּה לָּ֑/ךְ וַ/יֹּאמַ֕ר הַ/יְלָדִ֕ים אֲשֶׁר חָנַ֥ן אֱלֹהִ֖ים אֶת עַבְדֶּֽ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/005.yaml
  text: He lifted up his eyes and saw the women and the children[a], and he said, “Who are these with you?” And he said[b], “The children whom God has graciously given to your servant.”
translation:
  language: ml
  text: 'അവൻ കണ്ണുകൾ ഉയർത്തി സ്ത്രീകളെയും കുട്ടികളെയും കണ്ടു. “നിന്റെ കൂടെയുള്ള ഇവർ ആരാണ്?”[a] എന്ന് അവൻ ചോദിച്ചു. അവൻ മറുപടി പറഞ്ഞു: “ദൈവം അങ്ങയുടെ ദാസന് കൃപയോടെ നൽകിയ കുട്ടികളാണ് ഇവർ.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിനക്കുള്ള ഇവർ ആരാണ്?” കൂടെയുള്ളവരുടെ തിരിച്ചറിയലോ അവരുമായുള്ള ബന്ധമോ ചോദിക്കുന്ന ഒരു എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ദൈവം അങ്ങയുടെ ദാസന് നൽകിയ കുട്ടികളാണ് ഇവർ.” എബ്രായ ക്രിയയ്ക്ക് കൃപയോ പ്രീതിയോ കാണിക്കുക എന്ന ഭാവവും ഉണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא אֶת עֵינָיו
  choice: അവൻ കണ്ണുകളുയർത്തി
  rationale: നോട്ടം ഉയർത്തുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആഖ്യാനഭാവം നിലനിർത്തുന്ന, മലയാളത്തിൽ മനസ്സിലാകുന്ന പരിഭാഷ.
- source_word: הַנָּשִׁים
  choice: സ്ത്രീകളെ
  rationale: സന്ദർഭത്തിൽ യാക്കോബിന്റെ ഭാര്യമാരും ഉപഭാര്യമാരുമാണെങ്കിലും മൂലപാഠത്തിലെ പൊതുവായ ‘സ്ത്രീകൾ’ എന്ന അർഥം കൂടുതൽ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: הַיְלָדִים
  choice: കുട്ടികളെ / കുട്ടികളാണ്
  rationale: രണ്ടിടത്തും വരുന്ന പദത്തിന് സന്ദർഭോചിതവും സ്വാഭാവികവുമായ ഒരേ മലയാളപദം ഉപയോഗിച്ചു.
- source_word: מִי אֵלֶּה לָּךְ
  choice: നിന്റെ കൂടെയുള്ള ഇവർ ആരാണ്?
  rationale: അക്ഷരാർഥത്തിൽ ‘നിനക്ക്/നിന്നോട് ഇവർ ആരാണ്?’ എന്ന ഘടനയായിരുന്നാലും, കൂടെയുള്ളവരുടെ തിരിച്ചറിയൽ ചോദിക്കുന്ന പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: חָנַן
  choice: കൃപയോടെ നൽകിയ
  rationale: വെറും ‘നൽകുക’ എന്നതിലുപരി അനുഗ്രഹപൂർവം കൃപ കാണിക്കുക എന്ന ക്രിയയുടെ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഇവിടെ ഏകവചന ദൈവസൂചകമായി വരുന്ന പദത്തിന്റെ സാധാരണ മലയാളപരിഭാഷ.
- source_word: עַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസന്
  rationale: ഏശാവിനോടുള്ള യാക്കോബിന്റെ ആദരപൂർവമായ സ്വയംവിശേഷണമാണ്; ‘ദാസൻ’ സാമൂഹിക വിനയം നിലനിർത്തുന്നു, ‘അങ്ങയുടെ’ അതിനൊത്ത ആദരസൂചകമാണ്.
theological_decisions:
- issue: കുട്ടികൾ ദൈവത്തിന്റെ കൃപാപൂർവമായ ദാനമാണെന്ന ഭാവം
  choice: ദൈവം അങ്ങയുടെ ദാസന് കൃപയോടെ നൽകിയ കുട്ടികൾ
  alternative: ദൈവം അങ്ങയുടെ ദാസന് നൽകിയ കുട്ടികൾ
  rationale: חָנַן എന്ന ക്രിയയിൽ കൃപയും പ്രീതിയും കാണിക്കുന്ന ഭാവം ഉള്ളതിനാൽ, അധിക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതെ ആ സൂക്ഷ്മത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആഖ്യാനത്തിലെ ആവർത്തിച്ച ‘അവൻ’ മൂലപാഠത്തിലെ സർവനാമരൂപം നിലനിർത്തുന്നു; സന്ദർഭം ചോദിക്കുന്നവനെയും മറുപടി പറയുന്നവനെയും വ്യക്തമാക്കുന്നു. യാക്കോബിന്റെ വിനയപൂർവമായ അഭിസംബോധന പ്രകടമാക്കാൻ ‘അങ്ങയുടെ ദാസന്’ ഉപയോഗിച്ചു.
