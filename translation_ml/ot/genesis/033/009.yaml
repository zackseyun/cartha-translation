  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר עֵשָׂ֖ו יֶשׁ לִ֣/י רָ֑ב אָחִ֕/י יְהִ֥י לְ/ךָ֖ אֲשֶׁר לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/009.yaml
  text: But Esau said[a], “I have plenty, my brother; let what is yours be yours.”
translation:
  language: ml
  text: 'എന്നാൽ ഏശാവ് പറഞ്ഞു[a]: “എന്റെ സഹോദരാ, എനിക്ക് ധാരാളമുണ്ട്; നിനക്കുള്ളത് നിനക്കുതന്നെ ആയിരിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അപ്പോൾ ഏശാവ് പറഞ്ഞു: ‘എന്റെ സഹോദരാ, എനിക്ക് വേണ്ടത്രയുണ്ട്; നിനക്കുള്ളത് നിനക്കുതന്നെ ആയിരിക്കട്ടെ.’”'
    reason: ആഖ്യാനബന്ധകമായ וַ എന്നത് ‘അപ്പോൾ’ എന്നും, רָב സന്ദർഭത്തിൽ ‘വേണ്ടത്ര’ എന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാഘടകം ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; യാക്കോബിന്റെ സമ്മാനം ഏശാവ് സൗമ്യമായി നിരസിക്കുന്നതിനാൽ സന്ദർഭത്തിലെ നേരിയ വൈരുധ്യം ‘എന്നാൽ’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עֵשָׂו
  choice: ഏശാവ്
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ പേരുരൂപം ഉപയോഗിച്ചു.
- source_word: יֶשׁ לִי רָב
  choice: എനിക്ക് ധാരാളമുണ്ട്
  rationale: ‘എനിക്ക് ഏറെ ഉണ്ട്’ എന്ന ഉടമസ്ഥതാസൂചക പ്രയോഗത്തെയും רָב എന്ന പദത്തിലെ സമൃദ്ധിയുടെ ആശയത്തെയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; കേവലം മതിയെന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: אָחִי
  choice: എന്റെ സഹോദരാ
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയമുള്ള സംബോധനയുടെ ബന്ധസൗഹൃദവും ഊഷ്മളതയും നിലനിർത്തുന്നു.
- source_word: יְהִי לְךָ אֲשֶׁר לָךְ
  choice: നിനക്കുള്ളത് നിനക്കുതന്നെ ആയിരിക്കട്ടെ
  rationale: היה എന്ന ക്രിയയുടെ ജസ്സീവ് രൂപത്തെ വിനയപൂർവമായ അനുവദനീയ നിർദേശമായി അവതരിപ്പിക്കുകയും, യാക്കോബിന്റെ വസ്തുക്കൾ അവനുതന്നെ ഇരിക്കട്ടെയെന്ന ഏശാവിന്റെ നിരസനം അധിക ആശയം ചേർക്കാതെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
