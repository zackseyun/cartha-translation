translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘എന്റെ സഹോദരാ’ ബന്ധത്തിലെ ഊഷ്മളത നിലനിർത്തുന്നു; ‘ആയിരിക്കട്ടെ’ വിനയപൂർവമായ ജസ്സീവ് ഭാവം പകരുന്നു.
