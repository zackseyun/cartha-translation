  text: וַ/יָּ֨רָץ עֵשָׂ֤ו לִ/קְרָאת/וֹ֙ וַֽ/יְחַבְּקֵ֔/הוּ וַ/יִּפֹּ֥ל עַל צַוָּארָ֖/ו וַׄ/יִּׄשָּׁׄקֵ֑ׄ/הׄוּׄ וַ/יִּבְכּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/004.yaml
  text: Esau ran to meet him[a], embraced him, fell on his neck, kissed him, and they wept.
translation:
  language: ml
  text: ഏശാവ് അവനെ എതിരേൽക്കാൻ ഓടിവന്ന് അവനെ ആലിംഗനം ചെയ്തു; അവന്റെ കഴുത്തിൽ വീണ് അവനെ ചുംബിച്ചു.[a] അവർ ഇരുവരും കരഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനെ ചുംബിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന വാക്കിലെ അക്ഷരങ്ങൾക്കു മുകളിൽ മസോററ്റിക് പാഠത്തിൽ അസാധാരണ പുള്ളികളുണ്ട്. ഇത് സംശയത്തെയോ ഊന്നലിനെയോ സൂചിപ്പിക്കുന്നതായി ചിലർ വ്യാഖ്യാനിക്കുന്നു; എന്നാൽ ഇവിടെ എബ്രായവാചകത്തിന്റെ നേരായ അർഥം ‘അവനെ ചുംബിച്ചു’ എന്നുതന്നെയാണ്.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּרָץ
  choice: ഓടിവന്ന്
  rationale: רוץ എന്ന ക്രിയയുടെ നേരായ അർഥമായ ഓട്ടവും തുടർന്നുള്ള പ്രവർത്തനത്തിലേക്കുള്ള വേഗമുള്ള നീക്കവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עֵשָׂו
  choice: ഏശാവ്
  rationale: മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ പേരുരൂപം ഉപയോഗിച്ചു.
- source_word: לִקְרָאתוֹ
  choice: അവനെ എതിരേൽക്കാൻ
  rationale: לקראת എന്ന പ്രയോഗം ഒരാളെ നേരിൽ ചെന്നു കാണുക/സ്വീകരിക്കുക എന്ന ബന്ധപരമായ ചലനത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘എതിരേൽക്കാൻ’ സ്വാഭാവികമാണ്.
- source_word: וַיְחַבְּקֵהוּ
  choice: അവനെ ആലിംഗനം ചെയ്തു
  rationale: חבק എന്നതിന്റെ അർഥം വ്യക്തമായി നൽകുകയും ആഖ്യാനത്തിന് യോജിച്ച മാന്യമായ ആധുനിക രജിസ്റ്റർ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיִּפֹּל עַל צַוָּארוֹ
  choice: അവന്റെ കഴുത്തിൽ വീണ്
  rationale: വികാരഭരിതമായ ആലിംഗനത്തെ ചിത്രീകരിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സജീവ ദൃശ്യരൂപം പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തുന്നു.
- source_word: וַיִּשָּׁקֵהוּ
  choice: അവനെ ചുംബിച്ചു
  rationale: נשק എന്ന ക്രിയയുടെ നേരായ അർഥം നൽകുന്നു; മസോററ്റിക് അടയാളത്തിന്റെ അസാധാരണത മുഖ്യവാചകം മാറ്റാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: וַיִּבְכּוּ
  choice: അവർ ഇരുവരും കരഞ്ഞു
  rationale: ബഹുവചനക്രിയ ഇരുവരെയും ഉൾക്കൊള്ളുന്നതായി മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു; ‘കരഞ്ഞു’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വികാരഭാവത്തിന് യോജിച്ചതുമാണ്.
theological_decisions:
- issue: യാക്കോബിനോടുള്ള ഏശാവിന്റെ പ്രവൃത്തികളുടെ വ്യാഖ്യാനം
  choice: അനുരഞ്ജനവും സ്നേഹവും പ്രകടമാക്കുന്ന പ്രവൃത്തികളുടെ നേരായ പരമ്പരയായി പരിഭാഷപ്പെടുത്തി.
  alternative: പിൽക്കാല വ്യാഖ്യാനപാരമ്പര്യങ്ങളെ ആശ്രയിച്ച് ചുംബനത്തെ സംശയാസ്പദമോ പരിഹാസപരമോ ആയി അവതരിപ്പിക്കുക.
  rationale: എബ്രായ ആഖ്യാനം സ്നേഹപൂർവമായ പ്രവൃത്തികളെ വേഗത്തിലുള്ള ഒരു പരമ്പരയായി അവതരിപ്പിക്കുന്നു. അതിനാൽ സംശയമോ ഉദ്ദേശ്യവ്യാഖ്യാനമോ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ വേഗമുള്ള ക്രിയാപരമ്പര അർധവിരാമവും തുടർച്ചാക്രിയകളും ഉപയോഗിച്ച് നിലനിർത്തി; ‘അവർ ഇരുവരും’ എന്ന് നൽകി ബഹുവചനത്തിന്റെ സൂചന വ്യക്തമാക്കി.
