id: GEN.33.10
reference: Genesis 33:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יַעֲקֹ֗ב אַל נָא֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ וְ/לָקַחְתָּ֥ מִנְחָתִ֖/י מִ/יָּדִ֑/י כִּ֣י עַל כֵּ֞ן רָאִ֣יתִי פָנֶ֗י/ךָ כִּ/רְאֹ֛ת פְּנֵ֥י אֱלֹהִ֖ים וַ/תִּרְצֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/010.yaml
  text: Jacob said[a], “No, please. If I have found favor in your eyes, then take my gift from my hand, because seeing your face is like seeing the face of God[c][b], and you have received me favorably.”
translation:
  language: ml
  text: 'യാക്കോബ് പറഞ്ഞു: “അല്ല, ദയവായി. അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ, എന്റെ കൈയിൽനിന്ന് എന്റെ സമ്മാനം[a] സ്വീകരിക്കണമേ. കാരണം, അങ്ങയുടെ മുഖം കാണുന്നത് ദൈവത്തിന്റെ മുഖം കാണുന്നതുപോലെയാണ്[c]; അങ്ങ് എന്നെ അനുകൂലമായി സ്വീകരിച്ചു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “എന്റെ ഉപഹാരം.” ഹീബ്രു പദത്തിന് സമ്മാനം, കപ്പം, വഴിപാട് എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ ഏശാവിനെ അനുനയിപ്പിക്കാൻ യാക്കോബ് നൽകിയ സമ്മാനമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “അങ്ങ് എന്നെ അംഗീകരിച്ചു” / “അങ്ങ് എന്നിൽ പ്രസാദിച്ചു.” ഹീബ്രു ക്രിയ അനുകൂലമായ സ്വീകരണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: “ഒരു ദേവന്റെ മുഖം” എന്നും വായിക്കാൻ സാധ്യതയുണ്ട്; എന്നാൽ ഉല്പത്തി 32:30-ലെ പെനീയേൽ അനുഭവത്തിന്റെ പശ്ചാത്തലത്തിൽ “ദൈവത്തിന്റെ മുഖം” എന്നതാണ് ഇവിടെ കൂടുതൽ യോജിച്ചത്.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן / בְּעֵינֶיךָ
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ വ്യക്തിപരമായ അംഗീകാരഭാവം നിലനിർത്തുന്നു; ‘കൃപ’ എന്ന കൂടുതൽ ദൈവശാസ്ത്രഭാരമുള്ള പദം ഇവിടെ ഒഴിവാക്കുന്നു.
- source_word: מִנְחָתִי
  choice: എന്റെ സമ്മാനം
  rationale: ഇവിടെ ഏശാവിനെ അനുനയിപ്പിക്കാൻ യാക്കോബ് നൽകുന്ന സമ്മാനമാണ് ഉദ്ദേശ്യം; ‘വഴിപാട്’ എന്നു പറഞ്ഞാൽ ആരാധനാസംബന്ധമായ അർഥം തെറ്റായി തോന്നാം.
- source_word: מִיָּדִי
  choice: എന്റെ കൈയിൽനിന്ന്
  rationale: മൂലത്തിലെ ദൃശ്യമായ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּי עַל־כֵּן
  choice: കാരണം സൂചിപ്പിക്കുന്ന വാക്യബന്ധം
  rationale: യാക്കോബിന്റെ അഭ്യർഥനയ്ക്കുള്ള കാരണം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഹീബ്രുവിലെ ഘടകങ്ങളെ യാന്ത്രികമായി പകർത്തുന്ന അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- source_word: כִּרְאֹת פְּנֵי אֱלֹהִים
  choice: ദൈവത്തിന്റെ മുഖം കാണുന്നതുപോലെയാണ്
  rationale: മുഖം കാണുക എന്ന ഹീബ്രു ദൃശ്യപ്രയോഗവും പെനീയേൽ സംഭവത്തോടുള്ള ശക്തമായ അനുരണനവും നിലനിർത്തുന്നു.
- source_word: וַתִּרְצֵנִי
  choice: അങ്ങ് എന്നെ പ്രസാദത്തോടെ സ്വീകരിച്ചല്ലോ
  rationale: ക്രിയയിലെ അനുകൂലമായ സ്വീകാര്യതയും ബന്ധപരമായ സ്വാഗതവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: אַל נָא אִם נָא
  choice: അല്ല, ദയവായി. … എങ്കിൽ
  rationale: മര്യാദയോടെയുള്ള ഉറച്ച നിരസനവും തുടർന്ന് വരുന്ന അഭ്യർഥനയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: אֱלֹהִים എന്ന പദത്തിന്റെ സൂചിതാർത്ഥം
  choice: ദൈവം
  alternative: ഒരു ദേവൻ / ദൈവിക സത്ത
  rationale: אֱלֹהִים എന്നതിന് വിശാലമായ അർഥസാധ്യതയുണ്ടെങ്കിലും, തൊട്ടുമുമ്പുള്ള പെനീയേൽ സംഭവവും ‘ദൈവത്തിന്റെ മുഖം’ കണ്ടതെന്ന വിഷയബന്ധവും ഏകവചനമായ ‘ദൈവം’ എന്ന വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ഭാഷ ലളിതവും ഗൗരവമുള്ളതുമായി സൂക്ഷിച്ചു; ഹീബ്രുവിലെ ‘മുഖം’, ‘കൈ’ എന്നീ ദൃശ്യപ്രയോഗങ്ങൾ കഴിയുന്നത്ര നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
