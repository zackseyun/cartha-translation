translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മുഖ്യവായനയിൽ വ്യാകരണപരമായി സ്വാഭാവികമായ ‘സുരക്ഷിതനായി’ സ്വീകരിക്കുകയും യഥാർഥമായ സ്ഥലനാമസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
