source:
  edition: WLC
  text: וַ/יָּבֹא֩ יַעֲקֹ֨ב שָׁלֵ֜ם עִ֣יר שְׁכֶ֗ם אֲשֶׁר֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן בְּ/בֹא֖/וֹ מִ/פַּדַּ֣ן אֲרָ֑ם וַ/יִּ֖חַן אֶת פְּנֵ֥י הָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/018.yaml
  text: Jacob came safely to the city of Shechem[a], which is in the land of Canaan, when he came from Paddan-aram[b], and he camped before the city.
translation:
  language: ml
  text: യാക്കോബ് പദ്ദൻ-അരാമിൽനിന്നു വന്നപ്പോൾ കനാൻദേശത്തുള്ള ശെഖേം പട്ടണത്തിൽ സുരക്ഷിതനായി എത്തി[a]. അവൻ പട്ടണത്തിനു മുമ്പിൽ പാളയമടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യാക്കോബ് ശെഖേമിലെ ഒരു പട്ടണമായ ശാലേമിൽ എത്തി.” ശָׁלֵם (ശാലേം) എന്ന എബ്രായപദം “സുരക്ഷിതനായി/സമാധാനത്തോടെ” എന്നോ “ശാലേം” എന്ന സ്ഥലനാമമായോ വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: എത്തി
  rationale: בוא എന്ന ക്രിയയുടെ ആഖ്യാനരൂപം യാക്കോബിന്റെ എത്തിച്ചേരലിനെ സൂചിപ്പിക്കുന്നു; ആവർത്തനം ഒഴിവാക്കി സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: שָׁלֵם
  choice: സുരക്ഷിതനായി
  rationale: ഇവിടെ യാക്കോബ് അപകടമില്ലാതെ, ക്ഷേമത്തോടെ എത്തിയെന്ന ക്രിയാവിശേഷണസദൃശ അർഥമാണ് സന്ദർഭത്തിൽ ഏറ്റവും സ്വാഭാവികം; സ്ഥലനാമമായുള്ള വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עִיר שְׁכֶם
  choice: ശെഖേം പട്ടണം
  rationale: עִיר + സ്ഥലനാമം എന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ‘ശെഖേം പട്ടണം’ എന്നു നൽകുന്നു.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: കനാൻദേശത്തുള്ള
  rationale: ശെഖേമിന്റെ ഭൂമിശാസ്ത്രപരമായ സ്ഥാനം വ്യക്തമാക്കുന്ന ബന്ധവാക്യം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തി.
- source_word: בְּבֹאוֹ מִפַּדַּן אֲרָם
  choice: പദ്ദൻ-അരാമിൽനിന്നു വന്നപ്പോൾ
  rationale: ב + infinitive construct കാലസംബന്ധമായ ‘വന്നപ്പോൾ’ എന്ന അർഥം നൽകുന്നു.
- source_word: פַּדַּן אֲרָם
  choice: പദ്ദൻ-അരാം
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּחַן
  choice: പാളയമടിച്ചു
  rationale: ഇവിടെയുള്ള חנה എന്ന ക്രിയയുടെ അർഥം താൽക്കാലികമായി തങ്ങി പാളയം സ്ഥാപിക്കുക എന്നതാണ്.
- source_word: אֶת פְּנֵי הָעִיר
  choice: പട്ടണത്തിനു മുമ്പിൽ
  rationale: ‘പട്ടണത്തിന്റെ മുഖത്തിനു നേരെ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്ഥലസൂചന മലയാളത്തിൽ ഔപചാരികവും വ്യക്തവുമായി നൽകുന്നു.
