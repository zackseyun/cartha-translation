id: GEN.33.20
reference: Genesis 33:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּצֶּב שָׁ֖ם מִזְבֵּ֑חַ וַ/יִּ֨קְרָא ל֔/וֹ אֵ֖ל אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/020.yaml
  text: There he set up an altar and called it El-Elohe-Israel[a][b].
translation:
  language: ml
  text: അവിടെ അവൻ ഒരു യാഗപീഠം സ്ഥാപിച്ച് അതിന് ഏൽ-എലോഹേ-യിസ്രായേൽ[a][b] എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അവിടെ അവൻ ഒരു യാഗപീഠം സ്ഥാപിച്ച്, ‘ദൈവമേ, യിസ്രായേലിന്റെ ദൈവമേ’ എന്ന് അവനെ വിളിച്ചപേക്ഷിച്ചു”; മറ്റൊരു സാധ്യത: “അതിന്റെമേൽ, ‘ദൈവം യിസ്രായേലിന്റെ ദൈവം’ എന്നു പ്രഖ്യാപിച്ചു.” എബ്രായവാക്യം യാഗപീഠത്തിന് പേരിടുന്നതായോ ദൈവത്തെ വിളിച്ചപേക്ഷിക്കുന്നതായോ ദൈവത്തെക്കുറിച്ച് പ്രഖ്യാപിക്കുന്നതായോ മനസ്സിലാക്കാം.'
    reason: alternative_reading
  - marker: b
    text: ഏൽ-എലോഹേ-യിസ്രായേൽ എന്നതിന്റെ അർഥം “ദൈവം, യിസ്രായേലിന്റെ ദൈവം” അല്ലെങ്കിൽ “ഏൽ, യിസ്രായേലിന്റെ ദൈവം” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֶּב
  choice: സ്ഥാപിച്ച്
  rationale: ഹിഫ്ഇൽ രൂപത്തിലുള്ള נצב ഇവിടെ ഒരു യാഗപീഠം സ്ഥാപിക്കുക അഥവാ പണിതുയർത്തുക എന്നർഥം നൽകുന്നു; ‘സ്ഥാപിച്ച്’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: שָׁם
  choice: അവിടെ
  rationale: സ്ഥലത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന എബ്രായ ക്രിയാവിശേഷണത്തിന്റെ ലളിതമായ മലയാളരൂപം.
- source_word: מִזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ബലിയർപ്പണത്തിനുള്ള ഘടനയെ സൂചിപ്പിക്കുന്ന מִזְבֵּחַ എന്ന പദത്തിന്റെ പൊതുവായി മനസ്സിലാകുന്ന മാനക മലയാളപരിഭാഷ.
- source_word: וַיִּקְרָא לוֹ
  choice: അതിന് ... എന്നു പേരിട്ടു
  rationale: קרא + ל എന്ന ഘടനയ്ക്ക് പേരിടുക എന്ന അർഥം വരാം; തൊട്ടുമുമ്പ് പറഞ്ഞ യാഗപീഠത്തെയാണ് לוֹ സൂചിപ്പിക്കുന്നതെന്ന വായന സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്. ദൈവത്തെ വിളിച്ചപേക്ഷിക്കുകയോ അതിന്മേൽ പ്രഖ്യാപിക്കുകയോ ചെയ്തുവെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֵל אֱלֹהֵי יִשְׂרָאֵל
  choice: ഏൽ-എലോഹേ-യിസ്രായേൽ
  rationale: മുഖ്യവായനയിൽ മുഴുവൻ പ്രയോഗവും യാഗപീഠത്തിന്റെ പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ലിപ്യന്തരണം ചെയ്തു; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: അവസാന പ്രയോഗം യാഗപീഠത്തിന്റെ പേരാണോ, ദൈവത്തോടുള്ള വിളിച്ചപേക്ഷയോ പ്രഖ്യാപനമോ
  choice: യാക്കോബ് യാഗപീഠത്തിന് നൽകിയ പേരായി അവതരിപ്പിച്ചു
  alternative: അവൻ ‘ദൈവമേ, യിസ്രായേലിന്റെ ദൈവമേ’ എന്നു ദൈവത്തെ വിളിച്ചപേക്ഷിച്ചു; അല്ലെങ്കിൽ അതിന്മേൽ ‘ദൈവം യിസ്രായേലിന്റെ ദൈവം’ എന്നു പ്രഖ്യാപിച്ചു
  rationale: യാഗപീഠം സ്ഥാപിച്ചതിനു പിന്നാലെയുള്ള പേരിടൽ ഘടന ഉല്പത്തിയിലെ സമാന പ്രയോഗങ്ങളോട് യോജിക്കുന്നു. എന്നാൽ എബ്രായത്തിലെ קרא לוֹ എന്ന സംക്ഷിപ്ത ഘടന വിളിച്ചപേക്ഷയുടെയോ പ്രഖ്യാപനത്തിന്റെയോ വായന പൂർണമായി ഒഴിവാക്കുന്നില്ല; അതിനാൽ ആ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പാരമ്പര്യ ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ‘യാഗപീഠം’, ‘യിസ്രായേൽ’ എന്നീ രൂപങ്ങൾ നിലനിർത്തി; പേരിന്റെ എബ്രായസ്വഭാവം കാണിക്കാൻ ‘ഏൽ-എലോഹേ-യിസ്രായേൽ’ എന്നു ലിപ്യന്തരിച്ചു.
