  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יַעֲבָר נָ֥א אֲדֹנִ֖/י לִ/פְנֵ֣י עַבְדּ֑/וֹ וַ/אֲנִ֞י אֶֽתְנָהֲלָ֣ה לְ/אִטִּ֗/י לְ/רֶ֨גֶל הַ/מְּלָאכָ֤ה אֲשֶׁר לְ/פָנַ/י֙ וּ/לְ/רֶ֣גֶל הַ/יְלָדִ֔ים עַ֛ד אֲשֶׁר אָבֹ֥א אֶל אֲדֹנִ֖/י שֵׂעִֽירָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/014.yaml
  text: Please let my lord pass on ahead of his servant[a], and I will proceed slowly, at the pace of the livestock that is before me and at the pace of the children[c][b], until I come to my lord at Seir.
translation:
  language: ml
  text: “എന്റെ യജമാനൻ തന്റെ ദാസനു മുമ്പായി കടന്നുപോകണമേ. സേയീരിൽ എന്റെ യജമാനന്റെ അടുക്കൽ എത്തുന്നതുവരെ, എന്റെ മുമ്പിലുള്ള കന്നുകാലികളുടെ നടപ്പിനും കുട്ടികളുടെ നടപ്പിനും അനുസരിച്ച് ഞാൻ സാവധാനം മുന്നോട്ടു നീങ്ങും.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעֲבָר נָא
  choice: കടന്നുപോകണമേ
  rationale: Qal നിർദേശരൂപത്തോടു ചേർന്ന נָא വിനീതമായ അപേക്ഷയെ സൂചിപ്പിക്കുന്നു. ‘കടന്നുപോകണമേ’ ആ ആദരപൂർവമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനൻ
  rationale: യാക്കോബ് ഏശാവിനോടു വിനയപൂർവം ഉപയോഗിക്കുന്ന സാമൂഹിക അഭിസംബോധനയാണ്; ദൈവിക അർഥം ചുമത്താതെ ആവർത്തിതമായ കീഴ്വണക്കഭാവം സംരക്ഷിക്കുന്നു.
- source_word: לִפְנֵי עַבְדּוֹ
  choice: തന്റെ ദാസനു മുമ്പായി
  rationale: എബ്രായത്തിലെ മൂന്നാംപുരുഷ ആത്മപരാമർശവും മുന്നിൽ പോകുക എന്ന സ്ഥലസൂചനയും നിലനിർത്തുന്നു.
- source_word: אֶתְנָהֲלָה לְאִטִּי
  choice: ഞാൻ സാവധാനം മുന്നോട്ടു നീങ്ങാം
  rationale: נהל എന്ന ക്രിയയുടെ hitpael രൂപം സൂക്ഷിച്ചും ക്രമപ്പെടുത്തിയുമുള്ള നീക്കത്തെ സൂചിപ്പിക്കാം; לְאִטִּיയുടെ മന്ദഗതിയും സൗമ്യതയും ‘സാവധാനം’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לְרֶגֶל
  choice: നടപ്പിന് അനുസരിച്ച്
  rationale: അക്ഷരാർഥത്തിൽ ‘കാലിന് അനുസരിച്ച്’ എന്ന പ്രയോഗം മറ്റുള്ളവരുടെ ഗതിക്കനുസരിച്ച് നീങ്ങുക എന്നർഥം നൽകുന്നു; മലയാളത്തിൽ ‘നടപ്പിന് അനുസരിച്ച്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַמְּלָאכָה
  choice: കന്നുകാലികൾ
  rationale: പദത്തിന് സാധാരണയായി ‘വേല’, ‘സ്വത്ത്’, ‘ഉടമസ്ഥവസ്തു’ എന്നീ അർഥങ്ങളുണ്ടെങ്കിലും, ഇവിടെ മുന്നോട്ടു നടത്തപ്പെടുന്ന മൃഗസമ്പത്താണ് സന്ദർഭസൂചന.
- source_word: הַיְלָדִים
  choice: കുട്ടികൾ
  rationale: യാത്രാസംഘത്തിലെ യാക്കോബിന്റെ മക്കളെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്; ‘കുട്ടികൾ’ ആധുനിക മലയാളത്തിൽ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: עַד אֲשֶׁר אָבֹא אֶל אֲדֹנִי שֵׂעִירָה
  choice: സേയീരിൽ എന്റെ യജമാനന്റെ അടുക്കൽ എത്തുന്നതുവരെ
  rationale: ലക്ഷ്യസ്ഥാനമായ സേയീരും യജമാനന്റെ അടുക്കൽ എത്തുന്നതും മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ അവതരിപ്പിക്കുന്നു; വാക്യത്തിന്റെ കാലപരിധി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരപൂർവവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ‘യജമാനൻ/ദാസൻ’ എന്ന മൂന്നാംപുരുഷ വിനയഭാഷ മൂലപാഠത്തിലെ സാമൂഹിക അകലം നിലനിർത്തുന്നു; അപരിചിതമായ പദാനുപദ ഘടനകൾ ഒഴിവാക്കി.
