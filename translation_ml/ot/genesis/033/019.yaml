reference: Genesis 33:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּ֜קֶן אֶת חֶלְקַ֣ת הַ/שָּׂדֶ֗ה אֲשֶׁ֤ר נָֽטָה שָׁם֙ אָהֳל֔/וֹ מִ/יַּ֥ד בְּנֵֽי חֲמ֖וֹר אֲבִ֣י שְׁכֶ֑ם בְּ/מֵאָ֖ה קְשִׂיטָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/019.yaml
  text: And he bought the portion of the field where he had pitched his tent[a], from the hand of the sons of Hamor, the father of Shechem, for a hundred qesitahs.
translation:
  language: ml
  text: അവൻ തന്റെ കൂടാരം അടിച്ചിരുന്ന വയലിന്റെ ഒരു ഭാഗം, ശെഖേമിന്റെ പിതാവായ ഹമോരിന്റെ പുത്രന്മാരിൽനിന്ന് നൂറ് കെസീതയ്ക്ക്[a] വാങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘കെസീത’; കൃത്യമായ സ്വഭാവമോ മൂല്യമോ അറിയാത്ത, പണമടയ്ക്കാൻ ഉപയോഗിച്ചിരുന്ന ഒരു പുരാതന ഘടകമോ വസ്തുവോ. പരമ്പരാഗതമായി ഇതിനെ ‘നാണയങ്ങൾ’ എന്നതുപോലുള്ള വിവിധ രീതികളിൽ പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: വാങ്ങി
  rationale: ഭൂമിയുടെ വില കൊടുത്തുള്ള ഇടപാടിനെ സൂചിപ്പിക്കുന്നതിനാൽ קנה എന്ന ക്രിയയ്ക്ക് ഇവിടെ സ്വാഭാവികമായ അർഥം ‘വാങ്ങുക’ എന്നാണ്.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: വയലിന്റെ ഒരു ഭാഗം
  rationale: חֶלְקָה ഒരു നിശ്ചിത ഭാഗത്തെയോ ഭൂഖണ്ഡത്തെയോ സൂചിപ്പിക്കുന്നു; ‘വയലിന്റെ ഒരു ഭാഗം’ മൂലപാഠത്തിന്റെ ഘടനയും അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר נָטָה שָׁם אָהֳלוֹ
  choice: തന്റെ കൂടാരം അടിച്ചിരുന്ന
  rationale: נטה + אֹהֶל കൂടാരം അടിക്കുക/സ്ഥാപിക്കുക എന്ന പതിവുപ്രയോഗമാണ്; വാങ്ങലിനു മുമ്പുണ്ടായിരുന്ന സാഹചര്യത്തെ ‘അടിച്ചിരുന്ന’ വ്യക്തമാക്കുന്നു.
- source_word: מִיַּד
  choice: നിന്ന്
  rationale: അക്ഷരാർഥം ‘കൈയിൽനിന്ന്’ എന്നാണെങ്കിലും, ഉടമസ്ഥരിൽനിന്നുള്ള വാങ്ങൽ മലയാളത്തിൽ ‘നിന്ന്’ എന്നു പറയുന്നതാണ് സ്വാഭാവികവും ഇടപാടിന്റെ അർഥം വ്യക്തവുമാക്കുന്നത്.
- source_word: בְּנֵי חֲמוֹר
  choice: ഹമോരിന്റെ പുത്രന്മാർ
  rationale: ഹീബ്രായ സംയുക്തപദത്തിന്റെ നേരിട്ടുള്ള, മാന്യമായ മലയാള പരിഭാഷ.
- source_word: אֲבִי שְׁכֶם
  choice: ശെഖേമിന്റെ പിതാവായ
  rationale: ഹമോരിനെ ശെഖേം എന്ന വ്യക്തിയുടെ പിതാവായി തിരിച്ചറിയുന്ന അനുബന്ധപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: നൂറു കെസീതയ്ക്ക്
  rationale: קְשִׂיטָהയുടെ കൃത്യമായ മൂല്യമോ സ്വഭാവമോ അനിശ്ചിതമായതിനാൽ തെറ്റായ കൃത്യത ഒഴിവാക്കാൻ പദം ലിപ്യന്തരണം ചെയ്യുന്നു; വിലയെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘-യ്ക്ക്’ എന്ന രൂപത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മാന്യമായ മലയാളം. ഹീബ്രായ വാക്യത്തിന്റെ ഭൂവാങ്ങൽ പശ്ചാത്തലം നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ ‘കൈയിൽനിന്ന്’ എന്ന പദാനുപദപ്രയോഗം ഒഴിവാക്കി. അനിശ്ചിതമായ പുരാതന പണമൂല്യത്തിന് ലിപ്യന്തരണവും വിശദീകരണ അടിക്കുറിപ്പും ഉപയോഗിച്ചു.
