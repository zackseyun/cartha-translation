  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമം സ്വീകരിച്ചു. ‘മുന്നിൽ—അവരുടെ പിന്നിൽ—ഏറ്റവും പിന്നിൽ’ എന്ന ഘടന മൂലപാഠത്തിലെ മൂന്നു കൂട്ടങ്ങളുടെ സ്ഥാനക്രമം വ്യക്തമായി നിലനിർത്തുന്നു; ഭാഷ dignified ആയിരിക്കുമ്പോഴും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതാണ്.
