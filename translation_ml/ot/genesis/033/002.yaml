  yaml_path: translation/ot/genesis/033/002.yaml
  text: And he put the female servants and their children first[a], and Leah and her children behind them, and Rachel and Joseph last.
translation:
  language: ml
  text: അവൻ ദാസിമാരെയും[a] അവരുടെ മക്കളെയും മുന്നിൽ നിർത്തി; ലേയയെയും അവളുടെ മക്കളെയും അവരുടെ പിന്നിൽ, റാഹേലിനെയും യോസേഫിനെയും ഏറ്റവും പിന്നിൽ നിർത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടിമസ്ത്രീകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം താഴ്ന്ന പദവിയിലുള്ള സ്ത്രീ ഗൃഹസേവികമാരെ സൂചിപ്പിക്കുന്നു; ചില സന്ദർഭങ്ങളിൽ അതിന് ‘അടിമസ്ത്രീകൾ’ എന്ന അർഥവുമുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: നിർത്തി
  rationale: שׂוּם എന്ന ക്രിയയ്ക്ക് ‘വെക്കുക, സ്ഥാപിക്കുക, നിർത്തുക’ എന്നീ അർഥങ്ങളുണ്ട്. ആളുകളെ ക്രമമായി ഓരോ സ്ഥാനത്ത് നിർത്തുന്നതാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; അതിനാൽ മലയാളത്തിൽ ‘നിർത്തി’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: הַשְּׁפָחוֹת
  choice: ദാസിമാർ
  rationale: שִׁפְחָה താഴ്ന്ന സാമൂഹികപദവിയിലുള്ള സ്ത്രീഗൃഹസേവികയെയോ അടിമസ്ത്രീയെയോ സൂചിപ്പിക്കാം. ‘ദാസിമാർ’ പദത്തിന്റെ സാമൂഹിക അസമത്വം നിലനിർത്തുന്നതോടൊപ്പം അർഥത്തെ അനാവശ്യമായി ഒരു നിർവചനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: יַלְדֵיהֶן
  choice: അവരുടെ മക്കൾ
  rationale: יֶלֶד ഇവിടെ ആൺമക്കൾക്കു മാത്രമല്ല, പൊതുവായി മക്കളെ സൂചിപ്പിക്കുന്നു.
- source_word: רִאשֹׁנָה
  choice: മുന്നിൽ
  rationale: ഈ ക്രമീകരണത്തിലെ ആദ്യ സ്ഥാനമാണ് സ്ത്രീലിംഗ ഏകവചന ക്രിയാവിശേഷണരൂപം സൂചിപ്പിക്കുന്നത്; ‘മുന്നിൽ’ സ്ഥലപരമായ ക്രമം വ്യക്തമായി നൽകുന്നു.
- source_word: לֵאָה
  choice: ലേയ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: וִילָדֶיהָ
  choice: അവളുടെ മക്കൾ
  rationale: മൂലപദത്തിന്റെ പൊതുവായ ‘മക്കൾ’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: אַחֲרֹנִים (middle group)
  choice: അവരുടെ പിന്നിൽ
  rationale: മൂന്നു കൂട്ടങ്ങളുടെ ക്രമത്തിൽ രണ്ടാമത്തെ കൂട്ടം ആദ്യ കൂട്ടത്തിനുശേഷവും അവസാന കൂട്ടത്തിനു മുമ്പുമായി നിൽക്കുന്നു; ‘അവരുടെ പിന്നിൽ’ ഈ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: רָחֵל
  choice: റാഹേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: אַחֲרֹנִים (final group)
  choice: ഏറ്റവും പിന്നിൽ
  rationale: അവസാന കൂട്ടത്തിന്റെ സ്ഥാനം സൂചിപ്പിക്കുന്നതിനാൽ ‘ഏറ്റവും പിന്നിൽ’ ക്രമത്തെ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
