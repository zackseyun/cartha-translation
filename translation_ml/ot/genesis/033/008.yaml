source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר מִ֥י לְ/ךָ֛ כָּל הַ/מַּחֲנֶ֥ה הַ/זֶּ֖ה אֲשֶׁ֣ר פָּגָ֑שְׁתִּי וַ/יֹּ֕אמֶר לִ/מְצֹא חֵ֖ן בְּ/עֵינֵ֥י אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/008.yaml
  text: And he said[a], “What do you mean by all this camp that I met?” And he said[c][b], “To find favor in the eyes of my lord.”
translation:
  language: ml
  text: 'അവൻ ചോദിച്ചു: “ഞാൻ കണ്ട ഈ കൂട്ടമൊക്കെയും എന്തിനുള്ളതായിരുന്നു?” യാക്കോബ് പറഞ്ഞു: “എന്റെ പ്രഭുവിന്റെ പ്രീതി ലഭിക്കാനാണ്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്റെ പ്രഭുവിന്റെ പ്രീതി ലഭിക്കാൻ” എന്നതിന്റെ എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ “എന്റെ പ്രഭുവിന്റെ കണ്ണുകളിൽ പ്രീതി കണ്ടെത്താൻ” എന്നാണ്; അതായത് അദ്ദേഹത്തിന്റെ അനുകൂലമായ പരിഗണന നേടാൻ.
    reason: cultural_note
lexical_decisions:
- source_word: מִי לְךָ
  choice: എന്തിനായിരുന്നു?
  rationale: സന്ദർഭത്തിൽ ഈ പ്രയോഗം കൂട്ടത്തിന്റെ ഉദ്ദേശ്യം ചോദിക്കുന്നതാണ്; അക്ഷരാർഥപരമായ രൂപത്തേക്കാൾ സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: כָּל הַמַּחֲנֶה הַזֶּה
  choice: ആ കൂട്ടമെല്ലാം
  rationale: מַחֲנֶה എന്നതിന് സാധാരണയായി ‘പാളയം’ എന്നർഥമുണ്ടെങ്കിലും ഇവിടെ യാക്കോബ് മുമ്പേ അയച്ച മൃഗക്കൂട്ടങ്ങളെയും അവയോടൊപ്പമുള്ളവരെയും കൂട്ടായി സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר פָּגָשְׁתִּי
  choice: ഞാൻ വഴിയിൽ കണ്ട
  rationale: പָּגַשׁ എന്നതിന്റെ ‘കണ്ടുമുട്ടുക/എതിരേൽക്കുക’ എന്ന അർഥം സന്ദർഭോചിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לִמְצֹא חֵן
  choice: പ്രീതി ലഭിക്കാനായിരുന്നു
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive ഘടനയും അനുകൂലമായ പരിഗണന നേടുക എന്ന חֵן-ന്റെ ആശയവും വ്യക്തമാക്കുന്നു.
- source_word: בְּעֵינֵי
  choice: ദൃഷ്ടിയിൽ
  rationale: ‘കണ്ണുകളിൽ’ എന്ന എബ്രായ ഭാഷാശൈലിയുടെ അർഥം നിലനിർത്തുന്ന, മലയാളത്തിൽ പരിചിതമായ പ്രയോഗം.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനന്റെ
  rationale: ഇത് ദൈവിക നാമമല്ല; യാക്കോബ് ഏശാവിനോട് വിനയപൂർവം ഉപയോഗിക്കുന്ന സാമൂഹിക അഭിസംബോധനയാണ്.
