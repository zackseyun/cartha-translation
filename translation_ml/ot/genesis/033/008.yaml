translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആവർത്തിച്ചുള്ള ‘അവൻ പറഞ്ഞു’ എന്ന എബ്രായ ഘടനയിൽ സംസാരിക്കുന്നവരെ സന്ദർഭപ്രകാരം വ്യക്തമാക്കി; അർഥത്തിൽ മാറ്റമില്ല.
