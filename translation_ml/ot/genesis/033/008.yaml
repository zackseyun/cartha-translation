- from: 'അവൻ ചോദിച്ചു: “ഞാൻ വഴിയിൽ കണ്ട ആ കൂട്ടമെല്ലാം എന്തിനായിരുന്നു?” യാക്കോബ് പറഞ്ഞു: “എന്റെ യജമാനന്റെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിക്കാനായിരുന്നു.”[a]'
  to: 'അവൻ ചോദിച്ചു: “ഞാൻ കണ്ട ഈ കൂട്ടമൊക്കെയും എന്തിനുള്ളതായിരുന്നു?” യാക്കോബ് പറഞ്ഞു: “എന്റെ പ്രഭുവിന്റെ പ്രീതി ലഭിക്കാനാണ്.”[a]'
