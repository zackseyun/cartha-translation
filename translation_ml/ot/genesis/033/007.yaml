  text: וַ/תִּגַּ֧שׁ גַּם לֵאָ֛ה וִ/ילָדֶ֖י/הָ וַ/יִּֽשְׁתַּחֲו֑וּ וְ/אַחַ֗ר נִגַּ֥שׁ יוֹסֵ֛ף וְ/רָחֵ֖ל וַ/יִּֽשְׁתַּחֲוֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/007.yaml
  text: Leah also came near[a], and her children, and they bowed down. Afterward Joseph and Rachel came near[b], and they bowed down.
translation:
  language: ml
  text: ലേയയും അവളുടെ മക്കളും അടുത്തുവന്ന്[a] കുമ്പിട്ടു. അതിനുശേഷം യോസേഫും റാഹേലും അടുത്തുവന്ന് കുമ്പിട്ടു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സമീപിച്ചു’; രണ്ടു സന്ദർഭങ്ങളിലും.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സാഷ്ടാംഗം പ്രണമിച്ചു’; എബ്രായ ക്രിയ ആഴമായ ആദരസൂചക വണക്കത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשׁ / נִגַּשׁ
  choice: അടുത്തുവന്ന്
  rationale: נגשׁ അടുത്തേക്കു വരുന്നതിനെയോ സമീപിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. ഏശാവിന്റെ അടുത്തേക്കുള്ള നീക്കം സ്വാഭാവികമായ മലയാളത്തിൽ ഇത് നിലനിർത്തുന്നു.
- source_word: גַּם
  choice: -യും
  rationale: മുൻപുള്ള സംഘങ്ങളോടു ചേർന്നുള്ള അടുത്ത ഘട്ടമാണെന്ന് മലയാളത്തിലെ ‘-യും’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וִילָדֶיהָ
  choice: അവളുടെ മക്കൾ
  rationale: יְלָדִים എന്ന പദം ആൺമക്കൾക്കു മാത്രമായി പരിമിതമല്ല; അതിനാൽ പൊതുവായ ‘മക്കൾ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: וַיִּשְׁתַּחֲוּ
  choice: കുമ്പിട്ടു
  rationale: ഇവിടെ שׁחה ആദരസൂചകമായി ശരീരം താഴ്ത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കുമ്പിട്ടു’ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, ഗൗരവമുള്ള പ്രയോഗമാണ്; ശരീരഭാവം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: וְאַחַר
  choice: അതിനുശേഷം
  rationale: സംഘങ്ങൾ ഏശാവിന്റെ മുമ്പിലേക്കു വന്ന ക്രമത്തിലെ തുടർന്നുള്ള ഘട്ടം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: יוֹסֵף וְרָחֵל
  choice: യോസേഫും റാഹേലും
  rationale: എബ്രായ മൂലത്തിലെ പേരുകളുടെ ക്രമം അതേപടി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യക്രമം മലയാളത്തിൽ കൃത്രിമമാകാത്ത വിധം പുനഃക്രമീകരിച്ചെങ്കിലും, യോസേഫ്–റാഹേൽ എന്ന മൂലക്രമവും സംഭവപരമ്പരയും നിലനിർത്തി.
