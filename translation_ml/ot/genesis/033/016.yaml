source:
  edition: WLC
  text: וַ/יָּשָׁב֩ בַּ/יּ֨וֹם הַ/ה֥וּא עֵשָׂ֛ו לְ/דַרְכּ֖/וֹ שֵׂעִֽירָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/016.yaml
  text: So Esau returned that day on his way to Seir[a].
translation:
  language: ml
  text: അങ്ങനെ ഏശാവ് അന്നുതന്നെ തന്റെ വഴിക്ക് സേയീരിലേക്കു മടങ്ങിപ്പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: മടങ്ങിപ്പോയി
  rationale: שׁוּב എന്ന ക്രിയ ഇവിടെ പൂർത്തിയായ ഭൂതകാല സംഭവത്തെ സൂചിപ്പിക്കുന്നു. യാത്രാസന്ദർഭത്തിൽ ‘മടങ്ങിപ്പോയി’ എന്നത് സ്വാഭാവികവും ദിശാബോധം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നുതന്നെ
  rationale: അക്ഷരാർഥം ‘ആ ദിവസം’ എന്നാണ്. ആ ദിവസത്തേക്കുള്ള വ്യക്തമായ കാലസൂചന ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘അന്നുതന്നെ’ ഉപയോഗിച്ചു.
- source_word: עֵשָׂו
  choice: ഏശാവ്
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: לְדַרְכּוֹ
  choice: വഴിയിലൂടെ
  rationale: അക്ഷരാർഥത്തിൽ ‘തന്റെ വഴിയിലേക്ക്/വഴിക്ക്’ എന്ന ആശയമാണ്. യാത്ര തുടർന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാനും דֶּרֶךְ എന്ന പദത്തിന്റെ അർഥം നിലനിർത്താനും ‘വഴിയിലൂടെ’ എന്നു നൽകി.
- source_word: שֵׂעִירָה
  choice: സേയീരിലേക്ക്
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന directional he സേയീരിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു; അത് മലയാളത്തിലെ ‘-ലേക്ക്’ എന്ന ദിശാവിഭക്തിയാൽ വ്യക്തമാക്കി.
theological_decisions: []
translation_notes:
  register: ലളിതവും മാന്യവുമായ ആധുനിക നിലവാരമലയാളം. ഹീബ്രു വാക്യത്തിലെ കാലസൂചനയും യാത്രയുടെ ദിശയും ‘വഴി’ എന്ന ആശയവും സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നിലനിർത്തി.
