translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ ആവർത്തനസ്വഭാവമുള്ള ‘പുറപ്പെട്ട് പോകാം’ എന്ന ഘടന അർഥത്തിന്റെ ഇരട്ട ചലനഭാവം നിലനിർത്താൻ സൂക്ഷിച്ചു. ഈ കരടിൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല; לְנֶגְדֶּךָയിലെ അർഥവ്യാപ്തി വിവർത്തനത്തിൽ ‘മുമ്പിൽ’ എന്നു തുറന്ന നിലയിൽ നൽകിയിരിക്കുന്നു.
