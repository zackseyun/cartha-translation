  text: וַ/יֹּ֖אמֶר נִסְעָ֣ה וְ/נֵלֵ֑כָה וְ/אֵלְכָ֖ה לְ/נֶגְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/012.yaml
  text: Then he said[a], “Let us set out and go, and I will go before you.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ പറഞ്ഞു: “നമുക്ക് പുറപ്പെട്ട് പോകാം, ഞാൻ നിന്റെ മുമ്പിൽ[a] പോകാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നിനക്കു മുന്നിലായി” അല്ലെങ്കിൽ “നിനക്കൊപ്പമായി.”
    reason: לְנֶגְדֶּךָ എന്ന പദത്തിന്റെ സന്ദർഭാനുസൃതമായ സ്ഥലബന്ധ അർഥവ്യാപ്തി സൂചിപ്പിക്കാൻ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ അവൻ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ അതിന്റെ ക്രമാനുസൃത ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: נִסְעָה
  choice: നമുക്ക് പുറപ്പെടാം
  rationale: נסע എന്ന ധാതുവിന്റെ ഒന്നാംപുരുഷ ബഹുവചന പ്രേരണാർഥരൂപം ഇവിടെ ഒരുമിച്ച് യാത്ര തുടങ്ങാനുള്ള നിർദേശം സൂചിപ്പിക്കുന്നു.
- source_word: וְנֵלֵכָה
  choice: പോകാം
  rationale: הלך ഇവിടെ നടക്കുക എന്നതിലുപരി യാത്ര തുടരുക/പോകുക എന്ന അർഥത്തിലാണ്; മുൻ പ്രേരണാർഥത്തോടുള്ള ലളിതമായ ഏകോപനം നിലനിർത്തുന്നു.
- source_word: וְאֵלְכָה
  choice: ഞാൻ ... പോകാം
  rationale: ഒന്നാംപുരുഷ ഏകവചനരൂപം ഏശാവിന്റെ സന്നദ്ധതയുള്ള വാഗ്ദാനമായി വായിക്കാം; മലയാളത്തിലെ ‘പോകാം’ ആ സന്നദ്ധഭാവവും സന്ദർഭത്തിലെ ഭാവിക്രിയയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְנֶגְדֶּךָ
  choice: നിന്റെ മുമ്പിൽ
  rationale: נגד എന്ന പദത്തിന് മുന്നിൽ, അഭിമുഖമായി, സമീപമായി എന്നിങ്ങനെ അർഥവ്യാപ്തിയുണ്ട്. യാത്രാസന്ദർഭത്തിൽ ‘നിന്റെ മുമ്പിൽ’ എന്നത് നേരിട്ടുള്ള സ്ഥലബന്ധം നിലനിർത്തുകയും ഏശാവ് മുന്നിൽ പോകുമെന്ന സാധ്യത തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
