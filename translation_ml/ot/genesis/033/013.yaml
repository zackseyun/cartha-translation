translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ ആഖ്യാനശൈലി. ആവർത്തിച്ചുള്ള സർവനാമങ്ങൾ മൂലപാഠത്തിന് അനുസരിച്ച് നിലനിർത്തിയിട്ടുണ്ട്; സന്ദർഭത്തിലെ വ്യക്തികളുടെ പേരുകൾ പാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
