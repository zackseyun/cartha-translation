  yaml_path: translation/ot/genesis/033/013.yaml
  text: But he said to him[a], “My lord knows that the children are frail, and the flocks and herds nursing their young are under my care. If they are driven hard for one day, all the flock will die.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവനോടു പറഞ്ഞു: “കുട്ടികൾ ദുർബലരാണെന്നും മുലകുടിക്കുന്ന കുഞ്ഞുങ്ങളുള്ള ആടുകളും കന്നുകാലികളും എന്റെ ചുമതലയിലാണെന്നും[a] എന്റെ യജമാനന് അറിയാമല്ലോ. അവയെ ഒരു ദിവസം കഠിനമായി ഓടിച്ചാൽ ആട്ടിൻകൂട്ടമെല്ലാം ചത്തുപോകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മുലകുടിക്കുന്ന കുഞ്ഞുങ്ങളുള്ള ആടുമാടുകളുടെ ഉത്തരവാദിത്വം എനിക്കാണ്.” മൃഗങ്ങൾക്ക് മുലകുടിക്കുന്ന കുഞ്ഞുങ്ങളുണ്ടെന്ന ആശയവും അവയുടെ പരിപാലനഭാരം യാക്കോബിന്മേലാണെന്ന ആശയവും ഈ എബ്രായ ശൈലീപ്രയോഗത്തിൽ ചേർന്നിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനൻ
  rationale: ഏശാവിനോടുള്ള ആദരപൂർവമായ മാനുഷിക സംബോധനമാണ്; ദൈവിക നാമമോ സ്ഥാനപ്പേരോ അല്ല. ‘എന്റെ യജമാനൻ’ വിനയവും സാമൂഹികബന്ധവും നിലനിർത്തുന്നു.
- source_word: הַיְלָדִים רַכִּים
  choice: കുട്ടികൾ ദുർബലരാണ്
  rationale: רַכִּים സൂചിപ്പിക്കുന്ന മൃദുത്വവും യാത്രയിലെ ശാരീരിക നിസ്സഹായതയും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: ആടുകളും കന്നുകാലികളും
  rationale: ചെറിയ വളർത്തുമൃഗങ്ങളെയും വലിയ കന്നുകാലികളെയും സൂചിപ്പിക്കുന്ന രണ്ട് കൂട്ടനാമങ്ങൾ സ്വാഭാവികമായ മലയാളത്തിൽ വേർതിരിച്ചു നൽകുന്നു.
- source_word: עָלוֹת עָלָי
  choice: മുലയൂട്ടുന്ന ... എന്റെ ചുമതലയിലാണ്
  rationale: മുലയൂട്ടുന്ന മൃഗങ്ങളുടെ അവസ്ഥയും അവയുടെ പരിപാലനഭാരം യാക്കോബിന്മേലാണെന്ന ആശയവും ചേർന്നിരിക്കുന്ന ദുഷ്കരമായ എബ്രായ പ്രയോഗത്തിന്റെ രണ്ട് വശങ്ങളും പ്രകടമാക്കുന്നു.
- source_word: וּדְפָקוּם
  choice: അവയെ ... കഠിനമായി ഓടിച്ചാൽ
  rationale: മൃഗങ്ങളെ അതിരുകടന്ന് തിടുക്കത്തിൽ നടത്തുക എന്ന സന്ദർഭാർഥം നൽകുന്നു; എബ്രായത്തിലെ അനിശ്ചിത കർത്താവിനെ വ്യവസ്ഥാരൂപത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וָמֵתוּ כָּל־הַצֹּאן
  choice: ആട്ടിൻപറ്റമെല്ലാം ചത്തുപോകും
  rationale: കൂട്ടനാമമായ הַצֹּאן-ന്റെ രൂപവും ഫലത്തിന്റെ സമ്പൂർണതയും നിലനിർത്തുന്നു.
