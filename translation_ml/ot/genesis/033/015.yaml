id: GEN.33.15
reference: Genesis 33:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר עֵשָׂ֔ו אַצִּֽיגָה נָּ֣א עִמְּ/ךָ֔ מִן הָ/עָ֖ם אֲשֶׁ֣ר אִתִּ֑/י וַ/יֹּ֨אמֶר֙ לָ֣/מָּה זֶּ֔ה אֶמְצָא חֵ֖ן בְּ/עֵינֵ֥י אֲדֹנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/015.yaml
  text: Then Esau said, “Please let me leave with you some of the people who are with me.” But he said, “Why is this? Let me find favor in the eyes of my lord.”
translation:
  language: ml
  text: 'അപ്പോൾ ഏശാവ് പറഞ്ഞു: “എന്നോടുകൂടെ ഉള്ളവരിൽ ചിലരെ നിനക്കൊപ്പം നിർത്താൻ എന്നെ അനുവദിക്കണമേ.” എന്നാൽ അവൻ പറഞ്ഞു: “അതെന്തിന്? എന്റെ യജമാനന്റെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിക്കട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַצִּיגָה נָּא
  choice: നിർത്താൻ എന്നെ അനുവദിക്കണമേ
  rationale: הציג എന്ന ക്രിയയുടെ ‘നിയോഗിക്കുക/അവിടെ നിർത്തുക’ എന്ന ആശയവും נָאയുടെ വിനീത അഭ്യർഥനാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: מִן הָעָם אֲשֶׁר אִתִּי
  choice: എന്നോടുകൂടെയുള്ള ആളുകളിൽ ചിലരെ
  rationale: מִן ഇവിടെ കൂട്ടത്തിൽനിന്നുള്ള അനിശ്ചിതമായ ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘ചിലരെ’ എന്നു നൽകുന്നത് ആ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: לָמָּה זֶּה
  choice: അതെന്തിന്?
  rationale: അക്ഷരാർഥത്തിലെ ചോദ്യം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; ഏശാവിന്റെ നിർദേശം വിനീതമായി നിരസിക്കുന്ന സന്ദർഭത്തിനും യോജിക്കുന്നു.
- source_word: אֶמְצָא חֵן בְּעֵינֵי אֲדֹנִי
  choice: എന്റെ യജമാനന്റെ ദൃഷ്ടിയിൽ എനിക്കു കൃപ ലഭിച്ചാൽ മതി
  rationale: ‘കൃപ കണ്ടെത്തുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം ദ dignified Malayalam-ൽ നൽകുന്നു; വാക്യസന്ദർഭത്തിൽ അന്തർലീനമായ ‘അത് മതി’ എന്ന വിനീതമായ നിരസനഭാവം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אֲדֹנִי എന്ന ആദരസംബോധന
  choice: എന്റെ യജമാനൻ
  alternative: എന്റെ പ്രഭു
  rationale: ഇവിടെ യാക്കോബ് ഏശാവിനെ മനുഷ്യനായ മേലധികാരിയെപ്പോലെ ആദരപൂർവം അഭിസംബോധന ചെയ്യുന്നു; ദൈവിക പദവിയെ സൂചിപ്പിക്കാതെ ബന്ധപരമായ വിനയം നിലനിർത്താൻ ‘യജമാനൻ’ തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സംഭാഷണത്തിലെ വിനയവും യാക്കോബിന്റെ പരോക്ഷ നിരസനവും സംരക്ഷിച്ചിട്ടുണ്ട്.
