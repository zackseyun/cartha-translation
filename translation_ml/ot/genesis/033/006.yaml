  source_fidelity: 'എബ്രായത്തിലെ ക്രമാനുസൃതമായ രണ്ടു പ്രവർത്തനങ്ങളും കൃത്യമായി പ്രതിഫലിക്കുന്നു: ശിഫ്ഹോത്ത് അവരുടെ മക്കളോടുകൂടെ അടുത്തുവന്നു, പിന്നെ അവർ വണങ്ങി. സ്ത്രീലിംഗ ബഹുവചനകർത്താവും കുട്ടികളുടെ ഉൾപ്പെടലും നിലനിൽക്കുന്നു. “കുമ്പിട്ടു” ഇവിടെ הִשְׁתַּחֲוָהയുടെ ആദരസൂചകമായ താഴ്ന്ന വണക്കത്തിന് യോജിച്ച സ്വാഭാവിക വിവർത്തനമാണ്; സാഷ്ടാംഗപ്രണാമം എന്നു അനാവശ്യമായി നിർബന്ധിക്കുന്നില്ല.'
