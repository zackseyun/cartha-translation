  text: Then the female servants and their children came near and bowed down[a][b][c][d].
translation:
  language: ml
  text: പിന്നെ ദാസിമാരും അവരുടെ മക്കളും അടുത്തുവന്ന് കുമ്പിട്ടു.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അടുത്തുചെന്ന്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “ദാസിമാർ” എന്നതിനു “അടിമസ്ത്രീകൾ” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം സ്ത്രീലിംഗത്തിലുള്ള ദാസികളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: “നിലംപറ്റെ വണങ്ങി” എന്നും പരിഭാഷപ്പെടുത്താം; മൂലപദം ആദരസൂചകമായി ശരീരം വളരെ താഴ്ത്തുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשְׁןָ
  choice: അടുത്തുവന്ന്
  rationale: נגשׁ എന്ന ക്രിയയുടെ തുടർച്ചയായ ആഖ്യാനപ്രവർത്തനം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; ഏശാവിന്റെ അടുത്തേക്കുള്ള നീക്കവും നിലനിർത്തുന്നു.
- source_word: הַשְּׁפָחוֹת
  choice: ദാസിമാർ
  rationale: שִׁפְחָה സ്ത്രീലിംഗത്തിലുള്ള ദാസിയെ സൂചിപ്പിക്കുന്നു. ‘ദാസിമാർ’ ആ ലിംഗസൂചന സംക്ഷിപ്തമായും ആധുനിക വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിലും നൽകുന്നു; അടിമത്തത്തിന്റെ കൃത്യമായ സാമൂഹിക സ്ഥാനം വാക്യം നിർണയിക്കുന്നതിലധികം വ്യക്തമാക്കുന്നില്ല.
- source_word: הֵנָּה וְיַלְדֵיהֶן
  choice: ദാസിമാരും അവരുടെ മക്കളും
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ ഉൾക്കൊള്ളുന്ന ‘ദാസിമാർ—അവരും അവരുടെ മക്കളും’ എന്ന എബ്രായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തകർത്താവായി അവതരിപ്പിക്കുന്നു.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: കുമ്പിട്ടു
  rationale: שׁחה/השתחוה സൂചിപ്പിക്കുന്ന ആദരപൂർവമായ താഴ്ന്ന വണക്കം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പൂർണമായി സാഷ്ടാംഗം വീണുവെന്ന് നിർബന്ധമായി വ്യക്തമാക്കുന്നില്ല.
