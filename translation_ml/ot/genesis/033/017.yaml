translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥലനാമം ലിപ്യന്തരിച്ചു; ഹീബ്രുവിലെ പേരിടൽ-പദപ്രയോഗം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി.
