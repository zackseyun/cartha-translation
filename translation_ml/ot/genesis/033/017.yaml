id: GEN.33.17
reference: Genesis 33:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יַעֲקֹב֙ נָסַ֣ע סֻכֹּ֔תָ/ה וַ/יִּ֥בֶן ל֖/וֹ בָּ֑יִת וּ/לְ/מִקְנֵ֨/הוּ֙ עָשָׂ֣ה סֻכֹּ֔ת עַל כֵּ֛ן קָרָ֥א שֵׁם הַ/מָּק֖וֹם סֻכּֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/017.yaml
  text: And Jacob traveled to Succoth[a], and he built a house for himself and made shelters for his livestock. Therefore he called the name of the place Succoth.
translation:
  language: ml
  text: യാക്കോബ് സുക്കോത്തിലേക്കു[a] യാത്രചെയ്തു. അവൻ തനിക്കായി ഒരു വീടു പണിതു; തന്റെ കന്നുകാലികൾക്കായി കുടിലുകളും ഉണ്ടാക്കി. അതുകൊണ്ട് അവൻ ആ സ്ഥലത്തിനു സുക്കോത്ത് എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സുക്കോത്ത്” എന്ന പേര് “കുടിലുകൾ” അഥവാ “താൽക്കാലിക പാർപ്പിടങ്ങൾ” എന്നർഥമുള്ള ഹീബ്രുപദവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסַע
  choice: യാത്രചെയ്തു
  rationale: ഒരിടത്തുനിന്ന് മറ്റൊരിടത്തേക്കു പുറപ്പെട്ടു നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയാണ്; ആഖ്യാനസന്ദർഭത്തിൽ സ്വാഭാവികമായ ആധുനിക മലയാളം.
- source_word: סֻכֹּתָה
  choice: സുക്കോത്തിലേക്കു
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ -ה അവിടേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; പേരിനെ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: וַיִּבֶן לוֹ בָּיִת
  choice: അവൻ തനിക്കായി ഒരു വീടു പണിതു
  rationale: לוֹ എന്ന പ്രയോജനാർഥക ഘടകം വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: מִקְנֵהוּ
  choice: തന്റെ കന്നുകാലികൾ
  rationale: സന്ദർഭത്തിൽ വളർത്തുമൃഗങ്ങളെയും ആട്ടിൻപറ്റം, മാടുകൾ തുടങ്ങിയ സമ്പത്തിനെയും പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘കന്നുകാലികൾ’ സാധാരണ വായനക്കാർക്കു ഗ്രാഹ്യമായ വിശാലപദമാണ്.
- source_word: עָשָׂה סֻכֹּת
  choice: കുടിലുകളും ഉണ്ടാക്കി
  rationale: סֻכּוֹת ഇവിടെ മൃഗങ്ങൾക്കായി ഉണ്ടാക്കിയ ലളിതമായ താൽക്കാലിക ആവാസങ്ങളാണ്; ‘കുടിലുകൾ’ സ്ഥലനാമത്തോടുള്ള പദബന്ധം അടിക്കുറിപ്പിലൂടെ വിശദീകരിക്കാൻ അനുയോജ്യമാണ്.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: സ്ഥലനാമം ലഭിച്ചതിന്റെ കാരണത്തെ പരിചയപ്പെടുത്തുന്ന സൂത്രവാക്യം മലയാളത്തിൽ നേരായ കാരണബന്ധത്തോടെ നൽകുന്നു.
- source_word: קָרָא שֵׁם הַמָּקוֹם
  choice: ആ സ്ഥലത്തിനു ... എന്നു പേരിട്ടു
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും dignified ആയ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥത്തിലുള്ള ‘പേര് വിളിച്ചു’ എന്ന അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- source_word: סֻכּוֹת
  choice: സുക്കോത്ത്
  rationale: സ്ഥലനാമം ലിപ്യന്തരിച്ചു; ‘കുടിലുകൾ’ എന്ന പൊതുനാമവുമായുള്ള ഹീബ്രു പദബന്ധം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
