id: GEN.33.11
reference: Genesis 33:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: קַח נָ֤א אֶת בִּרְכָתִ/י֙ אֲשֶׁ֣ר הֻבָ֣את לָ֔/ךְ כִּֽי חַנַּ֥/נִי אֱלֹהִ֖ים וְ/כִ֣י יֶשׁ לִ/י כֹ֑ל וַ/יִּפְצַר בּ֖/וֹ וַ/יִּקָּֽח־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/011.yaml
  text: Please take my gift that has been brought to you, because God has dealt graciously with me, and because I have everything. And he urged him, and he took it.
translation:
  language: ml
  text: നിനക്കായി കൊണ്ടുവന്നിരിക്കുന്ന എന്റെ സമ്മാനം[a] ദയവായി സ്വീകരിക്കണമേ. കാരണം ദൈവം എന്നോടു കൃപ കാണിച്ചിരിക്കുന്നു; എനിക്ക് എല്ലാം ഉണ്ട്.” ഇങ്ങനെ യാക്കോബ് ഏശാവിനോട് നിർബന്ധിച്ചപ്പോൾ, അവൻ അതു സ്വീകരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘എന്റെ അനുഗ്രഹം.’ ഇവിടെ ഏശാവിന് നൽകുന്ന സമ്മാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: ബִּרְכָתִי എന്ന പദത്തിന്റെ സാധാരണ അർഥവും ഈ സന്ദർഭത്തിലെ ‘സമ്മാനം’ എന്ന അർഥവും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: בִּרְכָתִי
  choice: എന്റെ സമ്മാനം
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘എന്റെ അനുഗ്രഹം’ എന്നാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ യാക്കോബ് ഏശാവിനു നൽകുന്ന കന്നുകാലിസമ്മാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘എന്റെ സമ്മാനം’ എന്നു നൽകി.
- source_word: חַנַּנִי
  choice: എന്നോടു കൃപ കാണിച്ചിരിക്കുന്നു
  rationale: חנן എന്ന ധാതുവിലെ കൃപാപൂർവമായ അനുഗ്രഹത്തിന്റെ ആശയം നിലനിർത്തുന്ന നേരിട്ടുള്ള പ്രയോഗം.
- source_word: יֶשׁ לִי כֹל
  choice: എനിക്ക് വേണ്ടതെല്ലാം ഉണ്ട്
  rationale: അക്ഷരാർഥത്തിൽ ‘എനിക്ക് എല്ലാം ഉണ്ട്’; സന്ദർഭത്തിൽ തനിക്കു സമൃദ്ധിയായി ഉണ്ടെന്നും സമ്മാനം തിരികെ വേണ്ടെന്നും പറയുന്നതാണ്. ‘വേണ്ടതെല്ലാം’ മലയാളത്തിൽ അതേ ഉദ്ദേശ്യം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּפְצַר בּוֹ
  choice: യാക്കോബ് ഏശാവിനെ നിർബന്ധിച്ചപ്പോൾ
  rationale: സർവനാമങ്ങൾ മാത്രം ഉപയോഗിച്ചാൽ മലയാളത്തിൽ ആരാണ് ആരെ നിർബന്ധിച്ചതെന്നു മങ്ങാം; മുൻസന്ദർഭം അടിസ്ഥാനമാക്കി പേരുകൾ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: וַיִּקָּח
  choice: അവൻ അതു സ്വീകരിച്ചു
  rationale: സന്ദർഭത്തിൽ ഏശാവ് സമ്മാനം സ്വീകരിച്ചതാണ്; മലയാളത്തിൽ ആവശ്യമായ കർമസൂചന ചേർത്തു.
theological_decisions:
- issue: בִּרְכָתִי എന്ന പദത്തിലെ ‘അനുഗ്രഹം/സമ്മാനം’ ദ്വയാർഥസാധ്യത
  choice: പ്രധാനപാഠത്തിൽ ‘എന്റെ സമ്മാനം’
  alternative: ‘എന്റെ അനുഗ്രഹം’
  rationale: ഉടൻമുമ്പുള്ള വാക്യങ്ങളിൽ പറയുന്ന കന്നുകാലിക്കൂട്ടമാണ് ഇവിടെ ഉദ്ദേശിക്കപ്പെടുന്നത്. എങ്കിലും ‘അനുഗ്രഹം’ എന്ന പദത്തിന്റെ കഥാപരമായ പ്രതിധ്വനി ഉറവിടഭാഷയിൽ ഉണ്ടാകാം; പ്രധാനപാഠത്തിൽ അസ്വാഭാവികത ഒഴിവാക്കി സന്ദർഭാർഥം തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. അഭ്യർഥനയ്ക്ക് ‘ദയവായി സ്വീകരിക്കണമേ’ എന്നും ദൈവകൃപയ്ക്ക് ‘കൃപ കാണിച്ചിരിക്കുന്നു’ എന്നും ഉപയോഗിച്ചു. ഉദ്ധരണിയുടെ ആരംഭം മുൻവാക്യത്തിൽ നിന്നുള്ള പ്രസംഗതുടർച്ചയായതിനാൽ ഇവിടെ അവസാന ഉദ്ധരണിച്ചിഹ്നം മാത്രം നൽകിയിരിക്കുന്നു.
