    rationale: After «അബീമേലെക്കിനെയും അവന്റെ ഭാര്യയെയും അവന്റെ ദാസിമാരെയും», the plural «അവർ» may formally include Abimelech. The Hebrew feminine plural verb identifies the wife and female servants as those who gave birth. Malayalam should make that reference explicit without adding a causal conjunction.
