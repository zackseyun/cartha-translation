  text: וַ/יִּתְפַּלֵּ֥ל אַבְרָהָ֖ם אֶל הָ/אֱלֹהִ֑ים וַ/יִּרְפָּ֨א אֱלֹהִ֜ים אֶת אֲבִימֶ֧לֶךְ וְ/אֶת אִשְׁתּ֛/וֹ וְ/אַמְהֹתָ֖י/ו וַ/יֵּלֵֽדוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/017.yaml
  text: Then Abraham prayed to God[a], and God healed Abimelech, his wife, and his female servants[b], and they gave birth.
translation:
  language: ml
  text: അപ്പോൾ അബ്രാഹാം ദൈവത്തോടു പ്രാർഥിച്ചു. ദൈവം അബീമേലെക്കിനെയും അവന്റെ ഭാര്യയെയും അവന്റെ ദാസിമാരെയും[a] സൗഖ്യമാക്കി; അവന്റെ ഭാര്യയും ദാസിമാരും പ്രസവിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അടിമസ്ത്രീകളെയും’; ഹീബ്രു പദം സ്ത്രീസേവകരെയോ അടിമസ്ത്രീകളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവർ പ്രസവിച്ചു.’ അടുത്ത വാക്യത്തിന്റെ വെളിച്ചത്തിൽ ഇത് ദൈവം സൗഖ്യമാക്കിയതിന്റെ ഫലമാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
    reason: contextual_relation
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: പ്രാർഥിച്ചു
  rationale: פלל എന്ന ധാതുവിന്റെ ഹിത്പാഏൽ രൂപം ഇവിടെ സാധാരണയായി ‘പ്രാർഥിക്കുക’ എന്നാണ്. സന്ദർഭത്തിൽ മധ്യസ്ഥപ്രാർഥന ഉൾക്കൊള്ളുന്നുവെങ്കിലും അത് മുഖ്യപാഠത്തിൽ പ്രത്യേകം വ്യക്തമാക്കുന്നില്ല.
- source_word: אֶל הָאֱלֹהִים
  choice: ദൈവത്തോടു
  rationale: ദൈവത്തെ അഭിമുഖീകരിച്ചുള്ള പ്രാർഥനയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּרְפָּא
  choice: സൗഖ്യമാക്കി
  rationale: רפא എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘സൗഖ്യമാക്കുക’ എന്നതാണ്; രോഗാവസ്ഥയുടെ സ്വഭാവം അനാവശ്യമായി നിർവചിക്കാതെ ദൈവത്തിന്റെ പ്രവൃത്തി വ്യക്തമാക്കുന്നു.
- source_word: אֶת אֲבִימֶלֶךְ
  choice: അബീമേലെക്കിനെ
  rationale: വ്യക്തിനാമത്തിന്റെ അംഗീകൃത മലയാള ലിപ്യന്തരണവും നേരിട്ടുള്ള കർമരൂപവും ഉപയോഗിച്ചു.
- source_word: אִשְׁתּוֹ
  choice: അവന്റെ ഭാര്യയെ
  rationale: അബീമേലെക്കിന്റെ ഭാര്യയെ സൂചിപ്പിക്കുന്ന ലളിതമായ ഉടമസ്ഥ നാമപദപ്രയോഗം.
- source_word: אַמְהֹתָיו
  choice: അവന്റെ ദാസിമാരെ
  rationale: אָמָה സ്ത്രീലിംഗ സേവകയെയോ അടിമസ്ത്രീയെയോ സൂചിപ്പിക്കാം. ‘ദാസിമാർ’ ചുരുക്കവും സ്വാഭാവികവും ആണെങ്കിലും സാമൂഹിക പദവിയിലെ ശക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיֵּלֵדוּ
  choice: അവർ പ്രസവിച്ചു
  rationale: ילד എന്ന ക്രിയയുടെ വ്യക്തമായ അർഥം ‘പ്രസവിക്കുക’ എന്നാണ്. ഹീബ്രുവിലെ സംയോജകത്തിന്റെ ക്രമബന്ധം നിലനിർത്തി ഫലബന്ധം മുഖ്യപാഠത്തിൽ അധികമായി വ്യക്തമാക്കിയിട്ടില്ല.
theological_decisions:
- issue: അവസാന ക്രിയയും സൗഖ്യമാക്കലും തമ്മിലുള്ള ബന്ധം
  choice: ‘അവർ പ്രസവിച്ചു’ എന്ന ക്രമാനുസൃത രൂപം നിലനിർത്തി.
  alternative: ‘അതുകൊണ്ട് അവർ പ്രസവിച്ചു’ അല്ലെങ്കിൽ ‘അങ്ങനെ അവർക്ക് പ്രസവിക്കാൻ കഴിഞ്ഞു.’
  rationale: സന്ദർഭത്തിൽ പ്രസവം ദൈവം സൗഖ്യമാക്കിയതിന്റെ ഫലമാണെങ്കിലും ഹീബ്രു വാചകം അതിനെ വ്യാകരണപരമായി വ്യക്തമായ ഫലവാക്യമായി അടയാളപ്പെടുത്തുന്നില്ല. അതിനാൽ യഥാർഥമായ തുറന്ന നില മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു; സന്ദർഭബന്ധം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- issue: אָמָה എന്ന പദത്തിലെ സാമൂഹിക പദവിയുടെ സൂക്ഷ്മത
  choice: മുഖ്യപാഠത്തിൽ ‘ദാസിമാർ’ ഉപയോഗിച്ചു.
  alternative: ‘അടിമസ്ത്രീകൾ’ അല്ലെങ്കിൽ ‘സ്ത്രീസേവകർ.’
  rationale: ഈ പദം സേവികയെയും അടിമസ്ത്രീയെയും സൂചിപ്പിക്കാം. മലയാളത്തിലെ ‘ദാസിമാർ’ വായനാസൗകര്യത്തോടൊപ്പം ഈ അർഥപരിധി ഭാഗികമായി നിലനിർത്തുന്നു; കൂടുതൽ ശക്തമായ സാമൂഹിക സൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രു വാക്യത്തിന്റെ ലളിതമായ ആഖ്യാനക്രമം സൂക്ഷിച്ചു; സാമൂഹിക പദവിയിലെയും കാരണം-ഫലബന്ധത്തിലെയും സൂക്ഷ്മതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
