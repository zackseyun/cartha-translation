reference: Genesis 20:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלָ֨י/ו הָֽ/אֱלֹהִ֜ים בַּ/חֲלֹ֗ם גַּ֣ם אָנֹכִ֤י יָדַ֨עְתִּי֙ כִּ֤י בְ/תָם לְבָבְ/ךָ֙ עָשִׂ֣יתָ זֹּ֔את וָ/אֶחְשֹׂ֧ךְ גַּם אָנֹכִ֛י אֽוֹתְ/ךָ֖ מֵ/חֲטוֹ לִ֑/י עַל כֵּ֥ן לֹא נְתַתִּ֖י/ךָ לִ/נְגֹּ֥עַ אֵלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/006.yaml
  text: Then God said to him in the dream[a], “Yes, I know that you did this in the integrity of your heart, and I also kept you from sinning against me[b]. Therefore I did not let you touch her.”
translation:
  language: ml
  text: 'അപ്പോൾ ദൈവം ആ സ്വപ്നത്തിൽ[a] അവനോടു പറഞ്ഞു: “നിന്റെ ഹൃദയത്തിന്റെ പരമാർഥതയോടെയാണ് നീ ഇതു ചെയ്തതെന്ന് ഞാനും അറിയാം. എനിക്കെതിരായി പാപം ചെയ്യുന്നതിൽനിന്ന് ഞാനും നിന്നെ തടഞ്ഞു. അതുകൊണ്ടാണ് അവളെ തൊടാൻ[b] ഞാൻ നിന്നെ അനുവദിക്കാതിരുന്നത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഒരു സ്വപ്നത്തിൽ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ നിർദിഷ്ടരൂപം ഇവിടെ നടന്നുകൊണ്ടിരിക്കുന്ന പ്രത്യേക സ്വപ്നത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “തൊടുക” എന്നത് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന സംയമിതമായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלֹם
  choice: സ്വപ്നത്തിൽ
  rationale: നിലവിലെ പ്രത്യേക സ്വപ്നത്തെയാണ് നിർദിഷ്ട ആർട്ടിക്കിൾ സൂചിപ്പിക്കുന്നത്; എന്നാൽ മലയാളത്തിൽ ‘ആ സ്വപ്നത്തിൽ’ എന്നു ചേർക്കാതെ ‘സ്വപ്നത്തിൽ’ എന്നതുതന്നെ സന്ദർഭത്തിൽ സ്വാഭാവികവും നിർദിഷ്ടവുമാണ്.
- source_word: גַּם אָנֹכִי יָדַעְתִּי
  choice: എനിക്കും അറിയാം
  rationale: גַּם אָנֹכִי നൽകുന്ന ഊന്നലും ആവർത്തനഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; יָדַעְתִּי നേരിട്ടുള്ള ദൈവവചനത്തിൽ ഇപ്പോഴത്തെ അംഗീകാരമായി ‘അറിയാം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בְתָם לְבָבְךָ
  choice: നിന്റെ ഹൃദയപരമാർഥതയോടെ
  rationale: תֹּם എന്നത് സമഗ്രത, നേര്, പരമാർഥത എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. ‘ഹൃദയപരമാർഥത’ വ്യക്തിയുടെ ഉദ്ദേശ്യത്തിലെ സത്യസന്ധത വ്യക്തമാക്കുന്നു; പൂർണമായ നിയമനിരപരാധിത്വം അനാവശ്യമായി അവകാശപ്പെടുന്നില്ല.
- source_word: וָאֶחְשֹׂךְ ... אוֹתְךָ
  choice: നിന്നെ തടഞ്ഞതും ഞാനാണ്
  rationale: חָשַׂךְ ഇവിടെ ഒരു പ്രവൃത്തിയിൽനിന്ന് പിടിച്ചുനിർത്തുക അഥവാ തടയുക എന്നതാണ്. ദൈവിക പ്രതിരോധം വ്യക്തമായി പ്രകടമാക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: מֵחֲטוֹ לִי
  choice: എനിക്കെതിരായി പാപം ചെയ്യുന്നതിൽനിന്ന്
  rationale: מן പ്രവൃത്തിയിൽനിന്നുള്ള തടയലിനെ സൂചിപ്പിക്കുന്നു; לִי ഇവിടെ പാപം ദൈവത്തിനെതിരായതാണെന്ന ധാർമിക ബന്ധം പ്രകടമാക്കുന്നു.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ടാണ്
  rationale: മുൻപറഞ്ഞ ദൈവിക തടയലും തുടർന്ന് അവളെ തൊടാൻ അനുവദിക്കാതിരുന്നതും തമ്മിലുള്ള ഫലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לֹא נְתַתִּיךָ לִנְגֹּעַ אֵלֶיהָ
  choice: അവളെ തൊടാൻ ഞാൻ നിന്നെ അനുവദിക്കാതിരുന്നത്
  rationale: נָתַן + infinitive ഇവിടെ ‘അനുവദിക്കുക’ എന്ന വ്യവഹാരാർഥത്തിലാണ്. נגעയുടെ സംയമിതമായ ‘തൊടുക’ എന്ന പ്രയോഗം മൂലപാഠത്തിലെ മിതഭാഷ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘എനിക്കെതിരായി പാപം ചെയ്യുക’ എന്ന ദൈവവചനത്തിന്റെ അർഥം
  choice: ആലോചിക്കപ്പെട്ട പ്രവൃത്തി ദൈവത്തിനെതിരായ പാപമായി നേരിട്ട് നിലനിർത്തി.
  alternative: ‘എന്നെ വ്രണപ്പെടുത്തുക’ അല്ലെങ്കിൽ ‘എന്റെ മുമ്പിൽ കുറ്റക്കാരനാകുക’ എന്നു പൊതുവാക്കുക.
  rationale: לִי ദൈവത്തെ ഈ പാപത്തിന്റെ ധാർമിക ലക്ഷ്യമായി അടയാളപ്പെടുത്തുന്നു. സാറായോടും അബ്രാഹാമിനോടുമുള്ള മാനുഷിക ദോഷത്തെ നിഷേധിക്കാതെ, വാക്യത്തിൽ വ്യക്തമായ ദൈവശാസ്ത്രപരമായ മാനവും പരിഭാഷ നിലനിർത്തുന്നു.
- issue: അബീമേലെക്കിന്റെ ‘ഹൃദയപരമാർഥത’
  choice: അവന്റെ ഉദ്ദേശ്യത്തിലെ പരമാർഥതയെ അംഗീകരിക്കുന്ന ഭാഷ ഉപയോഗിച്ചു.
  alternative: പൂർണ ‘നിരപരാധിത്വം’ അല്ലെങ്കിൽ ‘കുറ്റമില്ലായ്മ’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: תֹּם ഹൃദയത്തിന്റെ നേര് അഥവാ സമഗ്രതയെ സൂചിപ്പിക്കുന്നു; ദൈവം അവനെ തടഞ്ഞുവെന്ന തുടർന്നുള്ള വാക്കുകളോടുള്ള സംഘർഷം ഇല്ലാതാക്കാതെ, നിയമപരമായ പൂർണ നിരപരാധിത്വം അതിൽ ചേർക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘ഹൃദയപരമാർഥത’, ‘എനിക്കെതിരായി പാപം ചെയ്യുക’, ‘തൊടുക’ എന്നിവ മൂലപാഠത്തിന്റെ ധാർമിക ഭാരം, ദൈവശാസ്ത്രപരമായ ബന്ധം, മിതഭാഷ എന്നിവ നിലനിർത്തുന്നു.
