  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി; മൂലപാഠത്തിലെ നേരിട്ടുള്ള ക്ഷണവും സ്ഥലതിരഞ്ഞെടുപ്പിലെ സ്വാതന്ത്ര്യവും നിലനിർത്തി.
