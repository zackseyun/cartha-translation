id: GEN.20.18
reference: Genesis 20:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי עָצֹ֤ר עָצַר֙ יְהוָ֔ה בְּעַ֥ד כָּל רֶ֖חֶם לְ/בֵ֣ית אֲבִימֶ֑לֶךְ עַל דְּבַ֥ר שָׂרָ֖ה אֵ֥שֶׁת אַבְרָהָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/018.yaml
  text: For Yahweh had completely closed every womb in Abimelech’s household because of Sarah[a], Abraham’s wife.
translation:
  language: ml
  text: കാരണം, അബ്രാഹാമിന്റെ ഭാര്യയായ സാറ നിമിത്തം യഹ്‌വെ അബീമേലെക്കിന്റെ വീട്ടാരിലെ എല്ലാ ഗർഭപാത്രങ്ങളും മുഴുവനായും[a] അടച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തീർച്ചയായും അടച്ചിരുന്നു’ അല്ലെങ്കിൽ ‘പൂർണമായി അടച്ചിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; ഊന്നലിനായി എബ്രായത്തിൽ ക്രിയാനാമത്തിന്റെ നിർപേക്ഷരൂപത്തോടൊപ്പം അതേ ധാതുവിൽനിന്നുള്ള സമാപ്തക്രിയയും ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കൊണ്ടാണ്
  rationale: മുൻവാക്യത്തിൽ വിവരിച്ച സൗഖ്യത്തിന്റെയും പ്രസവത്തിന്റെയും വിശദീകരണകാരണം ഈ വാക്യം നൽകുന്നു; മലയാളത്തിൽ വാക്യാന്തത്തിലെ ‘കൊണ്ടാണ്’ ആ ബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: עָצֹר עָצַר
  choice: പൂർണമായി അടച്ചിരുന്നു
  rationale: ക്രിയാനാമത്തിന്റെ നിർപേക്ഷരൂപവും സമാപ്തക്രിയയും ചേർന്ന എബ്രായ പ്രയോഗം പ്രവർത്തനത്തെ ഊന്നിപ്പറയുന്നു. ‘പൂർണമായി’ ആ തീവ്രത നിലനിർത്തുന്നു; മുൻകാലസന്ദർഭം ‘അടച്ചിരുന്നു’ എന്നതിലൂടെ വ്യക്തമാകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: בְּעַד כָּל רֶחֶם לְבֵית אֲבִימֶלֶךְ
  choice: അബീമേലെക്കിന്റെ കുടുംബത്തിലെ എല്ലാ ഗർഭപാത്രങ്ങളും
  rationale: ‘വീട്’ ഇവിടെ കെട്ടിടത്തേക്കാൾ കുടുംബവൃത്തത്തെ സൂചിപ്പിക്കുന്നു. ‘ഗർഭപാത്രങ്ങൾ’ എന്ന മൂർത്തമായ ശരീരചിത്രം അമൂർത്തമായ ‘വന്ധ്യത’യായി മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: עַל דְּבַר שָׂרָה
  choice: സാറ നിമിത്തം
  rationale: വിധിയുടെ കാരണം സൂചിപ്പിക്കുന്ന പ്രയോഗം; ‘നിമിത്തം’ ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ കാരണസൂചകമാണ്.
- source_word: אֵשֶׁת אַבְרָהָם
  choice: അബ്രാഹാമിന്റെ ഭാര്യയായ
  rationale: സാറയുടെ തിരിച്ചറിയലും കഥയിൽ നിർണായകമായ വിവാഹബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ ദൈവനാമം ലിപ്യന്തരം ചെയ്യുന്നു. ‘യഹ്‌വെ’ എന്നത് ആധുനിക പണ്ഡിതലോകത്തിൽ സാധാരണമായി സ്വീകരിക്കുന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ പ്രതിനിധീകരിക്കുന്നു.
- issue: ഗർഭപാത്രങ്ങൾ അടച്ചത് ദൈവിക വിധിയായി അവതരിപ്പിക്കൽ
  choice: യഹ്‌വെ ... പൂർണമായി അടച്ചിരുന്നു
  alternative: അവർ വന്ധ്യരായിരുന്നു
  rationale: മൂലപാഠം പ്രവർത്തനത്തിന്റെ കർത്താവായി യഹ്‌വെയെ വ്യക്തമായി പറയുന്നു. അതിനെ സ്വാഭാവിക അവസ്ഥയായി മയപ്പെടുത്താതെ ദൈവിക പ്രവർത്തനവും അതിന്റെ കഥാപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കുടുംബം’ വീട്ടാരെ സൂചിപ്പിക്കുന്നു; ‘ഗർഭപാത്രങ്ങൾ’ എന്ന മൂലപാഠത്തിലെ ശരീരചിത്രം ഉദ്ദേശപൂർവം നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ഊന്നൽപ്രയോഗം വരുന്ന വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
