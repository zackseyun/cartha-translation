id: GEN.20.11
reference: Genesis 20:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַבְרָהָ֔ם כִּ֣י אָמַ֗רְתִּי רַ֚ק אֵין יִרְאַ֣ת אֱלֹהִ֔ים בַּ/מָּק֖וֹם הַ/זֶּ֑ה וַ/הֲרָג֖וּ/נִי עַל דְּבַ֥ר אִשְׁתִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/011.yaml
  text: And Abraham said[a], “Because I said, ‘Surely there is no fear of God in this place, and they will kill me because of my wife.’”
translation:
  language: ml
  text: 'അബ്രാഹാം പറഞ്ഞു: “കാരണം, ‘ഈ സ്ഥലത്ത് ദൈവഭയം[a] ഒട്ടുമില്ല; എന്റെ ഭാര്യ കാരണം അവർ എന്നെ കൊല്ലും’ എന്നു ഞാൻ പറഞ്ഞു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തോടുള്ള ഭക്ത്യാദരവ്.”
    reason: יִרְאַת എന്ന പദത്തിന് ഭയം മാത്രമല്ല, ഭക്തിയോടുകൂടിയ ആദരവ് എന്ന അർഥവും ഈ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാം.
lexical_decisions:
- source_word: כִּי
  choice: —കൊണ്ടാണ്
  rationale: അബ്രാഹാം തന്റെ മുൻനടപടിക്കു കാരണം വിശദീകരിക്കുന്നതിനാൽ ഹീബ്രുവിലെ കാരണസൂചകമായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി വാക്യാവസാനത്തിലെ ‘—കൊണ്ടാണ്’ എന്ന ഘടനയിൽ നൽകി.
- source_word: אָמַרְתִּי
  choice: ഞാൻ വിചാരിച്ചു
  rationale: അടിസ്ഥാന അർഥം ‘ഞാൻ പറഞ്ഞു’ എന്നാണെങ്കിലും ഇവിടെ അബ്രാഹാമിന്റെ ഉള്ളിലെ നിഗമനമാണ് സൂചിപ്പിക്കുന്നത്. ആ സന്ദർഭാർഥം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘ഞാൻ വിചാരിച്ചു’ എന്നു നൽകി.
- source_word: רַק
  choice: ഒട്ടുമില്ല
  rationale: רַק നൽകുന്ന ഊന്നൽ, നിഷേധവാക്യത്തോടൊപ്പം മലയാളത്തിൽ ‘ഒട്ടുമില്ല’ എന്ന പ്രയോഗം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֵין יִרְאַת אֱלֹהִים
  choice: ദൈവഭയം ഇല്ല
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ മതപരവും ധാർമികവുമായ ഭാരം നിലനിർത്താൻ ‘ദൈവഭയം’ എന്ന ബൈബിൾസംബന്ധിയായ പ്രയോഗം സംരക്ഷിച്ചു.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: ഈ സ്ഥലത്ത്
  rationale: സ്ഥലസൂചക പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: וַהֲרָגוּנִי
  choice: അവർ എന്നെ കൊല്ലും
  rationale: അബ്രാഹാം പ്രതീക്ഷിച്ച ഫലം നേരിട്ടുള്ള ഉദ്ധരണിക്കുള്ളിൽ ഭാവികാലത്തിൽ വ്യക്തമായി നൽകി.
- source_word: עַל דְּבַר אִשְׁתִּי
  choice: എന്റെ ഭാര്യ നിമിത്തം
  rationale: ‘എന്റെ ഭാര്യ കാരണം/നിമിത്തം’ എന്ന ആശയം dignified ആയ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അവളെ സ്വന്തമാക്കാൻ തന്നെ കൊല്ലുമെന്ന സന്ദർഭവും ഇതിൽ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: יִרְאַת אֱלֹהִים എന്നതിന്റെ പരിഭാഷ
  choice: ദൈവഭയം
  alternative: ദൈവത്തോടുള്ള ഭക്ത്യാദരവ്
  rationale: മൂലപദത്തിലെ ‘ഭയം’ എന്ന ആശയവും ദൈവത്തിന്റെ മുമ്പിലുള്ള ധാർമിക ഉത്തരവാദിത്വവും സംരക്ഷിക്കുന്നു. ‘ഭക്ത്യാദരവ്’ സാധ്യമായ വ്യാഖ്യാനമാണെങ്കിലും മുഖ്യപാഠത്തിൽ അത് മാത്രം നൽകിയാൽ മൂലത്തിലെ ശക്തി മയപ്പെടാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ഹീബ്രുവിലെ കാരണബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ നൽകി; ദൈവഭയം എന്ന ബൈബിൾസംബന്ധിയായ പ്രയോഗം നിലനിർത്തി.
