source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם אֲבִימֶ֜לֶךְ בַּ/בֹּ֗קֶר וַ/יִּקְרָא֙ לְ/כָל עֲבָדָ֔י/ו וַ/יְדַבֵּ֛ר אֶת כָּל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בְּ/אָזְנֵי/הֶ֑ם וַ/יִּֽירְא֥וּ הָ/אֲנָשִׁ֖ים מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/008.yaml
  text: So Abimelech rose early in the morning and called all his servants and spoke all these things in their hearing[b][a], and the men were very afraid.
translation:
  language: ml
  text: അബീമേലെക്ക് അതിരാവിലെ എഴുന്നേറ്റ് തന്റെ സകല ദാസന്മാരെയും വിളിച്ചു[a]. ഈ കാര്യങ്ങളെല്ലാം അവർ കേൾക്കെ അവരോടു പറഞ്ഞു. ആ മനുഷ്യർ വളരെ ഭയപ്പെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ സകല ദാസന്മാരെയും വിളിച്ചുകൂട്ടി.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ആ മനുഷ്യർ അത്യന്തം ഭയന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: שׁכם എന്ന ക്രിയയുടെ ‘നേരത്തേ എഴുന്നേൽക്കുക’ എന്ന അർഥവും בַּבֹּקֶר എന്ന സമയസൂചനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ചു നൽകുന്നു.
- source_word: וַיִּקְרָא לְכָל עֲבָדָיו
  choice: തന്റെ സകല ദാസന്മാരെയും വിളിച്ചുകൂട്ടി
  rationale: രാജഗൃഹത്തിലെ സേവകരെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ עֲבָדָיו എന്നതിന് ‘ദാസന്മാർ’ യോജിക്കുന്നു; קרא ל־ എന്നത് ഇവിടെ ഒരുമിച്ചുകൂട്ടാൻ വിളിക്കുക എന്ന ആശയം നൽകുന്നു.
- source_word: וַיְדַבֵּר אֶת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ഈ കാര്യങ്ങളെല്ലാം ... പറഞ്ഞു
  rationale: ഇവിടെ דְּבָרִים സംസാരിച്ച ഉള്ളടക്കത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കാര്യങ്ങൾ’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: בְּאָזְנֵיהֶם
  choice: അവർ കേൾക്കെ അവരോടു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരുടെ ചെവികളിൽ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം, അവർ കേൾക്കുന്നവിധത്തിൽ നേരിട്ട് അറിയിക്കുക എന്നതാണ്; മലയാളത്തിൽ ‘അവർ കേൾക്കെ’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַיִּירְאוּ ... מְאֹד
  choice: വളരെ ഭയപ്പെട്ടു
  rationale: സന്ദർഭത്തിൽ ירא ഭക്ത്യാദരമല്ല, ഭയമാണ്; מְאֹד നൽകുന്ന തീവ്രത ‘വളരെ’ എന്ന പദം വ്യക്തമാക്കുന്നു.
- source_word: הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാർ
  rationale: ഹീബ്രു പദം വ്യക്തമായി പുരുഷലിംഗ ബഹുവചനമാണ്; അതിനാൽ പൊതുവായ ‘ആളുകൾ’ എന്നതിനു പകരം ലിംഗസൂചന നിലനിർത്തുന്നു.
