translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ സംഭവക്രമം നിലനിർത്തിക്കൊണ്ട്, നീണ്ട സംയുക്തവാക്യം വായനാസൗകര്യത്തിനായി മൂന്നു വാക്യങ്ങളാക്കി. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
