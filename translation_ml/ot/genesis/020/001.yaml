id: GEN.20.1
reference: Genesis 20:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּסַּ֨ע מִ/שָּׁ֤ם אַבְרָהָם֙ אַ֣רְצָ/ה הַ/נֶּ֔גֶב וַ/יֵּ֥שֶׁב בֵּין קָדֵ֖שׁ וּ/בֵ֣ין שׁ֑וּר וַ/יָּ֖גָר בִּ/גְרָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/001.yaml
  text: From there Abraham journeyed toward the Negev and settled between Kadesh and Shur[a]; he sojourned in Gerar.
translation:
  language: ml
  text: അവിടെനിന്ന് അബ്രാഹാം നെഗെബിലേക്കു യാത്രതിരിച്ചു. കാദേശിനും ശൂരിനും ഇടയിൽ താമസമാക്കി[a]; ഗെരാറിൽ പരദേശിയായി പാർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തെക്കോട്ട്.’ എബ്രായപദം ‘നെഗെബ്’ എന്നു പേരുള്ള തെക്കൻ പ്രദേശത്തെയോ പൊതുവായി തെക്കോട്ടുള്ള സഞ്ചാരത്തെയോ സൂചിപ്പിക്കാം; മുഖ്യപാഠത്തിൽ കൂടുതൽ സാധ്യതയുള്ള ഭൂമിശാസ്ത്രപരമായ അർഥം നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: യാത്രതിരിച്ചു
  rationale: നָסַע എന്ന ക്രിയ ഇവിടെ ഒരിടത്തുനിന്ന് പുറപ്പെട്ട് മറ്റൊരിടത്തേക്കു നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആഖ്യാനത്തിന്റെ സഞ്ചാരഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: മുമ്പത്തെ സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: אַרְצָה הַנֶּגֶב
  choice: നെഗെബിലേക്കു
  rationale: אַרְצָהയിലെ ദിശാസൂചകപ്രത്യയം ഗതിയെ സൂചിപ്പിക്കുന്നു; הַנֶּגֶב ഇവിടെ തെക്കൻ ഭൂവിഭാഗമായ നെഗെബിനെ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത. പൊതുവായ ‘തെക്കോട്ട്’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיֵּשֶׁב
  choice: താമസമാക്കി
  rationale: יָשַׁב ഇവിടെ ഒരു പ്രദേശത്ത് വസിക്കുകയോ താമസമുറപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘താമസമാക്കി’ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: בֵּין קָדֵשׁ וּבֵין שׁוּר
  choice: കാദേശിനും ശൂരിനും ഇടയിൽ
  rationale: രണ്ടു സ്ഥലങ്ങൾക്കിടയിലെ ഭൂമിശാസ്ത്രസ്ഥാനം നേരിട്ട് വ്യക്തമാക്കുന്നു; സ്ഥലനാമങ്ങൾ മലയാളലിപിയിൽ ലിപ്യന്തരം ചെയ്തു.
- source_word: וַיָּגָר
  choice: പരദേശിയായി പാർത്തു
  rationale: גּוּר വെറും വാസമല്ല, അന്യദേശക്കാരനായോ താൽക്കാലിക നിവാസിയായോ പാർക്കുന്നതിന്റെ അർഥം വഹിക്കുന്നു; ‘പരദേശിയായി പാർത്തു’ ആ സൂക്ഷ്മത വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: בִּגְרָר
  choice: ഗെരാറിൽ
  rationale: സ്ഥലനാമത്തോടുകൂടിയ സ്ഥാനസൂചകപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘പരദേശിയായി പാർത്തു’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ താൽക്കാലിക/അന്യദേശവാസത്തിന്റെ സൂക്ഷ്മത നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ഭൂമിശാസ്ത്രവാക്യഭാഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
