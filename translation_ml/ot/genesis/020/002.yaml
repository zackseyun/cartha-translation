  yaml_path: translation/ot/genesis/020/002.yaml
  text: And Abraham said of Sarah his wife[b][a], “She is my sister.” So Abimelech king of Gerar sent and took Sarah.
translation:
  language: ml
  text: അബ്രാഹാം തന്റെ ഭാര്യയായ സാറായെക്കുറിച്ച്[a], “അവൾ എന്റെ സഹോദരിയാണ്” എന്നു പറഞ്ഞു. അപ്പോൾ ഗെരാരിലെ രാജാവായ അബീമേലെക്ക് അയച്ച് സാറായെ കൊണ്ടുപോയി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തന്റെ ഭാര്യയായ സാറായോട്.” എബ്രായ പൂർവപ്രത്യയം അക്ഷരാർഥത്തിൽ അങ്ങനെ പരിഭാഷപ്പെടുത്താം; എന്നാൽ “അവൾ എന്റെ സഹോദരിയാണ്” എന്ന പ്രസ്താവന കണക്കിലെടുക്കുമ്പോൾ അബ്രാഹാം സാറായെക്കുറിച്ചാണ് സംസാരിച്ചതെന്ന അർഥമാണ് സന്ദർഭത്തിന് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, അബീമേലെക്ക് സാറായെ തന്റെ അടുക്കൽ കൊണ്ടുവരുത്തി; എബ്രായ പാഠം അക്ഷരാർഥത്തിൽ “അയച്ചു, സാറായെ എടുത്തു” എന്നു മാത്രമാണ് പറയുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന സാധാരണ എബ്രായ ആഖ്യാനക്രിയയുടെ സ്വാഭാവിക മലയാള സമാനപദം.
- source_word: אֶל שָׂרָה אִשְׁתּוֹ
  choice: തന്റെ ഭാര്യയായ സാറായെക്കുറിച്ച്
  rationale: אֶל സാധാരണയായി ‘യോട്’ എന്നാണെങ്കിലും, പിന്നാലെയുള്ള ‘അവൾ എന്റെ സഹോദരിയാണ്’ എന്ന പ്രസ്താവനയുടെ പശ്ചാത്തലത്തിൽ ഇവിടെ സാറായെക്കുറിച്ചുള്ള സംസാരമെന്ന അർഥമാണ് കൂടുതൽ യോജിക്കുന്നത്; മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲחֹתִי הִוא
  choice: അവൾ എന്റെ സഹോദരിയാണ്
  rationale: ക്രിയയില്ലാത്ത എബ്രായ വാക്യത്തിന്റെയും ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയത്തിന്റെയും നേരിട്ടും സ്വാഭാവികവുമായ മലയാള രൂപം.
- source_word: וַיִּשְׁלַח
  choice: ആളയച്ച്
  rationale: שלח എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘അയയ്ക്കുക’ എന്നാണ്. മലയാളത്തിൽ കർത്താവ് ആളുകളെ അയച്ചുവെന്ന സൂചിതാർഥം സ്വാഭാവികമായി നൽകാൻ ‘ആളയച്ച്’ ഉപയോഗിച്ചു.
- source_word: מֶלֶךְ גְּרָר
  choice: ഗെരാർരാജാവായ
  rationale: അബീമേലെക്കിന്റെ പദവിയും ഭരണപ്രദേശവും സൂചിപ്പിക്കുന്ന എബ്രായ സംയുക്തരൂപത്തിന്റെ സ്വാഭാവിക മലയാള പരിഭാഷ.
- source_word: וַיִּקַּח אֶת שָׂרָה
  choice: സാറായെ കൊണ്ടുപോയി
  rationale: לקח എന്ന ‘എടുക്കുക/കൊണ്ടുപോകുക’ എന്ന ക്രിയയെ ഈ സാഹചര്യത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ഭാര്യയായി എടുത്തു എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: അബീമേലെക്കിന്റെ പ്രവൃത്തിയെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാനുള്ള സാധ്യത
  choice: സാറായെ കൊണ്ടുപോയി
  alternative: സാറായെ ഭാര്യയായി എടുത്തു / തന്റെ ഭവനത്തിലേക്കു കൊണ്ടുപോയി
  rationale: സന്ദർഭം അബീമേലെക്കിന്റെ ഉദ്ദേശ്യത്തെ കൂടുതൽ വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും ഈ വാക്യം ‘അയച്ചു, സാറായെ എടുത്തു’ എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ മൂലപാഠം പറയുന്നതിലധികം ചേർക്കാതെ അതിന്റെ സംയമനം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ സംക്ഷിപ്തതയും പ്രവർത്തിയുടെ ഉദ്ദേശ്യത്തെക്കുറിച്ചുള്ള നിയന്ത്രിതമായ അസ്പഷ്ടതയും നിലനിർത്തിയിരിക്കുന്നു.
