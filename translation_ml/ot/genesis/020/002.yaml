  text: וַ/יֹּ֧אמֶר אַבְרָהָ֛ם אֶל שָׂרָ֥ה אִשְׁתּ֖/וֹ אֲחֹ֣תִ/י הִ֑וא וַ/יִּשְׁלַ֗ח אֲבִימֶ֨לֶךְ֙ מֶ֣לֶךְ גְּרָ֔ר וַ/יִּקַּ֖ח אֶת שָׂרָֽה־־׃
base_translation:
