id: GEN.20.4
reference: Genesis 20:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲבִימֶ֕לֶךְ לֹ֥א קָרַ֖ב אֵלֶ֑י/הָ וַ/יֹּאמַ֕ר אֲדֹנָ֕/י הֲ/ג֥וֹי גַּם צַדִּ֖יק תַּהֲרֹֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/004.yaml
  text: Abimelech had not come near her[a], so he said, “Lord[b], will you kill even a righteous nation?”
translation:
  language: ml
  text: 'അബീമേലെക്ക് അവളുടെ അടുത്ത് ചെന്നിരുന്നില്ല[a]. അതുകൊണ്ട് അവൻ പറഞ്ഞു: “കർത്താവേ, നീതിമാനായ ഒരു ജനതയെപ്പോലും അങ്ങ് കൊല്ലുമോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവളുടെ അടുത്ത് ചെന്നിരുന്നില്ല’ എന്നത് അബീമേലെക്ക് സാറയുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെട്ടിരുന്നില്ലെന്ന് സൂചിപ്പിക്കുന്ന ഒരു എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: קָרַב אֵלֶיהָ
  choice: അവളുടെ അടുത്ത് ചെന്നിരുന്നില്ല
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥമായ ‘അവളുടെ അടുത്ത് ചെല്ലുക’ എന്ന രൂപം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ അത് ലൈംഗികബന്ധം ഉണ്ടായിട്ടില്ലെന്ന സൂചന നൽകുന്നു.
- source_word: אֲדֹנָי
  choice: കർത്താവേ
  rationale: സ്വപ്നത്തിൽ ദൈവത്തെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന ബഹുമാനപൂർവമായ സ്വാഭാവിക മലയാളരൂപം; ‘ദൈവമായ കർത്താവേ’ എന്നു ചേർക്കുന്നത് മൂലത്തിൽ ഇല്ലാത്ത വാക്കുകൾ കൂട്ടിച്ചേർക്കും.
- source_word: גּוֹי
  choice: ജനത
  rationale: ഒരു കൂട്ടായ ജനവിഭാഗത്തെയോ രാഷ്ട്രത്തെയോ സൂചിപ്പിക്കുന്ന പദം. ഇവിടെ അബീമേലെക്കിനെ മാത്രം ഉദ്ദേശിക്കുന്നതായി ചുരുക്കാതെ കൂട്ടായ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: גַּם
  choice: പോലും
  rationale: 'ചോദ്യത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു: ‘നീതിമാനായ ഒരു ജനതയെപ്പോലും’.'
- source_word: צַדִּיק
  choice: നീതിമാനായ
  rationale: കുറ്റമില്ലാത്തവൻ എന്ന സന്ദർഭാർഥം ഉൾക്കൊള്ളുന്നതിനൊപ്പം തിരുവെഴുത്തിലെ വിപുലമായ ‘നീതി/നീതിമാൻ’ പദബന്ധം നിലനിർത്തുന്നു.
- source_word: תַּהֲרֹג
  choice: അങ്ങ് കൊല്ലുമോ
  rationale: നേരിട്ടുള്ള ആലങ്കാരിക ചോദ്യത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു; ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ മാന്യവും സ്വാഭാവികവുമാണ്.
- source_word: וַאֲבִימֶלֶךְ ... וַיֹּאמַר
  choice: അബീമേലെക്ക് ... അതുകൊണ്ട് അവൻ പറഞ്ഞു
  rationale: ആദ്യത്തെ വാവ് ഘടകത്തിന് മൂലത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ ചേർക്കാതെ ആഖ്യാനക്രമം നൽകുന്നു; സമീപിച്ചിട്ടില്ലെന്ന വസ്തുതയും അപേക്ഷയും തമ്മിലുള്ള കാരണബന്ധം ‘അതുകൊണ്ട്’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അബീമേലെക്കിന്റെ അപേക്ഷയിലെ גּוֹי എന്ന പദത്തിന്റെ കൂട്ടായ വ്യാപ്തി
  choice: ‘ജനത’ എന്നു പരിഭാഷപ്പെടുത്തി കൂട്ടായ അർഥം നിലനിർത്തുക
  alternative: ‘ജനം’ അല്ലെങ്കിൽ ‘കുടുംബം’
  rationale: എബ്രായപദം ഒരു കൂട്ടായ ഘടകത്തെ സൂചിപ്പിക്കുന്നു; വിധിയുടെ ഭീഷണി രാജാവിൽ മാത്രം ഒതുങ്ങുന്നില്ലെന്ന സന്ദർഭസൂചന നിലനിർത്തുകയും അതിന്റെ കൃത്യമായ രാഷ്ട്രീയ വ്യാപ്തി അനാവശ്യമായി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: צַדִּיק എന്ന പദത്തിലെ നീതിയും കുറ്റമില്ലായ്മയും തമ്മിലുള്ള അർഥപിരിമുറുക്ക്
  choice: ‘നീതിമാനായ’
  alternative: ‘നിരപരാധിയായ’
  rationale: ഇപ്പോഴത്തെ സംഭവത്തിൽ കുറ്റമില്ലായ്മയെന്ന അവകാശവാദം പ്രസക്തമാണെങ്കിലും, മൂലപദത്തിന്റെ വിപുലമായ നീതി-അർഥം ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ദൈവത്തെ നേരിട്ട് അഭിസംബോധന ചെയ്യുമ്പോൾ ‘കർത്താവേ’ എന്നും തുടർന്നുള്ള സർവനാമത്തിൽ മാന്യരൂപമായ ‘അങ്ങ്’ എന്നും ഉപയോഗിച്ചു. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകളിൽ മാർക്കറുകളും ഉള്ളടക്കവും തമ്മിൽ പൊരുത്തക്കേടുണ്ടായതിനാൽ, മൂലപാഠവുമായി യോജിക്കുന്ന സാംസ്കാരിക വിശദീകരണം [a] ആയി മാത്രമാണ് ഉൾപ്പെടുത്തിയിരിക്കുന്നത്; ‘ജനത/ജനം’ എന്ന വ്യത്യാസം പ്രധാന വിവർത്തനത്തിൽ സ്വാഭാവികമായി പരിഹരിച്ചതിനാൽ വേറെ അടിക്കുറിപ്പ് നൽകിയിട്ടില്ല.
