  source_fidelity: 'എബ്രായ മൂലത്തിലെ ക്രമവും ഘടകങ്ങളും കൃത്യമായി പ്രതിഫലിക്കുന്നു: അബീമേലെക്ക് ആടുമാടുകളെയും പുരുഷ-സ്ത്രീ അടിമകളെയും എടുത്ത് അബ്രാഹാമിനു കൊടുക്കുന്നു; തുടർന്ന് അബ്രാഹാമിന്റെ ഭാര്യയായ സാറയെ അവനു തിരികെ ഏൽപ്പിക്കുന്നു. וַיָּשֶׁב എന്ന ഹിഫീൽ രൂപത്തിന്റെ പുനഃസ്ഥാപന/തിരികെ-ഏൽപ്പിക്കൽ അർഥവും നിലനിൽക്കുന്നു.'
