translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ തുടർച്ചയായ ക്രിയാക്രമം സ്വാഭാവിക മലയാളവാക്യമായി ചേർത്തു; മനുഷ്യരുടെ അടിമസ്ഥിതി മൃദൂകരിക്കാതെ, എന്നാൽ അനാവശ്യമായി വ്യാഖ്യാനിക്കാതെയും അവതരിപ്പിച്ചു.
