  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אֲבִימֶ֜לֶךְ צֹ֣אן וּ/בָקָ֗ר וַ/עֲבָדִים֙ וּ/שְׁפָחֹ֔ת וַ/יִּתֵּ֖ן לְ/אַבְרָהָ֑ם וַ/יָּ֣שֶׁב ל֔/וֹ אֵ֖ת שָׂרָ֥ה אִשְׁתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/014.yaml
  text: Then Abimelech took sheep and cattle[a], and male servants and female servants, and gave them to Abraham[c][b]; and he returned Sarah his wife to him.
translation:
  language: ml
  text: അപ്പോൾ അബീമേലെക്ക് ആടുമാടുകളെയും[a] അടിമകളെയും അടിമസ്ത്രീകളെയും[b] എടുത്ത് അബ്രാഹാമിനു കൊടുത്തു; അബ്രാഹാമിന്റെ ഭാര്യ സാറയെ അവന് തിരികെ ഏൽപ്പിക്കുകയും ചെയ്തു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“ആടുമാടുകൾ”: എബ്രായത്തിലെ צֹאן എന്ന പദം ചെമ്മരിയാടുകളെയും കോലാടുകളെയും ഉൾക്കൊള്ളുന്ന ചെറിയ കന്നുകാലികളെ പൊതുവായി സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “പുരുഷ അടിമകളെയും സ്ത്രീ അടിമകളെയും.” “ദാസന്മാരെയും ദാസിമാരെയും” എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്; എന്നാൽ ഇവിടെ കന്നുകാലികളോടൊപ്പം അവരെ കൈമാറുന്നതു അവരുടെ അടിമസ്ഥിതി എടുത്തുകാട്ടുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “അബ്രാഹാമിന്റെ ഭാര്യ സാറയെ അവനു പുനഃസ്ഥാപിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: എടുത്ത്
  rationale: לקח എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘എടുക്കുക’ നിലനിർത്തുന്നു; സമ്മാനമായി നൽകുന്നതിനായി സ്വന്തം സമ്പത്തിൽനിന്ന് എടുത്തുവെന്ന ആഖ്യാനക്രമം സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: צֹאן וּבָקָר
  choice: ആടുമാടുകൾ
  rationale: ചെറിയ കന്നുകാലികളെയും bovine livestock-നെയും സൂചിപ്പിക്കുന്ന പതിവ് മലയാള സംയുക്തപ്രയോഗം; צֹאן എന്നതിൽ ചെമ്മരിയാടും കോലാടും ഉൾപ്പെടാവുന്ന വിശാലതയുണ്ട്.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: അടിമകളെയും അടിമസ്ത്രീകളെയും
  rationale: കന്നുകാലികളോടൊപ്പം മനുഷ്യരെയും കൈമാറുന്ന ഈ സാഹചര്യത്തിൽ അധീനാവസ്ഥ മറച്ചുവയ്ക്കാതെ അവതരിപ്പിക്കുന്നു; പുരുഷ-സ്ത്രീ പദവ്യത്യാസവും സൂക്ഷിക്കുന്നു.
- source_word: וַיִּתֵּן
  choice: കൊടുത്തു
  rationale: נתן എന്ന ലളിതമായ ക്രിയയ്ക്ക് സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാള സമാനപദം.
- source_word: וַיָּשֶׁב
  choice: തിരികെ ഏൽപ്പിച്ചു
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘തിരികെ വരുത്തുക/പുനഃസ്ഥാപിക്കുക’ എന്ന causative അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: שָׂרָה אִשְׁתּוֹ
  choice: അബ്രാഹാമിന്റെ ഭാര്യ സാറയെ
  rationale: ‘അവന്റെ ഭാര്യയായ സാറ’ എന്ന എബ്രായ ഘടനയിലെ സർവനാമം അബ്രാഹാമിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അവ്യക്തത ഒഴിവാക്കാൻ പേര് ആവർത്തിക്കുന്നു.
- source_word: לוֹ
  choice: അവന്
  rationale: പ്രത്യയം അബ്രാഹാമിനെ സൂചിപ്പിക്കുന്നു; തൊട്ടുമുമ്പ് അബ്രാഹാമിന്റെ പേര് പറഞ്ഞതിനാൽ മലയാളത്തിൽ പരാമർശം വ്യക്തമാണ്.
