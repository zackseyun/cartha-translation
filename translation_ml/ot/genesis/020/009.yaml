reference: Genesis 20:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֲבִימֶ֜לֶךְ לְ/אַבְרָהָ֗ם וַ/יֹּ֨אמֶר ל֜/וֹ מֶֽה עָשִׂ֤יתָ לָּ֨/נוּ֙ וּ/מֶֽה חָטָ֣אתִי לָ֔/ךְ כִּֽי הֵבֵ֧אתָ עָלַ֛/י וְ/עַל מַמְלַכְתִּ֖/י חֲטָאָ֣ה גְדֹלָ֑ה מַעֲשִׂים֙ אֲשֶׁ֣ר לֹא יֵֽעָשׂ֔וּ עָשִׂ֖יתָ עִמָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/009.yaml
  text: Then Abimelech called Abraham and said to him[a], “What have you done to us? And how have I sinned against you[b], that you have brought a great sin on me and on my kingdom? You have done to me things that should not be done.”
translation:
  language: ml
  text: 'അപ്പോൾ അബീമേലെക്ക് അബ്രാഹാമിനെ വിളിച്ച് അവനോടു പറഞ്ഞു: “നീ ഞങ്ങളോട് എന്താണ് ചെയ്തത്? ഞാൻ നിന്നോട് എന്തു പാപം ചെയ്തിട്ടാണ് നീ എന്റെയും എന്റെ രാജ്യത്തിന്റെയുംമേൽ വലിയൊരു പാപം വരുത്തിവെച്ചത്? ചെയ്യാൻ പാടില്ലാത്ത കാര്യങ്ങളാണ് നീ എന്നോടു ചെയ്തത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֲבִימֶלֶךְ לְאַבְרָהָם
  choice: അബീമേലെക്ക് അബ്രാഹാമിനെ വിളിച്ച്
  rationale: קרא + לְ ഇവിടെ ഒരാളെ വിളിക്കുക അഥവാ വരുത്തുക എന്ന അർഥത്തിലാണ്. സന്ദർഭം ഔദ്യോഗികമായി ആളയച്ചു വരുത്തിയതാണെന്ന് നിർബന്ധിക്കാത്തതിനാൽ സ്വാഭാവികമായ ‘വിളിച്ച്’ സ്വീകരിച്ചു.
- source_word: מֶה עָשִׂיתָ לָּנוּ
  choice: നീ ഞങ്ങളോട് എന്താണ് ചെയ്തത്?
  rationale: ഹീബ്രു ചോദ്യത്തിന്റെ നേരിട്ടുള്ള കുറ്റപ്പെടുത്തൽഭാവവും പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രത്യാഘാതവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וּמֶה חָטָאתִי לָךְ
  choice: ഞാൻ നിന്നോട് എന്തു പാപം ചെയ്തിട്ടാണ്
  rationale: חטא എന്നതിന് ഇവിടെ മറ്റൊരാളോടു ചെയ്ത ധാർമിക കുറ്റം എന്ന അർഥമുണ്ട്. ‘പാപം’ അതിന്റെ ശക്തി നിലനിർത്തുന്നു; מֶה മലയാളത്തിൽ സ്വാഭാവികമായി ‘എന്തു പാപം’ എന്നു നൽകി.
- source_word: כִּי
  choice: ചെയ്തിട്ടാണ്
  rationale: 'അബീമേലെക്കിന്റെ ചോദ്യത്തെയും അതിന്റെ ഫലമായ കുറ്റാരോപണത്തെയും മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു: താൻ എന്തു കുറ്റം ചെയ്തതിനാലാണ് അബ്രാഹാം ഇങ്ങനെ ചെയ്തത് എന്ന ഭാവം.'
- source_word: הֵבֵאתָ עָלַי וְעַל מַמְלַכְתִּי
  choice: നീ എന്റെയും എന്റെ രാജ്യത്തിന്റെയുംമേൽ ... വരുത്തിവെച്ചത്
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം എന്തെങ്കിലും ഒരാളുടെമേൽ വരാൻ കാരണമാകുക എന്ന അർഥം നൽകുന്നു. ‘വരുത്തിവെച്ചത്’ അബ്രാഹാമിന്റെ പ്രവൃത്തിയെയും അതിന്റെ ഗുരുതര ഫലത്തെയും വ്യക്തമാക്കുന്നു.
- source_word: חֲטָאָה גְדֹלָה
  choice: ഇത്ര വലിയൊരു പാപം
  rationale: חטאה കുറ്റം, പാപം, കുറ്റബാധ്യത എന്നിവ സൂചിപ്പിക്കാം. ഇവിടെ രാജ്യത്തിന്മേൽ വരുത്തിയ ഗുരുതരമായ ധാർമിക ലംഘനം ഉദ്ദേശിക്കുന്നതിനാൽ ‘വലിയൊരു പാപം’ തെരഞ്ഞെടുത്തു; ‘ഇത്ര’ കുറ്റാരോപണത്തിന്റെ തീവ്രത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מַעֲשִׂים אֲשֶׁר לֹא יֵעָשׂוּ
  choice: ചെയ്യാൻ പാടില്ലാത്ത കാര്യങ്ങൾ
  rationale: വാച്യമായി ‘ചെയ്യപ്പെടാത്ത പ്രവൃത്തികൾ’ എന്നായാലും ഈ പ്രയോഗത്തിന് സമൂഹ-ധാർമികമായി അനുചിതമായ പ്രവൃത്തികൾ എന്ന മാനദണ്ഡാർഥമുണ്ട്. ‘ചെയ്യാൻ പാടില്ലാത്ത’ അത് വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: നീ എന്നോടു ചെയ്തത്
  rationale: עשה עם/עמד എന്ന പ്രയോഗം ഒരാളോടു ഒരു വിധത്തിൽ പെരുമാറുക അഥവാ എന്തെങ്കിലും ചെയ്യുക എന്ന അർഥത്തിലാണ്. ആവർത്തനമുള്ള ഹീബ്രു വാക്യഘടനയുടെ ഊന്നൽ മലയാളത്തിലും നിലനിർത്തി.
theological_decisions:
- issue: חֲטָאָה എന്ന പദം പാപമോ കുറ്റബാധ്യതയോ എന്ന നിലയിൽ വിവർത്തനം ചെയ്യുക
  choice: പാപം
  alternative: വലിയ കുറ്റം / വലിയ കുറ്റബാധ്യത
  rationale: സന്ദർഭത്തിൽ അബ്രാഹാമിന്റെ വഞ്ചന മൂലം അബീമേലെക്കും രാജ്യവും ഗുരുതരമായ ധാർമിക ലംഘനത്തിൽ അകപ്പെടുമായിരുന്നുവെന്ന ആശയമാണ്. ‘പാപം’ ഈ ധാർമിക-മതപരമായ ഭാരം നിലനിർത്തുന്നു; കുറ്റബാധ്യതയുടെ ഫലഭാവം ‘മേൽ ... വരുത്തിവെച്ചത്’ എന്ന പ്രയോഗത്തിൽ സംരക്ഷിക്കപ്പെടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. കുറ്റപ്പെടുത്തലിന്റെ നേരിട്ടുള്ള ഭാവവും ഹീബ്രു വാക്യത്തിലെ ആവർത്തന ഊന്നലും നിലനിർത്തിയിട്ടുണ്ട്; പഴഞ്ചൻ പദങ്ങളും വിഭാഗീയ ദൈവശാസ്ത്ര ഭാഷയും ഒഴിവാക്കി.
