  text: הֲ/לֹ֨א ה֤וּא אָֽמַר לִ/י֙ אֲחֹ֣תִ/י הִ֔וא וְ/הִֽיא גַם הִ֥וא אָֽמְרָ֖ה אָחִ֣/י ה֑וּא בְּ/תָם לְבָבִ֛/י וּ/בְ/נִקְיֹ֥ן כַּפַּ֖/י עָשִׂ֥יתִי זֹֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/005.yaml
  text: Did he not himself say to me[a], ‘She is my sister’? And she herself also said, ‘He is my brother.’ In the integrity of my heart and the innocence of my hands I have done this.
translation:
  language: ml
  text: “‘അവൾ എന്റെ സഹോദരിയാണ്’ എന്ന് അവൻ തന്നെയല്ലേ എന്നോടു പറഞ്ഞത്? ‘അവൻ എന്റെ സഹോദരനാണ്’ എന്ന് അവളും പറഞ്ഞു. ഹൃദയത്തിന്റെ നിഷ്കളങ്കതയോടും കൈകളുടെ നിർദോഷതയോടുംകൂടിയാണ് ഞാൻ ഇതു ചെയ്തത്.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിഷ്കളങ്കമായ ഹൃദയത്തോടും ശുദ്ധമായ കൈകളോടുംകൂടി.” എബ്രായത്തിൽ സത്യസന്ധതയും കുറ്റമില്ലായ്മയും സൂചിപ്പിക്കുന്ന ധാർമിക-നിയമപരമായ ശൈലീപ്രയോഗങ്ങളാണിവ.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הוּא אָמַר לִי
  choice: അവൻതന്നെയല്ലേ എന്നോടു പറഞ്ഞത്?
  rationale: הֲלֹא ഉറപ്പിക്കുന്ന മറുപടി പ്രതീക്ഷിക്കുന്ന ചോദ്യമാണ്; സ്വതന്ത്ര സർവനാമമായ הוּא നൽകുന്ന ഊന്നൽ ‘അവൻതന്നെ’ എന്നു നിലനിർത്തുന്നു.
- source_word: אֲחֹתִי הִוא
  choice: അവൾ എന്റെ സഹോദരിയാണ്
  rationale: ബന്ധത്തെക്കുറിച്ചുള്ള നേരിട്ടുള്ള പ്രസ്താവന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהִיא גַם הִוא אָמְרָה
  choice: അവളുംതന്നെ പറഞ്ഞു
  rationale: גם എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽഭാവവും ആവർത്തിച്ച സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നലും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂക്ഷിക്കുന്നു.
- source_word: אָחִי הוּא
  choice: അവൻ എന്റെ സഹോദരനാണ്
  rationale: എബ്രായ ബന്ധപദപ്രയോഗത്തിന്റെ നേരിട്ടുള്ള സമാനരൂപം.
- source_word: בְּתָם לְבָבִי
  choice: ഹൃദയപരമാർഥതയോടെ
  rationale: תָם ഇവിടെ സമ്പൂർണ പാപരാഹിത്യമെന്നതിലുപരി ഉദ്ദേശ്യത്തിലെ സത്യസന്ധതയും ധാർമിക നിഷ്കളങ്കതയും സൂചിപ്പിക്കുന്നു.
- source_word: וּבְנִקְיֹן כַּפַּי
  choice: കൈകളുടെ നിർദോഷതയോടുംകൂടെ
  rationale: נִקְיֹן എന്ന നിർമലത/കുറ്റമില്ലായ്മയും ‘കൈകൾ’ എന്ന പ്രവൃത്തിയെയും ഉത്തരവാദിത്വത്തെയും സൂചിപ്പിക്കുന്ന രൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: עָשִׂיתִי זֹאת
  choice: ഞാൻ ഇതു ചെയ്തത്
  rationale: അബീമേലെക്കിന്റെ ഇപ്പോഴത്തെ സ്വയംന്യായീകരണത്തിൽ പൂർത്തിയായ പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അബീമേലെക്കിന്റെ ധാർമിക-നിയമപരമായ സ്വയംന്യായീകരണം
  choice: ഈ പ്രവൃത്തിയുമായി ബന്ധപ്പെട്ട ഹൃദയപരമാർഥതയും പ്രവൃത്തിയിലെ നിർദോഷതയും അവകാശപ്പെടുന്നതായി വിവർത്തനം ചെയ്തു.
  alternative: ‘ഹൃദയത്തിന്റെ സമ്പൂർണതയിലും കൈകളുടെ ശുദ്ധിയിലും’ എന്ന കൂടുതൽ പദാനുപദ രൂപം.
  rationale: വാക്യം അബീമേലെക്കിന് സമ്പൂർണ പാപരാഹിത്യം കല്പിക്കുന്നില്ല; ഈ പ്രത്യേക സംഭവത്തിലെ ഉദ്ദേശ്യവും കുറ്റബോധമില്ലായ്മയും സംബന്ധിച്ച അവന്റെ അവകാശവാദമാണ്. എബ്രായത്തിലെ രൂപകവും അതിന്റെ പരിധിയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അവൻതന്നെ/അവളുംതന്നെ’ എന്ന രൂപങ്ങൾ മൂലത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു; ധാർമിക രൂപകങ്ങൾ പൂർണമായി പരത്തിപ്പറയാതെ മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിരിക്കുന്നു.
