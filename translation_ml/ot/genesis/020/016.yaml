id: GEN.20.16
reference: Genesis 20:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/שָׂרָ֣ה אָמַ֗ר הִנֵּ֨ה נָתַ֜תִּי אֶ֤לֶף כֶּ֨סֶף֙ לְ/אָחִ֔י/ךְ הִנֵּ֤ה הוּא לָ/ךְ֙ כְּס֣וּת עֵינַ֔יִם לְ/כֹ֖ל אֲשֶׁ֣ר אִתָּ֑/ךְ וְ/אֵ֥ת כֹּ֖ל וְ/נֹכָֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/016.yaml
  text: And to Sarah he said[a], “Look, I have given a thousand pieces of silver to your brother. Look, it is for you a covering of the eyes to all who are with you[b], and before everyone you are vindicated.”
translation:
  language: ml
  text: 'സാറയോടും അവൻ പറഞ്ഞു: “ഇതാ, ഞാൻ നിന്റെ സഹോദരന് ആയിരം വെള്ളിക്കഷണം കൊടുത്തിരിക്കുന്നു. ഇതാ, അത് നിന്നോടുകൂടെയുള്ള എല്ലാവർക്കും നിന്റെ കണ്ണുകൾക്കൊരു മൂടുപടിയാണ്[a]; എല്ലാവരുടെയും മുമ്പാകെ നീ കുറ്റവിമുക്തയാക്കപ്പെട്ടിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കണ്ണുകൾക്കുള്ള ഒരു മറ.’ കുറ്റത്തെ മറയ്ക്കുകയും സാറയുടെ മാനം പുനഃസ്ഥാപിക്കുകയും ചെയ്യുന്ന പരസ്യമായ നഷ്ടപരിഹാരമായിരിക്കാം ഇതിന്റെ ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നിന്റെ നിരപരാധിത്വം തെളിയിക്കപ്പെട്ടിരിക്കുന്നു,’ ‘നീ ശാസിക്കപ്പെട്ടിരിക്കുന്നു,’ അല്ലെങ്കിൽ ‘എല്ലാവരുടെയും മുമ്പാകെ കാര്യം തീർപ്പാക്കിയിരിക്കുന്നു.’ അവസാനത്തെ എബ്രായവാക്യം ദുഷ്കരമാണ്; അതിനെ പലവിധത്തിൽ മനസ്സിലാക്കിയിട്ടുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶלֶף כֶּסֶף
  choice: ആയിരം വെള്ളിക്കഷണം
  rationale: അക്ഷരാർഥത്തിൽ ‘ആയിരം വെള്ളി’ എന്നാണ്. അളവോ നാണയമോ എബ്രായപാഠത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ ‘ശേക്കെൽ’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ അർഥം ചേർക്കാതെ സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
- source_word: לְאָחִיךְ
  choice: നിന്റെ സഹോദരന്
  rationale: സാറ അബ്രാഹാമിനെ സഹോദരനായി അവതരിപ്പിച്ച കഥാസന്ദർഭവും അതിലെ പരിഹാസധ്വനിയും നിലനിർത്തുന്നു.
- source_word: כְּסוּת עֵינַיִם
  choice: നിന്റെ കണ്ണുകൾക്കൊരു മൂടുപടി
  rationale: ദുഷ്കരമായ ഈ പ്രയോഗത്തിന്റെ രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി. അപമാനം മറയ്ക്കുകയും സാറയുടെ മാനം പരസ്യമായി പുനഃസ്ഥാപിക്കുകയും ചെയ്യുന്ന നഷ്ടപരിഹാരമാണ് സാധ്യതയുള്ള ആശയം.
- source_word: לְכֹל אֲשֶׁר אִתָּךְ
  choice: നിന്നോടുകൂടെയുള്ള എല്ലാവർക്കും
  rationale: לְ എന്ന ഉപസർഗത്തിന്റെ രൂപം നിലനിർത്തിക്കൊണ്ട് നടപടിയുടെ സാമൂഹികവും പരസ്യവുമായ വ്യാപ്തി സൂചിപ്പിക്കുന്നു.
- source_word: וְאֵת כֹּל
  choice: എല്ലാവരുടെയും മുമ്പാകെ
  rationale: വാക്യഘടനയിൽ ചുരുക്കമുള്ള ദുഷ്കരമായ പ്രയോഗമാണിത്. സാറയോടുകൂടെയുള്ളവരിൽനിന്ന് പൊതുവായി എല്ലാവരിലേക്കു പരസ്യസാക്ഷ്യത്തിന്റെ പരിധി വികസിപ്പിക്കുന്നതായി വായിച്ചു.
- source_word: וְנֹכָחַת
  choice: നീ കുറ്റവിമുക്തയാക്കപ്പെട്ടിരിക്കുന്നു
  rationale: יכח എന്ന ധാതുവിന്റെ നിഫാൽ രൂപത്തെ ഇവിടെ പൊതുവായി കുറ്റം നീക്കി നിരപരാധിത്വം സ്ഥാപിക്കുന്ന അർഥത്തിൽ എടുത്തു. ‘ശാസിക്കപ്പെട്ടു’ എന്ന വായന സാധ്യമാണെങ്കിലും സന്ദർഭം സാറയുടെ മാനം പുനഃസ്ഥാപിക്കുന്നതിലേക്കാണ് കൂടുതൽ ചായുന്നത്.
theological_decisions:
- issue: וְנֹכָחַת എന്ന ദുഷ്കരമായ അന്തിമക്രിയയുടെ അർഥം
  choice: നീ കുറ്റവിമുക്തയാക്കപ്പെട്ടിരിക്കുന്നു
  alternative: നീ ശാസിക്കപ്പെട്ടിരിക്കുന്നു / കാര്യം എല്ലാവരുടെയും മുമ്പാകെ തീർപ്പാക്കിയിരിക്കുന്നു
  rationale: അബീമേലെക്ക് നഷ്ടപരിഹാരം നൽകുകയും സാറയുടെ നിരപരാധിത്വം പരസ്യമായി അംഗീകരിക്കുകയും ചെയ്യുന്ന സന്ദർഭത്തിൽ ‘കുറ്റവിമുക്തയാക്കപ്പെട്ടു’ എന്നത് യോജിക്കുന്നു; എന്നാൽ മറ്റുവായനകൾ അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ദുഷ്കരമായ ‘കണ്ണുകളുടെ മൂടുപടി’ എന്ന എബ്രായരൂപകം ലളിതവൽക്കരിക്കാതെ മുഖ്യപാഠത്തിൽ നിലനിർത്തി; അന്തിമവാക്യത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
