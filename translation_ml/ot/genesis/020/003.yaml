id: GEN.20.3
reference: Genesis 20:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֧א אֱלֹהִ֛ים אֶל אֲבִימֶ֖לֶךְ בַּ/חֲל֣וֹם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ הִנְּ/ךָ֥ מֵת֙ עַל הָ/אִשָּׁ֣ה אֲשֶׁר לָקַ֔חְתָּ וְ/הִ֖וא בְּעֻ֥לַת בָּֽעַל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/003.yaml
  text: But God came to Abimelech in a dream by night and said to him[a], “Behold, you are a dead man because of the woman whom you have taken[c][b], for she is married.”
translation:
  language: ml
  text: 'എന്നാൽ രാത്രിയിൽ ഒരു സ്വപ്നത്തിൽ ദൈവം അബീമേലെക്കിന്റെ അടുക്കൽ വന്ന് അവനോടു പറഞ്ഞു: “ഇതാ, നീ എടുത്ത ആ സ്ത്രീ നിമിത്തം നീ മരിക്കാൻ പോകുന്നു[a]; അവൾ വിവാഹിതയാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഇതാ, നീ മരിച്ചവനാണ്”; ഉറപ്പായും ആസന്നമായും സംഭവിക്കാനിരിക്കുന്ന മരണത്തെയാണ് ഹീബ്രു പ്രയോഗം സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രു പ്രയോഗം അക്ഷരാർഥത്തിൽ ഒരു ഭർത്താവുമായുള്ള അവളുടെ നിലവിലുള്ള ബന്ധത്തെ ഊന്നിപ്പറയുന്നു; അതായത്, അവൾക്ക് ഇതിനകം ഭർത്താവുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അടുക്കൽ വന്നു
  rationale: സ്വപ്നത്തിലെ ദൈവിക സമാഗമത്തെ സൂചിപ്പിക്കുന്ന ആഖ്യാനപ്രയോഗം; ഭൗതികമായി ഒരു സ്ഥലത്തേക്ക് പ്രവേശിച്ചു എന്ന അധികവിവരം ചേർക്കുന്നില്ല.
- source_word: בַּחֲלוֹם הַלָּיְלָה
  choice: രാത്രിയിൽ ഒരു സ്വപ്നത്തിൽ
  rationale: രാത്രികാല സ്വപ്നവെളിപ്പാടെന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הִנְּךָ מֵת
  choice: ഇതാ, ... നീ മരിക്കാൻ പോകുന്നു
  rationale: മരണം ഉറപ്പായും ആസന്നമായും വരുന്നു എന്ന മുന്നറിയിപ്പിന്റെ ശക്തി നിലനിർത്തുന്നു; ഇതിനകം മരിച്ചിരിക്കുന്നു എന്ന അസംബന്ധമായ അക്ഷരാർഥം ഒഴിവാക്കുന്നു.
- source_word: עַל הָאִשָּׁה אֲשֶׁר לָקַחְתָּ
  choice: നീ എടുത്ത സ്ത്രീ നിമിത്തം
  rationale: עַל എന്നതിന്റെ കാരണാർഥവും לָקַחְתָּ എന്ന ക്രിയയുടെ പൊതുവായ ‘എടുത്തു’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു; ബലപ്രയോഗം ഉണ്ടായിരുന്നുവെന്ന് അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: בְּעֻלַת בָּעַל
  choice: അവൾ വിവാഹിതയാണ്
  rationale: ഒരു ഭർത്താവുമായുള്ള നിലവിലുള്ള വിവാഹബന്ധം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: הִנְּךָ מֵת എന്ന ദൈവിക മുന്നറിയിപ്പിന്റെ കാലവും ഭാവവും
  choice: നീ മരിക്കാൻ പോകുന്നു
  alternative: നീ മരിച്ചവനാണ് / നിന്റെ മരണം ഉറപ്പാണ്
  rationale: ഹീബ്രു ഘടന ഉറപ്പായ ആസന്നമരണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ഭാവാർഥമുള്ള സ്വാഭാവിക മലയാളം സ്വീകരിച്ചു; വർത്തമാനവും ഭാവിയും തമ്മിലുള്ള ഉറച്ച വ്യാകരണനിർണ്ണയം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- issue: בְּעֻלַת בָּעַל എന്ന വിവാഹബന്ധപ്രയോഗം
  choice: അവൾ വിവാഹിതയാണ്
  alternative: അവൾക്ക് ഭർത്താവുണ്ട് / അക്ഷരാർഥത്തിൽ, അവൾ ഒരു ഭർത്താവിനാൽ അവകാശപ്പെട്ടവളാണ്
  rationale: സ്ത്രീയുടെ നിലവിലുള്ള വിവാഹബന്ധമാണ് സന്ദർഭത്തിലെ പ്രധാനം. ഉടമസ്ഥതയെക്കുറിച്ചുള്ള അധിക ദൈവശാസ്ത്രപരമായ അവകാശവാദം മലയാളത്തിൽ ഇറക്കുമതി ചെയ്യാതെ മൂലപ്രയോഗത്തിന്റെ രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ഇതാ’ മുന്നറിയിപ്പിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; ‘നിമിത്തം’ ഔപചാരികമായെങ്കിലും സാധാരണ ബൈബിൾ വായനയിൽ ഗ്രാഹ്യമാണ്. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
