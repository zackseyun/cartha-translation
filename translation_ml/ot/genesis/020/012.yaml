- source_word: אָמְנָה
  choice: വാസ്തവത്തിൽ
  rationale: പറഞ്ഞ അവകാശവാദം സത്യമാണെന്ന് ഊന്നിപ്പറയുന്ന ക്രിയാവിശേഷണത്തിന്റെ അർഥം ആധുനികവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: אֲחֹתִי
  choice: എന്റെ സഹോദരി
  rationale: ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയമുള്ള ബന്ധുത്വപദത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: בַת אָבִי
  choice: എന്റെ അപ്പന്റെ മകൾ
  rationale: അവൾ ഏത് അർഥത്തിലാണ് സഹോദരിയെന്ന് വ്യക്തമാക്കുന്ന സമാനാധികരണ പ്രയോഗം; തുടർന്നുള്ള മാതൃബന്ധ സൂചനയോടുള്ള സമാന്തരത നിലനിർത്തുന്നു.
- source_word: אַךְ לֹא בַת אִמִּי
  choice: എന്നാൽ എന്റെ അമ്മയുടെ മകളല്ല
  rationale: אַךְ לֹא ഇവിടെ മുൻവാക്യത്തെ പരിമിതപ്പെടുത്തുന്ന വൈരുധ്യപരമായ യോഗ്യതയാണ്; 'എന്നാൽ ... അല്ല' അത് വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: וַתְּהִי לִי לְאִשָּׁה
  choice: അവൾ എന്റെ ഭാര്യയായിത്തീർന്നു
  rationale: היה എന്ന ക്രിയയും לְאִשָּׁה എന്ന ഘടനയും വിവാഹബന്ധത്തിലേക്കു പ്രവേശിച്ചതിനെ സൂചിപ്പിക്കുന്നു; വെറും അവസ്ഥയെന്നതിലുപരി സംഭവാത്മക അർഥം നിലനിർത്തുന്നു.
