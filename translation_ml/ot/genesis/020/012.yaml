  yaml_path: translation/ot/genesis/020/012.yaml
  text: Besides[a], she really is my sister—the daughter of my father, though not the daughter of my mother—and she became my wife.
translation:
  language: ml
  text: അതുമല്ലാതെ[a], അവൾ തീർച്ചയായും എന്റെ സഹോദരിയാണ്—എന്റെ പിതാവിന്റെ മകൾ, എന്നാൽ എന്റെ മാതാവിന്റെ മകളല്ല—അവൾ എന്റെ ഭാര്യയായിത്തീർന്നു.
  philosophy: optimal-equivalence
