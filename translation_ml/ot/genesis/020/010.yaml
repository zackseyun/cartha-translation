  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל אַבְרָהָ֑ם מָ֣ה רָאִ֔יתָ כִּ֥י עָשִׂ֖יתָ אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/010.yaml
  text: Then Abimelech said to Abraham[a], “What did you see, that you did this thing?”
translation:
  language: ml
  text: 'പിന്നെ അബീമേലെക്ക് അബ്രാഹാമിനോട് ചോദിച്ചു: “നീ എന്താണ് കണ്ടത്, ഈ കാര്യം ചെയ്യാൻ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നീ ഈ കാര്യം ചെയ്തത് എന്താണ് നിന്റെ മനസ്സിലുണ്ടായിരുന്നത്?” എബ്രായപാഠം അക്ഷരാർഥത്തിൽ “നീ എന്തു കണ്ടു...?” എന്നാണ്; ഇവിടെ ‘കാണുക’ എന്നത് ഒരാൾ ഗ്രഹിച്ചതിനെയോ മനസ്സിൽ കരുതിയതിനെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പിന്നെ ... ചോദിച്ചു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു നീക്കുന്നു; പ്രസ്താവനയുടെ രൂപം ചോദ്യമായതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ സ്വാഭാവികവും അർഥസൂചകവുമാണ്.
- source_word: אֲבִימֶלֶךְ
  choice: അബീമേലെക്ക്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: אֶל־אַבְרָהָם
  choice: അബ്രാഹാമിനോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: מָה רָאִיתָ
  choice: നീ എന്തു കണ്ടിട്ടാണ്
  rationale: ‘നീ എന്തു കണ്ടു?’ എന്ന എബ്രായ ദൃശ്യരൂപകം നിലനിർത്തിക്കൊണ്ട്, തുടർന്നുള്ള പ്രവൃത്തിയുമായി അതിന്റെ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: כִּי עָשִׂיתָ
  choice: '... ചെയ്തത്'
  rationale: כִּי ഇവിടെ മുൻചോദ്യത്തെയും അബ്രാഹാമിന്റെ പ്രവൃത്തിയെയും ബന്ധിപ്പിക്കുന്നു; ‘കണ്ടിട്ടാണ് ... ചെയ്തത്’ എന്ന ഘടന ആ ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം
  rationale: דָּבָר എന്നതിന് സന്ദർഭത്തിൽ ‘കാര്യം’ സ്വാഭാവികമാണ്; ‘പ്രവൃത്തി’ എന്നു നൽകുന്നതിലുണ്ടാകാവുന്ന അധിക ധാർമ്മിക വിലയിരുത്തൽ ഒഴിവാക്കുന്നു.
