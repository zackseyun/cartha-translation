  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. മൂലത്തിലെ ‘കാണുക’ എന്ന രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും അതിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
