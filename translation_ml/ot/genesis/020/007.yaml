  terminology: ‘പ്രവാചകൻ,’ ‘പ്രാർഥിക്കും,’ and ‘തീർച്ചയായും മരിക്കും’ are appropriate for a modern, dignified biblical register. The revised wording retains the singular address and avoids narrowing the referent of ‘all that is yours’ beyond the English audit trail’s people-inclusive rendering.
