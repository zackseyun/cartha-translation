  source_fidelity: The draft accurately conveys the command to restore the wife, Abraham's prophetic status and prayer, the resulting preservation of life, and the emphatic warning of death. A small revision better represents וְעַתָּה as an urgent discourse transition and renders the final broad, people-inclusive expression more idiomatically in Malayalam.
