  text: וְ/עַתָּ֗ה הָשֵׁ֤ב אֵֽשֶׁת הָ/אִישׁ֙ כִּֽי נָבִ֣יא ה֔וּא וְ/יִתְפַּלֵּ֥ל בַּֽעַדְ/ךָ֖ וֶֽ/חְיֵ֑ה וְ/אִם אֵֽינְ/ךָ֣ מֵשִׁ֗יב דַּ֚ע כִּי מ֣וֹת תָּמ֔וּת אַתָּ֖ה וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/007.yaml
  text: Now then[a], return the man's wife, for he is a prophet, and he will pray for you, and you will live. But if you do not return her, know that you will surely die—you and all who are yours.
translation:
  language: ml
  text: ഇപ്പോൾ തന്നേ ആ മനുഷ്യന്റെ ഭാര്യയെ തിരികെ കൊടുക്കുക; കാരണം അവൻ ഒരു പ്രവാചകനാണ്. അവൻ നിനക്കുവേണ്ടി പ്രാർഥിക്കും, നീ ജീവിക്കും. എന്നാൽ നീ അവളെ തിരികെ കൊടുക്കുന്നില്ലെങ്കിൽ, നീയും നിനക്കുള്ളവരൊക്കെയും[a] തീർച്ചയായും മരിക്കുമെന്ന് അറിഞ്ഞുകൊള്ളുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീയും നിനക്കുള്ള സകലവും” / “നീയും നിനക്കുള്ളതെല്ലാം.” എബ്രായപ്രയോഗം വിശാലമാണ്; അബീമേലെക്കിന്റെ ഭവനത്തിലുള്ളവരെയും അവനുള്ള സകലത്തെയും അത് ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: അടിയന്തരമായ മാറ്റവും തുടർന്നുള്ള കല്പനയും സൂചിപ്പിക്കുന്ന സംഭാഷണചിഹ്നം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഇപ്പോൾ’ എന്നു നൽകി.
- source_word: הָשֵׁב
  choice: തിരികെ കൊടുക്കുക
  rationale: ഹിഫീൽ കല്പനാരൂപം ഒരാളെ അവളുടെ യഥാർഥ ബന്ധത്തിലേക്കു മടക്കിക്കൊടുക്കുക എന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: אֵשֶׁת הָאִישׁ
  choice: ആ മനുഷ്യന്റെ ഭാര്യയെ
  rationale: എബ്രായത്തിലെ സമാസഘടന നേരിട്ട് നിലനിർത്തുകയും ഇവിടെ ഇല്ലാത്ത സർവനാമം മുൻകൂട്ടി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: כִּי נָבִיא הוּא
  choice: അവൻ ഒരു പ്രവാചകനാണ്
  rationale: കല്പനയ്ക്കുള്ള കാരണം വ്യക്തമാക്കുന്ന כִּי-യുടെ വിശദീകരണബലം പ്രസംഗസന്ദർഭത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְיִתְפַּלֵּל בַּעַדְךָ
  choice: അവൻ നിനക്കുവേണ്ടി പ്രാർഥിക്കും
  rationale: യിഖ്തോൽ രൂപത്തിന്റെ ഭാവി/ഫലസൂചക അർഥവും בְּעַד എന്നതിന്റെ മറ്റൊരാളുടെ പക്ഷത്തുള്ള പ്രാർഥനാഭാവവും ലളിതമായി അറിയിക്കുന്നു.
- source_word: וֶחְיֵה
  choice: നീ ജീവിച്ചിരിക്കും
  rationale: രൂപം കല്പനാസദൃശമാണെങ്കിലും സന്ദർഭത്തിൽ അബ്രാഹാമിന്റെ പ്രാർഥനയുടെ ഫലമാണ് ഉദ്ദേശ്യം; അതിനാൽ സ്വാഭാവികമായ ഫലവാക്യമായി വിവർത്തനം ചെയ്തു.
- source_word: וְאִם אֵינְךָ מֵשִׁיב
  choice: എന്നാൽ നീ അവളെ തിരികെ കൊടുക്കുന്നില്ലെങ്കിൽ
  rationale: നിഷേധത്തോടുകൂടിയ കൃതന്തം നിരസിക്കുന്ന/നടപ്പാക്കാത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിൽ വിട്ടുകളഞ്ഞ കർമം സന്ദർഭത്തിൽ ഭാര്യയാണെന്നതിനാൽ ‘അവളെ’ ചേർത്തു.
- source_word: דַּע
  choice: അറിഞ്ഞുകൊള്ളുക
  rationale: ഗൗരവമുള്ള മുന്നറിയിപ്പ് അവതരിപ്പിക്കുന്ന നേരിട്ടുള്ള കല്പന; മലയാളത്തിലെ മാന്യവും ശക്തവുമായ സമാനപ്രയോഗം.
- source_word: מוֹת תָּמוּת
  choice: തീർച്ചയായും മരിക്കും
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന എബ്രായ തീവ്രവൽക്കരണം മരണത്തിന്റെ ഉറപ്പ് പ്രകടമാക്കുന്നു.
- source_word: אַתָּה וְכָל אֲשֶׁר לָךְ
  choice: നീയും നിനക്കുള്ള എല്ലാവരും
  rationale: പ്രയോഗം കുടുംബാംഗങ്ങൾ, ആശ്രിതർ, ഉടമസ്ഥതയിലുള്ളവ എന്നിവ ഉൾക്കൊള്ളാവുന്നത്ര വിശാലമാണ്; മരണഭീഷണിയുടെ സന്ദർഭത്തിൽ ആളുകളെ മുൻനിർത്തിക്കൊണ്ട് യഥാർഥ വ്യാപ്തി അടച്ചുപൂട്ടുന്നില്ല.
theological_decisions:
- issue: ‘നീയും നിനക്കുള്ള സകലവും’ എന്ന ഭീഷണിയുടെ വ്യാപ്തി
  choice: നീയും നിനക്കുള്ള എല്ലാവരും
  alternative: നീയും നിനക്കുള്ള സകലവും / നീയും നിനക്കുള്ളതെല്ലാം
  rationale: അബീമേലെക്കിന്റെ ഭവനത്തെ ബാധിച്ച ന്യായവിധിയാണ് അടുത്ത സന്ദർഭം; അതിനാൽ ആളുകളെ ഉൾക്കൊള്ളുന്ന പരിഭാഷ യുക്തമാണ്. എങ്കിലും എബ്രായപ്രയോഗം സ്വത്തുക്കളെയും ഉൾക്കൊള്ളാവുന്നതിനാൽ അടിക്കുറിപ്പിൽ വിശാലമായ മറ്റൊരു വായന നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവവും മാന്യതയും പുലർത്തുന്ന മലയാളം. ഏകവചന അഭിസംബോധനയായ ‘നീ’ നിലനിർത്തി; ഉറവിടത്തിലെ കാരണ-ഫലബന്ധവും വിധിയുടെ തീക്ഷ്ണതയും സംരക്ഷിച്ചു.
