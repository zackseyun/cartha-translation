source:
  edition: WLC
  text: וַ/יְהִ֞י כַּ/אֲשֶׁ֧ר הִתְע֣וּ אֹתִ֗/י אֱלֹהִים֮ מִ/בֵּ֣ית אָבִ/י֒ וָ/אֹמַ֣ר לָ֔/הּ זֶ֣ה חַסְדֵּ֔/ךְ אֲשֶׁ֥ר תַּעֲשִׂ֖י עִמָּדִ֑/י אֶ֤ל כָּל הַ/מָּקוֹם֙ אֲשֶׁ֣ר נָב֣וֹא שָׁ֔מָּ/ה אִמְרִי לִ֖/י אָחִ֥/י הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/013.yaml
  text: 'And when God caused me to wander from my father’s house[a], I said to her, ‘This is the kindness you must show me: at every place we come to, say of me[b], “He is my brother.”’'
translation:
  language: ml
  text: 'ദൈവം എന്നെ എന്റെ പിതാവിന്റെ വീട്ടിൽനിന്ന് അലഞ്ഞുതിരിയുമാറാക്കിയപ്പോൾ[a], ഞാൻ അവളോടു പറഞ്ഞു: “നീ എന്നോടു കാണിക്കേണ്ട ദയ[b] ഇതാണ്: നാം ചെല്ലുന്ന എല്ലാ സ്ഥലത്തും, എന്നെക്കുറിച്ച്, ‘അവൻ എന്റെ സഹോദരനാണ്’ എന്നു പറയണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അലഞ്ഞുതിരിയുമാറാക്കി’ എന്നതിന് ‘വഴിതെറ്റിപ്പോകുമാറാക്കി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ കാരണാർത്ഥമുള്ളതും അലച്ചിലിനെയോ വഴിതെറ്റലിനെയോ സൂചിപ്പിക്കാവുന്നതുമാണ്; ഇവിടെ ധാർമ്മികമായ തെറ്റിനേക്കാൾ വീടുവിട്ടുള്ള സ്ഥിരതയില്ലാത്ത സഞ്ചാരമാണ് സന്ദർഭത്തിന് യോജിച്ചത്. മസോരറ്റിക് എബ്രായപാഠത്തിൽ ഈ ക്രിയ ബഹുവചനരൂപത്തിലാണ്; അതിനാൽ ‘ദേവന്മാർ എന്നെ അലഞ്ഞുതിരിയുമാറാക്കി’ എന്ന വായന വ്യാകരണപരമായി സാധ്യമാണ്. എങ്കിലും അബ്രാഹാമിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭം കാരണം പ്രധാനപാഠത്തിൽ ‘ദൈവം’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_and_grammatical_alternative
  - marker: b
    text: ‘ദയ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം വിശ്വസ്തസ്നേഹം, സ്ഥിരമായ കരുണ, വിശ്വസ്തതയോടെയുള്ള ദയ എന്നീ അർത്ഥങ്ങളും സന്ദർഭാനുസരണം വഹിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעוּ
  choice: അലഞ്ഞുതിരിയുമാറാക്കിയപ്പോൾ
  rationale: ഹിഫീൽ ക്രിയയുടെ കാരണാർത്ഥം നിലനിർത്തുന്നു. ഇവിടെ യാത്രയും സ്ഥിരതയില്ലാത്ത സഞ്ചാരവുമാണ് സന്ദർഭം; ധാർമ്മികമായി വഴിതെറ്റിച്ചു എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: വചനത്തിന്റെ വിശാലസന്ദർഭത്തിൽ അബ്രാഹാമിന്റെ ദൈവമാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്. എങ്കിലും എബ്രായ ക്രിയ ബഹുവചനമായതിനാൽ ‘ദേവന്മാർ’ എന്ന വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מִבֵּית אָבִי
  choice: എന്റെ പിതാവിന്റെ വീട്ടിൽനിന്ന്
  rationale: കുടുംബഭവനത്തെയും കുടുംബവൃത്തത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: חַסְדֵּךְ
  choice: നീ എന്നോടു കാണിക്കേണ്ട ദയ
  rationale: ഈ വ്യക്തിബന്ധസന്ദർഭത്തിൽ חֶסֶד എന്ന പദത്തിന് ‘ദയ’ സ്വാഭാവികമാണ്; അതിലുള്ള വിശ്വസ്തസ്നേഹം/സ്ഥിരമായ കരുണ എന്ന അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: תַּעֲשִׂי עִמָּדִי
  choice: നീ എന്നോടു കാണിക്കേണ്ട
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്നോടുകൂടെ/എന്നോട് ചെയ്യുക’ എന്ന ഘടന ‘ദയ’യോടു ചേർന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി ‘കാണിക്കുക’ എന്നു വരുന്നു.
- source_word: אֶל כָּל הַמָּקוֹם אֲשֶׁר נָבוֹא שָׁמָּה
  choice: നാം ചെല്ലുന്ന എല്ലാ സ്ഥലത്തും
  rationale: ഓരോ സ്ഥലത്തെയും സൂചിപ്പിക്കുന്ന വിതരണാർത്ഥം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: אִמְרִי לִי
  choice: എന്നെക്കുറിച്ച് ... എന്നു പറയണം
  rationale: അക്ഷരാർഥത്തിലെ ‘എനിക്കായി/എന്നോടു പറയുക’ എന്നതിന് സന്ദർഭത്തിൽ മറ്റുള്ളവരോടു അബ്രാഹാമിനെക്കുറിച്ചു പറയുക എന്നാണ് അർത്ഥം.
- source_word: אָחִי הוּא
  choice: അവൻ എന്റെ സഹോദരനാണ്
  rationale: ആഖ്യാനത്തിന്റെ കേന്ദ്രത്തിലുള്ള ബന്ധാവകാശവാദം പൊതുവായ ‘ബന്ധു’ എന്നാക്കി മാറ്റാതെ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിന്റെ അലച്ചിലിന് കാരണമായ കർത്താവ്
  choice: ദൈവം അബ്രാഹാമിനെ പിതാവിന്റെ വീട്ടിൽനിന്ന് അലഞ്ഞുതിരിയുമാറാക്കി
  alternative: ദൈവം അബ്രാഹാമിനെ അലഞ്ഞുതിരിയാൻ അനുവദിച്ചു; അല്ലെങ്കിൽ ‘ദേവന്മാർ എന്നെ അലഞ്ഞുതിരിയുമാറാക്കി’
  rationale: എബ്രായം കാരണാർത്ഥമുള്ള ക്രിയ ഉപയോഗിക്കുന്നതിനാൽ ദൈവിക പ്രവർത്തനത്തെ ‘അനുവദിച്ചു’ എന്നു മൃദൂകരിക്കുന്നില്ല. אֱלֹהִים എന്നതിന് പിന്നാലെയുള്ള הִתְעוּ ബഹുവചനരൂപമായതിനാൽ ‘ദേവന്മാർ’ എന്ന വായന വ്യാകരണപരമായി സാധ്യമെങ്കിലും ഉല്പത്തി വിവരണത്തിന്റെ സന്ദർഭത്തിൽ ഏകവചനമായ ‘ദൈവം’ ആണ് പ്രധാനപാഠത്തിൽ കൂടുതൽ യോജിച്ചത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ദൈവിക കാരണത്വം മൃദൂകരിക്കാതെ നിലനിർത്തിയിരിക്കുന്നു; എബ്രായത്തിലെ ബഹുവചനക്രിയ സൃഷ്ടിക്കുന്ന യഥാർഥ വ്യാകരണപിരിമുറുക്ക് അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചിരിക്കുന്നു. ഉദ്ധരണിക്കുള്ളിലെ ഉദ്ധരണി വ്യക്തമായി വേർതിരിച്ചിരിക്കുന്നു.
