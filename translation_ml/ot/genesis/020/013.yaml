  terminology: ‘ദയ’ ഇവിടെ חֶסֶד-ന് സ്വാഭാവികമായ മുഖ്യപരിഭാഷയാണ്; അതിന്റെ വിശ്വസ്തത/ഉറച്ച സ്നേഹം എന്ന അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ ഉചിതമായി നൽകാം. ‘സഹോദരൻ’ നേരിട്ടും സന്ദർഭനിഷ്ഠവുമാണ്.
