  revised_text: 'ദൈവം എന്നെ എന്റെ പിതാവിന്റെ വീട്ടിൽനിന്ന് അലഞ്ഞുതിരിയുമാറാക്കിയപ്പോൾ[a], ഞാൻ അവളോടു പറഞ്ഞു: “നീ എന്നോടു കാണിക്കേണ്ട ദയ[b] ഇതാണ്: നാം ചെല്ലുന്ന എല്ലാ സ്ഥലത്തും, എന്നെക്കുറിച്ച്, ‘അവൻ എന്റെ സഹോദരനാണ്’ എന്നു പറയണം.”'
