  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣רְא יְהוָ֔ה כִּ֥י רַבָּ֛ה רָעַ֥ת הָ/אָדָ֖ם בָּ/אָ֑רֶץ וְ/כָל יֵ֨צֶר֙ מַחְשְׁבֹ֣ת לִבּ֔/וֹ רַ֥ק רַ֖ע כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/005.yaml
  text: And Yahweh saw that the wickedness of man was great on the earth[b][a], and that every inclination of the thoughts of his heart was only evil all the day.
translation:
  language: ml
  text: 'യഹ്‌വേ കണ്ടു: ഭൂമിയിൽ മനുഷ്യന്റെ ദുഷ്ടത വളരെ വലുതായിരുന്നു[a]; അവന്റെ ഹൃദയത്തിലെ ചിന്തകളുടെ എല്ലാ പ്രവണതയും ദിവസം മുഴുവനും ദോഷം മാത്രമായിരുന്നു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മനുഷ്യന്റെ’ എന്നത് ഇവിടെ മനുഷ്യവർഗത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന സമൂഹാർഥത്തിലുള്ള പ്രയോഗമാണ്. ‘ഭൂമിയിൽ മനുഷ്യവർഗത്തിന്റെ ദുഷ്ടത വളരെ വലുതായിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവന്റെ ഹൃദയത്തിലെ ചിന്തകളുടെ എല്ലാ പ്രവണതയും നിരന്തരം ദോഷം മാത്രമായിരുന്നു.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘ദിവസം മുഴുവനും’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടു
  rationale: വാവു-തുടർച്ചയുള്ള ഈ ആഖ്യാനക്രിയ കഥയുടെ പുരോഗതി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വാക്യക്രമവും സന്ദർഭവും ആ തുടർച്ച സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: רַבָּה רָעַת הָאָדָם
  choice: മനുഷ്യന്റെ ദുഷ്ടത വളരെ വലുതായിരുന്നു
  rationale: רַבָּה ഇവിടെ ധാർമിക ദുഷ്ടതയുടെ വ്യാപ്തിയും തീവ്രതയും സൂചിപ്പിക്കുന്നു. ‘വളരെ വലുതായിരുന്നു’ എന്നത് ‘പെരുകിയിരുന്നു’ എന്ന മാറ്റസൂചന അനാവശ്യമായി ചേർക്കാതെ ആശയം നിലനിർത്തുന്നു.
- source_word: הָאָדָם
  choice: മനുഷ്യൻ / മനുഷ്യന്റെ
  rationale: ഇവിടെ אָדָם മനുഷ്യവർഗത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്ന ഏകവചന പൊതുപദമാണ്. മലയാളത്തിലെ ‘മനുഷ്യൻ’ ആ പ്രതിനിധിക ഏകവചനം നിലനിർത്തുന്നു.
- source_word: בָּאָרֶץ
  choice: ഭൂമിയിൽ
  rationale: ആദിചരിത്രത്തിന്റെ ഈ സന്ദർഭത്തിൽ אֶרֶץ ഒരു പ്രത്യേക ദേശത്തേക്കാൾ ഭൂമിയെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- source_word: יֵצֶר
  choice: പ്രവണത
  rationale: മനുഷ്യന്റെ ഉള്ളിലെ ചിന്തകളെ രൂപപ്പെടുത്തുന്ന ചായ്‌വ്, ഉദ്ദേശപ്രേരണ എന്നിവയാണ് ഇവിടെ അർത്ഥം; ‘പ്രവണത’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מַחְשְׁבֹת לִבּוֹ
  choice: അവന്റെ ഹൃദയത്തിലെ ചിന്തകൾ
  rationale: എബ്രായ ധാരണയിൽ ഹൃദയം ചിന്ത, ഇച്ഛ, ആഗ്രഹം എന്നിവയുടെ ആന്തരിക കേന്ദ്രമാണ്. ‘മനസ്സ്’ എന്നു ചുരുക്കാതെ ‘ഹൃദയം’ നിലനിർത്തുന്നു.
- source_word: רַק רַע
  choice: ദോഷം മാത്രം
  rationale: רַק എന്ന നിയന്ത്രകപദത്തിന്റെ പൂർണമായ ഒഴിവാക്കൽഭാവം ‘മാത്രം’ വ്യക്തമായി നൽകുന്നു; רַע ധാർമിക ദോഷത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: כָּל הַיּוֹם
  choice: ദിവസം മുഴുവനും
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥമായ സമയപ്രയോഗം നിലനിർത്തുന്നു; ഇതിന് ‘എപ്പോഴും/നിരന്തരം’ എന്ന ആശയവ്യാപ്തിയും ഉണ്ടാകാം.
theological_decisions:
- issue: ദൈവനാമമായ יהוהയുടെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിനുപകരം പൊതുവെ അംഗീകരിക്കപ്പെടുന്ന ‘യഹ്‌വേ’ ഉച്ചാരണം സ്വീകരിച്ചു.
- issue: אָדָם എന്ന പദത്തിന്റെ സമൂഹാർഥം
  choice: മനുഷ്യൻ എന്ന പ്രതിനിധിക ഏകവചനം
  alternative: മനുഷ്യവർഗം; മനുഷ്യർ
  rationale: എബ്രായത്തിലെ ഏകവചന രൂപവും തുടർന്ന് വരുന്ന ‘അവന്റെ’ എന്ന ഏകവചന സർവനാമവും നിലനിർത്തുമ്പോഴും, ഇവിടെ മുഴുവൻ മനുഷ്യരെയും ഉദ്ദേശിക്കുന്നുവെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: כָּל הַיּוֹם എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: ദിവസം മുഴുവനും
  alternative: എപ്പോഴും; നിരന്തരം
  rationale: മൂലഭാഷയുടെ ദൃശ്യമായ സമയപ്രയോഗം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുകയും, തുടർച്ചയായ ദോഷപ്രവണത എന്ന സാധ്യമായ ആശയം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായവാക്യത്തിലെ ‘ഹൃദയം’, പ്രതിനിധിക ഏകവചനം, ‘ദിവസം മുഴുവനും’ എന്നീ ആശയരൂപങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്; വായനാസൗകര്യത്തിനായി കണ്ടതിന്റെ രണ്ടു ഘടകങ്ങൾ ദ്വിബിന്ദുവിനും അർധവിരാമത്തിനും ശേഷം ക്രമപ്പെടുത്തി.
