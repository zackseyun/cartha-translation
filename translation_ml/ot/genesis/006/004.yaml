id: GEN.6.4
reference: Genesis 6:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הַ/נְּפִלִ֞ים הָי֣וּ בָ/אָרֶץ֮ בַּ/יָּמִ֣ים הָ/הֵם֒ וְ/גַ֣ם אַֽחֲרֵי כֵ֗ן אֲשֶׁ֨ר יָבֹ֜אוּ בְּנֵ֤י הָֽ/אֱלֹהִים֙ אֶל בְּנ֣וֹת הָֽ/אָדָ֔ם וְ/יָלְד֖וּ לָ/הֶ֑ם הֵ֧מָּה הַ/גִּבֹּרִ֛ים אֲשֶׁ֥ר מֵ/עוֹלָ֖ם אַנְשֵׁ֥י הַ/שֵּֽׁם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/004.yaml
  text: The Nephilim were on the earth in those days—and also afterward—when the sons of God came in to the daughters of man[a], and they bore children to them. Those were the mighty men who were of old[c][b], men of renown.
translation:
  language: ml
  text: ആ കാലങ്ങളിൽ ഭൂമിയിൽ നെഫിലീമുകൾ ഉണ്ടായിരുന്നു[a]—അതിനു ശേഷവും—ദൈവത്തിന്റെ പുത്രന്മാർ[b] മനുഷ്യരുടെ പുത്രിമാരുടെ അടുക്കൽ ചെന്നു അവർക്കു മക്കളെ പ്രസവിച്ചപ്പോൾ. അവരാണു പുരാതനകാലത്തെ ശക്തരായ പുരുഷന്മാർ, പേരുകേട്ട പുരുഷന്മാർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി ‘ഭീമന്മാർ’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്. ‘നെഫിലീം’ എന്ന ഹീബ്രു പദം അപൂർവമാണ്; അതിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്.
    reason: alternative_reading
  - marker: b
    text: ‘ദൈവത്തിന്റെ പുത്രന്മാർ’ എന്നത് ‘ദൈവിക ജീവികൾ’ എന്നും മനസ്സിലാക്കാം; ചില വ്യാഖ്യാനങ്ങളിൽ അവർ മനുഷ്യ ഭരണാധികാരികളോ ശേത്തിന്റെ ദൈവഭക്ത വംശത്തിലെ പുരുഷന്മാരോ ആണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנְּפִלִים
  choice: നെഫിലീമുകൾ
  rationale: അപൂർവവും കൃത്യമായ അർഥം വിവാദവിധേയവുമായ പദമായതിനാൽ വ്യാഖ്യാനപരമായ ‘രാക്ഷസന്മാർ’ എന്ന പരിഭാഷയ്ക്കുപകരം ലിപ്യന്തരണം ചെയ്തു.
- source_word: בָאָרֶץ
  choice: ഭൂമിയിൽ
  rationale: ആദിചരിത്രത്തിന്റെ വിശാലമായ പശ്ചാത്തലത്തിൽ ‘ദേശത്ത്’ എന്നതിനെക്കാൾ ‘ഭൂമിയിൽ’ സ്വാഭാവികമാണ്.
- source_word: וְגַם אַחֲרֵי כֵן
  choice: അതിനു ശേഷവും ഉണ്ടായിരുന്നു
  rationale: ഹീബ്രുവിലെ കൂട്ടിച്ചേർക്കൽ-കാലസൂചന നിലനിർത്തി; മലയാളത്തിൽ മുൻക്രിയ ആവർത്തിച്ചിരിക്കുന്നത് ആശയം വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר יָבֹאוּ ... אֶל
  choice: അടുക്കൽ ചെല്ലുകയും ... ചെയ്തപ്പോൾ
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം അമിതമായി വിശദീകരിക്കാതെ, സന്ദർഭപരമായ കാലബന്ധവും ശിഷ്ടമായ ഭാഷയും നിലനിർത്തുന്നു.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പുത്രന്മാർ
  rationale: ദൈവിക ജീവികൾ, ഭരണാധികാരികൾ, ശേത്തിന്റെ വംശം എന്നീ വ്യാഖ്യാനങ്ങളിൽ ഒന്നിനെ തീർപ്പാക്കാതെ ഹീബ്രു പദപ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: בְּנוֹת הָאָדָם
  choice: മനുഷ്യരുടെ പുത്രിമാർ
  rationale: אָדָם എന്ന ഏകവചന കൂട്ടർഥത്തെ സ്വാഭാവിക മലയാളത്തിൽ ‘മനുഷ്യർ’ എന്നു വ്യക്തമാക്കി; ഇവിടെ മനുഷ്യസ്ത്രീകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְיָלְדוּ לָהֶם
  choice: അവർ അവർക്ക് മക്കളെ പ്രസവിക്കുകയും ചെയ്തു
  rationale: ഹീബ്രുവിൽ പരോക്ഷമായി ഉൾപ്പെട്ടിരിക്കുന്ന ‘മക്കൾ’ മലയാളത്തിൽ വ്യക്തമാക്കി, ‘അവർക്ക്’ എന്ന ബന്ധവും നിലനിർത്തി.
- source_word: הַגִּבֹּרִים
  choice: വീരന്മാർ
  rationale: ശക്തരും പ്രസിദ്ധരുമായ പുരുഷന്മാർ എന്ന വിശാലമായ അർഥം നൽകുന്നു; ‘യോദ്ധാക്കൾ’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: מֵעוֹלָם
  choice: പണ്ടുമുതലേ ഉണ്ടായിരുന്ന
  rationale: പുരാതനകാലത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אַנְשֵׁי הַשֵּׁם
  choice: പേരുകേട്ട പുരുഷന്മാർ
  rationale: ‘പേരുള്ള പുരുഷന്മാർ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ പ്രശസ്തി/കീർത്തി എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ പുത്രന്മാർ’ ആരെന്നത്
  choice: പ്രധാനപാഠത്തിൽ ‘ദൈവത്തിന്റെ പുത്രന്മാർ’ എന്നു നിലനിർത്തി.
  alternative: ദൈവിക ജീവികൾ; രാജകീയ ഭരണാധികാരികൾ; ശേത്തിന്റെ ദൈവഭക്ത വംശം
  rationale: ഈ സന്ദർഭത്തിലെ ഹീബ്രു പ്രയോഗം വ്യാഖ്യാനവിവാദമുള്ളതാണ്; പരിഭാഷ അതിനെ നിർണയിക്കാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: הַנְּפִלִים എന്നതിന്റെ അർഥം
  choice: ‘നെഫിലീമുകൾ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
  alternative: രാക്ഷസന്മാർ; വീണുപോയവർ
  rationale: പദത്തിന്റെ കൃത്യമായ അർഥവും വ്യുത്പത്തിയും അനിശ്ചിതമായതിനാൽ ഏതെങ്കിലും വ്യാഖ്യാനം പ്രധാനപാഠത്തിൽ അടിച്ചേൽപ്പിച്ചില്ല.
- issue: בְּנוֹת הָאָדָם എന്നതിലെ אָדָם
  choice: ‘മനുഷ്യരുടെ പുത്രിമാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: മനുഷ്യകുലത്തിന്റെ പുത്രിമാർ; മനുഷ്യസ്ത്രീകൾ
  rationale: കൂട്ടർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; പുരുഷന്മാരുടെ മാത്രം പുത്രിമാർ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ആഖ്യാനശൈലി. അപൂർവനാമം ലിപ്യന്തരിച്ചു; വിവാദപരമായ തിരിച്ചറിയലുകൾ പ്രധാനപാഠത്തിൽ പരിഹരിക്കാതെ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
