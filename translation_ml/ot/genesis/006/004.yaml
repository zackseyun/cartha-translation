revisions:
- from: ആ കാലത്ത് ഭൂമിയിൽ നെഫിലീമുകൾ ഉണ്ടായിരുന്നു[a]—അതിനു ശേഷവും ഉണ്ടായിരുന്നു—ദൈവത്തിന്റെ പുത്രന്മാർ[b] മനുഷ്യരുടെ പുത്രിമാരുടെ അടുക്കൽ ചെല്ലുകയും അവർ അവർക്ക് മക്കളെ പ്രസവിക്കുകയും ചെയ്തപ്പോൾ. അവരായിരുന്നു പണ്ടുമുതലേ ഉണ്ടായിരുന്ന വീരന്മാർ, പേരുകേട്ട പുരുഷന്മാർ.
  to: ആ കാലങ്ങളിൽ ഭൂമിയിൽ നെഫിലീമുകൾ ഉണ്ടായിരുന്നു[a]—അതിനു ശേഷവും—ദൈവത്തിന്റെ പുത്രന്മാർ[b] മനുഷ്യരുടെ പുത്രിമാരുടെ അടുക്കൽ ചെന്നു അവർക്കു മക്കളെ പ്രസവിച്ചപ്പോൾ. അവരാണു പുരാതനകാലത്തെ ശക്തരായ പുരുഷന്മാർ, പേരുകേട്ട പുരുഷന്മാർ.
  rationale: നെഫിലീം സംബന്ധിച്ച വിവാദം ലിപ്യന്തരണത്തിലൂടെയും അടിക്കുറിപ്പിലൂടെയും സംരക്ഷിച്ചിരിക്കുന്നു; ‘രാക്ഷസന്മാർ’ എന്ന അനാവശ്യ വ്യാഖ്യാനനിറം ‘ഭീമന്മാർ’ എന്നു തിരുത്തി. ‘പുരാതനകാലത്തെ’ എന്ന രൂപം מֵעוֹלָם-ന്റെ അർഥം കൃത്യമായി നൽകുന്നു. വാക്യഘടന മിനുക്കി, സ്ത്രീകൾ മക്കളെ പ്രസവിച്ചതും പുരുഷന്മാർക്ക് അവരോടുള്ള ബന്ധവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു. ‘ശക്തരായ പുരുഷന്മാർ’ ഗിബ്ബോരീം എന്ന പദത്തെ യുദ്ധവീരന്മാരിലേക്കോ ആദർശനായകന്മാരിലേക്കോ ചുരുക്കുന്നില്ല.
