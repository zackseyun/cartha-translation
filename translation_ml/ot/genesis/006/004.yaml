  revision_rationale: നെഫിലീം സംബന്ധിച്ച വിവാദം ലിപ്യന്തരണത്തിലൂടെയും അടിക്കുറിപ്പിലൂടെയും സംരക്ഷിച്ചിരിക്കുന്നു; ‘രാക്ഷസന്മാർ’ എന്ന അനാവശ്യ വ്യാഖ്യാനനിറം ‘ഭീമന്മാർ’ എന്നു തിരുത്തി. ‘പുരാതനകാലത്തെ’ എന്ന രൂപം מֵעוֹלָם-ന്റെ അർഥം കൃത്യമായി നൽകുന്നു. വാക്യഘടന മിനുക്കി, സ്ത്രീകൾ മക്കളെ പ്രസവിച്ചതും പുരുഷന്മാർക്ക് അവരോടുള്ള ബന്ധവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു. ‘ശക്തരായ പുരുഷന്മാർ’ ഗിബ്ബോരീം എന്ന പദത്തെ യുദ്ധവീരന്മാരിലേക്കോ ആദർശനായകന്മാരിലേക്കോ ചുരുക്കുന്നില്ല.
