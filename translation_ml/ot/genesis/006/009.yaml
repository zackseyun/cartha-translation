id: GEN.6.9
reference: Genesis 6:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֚לֶּה תּוֹלְדֹ֣ת נֹ֔חַ נֹ֗חַ אִ֥ישׁ צַדִּ֛יק תָּמִ֥ים הָיָ֖ה בְּ/דֹֽרֹתָ֑י/ו אֶת הָֽ/אֱלֹהִ֖ים הִֽתְהַלֶּךְ נֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/009.yaml
  text: These are the generations of Noah. Noah was a righteous man[a], blameless in his generation. Noah walked with God.
translation:
  language: ml
  text: 'നോഹയുടെ വംശചരിത്രം ഇതാണ്: നോഹ നീതിമാനായ ഒരു മനുഷ്യനായിരുന്നു; തന്റെ തലമുറകളിൽ[a] കുറ്റമറ്റവനായിരുന്നു. നോഹ ദൈവത്തോടുകൂടെ നടന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ സമകാലികരുടെ ഇടയിൽ’ അല്ലെങ്കിൽ ‘തന്റെ കാലത്ത്.’
    reason: ഹീബ്രായ പ്രയോഗമായ בְּדֹרֹתָיו എന്നതിന്റെ വ്യാഖ്യാനസാധ്യതകൾ രേഖപ്പെടുത്താൻ.
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת
  choice: വംശചരിത്രം ഇതാണ്
  rationale: ഉല്പത്തിയിലെ വിഭാഗങ്ങളെ ഘടിപ്പിക്കുന്ന תּוֹלְדֹת എന്ന മുഖ്യപദത്തിന്റെ വംശപരവും വിവരണാത്മകവുമായ ഭാവങ്ങൾ ഒരുമിച്ച് നിലനിർത്തുന്നു; സ്വാഭാവികമായ മലയാള ശീർഷകശൈലിയും നൽകുന്നു.
- source_word: נֹחַ
  choice: നോഹ
  rationale: മലയാളത്തിൽ പ്രചാരമുള്ള പേരുരൂപം.
- source_word: אִישׁ צַדִּיק
  choice: നീതിമാനായ ഒരു മനുഷ്യൻ
  rationale: പുരുഷനായ നോഹയെ സൂചിപ്പിക്കുന്ന אִישׁ എന്ന പദവും צַדִּיק എന്നതിന്റെ ധാർമിക-നീതിപരമായ ഭാരവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: תָּמִים
  choice: കുറ്റമറ്റവൻ
  rationale: സ്വഭാവത്തിലെ സമഗ്രതയും ആക്ഷേപത്തിന് ഇടനൽകാത്ത ജീവിതവും സൂചിപ്പിക്കുന്നു; സമ്പൂർണ പാപരാഹിത്യം അനാവശ്യമായി അവകാശപ്പെടുന്നില്ല.
- source_word: בְּדֹרֹתָיו
  choice: തന്റെ തലമുറകളിൽ
  rationale: ഹീബ്രായയിലെ ബഹുവചനരൂപം ഔപചാരികമായി നിലനിർത്തി, ‘സമകാലികരുടെ ഇടയിൽ’ എന്നും ‘അവന്റെ കാലത്ത്’ എന്നും മനസ്സിലാക്കാവുന്ന അർഥവ്യാപ്തി തുറന്നുവെക്കുന്നു.
- source_word: אֶת־הָאֱלֹהִים הִתְהַלֶּךְ
  choice: ദൈവത്തോടുകൂടെ നടന്നു
  rationale: ദൈവവുമായുള്ള ബന്ധത്തെയും ജീവിതരീതിയെയും സൂചിപ്പിക്കുന്ന ഹീബ്രായ രൂപകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: നോഹയെ വിവരിക്കുന്ന תָּמִים എന്ന പദത്തിന്റെ അർഥം
  choice: സ്വഭാവത്തിലെ സമഗ്രത സൂചിപ്പിക്കുന്ന ‘കുറ്റമറ്റവൻ’
  alternative: ‘പൂർണൻ’ അല്ലെങ്കിൽ ‘കളങ്കമില്ലാത്തവൻ’
  rationale: സന്ദർഭം ദുഷിച്ച തലമുറയ്ക്കു വിപരീതമായി നോഹയുടെ ജീവിതത്തെ പ്രശംസിക്കുന്നു; ഹീബ്രായം നിർബന്ധിക്കാത്ത സമ്പൂർണ പാപരാഹിത്യസിദ്ധാന്തം വിവർത്തനത്തിലേക്ക് കൊണ്ടുവരാതിരിക്കാൻ ഈ രൂപം സഹായിക്കുന്നു.
- issue: בְּדֹרֹתָיו എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: ‘തന്റെ തലമുറകളിൽ’ എന്നു മുഖ്യപാഠത്തിൽ നിലനിർത്തുക
  alternative: ‘തന്റെ സമകാലികരുടെ ഇടയിൽ’ അല്ലെങ്കിൽ ‘തന്റെ കാലത്ത്’
  rationale: പ്രയോഗത്തിലെ യഥാർഥ അവ്യക്തത പരിഹരിക്കാതെ നിലനിർത്തുന്നു; കൂടുതൽ സ്വാഭാവികമായ വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വംശചരിത്രം’ ഉല്പത്തിയിലെ ഘടനാപദത്തിന്റെ ബന്ധം സൂക്ഷിക്കുന്നു; ‘ദൈവത്തോടുകൂടെ നടന്നു’ എന്നത് പരിചിതമായ തിരുവെഴുത്തുരൂപകം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
