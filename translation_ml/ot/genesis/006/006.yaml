  text: וַ/יִּנָּ֣חֶם יְהוָ֔ה כִּֽי עָשָׂ֥ה אֶת הָֽ/אָדָ֖ם בָּ/אָ֑רֶץ וַ/יִּתְעַצֵּ֖ב אֶל לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/006.yaml
  text: And Yahweh regretted having made man on the earth[c][b][a], and he was pained in his heart.
translation:
  language: ml
  text: ഭൂമിയിൽ മനുഷ്യനെ[a] ഉണ്ടാക്കിയതിൽ യഹ്‌വെ ഖേദിച്ചു[b]; അവൻ തന്റെ ഹൃദയത്തിൽ[c] വേദനിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മനുഷ്യവർഗത്തെ” അല്ലെങ്കിൽ “മനുഷ്യരാശിയെ.” ഇവിടെ എബ്രായത്തിലെ ‘ആദാം’ മനുഷ്യവർഗത്തെ കൂട്ടായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഉണ്ടാക്കിയതിൽ ദുഃഖിച്ചു” അല്ലെങ്കിൽ “ഉണ്ടാക്കിയതിനെച്ചൊല്ലി വ്യസനിച്ചു.” എബ്രായക്രിയ മുമ്പ് ചെയ്ത പ്രവൃത്തിയെക്കുറിച്ചുള്ള ഖേദമോ ദുഃഖമോ പ്രകടിപ്പിക്കുന്നു; ദൈവം അപ്രതീക്ഷിതമായി എന്തെങ്കിലും അറിഞ്ഞെന്നോ, മുൻജ്ഞാനം ഇല്ലായിരുന്നെന്നോ, ധാർമ്മികമായി തെറ്റുചെയ്തെന്നോ ഈ ക്രിയ സ്വതവേ പറയുന്നില്ല.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ “തന്റെ ഹൃദയത്തിലേക്ക്”; ഇവിടെ ആന്തരികവും ഗാഢവുമായ വേദനയാണ് ഉദ്ദേശ്യം.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: ഖേദിച്ചു
  rationale: നിഫാൽ രൂപവും തുടർന്ന് വരുന്ന כִּי ആശയവാക്യവും ചേർന്ന്, മുമ്പ് ചെയ്ത പ്രവൃത്തിയെക്കുറിച്ചുള്ള പിന്തിരിഞ്ഞുനോക്കിയുള്ള ഖേദമോ ദുഃഖമോ പ്രകടിപ്പിക്കുന്നു. പിന്നാലെയുള്ള וַיִּתְעַצֵּב വേദനയെ വേറിട്ട് പറയുന്നതിനാൽ, രണ്ടു ക്രിയകളുടെയും വ്യത്യാസം നിലനിർത്താൻ ‘ഖേദിച്ചു’ തെരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ יהוה-യെ ‘Yahweh’ എന്ന പദ്ധതിയുടെ പതിവനുസരിച്ച് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: כִּי עָשָׂה
  choice: ഉണ്ടാക്കിയതിൽ
  rationale: മനുഷ്യനെ ഉണ്ടാക്കിയ മുൻപ്രവൃത്തിയാണ് ഖേദത്തിന്റെ വിഷയമെന്ന് സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; עָשָׂה എന്നത് ഇവിടെ ‘ഉണ്ടാക്കുക’ എന്നാണ്.
- source_word: הָאָדָם
  choice: മനുഷ്യനെ
  rationale: ഇവിടെ אָדָם ഒരു വ്യക്തിയായ ആദാമിനെ മാത്രമല്ല, മനുഷ്യവർഗത്തെ കൂട്ടായ അർഥത്തിൽ സൂചിപ്പിക്കുന്നു. ‘മനുഷ്യനെ’ എന്ന ഏകവചന കൂട്ടായ പ്രയോഗം എബ്രായരൂപവും മലയാളത്തിലെ സ്വാഭാവികതയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: בָּאָרֶץ
  choice: ഭൂമിയിൽ
  rationale: ഈ സന്ദർഭത്തിൽ ഒരു പ്രത്യേക ദേശത്തെയല്ല, ഭൂമിയെയോ ലോകത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּתְעַצֵּב
  choice: വേദനിച്ചു
  rationale: ഹിത്പയേൽ രൂപം ഉള്ളിലെ ആഴമുള്ള വേദനയെ സൂചിപ്പിക്കുന്നു. മുമ്പുള്ള ‘ഖേദിച്ചു’ എന്ന ക്രിയ ആവർത്തിക്കാതെ എബ്രായത്തിലെ രണ്ടുഘട്ടമായ ഖേദം—വേദന ഘടന സംരക്ഷിക്കുന്നു.
- source_word: אֶל־לִבּוֹ
  choice: തന്റെ ഹൃദയത്തിൽ
  rationale: אֶל എന്നതിന്റെ അക്ഷരാർഥം ‘-ലേക്ക്’ ആണെങ്കിലും, ഈ പ്രയോഗത്തിൽ ഉള്ളിലെ അനുഭവമാണ് ഉദ്ദേശ്യം. ‘തന്റെ ഹൃദയത്തിൽ’ ആന്തരിക വേദന സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: 'ദൈവത്തെക്കുറിച്ചുള്ള മനുഷ്യാനുഭവസദൃശ ഭാഷ: ‘ഖേദിച്ചു’, ‘വേദനിച്ചു’'
  choice: യഹ്‌വെ മനുഷ്യനെ ഉണ്ടാക്കിയതിൽ ഖേദിക്കുകയും ഹൃദയത്തിൽ വേദനിക്കുകയും ചെയ്തുവെന്ന് പാഠം നേരിട്ട് പറയുന്ന വിധം നിലനിർത്തി.
  alternative: ‘ദുഃഖിച്ചു’ എന്നു മാത്രം പറയുക, ‘തീരുമാനം മാറ്റി’ എന്നു വിവർത്തനം ചെയ്യുക, അല്ലെങ്കിൽ പ്രത്യക്ഷത്തിൽ ദുഃഖിച്ചതായി മൃദൂകരിക്കുക.
  rationale: ഈ വാക്യം ദൈവത്തിന്റെ മുൻജ്ഞാനം, ആശ്ചര്യം, അല്ലെങ്കിൽ ധാർമ്മിക പിഴവ് എന്നിവയെക്കുറിച്ച് വിശദീകരിക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ തീർപ്പാക്കാതെ, ഖേദവും ആന്തരിക വേദനയും നേരിട്ട് നിലനിർത്തി; ആവശ്യമായ പരിധിവ്യക്തീകരണം അടിക്കുറിപ്പിൽ നൽകി.
- issue: הָאָדָם എന്നതിന്റെ കൂട്ടായ അർഥം
  choice: ‘മനുഷ്യനെ’ എന്ന ഏകവചന കൂട്ടായ രൂപം ഉപയോഗിച്ചു.
  alternative: ‘മനുഷ്യവർഗത്തെ’ അല്ലെങ്കിൽ ‘മനുഷ്യരാശിയെ’.
  rationale: സന്ദർഭം മുഴുവൻ മനുഷ്യവർഗത്തെയാണ് ഉദ്ദേശിക്കുന്നത്. അതേസമയം എബ്രായത്തിലെ ഏകവചന പ്രതിനിധിരൂപം നിലനിർത്താൻ മുഖ്യപാഠത്തിൽ ‘മനുഷ്യനെ’ ഉപയോഗിച്ച് കൂട്ടായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഖേദിച്ചു’ എന്നും ‘വേദനിച്ചു’ എന്നും രണ്ടു വ്യത്യസ്ത ക്രിയകൾ ഉപയോഗിച്ച് എബ്രായത്തിലെ രണ്ടു ഘട്ടങ്ങൾ സംരക്ഷിച്ചു. ദൈവനാമം ‘യഹ്‌വെ’ എന്ന് ലിപ്യന്തരിച്ചു; ‘മനുഷ്യനെ’ കൂട്ടായ അർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു.
