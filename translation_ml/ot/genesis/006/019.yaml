source:
  edition: WLC
  text: וּ/מִ/כָּל הָ֠/חַי מִֽ/כָּל בָּשָׂ֞ר שְׁנַ֧יִם מִ/כֹּ֛ל תָּבִ֥יא אֶל הַ/תֵּבָ֖ה לְ/הַחֲיֹ֣ת אִתָּ֑/ךְ זָכָ֥ר וּ/נְקֵבָ֖ה יִֽהְיֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/019.yaml
  text: And from every living thing of all flesh[a], you shall bring two of each into the ark to keep them alive with you[b]; they shall be male and female.
translation:
  language: ml
  text: സകല ജഡത്തിലുള്ള ഓരോ ജീവജാലത്തിൽനിന്നും[a] രണ്ടെണ്ണം അവയെ നിന്നോടൊപ്പം ജീവനോടെ കാത്തുസൂക്ഷിക്കേണ്ടതിന്[b] പെട്ടകത്തിലേക്കു നീ കൊണ്ടുവരണം; അവ ആണും പെണ്ണും ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ജീവനുള്ളത്.” എബ്രായത്തിലെ പദം വിശാലമായി ജീവനുള്ള എന്തിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “സകല ജഡം” ശരീരമുള്ള ജീവികളെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִכָּל הַחַי מִכָּל בָּשָׂר
  choice: സകല ജഡത്തിൽപ്പെട്ട ജീവികളിൽനിന്നും
  rationale: ‘ജീവനുള്ളത്’ എന്ന വിശാല ആശയവും ‘സകല ജഡം’ എന്ന എബ്രായ പ്രയോഗവും ഒരുമിച്ചു നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ആണും പെണ്ണും എന്നു തുടർന്നുവരുന്നതിനാൽ ‘ജീവികൾ’ സ്വാഭാവികമാണ്; ‘സകല ജഡം’ എന്ന മൂലപ്രയോഗം കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: שְׁנַיִם מִכֹּל
  choice: ഓരോന്നിൽ ഈരണ്ടിനെ
  rationale: ഓരോ വിഭാഗത്തിൽനിന്നും രണ്ടെണ്ണം എന്ന വിതരണാർഥം വ്യക്തമായി നൽകുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘ഇനം’ എന്ന പദം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: תָּבִיא אֶל הַתֵּבָה
  choice: നീ പെട്ടകത്തിനകത്തേക്കു കൊണ്ടുവരണം
  rationale: നിർദേശാത്മകമായ ക്രിയാഭാവവും പെട്ടകത്തിന്റെ ഉള്ളിലേക്കുള്ള ചലനവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְהַחֲיֹת אִתָּךְ
  choice: നിന്നോടൊപ്പം അവയെ ജീവനോടെ കാത്തുസൂക്ഷിക്കാനാണിത്
  rationale: ഹിഫീൽ ക്രിയയുടെ ‘ജീവൻ നിലനിർത്തുക’ എന്ന കാരണാർത്ഥവും אִתָּךְ എന്ന സഹവാസാർത്ഥവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: זָכָר וּנְקֵבָה יִהְיוּ
  choice: അവ ആണും പെണ്ണുമായിരിക്കണം
  rationale: ജൈവലിംഗത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പദജോടിയും നിർദേശത്തിന്റെ ആവശ്യകതയും നേരിട്ട് നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി സ്വീകരിച്ചു. ‘പെട്ടകം’ എന്ന സ്ഥാപിത ബൈബിൾപദം നിലനിർത്തി; മൂലത്തിൽ നേരിട്ട് ഇല്ലാത്ത ‘ഇനം’ പോലുള്ള വർഗീകരണപദങ്ങൾ ഒഴിവാക്കി.
