id: GEN.6.13
reference: Genesis 6:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים לְ/נֹ֗חַ קֵ֤ץ כָּל בָּשָׂר֙ בָּ֣א לְ/פָנַ֔/י כִּֽי מָלְאָ֥ה הָ/אָ֛רֶץ חָמָ֖ס מִ/פְּנֵי/הֶ֑ם וְ/הִנְ/נִ֥י מַשְׁחִיתָ֖/ם אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/013.yaml
  text: Then God said to Noah[a], “The end of all flesh has come before me, for the earth is filled with violence because of them. And behold[d][c][b], I am about to destroy them with the earth.”
translation:
  language: ml
  text: 'അപ്പോൾ ദൈവം നോഹയോടു പറഞ്ഞു: “സകല ജഡത്തിന്റെയും അന്ത്യം എന്റെ മുമ്പിൽ വന്നിരിക്കുന്നു; അവരുടെ നിമിത്തം ഭൂമി അക്രമംകൊണ്ടു നിറഞ്ഞിരിക്കുന്നു. ഇതാ, ഞാൻ അവരെയും ഭൂമിയെയും നശിപ്പിക്കാൻ പോകുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘അവരെ നശിപ്പിക്കുന്നു’ എന്നതിന് ശേഷം ‘ഭൂമി’ക്ക് മുമ്പ് സാധാരണ നേരിട്ടുള്ള കർമസൂചകം വരുന്നതിനാൽ ഘടന ദുഷ്കരമാണ്. ഇതിനെ ‘അവരെയും ഭൂമിയെയും നശിപ്പിക്കുന്നു’ എന്നും ‘ഭൂമിയോടൊപ്പം അവരെ നശിപ്പിക്കുന്നു’ എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: קֵץ כָּל־בָּשָׂר
  choice: സകല ജഡത്തിന്റെയും അന്ത്യം
  rationale: ‘ജഡം’ എന്നത് മനുഷ്യരിൽ മാത്രം ഒതുക്കാതെ പ്രളയസന്ദർഭത്തിലെ ജീവജാലങ്ങളുടെ വിശാല പരിധിയും മൂലപാഠത്തിന്റെ പരമ്പരാഗത പ്രതിധ്വനിയും നിലനിർത്തുന്നു; קֵץ ഇവിടെ അവസാനത്തെയോ നിശ്ചയിക്കപ്പെട്ട അന്ത്യത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: בָּא לְפָנַי
  choice: എന്റെ മുമ്പിൽ വന്നിരിക്കുന്നു
  rationale: ദൈവത്തിന്റെ മുമ്പാകെ ന്യായവിധിക്കായി കാര്യം എത്തിയെന്ന ന്യായാധിപത്യസൂചനയുള്ള എബ്രായ ദൃശ്യഭാഷ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מָלְאָה הָאָרֶץ חָמָס
  choice: ഭൂമി അക്രമംകൊണ്ടു നിറഞ്ഞിരിക്കുന്നു
  rationale: חָמָס ക്രൂരമായ അക്രമം, അതിക്രമം, അനീതി എന്നിവ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ ‘അക്രമം’ നേരിട്ടും വ്യാപകവുമായ അർത്ഥം നൽകുന്നു. പ്രളയവിവരണത്തിന്റെ വിശാല പരിധിക്കനുസരിച്ച് הָאָרֶץ എന്നത് ‘ഭൂമി’യായി പരിഭാഷപ്പെടുത്തി.
- source_word: מִפְּנֵיהֶם
  choice: അവർ നിമിത്തം
  rationale: ഇവിടെ പ്രയോഗം കാരണാർഥകമാണ്; അക്രമം ഭൂമിയിൽ നിറഞ്ഞതിന്റെ ഉത്തരവാദിത്വം അവർക്കാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וְהִנְנִי מַשְׁחִיתָם
  choice: ഇതാ, ഞാൻ അവരെ … നശിപ്പിക്കാൻ പോകുന്നു
  rationale: הִנְנִי നൽകുന്ന ഊന്നലും തുടർന്നുള്ള പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന ആസന്നപ്രവൃത്തിയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אֶת־הָאָרֶץ
  choice: ഭൂമിയെയും
  rationale: മുമ്പുള്ള ‘അവരെ’ എന്ന കർമത്തോടൊപ്പം ‘ഭൂമി’യെ രണ്ടാമത്തെ കർമമായി വായിക്കുന്നു. ഇതിലൂടെ മലയാളത്തിൽ ഉപകരണാർഥകമായ തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു; എങ്കിലും എബ്രായ ഘടനയുടെ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ‘സകല ജഡം’ എന്നതിന്റെ പരിധി
  choice: മനുഷ്യരിൽ മാത്രം ഒതുങ്ങാത്ത, ന്യായവിധിക്കു വിധേയമായ ജീവജാലങ്ങളുടെ വിശാല വിഭാഗം
  alternative: മുഴുവൻ മനുഷ്യവർഗം മാത്രം
  rationale: പ്രളയവിവരണത്തിൽ כָּל־בָּשָׂר സാധാരണയായി മനുഷ്യരെക്കാൾ വിശാലമായ പരിധിയിലാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ പാഠത്തെ നേരത്തേ ചുരുക്കാതെ ‘സകല ജഡം’ നിലനിർത്തി.
- issue: הָאָרֶץ എന്നതിന്റെ അർത്ഥം
  choice: ഭൂമി
  alternative: ദേശം / നിലം
  rationale: പ്രളയവിവരണത്തിന്റെ സർവവ്യാപകമായ ചട്ടക്കൂടിൽ ‘ഭൂമി’ അനുയോജ്യമാണ്; എങ്കിലും പദത്തിന് ‘ദേശം’ എന്ന അർത്ഥസാധ്യത മറ്റുസന്ദർഭങ്ങളിൽ ഉണ്ടാകാം.
- issue: אֶת־הָאָרֶץ എന്ന ദുഷ്കര ഘടന
  choice: ‘അവരെയും ഭൂമിയെയും’—ഭൂമിയെ രണ്ടാമത്തെ കർമമായി മനസ്സിലാക്കുന്നു
  alternative: ‘ഭൂമിയോടൊപ്പം അവരെ’ അല്ലെങ്കിൽ അക്ഷരാർഥത്തിൽ ‘ഭൂമിയുമായി അവരെ’
  rationale: എബ്രായത്തിൽ ‘അവരെ നശിപ്പിക്കുന്നു’ എന്നതിന് ശേഷം നേരിട്ടുള്ള കർമസൂചകത്തോടുകൂടെ ‘ഭൂമി’ വരുന്നത് വ്യാഖ്യാനപരമായി ദുഷ്കരമാണ്. മുഖ്യപാഠത്തിൽ വ്യക്തമായ മലയാളരൂപം സ്വീകരിച്ചെങ്കിലും യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സകല ജഡം’, ‘എന്റെ മുമ്പിൽ വന്നിരിക്കുന്നു’, ‘ഇതാ’ എന്നീ രൂപങ്ങൾ മൂലപാഠത്തിന്റെ ദൃശ്യഭാഷയും solemn register-ഉം നിലനിർത്തുന്നു; ദുഷ്കരമായ അവസാന ഘടന വായനാസൗകര്യത്തിനായി മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടും അടിക്കുറിപ്പിലൂടെ അനിശ്ചിതത്വം സംരക്ഷിച്ചിരിക്കുന്നു.
