id: GEN.6.17
reference: Genesis 6:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנְ/נִי֩ מֵבִ֨יא אֶת הַ/מַּבּ֥וּל מַ֨יִם֙ עַל הָ/אָ֔רֶץ לְ/שַׁחֵ֣ת כָּל בָּשָׂ֗ר אֲשֶׁר בּ/וֹ֙ ר֣וּחַ חַיִּ֔ים מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם כֹּ֥ל אֲשֶׁר בָּ/אָ֖רֶץ יִגְוָֽע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/017.yaml
  text: And I—behold[a], I am bringing the flood of waters upon the earth to destroy all flesh in which is the breath of life from under heaven. Everything that is on the earth will perish.
translation:
  language: ml
  text: ഞാനോ—ഇതാ, ആകാശത്തിനുകീഴെ ജീവശ്വാസമുള്ള[a] സകല ജഡത്തെയും നശിപ്പിക്കാൻ ഭൂമിക്കുമേൽ ജലപ്രളയം വരുത്തുന്നു. ഭൂമിയിലുള്ള സകലവും മരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ജീവശ്വാസം” എന്നതിന് “ജീവന്റെ ആത്മാവ്” എന്നും പരിഭാഷപ്പെടുത്താം. רוּחַ എന്ന ഹീബ്രു പദത്തിന് “ശ്വാസം,” “കാറ്റ്,” “ആത്മാവ്” എന്നീ അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנְנִי
  choice: ഞാനോ—ഇതാ
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നലും הִנְנִי നൽകുന്ന ഗൗരവവും തത്സമയഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מֵבִיא
  choice: വരുത്തുന്നു
  rationale: ഹീബ്രു കൃദന്തം സൂചിപ്പിക്കുന്ന ആസന്നമായ പ്രവൃത്തിയെ അധികമായി വ്യാഖ്യാനിക്കാതെ അവതരിപ്പിക്കുന്നു.
- source_word: הַמַּבּוּל מַיִם
  choice: ജലപ്രളയം
  rationale: מַבּוּל എന്ന പ്രളയപദത്തോടൊപ്പം വരുന്ന מַיִם എന്ന ജലഘടകം ചുരുക്കമായും സ്വാഭാവികമായും സംരക്ഷിക്കുന്നു.
- source_word: עַל הָאָרֶץ
  choice: ഭൂമിയുടെമേൽ
  rationale: പ്രളയവിവരണത്തിലെ വിശാലമായ വ്യാപ്തിക്ക് ‘ദേശം’ എന്നതിനെക്കാൾ ‘ഭൂമി’ യോജിക്കുന്നു.
- source_word: לְשַׁחֵת
  choice: നശിപ്പിക്കേണ്ടതിന്
  rationale: ലാമെദ് ചേർന്ന infinitive-ന്റെ ഉദ്ദേശ്യാർഥം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כָּל בָּשָׂר
  choice: സകല ജഡത്തെയും
  rationale: പ്രധാന ബൈബിൾ പ്രയോഗമായ ‘സകല ജഡം’ എന്ന രൂപം വ്യാഖ്യാനപരമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר בּוֹ רוּחַ חַיִּים
  choice: ജീവശ്വാസമുള്ള
  rationale: ജീവികളെ സജീവമാക്കുന്ന ശ്വാസം എന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു; רוּחַ എന്ന പദത്തിന്റെ ‘ആത്മാവ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: ആകാശത്തിനുകീഴെ
  rationale: ആകാശത്തിന്റെ കീഴിലുള്ള സമഗ്ര മേഖലയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כֹּל אֲשֶׁר בָּאָרֶץ
  choice: ഭൂമിയിലുള്ള സകലവും
  rationale: സമഗ്രമായ വിധിപ്രഖ്യാപനത്തിന്റെ ആകെത്തുക സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: יִגְוָע
  choice: ചത്തുപോകും
  rationale: ശ്വാസം നിലച്ച് മരിക്കുക എന്ന ക്രിയയുടെ നേരിട്ടുള്ള മരണാർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: רוּחַ חַיִּים എന്നതിലെ רוּחַ-യുടെ അർഥം
  choice: ജീവശ്വാസം
  alternative: ജീവാത്മാവ്
  rationale: പ്രളയസന്ദർഭത്തിലും ഉല്പത്തി 2:7; 7:22 എന്നിവയുമായുള്ള ബന്ധത്തിലും ജീവനെ നിലനിർത്തുന്ന ശ്വാസം എന്ന അർഥമാണ് കൂടുതൽ സ്വാഭാവികം. എന്നാൽ ‘ആത്മാവ്’ എന്ന യഥാർഥ പദസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം; വിധിപ്രഖ്യാപനത്തിന്റെ ഗൗരവം നിലനിർത്താൻ ‘ഇതാ,’ ‘സകല ജഡം,’ ‘ജലപ്രളയം’ എന്നീ ഉയർന്നെങ്കിലും ഗ്രാഹ്യമായ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട ‘ജീവശ്വാസം’ എന്ന പദത്തിനരികിലല്ലാതെ വാക്യാവസാനത്തേക്ക് പോകരുതെന്നതിനാൽ പ്രസിദ്ധീകരണക്രമത്തിൽ അത് ആ പദത്തോടു ചേർക്കണം.
