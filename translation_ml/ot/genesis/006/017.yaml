revisions:
- from: ഞാനോ—ഇതാ, ആകാശത്തിനുകീഴെ ജീവശ്വാസമുള്ള സകല ജഡത്തെയും നശിപ്പിക്കേണ്ടതിന് ഭൂമിയുടെമേൽ ജലപ്രളയം വരുത്തുന്നു. ഭൂമിയിലുള്ള സകലവും ചത്തുപോകും.[a]
