id: GEN.6.1
reference: Genesis 6:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּֽי הֵחֵ֣ל הָֽ/אָדָ֔ם לָ/רֹ֖ב עַל פְּנֵ֣י הָֽ/אֲדָמָ֑ה וּ/בָנ֖וֹת יֻלְּד֥וּ לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/001.yaml
  text: And it happened[a], when man began to multiply on the face of the ground, and daughters were born to them,
translation:
  language: ml
  text: മനുഷ്യർ ഭൂമുഖത്ത് പെരുകാൻ തുടങ്ങുകയും അവർക്കു പെൺമക്കൾ ജനിക്കുകയും ചെയ്തപ്പോൾ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: —പ്പോൾ
  rationale: വിവരണത്തിൽ ഒരു പുതിയ സംഭവവികാസം അവതരിപ്പിക്കുന്ന וַיְהִיയും അതിനെ തുടർന്നുള്ള കാലസൂചകമായ כִּיയും സ്വാഭാവിക മലയാളത്തിൽ കാലവാക്യമായ ‘—പ്പോൾ’ എന്നു ചേർത്തു പരിഭാഷപ്പെടുത്തി.
- source_word: הֵחֵל
  choice: തുടങ്ങിയ
  rationale: ഈ നിർമാണത്തിൽ ക്രിയയുടെ അർഥം ‘ആരംഭിക്കുക’ എന്നാണ്; മലയാളത്തിലെ സ്വാഭാവിക കാലവാക്യഘടനയ്ക്കായി ‘തുടങ്ങിയപ്പോൾ’ എന്നു നൽകി.
- source_word: הָאָדָם
  choice: മനുഷ്യർ
  rationale: ഹീബ്രുവിൽ ഏകവചനരൂപമാണെങ്കിലും ഇവിടെ ഒരു വ്യക്തിയായ ആദാമിനെയല്ല, മനുഷ്യസമൂഹത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന സമാഹാരപ്രയോഗമാണ്. മലയാളത്തിൽ ഈ അർഥം സ്വാഭാവികമായും വ്യക്തമായും നൽകുന്നത് ‘മനുഷ്യർ’ ആണ്.
- source_word: לָרֹב
  choice: പെരുകാൻ
  rationale: എണ്ണത്തിൽ വർധിക്കുക എന്ന ജനസംഖ്യാവളർച്ചയുടെ ആശയം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: ഭൂമുഖത്ത്
  rationale: ‘നിലത്തിന്റെ മുഖത്തിന്മേൽ’ എന്ന ഹീബ്രു ദൃശ്യരൂപം മലയാളത്തിലെ പതിവും ഗൗരവമുള്ളതുമായ ‘ഭൂമുഖത്ത്’ എന്ന പ്രയോഗത്തിൽ നിലനിർത്തുന്നു.
- source_word: וּבָנוֹת יֻלְּדוּ לָהֶם
  choice: അവർക്കു പെൺമക്കൾ ജനിച്ചു
  rationale: പെൺമക്കൾ മനുഷ്യസമൂഹത്തിനുണ്ടായി എന്ന ഹീബ്രു നിഷ്ക്രിയ നിർമാണത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: הָאָדָם എന്ന പദത്തിന്റെ പൊതുമാനവിക അർഥം
  choice: മനുഷ്യർ
  alternative: മനുഷ്യൻ
  rationale: ഇവിടെ പദം വ്യാകരണപരമായി ഏകവചനമാണെങ്കിലും സമാഹാരാർഥത്തിൽ മുഴുവൻ മനുഷ്യരെയും സൂചിപ്പിക്കുന്നു. ‘മനുഷ്യൻ’ ഒരു വ്യക്തിയെയോ പുരുഷനെ മാത്രമോ സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കപ്പെടാൻ ഇടയുള്ളതിനാൽ, മൂലത്തിലെ പൊതുമാനവിക അർഥം ‘മനുഷ്യർ’ എന്ന് വ്യക്തമായി നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന, ഗൗരവമുള്ള മലയാളം. ഹീബ്രുവിലെ നീണ്ട ഏകവാക്യഘടനയും തുടർവാക്യത്തിലേക്കുള്ള തുറന്ന നീക്കവും നിലനിർത്താൻ ഒറ്റവാക്യമായി നൽകി.
