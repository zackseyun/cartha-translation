id: GEN.6.14
reference: Genesis 6:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עֲשֵׂ֤ה לְ/ךָ֙ תֵּבַ֣ת עֲצֵי גֹ֔פֶר קִנִּ֖ים תַּֽעֲשֶׂ֣ה אֶת הַ/תֵּבָ֑ה וְ/כָֽפַרְתָּ֥ אֹתָ֛/הּ מִ/בַּ֥יִת וּ/מִ/ח֖וּץ בַּ/כֹּֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/014.yaml
  text: Make yourself an ark of gopher wood[a]; make rooms in the ark[c][b], and cover it inside and outside with pitch.
translation:
  language: ml
  text: നിനക്കായി ഗോഫെർ മരംകൊണ്ട് ഒരു പെട്ടകം ഉണ്ടാക്കുക[a]. പെട്ടകത്തിൽ അറകൾ ഉണ്ടാക്കുക[b]; അതിന്റെ അകത്തും പുറത്തും കീൽ പൂശുക[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സൈപ്രസ് മരം.’ ‘ഗോഫെർ’ എന്ന എബ്രായപദം ഇവിടെ മാത്രമേ കാണപ്പെടുന്നുള്ളൂ; അതിനാൽ കൃത്യമായ മരയിനം ഏതെന്നത് അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വിഭാഗങ്ങൾ’; അക്ഷരാർഥം ‘കൂടുകൾ.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘ബിറ്റുമെൻ/താർകൊണ്ട് പൊതിയുക’ അല്ലെങ്കിൽ ‘അടച്ചുറപ്പിക്കുക.’ പൂശുന്ന പ്രവൃത്തിക്കും പൂശുപദാർഥത്തിനും എബ്രായത്തിൽ പരസ്പരം ബന്ധപ്പെട്ട പദങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: നിനക്കായി … ഉണ്ടാക്കുക
  rationale: ആജ്ഞാരൂപത്തോടു ചേർന്ന לְךָ എന്നത് ‘നിനക്കായി’ എന്ന സ്വാഭാവിക അർഥത്തിൽ നൽകി; ‘പണിയുക’ എന്നതിനെക്കാൾ വിശാലമായ עשה എന്ന ക്രിയയ്ക്ക് ‘ഉണ്ടാക്കുക’ യോജിക്കുന്നു.
- source_word: תֵּבַת
  choice: പെട്ടകം
  rationale: ഇത് സാധാരണ കപ്പലിനുള്ള പദമല്ല; പെട്ടിപോലുള്ള വലിയ ജലയാനത്തെയും പുറപ്പാട് 2-ലെ ചെറുപെട്ടിയെയും ബന്ധിപ്പിക്കുന്ന വ്യത്യസ്ത എബ്രായ പദമാണ്. മലയാള ബൈബിൾ പ്രയോഗത്തിൽ ‘പെട്ടകം’ ഈ ബന്ധം നിലനിർത്തുന്നു.
- source_word: עֲצֵי גֹפֶר
  choice: ഗോഫെർ മരം
  rationale: גֹפֶר ഇവിടെ മാത്രമേ കാണപ്പെടുന്നുള്ളൂ; മരയിനം ഉറപ്പില്ലാത്തതിനാൽ അനുമാനപരമായ ‘സൈപ്രസ്’ എന്നതിനുപകരം ശബ്ദാന്തരണം നൽകി.
- source_word: קִנִּים
  choice: അറകൾ
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘കൂടുകൾ’ ആണെങ്കിലും ഇവിടെ പെട്ടകത്തിനുള്ളിലെ വിഭജിത ഇടങ്ങളാണ് ഉദ്ദേശ്യം; ‘അറകൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וְכָפַרְתָּ … בַּכֹּפֶר
  choice: കീൽ പൂശുക
  rationale: ബന്ധപ്പെട്ട ക്രിയയും നാമവും യഥാക്രമം മൂടുക/പൂശുക എന്ന പ്രവൃത്തിയെയും ജലനിരോധക പൂശുപദാർഥത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കീൽ പൂശുക’ ഈ നിർമാണസന്ദർഭം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מִבַּיִת וּמִחוּץ
  choice: അകത്തും പുറത്തും
  rationale: പെട്ടകത്തിന്റെ ഉള്ളിലെയും പുറത്തിലെയും ഉപരിതലങ്ങൾ രണ്ടും പൂശണമെന്ന അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാശൈലി സ്വീകരിച്ചു. അപൂർവമായ മരപ്പേര് ശബ്ദാന്തരിച്ചു; സാങ്കേതികമല്ലാത്ത പ്രധാനപാഠത്തോടൊപ്പം അനിശ്ചിതത്വങ്ങളും പദവികല്പങ്ങളും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
