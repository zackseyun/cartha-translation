  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זֶ֕ה אֲשֶׁ֥ר תַּֽעֲשֶׂ֖ה אֹתָ֑/הּ שְׁלֹ֧שׁ מֵא֣וֹת אַמָּ֗ה אֹ֚רֶךְ הַ/תֵּבָ֔ה חֲמִשִּׁ֤ים אַמָּה֙ רָחְבָּ֔/הּ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/015.yaml
  text: 'And this is how you shall make it: the length of the ark shall be three hundred cubits[a], its width fifty cubits, and its height thirty cubits.'
translation:
  language: ml
  text: 'നീ അതു ഉണ്ടാക്കേണ്ടത് ഇങ്ങനെയാണ്: പെട്ടകത്തിന്റെ നീളം മുന്നൂറു മുഴം[a], അതിന്റെ വീതി അമ്പതു മുഴം, അതിന്റെ ഉയരം മുപ്പതു മുഴം ആയിരിക്കണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മുഴം എന്നത് മുട്ടുകൈ മുതൽ വിരൽത്തുമ്പുകൾ വരെയുള്ള ദൂരത്തോട് ഏകദേശം തുല്യമായ ഒരു പുരാതന നീളയളവായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְזֶה אֲשֶׁר תַּעֲשֶׂה אֹתָהּ
  choice: അത് ഉണ്ടാക്കേണ്ടത് ഇങ്ങനെയാണ്
  rationale: നിർമാണരീതി വ്യക്തമാക്കുന്ന എബ്രായപ്രയോഗത്തിന്റെ നിർദേശാത്മക ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַתֵּבָה
  choice: പെട്ടകം
  rationale: നോഹയുടെ ജലയാനത്തെ സൂചിപ്പിക്കുന്ന תֵּבָה എന്ന പദത്തിന് മലയാള ബൈബിൾഭാഷയിൽ സ്ഥാപിതവും സന്ദർഭോചിതവുമായ പദം.
- source_word: שְׁלֹשׁ מֵאוֹת אַמָּה
  choice: മുന്നൂറു മുഴം
  rationale: പുരാതന അളവായ אַמָּהയെ ആധുനിക അളവിലേക്കു മാറ്റാതെ, മലയാളത്തിൽ പരമ്പരാഗതമായി ഉപയോഗിക്കുന്ന 'മുഴം' എന്നു നൽകുന്നു.
- source_word: אֹרֶךְ הַתֵּבָה
  choice: പെട്ടകത്തിന്റെ നീളം
  rationale: എബ്രായത്തിലെ അളവുവിവരണം വ്യക്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: חֲמִשִּׁים אַמָּה רָחְבָּהּ
  choice: വീതി അമ്പതു മുഴം
  rationale: വാസ്തുനിർമാണസന്ദർഭത്തിൽ רָחְבָּהּ എന്നതിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക തത്തുല്യം 'വീതി' ആണ്.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתָהּ
  choice: ഉയരം മുപ്പതു മുഴം
  rationale: നിർമാണത്തിന്റെ ലംബമായ അളവിനെ സൂചിപ്പിക്കുന്ന קוֹמָהയ്ക്ക് സന്ദർഭോചിതമായ തത്തുല്യം 'ഉയരം' ആണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും ഗൗരവമുള്ളതുമായ ശൈലി. അളവുകളുടെ പട്ടികയിൽ എബ്രായത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തിക്കൊണ്ട് മലയാളവാക്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി അവസാനം 'ആയിരിക്കണം' ചേർത്തിരിക്കുന്നു.
