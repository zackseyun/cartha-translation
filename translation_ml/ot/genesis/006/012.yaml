  yaml_path: translation/ot/genesis/006/012.yaml
  text: And God saw the earth[a], and behold, it was corrupted[b], because all flesh had corrupted its way on the earth.
translation:
  language: ml
  text: ദൈവം ഭൂമിയെ കണ്ടു; ഇതാ, അതു നശിച്ചുപോയിരുന്നു[a], കാരണം സകല ജഡവും ഭൂമിയിൽ തങ്ങളുടെ വഴിയെ നശിപ്പിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദുഷിച്ചുപോയിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയ ധാർമ്മിക ദുഷിപ്പിനെയും നാശത്തെയോ തകർച്ചയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: നോക്കി
  rationale: ראה എന്ന ക്രിയയുടെ ലളിതമായ ദർശനാർഥം നിലനിർത്തുകയും മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഈ സന്ദർഭത്തിൽ ഏകസത്യദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവികമായ പദം.
- source_word: הָאָרֶץ
  choice: ഭൂമി
  rationale: പ്രളയവിവരണത്തിന്റെ വിപുലമായ പശ്ചാത്തലത്തിന് ‘ദേശം’ എന്നതിനെക്കാൾ ‘ഭൂമി’ യോജിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: കാണപ്പെട്ട അവസ്ഥയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സജീവതയും ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: נִשְׁחָתָה
  choice: നശിച്ചുപോയിരുന്നു
  rationale: שׁחת എന്ന മൂലപദത്തിന്റെ ധാർമ്മിക ദുഷിപ്പും അതിൽനിന്നുണ്ടായ തകർച്ചയും ഉൾക്കൊള്ളാവുന്ന വിശാലത നിലനിർത്തുന്നു; പൂർത്തിയായ അവസ്ഥയും പ്രകടമാക്കുന്നു.
- source_word: כִּי
  choice: ആയതിനാലാണിത്
  rationale: മുൻവാക്യത്തിലെ അവസ്ഥയ്ക്കുള്ള കാരണം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הִשְׁחִית
  choice: നശിപ്പിച്ചുകളഞ്ഞിരുന്നു
  rationale: അതേ שׁחת മൂലത്തിന്റെ ആവർത്തനം ‘നശി/നശിപ്പി’ എന്ന ബന്ധത്തിലൂടെ കാണിക്കുകയും ഹിഫീൽ രൂപത്തിന്റെ കാരണകർത്തൃഭാവം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: כָּל בָּשָׂר
  choice: സകല ജഡവും
  rationale: മനുഷ്യർ മാത്രമെന്നോ എല്ലാ ജീവികളെന്നോ വ്യാഖ്യാനിച്ച് പരിധി നിശ്ചയിക്കാതെ ഹീബ്രു പ്രയോഗത്തിന്റെ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: דַּרְכּוֹ
  choice: താന്താങ്ങളുടെ വഴി
  rationale: സമൂഹവാചകമായ ‘സകല ജഡവും’ എന്നതിനുശേഷമുള്ള ഏകവചന പ്രത്യയത്തിന്റെ വിതരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ‘വഴി’ എന്ന രൂപകം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: עַל הָאָרֶץ
  choice: ഭൂമിയിൽ
  rationale: ഹീബ്രു സ്ഥാനസൂചനയെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: രണ്ടു ഉപവാക്യങ്ങളിലുമുള്ള שׁחת എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: ‘നശിച്ചുപോയിരുന്നു / നശിപ്പിച്ചുകളഞ്ഞിരുന്നു’ എന്ന് ഒരേ മലയാള മൂലബന്ധത്തോടെ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദുഷിച്ചുപോയിരുന്നു / ദുഷിപ്പിച്ചിരുന്നു’ അല്ലെങ്കിൽ ‘നശിപ്പിക്കപ്പെട്ടിരുന്നു / നശിപ്പിച്ചിരുന്നു’.
  rationale: ധാർമ്മിക ദുഷിപ്പിനെയും അതിന്റെ ഫലമായ സൃഷ്ടിവ്യവസ്ഥയുടെ തകർച്ചയെയും ഒരൊറ്റ ദിശയിലേക്കു ചുരുക്കാതെ സൂക്ഷിക്കുന്നു. ഒരേ ഹീബ്രു മൂലത്തിന്റെ ആവർത്തനവും നിലനിർത്തുന്നു.
- issue: כָּל בָּשָׂר എന്നതിന്റെ പരിധി
  choice: ‘സകല ജഡവും’ എന്ന ഹീബ്രു ശൈലി നിലനിർത്തി.
  alternative: ‘സകല മനുഷ്യരും’ അല്ലെങ്കിൽ ‘സകല ജീവജാലങ്ങളും’.
  rationale: സന്ദർഭത്തിൽ മനുഷ്യർക്കു പ്രത്യേക ഊന്നൽ ഉണ്ടാകാമെങ്കിലും പദത്തിന്റെ വിശാലതയെ പരിഭാഷയിൽ തന്നെ നിർണയിക്കാതിരിക്കാൻ ഈ രൂപം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ‘സകല ജഡവും’ എന്ന ബൈബിൾസഹജ പ്രയോഗം മൂലത്തിലെ ഉദ്ദേശ്യപൂർവമായ വ്യാപ്തി കാത്തുസൂക്ഷിക്കാൻ നിലനിർത്തി; ‘താന്താങ്ങളുടെ’ എന്നത് മലയാളത്തിൽ വിതരണാർഥം സ്വാഭാവികമാക്കുന്നു.
