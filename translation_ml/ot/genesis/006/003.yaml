- from: 'അപ്പോൾ യഹോവ പറഞ്ഞു: “എന്റെ ആത്മാവ് മനുഷ്യനോടു എന്നേക്കും പൊരുതുകയില്ല[a]; അവൻ ജഡം മാത്രമാണല്ലോ[b]. അതുകൊണ്ട് അവന്റെ ആയുസ്സ് നൂറ്റിയിരുപത് വർഷമായിരിക്കും.”[c]'
  to: 'അപ്പോൾ യഹോവ പറഞ്ഞു: “എന്റെ ആത്മാവ് മനുഷ്യനോടു എന്നേക്കും പോരാടുകയില്ല[a]; അവൻ ജഡമായതിനാൽ, അവന്റെ ദിവസങ്ങൾ നൂറ്റിയിരുപത് വർഷമായിരിക്കും[c].”[b]'
