reference: Genesis 6:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה לֹֽא יָד֨וֹן רוּחִ֤/י בָֽ/אָדָם֙ לְ/עֹלָ֔ם בְּ/שַׁ/גַּ֖ם ה֣וּא בָשָׂ֑ר וְ/הָי֣וּ יָמָ֔י/ו מֵאָ֥ה וְ/עֶשְׂרִ֖ים שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/003.yaml
  text: Then Yahweh said[a], “My Spirit will not contend with man forever, for he is flesh[c][b]; therefore his days will be one hundred and twenty years.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവ പറഞ്ഞു: “എന്റെ ആത്മാവ് മനുഷ്യനോടു എന്നേക്കും പോരാടുകയില്ല[a]; അവൻ ജഡമായതിനാൽ, അവന്റെ ദിവസങ്ങൾ നൂറ്റിയിരുപത് വർഷമായിരിക്കും[c].”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “എന്റെ ആത്മാവ് മനുഷ്യനിൽ എന്നേക്കും വസിക്കുകയോ നിലനിൽക്കുകയോ ചെയ്യുകയില്ല.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയയുടെ അർഥം അനിശ്ചിതമാണ്.'
    reason: alternative_reading
  - marker: b
    text: ‘മനുഷ്യൻ’ എന്നത് എബ്രായത്തിലെ ആദാം എന്ന ഏകവചനപദത്തിന്റെ പരിഭാഷയാണ്; ഇവിടെ അത് മനുഷ്യവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു. “അവനും ജഡമാകയാൽ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: “നൂറ്റിയിരുപത് വർഷം” മനുഷ്യായുസ്സിന്റെ പരിധിയെയോ പ്രളയംവരെ ശേഷിച്ച സമയത്തെയോ സൂചിപ്പിക്കാം.
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: יָדוֹן
  choice: പൊരുതുകയില്ല
  rationale: അർഥം വിവാദമുള്ള ക്രിയയാണ്. മനുഷ്യനോടുള്ള ദൈവിക എതിർപ്പിന്റെയോ ശാസനാത്മക പ്രവർത്തനത്തിന്റെയോ ആശയം നിലനിർത്താൻ ‘പൊരുതുക’ തിരഞ്ഞെടുത്തു; ‘വസിക്കുക/നിലനിൽക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: רוּחִי
  choice: എന്റെ ആത്മാവ്
  rationale: ദൈവം സംസാരിക്കുന്ന സാഹചര്യത്തിലെ ഒന്നാംപുരുഷ ഉടമസ്ഥരൂപം ദൈവത്തിന്റെ ആത്മാവിനെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം; ‘ശ്വാസം’ എന്ന സാധ്യതയെക്കാൾ സന്ദർഭോചിതം.
- source_word: בָאָדָם
  choice: മനുഷ്യനോടു
  rationale: יָדוֹן എന്നതിന് ‘പൊരുതുക’ എന്ന അർഥം സ്വീകരിച്ചതിനാൽ ב എന്ന ഉപസർഗം ‘-ഓടു’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി. אָדָם ഇവിടെ മനുഷ്യവർഗത്തെ പ്രതിനിധീകരിക്കുന്ന ഏകവചനമാണ്.
- source_word: לְעֹלָם
  choice: എന്നേക്കും
  rationale: കാലപരിധിയില്ലായ്മ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: בְּשַׁגַּם הוּא בָשָׂר
  choice: അവൻ ജഡം മാത്രമാണല്ലോ
  rationale: അപൂർവമായ സംയുക്തരൂപത്തിന്റെ കാരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിച്ചു. ‘ജഡം’ എന്ന മൂലരൂപകം നിലനിർത്തുകയും ഗַּם-ന്റെ ഊന്നൽ ‘മാത്രം/ആണല്ലോ’ വഴി സൂചിപ്പിക്കുകയും ചെയ്തു.
- source_word: וְהָיוּ יָמָיו
  choice: അതുകൊണ്ട് അവന്റെ ആയുസ്സ് ... ആയിരിക്കും
  rationale: തുടർന്നുള്ള ഫലബന്ധം ‘അതുകൊണ്ട്’ വഴി വ്യക്തമാക്കി. പദശഃ ‘അവന്റെ ദിവസങ്ങൾ’ എന്നതിനു പകരം സാധാരണ വായനയിൽ വ്യക്തമായ ‘ആയുസ്സ്’ ഉപയോഗിച്ചു; കാലാവധിയെന്ന മറ്റൊരു വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: നൂറ്റിയിരുപത് വർഷം
  rationale: സംഖ്യയെ സാഹിത്യശൈലിക്ക് യോജിച്ച വിധത്തിൽ വാക്കുകളായി നൽകി.
theological_decisions:
- issue: മനുഷ്യനോടുള്ള ദൈവത്തിന്റെ ആത്മാവിന്റെ ബന്ധം
  choice: ‘എന്റെ ആത്മാവ്’ എന്നു പരിഭാഷപ്പെടുത്തി; പഴയനിയമപരമായ പൊതുവായ അർഥം നിലനിർത്തി.
  alternative: ‘എന്റെ ശ്വാസം’ / ‘എന്റെ ജീവശ്വാസം’
  rationale: רוּחַ എന്നതിന് ആത്മാവ്, കാറ്റ്, ശ്വാസം എന്നീ അർഥങ്ങളുണ്ടെങ്കിലും ദൈവത്തിന്റെ ഒന്നാംപുരുഷ ഉടമസ്ഥപ്രയോഗവും പ്രസംഗസന്ദർഭവും ‘എന്റെ ആത്മാവ്’ എന്ന വായനയ്ക്ക് കൂടുതൽ പിന്തുണ നൽകുന്നു; പിന്നീടുള്ള ത്രിത്വസിദ്ധാന്തത്തിന്റെ വിശദാംശങ്ങൾ വാക്യത്തിലേക്ക് ഇറക്കിവെച്ചിട്ടില്ല.
- issue: אָדָם എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: മനുഷ്യവർഗത്തെ പ്രതിനിധീകരിക്കുന്ന ഏകവചനമായി ‘മനുഷ്യൻ/അവൻ’ നിലനിർത്തി.
  alternative: ‘മനുഷ്യർ’ / ‘മനുഷ്യവർഗം’
  rationale: എബ്രായത്തിലെ ഏകവചന പ്രതിനിധിരൂപം സംരക്ഷിക്കുമ്പോഴും ഇത് ഒരൊറ്റ പുരുഷനെ മാത്രം സൂചിപ്പിക്കുന്നതല്ലെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- issue: നൂറ്റിയിരുപത് വർഷത്തിന്റെ സൂചന
  choice: പ്രധാനപാഠത്തിൽ ‘അവന്റെ ആയുസ്സ്’ എന്നു നൽകി.
  alternative: പ്രളയംവരെ ശേഷിച്ച കാലം നൂറ്റിയിരുപത് വർഷം
  rationale: സന്ദർഭത്തിൽ ഇത് മനുഷ്യായുസ്സിന്റെ പരിധിയോ പ്രളയംവരെയുള്ള അനുവദിച്ച സമയമോ എന്നത് വിവാദമാണ്. വായനാസൗകര്യത്തിന് പ്രധാനപാഠത്തിൽ സാധാരണ വായന സ്വീകരിച്ചെങ്കിലും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന സ്വീകരിച്ചു. ‘ആത്മാവ്’, ‘ജഡം’ എന്നീ ദൈവശാസ്ത്ര-മാനവശാസ്ത്ര ഭാരം വഹിക്കുന്ന പദങ്ങൾ ലളിതീകരിക്കാതെ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
