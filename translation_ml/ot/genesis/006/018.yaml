source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֥י אֶת בְּרִיתִ֖/י אִתָּ֑/ךְ וּ/בָאתָ֙ אֶל הַ/תֵּבָ֔ה אַתָּ֕ה וּ/בָנֶ֛י/ךָ וְ/אִשְׁתְּ/ךָ֥ וּ/נְשֵֽׁי בָנֶ֖י/ךָ אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/018.yaml
  text: But I will establish my covenant with you[a], and you shall enter the ark—you, your sons, your wife, and your sons’ wives with you.
translation:
  language: ml
  text: എന്നാൽ ഞാൻ നിന്നോടുള്ള എന്റെ ഉടമ്പടി സ്ഥാപിക്കും[a]. നീയും നിന്റെ പുത്രന്മാരും നിന്റെ ഭാര്യയും നിന്റെ പുത്രന്മാരുടെ ഭാര്യമാരും നിന്നോടുകൂടെ പെട്ടകത്തിൽ പ്രവേശിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഞാൻ നിന്നോടുള്ള എന്റെ ഉടമ്പടി ഉറപ്പിക്കും.” ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിൽ എബ്രായ ക്രിയയ്ക്ക് ‘സ്ഥാപിക്കുക’ എന്നും ‘ഉറപ്പിക്കുക’ എന്നും അർഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: എന്നാൽ ഞാൻ ... സ്ഥാപിക്കും
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള קום, בְּרִית എന്ന പദത്തോടൊപ്പം വരുമ്പോൾ, ഉടമ്പടി സ്ഥാപിക്കുക എന്നോ ഉറപ്പിക്കുക എന്നോ അർഥമാകാം. മുൻവാക്യങ്ങളിലെ നാശപ്രഖ്യാപനത്തോട് ഉള്ള വ്യത്യാസം സൂചിപ്പിക്കാൻ וַ־യെ ഇവിടെ ‘എന്നാൽ’ എന്നു വിവർത്തനം ചെയ്തു; പ്രധാന പാഠത്തിൽ ഭാവിമുഖമായ ‘സ്ഥാപിക്കും’ സ്വീകരിക്കുകയും മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
- source_word: בְּרִיתִי אִתָּךְ
  choice: നിന്നോടുള്ള എന്റെ ഉടമ്പടി
  rationale: בְּרִית എന്നതിന് മലയാളത്തിലെ സ്ഥിരവും ദൈവശാസ്ത്രപരമായി പ്രസക്തവുമായ ‘ഉടമ്പടി’ ഉപയോഗിച്ചു. אִתָּךְ സൂചിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘നിന്നോടുള്ള’ എന്ന് പ്രകടിപ്പിച്ചു.
- source_word: וּבָאתָ אֶל הַתֵּבָה
  choice: പെട്ടകത്തിൽ പ്രവേശിക്കണം
  rationale: בוא ഇവിടെ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള പ്രവേശനത്തെ സൂചിപ്പിക്കുന്നു. תֵּבָהയ്ക്ക് നോഹയുടെ വിവരണത്തിൽ പതിവായ ‘പെട്ടകം’ ഉപയോഗിച്ചു. നിർദേശാത്മകമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘പ്രവേശിക്കണം’ എന്നു നൽകി.
- source_word: אַתָּה וּבָנֶיךָ וְאִשְׁתְּךָ וּנְשֵׁי בָנֶיךָ אִתָּךְ
  choice: നീയും നിന്റെ പുത്രന്മാരും നിന്റെ ഭാര്യയും നിന്നോടൊപ്പം നിന്റെ പുത്രന്മാരുടെ ഭാര്യമാരും
  rationale: സ്വതന്ത്ര സർവനാമമായ אַתָּהയുടെ ഊന്നൽ ‘നീയും’ എന്ന പട്ടികാരൂപത്തിൽ സൂക്ഷിച്ചു. בָּנִים എന്നത് ലിംഗനിർദ്ദിഷ്ടമായി ‘പുത്രന്മാർ’ എന്നും, נְשֵׁי בָנֶיךָ എന്നത് മൂലപാഠത്തിന്റെ ബന്ധഘടന നിലനിർത്തി ‘നിന്റെ പുത്രന്മാരുടെ ഭാര്യമാർ’ എന്നും വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: ഉടമ്പടി പ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: ‘ഞാൻ നിന്നോടുള്ള എന്റെ ഉടമ്പടി സ്ഥാപിക്കും’ എന്ന ഭാവിമുഖമായ വാഗ്ദാനം
  alternative: ‘ഞാൻ നിന്നോടുള്ള എന്റെ ഉടമ്പടി ഉറപ്പിക്കും’
  rationale: הֲקִימֹתִי אֶת־בְּרִיתִי എന്ന പ്രയോഗം ഒരു ഉടമ്പടി സ്ഥാപിക്കുന്നതെയോ ഇതിനുമുമ്പുള്ള പ്രതിബദ്ധത ഉറപ്പിക്കുന്നതെയോ സൂചിപ്പിക്കാം. വാക്യം ഈ ദൈവശാസ്ത്രപരമായ ചോദ്യം നിർണായകമായി തീർക്കാത്തതിനാൽ പ്രധാന പാഠത്തിൽ സാധാരണ ഉടമ്പടിപദപ്രയോഗം സ്വീകരിക്കുകയും മറുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഉടമ്പടി’, ‘പെട്ടകം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; കുടുംബപ്പട്ടിക സ്വാഭാവിക മലയാളക്രമത്തിൽ അവതരിപ്പിച്ചു.
