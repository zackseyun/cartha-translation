id: GEN.6.11
reference: Genesis 6:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּשָּׁחֵ֥ת הָ/אָ֖רֶץ לִ/פְנֵ֣י הָֽ/אֱלֹהִ֑ים וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/011.yaml
  text: The earth was corrupt before God[a], and the earth was filled with violence.
translation:
  language: ml
  text: ദൈവത്തിന്റെ മുമ്പാകെ ഭൂമി ദുഷിച്ചുപോയിരുന്നു[a]; ഭൂമി അക്രമംകൊണ്ടു നിറഞ്ഞിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ ദേശം ദുഷിച്ചുപോയിരുന്നു.’'
    reason: אֶרֶץ എന്നതിന്റെ ‘ദേശം’ എന്ന അർഥവും לִפְנֵי എന്നതിന്റെ ‘ദൃഷ്ടിയിൽ’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷയും സംരക്ഷിക്കുന്ന പദവികൽപം.
lexical_decisions:
- source_word: וַתִּשָּׁחֵת
  choice: ദുഷിച്ചുപോയിരുന്നു
  rationale: നിഫാൽ രൂപം ഭൂമി കേടുപെട്ടതോ ധാർമികമായി ദുഷിച്ചതോ ആയിത്തീർന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ മനുഷ്യദുഷ്ടതയും അക്രമവും കണക്കിലെടുത്ത്, സ്വാഭാവികമായ മലയാളത്തിൽ ഫലാവസ്ഥ പ്രകടമാക്കുന്ന ഈ രൂപം സ്വീകരിച്ചു.
- source_word: הָאָרֶץ
  choice: ഭൂമി
  rationale: אֶרֶץ എന്നതിന് ‘ഭൂമി’ എന്നും ‘ദേശം’ എന്നും അർഥമാകാം. പ്രളയവിവരണത്തിന്റെ വ്യാപകമായ പശ്ചാത്തലത്തിൽ ‘ഭൂമി’ പ്രധാന പാഠത്തിൽ സ്വീകരിക്കുകയും ‘ദേശം’ അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു. ആവർത്തനം എബ്രായത്തിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ മുമ്പാകെ
  rationale: לִפְנֵי എന്നതിന്റെ സാന്നിധ്യപരമായ ‘മുമ്പാകെ’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു; ദൈവത്തിന്റെ വിലയിരുത്തൽ എന്ന ആശയം വ്യാഖ്യാനിച്ച് മാത്രം പറയുന്നില്ല.
- source_word: הָאֱלֹהִים
  choice: ദൈവം
  rationale: സന്ദർഭവും വ്യാകരണവും ഏകദൈവത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണ ഏകവചന രൂപം ഉപയോഗിച്ചു.
- source_word: וַתִּמָּלֵא
  choice: നിറഞ്ഞിരുന്നു
  rationale: നിഫാൽ രൂപം ഭൂമി അക്രമംകൊണ്ട് നിറഞ്ഞ അവസ്ഥയിലെത്തിയതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ഫലാവസ്ഥയായി ‘നിറഞ്ഞിരുന്നു’ നൽകി.
- source_word: חָמָס
  choice: അക്രമം
  rationale: ഈ പദം ബലപ്രയോഗപരമായ അതിക്രമം, ക്രൂരത, അനീതി എന്നിവ ഉൾക്കൊള്ളാം. ഇവിടെ നേരിട്ടും ഗൗരവത്തോടെയും അർഥം നൽകുന്ന ‘അക്രമം’ സ്വീകരിച്ചു.
- source_word: וַ
  choice: ;
  rationale: എബ്രായ ആഖ്യാനബന്ധം മലയാളത്തിൽ അനാവശ്യമായ ഒരു കാലസൂചകപദം ചേർക്കാതെ, സമാന്തരമായ രണ്ടു വാക്യഭാഗങ്ങളെ അർദ്ധവിരാമംകൊണ്ട് ബന്ധിപ്പിച്ചു.
theological_decisions:
- issue: ദുഷിപ്പിന്റെ സ്വഭാവം
  choice: ഭൂമിയിലോ മനുഷ്യസമൂഹത്തിലോ പ്രകടമായ ധാർമിക ദുഷിപ്പ്
  alternative: ഭൂമിയുടെ ഭൗതിക നാശം മാത്രം
  rationale: തൊട്ടടുത്ത സന്ദർഭം മനുഷ്യരുടെ ദുഷ്ടതയെയും അക്രമത്തെയും മുൻനിർത്തുന്നു. എന്നിരുന്നാലും ‘ഭൂമി’ എന്ന പദത്തിന്റെ വ്യാപ്തി ചുരുക്കാതെ പാഠത്തിലെ സംഘർഷം നിലനിർത്തി.
- issue: ദൈവത്തിന്റെ മുമ്പാകെ എന്ന പ്രയോഗം
  choice: ദൈവസന്നിധിയിലും ദൈവത്തിന്റെ നിരീക്ഷണത്തിനുമുന്നിലും
  alternative: ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ
  rationale: ‘ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ’ സാധുവായ വ്യാഖ്യാനപരമായ വിവർത്തനമാണെങ്കിലും, പ്രധാന പാഠത്തിൽ എബ്രായത്തിലെ സാന്നിധ്യഭാഷയ്ക്ക് അടുത്ത ‘മുമ്പാകെ’ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ‘ഭൂമി’ എന്ന ആവർത്തനം ഊന്നലിനായി നിലനിർത്തി; ഉറവിടത്തിൽ വ്യക്തമായ ‘ഇപ്പോൾ’ എന്ന കാലസൂചകം ഇല്ലാത്തതിനാൽ അത്തരം തുടക്കപദം ചേർത്തിട്ടില്ല.
