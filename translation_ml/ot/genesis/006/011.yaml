  source_fidelity: 'The Malayalam accurately represents the Hebrew: הארץ is retained as “ഭൂമി” in both occurrences, וַתִּשָּׁחֵת is conveyed as a state of corruption (“ദുഷിച്ചുപോയിരുന്നു”), לִפְנֵי הָאֱלֹהִים as “ദൈവത്തിന്റെ മുമ്പാകെ,” and חָמָס as “അക്രമം.” It does not add an unwarranted temporal marker, and it preserves the verse’s broad reference to the earth rather than narrowing it to human society alone.'
