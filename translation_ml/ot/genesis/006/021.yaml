id: GEN.6.21
reference: Genesis 6:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַתָּ֣ה קַח לְ/ךָ֗ מִ/כָּל מַֽאֲכָל֙ אֲשֶׁ֣ר יֵֽאָכֵ֔ל וְ/אָסַפְתָּ֖ אֵלֶ֑י/ךָ וְ/הָיָ֥ה לְ/ךָ֛ וְ/לָ/הֶ֖ם לְ/אָכְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/021.yaml
  text: And you[a], take for yourself some of every kind of food that is edible, and gather it to yourself[b]; and it shall be food for you and for them.
translation:
  language: ml
  text: നീയോ, നിനക്കായി ഭക്ഷിക്കാവുന്ന എല്ലാത്തരം ആഹാരത്തിൽനിന്നും കുറെ എടുക്കുക; അവ നിന്റെ പക്കൽ ശേഖരിച്ചുവെക്കുക. അത് നിനക്കും അവയ്ക്കും ആഹാരമായിരിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח לְךָ
  choice: നിനക്കായി ... എടുത്ത്
  rationale: לקח എന്ന കല്പനയുടെ നേരിട്ടുള്ള അർഥം ‘എടുക്കുക’ എന്നാണ്; לְךָ ഇവിടെ ഗുണഭോക്തൃ/പ്രതിഫലന ഭാവം നൽകുന്നു. മലയാളത്തിലെ വാക്യക്രമത്തിൽ ‘നിനക്കായി’ എന്നു വേർതിരിക്കുന്നതിനെക്കാൾ ‘നിന്റെ അടുക്കൽ ശേഖരിക്കണം’ എന്ന തുടർപ്രയോഗത്തോടൊപ്പം ആശയം സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: מִכָּל מַאֲכָל
  choice: എല്ലാത്തരം ആഹാരത്തിൽനിന്നും കുറെ
  rationale: מִן + כָּל എന്നത് ലഭ്യമായ മുഴുവൻ വിഭാഗങ്ങളിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പിനെ സൂചിപ്പിക്കുന്നു; നിലവിലുള്ള സകല ആഹാരവും മുഴുവനായി എടുക്കണമെന്ന തെറ്റായ ധാരണ ഒഴിവാക്കാൻ ‘എല്ലാത്തരം ... കുറെ’ എന്നു നൽകി.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: ഭക്ഷിക്കാവുന്ന
  rationale: אכל എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ ഭക്ഷണയോഗ്യതയെയോ ഭക്ഷിക്കപ്പെടുന്നതിന്റെ സ്വഭാവത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ഭക്ഷിക്കാവുന്ന’ എന്നത് സ്വാഭാവികമായ മലയാളത്തിൽ ഈ സാധ്യതാഭാവം നിലനിർത്തുന്നു.
- source_word: וְאָסַפְתָּ אֵלֶיךָ
  choice: നിന്റെ അടുക്കൽ ശേഖരിക്കണം
  rationale: אָסַף എന്നതിന്റെ ‘ശേഖരിക്കുക/കൂട്ടിച്ചേർക്കുക’ എന്ന അർഥവും אֵלֶיךָ എന്നതിന്റെ ദിശാഭാവവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וְהָיָה ... לְאָכְלָה
  choice: അത് ... ആഹാരമായിരിക്കും
  rationale: വാവ് സഹിതമുള്ള ക്രിയയുടെ ഭാവി/ഫലസൂചനയും לְאָכְלָה എന്ന ഉദ്ദേശ്യവും സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לְךָ וְלָהֶם
  choice: നിനക്കും അവയ്ക്കും
  rationale: നോഹയെയും മുമ്പ് പരാമർശിച്ച ജീവികളെയും വേർതിരിച്ച് കാണിക്കുന്ന ആവർത്തിത לְ ഘടന സംരക്ഷിക്കുന്നു; ജന്തുക്കളെ സൂചിപ്പിക്കാൻ ‘അവയ്ക്കും’ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നേരിട്ടുള്ള ദൈവകല്പനയുടെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ വാക്യക്രമം ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ‘നീയോ’ എന്ന ഊന്നൽ തുടക്കത്തിൽ സംരക്ഷിച്ചു; അനാവശ്യമായ മതവിഭാഗീയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
