id: GEN.6.2
reference: Genesis 6:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּרְא֤וּ בְנֵי הָֽ/אֱלֹהִים֙ אֶת בְּנ֣וֹת הָֽ/אָדָ֔ם כִּ֥י טֹבֹ֖ת הֵ֑נָּה וַ/יִּקְח֤וּ לָ/הֶם֙ נָשִׁ֔ים מִ/כֹּ֖ל אֲשֶׁ֥ר בָּחָֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/002.yaml
  text: the sons of God saw that the daughters of man were beautiful[b][a], and they took wives for themselves from any they chose.
translation:
  language: ml
  text: ദൈവത്തിന്റെ പുത്രന്മാർ[a] മനുഷ്യരുടെ പുത്രിമാർ സുന്ദരികളാണെന്ന്[b] കണ്ടു; അവർ തിരഞ്ഞെടുത്ത എല്ലാവരിൽനിന്നും തങ്ങൾക്കു ഭാര്യമാരെ എടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദിവ്യജീവികൾ.’ ‘ദൈവത്തിന്റെ പുത്രന്മാർ’ ആരാണെന്നത് വിവാദവിഷയമാണ്; സ്വർഗീയജീവികൾ, മനുഷ്യഭരണാധികാരികൾ, അല്ലെങ്കിൽ ശേത്തിന്റെ വംശക്കാർ എന്നിവയാണ് പ്രധാന വ്യാഖ്യാനങ്ങൾ.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവർ നല്ലവരാണെന്ന്’; ഇവിടെ അതിന്റെ അർഥം ‘കാണാൻ ഭംഗിയുള്ളവർ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പുത്രന്മാർ
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ രൂപം അടുത്തായി നിലനിർത്തുകയും അവർ ആരാണെന്ന തർക്കവിഷയം പരിഭാഷയിൽ തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּנוֹת הָאָדָם
  choice: മനുഷ്യരുടെ പുത്രിമാർ
  rationale: הָאָדָם ഇവിടെ മനുഷ്യവർഗത്തെ സൂചിപ്പിക്കുന്ന സമൂഹവാചകമായി മനസ്സിലാക്കി, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഉൾക്കൊള്ളാവുന്നതുമായ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: כִּי טֹבֹת הֵנָּה
  choice: സുന്ദരികളാണെന്ന്
  rationale: ഈ സന്ദർഭത്തിൽ טוֹב സ്ത്രീകളുടെ ആകർഷകമായ രൂപത്തെ സൂചിപ്പിക്കുന്നു; ‘നല്ലവർ’ എന്ന നൈതിക അർഥം തെറ്റായി തോന്നാതിരിക്കാൻ ‘സുന്ദരികൾ’ എന്നു നൽകി.
- source_word: וַיִּקְחוּ לָהֶם נָשִׁים
  choice: തങ്ങൾക്കു ഭാര്യമാരെ എടുത്തു
  rationale: ‘എടുത്തു’ എന്ന ക്രിയയും ‘തങ്ങൾക്കു’ എന്ന ദാതൃപ്രയോഗവും നിലനിർത്തി; נָשִׁים എന്നത് ഈ വിവാഹസന്ദർഭത്തിൽ ‘ഭാര്യമാർ’ എന്നാണ്.
- source_word: מִכֹּל אֲשֶׁר בָּחָרוּ
  choice: അവർ തിരഞ്ഞെടുത്തവരിൽനിന്നെല്ലാം
  rationale: തിരഞ്ഞെടുപ്പിന്റെ വിപുലവും നിയന്ത്രണമില്ലാത്തതുമായ സ്വഭാവം സൂചിപ്പിക്കുന്ന מִכֹּל എന്ന ഘടകം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ പുത്രന്മാർ’ ആരെന്ന തിരിച്ചറിയൽ
  choice: അവരുടെ തിരിച്ചറിയൽ നിർണയിക്കാതെ എബ്രായ പ്രയോഗം അതേപടി നിലനിർത്തുന്നു.
  alternative: ദിവ്യജീവികൾ/സ്വർഗീയജീവികൾ, മനുഷ്യഭരണാധികാരികൾ, അല്ലെങ്കിൽ ശേത്തിന്റെ വംശക്കാർ എന്നു വ്യക്തമായി നിർവചിക്കുക.
  rationale: വാക്യം തന്നെ ഇവരുടെ തിരിച്ചറിയൽ തീർപ്പാക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ സംഘർഷം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് പ്രധാന വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വിവാദമായ ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ മുഖ്യപാഠത്തിൽ തുറന്നുവെച്ചിരിക്കുന്നു; എബ്രായ വാക്യഘടനയും മലയാളത്തിന്റെ വായനാസൗകര്യവും തമ്മിൽ സമതുലനം പാലിച്ചു.
