  source_fidelity: The draft accurately identifies three male offspring and preserves the names. However, «നോഹയ്ക്ക് ... ജനിച്ചു» presents the sons’ birth with Noah in a dative possessive/experiencer construction, whereas the Hebrew Hiphil has Noah as the explicit agent, ‘fathered/begot.’ A direct paternal expression better represents the source.
