id: GEN.6.10
reference: Genesis 6:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יּ֥וֹלֶד נֹ֖חַ שְׁלֹשָׁ֣ה בָנִ֑ים אֶת שֵׁ֖ם אֶת חָ֥ם וְ/אֶת יָֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/010.yaml
  text: 'And Noah fathered three sons: Shem[a], Ham, and Japheth.'
translation:
  language: ml
  text: 'നോഹ മൂന്ന് പുത്രന്മാരെ ജനിപ്പിച്ചു: ശേം, ഹാം, യാഫെത്ത്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: ജനിച്ചു
  rationale: ילד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ നോഹയുടെ പിതൃത്വത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നോഹയ്ക്ക് ... ജനിച്ചു’ എന്ന പ്രയോഗം സ്വാഭാവികമായി മക്കളുടെ ജനനവും നോഹ പിതാവാണെന്ന അർഥവും നൽകുന്നു; ‘ജനിപ്പിച്ചു’ എന്നത് കൂടുതൽ അക്ഷരാർഥപരമാണെങ്കിലും ആധുനിക മലയാളത്തിൽ അസ്വാഭാവികമായി തോന്നാം.
- source_word: שְׁלֹשָׁה בָנִים
  choice: മൂന്നു പുത്രന്മാർ
  rationale: בָנִים ഇവിടെ പൊതുവായ ‘മക്കൾ’ എന്നതല്ല, വ്യക്തമായി ആൺമക്കളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പുത്രന്മാർ’ അർഥകൃത്യതയും മാന്യമായ ആധുനിക ശൈലിയും നിലനിർത്തുന്നു.
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: ശേം, ഹാം, യാഫെത്ത്
  rationale: אֶת എന്ന നേരിട്ടുള്ള കർമചിഹ്നങ്ങൾ മലയാളത്തിൽ പ്രത്യേകം വിവർത്തനം ചെയ്യേണ്ടതില്ല. മൂന്ന് പേരുകളും പട്ടികയായി സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: נֹחַ
  choice: നോഹ
  rationale: നֹחַ എന്ന വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ വ്യാപകമായി അംഗീകരിക്കപ്പെട്ട രൂപമാണ് ‘നോഹ’.
theological_decisions: []
translation_notes:
  register: ലളിതവും മാന്യവും ആധുനികവുമായ മലയാളം. ‘ജനിപ്പിച്ചു’ എന്ന കൃത്രിമത്വം ഒഴിവാക്കി, പിതൃത്വസൂചന നഷ്ടപ്പെടാത്ത സ്വാഭാവിക ദേറ്റീവ് നിർമാണം ഉപയോഗിച്ചു.
