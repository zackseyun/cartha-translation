    issue: The verb construction obscures Noah’s explicit agentive/paternal role.
    rationale: 'וַיּוֹלֶד is Hiphil with Noah as subject: he fathered/begot three sons. «നോഹയ്ക്ക് ... ജനിച്ചു» can naturally mean merely that sons were born to Noah, rather than directly rendering the source’s paternal predication.'
  revised_text: 'നോഹ മൂന്ന് പുത്രന്മാരെ ജനിപ്പിച്ചു: ശേം, ഹാം, യാഫെത്ത്.'
