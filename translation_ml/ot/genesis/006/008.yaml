revisions:
- from: എന്നാൽ നോഹയ്ക്ക് യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിച്ചു.[a]
  to: എന്നാൽ നോഹ യഹ്‌വേയുടെ ദൃഷ്ടിയിൽ പ്രീതി നേടി.[a]
