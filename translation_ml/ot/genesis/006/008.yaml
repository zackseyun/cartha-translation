id: GEN.6.8
reference: Genesis 6:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נֹ֕חַ מָ֥צָא חֵ֖ן בְּ/עֵינֵ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/008.yaml
  text: But Noah found favor in the eyes of Yahweh[a].
translation:
  language: ml
  text: എന്നാൽ നോഹ യഹ്‌വേയുടെ ദൃഷ്ടിയിൽ പ്രീതി നേടി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നോഹ യഹ്‌വേയുടെ ദൃഷ്ടിയിൽ കൃപ കണ്ടെത്തി.”'
    reason: חֵן എന്ന പദത്തിന് ‘പ്രീതി’ എന്നും ‘കൃപ’ എന്നും അർഥമാകാം; ഈ സാധുവായ പദവികൽപം സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: എന്നാൽ നോഹയ്ക്ക്
  rationale: וְ എന്ന സംയോജകത്തിന് സാധാരണയായി ‘കൂടാതെ/അപ്പോൾ’ എന്നർഥമുണ്ടെങ്കിലും, ചുറ്റുമുള്ള മനുഷ്യദുഷ്ടതയുടെയും ന്യായവിധിയുടെയും പശ്ചാത്തലത്തിൽ ഇവിടെ വൈരുദ്ധ്യസൂചന വ്യക്തമാണ്. അതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമായി ആ വ്യത്യാസം പ്രകടമാക്കുന്നു.
- source_word: מָצָא
  choice: ലഭിച്ചു
  rationale: מצא എന്നതിന് അടിസ്ഥാനമായി ‘കണ്ടെത്തുക’ എന്നർഥമുണ്ടെങ്കിലും, חֵן מצא എന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ ‘പ്രീതി ലഭിച്ചു’ എന്നു പറയുന്നതാണ് സ്വാഭാവികം; അർഥം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ പ്രയോഗത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: חֵן
  choice: പ്രീതി
  rationale: חֵן എന്നത് പ്രീതി, കൃപ, സ്വീകാര്യത എന്നിവ സൂചിപ്പിക്കാം. സന്ദർഭത്തിലെ ദൈവത്തിന്റെ അനുകൂല മനോഭാവം വ്യക്തമാക്കാനും പിന്നീട് രൂപപ്പെട്ട സിദ്ധാന്തപരമായ അർഥങ്ങൾ അനാവശ്യമായി ചുമത്താതിരിക്കാനും ‘പ്രീതി’ അനുയോജ്യമാണ്.
- source_word: בְּ/עֵינֵי
  choice: ദൃഷ്ടിയിൽ
  rationale: അക്ഷരാർഥം ‘കണ്ണുകളിൽ’ എന്നാണെങ്കിലും, വ്യക്തിയുടെ വിലയിരുത്തലിലോ കാഴ്ചപ്പാടിലോ എന്ന ഹീബ്രു പ്രയോഗാർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ‘ദൃഷ്ടിയിൽ’ കൊണ്ട് നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു പദവികൊണ്ട് മാറ്റിസ്ഥാപിക്കാതെ, മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: നോഹയോടുള്ള ദൈവിക മനോഭാവവുമായി ബന്ധപ്പെട്ട חֵן എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പ്രീതി
  alternative: കൃപ
  rationale: ‘പ്രീതി’ ഹീബ്രു പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സംരക്ഷിക്കുന്നു; അതേസമയം ‘കൃപ’ എന്ന സാധുവായ പദവികൽപം അടിക്കുറിപ്പിൽ നിലനിർത്തി പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി ചുരുക്കുന്നില്ല.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു. ‘യഹ്‌വെ’ എന്ന രൂപം സാധാരണ പണ്ഡിതപരമായ പുനർനിർമാണത്തോട് ചേർന്നുനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ വൈരുദ്ധ്യസൂചന ‘എന്നാൽ’ കൊണ്ടും, ‘ദൃഷ്ടിയിൽ പ്രീതി ലഭിച്ചു’ എന്ന പ്രയോഗം കൊണ്ടും മൂലത്തിലെ ആശയവും ഭാഷാശൈലിയും സ്വാഭാവികമായി കൈമാറുന്നു.
