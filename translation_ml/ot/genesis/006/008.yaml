  terminology: ‘പ്രീതി’ avoids over-specifying חֵן as a later technical theological term, while the footnote preserves ‘കൃപ’ as a legitimate lexical alternative. ‘യഹ്‌വേ’ accurately retains the Tetragrammaton as a name.
