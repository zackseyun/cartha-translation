    text: അഥവാ, ‘അവയുടെ ഇനംപ്രകാരം’; അടിസ്ഥാനാർഥം അതേപടി നിലനിർത്തുന്ന മറ്റൊരു പരിഭാഷ.
    reason: lexical_alternative
