source:
  edition: WLC
  text: מֵ/הָ/ע֣וֹף לְ/מִינֵ֗/הוּ וּ/מִן הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ מִ/כֹּ֛ל רֶ֥מֶשׂ הָֽ/אֲדָמָ֖ה לְ/מִינֵ֑/הוּ שְׁנַ֧יִם מִ/כֹּ֛ל יָבֹ֥אוּ אֵלֶ֖י/ךָ לְ/הַֽחֲיֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/020.yaml
  text: From the birds according to their kinds[a], and from the livestock according to their kinds, from every creeping thing of the ground according to its kind, two of each will come to you to keep them alive.
translation:
  language: ml
  text: പക്ഷികളിൽനിന്ന് അതതു ഇനംപ്രകാരം[a], വളർത്തുമൃഗങ്ങളിൽനിന്ന് അതതു ഇനംപ്രകാരം, നിലത്ത് ഇഴയുന്ന സകല ജീവികളിൽനിന്ന് അതതു ഇനംപ്രകാരം—ഓരോ ഇനത്തിൽനിന്നും രണ്ടെണ്ണം വീതം അവയെ ജീവനോടെ സൂക്ഷിക്കാനായി നിന്റെ അടുക്കൽ വരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവയുടെ ഇനംപ്രകാരം’; അടിസ്ഥാനാർഥം അതേപടി നിലനിർത്തുന്ന മറ്റൊരു പരിഭാഷ.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעוֹף
  choice: പക്ഷികൾ
  rationale: עוֹף എന്നത് പറക്കുന്ന ജീവികളെയോ പക്ഷികളെയോ സൂചിപ്പിക്കാം; ഇവിടെ പട്ടികപ്പെടുത്തിയിരിക്കുന്ന ജീവിവിഭാഗത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പദം ‘പക്ഷികൾ’ ആണ്.
- source_word: לְמִינֵהוּ / לְמִינָהּ
  choice: അവയുടെ ഇനംപ്രകാരം
  rationale: מִין ജീവികളുടെ ഇനം അഥവാ വർഗവിഭാഗം സൂചിപ്പിക്കുന്നു. ‘ഇനംപ്രകാരം’ എന്നത് ആ വർഗീകരണാർഥം നിലനിർത്തുന്നു; ആധുനിക ജീവശാസ്ത്രത്തിലെ കർശനമായ ‘species’ എന്ന ആശയം ഇതിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: הַבְּהֵמָה
  choice: കന്നുകാലികൾ
  rationale: בְּהֵמָה ഇവിടെ പക്ഷികളിൽനിന്നും ഇഴജന്തുക്കളിൽനിന്നും വേർതിരിച്ച വീട്ടുമൃഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘കന്നുകാലികൾ’ സാധാരണ മലയാളത്തിൽ ഈ കൂട്ടത്തെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: רֶמֶשׂ הָאֲדָמָה
  choice: നിലത്ത് ഇഴയുന്ന സകല ജീവികൾ
  rationale: רֶמֶשׂ ചെറുതായി സഞ്ചരിക്കുന്നതോ ഇഴയുന്നതോ ആയ ജീവികളെ സൂചിപ്പിക്കുന്നു; הָאֲדָמָה എന്നതിന് ‘നിലത്ത്’ എന്നത് സന്ദർഭോചിതവും ഭൂമിയോടുള്ള ബന്ധം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: שְׁנַיִם מִכֹּל
  choice: ഓരോന്നിൽനിന്നും രണ്ടെണ്ണം വീതം
  rationale: ഓരോ പരാമർശിത ഇനത്തിൽനിന്നും രണ്ട് എന്ന വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יָבֹאוּ אֵלֶיךָ
  choice: നിന്റെ അടുക്കൽ വരും
  rationale: בוא + אֶל നോഹയിലേക്കുള്ള വരവാണ് നേരിട്ട് പറയുന്നത്. പെട്ടകത്തിൽ പ്രവേശിക്കും എന്ന സന്ദർഭസൂചന വാചകത്തിൽ അധികമായി ചേർത്തിട്ടില്ല.
- source_word: לְהַחֲיוֹת
  choice: അവയെ ജീവനോടെ സൂക്ഷിക്കേണ്ടതിന്
  rationale: חיה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ജീവൻ നിലനിർത്തുക എന്ന ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ ഉദ്ദേശ്യാർഥവും കർമവും വ്യക്തമായി നൽകുന്നു.
