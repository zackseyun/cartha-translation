translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ആവർത്തിക്കുന്ന എബ്രായ ഘടന കഴിയുന്നത്ര നിലനിർത്തിയിട്ടും വാചകം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
