- from: പക്ഷികളിൽനിന്ന് അവയുടെ ഇനംപ്രകാരവും[a], കന്നുകാലികളിൽനിന്ന് അവയുടെ ഇനംപ്രകാരവും, നിലത്ത് ഇഴയുന്ന സകല ജീവികളിൽനിന്ന് അവയുടെ ഇനംപ്രകാരവും—ഓരോന്നിൽനിന്നും രണ്ടെണ്ണം വീതം, അവയെ ജീവനോടെ സൂക്ഷിക്കേണ്ടതിന്, നിന്റെ അടുക്കൽ വരും.
