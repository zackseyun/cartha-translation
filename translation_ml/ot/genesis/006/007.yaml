id: GEN.6.7
reference: Genesis 6:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה אֶמְחֶ֨ה אֶת הָ/אָדָ֤ם אֲשֶׁר בָּרָ֨אתִי֙ מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה מֵֽ/אָדָם֙ עַד בְּהֵמָ֔ה עַד רֶ֖מֶשׂ וְ/עַד ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י נִחַ֖מְתִּי כִּ֥י עֲשִׂיתִֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/007.yaml
  text: So Yahweh said[a], “I will blot out man, whom I have created[c], from the face of the ground—from man to livestock to creeping things and to the birds of the heavens—for I regret that I have made them[b].”
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവ പറഞ്ഞു: “ഞാൻ സൃഷ്ടിച്ച മനുഷ്യനെ[a] ഭൂമിയുടെ ഉപരിതലത്തിൽനിന്ന് മായിച്ചുകളയും—മനുഷ്യൻ മുതൽ കന്നുകാലികൾ വരെയും, ഇഴജന്തുക്കൾ വരെയും, ആകാശത്തിലെ പക്ഷികൾ വരെയും—കാരണം അവരെ ഉണ്ടാക്കിയതിൽ ഞാൻ ഖേദിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മനുഷ്യവർഗത്തെ.” ഹീബ്രായിലെ ആദാം എന്ന പദം ഇവിടെ മനുഷ്യരാശിയെ കൂട്ടായി സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള “മനുഷ്യൻ മുതൽ” എന്ന പ്രയോഗത്തിലും അതേ പദം ആവർത്തിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അവരെ ഉണ്ടാക്കിയതിൽ എനിക്ക് ദുഃഖമുണ്ട്.” ഹീബ്രായിലെ נחם എന്ന ക്രിയ മുൻപ് ചെയ്ത പ്രവൃത്തിയെക്കുറിച്ചുള്ള ഖേദമോ ദുഃഖമോ പ്രകടിപ്പിക്കുന്നു; ദൈവം അമ്പരന്നുവെന്നോ മുൻകൂട്ടി അറിഞ്ഞിരുന്നില്ലെന്നോ ധാർമ്മിക തെറ്റ് ചെയ്തുവെന്നോ ആ പദം സ്വയം പ്രസ്താവിക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ יהוהയെ മലയാളത്തിൽ പരിചിതവും ഉച്ചാരണസമീപവുമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אֶמְחֶה
  choice: തുടച്ചുനീക്കും
  rationale: מחה എന്ന ക്രിയയിലെ തുടച്ചുകളയുക/മായിച്ചുകളയുക എന്ന ദൃശ്യബിംബം നിലനിർത്തുകയും ‘ഭൂമിയുടെ ഉപരിതലത്തിൽനിന്ന്’ എന്ന തുടർപ്രയോഗത്തോട് സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: הָאָדָם
  choice: മനുഷ്യരെ
  rationale: ഇവിടെ אָדָם മനുഷ്യവർഗത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബഹുവചനമായ ‘മനുഷ്യരെ’ സ്വാഭാവികമായി ആ കൂട്ടായ അർഥം നൽകുന്നു.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: ഭൂമിയുടെ ഉപരിതലത്തിൽനിന്ന്
  rationale: ‘നിലത്തിന്റെ മുഖത്തുനിന്ന്’ എന്ന അക്ഷരാർഥത്തെക്കാൾ സ്വാഭാവികമായ മലയാളത്തിൽ ഉപരിതലത്തിന്റെ ആശയം സംരക്ഷിക്കുന്നു.
- source_word: בְּהֵמָה
  choice: കന്നുകാലികൾ
  rationale: ഈ സൃഷ്ടിജീവികളുടെ പട്ടികയിൽ בְּהֵמָה സാധാരണയായി വീട്ടുമൃഗങ്ങളെയോ വലിയ കരമൃഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘കന്നുകാലികൾ’ ആ വർഗത്തെ വ്യക്തമായി നൽകുന്നു.
- source_word: רֶמֶשׂ
  choice: ഇഴജന്തുക്കൾ
  rationale: നിലത്തു ഇഴയുകയോ ചെറുതായി സഞ്ചരിക്കുകയോ ചെയ്യുന്ന ജീവികളുടെ വർഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: עוֹף הַשָּׁמָיִם
  choice: ആകാശത്തിലെ പക്ഷികൾ
  rationale: ഹീബ്രായിലെ ‘ആകാശങ്ങളുടെ പക്ഷികൾ’ എന്ന പ്രയോഗത്തെ സ്വാഭാവികവും അർഥസമീപവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: נִחַמְתִּי כִּי עֲשִׂיתִם
  choice: അവരെ ഉണ്ടാക്കിയതിൽ ഞാൻ ഖേദിക്കുന്നു
  rationale: נחם നിഫാൽ രൂപത്തിന്റെ മുൻപ്രവൃത്തിയെക്കുറിച്ചുള്ള ഖേദം/ദുഃഖം എന്ന പിരിമുറുക്കമുള്ള അർഥം മായ്ക്കാതെ നൽകുന്നു; ബഹുവചന പ്രത്യയം ‘അവരെ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ ഖേദം എന്ന נִחַמְתִּי പ്രയോഗം
  choice: അവരെ ഉണ്ടാക്കിയതിൽ ഞാൻ ഖേദിക്കുന്നു
  alternative: അവരെ ഉണ്ടാക്കിയതിൽ എനിക്ക് ദുഃഖമുണ്ട്
  rationale: മുൻപ് ചെയ്ത പ്രവൃത്തിയെക്കുറിച്ചുള്ള retrospective regret/sorrow എന്ന ഹീബ്രായിയുടെ ശക്തി ‘ഖേദിക്കുന്നു’ കൂടുതൽ നേരിട്ട് സൂക്ഷിക്കുന്നു. ദൈവം അപ്രതീക്ഷിതമായി അറിഞ്ഞുവെന്നോ ധാർമ്മിക തെറ്റ് ചെയ്തുവെന്നോ വാചകം സ്വയം പറയുന്നില്ല; എന്നാൽ ആ ദൈവശാസ്ത്ര പിരിമുറുക്കം വിവർത്തനം നീക്കം ചെയ്യുന്നുമില്ല.
- issue: הָאָדָם എന്നതിന്റെ കൂട്ടായ അർഥം
  choice: മനുഷ്യരെ
  alternative: മനുഷ്യവർഗത്തെ
  rationale: ഇവിടെ പദം കൂട്ടായ മനുഷ്യരാശിയെ സൂചിപ്പിക്കുന്നു. ജീവിവർഗങ്ങളുടെ തുടർപ്പട്ടികയോട് മലയാളത്തിലെ ‘മനുഷ്യരെ’ കൂടുതൽ സ്വാഭാവികമായി ചേരുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഹീബ്രായിലെ തുടച്ചുനീക്കൽ എന്ന ദൃശ്യബിംബവും ജീവിവർഗങ്ങളുടെ ക്രമാനുസൃത പട്ടികയും ദൈവിക ഖേദത്തിന്റെ യഥാർഥ പിരിമുറുക്കവും സംരക്ഷിച്ചു.
