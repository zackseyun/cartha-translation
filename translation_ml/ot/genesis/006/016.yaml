  yaml_path: translation/ot/genesis/006/016.yaml
  text: You shall make a roof for the ark[a], and finish it to within a cubit from above. And you shall set the ark’s door in its side. You shall make it with lower, second[d][c][b], and third levels.
translation:
  language: ml
  text: പെട്ടകത്തിന് ഒരു മേൽക്കൂര ഉണ്ടാക്കണം[a]. മുകൾഭാഗത്ത് ഒരു മുഴം അളവിലേക്കു അതിനെ പൂർത്തിയാക്കണം[b]. പെട്ടകത്തിന്റെ വാതിൽ അതിന്റെ വശത്ത് വെക്കണം. താഴത്തെ, രണ്ടാമത്തെ, മൂന്നാമത്തെ നിലകളായി അതിനെ ഉണ്ടാക്കണം[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ജനൽ’ അല്ലെങ്കിൽ ‘മേൽവെളിച്ചത്തിനുള്ള തുറവ്.’ എബ്രായപദം അപൂർവമായതിനാൽ അതിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘മുകൾഭാഗത്ത് ഒരു മുഴം അളവിലേക്കു അതിനെ പൂർത്തിയാക്കണം’ എന്ന എബ്രായപ്രയോഗം ദുഷ്കരമാണ്. പെട്ടകത്തിന്റെ മുകൾഭാഗം ഒരു മുഴം അളവിലേക്കു ചുരുങ്ങിവരുന്നതോ, മുകളിൽ ഒരു മുഴം അളവിൽ പൂർത്തിയാകുന്നതോ ഇതു സൂചിപ്പിച്ചേക്കാം.
    reason: textual_or_syntactic_difficulty
  - marker: c
    text: ‘നിലകൾ’ എന്നതിനു പകരം ‘തട്ടുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹהַר
  choice: മേൽക്കൂര
  rationale: അപൂർവമായ ഈ എബ്രായപദത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്. തുടർന്നുള്ള മുകൾഭാഗത്തെക്കുറിച്ചുള്ള നിർദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘മേൽക്കൂര’ യോജിക്കുന്നു; ‘ജനൽ’ അല്ലെങ്കിൽ ‘മേൽവെളിച്ചപ്പാളി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: תַּעֲשֶׂה לַתֵּבָה
  choice: പെട്ടകത്തിന് ... ഉണ്ടാക്കണം
  rationale: עשה എന്ന ക്രിയയോടുകൂടിയ ל പെട്ടകത്തിനുവേണ്ടി നിർമിക്കേണ്ട ഘടകത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ഘടന സ്വാഭാവികമാണ്.
- source_word: וְאֶל אַמָּה תְּכַלֶנָּה מִלְמַעְלָה
  choice: മുകളിൽ അത് ഒരു മുഴംവരെ പൂർത്തിയാക്കണം
  rationale: כלה എന്ന പീയേൽ രൂപത്തിന് ‘പൂർത്തിയാക്കുക’ എന്നാണ് അർഥം. വാക്യഘടന ദുഷ്കരമായതിനാൽ പെട്ടകത്തിന്റെ കൃത്യമായ രൂപം നിർണയിക്കാതെ ‘ഒരു മുഴംവരെ’ എന്നു നൽകി അവ്യക്തത സംരക്ഷിക്കുന്നു.
- source_word: פֶּתַח
  choice: വാതിൽ
  rationale: പെട്ടകനിർമാണത്തിന്റെ പശ്ചാത്തലത്തിൽ പ്രവേശനത്തിനുള്ള തുറവിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന പദം.
- source_word: בְּצִדָּהּ
  choice: അതിന്റെ പാർശ്വത്തിൽ
  rationale: בְּ + צַד പെട്ടകത്തിന്റെ വശത്തുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു; ‘പാർശ്വത്തിൽ’ ഔപചാരികവും വ്യക്തവുമാണ്.
- source_word: תַּחְתִּיִּם שְׁנִיִּם וּשְׁלִשִׁים
  choice: താഴത്തെയും രണ്ടാമത്തെയും മൂന്നാമത്തെയും നിലകൾ
  rationale: മൂന്നു ലംബതലങ്ങളെയാണ് രൂപങ്ങൾ സൂചിപ്പിക്കുന്നത്. കപ്പലിനോടു മാത്രം ബന്ധപ്പെടുന്ന പദം ഒഴിവാക്കി ‘നിലകൾ’ എന്ന നിഷ്പക്ഷമായ പദം തെരഞ്ഞെടുത്തു.
- source_word: תַּעֲשֶׂהָ
  choice: അതിനെ ഉണ്ടാക്കണം
  rationale: സ്ത്രീലിംഗ പ്രത്യയം പെട്ടകത്തിലേക്കു മടങ്ങുന്നു; മലയാളത്തിൽ കർമം വ്യക്തമാക്കി നൽകിയിരിക്കുന്നു.
