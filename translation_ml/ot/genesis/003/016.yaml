id: GEN.3.16
reference: Genesis 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶֽל הָ/אִשָּׁ֣ה אָמַ֗ר הַרְבָּ֤ה אַרְבֶּה֙ עִצְּבוֹנֵ֣/ךְ וְ/הֵֽרֹנֵ֔/ךְ בְּ/עֶ֖צֶב תֵּֽלְדִ֣י בָנִ֑ים וְ/אֶל אִישֵׁ/ךְ֙ תְּשׁ֣וּקָתֵ֔/ךְ וְ/ה֖וּא יִמְשָׁל בָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/016.yaml
  text: To the woman he said[a], “I will greatly multiply your pain and your conception; in pain you will bear children. Your desire will be for your husband[c][b], and he will rule over you.”
translation:
  language: ml
  text: 'സ്ത്രീയോട് അവൻ പറഞ്ഞു: “നിന്റെ വേദനയും നിന്റെ ഗർഭധാരണവും ഞാൻ വളരെ വർധിപ്പിക്കും; വേദനയോടെ നീ മക്കളെ പ്രസവിക്കും.[a] നിന്റെ ഭർത്താവിനോടായിരിക്കും നിന്റെ ആഗ്രഹം,[b] അവൻ നിന്നെ ഭരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഗർഭധാരണം” എന്നതിനുപകരം “ഗർഭാവസ്ഥ” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പദത്തിന് രണ്ടർത്ഥങ്ങളും വരാം. “മക്കൾ” എന്നതിന്റെ അക്ഷരാർഥം “പുത്രന്മാർ” എന്നാണ്; ഇവിടെ അത് പൊതുവായി സന്തതിയെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: “ആഗ്രഹം” എന്നതിനു “വാഞ്ഛ” എന്നും പറയാം. അപൂർവമായ ഈ ഹീബ്രു പദത്തിന് വിശാലമായ അർത്ഥമുണ്ടാകാം. ചിലർ അതിനെ നിയന്ത്രിക്കാനുള്ള ആഗ്രഹമായി വ്യാഖ്യാനിക്കുന്നു (ഉല്പത്തി 4:7 താരതമ്യം ചെയ്യുക); മറ്റുചിലർ ബന്ധപരമോ ലൈംഗികമോ ആയ വാഞ്ഛയായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: സ്ത്രീ
  rationale: വിധിപ്രഖ്യാപനത്തിന്റെ ഈ സന്ദർഭത്തിൽ സ്ത്രീയെയാണ് അഭിസംബോധന ചെയ്യുന്നത്; പിന്നീടുള്ള אִישֵׁךְ ദാമ്പത്യബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַרְבָּה אַרְבֶּה
  choice: ഞാൻ അത്യന്തം വർധിപ്പിക്കും
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും പരിമിതക്രിയയും ചേർന്ന പ്രയോഗത്തിലെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עִצְּבוֹנֵךְ
  choice: നിന്റെ വേദന
  rationale: പദത്തിന് വേദന, കഷ്ടപ്പാട്, അധ്വാനം എന്നീ അർത്ഥങ്ങൾ വരാമെങ്കിലും പ്രസവസന്ദർഭത്തിൽ ‘വേദന’ ഏറ്റവും അനുയോജ്യം.
- source_word: וְהֵרֹנֵךְ
  choice: ഗർഭധാരണം
  rationale: പദം ഗർഭധാരണമോ ഗർഭാവസ്ഥയോ സൂചിപ്പിക്കാം; മുഖ്യപാഠത്തിൽ രൂപപരമായി അടുത്ത ‘ഗർഭധാരണം’ സ്വീകരിച്ചു.
- source_word: בְּעֶצֶב
  choice: വേദനയോടെ
  rationale: പ്രസവത്തിന്റെ സാഹചര്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תֵּלְדִי בָנִים
  choice: നീ മക്കളെ പ്രസവിക്കും
  rationale: בָנִים അക്ഷരാർഥത്തിൽ ‘പുത്രന്മാർ’ എന്നാണെങ്കിലും ഇവിടെ പൊതുവായി സന്തതിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മക്കൾ’ യോജിക്കുന്നു.
- source_word: אִישֵׁךְ
  choice: നിന്റെ ഭർത്താവ്
  rationale: സ്ത്രീയോടുള്ള ബന്ധത്തിൽ אִישׁ ഇവിടെ സാധാരണയായി ‘ഭർത്താവ്’ എന്നാണ്.
- source_word: תְּשׁוּקָתֵךְ
  choice: നിന്റെ ആഗ്രഹം
  rationale: അപൂർവവും അർത്ഥവിവാദമുള്ളതുമായ പദത്തിന്റെ ലൈംഗിക, ബന്ധപര, നിയന്ത്രണപര വ്യാഖ്യാനങ്ങളിൽ ഒന്നും മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കാതെ വിശാലമായ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: יִמְשָׁל בָּךְ
  choice: അവൻ നിന്നെ ഭരിക്കും
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള ‘ഭരിക്കുക’ എന്ന അർത്ഥം നൽകുന്നു; ‘ആധിപത്യം പുലർത്തുക’ പോലുള്ള കൂടുതൽ ശക്തമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ഭർത്താവിനോടുള്ള സ്ത്രീയുടെ ‘ആഗ്രഹം’ എന്താണ്
  choice: ‘ആഗ്രഹം’ എന്ന് വിശാലമായി പരിഭാഷപ്പെടുത്തി അർത്ഥസന്ദിഗ്ധത നിലനിർത്തി.
  alternative: ലൈംഗിക ആഗ്രഹം; ബന്ധപരമായ വാഞ്ഛയോ ആശ്രയമോ; ഉല്പത്തി 4:7-നോടു സമാന്തരമായി നിയന്ത്രിക്കാനുള്ള ആഗ്രഹം.
  rationale: תְּשׁוּקָה വളരെ അപൂർവമായ പദമാണ്; സന്ദർഭം ഒരൊറ്റ സൂക്ഷ്മാർഥം നിർബന്ധിക്കുന്നില്ല.
- issue: ‘അവൻ നിന്നെ ഭരിക്കും’ എന്നത് നിർദേശമാണോ വിവരണമാണോ
  choice: വീഴ്ചയ്ക്കുശേഷം സംഭവിക്കാനിരിക്കുന്ന അവസ്ഥയുടെ വിവരണമായി വിവർത്തനം ചെയ്തു.
  alternative: പുരുഷാധികാരത്തിനുള്ള പരോക്ഷ നിർദേശം.
  rationale: ഹീബ്രു ക്രിയാരൂപം എന്ത് സംഭവിക്കുമെന്ന് പറയുന്നു; എന്ത് സംഭവിക്കണം എന്ന വിധിനിർദേശം സ്വതവേ പ്രകടിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് അപൂർവപദത്തിന്റെ അർത്ഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
