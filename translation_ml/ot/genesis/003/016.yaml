revisions:
- from: 'സ്ത്രീയോട് അവൻ പറഞ്ഞു: “നിന്റെ വേദനയും ഗർഭധാരണവും ഞാൻ അത്യന്തം വർധിപ്പിക്കും; വേദനയോടെ നീ മക്കളെ പ്രസവിക്കും.[a] നിന്റെ ഭർത്താവിനോടായിരിക്കും നിന്റെ ആഗ്രഹം,[b] അവൻ നിന്നെ ഭരിക്കും.”'
  to: 'സ്ത്രീയോട് അവൻ പറഞ്ഞു: “നിന്റെ വേദനയും നിന്റെ ഗർഭധാരണവും ഞാൻ വളരെ വർധിപ്പിക്കും; വേദനയോടെ നീ മക്കളെ പ്രസവിക്കും.[a] നിന്റെ ഭർത്താവിനോടായിരിക്കും നിന്റെ ആഗ്രഹം,[b] അവൻ നിന്നെ ഭരിക്കും.”'
  rationale: മുഖ്യപാഠത്തിന്റെ അർഥവും അടിക്കുറിപ്പ്-ആങ്കറുകളും നിലനിർത്തി, ആദ്യവാക്യത്തിലെ മലയാളശൈലി മാത്രം സ്വാഭാവികമാക്കി. ‘ആഗ്രഹം’ എന്ന പദത്തിന്റെ അർത്ഥസന്ദിഗ്ധതയും ‘അവൻ നിന്നെ ഭരിക്കും’ എന്ന വിവരണാത്മക പ്രയോഗവും മാറ്റിയിട്ടില്ല.
