source:
  edition: WLC
  text: וְ/אֵיבָ֣ה אָשִׁ֗ית בֵּֽינְ/ךָ֙ וּ/בֵ֣ין הָֽ/אִשָּׁ֔ה וּ/בֵ֥ין זַרְעֲ/ךָ֖ וּ/בֵ֣ין זַרְעָ֑/הּ ה֚וּא יְשׁוּפְ/ךָ֣ רֹ֔אשׁ וְ/אַתָּ֖ה תְּשׁוּפֶ֥/נּוּ עָקֵֽב׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/015.yaml
  text: And I will put enmity[a] between you and the woman, and between your seed[b] and her seed; he will crush your head[c][d], and you will bruise his heel.
translation:
  language: ml
  text: ഞാൻ നിനക്കും സ്ത്രീക്കും ഇടയിലും നിന്റെ സന്തതിക്കും[b] അവളുടെ സന്തതിക്കും ഇടയിലും ശത്രുത[a] ഉണ്ടാക്കും; അവൻ[c] നിന്റെ തല തകർക്കും[d], നീ അവന്റെ കുതികാലിന് പരിക്കേൽപ്പിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘വിരോധം.’
    reason: lexical_alternative
  - marker: b
    text: ഇരുവിടത്തും ഹീബ്രായിൽ അക്ഷരാർഥം ‘വിത്ത്.’ ഈ പദത്തിന് കൂട്ടമായി പിൻതലമുറയെയോ അതിനെ പ്രതിനിധാനം ചെയ്യുന്ന ഒരൊറ്റ വ്യക്തിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ ‘അത്.’ കൂട്ടനാമമായ ‘സന്തതി’യെ തുടർന്ന് ഹീബ്രായിൽ പുല്ലിംഗ ഏകവചന സർവനാമമാണ് വരുന്നത്.
    reason: alternative_reading
  - marker: d
    text: രണ്ടു വാക്യഭാഗങ്ങളിലും ഹീബ്രായിൽ ഒരേ ക്രിയയാണ്. അതിന് ‘പ്രഹരിക്കുക,’ ‘ചതയ്ക്കുക,’ അല്ലെങ്കിൽ ‘പരിക്കേൽപ്പിക്കുക’ എന്നിങ്ങനെ പരിഭാഷ നൽകാം; തലയ്ക്കേൽക്കുന്ന പ്രഹരം കൂടുതൽ ഗുരുതരമാണെന്ന സൂചനയാണ് ആദ്യഭാഗത്ത് ‘തകർക്കും’ എന്നു നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיבָה
  choice: ശത്രുത
  rationale: സജീവവും നിലനിൽക്കുന്നതുമായ വിരോധത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപദം.
- source_word: אָשִׁית
  choice: ഉണ്ടാക്കും
  rationale: ‘വെക്കും/സ്ഥാപിക്കും’ എന്ന അക്ഷരാർഥത്തെക്കാൾ ബന്ധങ്ങൾക്കിടയിൽ ശത്രുത വരുത്തുന്നതിനെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בֵּינְךָ ... וּבֵין הָאִשָּׁה
  choice: നിനക്കും സ്ത്രീക്കും മധ്യേ
  rationale: ഹീബ്രായിലെ ബന്ധസൂചക ഘടനയും സമാന്തരതയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: זַרְעֲךָ ... זַרְעָהּ
  choice: നിന്റെ സന്തതി ... അവളുടെ സന്തതി
  rationale: ‘വിത്ത്’ എന്ന അക്ഷരാർഥത്തേക്കാൾ മനുഷ്യരുടെയോ ജീവികളുടെയോ പിൻതലമുറയെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഏകവചന പ്രതിനിധിയെയും സമൂഹമായ പിൻതലമുറയെയും ഉൾക്കൊള്ളാവുന്ന ഹീബ്രായിലെ കൂട്ടനാമസ്വഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: הוּא
  choice: അവൻ
  rationale: കൂട്ടനാമമായ זֶרַע-നെ തുടർന്ന് വരുന്ന പുല്ലിംഗ ഏകവചന സർവനാമത്തിന്റെ രൂപം സംരക്ഷിക്കുകയും പ്രതിനിധിയായ ഒരു വ്യക്തിയിലേക്കുള്ള സാധ്യത തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
- source_word: יְשׁוּפְךָ ... תְּשׁוּפֶנּוּ
  choice: തകർക്കും ... പരിക്കേൽപ്പിക്കും
  rationale: രണ്ടിടത്തും ഒരേ അപൂർവ ഹീബ്രായ ക്രിയയാണെങ്കിലും തലക്കും കുതികാലിനും ഏൽക്കുന്ന പ്രഹരങ്ങളുടെ വ്യത്യസ്ത ഗൗരവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ക്രിയയുടെ ആവർത്തനം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: רֹאשׁ
  choice: തല
  rationale: ശരീരഭാഗത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള സമാനപദം.
- source_word: עָקֵב
  choice: കുതികാൽ
  rationale: ശരീരഭാഗത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള സമാനപദം.
theological_decisions:
- issue: സ്ത്രീയുടെ ‘സന്തതി’ കൂട്ടമായ പിൻതലമുറയെയോ പ്രതിനിധിയായ ഒരൊറ്റ വ്യക്തിയെയോ സൂചിപ്പിക്കുന്നുവോ എന്നത്
  choice: രണ്ടിടത്തും ‘സന്തതി’ എന്നും തുടർന്നുള്ള הוּא എന്ന സർവനാമം ‘അവൻ’ എന്നും പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പിൻതലമുറ’ അല്ലെങ്കിൽ ‘അവർ’ എന്നു പൂർണമായി കൂട്ടാർഥത്തിൽ പരിഭാഷപ്പെടുത്തുക.
  rationale: ഹീബ്രായിലെ זֶרַע ഒരു കൂട്ടനാമമാണ്; അതിനെ തുടർന്ന് പുല്ലിംഗ ഏകവചന സർവനാമം വരുന്നു. മുഖ്യവാചകം വ്യക്തിപരമായ സാധ്യത നിലനിർത്തുമ്പോൾ അടിക്കുറിപ്പ് കൂട്ടാർഥവും തുറന്നുവയ്ക്കുന്നു; പ്രത്യേകമായ ഒരു മെസ്സിയാനിക വ്യാഖ്യാനം പരിഭാഷയിൽ നിർബന്ധിക്കുന്നില്ല.
- issue: שׁוּף എന്ന ക്രിയയുടെ ശക്തി എങ്ങനെ പ്രകടിപ്പിക്കണം
  choice: തലയെ സംബന്ധിച്ചിടത്ത് ‘തകർക്കും’ എന്നും കുതികാലിനെ സംബന്ധിച്ചിടത്ത് ‘പരിക്കേൽപ്പിക്കും’ എന്നും ഉപയോഗിച്ചു.
  alternative: രണ്ടിടത്തും ‘പ്രഹരിക്കും’ അല്ലെങ്കിൽ ‘ചതയ്ക്കും’ എന്ന് ഒരേ പദം ഉപയോഗിക്കുക.
  rationale: മൂലത്തിൽ ഒരേ അപൂർവ ക്രിയ ആവർത്തിക്കുന്നുവെങ്കിലും തലയും കുതികാലും എന്ന വ്യത്യസ്ത കർമങ്ങൾ ഫലത്തിന്റെ ഗൗരവത്തിൽ അസമത്വം സൂചിപ്പിക്കുന്നു. മുഖ്യവാചകം ആ അസമത്വം അറിയിക്കുകയും അടിക്കുറിപ്പ് മൂലത്തിലെ ഒരേ ക്രിയയെ സുതാര്യമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സന്തതി’ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ ഹീബ്രായിലെ കൂട്ടാർഥവും ഏകവചന പ്രതിനിധിയുടെ സാധ്യതയും വഹിക്കുന്നു. ആവർത്തിച്ച ‘മധ്യേ’ എന്ന ഘടന മൂലത്തിലെ സമാന്തരത നിലനിർത്തുന്നു.
