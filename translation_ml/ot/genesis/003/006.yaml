id: GEN.3.6
reference: Genesis 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֣רֶא הָֽ/אִשָּׁ֡ה כִּ֣י טוֹב֩ הָ/עֵ֨ץ לְ/מַאֲכָ֜ל וְ/כִ֧י תַֽאֲוָה ה֣וּא לָ/עֵינַ֗יִם וְ/נֶחְמָ֤ד הָ/עֵץ֙ לְ/הַשְׂכִּ֔יל וַ/תִּקַּ֥ח מִ/פִּרְי֖/וֹ וַ/תֹּאכַ֑ל וַ/תִּתֵּ֧ן גַּם לְ/אִישָׁ֛/הּ עִמָּ֖/הּ וַ/יֹּאכַֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/006.yaml
  text: So the woman saw that the tree was good for food[a], and that it was a delight to the eyes, and that the tree was desirable to make one wise. So she took from its fruit and ate, and she also gave some to her husband, who was with her[b], and he ate.
translation:
  language: ml
  text: ആ വൃക്ഷം ഭക്ഷിക്കാൻ നല്ലതും കാണാൻ ആകർഷകമായതും[a] ജ്ഞാനിയാക്കാൻ ആഗ്രഹിക്കത്തക്കതും[b] ആണെന്ന് സ്ത്രീ കണ്ടു. അപ്പോൾ അവൾ അതിന്റെ ഫലത്തിൽനിന്ന് എടുത്ത് തിന്നു. തന്നോടുകൂടെ ഉണ്ടായിരുന്ന ഭർത്താവിനും അതിൽനിന്ന് കുറെ കൊടുത്തു; അവനും തിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കണ്ണുകൾക്ക് ഇമ്പമായത്’ അല്ലെങ്കിൽ ‘കണ്ണുകളെ ആകർഷിക്കുന്നത്.’ ഹീബ്രു പ്രയോഗം വൃക്ഷത്തിന്റെ ദൃശ്യാകർഷണത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ജ്ഞാനം നേടാൻ’ അല്ലെങ്കിൽ ‘വിവേകം നൽകാൻ.’ ഹീബ്രു ക്രിയ ജ്ഞാനിയാകുന്നതെയോ ജ്ഞാനം/വിവേകം നൽകുന്നതെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: കണ്ടു
  rationale: കാണുക എന്ന അടിസ്ഥാന ആഖ്യാനാർഥം നിലനിർത്തുന്നു; വെറും നോക്കലിനേക്കാൾ അവൾ നടത്തിയ വിലയിരുത്തലുകളുടെ ഉള്ളടക്കവും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: טוֹב ... לְמַאֲכָל
  choice: ഭക്ഷിക്കാൻ നല്ലത്
  rationale: വൃക്ഷം ഭക്ഷണത്തിന് അനുയോജ്യമാണെന്ന സ്ത്രീയുടെ വിലയിരുത്തൽ ലളിതവും നേരിട്ടുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: תַאֲוָה ... לָעֵינַיִם
  choice: കണ്ണുകൾക്ക് ആനന്ദകരം
  rationale: ദൃശ്യാകർഷണം വ്യക്തമാക്കുന്നു; ഈ ഘട്ടത്തിൽ ‘മോഹം’ പോലുള്ള ശക്തമായ ധാർമ്മിക നിഷേധാർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: וְנֶחְמָד
  choice: അഭിലഷണീയം
  rationale: ആകർഷകമോ ആഗ്രഹിക്കത്തക്കതോ എന്ന പങ്കാളിക്രിയയുടെ ഭാവം ഔന്നത്യമുള്ളതും മനസ്സിലാക്കാൻ എളുപ്പമുള്ളതുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: לְהַשְׂכִּיל
  choice: ജ്ഞാനം നേടാൻ
  rationale: വിവേകമോ ജ്ഞാനമോ നേടുക എന്ന ലക്ഷ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വൃക്ഷം ജ്ഞാനം നൽകുന്നു എന്ന കാരണാർഥവും സാധ്യമാണെന്ന് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מִפִּרְיוֹ
  choice: അതിന്റെ പഴത്തിൽനിന്ന്
  rationale: מן എന്ന ഉപസർഗത്തിന്റെ ‘നിന്ന്’ എന്ന അർഥവും ഫലത്തിന്റെ സമൂഹവാചകസ്വഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: וַתִּתֵּן גַּם לְאִישָׁהּ עִמָּהּ
  choice: തന്നോടുകൂടെ ഉണ്ടായിരുന്ന ഭർത്താവിനും കുറെ കൊടുത്തു
  rationale: גַּם എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽ ‘-ഉം’കൊണ്ട് പ്രകടമാക്കുകയും עִמָּהּ എന്ന പ്രധാന ആഖ്യാനവിവരം ഭർത്താവിനോടു ബന്ധപ്പെടുത്തി വ്യക്തമാക്കുകയും ചെയ്യുന്നു. ഒഴിവായിരിക്കുന്ന കർമം സന്ദർഭാനുസൃതമായി ‘കുറെ’ എന്നു സ്വാഭാവികമാക്കുന്നു.
theological_decisions:
- issue: സ്ത്രീയുടെ വിലയിരുത്തലിന് നൽകുന്ന ധാർമ്മിക നിറം
  choice: ‘നല്ലത്,’ ‘ആനന്ദകരം,’ ‘അഭിലഷണീയം’ എന്നീ താരതമ്യേന നിഷ്പക്ഷ പദങ്ങൾ ഉപയോഗിച്ചു.
  alternative: ‘മോഹിപ്പിക്കുന്നത്,’ ‘ദുഷ്ടമായ കൊതി ഉണർത്തുന്നത്’ തുടങ്ങിയ വ്യക്തമായ നിഷേധാർഥമുള്ള പദങ്ങൾ ഉപയോഗിക്കുക.
  rationale: ഹീബ്രു വാക്യം ആദ്യം സ്ത്രീയുടെ അനുകൂല വിലയിരുത്തലാണ് വിവരിക്കുന്നത്; അനുസരണക്കേടിനെക്കുറിച്ചുള്ള ധാർമ്മിക വിധി വിവരണപദങ്ങളിൽ മുൻകൂട്ടി ചേർക്കരുത്.
- issue: לְהַשְׂכִּיל എന്നതിന്റെ കർത്തൃ-കാരണാർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘ജ്ഞാനം നേടാൻ’ എന്നു നൽകി, മറ്റൊരു സാദ്ധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
  alternative: ‘ഒരാളെ ജ്ഞാനിയാക്കാൻ’ അല്ലെങ്കിൽ ‘ജ്ഞാനം നൽകാൻ’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: ഹിഫിൽ രൂപത്തിന് ജ്ഞാനം/വിവേകം നേടുക എന്ന ആശയവും അത് നൽകുക എന്ന കാരണാർഥവും ഇവിടെ സാദ്ധ്യമാണ്; പ്രധാനവാചകം സ്വാഭാവികമാക്കി യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ഭർത്താവിന്റെ സാന്നിധ്യം
  choice: עִמָּהּ എന്നത് ‘തന്നോടുകൂടെ ഉണ്ടായിരുന്ന’ എന്നു വ്യക്തമായി ഭർത്താവിനോടു ബന്ധപ്പെടുത്തി.
  alternative: ‘തന്നോടുകൂടെ ഭർത്താവിനും’ എന്ന കൂടുതൽ പദാനുപദരൂപം.
  rationale: ഹീബ്രു പാഠം ഭർത്താവ് അവളോടുകൂടെ ഉണ്ടായിരുന്നുവെന്ന് പറയുന്നു; സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ ഈ ആഖ്യാനവിവരം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സ്ത്രീ,’ ‘ഭർത്താവ്,’ ‘ജ്ഞാനം’ എന്നീ പൊതുവായി ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. ബന്ധകങ്ങളുടെ അമിത ആവർത്തനം ഒഴിവാക്കി ഹീബ്രുവിലെ വിലയിരുത്തലുകളുടെ ക്രമവും പ്രവൃത്തികളുടെ തുടർച്ചയും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് കരടിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവയുടെ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, [a] ദൃശ്യാകർഷണവാക്യത്തോടും [b] ജ്ഞാനവാക്യത്തോടും ചേർത്തു.
