source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הַ/נָּחָ֖שׁ אֶל הָֽ/אִשָּׁ֑ה לֹֽא מ֖וֹת תְּמֻתֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/004.yaml
  text: But the serpent said to the woman[b][a], “You will not surely die.”
translation:
  language: ml
  text: 'എന്നാൽ സർപ്പം സ്ത്രീയോടു പറഞ്ഞു: “നിങ്ങൾ തീർച്ചയായും മരിക്കുകയില്ല.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘മരിക്കുക’ എന്ന ക്രിയയുടെ ഊന്നൽരൂപവും സാധാരണ ക്രിയാരൂപവും ചേർന്ന ഘടനയാണ്; അതിനാൽ അർഥം ‘നിങ്ങൾ തീർച്ചയായും മരിക്കുകയില്ല’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ഇവിടെ സർപ്പത്തിന്റെ വാക്ക് മുൻപുള്ള ദൈവിക മുന്നറിയിപ്പിനെ നേരിട്ട് നിഷേധിക്കുന്നതിനാൽ വൈരുധ്യസൂചകമായ ‘എന്നാൽ’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: הַנָּחָשׁ
  choice: സർപ്പം
  rationale: נָחָשׁ എന്നത് പാമ്പ്/സർപ്പം എന്നർഥം നൽകുന്നു. ഈ ആഖ്യാനത്തിലെ സാഹിത്യപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്ന മാന്യവും പരിചിതവുമായ പദമാണ് ‘സർപ്പം’.
- source_word: הָאִשָּׁה
  choice: സ്ത്രീ
  rationale: אִשָּׁה എന്നതിന് സ്ത്രീ എന്നും ഭാര്യ എന്നും അർഥമാകാം; ഉല്പത്തി 2–3-ലെ ആവർത്തിത ആഖ്യാനപ്രയോഗം പിന്തുടരാൻ ‘സ്ത്രീ’ തിരഞ്ഞെടുത്തു.
- source_word: לֹא מוֹת תְּמֻתוּן
  choice: നിങ്ങൾ തീർച്ചയായും മരിക്കുകയില്ല
  rationale: ക്രിയാനാമത്തിന്റെ പൂർണ്ണരൂപവും പരിമിതക്രിയയും ചേർന്ന ഘടന മരണത്തിന്റെ ഉറപ്പ് ഊന്നുന്നു; לֹא അതിനെ നിഷേധിക്കുന്നതിനാൽ മലയാളത്തിൽ സർപ്പത്തിന്റെ സമ്പൂർണ്ണവും ഊന്നലോടെയുള്ളതുമായ നിഷേധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന രൂപമാണിത്. ദ്വിതീയപുരുഷ ബഹുവചനം ‘നിങ്ങൾ’ ആയി നിലനിർത്തി.
theological_decisions:
- issue: സർപ്പത്തിന്റെ നിഷേധത്തിന്റെ ശക്തി
  choice: “നിങ്ങൾ തീർച്ചയായും മരിക്കുകയില്ല” എന്ന നേരിട്ടും ഊന്നലോടെയുമുള്ള നിഷേധം
  alternative: “നിങ്ങൾ മരിക്കുകയില്ല” എന്ന ഊന്നൽ കുറഞ്ഞ രൂപം
  rationale: לֹא + ക്രിയാനാമത്തിന്റെ പൂർണ്ണരൂപം + പരിമിതക്രിയ എന്ന എബ്രായ ഘടന മുൻ മുന്നറിയിപ്പിനെ ശക്തമായി നിഷേധിക്കുന്നു. മരണം ഉടനെയോ പിന്നീടോ എന്ന വ്യാഖ്യാനം വിവർത്തനത്തിൽ ചേർക്കാതെ ഈ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ബഹുവചന ‘നിങ്ങൾ’യും നിഷേധത്തിന്റെ ഊന്നലും സംരക്ഷിച്ചു; അനാവശ്യ വ്യാഖ്യാനം ഒഴിവാക്കി.
