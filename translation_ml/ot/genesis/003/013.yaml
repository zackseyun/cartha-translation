id: GEN.3.13
reference: Genesis 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֧ה אֱלֹהִ֛ים לָ/אִשָּׁ֖ה מַה זֹּ֣את עָשִׂ֑ית וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה הַ/נָּחָ֥שׁ הִשִּׁיאַ֖/נִי וָ/אֹכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/013.yaml
  text: Then Yahweh God said to the woman[a], “What is this you have done?” And the woman said, “The serpent deceived me, and I ate.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ ദൈവം സ്ത്രീയോടു ചോദിച്ചു: “നീ എന്താണ് ഈ ചെയ്തത്?” സ്ത്രീ പറഞ്ഞു: “സർപ്പം എന്നെ വഞ്ചിച്ചു[a]; ഞാൻ തിന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കബളിപ്പിച്ചു’ അല്ലെങ്കിൽ ‘വഴിതെറ്റിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ക്രിയ വഞ്ചിക്കുകയോ തെറ്റിദ്ധരിപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ഹീബ്രു ഉച്ചാരണത്തിന്റെ സാധാരണ പുനർനിർമാണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: יְהוָה אֱלֹהִים എന്ന സംയുക്തപ്രയോഗത്തിൽ ദൈവനാമത്തോടൊപ്പം സ്വാഭാവികവും വ്യക്തവുമായ മലയാള പദം ഉപയോഗിച്ചു.
- source_word: לָאִשָּׁה
  choice: സ്ത്രീയോട്
  rationale: אִשָּׁה എന്നതിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാമെങ്കിലും, ഈ സംഭാഷണത്തിലെ ആഖ്യാനപരമായ പരാമർശത്തിന് ‘സ്ത്രീ’ എന്നതാണ് ഏറ്റവും യോജിച്ചത്.
- source_word: מַה זֹּאת עָשִׂית
  choice: നീ ചെയ്ത ഈ കാര്യം എന്താണ്?
  rationale: ചോദ്യപദമായ מַהയും സൂചകപദമായ זֹּאתും നിലനിർത്തിക്കൊണ്ട്, അതിനെ ‘എന്തിന്’ എന്ന കാരണചോദ്യമായി വ്യാഖ്യാനിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: הַנָּחָשׁ
  choice: സർപ്പം
  rationale: ‘പാമ്പ്’ എന്നതും സാധ്യമാണെങ്കിലും, ഉല്പത്തി 3-ലെ കഥാപാത്രത്തിന്റെ സാഹിത്യപരമായ ഗൗരവം നിലനിർത്തുന്ന, മലയാളത്തിൽ പരിചിതമായ പദമാണ് ‘സർപ്പം’.
- source_word: הִשִּׁיאַנִי
  choice: എന്നെ വഞ്ചിച്ചു
  rationale: ക്രിയയുടെ മുഖ്യമായ അർഥമായ വഞ്ചിക്കൽ/തെറ്റിദ്ധരിപ്പിക്കൽ വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകി; പ്രത്യേകമായ മറ്റൊരു പ്രേരണാഭാവം ചേർത്തിട്ടില്ല.
- source_word: וָאֹכֵל
  choice: ഞാൻ തിന്നുകയും ചെയ്തു
  rationale: ഹീബ്രുവിലെ സംഭവക്രമം നിലനിർത്തി; ‘അതുകൊണ്ട്’ എന്ന കാരണബന്ധം മൂലപാഠത്തിൽ വ്യക്തമായി ഇല്ലാത്തതിനാൽ അത് ചേർത്തില്ല.
theological_decisions:
- issue: സർപ്പത്തിന്റെ പ്രവൃത്തിയെക്കുറിച്ചുള്ള സ്ത്രീയുടെ വിശദീകരണം
  choice: സർപ്പം എന്നെ വഞ്ചിച്ചു
  alternative: സർപ്പം എന്നെ കബളിപ്പിച്ചു / വഴിതെറ്റിച്ചു
  rationale: വാക്യം സർപ്പത്തിന് വഞ്ചന ആരോപിക്കുന്നു. ‘വഞ്ചിച്ചു’ എന്നത് ഹീബ്രുവിന്റെ ധാർമ്മികവും ആഖ്യാനപരവുമായ ശക്തി നിലനിർത്തുമ്പോഴും അനാവശ്യമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: വഞ്ചനയ്ക്കും തിന്നുന്നതിനും ഇടയിലെ ബന്ധം
  choice: 'വാക്യങ്ങളെ ക്രമപരമായി ബന്ധിപ്പിച്ചു: ‘വഞ്ചിച്ചു; ഞാൻ തിന്നുകയും ചെയ്തു’'
  alternative: ‘വഞ്ചിച്ചു; അതുകൊണ്ട് ഞാൻ തിന്നു’
  rationale: ഹീബ്രു וְ/וַ ഘടന സംഭവക്രമം സൂചിപ്പിക്കുന്നു; വ്യക്തമായ കാരണസൂചകം ചേർത്ത് സ്ത്രീയുടെ ഉത്തരത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ വിലയിരുത്തൽ വിവർത്തനത്തിൽ മുൻകൂട്ടി നിശ്ചയിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. നേരിട്ടുള്ള സംഭാഷണം ലളിതമാക്കി; ദൈവനാമം ലിപ്യന്തരിച്ചു; മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത കാരണബന്ധം ചേർത്തില്ല. അടിക്കുറിപ്പ് ചിഹ്നം അതുമായി ബന്ധപ്പെട്ട ‘വഞ്ചിച്ചു’ എന്ന പദത്തിനുശേഷം തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
