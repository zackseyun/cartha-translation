source:
  edition: WLC
  text: וַ/תִּפָּקַ֨חְנָה֙ עֵינֵ֣י שְׁנֵי/הֶ֔ם וַ/יֵּ֣דְע֔וּ כִּ֥י עֵֽירֻמִּ֖ם הֵ֑ם וַֽ/יִּתְפְּרוּ֙ עֲלֵ֣ה תְאֵנָ֔ה וַ/יַּעֲשׂ֥וּ לָ/הֶ֖ם חֲגֹרֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/007.yaml
  text: Then the eyes of both of them were opened[a], and they knew that they were naked[b]. So they sewed fig leaves together and made coverings for themselves.
translation:
  language: ml
  text: അപ്പോൾ ഇരുവരുടെയും കണ്ണുകൾ തുറന്നു; തങ്ങൾ നഗ്നരാണെന്ന് അവർ അറിഞ്ഞു. അതുകൊണ്ട് അവർ അത്തിയിലകൾ തുന്നിച്ചേർത്ത് തങ്ങൾക്കായി അരക്കച്ചകൾ[a] ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “മറകൾ.” എബ്രായപദം അരയ്ക്കു ചുറ്റിക്കെട്ടുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפָּקַחְנָה
  choice: തുറന്നു
  rationale: കണ്ണുകളെ കർത്താവാക്കി പറയുന്ന എബ്രായ നിഫാൽ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; പുതിയ തിരിച്ചറിവിന്റെ സ്വഭാവം വിശദീകരിക്കാതെ മൂലത്തിലെ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: עֵינֵי שְׁנֵיהֶם
  choice: ഇരുവരുടെയും കണ്ണുകൾ
  rationale: രണ്ടുപേരെയും പ്രത്യേകം ഊന്നുന്ന എബ്രായ ഘടന മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וַיֵּדְעוּ
  choice: അവർ അറിഞ്ഞു
  rationale: ידע എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം സംരക്ഷിക്കുന്നു; ‘അവർക്ക് ബോധ്യമായി’ എന്ന വ്യാഖ്യാനാത്മക വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: עֵירֻמִּם
  choice: നഗ്നർ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥവും ഉല്പത്തി 2:25-നോടുള്ള ആഖ്യാനബന്ധവും നിലനിർത്തുന്നു.
- source_word: וַיִּתְפְּרוּ עֲלֵה תְאֵנָה
  choice: അത്തിയിലകൾ തുന്നിച്ചേർത്ത്
  rationale: ഇലകൾ തമ്മിൽ തുന്നി ചേർത്തുവെന്ന പ്രവർത്തനം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: חֲגֹרֹת
  choice: അരക്കച്ചകൾ
  rationale: ശരീരത്തിനു ചുറ്റും കെട്ടുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥം ‘മറകൾ’ എന്ന പൊതുപദത്തേക്കാൾ കൃത്യമായി നൽകുന്നു; എന്നാൽ വസ്ത്രത്തിന്റെ കൃത്യരൂപം നിർണയിക്കാത്തതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: കണ്ണുകൾ തുറന്നതും നഗ്നത അറിഞ്ഞതും തമ്മിലുള്ള ബന്ധം
  choice: സംഭവങ്ങളെ വിവരണാത്മകമായി മാത്രം അവതരിപ്പിച്ചു
  alternative: ‘അവർ ലജ്ജിച്ചു’ അല്ലെങ്കിൽ ‘അവരുടെ മനസ്സാക്ഷി ഉണർന്നു’ എന്നു വ്യാഖ്യാനിച്ച് ചേർക്കുക
  rationale: ലജ്ജയും മാറിയ ധാർമിക സ്വബോധവും സന്ദർഭത്തിൽ സൂചിപ്പിക്കപ്പെടുന്നുണ്ടെങ്കിലും ഈ വാക്യം അവയെ തുറന്നുപറയുന്നില്ല; അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിവർത്തനം തീർപ്പാക്കുന്നില്ല.
- issue: חֲגֹרֹת എന്ന വസ്ത്രപദത്തിന്റെ നിർദിഷ്ടത
  choice: അരക്കച്ചകൾ
  alternative: മറകൾ / ഏപ്രണുകൾ
  rationale: എബ്രായപദം അരയ്ക്കു ചുറ്റിക്കെട്ടുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്നു. ‘അരക്കച്ചകൾ’ മലയാളത്തിൽ ആ അടിസ്ഥാനചിത്രം നൽകുന്നു; കൃത്യമായ വസ്ത്രരൂപം അനിശ്ചിതമായതിനാൽ വിശാലമായ മറ്റൊരു വിവർത്തനം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ‘അപ്പോൾ... അതുകൊണ്ട്’ എന്ന ബന്ധനം ആഖ്യാനത്തിന്റെ ക്രമവും പ്രതികരണവും വ്യക്തമാക്കുന്നു. ‘അത്തിയില’ എന്ന പ്രചാരത്തിലുള്ള സസ്യനാമവും ഗൗരവമുള്ളതും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ വാക്യഘടനയും ഉപയോഗിച്ചു.
