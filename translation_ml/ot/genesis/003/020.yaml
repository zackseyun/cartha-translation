id: GEN.3.20
reference: Genesis 3:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֧א הָֽ/אָדָ֛ם שֵׁ֥ם אִשְׁתּ֖/וֹ חַוָּ֑ה כִּ֛י הִ֥וא הָֽיְתָ֖ה אֵ֥ם כָּל חָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/020.yaml
  text: And the man called his wife's name Eve[b][a], because she was the mother of all the living.
translation:
  language: ml
  text: ആ മനുഷ്യൻ[a] തന്റെ ഭാര്യയ്ക്ക് ഹവ്വാ എന്നു പേരിട്ടു; കാരണം അവൾ ജീവനുള്ള സകലത്തിന്റെയും[b] അമ്മയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ആദാം തന്റെ ഭാര്യയ്ക്ക് ഹവ്വാ എന്നു പേരിട്ടു.” എബ്രായമൂലത്തിൽ നിർദേശകോപപദത്തോടുകൂടി അക്ഷരാർഥത്തിൽ “ആ മനുഷ്യൻ” എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, “ജീവിച്ചിരിക്കുന്ന എല്ലാവരുടെയും” / “ജീവനുള്ള സകലത്തിന്റെയും.” എബ്രായത്തിൽ അക്ഷരാർഥം “ജീവനുള്ള സകലത്തിന്റെയും” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם
  choice: പേരിട്ടു
  rationale: പേര് നൽകുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: הָאָדָם
  choice: മനുഷ്യൻ
  rationale: എബ്രായത്തിൽ നിർദേശകോപപദത്തോടുകൂടിയ പൊതുനാമമാണ് (‘ആ മനുഷ്യൻ’/‘മനുഷ്യൻ’), വ്യക്തിനാമമായ ‘ആദാം’ എന്ന രൂപമല്ല. സന്ദർഭത്തിൽ നിർദിഷ്ടനായ പുരുഷനെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘മനുഷ്യൻ’ സ്വാഭാവികമാണ്.
- source_word: אִשְׁתּוֹ
  choice: തന്റെ ഭാര്യയ്ക്ക്
  rationale: ഇവിടെ אִשָּׁה ആ മനുഷ്യന്റെ ജീവിതപങ്കാളിയെ സൂചിപ്പിക്കുന്നു. പ്രതിഫലനസ്വഭാവമുള്ള ബന്ധം മലയാളത്തിൽ ‘തന്റെ’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: חַוָּה
  choice: ഹവ്വാ
  rationale: חַוָּה എന്ന വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സ്ഥാപിതമായ രൂപം.
- source_word: כִּי
  choice: കാരണം
  rationale: പേരിടലിന്റെ കാരണം അവതരിപ്പിക്കുന്ന വ്യക്തമായ കാരണബന്ധം.
- source_word: הָיְתָה
  choice: ആയിരുന്നു
  rationale: ഇവിടെ היה അവസ്ഥയെ സൂചിപ്പിക്കുന്നതാണ്; ‘ആയിത്തീർന്നു’ എന്ന മാറ്റത്തിന്റെ ആശയം നിർബന്ധമായി വരുത്തുന്നില്ല.
- source_word: אֵם כָּל חָי
  choice: ജീവനുള്ള എല്ലാവരുടെയും അമ്മ
  rationale: ‘ജീവനുള്ള സകലത്തിന്റെയും അമ്മ’ എന്ന അക്ഷരാർഥത്തോട് അടുത്തുനിൽക്കുകയും പരിധി മനുഷ്യരിലേക്കോ സകല ജീവികളിലേക്കോ മാത്രമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: הָאָדָם എന്നത് വ്യക്തിനാമമായ ‘ആദാം’ എന്നോ വിവരണാത്മകമായി ‘മനുഷ്യൻ’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: മനുഷ്യൻ
  alternative: ആദാം
  rationale: മൂലപാഠത്തിലെ നിർദേശകോപപദം വിവരണാത്മക വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എങ്കിലും ഇവിടെ സൂചിപ്പിക്കുന്നത് ആദാം എന്ന വ്യക്തിയെയായതിനാൽ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ‘ജീവനുള്ള എല്ലാവരുടെയും അമ്മ’ എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: പരിധി ചുരുക്കാതെ വിശാലമായ പ്രയോഗം നിലനിർത്തുക
  alternative: എല്ലാ മനുഷ്യരുടെയും അമ്മ / സകല ജീവജാലങ്ങളുടെയും അമ്മ
  rationale: എബ്രായപ്രയോഗം സംക്ഷിപ്തവും പരിധിയിൽ തുറന്നതുമാണ്. ഒരു പ്രത്യേക വ്യാഖ്യാനം പാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതെ ആ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ നാമകരണപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘പേരിട്ടു’ ഉപയോഗിച്ചു; മൂലത്തിലെ അർഥവ്യാപ്തിയും ആദാം/മനുഷ്യൻ എന്ന സത്യസന്ധമായ ദ്വയസാധ്യതയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
