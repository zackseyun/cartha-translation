  to: ആ മനുഷ്യൻ[a] തന്റെ ഭാര്യയ്ക്ക് ഹവ്വാ എന്നു പേരിട്ടു; കാരണം അവൾ ജീവനുള്ള സകലത്തിന്റെയും[b] അമ്മയായിരുന്നു.
