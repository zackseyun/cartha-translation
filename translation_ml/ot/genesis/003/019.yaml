  text: בְּ/זֵעַ֤ת אַפֶּ֨י/ךָ֙ תֹּ֣אכַל לֶ֔חֶם עַ֤ד שֽׁוּבְ/ךָ֙ אֶל הָ֣/אֲדָמָ֔ה כִּ֥י מִמֶּ֖/נָּה לֻקָּ֑חְתָּ כִּֽי עָפָ֣ר אַ֔תָּה וְ/אֶל עָפָ֖ר תָּשֽׁוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/019.yaml
  text: By the sweat of your face you will eat bread until you return to the ground[a], because from it you were taken; for you are dust, and to dust you will return.
translation:
  language: ml
  text: നിന്റെ മുഖത്തെ വിയർപ്പുകൊണ്ട്[a] നീ അപ്പം ഭക്ഷിക്കും, നീ നിലത്തേക്കു മടങ്ങുന്നതുവരെ; കാരണം അതിൽനിന്നാണ് നീ എടുക്കപ്പെട്ടത്. നീ പൊടിയാണ്; പൊടിയിലേക്കു നീ മടങ്ങും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മുഖത്തെ വിയർപ്പുകൊണ്ട്’ എന്നത് എബ്രായപാഠത്തിന്റെ നേരിട്ടുള്ള പ്രയോഗമാണ്; കൂടുതൽ പ്രയോഗസഹജമായി ‘നെറ്റിയിലെ വിയർപ്പുകൊണ്ട്’ എന്നും പറയാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֵעַת אַפֶּיךָ
  choice: നിന്റെ മുഖത്തെ വിയർപ്പുകൊണ്ട്
  rationale: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘നിന്റെ മുഖത്തിന്റെ വിയർപ്പിൽ/വിയർപ്പുകൊണ്ട്’ എന്നാണ്. ‘നെറ്റിയിലെ വിയർപ്പുകൊണ്ട്’ മലയാളത്തിൽ കൂടുതൽ പ്രചാരമുള്ള പ്രയോഗമാണെങ്കിലും മുഖം എന്ന മൂലദൃശ്യത്തെ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: תֹּאכַל לֶחֶם
  choice: നീ അപ്പം ഭക്ഷിക്കും
  rationale: לֶחֶם എന്നത് നേരിട്ട് ‘അപ്പം’ എന്നാണ്; സന്ദർഭത്തിൽ പൊതുവായ ആഹാരത്തെയും സൂചിപ്പിക്കാമെങ്കിലും മൂലപദത്തിന്റെ വ്യക്തമായ രൂപം നിലനിർത്തി.
- source_word: עַד שׁוּבְךָ אֶל הָאֲדָמָה
  choice: നീ നിലത്തേക്കു മടങ്ങുന്നതുവരെ
  rationale: אֲדָמָה നിലം/മണ്ണ് എന്നർഥം നൽകുന്നു. മനുഷ്യൻ അതിൽനിന്ന് എടുക്കപ്പെട്ടതും അതിലേക്കു മടങ്ങുന്നതുമായ ബന്ധം ‘നിലം’ സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: כִּי מִמֶּנָּה לֻקָּחְתָּ
  choice: കാരണം അതിൽനിന്നാണ് നീ എടുക്കപ്പെട്ടത്
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം മുൻപുള്ള אֲדָמָהയെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ കർമണിപ്രയോഗം ‘എടുക്കപ്പെട്ടത്’ എന്നു നിലനിർത്തി.
- source_word: עָפָר
  choice: പൊടി
  rationale: മനുഷ്യന്റെ ഭൗതിക ഉത്ഭവവും മരണത്തിൽ ഭൂമിയിലേക്കുള്ള മടക്കവും സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും കൃത്യവുമായ തുല്യപദം.
- source_word: תָּשׁוּב
  choice: നീ മടങ്ങും
  rationale: പ്രഖ്യാപിക്കപ്പെട്ട ഫലത്തിന്റെ ഉറപ്പിനെ ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: മനുഷ്യന്റെ മർത്ത്യതയും ഭൗതിക ഉത്ഭവവും
  choice: മനുഷ്യൻ എടുത്ത നിലത്തിലേക്കും പൊടിയിലേക്കും ശാരീരികമായി മടങ്ങുമെന്ന പ്രഖ്യാപനമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ശാരീരിക മരണത്തേക്കാൾ അപമാനത്തെ ഊന്നുന്ന രൂപകവായന.
  rationale: אֲדָמָה (‘നിലം’) എന്നും עָפָר (‘പൊടി’) എന്നും ഉള്ള പദങ്ങളുടെ അടുപ്പവും ഉടൻമുമ്പുള്ള സൃഷ്ടിസന്ദർഭവും ശാരീരിക മരണത്തെയും ഭൂമിയിലേക്കുള്ള മടക്കത്തെയും ശക്തമായി പിന്തുണയ്ക്കുന്നു; പിന്നീടുള്ള സിദ്ധാന്തവികാസങ്ങൾ പാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. എബ്രായത്തിലെ ‘മുഖം’, ‘അപ്പം’, ‘നിലം’, ‘പൊടി’ എന്നീ ദൃശ്യങ്ങൾ പരമാവധി നിലനിർത്തിയിരിക്കുന്നു.
