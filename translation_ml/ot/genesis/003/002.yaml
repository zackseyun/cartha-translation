id: GEN.3.2
reference: Genesis 3:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֥אמֶר הָֽ/אִשָּׁ֖ה אֶל הַ/נָּחָ֑שׁ מִ/פְּרִ֥י עֵֽץ הַ/גָּ֖ן נֹאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/002.yaml
  text: And the woman said to the serpent[a], “We may eat from the fruit of the trees of the garden,”
translation:
  language: ml
  text: 'അപ്പോൾ സ്ത്രീ പാമ്പിനോടു പറഞ്ഞു: “തോട്ടത്തിലെ വൃക്ഷങ്ങളുടെ ഫലം ഞങ്ങൾക്കു ഭക്ഷിക്കാം.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “തോട്ടത്തിലെ വൃക്ഷത്തിന്റെ ഫലത്തിൽനിന്ന് ഞങ്ങൾക്കു ഭക്ഷിക്കാം”; ഇവിടെ “വൃക്ഷം” സമൂഹവാചകമായി, അതായത് “വൃക്ഷങ്ങൾ” എന്ന അർഥത്തിൽ മനസ്സിലാക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു. ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הָאִשָּׁה
  choice: സ്ത്രീ
  rationale: ഇവിടെ אִשָּׁה വിവാഹബന്ധത്തിലെ പ്രത്യേക പങ്കിനേക്കാൾ കഥയിലെ സ്ത്രീയായ മനുഷ്യപാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֶל הַנָּחָשׁ
  choice: പാമ്പിനോടു
  rationale: സംസാരത്തിന്റെ അഭിമുഖനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; נָחָשׁ എന്നത് പാമ്പിനെയാണ് കുറിക്കുന്നത്.
- source_word: מִפְּרִי
  choice: ഫലം
  rationale: മലയാളത്തിലെ ‘ഫലം ഭക്ഷിക്കുക’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിൽ ഹീബ്രു מִן സൂചിപ്പിക്കുന്ന ഭാഗിക/ഉറവിടബന്ധം പ്രത്യേകമായി ‘നിന്ന്’ എന്നു ചേർക്കാതെ തന്നെ വ്യക്തമാണ്.
- source_word: עֵץ הַגָּן
  choice: തോട്ടത്തിലെ വൃക്ഷങ്ങളുടെ
  rationale: עֵץ രൂപത്തിൽ ഏകവചനമാണെങ്കിലും സന്ദർഭത്തിൽ സമൂഹവാചകമായോ വിതരണാർഥത്തിലോ വരുന്നു; മലയാളത്തിൽ ബഹുവചനം ഉദ്ദേശിച്ച പൊതുവായ അനുമതി വ്യക്തമായി നൽകുന്നു.
- source_word: נֹאכֵל
  choice: ഞങ്ങൾക്കു ഭക്ഷിക്കാം
  rationale: സന്ദർഭത്തിൽ ഈ അപൂർണക്രിയ കഴിവിനേക്കാൾ അനുവദനീയതയാണ് പ്രകടിപ്പിക്കുന്നത്; ‘ഭക്ഷിക്കാം’ ആ അനുമതി സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: അനുവദിക്കപ്പെട്ട വൃക്ഷങ്ങളുടെയും ഫലത്തിന്റെയും വ്യാപ്തി
  choice: തോട്ടത്തിലെ വൃക്ഷങ്ങളുടെ ഫലം എന്ന പൊതുവായ അനുമതി
  alternative: തോട്ടത്തിലെ വൃക്ഷത്തിന്റെ ഫലം
  rationale: ഹീബ്രുവിൽ עֵץ ഏകവചനരൂപത്തിലാണെങ്കിലും ഉല്പത്തി 2:16-ലെ വിപുലമായ അനുമതിയോടും അടുത്ത വാക്യത്തിൽ വരുന്ന അപവാദത്തോടും ചേർന്നു വായിക്കുമ്പോൾ ഇവിടെ സമൂഹവാചക അർഥമാണ്. ബഹുവചന വിവർത്തനം ഒരു വൃക്ഷം മാത്രമാണ് ഉദ്ദേശ്യമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഭക്ഷിക്കാം’ അനുമതിയെ സൂചിപ്പിക്കുന്നു; ‘കഴിക്കാം’ എന്നതിനെക്കാൾ തിരുവെഴുത്തിന്റെ ഗൗരവമുള്ള രജിസ്റ്ററിന് ‘ഭക്ഷിക്കാം’ അനുയോജ്യം.
