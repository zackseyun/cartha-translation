id: GEN.3.9
reference: Genesis 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֛א יְהוָ֥ה אֱלֹהִ֖ים אֶל הָֽ/אָדָ֑ם וַ/יֹּ֥אמֶר ל֖/וֹ אַיֶּֽ/כָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/009.yaml
  text: Then Yahweh God called to the man and said to him[a], “Where are you?”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ ദൈവം മനുഷ്യനെ വിളിച്ചു; അവനോടു പറഞ്ഞു: “നീ എവിടെയാണ്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ച്
  rationale: קרא എന്ന ധാതുവിന്റെ Qal wayyiqtol രൂപം ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ ‘വിളിച്ചു’ സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമാണ്; ‘വിളിച്ചുപറഞ്ഞു’ എന്ന അധിക അർത്ഥം ചേർക്കേണ്ടതില്ല.
- source_word: יְהוָה אֱלֹהִים
  choice: യഹ്‌വേ ദൈവം
  rationale: യְהוָה എന്ന ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു; אֱלֹהִים ‘ദൈവം’ എന്നും നൽകുന്നു.
- source_word: אֶל־הָאָדָם
  choice: മനുഷ്യനെ
  rationale: വിളിക്കുക എന്ന മലയാള ക്രിയയോടൊപ്പം അഭിസംബോധിതനെ കർമരൂപത്തിൽ പറയുന്നതാണ് സ്വാഭാവികം. ഇവിടെ הָאָדָם പൊതുവായ മനുഷ്യവർഗത്തെയല്ല, തോട്ടത്തിലെ നിർദിഷ്ട മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיֹּאמֶר לוֹ
  choice: അവനോട് … എന്നു ചോദിച്ചു
  rationale: לוֹയിലെ ‘അവനോട്’ നിലനിർത്തുന്നു. പിന്നാലെ നേരിട്ടുള്ള ചോദ്യം വരുന്നതിനാൽ וַיֹּאמֶר എന്നത് മലയാളത്തിൽ ‘എന്നു ചോദിച്ചു’ എന്നു നൽകുന്നത് സ്വാഭാവികമാണ്; പറയൽക്രിയയുടെ ആശയം നഷ്ടപ്പെടുന്നില്ല.
- source_word: אַיֶּכָּה
  choice: നീ എവിടെയാണ്?
  rationale: രണ്ടാംപുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയമുള്ള സ്ഥാനചോദ്യം. മലയാളത്തിൽ ലിംഗം പ്രത്യേകം അടയാളപ്പെടുത്താതെ നേരിട്ടുള്ള വ്യക്തിപരമായ ചോദ്യം കൃത്യമായി നൽകുന്നു.
- source_word: וַ
  choice: അപ്പോൾ
  rationale: ആദ്യ wayyiqtol ആഖ്യാനക്രമത്തിന്റെ തുടർച്ച കാണിക്കുന്നു. ആ തുടർച്ച ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ശീർഷകമാക്കി മാറ്റാതെ മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരണം ചെയ്യുന്നു. ‘കർത്താവ്’ നാമത്തെ പദവിയായി മാറ്റും; ‘യഹോവ’ പിന്നീടുണ്ടായ സംയുക്ത ഉച്ചാരണപരമ്പരയെ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: הָאָדָם എന്നതിന്റെ സൂചിതൻ
  choice: മനുഷ്യൻ
  alternative: ആദാം; മനുഷ്യജാതി
  rationale: ഈ ഘട്ടത്തിലെ എബ്രായ പദം നിർദിഷ്ട മനുഷ്യനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും വ്യക്തിനാമമായി നിർബന്ധമായി പരിഹരിക്കേണ്ടതില്ല. ‘മനുഷ്യൻ’ എന്നത് പദത്തിന്റെ സാധാരണ അർത്ഥവും സന്ദർഭത്തിലെ ഏകവചന സൂചനയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യക്രമം കൃത്രിമമായി പകർത്താതെ അതിലെ ക്രമം, അഭിസംബോധന, നേരിട്ടുള്ള ചോദ്യം എന്നിവ നിലനിർത്തി. യാതൊരു അടിക്കുറിപ്പും ആവശ്യമായില്ല.
