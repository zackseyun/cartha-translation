  to: 'അപ്പോൾ യഹ്‌വേ ദൈവം മനുഷ്യനെ വിളിച്ചു; അവനോടു പറഞ്ഞു: “നീ എവിടെയാണ്?”'
  rationale: 'The revision preserves the narrative sequence and the explicit speech verb: Yahweh God first called to the man and then said to him, “Where are you?” It retains the draft’s appropriate rendering of the divine name and its non-interpretive rendering of הָאָדָם.'
