  to: 'അപ്പോൾ യഹോവയായ ദൈവം സർപ്പത്തോട്[a] അരുളിച്ചെയ്തു: “നീ ഇതു ചെയ്തതിനാൽ, എല്ലാ കന്നുകാലികളെക്കാളും വയലിലെ എല്ലാ വന്യമൃഗങ്ങളെക്കാളും നീ ശപിക്കപ്പെട്ടിരിക്കുന്നു. നീ വയറിന്മേൽ സഞ്ചരിക്കും; നിന്റെ ജീവിതകാലമൊക്കെയും നീ പൊടി തിന്നും.[b]”'
