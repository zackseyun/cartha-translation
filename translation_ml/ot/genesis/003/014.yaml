  terminology: ‘യഹോവയായ ദൈവം,’ ‘സർപ്പം,’ ‘കന്നുകാലികൾ,’ ‘വന്യമൃഗങ്ങൾ’ എന്നിവ യോജിച്ചതാണ്. സർപ്പത്തെക്കുറിച്ച് പിൽക്കാല ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ പ്രധാനവാചകത്തിലേക്ക് ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പുകൾ ശരിയായ സ്ഥാനത്തും പ്രസക്തമായും ഉണ്ട്.
