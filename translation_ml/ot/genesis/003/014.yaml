id: GEN.3.14
reference: Genesis 3:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ יְהֹוָ֨ה אֱלֹהִ֥ים אֶֽל הַ/נָּחָשׁ֮ כִּ֣י עָשִׂ֣יתָ זֹּאת֒ אָר֤וּר אַתָּה֙ מִ/כָּל הַ/בְּהֵמָ֔ה וּ/מִ/כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה עַל גְּחֹנְ/ךָ֣ תֵלֵ֔ךְ וְ/עָפָ֥ר תֹּאכַ֖ל כָּל יְמֵ֥י חַיֶּֽי/ךָ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/014.yaml
  text: Then Yahweh God said to the serpent[a], “Because you have done this, cursed are you above all livestock and above every beast of the field. On your belly you shall go[b], and dust you shall eat all the days of your life.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവയായ ദൈവം സർപ്പത്തോട്[a] അരുളിച്ചെയ്തു: “നീ ഇതു ചെയ്തതിനാൽ, എല്ലാ കന്നുകാലികളെക്കാളും വയലിലെ എല്ലാ വന്യമൃഗങ്ങളെക്കാളും നീ ശപിക്കപ്പെട്ടിരിക്കുന്നു. നീ വയറിന്മേൽ സഞ്ചരിക്കും; നിന്റെ ജീവിതകാലമൊക്കെയും നീ പൊടി തിന്നും.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പാമ്പ്.”'
    reason: lexical_alternative
  - marker: b
    text: “പൊടി തിന്നുക” എന്നത് അക്ഷരാർഥത്തിലുള്ള ഭക്ഷണത്തെക്കുറിച്ചുള്ള പ്രസ്താവന മാത്രമല്ലാതെ അപമാനത്തിന്റെയും പരാജയത്തിന്റെയും ചിത്രമായും ഉപയോഗിക്കപ്പെടാം.
    reason: cultural_note
lexical_decisions:
- source_word: יְהֹוָה אֱלֹהִים
  choice: യഹോവയായ ദൈവം
  rationale: ദൈവനാമത്തെയും אֱלֹהִים എന്ന പദത്തെയും വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ നാമ-വിശേഷണബന്ധം നൽകുന്നു.
- source_word: הַנָּחָשׁ
  choice: സർപ്പം
  rationale: പാമ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്; അതോടൊപ്പം ആഖ്യാനത്തിന്റെ ഗൗരവവും സാഹിത്യഭാവവും നിലനിർത്തുന്നു.
- source_word: כִּי עָשִׂיתָ זֹּאת
  choice: നീ ഇതു ചെയ്തതിനാൽ
  rationale: തുടർന്നുവരുന്ന വിധിയുടെ കാരണബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אָרוּר אַתָּה
  choice: നീ ശപിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ഹീബ്രുവിലെ വിധിപ്രഖ്യാപനത്തിന്റെ ഗൗരവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִכָּל הַבְּהֵמָה
  choice: എല്ലാ കന്നുകാലികളെക്കാളും
  rationale: מִן എന്ന താരതമ്യപ്രയോഗവും വളർത്തുമൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന בְּהֵמָה എന്ന പദവും വ്യക്തമാക്കുന്നു.
- source_word: וּמִכֹּל חַיַּת הַשָּׂדֶה
  choice: വയലിലെ എല്ലാ വന്യമൃഗങ്ങളെക്കാളും
  rationale: കന്നുകാലികളിൽനിന്ന് വേർതിരിച്ച് തുറസ്സായ പ്രദേശങ്ങളിലെ വന്യമൃഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: עַל גְּחֹנְךָ תֵלֵךְ
  choice: നീ വയറിന്മേൽ ഇഴഞ്ഞുനടക്കും
  rationale: תֵלֵךְ എന്നത് അടിസ്ഥാനമായി ‘പോകുക/നടക്കുക’ എന്നാണെങ്കിലും, ‘വയറിന്മേൽ’ എന്ന രീതിവിവരണം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘ഇഴഞ്ഞുനടക്കും’ ഉപയോഗിക്കുന്നു.
- source_word: וְעָפָר תֹּאכַל
  choice: നീ പൊടി തിന്നും
  rationale: ദൃശ്യമായ ശാപഭാഷയെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כָּל יְמֵי חַיֶּיךָ
  choice: നിന്റെ ജീവിതകാലമൊക്കെയും
  rationale: ‘നിന്റെ ജീവന്റെ എല്ലാ ദിവസങ്ങളും’ എന്ന ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സമഗ്രമായി നൽകുന്നു.
theological_decisions:
- issue: സർപ്പത്തിന്റെ തിരിച്ചറിയൽ
  choice: വാക്യത്തിലെ നേരിട്ടുള്ള ആഖ്യാനസൂചകമായ ‘സർപ്പം’ മാത്രം പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു.
  alternative: സർപ്പത്തെ സാത്താനായി വ്യാഖ്യാനിച്ച് പ്രധാനവാചകത്തിൽ വികസിപ്പിക്കുക.
  rationale: ഈ വാക്യം നേരിട്ട് സർപ്പത്തോടാണ് സംസാരിക്കുന്നത്; പിൽക്കാല വേദഭാഗങ്ങളിലെ ബന്ധപ്പെടുത്തൽ ഇവിടെ വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: ‘പൊടി തിന്നുക’ എന്നതിന്റെ സ്വഭാവം
  choice: പ്രധാനവാചകത്തിൽ ദൃശ്യപ്രയോഗം അക്ഷുണ്ണമായി നിലനിർത്തി, അപമാനത്തിന്റെയും പരാജയത്തിന്റെയും രൂപകസാധ്യത അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
  alternative: ഇത് പൂർണമായും അക്ഷരാർഥ ഭക്ഷണവിവരണമെന്നോ പൂർണമായും രൂപകമെന്നോ നിർണയിക്കുക.
  rationale: ഹീബ്രു പ്രയോഗത്തിലെ ദൃശ്യാർഥവും സാംസ്കാരിക രൂപകസാധ്യതയും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘അരുളിച്ചെയ്തു’ ദൈവിക പ്രസംഗത്തിന് മാന്യമായ ഭാവം നൽകുന്നു; അതേസമയം വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
