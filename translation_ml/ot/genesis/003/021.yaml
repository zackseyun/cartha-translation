source:
  edition: WLC
  text: וַ/יַּעַשׂ֩ יְהוָ֨ה אֱלֹהִ֜ים לְ/אָדָ֧ם וּ/לְ/אִשְׁתּ֛/וֹ כָּתְנ֥וֹת ע֖וֹר וַ/יַּלְבִּשֵֽׁ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/021.yaml
  text: And Yahweh God made garments of skin for the man and for his wife[b][a], and clothed them.
translation:
  language: ml
  text: യഹ്‌വേ ദൈവം ആ മനുഷ്യനും[a] അവന്റെ ഭാര്യയ്ക്കുമായി തോൽകൊണ്ടുള്ള വസ്ത്രങ്ങൾ[b] ഉണ്ടാക്കി അവരെ ധരിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആദാമിനും.’ എബ്രായത്തിലെ אָדָם (ആദാം) സന്ദർഭമനുസരിച്ച് ‘മനുഷ്യൻ’ എന്ന പൊതുനാമമായോ ‘ആദാം’ എന്ന വ്യക്തിനാമമായോ ഉപയോഗിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘തോൽകൊണ്ടുള്ള നീളക്കുപ്പായങ്ങൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: יְהוָה എന്ന ദൈവനാമത്തോടൊപ്പം വരുന്ന പദത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘ദൈവം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לְאָדָם
  choice: ആ മനുഷ്യനുംവേണ്ടി
  rationale: ഇവിടെ אָדָם മനുഷ്യവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നതിലുപരി ഭാര്യയിൽനിന്ന് വേർതിരിച്ചുപറയുന്ന പുരുഷനെ സൂചിപ്പിക്കുന്നു. എങ്കിലും ‘ആദാം’ എന്ന വ്യക്തിനാമവായനയ്ക്കുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וּלְאִשְׁתּוֹ
  choice: അവന്റെ ഭാര്യയ്ക്കുംവേണ്ടി
  rationale: മൂന്നാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയത്തോടുകൂടിയ אִשָּׁה ഈ ദാമ്പത്യസന്ദർഭത്തിൽ സ്വാഭാവികമായി ‘അവന്റെ ഭാര്യ’ എന്നാണ്.
- source_word: כָּתְנוֹת עוֹר
  choice: തുകൽകൊണ്ടുള്ള വസ്ത്രങ്ങൾ
  rationale: כֻּתֹּנֶת ശരീരത്തിൽ ധരിക്കുന്ന വസ്ത്രത്തെയും עוֹר തൊലി/തുകലിനെയും സൂചിപ്പിക്കുന്നു. ‘തുകൽകൊണ്ടുള്ള വസ്ത്രങ്ങൾ’ ഉറവിടത്തിന്റെ അർഥവും സ്വാഭാവിക മലയാളവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: וַיַּעַשׂ
  choice: ഉണ്ടാക്കി
  rationale: עשה എന്ന സാധാരണ ‘ഉണ്ടാക്കുക/ചെയ്യുക’ എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ ലളിത വിവർത്തനം.
- source_word: וַיַּלְבִּשֵׁם
  choice: അവരെ ധരിപ്പിച്ചു
  rationale: לבש എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘ധരിക്കാൻ ഇടയാക്കുക’ എന്നാണ്; ‘അവരെ ധരിപ്പിച്ചു’ അതിനെ നേരായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: אָדָם എന്നത് വ്യക്തിനാമമായോ പൊതുനാമമായോ വായിക്കണമോ
  choice: ‘ആ മനുഷ്യൻ’ എന്ന പൊതുനാമവായന
  alternative: ‘ആദാം’ എന്ന വ്യക്തിനാമവായന
  rationale: ഈ ഘട്ടത്തിൽ എബ്രായപദം ഭാര്യയിൽനിന്ന് വേർതിരിച്ചുപറയുന്ന പുരുഷമനുഷ്യനെ പൊതുനാമമായി സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; എന്നാൽ വ്യക്തിനാമവായനയും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. വാക്യത്തിന്റെ എബ്രായ ക്രമവും പ്രവർത്തനബന്ധവും കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘വേണ്ടി’ ഒരിക്കൽ സംയുക്തമായി പ്രയോഗിച്ചു.
