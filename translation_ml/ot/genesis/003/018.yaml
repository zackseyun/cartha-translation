id: GEN.3.18
reference: Genesis 3:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/ק֥וֹץ וְ/דַרְדַּ֖ר תַּצְמִ֣יחַֽ לָ֑/ךְ וְ/אָכַלְתָּ֖ אֶת עֵ֥שֶׂב הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/018.yaml
  text: It will produce thorns and thistles for you[c][b][a], and you will eat the plants of the field.
translation:
  language: ml
  text: അത് നിനക്കായി മുള്ളുകളും മുൾച്ചെടികളും[a] മുളപ്പിക്കും[b]; നീ വയലിലെ സസ്യങ്ങൾ[c] തിന്നും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മുൾച്ചെടികൾ’ എന്നതിന് ‘മുള്ളുള്ള കളച്ചെടികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഒരു പ്രത്യേക സസ്യജാതി ഉറപ്പായി തിരിച്ചറിയാൻ കഴിയില്ല.
    reason: lexical_alternative
  - marker: b
    text: ‘അത് മുളപ്പിക്കും’ എന്നതിലെ ‘അത്’ മുൻവാക്യത്തിലെ നിലത്തെ സൂചിപ്പിക്കുന്നു. ‘അത് വളർത്തിയുണ്ടാക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ ക്രിയ കാരണാർഥത്തിലാണ്.
    reason: lexical_alternative
  - marker: c
    text: ‘വയലിലെ സസ്യങ്ങൾ’ എന്നതിന് ‘വയലിലെ സസ്യജാലം’ എന്നും, പരമ്പരാഗതമായി ‘വയലിലെ സസ്യം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקֹוץ
  choice: മുള്ളുകൾ
  rationale: קוֹץ മുള്ളുള്ള വളർച്ചയെ സൂചിപ്പിക്കുന്നു. കൂട്ടമായ അർഥം സ്വാഭാവികമായി അറിയിക്കാൻ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: וְדַרְדַּר
  choice: മുൾച്ചെടികൾ
  rationale: דַּרְדַּר എന്നത് קוֹץ-ൽനിന്ന് വേറിട്ട ഒരിനം മുള്ളുള്ള കളച്ചെടിയെയാണ് സൂചിപ്പിക്കുന്നത്; നിർണയിക്കാനാകാത്ത സസ്യജാതിയെ അമിതമായി കൃത്യമാക്കാതെ ഈ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: תַּצְמִיחַ לָךְ
  choice: അത് നിനക്കായി ... മുളപ്പിക്കും
  rationale: צמח എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം ‘മുളപ്പിക്കും’ സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു. לָךְ എന്നത് ‘നിനക്കായി’ എന്നു വ്യക്തമായി നിലനിർത്തി. സ്ത്രീലിംഗ ഏകവചനക്രിയ മുൻവാക്യത്തിലെ ‘നിലം’ എന്ന പദത്തിലേക്കാണ് സ്വാഭാവികമായി മടങ്ങുന്നത്.
- source_word: וְאָכַלְתָּ
  choice: നീ ... തിന്നും
  rationale: സന്ദർഭത്തിലെ അനന്തരഫലം സൂചിപ്പിക്കുന്ന ഭാവിയർഥം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: വയലിലെ സസ്യങ്ങൾ
  rationale: עֵשֶׂב ഭക്ഷ്യയോഗ്യമായ പച്ചസസ്യങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘സസ്യങ്ങൾ’ എന്നത് ‘പുല്ല്’ എന്നതിനെക്കാൾ വിശാലവും ‘ഔഷധച്ചെടി’ എന്ന തെറ്റായ പരിമിതിയും ഒഴിവാക്കുന്നതുമാണ്. הַשָּׂדֶה എന്നത് ‘വയലിലെ’ എന്നു നിലനിർത്തി.
theological_decisions:
- issue: תַּצְמִיחַ എന്ന സ്ത്രീലിംഗ ഏകവചനക്രിയയുടെ കർത്താവ്
  choice: മുൻവാക്യത്തിലെ നിലത്തെ സൂചിപ്പിക്കുന്ന ‘അത്’
  alternative: കർത്താവിനെ വ്യക്തമാക്കാത്ത ഒരു നിരപേക്ഷ പ്രയോഗം, അല്ലെങ്കിൽ വ്യാഖ്യാനസൗകര്യത്തിന് ‘നിലം’ എന്നു ആവർത്തിക്കൽ
  rationale: എബ്രായ ക്രിയയുടെ സ്ത്രീലിംഗ ഏകവചനം 3:17-ലെ הָאֲדָמָה (‘നിലം’) എന്ന പദത്തിലേക്ക് സ്വാഭാവികമായി മടങ്ങുന്നു. മൂലത്തിലെ അന്തർലീന കർത്താവിനെ അനാവശ്യമായി ആവർത്തിക്കാതെ ‘അത്’ ഈ ബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മുളപ്പിക്കും’ കാരണാർഥവും കൃഷിസന്ദർഭവും സ്വാഭാവികമായി ചേർക്കുന്നു. സസ്യനാമങ്ങളിൽ മൂലപാഠം അനുവദിക്കുന്നതിലധികം സസ്യശാസ്ത്രപരമായ കൃത്യത അവകാശപ്പെടുന്നില്ല.
