id: GEN.3.1
reference: Genesis 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/נָּחָשׁ֙ הָיָ֣ה עָר֔וּם מִ/כֹּל֙ חַיַּ֣ת הַ/שָּׂדֶ֔ה אֲשֶׁ֥ר עָשָׂ֖ה יְהוָ֣ה אֱלֹהִ֑ים וַ/יֹּ֨אמֶר֙ אֶל הָ֣/אִשָּׁ֔ה אַ֚ף כִּֽי אָמַ֣ר אֱלֹהִ֔ים לֹ֣א תֹֽאכְל֔וּ מִ/כֹּ֖ל עֵ֥ץ הַ/גָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/001.yaml
  text: The serpent was more crafty than any beast of the field that Yahweh God had made[a]. And he said to the woman, “Indeed, has God said[c][b], ‘You shall not eat from any tree of the garden’?”
translation:
  language: ml
  text: 'യഹ്‌വേ ദൈവം ഉണ്ടാക്കിയ വയലിലെ ഏതു മൃഗത്തെക്കാളും പാമ്പ് കൂടുതൽ തന്ത്രശാലിയായിരുന്നു.[a] അത് സ്ത്രീയോടു പറഞ്ഞു: “ദൈവം[b] ‘തോട്ടത്തിലെ ഒരു വൃക്ഷത്തിൽനിന്നുപോലും നിങ്ങൾ തിന്നരുത്’ എന്ന് ശരിക്കും പറഞ്ഞിട്ടുണ്ടോ?[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തന്ത്രശാലി’ എന്നതിന് ‘കൗശലമുള്ളത്,’ ‘സൂക്ഷ്മബുദ്ധിയുള്ളത്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പദം ചില സന്ദർഭങ്ങളിൽ വിവേകത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഇവിടെ വഞ്ചനയുടെ അർഥഛായയുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: വിവരണകർത്താവ് ‘യഹ്‌വേ ദൈവം’ എന്നു പറയുന്നു; എന്നാൽ പാമ്പ് ‘ദൈവം’ എന്നു മാത്രം പറയുന്നു. ഹീബ്രുവിലെ ഈ വാചകമാറ്റം പരിഭാഷയിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘തോട്ടത്തിലെ എല്ലാ വൃക്ഷങ്ങളിൽനിന്നും.’ നിഷേധചോദ്യത്തിൽ ‘ഒരു വൃക്ഷത്തിൽനിന്നുപോലും’ എന്നത് ദൈവത്തിന്റെ കല്പനയെ പാമ്പ് അതിശയോക്തിയോടെ അവതരിപ്പിക്കുന്നതു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּחָשׁ
  choice: പാമ്പ്
  rationale: הַנָּחָשׁ എന്നത് സ്വാഭാവികമായി ‘പാമ്പ്’ എന്നാണ്. തുടക്കത്തിലെ וְ ആഖ്യാനബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും മലയാളത്തിൽ നിർബന്ധമായി ‘ഇപ്പോൾ’ എന്നോ ‘അപ്പോൾ’ എന്നോ ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ ബന്ധം നിലനിർത്താം.
- source_word: עָרוּם
  choice: കൗശലക്കാരൻ
  rationale: ഈ പദത്തിന് വിവേകമുള്ളവൻ, സമർഥൻ, തന്ത്രശാലി എന്നീ അർഥഛായകൾ ഉണ്ടാകാം. ഇവിടെ തുടർന്നുവരുന്ന വഞ്ചനാപരമായ ചോദ്യം പ്രതികൂലമായ കൗശലത്തിന്റെ ഭാവം നൽകുന്നു; എന്നാൽ പദത്തിന്റെ മുഴുവൻ സാധ്യതയും അടച്ചുപൂട്ടാതിരിക്കാൻ ‘കൗശലക്കാരൻ’ തെരഞ്ഞെടുത്തു.
- source_word: מִכֹּל חַיַּת הַשָּׂדֶה
  choice: വയലിലെ എല്ലാ ജീവികളിലും
  rationale: מִן + כֹּל താരതമ്യനിർമ്മിതി മലയാളത്തിൽ ‘എല്ലാ ... ലും’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കാം. חַיַּת הַשָּׂדֶה എന്നത് കൃഷിസ്ഥലം മാത്രമല്ല, തുറന്ന നിലവുമായി ബന്ധപ്പെട്ട കരജീവികളെയും സൂചിപ്പിക്കുന്നു; ‘വയലിലെ ജീവികൾ’ മൂലരൂപം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה אֱלֹהִים
  choice: യഹോവയായ ദൈവം
  rationale: ദൈവനാമമായ יְהוָה ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു; אֱלֹהִים ഒപ്പം വരുന്ന സംയുക്തപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ‘യഹോവയായ ദൈവം’ എന്നു നൽകി.
- source_word: וַיֹּאמֶר אֶל־הָאִשָּׁה
  choice: അത് സ്ത്രീയോടു ചോദിച്ചു
  rationale: സംസാരിക്കുന്ന വിഷയം പാമ്പാണ്; മലയാളത്തിൽ മൃഗത്തെ സൂചിപ്പിക്കുന്ന ‘അത്’ സ്വാഭാവികമാണ്. നേരിട്ടുള്ള വാക്ക് ചോദ്യം ആയതിനാൽ ‘പറഞ്ഞു’ എന്നതിനു പകരം ‘ചോദിച്ചു’ ഉപയോഗിക്കുന്നത് പ്രസംഗപ്രവർത്തനം വ്യക്തമായി നൽകുന്നു.
- source_word: אַף כִּי אָמַר אֱלֹהִים
  choice: ദൈവം വാസ്തവമായി പറഞ്ഞോ
  rationale: אַף כִּי ഇവിടെ സംശയം ജനിപ്പിക്കുന്ന, സൂചനാപരമായ ചോദ്യത്തിന് തുടക്കമിടുന്നു. ‘വാസ്തവമായി ... പറഞ്ഞോ?’ ആ വാചകബലം സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֹא תֹאכְלוּ מִכֹּל עֵץ הַגָּן
  choice: തോട്ടത്തിലെ ഒരു വൃക്ഷത്തിൽനിന്നും നിങ്ങൾ തിന്നരുതെന്ന്
  rationale: നിഷേധവാക്യത്തിൽ מִכֹּל എന്നത് ‘ഒരു ... ൽനിന്നും’ എന്നർഥത്തിൽ സ്വാഭാവികമാണ്; ദൈവകല്പനയെ പാമ്പ് എല്ലാ വൃക്ഷങ്ങളിലേക്കും അതിശയോക്തിയായി വ്യാപിപ്പിക്കുന്ന ഭാവം ഇതിലൂടെ നിലനിൽക്കുന്നു. תֹאכְלוּ ബഹുവചനമായതിനാൽ ആദരസൂചക ഏകവചനമെന്നതിലുപരി സന്ദർഭാനുസൃത ബഹുവചനം ഉൾക്കൊള്ളുന്ന ‘നിങ്ങൾ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ നാലക്ഷരനാമം ഉപയോഗിക്കുന്നതിനാൽ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം പേരിന്റെ മലയാളത്തിൽ പരിചിതമായ രൂപം നിലനിർത്തി.
- issue: വിവരണകർത്താവിന്റെയും പാമ്പിന്റെയും ദൈവസംബോധനയിലെ വ്യത്യാസം
  choice: ആദ്യഭാഗത്ത് ‘യഹോവയായ ദൈവം’; പാമ്പിന്റെ വാക്കിൽ ‘ദൈവം’ മാത്രം
  alternative: രണ്ടിടത്തും ‘യഹോവയായ ദൈവം’
  rationale: ഹീബ്രുവിൽ വിവരണകർത്താവ് יְהוָה אֱלֹהִים എന്നും പാമ്പ് אֱלֹהִים മാത്രം എന്നും പറയുന്നു. ഈ ഉദ്ദേശ്യപ്രധാനമായ വാചകമാറ്റം ഏകീകരിക്കാതെ സൂക്ഷിച്ചു.
- issue: עָרוּם എന്ന പദത്തിന്റെ നൈതിക അർഥഛായ
  choice: കൗശലക്കാരൻ
  alternative: വിവേകശാലി / കപടതന്ത്രശാലി
  rationale: പദം ചില സന്ദർഭങ്ങളിൽ അനുകൂലമായ വിവേകത്തെയും ഇവിടെ പ്രതികൂലമായ തന്ത്രത്തെയും സൂചിപ്പിക്കാം. ‘കൗശലക്കാരൻ’ സന്ദർഭത്തിലെ അപകടഭാവം അറിയിക്കുമ്പോഴും അമിതമായ ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. അനാവശ്യ പുരാതനപ്രയോഗങ്ങൾ ഒഴിവാക്കി; ദൈവനാമം, ഏക-ബഹുവചന സൂചന, ചോദ്യം ഉന്നയിക്കുന്ന സംശയഭാവം എന്നിവ മൂലപാഠത്തെ ആശ്രയിച്ച് നിലനിർത്തി.
