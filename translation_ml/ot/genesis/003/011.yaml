  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר מִ֚י הִגִּ֣יד לְ/ךָ֔ כִּ֥י עֵירֹ֖ם אָ֑תָּה הֲ/מִן הָ/עֵ֗ץ אֲשֶׁ֧ר צִוִּיתִ֛י/ךָ לְ/בִלְתִּ֥י אֲכָל מִמֶּ֖/נּוּ אָכָֽלְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/011.yaml
  text: And he said[b][a], “Who told you that you were naked? Have you eaten from the tree from which I commanded you not to eat?”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “നീ നഗ്നനാണെന്ന് നിന്നോടു പറഞ്ഞത് ആര്? തിന്നരുതെന്ന് ഞാൻ നിന്നോടു കൽപിച്ച വൃക്ഷത്തിൽനിന്ന്[b] നീ തിന്നിട്ടുണ്ടോ[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നീ തിന്നിയോ?” എബ്രായ പൂർണ്ണക്രിയയെ ഈ സന്ദർഭത്തിൽ മലയാളത്തിൽ സാധാരണ ഭൂതകാലചോദ്യമായോ പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ചോദ്യമായോ നൽകാം.'
    reason: lexical_alternative
  - marker: b
    text: 'പദശഃ: “അതിൽനിന്ന്.” മലയാളത്തിൽ “വൃക്ഷത്തിൽനിന്ന് തിന്നുക” എന്ന പ്രയോഗം കൂടുതൽ സ്വാഭാവികമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു. ഈ വാക്യത്തിൽ കർത്താവിന്റെ പേര് ആവർത്തിക്കാത്തതിനാൽ പുരുഷലിംഗ ഏകവചന സർവനാമം നിലനിർത്തുന്നു.
- source_word: מִי הִגִּיד לְךָ
  choice: നിന്നോടു പറഞ്ഞത് ആര്?
  rationale: הִגִּיד എന്ന ഹിഫിൽ രൂപത്തിന്റെ ‘അറിയിക്കുക, പറയുക’ എന്ന അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כִּי עֵירֹם אָתָּה
  choice: നീ നഗ്നനാണെന്ന്
  rationale: כִּי ഇവിടെ അറിയിക്കപ്പെട്ട കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; עֵירֹם വസ്ത്രമില്ലാത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: הֲמִן הָעֵץ
  choice: വൃക്ഷത്തിൽനിന്ന് ... തിന്നോ?
  rationale: ചോദ്യസൂചകമായ הֲയും מן ബന്ധവും മലയാളത്തിലെ സ്വാഭാവികമായ അതെ/അല്ല ചോദ്യംകൊണ്ട് പുനരാവിഷ്കരിക്കുന്നു.
- source_word: אֲשֶׁר צִוִּיתִיךָ לְבִלְתִּי אֲכָל
  choice: തിന്നരുതെന്ന് ഞാൻ നിന്നോടു കല്പിച്ച
  rationale: לְבִלְתִּי + infinitive സൂചിപ്പിക്കുന്ന വിലക്ക് സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִמֶּנּוּ
  choice: വൃക്ഷത്തിൽനിന്ന്
  rationale: പദശഃ ‘അതിൽനിന്ന്’ എന്ന ബന്ധം മലയാളത്തിൽ മുൻപുള്ള ‘വൃക്ഷം’ എന്ന നാമത്തോടു ചേർത്താൽ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: אָכָלְתָּ
  choice: നീ തിന്നോ
  rationale: രണ്ടാം പുരുഷ ഏകവചന ഖാൽ പൂർണ്ണരൂപം കഴിഞ്ഞ പ്രവൃത്തിയെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ചോദ്യമായി നൽകുന്നു; സന്ദർഭാനുസരണം ‘തിന്നിട്ടുണ്ടോ’ എന്നും പറയാം.
theological_decisions:
- issue: പുരുഷലിംഗ ഏകവചന കർത്താവിന്റെ തിരിച്ചറിയൽ
  choice: അവൻ പറഞ്ഞു
  alternative: യഹോവയായ ദൈവം പറഞ്ഞു
  rationale: ഈ വാക്യത്തിലെ എബ്രായ ക്രിയയ്ക്ക് വ്യക്തമായ നാമകർത്താവില്ല; മുൻസന്ദർഭത്തിൽ കർത്താവ് ദൈവമാണെങ്കിലും ഇവിടെ ഇല്ലാത്ത ദൈവനാമം പാഠത്തിൽ ചേർക്കാതെ സർവനാമം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘കല്പിച്ച’ എന്ന രൂപം വേദപാഠത്തിന്റെ ഔപചാരികത നിലനിർത്തുമ്പോഴും പഴഞ്ചൻ ഭാഷ ഒഴിവാക്കുന്നു.
