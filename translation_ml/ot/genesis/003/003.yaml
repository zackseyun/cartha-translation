  text: וּ/מִ/פְּרִ֣י הָ/עֵץ֮ אֲשֶׁ֣ר בְּ/תוֹךְ הַ/גָּן֒ אָמַ֣ר אֱלֹהִ֗ים לֹ֤א תֹֽאכְלוּ֙ מִמֶּ֔/נּוּ וְ/לֹ֥א תִגְּע֖וּ בּ֑/וֹ פֶּן תְּמֻתֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/003.yaml
  text: But from the fruit of the tree that is in the middle of the garden[a], God said, ‘You shall not eat from it, and you shall not touch it, lest you die.’
translation:
  language: ml
  text: “എന്നാൽ തോട്ടത്തിന്റെ നടുവിലുള്ള[a] വൃക്ഷത്തിന്റെ ഫലത്തിൽനിന്ന് തിന്നരുത്; അതിനെ തൊടരുത് എന്ന് ദൈവം പറഞ്ഞു; അല്ലെങ്കിൽ നിങ്ങൾ മരിക്കും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തോട്ടത്തിന്റെ മധ്യത്തിലുള്ള.”
    reason: בְּתוֹךְ എന്ന സ്ഥലസൂചക പദത്തിന് സാധ്യമായ അടുത്ത മലയാള പകരം നൽകുന്നു.
lexical_decisions:
- source_word: וּמִפְּרִי
  choice: എന്നാൽ ... ഫലത്തെക്കുറിച്ച്
  rationale: וְ ഇവിടെ മുൻവാക്യത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി. מן എന്നതിന്റെ ബന്ധം തുടർന്നുള്ള ‘അതിൽനിന്നു’ എന്ന പ്രയോഗത്തിൽ വ്യക്തമായി നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടനയ്ക്കായി ആദ്യഘടകത്തെ ‘ഫലത്തെക്കുറിച്ച്’ എന്നു ക്രമീകരിക്കുകയും ചെയ്തു.
- source_word: הָעֵץ
  choice: വൃക്ഷം
  rationale: നിശ്ചിതമായ ഒരൊറ്റ വൃക്ഷത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ പദം.
- source_word: אֲשֶׁר בְּתוֹךְ הַגָּן
  choice: തോട്ടത്തിന്റെ നടുവിലുള്ള
  rationale: בְּתוֹךְ എന്നത് തോട്ടത്തിന്റെ അകത്തെ മധ്യസ്ഥാനം സൂചിപ്പിക്കുന്നു; ‘നടുവിലുള്ള’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אָמַר אֱלֹהִים
  choice: ദൈവം പറഞ്ഞു
  rationale: മുമ്പ് ഉച്ചരിച്ച വാക്കിനെ റിപ്പോർട്ട് ചെയ്യുന്ന qatal രൂപത്തിന്റെ ലളിതവും സ്വാഭാവികവുമായ വിവർത്തനം.
- source_word: לֹא תֹאכְלוּ מִמֶּנּוּ
  choice: നിങ്ങൾ അതിൽനിന്നു തിന്നരുത്
  rationale: നിഷേധാത്മക കല്പനയുടെ ബലം ‘തിന്നരുത്’ എന്നതിൽ നിലനിർത്തുന്നു; מן എന്ന ഉപസർഗത്തിന്റെ അർഥം ‘അതിൽനിന്നു’ എന്ന് വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְלֹא תִגְּעוּ בוֹ
  choice: അതു തൊടുകയും അരുത്
  rationale: നגעയുടെ നേരിട്ടുള്ള അർഥമായ ‘തൊടുക’ നിലനിർത്തുകയും וְ സൂചിപ്പിക്കുന്ന കൂട്ടിച്ചേർക്കൽ ‘-ുകയും അരുത്’ എന്ന സ്വാഭാവിക മലയാളഘടനയിൽ നൽകുകയും ചെയ്തു.
- source_word: פֶּן תְּמֻתוּן
  choice: ഇല്ലെങ്കിൽ നിങ്ങൾ മരിച്ചുപോകും
  rationale: פֶּן അവതരിപ്പിക്കുന്ന മുന്നറിയിപ്പും അനിഷ്ടഫലവും സ്വാഭാവിക മലയാളത്തിൽ ‘ഇല്ലെങ്കിൽ’ എന്നു പ്രകടിപ്പിക്കുന്നു; മരണഫലം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉല്പത്തി 2:17-ലെ ദൈവകല്പനയിൽ ഇല്ലാത്ത ‘അതു തൊടുകയും അരുത്’ എന്ന വാക്ക് ഹവ്വായുടെ റിപ്പോർട്ടിൽ ഉൾപ്പെടുന്നു.
  choice: ഈ വാക്യത്തിലെ ഹവ്വായുടെ വാക്കുകൾ ഉള്ളതുപോലെ വിവർത്തനം ചെയ്ത് ‘അതു തൊടുകയും അരുത്’ എന്നു നിലനിർത്തി.
  alternative: ഉല്പത്തി 2:17-നോട് ഒത്തുചേരാൻ ഈ വിലക്ക് ഒഴിവാക്കുകയോ മൃദൂകരിക്കുകയോ ചെയ്യുക.
  rationale: എബ്രായപാഠത്തിലെ വിവരണപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം പരിഹരിക്കാതെ അതേപടി സംരക്ഷിക്കണം.
- issue: פֶּן എന്ന പദം ഉറപ്പായ ഫലത്തെയും ആശങ്കാപൂർവമായ മുന്നറിയിപ്പിനെയും തമ്മിൽ സ്പർശിക്കുന്ന അർഥവ്യാപ്തിയുള്ളതാണ്.
  choice: സ്വാഭാവിക മുന്നറിയിപ്പായി ‘ഇല്ലെങ്കിൽ നിങ്ങൾ മരിച്ചുപോകും’ എന്നു നൽകി.
  alternative: ‘നിങ്ങൾ മരിച്ചുപോയേക്കാം’ അല്ലെങ്കിൽ ‘നിങ്ങൾ മരിച്ചുപോകാതിരിക്കാൻ’ എന്നു നൽകുക.
  rationale: ‘മരിച്ചുപോയേക്കാം’ അനാവശ്യമായി വെറും സാധ്യതയാക്കാം; ‘മരിച്ചുപോകാതിരിക്കാൻ’ ഉദ്ദേശ്യബന്ധം ശക്തമാക്കാം. ‘ഇല്ലെങ്കിൽ’ കല്പനയോടു ചേർന്ന അനിഷ്ടഫലത്തെ വ്യക്തമായി അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി സ്വീകരിച്ചു. ‘വൃക്ഷം’ എന്ന പദം ബൈബിൾ ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. ഉദ്ധരണിയിലെ അധിക വിലക്ക് യാതൊരു സമന്വയവൽക്കരണവും കൂടാതെ സംരക്ഷിച്ചു.
