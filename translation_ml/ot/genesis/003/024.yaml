id: GEN.3.24
reference: Genesis 3:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְגָ֖רֶשׁ אֶת הָֽ/אָדָ֑ם וַ/יַּשְׁכֵּן֩ מִ/קֶּ֨דֶם לְ/גַן עֵ֜דֶן אֶת הַ/כְּרֻבִ֗ים וְ/אֵ֨ת לַ֤הַט הַ/חֶ֨רֶב֙ הַ/מִּתְהַפֶּ֔כֶת לִ/שְׁמֹ֕ר אֶת דֶּ֖רֶךְ עֵ֥ץ הַֽ/חַיִּֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/024.yaml
  text: So he drove out the man[a], and to the east of the garden of Eden he stationed the cherubim and the flame of the sword that turns every way[b], to guard the way to the tree of life.
translation:
  language: ml
  text: അങ്ങനെ അവൻ മനുഷ്യനെ പുറത്താക്കി; ജീവവൃക്ഷത്തിലേക്കുള്ള വഴി കാക്കാൻ ഏദെൻതോട്ടത്തിന്റെ കിഴക്കുവശത്ത് കെരൂബുകളെയും എല്ലാ ദിക്കിലേക്കും തിരിയുന്ന വാളിന്റെ ജ്വാലയെയും അവൻ കാവൽ നിർത്തി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: പുറത്താക്കി
  rationale: גרשׁ ബലമായി പുറത്താക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ദൈവത്തിന്റെ നിർബന്ധിത നടപടിയുടെ ശക്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: הָאָדָם
  choice: മനുഷ്യനെ
  rationale: ഇവിടെ മുമ്പ് സൃഷ്ടിക്കപ്പെട്ട് തോട്ടത്തിൽ പാർപ്പിക്കപ്പെട്ട വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ 'മനുഷ്യൻ' വ്യക്തിപരമായ അർഥവും ആദാം എന്ന പൊതുനാമബന്ധവും നിലനിർത്തുന്നു.
- source_word: וַיַּשְׁכֵּן
  choice: കാവൽ നിർത്തി
  rationale: שכן എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഒരു സ്ഥലത്ത് പാർപ്പിക്കുകയോ നിലയുറപ്പിക്കുകയോ ചെയ്യുന്നതാണ്. കാക്കുക എന്ന ലക്ഷ്യവുമായി ചേർന്നപ്പോൾ 'കാവൽ നിർത്തി' സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: מִקֶּדֶם לְגַן עֵדֶן
  choice: ഏദെൻതോട്ടത്തിന്റെ കിഴക്കുവശത്ത്
  rationale: ഈ സ്ഥലസൂചക പ്രയോഗം തോട്ടത്തിന്റെ കിഴക്കൻ ഭാഗത്തെയോ മുൻവശത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ 'കിഴക്കുവശത്ത്' വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַכְּרֻבִים
  choice: കെരൂബുകളെ
  rationale: പ്രത്യേകതരം സ്വർഗീയ ജീവികളെ സൂചിപ്പിക്കുന്ന എബ്രായപദത്തിന്റെ സ്ഥാപിതമായ ബൈബിൾ ലിപ്യന്തരണമാണ് 'കെരൂബ്'; ഇവിടെ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת
  choice: എല്ലാ ദിക്കിലേക്കും തിരിയുന്ന വാളിന്റെ ജ്വാലയെ
  rationale: എബ്രായത്തിലെ 'വാളിന്റെ ജ്വാല' എന്ന ഘടനയും הַמִּתְהַפֶּכֶת എന്ന വർത്തമാനസ്വഭാവമുള്ള ചലനവും സംരക്ഷിക്കുന്നു. പരമ്പരാഗതമായ 'ജ്വലിക്കുന്ന വാൾ' എന്ന ലഘൂകരണം ഒഴിവാക്കി യഥാർഥ രൂപകത്തിന്റെ അസാധാരണത നിലനിർത്തി.
- source_word: לִשְׁמֹר
  choice: കാക്കാൻ
  rationale: പ്രവേശനം തടയുന്ന ഈ സന്ദർഭത്തിൽ שמר എന്നതിന് 'കാക്കുക' യോജിക്കുന്നു.
- source_word: דֶּרֶךְ
  choice: വഴി
  rationale: ജീവവൃക്ഷത്തിലേക്കു നയിക്കുന്ന പാത എന്ന അർഥം മലയാളത്തിലെ ദിശാസൂചകമായ '-ലേക്കുള്ള വഴി' വ്യക്തമായി നൽകുന്നു.
- source_word: עֵץ הַחַיִּים
  choice: ജീവവൃക്ഷം
  rationale: എബ്രായ സംയുക്തപദത്തിന്റെ സ്ഥാപിതവും നേരിട്ടുള്ളതുമായ മലയാളപരിഭാഷയാണിത്.
theological_decisions:
- issue: אָדָם എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മനുഷ്യനെ
  alternative: ആദാമിനെ / മനുഷ്യവർഗത്തെ
  rationale: വാക്യം മനുഷ്യവർഗത്തെ അമൂർത്തമായി അല്ല, തോട്ടത്തിൽനിന്നു പുറത്താക്കപ്പെട്ട പ്രത്യേക വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. എന്നാൽ മൂലപാഠത്തിൽ വ്യക്തിനാമരൂപം നിർബന്ധമല്ലാത്തതിനാൽ 'ആദാമിനെ' എന്നു പ്രത്യേകീകരിച്ചില്ല.
- issue: לַהַט הַחֶרֶב എന്ന ദൃശ്യത്തിന്റെ വ്യാഖ്യാനം
  choice: വാളിന്റെ ജ്വാല
  alternative: ജ്വലിക്കുന്ന വാൾ
  rationale: മൂലപാഠത്തിലെ സംയുക്തഘടനയും അതിലെ ദൃശ്യപരമായ അസ്പഷ്ടതയും നിലനിർത്തുന്നു; ഒരു പ്രത്യേക അതീന്ദ്രിയ വസ്തുവിനെക്കുറിച്ചുള്ള സിദ്ധാന്തം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യത്തിന്റെ അസാധാരണമായ ‘വാളിന്റെ ജ്വാല’ എന്ന രൂപം നിലനിർത്തിയപ്പോൾ അടിക്കുറിപ്പിലൂടെ പരമ്പരാഗത പരിഭാഷ അറിയിച്ചു.
