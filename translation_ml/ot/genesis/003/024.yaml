    rationale: הַמִּתְהַפֶּכֶת എന്ന പങ്കുപ്രയോഗം പ്രധാനവാചകത്തിലെ ‘തിരിയുന്ന’ എന്ന രൂപത്തോടും ‘turns every way’ എന്ന ആശയത്തോടും യോജിക്കുന്ന തുടർന്നുനിൽക്കുന്ന/വർത്തമാന ചലനം സൂചിപ്പിക്കുന്നു. അടിക്കുറിപ്പിൽ ‘തിരിയുന്ന’ എന്നാക്കുന്നത് കാലഭേദത്തിലുള്ള അനാവശ്യ വ്യത്യാസം ഒഴിവാക്കും.
