- from: അങ്ങനെ അവൻ മനുഷ്യനെ പുറത്താക്കി; ജീവവൃക്ഷത്തിലേക്കുള്ള വഴി കാക്കാൻ ഏദെൻതോട്ടത്തിന്റെ കിഴക്കുവശത്ത് കെരൂബുകളെയും എല്ലാ ദിക്കിലേക്കും തിരിയുന്ന വാളിന്റെ ജ്വാലയെയും[a] അവൻ കാവൽ നിർത്തി.
  to: അങ്ങനെ അവൻ മനുഷ്യനെ പുറത്താക്കി; ജീവവൃക്ഷത്തിലേക്കുള്ള വഴി കാക്കാൻ ഏദെൻതോട്ടത്തിന്റെ കിഴക്കുവശത്ത് കെരൂബുകളെയും എല്ലാ ദിക്കിലേക്കും തിരിയുന്ന വാളിന്റെ ജ്വാലയെയും അവൻ കാവൽ നിർത്തി.
