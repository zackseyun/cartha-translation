  to: പകലിന്റെ കാറ്റിൽ[b] തോട്ടത്തിൽ നടക്കുകയായിരുന്ന യഹ്‌വെ ദൈവത്തിന്റെ ശബ്ദം[a] അവർ കേട്ടു. അപ്പോൾ ആ മനുഷ്യനും[c] അവന്റെ ഭാര്യയും യഹ്‌വെ ദൈവത്തിന്റെ സന്നിധിയിൽനിന്ന് തോട്ടത്തിലെ മരങ്ങൾക്കിടയിൽ ഒളിച്ചു.
  rationale: വാക്യത്തിന്റെ അർഥം മാറ്റാതെ, וְאִשְׁתּוֹയിലെ ‘his’ എന്ന പ്രത്യയാർഥം ‘അവന്റെ ഭാര്യ’ എന്നതിലൂടെ വ്യക്തമായി പുനഃസ്ഥാപിച്ചു. ‘പകലിന്റെ കാറ്റിൽ’ എന്ന ചെറിയ ശൈലീമാറ്റം എബ്രായ ഘടനയെയും ആധുനിക മലയാള പ്രയോഗത്തെയും കൂടുതൽ നന്നായി പ്രതിഫലിപ്പിക്കുന്നു. അടിക്കുറിപ്പുകളുടെ ആങ്കറുകളും അവയുടെ ഉള്ളടക്കവും നിലനിർത്തിയിരിക്കുന്നു.
