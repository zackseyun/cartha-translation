id: GEN.3.8
reference: Genesis 3:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֞וּ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהִ֛ים מִתְהַלֵּ֥ךְ בַּ/גָּ֖ן לְ/ר֣וּחַ הַ/יּ֑וֹם וַ/יִּתְחַבֵּ֨א הָֽ/אָדָ֜ם וְ/אִשְׁתּ֗/וֹ מִ/פְּנֵי֙ יְהוָ֣ה אֱלֹהִ֔ים בְּ/ת֖וֹךְ עֵ֥ץ הַ/גָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/008.yaml
  text: And they heard the sound of Yahweh God walking in the garden in the breeze of the day[c][b][a], and the man and his wife hid themselves from the presence of Yahweh God among the trees of the garden.
translation:
  language: ml
  text: പകലിന്റെ കാറ്റിൽ[b] തോട്ടത്തിൽ നടക്കുകയായിരുന്ന യഹ്‌വെ ദൈവത്തിന്റെ ശബ്ദം[a] അവർ കേട്ടു. അപ്പോൾ ആ മനുഷ്യനും[c] അവന്റെ ഭാര്യയും യഹ്‌വെ ദൈവത്തിന്റെ സന്നിധിയിൽനിന്ന് തോട്ടത്തിലെ മരങ്ങൾക്കിടയിൽ ഒളിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘യഹ്‌വെ ദൈവത്തിന്റെ സ്വരം.’ എബ്രായപദത്തിന് ‘ശബ്ദം’ എന്നും ‘സ്വരം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ, ‘പകലിന്റെ തണുപ്പിൽ.’ അക്ഷരാർഥം: ‘പകലിന്റെ കാറ്റിൽ.’'
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ ‘ആ മനുഷ്യൻ’; ‘ആദാം’ എന്നും വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: ശബ്ദം
  rationale: ഈ പദത്തിന് ‘ശബ്ദം’ എന്നും ‘സ്വരം’ എന്നും അർഥമാകാം. ഇവിടെ ദൈവം സംസാരിച്ചതായി വാക്യം വ്യക്തമായി പറയാത്തതിനാൽ ‘ശബ്ദം’ എന്നത് മൂലപാഠത്തിലെ അവ്യക്തത ഏറ്റവും നന്നായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: יְהוָה എന്ന വ്യക്തിനാമത്തോടു ചേർന്നുള്ള സാധാരണ ദൈവനാമമായി പരിഭാഷപ്പെടുത്തി.
- source_word: מִתְהַלֵּךְ
  choice: നടക്കുകയായിരുന്ന
  rationale: തോട്ടത്തിനുള്ളിലെ സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്ന ഹിത്പയേൽ രൂപത്തിന്റെ സജീവവും മനുഷ്യരൂപാരോപിതവുമായ ചിത്രണം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: לְרוּחַ הַיּוֹם
  choice: പകലത്തെ കാറ്റിൽ
  rationale: רוּחַ എന്നത് കാറ്റ്, ശ്വാസം, ആത്മാവ് എന്നീ അർഥങ്ങൾ വഹിക്കാം. ഇവിടെ ദിവസത്തിന്റെ കാറ്റിനെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ രൂപകം നിലനിർത്തി; ‘പകലിന്റെ തണുപ്പിൽ’ എന്നത് അതിന്റെ ഫലത്തെ വ്യാഖ്യാനിക്കുന്ന പരിഭാഷയായിരിക്കും.
- source_word: הָאָדָם
  choice: ആ മനുഷ്യൻ
  rationale: ‘ഭാര്യ’ എന്ന ഉടനെയുള്ള സന്ദർഭം ഒരു പ്രത്യേക പുരുഷനെ സൂചിപ്പിക്കുന്നതിനാൽ വ്യക്തിവാചക അർഥം മുൻനിർത്തി; ‘ആദാം’ എന്ന പേരായുള്ള വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: מִפְּנֵי
  choice: സന്നിധിയിൽനിന്ന്
  rationale: ‘മുഖത്തുനിന്ന്/സന്നിധിയിൽനിന്ന്’ എന്ന സ്ഥലപരവും ബന്ധപരവുമായ ആശയം വെറും ‘നിന്ന്’ എന്നതിനെക്കാൾ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: בְּתוֹךְ עֵץ הַגָּן
  choice: തോട്ടത്തിലെ മരങ്ങൾക്കിടയിൽ
  rationale: עֵץ രൂപത്തിൽ ഏകവചനമാണെങ്കിലും ഇവിടെ സമൂഹവാചകമായി മരങ്ങളെ സൂചിപ്പിക്കുന്നു; ഒളിക്കുന്ന സന്ദർഭത്തിലും മലയാളശൈലിയിലും ബഹുവചനം സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ദൈവം തോട്ടത്തിൽ ‘നടക്കുന്നു’ എന്ന മനുഷ്യരൂപാരോപിത ചിത്രണം
  choice: ‘നടക്കുകയായിരുന്ന’ എന്ന മൂർത്തമായ ഭാഷ അതേപടി നിലനിർത്തി.
  alternative: ‘തോട്ടത്തിൽ സഞ്ചരിച്ചുകൊണ്ടിരുന്ന’ അല്ലെങ്കിൽ ‘ദൈവസാന്നിധ്യത്തിന്റെ ശബ്ദം’
  rationale: എബ്രായ വിവരണം ദൈവത്തെ സജീവമായ ആഖ്യാനഭാഷയിൽ അവതരിപ്പിക്കുന്നു. അതിനെ രൂപകമെന്നു വിശദീകരിക്കുകയോ അമൂർത്തമാക്കുകയോ ചെയ്യാതെ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിച്ചു.
- issue: הָאָדָם എന്നതിന്റെ അർഥം
  choice: ആ മനുഷ്യൻ
  alternative: ആദാം; മനുഷ്യൻ
  rationale: ഈ പദത്തിന് വ്യക്തിവാചകവും പ്രതിനിധാനപരവുമായ ധ്വനികളുണ്ട്. ‘ഭാര്യ’ എന്ന ഉടനെയുള്ള പരാമർശം വ്യക്തിയായ പുരുഷനെ മുൻനിർത്തുന്നതിനാൽ ‘ആ മനുഷ്യൻ’ സ്വീകരിച്ചു; പേരായുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം ഉപയോഗിച്ചു. വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കിയെങ്കിലും ‘ശബ്ദം/സ്വരം,’ ‘പകലത്തെ കാറ്റ്,’ ദൈവത്തിന്റെ നടത്തം, הָאָדָם എന്നിവയിലെ മൂലപാഠത്തിന്റെ അവ്യക്തതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി.
