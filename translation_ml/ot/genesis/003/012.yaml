id: GEN.3.12
reference: Genesis 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר הָֽ/אָדָ֑ם הָֽ/אִשָּׁה֙ אֲשֶׁ֣ר נָתַ֣תָּה עִמָּדִ֔/י הִ֛וא נָֽתְנָה לִּ֥/י מִן הָ/עֵ֖ץ וָ/אֹכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/012.yaml
  text: And the man said[a], “The woman whom you gave to be with me—she gave me from the tree, and I ate.”
translation:
  language: ml
  text: 'ആ മനുഷ്യൻ പറഞ്ഞു: “എന്നോടുകൂടെ ഇരിക്കാൻ അങ്ങ് തന്ന സ്ത്രീ—അവളാണ് ആ വൃക്ഷത്തിൽനിന്ന് എനിക്കു തന്നത്[a]; ഞാൻ തിന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രായിൽ അക്ഷരാർഥത്തിൽ “വൃക്ഷത്തിൽനിന്ന്”; അവൾ തന്നത് എന്താണെന്ന് സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കാം.
    reason: മൂലപാഠത്തിൽ ‘ഫലം’ എന്ന പദം ഇല്ലെന്ന കാര്യം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: הָאָדָם
  choice: ആ മനുഷ്യൻ
  rationale: ഇവിടെ മനുഷ്യവർഗത്തെ പൊതുവായി അല്ല, ആ പ്രത്യേക പുരുഷനെ സൂചിപ്പിക്കുന്നതിനാൽ വ്യക്തിഗത അർഥം നിലനിർത്തുന്നു; നിർദേശകത ‘ആ’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: הָאִשָּׁה
  choice: സ്ത്രീ
  rationale: ഹീബ്രായിലെ നേരിട്ടുള്ള പദപ്രയോഗം നിലനിർത്തുന്നു; ‘ഭാര്യ’ എന്ന സാദ്ധ്യമായ അർഥം ഇവിടെ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: אֲשֶׁר נָתַתָּה עִמָּדִי
  choice: എന്നോടുകൂടെ ഇരിക്കാൻ അങ്ങ് തന്ന
  rationale: עִמָּדִי എന്നതിലെ സഹവാസബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ദൈവത്തോടുള്ള അഭിസംബോധനയ്ക്ക് മാന്യമായ ‘അങ്ങ്’ ഉപയോഗിക്കുന്നു.
- source_word: הִוא
  choice: അവളാണ്
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ ‘-ആണ്’ രൂപത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: נָתְנָה לִי מִן הָעֵץ
  choice: ആ വൃക്ഷത്തിൽനിന്ന് എനിക്കു തന്നത്
  rationale: മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ഫലം’ ചേർക്കാതെ, സന്ദർഭത്തിൽനിന്ന് കർമം ഗ്രഹിക്കാവുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: וָאֹכֵל
  choice: ഞാൻ തിന്നു
  rationale: ലളിതമായ ഭൂതകാല കഥനമായി വിവർത്തനം ചെയ്ത്, ‘അതുകൊണ്ട്’ പോലുള്ള അധിക കാരണബന്ധം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: മനുഷ്യൻ കുറ്റം സ്ത്രീയിലേക്കും പരോക്ഷമായി ദൈവത്തിലേക്കും മാറ്റുന്നതായി തോന്നാവുന്ന സൂചന
  choice: “അങ്ങ് തന്ന സ്ത്രീ” എന്ന മൂലവാചകത്തിന്റെ മുറുക്കം അതേപടി നിലനിർത്തുക
  alternative: “എന്നോടുകൂടെ ഉണ്ടായിരുന്ന സ്ത്രീ” എന്നിങ്ങനെ ദൈവത്തിന്റെ പങ്ക് മയപ്പെടുത്തുക
  rationale: മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരവും നൈതികവുമായ സംഘർഷം മയപ്പെടുത്തുകയോ കൂടുതൽ കടുപ്പിക്കുകയോ ചെയ്യാതെ വായനക്കാരന് നേരിട്ട് നേരിടാൻ അനുവദിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. സംഭാഷണത്തിന്റെ കുറ്റമാറ്റുന്ന സ്വരം വ്യാഖ്യാനിച്ച് വർധിപ്പിക്കാതെ, ‘അവളാണ്’ എന്ന ഊന്നലും വാക്യത്തിലെ പെട്ടെന്നുള്ള തിരിവും ഡാഷിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
