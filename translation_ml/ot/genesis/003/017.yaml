source:
  edition: WLC
  text: וּ/לְ/אָדָ֣ם אָמַ֗ר כִּֽי שָׁמַעְתָּ֮ לְ/ק֣וֹל אִשְׁתֶּ/ךָ֒ וַ/תֹּ֨אכַל֙ מִן הָ/עֵ֔ץ אֲשֶׁ֤ר צִוִּיתִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ אֲרוּרָ֤ה הָֽ/אֲדָמָה֙ בַּֽ/עֲבוּרֶ֔/ךָ בְּ/עִצָּבוֹן֙ תֹּֽאכֲלֶ֔/נָּה כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/017.yaml
  text: And to Adam he said[a], “Because you listened to the voice of your wife and ate from the tree about which I commanded you, saying, ‘You shall not eat from it,’ the ground is cursed because of you[f][e][d][c][b]; in painful toil you shall eat from it all the days of your life.”
translation:
  language: ml
  text: 'ആദാമിനോട്[a] അവിടുന്ന് പറഞ്ഞു: “നീ നിന്റെ ഭാര്യയുടെ വാക്കു കേൾക്കുകയും, ‘അതിൽനിന്നു തിന്നരുത്’ എന്നു ഞാൻ നിന്നോടു കല്പിച്ച വൃക്ഷത്തിൽനിന്നു തിന്നുകയും ചെയ്തതിനാൽ, നീ നിമിത്തം മണ്ണ് ശപിക്കപ്പെട്ടിരിക്കുന്നു. നിന്റെ ആയുഷ്കാലമൊക്കെയും കഷ്ടപ്പാടോടെ[b] നീ അതിൽനിന്നുള്ള ആഹാരം കഴിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മനുഷ്യനോട്.”
    reason: alternative_reading
  - marker: b
    text: ഇവിടെയുള്ള ഹീബ്രുപദം “വേദനയോടെ” എന്നോ “ദുഃഖത്തോടെ” എന്നോ വിവർത്തനം ചെയ്യാം; ഇവിടെ ആഹാരം നേടാനുള്ള കഠിനാധ്വാനവും ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָדָם
  choice: ആദാമിനോട്
  rationale: സന്ദർഭത്തിൽ ഒരു പ്രത്യേക വ്യക്തിയെയാണ് അഭിസംബോധന ചെയ്യുന്നത്; എങ്കിലും ‘മനുഷ്യനോട്’ എന്ന വായനയ്ക്കുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: שָׁמַעְתָּ לְקוֹל אִשְׁתֶּךָ
  choice: നിന്റെ ഭാര്യയുടെ വാക്കു കേൾക്കുകയും
  rationale: ‘ശബ്ദം കേൾക്കുക’ എന്ന അക്ഷരാർഥത്തേക്കാൾ മലയാളത്തിൽ സ്വാഭാവികമായി ഉപദേശം അനുസരിച്ചതിന്റെ ആശയം നൽകുന്നു; ‘അനുസരിച്ചു’ എന്നു മാത്രം പറഞ്ഞ് അർഥം അതിയായി നിർണ്ണയിക്കുന്നതും ഒഴിവാക്കുന്നു.
- source_word: אֲשֶׁר צִוִּיתִיךָ לֵאמֹר
  choice: ‘അതിൽനിന്നു തിന്നരുത്’ എന്നു ഞാൻ നിന്നോടു കല്പിച്ച
  rationale: לֵאמֹר അവതരിപ്പിക്കുന്ന കല്പനയുടെ ഉള്ളടക്കം മലയാളത്തിൽ നേരിട്ടുള്ള ഉദ്ധരണിയായി സ്വാഭാവികമായി ചേർക്കുന്നു.
- source_word: אֲרוּרָה הָאֲדָמָה
  choice: മണ്ണ് ശപിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: കൃഷിയും ആഹാരലഭ്യതയും പ്രസക്തമായതിനാൽ הָאֲדָמָהയ്ക്ക് ‘ഭൂമി’ എന്നതിനെക്കാൾ ‘മണ്ണ്’ യോജിക്കുന്നു; ഹീബ്രു വിധേയഘടനയുടെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: בַּעֲבוּרֶךָ
  choice: നീ നിമിത്തം
  rationale: ആദാമിന്റെ പ്രവൃത്തി ശാപത്തിന്റെ കാരണമാണെന്ന ആശയം നൽകുന്നു; ‘നിനക്കുവേണ്ടി’ എന്ന പ്രയോജനാർഥക തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: בְּעִצָּבוֹן
  choice: കഷ്ടപ്പാടോടെ
  rationale: പദത്തിന് ദുഃഖം, വേദന, കഠിനപ്രയത്നം എന്നീ അർഥവ്യാപ്തികളുണ്ട്; ആഹാരം നേടാനുള്ള അധ്വാനസന്ദർഭത്തിൽ ‘കഷ്ടപ്പാടോടെ’ സ്വാഭാവികമാണ്, മറ്റു സൂക്ഷ്മാർഥങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: תֹּאכֲלֶנָּה
  choice: അതിൽനിന്നുള്ള ആഹാരം കഴിക്കും
  rationale: സ്ത്രീലിംഗ പ്രത്യയം ‘മണ്ണ്’ എന്നതിലേക്കാണ് മടങ്ങുന്നത്; മണ്ണുതന്നെ തിന്നുന്നു എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കി അതിൽനിന്നു ലഭിക്കുന്ന ആഹാരമാണ് ഉദ്ദേശ്യമെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: നിന്റെ ആയുഷ്കാലമൊക്കെയും
  rationale: ജീവിതകാലം മുഴുവനുമെന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഗൗരവവും സമഗ്രതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: אָדָם എന്ന പദം വ്യക്തിനാമമായോ പൊതുനാമമായോ വിവർത്തനം ചെയ്യുന്നത്
  choice: ആദാം
  alternative: മനുഷ്യൻ
  rationale: ഈ വാക്യത്തിൽ ഏദെൻകഥയിലെ പ്രത്യേക പുരുഷനെയാണ് ദൈവം അഭിസംബോധന ചെയ്യുന്നത്. എന്നിരുന്നാലും ഹീബ്രുവിലെ രൂപം ‘മനുഷ്യൻ’ എന്നും ഗ്രഹിക്കാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: മണ്ണിന്മേലുള്ള ശാപത്തിന്റെ കാരണബന്ധം
  choice: നീ നിമിത്തം മണ്ണ് ശപിക്കപ്പെട്ടിരിക്കുന്നു
  alternative: നിന്റെ കാരണത്താൽ മണ്ണ് ശപിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ശാപം ആദാമിന് ഗുണകരമായ ഉദ്ദേശ്യത്താൽ വന്നതാണെന്ന വ്യാഖ്യാനം വരുത്താതെ, അവന്റെ പ്രവൃത്തിയോടുള്ള കാരണബന്ധം മാത്രം വ്യക്തമാക്കുന്നു.
- issue: בְּעִצָּבוֹן എന്ന പദത്തിലെ വേദനയും അധ്വാനവും
  choice: കഷ്ടപ്പാടോടെ
  alternative: വേദനയോടെ / ദുഃഖത്തോടെ
  rationale: കൃഷിയിലൂടെ ആഹാരം നേടുന്ന അധ്വാനമാണ് ഉടൻ വരുന്ന സന്ദർഭം; എങ്കിലും പദത്തിലെ വേദനയുടെയും ദുഃഖത്തിന്റെയും അനുരണനം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഗദ്യശൈലി സ്വീകരിച്ചു. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമമായി ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു. നേരിട്ടുള്ള ഉദ്ധരണിയും വിധിന്യായത്തിന്റെ ഗൗരവമുള്ള താളവും നിലനിർത്തി.
