id: GEN.3.10
reference: Genesis 3:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אֶת קֹלְ/ךָ֥ שָׁמַ֖עְתִּי בַּ/גָּ֑ן וָ/אִירָ֛א כִּֽי עֵירֹ֥ם אָנֹ֖כִי וָ/אֵחָבֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/010.yaml
  text: And he said[a], “I heard your voice in the garden, and I was afraid because I was naked, so I hid myself.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “തോട്ടത്തിൽ അങ്ങയുടെ ശബ്ദം[a] ഞാൻ കേട്ടു. ഞാൻ നഗ്നനായതിനാൽ ഭയപ്പെട്ടു; അതുകൊണ്ട് ഒളിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വരം.” എബ്രായത്തിലെ קוֹל (കോൽ) എന്ന പദത്തിന് “ശബ്ദം” എന്നും “സ്വരം” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: എബ്രായ ആഖ്യാനത്തിലെ സാധാരണ വയ്യിക്തോൽ തുടർച്ചയെ സ്വാഭാവികമായ മലയാള ആഖ്യാനരീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֶת־קֹלְךָ
  choice: അങ്ങയുടെ ശബ്ദം
  rationale: קוֹל എന്ന പദത്തിന് ‘ശബ്ദം’ എന്നും ‘സ്വരം’ എന്നും അർഥമാകാം. ഇവിടെ ‘ശബ്ദം’ എന്നത് സംസാരശബ്ദം മാത്രമായി അർഥം ചുരുക്കാതെ എബ്രായപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: שָׁמַעְתִּי
  choice: ഞാൻ കേട്ടു
  rationale: שמע എന്ന ക്രിയയുടെ കാൽ പൂർണരൂപത്തെ നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: בַּגָּן
  choice: തോട്ടത്തിൽ
  rationale: സന്ദർഭത്തിൽ മുമ്പേ പരിചയപ്പെടുത്തിയ നിർദിഷ്ട തോട്ടത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഈ സന്ദർഭം നിർദിഷ്ടത വ്യക്തമാക്കുന്നു.
- source_word: וָאִירָא
  choice: ഭയപ്പെട്ടു
  rationale: ആദാം അനുഭവിച്ച ഭയത്തെ ലളിതവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כִּי
  choice: ആയതിനാൽ
  rationale: ഭയത്തിന്റെ കാരണം സൂചിപ്പിക്കുന്ന കാരണബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עֵירֹם אָנֹכִי
  choice: ഞാൻ നഗ്നനായതിനാൽ
  rationale: എബ്രായത്തിലെ കാലസൂചനയില്ലാത്ത നാമവാക്യത്തെ മലയാളത്തിൽ അനാവശ്യമായി വർത്തമാനകാലത്തിലോ ഭൂതകാലത്തിലോ പരിമിതപ്പെടുത്താതെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וָאֵחָבֵא
  choice: അതുകൊണ്ട് ഒളിച്ചു
  rationale: ക്രിയയുടെ ആത്മനിഷ്ഠമായ ‘ഒളിക്കുക’ എന്ന അർഥവും മുൻവാക്യത്തോടുള്ള ഫലബന്ധവും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ദൈവസാന്നിധ്യവുമായി ബന്ധപ്പെട്ട קוֹל എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അങ്ങയുടെ ശബ്ദം
  alternative: അങ്ങയുടെ സ്വരം
  rationale: ദൈവം ഉച്ചരിച്ച വാക്കുകളാണെന്ന് ഈ വാക്യം നിർബന്ധമായും പറയുന്നില്ല. അതിനാൽ വിശാലമായ ‘ശബ്ദം’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും ‘സ്വരം’ എന്ന സാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- issue: עֵירֹם אָנֹכִי എന്ന കാലസൂചനയില്ലാത്ത വാക്യത്തിന്റെ അവതരണം
  choice: ഞാൻ നഗ്നനായതിനാൽ
  alternative: ഞാൻ നഗ്നനായിരുന്നു എന്നതിനാൽ / ഞാൻ നഗ്നനാണെന്നതിനാൽ
  rationale: എബ്രായ നാമവാക്യം സ്വതവേ കാലം നിർണ്ണയിക്കുന്നില്ല. മലയാളത്തിൽ ക്രിയാകാലം തുറന്നുവയ്ക്കുന്ന രൂപം ഉപയോഗിച്ച് ഈ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവും വായിക്കാൻ സ്വാഭാവികവുമായ ശൈലി. ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങയുടെ’ ഉപയോഗിച്ച് ആദരസൂചകമായ സാധാരണ മലയാളരീതി പാലിച്ചിരിക്കുന്നു; വാക്യത്തിന്റെ കാരണ-ഫലക്രമം വ്യക്തമായി സൂക്ഷിച്ചിരിക്കുന്നു.
