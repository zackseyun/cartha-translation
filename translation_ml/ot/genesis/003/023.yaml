source:
  edition: WLC
  text: וַֽ/יְשַׁלְּחֵ֛/הוּ יְהוָ֥ה אֱלֹהִ֖ים מִ/גַּן עֵ֑דֶן לַֽ/עֲבֹד֙ אֶת הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר לֻקַּ֖ח מִ/שָּֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/023.yaml
  text: So Yahweh God sent him out from the garden of Eden to work the ground from which he had been taken[a].
translation:
  language: ml
  text: അതിനാൽ, യഹ്‌വേ ദൈവം അവനെ ഏദെൻ തോട്ടത്തിൽനിന്ന്, അവൻ എടുക്കപ്പെട്ടിരുന്ന നിലം കൃഷി ചെയ്യാൻ[a], പുറത്തയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിലം പണിചെയ്യാൻ.” എബ്രായ ക്രിയയ്ക്ക് “പണിചെയ്യുക,” “സേവിക്കുക,” എന്നും ഈ സന്ദർഭത്തിൽ “കൃഷി ചെയ്യുക” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחֵהוּ
  choice: അവനെ ... പുറത്തയച്ചു
  rationale: പീയേൽ രൂപത്തിലുള്ള שׁלח ഇവിടെ അയച്ചുകളയുക/പുറത്തയക്കുക എന്ന അർഥം നൽകുന്നു. അടുത്ത വാക്യത്തിലെ ശക്തമായ גרשׁ എന്ന ക്രിയയുടെ ‘ഓടിച്ചുകളയുക’ എന്ന ഭാവം മുൻകൂട്ടി ചേർക്കാതെ, ഏദെനിൽനിന്നുള്ള നീക്കം വ്യക്തമായി പറയുന്നു.
- source_word: יְהוָה אֱלֹהִים
  choice: യഹ്‌വേ ദൈവം
  rationale: ദൈവനാമമായ יהוה ശബ്ദലിപ്യന്തരണമായി ‘യഹ്‌വേ’ എന്നും אֱלֹהִים ‘ദൈവം’ എന്നും നൽകി, സംയുക്തനാമം നിലനിർത്തുന്നു.
- source_word: מִגַּן עֵדֶן
  choice: ഏദെൻതോട്ടത്തിൽനിന്ന്
  rationale: מִן സൂചിപ്പിക്കുന്ന വേർപാടും പുറപ്പെടലും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לַעֲבֹד
  choice: കൃഷിചെയ്യാൻ
  rationale: עבד എന്നതിന് ജോലി ചെയ്യുക, സേവിക്കുക, കൃഷിചെയ്യുക എന്നീ അർഥങ്ങളുണ്ട്; ‘നിലം’ കർമമായിരിക്കുന്ന കാർഷികസന്ദർഭത്തിൽ ‘കൃഷിചെയ്യുക’ സ്വാഭാവികവും കൃത്യവുമാണ്. വിശാലമായ പദാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֶת הָאֲדָמָה
  choice: ആ നിലം
  rationale: אֲדָמָה ഇവിടെ മനുഷ്യൻ എടുക്കപ്പെട്ട മണ്ണ്/നിലം എന്ന ആഖ്യാനബന്ധം വഹിക്കുന്നു. മലയാളത്തിൽ കൃഷിയുടെ കർമമായി ‘നിലം’ സ്വാഭാവികമാണ്; നിർദ്ദേശകമായ ‘ആ’ അനുബന്ധവാക്യവുമായി ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר לֻקַּח מִשָּׁם
  choice: അവൻ എവിടെനിന്ന് എടുക്കപ്പെട്ടുവോ
  rationale: ഹീബ്രായിലെ കർമണിപ്രയോഗം നിലനിർത്തുകയും, ഈ പ്രവർത്തനം പുറത്തയക്കലിനു മുമ്പ് നടന്നതാണെന്ന ബന്ധം മലയാളത്തിലെ അനുബന്ധവാക്യഘടനയിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം പൊതുപദവിയായി മാറ്റാതെ സംരക്ഷിക്കുന്നു; പ്രത്യേക മതവിഭാഗത്തിന്റെ പതിവിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- issue: മനുഷ്യന്റെ ജോലിയും ആദ്യത്തെ ദൗത്യവും തമ്മിലുള്ള ബന്ധം
  choice: ആ നിലം കൃഷിചെയ്യാൻ
  alternative: നിലത്തിൽ പണിയെടുക്കാൻ / നിലത്തെ സേവിക്കാൻ
  rationale: കാർഷികസന്ദർഭവും ആദിയിലെ കൃഷിദൗത്യവുമായുള്ള പദബന്ധവും സൂക്ഷിക്കുന്നു; ശാപമോ വീണ്ടെടുപ്പോ സംബന്ധിച്ച അധിക വ്യാഖ്യാനം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പുറത്തയച്ചു’ എന്നത് നീക്കം വ്യക്തമാക്കുന്നു, എന്നാൽ അടുത്ത വാക്യത്തിലെ കൂടുതൽ ശക്തമായ ‘ഓടിച്ചുകളഞ്ഞു’ എന്ന ആശയം ഇവിടെ ഇറക്കുമതി ചെയ്യുന്നില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
