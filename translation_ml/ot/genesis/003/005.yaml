id: GEN.3.5
reference: Genesis 3:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֚י יֹדֵ֣עַ אֱלֹהִ֔ים כִּ֗י בְּ/יוֹם֙ אֲכָלְ/כֶ֣ם מִמֶּ֔/נּוּ וְ/נִפְקְח֖וּ עֵֽינֵי/כֶ֑ם וִ/הְיִיתֶם֙ כֵּֽ/אלֹהִ֔ים יֹדְעֵ֖י ט֥וֹב וָ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/005.yaml
  text: For God knows that on the day you eat from it[a], your eyes will be opened, and you will be like God, knowing good and evil.
translation:
  language: ml
  text: എന്തെന്നാൽ, നിങ്ങൾ അതിൽനിന്ന് തിന്നുന്ന നാളിൽ നിങ്ങളുടെ കണ്ണുകൾ തുറക്കപ്പെടുമെന്നും നന്മയും തിന്മയും അറിയുന്നവരായി നിങ്ങൾ ദൈവത്തെപ്പോലെ[a] ആകുമെന്നും ദൈവത്തിന് അറിയാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ദേവന്മാരെപ്പോലെ” അല്ലെങ്കിൽ “ദിവ്യജീവികളെപ്പോലെ.” എബ്രായത്തിലെ אֱלֹהִים എന്ന പദത്തിന് ചില സന്ദർഭങ്ങളിൽ ഈ അർത്ഥങ്ങളും വരാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ സർപ്പത്തിന്റെ അവകാശവാദത്തിന് വിശദീകരണമോ ന്യായീകരണമോ നൽകുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יֹדֵעַ אֱלֹהִים
  choice: ദൈവത്തിന് അറിയാം
  rationale: എബ്രായ പങ്കാളിത്തരൂപത്തിന്റെ വർത്തമാനകാല അർത്ഥം സ്വാഭാവികമായ മലയാള പ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: בְּיוֹם אֲכָלְכֶם מִמֶּנּוּ
  choice: നിങ്ങൾ അതിൽനിന്ന് തിന്നുന്ന നാളിൽ
  rationale: എബ്രായ കാലസൂചക പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു; ഇവിടെ ‘നാൾ’ എന്നത് നിർബന്ധമായും ഇരുപത്തിനാലു മണിക്കൂർ ദൈർഘ്യമുള്ള ദിവസമല്ല, പ്രവൃത്തി നടക്കുന്ന സമയത്തെയും സൂചിപ്പിക്കാം.
- source_word: וְנִפְקְחוּ עֵינֵיכֶם
  choice: നിങ്ങളുടെ കണ്ണുകൾ തുറക്കപ്പെടും
  rationale: നിഫാൽ രൂപത്തിലെ കർമ്മണിപ്രയോഗവും ഗ്രഹണബോധത്തെ സൂചിപ്പിക്കുന്ന രൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: וִהְיִיתֶם כֵּאלֹהִים
  choice: നിങ്ങൾ ദൈവത്തെപ്പോലെ ആകും
  rationale: היה എന്ന ക്രിയയുടെ ഫലാവസ്ഥയിലേക്കുള്ള മാറ്റം മലയാളത്തിലെ ‘ആകും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; אֱלֹהִים എന്നതിന്റെ മുഖ്യസന്ദർഭാർഥമായി ‘ദൈവം’ സ്വീകരിക്കുന്നു.
- source_word: יֹדְעֵי טוֹב וָרָע
  choice: നന്മയും തിന്മയും അറിയുന്നവരായി
  rationale: പങ്കാളിത്തരൂപവും ‘നന്മയും തിന്മയും’ എന്ന അർത്ഥഭാരമുള്ള വിരുദ്ധപദജോടിയും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: כֵּאלֹהִים എന്നതിലെ אֱלֹהִים-ന്റെ സൂചിതവസ്തു
  choice: ദൈവത്തെപ്പോലെ
  alternative: ദേവന്മാരെപ്പോലെ; ദിവ്യജീവികളെപ്പോലെ
  rationale: സമീപസന്ദർഭത്തിൽ אֱלֹהִים ഏകദൈവത്തെ സൂചിപ്പിക്കുന്നതും ‘നന്മയും തിന്മയും അറിയുക’ എന്നത് ദൈവിക അറിവുമായി ബന്ധിപ്പിക്കപ്പെടുന്നതും മുഖ്യവായനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും എബ്രായ പദത്തിന്റെ യഥാർഥ ബഹുവ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം ഗൗരവവും സ്വാഭാവികതയും ചേർന്ന ശൈലി. ‘തിന്നുന്ന നാളിൽ’ എന്ന പ്രയോഗം മൂലഭാഷയുടെ കാലസൂചക രൂപം നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ സുതാര്യമാണ്.
