reference: Genesis 3:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֣ה אֱלֹהִ֗ים הֵ֤ן הָֽ/אָדָם֙ הָיָה֙ כְּ/אַחַ֣ד מִמֶּ֔/נּוּ לָ/דַ֖עַת ט֣וֹב וָ/רָ֑ע וְ/עַתָּ֣ה פֶּן יִשְׁלַ֣ח יָד֗/וֹ וְ/לָקַח֙ גַּ֚ם מֵ/עֵ֣ץ הַֽ/חַיִּ֔ים וְ/אָכַ֖ל וָ/חַ֥י לְ/עֹלָֽם׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/022.yaml
  text: Then Yahweh God said[a], “Behold, the man has become like one of us, knowing good and evil. And now, lest he reach out his hand and also take from the tree of life and eat, and live forever—”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ ദൈവം പറഞ്ഞു: “ഇതാ, നന്മയും തിന്മയും അറിയുന്നവനായി മനുഷ്യൻ നമ്മിൽ ഒരാളെപ്പോലെ[a] ആയിത്തീർന്നിരിക്കുന്നു. ഇനി അവൻ കൈ നീട്ടി ജീവവൃക്ഷത്തിൽനിന്നുകൂടി എടുത്തു തിന്നുകയും എന്നേക്കും ജീവിക്കുകയും ചെയ്യുമോ—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നമ്മിൽ’ എന്ന ഹീബ്രു രൂപം ബഹുവചനമാണ്. ഇതിനെ ദൈവികസഭയെ സൂചിപ്പിക്കുന്ന ഭാഷയായോ, ആലോചനാബഹുവചനമായോ, ദൈവത്തിനുള്ളിലെ ബഹുത്വത്തെ സൂചിപ്പിക്കുന്നതായോ വ്യാഖ്യാതാക്കൾ വിവിധമായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: യഹ്‌വേ ദൈവം
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു; אֱלֹהִים അപ്പൊസിഷനായി ‘ദൈവം’ എന്നു നൽകി.
- source_word: הֵן
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യാക്ഷേപകത്തിന്റെ ഗൗരവവും ദൈക്തികബലവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָאָדָם
  choice: മനുഷ്യൻ
  rationale: ഇവിടെ മുമ്പ് പരാമർശിച്ച വ്യക്തിയായ മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്; നിർദിഷ്ടത ക്രിയാസന്ദർഭത്തിലൂടെ മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: הָיָה כְּאַחַד מִמֶּנּוּ
  choice: നമ്മിൽ ഒരാളെപ്പോലെ ആയിത്തീർന്നിരിക്കുന്നു
  rationale: ലംഘനത്തിനുശേഷം ഉണ്ടായതും ഇപ്പോഴും നിലനിൽക്കുന്നതുമായ ഫലാവസ്ഥയെ ‘ആയിത്തീർന്നിരിക്കുന്നു’ വ്യക്തമാക്കുന്നു; ഒന്നാംപുരുഷ ബഹുവചനം അതേപടി സൂക്ഷിക്കുന്നു.
- source_word: לָדַעַת טוֹב וָרָע
  choice: നന്മയും തിന്മയും അറിയുന്നവനായി
  rationale: അറിവിനെ സംബന്ധിച്ച താരതമ്യത്തിന്റെ വിശദീകരണബലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; നൈതിക-ജ്ഞാനപരമായ അർഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
- source_word: יִשְׁלַח יָדוֹ
  choice: കൈ നീട്ടി
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യമായ പ്രവർത്തനചിത്രം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְלָקַח גַּם מֵעֵץ הַחַיִּים
  choice: ജീവവൃക്ഷത്തിൽനിന്നുംകൂടി എടുത്തു
  rationale: גַּם എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽബലം ‘കൂടി’യിലൂടെ സൂക്ഷിക്കുന്നു.
- source_word: וָחַי לְעֹלָם
  choice: എന്നേക്കും ജീവിച്ചുപോകാതിരിക്കാൻ
  rationale: פֶּן ആരംഭിക്കുന്ന പ്രതിരോധാത്മക ആശങ്കാക്ലോസിനോട് ചേർത്ത്, നിത്യമായി ജീവിക്കുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; വാക്യം മനപ്പൂർവം അപൂർണമായി വിടുന്നു.
theological_decisions:
- issue: ‘നമ്മിൽ ഒരാൾ’ എന്നതിലെ ബഹുവചനം
  choice: ‘നമ്മിൽ’ എന്ന ഒന്നാംപുരുഷ ബഹുവചനം വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തി.
  alternative: ദൈവികസഭ, ആലോചനാബഹുവചനം, അല്ലെങ്കിൽ ദൈവത്തിനുള്ളിലെ ബഹുത്വത്തിന്റെ സൂചന എന്നിങ്ങനെ ഏതെങ്കിലും ഒരു വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക.
  rationale: മൂലഹീബ്രു ബഹുവചനം വ്യക്തമായി ഉപയോഗിക്കുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം ഒരു വ്യാഖ്യാനത്തിലേക്ക് ഒതുക്കാതെ സംരക്ഷിക്കണം.
- issue: ദൈവവചനത്തിന്റെ പെട്ടെന്നുള്ള അപൂർണാവസാനം
  choice: അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം നൽകി വാക്യം അപൂർണമായി നിർത്തി.
  alternative: സൂചിതമായ മുഖ്യവാക്യം ചേർത്ത് ആശയം പൂർണമാക്കുക.
  rationale: ഹീബ്രുവിലെ פֶּן ക്ലോസ് തുടർഫലം വാക്കുകളായി പറയാതെ പെട്ടെന്ന് അവസാനിക്കുന്നു; ഇല്ലാത്ത വാക്കുകൾ ചേർക്കാതെ ആ തടസ്സപ്പെട്ട സ്വരം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി സ്വീകരിച്ചു. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും, ദൈവനാമം, ബഹുവചനത്തിന്റെ അനിശ്ചിതത്വം, അപൂർണമായി അവസാനിക്കുന്ന ദൈവവചനം എന്നിവ മൂലപാഠത്തോട് ചേർന്ന് സംരക്ഷിച്ചു.
