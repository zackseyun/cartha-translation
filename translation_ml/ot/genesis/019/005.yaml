  text: וַ/יִּקְרְא֤וּ אֶל לוֹט֙ וַ/יֹּ֣אמְרוּ ל֔/וֹ אַיֵּ֧ה הָ/אֲנָשִׁ֛ים אֲשֶׁר בָּ֥אוּ אֵלֶ֖י/ךָ הַ/לָּ֑יְלָה הוֹצִיאֵ֣/ם אֵלֵ֔י/נוּ וְ/נֵדְעָ֖ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/005.yaml
  text: And they called to Lot and said to him[a], “Where are the men who came to you tonight? Bring them out to us so that we may know them.”
translation:
  language: ml
  text: 'അവർ ലോത്തിനെ വിളിച്ച് അവനോടു പറഞ്ഞു: “ഇന്നു രാത്രി നിന്റെ അടുക്കൽ വന്ന പുരുഷന്മാർ എവിടെ? അവരെ പുറത്തേക്കു ഞങ്ങളുടെ അടുക്കലേക്കു കൊണ്ടുവരിക; ഞങ്ങൾ അവരെ അറിയട്ടെ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, ഈ സന്ദർഭത്തിൽ കൂടുതൽ വ്യക്തമായി: “ഞങ്ങൾ അവരുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടട്ടെ.” ഹീബ്രുവിൽ “ഞങ്ങൾ അവരെ അറിയട്ടെ” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל־לוֹט
  choice: അവർ ലോത്തിനെ വിളിച്ച്
  rationale: קרא ഇവിടെ ഒരാളെ അഭിസംബോധന ചെയ്ത് വിളിക്കുക എന്ന സാധാരണ അർഥത്തിലാണ്; മൂലത്തിൽ വ്യക്തമല്ലാത്ത അധിക തീവ്രത ചേർക്കുന്ന ‘ആർത്തുവിളിച്ചു’ പോലുള്ള പദം ഒഴിവാക്കി.
- source_word: הָאֲנָשִׁים
  choice: പുരുഷന്മാർ
  rationale: אֲנָשִׁים ഇവിടെ ലോത്തിന്റെ അടുക്കൽ വന്ന പുരുഷസന്ദർശകരെയാണ് വ്യക്തമായി സൂചിപ്പിക്കുന്നത്; അതിനാൽ ലിംഗനിഷ്പക്ഷമായ ‘ആളുകൾ’ എന്നതിനെക്കാൾ ‘പുരുഷന്മാർ’ കൃത്യമാണ്.
- source_word: בָּאוּ אֵלֶיךָ הַלָּיְלָה
  choice: ഇന്നു രാത്രി നിന്റെ അടുക്കൽ വന്ന
  rationale: הַלָּיְלָה ഈ സന്ദർഭത്തിൽ അതേ രാത്രിയെ സൂചിപ്പിക്കുന്നു; ‘ഇന്നു രാത്രി’ സ്വാഭാവികമായ ആധുനിക മലയാളമാണ്.
- source_word: הוֹצִיאֵם אֵלֵינוּ
  choice: അവരെ ഞങ്ങളുടെ അടുക്കൽ പുറത്തേക്കു കൊണ്ടുവരിക
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘പുറത്തേക്കു വരുത്തുക/കൊണ്ടുവരുക’ എന്നാണ്; ദിശ സൂചിപ്പിക്കുന്ന אֵלֵינוּ ‘ഞങ്ങളുടെ അടുക്കൽ’ എന്നു നിലനിർത്തി.
- source_word: וְנֵדְעָה אֹתָם
  choice: ഞങ്ങൾ അവരെ അറിയട്ടെ
  rationale: ידע എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘അറിയുക’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. സന്ദർഭം ലൈംഗിക ഉദ്ദേശ്യം ശക്തമായി സൂചിപ്പിക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു; ഇതിലൂടെ ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപവും അതിലെ അർഥസമ്മർദവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: וְנֵדְעָה אֹתָם എന്ന പ്രയോഗത്തിലെ ലൈംഗിക ഉദ്ദേശ്യം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കണമോ
  choice: ‘ഞങ്ങൾ അവരെ അറിയട്ടെ’ എന്ന അക്ഷരാർഥപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, സന്ദർഭോചിതമായ ലൈംഗിക അർഥം അടിക്കുറിപ്പിൽ നൽകുക.
  alternative: ‘ഞങ്ങൾ അവരുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടട്ടെ’ എന്നോ ‘ഞങ്ങൾ അവരെ ലൈംഗികമായി പീഡിപ്പിക്കട്ടെ’ എന്നോ മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക.
  rationale: ידע സാധാരണയായി ‘അറിയുക’ എന്നാണ്; ഇവിടെ സന്ദർഭം ശത്രുതാപരമായ ലൈംഗിക ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നുവെങ്കിലും, അതിനെ മുഖ്യപാഠത്തിൽ പൂർണമായി വിശദീകരിക്കുന്നത് മൂലത്തിലെ പ്രയോഗത്തെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കും. അക്ഷരാർഥം നിലനിർത്തുകയും സാധ്യതയേറിയ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നത് യഥാർത്ഥത്തിലെ അർഥസമ്മർദം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘നിന്റെ അടുക്കൽ,’ ‘ഞങ്ങളുടെ അടുക്കൽ’ എന്നീ പ്രയോഗങ്ങൾ ദിശാസൂചന കൃത്യമായി നിലനിർത്തുമ്പോഴും അതിപുരാതനമായ ഭാഷ ഒഴിവാക്കുന്നു.
