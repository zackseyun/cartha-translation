  text: וַ/יַּעַל֩ ל֨וֹט מִ/צּ֜וֹעַר וַ/יֵּ֣שֶׁב בָּ/הָ֗ר וּ/שְׁתֵּ֤י בְנֹתָי/ו֙ עִמּ֔/וֹ כִּ֥י יָרֵ֖א לָ/שֶׁ֣בֶת בְּ/צ֑וֹעַר וַ/יֵּ֨שֶׁב֙ בַּ/מְּעָרָ֔ה ה֖וּא וּ/שְׁתֵּ֥י בְנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/030.yaml
  text: Then Lot went up from Zoar and lived in the mountains[a], and his two daughters were with him, because he was afraid to live in Zoar. So he lived in a cave, he and his two daughters.
translation:
  language: ml
  text: ലോത്ത് സോവാറിൽനിന്ന് കയറി മലമ്പ്രദേശത്ത് താമസിച്ചു. അവന്റെ രണ്ടു പുത്രിമാരും അവനോടൊപ്പം ഉണ്ടായിരുന്നു; കാരണം, സോവാറിൽ താമസിക്കാൻ അവൻ ഭയപ്പെട്ടിരുന്നു. അങ്ങനെ അവനും അവന്റെ രണ്ടു പുത്രിമാരും ഒരു ഗുഹയിൽ[a] താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രുവിൽ: ‘ആ ഗുഹയിൽ.’ ഇവിടെ നിശ്ചിതത്വസൂചകം ലോത്ത് താമസിച്ച പ്രത്യേക ഗുഹയെ സൂചിപ്പിക്കാം; എന്നാൽ ഗുഹയെ ആദ്യമായി പരാമർശിക്കുമ്പോൾ മലയാളത്തിൽ ‘ഒരു ഗുഹയിൽ’ എന്നത് കൂടുതൽ സ്വാഭാവികമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: കയറിച്ചെന്ന്
  rationale: עלה എന്ന ക്രിയയുടെ മുകളിലേക്കുള്ള ചലനവും ഭൂപ്രകൃതിസംബന്ധമായ ദിശയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִצּוֹעַר
  choice: സോവാറിൽനിന്ന്
  rationale: מן എന്ന ഉപസർഗം സൂചിപ്പിക്കുന്ന സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ ישב ഇരിക്കുകയെന്നതിലുപരി ഒരു സ്ഥലത്ത് പാർക്കുകയോ വസിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘താമസിച്ചു’ ആ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בָּהָר
  choice: മലമ്പ്രദേശത്തേക്കു … അവിടെ
  rationale: ഹീബ്രു ഏകവചനമായ הַר ഇവിടെ ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കാൻ കഴിയും. ‘മലമ്പ്രദേശം’ അനാവശ്യമായ കൃത്യവൽക്കരണമില്ലാതെ ആ ഭൂപ്രകൃതിസംബന്ധമായ അർഥം നൽകുന്നു; ചലനത്തിന്റെ ലക്ഷ്യം ‘-ത്തേക്ക്’ എന്നും തുടർന്നുള്ള വാസസ്ഥലം ‘അവിടെ’ എന്നും വ്യക്തമാക്കുന്നു.
- source_word: וּשְׁתֵּי בְנֹתָיו עִמּוֹ
  choice: അവന്റെ രണ്ടു പുത്രിമാരും അവനോടൊപ്പം ഉണ്ടായിരുന്നു
  rationale: ക്രിയയില്ലാത്ത ഹീബ്രു പ്രയോഗത്തെ സ്വാഭാവികമായ പൂർണ മലയാളവാക്യമായി അവതരിപ്പിക്കുമ്പോഴും കൂടെയുണ്ടായിരുന്നതെന്ന ബന്ധം കൃത്യമായി സംരക്ഷിക്കുന്നു.
- source_word: כִּי יָרֵא לָשֶׁבֶת בְּצֹעַר
  choice: കാരണം, സോവാറിൽ താമസിക്കാൻ അവൻ ഭയപ്പെട്ടിരുന്നു
  rationale: כִּי ഇവിടെ കാരണത്തെ പരിചയപ്പെടുത്തുന്നു; יָרֵא എന്ന നിലാവസ്ഥയും לָשֶׁבֶת എന്ന വാസസംബന്ധമായ അർഥവും വ്യക്തമായി നൽകുന്നു.
- source_word: בַּמְּעָרָה
  choice: ഒരു ഗുഹയിൽ
  rationale: നാമത്തിന് നിർദേശകപ്രത്യയം ഉണ്ടെങ്കിലും ഗുഹയെ ആദ്യമായി പരാമർശിക്കുന്ന മലയാള സന്ദർഭത്തിൽ ‘ഒരു ഗുഹയിൽ’ സ്വാഭാവികമാണ്. രൂപപരമായ ‘ആ ഗുഹയിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: הוּא וּשְׁתֵּי בְנֹתָיו
  choice: അവനും അവന്റെ രണ്ടു പുത്രിമാരും
  rationale: ഗുഹയിൽ താമസിച്ചവരെ ആവർത്തിച്ച് ഊന്നിപ്പറയുന്ന ഹീബ്രു ഘടന നിലനിർത്തുന്നു.
