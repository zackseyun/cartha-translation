translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘പാർത്തു’ എന്ന സാഹിത്യപരമായ രൂപത്തിനുപകരം സാധാരണ വായനക്കാർക്ക് നേരിട്ട് മനസ്സിലാകുന്ന ‘താമസിച്ചു’ തിരഞ്ഞെടുത്തു. ഹീബ്രുവിലെ ആവർത്തനവും കാരണബന്ധവും നിലനിർത്തി.
