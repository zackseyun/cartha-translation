  text: So both of Lot’s daughters became pregnant by their father[a][b].
translation:
  language: ml
  text: അങ്ങനെ ലോത്തിന്റെ രണ്ടു പുത്രിമാരും തങ്ങളുടെ പിതാവിൽനിന്ന് ഗർഭം ധരിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “തങ്ങളുടെ പിതാവിനാൽ ഗർഭിണികളായി.” അക്ഷരാർഥം: “തങ്ങളുടെ പിതാവിൽനിന്ന്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהֲרֶיןָ
  choice: ഗർഭം ധരിച്ചു
  rationale: הרה എന്ന ക്രിയയുടെ ഇവിടെ വരുന്ന രൂപം അവർ ഗർഭിണികളായി എന്നത് സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗമാണ് ‘ഗർഭം ധരിച്ചു’.
- source_word: שְׁתֵּי
  choice: രണ്ടു ... ഉം
  rationale: ലോത്തിന്റെ രണ്ടു പുത്രിമാരും ഉൾപ്പെടുന്നു എന്ന സമഗ്രാർഥം മലയാളത്തിലെ ‘രണ്ടു പുത്രിമാരും’ എന്ന ഘടന സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְנוֹת לוֹט
  choice: ലോത്തിന്റെ ... പുത്രിമാർ
  rationale: എബ്രായ സംയുക്തബന്ധത്തെ മലയാളത്തിലെ ഉടമസ്ഥബന്ധരൂപത്തിൽ കൃത്യവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: מֵאֲבִיהֶן
  choice: തങ്ങളുടെ പിതാവിൽനിന്ന്
  rationale: מִן സൂചിപ്പിക്കുന്ന ഉറവിടം/പിതൃത്വം നേരിട്ട് നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഗർഭധാരണത്തിന്റെ പിതാവ് ആരെന്ന അർഥം വ്യക്തമാണ്; മൂലത്തിലെ ‘നിന്ന്’ എന്ന ബന്ധവും സംരക്ഷിക്കുന്നു.
