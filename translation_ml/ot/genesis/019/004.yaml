source:
  edition: WLC
  text: טֶרֶם֮ יִשְׁכָּבוּ֒ וְ/אַנְשֵׁ֨י הָ/עִ֜יר אַנְשֵׁ֤י סְדֹם֙ נָסַ֣בּוּ עַל הַ/בַּ֔יִת מִ/נַּ֖עַר וְ/עַד זָקֵ֑ן כָּל הָ/עָ֖ם מִ/קָּצֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/004.yaml
  text: Before they lay down[a], the men of the city, the men of Sodom, surrounded the house—from young to old[c][b], all the people from every quarter.
translation:
  language: ml
  text: അവർ കിടക്കുന്നതിനുമുമ്പ്, സൊദോം നഗരത്തിലെ പുരുഷന്മാർ—ചെറുപ്പക്കാർ മുതൽ വൃദ്ധന്മാർ വരെ[b], നഗരത്തിന്റെ നാനാഭാഗങ്ങളിൽനിന്നുമുള്ള സകലജനവും[c]—ആ വീട് വളഞ്ഞു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആ വീടിനു ചുറ്റും കൂടിനിന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് ചുറ്റിവളയുക, ചുറ്റും കൂടുക എന്നീ അർഥങ്ങളുണ്ട്; സന്ദർഭം അടച്ചുവളഞ്ഞ ജനക്കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘ചെറുപ്പക്കാരൻ മുതൽ വൃദ്ധൻ വരെ’; എല്ലാ പ്രായക്കാരെയും ഉൾക്കൊള്ളുന്ന പ്രയോഗം.'
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: ‘അറ്റത്തുനിന്ന്’; ഇവിടെ നഗരത്തിന്റെ എല്ലാ ഭാഗങ്ങളിൽനിന്നും എന്ന അർഥം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם יִשְׁכָּבוּ
  choice: അവർ കിടക്കുന്നതിനുമുമ്പുതന്നെ
  rationale: രാത്രിയിൽ കിടക്കുന്നതിനു മുമ്പുണ്ടായ സംഭവമെന്ന കാലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ഉറങ്ങുന്നതിനുമുമ്പ്’ എന്നു പറഞ്ഞ് ക്രിയയുടെ അർഥം ചുരുക്കുന്നില്ല.
- source_word: אַנְשֵׁי הָעִיר אַנְשֵׁי סְדֹם
  choice: സൊദോം നഗരത്തിലെ പുരുഷന്മാർ
  rationale: ആവർത്തനാത്മകമായ എബ്രായ സമാനാധികരണത്തെ സ്വാഭാവിക മലയാളത്തിൽ ഏകീകരിച്ചെങ്കിലും, പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന ലിംഗനിർദേശം നിലനിർത്തുന്നു.
- source_word: נָסַבּוּ עַל הַבַּיִת
  choice: ആ വീടു വളഞ്ഞു
  rationale: വീടിനെ ചുറ്റി അടച്ചുനിന്ന ജനക്കൂട്ടത്തിന്റെ അർഥം സംക്ഷിപ്തവും സന്ദർഭോചിതവുമായി നൽകുന്നു.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: ചെറുപ്പക്കാർമുതൽ വൃദ്ധന്മാർവരെ
  rationale: പ്രായപരിധിയുടെ സമഗ്രത സൂചിപ്പിക്കുന്ന എബ്രായ ദ്വന്ദപ്രയോഗം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּל הָעָם
  choice: സകലജനവും
  rationale: പുരുഷന്മാരെ ആദ്യം പ്രത്യേകം പരാമർശിച്ചതിനുശേഷം വരുന്ന വിശാലമായ സമൂഹവാചകത്തെ അതിന്റെ കൂട്ടായ അർഥത്തിൽ പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: מִקָּצֶה
  choice: നഗരത്തിന്റെ നാനാഭാഗത്തുനിന്നുമുള്ള
  rationale: അക്ഷരാർഥത്തിൽ ‘അറ്റത്തുനിന്ന്’ എന്നായാലും, ഇവിടെ നഗരത്തിന്റെ എല്ലാഭാഗങ്ങളിൽനിന്നുമുള്ളവരെ സൂചിപ്പിക്കുന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ജനക്കൂട്ടത്തെ വിവരിക്കുന്ന ലിംഗസൂചന
  choice: ആദ്യ പരാമർശത്തിൽ ‘പുരുഷന്മാർ’ എന്നും തുടർന്ന് כָּל הָעָם എന്നതിന് ‘സകലജനവും’ എന്നും നൽകി.
  alternative: എല്ലായിടത്തും ലിംഗനിരപേക്ഷമായി ‘ജനങ്ങൾ’ എന്നു നൽകുക.
  rationale: മൂലപാഠം ആദ്യം പുരുഷലിംഗവാചകമായ אַנְשֵׁי ഉപയോഗിക്കുകയും പിന്നീട് വിശാലമായ കൂട്ടായ പദമായ עָם ഉപയോഗിക്കുകയും ചെയ്യുന്നു; ഈ വ്യത്യാസം സമതലപ്പെടുത്താതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ സമഗ്രതാസൂചനകളും പുരുഷന്മാർ/ജനസമൂഹം എന്ന പദവ്യത്യാസവും നിലനിർത്തിയപ്പോൾ, അസ്വാഭാവികമായ ആവർത്തനം ഒഴിവാക്കി.
