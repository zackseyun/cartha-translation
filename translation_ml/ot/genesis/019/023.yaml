id: GEN.19.23
reference: Genesis 19:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הַ/שֶּׁ֖מֶשׁ יָצָ֣א עַל הָ/אָ֑רֶץ וְ/ל֖וֹט בָּ֥א צֹֽעֲרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/023.yaml
  text: The sun had risen over the land[b][a], and Lot had come to Zoar.
translation:
  language: ml
  text: സൂര്യൻ ദേശത്തിനുമീതെ ഉദിച്ചിരുന്നു[a], ലോത്ത് സോവാറിൽ എത്തിയിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭൂമിക്കുമീതെ’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സൂര്യൻ ദേശത്തിനുമീതെ ഉദിച്ചു; ലോത്ത് സോവാറിൽ എത്തി.’ ഹീബ്രുവിലെ സമാപ്തക്രിയകൾ ലളിതമായ ഭൂതകാലമായും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  choice: സൂര്യൻ
  rationale: നിശ്ചിത ഉപപദത്തോടുകൂടിയ നാമം; മലയാളത്തിലെ സ്വാഭാവികമായ പ്രയോഗം ‘സൂര്യൻ’ ആണ്.
- source_word: יָצָא
  choice: ഉദിച്ചുകഴിഞ്ഞപ്പോൾ
  rationale: יצא എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘പുറപ്പെട്ടു/പുറത്തുവന്നു’ എന്നാണെങ്കിലും, സൂര്യനെ കർത്താവാക്കി ഉപയോഗിക്കുമ്പോൾ ഇവിടെ സൂര്യോദയത്തെയാണ് സൂചിപ്പിക്കുന്നത്. പിന്നാലെയുള്ള സംഭവവുമായി സമയബന്ധം സ്വാഭാവികമായി കാണിക്കാൻ ‘ഉദിച്ചുകഴിഞ്ഞപ്പോൾ’ എന്നു നൽകി.
- source_word: עַל הָאָרֶץ
  choice: ദേശത്തിനുമീതെ
  rationale: עַל എന്നത് ‘മേൽ/മീതെ’ എന്നും אֶרֶץ എന്നത് ‘ദേശം/ഭൂമി’ എന്നും അർഥമാക്കാം. ഈ പ്രാദേശിക ആഖ്യാനസന്ദർഭത്തിൽ ‘ദേശം’ കൂടുതൽ യോജിക്കുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְלוֹט
  choice: ലോത്ത്
  rationale: സംയോജകമായ וְ വാക്യത്തിലെ സമയബന്ധമുള്ള ഉപവാക്യഘടനയിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു; പേരിന്റെ പതിവ് മലയാളരൂപം ‘ലോത്ത്’.
- source_word: בָּא
  choice: എത്തിയിരുന്നു
  rationale: בוא എന്ന ക്രിയ ഇവിടെ ലക്ഷ്യസ്ഥാനത്ത് എത്തിച്ചേരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഹീബ്രു സമാപ്തക്രിയയുടെ പൂർത്തിയായ ഭാവവും തുടർന്നുവരുന്ന സംഭവത്തിനു മുമ്പുള്ള നിലയും മലയാളത്തിൽ ‘എത്തിയിരുന്നു’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: צֹעֲרָה
  choice: സോവാറിൽ
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചക ה ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം കാണിക്കുന്നു. ‘എത്തി’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ ലക്ഷ്യസ്ഥാനം ‘സോവാറിൽ’ എന്നു പറയുന്നതാണ് സ്വാഭാവികം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ രണ്ടു സമാപ്തക്രിയകളുടെ സമയബന്ധം മുഖ്യവാചകത്തിൽ സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകിയെങ്കിലും, ലളിതഭൂതകാലസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
