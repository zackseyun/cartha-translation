  yaml_path: translation/ot/genesis/019/010.yaml
  text: But the men reached out their hands and brought Lot into the house with them[c][b][a], and shut the door.
translation:
  language: ml
  text: എന്നാൽ ആ പുരുഷന്മാർ[b] കൈകൾ നീട്ടി[a] ലോത്തിനെ തങ്ങളോടൊപ്പം വീട്ടിനകത്തേക്കു കൊണ്ടുവന്ന് വാതിൽ അടച്ചു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘കൈകൾ നീട്ടുകയും ചെയ്തു.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠത്തിൽ ‘പുരുഷന്മാർ’; വിശാലമായ സന്ദർഭം അവർ ദൈവദൂതന്മാരാണെന്ന് വ്യക്തമാക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: അല്ലെങ്കിൽ, ‘അവർ വാതിൽ അടച്ചു.’
    reason: previous_rendering
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാർ
  rationale: എബ്രായപദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘പുരുഷന്മാർ’ എന്നാണ്. വിശാലമായ സന്ദർഭം അവർ ദൂതന്മാരാണെന്ന് വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും, ഈ വാക്യത്തിലെ പദപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁלְחוּ אֶת יָדָם
  choice: കൈകൾ നീട്ടി
  rationale: ‘കൈ അയയ്ക്കുക/നീട്ടുക’ എന്ന എബ്രായ ശൈലി കൈ ശാരീരികമായി നീട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആ പ്രവർത്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇങ്ങനെ പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיָּבִיאוּ
  choice: കൊണ്ടുവന്ന്
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘വരുത്തുക/കൊണ്ടുവരുക’ എന്നാണ്. തുടർന്നുള്ള പ്രവൃത്തിയുമായി ചേർന്ന വാക്യഘടന ദ്രുതമായ ആഖ്യാനക്രമം നിലനിർത്തുന്നു.
- source_word: אֲלֵיהֶם הַבָּיְתָה
  choice: തങ്ങളോടൊപ്പം വീട്ടിനകത്തേക്കു
  rationale: ഈ പ്രയോഗം അവരുടെ അടുക്കലേക്കും വീടിനകത്തേക്കുമുള്ള നീക്കം ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘തങ്ങളോടൊപ്പം വീട്ടിനകത്തേക്ക്’ എന്നത് ഇരു ആശയങ്ങളും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַבָּיְתָה
  choice: വീട്ടിനകത്തേക്കു
  rationale: നാമത്തോടു ചേർന്നിരിക്കുന്ന ദിശാസൂചകപ്രത്യയം വീടിനകത്തേക്കുള്ള നീക്കത്തെ അടയാളപ്പെടുത്തുന്നു.
- source_word: הַדֶּלֶת
  choice: വാതിൽ
  rationale: דֶּלֶת എന്ന സാധാരണ പദത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളപരിഭാഷ.
- source_word: סָגָרוּ
  choice: അടച്ചു
  rationale: സന്ദർഭത്തിലെ അടിയന്തര പ്രവർത്തനത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളക്രിയ.
- source_word: וַ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ജനക്കൂട്ടത്തിന്റെ പ്രവർത്തനത്തോടുള്ള നേരിയ വൈരുധ്യം സൂചിപ്പിച്ചുകൊണ്ട് ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു.
theological_decisions:
- issue: הָאֲנָשִׁים എന്ന പദത്തെ മുഖ്യപാഠത്തിൽ ദൂതന്മാർ എന്ന് വ്യക്തമാക്കണമോ എന്നത്
  choice: മുഖ്യപാഠത്തിൽ ‘ആ പുരുഷന്മാർ’ എന്നു നിലനിർത്തുന്നു
  alternative: ‘ദൂതന്മാർ’ അല്ലെങ്കിൽ ‘സന്ദർശകർ’
  rationale: ആഖ്യാനസന്ദർഭം ഇവർ ദൈവദൂതന്മാരാണെന്ന് വ്യക്തമാക്കുന്നുവെങ്കിലും, ഈ വാക്യം അവരെ സാധാരണ പദമായ ‘പുരുഷന്മാർ’ എന്നാണ് വിളിക്കുന്നത്. അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ മൂലപദം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. തുടർച്ചയായ ക്രിയകൾ ഒരേ കർത്താവിനോടു ചേർത്ത് മൂലപാഠത്തിലെ ദ്രുതഗതി നിലനിർത്തിയിരിക്കുന്നു.
