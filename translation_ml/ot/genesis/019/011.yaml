id: GEN.19.11
reference: Genesis 19:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְֽ/אֶת הָ/אֲנָשִׁ֞ים אֲשֶׁר פֶּ֣תַח הַ/בַּ֗יִת הִכּוּ֙ בַּ/סַּנְוֵרִ֔ים מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּלְא֖וּ לִ/מְצֹ֥א הַ/פָּֽתַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/011.yaml
  text: And they struck the men who were at the entrance of the house with blindness[a], from the least to the greatest, so that they wore themselves out trying to find the doorway.
translation:
  language: ml
  text: വീടിന്റെ പ്രവേശനത്തിങ്കൽ ഉണ്ടായിരുന്ന പുരുഷന്മാരെ അവർ ചെറിയവർ മുതൽ വലിയവർ വരെ അന്ധതയാൽ[a] ബാധിച്ചു. വാതിൽ കണ്ടെത്താൻ ശ്രമിച്ച് അവർ തളർന്നുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കണ്ണഞ്ചിപ്പിക്കുന്ന മയക്കത്താൽ” അല്ലെങ്കിൽ “കാഴ്ചക്കുഴപ്പത്താൽ”; അപൂർവമായ ഈ ഹീബ്രു പദം സാധാരണ അന്ധതയിലധികം എന്തെങ്കിലും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּ
  choice: ബാധിച്ചു
  rationale: നכה എന്ന ക്രിയയുടെ ഹിഫ്ഇൽ രൂപത്തിന് ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്ന അടിസ്ഥാനാർഥമുണ്ടെങ്കിലും, രോഗമോ ദൈവികമായ കാഴ്ചത്തകരാറോ വരുത്തുന്ന സന്ദർഭത്തിൽ ‘ബാധിച്ചു’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: הָאֲנָשִׁים
  choice: പുരുഷന്മാരെ
  rationale: ഇവിടെ אֲנָשִׁים ലോത്തിന്റെ വീടിന് പുറത്തുണ്ടായിരുന്ന പുരുഷക്കൂട്ടത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ലിംഗസൂചന കൃത്യമായി നിലനിർത്തി.
- source_word: אֲשֶׁר פֶּתַח הַבַּיִת
  choice: വീടിന്റെ പ്രവേശനത്തിങ്കൽ ഉണ്ടായിരുന്ന
  rationale: פֶּתַח എന്നത് വാതിൽ, വാതിൽപ്പടി, പ്രവേശനം എന്നിവ സൂചിപ്പിക്കാം. ആദ്യപ്രയോഗത്തിൽ സ്ഥലത്തെ വിശാലമായി തിരിച്ചറിയിക്കുന്ന ‘പ്രവേശനത്തിങ്കൽ’ സ്വാഭാവികമാണ്.
- source_word: בַּסַּנְוֵרִים
  choice: അന്ധതയാൽ
  rationale: അപൂർവമായ סַנְוֵרִים കാഴ്ച പ്രവർത്തനരഹിതമാക്കുന്ന ദൈവിക ബാധയെ സൂചിപ്പിക്കുന്നു. പ്രധാനവാചകത്തിൽ വ്യക്തമായ ‘അന്ധത’ ഉപയോഗിച്ച്, മിന്നൽമറയോ കാഴ്ചക്കുഴപ്പമോ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: ചെറിയവൻമുതൽ വലിയവൻവരെ
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപവും കൂട്ടത്തിലെ എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന വ്യാപ്തിയും നിലനിർത്തുന്നു; ഇത് പ്രായത്തെ മാത്രം സൂചിപ്പിക്കുന്നതായി ചുരുക്കുന്നില്ല.
- source_word: וַיִּלְאוּ
  choice: തളർന്നുപോയി
  rationale: לָאָה പരിശ്രമംകൊണ്ടുള്ള ക്ഷീണത്തെയും ശേഷിയറ്റ അവസ്ഥയെയും സൂചിപ്പിക്കുന്നു. ‘തളർന്നുപോയി’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: לִמְצֹא
  choice: കണ്ടെത്താൻ ശ്രമിച്ച്
  rationale: അനന്തക്രിയ അവരുടെ ഫലമില്ലാത്ത അധ്വാനത്തിന്റെ ലക്ഷ്യം വ്യക്തമാക്കുന്നു; ‘ശ്രമിച്ച്’ എന്നത് സന്ദർഭത്തിൽ ഉൾപ്പെട്ട ശ്രമഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַפָּתַח
  choice: വാതിൽ
  rationale: രണ്ടാം പ്രയോഗത്തിൽ അവർ കണ്ടെത്താൻ കഴിയാതിരുന്ന നിർദിഷ്ട പ്രവേശനസ്ഥാനം സൂചിപ്പിക്കാൻ ‘വാതിൽ’ ലളിതവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: סַנְוֵרִים എന്ന ബാധയുടെ സ്വഭാവം
  choice: ദൈവികമായി വരുത്തപ്പെട്ട അന്ധത
  alternative: കണ്ണഞ്ചിപ്പിക്കുന്ന മയക്കം അല്ലെങ്കിൽ കാഴ്ചക്കുഴപ്പം
  rationale: വീടിന്റെ പ്രവേശനം കണ്ടെത്താൻ കഴിയാത്തവിധം കാഴ്ച തടസ്സപ്പെട്ടുവെന്ന് കഥ വ്യക്തമാക്കുന്നു. എന്നാൽ അപൂർവ ഹീബ്രുപദത്തിന്റെ കൃത്യസ്വഭാവം അനിശ്ചിതമായതിനാൽ പ്രധാനവാചകത്തിൽ ‘അന്ധത’ എന്നും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിലും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രുവിലെ ഉൾക്കൊള്ളുന്ന വിരുദ്ധജോടിയായ ‘ചെറിയവൻമുതൽ വലിയവൻവരെ’ നിലനിർത്തി; അപൂർവ പദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
