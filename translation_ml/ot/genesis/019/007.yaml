source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר אַל נָ֥א אַחַ֖/י תָּרֵֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/007.yaml
  text: And he said, “Please, my brothers, do not do evil.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ദയവായി, എന്റെ സഹോദരന്മാരേ, ദോഷം ചെയ്യരുത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַי
  choice: എന്റെ സഹോദരന്മാരേ
  rationale: ലോത്ത് നഗരത്തിലെ പുരുഷന്മാരെ അഭിസംബോധന ചെയ്യുന്ന സൗഹൃദപരവും അനുനയപൂർവവുമായ വിളി; ഹീബ്രായത്തിലെ ഒന്നാംപുരുഷ ഉടമസ്ഥതയും ബഹുവചന അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: תָּרֵעוּ
  choice: ഈ ദോഷം ചെയ്യരുത്
  rationale: רעע എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ‘ദോഷം ചെയ്യുക/തിന്മയായി പ്രവർത്തിക്കുക’ എന്ന അർഥം നൽകുന്നു. സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്ന പ്രവൃത്തിയിലേക്കു സ്വാഭാവികമായി വിരൽചൂണ്ടാൻ ‘ഈ’ ചേർത്തു; ദോഷത്തിന്റെ സ്വഭാവം കൂടുതൽ വിശദീകരിക്കാതെ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: אַל־נָא
  choice: ദയവായി … ചെയ്യരുത്
  rationale: אַל എന്ന വിലക്കും נָא നൽകുന്ന വിനയപൂർവമായ അഭ്യർഥനാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
theological_decisions:
- issue: ആസൂത്രിത പ്രവൃത്തിയുടെ ധാർമ്മിക വിശേഷണം
  choice: ഈ ദോഷം ചെയ്യരുത്
  alternative: ദുഷ്ടമായി പ്രവർത്തിക്കരുത്
  rationale: മൂലപാഠം പ്രവൃത്തിയെ ദോഷമായി വിശേഷിപ്പിക്കുന്നു; അതിന്റെ കൃത്യസ്വഭാവം ഈ വാക്യത്തിൽ വ്യാഖ്യാനിച്ച് ചേർക്കാതെ ധാർമ്മിക ഗൗരവം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവും അനുനയപൂർവവുമായ നേരിട്ടുള്ള സംഭാഷണം. ‘സഹോദരന്മാരേ’ എന്ന അഭിസംബോധന ജൈവബന്ധം നിർബന്ധമായി സൂചിപ്പിക്കാതെ സാമൂഹിക സൗഹൃദവിളിയായി വായിക്കാവുന്നതാണ്.
