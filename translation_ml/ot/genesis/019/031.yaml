  text: וַ/תֹּ֧אמֶר הַ/בְּכִירָ֛ה אֶל הַ/צְּעִירָ֖ה אָבִ֣י/נוּ זָקֵ֑ן וְ/אִ֨ישׁ אֵ֤ין בָּ/אָ֨רֶץ֙ לָ/ב֣וֹא עָלֵ֔י/נוּ כְּ/דֶ֖רֶךְ כָּל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/031.yaml
  text: And the firstborn said to the younger[a], “Our father is old[b], and there is not a man in the land to come in to us according to the way of all the earth.”
translation:
  language: ml
  text: 'മൂത്തവൾ ഇളയവളോടു പറഞ്ഞു: “നമ്മുടെ അപ്പൻ വൃദ്ധനാണ്; ലോകമെങ്ങുമുള്ള പതിവനുസരിച്ച് ഞങ്ങളോടുകൂടെ കിടക്കാൻ ഈ ദേശത്ത് ഒരു പുരുഷനും ഇല്ല.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഞങ്ങളോടുകൂടെ കിടക്കാൻ” എന്നത് ഇവിടെ ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന സൗമ്യപ്രയോഗമാണ്. “ലോകമെങ്ങുമുള്ള പതിവ്” എന്നത് സാധാരണ മനുഷ്യരീതിയെ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ അതിന് ലൈംഗികബന്ധവും കുടുംബതുടർച്ചയും സംബന്ധിച്ച അർഥമുണ്ട്.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: הַבְּכִירָה
  choice: മൂത്തവൾ
  rationale: ജനനക്രമത്തിൽ ആദ്യത്തവളെ സൂചിപ്പിക്കുന്ന പദം. മലയാളത്തിൽ സഹോദരിമാരുടെ താരതമ്യത്തിൽ ‘മൂത്തവൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הַצְּעִירָה
  choice: ഇളയവൾ
  rationale: ‘ചെറിയവൾ/ഇളയവൾ’ എന്ന താരതമ്യാർഥം; ‘മൂത്തവൾ’ എന്നതിനോടുള്ള ജോടിയായ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: אָבִינוּ זָקֵן
  choice: നമ്മുടെ അപ്പൻ വൃദ്ധനായിരിക്കുന്നു
  rationale: ക്രിയയില്ലാത്ത എബ്രായ വാക്യത്തിന്റെ ഇപ്പോഴത്തെ അവസ്ഥ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; കഥാസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളം.
- source_word: וְאִישׁ אֵין בָּאָרֶץ
  choice: ഈ ദേശത്ത് ഒരു പുരുഷനും ഇല്ല
  rationale: אִישׁ എന്നതിന്റെ പുരുഷലിംഗസൂചനയും בָאָרֶץ എന്ന സ്ഥലസൂചനയും നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ‘ഈ ദേശത്ത്’ മലയാളത്തിൽ കൂടുതൽ വ്യക്തമാണ്.
- source_word: לָבוֹא עָלֵינוּ
  choice: ഞങ്ങളുമായി ബന്ധപ്പെടാൻ
  rationale: ഇവിടെ പ്രയോഗം ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന സൗമ്യോക്തിയാണ്. എബ്രായ രൂപം പദാനുപദമായി മലയാളത്തിലാക്കിയാൽ അസ്വാഭാവികവും തെറ്റിദ്ധരിപ്പിക്കാവുന്നതുമായതിനാൽ, മാന്യവും വ്യക്തവുമായ സൗമ്യപ്രയോഗം സ്വീകരിച്ചു.
- source_word: כְּדֶרֶךְ כָּל הָאָרֶץ
  choice: ലോകമെങ്ങുമുള്ള പതിവനുസരിച്ച്
  rationale: ‘സകല ഭൂമിയുടെയും വഴി’ എന്ന എബ്രായ പ്രയോഗം സാധാരണ മനുഷ്യരീതിയെയോ പതിവിനെയോ സൂചിപ്പിക്കുന്നു; അതിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘ലോകമെങ്ങുമുള്ള പതിവ്’ എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: സാധാരണ മനുഷ്യരീതിയെ സൂചിപ്പിക്കുന്ന തരത്തിൽ വിവർത്തനം ചെയ്തു; സന്ദർഭത്തിലെ ലൈംഗിക-കുടുംബതുടർച്ചാ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘സകല ഭൂമിയുടെയും വഴിപോലെ’ എന്ന് പദാനുപദമായി നൽകുക.
  rationale: പദാനുപദരൂപം മലയാളത്തിൽ അവ്യക്തമാണ്. എന്നാൽ വിവാഹം എന്ന ആശയം മൂലപാഠത്തിൽ നേരിട്ട് ഇല്ലാത്തതിനാൽ അത് പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ സൗമ്യോക്തി മലയാളത്തിൽ പദാനുപദമായി പകർത്താതെ അതിന്റെ മാന്യതയും സന്ദർഭാർഥവും നിലനിർത്തി. ‘അപ്പൻ’ കഥാസന്ദർഭത്തിൽ സ്വാഭാവികമായ കുടുംബസംബോധനമായി തെരഞ്ഞെടുത്തു.
