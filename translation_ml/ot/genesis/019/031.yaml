    rationale: It can refer to ordinary social contact and therefore fails to signal the contextual sexual sense of Hebrew לָבוֹא עָלֵינוּ, even as a euphemism.
  - severity: low
    issue: “വൃദ്ധനായിരിക്കുന്നു” slightly overstates an already-become/continuative nuance.
    rationale: The Hebrew verbless clause simply states that the father is old; “വൃദ്ധനാണ്” is closer and more idiomatic.
