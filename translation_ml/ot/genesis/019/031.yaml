  terminology: “മൂത്തവൾ,” “ഇളയവൾ,” “പുരുഷൻ,” and “ലോകമെങ്ങുമുള്ള പതിവ്” are appropriate. The revision retains the source’s euphemistic register without importing marriage or a doctrinal interpretation.
  issues:
