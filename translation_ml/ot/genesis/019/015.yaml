source:
  edition: WLC
  text: וּ/כְמוֹ֙ הַ/שַּׁ֣חַר עָלָ֔ה וַ/יָּאִ֥יצוּ הַ/מַּלְאָכִ֖ים בְּ/ל֣וֹט לֵ/אמֹ֑ר קוּם֩ קַ֨ח אֶֽת אִשְׁתְּ/ךָ֜ וְ/אֶת שְׁתֵּ֤י בְנֹתֶ֨י/ךָ֙ הַ/נִּמְצָאֹ֔ת פֶּן תִּסָּפֶ֖ה בַּ/עֲוֺ֥ן הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/015.yaml
  text: And as dawn was rising[a], the angels urged Lot, saying, “Get up, take your wife and your two daughters who are here, lest you be swept away in the punishment of the city.”
translation:
  language: ml
  text: 'പുലരി ഉദിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ദൂതന്മാർ ലോത്തിനെ തിടുക്കം കൂട്ടി പറഞ്ഞു: “എഴുന്നേൽക്കുക; നിന്റെ ഭാര്യയെയും ഇവിടെ ഉള്ള നിന്റെ രണ്ടു പുത്രിമാരെയും കൂട്ടിക്കൊണ്ടുപോകുക. അല്ലെങ്കിൽ നഗരത്തിന്റെ ശിക്ഷയിൽ നീയും നശിച്ചുപോകും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നഗരത്തിന്റെ അകൃത്യത്തിൽ” എന്നും “നഗരത്തിന്റെ കുറ്റം നിമിത്തം” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് അകൃത്യം, കുറ്റബാധ്യത, കുറ്റത്തിന്റെ ഫലമായ ശിക്ഷ എന്നീ അർത്ഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְמוֹ הַשַּׁחַר עָלָה
  choice: പുലരി ഉദിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: כְמוֹ എന്ന കാലസൂചനയും עָלָה എന്ന ‘ഉദിക്കുക/ഉയരുക’ എന്ന ദൃശ്യഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיָּאִיצוּ
  choice: തിടുക്കപ്പെടുത്തി
  rationale: ഉടൻ പ്രവർത്തിക്കാൻ ശക്തമായി പ്രേരിപ്പിക്കുന്ന ക്രിയയുടെ അടിയന്തരത ‘തിടുക്കപ്പെടുത്തി’ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: הַמַּלְאָכִים
  choice: ദൂതന്മാർ
  rationale: സന്ദർഭത്തിൽ സ്വർഗീയ ദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദൂതന്മാർ’ മലയാളത്തിലെ സ്വാഭാവികവും സ്ഥാപിതവുമായ പദമാണ്.
- source_word: קוּם קַח
  choice: എഴുന്നേൽക്കുക; ... കൂട്ടിക്കൊണ്ടുപോകുക
  rationale: രണ്ട് ആജ്ഞകളെയും വേർതിരിച്ചു നിലനിർത്തുന്നു; വ്യക്തികളെ ‘എടുക്കുക’ എന്നതിനെക്കാൾ ‘കൂട്ടിക്കൊണ്ടുപോകുക’ മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: הַנִּמְצָאֹת
  choice: ഇവിടെ ഉള്ള
  rationale: ‘കാണപ്പെടുന്നവർ/സന്നിഹിതരായവർ’ എന്ന പങ്കാളിക്രിയയുടെ സന്ദർഭാർത്ഥം ലളിതമായി നൽകുകയും ഇപ്പോൾ ലോത്തിനോടൊപ്പമുള്ള പുത്രിമാരെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: פֶּן תִּסָּפֶה
  choice: അല്ലെങ്കിൽ ... നീയും തുടച്ചുനീക്കപ്പെടും
  rationale: ഒരുമിച്ച് നശിപ്പിക്കപ്പെടുക എന്ന നിഫാൽ ക്രിയയുടെ ഭാവവും മുന്നറിയിപ്പിന്റെ ശക്തിയും ‘തുടച്ചുനീക്കപ്പെടും’ നിലനിർത്തുന്നു.
- source_word: בַּעֲוֺן הָעִיר
  choice: നഗരത്തിനുള്ള ശിക്ഷയിൽ
  rationale: עָוֹן പാപം, കുറ്റബാധ്യത, അതിന്റെ ശിക്ഷ എന്നീ അർത്ഥങ്ങൾ വഹിക്കാം. ആസന്നമായ ന്യായവിധിയാണ് സന്ദർഭത്തിലെ നേരിട്ടുള്ള ഭീഷണി; മൂലപദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ന്യായവിധിയുടെ സന്ദർഭത്തിൽ עָוֹן എന്ന പദത്തിന്റെ അർത്ഥം
  choice: നഗരത്തിനുള്ള ശിക്ഷയിൽ
  alternative: നഗരത്തിന്റെ അകൃത്യത്തിൽ; നഗരത്തിന്റെ കുറ്റം നിമിത്തം
  rationale: ഈ മുന്നറിയിപ്പ് സൊദോമിന്മേൽ വരാനിരിക്കുന്ന നാശത്തിൽ ലോത്തും അകപ്പെടുന്നതിനെക്കുറിച്ചാണ്. അതിനാൽ പ്രധാന പാഠത്തിൽ ഫലമായ ശിക്ഷ വ്യക്തമാക്കുന്നു; എന്നാൽ പാപം, കുറ്റം, ശിക്ഷ എന്നിവയ്ക്കിടയിലെ എബ്രായപദത്തിന്റെ യഥാർഥ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ആജ്ഞകളിലെ അടിയന്തരത സംരക്ഷിച്ചിരിക്കുന്നു; അപൂർവമോ സഭാവിഭാഗവിശേഷമായോ ഉള്ള പദപ്രയോഗങ്ങൾ ഒഴിവാക്കിയിരിക്കുന്നു.
