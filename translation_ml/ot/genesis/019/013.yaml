id: GEN.19.13
reference: Genesis 19:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי מַשְׁחִתִ֣ים אֲנַ֔חְנוּ אֶת הַ/מָּק֖וֹם הַ/זֶּ֑ה כִּֽי גָֽדְלָ֤ה צַעֲקָתָ/ם֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/יְשַׁלְּחֵ֥/נוּ יְהוָ֖ה לְ/שַׁחֲתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/013.yaml
  text: For we are about to destroy this place[a], because their outcry has become great before Yahweh, and Yahweh has sent us to destroy it.
translation:
  language: ml
  text: കാരണം, ഞങ്ങൾ ഈ സ്ഥലം നശിപ്പിക്കാൻ പോകുകയാണ്[a]; അവരുടെ നിലവിളി യഹ്‌വേയുടെ സന്നിധിയിൽ വളരെ വലുതായിത്തീർന്നിരിക്കുന്നതിനാൽ, അതിനെ നശിപ്പിക്കാൻ യഹ്‌വേ ഞങ്ങളെ അയച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇവർക്കെതിരെയുള്ള നിലവിളി യഹ്‌വേയുടെ സന്നിധിയിൽ വളരെ വലുതായിത്തീർന്നിരിക്കുന്നു.” ഹീബ്രു രൂപം നേരിട്ട് “അവരുടെ നിലവിളി” എന്നാണ്; എന്നാൽ സന്ദർഭത്തിൽ, ഈ സ്ഥലത്തെ ജനങ്ങൾക്കെതിരെ ഉയർന്ന നിലവിളിയെന്നാണ് പലരും മനസ്സിലാക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׁחִתִים
  choice: നശിപ്പിക്കാൻ പോകുകയാണ്
  rationale: ഹിഫീൽ ബഹുവചന കൃദന്തം ഇവിടെ ആസന്നമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; വിധിന്യായപ്രഖ്യാപനത്തിന്റെ സാഹചര്യത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: הַמָּקוֹם הַזֶּה
  choice: ഈ സ്ഥലം
  rationale: മൂലത്തിലെ ലളിതമായ സ്ഥാനസൂചനയും ചൂണ്ടിക്കാണിക്കൽഭാവവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: גָדְלָה
  choice: അത്യന്തം വലുതായിത്തീർന്നിരിക്കുന്നു
  rationale: കാൽ പർഫെക്റ്റിന്റെ വർധിച്ച് ഒരു നിലയിലെത്തിയ ഫലഭാവം നൽകുന്നു; മലയാളത്തിൽ പരാതിയുടെ തീവ്രത സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: צַעֲקָתָם
  choice: ഇവരുടെ നിലവിളി
  rationale: മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയം ഔപചാരികമായി ‘ഇവരുടെ’ എന്നാണ്; നിലവിളി ദുരിതവിളിയോ പരാതിയോ സൂചിപ്പിക്കാം. സന്ദർഭപരമായ മറ്റൊരു വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֶת־פְּנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: ‘മുഖത്തിനു മുമ്പിൽ’ എന്ന ഹീബ്രു ശൈലിയുടെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവിക നാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיְשַׁלְּחֵנוּ
  choice: ഞങ്ങളെ അയച്ചിരിക്കുന്നു
  rationale: കഴിഞ്ഞയച്ച ദൗത്യം ഇപ്പോഴത്തെ പ്രവർത്തനവുമായി ബന്ധപ്പെട്ടു നിൽക്കുന്നതായി മലയാളത്തിലെ പൂർണക്രിയ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְשַׁחֲתָהּ
  choice: അതിനെ നശിപ്പിക്കാൻ
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം സന്ദർഭത്തിൽ സ്ഥലത്തെയോ നഗരത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അതിനെ’ സ്വാഭാവികമാണ്. മുമ്പത്തെ അതേ ധാതുവിനായി ‘നശിപ്പിക്കുക’ ആവർത്തിച്ച് ഏകോപനം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവിക വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിനാമം പകരംവയ്ക്കാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: צַעֲקָתָם എന്നതിന്റെ അർഥം
  choice: ഇവരുടെ നിലവിളി
  alternative: ഇവർക്കെതിരെയുള്ള നിലവിളി
  rationale: ഹീബ്രു പ്രത്യയത്തിന്റെ ഏറ്റവും നേരിട്ടുള്ള രൂപം ‘ഇവരുടെ’ എന്നാണ്. എന്നാൽ നഗരവാസികളുടെ ദുഷ്ടതയെക്കുറിച്ച് മറ്റുള്ളവർ ഉയർത്തിയ നിലവിളിയെന്ന സന്ദർഭപരമായ വായനയും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകി, അവ്യക്തത തീർപ്പാക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘നിലവിളി’ എന്ന പദം ദുരിതവിളിയുടെയും നീതിക്കായുള്ള പരാതിയുടെയും അർഥസാധ്യത തുറന്നുവയ്ക്കുന്നു. അടിക്കുറിപ്പ് സൂചിക [a] പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
