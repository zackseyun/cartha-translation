    rationale: The Hebrew says literally that the speaker has “lifted [Lot’s] face” also concerning this matter. In context, this is best rendered as accepting/granting Lot’s request in this matter. «പ്രസാദം» can sound archaic or religiously colored in contemporary Malayalam.
