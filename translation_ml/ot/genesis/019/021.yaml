source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֔י/ו הִנֵּה֙ נָשָׂ֣אתִי פָנֶ֔י/ךָ גַּ֖ם לַ/דָּבָ֣ר הַ/זֶּ֑ה לְ/בִלְתִּ֛י הָפְכִּ֥/י אֶת הָ/עִ֖יר אֲשֶׁ֥ר דִּבַּֽרְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/021.yaml
  text: 'And he said to him[a], “Look, I grant you this request also: I will not overthrow the city of which you have spoken.”'
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “ഇതാ, ഈ കാര്യത്തിലും ഞാൻ നിന്റെ അപേക്ഷ അംഗീകരിച്ചിരിക്കുന്നു[a]. നീ പറഞ്ഞ ആ പട്ടണത്തെ ഞാൻ മറിച്ചുകളയുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായ ഭാഷാശൈലിയിൽ അക്ഷരാർഥം: “ഞാൻ നിന്റെ മുഖം ഉയർത്തിയിരിക്കുന്നു”; അർഥം: “ഞാൻ നിനക്കു അനുകൂലത കാണിച്ചിരിക്കുന്നു” അഥവാ “നിന്റെ അപേക്ഷ അംഗീകരിച്ചിരിക്കുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സംഭാഷണധർമ്മവും ഗൗരവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נָשָׂאתִי פָנֶיךָ
  choice: ഞാൻ നിനക്കു പ്രസാദം കാണിച്ചിരിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ മുഖം ഉയർത്തിയിരിക്കുന്നു’ എന്ന പ്രയോഗം ഇവിടെ ഒരാളോടു അനുകൂലമായി പ്രതികരിച്ച് അപേക്ഷ അംഗീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പ്രസാദം കാണിച്ചിരിക്കുന്നു’ വ്യക്തിപരമായ അനുകൂലതയും പൂർത്തിയായ പ്രതികരണവും നിലനിർത്തുന്നു.
- source_word: גַּם לַדָּבָר הַזֶּה
  choice: ഈ അപേക്ഷയുടെ കാര്യത്തിലും
  rationale: דָּבָר ലോത്ത് ഇപ്പോൾ ഉന്നയിച്ച കാര്യത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അത് അപേക്ഷയായതിനാൽ ഈ രൂപം വ്യക്തവും, גַּם എന്നതിന്റെ ‘-ഉം’ എന്ന കൂട്ടിച്ചേർക്കൽബലവും സംരക്ഷിക്കുന്നതുമാണ്.
- source_word: לְבִלְתִּי הָפְכִּי
  choice: ഞാൻ മറിച്ചുകളയുകയില്ല
  rationale: הפך എന്ന ധാതുവിന്റെ ‘മറിക്കുക/തകിടംമറിക്കുക’ എന്ന ദൃശ്യബലം പൊതുവായ ‘നശിപ്പിക്കുക’ എന്നതിനേക്കാൾ അടുത്തായി നിലനിർത്തുന്നു; ഇവിടെ അനുവദിച്ച അനുകൂലതയുടെ ഫലമായി പട്ടണത്തെ മറിക്കാതിരിക്കുമെന്ന പ്രഖ്യാപനമാണ്.
- source_word: הָעִיר אֲשֶׁר דִּבַּרְתָּ
  choice: നീ പറഞ്ഞ ആ പട്ടണം
  rationale: ബന്ധവാക്യം സ്വാഭാവിക മലയാള പദക്രമത്തിൽ അവതരിപ്പിക്കുമ്പോഴും ലോത്ത് പരാമർശിച്ച നിർദിഷ്ട പട്ടണത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മറിച്ചുകളയുക’ മൂലധാതുവിന്റെ രൂപകബലം നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് എബ്രായ ഭാഷാശൈലി വ്യക്തമാക്കുന്നു.
