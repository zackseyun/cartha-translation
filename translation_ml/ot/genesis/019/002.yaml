reference: Genesis 19:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֜אמֶר הִנֶּ֣ה נָּא אֲדֹנַ֗/י ס֣וּרוּ נָ֠א אֶל בֵּ֨ית עַבְדְּ/כֶ֤ם וְ/לִ֨ינוּ֙ וְ/רַחֲצ֣וּ רַגְלֵי/כֶ֔ם וְ/הִשְׁכַּמְתֶּ֖ם וַ/הֲלַכְתֶּ֣ם לְ/דַרְכְּ/כֶ֑ם וַ/יֹּאמְר֣וּ לֹּ֔א כִּ֥י בָ/רְח֖וֹב נָלִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/002.yaml
  text: And he said[a], “Please, my lords, turn aside to your servant’s house, and spend the night, and wash your feet. Then you may rise early and go on your way.” But they said, “No[d][c][b], but we will spend the night in the square.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ദയവായി, എന്റെ യജമാനന്മാരേ[a], നിങ്ങളുടെ ദാസന്റെ വീട്ടിലേക്കു തിരിഞ്ഞുവരിക; രാത്രി പാർക്കുകയും നിങ്ങളുടെ കാലുകൾ കഴുകുകയും ചെയ്യുക. പിന്നെ അതിരാവിലെ എഴുന്നേറ്റ് നിങ്ങളുടെ വഴിക്കു പോകാം.” എന്നാൽ അവർ പറഞ്ഞു: “അല്ല; ഞങ്ങൾ ചത്വരത്തിൽ[b] രാത്രി പാർക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എന്റെ യജമാനനേ.” אֲדֹנַי എന്ന രൂപം ഏകവചന ആദരസൂചകമായി മനസ്സിലാക്കാനാകുമെങ്കിലും, ലോത്ത് രണ്ടു സന്ദർശകരെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ഇവിടെ ബഹുവചനമാണ് സന്ദർഭത്തിന് കൂടുതൽ യോജിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: ഇവിടത്തെ ഹീബ്രുപദം ചത്വരംപോലുള്ള തുറന്ന പൊതുസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֶּה נָּא ... סוּרוּ נָא
  choice: ദയവായി ... വരിക
  rationale: രണ്ട് അപേക്ഷാകണങ്ങളും ചേർന്ന് ആദരപൂർവമായ നിർബന്ധമുള്ള ക്ഷണം പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ദയവായി’യും വിനയമുള്ള ക്ഷണരൂപവും ഉപയോഗിക്കുന്നത് ആവർത്തനം മൂലമുള്ള അസ്വാഭാവികത ഒഴിവാക്കി ആ ഭാവം നിലനിർത്തുന്നു.
- source_word: אֲדֹנַי
  choice: എന്റെ യജമാനന്മാരേ
  rationale: സന്ദർഭത്തിൽ ലോത്ത് രണ്ടു സന്ദർശകരെയാണ് അഭിസംബോധന ചെയ്യുന്നത്; തുടർന്നുള്ള ക്രിയകളും സർവനാമങ്ങളും ബഹുവചനമാണ്. അതിനാൽ മനുഷ്യരോടുള്ള ആദരസൂചകമായ ബഹുവചന അഭിസംബോധനയാണ് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചത്.
- source_word: בֵּית עַבְדְּכֶם
  choice: നിങ്ങളുടെ ദാസനായ എന്റെ വീട്ടിലേക്കു
  rationale: ലോത്ത് തന്നെ ‘നിങ്ങളുടെ ദാസൻ’ എന്നു വിനയത്തോടെ വിശേഷിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְלִינוּ
  choice: രാത്രി പാർത്ത്
  rationale: לין എന്ന ക്രിയയുടെ രാത്രികാല താമസാർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: കാലുകൾ കഴുകുക
  rationale: പുരാതന ആതിഥ്യമര്യാദയിലെ പ്രവൃത്തി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְהִשְׁכַּמְתֶּם וַהֲלַכְתֶּם לְדַרְכְּכֶם
  choice: നിങ്ങൾക്ക് അതിരാവിലെ എഴുന്നേറ്റ് യാത്ര തുടരാം
  rationale: അടുത്ത പ്രഭാതത്തിൽ നേരത്തേ എഴുന്നേറ്റ് സ്വന്തം വഴിക്കു പോകാമെന്ന ക്ഷണത്തിന്റെ അനുവദനീയ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֹא כִּי
  choice: വേണ്ട, ... തന്നേ
  rationale: നിരാകരണത്തിനു പിന്നാലെയുള്ള വിരുദ്ധത/പകരംതിരഞ്ഞെടുപ്പ് ‘വേണ്ട’ എന്നും ‘തന്നേ’ എന്നും ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בָרְחוֹב
  choice: നഗരചത്വരത്തിൽ
  rationale: רְחוֹב ഇവിടെ സാധാരണ റോഡിനേക്കാൾ നഗരത്തിലെ തുറന്ന പൊതുസ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: נָלִין
  choice: രാത്രി പാർക്കും
  rationale: മുമ്പത്തെ לין എന്ന അതേ ധാതുവിനോടുള്ള പദസാമ്യം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
theological_decisions:
- issue: אֲדֹנַי ദൈവിക സംബോധനയാണോ മനുഷ്യരോടുള്ള സംബോധനയാണോ
  choice: 'മനുഷ്യരോടുള്ള ബഹുവചന സംബോധന: ‘എന്റെ യജമാനന്മാരേ’'
  alternative: ഏകവചന ആദരസൂചകമായി ‘എന്റെ യജമാനനേ’
  rationale: ലോത്ത് രണ്ടു സന്ദർശകരോടു സംസാരിക്കുന്നതാണ് ഉടൻമുമ്പുള്ള സന്ദർഭം; ഈ വാക്യത്തിലെ ബഹുവചന ക്രിയകളും സർവനാമങ്ങളും അതിനെ പിന്തുണയ്ക്കുന്നു. എന്നിരുന്നാലും രൂപത്തിന്റെ ഏകവചന ആദരസൂചക വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ലോത്തിന്റെ വിനയവും ആതിഥ്യമര്യാദയും നിലനിർത്തിയപ്പോൾ അനാവശ്യമായ പുരാതനഭാഷ ഒഴിവാക്കി.
