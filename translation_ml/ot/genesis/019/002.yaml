revisions:
- from: 'അവൻ പറഞ്ഞു: “എന്റെ യജമാനന്മാരേ[a], ദയവായി നിങ്ങളുടെ ദാസനായ എന്റെ വീട്ടിലേക്കു വരിക; രാത്രി പാർത്ത് കാലുകൾ കഴുകുക. പിന്നെ നിങ്ങൾക്ക് അതിരാവിലെ എഴുന്നേറ്റ് യാത്ര തുടരാം.” എന്നാൽ അവർ പറഞ്ഞു: “വേണ്ട, ഞങ്ങൾ നഗരചത്വരത്തിൽത്തന്നെ[b] രാത്രി പാർക്കും.”'
  to: 'അവൻ പറഞ്ഞു: “ദയവായി, എന്റെ യജമാനന്മാരേ[a], നിങ്ങളുടെ ദാസന്റെ വീട്ടിലേക്കു തിരിഞ്ഞുവരിക; രാത്രി പാർക്കുകയും നിങ്ങളുടെ കാലുകൾ കഴുകുകയും ചെയ്യുക. പിന്നെ അതിരാവിലെ എഴുന്നേറ്റ് നിങ്ങളുടെ വഴിക്കു പോകാം.” എന്നാൽ അവർ പറഞ്ഞു: “അല്ല; ഞങ്ങൾ ചത്വരത്തിൽ[b] രാത്രി പാർക്കും.”'
  rationale: The revision restores the “turn aside” nuance, uses an idiomatic Malayalam expression for Lot’s self-humbling reference, avoids adding “city” and emphatic “indeed,” and makes the visitors’ negative response more direct. It preserves the Hebrew’s plural respectful address and the existing alternative-reading and cultural footnotes.
