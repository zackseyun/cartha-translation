  text: הִנֵּה נָ֠א הָ/עִ֨יר הַ/זֹּ֧את קְרֹבָ֛ה לָ/נ֥וּס שָׁ֖מָּ/ה וְ/הִ֣יא מִצְעָ֑ר אִמָּלְטָ֨ה נָּ֜א שָׁ֗מָּ/ה הֲ/לֹ֥א מִצְעָ֛ר הִ֖וא וּ/תְחִ֥י נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/020.yaml
  text: Look[a], please, this city is near enough to flee there, and it is small[b]. Please let me escape there—is it not small? Then my life will live.
translation:
  language: ml
  text: ഇതാ, ദയവായി, ഈ പട്ടണം അവിടേക്ക് ഓടി രക്ഷപ്പെടാൻ തക്കവിധം അടുത്താണ്; അതു ചെറുതുമാണ്. ദയവായി, ഞാൻ അവിടേക്ക് ഓടി രക്ഷപ്പെടട്ടെ—അതു ചെറുതല്ലേ? അങ്ങനെ ഞാൻ ജീവനോടെയിരിക്കും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ പദാനുപദമായി: “എന്റെ ജീവൻ ജീവിക്കും.” ഇവിടെ അതിന്റെ അർഥം “ഞാൻ ജീവനോടെയിരിക്കും” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: ദയവായി നോക്കണമേ!
  rationale: הִנֵּה ശ്രദ്ധ ക്ഷണിക്കുകയും נָא അപേക്ഷയുടെ വിനീതവും അടിയന്തരവുമായ ഭാവം നൽകുകയും ചെയ്യുന്നു. ആധുനിക മലയാളത്തിൽ ഈ രണ്ടും സ്വാഭാവികമായി ചേർത്തുപറയുന്നു.
- source_word: הָעִיר הַזֹּאת
  choice: ഈ പട്ടണം
  rationale: עִיר എന്നത് നഗരത്തെയോ പട്ടണത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ ചെറുതായ അഭയസ്ഥാനത്തെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ ‘പട്ടണം’ സ്വാഭാവികമാണ്.
- source_word: קְרֹבָה לָנוּס שָׁמָּה
  choice: ഓടിരക്ഷപ്പെടാൻ തക്കവിധം അടുത്താണ്
  rationale: קרובה എന്ന സമീപ്യതയും לנוס എന്ന രക്ഷപ്പെടാനുള്ള ഉദ്ദേശ്യവും വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; שמהയുടെ ലക്ഷ്യസ്ഥലസൂചന സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: מִצְעָר
  choice: ചെറുത്
  rationale: പട്ടണത്തിന്റെ ചെറുപ്പമോ നിസ്സാരതയോ സൂചിപ്പിക്കുന്ന പദം. ‘ചെറുത്’ ആവർത്തിച്ച് ഉപയോഗിക്കുന്നത് എബ്രായത്തിലെ ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: אִמָּלְטָה נָּא שָׁמָּה
  choice: ദയവായി, ഞാൻ അവിടേക്ക് ഓടിരക്ഷപ്പെടട്ടെ
  rationale: ഒന്നാംപുരുഷ cohortative രൂപത്തിലെ അപേക്ഷയും נָאയുടെ വിനീതമായ അഭ്യർഥനാഭാവവും ‘രക്ഷപ്പെടട്ടെ’ എന്ന പ്രയോഗത്തിൽ നിലനിർത്തുന്നു.
- source_word: וּתְחִי נַפְשִׁי
  choice: അങ്ങനെ ഞാൻ ജീവനോടെയിരിക്കും
  rationale: נפש ഇവിടെ വ്യക്തിയെ തന്നെയാണു സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം. മുൻ അപേക്ഷയുടെ ഫലമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കാൻ וְയെ ‘അങ്ങനെ’ എന്നു നൽകിയിരിക്കുന്നു; അസ്വാഭാവികമായ പദാനുപദ ആവർത്തനം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി.
theological_decisions:
- issue: וּתְחִי נַפְשִׁי എന്നതിലെ נֶפֶשׁ
  choice: വ്യക്തിയെ സൂചിപ്പിക്കുന്ന എബ്രായ ഇടിയമായി ‘ഞാൻ ജീവനോടെയിരിക്കും’
  alternative: ‘എന്റെ ജീവൻ ജീവിക്കും’ അല്ലെങ്കിൽ ‘എന്റെ ആത്മാവ് ജീവിക്കും’
  rationale: ഇവിടെ ശരീരത്തിൽനിന്ന് വേർതിരിച്ച ഒരു ‘ആത്മാവ്’ എന്ന സാങ്കേതിക ആശയം പാഠത്തിൽ നിർബന്ധിതമാക്കരുത്. പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: അവസാനത്തെ וְയുടെ ബന്ധം
  choice: ‘അങ്ങനെ’ എന്ന ഉദ്ദേശ്യ/ഫലബന്ധം
  alternative: കാലക്രമം മാത്രം സൂചിപ്പിക്കുന്ന ‘അപ്പോൾ’
  rationale: മുൻപുള്ള രക്ഷപ്പെടാനുള്ള അപേക്ഷയുമായി ചേർന്ന് ഈ വാക്യം ഉദ്ദേശ്യമോ ഫലമോ അറിയിക്കാം. ‘അങ്ങനെ’ ഈ ബന്ധം നിലനിർത്തുകയും അതിനെ അതിയായി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. ലോത്തിന്റെ അടിയന്തരവും വിനീതവുമായ അപേക്ഷ ആവർത്തിച്ച ‘ദയവായി’യിലൂടെ നിലനിർത്തി; מִצְעָר എന്ന പദത്തിന്റെ ആവർത്തനവും സംരക്ഷിച്ചു.
