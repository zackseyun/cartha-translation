id: GEN.19.35
reference: Genesis 19:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תַּשְׁקֶ֜יןָ גַּ֣ם בַּ/לַּ֧יְלָה הַ/ה֛וּא אֶת אֲבִי/הֶ֖ן יָ֑יִן וַ/תָּ֤קָם הַ/צְּעִירָה֙ וַ/תִּשְׁכַּ֣ב עִמּ֔/וֹ וְ/לֹֽא יָדַ֥ע בְּ/שִׁכְבָ֖/הּ וּ/בְ/קֻמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/035.yaml
  text: So they also gave their father wine to drink that night[a], and the younger arose and lay with him, and he did not know when she lay down or when she arose.
translation:
  language: ml
  text: അങ്ങനെ ആ രാത്രിയിലും അവർ തങ്ങളുടെ അപ്പന് വീഞ്ഞ് കുടിക്കാൻ കൊടുത്തു. ഇളയവൾ എഴുന്നേറ്റ് അവനോടുകൂടെ കിടന്നു; അവൾ കിടന്നപ്പോഴോ എഴുന്നേറ്റപ്പോഴോ അവൻ അറിഞ്ഞില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: കുടിക്കാൻ കൊടുത്തു
  rationale: שׁקה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘കുടിപ്പിക്കുക/കുടിക്കാൻ കൊടുക്കുക’ എന്ന കാരണാർഥം നൽകുന്നു. ‘ലഹരിപിടിപ്പിച്ചു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ അർഥം ക്രിയയിൽ ചേർക്കാതെ സ്വാഭാവികമായ മലയാളം ഉപയോഗിച്ചു.
- source_word: גַּם
  choice: ആ രാത്രിയിലും
  rationale: മുൻ രാത്രിയിലെ സംഭവത്തിന്റെ തുടർച്ചയെ ‘-ഉം’ വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ‘ആ രാത്രിയിലും’ സ്വാഭാവികമാണ്.
- source_word: בַּלַּיְלָה הַהוּא
  choice: ആ രാത്രിയിൽ
  rationale: കാലസൂചകമായ എബ്രായ പ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: אֶת אֲבִיהֶן יָיִן
  choice: തങ്ങളുടെ അപ്പന് വീഞ്ഞു
  rationale: ‘അവരുടെ അപ്പനെ വീഞ്ഞു കുടിപ്പിച്ചു’ എന്നും പറയാമെങ്കിലും, വാക്യത്തിലെ കാരണാർഥം അമിതമാക്കാതെ ‘അപ്പന് വീഞ്ഞു കുടിക്കാൻ കൊടുത്തു’ എന്നു വ്യക്തമാക്കി.
- source_word: וַתָּקָם הַצְּעִירָה
  choice: ഇളയവൾ എഴുന്നേറ്റ്
  rationale: הַצְּעִירָה എന്നത് സന്ദർഭത്തിൽ ‘ഇളയ സ്ത്രീ/മകൾ’ എന്നാണ്. ‘ഇളയവൾ’ സംക്ഷിപ്തവും വ്യക്തവുമാണ്; തുടർച്ചയായ എബ്രായ കഥനരീതിക്ക് സ്വാഭാവിക മലയാള ബന്ധരൂപം ഉപയോഗിച്ചു.
- source_word: וַתִּשְׁכַּב עִמּוֹ
  choice: അവനോടുകൂടെ കിടന്നു
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയെ ഔപചാരികമായും മനസ്സിലാകുന്ന വിധത്തിലും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְלֹא יָדַע
  choice: അവൻ അറിഞ്ഞില്ല
  rationale: ידע ഇവിടെ ബോധ്യമോ അറിവോ ഇല്ലായ്മയെ സൂചിപ്പിക്കുന്നു. അതിന്റെ സ്വഭാവം തുടർന്നുള്ള വാക്കുകൾ വ്യക്തമാക്കുന്നതിനാൽ ‘അറിഞ്ഞില്ല’ എന്ന നേരിട്ടുള്ള രൂപം നിലനിർത്തി.
- source_word: בְּשִׁכְבָהּ
  choice: അവൾ കിടന്നതോ
  rationale: בְּ + ക്രിയാനാമം ഇവിടെ കാലസംബന്ധമായ അർഥം നൽകുന്നു. സമാന്തരമായ മലയാള ഘടനയിൽ ‘അവൾ കിടന്നതോ’ എന്നു നൽകി.
- source_word: וּבְקֻמָהּ
  choice: എഴുന്നേറ്റതോ
  rationale: മുൻ പദപ്രയോഗത്തോട് സമാന്തരത നിലനിർത്തി, അവളുടെ കിടക്കലും എഴുന്നേൽക്കലും അവൻ അറിഞ്ഞില്ല എന്ന അർഥം സ്വാഭാവികമായി അറിയിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അപ്പൻ’ എന്നത് കുടുംബകഥനത്തിൽ സ്വാഭാവികമാണ്; ‘അവനോടുകൂടെ കിടന്നു’ എന്നത് മൂലത്തിലെ സംയമിതമായ ലൈംഗിക ശൈലി നിലനിർത്തുന്നു. മൂലപാഠത്തിൽ യഥാർഥ പാഠഭേദമോ വിശദീകരണം ആവശ്യമായ അസ്പഷ്ടതയോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് നൽകിയിട്ടില്ല.
