source:
  edition: WLC
  text: וַ/תַּשְׁקֶ֧יןָ אֶת אֲבִי/הֶ֛ן יַ֖יִן בַּ/לַּ֣יְלָה ה֑וּא וַ/תָּבֹ֤א הַ/בְּכִירָה֙ וַ/תִּשְׁכַּ֣ב אֶת אָבִ֔י/הָ וְ/לֹֽא יָדַ֥ע בְּ/שִׁכְבָ֖/הּ וּ/בְ/קׄוּמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/033.yaml
  text: So they gave their father wine to drink that night[a], and the firstborn went in and lay with her father. He did not know when she lay down or when she arose.
translation:
  language: ml
  text: അങ്ങനെ ആ രാത്രിയിൽ അവർ തങ്ങളുടെ അപ്പനു വീഞ്ഞു കുടിക്കാൻ കൊടുത്തു. മൂത്തവൾ അകത്തു ചെന്ന് അപ്പനോടുകൂടെ കിടന്നു. അവൾ കിടന്നതും എഴുന്നേറ്റതും അവൻ അറിഞ്ഞില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അവളുടെ കിടക്കലിലും അവളുടെ എഴുന്നേൽക്കലിലും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: അവർ ... കുടിക്കാൻ കൊടുത്തു
  rationale: שׁקה എന്ന ക്രിയയുടെ ഹിഫ്ഇൽ രൂപം ‘കുടിപ്പിക്കുക/കുടിക്കാൻ കൊടുക്കുക’ എന്ന കാരണാർഥം നൽകുന്നു. ‘കുടിക്കാൻ കൊടുത്തു’ എന്നത് ആ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יַיִן
  choice: വീഞ്ഞു
  rationale: יין എന്ന പദത്തിന്റെ സാധാരണ മലയാള പരിഭാഷ; ഈ സന്ദർഭത്തിൽ മറ്റൊരു പദം തിരഞ്ഞെടുക്കേണ്ട കാരണമില്ല.
- source_word: בַּלַּיְלָה הוּא
  choice: ആ രാത്രിയിൽ
  rationale: നിശ്ചിതമായ മുൻപരാമർശമുള്ള രാത്രിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക കാലപ്രയോഗം.
- source_word: הַבְּכִירָה
  choice: മൂത്തവൾ
  rationale: സ്ത്രീലിംഗത്തിലുള്ള ‘ആദ്യജാത/മൂത്തവൾ’ എന്ന അർഥം. ഇവിടെ രണ്ട് പുത്രിമാരുടെ ജനനക്രമമാണ് ഉദ്ദേശിക്കുന്നത്; ‘മൂത്തവൾ’ സാധാരണ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַתָּבֹא
  choice: അകത്തു ചെന്ന്
  rationale: പിതാവിന്റെ അടുക്കലേക്കുള്ള പ്രവേശനം സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നു. മലയാള കഥനത്തിൽ ‘അകത്തു ചെന്ന്’ സ്വാഭാവികമാണ്.
- source_word: וַתִּשְׁכַּב אֶת
  choice: അപ്പനോടുകൂടെ കിടന്നു
  rationale: ഈ ഘടന ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു സൗമ്യപ്രയോഗമാണ്. ‘കൂടെ കിടന്നു’ അതിന്റെ നിയന്ത്രിതമായ കഥനശൈലി നിലനിർത്തുന്നു.
- source_word: וְלֹא יָדַע
  choice: അവൻ അറിഞ്ഞില്ല
  rationale: ידע ഇവിടെ ബോധമോ അറിവോ ഇല്ലായ്മയെ സൂചിപ്പിക്കുന്നു. എന്താണ് അറിഞ്ഞില്ലാത്തത് എന്നത് പിന്നാലെയുള്ള സമാന്തര പ്രയോഗങ്ങൾ വ്യക്തമാക്കുന്നതിനാൽ അധിക വിശദീകരണം ചേർത്തിട്ടില്ല.
- source_word: בְּשִׁכְבָהּ
  choice: അവൾ കിടന്നതും
  rationale: മുൻപ്രത്യയത്തോടുകൂടിയ ക്രിയാനാമരൂപം അവൾ കിടന്ന സമയത്തെയോ സംഭവത്തെയോ സൂചിപ്പിക്കുന്നു. ‘അവനോടുകൂടെ’ എന്ന് ഈ അവസാന വാക്യഭാഗത്തിൽ വീണ്ടും മൂലപാഠം പറയാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: וּבְקוּמָהּ
  choice: എഴുന്നേറ്റതും
  rationale: മുമ്പുള്ള ഘടകത്തിനു സമാന്തരമായി അവൾ എഴുന്നേറ്റ സമയത്തെയോ സംഭവത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സമാന്തര ഘടന നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള കഥനമലയാളം ഉപയോഗിച്ചു. ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ സൗമ്യപ്രയോഗം നേരിട്ടുള്ള വിശദീകരണമായി മാറ്റാതെ നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് പാളിയിൽ [a] അടയാളം ‘ആ രാത്രിയിൽ’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ കുറിപ്പ് അവസാന വാക്യഭാഗത്തെയാണ് വിശദീകരിക്കുന്നത്; അതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ അടയാളം ബന്ധപ്പെട്ട ഭാഗത്തിന്റെ അവസാനം ചേർത്തു.
