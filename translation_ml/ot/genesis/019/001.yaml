  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הַ/מַּלְאָכִ֤ים סְדֹ֨מָ/ה֙ בָּ/עֶ֔רֶב וְ/ל֖וֹט יֹשֵׁ֣ב בְּ/שַֽׁעַר סְדֹ֑ם וַ/יַּרְא לוֹט֙ וַ/יָּ֣קָם לִ/קְרָאתָ֔/ם וַ/יִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/001.yaml
  text: The two angels came to Sodom in the evening[a], and Lot was sitting in the gate of Sodom. When Lot saw them[c][b], he rose to meet them and bowed with his face to the ground.
translation:
  language: ml
  text: ആ രണ്ടു ദൈവദൂതന്മാർ സന്ധ്യാസമയത്ത് സൊദോമിലെത്തി. ലോത്ത് സൊദോമിന്റെ നഗരകവാടത്തിൽ[a] ഇരിക്കുകയായിരുന്നു. അവരെ കണ്ടപ്പോൾ ലോത്ത് എഴുന്നേറ്റ് അവരെ എതിരേൽക്കാൻ ചെന്നു, മുഖം നിലത്തോടു ചേർത്ത് പ്രണാമം ചെയ്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സൊദോമിന്റെ നഗരകവാടം’ എന്നത് നഗരത്തിലേക്കുള്ള പ്രവേശനവാതിൽ മാത്രമല്ല, പൊതുകാര്യങ്ങളും പൗരപ്രവർത്തനങ്ങളും നടന്നിരുന്ന കവാടപ്രദേശത്തെയും സൂചിപ്പിക്കാം.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘മുഖം നിലത്ത് പതിയുമാറ് കുമ്പിട്ടു.’ എബ്രായപ്രയോഗം മുഖം നിലത്തോടു ചേർന്നുള്ള പൂർണമായ പ്രണാമത്തെ വിവരിക്കുന്നു; ഇതിനെ നിർബന്ധമായി ‘ആരാധിച്ചു’ എന്നു മനസ്സിലാക്കേണ്ടതില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי הַמַּלְאָכִים
  choice: ആ രണ്ടു ദൂതന്മാർ
  rationale: മַלְאָךְ എന്നതിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമുണ്ടാകാം. മുൻവിവരണത്തിലെ സ്വർഗീയ സന്ദർശകരെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘ദൂതന്മാർ’ എന്നത് മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്. നിർദേശകമായ ‘ആ’ മുൻ അധ്യായത്തിലെ സന്ദർശകരുമായുള്ള തുടർച്ച വ്യക്തമാക്കുന്നു.
- source_word: סְדֹמָה בָּעֶרֶב
  choice: സന്ധ്യയ്ക്കു സൊദോമിലെത്തി
  rationale: ദിശാസൂചകമായ ה സൊദോമിലേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു; בוא എന്ന ക്രിയയോടൊപ്പം ‘സൊദോമിലെത്തി’ സ്വാഭാവികമായി വരവ് പ്രകടിപ്പിക്കുന്നു. בָּעֶרֶב എന്ന സമയം ‘സന്ധ്യയ്ക്ക്’ എന്നു നൽകി.
- source_word: וְלוֹט יֹשֵׁב
  choice: ലോത്ത് ... ഇരിക്കുകയായിരുന്നു
  rationale: വർത്തമാനകൃദന്തം പശ്ചാത്തലത്തിലെ തുടരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഇരിക്കുകയായിരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בְּשַׁעַר סְדֹם
  choice: സൊദോമിന്റെ നഗരകവാടത്തിങ്കൽ
  rationale: ഇത് കവാടവാതിൽ മാത്രം അല്ല, പൊതുപ്രവർത്തനങ്ങൾ നടന്നിരുന്ന നഗരകവാടപ്രദേശത്തെയും സൂചിപ്പിക്കാം. ‘നഗരകവാടത്തിങ്കൽ’ ആ സ്ഥലസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיָּקָם לִקְרָאתָם
  choice: എഴുന്നേറ്റ് അവരെ എതിരേറ്റുചെന്ന്
  rationale: קום, לקראת എന്നീ ഘടകങ്ങൾ എഴുന്നേൽക്കലും അവരുടെ അടുത്തേക്കു ചെന്നു സ്വീകരിക്കലും ഉൾക്കൊള്ളുന്നു. ‘എതിരേറ്റുചെന്ന്’ ഈ ചലനവും ആദരപൂർവമായ സ്വീകരണവും വ്യക്തമാക്കുന്നു.
- source_word: וַיִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: മുഖം നിലത്തോടു ചേർത്ത് കുനിഞ്ഞു നമസ്കരിച്ചു
  rationale: ഈ പ്രയോഗം മുഖം നിലത്താകുന്നത്ര ആഴത്തിൽ കുനിയുന്ന ആദരപ്രകടനത്തെ വിവരിക്കുന്നു. ‘കുനിഞ്ഞു നമസ്കരിച്ചു’ ആരാധനയെന്ന നിർബന്ധിത വ്യാഖ്യാനം ഒഴിവാക്കി ആദരപൂർവമായ പ്രണാമം അറിയിക്കുന്നു.
theological_decisions:
- issue: וַיִּשְׁתַּחוּ എന്നത് ആരാധനയോ ആദരപൂർവമായ പ്രണാമമോ എന്ന ചോദ്യം
  choice: കുനിഞ്ഞു നമസ്കരിച്ചു
  alternative: ആരാധിച്ചു
  rationale: שׁחה എന്ന ക്രിയയ്ക്ക് ദൈവാരാധനയും മനുഷ്യരോടോ ഉന്നതരായ സന്ദർശകരോടോ ഉള്ള ആദരപ്രണാമവും സൂചിപ്പിക്കാം. ഈ സന്ദർഭത്തിൽ ‘ആരാധിച്ചു’ എന്നു പറയുന്നത് വാക്യം നിർബന്ധിക്കാത്ത ദൈവശാസ്ത്രപരമായ നിഗമനം ചേർക്കും; അതിനാൽ പ്രവർത്തിയുടെ ഭൗതികരൂപവും ആദരസ്വഭാവവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘നഗരകവാടം’ എന്ന സാംസ്കാരിക ആശയം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. ‘നമസ്കരിച്ചു’ എന്ന പദം ആദരപ്രണാമത്തിന്റെ അർഥത്തിൽ ഉപയോഗിച്ചു; ആരാധനയെന്ന ദൈവശാസ്ത്രപരമായ നിഗമനം ഒഴിവാക്കി.
