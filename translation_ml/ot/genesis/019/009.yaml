translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ജനക്കൂട്ടത്തിന്റെ അവഹേളനവും ഭീഷണിയും ശക്തമായി നിലനിർത്തിയെങ്കിലും, മൂലപാഠം വ്യക്തമാക്കാത്ത ദോഷത്തിന്റെ സ്വഭാവം വിശദീകരിച്ച് ചേർത്തിട്ടില്ല. ‘പരദേശി’, ‘ന്യായം വിധിക്കുക’ എന്നീ പദങ്ങൾ ആശയകൃത്യതയും സ്വാഭാവികതയും തമ്മിൽ തുലനം ചെയ്യുന്നു.
