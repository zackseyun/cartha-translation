source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ גֶּשׁ הָ֗לְאָה וַ/יֹּֽאמְרוּ֙ הָ/אֶחָ֤ד בָּֽא לָ/גוּר֙ וַ/יִּשְׁפֹּ֣ט שָׁפ֔וֹט עַתָּ֕ה נָרַ֥ע לְ/ךָ֖ מֵ/הֶ֑ם וַ/יִּפְצְר֨וּ בָ/אִ֤ישׁ בְּ/לוֹט֙ מְאֹ֔ד וַֽ/יִּגְּשׁ֖וּ לִ/שְׁבֹּ֥ר הַ/דָּֽלֶת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/009.yaml
  text: And they said[a], “Get back!” Then they said, “This one came to live as a foreigner, and now he keeps acting as judge! Now we will treat you worse than them.” And they pressed very hard against the man, against Lot[d][c][b], and came near to break down the door.
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “പിന്നോട്ടു മാറ്!”[a] പിന്നെ അവർ പറഞ്ഞു: “ഈ ഒരുത്തൻ പരദേശിയായി താമസിക്കാൻ വന്നവനാണ്; എന്നിട്ടിപ്പോൾ ന്യായം വിധിക്കാൻ ഇറങ്ങിയിരിക്കുന്നു![b] ഇനി അവരോടു ചെയ്യുന്നതിനെക്കാൾ വലിയ ദോഷം നിന്നോടു ചെയ്യും.”[c] അവർ ആ മനുഷ്യനായ ലോത്തിന്റെ നേരെ അതിശക്തമായി തള്ളിക്കയറി[d]; വാതിൽ തകർക്കാൻ അടുത്തുചെന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വഴിയിൽനിന്നു മാറ്!” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തോടടുത്ത്: “ഈ ഒരുത്തൻ പരദേശിയായി താമസിക്കാൻ വന്നു; ഇപ്പോഴിതാ ന്യായം വിധിച്ചേ തീരൂ എന്ന മട്ടിലാണ്!”'
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: “അവരോടു ചെയ്യുന്നതിനെക്കാൾ അധികം ദോഷം നിന്നോടു ചെയ്യും.” സന്ദർശകരെക്കാൾ കടുത്ത ഉപദ്രവം ലോത്തിനോടു ചെയ്യുമെന്ന ഭീഷണിയാണിത്.'
    reason: idiom_explanation
  - marker: d
    text: എബ്രായപാഠം ഊന്നലോടെ, “ആ മനുഷ്യന്റെ നേരെ, ലോത്തിന്റെ നേരെ” എന്ന് ആവർത്തിക്കുന്നു.
    reason: source_form
lexical_decisions:
- source_word: גֶּשׁ הָלְאָה
  choice: പിന്നോട്ടു മാറ്!
  rationale: നגשׁ എന്ന ക്രിയയും הָלְאָה എന്ന ക്രിയാവിശേഷണവും ചേർന്ന പ്രയോഗം ഇവിടെ ഒരാളെ ബലമായി പിന്നോട്ടോ വഴിയിൽനിന്നോ മാറാൻ കല്പിക്കുന്നതാണ്. ‘പിന്നോട്ടു മാറ്’ ആ ശത്രുതാഭാവവും ഏകവചന കല്പനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָאֶחָד
  choice: ഈ ഒരുത്തൻ
  rationale: ലോത്തിനെ അവഹേളിച്ചും അകറ്റിനിർത്തിയും പറയുന്ന ഭാവം ‘ഈ ഒരുത്തൻ’ വ്യക്തമാക്കുന്നു; വെറും ‘ഇയാൾ’ എന്നതിനെക്കാൾ മൂലപാഠത്തിലെ നിന്ദാസ്വരം ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: בָּא לָגוּר
  choice: പരദേശിയായി താമസിക്കാൻ വന്നവനാണ്
  rationale: גור ഇവിടെ സ്വദേശാവകാശമില്ലാത്ത പുറംനാട്ടുകാരനായി പാർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആ സാമൂഹിക നില സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി മനസ്സിലാകുന്ന വിധത്തിലാണ് പരിഭാഷ.
- source_word: וַיִּשְׁפֹּט שָׁפוֹט
  choice: ന്യായം വിധിക്കാനും വന്നിരിക്കുന്നു
  rationale: ക്രിയയോടൊപ്പമുള്ള infinitive absolute വിധിക്കുന്ന പ്രവൃത്തിക്ക് ഊന്നൽ നൽകുന്നു. മലയാളത്തിലെ ഈ പ്രയോഗം ‘ഞങ്ങളെ വിധിക്കാൻ ഇവൻ ആരാണ്?’ എന്ന പരിഹാസപരവും കുറ്റപ്പെടുത്തുന്നതുമായ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נָרַע לְךָ מֵהֶם
  choice: അവരോടു ചെയ്യുന്നതിനെക്കാൾ വലിയ ദോഷം നിന്നോടു ചെയ്യും
  rationale: רעע എന്നതിന്റെ ഹിഫീൽ രൂപം ദോഷം ചെയ്യുക അഥവാ ഉപദ്രവിക്കുക എന്ന അർഥത്തിലാണ്. താരതമ്യവും ഭീഷണിയും തുറന്നുവെക്കുന്നു; അവർ ഉദ്ദേശിച്ചിരുന്ന ദോഷത്തിന്റെ കൃത്യസ്വഭാവം പരിഭാഷയിൽ അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: וַיִּפְצְרוּ בָאִישׁ בְּלוֹט מְאֹד
  choice: അവർ ആ മനുഷ്യന്റെമേൽ—ലോത്തിന്റെമേൽ—അതിശക്തമായി തള്ളിക്കയറി
  rationale: തുടർന്നുള്ള വാതിൽ തകർക്കാനുള്ള നീക്കം കണക്കിലെടുക്കുമ്പോൾ פצר ഇവിടെ ശാരീരികമായ ശക്തമായ തള്ളിക്കയറ്റമാണ്. ആവർത്തിച്ച בְּ ഘടനയും ലോത്തിന്മേലുള്ള ഊന്നലും ഡാഷ് ഉപയോഗിച്ച് നിലനിർത്തി; מְאֹד ‘അതിശക്തമായി’ എന്നു പ്രകടമാക്കി.
- source_word: וַיִּגְּשׁוּ לִשְׁבֹּר הַדָּלֶת
  choice: വാതിൽ തകർക്കാൻ അടുത്തുചെന്നു
  rationale: נגשׁ + infinitive ഉദ്ദേശ്യത്തോടെ മുന്നോട്ടു നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. שׁבר എന്നതിന്റെ ബലപ്രയോഗം ‘തകർക്കാൻ’ എന്നതിൽ വ്യക്തമാണ്.
