revisions:
- from: 'അവർ പറഞ്ഞു: “പിന്നോട്ടു മാറ്!”[a] പിന്നെ അവർ പറഞ്ഞു: “ഈ ഒരുത്തൻ പരദേശിയായി താമസിക്കാൻ വന്നവനാണ്; എന്നിട്ടിപ്പോൾ ന്യായം വിധിക്കാനും വന്നിരിക്കുന്നു![b] ഇനി അവരോടു ചെയ്യുന്നതിനെക്കാൾ വലിയ ദോഷം നിന്നോടു ചെയ്യും.”[c] അവർ ആ മനുഷ്യന്റെമേൽ—ലോത്തിന്റെമേൽ—അതിശക്തമായി തള്ളിക്കയറി[d]; വാതിൽ തകർക്കാൻ അടുത്തുചെന്നു.'
  to: 'അവർ പറഞ്ഞു: “പിന്നോട്ടു മാറ്!”[a] പിന്നെ അവർ പറഞ്ഞു: “ഈ ഒരുത്തൻ പരദേശിയായി താമസിക്കാൻ വന്നവനാണ്; എന്നിട്ടിപ്പോൾ ന്യായം വിധിക്കാൻ ഇറങ്ങിയിരിക്കുന്നു![b] ഇനി അവരോടു ചെയ്യുന്നതിനെക്കാൾ വലിയ ദോഷം നിന്നോടു ചെയ്യും.”[c] അവർ ആ മനുഷ്യനായ ലോത്തിന്റെ നേരെ അതിശക്തമായി തള്ളിക്കയറി[d]; വാതിൽ തകർക്കാൻ അടുത്തുചെന്നു.'
  rationale: The revision removes the unwarranted repeated notion of ‘coming’ from the judicial accusation and uses an idiomatic Malayalam expression for presumptuously setting oneself up to judge. It also smooths the physical-pressure clause while preserving the Hebrew emphasis on ‘the man, Lot.’ All footnote markers remain anchored and the footnote wording now matches the revised syntax.
  reviewer_model: gpt-5.6-terra
