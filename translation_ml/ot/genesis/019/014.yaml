id: GEN.19.14
reference: Genesis 19:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצֵ֨א ל֜וֹט וַ/יְדַבֵּ֣ר אֶל חֲתָנָ֣י/ו לֹקְחֵ֣י בְנֹתָ֗י/ו וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִן הַ/מָּק֣וֹם הַ/זֶּ֔ה כִּֽי מַשְׁחִ֥ית יְהוָ֖ה אֶת הָ/עִ֑יר וַ/יְהִ֥י כִ/מְצַחֵ֖ק בְּ/עֵינֵ֥י חֲתָנָֽי/ו׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/014.yaml
  text: So Lot went out and spoke to his sons-in-law[a], who were to marry his daughters, and said, “Get up, get out of this place[b], because Yahweh is about to destroy the city.” But he seemed to his sons-in-law to be joking.
translation:
  language: ml
  text: 'അപ്പോൾ ലോത്ത് പുറത്തുചെന്ന്, തന്റെ പുത്രിമാരെ വിവാഹം കഴിക്കാനിരുന്ന മരുമക്കളോട്[a] സംസാരിച്ചു. അവൻ പറഞ്ഞു: “എഴുന്നേൽക്കൂ, ഈ സ്ഥലം വിട്ടുപോകൂ! യഹ്‌വേ ഈ നഗരം നശിപ്പിക്കാനിരിക്കുകയാണ്.” എന്നാൽ മരുമക്കൾക്ക് അവൻ തമാശ പറയുന്നതുപോലെ തോന്നി[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തന്റെ പുത്രിമാരെ വിവാഹം കഴിച്ചിരുന്ന മരുമക്കൾ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പ്രയോഗം, വിവാഹം കഴിക്കാനിരുന്ന പുരുഷന്മാരെയോ ഇതിനകം വിവാഹം കഴിച്ചവരെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: 'അക്ഷരാർഥം: “മരുമക്കളുടെ കണ്ണിൽ അവൻ തമാശ പറയുന്ന ഒരാളെപ്പോലെയായിരുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲתָנָיו
  choice: മരുമക്കളോട്
  rationale: חָתָן എന്ന പദത്തിന് ‘മരുമകൻ’ എന്നോ ‘വരൻ’ എന്നോ അർഥമാകാം. സന്ദർഭത്തിൽ ലോത്തിന്റെ പുത്രിമാരെ വിവാഹം കഴിക്കുന്ന പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘മരുമക്കൾ’ സ്വാഭാവികമായ മലയാള ബന്ധപദമാണ്.
- source_word: לֹקְחֵי בְנֹתָיו
  choice: തന്റെ പുത്രിമാരെ വിവാഹം കഴിക്കാനിരുന്ന
  rationale: ‘അവന്റെ പുത്രിമാരെ എടുക്കുന്നവർ’ എന്ന എബ്രായ പ്രയോഗം വിവാഹബന്ധത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അടുത്ത വാക്യത്തിലെ കഥാസന്ദർഭം പരിഗണിച്ച് ആസന്നമായ വിവാഹം മുഖ്യവാചകത്തിൽ നൽകിയെങ്കിലും, പൂർത്തിയായ വിവാഹത്തെ സൂചിപ്പിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: קוּמוּ צְּאוּ
  choice: എഴുന്നേൽക്കൂ, ... വിട്ടുപോകൂ
  rationale: തുടർച്ചയായ രണ്ട് ആജ്ഞാരൂപങ്ങളുടെ അടിയന്തരതയും ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִן־הַמָּקוֹם הַזֶּה
  choice: ഈ സ്ഥലം വിട്ടുപോകൂ
  rationale: ‘ഈ സ്ഥലത്തുനിന്ന് പുറത്തുപോകുക’ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികവും അടിയന്തരവുമായ രീതിയിൽ നൽകുന്നു.
- source_word: מַשְׁחִית
  choice: നശിപ്പിക്കാനിരിക്കുകയാണ്
  rationale: ഹിഫിൽ കർത്തൃവാചക വർത്തമാനകൃത്ത് ഇവിടെ ഇനിയും സംഭവിക്കാത്തതും ആസന്നവുമായ നാശത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הָעִיר
  choice: ഈ നഗരം
  rationale: നിർദ്ദിഷ്ട നഗരം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ മലയാളത്തിലെ സൂചനാപദം ചേർത്തത് സ്വാഭാവികമാണ്; അർഥത്തിൽ സൊദോം നഗരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: כִּמְצַחֵק
  choice: തമാശ പറയുന്നതുപോലെ
  rationale: ലോത്തിന്റെ വാക്കുകൾ ഗൗരവമുള്ളതായി മരുമക്കൾ കരുതിയില്ലെന്ന ധ്വനി നൽകുന്നു; ‘പരിഹസിക്കുക’ എന്നു വിവർത്തനം ചെയ്ത് അനാവശ്യമായി ശക്തമായ അർഥം ചുമത്തുന്നില്ല.
- source_word: בְּעֵינֵי חֲתָנָיו
  choice: മരുമക്കൾക്ക് ... തോന്നി
  rationale: ‘മരുമക്കളുടെ കണ്ണുകളിൽ’ എന്ന എബ്രായ ശൈലിയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു.
- issue: ലോത്തിന്റെ പുത്രിമാരുമായുള്ള മരുമക്കളുടെ വിവാഹനില
  choice: വിവാഹം കഴിക്കാനിരുന്നവർ
  alternative: ഇതിനകം വിവാഹം കഴിച്ചിരുന്നവർ
  rationale: לֹקְחֵי എന്ന കർത്തൃവാചക വർത്തമാനകൃത്ത് വിവാഹനടപടി പുരോഗമിക്കുന്നതോ ആസന്നമായതോ ആയി മനസ്സിലാക്കാം; എന്നാൽ പൂർത്തിയായ വിവാഹം എന്ന വായനയും എബ്രായത്തിൽ സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ആജ്ഞകളുടെ അടിയന്തരത നിലനിർത്താൻ ഹ്രസ്വവും നേരിട്ടുമുള്ള രൂപങ്ങൾ സ്വീകരിച്ചു; യഥാർഥമായ എബ്രായ അസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
