id: GEN.19.25
reference: Genesis 19:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יַּהֲפֹךְ֙ אֶת הֶ/עָרִ֣ים הָ/אֵ֔ל וְ/אֵ֖ת כָּל הַ/כִּכָּ֑ר וְ/אֵת֙ כָּל יֹשְׁבֵ֣י הֶ/עָרִ֔ים וְ/צֶ֖מַח הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/025.yaml
  text: And he overthrew those cities[a], and all the plain, and all the inhabitants of the cities[b], and the vegetation of the ground.
translation:
  language: ml
  text: അവൻ ആ പട്ടണങ്ങളെയും[a] സമതലപ്രദേശം മുഴുവനെയും[b] പട്ടണങ്ങളിലെ സകല നിവാസികളെയും നിലത്തെ സസ്യജാലത്തെയും കീഴ്മേൽ മറിച്ചുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിനാശകരമായി മറിച്ചുകളഞ്ഞു.” എബ്രായ ക്രിയ ഒരു ദുരന്തകരമായ കീഴ്മേൽ മറിച്ചിടലിനെ ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “സമതലപ്രദേശം” എന്നത് യോർദ്ദാൻ സമതലത്തിലെ ആ പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: നശിപ്പിച്ചുകളഞ്ഞു
  rationale: הפך എന്ന ക്രിയയ്ക്ക് മറിച്ചിടുക, കീഴ്മേൽ മറിക്കുക, വിനാശകരമായി തകർക്കുക എന്നീ ഭാവങ്ങളുണ്ട്. മലയാളത്തിലെ മുഖ്യവാക്യത്തിൽ സ്വാഭാവികമായ സമ്പൂർണനാശത്തിന്റെ അർഥം നൽകുകയും, മൂലത്തിലെ ദൃശ്യഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: הֶעָרִים הָאֵל
  choice: ആ പട്ടണങ്ങളെ
  rationale: אֵל മുമ്പ് പരാമർശിച്ച നിർദിഷ്ട പട്ടണങ്ങളിലേക്കാണ് വിരൽചൂണ്ടുന്നത്; ആ എന്നത് മലയാളകഥനത്തിൽ സ്വാഭാവികമാണ്.
- source_word: כָּל הַכִּכָּר
  choice: സമതലപ്രദേശം മുഴുവനെയും
  rationale: ഈ സന്ദർഭത്തിൽ כִּכָּר യോർദ്ദാൻ താഴ്വരയിലെ വിശാലമായ സമതലജില്ലയെ സൂചിപ്പിക്കുന്നു; വെറും സമതലം എന്നതിനെക്കാൾ സമതലപ്രദേശം ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തി വ്യക്തമാക്കുന്നു.
- source_word: כָּל יֹשְׁבֵי הֶעָרִים
  choice: പട്ടണങ്ങളിലെ സകല നിവാസികളെയും
  rationale: ישב-ൽ നിന്നുള്ള കർത്തൃവാചക രൂപം അവിടെ താമസിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു; നിവാസികൾ സംക്ഷിപ്തവും കൃത്യവുമായ ആധുനിക മലയാളമാണ്.
- source_word: צֶמַח הָאֲדָמָה
  choice: നിലത്തു മുളച്ച സസ്യങ്ങളെ
  rationale: צֶמַח മുളച്ചുവളരുന്ന സസ്യജാലത്തെയും אֲדָמָה മണ്ണ്/നിലത്തെയും സൂചിപ്പിക്കുന്നു; ഈ പരിഭാഷ മൂലത്തിലെ വളർച്ചാഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഏകവചന ക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: അവൻ എന്ന് മാത്രം നൽകി; ദൈവം/യഹോവ എന്ന് ഈ വാക്യത്തിൽ വ്യക്തമാക്കിയില്ല.
  alternative: യഹോവ ആ പട്ടണങ്ങളെ നശിപ്പിച്ചുകളഞ്ഞു.
  rationale: എബ്രായ വാക്യത്തിൽ കർത്താവ് പ്രത്യേകം നാമകരണം ചെയ്യപ്പെടുന്നില്ല; മുൻസന്ദർഭം ദൈവത്തെ പ്രവർത്തകനായി തിരിച്ചറിയുന്നു. അതിനാൽ വാക്യം നൽകുന്ന പരോക്ഷത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. പട്ടണങ്ങൾ, നിവാസികൾ, സമതലപ്രദേശം എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; മൂലത്തിലെ ആവർത്തിച്ചുള്ള സകല/മുഴുവൻ വ്യാപ്തി സംരക്ഷിച്ചിട്ടുണ്ട്.
