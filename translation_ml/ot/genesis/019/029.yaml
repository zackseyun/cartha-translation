  yaml_path: translation/ot/genesis/019/029.yaml
  text: So it happened[a], when God destroyed the cities of the plain, that God remembered Abraham and sent Lot out of the midst of the overthrow[d][c][b], when he overthrew the cities in which Lot had lived.
translation:
  language: ml
  text: ദൈവം സമതലപ്രദേശത്തെ പട്ടണങ്ങളെ നശിപ്പിച്ചപ്പോൾ, ദൈവം അബ്രാഹാമിനെ ഓർത്തു[a]; ലോത്ത് താമസിച്ചിരുന്ന പട്ടണങ്ങളെ അവൻ തകിടംമറിച്ചപ്പോൾ, ആ നാശത്തിന്റെ നടുവിൽനിന്ന്[b] അവൻ ലോത്തിനെ പുറത്തയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൈവം അബ്രാഹാമിനെ ഓർത്തു’ എന്നത് ദൈവം അബ്രാഹാമിനെ മറന്നുപോയിരുന്നു എന്നല്ല; അബ്രാഹാമിനോടുള്ള വിശ്വസ്തമായ പരിഗണനയിൽ ദൈവം പ്രവർത്തിച്ചു എന്നർഥമുള്ള എബ്രായ പ്രയോഗമാണിത്.
    reason: cultural_note
  - marker: b
    text: ‘തകിടംമറിക്കലിന്റെ നടുവിൽനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ‘നാശം’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായ നാമം, തൊട്ടുപിന്നാലെയുള്ള ‘തകിടംമറിച്ചു’ എന്ന ക്രിയയുമായി പദബന്ധമുള്ളതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: അങ്ങനെ സംഭവിച്ചു
  rationale: എബ്രായ ആഖ്യാനത്തിലെ സംഭവപരമ്പരയും തുടർന്നുവരുന്ന കാലസാഹചര്യവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: בְּשַׁחֵת
  choice: നശിപ്പിച്ചപ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct ഇവിടെ കാലസാഹചര്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘-ച്ചപ്പോൾ’ എന്ന രൂപം യോജിക്കുന്നു.
- source_word: עָרֵי הַכִּכָּר
  choice: സമതലപ്രദേശത്തെ പട്ടണങ്ങൾ
  rationale: כִּכָּר ഇവിടെ യോർദ്ദാൻ സമതലമേഖലയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സമതലപ്രദേശം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: וַיִּזְכֹּר אֱלֹהִים אֶת אַבְרָהָם
  choice: ദൈവം അബ്രാഹാമിനെ ഓർത്തു
  rationale: ദൈവത്തിന്റെ വിശ്വസ്തമായ പരിഗണന പ്രവർത്തനത്തിലേക്കു നയിക്കുന്നു എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ധ്വനി വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַיְשַׁלַּח אֶת לוֹט
  choice: ലോത്തിനെ പുറത്തയച്ചു
  rationale: שׁלח എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘അയയ്ക്കുക’ എന്ന അർഥവും നാശമേഖലയിൽനിന്നുള്ള പുറത്തേക്കുള്ള ചലനവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: מִתּוֹךְ הַהֲפֵכָה
  choice: ആ ഉന്മൂലനത്തിന്റെ നടുവിൽനിന്ന്
  rationale: תּוֹךְ എന്നതിന്റെ ‘നടുവിൽ’ എന്ന ആശയം സൂക്ഷിക്കുകയും הֲפֵכָהയെ തുടർന്നുള്ള הפך എന്ന ക്രിയയുമായി ഒരേ പദകുടുംബത്തിലൂടെ ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: בַּהֲפֹךְ
  choice: ഉന്മൂലനം ചെയ്തപ്പോൾ
  rationale: കാലസാഹചര്യം സ്വാഭാവികമായി നൽകുന്നതിനോടൊപ്പം മുൻപത്തെ നാമരൂപമായ ‘ഉന്മൂലനം’ എന്നതുമായ പദപ്രതിധ്വനി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יָשַׁב בָּהֵן לוֹט
  choice: ലോത്ത് താമസിച്ചിരുന്ന പട്ടണങ്ങൾ
  rationale: ബഹുവചനസൂചന നിലനിർത്തി, ആഖ്യാനക്രമത്തിന് യോജിക്കുന്ന ഭൂതകാല താമസത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ദൈവം അബ്രാഹാമിനെ ഓർത്തു’ എന്നതിന്റെ അർഥം
  choice: ‘ഓർത്തു’ എന്ന എബ്രായ പ്രയോഗം മുഖ്യപാഠത്തിൽ അതേപടി നിലനിർത്തി.
  alternative: ‘അബ്രാഹാമിനെ പരിഗണിച്ച് ദൈവം പ്രവർത്തിച്ചു’ അല്ലെങ്കിൽ ‘അബ്രാഹാമിനെപ്രതി ദൈവം കരുതലോടെ പ്രവർത്തിച്ചു.’
  rationale: ദൈവം മറന്നുപോയിരുന്നു എന്നല്ല ഈ പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം; വിശ്വസ്തമായ പരിഗണന പ്രവർത്തനത്തിൽ പ്രകടമാകുന്നതാണ്. എങ്കിലും അതിനെ മുഖ്യപാഠത്തിൽ പരാവർത്തനം ചെയ്യുന്നത് മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പ്രയോഗത്തെ അനാവശ്യമായി വിശദീകരിച്ചുതീർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘തകിടംമറിക്കുക’ എന്ന കൂടുതൽ ദൃശ്യമായ പദത്തിനുപകരം, ഗൗരവമുള്ള വാക്യശൈലിക്കും സമ്പൂർണ നാശത്തിന്റെ സന്ദർഭത്തിനും യോജിക്കുന്ന ‘ഉന്മൂലനം’ തെരഞ്ഞെടുത്തു; നാമ-ക്രിയ പദപ്രതിധ്വനി നിലനിർത്തി.
