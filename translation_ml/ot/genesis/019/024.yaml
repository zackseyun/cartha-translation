  naturalness: ‘യഹോവയുടെ അടുക്കൽനിന്ന്’ എന്ന രൂപവും കർമങ്ങളെ ക്രിയയ്ക്കു തൊട്ടുമുമ്പു വയ്ക്കുന്ന ക്രമവും വാക്യത്തെ കൂടുതൽ സുഗമമാക്കുന്നു; അതേസമയം മൂലപാഠത്തിന്റെ അസാധാരണമായ ഇരട്ട ദൈവനാമം ഒഴിവാക്കുന്നില്ല.
  terminology: ‘യഹോവ,’ ‘ഗന്ധകം,’ ‘തീ,’ ‘സൊദോം,’ ‘ഗൊമോറാ’ എന്നിവ അനുയോജ്യമാണ്. അടിക്കുറിപ്പ് a-യിലെ ‘കീൽകം’ ആധുനിക നിലവാരമലയാളത്തിൽ സ്ഥിരീകരിക്കാവുന്ന പാരമ്പര്യ തുല്യപദമല്ല; അതിനാൽ അത് നീക്കി ഹീബ്രായപദത്തിന്റെ അർഥവും ഇംഗ്ലീഷ് പാരമ്പര്യപ്രയോഗവും മാത്രം വ്യക്തമാക്കണം.
