  to: അപ്പോൾ യഹോവ സൊദോമിന്റെയും ഗൊമോറായുടെയുംമേൽ ഗന്ധകവും തീയും യഹോവയുടെ അടുക്കൽനിന്ന് ആകാശത്തുനിന്നു വർഷിപ്പിച്ചു.[a][b]
  rationale: മുഖ്യവാക്യത്തിൽ ദൈവനാമത്തിന്റെ ആവർത്തനവും ‘ആകാശത്തുനിന്നു’ എന്ന ഉറവിടസൂചനയും മാറ്റിയിട്ടില്ല. מֵאֵת യഹോവയ്ക്ക് കൂടുതൽ സ്വാഭാവികവും ഔപചാരികവുമായ മലയാളരൂപം ഉപയോഗിച്ചു. സ്ഥിരീകരിക്കാനാകാത്ത ‘കീൽകം’ എന്ന പദം അടിക്കുറിപ്പിൽനിന്ന് നീക്കി, ഗָּפְרִിതിന്റെ അർഥത്തെക്കുറിച്ചുള്ള കൃത്യമായ കുറിപ്പ് നൽകി.
