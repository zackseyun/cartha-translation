reference: Genesis 19:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יהוָ֗ה הִמְטִ֧יר עַל סְדֹ֛ם וְ/עַל עֲמֹרָ֖ה גָּפְרִ֣ית וָ/אֵ֑שׁ מֵ/אֵ֥ת יְהוָ֖ה מִן הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/024.yaml
  text: Then Yahweh rained sulfur and fire on Sodom and Gomorrah from Yahweh out of the heavens[a][b].
translation:
  language: ml
  text: അപ്പോൾ യഹോവ സൊദോമിന്റെയും ഗൊമോറായുടെയുംമേൽ ഗന്ധകവും തീയും യഹോവയുടെ അടുക്കൽനിന്ന് ആകാശത്തുനിന്നു വർഷിപ്പിച്ചു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രായ ഗָּפְרִית എന്ന പദം ഗന്ധകത്തെ സൂചിപ്പിക്കുന്നു. ചില പാരമ്പര്യ ഇംഗ്ലീഷ് പരിഭാഷകളിൽ ഇതിന് ‘brimstone’ എന്നു കാണാം.
    reason: lexical_alternative
  - marker: b
    text: 'ഹീബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ: ‘യഹോവയുടെ അടുക്കൽനിന്ന് ആകാശത്തുനിന്നു.’ മൂലപാഠത്തിൽ ദൈവനാമം ആവർത്തിക്കുന്നതിനാൽ അത് ലളിതമാക്കി ഒഴിവാക്കിയിട്ടില്ല.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ יהוהയെ മലയാളത്തിലെ സുപരിചിതവും മാന്യവുമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു; വാക്യത്തിലെ രണ്ടിടത്തും ഒരേപോലെ വിവർത്തനം ചെയ്യുന്നു.
- source_word: הִמְטִיר
  choice: വർഷിപ്പിച്ചു
  rationale: ഹിഫീൽ രൂപത്തിലെ ‘മഴപോലെ പെയ്യിച്ചു/വർഷിപ്പിച്ചു’ എന്ന കാരകാർഥവും മുകളിൽനിന്നു പതിക്കുന്ന ന്യായവിധിയുടെ ദൃശ്യവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: גָּפְרִית
  choice: ഗന്ധകം
  rationale: ആധുനിക മലയാളത്തിൽ sulfur എന്ന പദാർത്ഥത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്ന സാധാരണ പദം.
- source_word: אֵשׁ
  choice: തീ
  rationale: നേരിട്ടുള്ള സ്വാഭാവിക മലയാള തുല്യപദം; ‘ഗന്ധകം’ എന്നതിനോടൊപ്പം ക്രിയയുടെ രണ്ടാമത്തെ കർമമായി നിലനിർത്തുന്നു.
- source_word: עַל סְדֹם וְעַל עֲמֹרָה
  choice: സൊദോമിന്റെയും ഗൊമോറയുടെയുംമേൽ
  rationale: രണ്ടു നഗരങ്ങളും ന്യായവിധിയുടെ ലക്ഷ്യമാണെന്ന על എന്ന പൂർവപ്രത്യയത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֵאֵת יְהוָה
  choice: യഹോവയുടെ പക്കൽനിന്ന്
  rationale: പ്രവർത്തനത്തിന്റെ ഉറവിടം യഹോവയാണെന്ന മൂലപാഠത്തിലെ അസാധാരണമായ ആവർത്തനം ഒഴിവാക്കാതെ പ്രകടമാക്കുന്നു.
- source_word: מִן הַשָּׁמָיִם
  choice: ആകാശത്തുനിന്നു
  rationale: ഹീബ്രായ ബഹുവചനരൂപം മലയാളത്തിൽ പതിവായി ഏകവചനസമൂഹനാമമായ ‘ആകാശം’കൊണ്ടാണ് സ്വാഭാവികമായി പ്രകടമാകുന്നത്; മുകളിൽനിന്നുള്ള ഉറവിടദൃശ്യം നിലനിൽക്കുന്നു.
- source_word: וַ
  choice: അപ്പോൾ
  rationale: വിവരണത്തിന്റെ തുടർച്ചയും സംഭവക്രമവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘യഹോവ ... യഹോവയുടെ പക്കൽനിന്ന്’ എന്ന ദൈവനാമത്തിന്റെ ആവർത്തനം
  choice: മൂലപാഠത്തിലെ ആവർത്തനം മുഖ്യവാചകത്തിൽ അതേപടി നിലനിർത്തി.
  alternative: ‘യഹോവ ആകാശത്തുനിന്ന് ... വർഷിപ്പിച്ചു’ എന്നു രണ്ടാം ദൈവനാമം ഒഴിവാക്കുക.
  rationale: ഹീബ്രായ പാഠം יהוה എന്ന നാമം വ്യക്തമായി രണ്ടുതവണ ഉപയോഗിക്കുന്നു. ദൈവിക പ്രവർത്തനാധികാരത്തെക്കുറിച്ചുള്ള സാധ്യതയുള്ള വ്യാഖ്യാനപ്രശ്നം വിവർത്തനംകൊണ്ട് പരിഹരിക്കാതെ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ വാക്യഘടന. ദൈവനാമത്തിന്റെ അസാധാരണ ആവർത്തനം മനപ്പൂർവം നിലനിർത്തിയിരിക്കുന്നു. ‘ആകാശത്തുനിന്നു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായ രൂപമാണ്; ഹീബ്രായത്തിലെ വ്യാകരണപരമായ ബഹുവചനം കൃത്രിമമായി ‘ആകാശങ്ങളിൽനിന്ന്’ എന്നു പകർത്തിയിട്ടില്ല.
