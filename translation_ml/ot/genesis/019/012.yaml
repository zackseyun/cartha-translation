id: GEN.19.12
reference: Genesis 19:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ הָ/אֲנָשִׁ֜ים אֶל ל֗וֹט עֹ֚ד מִֽי לְ/ךָ֣ פֹ֔ה חָתָן֙ וּ/בָנֶ֣י/ךָ וּ/בְנֹתֶ֔י/ךָ וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ בָּ/עִ֑יר הוֹצֵ֖א מִן הַ/מָּקֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/012.yaml
  text: Then the men said to Lot[a], “Who else do you have here? A son-in-law, your sons, your daughters[c][b], and everyone who belongs to you in the city—bring them out of the place.”
translation:
  language: ml
  text: 'അപ്പോൾ ആ പുരുഷന്മാർ ലോത്തിനോട് പറഞ്ഞു: “ഇവിടെ നിനക്കു വേറെ ആരുണ്ട്? മരുമകൻ[a], നിന്റെ പുത്രന്മാർ, പുത്രിമാർ, നഗരത്തിൽ നിനക്കുള്ള എല്ലാവരും[b]—അവരെ ഈ സ്ഥലത്തുനിന്ന് പുറത്തുകൊണ്ടുവരിക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വരൻ.” ഇവിടെ ലോത്തിന്റെ പുത്രിമാരുടെ ഭർത്താവിനെയോ വിവാഹനിശ്ചയം കഴിഞ്ഞവനെയോ സൂചിപ്പിക്കുന്ന “മരുമകൻ” എന്ന അർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “നഗരത്തിൽ നിനക്കുള്ള സകലവും.” സന്ദർഭത്തിൽ ഇത് ലോത്തിന്റെ കുടുംബത്തിലോ വീട്ടിലോ ഉൾപ്പെട്ട നഗരത്തിലുള്ള എല്ലാവരെയും സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാർ
  rationale: എബ്രായപദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘പുരുഷന്മാർ’ എന്നാണ്. സന്ദർഭം അവരെ ദൂതന്മാരായി തിരിച്ചറിയുന്നുണ്ടെങ്കിലും, ഈ വാക്യത്തിൽ അതു ചേർക്കാതെ മൂലപദം നിലനിർത്തുന്നു.
- source_word: עֹד מִי לְךָ פֹה
  choice: ഇവിടെ നിനക്കു വേറെ ആരുണ്ട്?
  rationale: ലോത്തിനോടു ബന്ധമുള്ള വേറെ ആരെങ്കിലും അവിടെ ഉണ്ടോ എന്നു ചോദിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: חָתָן
  choice: മരുമകൻ
  rationale: ഈ സന്ദർഭത്തിൽ ലോത്തിന്റെ പുത്രിമാരുടെ വിവാഹനിശ്ചയം കഴിഞ്ഞവനെയോ ഭർത്താവിനെയോ സൂചിപ്പിക്കുന്ന ബന്ധപദമായാണ് ഏറ്റവും സ്വാഭാവികം; എബ്രായത്തിലെ ഏകവചനരൂപവും നിലനിർത്തുന്നു.
- source_word: וּבָנֶיךָ וּבְנֹתֶיךָ
  choice: നിന്റെ പുത്രന്മാർ, പുത്രിമാർ
  rationale: ഉടമസ്ഥതയും ബഹുവചനവും വ്യക്തമായി നിലനിർത്തുന്ന, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ രൂപം.
- source_word: וְכֹל אֲשֶׁר לְךָ בָּעִיר
  choice: നഗരത്തിൽ നിനക്കുള്ള എല്ലാവരും
  rationale: പദാനുപദമായി ‘നഗരത്തിൽ നിനക്കുള്ള സകലവും’ എന്നു വരാമെങ്കിലും, പുറത്തുകൊണ്ടുപോകേണ്ട ആളുകളുടെ പട്ടികയായതിനാൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന അർഥം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הוֹצֵא מִן הַמָּקוֹם
  choice: അവരെ ഈ സ്ഥലത്തുനിന്ന് പുറത്തുകൊണ്ടുവരിക
  rationale: ഏകവചന പുരുഷലിംഗ ആജ്ഞ ലോത്തിനോടാണ്. മലയാളത്തിൽ ആവശ്യമായ കർമം മുൻപുള്ള ആളുകളുടെ പട്ടികയിൽനിന്ന് ‘അവരെ’ എന്നു വ്യക്തമാക്കുന്നു; ‘ഈ’ എന്നത് സന്ദർഭത്തിൽ വ്യക്തമായ സ്ഥലസൂചന സ്വാഭാവികമാക്കുന്നു.
theological_decisions:
- issue: הָאֲנָשִׁים എന്ന പദത്തെ മുഖ്യവാചകത്തിൽ ദൂതന്മാർ എന്നു തിരിച്ചറിയണമോ
  choice: ആ പുരുഷന്മാർ
  alternative: ആ ദൂതന്മാർ / ആ സന്ദേശവാഹകർ
  rationale: വിപുലമായ ആഖ്യാനം അവരുടെ ദൂതസ്വഭാവം വെളിപ്പെടുത്തുന്നുണ്ടെങ്കിലും ഈ വാക്യം സാധാരണ ‘പുരുഷന്മാർ’ എന്ന പദമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ വ്യാഖ്യാനപരമായ തിരിച്ചറിയൽ മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- issue: חָתָן എന്ന പദത്തിന്റെ കുടുംബബന്ധസൂചന
  choice: മരുമകൻ
  alternative: വരൻ
  rationale: പദത്തിന് ‘വരൻ’ എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ ലോത്തിന്റെ പുത്രിമാരുമായി വിവാഹബന്ധത്തിലോ വിവാഹനിശ്ചയത്തിലോ ഉള്ള പുരുഷനെ കുടുംബബന്ധത്തിന്റെ നിലയിൽ സൂചിപ്പിക്കുന്ന ‘മരുമകൻ’ കൂടുതൽ അനുയോജ്യം. സാധ്യതയുള്ള മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പുരുഷന്മാർ’ എന്നത് മൂലപദത്തിന്റെ സാധാരണ അർഥം സംരക്ഷിക്കുന്നു; ‘പുത്രന്മാർ, പുത്രിമാർ’ എന്ന രൂപങ്ങൾ ബൈബിൾവായനയ്ക്ക് യോജിച്ച ഗൗരവം നൽകുമ്പോഴും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
