- from: “ഇതാ, പുരുഷനുമായി ബന്ധം പുലർത്തിയിട്ടില്ലാത്ത രണ്ടു പുത്രിമാർ എനിക്കുണ്ട്.[a] ദയവായി അവരെ നിങ്ങളുടെ അടുക്കൽ പുറത്തുകൊണ്ടുവരാൻ എന്നെ അനുവദിക്കൂ. നിങ്ങളുടെ കണ്ണിൽ നല്ലതെന്നു തോന്നുന്നതുപോലെ അവരോടു ചെയ്തുകൊള്ളൂ. എന്നാൽ ഈ പുരുഷന്മാരോട് ഒന്നും ചെയ്യരുത്; കാരണം അവർ എന്റെ മേൽക്കൂരയുടെ നിഴലിൽ അഭയം തേടി വന്നവരാണ്.”[b]
