  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִנֵּה נָ֨א לִ֜/י שְׁתֵּ֣י בָנ֗וֹת אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ אִ֔ישׁ אוֹצִֽיאָה נָּ֤א אֶתְ/הֶן֙ אֲלֵי/כֶ֔ם וַ/עֲשׂ֣וּ לָ/הֶ֔ן כַּ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם רַ֠ק לָֽ/אֲנָשִׁ֤ים הָ/אֵל֙ אַל תַּעֲשׂ֣וּ דָבָ֔ר כִּֽי עַל כֵּ֥ן בָּ֖אוּ בְּ/צֵ֥ל קֹרָתִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/008.yaml
  text: Look[a], please, I have two daughters who have not known a man. Please let me bring them out to you, and do to them as is good in your eyes. Only to these men do nothing[c][b], for they have come under the shadow of my roof.
translation:
  language: ml
  text: “ഇതാ, ഒരു പുരുഷനുമായി ലൈംഗികബന്ധം പുലർത്തിയിട്ടില്ലാത്ത രണ്ടു പുത്രിമാർ എനിക്കുണ്ട്.[a] ദയവായി, അവരെ പുറത്തേക്കു നിങ്ങളുടെ അടുത്തേക്കു കൊണ്ടുവരാൻ എന്നെ അനുവദിക്കൂ. നിങ്ങളുടെ കണ്ണിൽ നല്ലതെന്നു തോന്നുന്നതുപോലെ അവരോടു ചെയ്തുകൊള്ളൂ. ഈ പുരുഷന്മാരോടു മാത്രം ഒന്നും ചെയ്യരുത്; കാരണം അവർ എന്റെ മേൽക്കൂരയുടെ നിഴലിൽ വന്നിരിക്കുന്നു.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഒരു പുരുഷനെ അറിഞ്ഞിട്ടില്ലാത്ത”; ഇവിടെ “അറിയുക” എന്നത് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്. പരമ്പരാഗതമായി, “കന്യകകളായ.”
    reason: lexical_alternative
  - marker: b
    text: “എന്റെ മേൽക്കൂരയുടെ നിഴലിൽ” എന്നത് തന്റെ വീട്ടിൽ വന്ന അതിഥികൾക്ക് ആതിഥേയൻ നൽകേണ്ട സംരക്ഷണത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: ഇതാ
  rationale: הִנֵּהയുടെ അടിയന്തരമായി ശ്രദ്ധ ക്ഷണിക്കുന്ന ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; נָאയുടെ അപേക്ഷാഭാവം തുടർന്നുള്ള ‘ദയവായി’യിലൂടെ വ്യക്തമായി പ്രകടമാകുന്നു.
- source_word: שְׁתֵּי בָנוֹת
  choice: രണ്ടു പുത്രിമാർ
  rationale: മൂലത്തിലെ ലളിതമായ നാമപദപ്രയോഗം മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לֹא יָדְעוּ אִישׁ
  choice: പുരുഷനുമായി ബന്ധം പുലർത്തിയിട്ടില്ലാത്ത
  rationale: יָדַע ഇവിടെ ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്. മലയാളത്തിൽ ‘അറിഞ്ഞിട്ടില്ലാത്ത’ എന്നു പദാനുപദമായി നൽകിയാൽ അർഥം അസ്പഷ്ടമാകുന്നതിനാൽ, സൂചന വ്യക്തമാക്കുകയും അതേസമയം അനാവശ്യമായ ദൃശ്യവൽക്കരണം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: אוֹצִיאָה נָּא אֶתְהֶן אֲלֵיכֶם
  choice: ദയവായി അവരെ നിങ്ങളുടെ അടുക്കൽ പുറത്തുകൊണ്ടുവരാൻ എന്നെ അനുവദിക്കൂ
  rationale: cohortative രൂപത്തിലെ സന്നദ്ധത/അനുമതിയാചനയും נָאയുടെ അപേക്ഷാഭാവവും സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: וַעֲשׂוּ לָהֶן כַּטּוֹב בְּעֵינֵיכֶם
  choice: നിങ്ങളുടെ കണ്ണിൽ നല്ലതെന്നു തോന്നുന്നതുപോലെ അവരോടു ചെയ്തുകൊള്ളൂ
  rationale: ‘കണ്ണിൽ നല്ലത്’ എന്ന എബ്രായ രൂപകം നിലനിർത്തി, വാക്കുകളുടെ ഞെട്ടിക്കുന്ന ശക്തി മയപ്പെടുത്താതെ വായനാസൗകര്യം നൽകുന്നു.
- source_word: רַק לָאֲנָשִׁים הָאֵל אַל תַּעֲשׂוּ דָבָר
  choice: എന്നാൽ ഈ പുരുഷന്മാരോട് ഒന്നും ചെയ്യരുത്
  rationale: רַק സൂചിപ്പിക്കുന്ന ശക്തമായ ഒഴിവാക്കൽ/വിരുദ്ധത മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ‘ഒന്നും ചെയ്യരുത്’ സമ്പൂർണ വിലക്ക് നിലനിർത്തുന്നു.
- source_word: כִּי עַל כֵּן בָּאוּ
  choice: കാരണം അവർ ... അഭയം തേടി വന്നവരാണ്
  rationale: ലോത്തിന്റെ അതിഥിസംരക്ഷണബാധ്യതയുമായി ബന്ധമുള്ള കാരണാർഥം വ്യക്തമായി നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ധാർമിക അംഗീകാരം ചേർക്കുന്നില്ല.
- source_word: בְּצֵל קֹרָתִי
  choice: എന്റെ മേൽക്കൂരയുടെ നിഴലിൽ
  rationale: ‘മേൽക്കൂരയുടെ നിഴൽ’ എന്ന മൂലചിത്രം സംരക്ഷിക്കുന്നു; അതിഥികൾ വീട്ടുടമയുടെ സംരക്ഷണത്തിൽ വന്നിരിക്കുന്നു എന്ന സാംസ്കാരിക അർഥം കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
theological_decisions:
- issue: ലോത്തിന്റെ ഞെട്ടിക്കുന്ന നിർദേശം ധാർമിക വായനാസൗകര്യത്തിനായി മയപ്പെടുത്തണമോ
  choice: എബ്രായപാഠത്തിന്റെ നേരിട്ടുള്ളതും അസ്വസ്ഥമാക്കുന്നതുമായ ശക്തി മയപ്പെടുത്താതെ നിലനിർത്തുക
  alternative: ‘അവരോട് നിങ്ങൾക്കിഷ്ടമുള്ളപോലെ പെരുമാറുക’ എന്നിങ്ങനെ കൂടുതൽ മൃദുവാക്കുക
  rationale: പാഠം ലോത്തിന്റെ പ്രവൃത്തിയെ അംഗീകരിക്കുന്നുവെന്ന് വിവർത്തനം സൂചിപ്പിക്കരുത്; അതുപോലെ അതിന്റെ കഠിനതയും മറച്ചുവയ്ക്കരുത്. മൂലഭാഷയുടെ ശക്തിയും ധാർമിക സംഘർഷവും അതേപടി നിലനിർത്തുന്നു.
- issue: כִּי עַל כֵּן എന്നതിന്റെ കാരണബന്ധം എങ്ങനെ അവതരിപ്പിക്കണം
  choice: അതിഥികൾ അവന്റെ മേൽക്കൂരയുടെ സംരക്ഷണത്തിൽ അഭയം തേടി വന്നതാണ് വിലക്കിന്റെ കാരണം എന്നു പ്രകടിപ്പിക്കുക
  alternative: ‘ഇതിനായിട്ടാണ് അവർ വന്നത്’ എന്ന പദാനുപദ രൂപം
  rationale: പദാനുപദ രൂപം മലയാളത്തിൽ തെറ്റായ കാരണാർഥം സൃഷ്ടിക്കാം. സന്ദർഭം ആവശ്യപ്പെടുന്ന അതിഥിസംരക്ഷണബന്ധം നൽകുന്നു; കൂടുതൽ ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ ഗദ്യശൈലി. ‘ഇതാ’, ‘ദയവായി’, ‘ചെയ്തുകൊള്ളൂ’ എന്നിവ ലോത്തിന്റെ അടിയന്തര അപേക്ഷാഭാവം നിലനിർത്തുന്നു. ലൈംഗിക സൂചന വ്യക്തമായി അറിയിച്ചിട്ടുണ്ടെങ്കിലും അനാവശ്യമായി ദൃശ്യവൽക്കരിച്ചിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
