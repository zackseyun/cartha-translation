id: GEN.19.27
reference: Genesis 19:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֥ם אַבְרָהָ֖ם בַּ/בֹּ֑קֶר אֶל הַ֨/מָּק֔וֹם אֲשֶׁר עָ֥מַד שָׁ֖ם אֶת פְּנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/027.yaml
  text: Abraham rose early in the morning to the place where he had stood before Yahweh[a].
translation:
  language: ml
  text: അബ്രാഹാം അതിരാവിലെ എഴുന്നേറ്റ്, താൻ യഹ്‌വേയുടെ സന്നിധിയിൽ[a] നിന്നിരുന്ന സ്ഥലത്തേക്കു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായയിൽ അക്ഷരാർഥം: “യഹ്‌വേയുടെ മുഖത്തിനു മുമ്പിൽ”; അതായത്, “യഹ്‌വേയുടെ മുമ്പിൽ” അല്ലെങ്കിൽ “യഹ്‌വേയുടെ സാന്നിധ്യത്തിൽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: שׁכם എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം സാധാരണയായി ‘നേരത്തേ എഴുന്നേൽക്കുക’ എന്നാണ് അർഥമാക്കുന്നത്. തുടർന്നുള്ള בַּבֹּקֶר ചേർന്ന് പ്രവൃത്തി അതിരാവിലെയാണെന്ന ഊന്നൽ നൽകുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ഇങ്ങനെ ചേർത്തു പരിഭാഷപ്പെടുത്തി.
- source_word: בַּבֹּקֶר
  choice: അതിരാവിലെ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘രാവിലെ’ എന്നാണെങ്കിലും וַיַּשְׁכֵּם എന്ന ക്രിയയോടൊപ്പം വരുന്നതിനാൽ ‘അതിരാവിലെ’ എന്ന പ്രയോഗം സമയസൂചനയും നേരത്തേയെന്ന ഊന്നലും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶל הַמָּקוֹם
  choice: സ്ഥലത്തേക്കു പോയി
  rationale: מָקוֹם എന്നത് സാധാരണ ‘സ്ഥലം’ എന്നാണ്. אֶל ദിശ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വാക്യം പൂർണമാകാൻ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന സഞ്ചാരാർഥം ‘പോയി’ എന്നു വ്യക്തമാക്കി.
- source_word: אֲשֶׁר עָמַד שָׁם
  choice: താൻ … നിന്നിരുന്ന
  rationale: ഈ ബന്ധവാക്യം മുമ്പ് നടന്ന സംഭവത്തിലേക്കാണ് തിരിഞ്ഞുനോക്കുന്നത്. שָׁם എന്ന ‘അവിടെ’ എന്ന ആശയം ‘സ്ഥലം’ എന്ന മുൻപദത്തോടു ബന്ധിപ്പിക്കുന്ന മലയാള ഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; ആവർത്തനം ഒഴിവാക്കാൻ വേറെ പദമായി നൽകിയിട്ടില്ല.
- source_word: אֶת־פְּנֵי
  choice: സന്നിധിയിൽ
  rationale: ‘മുഖത്തിന്റെ മുമ്പിൽ’ എന്ന അക്ഷരാർഥമുള്ള ഈ എബ്രായ പ്രയോഗം ഒരാളുടെ മുമ്പിൽ അഥവാ സാന്നിധ്യത്തിൽ നിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സന്നിധിയിൽ’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തുല്യപ്രയോഗമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരം നേരിട്ട് വരുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം നിലനിർത്തി. ‘യഹ്‌വേ’ എന്ന രൂപം സാധ്യതയേറിയ ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: אֶת־פְּנֵי יְהוָה എന്ന പ്രയോഗം
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  alternative: യഹ്‌വേയുടെ മുഖത്തിനു മുമ്പിൽ
  rationale: ഇത് ദൈവസാന്നിധ്യത്തിൽ നിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ഭാഷാശൈലിയാണ്. അക്ഷരാർഥം മുഖ്യപാഠത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ ആശയം വ്യക്തമായി നൽകി; രൂപകത്തിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായ വാക്യത്തിൽ ദിശാസൂചക ഘടനയിലൂടെ ഉൾക്കൊള്ളുന്ന സഞ്ചാരം മലയാളത്തിൽ വാക്യപൂർണതയ്ക്കായി ‘പോയി’ എന്നു വ്യക്തമാക്കി. ദൈവനാമം സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരിച്ചു.
