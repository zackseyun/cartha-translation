  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֤לֶד הַ/בְּכִירָה֙ בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ מוֹאָ֑ב ה֥וּא אֲבִֽי מוֹאָ֖ב עַד הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/037.yaml
  text: The firstborn bore a son and called his name Moab[a]; he is the father of Moab to this day.
translation:
  language: ml
  text: മൂത്തവൾ ഒരു മകനെ പ്രസവിച്ചു; അവന് മോവാബ് എന്നു പേരിട്ടു. അവൻ ഇന്നുവരെ മോവാബിന്റെ പിതാവാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഇന്നുവരെ മോവാബ്യരുടെ പിതാവ്.” എബ്രായത്തിൽ അക്ഷരാർഥം “മോവാബിന്റെ പിതാവ്” എന്നാണ്; അവനിൽനിന്ന് ഉത്ഭവിച്ച ജനതയെ സൂചിപ്പിക്കാൻ പൂർവികന്റെ പേരാണ് ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: പ്രസവിച്ചു
  rationale: Qal രൂപത്തിലുള്ള ילד ഇവിടെ ഒരു മകനെ പ്രസവിക്കുക എന്ന സാധാരണ അർഥത്തിലാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הַבְּכִירָה
  choice: മൂത്തവൾ
  rationale: സ്ത്രീലിംഗ ഏകവചനത്തിലുള്ള പദം സന്ദർഭത്തിൽ ലോത്തിന്റെ മൂത്ത മകളെ സൂചിപ്പിക്കുന്നു; മുൻസന്ദർഭം ഉള്ളതിനാൽ ‘മൂത്തവൾ’ സംക്ഷിപ്തവും വ്യക്തവുമാണ്.
- source_word: בֵּן
  choice: ഒരു മകൻ
  rationale: പ്രസവക്രിയയുടെ നേരിട്ടുള്ള കർമം; അനിശ്ചിതത്വം മലയാളത്തിൽ ‘ഒരു’ കൊണ്ട് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: അവന് ... എന്നു പേരിട്ടു
  rationale: അക്ഷരാർഥം ‘അവന്റെ പേര് വിളിച്ചു’ എന്നാണെങ്കിലും, പേരിടൽ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാള തുല്യം ഇതാണ്.
- source_word: מוֹאָב
  choice: മോവാബ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הוּא
  choice: അവനാണ്
  rationale: സ്വതന്ത്ര സർവനാമം ഇപ്പോൾ പേരിട്ട മകനെ വീണ്ടും ചൂണ്ടിക്കാണിക്കുകയും വാക്യത്തിൽ ഊന്നൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: אֲבִי מוֹאָב
  choice: മോവാബ്യരുടെ പിതാവ്
  rationale: അക്ഷരാർഥം ‘മോവാബിന്റെ പിതാവ്’; ഇവിടെ പൂർവികന്റെ പേര് അവനിൽനിന്ന് ഉത്ഭവിച്ച ജനതയ്ക്കായി ഉപയോഗിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് ഉദ്ദേശ്യം വ്യക്തമാകാൻ ജനവിഭാഗാർഥം മുഖ്യപാഠത്തിൽ നൽകി.
- source_word: עַד הַיּוֹם
  choice: ഇന്നുവരെയുള്ള
  rationale: വിവരിച്ച ബന്ധം ആഖ്യാതാവിന്റെ കാലംവരെ നിലനിൽക്കുന്നതായി സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യത്തിന്റെ ക്രമവും ഊന്നലും സാധ്യമായത്ര നിലനിർത്തിക്കൊണ്ട്, ‘പേരിട്ടു’ പോലുള്ള സ്വാഭാവിക മലയാള പ്രയോഗങ്ങൾ സ്വീകരിച്ചു. ‘മോവാബ്’ എന്നതിലെ വ്യക്തി/ജനത ദ്വയാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
