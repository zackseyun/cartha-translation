id: GEN.19.18
reference: Genesis 19:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר ל֖וֹט אֲלֵ/הֶ֑ם אַל נָ֖א אֲדֹנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/018.yaml
  text: But Lot said to them[a], “No, please, my lords.”
translation:
  language: ml
  text: 'എന്നാൽ ലോത്ത് അവരോട്[a] പറഞ്ഞു: “അല്ല, ദയവായി, എന്റെ യജമാനന്മാരേ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അല്ല, ദയവായി, എന്റെ യജമാനനേ!” എബ്രായത്തിലെ אֲדֹנָי എന്ന രൂപം ചില വായനകളിൽ ആദരസൂചകമായ ഏകവചന സംബോധനയായി മനസ്സിലാക്കാം; എന്നാൽ ‘അവരോട്’ എന്ന ബഹുവചന സന്ദർഭം ഇവിടെ “എന്റെ യജമാനന്മാരേ” എന്ന വായനയെ അനുകൂലിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാഘടകം ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മുൻ നിർദേശത്തോടുള്ള ലോത്തിന്റെ എതിർപ്രതികരണം സന്ദർഭത്തിൽ വ്യക്തമാക്കാൻ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: לוֹט
  choice: ലോത്ത്
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രീതിയിൽ വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: אֲלֵהֶם
  choice: അവരോട്
  rationale: אֶל എന്ന പൂർവപ്രത്യയവും മൂന്നാംപുരുഷ ബഹുവചന പ്രത്യയവും ചേർന്ന് നേരിട്ട് ‘അവരോട്’ എന്നർഥം നൽകുന്നു; സന്ദർശകരെന്ന സൂചന മുഖ്യപാഠത്തിൽ വിശദീകരിച്ചിട്ടില്ല.
- source_word: אַל
  choice: അരുതേ
  rationale: ക്രിയയില്ലാത്ത ഈ അപേക്ഷയിൽ മുൻ നിർദേശം നിരസിക്കുന്ന ശക്തമായ വിലക്കായി പ്രവർത്തിക്കുന്നു. ‘അരുതേ’ അപേക്ഷാഭാവത്തോടുകൂടിയ നിരാകരണം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נָא
  choice: ദയവായി
  rationale: അപേക്ഷയുടെയും വിനയത്തിന്റെയും ഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אֲדֹנָי
  choice: എന്റെ യജമാനന്മാരേ
  rationale: ‘അവരോട്’ എന്ന ബഹുവചന സന്ദർഭവും രണ്ടു സന്ദർശകരെന്ന ഉടൻസന്ദർഭവും കണക്കിലെടുത്ത് ബഹുവചന സംബോധന സ്വീകരിച്ചു; אֲדוֹן എന്ന പദത്തിന്റെ അർഥഘടകവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: אֲדֹנָי എന്നത് ദൈവികമായ ഏകവചന സംബോധനയാണോ, സന്ദർശകരോടുള്ള ബഹുവചന സംബോധനയാണോ
  choice: 'സന്ദർശകരോടുള്ള ബഹുവചന സംബോധന: ‘എന്റെ യജമാനന്മാരേ’'
  alternative: ‘എന്റെ കർത്താവേ’
  rationale: אֲלֵהֶם (‘അവരോട്’) എന്ന ബഹുവചനവും രണ്ടു സന്ദർശകരെ അഭിസംബോധന ചെയ്യുന്ന ഉടൻസന്ദർഭവും ബഹുവചന വായനയെ അനുകൂലിക്കുന്നു. എങ്കിലും രൂപത്തിന് ഏകവചന ആദരസംബോധനയായോ ദൈവിക ശീർഷകമായോ ഉള്ള വായനാസാധ്യത പൂർണമായി ഇല്ലാതാകാത്തതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അരുതേ, ദയവായി’ എന്ന ഇരട്ട പ്രയോഗം אַל נָא യിലെ നിരാകരണവും അപേക്ഷാഭാവവും വേർതിരിച്ചു നിലനിർത്തുന്നു; സംബോധനയിലെ യഥാർഥ ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
