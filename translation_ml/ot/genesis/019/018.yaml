revisions:
- from: 'എന്നാൽ ലോത്ത് അവരോട്[a] പറഞ്ഞു: “അരുതേ, ദയവായി, എന്റെ യജമാനന്മാരേ!”'
  to: 'എന്നാൽ ലോത്ത് അവരോട്[a] പറഞ്ഞു: “അല്ല, ദയവായി, എന്റെ യജമാനന്മാരേ!”'
  rationale: The revision removes the added prohibitive nuance of “അരുതേ” and translates the Hebrew refusal directly as “അല്ല.” It also adjusts the footnote’s singular alternative to a non-doctrinal respectful equivalent, while preserving the textual ambiguity and the plural reading favored by the immediate context.
