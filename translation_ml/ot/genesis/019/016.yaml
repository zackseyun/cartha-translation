- from: എന്നാൽ അവൻ താമസിച്ചുനിന്നു. യഹോവയ്ക്ക് അവനോടു കരുണ തോന്നിയതിനാൽ ആ പുരുഷന്മാർ[a] അവന്റെ കൈയിലും ഭാര്യയുടെ കൈയിലും രണ്ടു പുത്രിമാരുടെ കൈകളിലും മുറുകെപ്പിടിച്ചു; അവർ അവനെ പുറത്തുകൊണ്ടുവന്ന് നഗരത്തിനു വെളിയിൽ നിർത്തി.
  to: എന്നാൽ അവൻ താമസിച്ചുനിന്നു. യഹോവ അവനോടു കരുണ കാണിച്ചതിനാൽ, ആ പുരുഷന്മാർ[a] അവന്റെ കൈയും അവന്റെ ഭാര്യയുടെ കൈയും അവന്റെ രണ്ടു പുത്രിമാരുടെ കൈകളും മുറുകെ പിടിച്ചു; അവർ അവനെ പുറത്തേക്കു കൊണ്ടുവന്ന് നഗരത്തിനു വെളിയിൽ നിർത്തി.
  rationale: കൈകളുടെ പട്ടികയെ സ്ഥലവിഭക്തിയിൽനിന്ന് നേരിട്ടുള്ള കർമരൂപത്തിലേക്കു മാറ്റി. ഇതിലൂടെ പുരുഷന്മാർ ലോത്തിന്റെയും ഭാര്യയുടെയും രണ്ടു പുത്രിമാരുടെയും കൈകൾ മുറുകെ പിടിച്ചു എന്ന മൂലപാഠത്തിലെ പ്രവൃത്തി വ്യക്തമായി നിലനിർത്തുന്നു. ‘യഹോവ അവനോടു കരുണ കാണിച്ചതിനാൽ’ എന്ന രൂപം ദൈവിക കരുണയുടെ കാരണബന്ധം കൂടുതൽ നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു; അർഥത്തിൽ മാറ്റമില്ല.
