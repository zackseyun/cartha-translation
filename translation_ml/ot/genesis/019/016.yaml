source:
  edition: WLC
  text: וַֽ/יִּתְמַהְמָ֓הּ וַ/יַּחֲזִ֨קוּ הָ/אֲנָשִׁ֜ים בְּ/יָד֣/וֹ וּ/בְ/יַד אִשְׁתּ֗/וֹ וּ/בְ/יַד֙ שְׁתֵּ֣י בְנֹתָ֔י/ו בְּ/חֶמְלַ֥ת יְהוָ֖ה עָלָ֑י/ו וַ/יֹּצִאֻ֥/הוּ וַ/יַּנִּחֻ֖/הוּ מִ/ח֥וּץ לָ/עִֽיר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/016.yaml
  text: But he lingered[a], so the men seized his hand, his wife’s hand, and the hands of his two daughters, because of Yahweh’s compassion for him[b]; and they brought him out and set him outside the city.
translation:
  language: ml
  text: എന്നാൽ അവൻ താമസിച്ചുനിന്നു. യഹോവ അവനോടു കരുണ കാണിച്ചതിനാൽ, ആ പുരുഷന്മാർ[a] അവന്റെ കൈയും അവന്റെ ഭാര്യയുടെ കൈയും അവന്റെ രണ്ടു പുത്രിമാരുടെ കൈകളും മുറുകെ പിടിച്ചു; അവർ അവനെ പുറത്തേക്കു കൊണ്ടുവന്ന് നഗരത്തിനു വെളിയിൽ നിർത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സന്ദർഭത്തിൽ ഇവർ ദൂതന്മാരാണ്; എബ്രായപാഠം ഇവിടെ അവരെ ‘പുരുഷന്മാർ’ എന്നു വിളിക്കുന്നു.
    reason: contextual_identification
lexical_decisions:
- source_word: וַיִּתְמַהְמָהּ
  choice: താമസിച്ചുനിന്നു
  rationale: ക്രിയ സൂചിപ്പിക്കുന്നത് വെറും മാനസിക സംശയത്തേക്കാൾ, അടിയന്തരമായി പുറപ്പെടേണ്ട സമയത്ത് വൈകിയതിനെയാണ്. ‘താമസിച്ചുനിന്നു’ എന്നത് ആ നീണ്ടുനിൽപ്പും കഥയിലെ അടിയന്തരതയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാർ
  rationale: ഈ വാക്യത്തിലെ എബ്രായ പദം സാധാരണയായി ‘പുരുഷന്മാർ’ എന്നാണ്. സന്ദർഭത്തിൽ അവർ ദൂതന്മാരാണെങ്കിലും, മുഖ്യപാഠം വാക്യത്തിന്റെ നേരിട്ടുള്ള വിശേഷണം നിലനിർത്തുന്നു.
- source_word: וַיַּחֲזִקוּ
  choice: മുറുകെപ്പിടിച്ചു
  rationale: ഈ ഘടനയിലെ חזק ഉറച്ചുപിടിക്കുന്ന രക്ഷാപ്രവർത്തനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മുറുകെപ്പിടിച്ചു’ ബലവും അടിയന്തരതയും വ്യക്തമാക്കുന്നു.
- source_word: בְּיָדוֹ ... וּבְיַד אִשְׁתּוֹ ... וּבְיַד שְׁתֵּי בְנֹתָיו
  choice: അവന്റെ കൈയിലും ഭാര്യയുടെ കൈയിലും രണ്ടു പുത്രിമാരുടെ കൈകളിലും
  rationale: എബ്രായത്തിലെ ‘കൈ’ എന്ന പദത്തിന്റെ ആവർത്തനം പരമാവധി നിലനിർത്തിക്കൊണ്ട്, രണ്ടു പുത്രിമാരെയും കൈപിടിച്ചു കൊണ്ടുപോയെന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּחֶמְלַת יְהוָה עָלָיו
  choice: യഹോവയ്ക്ക് അവനോടു കരുണ തോന്നിയതിനാൽ
  rationale: חמלה കരുണയെയോ അനുകമ്പയെയോ സൂചിപ്പിക്കുന്നു; ב ഇവിടെ കാരണബന്ധം അറിയിക്കുന്നു. ഈ രൂപം ദൈവിക കരുണയാണ് രക്ഷാപ്രവർത്തനത്തിന്റെ കാരണമെന്ന് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ നാമരൂപത്തിൽ പ്രതിനിധീകരിക്കുന്നു.
- source_word: וַיֹּצִאֻהוּ
  choice: അവനെ പുറത്തുകൊണ്ടുവന്ന്
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഒരാളെ പുറത്തേക്കു കൊണ്ടുവരുക എന്ന കാരണാർത്ഥം നൽകുന്നു.
- source_word: וַיַּנִּחֻהוּ
  choice: നിർത്തി
  rationale: ഇവിടെ נוח എന്നതിന്റെ ഹിഫീൽ രൂപം നിർദിഷ്ട സ്ഥലത്ത് ഒരാളെ എത്തിച്ച് നിർത്തുക എന്ന ആശയം നൽകുന്നു; ഉപേക്ഷിച്ചു എന്ന അനാവശ്യ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: מִחוּץ לָעִיר
  choice: നഗരത്തിനു വെളിയിൽ
  rationale: നഗരപരിധിക്കു പുറത്തുള്ള സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: രക്ഷകരുടെ കഥനപരമായ തിരിച്ചറിയൽ
  choice: ആ പുരുഷന്മാർ
  alternative: ദൂതന്മാർ
  rationale: വിശാലസന്ദർഭം ഇവരെ ദൂതന്മാരായി തിരിച്ചറിയുന്നുവെങ്കിലും ഈ വാക്യം അവരെ ‘പുരുഷന്മാർ’ എന്നാണ് വിളിക്കുന്നത്. വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ മൂലപാഠത്തിന്റെ കഥനരീതി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ‘മുറുകെപ്പിടിച്ചു’ എന്ന പ്രയോഗം രക്ഷാപ്രവർത്തനത്തിന്റെ അടിയന്തരത നിലനിർത്തുന്നു; വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ട് ഭാഗങ്ങളാക്കി.
