id: GEN.19.17
reference: Genesis 19:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי֩ כְ/הוֹצִיאָ֨/ם אֹתָ֜/ם הַ/ח֗וּצָ/ה וַ/יֹּ֨אמֶר֙ הִמָּלֵ֣ט עַל נַפְשֶׁ֔/ךָ אַל תַּבִּ֣יט אַחֲרֶ֔י/ךָ וְ/אַֽל תַּעֲמֹ֖ד בְּ/כָל הַ/כִּכָּ֑ר הָ/הָ֥רָ/ה הִמָּלֵ֖ט פֶּן תִּסָּפֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/017.yaml
  text: And as they brought them outside[a], he said, “Escape for your life. Do not look behind you, and do not stop anywhere in the plain. Escape to the hills[c][b], lest you be swept away.”
translation:
  language: ml
  text: 'അവർ അവരെ പുറത്തേക്കു കൊണ്ടുവന്നപ്പോൾ, അവൻ പറഞ്ഞു: “ജീവൻ രക്ഷിക്കാൻ ഓടിപ്പോകുക. പിന്നിലേക്കു നോക്കരുത്[a]; സമതലത്തിൽ എവിടെയും നിൽക്കരുത്. മലനാട്ടിലേക്ക് ഓടിപ്പോകുക[b]; നീ നശിച്ചുപോകാതിരിക്കാൻ[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തിരിഞ്ഞുനോക്കരുത്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “മലയിലേക്ക്” അല്ലെങ്കിൽ “മലപ്രദേശത്തേക്ക്.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “നീ തുടച്ചുനീക്കപ്പെടാതിരിക്കാൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוּצָה
  choice: പുറത്തേക്ക്
  rationale: നഗരത്തിന്റെയോ അകത്തളത്തിന്റെയോ പുറത്തേക്കുള്ള ദിശ സൂചിപ്പിക്കുന്ന രൂപം; ആ ചലനം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הִמָּלֵט
  choice: ഓടിപ്പോകുക
  rationale: അടിയന്തരമായി രക്ഷപ്പെടുക എന്ന ആജ്ഞാസ്വരം നൽകുന്നു; രണ്ടു പ്രാവശ്യവും ഒരേ പ്രയോഗം നിലനിർത്തി ആവർത്തനത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: עַל נַפְשֶׁךָ
  choice: ജീവൻ രക്ഷിക്കാൻ
  rationale: സ്വന്തം ജീവൻ രക്ഷിക്കണമെന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: אַל תַּבִּיט אַחֲרֶיךָ
  choice: പിന്നിലേക്കു നോക്കരുത്
  rationale: സ്വന്തം പിന്നിലേക്കു നോക്കരുതെന്ന സ്ഥലപരമായ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְאַל תַּעֲמֹד
  choice: നിൽക്കരുത്
  rationale: ഈ രക്ഷപ്പെടൽസന്ദർഭത്തിൽ യാത്ര നിർത്തുകയോ അവിടെ തങ്ങുകയോ ചെയ്യരുതെന്ന മുന്നറിയിപ്പ്; മലയാളത്തിൽ ചുരുക്കവും സ്വാഭാവികവുമാണ്.
- source_word: בְּכָל הַכִּכָּר
  choice: സമതലത്തിൽ എവിടെയും
  rationale: כִּכָּר സൂചിപ്പിക്കുന്ന സമതലപ്രദേശവും בְּכָל എന്നതിന്റെ ‘ഒരിടത്തും’ എന്ന വ്യാപകബലവും സംരക്ഷിക്കുന്നു.
- source_word: הָהָרָה
  choice: മലനാട്ടിലേക്ക്
  rationale: സമതലത്തിനു വിരുദ്ധമായ ഉയർന്ന മലപ്രദേശത്തേക്കുള്ള ദിശ വ്യക്തമാക്കുന്നു; ഏകമലയെന്നോ പല മലകളെന്നോ നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
- source_word: פֶּן תִּסָּפֶה
  choice: നീ നശിച്ചുപോകാതിരിക്കാൻ അങ്ങനെ ചെയ്യുക
  rationale: വരാനിരിക്കുന്ന ദുരന്തത്തിൽ അകപ്പെട്ടു നശിക്കാനുള്ള സാധ്യതയും മുന്നറിയിപ്പിന്റെ ഉദ്ദേശ്യവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: സംസാരിക്കുന്നയാളുടെ തിരിച്ചറിയൽ
  choice: “അവൻ പറഞ്ഞു” എന്ന ഏകവചനരൂപം നിലനിർത്തി; സംസാരിക്കുന്നത് ആരെന്നു കൂടുതൽ വ്യക്തമാക്കിയില്ല.
  alternative: ദൂതന്മാരെ കൂട്ടമായി ഉദ്ദേശിച്ച് “അവർ പറഞ്ഞു” എന്നോ “ദൂതൻ പറഞ്ഞു” എന്നോ വ്യക്തമാക്കുക.
  rationale: ഹീബ്രുവിലെ ക്രിയ ഏകവചനമാണ്; എന്നാൽ സംസാരിക്കുന്നവന്റെ വ്യക്തിത്വത്തെ വാക്യം പ്രത്യേകം തീർപ്പാക്കുന്നില്ല. അതിനാൽ വ്യാകരണവിവരം മാത്രം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവും അടിയന്തരത പ്രകടമാക്കുന്നതുമായ ശൈലി. ഹീബ്രുവിലെ ആജ്ഞകളുടെ ആവർത്തനവും ഏകവചനത്തിലുള്ള സംസാരക്രിയയും നിലനിർത്തിയിട്ടുണ്ട്; ഭൂപ്രകൃതിപദത്തിലെ യഥാർഥ വ്യാപ്തി അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചിരിക്കുന്നു.
