  to: 'അവർ അവരെ പുറത്തേക്കു കൊണ്ടുവന്നപ്പോൾ, അവൻ പറഞ്ഞു: “ജീവൻ രക്ഷിക്കാൻ ഓടിപ്പോകുക. പിന്നിലേക്കു നോക്കരുത്[a]; സമതലത്തിൽ എവിടെയും നിൽക്കരുത്. മലനാട്ടിലേക്ക് ഓടിപ്പോകുക[b]; നീ നശിച്ചുപോകാതിരിക്കാൻ[c].”'
  rationale: മൂലത്തിൽ ഇല്ലാത്ത “അങ്ങനെ ചെയ്യുക” ഒഴിവാക്കി, അവസാന മുന്നറിയിപ്പിനെ ഹീബ്രുവിന്റെ פֶּן-ഉപവാക്യമായി നേരിട്ട് നിലനിർത്തി. അടിക്കുറിപ്പ് c-യിൽ അർഥത്തെ അധികമായി വ്യാഖ്യാനിക്കാവുന്ന “നീയും” നീക്കി. മറ്റെല്ലാ പദതിരഞ്ഞെടുപ്പുകളും സുരക്ഷിതവും സ്വാഭാവികവും മൂലപാഠത്തോടു ചേർന്നതുമാണ്.
