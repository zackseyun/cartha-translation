base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/034.yaml
  text: And it happened on the next day that the firstborn said to the younger[a], “Look, I lay with my father last night. Let us make him drink wine tonight also. Then come, lie with him, so that we may preserve offspring from our father.”
translation:
  language: ml
  text: 'പിറ്റേന്ന് മൂത്തവൾ ഇളയവളോടു പറഞ്ഞു: “നോക്കൂ, ഇന്നലെ രാത്രി ഞാൻ എന്റെ അപ്പനോടുകൂടെ ശയിച്ചു. ഇന്നുരാത്രിയും നമുക്ക് അദ്ദേഹത്തെ വീഞ്ഞു കുടിപ്പിക്കാം. പിന്നെ നീ വന്ന് അദ്ദേഹത്തോടുകൂടെ ശയിക്കുക; അങ്ങനെ നമ്മുടെ അപ്പനിൽനിന്നുള്ള സന്തതി നമുക്ക് നിലനിർത്താം.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായ മൂലത്തിൽ അക്ഷരാർഥം: “നമ്മുടെ അപ്പനിൽനിന്നുള്ള വിത്ത്.” ഇവിടെ “വിത്ത്” എന്നത് സന്തതിയെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: പിറ്റേന്ന്
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ തുടർച്ചാഭാവം മലയാളത്തിലെ സ്വാഭാവിക കഥനക്രമത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു; കൃത്രിമമായ ‘സംഭവിച്ചു’ ഒഴിവാക്കുന്നു.
- source_word: הַבְּכִירָה ... הַצְּעִירָה
  choice: മൂത്തവൾ ... ഇളയവൾ
  rationale: ജനനക്രമത്തിലെ വ്യത്യാസം വ്യക്തമായി സൂചിപ്പിക്കുന്ന, സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: הֵן
  choice: നോക്കൂ
  rationale: തുടർന്നുള്ള വാക്കുകളിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന കണികയുടെ പ്രാബല്യം ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שָׁכַבְתִּי אֶת־אָבִי / שִׁכְבִי עִמּוֹ
  choice: എന്റെ അപ്പനോടുകൂടെ ശയിച്ചു / അദ്ദേഹത്തോടുകൂടെ ശയിക്കുക
  rationale: സന്ദർഭത്തിലെ ലൈംഗിക അർഥം മറയ്ക്കാതെ, ഹീബ്രുവിലെ ഗൗരവമുള്ള സൗമ്യോക്തി നിലനിർത്തുന്നു.
- source_word: נַשְׁקֶנּוּ יַיִן
  choice: നമുക്ക് അദ്ദേഹത്തെ വീഞ്ഞു കുടിപ്പിക്കാം
  rationale: ഹിഫ്ഇൽ രൂപത്തിന്റെ കാരണാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: גַּם הַלַּיְלָה
  choice: ഇന്നുരാത്രിയും
  rationale: കാലസൂചനയും ആവർത്തനത്തെ സൂചിപ്പിക്കുന്ന גַּם എന്ന കണികയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: וּנְחַיֶּה מֵאָבִינוּ זָרַע
  choice: അങ്ങനെ നമ്മുടെ അപ്പനിൽനിന്നുള്ള സന്തതി നമുക്ക് നിലനിർത്താം
  rationale: חיה എന്നതിന്റെ ‘ജീവനോടെ സൂക്ഷിക്കുക/നിലനിർത്തുക’ എന്ന അർഥവും זרע എന്നതിന്റെ വംശോത്പത്തി അർഥവും വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘ശയിക്കുക’ എന്ന പദം മൂലത്തിലെ ലൈംഗിക സൗമ്യോക്തിയും ഗൗരവവും നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് സൂചകം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
