id: GEN.19.26
reference: Genesis 19:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תַּבֵּ֥ט אִשְׁתּ֖/וֹ מֵ/אַחֲרָ֑י/ו וַ/תְּהִ֖י נְצִ֥יב מֶֽלַח׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/026.yaml
  text: But his wife looked back from behind him[b][a], and she became a pillar of salt.
translation:
  language: ml
  text: എന്നാൽ അവന്റെ ഭാര്യ അവന്റെ പിന്നിൽനിന്ന് തിരിഞ്ഞുനോക്കി[a]; അവൾ ഉപ്പുതൂണായിത്തീർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘അവന്റെ പിന്നിൽനിന്ന് നോക്കി’; ഇത് ‘അവന്റെ പിന്നിലേക്കു നോക്കി’ എന്നും മനസ്സിലാക്കാം.'
    reason: മൂലത്തിലെ מֵאַחֲרָיו എന്ന പ്രയോഗം അവളുടെ സ്ഥാനം സൂചിപ്പിക്കാമെങ്കിലും, നോക്കിയ ദിശയായി ഗ്രഹിക്കാനുള്ള യഥാർഥ ഭാഷാപരമായ സാധ്യതയും ഉണ്ട്; മുഖ്യപാഠം സ്വാഭാവിക മലയാളവും അടിക്കുറിപ്പ് ഈ അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: וַתַּבֵּט
  choice: തിരിഞ്ഞുനോക്കി
  rationale: נבט എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘നോക്കുക’ എന്നാണ്. ഈ സന്ദർഭത്തിലും തുടർന്നുള്ള מֵאַחֲרָיו എന്ന പ്രയോഗത്തോടും ചേർന്ന്, പിന്നോട്ടുള്ള ദിശയിലേക്കുള്ള നോട്ടം സ്വാഭാവിക മലയാളത്തിൽ ‘തിരിഞ്ഞുനോക്കി’ എന്നു വ്യക്തമാകുന്നു; ഉദ്ദേശ്യം ഇതിൽ ചേർത്തിട്ടില്ല.
- source_word: אִשְׁתּוֹ
  choice: അവന്റെ ഭാര്യ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം ചേർന്ന നാമം നേരിട്ട് ‘അവന്റെ ഭാര്യ’ എന്നാണ്; സന്ദർഭത്തിൽ ‘അവൻ’ ലോത്തിനെ സൂചിപ്പിക്കുന്നു.
- source_word: מֵאַחֲרָיו
  choice: അവന്റെ പിന്നിൽനിന്ന്
  rationale: מן + אַחַר + 3ms എന്ന ഘടന അക്ഷരാർഥത്തിൽ ‘അവന്റെ പിന്നിൽനിന്ന്’ എന്നാണ്. ഇത് ഭാര്യയുടെ സ്ഥാനം സൂചിപ്പിക്കുന്നതോടൊപ്പം മൂലപാഠത്തിലെ രൂപം നിലനിർത്തുന്നു.
- source_word: וַתְּהִי
  choice: ആയിത്തീർന്നു
  rationale: കഥനക്രമത്തിലെ היה ഇവിടെ ഒരു പുതിയ അവസ്ഥയിലേക്കുള്ള മാറ്റത്തെയോ ഫലത്തെയോ സൂചിപ്പിക്കുന്നു; അതിനാൽ വെറും ‘ആയിരുന്നു’ എന്നതിനെക്കാൾ ‘ആയിത്തീർന്നു’ യോജിക്കുന്നു.
- source_word: נְצִיב
  choice: തൂൺ
  rationale: സ്ഥാപിക്കപ്പെട്ടതോ നിവർന്നുനിൽക്കുന്നതോ ആയ രൂപത്തെ സൂചിപ്പിക്കുന്ന പദം; ഈ സന്ദർഭത്തിൽ മലയാളത്തിലെ പതിവും സ്വാഭാവികവുമായ തർജമ ‘തൂൺ’ ആണ്.
- source_word: מֶלַח
  choice: ഉപ്പ്
  rationale: נְצִיב־מֶלַח എന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഉപ്പുതൂൺ’ എന്നു സംയുക്തപദമായി നൽകാം.
theological_decisions:
- issue: ലോത്തിന്റെ ഭാര്യയ്ക്കുണ്ടായ മാറ്റത്തിന്റെ സ്വഭാവം
  choice: ‘അവൾ ഉപ്പുതൂണായിത്തീർന്നു’ എന്ന് സംഭവവിവരണം നേരിട്ട് പരിഭാഷപ്പെടുത്തുക.
  alternative: ‘അവൾ ഉപ്പുതൂൺപോലെയായി’ അല്ലെങ്കിൽ ‘അവൾ അവിടെ ഉപ്പുതൂണായി നിന്നു.’
  rationale: എബ്രായപാഠത്തിൽ ഉപമ സൂചിപ്പിക്കുന്ന ഘടകമില്ല; היה എന്ന ക്രിയയും നാമപദവും നേരിട്ടുള്ള മാറ്റം പ്രസ്താവിക്കുന്നു. അതിനാൽ ഉപമയാക്കി ദുർബലപ്പെടുത്താതെയും അധികമായ വ്യാഖ്യാനശാസ്ത്രം ചേർക്കാതെയും കഥനത്തിലെ അവകാശവാദം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അവന്റെ പിന്നിൽനിന്ന് തിരിഞ്ഞുനോക്കി’ എന്നത് മൂലത്തിലെ സ്ഥാനസൂചനയും സന്ദർഭത്തിലെ പിന്നോട്ടുള്ള നോട്ടവും ഒരുമിച്ച് നിലനിർത്തുന്നു. ‘ഉപ്പുതൂണായിത്തീർന്നു’ എന്ന സംയുക്തരൂപം സ്വാഭാവികവും കഥനത്തിന്റെ നേരിട്ടുള്ള സ്വഭാവത്തിന് അനുയോജ്യവുമാണ്.
