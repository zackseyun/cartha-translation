id: GEN.19.38
reference: Genesis 19:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/צְּעִירָ֤ה גַם הִוא֙ יָ֣לְדָה בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ בֶּן עַמִּ֑י ה֛וּא אֲבִ֥י בְנֵֽי עַמּ֖וֹן עַד הַ/יּֽוֹם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/038.yaml
  text: The younger also bore a son and called his name Ben-ammi[b][a]; he is the father of the Ammonites to this day.
translation:
  language: ml
  text: ഇളയവളും ഒരു മകനെ പ്രസവിച്ച് അവന് ബെൻ-അമ്മി[a] എന്നു പേരിട്ടു. ഇന്നുവരെയും അമ്മോന്യരുടെ[b] പിതാവ് അവനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ബെൻ-അമ്മി എന്ന പേരിന് ‘എന്റെ ജനത്തിന്റെ മകൻ’ എന്നോ ‘എന്റെ ബന്ധുവിന്റെ മകൻ’ എന്നോ അർഥമുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘അമ്മോന്റെ പുത്രന്മാർ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצְּעִירָה
  choice: ഇളയവൾ
  rationale: നിശ്ചയാർഥക വിശേഷണം ഇവിടെ നാമപദമായി ഉപയോഗിച്ചിരിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് ലോത്തിന്റെ ഇളയ മകളെ സൂചിപ്പിക്കുന്നു.
- source_word: גַם הִוא
  choice: -ഉം
  rationale: ഇളയവളും മൂത്തവളെപ്പോലെ ഒരു മകനെ പ്രസവിച്ചു എന്ന സമാനത മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: יָלְדָה בֵּן
  choice: ഒരു മകനെ പ്രസവിച്ചു
  rationale: യָלַד + בֵּן എന്ന എബ്രായ പ്രയോഗത്തിന്റെ കൃത്യവും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: അവന് ... എന്നു പേരിട്ടു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘അവന്റെ പേര് വിളിച്ചു’ എന്നതിനേക്കാൾ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ നാമകരണപ്രയോഗം.
- source_word: בֶּן עַמִּי
  choice: ബെൻ-അമ്മി
  rationale: വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്യുന്നു; കഥയിൽ പ്രസക്തമായ അതിന്റെ സാധ്യതയുള്ള അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: הוּא אֲבִי
  choice: പിതാവ് അവനാണ്
  rationale: ക്രിയയില്ലാത്ത എബ്രായ വാക്യത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ജനസമൂഹത്തിന്റെ പൂർവപിതാവ് എന്ന വംശാവലിസംബന്ധമായ ആശയമാണ് സന്ദർഭത്തിൽ.
- source_word: בְנֵי עַמּוֹן
  choice: അമ്മോന്യർ
  rationale: അക്ഷരാർഥം ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്നാണെങ്കിലും, ജനസമൂഹത്തെ സൂചിപ്പിക്കാൻ ‘അമ്മോന്യർ’ എന്നത് സ്വാഭാവികമായ ആധുനിക മലയാളമാണ്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: עַד הַיּוֹם
  choice: ഇന്നുവരെയും
  rationale: വിവരിക്കുന്നവന്റെ കാലംവരെ ആ ജനസമൂഹത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന എബ്രായ കാലപ്രയോഗത്തിന്റെ സ്വാഭാവിക പരിഭാഷ.
theological_decisions:
- issue: ‘പിതാവ്’ എന്ന പദത്തിന്റെ വംശാവലിസംബന്ധമായ വ്യാപ്തി
  choice: പിതാവ്
  alternative: പൂർവപിതാവ്
  rationale: മൂലപാഠത്തിലെ אָב എന്ന പദത്തിന്റെ നേരിട്ടുള്ള രൂപം നിലനിർത്തുന്നു; ഇവിടെ ഒരു ജനസമൂഹത്തിന്റെ ആദിപൂർവികൻ എന്ന ആശയം സന്ദർഭം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യക്രമം നിർബന്ധമായി പകർത്താതെ അർഥബന്ധവും നാമകരണസൂത്രവും വംശാവലിഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
