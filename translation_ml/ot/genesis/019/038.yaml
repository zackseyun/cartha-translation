  source_fidelity: 'എബ്രായ മൂലപാഠത്തിലെ എല്ലാ പ്രധാന ഘടകങ്ങളും കൃത്യമായി പ്രതിഫലിക്കുന്നു: ഇളയ മകൾക്കും ഒരു മകൻ ജനിച്ചു, അവൾ അവന് ബെൻ-അമ്മി എന്നു പേരിട്ടു, അവൻ അമ്മോന്യരുടെ പിതാവാണ്, എന്നിങ്ങനെ ‘ഇന്നുവരെയും’ എന്ന കാലസൂചനയോടുകൂടെ. ‘അമ്മോന്യർ’ എന്നത് בְּנֵי עַמּוֹן എന്ന ജനവിഭാഗസൂചനയുടെ സ്വാഭാവിക പരിഭാഷയാണ്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകിയിട്ടുണ്ട്.'
