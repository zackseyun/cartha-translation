  yaml_path: translation/ot/genesis/019/006.yaml
  text: Lot went out to them at the entrance and shut the door behind him[a].
translation:
  language: ml
  text: ലോത്ത് പ്രവേശനത്തുറവിൽ അവരുടെ അടുത്തേക്കു പുറത്തേക്കു ചെന്നു; തന്റെ പിന്നിൽ വാതിൽ അടച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വാതിൽപ്പടിയിലേക്ക്.’ എബ്രായമൂലത്തിൽ പ്രവേശനത്തുറവ് (פֶּתַח) എന്നും വാതിൽ (דֶּלֶת) എന്നും വ്യത്യസ്ത പദങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ചെന്നു
  rationale: יצא എന്ന ക്രിയയുടെ കഥാവിവരണം മുന്നോട്ടുകൊണ്ടുപോകുന്ന ലളിതഭൂതകാലപ്രയോഗം. വീട്ടിനകത്തുനിന്ന് പുറത്തുള്ളവരുടെ അടുക്കലേക്കുള്ള നീക്കം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: אֲלֵהֶם
  choice: അവരുടെ അടുക്കലേക്ക്
  rationale: אֶל എന്ന ഉപസർഗവും മൂന്നാംപുരുഷ ബഹുവചന പ്രത്യയവും പുറത്തുനിന്നിരുന്ന ആളുകളുടെ നേർക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לוֹט
  choice: ലോത്ത്
  rationale: മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: הַפֶּתְחָה
  choice: പ്രവേശനകവാടത്തിൽ
  rationale: פֶּתַח തുറവിനെയോ പ്രവേശനസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു; ദിശാസൂചകമായ ־ה ആ സ്ഥാനത്തേക്കുള്ള നീക്കം കാണിക്കുന്നു. തുടർന്നുള്ള דֶּלֶת എന്ന ‘വാതിൽ’ എന്ന പദത്തിൽനിന്ന് വേർതിരിച്ചിരിക്കുന്നു.
- source_word: וְהַדֶּלֶת
  choice: വാതിൽ
  rationale: דֶּלֶת പ്രവേശനത്തിലെ തുറവല്ല, അടയ്ക്കാവുന്ന വാതിൽ തന്നെയാണ്; മുൻപത്തെ פֶּתַח-നോടുള്ള പദവ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: סָגַר
  choice: അടച്ചു
  rationale: סגר എന്നതിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാള കഥനരൂപം.
- source_word: אַחֲרָיו
  choice: തന്റെ പിന്നിൽ
  rationale: ഇവിടെ אַחַר സ്ഥലസൂചനയായി, ലോത്ത് പുറത്തേക്കു ചെന്നശേഷം വാതിൽ തന്റെ പിന്നിൽ അടച്ചതായി വ്യക്തമാക്കുന്നു; കാലസൂചനയായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ഈ രൂപം തിരഞ്ഞെടുത്തു.
