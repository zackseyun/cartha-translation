  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘പ്രവേശനകവാടം’ എന്നും ‘വാതിൽ’ എന്നും നൽകി മൂലഭാഷയിലെ പദവ്യത്യാസം സംരക്ഷിച്ചു; ദിശാസൂചകമായ ഹേയുടെ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
