  to: ലോത്ത് പ്രവേശനത്തുറവിൽ അവരുടെ അടുത്തേക്കു പുറത്തേക്കു ചെന്നു; തന്റെ പിന്നിൽ വാതിൽ അടച്ചു.[a]
