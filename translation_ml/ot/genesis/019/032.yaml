source:
  edition: WLC
  text: לְכָ֨/ה נַשְׁקֶ֧ה אֶת אָבִ֛י/נוּ יַ֖יִן וְ/נִשְׁכְּבָ֣ה עִמּ֑/וֹ וּ/נְחַיֶּ֥ה מֵ/אָבִ֖י/נוּ זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/032.yaml
  text: Come[a], let us make our father drink wine, and let us lie with him[b], so that we may preserve offspring through our father.
translation:
  language: ml
  text: വരൂ, നമുക്ക് നമ്മുടെ അപ്പനെ വീഞ്ഞ് കുടിപ്പിക്കാം; അദ്ദേഹത്തോടുകൂടെ ശയിക്കാം. അങ്ങനെ നമ്മുടെ അപ്പനിൽനിന്ന് സന്തതി തുടരേണ്ടതിന്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “നമ്മുടെ അപ്പനിൽനിന്ന് വിത്തിനെ നിലനിർത്താം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה
  choice: വരൂ
  rationale: പ്രവർത്തനത്തിന് പ്രേരിപ്പിക്കുന്ന ആഹ്വാനപ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ആഹ്വാനഭാവം നൽകുന്നു.
- source_word: נַשְׁקֶה
  choice: കുടിപ്പിക്കാം
  rationale: שקה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരകാർഥം—മറ്റൊരാളെ കുടിപ്പിക്കുക—വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אָבִינוּ
  choice: നമ്മുടെ അപ്പൻ / അപ്പനെ
  rationale: ആദ്യപുരുഷ ബഹുവചന ഉടമസ്ഥതയും വാക്യത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു; കുടുംബസംഭാഷണത്തിന് സ്വാഭാവികമായ ‘അപ്പൻ’ തെരഞ്ഞെടുത്തു.
- source_word: יַיִן
  choice: വീഞ്ഞ്
  rationale: יין എന്ന പദത്തിന്റെ പതിവും വ്യക്തവുമായ മലയാളപരിഭാഷ.
- source_word: וְנִשְׁכְּבָה עִמּוֹ
  choice: അദ്ദേഹത്തോടുകൂടെ ശയിക്കാം
  rationale: ലൈംഗിക അർഥമുള്ള എബ്രായ സൗമ്യോക്തി അനാവശ്യമായ വിശദീകരണമില്ലാതെ, ഗൗരവമുള്ള മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וּנְחַיֶּה
  choice: നിലനിർത്താം
  rationale: പീയേൽ രൂപത്തിന്റെ ‘ജീവനോടെ സൂക്ഷിക്കുക/നിലനിർത്തുക’ എന്ന കാരകാർഥം ഇവിടെ വംശതുടർച്ചയെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מֵאָבִינוּ
  choice: നമ്മുടെ അപ്പനിൽനിന്ന്
  rationale: מן സൂചിപ്പിക്കുന്ന ഉറവിടം നേരിട്ട് നിലനിർത്തുന്നു; ‘മുഖാന്തരം’ എന്ന വ്യാഖ്യാനാത്മക പരിഹാരം ഒഴിവാക്കുന്നു.
- source_word: זָרַע
  choice: സന്തതി
  rationale: זרע എന്നതിന്റെ സന്ദർഭോചിതമായ ‘offspring/progeny’ അർഥം നൽകുന്നു; അക്ഷരാർഥമായ ‘വിത്ത്’ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
