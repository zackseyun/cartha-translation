translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. സഹോദരിമാരുടെ നേരിട്ടുള്ള സംഭാഷണത്തിന് ‘അപ്പൻ’ ഉപയോഗിച്ചു; എന്നാൽ ലൈംഗിക സൗമ്യോക്തിയിൽ ഗൗരവം നിലനിർത്താൻ ‘ശയിക്കാം’ തെരഞ്ഞെടുത്തു. എബ്രായത്തിലെ രണ്ട് ആഹ്വാനാത്മക ക്രിയാരൂപങ്ങളുടെ ക്രമവും מן എന്ന ഉപസർഗത്തിന്റെ ഉറവിടാർഥവും സംരക്ഷിച്ചു.
