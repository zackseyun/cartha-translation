source:
  edition: WLC
  text: הִנֵּה נָ֠א מָצָ֨א עַבְדְּ/ךָ֣ חֵן֮ בְּ/עֵינֶי/ךָ֒ וַ/תַּגְדֵּ֣ל חַסְדְּ/ךָ֗ אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִמָּדִ֔/י לְ/הַחֲי֖וֹת אֶת נַפְשִׁ֑/י וְ/אָנֹכִ֗י לֹ֤א אוּכַל֙ לְ/הִמָּלֵ֣ט הָ/הָ֔רָ/ה פֶּן תִּדְבָּקַ֥/נִי הָ/רָעָ֖ה וָ/מַֽתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/019.yaml
  text: Look[a], please, your servant has found favor in your eyes, and you have made great your steadfast love that you have shown me by preserving my life. But I cannot escape to the mountain[b], lest the disaster overtake me and I die.
translation:
  language: ml
  text: 'ഇതാ, ദയവായി: അങ്ങയുടെ ദാസനായ എനിക്ക് അങ്ങയുടെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിച്ചിരിക്കുന്നു; എന്റെ ജീവൻ നിലനിർത്തിയതിലൂടെ അങ്ങ് എന്നോടു കാണിച്ച സ്ഥിരസ്നേഹം[a] മഹത്തായിരിക്കുന്നു. എന്നാൽ മലയിലേക്ക് രക്ഷപ്പെടാൻ എനിക്കു കഴിയില്ല; ദുരന്തം[b] എന്നെ പിടികൂടി ഞാൻ മരിച്ചുപോകുമോ എന്നു ഭയമാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്ഥിരസ്നേഹം’ എന്നതിന് ‘ദയ,’ ‘കരുണ,’ അല്ലെങ്കിൽ ‘വിശ്വസ്തസ്നേഹം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ‘തിന്മ’ എന്നാണ്; ഇവിടെ ലോത്തിനെ ബാധിക്കാനിരിക്കുന്ന അനർഥമോ ദുരന്തമോ ആണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: ഇതാ, ദയവായി കേൾക്കണമേ
  rationale: הִנֵּה ശ്രദ്ധ ക്ഷണിക്കുകയും נָא വിനയത്തോടുകൂടിയ അടിയന്തര അപേക്ഷ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. അക്ഷരാർഥത്തിലുള്ള ‘നോക്കൂ’ എന്നതിനെക്കാൾ അഭിസംബോധനയിൽ സ്വാഭാവികമായ മലയാള പ്രയോഗമാണിത്.
- source_word: מָצָא ... חֵן בְּעֵינֶיךָ
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിച്ചിരിക്കുന്നു
  rationale: അനുകൂല പരിഗണന ലഭിക്കുക എന്ന എബ്രായ ശൈലിയുടെ അർഥവും ‘കണ്ണുകളിൽ’ എന്ന ദൃശ്യരൂപത്തിന്റെ മാന്യമായ മലയാള സമാനതയും നിലനിർത്തുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: ഇവിടെ അടിമത്തപദവിയേക്കാൾ മേലധികാരിയോടുള്ള വിനയപൂർവമായ സ്വയംവിശേഷണമാണ് മുൻനിലയിൽ.
- source_word: וַתַּגְדֵּל חַסְדְּךָ
  choice: മഹത്തായ അചഞ്ചലസ്നേഹം കാണിച്ചിരിക്കുന്നു
  rationale: גדל നൽകുന്ന തീവ്രത സ്വാഭാവിക മലയാളത്തിൽ വിശേഷണരൂപത്തിൽ പ്രകടിപ്പിക്കുകയും חסד എന്ന പദത്തിലെ സ്ഥിരതയുള്ള കരുണാസ്നേഹത്തിന്റെ ഭാവം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: לְהַחֲיוֹת אֶת נַפְשִׁי
  choice: എന്റെ ജീവൻ നിലനിർത്തിയതിലൂടെ
  rationale: ജീവൻ തുടർന്നുനിൽക്കാൻ ഇടയാക്കുക എന്ന അർഥം അനാവശ്യമായ സാങ്കേതിക രക്ഷാശാസ്ത്രഭാരം ചേർക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: לְהִמָּלֵט הָהָרָה
  choice: മലയിലേക്ക് ഓടിരക്ഷപ്പെടാൻ
  rationale: ദിശാസൂചകമായ הָ־ പ്രത്യയവും അപകടത്തിൽനിന്ന് രക്ഷപ്പെടുക എന്ന מלט പദത്തിന്റെ അർഥവും വ്യക്തമാക്കുന്നു.
- source_word: תִּדְבָּקַנִי
  choice: എന്നെ പിടികൂടി
  rationale: അടിസ്ഥാനാർഥം ‘പറ്റിപ്പിടിക്കുക’ എന്നാണെങ്കിലും വരാനിരിക്കുന്ന അനർഥം ഒരാളെ എത്തിപ്പിടിക്കുക എന്ന സന്ദർഭാർഥമാണ് ഇവിടെ സ്വാഭാവികം.
- source_word: הָרָעָה
  choice: ആ ദുരന്തം
  rationale: ഈ സന്ദർഭത്തിൽ പദം ധാർമിക തിന്മയെയല്ല, ലോത്തിനെ ബാധിക്കാനിരിക്കുന്ന നാശകരമായ അനർഥത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ദൈവിക അധികാരത്തിൽ പ്രവർത്തിക്കുന്ന ദൂതന്മാരോടുള്ള അപേക്ഷയിൽ חֶסֶד എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അചഞ്ചലസ്നേഹം
  alternative: ദയ; കരുണ; വിശ്വസ്തസ്നേഹം
  rationale: ലോത്തിന്റെ ജീവൻ നിലനിർത്തിയ കൃപാപൂർവവും സ്ഥിരവുമായ നന്മയെ ഈ തിരഞ്ഞെടുപ്പ് വ്യക്തമാക്കുന്നു; അതേസമയം ഈ സന്ദർഭത്തിൽ സാങ്കേതികമായ ഉടമ്പടിപദം അനാവശ്യമായി ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദൂതനോടുള്ള ആദരസൂചക ഏകവചന അഭിസംബോധനയ്ക്കായി ‘അങ്ങ്’ ഉപയോഗിച്ചു; എബ്രായത്തിലെ വിനയവും അടിയന്തരതയും നിലനിർത്താൻ ‘ദയവായി കേൾക്കണമേ’ സ്വീകരിച്ചു.
