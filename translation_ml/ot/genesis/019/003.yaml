translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ അതിലെ പ്രവൃത്തിക്രമവും ‘തിരിഞ്ഞ്’ എന്ന ദൃശ്യഭാവവും സംരക്ഷിച്ചിരിക്കുന്നു; അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
