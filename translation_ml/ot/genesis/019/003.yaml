source:
  edition: WLC
  text: וַ/יִּפְצַר בָּ֣/ם מְאֹ֔ד וַ/יָּסֻ֣רוּ אֵלָ֔י/ו וַ/יָּבֹ֖אוּ אֶל בֵּית֑/וֹ וַ/יַּ֤עַשׂ לָ/הֶם֙ מִשְׁתֶּ֔ה וּ/מַצּ֥וֹת אָפָ֖ה וַ/יֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/003.yaml
  text: But he urged them strongly[a], so they turned aside to him and entered his house. He prepared a feast for them, baked unleavened bread[b], and they ate.
translation:
  language: ml
  text: എന്നാൽ അവൻ അവരോടു വളരെ നിർബന്ധിച്ചു[a]. അപ്പോൾ അവർ അവന്റെ അടുക്കലേക്കു വഴിതിരിഞ്ഞ് അവന്റെ വീട്ടിൽ പ്രവേശിച്ചു. അവൻ അവർക്കായി ഒരു വിരുന്നൊരുക്കി, പുളിപ്പില്ലാത്ത അപ്പം[b] ചുട്ടു; അവർ ഭക്ഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവരെ വളരെ ശക്തമായി പ്രേരിപ്പിച്ചു’ / ‘അവരോട് ഏറെ നിർബന്ധിച്ചു.’'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ ബഹുവചനം: ‘പുളിപ്പില്ലാത്ത അപ്പങ്ങൾ’ അഥവാ ‘പുളിപ്പില്ലാത്ത പരന്ന അപ്പങ്ങൾ’; പുളിപ്പിക്കുന്ന ഘടകം ചേർക്കാതെ ഉണ്ടാക്കിയ അപ്പം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצַר בָּם מְאֹד
  choice: അവൻ അവരെ വളരെ നിർബന്ധിച്ചു
  rationale: פצר ശക്തമായി പ്രേരിപ്പിക്കുകയോ നിർബന്ധിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; מְאֹד അതിന്റെ തീവ്രത കൂട്ടുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ശക്തവുമായ പ്രയോഗമാണിത്.
- source_word: וַיָּסֻרוּ אֵלָיו
  choice: അവർ അവന്റെ അടുക്കലേക്കു തിരിഞ്ഞ്
  rationale: סור എന്ന ക്രിയയിലെ ‘തിരിയുക/വഴിമാറുക’ എന്ന ദൃശ്യഭാവവും אֵלָיו എന്നതിലെ ‘അവന്റെ അടുക്കലേക്ക്’ എന്ന ദിശയും നിലനിർത്തുന്നു.
- source_word: וַיָּבֹאוּ אֶל־בֵּיתוֹ
  choice: അവന്റെ വീട്ടിൽ പ്രവേശിച്ചു
  rationale: ചലനവും ലക്ഷ്യസ്ഥാനവും ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִשְׁתֶּה
  choice: ഒരു വിരുന്ന്
  rationale: പാനീയസൽക്കാരത്തിന്റെ സാധ്യത ഉള്ള പദമാണെങ്കിലും ഈ സന്ദർഭത്തിൽ അതിനെ പ്രത്യേകമായി മുൻനിർത്തേണ്ടതില്ല; ‘വിരുന്ന്’ വിശാലവും യോജിച്ചതുമാണ്.
- source_word: מַצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പം
  rationale: പുളിപ്പിക്കുന്ന ഘടകം ചേർക്കാതെ ഉണ്ടാക്കിയ അപ്പത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ബഹുവചനരൂപത്തെ മലയാളത്തിലെ സ്വാഭാവിക സമാഹാരനാമമായി നൽകുന്നു.
- source_word: אָפָה
  choice: ചുട്ടു
  rationale: അപ്പം തീയിൽ/അടുപ്പിൽ വേവിക്കുന്ന പ്രവൃത്തിക്ക് സ്വാഭാവികമായ മലയാളക്രിയ.
- source_word: וַיֹּאכֵלוּ
  choice: അവർ ഭക്ഷിച്ചു
  rationale: അതിഥികൾ ഒരുക്കിയ ഭക്ഷണം കഴിച്ചതെന്ന ലളിതമായ ആഖ്യാനസമാപനം കൃത്യമായി നൽകുന്നു.
