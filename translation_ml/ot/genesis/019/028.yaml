  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּשְׁקֵ֗ף עַל פְּנֵ֤י סְדֹם֙ וַ/עֲמֹרָ֔ה וְ/עַֽל כָּל פְּנֵ֖י אֶ֣רֶץ הַ/כִּכָּ֑ר וַ/יַּ֗רְא וְ/הִנֵּ֤ה עָלָה֙ קִיטֹ֣ר הָ/אָ֔רֶץ כְּ/קִיטֹ֖ר הַ/כִּבְשָֽׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/028.yaml
  text: And he looked out over Sodom and Gomorrah and over all the land of the plain[a], and he saw, and behold, smoke was rising from the land like the smoke of a furnace.
translation:
  language: ml
  text: അവൻ സൊദോമിനെയും ഗൊമോറയെയും സമതലദേശം മുഴുവനും നോക്കി. അവൻ കണ്ടു; ഇതാ, ഉലയുടെ പുകപോലെ ദേശത്തുനിന്ന് പുക ഉയരുന്നുണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചൂളയുടെ പുകപോലെ.’
    reason: כִּבְשָׁן എന്ന പദത്തിന് ‘ഉല’ എന്നും ‘ചൂള’ എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: നോക്കി
  rationale: ഉയർന്ന സ്ഥലത്തുനിന്ന് ഒരു പ്രദേശത്തെ നിരീക്ഷിക്കുന്ന ആശയം സന്ദർഭം നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘നോക്കി’ എന്ന് നൽകി, ദിശ സൂചിപ്പിക്കുന്ന തുടർന്നുള്ള പ്രയോഗത്തിലൂടെ അതിന്റെ സ്ഥലപരമായ ഭാവം നിലനിർത്തി.
- source_word: עַל פְּנֵי סְדֹם וַעֲמֹרָה
  choice: സൊദോമിനും ഗൊമോറയ്ക്കും നേരെ
  rationale: ‘മുഖത്തിന്മേൽ’ എന്ന അക്ഷരാർഥപ്രയോഗം മലയാളത്തിൽ കൃത്രിമമാകുന്നതിനാൽ, നിരീക്ഷണത്തിന്റെ ദിശ വ്യക്തമാക്കുന്ന സ്വാഭാവികമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: כָּל פְּנֵי אֶרֶץ הַכִּכָּר
  choice: സമതലപ്രദേശം മുഴുവനിലേക്കും
  rationale: כִּכָּר ഇവിടെ ആ പ്രദേശത്തെ സമതലജില്ലയെയോ സമതലഭൂമിയെയോ സൂചിപ്പിക്കുന്നു. ‘സമതലപ്രദേശം’ ഭൂമിശാസ്ത്രപരമായ ആശയം വ്യക്തമായി നൽകുന്നു; כָּל פְּנֵי എന്നതിന്റെ വ്യാപ്തി ‘മുഴുവനും’ നിലനിർത്തുന്നു.
- source_word: וַיַּרְא וְהִנֵּה
  choice: അതാ, ... അവൻ കണ്ടു
  rationale: ראה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും הִנֵּה നൽകുന്ന പെട്ടെന്നുള്ള ദൃശ്യശ്രദ്ധയും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: עָלָה קִיטֹר הָאָרֶץ
  choice: ദേശത്തുനിന്ന് പുക ഉയരുന്നത്
  rationale: കാണപ്പെട്ടുകൊണ്ടിരുന്ന മുകളിലേക്കുള്ള ചലനം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; קִיטֹר എന്നതിന് അധിക വിശേഷണം ചേർക്കാതെ ‘പുക’ എന്നു നൽകി.
- source_word: כְּקִיטֹר הַכִּבְשָׁן
  choice: ഉലയിൽനിന്നുള്ള പുകപോലെ
  rationale: כִּבְשָׁן ഉലയെയോ ചൂളയെയോ സൂചിപ്പിക്കാം. പ്രധാനപാഠത്തിൽ ‘ഉല’ എന്ന പരിചിതമായ പദം ഉപയോഗിക്കുകയും മറ്റൊരു സാധുവായ അർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
