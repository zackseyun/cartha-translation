revisions:
- from: അവൻ സൊദോമിനും ഗൊമോറയ്ക്കും നേരെയും സമതലപ്രദേശം മുഴുവനിലേക്കും നോക്കി. അതാ, ഉലയിൽനിന്നുള്ള പുകപോലെ ദേശത്തുനിന്ന് പുക ഉയരുന്നത് അവൻ കണ്ടു.[a]
  to: അവൻ സൊദോമിനെയും ഗൊമോറയെയും സമതലദേശം മുഴുവനും നോക്കി. അവൻ കണ്ടു; ഇതാ, ഉലയുടെ പുകപോലെ ദേശത്തുനിന്ന് പുക ഉയരുന്നുണ്ടായിരുന്നു.[a]
  rationale: The revision restores the Hebrew sequence ‘he saw; behold,’ presents the surveyed locations as the full field of view rather than merely a direction, and renders the furnace/kiln smoke comparison more directly. It preserves the source’s local sense of ‘land’ and its ongoing visual image of rising smoke.
