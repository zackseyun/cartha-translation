id: GEN.19.22
reference: Genesis 19:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מַהֵר֙ הִמָּלֵ֣ט שָׁ֔מָּ/ה כִּ֣י לֹ֤א אוּכַל֙ לַ/עֲשׂ֣וֹת דָּבָ֔ר עַד בֹּאֲ/ךָ֖ שָׁ֑מָּ/ה עַל כֵּ֛ן קָרָ֥א שֵׁם הָ/עִ֖יר צֽוֹעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/022.yaml
  text: Hurry[a], escape there[b], for I cannot do anything until you arrive there.” Therefore the city was called Zoar.
translation:
  language: ml
  text: “വേഗം അവിടേക്കു രക്ഷപ്പെടുക; നീ അവിടെ എത്തുന്നതുവരെ എനിക്ക് ഒന്നും ചെയ്യാൻ കഴിയില്ല.” അതിനാൽ ആ പട്ടണത്തിന് സോവർ എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַהֵר
  choice: വേഗം
  rationale: ആജ്ഞാരൂപം അടിയന്തിരത പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും ശക്തവുമായ പ്രയോഗം.
- source_word: הִמָּלֵט
  choice: രക്ഷപ്പെടുക
  rationale: നിഫാൽ ആജ്ഞാരൂപമായ മלט ഇവിടെ ആപത്തിൽനിന്നു രക്ഷപ്പെടുക എന്ന അർഥം നൽകുന്നു.
- source_word: שָׁמָּה
  choice: അവിടേക്കു / അവിടെ
  rationale: ദിശാസൂചകമായ ‘അവിടേക്ക്’ ആദ്യ സന്ദർഭത്തിലും എത്തിച്ചേരുന്ന സ്ഥലം സൂചിപ്പിക്കുന്ന ‘അവിടെ’ രണ്ടാം സന്ദർഭത്തിലും സ്വാഭാവികമാണ്.
- source_word: לֹא אוּכַל
  choice: എനിക്ക് ... കഴിയില്ല
  rationale: മൂലത്തിലെ കഴിവില്ലായ്മയുടെ നേരിട്ടുള്ള പ്രസ്താവന മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: לַעֲשׂוֹת דָּבָר
  choice: ഒന്നും ചെയ്യാൻ
  rationale: അക്ഷരാർഥത്തിലെ ‘ഒരു കാര്യം ചെയ്യുക’ എന്നത് നിഷേധവാക്യത്തിൽ സ്വാഭാവികമായി ‘ഒന്നും ചെയ്യാൻ’ എന്നു വരുന്നു.
- source_word: עַד בֹּאֲךָ
  choice: നീ ... എത്തുന്നതുവരെ
  rationale: രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയമുള്ള infinitive construct-ന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ടാണ്
  rationale: പട്ടണനാമത്തിന്റെ കാരണവിവരണം അവതരിപ്പിക്കുന്ന ഹീബ്രു സൂത്രവാക്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: קָרָא שֵׁם הָעִיר
  choice: ആ പട്ടണത്തിന് ... എന്നു പേരിട്ടത്
  rationale: അക്ഷരാർഥം ‘അവൻ പട്ടണത്തിന്റെ പേര് വിളിച്ചു’ എന്നാണെങ്കിലും, കർത്താവ് വ്യക്തമല്ലാത്തതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക നാമകരണപ്രയോഗം സ്വീകരിച്ചു.
- source_word: צֹעַר
  choice: സോവർ
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; ‘ചെറുത്/നിസ്സാരം’ എന്ന പദശ്ലേഷം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ന്യായവിധിയുടെ സന്ദർഭത്തിലെ ‘എനിക്ക് കഴിയില്ല’ എന്ന പ്രസ്താവന
  choice: എനിക്ക് ഒന്നും ചെയ്യാൻ കഴിയില്ല
  alternative: എനിക്ക് ഒന്നും ചെയ്യാൻ പാടില്ല / ഞാൻ ഇതു ചെയ്യുകയില്ല
  rationale: לֹא אוּכַל നേരിട്ട് കഴിവില്ലായ്മ പറയുന്നു. സംസാരിക്കുന്നവന്റെ സ്വഭാവമോ ദൈവിക പ്രവർത്തനത്തിന്റെ രീതി എന്തെന്നോ വിശദീകരിച്ച് ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ മൂലവാക്യം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, അടിയന്തിരതയുള്ള നേരിട്ടുള്ള സംഭാഷണവും ഗൗരവമുള്ള ആഖ്യാനശൈലിയും നിലനിർത്തി. മലയാളത്തിൽ നാമകരണവാക്യം സ്വാഭാവികമാക്കുന്നതിനൊപ്പം ഹീബ്രു പദശ്ലേഷം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
