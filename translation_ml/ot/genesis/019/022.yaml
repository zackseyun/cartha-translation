  terminology: ‘രക്ഷപ്പെടുക,’ ‘എനിക്ക് ഒന്നും ചെയ്യാൻ കഴിയില്ല,’ and ‘സോവർ’ are appropriate. The place-name wordplay is appropriately retained in a footnote without translating the name in the text.
