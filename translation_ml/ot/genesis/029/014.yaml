id: GEN.29.14
reference: Genesis 29:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ לָבָ֔ן אַ֛ךְ עַצְמִ֥/י וּ/בְשָׂרִ֖/י אָ֑תָּה וַ/יֵּ֥שֶׁב עִמּ֖/וֹ חֹ֥דֶשׁ יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/014.yaml
  text: Then Laban said to him[b][a], “Surely you are my bone and my flesh.” And he stayed with him for a month.
translation:
  language: ml
  text: 'അപ്പോൾ ലാബാൻ അവനോടു പറഞ്ഞു: “തീർച്ചയായും നീ എന്റെ അസ്ഥിയും മാംസവും തന്നെയാണ്.”[a] അവൻ ലാബാനോടൊപ്പം ഒരു മാസം താമസിച്ചു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്റെ അസ്ഥിയും മാംസവും” എന്നത് അടുത്ത രക്തബന്ധത്തെയോ ബന്ധുത്വത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: b
    text: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ “ദിവസങ്ങളുടെ ഒരു മാസം”; അർഥം “ഒരു പൂർണ്ണ മാസം” എന്നും നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: אַךְ
  choice: തീർച്ചയായും
  rationale: ഇവിടെ ഈ പദം നിയന്ത്രണാർഥത്തിലല്ല, ബന്ധുത്വത്തെ ഊന്നി ഉറപ്പിക്കുന്നതായാണ് പ്രവർത്തിക്കുന്നത്.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: എന്റെ അസ്ഥിയും മാംസവും
  rationale: അടുത്ത രക്തബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും മറ്റു വേദഭാഗങ്ങളുമായുള്ള ബന്ധവും നിലനിർത്താൻ അക്ഷരാർഥത്തിന് അടുത്ത വിവർത്തനം സ്വീകരിച്ചു.
- source_word: אָתָּה
  choice: നീ ... തന്നെയാണ്
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ ‘തന്നെയാണ്’ എന്ന രൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചു
  rationale: ഒരു നിശ്ചിത കാലത്തേക്ക് ലാബാനോടൊപ്പം പാർത്തതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പദം ഉപയോഗിച്ചു.
- source_word: עִמּוֹ
  choice: ലാബാനോടൊപ്പം
  rationale: എബ്രായത്തിൽ സർവനാമമായിരുന്നാലും മലയാളത്തിൽ പരാമർശം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ മുൻപറഞ്ഞ ലാബാന്റെ പേര് ആവർത്തിച്ചു.
- source_word: חֹדֶשׁ יָמִים
  choice: ഒരു മാസം
  rationale: അക്ഷരാർഥത്തിൽ ‘ദിവസങ്ങളുടെ ഒരു മാസം’ എന്നുള്ള എബ്രായ കാലപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള സമാനരൂപം; ഒരു പൂർണ്ണ മാസം എന്ന സൂചന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
