translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ ബന്ധുത്വപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും കാലപ്രയോഗം സ്വാഭാവിക മലയാളമാക്കുകയും ചെയ്തു.
