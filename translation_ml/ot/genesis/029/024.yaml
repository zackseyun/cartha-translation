  yaml_path: translation/ot/genesis/029/024.yaml
  text: And Laban gave Zilpah his female servant to Leah his daughter as a female servant[a][b].
translation:
  language: ml
  text: ലാബാൻ തന്റെ ദാസിയായ സിൽപ്പയെ തന്റെ മകൾ ലേയയ്ക്ക് ദാസിയായി കൊടുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടിമസ്ത്രീയായി’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ആശ്രിതയും മിക്കവാറും അടിമത്തത്തിന്റെ നിലയിലായിരുന്ന ഒരു സ്ത്രീയെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ സാധാരണ കഥനാർഥമായ ‘കൊടുക്കുക’ നേരിട്ടും സ്വാഭാവികമായും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: לָהּ ... לְלֵאָה בִתּוֹ
  choice: തന്റെ മകൾ ലേയയ്ക്ക്
  rationale: לָהּ എന്ന ‘അവൾക്ക്’ എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തി പിന്നാലെയുള്ള ‘തന്റെ മകൾ ലേയയ്ക്ക്’ എന്ന പദസമുച്ചയത്തിൽ വ്യക്തമാകുന്നതിനാൽ, മലയാളത്തിൽ ആവർത്തനം ഒഴിവാക്കി സ്വാഭാവികമായി ഏകീകരിച്ചു.
- source_word: זִלְפָּה
  choice: സിൽപ്പ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ പതിവ് ബൈബിൾ ലിപ്യന്തരണത്തിന് അനുയോജ്യമായി നൽകിയിരിക്കുന്നു.
- source_word: שִׁפְחָתוֹ
  choice: തന്റെ ദാസിയായ
  rationale: സ്ത്രീലിംഗവും ആശ്രിതമായ, സാധ്യതയേറിയ അടിമസ്ഥിതിയും സൂചിപ്പിക്കുന്ന שִׁפְחָה എന്ന പദത്തിന് വായനാസൗകര്യമുള്ള ‘ദാസി’ ഉപയോഗിച്ചു; ഉടമസ്ഥബന്ധം ‘തന്റെ’ എന്നു നിലനിർത്തി.
- source_word: שִׁפְחָה
  choice: ദാസിയായി
  rationale: അവസാന നാമം സിൽപ്പയെ ഏതു നിലയിലാണ് കൊടുത്തതെന്ന് വ്യക്തമാക്കുന്നു. ‘ദാസിയായി’ ആ പങ്ക് സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; എബ്രായത്തിൽ ഇല്ലാത്ത ‘അവളുടെ’ എന്ന ഉടമസ്ഥസൂചന ചേർത്തിട്ടില്ല.
