translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. മൂലത്തിലെ שִׁפְחָה എന്ന പദത്തിന്റെ ആവർത്തനം ‘ദാസിയായ ... ദാസിയായി’ എന്നു നിലനിർത്തിയിട്ടുണ്ട്; ബന്ധത്തിന്റെ കഠിനമായ സാമൂഹിക യാഥാർഥ്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
