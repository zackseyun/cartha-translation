id: GEN.29.28
reference: Genesis 29:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ יַעֲקֹב֙ כֵּ֔ן וַ/יְמַלֵּ֖א שְׁבֻ֣עַ זֹ֑את וַ/יִּתֶּן ל֛/וֹ אֶת רָחֵ֥ל בִּתּ֖/וֹ ל֥/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/028.yaml
  text: And Jacob did so[a], and he completed this week; then Laban gave him Rachel his daughter as his wife.
translation:
  language: ml
  text: യാക്കോബ് അങ്ങനെ ചെയ്തു; അവൻ ഈ ആഴ്ച[a] പൂർത്തിയാക്കി. പിന്നെ ലാബാൻ തന്റെ മകളായ റാഹേലിനെ അവന് ഭാര്യയായി കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ വിവാഹവാരം.” ഹീബ്രു പദം അക്ഷരാർഥത്തിൽ ഏഴിന്റെ ഒരു കാലയളവിനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ അത് മിക്കവാറും വിവാഹാഘോഷത്തിന്റെ ഏഴുദിവസത്തെ കാലയളവാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ יַעֲקֹב כֵּן
  choice: യാക്കോബ് അങ്ങനെ ചെയ്തു
  rationale: עשה എന്ന ക്രിയയും ക്രിയാവിശേഷണമായി വരുന്ന כֵּן-ഉം ചേർന്ന് മുൻവാക്യത്തിലെ ലാബാന്റെ നിർദേശം യാക്കോബ് അനുസരിച്ചതിനെ സൂചിപ്പിക്കുന്നു; പ്രവർത്തനം അനാവശ്യമായി വിശദീകരിക്കാതെ ഈ അന്വയാർഥം നിലനിർത്തുന്നു.
- source_word: וַיְמַלֵּא
  choice: പൂർത്തിയാക്കി
  rationale: പിയേൽ രൂപത്തിലുള്ള מלא ഇവിടെ ഒരു നിശ്ചിത കാലയളവ് തികയ്ക്കുക എന്നർഥത്തിലാണ്; ആ കാലപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שְׁבֻעַ זֹאת
  choice: ഈ ഏഴുദിവസം
  rationale: שְׁבֻעַ അടിസ്ഥാനമായി ഏഴിന്റെ ഒരു കാലയളവിനെ സൂചിപ്പിക്കുന്നു. വിവാഹസന്ദർഭത്തിലെ ഒരാഴ്ചയാണെന്ന ആശയം വായനക്കാർക്ക് വ്യക്തമായി ലഭിക്കുമ്പോഴും പ്രധാനപാഠം 'വിവാഹവാരം' എന്ന് വ്യാഖ്യാനം ഉറപ്പിച്ചുപറയുന്നില്ല.
- source_word: וַיִּתֶּן לוֹ
  choice: പിന്നെ ലാബാൻ ... അവന് ... കൊടുത്തു
  rationale: ഹീബ്രുവിൽ കർത്താവ് സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്നു. മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ മുൻസന്ദർഭത്തിലെ ലാബാന്റെ പേര് വ്യക്തമാക്കുന്നു; 'പിന്നെ' സംഭവക്രമം സൂചിപ്പിക്കുന്നു.
- source_word: אֶת רָחֵל בִּתּוֹ
  choice: തന്റെ മകൾ റാഹേലിനെ
  rationale: നേരിട്ടുള്ള കർമത്തെയും ബന്ധസൂചനയെയും സ്വാഭാവിക മലയാള പദക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לוֹ לְאִשָּׁה
  choice: അവന് ഭാര്യയായി
  rationale: സ്ത്രീയെ വിവാഹത്തിൽ നൽകുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ഘടനയുടെ വിവാഹാർഥം ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ഹീബ്രു ആഖ്യാനത്തിന്റെ സംഭവക്രമവും 'ഏഴിന്റെ കാലയളവ്' എന്ന പ്രയോഗത്തിലെ നേരിയ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചിരിക്കുന്നു.
