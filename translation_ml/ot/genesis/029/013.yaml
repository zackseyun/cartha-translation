id: GEN.29.13
reference: Genesis 29:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ לָבָ֜ן אֶת שֵׁ֣מַע יַעֲקֹ֣ב בֶּן אֲחֹת֗/וֹ וַ/יָּ֤רָץ לִ/קְרָאת/וֹ֙ וַ/יְחַבֶּק ל/וֹ֙ וַ/יְנַשֶּׁק ל֔/וֹ וַ/יְבִיאֵ֖/הוּ אֶל בֵּית֑/וֹ וַ/יְסַפֵּ֣ר לְ/לָבָ֔ן אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/013.yaml
  text: And when Laban heard the news about Jacob[a], his sister’s son, he ran to meet him and embraced him and kissed him and brought him to his house[c][b]. Then Jacob told Laban all these things.
translation:
  language: ml
  text: ലാബാൻ തന്റെ സഹോദരിയുടെ മകനായ യാക്കോബിനെക്കുറിച്ചുള്ള വാർത്ത കേട്ടപ്പോൾ[a], അവനെ എതിരേൽക്കാൻ ഓടിച്ചെന്ന് അവനെ ആലിംഗനം ചെയ്തു ചുംബിച്ചു തന്റെ വീട്ടിലേക്കു കൂട്ടിക്കൊണ്ടുപോയി. പിന്നെ യാക്കോബ്[b] ഈ കാര്യങ്ങളെല്ലാം ലാബാനോടു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യാക്കോബിനെക്കുറിച്ചുള്ള വിവരം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം യാക്കോബിനെ സംബന്ധിച്ച വാർത്തയെയോ റിപ്പോർട്ടിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ കർത്താവ് പേരെടുത്തുപറയാതെ ‘അവൻ’ എന്നാണ്; സന്ദർഭം സൂചിപ്പിക്കുന്ന കർത്താവ് യാക്കോബാണ്.
    reason: source_ambiguity
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: കേട്ടപ്പോൾ
  rationale: כְּ ചേർന്ന infinitive construct ഇവിടെ കാലസൂചക ഉപവാക്യം അവതരിപ്പിക്കുന്നു. ‘കേട്ടപ്പോൾ’ സ്വാഭാവികമായ മലയാളത്തിൽ സംഭവക്രമം നിലനിർത്തുന്നു; ‘കേട്ടയുടൻ’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ നിർബന്ധമല്ലാത്ത ഉടനടിത്തം കൂടിവരും.
- source_word: שֵׁמַע יַעֲקֹב
  choice: യാക്കോബിനെക്കുറിച്ചുള്ള വാർത്ത
  rationale: שֵׁמַע ഇവിടെ കേൾവി എന്ന പ്രവൃത്തിയല്ല, യാക്കോബിനെ സംബന്ധിച്ച വാർത്തയെയോ വിവരത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: בֶּן אֲחֹתוֹ
  choice: തന്റെ സഹോദരിയുടെ മകനായ
  rationale: ‘അനന്തരവൻ’ എന്ന ചുരുക്കപ്പദത്തിനു പകരം എബ്രായത്തിലെ ബന്ധവിവരണം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיָּרָץ לִקְרָאתוֹ
  choice: അവനെ എതിരേൽക്കാൻ ഓടിച്ചെന്ന്
  rationale: לִקְרָאתוֹ എന്നത് അവനെ കാണാനോ എതിരേൽക്കാനോ മുന്നോട്ടുചെല്ലുന്നതിനെ സൂചിപ്പിക്കുന്നു; കുടുംബസ്വീകരണത്തിന്റെ ഈ സന്ദർഭത്തിൽ ‘എതിരേൽക്കാൻ’ സ്വാഭാവികമാണ്.
- source_word: וַיְחַבֶּק לוֹ
  choice: അവനെ ആലിംഗനം ചെയ്തു
  rationale: חבק എന്ന ക്രിയയുടെ അർഥം നേരിട്ട് നൽകുകയും വിവരണത്തിന്റെ ഗൗരവമുള്ള ശൈലി പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיְנַשֶּׁק לוֹ
  choice: ചുംബിച്ചു
  rationale: נשׁק എന്ന ക്രിയ കുടുംബാംഗങ്ങൾ തമ്മിലുള്ള അഭിവാദ്യത്തിന്റെ സന്ദർഭത്തിൽ സാധാരണ അർഥത്തിൽ വിവർത്തനം ചെയ്തു.
- source_word: וַיְבִיאֵהוּ אֶל־בֵּיתוֹ
  choice: തന്റെ വീട്ടിലേക്കു കൂട്ടിക്കൊണ്ടുപോയി
  rationale: ഹിഫീൽ രൂപം ‘കൊണ്ടുവരുക/കൊണ്ടുപോകുക’ എന്ന causative അർഥം നൽകുന്നു. മലയാളത്തിലെ ദൃശ്യകോണിൽ ‘കൂട്ടിക്കൊണ്ടുപോയി’ സ്വാഭാവികമാണ്; אֶל എന്നതിന്റെ ലക്ഷ്യബോധവും നിലനിർത്തുന്നു.
- source_word: וַיְסַפֵּר לְלָבָן
  choice: യാക്കോബ് ... ലാബാനോടു പറഞ്ഞു
  rationale: ക്രിയയുടെ വ്യാകരണപരമായ കർത്താവ് വ്യക്തമാക്കപ്പെട്ടിട്ടില്ലെങ്കിലും സന്ദർഭത്തിൽ യാക്കോബാണ് ലാബാനോട് വിവരിക്കുന്നത്. മലയാളത്തിൽ കർത്താവിന്റെ മാറ്റം വ്യക്തതയ്ക്കായി പേരെടുത്തുപറഞ്ഞു.
- source_word: אֵת כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: ഈ കാര്യങ്ങളെല്ലാം
  rationale: דְּבָרִים എന്നതിന് വാക്കുകൾ, കാര്യങ്ങൾ, സംഭവങ്ങൾ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ യാക്കോബ് വിവരിച്ച ഉള്ളടക്കത്തെ വിശാലമായി സൂചിപ്പിക്കുന്ന ‘കാര്യങ്ങൾ’ അനുയോജ്യമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. ‘ആലിംഗനം ചെയ്തു’, ‘എതിരേൽക്കാൻ’ എന്നീ പദങ്ങൾ ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. ആവർത്തിച്ചുള്ള എബ്രായ വാവ്-ക്രമത്തെ മലയാളത്തിൽ അനാവശ്യമായി ‘അവൻ... അവൻ...’ എന്നു ആവർത്തിക്കാതെ ഒഴുക്കോടെ അവതരിപ്പിച്ചു.
