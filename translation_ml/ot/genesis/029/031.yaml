id: GEN.29.31
reference: Genesis 29:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤רְא יְהוָה֙ כִּֽי שְׂנוּאָ֣ה לֵאָ֔ה וַ/יִּפְתַּ֖ח אֶת רַחְמָ֑/הּ וְ/רָחֵ֖ל עֲקָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/031.yaml
  text: When the LORD saw that Leah was hated, he opened her womb, but Rachel was barren.
translation:
  language: ml
  text: ലേയ വെറുക്കപ്പെട്ടവളാണെന്ന് യഹോവ കണ്ടപ്പോൾ, അവിടുന്ന് അവളുടെ ഗർഭം തുറന്നു; എന്നാൽ റാഹേൽ വന്ധ്യയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂנוּאָה
  choice: വെറുക്കപ്പെട്ടവൾ
  rationale: എബ്രായപദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘വെറുക്കപ്പെട്ട’ എന്നത് നിലനിർത്തുന്നു; ‘സ്നേഹിക്കപ്പെടാത്ത’ എന്നു മയപ്പെടുത്തി ബന്ധത്തിലെ തീവ്രതയെ നിശ്ശബ്ദമായി പരിഹരിക്കുന്നില്ല.
- source_word: וַיִּפְתַּח אֶת־רַחְמָהּ
  choice: അവളുടെ ഗർഭം തുറന്നു
  rationale: ഗർഭധാരണശേഷി നൽകിയതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധം ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: עֲקָרָה
  choice: വന്ധ്യയായിരുന്നു
  rationale: സന്താനോൽപാദനശേഷിയില്ലാത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്ന കൃത്യവും മാന്യവുമായ സാധാരണ മലയാളപദം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: വ്യക്തിനാമമായ ദൈവനാമത്തെ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നാക്കി മാറ്റാതെ മലയാളത്തിലെ പരിചിത ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ലേയയോടുള്ള സമീപനത്തിന്റെ തീവ്രത
  choice: വെറുക്കപ്പെട്ടവൾ
  alternative: സ്നേഹിക്കപ്പെടാത്തവൾ
  rationale: ശְׂנוּאָה എന്ന മൂലപദത്തിന്റെ ശക്തി സംരക്ഷിക്കുകയും, സന്ദർഭപരമായ താരതമ്യാർഥം മാത്രം സ്വീകരിച്ച് വാചകത്തെ മയപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ഗർഭധാരണത്തിൽ ദൈവത്തിന്റെ പ്രവർത്തനം
  choice: അവിടുന്ന് അവളുടെ ഗർഭം തുറന്നു
  alternative: അവൾക്ക് ഗർഭധാരണശേഷി നൽകി
  rationale: മൂലവാചകത്തിലെ ദൈവിക പ്രവർത്തനവും ദേഹസംബന്ധിയായ രൂപകവും നിലനിർത്തുന്നു; അതിന്റെ പ്രവർത്തനാർത്ഥം സ്വാഭാവികമായി ഗ്രഹിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ വൈരുധ്യഘടന ‘എന്നാൽ’ ഉപയോഗിച്ച് വ്യക്തമായി നിലനിർത്തി.
