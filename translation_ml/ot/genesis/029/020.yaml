reference: Genesis 29:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֧ד יַעֲקֹ֛ב בְּ/רָחֵ֖ל שֶׁ֣בַע שָׁנִ֑ים וַ/יִּהְי֤וּ בְ/עֵינָי/ו֙ כְּ/יָמִ֣ים אֲחָדִ֔ים בְּ/אַהֲבָת֖/וֹ אֹתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/020.yaml
  text: So Jacob served seven years for Rachel[a], and they seemed like only a few days to him because of his love for her.
translation:
  language: ml
  text: അങ്ങനെ യാക്കോബ് റാഹേലിനുവേണ്ടി ഏഴു വർഷം സേവിച്ചു. അവളോടുള്ള സ്നേഹം നിമിത്തം ആ വർഷങ്ങൾ അവന് ഏതാനും ദിവസങ്ങൾപോലെ തോന്നി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: സേവിച്ചു
  rationale: עבד എന്ന ക്രിയയ്ക്ക് ‘സേവിക്കുക’, ‘ജോലി ചെയ്യുക’ എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ റാഹേലിനെ വിവാഹം കഴിക്കുന്നതിനായി യാക്കോബ് ചെയ്ത ഉടമ്പടിപരമായ അധ്വാനത്തെ ‘സേവിച്ചു’ എന്നത് സംക്ഷിപ്തമായും ബന്ധപരമായ ഭാവം നിലനിർത്തിയും അറിയിക്കുന്നു.
- source_word: בְּרָחֵל
  choice: റാഹേലിനുവേണ്ടി
  rationale: ഈ സന്ദർഭത്തിലെ ב എന്ന ഉപസർഗം വധുവിനെ ലഭിക്കുന്നതിനായി ചെയ്ത സേവനത്തെ സൂചിപ്പിക്കുന്നു. ‘റാഹേലിനുവേണ്ടി’ എന്നത് ഉദ്ദേശ്യവും പ്രയോജനവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കൈമാറ്റവസ്തുവെന്ന ധ്വനി അനാവശ്യമായി ശക്തമാക്കുന്നില്ല.
- source_word: שֶׁבַע שָׁנִים
  choice: ഏഴു വർഷം
  rationale: സംഖ്യയും കാലയളവും നേരിട്ട്, സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു.
- source_word: וַיִּהְיוּ בְעֵינָיו
  choice: അവന് ... തോന്നി
  rationale: അക്ഷരാർഥമായ ‘അവന്റെ കണ്ണുകളിൽ അവ ആയിരുന്നു’ എന്ന ഹീബ്രു പ്രയോഗം വ്യക്തിപരമായ അനുഭവബോധത്തെ സൂചിപ്പിക്കുന്നു. ‘അവന് ... തോന്നി’ അതിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כְּיָמִים אֲחָדִים
  choice: ഏതാനും ദിവസങ്ങൾപോലെ
  rationale: പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ചില/ഏതാനും ദിവസങ്ങൾപോലെ’ എന്നാണ്. ‘ഏതാനും ദിവസങ്ങൾപോലെ’ ഏഴു വർഷം വളരെ ചുരുങ്ങിയതായി അനുഭവപ്പെട്ടുവെന്ന താരതമ്യം അധിക വ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
- source_word: בְּאַהֲבָתוֹ אֹתָהּ
  choice: അവളോടുള്ള സ്നേഹം നിമിത്തം
  rationale: ב ഇവിടെ സാഹചര്യമോ കാരണമോ സൂചിപ്പിക്കുന്നു. ‘സ്നേഹം നിമിത്തം’ കാലയളവ് ചുരുങ്ങിയതായി തോന്നിയതിന്റെ കാരണം dignified, സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
