  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ഹീബ്രുവിലെ അനുഭവപരമായ ‘അവന്റെ കണ്ണുകളിൽ’ എന്ന പ്രയോഗം സ്വാഭാവികമായി ‘അവന് ... തോന്നി’ എന്നു നൽകിയിരിക്കുന്നു. ‘അങ്ങനെ’ മുൻവാക്യത്തിലെ ഉടമ്പടിയുടെ ഫലത്തെ ബന്ധിപ്പിക്കുന്നു.
