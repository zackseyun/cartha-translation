lexical_decisions:
- source_word: וַיַּרְא
  choice: അവൻ നോക്കി
  rationale: ראה എന്ന ക്രിയയുടെ കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന രൂപമാണിത്. തുടർന്നുവരുന്ന ദൃശ്യത്തിലേക്കു ശ്രദ്ധ തിരിക്കുന്നതിനാൽ ‘നോക്കി’ സ്വാഭാവികവും സജീവവുമാണ്; ‘കണ്ടു’ എന്നതും സാധ്യമാണ്.
- source_word: וְהִנֵּה ... וְהִנֵּה
  choice: അതാ ... അതാ
  rationale: הִנֵּה ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരകണമാണ്. എബ്രായത്തിലെ ആവർത്തനവും ദൃശ്യത്തിന്റെ സജീവതയും നിലനിർത്താൻ രണ്ടിടത്തും ‘അതാ’ ഉപയോഗിച്ചു.
- source_word: בְאֵר בַּשָּׂדֶה
  choice: വയലിൽ ഒരു കിണർ
  rationale: בְּאֵר എന്നതിന് സാധാരണ അർഥം ‘കിണർ’; שָׂדֶה ഇവിടെ ‘വയൽ’ അഥവാ തുറസ്സായ നാട്ടിൻപുറം എന്ന അർഥം നൽകുന്നു. നേരിട്ടും സ്വാഭാവികവുമായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: שְׁלֹשָׁה עֶדְרֵי צֹאן
  choice: മൂന്നു ആട്ടിൻപറ്റങ്ങൾ
  rationale: עֵדֶר മൃഗക്കൂട്ടത്തെയും צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ കന്നുകാലികളെയും സൂചിപ്പിക്കാം. മലയാളത്തിൽ ഈ ഇടയസന്ദർഭത്തിന് സ്വാഭാവികമായ പൊതുപദമായി ‘ആട്ടിൻപറ്റങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: רֹבְצִים
  choice: കിടക്കുന്നു
  rationale: רבץ മൃഗങ്ങൾ കിടക്കുന്നതോ വിശ്രമിക്കുന്നതോ സൂചിപ്പിക്കുന്നു. ദൃശ്യത്തിന്റെ നേരിട്ടുള്ള വിവരണം നിലനിർത്താൻ ‘കിടക്കുന്നു’ ഉപയോഗിച്ചു.
- source_word: עָלֶיהָ
  choice: അതിനരികിൽ
  rationale: പദാനുപദമായി ‘അതിന്മേൽ/അതിനു മുകളിൽ’ എന്നാകാമെങ്കിലും കിണറുമായി ബന്ധപ്പെട്ട സ്ഥലസൂചന ഇവിടെ സമീപസ്ഥതയാണ്. അതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘അതിനരികിൽ’ എന്നു നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: כִּי מִן הַבְּאֵר הַהִוא יַשְׁקוּ הָעֲדָרִים
  choice: കാരണം, ആ കിണറ്റിൽനിന്നാണ് പറ്റങ്ങൾക്കു വെള്ളം കൊടുത്തിരുന്നത്
  rationale: כִּי വിശദീകരണപരമായ കാരണബന്ധം നൽകുന്നു. יַשְׁקוּ പതിവായി ചെയ്തിരുന്ന പ്രവൃത്തിയായി മനസ്സിലാക്കാവുന്നതും പ്രവർത്തകർ നിർദ്ദിഷ്ടരല്ലാത്തതുമാകയാൽ മലയാളത്തിൽ സ്വാഭാവികമായ അനിർദ്ദിഷ്ട കർമണപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: וְהָאֶבֶן גְּדֹלָה עַל פִּי הַבְּאֵר
  choice: കിണറിന്റെ വായ്ക്കൽ ഒരു വലിയ കല്ല് ഉണ്ടായിരുന്നു
  rationale: עַל־פִּי הַבְּאֵר അക്ഷരാർഥത്തിൽ ‘കിണറിന്റെ വായിൽ’ എന്നാണ്, അതായത് തുറവിന്മേൽ/തുറവിടത്ത്. വിവരണാത്മക ഉപവാക്യവും വലിയ കല്ലിന്റെ സാന്നിധ്യവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തി.
