translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ഇരട്ട הִנֵּה ‘അതാ’ എന്നു രണ്ടുതവണ നിലനിർത്തി; അനിർദ്ദിഷ്ട ബഹുവചന കർത്താവിനെ മലയാളത്തിൽ സ്വാഭാവികമായ കർമണരൂപത്തിലാക്കി. ‘ആട്ടിൻപറ്റങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് സുഗമമാണെങ്കിലും צֹאן എന്ന പദത്തിന്റെ പരിധിയിൽ ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാമെന്ന അർഥവ്യാപ്തി വിവർത്തനനിർണ്ണയത്തിൽ അംഗീകരിച്ചിട്ടുണ്ട്.
