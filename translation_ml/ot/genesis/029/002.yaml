  yaml_path: translation/ot/genesis/029/002.yaml
  text: He looked[a], and behold, there was a well in the field, and behold, three flocks of sheep were lying there beside it, because from that well they watered the flocks[e][d][c][b]. And the stone on the mouth of the well was large.
translation:
  language: ml
  text: അവൻ നോക്കി[a]; അതാ, വയലിൽ ഒരു കിണർ ഉണ്ടായിരുന്നു; അതാ, അതിനരികിൽ[b] മൂന്നു ആട്ടിൻപറ്റങ്ങൾ കിടന്നിരുന്നു. കാരണം, ആ കിണറ്റിൽനിന്നാണ് അവർ പറ്റങ്ങൾക്കു വെള്ളം കൊടുക്കുമായിരുന്നു[c]. കിണറിന്റെ വായ്ക്കൽ[d] ഒരു വലിയ കല്ല് ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
