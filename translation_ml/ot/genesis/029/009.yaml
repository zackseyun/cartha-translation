id: GEN.29.9
reference: Genesis 29:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עוֹדֶ֖/נּוּ מְדַבֵּ֣ר עִמָּ֑/ם וְ/רָחֵ֣ל בָּ֗אָה עִם הַ/צֹּאן֙ אֲשֶׁ֣ר לְ/אָבִ֔י/הָ כִּ֥י רֹעָ֖ה הִֽוא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/009.yaml
  text: While he was still speaking with them[a], Rachel came with her father’s flock, for she was a shepherdess.
translation:
  language: ml
  text: അവൻ അവരോടു സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, റാഹേൽ അവളുടെ പിതാവിന്റെ ആട്ടിൻകൂട്ടവുമായി വന്നു; കാരണം, അവൾ ഒരു ഇടയത്തിയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൾ ആടുകളെ മേയിക്കുന്നവളായിരുന്നു.” ഹീബ്രുവിൽ റാഹേലിന്റെ ഈ ചുമതലയെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר עִמָּם
  choice: അവൻ അവരോടു സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾത്തന്നെ
  rationale: ഹീബ്രു പ്രയോഗം ആ സമയത്ത് തുടരുകയായിരുന്ന സംസാരവും റാഹേലിന്റെ വരവും ഒരേസമയം സംഭവിച്ചതായി സൂചിപ്പിക്കുന്നു. ഈ മലയാളപ്രയോഗം ആ കാലപരമായ ഒത്തുചേരൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וְרָחֵל
  choice: റാഹേൽ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പതിവായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: בָּאָה
  choice: വന്നു
  rationale: בוא എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥം ലളിതമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: עִם הַצֹּאן אֲשֶׁר לְאָבִיהָ
  choice: തന്റെ അപ്പന്റെ ആട്ടിൻകൂട്ടവുമായി
  rationale: ആട്ടിൻകൂട്ടം അവളുടെ അപ്പന്റേതാണെന്ന ബന്ധവാക്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥപ്രയോഗമായി അവതരിപ്പിക്കുന്നു. צֹאן എന്ന കൂട്ടവാചകത്തിന് സന്ദർഭോചിതമായി ‘ആട്ടിൻകൂട്ടം’ തിരഞ്ഞെടുത്തു.
- source_word: כִּי
  choice: ;
  rationale: ഇവിടെ כִּי റാഹേൽ ആട്ടിൻകൂട്ടവുമായി വന്നതിന്റെ വിശദീകരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ അർദ്ധവിരാമത്തിനു പിന്നാലെയുള്ള വിശദീകരണവാക്യം ഈ ബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: רֹעָה הִוא
  choice: അവൾ ആടുകളെ മേയിക്കുന്നവളായിരുന്നു
  rationale: സ്ത്രീലിംഗത്തിലുള്ള പങ്കിനെ മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ രീതിയിൽ അറിയിക്കുന്നു; വെറും ആ സമയത്തെ പ്രവർത്തനം മാത്രമല്ല, അവളുടെ പതിവായ ചുമതലയാണ് ഉദ്ദേശ്യമെന്നതും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ആടുകളെ മേയിക്കുന്നവൾ’ സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചു; കൂടുതൽ നാമപദപരമായ ‘ഇടയത്തി’ അടിക്കുറിപ്പിൽ നൽകി.
