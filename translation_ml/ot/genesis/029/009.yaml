- from: അവൻ അവരോടു സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾത്തന്നെ, റാഹേൽ തന്റെ അപ്പന്റെ ആട്ടിൻകൂട്ടവുമായി വന്നു; അവൾ ആടുകളെ മേയിക്കുന്നവളായിരുന്നു.[a]
  to: അവൻ അവരോടു സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, റാഹേൽ അവളുടെ പിതാവിന്റെ ആട്ടിൻകൂട്ടവുമായി വന്നു; കാരണം, അവൾ ഒരു ഇടയത്തിയായിരുന്നു.[a]
