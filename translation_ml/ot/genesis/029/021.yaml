id: GEN.29.21
reference: Genesis 29:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יַעֲקֹ֤ב אֶל לָבָן֙ הָבָ֣/ה אֶת אִשְׁתִּ֔/י כִּ֥י מָלְא֖וּ יָמָ֑/י וְ/אָב֖וֹאָה אֵלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/021.yaml
  text: Then Jacob said to Laban[a], “Give me my wife, for my days are fulfilled, that I may go in to her.”
translation:
  language: ml
  text: 'അപ്പോൾ യാക്കോബ് ലാബാനോടു പറഞ്ഞു: “എന്റെ ഭാര്യയെ എനിക്കു തരുക; എന്റെ കാലാവധി പൂർത്തിയായല്ലോ. ഞാൻ അവളുടെ അടുക്കൽ ചെല്ലട്ടെ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവളുടെ അടുക്കൽ ചെല്ലുക” എന്നത് വിവാഹബന്ധം ശാരീരികമായി പൂർത്തിയാക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ സൗമ്യോക്തിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: എനിക്കു തരുക
  rationale: ലാബാനോടുള്ള കല്പനാരൂപത്തിലുള്ള അപേക്ഷയാണ്. വിവാഹസന്ദർഭത്തിൽ സൂചിതമായ പരോക്ഷകർമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶת אִשְׁתִּי
  choice: എന്റെ ഭാര്യയെ
  rationale: אִשָּׁה എന്ന പദം ഇവിടെ യാക്കോബിനായി നിശ്ചയിക്കപ്പെട്ട വിവാഹപങ്കാളിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഭാര്യ’ എന്നത് സന്ദർഭോചിതമാണ്.
- source_word: כִּי מָלְאוּ יָמָי
  choice: എന്റെ കാലാവധി പൂർത്തിയായല്ലോ
  rationale: അക്ഷരാർഥത്തിലെ ‘എന്റെ ദിവസങ്ങൾ നിറഞ്ഞു/പൂർത്തിയായി’ എന്ന പ്രയോഗം റാഹേലിനുവേണ്ടിയുള്ള കരാർസേവനകാലം തീർന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְאָבוֹאָה אֵלֶיהָ
  choice: ഞാൻ അവളുടെ അടുക്കൽ ചെല്ലട്ടെ
  rationale: בוא אל എന്ന എബ്രായ സൗമ്യോക്തി സംരക്ഷിക്കുകയും cohortative ഭാവം ‘ചെല്ലട്ടെ’ എന്നതിലൂടെ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ ലൈംഗിക സൗമ്യോക്തി മുഖ്യവാചകത്തിൽ നിലനിർത്തി, അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
