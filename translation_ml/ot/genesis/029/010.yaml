source:
  edition: WLC
  text: וַ/יְהִ֡י כַּ/אֲשֶׁר֩ רָאָ֨ה יַעֲקֹ֜ב אֶת רָחֵ֗ל בַּת לָבָן֙ אֲחִ֣י אִמּ֔/וֹ וְ/אֶת צֹ֥אן לָבָ֖ן אֲחִ֣י אִמּ֑/וֹ וַ/יִּגַּ֣שׁ יַעֲקֹ֗ב וַ/יָּ֤גֶל אֶת הָ/אֶ֨בֶן֙ מֵ/עַל֙ פִּ֣י הַ/בְּאֵ֔ר וַ/יַּ֕שְׁקְ אֶת צֹ֥אן לָבָ֖ן אֲחִ֥י אִמּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/010.yaml
  text: And when Jacob saw Rachel[a], the daughter of Laban, his mother’s brother, and the flock of Laban, his mother’s brother, Jacob came near and rolled the stone from the mouth of the well, and watered the flock of Laban, his mother’s brother.
translation:
  language: ml
  text: യാക്കോബ് തന്റെ അമ്മയുടെ സഹോദരനായ ലാബാന്റെ മകൾ റാഹേലിനെയും[a], തന്റെ അമ്മയുടെ സഹോദരനായ ലാബാന്റെ ആട്ടിൻപറ്റത്തെയും കണ്ടപ്പോൾ, അവൻ അടുത്തുചെന്ന് കിണറിന്റെ വായിൽനിന്ന് കല്ല് ഉരുട്ടിമാറ്റി, തന്റെ അമ്മയുടെ സഹോദരനായ ലാബാന്റെ ആട്ടിൻപറ്റത്തിനു വെള്ളം കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യത്തിൽ ‘തന്റെ അമ്മയുടെ സഹോദരനായ’ എന്ന ബന്ധവാചകം ഹീബ്രായ പാഠം മൂന്നുതവണ ആവർത്തിക്കുന്നു; യാക്കോബിന് ലാബാനുമായുള്ള കുടുംബബന്ധത്തിന് ഇതിലൂടെ ഊന്നൽ ലഭിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: കണ്ടപ്പോൾ
  rationale: ഹീബ്രായ ആഖ്യാനസൂത്രത്തിന്റെ കാലസൂചന സ്വാഭാവികമായ മലയാള ഉപവാക്യഘടനയിൽ പ്രകടമാക്കുന്നു; ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്ന അത്യന്തം അക്ഷരാർഥപരമായ രൂപം ഒഴിവാക്കുന്നു.
- source_word: רָאָה
  choice: കണ്ടു
  rationale: ഇവിടെ ദൃശ്യമായി കാണുക എന്ന നേരിട്ടുള്ള അർഥമാണ്.
- source_word: בַּת לָבָן
  choice: ലാബാന്റെ മകൾ
  rationale: റാഹേലിന്റെ കുടുംബബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲחִי אִמּוֹ
  choice: തന്റെ അമ്മയുടെ സഹോദരനായ
  rationale: ‘അമ്മാവൻ’ എന്നു ചുരുക്കാതെ, മൂലപാഠത്തിലെ വ്യക്തമായ ബന്ധവാചകവും അതിന്റെ മൂന്നുതവണത്തെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: צֹאן
  choice: ആട്ടിൻപറ്റം
  rationale: ചെമ്മരിയാടുകളോ കോലാടുകളോ ഉൾപ്പെടാവുന്ന കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന צֹאן എന്ന സമാഹാരപദത്തിന് സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം; ഇനത്തെ കൃത്യമായി നിർണയിക്കാത്ത കൂട്ടാർഥം ഉദ്ദേശിക്കുന്നു.
- source_word: וַיִּגַּשׁ
  choice: അടുത്തുചെന്ന്
  rationale: പ്രവർത്തനസ്ഥലത്തേക്ക് യാക്കോബ് സമീപിച്ചതിനെ ആഖ്യാനപ്രവാഹത്തിന് യോജിച്ച രീതിയിൽ അറിയിക്കുന്നു.
- source_word: וַיָּגֶל
  choice: ഉരുട്ടിമാറ്റി
  rationale: കല്ല് ഉരുട്ടുന്ന ദൃശ്യപ്രവർത്തനം നിലനിർത്തുകയും അത് കിണറിന്റെ വായിൽനിന്ന് മാറ്റിയെന്ന ഫലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: കിണറിന്റെ വായിൽനിന്ന്
  rationale: ‘കിണറിന്റെ വായ്’ എന്ന ഹീബ്രായ രൂപകം മലയാളത്തിലും ഗ്രാഹ്യമായതിനാൽ സംരക്ഷിക്കുന്നു.
- source_word: וַיַּשְׁקְ
  choice: വെള്ളം കൊടുത്തു
  rationale: കന്നുകാലികൾക്ക് കുടിക്കാൻ വെള്ളം നൽകുക എന്ന ഹിഫീൽ ക്രിയയുടെ അർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു.
