translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു വ്യക്തമായ മാന്യമായ മലയാളം. എബ്രായത്തിലെ സ്ത്രീലിംഗ നിർദ്ദേശകങ്ങൾ ‘ഇവളുടെ/ഇവളെയും’ എന്നായി നിലനിർത്തി; സാംസ്കാരികമായി നിർദ്ദിഷ്ടമായ ‘വാരം’ മുഖ്യവാചകത്തിൽ ‘വിവാഹവാരം’ എന്നു വ്യക്തമാക്കി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
