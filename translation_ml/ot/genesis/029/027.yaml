source:
  edition: WLC
  text: מַלֵּ֖א שְׁבֻ֣עַ זֹ֑את וְ/נִתְּנָ֨ה לְ/ךָ֜ גַּם אֶת זֹ֗את בַּ/עֲבֹדָה֙ אֲשֶׁ֣ר תַּעֲבֹ֣ד עִמָּדִ֔/י ע֖וֹד שֶֽׁבַע שָׁנִ֥ים אֲחֵרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/027.yaml
  text: Complete this woman's bridal week[c][b][a], and we will give you this one also in return for the work that you will do with me for another seven years.
translation:
  language: ml
  text: ഇവളുടെ വിവാഹവാരം പൂർത്തിയാക്കുക[a]; പിന്നെ, നീ എനിക്കുവേണ്ടി ഏഴു വർഷം കൂടി ചെയ്യുന്ന വേലയ്ക്കു പകരമായി ഇവളെയും നിനക്കു തരും[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇവളുടെ വാരം പൂർത്തിയാക്കുക’; അന്നത്തെ പതിവായ വിവാഹാഘോഷവാരത്തെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: ‘ഇവളെയും നിനക്കു നൽകപ്പെടും.’ എബ്രായ ക്രിയ രൂപപരമായി മൂന്നാംപുരുഷ സ്ത്രീലിംഗ ഏകവചനമാണ്; എന്നാൽ സന്ദർഭത്തിൽ മറ്റേ മകളെയും നൽകുമെന്ന ലാബാന്റെ വാഗ്ദാനമാണത്.'
    reason: lexical_alternative
  - marker: c
    text: '‘എനിക്കുവേണ്ടി ചെയ്യുന്ന’ എന്നതിനു മറ്റൊരു പരിഭാഷ: ‘എന്നെ സേവിക്കുന്ന.’ എബ്രായ ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ‘വേല ചെയ്യുക’ എന്നോ ‘സേവിക്കുക’ എന്നോ അർത്ഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: പൂർത്തിയാക്കുക
  rationale: מלא എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം നിശ്ചിത കാലയളവ് മുഴുവനാക്കാൻ യാക്കോബിനോടു പറയുന്നു; ‘പൂർത്തിയാക്കുക’ ആജ്ഞയുടെ ശക്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: שְׁבֻעַ זֹאת
  choice: ഇവളുടെ വിവാഹവാരം
  rationale: ശബ്‌ദാർത്ഥത്തിൽ ‘ഇവളുടെ വാരം’; സന്ദർഭത്തിൽ ലേയയുടെ പതിവായ വിവാഹാഘോഷവാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വിവാഹവാരം’ സാംസ്കാരിക അർത്ഥം ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
- source_word: וְנִתְּנָה לְךָ
  choice: നിനക്കു തരും
  rationale: രൂപപരമായി മൂന്നാംപുരുഷ സ്ത്രീലിംഗ ഏകവചനമായിരുന്നാലും സന്ദർഭത്തിൽ മറ്റേ മകളെയും നൽകുമെന്ന ലാബാന്റെ വാഗ്ദാനമാണ്; മലയാളത്തിൽ കർത്താവ് സന്ദർഭത്തിൽനിന്നു വ്യക്തമാകുന്നതിനാൽ സ്വാഭാവികമായി ഒഴിവാക്കാം.
- source_word: גַּם אֶת זֹאת
  choice: ഇവളെയും
  rationale: മറ്റേ മകളായ റാഹേലിനെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ നിർദ്ദേശകത്തിന്റെ ഊന്നലും גם എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽഭാവവും നിലനിർത്തുന്നു.
- source_word: בַּעֲבֹדָה
  choice: ചെയ്യുന്ന വേലയ്ക്കു പകരമായി
  rationale: പ്രത്യുപകാരമോ വ്യവസ്ഥയോ സൂചിപ്പിക്കുന്ന ഇടപാട്‌ഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: תַּעֲבֹד עִמָּדִי
  choice: നീ എനിക്കുവേണ്ടി ... ചെയ്യുന്ന
  rationale: עבד എന്നതിന് ‘വേല ചെയ്യുക’ എന്നും ‘സേവിക്കുക’ എന്നും അർത്ഥമാകാം. തൊഴിൽക്രമത്തിന്റെ സന്ദർഭത്തിൽ ‘എനിക്കുവേണ്ടി ചെയ്യുന്ന’ എന്നത് ഉദ്ദേശ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  choice: ഏഴുവർഷംകൂടി
  rationale: עוֹד എന്നതിന്റെ അധികകാലഭാവവും അֲחֵרוֹת സൂചിപ്പിക്കുന്ന വേറൊരു ഏഴുവർഷകാലവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
