  yaml_path: translation/ot/genesis/029/006.yaml
  text: He said to them[a], “Is he well?” And they said, “He is well. And look, Rachel his daughter is coming with the flock.”
translation:
  language: ml
  text: 'അവൻ അവരോട്, “അവന് സുഖമാണോ?[a]” എന്നു ചോദിച്ചു. അവർ പറഞ്ഞു: “സുഖമാണ്. അതാ, അവന്റെ മകൾ റാഹേൽ ആട്ടിൻപറ്റവുമായി വരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന് എല്ലാം സുഖമാണോ?” ഇവിടെ എബ്രായയിലെ ‘ശാലോം’ എന്ന പദം സമാധാനം എന്ന അമൂർത്ത അർഥത്തിലല്ല, സുഖം അല്ലെങ്കിൽ ക്ഷേമം എന്ന അർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲשָׁלוֹם לוֹ
  choice: അദ്ദേഹത്തിനു സുഖമാണോ?
  rationale: שָׁלוֹם ഇവിടെ സമാധാനം എന്ന അമൂർത്ത ആശയത്തേക്കാൾ ലാബാന്റെ സുഖക്ഷേമത്തെക്കുറിച്ചുള്ള അന്വേഷണമാണ്. ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שָׁלוֹם
  choice: സുഖമാണ്
  rationale: മൂലത്തിലെ ചോദ്യപദം തന്നെ മറുപടിയിലും ആവർത്തിക്കുന്ന ചുരുക്കവും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: കാഴ്ചയിൽ ഉടൻ പ്രത്യക്ഷമായിരിക്കുന്ന കാര്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּהയുടെ സൂചനാത്മക ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: רָחֵל
  choice: റാഹേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בִּתּוֹ
  choice: അദ്ദേഹത്തിന്റെ മകൾ
  rationale: ഏകവചന പുരുഷലിംഗ പ്രത്യയം ലാബാനെ സൂചിപ്പിക്കുന്നു; കുടുംബബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בָּאָה
  choice: വരുന്നു
  rationale: הִנֵּה അവതരിപ്പിക്കുന്ന ഉടനെയുള്ള ദൃശ്യരംഗത്തിന് യോജിച്ചുകൊണ്ട് നടന്നുകൊണ്ടിരിക്കുന്ന വരവ് പ്രകടമാക്കുന്നു.
- source_word: עִם הַצֹּאן
  choice: ആട്ടിൻപറ്റവുമായി
  rationale: צֹאן ചെറിയ വളർത്തുമൃഗങ്ങളുടെ കൂട്ടത്തെ, സാധാരണയായി ചെമ്മരിയാടുകളെയും കോലാടുകളെയും, കൂട്ടായി സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ വായനാസൗകര്യമുള്ള കൂട്ടനാമം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. ലാബാനെ പരാമർശിക്കുമ്പോൾ സാധാരണ മലയാളവ്യവഹാരത്തിന് യോജിച്ച ആദരസൂചകമായ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു; മൂലത്തിലെ ചുരുക്കമുള്ള ചോദ്യോത്തരഘടനയും ദൃശ്യസൂചനയും നിലനിർത്തി.
