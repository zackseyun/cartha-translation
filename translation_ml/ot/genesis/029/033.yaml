id: GEN.29.33
reference: Genesis 29:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תַּ֣הַר עוֹד֮ וַ/תֵּ֣לֶד בֵּן֒ וַ/תֹּ֗אמֶר כִּֽי שָׁמַ֤ע יְהוָה֙ כִּֽי שְׂנוּאָ֣ה אָנֹ֔כִי וַ/יִּתֶּן לִ֖/י גַּם אֶת זֶ֑ה וַ/תִּקְרָ֥א שְׁמ֖/וֹ שִׁמְעֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/033.yaml
  text: Then she conceived again and bore a son[a], and said, “Because Yahweh has heard that I am hated[b], he has given me this one also.” So she called his name Simeon.
translation:
  language: ml
  text: 'പിന്നെ അവൾ വീണ്ടും ഗർഭം ധരിച്ച് ഒരു മകനെ പ്രസവിച്ചു. അവൾ പറഞ്ഞു: “ഞാൻ വെറുക്കപ്പെട്ടവളാണെന്ന്[a] യാഹ്‌വേ കേട്ടതുകൊണ്ട്, അവൻ ഈ മകനെയും എനിക്കു നൽകി.” അതുകൊണ്ട് അവൾ അവന് ശിമെയോൻ[b] എന്നു പേരിട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഞാൻ സ്നേഹിക്കപ്പെടാത്തവളാണ്” അല്ലെങ്കിൽ “എന്നെ കുറച്ചുകൂടി സ്നേഹിക്കുന്നില്ല.” ഹീബ്രുവിൽ അക്ഷരാർഥം “വെറുക്കപ്പെട്ടവൾ” എന്നാണ്; എന്നാൽ സന്ദർഭത്തിൽ അത് നിരസിക്കപ്പെട്ടവൾ അല്ലെങ്കിൽ താരതമ്യേന കുറച്ചു സ്നേഹിക്കപ്പെട്ടവൾ എന്ന അർഥവും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “ശിമെയോൻ” എന്ന പേര് “കേട്ടു” എന്നർഥമുള്ള ഹീബ്രു പദത്തോട് ശബ്ദസാദൃശ്യമുള്ളതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: പിന്നെ അവൾ വീണ്ടും ഗർഭം ധരിച്ചു
  rationale: וַ തുടർന്നുള്ള സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; עוֹד ആവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. ആഖ്യാനക്രമവും ‘വീണ്ടും’ എന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַתֵּלֶד בֵּן
  choice: ഒരു മകനെ പ്രസവിച്ചു
  rationale: ജനനവിവരണങ്ങളിൽ ילד + בן എന്ന പ്രയോഗത്തിന്റെ കൃത്യവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: כִּי שָׁמַע יְהוָה
  choice: യഹോവ കേട്ടതുകൊണ്ട്
  rationale: כִּי ഇവിടെ ലേയയുടെ വിശദീകരണത്തിന് കാരണസൂചകമാണ്. שָׁמַע പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഭൂതകാലരൂപം സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്. ദൈവനാമം പദവിയാക്കി മാറ്റാതെ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: כִּי שְׂנוּאָה אָנֹכִי
  choice: ഞാൻ വെറുക്കപ്പെട്ടവളാണെന്ന്
  rationale: שְׂנוּאָה എന്ന പദത്തിന്റെ നേരിട്ടുള്ള ശക്തമായ അർഥം നിലനിർത്തുന്നു. യാക്കോബിന്റെ പേര് മൂലപാഠത്തിൽ ഈ ഉപവാക്യത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല; താരതമ്യേന കുറച്ചു സ്നേഹിക്കപ്പെട്ടവൾ എന്ന സന്ദർഭസാധ്യത മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ചു മൃദൂകരിച്ചിട്ടില്ല.
- source_word: וַיִּתֶּן לִי גַּם אֶת זֶה
  choice: ഇവനെയും എനിക്കു തന്നിരിക്കുന്നു
  rationale: זֶה പുതുതായി ജനിച്ച മകനെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ വ്യക്തിസൂചകമായ ‘ഇവൻ’ ഉപയോഗിച്ചു; גַּם എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽഭാവം ‘-യും’ നിലനിർത്തുന്നു.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: അവൾ അവന് … എന്നു പേരിട്ടു
  rationale: ‘അവന്റെ പേര് വിളിച്ചു’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שִׁמְעוֹן
  choice: ശിമെയോൻ
  rationale: ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം; שָׁמַע (‘കേട്ടു’) എന്ന പദവുമായുള്ള ശബ്ദബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ലേയ തന്റെ നിലയെ വിവരിക്കുന്ന שְׂנוּאָה എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: വെറുക്കപ്പെട്ടവൾ
  alternative: സ്നേഹിക്കപ്പെടാത്തവൾ; കുറച്ചു സ്നേഹിക്കപ്പെട്ടവൾ
  rationale: ഹീബ്രു പദത്തിന്റെ സാധാരണ ശക്തമായ അർഥം സംരക്ഷിക്കുന്നു. സന്ദർഭത്തിൽ അത് നിരസിക്കപ്പെട്ടതെയോ താരതമ്യേന കുറച്ചു സ്നേഹിക്കപ്പെട്ടതെയോ സൂചിപ്പിക്കാമെങ്കിലും, ആ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധമായി സ്ഥാപിക്കാതെ യഥാർഥമായ ആഖ്യാനപിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ വേദപാഠത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ഹീബ്രുവിലെ ശക്തമായ ‘വെറുക്കപ്പെട്ടവൾ’ എന്ന പ്രയോഗം മൃദൂകരിക്കാതെ സൂക്ഷിച്ചു. ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പ്-മാർക്കർ വിന്യാസത്തിൽ പൊരുത്തക്കേട് ഉണ്ടായതിനാൽ, പേരിലെ ശബ്ദപ്രയോഗത്തിനാണ് [a] നൽകിയിരിക്കുന്നത്; ‘വെറുക്കപ്പെട്ടവൾ’ സംബന്ധിച്ച സാധ്യതകൾ പ്രധാന വിവർത്തനതീരുമാനത്തിൽ രേഖപ്പെടുത്തി.
