id: GEN.29.25
reference: Genesis 29:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וְ/הִנֵּה הִ֖וא לֵאָ֑ה וַ/יֹּ֣אמֶר אֶל לָבָ֗ן מַה זֹּאת֙ עָשִׂ֣יתָ לִּ֔/י הֲ/לֹ֤א בְ/רָחֵל֙ עָבַ֣דְתִּי עִמָּ֔/ךְ וְ/לָ֖/מָּה רִמִּיתָֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/025.yaml
  text: In the morning, behold, it was Leah. And he said to Laban, “What is this you have done to me? Was it not for Rachel that I worked with you? So why have you deceived me?”
translation:
  language: ml
  text: 'രാവിലെ, അതാ, അവൾ ലേയാ! അപ്പോൾ അവൻ ലാബാനോടു പറഞ്ഞു: “അങ്ങ് എന്നോട് ചെയ്തതെന്താണ്? റാഹേലിനുവേണ്ടിയല്ലേ ഞാൻ അങ്ങയെ സേവിച്ചത്? പിന്നെ എന്തിനാണ് അങ്ങ് എന്നെ വഞ്ചിച്ചത്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: നേരം പുലർന്നപ്പോൾ
  rationale: പ്രഭാതമായപ്പോൾ എന്ന കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהִנֵּה הִוא לֵאָה
  choice: അതാ, അവൾ ലേയാ!
  rationale: הִנֵּה സൂചിപ്പിക്കുന്ന പെട്ടെന്നുള്ള തിരിച്ചറിവും കഥയിലെ ഞെട്ടലും നിലനിർത്തുന്നു; ഹീബ്രുവിലെ ഊന്നൽ ചുരുക്കമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: עָבַדְתִּי עִמָּךְ
  choice: ഞാൻ അങ്ങയുടെ അടുക്കൽ ജോലി ചെയ്തത്
  rationale: עבד എന്നത് ഇവിടെ ലാബാനുവേണ്ടിയുള്ള സേവനകാലത്തെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘ജോലി ചെയ്തു’ ഉപയോഗിച്ചു.
- source_word: רִמִּיתָנִי
  choice: അങ്ങ് എന്നെ വഞ്ചിച്ചത്
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ചതിക്കൽ/വഞ്ചിക്കൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וְלָמָּה
  choice: പിന്നെ എന്തിനാണ്
  rationale: മുൻചോദ്യത്തിൽ നിന്നുള്ള നിഗമനാത്മക ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഇംഗ്ലീഷ് consultation layer-ലെ ‘So why’ എന്ന ഭാവവും സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ലാബാനോടുള്ള അഭിസംബോധനയിൽ ബഹുമാനസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു; യാക്കോബിന്റെ ഞെട്ടലും കുറ്റപ്പെടുത്തലിന്റെ ശക്തിയും നിലനിർത്തി.
