  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ഒഴിവാക്കി അതിന്റെ സമയസൂചന സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു; പൊതുവായ מִקְנֶהയും കൂടുതൽ പ്രത്യേകമായ צֹאןഉം തമ്മിലുള്ള വ്യത്യാസം പാഠത്തിലും അടിക്കുറിപ്പിലും സൂക്ഷിച്ചിരിക്കുന്നു.
