source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הֵ֥ן עוֹד֙ הַ/יּ֣וֹם גָּד֔וֹל לֹא עֵ֖ת הֵאָסֵ֣ף הַ/מִּקְנֶ֑ה הַשְׁק֥וּ הַ/צֹּ֖אן וּ/לְכ֥וּ רְעֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/007.yaml
  text: Then he said[a], “Look, the day is still long; it is not time for the livestock to be gathered. Water the flock[b], then go and pasture them.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ പറഞ്ഞു: “നോക്കൂ, പകൽ ഇനിയും ഏറെ ബാക്കിയുണ്ട്; കന്നുകാലികളെ ഒരുമിച്ചുകൂട്ടേണ്ട സമയമായിട്ടില്ല. ആട്ടിൻപറ്റത്തിന്[a] വെള്ളം കൊടുക്കൂ; പിന്നെ പോയി അവയെ മേയ്ക്കൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കന്നുകാലികൾ” എന്നത് വളർത്തുമൃഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്ന ഒരു കൂട്ടനാമത്തിന്റെ പരിഭാഷയാണ്; “ആട്ടിൻപറ്റം” എന്നത് ചെമ്മരിയാടുകളോ കോലാടുകളോ പോലുള്ള ചെറുകന്നുകാലികളെ സൂചിപ്പിക്കുന്ന കൂടുതൽ പ്രത്യേകമായ പദത്തിന്റെ പരിഭാഷയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: നോക്കൂ
  rationale: സംസാരിക്കുന്ന കാര്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരപദത്തിന്റെ ശക്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עוֹד הַיּוֹם גָּדוֹל
  choice: പകൽ ഇനിയും ഏറെ ബാക്കിയുണ്ട്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ദിവസം ഇനിയും വലുതാണ്’ എന്ന പ്രയോഗം ദിവസത്തിന്റെ നല്ലൊരു ഭാഗം ശേഷിക്കുന്നു എന്ന ആശയമാണ് നൽകുന്നത്; തിരഞ്ഞെടുത്ത രൂപം ആ സമയസൂചന സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לֹא עֵת הֵאָסֵף הַמִּקְנֶה
  choice: കന്നുകാലികളെ ഒരുമിച്ചുകൂട്ടേണ്ട സമയമായിട്ടില്ല
  rationale: מִקְנֶה എന്ന വിശാലമായ കൂട്ടനാമത്തെ ‘കന്നുകാലികൾ’ എന്നും הֵאָסֵף എന്ന നിഷ്ക്രിയരൂപത്തെ ‘ഒരുമിച്ചുകൂട്ടേണ്ട’ എന്നും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: הַשְׁקוּ
  choice: വെള്ളം കൊടുത്തിട്ട്
  rationale: ‘കുടിപ്പിക്കുക/വെള്ളം കൊടുക്കുക’ എന്ന ഹിഫീൽ ആജ്ഞയുടെ അർഥവും തുടർന്നുള്ള ആജ്ഞയുമായുള്ള ക്രമവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַצֹּאן
  choice: ആട്ടിൻപറ്റം
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറുകന്നുകാലികളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കാം; സന്ദർഭത്തിൽ ‘ആട്ടിൻപറ്റം’ സ്വാഭാവികമായ കൂട്ടനാമമാണ്.
- source_word: וּלְכוּ רְעוּ
  choice: അവയെ മേയ്ക്കാൻ കൊണ്ടുപോകൂ
  rationale: ‘പോയി മേയ്ക്കുക’ എന്ന രണ്ട് ആജ്ഞകളുടെ യുക്തിസഹമായ ഏകീകൃത പ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു; മൃഗങ്ങളെ മേച്ചിൽസ്ഥാനത്തേക്ക് നയിക്കുന്ന ആശയം നിലനിർത്തുന്നു.
