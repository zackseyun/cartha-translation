source:
  edition: WLC
  text: וַ/יֶּאֱסֹ֥ף לָבָ֛ן אֶת כָּל אַנְשֵׁ֥י הַ/מָּק֖וֹם וַ/יַּ֥עַשׂ מִשְׁתֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/022.yaml
  text: So Laban gathered all the men of the place and made a feast[a][b].
translation:
  language: ml
  text: അങ്ങനെ ലാബാൻ ആ സ്ഥലത്തെ എല്ലാ പുരുഷന്മാരെയും കൂട്ടിവരുത്തി ഒരു വിരുന്നു നടത്തി[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ആ സ്ഥലത്തെ എല്ലാവരെയും.’ എബ്രായപാഠത്തിൽ കൂടുതൽ അക്ഷരാർഥമായി ‘ആ സ്ഥലത്തെ എല്ലാ പുരുഷന്മാരെയും’ എന്നാണ്. വിവാഹാഘോഷത്തിലേക്കു ക്ഷണിക്കപ്പെട്ട ആ പ്രദേശത്തെ പുരുഷന്മാരെയായിരിക്കാം ഇത് സൂചിപ്പിക്കുന്നത് എന്നതിനാൽ മുഖ്യപാഠത്തിൽ പുരുഷലിംഗരൂപം നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘വിരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം ആഘോഷവിരുന്നിനെ സൂചിപ്പിക്കാൻ പതിവായി ഉപയോഗിക്കുന്നു; ആ അവസരത്തിൽ പാനീയസേവനവും ഉണ്ടായിരുന്നുവെന്ന ആശയവും അതിൽ ഉൾപ്പെടാം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: കൂട്ടിവരുത്തി
  rationale: ആളുകളെ ഒരിടത്ത് ഒന്നിച്ചുകൂട്ടുക എന്ന അർഥമാണ് ഈ സന്ദർഭത്തിൽ; ആ പ്രവർത്തനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לָבָן
  choice: ലാബാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: אֶת כָּל אַנְשֵׁי הַמָּקוֹם
  choice: ആ സ്ഥലത്തെ എല്ലാ പുരുഷന്മാരെയും
  rationale: אַנְשֵׁי എന്നത് אִישׁ എന്ന പദത്തിന്റെ പുരുഷലിംഗ ബഹുവചന സംയുക്തരൂപമാണ്; വിവാഹവിരുന്നിലേക്കു ക്ഷണിക്കപ്പെട്ട പ്രാദേശിക പുരുഷന്മാരെയാണ് സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്. הַמָּקוֹם എന്നതിനെ അധികമായി 'പട്ടണം' എന്നു നിർവചിക്കാതെ 'ആ സ്ഥലം' എന്നു പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וַיַּעַשׂ
  choice: നടത്തി
  rationale: עשה എന്ന വിശാലാർഥമുള്ള ക്രിയയ്ക്ക് מִשְׁתֶּה കൂടെ വരുമ്പോൾ മലയാളത്തിൽ 'വിരുന്നു നടത്തി' എന്നതാണ് അടുത്തും സ്വാഭാവികവുമായ പ്രയോഗം; അക്ഷരാർഥത്തിലുള്ള 'ഉണ്ടാക്കി' ഇവിടെ കൃത്രിമമായി തോന്നും.
- source_word: מִשְׁתֶּה
  choice: ഒരു വിരുന്നു
  rationale: ആഘോഷപരമായ ഭക്ഷണസമ്മേളനത്തെയും പലപ്പോഴും അതോടൊപ്പമുള്ള പാനീയസേവനത്തെയും സൂചിപ്പിക്കുന്ന പദമാണിത്; വിവാഹസന്ദർഭത്തിൽ 'വിരുന്നു' സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
