  text: וַ/תַּ֣הַר עוֹד֮ וַ/תֵּ֣לֶד בֵּן֒ וַ/תֹּ֗אמֶר עַתָּ֤ה הַ/פַּ֨עַם֙ יִלָּוֶ֤ה אִישִׁ/י֙ אֵלַ֔/י כִּֽי יָלַ֥דְתִּי ל֖/וֹ שְׁלֹשָׁ֣ה בָנִ֑ים עַל כֵּ֥ן קָרָֽא שְׁמ֖/וֹ לֵוִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/034.yaml
  text: And she conceived again and bore a son[a], and said, “Now this time my husband will be attached to me, because I have borne him three sons.” Therefore his name was called Levi.
translation:
  language: ml
  text: 'അവൾ വീണ്ടും ഗർഭം ധരിച്ച് ഒരു മകനെ പ്രസവിച്ചു. അവൾ പറഞ്ഞു: “ഇപ്പോൾ ഈ പ്രാവശ്യം എന്റെ ഭർത്താവ് എന്നോടു ചേരും[a]; കാരണം ഞാൻ അവനു മൂന്നു പുത്രന്മാരെ പ്രസവിച്ചിരിക്കുന്നു.” അതുകൊണ്ട് അവന് ലേവി എന്നു പേരായി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്നോടു ചേർന്നുനിൽക്കും” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയ്ക്ക് “ലേവി” എന്ന പേരുമായി ശബ്ദസാമ്യമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר עוֹד וַתֵּלֶד בֵּן
  choice: അവൾ വീണ്ടും ഗർഭം ധരിച്ച് ഒരു മകനെ പ്രസവിച്ചു
  rationale: הרה എന്നത് ഗർഭം ധരിക്കുക എന്നും ילד ഇവിടെ പ്രസവിക്കുക എന്നും അർഥമാക്കുന്നു; עוֹד എന്നതിന്റെ ആവർത്തനഭാവം ‘വീണ്ടും’ നിലനിർത്തുന്നു.
- source_word: עַתָּה הַפַּעַם
  choice: ഇപ്പോൾ ഈ പ്രാവശ്യം
  rationale: രണ്ട് സമയസൂചകങ്ങളുടെയും ഊന്നൽ ഒഴിവാക്കാതെ, എബ്രായ വാക്യത്തിന്റെ അല്പം ആവർത്തനാത്മകമായ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: יִלָּוֶה אִישִׁי אֵלַי
  choice: എന്റെ ഭർത്താവ് എന്നോടു ചേരും
  rationale: Niphal രൂപമായ יִלָּוֶה ബന്ധത്തിൽ ചേർന്നുനിൽക്കുക/ചേരുക എന്ന ആശയം നൽകുന്നു. ‘ചേരും’ സ്വാഭാവികവും ദിശ സൂചിപ്പിക്കുന്ന אֵלַי (‘എന്നോട്’) എന്ന ഘടനയോട് യോജിച്ചതുമാണ്.
- source_word: כִּי יָלַדְתִּי לוֹ שְׁלֹשָׁה בָנִים
  choice: കാരണം ഞാൻ അദ്ദേഹത്തിന് മൂന്നു പുത്രന്മാരെ പ്രസവിച്ചിരിക്കുന്നു
  rationale: כִּי കാരണത്തെ സൂചിപ്പിക്കുന്നു; പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി ‘പ്രസവിച്ചിരിക്കുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു. לוֹയും ‘മൂന്നു പുത്രന്മാർ’ എന്ന കൃത്യസംഖ്യയും സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: עַל כֵּן קָרָא שְׁמוֹ לֵוִי
  choice: അതുകൊണ്ട് അവന് ലേവി എന്നു പേരായി
  rationale: קָרָא എന്ന ക്രിയയുടെ കർത്താവ് വ്യക്തമല്ല; ‘പേരായി’ എന്ന ഫലകേന്ദ്രിത പ്രയോഗം ‘അവൻ/അവൾ പേരിട്ടു’ എന്ന് അനിശ്ചിത കർത്താവിനെ ചേർക്കാതെ നാമകരണവിവരണം നൽകുന്നു.
theological_decisions:
- issue: יִלָּוֶה എന്ന ക്രിയയും לֵוִי എന്ന പേരും തമ്മിലുള്ള ശബ്ദ-അർഥബന്ധം
  choice: മുഖ്യവാചകത്തിൽ ‘ചേരും’ ഉപയോഗിച്ച്, എബ്രായ ശബ്ദസാമ്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു
  alternative: ‘ബന്ധപ്പെട്ടുനിൽക്കും’ അല്ലെങ്കിൽ ‘ചേർന്നുനിൽക്കും’
  rationale: മലയാളത്തിൽ എബ്രായത്തിലെ ശബ്ദകളി അതേ രൂപത്തിൽ പുനരാവിഷ്കരിക്കാൻ കഴിയില്ല. ‘ചേരും’ അടിസ്ഥാന അർഥം സംക്ഷിപ്തമായി നൽകുന്നു; അടിക്കുറിപ്പ് പേരുമായുള്ള ബന്ധം നഷ്ടപ്പെടാതിരിക്കാൻ സഹായിക്കുന്നു.
- issue: കുഞ്ഞിന് പേര് നൽകിയ വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: ‘അവന് ലേവി എന്നു പേരായി’ എന്ന കർത്താവില്ലാത്ത ഫലപ്രയോഗം
  alternative: ‘അവൾ അവന് ലേവി എന്നു പേരിട്ടു’ അല്ലെങ്കിൽ ‘അവൻ അവന് ലേവി എന്നു പേരിട്ടു’
  rationale: എബ്രായ ക്രിയ 3-ാം പുരുഷ ഏകവചന പുല്ലിംഗരൂപത്തിലാണെങ്കിലും വ്യക്തമായ കർത്താവ് നൽകിയിട്ടില്ല. അതിനാൽ ആരാണ് പേരിട്ടതെന്ന് വിവർത്തനം തീരുമാനിച്ചുറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ‘പുത്രന്മാർ’ എന്ന പദം ജനന-നാമകരണസന്ദർഭത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; കർത്താവിനെ അനാവശ്യമായി നിർണ്ണയിക്കാതിരിക്കാൻ അവസാനവാക്യം ഫലകേന്ദ്രിതമായി നൽകിയിരിക്കുന്നു.
