  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. സംഭാഷണത്തിന്റെ സംക്ഷിപ്തതയും എബ്രായത്തിലെ ‘അറിയുക’ എന്ന ക്രിയയുടെ ആവർത്തനവും സൂക്ഷിച്ചു.
