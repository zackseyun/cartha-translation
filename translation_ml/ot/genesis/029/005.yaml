source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֔ם הַ/יְדַעְתֶּ֖ם אֶת לָבָ֣ן בֶּן נָח֑וֹר וַ/יֹּאמְר֖וּ יָדָֽעְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/005.yaml
  text: He said to them[a], “Do you know Laban son of Nahor?” They said, “We know him.”
translation:
  language: ml
  text: 'അവൻ അവരോട് ചോദിച്ചു: “നാഹോരിന്റെ മകനായ ലാബാനെ നിങ്ങൾക്ക് അറിയാമോ?” അവർ പറഞ്ഞു: “അറിയാം.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഞങ്ങൾ അറിയുന്നു”; ആരെ അറിയുന്നു എന്നത് സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാണ്.'
    reason: എബ്രായത്തിലെ ഒന്നാംപുരുഷ ബഹുവചനരൂപവും സന്ദർഭത്തിൽ സൂചിതമായ കർമവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: അവൻ അവരോട് ചോദിച്ചു
  rationale: ശാബ്ദികമായി ‘അവൻ അവരോട് പറഞ്ഞു’ എന്നാണെങ്കിലും തുടർന്ന് നേരിട്ടുള്ള ചോദ്യം വരുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നു നൽകി; അവരോടുള്ള അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: הֲיְדַעְתֶּם
  choice: നിങ്ങൾക്ക് അറിയാമോ
  rationale: יָדַע ഇവിടെ ഒരാളെക്കുറിച്ചുള്ള പരിചയമോ അറിവോ ചോദിക്കുന്നു. ആ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לָבָן
  choice: ലാബാൻ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: בֶּן נָחוֹר
  choice: നാഹോരിന്റെ മകനായ
  rationale: בֶּן എന്നതിന്റെ നേരിട്ടുള്ള ബന്ധസൂചനയായ ‘മകൻ’ നിലനിർത്തി; നാഹോർ എന്ന പേരിന്റെ ബന്ധവിഭക്തി മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
- source_word: וַיֹּאמְרוּ
  choice: അവർ പറഞ്ഞു
  rationale: കഥനക്രമത്തിലെ മറുപടി സൂചിപ്പിക്കുന്നു; ആവർത്തിച്ചുള്ള വാവ് മലയാളത്തിൽ പ്രത്യേകം ‘അപ്പോൾ/ഉം’ എന്നു നൽകേണ്ടതില്ല.
- source_word: יָדָעְנוּ
  choice: അറിയാം
  rationale: ചോദ്യത്തിലെ יָדַע എന്ന ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും ‘അറിയുക’ വഴി നിലനിർത്തുന്നു. എബ്രായത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ പ്രധാന പാഠത്തിൽ സ്വാഭാവികമായ സംക്ഷിപ്ത മറുപടി സ്വീകരിച്ചു.
