id: GEN.29.26
reference: Genesis 29:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָבָ֔ן לֹא יֵעָשֶׂ֥ה כֵ֖ן בִּ/מְקוֹמֵ֑/נוּ לָ/תֵ֥ת הַ/צְּעִירָ֖ה לִ/פְנֵ֥י הַ/בְּכִירָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/026.yaml
  text: Laban said[a], “It is not done this way in our place[c][b], to give the younger before the older.”
translation:
  language: ml
  text: 'ലാബാൻ പറഞ്ഞു: “ഞങ്ങളുടെ നാട്ടിൽ ഇളയവളെ മൂത്തവൾക്കു മുമ്പ് വിവാഹം കഴിച്ചുകൊടുക്കുന്ന പതിവില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം സ്വാഭാവികമായി ‘പറഞ്ഞു’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: לָבָן
  choice: ലാബാൻ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: לֹא יֵעָשֶׂה כֵן
  choice: പതിവില്ല
  rationale: നിഫാൽ രൂപവും സന്ദർഭവും ഒരു പ്രവൃത്തിയുടെ സാധ്യതയെയല്ല, പ്രാദേശിക ആചാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പതിവില്ല’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בִּמְקוֹמֵנוּ
  choice: ഞങ്ങളുടെ നാട്ടിൽ
  rationale: അക്ഷരാർഥം ‘ഞങ്ങളുടെ സ്ഥലത്ത്’ എന്നാണെങ്കിലും, ഇവിടെ ഉദ്ദേശിക്കുന്നത് പ്രാദേശിക സമൂഹവും അതിന്റെ ആചാരവുമാണ്; ‘ഞങ്ങളുടെ നാട്ടിൽ’ ആ അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לָתֵת
  choice: വിവാഹം കഴിച്ചുകൊടുക്കുന്ന
  rationale: മൂലപദം അക്ഷരാർഥത്തിൽ ‘കൊടുക്കുക’ എന്നാണ്; എന്നാൽ ഈ സന്ദർഭത്തിൽ മകളെ വിവാഹത്തിൽ കൊടുക്കുന്നതാണ് പരോക്ഷമായി ഉദ്ദേശിക്കുന്നത്. മലയാളത്തിൽ വെറും ‘കൊടുക്കുക’ അസ്വാഭാവികവും തെറ്റിദ്ധരിപ്പിക്കുന്നതുമായതിനാൽ സന്ദർഭാർഥം വ്യക്തമാക്കി.
- source_word: הַצְּעִירָה
  choice: ഇളയവളെ
  rationale: സ്ത്രീലിംഗ വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്നു; ‘ഇളയവൾ’ അതിനെ ചുരുക്കമായും വ്യക്തമായും പുനരാവിഷ്കരിക്കുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പ്
  rationale: ഇവിടെ സ്ഥലപരമായ മുൻഭാഗമല്ല, ക്രമത്തിലെ മുൻഗണനയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַבְּכִירָה
  choice: മൂത്തവൾക്കു
  rationale: בכירה ആദ്യജാതയായ/മൂത്ത മകളെ സൂചിപ്പിക്കുന്നു. ഇളയവളോടുള്ള സമാന്തരതയും സ്വാഭാവിക മലയാളവും നിലനിർത്താൻ ‘മൂത്തവൾ’ തെരഞ്ഞെടുത്തു; ‘ആദ്യജാത’ ജനനക്രമത്തെ കൂടുതൽ അക്ഷരാർഥത്തിൽ പ്രകടിപ്പിക്കുന്ന മറ്റൊരു സാധ്യതയാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ സാമൂഹികാചാരസൂചന ‘പതിവില്ല’ എന്ന രൂപത്തിൽ നിലനിർത്തി; വിവാഹസന്ദർഭം മലയാളത്തിൽ ആവശ്യമായത്ര വ്യക്തമാക്കി.
