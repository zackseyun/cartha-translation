source:
  edition: WLC
  text: וַ/יָּבֹא֙ גַּ֣ם אֶל רָחֵ֔ל וַ/יֶּאֱהַ֥ב גַּֽם אֶת רָחֵ֖ל מִ/לֵּאָ֑ה וַ/יַּעֲבֹ֣ד עִמּ֔/וֹ ע֖וֹד שֶֽׁבַע שָׁנִ֥ים אֲחֵרֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/030.yaml
  text: So he went in to Rachel also[a], and he loved Rachel more than Leah; and he served with him for another seven years.
translation:
  language: ml
  text: അങ്ങനെ യാക്കോബ് റാഹേലിന്റെ അടുക്കലും ചെന്നു[a]. അവൻ ലേയയെക്കാൾ റാഹേലിനെ സ്നേഹിച്ചു. പിന്നെയും ഏഴു വർഷം അവൻ ലാബാനോടൊപ്പം സേവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ദാമ്പത്യബന്ധത്തിൽ ഏർപ്പെട്ടു എന്ന അർഥം സൂചിപ്പിക്കുന്ന എബ്രായ വിനയോക്തി.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיָּבֹא גַּם אֶל־רָחֵל
  choice: യാക്കോബ് റാഹേലിന്റെ അടുക്കലും ചെന്നു
  rationale: בוא אל എന്ന പ്രയോഗം ഈ വിവാഹസന്ദർഭത്തിൽ ദാമ്പത്യസംഗമത്തെ സൂചിപ്പിക്കുന്ന വിനയോക്തിയാണ്. മലയാളത്തിലെ ‘അടുക്കൽ ചെന്നു’ ആ സൂചന നിലനിർത്തുന്നു; גַּם ‘-ഉം’ ആയി സംരക്ഷിച്ചു.
- source_word: וַיֶּאֱהַב גַּם אֶת־רָחֵל
  choice: അവൻ ... റാഹേലിനെ സ്നേഹിച്ചു
  rationale: אָהַב എന്ന സാധാരണ ‘സ്നേഹിക്കുക’ എന്ന ക്രിയയെ അനാവശ്യമായ തീവ്രത ചേർക്കാതെ പരിഭാഷപ്പെടുത്തി.
- source_word: מִלֵּאָה
  choice: ലേയയെക്കാൾ
  rationale: സ്നേഹത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയ്ക്കുശേഷമുള്ള מִן ഇവിടെ സ്വാഭാവികമായി താരതമ്യം രേഖപ്പെടുത്തുന്നു.
- source_word: וַיַּעֲבֹד עִמּוֹ
  choice: അവൻ ലാബാനോടൊപ്പം സേവിച്ചു
  rationale: עבד എന്നത് സേവിക്കുക/വേലചെയ്യുക എന്നും עִמּוֹ അക്ഷരാർഥത്തിൽ ‘അവനോടൊപ്പം’ എന്നും വരുന്നു. സന്ദർഭത്തിലെ വ്യക്തതയ്ക്കായി സർവനാമത്തിനു പകരം ‘ലാബാൻ’ ഉപയോഗിച്ചു; എബ്രായത്തിലെ കൂടെയെന്ന ഘടന നിലനിർത്തി.
- source_word: עוֹד שֶׁבַע־שָׁנִים אֲחֵרוֹת
  choice: പിന്നെയും ഏഴു വർഷം
  rationale: עוֹד ... אֲחֵרוֹת സൂചിപ്പിക്കുന്ന അധികമായ ഏഴുവർഷത്തെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകി.
