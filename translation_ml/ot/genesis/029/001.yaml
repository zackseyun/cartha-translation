lexical_decisions:
- source_word: וַיִּשָּׂא יַעֲקֹב רַגְלָיו
  choice: യാക്കോബ് യാത്ര തുടർന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘യാക്കോബ് തന്റെ കാലുകൾ ഉയർത്തി’ എന്ന പ്രയോഗം യാത്ര ഉത്സാഹത്തോടെ പുനരാരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലിയാണ്; സ്വാഭാവിക മലയാളത്തിൽ അതിന്റെ സന്ദർഭാർഥം നൽകി.
- source_word: אַרְצָה בְנֵי־קֶדֶם
  choice: കിഴക്കുദേശക്കാരുടെ നാട്ടിലേക്ക്
  rationale: בְנֵי־קֶדֶם എന്നത് അക്ഷരാർഥത്തിൽ ‘കിഴക്കിന്റെ പുത്രന്മാർ’ എന്നാണെങ്കിലും, ഇവിടെ കിഴക്കൻ പ്രദേശത്തെ ജനങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘കിഴക്കുദേശക്കാർ’ ഈ ജനവിഭാഗപരവും ഭൂമിശാസ്ത്രപരവുമായ അർഥം നിലനിർത്തുന്നു.
