source:
  edition: WLC
  text: וַ/תַּ֤הַר לֵאָה֙ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ רְאוּבֵ֑ן כִּ֣י אָֽמְרָ֗ה כִּֽי רָאָ֤ה יְהוָה֙ בְּ/עָנְיִ֔/י כִּ֥י עַתָּ֖ה יֶאֱהָבַ֥/נִי אִישִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/032.yaml
  text: Leah conceived and bore a son[a], and she called his name Reuben, for she said, “Because Yahweh has seen my affliction, now my husband will love me.”
translation:
  language: ml
  text: 'ലേയ ഗർഭം ധരിച്ച് ഒരു മകനെ പ്രസവിച്ചു. അവൾ അവന് രൂബേൻ എന്നു പേരിട്ടു.[a] അവൾ പറഞ്ഞു: “യഹ്‌വേ എന്റെ കഷ്ടത കണ്ടതുകൊണ്ട്, ഇപ്പോൾ എന്റെ ഭർത്താവ് എന്നെ സ്നേഹിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “രൂബേൻ” എന്ന പേര് “നോക്കൂ, ഒരു മകൻ” എന്നർഥമുള്ള ഹീബ്രു പ്രയോഗത്തോടു സാമ്യമുള്ളതാണ്; “യഹ്‌വേ എന്റെ കഷ്ടത കണ്ടു” എന്ന ലേയയുടെ വാക്കുകളിലൂടെയും ഇവിടെ ആ പേര് വിശദീകരിക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: ഗർഭം ധരിച്ചു
  rationale: הרה ഗർഭം ധരിക്കുക എന്ന അർഥം നൽകുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം.
- source_word: וַתֵּלֶד בֵּן
  choice: ഒരു മകനെ പ്രസവിച്ചു
  rationale: ילד + בן എന്ന പ്രസവവിവരണത്തെ വ്യക്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וַתִּקְרָא שְׁמוֹ רְאוּבֵן
  choice: അവൾ അവന് രൂബേൻ എന്നു പേരിട്ടു
  rationale: ഹീബ്രു നാമകരണസൂത്രത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; പേരിലെ ശബ്ദക്രീഡ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כִּי רָאָה יְהוָה
  choice: യഹ്‌വേ ... കണ്ടതുകൊണ്ട്
  rationale: ആദ്യത്തെ כִּי നാമകരണത്തിനുള്ള കാരണവിവരണം അവതരിപ്പിക്കുന്നു; perfect രൂപം സംഭവിച്ച കാര്യമായി മലയാളത്തിൽ ‘കണ്ടു’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ മാറ്റാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּעָנְיִי
  choice: എന്റെ കഷ്ടത
  rationale: עֳנִי സൂചിപ്പിക്കുന്ന ദുരിതം/അവശതയുടെ ഗൗരവം സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּי עַתָּה יֶאֱהָבַנִי אִישִׁי
  choice: ഇപ്പോൾ എന്റെ ഭർത്താവ് എന്നെ സ്നേഹിക്കും
  rationale: രണ്ടാമത്തെ כִּי ലേയയുടെ പ്രതീക്ഷയ്ക്ക് അടിസ്ഥാനം നൽകുന്ന കാരണബന്ധം സൂചിപ്പിക്കുന്നു; אִישִׁי ഇവിടെ വൈവാഹിക സാഹചര്യത്തിൽ ‘എന്റെ ഭർത്താവ്’ എന്നാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: രണ്ടാമത്തെ כִּי യുടെ ബന്ധം
  choice: ‘കണ്ടതുകൊണ്ട്’ എന്ന കാരണഘടനയിൽ ഉൾപ്പെടുത്തി, തുടർന്ന് ലേയയുടെ പ്രതീക്ഷയായി ‘ഇപ്പോൾ... സ്നേഹിക്കും’ എന്നു നൽകി
  alternative: ‘തീർച്ചയായും ഇപ്പോൾ’ എന്ന ഊന്നൽ
  rationale: ഇവിടെ כִּי കാരണവാചകമായി വായിക്കുന്നത് സന്ദർഭസഹജമാണ്; ഊന്നൽവായന സാധ്യമെങ്കിലും അതിനാവശ്യമായ ‘തീർച്ചയായും’ എന്ന പദം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘ഗർഭം ധരിച്ചു’, ‘പ്രസവിച്ചു’, ‘പേരിട്ടു’ എന്നീ സാധാരണ പ്രയോഗങ്ങൾ സ്വീകരിച്ചു; ദൈവനാമം ‘യഹ്‌വേ’യായി നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം പ്രസക്തമായ നാമകരണവാക്യത്തിന് ശേഷം ചേർത്തിരിക്കുന്നു.
