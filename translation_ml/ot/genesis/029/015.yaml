id: GEN.29.15
reference: Genesis 29:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָבָן֙ לְ/יַעֲקֹ֔ב הֲ/כִי אָחִ֣/י אַ֔תָּה וַ/עֲבַדְתַּ֖/נִי חִנָּ֑ם הַגִּ֥ידָ/ה לִּ֖/י מַה מַּשְׂכֻּרְתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/015.yaml
  text: Then Laban said to Jacob[a], “Because you are my relative, should you work for me for nothing? Tell me, what your wages should be.”
translation:
  language: ml
  text: 'അപ്പോൾ ലാബാൻ യാക്കോബിനോടു പറഞ്ഞു: “നീ എന്റെ ബന്ധുവായതുകൊണ്ട്[a] എനിക്കുവേണ്ടി വെറുതെ ജോലി ചെയ്യണമോ? നിനക്കുള്ള കൂലി എന്തായിരിക്കണമെന്ന് എന്നോടു പറയുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ “നീ എന്റെ സഹോദരനായതുകൊണ്ട്”; ഇവിടെ “സഹോദരൻ” എന്ന പദം വിശാലമായ അർഥത്തിൽ ബന്ധുവിനെയോ കുടുംബക്കാരനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי
  choice: നീ എന്റെ ബന്ധുവായതുകൊണ്ട്
  rationale: ഈ ഘടകം ബന്ധുത്വത്തെ തുടർന്നുള്ള വാചാടോപചോദ്യത്തിന്റെ അടിസ്ഥാനമായി അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-ആയതുകൊണ്ട്’ സ്വാഭാവികമായി ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: אָחִי
  choice: എന്റെ ബന്ധു
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘എന്റെ സഹോദരൻ’ എന്നാണെങ്കിലും ഇവിടെ ലാബാന്റെ അനന്തരവനായ യാക്കോബിനെ സൂചിപ്പിക്കുന്ന വിശാലമായ ബന്ധുത്വപ്രയോഗമാണ്. തെറ്റായ സഹോദരബന്ധം സൂചിപ്പിക്കാതെ സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: וַעֲבַדְתַּנִי
  choice: എനിക്കുവേണ്ടി ... ജോലി ചെയ്യണമോ
  rationale: עבד ഇവിടെ ലാബാനുവേണ്ടി ചെയ്യുന്ന തൊഴിലാണ് സൂചിപ്പിക്കുന്നത്. തുടർന്നുള്ള കൂലി പരാമർശത്തോടു ചേർന്ന് ‘ജോലി ചെയ്യുക’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്; ചോദ്യം വാചാടോപപരമായി നിലനിർത്തുന്നു.
- source_word: חִנָּם
  choice: വെറുതെ
  rationale: പ്രതിഫലമില്ലാതെ ജോലി ചെയ്യുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള കൂലി സംബന്ധമായ ചോദ്യമാണ് അർഥം വ്യക്തമാക്കുന്നത്.
- source_word: הַגִּידָה לִּי
  choice: എന്നോടു പറയുക
  rationale: ആജ്ഞാരൂപവും പരോക്ഷ കർമവും നേരായ, മാന്യമായ ആധുനിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: מַה מַשְׂכֻּרְתֶּךָ
  choice: നിനക്കുള്ള കൂലി എന്തായിരിക്കണമെന്ന്
  rationale: מַשְׂכֹּרֶת എന്നത് തൊഴിൽക്കൂലിയെ സൂചിപ്പിക്കുന്നു. ഇനിയും നിശ്ചയിക്കപ്പെടേണ്ട പ്രതിഫലത്തെക്കുറിച്ചുള്ള ചർച്ചയായതിനാൽ ‘എന്തായിരിക്കണമെന്ന്’ യോജിക്കുന്നു; മൂലത്തിലെ ആജ്ഞയും അതിനെ തുടർന്നുള്ള പരോക്ഷചോദ്യവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ബന്ധു’ സന്ദർഭത്തിലെ യഥാർഥ കുടുംബബന്ധം വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് എബ്രായത്തിലെ അക്ഷരാർഥം സംരക്ഷിക്കുന്നു. വാചാടോപചോദ്യവും അവസാനത്തെ ആജ്ഞയോടുകൂടിയ പരോക്ഷചോദ്യവും നിലനിർത്തിയിരിക്കുന്നു.
