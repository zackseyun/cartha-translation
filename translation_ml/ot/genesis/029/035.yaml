source:
  edition: WLC
  text: וַ/תַּ֨הַר ע֜וֹד וַ/תֵּ֣לֶד בֵּ֗ן וַ/תֹּ֨אמֶר֙ הַ/פַּ֨עַם֙ אוֹדֶ֣ה אֶת יְהוָ֔ה עַל כֵּ֛ן קָרְאָ֥ה שְׁמ֖/וֹ יְהוּדָ֑ה וַֽ/תַּעֲמֹ֖ד מִ/לֶּֽדֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/035.yaml
  text: And she conceived again and bore a son[a], and she said, “This time I will praise Yahweh.” Therefore she named him Judah. Then she stopped bearing children.
translation:
  language: ml
  text: 'അവൾ വീണ്ടും ഗർഭം ധരിച്ച് ഒരു മകനെ പ്രസവിച്ചു. അപ്പോൾ അവൾ പറഞ്ഞു: “ഇത്തവണ ഞാൻ യഹ്‌വേയെ സ്തുതിക്കും.” അതുകൊണ്ട് അവൾ അവന് യെഹൂദാ[a] എന്നു പേരിട്ടു. പിന്നെ അവൾ പ്രസവിക്കുന്നതു നിലച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യെഹൂദാ” എന്ന പേര് “സ്തുതിക്കുക” അഥവാ “നന്ദി പറയുക” എന്നർഥമുള്ള എബ്രായ ക്രിയയോടു ശബ്ദസാദൃശ്യമുള്ളതാണ്.
    reason: പേരിടലിലെ എബ്രായ പദപ്രയോഗവും ‘സ്തുതി/നന്ദി’ എന്ന അർഥവ്യാപ്തിയും മലയാളത്തിൽ സ്വതവേ കേൾക്കാനാവാത്തതിനാൽ.
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: അവൾ വീണ്ടും ഗർഭം ധരിച്ചു
  rationale: הרה ഗർഭം ധരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; עוֹד ജനനപരമ്പരയിലെ ആവർത്തനം വ്യക്തമാക്കുന്നതിനാൽ ‘വീണ്ടും’ സ്വാഭാവികമാണ്.
- source_word: וַתֵּלֶד בֵּן
  choice: ഒരു മകനെ പ്രസവിച്ചു
  rationale: മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രസവവിവരണമാണ്.
- source_word: הַפַּעַם
  choice: ഇത്തവണ
  rationale: മുൻ പ്രസവങ്ങളിൽനിന്ന് ഇപ്പോഴത്തെ സന്ദർഭത്തെ വേർതിരിക്കുന്ന ദൈക്തിക അർഥം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: אוֹדֶה
  choice: ഞാൻ ... സ്തുതിക്കും
  rationale: ידה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ഇവിടെ സ്തുതിക്കുക/നന്ദി പറയുക എന്നീ അർഥസാധ്യതകളുണ്ട്; യെഹൂദാ എന്ന പേരുമായുള്ള ശബ്ദബന്ധം വ്യക്തമാക്കാൻ ‘സ്തുതിക്കും’ തിരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: പ്രസ്താവനയും പേരിടലും തമ്മിലുള്ള കാരണബന്ധം ലളിതമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: קָרְאָה שְׁמוֹ
  choice: അവന് ... എന്നു പേരിട്ടു
  rationale: ‘അവന്റെ പേര് വിളിച്ചു’ എന്ന അക്ഷരാർഥത്തിനുപകരം മലയാളത്തിലെ സ്വാഭാവികമായ പേരിടൽ പ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: יְהוּדָה
  choice: യെഹൂദാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; ידה എന്ന ക്രിയയുമായുള്ള പേരിന്റെ ശബ്ദബന്ധം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: וַתַּעֲמֹד מִלֶּדֶת
  choice: പിന്നെ അവൾ പ്രസവിക്കുന്നതു നിലച്ചു
  rationale: עמד + מן + ക്രിയാനാമം ഒരു പ്രവൃത്തി നിർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത സ്ഥിരമായ അശക്തി പോലുള്ള ആശയം ചേർക്കാതെ അർഥം നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ബിരുദമാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: אוֹדֶה എന്നതിലെ സ്തുതി/നന്ദി അർഥവ്യാപ്തി
  choice: സ്തുതിക്കും
  alternative: നന്ദി പറയും
  rationale: ക്രിയയ്ക്ക് രണ്ടു ഭാവങ്ങളും ഉണ്ടാകാം. യെഹൂദാ എന്ന പേരുമായുള്ള പദബന്ധം കൂടുതൽ നേരിട്ട് സൂക്ഷിക്കുന്നതിനാൽ ‘സ്തുതിക്കും’ സ്വീകരിച്ചു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ സംഭവക്രമം വ്യക്തമായി നിലനിർത്തി; പേരിടലിലെ പദപ്രയോഗം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
