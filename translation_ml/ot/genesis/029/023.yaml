source:
  edition: WLC
  text: וַ/יְהִ֣י בָ/עֶ֔רֶב וַ/יִּקַּח֙ אֶת לֵאָ֣ה בִתּ֔/וֹ וַ/יָּבֵ֥א אֹתָ֖/הּ אֵלָ֑י/ו וַ/יָּבֹ֖א אֵלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/023.yaml
  text: And in the evening he took Leah his daughter and brought her to him[a], and he went in to her.
translation:
  language: ml
  text: സന്ധ്യയായപ്പോൾ അവൻ തന്റെ മകളായ ലേയയെ കൂട്ടിക്കൊണ്ടുവന്ന് യാക്കോബിന്റെ അടുക്കൽ എത്തിച്ചു; യാക്കോബ് അവളുടെ അടുക്കൽ ചെന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവളുടെ അടുക്കൽ ചെന്നു” എന്നത് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന പതിവ് ഹീബ്രു സൗമ്യോക്തിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: സന്ധ്യയായപ്പോൾ
  rationale: കഥയുടെ തുടർച്ചയും പ്രവൃത്തിയുടെ സമയവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; וַיְהִי എന്ന ആഖ്യാനസൂത്രം പ്രത്യേകം ഭാരമുള്ള പ്രയോഗമാക്കാതെ സമയവാക്യത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: וַיִּקַּח אֶת־לֵאָה בִתּוֹ
  choice: അവൻ തന്റെ മകളായ ലേയയെ കൂട്ടിക്കൊണ്ടുവന്ന്
  rationale: לקח എന്നതിന്റെ ‘എടുക്കുക/കൂട്ടിക്കൊണ്ടുപോകുക’ എന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു. ‘തന്റെ മകളായ ലേയ’ എന്നത് ഹീബ്രു സമാനാധികരണത്തെ സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו
  choice: യാക്കോബിന്റെ അടുക്കൽ എത്തിച്ചു
  rationale: ഹിഫീൽ രൂപമായ בוא-യുടെ ‘കൊണ്ടുവരുക/എത്തിക്കുക’ എന്ന കാരകാർഥം നിലനിർത്തുന്നു. സർവനാമം മലയാളത്തിൽ ആശയക്കുഴപ്പമുണ്ടാക്കാൻ സാധ്യതയുള്ളതിനാൽ മുൻസന്ദർഭത്തിലെ വ്യക്തിയായ യാക്കോബിന്റെ പേര് വ്യക്തമാക്കുന്നു.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: യാക്കോബ് അവളുടെ അടുക്കൽ ചെന്നു
  rationale: ഹീബ്രുവിലെ ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത സൗമ്യോക്തി നേരിട്ട് അശ്ലീലമാക്കാതെയും അർഥം ഒറ്റ വ്യാഖ്യാനമായി ചുരുക്കാതെയും മലയാളത്തിൽ നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
