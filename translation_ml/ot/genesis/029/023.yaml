translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ ആഖ്യാനക്രമവും സൗമ്യോക്തിയും സംരക്ഷിച്ചിരിക്കുന്നു; ആവർത്തിച്ച സർവനാമങ്ങൾ സൃഷ്ടിക്കാവുന്ന ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘യാക്കോബ്’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
