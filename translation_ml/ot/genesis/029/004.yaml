translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പുരുഷന്മാരുടെ ബഹുവചന സംബോധനയും ഹീബ്രുവിലെ സാധാരണ സംസാരക്രിയകളും നിലനിർത്തിയിട്ടുണ്ട്.
