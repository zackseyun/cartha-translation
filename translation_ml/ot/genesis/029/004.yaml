source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יַעֲקֹ֔ב אַחַ֖/י מֵ/אַ֣יִן אַתֶּ֑ם וַ/יֹּ֣אמְר֔וּ מֵ/חָרָ֖ן אֲנָֽחְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/004.yaml
  text: Jacob said to them[a], “My brothers, where are you from?” They said[b], “We are from Haran.”
translation:
  language: ml
  text: 'യാക്കോബ് അവരോടു പറഞ്ഞു: “എന്റെ സഹോദരന്മാരേ,[a] നിങ്ങൾ എവിടെനിന്നുള്ളവരാണ്?” അവർ പറഞ്ഞു: “ഞങ്ങൾ ഹാരാനിൽനിന്നുള്ളവരാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്റെ സഹോദരന്മാരേ’ എന്നത് ഇവിടെ സൗഹൃദപൂർവമായ ഒരു സംബോധനമാണ്; അവർ യാക്കോബിന്റെ യഥാർഥ സഹോദരന്മാരോ ബന്ധുക്കളോ ആണെന്ന് അതിനാൽ നിർബന്ധമായി അർഥമില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם יַעֲקֹב
  choice: യാക്കോബ് അവരോടു പറഞ്ഞു
  rationale: אמר എന്ന സാധാരണ സംസാരക്രിയയെ ‘പറഞ്ഞു’ എന്നു തന്നെയാണ് പരിഭാഷപ്പെടുത്തിയത്; തുടർന്നുവരുന്ന ചോദ്യം കണക്കിലെടുത്ത് ‘ചോദിച്ചു’ എന്നു വ്യാഖ്യാനാത്മകമായി മാറ്റിയിട്ടില്ല. לָהֶם എന്ന പരോക്ഷ കർമവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אַחַי
  choice: സഹോദരന്മാരേ
  rationale: അക്ഷരാർഥം ‘എന്റെ സഹോദരന്മാരേ’ എന്നാണെങ്കിലും, ഇവിടെ അപരിചിതരായ പുരുഷന്മാരോടുള്ള സൗഹൃദപൂർവമായ സംബോധനയാണ്. സ്വാഭാവിക മലയാളത്തിൽ അതിന്റെ സംബോധനഭാവം ‘സഹോദരന്മാരേ’ എന്നു നൽകി; ബന്ധുസംബന്ധം നിർബന്ധമായി സൂചിപ്പിക്കാതിരിക്കാൻ കുറിപ്പ് ചേർത്തു.
- source_word: מֵאַיִן אַתֶּם
  choice: നിങ്ങൾ എവിടെനിന്നുള്ളവരാണ്?
  rationale: מִן ചേർന്ന ചോദ്യം ഉത്ഭവസ്ഥലത്തെക്കുറിച്ചാണ്. ‘നിങ്ങൾ എവിടെനിന്നാണ്?’ എന്നതും സാധ്യമെങ്കിലും, മറുപടിയിലെ ‘ഹാരാനിൽനിന്നുള്ളവരാണ്’ എന്ന ഘടനയുമായി സ്വാഭാവികമായി ഒത്തുപോകുന്ന രൂപം തിരഞ്ഞെടുത്തു.
- source_word: וַיֹּאמְרוּ
  choice: അവർ പറഞ്ഞു
  rationale: אמר എന്ന സാധാരണ സംസാരക്രിയയുടെ ഔപചാരിക അർഥം നിലനിർത്തി; സന്ദർഭാനുസൃതമായ ‘മറുപടി പറഞ്ഞു’ എന്നു കൂടുതൽ വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: מֵחָרָן אֲנָחְנוּ
  choice: ഞങ്ങൾ ഹാരാനിൽനിന്നുള്ളവരാണ്
  rationale: מִן ഉത്ഭവസ്ഥലം സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിലെ സ്വതന്ത്ര സർവനാമവാക്യം സ്വാഭാവിക മലയാളത്തിനായി വിധേയപൂരകത്തോടെ അവതരിപ്പിച്ചു.
