source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֮ לֹ֣א נוּכַל֒ עַ֣ד אֲשֶׁ֤ר יֵאָֽסְפוּ֙ כָּל הָ֣/עֲדָרִ֔ים וְ/גָֽלֲלוּ֙ אֶת הָ/אֶ֔בֶן מֵ/עַ֖ל פִּ֣י הַ/בְּאֵ֑ר וְ/הִשְׁקִ֖ינוּ הַ/צֹּֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/008.yaml
  text: They said[a], “We cannot until all the flocks are gathered and they roll the stone away from the mouth of the well[b]; then we water the sheep.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “എല്ലാ ആട്ടിൻകൂട്ടങ്ങളും ഒന്നിച്ചുകൂടുകയും അവർ കിണറിന്റെ വായിൽനിന്ന്[b] കല്ല് ഉരുട്ടിമാറ്റുകയും ചെയ്യുന്നതുവരെ ഞങ്ങൾക്കു കഴിയില്ല; അതിനുശേഷം ഞങ്ങൾ ആടുകൾക്ക്[a] വെള്ളം കൊടുക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ആട്ടിൻകൂട്ടത്തിന്’; എബ്രായപദം ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറുകന്നുകാലികളെ കൂട്ടമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘കിണറിന്റെ തുറവിൽനിന്ന്’.
    reason: idiom_clarification
lexical_decisions:
- source_word: נוּכַל
  choice: ഞങ്ങൾക്കു കഴിയില്ല
  rationale: יכל എന്ന ക്രിയയുടെ ഒന്നാംപുരുഷ ബഹുവചനരൂപം കഴിവില്ലായ്മയെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു. എന്ത് ചെയ്യാൻ കഴിയില്ല എന്നത് മുൻസന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നതിനാൽ എബ്രായത്തിലെ സംക്ഷിപ്തത നിലനിർത്തി.
- source_word: יֵאָסְפוּ כָּל־הָעֲדָרִים
  choice: എല്ലാ ആട്ടിൻകൂട്ടങ്ങളും ഒന്നിച്ചുകൂടുകയും
  rationale: אסף എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ കൂട്ടങ്ങൾ ഒരിടത്ത് ഒന്നിച്ചുചേരുന്നതിനെ സൂചിപ്പിക്കുന്നു. עדר എന്നത് ഈ ഇടയസന്ദർഭത്തിൽ ചെറുകന്നുകാലികളുടെ കൂട്ടമാണ്; സ്വാഭാവിക മലയാളത്തിനായി ‘ആട്ടിൻകൂട്ടങ്ങൾ’ എന്നു നൽകി.
- source_word: וְגָלֲלוּ אֶת־הָאֶבֶן
  choice: അവർ ... കല്ല് ഉരുട്ടിമാറ്റുകയും
  rationale: גלל എന്നതിന് ‘ഉരുട്ടുക’ എന്നാണ് അർഥം. കിണറിന്റെ മുകളിൽനിന്ന് കല്ല് നീക്കുന്നതാണ് സന്ദർഭം; അതിനാൽ ചലനത്തിന്റെ ലക്ഷ്യം സ്വാഭാവികമായി ‘ഉരുട്ടിമാറ്റുക’ എന്നു വ്യക്തമാക്കി. എബ്രായത്തിലെ ബഹുവചന കർത്താവിനെ ‘അവർ’ എന്നു നിലനിർത്തി.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: കിണറിന്റെ വായ്ക്കൽനിന്ന്
  rationale: פי എന്ന ‘വായ്’ എന്ന ദൃശ്യരൂപകം കിണറിന്റെ തുറവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലും മനസ്സിലാകുന്ന ഈ രൂപകം നിലനിർത്തി.
- source_word: וְהִשְׁקִינוּ
  choice: അതിനു ശേഷം ഞങ്ങൾ ... വെള്ളം കൊടുക്കും
  rationale: שקה എന്ന ക്രിയയുടെ ഹിഫിൽ രൂപം മൃഗങ്ങൾക്ക് വെള്ളം കൊടുക്കുന്നതാണ്. മുൻപ്രവൃത്തികൾക്കു ശേഷമുള്ള ക്രമം വ്യക്തമാക്കാൻ ‘അതിനു ശേഷം’ ഉപയോഗിച്ചു.
- source_word: הַצֹּאן
  choice: ആടുകൾക്ക്
  rationale: צאן ചെറുകന്നുകാലികളെ—പ്രത്യേകിച്ച് ചെമ്മരിയാടുകളെയും കോലാടുകളെയും—കൂട്ടമായി സൂചിപ്പിക്കാം. സാധാരണ മലയാള ഇടയസന്ദർഭത്തിൽ ‘ആടുകൾ’ സ്വാഭാവികമാണ്; വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ക്രിയാക്രമവും ‘കിണറിന്റെ വായ്’ എന്ന ദൃശ്യരൂപകവും നിലനിർത്തി; ‘ഞങ്ങൾക്കു കഴിയില്ല’ എന്ന അപൂർണ്ണപ്രയോഗം സന്ദർഭം പൂരിപ്പിക്കുന്ന വിധത്തിൽ ഉദ്ദേശപൂർവം സംക്ഷിപ്തമായി വെച്ചു.
