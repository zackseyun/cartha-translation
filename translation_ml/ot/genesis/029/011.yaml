  language: ml
  text: അപ്പോൾ യാക്കോബ് റാഹേലിനെ ചുംബിച്ചു[a]; പിന്നെ ശബ്ദമുയർത്തി കരഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യാക്കോബ് റാഹേലിനെ ചുംബനത്തോടെ അഭിവാദ്യം ചെയ്തു.” ഹീബ്രു ക്രിയ സാധാരണയായി ‘ചുംബിച്ചു’ എന്നാണ് അർഥമാക്കുന്നത്; എന്നാൽ ഈ സന്ദർഭത്തിൽ അത് കുടുംബാംഗങ്ങൾ തമ്മിലുള്ള അഭിവാദ്യത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשַּׁק
  choice: ചുംബിച്ചു
  rationale: നשק എന്ന ക്രിയയുടെ ഖാൽ രൂപത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘ചുംബിക്കുക’ എന്നാണ്. ഈ സന്ദർഭത്തിൽ അത് കുടുംബപരമായ അഭിവാദ്യമായിരിക്കാമെങ്കിലും, പൊതുവായ ‘അഭിവാദ്യം ചെയ്തു’ എന്നാക്കി ശാരീരിക പ്രവൃത്തിയെ മറയ്ക്കാതെ മൂലപദത്തിന്റെ വ്യക്തമായ അർഥം നിലനിർത്തുന്നു.
- source_word: לְרָחֵל
  choice: റാഹേലിനെ
  rationale: ‘ചുംബിച്ചു’ എന്ന മലയാള ക്രിയയുടെ കർമമായി പേര് സ്വാഭാവികമായി -നെ വിഭക്തിയോടെ വരുന്നു. ഹീബ്രുവിലെ לְ എന്ന ഘടകം പദശഃ വേർതിരിച്ച് പരിഭാഷപ്പെടുത്താതെ മലയാള വാക്യഘടനയിൽ ഉൾപ്പെടുത്തി.
- source_word: וַיִּשָּׂא אֶת־קֹלוֹ
  choice: ശബ്ദമുയർത്തി
  rationale: ‘തന്റെ ശബ്ദം ഉയർത്തി’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥവും ശക്തിയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി പകർന്നു.
- source_word: וַיֵּבְךְּ
  choice: കരഞ്ഞു
  rationale: בכה എന്നത് കരയുക/വിലപിക്കുക എന്നർഥം നൽകുന്നു. ഇവിടെ ‘കരഞ്ഞു’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: וַ
  choice: അപ്പോൾ; പിന്നെ
  rationale: വാവ്-തുടർച്ച കഥയുടെ ക്രമാനുഗത പുരോഗതി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നും ‘പിന്നെ’ എന്നും നൽകുന്നത് ആവർത്തിച്ചുള്ള ‘അങ്ങനെ/ഉം’ പ്രയോഗത്തേക്കാൾ സ്വാഭാവികമായി സംഭവക്രമം വ്യക്തമാക്കുന്നു.
