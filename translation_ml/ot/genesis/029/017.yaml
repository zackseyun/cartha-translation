id: GEN.29.17
reference: Genesis 29:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עֵינֵ֥י לֵאָ֖ה רַכּ֑וֹת וְ/רָחֵל֙ הָֽיְתָ֔ה יְפַת תֹּ֖אַר וִ/יפַ֥ת מַרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/017.yaml
  text: Leah’s eyes were soft[a], but Rachel was beautiful in form and appearance.
translation:
  language: ml
  text: ലേയയുടെ കണ്ണുകൾ മൃദുവായിരുന്നു[a]; എന്നാൽ റാഹേൽ ആകാരത്തിലും കാഴ്ചയിലും സുന്ദരിയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കോമളമായിരുന്നു,’ ‘ലോലമായിരുന്നു,’ അല്ലെങ്കിൽ ‘ദുർബലമായിരുന്നു.’ എബ്രായ വിശേഷണം മൃദുത്വമോ കോമളത്വമോ സൂചിപ്പിക്കാം; കൃത്യമായ ഭാവം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: കണ്ണുകൾ
  rationale: നിർമിത ബഹുവചനം ലേയയുടെ പൊതുവായ ഭാവത്തെയല്ല, അവളുടെ കണ്ണുകളെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്.
- source_word: רַכּוֹת
  choice: മൃദുവായിരുന്നു
  rationale: ഈ വിശേഷണം മൃദുത്വമോ കോമളത്വമോ സൂചിപ്പിക്കാം. നിഷേധാത്മക വിലയിരുത്തൽ നിർബന്ധമാക്കാതെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നതിനാൽ ‘മൃദു’ തിരഞ്ഞെടുത്തു; കൃത്യമായ ഭാവം അനിശ്ചിതമായതിനാൽ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: יְפַת תֹּאַר
  choice: ആകാരത്തിൽ സുന്ദരി
  rationale: ഈ പദസമുച്ചയം ശരീരത്തിന്റെ ആകൃതിയെയോ രൂപഘടനയെയോ സൂചിപ്പിക്കുന്നു; ‘ആകാരത്തിൽ’ എന്നത് അതിനെ സ്വാഭാവികമായി വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: וִיפַת מַרְאֶה
  choice: കാഴ്ചയിൽ സുന്ദരി
  rationale: מַרְאֶה ദൃശ്യമായ ഭാവത്തെ സൂചിപ്പിക്കുന്നു. ‘ആകാരം’ എന്ന ആദ്യ വിവരണത്തിൽനിന്ന് വ്യത്യസ്തമായ രണ്ടാമത്തെ വിവരണം ഇങ്ങനെ സംരക്ഷിക്കുന്നു.
- source_word: וְ
  choice: എന്നാൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘കൂടാതെ/ഉം’ എന്നായാലും, ഇവിടെ ലേയയെയും റാഹേലിനെയും താരതമ്യപ്പെടുത്തി വൈരുധ്യം പ്രകടമാക്കുന്നതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ ‘ആകാരം / കാഴ്ച’ എന്ന ഇരട്ട വിവരണം ഒന്നാക്കി ചുരുക്കാതെ നിലനിർത്തി; רַכּוֹת എന്ന പദത്തിന്റെ യഥാർഥ ഭാവത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
