source:
  edition: WLC
  text: וַ/יֶּאֱהַ֥ב יַעֲקֹ֖ב אֶת רָחֵ֑ל וַ/יֹּ֗אמֶר אֶֽעֱבָדְ/ךָ֙ שֶׁ֣בַע שָׁנִ֔ים בְּ/רָחֵ֥ל בִּתְּ/ךָ֖ הַ/קְּטַנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/018.yaml
  text: Jacob loved Rachel[a], and he said, “I will serve you seven years for Rachel your younger daughter.”
translation:
  language: ml
  text: 'യാക്കോബ് റാഹേലിനെ സ്നേഹിച്ചു. അവൻ പറഞ്ഞു: “അങ്ങയുടെ ഇളയ മകളായ റാഹേലിനുവേണ്ടി ഞാൻ ഏഴു വർഷം അങ്ങയെ സേവിക്കാം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: സ്നേഹിച്ചു
  rationale: אָהַב എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘സ്നേഹിച്ചു’ എന്നത് നിലനിർത്തുന്നു; ‘പ്രണയത്തിലായിരുന്നു’ എന്നതുപോലുള്ള അധിക വ്യാഖ്യാനഭാവം ചേർക്കുന്നില്ല.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന സാധാരണ വാക്കിനെ നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തി നേരിട്ടുള്ള സംഭാഷണത്തിന് ആമുഖമാക്കുന്നു.
- source_word: אֶעֱבָדְךָ
  choice: ഞാൻ ... അങ്ങയെ സേവിക്കാം
  rationale: עבד എന്ന ക്രിയയിലെ അധ്വാനത്തിന്റെയും വ്യക്തിപരമായ സേവനത്തിന്റെയും അർഥങ്ങൾ നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് ലാബാനുവേണ്ടിയുള്ള തൊഴിൽസേവനമാണ്.
- source_word: שֶׁבַע שָׁנִים
  choice: ഏഴു വർഷം
  rationale: സംഖ്യയും കാലയളവും നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: בְּרָחֵל
  choice: റാഹേലിനുവേണ്ടി
  rationale: ഇവിടെയുള്ള ב സേവനത്തിന്റെ അടിസ്ഥാനമോ പ്രതിഫലമായി ഉദ്ദേശിക്കുന്ന വിവാഹബന്ധമോ സൂചിപ്പിക്കുന്നു; ‘റാഹേലിനുവേണ്ടി’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു, ഇടപാടിന്റെ സ്വഭാവം അതിരുകടന്ന് വ്യക്തമാക്കുന്നില്ല.
- source_word: בִּתְּךָ
  choice: അങ്ങയുടെ ... മകളായ
  rationale: രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ ‘മകൾ’ എന്ന പദം ആദരസൂചകമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הַקְּטַנָּה
  choice: ഇളയ
  rationale: ‘ചെറിയ’ എന്ന അടിസ്ഥാനാർഥമുള്ള വിശേഷണം സഹോദരിമാരുടെ താരതമ്യത്തിൽ പ്രായം കുറഞ്ഞവളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഇളയ’ എന്നാണ് സ്വാഭാവിക മലയാളം.
- source_word: וַ
  choice: വാക്യബന്ധം പ്രത്യേകം പദമായി പ്രകടിപ്പിച്ചിട്ടില്ല
  rationale: ആദ്യത്തെ waw തുടർന്നുപോകുന്ന ആഖ്യാനത്തെ ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ മുൻസന്ദർഭത്തോടുള്ള ഈ തുടർച്ച നിർബന്ധമായും ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘എന്നിട്ട്’ ചേർക്കാതെ സ്വാഭാവികമായി കൈമാറാം.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ലാബാനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ രണ്ടു തുടർച്ചാക്രിയകളെ മലയാളത്തിൽ രണ്ടു വാക്യങ്ങളാക്കി, അർഥബന്ധം മാറ്റാതെ വായനാസൗകര്യം വർധിപ്പിച്ചു.
