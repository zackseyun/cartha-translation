id: GEN.29.29
reference: Genesis 29:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן לָבָן֙ לְ/רָחֵ֣ל בִּתּ֔/וֹ אֶת בִּלְהָ֖ה שִׁפְחָת֑/וֹ לָ֖/הּ לְ/שִׁפְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/029.yaml
  text: And Laban gave Bilhah[a], his female servant, to Rachel his daughter as her female servant.
translation:
  language: ml
  text: ലാബാൻ തന്റെ മകളായ റാഹേലിന് തന്റെ ദാസിയായ ബിൽഹായെ അവളുടെ ദാസിയായി കൊടുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പദമായ שִׁפְחָה (ഷിഫ്ഹാ), ഇവിടെ രണ്ടിടത്തും “അടിമസ്ത്രീ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ വയ്യിഖ്തോൽ രൂപം കഴിഞ്ഞകാലത്തെ തുടർച്ചയായ ആഖ്യാനപ്രവർത്തനമായി വരുന്നു; മലയാളത്തിൽ ‘കൊടുത്തു’ എന്നത് ലളിതവും സ്വാഭാവികവുമാണ്.
- source_word: לָבָן
  choice: ലാബാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: לְרָחֵל
  choice: റാഹേലിന്
  rationale: לְ ഇവിടെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ദത്തിവിഭക്തി അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בִּתּוֹ
  choice: തന്റെ മകൾ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുരുഷലിംഗ പ്രത്യയം ലാബാനെയാണ് സൂചിപ്പിക്കുന്നത്; ഒരേ വാക്യത്തിലെ കർത്താവിലേക്കുള്ള തിരിച്ചുസൂചനയ്ക്ക് ‘തന്റെ’ സ്വാഭാവികമാണ്.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നിശ്ചിത നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന ഈ പദത്തിന് മലയാളത്തിൽ വേറിട്ട പദസമം ആവശ്യമില്ല; വാക്യഘടനയിലൂടെ പ്രവർത്തനം വ്യക്തമാകുന്നു.
- source_word: בִּלְהָה
  choice: ബിൽഹ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: שִׁפְחָתוֹ
  choice: തന്റെ ദാസിയായ
  rationale: שִׁפְחָה ഒരു സ്ത്രീ ദാസിയെയോ അടിമയെയോ സൂചിപ്പിക്കാം. ‘ദാസി’ ലിംഗസൂചന നിലനിർത്തുന്ന, വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദമാണ്; ഉടമസ്ഥതയുടെ ശക്തമായ നിയമസ്ഥിതി അനാവശ്യമായി നിർണ്ണയിക്കാതെ മൂലപദത്തിന്റെ പരിധി കാക്കുന്നു.
- source_word: לָהּ לְשִׁפְחָה
  choice: അവളുടെ ദാസിയായി
  rationale: റാഹേലിനോടുള്ള ബിൽഹയുടെ നിയുക്ത പങ്ക് മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ശִׁפְחָה എന്ന പദത്തിന്റെ ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: שִׁפְחָה എന്ന പദത്തിലെ ദാസി/അടിമ അർത്ഥപരിധി
  choice: ദാസി
  alternative: അടിമസ്ത്രീ
  rationale: മൂലപദം സേവകസ്ഥിതിയെയും അടിമസ്ഥിതിയെയും ഉൾക്കൊള്ളാം. മുഖ്യപാഠത്തിൽ ‘ദാസി’ വായനാസൗകര്യവും ലിംഗസൂചനയും നൽകുന്നു; എന്നാൽ ഉടമസ്ഥതയുടെ സാമൂഹിക-നിയമപരമായ ശക്തി പൂർണമായി മായാതിരിക്കാൻ പാദക്കുറിപ്പിൽ ‘അടിമസ്ത്രീ’ എന്ന സാധ്യത രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായത്തിലെ ‘തന്റെ ദാസി … അവളുടെ ദാസി’ എന്ന ആവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു; സാമൂഹികസ്ഥിതിയെ സംബന്ധിച്ച മൂലപദത്തിന്റെ അർത്ഥവ്യാപ്തി പാദക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
