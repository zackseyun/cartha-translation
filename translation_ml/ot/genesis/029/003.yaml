source:
  edition: WLC
  text: וְ/נֶאֶסְפוּ שָׁ֣מָּ/ה כָל הָ/עֲדָרִ֗ים וְ/גָלֲל֤וּ אֶת הָ/אֶ֨בֶן֙ מֵ/עַל֙ פִּ֣י הַ/בְּאֵ֔ר וְ/הִשְׁק֖וּ אֶת הַ/צֹּ֑אן וְ/הֵשִׁ֧יבוּ אֶת הָ/אֶ֛בֶן עַל פִּ֥י הַ/בְּאֵ֖ר לִ/מְקֹמָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/003.yaml
  text: And all the flocks would gather there[a], and they would roll the stone away from the mouth of the well and water the flock[b], and then put the stone back in its place over the mouth of the well.
translation:
  language: ml
  text: എല്ലാ ആട്ടിൻകൂട്ടങ്ങളും അവിടെ ഒന്നിച്ചുകൂടുമായിരുന്നു. അപ്പോൾ കിണറിന്റെ വായ്ക്കുമീതെയുള്ള കല്ല് ഉരുട്ടിമാറ്റി ആടുകൾക്ക് വെള്ളം കൊടുത്തശേഷം, കല്ല് അതിന്റെ സ്ഥാനത്ത് കിണറിന്റെ വായ്ക്കുമീതെ തിരികെ വെക്കുമായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנֶאֶסְפוּ
  choice: ഒന്നിച്ചുകൂടുമായിരുന്നു
  rationale: നിഫാൽ അപൂർണക്രിയ ഇവിടെ പതിവായി ആവർത്തിച്ചിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-മുമായിരുന്നു’ രൂപം ആ ഭൂതകാലപതിവ് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: כָל הָעֲדָרִים
  choice: എല്ലാ ആട്ടിൻകൂട്ടങ്ങളും
  rationale: ഈ ഇടയസന്ദർഭത്തിൽ עֲדָרִים ചെറുകന്നുകാലികളുടെ കൂട്ടങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; തുടർന്നുള്ള הַצֹּאן-നോടും സന്ദർഭത്തോടും ഒത്തുപോകാൻ ‘ആട്ടിൻകൂട്ടങ്ങൾ’ തിരഞ്ഞെടുത്തു.
- source_word: וְגָלֲלוּ אֶת הָאֶבֶן
  choice: കല്ല് ഉരുട്ടിമാറ്റി
  rationale: גלל എന്ന ക്രിയയിലെ ഉരുട്ടുന്ന ദൃശ്യരൂപം നിലനിർത്തുകയും കിണറിന്റെ വായിൽനിന്ന് കല്ല് നീക്കുന്നതെന്ന ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: കിണറിന്റെ വായ്ക്കുമീതെയുള്ള
  rationale: פי הבאר എന്ന എബ്രായ രൂപകം ‘കിണറിന്റെ വായ്’ എന്നു നിലനിർത്തുന്നു; מעל സൂചിപ്പിക്കുന്ന മീതെയുള്ള സ്ഥാനം വ്യക്തമായി നൽകുന്നു.
- source_word: וְהִשְׁקוּ אֶת הַצֹּאן
  choice: ആട്ടിൻകൂട്ടങ്ങൾക്ക് വെള്ളം കൊടുത്തശേഷം
  rationale: ഹിഫിൽ രൂപമായ שׁקה ‘കുടിപ്പിക്കുക/വെള്ളം കൊടുക്കുക’ എന്നാണ്. הַצֹּאן ഏകവചനസമൂഹനാമമായതിനാൽ മലയാളത്തിൽ സന്ദർഭോചിതമായി ‘ആട്ടിൻകൂട്ടങ്ങൾ’ എന്നു നൽകി.
- source_word: וְהֵשִׁיבוּ
  choice: തിരികെ വെക്കുമായിരുന്നു
  rationale: ഹിഫിൽ രൂപം വസ്തുവിനെ പഴയ സ്ഥാനത്തേക്കു മടക്കിവെക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആവർത്തിത പ്രവൃത്തിയും മലയാളത്തിൽ നിലനിർത്തി.
- source_word: עַל פִּי הַבְּאֵר לִמְקֹמָהּ
  choice: കിണറിന്റെ വായ്ക്കുമീതെ അതിന്റെ സ്ഥാനത്ത്
  rationale: കല്ല് കിണറിന്റെ തുറവിനു മീതെയുള്ള അതിന്റെ നിശ്ചിത സ്ഥാനത്തേക്കു മടക്കിവെച്ചുവെന്ന സ്ഥലബന്ധം കൃത്യമായി സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ പതിവുപ്രവൃത്തിയുടെ ഭാവം നിലനിർത്തി. തുടർക്രിയകളിലെ കർത്താവിനെ എബ്രായപാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘ഇടയന്മാർ’ എന്ന് ചേർക്കാതെ മലയാളത്തിലെ കർത്തൃലോപം ഉപയോഗിച്ചു; ഇതിലൂടെ ഉറവിടത്തിലെ സൂചനാത്മകത സംരക്ഷിച്ചു.
