  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָבָ֗ן ט֚וֹב תִּתִּ֣/י אֹתָ֣/הּ לָ֔/ךְ מִ/תִּתִּ֥/י אֹתָ֖/הּ לְ/אִ֣ישׁ אַחֵ֑ר שְׁבָ֖/ה עִמָּדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/019.yaml
  text: Laban said[a], “It is better that I give her to you than that I give her to another man. Stay with me.”
translation:
  language: ml
  text: 'ലാബാൻ പറഞ്ഞു: “അവളെ മറ്റൊരാൾക്കു കൊടുക്കുന്നതിനെക്കാൾ അവളെ നിനക്കു കൊടുക്കുന്നതാണ് എനിക്കു നല്ലത്.[a] എന്നോടൊപ്പം താമസിക്കൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവളെ നിനക്കു കൊടുക്കുന്നതു എനിക്കു നല്ലതാണ്, അവളെ മറ്റൊരാൾക്കു കൊടുക്കുന്നതിനെക്കാൾ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം നേരിട്ടുള്ള സംഭാഷണം അവതരിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ തുല്യപദം ‘പറഞ്ഞു’ ആണ്.
- source_word: טוֹב
  choice: നല്ലത്
  rationale: מִן ചേർന്ന താരതമ്യഘടനയിൽ ‘ഒന്നിനെക്കാൾ മറ്റൊന്ന് നല്ലത്’ എന്ന മലയാളപ്രയോഗം അർത്ഥവും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: תִּתִּי אֹתָהּ לָךְ
  choice: അവളെ നിനക്കു കൊടുക്കുന്നത്
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയമുള്ള ക്രിയാനാമരൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാനാമഘടനയായി പരിഭാഷപ്പെടുത്തി; കർത്താവ് ലാബാൻ ആണെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: מִתִּתִּי אֹתָהּ לְאִישׁ אַחֵר
  choice: അവളെ മറ്റൊരാൾക്കു കൊടുക്കുന്നതിനെക്കാൾ
  rationale: താരതമ്യസൂചകമായ מִן-ഉം ക്രിയാനാമവും മലയാളത്തിലെ ‘-നെക്കാൾ’ ഘടനയിൽ കൃത്യമായി പ്രതിഫലിക്കുന്നു.
- source_word: אִישׁ אַחֵר
  choice: മറ്റൊരാൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘മറ്റൊരു പുരുഷൻ’ എന്നാണെങ്കിലും വിവാഹസന്ദർഭത്തിൽ ‘മറ്റൊരാൾ’ സ്വാഭാവികമാണ്; ‘മറ്റൊരു ഭർത്താവ്’ എന്നു പറയുന്നത് മൂലത്തിൽ വ്യക്തമല്ലാത്ത വ്യാഖ്യാനം ചേർക്കും.
- source_word: שְׁבָה
  choice: താമസിക്കൂ
  rationale: ഇവിടെ ישׁב എന്ന ആജ്ഞാരൂപം ഒരിടത്ത് തുടരുക/വസിക്കുക എന്ന അർത്ഥത്തിലാണ്; ‘താമസിക്കൂ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: עִמָּדִי
  choice: എന്നോടൊപ്പം
  rationale: ലാബാനോടുകൂടെ തുടർന്നുള്ള സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും കൃത്യവുമായ മലയാളപ്രയോഗം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. എബ്രായത്തിലെ താരതമ്യഘടന നിലനിർത്തിക്കൊണ്ട് പ്രധാനവാചകം സ്വാഭാവികമാക്കി; കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകി.
