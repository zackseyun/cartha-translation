  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּגֵּ֨ד יַעֲקֹ֜ב לְ/רָחֵ֗ל כִּ֣י אֲחִ֤י אָבִ֨י/הָ֙ ה֔וּא וְ/כִ֥י בֶן רִבְקָ֖ה ה֑וּא וַ/תָּ֖רָץ וַ/תַּגֵּ֥ד לְ/אָבִֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/012.yaml
  text: Jacob told Rachel that he was her father's relative and that he was Rebekah's son[a]. Then she ran and told her father.
translation:
  language: ml
  text: യാക്കോബ് റാഹേലിനോട് താൻ അവളുടെ അപ്പന്റെ ബന്ധുവാണെന്ന്[a] റിബെക്കയുടെ മകനാണെന്നും പറഞ്ഞു. അപ്പോൾ അവൾ ഓടിച്ചെന്ന് തന്റെ അപ്പനോട് വിവരം പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ പദശഃ ‘അവളുടെ അപ്പന്റെ സഹോദരൻ’ എന്നാണ്. ഇവിടെ ‘സഹോദരൻ’ എന്ന പദം അടുത്ത പുരുഷബന്ധുവിനെ സൂചിപ്പിക്കുന്ന വിശാലാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു; യാക്കോബ് ലാബാന്റെ സഹോദരീപുത്രനാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: പറഞ്ഞു
  rationale: נגד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ഒരു കാര്യം അറിയിക്കുക എന്ന സാധാരണ അർഥത്തിലാണ്; മലയാള ആഖ്യാനത്തിൽ ‘പറഞ്ഞു’ സ്വാഭാവികമാണ്.
- source_word: כִּי
  choice: എന്നും
  rationale: ‘പറഞ്ഞു’ എന്ന ക്രിയയ്ക്കു പിന്നാലെ വരുന്ന പരോക്ഷവചനത്തിലെ രണ്ടു ഉള്ളടക്കവാക്യങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: אֲחִי אָבִיהָ
  choice: അവളുടെ അപ്പന്റെ ബന്ധു
  rationale: പദശഃ ‘അവളുടെ അപ്പന്റെ സഹോദരൻ’ എന്നാണെങ്കിലും אָח അടുത്ത പുരുഷബന്ധുവിനെയും സൂചിപ്പിക്കാം; യാക്കോബ് ലാബാന്റെ സഹോദരീപുത്രനായതിനാൽ ‘ബന്ധു’ സന്ദർഭസാരം കൃത്യമായി നൽകുന്നു. പദപ്രയോഗത്തിന്റെ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בֶן רִבְקָה
  choice: റിബെക്കയുടെ മകൻ
  rationale: ലളിതമായ പുത്രബന്ധപ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וַתָּרָץ
  choice: ഓടിച്ചെന്ന്
  rationale: רץ എന്നത് ഓടുന്നതിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള അറിയിക്കലിലേക്കുള്ള വേഗമേറിയ നീക്കം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: וַתַּגֵּד
  choice: വിവരം പറഞ്ഞു
  rationale: ആദ്യത്തെ נגד തന്നെയാണെങ്കിലും, ലക്ഷ്യവ്യക്തിയോട് വിവരം അറിയിക്കുന്ന അർഥം മലയാളത്തിൽ വ്യക്തവും ആവർത്തനഭാരം കുറഞ്ഞതുമായി നൽകുന്നു.
- source_word: לְאָבִיהָ
  choice: തന്റെ അപ്പനോട്
  rationale: കർത്രിയായ റാഹേലുമായുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
