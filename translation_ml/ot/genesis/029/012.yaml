  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അപ്പൻ’ എന്നത് ആവർത്തിക്കുന്ന אָב പദത്തിന് സാധാരണവും സ്വാഭാവികവുമായ തെരഞ്ഞെടുപ്പാണ്; യഥാർഥ എബ്രായ ബന്ധുപദത്തിന്റെ രൂപവും അതിലെ ആശയവ്യാപ്തിയും അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
