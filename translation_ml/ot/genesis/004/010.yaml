source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מֶ֣ה עָשִׂ֑יתָ ק֚וֹל דְּמֵ֣י אָחִ֔י/ךָ צֹעֲקִ֥ים אֵלַ֖/י מִן הָֽ/אֲדָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/010.yaml
  text: And he said[a], “What have you done? The voice of your brother’s blood is crying out to me from the ground.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “നീ എന്താണ് ചെയ്തത്? നിന്റെ സഹോദരന്റെ രക്തത്തിന്റെ ശബ്ദം[a] മണ്ണിൽനിന്ന് എന്നോടു നിലവിളിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘രക്തങ്ങൾ’ എന്ന ബഹുവചനരൂപമാണ്; രക്തച്ചൊരിച്ചിലിന്റെ സന്ദർഭങ്ങളിൽ ഈ രൂപം പതിവായി ഉപയോഗിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ‘രക്തം’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ തുടർച്ചയായി വിവർത്തനം ചെയ്തു.
- source_word: מֶה עָשִׂיתָ
  choice: നീ എന്താണ് ചെയ്തത്?
  rationale: പൂർത്തിയായ പ്രവൃത്തിയെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ദൈവിക ചോദ്യം അതിന്റെ കുറ്റാരോപണശക്തി കൂട്ടിച്ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: קוֹל דְּמֵי אָחִיךָ
  choice: നിന്റെ സഹോദരന്റെ രക്തം
  rationale: ‘നിന്റെ സഹോദരന്റെ രക്തത്തിന്റെ ശബ്ദം നിലവിളിക്കുന്നു’ എന്ന ഘടന മലയാളത്തിൽ അസ്വാഭാവികമാണ്. ‘നിലവിളിക്കുന്നു’ എന്ന ക്രിയതന്നെ ശബ്ദത്തിന്റെ ആശയം വഹിക്കുന്നതിനാൽ, രക്തം തന്നെയാണ് നിലവിളിക്കുന്നതെന്ന മൂലപാഠത്തിലെ വ്യക്തിവൽക്കരണം സ്വാഭാവികമായി നിലനിർത്തി.
- source_word: דְּמֵי
  choice: രക്തം[a]
  rationale: എബ്രായത്തിൽ ബഹുവചനരൂപമാണെങ്കിലും രക്തച്ചൊരിച്ചിലിന്റെ സന്ദർഭങ്ങളിൽ അത് പ്രയോഗശൈലിപരമാണ്; മലയാളത്തിൽ ഏകവചന ദ്രവ്യനാമമായ ‘രക്തം’ സ്വാഭാവികമാണ്. ബഹുവചനരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: צֹעֲקִים
  choice: നിലവിളിക്കുന്നു
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന ശക്തമായ അഭ്യർഥനയെയോ നീതിക്കായുള്ള നിലവിളിയെയോ സൂചിപ്പിക്കുന്ന പങ്കുപദത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു.
- source_word: אֵלַי
  choice: എന്നോടു
  rationale: നിലവിളി ദൈവത്തെ നേരിട്ട് അഭിമുഖീകരിക്കുന്നു എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִן הָאֲדָמָה
  choice: മണ്ണിൽനിന്ന്
  rationale: കയീൻ ആഖ്യാനത്തിലെ മണ്ണുമായുള്ള ബന്ധവും രക്തം ചൊരിയപ്പെട്ട ഭൗതിക നിലവും ‘മണ്ണ്’ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഹാബെലിന്റെ ചൊരിയപ്പെട്ട രക്തത്തിന്റെ വ്യക്തിവൽക്കരണം
  choice: രക്തം തന്നെയാണ് ദൈവത്തോടു നിലവിളിക്കുന്നതെന്ന ദൃശ്യഭാഷ നിലനിർത്തി.
  alternative: രക്തപാതകക്കുറ്റം നീതിക്കായി ദൈവത്തോട് അപേക്ഷിക്കുന്നു എന്നു അമൂർത്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: മൂലപാഠം രക്തത്തെ സജീവമായി നിലവിളിക്കുന്നതായി ചിത്രീകരിക്കുന്നു. അതിനെ ഒരു പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനമായി ചുരുക്കാതെ അതിന്റെ നൈതികവും ദൈവശാസ്ത്രപരവുമായ ശക്തി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ നേരിട്ടുള്ള കുറ്റാരോപണവും രക്തത്തിന്റെ വ്യക്തിവൽക്കരണവും നിലനിർത്തിയപ്പോൾ, മലയാളത്തിൽ അസ്വാഭാവികമായ ‘രക്തത്തിന്റെ ശബ്ദം നിലവിളിക്കുന്നു’ എന്ന പദാനുപദഘടന ഒഴിവാക്കി.
