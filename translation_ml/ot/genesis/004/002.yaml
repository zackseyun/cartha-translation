  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֣סֶף לָ/לֶ֔דֶת אֶת אָחִ֖י/ו אֶת הָ֑בֶל וַֽ/יְהִי הֶ֨בֶל֙ רֹ֣עֵה צֹ֔אן וְ/קַ֕יִן הָיָ֖ה עֹבֵ֥ד אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/002.yaml
  text: And she gave birth again[a], to his brother Abel. Abel became a shepherd of flocks[c][b], but Cain was a worker of the ground.
translation:
  language: ml
  text: അവൾ വീണ്ടും കയീന്റെ സഹോദരനായ ഹാബെലിനെ പ്രസവിച്ചു.[a] ഹാബെൽ ആട്ടിൻകൂട്ടങ്ങളെ മേയ്ക്കുന്നവനായിരുന്നു[c]; കയീൻ നിലം കൃഷിചെയ്യുന്നവനായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൾ പ്രസവിക്കുന്നത് തുടർന്നു.” എബ്രായപ്രയോഗം ആവർത്തനത്തെയോ തുടർച്ചയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “ആട്ടിൻകൂട്ടങ്ങൾ” എന്നു പറയുന്നത് പ്രധാനമായും ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറുകന്നുകാലിക്കൂട്ടങ്ങളെയാണ്.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “ഹാബെൽ ആട്ടിൻകൂട്ടങ്ങളെ മേയ്ക്കുന്നവനായി.” എബ്രായക്രിയ ഇവിടെ ആ തൊഴിൽ ആയിത്തീർന്നതിനെ സൂചിപ്പിക്കാനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף לָלֶדֶת
  choice: അവൾ വീണ്ടും ... പ്രസവിച്ചു
  rationale: יסף + infinitive എന്ന എബ്രായ പ്രയോഗം ഒരു പ്രവൃത്തി വീണ്ടും ചെയ്യുന്നതോ തുടരുന്നതോ സൂചിപ്പിക്കുന്നു. ജനനവിവരണത്തിന്റെ ക്രമത്തിൽ ‘വീണ്ടും പ്രസവിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אֶת אָחִיו אֶת הָבֶל
  choice: അവന്റെ സഹോദരനായ ഹാബെലിനെ
  rationale: ഇരട്ട കർമചിഹ്നം ജനിച്ച കുഞ്ഞിനെ ആദ്യം കയീന്റെ സഹോദരനെന്നും തുടർന്ന് ഹാബെൽ എന്നും സമാനാധികരണത്തിൽ തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിൽ ഈ ബന്ധപരമായ ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הֶבֶל
  choice: ഹാബെൽ
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַיְהִי / הָיָה
  choice: ആയിത്തീർന്നു
  rationale: ഇവിടെ היה സഹോദരന്മാരുടെ തൊഴിൽ/പങ്ക് അവതരിപ്പിക്കുന്നു. ഏകോപിതമായ മലയാള വാക്യത്തിൽ ബഹുവചന ക്രിയയായി നൽകിയിരിക്കുന്നു; ‘ആയിരുന്നു’ എന്ന വായനയും സാദ്ധ്യമാണ്.
- source_word: רֹעֵה צֹאן
  choice: ആടുമാടുകളെ മേയ്ക്കുന്നവൻ
  rationale: רעה മേയ്ക്കുകയെന്നതും צאן പ്രധാനമായും ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറുകന്നുകാലിക്കൂട്ടമെന്നതും സൂചിപ്പിക്കുന്നു. സാധാരണ മലയാളത്തിൽ ‘ആടുമാടുകൾ’ ഈ കൂട്ടായ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: קַיִן
  choice: കയീൻ
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: עֹבֵד אֲדָמָה
  choice: നിലം കൃഷിചെയ്യുന്നവൻ
  rationale: പ്രയോഗം മണ്ണ്/നിലം പണിയുകയോ കൃഷിചെയ്യുകയോ ചെയ്യുന്നവനെ സൂചിപ്പിക്കുന്നു. ‘കർഷകൻ’ എന്ന കൂടുതൽ പൊതുവായ വ്യാഖ്യാനത്തേക്കാൾ മൂലപദബന്ധം ഇതിൽ വ്യക്തമാണ്.
- source_word: אֲדָמָה
  choice: നിലം
  rationale: ആദിമ ഉല്പത്തി വിവരണത്തിലെ മണ്ണ്/ഭൂമി എന്ന ആശയം നിലനിർത്തുകയും മലയാളത്തിൽ കൃഷിയോടു ചേർന്ന് സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: וְ
  choice: -ഉം ... -ഉം
  rationale: എബ്രായ സംയോജകം അടിസ്ഥാനപരമായി ‘യും/ഉം’ എന്നാണ്. തൊഴിൽവ്യത്യാസം വ്യക്തമെങ്കിലും നൈതികവിരോധം സൂചിപ്പിക്കാതിരിക്കാൻ മലയാളത്തിൽ സമാന്തര സംയോജനം ഉപയോഗിച്ചു.
theological_decisions:
- issue: സഹോദരന്മാരുടെ തൊഴിലുകളുടെ ആഖ്യാനപരമായ അവതരണം
  choice: രണ്ടു തൊഴിലുകളും നൈതിക വിലയിരുത്തലില്ലാത്ത സമാന്തര വിവരണമായി നൽകി.
  alternative: ‘എന്നാൽ’ പോലുള്ള ശക്തമായ വിരോധസൂചകം ഉപയോഗിച്ച് ഒരു തൊഴിൽ മറ്റൊന്നിനെതിരെ നിർത്തുക.
  rationale: ഈ വാക്യത്തിലെ എബ്രായപാഠം തൊഴിലുകൾ മാത്രം വിവരിക്കുന്നു; ഒന്നിനെ ഉയർത്തുകയോ താഴ്ത്തുകയോ ചെയ്യുന്ന ദൈവശാസ്ത്രപരമായ വിലയിരുത്തൽ ഇവിടെ പ്രകടമല്ല.
- issue: היה എന്ന ക്രിയയുടെ കാല/വികാസഭാവം
  choice: ആയിത്തീർന്നു
  alternative: ആയിരുന്നു
  rationale: ക്രിയയ്ക്ക് അവസ്ഥയെയോ തൊഴിൽപങ്കിലേക്കുള്ള വികാസത്തെയോ സൂചിപ്പിക്കാം. ആഖ്യാനത്തിന്റെ മുന്നേറ്റം സ്വാഭാവികമായി നൽകാൻ ‘ആയിത്തീർന്നു’ തിരഞ്ഞെടുത്തു; സ്ഥിരാവസ്ഥാപരമായ മറ്റൊരു വായന കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അവന്റെ സഹോദരനായ’ എന്ന ബന്ധവാചകം എബ്രായത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു. തൊഴിൽവിവരണങ്ങളിൽ സമാന്തര ഘടന ഉപയോഗിച്ച് അനാവശ്യമായ നൈതികവിരോധം ഒഴിവാക്കി.
