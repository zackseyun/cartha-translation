- from: അവൾ വീണ്ടും അവന്റെ സഹോദരനായ ഹാബെലിനെ പ്രസവിച്ചു.[a] ഹാബെൽ ആടുമാടുകളെ മേയ്ക്കുന്നവനും[b] കയീൻ നിലം കൃഷിചെയ്യുന്നവനും ആയിത്തീർന്നു.[c]
  to: അവൾ വീണ്ടും കയീന്റെ സഹോദരനായ ഹാബെലിനെ പ്രസവിച്ചു.[a] ഹാബെൽ ആട്ടിൻകൂട്ടങ്ങളെ മേയ്ക്കുന്നവനായിരുന്നു[c]; കയീൻ നിലം കൃഷിചെയ്യുന്നവനായിരുന്നു.[b]
