id: GEN.4.5
reference: Genesis 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶל קַ֥יִן וְ/אֶל מִנְחָת֖/וֹ לֹ֣א שָׁעָ֑ה וַ/יִּ֤חַר לְ/קַ֨יִן֙ מְאֹ֔ד וַֽ/יִּפְּל֖וּ פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/005.yaml
  text: But for Cain and for his offering he had no regard[a]. So Cain became very angry[b], and his face fell.
translation:
  language: ml
  text: എന്നാൽ കയീനെയും അവന്റെ വഴിപാടിനെയും അവിടുന്ന് കടാക്ഷിച്ചില്ല[a]. അതിനാൽ കയീൻ അത്യന്തം കോപിച്ചു; അവന്റെ മുഖം വാടി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കയീനെയും അവന്റെ വഴിപാടിനെയും അവിടുന്ന് അനുകൂലമായി നോക്കിയില്ല.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായയിൽ അക്ഷരാർഥം ‘അവന്റെ മുഖം വീണു’; മ്ലാനനാകുന്നതിനെയോ നിരാശനാകുന്നതിനെയോ സൂചിപ്പിക്കുന്ന ഭാവപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל קַיִן וְאֶל מִנְחָתו
  choice: കയീനെയും അവന്റെ വഴിപാടിനെയും
  rationale: ആവർത്തിച്ചിരിക്കുന്ന אֶל, ശָׁעָה എന്ന ക്രിയയോടൊപ്പം, പരിഗണനയുടെ കർമങ്ങളെ സൂചിപ്പിക്കുന്നു. മִנְחָה ഇവിടെ ദൈവത്തിനു സമർപ്പിക്കുന്ന ആരാധനാപരമായ വഴിപാടാണ്.
- source_word: לֹא שָׁעָה
  choice: കടാക്ഷിച്ചില്ല
  rationale: ശָׁעָה ഇവിടെ അനുകൂലമായി നോക്കുക അഥവാ അംഗീകാരത്തോടെ പരിഗണിക്കുക എന്ന അർഥത്തിലാണ്. ‘കടാക്ഷിച്ചില്ല’ ദൈവിക അനുകൂല പരിഗണന ലഭിക്കാതിരുന്നതിനെ സംക്ഷിപ്തമായി പറയുന്നു; അതിന്റെ കാരണം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: וַיִּחַר לְקַיִן מְאֹד
  choice: കയീൻ അത്യന്തം കോപിച്ചു
  rationale: ‘കത്തുക’ എന്ന എബ്രായ ഭാവപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; מְאֹד എന്ന തീവ്രതയും നിലനിർത്തുന്നു.
- source_word: וַיִּפְּלוּ פָּנָיו
  choice: അവന്റെ മുഖം വാടി
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ മുഖം വീണു’ എന്ന ദൃശ്യഭാവം നിരാശയോ മ്ലാനതയോ പ്രകടമാക്കുന്നു. ‘മുഖം വാടി’ മലയാളത്തിലെ സ്വാഭാവിക സമാനപ്രയോഗമാണ്.
theological_decisions:
- issue: കയീന്റെ വഴിപാടിനോടുള്ള ദൈവിക പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: അനുകൂലമായ കടാക്ഷം ലഭിച്ചില്ലെന്ന നിലയിൽ വിവർത്തനം ചെയ്യുക; കാരണം വ്യക്തമാക്കാതിരിക്കുക.
  alternative: ‘സ്വീകരിച്ചില്ല’ എന്ന കൂടുതൽ നിർവചനാത്മകമായ ഭാഷ ഉപയോഗിക്കുക.
  rationale: എബ്രായ പാഠം കയീനെയും അവന്റെ വഴിപാടിനെയും ദൈവം ശָׁעָה ചെയ്തില്ലെന്നാണ് പറയുന്നത്; എന്തുകൊണ്ടെന്ന് ഈ വാക്യം വിശദീകരിക്കുന്നില്ല. അതിനാൽ വിവർത്തനം ഒരു പ്രത്യേക ദൈവശാസ്ത്രകാരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവിടുന്ന്’ എന്ന ആദരസൂചക സർവനാമം മുൻവാക്യത്തിലെ യഹോവയെ സൂചിപ്പിക്കുന്നു. പ്രധാനപാഠത്തിൽ എബ്രായത്തിന്റെ സംക്ഷിപ്തതയും ദൈവിക പ്രതികരണത്തെക്കുറിച്ചുള്ള നിയന്ത്രിതമായ പ്രസ്താവനയും നിലനിർത്തിയിരിക്കുന്നു.
