  text: וַ/תֵּ֥לֶד עָדָ֖ה אֶת יָבָ֑ל ה֣וּא הָיָ֔ה אֲבִ֕י יֹשֵׁ֥ב אֹ֖הֶל וּ/מִקְנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/020.yaml
  text: Adah bore Jabal[a]; he was the father of those who dwell in tents and have livestock.
translation:
  language: ml
  text: ആദാ യാബാലിനെ പ്രസവിച്ചു. അവൻ കൂടാരങ്ങളിൽ പാർക്കുകയും കന്നുകാലികളെ വളർത്തുകയും ചെയ്യുന്നവരുടെ പിതാവായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കൂടാരവാസികളുടെയും കന്നുകാലി വളർത്തുന്നവരുടെയും പിതാവ്.” ഇവിടെ “പിതാവ്” എന്ന ഹീബ്രു പ്രയോഗത്തിന് പൂർവികൻ, സ്ഥാപകൻ, അല്ലെങ്കിൽ ഒരു ജീവിതരീതിയുടെ ആദിപ്രവർത്തകൻ എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: പ്രസവിച്ചു
  rationale: വംശാവലിവിവരണത്തിലെ ילד എന്ന ക്രിയയുടെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: עָדָה
  choice: ആദാ
  rationale: വ്യക്തിനാമത്തിന്റെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: יָבָל
  choice: യാബാൽ
  rationale: വ്യക്തിനാമത്തിന്റെ ഹീബ്രു രൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: הוּא הָיָה
  choice: അവൻ ... ആയിരുന്നു
  rationale: യാബാലിന്റെ പങ്ക് തിരിച്ചറിയിക്കുന്ന പ്രവചനഘടന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲבִי
  choice: പിതാവായിരുന്നു
  rationale: മൂലപാഠത്തിലെ 'പിതാവ്' എന്ന രൂപകം സംരക്ഷിക്കുന്നു; ഇവിടെ പൂർവികൻ, സ്ഥാപകൻ, അല്ലെങ്കിൽ ഒരു ജീവിതരീതിയുടെ ആദിമാതൃക എന്ന വിശാല അർഥം ഉണ്ടാകാം.
- source_word: יֹשֵׁב אֹהֶל
  choice: കൂടാരങ്ങളിൽ പാർക്കുന്നവർ
  rationale: ഏകവചന കർത്തൃവാചകത്തിന് ഇവിടെ ഒരു ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സമൂഹവാചകബലം ഉള്ളതിനാൽ മലയാളത്തിൽ ബഹുവചനമായി വ്യക്തമാക്കുന്നു.
- source_word: וּמִקְנֶה
  choice: കന്നുകാലികളെ വളർത്തുന്നവർ
  rationale: מִקְנֶה വളർത്തുമൃഗങ്ങളെയോ ആട്ടിൻപറ്റം-മാട്ടിൻകൂട്ടം പോലുള്ള കന്നുകാലിസമ്പത്തിനെയോ സൂചിപ്പിക്കുന്നു; കൂടാരവാസത്തോടു ബന്ധപ്പെട്ട മൃഗപരിപാലനജീവിതം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അֲבִי എന്നതിന്റെ സാംസ്കാരിക-വംശാവലിപരമായ വ്യാപ്തി
  choice: പിതാവ്
  alternative: പൂർവികൻ / സ്ഥാപകൻ / ആദിമാതൃക
  rationale: മൂലഹീബ്രുവിലെ രൂപകവും അതിലെ അർഥവ്യാപ്തിയും പ്രധാനവാചകത്തിൽ നിലനിർത്തി, സാധ്യതകൾ അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു; ഒരു പ്രത്യേക വ്യാഖ്യാനം മാത്രം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഹീബ്രുവിലെ സംക്ഷിപ്ത വംശാവലിഘടനയും ‘പിതാവ്’ എന്ന രൂപകത്തിലെ യഥാർഥ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചിട്ടുണ്ട്.
