id: GEN.4.6
reference: Genesis 4:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל קָ֑יִן לָ֚/מָּה חָ֣רָה לָ֔/ךְ וְ/לָ֖/מָּה נָפְל֥וּ פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/006.yaml
  text: Then Yahweh said to Cain[a], “Why are you angry, and why has your face fallen?”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ കയീനോടു പറഞ്ഞു: “നീ കോപിച്ചിരിക്കുന്നത് എന്തുകൊണ്ട്? നിന്റെ മുഖം വാടിയിരിക്കുന്നത് എന്തുകൊണ്ട്?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “നിന്റെ മുഖം വീണിരിക്കുന്നത് എന്തുകൊണ്ട്?” അഥവാ, “നീ വിഷണ്ണനായിരിക്കുന്നത് എന്തുകൊണ്ട്?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ആ ക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു പദവികൊണ്ട് പകരാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ശബ്ദലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: אֶל קָיִן
  choice: കയീനോടു
  rationale: സംസാരത്തിന്റെ സ്വീകർത്താവിനെ മലയാളത്തിലെ സ്വാഭാവിക സംപ്രദാനരൂപത്തിൽ രേഖപ്പെടുത്തുന്നു; വ്യക്തിനാമം ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לָמָּה חָרָה לָךְ
  choice: നീ കോപിച്ചിരിക്കുന്നത് എന്തുകൊണ്ട്?
  rationale: ‘നിനക്കു കത്തി’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ പ്രയോഗം ഇവിടെ കോപത്തെ സൂചിപ്പിക്കുന്നു; അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְלָמָּה נָפְלוּ פָנֶיךָ
  choice: നിന്റെ മുഖം വാടിയിരിക്കുന്നത് എന്തുകൊണ്ട്?
  rationale: ‘നിന്റെ മുഖം വീണിരിക്കുന്നു’ എന്ന രൂപകപ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സാധാരണ വായനക്കാർക്കു സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അത് പദവിയായി മാറ്റാതെ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു. ‘യഹ്‌വെ’ ആധുനിക പണ്ഡിതലോകത്തിൽ സാധാരണ അംഗീകരിക്കുന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ കോപസൂചക പ്രയോഗവും ‘മുഖം വീഴുക’ എന്ന രൂപകവും സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുമ്പോൾ രണ്ടാമത്തേതിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
