  text: וְ/צִלָּ֣ה גַם הִ֗וא יָֽלְדָה֙ אֶת תּ֣וּבַל קַ֔יִן לֹטֵ֕שׁ כָּל חֹרֵ֥שׁ נְחֹ֖שֶׁת וּ/בַרְזֶ֑ל וַֽ/אֲח֥וֹת תּֽוּבַל קַ֖יִן נַֽעֲמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/022.yaml
  text: Zillah also bore Tubal-cain[a], a forger of every cutting tool of bronze and iron[b]. And the sister of Tubal-cain was Naamah.
translation:
  language: ml
  text: സില്ലയും തൂബൽ-കയീനെ പ്രസവിച്ചു. അവൻ വെങ്കലവും ഇരുമ്പുംകൊണ്ടുള്ള എല്ലാ ഉപകരണങ്ങളും അടിച്ചുണ്ടാക്കുന്നവനായിരുന്നു[a]. തൂബൽ-കയീന്റെ സഹോദരി നഅമാ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വെങ്കലത്തിലും ഇരുമ്പിലും പണിയെടുക്കുന്ന എല്ലാ ശില്പികളെയും മൂർച്ചകൂട്ടുന്നവൻ/അടിച്ചുപണിയുന്നവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. തൂബൽ-കയീൻ എന്ന പേരിനു ശേഷമുള്ള ഹീബ്രായി പ്രയോഗം ദുർഗ്രഹമാണ്; ഇത് അവൻ ലോഹോപകരണങ്ങൾ ഉണ്ടാക്കിയവനാണെന്നല്ല, ലോഹപ്പണിക്കാരനാണെന്നു വിവരിക്കുന്നതായും ചിലർ മനസ്സിലാക്കുന്നു. ‘വെങ്കലം’ എന്നതിന് ‘ചെമ്പ്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: גַם הִוא
  choice: സില്ലയും
  rationale: പ്രത്യയത്തിലൂടെ ഹീബ്രായിയിലെ കൂട്ടിച്ചേർക്കൽഭാവം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: יָלְדָה
  choice: പ്രസവിച്ചു
  rationale: വംശാവലിവിവരണത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: תּוּבַל קַיִן
  choice: തൂബൽ-കയീൻ
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: לֹטֵשׁ כָּל חֹרֵשׁ
  choice: എല്ലാത്തരം മൂർച്ചയുള്ള ഉപകരണങ്ങളും അടിച്ചുണ്ടാക്കുന്നവൻ
  rationale: പ്രയാസമുള്ള ഹീബ്രായി പ്രയോഗത്തിൽ അടിക്കുക/മൂർച്ചകൂട്ടുക എന്ന ക്രിയാഭാവവും ലോഹോപകരണങ്ങൾ എന്ന സാദ്ധ്യമായ അർത്ഥവും ഒരുമിച്ചു നൽകുന്നു; മറ്റൊരു വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: പുരാതന ലോഹപ്പട്ടികകളിൽ പതിവായ അർത്ഥം; ‘ചെമ്പ്’ എന്ന സാദ്ധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בַרְזֶל
  choice: ഇരുമ്പ്
  rationale: ലോഹപദത്തിന്റെ സാധാരണ മലയാള പരിഭാഷ.
- source_word: אֲחוֹת
  choice: സഹോദരി
  rationale: ബന്ധസൂചക പദത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: נַעֲמָה
  choice: നയമാ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
