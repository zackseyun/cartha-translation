  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל קַ֔יִן אֵ֖י הֶ֣בֶל אָחִ֑י/ךָ וַ/יֹּ֨אמֶר֙ לֹ֣א יָדַ֔עְתִּי הֲ/שֹׁמֵ֥ר אָחִ֖/י אָנֹֽכִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/009.yaml
  text: Then Yahweh said to Cain[a], “Where is Abel your brother?” And he said, “I do not know. Am I my brother’s keeper?”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ കയീനോടു പറഞ്ഞു: “നിന്റെ സഹോദരനായ ഹാബെൽ എവിടെ?” അവൻ പറഞ്ഞു: “എനിക്ക് അറിയില്ല.[a] ഞാൻ എന്റെ സഹോദരന്റെ കാവൽക്കാരനാണോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എനിക്ക് അറിയില്ലായിരുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പൂർണ്ണകാലരൂപം ഭൂതകാല നിഷേധമായി മനസ്സിലാക്കാനാകുമെങ്കിലും, ഈ സന്ദർഭത്തിൽ അത് ഇപ്പോഴത്തെ അറിവില്ലായ്മയുടെ അവകാശവാദമായി സ്വാഭാവികമായി പ്രവർത്തിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... ചോദിച്ചു / അവൻ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ ആദ്യം ‘അപ്പോൾ’ ഉപയോഗിച്ചു. ആദ്യ വാക്കുകൾ നേരിട്ടുള്ള ചോദ്യമായതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നും മറുപടിയിൽ അടിസ്ഥാന അർഥമായ ‘പറഞ്ഞു’ എന്നും നൽകി.
- source_word: אֵי
  choice: എവിടെ?
  rationale: സ്ഥലം ചോദിക്കുന്ന അവ്യയത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള രൂപം.
- source_word: הֶבֶל
  choice: ഹാബെൽ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം.
- source_word: אָחִיךָ
  choice: നിന്റെ സഹോദരനായ
  rationale: രണ്ടാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയവും പുരുഷലിംഗ ബന്ധപദവും നിലനിർത്തി; മലയാള വാക്യക്രമത്തിൽ പേരോടുള്ള ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא יָדַעְתִּי
  choice: എനിക്ക് അറിയില്ല
  rationale: ഹീബ്രു പൂർണ്ണകാലരൂപം ഭൂതകാല നിഷേധമായി എടുക്കാമെങ്കിലും, സംഭാഷണസന്ദർഭത്തിൽ ഇപ്പോഴത്തെ അറിവില്ലായ്മയുടെ അവകാശവാദമായാണ് സ്വാഭാവികമായി പ്രവർത്തിക്കുന്നത്.
- source_word: הֲשֹׁמֵר
  choice: കാവൽക്കാരൻ
  rationale: שמר എന്ന ധാതുവിലെ കാക്കുക, ശ്രദ്ധിക്കുക, മേൽനോട്ടം വഹിക്കുക എന്നീ അർഥവ്യാപ്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള നാമം; ഉത്തരവാദിത്വത്തിന്റെ പരിധി അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: אָחִי
  choice: എന്റെ സഹോദരന്റെ
  rationale: ഒന്നാം പുരുഷ ഏകവചന ഉടമസ്ഥതയും ഉറവിടത്തിലെ പുരുഷലിംഗ ബന്ധപദവും കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: אָנֹכִי
  choice: ഞാൻ
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ അലങ്കാരചോദ്യത്തിന്റെ ഘടനയിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു; ‘ഞാൻ തന്നെയോ’ എന്ന അധികവത്കരണം ഒഴിവാക്കി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ ലിപ്യന്തരിച്ചു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിനുപകരം സ്രോതസ്സിനോട് കൂടുതൽ ചേർന്ന ‘യഹ്‌വേ’ സ്വീകരിച്ചു.
- issue: കയീന്റെ അറിവില്ലായ്മയുടെ അവകാശവാദത്തിലെ കാലസൂചന
  choice: എനിക്ക് അറിയില്ല
  alternative: എനിക്ക് അറിയില്ലായിരുന്നു
  rationale: പൂർണ്ണകാലരൂപത്തിന് ഭൂതകാല നിഷേധസാധ്യതയുണ്ടെങ്കിലും സന്ദർഭത്തിൽ ഇത് ഇപ്പോഴത്തെ അറിവിനെക്കുറിച്ചുള്ള മറുപടിയായി സ്വാഭാവികമാണ്. യഥാർഥ വ്യാകരണപരമായ മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ചോദ്യോത്തരത്തിന്റെ മൂർച്ചയും കയീന്റെ ഒഴിഞ്ഞുമാറുന്ന അലങ്കാരചോദ്യവും നിലനിർത്തി. ‘കാവൽക്കാരൻ’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും שמר എന്ന പദത്തിന്റെ ഉത്തരവാദിത്വസൂചന സംരക്ഷിക്കുന്നതുമാണ്.
