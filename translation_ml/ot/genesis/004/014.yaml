source:
  edition: WLC
  text: הֵן֩ גֵּרַ֨שְׁתָּ אֹתִ֜/י הַ/יּ֗וֹם מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה וּ/מִ/פָּנֶ֖י/ךָ אֶסָּתֵ֑ר וְ/הָיִ֜יתִי נָ֤ע וָ/נָד֙ בָּ/אָ֔רֶץ וְ/הָיָ֥ה כָל מֹצְאִ֖/י יַֽהַרְגֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/014.yaml
  text: Look[a], today you have driven me away from the face of the ground, and I will be hidden from your face. I will be a wanderer and a fugitive on the earth[b], and whoever finds me will kill me.
translation:
  language: ml
  text: ഇതാ, ഇന്ന് നീ എന്നെ മണ്ണിന്റെ മുഖത്തുനിന്ന് ആട്ടിയകറ്റിയിരിക്കുന്നു; നിന്റെ മുഖത്തുനിന്ന് ഞാൻ മറഞ്ഞിരിക്കും[a]. ഞാൻ ഭൂമിയിൽ[b] അലഞ്ഞുതിരിയുന്നവനും അഭയമില്ലാത്തവനും ആയിരിക്കും; എന്നെ കണ്ടെത്തുന്ന ആരും എന്നെ കൊല്ലും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ സാന്നിധ്യത്തിൽനിന്ന് ഞാൻ ഒളിക്കും’ / ‘നിന്റെ സാന്നിധ്യത്തിൽനിന്ന് ഞാൻ മറയ്ക്കപ്പെടും.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘നിന്റെ മുഖത്തുനിന്ന്’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ദേശത്ത്.’ എബ്രായത്തിലെ אֶרֶץ എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘ഭൂമി’ എന്നോ ‘ദേശം’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും വാക്കിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന വ്യവഹാരകണത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: גֵּרַשְׁתָּ
  choice: നീ എന്നെ ... ആട്ടിയകറ്റിയിരിക്കുന്നു
  rationale: പുറത്താക്കുക, ഓടിച്ചുകളയുക എന്ന ശക്തമായ അർഥം നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിലും സ്വാഭാവികമാണ്.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: മണ്ണിന്റെ മുഖത്തുനിന്ന്
  rationale: എബ്രായത്തിലെ ‘മണ്ണിന്റെ മുഖം’ എന്ന ദൃശ്യരൂപവും മുൻസന്ദർഭത്തിലെ കയീന്റെ മണ്ണുമായുള്ള ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: וּמִפָּנֶיךָ אֶסָּתֵר
  choice: നിന്റെ മുഖത്തുനിന്ന് ഞാൻ മറയ്ക്കപ്പെടും
  rationale: നിഫാൽ രൂപത്തിന്റെ നിഷ്ക്രിയ/പ്രതിഫലനാത്മക സാധ്യതയും ‘നിന്റെ മുഖം’ എന്ന ദൈവസാന്നിധ്യസൂചകമായ മൂലഭാഷാ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: נָע וָנָד
  choice: അലഞ്ഞുതിരിയുന്നവനും അഭയമില്ലാത്തവനും
  rationale: സ്ഥിരതയില്ലാത്ത സഞ്ചാരവും ഇടമില്ലാത്ത, പുറത്താക്കപ്പെട്ട അവസ്ഥയും എന്നീ രണ്ടു ഘടകങ്ങൾ സ്വാഭാവിക മലയാളത്തിൽ വേർതിരിച്ചു നൽകുന്നു.
- source_word: בָּאָרֶץ
  choice: ഭൂമിയിൽ
  rationale: אֶרֶץ എന്ന പദത്തിന്റെ വിശാലമായ ‘ഭൂമി’ എന്ന അർഥം സന്ദർഭത്തിന് യോജിക്കുന്നു; ‘ദേശത്ത്’ എന്ന പ്രാദേശിക സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: כָל מֹצְאִי
  choice: എന്നെ കണ്ടെത്തുന്ന ആരും
  rationale: כָל + കൃദന്തരൂപത്തിന്റെ അനിശ്ചിത സാർവത്രികത മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יַהַרְגֵנִי
  choice: എന്നെ കൊല്ലും
  rationale: സാധാരണ ‘കൊല്ലുക’ എന്ന നേരിട്ടുള്ള അർഥം ലളിതവും കൃത്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: וּמִפָּנֶיךָ אֶסָּתֵר എന്ന ദൈവസാന്നിധ്യ പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: നിന്റെ മുഖത്തുനിന്ന് ഞാൻ മറയ്ക്കപ്പെടും
  alternative: നിന്റെ സാന്നിധ്യത്തിൽനിന്ന് ഞാൻ മറഞ്ഞിരിക്കും / ഞാൻ ഒളിക്കും
  rationale: ‘നിന്റെ മുഖത്തുനിന്ന്’ എന്ന മൂലഭാഷാ ദൃശ്യരൂപം ദൈവത്തിൽനിന്നുള്ള ബന്ധപരമായ അകൽച്ചയുടെ ഭാരം നിലനിർത്തുന്നു. നിഫാൽ രൂപം നിഷ്ക്രിയമായോ പ്രതിഫലനാത്മകമായോ ഗ്രഹിക്കാവുന്നതിനാൽ ആ അവ്യക്തത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മണ്ണിന്റെ മുഖം,’ ‘നിന്റെ മുഖം’ എന്നീ എബ്രായ ദൃശ്യപ്രയോഗങ്ങൾ ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു; വായനാസൗകര്യത്തിനായി പദക്രമം മലയാളത്തിന് അനുസൃതമാക്കി.
