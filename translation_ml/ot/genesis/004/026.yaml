  terminology: “ഏനോശ്,” “യഹ്‌വേ,” “നാമം വിളിച്ചപേക്ഷിക്കുക” എന്നിവ യോജിച്ചവയാണ്. രണ്ടാം അടിക്കുറിപ്പിൽ ക്രിയയെ “അശുദ്ധമാക്കപ്പെട്ടു” എന്നു വിശേഷിപ്പിക്കുന്നത് രൂപത്തെയും വ്യാഖ്യാനത്തെയും കുഴക്കുന്നു; ന്യൂനപക്ഷവായനയുടെ ലെക്സിക്കൽ അർഥം “അശുദ്ധമാക്കുക/അശുദ്ധമായി ഉപയോഗിക്കുക” എന്നാണ് വ്യക്തമാക്കേണ്ടത്.
