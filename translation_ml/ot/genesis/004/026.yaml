source:
  edition: WLC
  text: וּ/לְ/שֵׁ֤ת גַּם הוּא֙ יֻלַּד בֵּ֔ן וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ אֱנ֑וֹשׁ אָ֣ז הוּחַ֔ל לִ/קְרֹ֖א בְּ/שֵׁ֥ם יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/026.yaml
  text: And to Seth also a son was born[a], and he called his name Enosh[b]. At that time people began to call on the name of Yahweh.
translation:
  language: ml
  text: ശേത്തിനും ഒരു മകൻ ജനിച്ചു; ശേത്ത് തന്റെ മകന് ഏനോശ് എന്നു പേരിട്ടു. അക്കാലത്ത് ആളുകൾ യഹ്‌വേയുടെ നാമം വിളിച്ചപേക്ഷിക്കാൻ തുടങ്ങി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അപ്പോൾ യഹ്‌വേയുടെ നാമം വിളിച്ചപേക്ഷിക്കാൻ ആരംഭിക്കപ്പെട്ടു.”'
    reason: lexical_alternative
  - marker: b
    text: 'ഒരു ന്യൂനപക്ഷ വ്യാഖ്യാനം ഈ ക്രിയയെ “അശുദ്ധമാക്കുക” എന്ന അർഥത്തിൽ മനസ്സിലാക്കുന്നു. അതനുസരിച്ച്: “അപ്പോൾ ആളുകൾ യഹ്‌വേയുടെ നാമം അശുദ്ധമാക്കാൻ തുടങ്ങി.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁת גַּם הוּא
  choice: ശേത്തിനും
  rationale: വാക്യാരംഭത്തിലെ സംയോജകവും לְ എന്ന ഉപസർഗവും ഗַּם എന്ന കൂട്ടിച്ചേർക്കൽഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יֻלַּד בֵּן
  choice: ഒരു മകൻ ജനിച്ചു
  rationale: ഹീബ്രായയിലെ നിഷ്ക്രിയരൂപത്തിന്റെ അർഥം നിലനിർത്തുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ אֱנוֹשׁ
  choice: അവൻ അവന് ഏനോശ് എന്നു പേരിട്ടു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘അവന്റെ പേര് വിളിച്ചു’ എന്ന ഹീബ്രായ ശൈലിയെ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֱנוֹשׁ
  choice: ഏനോശ്
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; സാധാരണ നാമമായ ‘മനുഷ്യൻ/മർത്യൻ’ എന്ന സാധ്യതയുള്ള ശബ്ദസാദൃശ്യം വിവർത്തനത്തിൽ നിർബന്ധമായി ചേർത്തിട്ടില്ല.
- source_word: אָז
  choice: അക്കാലത്ത്
  rationale: സംഭവത്തിന്റെ കാലബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: הוּחַל
  choice: തുടങ്ങി
  rationale: ഇവിടെ സാധാരണയായി അംഗീകരിക്കപ്പെടുന്ന ആരംഭസൂചക അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഹീബ്രായയിലെ നിഷ്ക്രിയഘടനയും ‘അശുദ്ധമാക്കപ്പെട്ടു’ എന്ന ന്യൂനപക്ഷ വ്യാഖ്യാനവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിക്കുന്നു.
- source_word: לִקְרֹא בְּשֵׁם
  choice: നാമം വിളിച്ചപേക്ഷിക്കാൻ
  rationale: ദൈവനാമം വിളിച്ച് ആരാധനാപൂർവം അപേക്ഷിക്കുക എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ അർഥം വ്യക്തമാക്കുകയും ‘നാമം വിളിക്കുക’ എന്ന രൂപകൽപ്പന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: הוּחַל לִקְרֹא בְּשֵׁם יְהוָה എന്നതിന്റെ വ്യാഖ്യാനം
  choice: അക്കാലത്ത് ആളുകൾ യഹ്‌വേയുടെ നാമം വിളിച്ചപേക്ഷിക്കാൻ തുടങ്ങി
  alternative: അപ്പോൾ യഹ്‌വേയുടെ നാമം വിളിച്ചപേക്ഷിക്കാൻ ആരംഭിക്കപ്പെട്ടു; അല്ലെങ്കിൽ, ആളുകൾ യഹ്‌വേയുടെ നാമം അശുദ്ധമാക്കാൻ തുടങ്ങി
  rationale: സന്ദർഭത്തിലും സമാന ഹീബ്രായ പ്രയോഗങ്ങളിലും ‘നാമം വിളിച്ചപേക്ഷിക്കുക’ എന്നത് ആരാധനാപൂർവമായ ആഹ്വാനത്തെ സാധാരണയായി സൂചിപ്പിക്കുന്നു. എങ്കിലും הוּחַל എന്ന രൂപത്തിന്റെ നിഷ്ക്രിയഘടനയും חלל എന്ന ധാതുവിന്റെ ‘അശുദ്ധമാക്കുക’ എന്ന അർഥത്തെ ആശ്രയിച്ചുള്ള ന്യൂനപക്ഷവായനയും യഥാർഥ വ്യാഖ്യാനസാധ്യതകളായതിനാൽ അടിക്കുറിപ്പുകളിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. വംശാവലിവിവരണത്തിന്റെ ചുരുക്കം നിലനിർത്തിക്കൊണ്ട് അവസാന വാക്യഭാഗത്തിലെ ആരാധനാസൂചന വ്യക്തമായി അവതരിപ്പിച്ചു. വിവാദമായ ക്രിയാരൂപത്തിന്റെ വ്യത്യസ്ത വായനകൾ മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
