source:
  edition: WLC
  text: וַ/יֵּ֨דַע אָדָ֥ם עוֹד֙ אֶת אִשְׁתּ֔/וֹ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵׁ֑ת כִּ֣י שָֽׁת לִ֤/י אֱלֹהִים֙ זֶ֣רַע אַחֵ֔ר תַּ֣חַת הֶ֔בֶל כִּ֥י הֲרָג֖/וֹ קָֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/025.yaml
  text: And Adam knew his wife again[a], and she bore a son and called his name Seth, for she said, “God has appointed for me another offspring in place of Abel, because Cain killed him.”
translation:
  language: ml
  text: 'ആദാം വീണ്ടും തന്റെ ഭാര്യയെ അറിഞ്ഞു. അവൾ ഒരു മകനെ പ്രസവിച്ചു. അവൾ അവന് ശേത്ത് എന്നു പേരിട്ടു. അവൾ പറഞ്ഞു: “കയീൻ ഹാബെലിനെ കൊന്നതിനാൽ, ഹാബെലിന് പകരം ദൈവം എനിക്കു മറ്റൊരു സന്തതിയെ നൽകിയിരിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നൽകിയിരിക്കുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായ ക്രിയയ്ക്ക് ‘വെച്ചു/സ്ഥാപിച്ചു’ എന്നും അർഥമുണ്ട്. ‘ശേത്ത്’ എന്ന പേരും ഈ ക്രിയയും തമ്മിൽ എബ്രായത്തിൽ ശബ്ദക്രീഡയുണ്ട്.
    reason: പേരും ക്രിയയും തമ്മിലുള്ള ഉറവിടഭാഷയിലെ പദക്രീഡ മലയാള മുഖ്യപാഠത്തിൽ നേരിട്ട് നിലനിർത്താനാകാത്തതിനാൽ.
lexical_decisions:
- source_word: וַיֵּדַע
  choice: അറിഞ്ഞു
  rationale: ഭാര്യയുമായുള്ള ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ഭാഷയിലെ പതിവ് സൗമ്യപ്രയോഗമാണിത്. മലയാളത്തിലും ബൈബിൾ സാഹിത്യശൈലിയിൽ മനസ്സിലാക്കാവുന്നതിനാൽ ഉറവിടത്തിന്റെ ആലങ്കാരികത നിലനിർത്തുന്നു.
- source_word: אָדָם
  choice: ആദാം
  rationale: ഇവിടെ പൊതുവായ ‘മനുഷ്യൻ’ എന്നതിലുപരി വ്യക്തിനാമമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: עוֹד
  choice: വീണ്ടും
  rationale: മുമ്പത്തെ ദാമ്പത്യസംഗമത്തിനുശേഷമുള്ള ആവർത്തനത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַתֵּלֶד בֵּן
  choice: അവൾ ഒരു മകനെ പ്രസവിച്ചു
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാള പരിഭാഷ.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: അവൾ അവന് ... എന്നു പേരിട്ടു
  rationale: അക്ഷരാർഥമായ ‘അവന്റെ പേര് വിളിച്ചു’ എന്നതിനേക്കാൾ സ്വാഭാവികമായ മലയാള നാമകരണപ്രയോഗം.
- source_word: שֵׁת
  choice: ശേത്ത്
  rationale: വ്യക്തിനാമത്തിന്റെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: שָׁת
  choice: നൽകിയിരിക്കുന്നു
  rationale: അടിസ്ഥാനാർഥം ‘വെച്ചു/സ്ഥാപിച്ചു’ എന്നാണെങ്കിലും, ഇവിടെ ദൈവം പകരമായി സന്തതിയെ ഒരുക്കിയെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പേരുമായുള്ള ശബ്ദക്രീഡ കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: זֶרַע
  choice: സന്തതി
  rationale: ‘വിത്ത്’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ഇവിടെ ജനിച്ച പകരക്കാരനായ മകനെയും വംശപരമ്പരയുടെ സാധ്യതയെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക പദം.
- source_word: תַּחַת
  choice: പകരം
  rationale: ഈ സന്ദർഭത്തിലെ സ്ഥാനപൂരണമോ പകരമാകലോ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: הֶבֶל
  choice: ഹാബെൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ അംഗീകൃത മലയാള രൂപം.
- source_word: הֲרָגוֹ
  choice: കൊന്നതിനാൽ
  rationale: הרג എന്ന പൊതുവായ ‘കൊല്ലുക’ എന്ന ക്രിയയെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; കൂടുതൽ പ്രത്യേകമായ ‘കൊലപ്പെടുത്തി’ എന്ന നിയമ-ധാർമ്മിക അർഥം അധികമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ശേത്തിന്റെ പേരിനെക്കുറിച്ചുള്ള സ്ത്രീയുടെ വിശദീകരണം
  choice: ദൈവം എനിക്കു മറ്റൊരു സന്തതിയെ നൽകിയിരിക്കുന്നു
  alternative: ദൈവം എനിക്കു മറ്റൊരു സന്തതിയെ വെച്ചിരിക്കുന്നു / നിയമിച്ചിരിക്കുന്നു
  rationale: ദൈവമാണ് ഹാബെലിനു പകരം സന്തതിയെ ഒരുക്കിയതെന്ന പ്രസ്താവന നിലനിർത്തുന്നു. שֵׁת–שָׁת ശബ്ദക്രീഡ മലയാളത്തിൽ നേരിട്ട് പുനരാവിഷ്കരിക്കാനാകാത്തതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന സൗമ്യപ്രയോഗം
  choice: തന്റെ ഭാര്യയെ അറിഞ്ഞു
  alternative: തന്റെ ഭാര്യയുമായി ശാരീരികബന്ധത്തിലേർപ്പെട്ടു
  rationale: ഉറവിടം ഉപയോഗിക്കുന്ന പതിവ് സൗമ്യപ്രയോഗവും സാഹിത്യപരമായ സംയമനവും നിലനിർത്തുന്നു; കൂടുതൽ തുറന്ന വ്യാഖ്യാനം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: זֶרַע എന്ന പദത്തിന്റെ ഏകവചന-സമൂഹവാചക വ്യാപ്തി
  choice: സന്തതി
  alternative: മറ്റൊരു മകൻ / വിത്ത്
  rationale: ‘മകൻ’ എന്നു മാത്രം പറഞ്ഞ് അർഥം ചുരുക്കാതെയും ‘വിത്ത്’ എന്നു പറഞ്ഞ് അസ്വാഭാവികമാക്കാതെയും ജനിച്ച ശിശുവിനെയും തുടർന്നുള്ള വംശത്തെയും സൂചിപ്പിക്കാവുന്ന അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ഉറവിടത്തിലെ ലൈംഗിക സൗമ്യപ്രയോഗം നിലനിർത്തിയിട്ടുണ്ട്. നീണ്ട എബ്രായ സംയുക്തവാക്യം വായനാസൗകര്യത്തിനായി ചെറുവാക്യങ്ങളാക്കി; കാരണബന്ധം സ്ത്രീയുടെ ഉദ്ധരണിക്കുള്ളിൽ വ്യക്തമായി സൂക്ഷിച്ചു.
