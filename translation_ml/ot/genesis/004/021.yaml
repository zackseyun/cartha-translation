  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. എബ്രായത്തിലെ ‘പിതാവ്’ എന്ന സാംസ്കാരിക ശൈലി മുഖ്യപാഠത്തിൽ നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി. ഉപകരണനാമങ്ങളിലെ ചരിത്രപരമായ അനിശ്ചിതത്വം അമിതകൃത്യത കൂടാതെ സൂക്ഷിച്ചു.
