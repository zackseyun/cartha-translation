source:
  edition: WLC
  text: וְ/שֵׁ֥ם אָחִ֖י/ו יוּבָ֑ל ה֣וּא הָיָ֔ה אֲבִ֕י כָּל תֹּפֵ֥שׂ כִּנּ֖וֹר וְ/עוּגָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/021.yaml
  text: And the name of his brother was Jubal[c][b][a]; he was the father of all who play the lyre and the pipe.
translation:
  language: ml
  text: അവന്റെ സഹോദരന്റെ പേര് യൂബാൽ എന്നായിരുന്നു. കിന്നരവും കുഴലും[c] വായിക്കുന്ന[b] എല്ലാവരുടെയും പിതാവ്[a] അവനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പിതാവ്” എന്നത് ഇവിടെ ഈ വാദ്യങ്ങൾ വായിക്കുന്നവരുടെ നേരിട്ടുള്ള ജൈവിക പിതാവ് എന്നല്ല, അവരുടെ പൂർവികൻ, തുടക്കക്കാരൻ, അല്ലെങ്കിൽ ആ പാരമ്പര്യത്തിന്റെ സ്ഥാപകൻ എന്നായിരിക്കാം.
    reason: cultural_note
  - marker: b
    text: “വായിക്കുന്ന” എന്നതിനുള്ള എബ്രായപദത്തിന്റെ അക്ഷരാർഥം “പിടിക്കുന്ന” അല്ലെങ്കിൽ “കൈകാര്യം ചെയ്യുന്ന” എന്നാണ്; സംഗീതോപകരണങ്ങളുടെ സന്ദർഭത്തിൽ അത് അവ വായിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: “കുഴൽ” എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം ഏതു പുരാതന വാദ്യത്തെയാണ് കൃത്യമായി സൂചിപ്പിക്കുന്നത് എന്നത് അനിശ്ചിതമാണ്; “പുല്ലാങ്കുഴൽ” അല്ലെങ്കിൽ “ഞാങ്ങണക്കുഴൽ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אָחִיו
  choice: അവന്റെ സഹോദരന്റെ പേര്
  rationale: മുൻവാക്യത്തിലെ യാബാലിനെ സൂചിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വാവിന്റെ തുടർച്ചാസ്വഭാവം വാക്യക്രമത്തിൽ പ്രകടമാണ്.
- source_word: יוּבָל
  choice: യൂബാൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ പകർത്തുന്നു.
- source_word: הוּא הָיָה
  choice: അവനായിരുന്നു
  rationale: ഊന്നലുള്ള എബ്രായ വിധേയപ്രയോഗം മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: אֲבִי כָּל
  choice: എല്ലാവരുടെയും പിതാവ്
  rationale: സംസ്കാരപരമായ ഒരു തൊഴിൽപാരമ്പര്യത്തിന്റെ പൂർവികൻ അഥവാ തുടക്കക്കാരൻ എന്ന വിശാല അർഥം ഉൾക്കൊള്ളുന്ന എബ്രായ ശൈലി നിലനിർത്തുന്നു.
- source_word: תֹּפֵשׂ
  choice: വായിക്കുന്ന
  rationale: അക്ഷരാർഥം ‘പിടിക്കുന്ന/കൈകാര്യം ചെയ്യുന്ന’ എന്നാണെങ്കിലും സംഗീതോപകരണങ്ങളോടൊപ്പം പ്രയോഗിക്കുമ്പോൾ ഉദ്ദേശ്യം അവ വായിക്കുക എന്നതാണ്.
- source_word: כִּנּוֹר
  choice: കിന്നരം
  rationale: പുരാതന തന്ത്രിവാദ്യമായ lyre-ന് മലയാളത്തിൽ പരിചിതവും യോജിച്ചതുമായ പദം; ആധുനിക harp-നോട് അനാവശ്യമായി സമീകരിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: עוּגָב
  choice: കുഴൽ
  rationale: കൃത്യമായ പുരാതന വാദ്യം അനിശ്ചിതമായതിനാൽ ഒരു പ്രത്യേക രൂപം നിർബന്ധിക്കാതെ പൊതുവായ ഊതുവാദ്യപദം ഉപയോഗിക്കുന്നു.
