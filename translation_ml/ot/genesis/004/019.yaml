  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽקַּֽח ל֥/וֹ לֶ֖מֶךְ שְׁתֵּ֣י נָשִׁ֑ים שֵׁ֤ם הָֽ/אַחַת֙ עָדָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית צִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/019.yaml
  text: Lamech took for himself two wives[a]. The name of the one was Adah[b], and the name of the other was Zillah.
translation:
  language: ml
  text: ലാമെക്ക് രണ്ടു ഭാര്യമാരെ വിവാഹം കഴിച്ചു. ഒരുവളുടെ പേര് ആദാ; മറ്റവളുടെ പേര് സില്ലാ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “രണ്ടാമത്തവളുടെ പേര് സില്ലാ.”'
    reason: source_literal
lexical_decisions:
- source_word: וַיִּקַּח
  choice: സ്വീകരിച്ചു
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും വിവാഹസന്ദർഭത്തിൽ ഭാര്യയായി സ്വീകരിക്കുക എന്ന അർഥമാണ്. ‘സ്വീകരിച്ചു’ എന്നത് എബ്രായപ്രയോഗത്തോട് അടുത്തുനിൽക്കുകയും മലയാളത്തിൽ വിവാഹബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לוֹ
  choice: തനിക്കായി
  rationale: വ്യക്തിപരമായ താൽപര്യമോ സ്വന്തം ആവശ്യത്തിനായുള്ള പ്രവർത്തിയോ സൂചിപ്പിക്കുന്ന പ്രത്യയസഹിതമായ ഈ പൂർവപ്രത്യയത്തിന്റെ ആത്മനിർദ്ദേശക ഭാവം ‘തനിക്കായി’ നിലനിർത്തുന്നു.
- source_word: שְׁתֵּי נָשִׁים
  choice: രണ്ടു ഭാര്യമാരെ
  rationale: נָשִׁים എന്നതിന് ‘സ്ത്രീകൾ’ എന്നും ‘ഭാര്യമാർ’ എന്നും അർഥമുണ്ടാകാം; എന്നാൽ לקח എന്ന വിവാഹസന്ദർഭത്തിലുള്ള ക്രിയയോടൊപ്പം ഇവിടെ ‘ഭാര്യമാർ’ എന്നതാണ് സന്ദർഭോചിതം.
- source_word: שֵׁם הָאַחַת
  choice: ഒരുവളുടെ പേര്
  rationale: രണ്ടുപേരിൽ ഒരാളെ സൂചിപ്പിക്കുന്ന എബ്രായ നാമകരണസൂത്രം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പുനരാവിഷ്കരിക്കുന്നു; ‘ആദ്യവളുടെ’ എന്ന് മൂലത്തിൽ ഇല്ലാത്ത ക്രമസൂചന ചേർക്കുന്നില്ല.
- source_word: עָדָה
  choice: ആദാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ പകർത്തുന്നു.
- source_word: וְשֵׁם הַשֵּׁנִית
  choice: മറ്റവളുടെ പേര്
  rationale: הַשֵּׁנִית അക്ഷരാർഥത്തിൽ ‘രണ്ടാമത്തവൾ’ എന്നാണ്; എന്നാൽ കൃത്യമായി രണ്ടുപേരുള്ള സാഹചര്യത്തിൽ ‘മറ്റവൾ’ എന്നത് സ്വാഭാവിക മലയാളവും ഒരുപോലെ കൃത്യവുമാണ്. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: צִלָּה
  choice: സില്ലാ
  rationale: എബ്രായ צִלָּה എന്ന വ്യക്തിനാമത്തിന്റെ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: ലാമെക്കിന്റെ ബഹുഭാര്യത്വത്തെ മൂല്യനിർണയത്തോടെ അവതരിപ്പിക്കണമോ
  choice: ‘രണ്ടു ഭാര്യമാരെ’ എന്നു പറഞ്ഞ് വിവാഹവസ്തുത മാത്രം വ്യക്തമാക്കുന്നു
  alternative: ‘രണ്ടു സ്ത്രീകളെ വിവാഹം കഴിച്ചു’ എന്നോ ധാർമിക വിലയിരുത്തൽ ചേർത്തോ അവതരിപ്പിക്കുക
  rationale: വാക്യം ലാമെക്കിന് രണ്ടു ഭാര്യമാരുണ്ടായിരുന്നതായി വിവരിക്കുന്നു; ഈ പ്രവൃത്തിയെക്കുറിച്ച് ഇവിടെ ധാർമിക വിധി പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ വിവർത്തനം വസ്തുത വ്യക്തമാക്കുന്നു, പക്ഷേ പാഠത്തിലില്ലാത്ത അനുകൂലമോ പ്രതികൂലമോ ആയ വിലയിരുത്തൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഭാര്യയായി എടുത്തു’ എന്ന അസ്വാഭാവിക അക്ഷരാനുവാദം ഒഴിവാക്കി, ‘സ്വീകരിച്ചു’ എന്നതിലൂടെ മൂലത്തിലെ לקח എന്ന ക്രിയയുടെ രൂപഭാവവും വിവാഹസന്ദർഭവും ഒരുമിച്ച് നിലനിർത്തി. പേരുകൾ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ‘ആദാ’, ‘സില്ലാ’ എന്നു ലിപ്യന്തരിച്ചു.
