id: GEN.4.11
reference: Genesis 4:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֖ה אָר֣וּר אָ֑תָּה מִן הָֽ/אֲדָמָה֙ אֲשֶׁ֣ר פָּצְתָ֣ה אֶת פִּ֔י/הָ לָ/קַ֛חַת אֶת דְּמֵ֥י אָחִ֖י/ךָ מִ/יָּדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/011.yaml
  text: And now you are cursed from the ground[c][b][a], which has opened its mouth to receive your brother’s blood from your hand.
translation:
  language: ml
  text: ഇപ്പോൾ നീ ഭൂമിയിൽനിന്ന് ശപിക്കപ്പെട്ടിരിക്കുന്നു[a]. നിന്റെ സഹോദരന്റെ രക്തം[b] നിന്റെ കൈയിൽനിന്ന് ഏറ്റുവാങ്ങാൻ ഭൂമി തന്റെ വായ് തുറന്നിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഭൂമിയാൽ’ എന്നും ‘ഭൂമിയിൽനിന്ന് അകറ്റപ്പെട്ട്’ എന്നും അർഥമാകാം. എബ്രായപ്രയോഗം ശാപത്തിന്റെ ഉറവിടത്തെയോ ഭൂമിയിൽനിന്നുള്ള വേർപാടിനെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘രക്തങ്ങൾ’; രക്തച്ചൊരിച്ചിലിനെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: തുടർന്നുവരുന്ന ശിക്ഷയെ കയീന്റെ പ്രവൃത്തിയുടെ ഉടനടിയുള്ള ഫലമായി അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ സംയോജകത്തിന്റെ ആശയം സന്ദർഭം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: אָרוּר אָתָּה
  choice: നീ ... ശപിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: കയീൻ ഇപ്പോൾ ശാപത്തിന് വിധേയനായിരിക്കുന്ന അവസ്ഥയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: מִן הָאֲדָמָה
  choice: ഭൂമിയിൽനിന്ന്
  rationale: מִן എന്ന പൂർവപ്രത്യയം സൂചിപ്പിക്കാവുന്ന ഉറവിടം, ബന്ധം, വേർപാട് എന്നീ അർഥസാധ്യതകളെ കഴിയുന്നത്ര തുറന്നുവെക്കുന്നു.
- source_word: אֲשֶׁר פָּצְתָה אֶת פִּיהָ
  choice: ഭൂമി തന്റെ വായ് തുറന്നിരിക്കുന്നു
  rationale: ഭൂമിയെ വായ് തുറക്കുന്ന ഒന്നായി വ്യക്തിവൽക്കരിക്കുന്ന എബ്രായ ദൃശ്യരൂപം നിലനിർത്തുന്നു; പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി ‘തുറന്നിരിക്കുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: לָקַחַת
  choice: ഏറ്റുവാങ്ങാൻ
  rationale: ചൊരിയപ്പെട്ട രക്തത്തെ ഭൂമി ഉള്ളിലേക്കു സ്വീകരിക്കുന്ന ദൃശ്യത്തിന് മലയാളത്തിൽ സ്വാഭാവികമായ പദം.
- source_word: דְּמֵי אָחִיךָ
  choice: നിന്റെ സഹോദരന്റെ രക്തം
  rationale: എബ്രായത്തിലെ ബഹുവചനരൂപമായ ‘രക്തങ്ങൾ’ ഇവിടെ രക്തച്ചൊരിച്ചിലിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; മലയാളത്തിൽ ഏകവചനം അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִיָּדֶךָ
  choice: നിന്റെ കൈയിൽനിന്ന്
  rationale: കയീന്റെ നേരിട്ടുള്ള ഉത്തരവാദിത്വം സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ സജീവമായ കൈ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശാപവും ഭൂമിയും തമ്മിലുള്ള ബന്ധം
  choice: ‘ഭൂമിയിൽനിന്ന്’ എന്ന് പരിഭാഷപ്പെടുത്തി ബന്ധത്തിന്റെ കൃത്യസ്വഭാവം തുറന്നുവെച്ചു.
  alternative: ‘ഭൂമിയാൽ’ അല്ലെങ്കിൽ ‘ഭൂമിയിൽനിന്ന് അകറ്റപ്പെട്ട്’
  rationale: എബ്രായത്തിലെ מִן ഇവിടെ ശാപത്തിന്റെ ഉറവിടത്തെയോ ഭൂമിയിൽനിന്നുള്ള വേർപാടിനെയോ സൂചിപ്പിക്കാം. ഏതെങ്കിലും ഒരു വ്യാഖ്യാനം മാത്രം മുഖ്യവാചകത്തിൽ ഉറപ്പിക്കാതെ മൂലത്തിലെ അർഥപിരിമുറുക്കം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഭൂമി തന്റെ വായ് തുറന്നു’ എന്ന വ്യക്തിവൽക്കരണം നിലനിർത്തി; സാങ്കേതികമോ സഭാവിഭാഗപരമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. ഇംഗ്ലീഷ് പാളിയിലെ ആവർത്തനസ്വഭാവമുള്ള മൂന്നാമത്തെ കുറിപ്പ് ചേർക്കാതെ, അതിലെ പ്രസക്തമായ വ്യത്യസ്ത വായനകൾ [a]യിൽ ഏകീകരിച്ചു.
