  yaml_path: translation/ot/genesis/004/017.yaml
  text: Cain knew his wife[a], and she conceived and bore Enoch. He was building a city[d][c][b], and he named the city after his son Enoch.
translation:
  language: ml
  text: കയീൻ തന്റെ ഭാര്യയുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെട്ടു; അവൾ ഗർഭം ധരിച്ച് ഹാനോക്കിനെ പ്രസവിച്ചു. കയീൻ ഒരു നഗരം പണിതുകൊണ്ടിരുന്നു[a]; തന്റെ മകന്റെ പേരനുസരിച്ച് ആ നഗരത്തിന് ഹാനോക്ക് എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കയീൻ ഒരു നഗരം പണിതു.” ഹീബ്രു പ്രയോഗം പുരോഗമിച്ചുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: ശാരീരികബന്ധത്തിൽ ഏർപ്പെട്ടു
  rationale: ‘അറിഞ്ഞു’ എന്ന അക്ഷരാർഥം മലയാളത്തിൽ ഈ സന്ദർഭത്തിലെ ലൈംഗികബന്ധം സ്വാഭാവികമായി അറിയിക്കാത്തതിനാൽ, ഹീബ്രു ശൈലിയുടെ ഉദ്ദേശ്യം വ്യക്തവും മാന്യവുമായി നൽകുന്നു.
- source_word: אִשְׁתּוֹ
  choice: തന്റെ ഭാര്യയുമായി
  rationale: സന്ദർഭത്തിൽ אִשָּׁה എന്നത് ‘ഭാര്യ’ എന്നാണ്; കർത്താവിലേക്കു മടങ്ങുന്ന പ്രത്യയം മലയാളത്തിൽ ‘തന്റെ’ എന്നു നൽകി.
- source_word: וַתַּהַר וַתֵּלֶד
  choice: അവൾ ഗർഭം ധരിച്ച് ... പ്രസവിച്ചു
  rationale: ഗർഭധാരണവും പ്രസവവും ഉൾപ്പെടുന്ന ഹീബ്രു ആഖ്യാനക്രമം ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: חֲנוֹךְ
  choice: ഹാനോക്ക്
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ പേരുരൂപം സ്വീകരിച്ചു.
- source_word: וַיְהִי בֹּנֶה עִיר
  choice: ഒരു പട്ടണം പണിതുകൊണ്ടിരുന്നു
  rationale: היה + കർത്തൃവാചക ക്രിയാനാമം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കാൻ സാധ്യതയുള്ളതിനാൽ ‘പണിതുകൊണ്ടിരുന്നു’ എന്നു നൽകി; עִיר-ന് ഈ പ്രാരംഭ സാമൂഹികസന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘പട്ടണം’ തിരഞ്ഞെടുത്തു.
- source_word: וַיִּקְרָא שֵׁם הָעִיר כְּשֵׁם בְּנוֹ
  choice: തന്റെ മകന്റെ പേരനുസരിച്ച് ആ പട്ടണത്തിന് ... എന്നു പേരിട്ടു
  rationale: ‘പട്ടണത്തിന്റെ പേര് വിളിച്ചു’ എന്ന ഹീബ്രു ശൈലിയെ അർഥം നഷ്ടപ്പെടാതെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ഭാഷാശൈലി അക്ഷരാർഥമായി പകർത്താതെ അതിന്റെ അർഥം വ്യക്തമായി നൽകി; നഗരനിർമാണത്തിന്റെ പുരോഗമനഭാവം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
