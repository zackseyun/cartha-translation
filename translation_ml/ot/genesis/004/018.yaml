  yaml_path: translation/ot/genesis/004/018.yaml
  text: To Hanok was born Irad[a], and Irad fathered Mehujael, and Mehujael fathered Methushael, and Methushael fathered Lamech.
translation:
  language: ml
  text: ഹാനോക്കിന് ഈരാദ് ജനിച്ചു; ഈരാദ് മെഹൂയായേലിന്[a] ജന്മം നൽകി; മെഹൂയായേൽ മെഥൂശായേലിന് ജന്മം നൽകി; മെഥൂശായേൽ ലാമെക്കിന് ജന്മം നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഈ വാക്യത്തിലെ എബ്രായപാഠത്തിൽ ഒരേ പേര് രണ്ടു വ്യത്യസ്ത അക്ഷരരൂപങ്ങളിൽ കാണുന്നു: മെഹൂയായേൽ, മെഹീയായേൽ.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּוָּלֵד
  choice: ജനിച്ചു
  rationale: ילד എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ നിഷ്ക്രിയമായ ജനനപ്രയോഗമാണ്; മലയാളത്തിൽ ‘ഹാനോക്കിന് … ജനിച്ചു’ എന്നത് സ്വാഭാവികവും മൂലരൂപത്തോട് അടുത്തതുമാണ്.
- source_word: לַחֲנוֹךְ
  choice: ഹാനോക്കിന്
  rationale: മാതാപിതാവിനെ സൂചിപ്പിക്കുന്ന ל ഉപസർഗം മലയാളത്തിലെ ദത്തിവിഭക്തിയായ ‘-ക്ക്’ കൊണ്ട് നൽകിയിരിക്കുന്നു; പേര് എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
- source_word: עִירָד
  choice: ഈരാദ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: יָלַד
  choice: ജന്മം നൽകി
  rationale: വംശാവലിയിൽ സജീവ Qal രൂപം പിതാവായി ജനിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ജന്മം നൽകി’ ആ അർഥം മാന്യവും ആധുനികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מְחוּיָאֵל / מְחִיּיָאֵל
  choice: മെഹൂയയേൽ
  rationale: വാക്യത്തിൽ ഒരേ പേരിന് രണ്ടു എബ്രായ അക്ഷരരൂപങ്ങളുണ്ട്. വായനാസൗകര്യത്തിന് മുഖ്യപാഠത്തിൽ ഒരൊറ്റ രൂപം ഉപയോഗിച്ച് വ്യത്യാസം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: מְתוּשָׁאֵל
  choice: മെഥൂശയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: לָמֶךְ
  choice: ലാമെക്ക്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
