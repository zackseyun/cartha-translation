reference: Genesis 4:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לֶ֜מֶךְ לְ/נָשָׁ֗י/ו עָדָ֤ה וְ/צִלָּה֙ שְׁמַ֣עַן קוֹלִ֔/י נְשֵׁ֣י לֶ֔מֶךְ הַאְזֵ֖נָּה אִמְרָתִ֑/י כִּ֣י אִ֤ישׁ הָרַ֨גְתִּי֙ לְ/פִצְעִ֔/י וְ/יֶ֖לֶד לְ/חַבֻּרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/023.yaml
  text: 'And Lamech said to his wives[a], “Adah and Zillah, hear my voice; wives of Lamech, listen to my word: for I have killed a man for wounding me[b], even a young man for striking me.”'
translation:
  language: ml
  text: 'ലാമെക്ക് തന്റെ ഭാര്യമാരോടു പറഞ്ഞു:


    “ആദാ, സില്ലാ, എന്റെ സ്വരം കേൾക്കുവിൻ;


    ലാമെക്കിന്റെ ഭാര്യമാരേ, എന്റെ വാക്കിനു ചെവികൊടുക്കുവിൻ.


    എന്നെ മുറിവേല്പിച്ചതിന്[a] ഞാൻ ഒരു മനുഷ്യനെ കൊന്നു;


    എന്നെ അടിച്ചതിന് ഒരു യുവാവിനെയും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “എന്റെ മുറിവിന് ഞാൻ ഒരു മനുഷ്യനെ കൊന്നു; എന്റെ ചതവിന് ഒരു യുവാവിനെയും.” എബ്രായത്തിൽ ‘മുറിവ്’, ‘ചതവ്’ എന്നീ നാമങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ചിലർ ലാമെക്കിന്റെ വാക്കുകളെ നടന്ന കൊലയുടെ റിപ്പോർട്ടായല്ല, “എന്നെ മുറിവേല്പിക്കുന്ന മനുഷ്യനെ ഞാൻ കൊല്ലും” എന്ന ഭീഷണിയായോ പൊതുവായ വീമ്പുപറച്ചിലായോ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: לְנָשָׁיו
  choice: തന്റെ ഭാര്യമാരോട്
  rationale: സന്ദർഭത്തിൽ ഈ ബഹുവചനരൂപം ലാമെക്കിന്റെ ഭാര്യമാരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഭാര്യമാർ’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: שְׁמַעַן קוֹלִי
  choice: എന്റെ സ്വരം കേൾക്കുവിൻ
  rationale: ‘സ്വരം’ എന്ന മൂർത്തമായ എബ്രായ പ്രയോഗവും ബഹുവചന ആജ്ഞയുടെ നേരിട്ടുള്ള ഭാവവും നിലനിർത്തുന്നു.
- source_word: הַאְזֵנָּה אִמְרָתִי
  choice: എന്റെ വാക്കിനു ചെവികൊടുക്കുവിൻ
  rationale: ശ്രദ്ധയോടെ കേൾക്കുക എന്ന ഹിഫീൽ ക്രിയയുടെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുകയും ആദ്യ വരിയോടുള്ള കാവ്യസമാന്തര്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הָרַגְתִּי
  choice: ഞാൻ ... കൊന്നു
  rationale: ഖാതൽ രൂപത്തിന്റെ ഏറ്റവും നേരിട്ടുള്ള വായനയായ കഴിഞ്ഞ പ്രവൃത്തിയുടെ റിപ്പോർട്ട് നൽകുന്നു; ഭീഷണിയെന്ന ബദൽ വായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לְפִצְעִי
  choice: എന്നെ മുറിവേല്പിച്ചതിന്
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെ മുറിവിന്’ എന്ന നാമപ്രയോഗമാണെങ്കിലും, പ്രതികാരത്തിനുള്ള കാരണമോ അവസരമോ എന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: יֶלֶד
  choice: ഒരു യുവാവ്
  rationale: אִישׁ എന്ന ‘മനുഷ്യൻ’ എന്നതിനോടുള്ള സമാന്തര്യത്തിൽ പ്രായം കുറഞ്ഞ പുരുഷനെ സൂചിപ്പിക്കുന്നു; ‘കുട്ടി’ എന്നു പറഞ്ഞ് അനാവശ്യമായി ചെറിയ പ്രായം നിർണ്ണയിക്കുന്നില്ല.
- source_word: לְחַבֻּרָתִי
  choice: എന്നെ അടിച്ചതിന്
  rationale: ‘എന്റെ ചതവിന്/അടിപ്പാടിന്’ എന്ന നാമരൂപത്തിന്റെ കാരണബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുകയും ആദ്യ അർധവരിയിലെ ‘മുറിവേല്പിച്ചു’ എന്നതിൽനിന്ന് ചെറിയ പദവ്യത്യാസം കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ലാമെക്കിന്റെ വാക്കുകൾ നടന്ന കൊലയുടെ റിപ്പോർട്ടാണോ പൊതുവായ ഭീഷണിയോ എന്നത്
  choice: ‘ഞാൻ ... കൊന്നു’ എന്ന നടന്ന പ്രവൃത്തിയുടെ റിപ്പോർട്ടായി മുഖ്യപാഠത്തിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘എന്നെ മുറിവേല്പിക്കുന്ന മനുഷ്യനെ ഞാൻ കൊല്ലും’ എന്ന ഭീഷണി അഥവാ പൊതുവായ വീമ്പുപറച്ചിൽ.
  rationale: הָרַגְתִּי എന്ന ഖാതൽ രൂപം ഏറ്റവും സ്വാഭാവികമായി നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. എങ്കിലും ഭീഷണിയായോ സങ്കൽപ്പാത്മകമായോ വായിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: കൊലയുടെ ഉദ്ദേശ്യം പ്രതികാരമോ സ്വരക്ഷയോ എന്നത്
  choice: ‘മുറിവേല്പിച്ചതിന് ... അടിച്ചതിന്’ എന്ന കാരണ/പ്രതികാര ഭാഷ ഉപയോഗിച്ചു; സ്വരക്ഷയെന്ന് വ്യക്തമാക്കിയില്ല.
  alternative: ‘എന്നെ ആക്രമിച്ചപ്പോൾ സ്വരക്ഷയ്ക്കായി’ എന്ന വിശദീകരണം.
  rationale: എബ്രായം സ്വരക്ഷയെ വ്യക്തമായി പറയുന്നില്ല. ധാർമിക ന്യായീകരണം ചേർക്കാതെ പാഠത്തിലെ സംഘർഷവും അവ്യക്തതയും കാത്തുസൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യഭാഷയാണ് ഉപയോഗിച്ചത്. ‘കേൾക്കുവിൻ’, ‘ചെവികൊടുക്കുവിൻ’ എന്നീ രൂപങ്ങൾ കവിതയുടെ സമാന്തരഘടനയും ബഹുവചന അഭിസംബോധനയും വ്യക്തമായി സൂക്ഷിക്കുന്നു; അതേസമയം അപരിചിതമായ അതിപുരാതന പദങ്ങൾ ഒഴിവാക്കി.
