  to: 'ലാമെക്ക് തന്റെ ഭാര്യമാരോടു പറഞ്ഞു:


    “ആദാ, സില്ലാ, എന്റെ സ്വരം കേൾക്കുവിൻ;


    ലാമെക്കിന്റെ ഭാര്യമാരേ, എന്റെ വാക്കിനു ചെവികൊടുക്കുവിൻ.


    എന്നെ മുറിവേല്പിച്ചതിന്[a] ഞാൻ ഒരു മനുഷ്യനെ കൊന്നു;


    എന്നെ അടിച്ചതിന് ഒരു യുവാവിനെയും[b].”'
  rationale: അർഥത്തിൽ മാറ്റമൊന്നും വരുത്താതെ അടിക്കുറിപ്പ് b-യുടെ ആങ്കർ അതു വിശദീകരിക്കുന്ന ‘ഒരു യുവാവിനെയും’ എന്ന പദത്തിനു പിന്നാലെ, പൂർണവിരാമത്തിനു മുമ്പായി മാറ്റി. ഇതിലൂടെ അടിക്കുറിപ്പിന്റെ ബന്ധം വ്യക്തവും ചിഹ്നനിർണയം ഏകീകൃതവുമാകുന്നു.
