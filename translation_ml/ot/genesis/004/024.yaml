- from: കാരണം കയീന് ഏഴിരട്ടി പ്രതികാരം ലഭിക്കുമെങ്കിൽ,[a] ലാമെക്കിന് എഴുപത്തേഴിരട്ടി ലഭിക്കും.[b]
  to: കാരണം കയീന് ഏഴിരട്ടി പ്രതികാരം ലഭിക്കും[a]; ലാമെക്കിന് എഴുപത്തേഴിരട്ടി ലഭിക്കും.[b]
