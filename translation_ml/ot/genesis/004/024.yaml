source:
  edition: WLC
  text: כִּ֥י שִׁבְעָתַ֖יִם יֻקַּם קָ֑יִן וְ/לֶ֖מֶךְ שִׁבְעִ֥ים וְ/שִׁבְעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/024.yaml
  text: For Cain is avenged sevenfold[b][a], and Lamech seventy-sevenfold.
translation:
  language: ml
  text: കാരണം കയീന് ഏഴിരട്ടി പ്രതികാരം ലഭിക്കും[a]; ലാമെക്കിന് എഴുപത്തേഴിരട്ടി ലഭിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പ്രതികാരം ലഭിക്കുന്നു”; ഹീബ്രു ക്രിയ ഉറപ്പുള്ള ഭാവിയെയും സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം “എഴുപതും ഏഴും”; അതായത്, “എഴുപത്തേഴിരട്ടി.” “എഴുപത്തേഴു പ്രാവശ്യം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ ലാമെക്കിന്റെ വീമ്പുപറച്ചിലിന് അടിസ്ഥാനമോ കാരണമോ അവതരിപ്പിക്കുന്ന ബന്ധകശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שִׁבְעָתַיִם
  choice: ഏഴിരട്ടി
  rationale: പ്രതികാരത്തിന്റെ ഏഴുമടങ്ങായ അളവ് സൂചിപ്പിക്കുന്ന കാവ്യാത്മക പ്രയോഗം സംക്ഷിപ്തമായും സമാന്തരതയോടെയും നൽകുന്നു.
- source_word: יֻקַּם
  choice: പ്രതികാരം ലഭിക്കുമെങ്കിൽ
  rationale: נקם എന്ന ധാതുവിന്റെ ഹോഫാൽ രൂപത്തിലുള്ള കർമ്മണിപ്രയോഗവും ഉറപ്പുള്ള ഭാവി/പഴഞ്ചൊല്ലുസ്വഭാവമുള്ള അർത്ഥവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വ്യവസ്ഥാസൂചന ഹീബ്രു കാവ്യത്തിലെ താരതമ്യബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: קָיִן
  choice: കയീൻ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതവും ഉറവിടത്തോട് ചേർന്നതുമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְלֶמֶךְ
  choice: ലാമെക്കിന്
  rationale: വാവിന്റെ താരതമ്യബന്ധം വാക്യഘടനയിലൂടെ നിലനിർത്തുകയും വ്യക്തിനാമം പരിചിതമായ മലയാളരൂപത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: שִׁבְעִים וְשִׁבְעָה
  choice: എഴുപത്തേഴിരട്ടി
  rationale: അക്ഷരാർഥത്തിൽ ‘എഴുപതും ഏഴും’ എന്ന സംഖ്യയെ സ്വാഭാവിക മലയാളത്തിൽ എഴുപത്തേഴ് എന്നു നൽകി, ‘ഏഴിരട്ടി’യുമായുള്ള കാവ്യസമാന്തരത നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലാമെക്കിന്റെ പ്രതികാരസംഖ്യയുടെ വ്യാഖ്യാനം
  choice: എഴുപത്തേഴിരട്ടി
  alternative: എഴുപത് ഏഴിരട്ടി / എഴുപത്തേഴു പ്രാവശ്യം
  rationale: שִׁבְעִים וְשִׁבְעָה എന്ന ഹീബ്രു ഘടന സ്വാഭാവികമായി ‘എഴുപത്തേഴ്’ എന്നാണ്; ‘എഴുപത് ഗുണം ഏഴ്’ എന്ന പിൽക്കാല പാരമ്പര്യവായന ഇവിടെ ഇറക്കുമതി ചെയ്യാതെ, കയീന്റെ ‘ഏഴിരട്ടി’യോടുള്ള കാവ്യസമാന്തരത സംരക്ഷിക്കുന്നു.
- issue: יֻקַּם എന്ന ക്രിയയുടെ കാലസൂചന
  choice: ലഭിക്കുമെങ്കിൽ / ലഭിക്കും
  alternative: ലഭിക്കുന്നുവെങ്കിൽ / പ്രതികാരം ചെയ്യപ്പെടുന്നുവെങ്കിൽ
  rationale: ഹീബ്രു അപൂർണ്ണക്രിയ ഉറപ്പുള്ള ഭാവിയെയോ പൊതുസത്യത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിൽ ഭാവിസൂചന സ്വീകരിച്ചെങ്കിലും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കാവ്യപ്രയോഗം. ‘പ്രതികാരം ലഭിക്കുക’ എന്ന രൂപം കർമ്മണിഭാവം സ്വാഭാവികമായി കൈമാറുന്നു; സംഖ്യകളിലെ സമാന്തരതയ്ക്കായി ‘ഏഴിരട്ടി / എഴുപത്തേഴിരട്ടി’ നിലനിർത്തി.
