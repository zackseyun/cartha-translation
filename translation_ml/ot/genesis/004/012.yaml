id: GEN.4.12
reference: Genesis 4:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֤י תַֽעֲבֹד֙ אֶת הָ֣/אֲדָמָ֔ה לֹֽא תֹסֵ֥ף תֵּת כֹּחָ֖/הּ לָ֑/ךְ נָ֥ע וָ/נָ֖ד תִּֽהְיֶ֥ה בָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/012.yaml
  text: When you work the ground[a], it will no longer yield its strength to you[d][c][b]. You will be a wanderer and a fugitive on the earth.
translation:
  language: ml
  text: നീ നിലം കൃഷി ചെയ്യുമ്പോൾ[a], അത് ഇനി തന്റെ ശക്തി നിനക്കു നൽകുകയില്ല[b]. ഭൂമിയിൽ[d] നീ അലയുന്നവനും നാടോടിയും ആയിരിക്കും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നീ നിലം കൃഷി ചെയ്യുന്നതിനാൽ’ എന്നും ‘നീ നിലം കൃഷി ചെയ്താൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ സംയോജകപദം ഇവിടെ കാരണത്തെയോ സമയത്തെയോ ഉപാധിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അത് തന്റെ ശക്തി നിനക്കു നൽകുന്നത് തുടരുകയില്ല.’ ഇവിടെ ‘ശക്തി’ നിലത്തിന്റെ ഉൽപാദനശേഷിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘വിശ്രമമില്ലാതെ അലഞ്ഞുതിരിയുന്നവൻ.’ എബ്രായത്തിലെ ഈ രണ്ടു പദങ്ങൾക്കും അർഥസാമ്യമുണ്ട്; അവ ഒരുമിച്ച് കയീന്റെ സ്ഥിരതയില്ലാത്ത അവസ്ഥയെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: d
    text: അഥവാ, ‘ദേശത്ത്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ചെയ്യുമ്പോൾ
  rationale: ഈ സന്ദർഭത്തിൽ കയീൻ നിലം കൃഷി ചെയ്യുന്ന അവസരത്തിൽ ശാപത്തിന്റെ ഫലം അനുഭവപ്പെടുന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; കാരണാർഥവും ഉപാധ്യാർഥവും സാധ്യമായതിനാൽ അവ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: תַעֲבֹד אֶת־הָאֲדָמָה
  choice: നിലം കൃഷി ചെയ്യുക
  rationale: ഇവിടെ עבד എന്നത് മണ്ണിൽ അധ്വാനിച്ച് അതിനെ കൃഷി ചെയ്യുന്നതാണ്; אֲדָמָהയെ ‘നിലം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് ഉല്പത്തി വിവരണത്തിലെ മണ്ണുമായുള്ള ബന്ധം നിലനിർത്തുന്നു.
- source_word: לֹא תֹסֵף תֵּת
  choice: ഇനി ... നൽകുകയില്ല
  rationale: יסף + ക്രിയാനാമരൂപം പ്രവൃത്തി തുടരാതിരിക്കുകയോ വീണ്ടും സംഭവിക്കാതിരിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഇനി ... നൽകുകയില്ല’ എന്നത് ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כֹּחָהּ
  choice: തന്റെ ശക്തി
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ശക്തി’ എന്ന രൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് നിലത്തിന്റെ ഉൽപാദനശേഷിയെയോ ഫലഭൂയിഷ്ഠതയെയോ സൂചിപ്പിക്കുന്നു.
- source_word: נָע וָנָד
  choice: അലയുന്നവനും നാടോടിയും
  rationale: പരസ്പരം അർഥസാമ്യമുള്ള രണ്ടു എബ്രായ പദങ്ങളും കയീന്റെ സ്ഥിരതയില്ലാത്ത അവസ്ഥയെ ഊന്നിപ്പറയുന്നു. രണ്ടു ഘടകങ്ങളും മലയാളത്തിലും വേർതിരിച്ച് നിലനിർത്തി.
- source_word: בָאָרֶץ
  choice: ഭൂമിയിൽ
  rationale: പ്രാചീന ഉല്പത്തി പശ്ചാത്തലത്തിൽ אָרֶץ എന്നത് വിശാലമായി ‘ഭൂമി’ എന്നു ഗ്രഹിക്കാം; ഒരു പ്രത്യേക പ്രദേശത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: കയീന്റെ ന്യായവിധിയുടെ വ്യാപ്തി
  choice: കൃഷിയിലെ പരാജയവും സ്ഥിരതാമസമില്ലാത്ത ജീവിതവും ഉൾപ്പെടുന്ന മൂർത്തമായ ന്യായവിധി
  alternative: പൂർണമായും മാനസികമായ അസ്വസ്ഥത; അല്ലെങ്കിൽ ഒരു പ്രദേശത്തേക്കു മാത്രം പരിമിതമായ നാടുകടത്തൽ
  rationale: വാക്യം നിലം തന്റെ ശക്തി നൽകാതിരിക്കുന്നതും കയീൻ נָע וָנָד ആയിരിക്കുന്നതും ഒരുപോലെ പറയുന്നു. അതിനാൽ ഭൗതികവും സാമൂഹികവുമായ രണ്ടു വശങ്ങളും നിലനിർത്തുന്നു; പാഠത്തിൽ ഇല്ലാത്ത പിൽക്കാല സിദ്ധാന്തവിഭാഗങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തന്റെ ശക്തി’ എന്ന മൂലരൂപകം സംരക്ഷിച്ചപ്പോൾ അതിന്റെ കാർഷിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. נָע וָנָד എന്ന ഇരട്ടപ്രയോഗം ഒറ്റ ആശയമായി ലയിപ്പിക്കാതെ രണ്ടു മലയാള പദങ്ങളായി നിലനിർത്തി.
