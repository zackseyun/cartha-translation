  yaml_path: translation/ot/genesis/004/016.yaml
  text: Then Cain went out from before Yahweh and settled in the land of Nod[a], east of Eden.
translation:
  language: ml
  text: പിന്നെ കയീൻ യഹ്‌വേയുടെ സന്നിധിയിൽനിന്ന് പുറപ്പെട്ടു, ഏദെന്റെ കിഴക്കുള്ള നോദ് ദേശത്ത്[a] പാർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നോദ്” എന്ന പേര് “അലച്ചിൽ” എന്നർഥമുള്ള എബ്രായ പദവുമായി ശബ്ദബന്ധമുള്ളതാണ്; ഈ അധ്യായത്തിൽ മുമ്പ് കയീന് ലഭിച്ച വിധിയെ ഇത് പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ പുറത്തേക്കുള്ള നീക്കം എന്ന മൂർത്തമായ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִלִּפְנֵי
  choice: സന്നിധിയിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘മുഖത്തുനിന്ന്/മുമ്പിൽനിന്ന്’ എന്ന എബ്രായ പ്രയോഗം ദൈവവുമായി ബന്ധപ്പെട്ടിടത്ത് ‘സന്നിധിയിൽനിന്ന്’ എന്നു നൽകുന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും അതിന്റെ സ്ഥലപരവും ബന്ധപരവുമായ ബലം നിലനിർത്തുന്നതുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവികനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיֵּשֶׁב
  choice: പാർത്തു
  rationale: ישב ഇവിടെ താമസമാക്കുക/വസിക്കുക എന്ന അർഥത്തിലാണ്; ‘പാർത്തു’ കഥനസന്ദർഭത്തിൽ സ്വാഭാവികവും അമിതവ്യാഖ്യാനം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: בְּאֶרֶץ נוֹד
  choice: നോദ് ദേശത്ത്
  rationale: נוֹד ഇവിടെ സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘അലച്ചിൽ’ എന്ന ശബ്ദബന്ധം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: קִדְמַת עֵדֶן
  choice: ഏദെന് കിഴക്കുള്ള
  rationale: ഏദെനെ ആപേക്ഷികമായി കിഴക്കുള്ള സ്ഥാനം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עֵדֶן
  choice: ഏദെൻ
  rationale: സ്ഥലനാമമായതിനാൽ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: ദൈവത്തോടുള്ള ബന്ധത്തിൽ കയീന്റെ പുറപ്പാട് എങ്ങനെ അവതരിപ്പിക്കണം
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽനിന്ന് പുറപ്പെട്ടു
  alternative: യഹ്‌വേയുടെ മുമ്പിൽനിന്ന് പുറപ്പെട്ടു
  rationale: ‘സന്നിധിയിൽനിന്ന്’ എബ്രായ ഭാഷാശൈലിയുടെ സ്ഥലപരവും ബന്ധപരവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അതേസമയം ദൈവത്തിൽനിന്നുള്ള അകൽച്ചയുടെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ച് തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ദൈവികനാമം ‘യഹ്‌വേ’ എന്നും സ്ഥലനാമങ്ങൾ ‘ഏദെൻ,’ ‘നോദ്’ എന്നും ലിപ്യന്തരണം ചെയ്തു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട സ്ഥലനാമത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
