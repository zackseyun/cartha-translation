id: GEN.4.1
reference: Genesis 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָ֣/אָדָ֔ם יָדַ֖ע אֶת חַוָּ֣ה אִשְׁתּ֑/וֹ וַ/תַּ֨הַר֙ וַ/תֵּ֣לֶד אֶת קַ֔יִן וַ/תֹּ֕אמֶר קָנִ֥יתִי אִ֖ישׁ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/001.yaml
  text: And Adam knew Eve his wife[a]; and she conceived and bore Cain, and said[b], “I have acquired a man from Yahweh.”
translation:
  language: ml
  text: 'ആദാം തന്റെ ഭാര്യയായ ഹവ്വയെ അറിഞ്ഞു; അവൾ ഗർഭം ധരിച്ച് കയീനെ[b] പ്രസവിച്ചു. അവൾ പറഞ്ഞു: “യഹ്‌വെയിൽനിന്ന്[a] ഞാൻ ഒരു പുരുഷനെ നേടിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ: “യഹ്‌വെയോടുകൂടെ ഞാൻ ഒരു പുരുഷനെ നേടിയിരിക്കുന്നു.” ഇതിനെ “യഹ്‌വെയിൽനിന്ന്” എന്നും “യഹ്‌വെയുടെ സഹായത്തോടെ” എന്നും, സാധ്യത കുറവാണെങ്കിലും “ഒരു പുരുഷനെ—യഹ്‌വെയെ—ഞാൻ നേടിയിരിക്കുന്നു” എന്നും മനസ്സിലാക്കാം. പ്രധാനപാഠം കയീന്റെ ജനനത്തിന്റെ ഉറവിടം യഹ്‌വെയാണെന്ന് ഹവ്വ അംഗീകരിക്കുന്നതായി എടുത്തിരിക്കുന്നു.'
    reason: alternative_reading
  - marker: b
    text: ‘കയീൻ’ എന്ന പേര് ‘നേടി’ എന്നർഥമുള്ള എബ്രായ ക്രിയയായ കാനീതി (קָנִיתִי) എന്നതിനോട് ശബ്ദസാമ്യമുള്ളതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָדָם
  choice: ആദാം
  rationale: ഇവിടെ הָאָדָם പൊതുവായി മനുഷ്യവർഗത്തെ അല്ല, മുമ്പ് പരിചയപ്പെടുത്തിയ പുരുഷനായ ആദാമിനെയാണ് സൂചിപ്പിക്കുന്നത്. മുൻവിവരണത്തോടുള്ള ബന്ധം മലയാളത്തിലെ സ്വാഭാവികമായ തുടർച്ചയിൽ നിലനിൽക്കുന്നു.
- source_word: יָדַע
  choice: അറിഞ്ഞു
  rationale: മൂലഭാഷയിലെ ‘അറിയുക’ എന്ന മാന്യമായ ലൈംഗികബന്ധസൂചക പ്രയോഗം അതേ സാഹിത്യസംയമനത്തോടെ നിലനിർത്തുന്നു.
- source_word: אֶת חַוָּה אִשְׁתּוֹ
  choice: തന്റെ ഭാര്യയായ ഹവ്വയെ
  rationale: ബന്ധവും പേരും വ്യക്തമായി സൂചിപ്പിക്കുന്ന, സ്വാഭാവികമായ മലയാള പ്രയോഗം.
- source_word: וַתַּהַר
  choice: അവൾ ഗർഭം ധരിച്ചു
  rationale: ജനനവിവരണങ്ങളിൽ സ്വാഭാവികവും കൃത്യവുമായ മലയാള പ്രയോഗം.
- source_word: וַתֵּלֶד אֶת קַיִן
  choice: കയീനെ പ്രസവിച്ചു
  rationale: മൂലത്തിലെ സംക്ഷിപ്തമായ ജനനപ്രസ്താവന നേരിട്ട് പകർന്നു നൽകുന്നു.
- source_word: קַיִן
  choice: കയീൻ
  rationale: വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്യുന്നു; קָנִיתִי എന്ന ക്രിയയുമായുള്ള ശബ്ദബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: קָנִיתִי
  choice: ഞാൻ ... നേടിയിരിക്കുന്നു
  rationale: קנה എന്ന ക്രിയയുടെ ‘നേടുക/സമ്പാദിക്കുക’ എന്ന അടിസ്ഥാനാർഥം നൽകുന്നു; ഈ സന്ദർഭത്തിൽ ‘സൃഷ്ടിച്ചു’ എന്ന തെറ്റിദ്ധരിപ്പിക്കാവുന്ന അർഥം ഒഴിവാക്കുന്നു.
- source_word: אִישׁ
  choice: ഒരു പുരുഷനെ
  rationale: നവജാത ആൺകുഞ്ഞിനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, മൂലത്തിലെ സാധാരണ അർഥമായ ‘പുരുഷൻ’ നിലനിർത്തുന്നു; ‘മകൻ’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: אֶת יְהוָה
  choice: യഹ്‌വെയിൽനിന്ന്
  rationale: ദുഷ്കരമായ אֶת എന്ന പദബന്ധത്തെ, കുഞ്ഞിന്റെ ഉറവിടമായി യഹ്‌വെയെ ഹവ്വ അംഗീകരിക്കുന്നതായി പ്രധാനപാഠത്തിൽ അവതരിപ്പിക്കുന്നു; യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുർക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: ഹവ്വയുടെ വാക്കുകളിലെ אֶת יְהוָה എന്ന പദബന്ധത്തിന്റെ വ്യാഖ്യാനം
  choice: യഹ്‌വെയിൽനിന്ന്
  alternative: യഹ്‌വെയോടുകൂടെ; യഹ്‌വെയുടെ സഹായത്തോടെ; ‘ഒരു പുരുഷനെ—യഹ്‌വെയെ—ഞാൻ നേടിയിരിക്കുന്നു’
  rationale: എബ്രായ പദബന്ധം യഥാർഥമായി അനിശ്ചിതമാണ്. പ്രധാനപാഠം കുഞ്ഞ് യഹ്‌വെയിൽനിന്ന് ലഭിച്ചതായി ഹവ്വ അംഗീകരിക്കുന്ന വായന സ്വീകരിക്കുന്നു; മറ്റു പ്രധാന സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം മായ്ച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘അറിഞ്ഞു’ എന്ന മൂലഭാഷാപ്രയോഗം സാഹിത്യസംയമനത്തോടെ നിലനിർത്തി; ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു. വായനാസൗകര്യത്തിനായി നീണ്ട എബ്രായ വാക്യം രണ്ട് മലയാള വാക്യങ്ങളാക്കി.
