  yaml_path: translation/ot/genesis/004/004.yaml
  text: And Abel also brought some of the firstborn of his flock[a], and of their fat portions. And Yahweh regarded Abel and his offering[b],
translation:
  language: ml
  text: ഹാബെലും തന്റെ ആട്ടിൻകൂട്ടത്തിലെ കടിഞ്ഞൂലുകളിൽ ചിലതും അവയുടെ കൊഴുപ്പുഭാഗങ്ങളും[a] കൊണ്ടുവന്നു. യഹ്‌വെ ഹാബെലിനെയും അവന്റെ വഴിപാടിനെയും കടാക്ഷിച്ചു[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘അവയുടെ കൊഴുപ്പിൽനിന്നും’ എന്നാണ്; അർപ്പിച്ച മൃഗങ്ങളുടെ വിശിഷ്ടമായ കൊഴുപ്പുഭാഗങ്ങളെയാണ് ഇത് സൂചിപ്പിക്കുന്നതാകാം.
    reason: cultural_note
  - marker: b
    text: ‘ഹാബെലിനെയും അവന്റെ വഴിപാടിനെയും അനുകൂലമായി നോക്കി’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶבֶל
  choice: ഹാബെലും
  rationale: സാധാരണ ആഖ്യാനബന്ധമായ וְ എന്നതും, കയീനെപ്പോലെ ഹാബെലും വഴിപാടു കൊണ്ടുവന്നു എന്ന ആശയവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: הֵבִיא
  choice: കൊണ്ടുവന്നു
  rationale: വഴിപാടിന്റെ സന്ദർഭത്തിൽ ഹിഫിൽ രൂപമായ בוא എന്ന ക്രിയയുടെ നേരായ അർഥം നിലനിർത്തുന്നു.
- source_word: גַם הוּא
  choice: -ഉം
  rationale: ഹാബെലും കയീനെപ്പോലെ വഴിപാടു കൊണ്ടുവന്നു എന്ന ഊന്നൽ മലയാളത്തിലെ ചേർത്തെഴുതുന്ന ‘ഉം’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִבְּכֹרוֹת צֹאנוֹ
  choice: തന്റെ ആട്ടിൻപറ്റത്തിലെ കടിഞ്ഞൂലുകളിൽ ചിലതിനെ
  rationale: מִן ഇവിടെ ഭാഗികത സൂചിപ്പിക്കുന്നതിനാൽ എല്ലാ കടിഞ്ഞൂലുകളുമെന്നല്ല, അവയിൽ ചിലതെന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וּמֵחֶלְבֵהֶן
  choice: അവയുടെ കൊഴുപ്പുള്ള ഭാഗങ്ങളെ
  rationale: חֵלֶב എന്നത് യാഗമൃഗങ്ങളിലെ കൊഴുപ്പുള്ള പ്രത്യേക ഭാഗങ്ങളെ സൂചിപ്പിക്കാം; ‘കൊഴുപ്പുള്ള ഭാഗങ്ങൾ’ എന്നത് അതിന്റെ മൂർത്തവും യാഗപരവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: וַיִּשַׁע
  choice: കടാക്ഷിച്ചു
  rationale: നോക്കുക/ശ്രദ്ധതിരിക്കുക എന്ന അടിസ്ഥാനഭാവത്തോടൊപ്പം ഈ സന്ദർഭത്തിലെ അനുകൂല പരിഗണനയും പ്രകടമാക്കുന്നു; ‘സ്വീകരിച്ചു’ എന്നു പറഞ്ഞ് പ്രതികരണത്തിന്റെ രീതി നിർണയിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל הֶבֶל וְאֶל מִנְחָתוֹ
  choice: ഹാബെലിനെയും അവന്റെ വഴിപാടിനെയും
  rationale: ആവർത്തിച്ചിരിക്കുന്ന אֶל ഹാബെലിനെയും വഴിപാടിനെയും ഒരുപോലെ ദൈവിക കടാക്ഷത്തിന്റെ ലക്ഷ്യങ്ങളായി അടയാളപ്പെടുത്തുന്നു.
- source_word: מִנְחָתוֹ
  choice: അവന്റെ വഴിപാട്
  rationale: ആരാധനാസന്ദർഭത്തിലെ സമ്മാനം/അർപ്പണം എന്ന വിശാലമായ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: וַיִּשַׁע എന്നതിലെ ദൈവിക പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: ‘കടാക്ഷിച്ചു’—ഹാബെലിനോടും അവന്റെ വഴിപാടിനോടുമുള്ള അനുകൂല ദൃഷ്ടി സൂചിപ്പിക്കുന്നു; അത് എങ്ങനെ വെളിപ്പെട്ടുവെന്ന് പറയുന്നില്ല.
  alternative: ‘അനുകൂലമായി നോക്കി’ അല്ലെങ്കിൽ ‘സ്വീകരിച്ചു’
  rationale: എബ്രായക്രിയ ഈ സന്ദർഭത്തിൽ അനുകൂല പരിഗണന സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ പ്രകടനരീതി വാക്യം വ്യക്തമാക്കുന്നില്ല. ‘സ്വീകരിച്ചു’ എന്നത് അർഥം കൂടുതൽ നിർണയിച്ചുപറയും; ‘കടാക്ഷിച്ചു’ അനുകൂലത നിലനിർത്തിക്കൊണ്ട് ആ വിശദാംശം തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കടിഞ്ഞൂൽ’, ‘വഴിപാട്’, ‘കടാക്ഷിച്ചു’ എന്നീ പദങ്ങൾ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചവയാണെങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവയാണ്. വാക്യാവസാനത്തിലെ അൽപവിരാമം അടുത്ത വാക്യത്തിലേക്കുള്ള മൂലപാഠത്തിന്റെ തുടർച്ച നിലനിർത്തുന്നു.
