source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר קַ֖יִן אֶל הֶ֣בֶל אָחִ֑י/ו וַֽ/יְהִי֙ בִּ/הְיוֹתָ֣/ם בַּ/שָּׂדֶ֔ה וַ/יָּ֥קָם קַ֛יִן אֶל הֶ֥בֶל אָחִ֖י/ו וַ/יַּהַרְגֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/008.yaml
  text: And Cain said to Abel his brother. Then[a], while they were in the field, Cain rose up against Abel his brother and killed him.
translation:
  language: ml
  text: കയീൻ തന്റെ സഹോദരനായ ഹാബെലിനോടു പറഞ്ഞു.[a] അവർ വയലിൽ ആയിരിക്കുമ്പോൾ, കയീൻ തന്റെ സഹോദരനായ ഹാബെലിനെതിരെ എഴുന്നേറ്റു; അവനെ കൊന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ മസോറെറ്റിക് പാഠത്തിൽ ‘കയീൻ തന്റെ സഹോദരനായ ഹാബെലിനോടു പറഞ്ഞു’ എന്നു മാത്രമേ ഉള്ളൂ; പറഞ്ഞ വാക്കുകൾ അവിടെ നൽകിയിട്ടില്ല. സെപ്റ്റുഅജിന്റ്, സമര്യ പഞ്ചഗ്രന്ഥപാഠം, വുൾഗേറ്റ് തുടങ്ങിയ പുരാതന സാക്ഷ്യങ്ങളിൽ “നമുക്ക് വയലിലേക്കു പോകാം” എന്ന വാക്യം കാണുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר ... אֶל
  choice: ഹാബെലിനോടു പറഞ്ഞു
  rationale: אָמַר എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘പറയുക’ എന്നാണ്; אֶל അഭിസംബോധനയുടെ ദിശ സൂചിപ്പിക്കുന്നതിനാൽ ‘-നോടു’ സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമാണ്. മസോരറ്റിക് പാഠത്തിൽ പറഞ്ഞ വാക്കുകൾ ഇല്ലാത്തതിനാൽ വാക്യത്തിന്റെ അപൂർണത പരിഹരിച്ച് ചേർത്തിട്ടില്ല.
- source_word: אָחִיו
  choice: തന്റെ സഹോദരനായ
  rationale: ‘അവന്റെ സഹോദരൻ’ എന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുകയും വാക്യത്തിൽ രണ്ടുതവണ വരുന്ന സഹോദരബന്ധത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיְהִי בִּהְיוֹתָם
  choice: അവർ ... ആയിരിക്കുമ്പോൾ
  rationale: സംഭവത്തിന്റെ സമയപശ്ചാത്തലം നൽകുന്ന എബ്രായ ഘടനയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בַּשָּׂדֶה
  choice: വയലിൽ
  rationale: שָׂדֶה എന്നതിന് ഈ സന്ദർഭത്തിൽ ‘വയൽ’ എന്നതാണ് ഏറ്റവും സ്വാഭാവികമായ അർഥം; ‘തുറസ്സായ പ്രദേശം’ എന്ന വിപുലമായ അർഥവും സാധ്യമാണ്.
- source_word: וַיָּקָם ... אֶל
  choice: എതിരെ എഴുന്നേറ്റ്
  rationale: ആക്രമണോദ്ദേശമുള്ള എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും ശത്രുതാഭാവവും നിലനിർത്തുന്നു; വെറും ‘ആക്രമിച്ചു’ എന്നതിനെക്കാൾ രൂപപരമായി അടുത്തതാണ്.
- source_word: וַיַּהַרְגֵהוּ
  choice: അവനെ കൊന്നു
  rationale: הרג എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘കൊല്ലുക’ എന്നാണ്. ‘കൊലപ്പെടുത്തി’ എന്ന നിയമപരമോ ധാർമികമോ ആയ വർഗീകരണം ക്രിയയിൽ തന്നെ നിർബന്ധിതമല്ല.
theological_decisions:
- issue: മസോരറ്റിക് പാഠത്തിൽ ഇല്ലാത്ത കയീന്റെ വാക്കുകൾ മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തണമോ
  choice: നൽകപ്പെട്ട WLC മസോരറ്റിക് പാഠത്തിന്റെ ഹ്രസ്വവായന മുഖ്യപാഠത്തിൽ നിലനിർത്തി, പുരാതന സാക്ഷികളിലെ അധികവാക്യം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
  alternative: “നമുക്ക് വയലിലേക്കു പോകാം” എന്ന വാക്യം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തുക.
  rationale: നൽകപ്പെട്ട മൂലഭാഷാപാഠത്തിൽ കയീൻ പറഞ്ഞതിന്റെ ഉള്ളടക്കം ഇല്ല. എന്നാൽ സെപ്റ്റുഅജിന്റ്, സമര്യ പഞ്ചഗ്രന്ഥം, വുൾഗാത്ത എന്നിവയിൽ ഒരു വാക്യം നിലനിൽക്കുന്നതിനാൽ പാഠഭേദം മറച്ചുവയ്ക്കരുത്. മുഖ്യപാഠം WLC-യെ പിന്തുടരുകയും അടിക്കുറിപ്പ് മറ്റുസാക്ഷ്യങ്ങൾ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘തന്റെ സഹോദരനായ’ എന്ന ആവർത്തനം ചുരുക്കാതെ നിലനിർത്തിയത് മൂലപാഠത്തിലെ സഹോദരബന്ധത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കാനാണ്. മസോരറ്റിക് പാഠത്തിന്റെ പെട്ടെന്നു മുറിയുന്ന വാക്യഘടന പാഠഭേദസൂചനയോടെ ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
