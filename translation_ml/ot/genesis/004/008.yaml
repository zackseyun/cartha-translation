  to: കയീൻ തന്റെ സഹോദരനായ ഹാബെലിനോടു പറഞ്ഞു.[a] അവർ വയലിൽ ആയിരിക്കുമ്പോൾ, കയീൻ തന്റെ സഹോദരനായ ഹാബെലിനെതിരെ എഴുന്നേറ്റു; അവനെ കൊന്നു.
  rationale: 'മുഖ്യപാഠത്തിന്റെ പാഠഭേദസംബന്ധമായ നിലപാടിൽ മാറ്റമില്ല: WLCയുടെ ഹ്രസ്വവായന നിലനിർത്തുകയും മറ്റു പുരാതന സാക്ഷ്യങ്ങളിലെ സാധ്യതയുള്ള സംഭാഷണം അടിക്കുറിപ്പിൽ മാത്രം നൽകുകയും ചെയ്യുന്നു. പരിഷ്കാരങ്ങൾ പദരൂപം, പാഠശാസ്ത്രപരമായ പേരുകൾ, വാക്യപ്രവാഹം എന്നിവയിലെ ചെറിയ മിനുക്കലുകൾ മാത്രമാണ്.'
