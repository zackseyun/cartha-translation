reference: Genesis 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר קַ֖יִן אֶל יְהוָ֑ה גָּד֥וֹל עֲוֺנִ֖/י מִ/נְּשֹֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/013.yaml
  text: And Cain said to Yahweh[a], “My iniquity is too great to bear.”
translation:
  language: ml
  text: 'കയീൻ യഹ്‌വേയോടു പറഞ്ഞു: “എന്റെ അകൃത്യം എനിക്കു വഹിക്കാനാകാത്തവിധം വലുതാണ്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“എന്റെ കുറ്റബാധ്യത എനിക്കു വഹിക്കാനാകാത്തവിധം വലുതാണ്” അല്ലെങ്കിൽ “എന്റെ ശിക്ഷ എനിക്കു വഹിക്കാനാകാത്തവിധം വലുതാണ്” എന്നും വിവർത്തനം ചെയ്യാം; മറ്റൊരു സാധ്യത: “എന്റെ അകൃത്യം ക്ഷമിക്കാനാകാത്തവിധം വലുതാണ്.” എബ്രായപദം അകൃത്യം, കുറ്റബാധ്യത, അല്ലെങ്കിൽ അതിന്റെ ശിക്ഷ എന്നിവയെ സൂചിപ്പിക്കാം; ക്രിയയ്ക്ക് ‘വഹിക്കുക’ എന്നും ചില സന്ദർഭങ്ങളിൽ ‘ക്ഷമിക്കുക’ എന്നും അർഥമുണ്ട്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുള്ള എബ്രായ ആഖ്യാനരൂപം മുൻസംഭവത്തോടുള്ള തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വാക്യക്രമവും സന്ദർഭവും ആ തുടർച്ച സ്വാഭാവികമായി നൽകുന്നതിനാൽ പ്രത്യേകം ‘അപ്പോൾ’ ചേർക്കേണ്ടതില്ല.
- source_word: קַיִן
  choice: കയീൻ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: אֶל
  choice: -ഓടു
  rationale: അഭിസംബോധനയുടെ ദിശ സൂചിപ്പിക്കുന്ന ലളിതമായ മലയാള വിഭക്തിരൂപം.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: גָּדוֹל
  choice: വലുതാണ്
  rationale: അളവിന്റെയോ ഭാരത്തിന്റെയോ അതിരുകടന്ന മഹത്ത്വം സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ക്രിയാനാമഘടനയോടൊപ്പം ‘വഹിക്കാനാകാത്തവിധം വലുതാണ്’ എന്നത് സ്വാഭാവിക മലയാളമാണ്.
- source_word: עֲוֺנִי
  choice: എന്റെ അകൃത്യം
  rationale: עָוֹן എന്ന പദത്തിന്റെ അടിസ്ഥാനമായ ‘അകൃത്യം/കുറ്റം’ എന്ന അർഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; ‘കുറ്റബാധ്യത’ അല്ലെങ്കിൽ ‘ശിക്ഷ’ എന്ന സന്ദർഭസാധ്യ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: מִנְּשֹׂא
  choice: വഹിക്കാനാകാത്തവിധം
  rationale: താരതമ്യസൂചകമായ מִן-ഉം נָשָׂא (‘വഹിക്കുക’) എന്ന ക്രിയയും ചേർന്ന പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ക്ഷമിക്കുക’ എന്ന സാധ്യ അർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: עֲוֺנִי מִנְּשֹׂא എന്ന പ്രയോഗത്തിന്റെ അർഥവൈവിധ്യം
  choice: “എന്റെ അകൃത്യം വഹിക്കാനാകാത്തവിധം വലുതാണ്”
  alternative: “എന്റെ കുറ്റബാധ്യത/ശിക്ഷ എനിക്കു വഹിക്കാനാകാത്തവിധം വലുതാണ്”; അല്ലെങ്കിൽ “എന്റെ അകൃത്യം ക്ഷമിക്കാനാകാത്തവിധം വലുതാണ്.”
  rationale: עָוֹן എന്നത് അകൃത്യം, കുറ്റബാധ്യത, അതിന്റെ ശിക്ഷ എന്നിവ സൂചിപ്പിക്കാം; נָשָׂא എന്നത് വഹിക്കുക എന്നും ചില സന്ദർഭങ്ങളിൽ ക്ഷമിക്കുക എന്നും അർഥമാക്കാം. മുഖ്യവാചകം അടിസ്ഥാന ലെക്സിക്കൽ അർഥം നിലനിർത്തുകയും യഥാർഥമായ വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അകൃത്യം’ ഗൗരവമുള്ളതെങ്കിലും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദമാണ്. ദൈവനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ഉദ്ധരണിവാക്യത്തിന്റെ അവസാനത്തിൽ നൽകിയിരിക്കുന്നു.
