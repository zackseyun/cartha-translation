source:
  edition: WLC
  text: הֲ/ל֤וֹא אִם תֵּיטִיב֙ שְׂאֵ֔ת וְ/אִם֙ לֹ֣א תֵיטִ֔יב לַ/פֶּ֖תַח חַטָּ֣את רֹבֵ֑ץ וְ/אֵלֶ֨י/ךָ֙ תְּשׁ֣וּקָת֔/וֹ וְ/אַתָּ֖ה תִּמְשָׁל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/007.yaml
  text: If you do well[a], will there not be acceptance? But if you do not do well, sin is crouching at the door; its desire is for you[d][c][b], but you must rule over it.
translation:
  language: ml
  text: നീ നന്മ ചെയ്യുമെങ്കിൽ, നിനക്കു സ്വീകാര്യത ലഭിക്കുകയില്ലേ?[a] എന്നാൽ നീ നന്മ ചെയ്യാതിരുന്നാൽ, പാപം വാതിൽക്കൽ പതുങ്ങിക്കിടക്കുന്നു; അതിന്റെ ആഗ്രഹം നിന്നോടാണ്,[b][c] എന്നാൽ നീ അതിന്റെമേൽ ആധിപത്യം പുലർത്തണം.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘ഉയർത്തൽ.’ കയീന്റെ മുഖം ഉയരുമെന്നോ അവന് സ്വീകാര്യത ലഭിക്കുമെന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘പാപയാഗം വാതിൽക്കൽ കിടക്കുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം. എങ്കിലും അടുത്ത സന്ദർഭത്തിലെ ദൃശ്യരൂപം, പതുങ്ങിയിരിക്കുന്ന ഒരു മൃഗമായി പാപത്തെ വ്യക്തിവൽക്കരിക്കുന്നതായാണ് കൂടുതൽ സ്വാഭാവികമായി തോന്നുന്നത്.
    reason: alternative_reading
  - marker: c
    text: ‘അതിന്റെ മോഹം’ അല്ലെങ്കിൽ ‘അതിന്റെ പ്രേരണ’ എന്നും പറയാം. ഉല്പത്തി 3:16-ലെ സമാന പദപ്രയോഗം താരതമ്യം ചെയ്യുക.
    reason: cross_reference
  - marker: d
    text: ‘നീ അതിന്റെമേൽ ആധിപത്യം പുലർത്തും’ എന്നോ ‘നിനക്ക് അതിന്റെമേൽ ആധിപത്യം പുലർത്താം’ എന്നോ വിവർത്തനം ചെയ്യാം. ഹീബ്രു രൂപം ആഹ്വാനം, പ്രവചനം, അല്ലെങ്കിൽ സാധ്യത എന്നിങ്ങനെ മനസ്സിലാക്കാവുന്നതാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: תֵּיטִיב
  choice: നന്മ ചെയ്യുക
  rationale: ഇവിടെയുള്ള יטב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം സുഖമായിരിക്കുക എന്നതിലുപരി ശരിയായതോ നല്ലതോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നന്മ ചെയ്യുക’ എന്നത് ധാർമിക അർഥവും നിബന്ധനാവാക്യത്തിന്റെ ചുരുക്കവും നിലനിർത്തുന്നു.
- source_word: שְׂאֵת
  choice: സ്വീകാര്യത ലഭിക്കുക
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘ഉയർത്തൽ’ എന്ന ആശയവുമായി ബന്ധപ്പെട്ടതാണ്. സന്ദർഭത്തിൽ കയീന്റെ മുഖം ഉയരുന്നതോ അവൻ ദൈവത്താൽ അംഗീകരിക്കപ്പെടുന്നതോ ആകാം ഉദ്ദേശ്യം. സ്വാഭാവിക മലയാളത്തിൽ ‘സ്വീകാര്യത ലഭിക്കുക’ ഈ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; അക്ഷരാർഥവും അനിശ്ചിതത്വവും അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: לַפֶּתַח
  choice: വാതിൽക്കൽ
  rationale: ഇത് നേരിട്ടുള്ള സ്ഥാനസൂചക പ്രയോഗമാണ്. ‘വാതിൽക്കൽ’ എന്നത് ഉമ്മറപ്പടിയിൽ പതുങ്ങുന്ന ഭീഷണിയുടെ ദൃശ്യഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: חַטָּאת
  choice: പാപം
  rationale: חַטָּאת എന്നതിന് ‘പാപം’ എന്നും ‘പാപയാഗം’ എന്നും അർഥമാകാമെങ്കിലും, ‘പതുങ്ങിക്കിടക്കുന്നു’ എന്ന മൃഗരൂപകം ഇവിടെ പാപത്തെ വ്യക്തിവൽക്കരിക്കുന്ന വായനയ്ക്കാണ് കൂടുതൽ യോജിക്കുന്നത്. മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: רֹבֵץ
  choice: പതുങ്ങിക്കിടക്കുന്നു
  rationale: ഈ കൃതന്തം മൃഗം കുനിഞ്ഞുകിടക്കുന്നതോ ഇരയ്ക്കായി പതിയിരിക്കുന്നതോ സൂചിപ്പിക്കുന്നു. ‘പതുങ്ങിക്കിടക്കുന്നു’ എന്നത് തുടരുന്ന സമീപഭീഷണിയും വേട്ടമൃഗത്തിന്റെ രൂപകവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: תְּשׁוּקָתוֹ
  choice: അതിന്റെ ആഗ്രഹം
  rationale: ഈ നാമം ആഗ്രഹം, മോഹം, വാഞ്ഛ എന്നിവ സൂചിപ്പിക്കാം. മുൻപദം ‘പാപം’ ആയതിനാൽ നപുംസക സർവനാമം ഉപയോഗിച്ചു. ഉല്പത്തി 3:16-ലെ സമാന പ്രയോഗവുമായുള്ള ബന്ധവും ‘ആഗ്രഹം’ നിലനിർത്തുന്നു.
- source_word: תִּמְשָׁל בּוֹ
  choice: നീ അതിനെ കീഴടക്കണം
  rationale: ഹീബ്രു അപൂർണക്രിയാരൂപം ആഹ്വാനം, പ്രവചനം, അല്ലെങ്കിൽ സാധ്യത എന്നിങ്ങനെ വായിക്കാം. മുന്നറിയിപ്പിന്റെയും ഉപദേശത്തിന്റെയും സന്ദർഭത്തിൽ ‘കീഴടക്കണം’ ആഹ്വാനത്തിന്റെ ശക്തി നൽകുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: കയീൻ പാപത്തെ ഭരിക്കുമെന്ന വാഗ്ദാനമാണോ, ഭരിക്കണമെന്ന കല്പനയാണോ, അതിന് കഴിയുമെന്ന പ്രസ്താവനയാണോ അവസാന വാക്യം?
  choice: 'പ്രധാനപാഠത്തിൽ ആഹ്വാനമായി: ‘നീ അതിനെ കീഴടക്കണം.’'
  alternative: ‘നീ അതിനെ കീഴടക്കും’ (പ്രവചനം) അല്ലെങ്കിൽ ‘നിനക്ക് അതിനെ കീഴടക്കാം’ (സാധ്യത/കഴിവ്).
  rationale: ഹീബ്രു അപൂർണക്രിയാരൂപം ഈ വ്യത്യസ്ത ഭാവങ്ങൾ അനുവദിക്കുന്നു. ദൈവം കയീന് മുന്നറിയിപ്പും ഉപദേശവും നൽകുന്ന സന്ദർഭമായതിനാൽ ആഹ്വാനവായന ധാർമിക ശക്തി നന്നായി പകർന്നുനൽകുന്നു. എന്നാൽ ഉറപ്പായ ഫലമോ മനുഷ്യകഴിവിനെക്കുറിച്ചുള്ള വികസിത സിദ്ധാന്തമോ പാഠത്തിൽ ചേർക്കാതിരിക്കാനായി മറ്റു വായനകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വേട്ടമൃഗത്തിന്റെ രൂപകം നിലനിർത്താൻ ‘പതുങ്ങിക്കിടക്കുന്നു’ എന്നും, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കാനായി ‘സ്വീകാര്യത ലഭിക്കുക’ എന്നും തിരഞ്ഞെടുത്തു. യഥാർഥ ഭാഷാപരവും ദൈവശാസ്ത്രപരവുമായ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
