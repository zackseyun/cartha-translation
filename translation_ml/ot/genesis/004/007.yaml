  rationale: അവസാനവാക്യത്തിലെ മൂലക്രിയയുടെ ‘ഭരിക്കുക/ആധിപത്യം നടത്തുക’ എന്ന അർഥം ‘കീഴടക്കുക’ എന്നതിനെക്കാൾ നേരിട്ട് പ്രതിഫലിപ്പിക്കാൻ പ്രധാനപാഠവും അനുബന്ധ അടിക്കുറിപ്പും പരിഷ്കരിച്ചു. ‘നിന്നിലേക്കാണ്’ എന്നതിനെ സ്വാഭാവിക മലയാളമായ ‘നിന്നോടാണ്’ എന്നു മാറ്റി. ശൊഅത്ത് എന്ന പദത്തിന്റെ തർക്കവിഷയമായ അർഥം, חטאת എന്നതിന്റെ ബദൽവായന, തേശൂഖാ എന്നതിന്റെ നിഗൂഢത, അവസാന അപൂർണക്രിയാരൂപത്തിന്റെ വിവിധ സാധ്യതകൾ എന്നിവ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തിയിരിക്കുന്നു.
