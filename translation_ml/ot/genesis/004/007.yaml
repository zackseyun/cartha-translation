  source_fidelity: പ്രധാനപാഠം പൊതുവേ ഹീബ്രു വാക്യഘടനയും വ്യക്തിവൽക്കരിക്കപ്പെട്ട പാപത്തിന്റെ രൂപകവും വിശ്വസ്തമായി അറിയിക്കുന്നു. എന്നാൽ תִּמְשָׁל בּוֹ എന്നതിന് ‘കീഴടക്കണം’ എന്നു പറയുന്നത് ജയിച്ചടക്കുക എന്ന അർഥത്തിലേക്ക് അല്പം ചുരുക്കുന്നു; മൂലത്തിലെ ‘ഭരിക്കുക/ആധിപത്യം നടത്തുക’ എന്ന തുടർച്ചയായ നിയന്ത്രണ-ആധിപത്യഭാവം വ്യക്തമാക്കുന്നതാണ് ഉചിതം.
  naturalness: ‘അതിന്റെ ആഗ്രഹം നിന്നിലേക്കാണ്’ എന്ന പ്രയോഗത്തെ ‘അതിന്റെ ആഗ്രഹം നിന്നോടാണ്’ എന്നു മാറ്റുന്നത് ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്; അതേസമയം ഹീബ്രുവിലെ ‘നിന്നിലേക്കുള്ള/നിന്നോടുള്ള’ ദിശാസൂചന നിലനിൽക്കും. മറ്റുഭാഗങ്ങൾ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
  terminology: ‘നന്മ ചെയ്യുക,’ ‘സ്വീകാര്യത,’ ‘പാപം,’ ‘വാതിൽക്കൽ,’ ‘പതുങ്ങിക്കിടക്കുന്നു’ എന്നിവ യോജിച്ചതാണ്. അവസാന ക്രിയയ്ക്ക് ‘അതിന്റെമേൽ ആധിപത്യം പുലർത്തണം’ എന്നു നൽകുന്നത് משל എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥം സൂക്ഷിക്കുന്നു; ഇത് ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
  issues:
