    issue: ‘നീ അതിനെ കീഴടക്കണം’ എന്നത് תִּמְשָׁל בּוֹയുടെ ‘ഭരിക്കുക/ആധിപത്യം നടത്തുക’ എന്ന അർഥത്തെ ‘പരാജയപ്പെടുത്തി ജയിക്കുക’ എന്നതിലേക്ക് മാറ്റാൻ സാധ്യതയുണ്ട്.
    rationale: ഹീബ്രു משל എന്ന ക്രിയ ഭരണവും ആധിപത്യവും നിയന്ത്രണവും സൂചിപ്പിക്കുന്നു. ‘ആധിപത്യം പുലർത്തണം’ അതേ ബന്ധഭാവം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; അപൂർണക്രിയാരൂപത്തിന്റെ ആഹ്വാനവായനയും നിലനിർത്തുന്നു.
