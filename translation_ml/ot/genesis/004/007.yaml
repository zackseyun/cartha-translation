    rationale: ‘അതിന്റെ ആഗ്രഹം നിന്നോടാണ്’ ആധുനിക മലയാളത്തിൽ കൂടുതൽ സുതാര്യമാണ്; മൂലത്തിലെ അർഥപരമായ തുറന്ന നിലയും ഉല്പത്തി 3:16-നോടുള്ള ശബ്ദബന്ധവും നഷ്ടപ്പെടുന്നില്ല.
