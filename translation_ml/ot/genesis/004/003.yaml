source:
  edition: WLC
  text: וַֽ/יְהִ֖י מִ/קֵּ֣ץ יָמִ֑ים וַ/יָּבֵ֨א קַ֜יִן מִ/פְּרִ֧י הָֽ/אֲדָמָ֛ה מִנְחָ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/003.yaml
  text: And in the course of time[c][b][a], Cain brought to Yahweh an offering from the fruit of the ground.
translation:
  language: ml
  text: കുറെക്കാലം കഴിഞ്ഞപ്പോൾ, കയീൻ നിലത്തിലെ വിളവിൽനിന്ന് യാഹ്‌വേക്കു ഒരു അർപ്പണം കൊണ്ടുവന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘ദിവസങ്ങളുടെ അറ്റത്തുനിന്ന്’ എന്നാണ്; ഇവിടെ ഉദ്ദേശ്യം ഒരു കാലയളവ് കഴിഞ്ഞശേഷം എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘യാഹ്‌വേ’ എന്നത് יהוה (YHWH) എന്ന ദൈവനാമത്തിന്റെ മലയാള ലിപ്യന്തരണമാണ്; ‘യഹോവ’ എന്നും പരമ്പരാഗതമായി ഉപയോഗിക്കാറുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ יָמִים
  choice: കുറെക്കാലം കഴിഞ്ഞപ്പോൾ
  rationale: കഥയുടെ തുടർച്ചയിൽ ഒരു കാലയളവ് കഴിഞ്ഞതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; അന്ത്യകാലസൂചനയായി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാൻ അക്ഷരാർഥം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി.
- source_word: וַיָּבֵא
  choice: കൊണ്ടുവന്നു
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ഒരു വസ്തു കൊണ്ടുവരുക എന്നർഥം നൽകുന്നു; സമർപ്പിച്ചു എന്നു വിവർത്തനം ചെയ്യുന്നതിനെക്കാൾ മൂലക്രിയയോട് അടുത്തതാണ്.
- source_word: קַיִן
  choice: കയീൻ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: מִפְּרִי הָאֲדָמָה
  choice: നിലത്തിലെ വിളവിൽനിന്ന്
  rationale: פְּרִי ഇവിടെ കൃഷിയിൽനിന്നുള്ള വിളവ് അഥവാ ഉൽപ്പന്നം എന്നും אֲדָמָה കൃഷിചെയ്യുന്ന നിലം എന്നും സ്വാഭാവികമായി ഗ്രഹിക്കാം; സസ്യശാസ്ത്രപരമായ ‘ഫലം’ എന്ന പരിധിയിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: מִנְחָה
  choice: ഒരു വഴിപാട്
  rationale: ദൈവത്തിനു കൊണ്ടുവരുന്ന സമ്മാനം/അർപ്പണം എന്ന വിശാല അർഥം നൽകുന്ന, ആരാധനാസന്ദർഭത്തിന് യോജിച്ച സാധാരണ മലയാളപദം; വഴിപാടിന്റെ പ്രത്യേക ഇനം നിർണ്ണയിക്കുന്നില്ല.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമമായ יהוה-യെ പൊതുനാമമോ പദവിയോ ആക്കാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: യാഹ്‌വേ / കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന പദവിയാക്കി മാറ്റാതെ പേരായി നിലനിർത്തുന്നു; മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ലിപ്യന്തരണം തിരഞ്ഞെടുത്തു, മറ്റൊരു സാദ്ധ്യ ഉച്ചാരണം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- issue: מִקֵּץ יָמִים എന്ന കാലപ്രയോഗത്തിന്റെ അർഥം
  choice: കുറെക്കാലം കഴിഞ്ഞപ്പോൾ
  alternative: ദിവസങ്ങളുടെ അറ്റത്ത് / കാലക്രമത്തിൽ
  rationale: ഇവിടെ പ്രയോഗം ഒരു കാലയളവ് കഴിഞ്ഞതിനെ സൂചിപ്പിക്കുന്നു; അന്ത്യകാലത്തെക്കുറിച്ചുള്ള ആശയം സന്ദർഭം ആവശ്യപ്പെടുന്നില്ല. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘കുറെക്കാലം കഴിഞ്ഞപ്പോൾ’ എന്നത് കാലപ്രയോഗത്തെ സ്വാഭാവികമാക്കുന്നു; ‘നിലത്തിലെ വിളവ്’ കയീന്റെ കൃഷിപ്പണിയുമായുള്ള ബന്ധം വ്യക്തമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
