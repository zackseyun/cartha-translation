  rationale: കാലപ്രയോഗവും ‘നിലത്തിലെ വിളവിൽനിന്ന്’ എന്ന വിവർത്തനവും നിലനിർത്തി. ദൈവനാമം പദ്ധതിയുടെ Yahweh തീരുമാനത്തോടു ചേർത്ത് ‘യാഹ്‌വേ’ എന്നു തിരുത്തി; מִנְחָהയുടെ വിശാലവും നിഷ്പക്ഷവുമായ അർഥം നിലനിർത്താൻ ‘വഴിപാട്’ എന്നതിന് പകരം ‘അർപ്പണം’ ഉപയോഗിച്ചു. ഇരുവടി കുറിപ്പുചിഹ്നങ്ങളും വാചകത്തിൽ നിലനിർത്തി, അവയുടെ ഉള്ളടക്കം പുതുക്കിയ പദങ്ങളോടു പൊരുത്തപ്പെടുത്തി.
