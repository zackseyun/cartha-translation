  naturalness: ‘തന്നെ കണ്ടെത്തുന്ന ആരും തന്നെ അടിക്കാതിരിക്കേണ്ടതിന്’ എന്ന പ്രയോഗം വ്യാകരണപരമായി സാധ്യമാണെങ്കിലും സ്വാഭാവിക വായനയിൽ പ്രതിഫലനസൂചനയായി കേൾക്കാം. കയീനെ ആദ്യമായി പേരെടുത്തു പറഞ്ഞും പിന്നെ ‘അവനെ’ എന്നും പറയുന്നത് വ്യക്തവും സുഗമവുമാണ്.
