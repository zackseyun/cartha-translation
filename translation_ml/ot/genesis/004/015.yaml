id: GEN.4.15
reference: Genesis 4:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר ל֣/וֹ יְהוָ֗ה לָ/כֵן֙ כָּל הֹרֵ֣ג קַ֔יִן שִׁבְעָתַ֖יִם יֻקָּ֑ם וַ/יָּ֨שֶׂם יְהוָ֤ה לְ/קַ֨יִן֙ א֔וֹת לְ/בִלְתִּ֥י הַכּוֹת אֹת֖/וֹ כָּל מֹצְאֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/015.yaml
  text: Then Yahweh said to him[a], “Therefore whoever kills Cain, vengeance will be taken on him sevenfold.” And Yahweh put a mark on Cain[b], lest anyone finding him should strike him.
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവ അവനോടു പറഞ്ഞു: “അതുകൊണ്ട്, കയീനെ കൊല്ലുന്നവനോട് ഏഴിരട്ടിയായി പ്രതികാരം ചെയ്യപ്പെടും.[a]” കയീനെ കണ്ടെത്തുന്ന ആരും അവനെ അടിക്കാതിരിക്കേണ്ടതിന് യഹോവ കയീന് ഒരു അടയാളം വെച്ചു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവൻ ഏഴിരട്ടിയായി പ്രതികാരം ചെയ്യപ്പെടും.” എബ്രായത്തിലെ കർമണിപ്രയോഗം വളരെ സംക്ഷിപ്തമാണ്; സന്ദർഭത്തിൽ കയീനെ കൊല്ലുന്നവൻ ദൈവിക പ്രതികാരം നേരിടുമെന്നാണ് അർഥം.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “ചിഹ്നം.” എബ്രായപദം പൊതുവേ ഒരു ചിഹ്നത്തെയോ വേർതിരിച്ചറിയിക്കുന്ന അടയാളത്തെയോ സൂചിപ്പിക്കാം; അത് ഏതു രൂപത്തിലുള്ളതായിരുന്നുവെന്ന് പാഠം പറയുന്നില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ יהוהയെ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לָכֵן
  choice: അതുകൊണ്ട്
  rationale: ദൈവത്തിന്റെ മറുപടിയിലെ നിഗമനബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּל הֹרֵג קַיִן
  choice: കയീനെ കൊല്ലുന്നവൻ
  rationale: എബ്രായത്തിലെ പൊതുവായ, അനിശ്ചിതമായ പ്രയോഗത്തിന്റെ സർവസാധാരണ വ്യാപ്തി സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: שִׁבְעָתַיִם
  choice: ഏഴിരട്ടിയായി
  rationale: പ്രതികാരത്തിന്റെ ഏഴുമടങ്ങായ അളവ് മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יֻקָּם
  choice: പ്രതികാരം ചെയ്യപ്പെടും
  rationale: എബ്രായത്തിലെ കർമണിപ്രയോഗവും പ്രവർത്തകന്റെ അപ്രകടിതാവസ്ഥയും നിലനിർത്തുന്നു; സന്ദർഭം പ്രതികാരം കയീനെ കൊല്ലുന്നവനിലേക്കാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: אוֹת
  choice: അടയാളം
  rationale: ഇത് ഒരു ചിഹ്നമോ തിരിച്ചറിയാവുന്ന അടയാളമോ ആകാമെന്ന വിശാല അർഥം നിലനിർത്തുന്നു; അതിന്റെ രൂപം വാക്യം നിർവചിക്കുന്നില്ല.
- source_word: לְבִלְתִּי הַכּוֹת אֹתוֹ ... כָּל מֹצְאוֹ
  choice: തന്നെ കണ്ടെത്തുന്ന ആരും തന്നെ അടിക്കാതിരിക്കേണ്ടതിന്
  rationale: നിഷേധാത്മക ഉദ്ദേശ്യപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും נכה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ‘അടിക്കുക’ എന്ന അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: കയീനു നൽകിയ אוֹת എന്നതിന്റെ സ്വഭാവം
  choice: ‘അടയാളം’ എന്നു പരിഭാഷപ്പെടുത്തി; അതിന്റെ രൂപമോ സ്വഭാവമോ വ്യക്തമാക്കിയില്ല.
  alternative: ‘ചിഹ്നം’
  rationale: എബ്രായപാഠം അതിന്റെ ഭൗതികമോ പ്രതീകാത്മകമോ ആയ രൂപം നിർവചിക്കുന്നില്ല; അതിനാൽ പിൽക്കാല അനുമാനങ്ങൾ ചേർക്കുന്നില്ല.
- issue: ഏഴിരട്ടി പ്രതികാരം ഏൽക്കുന്നത് ആര്
  choice: കയീനെ കൊല്ലുന്നവനോടാണ് പ്രതികാരം ചെയ്യപ്പെടുന്നതെന്ന് വാക്യഘടനയിൽ വ്യക്തമാക്കി.
  alternative: ‘അവൻ ഏഴിരട്ടിയായി പ്രതികാരം ചെയ്യപ്പെടും’ എന്ന കൂടുതൽ അക്ഷരാർഥപരവും ആശയക്കുഴപ്പമുണ്ടാക്കാവുന്നതുമായ രൂപം
  rationale: കർമണിപ്രയോഗത്തിലെ പ്രവർത്തകൻ അപ്രകടിതനായി തുടരുന്നു; എന്നാൽ സന്ദർഭമനുസരിച്ച് പ്രതികാരത്തിന്റെ ലക്ഷ്യം കയീന്റെ കൊലയാളിയാണെന്ന് മലയാളത്തിൽ തെറ്റിദ്ധാരണയില്ലാതെ പറയുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ദൈവനാമം നാമരൂപമായി നിലനിർത്തി; എബ്രായത്തിലെ കർമണിപ്രയോഗവും അടയാളത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
