revisions:
- from: 'അപ്പോൾ യിസ്ഹാക്ക് യാക്കോബിനോടു പറഞ്ഞു: “മകനേ, നീ ശരിക്കും എന്റെ മകൻ ഏശാവ് തന്നെയാണോ അല്ലയോ എന്നു ഞാൻ നിന്നെ തപ്പിനോക്കേണ്ടതിന് ദയവായി അടുത്തുവരിക.”'
  to: 'അപ്പോൾ യിസ്ഹാക്ക് യാക്കോബിനോടു പറഞ്ഞു: “എന്റെ മകനേ, ദയവായി അടുത്തുവരിക; നീ എന്റെ മകൻ ഏശാവ് തന്നെയാണോ അല്ലയോ എന്നു ഞാൻ നിന്നെ തൊട്ടുനോക്കട്ടെ.”'
  rationale: 'The revision follows the source order more closely: Isaac addresses Jacob as his son, asks him to come near politely, and states that he wishes to feel him in order to test whether he is Esau. “തൊട്ടുനോക്കട്ടെ” naturally expresses tactile examination without adding a doctrinal or interpretive claim.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T19:30:14Z'
