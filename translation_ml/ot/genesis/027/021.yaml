id: GEN.27.21
reference: Genesis 27:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִצְחָק֙ אֶֽל יַעֲקֹ֔ב גְּשָׁ/ה נָּ֥א וַ/אֲמֻֽשְׁ/ךָ֖ בְּנִ֑/י הַֽ/אַתָּ֥ה זֶ֛ה בְּנִ֥/י עֵשָׂ֖ו אִם לֹֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/021.yaml
  text: Then Isaac said to Jacob[a], “Please come near, that I may feel you, my son, whether you are really my son Esau or not.”
translation:
  language: ml
  text: 'അപ്പോൾ യിസ്ഹാക്ക് യാക്കോബിനോടു പറഞ്ഞു: “എന്റെ മകനേ, ദയവായി അടുത്തുവരിക; നീ എന്റെ മകൻ ഏശാവ് തന്നെയാണോ അല്ലയോ എന്നു ഞാൻ നിന്നെ തൊട്ടുനോക്കട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּשָׁה נָּא
  choice: ദയവായി അടുത്തുവരിക
  rationale: גְּשָׁה എന്ന ആജ്ഞയുടെ ‘അടുത്തുവരുക’ എന്ന അർഥവും נָּא നൽകുന്ന വിനയപൂർവമായ അഭ്യർഥനാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: וַאֲמֻשְׁךָ
  choice: ഞാൻ നിന്നെ തപ്പിനോക്കേണ്ടതിന്
  rationale: מושׁ ഇവിടെ സ്പർശിച്ച് തിരിച്ചറിയുന്നതിനായി പരിശോധിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. കാഴ്ചശക്തി കുറഞ്ഞ യിസ്ഹാക്കിന്റെ സന്ദർഭത്തിൽ ‘തപ്പിനോക്കുക’ സ്പർശപരിശോധനയെ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: בְּנִי
  choice: മകനേ / എന്റെ മകൻ
  rationale: ആദ്യത്തേത് നേരിട്ടുള്ള സംബോധനയായും രണ്ടാമത്തേത് ഏശാവുമായുള്ള ബന്ധം തിരിച്ചറിയുന്ന വാക്യഘടകമായും ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: הַאַתָּה זֶה
  choice: നീ ശരിക്കും ... തന്നെയാണോ
  rationale: ചോദ്യം ഉന്നയിക്കുന്ന ഹീബ്രു ഘടനയിലെ തിരിച്ചറിയൽ സംബന്ധമായ സംശയവും ഊന്നലും സാധാരണ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְּנִי עֵשָׂו
  choice: എന്റെ മകൻ ഏശാവ്
  rationale: പുത്രബന്ധവും ചോദ്യം ചെയ്യപ്പെടുന്ന വ്യക്തിയുടെ പേരും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אִם לֹא
  choice: അല്ലയോ
  rationale: ‘ആണോ അല്ലയോ’ എന്ന പരോക്ഷചോദ്യത്തിന്റെ രണ്ടു സാധ്യതകളും സംക്ഷിപ്തമായി പകർത്തുന്നു.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുടെ ആഖ്യാനക്രമം സ്വാഭാവിക മലയാളത്തിൽ മുന്നോട്ടുകൊണ്ടുപോകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്പർശിച്ച് തിരിച്ചറിയുക എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുമ്പോഴും മൂലത്തിലെ സംശയഭാവവും ‘മകൻ’ എന്ന ആവർത്തനവും നിലനിർത്തിയിരിക്കുന്നു.
