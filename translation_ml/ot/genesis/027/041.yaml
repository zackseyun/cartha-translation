translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അപ്പൻ’ എന്നത് אָבִי എന്ന കുടുംബബന്ധത്തിന്റെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തുന്നു; ‘പക പുലർത്തി’ ദീർഘകാല ശത്രുത സ്വാഭാവികമായി അറിയിക്കുന്നു. പദശഃ ആവർത്തനമായ ‘അനുഗ്രഹിച്ച അനുഗ്രഹം’ മൂലപാഠത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
