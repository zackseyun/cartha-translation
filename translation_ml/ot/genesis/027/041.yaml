  naturalness: The Malayalam is clear, modern, and suitably restrained. “പക പുലർത്തി” is an idiomatic rendering of sustained hostility. The revised possessive phrase is equally natural in context.
  terminology: Names, kinship language, “അനുഗ്രഹം,” and “വിലാപദിവസങ്ങൾ” are appropriate. The footnote responsibly preserves the syntactic ambiguity of יְמֵי אֵבֶל אָבִי without forcing a disputed interpretation.
