  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׂטֹ֤ם עֵשָׂו֙ אֶֽת יַעֲקֹ֔ב עַל הַ֨/בְּרָכָ֔ה אֲשֶׁ֥ר בֵּרֲכ֖/וֹ אָבִ֑י/ו וַ/יֹּ֨אמֶר עֵשָׂ֜ו בְּ/לִבּ֗/וֹ יִקְרְבוּ֙ יְמֵי֙ אֵ֣בֶל אָבִ֔/י וְ/אַֽהַרְגָ֖ה אֶת יַעֲקֹ֥ב אָחִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/041.yaml
  text: And Esau hated Jacob because of the blessing with which his father had blessed him[a], and Esau said in his heart, “The days of mourning for my father are drawing near[c][b]; then I will kill Jacob my brother.”
translation:
  language: ml
  text: 'തന്റെ അപ്പൻ യാക്കോബിനെ അനുഗ്രഹിച്ച അനുഗ്രഹം നിമിത്തം ഏശാവ് യാക്കോബിനോടു പക പുലർത്തി[a]. ഏശാവ് തന്റെ ഹൃദയത്തിൽ പറഞ്ഞു: “എന്റെ അപ്പനുവേണ്ടിയുള്ള വിലാപദിവസങ്ങൾ അടുത്തുവരുന്നു[b]; അപ്പോൾ ഞാൻ എന്റെ സഹോദരനായ യാക്കോബിനെ കൊല്ലും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വെറുത്തു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ ക്ഷണികമായ വികാരത്തെയല്ല, തുടർന്നുനിൽക്കുന്ന ശത്രുതയെയോ പകയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘എന്റെ അപ്പന്റെ വിലാപദിവസങ്ങൾ അടുത്തുവരുന്നു’ എന്നും മനസ്സിലാക്കാം. എബ്രായപ്രയോഗം യിസ്ഹാക്കിന്റെ മരണശേഷം അവനുവേണ്ടിയുള്ള വിലാപത്തെയോ യിസ്ഹാക്കുതന്നെ അനുഭവിക്കുന്ന ദുഃഖകാലത്തെയോ സൂചിപ്പിക്കാവുന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂטֹם
  choice: പക പുലർത്തി
  rationale: שׂטם എന്ന ക്രിയ ക്ഷണികമായ കോപത്തെക്കാൾ തുടർന്നുനിൽക്കുന്ന ശത്രുതയെയും ഉള്ളിൽ സൂക്ഷിക്കുന്ന പകയെയും സൂചിപ്പിക്കുന്നു. ‘പക പുലർത്തി’ ആ ദീർഘകാല മനോഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עַל הַבְּרָכָה
  choice: അനുഗ്രഹം നിമിത്തം
  rationale: ഇവിടെ עַל കാരണമോ നിമിത്തമോ സൂചിപ്പിക്കുന്നു; ‘നിമിത്തം’ കാരണം വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר בֵּרֲכוֹ אָבִיו
  choice: തന്റെ അപ്പൻ യാക്കോബിനെ അനുഗ്രഹിച്ച
  rationale: എബ്രായത്തിലെ അനുഗ്രഹിക്കുക എന്ന ക്രിയയുടെ ആവർത്തനം നിലനിർത്തുന്നു. ‘അവനെ’ എന്ന സർവനാമം മലയാളത്തിൽ ഏശാവിനെയോ യാക്കോബിനെയോ സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ യാക്കോബിന്റെ പേര് വ്യക്തമാക്കുന്നു.
- source_word: בְּלִבּוֹ
  choice: ഹൃദയത്തിൽ പറഞ്ഞു
  rationale: അക്ഷരാർഥത്തിലുള്ള എബ്രായ പ്രയോഗം ഉള്ളിലെ ചിന്തയെയോ സ്വയം പറഞ്ഞതിനെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലും ഈ പ്രയോഗം സ്വാഭാവികവും മനസ്സിലാകുന്നതുമാണ്.
- source_word: יִקְרְבוּ יְמֵי אֵבֶל אָבִי
  choice: എന്റെ അപ്പനുവേണ്ടിയുള്ള വിലാപദിവസങ്ങൾ അടുത്തുവരുന്നു
  rationale: മുഖ്യവായനയായി യിസ്ഹാക്കിന്റെ മരണശേഷം അവനുവേണ്ടി ആചരിക്കപ്പെടുന്ന വിലാപകാലത്തെ സൂചിപ്പിക്കുന്നു. ‘അടുത്തുവരുന്നു’ എന്നത് יִקְרְבוּ എന്നതിന്റെ ചലനാത്മക ഭാവം നിലനിർത്തുന്നു; വ്യാകരണപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְאַהַרְגָה
  choice: അപ്പോൾ ... കൊല്ലും
  rationale: കോഹോർട്ടേറ്റീവ് രൂപം ഏശാവിന്റെ ഉറച്ച തീരുമാനം പ്രകടമാക്കുന്നു. മുൻവാക്യത്തോടുള്ള കാലക്രമബന്ധം ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: אָחִי
  choice: എന്റെ സഹോദരനായ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ ബന്ധസൂചന നിലനിർത്തുകയും കുടുംബത്തിനുള്ളിലെ ആസൂത്രിത അക്രമത്തിന്റെ ദാരുണത പ്രകടമാക്കുകയും ചെയ്യുന്നു.
