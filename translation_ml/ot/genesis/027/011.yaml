  terminology: Names are conventionally and consistently rendered as യാക്കോബ്, റിബെക്ക, and ഏശാവ്. The relational apposition ‘തന്റെ അമ്മയായ റിബെക്കയോടു’ correctly reflects the Hebrew. The footnote should be classified as a cultural/contextual clarification rather than merely a lexical alternative.
