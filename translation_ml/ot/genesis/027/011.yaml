    rationale: Although contextually accurate, this replaces the Hebrew’s less explicit ‘smooth’ description with its inferred meaning. Using ‘മിനുസമുള്ളവൻ’ preserves the source expression while the note explains that it concerns body hair.
  - severity: low
    issue: Footnote reason is labeled lexical_alternative.
    rationale: The note chiefly clarifies the bodily-hair sense of ‘smooth’ in this context, so cultural_note/contextual clarification is more suitable.
