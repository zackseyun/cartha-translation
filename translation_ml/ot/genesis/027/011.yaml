  to: 'എന്നാൽ യാക്കോബ് തന്റെ അമ്മയായ റിബെക്കയോടു പറഞ്ഞു: “നോക്കൂ, എന്റെ സഹോദരനായ ഏശാവ് രോമമുള്ളവനാണ്; ഞാനാകട്ടെ മിനുസമുള്ളവനാണ്.[a]”'
