id: GEN.27.11
reference: Genesis 27:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יַעֲקֹ֔ב אֶל רִבְקָ֖ה אִמּ֑/וֹ הֵ֣ן עֵשָׂ֤ו אָחִ/י֙ אִ֣ישׁ שָׂעִ֔ר וְ/אָנֹכִ֖י אִ֥ישׁ חָלָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/011.yaml
  text: But Jacob said to Rebekah his mother[a], “Look, Esau my brother is a hairy man[b], and I am a smooth man.”
translation:
  language: ml
  text: 'എന്നാൽ യാക്കോബ് തന്റെ അമ്മയായ റിബെക്കയോടു പറഞ്ഞു: “നോക്കൂ, എന്റെ സഹോദരനായ ഏശാവ് രോമമുള്ളവനാണ്; ഞാനാകട്ടെ മിനുസമുള്ളവനാണ്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മിനുസമുള്ളവൻ” എന്നത് ഇവിടെ ഏശാവിനെപ്പോലെ ശരീരത്തിൽ രോമമില്ലാത്തവൻ എന്ന അർഥത്തിലാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ഇവിടെ യാക്കോബ് റിബെക്കയുടെ പദ്ധതിയോടുള്ള എതിർപ്പ് ഉന്നയിക്കുന്നതിനാൽ ‘എന്നാൽ’ സന്ദർഭോചിതമായ വൈരുധ്യം പ്രകടമാക്കുന്നു.
- source_word: אִמּוֹ
  choice: തന്റെ അമ്മയായ
  rationale: റിബെക്ക യാക്കോബിന്റെ അമ്മയാണെന്ന എബ്രായത്തിലെ സമാനാധികരണബന്ധം പേരിനോടൊപ്പം നിലനിർത്തുന്നു.
- source_word: הֵן
  choice: നോക്കൂ
  rationale: യാക്കോബിന്റെ ആശങ്കയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന സംവാദകണത്തിന്റെ സ്വാഭാവികവും ആധുനികവുമായ മലയാളരൂപം.
- source_word: אִישׁ שָׂעִר
  choice: രോമമുള്ളവൻ
  rationale: ഏശാവിന്റെ ശരീരത്തിൽ ധാരാളം രോമമുണ്ടെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘മനുഷ്യൻ’ എന്ന നാമം പ്രത്യേകം ആവർത്തിക്കേണ്ടതില്ല.
- source_word: וְאָנֹכִי
  choice: ഞാനാകട്ടെ
  rationale: സ്വതന്ത്ര സർവനാമം നൽകുന്ന ഊന്നലും ഏശാവുമായുള്ള വ്യക്തമായ വൈരുധ്യവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אִישׁ חָלָק
  choice: രോമമില്ലാത്തവൻ
  rationale: അക്ഷരാർഥത്തിലെ ‘മിനുസമുള്ളവൻ’ മലയാളത്തിൽ സ്വഭാവത്തെയോ രൂപത്തെയോ സൂചിപ്പിച്ചേക്കാം; സന്ദർഭത്തിലെ ശരീരരോമത്തിന്റെ വൈരുധ്യം വ്യക്തമായി നൽകാൻ ഈ രൂപം തിരഞ്ഞെടുത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. നേരിട്ടുള്ള സംഭാഷണത്തിലെ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിച്ചിട്ടുണ്ട്.
