revisions:
- from: പിന്നെ നീ അത് നിന്റെ അപ്പന്റെ അടുക്കൽ കൊണ്ടുചെല്ലണം; അദ്ദേഹം അത് ഭക്ഷിക്കും. അങ്ങനെ, മരിക്കുന്നതിനുമുമ്പ് അദ്ദേഹം നിന്നെ അനുഗ്രഹിക്കും.
  to: പിന്നെ നീ അത് നിന്റെ അപ്പന്റെ അടുക്കൽ കൊണ്ടുചെല്ലണം; അദ്ദേഹം അത് ഭക്ഷിക്കട്ടെ; അങ്ങനെ, അദ്ദേഹം മരിക്കുന്നതിനുമുമ്പ് നിന്നെ അനുഗ്രഹിക്കേണ്ടതിന്.
  rationale: The revision retains the instructional sequence while using «അനുഗ്രഹിക്കേണ്ടതിന്» to express the Hebrew purpose clause explicitly. «അദ്ദേഹം മരിക്കുന്നതിനുമുമ്പ്» identifies the father as the one whose death is in view. The permissive/instructional «ഭക്ഷിക്കട്ടെ» is idiomatic Malayalam in this context and avoids presenting the purpose clause as merely a later result.
