  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֵבֵאתָ֥ לְ/אָבִ֖י/ךָ וְ/אָכָ֑ל בַּ/עֲבֻ֛ר אֲשֶׁ֥ר יְבָרֶכְ/ךָ֖ לִ/פְנֵ֥י מוֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/010.yaml
  text: Then you shall bring it to your father, and he will eat, so that he may bless you before his death.
translation:
  language: ml
  text: പിന്നെ നീ അത് നിന്റെ അപ്പന്റെ അടുക്കൽ കൊണ്ടുചെല്ലണം; അദ്ദേഹം അത് ഭക്ഷിക്കട്ടെ; അങ്ങനെ, അദ്ദേഹം മരിക്കുന്നതിനുമുമ്പ് നിന്നെ അനുഗ്രഹിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: പിന്നെ നീ അത് ... കൊണ്ടുചെല്ലണം
  rationale: സംഭവക്രമത്തിലെ നിർദേശമായി വരുന്ന സംയോജകപൂർവ ക്രിയയുടെ തുടർച്ചയും നിർദേശസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לְאָבִיךָ
  choice: നിന്റെ അപ്പന്റെ അടുക്കൽ
  rationale: אָב എന്ന പദത്തിന്റെ 2-ാം പുരുഷ ഏകവചന പ്രത്യയം കൃത്യമായി നിലനിർത്തുന്നു; കുടുംബസംഭാഷണത്തിൽ ‘അപ്പൻ’ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: וְאָכָל
  choice: അദ്ദേഹം അത് ഭക്ഷിക്കും
  rationale: പദ്ധതിയിൽ പ്രതീക്ഷിക്കുന്ന അടുത്ത പ്രവൃത്തിയെ ഭാവികാലത്തിൽ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ അർത്ഥവ്യക്തതയ്ക്കായി കർമമായ ‘അത്’ ആവർത്തിച്ചു.
- source_word: בַּעֲבֻר אֲשֶׁר
  choice: അങ്ങനെ
  rationale: ഇവിടെ വരുന്ന ഉദ്ദേശ്യബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ഫലലക്ഷ്യബന്ധമായി വ്യക്തമാക്കുന്നു; പിതാവ് ഭക്ഷിക്കേണ്ടതിന്റെ ലക്ഷ്യം അനുഗ്രഹം ലഭിക്കലാണ്.
- source_word: יְבָרֶכְךָ
  choice: അദ്ദേഹം നിന്നെ അനുഗ്രഹിക്കും
  rationale: ברך എന്ന പീയേൽ ക്രിയയും 2-ാം പുരുഷ ഏകവചന കർമപ്രത്യയവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: לִפְנֵי מוֹתוֹ
  choice: മരിക്കുന്നതിനുമുമ്പ്
  rationale: അക്ഷരാർത്ഥം ‘അവന്റെ മരണത്തിനു മുമ്പ്’ എന്നാണെങ്കിലും, ആരുടെ മരണമെന്നത് മലയാളക്രിയാരൂപത്തിൽ വ്യക്തമായി ചേർത്ത് സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
