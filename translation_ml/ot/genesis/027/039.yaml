source:
  edition: WLC
  text: וַ/יַּ֛עַן יִצְחָ֥ק אָבִ֖י/ו וַ/יֹּ֣אמֶר אֵלָ֑י/ו הִנֵּ֞ה מִ/שְׁמַנֵּ֤י הָ/אָ֨רֶץ֙ יִהְיֶ֣ה מֽוֹשָׁבֶ֔/ךָ וּ/מִ/טַּ֥ל הַ/שָּׁמַ֖יִם מֵ/עָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/039.yaml
  text: Then his father Isaac answered and said to him[a], “Behold, your dwelling shall be away from the richness of the earth, and away from the dew of heaven above.”
translation:
  language: ml
  text: 'അപ്പോൾ അവന്റെ അപ്പനായ യിസ്ഹാക്ക് അവനോടു മറുപടി പറഞ്ഞു: “ഇതാ, ഭൂമിയുടെ സമൃദ്ധിയിൽനിന്ന് അകലെയായിരിക്കും നിന്റെ വാസസ്ഥലം; മീതെയുള്ള ആകാശത്തിന്റെ മഞ്ഞിൽനിന്നും അകലെയായിരിക്കും.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഇതാ, ഭൂമിയുടെ സമൃദ്ധിയിൽനിന്നായിരിക്കും നിന്റെ വാസസ്ഥലം; മീതെയുള്ള ആകാശത്തിന്റെ മഞ്ഞിൽനിന്നും.” എബ്രായ ഉപസർഗം ‘നിന്ന്/ഉള്ള’ എന്ന അനുകൂല അർഥത്തിലോ ‘നിന്ന് അകലെ’ എന്ന വേർപാടിന്റെ അർഥത്തിലോ മനസ്സിലാക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: മറുപടി പറഞ്ഞു
  rationale: സംഭാഷണത്തിന് മറുപടിയായി പ്രസംഗം തുടങ്ങുന്ന ענה എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אָבִיו
  choice: അവന്റെ അപ്പനായ യിസ്ഹാക്ക്
  rationale: യിസ്ഹാക്കും ‘അവന്റെ അപ്പൻ’ എന്ന ബന്ധസൂചനയും ചേർന്ന എബ്രായ ഘടനയും ബന്ധപരമായ ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ഗൗരവമുള്ള പ്രഖ്യാപനത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരസൂചകത്തിന് നിലവാരമുള്ള സ്വാഭാവിക മലയാള തുല്യം.
- source_word: מִשְׁמַנֵּי הָאָרֶץ
  choice: ഭൂമിയുടെ സമൃദ്ധിയിൽനിന്ന് അകലെ
  rationale: שְׁמַנִּים എന്നതിലെ ഫലഭൂയിഷ്ഠതയുടെയും സമൃദ്ധിയുടെയും രൂപകാർഥം നൽകുന്നു; מן ഇവിടെ വേർപാട്/അഭാവം സൂചിപ്പിക്കുന്നതായി മുഖ്യവായനയിൽ എടുത്തിരിക്കുന്നു.
- source_word: מוֹשָׁבֶךָ
  choice: നിന്റെ വാസസ്ഥലം
  rationale: താമസിക്കുന്ന ഇടം എന്ന സ്ഥലാർഥം മാന്യവും സാധാരണക്കാർക്ക് വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּמִטַּל הַשָּׁמַיִם
  choice: ആകാശത്തിന്റെ മഞ്ഞിൽനിന്നും അകലെ
  rationale: ആദ്യ מן-പ്രയോഗത്തോടു സമാന്തരമായി വേർപാട് സൂചിപ്പിക്കുന്ന മുഖ്യവായന നിലനിർത്തുന്നു.
- source_word: מֵעָל
  choice: മീതെയുള്ള
  rationale: ആകാശത്തിന്റെ ഉയരസ്ഥാനം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യിസ്ഹാക്ക് ഏശാവിനോടു പറഞ്ഞ വാക്കിലെ מן എന്ന ഉപസർഗത്തിന്റെ അർഥം
  choice: 'വേർപാട്/അഭാവം: ഭൂമിയുടെ സമൃദ്ധിയിൽനിന്നും ആകാശത്തിന്റെ മഞ്ഞിൽനിന്നും ‘അകലെ’'
  alternative: 'ഉറവിടം/പങ്കാളിത്തം: ഭൂമിയുടെ സമൃദ്ധിയിൽനിന്നും ആകാശത്തിന്റെ മഞ്ഞിൽനിന്നും ലഭിക്കുന്ന വാസം'
  rationale: ഏശാവിനു ലഭിക്കുന്ന പരിമിതമായ അനുഗ്രഹവും 27:28-ൽ യാക്കോബിനു നൽകിയ അനുഗ്രഹവുമായുള്ള വൈരുധ്യവും വേർപാടുസൂചക വായനയെ പിന്തുണയ്ക്കുന്നു. എന്നിരുന്നാലും എബ്രായ ഉപസർഗത്തിന് അനുകൂലമായ ഉറവിടാർഥവും സാധ്യമായതിനാൽ ആ യഥാർഥമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘ഇതാ’, ‘വാസസ്ഥലം’ എന്നിവ പ്രഖ്യാപനത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു; അതേസമയം വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. ‘മഞ്ഞ്’ ഇവിടെ ആകാശത്തിൽനിന്നുള്ള dew എന്ന അർഥത്തിലാണ്.
