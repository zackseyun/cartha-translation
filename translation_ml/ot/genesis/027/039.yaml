  to: 'അപ്പോൾ അവന്റെ അപ്പനായ യിസ്ഹാക്ക് അവനോടു മറുപടി പറഞ്ഞു: “ഇതാ, ഭൂമിയുടെ സമൃദ്ധിയിൽനിന്ന് അകലെയായിരിക്കും നിന്റെ വാസസ്ഥലം; മീതെയുള്ള ആകാശത്തിന്റെ മഞ്ഞിൽനിന്നും അകലെയായിരിക്കും.[a]”'
