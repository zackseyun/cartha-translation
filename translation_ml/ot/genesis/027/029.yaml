  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יַֽעַבְד֣וּ/ךָ עַמִּ֗ים ו/ישתחו לְ/ךָ֙ לְאֻמִּ֔ים הֱוֵ֤ה גְבִיר֙ לְ/אַחֶ֔י/ךָ וְ/יִשְׁתַּחֲוּ֥וּ לְ/ךָ֖ בְּנֵ֣י אִמֶּ֑/ךָ אֹרְרֶ֣י/ךָ אָר֔וּר וּֽ/מְבָרֲכֶ֖י/ךָ בָּרֽוּךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/029.yaml
  text: Let peoples serve you[a], and nations bow down to you. Be master over your brothers, and let your mother's sons bow down to you. Cursed be those who curse you[b], and blessed be those who bless you.
translation:
  language: ml
  text: ജനതകൾ നിന്നെ സേവിക്കട്ടെ; ജനസമൂഹങ്ങൾ നിന്റെ മുമ്പിൽ കുമ്പിടട്ടെ.[a] നീ നിന്റെ സഹോദരന്മാരുടെമേൽ അധിപനായിരിക്കട്ടെ;[b] നിന്റെ അമ്മയുടെ പുത്രന്മാർ നിന്റെ മുമ്പിൽ കുമ്പിടട്ടെ. നിന്നെ ശപിക്കുന്നവർ ശപിക്കപ്പെട്ടവരാകട്ടെ; നിന്നെ അനുഗ്രഹിക്കുന്നവർ അനുഗൃഹീതരാകട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിനക്കു പ്രണാമം അർപ്പിക്കട്ടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായ ക്രിയ ഒരു മേലധികാരിയുടെ മുമ്പിൽ സാഷ്ടാംഗം വീഴുന്നതിനെയോ കുമ്പിടുന്നതിനെയോ സൂചിപ്പിക്കാം; ഇവിടെ മനുഷ്യനോടുള്ള ആദരവും കീഴടങ്ങലുമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘നിന്റെ സഹോദരന്മാരുടെമേൽ യജമാനനായിരിക്കട്ടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രായ പദം അധികാരവും മേൽക്കോയ്മയും ഉള്ള ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַבְדוּךָ
  choice: നിന്നെ സേവിക്കട്ടെ
  rationale: עבד എന്ന ക്രിയ ഇവിടെ വെറും തൊഴിലെടുക്കുക എന്നതിലുപരി സേവനവും കീഴടങ്ങലും സൂചിപ്പിക്കുന്നു. ‘സേവിക്കട്ടെ’ ഈ അർത്ഥവ്യാപ്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: עַמִּים
  choice: ജനതകൾ
  rationale: വിവിധ ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന ബഹുവചന കൂട്ടനാമമായതിനാൽ ‘ജനതകൾ’ യോജിക്കുന്നു.
- source_word: וְיִשְׁתַּחֲווּ לְךָ
  choice: നിന്റെ മുമ്പിൽ കുമ്പിടട്ടെ
  rationale: השתחוה മേലധികാരിയുടെ മുമ്പിൽ സാഷ്ടാംഗം വീഴുകയോ കുമ്പിടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കാം. മനുഷ്യനായ സ്വീകർത്താവിന്റെ സന്ദർഭത്തിൽ ‘ആരാധിക്കട്ടെ’ എന്നു പരിഭാഷപ്പെടുത്താതെ ആദരപൂർവമായ കീഴടങ്ങലിന്റെ ദേഹഭാവം നിലനിർത്തുന്നു.
- source_word: לְאֻמִּים
  choice: ജനസമൂഹങ്ങൾ
  rationale: עַמִּים എന്നതിന് സമാന്തരമായ കാവ്യപദമാണിത്. ‘ജനസമൂഹങ്ങൾ’ ആവർത്തനം ഒഴിവാക്കിക്കൊണ്ട് ജനവിഭാഗങ്ങൾ എന്ന ആശയം സംരക്ഷിക്കുന്നു.
- source_word: הֱוֵה גְבִיר
  choice: അധിപനായിരിക്കട്ടെ
  rationale: הוה സഹിതമുള്ള ഈ നാമപ്രയോഗം ആശീർവാദരൂപത്തിലുള്ള ആജ്ഞയോ അഭിലാഷമോ പ്രകടിപ്പിക്കുന്നു. גביר അധികാരസ്ഥാനത്തുള്ള യജമാനനെയോ അധിപനെയോ സൂചിപ്പിക്കുന്നു; ‘അധിപൻ’ ദൈവനാമവുമായി ആശയക്കുഴപ്പം സൃഷ്ടിക്കാതെ കുടുംബപരമായ മേൽക്കോയ്മ വ്യക്തമാക്കുന്നു.
- source_word: לְאַחֶיךָ
  choice: നിന്റെ സഹോദരന്മാർക്ക്
  rationale: גביר എന്ന പദത്തോടൊപ്പമുള്ള ל ബന്ധത്തിൽ മേൽക്കോയ്മയുടെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘സഹോദരന്മാർക്ക് അധിപൻ’ എന്നത് ഈ ബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּנֵי אִמֶּךָ
  choice: നിന്റെ അമ്മയുടെ പുത്രന്മാർ
  rationale: ഹീബ്രായിലെ കുടുംബബന്ധപ്രയോഗം നേരിട്ട് നിലനിർത്തുകയും ‘സഹോദരന്മാർ’ എന്നതിൽനിന്ന് അമ്മയുടെ പുത്രന്മാർ എന്ന പ്രത്യേകീകരണം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: אֹרְרֶיךָ אָרוּר
  choice: നിന്നെ ശപിക്കുന്നവർ ശപിക്കപ്പെട്ടവരാകട്ടെ
  rationale: ക്രിയാനാമരൂപവും വിധേയവിശേഷണവും ചേർന്ന പരസ്പരഫലമുള്ള ശാപസൂത്രം മലയാളത്തിൽ ആശീർവാദത്തിന്റെ ഗൗരവമുള്ള അഭിലാഷരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וּמְבָרֲכֶיךָ בָּרוּךְ
  choice: നിന്നെ അനുഗ്രഹിക്കുന്നവർ അനുഗൃഹീതരാകട്ടെ
  rationale: മുൻവാക്യത്തിന് സമാന്തരമായ അനുഗ്രഹസൂത്രമാണിത്. ഹീബ്രായിൽ വിധേയപദം ഏകവചനരൂപത്തിലാണെങ്കിലും ബഹുവചന കർത്താവിനെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനസമ്മതി ഉപയോഗിച്ചു.
theological_decisions:
- issue: ഒരു മനുഷ്യനോടുള്ള വണക്കം സൂചിപ്പിക്കുന്ന ഭാഷ
  choice: നിന്റെ മുമ്പിൽ കുമ്പിടട്ടെ
  alternative: നിന്നെ ആരാധിക്കട്ടെ / നിനക്കു പ്രണാമം അർപ്പിക്കട്ടെ
  rationale: השתחוה ദൈവത്തിന്റെയോ മനുഷ്യന്റെയോ മുമ്പിലുള്ള സാഷ്ടാംഗവണക്കത്തെ സൂചിപ്പിക്കാം. യിസ്ഹാക്ക് യാക്കോബിന് നൽകുന്ന കുടുംബപരവും ജനതകളെ സംബന്ധിച്ചതുമായ മേൽക്കോയ്മയുടെ ആശീർവാദമാണ് സന്ദർഭം. അതിനാൽ ദൈവാരാധന എന്ന് തീരുമാനിച്ചുപറയാതെ ദേഹഭാവവും ആദരപൂർവമായ കീഴടങ്ങലും ‘കുമ്പിടുക’ എന്ന പദം സംരക്ഷിക്കുന്നു.
- issue: גביר എന്ന അധികാരപദത്തിന്റെ വിവർത്തനം
  choice: അധിപൻ
  alternative: യജമാനൻ / കർത്താവ്
  rationale: പദം സഹോദരന്മാരുടെ മേലുള്ള അധികാരസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു. ‘അധിപൻ’ ആ ബന്ധം വ്യക്തമാക്കുകയും ദൈവത്തെ സൂചിപ്പിക്കാൻ പതിവായി ഉപയോഗിക്കുന്ന ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരുമായി ആശയക്കുഴപ്പം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആശീർവാദത്തിന്റെ കാവ്യാത്മക സമാന്തരഘടനയും ഗൗരവമുള്ള അഭിലാഷഭാവവും നിലനിർത്തി. സാധാരണ ആധുനിക മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും ‘അധിപൻ’, ‘അനുഗൃഹീതർ’ തുടങ്ങിയ പദങ്ങളിലൂടെ വാക്യത്തിന്റെ ഔപചാരിക ഗൗരവം സംരക്ഷിച്ചു.
