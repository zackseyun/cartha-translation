source:
  edition: WLC
  text: וַ/יְהִי֙ כִּֽי זָקֵ֣ן יִצְחָ֔ק וַ/תִּכְהֶ֥יןָ עֵינָ֖י/ו מֵ/רְאֹ֑ת וַ/יִּקְרָ֞א אֶת עֵשָׂ֣ו בְּנ֣/וֹ הַ/גָּדֹ֗ל וַ/יֹּ֤אמֶר אֵלָי/ו֙ בְּנִ֔/י וַ/יֹּ֥אמֶר אֵלָ֖י/ו הִנֵּֽנִ/י־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/001.yaml
  text: It happened that when Isaac was old and his eyes were too dim to see[a], he called Esau his older son and said to him, “My son,” and he said to him, “Here I am.”
translation:
  language: ml
  text: യിസ്ഹാക്ക് വൃദ്ധനായി, അവന്റെ കണ്ണുകൾക്കു കാണാൻ കഴിയാത്തവിധം മങ്ങിപ്പോയപ്പോൾ, അവൻ തന്റെ മൂത്ത മകനായ ഏശാവിനെ[a] വിളിച്ചു. അവനോടു, “എന്റെ മകനേ,” എന്നു പറഞ്ഞു. അവൻ, “ഇതാ, ഞാൻ ഇവിടെ ഉണ്ട്,” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തന്റെ ഏറ്റവും മൂത്ത മകനായ ഏശാവിനെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: …ആയപ്പോൾ … അപ്പോൾ
  rationale: പുതിയ സംഭവഘട്ടം അവതരിപ്പിക്കുന്ന കഥാഘടനയും കാലസാഹചര്യവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഹീബ്രുവിൽ ഇല്ലാത്ത വ്യക്തമായ ‘ഇപ്പോൾ’ ചേർക്കുന്നില്ല.
- source_word: זָקֵן
  choice: വൃദ്ധനായപ്പോൾ
  rationale: യിസ്ഹാക്കിന്റെ പ്രായാധിക്യം ലളിതവും മാന്യവുമായ ഭാഷയിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַתִּכְהֶיןָ עֵינָיו מֵרְאֹת
  choice: കാണാൻ കഴിയാത്തവിധം അവന്റെ കണ്ണുകൾ മങ്ങിപ്പോയി
  rationale: കാഴ്ചയുടെ മങ്ങലും അതിന്റെ ഫലമായ കാണാനുള്ള അശക്തിയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: וַיִּקְרָא
  choice: വിളിച്ച്
  rationale: ഈ സന്ദർഭത്തിൽ കרא എന്നത് ഒരാളെ വിളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ആളയച്ചു വരുത്തി’ എന്നതുപോലെ ഔപചാരികത അധികരിപ്പിക്കുന്നില്ല.
- source_word: אֶת עֵשָׂו בְּנוֹ הַגָּדֹל
  choice: തന്റെ മൂത്ത മകനായ ഏശാവിനെ
  rationale: הַגָּדֹל ഇവിടെ യാക്കോബിനോടുള്ള താരതമ്യത്തിൽ പ്രായം കൂടിയ മകനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘മൂത്ത മകൻ’ ഇതിനെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּנִי
  choice: എന്റെ മകനേ
  rationale: ഉടമസ്ഥപ്രത്യയവും സ്നേഹപൂർവമായ നേരിട്ടുള്ള അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: הִנֵּנִי
  choice: ഇതാ, ഞാൻ
  rationale: സാന്നിധ്യവും പ്രതികരിക്കാനുള്ള സന്നദ്ധതയും അറിയിക്കുന്ന ഹീബ്രു മറുപടി സൂത്രത്തിന്റെ സംക്ഷിപ്തവും പരിചിതവുമായ മലയാളരൂപം.
