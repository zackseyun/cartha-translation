id: GEN.27.16
reference: Genesis 27:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֗ת עֹרֹת֙ גְּדָיֵ֣י הָֽ/עִזִּ֔ים הִלְבִּ֖ישָׁה עַל יָדָ֑י/ו וְ/עַ֖ל חֶלְקַ֥ת צַוָּארָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/016.yaml
  text: And she put the skins of the young goats on his hands and on the smooth part of his neck.
translation:
  language: ml
  text: ആട്ടിൻകുട്ടികളുടെ തോലുകൾ അവൾ അവന്റെ കൈകളിലും കഴുത്തിലെ മിനുസമുള്ള ഭാഗത്തും ധരിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹרֹת
  choice: തോലുകൾ
  rationale: മൃഗങ്ങളുടെ പുറംതോലുകൾ മൂടുപടിയായി ഉപയോഗിച്ചതിനാൽ, സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവികമായ ബഹുവചനമാണ് ‘തോലുകൾ’.
- source_word: גְּדָיֵי הָעִזִּים
  choice: ആട്ടിൻകുട്ടികളുടെ
  rationale: ഇത് ആടുകളുടെ കുഞ്ഞുങ്ങളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ആട്ടിൻകുട്ടികൾ’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הִלְבִּישָׁה
  choice: ധരിപ്പിച്ചു
  rationale: לבש എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം മറ്റൊരാളിൽ എന്തെങ്കിലും ധരിപ്പിക്കുക എന്ന കാരണാർഥം നൽകുന്നു; തോലുകൾ ശരീരഭാഗങ്ങളിൽ വെച്ചുമൂടിയ പ്രവൃത്തി ഇത് ചുരുക്കമായും കൃത്യമായും അറിയിക്കുന്നു.
- source_word: עַל יָדָיו
  choice: അവന്റെ കൈകളിൽ
  rationale: עַל എന്നതിന്റെ സ്ഥാനസൂചക അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി ‘കൈകളിൽ’ എന്നു വരുന്നു.
- source_word: חֶלְקַת צַוָּארָיו
  choice: കഴുത്തിലെ മിനുസമുള്ള ഭാഗത്ത്
  rationale: חֶלְקַת എന്നത് മിനുസമുള്ള ഭാഗത്തെ സൂചിപ്പിക്കുന്നു; അമൂർത്തമായ ‘മിനുസം’ എന്നതിനെക്കാൾ ശരീരത്തിലെ നിർദിഷ്ട ഭാഗം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രു വാക്യക്രമം നിർബന്ധമായി പകർത്താതെ, പ്രവൃത്തിയും ശരീരഭാഗങ്ങളും വ്യക്തമായി ഗ്രഹിക്കാവുന്ന സ്വാഭാവിക മലയാളക്രമം സ്വീകരിച്ചു.
