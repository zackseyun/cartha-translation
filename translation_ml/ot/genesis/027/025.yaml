  edition: WLC
  text: וַ/יֹּ֗אמֶר הַגִּ֤שָׁ/ה לִּ/י֙ וְ/אֹֽכְלָה֙ מִ/צֵּ֣יד בְּנִ֔/י לְמַ֥עַן תְּבָֽרֶכְ/ךָ֖ נַפְשִׁ֑/י וַ/יַּגֶּשׁ ל/וֹ֙ וַ/יֹּאכַ֔ל וַ/יָּ֧בֵא ל֦/וֹ יַ֖יִן וַ/יֵּֽשְׁתְּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/025.yaml
  text: And he said[a], “Bring it near to me, and I will eat of my son’s game, so that my soul may bless you.” So he brought it near to him, and he ate; and he brought him wine, and he drank.
translation:
  language: ml
  text: 'യിസ്ഹാക്ക് പറഞ്ഞു: “അത് എന്റെ അടുത്തേക്കു കൊണ്ടുവരുക; എന്റെ മകന്റെ വേട്ടയിറച്ചിയിൽനിന്ന് ഞാൻ ഭക്ഷിക്കട്ടെ; അങ്ങനെ എന്റെ പ്രാണൻ നിന്നെ അനുഗ്രഹിക്കട്ടെ.”[a] യാക്കോബ് അത് യിസ്ഹാക്കിന്റെ അടുത്തേക്കു കൊണ്ടുവന്നു; യിസ്ഹാക്ക് ഭക്ഷിച്ചു. പിന്നെ യാക്കോബ് യിസ്ഹാക്കിന് വീഞ്ഞ് കൊണ്ടുവന്നു; യിസ്ഹാക്ക് കുടിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: “ഞാൻ നിന്നെ അനുഗ്രഹിക്കേണ്ടതിന്.” എബ്രായത്തിൽ: “എന്റെ പ്രാണൻ നിന്നെ അനുഗ്രഹിക്കേണ്ടതിന്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּישָׁה
  choice: എന്റെ അടുത്തേക്കു കൊണ്ടുവരുക
  rationale: ഹിഫീൽ ആജ്ഞാരൂപം അടുത്തേക്കു കൊണ്ടുവരുക/സമർപ്പിക്കുക എന്ന അർഥം നൽകുന്നു; ഇവിടെ യിസ്ഹാക്കിന്റെ അടുത്തേക്കുള്ള ഭൗതിക ചലനം നിലനിർത്തുന്നു.
- source_word: וְאֹכְלָה
  choice: ഞാൻ ... ഭക്ഷിക്കട്ടെ
  rationale: ഒന്നാംപുരുഷ cohortative രൂപത്തിലെ ഉദ്ദേശ്യവും ആഗ്രഹവും മലയാളത്തിലെ സ്വാഭാവികമായ ‘ഭക്ഷിക്കട്ടെ’ എന്ന രൂപം പ്രകടിപ്പിക്കുന്നു.
- source_word: מִצֵּיד בְּנִי
  choice: എന്റെ മകന്റെ വേട്ടയിറച്ചിയിൽനിന്നു
  rationale: צַיִד വേട്ടയിൽ ലഭിച്ച മാംസം/ഇരയെ സൂചിപ്പിക്കുന്നു; ഭക്ഷണസന്ദർഭത്തിൽ ‘വേട്ടയിറച്ചി’ വ്യക്തവും സ്വാഭാവികവുമാണ്. מִן എന്ന ഭാഗികമായ ആശയം ‘-യിൽനിന്നു’ വഴി നിലനിർത്തുന്നു.
- source_word: לְמַעַן
  choice: അങ്ങനെ
  rationale: ഉദ്ദേശ്യസൂചകമായ ബന്ധം ലളിതവും ആധുനികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: എന്റെ പ്രാണൻ നിന്നെ അനുഗ്രഹിക്കട്ടെ
  rationale: നֶפֶשׁ എന്ന പദത്തെ ഒഴിവാക്കി വെറും ‘ഞാൻ’ എന്നു മാറ്റാതെ, എബ്രായത്തിലെ വ്യക്തിപരവും ഗൗരവമുള്ളതുമായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: וַיַּגֶּשׁ לוֹ
  choice: അവൻ അത് അയാളുടെ അടുത്തേക്കു കൊണ്ടുവന്നു
  rationale: മുൻപത്തെ ആജ്ഞയിലെ נגשׁ എന്ന ക്രിയയുടെ ആവർത്തനവും അടുത്തേക്കു കൊണ്ടുവരുന്ന പ്രവൃത്തിയും നിലനിർത്തുന്നു.
- source_word: יַיִן
  choice: വീഞ്ഞ്
  rationale: יַיִן എന്നതിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ മലയാള പരിഭാഷ.
- source_word: וַיֵּשְׁתְּ
  choice: അയാൾ കുടിച്ചു
  rationale: שׁתה എന്ന ക്രിയയുടെ ലളിതമായ ആഖ്യാനരൂപം നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: ‘എന്റെ പ്രാണൻ നിന്നെ അനുഗ്രഹിക്കട്ടെ’ എന്ന എബ്രായ പ്രയോഗം
  choice: പ്രധാന പാഠത്തിൽ പദാനുസൃതമായ പ്രയോഗം നിലനിർത്തി
  alternative: ‘ഞാൻ നിന്നെ അനുഗ്രഹിക്കട്ടെ’
  rationale: നֶפֶשׁ വാക്യത്തിലെ വ്യാകരണവിഷയമായതിനാൽ അതിനെ മായ്ച്ചുകളയാതെ യഥാർഥ പ്രയോഗവും അതിലെ ഗൗരവവും സംരക്ഷിച്ചു; സ്വാഭാവികമായ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. യാക്കോബിനും യിസ്ഹാക്കിനും ഒരേ സർവനാമം ഉപയോഗിച്ചാൽ ആശയക്കുഴപ്പം ഉണ്ടാകുന്നതിനാൽ യാക്കോബിന് ‘അവൻ’, യിസ്ഹാക്കിന് ‘അയാൾ’ എന്നു വേർതിരിച്ചു. മുഖ്യപാഠത്തിൽ എബ്രായത്തിലെ ‘എന്റെ പ്രാണൻ’ എന്ന പ്രയോഗം നിലനിർത്തി, സ്വാഭാവികമായ മലയാളരൂപം അടിക്കുറിപ്പിൽ നൽകി.
