  terminology: ‘വേട്ടയിറച്ചി,’ ‘വീഞ്ഞ്,’ and ‘അനുഗ്രഹിക്കട്ടെ’ fit a dignified modern-standard Malayalam biblical register. ‘എന്റെ പ്രാണൻ’ retains the marked Hebrew expression, while the note gives the idiomatic sense.
