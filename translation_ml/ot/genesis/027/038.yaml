source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר עֵשָׂ֜ו אֶל אָבִ֗י/ו הַֽ/בְרָכָ֨ה אַחַ֤ת הִֽוא לְ/ךָ֙ אָבִ֔/י בָּרֲכֵ֥/נִי גַם אָ֖נִי אָבִ֑/י וַ/יִּשָּׂ֥א עֵשָׂ֛ו קֹל֖/וֹ וַ/יֵּֽבְךְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/038.yaml
  text: Esau said to his father[a], “Do you have only one blessing, my father? Bless me too, my father!” Then Esau raised his voice and wept.
translation:
  language: ml
  text: 'ഏശാവ് തന്റെ അപ്പനോടു പറഞ്ഞു: “എന്റെ അപ്പാ, അങ്ങേക്കു ഒരേയൊരു അനുഗ്രഹമേ ഉള്ളോ? എന്റെ അപ്പാ, എന്നെയും അനുഗ്രഹിക്കണമേ!” അപ്പോൾ ഏശാവ് ശബ്ദമുയർത്തി കരഞ്ഞു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבְרָכָה אַחַת הִוא לְךָ
  choice: അങ്ങേക്കു ഒരേയൊരു അനുഗ്രഹമേ ഉള്ളോ?
  rationale: ഹീബ്രായിലെ ക്രിയയില്ലാത്ത വാക്യം അക്ഷരാർഥത്തിൽ ‘അനുഗ്രഹം ഒന്നു മാത്രമാണോ അങ്ങേക്കുള്ളത്?’ എന്ന ആശയം നൽകുന്നു. യിസ്ഹാക്കിന് നൽകാൻ ഒരേയൊരു അനുഗ്രഹം മാത്രമേയുള്ളോ എന്ന ഏശാവിന്റെ വേദനയും ആശ്ചര്യവും സ്വാഭാവികമായ മലയാള ചോദ്യരൂപത്തിൽ ഇത് നിലനിർത്തുന്നു.
- source_word: אָבִי
  choice: അപ്പാ
  rationale: ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം ‘എന്റെ അപ്പൻ’ എന്ന ബന്ധം സൂചിപ്പിക്കുന്നു. നേരിട്ടുള്ള വികാരഭരിതമായ അഭിസംബോധനയിൽ ആധുനിക മലയാളത്തിൽ ‘അപ്പാ’ സ്വാഭാവികമാണ്; രണ്ടു പ്രാവശ്യവും ആവർത്തിച്ച് മൂലപാഠത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: בָּרֲכֵנִי
  choice: എന്നെയും അനുഗ്രഹിക്കണമേ
  rationale: ברך എന്ന ക്രിയയുടെ ആജ്ഞാരൂപവും ഒന്നാംപുരുഷ ഏകവചന കർമപ്രത്യയവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു. ‘ണമേ’ അപേക്ഷയുടെ വികാരതീവ്രതയും മാന്യമായ അഭ്യർഥനാഭാവവും നൽകുന്നു.
- source_word: גַּם אָֽנִי
  choice: എന്നെയും
  rationale: യാക്കോബിനോടൊപ്പം താനും അനുഗ്രഹിക്കപ്പെടണമെന്ന ഉൾപ്പെടുത്തലിന്റെ ഊന്നൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיִּשָּׂא ... קֹלוֹ
  choice: ഉറക്കെ
  rationale: ‘തന്റെ ശബ്ദം ഉയർത്തി’ എന്ന ഹീബ്രായ പ്രയോഗം കരച്ചിലുമായി ചേർന്നപ്പോൾ ശബ്ദമുയർത്തിയുള്ള വിലാപത്തെ സൂചിപ്പിക്കുന്നു. ‘ഉറക്കെ കരഞ്ഞു’ ആ ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיֵּבְךְּ
  choice: കരഞ്ഞു
  rationale: ക്രിയ കണ്ണീരോടെയുള്ള കരച്ചിലിനെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായ മലയാള പദമാണിത്.
- source_word: עֵשָׂו
  choice: ഏശാവ്
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: യിസ്ഹാക്കിന്റെ അനുഗ്രഹം ഒന്നു മാത്രമാണെന്ന ചോദ്യത്തിന്റെ സ്വഭാവം
  choice: ‘അങ്ങേക്കു ഒരേയൊരു അനുഗ്രഹമേ ഉള്ളോ?’ എന്ന വ്യാകുലമായ ചോദ്യം
  alternative: ‘അനുഗ്രഹം അങ്ങേക്കു ഒന്നാണോ?’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ രൂപം
  rationale: മൂലപാഠത്തിലെ യഥാർഥ ചോദ്യവും ഏശാവിന്റെ വ്യാകുലതയും നിലനിർത്തുന്നു; അനുഗ്രഹത്തിന്റെ ദൈവശാസ്ത്രപരമായ സ്വഭാവത്തെക്കുറിച്ച് അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വികാരസാന്ദ്രവുമായ മലയാളം. ‘അപ്പാ’ എന്ന ആവർത്തനം ഏശാവിന്റെ അപേക്ഷയുടെ തീവ്രത നിലനിർത്തുന്നു. ‘ഉറക്കെ കരഞ്ഞു’ എന്നത് ഹീബ്രായിലെ ‘ശബ്ദം ഉയർത്തി കരഞ്ഞു’ എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള സമതുല്യമാണ്.
