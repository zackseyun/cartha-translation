source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ גַּם הוּא֙ מַטְעַמִּ֔ים וַ/יָּבֵ֖א לְ/אָבִ֑י/ו וַ/יֹּ֣אמֶר לְ/אָבִ֗י/ו יָקֻ֤ם אָבִ/י֙ וְ/יֹאכַל֙ מִ/צֵּ֣יד בְּנ֔/וֹ בַּ/עֲב֖וּר תְּבָרֲכַ֥/נִּי נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/031.yaml
  text: He too prepared tasty food and brought it to his father[a], and he said to his father, “Let my father rise and eat of his son's game[b], so that your soul may bless me.”
translation:
  language: ml
  text: 'അവനും രുചികരമായ വിഭവങ്ങൾ തയ്യാറാക്കി തന്റെ അപ്പന്റെ അടുക്കൽ കൊണ്ടുവന്നു; അവൻ തന്റെ അപ്പനോടു പറഞ്ഞു: “എന്റെ അപ്പൻ എഴുന്നേറ്റ് തന്റെ മകന്റെ വേട്ടയിറച്ചി കഴിക്കട്ടെ; അങ്ങയുടെ പ്രാണൻ[a] എന്നെ അനുഗ്രഹിക്കേണ്ടതിന്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘അങ്ങയുടെ പ്രാണൻ’ എന്നാണ്. ഇവിടെ ‘പ്രാണൻ’ എന്നത് വ്യക്തിയെ തന്നെയും സൂചിപ്പിക്കാം; അതിനാൽ ‘അങ്ങ് എന്നെ അനുഗ്രഹിക്കേണ്ടതിന്’ എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: അവനും
  rationale: യാക്കോബ് മുമ്പ് ചെയ്തതിന് സമാന്തരമായി ഏശാവും അതേ പ്രവൃത്തി ചെയ്തുവെന്ന ചേർക്കൽ ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מַטְעַמִּים
  choice: രുചികരമായ വിഭവങ്ങൾ
  rationale: ഈ സംഭവത്തിൽ പ്രത്യേകം പാകംചെയ്ത രുചിയുള്ള ഭക്ഷണങ്ങളെയാണ് ബഹുവചനപദം സൂചിപ്പിക്കുന്നത്; ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: יָקֻם
  choice: എന്റെ അപ്പൻ എഴുന്നേറ്റ്
  rationale: മൂന്നാംപുരുഷ അഭിസംബോധനയിലുള്ള വിനീതമായ അഭ്യർഥനയുടെ രൂപവും ഗൗരവമുള്ള ശൈലിയും സംരക്ഷിക്കുന്നു.
- source_word: מִצֵּיד בְּנוֹ
  choice: മകന്റെ വേട്ടയിറച്ചി
  rationale: צַיִד വേട്ടയിൽ കിട്ടിയ ഇരയെയോ അതിന്റെ മാംസത്തെയോ സൂചിപ്പിക്കുന്നു; ഭക്ഷണസന്ദർഭത്തിൽ ‘വേട്ടയിറച്ചി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בַּעֲבוּר
  choice: അങ്ങയുടെ പ്രാണൻ എന്നെ അനുഗ്രഹിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം അവതരിപ്പിക്കുന്ന ഘടനയെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘-േണ്ടതിന്’ രൂപത്തിൽ നൽകുന്നു.
- source_word: נַפְשֶׁךָ
  choice: അങ്ങയുടെ പ്രാണൻ
  rationale: നെഫെഷ് വ്യക്തിയെ തന്നെയും സൂചിപ്പിക്കാവുന്നുവെങ്കിലും, മൂലപാഠത്തിലെ വ്യക്തമായ ‘പ്രാണൻ’ എന്ന പ്രയോഗവും അനുഗ്രഹരംഗത്തിന്റെ ഗൗരവവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: נַפְשֶׁךָ എന്നത് ശരീരത്തിൽനിന്ന് വേറിട്ട ആത്മാവെന്നോ മുഴുവൻ വ്യക്തിയെന്നോ നിർവചിക്കണമോ
  choice: അങ്ങയുടെ പ്രാണൻ
  alternative: അങ്ങ് എന്നെ അനുഗ്രഹിക്കേണ്ടതിന്
  rationale: മൂലത്തിലെ രൂപകം നിലനിർത്തുന്നു; അതിനെ ഒരു പ്രത്യേക മനുഷ്യശാസ്ത്രസിദ്ധാന്തമായി വ്യാഖ്യാനിക്കുന്നില്ല. അടിക്കുറിപ്പ് പ്രയോഗത്തിന്റെ വ്യക്തിസൂചക സാധ്യത വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ‘അപ്പൻ’ കുടുംബസംഭാഷണത്തിന്റെ അടുപ്പം നിലനിർത്തുന്നു; നേരിട്ടുള്ള ആദരസൂചക അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
