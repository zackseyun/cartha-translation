  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִצְחָק֙ אֶל בְּנ֔/וֹ מַה זֶּ֛ה מִהַ֥רְתָּ לִ/מְצֹ֖א בְּנִ֑/י וַ/יֹּ֕אמֶר כִּ֥י הִקְרָ֛ה יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/020.yaml
  text: Then Isaac said to his son[a], “How is it that you found it so quickly, my son?” And he said[b], “Because Yahweh your God caused it to happen before me.”
translation:
  language: ml
  text: 'അപ്പോൾ യിസ്ഹാക്ക് തന്റെ മകനോടു ചോദിച്ചു: “മകനേ, നീ ഇത്ര വേഗം എങ്ങനെ അതു കണ്ടെത്തി?” അവൻ മറുപടി പറഞ്ഞു: “അങ്ങയുടെ ദൈവമായ യഹ്‌വെ എനിക്ക് അതു കിട്ടാനിടയാക്കിയതുകൊണ്ടാണ്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത രൂപം: “അങ്ങയുടെ ദൈവമായ യഹ്‌വെ അത് എന്റെ മുമ്പിൽ സംഭവിക്കുമാറാക്കി.” ഈ പ്രയോഗത്തിന് “എനിക്ക് അതു ലഭിക്കുമാറാക്കി” അഥവാ “എനിക്ക് വിജയം നൽകി” എന്ന അർഥവും വരാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה זֶּה מִהַרְתָּ לִמְצֹא
  choice: നീ ഇത്ര വേഗം എങ്ങനെ അതു കണ്ടെത്തി?
  rationale: ആശ്ചര്യത്തോടെയുള്ള ചോദ്യത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. לִמְצֹא എന്നതിന്റെ കർമം സന്ദർഭത്തിൽ വേട്ടമൃഗമോ അതിൽനിന്നുള്ള ഭക്ഷണമോ ആണെന്നതിനാൽ ‘അതു’ ചേർത്തിരിക്കുന്നു.
- source_word: בְּנִי
  choice: മകനേ
  rationale: ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയത്തോടുകൂടിയ സ്നേഹപൂർവമായ സംബോധന മലയാളത്തിൽ ‘മകനേ’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: כִּי
  choice: …തുകൊണ്ടാണ്
  rationale: യാക്കോബിന്റെ വിശദീകരണത്തിലെ കാരണബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הִקְרָה ... לְפָנַי
  choice: എനിക്ക് അതു കിട്ടാനിടയാക്കി
  rationale: קרה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർത്ഥവും לְפָנַי എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ ‘എനിക്കായി/എന്റെ മുമ്പിൽ’ എന്ന ആശയവും സ്വാഭാവികമായി കൂട്ടിച്ചേർക്കുന്നു; ദൈവം അതു നേരിട്ട് കൊണ്ടുവന്നു എന്ന കൂടുതൽ നിർദിഷ്ടമായ ആശയം ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: അങ്ങയുടെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ഏകവചനമായ ‘നിന്റെ ദൈവം’ എന്ന നിർണായകമായ വിവരണതീവ്രത നിലനിർത്തുന്നു; മകനായുള്ള മാന്യസംഭാഷണത്തിന് ‘അങ്ങയുടെ’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ അതിനെ പദവിയാക്കി മാറ്റാതെ, Yahweh-നോട് യോജിക്കുന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: הִקְרָה എന്നതിലെ ദൈവിക കാരണത്വം
  choice: എനിക്ക് അതു കിട്ടാനിടയാക്കി
  alternative: എന്റെ മുമ്പിൽ അതു സംഭവിക്കുമാറാക്കി / എനിക്ക് വിജയം നൽകി
  rationale: ദൈവിക പരിപാലനത്തിന്റെ സൂചനയും കാരണാർത്ഥവും നിലനിർത്തുന്നു; എന്നാൽ ‘വിജയം നൽകി’ എന്ന വ്യാഖ്യാനവികാസമോ ‘കൊണ്ടുവന്നു’ എന്ന നിർദിഷ്ട പ്രവർത്തിയോ മൂലപാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: ‘അങ്ങയുടെ ദൈവം’ എന്ന പ്രയോഗത്തിലെ കഥാതീവ്രത
  choice: അങ്ങയുടെ ദൈവമായ
  alternative: നമ്മുടെ ദൈവമായ / എന്റെ ദൈവമായ
  rationale: Jacob ‘your God’ എന്നു പറയുന്നതിലെ കഥാപരവും ദൈവശാസ്ത്രപരവുമായ അസ്വസ്ഥത പരിഹരിക്കാതെ അതേപടി സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവും കഥനയോഗ്യവുമായ ശൈലി. ‘യിസ്ഹാക്ക്’ എന്ന പരമ്പരാഗത ബൈബിൾനാമരൂപവും ദൈവനാമത്തിന് ‘യഹ്‌വെ’ എന്ന ലിപ്യന്തരണവും ഉപയോഗിച്ചു. പിതാവിനോടുള്ള മറുപടിയിൽ ‘അങ്ങയുടെ’ എന്ന മാന്യരൂപം സ്വീകരിച്ചു.
