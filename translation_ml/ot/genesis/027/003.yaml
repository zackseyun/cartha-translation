  yaml_path: translation/ot/genesis/027/003.yaml
  text: Now then[b][a], please take your equipment—your quiver and your bow—and go out to the field and hunt game for me.
translation:
  language: ml
  text: ഇപ്പോൾ, ദയവായി നിന്റെ ഉപകരണങ്ങൾ—നിന്റെ അമ്പറയും വില്ലും—എടുത്ത് വയലിലേക്കു പോയി എനിക്കുവേണ്ടി വേട്ടമൃഗത്തെ വേട്ടയാടിക്കൊണ്ടുവരിക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എനിക്കായി വേട്ടയിറച്ചി കൊണ്ടുവരിക.” എബ്രായപദം വയലിൽ വേട്ടയാടി ലഭിക്കുന്ന ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: മുൻസന്ദർഭത്തിൽനിന്ന് നിർദേശത്തിലേക്കുള്ള ബന്ധവും ഉടൻ ചെയ്യേണ്ടതിന്റെ ഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שָׂא נָא
  choice: ദയവായി ... എടുത്ത്
  rationale: ആയുധങ്ങൾ കൈയിലെടുക്കുക എന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു; נָא സൂചിപ്പിക്കുന്ന വിനീതമായ അഭ്യർഥനാഭാവം ‘ദയവായി’യിൽ പ്രതിഫലിക്കുന്നു.
- source_word: כֵלֶיךָ
  choice: നിന്റെ വേട്ടയുപകരണങ്ങൾ
  rationale: כְּלִי എന്ന വിശാലപദത്തെ തുടർന്നുള്ള അമ്പുറയും വില്ലും വ്യക്തമാക്കുന്നതിനാൽ, സന്ദർഭം സൂചിപ്പിക്കുമ്പോഴും അതിനെ വെറും ‘ആയുധങ്ങൾ’ എന്നു ചുരുക്കാത്ത പ്രയോഗം.
- source_word: תֶּלְיְךָ
  choice: അമ്പുറ
  rationale: അമ്പുകൾ സൂക്ഷിക്കുന്ന തൂക്കുപാത്രമായ quiver-ന്റെ സാധാരണ മലയാളപദം.
- source_word: וְקַשְׁתֶּךָ
  choice: വില്ലും
  rationale: קֶשֶׁת എന്ന സാധാരണ എബ്രായപദത്തിന്റെ നേരിട്ടുള്ള മലയാളപരിഭാഷ.
- source_word: וְצֵא הַשָּׂדֶה
  choice: വയലിലേക്കു പോയി
  rationale: שָׂדֶה എന്നതിന്റെ ‘വയൽ/തുറന്ന പ്രദേശം’ എന്ന മൂർത്തചിത്രം നിലനിർത്തുന്നു; ഇവിടെ വേട്ടയ്ക്കായി വീട്ടിൽനിന്നു പുറപ്പെടുന്നതാണ് ഉദ്ദേശ്യം.
- source_word: וְצוּדָה
  choice: വേട്ടയാടിക്കൊണ്ടുവരിക
  rationale: വേട്ടയാടി പിടിക്കുക എന്ന ക്രിയാഭാവവും ഇസഹാക്കിനായി ഇര കൊണ്ടുവരാനുള്ള സന്ദർഭലക്ഷ്യവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לִּי
  choice: എനിക്കുവേണ്ടി
  rationale: ഇസഹാക്കിന്റെ പ്രയോജനത്തിനായി വേട്ടമൃഗം നേടണമെന്ന ദാതൃപ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: צידה
  choice: വേട്ടമൃഗത്തെ
  rationale: വയലിൽ വേട്ടയാടി ലഭിക്കുന്ന ഭക്ഷ്യയോഗ്യമായ മൃഗം എന്ന സന്ദർഭാർഥം; പ്രത്യേകിച്ച് മാൻ എന്നു പരിമിതപ്പെടുത്തുന്നില്ല.
