id: GEN.27.15
reference: Genesis 27:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּקַּ֣ח רִ֠בְקָה אֶת בִּגְדֵ֨י עֵשָׂ֜ו בְּנָ֤/הּ הַ/גָּדֹל֙ הַ/חֲמֻדֹ֔ת אֲשֶׁ֥ר אִתָּ֖/הּ בַּ/בָּ֑יִת וַ/תַּלְבֵּ֥שׁ אֶֽת יַעֲקֹ֖ב בְּנָ֥/הּ הַ/קָּטָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/015.yaml
  text: Then Rebekah took the choice garments of Esau her older son[a], which were with her in the house[b], and put them on Jacob her younger son.
translation:
  language: ml
  text: പിന്നെ റിബെക്ക തന്റെ മൂത്ത മകനായ ഏശാവിന്റെ വിശിഷ്ടവസ്ത്രങ്ങൾ[a]—വീട്ടിൽ അവളുടെ പക്കൽ ഉണ്ടായിരുന്നവ[b]—എടുത്ത് തന്റെ ഇളയ മകനായ യാക്കോബിനെ ധരിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഏശാവിന്റെ ഏറ്റവും നല്ല വസ്ത്രങ്ങൾ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവൾ വീട്ടിൽ സൂക്ഷിച്ചിരുന്നവ’; എബ്രായത്തിൽ കൂടുതൽ അക്ഷരാർഥമായി, ‘വീട്ടിൽ അവളുടെ പക്കൽ ഉണ്ടായിരുന്നവ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: പിന്നെ ... എടുത്ത്
  rationale: വാവ്-തുടർച്ചാഘടകം കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘പിന്നെ’ വ്യക്തമാക്കുന്നു.
- source_word: בִּגְדֵי
  choice: വസ്ത്രങ്ങൾ
  rationale: വസ്ത്രസാമഗ്രികളെ സൂചിപ്പിക്കുന്ന സാധാരണവും മാന്യവുമായ മലയാളപദം.
- source_word: הַחֲמֻדֹת
  choice: വിശിഷ്ടവസ്ത്രങ്ങൾ
  rationale: മൂലപദത്തിലെ വിലമതിക്കപ്പെടുന്നതും അഭിലഷണീയവുമായ ഗുണം ‘വിശിഷ്ട’ എന്നത് അറിയിക്കുന്നു; ‘ഏറ്റവും നല്ല’ എന്നും അർഥമാക്കാം.
- source_word: בְּנָהּ הַגָּדֹל
  choice: തന്റെ മൂത്ത മകനായ
  rationale: കുടുംബസന്ദർഭത്തിൽ גָּדוֹל പ്രായത്തിൽ മൂത്തവനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ‘ഇളയ മകൻ’ എന്ന വിരുദ്ധസൂചനയുമായി ഇത് യോജിക്കുന്നു.
- source_word: אֲשֶׁר אִתָּהּ בַּבָּיִת
  choice: വീട്ടിൽ അവളുടെ പക്കൽ ഉണ്ടായിരുന്നവ
  rationale: സ്ഥലവും കൈവശവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗത്തെ അധിക വ്യാഖ്യാനം ചേർക്കാതെ അടുത്തായി പകർത്തുന്നു.
- source_word: וַתַּלְבֵּשׁ
  choice: ധരിപ്പിച്ചു
  rationale: മറ്റൊരാളെ വസ്ത്രം അണിയിക്കുക എന്ന സകർമക അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּנָהּ הַקָּטָן
  choice: തന്റെ ഇളയ മകനായ യാക്കോബിനെ
  rationale: קָטָן ഇവിടെ ശരീരവലുപ്പമല്ല, സഹോദരന്മാരിൽ പ്രായം കുറഞ്ഞവൻ എന്ന അർഥമാണ് നൽകുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘വസ്ത്രങ്ങൾ,’ ‘ധരിപ്പിച്ചു’ എന്നിവ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; മൂലത്തിലെ പ്രായവ്യത്യാസം ‘മൂത്ത/ഇളയ’ എന്ന ജോടിയിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
