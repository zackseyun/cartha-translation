translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. നേരിട്ടുള്ള വാക്കുകളിൽ മൂലപാഠത്തിലെ ശബ്ദവും കൈകളും തമ്മിലുള്ള വൈരുധ്യവും ആവർത്തനവും സംരക്ഷിച്ചിരിക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് പ്രധാനവാക്യത്തിന്റെ മറ്റൊരു ഇംഗ്ലീഷ് രൂപം മാത്രമായതിനാൽ മലയാള പ്രസിദ്ധീകരണത്തിൽ വേറൊരു അടിക്കുറിപ്പ് ആവശ്യമായില്ല.
