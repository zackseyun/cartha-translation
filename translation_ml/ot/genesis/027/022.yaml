source:
  edition: WLC
  text: וַ/יִּגַּ֧שׁ יַעֲקֹ֛ב אֶל יִצְחָ֥ק אָבִ֖י/ו וַ/יְמֻשֵּׁ֑/הוּ וַ/יֹּ֗אמֶר הַ/קֹּל֙ ק֣וֹל יַעֲקֹ֔ב וְ/הַ/יָּדַ֖יִם יְדֵ֥י עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/022.yaml
  text: So Jacob went near to Isaac his father[a], and he felt him and said, “The voice is Jacob’s voice, but the hands are Esau’s hands.”
translation:
  language: ml
  text: 'അങ്ങനെ യാക്കോബ് തന്റെ അപ്പനായ യിസ്ഹാക്കിന്റെ അടുത്തേക്കു ചെന്നു. യിസ്ഹാക്ക് അവനെ തൊട്ടുനോക്കി പറഞ്ഞു: “ശബ്ദം യാക്കോബിന്റെ ശബ്ദം; എന്നാൽ കൈകൾ ഏശാവിന്റെ കൈകളാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: അടുത്തേക്കു ചെന്നു
  rationale: നגשׁ എന്ന ക്രിയയുടെ ‘അടുത്തുവരുക/സമീപിക്കുക’ എന്ന അർഥവും ആഖ്യാനത്തിലെ ചലനവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיְמֻשֵּׁהוּ
  choice: അവനെ തപ്പിനോക്കിയിട്ട്
  rationale: തിരിച്ചറിയുന്നതിനുവേണ്ടി സ്പർശിച്ച് പരിശോധിക്കുന്ന പ്രവൃത്തിയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; ‘തൊട്ടു’ എന്നതിനെക്കാൾ ‘തപ്പിനോക്കി’ ആ ഉദ്ദേശ്യം വ്യക്തമായി നൽകുന്നു.
- source_word: הַקֹּל
  choice: ശബ്ദം
  rationale: קוֹל ഇവിടെ സംസാരിക്കുന്നയാളുടെ ശബ്ദത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ശബ്ദം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: קוֹל יַעֲקֹב
  choice: യാക്കോബിന്റെ ശബ്ദംതന്നെ
  rationale: എബ്രായ നിർമാണത്തിന്റെ ഉടമസ്ഥബന്ധവും തിരിച്ചറിയലിലെ ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְהַיָּדַיִם יְדֵי עֵשָׂו
  choice: എന്നാൽ കൈകൾ ഏശാവിന്റെ കൈകളാണ്
  rationale: എബ്രായത്തിലെ ലളിതമായ waw ഇവിടെ രണ്ടു തെളിവുകൾ തമ്മിലുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നു; ‘എന്നാൽ’ അത് മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു. ആവർത്തനവും നിലനിർത്തിയിരിക്കുന്നു.
- source_word: אָבִיו
  choice: തന്റെ അപ്പനായ
  rationale: മൂലപാഠത്തിലെ പിതൃബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു; ആഖ്യാനശൈലിയിൽ ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
