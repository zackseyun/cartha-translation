source:
  edition: WLC
  text: וְ/עַל חַרְבְּ/ךָ֣ תִֽחְיֶ֔ה וְ/אֶת אָחִ֖י/ךָ תַּעֲבֹ֑ד וְ/הָיָה֙ כַּ/אֲשֶׁ֣ר תָּרִ֔יד וּ/פָרַקְתָּ֥ עֻלּ֖/וֹ מֵ/עַ֥ל צַוָּארֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/040.yaml
  text: And by your sword you shall live[a], and you shall serve your brother; but when you break loose, you shall break his yoke from off your neck.
translation:
  language: ml
  text: നിന്റെ വാളുകൊണ്ടു നീ ജീവിക്കും; നിന്റെ സഹോദരനെ നീ സേവിക്കും. എന്നാൽ നീ കുതറിമാറുമ്പോൾ[a], അവന്റെ നുകം നിന്റെ കഴുത്തിൽനിന്ന് നീ ഒടിച്ചുകളയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നീ അസ്വസ്ഥനാകുമ്പോൾ.’ תָּרִיד എന്ന എബ്രായക്രിയയുടെ അർഥം നിശ്ചയിക്കാൻ പ്രയാസമാണ്. നുകം ഒടിച്ചുകളയുന്ന തുടർന്നുള്ള സന്ദർഭം ‘കുതറിമാറുമ്പോൾ’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു; എന്നാൽ ‘അസ്വസ്ഥനാകുമ്പോൾ’ എന്ന അർഥവും സാധ്യമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל חַרְבְּךָ תִחְיֶה
  choice: നിന്റെ വാളുകൊണ്ടു നീ ജീവിക്കും
  rationale: עַל ഇവിടെ ഉപാധിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വാളുകൊണ്ടു’ എന്നു നൽകി; חֶרֶב എന്ന മൂർത്തമായ ‘വാൾ’ പ്രതീകം നിലനിർത്തി. תִחְיֶה ഭാവിയിലെ ജീവിതരീതിയെ പ്രവചിക്കുന്നതായി ‘ജീവിക്കും’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וְאֶת אָחִיךָ תַּעֲבֹד
  choice: നിന്റെ സഹോദരനെ നീ സേവിക്കും
  rationale: עבד എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘സേവിക്കുക’ നിലനിർത്തുന്നു; കീഴ്പ്പെടലിന്റെ കൃത്യമായ രാഷ്ട്രീയരൂപം വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
- source_word: וְהָיָה כַּאֲשֶׁר
  choice: എന്നാൽ ...ുമ്പോൾ
  rationale: ഭാവിയിലെ സാഹചര്യത്തെയും അവസാന വാക്യഭാഗത്തിലെ വിപരീത തിരിവിനെയും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: תָּרִיד
  choice: നീ കുതറിമാറുമ്പോൾ
  rationale: ദുഷ്കരമായ ഈ ക്രിയയെ തുടർന്നുള്ള നുകം ഒടിച്ചുകളയുന്ന ദൃശ്യവുമായി ബന്ധപ്പെടുത്തി, ബലമായി നിയന്ത്രണത്തിൽനിന്നു വിടുതൽ നേടുന്ന അർഥത്തിൽ പരിഭാഷപ്പെടുത്തി. ‘അസ്വസ്ഥനാകുമ്പോൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וּפָרַקְתָּ עֻלּוֹ מֵעַל צַוָּארֶךָ
  choice: അവന്റെ നുകം നിന്റെ കഴുത്തിൽനിന്ന് നീ ഒടിച്ചുകളയും
  rationale: פרק എന്നതിലെ ശക്തമായ പൊട്ടിച്ചുമാറ്റൽ ‘ഒടിച്ചുകളയും’ എന്നു നൽകി; עֹל എന്ന മൂർത്തമായ ‘നുകം’ പ്രതീകവും കഴുത്തിൽനിന്നുള്ള നീക്കവും നിലനിർത്തി.
theological_decisions:
- issue: ഏശാവിന്റെ ഭാവിയിലെ യാക്കോബുമായുള്ള ബന്ധത്തിന്റെ സ്വഭാവം
  choice: സഹോദരനോടുള്ള കീഴ്പ്പെടലും പിന്നീട് അവന്റെ ആധിപത്യത്തിൽനിന്നുള്ള വിടുതലും സൂചിപ്പിക്കുന്ന ദൈവവചനമായി അവതരിപ്പിച്ചു.
  alternative: ഇത് സ്ഥിരമായ അടിമത്തമായോ കേവലം കുടുംബപരമായ ആദരവായോ വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: എബ്രായപാഠം സഹോദരനെ സേവിക്കുന്നതും പിന്നീട് അവന്റെ നുകം ഒടിച്ചുകളയുന്നതും പറയുന്നു. അതിനാൽ കീഴ്പ്പെടലും പിന്നീടുള്ള മോചനവും തമ്മിലുള്ള സംഘർഷം നിലനിർത്തി; ഏദോമിനെക്കുറിച്ചുള്ള പിൽക്കാല ദൈവശാസ്ത്രനിഗമനങ്ങൾ വാക്യത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വാൾ,’ ‘സേവിക്കുക,’ ‘നുകം,’ ‘കഴുത്ത്’ എന്നീ മൂർത്തമായ എബ്രായ ദൃശ്യങ്ങൾ സംരക്ഷിച്ചു. ‘കുതറിമാറുക’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ശക്തമായ പ്രതിരോധവും നിയന്ത്രണത്തിൽനിന്നുള്ള വിടുതലും സൂചിപ്പിക്കുന്നു.
