id: GEN.27.44
reference: Genesis 27:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יָשַׁבְתָּ֥ עִמּ֖/וֹ יָמִ֣ים אֲחָדִ֑ים עַ֥ד אֲשֶׁר תָּשׁ֖וּב חֲמַ֥ת אָחִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/044.yaml
  text: And stay with him for a few days[a], until your brother's fury turns away.
translation:
  language: ml
  text: നീ അവനോടൊപ്പം കുറച്ച് ദിവസങ്ങൾ താമസിക്കുക, നിന്റെ സഹോദരന്റെ ക്രോധം ശമിക്കുന്നതുവരെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: താമസിക്കുക
  rationale: ישׁב എന്ന ക്രിയയ്ക്ക് ‘ഇരിക്കുക, പാർക്കുക, താമസിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. ലാബാനോടൊപ്പം താൽക്കാലികമായി കഴിയാൻ റിബെക്ക യാക്കോബിനോടു പറയുന്ന സന്ദർഭത്തിൽ ‘താമസിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: עִמּוֹ
  choice: അവനോടൊപ്പം
  rationale: עם എന്ന ഉപസർഗവും മൂന്നാംപുരുഷ ഏകവചന പുൽലിംഗ പ്രത്യയവും ചേർന്ന് ‘അവനോടൊപ്പം’ എന്നാണ്; സമീപസന്ദർഭത്തിൽ ഇത് ലാബാനെ സൂചിപ്പിക്കുന്നു.
- source_word: יָמִים אֲחָדִים
  choice: കുറച്ചുനാൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘കുറച്ച് ദിവസങ്ങൾ’ എന്ന ഈ പ്രയോഗം താൽക്കാലികമായ ഒരു കാലയളവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കുറച്ചുനാൾ’ സ്വാഭാവികമായി അതേ ആശയം നൽകുന്നു; പിന്നീട് താമസം നീണ്ടുപോയെന്ന കഥാസാഹചര്യം ഇവിടെ മുൻകൂട്ടി ചേർത്തിട്ടില്ല.
- source_word: עַד אֲשֶׁר
  choice: വരെ
  rationale: പ്രവൃത്തിയുടെ സമയപരിധി സൂചിപ്പിക്കുന്ന സാധാരണ കാലസംബന്ധിയായ ഘടകമാണിത്; മലയാളത്തിൽ ‘-ുന്നതുവരെ’ എന്ന ഘടന യോജിക്കുന്നു.
- source_word: תָּשׁוּב
  choice: ശമിക്കുന്ന
  rationale: שׁוב എന്നതിന് അടിസ്ഥാനമായി ‘മടങ്ങുക/തിരിയുക’ എന്നാണ്. ക്രോധം കർത്താവാകുമ്പോൾ അതു കുറഞ്ഞുപോകുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായതിനാൽ ‘ശമിക്കുക’ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: חֲמַת
  choice: ക്രോധം
  rationale: חֵמָה ശക്തവും ജ്വലിക്കുന്നതുമായ കോപത്തെ സൂചിപ്പിക്കുന്നു. ‘ക്രോധം’ അതിന്റെ തീവ്രത നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ മാന്യവും പൊതുവേ മനസ്സിലാകുന്നതുമായ പദമാണ്.
- source_word: אָחִיךָ
  choice: നിന്റെ സഹോദരന്റെ
  rationale: സംയുക്തരൂപം ‘നിന്റെ സഹോദരന്റെ ക്രോധം’ എന്ന ഉടമസ്ഥബന്ധം ആവശ്യപ്പെടുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നിർദേശവാക്യം. ഹീബ്രുവിലെ ക്രോധം ‘മടങ്ങുക’ എന്ന ദൃശ്യരൂപം അക്ഷരാർഥത്തിൽ പകർത്താതെ, അതിന്റെ സന്ദർഭാർഥമായ ‘ശമിക്കുക’ ഉപയോഗിച്ചു. വ്യാഖ്യാനപരമായോ സഭാവിഭാഗപരമായോ പ്രത്യേകതകൾ ചേർത്തിട്ടില്ല.
