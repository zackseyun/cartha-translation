source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר הֲ/כִי֩ קָרָ֨א שְׁמ֜/וֹ יַעֲקֹ֗ב וַֽ/יַּעְקְבֵ֨/נִי֙ זֶ֣ה פַעֲמַ֔יִם אֶת בְּכֹרָתִ֣/י לָקָ֔ח וְ/הִנֵּ֥ה עַתָּ֖ה לָקַ֣ח בִּרְכָתִ֑/י וַ/יֹּאמַ֕ר הֲ/לֹא אָצַ֥לְתָּ לִּ֖/י בְּרָכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/036.yaml
  text: 'And he said[a], “Is he not rightly named Jacob? For he has supplanted me these two times: he took my birthright, and look, now he has taken my blessing.” And he said, “Have you not reserved a blessing for me?”'
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു[a]: “അവന് യാക്കോബ് എന്നു പേരിട്ടിരിക്കുന്നത് ഉചിതമായില്ലേ? അവൻ എന്നെ രണ്ടു പ്രാവശ്യം വഞ്ചിച്ചിരിക്കുന്നു: എന്റെ ആദ്യജാതാവകാശം അവൻ എടുത്തു; ഇതാ, ഇപ്പോൾ എന്റെ അനുഗ്രഹവും അവൻ എടുത്തിരിക്കുന്നു.” അവൻ പറഞ്ഞു: “എനിക്കായി ഒരു അനുഗ്രഹം അങ്ങ് മാറ്റിവെച്ചിട്ടില്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘യാക്കോബ്’ എന്ന പേരിനും ഇവിടെ ‘വഞ്ചിച്ചിരിക്കുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തിയ ക്രിയയ്ക്കും ഇടയിൽ വാക്കുകളിയുണ്ട്. ആ ക്രിയയ്ക്ക് ‘എന്നെ മറികടന്നിരിക്കുന്നു,’ ‘എന്നെ പിന്തള്ളിയിരിക്കുന്നു,’ അല്ലെങ്കിൽ ‘എന്നെ വഞ്ചിച്ചിരിക്കുന്നു’ എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי קָרָא שְׁמוֹ יַעֲקֹב
  choice: അവന് യാക്കോബ് എന്നു പേരിട്ടത് ശരിയല്ലേ?
  rationale: എശാവിന്റെ കയ്പേറിയ അലങ്കാരചോദ്യവും പിന്നാലെയുള്ള പേരിലെ വാക്കുകളിയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיַּעְקְבֵנִי
  choice: അവൻ എന്നെ പിന്നിലാക്കി
  rationale: യാക്കോബ് എന്ന പേരുമായുള്ള ശബ്ദ-അർത്ഥബന്ധം മലയാളത്തിൽ പൂർണമായി പുനരാവിഷ്കരിക്കാനാവില്ല. ‘പിന്നിലാക്കി’ എന്നത് മറ്റൊരാളുടെ സ്ഥാനം മറികടന്ന് നേട്ടം കൈവരിക്കുന്ന ആശയം നിലനിർത്തുന്നു; വഞ്ചിച്ചു എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: זֶה פַעֲמַיִם
  choice: ഇതോടെ രണ്ടുതവണ
  rationale: രണ്ട് സംഭവങ്ങളെ കണക്കാക്കി ഊന്നിപ്പറയുന്ന എബ്രായപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: בְּכֹרָתִי
  choice: എന്റെ ആദ്യജാതാവകാശം
  rationale: ആദ്യജാതന് ലഭിക്കുന്ന കുടുംബപരവും നിയമപരവുമായ അവകാശത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְהִנֵּה עַתָּה
  choice: ഇതാ, ഇപ്പോൾ
  rationale: എശാവിന്റെ വികാരഭരിതമായ ചൂണ്ടിക്കാട്ടൽ നിലനിർത്തുന്ന, വായനക്കാർക്ക് പരിചിതവും മാന്യവുമായ പ്രയോഗം.
- source_word: בִּרְכָתִי
  choice: എന്റെ അനുഗ്രഹം
  rationale: യിസ്ഹാക്കിന്റെ പിതൃപാരമ്പര്യ അനുഗ്രഹത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: הֲלֹא אָצַלְתָּ לִּי בְּרָכָה
  choice: എനിക്കായി ഒരു അനുഗ്രഹവും അങ്ങ് മാറ്റിവെച്ചിട്ടില്ലേ?
  rationale: אָצַל എന്ന ക്രിയയുടെ ‘ശേഷിപ്പിക്കുക/മാറ്റിവെക്കുക’ എന്ന സന്ദർഭാർഥവും എശാവിന്റെ അഭ്യർഥനയും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: യാക്കോബ് എന്ന പേരും וַיַּעְקְבֵנִי എന്ന ക്രിയയും തമ്മിലുള്ള വാക്കുകളി
  choice: മുഖ്യപാഠത്തിൽ ‘പിന്നിലാക്കി’; അടിക്കുറിപ്പിൽ ‘വഞ്ചിച്ചു/മറികടന്നു’ എന്നീ അർത്ഥസാധ്യതകൾ
  alternative: മുഖ്യപാഠത്തിൽ ‘വഞ്ചിച്ചു’ എന്നു മാത്രം നൽകുക
  rationale: എശാവിന്റെ ആരോപണത്തിലുള്ള അർത്ഥവ്യാപ്തിയും പേരുമായുള്ള വാക്കുകളിയും ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വികാരതീവ്രതയ്ക്കായി ‘ഇതാ’ നിലനിർത്തി; പിതാവിനോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു.
