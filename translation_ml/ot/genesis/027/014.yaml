id: GEN.27.14
reference: Genesis 27:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ֙ וַ/יִּקַּ֔ח וַ/יָּבֵ֖א לְ/אִמּ֑/וֹ וַ/תַּ֤עַשׂ אִמּ/וֹ֙ מַטְעַמִּ֔ים כַּ/אֲשֶׁ֖ר אָהֵ֥ב אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/014.yaml
  text: So he went and took them and brought them to his mother[a], and his mother prepared tasty food, just as his father loved.
translation:
  language: ml
  text: അങ്ങനെ അവൻ പോയി അവയെ എടുത്ത് തന്റെ അമ്മയുടെ അടുക്കൽ കൊണ്ടുവന്നു. അവന്റെ അമ്മ അവന്റെ അപ്പന് ഇഷ്ടമായിരുന്നതുപോലെ രുചികരമായ വിഭവങ്ങൾ തയ്യാറാക്കി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: അങ്ങനെ അവൻ പോയി
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തിലെ സംഭവക്രമം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അങ്ങനെ’ മുൻവാക്യത്തിലെ നിർദേശത്തോടുള്ള സ്വാഭാവിക ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקַּח
  choice: അവയെ പിടിച്ച്
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘എടുക്കുക/പിടിക്കുക’ എന്നാണ്. മുൻവാക്യത്തിലെ കോലാട്ടിൻകുട്ടികളാണ് സൂചിത കർമം; മലയാളത്തിൽ അത് ‘അവയെ’ എന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיָּבֵא לְאִמּוֹ
  choice: അമ്മയുടെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: בוא എന്ന ക്രിയയുടെ കാരണരൂപവും לְ എന്ന ഉപസർഗവും ചേർന്ന് ‘അമ്മയുടെ അടുക്കൽ കൊണ്ടുവന്നു’ എന്ന അർഥം നൽകുന്നു; സൂചിത കർമം മുൻസന്ദർഭത്തിൽനിന്ന് നിലനിർത്തുന്നു.
- source_word: וַתַּעַשׂ אִמּוֹ
  choice: അവന്റെ അമ്മ ... തയ്യാറാക്കി
  rationale: ഭക്ഷണത്തെ കർമമായി സ്വീകരിക്കുമ്പോൾ עשה എന്ന പൊതുവായ ‘ഉണ്ടാക്കുക’ എന്ന ക്രിയയ്ക്ക് ‘തയ്യാറാക്കി’ എന്നതാണ് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: מַטְעַמִּים
  choice: രുചികരമായ വിഭവങ്ങൾ
  rationale: ബഹുവചനരൂപത്തിലുള്ള ഈ പദം പ്രത്യേകം തയ്യാറാക്കിയ സ്വാദിഷ്ടഭക്ഷണങ്ങളെയോ വിഭവങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘രുചികരമായ വിഭവങ്ങൾ’ അർഥവും സംഖ്യയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר אָהֵב אָבִיו
  choice: അവന്റെ അപ്പന് ഇഷ്ടമായിരുന്നതുപോലെ
  rationale: אהב എന്നത് അക്ഷരാർഥത്തിൽ ‘സ്നേഹിക്കുക’ ആണെങ്കിലും ഭക്ഷണത്തോടുള്ള അഭിരുചി സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘ഇഷ്ടമായിരിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്; כַּאֲשֶׁר എന്നതിന്റെ താരതമ്യഭാവം ‘പോലെ’ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. കുടുംബസന്ദർഭത്തിന് സ്വാഭാവികമായ ‘അമ്മ’, ‘അപ്പൻ’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ സംഭവക്രമവും מַטְעַמִּים എന്ന ബഹുവചനവും നിലനിർത്തി.
