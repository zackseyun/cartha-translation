id: GEN.27.6
reference: Genesis 27:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/רִבְקָה֙ אָֽמְרָ֔ה אֶל יַעֲקֹ֥ב בְּנָ֖/הּ לֵ/אמֹ֑ר הִנֵּ֤ה שָׁמַ֨עְתִּי֙ אֶת אָבִ֔י/ךָ מְדַבֵּ֛ר אֶל עֵשָׂ֥ו אָחִ֖י/ךָ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/006.yaml
  text: And Rebekah said to Jacob her son[a], “Look, I heard your father speaking to Esau your brother, saying,”
translation:
  language: ml
  text: 'റിബെക്ക തന്റെ മകനായ യാക്കോബിനോടു പറഞ്ഞു: “നോക്കൂ, നിന്റെ അപ്പൻ നിന്റെ സഹോദരനായ ഏശാവിനോടു പറയുന്നത് ഞാൻ കേട്ടു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/רִבְקָה
  choice: റിബെക്ക
  rationale: വാക്യാരംഭത്തിലെ וְ കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനപ്രവാഹത്തിൽ പ്രത്യേകമായി ‘പിന്നെ’ എന്നു ചേർത്ത് കാലക്രമം വ്യാഖ്യാനിക്കാതെ വിട്ടിരിക്കുന്നു.
- source_word: אָמְרָה אֶל יַעֲקֹב בְּנָהּ
  choice: തന്റെ മകനായ യാക്കോബിനോടു പറഞ്ഞു
  rationale: യാക്കോബ് റിബെക്കയുടെ മകനാണെന്ന അനുബന്ധ തിരിച്ചറിയൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: തുടർന്നുവരുന്ന കാര്യത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന സ്വാഭാവികവും ആധുനികവുമായ പ്രയോഗം.
- source_word: שָׁמַעְתִּי
  choice: ഞാൻ കേട്ടു
  rationale: പൂർത്തിയായ കഴിഞ്ഞ സംഭവത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֶת אָבִיךָ
  choice: നിന്റെ അപ്പൻ
  rationale: കുടുംബസംഭാഷണത്തിലെ אָבִיךָയ്ക്ക് സാധാരണവും മാന്യവുമായ മലയാളരൂപം.
- source_word: מְדַבֵּר אֶל עֵשָׂו אָחִיךָ לֵאמֹר
  choice: നിന്റെ സഹോദരനായ ഏശാവിനോടു പറയുന്നത്
  rationale: പങ്ക്തിപദമായ מְדַבֵּרയുടെ തുടരുന്ന പ്രവൃത്തിഭാവവും അവസാനത്തെ לֵאמֹר അവതരിപ്പിക്കുന്ന ഉദ്ധരണിയും അനാവശ്യ ആവർത്തനമില്ലാതെ മലയാളത്തിൽ സ്വാഭാവികമായി കൈമാറുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കുടുംബസംഭാഷണ ശൈലി. അടുത്ത വാക്യത്തിൽ വരുന്ന ഉൾഉദ്ധരണിയിലേക്കു നയിക്കാൻ അവസാനത്തിൽ ദ്വിബിന്ദു ഉപയോഗിച്ചിരിക്കുന്നു.
