id: GEN.27.28
reference: Genesis 27:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יִֽתֶּן לְ/ךָ֙ הָ/אֱלֹהִ֔ים מִ/טַּל֙ הַ/שָּׁמַ֔יִם וּ/מִ/שְׁמַנֵּ֖י הָ/אָ֑רֶץ וְ/רֹ֥ב דָּגָ֖ן וְ/תִירֹֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/028.yaml
  text: May God give you some of the dew of heaven[a], and some of the richness of the earth, and an abundance of grain and new wine.
translation:
  language: ml
  text: ദൈവം നിനക്കു ആകാശത്തിലെ മഞ്ഞിൽനിന്നും ഭൂമിയുടെ സമൃദ്ധിയിൽനിന്നും ധാരാളം ധാന്യവും പുതുവീഞ്ഞും നൽകട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִתֶּן
  choice: നൽകുമാറാകട്ടെ
  rationale: ആശീർവാദസന്ദർഭത്തിലെ ആശംസാത്മക ക്രിയാഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הָאֱלֹהִים
  choice: ദൈവം
  rationale: നിശ്ചിത ദൈവനാമവിശേഷണമായി വരുന്ന എബ്രായപ്രയോഗത്തിന് സാധാരണ മലയാളത്തിലെ സ്വാഭാവിക തുല്യം.
- source_word: מִטַּל הַשָּׁמַיִם
  choice: ആകാശത്തിലെ മഞ്ഞിൽനിന്നും
  rationale: מִן എന്നതിന്റെ ഉറവിട/ഭാഗിക അർഥസാധ്യത നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളം നൽകുന്നു; 'മഞ്ഞ്' ഇവിടെ കൃഷിയെ പോഷിപ്പിക്കുന്ന പ്രഭാതമഞ്ഞാണ്.
- source_word: וּמִשְׁמַנֵּי הָאָרֶץ
  choice: ഭൂമിയുടെ സമൃദ്ധിയിൽനിന്നും
  rationale: ശാബ്ദികമായ 'കൊഴുപ്പ്' എന്ന കാർഷിക സമൃദ്ധിയുടെ രൂപകം ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി കൈമാറുന്നു.
- source_word: וְרֹב
  choice: ധാരാളം
  rationale: רֹב സൂചിപ്പിക്കുന്ന പെരുപ്പവും സമൃദ്ധിയും തുടർന്നുവരുന്ന രണ്ടു നാമങ്ങൾക്കും സ്വാഭാവികമായി ബാധകമാക്കുന്നു.
- source_word: דָּגָן
  choice: ധാന്യം
  rationale: പൊതുവായ ധാന്യവിളകളെ സൂചിപ്പിക്കുന്ന കൃത്യവും സമകാലികവുമായ മലയാളപദം.
- source_word: וְתִירֹשׁ
  choice: പുതുവീഞ്ഞ്
  rationale: സാധാരണ വീഞ്ഞിനേക്കാൾ പുതിയതോ പുതുതായി ലഭിച്ചതോ ആയ വീഞ്ഞിനെ സൂചിപ്പിക്കുന്ന പദഭേദം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഉച്ചാരണത്തിന്റെ സ്വഭാവം
  choice: ആശീർവാദാത്മകമായ ആശംസ ('നൽകുമാറാകട്ടെ')
  alternative: ലളിതമായ ഭാവികാല പ്രവചനം ('നൽകും')
  rationale: ക്രിയാരൂപവും യിസ്ഹാക്കിന്റെ ആശീർവാദസന്ദർഭവും ഇത് വെറും പ്രവചനമല്ല, ഉച്ചരിക്കപ്പെടുന്ന ആശീർവാദാശംസയാണെന്ന് സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആശീർവാദവചനത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. മഞ്ഞ്, ഭൂമിയുടെ സമൃദ്ധി എന്നീ കാർഷിക ദൃശ്യങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു.
