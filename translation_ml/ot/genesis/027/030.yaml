  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֨ר כִּלָּ֣ה יִצְחָק֮ לְ/בָרֵ֣ךְ אֶֽת יַעֲקֹב֒ וַ/יְהִ֗י אַ֣ךְ יָצֹ֤א יָצָא֙ יַעֲקֹ֔ב מֵ/אֵ֥ת פְּנֵ֖י יִצְחָ֣ק אָבִ֑י/ו וְ/עֵשָׂ֣ו אָחִ֔י/ו בָּ֖א מִ/צֵּידֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/030.yaml
  text: And it happened that as soon as Isaac had finished blessing Jacob[a], and Jacob had just gone out from the presence of Isaac his father[b], Esau his brother came in from his hunting.
translation:
  language: ml
  text: ഇസ്ഹാക്ക് യാക്കോബിനെ അനുഗ്രഹിച്ചു തീർന്നപ്പോൾ, യാക്കോബ് തന്റെ പിതാവായ ഇസ്ഹാക്കിന്റെ സന്നിധിയിൽനിന്ന് പുറത്തുപോയിട്ടേയുള്ളു; യാക്കോബിന്റെ സഹോദരനായ ഏശാവ് വേട്ടയിൽനിന്ന് മടങ്ങിവന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי ... וַיְהִי
  choice: '...തും ...തും ഒപ്പംതന്നെയായിരുന്നു; അപ്പോൾ'
  rationale: ആഖ്യാനത്തിലെ ആവർത്തിത സംഭവക്രമവും രണ്ട് സംഭവങ്ങൾക്കിടയിലെ അതിസമീപമായ സമയബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כַּאֲשֶׁר כִּלָּה ... לְבָרֵךְ
  choice: അനുഗ്രഹിച്ചു തീർന്നതും
  rationale: כלה + infinitive എന്ന ഘടന അനുഗ്രഹപ്രവൃത്തി പൂർത്തിയായതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘ചെയ്തു തീരുക’ അതിന് സ്വാഭാവിക സമാനമാണ്.
- source_word: אַךְ יָצֹא יָצָא
  choice: പുറപ്പെട്ടതും ഒപ്പംതന്നെയായിരുന്നു
  rationale: אַךְ എന്ന പദവും infinitive absolute + finite verb എന്ന ഊന്നൽഘടനയും യാക്കോബ് പുറപ്പെട്ട ഉടനെയുള്ള സംഭവമാണെന്ന് വ്യക്തമാക്കുന്നു; കൃത്രിമമായ പദാനുപദ ആവർത്തനം ഒഴിവാക്കി സമയസാമീപ്യം നിലനിർത്തുന്നു.
- source_word: מֵאֵת פְּנֵי
  choice: സന്നിധിയിൽനിന്ന്
  rationale: ‘മുഖത്തുനിന്ന്/സന്നിധിയിൽനിന്ന്’ എന്ന വ്യക്തിപരമായ സാന്നിധ്യബോധം സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: בָּא מִצֵּידוֹ
  choice: വേട്ട കഴിഞ്ഞ് മടങ്ങിവന്നു
  rationale: ציד ഇവിടെ വേട്ടയാടൽ എന്ന പ്രവർത്തനത്തെയോ വേട്ടയെയോ സൂചിപ്പിക്കാം. സാഹചര്യത്തിൽ ഏശാവ് വേട്ടയിൽനിന്ന് മടങ്ങിയെത്തുന്നതാണ് ഉദ്ദേശ്യം; ‘മടങ്ങിവന്നു’ ദിശാസൂചന സ്വാഭാവികമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. എബ്രായവാക്യത്തിലെ വേഗത്തിലുള്ള സംഭവക്രമവും യാക്കോബിന്റെ പുറപ്പെടലും ഏശാവിന്റെ വരവും തമ്മിലുള്ള അതിസമീപതയും വ്യക്തമായി സൂക്ഷിച്ചിട്ടുണ്ട്.
