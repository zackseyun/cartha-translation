revisions:
- from: ഇസ്ഹാക്ക് യാക്കോബിനെ അനുഗ്രഹിച്ചു തീർന്നതും, യാക്കോബ് തന്റെ പിതാവായ ഇസ്ഹാക്കിന്റെ സന്നിധിയിൽനിന്ന് പുറപ്പെട്ടതും ഒപ്പംതന്നെയായിരുന്നു; അപ്പോൾ അവന്റെ സഹോദരനായ ഏശാവ് വേട്ട കഴിഞ്ഞ് മടങ്ങിവന്നു.
  to: ഇസ്ഹാക്ക് യാക്കോബിനെ അനുഗ്രഹിച്ചു തീർന്നപ്പോൾ, യാക്കോബ് തന്റെ പിതാവായ ഇസ്ഹാക്കിന്റെ സന്നിധിയിൽനിന്ന് പുറത്തുപോയിട്ടേയുള്ളു; യാക്കോബിന്റെ സഹോദരനായ ഏശാവ് വേട്ടയിൽനിന്ന് മടങ്ങിവന്നു.
  rationale: The revision makes the Hebrew emphatic immediate sequence explicit without forcing a literal repetition. It also removes an ambiguity created by «ഒപ്പംതന്നെയായിരുന്നു» and retains the familial and personal-presence expressions in clear modern standard Malayalam.
