  to: 'യാക്കോബ് തന്റെ പിതാവിനോടു പറഞ്ഞു: “അങ്ങയുടെ ആദ്യജാതനായ ഏശാവാണ് ഞാൻ. അങ്ങ് എന്നോടു പറഞ്ഞതുപോലെ ഞാൻ ചെയ്തിരിക്കുന്നു. ദയവായി എഴുന്നേൽക്കുക, ഇരിക്കുക, ഞാൻ വേട്ടയാടിയ ഭക്ഷണം ഭക്ഷിക്കണമേ; അങ്ങ് എന്നെ അനുഗ്രഹിക്കേണ്ടതിന്[a].”'
  rationale: The revision removes the unexpressed detail ‘brought,’ renders the purpose clause explicitly, and retains the idiomatic Malayalam treatment of the Hebrew נפשׁ while preserving its literal form in the footnote. It keeps the source’s sequential commands, Jacob’s deception, and respectful address intact.
