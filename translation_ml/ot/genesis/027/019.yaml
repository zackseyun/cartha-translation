source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יַעֲקֹ֜ב אֶל אָבִ֗י/ו אָנֹכִי֙ עֵשָׂ֣ו בְּכֹרֶ֔/ךָ עָשִׂ֕יתִי כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתָּ אֵלָ֑/י קֽוּם נָ֣א שְׁבָ֗/ה וְ/אָכְלָ/ה֙ מִ/צֵּידִ֔/י בַּ/עֲב֖וּר תְּבָרֲכַ֥/נִּי נַפְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/019.yaml
  text: And Jacob said to his father[a], “I am Esau your firstborn. I have done as you told me. Please rise, sit, and eat from my game[b], so that your soul may bless me.”
translation:
  language: ml
  text: 'യാക്കോബ് തന്റെ പിതാവിനോടു പറഞ്ഞു: “അങ്ങയുടെ ആദ്യജാതനായ ഏശാവാണ് ഞാൻ. അങ്ങ് എന്നോടു പറഞ്ഞതുപോലെ ഞാൻ ചെയ്തിരിക്കുന്നു. ദയവായി എഴുന്നേൽക്കുക, ഇരിക്കുക, ഞാൻ വേട്ടയാടിയ ഭക്ഷണം ഭക്ഷിക്കണമേ; അങ്ങ് എന്നെ അനുഗ്രഹിക്കേണ്ടതിന്[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അങ്ങയുടെ പ്രാണൻ എന്നെ അനുഗ്രഹിക്കട്ടെ.” ഇവിടെ “പ്രാണൻ” എന്നു പരിഭാഷപ്പെടുത്താവുന്ന ഹീബ്രു പദം വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ശൈലിപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב אֶל אָבִיו
  choice: യാക്കോബ് തന്റെ പിതാവിനോടു പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ പ്രത്യേകമായി ‘അപ്പോൾ’ ചേർക്കാതെ സ്വാഭാവികമായ ആഖ്യാനക്രമം നിലനിർത്തുന്നു. אֶל אָבִיו എന്നത് ‘തന്റെ പിതാവിനോട്’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: אָנֹכִי עֵשָׂו בְּכֹרֶךָ
  choice: അങ്ങയുടെ ആദ്യജാതനായ ഏശാവാണ് ഞാൻ
  rationale: വാക്യത്തിലെ തിരിച്ചറിയൽപ്രസ്താവനയും ‘ആദ്യജാതൻ’ എന്ന സ്ഥാനത്തിന്റെ പ്രാധാന്യവും നിലനിർത്തുന്നു; യാക്കോബിന്റെ വഞ്ചനാപരമായ അവകാശവാദം മയപ്പെടുത്തുന്നില്ല.
- source_word: עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: അങ്ങ് എന്നോടു പറഞ്ഞതുപോലെ ഞാൻ ചെയ്തിരിക്കുന്നു
  rationale: ‘എന്നോട് സംസാരിച്ചതുപോലെ’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘പറഞ്ഞതുപോലെ’ ഉപയോഗിച്ചു; പൂർത്തിയായ പ്രവൃത്തിയുടെ ഫലം ഇപ്പോഴും പ്രസക്തമാണെന്ന ഭാവം ‘ചെയ്തിരിക്കുന്നു’ നൽകുന്നു.
- source_word: קוּם נָא שְׁבָה
  choice: ദയവായി എഴുന്നേറ്റ് ഇരുന്ന്
  rationale: נָא യിലെ വിനീതമായ അപേക്ഷ ‘ദയവായി’ എന്നതിലൂടെ പ്രകടമാക്കി. തുടർച്ചയായ രണ്ട് ആജ്ഞകളായ ‘എഴുന്നേൽക്കുക, ഇരിക്കുക’ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു; പ്രത്യക്ഷമായ വൈരുധ്യം നീക്കി അർഥം മാറ്റിയിട്ടില്ല.
- source_word: וְאָכְלָה מִצֵּידִי
  choice: ഞാൻ വേട്ടയാടിക്കൊണ്ടുവന്ന മാംസം ഭക്ഷിക്കണമേ
  rationale: צַיִד ഇവിടെ വേട്ടയാടി ലഭിച്ച ഭക്ഷണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘എന്റെ വേട്ട’ എന്നതിനെക്കാൾ ‘ഞാൻ വേട്ടയാടിക്കൊണ്ടുവന്ന മാംസം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בַּעֲבוּר
  choice: അങ്ങനെ
  rationale: തുടർന്നുവരുന്ന അനുഗ്രഹം ഉദ്ദേശ്യമായാണെന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: അങ്ങുതന്നെ എന്നെ അനുഗ്രഹിക്കട്ടെ
  rationale: נֶפֶשׁ ഇവിടെ വേർതിരിച്ച ആത്മഘടകത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയല്ല; വ്യക്തിയെത്തന്നെ ഊന്നിപ്പറയുന്ന ഹീബ്രു ശൈലിയാണ്. ‘അങ്ങുതന്നെ’ ആ ഊന്നൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
theological_decisions:
- issue: תְּבָרֲכַנִּי נַפְשֶׁךָ എന്നതിലെ נַפְשֶׁךָയുടെ വിവർത്തനം
  choice: അങ്ങുതന്നെ എന്നെ അനുഗ്രഹിക്കട്ടെ
  alternative: അങ്ങയുടെ പ്രാണൻ എന്നെ അനുഗ്രഹിക്കട്ടെ
  rationale: ഈ സന്ദർഭത്തിൽ נֶפֶשׁ വ്യക്തിയെയോ സ്വയത്തെയോ സൂചിപ്പിക്കുന്ന ശൈലിപ്രയോഗമാണ്. ‘പ്രാണൻ’ എന്ന് മുഖ്യപാഠത്തിൽ അക്ഷരാർഥമായി കൊടുത്താൽ മനുഷ്യസ്വഭാവത്തെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തപ്രസ്താവനയായി തെറ്റിദ്ധരിക്കപ്പെടാം. ‘അങ്ങുതന്നെ’ അർഥവും ഊന്നലും നിലനിർത്തുന്നു; അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. പിതാവിനോടുള്ള ആദരസൂചകമായി ‘അങ്ങ്’ സ്വീകരിച്ചു. ‘ആദ്യജാതൻ’ എന്ന പദം സന്ദർഭത്തിലെ കുടുംബ-അവകാശ പ്രാധാന്യം സംരക്ഷിക്കുന്നു. ആജ്ഞകൾ വിനീതമായ അപേക്ഷയായി കേൾക്കാൻ ‘ദയവായി’യും ‘ഭക്ഷിക്കണമേ’യും ഉപയോഗിച്ചു.
