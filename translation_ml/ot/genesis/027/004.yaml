reference: Genesis 27:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/עֲשֵׂה לִ֨/י מַטְעַמִּ֜ים כַּ/אֲשֶׁ֥ר אָהַ֛בְתִּי וְ/הָבִ֥יאָ/ה לִּ֖/י וְ/אֹכֵ֑לָה בַּ/עֲב֛וּר תְּבָרֶכְ/ךָ֥ נַפְשִׁ֖/י בְּ/טֶ֥רֶם אָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/004.yaml
  text: Prepare for me tasty food[a], just as I love, and bring it to me, that I may eat[c][b], so that my soul may bless you before I die.
translation:
  language: ml
  text: എനിക്കിഷ്ടമുള്ളതുപോലെ രുചികരമായ ഭക്ഷണം[a] എനിക്കായി ഒരുക്കി എന്റെ അടുക്കൽ കൊണ്ടുവരിക; ഞാൻ അത് ഭക്ഷിക്കാനായി, ഞാൻ മരിക്കുന്നതിനുമുമ്പ് നിന്നെ അനുഗ്രഹിക്കാനായി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വാദിഷ്ടമായ വിഭവം’ അല്ലെങ്കിൽ ‘വിശിഷ്ടഭക്ഷണം.’
    reason: lexical_alternative
  - marker: b
    text: 'ഹീബ്രു: ‘എന്റെ പ്രാണൻ നിന്നെ അനുഗ്രഹിക്കേണ്ടതിന്.’ ഇവിടെ ‘എന്റെ പ്രാണൻ’ എന്നത് യിസ്ഹാക്കിനെ അവന്റെ സമഗ്ര വ്യക്തിത്വത്തിൽ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: ഒരുക്കി
  rationale: עשה എന്ന പൊതുവായ ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്ന ക്രിയ പാചകസന്ദർഭത്തിൽ സ്വാഭാവികമായി ‘ഒരുക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מַטְעַמִּים
  choice: രുചികരമായ ഭക്ഷണം
  rationale: പ്രത്യേകം തയ്യാറാക്കിയ സ്വാദിഷ്ടമായ ഭക്ഷണത്തെയാണ് ബഹുവചനരൂപത്തിലുള്ള ഈ പദം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഇവിടെ ഏകവചന സമാഹാരനാമം സ്വാഭാവികമാണ്.
- source_word: כַּאֲשֶׁר אָהַבְתִּי
  choice: ഞാൻ ഇഷ്ടപ്പെടുന്നതുപോലെയുള്ള
  rationale: യിസ്ഹാക്കിന്റെ വ്യക്തിപരമായ ഭക്ഷണാഭിരുചി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം ഉപയോഗിച്ചു.
- source_word: וְהָבִיאָה לִּי
  choice: എന്റെ അടുക്കൽ കൊണ്ടുവരിക
  rationale: സംസാരിക്കുന്നവന്റെ അടുത്തേക്കുള്ള ചലനം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; לִי എന്നത് സന്ദർഭാനുസൃതമായി ‘എന്റെ അടുക്കൽ’ എന്നു നൽകി.
- source_word: וְאֹכֵלָה
  choice: ഞാൻ അതു ഭക്ഷിക്കട്ടെ
  rationale: ഹീബ്രു കോഹോർട്ടേറ്റീവിന്റെ ഉദ്ദേശ്യാത്മക ഭാവം ഒരു ലളിത ഭാവികാലമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: בַּעֲבוּר
  choice: അങ്ങനെ
  rationale: തുടർന്നുള്ള അനുഗ്രഹം മുൻപ്രവൃത്തികളുടെ ലക്ഷ്യമാണെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: എന്റെ പ്രാണൻ നിന്നെ അനുഗ്രഹിക്കട്ടെ
  rationale: נַפְשִׁי എന്ന വ്യക്തമായ കർത്താവിനെ ഒഴിവാക്കി വെറും ‘ഞാൻ’ എന്നു ലളിതമാക്കാതെ, വ്യക്തിയുടെ സമഗ്രസ്വത്വത്തെ സൂചിപ്പിക്കുന്ന ഉറവിടരൂപം സംരക്ഷിച്ചു.
- source_word: בְּטֶרֶם אָמוּת
  choice: ഞാൻ മരിക്കുന്നതിനുമുമ്പ്
  rationale: ഹീബ്രു കാലവാക്യത്തെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: נַפְשִׁי എന്ന പദത്തിന്റെ അവതരണം
  choice: എന്റെ പ്രാണൻ
  alternative: ഞാൻ
  rationale: ഇത് യിസ്ഹാക്കിന്റെ ഉള്ളിലുള്ള വേറിട്ട ഒരു ഘടകം മാത്രം അനുഗ്രഹിക്കുന്നു എന്ന സാങ്കേതിക വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല; എന്നിരുന്നാലും ഉറവിടത്തിലെ ശക്തമായ വ്യക്തിപരമായ പ്രയോഗം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. വാക്യത്തിന്റെ പ്രവർത്തനക്രമവും ലക്ഷ്യബന്ധവും നിലനിർത്താൻ അർധവിരാമവും ‘അങ്ങനെ’ എന്ന ബന്ധകവും ചേർത്തു; ഹീബ്രുവിലെ കോഹോർട്ടേറ്റീവ് ഭാവം രണ്ടു സ്ഥലത്തും ‘-ട്ടെ’ രൂപത്തിൽ സൂക്ഷിച്ചു.
