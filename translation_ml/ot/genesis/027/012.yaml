id: GEN.27.12
reference: Genesis 27:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אוּלַ֤י יְמֻשֵּׁ֨/נִי֙ אָבִ֔/י וְ/הָיִ֥יתִי בְ/עֵינָ֖י/ו כִּ/מְתַעְתֵּ֑עַ וְ/הֵבֵאתִ֥י עָלַ֛/י קְלָלָ֖ה וְ/לֹ֥א בְרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/012.yaml
  text: Perhaps my father will feel me[a], and I will seem to him like a deceiver[b], and I will bring a curse on myself and not a blessing.
translation:
  language: ml
  text: ഒരുപക്ഷേ എന്റെ അപ്പൻ എന്നെ തൊട്ടുനോക്കും[a]. അപ്പോൾ ഞാൻ അദ്ദേഹത്തിന് ഒരു വഞ്ചകനെപ്പോലെ[b] തോന്നും; അങ്ങനെ ഞാൻ അനുഗ്രഹമല്ല, ശാപംതന്നെ എന്റെമേൽ വരുത്തിവെക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എന്നെ കൈകൊണ്ട് പരിശോധിക്കും.’ എബ്രായക്രിയ സ്പർശിച്ചറിവുന്നതിനെ സൂചിപ്പിക്കുന്നു; യിസ്ഹാക്ക് യാക്കോബിന്റെ വ്യക്തിത്വം സ്പർശനത്തിലൂടെ പരിശോധിക്കുന്ന സന്ദർഭത്തിന് ഇത് യോജിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘പരിഹസിക്കുന്നവനെപ്പോലെ’ അല്ലെങ്കിൽ ‘കബളിപ്പിക്കുന്നവനെപ്പോലെ.’ ഒരാളെ തെറ്റിദ്ധരിപ്പിക്കുകയോ വിഡ്ഢിയാക്കുകയോ ചെയ്യുന്നവനെ ഈ എബ്രായപദം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: ഒരുപക്ഷേ
  rationale: യാക്കോബിന്റെ ആശങ്ക നിറഞ്ഞ സാധ്യതയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും അനിശ്ചിതത്വം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יְמֻשֵּׁנִי
  choice: എന്നെ തൊട്ടുനോക്കും
  rationale: משש എന്ന ക്രിയ കൈകൊണ്ട് തൊട്ട് തിരിച്ചറിയുന്നതിനെ സൂചിപ്പിക്കുന്നു. യിസ്ഹാക്ക് യാക്കോബിന്റെ വ്യക്തിത്വം സ്പർശനത്തിലൂടെ പരിശോധിക്കുന്ന സന്ദർഭത്തിന് ‘തൊട്ടുനോക്കും’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אָבִי
  choice: എന്റെ അപ്പൻ
  rationale: കുടുംബസംഭാഷണത്തിലെ സ്വാഭാവികതയും മൂലപാഠത്തിലെ ഒന്നാംപുരുഷ ഉടമസ്ഥബന്ധവും നിലനിർത്തുന്നു.
- source_word: וְהָיִיתִי בְעֵינָיו
  choice: അപ്പോൾ ഞാൻ അദ്ദേഹത്തിന് ... തോന്നും
  rationale: ‘അവന്റെ കണ്ണുകളിൽ’ എന്ന എബ്രായ പ്രയോഗം അദ്ദേഹത്തിന്റെ കാഴ്ചപ്പാടിലോ വിലയിരുത്തലിലോ എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ ‘അദ്ദേഹത്തിന് ... തോന്നും’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כִּמְתַעְתֵּעַ
  choice: ഒരു വഞ്ചകനെപ്പോലെ
  rationale: മറ്റൊരാളെ തെറ്റിദ്ധരിപ്പിക്കുകയോ കബളിപ്പിക്കുകയോ ചെയ്യുന്നവൻ എന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു; പരിഹസിക്കുന്നവൻ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְהֵבֵאתִי עָלַי
  choice: എന്റെമേൽ വരുത്തിവെക്കും
  rationale: Hiphil രൂപത്തിന്റെ കാരണാർഥവും ‘തന്റെമേൽ കൊണ്ടുവരുക’ എന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: קְלָלָה וְלֹא בְרָכָה
  choice: അനുഗ്രഹമല്ല, ശാപംതന്നെ
  rationale: മൂലപാഠത്തിലെ അനുഗ്രഹം–ശാപം വിരോധം ശക്തവും സ്വാഭാവികവുമായ മലയാളഘടനയിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: כִּמְתַעְתֵּעַ എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: ഒരു വഞ്ചകനെപ്പോലെ
  alternative: പരിഹസിക്കുന്നവനെപ്പോലെ / കബളിപ്പിക്കുന്നവനെപ്പോലെ
  rationale: ഈ സന്ദർഭത്തിൽ യാക്കോബ് തന്റെ വേഷം കണ്ടെത്തപ്പെടുമെന്നും താൻ വഞ്ചകനായി കാണപ്പെടുമെന്നും ഭയപ്പെടുന്നു. എങ്കിലും പരിഹാസം അല്ലെങ്കിൽ ഒരാളെ വിഡ്ഢിയാക്കൽ എന്ന സൂക്ഷ്മത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കുടുംബസന്ദർഭത്തിൽ ‘അപ്പൻ’ ഉപയോഗിച്ചു; പിതാവിനെ സൂചിപ്പിക്കുമ്പോൾ ‘അദ്ദേഹത്തിന്’ എന്ന ആദരസൂചക രൂപം സ്വീകരിച്ചു. വാക്യത്തിലെ ആശങ്കയും അനുഗ്രഹം–ശാപം വിരോധവും വ്യക്തമായി നിലനിർത്തി.
