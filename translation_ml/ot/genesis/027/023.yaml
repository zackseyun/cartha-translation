  text: וְ/לֹ֣א הִכִּיר֔/וֹ כִּֽי הָי֣וּ יָדָ֗י/ו כִּ/ידֵ֛י עֵשָׂ֥ו אָחִ֖י/ו שְׂעִרֹ֑ת וַֽ/יְבָרְכֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/023.yaml
  text: And he did not recognize him[a], because his hands were hairy like the hands of his brother Esau; so he blessed him.
translation:
  language: ml
  text: യാക്കോബിന്റെ കൈകൾ അവന്റെ സഹോദരനായ ഏശാവിന്റെ കൈകൾപോലെ രോമാവൃതമായിരുന്നതിനാൽ, യിസ്ഹാക്ക് അവനെ തിരിച്ചറിഞ്ഞില്ല; അതുകൊണ്ട് അവനെ അനുഗ്രഹിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നിട്ട് അവനെ അനുഗ്രഹിച്ചു.” എബ്രായ കഥനരൂപം ലളിതമായ സംഭവക്രമമായി പരിഭാഷപ്പെടുത്താം; ഇവിടെ അത് ഫലബന്ധവും സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכִּירוֹ
  choice: അവനെ തിരിച്ചറിഞ്ഞില്ല
  rationale: הִכִּיר എന്ന ഹിഫിൽ രൂപം ഇവിടെ സ്പർശത്തിലൂടെ യാക്കോബിനെ തിരിച്ചറിയുന്നതിൽ യിസ്ഹാക്ക് പരാജയപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു; ‘തിരിച്ചറിഞ്ഞില്ല’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: כִּי
  choice: ആയിരുന്നതിനാൽ
  rationale: ഇവിടെ כִּי തിരിച്ചറിയാതിരുന്നതിനുള്ള കാരണം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ കാരണബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יָדָיו
  choice: അവന്റെ കൈകൾ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ ബഹുവചന നാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ; സന്ദർഭത്തിൽ ഇത് യാക്കോബിന്റെ കൈകളെ സൂചിപ്പിക്കുന്നു.
- source_word: כִּידֵי
  choice: കൈകൾപോലെ
  rationale: כְּ എന്ന ഉപസർഗം താരതമ്യം സൂചിപ്പിക്കുന്നു; ‘കൈകൾപോലെ’ ആ ഉപമ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אָחִיו
  choice: അവന്റെ സഹോദരനായ
  rationale: ബന്ധസൂചക പദവും മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയവും കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: שְׂעִרֹת
  choice: രോമമുള്ളവ
  rationale: കൈകളുടെ സ്പർശസ്വഭാവം വിവരിക്കുന്ന വിശേഷണം; വഞ്ചനയിൽ നിർണായകമായ രോമാവൃതത വ്യക്തമായി നൽകുന്നു.
- source_word: וַיְבָרְכֵהוּ
  choice: അതുകൊണ്ട് അവനെ അനുഗ്രഹിച്ചു
  rationale: വാവ്-തുടർച്ച കഥയുടെ ക്രമം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ഇവിടെ മുൻവാക്യത്തിന്റെ ഫലസൂചനയും ഉള്ളതിനാൽ ‘അതുകൊണ്ട്’ യോജിക്കുന്നു, എന്നാൽ ലളിതമായ അനുക്രമവായനയും സാധ്യമാണ്.
