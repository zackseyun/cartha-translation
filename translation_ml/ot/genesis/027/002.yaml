source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר הִנֵּה נָ֖א זָקַ֑נְתִּי לֹ֥א יָדַ֖עְתִּי י֥וֹם מוֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/002.yaml
  text: And he said, “Look now, I have grown old; I do not know the day of my death.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഇതാ, എനിക്കു പ്രായമായി; ഞാൻ മരിക്കുന്ന ദിവസം ഏതെന്ന് എനിക്കറിയില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּהയും പ്രസ്താവനയെ മൃദുവാക്കുന്ന נָאയും ചേർന്ന പ്രയോഗം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: זָקַנְתִּי
  choice: എനിക്കു പ്രായമായി
  rationale: ‘ഞാൻ വൃദ്ധനായിരിക്കുന്നു’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ രൂപത്തേക്കാൾ സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വാർധക്യത്തിലെത്തിയെന്ന അർഥം നൽകുന്നു.
- source_word: לֹא יָדַעְתִּי
  choice: എനിക്കറിയില്ല
  rationale: ഹീബ്രു പൂർണക്രിയ ഇവിടെ നിലവിലെ അറിവില്ലായ്മയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ വർത്തമാനപ്രയോഗം അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יוֹם מוֹתִי
  choice: ഞാൻ മരിക്കുന്ന ദിവസം
  rationale: അക്ഷരാർഥത്തിലെ ‘എന്റെ മരണദിവസം’ എന്നതിന്റെ അർഥം വ്യക്തവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ അനിശ്ചിതത്വമോ ദൈവശാസ്ത്രപരമായ സംഘർഷമോ ഇവിടെ പ്രത്യേകമായി ഇല്ല; അധിക വിശദീകരണം ചേർത്തിട്ടില്ല.
