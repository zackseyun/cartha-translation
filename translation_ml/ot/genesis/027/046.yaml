id: GEN.27.46
reference: Genesis 27:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר רִבְקָה֙ אֶל יִצְחָ֔ק קַ֣צְתִּי בְ/חַיַּ֔/י מִ/פְּנֵ֖י בְּנ֣וֹת חֵ֑ת אִם לֹקֵ֣חַ יַ֠עֲקֹב אִשָּׁ֨ה מִ/בְּנֽוֹת חֵ֤ת כָּ/אֵ֨לֶּה֙ מִ/בְּנ֣וֹת הָ/אָ֔רֶץ לָ֥/מָּה לִּ֖/י חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/046.yaml
  text: Then Rebekah said to Isaac[a], “I am weary of my life because of the daughters of Heth. If Jacob takes a wife from the daughters of Heth like these, from the daughters of the land, what is life to me?”
translation:
  language: ml
  text: 'അപ്പോൾ റിബെക്കാ യിസ്ഹാക്കിനോടു പറഞ്ഞു: “ഹേത്തിന്റെ പുത്രിമാർ[a] നിമിത്തം എനിക്ക് എന്റെ ജീവിതം മടുത്തു. യാക്കോബ് ഹേത്തിന്റെ പുത്രിമാരിൽനിന്ന്, ഈ ദേശത്തിലെ പുത്രിമാരിൽനിന്ന്, ഇവരെപ്പോലെയുള്ള ഒരാളെ ഭാര്യയായി സ്വീകരിച്ചാൽ, എനിക്ക് ജീവിതംകൊണ്ട് എന്തു കാര്യം?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഹിത്യസ്ത്രീകൾ” അല്ലെങ്കിൽ “ഹിത്യരുടെ പുത്രിമാർ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַצְתִּי בְחַיַּי
  choice: എനിക്ക് എന്റെ ജീവിതം മടുത്തു
  rationale: ജീവിതത്തോടുതന്നെയുള്ള കടുത്ത മടുപ്പും വെറുപ്പും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും ശക്തവുമായ മലയാളരൂപം.
- source_word: מִפְּנֵי
  choice: നിമിത്തം
  rationale: ഇവിടെ സ്ഥലബന്ധമല്ല, കാരണമാണ് സൂചിപ്പിക്കുന്നത്; ‘നിമിത്തം’ ഗൗരവമുള്ള ആധുനിക മലയാളത്തിൽ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: בְּנוֹת חֵת
  choice: ഹേത്തിന്റെ പുത്രിമാർ
  rationale: ‘ഹേത്തിന്റെ പുത്രിമാർ’ എന്ന വംശബന്ധപരമായ മൂലപ്രയോഗം നിലനിർത്തുന്നു; ‘ഹിത്യസ്ത്രീകൾ’ എന്ന വ്യാഖ്യാനപരമായ രൂപത്തിലേക്ക് മാറ്റുന്നില്ല.
- source_word: אִם לֹקֵחַ יַעֲקֹב אִשָּׁה
  choice: യാക്കോബ് ... ഒരു ഭാര്യയെ ... സ്വീകരിച്ചാൽ
  rationale: വിവാഹത്തെ സൂചിപ്പിക്കുന്ന ‘ഭാര്യയെ എടുക്കുക’ എന്ന എബ്രായ ശൈലി മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ‘ഭാര്യയെ സ്വീകരിക്കുക’ എന്നു നൽകി.
- source_word: כָּאֵלֶּה
  choice: ഇവരെപ്പോലെയുള്ള
  rationale: ഇതിനുമുമ്പ് പരാമർശിക്കപ്പെട്ട സ്ത്രീകളെ ചൂണ്ടിക്കാണിക്കുന്ന പ്രകടമായ സൂചന സംരക്ഷിക്കുന്നു.
- source_word: מִבְּנוֹת הָאָרֶץ
  choice: ഈ ദേശത്തിലെ പുത്രിമാരിൽനിന്ന്
  rationale: മൂലത്തിലെ ‘ദേശത്തിന്റെ പുത്രിമാർ’ എന്ന സമാന്തര വംശ-സാമൂഹിക പ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לָמָּה לִּי חַיִּים
  choice: പിന്നെ എനിക്ക് ജീവിതം എന്തിന്?
  rationale: ജീവിതം അർഥശൂന്യമാകുമെന്ന വാചാലചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘എന്തു പ്രയോജനം’ എന്ന ആശയം വിശദമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: חֵת എന്ന വംശനാമത്തിന്റെ അവതരണം
  choice: ഹേത്തിന്റെ പുത്രിമാർ
  alternative: ഹിത്യസ്ത്രീകൾ / ഹിത്യരുടെ പുത്രിമാർ
  rationale: മൂലത്തിലെ വ്യക്തിനാമവും കുടുംബവംശരൂപവും പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായ ജനവിഭാഗനാമം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: അവസാന വാചാലചോദ്യത്തിന്റെ അർഥവ്യാപ്തി
  choice: പിന്നെ എനിക്ക് ജീവിതം എന്തിന്?
  alternative: പിന്നെ ജീവിതംകൊണ്ട് എനിക്ക് എന്തു പ്രയോജനം? / എനിക്ക് ജീവിതം എന്താണ്?
  rationale: ലָמָּה എന്ന ‘എന്തിന്/എന്തുകൊണ്ട്’ എന്ന ചോദ്യശക്തിയും ജീവിതവിരക്തിയുടെ സംഘർഷവും നിലനിർത്തി, ‘good’ എന്ന ആശയം തുറന്നുപറഞ്ഞ് ചേർക്കാതെ സ്വാഭാവിക മലയാളം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി. ആവർത്തനവും ‘പുത്രിമാർ’ എന്ന വംശപരമായ ഭാഷയും മൂലപാഠത്തിന്റെ ഘടനയ്ക്കായി നിലനിർത്തിയിരിക്കുന്നു.
