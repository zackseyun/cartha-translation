source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֵלָ֖י/ו יִצְחָ֣ק אָבִ֑י/ו גְּשָׁ/ה נָּ֥א וּ/שְׁקָ/ה לִּ֖/י בְּנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/026.yaml
  text: Then his father Isaac said to him[a], “Come near, please, and kiss me, my son.”
translation:
  language: ml
  text: 'അപ്പോൾ അവന്റെ പിതാവായ യിസ്ഹാക്ക് അവനോടു പറഞ്ഞു: “എന്റെ മകനേ, ദയവായി അടുത്തേക്കു വന്ന് എന്നെ ചുംബിക്കൂ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആഖ്യാനക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: אֵלָיו
  choice: അവനോടു
  rationale: സംസാരത്തിന്റെ പരോക്ഷ കർമത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പൂർവപ്രത്യയവും സർവനാമപ്രത്യയവും സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ വരുന്നു.
- source_word: יִצְחָק אָבִיו
  choice: അവന്റെ അപ്പനായ യിസ്ഹാക്ക്
  rationale: എബ്രായത്തിലെ ബന്ധസൂചകമായ സമാനാധികരണഘടനയും കുടുംബബന്ധത്തിലെ ഊന്നലും നിലനിർത്തുന്നു; വ്യക്തിനാമം പതിവ് മലയാള ബൈബിൾ രൂപത്തിൽ നൽകി.
- source_word: גְּשָׁה
  choice: അടുത്തുവന്ന്
  rationale: ശാരീരികമായി അടുത്തേക്കു വരാനുള്ള ആജ്ഞയാണ് സന്ദർഭത്തിൽ; പിന്നാലെയുള്ള ചുംബനാവശ്യവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു.
- source_word: נָא
  choice: ദയവായി
  rationale: ആജ്ഞയെ മൃദുവാക്കുന്ന വിനയസൂചക കണം; ആധുനിക മലയാളത്തിൽ ‘ദയവായി’ അതിന്റെ സ്വാഭാവിക തുല്യമാണ്.
- source_word: וּשְׁקָה לִּי
  choice: എന്നെ ചുംബിക്കൂ
  rationale: נשׁק എന്ന ക്രിയയും לִי എന്ന ഒന്നാംപുരുഷ സൂചനയും ചേർന്ന പ്രയോഗം മലയാളത്തിൽ നേരിട്ടുള്ള കർമത്തോടുകൂടി സ്വാഭാവികമായി നൽകി.
- source_word: בְּנִי
  choice: എന്റെ മകനേ
  rationale: വിളിസംബോധനയും പിതൃപുത്രബന്ധത്തിന്റെ വികാരഭാവവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അപ്പൻ’ കുടുംബസന്ദർഭത്തിലെ സ്വാഭാവിക ബന്ധപദമായി ഉപയോഗിച്ചു; സംഭാഷണത്തിൽ വിനയവും സ്നേഹഭാവവും കാത്തുസൂക്ഷിച്ചു.
