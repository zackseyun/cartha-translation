  edition: WLC
  text: וַ/תֹּ֤אמֶר ל/וֹ֙ אִמּ֔/וֹ עָלַ֥/י קִלְלָתְ/ךָ֖ בְּנִ֑/י אַ֛ךְ שְׁמַ֥ע בְּ/קֹלִ֖/י וְ/לֵ֥ךְ קַֽח לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/013.yaml
  text: His mother said to him[a], “Your curse be on me, my son. Only listen to my voice, and go[b], get them for me.”
translation:
  language: ml
  text: 'അവന്റെ അമ്മ അവനോടു പറഞ്ഞു: “മകനേ, നിന്റെ ശാപം എന്റെമേൽ വരട്ടെ. എന്റെ വാക്കു മാത്രം കേൾക്കുക[a]; പോയി അവയെ എനിക്കായി കൊണ്ടുവരുക[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “എന്റെ ശബ്ദം കേൾക്കുക”; ഈ ഹീബ്രായ പ്രയോഗത്തിന് “എന്നെ അനുസരിക്കുക” എന്നും അർഥമാകാം.'
    reason: lexical_alternative
  - marker: b
    text: “അവയെ” എന്നത് മുമ്പത്തെ വാക്യത്തിൽ പറഞ്ഞിരിക്കുന്ന ആട്ടിൻകുട്ടികളെയാണ് സൂചിപ്പിക്കുന്നത്; കർമം ഹീബ്രായ പാഠത്തിൽ സൂചിതമാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: וַתֹּאמֶר לֹו אִמּוֹ
  choice: അവന്റെ അമ്മ അവനോടു പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ സാധാരണ ക്രിയാരൂപവും ബന്ധസൂചക പദവും സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: עָלַי קִלְלָתְךָ
  choice: നിനക്കു വരാവുന്ന ശാപം എന്റെമേൽ വരട്ടെ
  rationale: അക്ഷരാർഥത്തിലെ ‘നിന്റെ ശാപം എന്റെമേൽ’ എന്ന ബന്ധം നിലനിർത്തിക്കൊണ്ട്, യാക്കോബിനു സംഭവിക്കാവുന്ന ശാപഫലം റിബെക്ക ഏറ്റെടുക്കുന്നതായി മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പറയുന്നു; ഉറപ്പായും ശാപം വരുമെന്ന അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: בְּנִי
  choice: മകനേ
  rationale: വിളിസംബോധനയും മാതൃസ്നേഹത്തിന്റെ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: אַךְ
  choice: നീ … കേൾക്കുക
  rationale: നിയന്ത്രണവും ഊന്നലും മലയാളത്തിലെ ആജ്ഞാവാക്യത്തിന്റെ ഘടനയിൽ പ്രകടമാക്കുന്നു; പ്രത്യേകം ‘മാത്രം’ ചേർത്താൽ ഉണ്ടാകാവുന്ന കൃത്രിമത്വം ഒഴിവാക്കുന്നു.
- source_word: שְׁמַע בְּקֹלִי
  choice: എന്റെ വാക്കു കേൾക്കുക
  rationale: ‘എന്റെ ശബ്ദം കേൾക്കുക’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ അനുസരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അടിക്കുറിപ്പിൽ അക്ഷരാർഥം അറിയിക്കുന്നു.
- source_word: וְלֵךְ קַח לִי
  choice: പോയി അവയെ എനിക്കുവേണ്ടി കൊണ്ടുവരുക
  rationale: ആജ്ഞകളുടെ ക്രമം നിലനിർത്തുന്നു. മുൻവാക്യത്തിലെ ആട്ടിൻകുട്ടികളാണ് കർമമെന്ന് മലയാളത്തിൽ ആവശ്യമായ സർവനാമം ചേർത്ത് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: റിബെക്ക ശാപം ഏറ്റെടുക്കുന്നതിന്റെ സ്വഭാവം
  choice: “നിനക്കു വരാവുന്ന ശാപം എന്റെമേൽ വരട്ടെ” എന്ന നേരിട്ടുള്ള പ്രഖ്യാപനം
  alternative: “നിന്റെ ശാപത്തിന് ഞാൻ ഉത്തരവാദിയാകാം”
  rationale: മൂലപാഠത്തിലെ ശാപം ‘എന്റെമേൽ’ എന്ന ശക്തമായ ഭാഷ സംരക്ഷിക്കുന്നു; നിയമപരമായ ഉത്തരവാദിത്വം എന്ന വ്യാഖ്യാനം മാത്രം ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സംഭാഷണത്തിന്റെ അടിയന്തരതയ്ക്കായി ഹ്രസ്വമായ ആജ്ഞാരൂപങ്ങൾ ഉപയോഗിച്ചു; ഹീബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥവും അനുസരണാർഥവും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
