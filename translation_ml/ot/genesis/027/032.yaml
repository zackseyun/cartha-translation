source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר ל֛/וֹ יִצְחָ֥ק אָבִ֖י/ו מִי אָ֑תָּה וַ/יֹּ֕אמֶר אֲנִ֛י בִּנְ/ךָ֥ בְכֹֽרְ/ךָ֖ עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/032.yaml
  text: His father Isaac said to him[a], “Who are you?” And he said, “I am your son, your firstborn[b], Esau.”
translation:
  language: ml
  text: 'അവന്റെ അപ്പനായ യിസ്ഹാക്ക് അവനോടു[a] പറഞ്ഞു: “നീ ആരാണ്?” അവൻ പറഞ്ഞു: “ഞാൻ അങ്ങയുടെ മകനും ആദ്യജാതനുമായ[b] ഏശാവാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘യിസ്ഹാക്ക്, അവന്റെ അപ്പൻ’; മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവന്റെ അപ്പനായ യിസ്ഹാക്ക്’ എന്നു നൽകിയിരിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അങ്ങയുടെ മൂത്ത മകൻ’; എബ്രായത്തിലെ ‘ആദ്യജാതൻ’ എന്ന പദം ചുറ്റുപാടിലുള്ള വിവരണത്തിൽ പ്രധാനമായ ജനനക്രമത്തിന്റെയും ആദ്യജാതാവകാശത്തിന്റെയും ഊന്നൽ നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לּוֹ
  choice: അവനോട് … എന്നു ചോദിച്ചു
  rationale: אמר എന്നത് അടിസ്ഥാനമായി ‘പറയുക’ എന്നാണെങ്കിലും ഇവിടെ നേരിട്ടുള്ള ചോദ്യം അവതരിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നു നൽകുന്നു; לּוֹ ‘അവനോട്’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: יִצְחָק אָבִיו
  choice: അവന്റെ അപ്പനായ യിസ്ഹാക്ക്
  rationale: എബ്രായത്തിലെ പദക്രമം അക്ഷരാർഥത്തിൽ ‘യിസ്ഹാക്ക്, അവന്റെ അപ്പൻ’ എന്നാണ്. ബന്ധവും വ്യക്തിയുടെ പേരും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളക്രമമാണ് തിരഞ്ഞെടുത്തത്.
- source_word: מִי אַתָּה
  choice: നീ ആരാണ്?
  rationale: ചോദ്യപദമായ מִיയും രണ്ടാംപുരുഷ ഏകവചന സർവനാമവും ചേർന്ന ലളിതവും നേരിട്ടുള്ള ചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: אֲנִי בִּנְךָ
  choice: ഞാൻ അങ്ങയുടെ മകൻ
  rationale: എബ്രായ നാമവാക്യത്തിൽ പ്രത്യക്ഷ ബന്ധകക്രിയ ഇല്ലെങ്കിലും മലയാളത്തിൽ ‘ആണ്’ ചേർത്ത് വാക്യാവസാനത്ത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. പിതാവിനോടുള്ള മകന്റെ അഭിസംബോധനയിൽ മാന്യമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു.
- source_word: בְכֹרְךָ
  choice: അങ്ങയുടെ ആദ്യജാതൻ
  rationale: בכור ജനനക്രമത്തോടൊപ്പം ചുറ്റുപാടിലുള്ള ആദ്യജാതാവകാശത്തിന്റെ പ്രാധാന്യവും വഹിക്കുന്നു. ‘മൂത്ത മകൻ’ എന്നതിനെക്കാൾ ‘ആദ്യജാതൻ’ ആ ഊന്നൽ കൂടുതൽ കൃത്യമായി സംരക്ഷിക്കുന്നു.
- source_word: עֵשָׂו
  choice: ഏശാവ്
  rationale: വ്യക്തിനാമം ആധുനിക മലയാള ബൈബിൾ പ്രയോഗത്തിന് അനുയോജ്യമായി ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: בכור എന്ന പദത്തിലെ ജനനക്രമവും ആദ്യജാതാവകാശവുമായി ബന്ധപ്പെട്ട കഥാപരമായ ഊന്നലും
  choice: ആദ്യജാതൻ
  alternative: മൂത്ത മകൻ
  rationale: ‘ആദ്യജാതൻ’ മൂത്തവൻ എന്ന അർഥം മാത്രമല്ല, ഈ സന്ദർഭത്തിൽ നിർണായകമായ ആദ്യജാതാവകാശബന്ധവും തുറന്നുവെക്കുന്നു; പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പിതാവിനോട് സംസാരിക്കുമ്പോൾ ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു; വിവരണത്തിൽ ‘അവൻ’ നിലനിർത്തി. നേരിട്ടുള്ള ചോദ്യത്തിൽ സ്വാഭാവിക മലയാളത്തിനായി ‘ചോദിച്ചു’ ഉപയോഗിച്ചെങ്കിലും അനുബന്ധ മറുപടിയിൽ ‘പറഞ്ഞു’ നിലനിർത്തി.
