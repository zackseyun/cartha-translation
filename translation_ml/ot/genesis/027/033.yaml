id: GEN.27.33
reference: Genesis 27:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֶּחֱרַ֨ד יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד מְאֹד֒ וַ/יֹּ֡אמֶר מִֽי אֵפ֡וֹא ה֣וּא הַ/צָּֽד צַיִד֩ וַ/יָּ֨בֵא לִ֜/י וָ/אֹכַ֥ל מִ/כֹּ֛ל בְּ/טֶ֥רֶם תָּב֖וֹא וָ/אֲבָרֲכֵ֑/הוּ גַּם בָּר֖וּךְ יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/033.yaml
  text: Then Isaac trembled with a very great trembling and said[a], “Who then was it who hunted game and brought it to me, and I ate from all of it before you came and blessed him? Yes, and he will be blessed.”
translation:
  language: ml
  text: 'അപ്പോൾ യിസ്ഹാക്ക് അത്യന്തം ശക്തമായി വിറച്ചു. അദ്ദേഹം പറഞ്ഞു: “അങ്ങനെയെങ്കിൽ, വേട്ടയാടി ഇരയെ എനിക്കു കൊണ്ടുവന്നവൻ ആരായിരുന്നു? നീ വരുന്നതിനുമുമ്പ് ഞാൻ അതിൽനിന്നെല്ലാം ഭക്ഷിച്ചു അവനെ അനുഗ്രഹിച്ചു. അതെ, അവൻ അനുഗ്രഹിക്കപ്പെട്ടവനായിരിക്കും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തീർച്ചയായും അവൻ അനുഗ്രഹിക്കപ്പെട്ടവനായിരിക്കും.”'
    reason: גַּם എന്ന പദം ഇവിടെ സമ്മതസൂചകമായ ‘അതെ’ എന്നോ ഊന്നൽ നൽകുന്ന ‘തീർച്ചയായും’ എന്നോ സ്വാഭാവികമായി ഗ്രഹിക്കാം.
lexical_decisions:
- source_word: וַיֶּחֱרַד ... חֲרָדָה גְּדֹלָה עַד מְאֹד
  choice: അത്യന്തം ശക്തമായി വിറച്ചു
  rationale: ക്രിയയും അതേ ധാതുവിൽനിന്നുള്ള നാമവും ചേർന്നുള്ള എബ്രായ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ശക്തമായ തീവ്രതയോടെ നൽകുന്നു; ഭയം മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: מִי אֵפוֹא הוּא
  choice: അങ്ങനെയെങ്കിൽ ... ആരായിരുന്നു?
  rationale: אֵפוֹאയുടെ നിഗമനാത്മകവും ഊന്നൽ നൽകുന്നതുമായ ഭാവം ‘അങ്ങനെയെങ്കിൽ’ എന്നതിലൂടെ നിലനിർത്തുന്നു; തുടർന്നുള്ള സംഭവങ്ങൾ കഴിഞ്ഞകാലമായതിനാൽ ‘ആരായിരുന്നു’ അനുയോജ്യം.
- source_word: הַצָּד צַיִד
  choice: വേട്ടയാടി ഇരയെ
  rationale: ക്രിയയുടെയും സമാനാർഥ നാമത്തിന്റെയും എബ്രായ പ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ഇരയുടെ ഇനം അനാവശ്യമായി പ്രത്യേകീകരിക്കുന്നില്ല.
- source_word: וַיָּבֵא לִי
  choice: എനിക്കു കൊണ്ടുവന്നവൻ
  rationale: മുൻപറഞ്ഞ ‘ഇര’ തന്നെയാണ് കൊണ്ടുവന്ന വസ്തുവെന്ന് മലയാള വാക്യഘടനയിൽ വ്യക്തമാണ്.
- source_word: וָאֹכַל מִכֹּל
  choice: ഞാൻ അതിൽനിന്നെല്ലാം ഭക്ഷിച്ച്
  rationale: מִן എന്ന വിഭക്തിയുടെ ഭാഗികഭാവം ‘അതിൽനിന്ന്’ വഴി സൂക്ഷിക്കുന്നു; כֹּל നൽകുന്ന സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: בְּטֶרֶם תָּבוֹא
  choice: നീ വരുന്നതിനുമുമ്പ്
  rationale: ലളിതവും നേരിട്ടുള്ളതുമായ കാലസൂചനയായി മൂലപാഠത്തെ പിന്തുടരുന്നു.
- source_word: וָאֲבָרֲכֵהוּ
  choice: അവനെ അനുഗ്രഹിച്ചു
  rationale: മലയാളത്തിലെ മുൻവാക്യഭാഗത്തിൽ ‘ഞാൻ’ വ്യക്തമായതിനാൽ അത് വീണ്ടും ആവർത്തിക്കാതെ ഒന്നാംപുരുഷ കർത്താവിനെ സ്വാഭാവികമായി തുടരുന്നു.
- source_word: גַּם בָּרוּךְ יִהְיֶה
  choice: അതെ, അവൻ അനുഗ്രഹിക്കപ്പെട്ടവനായിരിക്കും
  rationale: גַּם നൽകുന്ന ഉറപ്പും ഊന്നലും ‘അതെ’ എന്നതിലൂടെ നൽകുന്നു; അനുഗ്രഹം നിലനിൽക്കുമെന്ന ഭാവി/ഫലാവസ്ഥ יִהְיֶה വഴി പ്രകടമാകുന്നത് ‘ആയിരിക്കും’ എന്ന് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: നൽകിക്കഴിഞ്ഞ അനുഗ്രഹത്തെക്കുറിച്ചുള്ള യിസ്ഹാക്കിന്റെ അവസാന പ്രഖ്യാപനത്തിന്റെ ശക്തി
  choice: അനുഗ്രഹം നിലനിൽക്കുമെന്ന ഉറച്ച സ്ഥിരീകരണം
  alternative: ഊന്നലില്ലാത്ത, മനസ്സില്ലാമനസ്സോടെയുള്ള സമ്മതം
  rationale: גַּם בָּרוּךְ יִהְיֶה വെറും നിരാശാഭരിതമായ അംഗീകാരത്തേക്കാൾ ഊന്നിയ സ്ഥിരീകരണമാണ്. അതേസമയം, അനുഗ്രഹം എങ്ങനെ അല്ലെങ്കിൽ എന്തുകൊണ്ട് മാറ്റാനാവാത്തതാണെന്ന് പാഠം പറയാത്തതിനാൽ വിവർത്തനം അതിനെ സിദ്ധാന്തപരമായി വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ആഖ്യാനശൈലി. എബ്രായത്തിലെ തീവ്രത സ്വാഭാവിക മലയാളത്തിലാക്കി; ഇരയുടെ ഇനമോ അനുഗ്രഹത്തിന്റെ ദൈവശാസ്ത്രപരമായ പ്രവർത്തനരീതിയോ പാഠത്തിന് പുറത്തുനിന്ന് ചേർത്തിട്ടില്ല.
