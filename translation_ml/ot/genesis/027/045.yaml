source:
  edition: WLC
  text: עַד שׁ֨וּב אַף אָחִ֜י/ךָ מִמְּ/ךָ֗ וְ/שָׁכַח֙ אֵ֣ת אֲשֶׁר עָשִׂ֣יתָ לּ֔/וֹ וְ/שָׁלַחְתִּ֖י וּ/לְקַחְתִּ֣י/ךָ מִ/שָּׁ֑ם לָ/מָ֥ה אֶשְׁכַּ֛ל גַּם שְׁנֵי/כֶ֖ם י֥וֹם אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/045.yaml
  text: until your brother’s anger turns away from you[a], and he forgets what you have done to him. Then I will send and bring you from there[c][b]. Why should I be bereaved of both of you in one day?
translation:
  language: ml
  text: നിന്റെ സഹോദരന്റെ കോപം നിന്നിൽനിന്ന് മാറുകയും, നീ അവനോടു ചെയ്തതു അവൻ മറക്കുകയും ചെയ്യുന്നതുവരെ, പിന്നെ ഞാൻ ആളയച്ച് നിന്നെ അവിടെനിന്ന് കൊണ്ടുവരുത്തും.[a][b] ഒരേ ദിവസം നിങ്ങളിരുവരെയും നഷ്ടപ്പെട്ടവളാകേണ്ടത് എന്തിന്?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “നിന്റെ സഹോദരന്റെ കോപം നിന്നിൽനിന്ന് തിരിയുന്നതുവരെ.” കോപത്തോടൊപ്പം ഉപയോഗിച്ചിരിക്കുന്ന “തിരിയുക/മടങ്ങുക” എന്ന എബ്രായ ക്രിയ ഇവിടെ കോപം മാറുന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “നിന്നെ അവിടെനിന്ന് എടുക്കും.” സന്ദർഭത്തിലെ ദിശ വ്യക്തമാക്കാൻ “കൊണ്ടുവരുത്തും” എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
  - marker: c
    text: “ഒരേ ദിവസം നിങ്ങളിരുവരെയും നഷ്ടപ്പെടുക” എന്നത് അവരുടെ സംഘർഷത്തിന്റെ ഫലമായി രണ്ടു പുത്രന്മാരെയും നഷ്ടമാകുമെന്ന റിബെക്കയുടെ ഭയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഇരുവരെയും ഒരേ വിധത്തിൽ നഷ്ടപ്പെടണമെന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: עַד שׁוּב אַף אָחִיךָ מִמְּךָ
  choice: നിന്റെ സഹോദരന്റെ കോപം നിന്നിൽനിന്ന് മാറുന്നതുവരെ
  rationale: שׁוב എന്നത് അടിസ്ഥാനമായി ‘തിരിയുക/മടങ്ങുക’ എന്നാണെങ്കിലും אַף (‘കോപം’) എന്നതോടൊപ്പം കോപം ഒരാളിൽനിന്ന് മാറുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. מן എന്നതിന്റെ ‘നിന്നിൽനിന്ന്’ എന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: וְשָׁכַח אֵת אֲשֶׁר עָשִׂיתָ לוֹ
  choice: നീ അവനോടു ചെയ്തതു അവൻ മറക്കുന്നതുവരെ
  rationale: യാക്കോബ് മുമ്പ് ഏശാവിനോടു ചെയ്ത പ്രവൃത്തിയെ സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: וְשָׁלַחְתִּי
  choice: പിന്നെ ഞാൻ ആളയച്ച്
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘അയയ്ക്കുക’ നിലനിർത്തുകയും ആരെയോ അയച്ചു യാക്കോബിനെ വരുത്തുമെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וּלְקַחְתִּיךָ מִשָּׁם
  choice: നിന്നെ അവിടെനിന്ന് കൊണ്ടുവരാം
  rationale: לקח അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്നാണ്; സംസാരിക്കുന്ന റിബെക്കയുടെ അടുക്കലേക്കുള്ള ദിശ സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ ‘കൊണ്ടുവരാം’ സ്വാഭാവികമാണ്. മൂലപാഠത്തിൽ ‘തിരികെ’ എന്നതിന് പ്രത്യേകം പദമില്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: לָמָה אֶשְׁכַּל גַּם שְׁנֵיכֶם יוֹם אֶחָד
  choice: ഒരേ ദിവസം നിങ്ങളിരുവരെയും നഷ്ടപ്പെട്ടവളായി ഞാൻ തീരേണ്ടത് എന്തിന്?
  rationale: שכל മക്കളെ നഷ്ടപ്പെട്ട് ദുഃഖിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘നഷ്ടപ്പെട്ടവളായി തീരുക’ മാതാവിന്റെ വിയോഗഭാവം സൂക്ഷിക്കുകയും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മലയാളം നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ഒരേ ദിവസം ഇരുവരെയും നഷ്ടപ്പെടുക’ എന്നതിന്റെ കൃത്യമായ വിധം
  choice: ഇരുവരെയും നഷ്ടപ്പെടുമെന്ന ആശങ്ക മാത്രം പാഠത്തിൽ നിലനിർത്തി
  alternative: ഇരുവരും ഒരേ രീതിയിൽ മരിക്കുമെന്നോ ഒരാൾ കൊല്ലപ്പെടുകയും മറ്റാൾ ശിക്ഷിക്കപ്പെടുകയും ചെയ്യുമെന്നോ വ്യക്തമാക്കുക
  rationale: ഹീബ്രു വാക്യം നഷ്ടത്തിന്റെ മാർഗം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ റിബെക്കയുടെ ഇരട്ടവിയോഗഭയം മാത്രം പരിഭാഷയിൽ സൂക്ഷിച്ചു; വിശദീകരണം അടിക്കുറിപ്പിൽ പരിമിതപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മുൻവാക്യത്തിൽ ആരംഭിച്ച ‘അവിടെ താമസിക്കുക’ എന്ന നിർദേശം ഈ വാക്യത്തിലെ עַד ഘടന പൂർത്തിയാക്കുന്നതിനായി ചേർത്തിരിക്കുന്നു; വാക്യം ഒറ്റയ്ക്ക് വായിക്കുമ്പോൾ വ്യാകരണപരമായി സമ്പൂർണമാക്കാനുള്ള സന്ദർഭപൂരണമാണിത്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
