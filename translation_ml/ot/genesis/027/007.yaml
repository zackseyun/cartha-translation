reference: Genesis 27:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הָבִ֨יאָ/ה לִּ֥/י צַ֛יִד וַ/עֲשֵׂה לִ֥/י מַטְעַמִּ֖ים וְ/אֹכֵ֑לָה וַ/אֲבָרֶכְ/כָ֛ה לִ/פְנֵ֥י יְהוָ֖ה לִ/פְנֵ֥י מוֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/007.yaml
  text: Bring me game and make me tasty food[b][a], so that I may eat and bless you before Yahweh before I die.’
translation:
  language: ml
  text: ‘എനിക്കായി വേട്ടയിറച്ചി കൊണ്ടുവന്ന് രുചികരമായ വിഭവങ്ങൾ[a] തയ്യാറാക്കുക; ഞാൻ ഭക്ഷിച്ച്, മരിക്കുന്നതിനുമുമ്പ് യാഹ്‌വെയുടെ സന്നിധിയിൽ നിന്നെ അനുഗ്രഹിക്കേണ്ടതിന്’ എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സ്വാദിഷ്ഠമായ ഭക്ഷണം.’ എബ്രായപദം പ്രത്യേകം തയ്യാറാക്കിയ രുചിയേറിയ വിഭവങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאָה לִּי
  choice: എനിക്കുവേണ്ടി ... കൊണ്ടുവന്ന്
  rationale: ഹിഫ്ഇൽ ആജ്ഞാരൂപം സംസാരിക്കുന്നയാളുടെ അടുക്കലേക്ക് എന്തെങ്കിലും കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ സന്ദർഭത്തിന് സ്വാഭാവികമായ പ്രയോഗം.
- source_word: צַיִד
  choice: വേട്ടയിറച്ചി
  rationale: വേട്ടയിലൂടെ ലഭിച്ച മൃഗത്തെയോ അതിന്റെ മാംസത്തെയോ സൂചിപ്പിക്കുന്നു. ‘മാൻമാംസം’ എന്നതിനെക്കാൾ വിശാലവും ഭക്ഷണസന്ദർഭത്തിൽ ‘വേട്ടമൃഗം’ എന്നതിനെക്കാൾ സ്വാഭാവികവുമാണ്.
- source_word: וַעֲשֵׂה
  choice: തയ്യാറാക്കുക
  rationale: עשה എന്നത് പൊതുവേ ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും ഭക്ഷണസന്ദർഭത്തിൽ ‘തയ്യാറാക്കുക’ എന്നതാണ് സ്വാഭാവികമായ മലയാളം.
- source_word: מַטְעַמִּים
  choice: രുചികരമായ വിഭവങ്ങൾ
  rationale: പ്രത്യേകം തയ്യാറാക്കിയ രുചിയേറിയ ഭക്ഷണവിഭവങ്ങളെയാണ് ബഹുവചനരൂപം സൂചിപ്പിക്കുന്നത്; ‘വിഭവങ്ങൾ’ രൂപവും അർഥവും നിലനിർത്തുന്നു.
- source_word: וְאֹכֵלָה וַאֲבָרֶכְכָה
  choice: ഞാൻ ഭക്ഷിച്ച് ... നിന്നെ അനുഗ്രഹിക്കട്ടെ
  rationale: രണ്ട് കോഹോർട്ടേറ്റീവ് രൂപങ്ങളുടെയും ഉദ്ദേശ്യപരവും ഇച്ഛാസൂചകവുമായ ഭാവം മലയാളത്തിലെ ‘അനുഗ്രഹിക്കട്ടെ’ എന്ന പ്രയോഗത്തിൽ നിലനിർത്തുന്നു; ആദ്യ പ്രവൃത്തി ക്രിയാവിശേഷണരൂപത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ സാന്നിധ്യസൂചക അർഥം വ്യക്തമായി നൽകുന്നു; ദൈവനാമമായ יהוה മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לִפְנֵי מוֹתִי
  choice: മരിക്കുന്നതിനുമുമ്പ്
  rationale: ‘എന്റെ മരണത്തിനുമുമ്പ്’ എന്ന നാമരൂപത്തേക്കാൾ സ്വാഭാവികമായ മലയാള ക്രിയാരൂപം; മൂലത്തിന്റെ അർഥം കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിൽ ഒരു സ്ഥാനപ്പേരല്ല, ചതുർവ്യഞ്ജന ദൈവനാമമാണ് ഉള്ളത്. അതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സാധാരണ മലയാള വായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: യഹോവയുടെ സന്നിധിയിൽ അനുഗ്രഹിക്കുക എന്ന പ്രയോഗം
  choice: യഹോവയുടെ സന്നിധിയിൽ നിന്നെ അനുഗ്രഹിക്കട്ടെ
  alternative: യഹോവയുടെ മുമ്പാകെ നിന്നെ അനുഗ്രഹിക്കട്ടെ
  rationale: ‘സന്നിധിയിൽ’ എന്നത് ദൈവസാക്ഷ്യത്തിലോ ദൈവസാന്നിധ്യത്തിലോ നൽകുന്ന അനുഗ്രഹം എന്ന മൂലത്തിലെ അർഥം നിലനിർത്തുന്നു; അനുഗ്രഹത്തിന്റെ ദൈവശാസ്ത്രപരമായ സ്വഭാവം അതിലധികം വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നേരിട്ടുള്ള ഉദ്ധരണിയുടെ ആജ്ഞാഭാവവും കോഹോർട്ടേറ്റീവ് രൂപങ്ങളുടെ ഉദ്ദേശ്യ/ഇച്ഛാഭാവവും സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു.
