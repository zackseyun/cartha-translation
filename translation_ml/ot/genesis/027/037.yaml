id: GEN.27.37
reference: Genesis 27:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֨עַן יִצְחָ֜ק וַ/יֹּ֣אמֶר לְ/עֵשָׂ֗ו הֵ֣ן גְּבִ֞יר שַׂמְתִּ֥י/ו לָ/ךְ֙ וְ/אֶת כָּל אֶחָ֗י/ו נָתַ֤תִּי ל/וֹ֙ לַ/עֲבָדִ֔ים וְ/דָגָ֥ן וְ/תִירֹ֖שׁ סְמַכְתִּ֑י/ו וּ/לְ/כָ֣ה אֵפ֔וֹא מָ֥ה אֶֽעֱשֶׂ֖ה בְּנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/037.yaml
  text: Isaac answered and said to Esau[a], “Look, I have made him master over you, and I have given all his brothers to him as servants. I have sustained him with grain and new wine. What then can I do for you[c][b], my son?”
translation:
  language: ml
  text: 'യിസ്ഹാക്ക് ഏശാവിനോട് മറുപടി പറഞ്ഞു: “നോക്കൂ, ഞാൻ അവനെ നിനക്കു യജമാനനാക്കിയിരിക്കുന്നു; അവന്റെ സഹോദരന്മാരെയെല്ലാം അവനു ദാസന്മാരായി നൽകിയിരിക്കുന്നു.[a] ധാന്യവും പുതുവീഞ്ഞുംകൊണ്ട് ഞാൻ അവനെ നിലനിർത്തിയിരിക്കുന്നു.[b] അങ്ങനെയെങ്കിൽ, എന്റെ മകനേ, ഇനി ഞാൻ നിനക്കുവേണ്ടി എന്തു ചെയ്യാനാകും?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അടിമകളായി.” എബ്രായപദം സന്ദർഭമനുസരിച്ച് ദാസന്മാരെയോ അടിമകളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ധാന്യവും പുതുവീഞ്ഞുംകൊണ്ട് ഞാൻ അവനെ പിന്തുണച്ചിരിക്കുന്നു.” എബ്രായക്രിയയ്ക്ക് താങ്ങുക, പിന്തുണയ്ക്കുക, ഉപജീവനം നൽകുക എന്നീ ആശയങ്ങൾ പ്രകടിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: മറുപടി പറഞ്ഞു
  rationale: എബ്രായ ആഖ്യാനത്തിലെ പ്രതികരണസൂത്രം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הֵן
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും തുടർന്നുള്ള പ്രസ്താവനയ്ക്ക് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന അവ്യയത്തിന്റെ ശക്തി കാലഹരണപ്പെട്ട ശൈലിയില്ലാതെ നിലനിർത്തുന്നു.
- source_word: גְּבִיר שַׂמְתִּיו לָךְ
  choice: ഞാൻ അവനെ നിനക്കു യജമാനനാക്കിയിരിക്കുന്നു
  rationale: നിയമനവും ഏശാവിന്മേലുള്ള അധികാരബന്ധവും നേരിട്ട് സംരക്ഷിക്കുന്നു; ദൈവിക അഭിസംബോധന സൂചിപ്പിക്കാവുന്ന പദം ഒഴിവാക്കുന്നു.
- source_word: כָּל אֶחָיו
  choice: അവന്റെ സഹോദരന്മാരെയെല്ലാം
  rationale: മൂലത്തിലെ കുടുംബബന്ധപദം വിശാലമായ ‘ബന്ധുക്കൾ’ എന്ന അർഥത്തിലേക്ക് മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: לַעֲבָדִים
  choice: ദാസന്മാരായി
  rationale: עבד എന്ന പദം ദാസന്മാരെയോ അടിമകളെയോ സൂചിപ്പിക്കാം; ഇവിടെ അനുഗ്രഹത്തിലെ കീഴ്വഴക്കമാണ് മുൻനിരയിൽ, അതിനാൽ ‘ദാസന്മാർ’ മുഖ്യവാചകത്തിൽ സ്വീകരിച്ച് മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: דָגָן
  choice: ധാന്യം
  rationale: വിവിധ ധാന്യവിളകളെ പൊതുവായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: תִּירֹשׁ
  choice: പുതുവീഞ്ഞ്
  rationale: കാർഷിക സമൃദ്ധിയുടെ പശ്ചാത്തലത്തിൽ പുതിയതോ പുതുതായി ഉത്പാദിപ്പിച്ചതോ ആയ വീഞ്ഞിന്റെ സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: סְמַכְתִּיו
  choice: ഞാൻ അവനെ നിലനിർത്തിയിരിക്കുന്നു
  rationale: ‘താങ്ങുക/പിന്തുണയ്ക്കുക’ എന്ന അടിസ്ഥാനാർഥവും ധാന്യവും പുതുവീഞ്ഞുംകൊണ്ടുള്ള ഉപജീവനസഹായവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: וּלְכָה אֵפוֹא
  choice: അങ്ങനെയെങ്കിൽ ... ഇനി
  rationale: മുൻപ് ചെയ്ത കാര്യങ്ങളുടെ ഫലമായി ഏശാവിനുവേണ്ടി ഇനി എന്താണ് ശേഷിക്കുന്നതെന്ന വാക്യത്തിലെ അനന്തരഫലപരവും വാചാടോപപരവുമായ തിരിവ് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מָה אֶעֱשֶׂה ... בְּנִי
  choice: എന്റെ മകനേ, ഇനി ഞാൻ നിനക്കുവേണ്ടി എന്തു ചെയ്യാനാകും?
  rationale: പ്രായോഗികമായ അസാധ്യത സൂചിപ്പിക്കുന്ന വാചാടോപചോദ്യവും സ്നേഹപൂർവമായ നേരിട്ടുള്ള അഭിസംബോധനയും സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി. ‘യജമാനൻ’, ‘ദാസന്മാർ’ എന്നീ പദങ്ങൾ അധികാരബന്ധം വ്യക്തമാക്കുന്നു; עבד എന്ന പദത്തിന്റെ കടുപ്പമേറിയ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യവാചകസ്ഥാനങ്ങളിൽ നൽകിയിട്ടുണ്ട്.
