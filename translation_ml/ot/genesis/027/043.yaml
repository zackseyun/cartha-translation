  text: וְ/עַתָּ֥ה בְנִ֖/י שְׁמַ֣ע בְּ/קֹלִ֑/י וְ/ק֧וּם בְּרַח לְ/ךָ֛ אֶל לָבָ֥ן אָחִ֖/י חָרָֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/043.yaml
  text: Now[a], my son, listen to my voice, and arise, flee to my brother Laban in Haran.
translation:
  language: ml
  text: ഇപ്പോൾ[a], മകനേ, എന്റെ വാക്കു കേൾക്കുക; എഴുന്നേറ്റ് ഹാരാനിലുള്ള എന്റെ സഹോദരനായ ലാബാന്റെ അടുക്കലേക്ക് ഓടിപ്പോകുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “എന്നിട്ട് ഇപ്പോൾ, മകനേ, എന്റെ വാക്കു കേൾക്കുക; എഴുന്നേറ്റ് ഹാരാനിലുള്ള എന്റെ സഹോദരനായ ലാബാന്റെ അടുക്കലേക്ക് ഓടിപ്പോകുക.”'
    reason: וְעַתָּהയിലെ וְ എന്ന ബന്ധകത്തെ ‘എന്നിട്ട്’ എന്നു പ്രത്യേകം പ്രതിനിധീകരിക്കാവുന്ന ബദൽ.
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: അടിയന്തരമായ നിർദേശം ആരംഭിക്കുന്ന സംഭാഷണസൂചകം. മുൻപിലെ וְ മലയാളത്തിൽ പ്രത്യേകം ‘എന്നിട്ട്’ എന്നു നൽകാതെ ‘ഇപ്പോൾ’ എന്നു പറയുന്നതാണ് സ്വാഭാവികം; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: בְנִי
  choice: മകനേ
  rationale: റിബെക്ക യാക്കോബിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതിലെ കുടുംബബന്ധവും പുരുഷലിംഗസൂചനയും നിലനിർത്തുന്നു.
- source_word: שְׁמַע בְּקֹלִי
  choice: എന്റെ വാക്കു കേൾക്കുക
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെ ശബ്ദം കേൾക്കുക’ എന്നാണെങ്കിലും, അനുസരണത്തിന്റെ സൂചനയുള്ള ഈ എബ്രായ പ്രയോഗത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ സമാനപ്രയോഗമാണിത്; ‘എന്നെ അനുസരിക്കുക’ എന്നു വ്യക്തമാക്കി അർഥം ചുരുക്കുന്നില്ല.
- source_word: וְקוּם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ആജ്ഞയുടെ അർഥം നിലനിർത്തുകയും തുടർന്നുള്ള ആജ്ഞയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּרַח לְךָ
  choice: ഓടിപ്പോകുക
  rationale: ברח സൂചിപ്പിക്കുന്ന അപകടത്തിൽനിന്നുള്ള അടിയന്തര പലായനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. לְךָ എന്ന താൽപര്യ/ദിശാസൂചക ദത്തിവ് പ്രത്യേകം വിവർത്തനം ചെയ്യുന്നത് മലയാളത്തിൽ കൃത്രിമമാകും.
- source_word: אֶל לָבָן אָחִי
  choice: എന്റെ സഹോദരനായ ലാബാന്റെ അടുക്കലേക്ക്
  rationale: ലാബാനുമായുള്ള ബന്ധവും അവന്റെ അടുക്കലേക്കുള്ള ചലനവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: חָרָנָה
  choice: ഹാരാനിലുള്ള
  rationale: സ്ഥലനാമത്തിലെ ദിശാസൂചക ה ചലനം ഹാരാനിലേക്കാണെന്ന് സൂചിപ്പിക്കുന്നു; ‘ലാബാന്റെ അടുക്കലേക്ക്’ എന്നതിൽ ചലനം ഇതിനകം പ്രകടമായതിനാൽ, അവന്റെ സ്ഥാനം ‘ഹാരാനിലുള്ള’ എന്നു നൽകുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
