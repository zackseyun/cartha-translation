  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപങ്ങൾ ഉപയോഗിച്ചു. അടിയന്തരത നിലനിർത്താൻ ചെറുതും തുടർച്ചയുള്ളതുമായ നിർദേശവാക്യം സ്വീകരിച്ചു; പരമ്പരാഗതമെങ്കിലും സാധാരണ വായനക്കാർക്ക് അപരിചിതമായ പദങ്ങൾ ഒഴിവാക്കി.
