language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֥א אֶל אָבִ֖י/ו וַ/יֹּ֣אמֶר אָבִ֑/י וַ/יֹּ֣אמֶר הִנֶּ֔נִּ/י מִ֥י אַתָּ֖ה בְּנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/018.yaml
  text: So he went in to his father and said[a], “My father.” And he said, “Here I am. Who are you, my son?”
translation:
  language: ml
  text: 'അങ്ങനെ അവൻ തന്റെ അപ്പന്റെ അടുക്കൽ ചെന്ന്[a], “അപ്പാ” എന്നു പറഞ്ഞു. അദ്ദേഹം പറഞ്ഞു: “ഇതാ, ഞാൻ ഇവിടെ. മകനേ, നീ ആരാണ്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവൻ തന്റെ അപ്പന്റെ അടുക്കൽ വന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അങ്ങനെ അവൻ ... അടുക്കൽ ചെന്ന്
  rationale: בוא എന്ന ക്രിയയുടെ wayyiqtol രൂപം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. യാക്കോബ് തന്റെ അപ്പന്റെ സന്നിധിയിലേക്കു പ്രവേശിക്കുന്ന സന്ദർഭത്തിൽ ‘അടുക്കൽ ചെന്ന്’ എന്നത് ദിശയും സ്വാഭാവിക മലയാളപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: אֶל אָבִיו
  choice: തന്റെ അപ്പന്റെ അടുക്കൽ
  rationale: אֶל ദിശയെ സൂചിപ്പിക്കുന്നു; אָבִיו എന്നത് ‘അവന്റെ അപ്പൻ’ എന്നാണ്. മലയാളത്തിൽ കർത്താവിലേക്കുള്ള തിരിച്ചുബന്ധം വ്യക്തമാക്കാൻ ‘തന്റെ’ ഉപയോഗിച്ചു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘യിസ്ഹാക്ക്’ എന്ന പേര് ചേർത്തിട്ടില്ല.
- source_word: וַיֹּאמֶר
  choice: എന്നു പറഞ്ഞു / അദ്ദേഹം പറഞ്ഞു
  rationale: ആഖ്യാനത്തിലെ സാധാരണ സംഭാഷണാവതാരിക. ആദ്യ സ്ഥലത്ത് ഉദ്ധരണിയോടു ചേർന്ന സ്വാഭാവിക മലയാളക്രമവും രണ്ടാം സ്ഥലത്ത് സംസാരിക്കുന്നയാളെ വ്യക്തമാക്കുന്ന ആദരസൂചക സർവനാമവും ഉപയോഗിച്ചു.
- source_word: אָבִי
  choice: അപ്പാ
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയമുള്ള പദം നേരിട്ടുള്ള അഭിസംബോധനയാണ്. മലയാളത്തിൽ ‘എന്റെ അപ്പാ’ എന്നതിനേക്കാൾ ‘അപ്പാ’ സ്വാഭാവികമായി അതേ ബന്ധവും അഭിസംബോധനാഭാവവും നൽകുന്നു.
- source_word: הִנֶּנִּי
  choice: ഇതാ, ഞാൻ ഇവിടെ
  rationale: ഹീബ്രായിലെ സന്നദ്ധതയോ സാന്നിധ്യമോ അറിയിക്കുന്ന പതിവ് മറുപടിയുടെ രൂപം കഴിയുന്നത്ര നിലനിർത്തുന്നു; വെറും ‘എന്താ?’ എന്നു ചുരുക്കിയിട്ടില്ല.
- source_word: מִי אַתָּה
  choice: നീ ആരാണ്?
  rationale: ചോദ്യപദവും രണ്ടാംപുരുഷ ഏകവചന സർവനാമവും അഭിസംബോധിതന്റെ തിരിച്ചറിയൽ നേരിട്ട് ചോദിക്കുന്നു.
- source_word: בְּנִי
  choice: മകനേ
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയമുള്ള അഭിസംബോധന. മലയാളത്തിലെ ‘മകനേ’ പിതൃബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘എന്റെ മകനേ’ എന്ന അധികഭാരമുള്ള രൂപം ഒഴിവാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കുടുംബാഭിസംബോധനയിൽ സ്വാഭാവികമായ ‘അപ്പാ’, ‘മകനേ’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു. [a] മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
