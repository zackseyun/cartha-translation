  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ‘കൈയിൽ’ എന്ന ദൃശ്യപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
