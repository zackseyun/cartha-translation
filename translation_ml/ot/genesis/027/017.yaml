  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּתֵּ֧ן אֶת הַ/מַּטְעַמִּ֛ים וְ/אֶת הַ/לֶּ֖חֶם אֲשֶׁ֣ר עָשָׂ֑תָה בְּ/יַ֖ד יַעֲקֹ֥ב בְּנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/017.yaml
  text: Then she put the tasty food and the bread that she had made into the hand of Jacob her son[a].
translation:
  language: ml
  text: പിന്നെ താൻ ഉണ്ടാക്കിയ രുചികരമായ ഭക്ഷണവും അപ്പവും അവൾ തന്റെ മകനായ യാക്കോബിന്റെ കൈയിൽ കൊടുത്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: പിന്നെ ... കൊടുത്തു
  rationale: വാവ്-തുടർച്ചാഖ്യാനം കഥയെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; נתן ഇവിടെ കൊടുക്കുക എന്ന നേരിട്ടുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: הַמַּטְעַמִּים
  choice: രുചികരമായ ഭക്ഷണം
  rationale: സന്ദർഭത്തിൽ പ്രത്യേകം തയ്യാറാക്കിയ രുചിയുള്ള വിഭവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഈ പ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: הַלֶּחֶם
  choice: അപ്പം
  rationale: לֶחֶם എന്ന പദത്തിന്റെ സന്ദർഭോചിതവും സാധാരണവുമായ മലയാള പരിഭാഷ.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: താൻ ഉണ്ടാക്കിയ
  rationale: സ്ത്രീലിംഗ കർത്താവായ റിബെക്കയിലേക്കുള്ള ബന്ധം നിലനിർത്തിക്കൊണ്ട്, കൈമാറുന്നതിനു മുമ്പ് തയ്യാറാക്കിയതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּיַד
  choice: കൈയിൽ കൊടുത്തു
  rationale: എബ്രായത്തിലെ ഏകവചനമായ ‘കൈയിൽ’ എന്ന ദൃശ്യപ്രയോഗം നിലനിർത്തുകയും മലയാളത്തിൽ നേരിട്ട് കൈമാറിയെന്ന അർഥം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: יַעֲקֹב בְּנָהּ
  choice: തന്റെ മകനായ യാക്കോബ്
  rationale: മകൻ അവളുടേതാണെന്ന എബ്രായത്തിലെ പ്രത്യയബന്ധം വ്യക്തമായി സൂക്ഷിക്കുന്ന സ്വാഭാവിക മലയാള പദക്രമം.
