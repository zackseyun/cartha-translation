  text: וְ/עַתָּ֥ה בְנִ֖/י שְׁמַ֣ע בְּ/קֹלִ֑/י לַ/אֲשֶׁ֥ר אֲנִ֖י מְצַוָּ֥ה אֹתָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/008.yaml
  text: Now[a], my son[b], listen to my voice as to what I command you.
translation:
  language: ml
  text: ഇപ്പോൾ[a], മകനേ, ഞാൻ നിന്നോടു കൽപ്പിക്കുന്നതനുസരിച്ച് എന്റെ വാക്കു കേൾക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ഇനി, മകനേ, ഞാൻ നിന്നോടു കൽപ്പിക്കുന്നതനുസരിച്ച് എന്റെ വാക്കു കേൾക്കുക.’'
    reason: וְעַתָּהയിലെ ബന്ധകവും സംവാദത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്ന സ്വഭാവവും ‘ഇനി’ എന്നതിലൂടെ പ്രകടമാക്കാം.
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: തുടർന്നുവരുന്ന നിർദേശം അവതരിപ്പിക്കുന്ന കാലസൂചകവും സംവാദസൂചകവുമായ പ്രയോഗം. മലയാളത്തിൽ ‘ഇപ്പോൾ’ സ്വാഭാവികമായി അടിയന്തരത നിലനിർത്തുന്നു; തുടക്കത്തിലെ וְ സന്ദർഭബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: בְּנִי
  choice: മകനേ
  rationale: ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയമുള്ള സംബോധന. മലയാളത്തിലെ സ്വാഭാവിക സംബോധനരൂപം മാതൃസ്നേഹവും നേരിട്ടുള്ള അഭിസംബോധനയും വ്യക്തമാക്കുന്നു.
- source_word: שְׁמַע בְּקֹלִי
  choice: എന്റെ വാക്കു കേൾക്കുക
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെ ശബ്ദം കേൾക്കുക’ എന്നാണെങ്കിലും, ഈ എബ്രായ പ്രയോഗം പറയുന്നതു ശ്രദ്ധിച്ചു അനുസരിക്കുക എന്ന ആശയം വഹിക്കുന്നു. ‘എന്റെ വാക്കു കേൾക്കുക’ എന്ന മലയാളപ്രയോഗം കേൾവിയുടെയും അനുസരണത്തിന്റെയും സൂചന നിലനിർത്തുന്നു; ‘അനുസരിക്കുക’ എന്നു മാത്രം പറഞ്ഞ് അർഥം അമിതമായി നിർണയിക്കുന്നില്ല.
- source_word: לַאֲשֶׁר
  choice: കല്പിക്കുന്നതനുസരിച്ച്
  rationale: കേൾക്കേണ്ട വാക്കിന്റെ ഉള്ളടക്കത്തെ തുടർന്നുള്ള കല്പനയുമായി ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്ന രൂപമാണിത്.
- source_word: אֲנִי מְצַוָּה אֹתָךְ
  choice: ഞാൻ നിന്നോടു കല്പിക്കുന്ന
  rationale: മൂലത്തിലെ വ്യക്തമായ ‘ഞാൻ’ നിലനിർത്തുന്നു. വർത്തമാന കൃദന്തരൂപം ഇപ്പോൾ നൽകിക്കൊണ്ടിരിക്കുന്ന കല്പനയെ സൂചിപ്പിക്കുന്നു; צוה എന്ന ശക്തമായ പദത്തിന് ‘കല്പിക്കുക’ യോജിക്കുന്നു.
