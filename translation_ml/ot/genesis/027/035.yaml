reference: Genesis 27:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בָּ֥א אָחִ֖י/ךָ בְּ/מִרְמָ֑ה וַ/יִּקַּ֖ח בִּרְכָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/035.yaml
  text: And he said[a], “Your brother came with deceit and took your blessing.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “നിന്റെ സഹോദരൻ വഞ്ചനയോടെ[a] വന്ന് നിന്റെ അനുഗ്രഹം എടുത്തു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “വഞ്ചനയാൽ” അല്ലെങ്കിൽ “വഞ്ചനാപൂർവം.” എബ്രായ പ്രയോഗത്തിൽ ‘വഞ്ചന’ എന്ന നാമത്തോടൊപ്പം ഒരു ഉപസർഗം ഉപയോഗിച്ചിരിക്കുന്നു; അതിനെ മലയാളത്തിൽ പല സ്വാഭാവിക രീതികളിൽ അവതരിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ കഥനരൂപം; യിസ്ഹാക്കിന്റെ മറുപടി സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בָּא
  choice: വന്ന്
  rationale: בוא എന്ന ക്രിയ ഇവിടെ പൂർത്തിയായ ഭൂതകാലപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ക്രിയയുമായി ചേർത്തുള്ള ‘വന്ന്’ മലയാള കഥനത്തിൽ സ്വാഭാവികമാണ്.
- source_word: אָחִיךָ
  choice: നിന്റെ സഹോദരൻ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയമുള്ള ബന്ധനാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ; മൂലപാഠത്തിലെ ആലങ്കാരിക ഊന്നൽ നിലനിർത്താൻ പേരിനു പകരം ബന്ധപദം സൂക്ഷിക്കുന്നു.
- source_word: בְּמִרְמָה
  choice: വഞ്ചനയോടെ
  rationale: בְּ + מִרְמָה പ്രവൃത്തിയുടെ രീതി വ്യക്തമാക്കുന്നു. ‘വഞ്ചനയോടെ’ എന്നത് നാമരൂപത്തിന്റെ ധാർമിക ഭാരം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: וַיִּקַּח
  choice: എടുത്തുകളഞ്ഞു
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘എടുക്കുക’ എന്നതാണ്; അനുഗ്രഹം മറ്റൊരാളിൽനിന്ന് സ്വന്തമാക്കിയെന്ന സന്ദർഭാർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകാൻ ‘എടുത്തുകളഞ്ഞു’ ഉപയോഗിച്ചു, ബലപ്രയോഗം സൂചിപ്പിക്കുന്ന പദം ഒഴിവാക്കി.
- source_word: בִּרְכָתֶךָ
  choice: നിന്റെ അനുഗ്രഹം
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ בְּרָכָה എന്ന പദത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ; ഏശാവിനായി ഉദ്ദേശിച്ച പിതൃഅനുഗ്രഹമെന്ന സന്ദർഭപ്രാധാന്യം നിലനിർത്തുന്നു.
