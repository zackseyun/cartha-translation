translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. മൂലത്തിലെ ‘വഞ്ചന’ എന്ന നാമത്തിന്റെ ഭാരം സൂക്ഷിച്ചിരിക്കുന്നു; പ്രത്യേക സഭാപാരമ്പര്യ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
