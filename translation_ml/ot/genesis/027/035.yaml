    issue: “എടുത്തുകളഞ്ഞു” is stronger than the Hebrew verb.
    rationale: לקח means ‘took’; the added sense ‘away/removed’ is not explicit in the source and can imply a stronger dispossession than the wording itself states.
  - severity: low
    issue: The lexical-alternative footnote for בְּמִרְמָה is absent from the Malayalam draft.
    rationale: The audit trail supplies a lexical-alternative note; placing its marker on “വഞ്ചനയോടെ” correctly anchors the note to the relevant phrase.
