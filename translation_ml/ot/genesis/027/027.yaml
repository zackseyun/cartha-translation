id: GEN.27.27
reference: Genesis 27:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּגַּשׁ֙ וַ/יִּשַּׁק ל֔/וֹ וַ/יָּ֛רַח אֶת רֵ֥יחַ בְּגָדָ֖י/ו וַֽ/יְבָרֲכֵ֑/הוּ וַ/יֹּ֗אמֶר רְאֵה֙ רֵ֣יחַ בְּנִ֔/י כְּ/רֵ֣יחַ שָׂדֶ֔ה אֲשֶׁ֥ר בֵּרֲכ֖/וֹ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/027.yaml
  text: So he came near and kissed him[a], and he smelled the smell of his garments and blessed him and said, “See[b], the smell of my son is like the smell of a field that Yahweh has blessed.”
translation:
  language: ml
  text: 'യാക്കോബ് അടുത്തുചെന്ന് യിസ്ഹാക്കിനെ ചുംബിച്ചു. യിസ്ഹാക്ക് അവന്റെ വസ്ത്രങ്ങളുടെ മണം മണത്തു; പിന്നെ അവനെ അനുഗ്രഹിച്ചുകൊണ്ട് പറഞ്ഞു: “ഇതാ,[a] എന്റെ മകന്റെ മണം യാഹ്‌വേ അനുഗ്രഹിച്ച ഒരു വയലിന്റെ മണംപോലെയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “നോക്കൂ.” ഇവിടെ ഈ പദം ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരപ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: അടുത്തുചെന്ന്
  rationale: נגשׁ സൂചിപ്പിക്കുന്ന അടുത്തേക്കുള്ള ചലനവും തുടർന്നുള്ള പ്രവൃത്തിയുമായുള്ള ബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּשַּׁק לוֹ
  choice: യിസ്ഹാക്കിനെ ചുംബിച്ചു
  rationale: ക്രിയയുടെ ലളിതമായ അർഥം ‘ചുംബിച്ചു’ എന്നാണ്; സ്നേഹപൂർവം എന്ന അധിക ആശയം ചേർത്തിട്ടില്ല. മലയാളത്തിൽ സർവനാമക്കുഴപ്പം ഒഴിവാക്കാൻ സന്ദർഭത്തിൽ വ്യക്തമായ പേര് ഉപയോഗിച്ചു.
- source_word: וַיָּרַח אֶת רֵיחַ בְּגָדָיו
  choice: അവന്റെ വസ്ത്രങ്ങളുടെ മണം മണത്തു
  rationale: മൂലപാഠത്തിലെ ריח എന്ന നാമവും അതിനോട് ബന്ധമുള്ള ריח എന്ന ക്രിയയും പ്രതിഫലിപ്പിക്കുന്ന ‘മണം മണത്തു’ എന്ന പ്രയോഗം ആവർത്തനത്തിന്റെ ശൈലിപരമായ ഫലം നിലനിർത്തുന്നു.
- source_word: בְּגָדָיו
  choice: അവന്റെ വസ്ത്രങ്ങൾ
  rationale: ബഹുവചനമായ concrete noun സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיְבָרֲכֵהוּ
  choice: അവനെ അനുഗ്രഹിച്ചുകൊണ്ട്
  rationale: ברך എന്ന ക്രിയയും അതിന്റെ കർമവും നേരിട്ട് നൽകുന്നു; തുടർന്നുള്ള അനുഗ്രഹവചനവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: רְאֵה
  choice: ഇതാ
  rationale: ഇവിടെ കാഴ്ചയ്ക്കുള്ള അക്ഷരാർഥ കല്പനയെക്കാൾ ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരപ്രയോഗമാണ്; ‘ഇതാ’ അതിനെ ഗൗരവമുള്ള സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: רֵיחַ בְּנִי / כְּרֵיחַ שָׂדֶה
  choice: എന്റെ മകന്റെ മണം / ഒരു വയലിന്റെ മണംപോലെ
  rationale: രണ്ടിടത്തും ഒരേ ‘മണം’ എന്ന പദം ഉപയോഗിച്ച് എബ്രായത്തിലെ ആവർത്തനവും כ־ അടയാളപ്പെടുത്തുന്ന ഉപമയും സംരക്ഷിക്കുന്നു. അനിശ്ചിതമായ שָׂדֶהയ്ക്ക് മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒരു വയൽ’ എന്നു നൽകി.
- source_word: אֲשֶׁר בֵּרֲכוֹ יְהוָה
  choice: യഹോവ അനുഗ്രഹിച്ച
  rationale: ബന്ധവാക്യവും പൂർത്തിയായ അനുഗ്രഹപ്രവൃത്തിയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു; പ്രത്യേക വ്യാഖ്യാനപരമായ അർഥം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. തുടർച്ചയായ സർവനാമങ്ങൾ ആരെ സൂചിപ്പിക്കുന്നു എന്ന ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ആദ്യ രണ്ടു വാക്യങ്ങളിൽ ‘യാക്കോബ്’, ‘യിസ്ഹാക്ക്’ എന്നീ പേരുകൾ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കി. ‘മണം’ എന്ന പദത്തിന്റെ ആവർത്തനം മൂലപാഠത്തിന്റെ ശൈലിക്കായി മനപ്പൂർവം നിലനിർത്തി.
