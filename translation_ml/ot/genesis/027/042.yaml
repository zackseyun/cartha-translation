revisions:
- from: 'ഏശാവിന്റെ വാക്കുകൾ അവന്റെ അമ്മയായ റിബെക്കയെ അറിയിച്ചു. അപ്പോൾ അവൾ ആളയച്ച് തന്റെ ഇളയ മകനായ യാക്കോബിനെ വിളിപ്പിച്ച് അവനോട് പറഞ്ഞു: “നോക്കൂ, നിന്റെ സഹോദരനായ ഏശാവ് നിന്നെ കൊല്ലുന്നതിനെക്കുറിച്ച് ആലോചിച്ച് സ്വയം ആശ്വസിക്കുകയാണ്.”'
  to: 'റിബെക്കയോട് അവളുടെ മൂത്ത മകനായ ഏശാവിന്റെ വാക്കുകൾ അറിയിച്ചു. അപ്പോൾ അവൾ ആളയച്ച് തന്റെ ഇളയ മകനായ യാക്കോബിനെ വിളിച്ചുവരുത്തി അവനോടു പറഞ്ഞു: “നോക്കൂ, നിന്റെ സഹോദരനായ ഏശാവ് നിന്നെ കൊല്ലുമെന്ന ചിന്തയിൽ സ്വയം ആശ്വസിക്കുകയാണ്.”'
  rationale: A safe, necessary correction restores the omitted ‘older son’ designation. The final clause is adjusted slightly to express Esau’s self-consolation in relation to his intention to kill Jacob, without overstating the degree to which a concrete plan has been formed.
