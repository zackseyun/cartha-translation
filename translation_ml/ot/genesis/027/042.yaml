source:
  edition: WLC
  text: וַ/יֻּגַּ֣ד לְ/רִבְקָ֔ה אֶת דִּבְרֵ֥י עֵשָׂ֖ו בְּנָ֣/הּ הַ/גָּדֹ֑ל וַ/תִּשְׁלַ֞ח וַ/תִּקְרָ֤א לְ/יַעֲקֹב֙ בְּנָ֣/הּ הַ/קָּטָ֔ן וַ/תֹּ֣אמֶר אֵלָ֔י/ו הִנֵּה֙ עֵשָׂ֣ו אָחִ֔י/ךָ מִתְנַחֵ֥ם לְ/ךָ֖ לְ/הָרְגֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/042.yaml
  text: And the words of Esau, her older son, were told to Rebekah. So she sent and called Jacob, her younger son, and said to him, “Look, Esau your brother is consoling himself about you by planning to kill you.”
translation:
  language: ml
  text: 'റിബെക്കയോട് അവളുടെ മൂത്ത മകനായ ഏശാവിന്റെ വാക്കുകൾ അറിയിച്ചു. അപ്പോൾ അവൾ ആളയച്ച് തന്റെ ഇളയ മകനായ യാക്കോബിനെ വിളിച്ചുവരുത്തി അവനോടു പറഞ്ഞു: “നോക്കൂ, നിന്റെ സഹോദരനായ ഏശാവ് നിന്നെ കൊല്ലുമെന്ന ചിന്തയിൽ സ്വയം ആശ്വസിക്കുകയാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי עֵשָׂו
  choice: ഏശാവിന്റെ വാക്കുകൾ
  rationale: ‘വാക്കുകൾ/കാര്യങ്ങൾ’ എന്ന ഹീബ്രു പ്രയോഗം ഇവിടെ ഏശാവ് പറഞ്ഞ കൊലഭീഷണിയെ സൂചിപ്പിക്കുന്നു; നേരിട്ടും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തി.
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: അവൾ ആളയച്ച് ... വിളിപ്പിച്ച്
  rationale: ആളെ അയച്ച് വിളിച്ചുവരുത്തുക എന്ന ഹീബ്രു ക്രിയാനിരയുടെ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: מִתְנַחֵם
  choice: സ്വയം ആശ്വസിക്കുകയാണ്
  rationale: ഹിത്പയേൽ രൂപത്തിന്റെ പ്രതിഫലനാർഥവും പ്രതികാരചിന്തയിൽ ആശ്വാസം കണ്ടെത്തുന്നു എന്ന അസ്വസ്ഥമായ ഭാവവും നിലനിർത്തുന്നു.
- source_word: לְהָרְגֶךָ
  choice: നിന്നെ കൊല്ലുന്നതിനെക്കുറിച്ച് ആലോചിച്ച്
  rationale: കൊല്ലുക എന്ന ഉദ്ദേശ്യമാണ് അവന്റെ ആശ്വാസത്തിന് ആധാരമെന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പ്രവൃത്തി ഇതിനകം നടന്നുവെന്ന ധ്വനി ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ഏശാവിന്റെ മനോഭാവത്തെ എത്രത്തോളം വ്യാഖ്യാനിക്കണം
  choice: ‘നിന്നെ കൊല്ലുന്നതിനെക്കുറിച്ച് ആലോചിച്ച് സ്വയം ആശ്വസിക്കുകയാണ്’
  alternative: ‘നിന്നെ കൊല്ലാൻ ഒരുങ്ങി സ്വയം ആശ്വസിക്കുകയാണ്’
  rationale: മൂലപാഠം കൊലചിന്തയിലൂടെ ആശ്വാസം കണ്ടെത്തുന്നതായി പറയുന്നു; പ്രായോഗിക പദ്ധതി എത്രത്തോളം രൂപപ്പെട്ടുവെന്ന് അധികമായി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘മൂത്ത മകൻ/ഇളയ മകൻ’ എന്ന വൈരുധ്യം നിലനിർത്താൻ ആദ്യ വാക്യത്തിൽ ബന്ധം സ്വാഭാവികമായി പുനഃക്രമീകരിച്ചു; എന്നാൽ ‘മൂത്ത’ എന്ന ഘടകം അബദ്ധത്തിൽ നഷ്ടപ്പെടാതിരിക്കാൻ പ്രസിദ്ധീകരണപരിശോധനയിൽ ശ്രദ്ധ വേണം.
