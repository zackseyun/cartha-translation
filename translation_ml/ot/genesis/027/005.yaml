translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇര’ ഉപയോഗിച്ച് ജീവിവർഗം അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നത് ഒഴിവാക്കി; കൃഡന്തത്തിന്റെ തുടരുന്ന ഭാവം മുഖ്യപാഠത്തിലും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിലും നിലനിർത്തി.
