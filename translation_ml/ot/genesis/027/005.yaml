source:
  edition: WLC
  text: וְ/רִבְקָ֣ה שֹׁמַ֔עַת בְּ/דַבֵּ֣ר יִצְחָ֔ק אֶל עֵשָׂ֖ו בְּנ֑/וֹ וַ/יֵּ֤לֶךְ עֵשָׂו֙ הַ/שָּׂדֶ֔ה לָ/צ֥וּד צַ֖יִד לְ/הָבִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/005.yaml
  text: Rebekah was listening when Isaac spoke to Esau his son[b][a], and Esau went to the field to hunt game and bring it back.
translation:
  language: ml
  text: യിസ്ഹാക്ക് തന്റെ മകനായ ഏശാവിനോടു സംസാരിക്കുമ്പോൾ റിബെക്ക ശ്രദ്ധിച്ചുകേൾക്കുകയായിരുന്നു.[a] വേട്ടയാടി ഇരയെ കൊണ്ടുവരാൻ[b] ഏശാവ് വയലിലേക്കു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യിസ്ഹാക്ക് തന്റെ മകനായ ഏശാവിനോടു സംസാരിക്കുമ്പോൾ റിബെക്ക കേട്ടു.” എബ്രായത്തിലെ കൃഡന്തപ്രയോഗം തുടരുന്ന കേൾവിയായോ ലളിതമായി കേട്ട സംഭവമായോ പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “ഇരയെ വേട്ടയാടി കൊണ്ടുവരാൻ.” എബ്രായത്തിൽ ‘വേട്ടയാടുക’, ‘കൊണ്ടുവരുക’ എന്നീ രണ്ട് ഉദ്ദേശ്യപ്രവൃത്തികൾ അടുത്തടുത്തായി വരുന്നു.'
    reason: previous_rendering
lexical_decisions:
- source_word: וְ/רִבְקָה
  choice: റിബെക്ക
  rationale: വാക്യാരംഭത്തിലെ וְ ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേകമായ ‘അപ്പോൾ’ ചേർക്കാതെ സ്വാഭാവികമായി തുടർച്ച നിലനിർത്താം.
- source_word: שֹׁמַעַת
  choice: ശ്രദ്ധിച്ചുകേൾക്കുകയായിരുന്നു
  rationale: വർത്തമാന കൃഡന്തം പശ്ചാത്തലത്തിൽ തുടരുന്ന കേൾവിയെ സൂചിപ്പിക്കുന്നു; മനപ്പൂർവം കേൾക്കുന്നതിന്റെ ഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּ/דַבֵּר
  choice: സംസാരിക്കുമ്പോൾ
  rationale: בְ + infinitive construct സമകാലികമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶל עֵשָׂו בְּנ/וֹ
  choice: തന്റെ മകനായ ഏശാവിനോടു
  rationale: സംസാരത്തിന്റെ ദിശയും ‘അവന്റെ മകൻ’ എന്ന ബന്ധവും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַ/יֵּלֶךְ עֵשָׂו הַ/שָּׂדֶה
  choice: ഏശാവ് വയലിലേക്കു പോയി
  rationale: ആഖ്യാനത്തിലെ ലളിതമായ ചലനവും שׂדה എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥവും നിലനിർത്തുന്നു.
- source_word: לָ/צוּד צַיִד
  choice: വേട്ടയാടി ഇര പിടിക്കാൻ
  rationale: צוד എന്നത് വേട്ടയാടലിനെയും ציד വേട്ടയിലൂടെ ലഭിക്കുന്ന ഇരയെയും സൂചിപ്പിക്കുന്നു; ‘മാൻമാംസം’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: לְ/הָבִיא
  choice: പിടിച്ചുകൊണ്ടുവരാൻ
  rationale: രണ്ടാമത്തെ ഉദ്ദേശ്യപ്രവൃത്തി വ്യക്തമാക്കുകയും ഇരയുമായി മടങ്ങിവരുന്ന സന്ദർഭം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
