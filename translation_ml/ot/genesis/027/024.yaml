  yaml_path: translation/ot/genesis/027/024.yaml
  text: He said[a], “Are you really my son Esau?” And he said, “I am.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു[a]: “നീ എന്റെ മകൻ ഏശാവ് തന്നെയാണോ?” അവൻ പറഞ്ഞു: “ഞാൻ തന്നെയാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, “നീ ഈയാളാണോ, എന്റെ മകൻ ഏശാവ്?” എന്നാണ്. സ്വതന്ത്ര സർവനാമത്തോടൊപ്പമുള്ള ‘ഈയാൾ’ എന്ന സൂചന തിരിച്ചറിയൽ ഉറപ്പാക്കുന്ന ഊന്നലുള്ള ചോദ്യമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ ചോദിച്ചു
  rationale: אמר എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘പറഞ്ഞു’ എന്നാണെങ്കിലും, പിന്നാലെയുള്ള ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ ‘ചോദിച്ചു’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: אַתָּה זֶה
  choice: നീ തന്നെയാണോ
  rationale: സ്വതന്ത്ര സർവനാമത്തോടൊപ്പം വന്നിരിക്കുന്ന זֶה തിരിച്ചറിയൽ ഉറപ്പാക്കുന്ന ഊന്നൽ നൽകുന്നു; ‘നീ തന്നെയാണോ’ അത് സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּנִי
  choice: എന്റെ മകൻ
  rationale: ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: עֵשָׂו
  choice: ഏശാവ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിച്ചു.
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: മറുപടിയെ പരിചയപ്പെടുത്തുന്ന ആവർത്തിത אמר ലളിതമായി നിലനിർത്തി.
- source_word: אָנִי
  choice: ഞാൻ തന്നെയാണ്
  rationale: തിരിച്ചറിയൽ ചോദ്യത്തിനുള്ള ഹ്രസ്വവും ഊന്നലുള്ളതുമായ മറുപടിയായി സ്വതന്ത്ര സർവനാമത്തിന്റെ പ്രാബല്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
