translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ കുടുംബസംഭാഷണ ശൈലി സ്വീകരിച്ചു. ആജ്ഞയെ נָא സൂചിപ്പിക്കുന്ന വിനയത്തോടെ അവതരിപ്പിക്കുകയും, കഥനത്തിന്റെ ഗൗരവം നിലനിർത്തുകയും ചെയ്തു. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന מַטְעַמִּים എന്ന പദത്തിന്റെ പരിഭാഷയ്ക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
