id: GEN.27.9
reference: Genesis 27:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֶךְ נָא֙ אֶל הַ/צֹּ֔אן וְ/קַֽח לִ֣/י מִ/שָּׁ֗ם שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים טֹבִ֑ים וְ/אֶֽעֱשֶׂ֨ה אֹתָ֧/ם מַטְעַמִּ֛ים לְ/אָבִ֖י/ךָ כַּ/אֲשֶׁ֥ר אָהֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/009.yaml
  text: Please go to the flock and get for me from there two good young goats[a], and I will make them into tasty food for your father, just as he loves.
translation:
  language: ml
  text: ദയവായി ആട്ടിൻകൂട്ടത്തിന്റെ അടുക്കലേക്കു ചെന്ന്, അവിടെനിന്ന് എനിക്കുവേണ്ടി നല്ല രണ്ടു കോലാട്ടിൻകുട്ടികളെ എടുക്കുക. നിന്റെ അപ്പന് ഇഷ്ടമുള്ളതുപോലെ ഞാൻ അവകൊണ്ട് രുചികരമായ വിഭവങ്ങൾ[a] ഉണ്ടാക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സ്വാദിഷ്ടമായ ഭക്ഷണം’ അല്ലെങ്കിൽ ‘വിശിഷ്ട വിഭവങ്ങൾ’.
    reason: מַטְעַמִּים എന്ന പദത്തിന് രുചികരമായ ഭക്ഷണം, സ്വാദിഷ്ട വിഭവങ്ങൾ, വിശിഷ്ട വിഭവങ്ങൾ എന്നീ അടുത്ത അർഥങ്ങൾ സാധ്യമാണ്.
lexical_decisions:
- source_word: לֶךְ נָא
  choice: ദയവായി ... ചെന്ന്
  rationale: לֶךְ എന്ന ഏകവചന പുരുഷലിംഗ ആജ്ഞയും അതിനെ മയപ്പെടുത്തുന്ന נָא എന്ന കണികയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הַצֹּאן
  choice: ആട്ടിൻകൂട്ടം
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ കന്നുകാലിക്കൂട്ടത്തെ സൂചിപ്പിക്കാം. തുടർന്നുള്ള കോലാട്ടിൻകുട്ടികളുടെ പരാമർശത്തോട് യോജിക്കുന്ന പൊതുവായ മലയാളപ്രയോഗമാണ് ‘ആട്ടിൻകൂട്ടം’.
- source_word: וְקַח לִי מִשָּׁם
  choice: അവിടെനിന്ന് ... എനിക്കായി എടുത്തുകൊണ്ടുവരിക
  rationale: לקח എന്നതിന്റെ ‘എടുക്കുക/നേടുക’ എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട്, അമ്മയുടെ അടുത്തേക്കു മൃഗങ്ങളെ എത്തിക്കേണ്ട സന്ദർഭം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שְׁנֵי גְּדָיֵי עִזִּים
  choice: രണ്ടു കോലാട്ടിൻകുട്ടികൾ
  rationale: ‘കോലാടുകളുടെ രണ്ടു കുട്ടികൾ’ എന്ന ഘടനയുടെ പ്രായവും ഇനവും വ്യക്തമായി നൽകുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: טֹבִים
  choice: നല്ല
  rationale: മൃഗങ്ങളുടെ ഗുണമേന്മയും പാചകത്തിനുള്ള അനുയോജ്യതയും അനാവശ്യ വ്യാഖ്യാനം കൂടാതെ പ്രകടമാക്കുന്നു.
- source_word: וְאֶעֱשֶׂה אֹתָם מַטְעַמִּים
  choice: ഞാൻ അവയെ രുചികരമായ വിഭവങ്ങളാക്കി തയ്യാറാക്കാം
  rationale: מַטְעַמִּים എന്ന ബഹുവചനപദത്തിന്റെ രുചികരമായ തയ്യാറാക്കിയ ഭക്ഷണവിഭവങ്ങൾ എന്ന അർഥം നിലനിർത്തുന്നു; ആടുകളെ ഉപയോഗിച്ച് വിഭവങ്ങൾ തയ്യാറാക്കുന്നതാണ് ഉദ്ദേശമെന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
- source_word: לְאָבִיךָ
  choice: നിന്റെ അപ്പന്
  rationale: കുടുംബസംഭാഷണത്തിന് യോജിച്ച, സാധാരണക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന മാന്യവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: כַּאֲשֶׁר אָהֵב
  choice: ഇഷ്ടമുള്ളതുപോലെ
  rationale: יצחקിന് ഇഷ്ടപ്പെടുന്ന രീതിയിലുള്ള ഭക്ഷണം എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; മൂലത്തിലെ കർത്താവ് സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ ആവർത്തിക്കുന്നില്ല.
