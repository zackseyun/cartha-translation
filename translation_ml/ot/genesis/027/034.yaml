  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ/שְׁמֹ֤עַ עֵשָׂו֙ אֶת דִּבְרֵ֣י אָבִ֔י/ו וַ/יִּצְעַ֣ק צְעָקָ֔ה גְּדֹלָ֥ה וּ/מָרָ֖ה עַד מְאֹ֑ד וַ/יֹּ֣אמֶר לְ/אָבִ֔י/ו בָּרֲכֵ֥/נִי גַם אָ֖נִי אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/034.yaml
  text: When Esau heard his father’s words[a], he cried out with an exceedingly great and bitter cry, and said to his father, “Bless me too, my father!”
translation:
  language: ml
  text: ഏശാവ് തന്റെ അപ്പന്റെ വാക്കുകൾ കേട്ടപ്പോൾ, അത്യന്തം വലിയതും കയ്പേറിയതുമായ ഒരു നിലവിളി മുഴക്കി[a]; അവൻ തന്റെ അപ്പനോട്, “എന്റെ അപ്പാ, എന്നെയും അനുഗ്രഹിക്കണമേ!” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ രൂപാനുസൃതമായി: “അത്യന്തം വലിയതും കയ്പേറിയതുമായ ഒരു നിലവിളിയോടെ അവൻ നിലവിളിച്ചു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: കേട്ടപ്പോൾ
  rationale: כִּי ചേർന്ന infinitive construct ഇവിടെ കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. ‘കേട്ടപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഉടനടി എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: דִּבְרֵי אָבִיו
  choice: തന്റെ അപ്പന്റെ വാക്കുകൾ
  rationale: דָּבָר എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘വാക്കുകൾ’ നിലനിർത്തുന്നു. പ്രതിഫലനസൂചകമായ ‘തന്റെ’ ആരുടെ അപ്പനാണെന്നത് മലയാളത്തിൽ വ്യക്തമായി കാണിക്കുന്നു.
- source_word: וַיִּצְעַק צְעָקָה
  choice: ഒരു നിലവിളി മുഴക്കി
  rationale: ഒരേ ധാതുവിൽനിന്നുള്ള ക്രിയ-നാമ പ്രയോഗം പ്രവർത്തിയുടെ തീവ്രത കൂട്ടുന്നു. അതേ ആവർത്തനം മലയാള മുഖ്യപാഠത്തിൽ കൃത്രിമമാകുന്നതിനാൽ സ്വാഭാവികമായ ‘നിലവിളി മുഴക്കി’ ഉപയോഗിച്ചു; കൂടുതൽ രൂപാനുസൃതമായ പ്രയോഗം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: גְּדֹלָה וּמָרָה עַד מְאֹד
  choice: അത്യന്തം വലിയതും കയ്പേറിയതുമായ
  rationale: ‘വലിയ’, ‘കയ്പേറിയ’, ‘അത്യന്തം’ എന്നീ ഘടകങ്ങൾ മൂലപാഠത്തിലെ വ്യാപ്തിയും മാനസികവേദനയും തീവ്രതയും വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: בָּרֲכֵנִי גַם אָנִי
  choice: എന്നെയും അനുഗ്രഹിക്കണമേ
  rationale: പ്രത്യക്ഷമായ അപേക്ഷയും גַם എന്നതിലെ ‘കൂടി/യും’ എന്ന ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: אָבִי
  choice: എന്റെ അപ്പാ
  rationale: ഒന്നാംപുരുഷ ഉടമസൂചകപ്രത്യയം വ്യക്തമായി നിലനിർത്തുകയും ഏശാവിന്റെ വികാരഭരിതമായ നേരിട്ടുള്ള അഭിസംബോധന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
