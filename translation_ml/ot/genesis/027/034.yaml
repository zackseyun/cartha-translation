translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. വിവരണത്തിൽ ‘അപ്പൻ’, നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അപ്പാ’ എന്നിവ കുടുംബബന്ധത്തിന്റെ അടുപ്പവും മൂലപാഠത്തിലെ വികാരതീവ്രതയും നിലനിർത്തുന്നു.
