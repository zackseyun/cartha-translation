source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַבְרָ֧ם וְ/נָח֛וֹר לָ/הֶ֖ם נָשִׁ֑ים שֵׁ֤ם אֵֽשֶׁת אַבְרָם֙ שָׂרָ֔י וְ/שֵׁ֤ם אֵֽשֶׁת נָחוֹר֙ מִלְכָּ֔ה בַּת הָרָ֥ן אֲבִֽי מִלְכָּ֖ה וַֽ/אֲבִ֥י יִסְכָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/029.yaml
  text: Abram and Nahor took wives for themselves. The name of Abram’s wife was Sarai[a], and the name of Nahor’s wife was Milcah, the daughter of Haran, the father of Milcah and of Iscah.
translation:
  language: ml
  text: അബ്രാമും നാഹോരും തങ്ങൾക്കായി ഭാര്യമാരെ സ്വീകരിച്ചു.[a] അബ്രാമിന്റെ ഭാര്യയുടെ പേര് സാറായി; നാഹോരിന്റെ ഭാര്യയുടെ പേര് മിൽക്കാ. മിൽക്കായുടെയും യിസ്കായുടെയും പിതാവായ ഹാരാന്റെ മകളായിരുന്നു മിൽക്കാ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ പ്രയോഗസഹജമായി: “അബ്രാമും നാഹോരും വിവാഹം കഴിച്ചു.” എബ്രായത്തിൽ അക്ഷരാർഥം “തങ്ങൾക്കായി ഭാര്യമാരെ എടുത്തു” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: സ്വീകരിച്ചു
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘എടുത്തു’ എന്നാണെങ്കിലും വിവാഹസന്ദർഭത്തിൽ മലയാളത്തിലെ ‘ഭാര്യമാരെ സ്വീകരിച്ചു’ എന്ന പ്രയോഗം ഉറവിടഭാഷയിലെ രൂപകം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികവും മാന്യവുമായി അർഥം നൽകുന്നു.
- source_word: לָהֶם
  choice: തങ്ങൾക്കായി
  rationale: മുൻപറഞ്ഞ ഇരുവരും ഓരോരുത്തരും സ്വന്തം ഭാര്യയെ സ്വീകരിച്ചു എന്ന വ്യക്തിപരമായ/പ്രതിഫലനപരമായ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: נָשִׁים
  choice: ഭാര്യമാരെ
  rationale: പദത്തിന് ‘സ്ത്രീകൾ’ എന്നും അർഥമുണ്ടെങ്കിലും ഇവിടെ വിവാഹസന്ദർഭം ‘ഭാര്യമാർ’ എന്ന അർഥം നിർണ്ണയിക്കുന്നു.
- source_word: שֵׁם
  choice: പേര്
  rationale: ഉറവിടത്തിലെ ‘പേര്’ എന്ന നാമവാക്യഘടന ആവർത്തിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: אֵשֶׁת
  choice: ഭാര്യ
  rationale: ഭർത്താവിന്റെ പേരോടുചേർന്ന ഈ ഘടനയിൽ പദം വ്യക്തമായി ‘ഭാര്യ’ എന്ന അർഥത്തിലാണ്.
- source_word: שָׂרָי
  choice: സാറായി
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: מִלְכָּה
  choice: മിൽക്കാ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בַּת
  choice: മകൾ
  rationale: സാധാരണ പുത്രീബന്ധപദം; സന്ദർഭത്തിൽ മറ്റൊരു അർഥം ആവശ്യപ്പെടുന്നില്ല.
- source_word: הָרָן
  choice: ഹാരാൻ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֲבִי
  choice: പിതാവായ
  rationale: സമീപ വംശാവലിസന്ദർഭത്തിൽ אָב എന്ന പദത്തിന്റെ നേരിട്ടുള്ള ‘പിതാവ്’ എന്ന അർഥം യോജിക്കുന്നു.
- source_word: יִסְכָּה
  choice: യിസ്കാ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഭാര്യമാരെ എടുത്തു’ എന്ന അക്ഷരാർഥരൂപം മലയാളത്തിൽ തെറ്റിദ്ധാരണയ്ക്കിടയാക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ‘ഭാര്യമാരെ സ്വീകരിച്ചു’ എന്നു നൽകി; കൂടുതൽ സ്വാഭാവികമായ വിവാഹപ്രയോഗവും അക്ഷരാർഥവും അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു. അവസാന വാക്യത്തിൽ ഹീബ്രുവിലെ മിൽക്കാ എന്ന പേരിന്റെ ആവർത്തനവും ഹാരാൻ ഇരുവരുടെയും പിതാവാണെന്ന ബന്ധവും നിലനിർത്തി.
