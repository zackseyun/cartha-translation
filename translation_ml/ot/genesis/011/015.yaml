id: GEN.11.15
reference: Genesis 11:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְחִי שֶׁ֗לַח אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת עֵ֔בֶר שָׁלֹ֣שׁ שָׁנִ֔ים וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/015.yaml
  text: And Shelah lived 403 years after he fathered Eber[a], and he fathered sons and daughters.
translation:
  language: ml
  text: ഏബെരിന് പിതാവായശേഷം ശേലഹ് 403 വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാർക്കും പുത്രിമാർക്കും പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചു
  rationale: വംശാവലിസൂത്രത്തിൽ חיה എന്ന ക്രിയയുടെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളരൂപം.
- source_word: שֶׁלַח
  choice: ശേലഹ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത ആധുനിക മലയാള ലിപ്യന്തരണം.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת עֵבֶר
  choice: ഏബെരിനെ ജനിപ്പിച്ചശേഷം
  rationale: הוליד എന്ന causative ക്രിയ ഇവിടെ പുരുഷവംശാവലിയിൽ ‘പിതാവായി/ജനിപ്പിച്ചു’ എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ ‘ജനിപ്പിച്ചശേഷം’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 വർഷം
  rationale: ‘മൂന്നു വർഷവും നാനൂറു വർഷവും’ എന്ന എബ്രായ സംഖ്യാഘടനയുടെ അർഥം സ്വാഭാവികമായ ആധുനിക സംഖ്യാരൂപത്തിൽ നൽകുന്നു.
- source_word: וַיּוֹלֶד
  choice: ജനിപ്പിച്ചു
  rationale: പുരുഷൻ കർത്താവായ വംശാവലിസന്ദർഭത്തിൽ ילד എന്ന ക്രിയയുടെ പിതൃത്വസംബന്ധിയായ അർഥം നിലനിർത്തുന്നു.
- source_word: בָּנִים וּבָנוֹת
  choice: പുത്രന്മാരെയും പുത്രിമാരെയും
  rationale: മൂലപാഠം ആൺമക്കളെയും പെൺമക്കളെയും പ്രത്യേകം പറയുന്നതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനു പകരം ആ വ്യത്യാസം സംരക്ഷിക്കുന്നു.
