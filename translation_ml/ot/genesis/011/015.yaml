translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി. എബ്രായ പദക്രമം അക്ഷരാർഥത്തിൽ അനുകരിക്കാതെ, കാലദൈർഘ്യവും അതിന്റെ ആരംഭബിന്ദുവും വ്യക്തമായി ബന്ധിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളക്രമം ഉപയോഗിച്ചു.
