- from: 'അവർ പറഞ്ഞു: “വരൂ, നമുക്കുവേണ്ടി ഒരു നഗരവും ആകാശത്തോളം തലയുയർത്തിനിൽക്കുന്ന ഒരു ഗോപുരവും പണിയാം[a]. നമുക്കായി ഒരു പേര് ഉണ്ടാക്കാം; അല്ലെങ്കിൽ നാം ഭൂമിയിലെങ്ങും ചിതറിപ്പോകും.”'
  to: 'അവർ പറഞ്ഞു: “വരൂ, നമുക്കുവേണ്ടി ഒരു നഗരവും അതിന്റെ ശിഖരം ആകാശങ്ങളിൽ ഉള്ള ഒരു ഗോപുരവും പണിയാം[a]; നമുക്കായി ഒരു പേര് ഉണ്ടാക്കാം; അല്ലെങ്കിൽ നാം മുഴുവൻ ഭൂമിയിലും ചിതറിപ്പോകും.”'
