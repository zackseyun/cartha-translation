id: GEN.11.4
reference: Genesis 11:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ הָ֣בָ/ה נִבְנֶה לָּ֣/נוּ עִ֗יר וּ/מִגְדָּל֙ וְ/רֹאשׁ֣/וֹ בַ/שָּׁמַ֔יִם וְ/נַֽעֲשֶׂה לָּ֖/נוּ שֵׁ֑ם פֶּן נָפ֖וּץ עַל פְּנֵ֥י כָל הָ/אָֽרֶץ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/004.yaml
  text: And they said[a], “Come, let us build for ourselves a city and a tower with its top in the heavens, and let us make a name for ourselves[b], lest we be scattered over the face of the whole earth.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “വരൂ, നമുക്കുവേണ്ടി ഒരു നഗരവും അതിന്റെ ശിഖരം ആകാശങ്ങളിൽ ഉള്ള ഒരു ഗോപുരവും പണിയാം[a]; നമുക്കായി ഒരു പേര് ഉണ്ടാക്കാം; അല്ലെങ്കിൽ നാം മുഴുവൻ ഭൂമിയിലും ചിതറിപ്പോകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അതിന്റെ ശിഖരം ആകാശങ്ങളോളം എത്തുന്ന ഒരു ഗോപുരം.” എബ്രായത്തിൽ അക്ഷരാർഥം, “അതിന്റെ ശിഖരം ആകാശങ്ങളിൽ [ഉള്ള] ഒരു ഗോപുരം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: വരൂ
  rationale: കൂട്ടായ പ്രവർത്തനത്തിലേക്കു ക്ഷണിക്കുന്ന ആഹ്വാനത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: נִבְנֶה לָּנוּ
  choice: നമുക്കുവേണ്ടി ... പണിയാം
  rationale: ഒന്നാം പുരുഷ ബഹുവചനത്തിലെ ആഹ്വാനഭാവവും לָּנוּ എന്ന ദാതൃസർവനാമത്തിന്റെ സ്വാർത്ഥക അർത്ഥവും വ്യക്തമായി നൽകുന്നു.
- source_word: עִיר וּמִגְדָּל
  choice: ഒരു നഗരവും ... ഒരു ഗോപുരവും
  rationale: രണ്ടു നാമങ്ങളുടെയും അടിസ്ഥാന അർത്ഥം അനാവശ്യമായ സൈനികമോ വാസ്തുശില്പപരമോ ആയ വിശദീകരണം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: וְרֹאשׁוֹ בַשָּׁמַיִם
  choice: ആകാശത്തോളം തലയുയർത്തിനിൽക്കുന്ന
  rationale: അക്ഷരാർഥം ‘അതിന്റെ തല ആകാശങ്ങളിൽ’ എന്നാണ്; മലയാളത്തിൽ ദൃശ്യഭാവം സ്വാഭാവികമായി കൈമാറുന്നതിനൊപ്പം അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְנַעֲשֶׂה לָּנוּ שֵׁם
  choice: നമുക്കായി ഒരു പേര് ഉണ്ടാക്കാം
  rationale: ‘പേര് ഉണ്ടാക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സാഹിത്യശക്തിയും പ്രശസ്തി നേടുക എന്ന സൂചനയും നിലനിർത്തുന്നു.
- source_word: פֶּן נָפוּץ
  choice: അല്ലെങ്കിൽ നാം ... ചിതറിപ്പോകും
  rationale: פֶּן സൂചിപ്പിക്കുന്ന ഭയപ്പെടുന്ന ഫലം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; נָפוּץ എന്നതിന്റെ ചിതറിപ്പോകുക എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: ഭൂമിയിലെങ്ങും
  rationale: ‘മുഴുവൻ ഭൂമിയുടെ ഉപരിതലത്തിൽ’ എന്ന ആശയം സാധാരണ വായനക്കാർക്കു സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: ബാബേൽ വിവരണത്തിലെ הָאָרֶץ എന്നതിന്റെ വ്യാപ്തി
  choice: ഭൂമി
  alternative: ദേശം
  rationale: ഉല്പത്തി 11-ന്റെ ആദിചരിത്രസന്ദർഭത്തിൽ മനുഷ്യർ അധിവസിക്കുന്ന ലോകമെങ്ങും വ്യാപിക്കുന്നതാണ് വിഷയം; അതിനാൽ പ്രാദേശികമായ ‘ദേശം’ എന്നതിനെക്കാൾ ‘ഭൂമി’ യോജിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ കൂട്ടായ ആഹ്വാനവും ഗോപുരത്തിന്റെ അതിശയോക്തിപരമായ ദൃശ്യപ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
