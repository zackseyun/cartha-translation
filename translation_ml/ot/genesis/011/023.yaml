id: GEN.11.23
reference: Genesis 11:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְחִ֣י שְׂר֗וּג אַחֲרֵ֛י הוֹלִיד֥/וֹ אֶת נָח֖וֹר מָאתַ֣יִם שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/023.yaml
  text: And Serug lived two hundred years after he fathered Nahor, and he fathered sons and daughters.
translation:
  language: ml
  text: നാഹോരിന് പിതാവായശേഷം സെരൂഗ് ഇരുനൂറ് വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാർക്കും പുത്രിമാർക്കും പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചു
  rationale: വംശാവലിവാക്യങ്ങളിൽ חיה എന്ന ക്രിയയുടെ സ്വാഭാവികവും മാന്യവുമായ മലയാള തുല്യപദം; ആയുസ്സിന്റെ തുടർന്നുള്ള കാലയളവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: שְׂרוּג
  choice: സെരൂഗ്
  rationale: എബ്രായ ഉച്ചാരണത്തെ സമീപിക്കുന്ന രീതിയിൽ വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: אַחֲרֵי
  choice: ശേഷം
  rationale: തുടർന്നുള്ള സമയത്തെ സൂചിപ്പിക്കുന്ന കാലസംബന്ധിയായ പൂർവപ്രയോഗം; മലയാളത്തിൽ ക്രിയാവിശേഷണഘടനയോട് സ്വാഭാവികമായി ചേരുന്നു.
- source_word: הוֹלִידוֹ
  choice: ജനിപ്പിച്ച
  rationale: ילד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം പിതാവിനെ വിഷയമാക്കിയ വംശാവലിസന്ദർഭത്തിൽ സന്താനോത്പാദനത്തെ സൂചിപ്പിക്കുന്നു; 'ജനിപ്പിക്കുക' അർത്ഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നാഹോരിനെ നിർദിഷ്ട കർമമായി അടയാളപ്പെടുത്തുന്ന എബ്രായ വ്യാകരണഘടകം; മലയാളത്തിൽ പ്രത്യേകം തുല്യപദം ആവശ്യമില്ല.
- source_word: נָחוֹר
  choice: നാഹോർ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയോട് ചേർത്ത് നൽകി.
- source_word: מָאתַיִם שָׁנָה
  choice: ഇരുനൂറു വർഷം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന സംഖ്യാനാമഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַיּוֹלֶד
  choice: ജനിപ്പിച്ചു
  rationale: അതേ ילד ക്രിയയുടെ പിതൃവിഷയക അർത്ഥം നിലനിർത്തുകയും വാക്യത്തിനുള്ളിലെ പദസാമ്യം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: בָּנִים וּבָנוֹת
  choice: പുത്രന്മാരെയും പുത്രിമാരെയും
  rationale: എബ്രായമൂലത്തിൽ ആൺമക്കളെയും പെൺമക്കളെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ പൊതുവായ 'മക്കൾ' എന്നതിനു പകരം ആ വേർതിരിവ് നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. മൂലത്തിലെ രണ്ട് ילד ക്രിയാരൂപങ്ങൾക്കും 'ജനിപ്പിക്കുക' ഉപയോഗിച്ച് ആവർത്തനവും അർത്ഥബന്ധവും നിലനിർത്തി; അർദ്ധവിരാമം രണ്ട് സമനില വിവരണഘടകങ്ങളെ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
