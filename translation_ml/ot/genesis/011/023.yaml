- from: നാഹോരിനെ ജനിപ്പിച്ചശേഷം സെരൂഗ് ഇരുനൂറു വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാരെയും പുത്രിമാരെയും ജനിപ്പിച്ചു.
  to: നാഹോരിന് പിതാവായശേഷം സെരൂഗ് ഇരുനൂറ് വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാർക്കും പുത്രിമാർക്കും പിതാവായി.
