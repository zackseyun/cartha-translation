translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. പഴഞ്ചൻ ‘ജനിപ്പിച്ചു’ എന്ന രൂപത്തേക്കാൾ സ്വാഭാവികമായ ‘ജന്മം നൽകി’ ഉപയോഗിച്ചു; മൂലത്തിലെ വിവരം ഒന്നും കൂട്ടിച്ചേർത്തിട്ടില്ല.
