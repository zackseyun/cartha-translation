translation:
  language: ml
  text: ഏബെർ മുപ്പത്തിനാലു വർഷം ജീവിച്ചു; തുടർന്ന് പേലെഗിന് പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചശേഷം
  rationale: വംശാവലിയുടെ സൂത്രവാക്യത്തിൽ അടുത്ത സംഭവത്തിനു മുമ്പുള്ള ആയുസ്സിന്റെ കാലയളവാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ കാലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ജീവിച്ചശേഷം’ എന്നു നൽകി.
- source_word: עֵבֶר
  choice: ഏബെർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം ആധുനിക മലയാളലിപിയിൽ നേരിട്ട് പകർത്തി.
- source_word: אַרְבַּע וּשְׁלֹשִׁים שָׁנָה
  choice: മുപ്പത്തിനാലു വർഷം
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘നാലും മുപ്പതും വർഷം’ എന്ന ക്രമമാണെങ്കിലും, അതേ സംഖ്യ സ്വാഭാവികമായ ആധുനിക മലയാളക്രമത്തിൽ നൽകി.
- source_word: וַיּוֹלֶד
  choice: ജന്മം നൽകി
  rationale: പുരുഷൻ കർത്താവായുള്ള വംശാവലി സന്ദർഭത്തിൽ ילד സന്താനത്തെ ജനിപ്പിക്കുക/പിതാവാകുക എന്നർഥം നൽകുന്നു; ‘ജന്മം നൽകി’ വ്യക്തവും മാന്യവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമാണ്.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: ഇത് എബ്രായത്തിലെ നേരിട്ടുള്ള കർമസൂചകമാണ്; മലയാള വാക്യഘടനയിൽ അതിന്റെ പ്രവർത്തനം പ്രതിനിധീകരിക്കപ്പെടുന്നതിനാൽ പ്രത്യേക പദം ആവശ്യമില്ല.
- source_word: פָּלֶג
  choice: പേലെഗ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ നേരിട്ട് പകർത്തി.
