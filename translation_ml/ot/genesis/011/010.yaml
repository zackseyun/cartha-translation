  to: 'ശേമിന്റെ തലമുറകൾ ഇവയാണ്: ശേമിന് നൂറു വയസ്സായിരിക്കെ, പ്രളയം കഴിഞ്ഞ് രണ്ടു വർഷത്തിനുശേഷം അവൻ അർപ്പക്ഷദിനെ[a] ജനിപ്പിച്ചു.'
