source:
  edition: WLC
  text: אֵ֚לֶּה תּוֹלְדֹ֣ת שֵׁ֔ם שֵׁ֚ם בֶּן מְאַ֣ת שָׁנָ֔ה וַ/יּ֖וֹלֶד אֶת אַרְפַּכְשָׁ֑ד שְׁנָתַ֖יִם אַחַ֥ר הַ/מַּבּֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/010.yaml
  text: These are the generations of Shem. Shem was one hundred years old[a], and he fathered Arpachshad two years after the flood.
translation:
  language: ml
  text: 'ശേമിന്റെ തലമുറകൾ ഇവയാണ്: ശേമിന് നൂറു വയസ്സായിരിക്കെ, പ്രളയം കഴിഞ്ഞ് രണ്ടു വർഷത്തിനുശേഷം അവൻ അർപ്പക്ഷദിനെ[a] ജനിപ്പിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അർപ്പക്ഷദ് എന്ന പേര് ചില പാരമ്പര്യ വിവർത്തനങ്ങളിൽ ഗ്രീക്ക് നാമരൂപത്തെ പിന്തുടർന്ന് ‘അർഫക്സാദ്’ എന്നു കാണുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת שֵׁם
  choice: ശേമിന്റെ തലമുറകൾ ഇവയാണ്
  rationale: ഉല്പത്തിയിലെ ആവർത്തിതമായ വംശാവലി-ശീർഷക സൂത്രവാക്യം നിലനിർത്തുന്നു; תּוֹלְדֹת എന്നതിന്റെ വംശപരമ്പരാസൂചന നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: שֵׁם בֶּן מְאַת שָׁנָה
  choice: ശേമിന് നൂറു വയസ്സായപ്പോൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘നൂറു വയസ്സിന്റെ മകൻ’ എന്ന എബ്രായ പ്രായപ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; തുടർന്നുള്ള ക്രിയയുമായി കാലബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: וַיּוֹלֶד
  choice: ജനിപ്പിച്ചു
  rationale: വംശാവലി സന്ദർഭത്തിലെ ילד എന്ന ഹിഫീൽ രൂപം പിതൃത്വത്തിലൂടെയുള്ള ജനനത്തെ സൂചിപ്പിക്കുന്നു; ‘ജനിപ്പിച്ചു’ സംക്ഷിപ്തവും മലയാളത്തിൽ പരിചിതവുമാണ്.
- source_word: אַרְפַּכְשָׁד
  choice: അർപ്പക്ഷദ്
  rationale: ഗ്രീക്ക് രൂപത്തെക്കാൾ മസോററ്റിക് എബ്രായ നാമരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: שְׁנָתַיִם אַחַר הַמַּבּוּל
  choice: പ്രളയം കഴിഞ്ഞ് രണ്ടു വർഷത്തിനുശേഷം
  rationale: ദ്വിവചനമായ שְׁנָתַיִם കൃത്യമായി ‘രണ്ടു വർഷം’ എന്നും കാലസൂചകമായ אַחַר സ്വാഭാവിക മലയാള ക്രമത്തിൽ ‘കഴിഞ്ഞ്…ശേഷം’ എന്നും നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. മൂലത്തിലെ ആവർത്തിത തോലെദോത്ത് സൂത്രവാക്യം ‘തലമുറകൾ ഇവയാണ്’ എന്നു സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട നാമത്തിനുപിന്നിൽ ചേർത്തു.
