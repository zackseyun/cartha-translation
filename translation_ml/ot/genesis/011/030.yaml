id: GEN.11.30
reference: Genesis 11:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תְּהִ֥י שָׂרַ֖י עֲקָרָ֑ה אֵ֥ין לָ֖/הּ וָלָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/030.yaml
  text: Sarai was barren[a]; she had no child.
translation:
  language: ml
  text: സാറായി വന്ധ്യയായിരുന്നു[a]; അവൾക്കു കുട്ടിയുണ്ടായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സാറായി വന്ധ്യയായിരുന്നു; അവൾക്കു സന്തതിയില്ലായിരുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: ആയിരുന്നു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ היה ഇവിടെ ആഖ്യാനത്തിലെ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രത്യേകമായ ‘ഇപ്പോൾ’ എന്ന കാലസൂചകം ചേർക്കാതെ ഭൂതകാലസ്ഥിതി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שָׂרַי
  choice: സാറായി
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിക്ക് അനുസരിച്ച് നൽകിയിരിക്കുന്നു.
- source_word: עֲקָרָה
  choice: വന്ധ്യ
  rationale: ഈ വിശേഷണം ഗർഭം ധരിച്ച് പ്രസവിക്കാൻ കഴിയാത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘വന്ധ്യ’ സംക്ഷിപ്തവും മാന്യവും തുടർന്നുള്ള വിശദീകരണവാക്യത്തിൽനിന്ന് വ്യത്യസ്തവുമാണ്.
- source_word: אֵין לָהּ
  choice: അവൾക്കു ... ഉണ്ടായിരുന്നില്ല
  rationale: അസ്തിത്വനിഷേധവും ബന്ധസൂചകപ്രത്യയവും ചേർന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ കൈവശ/ബന്ധ നിർമാണമായി നൽകിയിരിക്കുന്നു.
- source_word: וָלָד
  choice: കുട്ടി
  rationale: ജനിച്ച സന്തതി എന്ന അർഥമുള്ള ഏകവചന നാമത്തിന് ഇവിടെ സാധാരണ വായനക്കാർക്കു സ്വാഭാവികമായ ‘കുട്ടി’ യോജിക്കുന്നു; ‘സന്തതി’യും സാധുവായ മറ്റൊരു സാധ്യതയാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ രണ്ടു സമാന്തര പ്രസ്താവനകളും നിലനിർത്തിയിരിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത വ്യക്തമായ കാലസൂചകമോ വ്യാഖ്യാനമോ ചേർത്തിട്ടില്ല.
