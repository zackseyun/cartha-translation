id: GEN.11.6
reference: Genesis 11:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה הֵ֣ן עַ֤ם אֶחָד֙ וְ/שָׂפָ֤ה אַחַת֙ לְ/כֻלָּ֔/ם וְ/זֶ֖ה הַחִלָּ֣/ם לַ/עֲשׂ֑וֹת וְ/עַתָּה֙ לֹֽא יִבָּצֵ֣ר מֵ/הֶ֔ם כֹּ֛ל אֲשֶׁ֥ר יָזְמ֖וּ לַֽ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/006.yaml
  text: And Yahweh said[a], "Behold, they are one people, and they all have one language, and this is what they have begun to do. And now nothing that they plan to do will be withheld from them."
translation:
  language: ml
  text: 'യഹോവ പറഞ്ഞു: “ഇതാ, ഇവരെല്ലാം ഒരേ ജനമാണ്; ഇവർക്കെല്ലാം ഒരേ ഭാഷയുമാണ്. ഇതാണ് അവർ ചെയ്യാൻ തുടങ്ങിയിരിക്കുന്നത്. ഇനി അവർ ചെയ്യാൻ പദ്ധതിയിടുന്നതൊന്നും അവർക്ക് അസാധ്യമാകുകയില്ല.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവർ ചെയ്യാൻ പദ്ധതിയിടുന്നതൊന്നും അവരിൽനിന്ന് തടഞ്ഞുവെക്കപ്പെടുകയില്ല.”'
    reason: לֹא יִבָּצֵר מֵהֶם എന്ന പ്രയോഗത്തിന് ‘അസാധ്യമാകുകയില്ല’ എന്നും ‘തടഞ്ഞുവെക്കപ്പെടുകയില്ല’ എന്നും സന്ദർഭയോഗ്യമായ അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു; പൊതുവായ സ്ഥാനനാമംകൊണ്ട് പകരുന്നില്ല.
- source_word: הֵן
  choice: ഇതാ
  rationale: ദൈവിക നിരീക്ഷണത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന പദത്തിന്റെ സൂചനാത്മകവും ഗൗരവമുള്ളതുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַם אֶחָד
  choice: ഒരേ ജനം
  rationale: രാഷ്ട്രീയ രാഷ്ട്രത്തെക്കാൾ ഒരു ഏകീകൃത ജനസമൂഹത്തെയാണ് עַם ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: וְשָׂפָה אַחַת לְכֻלָּם
  choice: ഇവർക്കെല്ലാം ഒരേ ഭാഷയുമാണ്
  rationale: שָׂפָה എന്നതിന്റെ അക്ഷരാർഥം ‘ചുണ്ട്’ ആണെങ്കിലും ഇവിടെ അത് ഭാഷയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; לְכֻלָּם എന്ന സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: וְזֶה הַחִלָּם לַעֲשׂוֹת
  choice: ഇതാണ് അവർ ചെയ്യാൻ തുടങ്ങിയിരിക്കുന്നത്
  rationale: הַחִלָּם എന്ന രൂപത്തിന്റെ ‘തുടങ്ങുക’ എന്ന അർഥം അധികമായ ഭാവികാല വ്യാഖ്യാനം ചേർക്കാതെ നേരിട്ട് നൽകുന്നു.
- source_word: לֹא יִבָּצֵר מֵהֶם
  choice: അവർക്ക് അസാധ്യമാകുകയില്ല
  rationale: בצר എന്ന നിഫാൽ രൂപം ഇവിടെ കൈവരിക്കാനാവാത്തതോ അസാധ്യമോ ആയിരിക്കുക എന്ന ആശയം നൽകാം; ആധുനിക മലയാളത്തിൽ സന്ദർഭസഹജമായി അവതരിപ്പിക്കുന്നു.
- source_word: כֹּל אֲשֶׁר יָזְמוּ לַעֲשׂוֹת
  choice: അവർ ചെയ്യാൻ പദ്ധതിയിടുന്നതൊന്നും
  rationale: יזם എന്നതിലെ ആസൂത്രണം/ഉദ്ദേശിക്കൽ എന്ന ആശയം വ്യക്തവും സാധാരണവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഐക്യപ്പെട്ട മനുഷ്യരുടെ കഴിവിനെക്കുറിച്ചുള്ള പ്രസ്താവനയുടെ വ്യാപ്തി
  choice: ഈ കഥാസന്ദർഭത്തിൽ അവർ ആസൂത്രണം ചെയ്യുന്ന പ്രവൃത്തികളൊന്നും അവർക്ക് അസാധ്യമാകുകയില്ല എന്ന ശക്തമായ പ്രസ്താവന നിലനിർത്തുന്നു.
  alternative: അവർ ആസൂത്രണം ചെയ്യുന്നതൊന്നും അവരിൽനിന്ന് തടഞ്ഞുവെക്കപ്പെടുകയില്ല.
  rationale: മനുഷ്യർക്ക് പരമമായ സർവശക്തിയുണ്ടെന്നോ അവരുടെ സംരംഭത്തെ ദൈവം അംഗീകരിക്കുന്നുവെന്നോ ചേർക്കാതെ, എബ്രായവാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇതാ’ എന്നത് മൂലപാഠത്തിന്റെ ശ്രദ്ധാകർഷക ഭാവം സൂക്ഷിക്കുന്നു; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തിയിരിക്കുന്നു.
