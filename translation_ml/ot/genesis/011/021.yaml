- from: സെരൂഗിന് ജന്മം നൽകിയശേഷം രെയൂ ഇരുനൂറ്റിയേഴു വർഷം ജീവിച്ചു; അവന് പുത്രന്മാരും പുത്രിമാരും ജനിച്ചു.
  to: സെരൂഗിന് പിതാവായശേഷം രെയൂ ഇരുനൂറ്റിയേഴു വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാർക്കും പുത്രിമാർക്കും പിതാവായി.
