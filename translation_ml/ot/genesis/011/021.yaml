source:
  edition: WLC
  text: וַ/יְחִ֣י רְע֗וּ אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת שְׂר֔וּג שֶׁ֥בַע שָׁנִ֖ים וּ/מָאתַ֣יִם שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/021.yaml
  text: And Reu lived after he fathered Serug two hundred and seven years[a], and he fathered sons and daughters.
translation:
  language: ml
  text: സെരൂഗിന് പിതാവായശേഷം രെയൂ ഇരുനൂറ്റിയേഴു വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാർക്കും പുത്രിമാർക്കും പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചു
  rationale: വംശാവലിസൂത്രത്തിൽ חיה എന്ന ക്രിയയുടെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: רְעוּ
  choice: രെയൂ
  rationale: എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שְׂרוּג
  choice: സെരൂഗിന് ജന്മം നൽകിയശേഷം
  rationale: പുരുഷവിഷയമുള്ള ילד ഹിഫീൽ രൂപത്തിന്റെ പിതൃത്വാർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: שֶׁבַע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: ഇരുനൂറ്റിയേഴു വർഷം
  rationale: എബ്രായത്തിലെ സംഖ്യാക്രമം മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിലാക്കി, ആകെ 207 വർഷം എന്നു കൃത്യമായി നൽകുന്നു.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: അവന് പുത്രന്മാരും പുത്രിമാരും ജനിച്ചു
  rationale: എബ്രായം വ്യക്തമാക്കുന്ന ആൺ-പെൺ സന്തതികളെ വേർതിരിച്ചു നിലനിർത്തുന്നു; ആവർത്തിച്ചുള്ള അസ്വാഭാവികമായ ‘ജന്മം നൽകി’ എന്ന പ്രയോഗം ഒഴിവാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലിക്ക് യോജിച്ച സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. അർദ്ധവിരാമം രണ്ട് ഏകോപിത വിവരഘടകങ്ങളെ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
