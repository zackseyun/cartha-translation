  text: The whole earth had one language and the same words[a].
translation:
  language: ml
  text: ഭൂമിയാകെ ഒരേ ഭാഷയും ഒരേ വാക്കുകളും[a] ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ഒരേ പദസഞ്ചയവും’ / ‘ഒരേ സംസാരവും.’ എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘വാക്കുകൾ ഒരേ/ഒന്നായവ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ഉള്ളതായിരുന്നു
  rationale: היה എന്ന ക്രിയയുടെ കഥാസാഹചര്യം അവതരിപ്പിക്കുന്ന സ്ഥിതിവാചക അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; പ്രത്യേകമായ ‘ഇപ്പോൾ’ എന്ന കാലസൂചകം ചേർക്കുന്നില്ല.
- source_word: כָל הָאָרֶץ
  choice: ഭൂമി മുഴുവനും
  rationale: אָרֶץ എന്നതിന് ‘ഭൂമി’ എന്നും ‘ദേശം’ എന്നും അർഥമാകാം. ബാബേൽ സന്ദർഭത്തിലെ വിശാലമായ മാനവിക വ്യാപ്തി പരിഗണിച്ച് ‘ഭൂമി മുഴുവനും’ എന്നു നൽകി.
- source_word: שָׂפָה אֶחָת
  choice: ഒരേ ഭാഷ
  rationale: שָׂפָה അക്ഷരാർഥത്തിൽ ‘ചുണ്ട്’ ആണെങ്കിലും ഇവിടെ ഭാഷയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. אֶחָת പ്രകടിപ്പിക്കുന്ന ഏകത ‘ഒരേ’ എന്നതിലൂടെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וּדְבָרִים אֲחָדִים
  choice: ഒരേ വാക്കുകളും
  rationale: דְּבָרִים എന്നതിന്റെ സാധാരണ അർഥമായ ‘വാക്കുകൾ’ നിലനിർത്തുകയും אֲחָדִים സൂചിപ്പിക്കുന്ന പൊതുവായ ഏകത വ്യക്തമാക്കുകയും ചെയ്യുന്നു; അതിനെ ‘ഭാഷ’ എന്നതിന്റെ വെറും ആവർത്തനമാക്കി ചുരുക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ വാക്യത്തിലെ ഭാഷയുടെയും വാക്കുകളുടെയും സമാന്തരതയും രണ്ടാമത്തെ പ്രയോഗത്തിലെ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
