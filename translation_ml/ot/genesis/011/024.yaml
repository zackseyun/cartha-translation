  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְחִ֣י נָח֔וֹר תֵּ֥שַׁע וְ/עֶשְׂרִ֖ים שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת תָּֽרַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/024.yaml
  text: Nahor lived twenty-nine years and fathered Terah.
translation:
  language: ml
  text: നാഹോർ ഇരുപത്തൊമ്പത് വർഷം ജീവിച്ചു; തേരഹിന്റെ പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചു
  rationale: വംശാവലിസൂത്രവാക്യത്തിൽ חיה എന്ന ക്രിയ ഒരാൾ അടുത്തതായി പറയുന്ന സംഭവത്തിനു മുമ്പ് ജീവിച്ച വർഷങ്ങളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ജീവിച്ചു’ സ്വാഭാവികവും മൂലത്തോട് അടുത്തതുമാണ്.
- source_word: נָחוֹר
  choice: നാഹോർ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയനുസരിച്ച് നൽകിയിരിക്കുന്നു.
- source_word: תֵּשַׁע וְעֶשְׂרִים שָׁנָה
  choice: ഇരുപത്തൊമ്പത് വയസ്സുവരെ
  rationale: എബ്രായത്തിലെ ‘ഒമ്പതും ഇരുപതും വർഷം’ എന്ന സംഖ്യാക്രമം സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ ‘ഇരുപത്തൊമ്പത്’ എന്നു ക്രമപ്പെടുത്തി; പ്രായം സൂചിപ്പിക്കുന്നതിനാൽ ‘വയസ്സുവരെ’ ഉപയോഗിച്ചു.
- source_word: וַיּוֹלֶד
  choice: ജന്മം നൽകി
  rationale: Hiphil രൂപത്തിലുള്ള ילד വംശാവലിയിൽ ‘ഒരു മകന്റെ പിതാവായി/ജനിപ്പിച്ചു’ എന്ന അർഥം നൽകുന്നു. പുരുഷകർത്താവിനോടും സ്വാഭാവികമായി ഉപയോഗിക്കാവുന്ന, വംശാവലിബന്ധം വ്യക്തമാക്കുന്ന പ്രയോഗമാണ് ‘ജന്മം നൽകി’.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നിശ്ചിത നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന ഈ എബ്രായ ഘടകത്തിന് മലയാളത്തിൽ സ്വതന്ത്ര പദസമാനം ആവശ്യമില്ല.
- source_word: תָּרַח
  choice: തേരഹ്
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണത്തിൽ നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി. പഴഞ്ചനായ ‘ജനിപ്പിച്ചു’ എന്നതിനുപകരം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘ജന്മം നൽകി’ സ്വീകരിച്ചു.
