lexical_decisions:
- source_word: וַיְחִי
  choice: വയസ്സായപ്പോൾ
  rationale: വംശാവലിയുടെ ഈ പ്രയോഗത്തിൽ חיה എന്ന ക്രിയ തേരഹ് പ്രസ്താവിച്ച പ്രായത്തിലെത്തി എന്ന ആശയം നൽകുന്നു. ‘എഴുപതു വയസ്സായപ്പോൾ’ എന്നത് ആ കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שִׁבְעִים שָׁנָה
  choice: എഴുപതു വയസ്സ്
  rationale: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘എഴുപതു വർഷം’ എന്നാണ്; പ്രായം സൂചിപ്പിക്കുന്ന മലയാളപ്രയോഗത്തിൽ ‘എഴുപതു വയസ്സ്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וַיּוֹלֶד
  choice: പിതാവായി
  rationale: വംശാവലികളിൽ ילד എന്ന ക്രിയ പ്രസവപ്രവൃത്തിയെക്കാൾ ‘പിതാവായി’ എന്ന അർഥത്തിലാണ് ഉപയോഗിക്കുന്നത്. ഈ തിരഞ്ഞെടുപ്പ് പഴഞ്ചനായ ‘ജനിപ്പിച്ചു’ എന്ന പ്രയോഗം ഒഴിവാക്കി ബന്ധം കൃത്യമായി അറിയിക്കുന്നു.
- source_word: אֶת ... אֶת ... וְאֶת
  choice: അബ്രാം, നാഹോർ, ഹാരാൻ എന്നിവർക്കു
  rationale: ആവർത്തിച്ച കർമചിഹ്നങ്ങൾ ഓരോ പേരിനെയും പ്രത്യേകം അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ പട്ടികാരൂപം അർഥനഷ്ടമില്ലാതെ അത് നൽകുന്നു.
- source_word: תֶרַח
  choice: തേരഹ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אַבְרָם
  choice: അബ്രാം
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: נָחוֹר
  choice: നാഹോർ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: הָרָן
  choice: ഹാരാൻ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; പേരിനോടൊപ്പമുള്ള ഹീബ്രു നിർദിഷ്ടപ്രത്യയം ഇവിടെ വേർതിരിച്ച് പരിഭാഷപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: വംശാവലിയിലെ പേരുകളുടെ ക്രമവും എഴുപതു വയസ്സിന്റെ കാലസൂചനയും
  choice: തേരഹിന് എഴുപതു വയസ്സായപ്പോൾ അവൻ ഈ മൂവരുടെയും പിതാവായി എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി; പട്ടിക ജനനക്രമം നിർണയിക്കുന്നു എന്ന ആശയം ചേർത്തിട്ടില്ല.
  alternative: തേരഹിന് എഴുപതു വയസ്സായതോടെ മക്കൾ ജനിക്കാൻ തുടങ്ങി എന്നും പേരുകൾ കർശനമായ ജനനക്രമത്തിലാണെന്നും വ്യാഖ്യാനിക്കാം.
  rationale: ഹീബ്രു വാക്യം തേരഹിന്റെ എഴുപതാം വയസ്സിനെയും ഈ പുത്രന്മാരുടെ പിതൃത്വത്തെയും ബന്ധിപ്പിക്കുന്നു; എന്നാൽ മൂവരും ഒരേ സമയത്ത് ജനിച്ചെന്നോ പേരുകൾ കർശനമായ ജനനക്രമത്തിലാണെന്നോ അത് നിർബന്ധിക്കുന്നില്ല. പിന്നീടുള്ള കാലക്രമപ്രശ്നങ്ങൾക്ക് ഇവിടെ നിശ്ശബ്ദമായി സമന്വയം ഏർപ്പെടുത്തിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി സ്വീകരിച്ചു. ‘ജനിപ്പിച്ചു’ എന്ന പഴക്കമുള്ളതോ പ്രസവപ്രവൃത്തിയെ മുൻനിർത്തുന്നതോ ആയ പദത്തിനു പകരം ‘പിതാവായി’ ഉപയോഗിച്ചു; കാലക്രമത്തിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
