  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֨פֶץ יְהוָ֥ה אֹתָ֛/ם מִ/שָּׁ֖ם עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַֽ/יַּחְדְּל֖וּ לִ/בְנֹ֥ת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/008.yaml
  text: So Yahweh scattered them from there over the face of all the earth[a], and they stopped building the city.
translation:
  language: ml
  text: അങ്ങനെ യാഹ്‌വേ അവരെ അവിടെനിന്ന് ഭൂമിയിലെങ്ങും ചിതറിച്ചു[a]; അവർ നഗരം പണിയുന്നത് നിർത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘ഭൂമി മുഴുവനിലും’ അല്ലെങ്കിൽ ‘ഭൂമിയിലാകെ.’ ഹീബ്രുവിൽ അക്ഷരാർഥം: ‘ഭൂമി മുഴുവന്റെയും മുഖത്തിന്മേൽ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: ചിതറിച്ചു
  rationale: פוץ എന്ന ക്രിയ ഇവിടെ ജനങ്ങളെ പല സ്ഥലങ്ങളിലായി പിരിച്ചുവിടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ചിതറിച്ചു’ എന്നത് ന്യായവിധിയുടെ സന്ദർഭവും കാരകഭാവവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: ബാബേലിലെ സംഭവസ്ഥലത്തെ തിരിഞ്ഞുസൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ സ്ഥലക്രിയാവിശേഷണം.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: ഭൂമിയിലെങ്ങും
  rationale: ‘ഭൂമി മുഴുവന്റെയും ഉപരിതലത്തിൽ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥചിത്രം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וַיַּחְדְּלוּ
  choice: നിർത്തി
  rationale: חדל എന്ന ക്രിയയുടെ ‘അവസാനിപ്പിക്കുക/നിർത്തുക’ എന്ന അർഥം ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: לִבְנֹת
  choice: പണിയുന്നത്
  rationale: ‘നിർത്തി’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാനാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: הָעִיר
  choice: നഗരം
  rationale: തൊട്ടുമുൻപത്തെ സന്ദർഭത്തിൽ പണിതുകൊണ്ടിരുന്ന നിർദിഷ്ട നഗരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഈ വാക്യഘടനയിൽ ‘നഗരം’ മതിയായ നിർദിഷ്ടത നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: പാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ‘കർത്താവ്’ പോലുള്ള സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു. മലയാള വായനക്കാർക്ക് കൂടുതൽ പരിചിതവും സ്വാഭാവികവുമായ രൂപമായി ‘യഹോവ’ തിരഞ്ഞെടുത്തു; ‘യാഹ്‌വേ’ സാധ്യമായ മറ്റൊരു ശാസ്ത്രീയ ലിപ്യന്തരണമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രു വിവരണക്രമം നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ അക്ഷരാനുകരണം പ്രധാനവാചകത്തിൽ ഒഴിവാക്കി; ഉറവിടത്തിലെ ദൃശ്യപ്രയോഗം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
