  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְחִ֣י אַרְפַּכְשַׁ֗ד אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת שֶׁ֔לַח שָׁלֹ֣שׁ שָׁנִ֔ים וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/013.yaml
  text: Arpachshad lived 403 years after he fathered Shelah[a], and he fathered sons and daughters.
translation:
  language: ml
  text: അർപ്പക്ഷദ് ശേലഹിന്റെ പിതാവായശേഷം 403 വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാരെയും പുത്രിമാരെയും ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചു
  rationale: വംശാവലിയുടെ ഈ സൂത്രവാക്യത്തിൽ חיה ഒരാൾ തുടർന്നും ജീവിച്ച കാലത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ജീവിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אַרְפַּכְשַׁד
  choice: അർപ്പക്ഷദ്
  rationale: ഹീബ്രു നാമരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: പിതാവായശേഷം
  rationale: ഹിഫിൽ രൂപം പുരുഷവിഷയത്തിന്റെ ജനകത്വത്തെ സൂചിപ്പിക്കുന്നു. ‘പിതാവായശേഷം’ കാലബന്ധവും പുരുഷനിഷ്ഠമായ അർത്ഥവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שֶׁלַח
  choice: ശേലഹ്
  rationale: ഹീബ്രു ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 വർഷം
  rationale: ഹീബ്രുവിലെ സംഖ്യാക്രമം മലയാളത്തിൽ സ്വാഭാവികമായ രീതിയിൽ ക്രമപ്പെടുത്തി കൃത്യമായ ആകെ സംഖ്യ നിലനിർത്തുന്നു.
- source_word: וַיּוֹלֶד
  choice: അവന് ... ജനിച്ചു
  rationale: ആൺവിഷയത്തിന്റെ സന്താനോത്പത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്ന പ്രയോഗം; ആവർത്തിച്ചുള്ള ‘പിതാവായി’ എന്ന അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- source_word: בָּנִים וּבָנוֹת
  choice: പുത്രന്മാരും പുത്രിമാരും
  rationale: മൂലപാഠം ആൺ-പെൺ സന്തതികളെ പ്രത്യേകം പറയുന്നതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനു പകരം ആ വ്യത്യാസം നിലനിർത്തുന്നു.
