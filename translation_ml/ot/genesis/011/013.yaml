translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. ഹീബ്രു വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ, കാലബന്ധവും കൃത്യമായ ആയുസ്സും വ്യക്തമായി വായിക്കാവുന്ന വിധത്തിൽ അവതരിപ്പിച്ചു.
