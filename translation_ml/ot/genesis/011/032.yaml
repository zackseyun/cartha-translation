id: GEN.11.32
reference: Genesis 11:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּהְי֣וּ יְמֵי תֶ֔רַח חָמֵ֥שׁ שָׁנִ֖ים וּ/מָאתַ֣יִם שָׁנָ֑ה וַ/יָּ֥מָת תֶּ֖רַח בְּ/חָרָֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/032.yaml
  text: The days of Terah were two hundred and five years, and Terah died in Haran.
translation:
  language: ml
  text: തേരഹിന്റെ ആയുഷ്കാലം ഇരുനൂറ്റിയഞ്ച് വർഷമായിരുന്നു. തേരഹ് ഹാരാനിൽവെച്ചു മരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי תֶרַח
  choice: തേരഹിന്റെ ആയുഷ്കാലം ... ആയിരുന്നു
  rationale: ‘തേരഹിന്റെ ദിവസങ്ങൾ’ എന്ന എബ്രായ പ്രയോഗം ഒരാളുടെ മുഴുവൻ ആയുഷ്കാലത്തെ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥരൂപത്തെക്കാൾ ആ അർഥം സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: חָמֵשׁ שָׁנִים וּמָאתַיִם שָׁנָה
  choice: ഇരുനൂറ്റിയഞ്ച് വർഷം
  rationale: എബ്രായത്തിലെ സംഖ്യാക്രമം മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ അവതരിപ്പിക്കുകയും ഏകവചന-ബഹുവചന വ്യത്യാസം മലയാള വ്യാകരണത്തിന് അനുസരിച്ച് രൂപപ്പെടുത്തുകയും ചെയ്തു.
- source_word: תֶרַח
  choice: തേരഹ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; മൂലപാഠത്തിലില്ലാത്ത സൗമ്യോക്തി ഒഴിവാക്കുന്നു.
- source_word: בְּחָרָן
  choice: ഹാരാനിൽവെച്ചു
  rationale: സ്ഥലനാമത്തോടൊപ്പമുള്ള ב ഇവിടെ മരണത്തിന്റെ സ്ഥലം സൂചിപ്പിക്കുന്നു; ‘-ൽവെച്ചു’ സ്വാഭാവിക മലയാളത്തിൽ അത് വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി-സംഗ്രഹ ശൈലി. പരമ്പരാഗതമായി പരിചിതമായ പേരുരൂപങ്ങളെ മാനിക്കുമ്പോഴും എബ്രായ ഉച്ചാരണത്തോട് അടുപ്പം നിലനിർത്തുന്നു.
