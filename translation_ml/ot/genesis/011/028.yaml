id: GEN.11.28
reference: Genesis 11:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֣מָת הָרָ֔ן עַל פְּנֵ֖י תֶּ֣רַח אָבִ֑י/ו בְּ/אֶ֥רֶץ מוֹלַדְתּ֖/וֹ בְּ/א֥וּר כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/028.yaml
  text: And Haran died in the presence of Terah his father[a], in the land of his birth, in Ur of the Chaldeans.
translation:
  language: ml
  text: ഹാരാൻ തന്റെ പിതാവായ തേരഹിന്റെ സന്നിധിയിൽവെച്ച്[a], തന്റെ ജന്മദേശമായ കൽദയരുടെ ഊരിൽവെച്ച് മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ പിതാവായ തേരഹിനു മുമ്പ്,’ അതായത് പിതാവ് ജീവിച്ചിരിക്കെ. എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘മുഖത്തിന്മേൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ക്രിയയുടെ wayyiqtol രൂപം കഴിഞ്ഞകാലത്തിലെ ഒരു സംഭവത്തെ നേരിട്ട് വിവരിക്കുന്നു; മലയാള ആഖ്യാനത്തിൽ ‘മരിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: עַל־פְּנֵי
  choice: സന്നിധിയിൽവെച്ച്
  rationale: അക്ഷരാർഥത്തിൽ ‘മുഖത്തിന്മേൽ/മുഖത്തിനു മുമ്പിൽ’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ പിതാവിന്റെ സാന്നിധ്യത്തിൽ അല്ലെങ്കിൽ പിതാവ് ജീവിച്ചിരിക്കെ മരിച്ചതിനെ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിലെ തിരഞ്ഞെടുപ്പ് ദൃശ്യമായ സാന്നിധ്യാർഥം നിലനിർത്തുന്നു; കാലസൂചനയായ മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: תֶּרַח אָבִיו
  choice: തന്റെ പിതാവായ തേരഹ്
  rationale: പ്രത്യയമുള്ള ‘അവന്റെ പിതാവ്’ തേരഹിനെ ഹാരാന്റെ പിതാവായി തിരിച്ചറിയുന്നു. മലയാളത്തിൽ ഈ ക്രമം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בְּאֶרֶץ מוֹלַדְתּוֹ
  choice: തന്റെ ജന്മദേശമായ
  rationale: מוֹלֶדֶת ജന്മസ്ഥലത്തെയോ സ്വദേശത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ജന്മദേശം’ മൂലത്തിലെ അർഥം സംക്ഷിപ്തമായും സ്വാഭാവികമായും പകരുന്നു.
- source_word: בְּאוּר כַּשְׂדִּים
  choice: കൽദയരുടെ ഊരിൽവെച്ച്
  rationale: אוּר സ്ഥലനാമമായതിനാൽ ‘ഊർ’ എന്നു ലിപ്യന്തരണം ചെയ്തു; כַּשְׂדִּים ജനവിഭാഗനാമമായതിനാൽ ‘കൽദയർ’ എന്നു നൽകി. ബന്ധം മലയാളത്തിൽ ഷഷ്ഠിവിഭക്തിയിലൂടെ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: עַל־פְּנֵי എന്ന പ്രയോഗം സാന്നിധ്യമോ കാലസൂചനയോ
  choice: തന്റെ പിതാവായ തേരഹിന്റെ സന്നിധിയിൽവെച്ച്
  alternative: തന്റെ പിതാവായ തേരഹ് ജീവിച്ചിരിക്കെ / തന്റെ പിതാവായ തേരഹിനു മുമ്പ്
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ സജീവവും മൂർത്തവുമായ സാന്നിധ്യാർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; എന്നാൽ അത് ‘പിതാവ് ജീവിച്ചിരിക്കെ’ എന്ന കാലാർഥത്തിലും മനസ്സിലാക്കാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായ വാക്യത്തിലെ ആവർത്തിച്ച സ്ഥലസൂചകത്തിന് അനുസരിച്ച് ‘-യിൽവെച്ച്’ നിലനിർത്തി; עַל־פְּנֵי എന്നതിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
