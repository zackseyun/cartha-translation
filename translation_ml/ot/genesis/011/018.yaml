  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. വംശാവലിയുടെ ചുരുക്കവും താളവും നിലനിർത്തിയിരിക്കുന്നു.
