  yaml_path: translation/ot/genesis/011/018.yaml
  text: Peleg lived thirty years and fathered Reu.
translation:
  language: ml
  text: പെലെഗ് മുപ്പതു വയസ്സായപ്പോൾ രെയുവിന് പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചശേഷം
  rationale: വംശാവലിസൂത്രത്തിൽ חיה എന്ന ക്രിയ അടുത്ത സംഭവത്തിനു മുമ്പുള്ള ആയുസ്സുകാലം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രായവും തുടർന്നുള്ള ജനനവും സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘ജീവിച്ചശേഷം’ എന്നു നൽകി.
- source_word: פֶלֶג
  choice: പെലെഗ്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: മുപ്പതു വർഷം
  rationale: എബ്രായത്തിലെ ‘മുപ്പതു വർഷം’ എന്ന പ്രയോഗം ഇവിടെ പ്രായത്തെ സൂചിപ്പിക്കുന്നു; മൂലവാക്യത്തിന്റെ രൂപത്തോട് അടുത്തുനിൽക്കുന്ന സ്വാഭാവിക മലയാളം തിരഞ്ഞെടുത്തു.
- source_word: וַיּוֹלֶד
  choice: ജന്മം നൽകി
  rationale: הוליד എന്ന causative രൂപം പുരുഷവംശാവലിയിൽ ‘സന്താനത്തെ ജനിപ്പിച്ചു/പിതാവായി’ എന്ന അർഥം നൽകുന്നു. ‘ജന്മം നൽകി’ ആ ബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: אֶת
  choice: '[നേരിട്ടുള്ള കർമസൂചകം; വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: എബ്രായത്തിലെ നിർദിഷ്ട നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന അവ്യയത്തിന് മലയാളത്തിൽ പ്രത്യേക പദസമം ആവശ്യമില്ല.
- source_word: רְעוּ
  choice: രെയു
  rationale: എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
