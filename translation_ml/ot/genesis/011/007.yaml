id: GEN.11.7
reference: Genesis 11:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הָ֚בָ/ה נֵֽרְדָ֔ה וְ/נָבְלָ֥ה שָׁ֖ם שְׂפָתָ֑/ם אֲשֶׁר֙ לֹ֣א יִשְׁמְע֔וּ אִ֖ישׁ שְׂפַ֥ת רֵעֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/007.yaml
  text: Come, let us go down there and confuse their language, so that one man will not understand the language of his neighbor.
translation:
  language: ml
  text: വരുവിൻ, നാം ഇറങ്ങിച്ചെന്ന് അവിടെ അവരുടെ ഭാഷ കലക്കിക്കളയുക; അങ്ങനെ ഒരാൾ മറ്റൊരാളുടെ ഭാഷ മനസ്സിലാക്കാതിരിക്കട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבָה
  choice: വരുവിൻ
  rationale: ആലോചനയിലേക്കോ കൂട്ടായ പ്രവർത്തനത്തിലേക്കോ ക്ഷണിക്കുന്ന ഹീബ്രു ആഹ്വാനത്തിന്റെ ഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: נֵרְדָה
  choice: നാം ഇറങ്ങിച്ചെന്ന്
  rationale: ഒന്നാംപുരുഷ ബഹുവചന ആഹ്വാനരൂപമായ ‘നാം ഇറങ്ങുക’ എന്ന അർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള പ്രവർത്തനവുമായി മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: נָבְלָה
  choice: കലക്കിക്കളയുക
  rationale: ഭാഷാപരമായ ആശയക്കുഴപ്പവും പരസ്പരഗ്രഹണത്തിന്റെ തകർച്ചയും സൂചിപ്പിക്കുന്ന ക്രിയയെ പ്രസംഗസന്ദർഭത്തിന് യോജിച്ച മലയാളത്തിൽ നൽകുന്നു.
- source_word: שְׂפָתָם
  choice: അവരുടെ ഭാഷ
  rationale: ശാബ്ദികമായി ‘അവരുടെ അധരം’ എന്നാണെങ്കിലും ഇവിടെ ഭാഷയെ സൂചിപ്പിക്കുന്ന അവയവനാമപ്രയോഗമാണ്; ലക്ഷ്യഭാഷയിൽ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אִישׁ שְׂפַת רֵעֵהוּ
  choice: ഒരാൾ മറ്റൊരാളുടെ ഭാഷ
  rationale: ‘ഒരു മനുഷ്യൻ തന്റെ കൂട്ടുകാരന്റെ ഭാഷ’ എന്ന ഹീബ്രു പരസ്പരപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; പുരുഷന്മാർക്കു മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ‘നാം’ എന്ന ദൈവിക ബഹുവചനം
  choice: നാം
  alternative: ഞാൻ
  rationale: മൂലപാഠത്തിലെ ഒന്നാംപുരുഷ ബഹുവചനം അതേപടി നിലനിർത്തുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ വിവർത്തനത്തിൽ തീർപ്പാക്കുന്നില്ല.
- issue: ലക്ഷ്യവാക്യത്തിന്റെ ഭാവം
  choice: മനസ്സിലാക്കാതിരിക്കട്ടെ
  alternative: മനസ്സിലാക്കുകയില്ല
  rationale: אֲשֶׁר לֹא יִשְׁמְעוּ എന്നത് ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ വരുന്നതിനാൽ ആ ഭാവം നിലനിർത്തുന്നു; ‘കേൾക്കുക’ ഇവിടെ ഗ്രഹിക്കുക എന്ന അർഥത്തിലാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. അനാവശ്യമായ സാങ്കേതിക പദങ്ങളും വിഭാഗീയ വ്യാഖ്യാനങ്ങളും ഒഴിവാക്കി.
