id: GEN.11.27
reference: Genesis 11:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת תֶּ֔רַח תֶּ֚רַח הוֹלִ֣יד אֶת אַבְרָ֔ם אֶת נָח֖וֹר וְ/אֶת הָרָ֑ן וְ/הָרָ֖ן הוֹלִ֥יד אֶת לֽוֹט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/027.yaml
  text: 'These are the generations of Terah: Terah fathered Abram, Nahor, and Haran; and Haran fathered Lot.'
translation:
  language: ml
  text: 'തേരഹിന്റെ വംശചരിത്രം ഇതാണ്: തേരഹ് അബ്രാമിനും നാഹോരിനും ഹാരാനിനും പിതാവായി; ഹാരാൻ ലോത്തിനും പിതാവായി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇതാണ്
  rationale: പുതിയ വംശാവലി വിഭാഗം അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; മൂലത്തിൽ വ്യക്തമായ കാലസൂചകപദമില്ലാത്തതിനാൽ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
- source_word: תּוֹלְדֹת
  choice: വംശചരിത്രം
  rationale: ഉല്പത്തിയിലെ ആവർത്തിത ഘടനാപദം ഒരു വ്യക്തിയിൽനിന്ന് തുടർന്നുവരുന്ന വംശത്തെയും അതിന്റെ വിവരണത്തെയും ഉൾക്കൊള്ളുന്നു. ‘വംശചരിത്രം’ ഈ വിശാലത നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാകുകയും ചെയ്യുന്നു.
- source_word: תֶּרַח
  choice: തേരഹ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ വ്യക്തമായി ലിപ്യന്തരിച്ചു.
- source_word: הוֹלִיד
  choice: പിതാവായി
  rationale: വംശാവലിസന്ദർഭത്തിൽ ഹിഫിൽ രൂപത്തിന് ‘ജനിപ്പിച്ചു/പിതാവായി’ എന്ന അർഥമുണ്ട്. ‘പിതാവായി’ മാന്യവും സ്വാഭാവികവും അനാവശ്യമായി പുരാതനശൈലിയിലല്ലാത്തതുമാണ്.
- source_word: אֶת אַבְרָם אֶת נָחוֹר וְאֶת הָרָן
  choice: അബ്രാമിനും നാഹോരിനും ഹാരാനിനും
  rationale: നേരിട്ടുള്ള കർമചിഹ്നങ്ങൾ മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ പേരുകളുടെ ഏകോപിത പട്ടിക സ്വാഭാവികമായി നൽകി.
- source_word: וְהָרָן
  choice: ഹാരാൻ
  rationale: ബന്ധകത്തിന്റെ പ്രവർത്തനം അർധവിരാമത്തിനുശേഷമുള്ള വാക്യബന്ധത്തിൽ വ്യക്തമാണ്; മലയാളത്തിൽ അനാവശ്യമായ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
- source_word: הוֹלִיד אֶת לוֹט
  choice: ലോത്തിനും പിതാവായി
  rationale: അതേ വംശാവലിക്രിയയെ സ്ഥിരതയോടെ ‘പിതാവായി’ എന്നു പരിഭാഷപ്പെടുത്തി; ലോത്ത് എന്ന വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ഉല്പത്തിയിലെ തൊലെദോത്ത് ഘടനയുടെ വിശാല അർഥം നിലനിർത്താൻ ‘വംശചരിത്രം’ ഉപയോഗിച്ചു; പേരുകളിൽ പരമ്പരാഗത മലയാള ബൈബിൾ രൂപങ്ങളോട് അടുത്ത ലിപ്യന്തരണം സ്വീകരിച്ചു.
