revisions:
- from: രെയുവിന് ജന്മം നൽകിയശേഷം പേലെഗ് ഇരുനൂറ്റൊൻപത് വർഷം ജീവിച്ചു; അവന് പുത്രന്മാരും പുത്രിമാരും ജനിച്ചു.
  to: രെയുവിനെ ജനിപ്പിച്ചശേഷം പെലെഗ് ഇരുനൂറ്റൊൻപത് വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാരെയും പുത്രിമാരെയും ജനിപ്പിച്ചു.
  rationale: The revision retains the draft's clear modern register, names, number, and explicit reference to sons and daughters, while using active Malayalam genealogical verbs to represent both occurrences of the Hebrew Hiphil ילד. This more faithfully conveys that Peleg fathered Reu and later fathered other sons and daughters.
  reviewer_model: gpt-5.6-terra
