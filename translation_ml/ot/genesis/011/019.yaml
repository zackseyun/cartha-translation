source:
  edition: WLC
  text: וַֽ/יְחִי פֶ֗לֶג אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת רְע֔וּ תֵּ֥שַׁע שָׁנִ֖ים וּ/מָאתַ֣יִם שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/019.yaml
  text: And Peleg lived two hundred and nine years after he fathered Reu, and he fathered sons and daughters.
translation:
  language: ml
  text: രെയുവിനെ ജനിപ്പിച്ചശേഷം പെലെഗ് ഇരുനൂറ്റൊൻപത് വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാരെയും പുത്രിമാരെയും ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചു
  rationale: വംശാവലിസൂത്രവാക്യത്തിലെ חיה എന്ന ക്രിയയെ സ്വാഭാവികമായും കൃത്യമായും അവതരിപ്പിക്കുന്നു.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־רְעוּ
  choice: രെയുവിന് ജന്മം നൽകിയശേഷം
  rationale: ഹിഫിൽ രൂപമായ הוליד പിതാവെന്ന നിലയിൽ ജന്മം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗമാണിത്.
- source_word: תֵּשַׁע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: ഇരുനൂറ്റൊൻപത് വർഷം
  rationale: എബ്രായത്തിലെ സംഖ്യാക്രമം മലയാളത്തിലെ പതിവനുസരിച്ച് ക്രമപ്പെടുത്തി ആകെ 209 വർഷം എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וַיּוֹלֶד
  choice: ജനിച്ചു
  rationale: മലയാളത്തിൽ ‘അവന് ... ജനിച്ചു’ എന്ന ഘടന പിതൃബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; മൂലത്തിലെ പുരുഷകേന്ദ്രിതമായ വംശാവലി ദൃഷ്ടിയും നിലനിർത്തുന്നു.
- source_word: בָּנִים וּבָנוֹת
  choice: പുത്രന്മാരും പുത്രിമാരും
  rationale: മൂലപാഠം ആൺമക്കളെയും പെൺമക്കളെയും പ്രത്യേകം പറയുന്നതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനു പകരം രണ്ടു വിഭാഗവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. വ്യക്തിനാമങ്ങൾ രെയു, പേലെഗ് എന്നിങ്ങനെ മൂലഭാഷയോട് അടുത്തായി ലിപ്യന്തരിച്ചു.
