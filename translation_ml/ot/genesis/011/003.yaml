translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ വസ്തു-പ്രതിസ്ഥാപന വ്യത്യാസം ‘കല്ലിനു പകരം ... കുമ്മായത്തിനു പകരം ...’ എന്ന സമാന്തര ഘടനയിൽ നിലനിർത്തി.
