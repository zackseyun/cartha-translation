  yaml_path: translation/ot/genesis/011/003.yaml
  text: And each man said to his neighbor[a], “Come, let us make bricks and burn them thoroughly.” And the brick served them for stone[b], and the bitumen served them for mortar.
translation:
  language: ml
  text: 'അവർ പരസ്പരം പറഞ്ഞു: “വരൂ, നമുക്ക് ഇഷ്ടികകൾ ഉണ്ടാക്കി അവ നന്നായി ചുട്ടെടുക്കാം.” അങ്ങനെ അവർ കല്ലിനു പകരം ഇഷ്ടികയും മോർട്ടാറിനു പകരം കീൽ[a]യും ഉപയോഗിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘കീൽ’ എന്നു പറയുന്നത് നിർമാണത്തിൽ ഉപയോഗിച്ചിരുന്ന ബിറ്റുമെൻ അഥവാ ടാർപോലുള്ള പദാർഥത്തെയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: അവർ പരസ്പരം പറഞ്ഞു
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ വിതരണാത്മകമായ ‘ഒരാൾ മറ്റൊരാളോട്’ എന്ന അർഥം സ്വാഭാവികവും ഉൾക്കൊള്ളാവുന്നതുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָבָה
  choice: വരൂ
  rationale: കൂട്ടായ പ്രവർത്തനത്തിനുള്ള ആഹ്വാനം അവതരിപ്പിക്കുന്ന ഉദ്ബോധക കണികയുടെ അർഥം ലളിതമായി പകർത്തുന്നു.
- source_word: נִלְבְּנָה לְבֵנִים
  choice: നമുക്ക് ഇഷ്ടികകൾ ഉണ്ടാക്കാം
  rationale: לבנה എന്ന നാമത്തിൽനിന്നുള്ള ക്രിയ ഇവിടെ ഇഷ്ടിക നിർമിക്കുക എന്നർഥത്തിലാണ്; മലയാളത്തിലെ സ്വാഭാവിക നിർമാണപ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: וְנִשְׂרְפָה לִשְׂרֵפָה
  choice: അവ നന്നായി ചുട്ടെടുക്കാം
  rationale: ക്രിയയോടൊപ്പം വന്ന സമാനമൂലമുള്ള നാമം നൽകുന്ന തീവ്രത ‘നന്നായി’ എന്നതിലൂടെ അറിയിക്കുന്നു; ഇഷ്ടിക നിർമാണസന്ദർഭത്തിൽ ‘ചുട്ടെടുക്കുക’ സ്വാഭാവികമാണ്.
- source_word: וַתְּהִי לָהֶם הַלְּבֵנָה לְאָבֶן
  choice: അവർ കല്ലിനു പകരം ഇഷ്ടിക ... ഉപയോഗിച്ചു
  rationale: היה + ל ഇവിടെ ഒരു വസ്തു മറ്റൊന്നിന്റെ സ്ഥാനത്ത് പ്രവർത്തിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ‘പകരം ... ഉപയോഗിച്ചു’ എന്നത് ആ പ്രവർത്തനപരമായ പ്രതിസ്ഥാപനം വ്യക്തമായി നൽകുന്നു.
- source_word: הַחֵמָר
  choice: കീൽ
  rationale: നിർമാണത്തിൽ ഉപയോഗിച്ചിരുന്ന പ്രകൃതിദത്ത ബിറ്റുമെൻ അഥവാ ടാർസദൃശ പദാർഥമാണ് ഉദ്ദേശ്യം; ‘കീൽ’ വായനാസൗകര്യമുള്ള മലയാളപദമാണ്, കൃത്യമായ സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לַחֹמֶר
  choice: കുമ്മായത്തിനു പകരം
  rationale: ഈ നിർമാണസന്ദർഭത്തിൽ חֹמֶר ഇഷ്ടികകൾ ബന്ധിപ്പിക്കുന്ന മോർട്ടാറിന്റെ പ്രവർത്തനമാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ‘കുമ്മായം’ ആ പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
