source:
  edition: WLC
  text: וַֽ/יְחִי עֵ֗בֶר אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת פֶּ֔לֶג שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/017.yaml
  text: And Eber lived after he fathered Peleg four hundred and thirty years[a], and he fathered sons and daughters.
translation:
  language: ml
  text: പേലെഗിന്റെ പിതാവായശേഷം ഏബെർ നാനൂറ്റിമുപ്പത് വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാർക്കും പുത്രിമാർക്കും പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചു
  rationale: വംശാവലിസൂത്രത്തിൽ חיה എന്ന ക്രിയയെ സ്വാഭാവികവും കൃത്യവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: עֵבֶר
  choice: ഏബെർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ വ്യക്തമായി പകർന്നു.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־פֶּלֶג
  choice: പേലെഗിന് ജന്മം നൽകിയശേഷം
  rationale: הוליד എന്ന കാരകക്രിയയിലെ പിതൃത്വാർഥം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: നാനൂറ്റിമുപ്പത് വർഷം
  rationale: എബ്രായത്തിലെ ‘മുപ്പതും നാനൂറും’ എന്ന ക്രമത്തെ സ്വാഭാവിക മലയാള സംഖ്യാരൂപത്തിൽ മൊത്തം 430 വർഷമായി നൽകി.
- source_word: וַיּוֹלֶד
  choice: അവന് ... ജനിച്ചു
  rationale: ആവർത്തിക്കുന്ന പിതൃത്വക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി പകർന്നു; സന്താനങ്ങൾ ഏബെറിനാണ് ജനിച്ചതെന്ന് വ്യക്തമാകുന്നു.
- source_word: בָּנִים וּבָנוֹת
  choice: പുത്രന്മാരും പുത്രിമാരും
  rationale: മൂലപാഠം ആൺ-പെൺ സന്താനങ്ങളെ പ്രത്യേകം പറയുന്നതിനാൽ രണ്ടും നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വംശാവലിയുടെ സംക്ഷിപ്ത ശൈലി നിലനിർത്തി; അനാവശ്യമായ പുരാതനപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
