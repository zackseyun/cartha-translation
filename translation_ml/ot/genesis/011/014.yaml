- from: ശേലഹ്[a] മുപ്പതു വർഷം ജീവിച്ചശേഷം ഏബെറിനെ[b] ജനിപ്പിച്ചു.
  to: ശേലഹിന്[a] മുപ്പതു വയസ്സായപ്പോൾ, അവൻ ഏബെരിന്റെ[b] പിതാവായി.
