- source_word: שְׁלֹשִׁים שָׁנָה
  choice: മുപ്പതു വർഷം
  rationale: എബ്രായത്തിലെ കാലയളവുപ്രയോഗത്തെ സംക്ഷിപ്തമായും നേരിട്ടും നിലനിർത്തുന്നു.
- source_word: וַ/יּוֹלֶד
  choice: ജനിപ്പിച്ചു
  rationale: ഹിഫിൽ രൂപത്തിന്റെ പുരുഷവംശാവലി അർഥമായ ‘പിതാവായി/ജനിപ്പിച്ചു’ എന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ പ്രയോഗം.
- source_word: אֶת
  choice: '[പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകം; മലയാളത്തിലെ ‘-നെ’ വിഭക്തിയിലൂടെ അതിന്റെ ധർമം പ്രകടമാകുന്നു.
- source_word: עֵבֶר
  choice: ഏബെർ
  rationale: עֵבֶר എന്ന എബ്രായ നാമത്തിന്റെ ശബ്ദരൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
