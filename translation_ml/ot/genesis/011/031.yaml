source:
  edition: WLC
  text: וַ/יִּקַּ֨ח תֶּ֜רַח אֶת אַבְרָ֣ם בְּנ֗/וֹ וְ/אֶת ל֤וֹט בֶּן הָרָן֙ בֶּן בְּנ֔/וֹ וְ/אֵת֙ שָׂרַ֣י כַּלָּת֔/וֹ אֵ֖שֶׁת אַבְרָ֣ם בְּנ֑/וֹ וַ/יֵּצְא֨וּ אִתָּ֜/ם מֵ/א֣וּר כַּשְׂדִּ֗ים לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֥אוּ עַד חָרָ֖ן וַ/יֵּ֥שְׁבוּ שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/031.yaml
  text: Terah took Abram his son[a], Lot the son of Haran, his grandson, and Sarai his daughter-in-law, the wife of Abram his son, and they set out together from Ur of the Chaldeans to go to the land of Canaan[c][b]. But when they came as far as Haran, they settled there.
translation:
  language: ml
  text: തേരഹ് തന്റെ മകനായ അബ്രാമിനെയും, തന്റെ മകന്റെ മകനായ ഹാരാന്റെ മകനായ ലോത്തിനെയും[a], തന്റെ മകനായ അബ്രാമിന്റെ ഭാര്യയും തന്റെ മരുമകളുമായ സാറായിയെയും കൂട്ടിക്കൊണ്ടുപോയി. കനാൻദേശത്തേക്കു പോകാൻ അവർ കൽദയരുടെ ഊരിൽനിന്ന് അവരോടൊപ്പം പുറപ്പെട്ടു[b]. അവർ ഹാരാൻവരെ എത്തി അവിടെ താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ: ‘ഹാരാന്റെ മകൻ ലോത്ത്, തന്റെ മകന്റെ മകൻ’; അതായത് ലോത്ത് തേരഹിന്റെ കൊച്ചുമകനായിരുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘അവർ അവരോടൊപ്പം പുറപ്പെട്ടു’ എന്നാണ്. ഈ പ്രയോഗത്തിന്റെ സൂചന വ്യക്തമല്ല. ചില പുരാതന പാഠസാക്ഷ്യങ്ങൾ ഏകവചന കർത്താവുള്ള വായന പ്രതിഫലിപ്പിക്കുന്നു.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: കൂട്ടിക്കൊണ്ടുപോയി
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും യാത്രയ്ക്കായി കുടുംബാംഗങ്ങളെ ഒപ്പം കൊണ്ടുപോകുന്ന ഈ സന്ദർഭത്തിൽ ‘കൂട്ടിക്കൊണ്ടുപോയി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לוֹט בֶּן הָרָן בֶּן בְּנוֹ
  choice: തന്റെ മകന്റെ മകനായ ഹാരാന്റെ മകൻ ലോത്ത്
  rationale: എബ്രായത്തിലെ ‘ഹാരാന്റെ മകൻ, തന്റെ മകന്റെ മകൻ’ എന്ന ബന്ധനിർദേശം ചുരുക്കി ‘കൊച്ചുമകൻ’ എന്നു മാത്രം പറയാതെ, ഹാരാനുമായും തേരഹുമായുമുള്ള ബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: כַּלָּתוֹ
  choice: തന്റെ മരുമകൾ
  rationale: כלה ഇവിടെ തേരഹിന്റെ മകന്റെ ഭാര്യയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘മരുമകൾ’ സ്വാഭാവികമായ തുല്യപദമാണ്.
- source_word: וַיֵּצְאוּ אִתָּם
  choice: അവർ അവരോടൊപ്പം പുറപ്പെട്ടു
  rationale: മസോററ്റിക് പാഠത്തിലെ ബഹുവചന കർത്താവിനെയും ‘അവരോടൊപ്പം’ എന്ന ബഹുവചന പ്രത്യയത്തെയും അവയുടെ അസ്വാഭാവികത സഹിതം സംരക്ഷിക്കുന്നു; ആശയക്കുഴപ്പം നിശ്ശബ്ദമായി പരിഹരിക്കുന്നില്ല.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: കൽദയരുടെ ഊരിൽനിന്ന്
  rationale: ഊർ എന്ന സ്ഥലനാമവും കൽദയർ എന്ന ജനനാമവും മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾരൂപങ്ങളിൽ നൽകുന്നു.
- source_word: לָלֶכֶת אַרְצָה כְּנַעַן
  choice: കനാൻദേശത്തേക്കു പോകാൻ
  rationale: ക്രിയാനാമവും ദിശാസൂചകാവസാനവും പ്രകടിപ്പിക്കുന്ന ഉദ്ദേശ്യവും ലക്ഷ്യസ്ഥാനവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיָּבֹאוּ עַד חָרָן
  choice: അവർ ഹാരാൻവരെ എത്തി
  rationale: עַד എന്നതിലെ ‘വരെ’ എന്ന പരിധിബോധം നിലനിർത്തുന്നു; വെറും ‘ഹാരാനിലെത്തി’ എന്നതിനെക്കാൾ മൂലത്തോട് അടുത്തതാണ്.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: അവിടെ പാർത്തു
  rationale: ישב ഇവിടെ താമസിക്കുക/വസിക്കുക എന്ന അർഥത്തിലാണ്; ‘പാർത്തു’ താൽക്കാലികമായി നിന്നു എന്നതിലുപരി താമസബോധം നൽകുന്നു.
theological_decisions:
- issue: וַיֵּצְאוּ אִתָּם എന്ന പാഠത്തിലെ കർത്താവും സഹചാരസൂചനയും തമ്മിലുള്ള ദുഷ്കരത
  choice: ‘അവർ അവരോടൊപ്പം പുറപ്പെട്ടു’ എന്ന് പ്രധാനപാഠത്തിൽ നിലനിർത്തി
  alternative: ‘അവർ ഒരുമിച്ചു പുറപ്പെട്ടു’ അല്ലെങ്കിൽ ചില പുരാതന സാക്ഷ്യങ്ങളുടെ അടിസ്ഥാനത്തിൽ ‘അവൻ അവരെ കൂട്ടിക്കൊണ്ടു പുറപ്പെട്ടു’
  rationale: മസോററ്റിക് പാഠത്തിന്റെ യഥാർഥ വ്യാകരണദുഷ്കരത വ്യാഖ്യാനിച്ച് നീക്കാതെ സംരക്ഷിക്കുകയാണ്; അടിക്കുറിപ്പ് വായനക്കാരനെ പ്രശ്നത്തെക്കുറിച്ച് അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ബന്ധനിർദേശങ്ങളിലെ ആവർത്തനം മൂലപാഠത്തിന്റെ ഘടന സംരക്ഷിക്കാൻ ഭാഗികമായി നിലനിർത്തി. എബ്രായത്തിലെ ലളിതമായ അനുക്രമബന്ധം അനാവശ്യമായ ‘എന്നാൽ’ ചേർക്കാതെ വിവർത്തനം ചെയ്തു.
