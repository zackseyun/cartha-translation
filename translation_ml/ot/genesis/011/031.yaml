- from: തേരഹ് തന്റെ മകനായ അബ്രാമിനെയും, തന്റെ മകന്റെ മകനായ ഹാരാന്റെ മകൻ ലോത്തിനെയും[a], തന്റെ മകനായ അബ്രാമിന്റെ ഭാര്യയും തന്റെ മരുമകളുമായ സാറായിയെയും കൂട്ടിക്കൊണ്ടുപോയി. കനാൻദേശത്തേക്കു പോകാൻ അവർ കൽദയരുടെ ഊരിൽനിന്ന് അവരോടൊപ്പം പുറപ്പെട്ടു[b]. അവർ ഹാരാൻവരെ എത്തി അവിടെ പാർത്തു.
  to: തേരഹ് തന്റെ മകനായ അബ്രാമിനെയും, തന്റെ മകന്റെ മകനായ ഹാരാന്റെ മകനായ ലോത്തിനെയും[a], തന്റെ മകനായ അബ്രാമിന്റെ ഭാര്യയും തന്റെ മരുമകളുമായ സാറായിയെയും കൂട്ടിക്കൊണ്ടുപോയി. കനാൻദേശത്തേക്കു പോകാൻ അവർ കൽദയരുടെ ഊരിൽനിന്ന് അവരോടൊപ്പം പുറപ്പെട്ടു[b]. അവർ ഹാരാൻവരെ എത്തി അവിടെ താമസിച്ചു.
  rationale: 'The revision makes two limited Malayalam improvements only: it clarifies Lot’s relation to Haran in the main text and uses the natural residence verb “താമസിച്ചു.” It deliberately preserves the Masoretic Text’s grammatically difficult plural “they … with them” and retains the explanatory footnote, rather than resolving the crux through a particular textual reconstruction.'
