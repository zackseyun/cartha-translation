revisions:
- from: സെരൂഗിന് മുപ്പതു വയസ്സായപ്പോൾ നാഹോർ ജനിച്ചു.
  to: സെരൂഗിന് മുപ്പതു വയസ്സായപ്പോൾ അവൻ നാഹോരിന്റെ പിതാവായി.
  rationale: The revision preserves the concise age formula while explicitly expressing the paternal relationship encoded by וַיּוֹלֶד.
  reviewer_model: gpt-5.6-terra
