id: GEN.11.22
reference: Genesis 11:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְחִ֥י שְׂר֖וּג שְׁלֹשִׁ֣ים שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת נָחֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/022.yaml
  text: Serug lived thirty years and fathered Nahor.
translation:
  language: ml
  text: സെരൂഗിന് മുപ്പതു വയസ്സായപ്പോൾ അവൻ നാഹോരിന്റെ പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: വയസ്സായപ്പോൾ
  rationale: വംശാവലിസൂത്രത്തിൽ חיה എന്ന ക്രിയയും കാലദൈർഘ്യവും ചേർന്ന് ഒരാളുടെ പ്രായം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മുപ്പതു വയസ്സായപ്പോൾ’ എന്നു പറയുന്നത് ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שְׂרוּג
  choice: സെരൂഗ്
  rationale: വ്യക്തിനാമം ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത് മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: മുപ്പതു വയസ്സ്
  rationale: അക്ഷരാർഥത്തിൽ ‘മുപ്പതു വർഷം’ എന്നാണെങ്കിലും ഇവിടെ പ്രായമാണ് ഉദ്ദേശിക്കുന്നത്; ആ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: וַיּוֹלֶד
  choice: ജനിച്ചു
  rationale: ഹിഫീൽ രൂപം വംശാവലിയിൽ പുരുഷന്റെ സന്താനോൽപ്പാദനത്തെ സൂചിപ്പിക്കുന്നു. ‘നാഹോർ ജനിച്ചു’ എന്ന മലയാളപ്രയോഗം പിതൃബന്ധവും സംഭവവും സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘ജനിപ്പിച്ചു’ എന്ന അസ്വാഭാവിക പ്രയോഗം ഒഴിവാക്കി.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകമാണ്; മലയാളത്തിൽ സ്വതന്ത്ര പദം ആവശ്യമില്ല.
- source_word: נָחוֹר
  choice: നാഹോർ
  rationale: വ്യക്തിനാമം ഹീബ്രു രൂപത്തോട് അടുത്ത് മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്തിക്കൊണ്ട് പ്രായസൂത്രം മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
