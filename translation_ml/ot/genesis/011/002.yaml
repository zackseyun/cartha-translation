id: GEN.11.2
reference: Genesis 11:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִ֖י בְּ/נָסְעָ֣/ם מִ/קֶּ֑דֶם וַֽ/יִּמְצְא֥וּ בִקְעָ֛ה בְּ/אֶ֥רֶץ שִׁנְעָ֖ר וַ/יֵּ֥שְׁבוּ שָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/002.yaml
  text: And as they journeyed from the east[a], they found a plain in the land of Shinar and settled there.
translation:
  language: ml
  text: അവർ കിഴക്കുനിന്ന് യാത്രചെയ്യുമ്പോൾ[a], ശിനാർ ദേശത്ത് ഒരു സമതലം കണ്ടെത്തി അവിടെ താമസമുറപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘കിഴക്കോട്ട് യാത്രചെയ്യുമ്പോൾ.’ എബ്രായയിലെ מִקֶּדֶם എന്ന പ്രയോഗം പുറപ്പെട്ട സ്ഥലം (‘കിഴക്കുനിന്ന്’) എന്നോ യാത്രയുടെ ദിശ (‘കിഴക്കോട്ട്’) എന്നോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בְּנָסְעָם
  choice: അവർ … യാത്രചെയ്യുമ്പോൾ
  rationale: וַיְהִי ഇവിടെ തുടർന്നുള്ള സംഭവത്തിന്റെ സാഹചര്യത്തെ പരിചയപ്പെടുത്തുന്നു; בְּנָסְעָם പാളയം നീക്കി യാത്ര തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു. പഴഞ്ചൻ സൂത്രവാക്യം ഒഴിവാക്കി രണ്ടും സ്വാഭാവികമായ ഒരു കാലവാക്യത്തിൽ ചേർത്തു.
- source_word: מִקֶּדֶם
  choice: കിഴക്കുനിന്ന്
  rationale: מִן എന്ന ഉപസർഗം സാധാരണയായി പുറപ്പെടുന്ന ഇടത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കിഴക്കുനിന്ന്’ പ്രധാന പാഠത്തിൽ സ്വീകരിച്ചു. ‘കിഴക്കോട്ട്’ എന്ന ദിശാസൂചക വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַיִּמְצְאוּ
  choice: കണ്ടെത്തി
  rationale: מצא എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘കണ്ടെത്തുക’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: בִקְעָה
  choice: ഒരു സമതലം
  rationale: בִקְעָה വിശാലമായ താഴ്വരയെയോ സമതലത്തെയോ സൂചിപ്പിക്കാം; ശിനാർ പ്രദേശത്തിന്റെ ഭൂമിശാസ്ത്രസന്ദർഭത്തിൽ ‘സമതലം’ സ്വാഭാവികമാണ്.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: ശിനാർ ദേശത്ത്
  rationale: אֶרֶץ എന്ന ഭൂമിശാസ്ത്രപദം ‘ദേശം’ എന്നു നിലനിർത്തുകയും שִׁנְעָר എന്ന സ്ഥലനാമം ‘ശിനാർ’ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്തു.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: അവിടെ പാർപ്പുറപ്പിച്ചു
  rationale: ישב താമസിക്കുക എന്നും സ്ഥിരതാമസമാക്കുക എന്നും അർഥമാക്കാം. ജനസഞ്ചാരത്തിന്റെ ഈ സന്ദർഭത്തിൽ യാത്ര അവസാനിപ്പിച്ച് താമസമാക്കിയെന്ന ആശയം ‘പാർപ്പുറപ്പിച്ചു’ വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. എബ്രായ വാക്യഘടന യാന്ത്രികമായി പകർത്താതെ അതിന്റെ സംഭവക്രമവും മִקֶּדֶם എന്ന പദപ്രയോഗത്തിലെ യഥാർഥ ദ്വയാർഥതയും സംരക്ഷിച്ചു.
