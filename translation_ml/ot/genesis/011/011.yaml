id: GEN.11.11
reference: Genesis 11:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְחִי שֵׁ֗ם אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת אַרְפַּכְשָׁ֔ד חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/011.yaml
  text: And Shem lived five hundred years after he fathered Arpachshad, and he fathered sons and daughters.
translation:
  language: ml
  text: അർപ്പക്ഷദിന് പിതാവായശേഷം ശേം അഞ്ഞൂറ് വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാർക്കും പുത്രിമാർക്കും പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചു
  rationale: വംശാവലിവിവരണത്തിലെ חיה എന്ന ക്രിയ ഇവിടെ നിർദിഷ്ട കാലയളവോളം തുടർന്നു ജീവിച്ചതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: שֵׁם
  choice: ശേം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരമുള്ള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: אַחֲרֵי
  choice: ശേഷം
  rationale: അർപ്പക്ഷദിന്റെ ജനനത്തിനു തുടർന്നുള്ള കാലഘട്ടം സൂചിപ്പിക്കുന്ന സമയബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הוֹלִידוֹ אֶת אַרְפַּכְשָׁד
  choice: അർപ്പക്ഷദിന്റെ അപ്പനായശേഷം
  rationale: ഹിഫിൽ രൂപമായ ילד പുരുഷകർത്താവിന്റെ പിതൃത്വത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ കൃത്രിമമായ ‘ജനിപ്പിച്ചു’ എന്നതിനെക്കാൾ ‘അപ്പനായ’ എന്ന പ്രയോഗം സ്വാഭാവികവും അർത്ഥനിഷ്ഠവുമാണ്.
- source_word: חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: അഞ്ഞൂറു വർഷം
  rationale: കാലദൈർഘ്യം വ്യക്തമാക്കുന്ന സംഖ്യാവാക്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַיּוֹלֶד
  choice: ജനിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവൻ ജനിപ്പിച്ചു/പിതാവായി’ എന്നാണെങ്കിലും, ‘അവന് ... ജനിച്ചു’ എന്ന മലയാളപ്രയോഗം പുരുഷകർത്താവിന്റെ സന്താനോൽപ്പാദനബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בָּנִים וּבָנוֹת
  choice: പുത്രന്മാരും പുത്രിമാരും
  rationale: എബ്രായപാഠം ആൺമക്കളെയും പെൺമക്കളെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനു പകരം രണ്ടും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ വംശാവലി ശൈലി. പദക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനനുസരിച്ച് ക്രമപ്പെടുത്തി; മൂലത്തിലെ എല്ലാ അർത്ഥഘടകങ്ങളും നിലനിർത്തി.
