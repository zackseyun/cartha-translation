translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. ആവർത്തനഭാരം കുറയ്ക്കാൻ രണ്ടാം ילד ക്രിയ സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ നൽകിയിരിക്കുന്നു.
