source:
  edition: WLC
  text: וַ/יְחִ֣י נָח֗וֹר אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת תֶּ֔רַח תְּשַֽׁע עֶשְׂרֵ֥ה שָׁנָ֖ה וּ/מְאַ֣ת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/025.yaml
  text: Nahor lived one hundred nineteen years after he fathered Terah, and he fathered sons and daughters.
translation:
  language: ml
  text: തേരഹിനെ ജനിപ്പിച്ചതിനുശേഷം നാഹോർ നൂറ്റിപ്പത്തൊൻപത് വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാരെയും പുത്രിമാരെയും ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചു
  rationale: വംശാവലിവിവരണങ്ങളിൽ חיה എന്ന ക്രിയ പേരെടുത്ത മകന്റെ ജനനശേഷമുള്ള തുടർന്നുള്ള ആയുസ്സിനെ സൂചിപ്പിക്കുന്നു; ‘ജീവിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־תֶּרַח
  choice: തേരഹിന് ജന്മം നൽകിയശേഷം
  rationale: ഈ ഘടന തേരഹിന്റെ ജനനത്തിനു ശേഷമുള്ള കാലയളവിനെ അടയാളപ്പെടുത്തുന്നു. ‘ജന്മം നൽകി’ ילד എന്ന കാരകക്രിയയുടെ സജീവ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תֶּרַח
  choice: തേരഹ്
  rationale: ഹീബ്രു പേരിന്റെ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: תְּשַׁע עֶשְׂרֵה שָׁנָה וּמְאַת שָׁנָה
  choice: നൂറ്റിപ്പത്തൊൻപത് വർഷം
  rationale: ഹീബ്രുവിലെ 19 + 100 എന്ന സംഖ്യാക്രമം മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיּוֹלֶד
  choice: അയാൾക്ക് … ജനിച്ചു
  rationale: പുരുഷനെ കർത്താവാക്കി ‘ജനിപ്പിച്ചു’ എന്നു പറയുന്നതിനെക്കാൾ, സന്താനങ്ങൾ ഉണ്ടായെന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; എങ്കിലും ക്രിയയുടെ വംശാവലിസംബന്ധിയായ അർഥം നിലനിർത്തുന്നു.
- source_word: בָּנִים וּבָנוֹת
  choice: പുത്രന്മാരും പുത്രിമാരും
  rationale: ഹീബ്രു ആൺ-പെൺ സന്താനങ്ങളെ പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനു പകരം ആ പ്രത്യേകത സംരക്ഷിക്കുന്നു.
