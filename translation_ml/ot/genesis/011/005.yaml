  yaml_path: translation/ot/genesis/011/005.yaml
  text: Then Yahweh came down to see the city and the tower that the sons of man had built[a].
translation:
  language: ml
  text: അപ്പോൾ യഹോവ മനുഷ്യർ പണിത നഗരവും ഗോപുരവും കാണാൻ ഇറങ്ങിവന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ, ‘മനുഷ്യന്റെ പുത്രന്മാർ’; ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: ഇറങ്ങിവന്നു
  rationale: ירד എന്ന ക്രിയയുടെ മൂർത്തമായ ‘താഴേക്ക് ഇറങ്ങുക’ എന്ന അർഥവും തുടർച്ചയായ ആഖ്യാനചലനവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നൽകുന്നു.
- source_word: לִרְאֹת
  choice: കാണാൻ
  rationale: ראה എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘പരിശോധിക്കാൻ’ എന്നു പറഞ്ഞ് ഉദ്ദേശ്യം അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: הָעִיר
  choice: നഗരം
  rationale: עִיר എന്ന പദത്തിന്റെ സ്വാഭാവികവും സാധാരണവുമായ മലയാളപരിഭാഷ.
- source_word: הַמִּגְדָּל
  choice: ഗോപുരം
  rationale: מִגְדָּל എന്ന പദത്തിന് സന്ദർഭോചിതമായ സാധാരണ മലയാളപദം.
- source_word: בָּנוּ
  choice: പണിതിരുന്ന
  rationale: ഇറങ്ങിവന്നതിനു മുമ്പുള്ള മനുഷ്യരുടെ നിർമാണപ്രവർത്തനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി മുൻകാലബന്ധത്തോടെ അവതരിപ്പിക്കുന്നു; നിർമാണം നിർബന്ധമായും പൂർണമായിരുന്നു എന്ന് അധികമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: בְּנֵי הָאָדָם
  choice: മനുഷ്യപുത്രന്മാർ
  rationale: എബ്രായത്തിലെ ‘മനുഷ്യന്റെ പുത്രന്മാർ’ എന്ന പുരുഷലിംഗരൂപം കഴിയുന്നത്ര നിലനിർത്തുകയും അതിന്റെ സമൂഹവാചകമായ മാനവിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യഹോവ ഇറങ്ങിവരുന്നതായ മനുഷ്യരൂപക വിവരണം
  choice: ‘ഇറങ്ങിവന്നു’ എന്ന മൂർത്തമായ പ്രയോഗം നിലനിർത്തി.
  alternative: ‘താഴേക്കു നോക്കി’ / ‘ശ്രദ്ധ തിരിച്ചു’
  rationale: എബ്രായ ആഖ്യാനത്തിലെ മനുഷ്യരൂപകവും സാഹിത്യപരമായ സംഘർഷവും അമൂർത്തമാക്കി മൃദൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: בְּנֵי הָאָדָם എന്ന പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: പ്രധാനവാചകത്തിൽ ‘മനുഷ്യപുത്രന്മാർ’ എന്നു നൽകി.
  alternative: ‘മനുഷ്യർ’ / ‘മനുഷ്യവർഗം’
  rationale: മൂലത്തിലെ രൂപം സംരക്ഷിക്കുമ്പോൾ തന്നെ അത് മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നതാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഇറങ്ങിവന്നു’ എന്നത് മൂലത്തിലെ മനുഷ്യരൂപക ചലനം നിലനിർത്തുന്നു; ‘മനുഷ്യപുത്രന്മാർ’ മൂലരൂപത്തോട് അടുപ്പമുള്ളതിനാൽ അതിന്റെ സമൂഹവാചക അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചിരിക്കുന്നു.
