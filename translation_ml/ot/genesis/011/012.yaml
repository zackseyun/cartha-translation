id: GEN.11.12
reference: Genesis 11:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַרְפַּכְשַׁ֣ד חַ֔י חָמֵ֥שׁ וּ/שְׁלֹשִׁ֖ים שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת שָֽׁלַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/012.yaml
  text: And Arpachshad lived thirty-five years and fathered Shelah[a][b][c].
translation:
  language: ml
  text: അർപ്പക്ഷാദ് മുപ്പത്തിയഞ്ചു വയസ്സായപ്പോൾ ശേലഹിന്റെ പിതാവായി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘അഞ്ചും മുപ്പതും വർഷം ജീവിച്ചു.’'
    reason: lexical_alternative
  - marker: b
    text: ശേലഹ് എന്ന പേര് ചില പാരമ്പര്യങ്ങളിൽ ‘ശാലഹ്’ എന്നും എഴുതിയിട്ടുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: അർപ്പക്ഷാദ്
  rationale: വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന וְ മലയാളത്തിലെ സ്വാഭാവിക വാക്യബന്ധത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ ഉൾക്കൊള്ളുന്നു; വ്യക്തിനാമം എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്തു.
- source_word: חַי חָמֵשׁ וּ/שְׁלֹשִׁים שָׁנָה
  choice: മുപ്പത്തിയഞ്ചു വയസ്സായപ്പോൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘അഞ്ചും മുപ്പതും വർഷം ജീവിച്ചു’ എന്ന എബ്രായ പ്രയോഗം വംശാവലി സൂത്രവാക്യത്തിൽ ആ പ്രായത്തിലെത്തിയതിനെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ അതേ അർഥം നൽകുന്നു.
- source_word: וַ/יּוֹלֶד
  choice: പിതാവായി
  rationale: הוליד എന്ന ഹിഫീൽ രൂപം വംശാവലിയിൽ ഒരാളെ ജനിപ്പിക്കുക അഥവാ അയാളുടെ പിതാവാകുക എന്നർഥം നൽകുന്നു; ‘പിതാവായി’ സ്വാഭാവികവും കൃത്യവുമായ മലയാളമാണ്.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നിശ്ചിത കർമത്തെ അടയാളപ്പെടുത്തുന്ന എബ്രായ വ്യാകരണഘടകമാണിത്; മലയാളത്തിൽ വിഭക്തിയും വാക്യഘടനയും അതിന്റെ ധർമം നിർവഹിക്കുന്നു.
- source_word: שָׁלַח
  choice: ശേലഹ്
  rationale: മസോരറ്റിക് എബ്രായത്തിലെ שֶׁלַח എന്ന ഉച്ചാരണരൂപത്തെ അടുത്ത് പിന്തുടരുന്ന ലിപ്യന്തരണം.
