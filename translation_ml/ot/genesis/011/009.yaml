source:
  edition: WLC
  text: עַל כֵּ֞ן קָרָ֤א שְׁמָ/הּ֙ בָּבֶ֔ל כִּי שָׁ֛ם בָּלַ֥ל יְהוָ֖ה שְׂפַ֣ת כָּל הָ/אָ֑רֶץ וּ/מִ/שָּׁם֙ הֱפִיצָ֣/ם יְהוָ֔ה עַל פְּנֵ֖י כָּל הָ/אָֽרֶץ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/009.yaml
  text: Therefore its name was called Babel[a], because there Yahweh confused the language of all the earth, and from there Yahweh scattered them over the face of all the earth.
translation:
  language: ml
  text: അതുകൊണ്ട് അതിന് ബാബേൽ[a] എന്നു പേരായി; കാരണം അവിടെ യാഹ്‌വെ ഭൂമി മുഴുവന്റെയും ഭാഷ കലക്കിക്കളഞ്ഞു. അവിടെനിന്ന് യാഹ്‌വെ അവരെ ഭൂമിയിലെങ്ങും ചിതറിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ബാബേൽ” എന്ന പേര് ‘കലക്കുക’ അല്ലെങ്കിൽ ‘കൂട്ടിക്കലർത്തുക’ എന്നർഥമുള്ള ബലാൽ (balal) എന്ന എബ്രായ ക്രിയയോട് ശബ്ദസാമ്യമുള്ളതാണ്; ഈ വാക്യം ആ പേരിനെ അങ്ങനെ വിശദീകരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: പേരിടലിന്റെ കാരണം സൂചിപ്പിക്കുന്ന എബ്രായ നിഗമനപ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: קָרָא שְׁמָהּ
  choice: അതിന് ... എന്നു പേരായി
  rationale: അക്ഷരാർഥത്തിൽ ‘അവൻ അതിന്റെ പേര് വിളിച്ചു’ എന്നാണെങ്കിലും കർത്താവ് വ്യക്തമല്ല; മലയാളത്തിലെ സ്വാഭാവികമായ നാമകരണപ്രയോഗം ഉപയോഗിച്ച് ആ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: בָּבֶל
  choice: ബാബേൽ
  rationale: സ്ഥലപ്പേര് ലിപ്യന്തരണം ചെയ്തു; בָּלַל എന്ന ക്രിയയുമായുള്ള ശബ്ദസാമ്യം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: בָּלַל
  choice: കലക്കിക്കളഞ്ഞു
  rationale: ഭാഷയെ കൂട്ടിക്കലർത്തി ആശയവിനിമയം കുഴപ്പത്തിലാക്കിയ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പേരുമായുള്ള ശബ്ദബന്ധവും ‘കലക്കുക’ ഭാഗികമായി സൂക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: שְׂפַת כָּל הָאָרֶץ
  choice: ഭൂമിയിലെ എല്ലാവരുടെയും ഭാഷ
  rationale: שָׂפָה എന്നതിന്റെ അക്ഷരാർഥം ‘ചുണ്ട്’ ആണെങ്കിലും ഇവിടെ അത് സംസാരഭാഷയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; כָּל־הָאָרֶץ മനുഷ്യസമൂഹത്തെയും ഭൂമിയെയുമുള്ള സന്ദർഭസൂചനയോടെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הֱפִיצָם
  choice: അവരെ ... ചിതറിച്ചു
  rationale: פוץ എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ആളുകളെ ഭൂമിശാസ്ത്രപരമായി പരത്തിയെന്ന കാരകാർഥം വ്യക്തമാക്കുന്നു.
- source_word: עַל פְּנֵי כָּל הָאָרֶץ
  choice: ഭൂമിയിലെങ്ങും
  rationale: അക്ഷരാർഥമായ ‘ഭൂമിയുടെ മുഖത്തിന്മേൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: ‘ഭൂമി മുഴുവന്റെയും ഭാഷ’ എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: ഭൂമിയിലെ എല്ലാവരുടെയും ഭാഷ
  alternative: ഭൂമി മുഴുവന്റെയും ഭാഷ
  rationale: שְׂפַת כָּל הָאָרֶץ എന്നത് ഈ സന്ദർഭത്തിൽ ഭൂമിയിലെ ജനങ്ങളുടെ സംസാരത്തെ സൂചിപ്പിക്കുന്നു. ലോകവ്യാപകതയുടെ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വ്യക്തമായി നൽകി; അതിന്റെ കൃത്യമായ ഭൂമിശാസ്ത്രപരിധിയെ പാഠത്തിന് അതീതമായി നിർണയിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായ നാമകരണവാക്യത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ പദാനുപദരൂപം ഒഴിവാക്കി. ‘ബാബേൽ/ബലാൽ’ ശബ്ദക്രീഡ പ്രധാനവാചകത്തിൽ പൂർണമായി പുനരാവിഷ്കരിക്കാനാകാത്തതിനാൽ [a] അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
