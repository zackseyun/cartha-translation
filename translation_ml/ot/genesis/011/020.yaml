  yaml_path: translation/ot/genesis/011/020.yaml
  text: And Reu lived thirty-two years and fathered Serug.
translation:
  language: ml
  text: രെയൂ മുപ്പത്തിരണ്ടു വയസ്സുള്ളപ്പോൾ സെരൂഗിന്റെ പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചശേഷം
  rationale: വംശാവലിസൂത്രത്തിൽ പറഞ്ഞിരിക്കുന്ന പ്രായംവരെ ജീവിച്ചതിനുശേഷമാണ് അടുത്ത സംഭവം നടന്നതെന്ന ഹീബ്രു അനുക്രമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: רְעוּ
  choice: രെയൂ
  rationale: ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ വ്യക്തിനാമലിപ്യന്തരണം.
- source_word: שְׁתַּיִם וּשְׁלֹשִׁים שָׁנָה
  choice: മുപ്പത്തിരണ്ടു വർഷം
  rationale: ഹീബ്രുവിലെ ‘രണ്ടും മുപ്പതും’ എന്ന സംഖ്യാക്രമത്തെ കൃത്യമായ മൂല്യം നിലനിർത്തി സ്വാഭാവിക ആധുനിക മലയാളക്രമത്തിൽ നൽകുന്നു.
- source_word: וַיּוֹלֶד
  choice: ജന്മം നൽകി
  rationale: ഹിഫിൽ രൂപം വംശാവലിയിൽ പിതാവെന്ന നിലയിൽ സന്താനജനനത്തെ സൂചിപ്പിക്കുന്നു; ലിംഗഭേദമുള്ള ക്രിയാപദത്തെ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: ഇത് ഹീബ്രുവിലെ നേരിട്ടുള്ള കർമസൂചകമാണ്; മലയാളത്തിൽ സ്വതന്ത്ര പദസമാനത ആവശ്യമില്ല.
- source_word: שְׂרוּג
  choice: സെരൂഗ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: וַיּוֹלֶד എന്ന വംശാവലിപദം ജൈവപിതൃത്വമായി അവതരിപ്പിക്കൽ
  choice: ജന്മം നൽകി
  alternative: സെരൂഗിന്റെ പിതാവായി / സെരൂഗിനെ ജനിപ്പിച്ചു
  rationale: മൂലപാഠം രെയൂവിനെ പിതാവായി അവതരിപ്പിക്കുന്നുവെങ്കിലും ഗർഭധാരണത്തെയോ പ്രസവത്തെയോ സൂചിപ്പിക്കുന്നില്ല. ‘ജന്മം നൽകി’ എന്ന പ്രയോഗം വംശാവലിയിലെ പിതൃത്വബന്ധം നിലനിർത്തുന്നു; പ്രത്യേക ജൈവപ്രക്രിയയെ അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി. പുരാതനഭാവമുള്ള ‘ജനിപ്പിച്ചു’ എന്നതിനു പകരം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘ജന്മം നൽകി’ ഉപയോഗിച്ചു.
