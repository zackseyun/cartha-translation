  text: חֲמֵ֨שׁ עֶשְׂרֵ֤ה אַמָּה֙ מִ/לְ/מַ֔עְלָ/ה גָּבְר֖וּ הַ/מָּ֑יִם וַ/יְכֻסּ֖וּ הֶ/הָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/020.yaml
  text: The waters rose fifteen cubits higher, and the mountains were covered.
translation:
  language: ml
  text: വെള്ളം പതിനഞ്ച് മുഴം കൂടി ഉയർന്നു; പർവതങ്ങൾ മൂടപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּבְרוּ הַמַּיִם
  choice: വെള്ളം ... ഉയർന്നു
  rationale: גבר എന്ന ക്രിയയുടെ അടിസ്ഥാനഭാവം ‘ശക്തിപ്പെടുക/മേൽക്കൈ നേടുക’ എന്നാണെങ്കിലും, വെള്ളപ്പൊക്കത്തിന്റെ ഉയരം അളക്കുന്ന ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഉയർന്നു’ എന്നു നൽകി.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה מִלְמַעְלָה
  choice: പതിനഞ്ചു മുഴംകൂടി
  rationale: അളവിനെ സൂചിപ്പിക്കുന്ന ‘പതിനഞ്ചു മുഴം’ നിലനിർത്തി; מִלְמַעְלָהയുടെ ‘മുകളിലേക്ക്/കൂടുതൽ’ എന്ന ബന്ധാർഥം മലയാളത്തിൽ ‘കൂടി’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: וַיְכֻסּוּ הֶהָרִים
  choice: പർവതങ്ങൾ മൂടപ്പെട്ടു
  rationale: പുഅൽ നിഷ്ക്രിയരൂപത്തിന്റെ അർഥം നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘പതിനഞ്ചു മുഴംകൂടി’ എന്ന അളവിന്റെ ആപേക്ഷിക അടിസ്ഥാനം
  choice: ആപേക്ഷിക അടിസ്ഥാനം വിശദീകരിക്കാതെ മൂലപാഠത്തിലെ സംക്ഷിപ്തത നിലനിർത്തി
  alternative: ‘പർവതശിഖരങ്ങൾക്കുമുകളിൽ പതിനഞ്ചു മുഴം’ എന്ന് വ്യക്തമാക്കുക
  rationale: എബ്രായ വാക്യം അളവിന്റെ ബന്ധം സംക്ഷിപ്തമായി മാത്രം പറയുന്നു; സന്ദർഭം പർവതങ്ങൾക്ക് മുകളിലായിരിക്കാമെന്ന് സൂചിപ്പിച്ചാലും, വിവർത്തനത്തിൽ അത് കൂടുതൽ കൃത്യമാക്കി ചേർക്കുന്നത് യഥാർഥത്തിലുള്ള ചെറിയ അസ്പഷ്ടത പരിഹരിച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘മുഴം’ എന്ന പരമ്പരാഗത ബൈബിൾ അളവുപദം സാധാരണ വായനക്കാർക്ക് പരിചിതമായതിനാൽ നിലനിർത്തി.
