  to: വെള്ളം ശക്തിപ്രാപിക്കുകയും ഭൂമിയുടെമേൽ അത്യന്തം വർധിക്കുകയും ചെയ്തു; പെട്ടകം വെള്ളത്തിന്റെ ഉപരിതലത്തിൽ നീങ്ങി.[a]
