source:
  edition: WLC
  text: וַ/יִּגְבְּר֥וּ הַ/מַּ֛יִם וַ/יִּרְבּ֥וּ מְאֹ֖ד עַל הָ/אָ֑רֶץ וַ/תֵּ֥לֶךְ הַ/תֵּבָ֖ה עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/018.yaml
  text: The waters prevailed and increased greatly over the earth[a], and the ark moved along on the surface of the waters.
translation:
  language: ml
  text: വെള്ളം ശക്തിപ്രാപിക്കുകയും ഭൂമിയുടെമേൽ അത്യന്തം വർധിക്കുകയും ചെയ്തു; പെട്ടകം വെള്ളത്തിന്റെ ഉപരിതലത്തിൽ നീങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വെള്ളത്തിന്റെ ഉപരിതലത്തിൽ ഒഴുകിനടന്നു.’ ഹീബ്രുവിൽ അക്ഷരാർഥം ‘വെള്ളത്തിന്റെ മുഖത്തിന്മേൽ പോയി’ എന്നാണ്; വെള്ളത്തിന്റെ ഉപരിതലത്തിലെ ചലനത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: ശക്തിപ്രാപിച്ച്
  rationale: גבר എന്ന ക്രിയ വെള്ളം ശക്തമായിത്തീർന്നതും മേൽക്കൈ നേടിയതുമായ ആശയം നൽകുന്നു. പ്രളയവിവരണത്തിലെ ശക്തിയുടെ ഭാവം നിലനിർത്താൻ ഈ പ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: הַמַּיִם
  choice: വെള്ളം
  rationale: ഹീബ്രുവിൽ രൂപപരമായി ബഹുവചനമായിരുന്നാലും, മലയാളത്തിൽ ഈ സന്ദർഭത്തിൽ ‘വെള്ളം’ എന്ന ഏകവചനസമൂഹനാമമാണ് സ്വാഭാവികം.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: അത്യന്തം വർധിച്ചു
  rationale: רבה-യോടുകൂടിയ מְאֹד വർധനയെ ശക്തമായി ഊന്നുന്നു; ‘അത്യന്തം വർധിച്ചു’ ആ തീവ്രത വ്യക്തമായി പകരുന്നു.
- source_word: עַל הָאָרֶץ
  choice: ഭൂമിയുടെമേൽ
  rationale: אֶרֶץ എന്നതിന് ‘ഭൂമി’ എന്നും ‘ദേശം’ എന്നും അർഥമാകാം. പ്രളയവിവരണത്തിന്റെ വിശാലമായ സന്ദർഭത്തിൽ ‘ഭൂമി’ യോജിക്കുന്നു.
- source_word: וַתֵּלֶךְ
  choice: നീങ്ങി
  rationale: הלך അക്ഷരാർഥത്തിൽ ‘പോയി’ എന്നാണ്. വെള്ളത്തിന്മേലുള്ള പെട്ടകത്തിന്റെ ചലനം സ്വാഭാവികമായി അറിയിക്കാനും, ഒഴുകിയ രീതി അനാവശ്യമായി നിർണയിക്കാതിരിക്കാനും ‘നീങ്ങി’ ഉപയോഗിച്ചു.
- source_word: הַתֵּבָה
  choice: പെട്ടകം
  rationale: നോഹയുടെ תֵּבָה-യ്ക്ക് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സന്ദർഭോചിതവുമായ പദം ‘പെട്ടകം’ ആണ്.
- source_word: עַל פְּנֵי הַמָּיִם
  choice: വെള്ളത്തിന്റെ ഉപരിതലത്തിലൂടെ
  rationale: ‘വെള്ളത്തിന്റെ മുഖത്തിന്മേൽ’ എന്ന ഹീബ്രു പ്രയോഗം വെള്ളത്തിന്റെ ഉപരിതലത്തെ സൂചിപ്പിക്കുന്നു. ചലനം കൂടി വ്യക്തമാക്കാൻ ‘ഉപരിതലത്തിലൂടെ’ എന്നു നൽകി.
