reference: Genesis 7:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה תִּֽקַּח לְ/ךָ֛ שִׁבְעָ֥ה שִׁבְעָ֖ה אִ֣ישׁ וְ/אִשְׁתּ֑/וֹ וּ/מִן הַ/בְּהֵמָ֡ה אֲ֠שֶׁר לֹ֣א טְהֹרָ֥ה הִ֛וא שְׁנַ֖יִם אִ֥ישׁ וְ/אִשְׁתּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/002.yaml
  text: From every clean animal you shall take for yourself seven pairs[a], a male and its mate; and from the animals that are not clean, two[b], a male and its mate.
translation:
  language: ml
  text: ശുദ്ധിയുള്ള ഓരോ മൃഗത്തിൽനിന്നും നിനക്കായി ആണും അതിന്റെ ഇണയുമുള്ള ഏഴു ജോടികളെ[a] എടുക്കണം; ശുദ്ധിയില്ലാത്ത മൃഗങ്ങളിൽനിന്നും ആണും അതിന്റെ ഇണയുമുള്ള രണ്ടെണ്ണത്തെ[b] എടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ പദശഃ: ‘ഏഴ് ഏഴ്, ആണും അതിന്റെ ഇണയും.’ ഇത് മിക്കവാറും ഏഴു ജോടി എന്നാണ് അർഥമാക്കുന്നത്; എന്നാൽ ചിലർ ഇത് ആകെ ഏഴ് മൃഗങ്ങൾ എന്നും മനസ്സിലാക്കുന്നു.'
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘അശുദ്ധമായ മൃഗങ്ങൾ.’ എബ്രായത്തിൽ ‘ശുദ്ധമല്ലാത്ത മൃഗം’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הַבְּהֵמָה
  choice: ഓരോ മൃഗത്തിൽനിന്നും
  rationale: מִן + כֹּל എന്നത് ഉറവിടഗണത്തിൽനിന്നുള്ള വിതരണാർഥം നൽകുന്നു. ഏകവചനമായ കൂട്ടനാമത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഓരോ മൃഗത്തിൽനിന്നും’ എന്നു നൽകി.
- source_word: הַטְּהוֹרָה
  choice: ശുദ്ധിയുള്ള
  rationale: ഇവിടെ טָהוֹר മൃഗങ്ങളുടെ ശുദ്ധി–അശുദ്ധി വേർതിരിവിനെ സൂചിപ്പിക്കുന്നു. ‘ആചാരപരമായി ശുദ്ധമായ’ എന്നു മുഖ്യവാചകത്തിൽ ചേർക്കുന്നത് മൂലപാഠത്തേക്കാൾ വിശദീകരണപരമായിരിക്കും.
- source_word: תִּקַּח לְךָ
  choice: നിനക്കായി എടുക്കണം
  rationale: ക്രിയാരൂപം നിർദേശമായി പ്രവർത്തിക്കുന്നു; לְךָ എന്ന ഘടകവും ‘നിനക്കായി’ എന്ന് നിലനിർത്തി.
- source_word: שִׁבְעָה שִׁבְעָה
  choice: ഏഴു ജോടിയെ
  rationale: ആവർത്തിച്ച സംഖ്യ കൂട്ടം/വിതരണം സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള ‘ആണും അതിന്റെ ഇണയും’ എന്ന പ്രയോഗം ഏഴ് ആൺ-പെൺ ജോടികളെന്ന അർഥത്തെ ശക്തിപ്പെടുത്തുന്നു. യഥാർഥ സംശയസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: אִישׁ וְאִשְׁתּוֹ
  choice: ആണിനെയും അതിന്റെ ഇണയെയും
  rationale: പദശഃ ‘പുരുഷനും അവന്റെ ഭാര്യയും’ എന്ന രൂപമാണെങ്കിലും മൃഗങ്ങളെക്കുറിച്ചുള്ള സാഹചര്യത്തിൽ ലിംഗജോടിയെ സൂചിപ്പിക്കുന്ന ഭാഷാശൈലിയാണിത്. മനുഷ്യബന്ധഭാഷ അനാവശ്യമായി ചുമത്താതെ സ്വാഭാവിക മലയാളം തെരഞ്ഞെടുത്തു.
- source_word: אֲשֶׁר לֹא טְהֹרָה הִוא
  choice: ശുദ്ധിയില്ലാത്ത
  rationale: എബ്രായത്തിലെ വിശകലനാത്മകമായ ‘ശുദ്ധിയുള്ളതല്ല’ എന്ന നിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായ ‘ശുദ്ധിയില്ലാത്ത’ എന്ന രൂപത്തിൽ നൽകി; ‘അശുദ്ധമായ’ എന്ന ഏകപദം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി.
- source_word: שְׁנַיִם
  choice: രണ്ടെണ്ണത്തെ
  rationale: മൂലത്തിലെ സംഖ്യ ‘രണ്ട്’ എന്നതാണ്. പിന്നാലെയുള്ള ആൺ–ഇണ വിശദീകരണം അത് ഒരു ജോടിയാണെന്ന് വ്യക്തമാക്കുന്നു; അതിനാൽ ‘ഒരു ജോടി’ എന്ന് മാറ്റാതെ സംഖ്യ നേരിട്ട് നിലനിർത്തി.
theological_decisions:
- issue: ശുദ്ധിയുള്ള മൃഗങ്ങളുടെ സംഖ്യ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ഏഴു ജോടി
  alternative: ഏഴ് മൃഗങ്ങൾ; അല്ലെങ്കിൽ പദശഃ ‘ഏഴ് ഏഴ്’
  rationale: שִׁבְעָה שִׁבְעָה എന്നതിന് പിന്നാലെ ‘ആണും അതിന്റെ ഇണയും’ വരുന്നതും, ശുദ്ധിയില്ലാത്തവയെക്കുറിച്ച് ‘രണ്ട്’ എന്ന് പറയുന്നതുമായ താരതമ്യവും ഏഴ് ജോടികളെന്ന വായനയെ പിന്തുണയ്ക്കുന്നു. എന്നിരുന്നാലും ഏഴ് ഒറ്റ മൃഗങ്ങൾ എന്ന പരമ്പരാഗത വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മൃഗം,’ ‘ശുദ്ധിയുള്ള/ശുദ്ധിയില്ലാത്ത,’ ‘ഇണ’ എന്നീ സാധാരണക്കാർക്ക് മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. നിർദേശസ്വരം ‘എടുക്കണം’ എന്നതിലൂടെ നൽകി; മുഖ്യവാചകത്തിലെ ദീർഘമായ ഘടന വായനാസൗകര്യത്തിനായി ഡാഷുകളാൽ വേർതിരിച്ചു.
