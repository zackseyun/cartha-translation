  text: מִן הַ/בְּהֵמָה֙ הַ/טְּהוֹרָ֔ה וּ/מִן הַ֨/בְּהֵמָ֔ה אֲשֶׁ֥ר אֵינֶ֖נָּ/ה טְהֹרָ֑ה וּ/מִ֨ן הָ/ע֔וֹף וְ/כֹ֥ל אֲשֶׁר רֹמֵ֖שׂ עַל הָֽ/אֲדָמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/008.yaml
  text: From the clean animals and from the animals that are not clean[a], and from the birds and everything that creeps on the ground—
translation:
  language: ml
  text: ശുദ്ധമായ മൃഗങ്ങളിൽനിന്നും ശുദ്ധമല്ലാത്ത മൃഗങ്ങളിൽനിന്നും[a], പക്ഷികളിൽനിന്നും, നിലത്ത് ഇഴയുന്നതെല്ലാം—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അശുദ്ധമായ മൃഗങ്ങളിൽനിന്നും.’ എബ്രായത്തിൽ അക്ഷരാർഥമായി, ‘ശുദ്ധമല്ലാത്ത’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  choice: -യിൽനിന്നും
  rationale: പട്ടികയിലെ ഓരോ ജീവിവർഗത്തിൽനിന്നുള്ളവയെ സൂചിപ്പിക്കുന്ന എബ്രായ മുൻപ്രത്യയത്തിന്റെ ആവർത്തനവും താളവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּהֵמָה
  choice: മൃഗങ്ങൾ
  rationale: പക്ഷികളിൽനിന്നും ഇഴജന്തുക്കളിൽനിന്നും വേർതിരിച്ച വിശാലമായ ജീവിവർഗമാണിവിടെ ഉദ്ദേശിക്കുന്നത്; ‘കന്നുകാലികൾ’ എന്നത് അർഥം അനാവശ്യമായി ചുരുക്കും.
- source_word: טְּהוֹרָה
  choice: ശുദ്ധമായ
  rationale: ആചാരപരമായ ജീവിവർഗീകരണത്തെ സൂചിപ്പിക്കാൻ മലയാള ബൈബിൾ ഭാഷയിലും സാധാരണ വായനയിലും വ്യക്തമായ പദമാണ്.
- source_word: אֲשֶׁר אֵינֶנָּה טְהֹרָה
  choice: ശുദ്ധമല്ലാത്ത
  rationale: ‘അശുദ്ധമായ’ എന്ന ഒറ്റപ്പദത്തിനു പകരം എബ്രായത്തിലെ നിഷേധാത്മക ഘടനയായ ‘ശുദ്ധമല്ലാത്ത’ എന്ന രൂപം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: עוֹף
  choice: പക്ഷികൾ
  rationale: ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും മതിയായ കൃത്യതയുള്ളതുമായ ആധുനിക മലയാള പ്രയോഗം.
- source_word: כֹּל אֲשֶׁר רֹמֵשׂ
  choice: ഇഴയുന്ന സകലവും
  rationale: ചെറിയ നിലജീവികളുടെ ഇഴയുന്ന ചലനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ക്രിയാഭാവം നിലനിർത്തുന്നു.
- source_word: עַל הָאֲדָמָה
  choice: നിലത്ത്
  rationale: ഇഴയുന്ന ജീവികളുടെ ആവാസതലമായ മണ്ണിനെയോ നിലത്തെയോ ഇവിടെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
