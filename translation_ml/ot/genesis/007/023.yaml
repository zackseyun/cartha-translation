id: GEN.7.23
reference: Genesis 7:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּ֜מַח אֶֽת כָּל הַ/יְק֣וּם אֲשֶׁ֣ר עַל פְּנֵ֣י הָֽ/אֲדָמָ֗ה מֵ/אָדָ֤ם עַד בְּהֵמָה֙ עַד רֶ֨מֶשׂ֙ וְ/עַד ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יִּמָּח֖וּ מִן הָ/אָ֑רֶץ וַ/יִשָּׁ֧אֶר אַךְ נֹ֛חַ וַֽ/אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָֽה־־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/023.yaml
  text: He blotted out every living thing that was on the face of the ground[a], from man to livestock to creeping things and to the birds of the heavens. They were blotted out from the earth, and only Noah was left[c][b], and those who were with him in the ark.
translation:
  language: ml
  text: അവൻ നിലത്തിന്റെ ഉപരിതലത്തിൽ ഉണ്ടായിരുന്ന സകല ജീവജാലങ്ങളെയും തുടച്ചുനീക്കി[a]—മനുഷ്യൻ[b] മുതൽ കന്നുകാലികളും ഇഴജന്തുക്കളും ആകാശത്തിലെ പക്ഷികളും[c] വരെ. അവ ഭൂമിയിൽനിന്ന് തുടച്ചുനീക്കപ്പെട്ടു. നോഹയും പെട്ടകത്തിൽ അവനോടുകൂടെ ഉണ്ടായിരുന്നതും മാത്രം ശേഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മായിച്ചുകളഞ്ഞു’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായക്രിയയ്ക്ക് തുടച്ചുകളയുകയോ എഴുത്ത് മായിക്കുകയോ ചെയ്യുന്ന ദൃശ്യഭാവമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘മനുഷ്യൻ’ എന്നത് മനുഷ്യവർഗത്തെ പ്രതിനിധീകരിക്കുന്നു; ‘മനുഷ്യവർഗം മുതൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘ആകാശങ്ങളുടെ പക്ഷികൾ’; ‘വാനിലെ പക്ഷികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמַח / וַיִּמָּחוּ
  choice: തുടച്ചുനീക്കി / തുടച്ചുനീക്കപ്പെട്ടു
  rationale: מחה എന്ന ക്രിയയിലെ തുടച്ചുകളയുക, മായിച്ചുകളയുക എന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു; രണ്ടാം പ്രയോഗത്തിലെ നിഫാൽ രൂപം കർമണിപ്രയോഗമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: כָּל הַיְקוּם
  choice: സകല ജീവജാലങ്ങളെയും
  rationale: പ്രളയസന്ദർഭത്തിൽ ഈ പദം അമൂർത്തമായ ‘അസ്തിത്വം’ എന്നതിലുപരി നിലത്തുള്ള ജീവനുള്ള സൃഷ്ടികളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: നിലത്തിന്റെ ഉപരിതലത്തിലുണ്ടായിരുന്ന
  rationale: ‘നിലത്തിന്റെ മുഖത്ത്’ എന്ന എബ്രായ ദൃശ്യത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מֵאָדָם
  choice: മനുഷ്യൻമുതൽ
  rationale: אָדָם ഇവിടെ മനുഷ്യവർഗത്തെ പ്രതിനിധീകരിക്കുന്ന ഏകവചനമാണ്; പിന്നാലെയുള്ള ജീവിവർഗങ്ങളുടെ പട്ടികയോടു ചേർന്ന ‘മുതൽ ... വരെ’ ഘടന നിലനിർത്തുന്നു.
- source_word: בְּהֵמָה
  choice: കന്നുകാലികൾ
  rationale: വളർത്തുമൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതവും പൊതുവേ മനസ്സിലാകുന്നതുമായ പദം.
- source_word: רֶמֶשׂ
  choice: ഇഴജന്തുക്കൾ
  rationale: നിലത്തോടു ചേർന്ന് ഇഴഞ്ഞോ ചെറുചലനങ്ങളോടെയോ സഞ്ചരിക്കുന്ന ജീവികളെ സൂചിപ്പിക്കുന്ന പരിചിതമായ മലയാളപദം.
- source_word: עוֹף הַשָּׁמַיִם
  choice: ആകാശത്തിലെ പക്ഷികൾ
  rationale: എബ്രായത്തിലെ ആകാശബന്ധം വ്യക്തമായി സൂക്ഷിക്കുമ്പോഴും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാം.
- source_word: מִן הָאָרֶץ
  choice: ഭൂമിയിൽനിന്ന്
  rationale: אֶרֶץ എന്ന പദത്തിന്റെ ‘ഭൂമി/ദേശം’ എന്ന അർഥവ്യാപ്തിയിൽ, പ്രളയവിവരണത്തിന്റെ വിശാലമായ ഭാഷയ്ക്കു യോജിച്ച ‘ഭൂമി’ തിരഞ്ഞെടുത്തു.
- source_word: וַיִּשָּׁאֶר אַךְ נֹחַ
  choice: നോഹ ... മാത്രം ശേഷിച്ചു
  rationale: אַךְ എന്ന നിയന്ത്രണാർഥക കണത്തിന്റെ ‘മാത്രം’ എന്ന അർഥവും שׁאר എന്ന ക്രിയയുടെ ‘ശേഷിക്കുക’ എന്ന അർഥവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַאֲשֶׁר אִתּוֹ בַּתֵּבָה
  choice: പെട്ടകത്തിൽ അവനോടുകൂടെ ഉണ്ടായിരുന്നവരും
  rationale: നോഹയോടൊപ്പം പെട്ടകത്തിലുണ്ടായിരുന്ന ആളുകളെയും ജീവികളെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന വിധത്തിൽ എബ്രായ ബന്ധവാക്യത്തിന്റെ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രളയനാശത്തിന്റെ വ്യാപ്തി
  choice: വാക്യം പറയുന്നതുപോലെ നിലത്തുണ്ടായിരുന്ന സകല ജീവജാലങ്ങളും ഭൂമിയിൽനിന്ന് തുടച്ചുനീക്കപ്പെട്ടതായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് പ്രാദേശിക പ്രളയത്തെക്കുറിച്ചുള്ള അതിശയോക്തിയാണെന്നോ ആധുനിക ശാസ്ത്രീയ അർഥത്തിൽ വ്യക്തമായ ആഗോള പ്രസ്താവനയാണെന്നോ വിവർത്തനത്തിൽ നിർണ്ണയിക്കുക.
  rationale: എബ്രായ വിവരണത്തിന്റെ ശക്തിയും പട്ടികപ്പെടുത്തിയ ജീവിവർഗങ്ങളും അതേപടി നിലനിർത്തുന്നു; പ്രളയത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തിയെക്കുറിച്ചുള്ള തർക്കം വിവർത്തനം തന്നെ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തനം (‘തുടച്ചുനീക്കി / തുടച്ചുനീക്കപ്പെട്ടു’) ഉദ്ദേശപൂർവം നിലനിർത്തി. അവസാന ബന്ധവാക്യം മനുഷ്യരെ മാത്രം സൂചിപ്പിക്കുന്നതായി ചുരുക്കാതെ, പെട്ടകത്തിൽ നോഹയോടുകൂടെ ഉണ്ടായിരുന്ന എല്ലാവരെയും ഉൾക്കൊള്ളാവുന്ന രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
