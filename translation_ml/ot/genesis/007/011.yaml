  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שֵׁשׁ מֵא֤וֹת שָׁנָה֙ לְ/חַיֵּי נֹ֔חַ בַּ/חֹ֨דֶשׁ֙ הַ/שֵּׁנִ֔י בְּ/שִׁבְעָֽה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ בַּ/יּ֣וֹם הַ/זֶּ֗ה נִבְקְעוּ֙ כָּֽל מַעְיְנֹת֙ תְּה֣וֹם רַבָּ֔ה וַ/אֲרֻבֹּ֥ת הַ/שָּׁמַ֖יִם נִפְתָּֽחוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/011.yaml
  text: In the six hundredth year of Noah’s life[a], in the second month, on the seventeenth day of the month, on that day all the springs of the great deep burst open[b], and the windows of the heavens were opened.
translation:
  language: ml
  text: നോഹയുടെ ജീവിതത്തിലെ അറുനൂറാം വർഷത്തിൽ, രണ്ടാം മാസത്തിൽ, ആ മാസത്തിന്റെ പതിനേഴാം ദിവസം—അന്നേ ദിവസം മഹാ ആഴിയുടെ ഉറവുകളെല്ലാം[a] പിളർന്നുതുറന്നു; ആകാശത്തിന്റെ ജാലകങ്ങളും[b] തുറക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മഹാ ആഴിയുടെ ജലസ്രോതസ്സുകളെല്ലാം.’
    reason: מַעְיְנֹת എന്ന പദത്തിന് ‘ഉറവുകൾ’, ‘ജലസ്രോതസ്സുകൾ’ എന്നീ അടുത്ത അർത്ഥങ്ങൾ സാധ്യമാണ്.
  - marker: b
    text: അഥവാ, ‘ആകാശത്തിന്റെ പ്രളയകവാടങ്ങളും.’
    reason: אֲרֻבֹּת എന്ന ദൃശ്യപ്രയോഗം സന്ദർഭത്തിൽ വെള്ളം ഒഴുകിവരുന്ന കവാടങ്ങളായും ഗ്രഹിക്കാം.
lexical_decisions:
- source_word: בִּשְׁנַת שֵׁשׁ מֵאוֹת שָׁנָה לְחַיֵּי נֹחַ
  choice: നോഹയുടെ ജീവിതത്തിലെ അറുനൂറാം വർഷത്തിൽ
  rationale: നോഹയുടെ ആയുഷ്കാലം അടിസ്ഥാനമാക്കിയുള്ള എബ്രായ കാലനിർണയരീതി സ്വാഭാവികവും കൃത്യവുമായി നിലനിർത്തുന്നു.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: രണ്ടാം മാസം, ആ മാസത്തിലെ പതിനേഴാം ദിവസം
  rationale: എബ്രായത്തിലെ തീയതിപ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בַּיּוֹם הַזֶּה
  choice: അന്നുതന്നെ
  rationale: മുമ്പ് വ്യക്തമാക്കിയ അതേ ദിവസത്തെയാണ് ഊന്നിപ്പറയുന്നതെന്ന ഭാവം സംക്ഷിപ്തമായി പകരുന്നു.
- source_word: נִבְקְעוּ
  choice: പിളർന്നുതുറന്നു
  rationale: בקע എന്ന ധാതുവിലെ പിളരുക/ഭേദിക്കപ്പെടുക എന്ന ശക്തമായ ദൃശ്യഭാവവും സംഭവത്തിന്റെ ആകസ്മികതയും നിലനിർത്തുന്നു.
- source_word: כָּל מַעְיְנֹת תְּהוֹם רַבָּה
  choice: മഹാ ആഴിയുടെ ഉറവുകളെല്ലാം
  rationale: מַעְיְנֹת എന്നത് സാധാരണയായി ഉറവുകളെ സൂചിപ്പിക്കുന്നു; תְּהוֹם רַבָּה എന്ന പ്രാചീന ജലഗഹനത്തിന്റെ ദൃശ്യരൂപം ആധുനിക ശാസ്ത്രീയ വിശദീകരണമായി മാറ്റാതെ ‘മഹാ ആഴി’ എന്നു നിലനിർത്തുന്നു.
- source_word: וַאֲרֻבֹּת הַשָּׁמַיִם
  choice: ആകാശത്തിന്റെ ജാലകങ്ങളും
  rationale: אֲרֻבֹּת എന്ന പദത്തിന്റെ ജാലകം/തുറവ് എന്ന മൂലദൃശ്യം സംരക്ഷിക്കുകയും שָׁמַיִם എന്നത് സന്ദർഭോചിതമായി സ്വാഭാവിക മലയാളത്തിൽ ‘ആകാശം’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: נִפְתָּחוּ
  choice: തുറക്കപ്പെട്ടു
  rationale: എബ്രായ നിഫാൽ രൂപത്തിലെ സ്വീകരണഭാവം വ്യക്തമായി പകരുന്നു.
theological_decisions:
- issue: പ്രളയജലത്തെക്കുറിച്ചുള്ള പ്രാചീന പ്രപഞ്ചദൃശ്യം
  choice: ‘മഹാ ആഴി’, ‘ആകാശത്തിന്റെ ജാലകങ്ങൾ’ എന്നീ ദൃശ്യപ്രയോഗങ്ങൾ നിലനിർത്തി.
  alternative: ‘ഭൂഗർഭജലം പൊട്ടിപ്പുറപ്പെട്ടു’, ‘ആകാശത്തിലെ പ്രളയകവാടങ്ങൾ തുറന്നു’ എന്നിങ്ങനെ ആധുനികവത്കരിച്ചോ വ്യാഖ്യാനിച്ചോ നൽകുക.
  rationale: മൂലവാക്യത്തിലെ പ്രപഞ്ചദൃശ്യം ആഖ്യാനത്തിന്റെ അവിഭാജ്യഘടകമാണ്; അതിനെ ശാസ്ത്രീയ വിശദീകരണമായി പരിവർത്തനം ചെയ്യാതെ അതിലെ അർത്ഥതീവ്രതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ദീർഘമായ തീയതിപ്രയോഗം വ്യക്തമായി വായിക്കാനായി ഡാഷും അർദ്ധവിരാമവും ഉപയോഗിച്ചു; മൂലത്തിലെ ആവർത്തനവും പ്രാചീന പ്രപഞ്ചദൃശ്യവും അനാവശ്യമായി ലളിതമാക്കിയിട്ടില്ല.
