id: GEN.7.13
reference: Genesis 7:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/עֶ֨צֶם הַ/יּ֤וֹם הַ/זֶּה֙ בָּ֣א נֹ֔חַ וְ/שֵׁם וְ/חָ֥ם וָ/יֶ֖פֶת בְּנֵי נֹ֑חַ וְ/אֵ֣שֶׁת נֹ֗חַ וּ/שְׁלֹ֧שֶׁת נְשֵֽׁי בָנָ֛י/ו אִתָּ֖/ם אֶל הַ/תֵּבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/013.yaml
  text: On that very day Noah entered the ark[a], with Shem, Ham, and Japheth, Noah’s sons, and Noah’s wife[c][b], and the three wives of his sons with them.
translation:
  language: ml
  text: ആ ദിവസംതന്നെ നോഹയും നോഹയുടെ പുത്രന്മാരായ ശേമും ഹാമും യാഫെത്തും നോഹയുടെ ഭാര്യയും അവരോടൊപ്പം അവന്റെ പുത്രന്മാരുടെ മൂന്നു ഭാര്യമാരും പെട്ടകത്തിൽ പ്രവേശിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പെട്ടകത്തിലേക്കു വന്നു.’ ഹീബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘വന്നു’ എന്നാണ്; സന്ദർഭത്തിൽ അത് പെട്ടകത്തിൽ പ്രവേശിച്ചതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ആ ദിവസംതന്നെ
  rationale: בְּעֶצֶם എന്ന പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ദിവസംതന്നെ’ എന്നു നിലനിർത്തുന്നു.
- source_word: בָּא ... אֶל הַתֵּבָה
  choice: പെട്ടകത്തിൽ പ്രവേശിച്ചു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘വന്നു’ എന്നാണെങ്കിലും, אֶל הַתֵּבָה എന്ന ലക്ഷ്യപ്രയോഗത്തോടൊപ്പം ഇവിടെ പെട്ടകത്തിനകത്തേക്കുള്ള പ്രവേശനമാണ് സന്ദർഭാർഥം.
- source_word: נֹחַ
  choice: നോഹ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ പേരുരൂപം.
- source_word: וְשֵׁם וְחָם וָיֶפֶת בְּנֵי נֹחַ
  choice: നോഹയുടെ പുത്രന്മാരായ ശേമും ഹാമും യാഫെത്തും
  rationale: അനുബന്ധ നാമപ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ഹീബ്രായിലെ ഏകോപനക്രമവും നിലനിർത്തുന്നു.
- source_word: וְאֵשֶׁת נֹחַ
  choice: നോഹയുടെ ഭാര്യയും
  rationale: ഹീബ്രായിലെ ബന്ധസൂചക ഘടന നേരായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּשְׁלֹשֶׁת נְשֵׁי בָנָיו
  choice: അവന്റെ പുത്രന്മാരുടെ മൂന്നു ഭാര്യമാരും
  rationale: എണ്ണവും കുടുംബബന്ധവും കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: אִתָּם
  choice: അവരോടൊപ്പം
  rationale: പുരുഷലിംഗ ബഹുവചന സർവനാമം മറച്ചുവയ്ക്കാതെ പദാനുസൃതമായി നിലനിർത്തുന്നു; ഏറ്റവും സ്വാഭാവികമായി മുമ്പ് പറഞ്ഞ കുടുംബസംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַתֵּבָה
  choice: പെട്ടകം
  rationale: നോഹയുടെ വിവരണത്തിൽ תֵּבָהയ്ക്കുള്ള സ്ഥാപിതവും സാധാരണക്കാർക്ക് പരിചിതവുമായ മലയാള പദം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഹീബ്രായ വാക്യത്തിലെ പേരുകളുടെ ക്രമവും אִתָּם എന്ന ബഹുവചനത്തിന്റെ അർഥവും നിലനിർത്തിയിട്ടുണ്ട്; മലയാളത്തിൽ കർത്തൃസംഘം ആദ്യം ചേർത്ത് വായനാസൗകര്യം വർധിപ്പിച്ചു.
