id: GEN.7.3
reference: Genesis 7:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: גַּ֣ם מֵ/ע֧וֹף הַ/שָּׁמַ֛יִם שִׁבְעָ֥ה שִׁבְעָ֖ה זָכָ֣ר וּ/נְקֵבָ֑ה לְ/חַיּ֥וֹת זֶ֖רַע עַל פְּנֵ֥י כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/003.yaml
  text: Also from the birds of the sky[a], seven and seven, male and female, to keep offspring alive on the face of all the earth.
translation:
  language: ml
  text: കൂടാതെ, ആകാശത്തിലെ പക്ഷികളിൽനിന്ന്, ആണും പെണ്ണുമായി ഏഴ് ഏഴ്[a], ഭൂമിയുടെ എല്ലായിടത്തും സന്തതിയെ ജീവനോടെ നിലനിർത്താൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഏഴു ജോടി.’ എബ്രായത്തിൽ അക്ഷരാർഥമായി ‘ഏഴ്, ഏഴ്’ എന്നാണ്. ഈ വിതരണപ്രയോഗം ഓരോ ഇനത്തിലും ഏഴ് വീതം എന്നോ ഏഴു ജോടി എന്നോ മനസ്സിലാക്കാം; മുഖ്യപാഠം എബ്രായരൂപം കൂടുതൽ അടുത്തായി നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: കൂടാതെ
  rationale: മുൻവാക്യത്തിലെ മൃഗങ്ങളെക്കുറിച്ചുള്ള കല്പനയോട് പക്ഷികളെയും കൂട്ടിച്ചേർക്കുന്ന തുടർച്ച സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מֵעוֹף הַשָּׁמַיִם
  choice: ആകാശത്തിലെ പക്ഷികളിൽനിന്ന്
  rationale: עוֹף ഇവിടെ പറക്കുന്ന ജീവികളെ, സന്ദർഭത്തിൽ പക്ഷികളെ, സൂചിപ്പിക്കുന്നു; הַשָּׁמַיִם എന്നതിന് ഈ സാഹചര്യത്തിൽ സ്വാഭാവികമായ മലയാളം ‘ആകാശം’ ആണ്.
- source_word: שִׁבְעָה שִׁבְעָה
  choice: ഏഴേഴ്
  rationale: ആവർത്തിച്ച സംഖ്യയുടെ വിതരണാർഥവും എബ്രായ രൂപത്തിന്റെ സംക്ഷിപ്തതയും നിലനിർത്തുന്നു; ‘ഏഴു ജോടി’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധമാക്കുന്നില്ല.
- source_word: זָכָר וּנְקֵבָה
  choice: ആണും പെണ്ണുമായി
  rationale: ലിംഗജോടിയെ നേരിട്ടും സാധാരണ മലയാളത്തിലും വ്യക്തമാക്കുന്നു.
- source_word: לְחַיּוֹת
  choice: ജീവനോടെ നിലനിർത്തേണ്ടതിന്
  rationale: ഹിഫീൽ രൂപത്തിലെ ജീവിപ്പിക്കുക അഥവാ ജീവൻ സംരക്ഷിക്കുക എന്ന കാരണാർഥം ഉദ്ദേശ്യവാക്യമായി വ്യക്തമാക്കുന്നു.
- source_word: זֶרַע
  choice: സന്തതി
  rationale: അക്ഷരാർഥമായ ‘വിത്ത്’ എന്നതിനു പകരം, പ്രളയാനന്തരം ജീവജാലങ്ങളുടെ തുടർച്ചയെ സൂചിപ്പിക്കുന്ന ജൈവാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: ഭൂമിയിലെങ്ങും
  rationale: ‘ഭൂമിയുടെ മുഴുവൻ മുഖത്തും’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ വ്യാപ്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: שִׁבְעָה שִׁבְעָה എന്ന പ്രയോഗം ഏഴ് വീതമോ ഏഴു ജോടിയോ എന്ന ചോദ്യം
  choice: മുഖ്യപാഠത്തിൽ ‘ഏഴേഴ്’ എന്ന് രൂപസാദൃശ്യം നിലനിർത്തി
  alternative: ‘ഏഴു ജോടി’
  rationale: എബ്രായത്തിലെ ആവർത്തനം വിതരണാർഥമുള്ളതാണെങ്കിലും എണ്ണം കണക്കാക്കുന്ന രീതി സംബന്ധിച്ച വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ യഥാർഥ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലപാഠം മുൻവാക്യത്തിലെ കല്പനയെ തുടർന്നുള്ള ഖണ്ഡവാക്യമാകുന്നതിനാൽ പുതിയ ക്രിയ ചേർക്കാതെ ഡാഷ് ഉപയോഗിച്ച് ഉദ്ദേശ്യവാക്യത്തോട് ബന്ധിപ്പിച്ചു.
