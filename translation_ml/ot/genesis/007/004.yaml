  source_fidelity: The Malayalam accurately conveys the Hebrew temporal notice, explicit divine agency in the causative ‘make rain,’ forty days and nights, and the wiping-out judgment. It appropriately distinguishes הָאָרֶץ (‘ഭൂമി’) from הָאֲדָמָה (‘നിലം’). ‘സകല ജീവജാലങ്ങളെയും’ follows the English POB’s context-sensitive rendering of כָּל־הַיְקוּם without overstating it as all existence.
