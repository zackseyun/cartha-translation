id: GEN.7.4
reference: Genesis 7:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּי֩ לְ/יָמִ֨ים ע֜וֹד שִׁבְעָ֗ה אָֽנֹכִי֙ מַמְטִ֣יר עַל הָ/אָ֔רֶץ אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה וּ/מָחִ֗יתִי אֶֽת כָּל הַ/יְקוּם֙ אֲשֶׁ֣ר עָשִׂ֔יתִי מֵ/עַ֖ל פְּנֵ֥י הָֽ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/004.yaml
  text: For in seven more days I will make it rain on the earth forty days and forty nights[d][c][b][a], and I will wipe out every living thing that I have made from the face of the ground.
translation:
  language: ml
  text: കാരണം, ഇനി ഏഴു ദിവസം കഴിഞ്ഞാൽ[a] ഞാൻ ഭൂമിയിൽ നാല്പതു പകലും നാല്പതു രാത്രിയും മഴ പെയ്യിക്കും; ഞാൻ ഉണ്ടാക്കിയ സകല ജീവജാലങ്ങളെയും[b] നിലത്തിന്റെ ഉപരിതലത്തിൽനിന്ന്[c] തുടച്ചുനീക്കും[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഏഴു ദിവസംകൂടി കഴിഞ്ഞ്.’ മഴ തുടങ്ങുന്നതിനു മുമ്പ് ഏഴു ദിവസം ശേഷിക്കുന്നു എന്നാണ് ഹീബ്രു പ്രയോഗത്തിന്റെ ആശയം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: ‘നിലനിൽക്കുന്നതെല്ലാം.’ ഈ സന്ദർഭത്തിൽ സൃഷ്ടിക്കപ്പെട്ട ജീവജാലങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ‘നിലം’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഹീബ്രുപദം, വാക്യത്തിന്റെ മുൻഭാഗത്ത് ‘ഭൂമി’ എന്നു പരിഭാഷപ്പെടുത്തിയ പദത്തിൽനിന്ന് വ്യത്യസ്തമാണ്.
    reason: lexical_distinction
  - marker: d
    text: അഥവാ ‘മായ്ച്ചുകളയും.’ ഹീബ്രു ക്രിയ തുടച്ചുകളയുന്നതിന്റെയോ മായ്ച്ചുനീക്കുന്നതിന്റെയോ ദൃശ്യബിംബം നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ കല്പനയ്ക്കുള്ള കാരണം ഈ വാക്യം വിശദീകരിക്കുന്നതിനാൽ, ഹീബ്രു ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְיָמִים עוֹד שִׁבְעָה
  choice: ഇനി ഏഴു ദിവസം കഴിഞ്ഞാൽ
  rationale: മഴ തുടങ്ങുന്നതിനു മുമ്പ് ഏഴു ദിവസംകൂടി ശേഷിക്കുന്നു എന്ന ഹീബ്രു കാലസൂചന സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אָנֹכִי מַמְטִיר
  choice: ഞാൻ ... മഴ പെയ്യിക്കും
  rationale: מטר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണകർത്തൃത്വവും אָנֹכִי എന്ന വ്യക്തമായ സർവനാമത്തിന്റെ ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: עַל הָאָרֶץ
  choice: ഭൂമിയിൽ
  rationale: പ്രളയവിധിയുടെ വിശാലമായ സന്ദർഭത്തിൽ אֶרֶץ എന്നതിന്റെ നേരായ അർഥം നൽകുന്നു; പിന്നീട് വരുന്ന אֲדָמָהയിൽനിന്നുള്ള പദവ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: നാല്പതു പകലും നാല്പതു രാത്രിയും
  rationale: മൂലത്തിലെ ക്രമവും കാലദൈർഘ്യവും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וּמָחִיתִי
  choice: തുടച്ചുനീക്കും
  rationale: מחה എന്ന ക്രിയയിലെ തുടച്ചുകളയുക അഥവാ മായ്ച്ചുകളയുക എന്ന ദൃശ്യബിംബവും സമ്പൂർണ നീക്കവും ആധുനിക മലയാളത്തിൽ പകർന്നു നൽകുന്നു.
- source_word: כָּל הַיְקוּם
  choice: സകല ജീവജാലങ്ങളെയും
  rationale: പ്രളയസന്ദർഭത്തിൽ നിലനിൽക്കുന്ന സൃഷ്ടജീവികളുടെ സമഗ്രതയെ സൂചിപ്പിക്കുന്നു; ‘സകല അസ്തിത്വവും’ എന്നു പറഞ്ഞ് പരിധി അമിതമായി വിപുലീകരിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: ഞാൻ ഉണ്ടാക്കിയ
  rationale: വിധിക്കു വിധേയമാകുന്നവ ദൈവത്തിന്റെ സ്വന്തം സൃഷ്ടിയാണെന്ന ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: നിലത്തിന്റെ ഉപരിതലത്തിൽനിന്ന്
  rationale: ‘മുഖം’ എന്ന ഹീബ്രു രൂപകം മലയാളത്തിൽ സ്വാഭാവികമായ ‘ഉപരിതലം’ എന്നു നൽകുകയും, മുമ്പത്തെ אֶרֶץ (‘ഭൂമി’) എന്നതിൽനിന്ന് אֲדָמָה (‘നിലം’) വേർതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: אֶרֶץ / כָּל הַיְקוּם എന്നിവയിലെ പ്രളയവിധിയുടെ വ്യാപ്തി
  choice: ‘ഭൂമി’, ‘സകല ജീവജാലങ്ങൾ’ എന്നീ വിശാലമായ സൃഷ്ടിവ്യാപക പദങ്ങൾ ഉപയോഗിച്ചു; വിധിയെ വെറും പ്രാദേശിക സംഭവമായി ചുരുക്കിയില്ല.
  alternative: אֶרֶץ എന്നത് ‘ദേശം’ എന്നും כָּל הַיְקוּם എന്നത് കൂടുതൽ പ്രാദേശിക പരിധിയിലുള്ള ജീവികൾ എന്നും പരിഭാഷപ്പെടുത്താം.
  rationale: വാക്യത്തിലെ വിധിഭാഷ സമഗ്രവും വിശാലവുമാണ്. എന്നാൽ പരിഭാഷ ആധുനിക ശാസ്ത്രീയമോ സഭാവിഭാഗപരമോ ആയ പ്രളയവ്യാപ്തിവാദം കൂട്ടിച്ചേർക്കാതെ പാഠത്തിന്റെ ശക്തി മാത്രം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മഴ പെയ്യിക്കും’ ദൈവിക കാരണകർത്തൃത്വം നേരിട്ട് വ്യക്തമാക്കുന്നു. ‘നിലത്തിന്റെ ഉപരിതലം’ എന്ന പ്രയോഗം ഹീബ്രുവിലെ ഭൂമി/നിലം പദവ്യത്യാസം സംരക്ഷിക്കുമ്പോഴും അത്യന്തം പദാനുപദമായ ‘നിലത്തിന്റെ മുഖം’ എന്ന അസ്വാഭാവിക രൂപം ഒഴിവാക്കുന്നു.
