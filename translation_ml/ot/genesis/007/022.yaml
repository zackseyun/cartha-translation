  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֹּ֡ל אֲשֶׁר֩ נִשְׁמַת ר֨וּחַ חַיִּ֜ים בְּ/אַפָּ֗י/ו מִ/כֹּ֛ל אֲשֶׁ֥ר בֶּ/חָֽרָבָ֖ה מֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/022.yaml
  text: Everything on the dry land in whose nostrils was the breath of the spirit of life died[a][b].
translation:
  language: ml
  text: ഉണങ്ങിയ നിലത്തുണ്ടായിരുന്നതും മൂക്കിൽ ജീവശ്വാസമുണ്ടായിരുന്നതുമായ സകലവും മരിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ജീവന്റെ ആത്മാവിന്റെ ശ്വാസം.” “ജീവശ്വാസം” എന്നും മനസ്സിലാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: സകലവും
  rationale: യോഗ്യത നിറവേറ്റുന്ന മനുഷ്യരെയും മൃഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന സമഗ്രമായ പ്രയോഗം; സന്ദർഭത്തിൽ സ്വാഭാവികമായ കൂട്ടായ നപുംസക രൂപം.
- source_word: נִשְׁמַת רוּחַ חַיִּים
  choice: ജീവശ്വാസം
  rationale: സംയുക്തമായ എബ്രായ പ്രയോഗത്തിന്റെ പ്രധാന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥത്തിലെ ‘ജീവന്റെ ആത്മാവിന്റെ ശ്വാസം’ എന്ന ഘടന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בְּאַפָּיו
  choice: മൂക്കിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ മൂക്കുതുളകളിൽ’ എന്ന വിതരണ ഏകവചനമാണെങ്കിലും, കൂട്ടായ മുൻപദത്തോടൊപ്പം മലയാളത്തിൽ ‘മൂക്കിൽ’ സ്വാഭാവികവും അർഥവ്യക്തവുമാണ്.
- source_word: מִכֹּל אֲשֶׁר בֶּחָרָבָה
  choice: ഉണങ്ങിയ നിലത്തുണ്ടായിരുന്നവയിൽ
  rationale: ജലജീവികളിൽനിന്ന് കരയിലെ ജീവികളെ വേർതിരിക്കുന്ന പരിധി നിലനിർത്തുന്നു; מִן എന്ന ബന്ധവും മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: מֵתוּ
  choice: ചത്തു
  rationale: മരണം സംഭവിച്ചതിനെ നേരിട്ടും ലളിതമായും അറിയിക്കുന്ന ക്രിയ; മനുഷ്യരെയും മൃഗങ്ങളെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ യോജിക്കുന്നു.
theological_decisions:
- issue: נִשְׁמַת רוּחַ חַיִּים എന്ന പ്രയോഗത്തിലെ רוּחַയുടെ പ്രത്യക്ഷീകരണം
  choice: പ്രധാനവാക്യത്തിൽ ‘ജീവശ്വാസം’; അക്ഷരാർഥ ഘടന അടിക്കുറിപ്പിൽ
  alternative: ‘ജീവന്റെ ആത്മാവിന്റെ ശ്വാസം’
  rationale: רוּחַയ്ക്ക് ‘ആത്മാവ്/ശ്വാസം/കാറ്റ്’ എന്ന അർഥവ്യാപ്തിയുണ്ട്. മുഖ്യവാക്യത്തിൽ അതിനെ പ്രത്യേകമായ സത്താശാസ്ത്ര പ്രസ്താവനയായി കടുപ്പിക്കാതെ സ്വാഭാവിക അർഥം നൽകുകയും, മൂലത്തിലെ സങ്കീർണത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉണങ്ങിയ നിലം’, ‘ജീവശ്വാസം’ എന്നിവ പ്രളയസന്ദർഭം വ്യക്തമായി നിലനിർത്തുന്നു; അപൂർവവും കൃത്രിമവുമായ പദക്രമം ഒഴിവാക്കി.
