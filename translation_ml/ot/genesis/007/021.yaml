id: GEN.7.21
reference: Genesis 7:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּגְוַ֞ע כָּל בָּשָׂ֣ר הָ/רֹמֵ֣שׂ עַל הָ/אָ֗רֶץ בָּ/ע֤וֹף וּ/בַ/בְּהֵמָה֙ וּ/בַ֣/חַיָּ֔ה וּ/בְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ וְ/כֹ֖ל הָ/אָדָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/021.yaml
  text: 'And all flesh that moved on the earth died: birds[a], livestock, wild animals, every swarming thing that swarms on the earth, and all mankind.'
translation:
  language: ml
  text: ഭൂമിയിൽ സഞ്ചരിച്ചിരുന്ന സകല ജഡവും—പക്ഷികളും കന്നുകാലികളും വന്യമൃഗങ്ങളും ഭൂമിയിൽ കൂട്ടമായി സഞ്ചരിച്ചിരുന്ന സകല ചെറുജീവികളും സകല മനുഷ്യരും—മരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: ചത്തുപോയി
  rationale: גוע മരിക്കുക, പ്രാണൻ വിടുക എന്നർഥം നൽകുന്നു. ജീവജാലങ്ങളെ മുഴുവൻ ഉൾക്കൊള്ളുന്ന ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളപ്രയോഗമാണ് ‘ചത്തുപോയി’.
- source_word: כָּל בָּשָׂר
  choice: സകല ജഡവും
  rationale: ‘സകല ജഡവും’ എന്നത് എബ്രായ ഭാഷാശൈലി നിലനിർത്തുകയും തുടർന്ന് പട്ടികപ്പെടുത്തുന്ന ഭൂചരജീവികളെയെല്ലാം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: הָרֹמֵשׂ
  choice: ചലിച്ചിരുന്ന
  rationale: רמש ഇഴയുക, ചരിക്കുക, ചലിക്കുക എന്നീ അർഥങ്ങൾ നൽകാം. പക്ഷികളും മൃഗങ്ങളും ഉൾപ്പെടുന്ന വിശാലവിഭാഗമായതിനാൽ ‘ചലിച്ചിരുന്ന’ എന്ന് നൽകിയിരിക്കുന്നു.
- source_word: עַל הָאָרֶץ
  choice: ഭൂമിയിൽ
  rationale: ഈ പ്രളയവിവരണത്തിൽ אֶרֶץ എന്നതിന്റെ വ്യാപ്തി സ്വാഭാവികമായി അറിയിക്കുന്ന പദം ‘ഭൂമി’ ആണ്.
- source_word: בָּעוֹף
  choice: പക്ഷികൾ
  rationale: עוֹף പറക്കുന്ന ജീവികളെ വിശാലമായി സൂചിപ്പിക്കാമെങ്കിലും ഈ ജീവിവർഗപ്പട്ടികയിൽ ‘പക്ഷികൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וּבַבְּהֵמָה
  choice: കന്നുകാലികൾ
  rationale: בְּהֵמָה ഇവിടെ വളർത്തുമൃഗങ്ങളുടെ വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘കന്നുകാലികൾ’ ആ വർഗവ്യത്യാസം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּבַחַיָּה
  choice: വന്യമൃഗങ്ങൾ
  rationale: കന്നുകാലികളോടുള്ള വ്യത്യാസത്തിൽ חַיָּה വളർത്താത്ത വന്യമൃഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: וּבְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: കൂട്ടമായി പെരുകുന്ന സകല ചെറുജീവികളും
  rationale: שׁרץ ചെറുജീവികൾ കൂട്ടമായി നിറയുകയോ പെരുകുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അസ്വാഭാവികമായ ശബ്ദാവർത്തനം ഒഴിവാക്കി ജീവിവർഗത്തിന്റെ സ്വഭാവം വ്യക്തമായി നൽകിയിരിക്കുന്നു.
- source_word: וְכֹל הָאָדָם
  choice: സകല മനുഷ്യരും
  rationale: הָאָדָם ഇവിടെ ഒരു പുരുഷവ്യക്തിയെയല്ല, മനുഷ്യവർഗത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു. ‘സകല മനുഷ്യരും’ ലിംഗപരമായി സമഗ്രവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: הָאָדָם എന്നതിന്റെ കൂട്ടായ അർഥം
  choice: സകല മനുഷ്യരും
  alternative: മനുഷ്യവർഗം മുഴുവനും
  rationale: നിശ്ചയാർഥകപദത്തോടുകൂടിയ אָדָם ഇവിടെ മനുഷ്യരാശിയെ കൂട്ടായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വ്യക്തികളെയെല്ലാം ഉൾക്കൊള്ളുന്ന ‘സകല മനുഷ്യരും’ മൂലവാക്യത്തിന്റെ പട്ടികഘടനയും സർവസമഗ്രതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള വിവരണശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ‘സകല ജഡവും’ എന്ന പ്രധാന ഭാഷാശൈലി നിലനിർത്തി; ജീവിവർഗങ്ങളുടെ പട്ടിക സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി രൂപപ്പെടുത്തി.
