  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രു ആഖ്യാനത്തിന്റെ തുടർച്ച നിലനിർത്തിക്കൊണ്ട് വാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു; ‘ആയിരുന്നു/തുടർന്നു’ എന്ന യഥാർഥ ഭാഷാപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
