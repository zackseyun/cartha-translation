  yaml_path: translation/ot/genesis/007/017.yaml
  text: And the flood was on the earth forty days[a], and the waters increased and lifted up the ark, so that it rose above the earth.
translation:
  language: ml
  text: പ്രളയം ഭൂമിയിൽ നാല്പതു ദിവസം തുടർന്നു[a]. വെള്ളം പെരുകി പെട്ടകം ഉയർത്തി; അങ്ങനെ അത് ഭൂമിയിൽനിന്ന് ഉയർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പ്രളയം ഭൂമിയിൽ നാല്പതു ദിവസം ആയിരുന്നു.” കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഈ ഹീബ്രു പ്രയോഗം കൂടുതൽ രൂപാനുസൃതമായി “ആയിരുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: തുടർന്നു
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ‘നാല്പതു ദിവസം’ എന്ന പ്രയോഗത്തോടൊപ്പം ഇവിടെ പ്രളയം അത്രയും കാലം നിലനിന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ആയിരുന്നു’ എന്ന കൂടുതൽ രൂപാനുസൃതമായ പരിഭാഷയും സാധ്യമാണ്.
- source_word: הַמַּבּוּל
  choice: പ്രളയം
  rationale: നോഹയുടെ കാലത്തെ പ്രത്യേക മഹാവെള്ളപ്പൊക്കത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിലും പൊതുഭാഷയിലും പരിചിതമായ പദം.
- source_word: אַרְבָּעִים יוֹם
  choice: നാല്പതു ദിവസം
  rationale: മൂലപാഠത്തിലെ കാലദൈർഘ്യപ്രയോഗത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: עַל הָאָרֶץ
  choice: ഭൂമിയിൽ
  rationale: പ്രളയസന്ദർഭത്തിൽ אֶרֶץ എന്ന പദത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וַיִּרְבּוּ הַמַּיִם
  choice: വെള്ളം പെരുകി
  rationale: വെള്ളത്തിന്റെ അളവും വ്യാപ്തിയും വർധിച്ചതിനെ ചുരുക്കമായും സ്വാഭാവികമായും അറിയിക്കുന്നു; ഹീബ്രുവിലെ ബഹുവചനരൂപം മലയാളത്തിൽ സാധാരണ ഏകവചനമായ ‘വെള്ളം’ എന്നു നൽകുന്നു.
- source_word: וַיִּשְׂאוּ אֶת הַתֵּבָה
  choice: പെട്ടകം ഉയർത്തി
  rationale: വെള്ളം പെട്ടകത്തെ ഭൂതലത്തിൽനിന്ന് ഉയർത്തിയ ഭൗതികപ്രവർത്തനം കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַתֵּבָה
  choice: പെട്ടകം
  rationale: നോഹയുടെ ജലവാഹനത്തിനുള്ള പരമ്പരാഗതവും സന്ദർഭത്തിൽ വ്യക്തവുമായ മലയാളപദം.
- source_word: וַתָּרָם
  choice: അത് ... ഉയർന്നു
  rationale: സ്ത്രീലിംഗ ഏകവചന ക്രിയ പെട്ടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്; വെള്ളം ഉയർത്തിയതിന്റെ ഫലമായി പെട്ടകം ഉയർന്നുവെന്ന അകർമ്മക അർഥം നിലനിർത്തുന്നു.
- source_word: מֵעַל הָאָרֶץ
  choice: ഭൂമിക്കു മുകളിലേക്ക്
  rationale: ഭൂമിയുടെ ഉപരിതലത്തിൽനിന്നുള്ള ഉയർച്ചയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
