base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/014.yaml
  text: they[a], and every wild animal according to its kind, and every livestock animal according to its kind, and every creeping thing that creeps on the earth according to its kind[b], and every bird according to its kind—every winged bird.
translation:
  language: ml
  text: അവരും, സകല കാട്ടുമൃഗങ്ങളും അതതിന്റെ ഇനപ്രകാരം, സകല വളർത്തുമൃഗങ്ങളും അതതിന്റെ ഇനപ്രകാരം, ഭൂമിയിൽ ഇഴയുന്ന സകല ഇഴജന്തുക്കളും അതതിന്റെ ഇനപ്രകാരം, സകല പക്ഷികളും അതതിന്റെ ഇനപ്രകാരം—ചിറകുള്ള സകല പക്ഷികളും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵמָּה
  choice: അവരും
  rationale: മുൻവാക്യത്തിൽ പെട്ടകത്തിൽ പ്രവേശിച്ച നോഹയെയും കൂടെയുള്ളവരെയും സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമം; തുടർന്നുള്ള പട്ടികയുമായി ബന്ധിപ്പിക്കാൻ ‘-ഉം’ ചേർത്തു.
- source_word: הַחַיָּה
  choice: കാട്ടുമൃഗങ്ങൾ
  rationale: בְּהֵמָה എന്ന വളർത്തുമൃഗവിഭാഗത്തിൽനിന്ന് വേർതിരിച്ചുള്ള വന്യ കരമൃഗങ്ങളെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הַבְּהֵמָה
  choice: വളർത്തുമൃഗങ്ങൾ
  rationale: കാളകളിൽ മാത്രം അർഥം ചുരുക്കാതെ, മനുഷ്യർ വളർത്തുന്ന മൃഗങ്ങളുടെ വിശാലവിഭാഗത്തെ സൂചിപ്പിക്കുകയും חַיָּהയുമായുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: അതതിന്റെ ഇനം അനുസരിച്ചുള്ള
  rationale: ഉല്പത്തിയിലെ വർഗീകരണഭാഷയായ ‘അതിന്റെ ഇനപ്രകാരം’ എന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: ഭൂമിയിൽ ഇഴയുന്ന ... ഇഴജന്തുക്കൾ
  rationale: നാമത്തിലും ക്രിയാവിശേഷണത്തിലും ആവർത്തിക്കുന്ന רמש എന്ന എബ്രായ ധാതുവിന്റെ ശബ്ദാർഥബന്ധം ‘ഇഴയുന്ന/ഇഴജന്തു’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָעוֹף ... כֹּל צִפּוֹר כָּל כָּנָף
  choice: സകല പക്ഷികളും—ചിറകുള്ള സകല പക്ഷികളും
  rationale: പക്ഷിവിഭാഗത്തെ സൂചിപ്പിക്കുന്നതോടൊപ്പം, അവസാനത്തെ സമാനാധികരണപരമായ ഊന്നലും ആവർത്തനവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ പട്ടികാസമാന്തര്യം, ‘അതതിന്റെ ഇനം അനുസരിച്ച്’ എന്ന വർഗീകരണഭാഷ, രמשിലെ പദപ്രയോഗം, അവസാനത്തെ പക്ഷികളെക്കുറിച്ചുള്ള ഊന്നൽ എന്നിവ പരമാവധി സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു.
