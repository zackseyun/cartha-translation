  source_fidelity: മുഖ്യവാക്യത്തിന്റെ ആദ്യഭാഗം എബ്രായത്തിലെ കൃതന്തം ("വന്നവ")യും തുടർന്നുള്ള ക്രിയയും ("വന്നു") ഉചിതമായി പ്രതിഫലിപ്പിക്കുന്നു. ‘സകല ജഡത്തിൽനിന്നും’ എന്നത് מִכָּל־בָּשָׂר എന്ന ഉറവിടരൂപകവും מִן-ന്റെ ‘നിന്ന്’ എന്ന ബന്ധവും നിലനിർത്തുന്നു. എന്നാൽ ‘യഹ്‌വെ അവന്റെ പിന്നാലെ അടച്ചു’ എന്ന അവസാനഭാഗം മലയാളത്തിൽ കർമമില്ലാതെ അസ്വാഭാവികവും അർഥം അപൂർണവുമായിരിക്കുന്നു. בַּעֲדוֹയുടെ സന്ദർഭാനുസൃത അർഥമായ ‘അവനെ അകത്തടച്ചു’ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി നൽകാം; വാതിൽ എന്ന കർമപദം ചേർക്കേണ്ടതില്ല.
  naturalness: ‘അകത്തു വന്നവ ... അകത്തു വന്നു’ എന്ന ആവർത്തനം ഉദ്ദേശ്യപൂർവവും വായനാസാധ്യമുമാണ്. ‘ആണും പെണ്ണുമായി’ ആഖ്യാനശൈലിയിൽ സ്വാഭാവികമാണ്. അവസാനത്തിലെ ‘അവന്റെ പിന്നാലെ അടച്ചു’ മാത്രം ആധുനിക നിലവാരമലയാളത്തിൽ അപൂർണമായി കേൾക്കുന്നു; ‘അവനെ അകത്തടച്ചു’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
