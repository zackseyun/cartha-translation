  text: וְ/הַ/בָּאִ֗ים זָכָ֨ר וּ/נְקֵבָ֤ה מִ/כָּל בָּשָׂר֙ בָּ֔אוּ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה אֹת֖/וֹ אֱלֹהִ֑ים וַ/יִּסְגֹּ֥ר יְהוָ֖ה בַּֽעֲדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/016.yaml
  text: And those that entered[a], male and female from all flesh, as God had commanded him[c][b]; and Yahweh shut him in.
translation:
  language: ml
  text: അകത്തു വന്നവ[a]—സകല ജഡത്തിൽനിന്നും[b] ആണും പെണ്ണുമായി—ദൈവം അവനോടു കല്പിച്ചതുപോലെ അകത്തു വന്നു; യഹ്‌വെ അവനെ അകത്തടച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അകത്തു വന്നുകൊണ്ടിരുന്നവ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘സകല ജഡം’ എന്നത് ഇവിടെ ജീവജാലങ്ങളെ കൂട്ടായി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ പിന്നിൽ അടച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. എന്താണ് അടച്ചതെന്ന് എബ്രായപാഠം തുറന്നുപറയുന്നില്ല; സന്ദർഭത്തിൽ പെട്ടകത്തിന്റെ വാതിലാണ് സൂചിതം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּאִים ... בָּאוּ
  choice: അകത്തു വന്നവ ... അകത്തു വന്നു
  rationale: നാമവിശേഷണമായി ഉപയോഗിച്ചിരിക്കുന്ന കൃതന്തവും തുടർന്നുള്ള പൂർണക്രിയയും ആവർത്തിക്കുന്ന എബ്രായ ഘടന നിലനിർത്തുന്നു; പെട്ടകത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘അകത്തു വരുക’ സ്വാഭാവികമാണ്.
- source_word: זָכָר וּנְקֵבָה
  choice: ആണും പെണ്ണുമായി
  rationale: ജീവികളുടെ ലിംഗവ്യത്യാസം സൂചിപ്പിക്കുന്ന എബ്രായ പദജോടിക്ക് സാധാരണ മലയാളത്തിൽ വ്യക്തവും സംക്ഷിപ്തവുമായ തുല്യം.
- source_word: מִכָּל בָּשָׂר
  choice: സകല ജഡത്തിൽനിന്നും
  rationale: מִן എന്ന ‘നിന്ന്’ അർഥമുള്ള ഉപസർഗവും בָּשָׂר എന്ന ‘ജഡം’ എന്ന കൂട്ടായ പ്രയോഗവും സംരക്ഷിക്കുന്നു; ഇവിടെ ജീവജാലങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: כַּאֲשֶׁר צִוָּה אֹתוֹ אֱלֹהִים
  choice: ദൈവം അവനോടു കല്പിച്ചതുപോലെ
  rationale: ദൈവകല്പനയോടുള്ള അനുരൂപത വ്യക്തമാക്കുകയും എബ്രായത്തിലെ സാധാരണ ആഖ്യാനക്രമം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ അതിന്റെ ഉച്ചാരണരൂപം നൽകുന്നു.
- source_word: וַיִּסְגֹּר ... בַּעֲדוֹ
  choice: അവന്റെ പിന്നാലെ അടച്ചു
  rationale: എന്താണ് അടച്ചതെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘വാതിൽ’ എന്നു ചേർക്കാതെ, בַּעֲדוֹയുടെ സ്ഥാനബന്ധം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ഒരു പൊതുപദവിയല്ല, വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ പേരിന്റെ ലിപ്യന്തരണം നിലനിർത്തുന്നു; പ്രത്യേക സമ്പ്രദായപരമായ സ്ഥാനപ്പേര് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: യഹ്‌വെ എന്താണ് അടച്ചത് എന്നത്
  choice: അവന്റെ പിന്നാലെ അടച്ചു
  alternative: അവനെ അകത്താക്കി വാതിൽ അടച്ചു
  rationale: സന്ദർഭത്തിൽ പെട്ടകത്തിന്റെ വാതിൽ സൂചിതമാണെങ്കിലും എബ്രായത്തിൽ ‘വാതിൽ’ എന്ന കർമപദം ഇല്ല. അതിനാൽ സൂചന വിശദീകരിക്കാതെ മൂലപാഠത്തിലെ സംക്ഷിപ്തതയും അസ്പഷ്ടതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘സകല ജഡം’ എന്ന ഉറവിടരൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി കുറിപ്പിൽ അർഥം വ്യക്തമാക്കി. എബ്രായത്തിലെ ആവർത്തനഘടനയും അവസാനവാക്യത്തിലെ സൂചിത കർമവും സംരക്ഷിച്ചു.
