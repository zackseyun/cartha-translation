id: GEN.7.6
reference: Genesis 7:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נֹ֕חַ בֶּן שֵׁ֥שׁ מֵא֖וֹת שָׁנָ֑ה וְ/הַ/מַּבּ֣וּל הָיָ֔ה מַ֖יִם עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/006.yaml
  text: Noah was six hundred years old[b][a], and the flood was upon the earth.
translation:
  language: ml
  text: നോഹയ്ക്ക് അറുനൂറു വയസ്സായിരുന്നു; പ്രളയജലം ഭൂമിയുടെമേൽ ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായവാക്യത്തിന്റെ ഘടന കൂടുതൽ അക്ഷരാർഥത്തിൽ: “പ്രളയം ഭൂമിയുടെമേൽ ജലമായിരുന്നു.” “ഭൂമി” എന്നതിന് “ദേശം” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: എബ്രായത്തിലെ הָיָה מַיִם എന്ന അസാധാരണ ഘടനയും הָאָרֶץ എന്ന പദത്തിന്റെ ‘ഭൂമി/ദേശം’ അർഥസാധ്യതയും സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: നോഹയ്ക്ക്
  rationale: നֹחַ എന്ന വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ നൽകി. തുടക്കത്തിലെ וְ ഇവിടെ മുൻവിവരണത്തോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്നു; സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ വേറൊരു ‘എന്നാൽ/ഇപ്പോൾ’ ചേർക്കാതെ അതിന്റെ ബന്ധശക്തി നിലനിർത്താം.
- source_word: בֶּן שֵׁשׁ מֵאוֹת שָׁנָה
  choice: അറുനൂറു വയസ്സായിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘അറുനൂറു വർഷത്തിന്റെ മകൻ’ എന്ന എബ്രായ പ്രയോഗം പ്രായം പറയുന്ന പതിവുശൈലിയാണ്; അതിന്റെ സ്വാഭാവിക മലയാള അർഥം നൽകി.
- source_word: וְ/הַ/מַּבּוּל
  choice: അപ്പോൾ പ്രളയം
  rationale: מַבּוּל ഉല്പത്തി 6–9-ലെ മഹാപ്രളയത്തെ സൂചിപ്പിക്കുന്നു. രണ്ടാമത്തെ וְ രണ്ട് സാഹചര്യങ്ങളെ ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അപ്പോൾ’ കാലസമകാലികത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു, എന്നാൽ ‘വന്നപ്പോൾ’ എന്ന അധിക ചലനാർഥം ചേർക്കുന്നില്ല.
- source_word: הָיָה מַיִם
  choice: ഉണ്ടായി
  rationale: അക്ഷരാർഥ ഘടന ‘ജലമായി ഉണ്ടായിരുന്നു’ എന്നതാണ്. മലയാളത്തിലെ പ്രധാനവാക്യത്തിൽ സംഭവസ്ഥിതി സ്വാഭാവികമായി അറിയിക്കാൻ ‘ഉണ്ടായി’ എന്നു നൽകി; മַיִם വ്യക്തമാക്കുന്ന ജലസ്വഭാവം ‘പ്രളയം’ എന്ന പദത്തിൽ സന്ദർഭപരമായി ഉൾക്കൊള്ളുന്നു. കൂടുതൽ അക്ഷരാർഥ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: עַל הָאָרֶץ
  choice: ഭൂമിയുടെമേൽ
  rationale: עַל എന്നത് ‘മേൽ’; הָאָרֶץ എന്നത് സന്ദർഭത്തിൽ ‘ഭൂമി’ എന്നും ‘ദേശം’ എന്നും അർഥമാക്കാം. പ്രളയവിവരണത്തിന്റെ വിശാലസന്ദർഭത്തിൽ ‘ഭൂമി’ പ്രധാനവായനയായി തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: הָאָרֶץ എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ഭൂമി
  alternative: ദേശം
  rationale: ഈ നാമത്തിന് ‘ഭൂമി’ എന്നും ‘ദേശം’ എന്നും അർഥമാകാം. പ്രളയവിവരണത്തിന്റെ ഉടൻസന്ദർഭത്തിൽ വിശാലമായ ‘ഭൂമി’ യോജിച്ചെങ്കിലും, എബ്രായത്തിലെ യഥാർഥ അർഥസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
- issue: הָיָה מַיִם എന്ന ഘടനയുടെ വ്യാഖ്യാനം
  choice: പ്രളയം ... ഉണ്ടായി
  alternative: പ്രളയം ഭൂമിയുടെമേൽ ജലമായി ഉണ്ടായിരുന്നു
  rationale: പ്രധാനപാഠം വായനാസൗകര്യത്തിനായി സ്വാഭാവിക മലയാളത്തിൽ നൽകിയിരിക്കുന്നു. ‘വന്നു’ എന്ന ചലനാർഥം എബ്രായത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല; അക്ഷരാർഥത്തിലെ ‘ജലം’ ഘടന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ജലപ്രളയം’ എന്നതിനു പകരം പ്രചാരത്തിലുള്ള ‘പ്രളയം’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ അസ്വാഭാവിക അക്ഷരാർഥഘടന പ്രധാനപാഠത്തിൽ മിനുക്കിയെങ്കിലും അടിക്കുറിപ്പിൽ സുതാര്യമായി നൽകി.
