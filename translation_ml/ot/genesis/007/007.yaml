translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ കുടുംബാംഗങ്ങളുടെ ക്രമവും אִתּוֹ എന്ന വ്യക്തമായ അകമ്പടിസൂചനയും നിലനിർത്തി; അനാവശ്യമായ സർവനാമാവർത്തനം മാത്രം മലയാളശൈലിക്കനുസരിച്ച് ഒഴിവാക്കി.
