  yaml_path: translation/ot/genesis/007/007.yaml
  text: And Noah, with his sons, his wife, and his sons’ wives with him, entered the ark because of the waters of the flood.
translation:
  language: ml
  text: നോഹ തന്റെ പുത്രന്മാരും ഭാര്യയും പുത്രന്മാരുടെ ഭാര്യമാരും കൂടെ പ്രളയജലം നിമിത്തം പെട്ടകത്തിൽ പ്രവേശിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: പ്രവേശിച്ചു
  rationale: בוא എന്ന ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് വരുക, പോകുക, പ്രവേശിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. אֶל הַתֵּבָה എന്ന ദിശാസൂചനയോടൊപ്പം ഇവിടെ ‘പെട്ടകത്തിൽ പ്രവേശിച്ചു’ എന്നത് ചലനത്തിന്റെ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: נֹחַ
  choice: നോഹ
  rationale: നֹחַ എന്ന വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ രൂപം.
- source_word: בָנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: בֵּן എന്ന പദം ഇവിടെ പൊതുവായ ‘മക്കൾ’ എന്നതിലുപരി പ്രത്യേകമായി പുത്രന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אִשְׁתּוֹ
  choice: ഭാര്യ
  rationale: ഈ കുടുംബസന്ദർഭത്തിൽ אִשָּׁה എന്ന പദം പ്രത്യയത്തോടുകൂടെ ‘അവന്റെ ഭാര്യ’ എന്നാണ് അർഥം. ഒരേ പട്ടികയിൽ ‘അവന്റെ’ ആവർത്തിക്കാതിരിക്കാൻ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഭാര്യ’ എന്നു ചേർത്തു.
- source_word: נְשֵׁי בָנָיו
  choice: പുത്രന്മാരുടെ ഭാര്യമാർ
  rationale: എബ്രായ നിർമിതബന്ധത്തിന്റെ സുതാര്യമായ അർഥം ‘അവന്റെ പുത്രന്മാരുടെ ഭാര്യമാർ’ എന്നാണ്. ‘മരുമക്കൾ’ എന്നതിനെക്കാൾ ഇത് മൂലപദഘടന കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: אִתּוֹ
  choice: അവനോടൊപ്പം
  rationale: അകമ്പടിയുടെ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു; നോഹയോടൊപ്പം കുടുംബാംഗങ്ങൾ പ്രവേശിച്ചുവെന്ന എബ്രായ വാക്യഘടന പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֶל הַתֵּבָה
  choice: പെട്ടകത്തിൽ
  rationale: אֶל ദിശയെയും תֵּבָה പെട്ടകത്തെയും സൂചിപ്പിക്കുന്നു. ‘പ്രവേശിച്ചു’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ ‘പെട്ടകത്തിൽ’ എന്നതാണ് സ്വാഭാവികം.
- source_word: מִפְּנֵי
  choice: നിമിത്തം
  rationale: ഇവിടെ ഈ പദപ്രയോഗം കാരണം അഥവാ സാഹചര്യം സൂചിപ്പിക്കുന്നു. ‘നിമിത്തം’ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ രൂപമാണ്.
- source_word: מֵי הַמַּבּוּל
  choice: പ്രളയജലം
  rationale: അക്ഷരാർഥത്തിൽ ‘പ്രളയത്തിന്റെ ജലം’ എന്നാണ്. മലയാളത്തിൽ ‘പ്രളയജലം’ ഇരു ആശയങ്ങളും സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു.
