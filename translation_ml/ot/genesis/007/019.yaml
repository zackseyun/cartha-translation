- from: വെള്ളം ഭൂമിയുടെമേൽ[a] അത്യന്തം പ്രബലമായി; ആകാശങ്ങൾക്കെല്ലാം കീഴിലുള്ള[b] ഉയർന്ന മലകളെല്ലാം മൂടപ്പെട്ടു.
  to: വെള്ളം ഭൂമിക്കുമേൽ[a] അത്യന്തം ശക്തിപ്രാപിച്ചു; ആകാശങ്ങൾക്കെല്ലാം കീഴിലുള്ള[b] ഉയർന്ന മലകളെല്ലാം മൂടപ്പെട്ടു.
