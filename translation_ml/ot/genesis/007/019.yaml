source:
  edition: WLC
  text: וְ/הַ/מַּ֗יִם גָּֽבְר֛וּ מְאֹ֥ד מְאֹ֖ד עַל הָ/אָ֑רֶץ וַ/יְכֻסּ֗וּ כָּל הֶֽ/הָרִים֙ הַ/גְּבֹהִ֔ים אֲשֶׁר תַּ֖חַת כָּל הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/019.yaml
  text: And the waters prevailed exceedingly over the earth[b][a], and all the high mountains under all the heavens were covered.
translation:
  language: ml
  text: വെള്ളം ഭൂമിക്കുമേൽ[a] അത്യന്തം ശക്തിപ്രാപിച്ചു; ആകാശങ്ങൾക്കെല്ലാം കീഴിലുള്ള[b] ഉയർന്ന മലകളെല്ലാം മൂടപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഭൂമി’ എന്നതിനുപകരം ‘ദേശം’ അല്ലെങ്കിൽ ‘കരഭൂമി’ എന്നും പരിഭാഷപ്പെടുത്താം; പ്രളയത്തിന്റെ വ്യാപ്തി സന്ദർഭത്തിൽ എങ്ങനെ മനസ്സിലാക്കുന്നു എന്നതിനെ ആശ്രയിച്ചിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘മുഴുവൻ ആകാശത്തിനും കീഴിലുള്ള.’
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְרוּ
  choice: പ്രബലമായി
  rationale: ജലത്തിന്റെ ശക്തിയും മേൽക്കൈയും സൂചിപ്പിക്കുന്ന גבר എന്ന ക്രിയയുടെ പ്രളയസന്ദർഭത്തിലെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מְאֹד מְאֹד
  choice: അത്യന്തം
  rationale: ഇരട്ടിച്ച തീവ്രതയെ ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עַל הָאָרֶץ
  choice: ഭൂമിയുടെമേൽ
  rationale: עַל എന്നതിന്റെ ‘മേൽ’ എന്ന അർഥവും אָרֶץ എന്നതിന്റെ ഈ സന്ദർഭത്തിലെ വിശാലമായ ‘ഭൂമി’ എന്ന വായനയും നിലനിർത്തുന്നു.
- source_word: וַיְכֻסּוּ
  choice: മൂടപ്പെട്ടു
  rationale: മലകൾ വെള്ളത്താൽ മൂടപ്പെട്ട ഫലം സ്വാഭാവികമായ കർമണിപ്രയോഗത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּל הֶהָרִים הַגְּבֹהִים
  choice: ഉയർന്ന മലകളെല്ലാം
  rationale: ഹീബ്രു വാക്യഘടനയിലെ സമഗ്രതയും മലകളുടെ ഉയരവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: ആകാശങ്ങൾക്കെല്ലാം കീഴിലുള്ള
  rationale: שָׁמַיִם എന്ന പദത്തിന്റെ രൂപപരമായ ബഹുവചനവും כָּל എന്നതിന്റെ വ്യാപ്തിയും സാധ്യമായത്ര നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രളയവിവരണത്തിൽ אָרֶץ എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ഭൂമി
  alternative: ദേശം / കരഭൂമി
  rationale: ‘ആകാശങ്ങൾക്കെല്ലാം കീഴിലുള്ള’ എന്ന തുടർപ്രയോഗത്തോടൊപ്പം വാക്യം സർവവ്യാപകമായ ഭാഷ ഉപയോഗിക്കുന്നതിനാൽ ‘ഭൂമി’ മുഖ്യവായനയായി സ്വീകരിച്ചു; എന്നാൽ പദത്തിന്റെ സന്ദർഭസാധ്യമായ പരിമിത അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: תַּחַת כָּל הַשָּׁמָיִם എന്നതിന്റെ സംഖ്യയും പ്രയോഗവും
  choice: ആകാശങ്ങൾക്കെല്ലാം കീഴിലുള്ള
  alternative: മുഴുവൻ ആകാശത്തിനും കീഴിലുള്ള
  rationale: ഹീബ്രുവിലെ ബഹുവചനരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; സ്വാഭാവികമായ ഏകവചന സമഗ്രപ്രയോഗം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തിച്ച מְאֹד എന്നതിന്റെ തീവ്രത ‘അത്യന്തം’ എന്ന പദത്തിലൂടെ നൽകി; ഹീബ്രുവിലെ ബഹുവചനമായ ‘ആകാശങ്ങൾ’ മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
