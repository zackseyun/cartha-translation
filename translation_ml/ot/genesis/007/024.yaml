    text: ‘ഭൂമി’ എന്നതിനുപകരം ‘ദേശം’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിലെ אֶרֶץ എന്ന പദത്തിന് സന്ദർഭാനുസരണം രണ്ടർഥവും വരാം.
    reason: lexical_alternative
