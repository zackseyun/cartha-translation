source:
  edition: WLC
  text: וַ/יִּגְבְּר֥וּ הַ/מַּ֖יִם עַל הָ/אָ֑רֶץ חֲמִשִּׁ֥ים וּ/מְאַ֖ת יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/024.yaml
  text: And the waters prevailed over the earth for 150 days[a].
translation:
  language: ml
  text: വെള്ളം ഭൂമിക്കുമേൽ നൂറ്റമ്പത് ദിവസം ആധിപത്യം ചെലുത്തി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഭൂമി’ എന്നതിനുപകരം ‘ദേശം’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിലെ אֶרֶץ എന്ന പദത്തിന് സന്ദർഭാനുസരണം രണ്ടർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: പ്രബലമായി തുടർന്നു
  rationale: גבר എന്ന ക്രിയയുടെ ‘ശക്തമായിരിക്കുക, മേൽക്കൈ പുലർത്തുക’ എന്ന അർഥം പ്രളയജലത്തിന്റെ ആധിപത്യത്തെ സൂചിപ്പിക്കുന്നു. നൂറ്റമ്പത് ദിവസത്തെ ദൈർഘ്യം സ്വാഭാവികമായി അറിയിക്കാൻ ‘തുടർന്നു’ ചേർത്തു.
- source_word: הַמַּיִם
  choice: വെള്ളം
  rationale: എബ്രായത്തിൽ രൂപപരമായി ബഹുവചനമാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ ആധുനിക മലയാളത്തിലെ സ്വാഭാവികമായ സമഷ്ടിപദം ‘വെള്ളം’ ആണ്; ‘ജലങ്ങൾ’ അനാവശ്യമായി കൃത്രിമമായി കേൾക്കും.
- source_word: עַל הָאָרֶץ
  choice: ഭൂമിയുടെമേൽ
  rationale: עַל എന്നതിന്റെ ‘മേൽ’ എന്ന സ്ഥലബന്ധവും אֶרֶץ എന്നതിന്റെ ഈ പ്രളയവിവരണത്തിലെ വിശാലമായ ‘ഭൂമി’ എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: നൂറ്റമ്പത് ദിവസം
  rationale: ‘അമ്പതും നൂറും ദിവസം’ എന്ന എബ്രായ സംഖ്യാഘടനയുടെ സ്വാഭാവിക മലയാളരൂപമാണിത്; കാലദൈർഘ്യം വാക്യഘടനയിലൂടെ വ്യക്തമാണ്.
theological_decisions:
- issue: പ്രളയവിവരണത്തിലെ אֶרֶץ എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ഭൂമി
  alternative: ദേശം / കര
  rationale: സമീപസന്ദർഭത്തിലെ സർവവ്യാപകമായ ഭാഷയ്ക്ക് ‘ഭൂമി’ കൂടുതൽ യോജിക്കുന്നു. എങ്കിലും אֶרֶץ എന്ന പദത്തിന് സന്ദർഭാനുസരണം ‘ദേശം’ അല്ലെങ്കിൽ ‘കര’ എന്നും അർഥമാകാമെന്ന യഥാർഥ പദാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രബലമായി തുടർന്നു’ എന്ന പ്രയോഗം മൂലക്രിയയുടെ ശക്തി/ആധിപത്യഭാവവും 150 ദിവസത്തെ തുടർച്ചയും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
