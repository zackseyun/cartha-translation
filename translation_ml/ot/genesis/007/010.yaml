source:
  edition: WLC
  text: וַֽ/יְהִ֖י לְ/שִׁבְעַ֣ת הַ/יָּמִ֑ים וּ/מֵ֣י הַ/מַּבּ֔וּל הָי֖וּ עַל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/010.yaml
  text: And after seven days[b][a], the waters of the flood came upon the earth.
translation:
  language: ml
  text: ഏഴു ദിവസം കഴിഞ്ഞപ്പോൾ, പ്രളയജലം ഭൂമിയുടെ[a] മേൽ വന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ദേശത്തിന്റെ മേൽ’ അഥവാ ‘നിലത്തിന്റെ മേൽ.’ എബ്രായത്തിലെ אֶרֶץ എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘ഭൂമി,’ ‘ദേശം,’ ‘നിലം’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘ഏഴു ദിവസം കഴിഞ്ഞപ്പോൾ അങ്ങനെ സംഭവിച്ചു; പ്രളയജലം ഭൂമിയുടെ മേൽ ഉണ്ടായിരുന്നു.’'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיְהִי לְשִׁבְעַת הַיָּמִים
  choice: ഏഴു ദിവസം കഴിഞ്ഞപ്പോൾ
  rationale: היה എന്ന ക്രിയയുടെ ആഖ്യാനപരമായ തുടർച്ചയും לְ ചേർന്ന സമയപ്രയോഗത്തിന്റെ കാലപരിധി പൂർത്തിയായെന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: וּמֵי הַמַּבּוּל
  choice: പ്രളയജലം
  rationale: മַיִם എന്ന ബഹുവചനസങ്കൽപ്പവും מַבּוּל എന്ന നോഹയുടെ പ്രളയത്തെ സൂചിപ്പിക്കുന്ന പദവും മലയാളത്തിലെ സ്വാഭാവികമായ സമാസപ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: הָיוּ עַל
  choice: മേൽ വന്നു
  rationale: അക്ഷരാർഥം ‘മേൽ ഉണ്ടായിരുന്നു’ എന്നാണ്; എന്നാൽ സന്ദർഭത്തിലെ പ്രളയജലത്തിന്റെ ആരംഭം വ്യക്തമാക്കാൻ സംഭവാത്മകമായ ‘മേൽ വന്നു’ സ്വാഭാവികവും വിശ്വസ്തവുമാണ്.
- source_word: הָאָרֶץ
  choice: ഭൂമി
  rationale: אֶרֶץ എന്നതിന് ‘ഭൂമി’ എന്നും ‘ദേശം/നിലം’ എന്നും അർഥമാകാം. പ്രളയവിവരണത്തിന്റെ വിശാലമായ സന്ദർഭത്തിൽ ‘ഭൂമി’ പ്രധാന പാഠമായി സ്വീകരിക്കുന്നു; യഥാർഥമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രളയവിവരണത്തിൽ אֶרֶץ എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ഭൂമി
  alternative: ദേശം അഥവാ നിലം
  rationale: സന്ദർഭത്തിൽ ‘ഭൂമി’ ശക്തവും പരമ്പരാഗതവുമായ വായനയാണ്; എങ്കിലും എബ്രായപദം മാത്രം പ്രളയത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തി നിർണായകമായി തീർപ്പാക്കുന്നില്ല. അതിനാൽ പകരംവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പ്രളയജലം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും വാക്യത്തിൽ സ്വാഭാവികവുമാണ്. അർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
