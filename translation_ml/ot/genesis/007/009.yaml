  yaml_path: translation/ot/genesis/007/009.yaml
  text: Two by two they came to Noah into the ark[a], male and female[b], just as God had commanded Noah.
translation:
  language: ml
  text: രണ്ടുവീതം[a] അവർ നോഹയുടെ അടുക്കലേക്കും പെട്ടകത്തിനകത്തേക്കും വന്നു, ആണും പെണ്ണുമായി—ദൈവം നോഹയോടു കല്പിച്ചതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജോടികളായി’; അക്ഷരാർഥത്തിൽ, ‘രണ്ട് രണ്ട്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנַיִם שְׁנַיִם
  choice: രണ്ടുവീതം
  rationale: ആവർത്തിച്ച സംഖ്യയുടെ വിതരണാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ജോടികളായുള്ള വരവ് സൂചിപ്പിക്കുന്നു.
- source_word: בָּאוּ
  choice: വന്നു
  rationale: സാധാരണ ഗതിവാചകമായ בוא-നെയും നോഹയെ ലക്ഷ്യമാക്കിയ ആഖ്യാനവീക്ഷണത്തെയും നിലനിർത്തുന്നു.
- source_word: אֶל נֹחַ
  choice: നോഹയുടെ അടുക്കൽ
  rationale: നോഹയിലേക്കുള്ള ഗതിയെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל הַתֵּבָה
  choice: പെട്ടകത്തിനകത്തേക്കു
  rationale: ഇവിടെ പെട്ടകം ലക്ഷ്യസ്ഥാനമായതിനാൽ പ്രവേശനഗതി വ്യക്തമാക്കുന്നു; എങ്കിലും ഹീബ്രു אֶל അടിസ്ഥാനമായി ‘അടുക്കലേക്ക്/ലേക്ക്’ എന്നും വരാം.
- source_word: זָכָר וּנְקֵבָה
  choice: ആണും പെണ്ണുമായി
  rationale: ജീവികളുടെ ലിംഗജോടിയെ മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: כַּאֲשֶׁר
  choice: കല്പിച്ചതുപോലെ
  rationale: ദൈവകല്പനയോടുള്ള കൃത്യമായ അനുരൂപത പ്രകടിപ്പിക്കുന്നു.
- source_word: צִוָּה אֱלֹהִים אֶת נֹחַ
  choice: ദൈവം നോഹയോടു കല്പിച്ചതുപോലെ
  rationale: കല്പന മൃഗങ്ങളുടെ വരവിനു മുമ്പുണ്ടായതെന്ന ക്രമം സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ വേറൊരു പൂർവകാലരൂപം ചേർക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഈ ഏകദൈവ ആഖ്യാനസന്ദർഭത്തിലെ പതിവായ ഏകവചന പരിഭാഷ.
theological_decisions:
- issue: മൃഗങ്ങളുടെ വരവിലെ പ്രവർത്തകത്വം
  choice: മൃഗങ്ങൾ നോഹയുടെ അടുക്കൽ വന്നുവെന്നും അത് ദൈവം നോഹയോടു കല്പിച്ചതുപോലെയായിരുന്നുവെന്നും മാത്രം പറയുന്നു.
  alternative: അവ സഹജവാസനകൊണ്ടു മാത്രം വന്നു; അല്ലെങ്കിൽ നോഹയുടെ പരിശ്രമംകൊണ്ടു മാത്രം കൂട്ടിച്ചേർക്കപ്പെട്ടു.
  rationale: ദൈവകല്പനയും മൃഗങ്ങളുടെ വരവും തമ്മിലുള്ള ബന്ധം നിലനിർത്തുന്നു; അത് നടന്ന രീതി പാഠത്തിൽ ഇല്ലാത്തവിധം വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പെട്ടകം’ എന്ന പരിചിത ബൈബിൾപദം നിലനിർത്തി. ഹീബ്രുവിലെ ആരംഭപ്രാധാന്യം മലയാളത്തിലെ സ്വാഭാവിക പദക്രമവുമായി ഒത്തുചേരാൻ ‘ആണും പെണ്ണുമായി അവ രണ്ടുവീതം’ എന്നു ക്രമപ്പെടുത്തി.
