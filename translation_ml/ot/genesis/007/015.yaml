  yaml_path: translation/ot/genesis/007/015.yaml
  text: They came to Noah into the ark[a], two by two from all flesh in which was the breath of life.
translation:
  language: ml
  text: ജീവശ്വാസം[a] ഉള്ള സകല ജഡത്തിൽനിന്നും അവ ഈരണ്ടായി നോഹയുടെ അടുക്കലേക്കും പെട്ടകത്തിനകത്തേക്കും വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജീവന്റെ ആത്മാവ്.’ എബ്രായത്തിലെ רוּחַ എന്ന പദത്തിന് ‘ശ്വാസം,’ ‘കാറ്റ്,’ ‘ആത്മാവ്’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: അവ വന്നു
  rationale: בוא എന്ന ക്രിയയുടെ ലളിതമായ ഭൂതകാല ആഖ്യാനഭാവം സ്വാഭാവികമായി നൽകുന്നു; ബഹുവചന കർത്താവിനെ മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കാൻ ‘അവ’ ചേർത്തിരിക്കുന്നു.
- source_word: אֶל נֹחַ
  choice: നോഹയുടെ അടുക്കൽ
  rationale: אֶל സൂചിപ്പിക്കുന്ന വ്യക്തിയിലേക്കുള്ള ചലനം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶל הַתֵּבָה
  choice: പെട്ടകത്തിനകത്തേക്ക്
  rationale: സന്ദർഭത്തിൽ പെട്ടകത്തിൽ പ്രവേശിക്കുന്നതാണ് ചലനത്തിന്റെ ലക്ഷ്യം; അതിനാൽ ‘പെട്ടകത്തിലേക്ക്’ എന്നതിനെക്കാൾ അകത്തേക്കുള്ള ഗതി വ്യക്തമായി പറയുന്നു.
- source_word: שְׁנַיִם שְׁנַיִם
  choice: ഈരണ്ടായി
  rationale: ആവർത്തിച്ച സംഖ്യ സൂചിപ്പിക്കുന്ന വിതരണാർഥമായ ജോടികളായുള്ള വരവ് സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִכָּל הַבָּשָׂר
  choice: സകല ജഡത്തിൽനിന്നും
  rationale: בָּשָׂר എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘ജഡം’ നിലനിർത്തുകയും പ്രളയവിവരണത്തിലെ വിശാലമായ ജീവജാലസൂചന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר בּוֹ
  choice: ഉള്ള
  rationale: ‘അതിൽ ഉണ്ടായിരുന്ന’ എന്ന എബ്രായബന്ധവാക്യത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി വിശേഷണരൂപത്തിൽ നൽകുന്നു.
- source_word: רוּחַ חַיִּים
  choice: ജീവശ്വാസം
  rationale: ജീവികളിലെ സജീവജീവിതത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘ജീവശ്വാസം’ സ്വാഭാവികമാണ്; רוּחַ എന്ന പദത്തിന്റെ ‘ആത്മാവ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: רוּחַ חַיִּים എന്ന പ്രയോഗത്തിലെ רוּחַ എന്നതിന്റെ അർഥം
  choice: ജീവശ്വാസം
  alternative: ജീവന്റെ ആത്മാവ്
  rationale: ജീവജാലങ്ങളെക്കുറിച്ചുള്ള സൃഷ്ടി-പ്രളയസന്ദർഭത്തിൽ ശ്വസിക്കുന്ന ജീവനെ മുൻനിർത്തുന്ന വായനയാണ് കൂടുതൽ യോജിച്ചത്; എന്നാൽ ‘ആത്മാവ്’ എന്ന യഥാർഥ പദസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘സകല ജഡം’ എന്ന പ്രയോഗം മൂലപാഠത്തിന്റെ പ്രളയവിവരണപരമായ ആവർത്തനവും ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും നിലനിർത്തുന്നു.
