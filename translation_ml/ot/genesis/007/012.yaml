  choice: നാല്പതു പകലും നാല്പതു രാത്രിയും
  rationale: ദൈർഘ്യം സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ സമാന്തര ഘടന സംരക്ഷിക്കുന്നു.
