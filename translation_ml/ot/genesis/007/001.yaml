id: GEN.7.1
reference: Genesis 7:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ לְ/נֹ֔חַ בֹּֽא אַתָּ֥ה וְ/כָל בֵּיתְ/ךָ֖ אֶל הַ/תֵּבָ֑ה כִּֽי אֹתְ/ךָ֥ רָאִ֛יתִי צַדִּ֥יק לְ/פָנַ֖/י בַּ/דּ֥וֹר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/001.yaml
  text: Then Yahweh said to Noah, “Enter the ark, you and all your household, because I have seen that you are righteous before me in this generation.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ നോഹയോടു പറഞ്ഞു: “നീയും നിന്റെ വീട്ടുകാരെല്ലാവരും പെട്ടകത്തിൽ പ്രവേശിക്കുക. എന്തെന്നാൽ, ഈ തലമുറയിൽ നീ എന്റെ മുമ്പാകെ നീതിമാനാണെന്ന് ഞാൻ കണ്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; ആ ക്രമബന്ധം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: בֹּא
  choice: പ്രവേശിക്കുക
  rationale: ആജ്ഞാരൂപത്തിന്റെ ‘വരുക/അകത്തു കടക്കുക’ എന്ന അർഥം പെട്ടകത്തിന്റെ സന്ദർഭത്തിൽ വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בֵּיתְךָ
  choice: നിന്റെ വീട്ടുകാർ
  rationale: ഇവിടെ ‘വീട്’ കെട്ടിടത്തെയല്ല, നോഹയുടെ ഗൃഹസമൂഹത്തിലെ ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വീട്ടുകാർ’ ആ സാമൂഹിക അർഥം സ്വാഭാവികമായി പകരുന്നു.
- source_word: הַתֵּבָה
  choice: പെട്ടകം
  rationale: നോഹയുടെ תֵּבָהയെ സൂചിപ്പിക്കാൻ മലയാള ബൈബിൾ ഭാഷയിൽ സ്ഥാപിതവും സന്ദർഭോചിതവുമായ പദമാണ്.
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻപുള്ള ആജ്ഞയുടെ കാരണം അവതരിപ്പിക്കുന്ന ഹീബ്രു ബന്ധകത്തിന്റെ കാരണാർഥം വ്യക്തമാക്കുന്നു.
- source_word: רָאִיתִי
  choice: ഞാൻ കണ്ടിരിക്കുന്നു
  rationale: ദൈവം നടത്തിയ വിലയിരുത്തലിന്റെ പൂർത്തിയായ സ്വഭാവവും ഇപ്പോഴത്തെ പ്രസക്തിയും ഹീബ്രു സമാപ്തക്രിയയ്ക്ക് യോജിച്ച രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: צַדִּיק
  choice: നീതിമാൻ
  rationale: צַדִּיק എന്ന പദത്തിന്റെ നീതി/ധാർമിക ശരിത്വം സൂചിപ്പിക്കുന്ന പ്രാഥമികവും വേദപരമായി ഗൗരവമുള്ളതുമായ മലയാള സമാനപദമാണ്.
- source_word: לְפָנַי
  choice: എന്റെ മുമ്പാകെ
  rationale: ദൈവസന്നിധിയിലും ദൈവത്തിന്റെ വിലയിരുത്തലിലും എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഭാവം അക്ഷരാർഥത്തോട് അടുത്തും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: בַּדּוֹר הַזֶּה
  choice: ഈ തലമുറയിൽ
  rationale: നോഹയുടെ സമകാലിക തലമുറയെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ സാധാരണ അർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: നോഹയുടെ നീതിമാനെന്ന നില
  choice: നീ എന്റെ മുമ്പാകെ നീതിമാനാണെന്ന് ഞാൻ കണ്ടിരിക്കുന്നു
  alternative: നിന്നെ മാത്രം നീതിമാനായി കണ്ടിരിക്കുന്നു; നിന്നെ നീതിമാനായി കണക്കാക്കിയിരിക്കുന്നു
  rationale: ദൈവത്തിന്റെ വിലയിരുത്തലെന്ന വാക്യത്തിന്റെ നേരിട്ടുള്ള അവകാശവാദം നിലനിർത്തുന്നു; നോഹയുടെ നീതിയുടെ അടിസ്ഥാനം, സ്വഭാവം, അല്ലെങ്കിൽ മറ്റുള്ളവരോടുള്ള ഏകാന്തമായ താരതമ്യം എന്നിവ പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘വീട്ടുകാർ’ ഗൃഹസമൂഹത്തെ സൂചിപ്പിക്കുകയും ‘പ്രവേശിക്കുക’ ആജ്ഞയുടെ ഗൗരവം നിലനിർത്തുകയും ചെയ്യുന്നു.
