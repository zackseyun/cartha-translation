id: GEN.7.5
reference: Genesis 7:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ נֹ֑חַ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/005.yaml
  text: And Noah did according to all that Yahweh had commanded him[a].
translation:
  language: ml
  text: യാഹ്‌വേ നോഹയോടു കൽപിച്ചതൊക്കെയും അനുസരിച്ച് നോഹ ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ചെയ്തു
  rationale: עשה എന്ന ക്രിയയ്ക്ക് ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്ന വിശാല അർഥമുണ്ട്. കല്പനയോടുള്ള അനുസരണത്തെ സൂചിപ്പിക്കുന്ന ഈ ഘടനയിൽ ‘ചെയ്തു’ സ്വാഭാവികവും മൂലപാഠത്തോട് ചേർന്നതുമാണ്.
- source_word: נֹחַ
  choice: നോഹ
  rationale: നֹחַ എന്ന വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: כְּכֹל אֲשֶׁר
  choice: കല്പിച്ചതൊക്കെയും അനുസരിച്ച്
  rationale: כְּ എന്ന ഉപസർഗത്തിന്റെ അനുരൂപതാ ആശയവും כֹל എന്നതിന്റെ സമഗ്രതയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: צִוָּהוּ
  choice: തന്നോടു കല്പിച്ചതു
  rationale: צוה എന്നത് അധികാരപൂർവമായ ‘കല്പിക്കുക’ എന്നാണ്; പ്രത്യയം നോഹയെയാണ് പരാമർശിക്കുന്നത്. മലയാളത്തിലെ ഭൂതകാല ആപേക്ഷികരൂപം, നോഹ പ്രവർത്തിക്കുന്നതിന് മുമ്പുണ്ടായ കല്പനയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ יהוה ഒരു പദവിയായി മാറ്റാതെ, മലയാള ബൈബിൾ ഭാഷയിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ‘കർത്താവ്’ എന്ന പദവികൊണ്ട് പകരാതെ നിലനിർത്തുന്നു. ‘യഹോവ’ മലയാള വായനക്കാർക്ക് സുപരിചിതമായ രൂപമാണ്; ‘യാഹ്‌വേ’ സാധ്യതയുള്ള മറ്റൊരു ലിപ്യന്തരണമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാക്യഘടന. ‘കല്പിച്ചതൊക്കെയും അനുസരിച്ച്’ എന്ന പ്രയോഗം മൂലത്തിലെ സമ്പൂർണ അനുരൂപതയുടെ ആശയം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
