  text: עֵ֚ד הַ/גַּ֣ל הַ/זֶּ֔ה וְ/עֵדָ֖ה הַ/מַּצֵּבָ֑ה אִם אָ֗נִי לֹֽא אֶֽעֱבֹ֤ר אֵלֶ֨י/ךָ֙ אֶת הַ/גַּ֣ל הַ/זֶּ֔ה וְ/אִם אַ֠תָּה לֹא תַעֲבֹ֨ר אֵלַ֜/י אֶת הַ/גַּ֥ל הַ/זֶּ֛ה וְ/אֶת הַ/מַּצֵּבָ֥ה הַ/זֹּ֖את לְ/רָעָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/052.yaml
  text: This heap is a witness[a], and the pillar is a witness, that I will not pass over this heap toward you[c][b], and that you will not pass over this heap and this pillar toward me for harm.
translation:
  language: ml
  text: ഈ കൽക്കൂമ്പാരം സാക്ഷിയാണ്; ഈ കൽത്തൂണും സാക്ഷിയാണ്. ദോഷം ചെയ്യാനായി[b] ഞാൻ ഈ കൽക്കൂമ്പാരം കടന്ന്[a] നിന്റെ അടുക്കലേക്ക് വരുകയില്ല; നീ ഈ കൽക്കൂമ്പാരവും ഈ കൽത്തൂണും കടന്ന് എന്റെ അടുക്കലേക്ക് വരുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുറിച്ചുകടന്ന്’; ഇവിടെ അതിർത്തിചിഹ്നം കടക്കുന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: ഇത് വെറുതെ അതിർത്തി കടക്കുന്നതിനെക്കുറിച്ചല്ല; ഹാനികരമോ ശത്രുതാപരമോ ആയ ഉദ്ദേശ്യത്തോടെ കടന്നുവരുന്നതിനെക്കുറിച്ചാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: עֵד / וְעֵדָה
  choice: സാക്ഷിയാണ്
  rationale: കൽക്കൂമ്പാരവും കൽത്തൂണും ഉടമ്പടിയുടെ സാക്ഷികളായി പ്രവർത്തിക്കുന്നുവെന്ന സമാന്തര ആശയം നിലനിർത്തുന്നു.
- source_word: גַּל
  choice: കൽക്കൂമ്പാരം
  rationale: സന്ദർഭത്തിൽ അതിർത്തിചിഹ്നമായി കൂട്ടിവെച്ച കല്ലുകളുടെ കൂമ്പാരമാണെന്ന് വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: מַצֵּבָה
  choice: കൽത്തൂൺ
  rationale: നാട്ടിനിർത്തിയ കല്ലുകൊണ്ടുള്ള സ്മാരകചിഹ്നത്തെ സാധാരണ വായനക്കാരന് വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: אִם ... לֹא
  choice: വരുകയില്ല
  rationale: ശപഥസന്ദർഭത്തിലെ വ്യവസ്ഥാരൂപത്തെ മലയാളത്തിൽ ഉടമ്പടിയിലെ നിഷേധപ്രതിജ്ഞയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֶעֱבֹר / תַעֲבֹר
  choice: കടന്ന് ... വരുക
  rationale: അതിർത്തിചിഹ്നം മുറിച്ചുകടന്ന് മറുപക്ഷത്തിന്റെ ദിശയിലേക്കു നീങ്ങുന്ന സ്ഥലപരമായ ആശയം സംരക്ഷിക്കുന്നു.
- source_word: אֵלֶיךָ / אֵלַי
  choice: നിന്റെ അടുക്കലേക്ക് / എന്റെ അടുക്കലേക്ക്
  rationale: ശത്രുത എന്ന ആശയം മുൻകൂട്ടി ചേർക്കാതെ ദിശാസൂചന നിലനിർത്തുന്നു.
- source_word: לְרָעָה
  choice: ദോഷം ചെയ്യുക എന്ന ഉദ്ദേശ്യത്തോടെ
  rationale: വെറും അതിർത്തികടക്കലല്ല, ഹാനികരമായ ഉദ്ദേശ്യത്തോടെയുള്ള കടന്നുവരവാണ് നിരോധിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אִם ... לֹא എന്ന ശപഥസൂത്രത്തിന്റെ രൂപം
  choice: നിഷേധപ്രതിജ്ഞയായി ‘വരുകയില്ല’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘ഞാൻ കടന്നാൽ… നീ കടന്നാൽ…’ എന്ന വ്യവസ്ഥാരൂപം
  rationale: സാക്ഷികളെ പ്രഖ്യാപിക്കുന്ന ഉടമ്പടിസന്ദർഭത്തിൽ ഈ എബ്രായരൂപം ലളിതമായ സോപാധികവാക്യത്തേക്കാൾ ശപഥത്തിലെ ബാധ്യതയാണ് അറിയിക്കുന്നത്; മലയാളത്തിൽ നിഷേധപ്രതിജ്ഞ അതിന്റെ പ്രയോഗാർഥം വ്യക്തമായി നൽകുന്നു.
- issue: לְרָעָה ഇരുപക്ഷത്തിനും ബാധകമാണോ
  choice: ഇരുപക്ഷത്തിന്റെയും കടന്നുവരവിനെ നിയന്ത്രിക്കുന്ന പൊതുവായ ഉദ്ദേശ്യവാക്യമായി നൽകി
  alternative: അടുത്തുള്ള രണ്ടാമത്തെ വ്യവസ്ഥയ്ക്കു മാത്രം ചേർക്കുക
  rationale: വാക്യാവസാനത്തിലുള്ള പ്രയോഗം ഉടമ്പടിയിലെ പരസ്പരനിരോധനത്തെ സ്വാഭാവികമായി വിശേഷിപ്പിക്കുന്നു; ഒരാൾക്കു മാത്രം ബാധകമെന്ന വിധത്തിൽ ചുരുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനയ്ക്ക് സുഗമവുമായ മലയാളം. ‘കൽക്കൂമ്പാരം’, ‘കൽത്തൂൺ’ എന്നീ പദങ്ങൾ രണ്ട് വ്യത്യസ്ത അതിർത്തിചിഹ്നങ്ങളെ വ്യക്തമായി വേർതിരിക്കുന്നു; സമാന്തരമായ ‘സാക്ഷിയാണ്’ എന്ന ആവർത്തനം മൂലഭാഷയുടെ ഊന്നൽ നിലനിർത്തുന്നു.
