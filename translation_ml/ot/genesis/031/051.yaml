id: GEN.31.51
reference: Genesis 31:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר לָבָ֖ן לְ/יַעֲקֹ֑ב הִנֵּ֣ה הַ/גַּ֣ל הַ/זֶּ֗ה וְ/הִנֵּה֙ הַ/מַצֵּבָ֔ה אֲשֶׁ֥ר יָרִ֖יתִי בֵּינִ֥/י וּ/בֵינֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/051.yaml
  text: Then Laban said to Jacob[a], “Look at this mound[b], and look at the pillar that I have set up between me and you.”
translation:
  language: ml
  text: 'അപ്പോൾ ലാബാൻ യാക്കോബിനോടു പറഞ്ഞു: “ഇതാ, ഈ കൽക്കൂമ്പാരം[a]; ഇതാ, എനിക്കും നിനക്കും ഇടയിൽ ഞാൻ നാട്ടിയ ഈ കൽത്തൂൺ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കൽക്കൂമ്പൽ.” ഇവിടെ എബ്രായപദം ലാബാനും യാക്കോബും തമ്മിൽ സാക്ഷിയായി കൂട്ടിയിട്ട കല്ലുകളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നാട്ടുകല്ല്” അല്ലെങ്കിൽ “ശിലാസ്തംഭം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ അതിന്റെ ക്രമാനുഗത സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הִנֵּה ... וְהִנֵּה
  choice: ഇതാ ...; ഇതാ ...
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ആവർത്തനവും സമാന്തരമായ ഊന്നലും മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും പുനരാവിഷ്കരിക്കുന്നു.
- source_word: הַגַּל הַזֶּה
  choice: ഈ കൽക്കൂമ്പാരം
  rationale: സന്ദർഭത്തിൽ גַּל സാക്ഷ്യചിഹ്നമായി കൂട്ടിയിട്ട കല്ലുകളുടെ കൂമ്പാരമാണ്; വെറും ‘കൂമ്പാരം’ എന്നതിനെക്കാൾ ‘കൽക്കൂമ്പാരം’ അർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: הַמַּצֵּבָה
  choice: ഈ കൽത്തൂൺ
  rationale: מַצֵּבָה നാട്ടിനിർത്തിയ കല്ലിനെയോ ശിലാസ്തംഭത്തെയോ സൂചിപ്പിക്കുന്നു; ‘കൽത്തൂൺ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: יָרִיתִי
  choice: ഞാൻ നാട്ടിയ
  rationale: സ്തംഭം സ്ഥാപിക്കുന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; മൂലക്രിയയുടെ ‘എറിഞ്ഞു/കൂട്ടിയുയർത്തി’ എന്ന സാധ്യതയെ യാന്ത്രികമായി പകർത്തുന്നില്ല.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: എനിക്കും നിനക്കും ഇടയിൽ
  rationale: ബന്ധസൂചക വാക്യഘടനയുടെ അർത്ഥം നേരിട്ട്, സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തിച്ച הִנֵּה എന്നതിന്റെ ഊന്നൽ ‘ഇതാ ...; ഇതാ ...’ എന്ന സമാന്തര ഘടനയിൽ സൂക്ഷിച്ചു. ‘കൽക്കൂമ്പാരം’, ‘കൽത്തൂൺ’ എന്നീ പദങ്ങൾ അടുത്തടുത്തുള്ള രണ്ടു വ്യത്യസ്ത സാക്ഷ്യചിഹ്നങ്ങളെ വ്യക്തമായി വേർതിരിക്കുന്നു.
