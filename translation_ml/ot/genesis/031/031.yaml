id: GEN.31.31
reference: Genesis 31:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַן יַעֲקֹ֖ב וַ/יֹּ֣אמֶר לְ/לָבָ֑ן כִּ֣י יָרֵ֔אתִי כִּ֣י אָמַ֔רְתִּי פֶּן תִּגְזֹ֥ל אֶת בְּנוֹתֶ֖י/ךָ מֵ/עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/031.yaml
  text: Then Jacob answered and said to Laban[a], “Because I was afraid, for I said[b], ‘Lest you take your daughters from me by force.’”
translation:
  language: ml
  text: 'അപ്പോൾ യാക്കോബ് ലാബാനോടു മറുപടി പറഞ്ഞു: “എനിക്ക് ഭയമായിരുന്നു; കാരണം, ‘അങ്ങ് അങ്ങയുടെ പുത്രിമാരെ എന്റെ അടുക്കൽനിന്ന് ബലമായി പിടിച്ചുകൊണ്ടുപോയേക്കാം’ എന്നു ഞാൻ കരുതി[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “എന്നു ഞാൻ പറഞ്ഞു.” ഇവിടെ ഇത് യാക്കോബ് മനസ്സിൽ പറഞ്ഞതിനെ, അഥവാ അവന്റെ വിചാരത്തെ, സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: മറുപടി പറഞ്ഞു
  rationale: ഹീബ്രായയിലെ ഇരട്ട ആഖ്യാനപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പകർത്തുന്നു; ‘ഉത്തരം പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്ന അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: כִּי יָרֵאתִי
  choice: എനിക്ക് ഭയമായിരുന്നു
  rationale: ആദ്യത്തെ כִּי നൽകുന്ന കാരണബന്ധവും ירא എന്ന ക്രിയയുടെ ഭയാർഥവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כִּי אָמַרְתִּי
  choice: എന്നു ഞാൻ കരുതി
  rationale: אמרתי എന്നതിന്റെ അക്ഷരാർഥം ‘ഞാൻ പറഞ്ഞു’ എന്നാണെങ്കിലും ഇവിടെ അത് യാക്കോബിന്റെ ഉള്ളിലെ വിചാരത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കരുതി’ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: פֶּן
  choice: പോയേക്കാം
  rationale: ഭയപ്പെട്ടിരുന്ന ഒരു സാധ്യതയെ സൂചിപ്പിക്കുന്ന פן എന്നതിന്റെ apprehensive force മലയാളത്തിലെ സാധ്യതാപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: תִּגְזֹל
  choice: ബലമായി പിടിച്ചുകൊണ്ടുപോകുക
  rationale: גזל എന്ന ക്രിയയിലെ അന്യായമായ ബലപ്രയോഗത്തോടെയുള്ള പിടിച്ചെടുക്കൽ എന്ന ശക്തമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: בְּנוֹתֶיךָ
  choice: അങ്ങയുടെ പുത്രിമാർ
  rationale: ലാബാനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയും ബന്ധസൂചനയും മാന്യമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מֵעִמִּי
  choice: എന്റെ അടുക്കൽനിന്ന്
  rationale: യാക്കോബിന്റെ സാന്നിധ്യത്തിൽനിന്നുള്ള വേർപെടുത്തലാണ് ഈ സംയുക്ത പൂർവപ്രത്യയം സൂചിപ്പിക്കുന്നത്; അത് സ്വാഭാവികമായി പകർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ലാബാനോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. ഹീബ്രായയിലെ ശക്തമായ גזל എന്ന ക്രിയയുടെ ബലപ്രയോഗാർഥം മുഖ്യപാഠത്തിൽ തന്നേ സംരക്ഷിച്ചു.
