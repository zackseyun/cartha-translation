source:
  edition: WLC
  text: וַ/יִּזְבַּ֨ח יַעֲקֹ֥ב זֶ֨בַח֙ בָּ/הָ֔ר וַ/יִּקְרָ֥א לְ/אֶחָ֖י/ו לֶ/אֱכָל לָ֑חֶם וַ/יֹּ֣אכְלוּ לֶ֔חֶם וַ/יָּלִ֖ינוּ בָּ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/054.yaml
  text: Then Jacob offered a sacrifice on the mountain and called his brothers to eat bread[a]. They ate bread and spent the night on the mountain.
translation:
  language: ml
  text: പിന്നെ യാക്കോബ് മലയിൽ ഒരു യാഗം അർപ്പിച്ചു; അപ്പം ഭക്ഷിക്കാൻ തന്റെ സഹോദരന്മാരെ[a] വിളിച്ചു. അവർ അപ്പം ഭക്ഷിച്ചു; ആ രാത്രി മലയിൽ തങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തന്റെ പുരുഷബന്ധുക്കളെ’ അല്ലെങ്കിൽ ‘തന്റെ ബന്ധുക്കളെ’; എബ്രായത്തിലെ ‘സഹോദരന്മാർ’ എന്ന പദം ഈ സന്ദർഭത്തിൽ പുരുഷബന്ധുക്കളെയോ കൂട്ടാളികളെയോ കൂടുതൽ വിശാലമായ അർഥത്തിൽ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח ... זֶבַח
  choice: ഒരു യാഗം അർപ്പിച്ചു
  rationale: ക്രിയയും അതേ ധാതുവിൽനിന്നുള്ള നാമവും ചേർന്ന എബ്രായ പ്രയോഗം യാഗാർപ്പണത്തെ ഊന്നുന്നു. പദാനുപദ ആവർത്തനം മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ അർഥം സ്വാഭാവികമായി നിലനിർത്തി.
- source_word: בָּהָר
  choice: മലയിൽ
  rationale: הַר എന്നത് മല, കുന്ന്, മലമ്പ്രദേശം എന്നിവ സൂചിപ്പിക്കാം; നിർദ്ദിഷ്ട സ്ഥലത്തെ ആവർത്തിച്ചു പറയുന്ന ഈ സന്ദർഭത്തിൽ ‘മലയിൽ’ നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: וַיִּקְרָא
  choice: വിളിച്ചു
  rationale: קרא എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘വിളിക്കുക’ എന്നാണ്; ഇവിടെ ക്ഷണത്തിന്റെ പ്രവർത്തനം ഉൾക്കൊള്ളുന്നുവെങ്കിലും മൂലപദത്തിന്റെ രൂപം നിലനിർത്തുന്നു.
- source_word: לְאֶחָיו
  choice: തന്റെ സഹോദരന്മാരെ
  rationale: אָח അക്ഷരാർഥത്തിൽ സഹോദരൻ എന്നാണെങ്കിലും സന്ദർഭത്തിൽ പുരുഷബന്ധുക്കളെയോ കൂട്ടാളികളെയോ വിശാലമായി സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിൽ കുടുംബബന്ധപദം നിലനിർത്തി, വിശാലാർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: לֶאֱכָל לָחֶם / וַיֹּאכְלוּ לֶחֶם
  choice: അപ്പം ഭക്ഷിക്കാൻ / അവർ അപ്പം ഭക്ഷിച്ച്
  rationale: ‘അപ്പം ഭക്ഷിക്കുക’ എന്ന എബ്രായ പ്രയോഗവും അതിന്റെ ആവർത്തനവും സംരക്ഷിക്കുന്നു; ഇത് പൊതുവായി ഭക്ഷണം കഴിക്കുന്നതിനെയും സൂചിപ്പിക്കാം.
- source_word: וַיָּלִינוּ
  choice: ആ രാത്രി ... താമസിച്ചു
  rationale: לון എന്നത് രാത്രി തങ്ങുക എന്നർഥം നൽകുന്നു. ‘ആ രാത്രി താമസിച്ചു’ ആ കാലപരിധി വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടി സന്ദർഭത്തിലെ ‘അവന്റെ സഹോദരന്മാർ’ എന്നതിന്റെ വ്യാപ്തി
  choice: മുഖ്യവാചകത്തിൽ ‘തന്റെ സഹോദരന്മാർ’ എന്നു നിലനിർത്തി.
  alternative: തന്റെ പുരുഷബന്ധുക്കൾ; തന്റെ ബന്ധുക്കൾ; തന്റെ കൂട്ടാളികൾ
  rationale: എബ്രായപദം സന്ദർഭാനുസരണം സഹോദരന്മാരെക്കാൾ വിശാലമായ സംഘത്തെ സൂചിപ്പിക്കാമെങ്കിലും, മൂലവാചകം കുടുംബബന്ധപദം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു; മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനപരമായ ചുരുക്കം വരുത്തിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യാഗം അർപ്പിച്ചു’ എന്നത് ആരാധനാസംബന്ധമായ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു; ‘അപ്പം ഭക്ഷിച്ചു’ എന്ന ആവർത്തനം മൂലവാചകത്തിന്റെ ഭാഷാസ്വഭാവം സംരക്ഷിക്കുന്നു.
