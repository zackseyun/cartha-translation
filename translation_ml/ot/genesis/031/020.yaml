  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. തെറ്റിദ്ധരിപ്പിക്കാവുന്ന അക്ഷരാർഥത്തെ മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
