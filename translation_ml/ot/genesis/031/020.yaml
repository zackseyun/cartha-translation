  yaml_path: translation/ot/genesis/031/020.yaml
  text: And Jacob deceived Laban the Aramean by not telling him that he was fleeing[a].
translation:
  language: ml
  text: യാക്കോബ് താൻ ഓടിപ്പോകുകയാണെന്ന കാര്യം അരാമ്യനായ ലാബാനോടു പറയാതെ അവനെ കബളിപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘യാക്കോബ് അരാമ്യനായ ലാബാന്റെ ഹൃദയം മോഷ്ടിച്ചു.’ ഒരാളെ അറിയിക്കാതെ പ്രവർത്തിച്ച് അവനെ വഞ്ചിക്കുകയോ അറിയാതെ പിടിക്കുകയോ ചെയ്തു എന്നർഥമുള്ള ഒരു എബ്രായ ശൈലിയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְנֹב ... אֶת־לֵב
  choice: കബളിപ്പിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘ഹൃദയം മോഷ്ടിച്ചു’ എന്നാണെങ്കിലും, ഇവിടെ ഈ എബ്രായ ശൈലി രഹസ്യമായി പ്രവർത്തിച്ച് ഒരാളെ അറിയിക്കാതിരിക്കുകയോ വഞ്ചിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഹൃദയം മോഷ്ടിച്ചു’ എന്നത് പ്രണയാർഥം ഉണർത്താൻ സാധ്യതയുള്ളതിനാൽ ആശയാനുസൃതമായ പദം തിരഞ്ഞെടുത്തു.
- source_word: הָאֲרַמִּי
  choice: അരാമ്യനായ
  rationale: എബ്രായത്തിലുള്ള വംശീയ-ഭൗഗോളിക വിശേഷണം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ‘സിറിയക്കാരനായ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ കൃത്യമാണ്.
- source_word: עַל בְּלִי הִגִּיד לוֹ
  choice: അവനോടു പറയാതെ
  rationale: ലാബാൻ അറിയാതിരുന്നതിന്റെ മാർഗം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: כִּי בֹרֵחַ הוּא
  choice: താൻ ഓടിപ്പോകുകയാണെന്ന കാര്യം
  rationale: പങ്ക്തിയുടെ പുരോഗമന/തത്സമയ ഭാവം നിലനിർത്തുകയും യാക്കോബിന്റെ രഹസ്യമായ പുറപ്പെടൽ വ്യക്തമായി അറിയിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
