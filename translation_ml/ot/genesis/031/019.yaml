theological_decisions:
- issue: അനധികൃത ആരാധനാവസ്തുക്കളുടെ സന്ദർഭത്തിൽ תְּרָפִים എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വീട്ടുവിഗ്രഹങ്ങൾ
  alternative: തെറാഫീം; ഗൃഹദേവന്മാർ
  rationale: എബ്രായ പദം വീട്ടിലെ ആരാധനയുമായി ബന്ധപ്പെട്ട രൂപങ്ങളെയോ വസ്തുക്കളെയോ സൂചിപ്പിക്കുന്നു. ‘വീട്ടുവിഗ്രഹങ്ങൾ’ മതപരമായ സ്വഭാവം മറയ്ക്കാതെ ആധുനിക വായനക്കാർക്ക് അർഥം വ്യക്തമാക്കുന്നു; മറ്റു സാധുവായ രൂപങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പശ്ചാത്തലപ്രവൃത്തിയും മുഖ്യസംഭവവും തമ്മിലുള്ള ആഖ്യാനക്രമം ‘പോയിരുന്നു’ എന്ന രൂപവും അർധവിരാമവും ഉപയോഗിച്ച് വ്യക്തമാക്കിയിരിക്കുന്നു.
