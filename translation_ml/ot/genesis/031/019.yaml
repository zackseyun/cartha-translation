- source_word: הַתְּרָפִים
  choice: വീട്ടുവിഗ്രഹങ്ങൾ
  rationale: ഒരു കുടുംബവുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുക്കളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ‘വീട്ടുവിഗ്രഹങ്ങൾ’ അവയുടെ ഗാർഹിക പശ്ചാത്തലവും വിഗ്രഹസ്വഭാവവും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר לְאָבִיהָ
