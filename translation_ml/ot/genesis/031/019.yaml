  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാവുന്ന ചെറിയ കന്നുകാലിക്കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന കൂട്ടനാമമാണ്; സന്ദർഭത്തിൽ ‘ആട്ടിൻപറ്റം’ സ്വാഭാവികമാണ്.
