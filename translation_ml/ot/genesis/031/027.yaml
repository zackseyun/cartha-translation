base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/027.yaml
  text: Why did you hide yourself to flee and steal away from me[a], and not tell me, so that I might have sent you away with joy and with songs[d][c][b], with tambourine and lyre?
translation:
  language: ml
  text: “ഒളിച്ചോടാൻ നീ എന്തിന് നിന്നെത്തന്നെ മറച്ചുവെക്കുകയും എന്നിൽനിന്ന് രഹസ്യമായി കടന്നുകളയുകയും ചെയ്തു?[a] നീ എന്നോട് പറഞ്ഞില്ലല്ലോ; പറഞ്ഞിരുന്നെങ്കിൽ സന്തോഷത്തോടെയും പാട്ടുകളോടെയും[b] തംബുരുവിന്റെയും[c] കിന്നരത്തിന്റെയും[d] അകമ്പടിയോടെ ഞാൻ നിന്നെ യാത്രയാക്കുമായിരുന്നു.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “നീ എന്നെ മോഷ്ടിച്ചു.” ഈ ഹീബ്രു ശൈലിപ്രയോഗം ഒരാളറിയാതെ രഹസ്യമായി ഒഴിഞ്ഞുപോകുക എന്നർഥം നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “പാടിക്കൊണ്ടും.”
    reason: lexical_alternative
  - marker: c
    text: പരമ്പരാഗതമായി, “തപ്പു.” കൈകൊണ്ട് കൊട്ടുന്ന ഒരു വാദ്യമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: d
    text: അല്ലെങ്കിൽ, “വീണ.” ഹീബ്രുപദം കൂടുതൽ കൃത്യമായി ലൈർ വർഗത്തിലുള്ള ഒരു തന്ത്രിവാദ്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: എന്തിന്
  rationale: കാരണത്തെക്കുറിച്ചുള്ള സ്വാഭാവികമായ ആധുനിക മലയാള ചോദ്യരൂപം.
- source_word: נַחְבֵּאתָ לִבְרֹחַ
  choice: ഒളിച്ചോടാൻ നിന്നെത്തന്നെ മറച്ചുവെച്ച്
  rationale: നിഫാൽ രൂപത്തിലെ ആത്മവാചകഭാവവും ברח എന്ന ക്രിയയുടെ ‘ഓടിപ്പോകുക’ എന്ന ശക്തിയും നിലനിർത്തുന്നു.
- source_word: וַתִּגְנֹב אֹתִי
  choice: എന്നിൽനിന്ന് രഹസ്യമായി കടന്നുകളഞ്ഞത്
  rationale: അക്ഷരാർഥത്തിൽ ‘നീ എന്നെ മോഷ്ടിച്ചു’ എന്ന അസ്പഷ്ടമായ ഹീബ്രു പ്രയോഗം ഇവിടെ ഒരാളറിയാതെ രഹസ്യമായി ഒഴിഞ്ഞുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא הִגַּדְתָּ לִּי
  choice: നീ എന്നോട് പറഞ്ഞില്ലല്ലോ
  rationale: പരാതിയുടെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: וָאֲשַׁלֵּחֲךָ
  choice: പറഞ്ഞിരുന്നെങ്കിൽ ... ഞാൻ നിന്നെ യാത്രയാക്കുമായിരുന്നു
  rationale: സന്ദർഭത്തിലെ സഫലമാകാതെ പോയ സാധ്യത വ്യക്തമാക്കുന്നതിനായി നിബന്ധനാപരമായ അർഥം സ്വാഭാവികമായി തുറന്നുപറയുന്നു.
- source_word: בְּשִׂמְחָה וּבְשִׁרִים
  choice: സന്തോഷത്തോടെയും പാട്ടുകളോടെയും
  rationale: ആഹ്ലാദപൂർണമായ യാത്രയയപ്പിന്റെ അർഥവും ബഹുവചനമായ ‘പാട്ടുകൾ’ എന്ന രൂപവും നിലനിർത്തുന്നു.
- source_word: בְּתֹף
  choice: തപ്പ്
  rationale: തോൽകൊണ്ട് മൂടിയ കൈവാദ്യത്തെ സൂചിപ്പിക്കുന്ന, ആധുനിക വായനക്കാർക്ക് മനസ്സിലാകുന്ന മലയാള പദം.
- source_word: וּבְכִנּוֹר
  choice: കിന്നരം
  rationale: പുരാതന ലൈർ വർഗത്തിലുള്ള തന്ത്രിവാദ്യത്തിന് മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും മാന്യവുമായ പദം; ‘വീണ’ എന്നു പൊതുവാക്കുന്നതിനെക്കാൾ മൂലപദത്തിന്റെ പ്രത്യേകത സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. ലാബാന്റെ കുറ്റപ്പെടുത്തൽഭാവം നിലനിർത്തി. അക്ഷരാർഥത്തിൽ അസ്വാഭാവികമായ ഹീബ്രു ശൈലിപ്രയോഗം മുഖ്യവാചകത്തിൽ അർഥാനുസൃതമായി നൽകി, അതിന്റെ പദശഃരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ നൽകിയിട്ടുണ്ട്.
