  text: וַ/יִּקְרָא ל֣/וֹ לָבָ֔ן יְגַ֖ר שָׂהֲדוּתָ֑א וְ/יַֽעֲקֹ֔ב קָ֥רָא ל֖/וֹ גַּלְעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/047.yaml
  text: Laban called it Jegar-sahadutha[b][a], but Jacob called it Galeed.
translation:
  language: ml
  text: ലാബാൻ അതിന് യെഗർ-സഹദൂഥാ[a] എന്നു പേരിട്ടു; എന്നാൽ യാക്കോബ് അതിന് ഗലേദ്[b] എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യെഗർ-സഹദൂഥാ” എന്ന അരാമായ പേരിന്റെ അർഥം “സാക്ഷ്യത്തിന്റെ കൂമ്പാരം” അഥവാ “സാക്ഷ്യക്കൂന” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: “ഗലേദ്” എന്ന എബ്രായ പേരിന്റെ അർഥം “സാക്ഷ്യത്തിന്റെ കൂമ്പാരം” അഥവാ “സാക്ഷ്യക്കൂന” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לּוֹ
  choice: അതിന് ... എന്നു പേരിട്ടു
  rationale: קרא + ל എന്ന നാമകരണപ്രയോഗത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; പുരുഷലിംഗ ഏകവചന പ്രത്യയം സന്ദർഭത്തിൽ കൽക്കൂമ്പാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לָבָן
  choice: ലാബാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതവും ഉറവിടത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം.
- source_word: יְגַר שָׂהֲדוּתָא
  choice: യെഗർ-സഹദൂഥാ
  rationale: ലാബാൻ നൽകിയ അരാമായ നാമം മുഖ്യവാക്യത്തിൽ ലിപ്യന്തരിച്ചു; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ നൽകി നാമകരണത്തിലെ ഭാഷാവ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: וְיַעֲקֹב
  choice: എന്നാൽ യാക്കോബ്
  rationale: וְ എന്ന ബന്ധകത്തിന് ഇവിടെ രണ്ടു വ്യത്യസ്ത ഭാഷകളിലുള്ള പേരുകൾ തമ്മിലുള്ള വൈരുധ്യം പ്രകടമാക്കുന്ന സന്ദർഭപരമായ അർഥമുണ്ട്.
- source_word: קָרָא לּוֹ
  choice: അതിന് ... എന്നു പേരിട്ടു
  rationale: ആദ്യ പകുതിയിലെ നാമകരണഭാഷയോട് സമാന്തരതയും മലയാളത്തിലെ സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: גַּלְעֵד
  choice: ഗലേദ്
  rationale: യാക്കോബ് നൽകിയ എബ്രായ നാമം ലിപ്യന്തരിച്ചു; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
