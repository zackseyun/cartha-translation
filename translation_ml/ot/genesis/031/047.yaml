translation_notes:
  register: 'ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പേരിടൽ എന്ന പ്രവൃത്തി വ്യക്തമായി പറയുകയും അരാമായ-എബ്രായ നാമങ്ങളുടെ സമാന്തരതയും വൈരുധ്യവും സംരക്ഷിക്കുകയും ചെയ്തു. ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ അടിക്കുറിപ്പ്-മാർക്കർ ക്രമക്കേട് ഉറവിടഭാഷയുടെ ക്രമപ്രകാരം തിരുത്തി: യെഗർ-സഹദൂഥാ [a], ഗലേദ് [b].'
