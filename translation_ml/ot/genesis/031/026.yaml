source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָבָן֙ לְ/יַעֲקֹ֔ב מֶ֣ה עָשִׂ֔יתָ וַ/תִּגְנֹ֖ב אֶת לְבָבִ֑/י וַ/תְּנַהֵג֙ אֶת בְּנֹתַ֔/י כִּ/שְׁבֻי֖וֹת חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/026.yaml
  text: Then Laban said to Jacob[a], “What have you done[c][b], that you have stolen my heart and driven my daughters away like captives of the sword?”
translation:
  language: ml
  text: 'അപ്പോൾ ലാബാൻ യാക്കോബിനോടു പറഞ്ഞു: “നീ എന്താണ് ചെയ്തത്? എന്നെ വഞ്ചിച്ച്[a] എന്റെ പെൺമക്കളെ വാളിന്റെ തടവുകാരികളെപ്പോലെ[b] നയിച്ചുകൊണ്ടുപോയല്ലോ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “എന്റെ ഹൃദയം കവർന്ന്.” ഇവിടെ അതിന്റെ അർഥം, “എന്നെ വഞ്ചിച്ച്” എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ: “വാളിന്റെ തടവുകാരികളെപ്പോലെ”; അതായത്, യുദ്ധത്തിൽ പിടിക്കപ്പെട്ട സ്ത്രീത്തടവുകാരികളെപ്പോലെ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: നീ എന്താണ് ഈ ചെയ്തത്?
  rationale: കുറ്റപ്പെടുത്തുന്ന ചോദ്യത്തിന്റെ ശക്തിയും പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തിയും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וַתִּגְנֹב אֶת לְבָבִי
  choice: നീ എന്നെ വഞ്ചിച്ച്
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥം ‘എന്റെ ഹൃദയം മോഷ്ടിച്ചു’ എന്നാണെങ്കിലും, ഇവിടെ ആരുമറിയാതെ ചതിക്കുക എന്ന പ്രയോഗാർഥമാണ്. അക്ഷരാർഥത്തിലുള്ള മലയാളം പ്രണയസൂചനയോ മറ്റൊരു തെറ്റായ അർഥമോ നൽകാൻ സാധ്യതയുള്ളതിനാൽ പ്രയോഗാർഥം മുഖ്യപാഠത്തിലും അക്ഷരാർഥം അടിക്കുറിപ്പിലും നൽകിയിരിക്കുന്നു.
- source_word: לְבָבִי
  choice: എന്നെ
  rationale: ‘എന്റെ ഹൃദയം’ എന്നത് ഈ എബ്രായ പ്രയോഗത്തിന്റെ ഘടകമാണെങ്കിലും, മലയാളത്തിൽ പ്രയോഗത്തിന്റെ ലക്ഷ്യം വ്യക്തിയെ തന്നെയാണ്; അതിനാൽ സ്വാഭാവികമായി ‘എന്നെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַתְּנַהֵג
  choice: കൊണ്ടുപോയല്ലോ
  rationale: ക്രിയയ്ക്ക് നയിച്ചുകൊണ്ടുപോകുക/ഓടിച്ചുകൊണ്ടുപോകുക എന്ന അർഥമുണ്ട്. യുദ്ധത്തടവുകാരികളുടെ ഉപമ ബലപ്രയോഗത്തിന്റെ ഭാവം നൽകുന്നതിനാൽ മലയാളത്തിൽ അനാവശ്യമായി കഠിനമാക്കാതെ കുറ്റാരോപണത്തിന്റെ സ്വരം നിലനിർത്തുന്നു.
- source_word: בְּנֹתַי
  choice: എന്റെ പെൺമക്കളെ
  rationale: ആധുനിക സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും കുടുംബബന്ധം കൃത്യമായി നിലനിർത്തുന്നതുമായ രൂപം.
- source_word: כִּשְׁבֻיוֹת חָרֶב
  choice: വാളാൽ പിടിക്കപ്പെട്ട തടവുകാരികളെപ്പോലെ
  rationale: സ്ത്രീലിംഗ ബഹുവചനവും വാളിന്റെ യുദ്ധചിത്രവും നിലനിർത്തുന്നു; ഇത് യുദ്ധത്തിൽ പിടിക്കപ്പെട്ട സ്ത്രീകളെ സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംസാരശൈലി ഉപയോഗിച്ചു. ലാബാന്റെ കുറ്റാരോപണസ്വരം ‘എന്താണ് ഈ ചെയ്തത്?’ എന്നും ‘കൊണ്ടുപോയല്ലോ’ എന്നും ഉള്ള രൂപങ്ങളിലൂടെ നിലനിർത്തി; എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
