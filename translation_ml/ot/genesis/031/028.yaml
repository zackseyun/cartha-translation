  to: എന്റെ പുത്രന്മാരെയും പുത്രിമാരെയും ചുംബിക്കാൻ നീ എന്നെ അനുവദിച്ചില്ല.[a] ഇപ്പോൾ, നീ ഭോഷമായി പ്രവർത്തിച്ചിരിക്കുന്നു.
