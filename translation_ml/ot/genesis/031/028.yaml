source:
  edition: WLC
  text: וְ/לֹ֣א נְטַשְׁתַּ֔/נִי לְ/נַשֵּׁ֥ק לְ/בָנַ֖/י וְ/לִ/בְנֹתָ֑/י עַתָּ֖ה הִסְכַּ֥לְתָּֽ עֲשֽׂוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/028.yaml
  text: And you did not let me kiss my sons and my daughters[a]. Now you have acted foolishly.
translation:
  language: ml
  text: എന്റെ പുത്രന്മാരെയും പുത്രിമാരെയും ചുംബിക്കാൻ നീ എന്നെ അനുവദിച്ചില്ല.[a] ഇപ്പോൾ, നീ ഭോഷമായി പ്രവർത്തിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “എന്റെ പുത്രന്മാരെയും പുത്രിമാരെയും ചുംബിക്കാൻ നീ എന്നെ വിട്ടില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטַשְׁתַּנִי
  choice: നീ എന്നെ അനുവദിച്ചതുമില്ല
  rationale: נטשׁ എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘വിട്ടുകളയുക’ എന്നാണെങ്കിലും, ‘ചുംബിക്കാൻ’ എന്ന ക്രിയാരൂപത്തോടു ചേർന്നപ്പോൾ അവസരം നൽകുക/അനുവദിക്കുക എന്ന ആശയമാണ് ഇവിടെ സ്വാഭാവികം. ‘അനുവദിച്ചതുമില്ല’ എന്നത് പരാതിയുടെ ഭാവവും മുൻവാക്യത്തോടുള്ള ബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: לְנַשֵּׁק
  choice: ചുംബിക്കാൻ
  rationale: മൂലപദം നേരിട്ട് ‘ചുംബിക്കുക’ എന്നാണ്. സന്ദർഭത്തിൽ യാത്രയയപ്പിന്റെ ചുംബനം സൂചിപ്പിക്കപ്പെടുന്നുണ്ടെങ്കിലും, മൂലപാഠത്തിൽ അത് പ്രത്യേകം പറഞ്ഞിട്ടില്ലാത്തതിനാൽ ലളിതമായ പദം നിലനിർത്തുന്നു.
- source_word: לְבָנַי וְלִבְנֹתַי
  choice: എന്റെ പുത്രന്മാരെയും പുത്രിമാരെയും
  rationale: എബ്രായം പുത്രന്മാരെയും പുത്രിമാരെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിലേക്കു ചുരുക്കാതെ ഇരുപദങ്ങളും നിലനിർത്തുന്നു.
- source_word: עַתָּה
  choice: ഇപ്പോൾ എന്ന ആശയം പ്രത്യേക പദമായി ആവർത്തിക്കാതെ അടുത്ത വാക്യത്തിന്റെ വിലയിരുത്തലിൽ ഉൾക്കൊള്ളിച്ചു
  rationale: עַתָּה ഇവിടെ സമയസൂചനയ്ക്കൊപ്പം പ്രസംഗത്തിലെ നിഗമനത്തിലേക്കുള്ള മാറ്റവും അടയാളപ്പെടുത്തുന്നു. സ്വാഭാവിക മലയാളത്തിൽ ‘നീ ചെയ്തത്’ എന്ന നിർമാണം ആ സന്ദർഭപരമായ ഇപ്പോഴത്തെ വിലയിരുത്തൽ വഹിക്കുന്നു.
- source_word: הִסְכַּלְתָּ עֲשׂוֹ
  choice: നീ ചെയ്തത് ഭോഷത്തമാണ്
  rationale: ഈ സംയുക്തപ്രയോഗം ‘ഭോഷമായി പ്രവർത്തിച്ചു/ചെയ്തു’ എന്ന ആശയം നൽകുന്നു. തിരഞ്ഞെടുത്ത രൂപം ആ പ്രവൃത്തിയെ ഭോഷത്തമെന്നു വിലയിരുത്തുന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. കുടുംബബന്ധങ്ങളെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ ഇരട്ടപ്രയോഗം സംരക്ഷിച്ചിരിക്കുന്നു; യാത്രയയപ്പ് എന്ന ആശയം സന്ദർഭത്തിൽ മാത്രം വിട്ടിരിക്കുന്നു.
