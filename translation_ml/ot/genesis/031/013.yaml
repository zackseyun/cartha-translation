source:
  edition: WLC
  text: אָנֹכִ֤י הָ/אֵל֙ בֵּֽית אֵ֔ל אֲשֶׁ֨ר מָשַׁ֤חְתָּ שָּׁם֙ מַצֵּבָ֔ה אֲשֶׁ֨ר נָדַ֥רְתָּ לִּ֛/י שָׁ֖ם נֶ֑דֶר עַתָּ֗ה ק֥וּם צֵא֙ מִן הָ/אָ֣רֶץ הַ/זֹּ֔את וְ/שׁ֖וּב אֶל אֶ֥רֶץ מוֹלַדְתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/013.yaml
  text: I am the God of Bethel[a], where you anointed a pillar and where you vowed a vow to me. Now arise, go out from this land[b], and return to the land of your birth.
translation:
  language: ml
  text: “ഞാൻ ബേഥേലിലെ[a] ദൈവം ആകുന്നു. അവിടെ നീ ഒരു സ്തംഭത്തെ അഭിഷേകം ചെയ്തു; അവിടെവെച്ച് എനിക്ക് ഒരു നേർച്ച നേർന്നു[b]. ഇപ്പോൾ എഴുന്നേറ്റ് ഈ ദേശത്തുനിന്ന് പുറപ്പെട്ട് നിന്റെ ജന്മദേശത്തേക്കു മടങ്ങിപ്പോകുക.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ബേഥേൽ’ എന്ന പേരിന്റെ അർത്ഥം ‘ദൈവത്തിന്റെ ഭവനം’ എന്നാണ്; ഇവിടെ അത് സ്ഥലനാമമാണ്.
    reason: cultural_note
  - marker: b
    text: എബ്രായത്തിൽ ഊന്നലിനായി ഒരേ മൂലത്തിൽനിന്നുള്ള ക്രിയയും നാമവും ചേർത്ത്, അക്ഷരാർഥത്തിൽ ‘ഒരു നേർച്ച നേർന്നു’ എന്നു പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל בֵּית אֵל
  choice: ബേഥേലിലെ ദൈവം
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ ‘ദൈവം’ എന്ന പദവും സ്ഥലനാമവും ചേർന്ന ഈ പ്രയോഗം സംസാരിക്കുന്നവനെ ബേഥേലിലെ യാക്കോബിന്റെ മുൻ അനുഭവവുമായി ബന്ധപ്പെടുത്തി തിരിച്ചറിയിക്കുന്നു. ‘ബേഥേലിൽ പ്രത്യക്ഷനായ ദൈവം’ എന്ന വിശദീകരണം മൂലത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: בֵּית אֵל
  choice: ബേഥേൽ
  rationale: ഇവിടെ ‘ദൈവത്തിന്റെ ഭവനം’ എന്ന പദാനുപദ വിവർത്തനമല്ല, സ്ഥലനാമമാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ മലയാളത്തിലെ പതിവ് ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: מָשַׁחְתָּ שָּׁם מַצֵּבָה
  choice: അവിടെ നീ ഒരു സ്തംഭത്തെ അഭിഷേകം ചെയ്തു
  rationale: מָשַׁח എന്നത് ‘അഭിഷേകം ചെയ്യുക’ എന്നും מַצֵּבָה എന്നത് സ്ഥാപിച്ച കല്ല് അഥവാ സ്തംഭം എന്നും സൂചിപ്പിക്കുന്നു. ഉല്പത്തി 28:18-ലെ പ്രവൃത്തിയോട് ബന്ധം നിലനിർത്തിക്കൊണ്ട്, ഇവിടെ നേരിട്ട് പറയാത്ത ‘എണ്ണ’ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: נָדַרְתָּ לִּי שָׁם נֶדֶר
  choice: അവിടെവെച്ച് എനിക്ക് ഒരു നേർച്ച നേർന്നു
  rationale: എബ്രായത്തിൽ ഒരേ മൂലത്തിൽനിന്നുള്ള ക്രിയയും നാമവും ചേർന്ന ഊന്നൽ മലയാളത്തിലെ സ്വാഭാവികമായ ‘നേർച്ച നേർന്നു’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; לִּי എന്നത് ‘എനിക്ക്’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: קוּם צֵא מִן הָאָרֶץ הַזֹּאת
  choice: എഴുന്നേറ്റ് ഈ ദേശത്തുനിന്ന് പുറപ്പെടുക
  rationale: തുടർച്ചയായ ആജ്ഞകൾ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു. אֶרֶץ ഇവിടെ ഭൂമി മുഴുവനെയല്ല, യാക്കോബ് താമസിക്കുന്ന പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְשׁוּב אֶל אֶרֶץ מוֹלַדְתֶּךָ
  choice: നിന്റെ ജന്മദേശത്തേക്കു മടങ്ങിപ്പോകുക
  rationale: מוֹלֶדֶת ജന്മസ്ഥലം, സ്വദേശം, ബന്ധുജനം എന്നീ അർത്ഥവ്യാപ്തി വഹിക്കാമെങ്കിലും אֶרֶץ എന്നതിനോടൊപ്പം ഇവിടെ യാക്കോബിന്റെ ഉത്ഭവദേശമാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്. ‘ജന്മദേശം’ ആ ബന്ധം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions:
- issue: സംസാരിക്കുന്നവന്റെ ‘ബേഥേലിലെ ദൈവം’ എന്ന സ്വയംപരിചയം
  choice: ഞാൻ ബേഥേലിലെ ദൈവം ആകുന്നു
  alternative: ഞാൻ ബേഥേലിൽവെച്ച് പ്രത്യക്ഷനായ ദൈവം ആകുന്നു
  rationale: മൂലപാഠത്തിലെ നിർമാണം ദൈവത്തെ യാക്കോബിന്റെ ബേഥേൽ അനുഭവവുമായി ബന്ധപ്പെടുത്തി തിരിച്ചറിയിക്കുന്നു. എന്നാൽ ‘പ്രത്യക്ഷനായ’ എന്ന വിശദീകരണം പാഠത്തിൽ നേരിട്ട് ഇല്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ ചേർക്കാതെ യഥാർഥ സംക്ഷിപ്തതയും സാധ്യതയുള്ള പ്രാദേശിക ബന്ധത്തിന്റെ ഭാഷയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവാർന്നതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. ആജ്ഞകളിലെ ചലനക്രമം നിലനിർത്തി; അനാവശ്യമായ പുരാതന പദപ്രയോഗങ്ങളും വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കലുകളും ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
