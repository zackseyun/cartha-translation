translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഇണചേരലിനെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ നേരിട്ടുള്ള മൃഗപരിപാലനഭാഷ അനാവശ്യമായി സാങ്കേതികമാക്കാതെയും മയപ്പെടുത്താതെയും നൽകിയിരിക്കുന്നു. നിറപ്പാടുകളെക്കുറിച്ചുള്ള അപൂർവ എബ്രായ പദങ്ങളുടെ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
