source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/עֵת֙ יַחֵ֣ם הַ/צֹּ֔אן וָ/אֶשָּׂ֥א עֵינַ֛/י וָ/אֵ֖רֶא בַּ/חֲל֑וֹם וְ/הִנֵּ֤ה הָֽ/עַתֻּדִים֙ הָ/עֹלִ֣ים עַל הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/בְרֻדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/010.yaml
  text: And it happened at the time when the flock was mating that I lifted up my eyes and saw in a dream[a], and behold, the male goats that were mounting the flock were striped, speckled[b], and mottled.
translation:
  language: ml
  text: ആട്ടിൻപറ്റം ഇണചേരുന്ന സമയത്ത്, ഞാൻ കണ്ണുകളുയർത്തി സ്വപ്നത്തിൽ കണ്ടു; അതാ, പെൺആടുകളുടെ മേൽ കയറുന്ന ആൺകോലാടുകൾ വരകളുള്ളവയും[a] പുള്ളികളുള്ളവയും പലനിറപ്പാടുകളുള്ളവയും[b] ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വരകളുള്ളവ’ എന്നതിന് ‘വളയവരകളുള്ളവ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം മൃഗങ്ങളുടെ ശരീരത്തിലെ പട്ടപോലെയോ വളയംപോലെയോ ഉള്ള അടയാളങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘പലനിറപ്പാടുകളുള്ളവ’ എന്നതിന് ‘ചിതറിയ നിറപ്പാടുകളുള്ളവ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ മൂന്ന് എബ്രായ നിറപ്പാടുപദങ്ങളും രോമാവരണത്തിലെ വ്യത്യസ്ത തരത്തിലുള്ള അടയാളങ്ങളെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ഇങ്ങനെ സംഭവിച്ചു
  rationale: ഭൂതകാലത്തിലെ ഒരു സംഭവം അവതരിപ്പിക്കുന്ന എബ്രായ ആഖ്യാനരീതി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּעֵת יַחֵם הַצֹּאן
  choice: ആട്ടിൻപറ്റം ഇണചേരുന്ന കാലത്ത്
  rationale: יחם പ്രജനനസന്ദർഭത്തിൽ മൃഗങ്ങൾ ഇണചേരാൻ ഉഷ്ണത്തിലാകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഫലം മുൻകൂട്ടി നിശ്ചയിക്കുന്ന ‘ഗർഭം ധരിച്ചപ്പോൾ’ എന്നതിനെക്കാൾ ‘ഇണചേരുന്ന’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וָאֶשָּׂא עֵינַי
  choice: ഞാൻ കണ്ണുകളുയർത്തി
  rationale: നോട്ടം തിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധം സംരക്ഷിക്കുന്നു.
- source_word: וָאֵרֶא בַּחֲלוֹם
  choice: സ്വപ്നത്തിൽ കണ്ടു
  rationale: ദർശനം ലഭിച്ച മാധ്യമം സ്വപ്നമായിരുന്നുവെന്ന് വ്യക്തമാക്കുന്നു; എബ്രായത്തിൽ ഇല്ലാത്ത അധിക നിർവചനം ചേർക്കുന്നില്ല.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: പെട്ടെന്നുള്ള ശ്രദ്ധാകർഷണവും ദൃശ്യത്തിന്റെ സജീവമായ അവതരണവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָעַתֻּדִים
  choice: ആൺകോലാടുകൾ
  rationale: പ്രജനനത്തിനുള്ള ആൺകോലാടുകളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദപ്രയോഗമാണിത്.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: ആട്ടിൻപറ്റത്തിന്മേൽ കയറുന്ന
  rationale: ഇണചേരലിനായി മൃഗങ്ങൾ മുകളിൽ കയറുന്നതെന്ന മൂലപാഠത്തിലെ മൂർത്തമായ ദൃശ്യം വ്യാഖ്യാനിച്ച് മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: עֲקֻדִּים
  choice: വരകളുള്ളവ
  rationale: വളയമോ പട്ടയോ പോലുള്ള അടയാളങ്ങളെ സൂചിപ്പിക്കുന്ന പദത്തിന് ലളിതവും വ്യാപകമായി മനസ്സിലാകുന്നതുമായ മലയാളം; കൂടുതൽ നിർദിഷ്ടമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: נְקֻדִּים
  choice: പുള്ളികളുള്ളവ
  rationale: ചെറിയ പുള്ളികളോ കുത്തുകളോ പോലുള്ള രോമനിറ അടയാളങ്ങളെ വ്യക്തമായി സൂചിപ്പിക്കുകയും അടുത്ത നിറപ്പാടുപദത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וּבְרֻדִּים
  choice: പലനിറപ്പാടുകളുള്ളവ
  rationale: ക്രമരഹിതമായി കലർന്നതോ ചിതറിയതോ ആയ നിറവ്യത്യാസം സൂചിപ്പിക്കുന്നു; ‘പുള്ളികളുള്ളവ’ എന്ന മുൻപദവുമായി ലയിപ്പിക്കാതെ വ്യത്യാസം നിലനിർത്തുന്നു.
