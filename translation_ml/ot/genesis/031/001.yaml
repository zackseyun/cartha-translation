  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֗ע אֶת דִּבְרֵ֤י בְנֵֽי לָבָן֙ לֵ/אמֹ֔ר לָקַ֣ח יַעֲקֹ֔ב אֵ֖ת כָּל אֲשֶׁ֣ר לְ/אָבִ֑י/נוּ וּ/מֵ/אֲשֶׁ֣ר לְ/אָבִ֔י/נוּ עָשָׂ֕ה אֵ֥ת כָּל הַ/כָּבֹ֖ד הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/001.yaml
  text: He heard the words of Laban’s sons[a], saying, “Jacob has taken all that belonged to our father, and from what belonged to our father he has gained all this wealth.”
translation:
  language: ml
  text: 'ലാബാന്റെ പുത്രന്മാരുടെ വാക്കുകൾ യാക്കോബ് കേട്ടു; അവർ ഇങ്ങനെ പറയുകയായിരുന്നു: “നമ്മുടെ അപ്പനുണ്ടായിരുന്നതെല്ലാം യാക്കോബ് എടുത്തിരിക്കുന്നു; നമ്മുടെ അപ്പന്റേതിൽനിന്ന് അവൻ ഈ സമ്പത്തെല്ലാം[a] സമ്പാദിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഈ മഹിമയെല്ലാം.” എബ്രായപദത്തിന് ബഹുമാനം, മഹിമ, പ്രൗഢി, അല്ലെങ്കിൽ ഭൗതികസമ്പത്ത് എന്നിങ്ങനെ അർഥങ്ങൾ വരാം; ഇവിടെ അത് യാക്കോബിന്റെ പ്രകടമായ സമൃദ്ധിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: കേട്ടു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. മൂലത്തിൽ വ്യക്തമായ ‘ഇപ്പോൾ’ എന്ന കാലസൂചകപദമില്ലാത്തതിനാൽ അത്തരം പദം ചേർത്തിട്ടില്ല; സന്ദർഭത്തിൽ കർത്താവ് യാക്കോബ് ആണെന്നത് മലയാളത്തിൽ വ്യക്തമായി നൽകിയിരിക്കുന്നു.
- source_word: דִּבְרֵי בְנֵי לָבָן
  choice: ലാബാന്റെ പുത്രന്മാർ പറയുന്നത്
  rationale: ദִּבְרֵי എന്നത് ഇവിടെ അവരുടെ സംസാരത്തെയോ വാക്കുകളെയോ സൂചിപ്പിക്കുന്നു. ‘പറയുന്നത്’ എന്ന പ്രയോഗം തുടർന്നുവരുന്ന നേരിട്ടുള്ള ഉദ്ധരണിയുമായി സ്വാഭാവികമായി ചേരുന്നു.
- source_word: לָקַח
  choice: എടുത്തിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയെ ഇപ്പോഴത്തെ പരാതിയായി അവതരിപ്പിക്കുന്നതിനാൽ ഈ രൂപം അനുയോജ്യം. ‘പിടിച്ചെടുത്തു’ എന്നു പറഞ്ഞാൽ മൂലക്രിയയിലില്ലാത്ത ബലപ്രയോഗത്തിന്റെ ഭാവം വരാം.
- source_word: כָּל אֲשֶׁר לְאָבִינוּ
  choice: നമ്മുടെ അപ്പനുണ്ടായിരുന്നതെല്ലാം
  rationale: ലാമെദ് സൂചിപ്പിക്കുന്ന ഉടമസ്ഥത സാധാരണ മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; മക്കളുടെ നേരിട്ടുള്ള സംസാരത്തിന് ‘അപ്പൻ’ സ്വാഭാവികമാണ്.
- source_word: וּמֵאֲשֶׁר לְאָבִינוּ
  choice: നമ്മുടെ അപ്പന്റേതിൽനിന്നാണ്
  rationale: מִן ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള ഉടമസ്ഥതാ ഊന്നൽ നിലനിർത്തിയിരിക്കുന്നു.
- source_word: עָשָׂה
  choice: ഉണ്ടാക്കിയത്
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘ഉണ്ടാക്കുക’ നിലനിർത്തിക്കൊണ്ട്, യാക്കോബ് തന്റെ സമ്പത്ത് ലാബാന്റെ വകയിൽനിന്ന് നേടിയെന്ന പുത്രന്മാരുടെ ആരോപണം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּל הַכָּבֹד הַזֶּה
  choice: ഈ സമ്പത്തെല്ലാം
  rationale: כָּבוֹד മഹത്ത്വം, ബഹുമാനം, പ്രൗഢി എന്നിവയെ സൂചിപ്പിക്കാമെങ്കിലും ഇവിടെ യാക്കോബിന്റെ ദൃശ്യമായ ഭൗതിക അഭിവൃദ്ധിയാണ് സന്ദർഭം; അതിനാൽ ‘സമ്പത്ത്’ മുഖ്യപാഠത്തിൽ യോജിക്കുന്നു. പദത്തിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
