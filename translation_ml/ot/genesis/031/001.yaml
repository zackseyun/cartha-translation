translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. നേരിട്ടുള്ള കുടുംബസംസാരത്തിൽ ‘അപ്പൻ’ ഉപയോഗിച്ചു; ഉറവിടത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനപരമായ കുറ്റാരോപണപദങ്ങൾ ഒഴിവാക്കി.
