  text: וַ/אֲבִי/כֶן֙ הֵ֣תֶל בִּ֔/י וְ/הֶחֱלִ֥ף אֶת מַשְׂכֻּרְתִּ֖/י עֲשֶׂ֣רֶת מֹנִ֑ים וְ/לֹֽא נְתָנ֣/וֹ אֱלֹהִ֔ים לְ/הָרַ֖ע עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/007.yaml
  text: Yet your father has deceived me and changed my wages ten times[c][b][a], but God did not allow him to harm me.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളുടെ അപ്പൻ എന്നെ വഞ്ചിക്കുകയും എന്റെ കൂലി പത്തുതവണ മാറ്റുകയും ചെയ്തു[a][b]. എങ്കിലും എനിക്കു ദോഷം ചെയ്യാൻ ദൈവം അവനെ അനുവദിച്ചില്ല[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്നെ കബളിപ്പിച്ചു’ അല്ലെങ്കിൽ ‘എന്നെ കളിയാക്കി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ക്രിയ വഞ്ചനാപരമായോ പരിഹാസപരമായോ ഉള്ള പെരുമാറ്റത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘പത്തുതവണ.’ ഇത് ആവർത്തിച്ചുള്ള മാറ്റങ്ങളെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമായിരിക്കാം; കൃത്യമായി പത്തു തവണ എന്നർഥം നിർബന്ധമല്ല.
    reason: cultural_note
  - marker: c
    text: അക്ഷരാർഥം ‘എനിക്കു ദോഷം ചെയ്യാൻ ദൈവം അവനെ കൊടുത്തില്ല’; അതായത്, ദൈവം അതിന് അവനെ അനുവദിച്ചില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתֶל
  choice: വഞ്ചിച്ചു
  rationale: ഹിഫിൽ രൂപത്തിലുള്ള ഈ ക്രിയ വഞ്ചനാപരമായോ പരിഹാസപരമായോ പെരുമാറ്റത്തെ സൂചിപ്പിക്കാം. കൂലി ആവർത്തിച്ചു മാറ്റിയ സാഹചര്യത്തിൽ ‘വഞ്ചിച്ചു’ എന്നത് അർത്ഥം സ്വാഭാവികമായും വ്യക്തമായും നൽകുന്നു; പരിഹാസത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְהֶחֱלִף
  choice: മാറ്റുകയും ചെയ്തു
  rationale: സമ്മതിച്ചിരുന്ന പ്രതിഫലം ആവർത്തിച്ച് വ്യത്യാസപ്പെടുത്തിയതിനെ ഈ ക്രിയ സൂചിപ്പിക്കുന്നു. ‘മാറ്റി’ എന്നത് ആ തൊഴിൽ-പ്രതിഫല സാഹചര്യത്തിന് യോജിച്ച ലളിതമായ മലയാളമാണ്.
- source_word: מַשְׂכֻּרְתִּי
  choice: എന്റെ കൂലി
  rationale: തൊഴിലിന് ലഭിക്കേണ്ട പ്രതിഫലത്തെയാണ് നാമം സൂചിപ്പിക്കുന്നത്; ‘കൂലി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: പത്തുതവണ
  rationale: അക്ഷരാർഥത്തിൽ ‘പത്തുതവണ’; ആവർത്തനത്തെ ഊന്നുന്ന പ്രയോഗമായിരിക്കാം. കൃത്യസംഖ്യയാണോ പ്രയോഗപരമായ അതിശയോക്തിയാണോ എന്ന് മുഖ്യവാചകം തീരുമാനിക്കുന്നില്ല.
- source_word: וְלֹא נְתָנוֹ אֱלֹהִים
  choice: എങ്കിലും ... ദൈവം അവനെ അനുവദിച്ചില്ല
  rationale: അക്ഷരാർഥത്തിലെ ‘ദൈവം അവന് കൊടുത്തില്ല’ എന്ന ഹീബ്രു പ്രയോഗം ഇവിടെ അവസരമോ അനുമതിയോ നൽകാതിരുന്നതിനെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ അതിന്റെ അർത്ഥം ‘അനുവദിച്ചില്ല’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: לְהָרַע עִמָּדִי
  choice: എനിക്കു ദോഷം ചെയ്യാൻ
  rationale: רעע എന്ന ക്രിയയും עִם എന്ന ബന്ധപദവും ചേർന്ന് ഒരാളോടു മോശമായി പ്രവർത്തിക്കുകയോ അയാൾക്കു ദോഷം വരുത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘എനിക്കു ദോഷം ചെയ്യാൻ’ അർത്ഥത്തോടടുത്തതും സ്വാഭാവികവുമാണ്.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: യാക്കോബിന്റെ പ്രസംഗത്തിൽ ഈ പദം ദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണ മലയാള രൂപമായ ‘ദൈവം’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ‘ദൈവം അവന് കൊടുത്തില്ല’ എന്ന പ്രയോഗത്തിലെ ദൈവിക തടയൽ
  choice: ലാബാന് യാക്കോബിനോടു ദോഷം ചെയ്യാൻ ദൈവം അനുമതി നൽകിയില്ല
  alternative: ദൈവം യാക്കോബിനെ ലാബാന്റെ കയ്യിൽ ഏല്പിച്ചില്ല; അല്ലെങ്കിൽ ലാബാന്റെ ദോഷശ്രമം വിജയിക്കാൻ ദൈവം അനുവദിച്ചില്ല
  rationale: വാചകം ദൈവം ലാബാന്റെ ദോഷപ്രവൃത്തിയെ തടഞ്ഞതായി അവതരിപ്പിക്കുന്നു. ‘അനുവദിച്ചില്ല’ എന്ന പരിഭാഷ ആ ദൈവിക നിയന്ത്രണം നിലനിർത്തുന്നു; തടഞ്ഞ കൃത്യരീതി വാചകത്തിൽ ഇല്ലാത്തതിനാൽ അതിനെ കൂടുതൽ വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. കുടുംബസംബോധനയിൽ ‘നിങ്ങളുടെ അപ്പൻ’ എന്നും തൊഴിൽപ്രതിഫലത്തിന് ‘കൂലി’ എന്നും ഉപയോഗിച്ചത് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്. മൂലത്തിലെ വഞ്ചന/പരിഹാസ അർത്ഥസാധ്യതയും ‘പത്തുതവണ’ എന്ന പ്രയോഗത്തിന്റെ കൃത്യതാസന്ദേഹവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
