source:
  edition: WLC
  text: וְ/עַתָּה֙ הָלֹ֣ךְ הָלַ֔כְתָּ כִּֽי נִכְסֹ֥ף נִכְסַ֖פְתָּה לְ/בֵ֣ית אָבִ֑י/ךָ לָ֥/מָּה גָנַ֖בְתָּ אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/030.yaml
  text: And now[a], you have indeed gone away, because you longed greatly for your father's house. Why did you steal my gods?
translation:
  language: ml
  text: ഇപ്പോൾ, നിന്റെ പിതാവിന്റെ വീട്ടിലേക്കു നീ അതിയായി കൊതിച്ചതുകൊണ്ടു, നീ തീർച്ചയായും പോയിരിക്കുന്നു. എന്റെ ദേവന്മാരെ[a] നീ എന്തിന് മോഷ്ടിച്ചു?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ ഗൃഹദേവന്മാരെ.’ എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘എന്റെ ദേവന്മാരെ’ എന്നാണ്; സന്ദർഭത്തിൽ ലാബാന്റെ വീട്ടിലെ വിഗ്രഹങ്ങളെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: ലാബാന്റെ കുറ്റാരോപണത്തിലെ അടുത്ത കാര്യം അവതരിപ്പിക്കുന്ന സംവാദസൂചകം; മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഇപ്പോൾ’ എന്നു നൽകി.
- source_word: הָלֹךְ הָלַכְתָּ
  choice: നീ തീർച്ചയായും പോയിരിക്കുന്നു
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും ക്രിയയും ചേർന്ന എബ്രായ പ്രയോഗത്തിലെ ഊന്നൽ ‘തീർച്ചയായും’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കൊതിച്ചതുകൊണ്ട്
  rationale: യാക്കോബ് പോയതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം മലയാളത്തിലെ കാരണസൂചക രൂപത്തിലൂടെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: נִכְסֹף נִכְסַפְתָּה
  choice: നീ അതിയായി കൊതിച്ചതുകൊണ്ട്
  rationale: ആവർത്തനഘടന നൽകുന്ന ശക്തമായ ആഗ്രഹത്തിന്റെ ഊന്നൽ ‘അതിയായി കൊതിച്ചു’ എന്ന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְבֵית אָבִיךָ
  choice: നിന്റെ പിതാവിന്റെ വീട്ടിലേക്ക്
  rationale: കുടുംബത്തെയും കുടുംബഭവനത്തെയും സൂചിപ്പിക്കാവുന്ന മൂലപദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: לָמָּה
  choice: എന്തിന്
  rationale: ലാബാന്റെ നേരിട്ടുള്ള ചോദ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: גָנַבְתָּ
  choice: നീ മോഷ്ടിച്ചത്
  rationale: കഴിഞ്ഞുപോയ പ്രവൃത്തിയെക്കുറിച്ചുള്ള നേരിട്ടുള്ള കുറ്റാരോപണചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶת אֱלֹהָי
  choice: എന്റെ ദേവന്മാരെ
  rationale: എബ്രായത്തിൽ ഉള്ളത് അക്ഷരാർഥത്തിൽ ‘എന്റെ ദേവന്മാർ’ എന്നാണ്; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘ഗൃഹദേവന്മാർ’ എന്ന വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ലാബാന്റെ വാക്കുകളിലെ אֱלֹהָי എന്നതിന്റെ പരിഭാഷ
  choice: എന്റെ ദേവന്മാരെ
  alternative: എന്റെ ഗൃഹദേവന്മാരെ
  rationale: മൂലപാഠത്തിലെ ബഹുവചനരൂപം നേരിട്ട് സംരക്ഷിക്കുന്നു. സന്ദർഭത്തിൽ ലാബാന്റെ വീട്ടിലെ വിഗ്രഹങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നതെങ്കിലും ആ വിശദീകരണം ഈ വാക്യത്തിലെ പദത്തിൽ തന്നെയില്ല; അതിനാൽ അത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ മാന്യമായ മലയാളം. എബ്രായത്തിലെ രണ്ട് ഊന്നൽഘടനകളും യഥാക്രമം ‘തീർച്ചയായും’, ‘അതിയായി’ എന്നിവകൊണ്ട് പ്രകടിപ്പിച്ചു; മുഖ്യപാഠത്തിൽ ഇല്ലാത്ത സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിലേക്കു മാറ്റി.
