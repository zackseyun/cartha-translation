source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֶל אָבִ֗י/הָ אַל יִ֨חַר֙ בְּ/עֵינֵ֣י אֲדֹנִ֔/י כִּ֣י ל֤וֹא אוּכַל֙ לָ/ק֣וּם מִ/פָּנֶ֔י/ךָ כִּי דֶ֥רֶךְ נָשִׁ֖ים לִ֑/י וַ/יְחַפֵּ֕שׂ וְ/לֹ֥א מָצָ֖א אֶת הַ/תְּרָפִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/035.yaml
  text: And she said to her father[a], “Let not my lord be angry in my sight that I cannot rise before you, for the way of women is upon me.” So he searched[b], but did not find the household idols.
translation:
  language: ml
  text: 'അവൾ തന്റെ അപ്പനോടു പറഞ്ഞു: “എന്റെ യജമാനനു എന്നോടു കോപം തോന്നരുതേ. അങ്ങയുടെ മുമ്പിൽ എഴുന്നേൽക്കാൻ എനിക്കു കഴിയുന്നില്ല; സ്ത്രീകളുടെ മാസധർമ്മം എനിക്കു വന്നിരിക്കുന്നു.” അവൻ തിരഞ്ഞെങ്കിലും ഗൃഹവിഗ്രഹങ്ങൾ[a] കണ്ടെത്തിയില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘തെരാഫീം’; വീട്ടിലെ ആരാധനയ്ക്കായി സൂക്ഷിച്ചിരുന്ന പ്രതിമകളെയോ വിഗ്രഹങ്ങളെയോ സൂചിപ്പിക്കുന്ന പദം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יִחַר בְּעֵינֵי אֲדֹנִי
  choice: യജമാനൻ എന്നോടു കോപിക്കരുതേ
  rationale: ‘എന്റെ യജമാനന്റെ കണ്ണുകളിൽ കോപം ജ്വലിക്കരുത്’ എന്ന അക്ഷരാർഥം മലയാളത്തിൽ അസ്വാഭാവികമാണ്. വിനയപൂർവമായ അഭിസംബോധനയും ഉദ്ദേശ്യാർഥവും നിലനിർത്തിക്കൊണ്ട് പ്രയോഗത്തെ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി; ഇവിടെ ‘യജമാനൻ’ ദൈവിക പദവിയല്ല, അപ്പനോടുള്ള ആദരസൂചക അഭിസംബോധനയാണ്.
- source_word: לֹא אוּכַל לָקוּם מִפָּנֶיךָ
  choice: അങ്ങയുടെ മുമ്പിൽ എഴുന്നേൽക്കാൻ എനിക്കു കഴിയുന്നില്ല
  rationale: קום എന്നതിന്റെ ശാരീരികമായ ‘എഴുന്നേൽക്കുക’ എന്ന അർഥവും מִפָּנֶיךָ എന്നതിലെ ആദരപൂർവമായ സാന്നിധ്യസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: דֶרֶךְ נָשִׁים לִי
  choice: സ്ത്രീകൾക്കുള്ള പതിവ് എനിക്കുണ്ട്
  rationale: ആർത്തവത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശിഷ്ടോക്തിയുടെ മിതവും പരോക്ഷവുമായ ഭാവം, ക്ലിനിക്കൽ വിശദീകരണം ചേർക്കാതെ, മലയാളത്തിൽ മനസ്സിലാകുന്ന രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: וַיְחַפֵּשׂ וְלֹא מָצָא
  choice: അവൻ തിരഞ്ഞെങ്കിലും ... കണ്ടെത്തിയില്ല
  rationale: തിരച്ചിലിന്റെയും പരാജയപ്പെട്ട ഫലത്തിന്റെയും ബന്ധം സ്വാഭാവിക മലയാളത്തിലെ വിരുദ്ധബന്ധകത്തിലൂടെ വ്യക്തമാക്കുന്നു; കർത്താവ് സന്ദർഭത്തിൽനിന്ന് ലാബാനാണെന്ന് വ്യക്തമാണ്.
- source_word: הַתְּרָפִים
  choice: ഗൃഹവിഗ്രഹങ്ങൾ
  rationale: വീട്ടിലെ ആരാധനയുമായി ബന്ധപ്പെട്ട പ്രതിമകളെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ഗാർഹികവും മതപരവുമായ സ്വഭാവം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: תְּרָפִים എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഗൃഹവിഗ്രഹങ്ങൾ
  alternative: തെരാഫീം; ഗൃഹദേവന്മാർ
  rationale: മൂലപദം വീട്ടിലെ ആരാധനയുമായി ബന്ധപ്പെട്ട വസ്തുക്കളെയോ പ്രതിമകളെയോ സൂചിപ്പിക്കുന്നു. ‘ഗൃഹവിഗ്രഹങ്ങൾ’ അവയുടെ പ്രവർത്തനവും പശ്ചാത്തലവും വ്യക്തമാക്കുന്നു; കൃത്യമായ രൂപമോ ഉപയോഗമോ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. റാഹേലിന്റെ അപ്പനോടുള്ള ആദരസൂചക ഭാഷയ്ക്കായി ‘യജമാനൻ’, ‘അങ്ങയുടെ’ എന്നിവ ഉപയോഗിച്ചു. ആർത്തവത്തെക്കുറിച്ചുള്ള മൂലപാഠത്തിന്റെ ശിഷ്ടോക്തി പരോക്ഷമായി നിലനിർത്തി.
