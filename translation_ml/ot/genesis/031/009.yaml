source:
  edition: WLC
  text: וַ/יַּצֵּ֧ל אֱלֹהִ֛ים אֶת מִקְנֵ֥ה אֲבִי/כֶ֖ם וַ/יִּתֶּן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/009.yaml
  text: So God took away your father's livestock and gave it to me[a].
translation:
  language: ml
  text: അങ്ങനെ ദൈവം നിങ്ങളുടെ അപ്പന്റെ കന്നുകാലികളെ എടുത്തുമാറ്റി എനിക്കു തന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തട്ടിയെടുത്തു’ അല്ലെങ്കിൽ ‘വിടുവിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഒരാളുടെ കൈയിൽനിന്ന് എടുത്ത് മറ്റൊരാൾക്കു കൈമാറുക എന്ന അർഥവും എബ്രായ ക്രിയയ്ക്കുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל
  choice: എടുത്തുമാറ്റി
  rationale: നצל എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഒരാളുടെ കൈയിൽനിന്ന് എടുത്ത് മറ്റൊരാൾക്കു കൈമാറുക, വിടുവിക്കുക, തട്ടിയെടുക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കാം. ഇവിടെ ലാബാന്റെ കന്നുകാലികൾ യാക്കോബിനു ലഭിച്ചതാണ് സന്ദർഭം; അതിനാൽ രക്ഷപ്പെടുത്തൽ എന്ന ആശയം അമിതമായി സൂചിപ്പിക്കാതെ കൈമാറ്റം വ്യക്തമാക്കുന്ന ‘എടുത്തുമാറ്റി’ തിരഞ്ഞെടുത്തു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഇവിടെ യാക്കോബിനുവേണ്ടി പ്രവർത്തിക്കുന്ന ദൈവത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ പദത്തിന് സ്വാഭാവികമായ മലയാള പരിഭാഷ.
- source_word: מִקְנֵה
  choice: കന്നുകാലികളെ
  rationale: ഈ പദം സമ്പാദിച്ച സ്വത്തിനെ, പ്രത്യേകിച്ച് വളർത്തുമൃഗങ്ങളെ, സൂചിപ്പിക്കുന്നു. യാക്കോബിന്റെയും ലാബാന്റെയും ആട്ടിൻപറ്റങ്ങളുടെയും മൃഗസമ്പത്തിന്റെയും സന്ദർഭത്തിൽ ‘കന്നുകാലികൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: אֲבִיכֶם
  choice: നിങ്ങളുടെ അപ്പന്റെ
  rationale: ഏകവചന നാമത്തോടു ചേർന്ന രണ്ടാംപുരുഷ ബഹുവചന പ്രത്യയം റാഹേലിനോടും ലേയയോടും അവരുടെ ഒരേ അപ്പനായ ലാബാനെക്കുറിച്ചുള്ള അഭിസംബോധനയാണ്. ‘നിങ്ങളുടെ അപ്പന്റെ’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַיִּתֶּן לִי
  choice: എനിക്കു തന്നു
  rationale: נתן എന്ന ക്രിയയും ‘എനിക്ക്’ എന്ന പരോക്ഷ കർമവും കൈമാറ്റം വ്യക്തമാക്കുന്നു. മുൻപുള്ള ‘കന്നുകാലികളെ’ മലയാളത്തിൽ കർമമായി തുടർന്നും ഗ്രഹിക്കാനാകുന്നതിനാൽ വേറെ സർവനാമം ചേർക്കേണ്ടതില്ല.
theological_decisions:
- issue: യാക്കോബിന്റെ സമൃദ്ധിയിലെ ദൈവിക പ്രവർത്തനം
  choice: ദൈവം ലാബാന്റെ കന്നുകാലികളെ എടുത്തുമാറ്റി യാക്കോബിനു തന്നുവെന്ന് നേരിട്ട് പ്രസ്താവിക്കുന്നു.
  alternative: സ്വത്തിന്റെ കൈമാറ്റം വ്യക്തമാക്കാതെ പൊതുവായ ദൈവാനുഗ്രഹമായി മൃദുവാക്കുക.
  rationale: וַיַּצֵּל ... וַיִּתֶּן എന്ന എബ്രായ പ്രയോഗം എടുത്തുമാറ്റലും നൽകലും ദൈവത്തിന്റെ പ്രവർത്തനമായി വ്യക്തമായി പറയുന്നു. അതിനാൽ ഈ ശക്തമായ ദൈവിക പ്രവർത്തനം അവ്യക്തമായ അനുഗ്രഹഭാഷയാക്കി മാറ്റിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. റാഹേലിനോടും ലേയയോടുമുള്ള അഭിസംബോധനയിൽ സാധാരണ വായനക്കാർക്ക് എളുപ്പമുള്ള ‘അപ്പൻ’ ഉപയോഗിച്ചു; മൂലത്തിലെ കൈമാറ്റഭാവവും ക്രിയയുടെ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
