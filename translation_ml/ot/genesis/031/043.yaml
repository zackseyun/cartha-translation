source:
  edition: WLC
  text: וַ/יַּ֨עַן לָבָ֜ן וַ/יֹּ֣אמֶר אֶֽל יַעֲקֹ֗ב הַ/בָּנ֨וֹת בְּנֹתַ֜/י וְ/הַ/בָּנִ֤ים בָּנַ/י֙ וְ/הַ/צֹּ֣אן צֹאנִ֔/י וְ/כֹ֛ל אֲשֶׁר אַתָּ֥ה רֹאֶ֖ה לִ/י ה֑וּא וְ/לִ/בְנֹתַ֞/י מָֽה אֶֽעֱשֶׂ֤ה לָ/אֵ֨לֶּה֙ הַ/יּ֔וֹם א֥וֹ לִ/בְנֵי/הֶ֖ן אֲשֶׁ֥ר יָלָֽדוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/043.yaml
  text: Then Laban answered and said to Jacob[a], “The daughters are my daughters, and the sons are my sons, and the flock is my flock, and all that you see is mine. But what can I do this day for these my daughters, or for their children whom they have borne?”
translation:
  language: ml
  text: 'അപ്പോൾ ലാബാൻ യാക്കോബിനോട് മറുപടി പറഞ്ഞു: “ഈ പുത്രിമാർ എന്റെ പുത്രിമാരാണ്; ഈ പുത്രന്മാർ എന്റെ പുത്രന്മാരാണ്; ഈ ആട്ടിൻപറ്റം എന്റെ ആട്ടിൻപറ്റമാണ്; നീ കാണുന്നതെല്ലാം എന്റേതാണ്. എന്നാൽ ഇന്ന് എന്റെ ഈ പുത്രിമാർക്കുവേണ്ടിയോ അവർ പ്രസവിച്ച മക്കൾക്കുവേണ്ടിയോ എനിക്ക് എന്തു ചെയ്യാനാകും?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: മറുപടി പറഞ്ഞു
  rationale: രണ്ടു എബ്രായ ആഖ്യാനക്രിയകളുടെയും സംയുക്ത അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘ഉത്തരം പറഞ്ഞ് പറഞ്ഞു’ എന്ന കൃത്രിമ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: הַבָּנוֹת בְּנֹתַי
  choice: ഈ പുത്രിമാർ എന്റെ പുത്രിമാരാണ്
  rationale: ആവർത്തനവും ലാബാന്റെ ഊന്നിയ അവകാശവാദവും നിലനിർത്തുന്നു; നിർദ്ദിഷ്ടത വ്യക്തമാക്കാൻ ‘ഈ’ ചേർത്തിരിക്കുന്നു.
- source_word: וְהַבָּנִים בָּנַי
  choice: ഈ പുത്രന്മാർ എന്റെ പുത്രന്മാരാണ്
  rationale: പുല്ലിംഗ ബഹുവചനവും സമാന്തരമായ ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: וְהַצֹּאן צֹאנִי
  choice: ഈ ആട്ടിൻപറ്റം എന്റെ ആട്ടിൻപറ്റമാണ്
  rationale: צאן എന്ന ചെറുകന്നുകാലികളുടെ കൂട്ടത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ആട്ടിൻപറ്റം’ എന്നു നൽകുകയും മൂലത്തിലെ ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְכֹל אֲשֶׁר אַתָּה רֹאֶה לִי הוּא
  choice: നീ കാണുന്നതെല്ലാം എന്റേതാണ്
  rationale: ലാബാന്റെ സമഗ്രമായ ഉടമസ്ഥാവകാശവാദം ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
- source_word: מָה אֶעֱשֶׂה ... הַיּוֹם
  choice: ഇന്ന് ... എനിക്ക് എന്തു ചെയ്യാനാകും?
  rationale: സന്ദർഭത്തിലെ പ്രായോഗിക അസമർഥത സൂചിപ്പിക്കുന്ന ആലങ്കാരിക ചോദ്യവും സമയസൂചനയും സ്വാഭാവികമായി പകരുന്നു.
- source_word: אוֹ לִבְנֵיהֶן אֲשֶׁר יָלָדוּ
  choice: അവർ പ്രസവിച്ച മക്കളോടോ
  rationale: בְּנֵיהֶן ഇവിടെ സന്തതികളെ പൊതുവായി സൂചിപ്പിക്കാവുന്നതിനാൽ ‘മക്കൾ’ എന്നു നൽകി; ילד എന്ന ക്രിയയിലെ മാതൃജനന ഊന്നൽ ‘പ്രസവിച്ച’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ലാബാന്റെ ആവർത്തിച്ചുള്ള അവകാശവാദങ്ങൾ മൂലപാഠത്തോട് ചേർന്ന് നിലനിർത്തിയപ്പോൾ, וַיַּעַן וַיֹּאמֶר എന്ന സൂത്രവാക്യം മലയാളത്തിൽ കൃത്രിമമാകാതിരിക്കാൻ ‘മറുപടി പറഞ്ഞു’ എന്നു സ്വാഭാവികമാക്കി.
