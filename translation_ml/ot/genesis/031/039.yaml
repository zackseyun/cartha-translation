  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: טְרֵפָה֙ לֹא הֵבֵ֣אתִי אֵלֶ֔י/ךָ אָנֹכִ֣י אֲחַטֶּ֔/נָּה מִ/יָּדִ֖/י תְּבַקְשֶׁ֑/נָּה גְּנֻֽבְתִ֣י י֔וֹם וּ/גְנֻֽבְתִ֖י לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/039.yaml
  text: I did not bring to you an animal torn by beasts[a]; I myself bore the loss of it. You required it from my hand[b], whether stolen by day or stolen by night.
translation:
  language: ml
  text: കാട്ടുമൃഗം കീറിക്കൊന്ന ഒരു മൃഗത്തെയും ഞാൻ നിന്റെ അടുക്കൽ കൊണ്ടുവന്നില്ല; അതിന്റെ ഉത്തരവാദിത്വം ഞാൻതന്നെ ഏറ്റെടുത്തു.[a] പകൽ മോഷണം പോയതും രാത്രി മോഷണം പോയതും നീ എന്നോടു കണക്ക് ചോദിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിനു നഷ്ടപരിഹാരം നൽകിയത് ഞാൻതന്നെയായിരുന്നു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയ നഷ്ടത്തിന്റെ ബാധ്യത ഏറ്റെടുക്കുകയോ നഷ്ടം നികത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായപാഠം കൂടുതൽ പദാനുപദമായി: “എന്റെ കൈയിൽനിന്ന് നീ അതിനെ ആവശ്യപ്പെട്ടു—പകൽ മോഷണം പോയതും രാത്രി മോഷണം പോയതും.” മോഷണം പോയ മൃഗങ്ങളുടെ ഉത്തരവാദിത്വം യാക്കോബിന്മേൽ ചുമത്തിയെന്നതാണ് ആശയം.'
    reason: source_idiom
lexical_decisions:
- source_word: טְרֵפָה
  choice: കാട്ടുമൃഗം കടിച്ചുകീറിയ ഒരു മൃഗം
  rationale: ഇടയജീവിതത്തിന്റെ പശ്ചാത്തലത്തിൽ, വന്യമൃഗം ആക്രമിച്ചുകൊന്ന കന്നുകാലിയെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ആശയം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കാൻ പരാമർശിക്കപ്പെടുന്ന മൃഗത്തെ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: הֵבֵאתִי אֵלֶיךָ
  choice: ഞാൻ നിന്റെ അടുക്കൽ കൊണ്ടുവന്നില്ല
  rationale: ביא + אל എന്ന ഘടനയിലെ ‘ഒരാളുടെ അടുക്കൽ കൊണ്ടുവരുക’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אָנֹכִי
  choice: ഞാൻതന്നെ
  rationale: സ്വതന്ത്ര സർവനാമം നൽകുന്ന ഊന്നൽ മലയാളത്തിലെ ‘തന്നെ’കൊണ്ട് സംരക്ഷിക്കുന്നു.
- source_word: אֲחַטֶּנָּה
  choice: അതിന്റെ നഷ്ടം വഹിച്ചു
  rationale: ഇവിടെ חטא എന്ന ക്രിയ നഷ്ടത്തിന്റെ ഉത്തരവാദിത്വം ഏറ്റെടുക്കുകയോ നഷ്ടം നികത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠം ഉത്തരവാദിത്വത്തിന്റെ വിശാലമായ ആശയം നിലനിർത്തുന്നു.
- source_word: מִיָּדִי תְּבַקְשֶׁנָּה
  choice: നീ എന്നിൽനിന്ന് ഈടാക്കി
  rationale: ‘കൈയിൽനിന്ന് അന്വേഷിക്കുക/ആവശ്യപ്പെടുക’ എന്ന എബ്രായ പ്രയോഗം വ്യക്തിപരമായ ഉത്തരവാദിത്വം ചുമത്തി നഷ്ടം ഈടാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. പദാനുപദമായ ‘എന്റെ കൈയിൽനിന്ന്’ എന്നത് മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ അർഥം സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה
  choice: പകൽ മോഷണംപോയതിന്റെയും രാത്രി മോഷണംപോയതിന്റെയും
  rationale: ו എന്ന സംയോജകം ചേർക്കുന്ന ഇരുവിഭാഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന വിധത്തിൽ ‘-തിന്റെയും ... -തിന്റെയും’ എന്ന സമാന്തര ഘടന ഉപയോഗിച്ചു; കീറിക്കൊല്ലപ്പെട്ട മൃഗവുമായി മോഷണംപോയ മൃഗങ്ങളെ തെറ്റായി ഒന്നാക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ഇടയജീവിതത്തിന്റെ പശ്ചാത്തലം വ്യക്തമാക്കാൻ ‘കാട്ടുമൃഗം കടിച്ചുകീറിയ ഒരു മൃഗം’ എന്നു പറഞ്ഞു. ഉത്തരവാദിത്വം സൂചിപ്പിക്കുന്ന എബ്രായ ‘കൈ’ പ്രയോഗം പദാനുപദമായി ഇറക്കാതെ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘എന്നിൽനിന്ന് ഈടാക്കി’ എന്നു പരിഭാഷപ്പെടുത്തി. പകലും രാത്രിയും മോഷണംപോയ മൃഗങ്ങൾ രണ്ടും ഉൾപ്പെടുന്ന കൂട്ടിച്ചേർക്കൽ ഘടന സംരക്ഷിച്ചു.
