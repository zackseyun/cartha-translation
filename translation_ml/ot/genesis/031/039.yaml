  to: കാട്ടുമൃഗം കീറിക്കൊന്ന ഒരു മൃഗത്തെയും ഞാൻ നിന്റെ അടുക്കൽ കൊണ്ടുവന്നില്ല; അതിന്റെ ഉത്തരവാദിത്വം ഞാൻതന്നെ ഏറ്റെടുത്തു.[a] പകൽ മോഷണം പോയതും രാത്രി മോഷണം പോയതും നീ എന്നോടു കണക്ക് ചോദിച്ചു.[b]
