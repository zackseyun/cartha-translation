source:
  edition: WLC
  text: וַ/יָּבֹ֨א לָבָ֜ן בְּ/אֹ֥הֶל יַעֲקֹ֣ב וּ/בְ/אֹ֣הֶל לֵאָ֗ה וּ/בְ/אֹ֛הֶל שְׁתֵּ֥י הָ/אֲמָהֹ֖ת וְ/לֹ֣א מָצָ֑א וַ/יֵּצֵא֙ מֵ/אֹ֣הֶל לֵאָ֔ה וַ/יָּבֹ֖א בְּ/אֹ֥הֶל רָחֵֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/033.yaml
  text: So Laban went into Jacob’s tent[a], and into Leah’s tent, and into the tent of the two female servants, but he did not find them. Then he came out of Leah’s tent and went into Rachel’s tent.
translation:
  language: ml
  text: അങ്ങനെ ലാബാൻ യാക്കോബിന്റെ കൂടാരത്തിലും ലേയയുടെ കൂടാരത്തിലും ആ രണ്ടു ദാസിമാരുടെ കൂടാരത്തിലും ചെന്നു; എന്നാൽ അവയെ കണ്ടെത്തിയില്ല.[a] പിന്നെ അവൻ ലേയയുടെ കൂടാരത്തിൽനിന്ന് പുറത്തുവന്ന് റാഹേലിന്റെ കൂടാരത്തിൽ ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ ‘കണ്ടെത്തിയില്ല’ എന്നു മാത്രമാണ്; എന്താണ് കണ്ടെത്താതിരുന്നതെന്ന് ഈ വാക്യത്തിൽ പ്രസ്താവിക്കുന്നില്ല. സന്ദർഭത്തിൽ അത് ലാബാൻ തിരഞ്ഞുകൊണ്ടിരുന്ന ഗൃഹദേവന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... בְּאֹהֶל
  choice: കൂടാരത്തിൽ ചെന്നു
  rationale: בוא എന്ന ചലനക്രിയയും בְּ എന്ന സ്ഥലസൂചകവും ചേർന്ന് ഒരു കൂടാരത്തിനകത്തേക്കുള്ള പ്രവേശനം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കൂടാരത്തിൽ ചെന്നു’ സ്വാഭാവികമായി ആ ചലനം നിലനിർത്തുന്നു.
- source_word: אֹהֶל
  choice: കൂടാരം
  rationale: പിതൃകാല പശ്ചാത്തലത്തിലെ മൂർത്തമായ ‘tent’ എന്ന സാധാരണ അർഥം പൊതുവായ ‘വാസസ്ഥലം’ എന്നു മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: שְׁתֵּי הָאֲמָהֹת
  choice: ദാസിമാരായ ആ രണ്ടുപേർ
  rationale: אָמָה സ്ത്രീദാസിയെ സൂചിപ്പിക്കുന്നു. ‘ദാസിമാർ’ ആ കാലത്തെ ആശ്രിത ഗൃഹസേവകരെന്ന നില വ്യക്തമാക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളമാണ്; സംഖ്യയും നിർദിഷ്ടതയും ‘ആ രണ്ടുപേർ’ വഴി നിലനിർത്തുന്നു.
- source_word: וְלֹא מָצָא
  choice: എന്നാൽ അവയെ കണ്ടെത്തിയില്ല
  rationale: ഹീബ്രുവിൽ കർമം പ്രസ്താവിച്ചിട്ടില്ല; സന്ദർഭത്തിൽ തിരയുന്നത് ഗൃഹദേവന്മാരെയാണ്. വ്യക്തതയ്ക്കായി ‘അവയെ’ ചേർക്കുമ്പോഴും അടിക്കുറിപ്പിലൂടെ മൂലത്തിലെ അപ്രസ്താവിതത്വം അറിയിക്കുന്നു. ‘എന്നാൽ’ തിരച്ചിലിനും പരാജയത്തിനുമിടയിലെ വിരുദ്ധബന്ധം നൽകുന്നു.
- source_word: וַיֵּצֵא מֵאֹהֶל לֵאָה
  choice: പിന്നെ അവൻ ലേയയുടെ കൂടാരത്തിൽനിന്ന് ഇറങ്ങി
  rationale: יצא പുറത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു. ‘ഇറങ്ങി’ കൂടാരത്തിൽനിന്ന് പുറത്തുവന്നതിനെ മലയാള കഥനത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘പിന്നെ’ തുടർച്ചയായ സംഭവക്രമം സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּבֹא בְּאֹהֶל רָחֵל
  choice: റാഹേലിന്റെ കൂടാരത്തിൽ ചെന്നു
  rationale: ആദ്യഭാഗത്തിലെ അതേ ചലനക്രിയയുടെ ആവർത്തനം നിലനിർത്തി തിരച്ചിലിന്റെ ക്രമം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: וְלֹא מָצָא എന്നതിലെ അപ്രസ്താവിത കർമം
  choice: പ്രധാനവാചകത്തിൽ ‘അവയെ’ എന്നു ചേർത്ത്, അതു സന്ദർഭത്തിലെ ഗൃഹദേവന്മാരെ സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു
  alternative: ‘ഒന്നും കണ്ടെത്തിയില്ല’ എന്നോ കർമമില്ലാതെ ‘കണ്ടെത്തിയില്ല’ എന്നോ പരിഭാഷപ്പെടുത്തുക
  rationale: മലയാളത്തിൽ വാക്യം സ്വാഭാവികവും സന്ദർഭം വ്യക്തവുമാക്കുന്നു; അതേസമയം ഹീബ്രു വാക്യം കർമം തുറന്നു പറയുന്നില്ലെന്ന യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പ് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ആവർത്തിച്ചുള്ള കൂടാരതിരച്ചിലിന്റെ ഘട്ടക്രമം സംരക്ഷിച്ചിരിക്കുന്നു; വ്യക്തിനാമങ്ങൾ സാധാരണ മലയാള ബൈബിൾ രൂപങ്ങളായ ലാബാൻ, യാക്കോബ്, ലേയ, റാഹേൽ എന്നിങ്ങനെ നൽകിയിരിക്കുന്നു.
