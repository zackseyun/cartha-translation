  rationale: ‘ഞാൻ ആയിരുന്നു’ എന്ന ക്രിയ യാക്കോബിന്റെ അവസ്ഥാവിവരണം ആരംഭിക്കുന്നു. എന്നാൽ മലയാളത്തിൽ അത് പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ പകലും രാത്രിയും അനുഭവിച്ച കഷ്ടതകൾ നേരിട്ട് പറയുന്നതാണ് സ്വാഭാവികം; അതിന്റെ ആശയം വാക്യഘടനയിൽ നിലനിൽക്കുന്നു.
- source_word: בַיּוֹם
  choice: പകൽ
  rationale: പകൽസമയത്തെ സൂചിപ്പിക്കുന്ന കാലപ്രയോഗം; ‘രാത്രി’ എന്നതുമായുള്ള സമാന്തരവിരുദ്ധത സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אֲכָלַנִי
  choice: എന്നെ വിഴുങ്ങി
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്നെ തിന്നു’ എന്ന ശക്തമായ രൂപകം. കഠിനമായ കാലാവസ്ഥ തന്നെ ക്ഷയിപ്പിച്ചുവെന്ന ആശയം ‘വിഴുങ്ങി’ സ്വാഭാവികവും ദൃശ്യവുമായ രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: חֹרֶב
  choice: ചൂട്
  rationale: രാത്രിയിലെ മഞ്ഞിനോടു വിരുദ്ധമായി ഇവിടെ പകൽ നേരത്തെ വരണ്ട, കഠിനമായ ചൂടാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: וְקֶרַח
  choice: രാത്രി മഞ്ഞും
  rationale: קֶרַח മഞ്ഞ്, ഉറഞ്ഞ തണുപ്പ്, ഐസ് എന്നിവയെ സൂചിപ്പിക്കാം. രാത്രിയിലെ കഠിനശൈത്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘മഞ്ഞ്’ തെരഞ്ഞെടുത്തു; മുൻക്രിയയായ ‘വിഴുങ്ങി’ സമാന്തരമായി അധ്യാഹരിക്കുന്നു.
- source_word: בַּלָּיְלָה
  choice: രാത്രി
  rationale: ‘പകൽ’ എന്നതിന്റെ കാലപരമായ സമാന്തരപദമായി സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: וַתִּדַּד
  choice: ഓടിപ്പോയി
  rationale: അപൂർവമായ ഈ ക്രിയ അകന്നുപോകുക, ഓടിപ്പോകുക എന്ന ആശയം നൽകുന്നു. ഉറക്കത്തെ വ്യക്തിവൽക്കരിക്കുന്ന എബ്രായപ്രയോഗം ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: שְׁנָתִי
  choice: ഉറക്കം
  rationale: ഉറങ്ങുന്ന അവസ്ഥയെ ലളിതവും ആധുനികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഉടമസ്ഥത ‘എന്റെ കണ്ണുകളിൽനിന്ന്’ എന്ന പ്രയോഗത്തിലൂടെ സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: מֵעֵינָי
  choice: എന്റെ കണ്ണുകളിൽനിന്ന്
  rationale: ഉറക്കമില്ലായ്മയെ സൂചിപ്പിക്കുന്ന എബ്രായ ദൃശ്യപ്രയോഗം അതേപടി മനസ്സിലാകുന്ന മലയാളത്തിൽ നിലനിർത്തുന്നു.
