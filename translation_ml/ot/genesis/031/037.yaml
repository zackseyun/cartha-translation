source:
  edition: WLC
  text: כִּֽי מִשַּׁ֣שְׁתָּ אֶת כָּל כֵּלַ֗/י מַה מָּצָ֨אתָ֙ מִ/כֹּ֣ל כְּלֵי בֵיתֶ֔/ךָ שִׂ֣ים כֹּ֔ה נֶ֥גֶד אַחַ֖/י וְ/אַחֶ֑י/ךָ וְ/יוֹכִ֖יחוּ בֵּ֥ין שְׁנֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/037.yaml
  text: Since you have searched through all my goods[a], what have you found of all the goods of your house? Set it here before my brothers and your brothers[b], and let them judge between the two of us.
translation:
  language: ml
  text: നീ എന്റെ സാധനങ്ങളെല്ലാം തപ്പിപ്പരിശോധിച്ചല്ലോ; നിന്റെ വീട്ടിലെ സാധനങ്ങളിൽനിന്ന് എന്താണു നീ കണ്ടെത്തിയത്? അത് ഇവിടെ എന്റെ സഹോദരന്മാരുടെയും നിന്റെ സഹോദരന്മാരുടെയും മുമ്പിൽ വെക്കുക; അവർ നമുക്കിരുവർക്കുമിടയിൽ വിധിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ നമുക്കിരുവർക്കുമിടയിലെ തർക്കം തീർപ്പാക്കട്ടെ.” എബ്രായ ക്രിയയ്ക്ക് ന്യായവിധി നടത്തുക, തീരുമാനിക്കുക, മധ്യസ്ഥതയിലൂടെ തീർപ്പാക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשַּׁשְׁתָּ
  choice: തപ്പിപ്പരിശോധിച്ചല്ലോ
  rationale: ഈ ക്രിയയുടെ അടിസ്ഥാനാർഥമായ തൊട്ടോ തപ്പിയോ നോക്കുക എന്ന ഭാവവും, മോഷ്ടിക്കപ്പെട്ട വസ്തു കണ്ടെത്താൻ സമഗ്രമായി പരിശോധിക്കുക എന്ന സന്ദർഭാർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: כָּל כֵּלַי
  choice: എന്റെ സാധനങ്ങളെല്ലാം
  rationale: כְּלִי ഇവിടെ പാത്രങ്ങൾ മാത്രമല്ല, കൊണ്ടുപോകാവുന്ന വസ്തുക്കളെയും സ്വത്തുക്കളെയും പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘സാധനങ്ങൾ’ ഈ ഗൃഹസ്വത്ത്-സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: מִכֹּל כְּלֵי בֵיתֶךָ
  choice: നിന്റെ വീട്ടിലെ സാധനങ്ങളിൽപ്പെട്ട
  rationale: 'מִן എന്നതിന്റെ ഇവിടെ വരുന്ന ഭാഗസൂചകാർഥം വ്യക്തമാക്കുന്നു: യാക്കോബിന്റെ സാധനങ്ങൾക്കിടയിൽ ലാബാന്റെ വീട്ടിൽപ്പെട്ട ഏതു വസ്തുവാണ് കണ്ടെത്തിയതെന്ന ചോദ്യമാണിത്. ആദ്യപാദത്തിലെ כְּלִי എന്ന പദത്തിന്റെ ആവർത്തനവും ‘സാധനങ്ങൾ’ വഴി നിലനിർത്തുന്നു.'
- source_word: שִׂים כֹּה נֶגֶד
  choice: അത് ഇവിടെ ... മുമ്പിൽ വെക്കുക
  rationale: കണ്ടെത്തിയതായി അവകാശപ്പെടുന്ന വസ്തു സാക്ഷികളുടെ സന്നിധിയിൽ പരസ്യമായി ഹാജരാക്കാനുള്ള നേരിട്ടുള്ള ആജ്ഞ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אַחַי וְאַחֶיךָ
  choice: എന്റെ സഹോദരന്മാരുടെയും നിന്റെ സഹോദരന്മാരുടെയും
  rationale: സന്ദർഭത്തിൽ ഈ പദങ്ങൾ ബന്ധുക്കളെ ഉൾക്കൊള്ളാവുന്നതാണെങ്കിലും, എബ്രായത്തിലെ സാധാരണ കുടുംബബന്ധപദം വിവർത്തനത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְיוֹכִיחוּ
  choice: വിധിക്കട്ടെ
  rationale: ഈ തർക്കസന്ദർഭത്തിൽ יכח എന്ന ഹിഫിൽ ക്രിയയ്ക്കുള്ള ന്യായവിധി/തീർപ്പുനിർണയ അർഥം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; അതിലെ മധ്യസ്ഥതാ-തീരുമാന ഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בֵּין שְׁנֵינוּ
  choice: നമുക്കിരുവർക്കുമിടയിൽ
  rationale: ‘നമ്മൾ രണ്ടുപേർ’ എന്ന എബ്രായത്തിലെ വ്യക്തമായ ദ്വിപക്ഷ ഊന്നൽ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തപ്പിപ്പരിശോധിക്കുക’ എന്ന പ്രയോഗം മൂലക്രിയയിലെ സ്പർശിച്ചു തിരയുന്ന ദൃശ്യഭാവം നിലനിർത്തുമ്പോൾ, ‘വിധിക്കട്ടെ’ തർക്കത്തിന്റെ പൊതുവായ ന്യായനിർണയസന്ദർഭം വ്യക്തമാക്കുന്നു.
