- from: യാക്കോബ് ലാബാന്റെ മുഖഭാവം ശ്രദ്ധിച്ചു; ഇതാ, തന്നോടുള്ള അയാളുടെ സമീപനം മുമ്പത്തെപ്പോലെ ആയിരുന്നില്ല.[a]
  to: യാക്കോബ് ലാബാന്റെ മുഖഭാവം കണ്ടു; ഇതാ, യാക്കോബിനോടുള്ള ലാബാന്റെ മനോഭാവം മുമ്പത്തെപ്പോലെ ആയിരുന്നില്ല.[a]
  rationale: The revision uses the simple equivalent “കണ്ടു” for the Hebrew narrative verb, retains the visible ‘face/expression’ element with “മുഖഭാവം,” and makes the contextual meaning of the relational idiom explicit by naming Laban and Jacob. The footnote preserves the Hebrew idiom and explains its intended sense without imposing theological interpretation.
