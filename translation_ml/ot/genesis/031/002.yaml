source:
  edition: WLC
  text: וַ/יַּ֥רְא יַעֲקֹ֖ב אֶת פְּנֵ֣י לָבָ֑ן וְ/הִנֵּ֥ה אֵינֶ֛/נּוּ עִמּ֖/וֹ כִּ/תְמ֥וֹל שִׁלְשֽׁוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/002.yaml
  text: And Jacob saw Laban’s face[a], and behold[b], it was not toward him as before.
translation:
  language: ml
  text: യാക്കോബ് ലാബാന്റെ മുഖഭാവം കണ്ടു; ഇതാ, യാക്കോബിനോടുള്ള ലാബാന്റെ മനോഭാവം മുമ്പത്തെപ്പോലെ ആയിരുന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ, “അവൻ ഇന്നലെയും അതിന്റെ തലേദിവസവും അവനോടുകൂടെ ഉണ്ടായിരുന്നതുപോലെ ആയിരുന്നില്ല”; ലാബാന് യാക്കോബിനോടുണ്ടായിരുന്ന മനോഭാവം മാറിയെന്നർഥമുള്ള ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: ശ്രദ്ധിച്ചു
  rationale: ראה എന്ന സാധാരണ ദർശനക്രിയ ഇവിടെ മുഖഭാവത്തിലെ മാറ്റം തിരിച്ചറിയുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ശ്രദ്ധിച്ചു’ എന്നത് സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്, എന്നാൽ അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: פְּנֵי לָבָן
  choice: ലാബാന്റെ മുഖഭാവം
  rationale: പദശഃ ‘ലാബാന്റെ മുഖം’; ഇവിടെ മുഖത്ത് പ്രകടമായ മനോഭാവമാണ് ഉദ്ദേശ്യം. ‘മുഖഭാവം’ ഹീബ്രു ദൃശ്യബിംബം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: הִנֵּה തുടർന്നുവരുന്ന നിരീക്ഷണത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്നു; ‘ഇതാ’ അതിന്റെ ആഖ്യാനപരമായ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: אֵינֶנּוּ עִמּוֹ
  choice: തന്നോടുള്ള അയാളുടെ സമീപനം ... ആയിരുന്നില്ല
  rationale: പദശഃ ‘അവൻ അവനോടുകൂടെ ആയിരുന്നില്ല.’ മുൻപുള്ള ‘ലാബാന്റെ മുഖം’ സൂചിപ്പിക്കുന്ന മനോഭാവമാറ്റം മലയാളത്തിൽ അവ്യക്തതയില്ലാതെ പ്രകടിപ്പിക്കാൻ ബന്ധപരമായ അർഥം സ്വാഭാവികമായി നൽകി.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: മുമ്പത്തെപ്പോലെ
  rationale: പദശഃ ‘ഇന്നലെയും അതിനുമുമ്പും ഉണ്ടായിരുന്നതുപോലെ’; മുൻകാലത്തെ പതിവായ അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗത്തിന് ‘മുമ്പത്തെപ്പോലെ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
