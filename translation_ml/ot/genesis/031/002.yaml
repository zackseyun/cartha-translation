translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രുവിലെ ‘മുഖം’ എന്ന ദൃശ്യബിംബം ‘മുഖഭാവം’ ആയി നിലനിർത്തുകയും ബന്ധപരമായ പ്രയോഗത്തിന്റെ അർഥം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമാക്കുകയും ചെയ്തു.
