review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the emphatic plural address, the content clause, Jacob's total exertion, and the sense of עָבַד as serving/working for Laban. However, «സർവശക്തി» conventionally denotes absolute/omnipotent power and is not an appropriate rendering of כָּל־כֹּחִי in this labor context.
  naturalness: The proposed revision uses idiomatic modern standard Malayalam. «എന്റെ മുഴുവൻ ശക്തിയോടെ» clearly expresses wholehearted physical effort without the theological or elevated connotation of «സർവശക്തി».
  terminology: «പിതാവിനെ» is a neutral standard-register term appropriate to the narrative. «സേവിച്ചിട്ടുണ്ട്» retains the relational sense of the Hebrew verb; the footnote responsibly supplies the viable labor-related alternative.
  issues:
  - severity: medium
    issue: «എന്റെ സർവശക്തിയോടുംകൂടെ» is semantically unsuitable and stylistically cumbersome.
    rationale: «സർവശക്തി» normally means omnipotence, whereas Hebrew כֹּחַ here refers to Jacob's full personal strength/capacity in labor. The compound postposition in «ശക്തിയോടുംകൂടെ» is also unnecessarily heavy.
  revised_text: നിങ്ങളുടെ പിതാവിനെ എന്റെ മുഴുവൻ ശക്തിയോടെ ഞാൻ സേവിച്ചിട്ടുണ്ടെന്ന് നിങ്ങൾക്കുതന്നെ അറിയാമല്ലോ.[a]
