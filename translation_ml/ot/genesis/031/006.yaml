translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. റാഹേലിനെയും ലേയയെയും അഭിസംബോധന ചെയ്യുന്ന ബഹുവചനവും സർവനാമത്തിലെ ഊന്നലും സംരക്ഷിച്ചിട്ടുണ്ട്.
