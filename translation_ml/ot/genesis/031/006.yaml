source:
  edition: WLC
  text: וְ/אַתֵּ֖נָה יְדַעְתֶּ֑ן כִּ֚י בְּ/כָל כֹּחִ֔/י עָבַ֖דְתִּי אֶת אֲבִי/כֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/006.yaml
  text: And you yourselves know that I have served your father with all my strength[a].
translation:
  language: ml
  text: നിങ്ങളുടെ പിതാവിനെ എന്റെ മുഴുവൻ ശക്തിയോടെ ഞാൻ സേവിച്ചിട്ടുണ്ടെന്ന് നിങ്ങൾക്കുതന്നെ അറിയാമല്ലോ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ പിതാവിനുവേണ്ടി ഞാൻ വേല ചെയ്തിട്ടുണ്ടെന്ന്.’ എബ്രായ ക്രിയയ്ക്ക് ‘സേവിക്കുക’ എന്നും ‘വേല ചെയ്യുക’ എന്നും അർഥമാകാം; ലാബാനുവേണ്ടി യാക്കോബ് അധ്വാനിച്ച വർഷങ്ങളുടെ സന്ദർഭത്തിൽ രണ്ടും യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֵּנָה
  choice: നിങ്ങൾക്കുതന്നെ
  rationale: സ്വതന്ത്രമായ രണ്ടാംപുരുഷ സ്ത്രീലിംഗ ബഹുവചന സർവനാമം നൽകുന്ന ഊന്നൽ ‘തന്നെ’കൊണ്ട് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു. വാക്യബന്ധകമായ וְ മലയാളത്തിലെ പ്രവാഹത്തിൽ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ വിടുന്നത് സ്വാഭാവികമാണ്.
- source_word: יְדַעְתֶּן
  choice: അറിയാമല്ലോ
  rationale: മുൻപ് നേടിയ അറിവിൽനിന്നുള്ള ഇപ്പോഴത്തെ ബോധാവസ്ഥയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്. ‘അറിയാമല്ലോ’ അറിവിനോടൊപ്പം യാക്കോബ് റാഹേലിന്റെയും ലേയയുടെയും സാക്ഷ്യത്തെ അഭ്യർഥിക്കുന്ന ഭാവവും നൽകുന്നു.
- source_word: כִּי
  choice: എന്ന്
  rationale: അവർ അറിയുന്ന കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ഉദ്ധരണിപൂരകമായ ‘എന്ന്’ യോജിക്കുന്നു.
- source_word: בְּ/כָל כֹּחִי
  choice: എന്റെ സർവശക്തിയോടുംകൂടെ
  rationale: כֹּחַ ഇവിടെ അധ്വാനത്തിനായി വിനിയോഗിച്ച മുഴുവൻ ശക്തിയെയോ ശേഷിയെയോ സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം സമ്പൂർണമായ പ്രയത്നം നിലനിർത്തുന്നു.
- source_word: עָבַדְתִּי
  choice: സേവിച്ചിട്ടുണ്ടെന്ന്
  rationale: עבד എന്നതിന് ‘സേവിക്കുക’, ‘വേല ചെയ്യുക’ എന്നീ അർഥങ്ങളുണ്ട്. വ്യക്തിയെ നേരിട്ടുള്ള കർമമായി സ്വീകരിക്കുന്ന ഘടനയിൽ ‘സേവിക്കുക’ ബന്ധപരമായ അർഥം കാത്തുസൂക്ഷിക്കുന്നു; ദീർഘകാല വേലയുടെ അർഥവും സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: אֶת אֲבִיכֶן
  choice: നിങ്ങളുടെ അപ്പനെ
  rationale: സ്ത്രീലിംഗ ബഹുവചന ഉടമസ്ഥപ്രത്യയം റാഹേലിനെയും ലേയയെയും അഭിസംബോധന ചെയ്യുന്നു. നേരിട്ടുള്ള കർമചിഹ്നം മലയാളത്തിലെ ‘-നെ’ വിഭക്തിയിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
