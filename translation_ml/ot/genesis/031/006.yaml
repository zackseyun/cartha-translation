  to: നിങ്ങളുടെ പിതാവിനെ എന്റെ മുഴുവൻ ശക്തിയോടെ ഞാൻ സേവിച്ചിട്ടുണ്ടെന്ന് നിങ്ങൾക്കുതന്നെ അറിയാമല്ലോ.[a]
