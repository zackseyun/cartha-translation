- from: അവൻ തന്റെ ബന്ധുക്കളെ[a] കൂടെ കൂട്ടിക്കൊണ്ട്, ഏഴു ദിവസത്തെ വഴിയോളം അവനെ പിന്തുടർന്നു; ഗിലെയാദിലെ മലനാട്ടിൽ[c] അവന്റെ അടുത്തെത്തി[b].
  to: അവൻ തന്റെ ബന്ധുക്കളെ[a] കൂട്ടിക്കൊണ്ട്, ഏഴു ദിവസത്തെ യാത്രാദൂരം അവനെ പിന്തുടർന്നു; ഗിലെയാദിലെ മലനാട്ടിൽ[c] അവനോടൊപ്പമെത്തി[b].
