source:
  edition: WLC
  text: וַ/יִּקַּ֤ח אֶת אֶחָי/ו֙ עִמּ֔/וֹ וַ/יִּרְדֹּ֣ף אַחֲרָ֔י/ו דֶּ֖רֶךְ שִׁבְעַ֣ת יָמִ֑ים וַ/יַּדְבֵּ֥ק אֹת֖/וֹ בְּ/הַ֥ר הַ/גִּלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/023.yaml
  text: And he took his kinsmen with him[a], and pursued him for a journey of seven days[d][c][b], and caught up with him in the hill country of Gilead.
translation:
  language: ml
  text: അവൻ തന്റെ ബന്ധുക്കളെ[a] കൂട്ടിക്കൊണ്ട്, ഏഴു ദിവസത്തെ യാത്രാദൂരം അവനെ പിന്തുടർന്നു; ഗിലെയാദിലെ മലനാട്ടിൽ[c] അവനോടൊപ്പമെത്തി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സഹോദരന്മാരെ’; എബ്രായപദം ചുരുങ്ങിയ അർഥത്തിൽ സഹോദരന്മാരെയും വിശാലമായ അർഥത്തിൽ ബന്ധുക്കളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവനെ മറികടന്നു’ അല്ലെങ്കിൽ ‘അവന്റെ അടുത്തെത്തി’.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘ഗിലെയാദ് മലയിൽ’; എബ്രായപ്രയോഗം ഒരു പ്രത്യേക മലയെയോ ഗിലെയാദിലെ മലനാടിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: തന്റെ ബന്ധുക്കളെ
  rationale: אָח എന്ന പദം ചുരുങ്ങിയ അർഥത്തിൽ ‘സഹോദരന്മാർ’ എന്നും വിശാലമായി ഒരേ കുടുംബവംശത്തിലെ ബന്ധുക്കൾ എന്നും വരാം. ഇവിടെ ലാബാൻ യാക്കോബിനെ പിന്തുടരാൻ തന്റെ കുലത്തിൽപ്പെട്ടവരെ കൂട്ടുന്നതുകൊണ്ട് ‘ബന്ധുക്കൾ’ സന്ദർഭത്തിന് യോജിക്കുന്നു; ചുരുങ്ങിയ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: അവനെ പിന്തുടർന്നു
  rationale: רדף אַחַר എന്നത് പിന്നാലെ ചെല്ലുക/പിന്തുടരുക എന്ന ആശയം നൽകുന്നു. ആധുനിക മലയാളത്തിൽ ‘അവനെ പിന്തുടർന്നു’ സ്വാഭാവികവും മൂലപദഘടനയുടെ അർഥം പൂർണമായി നൽകുന്നതുമാണ്.
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസത്തെ വഴിയോളം
  rationale: דֶּרֶךְ ഇവിടെ യാത്രയുടെ ദൂരം അഥവാ വ്യാപ്തി സൂചിപ്പിക്കുന്നു. ‘ഏഴു ദിവസം’ എന്നു മാത്രം പറയാതെ, ഏഴു ദിവസത്തെ യാത്രാദൂരം എന്ന സൂക്ഷ്മത ‘വഴിയോളം’ നിലനിർത്തുന്നു.
- source_word: וַיַּדְבֵּק אֹתוֹ
  choice: അവന്റെ അടുത്തെത്തി
  rationale: דבק ഈ പിന്തുടരൽസന്ദർഭത്തിൽ ഒരാളെ പിന്തുടർന്ന് അടുത്തെത്തുക/ഒപ്പമെത്തുക എന്നർഥം നൽകുന്നു. ‘അടുത്തെത്തി’ എന്നത് പിടികൂടിയെന്നോ മറികടന്നെന്നോ അനാവശ്യമായി നിർണ്ണയിക്കാതെ സംഭവത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּהַר הַגִּלְעָד
  choice: ഗിലെയാദിലെ മലനാട്ടിൽ
  rationale: הַר എന്നതിന് ഒരു പ്രത്യേക മല എന്നും മലയോരപ്രദേശം എന്നും അർഥമാകാം. സന്ദർഭത്തിൽ പ്രാദേശിക അർഥം സാധ്യതയുള്ളതിനാൽ ‘മലനാട്’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; ‘ഗിലെയാദ് മല’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. തുടർച്ചയായ എബ്രായ വാവ്-ഘടന മലയാളത്തിൽ ഭാരമാകാതിരിക്കാൻ ക്രിയകൾ കോമയും അർധവിരാമവും ഉപയോഗിച്ച് ബന്ധിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
