  yaml_path: translation/ot/genesis/031/017.yaml
  text: Then Jacob arose and put his sons and his wives on the camels[a].
translation:
  language: ml
  text: അപ്പോൾ യാക്കോബ് എഴുന്നേറ്റ് തന്റെ പുത്രന്മാരെയും ഭാര്യമാരെയും ഒട്ടകങ്ങളുടെ പുറത്ത് കയറ്റി.[a]
  philosophy: optimal-equivalence
  footnotes:
