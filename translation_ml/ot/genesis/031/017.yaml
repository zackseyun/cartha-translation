    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ ആഖ്യാനക്രമം മുന്നോട്ടുകൊണ്ടുപോകുന്ന രൂപം; പ്രവർത്തിക്കാൻ എഴുന്നേൽക്കുക എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּשָּׂא
  choice: കയറ്റി
  rationale: പദശഃ ‘ഉയർത്തി/വഹിച്ചു’ എന്നാകാമെങ്കിലും, ഒട്ടകങ്ങളോടു ചേർന്ന ഈ സന്ദർഭത്തിൽ മറ്റുള്ളവരെ അവയുടെ പുറത്തിരുത്തുന്ന പ്രവർത്തിയാണ് സൂചിപ്പിക്കുന്നത്; ‘കയറ്റി’ മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בָּנָיו
  choice: തന്റെ പുത്രന്മാരെ
  rationale: ഹീബ്രുവിലെ പുല്ലിംഗ ബഹുവചനം കൃത്യമായി നിലനിർത്തുന്നു; ‘മക്കൾ’ എന്ന ലിംഗനിരപേക്ഷ രൂപത്തേക്കാൾ മൂലപാഠത്തോട് അടുത്തതാണ്.
- source_word: נָשָׁיו
  choice: ഭാര്യമാരെ
  rationale: യാക്കോബിനെ ഉടമസ്ഥസൂചകമായി ചേർത്തിരിക്കുന്ന אשה എന്ന നാമത്തിന്റെ ബഹുവചനം ഈ സന്ദർഭത്തിൽ അദ്ദേഹത്തിന്റെ ഭാര്യമാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: עַל הַגְּמַלִּים
  choice: ഒട്ടകപ്പുറത്ത്
  rationale: עַל എന്ന പൂർവപ്രത്യയം ഇവിടെ ‘കയറ്റി’ എന്ന ചലനസൂചക ക്രിയയോടൊപ്പം ഒട്ടകങ്ങളുടെ പുറത്തേക്ക്/പുറത്ത് ഇരുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഒട്ടകപ്പുറത്ത്’ സ്വാഭാവികമാണ്.
