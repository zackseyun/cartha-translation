source:
  edition: WLC
  text: הֲ/ל֧וֹא נָכְרִיּ֛וֹת נֶחְשַׁ֥בְנוּ ל֖/וֹ כִּ֣י מְכָרָ֑/נוּ וַ/יֹּ֥אכַל גַּם אָכ֖וֹל אֶת כַּסְפֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/015.yaml
  text: Are we not regarded by him as foreigners? For he has sold us and has indeed completely consumed our money[a].
translation:
  language: ml
  text: അവൻ ഞങ്ങളെ അന്യരായി കണക്കാക്കുന്നില്ലയോ? കാരണം, അവൻ ഞങ്ങളെ വിറ്റു; നമ്മുടെ പണം മുഴുവനും തിന്നുകളയുകയും ചെയ്തു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നമ്മുടെ വെള്ളി തീർത്തും തിന്നുകളഞ്ഞു.’ പണം മുഴുവനായി ചെലവഴിച്ചുകളഞ്ഞതിനെ സൂചിപ്പിക്കാൻ എബ്രായത്തിൽ ‘തിന്നുക’ എന്ന രൂപകവും ഊന്നൽ നൽകുന്ന ക്രിയാരൂപവും ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  choice: അല്ലേ
  rationale: സ്ഥിരീകരണാത്മകമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന എബ്രായ വാചാടോപചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: נָכְרִיּוֹת
  choice: അന്യരായി
  rationale: സ്വന്തം കുടുംബാംഗങ്ങളല്ലാത്ത പുറത്തുകാരെപ്പോലെ പിതാവ് തങ്ങളെ കാണുന്നു എന്ന പരാതിയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; സ്ത്രീലിംഗരൂപം മലയാളത്തിൽ വേറിട്ട് അടയാളപ്പെടുത്തേണ്ടതില്ല.
- source_word: נֶחְשַׁבְנוּ לוֹ
  choice: അവൻ ഞങ്ങളെ ... കണക്കാക്കുന്നത്
  rationale: നിഫാൽ രൂപത്തിലെ ‘കണക്കാക്കപ്പെടുക/കരുതപ്പെടുക’ എന്ന ആശയം സ്വാഭാവികമായ മലയാള കർത്തരിപ്രയോഗത്തിൽ അവതരിപ്പിക്കുന്നു; അവന്റെ നിലപാടാണ് ഊന്നൽ.
- source_word: כִּי
  choice: കാരണം സൂചിപ്പിക്കുന്ന തുടർച്ചയായി പ്രത്യേക ബന്ധകമില്ലാതെ
  rationale: രണ്ടാമത്തെ വാക്യം വാചാടോപചോദ്യത്തിനുള്ള തെളിവോ കാരണമോ നൽകുന്നു; മലയാളത്തിൽ നേരിട്ടുള്ള വാക്യത്തുടർച്ച ഈ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מְכָרָנוּ
  choice: അവൻ ഞങ്ങളെ വിറ്റു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയും അതിന്റെ ഇപ്പോഴുള്ള പ്രസക്തിയും ചുരുക്കവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: וַיֹּאכַל גַּם אָכוֹל
  choice: മുഴുവനായും തിന്നുകളയുകയും ചെയ്തു
  rationale: പരിമിതക്രിയയോടൊപ്പമുള്ള infinitive absolute നൽകുന്ന തീവ്രത ‘മുഴുവനായും’ വഴി പ്രകടമാക്കുകയും എബ്രായത്തിലെ ‘തിന്നുക’ എന്ന ശക്തമായ രൂപകം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֶת כַּסְפֵּנוּ
  choice: ഞങ്ങളുടെ പണം
  rationale: כֶּסֶף എന്നതിന് ‘വെള്ളി’ എന്നും അർഥമുണ്ടെങ്കിലും ഈ സാമ്പത്തിക സന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് ‘പണം’ കൂടുതൽ വ്യക്തമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാചാടോപചോദ്യം നിലനിർത്തി; പണത്തെ ‘തിന്നുക’ എന്ന മൂലഭാഷയിലെ രൂപകം പ്രധാനവാചകത്തിൽ സംരക്ഷിച്ചു, അതിന്റെ സാമ്പത്തിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
