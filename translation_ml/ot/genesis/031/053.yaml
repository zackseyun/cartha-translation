source:
  edition: WLC
  text: אֱלֹהֵ֨י אַבְרָהָ֜ם וֵֽ/אלֹהֵ֤י נָחוֹר֙ יִשְׁפְּט֣וּ בֵינֵ֔י/נוּ אֱלֹהֵ֖י אֲבִי/הֶ֑ם וַ/יִּשָּׁבַ֣ע יַעֲקֹ֔ב בְּ/פַ֖חַד אָבִ֥י/ו יִצְחָֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/053.yaml
  text: May the God of Abraham and the god of Nahor[a], the god of their father, judge between us[c][b]. And Jacob swore by the Fear of his father Isaac.
translation:
  language: ml
  text: അബ്രാഹാമിന്റെ ദൈവവും നാഹോരിന്റെ ദൈവവും—അവരുടെ പിതാവിന്റെ ദൈവം—നമുക്കിടയിൽ വിധിക്കട്ടെ.[a] യാക്കോബ് തന്റെ പിതാവായ യിസ്ഹാക്കിന്റെ ഭയത്തെച്ചൊല്ലി സത്യം ചെയ്തു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരുടെ പിതാവിന്റെ ദൈവം’ എന്നത് മുൻപുള്ള ആഹ്വാനങ്ങളെ ഒരേ ദൈവത്തെ സൂചിപ്പിക്കുന്നവയായി വിശദീകരിക്കുന്നതാകാം. അല്ലെങ്കിൽ ആവർത്തിച്ച ദൈവ-ആഹ്വാനങ്ങൾ വ്യത്യസ്തരായ ദൈവിക പരാമർശങ്ങളെ സൂചിപ്പിക്കുന്നതായും വായിക്കാം. ഹീബ്രുവിലെ ബഹുവചന ക്രിയ ഈ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘യിസ്ഹാക്കിന്റെ ഭയം’ എന്നത് അക്ഷരാർഥത്തിൽ ‘ഭയം’ അഥവാ ‘ഭീതി’ എന്ന നാമം ഉപയോഗിക്കുന്ന അസാധാരണമായ ദൈവവിശേഷണമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי אַבְרָהָם וֵאלֹהֵי נָחוֹר
  choice: അബ്രാഹാമിന്റെ ദൈവവും നാഹോരിന്റെ ദൈവവും
  rationale: രണ്ടു പിതൃനാമങ്ങളോടും ഒരേ ഹീബ്രു പദരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. മലയാളത്തിൽ അക്ഷരവലുപ്പംകൊണ്ട് വ്യത്യാസം സൂചിപ്പിക്കാനാകാത്തതിനാൽ, ദേവന്മാർ ഒരാളോ വ്യത്യസ്തരോ എന്നത് മുഖ്യവാചകത്തിൽ നിർണയിക്കാതെ നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי אֲבִיהֶם
  choice: അവരുടെ പിതാവിന്റെ ദൈവം
  rationale: മുൻപുള്ള ആഹ്വാനത്തെ വിശദീകരിക്കുന്ന സമാനാധികരണപ്രയോഗമോ പുനരുക്തപ്രയോഗമോ ആയി സ്വാഭാവികമായി നൽകുന്നു; അതിന്റെ കൃത്യബന്ധം വിരാമചിഹ്നവും അടിക്കുറിപ്പും വഴി തുറന്നുവയ്ക്കുന്നു.
- source_word: יִשְׁפְּטוּ בֵינֵינוּ
  choice: നമുക്കിടയിൽ വിധിക്കട്ടെ
  rationale: ബഹുവചന ക്രിയാരൂപം ആഹ്വാനത്തിലെ സംയുക്തമോ ബഹുവചനമോ ആയ കർത്താവിനോട് യോജിക്കുന്നു. ആശംസാത്മകമായ imperfect-നെ മലയാളത്തിലെ ‘വിധിക്കട്ടെ’ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וַיִּשָּׁבַע
  choice: സത്യം ചെയ്തു
  rationale: ആഖ്യാനത്തിലെ പൂർത്തിയായ പ്രവൃത്തി ലളിതവും നിലവാരമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּפַחַד אָבִיו יִצְחָק
  choice: തന്റെ പിതാവായ യിസ്ഹാക്കിന്റെ ഭയത്തെച്ചൊല്ലി
  rationale: פַחַד എന്ന ‘ഭയം/ഭീതി’ എന്ന അസാധാരണ ദൈവവിശേഷണം വ്യാഖ്യാനിച്ച് മിനുക്കാതെ നിലനിർത്തുന്നു; സത്യപ്രതിജ്ഞയുടെ ആധാരത്തെ ‘-ത്തെച്ചൊല്ലി’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിന്റെയും നാഹോരിന്റെയും ദൈവം ഒരേ ദൈവമാണോ വ്യത്യസ്ത ദേവന്മാരാണോ എന്ന് വിവർത്തനത്തിൽ നിർണയിക്കൽ
  choice: മുഖ്യവാചകത്തിൽ ഒരേ ‘ദൈവം’ എന്ന മലയാളപദം ഉപയോഗിച്ച് തിരിച്ചറിയൽ നിർണയിക്കാതെ വയ്ക്കുന്നു.
  alternative: ‘അബ്രാഹാമിന്റെ ദൈവവും നാഹോരിന്റെ ദേവനും’ എന്നു വേർതിരിക്കുക, അല്ലെങ്കിൽ എല്ലാം ഒരേ ദൈവമാണെന്ന് വ്യക്തമായി ചേർക്കുക.
  rationale: ഹീബ്രുവിലെ ആവർത്തിച്ച אֱלֹהֵי രൂപവും ബഹുവചന ക്രിയയും വ്യാഖ്യാനസാധ്യത തുറന്നുവയ്ക്കുന്നു. മലയാളത്തിൽ ഇംഗ്ലീഷിലെ capital/lowercase വ്യത്യാസത്തിന് തുല്യമായ സംവിധാനം ഇല്ല; അതിനാൽ കൃത്രിമമായ പദവ്യത്യാസം ഏർപ്പെടുത്താതെ അടിക്കുറിപ്പിൽ അനിശ്ചിതത്വം രേഖപ്പെടുത്തുന്നു.
- issue: פַחַד എന്ന പദത്തെ ദൈവനാമസദൃശമായ വിശേഷണമായി എങ്ങനെ നൽകണം
  choice: ‘യിസ്ഹാക്കിന്റെ ഭയം’ എന്ന അസാധാരണ പ്രയോഗം നിലനിർത്തുന്നു.
  alternative: ‘യിസ്ഹാക്ക് ഭയപ്പെട്ട ദൈവം’ അല്ലെങ്കിൽ ‘യിസ്ഹാക്കിന്റെ ഭയങ്കരനായവൻ’
  rationale: വ്യാഖ്യാനപരമായ പരാവർത്തനം ഒഴിവാക്കി മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ സവിശേഷതയും സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘യിസ്ഹാക്ക്’ എന്ന പരമ്പരാഗത മലയാള ബൈബിൾ നാമരൂപം നിലനിർത്തി. ഇംഗ്ലീഷിലെ വലിയക്ഷരം/ചെറിയക്ഷരം കൊണ്ടുള്ള ദൈവം–ദേവൻ വ്യത്യാസം മലയാളത്തിലേക്ക് നിർബന്ധിച്ച് ഇറക്കാതെ മൂലത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
