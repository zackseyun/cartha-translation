  to: അബ്രാഹാമിന്റെ ദൈവവും നാഹോരിന്റെ ദൈവവും—അവരുടെ പിതാവിന്റെ ദൈവം—നമുക്കിടയിൽ വിധിക്കട്ടെ.[a] യാക്കോബ് തന്റെ പിതാവായ യിസ്ഹാക്കിന്റെ ഭയത്തെച്ചൊല്ലി സത്യം ചെയ്തു.[b]
  rationale: അടിക്കുറിപ്പ് a-യുടെ വിശദീകരണം മാത്രം തിരുത്തി. ഇതിലൂടെ ‘അവരുടെ പിതാവിന്റെ ദൈവം’ എന്ന പ്രയോഗത്തെ ഒരു സ്വതന്ത്ര മൂന്നാമത്തെ പൂർവികദൈവമായി തെറ്റായി അവതരിപ്പിക്കാതെ, ഹീബ്രുപാഠത്തിലും ഇംഗ്ലീഷ് ഓഡിറ്റ് ട്രെയിലിലും അംഗീകരിച്ചിട്ടുള്ള തിരിച്ചറിയൽ-അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു. മുഖ്യവാചകത്തിനും അടിക്കുറിപ്പ് b-ക്കും സുരക്ഷിതമായ മാറ്റം ആവശ്യമില്ല.
