  yaml_path: translation/ot/genesis/031/021.yaml
  text: So he fled with all that was his[a], and he arose and crossed the River, and set his face toward the hill country of Gilead.
translation:
  language: ml
  text: അങ്ങനെ അവൻ തനിക്കുള്ള സകലവുമായി ഓടിപ്പോയി. അവൻ പുറപ്പെട്ട് നദി[a] കടന്ന് ഗിലെയാദിലെ മലനാടിന്റെ നേരെ മുഖം തിരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യൂഫ്രട്ടീസ് നദി’; എബ്രായപാഠത്തിൽ ‘നദി’ എന്നു മാത്രമാണുള്ളത്; ഇവിടെ അത് മിക്കവാറും യൂഫ്രട്ടീസിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: ഓടിപ്പോയി
  rationale: ക്രിയയ്ക്ക് ‘ഓടിപ്പോകുക/പലായനം ചെയ്യുക’ എന്ന അർഥമുണ്ട്; സമ്മർദത്തിനിടയിലെ രഹസ്യമായ പുറപ്പെടൽ സ്വാഭാവികമായ മലയാളത്തിൽ ഇതു നൽകുന്നു.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: തനിക്കുള്ള സകലവുമായി
  rationale: യാക്കോബിന്റെ കുടുംബാംഗങ്ങളെയും സമ്പത്തിനെയും ഉൾക്കൊള്ളാവുന്ന വിധത്തിൽ എബ്രായപ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: וַיָּקָם
  choice: പുറപ്പെട്ട്
  rationale: ആഖ്യാനത്തിൽ പുതിയ പ്രവർത്തനഘട്ടം ആരംഭിക്കുന്ന קום എന്ന ക്രിയയെ സന്ദർഭോചിതമായി അവതരിപ്പിക്കുന്നു; അക്ഷരാർഥമായ ‘എഴുന്നേറ്റു’ ഇവിടെ മലയാളത്തിൽ അനാവശ്യമായ ശരീരചലനമായി കേൾക്കാം.
- source_word: וַיַּעֲבֹר אֶת־הַנָּהָר
  choice: നദി കടന്ന്
  rationale: עבר എന്നതിന്റെ ‘കടക്കുക’ എന്ന അർഥവും നിർദിഷ്ടമായ ഒരു നദിയെ സൂചിപ്പിക്കുന്ന ഉപപദവും സംരക്ഷിക്കുന്നു.
- source_word: הַנָּהָר
  choice: നദി
  rationale: എബ്രായമൂലത്തിൽ നദിയുടെ പേര് പറയാത്തതിനാൽ പ്രധാനപാഠത്തിൽ ‘യൂഫ്രട്ടീസ്’ എന്നു വ്യക്തമാക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്തുന്നു; സാധ്യതയുള്ള തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיָּשֶׂם אֶת־פָּנָיו
  choice: നേരെ മുഖം തിരിച്ചു
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ബോധപൂർവമായ ദിശാബോധം സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയുടെ ദൃശ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַר הַגִּלְעָד
  choice: ഗിലെയാദിലെ മലനാട്
  rationale: הַר ഇവിടെ ഒറ്റമലയേക്കാൾ മലമ്പ്രദേശത്തെ സൂചിപ്പിക്കാം; ഭൂമിശാസ്ത്രപരമായ ഈ സാധ്യത മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
