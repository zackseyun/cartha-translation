  to: അപ്പോൾ ദൈവത്തിന്റെ ദൂതൻ ആ സ്വപ്നത്തിൽ എന്നോട്, “യാക്കോബേ,” എന്നു പറഞ്ഞു. ഞാൻ, “ഇതാ, ഞാൻ ഹാജരുണ്ട്,” എന്നു പറഞ്ഞു.
