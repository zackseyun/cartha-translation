id: GEN.31.11
reference: Genesis 31:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלַ֜/י מַלְאַ֧ךְ הָ/אֱלֹהִ֛ים בַּ/חֲל֖וֹם יַֽעֲקֹ֑ב וָ/אֹמַ֖ר הִנֵּֽנִ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/011.yaml
  text: Then the angel of God said to me in the dream[a], ‘Jacob,’ and I said, ‘Here I am.’
translation:
  language: ml
  text: അപ്പോൾ ദൈവത്തിന്റെ ദൂതൻ ആ സ്വപ്നത്തിൽ എന്നോട്, “യാക്കോബേ,” എന്നു പറഞ്ഞു. ഞാൻ, “ഇതാ, ഞാൻ ഹാജരുണ്ട്,” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വയ്യക്ഷേപക ക്രിയാരൂപം ആഖ്യാനത്തിന്റെ തുടർച്ച മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ ക്രമം വ്യക്തമാക്കുന്നു.
- source_word: אֵלַי
  choice: എന്നോട്
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ ഉപസർഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ ദൂതൻ
  rationale: മַלְאָךְ എന്നതിന് ‘ദൂതൻ/സന്ദേശവാഹകൻ’ എന്ന അർഥമുണ്ട്; ഈ സന്ദർഭത്തിൽ സ്വർഗീയ ദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാള ബൈബിൾ ഭാഷയിൽ ‘ദൈവത്തിന്റെ ദൂതൻ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בַּחֲלוֹם
  choice: സ്വപ്നത്തിൽ
  rationale: എബ്രായത്തിൽ നിർദ്ദിഷ്ട ഉപപദമുണ്ടെങ്കിലും, മലയാളത്തിൽ ‘ആ സ്വപ്നത്തിൽ’ എന്നു പറഞ്ഞാൽ മുമ്പ് പ്രത്യേകം പരാമർശിച്ച സ്വപ്നത്തെ സൂചിപ്പിക്കുന്നതായി അധികമായി തോന്നാം. ‘സ്വപ്നത്തിൽ’ രൂപവും ആശയവും സ്വാഭാവികമായി നിലനിർത്തുന്നു; നിർദ്ദിഷ്ടത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: יַעֲקֹב
  choice: യാക്കോബേ
  rationale: പേര് മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ ലിപ്യന്തരിച്ചു; നേരിട്ടുള്ള സംബോധന സൂചിപ്പിക്കാൻ ‘-േ’ ചേർത്തു.
- source_word: וָאֹמַר
  choice: ഞാൻ ... എന്നു പറഞ്ഞു
  rationale: ഒന്നാംപുരുഷ ആഖ്യാനപ്രതികരണം മലയാളത്തിൽ ലളിതവും നേരിട്ടുമായ ക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הִנֵּנִי
  choice: ഇതാ, ഞാൻ ഇവിടെ
  rationale: സന്നദ്ധമായ സ്വയംസമർപ്പണവും പ്രതികരണഭാവവും പ്രകടിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം. ‘ഇതാ, ഞാൻ ഇവിടെ’ അതിലെ ‘ഇതാ’ എന്ന ഊന്നലും സ്വാഭാവിക പ്രതികരണവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവിക വ്യക്തിത്വവുമായി ബന്ധപ്പെടുത്തി വ്യാഖ്യാനിക്കപ്പെടാവുന്ന സന്ദർഭത്തിൽ מַלְאַךְ הָאֱלֹהִים എന്നതിന്റെ പരിഭാഷ
  choice: ദൈവത്തിന്റെ ദൂതൻ
  alternative: ദൈവദൂതൻ; ദൈവത്തിന്റെ സന്ദേശവാഹകൻ
  rationale: വാക്യം ആ വ്യക്തിയെ ‘ദൈവത്തിന്റെ ദൂതൻ’ എന്നു വിളിക്കുന്നതിലപ്പുറം അദ്ദേഹത്തിന്റെ തിരിച്ചറിയൽ തീർപ്പാക്കുന്നില്ല. അതിനാൽ കൂടുതൽ ശക്തമായ ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ പരിഭാഷയിൽ ചേർക്കാതെ മൂലപാഠത്തിലെ വിശേഷണം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ആഖ്യാനശൈലി. സംബോധനയിൽ ‘യാക്കോബേ’ എന്നും പ്രതികരണസൂത്രത്തിൽ ‘ഇതാ, ഞാൻ ഇവിടെ’ എന്നും നൽകി മൂലഭാഷയുടെ ഭാവം സംരക്ഷിച്ചു.
