id: GEN.31.14
reference: Genesis 31:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תַּ֤עַן רָחֵל֙ וְ/לֵאָ֔ה וַ/תֹּאמַ֖רְנָה ל֑/וֹ הַ/ע֥וֹד לָ֛/נוּ חֵ֥לֶק וְ/נַחֲלָ֖ה בְּ/בֵ֥ית אָבִֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/014.yaml
  text: Then Rachel and Leah answered and said to him[b][a], “Do we still have any share or inheritance in our father’s house?”
translation:
  language: ml
  text: 'അപ്പോൾ റാഹേലും ലേയയും അവനോടു മറുപടി പറഞ്ഞു: “ഞങ്ങളുടെ പിതാവിന്റെ ഭവനത്തിൽ ഞങ്ങൾക്ക് ഇനിയും ഓഹരിയോ അവകാശമോ ഉണ്ടോ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞങ്ങളുടെ പിതാവിന്റെ ഭവനം’ എന്നത് ഭൗതിക വീടിനെ മാത്രമല്ല, കുടുംബഗൃഹത്തെയോ കുടുംബസ്വത്തിനെയോ പൈതൃകസമ്പത്തിനെയോ സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעַן
  choice: അപ്പോൾ ... മറുപടി പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുകയും മുൻവാക്കുകളോടുള്ള പ്രതികരണം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ ... മറുപടി പറഞ്ഞു’ സ്വാഭാവികമാണ്.
- source_word: רָחֵל וְלֵאָה
  choice: റാഹേലും ലേയയും
  rationale: വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു; സംയോജകഘടന ‘-ഉം ... -ഉം’ കൊണ്ട് നൽകി.
- source_word: וַתֹּאמַרְנָה לוֹ
  choice: അവനോടു ... പറഞ്ഞു
  rationale: സ്ത്രീലിംഗ ബഹുവചന ക്രിയയും യാക്കോബിനെ സൂചിപ്പിക്കുന്ന പരോക്ഷകർമവും നിലനിർത്തുന്നു. മുൻപുള്ള ‘മറുപടി’യോടൊപ്പം ആവർത്തനം ഒഴിവാക്കാൻ ഒറ്റ സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ സംയോജിപ്പിച്ചു.
- source_word: הַעוֹד
  choice: ഇനിയും
  rationale: തുടർന്നും എന്തെങ്കിലും ശേഷിക്കുന്നുണ്ടോ എന്ന ചോദ്യത്തിലെ കാലസൂചന വ്യക്തമായി നൽകുന്നു.
- source_word: לָנוּ
  choice: ഞങ്ങൾക്ക് ... ഉണ്ടോ
  rationale: ‘ഞങ്ങൾക്കായി ഉണ്ടോ’ എന്ന അക്ഷരാർഥത്തേക്കാൾ മലയാളത്തിലെ സ്വാഭാവിക കൈവശഘടന ഉപയോഗിക്കുന്നു.
- source_word: חֵלֶק
  choice: ഓഹരി
  rationale: കുടുംബസ്വത്തിലും വിഭജനത്തിലും ലഭിക്കേണ്ട പങ്ക് എന്ന അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וְנַחֲלָה
  choice: അവകാശം
  rationale: പാരമ്പര്യമായി ലഭിക്കുന്ന സ്വത്തിലോ കുടുംബസമ്പത്തിലോ ഉള്ള അവകാശം സൂചിപ്പിക്കുന്നു; ‘ഓഹരി’യോടുള്ള ആശയപരമായ ബന്ധവും വേർതിരിവും നിലനിർത്തുന്നു.
- source_word: בְּבֵית אָבִינוּ
  choice: ഞങ്ങളുടെ പിതാവിന്റെ ഭവനത്തിൽ
  rationale: ‘ഭവനം’ ഭൗതിക വീടിനെ മാത്രമല്ല, കുടുംബഗൃഹം, കുടുംബസ്വത്ത്, പൈതൃകമേഖല എന്നിവയെയും സൂചിപ്പിക്കാവുന്ന വിധത്തിൽ ഹീബ്രു പ്രയോഗത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ ‘മറുപടി പറഞ്ഞു, പറഞ്ഞു’ എന്ന ഇരട്ട ക്രിയാപ്രയോഗം മലയാളത്തിൽ അനാവശ്യമായി ആവർത്തിക്കാതെ സംയോജിപ്പിച്ചു. ‘ഓഹരി’യും ‘അവകാശം’യും സ്വത്ത്-പൈതൃക പശ്ചാത്തലത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദങ്ങളാണ്.
