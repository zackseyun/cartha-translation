lexical_decisions:
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: സംഭാഷണത്തിലെ അടുത്ത നടപടിയിലേക്കുള്ള ബന്ധവും മാറ്റവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: לְכָה
  choice: വരൂ
  rationale: הלך എന്ന ധാതുവിൽനിന്നുള്ള രൂപമാണെങ്കിലും, ഇവിടെ ക്ഷണമോ ആഹ്വാനമോ ആയി പ്രയോഗിച്ചിരിക്കുന്നതിനാൽ ‘വരൂ’ എന്നാണ് സ്വാഭാവികം.
- source_word: נִכְרְתָה בְרִית
  choice: ഒരു ഉടമ്പടി ചെയ്യാം
  rationale: ‘ഉടമ്പടി മുറിക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം ഉടമ്പടി ചെയ്യുക അഥവാ സ്ഥാപിക്കുക എന്നതാണ്; മലയാളത്തിലെ വ്യക്തവും സ്വാഭാവികവുമായ രൂപം മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു.
- source_word: בְרִית
  choice: ഉടമ്പടി
  rationale: ഔപചാരികവും ബന്ധപരവുമായ ബലമുള്ള בְּרִית എന്ന പദത്തിന് മലയാള ബൈബിൾ ഭാഷയിലും പൊതുവ്യവഹാരത്തിലും അനുയോജ്യമായ പദം.
- source_word: אֲנִי וָאָתָּה
  choice: ഞാനും നീയും
  rationale: ഇരുകക്ഷികളെയും എബ്രായമൂലം വ്യക്തമായി പേരെടുത്തുപറയുന്നതിനാൽ ആ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: וְהָיָה לְעֵד
  choice: അത് ... സാക്ഷിയായിരിക്കട്ടെ
  rationale: തുടർന്നുള്ള ആശംസാത്മക/ആജ്ഞാത്മക ഭാവം ‘ആയിരിക്കട്ടെ’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു; ഉടമ്പടി സാക്ഷിയായി പ്രവർത്തിക്കണമെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: എനിക്കും നിനക്കും മധ്യേ
  rationale: എബ്രായത്തിലെ വ്യക്തിപരമായ ഇരുകക്ഷി രൂപവും ക്രമവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
