  text: וַ/יַּשֵּׂ֥ג לָבָ֖ן אֶֽת יַעֲקֹ֑ב וְ/יַעֲקֹ֗ב תָּקַ֤ע אֶֽת אָהֳל/וֹ֙ בָּ/הָ֔ר וְ/לָבָ֛ן תָּקַ֥ע אֶת אֶחָ֖י/ו בְּ/הַ֥ר הַ/גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/025.yaml
  text: And Laban caught up with Jacob[a]. Now Jacob had pitched his tent in the hill country[c][b], and Laban pitched with his kinsmen in the hill country of Gilead.
translation:
  language: ml
  text: ലാബാൻ യാക്കോബിനെ പിന്തുടർന്നെത്തി[a]. യാക്കോബ് മലനാട്ടിൽ[b] തന്റെ കൂടാരം അടിച്ചിരുന്നു; ലാബാനും തന്റെ ബന്ധുക്കളോടൊപ്പം ഗിലെയാദിലെ മലനാട്ടിൽ പാളയമടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യാക്കോബിനെ മറികടന്നെത്തി.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മലയിൽ,’ ‘ഗിലെയാദ് മലയിൽ,’ അല്ലെങ്കിൽ ‘ഗിലെയാദിലെ മലപ്രദേശത്ത്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשֵּׂג
  choice: പിന്തുടർന്നെത്തി
  rationale: נשׂג ഇവിടെ പിന്തുടരുന്ന ഒരാൾ മറ്റൊരാളുടെ അടുത്തെത്തുക എന്ന അർഥത്തിലാണ്. ‘പിന്തുടർന്നെത്തി’ എന്നത് പിന്തുടർച്ചയുടെ ഭാവം നിലനിർത്തുന്നു; പിടികൂടി എന്ന അനാവശ്യ സൂചന നൽകുന്നില്ല.
- source_word: תָּקַע ... אָהֳלוֹ
  choice: തന്റെ കൂടാരം അടിച്ചിരുന്നു
  rationale: תקע എന്ന ക്രിയ കൂടാരത്തോടൊപ്പം വരുമ്പോൾ കൂടാരം സ്ഥാപിക്കുക എന്ന പ്രയോഗമാണ്. ലാബാൻ എത്തുമ്പോൾ യാക്കോബ് നേരത്തേ അവിടെ തമ്പടിച്ചിരുന്നുവെന്ന ആഖ്യാനക്രമം ‘അടിച്ചിരുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: בָּהָר
  choice: മലനാട്ടിൽ
  rationale: הַר ഒറ്റ മലയെയും മലമ്പ്രദേശത്തെയും സൂചിപ്പിക്കാം. ഇവിടെ പ്രദേശപരമായ ഉയർന്ന ഭൂഭാഗമാണ് സന്ദർഭത്തിന് യോജിക്കുന്നത്.
- source_word: תָּקַע אֶת אֶחָיו
  choice: തന്റെ ബന്ധുക്കളോടൊപ്പം ... പാളയമടിച്ചു
  rationale: എബ്രായപ്രയോഗം സംക്ഷിപ്തമാണ്; സമാന്തരവാക്യത്തിന്റെ പശ്ചാത്തലത്തിൽ ലാബാൻ തന്റെ സംഘത്തോടൊപ്പം തമ്പടിച്ചു എന്നാണ് അർഥം. മൂലത്തിൽ വ്യക്തമല്ലാത്ത അനേകം കൂടാരങ്ങൾ പാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: אֶחָיו
  choice: തന്റെ ബന്ധുക്കൾ
  rationale: പദശഃ ‘അവന്റെ സഹോദരന്മാർ’ എന്നാണെങ്കിലും אחים എന്നത് വിശാലമായ കുടുംബാംഗങ്ങളെയോ കുലബന്ധുക്കളെയോ സൂചിപ്പിക്കാം; ഈ യാത്രാസംഘത്തിന്റെ സന്ദർഭത്തിൽ ‘ബന്ധുക്കൾ’ സ്വാഭാവികമാണ്.
- source_word: בְּהַר הַגִּלְעָד
  choice: ഗിലെയാദിലെ മലനാട്ടിൽ
  rationale: നിർമാണബന്ധത്തിലുള്ള ഈ പദസമുച്ചയം ‘ഗിലെയാദിന്റെ മല’ എന്നും ‘ഗിലെയാദിലെ മലമ്പ്രദേശം’ എന്നും ഗ്രഹിക്കാം. സന്ദർഭത്തിൽ പ്രദേശനാമമായ വിവർത്തനം സ്വാഭാവികമാണ്.
