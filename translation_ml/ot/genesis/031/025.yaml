  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കൂടാരം അടിക്കുക’, ‘പാളയമടിക്കുക’ എന്നീ സ്വാഭാവിക പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിലെ സ്ഥലസൂചനയുടെ സാധ്യതാഭേദം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
