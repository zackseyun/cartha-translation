id: GEN.31.12
reference: Genesis 31:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר שָׂא נָ֨א עֵינֶ֤י/ךָ וּ/רְאֵה֙ כָּל הָֽ/עַתֻּדִים֙ הָ/עֹלִ֣ים עַל הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/בְרֻדִּ֑ים כִּ֣י רָאִ֔יתִי אֵ֛ת כָּל אֲשֶׁ֥ר לָבָ֖ן עֹ֥שֶׂה לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/012.yaml
  text: 'And he said[a], “Please lift up your eyes and see: all the male goats that are mating with the flock are striped, speckled, and spotted[b], for I have seen all that Laban is doing to you.”'
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ദയവായി കണ്ണുയർത്തി നോക്കുക. ആട്ടിൻകൂട്ടവുമായി ഇണചേരുന്ന[a] ആൺകോലാടുകളെല്ലാം വരകളുള്ളവയും[b] ചെറുപുള്ളികളുള്ളവയും ചിത്രപ്പുള്ളികളുള്ളവയുമാണ്. കാരണം, ലാബാൻ നിന്നോടു ചെയ്യുന്നതെല്ലാം ഞാൻ കണ്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ആട്ടിൻകൂട്ടത്തിന്മേൽ കയറുന്നവർ.’ മൃഗങ്ങളുടെ പ്രജനനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: ‘വരകളുള്ളവ’ എന്നതിന് ഉപയോഗിച്ച എബ്രായപദം ‘വളയവരകളുള്ളവ’ അല്ലെങ്കിൽ ‘പട്ടകളുള്ളവ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא עֵינֶיךָ וּרְאֵה
  choice: ദയവായി കണ്ണുയർത്തി നോക്കുക
  rationale: ‘കണ്ണുയർത്തുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവവും נָא എന്ന വിനയസൂചക കണത്തിന്റെ അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָעַתֻּדִים
  choice: ആൺകോലാടുകൾ
  rationale: ഈ പദം സാധാരണയായി ആൺകോലാടുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആട്ടുകൊറ്റന്മാർ’ എന്നു പറഞ്ഞാൽ ആൺചെമ്മരിയാടുകൾ എന്ന തെറ്റായ ധാരണ വരാം.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: ആട്ടിൻകൂട്ടവുമായി ഇണചേരുന്ന
  rationale: വാക്കുതോറും ‘ആട്ടിൻകൂട്ടത്തിന്മേൽ കയറുന്ന’ എന്നാണെങ്കിലും മൃഗപ്രജനനസന്ദർഭത്തിലെ എബ്രായ സൗമ്യപ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עֲקֻדִּים
  choice: വരകളുള്ളവ
  rationale: പട്ടകളോ വരകളോ ഉള്ള അടയാളത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക വായനക്കാർക്ക് സുതാര്യമായ പദം.
- source_word: נְקֻדִּים
  choice: പുള്ളികളുള്ളവ
  rationale: ചെറിയ കുത്തുകളോ പുള്ളികളോ ഉള്ള നിറവിന്യാസത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തമായ മലയാളം.
- source_word: וּבְרֻדִּים
  choice: പലനിറം കലർന്നവ
  rationale: മുൻപുള്ള ‘പുള്ളികളുള്ളവ’ എന്നതിൽനിന്ന് വ്യത്യാസം കാത്തുകൊണ്ട് വർണവൈവിധ്യമോ ചിതറിയ നിറവിന്യാസമോ സൂചിപ്പിക്കുന്നു.
- source_word: כִּי רָאִיתִי
  choice: ഞാൻ കണ്ടിരിക്കുന്നു
  rationale: പൂർത്തിയായ ദർശനത്തിനും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിക്കും യോജിക്കുന്ന രൂപം; മലയാളത്തിലെ വാക്യക്രമത്തിൽ കാരണബന്ധം സ്വാഭാവികമായി ഗ്രഹിക്കാം.
- source_word: אֵת כָּל אֲשֶׁר לָבָן עֹשֶׂה לָּךְ
  choice: ലാബാൻ നിന്നോടു ചെയ്യുന്നതെല്ലാം
  rationale: עֹשֶׂה എന്ന കൃദന്തരൂപത്തിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവവും לָּךְ എന്നതിന്റെ ഇവിടെ ബാധിതനെ സൂചിപ്പിക്കുന്ന അർഥവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൃഗപ്രജനനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ സൗമ്യപ്രയോഗം അസ്വാഭാവികമായ വാക്കുതർജമ ഒഴിവാക്കി വ്യക്തമായി നൽകിയിരിക്കുന്നു. നിറവിന്യാസത്തെ സൂചിപ്പിക്കുന്ന മൂന്നു എബ്രായപദങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം കഴിയുന്നത്ര സംരക്ഷിച്ചു.
