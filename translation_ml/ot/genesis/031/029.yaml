  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יֶשׁ לְ/אֵ֣ל יָדִ֔/י לַ/עֲשׂ֥וֹת עִמָּ/כֶ֖ם רָ֑ע וֵֽ/אלֹהֵ֨י אֲבִי/כֶ֜ם אֶ֣מֶשׁ אָמַ֧ר אֵלַ֣/י לֵ/אמֹ֗ר הִשָּׁ֧מֶר לְ/ךָ֛ מִ/דַּבֵּ֥ר עִֽם יַעֲקֹ֖ב מִ/טּ֥וֹב עַד רָֽע־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/029.yaml
  text: It is in my power to do you harm[a], but the God of your father spoke to me last night, saying, ‘Be careful not to speak to Jacob either good or bad.’
translation:
  language: ml
  text: 'നിങ്ങൾക്കു ഹാനി വരുത്താൻ എനിക്കു ശക്തിയുണ്ട്. എന്നാൽ നിങ്ങളുടെ പിതാവിന്റെ ദൈവം കഴിഞ്ഞ രാത്രി എന്നോടു പറഞ്ഞു: ‘യാക്കോബിനോട് നല്ലതോ ചീത്തയോ ഒന്നും പറയാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക.’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘നല്ലതുമുതൽ ചീത്തവരെ’ എന്നാണ്; അനുകൂലമോ പ്രതികൂലമോ ആയ ഒന്നും പറയരുത് എന്ന അർത്ഥമുള്ള ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשׁ לְאֵל יָדִי
  choice: എനിക്കു കഴിയും
  rationale: കൈയിലെ ശക്തി എന്ന എബ്രായ പ്രയോഗം പ്രവർത്തിക്കാനുള്ള കഴിവിനെയോ അധികാരത്തെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അർത്ഥം നൽകുന്നു.
- source_word: לַעֲשׂוֹת עִמָּכֶם רָע
  choice: നിങ്ങൾക്കു ദോഷം ചെയ്യാൻ
  rationale: ഇവിടെ רָע അമൂർത്തമായ ധാർമിക തിന്മയെക്കാൾ അഭിസംബോധിതർക്ക് വരുത്താവുന്ന ഹാനിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וֵאלֹהֵי אֲבִיכֶם
  choice: എന്നാൽ നിങ്ങളുടെ പിതാവിന്റെ ദൈവം
  rationale: וְ സന്ദർഭത്തിൽ ലാബാന്റെ കഴിവും ദൈവത്തിന്റെ വിലക്കും തമ്മിലുള്ള വൈരുധ്യം അവതരിപ്പിക്കുന്നു; അതിനാൽ 'എന്നാൽ' സ്വാഭാവികമാണ്. രൂപത്തിൽ ബഹുവചന പ്രത്യയമുണ്ടെങ്കിലും സന്ദർഭത്തിലെ മുഖ്യ അഭിസംബോധിതനായ യാക്കോബിന്റെ പിതാവിനെയാണ് ഏകവചന അർത്ഥത്തിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: אֶמֶשׁ
  choice: കഴിഞ്ഞ രാത്രി
  rationale: സന്ദർഭത്തിൽ മുൻ രാത്രിയെയാണ് വ്യക്തമായി സൂചിപ്പിക്കുന്നത്.
- source_word: הִשָּׁמֶר לְךָ
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: നിഫാൽ ആജ്ഞാരൂപത്തിലെ ശക്തമായ ജാഗ്രതാ മുന്നറിയിപ്പ് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִדַּבֵּר עִם יַעֲקֹב
  choice: യാക്കോബിനോട് ... പറയാതിരിക്കാൻ
  rationale: הִשָּׁמֶר + מִן ഘടന വിലക്കാണ് പ്രകടിപ്പിക്കുന്നത്; തുടർന്നുള്ള നല്ലത്/ചീത്ത എന്ന പ്രയോഗവുമായി ചേർന്ന് 'പറയുക' മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: מִטּוֹב עַד רָע
  choice: നല്ലതോ ചീത്തയോ ഒന്നും
  rationale: അക്ഷരാർഥത്തിലെ 'നല്ലതുമുതൽ ചീത്തവരെ' എന്ന ധ്രുവപ്രയോഗം മുഴുവൻ സാധ്യതാവ്യാപ്തിയെയും, അഥവാ ഒന്നും പറയരുതെന്ന വിലക്കിനെയും സൂചിപ്പിക്കുന്നു; പ്രധാനവാചകത്തിൽ ധ്രുവങ്ങൾ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലാബാനോടു സംസാരിച്ച ദൈവത്തെ സൂചിപ്പിക്കുന്ന אֱלֹהִים എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നിങ്ങളുടെ പിതാവിന്റെ ദൈവം
  alternative: നിങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവം
  rationale: ഉടൻ വരുന്ന സന്ദർഭത്തിൽ യാക്കോബിനോടുള്ള അഭിസംബോധനയിൽ ഈ സംയുക്തപ്രയോഗം ഏകവചന അർത്ഥത്തിലാണ്. പിന്നീട് രൂപപ്പെട്ട ദൈവശാസ്ത്രവിശദീകരണങ്ങൾ ചേർക്കാതെ വ്യക്തിപരമായ പിതൃബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ദൈവത്തിന്റെ നേരിട്ടുള്ള വാക്കുകളിൽ മുന്നറിയിപ്പിന്റെ ശക്തി നിലനിർത്തി; എബ്രായ ധ്രുവപ്രയോഗം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
