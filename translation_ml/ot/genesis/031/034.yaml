base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/034.yaml
  text: Rachel had taken the household idols[a], put them in the camel’s saddle cushion, and sat on them. Laban felt through the whole tent[c][b], but did not find them.
translation:
  language: ml
  text: റാഹേൽ വീട്ടുദേവവിഗ്രഹങ്ങൾ[a] എടുത്ത് ഒട്ടകജീനിയുടെ മെത്തയിൽ[b] വെച്ചിട്ട് അവയുടെമേൽ ഇരുന്നു. ലാബാൻ കൂടാരം മുഴുവൻ കൈകൊണ്ടു തപ്പിനോക്കിയെങ്കിലും അവ കണ്ടെത്തിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തെരാഫീം’ അല്ലെങ്കിൽ ‘വീട്ടുദേവന്മാർ.’ എബ്രായപദം വീട്ടിലെ ആരാധനയുമായി ബന്ധപ്പെട്ട ദേവപ്രതിമകളെയോ അനുഷ്ഠാനവസ്തുക്കളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഒട്ടകത്തിന്റെ ജീനിയിൽ.’ എബ്രായപദം ഒട്ടകത്തിന്റെ സവാരിയുപകരണത്തിലെ മെത്തപോലെ മൃദുവായി നിറച്ച ഒരു ഭാഗത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: വീട്ടുദേവവിഗ്രഹങ്ങൾ
  rationale: തെരാഫീം എന്ന എബ്രായപദം വീട്ടിലെ ആരാധനയുമായി ബന്ധപ്പെട്ട ദേവപ്രതിമകളെയോ അനുഷ്ഠാനവസ്തുക്കളെയോ സൂചിപ്പിക്കുന്നു. അപരിചിതമായ ലിപ്യന്തരണത്തേക്കാൾ സാധാരണ വായനക്കാർക്ക് അർഥം വ്യക്തമാക്കുന്ന പദമാണിത്; വസ്തുക്കളും അവ പ്രതിനിധാനം ചെയ്യുന്ന ദേവതകളും തമ്മിലുള്ള ഉറവിടത്തിലെ ചെറിയ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּכַר הַגָּמָל
  choice: ഒട്ടകത്തിന്റെ ജീനിക്കുള്ളിലെ മെത്തയിൽ
  rationale: כַּר എന്നത് മെത്തയെയോ മൃദുവായി നിറച്ച ഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു. ഒട്ടകസവാരിയുടെ ഉപകരണത്തിലെ മറയ്ക്കാൻ കഴിയുന്ന മെത്തയെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַתֵּשֶׁב עֲלֵיהֶם
  choice: അവയുടെമേൽ ഇരുന്നു
  rationale: തുടർച്ചയായ ആഖ്യാനക്രിയയും വസ്തുക്കളെ ശരീരത്തിനടിയിൽ മറച്ചുവെച്ച ദൃശ്യവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיְמַשֵּׁשׁ
  choice: കൈകൊണ്ടു തപ്പിനോക്കി
  rationale: משׁשׁ വെറും തിരച്ചിലല്ല, സ്പർശിച്ച് പരിശോധിക്കുന്നതാണെന്ന് സൂചിപ്പിക്കുന്നു. ‘കൈകൊണ്ടു തപ്പിനോക്കി’ എന്നത് ആ ഇന്ദ്രിയസൂക്ഷ്മത സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל הָאֹהֶל
  choice: കൂടാരം മുഴുവൻ
  rationale: നിർദ്ദിഷ്ടനാമത്തോടുകൂടിയ כָּל എന്നതിന്റെ സമഗ്രത സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְלֹא מָצָא
  choice: എങ്കിലും അവ കണ്ടെത്തിയില്ല
  rationale: എബ്രായത്തിൽ കർമം സൂചിതമാണെങ്കിലും മലയാളത്തിൽ വ്യക്തതയ്ക്കായി വീട്ടുദേവവിഗ്രഹങ്ങളെ സൂചിപ്പിക്കുന്ന ‘അവ’ ചേർക്കുന്നു; ഫലത്തിലെ വൈരുധ്യം ‘എങ്കിലും’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: תְּרָפִים എന്ന പദത്തിന്റെ ദേവത/പ്രതിമ അർഥവ്യാപ്തി
  choice: വീട്ടുദേവവിഗ്രഹങ്ങൾ
  alternative: തെരാഫീം; വീട്ടുദേവന്മാർ
  rationale: വസ്തുക്കൾ കൈയിൽ എടുക്കുകയും ഒളിപ്പിക്കുകയും ചെയ്യുന്നതിനാൽ പ്രതിമകളെന്ന ഭൗതികസൂചന ആവശ്യമാണ്; അതേസമയം അവയുടെ ഗൃഹാരാധനാസംബന്ധം ‘വീട്ടുദേവ-’ എന്ന ഘടകം നിലനിർത്തുന്നു. ഏതെങ്കിലും പ്രത്യേക മതശാസ്ത്രവ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ആദ്യക്രിയയെ പൂർവ്വപൂർണ പശ്ചാത്തലമായി ‘എടുത്ത്... വെച്ചിട്ട്’ എന്ന ക്രമത്തിൽ അവതരിപ്പിക്കുകയും, ലാബാന്റെ തിരച്ചിലിന്റെ സ്പർശാധിഷ്ഠിത സ്വഭാവം വ്യക്തമാക്കുകയും ചെയ്തു. എല്ലാ അടിക്കുറിപ്പുകുറികളും ബന്ധപ്പെട്ട മുഖ്യപാഠസ്ഥാനത്താണ് നൽകിയിരിക്കുന്നത്.
