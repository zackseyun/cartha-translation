translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. കുറ്റസംബന്ധമായ രണ്ട് എബ്രായ പദങ്ങളുടെ വ്യത്യാസവും ചോദ്യങ്ങളുടെ സമാന്തരതയും നിലനിർത്തിയിരിക്കുന്നു.
