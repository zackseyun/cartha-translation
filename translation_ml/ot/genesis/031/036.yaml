base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/036.yaml
  text: Then Jacob became angry and contended with Laban. Jacob answered and said to Laban[a], “What is my transgression? What is my sin, that you have pursued me?”
translation:
  language: ml
  text: 'അപ്പോൾ യാക്കോബ് കോപിച്ചു ലാബാനോടു തർക്കിച്ചു. യാക്കോബ് ലാബാനോടു മറുപടിയായി പറഞ്ഞു: “നീ എന്റെ പിന്നാലെ പാഞ്ഞുവന്നതിന് എന്റെ അതിക്രമം എന്ത്? എന്റെ പാപം എന്ത്?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ എന്നെ തീവ്രമായി പിന്തുടർന്നതിന്.” എബ്രായ ക്രിയയിൽ കത്തുന്നതുപോലെയുള്ള തീക്ഷ്ണമായ പിന്തുടരലിന്റെ ചിത്രം അടങ്ങിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְיַעֲקֹב
  choice: യാക്കോബ് കോപിച്ചു
  rationale: חרה എന്ന എബ്രായ പ്രയോഗം കോപം ജ്വലിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ‘കോപിച്ചു’ എന്നത് ആരംഭഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיָּרֶב בְּלָבָן
  choice: ലാബാനോടു തർക്കിച്ചു
  rationale: ריב ഇവിടെ എതിർത്ത് വാദിക്കുകയോ കലഹിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തർക്കിച്ചു’ എന്നത് അനാവശ്യമായി ശാരീരിക സംഘർഷം സൂചിപ്പിക്കാതെ വാക്കാലുള്ള ഏറ്റുമുട്ടൽ നിലനിർത്തുന്നു.
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ‘ഉത്തരം നൽകി പറഞ്ഞു’ എന്ന എബ്രായ ആഖ്യാനസംയോജനത്തിന്റെ അർഥം ആവർത്തനഭാരം കൂടാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מַה פִּשְׁעִי
  choice: എന്റെ അതിക്രമം എന്ത്?
  rationale: פשע മനഃപൂർവമായ ലംഘനമോ കുറ്റമോ എന്ന ധാർമിക-നിയമപരമായ ഭാവം വഹിക്കുന്നു. ‘അതിക്രമം’ ആ സൂക്ഷ്മത സംരക്ഷിക്കുന്നു.
- source_word: מַה חַטָּאתִי
  choice: എന്റെ പാപം എന്ത്?
  rationale: חטאת എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘പാപം’ ഉപയോഗിച്ച് മുൻചോദ്യത്തോടുള്ള വാഗാലങ്കാരപരമായ സമാന്തരത നിലനിർത്തുന്നു.
- source_word: דָלַקְתָּ אַחֲרָי
  choice: നീ എന്റെ പിന്നാലെ പാഞ്ഞുവന്നത്
  rationale: דלק എന്ന ക്രിയയിൽ തീക്ഷ്ണവും ആവേശപൂർവവുമായ പിന്തുടരലിന്റെ ചിത്രം ഉണ്ട്. ‘പിന്നാലെ പാഞ്ഞുവന്നു’ എന്നത് മലയാളത്തിൽ ആ ചലനവും തീവ്രതയും സ്വാഭാവികമായി നൽകുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: כִּי
  choice: എന്തുകൊണ്ട്?
  rationale: മുൻപുള്ള രണ്ടു ചോദ്യങ്ങളുടെ അടിസ്ഥാനത്തിൽ പിന്തുടരലിന്റെ കാരണം ചോദിക്കുന്ന മലയാള വാക്യഘടനയ്ക്കായി כִּי ഉൾക്കൊള്ളുന്ന ബന്ധം ‘എന്തുകൊണ്ട്’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
