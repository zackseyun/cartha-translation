- from: 'അപ്പോൾ യാക്കോബ് കോപിച്ചു ലാബാനോടു തർക്കിച്ചു. യാക്കോബ് ലാബാനോടു മറുപടിയായി പറഞ്ഞു: “എന്റെ അതിക്രമം എന്ത്? എന്റെ പാപം എന്ത്? നീ എന്റെ പിന്നാലെ പാഞ്ഞുവന്നത് എന്തുകൊണ്ട്?[a]”'
  to: 'അപ്പോൾ യാക്കോബ് കോപിച്ചു ലാബാനോടു തർക്കിച്ചു. യാക്കോബ് ലാബാനോടു മറുപടിയായി പറഞ്ഞു: “നീ എന്റെ പിന്നാലെ പാഞ്ഞുവന്നതിന് എന്റെ അതിക്രമം എന്ത്? എന്റെ പാപം എന്ത്?[a]”'
  rationale: The revision preserves the Hebrew syntax and rhetorical force by making Laban’s pursuit the occasion for Jacob’s two questions about alleged transgression and sin, rather than asking independently why Laban pursued him. The lexical footnote is correspondingly adjusted while retaining the vivid pursuit nuance of the Hebrew verb.
