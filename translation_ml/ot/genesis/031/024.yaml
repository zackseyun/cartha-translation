source:
  edition: WLC
  text: וַ/יָּבֹ֧א אֱלֹהִ֛ים אֶל לָבָ֥ן הָ/אֲרַמִּ֖י בַּ/חֲלֹ֣ם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ הִשָּׁ֧מֶר לְ/ךָ֛ פֶּן תְּדַבֵּ֥ר עִֽם יַעֲקֹ֖ב מִ/טּ֥וֹב עַד רָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/024.yaml
  text: But God came to Laban the Aramean in a dream at night and said to him[c][b][a], “Be careful not to speak to Jacob either good or bad.”
translation:
  language: ml
  text: 'എന്നാൽ ദൈവം രാത്രിയിൽ ഒരു സ്വപ്നത്തിൽ അരാമ്യനായ ലാബാന്റെ അടുക്കൽ വന്ന് അവനോടു പറഞ്ഞു: “നീ യാക്കോബിനോടു നല്ലതോ ചീത്തയോ ഒന്നും പറയാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “നല്ലതുമുതൽ ചീത്തവരെ.” അനുകൂലമോ പ്രതികൂലമോ ആയ യാതൊന്നും പറയരുത് എന്നർഥമുള്ള ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: വന്നു
  rationale: בוא എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥം ‘വന്നു’ എന്നാണ്; ‘പ്രത്യക്ഷപ്പെട്ടു’ എന്നു വിവർത്തനം ചെയ്യുന്നത് മൂലപാഠത്തിലില്ലാത്ത വ്യാഖ്യാനം ചേർക്കും.
- source_word: לָבָן הָאֲרַמִּי
  choice: അരാമ്യനായ ലാബാൻ
  rationale: אֲרַמִּי എന്നത് അരാം ജനവിഭാഗത്തിൽപ്പെട്ടവനെ സൂചിപ്പിക്കുന്നു; പരമ്പരാഗതമായ ‘സുറിയാനിക്കാരൻ’ എന്നതിനെക്കാൾ ‘അരാമ്യൻ’ എബ്രായ വംശനാമത്തോട് അടുത്തതാണ്.
- source_word: בַּחֲלֹם הַלָּיְלָה
  choice: രാത്രിയിൽ ഒരു സ്വപ്നത്തിൽ
  rationale: സ്വപ്നവും രാത്രിയും സൂചിപ്പിക്കുന്ന രണ്ടു ഘടകങ്ങളും സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: הִשָּׁמֶר לְךָ
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: സ്വയം കരുതണമെന്ന മുന്നറിയിപ്പിന്റെ ശക്തി ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: פֶּן תְּדַבֵּר עִם יַעֲקֹב
  choice: യാക്കോബിനോടു ... പറയാതിരിക്കാൻ
  rationale: פֶּן നിരോധനാത്മക മുന്നറിയിപ്പാണ്; דבר עם എന്നത് ഈ സന്ദർഭത്തിൽ ‘ഒരാളോടു പറയുക/സംസാരിക്കുക’ എന്ന അർഥം നൽകുന്നു.
- source_word: מִטּוֹב עַד רָע
  choice: നല്ലതോ ചീത്തയോ ഒന്നും
  rationale: അക്ഷരാർഥമായ ‘നല്ലതുമുതൽ ചീത്തവരെ’ എന്ന ധ്രുവപ്രയോഗം ഇവിടെ അനുകൂലമോ പ്രതികൂലമോ ആയ യാതൊന്നും പറയരുതെന്ന സമഗ്ര നിരോധനമാണ്; ‘ഒന്നും’ ചേർക്കുന്നത് മലയാളത്തിൽ ആ പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אֱלֹהִים എന്ന പദത്തിന്റെ വ്യക്തിത്വം
  choice: ദൈവം
  alternative: ദേവന്മാർ / ഒരു ദൈവിക സത്ത
  rationale: ഏകവചന ക്രിയയും ആഖ്യാനസന്ദർഭവും ഇസ്രായേലിന്റെ ഏകദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- issue: מִטּוֹב עַד רָע എന്ന മുന്നറിയിപ്പിന്റെ വ്യാപ്തി
  choice: യാക്കോബിനോട് അനുകൂലമോ പ്രതികൂലമോ ആയ ഒന്നും പറയരുത്
  alternative: നല്ലതിൽനിന്ന് ചീത്തയിലേക്കുള്ള വാക്കുകൾ മാത്രം പറയരുത്
  rationale: വിരുദ്ധധ്രുവങ്ങൾ ചേർന്ന ഈ എബ്രായ പ്രയോഗം മുഴുവൻ സാധ്യതാപരിധിയെയും സൂചിപ്പിക്കുന്നു; എങ്കിലും അതിന്റെ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അരാമ്യൻ’ എന്ന ചരിത്ര-വംശനാമം നിലനിർത്തി. എബ്രായ ധ്രുവപ്രയോഗത്തിന്റെ അർഥം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി നൽകി, അതിന്റെ അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
