id: GEN.31.3
reference: Genesis 31:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל יַעֲקֹ֔ב שׁ֛וּב אֶל אֶ֥רֶץ אֲבוֹתֶ֖י/ךָ וּ/לְ/מוֹלַדְתֶּ֑/ךָ וְ/אֶֽהְיֶ֖ה עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/003.yaml
  text: Then Yahweh said to Jacob[a], “Return to the land of your fathers and to your kindred, and I will be with you.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ യാക്കോബിനോടു പറഞ്ഞു: “നിന്റെ പിതാക്കന്മാരുടെ ദേശത്തേക്കും നിന്റെ ജന്മദേശത്തേക്കും[a] മടങ്ങുക; ഞാൻ നിന്നോടുകൂടെ ഉണ്ടായിരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ ബന്ധുജനങ്ങളുടെ അടുക്കലേക്കും.” എബ്രായപദത്തിന് സന്ദർഭമനുസരിച്ച് ബന്ധുജനം എന്നോ ഒരാളുടെ ജന്മസ്ഥലം അഥവാ സ്വദേശം എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാക്രമം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ അതിന്റെ ക്രമാനുസൃത ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു പദവികൊണ്ട് മാറ്റിസ്ഥാപിക്കാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള ഉച്ചാരണമായ ‘Yahweh’ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: שׁוּב
  choice: മടങ്ങുക
  rationale: ആജ്ഞാരൂപത്തിന്റെ ‘തിരികെ ചെല്ലുക/മടങ്ങുക’ എന്ന അടിസ്ഥാന അർഥം ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶל אֶרֶץ אֲבוֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാരുടെ ദേശത്തേക്ക്
  rationale: എബ്രായ സംയുക്തപദപ്രയോഗവും അതിലെ പുരുഷലിംഗ കുടുംബസൂചനയും അടുത്തായി നിലനിർത്തുന്നു.
- source_word: מוֹלַדְתֶּךָ
  choice: നിന്റെ ജന്മദേശത്തേക്ക്
  rationale: മോലെദെത് എന്ന പദത്തിന് ജന്മസ്ഥലം/സ്വദേശം എന്നും ബന്ധുജനം എന്നും അർഥമാകാം. ഇവിടെ ദേശസംബന്ധമായ അർഥം മുഖ്യവാചകത്തിൽ നൽകുകയും യഥാർഥ പദാർഥദ്വയാർഥത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וְאֶהְיֶה עִמָּךְ
  choice: ഞാൻ നിന്നോടുകൂടെ ഉണ്ടായിരിക്കും
  rationale: ദൈവസാന്നിധ്യത്തെക്കുറിച്ചുള്ള ഭാവികാല വാഗ്ദാനം നേരായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയാൽ മാറ്റാതെ ‘Yahweh’ എന്ന ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: מוֹלַדְתֶּךָ എന്ന പദത്തിന്റെ അർഥം
  choice: നിന്റെ ജന്മദേശം
  alternative: നിന്റെ ബന്ധുജനം
  rationale: ഈ സന്ദർഭത്തിൽ ‘പിതാക്കന്മാരുടെ ദേശം’ എന്ന ഭൂമിശാസ്ത്രപരമായ പ്രയോഗത്തോടൊപ്പം ജന്മദേശം/സ്വദേശം എന്ന അർഥം യോജിക്കുന്നു; എന്നാൽ ബന്ധുജനം എന്ന അർഥവും സാധുവായതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ദൈവവചനശൈലി. അനാവശ്യമായി പുരാതനമായ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി; മൂലപാഠത്തിലെ ആഖ്യാനക്രമവും ദൈവസാന്നിധ്യത്തിന്റെ വാഗ്ദാനവും നേരിട്ട് നിലനിർത്തി.
