id: GEN.31.32
reference: Genesis 31:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עִ֠ם אֲשֶׁ֨ר תִּמְצָ֣א אֶת אֱלֹהֶי/ךָ֮ לֹ֣א יִֽחְיֶה֒ נֶ֣גֶד אַחֵ֧י/נוּ הַֽכֶּר לְ/ךָ֛ מָ֥ה עִמָּדִ֖/י וְ/קַֽח לָ֑/ךְ וְ/לֹֽא יָדַ֣ע יַעֲקֹ֔ב כִּ֥י רָחֵ֖ל גְּנָבָֽתַ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/032.yaml
  text: Whoever is found with your gods shall not live[a]. In the presence of our brothers, identify what of yours is with me[c][b], and take it for yourself.” Jacob did not know that Rachel had stolen them.
translation:
  language: ml
  text: “ആരുടെ പക്കൽ നിന്റെ ദേവന്മാരെ നീ കണ്ടെത്തുന്നുവോ, അവൻ ജീവനോടിരിക്കുകയില്ല. നമ്മുടെ സഹോദരന്മാരുടെ സാന്നിധ്യത്തിൽ, എന്റെ പക്കൽ നിന്റേതായി എന്തുണ്ടെന്നു തിരിച്ചറിഞ്ഞ് എടുത്തുകൊൾക.” റാഹേൽ അവയെ മോഷ്ടിച്ചതായി യാക്കോബ് അറിഞ്ഞിരുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִם אֲשֶׁר תִּמְצָא
  choice: ആരുടെ പക്കൽ ... നീ കണ്ടെത്തുന്നുവോ
  rationale: എബ്രായത്തിലെ ദ്വിതീയപുരുഷ ഏകവചനമായ ‘നീ കണ്ടെത്തുന്നു’ എന്ന സജീവരൂപവും അനിശ്ചിത ബന്ധവാക്യത്തിന്റെ അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദേവന്മാരെ
  rationale: മൂലപദത്തിന്റെ ബഹുവചനവും നേരിട്ടുള്ള അർഥവും സംരക്ഷിക്കുന്നു; സന്ദർഭം വീട്ടുദേവവിഗ്രഹങ്ങളിലേക്കാണ് വിരൽചൂണ്ടുന്നതെങ്കിലും ഇവിടെ ‘തെരാഫീം’ എന്ന പദം ഉപയോഗിച്ചിട്ടില്ല.
- source_word: לֹא יִחְיֶה
  choice: അയാൾ ജീവനോടിരിക്കുകയില്ല
  rationale: നിയമവിധി, ശാപവാക്യം, അല്ലെങ്കിൽ ദൃഢപ്രഖ്യാപനം എന്ന സാധ്യതകളിൽ ഒന്നിനെ മാത്രം നിർബന്ധിച്ച് തിരഞ്ഞെടുക്കാതെ മൂലത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: נֶגֶד אַחֵינוּ
  choice: നമ്മുടെ സഹോദരന്മാരുടെ സാന്നിധ്യത്തിൽ
  rationale: ‘മുമ്പിൽ/സാന്നിധ്യത്തിൽ’ എന്ന അർഥവും ‘നമ്മുടെ സഹോദരന്മാർ’ എന്ന മൂലപ്രയോഗവും സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ബന്ധുക്കൾ ഉൾപ്പെടുന്ന വിശാലസംഘമാകാം.
- source_word: הַכֶּר לְךָ מָה עִמָּדִי
  choice: നിന്റേതായി എന്തെങ്കിലും എന്റെ പക്കലുണ്ടെങ്കിൽ അതു തിരിച്ചറിഞ്ഞ്
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ലാബാൻ തന്റെ വസ്തു തിരിച്ചറിയണമെന്ന വെല്ലുവിളിയാണ് ആശയം.
- source_word: וְקַח לָךְ
  choice: എടുത്തുകൊൾക
  rationale: ലְךָയുടെ സ്വഹിതഭാവം മലയാളത്തിലെ സ്വാഭാവിക സംയുക്തക്രിയയിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: וְלֹא יָדַע יַעֲקֹב כִּי רָחֵל גְּנָבָתַם
  choice: എന്നാൽ റാഹേലാണ് അവയെ മോഷ്ടിച്ചതെന്ന് യാക്കോബ് അറിഞ്ഞിരുന്നില്ല
  rationale: വിവരണാത്മകമായ കഥാകൃത്തിന്റെ ഇടക്കുറിപ്പ് സ്വാഭാവികമായി നൽകുന്നു; ‘അവയെ’ എന്ന ബഹുവചനം ദേവന്മാരെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ലֹא יִחְיֶה എന്ന വാക്യത്തിന്റെ സ്വഭാവം
  choice: അയാൾ ജീവനോടിരിക്കുകയില്ല
  alternative: അയാൾ ജീവിക്കരുത്
  rationale: ഇത് മരണശിക്ഷയോ ശാപമോ ദൃഢപ്രഖ്യാപനമോ എന്ന് മൂലവാക്യം പൂർണമായി തീർപ്പാക്കുന്നില്ല; അതിനാൽ അവ്യക്തത സംരക്ഷിക്കുന്ന രൂപം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ദേവന്മാർ’, ‘സഹോദരന്മാർ’ എന്നീ മൂലപദങ്ങൾ വ്യാഖ്യാനപരമായി ചുരുക്കാതെ നിലനിർത്തി. ഈ കരടിൽ അടിക്കുറിപ്പുകൾ ആവശ്യമില്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളില്ല.
