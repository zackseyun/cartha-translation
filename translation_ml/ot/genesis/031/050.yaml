source:
  edition: WLC
  text: אִם תְּעַנֶּ֣ה אֶת בְּנֹתַ֗/י וְ/אִם תִּקַּ֤ח נָשִׁים֙ עַל בְּנֹתַ֔/י אֵ֥ין אִ֖ישׁ עִמָּ֑/נוּ רְאֵ֕ה אֱלֹהִ֥ים עֵ֖ד בֵּינִ֥/י וּ/בֵינֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/050.yaml
  text: If you mistreat my daughters[a], or if you take wives besides my daughters—though no man is with us—see, God is witness between me and you.
translation:
  language: ml
  text: നീ എന്റെ പുത്രിമാരോടു ദുരുപദ്രവം ചെയ്യുകയോ എന്റെ പുത്രിമാരെക്കൂടാതെ വേറെ ഭാര്യമാരെ സ്വീകരിക്കുകയോ ചെയ്താൽ—നമ്മോടൊപ്പം ഒരു മനുഷ്യനും ഇല്ലെങ്കിലും[a]—നോക്കുക, എനിക്കും നിനക്കും മധ്യേ ദൈവം സാക്ഷിയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നമ്മോടൊപ്പം ഒരു മനുഷ്യനും ഇല്ല”; മനുഷ്യസാക്ഷി ആരും അവിടെ ഇല്ലെന്നതാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּעַנֶּה
  choice: ക്രൂരമായി പെരുമാറുക
  rationale: പീയേൽ രൂപം ഇവിടെ വിവാഹബന്ധത്തിൽ ലാബാന്റെ പുത്രിമാരെ കഷ്ടപ്പെടുത്തുകയോ ദുഷ്പെരുമാറ്റത്തിന് ഇരയാക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആ അർഥം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּנֹתַי
  choice: എന്റെ പുത്രിമാർ
  rationale: ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന ബഹുവചനം; എബ്രായത്തിലെ ആവർത്തനം ഊന്നലിനും വ്യക്തതയ്ക്കുമായി രണ്ടിടത്തും നിലനിർത്തി.
- source_word: תִּקַּח נָשִׁים עַל בְּנֹתַי
  choice: എന്റെ പുത്രിമാരെക്കൂടാതെ വേറെ ഭാര്യമാരെ സ്വീകരിക്കുക
  rationale: പുത്രിമാരെ ഉപേക്ഷിച്ച് പകരം സ്ത്രീകളെ എടുക്കുക എന്നല്ല, അവർക്കു പുറമേ അധിക ഭാര്യമാരെ എടുക്കുക എന്നതാണ് עַל എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം.
- source_word: אֵין אִישׁ עִמָּנוּ
  choice: നമ്മോടൊപ്പം ഒരു മനുഷ്യനും ഇല്ലെങ്കിലും
  rationale: അവിടെ മനുഷ്യസാക്ഷി ഇല്ലെന്ന ആശയം സംരക്ഷിക്കുന്നു. സന്ദർഭത്തിലെ വഴങ്ങൽഭാവം ‘ഇല്ലെങ്കിലും’ എന്ന രൂപത്തിൽ പ്രകടമാക്കി.
- source_word: רְאֵה
  choice: നോക്കുക
  rationale: ഗൗരവമുള്ള മുന്നറിയിപ്പിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന നേരിട്ടുള്ള ആജ്ഞാരൂപം.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഉടമ്പടിയുടെ സാക്ഷിയായി വിളിച്ചപേക്ഷിക്കപ്പെടുന്ന ഏക ദൈവത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: עֵד
  choice: സാക്ഷിയാണ്
  rationale: ഉടമ്പടിസൂത്രത്തിലെ വിധേയനാമം; മലയാളത്തിൽ ‘ദൈവം സാക്ഷിയാണ്’ എന്നത് സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: എനിക്കും നിനക്കും മധ്യേ
  rationale: രണ്ടു ഉടമ്പടികക്ഷികൾക്കിടയിലെ ഉത്തരവാദിത്വബന്ധം കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: אִישׁ എന്ന പദത്തിന്റെ പൊതുവായ മനുഷ്യാർഥം
  choice: ഒരു മനുഷ്യനും ഇല്ലെങ്കിലും
  alternative: ആരും നമ്മോടൊപ്പം ഇല്ലെങ്കിലും
  rationale: മൂലപദത്തിന്റെ മനുഷ്യൻ എന്ന നിർദിഷ്ട രൂപം നിലനിർത്തിക്കൊണ്ട്, ദൈവത്തിൽനിന്ന് വ്യത്യസ്തമായി ഒരു മനുഷ്യസാക്ഷിയും ഇല്ലെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘പുത്രിമാർ’, ‘മധ്യേ’, ‘സാക്ഷി’ എന്നിവ ഉടമ്പടിസന്ദർഭത്തിന്റെ ഔന്നത്യം നിലനിർത്തുന്നു; വാക്യത്തിലെ ദൈവിക സാക്ഷിയും മനുഷ്യസാക്ഷിയുടെ അഭാവവും തമ്മിലുള്ള സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിച്ചിട്ടുണ്ട്.
