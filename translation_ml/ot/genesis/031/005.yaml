id: GEN.31.5
reference: Genesis 31:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ן רֹאֶ֤ה אָנֹכִי֙ אֶת פְּנֵ֣י אֲבִי/כֶ֔ן כִּֽי אֵינֶ֥/נּוּ אֵלַ֖/י כִּ/תְמֹ֣ל שִׁלְשֹׁ֑ם וֵֽ/אלֹהֵ֣י אָבִ֔/י הָיָ֖ה עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/005.yaml
  text: And he said to them[a], “I see that your father's face is not toward me as before, but the God of my father has been with me.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങളുടെ അപ്പന്റെ മുഖഭാവം എന്നോടുള്ളത് മുമ്പത്തെപ്പോലെയല്ലെന്ന് ഞാൻ കാണുന്നു[a]. എന്നാൽ എന്റെ പിതാവിന്റെ ദൈവം എന്നോടുകൂടെ ഉണ്ടായിരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പദശഃ: “ഇന്നലെയും അതിനു മൂന്നുദിവസം മുമ്പും പോലെ അല്ല”; ‘മുമ്പത്തെപ്പോലെയല്ല’ എന്നർത്ഥമുള്ള ഒരു എബ്രായ ശൈലി.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶן
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: വയിക്തോൽ ആഖ്യാനത്തിലെ തുടർച്ചയായ പ്രവൃത്തിയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. സ്ത്രീലിംഗ ബഹുവചനമായ לָהֶן റാഹേലിനെയും ലേയയെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘അവരോട്’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: רֹאֶה אָנֹכִי
  choice: ഞാൻ കാണുന്നു
  rationale: സ്വതന്ത്ര സർവനാമത്തോടുകൂടിയ കർത്തൃവാചക രൂപം യാക്കോബിന്റെ ഇപ്പോഴത്തെ തിരിച്ചറിവിനെ ഊന്നിപ്പറയുന്നു; വർത്തമാനകാലം അതിനെ സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: אֶת־פְּנֵי אֲבִיכֶן
  choice: നിങ്ങളുടെ അപ്പന്റെ മുഖഭാവം
  rationale: പദശഃ ‘മുഖം’ എന്നാണെങ്കിലും സന്ദർഭത്തിൽ അത് ലാബാന്റെ മനോഭാവമോ സമീപനമോ വ്യക്തമാക്കുന്നു. ‘മുഖഭാവം’ മൂലരൂപകവും ഉദ്ദേശ്യവും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: כִּי אֵינֶנּוּ אֵלַי
  choice: എന്നോട് ... അല്ല
  rationale: മുഖം യാക്കോബിന്റെ നേരെ ആയിരിക്കുക എന്ന സ്ഥലപരമായ രൂപകം മാറിയ സമീപനത്തെ സൂചിപ്പിക്കുന്നു. ‘അനുകൂലമല്ല’ എന്നു വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ ബന്ധപരമായ ദിശ നിലനിർത്തുന്നു.
- source_word: כִּתְמֹל שִׁלְשֹׁם
  choice: മുമ്പത്തെപ്പോലെ
  rationale: ‘ഇന്നലെയും അതിനു മുമ്പും എന്നപോലെ’ എന്ന പദശഃ പ്രയോഗം മുൻകാലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്. മലയാളത്തിൽ സ്വാഭാവികമായ അർത്ഥം മുഖ്യവാചകത്തിൽ നൽകി, പദശഃ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וֵאלֹהֵי אָבִי
  choice: എന്നാൽ എന്റെ അപ്പന്റെ ദൈവം
  rationale: വാവ് ഇവിടെ ലാബാന്റെ മാറിയ സമീപനവും ദൈവത്തിന്റെ സാന്നിധ്യവും തമ്മിലുള്ള സന്ദർഭപരമായ വൈരുധ്യം കാണിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി. ‘എന്റെ അപ്പന്റെ ദൈവം’ എന്നത് എബ്രായ ബന്ധഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു നൽകുന്നു.
- source_word: הָיָה עִמָּדִי
  choice: എന്നോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: പൂർണ്ണക്രിയ ദൈവത്തിന്റെ ഇതുവരെയുള്ള സാന്നിധ്യവും പിന്തുണയും സംഗ്രഹിക്കുന്നു. മലയാളത്തിലെ ഭൂതകാലപ്രയോഗം സന്ദർഭത്തിൽ ആ തുടരുന്ന പ്രസക്തി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: אֱלֹהֵי אָבִי എന്ന ദൈവപരാമർശത്തിന്റെ വിവർത്തനം
  choice: എന്റെ അപ്പന്റെ ദൈവം
  alternative: എന്റെ പിതാവിന്റെ ദൈവം / എന്റെ അപ്പൻ ആരാധിക്കുന്ന ദൈവം
  rationale: ആദ്യത്തേത് എബ്രായ ഘടനയും കുടുംബബന്ധപരമായ ഉടമ്പടി സ്വരവും നിലനിർത്തുന്നു. ‘ആരാധിക്കുന്ന’ എന്നു ചേർക്കുന്നത് മൂലത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യുമെന്നതിനാൽ ഒഴിവാക്കി.
- issue: ദൈവം ‘കൂടെ ഉണ്ടായിരുന്നു’ എന്ന പ്രയോഗത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: എന്നോടുകൂടെ ഉണ്ടായിരുന്നു
  alternative: എന്നെ സഹായിച്ചു / എന്നെ അനുഗ്രഹിച്ചു
  rationale: സഹായവും സംരക്ഷണവും സന്ദർഭത്തിൽ ഉൾപ്പെട്ടേക്കാമെങ്കിലും മൂലപാഠം സാന്നിധ്യത്തെ നേരിട്ട് പറയുന്നു. അതിനാൽ അതിന്റെ ദൈവശാസ്ത്രപരമായ സമൃദ്ധി ഒരു പ്രത്യേക ഫലത്തിലേക്ക് ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി പിന്തുടർന്നു. കുടുംബസംഭാഷണത്തിന് ചേരുന്ന ‘അപ്പൻ’ ഉപയോഗിച്ചു; ‘മുഖഭാവം’ എന്നത് എബ്രായത്തിലെ ‘മുഖം’ എന്ന ദൃശ്യരൂപകത്തെ വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
