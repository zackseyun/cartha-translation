id: GEN.31.16
reference: Genesis 31:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י כָל הָ/עֹ֗שֶׁר אֲשֶׁ֨ר הִצִּ֤יל אֱלֹהִים֙ מֵֽ/אָבִ֔י/נוּ לָ֥/נוּ ה֖וּא וּ/לְ/בָנֵ֑י/נוּ וְ/עַתָּ֗ה כֹּל֩ אֲשֶׁ֨ר אָמַ֧ר אֱלֹהִ֛ים אֵלֶ֖י/ךָ עֲשֵֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/016.yaml
  text: For all the wealth that God has taken from our father belongs to us and to our children. So now[a], whatever God has said to you, do.
translation:
  language: ml
  text: ദൈവം നമ്മുടെ അപ്പനിൽനിന്ന് എടുത്തുമാറ്റിയ[a] സമ്പത്തെല്ലാം നമുക്കും നമ്മുടെ മക്കൾക്കും ഉള്ളതാണല്ലോ. അതുകൊണ്ട് ഇപ്പോൾ ദൈവം നിന്നോടു പറഞ്ഞതെല്ലാം ചെയ്യുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിടുവിച്ച” / “രക്ഷിച്ച.” ഹീബ്രു ക്രിയയ്ക്ക് പലപ്പോഴും ‘വിടുവിക്കുക,’ ‘രക്ഷിക്കുക’ എന്ന അർഥമുണ്ട്; ഇവിടെ ദൈവം ലാബാനിൽനിന്ന് സമ്പത്ത് എടുത്തുമാറ്റിയതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ആണല്ലോ
  rationale: സഹോദരിമാർ യാക്കോബിനോടു യോജിക്കുന്നതിന്റെ വിശദീകരണഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: כָל הָעֹשֶׁר
  choice: സമ്പത്തെല്ലാം
  rationale: കന്നുകാലികളും മറ്റു ഭൗതിക ആസ്തികളും ഉൾക്കൊള്ളാവുന്ന വിശാലവും സ്വാഭാവികവുമായ പദപ്രയോഗം.
- source_word: הִצִּיל
  choice: വീണ്ടെടുത്ത
  rationale: ഹിഫ്ഇൽ രൂപത്തിന്റെ ‘വിടുവിക്കുക/രക്ഷിച്ചെടുക്കുക’ എന്ന അടിസ്ഥാനഭാവം നിലനിർത്തുകയും, സന്ദർഭത്തിൽ ലാബാനിൽനിന്ന് സമ്പത്ത് മാറ്റിയെടുത്ത ദൈവിക പ്രവൃത്തിയെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מֵאָבִינוּ
  choice: നമ്മുടെ അപ്പനിൽനിന്ന്
  rationale: מן സൂചിപ്പിക്കുന്ന ഉറവിടത്തെ നേരിട്ടും വ്യക്തമായും നൽകുന്നു; സംഭാഷണത്തിൽ ‘അപ്പൻ’ സ്വാഭാവികമാണ്.
- source_word: לָנוּ הוּא וּלְבָנֵינוּ
  choice: നമുക്കും നമ്മുടെ മക്കൾക്കും ഉള്ളതാണ്
  rationale: ഹീബ്രുവിലെ അവകാശം/ഉടമസ്ഥത എന്ന ആശയം വ്യക്തമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: കാരണവിവരണത്തിൽനിന്ന് തുടർന്നുള്ള ആഹ്വാനത്തിലേക്കുള്ള നിഗമനപരമായ മാറ്റം വ്യക്തമാക്കുന്നു.
- source_word: כֹּל אֲשֶׁר אָמַר אֱלֹהִים אֵלֶיךָ
  choice: ദൈവം നിന്നോടു പറഞ്ഞതെല്ലാം
  rationale: മുഴുവൻ കാര്യങ്ങളെയും ഉൾക്കൊള്ളുന്ന כֹּל אֲשֶׁר എന്ന പ്രയോഗം സ്വാഭാവികമായി പകരുന്നു.
- source_word: עֲשֵׂה
  choice: ചെയ്യുക
  rationale: ഹീബ്രുവിലെ സംക്ഷിപ്തമായ ആജ്ഞാരൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലാബാന്റെ സമ്പത്തിന്മേലുള്ള ദൈവിക പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: വീണ്ടെടുത്ത
  alternative: എടുത്ത / എടുത്തുമാറ്റിയ
  rationale: נצל എന്ന ക്രിയയുടെ രക്ഷിക്കുക, വിടുവിക്കുക, വീണ്ടെടുക്കുക എന്നീ അർത്ഥസാധ്യതകൾ സംരക്ഷിക്കുന്നു. അതേസമയം ഇവിടെ വസ്തു സമ്പത്തായതിനാൽ ‘എടുത്ത’ എന്ന സന്ദർഭാർഥവും അടിക്കുറിപ്പിൽ നൽകുന്നു; ദൈവിക മോഷണമെന്ന ധാരണയോ പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനമോ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രാഹേലും ലേയയും തങ്ങളുടെ പിതാവിനെക്കുറിച്ച് യാക്കോബിനോടു സംസാരിക്കുന്നതിനാൽ ‘അപ്പൻ’ എന്ന സ്വാഭാവിക കുടുംബപദം ഉപയോഗിച്ചു; വാക്യത്തിന്റെ നിഗമനഭാവവും ആജ്ഞയുടെ സംക്ഷിപ്തതയും നിലനിർത്തി.
