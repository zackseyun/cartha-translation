id: GEN.31.41
reference: Genesis 31:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זֶה לִּ֞/י עֶשְׂרִ֣ים שָׁנָה֮ בְּ/בֵיתֶ/ךָ֒ עֲבַדְתִּ֜י/ךָ אַרְבַּֽע עֶשְׂרֵ֤ה שָׁנָה֙ בִּ/שְׁתֵּ֣י בְנֹתֶ֔י/ךָ וְ/שֵׁ֥שׁ שָׁנִ֖ים בְּ/צֹאנֶ֑/ךָ וַ/תַּחֲלֵ֥ף אֶת מַשְׂכֻּרְתִּ֖/י עֲשֶׂ֥רֶת מֹנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/041.yaml
  text: 'These twenty years I have been in your house: I served you fourteen years for your two daughters[a], and six years for your flock, and you changed my wages ten times.'
translation:
  language: ml
  text: ഈ ഇരുപത് വർഷമായി ഞാൻ നിന്റെ വീട്ടിൽ ഉണ്ടായിരുന്നു. നിന്റെ രണ്ടു പുത്രിമാർക്കുവേണ്ടി പതിന്നാലു വർഷവും നിന്റെ ആട്ടിൻപറ്റത്തിനുവേണ്ടി ആറു വർഷവും ഞാൻ നിന്നെ സേവിച്ചു; നീ എന്റെ കൂലി പത്ത് പ്രാവശ്യം മാറ്റി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה לִּי עֶשְׂרִים שָׁנָה
  choice: ഈ ഇരുപതു വർഷം
  rationale: കാലദൈർഘ്യം ചൂണ്ടിക്കാണിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യസൂചന നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാള കാലപ്രയോഗമായി നൽകി.
- source_word: בְּבֵיתֶךָ
  choice: നിന്റെ വീട്ടിൽ
  rationale: בַּיִת എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘വീട്’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വീട്ടുകാരെയും ഉൾക്കൊള്ളാവുന്ന പ്രയോഗമാണിത്.
- source_word: עֲבַדְתִּיךָ
  choice: ഞാൻ നിന്നെ സേവിച്ചു
  rationale: ലാബാനുവേണ്ടി ചെയ്ത അധ്വാനവും വ്യക്തിപരമായ സേവനബന്ധവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: אַרְבַּע עֶשְׂרֵה שָׁנָה בִּשְׁתֵּי בְנֹתֶיךָ
  choice: നിന്റെ രണ്ടു പുത്രിമാർക്കുവേണ്ടി പതിന്നാലു വർഷം
  rationale: വിവാഹത്തിനായുള്ള സേവനക്രമം അധിക വിശദീകരണം ചേർക്കാതെ ബְּ എന്ന ബന്ധത്തെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְשֵׁשׁ שָׁנִים בְּצֹאנֶךָ
  choice: നിന്റെ ആട്ടിൻപറ്റത്തിനുവേണ്ടി ആറു വർഷം
  rationale: צֹאן എന്നത് ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന കൂട്ടനാമമാണ്; മലയാളത്തിലെ ‘ആട്ടിൻപറ്റം’ ആ കൂട്ടാർഥം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: וַתַּחֲלֵף
  choice: നീ മാറ്റി
  rationale: ഹിഫീൽ രൂപത്തിന്റെ മാറ്റുക/പകരംവയ്ക്കുക എന്ന അർഥം നേരിട്ട് നൽകുന്നു; ആവർത്തനം ‘പത്തു പ്രാവശ്യം’ വ്യക്തമാക്കുന്നു.
- source_word: מַשְׂכֻּרְתִּי
  choice: എന്റെ കൂലി
  rationale: തൊഴിൽസന്ദർഭത്തിൽ വേതനം എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: പത്തു പ്രാവശ്യം
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘കണക്കുകൾ’ എന്നതിനു പകരം ആവർത്തനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയുടെ അംഗീകൃത അർഥം നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവും നേരിട്ടുള്ളതുമായ ശൈലി. എബ്രായത്തിന്റെ മുൻനിർത്തിയ കാലഘടന സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ നിലനിർത്തി; അനാവശ്യമായ വ്യാഖ്യാനവിശദീകരണം ചേർത്തിട്ടില്ല.
