- from: അപ്പോൾ യാക്കോബ് ആളയച്ച് റാഹേലിനെയും ലേയയെയും വയലിൽ തന്റെ ആട്ടിൻകൂട്ടത്തിന്റെ അടുത്തേക്കു വിളിപ്പിച്ചു.
  to: അപ്പോൾ യാക്കോബ് റാഹേലിനെയും ലേയയെയും തന്റെ ആട്ടിൻകൂട്ടത്തിനരികെയുള്ള വയലിലേക്കു വിളിച്ചയച്ചു.
