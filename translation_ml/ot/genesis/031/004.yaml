source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח יַעֲקֹ֔ב וַ/יִּקְרָ֖א לְ/רָחֵ֣ל וּ/לְ/לֵאָ֑ה הַ/שָּׂדֶ֖ה אֶל צֹאנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/004.yaml
  text: So Jacob sent and called Rachel and Leah to the field[a], to his flock[b],
translation:
  language: ml
  text: അപ്പോൾ യാക്കോബ് റാഹേലിനെയും ലേയയെയും തന്റെ ആട്ടിൻകൂട്ടത്തിനരികെയുള്ള വയലിലേക്കു വിളിച്ചയച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ആളയച്ച്
  rationale: ശׁלח എന്ന ക്രിയ യാക്കോബ് മറ്റൊരാളെ അയച്ച് ഭാര്യമാരെ വരുത്തിയെന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ ‘ആളയച്ച്’ ഈ സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקְרָא
  choice: വിളിപ്പിച്ചു
  rationale: קרא + לְ ഇവിടെ ആളുകളെ വിളിച്ചുവരുത്തുക എന്ന അർഥത്തിലാണ്. മുമ്പുള്ള ‘ആളയച്ച്’ എന്നതോടൊപ്പം ‘വിളിപ്പിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לְרָחֵל וּלְלֵאָה
  choice: റാഹേലിനെയും ലേയയെയും
  rationale: പേരുകൾ ആധുനിക മലയാള ബൈബിൾ പ്രയോഗത്തിന് അനുയോജ്യമായി ലിപ്യന്തരിച്ചു; കർമബന്ധം ‘-യെയും’കൊണ്ട് സൂചിപ്പിച്ചു.
- source_word: הַשָּׂדֶה
  choice: വയലിൽ
  rationale: שׂדה തുറസ്സായ വയൽപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. ദിശാസൂചകമായ അന്തിമ ה ഉണ്ടായാലും തുടർന്നുള്ള സ്ഥലം വ്യക്തമാക്കുന്ന പ്രയോഗവുമായി ചേർന്ന് മലയാളത്തിൽ ‘വയലിൽ ... അടുത്തേക്ക്’ സ്വാഭാവികമാണ്.
- source_word: אֶל צֹאנוֹ
  choice: തന്റെ ആട്ടിൻകൂട്ടത്തിന്റെ അടുത്തേക്ക്
  rationale: צֹאן ചെറുകന്നുകാലികളുടെ കൂട്ടത്തെ, ഈ സന്ദർഭത്തിൽ പ്രധാനമായും ആട്ടിൻകൂട്ടത്തെ, സൂചിപ്പിക്കുന്നു. אֶל എന്നതിന്റെ ദിശാസൂചകത ‘അടുത്തേക്ക്’ നിലനിർത്തുന്നു; ‘തന്റെ’ യാക്കോബിലേക്കുള്ള ഉടമസ്ഥബന്ധം വ്യക്തമാക്കുന്നു.
