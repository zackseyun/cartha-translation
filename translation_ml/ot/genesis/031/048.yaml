- source_word: עֵד
  choice: സാക്ഷിയാണ്
  rationale: കക്ഷികൾക്കിടയിലെ ഉടമ്പടിക്ക് സാക്ഷ്യചിഹ്നമായി കൂമ്പാരം പ്രവർത്തിക്കുന്ന നിയമപരവും ബന്ധപരവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: בֵּינִי וּבֵינְךָ
  choice: എനിക്കും നിനക്കും മധ്യേ
  rationale: എബ്രായത്തിലെ രണ്ടു ഏകവചന കക്ഷികളെയും നേരിട്ട് പരാമർശിക്കുന്ന രൂപം സംരക്ഷിച്ചു.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: കാലസൂചനയുടെ ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: പേരിടലിന്റെ കാരണബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: קָרָא שְׁמוֹ
  choice: അവൻ അതിന് ... എന്നു പേരിട്ടു
  rationale: മൂന്നാംപുരുഷ ഏകവചന ക്രിയയെ നിലനിർത്തുകയും മലയാളത്തിലെ സ്വാഭാവിക പേരിടൽപ്രയോഗം ഉപയോഗിക്കുകയും ചെയ്തു.
- source_word: גַּלְעֵד
  choice: ഗലേദ്
  rationale: സ്ഥലപ്പേര് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; പേരിലുള്ള പദപ്രയോഗം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
