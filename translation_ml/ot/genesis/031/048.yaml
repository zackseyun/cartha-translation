  text: And Laban said[a], “This heap is a witness between me and you today.” Therefore he called its name Galeed.
translation:
  language: ml
  text: 'ലാബാൻ പറഞ്ഞു: “ഇന്ന് എനിക്കും നിനക്കും മധ്യേ ഈ കൽക്കൂമ്പാരം സാക്ഷിയാണ്.” അതുകൊണ്ട് അവൻ അതിന് ഗലേദ്[a] എന്നു പേരിട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഗലേദ്” എന്ന എബ്രായനാമത്തിന്റെ അർഥം “സാക്ഷിയുടെ കൽക്കൂമ്പാരം” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കഥനക്രമത്തിന് പ്രത്യേകം ‘അപ്പോൾ’ ചേർക്കേണ്ടതില്ല.
- source_word: לָבָן
  choice: ലാബാൻ
  rationale: വ്യക്തിനാമം പരിഭാഷപ്പെടുത്താതെ മലയാള ലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: הַגַּל הַזֶּה
  choice: ഈ കൽക്കൂമ്പാരം
