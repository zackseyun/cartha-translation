  text: זֶה֩ עֶשְׂרִ֨ים שָׁנָ֤ה אָנֹכִי֙ עִמָּ֔/ךְ רְחֵלֶ֥י/ךָ וְ/עִזֶּ֖י/ךָ לֹ֣א שִׁכֵּ֑לוּ וְ/אֵילֵ֥י צֹאנְ/ךָ֖ לֹ֥א אָכָֽלְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/038.yaml
  text: These twenty years I have been with you; your ewes and your female goats have not miscarried[a], and I have not eaten the rams of your flock.
translation:
  language: ml
  text: ഈ ഇരുപത് വർഷമായി ഞാൻ നിന്നോടുകൂടെ കഴിഞ്ഞിരിക്കുന്നു. നിന്റെ പെൺചെമ്മരിയാടുകളും പെൺകോലാടുകളും ഗർഭം അലസിയിട്ടില്ല[a]; നിന്റെ ആട്ടിൻകൂട്ടത്തിലെ ആൺചെമ്മരിയാടുകളെ ഞാൻ തിന്നിട്ടുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കുഞ്ഞുങ്ങളെ നഷ്ടപ്പെടുത്തിയിട്ടില്ല.’ എബ്രായ ക്രിയയ്ക്ക് സന്താനത്തെ നഷ്ടപ്പെടുക എന്ന അർഥവും വരാം; ഈ ഇടയസന്ദർഭത്തിൽ അത് ഗർഭം അലസുന്നതിനെയോ കുഞ്ഞുങ്ങളെ നഷ്ടപ്പെടുന്നതിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשְׂרִים שָׁנָה
  choice: ഈ ഇരുപതു വർഷം
  rationale: ‘ഈ ഇരുപതു വർഷം’ എന്ന പ്രയോഗം എബ്രായത്തിലെ നിർദേശകഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി മുഴുവൻ കാലയളവിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: אָנֹכִי עִמָּךְ
  choice: ഞാൻ നിന്നോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: മൂലത്തിൽ വ്യക്തമായ ക്രിയ ഇല്ലെങ്കിലും, സന്ദർഭത്തിൽ യാക്കോബ് കഴിഞ്ഞ ഇരുപതു വർഷത്തെ കൂടെയിരിപ്പും സേവനവും സംഗ്രഹിക്കുന്നു; മലയാളത്തിൽ ഭൂതകാലപ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: רְחֵלֶיךָ
  choice: നിന്റെ പെൺചെമ്മരിയാടുകൾ
  rationale: ഈ പദം പൊതുവായി ചെമ്മരിയാടുകളെയല്ല, അവയിലെ പെൺമൃഗങ്ങളെയാണ് പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്.
- source_word: וְעִזֶּיךָ
  choice: പെൺകോലാടുകൾ
  rationale: മൂലപദം പെൺകോലാടുകളെ സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗസവിശേഷത വിവർത്തനത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֹא שִׁכֵּלוּ
  choice: ഗർഭം അലസിയിട്ടില്ല
  rationale: കന്നുകാലിപരിപാലനത്തിന്റെ ഈ സന്ദർഭത്തിൽ പദം കുഞ്ഞിനെ നഷ്ടപ്പെടുന്നതിനെയോ ഗർഭം അലസുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; പ്രധാന പാഠത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമായ അർഥം നൽകിയിരിക്കുന്നു.
- source_word: וְאֵילֵי צֹאנְךָ
  choice: നിന്റെ ആട്ടിൻകൂട്ടത്തിലെ മുട്ടാടുകൾ
  rationale: אֵילִים ആൺചെമ്മരിയാടുകളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അതിനുള്ള സാധാരണ പദമായ ‘മുട്ടാടുകൾ’ ഉപയോഗിച്ച് കൂട്ടത്തോടുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: לֹא אָכָלְתִּי
  choice: ഞാൻ തിന്നിട്ടുമില്ല
  rationale: ഇരുപതു വർഷം മുഴുവൻ പാലിച്ചിരുന്ന പ്രവൃത്തിയെ പിന്നോട്ടുനോക്കി നിഷേധിക്കുന്ന ഭാവം ‘തിന്നിട്ടുമില്ല’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
