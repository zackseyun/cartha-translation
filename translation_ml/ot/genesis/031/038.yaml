  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ ശൈലി സ്വീകരിച്ചു. മൃഗങ്ങളുടെ ലിംഗസവിശേഷതയും ഇടയജീവിതവുമായി ബന്ധപ്പെട്ട പദാർത്ഥവും കഴിയുന്നത്ര കൃത്യമായി നിലനിർത്തി.
