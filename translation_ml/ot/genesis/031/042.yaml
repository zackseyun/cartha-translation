base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/042.yaml
  text: If the God of my father[a], the God of Abraham, and the Fear of Isaac, had not been with me, surely by now you would have sent me away empty-handed. God saw my affliction and the labor of my hands, and he judged last night.
translation:
  language: ml
  text: എന്റെ പിതാവിന്റെ ദൈവവും, അബ്രാഹാമിന്റെ ദൈവവും, യിസ്ഹാക്കിന്റെ ഭയവും[a] എനിക്കു തുണയായിരുന്നില്ലെങ്കിൽ, നീ ഇപ്പോൾ എന്നെ വെറുംകൈയോടെ പറഞ്ഞയയ്ക്കുമായിരുന്നു. ദൈവം എന്റെ കഷ്ടതയും എന്റെ കൈകളുടെ അധ്വാനവും കണ്ടു; കഴിഞ്ഞ രാത്രി അവിടുന്ന് ന്യായംവിധിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യിസ്ഹാക്ക് ഭയപ്പെടുന്നവൻ.” എബ്രായത്തിൽ അക്ഷരാർഥം “യിസ്ഹാക്കിന്റെ ഭയം” എന്നാണ്; ഇത് ദൈവത്തിനുള്ള സവിശേഷമായ ഒരു വിശേഷണമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵי
  choice: … ഇല്ലായിരുന്നെങ്കിൽ
  rationale: യാഥാർഥ്യത്തിനു വിരുദ്ധമായ ഒരു വ്യവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֱלֹהֵי אָבִי אֱלֹהֵי אַבְרָהָם
  choice: എന്റെ പിതാവിന്റെ ദൈവമായ അബ്രാഹാമിന്റെ ദൈവം
  rationale: ‘എന്റെ പിതാവ്’ ഇവിടെ യിസ്ഹാക്കിനെ സൂചിപ്പിക്കുന്നതിനാൽ, സമാനാധികരണബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: וּפַחַד יִצְחָק
  choice: യിസ്ഹാക്കിന്റെ ഭയം
  rationale: ദൈവത്തിനുള്ള അസാധാരണമായ എബ്രായ വിശേഷണം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ അതിന്റെ ഭാഷാപരവും ദൈവശാസ്ത്രപരവുമായ സവിശേഷത നിലനിർത്തുന്നു.
- source_word: הָיָה לִי
  choice: എനിക്കു തുണയായിരുന്നില്ലെങ്കിൽ
  rationale: സന്ദർഭത്തിൽ ദൈവത്തിന്റെ സാന്നിധ്യവും പിന്തുണയും സൂചിപ്പിക്കുന്ന പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: רֵיקָם שִׁלַּחְתָּנִי
  choice: എന്നെ വെറുംകൈയോടെ പറഞ്ഞയയ്ക്കുമായിരുന്നു
  rationale: ഒന്നും നൽകാതെ വിട്ടയയ്ക്കുക എന്ന ആശയം മലയാളത്തിലെ പതിവുപ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: עָנְיִי
  choice: എന്റെ കഷ്ടത
  rationale: ദാരിദ്ര്യം മാത്രമല്ല, യാക്കോബ് അനുഭവിച്ച ദുരിതവും പീഡനവും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥം നൽകുന്നു.
- source_word: יְגִיעַ כַּפַּי
  choice: എന്റെ കൈകളുടെ അധ്വാനം
  rationale: കഠിനാധ്വാനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: וַיּוֹכַח
  choice: വിധി കല്പിച്ചു
  rationale: ക്രിയയിലെ വിധിനിർണയത്തിന്റെയും ശാസനയുടെയും സാധ്യതകളിൽ ന്യായവിധിയുടെ ഭാവം നിലനിർത്തുന്നു; എബ്രായത്തിൽ വ്യക്തമല്ലാത്ത കർമം ചേർക്കുന്നില്ല.
- source_word: אָמֶשׁ
  choice: കഴിഞ്ഞ രാത്രി
  rationale: മുൻ രാത്രിയെ സൂചിപ്പിക്കുന്ന സമയപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: וּפַחַד יִצְחָק എന്ന ദൈവിക വിശേഷണത്തിന്റെ വിവർത്തനം
  choice: യിസ്ഹാക്കിന്റെ ഭയം
  alternative: യിസ്ഹാക്ക് ഭയപ്പെടുന്നവൻ
  rationale: മൂലപാഠത്തിലെ അസാധാരണവും ഉദ്ദേശപൂർവം ദ്വയാർഥസാധ്യതയുള്ളതുമായ വിശേഷണം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; വ്യാഖ്യാനപരമായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: וַיּוֹכַח എന്ന ക്രിയയുടെ കർമവും അർഥനിറവും
  choice: അവിടുന്ന് വിധി കല്പിച്ചു
  alternative: അവിടുന്ന് ശാസിച്ചു / നമുക്കിടയിൽ തീർപ്പുകല്പിച്ചു
  rationale: മൂലപാഠത്തിൽ വ്യക്തമായ കർമമില്ല. അതിനാൽ ‘നിന്നെ’ എന്നു ചേർക്കാതെ, ന്യായവിധിയും ശാസനയും ഉൾക്കൊള്ളാവുന്ന അർഥതലം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. അസാധാരണമായ ദൈവിക വിശേഷണം മുഖ്യപാഠത്തിൽ ഔപചാരികമായി നിലനിർത്തുകയും, മറ്റു ഭാഗങ്ങളിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ പ്രയോഗങ്ങൾ തിരഞ്ഞെടുക്കുകയും ചെയ്തു.
