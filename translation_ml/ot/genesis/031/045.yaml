source:
  edition: WLC
  text: וַ/יִּקַּ֥ח יַעֲקֹ֖ב אָ֑בֶן וַ/יְרִימֶ֖/הָ מַצֵּבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/045.yaml
  text: Then Jacob took a stone and set it up as a pillar[a].
translation:
  language: ml
  text: അപ്പോൾ യാക്കോബ് ഒരു കല്ലെടുത്ത് അതിനെ ഒരു കൽത്തൂണായി[a] നാട്ടിനിർത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നാട്ടിയ കല്ല്” അല്ലെങ്കിൽ “സ്മാരകക്കല്ല്.” എബ്രായപദമായ מַצֵּבָה കുത്തനെ സ്ഥാപിച്ച കൽചിഹ്നത്തെയോ കൽത്തൂണിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: എടുത്ത്
  rationale: לקח എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘എടുക്കുക’ എന്നത് തുടർച്ചയായ ആഖ്യാനശൈലിയിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יַעֲקֹב
  choice: യാക്കോബ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ പേരുരൂപം.
- source_word: אָבֶן
  choice: ഒരു കല്ല്
  rationale: ഏകവചന നാമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അനിശ്ചിത സംഖ്യാവാചകത്തോടുകൂടെ നൽകുന്നു.
- source_word: וַיְרִימֶהָ
  choice: അതിനെ ... നാട്ടിനിർത്തി
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം കല്ലിനെ സൂചിപ്പിക്കുന്നു; മַצֵּבָהയായി കല്ല് കുത്തനെ സ്ഥാപിക്കുന്ന പ്രവൃത്തി ‘നാട്ടിനിർത്തി’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: מַצֵּבָה
  choice: ഒരു കൽത്തൂണായി
  rationale: കുത്തനെ സ്ഥാപിച്ച കൽചിഹ്നം അഥവാ തൂൺ എന്ന അടിസ്ഥാനാർഥം നൽകുന്നു; ഈ വാക്യം വ്യക്തമാക്കാത്ത സ്മാരകപരമോ ആരാധനാപരമോ ആയ ഉദ്ദേശ്യം പ്രധാന പാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: מַצֵּבָה എന്ന പദത്തിന് സ്മാരകപരമോ ആരാധനാപരമോ ആയ ബന്ധങ്ങൾ ഉണ്ടാകാവുന്ന സാഹചര്യത്തിലെ വിവർത്തനം
  choice: കൽത്തൂൺ
  alternative: നാട്ടിയ കല്ല്; സ്മാരകക്കല്ല്
  rationale: വാക്യം കല്ല് കുത്തനെ സ്ഥാപിച്ച പ്രവൃത്തിയാണ് നേരിട്ട് പറയുന്നത്; അതിന്റെ പ്രത്യേക ഉദ്ദേശ്യം ഇവിടെ നിർവചിക്കുന്നില്ല. അതിനാൽ ‘കൽത്തൂൺ’ ഭൗതികരൂപം നിലനിർത്തുകയും അധിക വ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘നാട്ടിനിർത്തി’ കല്ല് കുത്തനെ സ്ഥാപിക്കുന്ന ദൃശ്യപ്രവൃത്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അടിക്കുറിപ്പ് പദത്തിന്റെ വിശാലമായ അർഥപരിധി സംരക്ഷിക്കുന്നു.
