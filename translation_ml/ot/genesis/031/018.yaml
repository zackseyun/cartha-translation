  text: וַ/יִּנְהַ֣ג אֶת כָּל מִקְנֵ֗/הוּ וְ/אֶת כָּל רְכֻשׁ/וֹ֙ אֲשֶׁ֣ר רָכָ֔שׁ מִקְנֵה֙ קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/פַדַּ֣ן אֲרָ֑ם לָ/ב֛וֹא אֶל יִצְחָ֥ק אָבִ֖י/ו אַ֥רְצָ/ה כְּנָֽעַן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/018.yaml
  text: And he drove all his livestock and all his possessions that he had acquired—the livestock he had acquired in Paddan-aram—to go to Isaac his father in the land of Canaan[a].
translation:
  language: ml
  text: അവൻ തന്റെ എല്ലാ ആടുമാടുകളെയും തെളിച്ചും, താൻ സമ്പാദിച്ച എല്ലാ സ്വത്തുക്കളും കൂട്ടിക്കൊണ്ടും—പദ്ദൻ-അരാമിൽ താൻ സമ്പാദിച്ച ആടുമാടുകളുമായി—കനാൻദേശത്തേക്കു, തന്റെ പിതാവായ യിസ്ഹാക്കിന്റെ അടുക്കലേക്കു പോകാൻ പുറപ്പെട്ടു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “കനാനിലേക്കായി”; എബ്രായത്തിലെ ദിശാസൂചക രൂപം കനാനിലേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנְהַג
  choice: തെളിച്ചുകൊണ്ട് ... യാത്രയായി
  rationale: נהג ഇവിടെ മൃഗങ്ങളെ മുന്നോട്ടു തെളിച്ചുകൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യത്തിന്റെ ലക്ഷ്യവും ചലനവും സ്വാഭാവികമായി അറിയിക്കാൻ പ്രധാനക്രിയയോടു ചേർത്തു.
- source_word: מִקְנֵהוּ
  choice: തന്റെ ആടുമാടുകളെയെല്ലാം
  rationale: מִקְנֶה വിവിധ വളർത്തുമൃഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ‘ആടുമാടുകൾ’ സാധാരണ മലയാളത്തിൽ വിശാലമായ കന്നുകാലിസമ്പത്തിന്റെ സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: רְכֻשׁוֹ
  choice: സകല സ്വത്തുക്കളെയും
  rationale: רְכוּשׁ സമ്പാദിച്ച വസ്തുവകകളെയോ ചലസ്വത്തിനെയോ സൂചിപ്പിക്കുന്നു; ‘സ്വത്തുക്കൾ’ അർത്ഥവ്യാപ്തി ചുരുക്കാതെ വ്യക്തമാണ്.
- source_word: רָכָשׁ
  choice: സമ്പാദിച്ച
  rationale: സ്വത്തോ സമ്പത്തോ നേടിയെടുക്കുക എന്ന സാമ്പത്തിക അർത്ഥം നിലനിർത്തുന്നു; എബ്രായത്തിലെ ആവർത്തനവും മലയാളത്തിൽ സംരക്ഷിച്ചു.
- source_word: מִקְנֵה קִנְיָנוֹ
  choice: താൻ സമ്പാദിച്ച ആടുമാടുകളെയും
  rationale: മൂലത്തിലെ ഊന്നലും ആവർത്തനവും പൂർണമായി മായ്ക്കാതെ, അസ്വാഭാവികമായ പദാനുപദ രൂപം ഒഴിവാക്കി.
- source_word: בְּפַדַּן אֲרָם
  choice: പദ്ദൻ-അരാമിൽ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാള ലിപിയിൽ ശബ്ദാന്തരണം ചെയ്തു.
- source_word: לָבוֹא אֶל יִצְחָק אָבִיו
  choice: തന്റെ പിതാവായ യിസ്ഹാക്കിന്റെ അടുക്കൽ ... യാത്രയായി
  rationale: ലക്ഷ്യസൂചകമായ infinitive-ന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ ഉദ്ദേശ്യസ്ഥാനത്തേക്കുള്ള യാത്രയായി അവതരിപ്പിക്കുന്നു.
- source_word: אַרְצָה כְּנָעַן
  choice: കനാൻദേശത്തേക്കു
  rationale: ദിശാസൂചകമായ -ה രൂപം കനാനിലേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നു; അതിനാൽ ‘-ത്തേക്കു’ എന്നത് മൂലത്തോട് നേരിട്ട് യോജിക്കുന്നു.
