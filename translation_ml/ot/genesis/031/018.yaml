translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ‘സമ്പാദിച്ച’ എന്ന ആവർത്തനം ആശയഊന്നലിനായി നിലനിർത്തി; ഡാഷുകൾ വിശദീകരണസ്വഭാവമുള്ള ആവർത്തിത ഘടകത്തെ വേർതിരിക്കുന്നു.
