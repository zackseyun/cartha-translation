id: GEN.31.8
reference: Genesis 31:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִם כֹּ֣ה יֹאמַ֗ר נְקֻדִּים֙ יִהְיֶ֣ה שְׂכָרֶ֔/ךָ וְ/יָלְד֥וּ כָל הַ/צֹּ֖אן נְקֻדִּ֑ים וְ/אִם כֹּ֣ה יֹאמַ֗ר עֲקֻדִּים֙ יִהְיֶ֣ה שְׂכָרֶ֔/ךָ וְ/יָלְד֥וּ כָל הַ/צֹּ֖אן עֲקֻדִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/008.yaml
  text: If he said this, ‘The speckled will be your wages,’ then all the flock bore speckled young; and if he said this, ‘The streaked will be your wages,’ then all the flock bore streaked young.
translation:
  language: ml
  text: ‘പുള്ളിയുള്ളവ നിന്റെ കൂലിയായിരിക്കും’ എന്ന് അവൻ പറഞ്ഞാൽ, ആട്ടിൻകൂട്ടം മുഴുവൻ പുള്ളിയുള്ള കുഞ്ഞുങ്ങളെ പ്രസവിച്ചു; ‘വരയുള്ളവ നിന്റെ കൂലിയായിരിക്കും’ എന്ന് അവൻ പറഞ്ഞാൽ, ആട്ടിൻകൂട്ടം മുഴുവൻ വരയുള്ള കുഞ്ഞുങ്ങളെ പ്രസവിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְקֻדִּים
  choice: പുള്ളിയുള്ളവ
  rationale: ശരീരത്തിൽ പുള്ളികളോ കുത്തുകളോ ഉള്ള മൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന എബ്രായ പദത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാള പരിഭാഷ.
- source_word: עֲקֻדִּים
  choice: വരയുള്ളവ
  rationale: വരകളോ പട്ടകളോ ഉള്ള മൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന പദം; നְקֻדִּים എന്നതിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: שְׂכָרֶךָ
  choice: നിന്റെ കൂലി
  rationale: യാക്കോബിന് തൊഴിൽപ്രതിഫലമായി നിശ്ചയിച്ച മൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: וְיָלְדוּ כָל־הַצֹּאן
  choice: ആട്ടിൻകൂട്ടം മുഴുവൻ ... കുഞ്ഞുങ്ങളെ പ്രസവിച്ചു
  rationale: എബ്രായത്തിലെ പ്രസവത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയും കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന നാമവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ പ്രസവിച്ച കുഞ്ഞുങ്ങളുടെ അടയാളമാണ് ഉദ്ദേശ്യം.
theological_decisions:
- issue: മൃഗങ്ങളുടെ വർണലക്ഷണങ്ങൾ മാറിമാറി കൂലിയായി നിശ്ചയിച്ചപ്പോഴുണ്ടായ ഫലം
  choice: രണ്ടു വ്യവസ്ഥകളിലും അതത് ലക്ഷണമുള്ള കുഞ്ഞുങ്ങളെയാണ് കൂട്ടം പ്രസവിച്ചതെന്ന് ആവർത്തനഘടനയോടെ നിലനിർത്തി.
  alternative: സംഭവത്തെ ദൈവിക ഇടപെടലായി ഈ വാക്യത്തിൽ തന്നെ വിശദീകരിക്കുക.
  rationale: മൂലവാക്യം ഫലം മാത്രമാണ് വിവരിക്കുന്നത്; അതിന്റെ ദൈവശാസ്ത്രപരമായ കാരണം സമീപസന്ദർഭത്തിൽ വരുന്നതിനാൽ ഇവിടെ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ മാന്യമായ മലയാളം. മൂലത്തിലെ സമാന്തര നിബന്ധനാഘടന നിലനിർത്തിയിട്ടുണ്ട്; ഇംഗ്ലീഷിലെ അനാവശ്യമായ ‘this’ മലയാളത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
