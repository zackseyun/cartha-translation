id: GEN.31.46
reference: Genesis 31:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יַעֲקֹ֤ב לְ/אֶחָי/ו֙ לִקְט֣וּ אֲבָנִ֔ים וַ/יִּקְח֥וּ אֲבָנִ֖ים וַ/יַּֽעֲשׂוּ גָ֑ל וַ/יֹּ֥אכְלוּ שָׁ֖ם עַל הַ/גָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/046.yaml
  text: Then Jacob said to his brothers[a], “Gather stones.” So they took stones and made a heap[b], and they ate there by the heap.
translation:
  language: ml
  text: അപ്പോൾ യാക്കോബ് തന്റെ സഹോദരന്മാരോടു[a], “കല്ലുകൾ പെറുക്കിക്കൂട്ടുവിൻ” എന്നു പറഞ്ഞു. അവർ കല്ലുകൾ എടുത്ത് ഒരു കൂമ്പാരം ഉണ്ടാക്കി; ആ കൂമ്പാരത്തിനരികെ[b] അവർ ഭക്ഷണം കഴിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സഹോദരന്മാർ” എന്നത് യാക്കോബിന്റെ സ്വന്തം സഹോദരന്മാരെ മാത്രം സൂചിപ്പിക്കണമെന്നില്ല; അദ്ദേഹത്തിന്റെ പുരുഷബന്ധുക്കളെയോ കൂട്ടാളികളെയോ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: cultural_note
  - marker: b
    text: അഥവാ “ആ കൂമ്പാരത്തിന്മേൽ.” എബ്രായ ഉപസർഗത്തിന്റെ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള വിവർത്തനം “മേൽ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֶחָיו
  choice: തന്റെ സഹോദരന്മാരോടു
  rationale: אָח എന്ന പദത്തിന്റെ പ്രാഥമിക അർഥം ‘സഹോദരൻ’ എന്നാണ്; ഇവിടെ അത് യാക്കോബിനൊപ്പമുള്ള പുരുഷബന്ധുക്കളെയോ കൂട്ടാളികളെയോ ഉൾക്കൊള്ളാം. മൂലപദത്തോട് അടുത്ത വിവർത്തനം മുഖ്യവാചകത്തിൽ നിലനിർത്തി വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִקְטוּ אֲבָנִים
  choice: കല്ലുകൾ പെറുക്കിക്കൂട്ടുവിൻ
  rationale: לקט ചിതറിക്കിടക്കുന്ന വസ്തുക്കൾ പെറുക്കി ഒരുമിച്ചുകൂട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നു. കല്ലുകൾ ശേഖരിക്കാനുള്ള കല്പന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘പെറുക്കിക്കൂട്ടുവിൻ’ എന്നു നൽകി.
- source_word: וַיִּקְחוּ אֲבָנִים
  choice: അവർ കല്ലുകൾ എടുത്ത്
  rationale: לקח എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘എടുക്കുക’ നിലനിർത്തുന്നു; മുൻവാക്യത്തിലെ ശേഖരണകല്പനയുമായി സ്വാഭാവികമായി ബന്ധപ്പെടുന്നു.
- source_word: וַיַּעֲשׂוּ גָל
  choice: ഒരു കൂമ്പാരം ഉണ്ടാക്കി
  rationale: גַּל ഇവിടെ കല്ലുകൾ കൂട്ടിയുണ്ടാക്കിയ കൂമ്പാരത്തെ സൂചിപ്പിക്കുന്നു. ‘കൽക്കൂന’ എന്നതിനെക്കാൾ ‘കൂമ്പാരം’ സാധാരണ വായനക്കാർക്ക് എളുപ്പവും മൂലത്തിലെ പൊതുവായ പദത്തിന് യോജിച്ചതുമാണ്.
- source_word: עַל הַגָּל
  choice: ആ കൂമ്പാരത്തിനരികെ
  rationale: עַל എന്ന ഉപസർഗത്തിന് ‘മേൽ’ എന്ന നേരിട്ടുള്ള അർഥത്തോടൊപ്പം സന്ദർഭാനുസൃതമായി ‘അരികെ/സമീപത്ത്’ എന്നും അർഥമാകാം. ഭക്ഷണം കഴിച്ച സ്ഥലത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘അരികെ’ മുഖ്യവാചകത്തിൽ നൽകി; ‘മേൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, അന്തസ്സുറ്റതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. കല്പനയിൽ ബഹുവചനത്തെ വ്യക്തമാക്കുന്ന ‘പെറുക്കിക്കൂട്ടുവിൻ’ നിലനിർത്തി. മൂലത്തിലെ ആവർത്തനവും עַל എന്ന പദത്തിന്റെ സ്ഥലസംബന്ധിയായ അനിശ്ചിതത്വവും കഴിയുന്നത്ര സംരക്ഷിച്ചു.
