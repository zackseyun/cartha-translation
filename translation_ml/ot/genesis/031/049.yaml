id: GEN.31.49
reference: Genesis 31:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/מִּצְפָּה֙ אֲשֶׁ֣ר אָמַ֔ר יִ֥צֶף יְהוָ֖ה בֵּינִ֣/י וּ/בֵינֶ֑/ךָ כִּ֥י נִסָּתֵ֖ר אִ֥ישׁ מֵ/רֵעֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/049.yaml
  text: And Mizpah[a], because he said[b], “May Yahweh watch between me and you when we are hidden from each other.”
translation:
  language: ml
  text: 'മിസ്പാ[a] എന്നും—അവൻ പറഞ്ഞതുകൊണ്ട്: “നാം പരസ്പരം കാണാതിരിക്കുമ്പോൾ യഹോവ എനിക്കും നിനക്കും മധ്യേ കാവലിരിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മിസ്പാ” എന്ന സ്ഥലനാമം “കാവൽസ്ഥലം” അഥവാ “നിരീക്ഷണസ്ഥലം” എന്നർഥമുള്ള ഹീബ്രു പദവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു; “യഹോവ ... കാവലിരിക്കട്ടെ” എന്ന തുടർന്നുള്ള വാക്കുകളുമായി ഇതിന് പദപ്രയോഗബന്ധമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמִּצְפָּה
  choice: മിസ്പാ എന്നും വിളിച്ചു
  rationale: מִצְפָּה ഇവിടെ സ്ഥലനാമമായി വരുന്നു. മുൻസന്ദർഭത്തിൽ നൽകിയ പേരുകളുടെ പട്ടിക മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘എന്നും വിളിച്ചു’ ചേർത്തിരിക്കുന്നു; പേരും ‘കാവലിരിക്കുക’ എന്ന തുടർന്നുള്ള ക്രിയയും തമ്മിലുള്ള ശബ്ദാർഥബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר אָמַר
  choice: കാരണം അവൻ പറഞ്ഞു
  rationale: പേരിടലിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധവാക്യമായി എടുത്തിരിക്കുന്നു. ഹീബ്രുവിലെ കാരണബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יִצֶף
  choice: കാവലിരിക്കട്ടെ
  rationale: צפה എന്ന ധാതുവിന്റെ ‘നോക്കിക്കൊണ്ടിരിക്കുക/കാവലിരിക്കുക’ എന്ന അർഥവും ജസ്സീവ് ആശംസാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള നേരിട്ടുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: എനിക്കും നിനക്കും മധ്യേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിക്രമവും ‘between’ എന്ന ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: כִּי נִסָּתֵר אִישׁ מֵרֵעֵהוּ
  choice: നാം പരസ്പരം കാണാതിരിക്കുമ്പോൾ
  rationale: നിഫാൽ രൂപത്തിലെ ‘മറഞ്ഞിരിക്കുക/കാഴ്ചയിൽപ്പെടാതിരിക്കുക’ എന്ന അർഥം സന്ദർഭോചിതമായി നൽകുന്നു. אִישׁ מֵרֵעֵהוּ എന്ന പരസ്പരപ്രയോഗം ‘പരസ്പരം’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയുള്ളതിനാൽ അതിനെ ‘കർത്താവ്’ എന്ന പദവിയാൽ പകരാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: ‘കാവലിരിക്കുക’ എന്നതിന്റെ സ്വഭാവം
  choice: ദൈവം ഇരുപക്ഷത്തിനുമധ്യേ കാവലിരിക്കണമെന്ന ആശംസ
  alternative: ദൈവം ഇരുവരെയും അനുഗ്രഹിക്കണമെന്ന സൗഹൃദാശംസ
  rationale: יִצֶף എന്ന ക്രിയ നിരീക്ഷണത്തിന്റെ ആശയം വഹിക്കുന്നു; ഉടമ്പടി-സന്ദർഭത്തിലെ സാക്ഷ്യവും ഉത്തരവാദിത്വവും മായ്ച്ച് വെറും സൗഹൃദാശംസയായി മാറ്റിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മിസ്പാ’ എന്ന സ്ഥലനാമം നിലനിർത്തി പദപ്രയോഗം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. നִסָּתֵר എന്നതിനെ അക്ഷരാർഥമായ ‘മറഞ്ഞിരിക്കുമ്പോൾ’ എന്നതിനു പകരം സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘കാണാതിരിക്കുമ്പോൾ’ എന്നു നൽകി; അർഥത്തിലെ പരസ്പര വേർപാട് നിലനിർത്തി.
