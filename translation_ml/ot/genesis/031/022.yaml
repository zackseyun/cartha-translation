  text: וַ/יֻּגַּ֥ד לְ/לָבָ֖ן בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י כִּ֥י בָרַ֖ח יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/022.yaml
  text: On the third day[a], Laban was told that Jacob had fled.
translation:
  language: ml
  text: മൂന്നാം ദിവസം, യാക്കോബ് ഓടിപ്പോയെന്ന് ലാബാനെ അറിയിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: അറിയിച്ചു
  rationale: נגד എന്ന ധാതുവിന്റെ ഹോഫാൽ രൂപം വിവരം ലാബാനിലേക്കു കൈമാറപ്പെട്ടതായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ലാബാനെ അറിയിച്ചു’ എന്ന പ്രയോഗം അജ്ഞാത കർത്താവിനെ ചേർക്കാതെ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְלָבָן
  choice: ലാബാനെ
  rationale: לְ ഇവിടെ വിവരം ലഭിക്കുന്ന വ്യക്തിയെ അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിലെ ‘അറിയിക്കുക’ എന്ന ക്രിയയോടൊപ്പം ദ്വിതീയാവിഭക്തി സ്വാഭാവികമാണ്.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: മൂന്നാം ദിവസം
  rationale: ഹീബ്രായ temporal phrase നേരിട്ട് ‘മൂന്നാം ദിവസം’ എന്നാണ്; മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘അതിനു ശേഷം’ എന്നത് ചേർത്തിട്ടില്ല.
- source_word: כִּי
  choice: …വിവരം
  rationale: כִּי ഇവിടെ അറിയിക്കപ്പെട്ട കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ നാമവത്കൃതമായ ‘വിവരം’ ഉപയോഗിക്കുന്നത് ഈ പരോക്ഷവാക്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בָרַח
  choice: ഓടിപ്പോയ
  rationale: ברח എന്നത് അപകടമോ നിയന്ത്രണമോ ഒഴിവാക്കി പലായനം ചെയ്യുക എന്ന അർഥം നൽകുന്നു. സന്ദർഭത്തിൽ ‘ഓടിപ്പോയ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും കൃത്യവുമാണ്; റിപ്പോർട്ട് ലഭിക്കുന്നതിനുമുമ്പ് നടന്ന പ്രവൃത്തി ബന്ധരൂപം വ്യക്തമാക്കുന്നു.
- source_word: יַעֲקֹב
  choice: യാക്കോബ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രായത്തിലെ നിഷ്ക്രിയ റിപ്പോർട്ടിംഗ് അർഥം മലയാളത്തിലെ സ്വാഭാവിക അജ്ഞാതകർത്തൃപ്രയോഗത്തിലൂടെ നിലനിർത്തി; മൂലപാഠത്തിൽ ഇല്ലാത്ത കാലസൂചനകളൊന്നും ചേർത്തിട്ടില്ല.
