  verdict: revise
  source_fidelity: The draft correctly renders the temporal phrase, identifies Laban as the recipient, and conveys that Jacob fled. However, its wording can make “the news” appear to be the grammatical agent that informed Laban, whereas the Hebrew Hophal reports an unspecified act of informing.
  naturalness: The proposed revision is idiomatic modern standard Malayalam. The complement clause with “എന്ന്” states the content of the report directly and avoids an unnecessarily nominalized construction.
  terminology: “യാക്കോബ്” and “ലാബാൻ” are appropriate established Malayalam biblical name forms. “ഓടിപ്പോയി” is a clear, natural rendering of ברח in this context.
  issues:
  - severity: low
    issue: The phrase “യാക്കോബ് ഓടിപ്പോയ വിവരം ലാബാനെ അറിയിച്ചു” can grammatically construe “വിവരം” as the active subject of “അറിയിച്ചു.”
    rationale: 'The source has a passive, unspecified reporting event: “it was reported/told to Laban.” Recasting the content as a direct complement preserves the unspecified reporter more clearly in natural Malayalam.'
