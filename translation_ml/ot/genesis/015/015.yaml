id: GEN.15.15
reference: Genesis 15:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַתָּ֛ה תָּב֥וֹא אֶל אֲבֹתֶ֖י/ךָ בְּ/שָׁל֑וֹם תִּקָּבֵ֖ר בְּ/שֵׂיבָ֥ה טוֹבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/015.yaml
  text: As for you[a], you will go to your fathers in peace; you will be buried at a good old age.
translation:
  language: ml
  text: നീയോ, സമാധാനത്തോടെ നിന്റെ പിതാക്കന്മാരുടെ അടുക്കൽ[a] ചെല്ലും; നല്ല വാർധക്യത്തിൽ നീ അടക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “നിന്റെ പൂർവികരുടെ അടുക്കൽ.” എബ്രായത്തിൽ അക്ഷരാർഥം “നിന്റെ പിതാക്കന്മാരുടെ അടുക്കൽ” എന്നാണ്; മരിച്ച് മുൻതലമുറകളോടു ചേരുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: നീയോ
  rationale: മുൻവാക്യങ്ങളിൽ അബ്രാമിന്റെ സന്തതിയെക്കുറിച്ചു പറഞ്ഞതിൽനിന്ന് അബ്രാമിലേക്കുള്ള വിഷയമാറ്റവും ഊന്നലും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: תָּב֥וֹא
  choice: ചെല്ലും
  rationale: ‘പിതാക്കന്മാരുടെ അടുക്കൽ’ എന്ന പ്രയോഗത്തോടൊപ്പം ഇത് മരണത്തെ സൂചിപ്പിക്കുന്ന ശൈലിയാണ്; മലയാളത്തിൽ ‘ചെല്ലും’ ആ ചലനരൂപകവും മാന്യമായ ഭാവവും നിലനിർത്തുന്നു.
- source_word: אֶל אֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാരുടെ അടുക്കൽ
  rationale: എബ്രായത്തിലെ ‘നിന്റെ പിതാക്കന്മാരുടെ അടുക്കൽ’ എന്ന കുടുംബബന്ധപരമായ പ്രയോഗം സംരക്ഷിക്കുന്നു; ഇവിടെ അത് മരിച്ച് മുൻതലമുറകളോടു ചേരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּשָׁלוֹם
  choice: സമാധാനത്തോടെ
  rationale: ശാന്തി, ക്ഷേമം, സമഗ്രസൗഖ്യം എന്നീ അർഥവ്യാപ്തിയുള്ള שָׁלוֹם എന്ന പദത്തിന് ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ തുല്യപ്രയോഗമാണ്.
- source_word: תִּקָּבֵר
  choice: നീ അടക്കപ്പെടും
  rationale: קבר എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള സംസ്കരണത്തിന്റെ നിർവ്യാജ കർമണി അർഥം നൽകുന്നു; ‘അടക്കപ്പെടും’ സാധാരണ മലയാളത്തിൽ കുഴിച്ചിടുന്ന സംസ്കാരത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: നല്ല വാർധക്യത്തിൽ
  rationale: അനുകൂലമായി വിലയിരുത്തപ്പെട്ട ദീർഘായുസ്സോടുകൂടിയ വാർധക്യം എന്ന ആശയം, ഉറവിടത്തിന്റെ സംക്ഷിപ്ത ഘടനയോടൊപ്പം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘പിതാക്കന്മാരുടെ അടുക്കൽ ചെല്ലുക’ എന്നതിന്റെ അർഥം
  choice: അബ്രാമിന്റെ മരണത്തെയും മുൻതലമുറകളോടു ചേരുന്നതിനെയും സൂചിപ്പിക്കുന്ന പ്രയോഗമായി അതേ രൂപകം നിലനിർത്തി.
  alternative: പൂർവികരോടൊപ്പം ഭൗതികമായി അടക്കം ചെയ്യപ്പെടുക എന്നോ മരണാനന്തര ബോധപൂർവമായ കൂട്ടായ്മയെക്കുറിച്ചുള്ള കൂടുതൽ വ്യക്തമായ പ്രസ്താവന എന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: അബ്രാം തന്റെ അടുത്ത പിതാക്കന്മാരോടൊപ്പം ഭൗതികമായി അടക്കം ചെയ്യപ്പെടുന്നില്ലാത്തതിനാൽ ഈ പ്രയോഗം ശവസംസ്കാരസ്ഥലത്തെക്കാൾ വിശാലമാണ്. എന്നാൽ മരണാനന്തരാവസ്ഥയെക്കുറിച്ചുള്ള വികസിത സിദ്ധാന്തം ഈ വാക്യം നിർബന്ധമായി പഠിപ്പിക്കുന്നില്ല; അതിനാൽ ഉറവിടത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, മാന്യവും സംക്ഷിപ്തവുമായ ശൈലി. ‘നീയോ’ വിഷയമാറ്റം പ്രകടമാക്കുന്നു; ‘പിതാക്കന്മാരുടെ അടുക്കൽ’ എന്ന ഉറവിടരൂപകം വിശദീകരണത്തോടെ സംരക്ഷിച്ചിട്ടുണ്ട്.
