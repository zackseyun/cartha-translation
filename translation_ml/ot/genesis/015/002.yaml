source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְרָ֗ם אֲדֹנָ֤/י יֱהוִה֙ מַה תִּתֶּן לִ֔/י וְ/אָנֹכִ֖י הוֹלֵ֣ךְ עֲרִירִ֑י וּ/בֶן מֶ֣שֶׁק בֵּיתִ֔/י ה֖וּא דַּמֶּ֥שֶׂק אֱלִיעֶֽזֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/002.yaml
  text: But Abram said[a], “Lord Yahweh, what will you give me, since I am going childless, and the heir of my house is Eliezer of Damascus?”
translation:
  language: ml
  text: 'എന്നാൽ അബ്രാം പറഞ്ഞു: “കർത്താവായ യഹോവേ, ഞാൻ മക്കളില്ലാതെ കടന്നുപോകുന്നിരിക്കെ നീ എനിക്ക് എന്തു തരും? എന്റെ ഭവനത്തിന്റെ അവകാശി[a] ദമസ്കൊസുകാരനായ എലീയേസർ ആണല്ലോ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്റെ ഭവനത്തിന്റെ അവകാശി” എന്നിടത്ത് ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ “എന്റെ ഭവനത്തിന്റെ മെശെക്കിന്റെ മകൻ” എന്ന അസാധാരണ പ്രയോഗമാണ്; ഇതിന് “എന്റെ ഭവനത്തിന്റെ കാര്യസ്ഥൻ” എന്നോ “എന്റെ ഭവനം കൈവശമാക്കുന്നവൻ” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ അബ്രാം പറഞ്ഞു
  rationale: വാവ് രൂപം ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മുൻവാക്യത്തിലെ വാഗ്ദാനത്തോടുള്ള അബ്രാമിന്റെ ആശങ്കാപൂർണ പ്രതികരണം വ്യക്തമാക്കാൻ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: אֲדֹנָי יֱהוִה
  choice: കർത്താവായ യഹോവേ
  rationale: אֲדֹנָי എന്ന അധികാരപദവും יהוה എന്ന ദൈവനാമവും രണ്ടും നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ സംബോധനരൂപം.
- source_word: מַה תִּתֶּן לִי
  choice: നീ എനിക്ക് എന്തു തരും?
  rationale: അപൂർണക്രിയയുടെ സന്ദർഭോചിതമായ ഭാവികാല അർഥം ലളിതമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְאָנֹכִי הוֹלֵךְ עֲרִירִי
  choice: എനിക്ക് മക്കളില്ലാതെ ഞാൻ കടന്നുപോകുമ്പോൾ
  rationale: הוֹלֵךְ എന്ന ‘പോകുക’ രൂപകത്തെ ‘കടന്നുപോകുക’ എന്നു നിലനിർത്തുകയും עֲרִירִיയുടെ മക്കളില്ലായ്മ വ്യക്തമാക്കുകയും ചെയ്യുന്നു; മരണം എന്നു നേരിട്ട് ചേർത്ത് അർഥം അമിതമായി നിർണയിക്കുന്നില്ല.
- source_word: בֶן מֶשֶׁק בֵּיתִי
  choice: എന്റെ ഭവനത്തിന്റെ അവകാശി
  rationale: അത്യന്തം ദുഷ്കരമായ ഹീബ്രു പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ സാധ്യത ‘അവകാശി’ എന്നതാണ്; യഥാർഥ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: דַּמֶּשֶׂק אֱלִיעֶזֶר
  choice: ദമസ്കൊസുകാരനായ എലീയേസർ
  rationale: എലീയേസറിനെ ദമസ്കൊസുമായി ബന്ധിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: אֲדֹנָי יֱהוִה എന്ന സംയുക്ത സംബോധനത്തിലെ ദൈവനാമം
  choice: കർത്താവായ യഹോവേ
  alternative: കർത്താവായ ദൈവമേ
  rationale: יהוה എന്ന ഉടമ്പടിനാമത്തെ പൊതുവായ ‘ദൈവം’ എന്ന പദത്തിൽ ലയിപ്പിക്കാതെ വ്യക്തമായി നിലനിർത്തുന്നു; אֲדֹנָיയും വേറിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- issue: בֶן מֶשֶׁק בֵּיתִי എന്ന ദുഷ്കരപ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: എന്റെ ഭവനത്തിന്റെ അവകാശി
  alternative: എന്റെ ഭവനത്തിന്റെ കാര്യസ്ഥൻ / എന്റെ ഭവനം കൈവശമാക്കുന്നവൻ
  rationale: അടുത്ത വാക്യത്തിലെ അവകാശക്രമസന്ദർഭം ‘അവകാശി’യെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും അപൂർവപ്രയോഗത്തിന്റെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദൈവത്തോടുള്ള സംബോധനത്തിൽ ആദരസൂചകമായ ‘യഹോവേ’ ഉപയോഗിച്ചു. ‘ഭവനം’ ഇവിടെ വീടിനെക്കാൾ വിശാലമായ കുടുംബസ്വത്തും ഗൃഹസംവിധാനവും സൂചിപ്പിക്കാൻ തിരഞ്ഞെടുത്തു.
