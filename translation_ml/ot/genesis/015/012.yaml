  source_fidelity: 'ആദ്യവാക്യം ഹീബ്രുവിനോട് വിശ്വസ്തമാണ്: സൂര്യൻ അസ്തമിക്കാറാകുന്ന സമയം, അബ്രാമിന്മേൽ ഗാഢനിദ്ര വരുക എന്നിവ ശരിയായി അറിയിക്കുന്നു. എന്നാൽ രണ്ടാം വാക്യത്തിലെ “ഭയങ്കരമായ കനത്ത അന്ധകാരം” אֵימָה (‘ഭീതി/ഭയം/ഭീകരത’) എന്ന മുഖ്യനാമത്തെ ‘അന്ധകാരം’ എന്നാക്കി മാറ്റുന്നു; അതിനാൽ പ്രധാന അർഥഘടകം നഷ്ടമാകുന്നു. നֹפֶלֶת എന്ന പങ്കുപ്രയോഗത്തിന്റെ സജീവ-പുരോഗമന ഭാവം “വന്നുവീഴുകയായിരുന്നു” എന്നതിൽ സ്വാഭാവികമായി നിലനിർത്താം.'
  naturalness: “സൂര്യൻ അസ്തമിക്കാറായപ്പോൾ”യും “ഗാഢനിദ്ര വന്നു”യും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. “വലിയ, അന്ധകാരമയമായൊരു ഭീതി” എന്നത് മൂലത്തിലെ ഭീതിയും അന്ധകാരവും ചേർന്ന ഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വ്യക്തമാണ്.
  terminology: “ഗാഢനിദ്ര” תַּרְדֵּמָהയ്ക്ക് യോജിച്ച മുഖ്യവിവർത്തനമാണ്; ‘മയക്കാവസ്ഥ’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ മാത്രം സൂക്ഷിച്ചിരിക്കുന്നു. אֵימָהയ്ക്ക് ‘ഭീതി’യും חֲשֵׁכָהയ്ക്ക് ‘അന്ധകാരമയമായ’യും ഉപയോഗിക്കുന്നത് പദങ്ങളുടെ അർഥം സംരക്ഷിക്കുന്നു. ‘അബ്രാം’ പേര് സന്ദർഭാനുസൃതവും ശരിയുമാണ്.
