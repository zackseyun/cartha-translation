revisions:
- from: സൂര്യൻ അസ്തമിക്കാറായപ്പോൾ, അബ്രാമിന് ഗാഢനിദ്ര വന്നു[a]. അതാ, ഭയങ്കരമായ കനത്ത അന്ധകാരം അവന്റെമേൽ വീണുകൊണ്ടിരുന്നു[b].
  to: സൂര്യൻ അസ്തമിക്കാറായപ്പോൾ, അബ്രാമിന് ഗാഢനിദ്ര വന്നു[a]. അതാ, വലിയ, അന്ധകാരമയമായൊരു ഭീതി അവന്റെമേൽ വന്നുവീഴുകയായിരുന്നു[b].
  rationale: രണ്ടാം വാക്യത്തിൽ ‘അന്ധകാരം’ മാത്രം വരുത്തിയിരുന്ന വായന തിരുത്തി, മൂലത്തിലെ אֵימָה എന്ന ‘ഭീതി’ വ്യക്തമായി പുനഃസ്ഥാപിച്ചു. ‘അന്ധകാരമയമായ’ എന്ന വിശേഷണം ഹീബ്രുവിലെ ഇരുട്ടും ഭീതിയും തമ്മിലുള്ള സാന്ദ്രവും പൂർണമായി നിർണയിക്കാനാവാത്തതുമായ ബന്ധത്തെ ഒരു വിഭാഗീയ വ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു. പങ്കുപ്രയോഗത്തിന്റെ vivid/progressive ഭാവം ‘വന്നുവീഴുകയായിരുന്നു’ എന്നതിൽ സൂക്ഷിച്ചു.
