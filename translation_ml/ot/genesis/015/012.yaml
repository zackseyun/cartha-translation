id: GEN.15.12
reference: Genesis 15:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/שֶּׁ֨מֶשׁ֙ לָ/ב֔וֹא וְ/תַרְדֵּמָ֖ה נָפְלָ֣ה עַל אַבְרָ֑ם וְ/הִנֵּ֥ה אֵימָ֛ה חֲשֵׁכָ֥ה גְדֹלָ֖ה נֹפֶ֥לֶת עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/012.yaml
  text: As the sun was going down[a], a deep sleep fell upon Abram. And behold[b], a great dark dread fell upon him.
translation:
  language: ml
  text: സൂര്യൻ അസ്തമിക്കാറായപ്പോൾ, അബ്രാമിന് ഗാഢനിദ്ര വന്നു[a]. അതാ, വലിയ, അന്ധകാരമയമായൊരു ഭീതി അവന്റെമേൽ വന്നുവീഴുകയായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അബ്രാമിന് ഒരു മയക്കാവസ്ഥ വന്നു.” ഹീബ്രു പദത്തിന് അസാധാരണമായ ഗാഢനിദ്രയെ—ഒരുപക്ഷേ ദൈവപ്രേരിതമായ ഉറക്കത്തെ—സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “വലിയ ഇരുണ്ട ഭീതി” എന്നും “അന്ധകാരത്തിന്റെ വലിയ ഭീതി” എന്നും വിവർത്തനം ചെയ്യാം. ഭീതിയുടെയും അന്ധകാരത്തിന്റെയും ആശയങ്ങളെ ഹീബ്രു ഇവിടെ സാന്ദ്രമായ ഒരു പ്രയോഗത്തിൽ കൂട്ടിച്ചേർക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ לָבוֹא
  choice: സൂര്യൻ അസ്തമിക്കാറായപ്പോൾ
  rationale: בוא എന്ന ക്രിയയുടെ infinitive construct ഇവിടെ സൂര്യൻ അസ്തമയത്തോട് അടുക്കുന്ന സമയത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ സമയോപവാക്യമായി അവതരിപ്പിച്ചു.
- source_word: תַרְדֵּמָה
  choice: ഗാഢനിദ്ര
  rationale: പദം അസാധാരണമായ ആഴമുള്ള, സന്ദർഭത്തിൽ ദൈവപ്രേരിതമായിരിക്കാവുന്ന ഉറക്കത്തെ സൂചിപ്പിക്കുന്നു; ‘മയക്കം’ എന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: נָפְלָה עַל אַבְרָם
  choice: അബ്രാമിന് … വന്നു
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിച്ചു; അക്ഷരാർഥത്തിലുള്ള ‘മേൽ വീണു’ ഉറക്കത്തെക്കുറിച്ച് മലയാളത്തിൽ കൃത്രിമമായി തോന്നും.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: ദൃശ്യത്തെ നാടകീയമായി ശ്രദ്ധയിൽപ്പെടുത്തുന്ന הִנֵּהയുടെ ശക്തി സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: ഭയങ്കരമായ കനത്ത അന്ധകാരം
  rationale: אֵימָהയും חֲשֵׁכָהയും ചേർന്ന സാന്ദ്രവും വ്യാകരണപരമായി അനിശ്ചിതവുമായ ദൃശ്യപ്രയോഗം ഭയവും അന്ധകാരവും ഒരുമിച്ച് അനുഭവപ്പെടുന്ന വിധത്തിൽ നൽകി; മറ്റു സാധ്യമായ ബന്ധങ്ങൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: נֹפֶלֶת עָלָיו
  choice: അവന്റെമേൽ വീണുകൊണ്ടിരുന്നു
  rationale: participial രൂപത്തിന്റെ പുരോഗമനപരവും സജീവവുമായ ഭാവം മലയാളത്തിലെ ‘വീണുകൊണ്ടിരുന്നു’ കൊണ്ട് നിലനിർത്തി.
- source_word: אַבְרָם
  choice: അബ്രാം
  rationale: പേരിന്റെ ഈ ഘട്ടത്തിലെ ഹീബ്രു രൂപം മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകി.
theological_decisions:
- issue: വെളിപ്പാടുസന്ദർഭത്തിലെ תַרְדֵּמָהയുടെ സ്വഭാവം
  choice: ഗാഢനിദ്ര
  alternative: മയക്കം / ദൈവപ്രേരിതമായ അസാധാരണ ഉറക്കം
  rationale: ഹീബ്രു നാമത്തിന്റെ നേരിട്ടുള്ള അർഥം ആഴമുള്ള ഉറക്കമാണ്. ‘മയക്കം’ എന്നു മുഖ്യവാചകത്തിൽ നൽകിയാൽ ദർശനാവസ്ഥയെ കൂടുതൽ ഉറപ്പിച്ച് വ്യാഖ്യാനിക്കുന്നതാകും; അതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിച്ചു.
- issue: אֵימָה חֲשֵׁכָה גְדֹלָהയിലെ ഭയവും അന്ധകാരവും തമ്മിലുള്ള ബന്ധം
  choice: ഭയങ്കരമായ കനത്ത അന്ധകാരം
  alternative: വലിയ ഇരുണ്ട ഭീതി / അന്ധകാരത്തിന്റെ വലിയ ഭീതി
  rationale: ഹീബ്രു വാക്യഘടന ആശയങ്ങളെ സാന്ദ്രമായി കൂട്ടിച്ചേർക്കുന്നു; ഒരു വ്യാകരണബന്ധം മാത്രം അന്തിമമാക്കാതെ മറ്റു സാധ്യമായ വായനകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ആദ്യവാക്യത്തിൽ മലയാളസഹജമായ പ്രയോഗം സ്വീകരിച്ചു; രണ്ടാം വാക്യത്തിൽ ‘അതാ’യും ‘വീണുകൊണ്ടിരുന്നു’യും ഉപയോഗിച്ച് മൂലത്തിലെ നാടകീയതയും പുരോഗമനഭാവവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
