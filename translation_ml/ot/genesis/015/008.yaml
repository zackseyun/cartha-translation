source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר אֲדֹנָ֣/י יֱהוִ֔ה בַּ/מָּ֥ה אֵדַ֖ע כִּ֥י אִֽירָשֶֽׁ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/008.yaml
  text: And he said[a], “Lord Yahweh, how will I know that I will possess it?”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “കർത്താവായ യഹോവേ, ഞാൻ അത് കൈവശമാക്കുമെന്ന്[a] എങ്ങനെ അറിയും?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അത് എനിക്ക് അവകാശമായി ലഭിക്കുമെന്ന് ഞാൻ എങ്ങനെ അറിയും?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: അപ്പോൾ അവൻ പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ wayyiqtol രൂപം കഥയെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനബന്ധം നൽകാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: אֲדֹנָי יֱהוִה
  choice: കർത്താവായ യഹോവേ
  rationale: אֲדֹנָי എന്ന ബഹുമാനപദവും യഹോവ എന്ന ദൈവനാമവും ചേർന്ന അഭിസംബോധന മലയാളത്തിൽ സ്വാഭാവികമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: בַּמָּה אֵדַע
  choice: എങ്ങനെ അറിയും
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്തിനാൽ ഞാൻ അറിയും?’ എന്നാണെങ്കിലും, ഉറപ്പ് ലഭിക്കുന്ന മാർഗം ചോദിക്കുന്ന ഈ പ്രയോഗത്തിന് ‘എങ്ങനെ അറിയും’ എന്നത് സ്വാഭാവികമായ തുല്യപ്രയോഗമാണ്.
- source_word: כִּי
  choice: എന്ന്
  rationale: അബ്രാം അറിയാൻ ആഗ്രഹിക്കുന്ന കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന പൂരകബന്ധം മലയാളത്തിൽ ‘എന്ന്’ വ്യക്തമാക്കുന്നു.
- source_word: אִירָשֶׁנָּה
  choice: ഞാൻ അത് കൈവശമാക്കും
  rationale: ירשׁ എന്ന ക്രിയയ്ക്ക് അവകാശമായി ലഭിക്കുക, കൈവശമാക്കുക എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. മുൻവാക്യത്തിലെ ദേശം യഥാർഥമായി സ്വന്തമാക്കുന്നതാണ് സന്ദർഭത്തിലെ മുഖ്യ ആശയം; മറ്റൊരു സാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions:
- issue: אֲדֹנָי יֱהוִה എന്ന സംയുക്ത ദൈവാഭിസംബോധന
  choice: കർത്താവായ യഹോവേ
  alternative: കർത്താവായ ദൈവമേ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമമായ יְהוָה മറച്ചുവയ്ക്കാതെ ‘യഹോവ’ എന്നു നൽകുകയും אֲדֹנָי എന്ന സ്ഥാനനാമവും സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- issue: ירשׁ എന്ന ക്രിയയിലെ അവകാശലഭ്യതയും കൈവശപ്പെടുത്തലും തമ്മിലുള്ള അർഥവ്യാപ്തി
  choice: കൈവശമാക്കും
  alternative: അവകാശമായി ലഭിക്കും
  rationale: ദേശത്തിന്റെ യഥാർഥ കൈവശം സന്ദർഭത്തിൽ മുൻനിൽക്കുന്നു; എന്നാൽ ഉടമ്പടിപരമായ അവകാശലഭ്യതയുടെ സൂചന യഥാർഥമായതിനാൽ അതിനെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ആഖ്യാനശൈലി. അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘-ഏ’ രൂപവും ദൈവനാമമായ ‘യഹോവ’യും ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ചോദ്യം അവസാനിച്ച ഉടൻ ചേർത്തു.
