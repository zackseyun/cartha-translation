    issue: Unnecessary temporal connective “അപ്പോൾ”
    rationale: The Hebrew wayyiqtol can advance narrative with “and/then,” but this verse does not require an explicit temporal “then.” Omitting it gives a closer and smoother rendering without altering the narrative flow.
  - severity: low
    issue: Footnote anchor is placed at the end of the full question rather than at the lexical rendering it qualifies.
    rationale: The footnote concerns “കൈവശമാക്കും” as the rendering of ירשׁ. Placing the anchor immediately after that expression makes its scope precise.
