  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֶאֱמִ֖ן בַּֽ/יהוָ֑ה וַ/יַּחְשְׁבֶ֥/הָ לּ֖/וֹ צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/006.yaml
  text: And he believed Yahweh[c][b][a], and he counted it to him as righteousness.
translation:
  language: ml
  text: അവൻ യഹോവയിൽ വിശ്വസിച്ചു[a]; യഹോവ അത് അവന് നീതിയായി കണക്കാക്കി[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹോവയെ ആശ്രയിച്ചു.’
    reason: lexical_alternative
  - marker: b
    text: ‘കണക്കാക്കി’ എന്നതിന് ‘പരിഗണിച്ചു’ എന്നോ ‘അവന് നീതിയായി കണക്കിൽ ചേർത്തു’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രു വാക്യഘടന സാധാരണയായി യഹോവ അബ്രാം വിശ്വസിച്ചതിനെ അവന് നീതിയായി കണക്കാക്കി എന്നാണ് മനസ്സിലാക്കുന്നത്. സാധ്യത കുറഞ്ഞ മറ്റൊരു വായനയിൽ ‘കണക്കാക്കി’ എന്ന ക്രിയയുടെ കർത്താവ് അബ്രാമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הֶאֱמִן
  choice: അവൻ … വിശ്വസിച്ചു
  rationale: אמן എന്ന ധാതുവിന്റെ ഹിഫ്ഈൽ രൂപം ഇവിടെ ഒരാളിൽ വിശ്വാസം അർപ്പിക്കുക, ആശ്രയിക്കുക എന്ന അർഥം നൽകുന്നു. ‘വിശ്വസിച്ചു’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളമാണ്; പിന്നീടുള്ള തിരുവെഴുത്തുപയോഗങ്ങളുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: בַּ/יהוָה
  choice: യഹോവയിൽ
  rationale: בְ എന്ന ഉപസർഗം വിശ്വാസത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു. ദൈവനാമമായ יהוה മലയാളത്തിലെ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
- source_word: וַ/יַּחְשְׁבֶהָ
  choice: അവിടുന്ന് അത് … കണക്കാക്കി
  rationale: חשב എന്നതിന് കണക്കാക്കുക, പരിഗണിക്കുക, ഒരാളുടെ കണക്കിൽ ചേർക്കുക എന്നീ അർഥങ്ങളുണ്ട്. ‘കണക്കാക്കി’ അക്കൗണ്ടിങ് ഭാവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം അബ്രാമിന്റെ വിശ്വാസപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ‘അത്’ എന്നു നൽകി.
- source_word: לּוֹ
  choice: അവന്
  rationale: לְ എന്ന ഉപസർഗവും സർവനാമപ്രത്യയവും ചേർന്ന് ആരുടെ കണക്കിലേക്കാണ് അത് ചേർത്തതെന്ന് സൂചിപ്പിക്കുന്നു; ‘അവന്’ ഈ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: צְדָקָה
  choice: നീതിയായി
  rationale: צְדָקָה ഇവിടെ നീതി/നീതിമത്തം എന്ന നിലയെ സൂചിപ്പിക്കുന്നു. ‘നീതിയായി’ എന്നത് വാക്യഘടനയിൽ സ്വാഭാവികവും ദൈവശാസ്ത്രപരമായ അർഥം അനാവശ്യമായി വിപുലീകരിക്കാത്തതുമാണ്.
theological_decisions:
- issue: ‘കണക്കാക്കി’ എന്ന ക്രിയയുടെ കർത്താവ്
  choice: 'യഹോവയാണ് കർത്താവ്: അബ്രാം യഹോവയിൽ വിശ്വസിച്ചു; യഹോവ അത് അബ്രാമിന് നീതിയായി കണക്കാക്കി.'
  alternative: 'അബ്രാമാണ് കർത്താവ്: അബ്രാം യഹോവയിൽ വിശ്വസിക്കുകയും അവനെ/അതിനെ നീതിയായി കണക്കാക്കുകയും ചെയ്തു.'
  rationale: സന്ദർഭവും വാക്യത്തിന്റെ പരമ്പരാഗതവും കാനോനികവുമായ ഗ്രഹണവും യഹോവയെ കർത്താവായി എടുക്കുന്നതിനെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എന്നാൽ ഹീബ്രു ക്രിയയിൽ കർത്താവ് തുറന്നുപറയാത്തതിനാൽ വ്യാകരണപരമായി ചർച്ച ചെയ്യപ്പെടുന്ന മറ്റൊരു വായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: וַיַּחְשְׁבֶהָ എന്നതിലെ സ്ത്രീലിംഗ പ്രത്യയത്തിന്റെ സൂചിതം
  choice: അബ്രാമിന്റെ വിശ്വസിക്കൽ എന്ന പ്രവൃത്തിയെ ‘അത്’ എന്നു സൂചിപ്പിക്കുന്നു.
  alternative: അബ്രാമിന്റെ പ്രതികരണം/ആശ്രയം എന്ന വിശാല ആശയത്തെ സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ കൂടുതൽ തുറന്ന നിലയിൽ ‘ഇത്’ എന്നു നൽകാം.
  rationale: തൊട്ടുമുമ്പ് വ്യക്തമായ ഒരു സ്ത്രീലിംഗ നാമം ഇല്ലെങ്കിലും, ഒരു അമൂർത്ത പ്രവൃത്തിയെയോ സംഭവത്തെയോ ഹീബ്രുവിൽ സ്ത്രീലിംഗ പ്രത്യയംകൊണ്ട് സൂചിപ്പിക്കാം. ‘അത്’ എന്നു നൽകുന്നത് ‘വിശ്വാസം’ എന്ന വ്യാഖ്യാനാത്മക നാമം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ മൂലത്തിന്റെ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അവിടുന്ന്’ എന്ന ആദരസൂചക സർവനാമം യഹോവയെ വ്യക്തമായി കർത്താവായി തിരിച്ചറിയാൻ ഉപയോഗിച്ചു; മൂലത്തിൽ കർത്താവ് വീണ്ടും പേരെടുത്ത് പറയുന്നില്ലെന്ന കാര്യം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
