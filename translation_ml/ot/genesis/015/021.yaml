  yaml_path: translation/ot/genesis/015/021.yaml
  text: and the Amorites, and the Canaanites, and the Girgashites, and the Jebusites.
translation:
  language: ml
  text: അമോര്യരെയും കനാന്യരെയും ഗിർഗാശ്യരെയും യെബൂസ്യരെയും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  choice: -രും
  rationale: וְ പട്ടികയിലെ തുടർച്ച സൂചിപ്പിക്കുകയും אֶת നിർദിഷ്ട കർമത്തെ അടയാളപ്പെടുത്തുകയും ചെയ്യുന്നു. മലയാളത്തിൽ ഓരോ ജനവിഭാഗനാമത്തോടും ‘-രും’ ചേർക്കുന്നത് പട്ടികയുടെ ഏകോപനഘടന സ്വാഭാവികമായി നിലനിർത്തുന്നു; אֶת-ന് വേറെ പദം ആവശ്യമില്ല.
- source_word: הָאֱמֹרִי
  choice: അമോര്യർ
  rationale: എബ്രായത്തിലെ ഏകവചനരൂപം ഇവിടെ ഒരു ജനവിഭാഗത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു. അതിനാൽ മലയാളത്തിലെ ആദര/മനുഷ്യബഹുവചന രൂപമായ ‘അമോര്യർ’ അനുയോജ്യമാണ്.
- source_word: הַכְּנַעֲנִי
  choice: കനാന്യർ
  rationale: ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ സമൂഹ ഏകവചനത്തിന് സ്വാഭാവികമായ മലയാള ബഹുവചന ജനനാമം ഉപയോഗിച്ചു.
- source_word: הַגִּרְגָּשִׁי
  choice: ഗിർഗാശ്യർ
  rationale: എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്നതും മലയാള ബൈബിൾ ഭാഷയിൽ തിരിച്ചറിയാവുന്നതുമായ ജനനാമരൂപം സ്വീകരിച്ചു.
- source_word: הַיְבוּסִי
  choice: യെബൂസ്യർ
  rationale: ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാള ബഹുവചനരൂപം ഉപയോഗിച്ചു; ‘യെബൂസ്യർ’ എന്നത് മൂലനാമത്തോട് അടുത്തും വായനക്കാർക്ക് പരിചിതവുമായ രൂപമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി. ഈ വാക്യം മുൻവാക്യത്തിലെ കർമപ്പട്ടികയുടെ തുടർച്ചയായതിനാൽ ക്രിയ ചേർത്തിട്ടില്ല; ഓരോ ജനവിഭാഗത്തിനും ‘-രും’ ആവർത്തിച്ച് എബ്രായ പട്ടികയുടെ താളവും ബന്ധവും നിലനിർത്തി.
