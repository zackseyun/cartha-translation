source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/שֶּׁ֨מֶשׁ֙ בָּ֔אָה וַ/עֲלָטָ֖ה הָיָ֑ה וְ/הִנֵּ֨ה תַנּ֤וּר עָשָׁן֙ וְ/לַפִּ֣יד אֵ֔שׁ אֲשֶׁ֣ר עָבַ֔ר בֵּ֖ין הַ/גְּזָרִ֥ים הָ/אֵֽלֶּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/017.yaml
  text: And when the sun had gone down and it was dark[a], behold[b], a smoking firepot and a flaming torch passed between these pieces.
translation:
  language: ml
  text: സൂര്യൻ അസ്തമിച്ച് ഇരുട്ടായപ്പോൾ, അതാ, പുകയുന്ന ഒരു അടുപ്പും[a] ജ്വലിക്കുന്ന ഒരു തീപ്പന്തവും ഈ കഷണങ്ങൾക്കിടയിലൂടെ[b] കടന്നുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുകയുന്ന ചൂള’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപദം അടുപ്പിനെയോ തീ സൂക്ഷിക്കുന്ന ഒരു പാത്രത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഈ ‘കഷണങ്ങൾ’ ഉടമ്പടി ആചാരത്തിനായി നേരത്തേ രണ്ടായി പിളർത്തിവെച്ച മൃഗഭാഗങ്ങളാണ് (ഉല്പത്തി 15:10 കാണുക).
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ בָּאָה
  choice: സൂര്യൻ അസ്തമിച്ച് ... ആയപ്പോൾ
  rationale: സൂര്യനെ കർത്താവാക്കി ഉപയോഗിക്കുന്ന בוא ഇവിടെ സൂര്യാസ്തമയത്തെ സൂചിപ്പിക്കുന്നു. കഥയുടെ സമയപരമായ മുന്നേറ്റം സ്വാഭാവിക മലയാളത്തിൽ ‘ആയപ്പോൾ’ എന്ന ഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: וַעֲלָטָה הָיָה
  choice: ഇരുട്ടായപ്പോൾ
  rationale: עֲלָטָה ഇരുട്ടിനെയോ മങ്ങിയ അന്ധകാരത്തെയോ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിൽ ഇല്ലാത്ത തീവ്രത ചേർക്കാതെ ലളിതവും സ്വാഭാവികവുമായി വിവർത്തനം ചെയ്തു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: ദൃശ്യത്തിലേക്ക് പെട്ടെന്ന് ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּהയുടെ സജീവവും ഗൗരവമുള്ളതുമായ അവതരണശക്തി ‘അതാ’ നിലനിർത്തുന്നു.
- source_word: תַנּוּר עָשָׁן
  choice: പുകയുന്ന ഒരു അടുപ്പ്
  rationale: תַנּוּר അപ്പം ചുടാനോ തീ സൂക്ഷിക്കാനോ ഉള്ള അടുപ്പിനെയോ ചൂളയെയോ സൂചിപ്പിക്കാം. ദൃശ്യം അനാവശ്യമായി വ്യാഖ്യാനിക്കാതെ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ‘അടുപ്പ്’ തെരഞ്ഞെടുത്തു; עָשָׁן വിശേഷണരൂപത്തിൽ ‘പുകയുന്ന’ എന്നു നൽകി.
- source_word: לַפִּיד אֵשׁ
  choice: ജ്വലിക്കുന്ന ഒരു തീപ്പന്തം
  rationale: לַפִּיד തീപ്പന്തത്തെയോ തീകൊളുത്തിയ ദീപശിഖയെയോ സൂചിപ്പിക്കുന്നു. אֵשׁ നൽകുന്ന അഗ്നിമയമായ ഭാവം ‘ജ്വലിക്കുന്ന’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: אֲשֶׁר עָבַר
  choice: കടന്നുപോയി
  rationale: ദൃശ്യത്തിൽ ചേർന്നു നിൽക്കുന്ന രണ്ടു അഗ്നിസൂചകങ്ങളെയും സംബന്ധിക്കുന്ന ഏകവചന ക്രിയയുടെ സമഗ്രപ്രയോഗം മലയാളത്തിലെ സംയുക്തകർത്താവോടൊപ്പം സ്വാഭാവികമായി നിലനിർത്തി.
- source_word: בֵּין הַגְּזָרִים הָאֵלֶּה
  choice: ഈ കഷണങ്ങൾക്കിടയിലൂടെ
  rationale: גְּזָרִים മുൻസന്ദർഭത്തിൽ രണ്ടായി പിളർത്തിയ മൃഗഭാഗങ്ങളാണ്. ‘കഷണങ്ങൾ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്; ‘ഇവ’ എന്ന സൂചന הָאֵלֶּהയെ നിലനിർത്തുന്നു. ചലനസന്ദർഭത്തിൽ בֵּין എന്നത് ‘ഇടയിലൂടെ’ എന്നു നൽകി.
theological_decisions:
- issue: ഉടമ്പടി സ്ഥാപിക്കുന്ന ദൃശ്യത്തിലെ അഗ്നിരൂപങ്ങളുടെ സ്വഭാവം
  choice: പുകയുന്ന അടുപ്പിനെയും ജ്വലിക്കുന്ന തീപ്പന്തത്തെയും ദൃശ്യരൂപങ്ങളായി മാത്രം വിവരിക്കുന്നു; അവയെ വിവർത്തനവാക്യത്തിൽ ദൈവവുമായി നേരിട്ട് സമീകരിക്കുന്നില്ല.
  alternative: ഇവ യഹോവയുടെ സാന്നിധ്യത്തിന്റെ പ്രത്യക്ഷീകരണമാണെന്ന് വാക്യത്തിൽ തന്നെ വ്യക്തമാക്കുക.
  rationale: വിശാലസന്ദർഭം ദൈവിക ഉടമ്പടി-സാന്നിധ്യം ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ എബ്രായപാഠം കാണപ്പെട്ട രൂപങ്ങളെ മാത്രമാണ് പേരെടുത്തു പറയുന്നത്. അതിനാൽ പാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ സൂചനയും വ്യാഖ്യാനസാധ്യതയും തുറന്ന നിലയിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അതാ’ ദൃശ്യത്തിന്റെ പെട്ടെന്നുള്ള അവതരണം നിലനിർത്തുന്നു; അഗ്നിരൂപങ്ങളുടെ ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടില്ല.
