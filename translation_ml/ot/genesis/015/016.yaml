  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/ד֥וֹר רְבִיעִ֖י יָשׁ֣וּבוּ הֵ֑נָּה כִּ֧י לֹא שָׁלֵ֛ם עֲוֺ֥ן הָ/אֱמֹרִ֖י עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/016.yaml
  text: And in the fourth generation they will return here[b][a], for the iniquity of the Amorites is not yet complete.
translation:
  language: ml
  text: നാലാം തലമുറയിൽ അവർ ഇവിടേക്കു മടങ്ങിവരും; കാരണം അമോര്യരുടെ[a] അകൃത്യം ഇനിയും പൂർണമായിട്ടില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അമോര്യന്റെ’; ഇവിടെ ഏകവചനം മുഴുവൻ അമോര്യജനത്തെ സമുച്ചയമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'പദശഃ, ‘ഇവിടെവരെ’; സന്ദർഭത്തിൽ അർഥം: അമോര്യരുടെ അകൃത്യം അതിന്റെ പൂർണ അളവിലെത്തിയിട്ടില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדֹור רְבִיעִי
  choice: നാലാം തലമുറയിൽ
  rationale: דּוֹר എന്നത് ‘തലമുറ’ എന്നും רְבִיעִי എന്നത് ‘നാലാം’ എന്നും അർഥമാക്കുന്നു. ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള മടങ്ങിവരവ് ഏത് തലമുറയിൽ സംഭവിക്കുമെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വാക്യാരംഭത്തിലെ וְ സന്ദർഭബന്ധത്തിലൂടെ സൂചിപ്പിക്കപ്പെടുന്നതിനാൽ പ്രത്യേകം ‘അപ്പോൾ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: יָשׁוּבוּ
  choice: അവർ ... മടങ്ങിവരും
  rationale: שׁוּב ഇവിടെ അബ്രാമിന്റെ സന്തതികൾ ദേശത്തേക്കു തിരിച്ചുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘മടങ്ങിവരും’ ചലനവും തിരിച്ചുവരവിന്റെ ആശയവും നിലനിർത്തുന്നു.
- source_word: הֵנָּה
  choice: ഇവിടേക്കു
  rationale: സംസാരത്തിൽ സൂചിപ്പിക്കപ്പെടുന്ന സ്ഥലത്തെ ലക്ഷ്യസ്ഥാനമായി കാണിക്കുന്ന ദിശാസൂചക ക്രിയാവിശേഷണം. മലയാളത്തിൽ ‘ഇവിടേക്കു’ സ്വാഭാവികമാണ്.
- source_word: כִּי
  choice: കാരണം
  rationale: മടങ്ങിവരവിന്റെ സമയത്തിനുള്ള കാരണമാണ് തുടർന്നുള്ള ഉപവാക്യം നൽകുന്നത്; ‘കാരണം’ ഈ വിശദീകരണബന്ധം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: לֹא שָׁלֵם
  choice: പൂർണമായിരിക്കുകയില്ല
  rationale: שָׁלֵם ഇവിടെ നിറവിലോ പൂർണ അളവിലോ എത്തുക എന്ന ആശയം നൽകുന്നു. ഭാവിസന്ദർഭത്തോട് യോജിക്കാൻ മലയാളത്തിൽ ഭാവികാലരൂപം ഉപയോഗിച്ചു.
- source_word: עֲוֹן
  choice: അകൃത്യം
  rationale: עָוֹן അകൃത്യം, കുറ്റം, കുറ്റബാധ്യത എന്നീ അർഥങ്ങൾ വഹിക്കാം. ഇവിടെ ധാർമിക ദുഷ്പ്രവൃത്തിയുടെ അളവ് പൂർണമാകുന്നതാണ് മുൻനിരയിൽ; ‘അകൃത്യം’ അതിനെ അനാവശ്യമായി വെറും കുറ്റബോധമായി ചുരുക്കുന്നില്ല.
- source_word: הָאֱמֹרִי
  choice: അമോര്യരുടെ
  rationale: എബ്രായരൂപം ഏകവചനമാണെങ്കിലും ഒരു ജനവിഭാഗത്തെ സമുച്ചയമായി സൂചിപ്പിക്കാം. സാധാരണ മലയാളത്തിൽ ജനസമൂഹത്തെ സൂചിപ്പിക്കാൻ ബഹുവചനബന്ധരൂപം സ്വാഭാവികമാണ്.
- source_word: עַד הֵנָּה
  choice: അതുവരെ
  rationale: പദശഃ ‘ഇവിടെവരെ’ എന്ന രൂപം കാലപരിധിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ഭാവിയിൽ പറഞ്ഞിരിക്കുന്ന മടങ്ങിവരവിന്റെ സമയത്തേക്കുള്ള പരിധി സന്ദർഭത്തിൽ ഉദ്ദേശിക്കപ്പെടുന്നതിനാൽ ‘അതുവരെ’ എന്നു നൽകി; പദശഃ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: വിധിയുടെ താമസവും അബ്രാമിന്റെ സന്തതികളുടെ മടങ്ങിവരവും
  choice: അമോര്യരുടെ അകൃത്യം പൂർണ അളവിലെത്താത്തതാണ് മടങ്ങിവരവ് താമസിക്കുന്നതിനുള്ള വാക്യത്തിൽ പ്രസ്താവിച്ച കാരണം എന്ന നിലയിൽ മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: ഈ താമസം ദൈവത്തിന്റെ ക്ഷമയെ പ്രത്യേകമായി ഊന്നുന്നു എന്നോ, പ്രധാനമായും ഇസ്രായേലിന്റെ ഈജിപ്തിലെ രൂപീകരണത്തിനായിരുന്നുവെന്നോ വിശദീകരിക്കുക.
  rationale: വാക്യം സമയക്രമത്തെ അമോര്യരുടെ അകൃത്യത്തിന്റെ അപൂർണതയുമായി നേരിട്ട് ബന്ധിപ്പിക്കുന്നു. അതിനപ്പുറമുള്ള ദൈവശാസ്ത്ര വിശദീകരണം ചേർക്കാതെ വാചകത്തിലെ സംഘർഷവും പരിമിതിയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തലമുറ’, ‘മടങ്ങിവരും’, ‘അകൃത്യം’ എന്നീ പൊതുവായി മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. മൂലത്തിലെ രണ്ട് വ്യത്യസ്ത הֵנָּה പ്രയോഗങ്ങൾ യഥാക്രമം സ്ഥലസൂചനയായ ‘ഇവിടേക്കു’ എന്നും കാലപരിധിയായ ‘അതുവരെ’ എന്നും സന്ദർഭാനുസൃതമായി വേർതിരിച്ചു.
