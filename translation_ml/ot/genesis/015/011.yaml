id: GEN.15.11
reference: Genesis 15:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֥רֶד הָ/עַ֖יִט עַל הַ/פְּגָרִ֑ים וַ/יַּשֵּׁ֥ב אֹתָ֖/ם אַבְרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/011.yaml
  text: And the birds of prey came down on the carcasses[a], and Abram drove them away.
translation:
  language: ml
  text: ഇരപിടിയൻ പക്ഷികൾ ജഡങ്ങളുടെമേൽ ഇറങ്ങിവന്നു[a]; അബ്രാം അവയെ ഓടിച്ചുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇരപിടിയൻ പക്ഷി ജഡങ്ങളുടെമേൽ ഇറങ്ങിവന്നു.” എബ്രായ നാമം ഏകവചനത്തിലുള്ള ഒരു കൂട്ടനാമമായി വായിക്കാം; എന്നാൽ ഇവിടെ ജഡം തിന്നുന്ന പക്ഷികളുടെ കൂട്ടമാണ് ഉദ്ദേശിച്ചിരിക്കുന്നതെന്നു തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: ഇറങ്ങിവന്നു
  rationale: ירד എന്ന ക്രിയയിലെ താഴോട്ടുള്ള ചലനവും ജഡങ്ങളിലേക്കുള്ള വരവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הָעַיִט
  choice: ഇരപിടിയൻ പക്ഷികൾ
  rationale: עַיִט ഏകവചനരൂപത്തിലാണെങ്കിലും കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന നാമമായി വായിക്കാം. ഇവിടെ ജഡങ്ങളിലേക്കു വരുന്ന പക്ഷികളുടെ കൂട്ടം എന്ന അർഥമാണ് സാഹചര്യത്തിന് യോജിക്കുന്നത്; ‘കഴുകന്മാർ’ എന്നു പറയുന്നത് മൂലപദത്തേക്കാൾ പ്രത്യേകമായിരിക്കും.
- source_word: הַפְּגָרִים
  choice: ജഡങ്ങൾ
  rationale: פֶּגֶר കൊല്ലപ്പെട്ട ജീവിയുടെ ജഡത്തെയോ ശവത്തെയോ സൂചിപ്പിക്കുന്നു. ഉടമ്പടി-യാഗത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘ജഡങ്ങൾ’ എന്നത് ‘കഷണങ്ങൾ’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ അർഥം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וַיַּשֵּׁב אֹתָם
  choice: അവയെ ഓടിച്ചുകളഞ്ഞു
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ അവയെ പിന്തിരിപ്പിക്കുക എന്ന അർഥത്തിലാണ്; അബ്രാമിന്റെ സജീവമായ അകറ്റൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אַבְרָם
  choice: അബ്രാം
  rationale: ഉല്പത്തി പുസ്തകത്തിലെ ഈ ഘട്ടത്തിൽ പേരിന്റെ രൂപം അബ്രാം തന്നെയാണ്; അബ്രാഹാം അല്ല.
