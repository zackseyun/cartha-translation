translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. എബ്രായത്തിലെ രണ്ടു വാക്യഘടകങ്ങളെയും ബന്ധിപ്പിക്കുന്ന וַ־യ്ക്ക് അധികമായ വൈരുധ്യം ചേർക്കാതെ അർധവിരാമം ഉപയോഗിച്ചു; എല്ലാ സർവനാമങ്ങളും പക്ഷികളെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ നപുംസക ബഹുവചനമായി നിലനിർത്തി.
