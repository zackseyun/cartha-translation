  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ קַדְמֹנִי (ഖദ്മോനി) എന്ന പദം ‘കിഴക്ക്’ അഥവാ ‘കിഴക്കൻ’ എന്ന ആശയവുമായി ബന്ധപ്പെട്ടതാണ്. എന്നാൽ ഇവിടെ ജനവിഭാഗങ്ങളുടെ പട്ടികയിൽ വരുന്നതിനാൽ അതിനെ ‘കദ്മോന്യർ’ എന്ന ജനനാമമായി നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת
  choice: '[പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന വ്യാകരണചിഹ്നമാണിത്; മലയാളത്തിൽ ഇതിന് സ്വതന്ത്ര പദസമാനത ആവശ്യമില്ല. വലിയ വാക്യത്തിലെ പട്ടികയുടെ ഘടനയിലൂടെ ഇതിന്റെ ധർമം വ്യക്തമാകുന്നു.
- source_word: הַקֵּינִי
  choice: കേന്യർ
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ ജനവിഭാഗനാമം ഇവിടെ സമൂഹവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നു. അതിനാൽ ആ ജനതയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാള ബഹുവചനരൂപം ഉപയോഗിച്ചു.
- source_word: וְאֶת
  choice: '[പട്ടികയിലെ വിരാമചിഹ്നത്തിലൂടെ പ്രതിഫലിപ്പിച്ചു]'
  rationale: സംയോജകം പട്ടികയിലെ ഇനങ്ങളെ ബന്ധിപ്പിക്കുന്നു; കർമചിഹ്നം പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല. മലയാളത്തിലെ സ്വാഭാവിക പട്ടികാശൈലിയിൽ കോമ ഈ ബന്ധം പ്രകടമാക്കുന്നു.
- source_word: הַקְּנִזִּי
  choice: കെനിസ്യർ
  rationale: ഭൂപ്രദേശവുമായി ബന്ധപ്പെട്ട ജനവിഭാഗങ്ങളുടെ പട്ടികയിലെ സമൂഹവാചക ജനനാമമായതിനാൽ മലയാള ബഹുവചന ജനനാമരൂപം തിരഞ്ഞെടുത്തു.
- source_word: וְאֵת
  choice: '[പട്ടികയിലെ വിരാമചിഹ്നത്തിലൂടെ പ്രതിഫലിപ്പിച്ചു]'
  rationale: അവസാന ഇനത്തെ ബന്ധിപ്പിക്കുന്ന സംയോജകത്തിന്റെ ധർമം മലയാളത്തിലെ പട്ടികാവിരാമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു; കർമചിഹ്നത്തിന് പ്രത്യേക പരിഭാഷയില്ല.
- source_word: הַקַּדְמֹנִי
  choice: കദ്മോന്യർ[a]
  rationale: ഈ പദത്തിന്റെ മൂലം ‘കിഴക്ക്’ അഥവാ ‘കിഴക്കൻ’ എന്ന ആശയവുമായി ബന്ധപ്പെട്ടതാണെങ്കിലും, സമാന്തര ജനനാമങ്ങളുടെ പട്ടികയിൽ ഇത് ഒരു ജനവിഭാഗനാമമായി പ്രവർത്തിക്കുന്നു. അതിനാൽ പേരിന്റെ സ്വഭാവം നിലനിർത്തുന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
