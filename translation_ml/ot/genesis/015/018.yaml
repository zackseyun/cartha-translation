id: GEN.15.18
reference: Genesis 15:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא כָּרַ֧ת יְהוָ֛ה אֶת אַבְרָ֖ם בְּרִ֣ית לֵ/אמֹ֑ר לְ/זַרְעֲ/ךָ֗ נָתַ֨תִּי֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/נְּהַ֣ר מִצְרַ֔יִם עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/018.yaml
  text: On that day Yahweh made a covenant with Abram[a], saying, “To your offspring I have given this land, from the river of Egypt as far as the great river[b], the Euphrates.”
translation:
  language: ml
  text: 'ആ ദിവസം യഹ്‌വെ അബ്രാമുമായി ഒരു ഉടമ്പടി ചെയ്തു[a]. യഹ്‌വെ പറഞ്ഞു: “നിന്റെ സന്തതിക്കു ഞാൻ ഈ ദേശം നൽകിയിരിക്കുന്നു—ഈജിപ്തിലെ നദി മുതൽ മഹാനദിയായ യൂഫ്രട്ടീസ് വരെ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ അക്ഷരാർഥം “ഒരു ഉടമ്പടി മുറിച്ചു” എന്നാണ്. ‘ഉടമ്പടി ചെയ്യുക’ എന്നർഥമുള്ള ഈ ശൈലി, ചുറ്റുമുള്ള ഭാഗത്തിൽ കാണുന്ന ഉടമ്പടി സ്ഥാപിക്കുന്ന ആചാരത്തെ പ്രതിഫലിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: “ഈജിപ്തിലെ തോട് മുതൽ” അല്ലെങ്കിൽ “ഈജിപ്തിലെ വാദി മുതൽ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ “ഈജിപ്തിലെ നദി” എന്നാണ്; എന്നാൽ കൃത്യമായ ഭൂമിശാസ്ത്രപരമായ പരാമർശം വിവാദവിഷയമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: ആ ദിവസം
  rationale: ഒരു നിർദിഷ്ട അവസരത്തെ സൂചിപ്പിക്കുന്ന കാലപ്രയോഗത്തിന്റെ സ്വാഭാവികവും അടുത്തതുമായ മലയാളരൂപം.
- source_word: כָּרַת ... בְּרִית
  choice: ഒരു ഉടമ്പടി ചെയ്തു
  rationale: അക്ഷരാർഥത്തിൽ ‘ഉടമ്പടി മുറിച്ചു’ എന്ന എബ്രായ ശൈലിയാണെങ്കിലും, അതിന്റെ അർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥവും ആചാരപരമായ പശ്ചാത്തലവും അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവികനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶת אַבְרָם
  choice: അബ്രാമുമായി
  rationale: ഉടമ്പടി സ്ഥാപിക്കുന്ന ബന്ധപരമായ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: അവിടന്ന് പറഞ്ഞു
  rationale: തുടർന്നുവരുന്ന ദൈവവചനം വ്യക്തമായി അവതരിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: לְזַרְעֲךָ
  choice: നിന്റെ സന്തതിക്കു
  rationale: זֶרַע എന്ന കൂട്ടായ ഏകവചനത്തിന്റെ വിശാലത നിലനിർത്തുകയും ‘വിത്ത്’ എന്ന അസ്വാഭാവിക അക്ഷരാർഥം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: נָתַתִּי
  choice: ഞാൻ ... നൽകിയിരിക്കുന്നു
  rationale: ഉടമ്പടിപ്രഖ്യാപനത്തിൽ ഉറപ്പോടെ നൽകിയ ദാനമായി അവതരിപ്പിക്കുന്ന perfect രൂപത്തിന്റെ പൂർത്തീകരണവും ഇപ്പോഴത്തെ പ്രസക്തിയും നിലനിർത്തുന്നു.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ഈ ദേശം
  rationale: ഭൂപ്രദേശപരമായ വാഗ്ദാനസന്ദർഭത്തിൽ אֶרֶץ എന്ന പദത്തിന്റെ സ്വാഭാവിക മലയാളസമാനം.
- source_word: מִנְּהַר מִצְרַיִם
  choice: ഈജിപ്തിലെ നദിമുതൽ
  rationale: נָהָר എന്നതിന്റെ സാധാരണ അർഥമായ ‘നദി’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഭൂമിശാസ്ത്രപരമായ തിരിച്ചറിയലിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עַד הַנָּהָר הַגָּדֹל
  choice: മഹാനദിയായ ... വരെ
  rationale: עַד സൂചിപ്പിക്കുന്ന അതിർത്തിവ്യാപ്തിയും ‘മഹാനദി’ എന്ന വിശേഷണവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נְהַר פְּרָת
  choice: യൂഫ്രട്ടീസ് നദി
  rationale: നദിയുടെ പ്രചാരത്തിലുള്ള മലയാളനാമം ഉപയോഗിച്ച് ‘മഹാനദി’യോടുള്ള സമാനാധികരണബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവികനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദംകൊണ്ട് പകരാതെ, മലയാളത്തിൽ സാധാരണമായ ‘യഹ്‌വെ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: נָתַתִּי എന്ന ഉടമ്പടിദാനത്തിന്റെ കാല-ഭാവം
  choice: ഞാൻ ... നൽകിയിരിക്കുന്നു
  alternative: ഞാൻ നൽകുന്നു; ഞാൻ നൽകി
  rationale: ദൈവിക ഉടമ്പടിപ്രഖ്യാപനം ദാനം ഉറപ്പായതായി അവതരിപ്പിക്കുന്നതിനൊപ്പം അതിന്റെ ഫലം ഇപ്പോഴും നിലനിൽക്കുന്നതായി സൂചിപ്പിക്കുന്നു; ചരിത്രപരമായ കൈമാറ്റം മുഴുവനായി പൂർത്തിയായെന്നതിലേക്കു വാചകത്തെ അതിരുകടത്തി നയിക്കുന്നില്ല.
- issue: זֶרַע എന്ന പദത്തിന്റെ കൂട്ടായ ഏകവചനസ്വഭാവം
  choice: സന്തതി
  alternative: വിത്ത്; സന്തതികൾ
  rationale: ഒരു വ്യക്തിയെയോ അനേകം പിൻതലമുറക്കാരെയോ വ്യാകരണപരമായി മുൻകൂട്ടി നിർണ്ണയിക്കാതെ മൂലപദത്തിന്റെ കൂട്ടായ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവികനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു. ‘അവിടന്ന്’ എന്ന ആദരസൂചക സർവനാമം ഉപയോഗിച്ചു. ഉടമ്പടിയുടെ സാങ്കേതികവും ദൈവശാസ്ത്രപരവുമായ അർഥം നിലനിർത്തിക്കൊണ്ട് എബ്രായ ശൈലിയുടെ അക്ഷരാർഥം അടിക്കുറിപ്പിലാക്കി.
