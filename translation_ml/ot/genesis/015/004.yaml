id: GEN.15.4
reference: Genesis 15:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה דְבַר יְהוָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר לֹ֥א יִֽירָשְׁ/ךָ֖ זֶ֑ה כִּי אִם֙ אֲשֶׁ֣ר יֵצֵ֣א מִ/מֵּעֶ֔י/ךָ ה֖וּא יִֽירָשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/004.yaml
  text: And behold, the word of the LORD came to him, saying, “This man will not be your heir; rather, one who comes from your own body will be your heir.”
translation:
  language: ml
  text: 'ഇതാ, യഹോവയുടെ വചനം അവന്റെ അടുക്കൽ വന്നു: “ഇവൻ നിന്റെ അവകാശിയാകുകയില്ല; നിന്റെ ശരീരത്തിൽനിന്ന് ഉത്ഭവിക്കുന്നവൻ നിന്റെ അവകാശിയാകും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: അപ്പോൾ ഇതാ
  rationale: ആഖ്യാനത്തിലെ പെട്ടെന്നുള്ള ദൈവിക ഇടപെടലിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: דְבַר יְהוָה
  choice: യഹോവയുടെ അരുളപ്പാട്
  rationale: ദൈവത്തിൽനിന്നുള്ള സന്ദേശം എന്ന അർഥം dignified Malayalam-ൽ നൽകുന്നു; יהוה എന്ന ദൈവനാമം ‘യഹോവ’യായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: לֹא יִירָשְׁךָ זֶה
  choice: ഇവൻ നിന്റെ അവകാശിയാകുകയില്ല
  rationale: זֶה എന്ന പുരുഷലിംഗ ഏകവചന സൂചനയെ ‘ഇവൻ’ എന്നു നിലനിർത്തുകയും ירשׁ എന്ന അവകാശലഭന ആശയം വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: നിന്റെ സ്വന്തം ശരീരത്തിൽനിന്ന് ജനിക്കുന്നവൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ ഉള്ളിൽനിന്ന്/അന്തരാവയവങ്ങളിൽനിന്ന് പുറപ്പെടുന്നവൻ’; ഇവിടെ അബ്രാമിന്റെ ജൈവസന്തതിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: הוּא יִירָשֶׁךָ
  choice: അവൻതന്നെ നിന്റെ അവകാശിയാകും
  rationale: הוּאയുടെ ഊന്നൽ ‘തന്നെ’ ഉപയോഗിച്ച് പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: വാഗ്ദത്താവകാശിയുടെ ജൈവബന്ധം
  choice: നിന്റെ സ്വന്തം ശരീരത്തിൽനിന്ന് ജനിക്കുന്നവൻ
  alternative: നിന്റെ ഉദരത്തിൽനിന്ന് പുറപ്പെടുന്നവൻ
  rationale: വാചകം അബ്രാമിൽനിന്നുള്ള നേരിട്ടുള്ള ജൈവസന്തതിയെ ഉറപ്പിക്കുന്നു; എന്നാൽ പിന്നീട് വരുന്ന വിവരണത്തെ മുൻകൂട്ടി വ്യാഖ്യാനിക്കാതെ വചനത്തിന്റെ പരിധി പാലിക്കുന്നു.
- issue: ദൈവനാമമായ יהוהയുടെ പ്രതിനിധാനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ തുറന്നുവെക്കുന്നു; സാധാരണ പദവിയായ ‘കർത്താവ്’ എന്നതുമായി ലയിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രുവിലെ ശ്രദ്ധാകർഷകമായ ‘ഇതാ’യും הוּאയുടെ ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
