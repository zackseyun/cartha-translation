review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the emphatic assurance, collective “offspring,” foreign residence in a land not belonging to them, the unspecified plural oppressors, and the four-hundred-year duration. Retaining the active plural verbs and their ambiguity is faithful to the Hebrew.
  naturalness: The wording is generally natural modern standard Malayalam. However, “അടിമവേല ചെയ്യിക്കുകയും” is not the normal causative construction here and can sound incomplete/awkward. “അടിമവേല ചെയ്യിപ്പിക്കുകയും” idiomatically means ‘make them do slave labor’ and preserves the Hiphil’s causative force.
  terminology: “സന്തതി,” “പരദേശികളായി പാർക്കും,” and “പീഡിപ്പിക്കുകയും” fit a dignified modern biblical register. The revised forced-labor expression is more idiomatic while avoiding needless doctrinal or historical specification.
  issues:
  - severity: medium
    issue: Causative expression for forced service is grammatically/idiomatically awkward
    rationale: In Malayalam, “അടിമവേല ചെയ്യിക്കുക” is less natural in this construction; “അടിമവേല ചെയ്യിപ്പിക്കുക” clearly and idiomatically expresses compelling someone to perform slave labor, matching וַעֲבָדוּם.
