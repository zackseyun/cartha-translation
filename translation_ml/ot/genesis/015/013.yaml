source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לְ/אַבְרָ֗ם יָדֹ֨עַ תֵּדַ֜ע כִּי גֵ֣ר יִהְיֶ֣ה זַרְעֲ/ךָ֗ בְּ/אֶ֨רֶץ֙ לֹ֣א לָ/הֶ֔ם וַ/עֲבָד֖וּ/ם וְ/עִנּ֣וּ אֹתָ֑/ם אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/013.yaml
  text: Then he said to Abram[a], “Know for certain that your offspring will be sojourners in a land not theirs[c][b], and they will enslave them and afflict them four hundred years.”
translation:
  language: ml
  text: 'പിന്നെ അവൻ അബ്രാമിനോടു പറഞ്ഞു: “നിശ്ചയമായി അറിഞ്ഞുകൊൾക: നിന്റെ സന്തതി തങ്ങളുടേതല്ലാത്ത ഒരു ദേശത്ത് പരദേശികളായി പാർക്കും[a]. അവർ അവരെ അടിമവേല ചെയ്യിപ്പിക്കുകയും[b] പീഡിപ്പിക്കുകയും ചെയ്യും—നാനൂറു വർഷം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അന്യദേശവാസികളായി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം സ്വന്തമല്ലാത്ത ദേശത്ത് നാട്ടുകാരല്ലാത്തവരായി താമസിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അവർ അവരെക്കൊണ്ട് സേവിപ്പിക്കും.’ ഇവിടെ നിർബന്ധിത സേവനമോ അടിമവേലയോ ആണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ആദ്യത്തെ ‘അവർ’ ആരെന്ന് വാക്യത്തിൽ തുറന്നുപറയുന്നില്ല; സന്ദർഭത്തിൽ അത് ആ ദേശത്തിലെ ജനങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: יָדֹעַ תֵּדַע
  choice: നിശ്ചയമായി അറിഞ്ഞുകൊൾക
  rationale: ידע എന്ന ക്രിയയുടെ infinitive absolute-ഉം imperfect-ഉം ചേർന്ന പ്രയോഗം ഉറപ്പിനെയും ഊന്നലിനെയും സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം അതിനെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: גֵר
  choice: പരദേശികളായി പാർക്കും
  rationale: സ്വന്തമല്ലാത്ത ദേശത്ത് നാട്ടുകാരല്ലാത്തവരായി താമസിക്കുന്നവരെയാണ് גֵר സൂചിപ്പിക്കുന്നത്. ‘പരദേശികളായി പാർക്കും’ എന്നത് ആ താമസസ്ഥിതിയെ ആധുനിക നിയമപരമായ അർഥങ്ങൾ ചുമത്താതെ വ്യക്തമാക്കുന്നു.
- source_word: זַרְעֲךָ
  choice: നിന്റെ സന്തതി
  rationale: זֶרַע ഇവിടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനമാണ്. ‘സന്തതി’ അതിന്റെ കൂട്ടായ ഏകവചനഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בְּאֶרֶץ לֹא לָהֶם
  choice: തങ്ങളുടേതല്ലാത്ത ഒരു ദേശത്ത്
  rationale: ദേശത്തിന്റെ ഉടമസ്ഥത അവർക്കില്ലെന്ന എബ്രായവാചകത്തിന്റെ ആശയം നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וַעֲבָדוּם
  choice: അവർ അവരെ അടിമവേല ചെയ്യിക്കുകയും
  rationale: עבד എന്ന ക്രിയയുടെ hiphil രൂപം മറ്റൊരാളെക്കൊണ്ട് സേവിപ്പിക്കുക എന്ന നിർബന്ധിത സേവനത്തിന്റെ ആശയം നൽകുന്നു. സജീവവാക്യവും ബഹുവചന കർത്താവും കർമവും മൂലപാഠത്തിനനുസരിച്ച് നിലനിർത്തിയിരിക്കുന്നു.
- source_word: וְעִנּוּ אֹתָם
  choice: പീഡിപ്പിക്കുകയും ചെയ്യും
  rationale: piel രൂപത്തിലുള്ള ענה കഠിനമായി താഴ്ത്തുക, ക്ലേശിപ്പിക്കുക, പീഡിപ്പിക്കുക എന്നീ ആശയങ്ങൾ നൽകുന്നു; ‘പീഡിപ്പിക്കുക’ സാമൂഹികവും ശാരീരികവുമായ ദുരനുഭവങ്ങളെ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക പദമാണ്.
- source_word: אַרְבַּע מֵאוֹת שָׁנָה
  choice: നാനൂറു വർഷം
  rationale: മൂലപാഠത്തിലെ കാലദൈർഘ്യം വാക്യാവസാനത്തിൽ തന്നെയാക്കി, അടിമവേലയുടെയും പീഡനത്തിന്റെയും കാലപരിധിയോടുള്ള ബന്ധം നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר לְאַבְרָם
  choice: പിന്നെ അവൻ അബ്രാമിനോടു പറഞ്ഞു
  rationale: waw-consecutive സൂചിപ്പിക്കുന്ന കഥാക്രമം ‘പിന്നെ’ എന്ന സ്വാഭാവിക മലയാളബന്ധകത്തിലൂടെ നൽകുന്നു.
theological_decisions:
- issue: ‘അവർ അവരെ അടിമവേല ചെയ്യിക്കുകയും പീഡിപ്പിക്കുകയും ചെയ്യും’ എന്നതിലെ ബഹുവചന കർത്താവിന്റെ സൂചന
  choice: മൂലപാഠത്തിലെ വ്യക്തമാക്കാത്ത ‘അവർ’ എന്ന കർത്താവിനെ മുഖ്യവാചകത്തിൽ അതേപടി നിലനിർത്തി; സന്ദർഭത്തിൽ അത് ആ വിദേശദേശത്തിലെ ജനങ്ങളെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘ആ ദേശക്കാർ നിന്റെ സന്തതിയെ അടിമകളാക്കി പീഡിപ്പിക്കും’ എന്ന് കർത്താവിനെ തുറന്നുപറയുക, അല്ലെങ്കിൽ കർമണിപ്രയോഗം ഉപയോഗിക്കുക.
  rationale: എബ്രായത്തിൽ കർത്താവ് ബഹുവചനക്രിയയിലൂടെ മാത്രം പ്രത്യക്ഷപ്പെടുന്നു; ‘ആ ദേശക്കാർ’ എന്ന് ചേർക്കുന്നത് സന്ദർഭപരമായ നിഗമനം മുഖ്യവാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യും. അതേസമയം കർമണിപ്രയോഗം മൂലത്തിലെ സജീവരൂപം മറയ്ക്കും. അതിനാൽ യഥാർഥമായ സൂചനാത്മകതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- issue: നാനൂറു വർഷം എന്ന കാലദൈർഘ്യം ഏതിനോടാണ് ചേർക്കേണ്ടത്
  choice: വാക്യാവസാനത്തിൽ വെച്ച് അടിമവേലയെയും പീഡനത്തെയും ഒരുമിച്ച് വ്യാപിപ്പിക്കാൻ അനുവദിച്ചു.
  alternative: ‘നാനൂറു വർഷത്തേക്ക് അവർ അവരെ പീഡിപ്പിക്കും’ എന്ന് പീഡനത്തോടു മാത്രം വ്യക്തമായി ബന്ധിപ്പിക്കുക.
  rationale: എബ്രായവാക്യത്തിൽ കാലദൈർഘ്യം അവസാനം വരുന്നു; അതിന്റെ വ്യാകരണപരമായ പരിധി പൂർണമായി ചുരുക്കാതെ അതേ തുറന്ന നില മലയാളത്തിലും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വേദപുസ്തകശൈലി സ്വീകരിച്ചു. ‘അറിഞ്ഞുകൊൾക,’ ‘സന്തതി,’ ‘പരദേശികൾ’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നതുമാണ്. സജീവവാക്യത്തിലെ സർവനാമസൂചന മനപ്പൂർവം സംരക്ഷിച്ച് വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
