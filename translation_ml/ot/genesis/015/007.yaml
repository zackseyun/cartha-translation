- from: 'അവൻ അവനോടു പറഞ്ഞു: “ഈ ദേശം നിനക്കു കൈവശമാക്കാൻ[a] തരേണ്ടതിന് നിന്നെ കൽദയരുടെ ഊരിൽനിന്ന് പുറപ്പെടുവിച്ച യഹ്‌വേ ഞാനാണ്.”'
  to: 'അവൻ അവനോടു പറഞ്ഞു: “ഞാൻ യഹ്‌വേ ആകുന്നു; ഈ ദേശം നിനക്കു നൽകാനും നീ അതു കൈവശമാക്കാനും ഞാൻ നിന്നെ കൽദയരുടെ ഊരിൽനിന്ന് പുറത്തുകൊണ്ടുവന്നു.”'
  rationale: 'The revision preserves the Hebrew narrative and purpose relation while making the two purposes explicit and natural in Malayalam: Yahweh brought Abram out in order to give him the land and for him to possess it. The footnote retains the legitimate ‘inherit’ nuance of ירשׁ.'
