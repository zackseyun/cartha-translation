id: GEN.15.7
reference: Genesis 15:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑י/ו אֲנִ֣י יְהוָ֗ה אֲשֶׁ֤ר הוֹצֵאתִ֨י/ךָ֙ מֵ/א֣וּר כַּשְׂדִּ֔ים לָ֧/תֶת לְ/ךָ֛ אֶת הָ/אָ֥רֶץ הַ/זֹּ֖את לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/007.yaml
  text: And he said to him[a], “I am Yahweh[c][b], who brought you out from Ur of the Chaldeans to give you this land to possess.”
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “ഞാൻ യഹ്‌വേ ആകുന്നു; ഈ ദേശം നിനക്കു നൽകാനും നീ അതു കൈവശമാക്കാനും ഞാൻ നിന്നെ കൽദയരുടെ ഊരിൽനിന്ന് പുറത്തുകൊണ്ടുവന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: അവൻ അവനോടു പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിന്റെ തുടർച്ചയും പരോക്ഷ കർമവും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: אֲנִי יְהוָה
  choice: യഹ്‌വേ ഞാനാണ്
  rationale: ക്രിയയില്ലാത്ത ഹീബ്രായ വാക്യം സ്വാഭാവിക മലയാളത്തിൽ ‘ഞാനാണ്’ എന്നു പൂരിപ്പിക്കുന്നു; ദൈവനാമം സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הוֹצֵאתִיךָ
  choice: നിന്നെ … പുറപ്പെടുവിച്ച
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള ‘പുറത്തേക്കു വരുത്തുക’ എന്ന കാരകാർഥം സംരക്ഷിക്കുന്നു.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: കൽദയരുടെ ഊരിൽനിന്ന്
  rationale: ഊർ എന്ന സ്ഥലനാമവും അതിനോടു ചേർന്ന ജനവിഭാഗസൂചനയും വ്യക്തമായി നൽകുന്നു.
- source_word: לָתֶת לְךָ אֶת הָאָרֶץ הַזֹּאת
  choice: ഈ ദേശം നിനക്കു … തരേണ്ടതിന്
  rationale: ל ഘടിപ്പിച്ച infinitive സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: לְרִשְׁתָּהּ
  choice: കൈവശമാക്കാൻ
  rationale: ירשׁ ഇവിടെ ദേശം സ്വന്തമായി ഏറ്റെടുത്തു കൈവശം വയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അവകാശമാക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ירשׁ എന്ന പദത്തിലെ കൈവശപ്പെടുത്തൽ/അവകാശലഭ്യത ഭാവം
  choice: കൈവശമാക്കാൻ
  alternative: അവകാശമാക്കാൻ
  rationale: സന്ദർഭത്തിൽ ദേശം ലഭിച്ചു കൈവശം വയ്ക്കുന്നതാണ് മുഖ്യമായത്; എന്നാൽ അവകാശമായി ലഭിക്കുക എന്ന ഭാവവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രായ വാക്യക്രമം മലയാളത്തിൽ ഗ്രാഹ്യമാകുന്ന വിധം ക്രമപ്പെടുത്തിയെങ്കിലും ഉദ്ദേശ്യബന്ധവും ദൈവത്തിന്റെ സ്വയംപരിചയപ്പെടുത്തലും നിലനിർത്തിയിരിക്കുന്നു.
