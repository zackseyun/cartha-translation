source:
  edition: WLC
  text: וַ/יּוֹצֵ֨א אֹת֜/וֹ הַ/ח֗וּצָ/ה וַ/יֹּ֨אמֶר֙ הַבֶּט נָ֣א הַ/שָּׁמַ֗יְמָ/ה וּ/סְפֹר֙ הַ/כּ֣וֹכָבִ֔ים אִם תּוּכַ֖ל לִ/סְפֹּ֣ר אֹתָ֑/ם וַ/יֹּ֣אמֶר ל֔/וֹ כֹּ֥ה יִהְיֶ֖ה זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/005.yaml
  text: Then he brought him outside and said[a], “Please look toward the heavens and count the stars, if you are able to count them.” Then he said to him, “So shall your offspring be.”
translation:
  language: ml
  text: 'പിന്നെ അവൻ അബ്രാമിനെ പുറത്തേക്കു കൊണ്ടുവന്ന് പറഞ്ഞു: “ദയവായി ആകാശത്തേക്കു നോക്കുക; നക്ഷത്രങ്ങളെ എണ്ണുക, നിനക്കവയെ എണ്ണാൻ കഴിയുമെങ്കിൽ.” പിന്നെ അവൻ അബ്രാമിനോടു പറഞ്ഞു: “നിന്റെ സന്തതി[a] ഇതുപോലെയായിരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്റെ വിത്ത്”; എബ്രായ നാമം രൂപത്തിൽ ഏകവചനമാണെങ്കിലും കൂട്ടാർഥത്തിൽ ഉപയോഗിക്കപ്പെടുകയും സന്തതിയെ ഒന്നാകെ സൂചിപ്പിക്കയും ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא אֹתוֹ הַחוּצָה
  choice: അവൻ അബ്രാമിനെ പുറത്തേക്കു കൊണ്ടുവന്നു
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഒരാളെ പുറത്തേക്കു പോകാൻ ഇടയാക്കുക എന്ന കാരണാർത്ഥം നൽകുന്നു. സർവനാമങ്ങളുടെ പരമ്പര മൂലമുള്ള ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സന്ദർഭത്തിൽ വ്യക്തമായ ‘അബ്രാം’ എന്ന പേര് ഉപയോഗിച്ചു.
- source_word: הַבֶּט נָא הַשָּׁמַיְמָה
  choice: ദയവായി ആകാശത്തേക്കു നോക്കുക
  rationale: הבט എന്ന ആജ്ഞയും അതിനെ മൃദുവാക്കുകയോ അഭ്യർഥനാഭാവം നൽകുകയോ ചെയ്യുന്ന נא എന്ന കണികയും സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു. ദിശാസൂചകമായ അവസാനപ്രത്യയത്തിന്റെ അർത്ഥം ‘ആകാശത്തേക്ക്’ എന്നതിൽ നിലനിർത്തുന്നു.
- source_word: וּסְפֹר הַכּוֹכָבִים
  choice: നക്ഷത്രങ്ങളെ എണ്ണുക
  rationale: ספר ഇവിടെ എണ്ണുക എന്ന നേരിട്ടുള്ള അർത്ഥത്തിലാണ്; הכוכבים എന്നത് ‘നക്ഷത്രങ്ങൾ’ എന്നാണ്.
- source_word: אִם תּוּכַל לִסְפֹּר אֹתָם
  choice: നിനക്ക് എണ്ണാൻ കഴിയുമെങ്കിൽ
  rationale: കഴിവിനെ സൂചിപ്പിക്കുന്ന വ്യവസ്ഥ സ്വാഭാവികവും കൃത്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘അവയെ’ ആവർത്തിക്കാതെ മലയാളത്തിന്റെ സ്വാഭാവിക ശൈലി പാലിക്കുന്നു.
- source_word: כֹּה יִהְיֶה זַרְעֶךָ
  choice: നിന്റെ സന്തതി ഇതുപോലെയായിരിക്കും
  rationale: כֹּה എന്ന താരതമ്യസൂചനയ്ക്ക് ‘ഇതുപോലെ’ എന്നും, രൂപത്തിൽ ഏകവചനമായിരുന്നാലും കൂട്ടാർഥമുള്ള זֶרַע എന്ന പദത്തിന് ഏക-കൂട്ടാർഥ സാധ്യത പൂർണമായി ഇല്ലാതാക്കാത്ത ‘സന്തതി’ എന്നും നൽകി.
theological_decisions:
- issue: അബ്രാഹാമിക വാഗ്ദാനത്തിലെ זַרְעֶךָ എന്ന രൂപത്തിൽ ഏകവചന-കൂട്ടാർഥ അനുരണനം
  choice: നിന്റെ സന്തതി
  alternative: നിന്റെ വിത്ത്; നിന്റെ സന്തതികൾ
  rationale: ‘സന്തതി’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൂട്ടാർഥത്തിൽ ഉപയോഗിക്കാവുന്നതുമായ പദമാണ്; ‘സന്തതികൾ’ എന്നത് ബഹുവചനം കൂടുതൽ വ്യക്തമായി നിർണ്ണയിക്കും, ‘വിത്ത്’ എന്നത് ഇവിടെ അസ്വാഭാവികമാകുകയും ജൈവാർഥം മുൻനിരയിൽ കൊണ്ടുവരികയും ചെയ്യും. അതിനാൽ പിൽക്കാല ദൈവശാസ്ത്രപരമായ വായനകളെ മുൻകൂട്ടി തീർപ്പാക്കാതെ മൂലപാഠത്തിലെ സംഘർഷം പരമാവധി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമവും അബ്രാമിനെ സൂചിപ്പിക്കുന്ന സർവനാമവും തുടർച്ചയായി വന്നാൽ ഉണ്ടാകാവുന്ന ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ അബ്രാമിന്റെ പേര് രണ്ടിടത്ത് വ്യക്തമാക്കിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘സന്തതി’ പ്രസ്താവനയ്ക്കു പിന്നാലെ നൽകിയിരിക്കുന്നു.
