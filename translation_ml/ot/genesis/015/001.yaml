id: GEN.15.1
reference: Genesis 15:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הָיָ֤ה דְבַר יְהוָה֙ אֶל אַבְרָ֔ם בַּֽ/מַּחֲזֶ֖ה לֵ/אמֹ֑ר אַל תִּירָ֣א אַבְרָ֗ם אָנֹכִי֙ מָגֵ֣ן לָ֔/ךְ שְׂכָרְ/ךָ֖ הַרְבֵּ֥ה מְאֹֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/001.yaml
  text: After these things[a], the word of Yahweh came to Abram in a vision, saying, “Do not fear, Abram. I am a shield for you; your reward will be very great.”
translation:
  language: ml
  text: 'ഈ കാര്യങ്ങൾക്കുശേഷം, ഒരു ദർശനത്തിൽ അബ്രാമിന് യഹ്‌വേയുടെ വചനം വന്നു: “അബ്രാമേ, ഭയപ്പെടേണ്ടാ. ഞാൻ നിനക്കൊരു പരിചയാണ്; നിന്റെ പ്രതിഫലം അത്യന്തം വലുതായിരിക്കും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഞാനാണ് നിന്റെ പരിച; നിന്റെ പ്രതിഫലം അത്യന്തം വലുതാണ്.”
    reason: മൂലപാഠത്തിലെ ആദ്യ പ്രസ്താവന ‘നിന്റെ പരിച’ എന്നും ക്രിയയില്ലാത്ത രണ്ടാമത്തെ പ്രസ്താവന വർത്തമാനകാലത്തിലും സ്വാഭാവികമായി മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: ഈ കാര്യങ്ങൾക്കുശേഷം
  rationale: דְּבָרִים എന്ന പദത്തിന് വാക്കുകൾ, കാര്യങ്ങൾ, സംഭവങ്ങൾ എന്നീ അർഥവ്യാപ്തിയുണ്ട്. മുൻവിവരണത്തിലെ സംഭവങ്ങളെ സൂചിപ്പിക്കുമ്പോഴും അതിനെ അനാവശ്യമായി ചുരുക്കാതെ ‘കാര്യങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: דְבַר יְהוָה
  choice: യഹ്‌വേയുടെ വചനം
  rationale: വെളിപ്പാടിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ തിരിച്ചറിയാവുന്ന രൂപവും ദൈവനാമവും നിലനിർത്തുന്നു.
- source_word: בַּמַּחֲזֶה
  choice: ഒരു ദർശനത്തിൽ
  rationale: മനുഷ്യന് ലഭിക്കുന്ന ദൃശ്യവെളിപ്പാടിനെയാണ് מַחֲזֶה സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അനിശ്ചിതമായ പരാമർശം സ്വാഭാവികമാക്കാൻ ‘ഒരു’ ചേർത്തു.
- source_word: אַל תִּירָא
  choice: ഭയപ്പെടേണ്ടാ
  rationale: നേരിട്ടുള്ള നിരോധനത്തെ ആധുനികവും മാന്യവുമായ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מָגֵן לָךְ
  choice: ഞാൻ നിനക്കൊരു പരിചയാണ്
  rationale: ‘പരിച’ എന്ന പദത്തിന് എബ്രായത്തിൽ പ്രത്യക്ഷമായ ഉടമസ്ഥപ്രത്യയം ഇല്ലാത്തതിനാൽ ‘നിന്റെ പരിച’ എന്നു മുഖ്യപാഠത്തിൽ മാറ്റാതെ לָךְ എന്നതിന്റെ ‘നിനക്ക്/നിനക്കായി’ എന്ന ഘടന നിലനിർത്തുന്നു.
- source_word: שְׂכָרְךָ
  choice: നിന്റെ പ്രതിഫലം
  rationale: שָׂכָר എന്നത് കൂലി, പ്രതിഫലം, പാരിതോഷികം എന്നിവ സൂചിപ്പിക്കാം; ഉടമ്പടിപരമായ വാഗ്ദാനസന്ദർഭത്തിൽ ‘പ്രതിഫലം’ അർഥവ്യാപ്തി നന്നായി നിലനിർത്തുന്നു.
- source_word: הַרְבֵּה מְאֹד
  choice: അത്യന്തം വലുതായിരിക്കും
  rationale: ക്രിയയില്ലാത്ത എബ്രായ വാക്യഖണ്ഡത്തെ വാഗ്ദാനസന്ദർഭത്തിന് യോജിച്ച ഭാവികാലത്തിൽ സ്വാഭാവിക മലയാളമാക്കി; തീവ്രതയ്ക്കായി ‘അത്യന്തം’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവത്തിന്റെ ഉടമ്പടിനാമം പൊതുപദവിയായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: שְׂכָרְךָ הַרְבֵּה מְאֹד എന്ന വാഗ്ദാനവാക്യത്തിന്റെ വ്യാഖ്യാനം
  choice: നിന്റെ പ്രതിഫലം അത്യന്തം വലുതായിരിക്കും
  alternative: നിന്റെ പ്രതിഫലം അത്യന്തം വലുതാണ്
  rationale: മസോരറ്റിക് വിഭജനവും വാക്യഘടനയും ‘പരിച’യും ‘പ്രതിഫലവും’ രണ്ട് പ്രസ്താവനകളായി വായിക്കുന്നതിനെ പിന്തുണയ്ക്കുന്നു. എബ്രായത്തിലെ ക്രിയാരഹിതത്വം സ്വയം കാലം നിർണ്ണയിക്കാത്തതിനാൽ, മുഖ്യപാഠത്തിൽ സന്ദർഭത്തിലെ വാഗ്ദാനഭാവം സ്വീകരിക്കുകയും മറ്റൊരു സ്വാഭാവിക വായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
- issue: מָגֵן לָךְ എന്നതിലെ ബന്ധം
  choice: ഞാൻ നിനക്കൊരു പരിചയാണ്
  alternative: ഞാനാണ് നിന്റെ പരിച
  rationale: ദൈവം തന്നെയാണ് അബ്രാമിന്റെ സംരക്ഷണം എന്ന ആശയം ഇരുവായനകളിലും നിലനിൽക്കുന്നു; മുഖ്യപാഠം എബ്രായത്തിലെ לָךְ എന്ന ഘടനയോട് കൂടുതൽ അടുത്തുനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘വചനം’, ‘ദർശനം’, ‘പരിച’, ‘പ്രതിഫലം’ എന്നീ സാധാരണക്കാർക്ക് മനസ്സിലാകുന്നെങ്കിലും ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച പദങ്ങൾ ഉപയോഗിച്ചു; പഴഞ്ചൻ ക്രിയാരൂപങ്ങളും വിഭാഗീയ പദാവലിയും ഒഴിവാക്കി.
