id: GEN.15.9
reference: Genesis 15:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו קְחָ֥/ה לִ/י֙ עֶגְלָ֣ה מְשֻׁלֶּ֔שֶׁת וְ/עֵ֥ז מְשֻׁלֶּ֖שֶׁת וְ/אַ֣יִל מְשֻׁלָּ֑שׁ וְ/תֹ֖ר וְ/גוֹזָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/009.yaml
  text: And he said to him[a], “Bring me a three-year-old heifer, a three-year-old female goat, a three-year-old ram, a turtledove[b], and a young pigeon.”
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “മൂന്നു വയസ്സുള്ള ഒരു പെൺകിടാരിയെയും മൂന്നു വയസ്സുള്ള ഒരു പെൺകോലാടിനെയും മൂന്നു വയസ്സുള്ള ഒരു ആട്ടുകൊറ്റനെയും[b] ഒരു കുറുപ്രാവിനെയും ഒരു പ്രാവിൻകുഞ്ഞിനെയും എനിക്കായി കൊണ്ടുവരുക[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘എനിക്കായി എടുക്കുക.’ ഇവിടെ ഉടമ്പടിച്ചടങ്ങിനായി മൃഗങ്ങളെ സമ്പാദിച്ച് കൊണ്ടുവരുക എന്നതാണ് സന്ദർഭാർഥം.
    reason: lexical_alternative
  - marker: b
    text: ‘മൂന്നു വയസ്സുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ആവർത്തിത ഹീബ്രുപദം ഇവിടെ മൃഗങ്ങളുടെ പ്രായത്തെയാണ് സൂചിപ്പ Jenningsുന്നതെന്ന് പരമ്പരാഗതമായി മനസ്സിലാക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: അവൻ അവനോടു പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനക്രമവും മൂന്നാംപുരുഷ പരാമർശവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ രണ്ടാമത്തെ ‘അവൻ’ അബ്രാമാണ്.
- source_word: קְחָה לִי
  choice: എനിക്കായി കൊണ്ടുവരുക
  rationale: അക്ഷരാർഥം ‘എനിക്കായി എടുക്കുക’ എന്നാണെങ്കിലും, ഉടമ്പടിച്ചടങ്ങിനായി മൃഗങ്ങളെ സമ്പാദിച്ച് ഹാജരാക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עֶגְלָה
  choice: പശു
  rationale: പെൺവർഗത്തിലുള്ള ഇളം കന്നുകാലിയെയാണ് സൂചിപ്പിക്കുന്നത്; മൂന്നു വയസ്സ് എന്ന വിശേഷണം ചേർന്നതിനാൽ ‘പശു’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: מְשֻׁלֶּשֶׁת / מְשֻׁלָּשׁ
  choice: മൂന്നു വയസ്സുള്ള
  rationale: ഈ മൃഗപ്പട്ടികയുടെ സന്ദർഭത്തിൽ പരമ്പരാഗതവും സാധ്യതയേറിയതുമായ വ്യാഖ്യാനം പ്രായസൂചനയാണ്; പദത്തിന്റെ അപൂർവത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: עֵז
  choice: പെൺകോലാട്
  rationale: പെൺ ആടിനെയാണ് ഹീബ്രു പദം സൂചിപ്പിക്കുന്നത്; ലിംഗവ്യത്യാസം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אַיִל
  choice: ആട്ടുകൊറ്റൻ
  rationale: ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്ന സാധാരണവും കൃത്യവുമായ മലയാളപദം.
- source_word: תֹר
  choice: കുറുപ്രാവ്
  rationale: പൊതുവായ ‘പ്രാവ്’ എന്നതിനെക്കാൾ turtledove എന്ന പ്രത്യേക പക്ഷിവർഗത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത മലയാളപദം.
- source_word: גוֹזָל
  choice: പ്രാവിൻകുഞ്ഞ്
  rationale: പദത്തിന് പൊതുവായി ‘പക്ഷിക്കുഞ്ഞ്’ എന്ന അർഥമുണ്ടെങ്കിലും, കുറുപ്രാവിനോടു ചേർന്നുള്ള യാഗസന്ദർഭത്തിൽ ഇളം പ്രാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ പട്ടികാക്രമവും ഓരോ മൃഗത്തിന്റെയും ലിംഗ/വർഗ വ്യത്യാസവും കഴിയുന്നത്ര നിലനിർത്തി. അടിക്കുറിപ്പ് [b] അത് വിശദീകരിക്കുന്ന മൂന്നു പ്രായപ്രയോഗങ്ങൾക്കു പിന്നാലെ സ്ഥാപിച്ചു.
