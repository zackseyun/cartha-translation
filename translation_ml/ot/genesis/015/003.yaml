id: GEN.15.3
reference: Genesis 15:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְרָ֔ם הֵ֣ן לִ֔/י לֹ֥א נָתַ֖תָּה זָ֑רַע וְ/הִנֵּ֥ה בֶן בֵּיתִ֖/י יוֹרֵ֥שׁ אֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/003.yaml
  text: Then Abram said[a], “Behold, you have given me no offspring, and behold[b], a son of my household will inherit me.”
translation:
  language: ml
  text: 'അപ്പോൾ അബ്രാം പറഞ്ഞു: “ഇതാ, നീ എനിക്ക് സന്തതിയെ[a] തന്നിട്ടില്ല; ഇതാ, എന്റെ വീട്ടിൽപ്പെട്ട ഒരുവനാണ് എന്റെ അവകാശിയാകുന്നത്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സന്തതി” എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദത്തിന്റെ അക്ഷരാർഥം “വിത്ത്” എന്നാണ്; ഇവിടെ അത് മക്കളെയോ പിൻതലമുറയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “എന്റെ വീട്ടിലെ ഒരു മകൻ എന്നെ അവകാശമായി പ്രാപിക്കുന്നു.” ഇതിനെ “എന്റെ അവകാശിയാകുന്നു” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയുടെ അടുത്ത ഘട്ടത്തിലേക്കു നീങ്ങുന്നതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: הֵן / וְהִנֵּה
  choice: ഇതാ / ഇതാ
  rationale: രണ്ടു ശ്രദ്ധാകർഷക നിപാതങ്ങളുടെയും ഊന്നൽ നിലനിർത്തുകയും അവയ്ക്കിടയിലെ വാചകസമാന്തര്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לֹא נָתַתָּה זָרַע
  choice: നീ എനിക്ക് സന്തതിയെ തന്നിട്ടില്ല
  rationale: പൂർത്തിക്രിയ ഇതുവരെയുള്ള അവസ്ഥയെക്കുറിച്ചുള്ള അബ്രാമിന്റെ പരാതിയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; זֶרַע ഇവിടെ മക്കളെയോ വംശപരമ്പരയെയോ സൂചിപ്പിക്കുന്നു.
- source_word: בֶן בֵּיתִי
  choice: എന്റെ വീട്ടിൽപ്പെട്ട ഒരുവൻ
  rationale: അക്ഷരാർഥമായ ‘എന്റെ വീട്ടിലെ മകൻ’ എന്ന പ്രയോഗത്തിലെ ഗൃഹബന്ധം നിലനിർത്തിക്കൊണ്ട്, വ്യക്തിയുടെ അടിമസ്ഥിതിയോ ജനനസാഹചര്യമോ വാക്യം പറയുന്നതിലധികം നിർണ്ണയിക്കാതെ സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: יוֹרֵשׁ אֹתִי
  choice: എന്റെ അവകാശിയാകുന്നത്
  rationale: ‘എന്നെ അവകാശമായി പ്രാപിക്കുന്നു’ എന്ന എബ്രായ ഘടന മലയാളത്തിൽ തെറ്റിദ്ധാരണയുണ്ടാക്കാം; സന്ദർഭസൂചിതമായ അവകാശി എന്ന അർഥം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി നൽകുകയും അക്ഷരഘടന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അബ്രാമിന്റെ വീട്ടിൽപ്പെട്ട വ്യക്തിയുടെ സാമൂഹികപദവി
  choice: എന്റെ വീട്ടിൽപ്പെട്ട ഒരുവൻ
  alternative: എന്റെ വീട്ടിൽ ജനിച്ച അടിമ
  rationale: ഈ വാക്യം ‘അടിമ’ എന്ന പദം ഉപയോഗിക്കുന്നില്ല; അതിനാൽ ചുറ്റുപാടിൽനിന്ന് അനുമാനിക്കാവുന്ന കൂടുതൽ പ്രത്യേകമായ സാമൂഹികപദവി പരിഭാഷയിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: יוֹרֵשׁ אֹתִי എന്നതിലെ അസാധാരണമായ നേരിട്ടുള്ള കർമം
  choice: എന്റെ അവകാശിയാകുന്നത്
  alternative: എന്നെ അവകാശമായി പ്രാപിക്കുന്നത്
  rationale: എബ്രായത്തിലെ ‘എന്നെ’ എന്നത് അബ്രാമിന്റെ സ്വത്തോ കുടുംബസ്ഥാനമോ സൂചിപ്പിക്കുന്ന ലാക്ഷണിക പ്രയോഗമായിരിക്കാം. മുഖ്യവാചകം അർഥം വ്യക്തമായി നൽകുന്നു; മൂലഭാഷയുടെ അസാധാരണ ഘടന അടിക്കുറിപ്പിൽ തുറന്നുകാട്ടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ശ്രദ്ധാകർഷകമായ രണ്ടു എബ്രായനിപാതങ്ങളും ‘ഇതാ’ എന്നു നിലനിർത്തി; അസ്വാഭാവികമായ എബ്രായ അവകാശപ്രയോഗത്തിന്റെ അക്ഷരഘടന അടിക്കുറിപ്പിലേക്കു മാറ്റി.
