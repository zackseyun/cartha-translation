id: GEN.15.20
reference: Genesis 15:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הַ/חִתִּ֥י וְ/אֶת הַ/פְּרִזִּ֖י וְ/אֶת הָ/רְפָאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/020.yaml
  text: and the Hittites[a], and the Perizzites, and the Rephaim,
translation:
  language: ml
  text: ഹിത്യരും പെരിസ്യരും രെഫായീമ്യരും[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭീമന്മാർ.” എബ്രായത്തിലെ ‘രെഫായീം’ എന്ന പദം ചില സന്ദർഭങ്ങളിൽ വിവരണാത്മകമായി മനസ്സിലാക്കാമെങ്കിലും, ഇവിടെ അത് മിക്കവാറും ദേശത്തിലെ ഒരു ജനവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: -രും
  rationale: וְ എന്ന സംയോജകം മുമ്പത്തെ വാക്യത്തിൽ ആരംഭിച്ച ജനവിഭാഗങ്ങളുടെ പട്ടിക തുടരുന്നു; אֵת എന്ന കർമചിഹ്നത്തിന് മലയാളത്തിൽ വേറെ പദം ആവശ്യമില്ല. പട്ടികയിലെ ഓരോ പേരോടും ചേർത്ത ‘-രും’ സ്വാഭാവികമായി ‘കൂടാതെ/ഉം’ എന്ന അർഥം നൽകുന്നു.
- source_word: הַחִתִּי
  choice: ഹിത്യർ
  rationale: എബ്രായത്തിൽ ഏകവചനരൂപമാണെങ്കിലും നിർദേശകോപപദത്തോടുകൂടിയ ഈ ജനനാമം സമൂഹവാചകമാണ്; മലയാളത്തിൽ ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനരൂപം യോജിക്കുന്നു.
- source_word: הַפְּרִזִּי
  choice: പെരിസ്യർ
  rationale: എബ്രായത്തിലെ ഏകവചന ജനനാമം ഇവിടെ ഒരു ജനവിഭാഗത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാള ബഹുവചനരൂപം ഉപയോഗിച്ചു.
- source_word: הָרְפָאִים
  choice: രെഫായീമ്യർ
  rationale: ദേശത്തിലെ ജനവിഭാഗങ്ങളുടെ പട്ടികയായ ഈ സന്ദർഭത്തിൽ പദം ഒരു ജനനാമമായാണ് ഏറ്റവും സ്വാഭാവികം. ‘മല്ലന്മാർ’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ ജനനാമത്തിന്റെ സ്വഭാവം നിലനിർത്തി.
theological_decisions:
- issue: רְפָאִים എന്നത് ജനനാമമായോ വിവരണാത്മകമായി ‘മല്ലന്മാർ’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: ജനനാമമായി ‘രെഫായീമ്യർ’ എന്നു നൽകി
  alternative: മല്ലന്മാർ
  rationale: ഉല്പത്തി 15:19–21 വാഗ്ദത്തദേശത്തു വസിച്ചിരുന്ന ജനവിഭാഗങ്ങളുടെ പട്ടികയാണ്. അതിനാൽ ഇവിടെ ജനനാമം എന്ന വായനയാണ് സന്ദർഭത്തിന് ഏറ്റവും യോജിച്ചത്; പരമ്പരാഗതമായ ‘മല്ലന്മാർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ജനവിഭാഗങ്ങളുടെ പട്ടികയുടെ തുടർച്ച വ്യക്തമാക്കാൻ ഓരോ പേരിനോടും ‘-രും’ ചേർത്തു. വാക്യം അടുത്ത വാക്യഭാഗത്തോടു തുടരുമെന്നതിനാൽ അവസാനം കോമ നിലനിർത്തി. അടിക്കുറിപ്പിന്റെ സ്ഥാനം അത് വിശദീകരിക്കുന്ന ‘രെഫായീമ്യർ’ എന്ന പദത്തിനുശേഷം തന്നെയാക്കി.
