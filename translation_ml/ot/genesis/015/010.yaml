  yaml_path: translation/ot/genesis/015/010.yaml
  text: So he brought all these to him[a], cut them in two, and placed each half opposite the other[c][b]; but he did not cut the birds in two.
translation:
  language: ml
  text: അങ്ങനെ അബ്രാം അവയെല്ലാം ദൈവത്തിന്റെ അടുക്കൽ കൊണ്ടുവന്നു; അവയെ നടുവിൽവെച്ച് രണ്ടായി മുറിച്ച്, ഓരോ ഭാഗവും മറ്റേ ഭാഗത്തിന് എതിരേ വെച്ചു; എന്നാൽ പക്ഷികളെ അവൻ രണ്ടായി മുറിച്ചില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח לוֹ אֶת כָּל אֵלֶּה
  choice: അങ്ങനെ അബ്രാം അവയെല്ലാം അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ ആണെങ്കിലും, മുൻവാക്യത്തിലെ ‘എന്റെ അടുക്കൽ കൊണ്ടുവരുക’ എന്ന കല്പനയോടുള്ള പ്രതികരണമായി ഇവിടെ ‘കൊണ്ടുവന്നു’ എന്നത് സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. לוֹ ദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവന്റെ അടുക്കൽ’ എന്നു നിലനിർത്തി; കർത്താവായ അബ്രാമിന്റെ പേര് വ്യക്തതയ്ക്കായി ചേർത്തു.
- source_word: וַיְבַתֵּר אֹתָם בַּתָּוֶךְ
  choice: അവയെ നടുവിൽവെച്ച് രണ്ടായി മുറിച്ച്
  rationale: בתר മൃഗശരീരങ്ങളെ മുറിച്ചു വിഭജിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; בַּתָּוֶךְ ‘നടുവിൽ’ എന്ന ആശയം നൽകുന്നു. ‘രണ്ടായി മുറിച്ച്’ ഫലവും ‘നടുവിൽവെച്ച്’ മൂലവാചകത്തിന്റെ രൂപവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: וַיִּתֵּן אִישׁ בִּתְרוֹ לִקְרַאת רֵעֵהוּ
  choice: ഓരോ ഭാഗവും അതിന്റെ മറുഭാഗത്തിന് എതിരേ വെച്ചു
  rationale: אִישׁ ... רֵעֵהוּ ഇവിടെ ‘ഓരോന്നും അതിന്റെ കൂട്ടിനോട്/മറ്റേതിനോട്’ എന്ന വിതരണപ്രയോഗമാണ്. മുറിച്ച ഒരേ മൃഗത്തിന്റെ നേർക്കുനേർ വെച്ച ഭാഗങ്ങളാണെന്നത് ‘മറുഭാഗം’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְאֶת הַצִפֹּר לֹא בָתָר
  choice: എന്നാൽ പക്ഷികളെ അവൻ രണ്ടായി മുറിച്ചില്ല
  rationale: הַצִפֹּר ഏകവചനസമാഹാരപദമായി മുൻവാക്യത്തിലെ രണ്ടു പക്ഷികളെയും സൂചിപ്പിക്കുന്നു; അതിനാൽ മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികമാണ്. മുൻക്രിയയുമായുള്ള ബന്ധം വ്യക്തമാക്കാൻ ‘രണ്ടായി’ ആവർത്തിച്ചു.
theological_decisions:
- issue: ഉടമ്പടി സ്ഥാപിക്കുന്ന ചടങ്ങിന്റെ ഭാഷ
  choice: മൃഗങ്ങളെ രണ്ടായി മുറിച്ച് ഭാഗങ്ങൾ എതിരേ വെച്ചതായി മാത്രം മൂർത്തമായി വിവർത്തനം ചെയ്തു.
  alternative: വാക്യത്തിനുള്ളിൽ തന്നെ ഇത് ഉടമ്പടി ചടങ്ങാണെന്ന വ്യാഖ്യാനം ചേർക്കുക.
  rationale: എബ്രായവാചകം ചടങ്ങിന്റെ പ്രവർത്തനങ്ങൾ വിവരിക്കുന്നുവെങ്കിലും അവയുടെ ദൈവശാസ്ത്രപരമായ അർഥം ഇവിടെ തുറന്നുപറയുന്നില്ല. അതിനാൽ ദൃശ്യരൂപം സംരക്ഷിക്കുകയും വ്യാഖ്യാനാത്മക വികസനം ഒഴിവാക്കുകയും ചെയ്തു.
- issue: לוֹ എന്നതിന്റെ സൂചന
  choice: ‘അവന്റെ അടുക്കൽ’—ദൈവത്തിന്റെ അടുക്കൽ
  alternative: ‘തനിക്കായി’—അബ്രാം തനിക്കുവേണ്ടി എടുത്തു
  rationale: വ്യാകരണപരമായി ദാതൃപ്രയോഗത്തിന് ഒന്നിലധികം സാധ്യതകളുണ്ടെങ്കിലും, 15:9-ലെ ‘എന്റെ അടുക്കൽ കൊണ്ടുവരുക’ എന്ന ദൈവകല്പനയാണ് ഇവിടെ നിർണായക സന്ദർഭം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും ചേർന്ന മലയാളം. ചടങ്ങിന്റെ ദൃശ്യവിവരണം വ്യക്തമായി നിലനിർത്തി; അനാവശ്യമായ പുരാതന ശൈലിയും സഭാവിഭാഗ-വിശിഷ്ട പദപ്രയോഗങ്ങളും ഒഴിവാക്കി.
