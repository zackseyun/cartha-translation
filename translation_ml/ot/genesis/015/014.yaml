id: GEN.15.14
reference: Genesis 15:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/גַ֧ם אֶת הַ/גּ֛וֹי אֲשֶׁ֥ר יַעֲבֹ֖דוּ דָּ֣ן אָנֹ֑כִי וְ/אַחֲרֵי כֵ֥ן יֵצְא֖וּ בִּ/רְכֻ֥שׁ גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/014.yaml
  text: But I will also judge the nation that they serve[b][a], and afterward they will come out with great possessions.
translation:
  language: ml
  text: ഞാൻ അവർ സേവിക്കുന്ന ജനതയെയും ന്യായംവിധിക്കും; അതിനുശേഷം അവർ വളരെയേറെ സ്വത്തുവകകളുമായി പുറത്തുവരും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: എന്നാൽ ... യെയും
  rationale: וְ തുടർച്ചയും ഗַם ഉൾപ്പെടുത്തൽ/ഊന്നലും സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിലെ പീഡനത്തോടുള്ള ആശയവ്യത്യാസം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; ‘-യെയും’ ഗַם എന്നതിന്റെ ഉൾപ്പെടുത്തൽശക്തി നിലനിർത്തുന്നു.
- source_word: הַגּוֹי
  choice: ജനത
  rationale: גּוֹי ഇവിടെ അബ്രാമിന്റെ സന്തതിയെ സേവിപ്പിക്കുന്ന വിദേശ ദേശീയസമൂഹത്തെയോ അധികാരത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ജനത’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ പരിഭാഷയാണ്.
- source_word: אֲשֶׁר יַעֲבֹדוּ
  choice: അവർ സേവിക്കുന്ന
  rationale: עבד എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘സേവിക്കുക/വേലചെയ്യുക’ പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു. സന്ദർഭത്തിലെ നിർബന്ധിത അടിമവേലയുടെ സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: דָּן אָנֹכִי
  choice: ഞാൻ ന്യായംവിധിക്കും
  rationale: דָּן എന്ന ന്യായവ്യവഹാരപദവും אָנֹכִי നൽകുന്ന ഒന്നാംപുരുഷ ഊന്നലും, സന്ദർഭം ആവശ്യപ്പെടുന്ന ഭാവികാലബോധവും ഈ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: וְאַחֲרֵי כֵן
  choice: അതിനു ശേഷം
  rationale: സംഭവങ്ങളുടെ കാലക്രമം ലളിതവും സ്വാഭാവികവുമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: יֵצְאוּ
  choice: അവർ ... പുറത്തുവരും
  rationale: יצא എന്നതിന്റെ ‘പുറത്തുപോകുക/പുറത്തുവരുക’ എന്ന അർഥം, അടിമത്തത്തിൽനിന്നുള്ള പുറപ്പാടിന്റെ ദൃഷ്ടികോണത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בִּרְכֻשׁ גָּדוֹל
  choice: വളരെയേറെ സ്വത്തുവകകളുമായി
  rationale: רְכוּשׁ എന്നത് സ്വത്ത്, വസ്തുവകകൾ, സമ്പാദ്യം എന്നിവയെ സൂചിപ്പിക്കുന്നു. ‘സ്വത്തുവകകൾ’ അതിന്റെ മൂർത്തമായ അർഥം നിലനിർത്തുന്നു; גָּדוֹל ഇവിടെ അളവിന്റെ സമൃദ്ധിയായി ‘വളരെയേറെ’ എന്നു നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: പീഡിപ്പിക്കുന്ന ജനതയ്‌ക്കെതിരായ ദൈവിക നടപടിയുടെ സ്വഭാവം
  choice: ന്യായംവിധിക്കും
  alternative: ശിക്ഷിക്കും
  rationale: דָּן ന്യായവിധിയെ സൂചിപ്പിക്കുന്ന പദമാണ്. ‘ശിക്ഷിക്കും’ എന്നത് ഫലത്തെ മാത്രം മുൻനിർത്തി അർഥം ചുരുക്കാം; ‘ന്യായംവിധിക്കും’ പാഠത്തിലെ നിയമപരവും ധാർമികവുമായ ഭാവവും അതിലെ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സേവിക്കുന്ന’ എന്ന നേരിട്ടുള്ള പദം പ്രധാനപാഠത്തിൽ സൂക്ഷിച്ച് സന്ദർഭപരമായ അടിമവേല അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
