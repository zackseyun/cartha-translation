  yaml_path: translation/ot/genesis/049/023.yaml
  text: They bitterly attacked him[a], and shot at him, and hated him—the archers.
translation:
  language: ml
  text: വില്ലാളികൾ അവനെ കഠിനമായി ഉപദ്രവിച്ചു[a]; അവർ അവന്റെ നേരെ അമ്പെയ്തു, അവനോടു ശത്രുത പുലർത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘വില്ലാളികൾ അവനെ കയ്പേറിയവനാക്കി; അവനോടു പോരാടി, അവനോടു ശത്രുത പുലർത്തി.’ നടുവിലെ ഹീബ്രു ക്രിയയുടെ അർഥം ദുഷ്കരമാണ്; അതിനെ ‘അവനോടു പോരാടി’ എന്നോ പൊതുവായി ‘അവനെ ആക്രമിച്ചു’ എന്നോ മനസ്സിലാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרֲרֻהוּ
  choice: അവനെ കഠിനമായി ഉപദ്രവിച്ചു
  rationale: പീയേൽ രൂപത്തിലുള്ള מרר എന്ന ക്രിയയ്ക്ക് ‘കയ്പേറിയതാക്കുക’, ‘കഠിനമായി പെരുമാറുക’ എന്നീ തീവ്രമായ അർഥങ്ങളുണ്ട്. തുടർന്നുവരുന്ന ശത്രുതാപരമായ ക്രിയകളോടു ചേർന്ന്, ഒരാളുടെ ഉള്ളിലെ വികാരം മാത്രം സൂചിപ്പിക്കാതെ അവനോടുള്ള ക്രൂരമായ പെരുമാറ്റം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וָרֹבּוּ
  choice: അവർ അവനെ എയ്തു
  rationale: ഈ ഹീബ്രു രൂപത്തിന്റെ കൃത്യമായ അർഥം ദുഷ്കരമാണ്; ‘പോരാടി’, ‘ആക്രമിച്ചു’ എന്നീ വ്യാഖ്യാനങ്ങളും സാധ്യമാണ്. എന്നാൽ ‘അമ്പുകളുടെ ഉടമകൾ’ എന്ന തുടർന്നുള്ള പ്രയോഗം അമ്പെയ്യുന്ന ദൃശ്യത്തെ പിന്തുണയ്ക്കുന്നതിനാൽ ‘എയ്തു’ എന്നു മുഖ്യപാഠത്തിൽ നൽകി, അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַיִּשְׂטְמֻהוּ
  choice: അവനോടു ശത്രുത പുലർത്തി
  rationale: שטם ശത്രുത, വിദ്വേഷം, പക എന്നിവ സൂചിപ്പിക്കുന്നു. ‘ശത്രുത പുലർത്തി’ എന്നത് പ്രവർത്തനപരമായ വൈരഭാവം വ്യക്തമാക്കുകയും അതിനെ വെറും ആന്തരിക വികാരമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: בַּעֲלֵי חִצִּים
  choice: വില്ലാളികൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘അമ്പുകളുടെ ഉടമകൾ’ എന്നാണെങ്കിലും, ഇത് അമ്പെയ്യുന്നവരെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്. ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സമാനപദം ‘വില്ലാളികൾ’ ആണ്.
