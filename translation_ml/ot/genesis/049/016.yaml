translation:
  language: ml
  text: ദാൻ തന്റെ ജനത്തിനു ന്യായം നടത്തും, ഇസ്രായേലിന്റെ ഗോത്രങ്ങളിൽ ഒന്നെന്ന നിലയിൽ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദാൻ തന്റെ ജനത്തിനു നീതി നേടിക്കൊടുക്കും.” എബ്രായ ക്രിയയ്ക്ക് വിധി പ്രസ്താവിക്കുക എന്നതിനു പുറമേ, സംരക്ഷിച്ചുകൊണ്ട് ഒരാൾക്കു നീതി ലഭ്യമാക്കുക എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּן
  choice: ദാൻ
  rationale: യാക്കോബിന്റെ മകനെയും അവനിൽനിന്നുള്ള ഗോത്രത്തെയും സൂചിപ്പിക്കുന്ന പേരാണ്. പിന്നാലെയുള്ള יָדִין എന്ന ക്രിയയുമായി എബ്രായത്തിൽ ശബ്ദാലങ്കാരമുണ്ടെങ്കിലും മലയാളത്തിൽ പേര് പതിവുപോലെ ലിപ്യന്തരിച്ചു.
- source_word: יָדִין
  choice: ന്യായം നടത്തും
  rationale: דין എന്ന ധാതുവിന്റെ ഖാൽ അപൂർണ്ണരൂപം ഇവിടെ അനുഗ്രഹവചനത്തിലെ ഭാവിസൂചനയായി വരുന്നു. ‘ന്യായം നടത്തും’ എന്നത് വിധിക്കൽ, നീതി നിർവഹിക്കൽ, ഭരണാധികാരം പ്രയോഗിക്കൽ എന്നീ അർഥസാധ്യതകൾ നിലനിർത്തുന്നു.
- source_word: עַמּוֹ
  choice: തന്റെ ജനത്തിനു
  rationale: עם എന്ന നാമത്തോടു ചേർന്ന മൂന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം ‘അവന്റെ/തന്റെ ജനം’ എന്നാണ്. വാക്യത്തിലെ കർത്താവായ ദാനിലേക്കുള്ള തിരിച്ചുസൂചന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘തന്റെ’ ഉപയോഗിച്ചു; ദാനോടു ബന്ധപ്പെട്ട ജനസമൂഹമാണ് സന്ദർഭത്തിലെ സാധ്യത.
- source_word: כְּאַחַד
  choice: ഒന്നെന്ന നിലയിൽ
  rationale: താരതമ്യസൂചകമായ כְּയും אֶחָד എന്ന പദവും ചേർന്ന് ‘ഒന്നായി/ഒന്നെന്ന നിലയിൽ’ എന്ന ആശയം നൽകുന്നു. ഇസ്രായേലിലെ മറ്റു ഗോത്രങ്ങളോടു തുല്യമായ ഗോത്രസ്ഥാനമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: שִׁבְטֵי
  choice: ഗോത്രങ്ങളിൽ
  rationale: שֵׁבֶט എന്ന പദത്തിന്റെ ബഹുവചന ഘടനാരൂപം. ‘ഇസ്രായേൽ’ എന്ന തുടർപദവും സന്ദർഭവും കണക്കിലെടുത്ത് ‘ചെങ്കോലുകൾ’ എന്നല്ല, ‘ഗോത്രങ്ങൾ’ എന്നാണ് അർഥം.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: ജനത്തെയും രാഷ്ട്രത്തെയും സൂചിപ്പിക്കുന്ന സംജ്ഞാനാമം ആധുനിക മലയാള ബൈബിൾപ്രയോഗമനുസരിച്ച് ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: അനുഗ്രഹവചനത്തിൽ ദാന്റെ പങ്ക്
  choice: ഇസ്രായേലിന്റെ ഗോത്രങ്ങളിൽ ഒന്നെന്ന പൂർണസ്ഥാനത്തോടെ ദാൻ തന്റെ ജനത്തിനു ന്യായം നടത്തുന്നു.
  alternative: ദാൻ തന്റെ ജനത്തിന്റെ നീതി സ്ഥാപിക്കും അഥവാ അവരെ ന്യായീകരിച്ചു സംരക്ഷിക്കും.
  rationale: דין എന്ന ക്രിയയ്ക്ക് വിധിക്കുക, ഭരിക്കുക, നീതി നേടിക്കൊടുക്കുക എന്നീ അർഥച്ചായകളുണ്ട്. ‘ഇസ്രായേലിന്റെ ഗോത്രങ്ങളിൽ ഒന്നെന്ന നിലയിൽ’ എന്ന താരതമ്യം ഗോത്രപരമായ അധികാരവും സ്ഥാനവും മുൻനിർത്തുന്നതിനാൽ മുഖ്യവാചകത്തിൽ ‘ന്യായം നടത്തും’ സ്വീകരിച്ചു; നീതി സ്ഥാപിക്കൽ/ന്യായീകരിക്കൽ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ന്യായം നടത്തും’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും എബ്രായത്തിലെ നിയമ-ഭരണ അർഥവ്യാപ്തി നിലനിർത്തുന്നതുമാണ്. ‘ഒന്നെന്ന നിലയിൽ’ എന്ന പ്രയോഗം താരതമ്യത്തെ അംഗത്വത്തിന്റെ സമത്വമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
