  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זְבוּלֻ֕ן לְ/ח֥וֹף יַמִּ֖ים יִשְׁכֹּ֑ן וְ/הוּא֙ לְ/ח֣וֹף אֳנִיּ֔וֹת וְ/יַרְכָת֖/וֹ עַל צִידֹֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/013.yaml
  text: Zebulun will dwell by the shore of the seas[a]; he will be by the shore of ships[c][b], and his flank will be toward Sidon.
translation:
  language: ml
  text: സെബൂലൂൻ കടലുകളുടെ തീരത്ത്[a] വസിക്കും; അവൻ കപ്പലുകൾക്കായുള്ള തീരത്ത്[b] ആയിരിക്കും; അവന്റെ പാർശ്വം[c] സീദോന്റെ ദിശയിലായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ഇവിടെ “കടലുകൾ” എന്നത് ബഹുവചനമാണ്; സന്ദർഭത്തിൽ അതിനെ “കടൽ” എന്നും പറയാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “കപ്പലുകളുടെ തീരത്ത്.” ഇത് “കപ്പലുകൾക്കായുള്ള ഒരു തുറമുഖത്ത്” എന്നും വ്യാഖ്യാനിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: “അവന്റെ പാർശ്വം” എന്നതിന് “അവന്റെ അതിർത്തി,” “അവന്റെ വശം,” അല്ലെങ്കിൽ “അവന്റെ അങ്ങേയറ്റം” എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപദത്തിന് ഭൂമിശാസ്ത്രപരമായി പാർശ്വം, അതിർത്തി, അങ്ങേയറ്റം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבוּלֻן
  choice: സെബൂലൂൻ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിക്കനുസരിച്ച് നൽകി.
- source_word: לְחוֹף יַמִּים
  choice: കടലുകളുടെ തീരത്ത്
  rationale: חֹוף എന്നതിന്റെ തീരം എന്ന സ്ഥലസൂചനയും യַמִּים എന്ന എബ്രായ ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: יִשְׁכֹּן
  choice: വസിക്കും
  rationale: שכן എന്ന ധാതുവിന്റെ താമസിക്കുക/പാർക്കുക എന്ന അർഥം കാവ്യസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവികവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: לְחוֹף אֳנִיּוֹת
  choice: കപ്പലുകളുടെ തീരത്ത്
  rationale: അക്ഷരാർഥത്തിലുള്ള ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു; തുറമുഖം എന്ന വ്യാഖ്യാനപരമായ ആശയം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: וְיַרְכָתוֹ
  choice: അവന്റെ പാർശ്വം
  rationale: יַרְכָה എന്ന പദത്തിന്റെ പാർശ്വം, അതിർത്തി, അറ്റം എന്നീ സാധ്യതകളിൽ കോൺക്രീറ്റ് രൂപകം നിലനിർത്തുന്ന പൊതുവായ പദം തിരഞ്ഞെടുത്തു.
- source_word: עַל צִידֹן
  choice: സീദോനിലേക്കായിരിക്കും
  rationale: ഭൂമിശാസ്ത്രപരമായ ദിശയെയോ വ്യാപനത്തെയോ സൂചിപ്പിക്കുന്നതായി עַל സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു; അതിർത്തി സീദോൻവരെ എത്തുന്നു എന്ന് അതിയായി നിർണയിച്ചില്ല.
