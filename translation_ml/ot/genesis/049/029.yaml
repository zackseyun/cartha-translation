  text: וַ/יְצַ֣ו אוֹתָ֗/ם וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אֲנִי֙ נֶאֱסָ֣ף אֶל עַמִּ֔/י קִבְר֥וּ אֹתִ֖/י אֶל אֲבֹתָ֑/י אֶל הַ֨/מְּעָרָ֔ה אֲשֶׁ֥ר בִּ/שְׂדֵ֖ה עֶפְר֥וֹן הַֽ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/029.yaml
  text: Then he commanded them and said to them[a], “I am about to be gathered to my people. Bury me with my fathers in the cave that is in the field of Ephron the Hittite,”
translation:
  language: ml
  text: 'പിന്നെ അവൻ അവരോടു കൽപിച്ചു പറഞ്ഞു: “ഞാൻ എന്റെ ജനത്തോടു ചേർക്കപ്പെടാൻ പോകുന്നു.[a] ഹിത്യനായ എഫ്രോന്റെ വയലിലുള്ള ഗുഹയിൽ എന്റെ പിതാക്കന്മാരോടൊപ്പം എന്നെ അടക്കം ചെയ്യുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ എന്റെ ജനത്തോടു ചേർക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നു.” ഈ എബ്രായ പ്രയോഗം ആസന്നമായ മരണത്തെയും മരണത്തിൽ സ്വന്തം ജനത്തോടോ പൂർവികരോടോ ചേരുന്നതിനെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ ആജ്ഞാപരവും ഗൗരവമുള്ളതുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: അവരോടു ... പറഞ്ഞു
  rationale: സാധാരണ എബ്രായ സംഭാഷണസൂത്രം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נֶאֱסָף אֶל־עַמִּי
  choice: ഞാൻ എന്റെ ജനത്തോടു ചേർക്കപ്പെടാൻ പോകുന്നു
  rationale: ആസന്നമായ മരണത്തെ സൂചിപ്പിക്കുന്നതോടൊപ്പം സ്വന്തം ജനത്തോടുള്ള മരണാനന്തര ചേരലിന്റെ രൂപകവും സംരക്ഷിക്കുന്നു; അതിനെ വെറും ‘ഞാൻ മരിക്കാൻ പോകുന്നു’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: עַמִּי
  choice: എന്റെ ജനം
  rationale: എബ്രായത്തിലെ ‘എന്റെ ജനം’ എന്ന പ്രയോഗത്തിന്റെ കുടുംബപരവും ദൈവശാസ്ത്രപരവുമായ അനുരണനം നിലനിർത്തുന്നു.
- source_word: קִבְרוּ אֹתִי
  choice: എന്നെ അടക്കം ചെയ്യുവിൻ
  rationale: ബഹുവചന ആജ്ഞയുടെ ഗൗരവവും ആധുനിക മാനക മലയാളത്തിലെ മാന്യമായ ശൈലിയും പ്രകടമാക്കുന്നു.
- source_word: אֶל־אֲבֹתָי
  choice: എന്റെ പിതാക്കന്മാരോടൊപ്പം
  rationale: ശവസംസ്കാരസന്ദർഭത്തിൽ പൂർവികരോടൊപ്പമുള്ള അടക്കം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַמְּעָרָה
  choice: ഗുഹ
  rationale: മൂലപദം ‘ഗുഹ’ എന്നാണ്; ‘ശവകുടീരഗുഹ’ പോലുള്ള വിശദീകരണം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: אֲשֶׁר בִּשְׂדֵה עֶפְרוֹן
  choice: എഫ്രോന്റെ വയലിലുള്ള
  rationale: ബന്ധവാക്യത്തിന്റെ അർഥം ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַחִתִּי
  choice: ഹിത്യനായ
  rationale: എഫ്രോന്റെ ജനവിഭാഗപരമായ തിരിച്ചറിയൽ പതിവായ മലയാളരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘എന്റെ ജനത്തോടു ചേർക്കപ്പെടുക’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മരണത്തെ മാത്രം തുറന്നുപറയാതെ മൂലത്തിലെ രൂപകം നിലനിർത്തുക
  alternative: ‘ഞാൻ മരിക്കാൻ പോകുന്നു’
  rationale: ഈ പ്രയോഗം ആസന്നമായ മരണത്തെയും മരണത്തിൽ പൂർവികരോടോ സ്വന്തം ജനത്തോടോ ചേരുന്നതിനെയും സൂചിപ്പിക്കുന്നു; എന്നാൽ പരലോകത്തെക്കുറിച്ചുള്ള വിശദമായ ഒരു സിദ്ധാന്തം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വേദപാരായണ ശൈലി. ‘ചേർക്കപ്പെടുക’ എന്ന കർമണിപ്രയോഗം മൂലത്തിലെ നിഫാൽ രൂപവും ഉദ്ദേശപൂർവമായ ദൈവശാസ്ത്രപരമായ അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
