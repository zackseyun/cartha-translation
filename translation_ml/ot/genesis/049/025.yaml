source:
  edition: WLC
  text: מֵ/אֵ֨ל אָבִ֜י/ךָ וְ/יַעְזְרֶ֗/ךָּ וְ/אֵ֤ת שַׁדַּי֙ וִ/יבָ֣רְכֶ֔/ךָּ בִּרְכֹ֤ת שָׁמַ֨יִם֙ מֵ/עָ֔ל בִּרְכֹ֥ת תְּה֖וֹם רֹבֶ֣צֶת תָּ֑חַת בִּרְכֹ֥ת שָׁדַ֖יִם וָ/רָֽחַם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/025.yaml
  text: by the God of your father[a], who will help you, and by the Almighty, who will bless you with blessings of heaven above, blessings of the deep lying beneath[b], blessings of breasts and womb.
translation:
  language: ml
  text: 'നിന്റെ പിതാവിന്റെ ദൈവത്താൽ[a]—അവൻ നിന്നെ സഹായിക്കും;


    സർവശക്തനാലും—അവൻ നിന്നെ അനുഗ്രഹിക്കും:


    മീതെയുള്ള ആകാശത്തിന്റെ അനുഗ്രഹങ്ങളാലും,


    താഴെ കിടക്കുന്ന ആഴിയുടെ അനുഗ്രഹങ്ങളാലും[b],


    സ്തനങ്ങളുടെയും ഗർഭപാത്രത്തിന്റെയും അനുഗ്രഹങ്ങളാലും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ പിതാവിന്റെ ദൈവത്തിൽനിന്ന് … സർവശക്തനോടുകൂടെ.” ‘ദൈവം’ എന്നതിനുമുമ്പുള്ള എബ്രായ ഉപസർഗവും ‘സർവശക്തൻ’ എന്നതിനുമുമ്പുള്ള കണികയും വാക്യഘടനയിൽ ചുരുക്കപ്പെട്ടിരിക്കുന്നു; അവയെ ഉറവിടം, പ്രവർത്തകത്വം, അല്ലെങ്കിൽ അടുത്ത സമാനാധികരണം എന്നിങ്ങനെ മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “താഴെ പതുങ്ങിക്കിടക്കുന്ന ആഴി.” എബ്രായ ക്രിയയ്ക്ക് ‘കിടക്കുക’ എന്നും ‘പതുങ്ങിക്കിടക്കുക’ എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵל אָבִיךָ
  choice: നിന്റെ പിതാവിന്റെ ദൈവത്താൽ
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ ഇവിടെ ചുരുക്കപ്പെട്ടിരിക്കുന്ന വാക്യഘടനയിൽ ഉറവിടമോ പ്രവർത്തകത്വമോ സൂചിപ്പിക്കാം. തുടർന്നുള്ള സഹായക്രിയയോടും സമാന്തരമായ സർവശക്തൻ എന്ന പദത്തോടും സ്വാഭാവികമായി ചേരുന്നതിനാൽ ‘ദൈവത്താൽ’ എന്നു നൽകി; ‘ദൈവത്തിൽനിന്ന്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: יַעְזְרֶךָ
  choice: അവൻ നിന്നെ സഹായിക്കും
  rationale: മൂന്നാം പുരുഷ ഏകവചന കർത്താവിനെയും രണ്ടാം പുരുഷ ഏകവചന കർമത്തെയും വ്യക്തമായി നിലനിർത്തുന്നു; അനുഗ്രഹപ്രഖ്യാപനത്തിന്റെ ഭാവിസ്വരവും സംരക്ഷിക്കുന്നു.
- source_word: וְאֵת שַׁדַּי
  choice: സർവശക്തനാൽ
  rationale: אֵת ഇവിടെ അസാധാരണവും ചുരുക്കപ്പെട്ടതുമായ സമന്വയമോ സമാനാധികരണമോ സൂചിപ്പിക്കുന്നു. മുൻവരിയിലെ ‘ദൈവത്താൽ’ എന്നതിനോടുള്ള സമാന്തരത നിലനിർത്താൻ ‘സർവശക്തനാൽ’ എന്നു നൽകി.
- source_word: שַׁדַּי
  choice: സർവശക്തൻ
  rationale: ദൈവിക സ്ഥാനപ്പേര് ലിപ്യന്തരണം ചെയ്യാതെ അർത്ഥപരമായി വിവർത്തനം ചെയ്തു; മലയാളത്തിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ തുല്യപദമാണിത്.
- source_word: בִּרְכֹת שָׁמַיִם מֵעָל
  choice: മീതെയുള്ള ആകാശത്തിന്റെ അനുഗ്രഹങ്ങൾ
  rationale: മുകളിൽ/താഴെ എന്ന ലംബമായ കാവ്യസമാന്തര്യം സംരക്ഷിക്കുന്നു; construct phrase-ന്റെ ബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: תְּהוֹם רֹבֶצֶת תָּחַת
  choice: താഴെ കിടക്കുന്ന ആഴി
  rationale: תְּהוֹם ഭൂമിക്കടിയിലെ ജലഗഹനതയെ സൂചിപ്പിക്കുന്നു. רֹבֶצֶת എന്നത് ‘കിടക്കുക’ എന്നും ‘പതുങ്ങിക്കിടക്കുക’ എന്നും വരാം; പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായ ‘കിടക്കുന്ന’ ഉപയോഗിച്ച് മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: שָׁדַיִם וָרָחַם
  choice: സ്തനങ്ങളും ഗർഭപാത്രവും
  rationale: പോഷണവും പ്രജനനഫലഭൂയിഷ്ഠതയും സൂചിപ്പിക്കുന്ന ശരീരാവയവങ്ങളെ മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള ഭാഷയിൽ നിലനിർത്തുന്നു; שָׁדַיִם എന്ന ബഹുവചനം സംരക്ഷിച്ചു.
theological_decisions:
- issue: שַׁדַּי എന്ന ദൈവിക സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: സർവശക്തൻ
  alternative: ഷദ്ദായി
  rationale: സ്ഥാനപ്പേരിന്റെ അർത്ഥം വായനക്കാരനിലേക്കെത്തിക്കാൻ വിവർത്തനം ചെയ്തു; സന്ദർഭത്തിൽ ഇല്ലാത്ത അധിക സിദ്ധാന്തവ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- issue: מֵאֵל ... וְאֵת שַׁדַּי എന്ന ചുരുക്കപ്പെട്ട വാക്യഘടന
  choice: ദൈവത്താൽ ... സർവശക്തനാൽ
  alternative: ദൈവത്തിൽനിന്ന് ... സർവശക്തനോടുകൂടെ
  rationale: ഉറവിടം, പ്രവർത്തകത്വം, സമാനാധികരണം എന്നിവയ്ക്കിടയിലെ യഥാർഥ അനിശ്ചിതത്വം പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായ പ്രവർത്തകത്വമായി നൽകി; മറ്റു സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള കാവ്യരീതിയാണ് സ്വീകരിച്ചത്. ആശയക്കുഴപ്പമുണ്ടാക്കാവുന്ന ദീർഘവാക്യം വരികളായും വിരാമചിഹ്നങ്ങളാലും ക്രമപ്പെടുത്തി. ശരീരാവയവങ്ങളെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള ഭാഷ മൃദൂകരിക്കാതെ നിലനിർത്തി; യഥാർഥ വാക്യഘടനാ-പദാർഥ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
