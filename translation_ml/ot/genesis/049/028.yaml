id: GEN.49.28
reference: Genesis 49:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל אֵ֛לֶּה שִׁבְטֵ֥י יִשְׂרָאֵ֖ל שְׁנֵ֣ים עָשָׂ֑ר וְ֠/זֹאת אֲשֶׁר דִּבֶּ֨ר לָ/הֶ֤ם אֲבִי/הֶם֙ וַ/יְבָ֣רֶךְ אוֹתָ֔/ם אִ֛ישׁ אֲשֶׁ֥ר כְּ/בִרְכָת֖/וֹ בֵּרַ֥ךְ אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/028.yaml
  text: 'All these are the twelve tribes of Israel[a], and this is what their father spoke to them when he blessed them: he blessed each one with the blessing appropriate to him.'
translation:
  language: ml
  text: 'ഇവയെല്ലാം ഇസ്രായേലിന്റെ പന്ത്രണ്ട് ഗോത്രങ്ങളാണ്. അവരുടെ പിതാവ് അവരോടു പറഞ്ഞതും അവരെ അനുഗ്രഹിച്ചതും ഇതാണ്: അവൻ ഓരോരുത്തനെയും ഓരോരുത്തന്റെ അനുഗ്രഹത്തിനൊത്തവിധം അനുഗ്രഹിച്ചു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: ഇവയെല്ലാം
  rationale: സംഗ്രഹവാക്യം ആരംഭിക്കുന്ന സർവസൂചകപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: שִׁבְטֵי יִשְׂרָאֵל שְׁנֵים עָשָׂר
  choice: ഇസ്രായേലിന്റെ പന്ത്രണ്ട് ഗോത്രങ്ങൾ
  rationale: ഹീബ്രു സംയുക്തബന്ധവും സംഖ്യയും വ്യക്തവും പതിവുമായ മലയാളക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְזֹאת אֲשֶׁר דִּבֶּר לָהֶם אֲבִיהֶם
  choice: അവരുടെ അപ്പൻ അവരോടു പറഞ്ഞത് ഇതാണ്
  rationale: דִּבֶּר എന്നതിന്റെ സാധാരണ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുകയും മുൻവചനങ്ങളിലെ പ്രസംഗത്തെ സംഗ്രഹിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: അവൻ അവരെ അനുഗ്രഹിച്ചു
  rationale: ഹീബ്രുവിലെ അനുക്രമക്രിയയെ വ്യാഖ്യാനാത്മകമായ കാലബന്ധമാക്കി മാറ്റാതെ സ്വതന്ത്ര സമാപികക്രിയയായി നിലനിർത്തുന്നു.
- source_word: אִישׁ
  choice: ഓരോരുത്തനെയും
  rationale: ഇവിടെ പദം വിതരണാർഥത്തിലാണ്; ഓരോ മകനെയും പ്രത്യേകം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: כְּבִרְכָתוֹ
  choice: അവനവന്റെ അനുഗ്രഹത്തിനൊത്തവിധം
  rationale: כְּ എന്നതിന്റെ ‘അനുസരിച്ച്/ഒത്തവിധം’ എന്ന അർഥവും ഏകവചന ഉടമസ്ഥപ്രത്യയത്തിന്റെ വിതരണബലവും സംരക്ഷിക്കുന്നു.
- source_word: בֵּרַךְ אֹתָם
  choice: അനുഗ്രഹിച്ചു
  rationale: ברך എന്ന മൂലപദത്തിന്റെ ആവർത്തനം മലയാളത്തിലും ആവർത്തിച്ച് ഹീബ്രുവിലെ ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഓരോരുത്തന്റെ ‘അനുഗ്രഹം’ എന്നതിന്റെ സ്വഭാവം
  choice: അവനവന്റെ അനുഗ്രഹത്തിനൊത്തവിധം
  alternative: ഓരോരുത്തനും യോജിച്ച അനുഗ്രഹം നൽകി
  rationale: ‘യോജിച്ച’ എന്നു മാത്രം പറഞ്ഞാൽ അനുഗ്രഹം അനുയോജ്യമോ അനുകൂലമോ ആയിരുന്നുവെന്ന വ്യാഖ്യാനം ശക്തമാകും. മൂലപാഠത്തിലെ כְּבִרְכָתוֹ എന്ന തുറന്ന പ്രയോഗം അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അപ്പൻ’ എന്നത് കുടുംബസന്ദർഭത്തിൽ സ്വാഭാവികവും മൂലപാഠത്തിലെ אָבִיהֶם എന്ന ബന്ധസൂചനയ്ക്ക് നേരിട്ടതുമാണ്. അവസാന ഭാഗത്തിലെ ഹീബ്രു ആവർത്തനം അർഥവ്യക്തത നഷ്ടപ്പെടാതെ സംരക്ഷിച്ചു.
