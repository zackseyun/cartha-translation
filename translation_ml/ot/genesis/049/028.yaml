revisions:
- from: ഇവയെല്ലാം ഇസ്രായേലിന്റെ പന്ത്രണ്ട് ഗോത്രങ്ങളാണ്. അവരുടെ അപ്പൻ അവരോടു പറഞ്ഞത് ഇതാണ്; അവൻ അവരെ അനുഗ്രഹിച്ചു—ഓരോരുത്തനെയും അവനവന്റെ അനുഗ്രഹത്തിനൊത്തവിധം അനുഗ്രഹിച്ചു.
  to: 'ഇവയെല്ലാം ഇസ്രായേലിന്റെ പന്ത്രണ്ട് ഗോത്രങ്ങളാണ്. അവരുടെ പിതാവ് അവരോടു പറഞ്ഞതും അവരെ അനുഗ്രഹിച്ചതും ഇതാണ്: അവൻ ഓരോരുത്തനെയും ഓരോരുത്തന്റെ അനുഗ്രഹത്തിനൊത്തവിധം അനുഗ്രഹിച്ചു.'
