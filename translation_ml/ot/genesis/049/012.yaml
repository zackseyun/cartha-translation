translation:
  language: ml
  text: വീഞ്ഞിനാൽ അവന്റെ കണ്ണുകൾ ചുവന്നിരിക്കുന്നു; പാലിനാൽ അവന്റെ പല്ലുകൾ വെളുത്തിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവന്റെ കണ്ണുകൾ വീഞ്ഞിനെക്കാൾ ഇരുണ്ടവ; അവന്റെ പല്ലുകൾ പാലിനെക്കാൾ വെളുത്തവ.’ അപൂർവമായ חַכְלִילִי എന്ന പദത്തിന്റെ അർഥവും מִן എന്ന ഉപസർഗത്തിന്റെ പ്രയോഗവും കാരണം/ഉറവിട അർഥത്തിനും താരതമ്യാർഥത്തിനും ഇടം നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַכְלִילִי
  choice: ചുവന്നിരിക്കുന്നു
  rationale: അപൂർവമായ ഈ എബ്രായ വിശേഷണം കണ്ണുകളുടെ ചുവപ്പോ ചുവപ്പാർന്ന ഭാവമോ സൂചിപ്പിക്കുന്നു. സദൃശവാക്യങ്ങൾ 23:29-ലെ ബന്ധപ്പെട്ട പ്രയോഗവും വീഞ്ഞിന്റെ സമൃദ്ധിയെക്കുറിച്ചുള്ള തൊട്ടുമുമ്പത്തെ സന്ദർഭവും കണക്കിലെടുത്ത് ‘ചുവന്നിരിക്കുന്നു’ എന്നു നൽകി.
- source_word: עֵינַיִם
  choice: കണ്ണുകൾ
  rationale: രണ്ടു കണ്ണുകളെ സൂചിപ്പിക്കുന്ന ദ്വിവചന നാമത്തിന്റെ സ്വാഭാവിക മലയാള പരിഭാഷ.
- source_word: מִיָּיִן
  choice: വീഞ്ഞിനാൽ
  rationale: מִן എന്ന ഉപസർഗം താരതമ്യത്തെയും കാരണത്തെയും ഉറവിടത്തെയും സൂചിപ്പിക്കാം. ഇവിടെ വീഞ്ഞിന്റെ സമൃദ്ധി ചിത്രീകരിക്കുന്ന സന്ദർഭവും സമാന്തര ഘടനയും കാരണം/ഉറവിട അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
- source_word: וּלְבֶן
  choice: വെളുത്തിരിക്കുന്നു
  rationale: ‘വെളുത്ത’ എന്ന വിശേഷണത്തെ സമാന്തരമായ മലയാള വാക്യത്തിൽ സ്വാഭാവികമായി പ്രസ്താവിക്കാൻ ‘വെളുത്തിരിക്കുന്നു’ എന്നു നൽകി.
- source_word: שִׁנַּיִם
  choice: പല്ലുകൾ
  rationale: പല്ലുകളെ സൂചിപ്പിക്കുന്ന ദ്വിവചന നാമത്തിന്റെ നേരായ മലയാള പരിഭാഷ.
- source_word: מֵחָלָב
  choice: പാലിനാൽ
  rationale: ആദ്യ പാദത്തോടുള്ള സമാന്തരത പാലിച്ച് מִן എന്നത് ഇവിടെ കാരണം/ഉറവിട അർഥത്തിൽ പരിഭാഷപ്പെടുത്തി.
