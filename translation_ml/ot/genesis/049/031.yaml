source:
  edition: WLC
  text: שָׁ֣מָּ/ה קָֽבְר֞וּ אֶת אַבְרָהָ֗ם וְ/אֵת֙ שָׂרָ֣ה אִשְׁתּ֔/וֹ שָׁ֚מָּ/ה קָבְר֣וּ אֶת יִצְחָ֔ק וְ/אֵ֖ת רִבְקָ֣ה אִשְׁתּ֑/וֹ וְ/שָׁ֥מָּ/ה קָבַ֖רְתִּי אֶת לֵאָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/031.yaml
  text: There they buried Abraham and Sarah his wife; there they buried Isaac and Rebekah his wife; and there I buried Leah.
translation:
  language: ml
  text: അവിടെ അവർ അബ്രാഹാമിനെയും അവന്റെ ഭാര്യയായ സാറായെയും അടക്കം ചെയ്തു; അവിടെ അവർ യിസ്ഹാക്കിനെയും അവന്റെ ഭാര്യയായ റിബെക്കയെയും അടക്കം ചെയ്തു; അവിടെ ഞാൻ ലേയയെ അടക്കം ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמָּה
  choice: അവിടെയാണ്
  rationale: മുമ്പ് പറഞ്ഞ ശവകുടീരസ്ഥലത്തേക്കാണ് ഈ സ്ഥലസൂചക ക്രിയാവിശേഷണം വിരൽചൂണ്ടുന്നത്. ആവർത്തനവും ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്താൻ ‘അവിടെയാണ്’ ഉപയോഗിച്ചു.
- source_word: קָבְרוּ
  choice: അടക്കിയത്
  rationale: Qal perfect 3cp-യിലെ വ്യക്തമാക്കാത്ത ബഹുവചന കർത്താവിനെ മലയാളത്തിൽ സ്വാഭാവികമായ പൊതുകർത്തൃപ്രയോഗത്തിലൂടെ അവതരിപ്പിക്കുന്നു; ‘അടക്കുക’ ശവസംസ്കാരസന്ദർഭത്തിൽ വ്യക്തവും മാന്യവുമാണ്.
- source_word: אֶת
  choice: '[നേരിട്ടുള്ള കർമസൂചകം; പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: എബ്രായത്തിൽ നിർദിഷ്ട നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകമാണിത്; മലയാളത്തിൽ ഇതിന് വേറൊരു പദം ആവശ്യമില്ല.
- source_word: אִשְׁתּוֹ
  choice: അവന്റെ ഭാര്യ
  rationale: 3ms പ്രത്യയത്തോടുകൂടിയ construct നാമത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു. സാറയുടെയും റിബെക്കയുടെയും കാര്യത്തിൽ ആവർത്തിച്ച് മൂലഘടന സംരക്ഷിച്ചു.
- source_word: וְ
  choice: -യും / ;
  rationale: ജോഡികളിലെ ഘടകങ്ങളെ ‘-യും’ ചേർത്ത് ബന്ധിപ്പിക്കുകയും പ്രധാന ഉപവാക്യങ്ങളെ അർദ്ധവിരാമംകൊണ്ട് ക്രമീകരിക്കുകയും ചെയ്തു; ഇതിലൂടെ പട്ടികാസ്വഭാവവും മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കും നിലനിൽക്കുന്നു.
- source_word: קָבַרְתִּי
  choice: ഞാൻ ... അടക്കിയത്
  rationale: Qal perfect 1cs യാക്കോബിന്റെ സ്വന്തം കഴിഞ്ഞകാല പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു. മലയാളത്തിലെ ഭൂതകാലബന്ധിത രൂപം സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: לֵאָה
  choice: ലേയ
  rationale: ആധുനിക മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിച്ചു.
- source_word: קָבְרוּ ... קָבְרוּ ... קָבַרְתִּי
  choice: അടക്കിയത് ... അടക്കിയത് ... അടക്കിയത്
  rationale: മൂലത്തിലെ קבר എന്ന ക്രിയയുടെ മൂന്നുതവണത്തെ ആവർത്തനം ഒരേ മലയാള ക്രിയയിലൂടെ സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ മൂന്ന് സമാന്തര ഉപവാക്യങ്ങളും ‘അവിടെയാണ്’ എന്ന ആവർത്തനവും നിലനിർത്തിയിട്ടുണ്ട്. വ്യക്തമല്ലാത്ത ‘അവർ’ എന്ന കർത്താവിനെ അനാവശ്യമായി നിർവചിക്കാതെ മലയാളത്തിലെ പൊതുകർത്തൃഘടന ഉപയോഗിച്ചു.
