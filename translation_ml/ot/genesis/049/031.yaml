review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the threefold location reference, the paired burials, Jacob's first-person action in the final clause, and the repeated burial verb. However, the impersonal form «അടക്കിയത്» leaves the first two clauses without the Hebrew's active, unspecified plural subject («they buried»).
  naturalness: «അവിടെ അവർ ... അടക്കം ചെയ്തു» is natural, clear modern standard Malayalam and retains the source's active construction. The final «അവിടെ ഞാൻ ലേയയെ അടക്കം ചെയ്തു» is correspondingly direct and idiomatic. «ഭാര്യയായ» makes the apposition to Sarah and Rebekah unambiguous.
  terminology: «അടക്കം ചെയ്തു» is an appropriate respectful rendering of קבר and is used consistently. The familiar Malayalam biblical name forms അബ്രാഹാം, സാറാ, യിസ്ഹാക്ക്, റിബെക്ക, and ലേയ are retained.
  issues:
  - severity: medium
    issue: The active plural verb in the first two clauses is not represented clearly.
    rationale: קָבְרוּ is Qal perfect 3cp, “they buried.” The draft's «അടക്കിയത്» is an impersonal/resultative construction and does not explicitly retain the unspecified human plural agent.
  - severity: low
    issue: The repeated emphatic copular construction «അവിടെയാണ് ... അടക്കിയത്» is less direct than the Hebrew clause structure.
    rationale: The Hebrew repeats the locative adverb followed by an active verb. «അവിടെ അവർ ... അടക്കം ചെയ്തു» preserves both the location and verbal form naturally without adding a copular emphasis.
  revised_text: അവിടെ അവർ അബ്രാഹാമിനെയും അവന്റെ ഭാര്യയായ സാറായെയും അടക്കം ചെയ്തു; അവിടെ അവർ യിസ്ഹാക്കിനെയും അവന്റെ ഭാര്യയായ റിബെക്കയെയും അടക്കം ചെയ്തു; അവിടെ ഞാൻ ലേയയെ അടക്കം ചെയ്തു.
