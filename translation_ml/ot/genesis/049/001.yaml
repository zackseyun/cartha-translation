id: GEN.49.1
reference: Genesis 49:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֥א יַעֲקֹ֖ב אֶל בָּנָ֑י/ו וַ/יֹּ֗אמֶר הֵאָֽסְפוּ֙ וְ/אַגִּ֣ידָה לָ/כֶ֔ם אֵ֛ת אֲשֶׁר יִקְרָ֥א אֶתְ/כֶ֖ם בְּ/אַחֲרִ֥ית הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/001.yaml
  text: Then Jacob called his sons and said[a], “Gather yourselves, and I will tell you what will happen to you in the latter days.”
translation:
  language: ml
  text: 'അപ്പോൾ യാക്കോബ് തന്റെ പുത്രന്മാരെ വിളിച്ച് പറഞ്ഞു: “ഒരുമിച്ചുകൂടുവിൻ; വരുംകാലത്ത്[a] നിങ്ങൾക്ക് എന്തു സംഭവിക്കുമെന്ന് ഞാൻ നിങ്ങളോടു പറയാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അന്ത്യനാളുകളിൽ.” ഈ എബ്രായ പ്രയോഗത്തിന് ചില സന്ദർഭങ്ങളിൽ അന്ത്യകാലപരമായ അർഥവുമുണ്ടാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ച്
  rationale: കרא എന്ന ക്രിയയ്ക്ക് ഈ ആഖ്യാനസന്ദർഭത്തിൽ ‘വിളിക്കുക/കൂട്ടിവരുത്തുക’ എന്ന അർഥമാണ്; ‘വിളിച്ച്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בָּנָיו
  choice: തന്റെ പുത്രന്മാരെ
  rationale: തുടർന്നുള്ള സന്ദർഭത്തിൽ യാക്കോബിന്റെ ആൺമക്കളെയും അവരിൽനിന്നുള്ള ഗോത്രങ്ങളെയും ഉദ്ദേശിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
- source_word: הֵאָסְפוּ
  choice: ഒരുമിച്ചുകൂടുവിൻ
  rationale: നിഫാൽ ബഹുവചന ആജ്ഞയുടെ സ്വയം കൂട്ടംചേരുക എന്ന ആശയവും ഗൗരവമുള്ള സ്വരവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וְאַגִּידָה לָכֶם
  choice: ഞാൻ നിങ്ങളോടു പറയാം
  rationale: കോഹോർട്ടേറ്റീവ് രൂപം യാക്കോബിന്റെ ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പറയാം’ ആ ആഹ്വാനാത്മക ഉദ്ദേശ്യം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֵת אֲשֶׁר יִקְרָא אֶתְכֶם
  choice: നിങ്ങൾക്ക് എന്തു സംഭവിക്കുമെന്ന്
  rationale: קרה എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ അർഥം ‘സംഭവിക്കുക/വന്നുഭവിക്കുക’ എന്നതാണ്; ഈ പരിഭാഷ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: വരുംകാലത്ത്
  rationale: ഈ പ്രയോഗം മുന്നിലുള്ള കാലത്തെ പൊതുവായി സൂചിപ്പിക്കാനും ചില സന്ദർഭങ്ങളിൽ യുഗാന്തസംബന്ധമായ ശക്തമായ അർഥം വഹിക്കാനും കഴിയും. മുഖ്യപാഠത്തിൽ ഭാവിദിശ നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായി സാങ്കേതിക യുഗാന്താർഥം ചുമത്തുന്നില്ല.
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים എന്ന പ്രയോഗത്തിന് വ്യക്തമായ യുഗാന്താർഥമുള്ള പരിഭാഷ നൽകണമോ എന്നത്
  choice: വരുംകാലത്ത്
  alternative: അന്ത്യനാളുകളിൽ
  rationale: ഉടൻ വരുന്ന സന്ദർഭം യാക്കോബിന്റെ പുത്രന്മാർക്കും അവരിൽനിന്നുള്ള ഗോത്രങ്ങൾക്കും ഭാവിയിൽ സംഭവിക്കുന്ന കാര്യങ്ങളാണ്. എങ്കിലും എബ്രായപ്രയോഗത്തിന് ചില സന്ദർഭങ്ങളിൽ യുഗാന്തപരമായ അർഥസാധ്യതയുള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘പുത്രന്മാർ’, ‘ഒരുമിച്ചുകൂടുവിൻ’ എന്നീ രൂപങ്ങൾ സന്ദർഭത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് മുഖ്യപാഠത്തിലെ യഥാർത്ഥ അർഥസാധ്യത സംരക്ഷിക്കുന്നു.
