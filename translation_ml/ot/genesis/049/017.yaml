id: GEN.49.17
reference: Genesis 49:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יְהִי דָן֙ נָחָ֣שׁ עֲלֵי דֶ֔רֶךְ שְׁפִיפֹ֖ן עֲלֵי אֹ֑רַח הַ/נֹּשֵׁךְ֙ עִקְּבֵי ס֔וּס וַ/יִּפֹּ֥ל רֹכְב֖/וֹ אָחֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/017.yaml
  text: Let Dan be a serpent by the road[a], a viper by the path, that bites the horse’s heels so that its rider falls backward.
translation:
  language: ml
  text: ദാൻ വഴിയരികിലെ സർപ്പവും പാതയരികിലെ വിഷപ്പാമ്പും[a] ആയിരിക്കട്ടെ; അത് കുതിരയുടെ കുതികാലുകളിൽ കടിക്കുമ്പോൾ, അതിന്റെ സവാരിക്കാരൻ പിന്നോട്ടു വീഴും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അഡർ” (ഒരു തരം വിഷപ്പാമ്പ്) എന്നും പരിഭാഷപ്പെടുത്താം. שְׁפִיפֹן എന്ന അപൂർവ എബ്രായപദം കൃത്യമായി ഏതു പാമ്പിനത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് ഉറപ്പില്ല; അപകടകാരിയായ ഒരു പാമ്പാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: ആയിരിക്കട്ടെ
  rationale: היה എന്ന ക്രിയയുടെ ജസ്സീവ് രൂപത്തിലുള്ള ആശംസാ-പ്രഖ്യാപന ഭാവം നിലനിർത്തുന്നു; വെറും ഭാവികാലമായി മാറ്റുന്നില്ല.
- source_word: דָן
  choice: ദാൻ
  rationale: യാക്കോബിന്റെ മകനുടെയും ഗോത്രത്തിന്റെയും പേരായതിനാൽ മലയാളത്തിൽ പതിവായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: נָחָשׁ
  choice: സർപ്പം
  rationale: പാമ്പിനെ പൊതുവായി സൂചിപ്പിക്കുന്ന പദം; അനുഗ്രഹവചനത്തിന്റെ ഉയർന്ന കാവ്യശൈലിക്കും പിന്നാലെയുള്ള കൂടുതൽ നിർദിഷ്ടമായ പദവുമായുള്ള സമാന്തരതയ്ക്കും യോജിക്കുന്നു.
- source_word: עֲלֵי דֶרֶךְ
  choice: വഴിയരികിലെ
  rationale: വഴിയോട് ചേർന്നിരുന്ന് പതിയിരിക്കുന്ന പാമ്പിന്റെ ദൃശ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שְׁפִיפֹן
  choice: വിഷപ്പാമ്പ്
  rationale: കൃത്യമായ പാമ്പിനം അനിശ്ചിതമായ അപൂർവ എബ്രായപദമാണിത്. ഒരു നിർദിഷ്ട ജന്തുശാസ്ത്രപരമായ തിരിച്ചറിയൽ അമിതമായി ഉറപ്പിക്കാതെ അപകടകാരിയായ പാമ്പ് എന്ന ആശയം നൽകുന്നു.
- source_word: עֲלֵי אֹרַח
  choice: പാതയരികിലെ
  rationale: דֶרֶךְ എന്നതിന് സമാന്തരമായെങ്കിലും വ്യത്യസ്തമായ אֹרַח എന്ന പദത്തിന്റെ കാവ്യസമാനത ‘വഴി/പാത’ എന്ന വ്യത്യാസത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: הַנֹּשֵׁךְ
  choice: അത് ... കടിക്കുമ്പോൾ
  rationale: പാമ്പിനെ അതിന്റെ പ്രവൃത്തിയാൽ വിശേഷിപ്പിക്കുന്ന കർത്തൃവാചക പങ്കാളിത്തരൂപം സ്വാഭാവികമായ മലയാളവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: עִקְּבֵי סוּס
  choice: കുതിരയുടെ കുതികാലുകളിൽ
  rationale: കുതിരയുടെ പിൻകാലിലെ കുതികാൽഭാഗത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചന നിർമാണം നിലനിർത്തുന്നു; ഏകവചനമായ ‘കുതിര’ പൊതുവായ പ്രതിനിധിയാണ്.
- source_word: וַיִּפֹּל
  choice: വീഴും
  rationale: കടിയെത്തുടർന്നുള്ള ഫലം വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ തുടർച്ചയായ സംഭവക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു.
- source_word: רֹכְבוֹ
  choice: അതിന്റെ സവാരിക്കാരൻ
  rationale: സർവനാമപ്രത്യയം ഏറ്റവും സ്വാഭാവികമായി കുതിരയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘അതിന്റെ’ എന്നത് ഈ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: אָחוֹר
  choice: പിന്നോട്ടു
  rationale: സവാരിക്കാരൻ വീഴുന്ന ദിശയെ സ്വാഭാവികമായ മലയാളത്തിൽ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
