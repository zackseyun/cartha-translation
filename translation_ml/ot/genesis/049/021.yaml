revisions:
- from: നഫ്താലി സ്വതന്ത്രമായി വിട്ടയക്കപ്പെട്ട ഒരു പെൺമാനാണ്;[a][b] അവൻ മനോഹരമായ വാക്കുകൾ പറയുന്നു.
  to: നഫ്താലി അഴിച്ചുവിട്ട പെൺമാനാണ്;[b][a] അവൻ മനോഹരമായ വാക്കുകൾ നൽകുന്നു.
  rationale: 'The revision makes two restrained improvements: it uses the more natural poetic Malayalam ‘അഴിച്ചുവിട്ട’ for the released doe, and it renders the final participle with ‘നൽകുന്നു,’ corresponding directly to ‘giving.’ The footnotes retain both the lexical nuance of the deer image and the disputed interpretive possibilities of the final clause, without presenting either alternative as certain.'
