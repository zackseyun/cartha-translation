source:
  edition: WLC
  text: נַפְתָּלִ֖י אַיָּלָ֣ה שְׁלֻחָ֑ה הַ/נֹּתֵ֖ן אִמְרֵי שָֽׁפֶר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/021.yaml
  text: Naphtali is a doe let loose[b][a], giving beautiful words.
translation:
  language: ml
  text: നഫ്താലി അഴിച്ചുവിട്ട പെൺമാനാണ്;[b][a] അവൻ മനോഹരമായ വാക്കുകൾ നൽകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വതന്ത്രമായി വിട്ടയക്കപ്പെട്ട ഒരു പെൺമാൻ.’ എബ്രായത്തിലെ ബിംബം സ്വതന്ത്രമായി ഓടാൻ വിട്ടയച്ച പെൺമാന്റേതാണ്.
    reason: lexical_alternative
  - marker: b
    text: അവസാന ഭാഗം പുരാതനവും ആധുനികവുമായ വ്യാഖ്യാനങ്ങളിൽ വ്യത്യസ്തമായി മനസ്സിലാക്കിയിട്ടുണ്ട്. ‘മനോഹരമായ മൊഴികൾ നൽകുന്നവൻ’ എന്നു വായിക്കാം; അവസാന പദങ്ങൾക്ക് നിർദേശിക്കപ്പെട്ട മറ്റൊരു അർഥമനുസരിച്ച് ‘മനോഹരമായ മാൻകുഞ്ഞുങ്ങളെ പ്രസവിക്കുന്നവൾ’ എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: נַפְתָּלִי
  choice: നഫ്താലി
  rationale: വ്യക്തിയുടെയും ഗോത്രത്തിന്റെയും പേരായതിനാൽ മലയാളത്തിലെ പതിവനുസരിച്ച് ലിപ്യന്തരണം ചെയ്തു.
- source_word: אַיָּלָה
  choice: പെൺമാൻ
  rationale: ഈ പദം പെൺവർഗത്തിലുള്ള മാനിനെ സൂചിപ്പിക്കുന്നു; കാവ്യബിംബത്തിലെ സ്ത്രീലിംഗം വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: שְׁלֻחָה
  choice: സ്വതന്ത്രമായി വിട്ടയക്കപ്പെട്ട
  rationale: שלח എന്ന ധാതുവിന്റെ നിഷ്ക്രിയരൂപം. സ്വതന്ത്രമായി ഓടാൻ അഴിച്ചുവിട്ട മൃഗത്തിന്റെ കാവ്യബിംബം വ്യക്തമാക്കുന്നു; വെറും ‘അയയ്ക്കപ്പെട്ട’ എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: הַנֹּתֵן
  choice: അവൻ ... പറയുന്നു
  rationale: നിർദ്ദിഷ്ട പുരുഷലിംഗ ഏകവചന കൃ​​ദന്തരൂപം നഫ്താലിയിലേക്കു മടങ്ങുന്നതായി വായിക്കാം. മലയാളത്തിൽ സ്വാഭാവികമായ പൂർണവാക്യമായി നൽകി; വിഷയത്തിലെ ആശയക്കുഴപ്പം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: אִמְרֵי
  choice: വാക്കുകൾ
  rationale: אמר എന്ന പദത്തിന്റെ construct ബഹുവചനം; ‘മൊഴികൾ’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് നേരിട്ടും സ്വാഭാവികവുമായ പദം.
- source_word: שָׁפֶר
  choice: മനോഹരമായ
  rationale: സൗന്ദര്യം, ഭംഗി, പ്രസാദം എന്നീ ആശയങ്ങൾ നൽകുന്ന പദം; കാവ്യാത്മകവും ആധുനികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: അവസാന കൃ​​ദന്തവാക്യത്തിന്റെ കർത്താവ്
  choice: ‘അവൻ മനോഹരമായ വാക്കുകൾ പറയുന്നു’ എന്നത് നഫ്താലിയെ സൂചിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: അത് പെൺമാൻ എന്ന ബിംബത്തെ തുടർന്നേക്കാം; അവസാന പദങ്ങളെ വേറൊരു അർഥത്തിൽ എടുത്താൽ ‘മനോഹരമായ മാൻകുഞ്ഞുങ്ങളെ പ്രസവിക്കുന്നു’ എന്നും വ്യാഖ്യാനിച്ചിട്ടുണ്ട്.
  rationale: മസോററ്റിക് സ്വരചിഹ്നങ്ങളുള്ള പാഠം ‘ഭംഗിയുള്ള വാക്കുകൾ നൽകുന്നവൻ’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; എന്നാൽ എബ്രായ കവിതയുടെ സംക്ഷിപ്തത മൂലമുള്ള യഥാർഥ വ്യാഖ്യാനസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവും കാവ്യാത്മകവുമായ ശൈലി. ‘പെൺമാൻ’ സ്ത്രീലിംഗബിംബം നിലനിർത്തുന്നു. എബ്രായത്തിലെ പുരുഷലിംഗ കൃ​​ദന്തം വ്യക്തമാക്കാൻ രണ്ടാം ഉപവാക്യത്തിൽ ‘അവൻ’ ഉപയോഗിച്ചു; ഇതിലുള്ള വ്യാഖ്യാനസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
