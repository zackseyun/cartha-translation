source:
  edition: WLC
  text: בַּ/מְּעָרָ֞ה אֲשֶׁ֨ר בִּ/שְׂדֵ֧ה הַ/מַּכְפֵּלָ֛ה אֲשֶׁ֥ר עַל פְּנֵי מַמְרֵ֖א בְּ/אֶ֣רֶץ כְּנָ֑עַן אֲשֶׁר֩ קָנָ֨ה אַבְרָהָ֜ם אֶת הַ/שָּׂדֶ֗ה מֵ/אֵ֛ת עֶפְרֹ֥ן הַ/חִתִּ֖י לַ/אֲחֻזַּת קָֽבֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/030.yaml
  text: in the cave that is in the field of Machpelah[a], which is opposite Mamre, in the land of Canaan[d][c][b], which Abraham bought with the field from Ephron the Hittite as a burial property.
translation:
  language: ml
  text: കനാൻ ദേശത്ത് മമ്രേയ്ക്കു നേരെയുള്ള[a] മക്പേലാ വയലിലെ ഗുഹയിൽ—ആ വയൽ അബ്രാഹാം ഹിത്യനായ എഫ്രോനിൽനിന്ന് കല്ലറയ്ക്കുള്ള അവകാശസ്വത്തായി വാങ്ങിയതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മമ്രേയ്ക്ക് അഭിമുഖമായുള്ള’ അല്ലെങ്കിൽ ‘മമ്രേയുടെ മുമ്പിലുള്ള’; എബ്രായപ്രയോഗം മമ്രേയോടുള്ള സ്ഥലബന്ധമാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמְּעָרָה
  choice: ഗുഹയിൽ
  rationale: בְּ എന്ന സ്ഥലസൂചക ഉപസർഗവും നിർദിഷ്ടനാമവും ചേർന്നതിനാൽ ‘ഗുഹയിൽ’ എന്നത് കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: בִּשְׂדֵה הַמַּכְפֵּלָה
  choice: മക്പേലാ വയലിലെ
  rationale: ഗുഹ മക്പേലാ എന്ന വയലിനകത്താണെന്ന സ്ഥലബന്ധം ചുരുക്കവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു; മക്പേലാ സ്ഥലനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: മമ്രേയ്ക്കു നേരെയുള്ള
  rationale: ഈ സ്ഥാനസൂചക പ്രയോഗം ‘അഭിമുഖമായി/മുമ്പിൽ/എതിർവശത്ത്’ എന്ന ബന്ധം സൂചിപ്പിക്കുന്നു; ‘നേരെയുള്ള’ അനാവശ്യമായ കൃത്യത ചുമത്താതെ അത് നിലനിർത്തുന്നു.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: കനാൻ ദേശത്ത്
  rationale: ഭൂമിശാസ്ത്രപരമായ വാക്യഘടകത്തിന്റെ നേരിട്ടുള്ള ആധുനിക മലയാള പരിഭാഷ.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: ആ വയൽ അബ്രാഹാം … വാങ്ങിയതാണ്
  rationale: אֵת הַשָּׂדֶה എന്ന നേരിട്ടുള്ള കർമത്തെ ‘ആ വയൽ’ എന്നു വ്യക്തമായി നിലനിർത്തുന്നു. ദീർഘമായ എബ്രായ ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ പുനരാരംഭിക്കുന്ന ഉപവാക്യം ഉപയോഗിച്ചു.
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: ഹിത്യനായ എഫ്രോനിൽനിന്ന്
  rationale: מֵאֵת വിൽപ്പനക്കാരനെയോ ഉറവിടത്തെയോ സൂചിപ്പിക്കുന്നു; gentilic വിശേഷണം ‘ഹിത്യനായ’ എന്നും വ്യക്തിനാമം ‘എഫ്രോൻ’ എന്നും നൽകി.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: ശവസംസ്കാരത്തിനുള്ള സ്വന്തഭൂമിയായി
  rationale: אֲחֻזָּהയിലെ നിയമപരമായി കൈവശമുള്ള സ്വത്ത് എന്ന ആശയവും קֶבֶרയിലെ സംസ്കാര/കല്ലറ ഉദ്ദേശ്യവും വായനാസൗകര്യത്തോടെ ഒരുമിച്ചു നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. മൂലത്തിലെ ബന്ധവാക്യശൃംഖല മലയാളത്തിൽ അവ്യക്തമാകാതിരിക്കാൻ ഡാഷിനു ശേഷം ‘ആ വയൽ’ എന്നു പുനരാരംഭിച്ചു; അതിലൂടെ אֵת הַשָּׂדֶה എന്ന നേരിട്ടുള്ള കർമവും സംരക്ഷിച്ചു.
