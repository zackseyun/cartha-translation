id: GEN.49.6
reference: Genesis 49:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/סֹדָ/ם֙ אַל תָּבֹ֣א נַפְשִׁ֔/י בִּ/קְהָלָ֖/ם אַל תֵּחַ֣ד כְּבֹדִ֑/י כִּ֤י בְ/אַפָּ/ם֙ הָ֣רְגוּ אִ֔ישׁ וּ/בִ/רְצֹנָ֖/ם עִקְּרוּ שֽׁוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/006.yaml
  text: Let my soul not enter their council[a]; let my honor not be joined to their assembly. For in their anger they killed a man[c][b], and in their self-will they hamstrung an ox.
translation:
  language: ml
  text: അവരുടെ ആലോചനാസഭയിൽ എന്റെ പ്രാണൻ പ്രവേശിക്കാതിരിക്കട്ടെ[a]; അവരുടെ സഭയോടു എന്റെ മാനം ചേരാതിരിക്കട്ടെ[b]. തങ്ങളുടെ കോപത്തിൽ അവർ ഒരു മനുഷ്യനെ കൊന്നു; തങ്ങളുടെ തന്നിഷ്ടപ്രകാരം അവർ ഒരു കാളയുടെ കാലിലെ ഞരമ്പുകൾ വെട്ടി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവരുടെ രഹസ്യ ആലോചനാസഭയിൽ’; סוֹד എന്ന പദത്തിന് അടുപ്പമുള്ളവരുടെ വൃത്തം അഥവാ രഹസ്യമായ കൂടിയാലോചനാസഭ എന്ന അർഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘എന്റെ മഹത്ത്വം അവരുടെ സഭയോടു ഒന്നിക്കാതിരിക്കട്ടെ.’
    reason: lexical_alternative
  - marker: c
    text: എബ്രായ മസൊററ്റിക് പാഠത്തിൽ שׁוֹר എന്നത് ‘കാള’ എന്നാണ് വായിക്കുന്നത്. ചിലർ വ്യഞ്ജനാക്ഷരങ്ങളെ വ്യത്യസ്തമായി വ്യാഖ്യാനിച്ച് ഈ ഭാഗം ‘അവർ ഒരു മതിൽ തകർത്തു’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּסֹדָם
  choice: അവരുടെ ആലോചനാസഭയിൽ
  rationale: סוֹד എന്ന പദത്തിന് അടുത്ത വൃത്തം, രഹസ്യമായ കൂടിയാലോചന, ആലോചനാസഭ എന്നീ അർഥങ്ങളുണ്ട്. സമാന്തരമായി വരുന്ന קָהָל എന്ന ‘സഭ’യോട് വ്യത്യാസം നിലനിർത്തിക്കൊണ്ട് deliberative group എന്ന ആശയം വ്യക്തമാക്കുന്നു; രഹസ്യസ്വഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: תָּבֹא נַפְשִׁי
  choice: എന്റെ പ്രാണൻ പ്രവേശിക്കാതിരിക്കട്ടെ
  rationale: אַל സഹിതമുള്ള ക്രിയ ആഗ്രഹരൂപത്തിലുള്ള നിഷേധം പ്രകടിപ്പിക്കുന്നു. נֶפֶשׁ എന്ന കാവ്യാത്മക സ്വയംസൂചനയെ വെറും ‘ഞാൻ’ എന്നു ലഘൂകരിക്കാതെ ‘എന്റെ പ്രാണൻ’ എന്നു നിലനിർത്തുന്നു.
- source_word: בִּקְהָלָם
  choice: അവരുടെ സഭയോടു
  rationale: קָהָל ഒരു കൂടിവന്ന സമൂഹത്തെയോ സഭയെയോ സൂചിപ്പിക്കുന്നു. ‘സഭ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കാവ്യസമാന്തരതയ്ക്ക് യോജിച്ചതുമാണ്.
- source_word: תֵּחַד כְּבֹדִי
  choice: എന്റെ മാനം ചേരാതിരിക്കട്ടെ
  rationale: יחד ഇവിടെ ഒന്നിച്ചുചേരുക എന്ന അർഥത്തിലും כָּבוֹד വ്യക്തിയുടെ മാനം, മഹത്ത്വം, കീർത്തി എന്നീ അർഥങ്ങളിലും വരുന്നു. അക്രമപ്രവൃത്തിയിൽനിന്നുള്ള യാക്കോബിന്റെ അകലം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘എന്റെ മാനം’ തെരഞ്ഞെടുത്തു.
- source_word: בְאַפָּם
  choice: തങ്ങളുടെ കോപത്തിൽ
  rationale: אַף ഇവിടെ കോപം എന്ന പതിവ് രൂപകാർഥത്തിലാണ്. ‘കോപത്തിൽ’ അർഥം നേരായും വ്യക്തമായും നൽകുന്നു.
- source_word: הָרְגוּ אִישׁ
  choice: അവർ ഒരു മനുഷ്യനെ കൊന്നു
  rationale: אִישׁ എന്ന ഏകവചനം പൊതുവൽക്കരിക്കാതെ നിലനിർത്തുന്നു; ശെഖേം സംഭവത്തിലേക്കുള്ള സാധ്യതയുള്ള സൂചനയും അതുവഴി സംരക്ഷിക്കുന്നു.
- source_word: וּבִרְצֹנָם
  choice: തങ്ങളുടെ തന്നിഷ്ടപ്രകാരം
  rationale: רָצוֹן ഇഷ്ടം, മനസ്സ്, പ്രസാദം എന്നിവ സൂചിപ്പിക്കാം. ഈ നിഷേധാത്മക സന്ദർഭത്തിൽ നിയന്ത്രണമില്ലാത്ത സ്വന്തം ഇഷ്ടം എന്ന ഭാവം ‘തന്നിഷ്ടപ്രകാരം’ നൽകുന്നു.
- source_word: עִקְּרוּ
  choice: കാൽഞരമ്പുകൾ വെട്ടി
  rationale: עקר എന്ന ക്രിയ മൃഗത്തെ കാൽഞരമ്പുകൾ വെട്ടി മുടന്താക്കുന്നതായി ഇവിടെ പരമ്പരാഗതമായും സന്ദർഭോചിതമായും മനസ്സിലാക്കപ്പെടുന്നു. മലയാളത്തിൽ പ്രവൃത്തി വ്യക്തമായി പറയുന്ന സ്വാഭാവിക രൂപമാണിത്.
- source_word: שׁוֹר
  choice: ഒരു കാള
  rationale: മസൊററ്റിക് സ്വരചിഹ്നപ്രകാരം שׁוֹר കാളയെയോ കാളവർഗത്തിലെ ആൺമൃഗത്തെയോ സൂചിപ്പിക്കുന്നു. עקר എന്ന ക്രിയയോടൊപ്പം ‘കാള’ യോജിക്കുന്നു.
theological_decisions:
- issue: കാവ്യാത്മകമായ സ്വയംസൂചനയിൽ כָּבוֹדִי എന്നതിന്റെ പരിഭാഷ
  choice: എന്റെ മാനം
  alternative: എന്റെ മഹത്ത്വം
  rationale: യാക്കോബ് ശിമെയോന്റെയും ലേവിയുടെയും അക്രമത്തിൽനിന്ന് തന്റെ വ്യക്തിപരമായ മാനത്തെയും പേരിനെയും വേർതിരിക്കുന്നു. ‘മാനം’ ഈ ആശയം സമകാലിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ‘മഹത്ത്വം’ എന്നതിന് ഉണ്ടാകാവുന്ന അനാവശ്യ ദൈവശാസ്ത്രധ്വനി ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: അവസാന പാദത്തിലെ שׁוֹר എന്ന പദത്തിന്റെ വായന
  choice: ഒരു കാള
  alternative: ഒരു മതിൽ
  rationale: മസൊററ്റിക് സ്വരചിഹ്നങ്ങൾ שׁוֹר എന്നതിനെ ‘കാള’ എന്നു വായിക്കുന്നു; עקר എന്ന ക്രിയയുമായുള്ള ചേർച്ചയും മൃഗത്തിന്റെ കാൽഞരമ്പുകൾ വെട്ടുക എന്ന പരമ്പരാഗത വ്യാഖ്യാനത്തെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും വ്യഞ്ജനാക്ഷരങ്ങളെ വേറൊരു വിധത്തിൽ വ്യാഖ്യാനിച്ച് ‘മതിൽ’ എന്നു വായിക്കുന്ന ശ്രദ്ധേയമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യഗദ്യം ഉപയോഗിച്ചു. ‘പ്രാണൻ,’ ‘മാനം,’ ‘ആലോചനാസഭ’ എന്നീ പദങ്ങൾ എബ്രായ കാവ്യസമാന്തരതയും സ്വയംവേർതിരിക്കുന്ന ശക്തമായ ഭാവവും നിലനിർത്തുന്നു. അപൂർവമോ അത്യന്തം സഭാഭാഷാപരമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
