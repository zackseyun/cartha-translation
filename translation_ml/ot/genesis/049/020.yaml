  text: מֵ/אָשֵׁ֖ר שְׁמֵנָ֣ה לַחְמ֑/וֹ וְ/ה֥וּא יִתֵּ֖ן מַֽעֲדַנֵּי מֶֽלֶךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/020.yaml
  text: Asher's food will be rich[a], and he will provide royal delicacies.
translation:
  language: ml
  text: ആശേരിൽനിന്നുള്ള ആഹാരം സമൃദ്ധമായിരിക്കും[a]; അവൻ രാജകീയ വിഭവങ്ങൾ നൽകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആശേരിൽനിന്നുള്ള അപ്പം കൊഴുപ്പുള്ളതായിരിക്കും; അവൻ ഒരു രാജാവിന്റെ വിശിഷ്ടഭോജ്യങ്ങൾ നൽകും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאָשֵׁר
  choice: ആശേരിൽനിന്നുള്ള
  rationale: മִן എന്ന ഉപസർഗത്തിന്റെ ഉറവിടം/പ്രദേശം സൂചിപ്പിക്കുന്ന അർഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ അടുത്തുള്ള ‘ആഹാരം’ എന്നതിനോടു സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: שְׁמֵנָה
  choice: സമൃദ്ധമായിരിക്കും
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘കൊഴുത്തത്’ എന്നാണെങ്കിലും, ഭക്ഷണത്തിന്റെ സമ്പന്നതയും ധാരാളിത്തവും സൂചിപ്പിക്കാൻ ‘സമൃദ്ധം’ ആധുനിക മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: לַחְמוֹ
  choice: ആഹാരം
  rationale: לֶחֶם എന്നത് അക്ഷരാർഥത്തിൽ ‘അപ്പം’ ആണെങ്കിലും ഇവിടെ പൊതുവായ ഭക്ഷണവിഭവം/ഉപജീവനം എന്ന വിശാല അർഥത്തിലാണ്; മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയം ആശേരുമായുള്ള ബന്ധത്തിലൂടെ വാക്യത്തിൽ പ്രകടമാകുന്നു.
- source_word: וְהוּא
  choice: അവൻ
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തി ആശേരിനെ വ്യക്തിപരമായ കർത്താവായി വീണ്ടും എടുത്തുകാട്ടുന്നു.
- source_word: יִתֵּן
  choice: നൽകും
  rationale: נָתַן എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘നൽകുക’ ഭാവിസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מַעֲדַנֵּי
  choice: വിഭവങ്ങൾ
  rationale: വിശിഷ്ടവും രുചികരവുമായ ഭക്ഷണങ്ങളെ സൂചിപ്പിക്കുന്നു; രാജകീയ എന്ന വിശേഷണത്തോടൊപ്പം മലയാളത്തിൽ ഈ അർഥം വ്യക്തമാണ്.
- source_word: מֶלֶךְ
  choice: രാജകീയ
  rationale: അക്ഷരാർഥമായ ‘ഒരു രാജാവിന്റെ’ എന്ന ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ വിശേഷണരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
