translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മുഖ്യപാഠം ഹീബ്രുവിലെ ഉറവിടസൂചനയും ഭാവിസ്വഭാവവും നിലനിർത്തുന്നു; ‘അപ്പം/കൊഴുപ്പ്’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
