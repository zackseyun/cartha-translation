  yaml_path: translation/ot/genesis/049/007.yaml
  text: Cursed be their anger[a], for it is fierce, and their wrath, for it is harsh. I will divide them in Jacob and scatter them in Israel.
translation:
  language: ml
  text: അവരുടെ കോപം ശപിക്കപ്പെട്ടതാകട്ടെ[a], കാരണം അത് ഉഗ്രമാണ്; അവരുടെ ക്രോധവും ശപിക്കപ്പെട്ടതാകട്ടെ, കാരണം അത് കഠിനമാണ്. യാക്കോബിൽ ഞാൻ അവരെ വിഭജിക്കും; ഇസ്രായേലിൽ ഞാൻ അവരെ ചിതറിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവരുടെ കോപം ശപിക്കപ്പെട്ടതാണ് … അവരുടെ ക്രോധവും ശപിക്കപ്പെട്ടതാണ്.”'
    reason: אָרוּר എന്ന കൃദന്തരൂപത്തെ ശാപപ്രഖ്യാപനമായോ ശപിക്കപ്പെട്ട അവസ്ഥയെക്കുറിച്ചുള്ള പ്രസ്താവനയായോ ഗ്രഹിക്കാം.
lexical_decisions:
- source_word: אָרוּר
  choice: ശപിക്കപ്പെട്ടതാകട്ടെ
  rationale: ശാപപ്രഖ്യാപനമായി പ്രയോഗിച്ചിരിക്കുന്ന നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ശാപം സഹോദരന്മാരുടെമേൽ നേരിട്ട് ചുമത്താതെ അവരുടെ കോപത്തിന്റെയും ക്രോധത്തിന്റെയുംമേൽ തന്നെയാക്കുന്നു.
- source_word: אַפָּם
  choice: അവരുടെ കോപം
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘മൂക്ക്/നാസാരന്ധ്രം’ എന്നതുമായി ബന്ധപ്പെട്ടതാണെങ്കിലും ഇവിടെ കോപം എന്ന ഹീബ്രു വ്യവഹാരാർഥമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: עָז
  choice: ഉഗ്രമാണ്
  rationale: കോപത്തിന്റെ ശക്തവും വിനാശകരവുമായ തീവ്രതയെ സാധാരണ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: עֶבְרָתָם
  choice: അവരുടെ ക്രോധം
  rationale: കവിഞ്ഞൊഴുകുന്ന രോഷമോ ക്രോധമോ സൂചിപ്പിക്കുന്ന പദത്തിന് ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ തുല്യപദം.
- source_word: קָשָׁתָה
  choice: കഠിനമാണ്
  rationale: മൂലത്തിലെ കാഠിന്യം/തീവ്രത എന്ന ആശയം ‘ക്രൂരമാണ്’ എന്ന് വ്യാഖ്യാനിച്ച് ശക്തിപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു.
- source_word: אֲחַלְּקֵם
  choice: ഞാൻ അവരെ വിഭജിക്കും
  rationale: തുടർന്നുള്ള ‘ചിതറിക്കും’ എന്ന ക്രിയയിൽനിന്നുള്ള പദവ്യത്യാസം നിലനിർത്തുകയും ഗോത്രങ്ങളായി പിരിച്ചിടപ്പെടുന്നതിനെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּיַעֲקֹב
  choice: യാക്കോബിൽ
  rationale: യാക്കോബിന്റെ സന്തതിസമൂഹത്തിനുള്ളിൽ എന്ന സമൂഹവാചക അർഥം നിലനിർത്തുന്നു; ‘ഇസ്രായേലിൽ’ എന്ന സമാന്തരപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: וַאֲפִיצֵם
  choice: ഞാൻ അവരെ ചിതറിക്കും
  rationale: അവരെ പല ഇടങ്ങളിലായി പരത്തുമെന്ന കാരണപ്രേരിത ക്രിയാഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: ദേശസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പേരായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി ‘യാക്കോബിൽ’ എന്നതോടുള്ള കാവ്യസമാന്തര്യം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശാപത്തിന്റെ ലക്ഷ്യം
  choice: ശാപം ശിമെയോന്റെയും ലേവിയുടെയും വ്യക്തികളിലേക്കു നേരിട്ട് അല്ല, അവരുടെ കോപത്തിന്റെയും ക്രോധത്തിന്റെയുംമേലാണ് പ്രഖ്യാപിക്കുന്നത്.
  alternative: സഹോദരന്മാർ തന്നെയാണ് ശപിക്കപ്പെടുന്നത്.
  rationale: ഹീബ്രു വാക്യം ‘അവരുടെ കോപം’ എന്നും ‘അവരുടെ ക്രോധം’ എന്നും വ്യക്തമായി പറയുന്നു. അതിനാൽ വ്യക്തികളിലേക്കു ശാപം ശക്തിപ്പെടുത്താതെ മൂലത്തിലെ വ്യത്യാസവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- issue: אָרוּר എന്നതിന്റെ വാക്യബലം
  choice: ശാപപ്രഖ്യാപനത്തിന്റെ ശക്തിയോടെ ‘ശപിക്കപ്പെട്ടതാകട്ടെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ശപിക്കപ്പെട്ടതാണ്’ എന്ന നിലപ്രസ്താവന.
  rationale: നിഷ്ക്രിയ കൃദന്തം പ്രവചനാത്മക നിലപ്രസ്താവനയായും ശാപപ്രഖ്യാപനമായും ഗ്രഹിക്കാവുന്നതാണ്; മുഖ്യപാഠം സന്ദർഭത്തിലെ പ്രഖ്യാപനശക്തി നൽകുകയും അടിക്കുറിപ്പ് മറ്റുസാധ്യത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘യാക്കോബ്/ഇസ്രായേൽ’, ‘വിഭജിക്കും/ചിതറിക്കും’ എന്നീ കാവ്യസമാന്തര്യങ്ങൾ സംരക്ഷിച്ചു. രണ്ടാം അർദ്ധവാക്യത്തിൽ മലയാളത്തിന്റെ വ്യക്തതയ്ക്കായി ‘ശപിക്കപ്പെട്ടതാകട്ടെ’ എന്നും അവസാനവാക്യത്തിൽ ‘ഞാൻ’ എന്നും ആവർത്തിച്ചു.
