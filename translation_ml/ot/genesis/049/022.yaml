translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കാവ്യശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ആവർത്തനവും സാന്ദ്രമായ രൂപകവും നിലനിർത്തി. ഓരോ കുറിപ്പടയാളവും ബന്ധപ്പെട്ട പദത്തിനരികിൽ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
