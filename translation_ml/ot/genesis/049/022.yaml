source:
  edition: WLC
  text: בֵּ֤ן פֹּרָת֙ יוֹסֵ֔ף בֵּ֥ן פֹּרָ֖ת עֲלֵי עָ֑יִן בָּנ֕וֹת צָעֲדָ֖ה עֲלֵי שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/022.yaml
  text: Joseph is a fruitful son[a], a fruitful son by a spring[b]; daughters step over the wall.
translation:
  language: ml
  text: 'യോസേഫ് ഫലസമൃദ്ധനായ ഒരു മകനാണ്[a],

    നീരുറവിനരികിലെ ഫലസമൃദ്ധനായ ഒരു മകൻ;

    പുത്രിമാർ[b] മതിലിനുമീതെ ചുവടുവെക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യോസേഫ് ഫലംകായ്ക്കുന്ന ഒരു കൊമ്പാണ്, നീരുറവിനരികിലെ ഫലംകായ്ക്കുന്ന ഒരു കൊമ്പ്.” എബ്രായകാവ്യം സാന്ദ്രവും സംക്ഷിപ്തവുമാണ്; പരമ്പരാഗതമായ ‘കൊമ്പ്’ എന്ന പരിഭാഷ രൂപകത്തെ കൂടുതൽ വ്യക്തമായി വ്യാഖ്യാനിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം “പുത്രിമാർ.” മതിലിനുമീതെ പടരുന്ന ശാഖകളെയോ തളിരുകളെയോ സൂചിപ്പിക്കുന്ന രൂപകമായി ഇതിനെ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן פֹּרָת
  choice: ഫലസമൃദ്ധനായ ഒരു മകൻ
  rationale: בֵּן എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘മകൻ’ നിലനിർത്തുകയും, פרה എന്ന ധാതുവിൽനിന്നുള്ള פֹּרָת എന്ന പദത്തിന്റെ ഫലപുഷ്ടിയുടെ ആശയം ‘ഫലസമൃദ്ധനായ’ എന്നു പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു. കാവ്യത്തിലെ സാന്ദ്രത വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കുന്നില്ല.
- source_word: עֲלֵי עָיִן
  choice: നീരുറവിനരികിലെ
  rationale: עַיִן എന്നതിന് ‘കണ്ണ്’ എന്നും ‘നീരുറവ്’ എന്നും അർഥമുണ്ട്. ഫലസമൃദ്ധിയുടെ പശ്ചാത്തലത്തിൽ ജലസ്രോതസ്സായ ‘നീരുറവ്’ സ്വാഭാവികമാണ്; עֲלֵי ഇവിടെ സ്ഥലബന്ധമായി പരിഭാഷപ്പെടുത്തി.
- source_word: בָּנוֹת
  choice: പുത്രിമാർ
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘പുത്രിമാർ’ എന്നതാണ്. ശാഖകളെയോ തളിരുകളെയോ സൂചിപ്പിക്കുന്ന രൂപകമായി ഇതിനെ മനസ്സിലാക്കാമെങ്കിലും, പ്രധാനപാഠത്തിൽ രൂപകത്തിന്റെ സാന്ദ്രത നിലനിർത്തുന്നു.
- source_word: צָעֲדָה
  choice: ചുവടുവെക്കുന്നു
  rationale: ഈ ക്രിയയ്ക്ക് ചുവടുവെക്കുക, മുന്നേറുക എന്ന ആശയമുണ്ട്. അനുഗ്രഹകാവ്യത്തിലെ ദൃശ്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ വർത്തമാനകാലപ്രയോഗം സ്വീകരിച്ചു.
- source_word: עֲלֵי שׁוּר
  choice: മതിലിനുമീതെ
  rationale: שׁוּר ഇവിടെ ‘മതിൽ’ എന്നാണ് ഏറ്റവും സ്വാഭാവികമായി മനസ്സിലാക്കുന്നത്; עֲלֵי അതിനെ അതിക്രമിച്ചുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി.
