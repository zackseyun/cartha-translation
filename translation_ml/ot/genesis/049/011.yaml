  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֹסְרִ֤י לַ/גֶּ֨פֶן֙ עיר/ה וְ/לַ/שֹּׂרֵקָ֖ה בְּנִ֣י אֲתֹנ֑/וֹ כִּבֵּ֤ס בַּ/יַּ֨יִן֙ לְבֻשׁ֔/וֹ וּ/בְ/דַם עֲנָבִ֖ים סות/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/011.yaml
  text: Binding his donkey to the vine[a], and his donkey’s colt to the choice vine, he washes his garments in wine[c][b], and his robe in the blood of grapes.
translation:
  language: ml
  text: തന്റെ കഴുതക്കുട്ടിയെ[a] മുന്തിരിവള്ളിയോടും, തന്റെ പെൺകഴുതയുടെ കുഞ്ഞിനെ മേൽത്തരം മുന്തിരിവള്ളിയോടും[b] കെട്ടുന്നവൻ തന്റെ വസ്ത്രം വീഞ്ഞിലും, തന്റെ അങ്കി മുന്തിരിപ്പഴങ്ങളുടെ രക്തത്തിലും[c] കഴുകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കഴുതക്കുട്ടി’ എന്നതിന് ‘ചെറുകഴുത’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിലെ עִיר ഇരു അർഥങ്ങളിലും ഉപയോഗിക്കപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘മേൽത്തരം മുന്തിരിവള്ളി’ എന്നതിന് ‘തിരഞ്ഞെടുത്ത മുന്തിരിവള്ളി’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിലെ שֹׂרֵקָה മികച്ച ഇനത്തിലുള്ള വള്ളിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘മുന്തിരിപ്പഴങ്ങളുടെ രക്തം’ എന്നത് മുന്തിരിനീരിനെയോ വീഞ്ഞിനെയോ സൂചിപ്പിക്കുന്ന എബ്രായ കാവ്യപ്രയോഗമാണ്; അതിന്റെ ദൃശ്യഭംഗി നിലനിർത്താൻ ഇവിടെ അക്ഷരാർഥരൂപം സൂക്ഷിച്ചിരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: אֹסְרִי
  choice: കെട്ടുന്നവൻ
  rationale: കർത്തൃവാചകമായ ഏകവചന പുൽലിംഗ കാൽ participle-ന്റെ വിവരണാത്മകവും സജീവവുമായ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לַגֶּפֶן
  choice: മുന്തിരിവള്ളിയോട്
  rationale: גפן എന്ന സാധാരണ ഏകവചന നാമത്തിന്റെ അർഥം നേരിട്ട് നൽകുന്നു; നിർദിഷ്ടപ്രത്യയം കവിതയിൽ പൊതുവായ ഇനസൂചനയായും വരാം.
- source_word: עירֹה
  choice: തന്റെ കഴുതക്കുട്ടിയെ
  rationale: עַיִר ചെറുകഴുതയെയോ കഴുതക്കുട്ടിയെയോ സൂചിപ്പിക്കുന്നു. ഉടമസ്ഥപ്രത്യയം ‘തന്റെ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וְלַשֹּׂרֵקָה
  choice: മേൽത്തരം മുന്തിരിവള്ളിയോട്
  rationale: שֹׂרֵקָה തിരഞ്ഞെടുത്ത, മികച്ച ഇനത്തിലുള്ള മുന്തിരിവള്ളിയെ സൂചിപ്പിക്കുന്നു; ‘മേൽത്തരം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും അർഥസമ്പന്നവുമാണ്.
- source_word: בְּנִי אֲתֹנוֹ
  choice: തന്റെ പെൺകഴുതയുടെ കുഞ്ഞിനെ
  rationale: അക്ഷരാർഥത്തിൽ ‘തന്റെ പെൺകഴുതയുടെ മകൻ’; മലയാളത്തിൽ ജീവിയുടെ സന്തതിയെ സൂചിപ്പിക്കാൻ ‘കുഞ്ഞ്’ സ്വാഭാവികമാണ്, പെൺലിംഗസൂചനയും നിലനിർത്തുന്നു.
- source_word: כִּבֵּס
  choice: കഴുകുന്നു
  rationale: കാവ്യത്തിലെ perfect രൂപം സവിശേഷമോ ദൃശ്യവൽക്കരിച്ചതോ ആയ പ്രവൃത്തിയായി വായിക്കാം; വർത്തമാനകാലം മുൻപുള്ള participial ചിത്രീകരണത്തോട് സ്വാഭാവികമായി ചേരുന്നു, ഭാവികാലമെന്ന വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
- source_word: בַּיַּיִן
  choice: വീഞ്ഞിൽ
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ സ്ഥാനാർഥം നിലനിർത്തി, വീഞ്ഞിൽ വസ്ത്രം കഴുകുന്ന സമൃദ്ധിയുടെ അതിശയോക്തിപരമായ ചിത്രം സംരക്ഷിക്കുന്നു.
- source_word: לְבֻשׁוֹ
  choice: തന്റെ വസ്ത്രം
  rationale: ഏകവചന രൂപം നിലനിർത്തുകയും സമാന്തരമായ അടുത്ത വസ്ത്രപദത്തോടുള്ള കാവ്യബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וּבְדַם עֲנָבִים
  choice: മുന്തിരിപ്പഴങ്ങളുടെ രക്തത്തിൽ
  rationale: ഹീബ്രായിയിലെ ശക്തമായ കാവ്യരൂപകം വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: סוּתוֹ
  choice: തന്റെ അങ്കി
  rationale: പുറമേ ധരിക്കുന്ന വസ്ത്രത്തെ സൂചിപ്പിക്കുന്ന, ഗൗരവമുള്ളതും ആധുനിക വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളപദം; കൃത്യമായ വസ്ത്രരൂപം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: യൂദാവിനെക്കുറിച്ചുള്ള യാക്കോബിന്റെ അനുഗ്രഹത്തിലെ മിശിഹായോ ഗോത്രപരമോ ആയ ദൃശ്യഭാഷ
  choice: അസാധാരണ സമൃദ്ധിയുടെയും പ്രൗഢിയുടെയും കാവ്യചിത്രമായി വാക്യം നിലനിർത്തുന്നു; മിശിഹാവ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുന്നില്ല.
  alternative: ഇത് നേരിട്ടുള്ള മിശിഹാപ്രവചനമായി വിവർത്തനത്തിൽ വ്യക്തമാക്കുക; അല്ലെങ്കിൽ യൂദാഗോത്രത്തിന്റെ ചരിത്രസമൃദ്ധിയായി മാത്രം നിർണ്ണയിക്കുക.
  rationale: ഹീബ്രായിപാഠം മുന്തിരിവള്ളിയും വീഞ്ഞും വസ്ത്രവും ഉപയോഗിച്ച് സമൃദ്ധിയുടെ ദൃശ്യം നൽകുന്നു. വിപുലമായ യൂദാ അരുളപ്പാടിന് മിശിഹാപരമായ സ്വീകരണചരിത്രമുണ്ടെങ്കിലും, ഈ വാക്യം മാത്രം ആ വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യഗദ്യം. ‘കെട്ടുന്നവൻ … കഴുകുന്നു’ എന്ന ഘടന ഹീബ്രായിയിലെ participial ആരംഭവും തുടർന്നുള്ള ദൃശ്യപ്രവൃത്തിയും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു. അപൂർവമോ സഭാപരമായി പ്രത്യേകമോ ആയ പദങ്ങൾ ഒഴിവാക്കി; ‘മുന്തിരിപ്പഴങ്ങളുടെ രക്തം’ എന്ന ഉറവിടരൂപകം മാത്രം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
