id: GEN.49.8
reference: Genesis 49:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יְהוּדָ֗ה אַתָּה֙ יוֹד֣וּ/ךָ אַחֶ֔י/ךָ יָדְ/ךָ֖ בְּ/עֹ֣רֶף אֹיְבֶ֑י/ךָ יִשְׁתַּחֲוּ֥וּ לְ/ךָ֖ בְּנֵ֥י אָבִֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/008.yaml
  text: Judah[a], your brothers will praise you; your hand will be on the neck of your enemies[b]; the sons of your father will bow down to you.
translation:
  language: ml
  text: യൂദാ[a], നിന്റെ സഹോദരന്മാർ നിന്നെ പുകഴ്ത്തും; നിന്റെ കൈ ശത്രുക്കളുടെ കഴുത്തിന്മേൽ ഇരിക്കും; നിന്റെ പിതാവിന്റെ പുത്രന്മാർ നിന്റെ മുമ്പിൽ കുനിയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്നോടു നന്ദി പറയും’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് നന്ദി പറയുക, ഏറ്റുപറയുക, പുകഴ്ത്തുക എന്നീ അർഥങ്ങളുണ്ട്; ഇവിടെ അനുഗ്രഹത്തിന്റെ സന്ദർഭവും ‘യൂദാ’ എന്ന പേരുമായുള്ള ശബ്ദബന്ധവും കണക്കിലെടുത്ത് ‘പുകഴ്ത്തും’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: യൂദാ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: יוֹדוּךָ
  choice: നിന്നെ പുകഴ്ത്തും
  rationale: ידה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ബഹുമാനത്തോടെ പുകഴ്ത്തുക/അംഗീകരിക്കുക എന്ന അർഥത്തിലാണ്; അനുഗ്രഹത്തിന്റെ സന്ദർഭത്തിനും യൂദാ എന്ന പേരുമായുള്ള ശബ്ദബന്ധത്തിനും ‘പുകഴ്ത്തും’ യോജിക്കുന്നു.
- source_word: אַחֶיךָ
  choice: നിന്റെ സഹോദരന്മാർ
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ബഹുവചനവും യാക്കോബിന്റെ പുത്രന്മാരെന്ന അടുത്ത കുടുംബസന്ദർഭവും അതേപടി സൂക്ഷിക്കുന്നു.
- source_word: יָדְךָ בְּעֹרֶף אֹיְבֶיךָ
  choice: നിന്റെ കൈ ശത്രുക്കളുടെ കഴുത്തിന്മേൽ ഇരിക്കും
  rationale: വിജയവും അധീശത്വവും സൂചിപ്പിക്കുന്ന മൂർത്തമായ എബ്രായ ദൃശ്യഭാഷ സംരക്ഷിച്ചു; ‘കൈ’യും ‘കഴുത്ത്’ എന്ന ആശയവും വ്യാഖ്യാനിച്ച് മാറ്റിയില്ല.
- source_word: יִשְׁתַּחֲווּ לְךָ
  choice: നിന്റെ മുമ്പിൽ കുനിയും
  rationale: ഇവിടെ ദൈവാരാധനയല്ല, കീഴടങ്ങലോ ബഹുമാനപ്രകടനമോ ആണ് സന്ദർഭം; ‘കുനിയും’ ആ പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי אָבִיךָ
  choice: നിന്റെ പിതാവിന്റെ പുത്രന്മാർ
  rationale: അക്ഷരാർഥത്തിലുള്ള കുടുംബപ്രയോഗം നിലനിർത്തി; ഇത് യൂദായുടെ സഹോദരന്മാരെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יִשְׁתַּחֲווּ לְךָ എന്നതിലെ ആദര/ആരാധന ഭാഷ
  choice: മനുഷ്യനായ യൂദായോടുള്ള കീഴടങ്ങലും ബഹുമാനവും സൂചിപ്പിക്കുന്ന ‘നിന്റെ മുമ്പിൽ കുനിയും’
  alternative: ‘നിന്നെ ആരാധിക്കും’ അല്ലെങ്കിൽ ‘നിനക്കു സാഷ്ടാംഗം വീഴും’
  rationale: യാക്കോബിന്റെ അനുഗ്രഹത്തിൽ അഭിസംബോധന ചെയ്യപ്പെടുന്നത് യൂദാ ആയതിനാൽ ദൈവാരാധന എന്ന ആശയം ഇറക്കുമതി ചെയ്യാതെ രാജകീയമായ ആദരവും കീഴടങ്ങലും പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പദ്യത്തിന്റെ സമാന്തരഘടനയും ‘കൈ—കഴുത്ത്’ എന്ന വിജയദൃശ്യവും സംരക്ഷിച്ചു. മുഖ്യപാഠത്തിൽ ഉള്ള ഏക അടിക്കുറിപ്പ് ചിഹ്നം [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
