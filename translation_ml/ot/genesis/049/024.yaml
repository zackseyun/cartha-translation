  yaml_path: translation/ot/genesis/049/024.yaml
  text: Yet his bow remained steady, and his arms were made agile by the hands of the Mighty One of Jacob; from there is the Shepherd, the Stone of Israel.
translation:
  language: ml
  text: എങ്കിലും അവന്റെ വില്ല് ഉറപ്പോടെ നിലനിന്നു; യാക്കോബിന്റെ ബലവാന്റെ കൈകളാൽ അവന്റെ ഭുജങ്ങൾ വഴക്കമുള്ളവയായി. അവിടെനിന്നാണ് ഇസ്രായേലിന്റെ ഇടയനും പാറയും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“അവിടെനിന്നാണ് ഇസ്രായേലിന്റെ ഇടയനും പാറയും” എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ വ്യാകരണബന്ധം ദുഷ്കരമാണ്. മറ്റൊരു സാധ്യത: “യാക്കോബിന്റെ ബലവാന്റെ കൈകളാൽ—ഇസ്രായേലിന്റെ ഇടയനും പാറയുമായവനിൽനിന്ന്.”'
    reason: מִשָּׁם רֹעֶה אֶבֶן יִשְׂרָאֵל എന്ന അവസാനഭാഗം മുമ്ബിലുള്ള “യാക്കോബിന്റെ ബലവാന്റെ കൈകളാൽ” എന്ന പ്രയോഗത്തോടു വ്യത്യസ്തമായി ബന്ധിപ്പിക്കപ്പെടാം; ബദൽ വ്യാഖ്യാനം സൂചിപ്പിക്കുമ്പോൾ מִידֵי എന്ന ‘കൈകളാൽ’ ഘടകവും നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: בְּאֵיתָן
  choice: ഉറപ്പോടെ
  rationale: വില്ല് അചഞ്ചലവും ദൃഢവുമായി നിലനിന്നുവെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיָּפֹזּוּ
  choice: ചുറുചുറുക്കുള്ളവയായി
  rationale: അപൂർവമായ ഈ ക്രിയയ്ക്ക് ശക്തി/വഴക്കം/ചാപല്യം ലഭിച്ചു എന്ന സാന്ദർഭിക അർഥം നൽകുന്നു; ഇംഗ്ലീഷ് consultation layer-ലെ ‘made agile’ നോടും യോജിക്കുന്നു.
- source_word: אֲבִיר יַעֲקֹב
  choice: യാക്കോബിന്റെ ശക്തനായവൻ
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത ബിരുദത്തിന്റെ ഘടനയും അർഥവും നിലനിർത്തുന്നു.
- source_word: רֹעֶה
  choice: ഇടയൻ
  rationale: മൂലപദത്തിന്റെ രൂപകാത്മകമായ ദൈവിക ബിരുദം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: אֶבֶן יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പാറ
  rationale: അക്ഷരാർഥത്തിൽ ‘കല്ല്’ എന്നാണെങ്കിലും ബിരുദരൂപകത്തിൽ സ്ഥിരതയും ആശ്രയവും സൂചിപ്പിക്കാൻ മലയാളത്തിൽ ‘പാറ’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: מִשָּׁם എന്നതിന്റെ ബന്ധവും ഇടയൻ/പാറ എന്ന ബിരുദങ്ങളുടെ വാക്യഘടനയും
  choice: “അവിടെനിന്നാണ് ഇസ്രായേലിന്റെ ഇടയനും പാറയും” എന്നിങ്ങനെ മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്തി
  alternative: “യാക്കോബിന്റെ ശക്തനായവനിൽനിന്ന്, ഇസ്രായേലിന്റെ ഇടയനും പാറയുമായവനിൽനിന്ന്” അല്ലെങ്കിൽ “അവിടെനിന്ന് അവൻ ഇസ്രായേലിന്റെ ഇടയനായി”
  rationale: ഹീബ്രു വാക്യഘടന ദുഷ്കരവും വ്യത്യസ്തമായി വ്യാഖ്യാനിക്കാവുന്നതുമാണ്. ദൈവിക ബിരുദങ്ങളെയും ‘അവിടെനിന്ന്’ എന്ന സൂചനയെയും വ്യക്തമായി ബന്ധിപ്പിച്ചു തീർക്കാതെ യഥാർത്ഥ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ കാവ്യാത്മക ദൈവിക ബിരുദങ്ങളും അവസാന ഭാഗത്തിന്റെ യഥാർത്ഥ വ്യാകരണാവ്യക്തതയും സംരക്ഷിച്ചിട്ടുണ്ട്.
