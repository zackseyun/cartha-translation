  - marker: b
    text: അഥവാ, ‘ആ വയലിന്റെയും അതിലുള്ള ഗുഹയുടെയും വാങ്ങൽ ഹേത്തിന്റെ പുത്രന്മാരിൽനിന്നായിരുന്നു.’
