translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായ നാമവാക്യത്തിന്റെ അസ്വാഭാവികമായ ഖണ്ഡരൂപം ഒഴിവാക്കി, വാങ്ങലിലൂടെ സ്വന്തമാക്കിയെന്ന അർഥം വ്യക്തമായി പ്രകടിപ്പിച്ചു; അതേസമയം കൂടുതൽ നാമരൂപപരമായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
