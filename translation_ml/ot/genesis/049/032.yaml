  text: ആ വയലും അതിലുള്ള ഗുഹയും ഹേത്തിന്റെ പുത്രന്മാരിൽനിന്നു വാങ്ങിയവയാണ്[a][b].
  philosophy: optimal-equivalence
  footnotes:
