lexical_decisions:
- source_word: מִקְנֵה
  choice: വാങ്ങിയവയാണ്
  rationale: מִקְנֵה എന്ന നാമരൂപം ഇവിടെ വിലകൊടുത്ത് സ്വന്തമാക്കിയ വസ്തുവിനെയോ വാങ്ങലിനെയോ സൂചിപ്പിക്കുന്നു. മുൻവിവരണത്തിന്റെ സംഗ്രഹമായി വരുന്ന എബ്രായ നാമവാക്യം മലയാളത്തിൽ സ്വാഭാവികവും സമ്പൂർണവുമായ വാക്യമാക്കാൻ ‘വാങ്ങിയവയാണ്’ എന്നു നൽകി.
- source_word: הַשָּׂדֶה
  choice: ആ വയൽ
  rationale: ഭൂസ്വത്തിനെ സൂചിപ്പിക്കുന്ന שָׂדֶהയുടെ സാധാരണ മലയാള തർജമ. സന്ദർഭത്തിൽ മുമ്പ് പറഞ്ഞ വയലിനെ തിരിച്ചുസൂചിപ്പിക്കുന്നതിനാൽ ‘ആ’ ചേർത്തു.
- source_word: וְהַמְּעָרָה
  choice: അതിലുള്ള ഗുഹയും
  rationale: സംയോജകവും തുടർന്നുള്ള ബന്ധവാക്യവും മലയാളത്തിൽ സ്വാഭാവികമായി ചേർത്ത്, ഗുഹ വയലിനുള്ളിലാണെന്ന ബന്ധം വ്യക്തമാക്കി.
- source_word: אֲשֶׁר בּוֹ
  choice: അതിലുള്ള
  rationale: അക്ഷരാർഥത്തിൽ ‘അതിൽ ഉള്ളത്’; വയലിനകത്തുള്ള ഗുഹയെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകി.
- source_word: מֵאֵת
  choice: നിന്നു
  rationale: സ്വത്ത് ആരിൽനിന്ന് ലഭിച്ചു എന്ന ഉറവിടം സൂചിപ്പിക്കുന്ന വിഭക്തിരൂപം.
- source_word: בְּנֵי חֵת
  choice: ഹേത്തിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ വംശപരമായ പ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു; സന്ദർഭപരമായ ‘ഹിത്യർ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകി.
