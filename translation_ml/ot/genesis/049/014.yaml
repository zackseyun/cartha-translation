source:
  edition: WLC
  text: יִשָּׂשכָ֖ר חֲמֹ֣ר גָּ֑רֶם רֹבֵ֖ץ בֵּ֥ין הַֽ/מִּשְׁפְּתָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/014.yaml
  text: Issachar is a strong-boned donkey[a], lying down between the sheepfolds.
translation:
  language: ml
  text: യിസ്സാഖാർ കരുത്തുറ്റ അസ്ഥികളുള്ള ഒരു കഴുതയാണ്; അവൻ ആട്ടിൻതൊഴുത്തുകൾക്കിടയിൽ കിടക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചുമടുസഞ്ചികൾക്കിടയിൽ.’ ഈ എബ്രായപദം അപൂർവമായതിനാൽ അതിന്റെ അർഥത്തെക്കുറിച്ച് അഭിപ്രായവ്യത്യാസമുണ്ട്; ഈ ഇടയജീവിതാനുഗ്രഹത്തിന്റെ സന്ദർഭത്തിൽ ‘ആട്ടിൻതൊഴുത്തുകൾ’ എന്നത് പരമ്പരാഗതവും സാധ്യതയേറിയതുമായ അർഥമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂשכָר
  choice: യിസ്സാഖാർ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിക്കനുസരിച്ച് നൽകിയിരിക്കുന്നു.
- source_word: חֲמֹר
  choice: കഴുത
  rationale: അടിസ്ഥാന അർഥം സ്വാഭാവികവും പൊതുവായി മനസ്സിലാകുന്നതുമായ മലയാളപദത്തിൽ നൽകിയിരിക്കുന്നു; ആൺകഴുത എന്ന് മൂലപാഠത്തേക്കാൾ കൂടുതൽ വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: גָּרֶם
  choice: കരുത്തുറ്റ അസ്ഥികളുള്ള
  rationale: ‘അസ്ഥി’ എന്ന മൂർത്തമായ ദൃശ്യബിംബം നിലനിർത്തിക്കൊണ്ട്, ഇവിടെ ഉദ്ദേശിക്കുന്നത് മെലിഞ്ഞ ശരീരമല്ല, ഉറപ്പും കരുത്തുമുള്ള ശരീരഘടനയാണെന്ന സാധ്യത സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: רֹבֵץ
  choice: കിടക്കുന്നു
  rationale: മൃഗം നിലത്തു കിടക്കുന്നതോ പതുങ്ങിയിരിക്കുന്നതോ സൂചിപ്പിക്കുന്ന കൃദന്തരൂപം; ഈ ഇടയജീവിത ദൃശ്യത്തിൽ ‘കിടക്കുന്നു’ സ്വാഭാവികമാണ്.
- source_word: בֵּין
  choice: ഇടയിൽ
  rationale: സ്ഥാനബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: הַמִּשְׁפְּתָיִם
  choice: ആട്ടിൻതൊഴുത്തുകൾ
  rationale: അപൂർവവും വിവാദവിധേയവുമായ ഈ പദത്തിന് പരമ്പരാഗതവും ഇടയജീവിതസന്ദർഭത്തിന് യോജിച്ചതുമായ അർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യഗദ്യം. മൂലത്തിലെ മൃഗദൃശ്യവും ‘അസ്ഥി’ എന്ന ദൃഢമായ രൂപകവും സംരക്ഷിച്ചിരിക്കുന്നു; അപൂർവപദത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
