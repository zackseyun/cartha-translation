  to: വിശ്രമസ്ഥലം നല്ലതെന്നും[a] ദേശം മനോഹരമെന്നും അവൻ കണ്ടു; ഭാരം ചുമക്കാൻ അവൻ തന്റെ തോളു കുനിച്ചു, പിന്നെ നിർബന്ധിതവേലക്കാരനായിത്തീർന്നു[c].
  rationale: മുഖ്യവാക്യത്തിലെ സാമൂഹികസൂചന കൂടുതൽ നേരിട്ടും സ്വാഭാവികമായും നൽകാൻ ‘നിർബന്ധിതവേലക്കാരൻ’ സ്വീകരിച്ചു. ഇത് മַס-ന്റെ കോർവേ/നിർബന്ധിതവേലാഭാവം അറിയിക്കുമ്പോൾ ചാറ്റൽ അടിമത്തം ഉറപ്പിക്കുന്നില്ല. ആവർത്തനപരവും മുഖ്യപാഠത്തിൽ ഇതിനകം വ്യക്തവുമായ അക്ഷരാർഥക്കുറിപ്പ് b നീക്കി; യഥാർഥ ലെക്സിക്കൽ-വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വങ്ങൾ a, c എന്നിവയിൽ സംരക്ഷിച്ചു.
