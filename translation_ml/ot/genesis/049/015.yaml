source:
  edition: WLC
  text: וַ/יַּ֤רְא מְנֻחָה֙ כִּ֣י ט֔וֹב וְ/אֶת הָ/אָ֖רֶץ כִּ֣י נָעֵ֑מָה וַ/יֵּ֤ט שִׁכְמ/וֹ֙ לִ/סְבֹּ֔ל וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/015.yaml
  text: He saw that the resting place was good[a], and that the land was pleasant, so he bent his shoulder to bear[c][b], and became a servant for forced labor.
translation:
  language: ml
  text: വിശ്രമസ്ഥലം നല്ലതെന്നും[a] ദേശം മനോഹരമെന്നും അവൻ കണ്ടു; ഭാരം ചുമക്കാൻ അവൻ തന്റെ തോളു കുനിച്ചു, പിന്നെ നിർബന്ധിതവേലക്കാരനായിത്തീർന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശ്രമം നല്ലതെന്നും.’ എബ്രായപദം ‘വിശ്രമം’ എന്നോ ‘വിശ്രമസ്ഥലം’ എന്നോ അർഥമാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘കപ്പം അടയ്ക്കേണ്ട സേവകനായിത്തീർന്നു’ എന്നോ ‘അടിമവേലക്കാരനായിത്തീർന്നു’ എന്നോ. എബ്രായപ്രയോഗം സാധാരണയായി നിർബന്ധിതവേലയെയോ തൊഴിൽനികുതിയെയോ സൂചിപ്പിക്കുന്നു; അതിന്റെ കൃത്യമായ സാമൂഹികസ്വഭാവം വിവാദവിഷയമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: מְנֻחָה
  choice: വിശ്രമസ്ഥലം
  rationale: ഈ പദത്തിന് ‘വിശ്രമം’ എന്നും ‘വിശ്രമസ്ഥലം’ എന്നും അർഥമാകാം. സമാന്തരവാക്യത്തിലെ ‘ദേശം’ എന്ന പരാമർശം കണക്കിലെടുക്കുമ്പോൾ ഇവിടെ സ്ഥലസൂചകമായ അർഥമാണ് കൂടുതൽ യോജിക്കുന്നത്; മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: טוֹב
  choice: നല്ലത്
  rationale: എബ്രായ വിശേഷണത്തിന്റെ ലളിതവും വിശാലവുമായ അനുകൂല അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ഗോത്രാനുഗ്രഹത്തിന്റെ പശ്ചാത്തലത്തിൽ ഇത് ഭൂമി മുഴുവനെയല്ല, അധിവാസപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: נָעֵמָה
  choice: മനോഹരം
  rationale: ദേശത്തിന്റെ ആകർഷകവും സുഖകരവുമായ സ്വഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וַיֵּט שִׁכְמוֹ
  choice: അവൻ തോളു കുനിച്ചു
  rationale: ഒരു ഭാരത്തിന് കീഴടങ്ങുന്ന ശരീരചിത്രം സംരക്ഷിക്കുകയും മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന പ്രയോഗമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לִסְבֹּל
  choice: ഭാരം ചുമക്കാൻ
  rationale: ‘ചുമക്കുക/വഹിക്കുക’ എന്ന അർഥം സന്ദർഭത്തിൽ സൂചിതമായ ഭാരത്തെ വ്യക്തമാക്കിക്കൊണ്ട് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְמַס עֹבֵד
  choice: നിർബന്ധിതവേലയ്ക്കുള്ള ദാസൻ
  rationale: מַס സാധാരണയായി നിർബന്ധിതവേല അഥവാ കോർവേയെ സൂചിപ്പിക്കുകയും עֹבֵד സേവിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. അടിമത്തത്തിന്റെ കൃത്യമായ സാമൂഹികരൂപം അതിരുകടന്ന് നിർണ്ണയിക്കാതെ ഇരുഘടകങ്ങളും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അവസാനവാക്യത്തിൽ യിസ്സാഖാറിന്റെ കീഴടങ്ങലിന്റെ സ്വഭാവം
  choice: നിർബന്ധിതവേലയ്ക്കുള്ള ദാസനായിത്തീർന്നു
  alternative: കപ്പം കൊടുക്കുന്ന ദാസനായിത്തീർന്നു; അടിമവേലക്കാരനായിത്തീർന്നു
  rationale: מַס എന്ന പദം ഇവിടെ നിർബന്ധിത തൊഴിൽസേവനത്തെ ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. എങ്കിലും കപ്പത്തിനോ കൂടുതൽ കടുത്ത അടിമവേലയ്ക്കോ കീഴടങ്ങൽ എന്ന വ്യാഖ്യാനസാധ്യതകൾ ഉള്ളതിനാൽ അവ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. കവിതയിലെ ശരീരചിത്രം സംരക്ഷിച്ചിരിക്കുന്നു; യഥാർഥമായ പദാർഥ-സാമൂഹിക അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ നൽകിയിരിക്കുന്നു.
