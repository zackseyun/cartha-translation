id: GEN.49.3
reference: Genesis 49:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רְאוּבֵן֙ בְּכֹ֣רִ/י אַ֔תָּה כֹּחִ֖/י וְ/רֵאשִׁ֣ית אוֹנִ֑/י יֶ֥תֶר שְׂאֵ֖ת וְ/יֶ֥תֶר עָֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/003.yaml
  text: Reuben[a], you are my firstborn, my strength and the firstfruits of my vigor[b], excelling in honor and excelling in power.
translation:
  language: ml
  text: 'രൂബേനേ, നീ എന്റെ ആദ്യജാതൻ,

    എന്റെ ശക്തിയും എന്റെ വീര്യത്തിന്റെ ആദ്യഫലവും[a];

    മാനത്തിൽ മികവുറ്റവൻ,

    ശക്തിയിൽ മികവുറ്റവൻ[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ ശക്തിയുടെ ആരംഭം.” ഈ എബ്രായപ്രയോഗം പിതാവിന്റെ ജനനശേഷിയുടെ ആദ്യപ്രകടനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “മഹത്വത്തിൽ അതിശ്രേഷ്ഠൻ, ശക്തിയിൽ അതിശ്രേഷ്ഠൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹרִי
  choice: എന്റെ ആദ്യജാതൻ
  rationale: ജനനക്രമത്തോടൊപ്പം ആദ്യജാതപുത്രന്റെ കുടുംബപരവും അവകാശപരവുമായ സ്ഥാനവും സൂചിപ്പിക്കുന്ന പദമാണ് בְּכוֹר. ‘ആദ്യജാതൻ’ ഈ രണ്ട് വശങ്ങളും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: כֹּחִי
  choice: എന്റെ ശക്തി
  rationale: כֹּחַ എന്ന പദത്തിന്റെ സാധാരണ അർഥമായ ‘ശക്തി’ കാവ്യസന്ദർഭത്തിലും പിതാവിന്റെ നേരിട്ടുള്ള അഭിസംബോധനയിലും സ്വാഭാവികമാണ്.
- source_word: רֵאשִׁית אוֹנִי
  choice: എന്റെ വീര്യത്തിന്റെ ആദ്യഫലം
  rationale: പിതാവിന്റെ ജനനശേഷിയുടെ ആദ്യപ്രകടനത്തെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘വീര്യം’ ഓן എന്ന പദത്തിലെ ഊർജവും ജനനശേഷിയുമായ സൂചന നിലനിർത്തുന്നു; ‘ആദ്യഫലം’ രֵאשִׁיתിന്റെ പ്രാഥമികത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יֶתֶר שְׂאֵת
  choice: മാനത്തിൽ മികവുറ്റവൻ
  rationale: יֶתֶר നൽകുന്ന മേന്മയുടെ ആശയവും שְׂאֵת നൽകുന്ന ഉയർച്ച, മാനം എന്നീ ആശയങ്ങളും ഈ വിവർത്തനം വ്യക്തവും സ്വാഭാവികവുമായി ചേർത്തു നൽകുന്നു.
- source_word: יֶתֶר עָז
  choice: ശക്തിയിൽ മികവുറ്റവൻ
  rationale: יֶתֶר എന്ന പദത്തിന്റെ മേന്മയും עָז എന്ന പദത്തിന്റെ ശക്തി/പ്രാബല്യവും നിലനിർത്തുന്നു; മുൻവരിയോടുള്ള എബ്രായ സമാന്തരഘടനയും ആവർത്തനത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: אַתָּה
  choice: നീ
  rationale: എബ്രായത്തിലെ ഊന്നലുള്ള സ്വതന്ത്ര സർവനാമം നേരിട്ടുള്ള അഭിസംബോധനയായി ‘നീ’ എന്നു വ്യക്തമായി നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കാവ്യഭാഷ ഉപയോഗിച്ചു. എബ്രായത്തിലെ സമാന്തരഘടന നിലനിർത്താൻ അവസാന രണ്ടു വരികളിൽ ഒരേ വാക്യരൂപം ആവർത്തിച്ചു. ‘വീര്യം’ എന്നത് ഇവിടെ ശാരീരിക കരുത്തിനൊപ്പം ജനനശേഷിയും സൂചിപ്പിക്കുന്നതിനാൽ, തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് ചേർത്തു.
