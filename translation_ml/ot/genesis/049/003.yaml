  terminology: “ആദ്യജാതൻ” suitably conveys firstborn status, “ശക്തി” and “വീര്യം” distinguish the two Hebrew strength terms, and “മാനത്തിൽ/ശക്തിയിൽ മികവുറ്റവൻ” effectively preserves the parallel comparative force of יתר. No doctrinally loaded terminology has been introduced.
