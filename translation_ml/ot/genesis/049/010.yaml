id: GEN.49.10
reference: Genesis 49:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא יָס֥וּר שֵׁ֨בֶט֙ מִֽ/יהוּדָ֔ה וּ/מְחֹקֵ֖ק מִ/בֵּ֣ין רַגְלָ֑י/ו עַ֚ד כִּֽי יָבֹ֣א שילה וְ/ל֖/וֹ יִקְּהַ֥ת עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/010.yaml
  text: The scepter will not depart from Judah[a], nor the ruler’s staff from between his feet, until Shiloh comes[b]; and to him will be the obedience of the peoples.
translation:
  language: ml
  text: 'ചെങ്കോൽ യെഹൂദയിൽനിന്ന് നീങ്ങിപ്പോകുകയില്ല;

    ഭരണാധികാരിയുടെ ദണ്ഡം അവന്റെ കാലുകൾക്കിടയിൽനിന്ന് മാറുകയുമില്ല,

    ശീലോ വരുന്നതുവരെ;

    ജനതകളുടെ അനുസരണം അവനുള്ളതായിരിക്കും[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അഥവാ, ‘ജനതകൾ അവന്റെ അടുക്കൽ ഒത്തുചേരും,’ അല്ലെങ്കിൽ ‘ജനതകൾ അവനു കീഴടങ്ങും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  choice: ചെങ്കോൽ
  rationale: מְחֹקֵק എന്ന സമാന്തര രാജകീയ പ്രയോഗത്തോടൊപ്പം വരുന്നതിനാൽ, ഗോത്രം എന്ന അർഥത്തേക്കാൾ ഭരണാധികാരത്തിന്റെ ചിഹ്നമായ രാജദണ്ഡമാണ് ഇവിടെ ഉദ്ദേശിക്കപ്പെടുന്നത്.
- source_word: מִיהוּדָה
  choice: യെഹൂദയിൽനിന്ന്
  rationale: മുൻപിലുള്ള מִן വേർപാട് അഥവാ നീങ്ങിപ്പോകുന്ന ഉറവിടം സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘യെഹൂദയിൽനിന്ന്’ എന്നത് നേരിട്ടുള്ള പരിഭാഷയാണ്.
- source_word: מְחֹקֵק
  choice: ഭരണാധികാരിയുടെ ദണ്ഡ്
  rationale: ഈ പദത്തിന് കല്പന പുറപ്പെടുവിക്കുന്നവനെയോ ഭരണത്തിന്റെ ചിഹ്നമായ ദണ്ഡിനെയോ സൂചിപ്പിക്കാം. ‘ചെങ്കോൽ’ എന്നതിനോടുള്ള സമാന്തരതയും ‘കാലുകൾക്കിടയിൽനിന്ന്’ എന്ന പ്രയോഗവും കണക്കിലെടുത്ത് ഭരണദണ്ഡത്തിന്റെ ആശയം നിലനിർത്തുന്നു.
- source_word: מִבֵּין רַגְלָיו
  choice: അവന്റെ കാലുകൾക്കിടയിൽനിന്ന്
  rationale: ഇരുന്നുകൊണ്ടുള്ള ഭരണത്തെയോ സന്തതിയെയോ ഈ ദൃശ്യഭാഷ സൂചിപ്പിച്ചേക്കാം; എന്നാൽ വ്യാഖ്യാനം മുഖ്യവാക്യത്തിൽ ചേർക്കാതെ എബ്രായത്തിലെ മൂർത്തമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: עַד כִּי
  choice: വരുന്നതുവരെ
  rationale: മുൻപ്രസ്താവനയ്ക്ക് ഒരു സമയപരിധി നിർദേശിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: שילה
  choice: ശീലോ
  rationale: ദുർഗ്രഹവും ഏറെ വിവാദവിധേയവുമായ ഈ എബ്രായരൂപത്തെ പരമ്പരാഗതമായി വ്യക്തിനാമമായി വായിക്കുന്നതിനാൽ മുഖ്യവാക്യത്തിൽ ലിപ്യന്തരണം ചെയ്തു; മറ്റു പ്രധാന വായനകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְלוֹ
  choice: അവനോട്
  rationale: മുഖ്യവാക്യത്തിൽ ‘ശീലോ’യെ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പേരായി എടുത്തതിനാൽ സർവനാമവും വ്യക്തിപരമായി പരിഭാഷപ്പെടുത്തി.
- source_word: יִקְּהַת
  choice: അനുസരണം
  rationale: അപൂർവവും അർഥവിവാദമുള്ളതുമായ പദമാണിത്. രാജകീയ പശ്ചാത്തലത്തിൽ ജനതകൾ ഭരണാധികാരിക്ക് വഴങ്ങുന്നതിനെ ‘അനുസരണം’ നന്നായി അറിയിക്കുന്നു; ‘ഒത്തുചേരൽ’, ‘കീഴടങ്ങൽ’ എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: עַמִּים
  choice: ജനതകൾ
  rationale: ബഹുവചനത്തിന്റെ വിശാലമായ ജനവിഭാഗസൂചന നേരിട്ട് നിലനിർത്തുന്നു; ‘രാഷ്ട്രങ്ങൾ’ എന്നതിനെക്കാൾ കുറച്ച് വ്യാഖ്യാനാത്മകമാണ്.
theological_decisions:
- issue: שילה എന്ന പദത്തിന്റെ തിരിച്ചറിയലും ദീർഘകാല മശീഹാപരമായ വ്യാഖ്യാനവും
  choice: മുഖ്യവാക്യത്തിൽ ‘ശീലോ’ എന്ന ലിപ്യന്തരണം നിലനിർത്തി; ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമായി നിർവചിച്ചില്ല.
  alternative: ‘അതിനുള്ള അവകാശം ആർക്കാണോ, അവൻ വരുന്നതുവരെ’; ‘കപ്പം അവനിലേക്കു വരുന്നതുവരെ’; ‘അവൻ ശീലോയിലേക്കു വരുന്നതുവരെ’.
  rationale: ദുർഗ്രഹമായ എബ്രായപാഠത്തെ സിദ്ധാന്തപരമായി തീർപ്പാക്കാതെ അതിന്റെ യഥാർഥ അനിശ്ചിതത്വവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു; അതേസമയം വിശാലമായ കാനോനിക മശീഹാപരമായ വായനയ്ക്ക് ഇടം നൽകുന്നു.
- issue: വാക്യത്തിന്റെ രാജകീയവും മശീഹാപരവുമായ ശക്തി
  choice: ‘ചെങ്കോൽ’, ‘ഭരണാധികാരിയുടെ ദണ്ഡ്’, ‘ജനതകളുടെ അനുസരണം’ എന്നീ രാജകീയ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; മുഖ്യവാക്യത്തിൽ വ്യക്തമായ മശീഹാപരമായ വിശദീകരണം ചേർത്തില്ല.
  alternative: മശീഹാപരമായ അർഥം തുറന്നുപറയുന്ന വ്യാഖ്യാനപരിഭാഷ; അല്ലെങ്കിൽ പൂർണമായും രാഷ്ട്രീയ-വംശപരമായ പരിഭാഷ.
  rationale: എബ്രായകവിത യെഹൂദയുമായി ബന്ധപ്പെടുത്തി വ്യക്തമായ രാജകീയ ദൃശ്യങ്ങൾ ഉപയോഗിക്കുന്നു. ആ ശക്തി നിലനിർത്തിക്കൊണ്ട് പാഠം നേരിട്ട് പറയുന്നതിന് അപ്പുറമുള്ള മതവിഭാഗപരമായ നിർവചനം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ഗോത്രപിതാവിന്റെ കാവ്യാത്മക അനുഗ്രഹത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ സമാന്തരവാക്യഘടന വരിവിഭജനത്തിലൂടെ സൂക്ഷിച്ചു; ദുർഗ്രഹമായ പദങ്ങൾക്ക് അമിതവ്യാഖ്യാനം മുഖ്യവാക്യത്തിൽ ചേർത്തില്ല.
