lexical_decisions:
- source_word: לִישׁוּעָתְךָ
  choice: അങ്ങയുടെ രക്ഷയ്ക്കായി
  rationale: יְשׁוּעָה എന്ന പദത്തിന്റെ വിശാലമായ രക്ഷ/വിടുതൽ അർഥം നിലനിർത്താൻ ‘രക്ഷ’ തിരഞ്ഞെടുത്തു; לְ എന്ന ഉപസർഗത്തിന്റെ പ്രതീക്ഷിത ലക്ഷ്യം ‘-യ്ക്കായി’ വ്യക്തമാക്കുന്നു.
- source_word: קִוִּיתִי
  choice: ഞാൻ കാത്തിരിക്കുന്നു
  rationale: קוה പ്രത്യാശയോടും പ്രതീക്ഷയോടും കൂടിയ കാത്തിരിപ്പിനെ സൂചിപ്പിക്കുന്നു. ഹീബ്രു പൂർണ്ണക്രിയയുടെ കാലസൂചന സന്ദർഭത്തിൽ തുറന്നതിനാൽ, ഈ കാവ്യാത്മക ഉദ്‌ഗാരത്തിൽ തുടരുന്ന പ്രതീക്ഷ സ്വാഭാവികമായി അറിയിക്കാൻ വർത്തമാനരൂപം ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു പദവിയാൽ പകരാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ശബ്ദലിപ്യന്തരണമായി നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
