translation_notes:
  register: ചുരുങ്ങിയ കാവ്യാത്മക ഉദ്‌ഗാരത്തിന്റെ ഗൗരവവും, മൂലത്തിലെ ‘അങ്ങയുടെ രക്ഷയ്ക്കായി’ എന്ന മുൻനിര ഊന്നലും നിലനിർത്തി. ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചെങ്കിലും ഭാഷ സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സൂക്ഷിച്ചു.
