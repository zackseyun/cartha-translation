translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ അപൂർവമായ പദവിനോദം മുഖ്യവാക്യത്തിൽ നിർബന്ധിതമായി അനുകരിക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു; עָקֵב എന്നതിലെ യഥാർഥ ദ്വയാർഥസാധ്യതയും നിലനിർത്തി.
