source:
  edition: WLC
  text: גָּ֖ד גְּד֣וּד יְגוּדֶ֑/נּוּ וְ/ה֖וּא יָגֻ֥ד עָקֵֽב׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/019.yaml
  text: Gad—a raiding band will raid him[b][a], but he will raid at their heels.
translation:
  language: ml
  text: ഗാദ്—ഒരു കൊള്ളസംഘം അവനെ കൊള്ളയടിക്കും[a]; എന്നാൽ അവൻ അവരുടെ പിന്നാലെ കൊള്ളയടിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘ഗാദ്’, ‘കൊള്ളസംഘം’, ‘കൊള്ളയടിക്കുക’ എന്നീ പദങ്ങൾ തമ്മിൽ ശബ്ദകളിയുണ്ട് (ഗാദ് / ഗെദൂദ് / യെഗൂദെന്നൂ / യാഗുദ്).
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘കുതികാലിൽ’ അഥവാ ‘കുതികാലിനു പിന്നാലെ’. ഇത് പിന്നിൽനിന്ന് ആക്രമിക്കുന്നതിനെയോ പിൻവാങ്ങുന്നവരെ പിന്തുടരുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: גָּד
  choice: ഗാദ്
  rationale: യാക്കോബിന്റെ മകനുടെയും ഗോത്രത്തിന്റെയും പേരായതിനാൽ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: גְּדוּד
  choice: ഒരു കൊള്ളസംഘം
  rationale: ഈ നാമം കൊള്ളയടിക്കുന്ന സായുധസംഘത്തെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ഒരേ ധാതുവിൽനിന്നുള്ള ക്രിയകളോടുള്ള എബ്രായ പദവിനോദം മലയാളത്തിൽ പൂർണമായി പുനരാവിഷ്കരിക്കാനാകാത്തതിനാൽ സ്വാഭാവികവും അർത്ഥവ്യക്തവുമായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: יְגוּדֶנּוּ
  choice: അവനെ കൊള്ളയടിക്കും
  rationale: גדד എന്ന ധാതുവിന്റെ ഖാൽ അപൂർണക്രിയയും മൂന്നാംപുരുഷ ഏകവചന കർമപ്രത്യയവുമാണ്; ഈ പശ്ചാത്തലത്തിൽ ശത്രുതാപരമായ കൊള്ളയാക്രമണം എന്ന അർത്ഥം നൽകുന്നു.
- source_word: וְהוּא
  choice: എന്നാൽ അവൻ
  rationale: വാവ് സാധാരണ സംയോജകമായിരിക്കാമെങ്കിലും, ആദ്യം ആക്രമിക്കപ്പെടുന്നതും പിന്നെ തിരിച്ചാക്രമിക്കുന്നതുമായ വൈരുധ്യം ഇവിടെ ‘എന്നാൽ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יָגֻד
  choice: ആക്രമിക്കും
  rationale: മുൻക്രിയയുടേതേ ധാതുവാണ്. ഇവിടെ പിന്നിൽനിന്നുള്ള തിരിച്ചാക്രമണമോ പിന്തുടർന്നുള്ള പ്രഹരമോ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ആക്രമിക്കും’ ഉപയോഗിച്ചു; ധാതുപുനരാവർത്തനം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: עָקֵב
  choice: അവരുടെ കുതികാലിൽ
  rationale: അക്ഷരാർഥം ‘കുതികാൽ’; ശത്രുവിന്റെ പിന്നിൽനിന്ന് പ്രഹരിക്കുക അല്ലെങ്കിൽ പിൻവാങ്ങുന്നവരെ പിന്തുടരുക എന്ന രൂപകാർഥസാധ്യത നിലനിർത്തുന്ന പ്രയോഗം.
