- from: ഗാദിനെ ഒരു കൊള്ളസംഘം കൊള്ളയടിക്കും[a]; എന്നാൽ അവൻ അവരുടെ കുതികാലിൽ ആക്രമിക്കും[b].
  to: ഗാദ്—ഒരു കൊള്ളസംഘം അവനെ കൊള്ളയടിക്കും[a]; എന്നാൽ അവൻ അവരുടെ പിന്നാലെ കൊള്ളയടിക്കും[b].
  rationale: The revision restores Gad as the topic of the oracle, retains the explicit object “him” in the first clause, and uses one Malayalam raiding verb in both clauses to reflect the Hebrew repetition. It renders the final idiom naturally without deciding between rear attack and pursuit; that ambiguity remains explicitly documented in the footnote.
