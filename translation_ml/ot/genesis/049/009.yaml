id: GEN.49.9
reference: Genesis 49:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: גּ֤וּר אַרְיֵה֙ יְהוּדָ֔ה מִ/טֶּ֖רֶף בְּנִ֣/י עָלִ֑יתָ כָּרַ֨ע רָבַ֧ץ כְּ/אַרְיֵ֛ה וּ/כְ/לָבִ֖יא מִ֥י יְקִימֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/009.yaml
  text: Judah is a lion’s cub[a]; from the prey, my son, you have gone up. He crouched, he lay down like a lion[b], and like a lioness—who will rouse him?
translation:
  language: ml
  text: യെഹൂദാ ഒരു സിംഹക്കുട്ടിയാണ്; ഇരയിൽനിന്ന്, എന്റെ മകനേ, നീ കയറിവന്നു. അവൻ സിംഹംപോലെയും സിംഹിയെപ്പോലെയും കുനിഞ്ഞുകിടന്നു—ആർ അവനെ എഴുന്നേൽപ്പിക്കും?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גּוּר אַרְיֵה
  choice: സിംഹക്കുട്ടി
  rationale: യുവസിംഹത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ സംയുക്തപ്രയോഗം സ്വാഭാവികവും ശക്തവുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוּדָה
  choice: യഹൂദാ
  rationale: വ്യക്തിയെയും ഗോത്രത്തെയും സൂചിപ്പിക്കുന്ന പേര് മലയാള ബൈബിൾ ഉപയോഗത്തിന് യോജിച്ചവിധം ലിപ്യന്തരിച്ചു.
- source_word: מִטֶּרֶף
  choice: ഇരയിൽനിന്ന്
  rationale: വേട്ടമൃഗം പിടിച്ചോ കീറിയോ നേടിയ ഇര എന്ന ദൃശ്യത്തെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בְּנִי
  choice: എന്റെ മകനേ
  rationale: യാക്കോബ് യഹൂദായെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതിന്റെ കുടുംബബന്ധവും കാവ്യഭാവവും മലയാളത്തിലെ സംബോധനരൂപത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: עָלִיתָ
  choice: നീ കയറിവന്നു
  rationale: മുകളിലേക്കുള്ള ചലനം നിലനിർത്തുന്നു; ഇര വിട്ട് സുരക്ഷിതസ്ഥാനത്തേക്കു പോയെന്ന പ്രത്യേക വ്യാഖ്യാനം വാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: כָּרַע רָבַץ
  choice: പതുങ്ങി കിടന്നു
  rationale: സിംഹത്തിന്റെ ശരീരം താഴ്ത്തി വിശ്രമിക്കുന്ന ദൃശ്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ആരാധനാപരമായ വണക്കം എന്ന തെറ്റായ സൂചന ഒഴിവാക്കുന്നു.
- source_word: כְּאַרְיֵה
  choice: സിംഹത്തെപ്പോലെ
  rationale: താരതമ്യത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: וּכְלָבִיא
  choice: സിംഹിയെപ്പോലെ
  rationale: לָבִיא എന്ന പദത്തെ മുമ്പത്തെ אַרְיֵה എന്ന പദത്തിൽനിന്ന് വേർതിരിച്ചുകാണിക്കുന്ന സാധ്യമായ അർഥം സ്വീകരിക്കുന്നു; പക്വവും ശക്തവുമായ സിംഹം എന്ന മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מִי יְקִימֶנּוּ
  choice: ആർ അവനെ എഴുന്നേൽപ്പിക്കും?
  rationale: ഹിഫിൽ രൂപത്തിലെ ‘എഴുന്നേൽക്കാൻ ഇടയാക്കുക’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു; ‘ആർ ധൈര്യപ്പെടും’ എന്ന ആശയം വാചകത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യഹൂദായുടെ സിംഹപ്രതീകത്തിന്റെ ഗോത്രപരമോ മശീഹാപരമോ ആയ സൂചന
  choice: മുഖ്യവാചകം യാക്കോബിന്റെ യഹൂദായോടുള്ള അനുഗ്രഹവചനമായി മാത്രം അവതരിപ്പിച്ചു.
  alternative: പിന്നീടുള്ള രാജകീയവും മശീഹാപരവുമായ പ്രത്യാശയുമായി ബന്ധിപ്പിക്കുന്ന പ്രതീകാത്മക വായന.
  rationale: ഈ വാക്യം നേരിട്ട് യഹൂദായെ സിംഹരൂപകത്തിലൂടെ വിശേഷിപ്പിക്കുന്നു. പിന്നീടുള്ള തിരുവെഴുത്തുസംബന്ധങ്ങൾ സാധ്യമെങ്കിലും അവയെ വിവർത്തനത്തിന്റെ മുഖ്യവാചകത്തിൽ ചേർക്കുന്നത് മൂലപാഠം പറയുന്നതിനെക്കാൾ അപ്പുറം പോകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കാവ്യഗദ്യം. സിംഹരൂപകത്തിന്റെ ശക്തിയും ഹീബ്രു വാക്യത്തിലെ വ്യക്തിവചനമാറ്റവും സംരക്ഷിച്ചു. പ്രസിദ്ധീകരണവാചകത്തിൽ ഉപയോഗിക്കുന്ന ഏക അടിക്കുറിപ്പ് സൂചകം [a] മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
