  text: בִּרְכֹ֣ת אָבִ֗י/ךָ גָּֽבְרוּ֙ עַל בִּרְכֹ֣ת הוֹרַ֔/י עַֽד תַּאֲוַ֖ת גִּבְעֹ֣ת עוֹלָ֑ם תִּֽהְיֶ֨ין֙ לְ/רֹ֣אשׁ יוֹסֵ֔ף וּ/לְ/קָדְקֹ֖ד נְזִ֥יר אֶחָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/026.yaml
  text: The blessings of your father have prevailed beyond the blessings of my parents[a], to the utmost bounds of the ancient hills. May they be on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: ml
  text: നിന്റെ പിതാവിന്റെ അനുഗ്രഹങ്ങൾ എന്റെ പൂർവികരുടെ അനുഗ്രഹങ്ങളെക്കാൾ പുരാതന കുന്നുകളുടെ അതിരുകൾവരെ പ്രബലമായിരിക്കുന്നു.[a] അവ യോസേഫിന്റെ തലയിന്മേലും സഹോദരന്മാരിൽനിന്ന് വേർതിരിക്കപ്പെട്ടവന്റെ തലയുടെ നെറുകയിന്മേലും ഇരിക്കട്ടെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിത്യകുന്നുകൾ.” ഹീബ്രുവിലെ ഈ കാവ്യപ്രയോഗത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്; “കുന്നുകളുടെ അഭിലഷണീയത/സമൃദ്ധി” എന്നും വ്യാഖ്യാനിക്കപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “സഹോദരന്മാരുടെ ഇടയിലെ പ്രഭു.” ഹീബ്രുപദത്തിന് “സമർപ്പിക്കപ്പെട്ടവൻ” അല്ലെങ്കിൽ “വേർതിരിക്കപ്പെട്ടവൻ” എന്നും അർഥമുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּרְכֹת אָבִיךָ
  choice: നിന്റെ പിതാവിന്റെ അനുഗ്രഹങ്ങൾ
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയിലെ രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയവും ബഹുവചനമായ ‘അനുഗ്രഹങ്ങൾ’ എന്ന രൂപവും നിലനിർത്തുന്നു.
- source_word: גָּבְרוּ עַל
  choice: എന്റെ മാതാപിതാക്കളുടെ അനുഗ്രഹങ്ങളെക്കാൾ പ്രബലമായി
  rationale: ക്രിയയുടെ ശക്തിയിലും മേന്മയിലും കവിയുക എന്ന താരതമ്യഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הוֹרַי
  choice: എന്റെ മാതാപിതാക്കൾ
  rationale: ‘എന്നെ ജനിപ്പിച്ചവർ’ എന്ന അടിസ്ഥാന അർഥത്തിന് ഏറ്റവും നേരിട്ടും ആധുനികവുമായ തുല്യപദം; എന്നാൽ തുടർന്നുള്ള പദവിഭജനവുമായി ബന്ധപ്പെട്ട പാഠസങ്കീർണത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עַד תַּאֲוַת גִּבְעֹת עוֹלָם
  choice: പുരാതന കുന്നുകളുടെ അതിരറ്റ അറ്റങ്ങളോളം എത്തിയിരിക്കുന്നു
  rationale: ദുഷ്കരമായ കാവ്യപ്രയോഗത്തെ വ്യാപ്തിയുടെ പരമപരിധിയായി അവതരിപ്പിക്കുന്നു; עוֹלָם എന്നത് ഇവിടെ അതിപുരാതനതയെ സൂചിപ്പിക്കുന്നതായി എടുത്തു.
- source_word: תִּהְיֶיןָ
  choice: ഇരിക്കട്ടെ
  rationale: അനുഗ്രഹപ്രഖ്യാപനത്തിലെ ആശംസാത്മകമായ അപൂർണക്രിയാഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְרֹאשׁ ... וּלְקָדְקֹד
  choice: തലയിന്മേലും ... ശിരസ്സിന്റെ നെറുകയിന്മേലും
  rationale: ഹീബ്രു സമാന്തരതയും അനുഗ്രഹം തലയിൽ വസിക്കുന്ന ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: נְזִיר אֶחָיו
  choice: സഹോദരന്മാരിൽനിന്ന് വേർതിരിക്കപ്പെട്ടവൻ
  rationale: സമർപ്പിക്കപ്പെട്ടവൻ/വേർതിരിക്കപ്പെട്ടവൻ എന്ന മുഖ്യ പദാർഥം സംരക്ഷിക്കുന്നു; പിന്നീട് രൂപപ്പെട്ട നാസീർ സ്ഥാപനമോ രാഷ്ട്രീയമായ ‘പ്രഭു’ എന്ന അർഥമോ മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: നְזִיר אֶחָיו എന്ന യോസേഫിന്റെ വിശേഷണം
  choice: സഹോദരന്മാരിൽനിന്ന് വേർതിരിക്കപ്പെട്ടവൻ
  alternative: സഹോദരന്മാരുടെ ഇടയിലെ പ്രഭു; സഹോദരന്മാരുടെ ഇടയിൽ സമർപ്പിക്കപ്പെട്ടവൻ
  rationale: യോസേഫിന്റെ വേറിട്ടതും ശ്രേഷ്ഠവുമായ സ്ഥാനത്തെ സൂചിപ്പിക്കുമ്പോഴും ഔപചാരിക നാസീർവ്രതമോ രാഷ്ട്രീയ പദവിയോ പാഠത്തിൽ ഇറക്കുമതി ചെയ്യാതെ യഥാർഥ വ്യാഖ്യാനസമ്മർദം നിലനിർത്തുന്നു.
