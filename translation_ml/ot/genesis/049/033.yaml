source:
  edition: WLC
  text: וַ/יְכַ֤ל יַעֲקֹב֙ לְ/צַוֺּ֣ת אֶת בָּנָ֔י/ו וַ/יֶּאֱסֹ֥ף רַגְלָ֖י/ו אֶל הַ/מִּטָּ֑ה וַ/יִּגְוַ֖ע וַ/יֵּאָ֥סֶף אֶל עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/033.yaml
  text: When Jacob finished commanding his sons[a], he drew his feet up into the bed, breathed his last[b], and was gathered to his people.
translation:
  language: ml
  text: യാക്കോബ് തന്റെ പുത്രന്മാർക്കു കൽപിച്ചുതീർന്നപ്പോൾ, തന്റെ കാലുകൾ കട്ടിലിന്മേലേക്കു വലിച്ചുകയറ്റി[a]. പിന്നെ അവൻ അന്ത്യശ്വാസം വിട്ടു; തന്റെ ജനത്തോടു ചേർക്കപ്പെടുകയും ചെയ്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘തന്റെ കാലുകൾ കട്ടിലിലേക്കു കൂട്ടിച്ചേർത്തു.’ എബ്രായത്തിൽ ‘കൂട്ടിച്ചേർക്കുക’ എന്ന ക്രിയ ഉപയോഗിച്ചുള്ള ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: ‘തന്റെ ജനത്തോടു ചേർക്കപ്പെട്ടു’ എന്നത് മരണത്തോടും സ്വന്തം ജനത്തോടുള്ള കൂടിച്ചേരലോടും ബന്ധപ്പെട്ട എബ്രായ പ്രയോഗമാണ്; ഇത് അടക്കം ചെയ്യപ്പെട്ടു എന്ന ലളിതമായ പ്രസ്താവനയെക്കാൾ വിപുലമായ അർഥം വഹിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכַל
  choice: തീർന്നപ്പോൾ
  rationale: כלה എന്ന ക്രിയ യാക്കോബ് തന്റെ കല്പനകൾ പൂർത്തിയാക്കിയതിനെ സൂചിപ്പിക്കുന്നു. ‘തീർന്നപ്പോൾ’ തുടർന്നുള്ള സംഭവങ്ങളുമായുള്ള കാലബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לְצַוֹּת
  choice: കല്പിച്ചു
  rationale: צוה എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘കല്പിക്കുക’ നിലനിർത്തുന്നു; ഇവിടെ നൽകുന്ന ഗൗരവമുള്ള അന്തിമനിർദേശങ്ങൾക്കും ഇത് യോജിക്കുന്നു.
- source_word: בָּנָיו
  choice: തന്റെ പുത്രന്മാർ
  rationale: എബ്രായപദം ഇവിടെ യാക്കോബിന്റെ പുത്രന്മാരെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗനിർദ്ദിഷ്ടത നിലനിർത്തുന്നു.
- source_word: וַיֶּאֱסֹף רַגְלָיו אֶל הַמִּטָּה
  choice: കാലുകൾ കട്ടിലിലേക്കു കയറ്റിവെച്ചു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘കാലുകൾ കൂട്ടിച്ചേർത്തു’ എന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി മനസ്സിലാകുന്ന വിധത്തിൽ അവതരിപ്പിക്കുന്നു; മരണശയ്യയിൽ കിടക്കുന്ന യാക്കോബ് കാലുകൾ കട്ടിലിലേക്കു എടുത്തുവെക്കുന്ന ദൃശ്യം നിലനിർത്തുന്നു.
- source_word: הַמִּטָּה
  choice: കട്ടിൽ
  rationale: מִטָּה എന്നത് കട്ടിലിനെയോ ശയനമഞ്ചത്തെയോ സൂചിപ്പിക്കാം; ഈ മരണശയ്യാസന്ദർഭത്തിൽ ‘കട്ടിൽ’ ലളിതവും സ്വാഭാവികവുമാണ്.
- source_word: וַיִּגְוַע
  choice: അന്ത്യശ്വാസം വിട്ടു
  rationale: גוע എന്ന ക്രിയയുടെ ‘ജീവൻ അവസാനിക്കുക/അന്ത്യശ്വാസം വിടുക’ എന്ന പ്രത്യേക ഭാവം നിലനിർത്തുകയും തുടർന്നുള്ള ‘ചേർക്കപ്പെട്ടു’ എന്ന വാക്യഭാഗവുമായി ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: തന്റെ ജനത്തോടു ചേർക്കപ്പെട്ടു
  rationale: മരണത്തോടും സ്വന്തം ജനത്തോടുള്ള കൂടിച്ചേരലോടും ബന്ധപ്പെട്ട എബ്രായ ശൈലി നിലനിർത്തുന്നു. അടക്കം ചെയ്യപ്പെട്ടു എന്നു മാത്രം വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ‘തന്റെ ജനത്തോടു ചേർക്കപ്പെട്ടു’ എന്നതിന്റെ അർഥം
  choice: അടക്കത്തെ മാത്രം സൂചിപ്പിക്കുന്നതായി ചുരുക്കാതെ എബ്രായ ശൈലി നിലനിർത്തി.
  alternative: ‘പൂർവികരോടൊപ്പം അടക്കപ്പെട്ടു’ അല്ലെങ്കിൽ ‘പിതാക്കന്മാരോടു ചേർന്നു’
  rationale: യാക്കോബിന്റെ സംസ്കാരം അടുത്ത അധ്യായത്തിലാണ് നടക്കുന്നത്. അതിനാൽ ഈ പ്രയോഗം അടക്കത്തിന്റെ അറിയിപ്പായി മാത്രം പരിഭാഷപ്പെടുത്തുന്നത് സംഭവക്രമത്തെയും മരണാനന്തര കൂടിച്ചേരലിനെക്കുറിച്ചുള്ള വാചകത്തിന്റെ തുറന്ന അർഥസാധ്യതയെയും ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. മരണവിവരണത്തിന്റെ ഗൗരവവും എബ്രായപ്രയോഗത്തിലെ ഉദ്ദേശ്യപൂർവമായ അർഥതുറന്ന നിലയും സംരക്ഷിച്ചു; അടക്കം, പൂർവികർ, മരണാനന്തരാവസ്ഥ എന്നിവയെക്കുറിച്ച് പാഠം പറയുന്നതിലധികം വ്യക്തമാക്കിയിട്ടില്ല.
