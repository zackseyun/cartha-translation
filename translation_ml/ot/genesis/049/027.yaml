source:
  edition: WLC
  text: בִּנְיָמִין֙ זְאֵ֣ב יִטְרָ֔ף בַּ/בֹּ֖קֶר יֹ֣אכַל עַ֑ד וְ/לָ/עֶ֖רֶב יְחַלֵּ֥ק שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/027.yaml
  text: Benjamin is a ravenous wolf[a]; in the morning he devours the prey[d][c][b], and in the evening he divides the spoil.
translation:
  language: ml
  text: ബെന്യാമീൻ കടിച്ചുകീറുന്ന ചെന്നായാണ്[a]; രാവിലെ അവൻ ഇരയെ തിന്നും[b], വൈകുന്നേരം കൊള്ളമുതൽ വീതിക്കും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇരയെ കടിച്ചുകീറുന്ന ചെന്നായാണ്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രായ ക്രിയ ഇരയെ കീറുന്നതിനെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ഇര” എന്നു പരിഭാഷപ്പെടുത്തിയ ഹീബ്രായ പദത്തിന് “കൊള്ള” അല്ലെങ്കിൽ “കൊള്ളമുതൽ” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: “കൊള്ളമുതൽ” എന്നത് “കൊള്ള” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְיָמִין
  choice: ബെന്യാമീൻ
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: זְאֵב
  choice: ചെന്നായ
  rationale: ഈ നാമം നേരിട്ട് ചെന്നായയെ സൂചിപ്പിക്കുന്നു; ഇരപിടിക്കുന്ന സ്വഭാവം പിന്നാലെയുള്ള ക്രിയ പ്രകടമാക്കുന്നു.
- source_word: יִטְרָף
  choice: കടിച്ചുകീറുന്ന
  rationale: טרף എന്ന ധാതുവിന്റെ ഇരയെ കീറുന്ന ശക്തമായ ദൃശ്യം സ്വാഭാവികമായ മലയാളത്തിൽ പകർത്തുന്നു; ഹീബ്രായത്തിൽ വ്യക്തമല്ലാത്ത കർമം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: בַּבֹּקֶר
  choice: രാവിലെ
  rationale: കാലസൂചക പ്രയോഗത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാള തുല്യം.
- source_word: יֹאכַל
  choice: തിന്നുന്നു
  rationale: സാധാരണയായി ‘തിന്നുക’ എന്നർഥമുള്ള ക്രിയയെ ചെന്നായയുടെ ദൃശ്യത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘വിഴുങ്ങുന്നു’ പോലുള്ള ശക്തീകരണം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: עַד
  choice: ഇരയെ
  rationale: ആദ്യപാദത്തിലെ ചെന്നായയുടെ രൂപകത്തോടൊപ്പം ഇവിടെ ‘ഇര’ ഏറ്റവും സ്വാഭാവികമാണ്; എങ്കിലും ‘കൊള്ള/കൊള്ളമുതൽ’ എന്ന വിശാല അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְלָעֶרֶב
  choice: വൈകുന്നേരം
  rationale: ‘രാവിലെ’ എന്നതിനോടുള്ള കാവ്യസമാന്തര്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יְחַלֵּק
  choice: വീതിക്കുന്നു
  rationale: ഹീബ്രായ പീയേൽ ക്രിയയിലെ വിഭജിച്ച് പങ്കുവെക്കുന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: שָׁלָל
  choice: കൊള്ളമുതൽ
  rationale: യുദ്ധത്തിലോ ആക്രമണത്തിലോ പിടിച്ചെടുത്ത വസ്തുക്കളെ സൂചിപ്പിക്കുന്ന പദത്തിന് വ്യക്തമായ ആധുനിക മലയാള തുല്യം.
theological_decisions:
- issue: ബെന്യാമീനെക്കുറിച്ചുള്ള യാക്കോബിന്റെ അനുഗ്രഹവചനത്തിലെ രൂപകത്തിന്റെ വ്യാപ്തി
  choice: ഇരപിടിക്കുന്ന ശക്തിയും നേടിയ കൊള്ള പങ്കിടുന്നതും ചിത്രീകരിക്കുന്ന കാവ്യരൂപകമായി പരിഭാഷപ്പെടുത്തി; പ്രത്യേകമായ പിൽക്കാല ചരിത്രസംഭവവുമായി ബന്ധിപ്പിച്ചില്ല.
  alternative: ബെന്യാമീൻ ഗോത്രത്തിന്റെ യുദ്ധസ്വഭാവത്തെക്കുറിച്ചുള്ള പ്രത്യേക ചരിത്രപ്രവചനമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഹീബ്രായ വാക്യം ഒരു ചരിത്രനിവൃത്തി പേരെടുത്ത് പറയുന്നില്ല. അതിനാൽ പരിഭാഷ രൂപകത്തിന്റെ ശക്തി നിലനിർത്തുകയും അതിന്റെ ചരിത്രപരമോ പൊതുവായതോ ആയ വ്യാഖ്യാനം വായനക്കാരനു തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കാവ്യഗദ്യം. ‘രാവിലെ—വൈകുന്നേരം’ എന്ന സമാന്തരഘടനയും ചെന്നായയിൽനിന്ന് കൊള്ളമുതൽ പങ്കിടുന്നതിലേക്കുള്ള രൂപകമാറ്റവും നിലനിർത്തി. അനാവശ്യമായ ചരിത്രമോ വിഭാഗീയ വ്യാഖ്യാനമോ ചേർത്തിട്ടില്ല.
