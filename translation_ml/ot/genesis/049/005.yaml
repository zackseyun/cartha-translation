  text: שִׁמְע֥וֹן וְ/לֵוִ֖י אַחִ֑ים כְּלֵ֥י חָמָ֖ס מְכֵרֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/005.yaml
  text: Simeon and Levi are brothers[a]; weapons of violence are their swords.
translation:
  language: ml
  text: ശിമെയോനും ലേവിയും സഹോദരന്മാരാണ്; അവരുടെ ഉപകരണങ്ങൾ അക്രമത്തിന്റെ ആയുധങ്ങളാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “ഉപകരണങ്ങൾ” എന്നു വിവർത്തനം ചെയ്ത എബ്രായപദം അപൂർവവും അർഥം അനിശ്ചിതവുമാണ്. അതിനെ “വാളുകൾ” എന്നും വിവർത്തനം ചെയ്യാം; ചില പഴയ പരിഭാഷകളിൽ “വാസസ്ഥലങ്ങൾ” എന്നുമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוֹן
  choice: ശിമെയോൻ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: וְלֵוִי
  choice: ലേവിയും
  rationale: സംയോജകഘടകത്തോടുകൂടിയ വ്യക്തിനാമം സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ നൽകി.
- source_word: אַחִים
  choice: സഹോദരന്മാർ
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘സഹോദരന്മാർ’ നിലനിർത്തുന്നു; എബ്രായത്തിലെ ക്രിയാരഹിത വാക്യം മലയാളത്തിലും സ്വാഭാവികമായി അവതരിപ്പിക്കാം.
- source_word: כְּלֵי
  choice: ആയുധങ്ങൾ
  rationale: ഈ പദത്തിന് ഉപകരണങ്ങൾ, സാമഗ്രികൾ, ആയുധങ്ങൾ തുടങ്ങിയ വിശാല അർഥങ്ങളുണ്ടെങ്കിലും חָמָס എന്ന ‘അക്രമം’ സൂചിപ്പിക്കുന്ന പദത്തോടുള്ള ബന്ധത്തിൽ ‘ആയുധങ്ങൾ’ സന്ദർഭോചിതമാണ്.
- source_word: חָמָס
  choice: അക്രമം
  rationale: ശാരീരിക അതിക്രമവും അന്യായമായ ദ്രോഹവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളപദം.
- source_word: מְכֵרֹתֵיהֶם
  choice: അവരുടെ വാളുകൾ
  rationale: അത്യപൂർവവും അർഥം അനിശ്ചിതവുമായ പദമാണിത്. കാവ്യസന്ദർഭത്തിൽ അക്രമത്തിനുള്ള ആയുധങ്ങളെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കി വായനാസൗകര്യത്തിനായി ‘വാളുകൾ’ എന്നു നൽകി; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
