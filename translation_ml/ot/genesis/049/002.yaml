base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/002.yaml
  text: Gather yourselves and listen[a], sons of Jacob; listen to Israel your father.
translation:
  language: ml
  text: ഒന്നിച്ചുകൂടി കേൾക്കുവിൻ[a], യാക്കോബിന്റെ പുത്രന്മാരേ; നിങ്ങളുടെ പിതാവായ ഇസ്രായേലിനെ കേൾക്കുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരുമിച്ചുകൂടി കേൾക്കുവിൻ, യാക്കോബിന്റെ പുത്രന്മാരേ; നിങ്ങളുടെ പിതാവായ ഇസ്രായേലിനെ കേൾക്കുവിൻ.” ഹീബ്രു മൂലത്തിൽ ഊന്നലിനായി ‘കേൾക്കുക’ എന്ന ആജ്ഞ ആവർത്തിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקָּבְצוּ
  choice: ഒന്നിച്ചുകൂടി
  rationale: നിഫാൽ ബഹുവചന ആജ്ഞാരൂപം പുത്രന്മാർ സ്വയം ഒരുമിച്ചുകൂടണമെന്ന ആഹ്വാനം നൽകുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ആ അർഥം അറിയിക്കുന്നു.
- source_word: שִׁמְעוּ
  choice: കേൾക്കുവിൻ
  rationale: വെറും ശബ്ദഗ്രഹണമല്ല, ശ്രദ്ധയോടെ കേൾക്കണമെന്ന ആജ്ഞയാണ് സന്ദർഭത്തിൽ; dignified plural imperative ആയി ‘കേൾക്കുവിൻ’ തെരഞ്ഞെടുത്തു.
- source_word: בְּנֵי יַעֲקֹב
  choice: യാക്കോബിന്റെ പുത്രന്മാരേ
  rationale: ഹീബ്രു വ്യക്തമായി പുരുഷബഹുവചനമാണ്; ഇവിടെ അനുഗ്രഹത്തിനായി കൂടിയ യാക്കോബിന്റെ ആൺമക്കളെയാണ് അഭിസംബോധന ചെയ്യുന്നത്.
- source_word: שִׁמְעוּ אֶל
  choice: വാക്കു കേൾക്കുവിൻ
  rationale: אֶל സഹിതമുള്ള ആവർത്തിച്ച ആജ്ഞ സംസാരിക്കുന്നവനെ ശ്രദ്ധിച്ചു കേൾക്കണമെന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ ലക്ഷ്യവ്യക്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘വാക്കു’ ചേർത്തു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: യാക്കോബിന്റെ മറ്റൊരു പേരെന്ന നിലയിൽ ലിപ്യന്തരണം നിലനിർത്തി; ‘യാക്കോബ്/ഇസ്രായേൽ’ എന്ന കാവ്യാത്മക സമാന്തരത സംരക്ഷിക്കുന്നു.
- source_word: אֲבִיכֶם
  choice: നിങ്ങളുടെ പിതാവായ
  rationale: ഇസ്രായേൽ ആരാണെന്ന് സമാനാധികരണമായി വ്യക്തമാക്കുന്ന ഉടമസ്ഥബന്ധം സ്വാഭാവിക മലയാളക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: യാക്കോബ് / ഇസ്രായേൽ എന്ന സമാന്തര നാമങ്ങൾ
  choice: ‘യാക്കോബിന്റെ പുത്രന്മാരേ ... നിങ്ങളുടെ പിതാവായ ഇസ്രായേൽ’ എന്നു രണ്ടു പേരുകളും വേർതിരിച്ചു നിലനിർത്തി.
  alternative: വായന സുഗമമാക്കാൻ രണ്ടിടത്തും ഒരേ പേര് ഉപയോഗിക്കുക.
  rationale: മൂലപാഠം കാവ്യാത്മക ഊന്നലോടെയും ഉടമ്പടിസംബന്ധമായ അനുരണനത്തോടെയും രണ്ടു പേരും മനഃപൂർവം ഉപയോഗിക്കുന്നു; അവയെ ഏകീകരിക്കുന്നത് ആ സവിശേഷത ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കേൾക്കുവിൻ’ എന്ന ബഹുവചന ആജ്ഞാരൂപം കവിതാപരമായ പിതൃപ്രസംഗത്തിന് യോജിച്ച മാന്യത നിലനിർത്തുന്നു; ആവർത്തനം മൂലപാഠത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
