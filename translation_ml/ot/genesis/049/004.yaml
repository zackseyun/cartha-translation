id: GEN.49.4
reference: Genesis 49:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: פַּ֤חַז כַּ/מַּ֨יִם֙ אַל תּוֹתַ֔ר כִּ֥י עָלִ֖יתָ מִשְׁכְּבֵ֣י אָבִ֑י/ךָ אָ֥ז חִלַּ֖לְתָּ יְצוּעִ֥/י עָלָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/004.yaml
  text: Unstable as water[a], you shall not excel, because you went up to your father’s bed; then you defiled it—he went up to my couch.
translation:
  language: ml
  text: വെള്ളംപോലെ അസ്ഥിരനായ നീ മേന്മ പുലർത്തുകയില്ല; കാരണം നീ നിന്റെ അപ്പന്റെ കിടക്കയിൽ കയറി. അപ്പോൾ നീ എന്റെ ശയ്യയെ അശുദ്ധമാക്കി—അവൻ എന്റെ ശയ്യയിൽ കയറി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സുഗമമായി: “അപ്പോൾ നീ എന്റെ ശയ്യയിൽ കയറി അതിനെ അശുദ്ധമാക്കി.” അവസാന ഘടകത്തിൽ ഹീബ്രു പെട്ടെന്ന് മൂന്നാംപുരുഷത്തിലേക്ക് മാറി, “അവൻ കയറി” എന്നു പറയുന്നു; ഇത് രൂബേനെക്കുറിച്ചുള്ള വികാരഭരിതമായ ആവർത്തനമായിരിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: פַּחַז
  choice: അസ്ഥിരനായ
  rationale: ഈ പദം അസ്ഥിരത, എടുത്തുചാട്ടം, നിയന്ത്രണമില്ലാത്ത ആവേശം എന്നിവ സൂചിപ്പിക്കുന്നു. വെള്ളത്തോടുള്ള ഉപമയിൽ ‘അസ്ഥിരനായ’ എന്നത് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: כַּמַּיִם
  choice: വെള്ളംപോലെ
  rationale: നിയന്ത്രിക്കപ്പെടാതെ ഒഴുകുകയും പരക്കുകയും ചെയ്യുന്ന വെള്ളത്തിന്റെ സ്വഭാവത്തോടുള്ള നേരിട്ടുള്ള ഉപമ നിലനിർത്തുന്നു.
- source_word: אַל תּוֹתַר
  choice: മേന്മ പുലർത്തുകയില്ല
  rationale: ആദ്യജാതനെന്ന നിലയിലെ പ്രാമുഖ്യവും ശ്രേഷ്ഠതയും നഷ്ടപ്പെടുന്നതാണ് ഇവിടെ ഉദ്ദേശ്യം. പ്രവചനാത്മകമായ നിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כִּי עָלִיתָ
  choice: കാരണം നീ ... കയറി
  rationale: כִּיയുടെ കാരണാർഥവും עלהയുടെ ‘കയറുക’ എന്ന ലൈംഗിക സൂചനയുള്ള യൂഫെമിസ്റ്റിക് പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: מִשְׁכְּבֵי אָבִיךָ
  choice: നിന്റെ അപ്പന്റെ കിടക്കയിൽ
  rationale: ഹീബ്രുവിലെ ബഹുവചനരൂപം കിടക്ക/ശയനസ്ഥലം എന്ന ആശയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഏകവചനം സ്വാഭാവികമാണ്.
- source_word: אָז
  choice: അന്ന്
  rationale: സംഭവിച്ച സമയത്തെയും അതിന്റെ ഫലത്തെയും സംക്ഷിപ്തമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: חִלַּלְתָּ
  choice: അശുദ്ധമാക്കി
  rationale: ലൈംഗികവും കുടുംബപരവുമായ സന്ദർഭത്തിൽ അപവിത്രമാക്കുക/മലിനമാക്കുക എന്ന ധാർമ്മിക ഗൗരവം വ്യക്തമായി നൽകുന്നു.
- source_word: יְצוּעִי
  choice: എന്റെ ശയ്യയിൽ
  rationale: ഒന്നാംപുരുഷ ഉടമസ്ഥത നിലനിർത്തുകയും ‘കിടക്ക’ എന്ന പദത്തിന്റെ യാന്ത്രിക ആവർത്തനം ഒഴിവാക്കുകയും ചെയ്യുന്ന ഗൗരവമുള്ള സ്വാഭാവിക പദം.
- source_word: עָלָה
  choice: അവൻ ... കയറി
  rationale: മസോററ്റിക് പാഠത്തിലെ മൂന്നാംപുരുഷ ഏകവചനത്തിലേക്കുള്ള പെട്ടെന്നുള്ള മാറ്റം അതേപടി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: രൂബേന്റെ ലൈംഗിക കുറ്റത്തെ സൂചിപ്പിക്കുന്ന യൂഫെമിസവും ധാർമ്മിക വിലയിരുത്തലും
  choice: ‘നിന്റെ അപ്പന്റെ കിടക്കയിൽ കയറി’ എന്ന യൂഫെമിസ്റ്റിക് ഭാഷയും ‘അശുദ്ധമാക്കി’ എന്ന വിലയിരുത്തലും നിലനിർത്തി.
  alternative: ‘നിന്റെ അപ്പന്റെ വെപ്പാട്ടിയോടൊപ്പം ശയിച്ചു’ എന്ന് കൂടുതൽ വിശദമായി പറയുക; അല്ലെങ്കിൽ ‘അപവിത്രമാക്കി’ എന്ന ആരാധനാസംബന്ധിയായ പദം ഉപയോഗിക്കുക.
  rationale: ഹീബ്രു പാഠം കുറ്റം മനസ്സിലാകുന്ന വിധം യൂഫെമിസ്റ്റിക് ഭാഷയാണ് ഉപയോഗിക്കുന്നത്. ഉല്പത്തി 35:22-ലെ വിശദാംശം ഈ വാക്യത്തിലേക്ക് ചേർക്കാതെ അതിന്റെ ഭാഷാശൈലി സംരക്ഷിച്ചു.
- issue: അവസാന ഘടകത്തിലെ עָלָה എന്ന മൂന്നാംപുരുഷരൂപത്തിന്റെ അവ്യക്തത
  choice: പ്രധാനപാഠത്തിൽ ‘അവൻ എന്റെ ശയ്യയിൽ കയറി’ എന്നു നൽകി മസോററ്റിക് മൂന്നാംപുരുഷരൂപം നിലനിർത്തി.
  alternative: ‘നീ എന്റെ ശയ്യയിൽ കയറി’ അല്ലെങ്കിൽ ‘അന്ന് നീ എന്റെ ശയ്യയിൽ കയറി അതിനെ അശുദ്ധമാക്കി’ എന്ന് സുഗമമാക്കുക.
  rationale: ഹീബ്രുവിൽ ഇവിടെ പെട്ടെന്നുള്ള മൂന്നാംപുരുഷമാറ്റമുണ്ട്. അത് രൂബേനെക്കുറിച്ചുള്ള വികാരഭരിതമായ ആവർത്തനമായിരിക്കാം; എന്നാൽ അവ്യക്തത നിശ്ശബ്ദമായി പരിഹരിക്കാതെ പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുകയും സുഗമമായ വായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘അപ്പൻ’ സ്വാഭാവിക കുടുംബസംബോധനയായി സ്വീകരിച്ചു; ‘ശയ്യ’ അവസാനഘടകത്തിന്റെ ഔന്നത്യവും പദവൈവിധ്യവും നിലനിർത്തുന്നു. ഹീബ്രുവിലെ പെട്ടെന്നുള്ള പുരുഷമാറ്റം മിനുക്കിക്കളയാതെ സംരക്ഷിച്ചു.
