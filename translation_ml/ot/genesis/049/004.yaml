  source_fidelity: 'പ്രധാന ആശയം കൃത്യമാണ്: പַּחַז, ‘വെള്ളംപോലെ,’ മേന്മ നഷ്ടപ്പെടുമെന്ന പ്രഖ്യാപനം, പിതാവിന്റെ ശയ്യയിലേക്കു കയറിയെന്ന യൂഫെമിസം, അവസാനത്തിലെ മൂന്നാംപുരുഷത്തിലേക്കുള്ള പെട്ടെന്നുള്ള മാറ്റം എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ ‘അന്ന് നീ അതിനെ അശുദ്ധമാക്കി’ എന്നതിലെ ‘അതിനെ’ മുൻവാക്യത്തിലെ ‘നിന്റെ അപ്പന്റെ കിടക്ക’യിലേക്കാണു സ്വാഭാവികമായി ചൂണ്ടുന്നത്; ഹീബ്രുവിൽ חִלַּלְתָּയുടെ കർമം ‘എന്റെ ശയ്യ’യാണ്. അതിനാൽ ഒന്നാംപുരുഷ ഉടമസ്ഥത പ്രധാനപാഠത്തിൽ വ്യക്തമായി വേണം.'
  naturalness: ‘വെള്ളംപോലെ അസ്ഥിരനായ നീ’യും ‘മേന്മ പുലർത്തുകയില്ല’യും ആധുനിക ഗൗരവമുള്ള മലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘എന്റെ ശയ്യയെ അശുദ്ധമാക്കി’ എന്നു വ്യക്തമാക്കുന്നത് വാക്യബന്ധം മെച്ചപ്പെടുത്തും. അവസാനവാക്യത്തിലെ അപ്രതീക്ഷിത ‘അവൻ’ നിലനിർത്തുന്നത് മനഃപൂർവമായ ഹീബ്രു വിച്ഛേദത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
