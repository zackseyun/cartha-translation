translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വായിക്കാൻ എളുപ്പമുള്ളതും ഗൗരവമുള്ളതുമായ ശൈലി. കുടുംബാംഗങ്ങളുടെ പട്ടികയിലെ ആവർത്തനം മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ചുരുക്കിയെങ്കിലും മൂലത്തിലെ ബന്ധങ്ങൾ കൃത്യമായി നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ആഖ്യാനബന്ധം ഉൾക്കൊള്ളുന്ന വാക്യാവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
