  yaml_path: translation/ot/genesis/008/018.yaml
  text: So Noah went out[b][a], and his sons and his wife and his sons’ wives with him.
translation:
  language: ml
  text: അങ്ങനെ നോഹയും അവന്റെ പുത്രന്മാരും അവന്റെ ഭാര്യയും പുത്രന്മാരുടെ ഭാര്യമാരും അവനോടുകൂടെ പുറത്തുവന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അപ്പോൾ നോഹയും അവന്റെ പുത്രന്മാരും അവന്റെ ഭാര്യയും പുത്രന്മാരുടെ ഭാര്യമാരും അവനോടുകൂടെ പുറത്തുവന്നു’ എന്നും, ‘നോഹയും അവന്റെ പുത്രന്മാരും അവന്റെ ഭാര്യയും പുത്രന്മാരുടെ ഭാര്യമാരും അവനോടുകൂടെ പുറത്തുവന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ആഖ്യാനരൂപം ലളിതമായ വിവിധ ബന്ധകങ്ങളാൽ മലയാളത്തിൽ അവതരിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: അങ്ങനെ ... പുറത്തുവന്നു
  rationale: വാവ്-തുടർച്ചാഖ്യാനരൂപം മുൻകല്പനയ്ക്കു പിന്നാലെയുള്ള സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു. മലയാളത്തിൽ ‘അങ്ങനെ’ ഈ ഫലബന്ധം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; יָצָא എന്ന ക്രിയയ്ക്ക് സന്ദർഭത്തിൽ ‘പുറത്തുവന്നു’ യോജിക്കുന്നു.
- source_word: נֹחַ
  choice: നോഹ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: וּבָנָיו
  choice: അവന്റെ പുത്രന്മാരും
  rationale: בָּנִים ഇവിടെ പൊതുവായ ‘മക്കൾ’ എന്നതിലുപരി ആൺമക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പുത്രന്മാർ’ അത് കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וְאִשְׁתּוֹ
  choice: ഭാര്യയും
  rationale: മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയം നോഹയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ഏകോപിത പട്ടികയിൽ ‘അവന്റെ’ ആവർത്തിക്കാതെ ‘ഭാര്യയും’ എന്നു പറയുന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וּנְשֵׁי בָנָיו
  choice: പുത്രന്മാരുടെ ഭാര്യമാരും
  rationale: എബ്രായത്തിലെ ‘അവന്റെ പുത്രന്മാരുടെ ഭാര്യമാർ’ എന്ന ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; ‘മരുമക്കൾ’ എന്നതിനെക്കാൾ മൂലപദഘടനയോട് അടുത്തതാണ്.
- source_word: אִתּוֹ
  choice: അവനോടൊപ്പം
  rationale: മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ പൂർവപ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
