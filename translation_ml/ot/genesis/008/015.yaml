source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר אֱלֹהִ֖ים אֶל נֹ֥חַ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/015.yaml
  text: Then God spoke to Noah, saying,
translation:
  language: ml
  text: 'അപ്പോൾ ദൈവം നോഹയോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... സംസാരിച്ചു
  rationale: വാവ്-തുടർച്ചാരൂപം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സംഭവക്രമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു, ‘സംസാരിച്ചു’ എന്നത് דבר എന്ന ക്രിയയുടെ അർഥം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഈ സന്ദർഭത്തിൽ ഈ പദം ഏകസത്യദൈവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക തത്തുല്യം ‘ദൈവം’ ആണ്.
- source_word: אֶל
  choice: നോഹയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל മലയാളത്തിൽ ‘-ഓടു’ എന്ന വിഭക്തിയിലൂടെ സ്വാഭാവികമായും കൃത്യമായും നൽകുന്നു.
- source_word: נֹחַ
  choice: നോഹ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: לֵאמֹר
  choice: തുടർന്നുള്ള ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദു
  rationale: എബ്രായത്തിലെ ‘പറഞ്ഞുകൊണ്ട്/ഇപ്രകാരം പറഞ്ഞ്’ എന്ന ഉദ്ധരണി-പരിചയപ്പെടുത്തൽ മലയാളത്തിൽ പലപ്പോഴും ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു; അനാവശ്യമായ ആവർത്തനം ഇതിലൂടെ ഒഴിവാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ സംഭവക്രമവും ‘സംസാരിച്ചു’ എന്ന ക്രിയയുടെ ഭാവവും നിലനിർത്തി; לֵאמֹר എന്ന സൂത്രപ്രയോഗം മലയാളത്തിലെ സ്വാഭാവിക ഉദ്ധരണി-രീതിക്കനുസരിച്ച് ദ്വിബിന്ദുവായി നൽകി.
