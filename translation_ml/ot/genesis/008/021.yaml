id: GEN.8.21
reference: Genesis 8:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֣רַח יְהוָה֮ אֶת רֵ֣יחַ הַ/נִּיחֹחַ֒ וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל לִבּ֗/וֹ לֹֽא אֹ֠סִף לְ/קַלֵּ֨ל ע֤וֹד אֶת הָֽ/אֲדָמָה֙ בַּ/עֲב֣וּר הָֽ/אָדָ֔ם כִּ֠י יֵ֣צֶר לֵ֧ב הָ/אָדָ֛ם רַ֖ע מִ/נְּעֻרָ֑י/ו וְ/לֹֽא אֹסִ֥ף ע֛וֹד לְ/הַכּ֥וֹת אֶת כָּל חַ֖י כַּֽ/אֲשֶׁ֥ר עָשִֽׂיתִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/021.yaml
  text: And the LORD smelled the pleasing aroma, and the LORD said to himself, “I will never again curse the ground because of man, for the intention of man’s heart is evil from his youth. And I will never again strike down every living thing as I have done.”
translation:
  language: ml
  text: 'യഹോവ ആ പ്രസാദകരമായ സൗരഭ്യം മണത്തു. യഹോവ തന്റെ ഹൃദയത്തിൽ പറഞ്ഞു: “മനുഷ്യൻ നിമിത്തം ഇനി ഒരിക്കലും ഞാൻ ഭൂമിയെ ശപിക്കുകയില്ല; മനുഷ്യന്റെ ഹൃദയത്തിലെ പ്രവണത ചെറുപ്പംമുതൽ ദോഷമുള്ളതാണ്. ഞാൻ ചെയ്തതുപോലെ സകല ജീവികളെയും ഇനി ഒരിക്കലും സംഹരിക്കുകയുമില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോണിനെ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: רֵיחַ הַנִּיחֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യം
  rationale: ‘ശാന്തിപ്പിക്കുന്ന/സ്വീകാര്യമായ ഗന്ധം’ എന്ന ആശയം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; ദൈവത്തെ പ്രസാദിപ്പിക്കുന്ന യാഗസൗരഭ്യമാണ് സന്ദർഭം.
- source_word: אֶל־לִבּוֹ
  choice: തന്റെ ഹൃദയത്തിൽ
  rationale: ഹീബ്രു രൂപകത്തെ നിലനിർത്തുന്നു; ഇത് ഉള്ളിലെ ആലോചനയെയോ സ്വയം പറഞ്ഞതിനെയോ സൂചിപ്പിക്കാം.
- source_word: יֵצֶר לֵב הָאָדָם
  choice: മനുഷ്യന്റെ ഹൃദയത്തിലെ പ്രവണത
  rationale: יֵצֶר എന്നതിലെ രൂപപ്പെടുത്തപ്പെട്ട ചായ്‌വ്, ഉദ്ദേശം, ഭാവന എന്നീ അർത്ഥസാധ്യതകളെ അതിയായി ചുരുക്കാതെ ‘പ്രവണത’ എന്നു നൽകുന്നു.
- source_word: מִנְּעֻרָיו
  choice: ബാല്യംമുതൽ
  rationale: യൗവനം/ചെറുപ്പം മുതൽ എന്ന കാലസൂചന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לְהַכּוֹת אֶת־כָּל־חַי
  choice: സകല ജീവികളെയും സംഹരിക്കുക
  rationale: പ്രളയസന്ദർഭത്തിൽ ‘അടിക്കുക’ എന്ന അക്ഷരാർഥത്തേക്കാൾ മരണത്തിലാക്കുക/നശിപ്പിക്കുക എന്ന ഫലം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: മനുഷ്യന്റെ ദുഷ്ടതയും ഭൂമിയെ ഇനി ശപിക്കാതിരിക്കാനുള്ള ദൈവനിശ്ചയവും തമ്മിലുള്ള ‘כי’ ബന്ധം
  choice: ‘നിമിത്തം ...; ... ദോഷമുള്ളതാണ്’ എന്നിങ്ങനെ വാക്യത്തിന്റെ സംഘർഷം നിലനിർത്തി
  alternative: ‘എങ്കിലും’ പോലുള്ള വിശദീകരണബന്ധം ചേർത്ത് ദുഷ്ടതയ്ക്കിടയിലും ദൈവം കരുണ കാണിക്കുന്നു എന്നു തുറന്നുപറയുക
  rationale: כי കാരണമോ വിശദീകരണമോ നൽകാം; ഇവിടെ ദുഷ്ടത തന്നെ മുമ്പത്തെ ന്യായവിധിയുടെ കാരണമായിരുന്നിട്ടും ഇനി ശപിക്കില്ലെന്ന നിശ്ചയത്തോടുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം മൂലത്തിൽ നിലനിൽക്കുന്നു. അതിനെ വ്യാഖ്യാനിച്ച് പരിഹരിച്ചിട്ടില്ല.
- issue: ദൈവം ‘ഹൃദയത്തിൽ പറഞ്ഞു’ എന്ന മനുഷ്യസദൃശ ഭാഷ
  choice: രൂപകം അതേപടി നിലനിർത്തി
  alternative: ‘സ്വയം പറഞ്ഞു’
  rationale: മൂലപാഠത്തിന്റെ വ്യക്തമായ ഹൃദയഭാഷ സംരക്ഷിക്കുകയും ദൈവത്തിന്റെ ആന്തരിക നിശ്ചയത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- issue: ‘ഇനി ഒരിക്കലും’ എന്ന ആവർത്തിത ദൈവപ്രതിജ്ഞ
  choice: രണ്ടു വാക്യഭാഗങ്ങളിലും ആവർത്തിച്ചു
  alternative: ഒറ്റ സംയുക്തപ്രസ്താവനയായി ചുരുക്കുക
  rationale: לֹא אֹסִף עוֹד എന്ന മൂലത്തിലെ ഇരട്ട ആവർത്തനവും ഊന്നലും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രു വാക്യഘടനയുടെ പ്രധാന ആവർത്തനങ്ങളും രൂപകങ്ങളും നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ പദാനുപദഭാഷ ഒഴിവാക്കി.
