revisions:
- from: എന്നാൽ പ്രാവിന് തന്റെ ഉള്ളങ്കാൽ ചവിട്ടിവിശ്രമിക്കാൻ ഒരിടവും കണ്ടെത്താനായില്ല. ഭൂമിയുടെ ഉപരിതലമെല്ലാം വെള്ളമായിരുന്നതിനാൽ അത് പെട്ടകത്തിലേക്കു അവന്റെ അടുക്കൽ മടങ്ങിവന്നു. അപ്പോൾ അവൻ കൈ നീട്ടി അതിനെ പിടിച്ച് തന്റെ അടുക്കൽ പെട്ടകത്തിനുള്ളിലേക്കു കൊണ്ടുവന്നു.
  to: എന്നാൽ പ്രാവിന് തന്റെ കാലിന്റെ ഉള്ളങ്കാലിന് വിശ്രമിക്കാനുള്ള ഒരിടവും കണ്ടെത്താനായില്ല; ഭൂമിയുടെ മുഴുവൻ ഉപരിതലത്തിലും വെള്ളമുണ്ടായിരുന്നതിനാൽ അത് അവന്റെ അടുക്കലേക്കു, പെട്ടകത്തിലേക്കു മടങ്ങിവന്നു. അപ്പോൾ അവൻ കൈ നീട്ടി അതിനെ എടുത്ത് തന്റെ അടുക്കലേക്കു പെട്ടകത്തിനുള്ളിലേക്കു കൊണ്ടുവന്നു.
  rationale: The revision removes the added ‘treading’ action, represents the Hebrew locative image of waters on the earth’s surface more directly, and uses a neutral equivalent for ‘took.’ Both ‘to him’ and ‘to/into the ark’ are retained in each relevant clause, though their juxtaposition remains necessarily compact in Malayalam.
