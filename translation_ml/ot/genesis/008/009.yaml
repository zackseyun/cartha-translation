source:
  edition: WLC
  text: וְ/לֹֽא מָצְאָה֩ הַ/יּוֹנָ֨ה מָנ֜וֹחַ לְ/כַף רַגְלָ֗/הּ וַ/תָּ֤שָׁב אֵלָי/ו֙ אֶל הַ/תֵּבָ֔ה כִּי מַ֖יִם עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַ/יִּשְׁלַ֤ח יָד/וֹ֙ וַ/יִּקָּחֶ֔/הָ וַ/יָּבֵ֥א אֹתָ֛/הּ אֵלָ֖י/ו אֶל הַ/תֵּבָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/009.yaml
  text: But the dove found no resting place for the sole of her foot[a], so she returned to him, to the ark, because the waters were on the surface of all the earth[d][c][b]. Then he stretched out his hand and took her and brought her to himself into the ark.
translation:
  language: ml
  text: എന്നാൽ പ്രാവിന് തന്റെ കാലിന്റെ ഉള്ളങ്കാലിന് വിശ്രമിക്കാനുള്ള ഒരിടവും കണ്ടെത്താനായില്ല; ഭൂമിയുടെ മുഴുവൻ ഉപരിതലത്തിലും വെള്ളമുണ്ടായിരുന്നതിനാൽ അത് അവന്റെ അടുക്കലേക്കു, പെട്ടകത്തിലേക്കു മടങ്ങിവന്നു. അപ്പോൾ അവൻ കൈ നീട്ടി അതിനെ എടുത്ത് തന്റെ അടുക്കലേക്കു പെട്ടകത്തിനുള്ളിലേക്കു കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצְאָה
  choice: കണ്ടെത്താനായില്ല
  rationale: מצא എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘കണ്ടെത്തുക’ നിലനിർത്തുന്നു; നിഷേധത്തോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
- source_word: מָנוֹחַ לְכַף רַגְלָהּ
  choice: തന്റെ ഉള്ളങ്കാൽ ചവിട്ടിവിശ്രമിക്കാൻ ഒരിടം
  rationale: מָנוֹחַ എന്നതിലെ വിശ്രമസ്ഥലവും כַּף־רֶגֶל എന്നതിലെ കാലിന്റെ ഉള്ളങ്കാൽ എന്ന ദൃശ്യവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ചു നിലനിർത്തുന്നു.
- source_word: וַתָּשָׁב אֵלָיו אֶל־הַתֵּבָה
  choice: പെട്ടകത്തിലേക്കു അവന്റെ അടുക്കൽ മടങ്ങിവന്നു
  rationale: ‘അവന്റെ അടുക്കൽ’, ‘പെട്ടകത്തിലേക്ക്’ എന്നീ രണ്ടു ദിശാസൂചനകളും ഒഴിവാക്കാതെ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מַיִם עַל־פְּנֵי כָל־הָאָרֶץ
  choice: ഭൂമിയുടെ ഉപരിതലമെല്ലാം വെള്ളമായിരുന്നു
  rationale: פְּנֵי എന്ന ‘മുഖം/ഉപരിതലം’ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട് വാക്യം സ്വാഭാവികമാക്കുന്നു; ‘മൂടിയിരുന്നു’ എന്ന വ്യാഖ്യാനാത്മക ക്രിയ ചേർക്കുന്നില്ല.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: അവൻ കൈ നീട്ടി
  rationale: കൈയോടൊപ്പം שׁלח ഉപയോഗിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
- source_word: וַיִּקָּחֶהָ
  choice: അതിനെ പിടിച്ച്
  rationale: לקח എന്ന ‘എടുക്കുക/പിടിക്കുക’ എന്ന അർഥം, പ്രാവിനെ കൈകൊണ്ട് സ്വീകരിക്കുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו אֶל־הַתֵּבָה
  choice: അതിനെ തന്റെ അടുക്കൽ പെട്ടകത്തിനുള്ളിലേക്കു കൊണ്ടുവന്നു
  rationale: ‘തന്റെ അടുക്കൽ’ എന്നും ‘പെട്ടകത്തിനുള്ളിലേക്ക്’ എന്നും ഉള്ള രണ്ടു ഹീബ്രു ഘടകങ്ങളും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പ്രാവിനെ സൂചിപ്പിക്കാൻ സ്വാഭാവികമായ നപുംസകലിംഗ സർവനാമമായ ‘അത്’ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ശരീരാവയവ ദൃശ്യം ‘ഉള്ളങ്കാൽ’ എന്നതിലൂടെ നിലനിർത്തി; അനാവശ്യമായ സഭാപാരമ്പര്യ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
