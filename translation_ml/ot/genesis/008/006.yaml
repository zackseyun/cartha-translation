  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. വַיְהִי എന്ന ഹീബ്രു സൂത്രവാക്യത്തെ മുഖ്യവാചകത്തിൽ പദാനുപദമായി ആവർത്തിക്കാതെ സ്വാഭാവിക കാലവാക്യമായി നൽകിയിട്ടുണ്ട്; അതിന്റെ കൂടുതൽ ഔപചാരിക രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
