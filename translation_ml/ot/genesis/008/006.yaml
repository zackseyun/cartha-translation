  yaml_path: translation/ot/genesis/008/006.yaml
  text: At the end of forty days[b][a], Noah opened the window of the ark that he had made.
translation:
  language: ml
  text: നാല്പതു ദിവസം കഴിഞ്ഞപ്പോൾ[a], നോഹ താൻ ഉണ്ടാക്കിയ പെട്ടകത്തിന്റെ ജനൽ തുറന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നാല്പതു ദിവസത്തിന്റെ അവസാനത്തിൽ.” מִקֵּץ എന്ന ഹീബ്രു പ്രയോഗം ഇവിടെ “അവസാനത്തിൽ” എന്നും, കാലപ്രയോഗത്തിൽ കൂടുതൽ സ്വാഭാവികമായി “കഴിഞ്ഞപ്പോൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ പദാനുപദസമീപമായി: “അങ്ങനെ സംഭവിച്ചു: നാല്പതു ദിവസത്തിന്റെ അവസാനത്തിൽ നോഹ താൻ ഉണ്ടാക്കിയ പെട്ടകത്തിന്റെ ജനൽ തുറന്നു.”'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי
  choice: കഴിഞ്ഞപ്പോൾ
  rationale: ഹീബ്രു ആഖ്യാനസൂത്രത്തെ മലയാളത്തിൽ ഭാരമില്ലാതെ കാലസൂചക ഉപവാക്യത്തിൽ ഉൾപ്പെടുത്തി, തുടർന്നുള്ള സംഭവക്രമം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: מִקֵּץ
  choice: കഴിഞ്ഞപ്പോൾ
  rationale: ഒരു നിശ്ചിത കാലയളവ് പൂർത്തിയായ ശേഷമുള്ള സമയബിന്ദുവാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ഇത് സ്വാഭാവികമാണ്, അതേസമയം ‘അവസാനത്തിൽ’ എന്ന പദാനുപദ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אַרְבָּעִים יוֹם
  choice: നാല്പതു ദിവസം
  rationale: സംഖ്യയും കാലനാമവും ചേർന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַיִּפְתַּח
  choice: തുറന്നു
  rationale: פתח എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ സാധാരണ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: חַלּוֹן
  choice: ജനൽ
  rationale: പെട്ടകത്തിലെ തുറക്കാവുന്ന ജാലകത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ മലയാളപദം.
- source_word: הַתֵּבָה
  choice: പെട്ടകം
  rationale: ഉല്പത്തി 6–9-ൽ നോഹയുടെ പ്രത്യേക ജലയാനത്തിന് പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ മലയാളപദം.
- source_word: אֲשֶׁר עָשָׂה
  choice: താൻ ഉണ്ടാക്കിയ
  rationale: ബന്ധവാക്യം പെട്ടകത്തെ വിശേഷിപ്പിക്കുന്നു; ‘താൻ’ കർത്താവായ നോഹയിലേക്കുള്ള സൂചന വ്യക്തമാക്കുകയും നിർമ്മാണം തുറക്കലിന് മുമ്പുണ്ടായതെന്ന് സ്വാഭാവികമായി ബോധ്യപ്പെടുത്തുകയും ചെയ്യുന്നു.
