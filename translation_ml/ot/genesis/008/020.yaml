  terminology: ‘യാഗപീഠം,’ ‘ശുദ്ധിയുള്ള,’ and ‘ദഹനയാഗങ്ങൾ’ are appropriate established terms. ‘യഹോവ’ is a familiar Malayalam rendering of the Tetragrammaton and preserves its status as a personal divine name rather than substituting a title.
