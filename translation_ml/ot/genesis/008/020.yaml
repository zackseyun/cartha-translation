reference: Genesis 8:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּ֥בֶן נֹ֛חַ מִזְבֵּ֖חַ לַֽ/יהוָ֑ה וַ/יִּקַּ֞ח מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה וּ/מִ/כֹּל֙ הָ/ע֣וֹף הַ/טָּהֹ֔ר וַ/יַּ֥עַל עֹלֹ֖ת בַּ/מִּזְבֵּֽחַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/020.yaml
  text: Then Noah built an altar to Yahweh[a], and took some of every clean animal and of every clean bird[b], and offered burnt offerings on the altar.
translation:
  language: ml
  text: അനന്തരം നോഹ യഹോവയ്ക്ക് ഒരു യാഗപീഠം പണിതു. ശുദ്ധിയുള്ള എല്ലാ മൃഗങ്ങളിൽനിന്നും ശുദ്ധിയുള്ള എല്ലാ പക്ഷികളിൽനിന്നും ചിലതിനെ എടുത്ത്[a] യാഗപീഠത്തിന്മേൽ ദഹനയാഗങ്ങളായി അർപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ശുദ്ധിയുള്ള എല്ലാ മൃഗങ്ങളിൽനിന്നും ശുദ്ധിയുള്ള എല്ലാ പക്ഷികളിൽനിന്നും എടുത്തു.”'
    reason: മൂലഹീബ്രുവിലെ מִכֹּל എന്ന ഘടന അക്ഷരാർഥത്തിൽ ‘എല്ലാത്തിൽനിന്നും’ എന്നാണ്; പ്രധാനവാചകം സന്ദർഭസൂചിതമായ ഭാഗിക തിരഞ്ഞെടുപ്പ് വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: പണിതു
  rationale: בנה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘പണിയുക’ എന്നതാണ്; ആഖ്യാനശൈലിയിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: מִזְבֵּחַ
  choice: യാഗപീഠം
  rationale: യാഗം അർപ്പിക്കുന്ന പീഠത്തെ സൂചിപ്പിക്കുന്ന מזבח എന്ന പദത്തിന് നിലവാരമുള്ള, വ്യക്തമായ മലയാളപരിഭാഷ.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ഹീബ്രു പാഠത്തിലുള്ള ദൈവനാമമായ יהוה മറച്ചുവയ്ക്കാതെ മലയാളത്തിൽ പതിവായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി; לְ എന്ന ഉപസർഗത്തിന്റെ ദിശ/സ്വീകർത്തൃഭാവം ‘-യ്ക്ക്’ സംരക്ഷിക്കുന്നു.
- source_word: מִכֹּל הַבְּהֵמָה הַטְּהוֹרָה
  choice: ശുദ്ധിയുള്ള എല്ലാ മൃഗവർഗങ്ങളിൽനിന്നും ചിലതിനെ
  rationale: מִן + כֹּל എന്ന ഘടനയുടെ ഭാഗിക തിരഞ്ഞെടുപ്പ് സൂചിപ്പിക്കുന്ന ബലം സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു; ‘വർഗങ്ങൾ’ ചേർക്കുന്നത് ഓരോ ജീവിയെയും മുഴുവനായി ബലിയർപ്പിച്ചു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: וּמִכֹּל הָעוֹף הַטָּהֹר
  choice: ശുദ്ധിയുള്ള എല്ലാ പക്ഷിവർഗങ്ങളിൽനിന്നും ചിലതിനെ
  rationale: עוֹף ഇവിടെ പക്ഷികളെ സൂചിപ്പിക്കുന്നു; മുൻഘടനയോടുള്ള സമാന്തരതയും ഭാഗിക തിരഞ്ഞെടുപ്പും മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיַּעַל עֹלֹת
  choice: ദഹനയാഗങ്ങളായി അർപ്പിച്ചു
  rationale: עלה എന്ന ഹിഫ്ഇൽ ക്രിയയ്ക്ക് യാഗസന്ദർഭത്തിൽ ‘അർപ്പിക്കുക’ എന്ന ആശയമുണ്ട്; עֹלֹת പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദഹനയാഗങ്ങൾ’ എന്നു നൽകി.
- source_word: בַּמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ സ്ഥലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം പൊതുപദവിയല്ല, ചതുരക്ഷര ദൈവനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ പേര് പേരായിത്തന്നെ നൽകുന്നു; മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപം ‘യഹോവ’ ആണ്.
- issue: ബലിക്കായി എടുത്ത ജീവികളുടെ ഭാഗികത
  choice: എല്ലാ ശുദ്ധമായ മൃഗ-പക്ഷിവർഗങ്ങളിൽനിന്നും ചിലതിനെ
  alternative: എല്ലാ ശുദ്ധമൃഗങ്ങളിൽനിന്നും എല്ലാ ശുദ്ധപക്ഷികളിൽനിന്നും
  rationale: ഹീബ്രു വാചകം അക്ഷരാർഥത്തിൽ ‘എല്ലാത്തിൽനിന്നും എടുത്തു’ എന്നാണ്. സന്ദർഭത്തിൽ ഓരോ ശുദ്ധജീവിയെയും മുഴുവനായി എടുത്തു എന്നതല്ല, ഓരോ വിഭാഗത്തിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പാണ് ഉദ്ദേശ്യം; ഈ ഭാഗികഭാവം പ്രധാനവാചകത്തിൽ വ്യക്തമാക്കിയെങ്കിലും അക്ഷരഘടന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അനന്തരം’, ‘യാഗപീഠം’, ‘ദഹനയാഗം’ എന്നിവ തിരുവെഴുത്തുസന്ദർഭത്തിന് യോജിച്ചെങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങളാണ്. ഇംഗ്ലീഷ് consultation layer-ലെ footnote-marker ക്രമക്കേട് പിന്തുടരാതെ, യഥാർഥ lexical alternative ആയ ഭാഗിക തിരഞ്ഞെടുപ്പിനോടാണ് [a] ചേർത്തത്.
