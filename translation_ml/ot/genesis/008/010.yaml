  text: וַ/יָּ֣חֶל ע֔וֹד שִׁבְעַ֥ת יָמִ֖ים אֲחֵרִ֑ים וַ/יֹּ֛סֶף שַׁלַּ֥ח אֶת הַ/יּוֹנָ֖ה מִן הַ/תֵּבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/010.yaml
  text: Then he waited another seven days[a], and again sent out the dove from the ark.
translation:
  language: ml
  text: പിന്നെ അവൻ മറ്റൊരു ഏഴു ദിവസം കൂടി കാത്തിരുന്നു[a]; വീണ്ടും പെട്ടകത്തിൽനിന്ന് പ്രാവിനെ പുറത്തേക്ക് അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘പിന്നെ അവൻ മറ്റൊരു ഏഴു ദിവസത്തെ കാത്തിരിപ്പ് തുടങ്ങി’; എബ്രായ ക്രിയയ്ക്ക് കൂടുതൽ അക്ഷരാർഥമായി ‘തുടങ്ങി’ എന്നർഥം വരാമെങ്കിലും, ഈ സന്ദർഭത്തിൽ അത് ‘കാത്തിരുന്നു’ എന്ന ആശയത്തിലാണ് പ്രയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחֶל
  choice: കാത്തിരുന്നു
  rationale: ഈ ക്രിയയ്ക്ക് കൂടുതൽ അക്ഷരാർഥമായി ‘തുടങ്ങി’ എന്നു വരാമെങ്കിലും, ‘വേറെ ഏഴു ദിവസം’ എന്ന കാലസൂചനയോടൊപ്പം ഇവിടെ അത് സന്ദർഭാനുസൃതമായി കാത്തിരിപ്പിനെ സൂചിപ്പിക്കുന്നു.
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: വേറെ ഏഴു ദിവസംകൂടി
  rationale: עוֹד എന്നും אֲחֵרִים എന്നും ചേർന്ന് മുമ്പത്തെ കാലയളവിനുപുറമേയുള്ള ഏഴു ദിവസത്തെ ഊന്നിപ്പറയുന്നു; മലയാളത്തിൽ ഈ ആവർത്തനം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: וַיֹּסֶף שַׁלַּח
  choice: വീണ്ടും ... പുറത്തേക്കയച്ചു
  rationale: וַיֹּסֶף എന്നത് ഇവിടെ അതേ പ്രവൃത്തി ആവർത്തിച്ചതിനെ സൂചിപ്പിക്കുന്നു; שַׁלַּח പെട്ടകത്തിൽനിന്ന് പ്രാവിനെ അയച്ചതിന്റെ ദിശാഭാവം നൽകുന്നു.
- source_word: הַיּוֹנָה
  choice: പ്രാവിനെ
  rationale: മുമ്പ് പരിചയപ്പെടുത്തിയ നിർദിഷ്ട പ്രാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സന്ദർഭം നിർദിഷ്ടത വ്യക്തമാക്കുന്നു.
- source_word: מִן הַתֵּבָה
  choice: പെട്ടകത്തിൽനിന്ന്
  rationale: നോഹയുടെ വിവരണത്തിൽ תֵּבָהയ്ക്ക് പതിവും കൃത്യവുമായ മലയാളപദം ‘പെട്ടകം’ ആണ്; מִן ഉറവിടസ്ഥാനം സൂചിപ്പിക്കുന്നു.
