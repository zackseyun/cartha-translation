  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘വേറെ ... ദിവസംകൂടി’ എന്ന പ്രയോഗം അധികമായ കാലയളവെന്ന എബ്രായ ഊന്നൽ നിലനിർത്തുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
