  text: Then he waited another seven days[a], and sent out the dove, and it did not return to him again.
translation:
  language: ml
  text: പിന്നെ അവൻ മറ്റൊരു ഏഴു ദിവസം കാത്തിരുന്നു; പ്രാവിനെ അയച്ചു; അത് വീണ്ടും അവന്റെ അടുക്കലേക്കു തിരിച്ചുവന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അത് ഇനി അവന്റെ അടുക്കലേക്കു തിരിച്ചുവന്നില്ല.” നിഷേധത്തോടുകൂടിയ יָסְפָה + שׁוּב എന്ന ഹീബ്രായ പ്രയോഗം “വീണ്ടും തിരിച്ചുവന്നില്ല” എന്നോ “ഇനി തിരിച്ചുവന്നില്ല” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיָּחֶל
  choice: പിന്നെ അവൻ ... കാത്തിരുന്നു
  rationale: ഇവിടെ יחל എന്ന ക്രിയയ്ക്ക് ‘കാത്തിരിക്കുക’ എന്ന അർഥമാണ് സന്ദർഭോചിതം. തുടക്കത്തിലെ ‘പിന്നെ’ ഹീബ്രായ ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു.
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: വേറെ ഏഴു ദിവസംകൂടി
  rationale: മുമ്പത്തെ കാത്തിരിപ്പിനുശേഷമുള്ള മറ്റൊരു ഏഴുദിവസക്കാലം എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיְשַׁלַּח אֶת־הַיּוֹנָה
  choice: പ്രാവിനെ പുറത്തേക്ക് അയച്ചു
  rationale: שׁלח എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘അയയ്ക്കുക’ നിലനിർത്തുകയും പെട്ടകത്തിൽനിന്ന് പ്രാവിനെ അയച്ച സന്ദർഭം ‘പുറത്തേക്ക്’ എന്നതിലൂടെ സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְלֹא יָסְפָה שׁוּב אֵלָיו עוֹד
  choice: അത് പിന്നെ അവന്റെ അടുക്കലേക്കു തിരിച്ചുവന്നില്ല
  rationale: നിഷേധത്തോടുകൂടിയ יסף + שוב ഘടന ‘വീണ്ടും മടങ്ങിവന്നില്ല’ എന്നും ‘ഇനി മടങ്ങിവന്നില്ല’ എന്നും ഗ്രഹിക്കാവുന്നതാണ്. ‘പിന്നെ ... തിരിച്ചുവന്നില്ല’ എന്ന രൂപം മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ ഈ അർഥവ്യാപ്തി പരമാവധി നിലനിർത്തുന്നു.
