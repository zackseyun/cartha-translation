  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. എബ്രായവാക്യത്തിന്റെ ക്രമവും ഉദ്ദേശ്യബന്ധവും കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ പദാനുപദരൂപങ്ങൾ ഒഴിവാക്കി.
