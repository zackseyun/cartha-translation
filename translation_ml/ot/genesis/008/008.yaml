source:
  edition: WLC
  text: וַ/יְשַׁלַּ֥ח אֶת הַ/יּוֹנָ֖ה מֵ/אִתּ֑/וֹ לִ/רְאוֹת֙ הֲ/קַ֣לּוּ הַ/מַּ֔יִם מֵ/עַ֖ל פְּנֵ֥י הָֽ/אֲדָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/008.yaml
  text: Then he sent out the dove from him to see whether the waters had subsided from the surface of the ground[a][b].
translation:
  language: ml
  text: പിന്നെ, നിലത്തിന്റെ ഉപരിതലത്തിൽനിന്ന് വെള്ളം കുറഞ്ഞോ എന്നു കാണാൻ അവൻ തന്റെ അടുക്കൽനിന്ന് പ്രാവിനെ വിട്ടയച്ചു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശമിച്ചോ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ പ്രളയജലം കുറഞ്ഞതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘നിലത്തിന്റെ മുഖത്തിന്മേൽനിന്ന്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: പിന്നെ ... പുറത്തേക്ക് അയച്ചു
  rationale: വയ്യിഖ്തോൽ രൂപം കഥയിലെ അടുത്ത പ്രവൃത്തി മുന്നോട്ടുകൊണ്ടുപോകുന്നു. സന്ദർഭത്തിൽ പക്ഷിയെ വിട്ടയക്കുന്നതായതിനാൽ ‘പുറത്തേക്ക് അയച്ചു’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הַיּוֹנָה
  choice: പ്രാവിനെ
  rationale: יוֹנָה പ്രാവിനെയോ മാടപ്രാവിനെയോ സൂചിപ്പിക്കാം; പ്രളയവിവരണത്തിൽ പൊതുവായി മനസ്സിലാകുന്ന സ്ഥാപിതമായ മലയാളപദം ‘പ്രാവ്’ ആണ്.
- source_word: מֵאִתּוֹ
  choice: തന്റെ അടുക്കൽനിന്ന്
  rationale: നോഹയുടെ സാന്നിധ്യത്തിൽനിന്നുള്ള നീക്കം എന്ന എബ്രായപ്രയോഗം നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘പെട്ടകത്തിൽനിന്ന്’ എന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: לִרְאוֹת
  choice: കാണാൻ
  rationale: ראה എന്ന ക്രിയയുടെ infinitive ഇവിടെ ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു; ‘കാണാൻ’ അതിന്റെ നേരിട്ടുള്ള സ്വാഭാവികമായ പരിഭാഷയാണ്.
- source_word: הֲקַלּוּ
  choice: കുറഞ്ഞോ
  rationale: קלל എന്ന ക്രിയ ഇവിടെ പ്രളയജലം കുറഞ്ഞതിനെ സൂചിപ്പിക്കുന്നു. ‘കുറഞ്ഞോ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആധുനികവുമാണ്; ‘ശമിച്ചോ’ എന്നതും സാധ്യമാണ്.
- source_word: הַמַּיִם
  choice: വെള്ളം
  rationale: എബ്രായത്തിൽ രൂപപരമായി ബഹുവചനമാണെങ്കിലും, മലയാളത്തിൽ ഈ സന്ദർഭത്തിൽ ‘വെള്ളം’ എന്ന ഏകവചനസമൂഹനാമമാണ് സ്വാഭാവികം.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: ഭൂതലത്തിന്മേൽനിന്ന്
  rationale: ‘നിലത്തിന്റെ മുഖത്തിന്മേൽനിന്ന്’ എന്ന സ്ഥലരൂപകം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി കൈമാറുന്നു; אֲדָמָה ഇവിടെ ഭൂമിയുടെ/നിലത്തിന്റെ ഉപരിതലമാണ്.
