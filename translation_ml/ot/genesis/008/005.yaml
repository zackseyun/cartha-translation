id: GEN.8.5
reference: Genesis 8:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/מַּ֗יִם הָיוּ֙ הָל֣וֹךְ וְ/חָס֔וֹר עַ֖ד הַ/חֹ֣דֶשׁ הָֽ/עֲשִׂירִ֑י בָּֽ/עֲשִׂירִי֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ נִרְא֖וּ רָאשֵׁ֥י הֶֽ/הָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/005.yaml
  text: And the waters continued to recede until the tenth month. In the tenth month[a], on the first day of the month, the tops of the mountains became visible.
translation:
  language: ml
  text: വെള്ളം പത്താം മാസം വരെ തുടർച്ചയായി കുറഞ്ഞുകൊണ്ടിരുന്നു. പത്താം മാസത്തിലെ ഒന്നാം ദിവസം പർവതങ്ങളുടെ മുകൾഭാഗങ്ങൾ കാണപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കാഴ്ചയിൽ വന്നു.’
    reason: നִרְאוּ എന്ന എബ്രായ നിഫാൽ ക്രിയയ്ക്ക് ‘കാണപ്പെട്ടു’ എന്നതിനുപുറമെ ‘കാഴ്ചയിൽ വന്നു’ എന്നും വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: הַמַּיִם
  choice: വെള്ളം
  rationale: എബ്രായത്തിലെ מַיִם രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും മലയാളത്തിൽ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ സമുച്ചയനാമം ‘വെള്ളം’ ആണ്.
- source_word: הָיוּ הָלוֹךְ וְחָסוֹר
  choice: തുടർച്ചയായി കുറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: היה-യോടുകൂടിയ infinitive absolute രൂപങ്ങൾ തുടരുന്ന, ക്രമേണ നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം ആ ദൈർഘ്യവും പുരോഗതിയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַד הַחֹדֶשׁ הָעֲשִׂירִי
  choice: പത്താം മാസംവരെ
  rationale: חֹדֶשׁ ഇവിടെ കഥയിലെ കാലഗണനയനുസരിച്ചുള്ള ‘മാസം’ എന്നാണ്.
- source_word: בָּעֲשִׂירִי בְּאֶחָד לַחֹדֶשׁ
  choice: പത്താം മാസത്തിൽ, ആ മാസത്തിന്റെ ഒന്നാം ദിവസം
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്ത തീയതിപ്രയോഗം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പൂർണരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: נִרְאוּ
  choice: ദൃശ്യമായി
  rationale: ראה എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ ‘കാണപ്പെട്ടു/കാഴ്ചയിൽ വന്നു’ എന്ന അർഥം നൽകുന്നു; പ്രത്യേക നിരീക്ഷകനെ സൂചിപ്പിക്കാതെ മുകൾഭാഗങ്ങൾ കാണാവുന്നതായിത്തീർന്നത് ‘ദൃശ്യമായി’ അറിയിക്കുന്നു.
- source_word: רָאשֵׁי הֶהָרִים
  choice: പർവതങ്ങളുടെ മുകൾഭാഗങ്ങൾ
  rationale: רֹאשׁ അക്ഷരാർഥത്തിൽ ‘തല’ എന്നാണെങ്കിലും ഭൂപ്രകൃതിയിൽ ‘മുകൾഭാഗങ്ങൾ’ സ്വാഭാവികവും എബ്രായ ചിത്രണത്തോട് അടുത്തതുമാണ്; കൂർത്ത കൊടുമുടികൾ മാത്രം എന്ന അനാവശ്യ സൂചന ഒഴിവാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. തീയതി വ്യക്തമായി വികസിപ്പിച്ചിരിക്കുന്നു; വെള്ളം താഴുന്നതിനനുസരിച്ച് പർവതങ്ങളുടെ മുകൾഭാഗങ്ങൾ കാണാവുന്നതായിത്തീർന്ന ആശയം നിലനിർത്തുന്നു.
