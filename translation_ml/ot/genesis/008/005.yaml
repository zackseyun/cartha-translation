- from: വെള്ളം പത്താം മാസംവരെ തുടർച്ചയായി കുറഞ്ഞുകൊണ്ടിരുന്നു. പത്താം മാസത്തിൽ, ആ മാസത്തിന്റെ ഒന്നാം ദിവസം, പർവതങ്ങളുടെ മുകൾഭാഗങ്ങൾ ദൃശ്യമായി.[a]
