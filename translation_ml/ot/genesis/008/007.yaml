  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘പുറത്തേക്കു പോകുകയും മടങ്ങിവരുകയും ചെയ്തുകൊണ്ടിരുന്നു’ എന്ന രൂപം ഉറവിടത്തിലെ ആവർത്തനഭാവം വായനാസൗകര്യത്തോടെ സംരക്ഷിക്കുന്നു.
