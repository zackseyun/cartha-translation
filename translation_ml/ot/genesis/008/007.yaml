source:
  edition: WLC
  text: וַ/יְשַׁלַּ֖ח אֶת הָֽ/עֹרֵ֑ב וַ/יֵּצֵ֤א יָצוֹא֙ וָ/שׁ֔וֹב עַד יְבֹ֥שֶׁת הַ/מַּ֖יִם מֵ/עַ֥ל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/007.yaml
  text: Then he sent out the raven[a], and it went out, going out and returning[b], until the waters had dried up from upon the earth.
translation:
  language: ml
  text: പിന്നെ അവൻ കാക്കയെ പുറത്തേക്ക് അയച്ചു. വെള്ളം ഭൂമിയുടെ മീതെനിന്ന് വറ്റിപ്പോകുന്നതുവരെ അത് പുറത്തേക്കു പോകുകയും മടങ്ങിവരുകയും ചെയ്തുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ ചേർന്ന്: “അത് പുറപ്പെട്ടു, പുറത്തേക്കു പോകുകയും മടങ്ങിവരുകയും ചെയ്തു.” ഹീബ്രു പ്രയോഗം ആവർത്തിച്ചുള്ളതോ തുടർച്ചയായതോ ആയ സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: പിന്നെ അവൻ ... പുറത്തേക്ക് അയച്ചു
  rationale: വയ്യക്ഷരശ്രേണിയിലെ കഥാഗതിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; പക്ഷിയെ അയച്ചുവിടുന്ന പ്രവൃത്തിയും വ്യക്തമാക്കുന്നു.
- source_word: הָעֹרֵב
  choice: കാക്കയെ
  rationale: עֹרֵב എന്ന പക്ഷിനാമത്തിന് സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പദം; നിർദിഷ്ടത സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: וַיֵּצֵא יָצוֹא וָשׁוֹב
  choice: അത് പുറത്തേക്കു പോകുകയും മടങ്ങിവരുകയും ചെയ്തുകൊണ്ടിരുന്നു
  rationale: പരിമിതക്രിയയോടുകൂടിയ ആവർത്തനാത്മക ഹീബ്രു ഘടനയെ നിലനിർത്തി, തുടർച്ചയായോ ആവർത്തിച്ചോ ഉണ്ടായ സഞ്ചാരം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: עַד יְבֹשֶׁת
  choice: വറ്റുന്നതുവരെ
  rationale: עַד സൂചിപ്പിക്കുന്ന കാലപരമായ അന്ത്യബിന്ദുവും יבשׁ എന്നതിന്റെ ഉണങ്ങുക/വറ്റുക എന്ന അർഥവും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: הַמַּיִם
  choice: വെള്ളം
  rationale: מַיִם രൂപത്തിൽ ബഹുവചനസദൃശമാണെങ്കിലും മലയാളത്തിൽ ഈ സന്ദർഭത്തിലെ സ്വാഭാവിക സമുച്ചയനാമം ‘വെള്ളം’ ആണ്.
- source_word: מֵעַל הָאָרֶץ
  choice: ഭൂമിയുടെ മീതെയുള്ള
  rationale: മֵעַל എന്നതിലെ ‘മീതെ/മുകളിൽനിന്ന്’ എന്ന സ്ഥലചിത്രം നിലനിർത്തുന്നു; ‘ഭൂതലത്തിൽനിന്ന്’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കുന്നു.
