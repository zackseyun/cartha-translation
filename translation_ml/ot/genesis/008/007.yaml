  source_fidelity: The main sense is conveyed, including the raven's repeated movement. However, «ഭൂമിയുടെ മീതെയുള്ള വെള്ളം» means water that is above/on the earth, whereas מֵעַל הָאָרֶץ means that the waters dried up/ceased from over the earth. The Malayalam needs to attach the spatial phrase to the drying/withdrawing of the water.
