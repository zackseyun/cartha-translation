id: GEN.8.22
reference: Genesis 8:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עֹ֖ד כָּל יְמֵ֣י הָ/אָ֑רֶץ זֶ֡רַע וְ֠/קָצִיר וְ/קֹ֨ר וָ/חֹ֜ם וְ/קַ֧יִץ וָ/חֹ֛רֶף וְ/י֥וֹם וָ/לַ֖יְלָה לֹ֥א יִשְׁבֹּֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/022.yaml
  text: For as long as the earth endures[a], seedtime and harvest, cold and heat, summer and winter[b], and day and night shall not cease.
translation:
  language: ml
  text: ഭൂമി നിലനിൽക്കുന്ന കാലമത്രയും[a], വിതയ്ക്കുന്ന കാലവും കൊയ്ത്തുകാലവും, തണുപ്പും ചൂടും, വേനലും ശീതകാലവും, പകലും രാത്രിയും നിലച്ചുപോകുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘ഭൂമിയുടെ എല്ലാ നാളുകളിലും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹד כָּל יְמֵי הָאָרֶץ
  choice: ഭൂമി നിലനിൽക്കുന്ന കാലമത്രയും
  rationale: അക്ഷരാർഥത്തിൽ ‘ഭൂമിയുടെ എല്ലാ നാളുകളിലും’; ഭാവിയിലേക്കുള്ള ദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ നൽകുന്നു. ഭൂമി നിലനിൽക്കുന്ന കാലത്തേക്കുള്ള പരിധിയും സംരക്ഷിക്കുന്നു.
- source_word: זֶרַע
  choice: വിതയ്ക്കുന്ന കാലം
  rationale: קָצִיר എന്ന ‘കൊയ്ത്തുകാലം’ എന്നതിനോടു ചേർന്നതിനാൽ വിത്ത് എന്ന വസ്തുവിനേക്കാൾ വിതയ്ക്കുന്ന പ്രവൃത്തിയെയോ കാലത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: קָצִיר
  choice: കൊയ്ത്തുകാലം
  rationale: വിതയ്ക്കുന്ന കാലത്തിന്റെ സ്വാഭാവിക കാർഷിക പ്രതിയുഗ്മം; ആധുനിക മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: קֹר וָחֹם
  choice: തണുപ്പും ചൂടും
  rationale: കാലാവസ്ഥയിലെ വിപരീതാവസ്ഥകളെ നേരിട്ടും സ്വാഭാവികമായും പുനരാവിഷ്കരിക്കുന്നു.
- source_word: קַיִץ וָחֹרֶף
  choice: വേനലും ശീതകാലവും
  rationale: സാധാരണ അർഥങ്ങളായ summer/winter സംരക്ഷിക്കുന്നു; പുരാതന ലെവാന്തിലെ വരണ്ടകാലം/മഴക്കാലം എന്ന കാലാവസ്ഥാപരമായ സൂചന വിവർത്തനത്തിൽ നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- source_word: יוֹם וָלַיְלָה
  choice: പകലും രാത്രിയും
  rationale: തുടരുന്ന സമയചക്രത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: לֹא יִשְׁבֹּתוּ
  choice: നിലച്ചുപോകുകയില്ല
  rationale: שׁבת ഇവിടെ ‘നിർത്തുക, അവസാനിക്കുക’ എന്ന അർഥത്തിലാണ്; പറഞ്ഞിരിക്കുന്ന ആവർത്തനചക്രങ്ങൾ അവസാനിക്കില്ല എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: സൃഷ്ടിയുടെ ക്രമബദ്ധമായ ചക്രങ്ങളെക്കുറിച്ചുള്ള വാഗ്ദാനത്തിന്റെ വ്യാപ്തിയും ദൈർഘ്യവും
  choice: ഭൂമി നിലനിൽക്കുന്ന കാലത്തോളം സാധാരണ ചക്രങ്ങൾ തുടരുമെന്ന് വാക്യം പറയുന്നു.
  alternative: ഈ ചക്രങ്ങൾ യാതൊരു പരിധിയുമില്ലാതെ നിത്യമായി തുടരുമെന്ന അവകാശവാദം.
  rationale: כָּל יְמֵי הָאָרֶץ എന്ന പ്രയോഗം പ്രസ്താവനയെ ‘ഭൂമിയുടെ നാളുകൾ’ എന്ന കാലപരിധിക്കുള്ളിൽ നിർത്തുന്നു; അതിനപ്പുറമുള്ള നിത്യത്തെ വിവർത്തനം അവകാശപ്പെടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഹീബ്രു വാക്യത്തിലെ യുഗ്മങ്ങളുടെ താളം നിലനിർത്തിയിട്ടുണ്ട്; അനാവശ്യ സാങ്കേതികമോ സഭാവിഭാഗപരമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
