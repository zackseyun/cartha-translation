  text: כָּל הַ/חַיָּ֨ה אֲשֶֽׁר אִתְּ/ךָ֜ מִ/כָּל בָּשָׂ֗ר בָּ/ע֧וֹף וּ/בַ/בְּהֵמָ֛ה וּ/בְ/כָל הָ/רֶ֛מֶשׂ הָ/רֹמֵ֥שׂ עַל הָ/אָ֖רֶץ הוצא אִתָּ֑/ךְ וְ/שָֽׁרְצ֣וּ בָ/אָ֔רֶץ וּ/פָר֥וּ וְ/רָב֖וּ עַל הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/017.yaml
  text: Bring out with you every living thing that is with you[a], from all flesh—birds and livestock and every creeping thing that creeps on the earth—so that they may swarm on the earth and be fruitful and multiply on the earth.
translation:
  language: ml
  text: നിന്നോടുകൂടെയുള്ള സകല ജീവികളെയും—സകല ജഡജീവികളിൽനിന്നും പക്ഷികളെയും കന്നുകാലികളെയും ഭൂമിയിൽ ഇഴയുന്ന സകല ഇഴജന്തുക്കളെയും—നിന്നോടൊപ്പം പുറത്തുകൊണ്ടുവരുക. അവ ഭൂമിയിൽ തിങ്ങിപ്പെരുകട്ടെ[a]; സന്താനപുഷ്ടിയുള്ളവരായി ഭൂമിയിൽ വർധിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭൂമിയിൽ കൂട്ടംകൂട്ടമായി നിറയട്ടെ.” എബ്രായ ക്രിയ സമൃദ്ധമായി കൂട്ടംകൂടി പെരുകുക എന്ന ആശയം നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: സകല ജീവികളെയും
  rationale: חַיָּה ഇവിടെ കാട്ടുമൃഗങ്ങളെ മാത്രം സൂചിപ്പിക്കുന്നില്ല; തുടർന്ന് പക്ഷികൾ, കന്നുകാലികൾ, ഇഴജന്തുക്കൾ എന്നിവയെ ഉൾപ്പെടുത്തുന്നതിനാൽ സമഗ്രമായ അർഥം നൽകുന്ന പ്രയോഗമാണിത്.
- source_word: מִכָּל בָּשָׂר
  choice: സകല ജഡജീവികളിൽപ്പെട്ട
  rationale: בָּשָׂר എന്ന ‘ജഡം’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ജീവജാലങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
- source_word: בָּעוֹף
  choice: പക്ഷികളെയും
  rationale: עוֹף പറക്കുന്ന ജീവികളെ വിശാലമായി സൂചിപ്പിക്കാമെങ്കിലും ഈ ജീവിവർഗപ്പട്ടികയിൽ ‘പക്ഷികൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וּבַבְּהֵמָה
  choice: കന്നുകാലികളെയും
  rationale: בְּהֵמָה സാധാരണയായി വലിയ കരമൃഗങ്ങളെയും പ്രത്യേകിച്ച് വളർത്തുമൃഗങ്ങളെയും സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘കന്നുകാലികൾ’ അനുയോജ്യമാണ്.
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: ഭൂമിയിൽ ഇഴയുന്ന സകല ഇഴജന്തുക്കളെയും
  rationale: רֶמֶשׂ/רֹמֵשׂ എന്ന നാമ-ക്രിയ ആവർത്തനം ‘ഇഴജന്തു/ഇഴയുന്ന’ എന്ന ഒരേ പദകുടുംബം ഉപയോഗിച്ച് നിലനിർത്തുന്നു.
- source_word: הוֹצֵא אִתָּךְ
  choice: നിന്നോടൊപ്പം പുറത്തുകൊണ്ടുവരുക
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപത്തിലെ കാരണാർഥം—അവയെ പുറത്തേക്കു വരുത്തുക—വ്യക്തമായി നൽകുന്നു.
- source_word: וְשָׁרְצוּ
  choice: തിങ്ങിപ്പെരുകട്ടെ
  rationale: שׁרץ സൂചിപ്പിക്കുന്ന കൂട്ടമായും സമൃദ്ധമായും നിറഞ്ഞുപെരുകുന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ ശക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וּפָרוּ וְרָבוּ
  choice: സന്താനപുഷ്ടിയുള്ളവയായി ... വർധിക്കട്ടെ
  rationale: ഉല്പത്തി 1-ലെ സൃഷ്ടിയനുഗ്രഹത്തിന്റെ പ്രതിധ്വനി നിലനിർത്തുകയും രണ്ട് ക്രിയകളുടെ സന്താനോത്പാദനവും സംഖ്യാവർധനവും വേർതിരിച്ച് പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: בָאָרֶץ / עַל הָאָרֶץ
  choice: ഭൂമിയിൽ
  rationale: പ്രളയാനന്തര സന്ദർഭത്തിൽ אָרֶץ ഒരു പ്രാദേശിക ദേശത്തേക്കാൾ വിശാലമായ ഭൂമിയെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: പ്രളയാനന്തര സൃഷ്ടിയനുഗ്രഹത്തിന്റെ പ്രതിധ്വനി
  choice: ‘തിങ്ങിപ്പെരുകട്ടെ; സന്താനപുഷ്ടിയുള്ളവയായി ... വർധിക്കട്ടെ’ എന്ന വ്യത്യസ്തവും സമൃദ്ധിവാചകവുമായ പദപ്രയോഗം നിലനിർത്തി.
  alternative: ‘വളരെയധികം വർധിക്കട്ടെ’ എന്ന പൊതുവായ ഒറ്റ പ്രയോഗം ഉപയോഗിക്കുക.
  rationale: ഈ വാക്യം ഉല്പത്തി 1-ലെ പെരുക്കത്തിന്റെയും സന്താനപുഷ്ടിയുടെയും ഭാഷ മനപ്പൂർവം ആവർത്തിക്കുന്നു. വിധിക്കുശേഷമുള്ള സൃഷ്ടിയുടെ പുതുക്കൽ എന്ന സാഹിത്യ-ദൈവശാസ്ത്ര ബന്ധം വ്യാഖ്യാനം കൂട്ടിച്ചേർക്കാതെ ഇതിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ജീവിവർഗപ്പട്ടികയും ‘ഇഴജന്തു/ഇഴയുന്ന’ എന്ന പദപ്രതിധ്വനിയും സൃഷ്ടിയനുഗ്രഹത്തിന്റെ ഭാഷയും പരമാവധി നിലനിർത്തിയിരിക്കുന്നു.
