language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּשֻׁ֧בוּ הַ/מַּ֛יִם מֵ/עַ֥ל הָ/אָ֖רֶץ הָל֣וֹךְ וָ/שׁ֑וֹב וַ/יַּחְסְר֣וּ הַ/מַּ֔יִם מִ/קְצֵ֕ה חֲמִשִּׁ֥ים וּ/מְאַ֖ת יֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/003.yaml
  text: And the waters receded from upon the earth[a], going and returning[b], and the waters diminished at the end of a hundred and fifty days.
translation:
  language: ml
  text: വെള്ളം ഭൂമിയുടെ മുകളിൽനിന്ന് തുടർച്ചയായി പിൻവാങ്ങി[a]; നൂറ്റമ്പത് ദിവസങ്ങളുടെ ഒടുവിൽ വെള്ളം കുറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘പോയിക്കൊണ്ടും മടങ്ങിക്കൊണ്ടും’ എന്നാണ്; വെള്ളം തുടർച്ചയായി, ക്രമേണ പിൻവാങ്ങിയതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: പിൻവാങ്ങിക്കൊണ്ടിരുന്നു
  rationale: שׁוב എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘മടങ്ങുക’ എന്നാണെങ്കിലും, വെള്ളത്തെക്കുറിച്ചും מֵעַל הָאָרֶץ എന്ന സ്ഥാനസൂചനയോടും കൂടിയുള്ള ഈ പ്രയോഗത്തിൽ വെള്ളം ഭൂമിയുടെ മുകളിൽനിന്ന് പിന്മാറുന്നതാണ് ഉദ്ദേശ്യം. മലയാളത്തിൽ ‘പിൻവാങ്ങുക’ ഈ ദൃശ്യവും അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מֵעַל הָאָרֶץ
  choice: ഭൂമിയുടെ മുകളിൽനിന്ന്
  rationale: מֵעַל എന്നത് ഭൂമിയെ മൂടിക്കിടന്ന വെള്ളം അതിന്റെ മുകളിൽനിന്ന് മാറുന്ന സ്ഥാനദൃശ്യം വ്യക്തമാക്കുന്നു.
- source_word: הָלוֹךְ וָשׁוֹב
  choice: ക്രമേണ
  rationale: ‘പോയിക്കൊണ്ടും മടങ്ങിക്കൊണ്ടും’ എന്ന അക്ഷരാർഥമുള്ള ഈ ക്രിയാസംയോജനം ഇവിടെ തുടരുന്നതും പുരോഗമിക്കുന്നതുമായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. ‘ക്രമേണ’ വെള്ളം കുറഞ്ഞുകൊണ്ടിരുന്ന പുരോഗതി സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַיַּחְסְרוּ
  choice: കുറഞ്ഞു
  rationale: חסר വെള്ളത്തിന്റെ അളവ് കുറഞ്ഞതിനെ സൂചിപ്പിക്കുന്നു. മുൻപത്തെ ‘പിൻവാങ്ങുക’ എന്ന ചലനക്രിയയിൽനിന്ന് വ്യത്യസ്തമായ രണ്ടാമത്തെ എബ്രായ ക്രിയയുടെ അർഥം ‘കുറഞ്ഞു’ നിലനിർത്തുന്നു.
- source_word: מִקְצֵה
  choice: ഒടുവിൽ
  rationale: കാലസൂചനയിൽ ഈ പദം ഒരു കാലയളവിന്റെ അവസാനത്തെ അല്ലെങ്കിൽ പൂർത്തീകരണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: നൂറ്റമ്പതു ദിവസം
  rationale: എബ്രായ സംഖ്യാവാചകത്തിന്റെ നേരിട്ടുള്ളതും സാധാരണ മലയാളത്തിലുള്ളതുമായ പരിഭാഷ.
