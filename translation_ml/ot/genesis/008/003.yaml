translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തനാത്മക ക്രിയാസംയോജനം മുഖ്യവാക്യത്തിൽ അക്ഷരാർഥമായി നൽകിയാൽ വെള്ളം അങ്ങോട്ടും ഇങ്ങോട്ടും നീങ്ങിയെന്ന തെറ്റിദ്ധാരണ ഉണ്ടാകാമെന്നതിനാൽ അതിന്റെ പുരോഗമനബലം ‘ക്രമേണ’ എന്നു നൽകി; അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
