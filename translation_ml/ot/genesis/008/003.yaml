  to: വെള്ളം ഭൂമിയുടെ മുകളിൽനിന്ന് തുടർച്ചയായി പിൻവാങ്ങി[a]; നൂറ്റമ്പത് ദിവസങ്ങളുടെ ഒടുവിൽ വെള്ളം കുറഞ്ഞു.
