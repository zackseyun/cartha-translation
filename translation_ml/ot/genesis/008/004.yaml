lexical_decisions:
- source_word: וַתָּנַח
  choice: വന്നുനിന്നു
  rationale: נוּחַ എന്ന ക്രിയയുടെ wayyiqtol രൂപം പെട്ടകം ഒരു സ്ഥലത്ത് എത്തി നിശ്ചലമായി നിലകൊണ്ട സംഭവത്തെ സൂചിപ്പിക്കുന്നു. ‘വന്നുനിന്നു’ എന്നത് അതിന്റെ സംഭവാത്മക അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַתֵּבָה
  choice: പെട്ടകം
  rationale: നോഹയുടെ תֵּבָהയെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ സ്ഥാപിതവും സന്ദർഭോചിതവുമായ പദമാണ് ‘പെട്ടകം’.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: ഏഴാം മാസം
  rationale: മാസത്തോടുകൂടിയ കാലസൂചക ב മലയാളത്തിൽ സ്വാഭാവികമായി ഈ രൂപത്തിൽ പ്രകടിപ്പിക്കാം.
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: ആ മാസത്തിന്റെ പതിനേഴാം ദിവസം
  rationale: എബ്രായ തീയതിപ്രയോഗത്തിന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ആവർത്തനം ഒഴിവാക്കാൻ ‘ആ മാസം’ എന്നു ബന്ധിപ്പിച്ചു.
- source_word: עַל
  choice: മേൽ
  rationale: സ്ഥലസൂചകമായ ഈ ഉപസർഗത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്താൻ ‘മലകളിന്മേൽ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: הָרֵי אֲרָרָט
  choice: അരാരാത്തിലെ മലകൾ
  rationale: הָרֵי ബഹുവചന construct രൂപമായതിനാൽ ഏകവചനമായ ‘അരാരാത്ത് പർവതം’ എന്നതിനു പകരം അരാരാത്ത് പ്രദേശത്തിലെ മലകളെ സൂചിപ്പിക്കുന്ന ബഹുവചനം നിലനിർത്തി.
