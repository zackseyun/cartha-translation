source:
  edition: WLC
  text: וַ/יִּסָּֽכְרוּ֙ מַעְיְנֹ֣ת תְּה֔וֹם וַֽ/אֲרֻבֹּ֖ת הַ/שָּׁמָ֑יִם וַ/יִּכָּלֵ֥א הַ/גֶּ֖שֶׁם מִן הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/002.yaml
  text: The springs of the deep and the windows of the heavens were shut[b][a], and the rain from the heavens was restrained.
translation:
  language: ml
  text: ആഴിയുടെ ഉറവുകളും ആകാശത്തിന്റെ ജാലകങ്ങളും[a] അടയ്ക്കപ്പെട്ടു; ആകാശത്തുനിന്നുള്ള മഴ തടയപ്പെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ആകാശത്തിന്റെ ജലകവാടങ്ങൾ.’ ഹീബ്രു പദം അക്ഷരാർഥത്തിൽ ആകാശത്തിലെ തുറവുകളെയോ ജാലകങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ആകാശത്തുനിന്നുള്ള മഴ നിലച്ചു.’ ഹീബ്രു ക്രിയ മഴ തടഞ്ഞുവെക്കപ്പെട്ടതിനെയും അതിന്റെ ഫലമായി മഴ നിലച്ചതിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּכְרוּ
  choice: അടയ്ക്കപ്പെട്ടു
  rationale: סכר എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള കർമണി അർഥം നിലനിർത്തുന്നു; ‘ഉറവുകൾ’, ‘കിളിവാതിലുകൾ’ എന്നീ രണ്ടു കർത്താക്കളോടും സ്വാഭാവികമായി ചേരുന്നു.
- source_word: מַעְיְנֹת
  choice: ഉറവുകൾ
  rationale: ജലത്തിന്റെ ഉറവിടങ്ങളെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ ആധുനിക മലയാളപദം.
- source_word: תְּהוֹם
  choice: ആഴി
  rationale: ഉല്പത്തി വിവരണത്തിലെ മഹാജലഗർത്തത്തിന്റെ പ്രപഞ്ചസംബന്ധിയായ ഭാവം സംക്ഷിപ്തമായും ഗൗരവത്തോടെയും നിലനിർത്തുന്നു.
- source_word: אֲרֻבֹּת
  choice: കിളിവാതിലുകൾ
  rationale: ആകാശത്തിലെ തുറവുകൾ അഥവാ ജാലകങ്ങൾ എന്ന ഹീബ്രു ദൃശ്യരൂപം നിലനിർത്തുന്നു; ‘ജലകവാടങ്ങൾ’ കൂടുതൽ വ്യാഖ്യാനാത്മകമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: הַשָּׁמַיִם
  choice: ആകാശം
  rationale: ഈ സന്ദർഭത്തിൽ മഴയുടെ മുകളിലുള്ള ഉറവിടത്തെയും അതിലെ തുറവുകളെയും സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; ഹീബ്രുവിലെ ആവർത്തനം രണ്ടിടത്തും നിലനിർത്തിയിരിക്കുന്നു.
- source_word: וַיִּכָּלֵא
  choice: തടഞ്ഞുനിർത്തപ്പെട്ടു
  rationale: മഴ വെറുതെ അവസാനിച്ചു എന്ന ഫലത്തെക്കാൾ, അത് തുടരാതിരിക്കാൻ പിടിച്ചുനിർത്തപ്പെട്ടു എന്ന ക്രിയാന്യൂയം പ്രകടമാക്കുന്നു.
- source_word: הַגֶּשֶׁם
  choice: മഴ
  rationale: സന്ദർഭത്തിന് യോജിച്ച നേരിട്ടുള്ള സാധാരണ മലയാള തത്തുല്യം.
- source_word: מִן הַשָּׁמָיִם
  choice: ആകാശത്തുനിന്നുള്ള
  rationale: ഹീബ്രുവിലെ ഉറവിടസൂചനയും മുമ്പത്തെ ‘ആകാശം’ എന്ന പദത്തിന്റെ ആവർത്തനവും സംരക്ഷിക്കുന്നു.
