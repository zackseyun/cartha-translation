  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ പ്രപഞ്ചദൃശ്യഭാഷ സംരക്ഷിക്കാൻ ‘ആഴി’, ‘ആകാശത്തിന്റെ കിളിവാതിലുകൾ’ എന്നിവ ഉപയോഗിച്ചു; കർമണിപ്രയോഗവും ‘ആകാശം’ എന്ന ആവർത്തനവും നിലനിർത്തി.
