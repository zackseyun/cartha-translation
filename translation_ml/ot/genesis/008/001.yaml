reference: Genesis 8:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּזְכֹּ֤ר אֱלֹהִים֙ אֶת נֹ֔חַ וְ/אֵ֤ת כָּל הַֽ/חַיָּה֙ וְ/אֶת כָּל הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָ֑ה וַ/יַּעֲבֵ֨ר אֱלֹהִ֥ים ר֨וּחַ֙ עַל הָ/אָ֔רֶץ וַ/יָּשֹׁ֖כּוּ הַ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/001.yaml
  text: But God remembered Noah[a], and all the wild animals, and all the livestock that were with him in the ark. And God caused a wind to pass over the earth[b], and the waters subsided.
translation:
  language: ml
  text: എന്നാൽ ദൈവം നോഹയെയും അവനോടൊപ്പം പെട്ടകത്തിലുണ്ടായിരുന്ന എല്ലാ വന്യമൃഗങ്ങളെയും എല്ലാ വളർത്തുമൃഗങ്ങളെയും ഓർത്തു[a]. ദൈവം ഭൂമിയുടെ മീതെ ഒരു കാറ്റു വീശുമാറാക്കി[b]; വെള്ളം താഴ്ന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദൈവം നോഹയെ കരുതി.’ എബ്രായഭാഷയിൽ ‘ഓർത്തു’ എന്നത് പലപ്പോഴും വെറും ഓർമയിലേക്കു വരുന്നതല്ല, വിശ്വസ്തതയോടെ ഒരാൾക്കുവേണ്ടി പ്രവർത്തിക്കുന്നതും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിലെ רוּחַ എന്ന പദത്തിന് ‘കാറ്റ്,’ ‘ശ്വാസം,’ ‘ആത്മാവ്’ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ‘കാറ്റ്’ സന്ദർഭത്തിന് ഏറ്റവും യോജിക്കുന്നു; എങ്കിലും ഉല്പത്തി 1:2-ൽ വെള്ളത്തിന്മീതെയുള്ള ആത്മാവ്/കാറ്റ് എന്ന ചിത്രത്തിന്റെ പ്രതിധ്വനി ചിലർ ഇവിടെ കാണുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: ഓർത്തു
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ മാനുഷികഭാവവും ദൈവത്തിന്റെ വിശ്വസ്തമായ ഇടപെടലിലേക്കുള്ള സൂചനയും നിലനിർത്തുന്നു; വെറും മറന്ന കാര്യം മനസ്സിലേക്കു തിരിച്ചുവന്നു എന്ന അർഥത്തിൽ മാത്രം ഇത് ചുരുക്കുന്നില്ല.
- source_word: כָּל הַחַיָּה
  choice: എല്ലാ വന്യമൃഗങ്ങളെയും
  rationale: തുടർന്നുവരുന്ന בְּהֵמָה എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം കാത്തുകൊണ്ട് חַיָּהയെ ഇവിടെ വന്യമൃഗങ്ങൾ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: כָּל הַבְּהֵמָה
  choice: എല്ലാ വളർത്തുമൃഗങ്ങളെയും
  rationale: חַיָּהയോടു ചേർന്നുള്ള ഈ പദജോടിയിൽ മനുഷ്യർ വളർത്തുന്ന കരമൃഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ആ വ്യത്യാസം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַּתֵּבָה
  choice: പെട്ടകത്തിൽ
  rationale: നോഹയുടെ תֵּבָהയെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾഭാഷയിൽ സ്ഥാപിതവും വായനക്കാർക്ക് വ്യക്തവുമായ പദമാണ് ‘പെട്ടകം’.
- source_word: וַיַּעֲבֵר ... רוּחַ
  choice: ഒരു കാറ്റു വീശുമാറാക്കി
  rationale: רוּחַയുടെ സന്ദർഭോചിതമായ അർഥം ‘കാറ്റ്’ ആണ്. ഹിഫീൽ ക്രിയയിലെ കാരണകർത്തൃഭാവം ‘വീശുമാറാക്കി’ എന്നതിലൂടെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עַל הָאָרֶץ
  choice: ഭൂമിയുടെ മീതെ
  rationale: പ്രളയവിവരണത്തിന്റെ വ്യാപ്തിയിൽ אֶרֶץ എന്നതിന് ‘ഭൂമി’ യോജിക്കുന്നു; עַל എന്നതിന്റെ സ്ഥലബന്ധം ‘മീതെ’ നിലനിർത്തുന്നു.
- source_word: וַיָּשֹׁכּוּ הַמָּיִם
  choice: വെള്ളം താഴ്ന്നു
  rationale: പ്രളയജലം ശമിച്ച് നില താഴുന്നതിനെ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וַ
  choice: എന്നാൽ
  rationale: മുൻവിവരണത്തിലെ ന്യായവിധിയിൽനിന്ന് ദൈവിക ഇടപെടലിലേക്കുള്ള കഥാഗതിമാറ്റം മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; പുതിയ ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘ദൈവം നോഹയെ ഓർത്തു’ എന്ന മാനുഷികഭാവമുള്ള പ്രയോഗം
  choice: ‘ഓർത്തു’ എന്ന എബ്രായ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി
  alternative: ‘നോഹയുടെ കാര്യം ശ്രദ്ധിച്ചു’ അല്ലെങ്കിൽ ‘നോഹയെ കരുതി’
  rationale: മൂലപാഠത്തിന്റെ സാഹിത്യശക്തിയും ദൈവത്തിന്റെ വിശ്വസ്തത പ്രവർത്തനത്തിൽ പ്രകടമാകുന്ന സൂചനയും കാത്തുസൂക്ഷിക്കുന്നു. ദൈവം മുമ്പ് മറന്നിരുന്നു എന്ന നിഗമനം അടിച്ചേൽപ്പിക്കാതെ അടിക്കുറിപ്പിൽ പ്രയോഗത്തിന്റെ വ്യാപ്തി വ്യക്തമാക്കുന്നു.
- issue: רוּחַ എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘കാറ്റ്’
  alternative: ‘ആത്മാവ്’ അല്ലെങ്കിൽ ‘ശ്വാസം’
  rationale: ജലം താഴുന്നതിലേക്കു നയിക്കുന്ന കാലാവസ്ഥാസംബന്ധമായ പ്രവർത്തനമാണ് അടുത്ത സന്ദർഭത്തിൽ ഏറ്റവും സ്വാഭാവികം. എങ്കിലും ഉല്പത്തി 1:2-ലെ സൃഷ്ടിചിത്രവുമായി ഉണ്ടാകാവുന്ന പ്രതിധ്വനി അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പെട്ടകം’ പോലുള്ള പരിചിതമായ ബൈബിൾപദം നിലനിർത്തിയപ്പോൾ, ‘വന്യമൃഗങ്ങൾ/വളർത്തുമൃഗങ്ങൾ’ എന്ന ജോടി മൂലത്തിലെ വിഭാഗവ്യത്യാസം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി കൈമാറുന്നു.
