id: GEN.8.16
reference: Genesis 8:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: צֵ֖א מִן הַ/תֵּבָ֑ה אַתָּ֕ה וְ/אִשְׁתְּ/ךָ֛ וּ/בָנֶ֥י/ךָ וּ/נְשֵֽׁי בָנֶ֖י/ךָ אִתָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/016.yaml
  text: Come out of the ark[a], you and your wife, and your sons and your sons' wives with you.
translation:
  language: ml
  text: നീയും നിന്റെ ഭാര്യയും നിന്റെ പുത്രന്മാരും നിന്റെ പുത്രന്മാരുടെ ഭാര്യമാരും നിന്നോടൊപ്പം പെട്ടകത്തിൽനിന്ന് പുറത്തുവരുക.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֵא
  choice: പുറത്തുവരുക
  rationale: יצא എന്ന ക്രിയയുടെ പുരുഷ ഏകവചന ആജ്ഞാരൂപം. അടഞ്ഞ ഇടമായ പെട്ടകത്തിൽനിന്ന് പുറത്തേക്കു വരാനുള്ള നേരിട്ടുള്ള കല്പനയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִן הַתֵּבָה
  choice: പെട്ടകത്തിൽനിന്ന്
  rationale: מן പുറത്തേക്കുള്ള ചലനത്തിന്റെ ആരംഭസ്ഥാനം സൂചിപ്പിക്കുന്നു; תֵּבָה നോഹ ഉണ്ടായിരുന്ന പെട്ടകമാണ്.
- source_word: אַתָּה
  choice: നീയും
  rationale: ആജ്ഞയ്ക്കുശേഷമുള്ള സ്വതന്ത്ര സർവനാമം നോഹയെ കുടുംബാംഗങ്ങളുടെ പട്ടികയിൽ വ്യക്തമായി ഉൾപ്പെടുത്തുന്നു; മലയാളത്തിലെ ‘നീയും’ ഈ ഘടന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וְאִשְׁתְּךָ
  choice: നിന്റെ ഭാര്യയും
  rationale: ഉടമസ്ഥസന്ദർഭത്തിൽ אִשָּׁה എന്നത് ‘ഭാര്യ’ എന്നാണ്.
- source_word: וּבָנֶיךָ
  choice: നിന്റെ പുത്രന്മാരും
  rationale: בָּנִים ഇവിടെ അവരുടെ ഭാര്യമാരോടു സമാന്തരമായി വ്യക്തമായി ആൺമക്കളെ, അഥവാ പുത്രന്മാരെ, സൂചിപ്പിക്കുന്നു.
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: നിന്റെ പുത്രന്മാരുടെ ഭാര്യമാരും
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥഘടനയായ ‘നിന്റെ പുത്രന്മാരുടെ ഭാര്യമാർ’ മലയാളത്തിൽ സ്വാഭാവികമായും കൃത്യമായും നിലനിർത്തുന്നു; ‘മരുമക്കൾ’ എന്ന ബന്ധപദത്തേക്കാൾ ഉറവിടരൂപത്തോട് അടുത്തതാണ്.
- source_word: אִתָּךְ
  choice: നിന്നോടൊപ്പം
  rationale: കുടുംബാംഗങ്ങൾ നോഹയോടുകൂടെ പുറത്തുവരുന്നതായ സഹഗമനം സൂചിപ്പിക്കുന്നു.
