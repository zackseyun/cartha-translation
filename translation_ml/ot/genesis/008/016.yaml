translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ കുടുംബാംഗങ്ങളുടെ ക്രമവും ആവർത്തനവും സൂക്ഷിച്ചിരിക്കുന്നു; വ്യാഖ്യാനപരമായ ബന്ധപദം ഒഴിവാക്കി.
