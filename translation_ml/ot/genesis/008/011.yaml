  yaml_path: translation/ot/genesis/008/011.yaml
  text: And the dove came to him at evening time[a], and behold, a freshly plucked olive leaf was in her mouth[c][b]. So Noah knew that the waters had subsided from upon the earth.
translation:
  language: ml
  text: സന്ധ്യാസമയത്ത് പ്രാവ് അവന്റെ അടുക്കൽ വന്നു[a]. അതാ, പുതുതായി പറിച്ചെടുത്ത ഒരു ഒലിവില അതിന്റെ കൊക്കിൽ ഉണ്ടായിരുന്നു[b]. അപ്പോൾ ഭൂമിയുടെ മീതെനിന്ന് വെള്ളം കുറഞ്ഞുവെന്ന് നോഹ അറിഞ്ഞു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവന്റെ അടുക്കൽ മടങ്ങിവന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘വന്നു’ എന്നാണെങ്കിലും സന്ദർഭം മടങ്ങിവരവിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘പുതുതായി പറിച്ചെടുത്ത’ എന്നത് പറിച്ചോ കീറിയോ വേർപ്പെടുത്തിയതിനെ സൂചിപ്പിക്കുന്ന ഒരു എബ്രായപദത്തിന്റെ പരിഭാഷയാണ്; ജീവനുള്ള ഒലിവുമരത്തിൽനിന്ന് ഇല അടുത്തിടെ എടുത്തതാണെന്ന സൂചന ഇതിലുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: ‘വെള്ളം ശമിച്ചുവെന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: വന്നു
  rationale: בוא എന്ന ക്രിയയുടെ ലളിതമായ അർഥം ‘വന്നു’ എന്നാണ്; സന്ദർഭം മടങ്ങിവരവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ആ ആശയം ക്രിയയിൽതന്നെ വ്യക്തമല്ല.
- source_word: לְעֵת עֶרֶב
  choice: സന്ധ്യാസമയത്ത്
  rationale: സന്ധ്യ എന്ന സമയസൂചന സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: തുടർന്നുവരുന്ന അപ്രതീക്ഷിത ദൃശ്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּהയുടെ സജീവമായ വ്യവഹാരധർമ്മം നിലനിർത്തുന്നു.
- source_word: עֲלֵה זַיִת
  choice: ഒരു ഒലിവില
  rationale: ‘ഒലിവിന്റെ ഇല’ എന്ന ഘടനയുടെ സ്വാഭാവിക മലയാളസമാനമാണ് ‘ഒലിവില’.
- source_word: טָרָף
  choice: പുതുതായി പറിച്ചെടുത്ത
  rationale: പറിച്ചോ കീറിയോ വേർപ്പെടുത്തിയ ഒന്നെന്ന പദാർഥവും ജീവനുള്ള മരത്തിൽനിന്ന് അപ്പോൾ എടുത്തതാണെന്ന ആഖ്യാനസൂചനയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: בְּפִיהָ
  choice: അതിന്റെ കൊക്കിൽ
  rationale: പക്ഷിയെക്കുറിച്ചുള്ള മലയാളപ്രയോഗത്തിൽ ‘കൊക്കിൽ’ എന്നത് സ്വാഭാവികമാണ്; എബ്രായത്തിലെ സ്ത്രീലിംഗപ്രത്യയത്തെ മലയാളത്തിൽ നിർബന്ധിതമായി ലിംഗവൽക്കരിക്കാതെ ‘അതിന്റെ’ എന്നു നൽകുന്നു.
- source_word: וַיֵּדַע
  choice: അപ്പോൾ ... അറിഞ്ഞു
  rationale: ഇല കണ്ടതിനെ തുടർന്നുള്ള നോഹയുടെ നിഗമനം ആഖ്യാനക്രമത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: קַלּוּ הַמַּיִם
  choice: വെള്ളം കുറഞ്ഞിരിക്കുന്നു
  rationale: קלל ഇവിടെ വെള്ളപ്പൊക്കം കുറഞ്ഞു/ശമിച്ചു എന്ന ആശയം നൽകുന്നു; ‘കുറഞ്ഞിരിക്കുന്നു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מֵעַל הָאָרֶץ
  choice: ഭൂമിയുടെ മുകളിൽനിന്ന്
  rationale: מֵעַל എന്നതിലെ ഉപരിതലത്തിൽനിന്നുള്ള പിൻവാങ്ങൽ എന്ന സ്ഥലബന്ധം സംരക്ഷിക്കുന്നു.
