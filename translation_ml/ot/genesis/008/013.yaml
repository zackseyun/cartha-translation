source:
  edition: WLC
  text: וַֽ֠/יְהִי בְּ/אַחַ֨ת וְ/שֵׁשׁ מֵא֜וֹת שָׁנָ֗ה בָּֽ/רִאשׁוֹן֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ חָֽרְב֥וּ הַ/מַּ֖יִם מֵ/עַ֣ל הָ/אָ֑רֶץ וַ/יָּ֤סַר נֹ֨חַ֙ אֶת מִכְסֵ֣ה הַ/תֵּבָ֔ה וַ/יַּ֕רְא וְ/הִנֵּ֥ה חָֽרְב֖וּ פְּנֵ֥י הָֽ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/013.yaml
  text: And it came about in the six hundred and first year[a], in the first month, on the first day of the month, that the waters had dried up from upon the earth. Then Noah removed the covering of the ark and looked, and behold[c][b], the surface of the ground was dry.
translation:
  language: ml
  text: 'അങ്ങനെ സംഭവിച്ചു: അറുനൂറ്റൊന്നാം വർഷത്തിൽ, ഒന്നാം മാസത്തിലെ ഒന്നാം ദിവസം, ഭൂമിയുടെ മുകളിൽനിന്ന് വെള്ളം വറ്റിപ്പോയിരുന്നു. നോഹ പെട്ടകത്തിന്റെ മൂടി നീക്കി, നോക്കി; അതാ, നിലത്തിന്റെ ഉപരിതലം ഉണങ്ങിയിരുന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּאַחַת וְשֵׁשׁ מֵאוֹת שָׁנָה
  choice: അറുനൂറ്റൊന്നാം വർഷം
  rationale: എബ്രായ സംഖ്യാവിന്യാസം അക്ഷരാർഥത്തിൽ ‘ഒന്നും അറുനൂറും വർഷം’ എന്നാണെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവിക ക്രമസംഖ്യാരൂപം അർഥം കൃത്യമായി നൽകുന്നു. ഇത് ആരുടെ വർഷക്കണക്കാണെന്നത് വാക്യം നേരിട്ട് വ്യക്തമാക്കാത്തതിനാൽ പരിഭാഷയിലും അപ്രകടമായി നിലനിർത്തുന്നു.
- source_word: בָּרִאשׁוֹן בְּאֶחָד לַחֹדֶשׁ
  choice: ഒന്നാം മാസം, ആ മാസത്തിന്റെ ഒന്നാം ദിവസം
  rationale: കലണ്ടർ തീയതി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: חָרְבוּ הַמַּיִם מֵעַל הָאָרֶץ
  choice: ഭൂമിയുടെ മുകളിൽനിന്ന് വെള്ളം വറ്റിപ്പോയിരുന്നു
  rationale: חרב എന്ന ക്രിയയുടെ ‘വറ്റുക’ എന്ന അർഥവും מֵעַל എന്നതിലെ ഉപരിതലബന്ധവും നിലനിർത്തുന്നു; മുൻകാലത്ത് പൂർത്തിയായ അവസ്ഥ മലയാളത്തിലെ ‘വറ്റിപ്പോയിരുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: מִכְסֵה הַתֵּבָה
  choice: പെട്ടകത്തിന്റെ മൂടി
  rationale: מִכְסֵה പൊതുവായി ഒരു മൂടിയെയോ ആവരണത്തെയോ സൂചിപ്പിക്കുന്നു. ‘മേൽക്കൂര’ എന്നു പറഞ്ഞ് പെട്ടകത്തിന്റെ നിർമാണരൂപം അനാവശ്യമായി നിർണയിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: וַיַּרְא וְהִנֵּה
  choice: നോക്കി; അതാ
  rationale: പ്രവർത്തനമായി നോക്കിയതും തുടർന്ന് ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּהയുടെ വിവരണാത്മക ശക്തിയും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חָרְבוּ פְּנֵי הָאֲדָמָה
  choice: നിലത്തിന്റെ ഉപരിതലം ഉണങ്ങിയിരുന്നു
  rationale: פְּנֵי എന്നതിന്റെ ‘ഉപരിതലം’ എന്ന ആശയവും אֲדָמָהയുടെ ‘നിലം’ എന്ന അർഥവും നൽകുന്നു. വെള്ളം ‘വറ്റുന്നതും’ നിലം ‘ഉണങ്ങുന്നതും’ മലയാളത്തിൽ സ്വാഭാവികമായി വേർതിരിക്കുന്നു.
theological_decisions:
- issue: ‘അറുനൂറ്റൊന്നാം വർഷം’ ആരെ അല്ലെങ്കിൽ ഏത് കാലഗണനയെ സൂചിപ്പിക്കുന്നു
  choice: വാക്യത്തിലെ അപ്രകടത നിലനിർത്തി ‘അറുനൂറ്റൊന്നാം വർഷം’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘നോഹയുടെ അറുനൂറ്റൊന്നാം വയസ്സിൽ’
  rationale: സന്ദർഭം നോഹയുടെ പ്രായവർഷത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും, ഈ വാക്യത്തിലെ എബ്രായ പാഠം ‘നോഹയുടെ’ എന്ന് നേരിട്ട് പറയുന്നില്ല. അതിനാൽ സന്ദർഭാധിഷ്ഠിതമായ വിശദീകരണം മുഖ്യപാഠത്തിലേക്ക് ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം ഗൗരവമുള്ള കഥനശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ തുടർച്ചയായ സംഭവവിവരണം മലയാളത്തിൽ അനാവശ്യമായ ‘അങ്ങനെ സംഭവിച്ചു’ എന്ന ഭാരമുള്ള ആരംഭമില്ലാതെ സ്വാഭാവികമായി നൽകി; ‘അതാ’ ഉപയോഗിച്ച് הִנֵּהയുടെ ശ്രദ്ധാകർഷക ഭാവം സംരക്ഷിച്ചു.
