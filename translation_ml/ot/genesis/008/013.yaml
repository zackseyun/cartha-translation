- from: അറുനൂറ്റൊന്നാം വർഷം, ഒന്നാം മാസം, ആ മാസത്തിന്റെ ഒന്നാം ദിവസം, ഭൂമിയുടെ മുകളിൽനിന്ന് വെള്ളം വറ്റിപ്പോയിരുന്നു. നോഹ പെട്ടകത്തിന്റെ മൂടി നീക്കി നോക്കി; അതാ, നിലത്തിന്റെ ഉപരിതലം ഉണങ്ങിയിരുന്നു.
