id: GEN.8.19
reference: Genesis 8:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל הַֽ/חַיָּ֗ה כָּל הָ/רֶ֨מֶשׂ֙ וְ/כָל הָ/ע֔וֹף כֹּ֖ל רוֹמֵ֣שׂ עַל הָ/אָ֑רֶץ לְ/מִשְׁפְּחֹ֣תֵי/הֶ֔ם יָצְא֖וּ מִן הַ/תֵּבָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/019.yaml
  text: Every beast[a], every creeping thing, and every bird—everything that moves on the earth—went out from the ark by their families.
translation:
  language: ml
  text: എല്ലാ മൃഗങ്ങളും ഇഴജന്തുക്കളും പക്ഷികളും—ഭൂമിയിൽ സഞ്ചരിക്കുന്ന സകലവും—അവയുടെ കുടുംബങ്ങൾക്കനുസരിച്ച് പെട്ടകത്തിൽനിന്ന് പുറത്തുവന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: എല്ലാ മൃഗങ്ങളും
  rationale: സന്ദർഭത്തിലെ പട്ടികയിൽ חַיָּה കരയിൽ ജീവിക്കുന്ന മൃഗങ്ങളെ ഇഴജന്തുക്കളിൽനിന്നും പക്ഷികളിൽനിന്നും വേർതിരിക്കുന്നു. കാട്ടുമൃഗങ്ങൾ എന്ന അതിവ്യക്തീകരണം ഒഴിവാക്കി പൊതുവായ വിഭാഗനാമം ഉപയോഗിച്ചു.
- source_word: כָּל הָרֶמֶשׂ
  choice: ഇഴജന്തുക്കളും
  rationale: רֶמֶשׂ നിലത്തോടു ചേർന്ന് ഇഴഞ്ഞോ ചെറുചലനങ്ങളോടെയോ സഞ്ചരിക്കുന്ന ജീവികളുടെ വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികവും പരിചിതവുമായ വർഗനാമമാണിത്.
- source_word: וְכָל הָעוֹף
  choice: പക്ഷികളും
  rationale: עוֹף പറക്കുന്ന ജീവികളെ വിശാലമായി സൂചിപ്പിക്കാമെങ്കിലും ഈ ത്രിവിഭാഗത്തിൽ ‘പക്ഷികൾ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: כֹּל רוֹמֵשׂ עַל הָאָרֶץ
  choice: ഭൂമിയിൽ സഞ്ചരിക്കുന്ന സകലവും
  rationale: רוֹמֵשׂ എന്ന കൃദന്തരൂപം ഭൂമിയിലെ ചലനത്തെ വിശാലമായി സൂചിപ്പിക്കുന്നു. മുമ്പുള്ള ‘ഇഴജന്തുക്കൾ’ എന്ന പദത്തിന്റെ അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കിക്കൊണ്ട് അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: അവയുടെ കുടുംബങ്ങൾക്കനുസരിച്ച്
  rationale: מִשְׁפָּחָה എന്നത് കുടുംബം/വംശവിഭാഗം എന്നാണ്. മൃഗങ്ങൾ തങ്ങളുടെ ബന്ധവിഭാഗങ്ങളായി പുറത്തുവന്നുവെന്ന എബ്രായപ്രയോഗം ‘ഇനങ്ങൾ’ എന്ന വ്യാഖ്യാനപരമായ പദത്തിലേക്ക് ചുരുക്കാതെ സംരക്ഷിച്ചു.
- source_word: יָצְאוּ מִן הַתֵּבָה
  choice: പെട്ടകത്തിൽനിന്ന് പുറത്തുവന്നു
  rationale: יָצְאוּ എന്ന ലളിതമായ പുറപ്പെടൽക്രിയയും നോഹയുടെ വിവരണത്തിൽ תֵּבָהയ്ക്ക് പതിവായ ‘പെട്ടകം’ എന്ന പദവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. എബ്രായത്തിലെ പട്ടികയും ഊന്നൽ നൽകുന്ന സംഗ്രഹവാക്യഭാഗവും ദീർഘവിരാമങ്ങളിലൂടെ നിലനിർത്തി; മൃഗവർഗങ്ങളെക്കുറിച്ച് പാഠത്തിൽ ഇല്ലാത്ത ശാസ്ത്രീയമോ സഭാപാരമ്പര്യപരമോ ആയ നിർവചനങ്ങൾ ചേർത്തിട്ടില്ല.
