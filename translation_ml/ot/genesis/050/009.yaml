  yaml_path: translation/ot/genesis/050/009.yaml
  text: Chariots and horsemen also went up with him[c][b][a], and the company became very large.
translation:
  language: ml
  text: രഥസേനയും കുതിരപ്പടയാളികളും അവനോടൊപ്പം കയറിപ്പോയി; ആ യാത്രാസംഘം വളരെ വലുതായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ആ സംഘം വളരെ ഭാരമുള്ളതായിരുന്നു’; സന്ദർഭത്തിൽ, അത് വളരെ വലുതോ ഗണ്യമോ ആയിരുന്നു എന്നർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: പുറപ്പെട്ടു
  rationale: עלה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കയറിപ്പോകുക’ എന്നാണെങ്കിലും, ഈ യാത്രാവിവരണത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായി സഞ്ചാരം ആരംഭിക്കുകയോ യാത്ര ചെയ്യുകയോ ചെയ്യുന്ന അർഥം ‘പുറപ്പെട്ടു’ വ്യക്തമാക്കുന്നു.
- source_word: עִמּוֹ
  choice: അവനോടൊപ്പം
  rationale: സന്ദർഭത്തിൽ ഈ സർവനാമം യോസേഫിനെ സൂചിപ്പിക്കുന്നു; ഹീബ്രു മുൻപ്രത്യയവും സർവനാമപ്രത്യയവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: גַּם ... גַּם
  choice: രഥസേനയും കുതിരപ്പടയാളികളും
  rationale: ആവർത്തിച്ചുള്ള גַּם രണ്ടു വിഭാഗങ്ങളെയും കൂട്ടിച്ചേർക്കുകയും ഊന്നിപ്പറയുകയും ചെയ്യുന്നു; മലയാളത്തിലെ ‘-യും ... -കളും’ എന്ന സമാന്തരഘടന അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: רֶכֶב
  choice: രഥസേന
  rationale: ഏകവചനരൂപമാണെങ്കിലും ഇവിടെ കൂട്ടായ അർഥത്തിൽ രഥങ്ങളുടെ സൈനികവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘രഥസേന’ ഈ കൂട്ടാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: פָּרָשִׁים
  choice: കുതിരപ്പടയാളികൾ
  rationale: കുതിരപ്പുറത്തു സഞ്ചരിക്കുന്ന സൈനികരെ സൂചിപ്പിക്കുന്ന പദം; ആധുനിക മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ പ്രയോഗം.
- source_word: הַמַּחֲנֶה
  choice: യാത്രാസംഘം
  rationale: מַחֲנֶה സാധാരണയായി ‘പാളയം’ എന്നും അർഥമാക്കാമെങ്കിലും, ഈ ശവസംസ്കാരയാത്രയുടെ പശ്ചാത്തലത്തിൽ സഞ്ചരിച്ചിരുന്ന മുഴുവൻ സംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘യാത്രാസംഘം’ നിശ്ചലമായ പാളയം എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: כָּבֵד מְאֹד
  choice: അതിവിപുലമായിരുന്നു
  rationale: അക്ഷരാർഥം ‘വളരെ ഭാരമുള്ളതായിരുന്നു’ എന്നാണ്; ഒരു സംഘത്തെക്കുറിച്ച് പറയുമ്പോൾ അതിന്റെ വലിപ്പം, പ്രൗഢി, ഗണ്യത എന്നിവ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്. ‘അതിവിപുലം’ പ്രധാന സന്ദർഭാർഥം നൽകുന്നു, മറ്റു നിഴലുകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
