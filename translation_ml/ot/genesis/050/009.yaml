  text: וַ/יַּ֣עַל עִמּ֔/וֹ גַּם רֶ֖כֶב גַּם פָּרָשִׁ֑ים וַ/יְהִ֥י הַֽ/מַּחֲנֶ֖ה כָּבֵ֥ד מְאֹֽד־־׃
