  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സഞ്ചരിക്കുന്ന കൂട്ടത്തെ സൂചിപ്പിക്കാൻ ‘പാളയം’ എന്നതിനു പകരം ‘യാത്രാസംഘം’ ഉപയോഗിച്ചു; രഥങ്ങളുടെ കൂട്ടാർഥം ‘രഥസേന’യിലൂടെ നിലനിർത്തി.
