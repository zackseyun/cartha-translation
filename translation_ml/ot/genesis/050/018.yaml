source:
  edition: WLC
  text: וַ/יֵּלְכוּ֙ גַּם אֶחָ֔י/ו וַֽ/יִּפְּל֖וּ לְ/פָנָ֑י/ו וַ/יֹּ֣אמְר֔וּ הִנֶּ֥/נּֽוּ לְ/ךָ֖ לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/018.yaml
  text: Then his brothers also came and fell down before him and said[a], “Here we are, your servants.”
translation:
  language: ml
  text: 'അവന്റെ സഹോദരന്മാരും വന്ന് അവന്റെ മുമ്പിൽ വീണു പറഞ്ഞു: “ഇതാ, ഞങ്ങൾ അങ്ങയുടെ അടിമകളാണ്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദത്തിന് “ദാസന്മാർ” അല്ലെങ്കിൽ “സേവകർ” എന്നും അർഥമാകാം; ഇവിടെ സഹോദരന്മാരുടെ ശക്തമായ കീഴടങ്ങൽ പ്രകടമാക്കാൻ “അടിമകൾ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: വന്ന്
  rationale: הלך എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘പോകുക/നടക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ യോസേഫിന്റെ അടുത്തേക്കുള്ള നീക്കം മലയാള വിവരണശൈലിയിൽ സ്വാഭാവികമായി ‘വന്ന്’ എന്നു നൽകുന്നു.
- source_word: גַּם אֶחָיו
  choice: അവന്റെ സഹോദരന്മാരും
  rationale: മുമ്പ് സന്ദേശം അയച്ചതിനു പുറമേ സഹോദരന്മാർ തന്നെയും നേരിട്ട് എത്തിയെന്ന കൂട്ടിച്ചേർക്കൽ גַּם സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּפְּלוּ לְפָנָיו
  choice: അവന്റെ മുമ്പിൽ സാഷ്ടാംഗം വീണു
  rationale: נפל + לפני ഇവിടെ വെറും വീഴ്ചയല്ല, കീഴടങ്ങലും ആദരവും പ്രകടിപ്പിക്കുന്ന നിലംപതിക്കൽ സൂചിപ്പിക്കുന്നു; ‘സാഷ്ടാംഗം വീണു’ ഈ ശാരീരികവും സാമൂഹികവുമായ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: הִנֶּנּוּ
  choice: ഇതാ, ഞങ്ങൾ
  rationale: സ്വയം സമർപ്പിച്ചുകൊണ്ടുള്ള അവതരണസൂത്രമാണ്; ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ ‘ഇതാ, ഞങ്ങൾ’ അതിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: לְךָ לַעֲבָדִים
  choice: അങ്ങയുടെ അടിമകളാണ്
  rationale: ലക്ഷ്യസൂചകമായ לְךָയും അവസ്ഥാസൂചകമായ לַעֲבָדִיםയും ചേർന്ന് യോസേഫിനോടുള്ള പൂർണ കീഴടങ്ങൽ പ്രഖ്യാപിക്കുന്നു. עֲבָדִים എന്നതിന്റെ ശക്തമായ ബന്ധിത-അധീനതാഭാവം ‘അടിമകൾ’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സ്വയം കീഴടങ്ങുന്ന സന്ദർഭത്തിൽ עֲבָדִים എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: പദത്തിന് ദാസന്മാർ, സേവകർ, അടിമകൾ എന്നീ അർഥങ്ങൾ സാധ്യമാണെങ്കിലും, സഹോദരന്മാർ ഇവിടെ വെറും സേവനം വാഗ്ദാനം ചെയ്യുന്നതല്ല; യോസേഫിന്റെ സമ്പൂർണ അധികാരത്തിന് തങ്ങളെത്തന്നെ വിധേയരാക്കുന്നു. അതിനാൽ ‘അടിമകൾ’ പ്രസ്താവനയുടെ ശക്തി സംരക്ഷിക്കുന്നു; പദത്തിന്റെ വിശാല അർഥപരിധി അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. യോസേഫിനോടുള്ള ആദരസൂചക അഭിസംബോധനയ്ക്കായി ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു; മൂലത്തിലെ കീഴടങ്ങൽഭാവം ‘സാഷ്ടാംഗം വീണു’, ‘അടിമകൾ’ എന്നിവയിലൂടെ നിലനിർത്തി.
