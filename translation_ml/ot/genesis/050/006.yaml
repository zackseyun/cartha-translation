id: GEN.50.6
reference: Genesis 50:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר פַּרְעֹ֑ה עֲלֵ֛ה וּ/קְבֹ֥ר אֶת אָבִ֖י/ךָ כַּ/אֲשֶׁ֥ר הִשְׁבִּיעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/006.yaml
  text: And Pharaoh said[a], “Go up and bury your father, as he made you swear.”
translation:
  language: ml
  text: 'ഫറവോൻ പറഞ്ഞു: “നിന്റെ അപ്പൻ നിന്നെക്കൊണ്ട് സത്യം ചെയ്യിച്ചതുപോലെ, നീ പുറപ്പെട്ടുചെന്ന് അവനെ അടക്കം ചെയ്യുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ ‘പറഞ്ഞു’ മതിയാകുന്നു.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ ഭരണാധികാരിക്കുള്ള പ്രചാരത്തിലുള്ള മലയാള രൂപം.
- source_word: עֲלֵה
  choice: പുറപ്പെട്ടുചെന്ന്
  rationale: പദശഃ ‘കയറിച്ചെല്ലുക’ എന്നാണെങ്കിലും ഇവിടെ ഈജിപ്തിൽനിന്ന് കനാനിലേക്കുള്ള യാത്രയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അസ്വാഭാവികമായ ദിശാപ്രയോഗം ഒഴിവാക്കിക്കൊണ്ട് യാത്രയുടെ ഭാവം നിലനിർത്തുന്നു.
- source_word: וּקְבֹר
  choice: അടക്കം ചെയ്യുക
  rationale: മരിച്ചവനെ സംസ്കരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: אֶת אָבִיךָ
  choice: നിന്റെ അപ്പനെ … അവനെ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയമുള്ള ‘അപ്പൻ’ എന്ന അർഥം; മലയാളവാക്യത്തിന്റെ വ്യക്തതയ്ക്കായി കർമം സർവനാമമായി ക്രിയയോടൊപ്പം ആവർത്തിക്കുന്നു.
- source_word: כַּאֲשֶׁר
  choice: … ചെയ്തതുപോലെ
  rationale: രീതി/അനുസരണം സൂചിപ്പിക്കുന്ന താരതമ്യബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הִשְׁבִּיעֶךָ
  choice: നിന്നെക്കൊണ്ട് സത്യം ചെയ്യിച്ചു
  rationale: 'שׁבע എന്ന ധാതുവിന്റെ ഹിഫിൽ രൂപത്തിലെ കാരണാർഥം വ്യക്തമായി സംരക്ഷിക്കുന്നു: യോസേഫ് സ്വയം സത്യം ചെയ്തതെന്നല്ല, അപ്പൻ അവനെക്കൊണ്ട് സത്യം ചെയ്യിച്ചതാണ്.'
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പിതാവ്’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് അടുപ്പമുള്ള ‘അപ്പൻ’ തിരഞ്ഞെടുത്തു; രാജകീയ പ്രസ്താവനയുടെ ഗൗരവം നിലനിർത്തി.
