  text: וְ/עַתָּה֙ אַל תִּירָ֔אוּ אָנֹכִ֛י אֲכַלְכֵּ֥ל אֶתְ/כֶ֖ם וְ/אֶֽת טַפְּ/כֶ֑ם וַ/יְנַחֵ֣ם אוֹתָ֔/ם וַ/יְדַבֵּ֖ר עַל לִבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/021.yaml
  text: So now[a], do not be afraid. I myself will provide for you and your little ones.” Thus he comforted them and spoke to their hearts.
translation:
  language: ml
  text: “അതുകൊണ്ട്, ഇപ്പോൾ ഭയപ്പെടേണ്ട. നിങ്ങളെയും നിങ്ങളുടെ കുഞ്ഞുങ്ങളെയും ഞാൻതന്നെ പോറ്റിപ്പുലർത്തും.” ഇങ്ങനെ അവൻ അവരെ ആശ്വസിപ്പിച്ചു; അവരോടു സ്നേഹപൂർവം സംസാരിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “അവരെ ധൈര്യപ്പെടുത്തുന്ന വിധത്തിൽ സംസാരിച്ചു”; അക്ഷരാർഥം: “അവരുടെ ഹൃദയത്തോടു സംസാരിച്ചു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: וְ എന്ന ബന്ധകത്തിന്റെയും עַתָּה എന്ന കാലസൂചകത്തിന്റെയും ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തി, യോസേഫിന്റെ സമാപന ആശ്വാസത്തിലേക്കുള്ള നീക്കം വ്യക്തമാക്കുന്നു.
- source_word: אַל תִּירָאוּ
  choice: ഭയപ്പെടേണ്ട
  rationale: വിലക്കോടുകൂടിയ ആശ്വാസപ്രകടനം ആധുനിക മലയാളത്തിലെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: אָנֹכִי
  choice: ഞാൻതന്നെ
  rationale: സ്വതന്ത്ര സർവനാമത്തിലുള്ള ഊന്നൽ നിലനിർത്തി, യോസേഫിന്റെ വ്യക്തിപരമായ ഉത്തരവാദിത്വവും ഉറപ്പും പ്രകടമാക്കുന്നു.
- source_word: אֲכַלְכֵּל
  choice: പോറ്റിപ്പുലർത്തും
  rationale: ഭക്ഷണവും ആവശ്യമായ പരിപാലനവും നൽകി തുടർച്ചയായി സംരക്ഷിക്കുക എന്ന ക്രിയയുടെ സന്ദർഭോചിത അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: טַפְּכֶם
  choice: നിങ്ങളുടെ കുഞ്ഞുങ്ങൾ
  rationale: ചെറിയ കുട്ടികളെ സൂചിപ്പിക്കുന്ന പ്രായസൂക്ഷ്മതയും കുടുംബസ്നേഹത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: וַיְנַחֵם אֹתָם
  choice: ഇങ്ങനെ അവൻ അവരെ ആശ്വസിപ്പിക്കുകയും ചെയ്തു
  rationale: യോസേഫിന്റെ വാക്കുകളുടെ ഫലം സംഗ്രഹിക്കുന്ന ആഖ്യാനക്രമം നിലനിർത്തുന്നു; נחם എന്നതിന്റെ ഈ സന്ദർഭത്തിലെ സ്വാഭാവിക അർത്ഥം ‘ആശ്വസിപ്പിക്കുക’ ആണ്.
- source_word: וַיְדַבֵּר עַל לִבָּם
  choice: അവരുടെ ഹൃദയത്തോട് സംസാരിക്കുകയും ചെയ്തു
  rationale: ‘ഹൃദയത്തോട് സംസാരിച്ചു’ എന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; അതോടൊപ്പം സ്നേഹപൂർവവും ധൈര്യപ്പെടുത്തുന്നതുമായ സംസാരമെന്ന ഇടിയത്തിന്റെ അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
