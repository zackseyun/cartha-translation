translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഞാൻതന്നെ’ എന്നത് മൂലത്തിലെ ഊന്നൽ സൂക്ഷിക്കുന്നു; ‘ഹൃദയത്തോട് സംസാരിച്ചു’ എന്ന രൂപകം പ്രധാനപാഠത്തിൽ നിലനിർത്തി അതിന്റെ പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
