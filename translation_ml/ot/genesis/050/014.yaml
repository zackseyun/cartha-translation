source:
  edition: WLC
  text: וַ/יָּ֨שָׁב יוֹסֵ֤ף מִצְרַ֨יְמָ/ה֙ ה֣וּא וְ/אֶחָ֔י/ו וְ/כָל הָ/עֹלִ֥ים אִתּ֖/וֹ לִ/קְבֹּ֣ר אֶת אָבִ֑י/ו אַחֲרֵ֖י קָבְר֥/וֹ אֶת אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/014.yaml
  text: Then Joseph returned to Egypt[a], he and his brothers and all who had gone up with him to bury his father[b], after he had buried his father.
translation:
  language: ml
  text: യോസേഫ് തന്റെ അപ്പനെ അടക്കിയശേഷം, അവനും അവന്റെ സഹോദരന്മാരും അപ്പനെ അടക്കാൻ അവനോടൊപ്പം കയറിപ്പോയിരുന്ന എല്ലാവരും ഈജിപ്തിലേക്കു മടങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘അവനോടൊപ്പം കയറിപ്പോയ എല്ലാവരും.’ ഈജിപ്തിൽനിന്ന് കനാനിലേക്കുള്ള യാത്രയെ ‘കയറിപ്പോകുക’ എന്നു പറയുന്നത് ബൈബിളിൽ സാധാരണമായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: മടങ്ങി
  rationale: שׁוב എന്ന ക്രിയയുടെ ആഖ്യാനരൂപം പൂർത്തിയായ മടക്കയാത്രയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘മടങ്ങി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מִצְרַיְמָה
  choice: ഈജിപ്തിലേക്കു
  rationale: ദിശാസൂചകമായ ה, ഈജിപ്തിലേക്കുള്ള സഞ്ചാരത്തെ വ്യക്തമാക്കുന്നു.
- source_word: הוּא וְאֶחָיו
  choice: യോസേഫും അവന്റെ സഹോദരന്മാരും
  rationale: הוּא യോസേഫിനെ ഊന്നിപ്പറയുന്ന പുനർനിർദ്ദേശമാണ്; മലയാളത്തിൽ പേരിനെ ആവർത്തിച്ച് സംയുക്തകർത്താവായി നൽകുന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְכָל הָעֹלִים אִתּוֹ
  choice: അവനോടൊപ്പം കയറിപ്പോയിരുന്ന എല്ലാവരും
  rationale: עֹלִים എന്ന പങ്കാളിക്രിയയുടെ ‘കയറിപ്പോകുക’ എന്ന രൂപം സംരക്ഷിച്ചുകൊണ്ട്, മുമ്പ് നടന്ന യാത്രയാണെന്ന ആപേക്ഷിക കാലബോധം ‘പോയിരുന്ന’ വഴി നൽകുന്നു.
- source_word: לִקְבֹּר אֶת־אָבִיו
  choice: അപ്പനെ അടക്കാൻ
  rationale: לִ + infinitive construct ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. ‘അടക്കാൻ’ ആ ഉദ്ദേശ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַחֲרֵי קָבְרוֹ אֶת־אָבִיו
  choice: അപ്പനെ അടക്കിയശേഷം
  rationale: אַחֲרֵי തുടർന്നുള്ള സമയത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ ഉപവാക്യം ആദ്യം വയ്ക്കുന്നത് സംഭവക്രമം വ്യക്തവും വാക്യം സ്വാഭാവികവുമാക്കുന്നു.
