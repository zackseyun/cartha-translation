revisions:
- from: അപ്പനെ അടക്കിയശേഷം, യോസേഫും അവന്റെ സഹോദരന്മാരും അപ്പനെ അടക്കാൻ അവനോടൊപ്പം കയറിപ്പോയിരുന്ന[a] എല്ലാവരും ഈജിപ്തിലേക്കു മടങ്ങി.
  to: യോസേഫ് തന്റെ അപ്പനെ അടക്കിയശേഷം, അവനും അവന്റെ സഹോദരന്മാരും അപ്പനെ അടക്കാൻ അവനോടൊപ്പം കയറിപ്പോയിരുന്ന എല്ലാവരും ഈജിപ്തിലേക്കു മടങ്ങി.[a]
  rationale: The revision explicitly identifies Joseph as the one who buried his father, preserving the Hebrew singular reference after the temporal clause is moved to the front. It also makes the cultural note's literal rendering include «എല്ലാവരും», corresponding to Hebrew וְכָל.
