translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘പിതാവ്’ എന്നതിനുപകരം കഥനസന്ദർഭത്തിന് സ്വാഭാവികമായ ‘അപ്പൻ’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ‘അപ്പനെ’ എന്ന ആവർത്തനം മലയാളത്തിലും നിലനിർത്തിയെങ്കിലും, വാക്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി സമയോപവാക്യം ആദ്യം വച്ചു.
