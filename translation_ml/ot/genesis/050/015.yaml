revisions:
- from: 'തങ്ങളുടെ അപ്പൻ മരിച്ചെന്നു യോസേഫിന്റെ സഹോദരന്മാർ കണ്ടപ്പോൾ അവർ പറഞ്ഞു: “യോസേഫ് നമ്മോടു പക വെച്ചിട്ട്, നാം അവനോടു ചെയ്ത സകല തിന്മയ്ക്കും നമ്മോടു പൂർണമായി പകരം ചെയ്തേക്കുമോ?”'
  to: 'യോസേഫിന്റെ സഹോദരന്മാർ തങ്ങളുടെ അപ്പൻ മരിച്ചെന്ന് കണ്ടപ്പോൾ അവർ പറഞ്ഞു: “യോസേഫ് നമ്മോടു പകവെക്കുകയും, നാം അവനോടു ചെയ്ത എല്ലാ തിന്മയ്ക്കും നമ്മോടു തീർച്ചയായും പ്രതികാരം ചെയ്യുകയും ചെയ്താലോ?”'
