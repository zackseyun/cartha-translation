    rationale: 'The Hebrew joins two feared future actions: Joseph may bear a grudge and may indeed repay. The Malayalam participial "വെച്ചിട്ട്" can imply temporal sequence or manner rather than coordinated feared actions, and the interrogative form is less natural here.'
