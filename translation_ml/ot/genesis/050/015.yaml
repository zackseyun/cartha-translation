language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּרְא֤וּ אֲחֵֽי יוֹסֵף֙ כִּי מֵ֣ת אֲבִי/הֶ֔ם וַ/יֹּ֣אמְר֔וּ ל֥וּ יִשְׂטְמֵ֖/נוּ יוֹסֵ֑ף וְ/הָשֵׁ֤ב יָשִׁיב֙ לָ֔/נוּ אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֥ר גָּמַ֖לְנוּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/015.yaml
  text: When Joseph’s brothers saw that their father was dead, they said, “What if Joseph hates us and fully repays us for all the evil that we did to him?”
translation:
  language: ml
  text: 'യോസേഫിന്റെ സഹോദരന്മാർ തങ്ങളുടെ അപ്പൻ മരിച്ചെന്ന് കണ്ടപ്പോൾ അവർ പറഞ്ഞു: “യോസേഫ് നമ്മോടു പകവെക്കുകയും, നാം അവനോടു ചെയ്ത എല്ലാ തിന്മയ്ക്കും നമ്മോടു തീർച്ചയായും പ്രതികാരം ചെയ്യുകയും ചെയ്താലോ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לוּ יִשְׂטְמֵנוּ
  choice: നമ്മോടു പക വെച്ചിട്ട് ... ചെയ്തേക്കുമോ?
  rationale: לוּ ഇവിടെ ഭയാശങ്കയോടെയുള്ള സാധ്യതയെ അവതരിപ്പിക്കുന്നു; שׂטם എന്നത് കടുത്ത പകയോ വിരോധമോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ആശങ്കാഭാവം നിലനിർത്തി.
- source_word: וְהָשֵׁב יָשִׁיב לָנוּ
  choice: നമ്മോടു പൂർണമായി പകരം ചെയ്തേക്കുമോ
  rationale: ക്രിയയുടെ infinitive absolute + finite verb ആവർത്തനം ഊന്നൽ നൽകുന്നു; ‘പൂർണമായി’ അതിനെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു. ‘പകരം ചെയ്യുക’ പ്രതികാരപരമായ തിരിച്ചുനൽകൽ സൂക്ഷിക്കുന്നു.
- source_word: כָּל־הָרָעָה אֲשֶׁר גָּמַלְנוּ אֹתוֹ
  choice: നാം അവനോടു ചെയ്ത സകല തിന്മയ്ക്കും
  rationale: רעהയെ ധാർമ്മികമായി വ്യക്തമായ ‘തിന്മ’ എന്നും גמלנו אותוയെ സന്ദർഭാനുസൃതമായി ‘അവനോടു ചെയ്ത’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: אָבִיהֶם
  choice: തങ്ങളുടെ അപ്പൻ
  rationale: സഹോദരന്മാരുടെ പിതാവിനെ സൂചിപ്പിക്കുന്ന ബന്ധം വ്യക്തവും സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: യോസേഫിന്റെ ഭാവി മനോഭാവവും പ്രവൃത്തിയും ഉറപ്പായതായി പറയണമോ എന്നത്
  choice: ഭയാശങ്ക നിറഞ്ഞ സാധ്യതയായി അവതരിപ്പിച്ചു
  alternative: ‘യോസേഫ് തീർച്ചയായും നമ്മെ വെറുക്കുകയും പകരം ചെയ്യുകയും ചെയ്യും’ എന്ന ഉറപ്പുള്ള പ്രസ്താവന
  rationale: לוּ ഈ സന്ദർഭത്തിൽ സഹോദരന്മാരുടെ ആശങ്കയെ സൂചിപ്പിക്കുന്നു; യോസേഫ് യഥാർത്ഥത്തിൽ അങ്ങനെ പ്രതികരിക്കുമെന്ന നിഗമനം പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പക വെക്കുക’, ‘പകരം ചെയ്യുക’ എന്നീ സാധാരണ പ്രയോഗങ്ങൾ മൂലത്തിലെ വൈരവും പ്രതികാരഭയവും നിലനിർത്തുന്നു.
