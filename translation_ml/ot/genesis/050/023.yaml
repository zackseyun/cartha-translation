  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤רְא יוֹסֵף֙ לְ/אֶפְרַ֔יִם בְּנֵ֖י שִׁלֵּשִׁ֑ים גַּ֗ם בְּנֵ֤י מָכִיר֙ בֶּן מְנַשֶּׁ֔ה יֻלְּד֖וּ עַל בִּרְכֵּ֥י יוֹסֵֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/023.yaml
  text: Joseph saw Ephraim’s children to the third generation[a]. Also[b], the children of Machir son of Manasseh were born on Joseph’s knees.
translation:
  language: ml
  text: യോസേഫ് എഫ്രയീമിന്റെ മൂന്നാം തലമുറവരെയുള്ള മക്കളെ കണ്ടു.[a] മനശ്ശെയുടെ മകനായ മാഖീരിന്റെ മക്കളും യോസേഫിന്റെ കാൽമുട്ടുകളിന്മേൽ ജനിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എഫ്രയീമിന്റെ മൂന്നാം തലമുറവരെയുള്ള മക്കളെ കാണാൻ യോസേഫ് ജീവിച്ചിരുന്നു.” എബ്രായപാഠത്തിൽ അക്ഷരാർഥമായി “യോസേഫ് കണ്ടു” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: “യോസേഫിന്റെ കാൽമുട്ടുകളിന്മേൽ ജനിച്ചു” എന്നത് കുട്ടികളെ കുടുംബപരമായി അംഗീകരിക്കുകയോ സ്വീകരിക്കുകയോ പ്രത്യേക സ്വീകാര്യത നൽകുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കാവുന്ന ഒരു എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടു
  rationale: എബ്രായ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘കണ്ടു’ എന്നാണ്. ഈ വംശാവലി-ആയുസ്സ് പശ്ചാത്തലത്തിൽ ‘കാണാൻ ജീവിച്ചിരുന്നു’ എന്ന ആശയം ഉൾക്കൊള്ളാമെങ്കിലും, മുഖ്യപാഠത്തിൽ മൂലഭാഷയുടെ ലളിതമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: לְאֶפְרַיִם
  choice: എഫ്രയീമിന്റെ
  rationale: സന്തതിയെ സൂചിപ്പിക്കുന്ന ഈ ഘടനയിലെ לְ മലയാളത്തിൽ സ്വാഭാവികമായി ഉടമസ്ഥതാവിഭക്തിയിലൂടെ നൽകാം.
- source_word: בְּנֵי שִׁלֵּשִׁים
  choice: മൂന്നാം തലമുറവരെയുള്ള മക്കൾ
  rationale: മൂന്നാം തലമുറവരെ നീളുന്ന സന്തതിയെ സൂചിപ്പിക്കുന്നു; കൃത്യമായ ബന്ധനാമം മൂലപാഠത്തേക്കാൾ കൂടുതൽ നിർണയിക്കാതെ വംശപരമായ വ്യാപ്തി വ്യക്തമാക്കുന്നു.
- source_word: גַּם
  choice: -ഉം
  rationale: ആദ്യ പ്രസ്താവനയോടു സമാന്തരമായ ഒരു അധിക വിവരം മലയാളത്തിലെ ചേർക്കൽപ്രത്യയമായ ‘-ഉം’ സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: മനശ്ശെയുടെ മകനായ മാഖീരിന്റെ മക്കൾ
  rationale: മാഖീരിനെ മനശ്ശെയുടെ മകനായി വ്യക്തമായി തിരിച്ചറിയിക്കുകയും בְּנֵי എന്നത് ഈ വംശാവലി പശ്ചാത്തലത്തിൽ പൊതുവായ ‘മക്കൾ’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: יֻלְּדוּ
  choice: ജനിച്ചു
  rationale: ילד എന്ന ക്രിയയുടെ നിഷ്ക്രിയരൂപത്തിന്റെ സ്വാഭാവിക മലയാള പരിഭാഷയാണ് ‘ജനിച്ചു’.
- source_word: עַל בִּרְכֵּי יוֹסֵף
  choice: യോസേഫിന്റെ മടിയിൽ
  rationale: ‘യോസേഫിന്റെ മുട്ടുകളിന്മേൽ’ എന്ന പദാനുപദരൂപം മലയാളത്തിൽ ദൃശ്യത്തിന്റെ സാംസ്കാരിക അർഥം മങ്ങിയതാക്കാം. ‘മടിയിൽ’ ശരീരഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുമ്പോഴും കുടുംബപരമായ അംഗീകാരം, സ്വീകരണം, പ്രത്യേക സ്വീകാര്യത എന്നിവയിലേതെന്ന് നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: ‘യോസേഫിന്റെ മടിയിൽ ജനിച്ചു’ എന്ന പ്രയോഗത്തിന്റെ കുടുംബപരമായ സൂചന
  choice: സാംസ്കാരിക ദൃശ്യപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു
  alternative: ‘യോസേഫ് അവരെ സ്വന്തം സന്തതിയായി അംഗീകരിച്ചു’ എന്നു വ്യാഖ്യാനപരമായി പരിഭാഷപ്പെടുത്തുക
  rationale: മൂലപാഠം സൂചിപ്പിക്കുന്ന അംഗീകാരം, സ്വീകരണം, അല്ലെങ്കിൽ പ്രത്യേക സ്വീകാര്യത എന്നിവയിൽ ഒന്ന് മാത്രം ഉറപ്പിച്ചു പറയുന്നില്ല; അതിനാൽ അതിലെ യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘എഫ്രയീം’, ‘മനശ്ശെ’, ‘മാഖീർ’ എന്നീ രൂപങ്ങൾ മലയാള ബൈബിൾ വായനക്കാർക്കു പരിചിതമായ പേരുരൂപങ്ങളോട് ചേർന്ന് നിൽക്കുന്നു. മൂലപാഠത്തിലെ ദൃശ്യപ്രയോഗവും അതിന്റെ വ്യാഖ്യാനസാധ്യതകളും വേർതിരിച്ചു സൂക്ഷിച്ചിരിക്കുന്നു.
