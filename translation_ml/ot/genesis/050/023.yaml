  source_fidelity: ആദ്യവാക്യം വַיַּרְא എന്നതിന്റെ നേരിട്ടുള്ള അർഥവും എഫ്രയീമിന്റെ മൂന്നാം തലമുറവരെയുള്ള സന്തതിയെന്ന ആശയവും വിശ്വസ്തമായി നൽകുന്നു. രണ്ടാം വാക്യത്തിൽ മുഖ്യപ്രശ്നം עַל־בִּרְכֵּי יוֹסֵף (‘യോസേഫിന്റെ മുട്ടുകളിന്മേൽ’) എന്ന ശരീരദൃശ്യത്തെ ‘മടിയിൽ’ എന്നു മാറ്റിയതാണ്; ‘മടി’ അടുത്തതായിരുന്നാലും എബ്രായത്തിലെ ‘മുട്ടുകൾ’ എന്ന വ്യക്തമായ പദം നഷ്ടപ്പെടുന്നു.
  naturalness: പരിഷ്കരിച്ച പാഠം ആധുനിക നിലവാരമലയാളത്തിൽ വായിക്കാവുന്നതാണ്. ‘കാൽമുട്ടുകളിന്മേൽ ജനിച്ചു’ എന്നത് ഉദ്ദേശപൂർവം അക്ഷരാർഥസന്നിഹിതമായ, സാംസ്കാരികമായി അപരിചിതമായ ദൃശ്യപ്രയോഗമാണ്; അതിനാൽ അതിന്റെ അർഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
