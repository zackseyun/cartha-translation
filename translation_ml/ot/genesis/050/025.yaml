id: GEN.50.25
reference: Genesis 50:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּשְׁבַּ֣ע יוֹסֵ֔ף אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר פָּקֹ֨ד יִפְקֹ֤ד אֱלֹהִים֙ אֶתְ/כֶ֔ם וְ/הַעֲלִתֶ֥ם אֶת עַצְמֹתַ֖/י מִ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/025.yaml
  text: Then Joseph made the sons of Israel swear, saying, “God will surely attend to you, and you must bring up my bones from here.”
translation:
  language: ml
  text: 'പിന്നെ യോസേഫ് ഇസ്രായേൽമക്കളെക്കൊണ്ട് സത്യം ചെയ്യിച്ചു: “ദൈവം നിങ്ങളെ നിശ്ചയമായും കരുതും; അപ്പോൾ നിങ്ങൾ എന്റെ അസ്ഥികൾ ഇവിടെനിന്ന് കൊണ്ടുപോകണം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁבַּע ... אֶת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളെക്കൊണ്ട് സത്യം ചെയ്യിച്ചു
  rationale: ഹിഫ്ഇൽ രൂപത്തിന്റെ കാരകാർഥവും ‘sons of Israel’ എന്ന പ്രയോഗവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: פָּקֹד יִפְקֹד
  choice: നിശ്ചയമായും കരുതും
  rationale: ഒരേ ധാതുവിന്റെ ആവർത്തനം നൽകുന്ന ഉറപ്പിനെ ‘നിശ്ചയമായും’ എന്നു പ്രകടിപ്പിക്കുന്നു; ഇവിടെ פקד ദൈവം തന്റെ ജനത്തെ ശ്രദ്ധിച്ച് ഇടപെടുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְהַעֲלִתֶם
  choice: അപ്പോൾ ... കൊണ്ടുപോകണം
  rationale: മിസ്രയീമിൽനിന്നുള്ള പുറപ്പാടിന്റെ പശ്ചാത്തലത്തിൽ ‘bring up’ എന്ന ദിശാഭാവം ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളം; സത്യപ്രതിജ്ഞയോടു ചേർന്ന നിർബന്ധാർഥം ‘വേണം’ കൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: עַצְמֹתַי
  choice: എന്റെ അസ്ഥികൾ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: פָּקֹד יִפְקֹד എന്ന ദൈവിക പ്രവർത്തനത്തിന്റെ വിവർത്തനം
  choice: ദൈവം നിങ്ങളെ നിശ്ചയമായും കരുതും
  alternative: ദൈവം നിങ്ങളെ നിശ്ചയമായും സന്ദർശിക്കും
  rationale: ‘സന്ദർശിക്കും’ എന്ന അക്ഷരാർഥം ആധുനിക മലയാളത്തിൽ സാധാരണ സന്ദർശനം എന്ന തെറ്റായ ധാരണ നൽകാം. ‘കരുതും’ ദൈവത്തിന്റെ ശ്രദ്ധയും അനുകൂല ഇടപെടലും സൂചിപ്പിക്കുന്നു; എന്നാൽ സംഭവത്തിന്റെ കൃത്യരൂപം അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. സംഭാഷണം സ്വാഭാവികമാക്കിക്കൊണ്ട് സത്യപ്രതിജ്ഞയുടെ നിർബന്ധവും ദൈവിക വാഗ്ദാനത്തിന്റെ ഉറപ്പും സംരക്ഷിച്ചു.
