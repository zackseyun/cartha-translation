id: GEN.50.17
reference: Genesis 50:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֹּֽה תֹאמְר֣וּ לְ/יוֹסֵ֗ף אָ֣נָּ֡א שָׂ֣א נָ֠א פֶּ֣שַׁע אַחֶ֤י/ךָ וְ/חַטָּאתָ/ם֙ כִּי רָעָ֣ה גְמָל֔וּ/ךָ וְ/עַתָּה֙ שָׂ֣א נָ֔א לְ/פֶ֥שַׁע עַבְדֵ֖י אֱלֹהֵ֣י אָבִ֑י/ךָ וַ/יֵּ֥בְךְּ יוֹסֵ֖ף בְּ/דַבְּרָ֥/ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/017.yaml
  text: 'This is what you shall say to Joseph: ‘Please forgive the transgression of your brothers and their sin, because they repaid you with evil. And now, please forgive the transgression of the servants of the God of your father.’ And Joseph wept when they spoke to him.'
translation:
  language: ml
  text: 'നിങ്ങൾ യോസേഫിനോടു ഇപ്രകാരം പറയണം: ‘ദയവായി, നിന്റെ സഹോദരന്മാരുടെ അതിക്രമവും അവരുടെ പാപവും ക്ഷമിക്കണമേ; അവർ നിനക്കു തിന്മ ചെയ്തതുകൊണ്ട്. ഇപ്പോൾ, ദയവായി, നിന്റെ പിതാവിന്റെ ദൈവത്തിന്റെ ദാസന്മാരുടെ അതിക്രമം ക്ഷമിക്കണമേ.’ അവർ യോസേഫിനോടു സംസാരിച്ചപ്പോൾ യോസേഫ് കരഞ്ഞു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂא נָא
  choice: ദയവായി … ക്ഷമിക്കണമേ
  rationale: ശാബ്ദികമായി ‘ദയവായി എടുത്തുകളയുക/വഹിക്കുക’ എന്നാണെങ്കിലും, കുറ്റം നീക്കിക്കളയുക എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘ക്ഷമിക്കുക’ എന്നു നൽകുന്നു; נָאയുടെ അപേക്ഷാഭാവം ‘ദയവായി’യും ‘-ണമേ’യും നിലനിർത്തുന്നു.
- source_word: פֶּשַׁע
  choice: അതിക്രമം
  rationale: മനപ്പൂർവമായ ലംഘനം അല്ലെങ്കിൽ കുറ്റം എന്ന ശക്തമായ ഭാവം സൂക്ഷിക്കുന്നു; സമീപമുള്ള חַטָּאתָם എന്ന ‘പാപം’ എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: חַטָּאתָם
  choice: പാപം
  rationale: സാധാരണവും ദൈവശാസ്ത്രപരമായി അനാവശ്യമായി ചുരുക്കാത്തതുമായ തുല്യപദം.
- source_word: כִּי רָעָה גְמָלוּךָ
  choice: അവർ നിന്നോടു തിന്മ പ്രവർത്തിച്ചുവല്ലോ
  rationale: גמל എന്ന ക്രിയയുടെ ‘ചെയ്തു/തിരിച്ചുനൽകി’ എന്ന ആശയം സന്ദർഭോചിതമായി പ്രകടിപ്പിക്കുന്നു; כִּיയുടെ കാരണവാചകബന്ധം മലയാളത്തിലെ ‘-വല്ലോ’ വഴി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: നിന്റെ പിതാവിന്റെ ദൈവം
  rationale: ഹീബ്രു ഏകവചനബന്ധവും യോസേഫിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയും കൃത്യമായി സൂക്ഷിക്കുന്നു.
- source_word: בְּדַבְּרָם אֵלָיו
  choice: അവർ തന്നോടു സംസാരിച്ചപ്പോൾ
  rationale: പ്രത്യയം ആരെ സൂചിപ്പിക്കുന്നു എന്നത് മലയാളത്തിൽ വ്യക്തമാക്കിക്കൊണ്ട്, ‘അവർ അവനോടു സംസാരിക്കുമ്പോൾ’ എന്ന സമയബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: പാപവും അതിക്രമവും തമ്മിലുള്ള ബന്ധം
  choice: ‘അതിക്രമവും പാപവും’ എന്നിങ്ങനെ രണ്ടും പ്രത്യേകം നിലനിർത്തി
  alternative: ഒറ്റ പദമായി ‘കുറ്റം’ എന്നു ചുരുക്കുക
  rationale: മൂലപാഠത്തിലെ פֶּשַׁע / חַטָּאת എന്ന ഇരട്ടപ്രയോഗം കുറ്റത്തിന്റെ ഗൗരവവും ശൈലിപരമായ ഊന്നലും നൽകുന്നു; അതിനെ സമതലപ്പെടുത്തരുത്.
- issue: ‘നിന്റെ പിതാവിന്റെ ദൈവത്തിന്റെ ദാസന്മാർ’ എന്ന സ്വയംവിശേഷണം
  choice: മൂലത്തിലെ അവകാശവാദം വിശദീകരണമില്ലാതെ നേരിട്ട് നിലനിർത്തി
  alternative: സഹോദരന്മാരുടെ വിശ്വാസത്തിന്റെ ആത്മാർഥത സ്ഥിരീകരിക്കുന്ന വ്യാഖ്യാനം ചേർക്കുക
  rationale: വാക്യം അവരുടെ വാക്കുകൾ മാത്രം രേഖപ്പെടുത്തുന്നു; അവരുടെ ആത്മീയ നിലയെ വിവർത്തനം വിധിക്കരുത്.
- issue: כִּיയുടെ അർഥബന്ധം
  choice: കാരണസൂചനയായി ‘…ചെയ്തുവല്ലോ’
  alternative: ‘എങ്കിലും അവർ നിന്നോടു തിന്മ ചെയ്തു’ എന്ന concessive വായന
  rationale: ഇവിടെ ക്ഷമയ്ക്കായുള്ള അപേക്ഷയിൽ കുറ്റം സമ്മതിക്കുന്ന കാരണാത്മക/വിശദീകരണാത്മക ബന്ധമാണ് ഏറ്റവും സ്വാഭാവികം; എന്നാൽ മലയാളരൂപം അതിരുകടന്ന തർക്കവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിൽ ഗൗരവമുള്ളെങ്കിലും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷ. പേരിന് മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ ‘യോസേഫ്’ ഉപയോഗിച്ചു. ഉദ്ധരണിക്കുള്ളിലെ അപേക്ഷാഭാവം വിനയമുള്ള ‘ക്ഷമിക്കണമേ’ കൊണ്ട് നിലനിർത്തി; പഴഞ്ചൻ പദാവലിയും വിഭാഗീയ വ്യാഖ്യാനവും ഒഴിവാക്കി.
