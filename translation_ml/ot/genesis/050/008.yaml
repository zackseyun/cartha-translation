source:
  edition: WLC
  text: וְ/כֹל֙ בֵּ֣ית יוֹסֵ֔ף וְ/אֶחָ֖י/ו וּ/בֵ֣ית אָבִ֑י/ו רַ֗ק טַפָּ/ם֙ וְ/צֹאנָ֣/ם וּ/בְקָרָ֔/ם עָזְב֖וּ בְּ/אֶ֥רֶץ גֹּֽשֶׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/008.yaml
  text: and all the household of Joseph[a], and his brothers, and his father's household; only their little ones, their flocks[c][b], and their herds they left in the land of Goshen.
translation:
  language: ml
  text: യോസേഫിന്റെ കുടുംബം മുഴുവനും[a], അവന്റെ സഹോദരന്മാരും അവന്റെ പിതാവിന്റെ കുടുംബവും കൂടെ പോയി. അവരുടെ കുഞ്ഞുങ്ങളെയും[b] ആട്ടിൻപറ്റങ്ങളെയും കന്നുകാലികളെയും മാത്രമാണ് അവർ ഗോഷെൻ ദേശത്ത് വിട്ടുപോയത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ‘യോസേഫിന്റെ വീട്’ എന്നാണ്; ഇവിടെ അത് കെട്ടിടത്തെയല്ല, കുടുംബത്തെയോ വീട്ടുകാരെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘കുഞ്ഞുങ്ങൾ’ എന്നത് ചെറിയ കുട്ടികളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל בֵּית יוֹסֵף
  choice: യോസേഫിന്റെ കുടുംബം മുഴുവനും
  rationale: כֹּל സമഗ്രത സൂചിപ്പിക്കുന്നു; בֵּית יוֹסֵף ഇവിടെ ഒരു കെട്ടിടത്തെയല്ല, യോസേഫിനോടു ബന്ധപ്പെട്ട കുടുംബത്തെയോ വീട്ടുകാരെയോ സൂചിപ്പിക്കുന്നു.
- source_word: וְאֶחָיו
  choice: അവന്റെ സഹോദരന്മാരും
  rationale: സന്ദർഭത്തിൽ אָח എന്ന പദത്തിന്റെ ബഹുവചനം യോസേഫിന്റെ പുരുഷസഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּבֵית אָבִיו
  choice: അവന്റെ പിതാവിന്റെ കുടുംബവും
  rationale: בַּיִת ഇവിടെ പിതാവിന്റെ കുടുംബസംഘത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘കുടുംബം’ എന്നു നൽകി.
- source_word: רַק טַפָּם
  choice: അവരുടെ കുഞ്ഞുങ്ങളെയും മാത്രം
  rationale: רַק ഒഴിവാക്കപ്പെട്ട വിഭാഗത്തെ പരിമിതപ്പെടുത്തുന്നു; טַף പ്രത്യേകിച്ച് ചെറിയ കുട്ടികളെ സൂചിപ്പിക്കുന്നു.
- source_word: וְצֹאנָם
  choice: ആട്ടിൻപറ്റങ്ങളെയും
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ വളർത്തുമൃഗങ്ങളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; ‘ആട്ടിൻപറ്റങ്ങൾ’ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: וּבְקָרָם
  choice: കന്നുകാലിക്കൂട്ടങ്ങളെയും
  rationale: בָּקָר വലിയ വളർത്തുമൃഗങ്ങളായ കന്നുകാലികളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; צֹאן എന്നതിൽനിന്നുള്ള വ്യത്യാസവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: עָזְבוּ
  choice: അവർ ... വിട്ടുപോയി
  rationale: ക്രിയയ്ക്ക് ഇവിടെ ഉപേക്ഷിച്ചുകളഞ്ഞു എന്ന ശക്തമായ അർഥമല്ല, പിന്നിൽ താമസിപ്പിച്ചുപോയി എന്ന അർഥമാണ്.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: ഗോഷെൻ ദേശത്ത്
  rationale: אֶרֶץ എന്ന ഭൂമിശാസ്ത്രപരമായ ഘടകം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. മുൻവാക്യത്തിലെ ‘പോയി’ എന്ന ക്രിയ എബ്രായത്തിൽ ഈ വാക്യത്തിലെ ആദ്യ പട്ടികയ്ക്കും ബാധകമായതിനാൽ മലയാളത്തിലെ അപൂർണ്ണവാക്യം ഒഴിവാക്കാൻ ‘കൂടെ പോയി’ എന്നു വ്യക്തമാക്കി. ‘ആട്ടിൻപറ്റങ്ങൾ’ എന്നും ‘കന്നുകാലിക്കൂട്ടങ്ങൾ’ എന്നും നൽകി ചെറുകന്നുകാലി–വലിയ കന്നുകാലി വ്യത്യാസം നിലനിർത്തി.
