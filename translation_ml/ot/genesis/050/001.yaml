  register: ആധുനികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മുഖത്തിന്മേൽ’ എന്ന മൂർത്തമായ എബ്രായ ദൃശ്യം നിലനിർത്തിയപ്പോൾ, ദുഃഖപ്രകടനം സ്വാഭാവിക മലയാളത്തിൽ ‘അവനെച്ചൊല്ലി കരഞ്ഞ്’ എന്നു നൽകിയിരിക്കുന്നു. പ്രധാനവാക്യത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പിനോട് പൊരുത്തപ്പെടുന്നു.
