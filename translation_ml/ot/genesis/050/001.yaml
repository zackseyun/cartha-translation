source:
  edition: WLC
  text: וַ/יִּפֹּ֥ל יוֹסֵ֖ף עַל פְּנֵ֣י אָבִ֑י/ו וַ/יֵּ֥בְךְּ עָלָ֖י/ו וַ/יִּשַּׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/001.yaml
  text: Then Joseph fell on his father's face and wept over him and kissed him[a].
translation:
  language: ml
  text: അപ്പോൾ യോസേഫ് തന്റെ അപ്പന്റെ മുഖത്തിന്മേൽ വീണു; അവനെച്ചൊല്ലി കരഞ്ഞു; അവനെ ചുംബിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘തന്റെ അപ്പന്റെ മുഖത്തിന്മേൽ വീണു’; ഇത് ദുഃഖത്തിന്റെ മൂർത്തമായ ശാരീരിക ദൃശ്യം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: വീണ്
  rationale: נפל എന്ന ക്രിയയുടെ പൂർത്തിയായ ഭൂതകാല ആഖ്യാനരൂപം. യോസേഫ് അപ്പന്റെ ശരീരത്തിന്മേലേക്ക് കുനിഞ്ഞുവീണ ദൃശ്യത്തെ വ്യാഖ്യാനാത്മകമായ തീവ്രത കൂട്ടാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עַל פְּנֵי אָבִיו
  choice: തന്റെ അപ്പന്റെ മുഖത്തിന്മേൽ
  rationale: എബ്രായത്തിലെ ‘അവന്റെ അപ്പന്റെ മുഖത്തിന്മേൽ’ എന്ന മൂർത്തമായ ദൃശ്യഭാഷ സംരക്ഷിക്കുന്നു. ‘അപ്പന്റെമേൽ’ എന്നു പൊതുവാക്കാതെ ‘മുഖം’ നിലനിർത്തിയിരിക്കുന്നു.
- source_word: וַיֵּבְךְּ עָלָיו
  choice: അവനെച്ചൊല്ലി കരഞ്ഞ്
  rationale: בכה എന്നത് കരയുക/വിലപിക്കുക എന്നർഥം. ഇവിടെ עַל സഹിതമുള്ള പ്രയോഗം മരിച്ച അപ്പനെച്ചൊല്ലിയുള്ള ദുഃഖകരച്ചിലിനെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘അവനെച്ചൊല്ലി കരഞ്ഞ്’ അതു വ്യക്തമാക്കുന്നു.
- source_word: וַיִּשַּׁק לוֹ
  choice: അവനെ ചുംബിച്ചു
  rationale: נשק എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘ചുംബിക്കുക’ നേരിട്ട് നൽകുന്നു; לֹו എന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ നേരിട്ടുള്ള കർമമായി സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: പേരിന്റെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ ലിപ്യന്തരണം.
