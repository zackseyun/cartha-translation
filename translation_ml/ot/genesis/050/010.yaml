source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ עַד גֹּ֣רֶן הָאָטָ֗ד אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּ֨סְפְּדוּ שָׁ֔ם מִסְפֵּ֛ד גָּד֥וֹל וְ/כָבֵ֖ד מְאֹ֑ד וַ/יַּ֧עַשׂ לְ/אָבִ֛י/ו אֵ֖בֶל שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/010.yaml
  text: When they came to the threshing floor of Atad[a], which is beyond the Jordan, they lamented there with a very great and grievous lamentation[e][d][c][b], and he observed seven days of mourning for his father.
translation:
  language: ml
  text: അവർ യോർദ്ദാന്റെ മറുകരയിലുള്ള ആത്താദിന്റെ മെതിക്കളത്തിൽ[a][b] എത്തിയപ്പോൾ, അവിടെ വളരെ വലിയതും അത്യന്തം ദുഃഖകരവുമായ വിലാപം നടത്തി[c]. അവൻ തന്റെ അപ്പനുവേണ്ടി ഏഴ് ദിവസം ദുഃഖാചരണം നടത്തി[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആത്താദ്’ എന്ന പേരിന് ‘മുള്ളുചെടി’ അഥവാ ‘മുൾപ്പടർപ്പ്’ എന്ന അർത്ഥബന്ധം ഉണ്ടായിരിക്കാം; ഇവിടെ അത് സ്ഥലനാമത്തിന്റെ ഭാഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘യോർദ്ദാനപ്പുറത്തുള്ള’ / ‘യോർദ്ദാന്റെ മറുവശത്തുള്ള.’'
    reason: alternative_reading
  - marker: c
    text: 'എബ്രായഭാഷയിൽ അക്ഷരാർഥത്തിൽ: ‘വലിയതും അത്യന്തം ഭാരമേറിയതുമായ വിലാപം’; അതിതീവ്രമായ ദുഃഖം സൂചിപ്പിക്കുന്ന പ്രയോഗം.'
    reason: cultural_note
  - marker: d
    text: എബ്രായ ക്രിയ ഏകവചനത്തിലാണ്—‘അവൻ ദുഃഖാചരണം നടത്തി’; ഇത് വിശേഷിച്ച് യോസേഫിനെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു. ചില പരിഭാഷകൾ സന്ദർഭാനുസരണം ‘അവർ’ എന്നു നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: גֹּרֶן הָאָטָד
  choice: ആത്താദിന്റെ മെതിക്കളം
  rationale: גֹּרֶן എന്നത് ധാന്യം മെതിക്കുന്ന സ്ഥലമാണ്; הָאָטָד ഇവിടെ സ്ഥലനാമത്തിന്റെ ഭാഗമായി വരുന്നതിനാൽ അർത്ഥം പരിഭാഷപ്പെടുത്താതെ ‘ആത്താദ്’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദ്ദാനക്കരെയുള്ള
  rationale: עֵבֶר സൂചിപ്പിക്കുന്ന ‘മറുകര/അപ്പുറം’ എന്ന സ്ഥലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഏത് ദിശയിൽ നിന്നുള്ള കാഴ്ചപ്പാടാണെന്നത് നിർണയിക്കുന്നില്ല.
- source_word: וַיִּסְפְּדוּ ... מִסְפֵּד
  choice: വിലാപം കഴിച്ചു
  rationale: ספד എന്ന ക്രിയയും സമാനമൂലമുള്ള നാമവും ചേർന്നുള്ള ഊന്നൽ, മരണവുമായി ബന്ധപ്പെട്ട പൊതുവിലാപം എന്ന അർത്ഥത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിലൂടെ നൽകി.
- source_word: גָּדוֹל וְכָבֵד מְאֹד
  choice: അത്യന്തം വലിയതും കഠിനവുമായ
  rationale: מְאֹד നൽകുന്ന തീവ്രതയും כָבֵד ഇവിടെ സൂചിപ്പിക്കുന്ന ദാരുണത/കാഠിന്യവും നിലനിർത്തുന്നു; ‘ഭാരമുള്ള’ എന്ന വാക്കുതോറുമുള്ള പരിഭാഷ ഒഴിവാക്കി.
- source_word: וַיַּעַשׂ ... אֵבֶל שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം ദുഃഖാചരണം നടത്തി
  rationale: עשה + אֵבֶל എന്നത് ഒരു ഔപചാരിക ദുഃഖകാലം ആചരിക്കുക എന്ന പ്രയോഗമാണ്; മലയാളത്തിൽ ‘ദുഃഖാചരണം നടത്തി’ അതിന്റെ കാലപരവും ആചാരപരവുമായ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: לְאָבִיו
  choice: തന്റെ അപ്പനുവേണ്ടി
  rationale: ഏകവചന പുംലിംഗ പ്രത്യയത്തെ കൃത്യമായി നിലനിർത്തുകയും, സന്ദർഭത്തിലെ യോസേഫിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ബഹുവചന ക്രിയകൾക്കുശേഷമുള്ള וַיַּעַשׂ എന്ന ഏകവചന ക്രിയയുടെ കർത്താവ്
  choice: ‘അവൻ ... ദുഃഖാചരണം നടത്തി’ എന്നു ഏകവചനം നിലനിർത്തി; സന്ദർഭത്തിൽ ഇത് യോസേഫിനെ സൂചിപ്പിക്കുന്നു.
  alternative: കൂട്ടത്തെ ഉദ്ദേശിച്ചതായി കണ്ട് ‘അവർ ... ദുഃഖാചരണം നടത്തി’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: മസോറെറ്റിക് പാഠം ‘അവർ എത്തി/വിലപിച്ചു’ എന്ന ബഹുവചനത്തിൽനിന്ന് വ്യക്തമായി ഏകവചനത്തിലേക്കു മാറുന്നു. അതിനെ മിനുക്കി ബഹുവചനമാക്കാതെ പാഠത്തിലെ മാറ്റവും യോസേഫിനുള്ള സാധ്യതയുള്ള ഊന്നലും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘മെതിക്കളം,’ ‘വിലാപം കഴിച്ചു,’ ‘ദുഃഖാചരണം നടത്തി’ എന്നീ പദപ്രയോഗങ്ങൾ കൃഷിസ്ഥലം, പൊതുവിലാപം, ഏഴുദിവസത്തെ ഔപചാരിക ദുഃഖകാലം എന്നിവ വേർതിരിച്ചു വ്യക്തമാക്കുന്നു. സ്ഥലപരമായും കർത്താവിനെക്കുറിച്ചുമുള്ള മൂലപാഠത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
