id: GEN.50.5
reference: Genesis 50:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָבִ֞/י הִשְׁבִּיעַ֣/נִי לֵ/אמֹ֗ר הִנֵּ֣ה אָנֹכִי֮ מֵת֒ בְּ/קִבְרִ֗/י אֲשֶׁ֨ר כָּרִ֤יתִי לִ/י֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן שָׁ֖מָּ/ה תִּקְבְּרֵ֑/נִי וְ/עַתָּ֗ה אֶֽעֱלֶה נָּ֛א וְ/אֶקְבְּרָ֥ה אֶת אָבִ֖/י וְ/אָשֽׁוּבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/005.yaml
  text: My father made me swear, saying, ‘Look, I am dying. In my grave that I dug for myself in the land of Canaan, there you shall bury me.’ So now, please let me go up and bury my father; then I will return.
translation:
  language: ml
  text: '“എന്റെ അപ്പൻ എന്നെക്കൊണ്ട് സത്യം ചെയ്യിച്ച് ഇങ്ങനെ പറഞ്ഞു: ‘ഇതാ, ഞാൻ മരിക്കാൻ പോകുന്നു. കനാൻദേശത്ത് എനിക്കായി ഞാൻ വെട്ടിയുണ്ടാക്കിയ കല്ലറയിൽത്തന്നെ നീ എന്നെ അടക്കണം.’ അതുകൊണ്ട് ഇപ്പോൾ, ദയവായി എന്നെ പോകാൻ അനുവദിക്കണം; ഞാൻ ചെന്ന് എന്റെ അപ്പനെ അടക്കിയശേഷം മടങ്ങിവരാം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁבִּיעַנִי
  choice: എന്നെക്കൊണ്ട് സത്യം ചെയ്യിച്ച്
  rationale: ഹിഫ്ഇൽ രൂപത്തിന്റെ നിർബന്ധിപ്പിക്കുന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הִנֵּה אָנֹכִי מֵת
  choice: ഇതാ, ഞാൻ മരിക്കാൻ പോകുന്നു
  rationale: הִנֵּה എന്ന ശ്രദ്ധാകർഷക പദവും מֵת എന്ന സമീപമരണത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: כָּרִיתִי
  choice: വെട്ടിയുണ്ടാക്കിയ
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘വെട്ടുക/കുഴിച്ചുണ്ടാക്കുക’ സംരക്ഷിക്കുന്നു; പാറയിൽ വെട്ടിയ കല്ലറ എന്ന സാധ്യതയെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: אֶעֱלֶה נָּא
  choice: ദയവായി എന്നെ പോകാൻ അനുവദിക്കണം; ഞാൻ ചെന്ന്
  rationale: ഫറവോനോടുള്ള അപേക്ഷാസന്ദർഭത്തിൽ נָאയുടെ വിനയവും אעלהയുടെ യാത്രാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְאָשׁוּבָה
  choice: മടങ്ങിവരാം
  rationale: യോസേഫിന്റെ മടങ്ങിവരാനുള്ള ഉറപ്പ് ലളിതവും നേരിട്ടുമായ രീതിയിൽ പകരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പിതാവിന്റെ നേരിട്ടുള്ള വാക്കുകളും യോസേഫിന്റെ വിനയപൂർവമായ അപേക്ഷയും നിലനിർത്തി.
