  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘മെതിക്കളം’, ‘വിലാപം’ തുടങ്ങിയ പരിചിതവും കൃത്യവുമായ പദങ്ങൾ ഉപയോഗിച്ചു; എബ്രായ വാക്യഘടനയിലെ അസ്വാഭാവികത മലയാളത്തിലേക്ക് യാന്ത്രികമായി മാറ്റിയിട്ടില്ല.
