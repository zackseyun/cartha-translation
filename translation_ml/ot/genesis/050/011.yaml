source:
  edition: WLC
  text: וַ/יַּ֡רְא יוֹשֵׁב֩ הָ/אָ֨רֶץ הַֽ/כְּנַעֲנִ֜י אֶת הָ/אֵ֗בֶל בְּ/גֹ֨רֶן֙ הָֽאָטָ֔ד וַ/יֹּ֣אמְר֔וּ אֵֽבֶל כָּבֵ֥ד זֶ֖ה לְ/מִצְרָ֑יִם עַל כֵּ֞ן קָרָ֤א שְׁמָ/הּ֙ אָבֵ֣ל מִצְרַ֔יִם אֲשֶׁ֖ר בְּ/עֵ֥בֶר הַ/יַּרְדֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/011.yaml
  text: When the inhabitants of the land[a], the Canaanites, saw the mourning at the threshing floor of Atad, they said, “This is a grievous mourning for the Egyptians.” Therefore its name was called Abel-mizraim[c][b], which is beyond the Jordan.
translation:
  language: ml
  text: കനാന്യരായ ദേശവാസികൾ ആതാദിന്റെ മെതിക്കളത്തിലെ വിലാപം കണ്ടപ്പോൾ, “ഇത് ഈജിപ്തുകാർക്കുള്ള അതിദാരുണമായ വിലാപമാണ്” എന്നു പറഞ്ഞു. അതുകൊണ്ട് യോർദാന്റെ അക്കരെയുള്ള[b] ആ സ്ഥലത്തിന് ആബേൽ-മിസ്രയീം[a] എന്നു പേരായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആബേൽ-മിസ്രയീം” എന്ന പേര് “ഈജിപ്തിന്റെ വിലാപം” എന്നർഥം സൂചിപ്പിക്കുന്നു; കനാന്യർ സംഭവത്തെ വിശേഷിപ്പിച്ച വാക്കുകളുമായുള്ള ശബ്ദ-അർഥബന്ധം ഈ പേരിലുണ്ട്.
    reason: സ്ഥലപ്പേരിലെ എബ്രായ ശബ്ദകളിയും അർഥബന്ധവും പരിഭാഷയിൽ നേരിട്ട് നിലനിർത്താനാവാത്തതിനാൽ.
  - marker: b
    text: അഥവാ “യോർദാന്റെ മറുവശത്തുള്ള”; ഈ പ്രയോഗത്തിന്റെ ദിശ സംസാരിക്കുന്നയാളുടെ ഭൂമിശാസ്ത്രപരമായ കാഴ്ചപ്പാടിനെ ആശ്രയിച്ചിരിക്കുന്നു.
    reason: ഭൂമിശാസ്ത്രപരമായി ദൃക്കോൺ-ആശ്രിതമായ പ്രയോഗത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം നിലനിർത്താൻ.
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַכְּנַעֲנִי
  choice: കനാന്യരായ ദേശവാസികൾ
  rationale: ഏകവചനത്തിലുള്ള പങ്കാളിത്തരൂപം ഇവിടെ ഒരു സമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ബഹുവചനക്രിയയും അതു വ്യക്തമാക്കുന്നു. കനാന്യർ എന്ന തിരിച്ചറിയൽ സ്വാഭാവികമായ വിശേഷണഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: הָאֵבֶל
  choice: വിലാപം
  rationale: മരണത്തോടനുബന്ധിച്ച ദുഃഖാചരണമാണ് സന്ദർഭം. സ്ഥലനാമത്തിലെ אֵבֶל എന്ന ശബ്ദസാമ്യവും അടിക്കുറിപ്പിലൂടെ നിലനിർത്താം.
- source_word: בְּגֹרֶן הָאָטָד
  choice: ആതാദിന്റെ മെതിക്കളത്തിൽ
  rationale: גֹרֶן ധാന്യം മെതിക്കുന്ന സ്ഥലമാണ്; בְּ ഇവിടെ സ്ഥലസൂചനയായി സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: אֵבֶל כָּבֵד
  choice: അതിദാരുണമായ വിലാപം
  rationale: כָּבֵד എന്നതിന്റെ അക്ഷരാർഥം ‘ഭാരമുള്ള’ എന്നാണെങ്കിലും ഇവിടെ വിലാപത്തിന്റെ തീവ്രതയാണ് സൂചിപ്പിക്കുന്നത്. ‘അതിദാരുണമായ’ എന്നത് ആ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: לְמִצְרָיִם
  choice: ഈജിപ്തുകാർക്കുള്ള
  rationale: രൂപം ‘ഈജിപ്ത്’ എന്ന സ്ഥലനാമമാണെങ്കിലും ഈ സന്ദർഭത്തിൽ ഈജിപ്ഷ്യൻ സംഘവുമായി ബന്ധപ്പെട്ട വിലാപത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആരെയാണ് അവർ വിലപിക്കുന്നതെന്ന് തെറ്റായി നിർണ്ണയിക്കാതെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: קָרָא שְׁמָהּ
  choice: ആ സ്ഥലത്തിന് … എന്നു പേരായി
  rationale: പേരിട്ട വ്യക്തിയെ എബ്രായം വ്യക്തമാക്കുന്നില്ല. മലയാളത്തിലെ ഈ അകർതൃപ്രയോഗം അനിശ്ചിത കർത്താവിനെ ചേർക്കാതെ നാമകരണസൂത്രത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אָבֵל מִצְרַיִם
  choice: ആബേൽ-മിസ്രയീം
  rationale: സ്ഥലപ്പേര് ലിപ്യന്തരണം ചെയ്യുന്നു; אֵבֶל (‘വിലാപം’) എന്നതുമായുള്ള ശബ്ദബന്ധവും അർഥസൂചനയും അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദാന്റെ അക്കരെ
  rationale: പ്രസ്താവകന്റെ ഭൂമിശാസ്ത്രപരമായ കാഴ്ചപ്പാടിനെ ആശ്രയിക്കുന്ന ‘യോർദാന്റെ മറുവശം’ എന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു; അതിന്റെ ദൃക്കോൺ-ആശ്രിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
