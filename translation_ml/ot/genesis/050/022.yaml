  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘താമസിച്ചു’ എന്നും ‘ജീവിച്ചു’ എന്നും നൽകി രണ്ട് വ്യത്യസ്ത ഹീബ്രു ക്രിയകളുടെ വ്യത്യാസം നിലനിർത്തി. ‘ഈജിപ്തിൽത്തന്നെ’ എന്നത് വാസം അവിടെ തുടർന്നുവെന്ന സന്ദർഭസൂചന പ്രകടമാക്കുന്നു.
