  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֤שֶׁב יוֹסֵף֙ בְּ/מִצְרַ֔יִם ה֖וּא וּ/בֵ֣ית אָבִ֑י/ו וַ/יְחִ֣י יוֹסֵ֔ף מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/022.yaml
  text: Joseph remained in Egypt[a], he and his father's household, and Joseph lived 110 years.
translation:
  language: ml
  text: യോസേഫും അവന്റെ പിതാവിന്റെ കുടുംബവും ഈജിപ്തിൽത്തന്നെ താമസിച്ചു[a]. യോസേഫ് 110 വർഷം ജീവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യോസേഫ് ഈജിപ്തിൽ വസിച്ചു—അവനും അവന്റെ പിതാവിന്റെ ഭവനവും.’
    reason: ישב എന്നതിന് ‘വസിച്ചു’ എന്നും בֵית אָבִיו എന്നതിന് അക്ഷരാർഥത്തോട് അടുത്ത് ‘പിതാവിന്റെ ഭവനം’ എന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചു
  rationale: ישב എന്ന ക്രിയയ്ക്ക് ‘വസിക്കുക, താമസിക്കുക, തുടരുക’ എന്നീ അർഥങ്ങളുണ്ട്. യാക്കോബിന്റെ മരണശേഷവും ഈജിപ്തിലെ വാസം തുടർന്നുവെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി അറിയിക്കാൻ ‘ഈജിപ്തിൽത്തന്നെ താമസിച്ചു’ എന്നു നൽകി; വാക്യത്തിന്റെ പിന്നിലെ וַיְחִי-യിൽനിന്ന് വേർതിരിച്ചും നിർത്തുന്നു.
- source_word: בְּמִצְרַיִם
  choice: ഈജിപ്തിൽ
  rationale: യോസേഫും പിതാവിന്റെ കുടുംബവും താമസിച്ച സ്ഥലം സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള സ്ഥാനവാചക പ്രയോഗം.
- source_word: הוּא וּבֵית אָבִיו
  choice: യോസേഫും അവന്റെ പിതാവിന്റെ കുടുംബവും
  rationale: בֵּית ഇവിടെ കെട്ടിടത്തെക്കാൾ കുടുംബം/ഗൃഹസമൂഹം എന്ന സാമൂഹിക അർഥത്തിലാണ്. ‘കുടുംബം’ സാധാരണ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്; ഹീബ്രുവിലെ ആവർത്തിച്ച സർവനാമത്തെ പേരുപയോഗിച്ച് വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: וַיְחִי
  choice: ജീവിച്ചു
  rationale: യോസേഫിന്റെ ആകെ ആയുസ്സ് പ്രസ്താവിക്കുന്നതിനുള്ള സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: מֵאָה וָעֶשֶׂר שָׁנִים
  choice: 110 വർഷം
  rationale: ഹീബ്രുവിലെ കൃത്യമായ പ്രായസംഖ്യ ആധുനിക വായനാസൗകര്യത്തിനായി അക്കങ്ങളിൽ നൽകി.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ പേരുരൂപം സ്വീകരിച്ചു.
