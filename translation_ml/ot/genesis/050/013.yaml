  text: וַ/יִּשְׂא֨וּ אֹת֤/וֹ בָנָי/ו֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יִּקְבְּר֣וּ אֹת֔/וֹ בִּ/מְעָרַ֖ת שְׂדֵ֣ה הַ/מַּכְפֵּלָ֑ה אֲשֶׁ֣ר קָנָה֩ אַבְרָהָ֨ם אֶת הַ/שָּׂדֶ֜ה לַ/אֲחֻזַּת קֶ֗בֶר מֵ/אֵ֛ת עֶפְרֹ֥ן הַ/חִתִּ֖י עַל פְּנֵ֥י מַמְרֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/013.yaml
  text: His sons carried him to the land of Canaan and buried him in the cave of the field of Machpelah[a], which Abraham had bought with the field as a burial property from Ephron the Hittite[c][b], opposite Mamre.
translation:
  language: ml
  text: അവന്റെ പുത്രന്മാർ അവനെ കനാൻദേശത്തേക്കു കൊണ്ടുപോയി, മമ്രേയ്ക്കു നേരെയുള്ള മക്പേലാ വയലിന്റെ ഗുഹയിൽ അടക്കം ചെയ്തു. ശവകുടീരത്തിനുള്ള സ്വത്തായി അബ്രാഹാം ഹിത്യനായ എഫ്രോനിൽനിന്ന് വാങ്ങിയ വയലായിരുന്നു അത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ശവകുടീരത്തിനുള്ള ഒരു അവകാശസ്വത്തായി.” എബ്രായപ്രയോഗം സംസ്കാരത്തിനായി അബ്രാഹാം സ്വന്തമാക്കിയ ഭൂസ്വത്തിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: അവനെ കൊണ്ടുപോയി
  rationale: נשׂא ഇവിടെ യാക്കോബിന്റെ മൃതദേഹം കനാൻദേശത്തേക്കു കൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി പ്രവർത്തിയുടെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: בָנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: എബ്രായപദം വ്യക്തമായി പുരുഷലിംഗ ബഹുവചനമായ ‘പുത്രന്മാർ’ എന്നാണ്; ആ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: אַרְצָה כְּנַעַן
  choice: കനാൻദേശത്തേക്കു
  rationale: ദിശാസൂചക പ്രത്യയത്തോടുകൂടിയ പ്രയോഗം ‘കനാൻദേശത്തേക്ക്’ എന്ന അർഥം നൽകുന്നു.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: അടക്കം ചെയ്തു
  rationale: קבר എന്ന ക്രിയയുടെ വ്യക്തവും മാന്യവും ആധുനികവുമായ മലയാളരൂപം.
- source_word: בִּמְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: മക്പേലാ വയലിലെ ഗുഹയിൽ
  rationale: എബ്രായത്തിലെ ഗുഹ–വയൽ–മക്പേലാ ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായ സ്ഥലബന്ധമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: ആ വയലും ഗുഹയും ... അബ്രാഹാം ... വാങ്ങിയതായിരുന്നു
  rationale: എബ്രായത്തിലെ പുനരുക്ത കർമഘടനയെ വാക്കുതോറും പകർത്താതെ, വാങ്ങിയത് വയലാണെന്നും ഗുഹ അതിന്റെ ഭാഗമാണെന്നും സന്ദർഭപ്രകാരം വ്യക്തമാക്കുന്നു.
- source_word: לַאֲחֻזַּת קֶבֶר
  choice: ശ്മശാനാവകാശമായി
  rationale: אֲחֻזָּה സ്ഥിരമായ ഉടമസ്ഥാവകാശത്തെയും קֶבֶר സംസ്കാരലക്ഷ്യത്തെയും സൂചിപ്പിക്കുന്നു; ഇരുവശവും ചുരുക്കത്തിൽ നിലനിർത്തുന്നു.
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: ഹിത്യനായ എഫ്രോനിൽനിന്നു
  rationale: വ്യക്തിനാമവും ജനവിഭാഗസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: മമ്രേയ്ക്കു നേരെയുള്ള
  rationale: മമ്രേയോടുള്ള സ്ഥാനബന്ധം ‘മുന്നിൽ/അഭിമുഖമായി/എതിർവശത്ത്’ എന്ന പരിധിയിൽ വ്യക്തമാക്കുന്നു; ‘അടുത്ത്’ എന്നു പരിമിതപ്പെടുത്തുന്നില്ല.
