translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യമായ കഥനശൈലി. ‘പുത്രന്മാർ’, ‘അടക്കം ചെയ്തു’, ‘ശ്മശാനാവകാശം’ എന്നീ പദങ്ങൾ മൂലത്തിന്റെ കൃത്യതയും സാധാരണ വായനക്കാരനുള്ള വ്യക്തതയും സമന്വയിപ്പിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
