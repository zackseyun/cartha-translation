  text: So they sent word to Joseph[a], saying, “Your father commanded before his death, saying,”
translation:
  language: ml
  text: 'അതിനാൽ അവർ യോസേഫിന് ഇങ്ങനെ സന്ദേശം അയച്ചു[a]: “നിന്റെ അപ്പൻ മരിക്കുന്നതിനുമുമ്പ് ഇങ്ങനെ കല്പിച്ചിരുന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവർ യോസേഫിനോടു കല്പിച്ചു, ഇങ്ങനെ പറഞ്ഞു.” എബ്രായ ക്രിയയ്ക്ക് സാധാരണയായി “കല്പിക്കുക” എന്നാണ് അർഥം; എന്നാൽ ഇവിടെ യോസേഫിന് ഒരു സന്ദേശം അയച്ചതിനെ അത് സൂചിപ്പിക്കുന്നതായിരിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוּוּ
  choice: അവർ … സന്ദേശമയച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ സാധാരണ അർഥം ‘കല്പിക്കുക’ എന്നാണ്. എന്നാൽ אֶל יוֹסֵף എന്ന പ്രയോഗവും തുടർന്ന് വരുന്ന പരോക്ഷ ഉദ്ധരണിയും കണക്കിലെടുക്കുമ്പോൾ, ഇവിടെ യോസേഫിന് ഒരു സന്ദേശം എത്തിച്ചതാണ് സന്ദർഭസഹജമായ അർഥം. കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: אֶל יוֹסֵף
  choice: യോസേഫിന്
  rationale: സന്ദേശം ലഭിക്കുന്ന വ്യക്തിയെ മലയാളത്തിലെ സ്വാഭാവിക ദത്തിവിഭക്തിയിലൂടെ സൂചിപ്പിക്കുന്നു.
- source_word: לֵאמֹר (first occurrence)
  choice: ഇങ്ങനെ
  rationale: ആദ്യത്തെ לֵאמֹר ഉദ്ധരിക്കപ്പെടുന്ന സന്ദേശത്തെ പരിചയപ്പെടുത്തുന്നു; ‘ഇങ്ങനെ സന്ദേശമയച്ചു’ എന്നത് മലയാളത്തിലെ സ്വാഭാവിക കഥനരീതിയാണ്.
- source_word: אָבִיךָ
  choice: നിന്റെ അപ്പൻ
  rationale: യോസേഫിനോടുള്ള നേരിട്ടുള്ള ഏകവചന അഭിസംബോധനയും കുടുംബസന്ദർഭത്തിലെ സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചിരുന്നു
  rationale: രണ്ടാമത്തെ צוה അതിന്റെ സാധാരണവും ശക്തവുമായ ‘കല്പിക്കുക’ എന്ന അർഥത്തിൽ നിലനിർത്തുന്നു; അടുത്ത വാക്യത്തിൽ കല്പനയുടെ ഉള്ളടക്കം വരുന്നതും ഇതിന് യോജിക്കുന്നു.
- source_word: לִפְנֵי מוֹתוֹ
  choice: മരിക്കുന്നതിനുമുമ്പ്
  rationale: ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമായ കാലസൂചന നൽകുന്നു.
- source_word: לֵאמֹר (second occurrence)
  choice: 'ഇങ്ങനെ … :'
  rationale: പിതാവിന്റെ കല്പനയുടെ ഉദ്ധരണി അടുത്ത വാക്യത്തിൽ തുടരുമെന്ന് സൂചിപ്പിക്കാൻ രണ്ടാമത്തെ സംഭാഷണപരിചയപ്പെടുത്തൽ ‘ഇങ്ങനെ’ എന്നും ദ്വിബിന്ദുവും ഉപയോഗിച്ച് നിലനിർത്തുന്നു.
