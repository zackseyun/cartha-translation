  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל אֶחָ֔י/ו אָנֹכִ֖י מֵ֑ת וֵֽ/אלֹהִ֞ים פָּקֹ֧ד יִפְקֹ֣ד אֶתְ/כֶ֗ם וְ/הֶעֱלָ֤ה אֶתְ/כֶם֙ מִן הָ/אָ֣רֶץ הַ/זֹּ֔את אֶל הָ/אָ֕רֶץ אֲשֶׁ֥ר נִשְׁבַּ֛ע לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/024.yaml
  text: And Joseph said to his brothers[a], “I am dying, but God will surely visit you and bring you up from this land to the land that he swore to Abraham, to Isaac, and to Jacob.”
translation:
  language: ml
  text: 'യോസേഫ് തന്റെ സഹോദരന്മാരോടു പറഞ്ഞു: “ഞാൻ മരിക്കാൻ പോകുകയാണ്. എന്നാൽ ദൈവം നിങ്ങളെ നിശ്ചയമായും സന്ദർശിക്കുകയും[a] ഈ ദേശത്തുനിന്ന് അബ്രാഹാമിനോടും യിസ്ഹാക്കിനോടും യാക്കോബിനോടും ചെയ്ത സത്യം അനുസരിച്ചുള്ള ദേശത്തേക്ക് നിങ്ങളെ കൊണ്ടുയർത്തുകയും ചെയ്യും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളെ നിശ്ചയമായും ശ്രദ്ധിക്കും.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പ്രയോഗം ദൈവം തന്റെ ജനത്തെ പ്രത്യേകം ശ്രദ്ധിച്ച് അവർക്കുവേണ്ടി നിർണായകമായി ഇടപെടുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: തന്റെ സഹോദരന്മാരോട്
  rationale: വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായ ഈ പദം ഉല്പത്തിയിലെ സന്ദർഭത്തിൽ യോസേഫിന്റെ ആൺസഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אָנֹכִי מֵת
  choice: ഞാൻ മരിക്കാറായിരിക്കുന്നു
  rationale: പങ്കാളിക്രിയാപ്രയോഗം ആസന്നമായ മരണത്തെ സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം അതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: פָּקֹד יִפְקֹד
  choice: നിശ്ചയമായും സന്ദർശിച്ച്
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും അപൂർണക്രിയയും ചേർന്ന പ്രയോഗം ഉറപ്പും ഊന്നലും നൽകുന്നു. ‘സന്ദർശിക്കുക’ എന്നത് ദൈവം തന്റെ ജനത്തെ ശ്രദ്ധിച്ച് അവർക്കുവേണ്ടി നിർണായകമായി ഇടപെടുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: וֵאלֹהִים
  choice: എന്നാൽ ദൈവം
  rationale: യോസേഫിന്റെ ആസന്നമരണവും തുടർന്നുള്ള ദൈവികപ്രവർത്തനവും തമ്മിലുള്ള ആശയവ്യത്യാസം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: וְהֶעֱלָה אֶתְכֶם
  choice: നിങ്ങളെ കൊണ്ടുപോകും
  rationale: ഹിഫീൽ രൂപം ‘കയറിപ്പോകാൻ ഇടയാക്കുക/മുകളിലേക്ക് കൊണ്ടുപോകുക’ എന്നാണ്; മലയാളത്തിൽ ലക്ഷ്യദേശത്തേക്കുള്ള നീക്കം സ്വാഭാവികമായി പറയാൻ ‘കൊണ്ടുപോകും’ ഉപയോഗിച്ചു, ദിശാഭാവം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: מִן הָאָרֶץ הַזֹּאת
  choice: ഈ ദേശത്തുനിന്ന്
  rationale: മുൻപ്രത്യയവും നിർദ്ദേശകപദവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ഇവിടെ ഈ ദേശം ഈജിപ്താണ്.
- source_word: אֶל הָאָרֶץ אֲשֶׁר נִשְׁבַּע
  choice: താൻ സത്യംചെയ്ത ദേശത്തേക്ക്
  rationale: ‘സത്യംചെയ്യുക’ എന്ന മൂലക്രിയയെ നിലനിർത്തുന്നു; ‘നൽകുമെന്ന്’ എന്ന ആശയം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നുവെങ്കിലും ഹീബ്രുവിൽ തുറന്നുപറയാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: അബ്രാഹാമിനോടും യിസ്ഹാക്കിനോടും യാക്കോബിനോടും
  rationale: ഓരോ പിതൃപുരുഷന്റെയും പേരോടൊപ്പമുള്ള ഹീബ്രു മുൻപ്രത്യയം മലയാളത്തിലെ ‘-ഓട്’ രൂപത്തിലൂടെ ആവർത്തിച്ച് ഗൗരവമുള്ള പട്ടികാഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: פָּקֹד יִפְקֹד എന്ന പ്രയോഗത്തിലെ ദൈവികപ്രവർത്തനത്തിന്റെ സ്വഭാവം
  choice: ദൈവം നിശ്ചയമായും സന്ദർശിക്കും—അതായത്, തന്റെ ജനത്തെ ശ്രദ്ധിച്ച് അവർക്കുവേണ്ടി നിർണായകമായി ഇടപെടും
  alternative: ദൈവം നിശ്ചയമായും നിങ്ങളെ ഓർക്കും / നിങ്ങളുടെ സഹായത്തിനെത്തും
  rationale: ഹീബ്രു ഘടന പ്രവർത്തനത്തിന്റെ ഉറപ്പിനെ ഊന്നുന്നു. മുഖ്യപാഠത്തിലെ ‘സന്ദർശിക്കുക’ മൂലപ്രയോഗത്തിന്റെ രൂപകവും വ്യാപ്തിയും സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് അതിനെ വെറും സാന്നിധ്യസന്ദർശനമായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ദൈവത്തിന്റെ ഉടമ്പടിസംബന്ധമായ ഇടപെടൽ എന്ന ആശയം അമിതമായി വിശദീകരിക്കാതെ, ഹീബ്രുവിലെ രൂപകവും അർഥവ്യാപ്തിയും അടിക്കുറിപ്പോടെ നിലനിർത്തി.
