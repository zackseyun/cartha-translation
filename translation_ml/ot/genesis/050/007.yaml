source:
  edition: WLC
  text: וַ/יַּ֥עַל יוֹסֵ֖ף לִ/קְבֹּ֣ר אֶת אָבִ֑י/ו וַ/יַּֽעֲל֨וּ אִתּ֜/וֹ כָּל עַבְדֵ֤י פַרְעֹה֙ זִקְנֵ֣י בֵית֔/וֹ וְ/כֹ֖ל זִקְנֵ֥י אֶֽרֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/007.yaml
  text: So Joseph went up to bury his father[a], and with him went up all Pharaoh’s servants, the elders of his household, and all the elders of the land of Egypt.
translation:
  language: ml
  text: അങ്ങനെ യോസേഫ് തന്റെ അപ്പനെ അടക്കം ചെയ്യാൻ കയറിപ്പോയി.[a] അവനോടൊപ്പം ഫറവോന്റെ സകല സേവകരും, ഫറവോന്റെ ഭവനത്തിലെ മൂപ്പന്മാരും, ഈജിപ്തുദേശത്തിലെ സകല മൂപ്പന്മാരും കയറിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘കയറിപ്പോയി’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം ഈജിപ്തിൽനിന്ന് കനാനിലേക്കുള്ള യാത്രയെ പതിവായി വിവരിച്ചിരുന്ന രീതിയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: പുറപ്പെട്ടു
  rationale: עָלָה എന്നതിന് അക്ഷരാർഥത്തിൽ ‘കയറിപ്പോകുക’ എന്നാണെങ്കിലും, ഈജിപ്തിൽനിന്ന് കനാനിലേക്കുള്ള യാത്രയെ സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ എബ്രായ പ്രയോഗമാണിത്. മലയാളത്തിൽ ‘കയറിപ്പോയി’ അസ്വാഭാവികമാകുന്നതിനാൽ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘പുറപ്പെട്ടു’ ഉപയോഗിച്ച് സാംസ്കാരിക സൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לִקְבֹּר
  choice: അടക്കം ചെയ്യാൻ
  rationale: קָבַר എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘അടക്കം ചെയ്യുക’ എന്നതാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം.
- source_word: אָבִיו
  choice: തന്റെ അപ്പനെ
  rationale: മൂന്നാംപുരുഷ പ്രത്യയം ലളിതമായി പ്രതിഫലിപ്പിക്കുന്നു. യോസേഫിനോടുള്ള ആത്മവാചകബന്ധം വ്യക്തമാക്കാൻ ‘തന്റെ’ ഉപയോഗിച്ചു; അനാവശ്യ ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: וַיַּעֲלוּ אִתּוֹ
  choice: അവനോടൊപ്പം ... പുറപ്പെട്ടു
  rationale: യാത്രയിൽ പങ്കുചേർന്നതും עָלָהയുടെ ആവർത്തനവും നിലനിർത്താൻ ആദ്യ ക്രിയയോടൊത്ത ‘പുറപ്പെട്ടു’ വീണ്ടും ഉപയോഗിച്ചു.
- source_word: כָּל עַבְדֵי פַרְעֹה
  choice: ഫറവോന്റെ സകല സേവകരും
  rationale: עֶבֶד ‘ദാസൻ/സേവകൻ’ എന്ന വിശാല അർഥമുള്ള പദമാണ്. രാജസഭാ സന്ദർഭത്തിൽ പദവിയെ അനാവശ്യമായി നിർണ്ണയിക്കാതെ ‘സേവകർ’ ഉപയോഗിക്കുന്നു.
- source_word: זִקְנֵי בֵיתוֹ
  choice: അവന്റെ ഭവനത്തിലെ മൂപ്പന്മാരും
  rationale: זָקֵן എന്ന പദത്തിന്റെ ‘മൂപ്പൻ’ എന്ന അർഥം സംരക്ഷിക്കുന്നു. בַּיִת ഇവിടെ ഫറവോന്റെ രാജഭവനമോ ഗൃഹസ്ഥാപനമോ സൂചിപ്പിക്കാമെന്ന തുറന്ന നില ‘ഭവനം’ നിലനിർത്തുന്നു.
- source_word: וְכֹל זִקְנֵי אֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തിലെ സകല മൂപ്പന്മാരും
  rationale: ‘മൂപ്പന്മാർ’ എന്നും ‘ദേശം’ എന്നും മൂലപാഠത്തിലെ രണ്ടു ഘടകങ്ങളും സംരക്ഷിച്ച്, ഫറവോന്റെ ഭവനത്തിനു പുറത്തുള്ള വിപുലമായ നേതൃത്വത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഫറവോൻ,’ ‘മൂപ്പന്മാർ,’ ‘ഈജിപ്തുദേശം’ എന്നീ പരിചിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; എബ്രായ ഭൂമിശാസ്ത്രപ്രയോഗം മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ മുഖ്യപാഠത്തിൽ സ്വാഭാവിക രൂപവും അടിക്കുറിപ്പിൽ അക്ഷരാർഥവും നൽകി.
