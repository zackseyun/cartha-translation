id: GEN.50.19
reference: Genesis 50:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר אֲלֵ/הֶ֛ם יוֹסֵ֖ף אַל תִּירָ֑אוּ כִּ֛י הֲ/תַ֥חַת אֱלֹהִ֖ים אָֽנִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/019.yaml
  text: But Joseph said to them[a], “Do not fear, for am I in the place of God?”
translation:
  language: ml
  text: 'എന്നാൽ യോസേഫ് അവരോടു പറഞ്ഞു: “ഭയപ്പെടേണ്ടാ; ഞാൻ ദൈവത്തിന്റെ സ്ഥാനത്താണോ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഞാൻ ദൈവത്തിന്റെ കീഴിലാണോ?” എബ്രായ പ്രയോഗം ഒന്നിലധികം വിധത്തിൽ ഗ്രഹിക്കാവുന്നതാണ്; ഈ സന്ദർഭത്തിൽ “ഞാൻ ദൈവത്തിന്റെ സ്ഥാനത്താണോ?” എന്ന അർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: എബ്രായ ആഖ്യാനത്തിലെ אמר എന്ന ക്രിയയുടെ സാധാരണവും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: אֲלֵהֶם
  choice: അവരോടു
  rationale: אל എന്ന പൂർവപ്രത്യയവും ബഹുവചന സർവനാമപ്രത്യയവും ചേർന്ന് വാക്കുകളുടെ അഭിസംബോധിതരെ സൂചിപ്പിക്കുന്നു.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: പേരിന്റെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണം.
- source_word: אַל תִּירָאוּ
  choice: ഭയപ്പെടേണ്ടാ
  rationale: നിഷേധാത്മക ആജ്ഞയുടെ ശക്തി സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כִּי
  choice: —
  rationale: ഇവിടെ കാരണം/വിശദീകരണം അവതരിപ്പിക്കുന്ന כִּי എന്ന ബന്ധകത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ അർധവിരാമത്തിനു ശേഷമുള്ള വാചകക്രമം സ്വാഭാവികമായി വഹിക്കുന്നു; ‘കാരണം’ ചേർത്താൽ അല്പം കൃത്രിമമാകും.
- source_word: הֲתַחַת
  choice: സ്ഥാനത്താണോ
  rationale: תחת എന്ന പദം ഇവിടെ ദൈവത്തിന്റെ പങ്ക് ഏറ്റെടുക്കുക അഥവാ ദൈവത്തിനു പകരം നിൽക്കുക എന്ന പ്രയോഗാർഥത്തിലാണ്; ‘സ്ഥാനത്ത്’ ആ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവത്തിന്റെ
  rationale: സന്ദർഭത്തിൽ ഏകവചനമായ ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഷഷ്ഠീവിഭക്തി ‘സ്ഥാനത്ത്’ എന്നതിനോടു സ്വാഭാവികമായി ചേരുന്നു.
- source_word: אָנִי
  choice: ഞാൻ
  rationale: സ്വതന്ത്ര സർവനാമം നിലനിർത്തുന്നത് വാചാടോപചോദ്യത്തിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക അധികാരത്തെക്കുറിച്ചുള്ള യോസേഫിന്റെ വാചാടോപചോദ്യത്തിന്റെ അർഥം
  choice: വിധികർത്താവോ പ്രതികാരം നടത്തുന്നവനോ ആയി താൻ ദൈവത്തിന്റെ സ്ഥാനം വഹിക്കുന്നില്ലെന്ന് യോസേഫ് വ്യക്തമാക്കുന്നു.
  alternative: താൻ ദൈവത്തിന്റെ കീഴിലാണോ എന്ന് യോസേഫ് ചോദിക്കുന്നു.
  rationale: സഹോദരന്മാരുടെ പ്രതികാരഭീതിയും തുടർന്നുള്ള വാക്യത്തിലെ ദൈവത്തിന്റെ ഉദ്ദേശ്യത്തെക്കുറിച്ചുള്ള പരാമർശവും പരിഗണിക്കുമ്പോൾ תחת אלהים എന്ന പ്രയോഗം ‘ദൈവത്തിന്റെ സ്ഥാനത്ത്’ എന്നാണ് ഏറ്റവും സ്വാഭാവികമായി മനസ്സിലാകുന്നത്. അതേസമയം അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. വാചാടോപചോദ്യം നിലനിർത്തിയിരിക്കുന്നു; യഥാർഥ എബ്രായ അർഥവൈവിധ്യം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
