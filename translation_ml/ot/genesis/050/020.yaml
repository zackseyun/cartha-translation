id: GEN.50.20
reference: Genesis 50:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַתֶּ֕ם חֲשַׁבְתֶּ֥ם עָלַ֖/י רָעָ֑ה אֱלֹהִים֙ חֲשָׁבָ֣/הּ לְ/טֹבָ֔ה לְמַ֗עַן עֲשֹׂ֛ה כַּ/יּ֥וֹם הַ/זֶּ֖ה לְ/הַחֲיֹ֥ת עַם רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/020.yaml
  text: As for you[a], you intended evil against me, but God intended it for good, in order to bring about what is happening this day—to keep many people alive.
translation:
  language: ml
  text: നിങ്ങളാകട്ടെ, എനിക്കെതിരായി തിന്മ ഉദ്ദേശിച്ചു; എന്നാൽ ഇന്നു കാണുന്നതുപോലെ ആക്കാനും[a] അനേകം ആളുകളെ ജീവനോടെ കാക്കാനും ദൈവം അതിനെ നന്മയ്ക്കായി ഉദ്ദേശിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “ഇന്നുള്ളതുപോലെ ചെയ്യാനും.” ഈ എബ്രായ പ്രയോഗം ഇപ്പോൾ ദൃശ്യമായിരിക്കുന്ന ഫലത്തെ ചൂണ്ടിക്കാണിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲשַׁבְתֶּם / חֲשָׁבָהּ
  choice: ഉദ്ദേശിച്ചു
  rationale: മനുഷ്യരുടെയും ദൈവത്തിന്റെയും ലക്ഷ്യബോധമുള്ള ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്ന ഒരേ എബ്രായ ക്രിയ ഇരിടത്തും ഒരേ മലയാളപദംകൊണ്ട് നിലനിർത്തുന്നു.
- source_word: עָלַי רָעָה
  choice: എനിക്കെതിരായി തിന്മ
  rationale: על ഇവിടെ പ്രതികൂലമായ ദിശയും רָעָה ധാർമികമായി കുറ്റകരമായ തിന്മയും സൂചിപ്പിക്കുന്നു.
- source_word: לְטֹבָה
  choice: നന്മയ്ക്കായി
  rationale: തിന്മയോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְמַעַן עֲשֹׂה
  choice: വരുത്താനും
  rationale: ഉദ്ദേശ്യസൂചകമായ לְמַעַן-ഉം ചരിത്രത്തിൽ ഒരു ഫലം സൃഷ്ടിക്കുന്ന עשה-യുടെ അർഥവും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: כַּיּוֹם הַזֶּה
  choice: ഇന്നുള്ള ഈ സ്ഥിതി
  rationale: ഇപ്പോൾ കൺമുന്നിലുള്ള ഫലത്തെ ചൂണ്ടിക്കാണിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദെയ്ക്റ്റിക് സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: לְהַחֲיֹת עַם רָב
  choice: അനേകം ആളുകളെ ജീവനോടെ കാക്കാനും
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ജീവൻ സംരക്ഷിക്കുക എന്ന അർഥവും വലിയൊരു ജനസമൂഹം എന്ന ആശയവും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: മനുഷ്യരുടെ തിന്മയുള്ള ഉദ്ദേശ്യവും ദൈവത്തിന്റെ നന്മയുള്ള ഉദ്ദേശ്യവും തമ്മിലുള്ള സമാന്തര്യം
  choice: ഇരിടത്തും ‘ഉദ്ദേശിച്ചു’ എന്ന ഒരേ ക്രിയ ഉപയോഗിച്ചു
  alternative: സഹോദരന്മാർ ‘ഉദ്ദേശിച്ചു’, ദൈവം അതിനെ ‘നന്മയാക്കി മാറ്റി’
  rationale: മൂലപാഠം ഒരേ חשב ക്രിയ ആവർത്തിച്ച് മനുഷ്യ ഉത്തരവാദിത്വത്തെയും ദൈവിക പരിപാലനത്തെയും ഒരുമിച്ച് നിലനിർത്തുന്നു. ‘മാറ്റി’ എന്നു പറയുന്നത് മൂലത്തിലെ സമാന്തര്യം ഇല്ലാതാക്കും.
- issue: רָעָה എന്നതിന്റെ ധാർമിക ഭാരം
  choice: തിന്മ
  alternative: ദോഷം
  rationale: സഹോദരന്മാരുടെ പ്രവൃത്തി വെറും ഹാനികരമായ സംഭവം മാത്രമല്ല, ധാർമികമായി കുറ്റകരമായതുമാണ്; അതിനാൽ ‘തിന്മ’ ആ ഭാരം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നിങ്ങളാകട്ടെ’ എന്നത് വാക്യാരംഭത്തിലെ പ്രതിവിരുദ്ധ ഊന്നൽ നിലനിർത്തുന്നു; ദൈവിക പരിപാലനവും മനുഷ്യരുടെ കുറ്റകരമായ ഉദ്ദേശ്യവും തമ്മിലുള്ള പാഠത്തിലെ പിരിമുറുക്കം വിശദീകരിച്ച് തീർക്കാതെ സംരക്ഷിച്ചിരിക്കുന്നു.
