source:
  edition: WLC
  text: וַ/יָּ֣מָת יוֹסֵ֔ף בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִ֑ים וַ/יַּחַנְט֣וּ אֹת֔/וֹ וַ/יִּ֥ישֶׂם בָּ/אָר֖וֹן בְּ/מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/026.yaml
  text: So Joseph died at the age of a hundred and ten years[c][b][a], and they embalmed him and placed him in a coffin in Egypt.
translation:
  language: ml
  text: അങ്ങനെ യോസേഫ് നൂറ്റിപ്പത്ത് വയസ്സുള്ളപ്പോൾ മരിച്ചു. അവർ അവനെ എംബാം ചെയ്ത് ഈജിപ്തിൽ ഒരു ശവപ്പെട്ടിയിൽ വെച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശവപ്പെട്ടി’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദത്തിന് മറ്റു സന്ദർഭങ്ങളിൽ ‘പെട്ടി’ എന്നോ ‘പേടകം’ എന്നോ അർഥം വരാം; ഇവിടെ മൃതദേഹസംസ്കരണത്തിന്റെ പശ്ചാത്തലമാണ് ‘ശവപ്പെട്ടി’ എന്ന അർഥം വ്യക്തമാക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ക്രിയ മരണത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ഭംഗിവാക്ക് ഒഴിവാക്കി സ്വാഭാവികവും കൃത്യവുമായ മലയാളം ഉപയോഗിച്ചു.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: നൂറ്റിപ്പത്തു വയസ്സുള്ളപ്പോൾ
  rationale: പ്രായം സൂചിപ്പിക്കാൻ എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘നൂറ്റിപ്പത്തു വർഷത്തിന്റെ മകൻ’ എന്ന ശൈലിയാണുള്ളത്; അതിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: וַיַּחַנְטוּ
  choice: അവന്റെ മൃതദേഹം സുഗന്ധദ്രവ്യങ്ങൾകൊണ്ട് സംരക്ഷിച്ച്
  rationale: חנט ഈജിപ്ഷ്യൻ പശ്ചാത്തലത്തിൽ മൃതദേഹം കേടുകൂടാതെ സൂക്ഷിക്കാനുള്ള സംസ്കരണത്തെ സൂചിപ്പിക്കുന്നു. ‘എംബാം ചെയ്തു’ എന്ന സാങ്കേതിക വായ്പപദത്തേക്കാൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു; ‘മമ്മിയാക്കി’ എന്നു പറഞ്ഞ് ക്രിയയുടെ അർഥം അനാവശ്യമായി ചുരുക്കിയില്ല.
- source_word: וַיִּישֶׂם
  choice: വെച്ചു
  rationale: שׂים എന്ന സാധാരണ ക്രിയയുടെ സ്വാഭാവിക മലയാളസമാനം; സന്ദർഭത്തിൽ മാന്യതയും വ്യക്തതയും നിലനിൽക്കുന്നു.
- source_word: בָּאָרוֹן
  choice: ഒരു ശവപ്പെട്ടിയിൽ
  rationale: אָרוֹן എന്നതിന് പെട്ടി, പേടകം, ശവപ്പെട്ടി എന്നീ അർഥങ്ങൾ വരാം. മൃതദേഹസംസ്കരണത്തിന്റെ ഈ സന്ദർഭത്തിൽ ‘ശവപ്പെട്ടി’യാണ് കൃത്യമായ അർഥം. ഇവിടെ ആദ്യമായി പരാമർശിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘ഒരു’ സ്വാഭാവികമാണ്.
- source_word: בְּמִצְרָיִם
  choice: ഈജിപ്തിൽ
  rationale: സ്ഥലനാമത്തിന്റെ ആധുനിക നിലവാരത്തിലുള്ള മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: וַ
  choice: അങ്ങനെ
  rationale: ആദ്യത്തെ waw മുൻവിവരണത്തോടുള്ള ബന്ധവും ഉല്പത്തി പുസ്തകത്തിന്റെ സമാപനസ്വഭാവമുള്ള ആഖ്യാനപ്രവാഹവും സൂചിപ്പിക്കുന്നു; ‘അങ്ങനെ’ അത് സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
