translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സാങ്കേതിക വായ്പപദമായ ‘എംബാം’ ഒഴിവാക്കി പ്രവൃത്തിയുടെ അർഥം വ്യക്തമായി പറഞ്ഞു. ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പുകുറികൾ പാഠഘടകങ്ങളോട് പൊരുത്തപ്പെടാതെ സ്ഥാനം മാറിയതായി തോന്നുന്നതിനാൽ, മൂലപാഠത്തിലെ യഥാർഥ പദാർഥവൈവിധ്യം വിശദീകരിക്കുന്ന ഏക അടിക്കുറിപ്പ് ശരിയായ സ്ഥാനത്ത് ചേർത്തു.
