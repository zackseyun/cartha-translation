id: GEN.50.12
reference: Genesis 50:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֥וּ בָנָ֖י/ו ל֑/וֹ כֵּ֖ן כַּ/אֲשֶׁ֥ר צִוָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/012.yaml
  text: So his sons did for him as he had commanded them.
translation:
  language: ml
  text: അവൻ അവരോടു കൽപ്പിച്ചതുപോലെ അവന്റെ പുത്രന്മാർ അവനുവേണ്ടി ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: ചെയ്തു
  rationale: עשה എന്ന ക്രിയയ്ക്ക് ‘ചെയ്യുക/നിർവഹിക്കുക’ എന്ന വിശാല അർഥമുണ്ട്. ഇവിടെ യാക്കോബിന്റെ നിർദേശങ്ങൾ നടപ്പാക്കിയതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘ചെയ്തു’ യോജിക്കുന്നു.
- source_word: בָנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: ഹീബ്രായ പദം പൊതുവായി ‘മക്കൾ’ എന്നല്ല, വ്യക്തമായി ‘പുത്രന്മാർ’ എന്നാണ്; അതിനാൽ ഉറവിടത്തിലെ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: לוֹ
  choice: അവനുവേണ്ടി
  rationale: לֹו ഇവിടെ യാക്കോബിന്റെ പേരിലും ആവശ്യത്തിനുമായി ചെയ്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘അവനുവേണ്ടി’ അതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כֵּן
  choice: അതുപോലെതന്നെ
  rationale: כֵּן പ്രവൃത്തി കല്പനയോട് ഒത്തിരുന്ന രീതിയെ ഊന്നുന്നു. തുടർന്നുള്ള כַּאֲשֶׁר ഘടനയോടൊപ്പം ‘അതുപോലെതന്നെ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: כַּאֲשֶׁר
  choice: കല്പിച്ചതുപോലെതന്നെ
  rationale: താരതമ്യഘടകം യാക്കോബിന്റെ കല്പനയോട് പൂർണമായ അനുരൂപത സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-തുപോലെതന്നെ’ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: צִוָּם
  choice: അവൻ അവരോടു കല്പിച്ചു
  rationale: צוה എന്നത് ‘കല്പിക്കുക’ എന്നാണ്. ക്രിയയിലെ മൂന്നാംപുരുഷ ഏകവചന കർത്താവിനെയും മൂന്നാംപുരുഷ ബഹുവചന കർമത്തെയും ‘അവൻ അവരോടു കല്പിച്ചു’ എന്നു വ്യക്തമാക്കുന്നു; മലയാളത്തിലെ ഉപവാക്യരൂപത്തിൽ മുൻകാലബന്ധം സ്വാഭാവികമായി ഗ്രഹിക്കാം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘കല്പിച്ചു’ എന്ന ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചെങ്കിലും ഇന്നും സ്വാഭാവികമായ പദവും, ഉറവിടത്തിന്റെ വ്യക്തത പാലിക്കാൻ ‘പുത്രന്മാർ’ എന്ന രൂപവും ഉപയോഗിച്ചു.
