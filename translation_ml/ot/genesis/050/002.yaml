  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְצַ֨ו יוֹסֵ֤ף אֶת עֲבָדָי/ו֙ אֶת הָ/רֹ֣פְאִ֔ים לַ/חֲנֹ֖ט אֶת אָבִ֑י/ו וַ/יַּחַנְט֥וּ הָ/רֹפְאִ֖ים אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/002.yaml
  text: Then Joseph commanded his servants[a], the physicians, to embalm his father[b], and the physicians embalmed Israel.
translation:
  language: ml
  text: പിന്നെ യോസേഫ് തന്റെ ദാസന്മാരായ[a] വൈദ്യന്മാരോട് തന്റെ പിതാവിനെ[b] എംബാം ചെയ്യാൻ കൽപ്പിച്ചു; വൈദ്യന്മാർ ഇസ്രായേലിനെ എംബാം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തന്റെ അടിമകളായ’ എന്നും വിവർത്തനം ചെയ്യാം; സന്ദർഭമനുസരിച്ച് ഹീബ്രു പദത്തിന് ‘ദാസന്മാർ’ എന്നോ ‘അടിമകൾ’ എന്നോ അർഥമുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ ‘ഇസ്രായേൽ,’ അതായത് യാക്കോബ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയ അധികാരപൂർവമായ നിർദേശം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘കല്പിച്ചു’ അതിന്റെ ശക്തിയും ആഖ്യാനശൈലിയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: עֲבָדָיו
  choice: തന്റെ ദാസന്മാരായ
  rationale: עבד എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ദാസൻ അല്ലെങ്കിൽ അടിമ എന്നർഥമാകാം. ഇവിടെ യോസേഫിന്റെ കീഴിലുള്ള വൈദ്യന്മാരുടെ സേവനപരമായ പങ്കാണ് മുൻനിരയിൽ; അവരുടെ നിയമപരമായ അടിമസ്ഥിതി വ്യക്തമാക്കുന്നില്ല.
- source_word: הָרֹפְאִים
  choice: വൈദ്യന്മാർ
  rationale: רפא-യിൽനിന്നുള്ള ഈ രൂപം ചികിത്സ നടത്തുന്നവരെ സൂചിപ്പിക്കുന്നു; പുരാതന രാജസഭാസന്ദർഭത്തിന് യോജിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപദമാണ് ‘വൈദ്യന്മാർ’.
- source_word: לַחֲנֹט / וַיַּחַנְטוּ
  choice: സുഗന്ധദ്രവ്യങ്ങൾ ഉപയോഗിച്ച് സംസ്കാരത്തിനായി ഒരുക്കാൻ / സംസ്കാരത്തിനായി ഒരുക്കി
  rationale: חנט ഇവിടെ ഈജിപ്തിലെ മൃതദേഹസംരക്ഷണരീതിയെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കാനായി പ്രവർത്തിയുടെ സ്വഭാവം ആദ്യപ്രയോഗത്തിൽ വ്യക്തമാക്കി; ആവർത്തനത്തിൽ ചുരുക്കി സ്വാഭാവിക മലയാളം നിലനിർത്തി.
- source_word: אָבִיו
  choice: തന്റെ അപ്പനെ
  rationale: മൂലത്തിലെ ബന്ധപദവും ഉടമസ്ഥസൂചനയും നേരിട്ട്, സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ
  rationale: മൂലപാഠം ‘യാക്കോബ്’ എന്നതിനു പകരം വ്യക്തമായി ‘ഇസ്രായേൽ’ എന്നു പറയുന്നു; ആ പേരുമാറ്റം യോജിപ്പിച്ചുകളയാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: עבד എന്ന പദത്തിന്റെ സാമൂഹിക നില സൂചിപ്പിക്കുന്ന വിവർത്തനം
  choice: ദാസന്മാർ
  alternative: അടിമകൾ
  rationale: ഈ സന്ദർഭത്തിൽ വൈദ്യന്മാരെന്ന നിലയിലുള്ള അവരുടെ സേവനചുമതലയാണ് പ്രധാനം; ബന്ധിതമായ നിയമസ്ഥിതി പാഠം പ്രത്യേകം ഊന്നുന്നില്ല. എങ്കിലും മൂലപദത്തിന്റെ മറ്റൊരു സാധുവായ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: יִשְׂרָאֵל എന്ന പേരും മുൻപുള്ള ‘അപ്പൻ’ എന്ന പരാമർശവും തമ്മിലുള്ള ബന്ധം
  choice: മുഖ്യപാഠത്തിൽ ‘തന്റെ അപ്പൻ’; അടിക്കുറിപ്പിൽ ‘ഇസ്രായേൽ, അതായത് യാക്കോബ്’
  alternative: മുഖ്യപാഠത്തിൽ ‘തന്റെ അപ്പനായ ഇസ്രായേൽ’
  rationale: ഹീബ്രു വാക്യത്തിലെ ആവർത്തനവും പേരിന്റെ തെരഞ്ഞെടുപ്പും നിലനിർത്തുകയും വായനക്കാരന് വ്യക്തത നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘എംബാം ചെയ്യുക’ എന്ന ഇംഗ്ലീഷ് ആഗതപദവും ‘മമ്മിയാക്കുക’ എന്ന സങ്കുചിതപ്രയോഗവും ഒഴിവാക്കി, חנט സൂചിപ്പിക്കുന്ന മൃതദേഹസംരക്ഷണപ്രക്രിയ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ വിവരണാത്മകമായി നൽകി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
