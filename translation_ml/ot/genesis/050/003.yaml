- from: അവനുവേണ്ടിയുള്ള നാല്പതു ദിവസം പൂർത്തിയായി; കാരണം മൃതശരീരം സുഗന്ധദ്രവ്യങ്ങൾ പൂശി സംരക്ഷിക്കുന്നതിനുള്ള ദിവസങ്ങൾ അങ്ങനെയാണ് പൂർത്തിയാകുന്നത്.[a] ഈജിപ്ത്[b] അവനെക്കുറിച്ച് എഴുപതു ദിവസം കരഞ്ഞു.
  to: അവനുവേണ്ടി നാല്പതു ദിവസം തികഞ്ഞു; കാരണം ശവസംരക്ഷണത്തിന്റെ ദിവസങ്ങൾ അങ്ങനെയാണ് തികയുന്നത്.[a] ഈജിപ്ത്[b] അവനുവേണ്ടി എഴുപതു ദിവസം കരഞ്ഞു.
  rationale: വാക്യത്തിലെ വ്യക്തതയും ആധുനിക സ്വാഭാവികതയും മെച്ചപ്പെടുത്തിക്കൊണ്ട്, ഹീബ്രു പദം പറയാത്ത സുഗന്ധദ്രവ്യ-പ്രയോഗം ഒഴിവാക്കി. കാലയളവിന്റെ പൂർത്തീകരണം, വിശദീകരണബന്ധം, കൂട്ടാർഥത്തിലുള്ള “ഈജിപ്ത്,” യാക്കോബിനുവേണ്ടിയുള്ള കരച്ചിൽ എന്നിവ നിലനിർത്തിയിരിക്കുന്നു.
