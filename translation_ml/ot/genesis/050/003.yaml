translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സാങ്കേതികമായ ‘എംബാമിങ്’ ഒഴിവാക്കി പ്രക്രിയ വിശദീകരിക്കുന്ന പദപ്രയോഗം സ്വീകരിച്ചു; ഹീബ്രുവിലെ സ്ഥലനാമത്തിന്റെ കൂട്ടാർഥവും പങ്കുപദരൂപത്തിലെ യഥാർഥ അനിശ്ചിതത്വവും അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
