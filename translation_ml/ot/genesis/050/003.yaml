source:
  edition: WLC
  text: וַ/יִּמְלְאוּ ל/וֹ֙ אַרְבָּעִ֣ים י֔וֹם כִּ֛י כֵּ֥ן יִמְלְא֖וּ יְמֵ֣י הַ/חֲנֻטִ֑ים וַ/יִּבְכּ֥וּ אֹת֛/וֹ מִצְרַ֖יִם שִׁבְעִ֥ים יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/003.yaml
  text: Forty days were completed for him[a], for that is how the days of embalming are completed[b]; and Egypt wept for him seventy days.
translation:
  language: ml
  text: അവനുവേണ്ടി നാല്പതു ദിവസം തികഞ്ഞു; കാരണം ശവസംരക്ഷണത്തിന്റെ ദിവസങ്ങൾ അങ്ങനെയാണ് തികയുന്നത്.[a] ഈജിപ്ത്[b] അവനുവേണ്ടി എഴുപതു ദിവസം കരഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശവസംരക്ഷണത്തിനുള്ള ദിവസങ്ങൾ അങ്ങനെയാണ് പൂർത്തിയാകുന്നത്.” ഹീബ്രുവിലെ הַחֲנֻטִים എന്ന രൂപം അക്ഷരാർഥത്തിൽ ‘സംരക്ഷിക്കപ്പെട്ടവർ’ എന്നും ഗ്രഹിക്കാം; ഇവിടെ സന്ദർഭത്തിൽ ശവസംരക്ഷണ പ്രക്രിയയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: “ഈജിപ്ത്” ഇവിടെ ഈജിപ്തുകാരെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלְאוּ לוֹ אַרְבָּעִים יוֹם
  choice: അവനുവേണ്ടിയുള്ള നാല്പതു ദിവസം പൂർത്തിയായി
  rationale: מלא എന്ന ക്രിയ ഇവിടെ നിശ്ചിത കാലയളവ് തികയുന്നതിനെ സൂചിപ്പിക്കുന്നു. പ്രവർത്തകരെ അനാവശ്യമായി ചേർക്കാതെ, കാലയളവിലാണ് ഊന്നൽ നിലനിർത്തുന്നത്.
- source_word: כִּי כֵן
  choice: കാരണം ... അങ്ങനെയാണ്
  rationale: നാല്പതു ദിവസമെന്ന കാലയളവിനുള്ള വിശദീകരണബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְמֵי הַחֲנֻטִים
  choice: മൃതശരീരം സുഗന്ധദ്രവ്യങ്ങൾ പൂശി സംരക്ഷിക്കുന്നതിനുള്ള ദിവസങ്ങൾ
  rationale: മുൻവാക്യത്തിലെ യാക്കോബിന്റെ ശരീരം חנט ചെയ്ത സന്ദർഭത്തിൽ, മൃതദേഹം സുഗന്ധദ്രവ്യങ്ങൾ ഉപയോഗിച്ച് സംരക്ഷിക്കുന്ന പ്രക്രിയയാണ് ഉദ്ദേശിക്കുന്നത്. ‘എംബാമിങ്’ എന്ന അപരിചിത പദത്തെക്കാൾ ഇത് സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: וַיִּבְכּוּ אֹתוֹ
  choice: അവനെക്കുറിച്ച് ... കരഞ്ഞു
  rationale: בכה എന്നതിന്റെ നേരിട്ടുള്ള വികാരാർഥം നിലനിർത്തുന്നു; ഔപചാരിക വിലാപാചാരമെന്ന് അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: מִצְרַיִם
  choice: ഈജിപ്ത്
  rationale: സ്ഥലനാമം അതിലെ ജനങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം സംരക്ഷിക്കുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: שִׁבְעִים יוֹם
  choice: എഴുപതു ദിവസം
  rationale: സംഖ്യയും കാലനാമവും നേരിട്ട്, സ്വാഭാവിക മലയാളക്രമത്തിൽ വിവർത്തനം ചെയ്യുന്നു.
