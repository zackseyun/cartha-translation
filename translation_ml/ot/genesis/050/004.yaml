  to: 'അവനെച്ചൊല്ലിയുള്ള വിലാപദിവസങ്ങൾ കഴിഞ്ഞപ്പോൾ[a], യോസേഫ് ഫറവോന്റെ അരമനയിലെ ആളുകളോടു പറഞ്ഞു: “നിങ്ങളുടെ അനുകൂലത എനിക്കു ലഭിച്ചിട്ടുണ്ടെങ്കിൽ, ദയവായി ഫറവോന്റെ കേൾവിയിൽ ഇങ്ങനെ പറയുക:'
