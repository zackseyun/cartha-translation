source:
  edition: WLC
  text: וַ/יַּֽעַבְרוּ֙ יְמֵ֣י בְכִית֔/וֹ וַ/יְדַבֵּ֣ר יוֹסֵ֔ף אֶל בֵּ֥ית פַּרְעֹ֖ה לֵ/אמֹ֑ר אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵ֣ינֵי/כֶ֔ם דַּבְּרוּ נָ֕א בְּ/אָזְנֵ֥י פַרְעֹ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/004.yaml
  text: When the days of his mourning had passed[a], Joseph spoke to Pharaoh’s household, saying, “If I have now found favor in your eyes, please speak in Pharaoh’s hearing[b], saying,”
translation:
  language: ml
  text: 'അവനെച്ചൊല്ലിയുള്ള വിലാപദിവസങ്ങൾ കഴിഞ്ഞപ്പോൾ[a], യോസേഫ് ഫറവോന്റെ അരമനയിലെ ആളുകളോടു പറഞ്ഞു: “നിങ്ങളുടെ അനുകൂലത എനിക്കു ലഭിച്ചിട്ടുണ്ടെങ്കിൽ, ദയവായി ഫറവോന്റെ കേൾവിയിൽ ഇങ്ങനെ പറയുക:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവനുവേണ്ടി കരഞ്ഞ ദിവസങ്ങൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: കഴിഞ്ഞപ്പോൾ
  rationale: കാലയളവ് കടന്നുപോകുകയോ അവസാനിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന עבר എന്ന ക്രിയയുടെ അർഥവും തുടർന്നുള്ള സംഭവത്തിലേക്കുള്ള ആഖ്യാനക്രമവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְמֵי בְכִיתוֹ
  choice: അവനെച്ചൊല്ലിയുള്ള വിലാപദിവസങ്ങൾ
  rationale: בכי എന്നത് അക്ഷരാർഥത്തിൽ കരച്ചിലാണെങ്കിലും ശവസംസ്കാരസന്ദർഭത്തിൽ വിലാപത്തെ സൂചിപ്പിക്കുന്നു. പ്രത്യയത്തിന്റെ സാധ്യതയുള്ള വസ്തുനിഷ്ഠ അർഥം—അവനെച്ചൊല്ലിയുള്ള വിലാപം—വാചകത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיְדַבֵּר
  choice: പറഞ്ഞു
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള ഉദ്ധരണിയോടൊപ്പം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുന്ന സംസാരക്രിയയാണ്.
- source_word: אֶל־בֵּית פַּרְעֹה
  choice: ഫറവോന്റെ വീട്ടുകാരോടു
  rationale: בית ഇവിടെ കെട്ടിടത്തെക്കാൾ രാജകീയ ഭവനത്തിലെ ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വീട്ടുകാർ’ എന്നത് എബ്രായ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് ആ സാമൂഹിക അർഥം നൽകുന്നു.
- source_word: אִם־נָא מָצָאתִי חֵן בְּעֵינֵיכֶם
  choice: നിങ്ങളുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ
  rationale: חֵן ... בְּעֵינֵי എന്ന ‘ഒരാളുടെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിക്കുക’ എന്ന എബ്രായ പ്രയോഗം മാന്യവും മനസ്സിലാക്കാവുന്നതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. נָא നൽകുന്ന വിനയഭാവം അഭ്യർഥനയുടെ മൊത്തം രൂപത്തിലും തുടർന്നുള്ള ‘ദയവായി’യിലും പ്രതിഫലിക്കുന്നു.
- source_word: דַּבְּרוּ־נָא
  choice: ദയവായി ... പറയണം
  rationale: ബഹുവചന ആജ്ഞയും נָא എന്ന വിനയസൂചക കണവും മലയാളത്തിലെ മാന്യമായ അഭ്യർഥനാരൂപത്തിൽ നൽകുന്നു.
- source_word: בְּאָזְנֵי פַרְעֹה
  choice: ഫറവോൻ കേൾക്കെ
  rationale: ‘ഫറവോന്റെ ചെവികളിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആശയം—ഫറവോൻ കേൾക്കത്തക്കവിധം അറിയിക്കുക—ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֵאמֹר
  choice: 'ഇങ്ങനെ പറയണം:'
  rationale: സന്ദേശം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ ഉദ്ധരണി പരിചയപ്പെടുത്തുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. രാജസദസ്സിനോടുള്ള യോസേഫിന്റെ വിനയഭാവം നിലനിർത്തി; വാക്യം അടുത്ത വചനത്തിലേക്ക് തുടരുന്നതായി അവസാനത്തെ ദ്വിബിന്ദു സൂചിപ്പിക്കുന്നു.
