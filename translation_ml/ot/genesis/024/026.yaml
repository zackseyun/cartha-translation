id: GEN.24.26
reference: Genesis 24:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקֹּ֣ד הָ/אִ֔ישׁ וַ/יִּשְׁתַּ֖חוּ לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/026.yaml
  text: Then the man bowed down and worshiped Yahweh[a][b].
translation:
  language: ml
  text: അപ്പോൾ ആ മനുഷ്യൻ[b] കുനിഞ്ഞ് യഹോവയെ ആരാധിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹോവയുടെ മുമ്പിൽ സാഷ്ടാംഗം വീണു.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ആ മനുഷ്യൻ’; സന്ദർഭത്തിൽ ഇത് അബ്രാഹാമിന്റെ ദാസനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: കുനിഞ്ഞ്
  rationale: קָדַד ശരീരം കുനിക്കുകയോ തല താഴ്ത്തുകയോ ചെയ്യുന്ന ഭൗതിക പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. പിന്നാലെയുള്ള ആരാധനാസൂചക ക്രിയയിൽനിന്ന് ഇതിനെ വേർതിരിച്ചുകൊണ്ട് സ്വാഭാവിക മലയാളത്തിൽ ‘കുനിഞ്ഞ്’ എന്നു നൽകി.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: എബ്രായ പാഠത്തിൽ ‘ദാസൻ’ എന്നല്ല, വ്യക്തമായി ‘മനുഷ്യൻ/പുരുഷൻ’ (אִישׁ) എന്നാണ്. സന്ദർഭത്തിൽ അബ്രാഹാമിന്റെ ദാസനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും മൂലപാഠത്തിന്റെ പദപ്രയോഗം നിലനിർത്തി.
- source_word: וַיִּשְׁתַּחוּ
  choice: ആരാധിച്ചു
  rationale: שׁחה എന്ന ക്രിയ ആദരപൂർവം സാഷ്ടാംഗം വീഴുന്നതിനെയോ കുമ്പിടുന്നതിനെയോ സൂചിപ്പിക്കാം; യഹോവയോടാണ് പ്രവൃത്തി ചെയ്തിരിക്കുന്നത് എന്നതിനാൽ ഇവിടെ അതിന്റെ ആരാധനാപരമായ അർഥം ‘ആരാധിച്ചു’ എന്നു വ്യക്തമായി നൽകി. മുൻക്രിയ ശരീരം കുനിച്ച പ്രവൃത്തി ഇതിനകം അറിയിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയെ
  rationale: לְ എന്ന ബന്ധപ്രത്യയം ഇവിടെ ക്രിയയുടെ ലക്ഷ്യം സൂചിപ്പിക്കുന്നു; ദൈവനാമമായ יהוה മലയാളത്തിലെ പരിചിതവും നേരിട്ടുള്ളതുമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ പ്രത്യേക ദൈവനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- issue: וַיִּשְׁתַּחוּ എന്നത് ശരീരഭാവമായോ ആരാധനയായോ നൽകുന്നത്
  choice: ആരാധിച്ചു
  alternative: യഹോവയുടെ മുമ്പിൽ സാഷ്ടാംഗം വീണു; കുമ്പിട്ടു
  rationale: യഹോവയാണ് പ്രവൃത്തിയുടെ ലക്ഷ്യം എന്നതിനാൽ ആരാധനാപരമായ അർഥം സന്ദർഭത്തിൽ ശക്തമാണ്. എങ്കിലും ക്രിയയിലെ ശരീരഭാവം സാധുവായ മറ്റൊരു അവതരണമാണെന്നത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. തുടർച്ചയായ രണ്ടു എബ്രായ ക്രിയകളുടെ വ്യത്യാസം ‘കുനിഞ്ഞ്’ എന്നും ‘ആരാധിച്ചു’ എന്നും നൽകി; മൂലത്തിലെ ‘ആ മനുഷ്യൻ’ എന്ന പ്രയോഗവും ദൈവനാമവും നിലനിർത്തി.
