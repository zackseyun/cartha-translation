source:
  edition: WLC
  text: וְ/אָמְרָ֤ה אֵלַ/י֙ גַּם אַתָּ֣ה שְׁתֵ֔ה וְ/גַ֥ם לִ/גְמַלֶּ֖י/ךָ אֶשְׁאָ֑ב הִ֣וא הָֽ/אִשָּׁ֔ה אֲשֶׁר הֹכִ֥יחַ יְהוָ֖ה לְ/בֶן אֲדֹנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/044.yaml
  text: and says to me[a], ‘You also drink, and I will draw water for your camels as well’—let her be the woman whom Yahweh has appointed for my master’s son.
translation:
  language: ml
  text: എന്നോട്, ‘നീയും കുടിക്കൂ; നിന്റെ ഒട്ടകങ്ങൾക്കും ഞാൻ വെള്ളം കോരാം’ എന്നു അവൾ പറഞ്ഞാൽ, അവൾ തന്നെയാണ് യഹോവ എന്റെ യജമാനന്റെ മകനുവേണ്ടി നിശ്ചയിച്ച സ്ത്രീ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യഹോവ എന്റെ യജമാനന്റെ മകനുവേണ്ടി നിയമിച്ച സ്ത്രീ.”'
    reason: הֹכִיחַ എന്ന ഹിഫിൽ ക്രിയയുടെ സന്ദർഭോചിതമായ ‘നിശ്ചയിക്കുക/നിയമിക്കുക’ എന്ന അർഥസാധ്യത സൂചിപ്പിക്കുന്നു; മുഖ്യപാഠത്തിലെ തിരിച്ചറിയൽവാചകത്തെ അനാവശ്യമായി പ്രാർഥനാരൂപമാക്കുന്നില്ല.
lexical_decisions:
- source_word: וְאָמְרָה
  choice: എന്നു പറയുന്നവൾ
  rationale: സേവകൻ നിർദേശിച്ച അടയാളത്തിന്റെ സോപാധികവും പ്രാർഥനാസദൃശവുമായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി തുടരുന്നു; ഹീബ്രായ പൂർണക്രിയയെ വെറും ഭൂതകാലമായി ചുരുക്കുന്നില്ല.
- source_word: גַּם אַתָּה שְׁתֵה
  choice: നീയും കുടിക്കൂ
  rationale: גַּם אַתָּה എന്നതിലെ ‘നീയും’ എന്ന ഊന്നലും ശְׁתֵה എന്ന ആജ്ഞാർഥവും സംരക്ഷിക്കുന്നു.
- source_word: וְגַם לִגְמַלֶּיךָ אֶשְׁאָב
  choice: നിന്റെ ഒട്ടകങ്ങൾക്കും ഞാൻ വെള്ളം കോരിക്കൊടുക്കാം
  rationale: שׁאב എന്നത് ഇവിടെ കിണറ്റിൽനിന്ന് വെള്ളം കോരുന്നതാണ്; മലയാളത്തിൽ കർമ്മം വ്യക്തമാക്കുകയും ഒട്ടകങ്ങൾക്കുവേണ്ടിയുള്ള സേവനാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: הִוא הָאִשָּׁה
  choice: അവൾ തന്നെയാകട്ടെ ... സ്ത്രീ
  rationale: הִוא എന്ന തിരിച്ചറിയൽ-ഊന്നൽ ‘തന്നെ’ കൊണ്ട് നിലനിർത്തുന്നു; വിപുലമായ പ്രാർഥനാസന്ദർഭത്തിലെ ആഗ്രഹ/അപേക്ഷാഭാവം ‘ആകട്ടെ’ പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר הֹכִיחַ
  choice: നിശ്ചയിച്ച
  rationale: Hiphil രൂപം ഈ സന്ദർഭത്തിൽ ദൈവം തിരഞ്ഞെടുത്ത് നിർണയിച്ചു എന്ന ആശയം നൽകുന്നു; ‘നിശ്ചയിച്ച’ എന്നത് നിയമിച്ചു എന്നതിലും വിശാലമായി മൂലത്തിലെ അർഥസാധ്യത സൂക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: לְבֶן אֲדֹנִי
  choice: എന്റെ യജമാനന്റെ മകനുവേണ്ടി
  rationale: לְ എന്ന ബന്ധ/ഉദ്ദേശ്യാർഥവും കുടുംബബന്ധവും വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: הִוא הָאִשָּׁה എന്ന വാക്യഖണ്ഡത്തിന്റെ തിരിച്ചറിയൽവാചകമോ പ്രാർഥനാപരമായ അപേക്ഷയോ എന്ന ഭാവം
  choice: അവൾ തന്നെയാകട്ടെ ... സ്ത്രീ
  alternative: അവൾ തന്നെയാണ് ... സ്ത്രീ
  rationale: ഹീബ്രായ രൂപം സ്വതവേ തിരിച്ചറിയൽവാചകമായി വായിക്കാമെങ്കിലും, 24:42–44-ലെ സേവകന്റെ പ്രാർഥനയ്ക്കുള്ളിൽ ഇത് വരുന്നതിനാൽ മലയാളത്തിൽ ‘ആകട്ടെ’ എന്നത് സന്ദർഭത്തിലെ അപേക്ഷാഭാവം വ്യക്തമാക്കുന്നു; മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: אֲשֶׁר הֹכִיחַ എന്നതിലെ ദൈവിക പ്രവർത്തനത്തിന്റെ അർഥം
  choice: നിശ്ചയിച്ച
  alternative: നിയമിച്ച / തിരഞ്ഞെടുത്തതായി കാണിച്ച
  rationale: ദൈവം വിവാഹപങ്കാളിയെ നിശ്ചയിച്ചുവെന്ന സന്ദർഭാർഥം നൽകുമ്പോഴും, പദത്തെ പ്രത്യേക സിദ്ധാന്തപരമായ മുൻനിർണ്ണയവാദമായി അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ / കർത്താവ്
  rationale: മൂലത്തിലെ വ്യക്തിനാമസ്വഭാവം സംരക്ഷിക്കുകയും സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതമായ രൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കുടിക്കൂ’, ‘കോരിക്കൊടുക്കാം’ എന്നിവ സംഭാഷണത്തിൽ സ്വാഭാവികമാണ്; ‘യജമാനൻ’, ‘നിശ്ചയിച്ച സ്ത്രീ’ എന്നിവ വാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
