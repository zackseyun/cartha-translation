  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תְּכַ֖ל לְ/הַשְׁקֹת֑/וֹ וַ/תֹּ֗אמֶר גַּ֤ם לִ/גְמַלֶּ֨י/ךָ֙ אֶשְׁאָ֔ב עַ֥ד אִם כִּלּ֖וּ לִ/שְׁתֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/019.yaml
  text: When she had finished giving him a drink[a], she said, “I will draw water for your camels also, until they have finished drinking.”
translation:
  language: ml
  text: 'അവന് കുടിക്കാൻ കൊടുത്തുകഴിഞ്ഞപ്പോൾ അവൾ പറഞ്ഞു: “നിന്റെ ഒട്ടകങ്ങൾക്കും കുടിച്ചുതീരുന്നതുവരെ ഞാൻ വെള്ളം കോരിക്കൊടുക്കാം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּכַל לְהַשְׁקֹתוֹ
  choice: അവന് കുടിക്കാൻ കൊടുത്തുതീർന്നപ്പോൾ
  rationale: כלה എന്ന ക്രിയയും שקה എന്ന ഹിഫീൽ ധാതുരൂപവും ചേർന്ന്, അവൾ അവന് കുടിക്കാൻ കൊടുക്കുന്ന പ്രവൃത്തി പൂർത്തിയാക്കിയശേഷമുള്ള സംഭവക്രമം സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ ഈ ക്രമവും പൂർത്തീകരണഭാവവും നിലനിർത്തുന്നു.
- source_word: וַתֹּאמֶר
  choice: അവൾ പറഞ്ഞു
  rationale: אמר എന്ന സാധാരണ ആഖ്യാനക്രിയയുടെ നേരായ വിവർത്തനം; ആവർത്തിച്ചുള്ള വാവ് മലയാളത്തിൽ പ്രത്യേകം ‘പിന്നെ’ എന്നു ചേർക്കാതെ സംഭവക്രമത്തിലൂടെ വ്യക്തമാകുന്നു.
- source_word: גַּם לִגְמַלֶּיךָ
  choice: അങ്ങയുടെ ഒട്ടകങ്ങൾക്കും
  rationale: גַּם എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽഭാവം ‘-ക്കും’ വഴി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം മാന്യമായ ‘അങ്ങയുടെ’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
- source_word: אֶשְׁאָב
  choice: ഞാൻ വെള്ളം കോരിക്കൊടുക്കാം
  rationale: שאב കിണറ്റിൽനിന്നോ ജലസ്രോതസ്സിൽനിന്നോ വെള്ളം കോരുന്നതിനെ സൂചിപ്പിക്കുന്നു. മൂലത്തിൽ ‘വെള്ളം’ അധ്യാഹൃതമാണെങ്കിലും മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ചേർത്തു; ഒട്ടകങ്ങൾക്കുവേണ്ടിയുള്ള പ്രവൃത്തിയായതിനാൽ ‘കോരിക്കൊടുക്കാം’ സ്വാഭാവികമാണ്.
- source_word: עַד אִם כִּלּוּ לִשְׁתֹּת
  choice: കുടിച്ചുതീരുന്നതുവരെ
  rationale: עַד אִם ഇവിടെ അവസാനപരിധി സൂചിപ്പിക്കുന്ന ‘വരെ’ എന്ന അർഥത്തിലാണ്; כלה + שתה എന്ന ഘടനയുടെ ‘കുടി പൂർത്തിയാക്കുക’ എന്ന അർഥം മലയാളത്തിലെ സംയുക്തക്രിയയിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സംഭാഷണത്തിൽ ‘അങ്ങയുടെ’ ഉപയോഗിച്ച് ആദരസൂചക ഏകവചനം നിലനിർത്തി. മൂലപാഠത്തിൽ പ്രസക്തമായ യഥാർഥ അർഥദ്വന്ദ്വമില്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
