  yaml_path: translation/ot/genesis/024/016.yaml
  text: The young woman was very beautiful in appearance[a], a virgin; no man had known her. She went down to the spring, filled her jar[b], and came up.
translation:
  language: ml
  text: ആ യുവതി കാഴ്ചയ്ക്ക് അതിസുന്ദരിയായിരുന്നു; അവൾ കന്യകയായിരുന്നു, ഒരു പുരുഷനും അവളെ അറിഞ്ഞിരുന്നില്ല[a]. അവൾ നീരുറവയിലേക്ക് ഇറങ്ങിച്ചെന്ന് തന്റെ കുടം നിറച്ച് മുകളിലേക്കു കയറിവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘ഒരു പുരുഷനും അവളുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെട്ടിരുന്നില്ല.’ എബ്രായഭാഷയിൽ അക്ഷരാർഥം: ‘ഒരു പുരുഷനും അവളെ അറിഞ്ഞിരുന്നില്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָ
  choice: ആ യുവതി
  rationale: നַעֲרָה വിവാഹപ്രായമെത്തിയിരിക്കാവുന്ന ഒരു യുവസ്ത്രീയെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘യുവതി’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: טֹבַת מַרְאֶה מְאֹד
  choice: കാഴ്ചയ്ക്ക് അതിസുന്ദരി
  rationale: രൂപഭംഗിയെ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗവും מְאֹד നൽകുന്ന ശക്തമായ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּתוּלָה
  choice: കന്യക
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിൽ ലൈംഗികബന്ധം ഉണ്ടായിട്ടില്ലാത്ത സ്ത്രീ എന്ന സാധാരണ അർത്ഥം നേരിട്ട് നൽകുന്നു.
- source_word: וְאִישׁ לֹא יְדָעָהּ
  choice: ഒരു പുരുഷനും അവളെ അറിഞ്ഞിരുന്നില്ല
  rationale: יָדַע എന്ന ‘അറിയുക’ എന്ന ക്രിയയുടെ സംയമിതമായ എബ്രായ ലൈംഗികപ്രയോഗം അതേപടി സംരക്ഷിക്കുന്നു; അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָעַיְנָה
  choice: നീരുറവയിലേക്ക്
  rationale: עַיִן ഇവിടെ ജലത്തിന്റെ സ്വാഭാവിക ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു; ‘കിണർ’ എന്നതിനെക്കാൾ ‘നീരുറവ’ കൃത്യമാണ്.
- source_word: כַדָּהּ
  choice: തന്റെ കുടം
  rationale: כַּד വെള്ളം കോരാനും കൊണ്ടുപോകാനും ഉപയോഗിക്കുന്ന പാത്രമാണ്; ‘കുടം’ സ്വാഭാവികവും പരിചിതവുമായ മലയാളപദമാണ്.
- source_word: וַתָּעַל
  choice: മുകളിലേക്കു കയറിവന്നു
  rationale: നീരുറവയിലേക്ക് ‘ഇറങ്ങി’ എന്ന മുൻക്രിയയോടുള്ള സ്ഥലപരമായ വൈരുധ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവളെ അറിഞ്ഞിരുന്നില്ല’ എന്ന പ്രയോഗത്തിന്റെ അർത്ഥം
  choice: എബ്രായഭാഷയിലെ ‘അറിയുക’ എന്ന സംയമിതമായ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി
  alternative: ഒരു പുരുഷനും അവളുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെട്ടിരുന്നില്ല
  rationale: മൂലപാഠത്തിന്റെ സാഹിത്യസംയമനവും യഥാർഥ പദപ്രയോഗവും സംരക്ഷിക്കുമ്പോൾ, അടിക്കുറിപ്പ് ഉദ്ദേശിച്ച അർത്ഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ‘ഇറങ്ങി/കയറിവന്നു’ എന്ന സ്ഥലചലനവൈരുധ്യവും ‘അറിയുക’ എന്ന സംയമിതപ്രയോഗവും സംരക്ഷിച്ചു. ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് b-യിലെ വിവരമോ മുഖ്യപാഠത്തിലെ അടയാളമോ പരസ്പരം പൊരുത്തപ്പെടാത്തതിനാൽ, הָעַיְנָה എന്നതിന്റെ നേരിട്ടുള്ള ‘നീരുറവ’ വിവർത്തനത്തിന് അനാവശ്യ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
