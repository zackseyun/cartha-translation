  yaml_path: translation/ot/genesis/024/029.yaml
  text: Rebekah had a brother[a], and his name was Laban; and Laban ran out to the man[b], outside by the spring.
translation:
  language: ml
  text: റിബെക്കയ്ക്ക് ലാബാൻ എന്നു പേരുള്ള ഒരു സഹോദരൻ ഉണ്ടായിരുന്നു. ലാബാൻ പുറത്തേക്കു ഓടി, നീരുറവയുടെ അടുത്തുള്ള ആ മനുഷ്യന്റെ അടുക്കലേക്ക് പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/רִבְקָה אָח
  choice: റിബെക്കയ്ക്ക് ഒരു സഹോദരൻ ഉണ്ടായിരുന്നു
  rationale: ഹീബ്രായയിലെ ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന ‘റിബെക്കയ്ക്ക് ഒരു സഹോദരൻ’ എന്ന ഘടന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ഉണ്ടായിരുന്നു’ ചേർത്ത് നൽകി.
- source_word: וּ/שְׁמ/וֹ לָבָן
  choice: ലാബാൻ എന്നു പേരുള്ള
  rationale: ഹീബ്രായ നാമകരണവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി മുൻപത്തെ നാമപദത്തോട് ചേർത്തു; അർത്ഥം പൂർണമായി നിലനിർത്തുന്നു.
- source_word: וַ/יָּרָץ
  choice: ഓടി
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർത്ഥമായ വേഗത്തിലുള്ള ഓട്ടം നേരിട്ട് സംരക്ഷിച്ചു.
- source_word: אֶל הָ/אִישׁ
  choice: ആ മനുഷ്യന്റെ അടുക്കലേക്ക്
  rationale: അബ്രാഹാമിന്റെ ദാസൻ എന്നു വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കാതെ, മൂലത്തിലെ പൊതുനാമമായ ‘മനുഷ്യൻ’ നിലനിർത്തി.
- source_word: הַ/ח֖וּצָ/ה
  choice: പുറത്തുള്ള
  rationale: പുറത്തേക്കുള്ള ദിശ/പുറത്തെ സ്ഥലം എന്ന ഘടകം ഒഴിവാക്കാതെ, തുടർന്നുള്ള സ്ഥലവാക്യവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു.
- source_word: אֶל הָ/עָיִן
  choice: നീരുറവയിലേക്ക്
  rationale: עַיִן എന്നത് കിണറിനെക്കാൾ കൃത്യമായി സ്വാഭാവിക ജലസ്രോതസ്സായ നീരുറവയെ സൂചിപ്പിക്കുന്നു; אֶל-ന്റെ ദിശാസൂചനയും നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ആധുനിക നിലവാരമലയാളം; വ്യക്തിനാമവും ആവർത്തനവും മൂലപാഠത്തിന് അനുസൃതമായി നിലനിർത്തി. അവസാനത്തെ രണ്ട് אֶל ഘടനകളിലെ ചെറിയ വാക്യഘടനാപരമായ അസ്പഷ്ടത പരിഹരിച്ചുകളയാതെ കോമകൾകൊണ്ട് സൂക്ഷിച്ചു.
