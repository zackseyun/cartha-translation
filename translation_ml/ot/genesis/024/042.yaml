- from: 'ഇന്ന് ഞാൻ നീരുറവയ്ക്കരികെ വന്ന് ഇങ്ങനെ പറഞ്ഞു[a]: ‘എന്റെ യജമാനനായ അബ്രാഹാമിന്റെ ദൈവമായ യഹ്‌വേ, ഞാൻ പോകുന്ന ഈ വഴിയിൽ അങ്ങ് എനിക്കു വിജയം നൽകുന്നുണ്ടെങ്കിൽ—’'
  to: 'ഇന്ന് ഞാൻ നീരുറവയ്ക്കരികെ വന്നു[a], ഇങ്ങനെ പറഞ്ഞു: ‘എന്റെ യജമാനനായ അബ്രാഹാമിന്റെ ദൈവമായ യഹ്‌വേ, ഞാൻ സഞ്ചരിക്കുന്ന വഴിയെ അങ്ങ് ഇപ്പോൾ വിജയകരമാക്കുന്നുണ്ടെങ്കിൽ—’'
