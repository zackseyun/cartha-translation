  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אָבֹ֥א הַ/יּ֖וֹם אֶל הָ/עָ֑יִן וָ/אֹמַ֗ר יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אִם יֶשְׁ/ךָ נָּא֙ מַצְלִ֣יחַ דַּרְכִּ֔/י אֲשֶׁ֥ר אָנֹכִ֖י הֹלֵ֥ךְ עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/042.yaml
  text: Today I came to the spring and said[a], ‘O Yahweh, God of my master Abraham[b], if now you are prospering my way on which I am going—’
translation:
  language: ml
  text: 'ഇന്ന് ഞാൻ നീരുറവയ്ക്കരികെ വന്നു[a], ഇങ്ങനെ പറഞ്ഞു: ‘എന്റെ യജമാനനായ അബ്രാഹാമിന്റെ ദൈവമായ യഹ്‌വേ, ഞാൻ സഞ്ചരിക്കുന്ന വഴിയെ അങ്ങ് ഇപ്പോൾ വിജയകരമാക്കുന്നുണ്ടെങ്കിൽ—’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘കിണർ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പദം കൂടുതൽ കൃത്യമായി ഒരു നീരുറവയെയോ ജലസ്രോതസ്സിനെയോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבֹא הַיּוֹם
  choice: ഇന്ന് ഞാൻ ... വന്നു
  rationale: הַיּוֹם എന്ന കാലസൂചനയ്ക്ക് ഊന്നൽ നൽകിക്കൊണ്ട്, തുടർന്നുള്ള വാക്യഘടനയോട് സ്വാഭാവികമായി ചേരുന്ന ആധുനിക മലയാളരൂപം.
- source_word: הָעָיִן
  choice: നീരുറവ്
  rationale: עַיִן ഇവിടെ കിണറിനെക്കാൾ കൃത്യമായി സ്വാഭാവിക ജലസ്രോതസ്സിനെയോ ഉറവിനെയോ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: എന്റെ യജമാനനായ അബ്രാഹാമിന്റെ ദൈവം
  rationale: אֲדֹנִי ഇവിടെ ദൈവിക സ്ഥാനപ്പേരല്ല; ദാസനോടുള്ള അബ്രാഹാമിന്റെ യജമാനബന്ധമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אִם יֶשְׁךָ נָּא מַצְלִיחַ
  choice: അങ്ങ് എനിക്കു വിജയം നൽകുന്നുണ്ടെങ്കിൽ
  rationale: ഹിഫിൽ രൂപമായ מַצְלִיחַ ദൈവം വിജയിപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. അപൂർണ്ണവും പ്രാർഥനാത്മകവുമായ നിബന്ധനാവാക്യത്തിന്റെ തുറന്ന സ്വഭാവം നിലനിർത്തി; נָאയുടെ അപേക്ഷാഭാവം ആദരസൂചകമായ ‘അങ്ങ്’ എന്ന പ്രയോഗത്തിലും മുഴുവൻ പ്രാർഥനയുടെ ഭാവത്തിലും പ്രതിഫലിക്കുന്നു.
- source_word: דַּרְכִּי אֲשֶׁר אָנֹכִי הֹלֵךְ עָלֶיהָ
  choice: ഞാൻ പോകുന്ന ഈ വഴിയിൽ
  rationale: ‘ഞാൻ അതിന്മേൽ പോകുന്ന എന്റെ വഴി’ എന്ന ഹീബ്രു ആശയം സ്വാഭാവിക മലയാളത്തിൽ ചുരുക്കുന്നു; ‘വഴി’ യാത്രയെയും ദൗത്യത്തെയും ഉൾക്കൊള്ളുന്ന മൂലപദത്തിന്റെ രൂപകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരാൽ പകരാതെ ലിപ്യന്തരിച്ചു.
- issue: അപൂർണ്ണമായ നിബന്ധനാപ്രാർഥന
  choice: ‘...നൽകുന്നുണ്ടെങ്കിൽ—’ എന്ന തുറന്ന സമാപനം
  alternative: ‘ദയവായി എന്റെ യാത്ര വിജയിപ്പിക്കണമേ’ എന്ന നേരിട്ടുള്ള അപേക്ഷ
  rationale: אִם ഉപയോഗിച്ചുള്ള മൂലവാക്യത്തിന്റെ വ്യാകരണപരമായ അസംപൂർണ്ണതയും അടുത്ത വാക്യത്തിലേക്കുള്ള പ്രതീക്ഷയും വ്യാഖ്യാനിച്ച് തീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ആദരപൂർവവും ഗൗരവമുള്ളതുമായ മലയാളം. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു. വാക്യാവസാനത്തിലെ ദീർഘവിരാമം മൂലപാഠത്തിലെ തുടരുന്ന നിബന്ധനാഭാവം സൂക്ഷിക്കുന്നു.
