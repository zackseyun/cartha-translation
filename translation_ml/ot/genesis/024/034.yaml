source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר עֶ֥בֶד אַבְרָהָ֖ם אָנֹֽכִי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/034.yaml
  text: And he said[a], “I am Abraham’s servant.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഞാൻ അബ്രാഹാമിന്റെ ദാസനാണ്[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ അബ്രാഹാമിന്റെ അടിമയാണ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: അവൻ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാവിന്യാസം ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു. മലയാളത്തിൽ പ്രസംഗസന്ദർഭത്തിലേക്കുള്ള സ്വാഭാവിക മാറ്റം ‘അവൻ പറഞ്ഞു’ എന്ന ലളിതരൂപം മതിയായും വിശ്വസ്തമായും നൽകുന്നു.
- source_word: עֶבֶד
  choice: ദാസൻ
  rationale: ഈ പദത്തിന് ‘ദാസൻ’, ‘ഭൃത്യൻ’, ‘അടിമ’ എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ അബ്രാഹാമിന്റെ ഗൃഹത്തിലെ തന്റെ പദവി മാന്യമായി പരിചയപ്പെടുത്തുന്നതിനാൽ ‘ദാസൻ’ യോജിക്കുന്നു; ഉടമസ്ഥബന്ധത്തിന്റെ കൂടുതൽ ശക്തമായ ഭാവം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אַבְרָהָם
  choice: അബ്രാഹാം
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ പേരുരൂപം സ്വീകരിച്ചു.
- source_word: אָנֹכִי
  choice: ഞാൻ … ആണ്
  rationale: സ്വതന്ത്ര സർവനാമം വ്യക്തമായ സ്വയംപരിചയപ്പെടുത്തലിന് ഊന്നൽ നൽകുന്നു. മലയാളത്തിലെ സ്വാഭാവിക നാമവാക്യഘടനയിൽ ‘ഞാൻ അബ്രാഹാമിന്റെ ദാസനാണ്’ എന്ന് നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനികവും ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ദാസൻ’ എന്നത് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും സന്ദർഭത്തിലെ ഗൃഹസേവകന്റെ സ്ഥാനത്തിന് യോജിച്ചതുമാണ്; ‘അടിമ’ എന്ന ശക്തമായ പദസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
