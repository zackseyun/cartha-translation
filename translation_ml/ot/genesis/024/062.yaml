id: GEN.24.62
reference: Genesis 24:62
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יִצְחָק֙ בָּ֣א מִ/בּ֔וֹא בְּאֵ֥ר לַחַ֖י רֹאִ֑י וְ/ה֥וּא יוֹשֵׁ֖ב בְּ/אֶ֥רֶץ הַ/נֶּֽגֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/062.yaml
  text: Isaac had come from Beer-lahai-roi[b][a], and he was dwelling in the land of the Negev.
translation:
  language: ml
  text: യിസ്ഹാക്ക് ബേർ-ലഹയ്-രോയിയിൽനിന്ന് വന്നിരുന്നു[a][b]; അവൻ നെഗെബ് ദേശത്ത് താമസിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യിസ്ഹാക്ക് ബേർ-ലഹയ്-രോയിയിൽനിന്ന് വന്നു.” ഹീബ്രു വാക്യഘടനയെ പൂർവപൂർണകാലത്തിനു പകരം ലളിതഭൂതകാലത്തിലും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ബേർ-ലഹയ്-രോയി മുമ്പ് ഹാഗാറുമായി ബന്ധപ്പെട്ട് പരാമർശിച്ചിട്ടുള്ള ഒരു സ്ഥലമാണ് (ഉല്പത്തി 16:14 കാണുക).
    reason: cross_reference
lexical_decisions:
- source_word: בָּא
  choice: വന്നിരുന്നു
  rationale: בוא എന്ന ക്രിയയുടെ ഖാൽ സമാപിക രൂപം പൂർത്തിയായ ചലനത്തെ സൂചിപ്പിക്കുന്നു. തുടർന്നുവരുന്ന രംഗത്തിനു മുമ്പുള്ള സംഭവമായി മലയാളത്തിൽ ‘വന്നിരുന്നു’ സ്വാഭാവികമാണ്; എങ്കിലും ലളിതഭൂതകാലവും സാധ്യമാണ്.
- source_word: מִבּוֹא
  choice: നിന്ന്
  rationale: מן എന്ന ഉപസർഗവും בוא എന്ന ക്രിയയുടെ അനന്തധാതുരൂപവും ചേർന്ന സംക്ഷിപ്ത പ്രയോഗം ഇവിടെ ചലനത്തിന്റെ പുറപ്പെടൽസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: ബേർ-ലഹയ്-രോയി
  rationale: സ്ഥലപ്പേര് വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത രൂപത്തിൽ ലിപ്യന്തരിച്ചു; സംയുക്തനാമത്തിന്റെ ഘടന സൂചിപ്പിക്കാൻ ഹൈഫനുകൾ നിലനിർത്തി.
- source_word: יוֹשֵׁב
  choice: താമസിക്കുകയായിരുന്നു
  rationale: കർത്തൃവാചക വിശേഷണരൂപം തുടരുന്ന അവസ്ഥയെയോ വാസത്തെയോ സൂചിപ്പിക്കുന്നു; ഈ ദൈർഘ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ ഈ രൂപം നൽകുന്നു.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: നെഗെബ് ദേശത്ത്
  rationale: אֶרֶץ എന്നതിന്റെ ‘ദേശം’ എന്ന ഘടകം നിലനിർത്തുകയും נֶגֶב ഭൂമിശാസ്ത്രപരമായ പേരായി ലിപ്യന്തരം ചെയ്യുകയും ചെയ്തു.
- source_word: וְהוּא
  choice: അവൻ
  rationale: ഹീബ്രുവിലെ വ്യക്തമായ സർവനാമം നിലനിർത്തി. മലയാളത്തിൽ പുതിയ സ്വതന്ത്രവാക്യം ഉപയോഗിച്ചതിനാൽ וְ എന്ന ബന്ധകത്തിന് പ്രത്യേകമായ ‘കൂടാതെ’ ചേർക്കാതെ ഏകോപനബന്ധം വിരാമചിഹ്നത്തിലൂടെ അറിയിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ഹീബ്രുവിൽ വ്യക്തമായ ‘ഇപ്പോൾ’ എന്ന കാലസൂചകപദമില്ലാത്തതിനാൽ അത്തരമൊരു പദം ചേർത്തിട്ടില്ല. കാലരൂപത്തിലെ യഥാർത്ഥ വ്യാഖ്യാനസാധ്യത [a]യിൽ നിലനിർത്തി.
