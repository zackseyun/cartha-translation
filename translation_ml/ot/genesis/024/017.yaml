  text: וַ/יָּ֥רָץ הָ/עֶ֖בֶד לִ/קְרָאתָ֑/הּ וַ/יֹּ֕אמֶר הַגְמִיאִ֥י/נִי נָ֛א מְעַט מַ֖יִם מִ/כַּדֵּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/017.yaml
  text: The servant ran to meet her and said[a], “Please let me drink a little water from your jar.”
translation:
  language: ml
  text: 'ദാസൻ അവളെ എതിരേൽക്കാൻ ഓടിച്ചെന്ന് പറഞ്ഞു: “ദയവായി നിന്റെ കുടത്തിൽനിന്ന് കുറച്ചു വെള്ളം എനിക്കു കുടിക്കാൻ തരൂ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ കുടത്തിൽനിന്ന് കുറച്ചു വെള്ളം എനിക്കു കുടിക്കാൻ കൊടുക്കൂ.’ എബ്രായ ആജ്ഞാരൂപം ‘എനിക്കു കുടിക്കാൻ തരൂ’ എന്നും ‘എനിക്കു കുടിക്കാൻ കൊടുക്കൂ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: ഓടിച്ചെന്ന്
  rationale: רוץ എന്ന ക്രിയ ഇവിടെ ഓടുക എന്ന നേരായ അർഥത്തിലാണ്; തുടർച്ചയായ ആഖ്യാനപ്രവർത്തനത്തിന്റെ വേഗവും അടിയന്തരതയും ‘ഓടിച്ചെന്ന്’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הָעֶבֶד
  choice: ദാസൻ
  rationale: עֶבֶד എന്നതിന് ദാസൻ, അടിമ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ അബ്രാഹാമിന്റെ വിശ്വസ്ത പ്രതിനിധിയായി പ്രവർത്തിക്കുന്ന ഗൃഹദാസനെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ സന്ദർഭത്തിന് ‘ദാസൻ’ യോജിക്കുന്നു.
- source_word: לִקְרָאתָהּ
  choice: അവളെ എതിരേൽക്കാൻ
  rationale: לִקְרַאת് എന്ന പ്രയോഗം ഒരാളുടെ അടുത്തേക്ക് ചെന്നു കണ്ടുമുട്ടുക അഥവാ എതിരേൽക്കുക എന്ന ലക്ഷ്യബോധമുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള സംഭാഷണം അവതരിപ്പിക്കുന്ന സാധാരണ എബ്രായ ആഖ്യാനരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ‘പറഞ്ഞു’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: הַגְמִיאִינִי
  choice: എനിക്കു കുടിക്കാൻ തരൂ
  rationale: גמא എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപം ഇവിടെ വെള്ളം കുടിക്കാൻ നൽകുക എന്ന അഭ്യർഥനയാണ്. ‘എനിക്കു കുടിക്കാൻ തരൂ’ എബ്രായ ഘടനയും സ്വാഭാവിക മലയാളപ്രയോഗവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: נָא
  choice: ദയവായി
  rationale: נָא അഭ്യർഥനയെ വിനയപൂർവമാക്കുന്ന നിപാതമാണ്; ആധുനിക മലയാളത്തിൽ ‘ദയവായി’ അതിന്റെ സ്വാഭാവിക തുല്യപ്രയോഗമാണ്.
- source_word: מְעַט מַיִם
  choice: കുറച്ചു വെള്ളം
  rationale: מְעַט അൽപ്പമായ അളവിനെ സൂചിപ്പിക്കുന്നു; അഭ്യർഥനയുടെ മിതത്വം ‘കുറച്ചു വെള്ളം’ നിലനിർത്തുന്നു.
- source_word: מִכַּדֵּךְ
  choice: നിന്റെ കുടത്തിൽനിന്ന്
  rationale: כַּד വെള്ളം കോരാനും കൊണ്ടുപോകാനും ഉപയോഗിക്കുന്ന കുടമോ പാത്രമോ ആണ്. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ‘നിന്റെ’ എന്നു വ്യക്തമായി നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘ദാസൻ’ സന്ദർഭത്തിലെ ഗൃഹസേവകനും വിശ്വസ്ത പ്രതിനിധിയും എന്ന നില മുൻനിർത്തുന്നു; അഭ്യർഥനയുടെ വിനയം ‘ദയവായി’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
