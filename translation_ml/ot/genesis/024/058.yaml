  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרְא֤וּ לְ/רִבְקָה֙ וַ/יֹּאמְר֣וּ אֵלֶ֔י/הָ הֲ/תֵלְכִ֖י עִם הָ/אִ֣ישׁ הַ/זֶּ֑ה וַ/תֹּ֖אמֶר אֵלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/058.yaml
  text: So they called Rebekah and said to her, “Will you go with this man?” And she said, “I will go.”
translation:
  language: ml
  text: അവർ റിബെക്കയെ വിളിച്ച് അവളോട്, “നീ ഈ മനുഷ്യനോടൊപ്പം പോകുമോ?” എന്നു ചോദിച്ചു. അവൾ, “ഞാൻ പോകും” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ לְרִבְקָה
  choice: അവർ റിബെക്കയെ വിളിച്ച്
  rationale: קרא എന്ന ക്രിയ ഇവിടെ ഒരാളെ ചർച്ചയ്ക്കായി വിളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വിളിച്ച്’ എന്നത് സ്വാഭാവികവും മൂലപദത്തോട് അടുത്തതുമാണ്; ‘വരുത്തി’ എന്നത് ആവശ്യത്തിലധികം ബലപ്രയോഗഭാവം നൽകാം.
- source_word: וַיֹּאמְרוּ אֵלֶיהָ
  choice: അവളോട് ... എന്നു ചോദിച്ചു
  rationale: എബ്രായത്തിൽ ‘പറയുക’ എന്ന സാധാരണ ക്രിയയാണെങ്കിലും തുടർന്നുവരുന്നത് നേരിട്ടുള്ള ചോദ്യമായതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നത് കൂടുതൽ സ്വാഭാവികമാണ്; ഉള്ളടക്കത്തിൽ അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: הֲתֵלְכִי
  choice: നീ ... പോകുമോ?
  rationale: הלך എന്ന സാധാരണ ‘പോകുക’ എന്ന ക്രിയയുടെ സ്ത്രീലിംഗ ഏകവചന ചോദ്യരൂപം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു. ‘പോകാൻ സമ്മതമാണോ?’ എന്നു വിവർത്തനം ചെയ്താൽ മൂലത്തിൽ തുറന്നുപറയാത്ത സന്നദ്ധതയുടെ ആശയം കൂടുതൽ വ്യക്തമാക്കപ്പെടും.
- source_word: עִם הָאִישׁ הַזֶּה
  choice: ഈ മനുഷ്യനോടൊപ്പം
  rationale: אִישׁ എന്നത് ഇവിടെ ‘മനുഷ്യൻ/പുരുഷൻ’ എന്നാണ്. പരാമർശിക്കപ്പെടുന്നത് അബ്രാഹാമിന്റെ ദാസനാണെങ്കിലും ഈ വാക്യത്തിൽ ‘ദാസൻ’ എന്ന പദമില്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: וַתֹּאמֶר אֵלֵךְ
  choice: അവൾ, “ഞാൻ പോകും” എന്നു പറഞ്ഞു
  rationale: אֵלֵךְ ഒരു ലളിതമായ ഒന്നാംപുരുഷ പ്രഖ്യാപനമാണ്. ‘ഞാൻ പോകും’ എന്നത് അതിന്റെ ഉറച്ചതും ലളിതവുമായ അർഥം നിലനിർത്തുന്നു; ‘പോകാൻ എനിക്ക് സമ്മതമാണ്’ എന്നത് വ്യാഖ്യാനാത്മകമായിരിക്കും.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. സംഭാഷണം സ്വാഭാവികമാക്കാൻ ആദ്യത്തെ וַיֹּאמְרוּ ചോദ്യസന്ദർഭത്തിൽ ‘ചോദിച്ചു’ എന്നും മറുപടിയിലെ וַתֹּאמֶר ‘പറഞ്ഞു’ എന്നും നൽകിയിരിക്കുന്നു. വ്യക്തിനാമത്തിന് മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ ‘റിബെക്ക’ സ്വീകരിച്ചു.
