base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/001.yaml
  text: Abraham was old[a], advanced in years, and Yahweh had blessed Abraham in all things.
translation:
  language: ml
  text: അബ്രാഹാം വൃദ്ധനും വളരെ പ്രായം ചെന്നവനുമായിരുന്നു[a]; യഹോവ അബ്രാഹാമിനെ സകലത്തിലും അനുഗ്രഹിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ദിവസങ്ങളിൽ വന്നവൻ’; വളരെ പ്രായം ചെന്നിരുന്നു എന്നർഥമുള്ള ഒരു ശൈലി.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: അബ്രാഹാം
  rationale: വാവ് ഇവിടെ പുതിയ വിവരണഘടകത്തെ ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേകമായ ഒരു കാലസൂചകപദം ചേർക്കാതെ വാക്യക്രമംകൊണ്ട് ആ ബന്ധം സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: זָקֵן
  choice: വൃദ്ധനായി
  rationale: അബ്രാഹാമിന്റെ വാർധക്യം നേരിട്ടും മാന്യമായും വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: בָּא בַּ/יָּמִים
  choice: പ്രായം വളരെ ചെന്നിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘ദിവസങ്ങളിലേക്കു വന്നവൻ’ എന്ന എബ്രായ ശൈലി വളരെ പ്രായം ചെന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സമാനമായ സ്വാഭാവിക പ്രയോഗം സ്വീകരിച്ചു.
- source_word: וַֽ/יהוָה
  choice: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוה ഒരു പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: בֵּרַךְ
  choice: അനുഗ്രഹിച്ചിരുന്നു
  rationale: തുടർന്നുള്ള സംഭവങ്ങൾക്ക് പശ്ചാത്തലമായ, അതുവരെ നിലനിന്നിരുന്ന അനുഗ്രഹാവസ്ഥയെ മലയാളത്തിലെ ഭൂതകാലപൂർണരൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בַּ/כֹּל
  choice: സകലത്തിലും
  rationale: അനുഗ്രഹത്തിന്റെ സമഗ്രതയെ സൂചിപ്പിക്കുന്നു; ഭൗതികസമ്പത്തിൽ മാത്രം അർഥം ചുരുക്കാതെ മൂലത്തിലെ വ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ ഉപയോഗിച്ചിരിക്കുന്ന ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയായി പകരാതെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- issue: בַּכֹּל എന്നതിലെ അനുഗ്രഹത്തിന്റെ വ്യാപ്തി
  choice: സകലത്തിലും
  alternative: എല്ലാ വിധത്തിലും
  rationale: മൂലത്തിലെ സമഗ്രത സംരക്ഷിക്കുകയും അനുഗ്രഹം എങ്ങനെ പ്രകടമായി എന്നത് വിശദീകരിക്കാതെ അതിന്റെ സ്വാഭാവികമായ വിശാലത നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് സുതാര്യവുമായ മലയാളം. അടുത്തർഥമുള്ള രണ്ട് വാർധക്യപ്രയോഗങ്ങളും മൂലത്തിലെ ഊന്നൽ അനുസരിച്ച് നിലനിർത്തി; ആവർത്തനഭാരം കുറയ്ക്കാൻ അവയെ സ്വാഭാവിക മലയാളവാക്യമായി ക്രമപ്പെടുത്തി.
