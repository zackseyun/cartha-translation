  terminology: റിബെക്ക, ബെഥൂവേൽ, മിൽക്കാ, നാഹോർ, അബ്രാഹാം എന്നീ പേരുകളുടെ പ്രയോഗം സ്ഥിരവും തിരിച്ചറിയാവുന്നതുമാണ്. ‘കുടം’ כַּד-ന് അനുയോജ്യമായ പൊതുപദമാണ്; ‘തോളിൽ’ עַל שִׁכְמָהּ എന്ന സ്ഥാനബന്ധം കൃത്യമായി നൽകുന്നു.
