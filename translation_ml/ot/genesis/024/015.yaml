  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഹീബ്രുവിലെ വംശാവലി-ബന്ധങ്ങൾ നിലനിർത്തിയെങ്കിലും വായനാസൗകര്യത്തിനായി ദീർഘവാക്യം മൂന്നു വാക്യങ്ങളാക്കി.
