id: GEN.24.15
reference: Genesis 24:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי ה֗וּא טֶרֶם֮ כִּלָּ֣ה לְ/דַבֵּר֒ וְ/הִנֵּ֧ה רִבְקָ֣ה יֹצֵ֗את אֲשֶׁ֤ר יֻלְּדָה֙ לִ/בְתוּאֵ֣ל בֶּן מִלְכָּ֔ה אֵ֥שֶׁת נָח֖וֹר אֲחִ֣י אַבְרָהָ֑ם וְ/כַדָּ֖/הּ עַל שִׁכְמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/015.yaml
  text: And it happened[a], before he had finished speaking, that behold, Rebekah was coming out—she who had been born to Bethuel son of Milcah, the wife of Nahor[b], Abraham’s brother—with her jar on her shoulder.
translation:
  language: ml
  text: അവൻ സംസാരിച്ചു തീരുന്നതിനുമുമ്പ്, ഇതാ, റിബെക്ക പുറത്തേക്കു വരുകയായിരുന്നു. അവൾ അബ്രാഹാമിന്റെ സഹോദരനായ നാഹോരിന്റെ ഭാര്യ മിൽക്കയുടെ മകൻ ബെഥൂവേലിനു ജനിച്ചവളായിരുന്നു. അവളുടെ തോളിൽ കുടം ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: '[പ്രത്യേക പദമായി നൽകാതെ ആഖ്യാനക്രമത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി]'
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ പുതിയ സംഭവം അവതരിപ്പിക്കുന്ന വ്യവഹാരധർമ്മം മലയാളത്തിലെ വാക്യക്രമംകൊണ്ട് സ്വാഭാവികമായി പ്രകടമാകുന്നു; ‘സംഭവിച്ചു’ എന്നു ചേർക്കുന്നത് ഇവിടെ ഭാരമുള്ളതാകും.
- source_word: טֶרֶם כִּלָּה לְדַבֵּר
  choice: അവൻ സംസാരിച്ചു തീരുന്നതിനുമുമ്പ്
  rationale: טֶרֶם എന്നതിന്റെ ‘മുമ്പ്’ എന്ന കാലബന്ധവും כִּלָּה എന്നതിന്റെ പൂർത്തീകരണഭാവവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: സംഭവത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു സൂചകത്തിന്റെ സജീവമായ ആഖ്യാനശക്തി നിലനിർത്തുന്നു.
- source_word: יֹצֵאת
  choice: പുറത്തേക്കു വരുകയായിരുന്നു
  rationale: സ്ത്രീലിംഗ ഏകവചന കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തി മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אֲשֶׁר יֻלְּדָה לִבְתוּאֵל
  choice: അവൾ ... ബെഥൂവേലിനു ജനിച്ചവളായിരുന്നു
  rationale: വംശബന്ധം വ്യക്തമാക്കുന്ന നിഷ്ക്രിയ ജനനപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בֶּן מִלְכָּה אֵשֶׁת נָחוֹר אֲחִי אַבְרָהָם
  choice: അബ്രാഹാമിന്റെ സഹോദരനായ നാഹോരിന്റെ ഭാര്യ മിൽക്കയുടെ മകൻ
  rationale: ബെഥൂവേലിന്റെ മാതാപിതാക്കളെയും നാഹോരിന്റെ അബ്രാഹാമുമായുള്ള ബന്ധത്തെയും ഹീബ്രുവിനൊത്ത വിധത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כַּד
  choice: കുടം
  rationale: വെള്ളം കോരാനും കൊണ്ടുപോകാനും ഉപയോഗിക്കുന്ന പാത്രത്തിനുള്ള സ്വാഭാവികവും പൊതുവുമായ മലയാളപദം; ഈ വാക്യത്തിൽ ‘വെള്ളക്കുടം’ എന്നു വിശദീകരിക്കേണ്ടതില്ല.
- source_word: עַל שִׁכְמָהּ
  choice: അവളുടെ തോളിൽ
  rationale: സ്ഥാനബന്ധം ലളിതവും കൃത്യവുമായി നൽകുന്നു.
