  text: Then I bowed down and worshiped Yahweh[a], and I blessed Yahweh, the God of my master Abraham, who led me on the true way to take the daughter of my master's brother for his son.
translation:
  language: ml
  text: അപ്പോൾ ഞാൻ കുനിഞ്ഞ് യഹ്‌വെയെ നമസ്കരിക്കുകയും, എന്റെ യജമാനനായ അബ്രാഹാമിന്റെ ദൈവമായ യഹ്‌വെയെ വാഴ്ത്തുകയും ചെയ്തു; എന്റെ യജമാനന്റെ സഹോദരന്റെ മകളെ അവന്റെ മകനുവേണ്ടി കൊണ്ടുപോകാൻ യഹ്‌വെ എന്നെ സത്യത്തിന്റെ വഴിയിൽ[a] നയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “സത്യത്തിന്റെ വഴിയിൽ.” ഈ പ്രയോഗത്തിന് “വിശ്വസ്തവും ആശ്രയയോഗ്യവുമായ വഴിയിൽ” എന്നും അർഥമാകാം; യഹ്‌വെയുടെ വിശ്വാസയോഗ്യമായ മാർഗനിർദേശമാണ് ഇവിടെ ഊന്നൽ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקֹּד
  choice: ഞാൻ കുനിഞ്ഞ്
  rationale: ശരീരം താഴ്ത്തി വണങ്ങുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മുട്ടുകുത്തിയെന്ന് അതിവ്യക്തമാക്കാതെ ദേഹഭാവം നിലനിർത്തുന്നു.
- source_word: וָאֶשְׁתַּחֲוֶה לַיהוָה
  choice: യഹ്‌വെയെ നമസ്കരിച്ചു
  rationale: ദൈവത്തോടുള്ള ആദരപൂർവമായ സാഷ്ടാംഗവണക്കത്തെയും ആരാധനയെയും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וָאֲבָרֵךְ אֶת יְהוָה
  choice: യഹ്‌വെയെ ഞാൻ വാഴ്ത്തി
  rationale: ദൈവം കർമമായിരിക്കുമ്പോൾ ברך എന്നതിന് സ്തുതിക്കുക, നല്ലതു പറയുക എന്ന അർഥമാണ്; ‘വാഴ്ത്തി’ മലയാളത്തിലെ സ്വാഭാവികമായ തിരുവെഴുത്തുശൈലി നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: എന്റെ യജമാനനായ അബ്രാഹാമിന്റെ ദൈവം
  rationale: אֲדֹנִי ഇവിടെ ദൈവിക സ്ഥാനപ്പേരല്ല, ദാസന്റെ മാനുഷിക മേലധികാരിയായ അബ്രാഹാമിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הִנְחַנִי
  choice: അവിടുന്ന് എന്നെ നയിച്ചു
  rationale: נחה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം വഴികാട്ടുകയോ നയിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ദൈവത്തെ ആദരസൂചക സർവനാമത്തിൽ പരാമർശിക്കുന്നു.
- source_word: בְּדֶרֶךְ אֱמֶת
  choice: വിശ്വസ്തമായ വഴിയിൽ
  rationale: אֱמֶת എന്നതിലെ സത്യം, വിശ്വാസ്യത, ആശ്രയയോഗ്യത എന്നീ ഭാവങ്ങൾ നിലനിർത്തുന്നു; വെറും ദിശാപരമായ ‘ശരിയായ വഴി’ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: לָקַחַת
  choice: കൊണ്ടുപോകാൻ
  rationale: വിവാഹക്രമീകരണത്തിന്റെ സാഹചര്യത്തിൽ വധുവായി കൂട്ടിക്കൊണ്ടുപോകുക എന്ന ഉദ്ദേശ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; വിവാഹം തന്നെ പൂർത്തിയായെന്നു മുൻകൂട്ടി പറയുന്നില്ല.
- source_word: בַּת אֲחִי אֲדֹנִי
  choice: എന്റെ യജമാനന്റെ സഹോദരന്റെ മകൾ
  rationale: എബ്രായത്തിലെ ബന്ധസൂചക ഘടന അതേ വ്യക്തതയോടെ നിലനിർത്തുന്നു.
- source_word: לִבְנוֹ
  choice: അവന്റെ മകനുവേണ്ടി
  rationale: സർവനാമം യജമാനനായ അബ്രാഹാമിലേക്കാണ് മടങ്ങുന്നത്; സന്ദർഭത്തിൽ അർഥം വ്യക്തമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: בְּדֶרֶךְ אֱמֶת എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: വിശ്വസ്തമായ വഴിയിൽ
  alternative: സത്യത്തിന്റെ വഴിയിൽ; ശരിയായ വഴിയിൽ
  rationale: ദൈവത്തിന്റെ മാർഗനിർദേശത്തിന്റെ സത്യസന്ധതയും വിശ്വാസ്യതയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ സംഘർഷം നിലനിർത്തുന്നു; കേവലം ശരിയായ ലക്ഷ്യസ്ഥാനത്തെ മാത്രം ഉദ്ദേശിക്കുന്നതായി ചുരുക്കുന്നില്ല.
