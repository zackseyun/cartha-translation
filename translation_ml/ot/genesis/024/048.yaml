  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു. ബന്ധസൂചക ഘടനയും אֱמֶת എന്ന പദത്തിന്റെ സത്യം/വിശ്വസ്തത എന്ന അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
