source:
  edition: WLC
  text: וְ/אִם לֹ֨א תֹאבֶ֤ה הָֽ/אִשָּׁה֙ לָ/לֶ֣כֶת אַחֲרֶ֔י/ךָ וְ/נִקִּ֕יתָ מִ/שְּׁבֻעָתִ֖/י זֹ֑את רַ֣ק אֶת בְּנִ֔/י לֹ֥א תָשֵׁ֖ב שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/008.yaml
  text: But if the woman is not willing to go after you[a], then you will be free from this oath of mine[b]; only you must not take my son back there.
translation:
  language: ml
  text: 'എന്നാൽ ആ സ്ത്രീ നിന്റെ പിന്നാലെ വരാൻ സമ്മതിക്കുന്നില്ലെങ്കിൽ[a], എന്റെ ഈ ശപഥത്തിൽനിന്ന് നീ വിമുക്തനായിരിക്കും[b]. എന്നാൽ ഒരു കാര്യം മാത്രം: എന്റെ മകനെ അവിടേക്കു തിരികെ കൊണ്ടുപോകരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്നോടൊപ്പം വരാൻ” അല്ലെങ്കിൽ “നിന്നെ അനുഗമിക്കാൻ”; അക്ഷരാർഥം “നിന്റെ പിന്നാലെ പോകാൻ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “എന്റെ ഈ ശപഥത്തിൽനിന്ന് നീ മോചിതനായിരിക്കും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: മുൻനിർദേശത്തോടുള്ള വ്യത്യസ്ത സാധ്യത അവതരിപ്പിക്കുന്ന നിബന്ധനയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֹא תֹאבֶה
  choice: സമ്മതിക്കുന്നില്ലെങ്കിൽ
  rationale: אבה എന്ന ക്രിയയുടെ സമ്മതം/മനസ്സുണ്ടാകുക എന്ന ഇച്ഛാസംബന്ധമായ അർഥം നിലനിർത്തുന്നു; കടുത്ത നിരസനം അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: ഈ ഘട്ടത്തിൽ അവൾ ഇനിയും തിരിച്ചറിയപ്പെട്ട വധുവോ ഭാര്യയോ അല്ലാത്തതിനാൽ 'സ്ത്രീ' യാണ് യോജിച്ചത്.
- source_word: לָלֶכֶת אַחֲרֶיךָ
  choice: നിന്റെ പിന്നാലെ വരാൻ
  rationale: അക്ഷരാർഥമായ 'നിന്റെ പിന്നാലെ പോകുക' എന്ന ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് യാത്രാസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം നൽകുന്നു.
- source_word: וְנִקִּיתָ
  choice: നീ ഒഴിവുള്ളവനായിരിക്കും
  rationale: നിബന്ധന നിറവേറാതിരുന്നാൽ ശപഥബാധ്യതയിൽനിന്ന് വിമുക്തനാകുക എന്ന നിഫാൽ രൂപത്തിന്റെ നിയമപരമായ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: מִשְּׁבֻעָתִי זֹאת
  choice: എന്റെ ഈ ശപഥത്തിൽനിന്ന്
  rationale: ഒന്നാംപുരുഷ ഉടമസ്ഥതയും זֹאת എന്ന നിർദ്ദേശകപദവും രണ്ടും സംരക്ഷിക്കുന്നു.
- source_word: רַק
  choice: എന്നാൽ
  rationale: വിമുക്തിക്ക് ശേഷവും നിലനിൽക്കുന്ന ശക്തമായ നിയന്ത്രണം മലയാളത്തിൽ വ്യത്യസ്ത നിർദേശമായി സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: אֶת־בְּנִי לֹא תָשֵׁב שָׁמָּה
  choice: എന്റെ മകനെ അവിടേക്കു തിരികെ കൊണ്ടുപോകരുത്
  rationale: שוב എന്ന ക്രിയയുടെ കാരണക ഹിഫീൽ അർഥമായ 'തിരികെ കൊണ്ടുപോകുക' എന്നും שָׁמָּה എന്ന 'അവിടേക്ക്' എന്നും കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ശപഥത്തിന്റെ നിയമപരവും ഗൗരവമുള്ളതുമായ ഭാവം നിലനിർത്തിയിരിക്കുന്നു; ഉദ്ധരണി മുൻവാക്യത്തിൽ ആരംഭിച്ചതായി കരുതി അവസാന ഉദ്ധരണിച്ചിഹ്നം നൽകിയിരിക്കുന്നു.
