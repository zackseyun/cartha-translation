  to: ഞാൻ ഏതു യുവതിയോടു, ‘ദയവായി നിന്റെ കുടം താഴ്ത്തൂ; ഞാൻ കുടിക്കട്ടെ’ എന്നു പറയുമ്പോൾ, അവൾ, ‘കുടിച്ചുകൊള്ളുക; നിന്റെ ഒട്ടകങ്ങൾക്കും ഞാൻ വെള്ളം കൊടുക്കാം’ എന്നു പറയുന്നുവോ, അവളായിരിക്കട്ടെ നിന്റെ ദാസനായ യിസ്ഹാക്കിനുവേണ്ടി നീ നിശ്ചയിച്ചവൾ.[a] അവളിലൂടെ[b] നീ എന്റെ യജമാനനോട് അചഞ്ചല സ്നേഹം കാണിച്ചിരിക്കുന്നു എന്നു ഞാൻ അറിയും.
