  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֣ה הַֽ/נַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֨י/הָ֙ הַטִּי נָ֤א כַדֵּ/ךְ֙ וְ/אֶשְׁתֶּ֔ה וְ/אָמְרָ֣ה שְׁתֵ֔ה וְ/גַם גְּמַלֶּ֖י/ךָ אַשְׁקֶ֑ה אֹתָ֤/הּ הֹכַ֨חְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יִצְחָ֔ק וּ/בָ֣/הּ אֵדַ֔ע כִּי עָשִׂ֥יתָ חֶ֖סֶד עִם אֲדֹנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/014.yaml
  text: And let it be that the young woman to whom I say[a], ‘Please lower your jar so that I may drink,’ and who says, ‘Drink, and I will also water your camels’—let her be the one you have appointed for your servant, for Isaac[c][b]. By her I will know that you have shown steadfast love to my master.
translation:
  language: ml
  text: ഞാൻ ഏതു യുവതിയോടു, ‘ദയവായി നിന്റെ കുടം താഴ്ത്തൂ; ഞാൻ കുടിക്കട്ടെ’ എന്നു പറയുമ്പോൾ, അവൾ, ‘കുടിച്ചുകൊള്ളുക; നിന്റെ ഒട്ടകങ്ങൾക്കും ഞാൻ വെള്ളം കൊടുക്കാം’ എന്നു പറയുന്നുവോ, അവളായിരിക്കട്ടെ നിന്റെ ദാസനായ യിസ്ഹാക്കിനുവേണ്ടി നീ നിശ്ചയിച്ചവൾ.[a] അവളിലൂടെ[b] നീ എന്റെ യജമാനനോട് അചഞ്ചല സ്നേഹം കാണിച്ചിരിക്കുന്നു എന്നു ഞാൻ അറിയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു വായന: “നിന്റെ ദാസനുവേണ്ടി, യിസ്ഹാക്കിനുവേണ്ടി.” ഹീബ്രു പദക്രമം ‘നിന്റെ ദാസനായ യിസ്ഹാക്കിനുവേണ്ടി’ എന്നും വായിക്കാം.'
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “ഇതിലൂടെ.” ഹീബ്രുവിൽ അക്ഷരാർഥം “അവളിലൂടെ” എന്നാണ്; യുവതിയെയോ അവൾ നൽകുന്ന അടയാളത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: അവളായിരിക്കട്ടെ
  rationale: പ്രാർഥനയിലെ അഭിലാഷഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി മുഖ്യവാക്യത്തിലെ ‘ആയിരിക്കട്ടെ’ എന്ന പ്രയോഗത്തിൽ ഉൾപ്പെടുത്തി; ഹീബ്രുവിലെ ആരംഭസൂത്രം പ്രത്യേകം ആവർത്തിച്ച് വാക്യം ഭാരമുള്ളതാക്കുന്നില്ല.
- source_word: הַנַּעֲרָ
  choice: യുവതി
  rationale: വിവാഹപ്രായത്തിലുള്ള ചെറുപ്പക്കാരിയായ സ്ത്രീയെ സൂചിപ്പിക്കുന്നു; ‘കന്യക’ എന്ന അധിക അർഥമോ ‘പെൺകുട്ടി’ എന്ന പ്രായസൂചനയോ ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: הַטִּי נָא כַדֵּךְ וְאֶשְׁתֶּה
  choice: ദയവായി നിന്റെ കുടം താഴ്ത്തി എനിക്കു കുടിക്കാൻ തരണമേ
  rationale: നָאയുടെ വിനയപൂർവമായ അപേക്ഷയും കുടം താഴ്ത്തി വെള്ളം നൽകുന്ന പ്രവൃത്തിയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: നിന്റെ ഒട്ടകങ്ങൾക്കും ഞാൻ വെള്ളം കൊടുക്കാം
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘കുടിക്കാൻ കൊടുക്കുക’ എന്ന കാരണാർഥം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֹתָהּ הֹכַחְתָּ
  choice: നീ നിശ്ചയിച്ചവൾ
  rationale: ഈ സാഹചര്യത്തിൽ הוכיח എന്ന ക്രിയയുടെ നിർണയിക്കുക/തിരിച്ചറിയിച്ചുകൊടുക്കുക എന്ന ആശയം നൽകുന്നു; ‘തെളിയിച്ചു’ എന്ന അക്ഷരാർഥം ഇവിടെ തെറ്റിദ്ധരിപ്പിക്കാം.
- source_word: לְעַבְדְּךָ לְיִצְחָק
  choice: നിന്റെ ദാസനായ യിസ്ഹാക്കിനുവേണ്ടി
  rationale: രണ്ടാമത്തെ לְ ഘടകം വ്യക്തീകരണപരമായ സമാനാധികരണമായി വായിക്കുന്ന സ്വാഭാവിക വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു; ഇരട്ട ദാതൃവായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וּבָהּ אֵדַע
  choice: അവളിലൂടെ ഞാൻ അറിയും
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം നേരിട്ട് യുവതിയെ സൂചിപ്പിക്കുന്ന രൂപം സംരക്ഷിക്കുന്നു; സംഭവസൂചനയായ ‘ഇതിലൂടെ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: חֶסֶד
  choice: അചഞ്ചലസ്നേഹം
  rationale: ദയ, വിശ്വസ്തത, ഉറച്ച ബന്ധനിഷ്ഠ എന്നിവ ഉൾക്കൊള്ളുന്ന പദത്തിന്റെ സമൃദ്ധി സംരക്ഷിക്കുന്നു; സാങ്കേതികമായ ഉടമ്പടി-പദാവലി നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- source_word: עִם אֲדֹנִי
  choice: എന്റെ യജമാനനോട്
  rationale: ഹീബ്രുവിലെ ‘കൂടെ’ എന്ന മുൻവ്യയത്തിന് പകരം ‘സ്നേഹം കാണിക്കുക’ എന്ന മലയാള പ്രയോഗത്തോടു ചേരുന്ന ‘-നോട്’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: לְעַבְדְּךָ לְיִצְחָק എന്നതിലെ ‘നിന്റെ ദാസൻ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ‘നിന്റെ ദാസനായ യിസ്ഹാക്ക്’ എന്ന സമാനാധികരണ വായന
  alternative: ‘നിന്റെ ദാസനുവേണ്ടി, യിസ്ഹാക്കിനുവേണ്ടി’—‘ദാസൻ’ പ്രാർഥിക്കുന്ന അബ്രാഹാമിന്റെ ദാസനെ സൂചിപ്പിക്കുന്ന ഇരട്ട ദാതൃവായന
  rationale: ഹീബ്രു രണ്ടു വായനകൾക്കും ഇടനൽകുന്നു. യിസ്ഹാക്കിനെ ‘നിന്റെ ദാസൻ’ എന്നു തിരിച്ചറിയുന്ന വായനയാണ് സന്ദർഭത്തിലും മലയാളത്തിലും കൂടുതൽ സ്വാഭാവികം; മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
- issue: חֶסֶד എന്ന ബന്ധപരമായ പദത്തിന്റെ വിവർത്തനം
  choice: അചഞ്ചലസ്നേഹം
  alternative: ദയ; വിശ്വസ്തസ്നേഹം; ഉടമ്പടിവിശ്വസ്തത
  rationale: ദൈവത്തിന്റെ ദയയും സ്ഥിരമായ ബന്ധനിഷ്ഠയും ഒരുമിച്ച് സൂചിപ്പിക്കുമ്പോഴും ഇവിടെ ‘ഉടമ്പടി’ എന്ന സാങ്കേതിക ആശയം പാഠത്തിൽക്കാൾ കൂടുതലായി നിർവചിക്കുന്നില്ല.
- issue: וּבָהּ എന്നതിലെ സ്ത്രീലിംഗ പ്രത്യയത്തിന്റെ സൂചന
  choice: യുവതിയെ അടയാളത്തിന്റെ മാധ്യമമായി കാണിച്ച് ‘അവളിലൂടെ’
  alternative: മുഴുവൻ സംഭവത്തെ അടയാളമായി കാണിച്ച് ‘ഇതിലൂടെ’
  rationale: വ്യാകരണരൂപം നേരിട്ട് യുവതിയിലേക്ക് ചൂണ്ടുന്നു; എങ്കിലും അർഥപരമായി സംഭവത്തെ മുഴുവനായി സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ആദരവാർന്നതുമായ പ്രാർഥനാഭാഷ ഉപയോഗിച്ചു. ‘യുവതി’, ‘കുടം’, ‘ഒട്ടകങ്ങൾ’, ‘യജമാനൻ’ എന്നീ സാധാരണ പദങ്ങൾ സ്വീകരിച്ചു; അനാവശ്യമായ പുരാതന രൂപങ്ങളും സഭാവിഭാഗ-വിശേഷ പദാവലിയും ഒഴിവാക്കി. ദൈവത്തോടുള്ള ഏകവചന അഭിസംബോധനയായി ‘നീ’ നിലനിർത്തി.
