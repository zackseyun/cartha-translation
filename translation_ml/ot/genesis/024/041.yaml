id: GEN.24.41
reference: Genesis 24:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָ֤ז תִּנָּקֶה֙ מֵ/אָ֣לָתִ֔/י כִּ֥י תָב֖וֹא אֶל מִשְׁפַּחְתִּ֑/י וְ/אִם לֹ֤א יִתְּנוּ֙ לָ֔/ךְ וְ/הָיִ֥יתָ נָקִ֖י מֵ/אָלָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/041.yaml
  text: Then you will be free from my oath when you come to my family; and if they do not give to you[a], you will be free from my oath.
translation:
  language: ml
  text: അപ്പോൾ, നീ എന്റെ കുടുംബക്കാരുടെ അടുക്കൽ ചെല്ലുമ്പോൾ എന്റെ ശപഥത്തിൽനിന്ന്[a] മോചിതനാകും; അവർ നിനക്കു നൽകുന്നില്ലെങ്കിൽ, നീ എന്റെ ശപഥത്തിൽനിന്ന് മോചിതനായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ ശാപത്തിൽനിന്ന്’; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ശാപമോ ശിക്ഷാനിബന്ധനയോ ഉൾക്കൊള്ളുന്ന ഒരു ശപഥത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּנָּקֶה / נָקִי
  choice: മോചിതനാകും / മോചിതനായിരിക്കും
  rationale: നקה എന്ന പദത്തിന്റെ നിഫാൽ രൂപവും നָקִי എന്ന വിശേഷണവും ഇവിടെ ധാർമിക നിരപരാധിത്വത്തെയല്ല, ശപഥം ചുമത്തുന്ന ബാധ്യതയിൽനിന്നുള്ള വിടുതലിനെയാണ് സൂചിപ്പിക്കുന്നത്. ആവർത്തനത്തിന്റെ സമാന്തരത നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളരൂപങ്ങൾ ഉപയോഗിച്ചു.
- source_word: מֵאָלָתִי
  choice: എന്റെ ശപഥത്തിൽനിന്ന്
  rationale: אָלָה എന്നത് ശാപമോ ശിക്ഷാനിബന്ധനയോ ഉൾക്കൊള്ളുന്ന ശപഥത്തെ സൂചിപ്പിക്കാം. ഈ സന്ദർഭത്തിൽ അബ്രാഹാം ദാസന്റെമേൽ ചുമത്തിയ ശപഥബാധ്യതയാണ് പ്രധാനം; അതിനാൽ മുഖ്യപാഠത്തിൽ ‘ശപഥം’ സ്വീകരിച്ചു, ‘ശാപം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: כִּי
  choice: ചെല്ലുമ്പോൾ
  rationale: ഇവിടെ כִּי വിടുതൽ പ്രാബല്യത്തിൽ വരുന്ന കാലപരവും വ്യവസ്ഥാപരവുമായ സാഹചര്യം അവതരിപ്പിക്കുന്നു. ‘ചെല്ലുമ്പോൾ’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תָבֹא אֶל מִשְׁפַּחְתִּי
  choice: നീ എന്റെ കുടുംബക്കാരുടെ അടുക്കൽ ചെല്ലുമ്പോൾ
  rationale: מִשְׁפָּחָה അടുത്ത ബന്ധുക്കളെക്കാൾ വിശാലമായ കുടുംബവൃന്ദത്തെയോ കുലബന്ധുക്കളെയോ സൂചിപ്പിക്കുന്നു. ‘കുടുംബക്കാർ’ ആ പരിധി സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְאִם לֹא יִתְּנוּ לָךְ
  choice: അവർ നിനക്കു നൽകുന്നില്ലെങ്കിൽ
  rationale: എബ്രായപാഠത്തിൽ നൽകപ്പെടുന്ന വസ്തു വ്യക്തമാക്കിയിട്ടില്ല; സന്ദർഭത്തിൽ വധുവിനെയാണ് ഉദ്ദേശിക്കുന്നത്. മലയാളത്തിൽ കർമം പറയാതെയും വാക്യം സ്വാഭാവികമായി നിലനിൽക്കുന്നതിനാൽ ഉറവിടത്തിലെ അന്തർലീനത സംരക്ഷിച്ചു.
theological_decisions:
- issue: ശപഥസന്ദർഭത്തിൽ אָלָה എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ശപഥം
  alternative: ശാപം
  rationale: പദത്തിൽ ശപഥത്തോടൊപ്പമുള്ള ശാപമോ ശിക്ഷാനിബന്ധനയോ ഉൾപ്പെട്ടേക്കാമെങ്കിലും, ഈ കഥാസന്ദർഭത്തിന്റെ ഊന്നൽ ദാസനെ ബന്ധിച്ചിരുന്ന ശപഥബാധ്യതയിൽനിന്നുള്ള വിടുതലിലാണ്. ‘ശപഥം’ ആ നിയമപരവും ആഖ്യാനപരവുമായ പ്രാധാന്യം അതിരുകടക്കാതെ പ്രകടിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘മോചിതൻ’, ‘ശപഥം’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിയമപരമായ ഗൗരവം നിലനിർത്തുന്നു. ഉറവിടത്തിൽ വ്യക്തമല്ലാത്ത കർമം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
