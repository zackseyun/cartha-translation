id: GEN.24.9
reference: Genesis 24:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם הָ/עֶ֨בֶד֙ אֶת יָד֔/וֹ תַּ֛חַת יֶ֥רֶךְ אַבְרָהָ֖ם אֲדֹנָ֑י/ו וַ/יִּשָּׁ֣בַֽע ל֔/וֹ עַל הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/009.yaml
  text: So the servant put his hand under the thigh of Abraham his master and swore to him concerning this matter[a].
translation:
  language: ml
  text: അങ്ങനെ ദാസൻ തന്റെ യജമാനനായ അബ്രാഹാമിന്റെ തുടയുടെ കീഴിൽ തന്റെ കൈവെച്ച് ഈ കാര്യത്തെക്കുറിച്ച് അദ്ദേഹത്തോടു ശപഥം ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തുടയുടെ കീഴിൽ’ എന്നത് ഗൗരവമേറിയ ശപഥത്തിനുള്ള ഒരു ആംഗ്യത്തെ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥ പരിഭാഷയാണ്. ഇത് അരയോടോ ഉടമ്പടിവംശത്തോടോ പ്രതീകാത്മകമായി ബന്ധപ്പെട്ടിരുന്നതായി ചിലർ മനസ്സിലാക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֶבֶד
  choice: ദാസൻ
  rationale: עֶבֶד എന്നതിന് ‘ദാസൻ’ എന്നും ‘അടിമ’ എന്നും അർഥമാകാം. ഇവിടെ അബ്രാഹാമിന്റെ ഭവനത്തിലെ ചുമതലയുള്ള സേവകന്റെ പങ്കാണ് മുൻനിരയിൽ; അതിനാൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സാമൂഹിക അധീനത സൂചിപ്പിക്കുന്നതുമായ ‘ദാസൻ’ തിരഞ്ഞെടുത്തു.
- source_word: וַיָּשֶׂם ... אֶת יָדוֹ
  choice: കൈവെച്ച്
  rationale: שׂוּם എന്നത് ‘വയ്ക്കുക/സ്ഥാപിക്കുക’ എന്നാണ്. മലയാളത്തിലെ ‘കൈവെച്ച്’ ഭൗതിക പ്രവൃത്തിയെ വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: תַּחַת יֶרֶךְ
  choice: തുടയ്ക്കടിയിൽ
  rationale: יָרֵךְ എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘തുട’ എന്നാണ്. പ്രതിജ്ഞാചടങ്ങിന്റെ പ്രതീകാർഥം മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിക്കാതെ മൂലത്തിലെ ദൃശ്യമായ പ്രയോഗം നിലനിർത്തി.
- source_word: אַבְרָהָם אֲדֹנָיו
  choice: തന്റെ യജമാനനായ അബ്രാഹാമിന്റെ
  rationale: മനുഷ്യബന്ധത്തിലെ אֲדוֹן അധികാരമുള്ള ഗൃഹനാഥനെ സൂചിപ്പിക്കുന്നു. ‘യജമാനൻ’ ഈ ബന്ധം വ്യക്തമായി നൽകുകയും ദൈവികമായ ‘കർത്താവ്’ എന്ന പ്രയോഗവുമായി ആശയക്കുഴപ്പം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: അദ്ദേഹത്തോടു സത്യംചെയ്തു
  rationale: നിഫാൽ രൂപത്തിലുള്ള שׁבע ‘സത്യം ചെയ്യുക/ശപഥം ചെയ്യുക’ എന്നാണ്; לוֹ സൂചിപ്പിക്കുന്ന വ്യക്തിഗത ദിശ ‘അദ്ദേഹത്തോടു’ എന്നതിലൂടെ നിലനിർത്തി.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: ഈ കാര്യത്തെക്കുറിച്ച്
  rationale: דָּבָר എന്നതിന് ‘വാക്ക്, കാര്യം, സംഗതി’ തുടങ്ങിയ അർഥങ്ങളുണ്ട്. ഇവിടെ അബ്രാഹാം നൽകിയ നിർദിഷ്ട നിർദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘ഈ കാര്യത്തെക്കുറിച്ച്’ സന്ദർഭോചിതമാണ്.
theological_decisions:
- issue: പ്രതിജ്ഞാചടങ്ങിലെ ശരീരഭാവം അക്ഷരാർഥത്തിൽ നൽകണോ അതിന്റെ പ്രതീകം വ്യാഖ്യാനിക്കണോ
  choice: ‘തുടയ്ക്കടിയിൽ’ എന്ന് അക്ഷരാർഥത്തിൽ പരിഭാഷപ്പെടുത്തി പ്രതീകസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ജനനേന്ദ്രിയങ്ങൾ, അരക്കെട്ട്, അല്ലെങ്കിൽ ഉടമ്പടിവംശം എന്നിവയുമായി ബന്ധമുള്ള ഭാവമായി വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: എബ്രായപാഠം പ്രവൃത്തി വിവരിക്കുന്നുവെങ്കിലും അതിന്റെ പ്രതീകാർഥം വിശദീകരിക്കുന്നില്ല. അക്ഷരാർഥം നിലനിർത്തുന്നത് യഥാർഥമായ അവ്യക്തത സംരക്ഷിക്കുകയും ഒരു പ്രത്യേക വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അദ്ദേഹത്തോടു’ എന്നത് അബ്രാഹാമിനെ ആദരസൂചകമായി പരാമർശിക്കുമ്പോൾ, ‘യജമാനൻ/ദാസൻ’ സാമൂഹികബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
