revisions:
- from: അങ്ങനെ ദാസൻ തന്റെ യജമാനനായ അബ്രാഹാമിന്റെ തുടയ്ക്കടിയിൽ കൈവെച്ച് ഈ കാര്യത്തെക്കുറിച്ച് അദ്ദേഹത്തോടു സത്യംചെയ്തു.[a]
  to: അങ്ങനെ ദാസൻ തന്റെ യജമാനനായ അബ്രാഹാമിന്റെ തുടയുടെ കീഴിൽ തന്റെ കൈവെച്ച് ഈ കാര്യത്തെക്കുറിച്ച് അദ്ദേഹത്തോടു ശപഥം ചെയ്തു.[a]
  rationale: The revision makes the physical oath gesture more explicit, uses a Malayalam term unambiguously denoting a formal oath, and lightly refines the cultural note while preserving the source text’s and the tradition’s unresolved symbolism.
