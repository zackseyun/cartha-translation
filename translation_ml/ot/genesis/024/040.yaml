source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑/י יְהוָ֞ה אֲשֶׁר הִתְהַלַּ֣כְתִּי לְ/פָנָ֗י/ו יִשְׁלַ֨ח מַלְאָכ֤/וֹ אִתָּ/ךְ֙ וְ/הִצְלִ֣יחַ דַּרְכֶּ֔/ךָ וְ/לָקַחְתָּ֤ אִשָּׁה֙ לִ/בְנִ֔/י מִ/מִּשְׁפַּחְתִּ֖/י וּ/מִ/בֵּ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/040.yaml
  text: And he said to me[a], ‘Yahweh, before whom I have walked, will send his angel with you and make your journey successful[b], and you will take a wife for my son from my clan and from my father’s house.’
translation:
  language: ml
  text: 'അവൻ എന്നോടു പറഞ്ഞു: “ഞാൻ ആരുടെ സന്നിധിയിൽ നടന്നിട്ടുണ്ടോ ആ യാഹ്‌വെ തന്റെ ദൂതനെ നിന്നോടുകൂടെ അയയ്ക്കുകയും നിന്റെ യാത്ര വിജയകരമാക്കുകയും ചെയ്യും[a]. നീ എന്റെ മകനുവേണ്ടി എന്റെ കുലത്തിൽനിന്നും[b] എന്റെ പിതാവിന്റെ ഭവനത്തിൽനിന്നും ഒരു ഭാര്യയെ എടുക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “നിന്റെ വഴി വിജയിപ്പിക്കും.”
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “എന്റെ കുടുംബത്തിൽനിന്നും”; എബ്രായപദം വിശാലമായ ബന്ധുസമൂഹത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הִתְהַלַּכְתִּי לְפָנָיו
  choice: ഞാൻ ആരുടെ സന്നിധിയിൽ നടന്നുവോ
  rationale: ദൈവസന്നിധിയിൽ ജീവിക്കുകയും പെരുമാറുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിസംബന്ധമായ ‘നടക്കുക’ എന്ന രൂപകം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: מַלְאָכוֹ
  choice: തന്റെ ദൂതനെ
  rationale: מַלְאָךְ എന്ന പദത്തിന് ‘ദൂതൻ/സന്ദേശവാഹകൻ’ എന്ന അർഥമുണ്ട്; ഇവിടെ യാഹ്‌വെ അയയ്ക്കുന്ന സ്വർഗീയ ദൂതനെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: אִתָּךְ
  choice: നിന്നോടുകൂടെ
  rationale: സഹഗമനം നേരായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: וְהִצְלִיחַ דַּרְכֶּךָ
  choice: നിന്റെ യാത്ര വിജയകരമാക്കും
  rationale: צלח എന്ന ക്രിയയുടെ കാരണാർഥവും דֶּרֶךְ എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ ‘യാത്ര/ദൗത്യം’ എന്ന ആശയവും വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְלָקַחְתָּ אִשָּׁה
  choice: ഒരു ഭാര്യയെ എടുക്കും
  rationale: വിവാഹത്തിനായി സ്ത്രീയെ ഭാര്യയായി സ്വീകരിക്കുക എന്ന എബ്രായ വിവാഹപ്രയോഗത്തിന്റെ രൂപം മാന്യമായ ബൈബിൾ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: לִבְנִי
  choice: എന്റെ മകനുവേണ്ടി
  rationale: בֵּן എന്ന പദത്തിന്റെ ലിംഗനിർദിഷ്ടമായ ‘മകൻ’ എന്ന അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: מִמִּשְׁפַּחְתִּי
  choice: എന്റെ കുലത്തിൽനിന്നും
  rationale: מִשְׁפָּחָה അടുത്ത കുടുംബത്തെക്കാൾ വിശാലമായ ബന്ധുസമൂഹത്തെയും സൂചിപ്പിക്കാം; ‘കുലം’ ആ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: וּמִבֵּית אָבִי
  choice: എന്റെ പിതൃഭവനത്തിൽനിന്നും
  rationale: בֵּית אָב എന്നത് പിതൃവംശീയ കുടുംബഗൃഹത്തെയോ കുടുംബശാഖയെയോ സൂചിപ്പിക്കുന്നതിനാൽ, ‘പിതൃഭവനം’ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ തുല്യപ്രയോഗമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: വ്യക്തിനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മൂലപാഠത്തിലെ ദൈവനാമം തുറന്നുകാട്ടുന്നു; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ പകരപ്രയോഗം നിർബന്ധിക്കുന്നില്ല.
- issue: ‘അവന്റെ സന്നിധിയിൽ ഞാൻ നടന്നു’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: സന്നിധിയിൽ നടന്നു എന്ന ഉടമ്പടിരൂപകം നിലനിർത്തുക
  alternative: വിശ്വസ്തനായി ജീവിച്ചു; അവന്റെ സാന്നിധ്യത്തിൽ ജീവിച്ചു
  rationale: ഈ പ്രയോഗം ദൈവത്തോടുള്ള ഉത്തരവാദിത്വബന്ധത്തിൽ അബ്രാഹാം നയിച്ച ജീവിതത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ‘വിശ്വസ്തനായി’ എന്നു ചേർത്ത് മൂലപാഠത്തേക്കാൾ നിർവചിതമായ വിലയിരുത്തൽ നൽകുന്നില്ല.
- issue: מַלְאָכוֹ എന്നതിലെ ദൂതന്റെ സ്വഭാവം
  choice: തന്റെ ദൂതൻ
  alternative: തന്റെ സന്ദേശവാഹകൻ
  rationale: സന്ദർഭം ദൈവം അയയ്ക്കുന്ന സ്വർഗീയ സഹായിയെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ദൂതന്റെ വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള അധിക ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ വാക്യത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി. ‘സന്നിധിയിൽ നടന്നു’, ‘ദൂതൻ’, ‘പിതൃഭവനം’ എന്നീ ബൈബിൾസാന്ദ്രമായ പ്രയോഗങ്ങൾ അർഥവ്യക്തത നഷ്ടപ്പെടാതെ നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് പാളിയിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവയുടെ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, മൂലപാഠസാക്ഷ്യവും അടിക്കുറിപ്പുകളുടെ യഥാർഥ വിഷയവും അനുസരിച്ച് [a] വിജയകരമായ യാത്രയ്ക്കും [b] കുലത്തിനും ചേർത്തു.
