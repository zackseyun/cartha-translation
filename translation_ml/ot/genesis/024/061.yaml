source:
  edition: WLC
  text: וַ/תָּ֨קָם רִבְקָ֜ה וְ/נַעֲרֹתֶ֗י/הָ וַ/תִּרְכַּ֨בְנָה֙ עַל הַ/גְּמַלִּ֔ים וַ/תֵּלַ֖כְנָה אַחֲרֵ֣י הָ/אִ֑ישׁ וַ/יִּקַּ֥ח הָ/עֶ֛בֶד אֶת רִבְקָ֖ה וַ/יֵּלַֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/061.yaml
  text: Then Rebekah and her young women arose[a], mounted the camels, and went after the man. And the servant took Rebekah and went on his way.
translation:
  language: ml
  text: അപ്പോൾ റിബെക്കയും അവളുടെ യുവതിമാരും[a] എഴുന്നേറ്റ് ഒട്ടകപ്പുറത്ത് കയറി ആ മനുഷ്യന്റെ പിന്നാലെ പോയി. ദാസൻ റിബെക്കയെ കൂട്ടിക്കൊണ്ട് പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവളുടെ പരിചാരികമാരായ യുവതികൾ.’ എബ്രായപദം യുവതികളെ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ അവർ റിബെക്കയുടെ വനിതാ പരിചാരികമാരായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ എഴുന്നേൽക്കുക എന്നത് നിലനിർത്തുകയും തുടർന്നുള്ള യാത്രാക്രിയകളുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: נַעֲרֹתֶיהָ
  choice: അവളുടെ യുവതികൾ
  rationale: നַעֲרָה എന്ന പദത്തിന്റെ പ്രാഥമിക സൂചന യുവതികളിലേക്കാണ്; സന്ദർഭത്തിൽ അവർ റിബെക്കയുടെ പരിചാരികമാരായിരിക്കാമെങ്കിലും ദാസ്യസ്ഥാനം മൂലപദത്തിൽ വ്യക്തമായി പറഞ്ഞിട്ടില്ല.
- source_word: וַתִּרְכַּבְנָה עַל הַגְּמַלִּים
  choice: ഒട്ടകങ്ങളിൽ കയറി
  rationale: רכב עם עַל ഇവിടെ യാത്രയ്ക്കായി ഒട്ടകപ്പുറത്ത് കയറുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ആ ആരംഭപ്രവൃത്തി ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אַחֲרֵי הָאִישׁ
  choice: ആ മനുഷ്യന്റെ പിന്നാലെ
  rationale: אַחֲרֵי എന്നതിന്റെ ‘പിന്നാലെ/പിറകെ’ എന്ന അർഥവും הָאִישׁ എന്നതിലെ ‘ആ മനുഷ്യൻ’ എന്ന വിവരണവും വ്യാഖ്യാനപരമായി ‘ദാസൻ’ എന്നു മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: וַיִּקַּח הָעֶבֶד אֶת רִבְקָה
  choice: ദാസൻ റിബെക്കയെ കൂട്ടിക്കൊണ്ട്
  rationale: לקח എന്ന ‘എടുക്കുക/കൊണ്ടുപോകുക’ എന്ന ക്രിയ യാത്രാസന്ദർഭത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘കൂട്ടിക്കൊണ്ട്’ എന്നു നൽകിയിരിക്കുന്നു; הָעֶבֶד എന്നത് ഇവിടെ അബ്രാഹാമിന്റെ വിശ്വസ്ത ഗൃഹകാര്യസ്ഥനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദാസൻ’ അനുയോജ്യം.
- source_word: וַיֵּלַךְ
  choice: പോയി
  rationale: הלך എന്ന ലളിതമായ സഞ്ചാരക്രിയയെ അധിക ആശയം ചേർക്കാതെ ‘പോയി’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. എബ്രായ ആഖ്യാനത്തിലെ ക്രമാനുസൃത ബന്ധം ‘അപ്പോൾ’ എന്നും തുടർന്നുള്ള ലളിതക്രിയാശൃംഖലയിലൂടെയും പ്രകടമാക്കി; സന്ദർഭം അനുവദിക്കുന്നതിലധികം സേവകസ്ഥാനം നിർവചിച്ചിട്ടില്ല.
