id: GEN.24.31
reference: Genesis 24:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בּ֖וֹא בְּר֣וּךְ יְהוָ֑ה לָ֤/מָּה תַעֲמֹד֙ בַּ/ח֔וּץ וְ/אָנֹכִי֙ פִּנִּ֣יתִי הַ/בַּ֔יִת וּ/מָק֖וֹם לַ/גְּמַלִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/031.yaml
  text: And he said[a], “Come in, blessed of Yahweh. Why do you stand outside? I have prepared the house, and a place for the camels.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “യഹ്‌വേയാൽ അനുഗ്രഹിക്കപ്പെട്ടവനേ,[a] അകത്തേക്കു വരൂ. എന്തിനാണ് പുറത്തു നിൽക്കുന്നത്? ഞാൻ വീടും ഒട്ടകങ്ങൾക്കുള്ള സ്ഥലവും ഒരുക്കിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യഹ്‌വേയുടെ അനുഗൃഹീതനേ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനശൈലി നിലനിർത്തുന്നു.
- source_word: בּוֹא
  choice: അകത്തേക്കു വരൂ
  rationale: അതിഥിസൽക്കാരത്തിന്റെ ഈ സന്ദർഭത്തിൽ കല്പനയുടെ ലക്ഷ്യം വീട്ടിലേക്കുള്ള പ്രവേശനമാണ്; മലയാളത്തിൽ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּרוּךְ יְהוָה
  choice: യഹ്‌വേയാൽ അനുഗ്രഹിക്കപ്പെട്ടവനേ
  rationale: നിഷ്ക്രിയ കൃദന്തരൂപം ഇവിടെ സംബോധനയായി പ്രവർത്തിക്കുന്നു. അനുഗ്രഹത്തിന്റെ കർത്താവായി യഹ്‌വേയെ വായിക്കുന്ന സ്വാഭാവിക സാധ്യത പ്രധാന പാഠത്തിൽ നൽകുന്നു; ബന്ധസൂചനയിലെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לָמָּה תַעֲמֹד בַּחוּץ
  choice: എന്തിനാണ് പുറത്തു നിൽക്കുന്നത്?
  rationale: നേരിട്ടുള്ള ചോദ്യവും עמד + בחוץ എന്നതിന്റെ നില/സ്ഥല അർഥവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: פִּנִּיתִי
  choice: ഒരുക്കിയിരിക്കുന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാന ആശയം സ്ഥലം ഒഴിച്ചൊരുക്കുക എന്നതാണെങ്കിലും, അതിഥിസൽക്കാരസന്ദർഭത്തിലെ ഫലാർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: הַבַּיִת
  choice: വീട്
  rationale: താമസസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടും സാധാരണവുമായ മലയാളപദം.
- source_word: וּמָקוֹם לַגְּמַלִּים
  choice: ഒട്ടകങ്ങൾക്കുള്ള സ്ഥലവും
  rationale: מָקוֹם എന്നതിന്റെ ലളിതമായ അർഥം നിലനിർത്തി, ഒട്ടകങ്ങളെ പാർപ്പിക്കാനോ കെട്ടാനോ ഉള്ള പ്രത്യേക ക്രമീകരണം പാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, ഒരു പദവികൊണ്ട് പകരാതെ ആ നാമത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: בְּרוּךְ יְהוָה എന്ന സംബോധനയുടെ ബന്ധാർഥം
  choice: യഹ്‌വേയാൽ അനുഗ്രഹിക്കപ്പെട്ടവനേ
  alternative: യഹ്‌വേയുടെ അനുഗൃഹീതനേ
  rationale: ഹീബ്രു ഘടന അനുഗ്രഹത്തിന്റെ കർത്താവിനെയോ അനുഗ്രഹീതന്റെ ബന്ധത്തെയോ സൂചിപ്പിക്കുന്നതായി വായിക്കാം. പ്രധാന പാഠം സ്വാഭാവികമായ നിഷ്ക്രിയ വായന സ്വീകരിക്കുകയും മറ്റൊരു സാധുവായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ അതിഥിസൽക്കാരഭാഷ ഉപയോഗിച്ചു. ‘അകത്തേക്കു വരൂ’ എന്നത് സന്ദർഭത്തിൽ സൂചിതമായ പ്രവേശനം വ്യക്തമാക്കുന്നു; ‘ഒരുക്കിയിരിക്കുന്നു’ എന്നത് സ്ഥലം ഒഴിച്ചൊരുക്കിയെന്ന ക്രിയയുടെ സന്ദർഭാർഥം നൽകുന്നു.
