source:
  edition: WLC
  text: וַ/יְבִאֶ֣/הָ יִצְחָ֗ק הָ/אֹ֨הֱלָ/ה֙ שָׂרָ֣ה אִמּ֔/וֹ וַ/יִּקַּ֧ח אֶת רִבְקָ֛ה וַ/תְּהִי ל֥/וֹ לְ/אִשָּׁ֖ה וַ/יֶּאֱהָבֶ֑/הָ וַ/יִּנָּחֵ֥ם יִצְחָ֖ק אַחֲרֵ֥י אִמּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/067.yaml
  text: And Isaac brought her into the tent of Sarah his mother[a], and he took Rebekah, and she became his wife, and he loved her[b]. So Isaac was comforted after his mother's death.
translation:
  language: ml
  text: യിസ്ഹാക്ക് അവളെ തന്റെ അമ്മയായ സാറായുടെ കൂടാരത്തിനകത്തേക്കു കൊണ്ടുവന്നു[a]. അവൻ റിബെക്കയെ സ്വീകരിച്ചു; അവൾ അവന്റെ ഭാര്യയായി, അവൻ അവളെ സ്നേഹിച്ചു. അങ്ങനെ, തന്റെ അമ്മയുടെ വിയോഗത്തിനുശേഷം[b] യിസ്ഹാക്കിന് ആശ്വാസം ലഭിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ അമ്മ സാറായുടെ കൂടാരത്തിനകത്തേക്കു.’ എബ്രായ പദക്രമം രണ്ടു രീതിയിലും ക്രമീകരിക്കാം; അടിസ്ഥാന അർഥത്തിൽ വ്യത്യാസമില്ല.
    reason: lexical_alternative
  - marker: b
    text: പദശഃ, ‘തന്റെ അമ്മയ്ക്കുശേഷം.’ സന്ദർഭത്തിൽ ഇത് അമ്മയുടെ വിയോഗത്തിനോ മരണത്തിനോ ശേഷമെന്ന അർഥത്തിലാണ്; ‘മരണം’ എന്ന പദം എബ്രായമൂലത്തിൽ നേരിട്ട് ഇല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִאֶהָ
  choice: അവളെ … കൊണ്ടുവന്നു
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപവും സ്ത്രീലിംഗ ഏകവചന കർമപ്രത്യയവും ചേർന്ന് ‘അവളെ വരുത്തി/കൊണ്ടുവന്നു’ എന്നർഥം നൽകുന്നു. സന്ദർഭത്തിൽ ‘കൊണ്ടുവന്നു’ സ്വാഭാവികമാണ്.
- source_word: הָאֹהֱלָה
  choice: കൂടാരത്തിനകത്തേക്കു
  rationale: אֹהֶל എന്ന പദത്തിലെ ദിശാസൂചകമായ ה ചലനം കൂടാരത്തിലേക്കാണെന്ന് സൂചിപ്പിക്കുന്നു; സന്ദർഭം പ്രവേശനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അകത്തേക്കു’ എന്നു വ്യക്തമാക്കി.
- source_word: שָׂרָה אִמּוֹ
  choice: തന്റെ അമ്മയായ സാറായുടെ
  rationale: സാറാ യിസ്ഹാക്കിന്റെ അമ്മയാണെന്ന് സമാനാധികരണഘടന വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ഈ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന ക്രമമാണിത്.
- source_word: וַיִּקַּח אֶת־רִבְקָה
  choice: അവൻ റിബെക്കയെ സ്വീകരിച്ചു
  rationale: לקח എന്നതിന് അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്നർഥമുണ്ടെങ്കിലും വിവാഹസന്ദർഭത്തിൽ ‘സ്വീകരിക്കുക’ സ്വാഭാവികമാണ്. പിന്നാലെയുള്ള ‘അവൾ അവന്റെ ഭാര്യയായി’ എന്ന സ്വതന്ത്ര വാക്യം നിലനിർത്തി, രണ്ട് ഘടകങ്ങളും ഒന്നാക്കി ചുരുക്കിയിട്ടില്ല.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: അവൾ അവന്റെ ഭാര്യയായി
  rationale: היה + ל + אשה എന്ന പ്രയോഗം വിവാഹബന്ധത്തിലേക്കുള്ള പ്രവേശനം സൂചിപ്പിക്കുന്നു; ‘ഭാര്യയായി’ അതിനെ വ്യക്തവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: וַיֶּאֱהָבֶהָ
  choice: അവൻ അവളെ സ്നേഹിച്ചു
  rationale: אהב എന്ന സാധാരണ ‘സ്നേഹിക്കുക’ എന്ന ക്രിയയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: וַיִּנָּחֵם
  choice: ആശ്വാസം ലഭിച്ചു
  rationale: נחם എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ ആശ്വസിപ്പിക്കപ്പെടുക/ആശ്വാസം പ്രാപിക്കുക എന്നർഥത്തിലാണ്; ‘ആശ്വാസം ലഭിച്ചു’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: אַחֲרֵי אִמּוֹ
  choice: അമ്മയുടെ മരണശേഷം
  rationale: പദശഃ ‘അമ്മയ്ക്കുശേഷം’ എന്നാണ്; എന്നാൽ ഉല്പത്തി 23-ലെ സാറായുടെ മരണവും ഈ വാക്യത്തിന്റെ ദുഃഖാശ്വാസസന്ദർഭവും പരിഗണിക്കുമ്പോൾ ഉദ്ദേശ്യം അമ്മയുടെ മരണശേഷമുള്ള കാലമാണ്. ആവശ്യമായ സൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ തുടർച്ചയായ സംഭവക്രമം ചെറുവാക്യങ്ങളും അർധവിരാമവും ഉപയോഗിച്ച് നിലനിർത്തി; അവസാന പ്രയോഗത്തിന്റെ സൂചനാത്മകത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
