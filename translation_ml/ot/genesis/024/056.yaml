id: GEN.24.56
reference: Genesis 24:56
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אַל תְּאַחֲר֣וּ אֹתִ֔/י וַֽ/יהוָ֖ה הִצְלִ֣יחַ דַּרְכִּ֑/י שַׁלְּח֕וּ/נִי וְ/אֵלְכָ֖ה לַֽ/אדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/056.yaml
  text: But he said to them[a], “Do not delay me, since Yahweh has made my journey successful. Send me away so that I may go to my master.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു പറഞ്ഞു: “എന്നെ താമസിപ്പിക്കരുത്. യാഹ്‌വേ എന്റെ യാത്രയെ[a] വിജയിപ്പിച്ചിരിക്കുന്നു. എന്നെ വിട്ടയക്കൂ; ഞാൻ എന്റെ യജമാനന്റെ അടുക്കലേക്കു പോകട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “എന്റെ വഴി”; ഇവിടെ അത് ദാസന്റെ യാത്രയെയോ ദൗത്യത്തെയോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: എന്നാൽ അവൻ അവരോടു പറഞ്ഞു
  rationale: വാവ് ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മുൻസന്ദർഭത്തിലെ താമസിപ്പിക്കാനുള്ള നിർദേശത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘എന്നാൽ’ ഉപയോഗിച്ചു.
- source_word: אַל תְּאַחֲרוּ אֹתִי
  choice: എന്നെ താമസിപ്പിക്കരുത്
  rationale: אַל സഹിതമുള്ള ഹിഫീൽ രൂപം വിലക്കിനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ אחר എന്നത് ഒരാളെ വൈകിപ്പിക്കുക അഥവാ പിടിച്ചുനിർത്തുക എന്ന അർഥത്തിലാണ്.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: הִצְלִיחַ דַּרְכִּי
  choice: എന്റെ യാത്രയെ വിജയിപ്പിച്ചിരിക്കുന്നു
  rationale: צלח-ന്റെ ഹിഫീൽ രൂപം വിജയിപ്പിക്കുക എന്ന ദൈവിക കാരണത്വം പ്രകടമാക്കുന്നു; דֶּרֶךְ അക്ഷരാർഥത്തിൽ ‘വഴി’ ആണെങ്കിലും ഈ സന്ദർഭത്തിൽ ദാസന്റെ യാത്രയെയോ ദൗത്യത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: שַׁלְּחוּנִי
  choice: എന്നെ യാത്രയാക്കൂ
  rationale: പീയേൽ ആജ്ഞാരൂപം പുറപ്പെടാൻ അനുവദിച്ച് പറഞ്ഞയയ്ക്കണമെന്ന അഭ്യർഥനയാണ്; ബഹുവചന അഭിസംബോധന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וְאֵלְכָה
  choice: ഞാൻ ... പോകട്ടെ
  rationale: കോഹോർട്ടേറ്റീവ് രൂപം സംസാരിക്കുന്നവന്റെ ഉദ്ദേശിച്ച തുടർപ്രവൃത്തി പ്രകടമാക്കുന്നു.
- source_word: לַאדֹנִי
  choice: എന്റെ യജമാനന്റെ അടുക്കലേക്കു
  rationale: ഇവിടെ אֲדֹנִי ദൈവിക പദവിയല്ല, ദാസന്റെ മനുഷ്യയജമാനനായ അബ്രാഹാമിനെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ ചതുരക്ഷര നാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പദവിയാക്കി മാറ്റാതെ ‘യാഹ്‌വെ’ എന്ന് ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ദാസന്റെ ഉറച്ച അഭ്യർഥന ലളിതമായ ആജ്ഞാരൂപങ്ങളിലൂടെ നിലനിർത്തി; ദൈവിക വിജയകാരണം വ്യക്തമായി പ്രകടമാക്കി.
