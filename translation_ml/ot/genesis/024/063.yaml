id: GEN.24.63
reference: Genesis 24:63
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצֵ֥א יִצְחָ֛ק לָ/שׂ֥וּחַ בַּ/שָּׂדֶ֖ה לִ/פְנ֣וֹת עָ֑רֶב וַ/יִּשָּׂ֤א עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּ֥ה גְמַלִּ֖ים בָּאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/063.yaml
  text: And Isaac went out to meditate in the field toward evening[a], and he lifted up his eyes and looked, and behold, camels were coming.
translation:
  language: ml
  text: സന്ധ്യയാകാറായപ്പോൾ യിസ്ഹാക്ക് വയലിൽ ധ്യാനിക്കാനായി പുറത്തേക്കു പോയി. അവൻ കണ്ണുകൾ ഉയർത്തി നോക്കി; അതാ, ഒട്ടകങ്ങൾ വരികയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പോയി
  rationale: יצא എന്ന ക്രിയ ഇവിടെ പുറത്തേക്കുള്ള ശാരീരിക നീക്കത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘വയലിലേക്കു പോയി’ എന്നത് ലക്ഷ്യസ്ഥാനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יִצְחָק
  choice: യിസ്ഹാക്ക്
  rationale: ബൈബിൾ മലയാളത്തിലെ പരിചിതമായ പേരുരൂപം ഉപയോഗിച്ചു.
- source_word: לָשׂוּחַ
  choice: ധ്യാനിക്കാനായി
  rationale: അപൂർവവും അർത്ഥവിവാദമുള്ളതുമായ שׂוח എന്ന ക്രിയയ്ക്ക് ഏകാന്തമായ ആലോചന എന്ന സാധ്യതയെ പ്രകടിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം; പ്രാർത്ഥന എന്ന അർത്ഥം അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല. മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בַּשָּׂדֶה
  choice: വയലിലേക്കു
  rationale: שׂדה വയലിനെയോ തുറസ്സായ നാട്ടിൻപ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു. יצא യോടൊപ്പം ലക്ഷ്യദിശ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചിരിക്കുന്നു.
- source_word: לִפְנוֹת עָרֶב
  choice: സന്ധ്യയാകാറായപ്പോൾ
  rationale: ‘സന്ധ്യ തിരിയുന്ന സമയത്ത്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സമയസൂചന സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: അവൻ കണ്ണുയർത്തി നോക്കിയപ്പോൾ
  rationale: കണ്ണുകളുയർത്തുന്നതും തുടർന്ന് കാണുന്നതുമായ എബ്രായ ദൃശ്യബിംബവും ക്രമവും മലയാളത്തിൽ സ്വാഭാവികമായി സംയോജിപ്പിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: പെട്ടെന്ന് ശ്രദ്ധയിൽപ്പെടുന്ന കാഴ്ചയിലേക്കു വായനക്കാരന്റെ ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּהയുടെ ആഖ്യാനചൈതന്യം നിലനിർത്തുന്നു.
- source_word: גְמַלִּים בָּאִים
  choice: ഒട്ടകങ്ങൾ വന്നുകൊണ്ടിരുന്നു
  rationale: בָּאִים എന്ന വർത്തമാന കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന തുടർന്നുകൊണ്ടിരുന്ന സമീപനം മലയാളത്തിലെ പുരോഗമനരൂപത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായ ആഖ്യാനത്തിന്റെ ദൃശ്യചൈതന്യം ‘കണ്ണുയർത്തി,’ ‘അതാ’ എന്നീ പ്രയോഗങ്ങളിലൂടെ നിലനിർത്തി; അപൂർവക്രിയയുടെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
