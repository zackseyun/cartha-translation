revisions:
- from: സന്ധ്യയാകാറായപ്പോൾ യിസ്ഹാക്ക് ധ്യാനിക്കാനായി[a] വയലിലേക്കു പോയി. അവൻ കണ്ണുയർത്തി നോക്കിയപ്പോൾ, അതാ, ഒട്ടകങ്ങൾ വന്നുകൊണ്ടിരുന്നു.
  to: സന്ധ്യയാകാറായപ്പോൾ യിസ്ഹാക്ക് വയലിൽ ധ്യാനിക്കാനായി പുറത്തേക്കു പോയി. അവൻ കണ്ണുകൾ ഉയർത്തി നോക്കി; അതാ, ഒട്ടകങ്ങൾ വരികയായിരുന്നു.
