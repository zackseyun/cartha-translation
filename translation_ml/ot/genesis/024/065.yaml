  yaml_path: translation/ot/genesis/024/065.yaml
  text: And she said to the servant[a], “Who is this man walking in the field to meet us?” And the servant said[c][b], “He is my master.” Then she took the veil and covered herself.
translation:
  language: ml
  text: 'അവൾ ആ ദാസനോടു ചോദിച്ചു: “വയലിൽ നമ്മെ എതിരേൽക്കാൻ നടന്നുവരുന്ന ആ മനുഷ്യൻ ആരാണ്?” ദാസൻ പറഞ്ഞു: “അദ്ദേഹം എന്റെ യജമാനനാണ്.” അപ്പോൾ അവൾ മൂടുപടം എടുത്ത് സ്വയം മൂടി.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മൂടുപടംകൊണ്ട് സ്വയം മറച്ചു.” എബ്രായ ക്രിയ പ്രത്യാവർത്തകമാണ്; അവൾ മൂടുപടംകൊണ്ട് തന്നെ മൂടി എന്നതാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: ദാസൻ
  rationale: עֶבֶד എന്നത് ദാസനെയോ അടിമയെയോ സൂചിപ്പിക്കാം. ഇവിടെ അബ്രാഹാമിന്റെ ഗൃഹത്തിലെ ചുമതലക്കാരനാണ് ഉദ്ദേശ്യം; ആ ബന്ധം സ്വാഭാവികമായി അറിയിക്കാൻ ‘ദാസൻ’ അനുയോജ്യം.
- source_word: הַלָּזֶה
  choice: ആ
  rationale: കാഴ്ചയിൽ അകലെയുള്ള, തിരിച്ചറിയപ്പെടേണ്ട വ്യക്തിയെ ചൂണ്ടിക്കാണിക്കുന്ന സന്ദർഭത്തിൽ മലയാളത്തിലെ ‘ആ’ സ്വാഭാവികമാണ്; എബ്രായ സൂചകപദത്തിന്റെ സ്ഥലസംബന്ധിയായ ഇളവ് ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: הַהֹלֵךְ בַּשָּׂדֶה לִקְרָאתֵנוּ
  choice: വയലിലൂടെ നമ്മെ എതിരേൽക്കാൻ വരുന്ന
  rationale: הלך എന്ന ചലനവും לקראתנו എന്ന ‘നമ്മെ എതിരേൽക്കാൻ’ എന്ന ദിശ/ഉദ്ദേശ്യവും സ്വാഭാവിക മലയാളത്തിൽ ചേർത്തു പറയുന്നു. בַּשָּׂדֶה ഇവിടെ ‘വയലിലൂടെ’ എന്ന് വായിക്കുമ്പോൾ ദൃശ്യത്തിലെ ചലനം വ്യക്തമാണ്.
- source_word: הוּא אֲדֹנִי
  choice: അദ്ദേഹം എന്റെ യജമാനനാണ്
  rationale: אֲדֹנִי ഇവിടെ ദാസന്റെ മനുഷ്യയജമാനനെ സൂചിപ്പിക്കുന്നു; ദൈവിക പദവിയുടെ ധ്വനി ഒഴിവാക്കി സാമൂഹികബന്ധം വ്യക്തമാക്കാൻ ‘യജമാനൻ’ ഉപയോഗിച്ചു.
- source_word: הַצָּעִיף
  choice: മൂടുപടം
  rationale: צעיף സ്ത്രീ ധരിക്കുന്ന മറയെയോ മൂടുപടത്തെയോ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘മൂടുപടം’ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: וַתִּתְכָּס
  choice: സ്വയം മൂടി
  rationale: ക്രിയയുടെ പ്രത്യാവർത്തക അർഥം വ്യക്തമായി നിലനിർത്തുന്നു; മുൻവാക്യത്തിലെ മൂടുപടമാണ് ഉപയോഗിച്ചതെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אֲדֹנִי എന്ന പദത്തിന്റെ അർഥം
  choice: എന്റെ യജമാനൻ
  alternative: എന്റെ നാഥൻ
  rationale: ഇത് ദാസൻ ഇസഹാക്കിനെ തന്റെ മനുഷ്യയജമാനനായി തിരിച്ചറിയുന്നതാണ്; ദൈവിക അഭിസംബോധനയായി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാൻ സാമൂഹിക അർഥം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമായ ഗൗരവമുള്ള മലയാളം. രെബേക്കയുടെ നേരിട്ടുള്ള ചോദ്യം സ്വാഭാവിക സംഭാഷണരീതിയിൽ നൽകി; ദാസൻ–യജമാനൻ ബന്ധം മതപരമായ അധികധ്വനി കൂടാതെ വ്യക്തമാക്കി.
