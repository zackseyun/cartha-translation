  yaml_path: translation/ot/genesis/024/052.yaml
  text: And when Abraham’s servant heard their words[c][b][a], he bowed down to the ground before Yahweh.
translation:
  language: ml
  text: അബ്രാഹാമിന്റെ ദാസൻ അവരുടെ വാക്കുകൾ കേട്ടപ്പോൾ, അവൻ യഹോവയുടെ മുമ്പിൽ നിലംവരെ വണങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവയുടെ മുമ്പിൽ സാഷ്ടാംഗം വീണു.” എബ്രായ ക്രിയയ്ക്ക് ആരാധനാഭാവത്തോടെ വണങ്ങുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: കേട്ടപ്പോൾ
  rationale: എബ്രായ ആഖ്യാനസൂത്രത്തിലെ സംഭവക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി ഉപവാക്യത്തിലൂടെ പ്രകടമാക്കുന്നു; ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്ന അക്ഷരാർഥപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: עֶבֶד אַבְרָהָם
  choice: അബ്രാഹാമിന്റെ ദാസൻ
  rationale: നിർമാണബന്ധം സ്വാഭാവികമായ മലയാള ഉടമസ്ഥഘടനയിൽ നൽകുന്നു; ഇവിടെ കുടുംബപ്രതിനിധിയായുള്ള പങ്കാണ് മുൻനിൽക്കുന്നത്.
- source_word: דִּבְרֵיהֶם
  choice: അവരുടെ വാക്കുകൾ
  rationale: ‘അവർ പറഞ്ഞത്’ എന്നതും സാധ്യമെങ്കിലും, മൂലത്തിലെ ‘വാക്കുകൾ’ എന്ന നാമപ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁתַּחוּ
  choice: കുനിഞ്ഞു
  rationale: ക്രിയ സൂചിപ്പിക്കുന്ന താഴ്ന്ന വണക്കം നിലനിർത്തുന്നു; ‘ആരാധിച്ചു’ എന്നു നൽകി ആരാധനാർഥം മാത്രം നിർബന്ധിക്കുന്നില്ല.
- source_word: אַרְצָה
  choice: നിലംവരെ
  rationale: ദിശാസൂചകമായ രൂപത്തിന്റെ താഴോട്ടുള്ള ശാരീരിക ചലനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയുടെ മുമ്പിൽ
  rationale: വണക്കത്തിന്റെ ലക്ഷ്യവും ഭക്തിപൂർവമായ ഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ സവിശേഷ ദൈവനാമം പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: וַיִּשְׁתַּחוּ എന്ന ക്രിയയെ ‘ആരാധിച്ചു’ എന്നു വ്യക്തമാക്കണമോ
  choice: നിലംവരെ കുനിഞ്ഞു
  alternative: യഹോവയെ ആരാധിച്ചു / സാഷ്ടാംഗം വീണു
  rationale: אַרְצָה ശാരീരിക ഭാവം പ്രത്യേകം വ്യക്തമാക്കുന്നതിനാൽ അതിനെ പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു; ക്രിയയിലെ ആരാധനാത്മക സാധ്യതയെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി അർഥം അതിയായി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘നിലംവരെ കുനിഞ്ഞു’ ശാരീരിക പ്രവൃത്തിയും ഭക്തിപൂർവമായ സന്ദർഭവും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
