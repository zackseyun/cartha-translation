source:
  edition: WLC
  text: וַ/תָּ֨רָץ֙ הַֽ/נַּעֲרָ֔ וַ/תַּגֵּ֖ד לְ/בֵ֣ית אִמָּ֑/הּ כַּ/דְּבָרִ֖ים הָ/אֵֽלֶּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/028.yaml
  text: Then the young woman ran and told her mother's household about these things[a].
translation:
  language: ml
  text: അപ്പോൾ ആ യുവതി ഓടിച്ചെന്ന് ഈ കാര്യങ്ങൾ തന്റെ അമ്മയുടെ വീട്ടുകാരോടു പറഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ അമ്മയുടെ വീട്ടിലേക്ക്.’ എബ്രായ പ്രയോഗം ഭൗതികമായ വീടിനെയോ അമ്മയുമായി ബന്ധപ്പെട്ട വീട്ടുകാരെയോ കുടുംബത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרָץ
  choice: ഓടിച്ചെന്ന്
  rationale: רוץ എന്ന ധാതു വേഗത്തിലുള്ള ഓട്ടത്തെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള അറിയിക്കൽ ലക്ഷ്യമാക്കിയ ചലനം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഓടിച്ചെന്ന്’ എന്നു വരുന്നു.
- source_word: הַנַּעֲרָ
  choice: ആ യുവതി
  rationale: נַעֲרָה ഒരു യുവസ്ത്രീയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ റിബെക്കയെ സംബന്ധിച്ച് ‘യുവതി’ ആധുനികവും മാന്യവും സ്വാഭാവികവുമാണ്.
- source_word: וַתַּגֵּד
  choice: പറഞ്ഞു
  rationale: נגד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് അറിയിക്കുക, പറയുക എന്നർഥം; കഥനത്തിൽ ‘പറഞ്ഞു’ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: לְבֵית אִמָּהּ
  choice: തന്റെ അമ്മയുടെ വീട്ടുകാരോട്
  rationale: בַּיִת ഭൗതികമായ വീടിനെയോ അതുമായി ബന്ധപ്പെട്ട വീട്ടുകാരെയോ കുടുംബത്തെയോ സൂചിപ്പിക്കാം. ഈ സന്ദർഭത്തിൽ അറിയിപ്പ് സ്വീകരിക്കുന്ന ആളുകളെ മുൻനിർത്തി ‘വീട്ടുകാർ’ ഉപയോഗിച്ചെങ്കിലും മൂലത്തിലെ ഇരട്ടസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ഈ കാര്യങ്ങൾ
  rationale: דְּבָרִים എന്നതിന് വാക്കുകൾ, കാര്യങ്ങൾ, സംഭവവിവരങ്ങൾ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ സംഭവിച്ചതിനെ അറിയിക്കുന്നതിനാൽ ‘ഈ കാര്യങ്ങൾ’ സ്വാഭാവികവും വിശ്വസ്തവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘വീട്ടുകാർ’ എന്ന സാധാരണ പ്രയോഗം ഉപയോഗിച്ച് ആശയവിനിമയത്തിന്റെ ലക്ഷ്യമായ ആളുകളെ വ്യക്തമാക്കുന്നു; ‘വീട്/വീട്ടുകാർ’ എന്ന മൂലഭാഷയിലെ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
