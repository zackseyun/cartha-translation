source:
  edition: WLC
  text: וָ/אֹמַ֖ר אֶל אֲדֹנִ֑/י אֻלַ֛י לֹא תֵלֵ֥ךְ הָ/אִשָּׁ֖ה אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/039.yaml
  text: And I said to my master[a], ‘Perhaps the woman will not follow me.’
translation:
  language: ml
  text: 'ഞാൻ എന്റെ യജമാനനോടു പറഞ്ഞു: ‘ഒരുപക്ഷേ ആ സ്ത്രീ എന്റെ പിന്നാലെ വരാതിരുന്നാലോ?’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר
  choice: അപ്പോൾ ഞാൻ … പറഞ്ഞു
  rationale: വയിക്തോൽ രൂപം ഭൂതകാല ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ ക്രമാനുഗതബന്ധം നൽകുന്നു.
- source_word: אֶל אֲדֹנִי
  choice: എന്റെ യജമാനനോടു
  rationale: ഇവിടെ ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയമുള്ള אָדוֹן ദൈവത്തെയല്ല, ദാസന്റെ മനുഷ്യനായ മേലധികാരിയായ അബ്രാഹാമിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘യജമാനൻ’ ആ സാമൂഹികബന്ധം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: אֻלַי
  choice: ഒരുപക്ഷേ
  rationale: ഈ അവ്യയം സാധ്യതയെയോ അനിശ്ചിതത്വത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ഒരുപക്ഷേ’ ആ സൂക്ഷ്മഭാവം മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֹא תֵלֵךְ
  choice: വരാതിരുന്നേക്കാം
  rationale: ഇംപർഫെക്റ്റ് രൂപം ഇവിടെ ഭാവിസാധ്യതയുള്ള നിരാകരണമാണ്. മലയാളത്തിൽ ‘ഒരുപക്ഷേ … വരാതിരുന്നേക്കാം’ എന്നത് അനിശ്ചിതത്വം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: ഹീബ്രു പദത്തിന്റെ അർഥം ഇവിടെ ‘സ്ത്രീ’ എന്നാണ്; സന്ദർഭം ഭാവിവധുവിനെക്കുറിച്ചാണെങ്കിലും ‘ഭാര്യ’ എന്ന ആശയം മുൻകൂട്ടി ചേർത്തിട്ടില്ല.
- source_word: אַחֲרַי
  choice: എന്നോടൊപ്പം
  rationale: הלך + אַחֲרַי അക്ഷരാർഥത്തിൽ ‘എന്റെ പിന്നാലെ പോകുക’ എന്നാണ്. ഈ യാത്രാസന്ദർഭത്തിൽ ലക്ഷ്യഭാഷയിലെ സ്വാഭാവിക അർഥം ‘എന്നോടൊപ്പം വരുക’ എന്നതാണ്; ദാസനെ ശിഷ്യനായി അനുഗമിക്കുക എന്ന തെറ്റായ ധ്വനി ഇതിലൂടെ ഒഴിവാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഉറവിടത്തിലെ അനിശ്ചിതത്വം ‘ഒരുപക്ഷേ … വരാതിരുന്നേക്കാം’ എന്നു നിലനിർത്തി; സന്ദർഭത്തിൽ ഇല്ലാത്ത ‘ഭാര്യ’ എന്ന നിർവചനം ചേർത്തിട്ടില്ല.
