    text: അക്ഷരാർഥത്തിൽ, “അവളുടെ മേൽനിന്ന്.” വിശാലസന്ദർഭം കുടം തോളിലാണ് വഹിച്ചിരുന്നതെന്ന് സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഈ വാക്യത്തിൽ ശരീരഭാഗം വ്യക്തമായി പറയുന്നില്ല.
