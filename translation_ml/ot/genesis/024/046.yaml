  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. സംഭാഷണത്തിൽ ‘അങ്ങയുടെ’ എന്ന ആദരസൂചക രൂപം സ്വീകരിച്ചു. മൂലപാഠത്തിലെ ശരീരഭാഗസംബന്ധമായ അവ്യക്തത വായനാസൗകര്യത്തിനായി മുഖ്യപാഠത്തിൽ സന്ദർഭാനുസൃതമായി പരിഭാഷപ്പെടുത്തി, അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
