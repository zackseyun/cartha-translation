  text: She quickly lowered her jar from her shoulder and said[a], ‘Drink, and I will also give water to your camels.’ So I drank, and she also gave water to the camels.
translation:
  language: ml
  text: അവൾ വേഗം തന്റെ തോളിൽനിന്ന്[a] കുടം ഇറക്കി, “കുടിക്കൂ; അങ്ങയുടെ ഒട്ടകങ്ങൾക്കും ഞാൻ വെള്ളം കൊടുക്കാം,” എന്നു പറഞ്ഞു. അങ്ങനെ ഞാൻ കുടിച്ചു; അവൾ ഒട്ടകങ്ങൾക്കും വെള്ളം കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
