lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: അവൾ വേഗം
  rationale: מהר എന്ന ക്രിയയുടെ വേഗത്തെയും റിബെക്കയുടെ സത്വരപ്രതികരണത്തെയും സ്വാഭാവികമായ മലയാളത്തിൽ ക്രിയാവിശേഷണമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַתּוֹרֶד
  choice: ഇറക്കി
  rationale: Hiphil രൂപം ‘താഴേക്ക് വരുത്തുക’ എന്നർഥം നൽകുന്നു; കുടം ശരീരത്തിൽ വഹിച്ചിരുന്ന സ്ഥാനത്തുനിന്ന് താഴെയിറക്കിയ പ്രവൃത്തിക്ക് ‘ഇറക്കി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: כַּדָּהּ
  choice: കുടം
  rationale: כד വെള്ളം കോരാനും വഹിക്കാനും ഉപയോഗിക്കുന്ന പാത്രമാണ്; ആധുനിക മലയാളത്തിൽ ‘കുടം’ സന്ദർഭോചിതവും സുതാര്യവുമാണ്.
- source_word: מֵעָלֶיהָ
  choice: തന്റെ തോളിൽനിന്ന്[a]
  rationale: ഹീബ്രു പദപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘അവളുടെ മേൽനിന്ന്’ എന്നാണ്; ശരീരഭാഗം വ്യക്തമാക്കുന്നില്ല. എന്നാൽ വിശാലസന്ദർഭവും മലയാളത്തിലെ സ്വാഭാവികതയും പരിഗണിച്ച് ‘തോളിൽനിന്ന്’ എന്നു നൽകി, മൂലത്തിലെ അവ്യക്തത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: שְׁתֵה
  choice: കുടിക്കൂ
  rationale: ഹീബ്രുവിലെ നേരിട്ടുള്ള ആജ്ഞയെ മാന്യവും സാധാരണവുമായ മലയാള ആജ്ഞാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: അങ്ങയുടെ ഒട്ടകങ്ങൾക്കും ഞാൻ വെള്ളം കൊടുക്കാം
  rationale: שקה എന്ന Hiphil ക്രിയയുടെ ‘കുടിക്കാൻ കൊടുക്കുക/വെള്ളം നൽകുക’ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു. ‘അങ്ങയുടെ’ എന്നത് അപരിചിതനായ പ്രായമേറിയ പുരുഷനോടുള്ള മാന്യമായ അഭിസംബോധനയ്ക്ക് യോജിക്കുന്നു.
- source_word: וָאֵשְׁתְּ
  choice: അങ്ങനെ ഞാൻ കുടിച്ചു
  rationale: തുടർന്നുണ്ടായ പ്രതികരണത്തെ സൂചിപ്പിക്കുന്ന കഥാഗതിയെ ‘അങ്ങനെ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְגַם הַגְּמַלִּים הִשְׁקָתָה
  choice: അവൾ ഒട്ടകങ്ങൾക്കും വെള്ളം കൊടുത്തു
  rationale: മുൻവാക്യത്തിലെ ശקה എന്ന ക്രിയയോടുള്ള പദസമന്വയം നിലനിർത്തിക്കൊണ്ട്, ഒട്ടകങ്ങൾക്ക് കുടിക്കാൻ വെള്ളം നൽകിയതായി വ്യക്തമായി പറയുന്നു.
